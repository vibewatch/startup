- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Current revenue is too low
    - Management data shows current revenue materially below about $175M without exceptional margin quality.
    - Even AI-rerated public multiples stop supporting the $3.5B mark.
    - Do not underwrite at the 2024 price.
  - - Debt package proves tighter than bulls assume
    - Credit or lease documents show restrictive covenants, weak collateral headroom, or poor hardware payback.
    - Leverage shifts from bridge capital to equity risk amplifier.
    - Re-cut valuation on lower multiples and demand stronger downside protection.
  - - Next financing resets the mark
    - Any priced equity round occurs at or below the December 2024 valuation.
    - The scarcity-premium narrative would have failed to convert into value accretion.
    - Treat it as a valuation reset, not a temporary optics issue.
  - - GPU utilization or gross margin disappoints
    - Utilization is weak or gross margin by AI workload is materially below expectation.
    - The AI-infrastructure premium loses economic support.
    - Lower bull-case probability and move the name toward avoid.
  - - Sovereign / enterprise pipeline does not convert
    - Public-sector or sovereign demand remains marketing-heavy without real contract evidence.
    - One of the cleaner premium narratives would become largely aspirational.
    - Reduce valuation premium and focus on core-cloud economics only.
  notes: These are price-oriented break conditions, not generic operating risks. Each one would directly change what the current mark is worth to a new investor.
  claimRefs:
  - CV041
  - CV044
  - CV045
  - CV046
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current ARR and revenue bridge
    - Current ARR, billed revenue, recognized revenue, and 2025-2026 growth by workload family.
    - The valuation question is mostly denominator risk.
    - CFO pack, board deck, and auditor-prepared bridge.
  - - Gross margin and utilization
    - Gross margin by GPU cohort, core cloud, and sovereign/public-sector workloads plus hardware utilization and recovery periods.
    - AI-infrastructure premiums only hold if utilization and recovery support durable margins.
    - FP&A review plus infrastructure-operations dashboard.
  - - Debt and lease documents
    - Full credit agreement, lease schedules, covenant definitions, collateral package, pricing grid, and amendment thresholds.
    - Leverage can help or destroy equity value depending on the fine print.
    - Treasury, lender counsel, and financing data room.
  - - Cap table and preferences
    - Latest cap table, share classes, liquidation preferences, anti-dilution terms, and any insider secondary history from the 2024 round.
    - Headline post-money can be misleading if downside protection is aggressive.
    - Lead counsel and finance operations.
  - - Customer quality and concentration
    - Top-customer share, NRR, GRR, public-sector pipeline conversion, and sovereign-cloud contract evidence.
    - Revenue quality determines whether AI and sovereign narratives deserve premium multiples.
    - Revenue-operations analysis and customer reference calls.
  - - Exit readiness
    - Audited financial cadence, governance package, IPO controls readiness, and any strategic buyer map.
    - Without a credible exit path, a full private mark can still be a poor entry for new money.
    - CEO, board materials, and banker diligence.
  notes: Every ask is tied directly to a variable that could move the recommendation, not to generic curiosity about the company.
