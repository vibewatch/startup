- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-useful public cloud and AI-infrastructure references with retained market-cap and revenue evidence; it is not an exhaustive peer set and does not adjust every row to enterprise value.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Vultr (subject)
    - Private valuation vs disclosed and proxy revenue anchors
    - $3.5B mark; ~28x on the 2022 ARR floor; ~7x-35x on Owler's band; ~94x-257x on low-end trackers
    - Shows how sensitive the current mark is to the hidden denominator.
    - Current revenue is not publicly disclosed, so the implied multiple range is unusually wide and partly low-authority.
  - - DigitalOcean
    - June 2026 market cap / FY2025 revenue
    - $18.12B market cap / $901M revenue = ~20.1x
    - Best public middle-case comp for an independent cloud platform with strong AI rerating and real revenue disclosure.
    - Market cap is not enterprise value, and DigitalOcean is public, larger, and more transparent.
  - - Akamai
    - June 2026 market cap / FY2025 revenue
    - $23.31B market cap / $4.208B revenue = ~5.5x
    - Useful mature-cloud discipline anchor with disclosed cloud-infrastructure revenue.
    - Akamai is far more diversified and mature than Vultr.
  - - CoreWeave
    - June 2026 market cap / trailing revenue
    - $60.52B market cap / $6.23B trailing revenue = ~9.7x
    - Best pure-play public AI-infrastructure reference for capital intensity and growth.
    - Public-market liquidity, scale, and disclosure are far ahead of Vultr.
  - - Nebius
    - June 2026 market cap / trailing revenue
    - $63.90B market cap / $877.9M trailing revenue = ~72.8x
    - Shows how aggressively the market can price AI-capacity optionality and future factory build-out.
    - The multiple is extreme and likely embeds optionality, cash, and future capacity not directly comparable to Vultr today.
  - - OVHcloud
    - June 2026 market cap / FY2025 revenue anchor
    - $2.89B market cap against €1.0846B revenue; effectively a low-single-digit mature-cloud valuation anchor
    - Useful downside discipline for a scaled European cloud provider with explicit revenue and EBITDA disclosure.
    - Currency translation and business mix differences limit precision versus Vultr.
  notes: The goal is not to find a perfect peer. It is to bound how much of Vultr's valuation can be explained by ordinary cloud economics versus AI-infrastructure optimism.
