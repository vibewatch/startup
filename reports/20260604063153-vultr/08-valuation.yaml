  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-economics
    missingEvidence: Current 2025-2026 ARR, billed revenue, recognized revenue, and gross margin by workload family.
    whyItMatters: The recommendation is mostly denominator-sensitive; without current revenue and margin, the public mark cannot be underwritten cleanly.
    diligencePath: Request the CFO bridge from 2022 ARR to current ARR and revenue, with gross margin by GPU, core compute, and sovereign/public-sector workloads.
    relatedQuestionRefs:
    - QV035
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: 2024 round share classes, liquidation preferences, participation rights, anti-dilution terms, and any insider secondary sales.
    whyItMatters: Headline post-money valuation can materially overstate the economics available to new money if the preference stack is investor-protective.
    diligencePath: Obtain the latest cap table, financing documents, and board approvals from lead counsel and finance.
    relatedQuestionRefs:
    - QV021
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: The full June 2025 credit agreement and lease documents, including pricing grid, collateral, utilization tests, and amendment thresholds.
    whyItMatters: Leverage can bridge growth or destroy equity value depending on covenant headroom and hardware payback.
    diligencePath: Review the credit agreement, borrowing-base definitions, and lease schedules with treasury and lender counsel.
    relatedQuestionRefs:
    - QV036
  - type: private-evidence-only
    severity: material
    topic: utilization-and-concentration
    missingEvidence: GPU utilization by cohort, procurement payback periods, top-customer concentration, NRR, and sovereign/public-sector pipeline conversion.
    whyItMatters: These metrics determine whether AI-capex intensity converts into durable, high-quality revenue rather than temporary scarcity pricing.
    diligencePath: Request board-level operating dashboards and cohort reports, then validate with customer reference calls.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV004
    - TV006
