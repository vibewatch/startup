- id: SV004
  title: Recommendation, thesis-break triggers, and final diligence asks
  body: 'The public-evidence recommendation is research-more, not because Vultr lacks a real business but because the valuation question is still dominated by hidden variables. The chapter can support a real bull case: the company has institutional financing, visible GPU monetization, a differentiated sovereign-cloud narrative, and vendor relationships that matter in AI infrastructure. The chapter can also support a real caution case: public revenue anchors are stale or low-authority, the 2025 debt package adds leverage sensitivity, and the 2024 preference stack remains private. That mix leads to a medium-confidence judgment, a high risk rating, and a stretched valuation stance. The right practical next step is not to dismiss Vultr or to bless the mark reflexively. It is to demand a short, investor-grade diligence package that resolves the denominator and terms quickly. Current ARR and gross margin by workload, GPU utilization and payback, the full credit and lease documents, the cap table
    and preference stack, and top-customer concentration should all move ahead of any generic product demo. If those asks clear well, Vultr could still be a workable AI-infrastructure investment. If they do not, the thesis should break quickly rather than survive on narrative alone.'
