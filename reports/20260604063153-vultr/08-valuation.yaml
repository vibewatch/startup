company:
  name: Vultr
chapter:
  number: 8
  title: Valuation
  summary: Vultr's $3.5 billion December 2024 valuation is not obviously detached from the AI-infrastructure tape, but public evidence still cannot prove it is attractive. Recent debt financing, visible GPU monetization, and a wide public-comp band explain why investors paid up; the unresolved problem is denominator and terms. Current revenue, gross margin, utilization, debt covenants, and the 2024 preference stack remain private, so the right public-evidence stance is research-more with medium confidence, high risk, and a stretched valuation view.
sections:
- id: SV001
  title: Financing context, denominator risk, and entry discipline
  body: 'Vultr enters valuation work with two unusually strong public financing anchors and one unusually important missing denominator. The strong anchors are easy to state. The company completed its first outside equity round in December 2024 at a $3.5 billion valuation, with independent reporting placing the round size around $333 million, and then added a $329 million credit-plus-lease package in June 2025. Those facts matter because they show both equity and lenders were willing to underwrite Vultr''s AI-infrastructure expansion. The missing denominator is current revenue. The strongest company-published revenue anchor is historical: Constant, Vultr''s parent company, said in March 2022 that it had surpassed $125 million of ARR. Current third-party estimates are so dispersed that they are more useful as a warning than as triangulation. Latka shows $13.6 million, Growjo and CompWorth show $37.2 million, and Owler shows a $100 million to $500 million band. That means entry discipline
    has to work backwards from public comp thresholds: roughly $175 million of current revenue would support the mark at a DigitalOcean-like multiple, but a mature-cloud multiple would require vastly more scale.'
