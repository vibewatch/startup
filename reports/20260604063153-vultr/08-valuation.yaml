- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation logic
  - Indicative value range
  - Probability signal
  - Return vs $3.5B mark
  rows:
  - - Bull
    - 2028 revenue reaches about $550M-$650M; AI utilization is high; sovereign and enterprise demand converts; debt remains comfortably serviceable.
    - Apply roughly 9x-11x revenue, closer to premium AI-infrastructure comps than mature cloud comps.
    - $5.0B-$7.2B
    - '~25%: requires both growth and clean unit economics.'
    - ~1.4x-2.1x
  - - Base
    - 2028 revenue reaches about $400M-$500M; core cloud plus AI growth stays good but not exceptional; debt is manageable and no adverse term surprise appears.
    - Apply roughly 7x-8.5x revenue, a middle ground between AI rerating and mature-cloud discipline.
    - $2.8B-$4.3B
    - '~50%: most consistent with current public evidence.'
    - ~0.8x-1.2x
  - - Bear
    - 2028 revenue reaches only about $300M-$400M; utilization, concentration, or pricing disappoint; leverage sensitivity rises.
    - Apply roughly 5x-6x revenue, nearer mature infrastructure and stressed private-market discipline.
    - $1.5B-$2.4B
    - '~25%: plausible if hidden economics are ordinary or debt terms are tighter than bulls assume.'
    - ~0.4x-0.7x
  - - Probability-weighted
    - Midpoint-weighted output across the three cases.
    - Scenario mix rather than a single precision target.
    - ~$3.4B-$3.8B
    - Central case
    - ~1.0x
  notes: Ranges are illustrative enterprise-value style outputs anchored to public comp bands and explicit revenue assumptions, not management guidance or a DCF.
