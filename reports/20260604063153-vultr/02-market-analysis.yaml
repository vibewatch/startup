tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Independent cloud infrastructure
    - Rented compute, storage, networking, and orchestration from non-hyperscaler providers
    - Broad SaaS and managed platform budgets that ride atop hyperscalers
    - Developers, platform teams, IT, and infrastructure owners
    - Closest base layer for Vultr
  - - Cloud GPU / AI infrastructure services
    - On-demand or reserved accelerated compute for training, fine-tuning, inference, and HPC-style AI workloads
    - On-prem GPU purchases and hardware-only capex that never leaves the buyer’s balance sheet
    - ML platform teams, AI startups, enterprise IT, research groups
    - Critical growth wedge for Vultr
  - - Sovereign or local-residency cloud
    - Cloud deployments where workload location, local operations, and jurisdictional controls influence vendor choice
    - Pure policy consulting or compliance software sold without infrastructure
    - Governments, regulated enterprises, public-sector digital teams
    - Important overlay on Vultr’s regional strategy
  - - Hyperscaler alternatives and status quo
    - Workloads buyers could place on AWS, Azure, Google Cloud, or keep in stitched multi-vendor stacks
    - Unrelated enterprise software categories and generic productivity spend
    - CIO, CTO, platform, procurement, business sponsors
    - Defines substitutes and switching pressure
  - - Excluded outer shell
    - Total public cloud, broad PaaS catalogs, and bundled enterprise cloud ecosystems
    - Narrow Vultr-relevant spend pools cannot be inferred from this shell alone
    - Enterprise-wide cloud budgets
    - Useful only as an upper bound, not as Vultr TAM
  notes: The boundary deliberately narrows from giant-cloud spend toward independent infrastructure, GPU cloud, and sovereignty-sensitive workloads where Vultr’s positioning is strongest.
