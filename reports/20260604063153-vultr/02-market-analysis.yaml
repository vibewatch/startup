- calloutType: insight
  title: The right TAM story is a bounded wedge, not a giant-cloud headline
  body: Vultr participates in a very large cloud economy, but its investable wedge is the much narrower overlap of independent infrastructure, GPU cloud, and sovereignty-sensitive deployment where buyers care about cost, regionality, and open integration.
  claimRefs:
