chapter:
  number: 2
  title: Market Analysis
  summary: 'Vultr’s relevant market is not the entire public-cloud stack; it is the narrower wedge where independent cloud infrastructure, GPU cloud, and sovereignty-sensitive deployment compete against hyperscalers and in-house alternatives. Public sizing evidence is directionally strong but internally inconsistent: total public cloud is enormous, AI infrastructure is surging, and GPUaaS estimates range widely, so the disciplined conclusion is to bound Vultr’s opportunity through multiple shells rather than one inflated TAM.'
sections:
- id: market-boundary
  title: Market boundary and the addressable wedge
  body: 'Vultr should not be underwritten against the entire public-cloud universe simply because it sells compute. Gartner’s $723.4 billion 2025 public-cloud forecast and Synergy’s $390 billion trailing cloud-infrastructure run rate are useful outer shells, but they include broad managed services, general-purpose enterprise cloud budgets, and hyperscaler ecosystems that are not close substitutes for every Vultr deal. The better boundary starts with independent cloud infrastructure: rented compute, GPU, storage, and networking capacity for buyers that want a simpler or cheaper alternative to hyperscalers. From there, the wedge narrows again toward GPU cloud and sovereignty-sensitive workloads, because Vultr’s own and independent materials emphasize 33 regions, cost discipline, composability, and local deployment. That makes sovereign or local cloud an embedded feature of the wedge, not a separate market. The practical comparison set is therefore AWS, Azure, Google Cloud, and status-quo internal
    build or multi-vendor stacks, but only for workloads where regional placement, transparent economics, and open-stack integration matter enough to justify leaving the big-three default.'
