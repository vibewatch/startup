- id: sizing-lenses
  title: Sizing lenses, contradictions, and what can actually be inferred
  body: 'The sizing evidence is strong enough to define scale bands, but not strong enough to pretend Vultr has one clean TAM, SAM, and SOM. The broadest shells are public cloud services and public IaaS, where Gartner’s 2025 numbers land at $723.4 billion and $211.9 billion respectively. Synergy’s cloud-infrastructure lens is narrower and more relevant to rented compute, but still reflects mostly hyperscaler-controlled spend. AI infrastructure and AI-optimized IaaS add a second lens: IDC says 2025 AI infrastructure spending hit $318 billion, while Gartner expects AI-optimized IaaS to reach $37.5 billion in 2026 with inference already taking the majority. Then the market narrows again to GPUaaS, where public estimates diverge sharply. Fortune, Grand View, MarketsandMarkets, and Mordor do not disagree because someone made a simple arithmetic mistake; they disagree because they are measuring different shells around public cloud, private or hybrid deployment, edge capacity, and adjacent AI-infrastructure
    services. That dispersion is analytically useful. It implies Vultr participates in a meaningful market, but the correct underwriting move is to bound the wedge rather than import one giant-cloud TAM. No public source isolates Vultr-specific booked GPU hours, sovereign workload mix, or regional revenue enough to turn the wedge into a precise SAM or SOM.'
