- calloutType: risk
  title: GPU-cloud estimates are directionally useful but not underwriting-grade on their own
  body: Public GPUaaS market estimates differ too much to support a single clean TAM. The disagreement mostly reflects category construction, so a disciplined investor should preserve the range and ask management for actual booked-demand and mix data.
