  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: vultr-sam-som
    missingEvidence: Public sources do not disclose Vultr revenue by product, region, workload type, or sovereign customer segment.
    whyItMatters: Without booked demand or revenue mix, the market analysis can only bound a wedge and cannot produce a disciplined Vultr-specific SAM or SOM.
    diligencePath: Request management revenue mix by compute, GPU, geography, and regulated or sovereign customer segment, plus booked GPU-hour utilization.
    relatedQuestionRefs:
    - QM010
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-mix
    missingEvidence: No retained public source quantifies what share of Vultr demand comes from startups, enterprises, governments, or model builders.
    whyItMatters: Buyer concentration changes both sales efficiency and resilience to hyperscaler retaliation or public-sector budget shifts.
    diligencePath: Ask management for customer count, revenue, and pipeline split by buyer class, region, and regulated versus unregulated workloads.
    relatedQuestionRefs:
    - QM011
    - QM025
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: market-taxonomy
    missingEvidence: Analyst definitions for public cloud, cloud infrastructure, AI infrastructure, AI-optimized IaaS, and GPUaaS are not apples-to-apples.
    whyItMatters: The apparent TAM changes dramatically depending on which shell is used, so valuation work can be distorted by category slippage.
    diligencePath: Standardize one internal taxonomy for Vultr’s served workloads, then map third-party reports into that taxonomy before using them in TAM or share analyses.
    relatedQuestionRefs:
    - QM009
    - QM010
    relatedTableRefs:
    - TM002
