- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Inference overtakes training in AI-optimized IaaS
    - driver
    - current to medium-term
    - Supports vendors that can run always-on, production inference economically across regions
    - Ask management for mix of inference versus training GPU bookings.
  - - Production AI adoption and workflow automation
    - driver
    - current
    - Broadens buyer pool from frontier AI labs to mainstream enterprises and operating teams
    - Ask for customer cohort split by startup, enterprise, and regulated workloads.
  - - Regional presence, edge, and data residency
    - driver
    - current
    - Raises the value of multi-region independent clouds for latency-sensitive or regulated workloads
    - Ask which regions and products generate sovereign or local-residency demand.
  - - Cost pressure versus hyperscalers
    - driver
    - current
    - Creates openings where buyers want GPU access without full hyperscaler lock-in or egress pain
    - Ask for realized price-per-GPU-hour versus named hyperscaler alternatives.
  - - GPU supply, power, and networking bottlenecks
    - constraint
    - current
    - Can cap booked demand even when end-customer demand is strong
    - Ask about supply contracts, reserved capacity, and power-backed expansion plans.
  - - Neocloud consolidation and depreciation risk
    - constraint
    - current to medium-term
    - Could compress the independent-provider field and raise customer concentration or financing risk
    - Ask about contract duration, fleet refresh cadence, and capital access.
  - - CUDA lock-in versus ROCm migration burden
    - constraint
    - current
    - Makes buyer switching harder and limits how quickly multi-vendor GPU strategies become practical
    - Ask what share of workloads run on NVIDIA versus AMD stacks and what migration tools exist.
  - - Hyperscaler breadth and compliance muscle
    - constraint
    - current
    - Big providers can bundle GPUs with broader cloud services and regulatory artifacts
    - Ask which workloads consistently choose Vultr over AWS, Azure, or Google Cloud and why.
  notes: The table ties each driver or constraint to adoption timing and procurement logic rather than treating market growth as a purely abstract narrative.
