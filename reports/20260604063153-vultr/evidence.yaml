evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current official employee count and location mix by function.
    whyItMatters: Headcount is a core scale signal and informs operating leverage, hiring needs, and support capacity.
    diligencePath: Request current org chart, employee count by geography/function, and 12-month hiring/attrition trend.
    relatedQuestionRefs:
      - QO026
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: Full board roster, observer rights, and investor ownership percentages.
    whyItMatters: >-
      Governance concentration and investor control rights matter after the first institutional equity and later debt
      financing.
    diligencePath: Request current cap table, board consent rights, debt covenants, and latest investor rights agreement.
    relatedQuestionRefs:
      - QO006
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, ARR, gross margin, and free-cash-flow disclosure for 2024-2026.
    whyItMatters: Without hard financial data, the financing and valuation story cannot be tied to operating performance.
    diligencePath: Request monthly recurring revenue bridge, annual audited statements, and budget-versus-actual package.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: >-
      A current corporate fact sheet reconciling West Palm Beach press-release datelines with broader distributed
      operations.
    whyItMatters: >-
      Public databases can lag official statements, which can create diligence noise around headquarters and operating
      presence.
    diligencePath: Confirm legal entity HQ, executive office, and tax nexus addresses directly with company counsel.
    relatedQuestionRefs:
      - QO002
  - type: private-evidence-only
    severity: material
    topic: customer-scale
    missingEvidence: Absolute active-customer count, net retention, and revenue concentration by top accounts.
    whyItMatters: Public statements cite broad reach but do not reveal concentration or cohort health.
    diligencePath: Request top-20 customer revenue list, NRR, gross retention, and churn by product line.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: >-
      A complete, dated list of private product launches, customer wins, and region openings not announced in public
      releases.
    whyItMatters: >-
      The milestone table is intentionally public-only, so it may omit internal chronology that explains acceleration
      between financings and region-count changes.
    diligencePath: >-
      Request an internal board-level company timeline with financing, product, hiring, partnership, and region-launch
      dates for 2021-2026.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: vultr-sam-som
    missingEvidence: Public sources do not disclose Vultr revenue by product, region, workload type, or sovereign customer segment.
    whyItMatters: >-
      Without booked demand or revenue mix, the market analysis can only bound a wedge and cannot produce a disciplined
      Vultr-specific SAM or SOM.
    diligencePath: >-
      Request management revenue mix by compute, GPU, geography, and regulated or sovereign customer segment, plus
      booked GPU-hour utilization.
    relatedQuestionRefs:
      - QM010
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-mix
    missingEvidence: >-
      No retained public source quantifies what share of Vultr demand comes from startups, enterprises, governments, or
      model builders.
    whyItMatters: >-
      Buyer concentration changes both sales efficiency and resilience to hyperscaler retaliation or public-sector
      budget shifts.
    diligencePath: >-
      Ask management for customer count, revenue, and pipeline split by buyer class, region, and regulated versus
      unregulated workloads.
    relatedQuestionRefs:
      - QM011
      - QM025
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-taxonomy
    missingEvidence: >-
      Analyst definitions for public cloud, cloud infrastructure, AI infrastructure, AI-optimized IaaS, and GPUaaS are
      not apples-to-apples.
    whyItMatters: >-
      The apparent TAM changes dramatically depending on which shell is used, so valuation work can be distorted by
      category slippage.
    diligencePath: >-
      Standardize one internal taxonomy for Vultr’s served workloads, then map third-party reports into that taxonomy
      before using them in TAM or share analyses.
    relatedQuestionRefs:
      - QM009
      - QM010
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: material
    topic: competitor-coverage
    missingEvidence: >-
      The retained pack covers the most credible packaging peers and substitutes, but it does not support exhaustive
      treatment of every regional neocloud, sovereign cloud, or incumbent sub-brand that could appear in a full market
      map.
    whyItMatters: >-
      Competitive conclusions can drift if a missing entrant has materially better GPU access, regulatory posture, or
      pricing than the peers summarized here.
    diligencePath: >-
      Extend the competitor pack with direct official surfaces for additional neoclouds or sovereign-cloud providers
      before treating the landscape as exhaustive.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-normalization
    missingEvidence: >-
      Public list prices do not disclose negotiated discounts, committed-use terms, support tiers, or realized egress
      economics across the peer set.
    whyItMatters: >-
      A buyer can appear cheaper in list pricing while losing on actual workload economics once discounts, data
      transfer, and support are included.
    diligencePath: >-
      Request anonymized customer quotes or management win-loss pricing sheets for one starter compute basket and one
      GPU basket across peers.
    relatedQuestionRefs:
      - QP008
      - QP024
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: capability-gaps
    missingEvidence: >-
      The retained pack does not provide clean apples-to-apples evidence for certifications, SLAs, IAM depth,
      observability, managed databases, or compliance posture across every peer.
    whyItMatters: >-
      Those gaps can dominate enterprise, regulated, or public-sector buying even when core infrastructure primitives
      look similar.
    diligencePath: >-
      Pull direct security, compliance, SLA, and product-catalog pages for each peer and rebuild the capability matrix
      with explicit unknown markers only where evidence truly remains absent.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: channel-and-supply-access
    missingEvidence: >-
      Public materials do not disclose supplier reservation terms, enterprise channel leverage, reseller economics, or
      bundle attach rates across the peer set.
    whyItMatters: >-
      Distribution and supply access may decide the next wave of wins more than product breadth does, especially for
      GPU-heavy and regulated workloads.
    diligencePath: >-
      Ask management for supplier relationships, reservation structures, public-sector channel partners, and
      representative win-loss accounts against Akamai, DigitalOcean, and hyperscalers.
    relatedQuestionRefs:
      - QP017
      - QP019
      - QP026
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: independent-benchmark-coverage
    missingEvidence: >-
      Only a small number of retained independent comparison or benchmark sources make direct claims about performance,
      region count, or buyer fit across the peer set.
    whyItMatters: >-
      A thin independent benchmark layer increases the risk that the chapter overweights vendor-authored product pages
      when comparing operational performance.
    diligencePath: >-
      Add more benchmark and third-party operational sources that test comparable workloads or document actual migration
      outcomes between providers.
    relatedQuestionRefs:
      - QP021
  - type: private-evidence-only
    severity: material
