- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or quality signal
  - Current public status
  - Scope
  - Why it matters
  - Current gap
  rows:
  - - IAM organizations and RBAC
    - Documented
    - Service-, action-, and resource-level permissions with roles and groups
    - Shows enterprise account administration is more mature than a single-user VPS surface
    - No public evidence of audit-log depth or policy-testing workflow
  - - VKE CNCF conformance
    - Documented and third-party contextualized
    - Managed Kubernetes portability and consistency signal
    - Meaningful ecosystem trust marker for Kubernetes buyers
    - Does not by itself prove reliability or multi-cluster operations quality
  - - Load balancer health checks and SSL modes
    - Documented
    - HTTP/HTTPS/TCP checks, SSL termination or passthrough, firewall rules, metrics
    - Important for production app resilience and security posture
    - No public historical uptime archive or SLO disclosure
  - - vGPU driver and licensing guidance
    - Documented
    - Driver install, DKMS updates, and nvidia-gridd license checks
    - Shows operational detail for virtualized GPU environments
    - Proof is procedural rather than independently audited
  - - Private-cluster and regionality messaging for inference
    - Claimed repeatedly
    - Compliance-sensitive inference and data-locality positioning
    - Relevant for regulated AI workloads
    - Public compliance attestation scope is still thin
  - - Customer-review reliability signal
    - Mixed
    - TrustRadius shows positive SLA and load-balancer sentiment while Trustpilot surfaces support and reliability complaints
    - Provides outside signal beyond company pages
    - Review quality is noisy and not enterprise-segmented
  notes: Public controls are materially stronger on IAM, Kubernetes conformance, and operational procedures than on programmatic security-assurance or benchmark transparency.
