  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmark-transparency
    missingEvidence: Independent benchmark reports or audited customer performance studies covering latency, throughput, cost-per-token, and uptime across Vultr Cloud GPU and inference services.
    whyItMatters: Most public performance claims come from company launches or partner-backed announcements, which is not enough to underwrite differentiation at scale.
    diligencePath: Request third-party benchmark reports, reference-customer performance studies, and internal SRE dashboards segmented by training, inference, and Kubernetes workloads.
    relatedQuestionRefs:
    - QE022
    - QE023
  - type: missing-source
    severity: material
    topic: security-and-compliance-depth
    missingEvidence: Product-wide security architecture, audit-log retention, incident-handling disclosures, and explicit compliance-attestation scope for Cloud GPU, Cloud Inference, and Serverless Inference.
    whyItMatters: Public trust evidence is strongest for tactical controls such as IAM, conformance, and vGPU operations, but weaker for enterprise-security underwriting.
    diligencePath: Request security white papers, trust-center exports, certification letters, incident-response runbooks, and product-specific compliance mappings.
    relatedQuestionRefs:
    - QE019
  - type: missing-source
    severity: minor
    topic: vendor-dependency-terms
    missingEvidence: Commercial terms, fallback options, and region-by-region availability commitments tied to AMD, NVIDIA, networking partners, and orchestration dependencies.
    whyItMatters: Roadmap and capacity claims rely heavily on external vendors, so supply or integration friction could impair delivery timing and margins.
    diligencePath: Request partner contracts, capacity plans, region roll-out schedules, and engineering contingency plans for hardware or networking substitutions.
    relatedQuestionRefs:
    - QE017
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: enterprise-support-and-reliability
    missingEvidence: Segmented customer-support metrics, incident-response times, SLA history, and enterprise reference calls that can reconcile positive and negative public review signals.
    whyItMatters: Review platforms show both satisfaction and frustration, but they do not reveal how support quality varies by customer segment or workload criticality.
    diligencePath: Request enterprise customer references, support KPI dashboards, escalation playbooks, and recent incident postmortems.
    relatedQuestionRefs:
    - QE023
