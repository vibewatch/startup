- id: control-plane-trust-and-operations
  title: Control plane, trust, and operational quality
  body: 'Public trust evidence is mixed but not empty. On the positive side, Vultr clearly documents IAM organizations, roles, groups, and granular permissions, and the VKE materials tie CNCF certification to a more portable Kubernetes experience. Operational docs also go deeper than typical marketing pages: load balancers expose health checks, SSL modes, firewall rules, and metrics; vGPU guides describe DKMS, driver management, and licensing checks; and Serverless Inference is repeatedly positioned around private clusters, regionality, and compliance-sensitive deployments. That said, the trust story is still uneven. Much of the public control evidence is tactical and workload-specific rather than programmatic or audited. The company does not publish the kind of broad product-wide incident history, benchmark methodology, or security-control detail that would let an investor underwrite reliability with confidence. Customer-review signals reinforce that caution: some users praise uptime and
    load balancing, while others publicly complain about support, bans, SMTP restrictions, and network issues.'
  claimRefs:
  - CE010
  - CE011
  - CE015
  - CE017
  - CE021
  - CE028
