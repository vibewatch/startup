    - id: hardware
      label: Hardware vendor layer
      detail: AMD Instinct and NVIDIA accelerator families anchor the GPU menu, while x86 compute and bare metal provide the non-GPU substrate.
    - id: primitives
      label: Cloud primitives layer
      detail: Cloud GPU, Cloud Compute, Block Storage, load balancing, networking, and bare metal expose the base infrastructure building blocks.
    - id: orchestration
      label: Orchestration and control plane
      detail: VKE, self-service Clusters, Cluster API, Slurm options, and Marketplace publishing organize workloads above the primitives.
    - id: inference
      label: Inference and AI services layer
      detail: Cloud Inference, Serverless Inference, AMD Inference Microservices, and agentic-AI blueprints move the platform toward higher-level AI consumption.
    - id: ops
