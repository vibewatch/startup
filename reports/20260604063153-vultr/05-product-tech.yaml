- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Vultr path
  - Public benefit signal
  - Current limitation
  rows:
  - - Train or fine-tune large models
    - Provision GPU or bare-metal nodes, validate interconnects, then run distributed jobs
    - Cloud GPU, Clusters, dstack guide, Slurm on VKE
    - Docs show RCCL tests, Ray workflows, and scheduler options
    - No independent benchmark set ties cost, uptime, and throughput together
  - - Serve private or regulated inference
    - Use dedicated GPU capacity with regional placement and controlled networking
    - Cloud Inference or private Serverless Inference clusters
    - Company repeatedly ties these products to privacy or compliance-sensitive workloads
    - Public compliance attestation scope is not fully disclosed
  - - Ship API-based GenAI quickly
    - Call an OpenAI-compatible endpoint and add tools or RAG patterns
    - Serverless Inference plus tool-calling guide
    - Fastest path from prototype to app integration is clearly documented
    - Need latency, concurrency, and model-availability transparency
  - - Operate containerized AI services
    - Run Kubernetes clusters with registry, load balancer, and storage primitives
    - VKE, Container Registry, Block Storage, Load Balancer
    - Strong Kubernetes-oriented workflow evidence across blogs and docs
    - Public multi-cluster ops and SRE guidance remain thin
  - - Automate infrastructure deployment
    - Define resources in code, use provider, CLI, or SDK, and provision via API
    - Terraform guide, provider repo, CLI, govultr SDK
    - Automation surface is materially broader than a console-only cloud
    - Need official lifecycle and support policy for tooling versions
  - - Run specialized or custom environments
    - Deploy bare metal, install custom ISO, and attach supporting network or storage services
    - Bare Metal, Custom ISO, Load Balancer, Block Storage
    - Shows flexibility beyond managed AI services
    - Supportability of edge-case operating environments is left to diligence
  notes: Benefits are based on documented workflows and examples rather than independently measured deployment outcomes.
