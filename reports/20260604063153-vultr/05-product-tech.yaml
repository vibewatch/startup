- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current public maturity
  - Differentiation signal
  - Key diligence gap
  rows:
  - - Cloud GPU
    - AI/ML teams
    - Core and heavily evidenced
    - Named AMD and NVIDIA SKU map plus VM and bare-metal delivery paths
    - Need independent performance-per-dollar validation by workload
  - - Cloud Inference
    - Platform and AI teams
    - Current but still launch-led
    - Higher-level inference surface above raw instances
    - Need published model catalog depth, pricing logic, and SLA detail
  - - Serverless Inference
    - Application developers
    - Current and well documented
    - OpenAI-compatible API, global reach, and tool-calling path
    - Need cold-start, latency, and tenancy details
  - - VKE and Vultr Clusters
    - Platform engineers
    - Mature managed-Kubernetes surface with active enhancements
    - Free control plane, node replacement, CPU or GPU clusters, Slurm or Kubernetes head nodes
    - Need clearer multi-region and large-cluster operating metrics
  - - Container Registry
    - Cloud-native teams
    - Current supporting module
    - Secure image-management layer linked to Kubernetes workflows
    - Need richer public feature disclosure versus larger registries
  - - VX1 Cloud Compute
    - General cloud and AI control-plane workloads
    - Current and actively marketed
    - x86-native path intended to avoid custom-silicon migration work
    - Benchmark claims are company-reported and not independently audited
  - - Bare Metal plus Custom ISO
    - Performance-sensitive or specialized workloads
    - Current core capability
    - Full hardware control plus custom-OS installation path
    - Need public guidance on support boundaries for unusual images
  - - Automation surfaces
    - DevOps and platform teams
    - Current and broad
    - Terraform, provider repo, CLI, Go SDK, Cluster API, and Marketplace tooling make the platform scriptable
    - Need public versioning and deprecation-policy detail
  notes: Rows summarize the visible product surface and maturity signals from official pages, docs, and external directories rather than exact commercial bundles.
