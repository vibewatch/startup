schemaVersion: "report-v2"
artifact: financials
slug: tekever
runDate: 2026-10-09
company:
  name: "Tekever"
chapter:
  number: 4
  title: Financials
  summary: >-
    TEKEVER has raised substantial growth capital and describes both aircraft production
    and managed intelligence services, but the public evidence does not disclose revenue,
    gross margin, cash burn, working capital, or contract drawdowns. The financial thesis
    therefore rests on a plausible mixed hardware-and-service model whose economics remain
    unverified rather than on an underwritable public operating record.
sections:
  - id: revenue-model
    title: Revenue model is mixed, but pricing and mix are undisclosed
    body: >-
      Public descriptions support at least two monetization mechanisms: production of
      unmanned aircraft and provision of managed intelligence, surveillance, and
      reconnaissance services. TEKEVER's own site also describes mission-oriented systems
      and public-sector contracts, including CORVUS, with a value of up to £400 million over
      ten years. That ceiling is evidence of procurement access, not evidence of booked
      revenue, annual recurring revenue, or a fixed delivery schedule. None of the reviewed
      sources publishes list prices, realized pricing, revenue mix, recognition policy, or
      renewal behavior. Revenue quality may benefit from long-duration sovereign missions,
      but investors need task-order and acceptance data before treating programme ceilings
      as contracted backlog.
    claimRefs: [CI001, CI002, CI003, CI004, CI010, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure
    title: Vertical integration creates control and capital intensity
    body: >-
      The operating model spans aircraft, software, sensors, mission support, manufacturing,
      delivery, and service. That breadth can protect performance and speed field learning,
      but it also introduces a physical cost base unlike asset-light software: composite
      production, quality assurance, engineering labor, inventory, facilities, support, and
      deployment all precede or accompany customer revenue. The careers evidence confirms
      active production and quality roles, while financing disclosures direct proceeds
      toward production and technology capacity. No reviewed source quantifies bill-of-
      materials cost, manufacturing yield, service-delivery cost, utilization, gross margin,
      working-capital days, warranty burden, or capex. The margin path is therefore a
      diligence hypothesis, not a demonstrated result.
    claimRefs: [CI001, CI009, CI010, CI012, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: The Series D expands capacity but does not establish runway
    body: >-
      Independent reporting says the September 2026 Series D first close was $580 million at
      a $6.4 billion valuation, with most rather than all of the planned round closed and
      further closings expected. Uses include international expansion, manufacturing,
      technology capacity, and acquisitions. That financing materially improves access to
      capital, but funding raised is not cash available: the public record provides no cash
      balance, burn rate, debt schedule, acquisition consideration, or restricted-use
      breakdown. Bloomberg's earlier report that talks for as much as €500 million at a
      €5.5 billion valuation were ongoing and subject to change also demonstrates how quickly
      financing terms moved. Runway and the next financing trigger cannot be calculated from
      the assigned evidence.
    claimRefs: [CI005, CI006, CI007, CI008, CI013, CI014, CI015]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The strongest positive signal is the combination of institutional financing, a
      vertically integrated offering, and access to large government programmes. The
      counterweight is severe information asymmetry: no audited P&L, revenue series, gross
      margin, free cash flow, customer concentration, backlog conversion, or unit-economics
      bridge appears in the reviewed public sources. The model also carries simultaneous
      demands from production expansion, international delivery, technology development,
      and acquisitions. Until a data room reconciles signed orders to deliveries, recognized
      revenue, cash collections, direct costs, and working capital, TEKEVER's revenue quality,
      margin path, and capital adequacy cannot be underwritten with confidence.
    claimRefs: [CI003, CI004, CI010, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Programme ceiling is not revenue
    body: >-
      The CORVUS figure is stated as worth up to £400 million over ten years. Underwriting
      requires committed orders, delivery milestones, acceptance terms, and payment timing
      before any portion is modeled as revenue or cash.
    claimRefs: [CI003, CI004]
  - calloutType: recommendation
    title: Gate the investment on data-room economics
    body: >-
      Require audited statements, contract-level backlog conversion, gross-margin bridges,
      cash and debt schedules, and customer concentration before relying on the latest
      financing as evidence of durable financial capacity.
    claimRefs: [CI010, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams and quality assessment
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public status
      - Revenue-quality assessment
      - Diligence ask
    rows:
      - - UAS and autonomous systems
        - Aircraft and integrated system production
        - Undisclosed per system or programme
        - Publicly described offering
        - Contract revenue is plausible; delivery and acceptance timing are unknown
        - SKU pricing, order book, delivery schedule, acceptance terms, and recognized revenue
      - - Managed ISR service
        - Managed intelligence, surveillance, and reconnaissance missions
        - Undisclosed mission, hour, subscription, or contract basis
        - Publicly described offering
        - Could add recurring service revenue, but duration and renewal evidence are absent
        - Contract samples, utilization, renewal, direct labor, and service gross margin
      - - Sovereign surveillance programmes
        - Multi-year government procurement and delivery
        - Programme ceiling rather than disclosed unit price
        - CORVUS stated at up to £400 million over ten years
        - Long duration may improve visibility, but ceiling value is not committed revenue
        - Task orders, minimum commitments, annual phasing, termination rights, and collections
    notes: >-
      Public-source snapshot as of 2026-10-09; mechanisms are evidenced, while units, mix,
      realized pricing, recognition, and revenue values remain undisclosed.
    claimRefs: [CI001, CI002, CI003, CI004, CI011]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Offering or contract
      - Disclosed price or value
      - What the figure represents
      - What it does not establish
      - Required evidence
    rows:
      - - CORVUS surveillance programme
        - Up to £400 million over ten years
        - Company-stated programme ceiling
        - Committed backlog, annual revenue, unit price, or cash timing
        - Award documents, task orders, delivery milestones, and payment schedule
      - - UAS and integrated autonomous systems
        - Not disclosed
        - No public list or realized price in the reviewed sources
        - ASP, discounts, configuration mix, or warranty economics
        - Price book and invoice-level cohort by platform and configuration
      - - Managed ISR service
        - Not disclosed
        - Service mechanism is described, but pricing basis is not
        - Recurring revenue, utilization, renewal, or contribution margin
        - Contract pricing, mission volume, renewal history, and service cost allocation
    notes: >-
      Values preserve the source denominator: the £400 million figure is an "up to" programme
      ceiling over ten years and is not treated as annual, contracted, or recognized revenue.
    claimRefs: [CI002, CI003, CI004, CI010]
  - id: TI003
    title: Unit economics and capital-adequacy gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue and ARR
        - Not disclosed
        - High confidence that assigned public sources do not provide it
        - Establishes scale and separates contracted product revenue from recurring services
        - Audited revenue by year, product, service, geography, and recognition policy
      - - Gross margin
        - Not disclosed
        - High confidence that assigned public sources do not provide it
        - Tests whether vertical integration and service delivery create operating leverage
        - Gross-margin bridge by aircraft, software, mission service, support, and warranty
      - - CAC, sales cycle, and payback
        - Not disclosed
        - Medium; government procurement appears important but funnel data is unavailable
        - Measures efficiency and timing risk in long sovereign sales cycles
        - Pipeline cohorts, bid costs, win rates, cycle length, and channel economics
      - - Working capital and capex
        - Not disclosed
        - Medium; manufacturing expansion indicates material requirements
        - Inventory, receivables, facilities, and production equipment can consume cash before delivery
        - Inventory days, receivable terms, progress payments, capex plan, and supplier commitments
      - - Cash burn and runway
        - Not disclosed
        - High confidence that assigned public sources do not provide it
        - Determines whether the round funds the plan through the next operating milestone
        - Cash balance, restricted cash, monthly burn, debt schedule, and base/downside runway
      - - Customer and programme concentration
        - Not disclosed
        - High confidence that assigned public sources do not provide it
        - A small set of sovereign programmes could dominate revenue and collections
        - Top-ten customer revenue, backlog, task-order exposure, and concentration sensitivity
    notes: >-
      "Not disclosed" means absent from the eight assigned, successfully prefetched public
      sources; it does not assert that the company lacks the metric or the underlying data.
    claimRefs: [CI003, CI010, CI012, CI014, CI015, CI016]
