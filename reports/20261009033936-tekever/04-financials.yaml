        - id: mission-demand
          label: Customer mission need
          detail: Surveillance, defence, security, or environmental monitoring requirement
        - id: procurement
          label: Contract or task order
          detail: Commercial terms, minimum commitment, and timing are not publicly disclosed
        - id: build
          label: Integrated system production
          detail: Aircraft, sensors, software, engineering, quality, and manufacturing inputs
        - id: deliver
          label: Delivery and acceptance
          detail: Milestones and revenue-recognition triggers are not publicly disclosed
        - id: operate
          label: Managed ISR operations
          detail: TEKEVER also describes a managed intelligence and surveillance service
        - id: revenue
          label: Product and service revenue
          detail: Mix, amount, recurrence, and concentration are not publicly disclosed
        - id: gross-profit
          label: Gross profit
          detail: Direct production and service costs are unavailable, so conversion is unmeasured
    approximationNotes: >-
      Qualitative operating bridge only; no flow width, conversion rate, revenue amount, or
      gross-margin percentage is inferred.
    claimRefs: [CI001, CI002, CI011, CI012, CI016]
