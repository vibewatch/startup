  - id: "exit-readiness-and-diligence-path"
    title: "Exit Readiness, Diligence Asks, and Thesis-Break Triggers"
    body: |
      Tekever's organizational and corporate trajectory points toward a dual exit path: a European defense-tech public listing in London or Paris, or a strategic sale to an aerospace prime seeking autonomous systems integration. The appointment of prominent defense advisors and institutional participation from Baillie Gifford and UC Investments underscore long-term public market ambitions. Furthermore, the company has begun programmatic industrial expansion, acquiring Edinburgh-based hydraulic propulsion developer Flowcopter in September 2026 and establishing advanced manufacturing partnerships with composite specialist iCOMAT to industrialize AR5 airframe production.

      Nevertheless, several definitive thesis-break triggers must be monitored by prospective investors. Foremost among these is contract conversion integrity: any formal reduction, cancellation, or protracted procurement dispute regarding the UK MOD CORVUS framework would fundamentally impair Tekever's sovereign growth narrative. Additional triggers include material supply chain disruption in specialized aerospace composites or avionics, regulatory export control barriers blocking non-NATO deployments, or senior executive turnover within core engineering leadership.

      Before committing growth capital or underwriting secondary transactions at current levels, institutional diligence must answer three critical information gaps. First, investors must inspect three years of audited financial statements (FY2023–FY2025) to verify underlying revenue composition, hardware versus software margin mix, and historical cash burn. Second, the detailed 24-month task-order schedule for Project CORVUS must be audited to verify binding minimum procurement commitments. Finally, full cap-table visibility is required to assess liquidation preference hurdles, dividend accruals, and dilution impact on junior equity holders.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV010"
      - "CV015"
      - "CV016"
