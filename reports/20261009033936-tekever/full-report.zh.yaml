      - number: '1.3'
        title: 资本化历程、主权支持者与估值扩张
        blocks:
          - type: paragraph
            body: >-
              2024 至 2026 年间，欧洲主权防务优先级上升，资本加速流入自主航空领域，Tekever 的资产负债表也经历了多轮大幅扩张。公司早期靠研发补助，以及 Iberis Capital 和 Cedrus
              Capital 的早期风险投资起步；2024 年末，Tekever 完成 €70m Series B，由 Baillie Gifford 领投，并获 NATO Innovation Fund（NIF）、英国
              National Security Strategic Investment Fund（NSSIF）和硅谷 Crescent Cove Advisors 支持。到 2025 年 5 月，Ventura
              Capital 牵头的二级交易和成长股权投资将 Tekever 估值推至 $1.25b 至 $1.33b，正式进入独角兽行列。2026 年 9 月 23 日，Tekever 宣布完成一笔里程碑式 $580m
              Series D 首次交割，由 UC Investments（University of California 投资办公室首次直接投资欧洲）与 Baillie Gifford 共同领投，将公司估值推至
              $6.4b。不过，多年财务报表未经审计，收入倍数也未披露，机构投资者的分析因此持续受限。
