chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、沿革与军民两用运营架构
        blocks:
          - type: paragraph
            body: >-
              Tekever 于 2001 年由联合创始人 Pedro Sinogas、Vitor Cristina 及里斯本 Instituto Superior Técnico
              的同学在葡萄牙里斯本注册成立。公司最初开发把实体设备连接到企业系统的分布式网络软件；约在 2009 年，工程团队转向把分布式计算和航空电子专长直接用于无人航空系统（UAS）。如今，Tekever
              是一家垂直整合的制造商和技术提供商，覆盖战术机体制造、复合材料航空结构、机载航空电子、卫星通信和情报软件。公司在葡萄牙里斯本和英国伦敦设有双总部，并在 Swindon、Bristol 和 Caldas da
              Rainha 运营专业生产和测试设施。Tekever 的核心商业模式把直接交付系统与民用、海事和防务领域的长期 Intelligence-as-a-Service 合同结合起来，包括为英国 Home Office
              在英吉利海峡持续执行监视任务、为 European Maritime Safety Agency（EMSA）提供海事观测，以及与乌克兰武装部队开展持续战术侦察部署。
