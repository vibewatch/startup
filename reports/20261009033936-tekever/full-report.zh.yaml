      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              自主 ISR 系统的机构买方可分为三层：国家防务部门、超国家安全机构和民用军民两用运营商。英国国防部、葡萄牙空军等国家防务买方，采购主权持续监视和战术作战情报。以 European Maritime Safety
              Agency（EMSA）和英国 Home Office 为代表的超国家及边境安保机构，采购托管监视服务，用于监控专属经济区、保障海上边界和打击走私。加拿大 Phoenix Heli-Flight
              等军民两用应急和环境运营商，则将平台用于野火探测和环境监测。典型采用路径从竞争性能力演示和特遣队运营试验开始，推进到多年期框架授予和一体化服务部署。预算由主权防务采购拨款、机构海事安保拨款和军民两用应急响应资本承担。
