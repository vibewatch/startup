            body: 潜在机构投资者必须把资金投入条件设为：独立审计验证 FY2022–FY2025 财务报表、英国国防部和 EMSA 账户的客户集中度比例，以及卫星航空电子和复合材料部件的详细次级供应商 SLA 协议。
