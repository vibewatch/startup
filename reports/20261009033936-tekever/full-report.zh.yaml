      - number: '3.4'
        title: 护城河持久性、整合压力与不利地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              尽管 Tekever 最近完成 $580m Series D 首次交割、估值达到
              $6.4b，其竞争护城河仍面临实质性的整合风险和主权采购瓶颈。欧洲防务部门越来越倾向于指定本国冠军企业，偏好拥有本国政治影响力的供应商，如德国的 Quantum Systems，或法国的 Dassault 和
              MBDA。Tekever 通过 Project CORVUS 以及 Sir Ben Wallace 经由投资方 Merlyn Advisors
              的协同，成功确立了英国主权定位；但多国扩张要求持续投入本地制造资本开支。CEO Ricardo Mendes 承认，快速整合将重塑欧洲防务科技，并据此让 Tekever 的资产负债表为项目式收购做好准备，例如
              2026 年 9 月收购总部位于苏格兰的重载推进初创公司 Flowcopter。此外，宏观防务支出还面临盟国预算重新分配、采购延迟和利率波动带来的时点风险，这些因素可能拖慢相对于框架上限的后续任务订单提款。
