      - number: '7.3'
        title: 客户集中度与主权采购脆弱性
        blocks:
          - type: paragraph
            body: >-
              Tekever 的收入仍高度集中在少数政府机构和主权防务实体，包括英国 Home Office、英国国防部、European Maritime Safety Agency
              和葡萄牙空军。长期主权框架提供多年积压可见度，但也使 Tekever 暴露于主权预算变化、政治重新结盟、采购抗议诉讼和任务订单提款行政延迟。框架上限不等于已承诺、前置的现金流。此外，公司依赖战略合作关系——例如与
              Threod Systems 进行战术 UAS 集成、与 iCOMAT 进行先进复合材料制造——这会让公司依赖次级工业伙伴，其表现直接影响 Tekever 的交付里程碑。
