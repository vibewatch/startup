      - number: '5.3'
        title: 监视即服务交付模式与运营流程
        blocks:
          - type: paragraph
            body: >-
              Tekever
              的运营差异化，在于把无人航空硬件和分析能力打包成端到端的监视即服务交付模式。公司不要求政府防务和海事安全机构采购机体、建设内部维修基地并培训专职机组，而是直接提供交钥匙海事情报。在这一架构下，Tekever
              拥有并维护飞机系统，部署认证飞行操作员和地面控制站，管理视距内及视距外卫星通信链路，并把可执行、带地理坐标的监视数据流直接送入客户指挥运营中心。该模式体现在 Tekever 与 European Maritime
              Safety Agency（EMSA）签订的 €30m 框架协议中：公司为北欧和波罗的海海域提供专用 AR5 监视服务，并为英国 Home Office
              和边境安保机构执行运营巡逻。把大额资本设备采购周期变成经常性运营合同后，Tekever 降低了政府买方的采购摩擦，同时获取高毛利的经常性软件和数据收入。超过 100,000
              小时的严苛海事环境飞行记录，为这一模式的运营有效性提供支撑，说明任务可用性和目标探测率可与传统载人监视飞机媲美。
