              Tekever 横跨防务、航空航天和海事监视领域，受到严格的欧盟和英国监管制度约束。作为无人航空系统制造商和监视即服务提供商，公司在敏感运营区域部署 AR3、AR4、AR5 等平台，包括为英国 Home
              Office
              在英吉利海峡执行任务以及在乌克兰开展作战情报任务，因此面临严格的军民两用出口管制、军品许可门槛和国际空中交通整合要求。主权采购标准变化，或英国、葡萄牙与第三方客户国家之间的双边出口限制，都会给交付计划带来实质摩擦。此外，超视距运行需要持续取得国家民用和军用航空安全批准，限制部署速度。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
