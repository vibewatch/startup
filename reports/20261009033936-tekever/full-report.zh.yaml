      - number: '3.3'
        title: 采购模式、GTM 动作与客户锁定动态
        blocks:
          - type: paragraph
            body: >-
              政府防务 UAS 采购正从传统资本密集型平台购买，转向灵活的服务级协议和主权制造承诺。Tekever 通过两种商业模式交付解决方案：向主权空军出售资本资产（如与葡萄牙空军签订的 AR5
              直接合同），以及向民用、边境安保和防务机构（包括 European Maritime Safety Agency 和英国 Home Office）提供托管
              Intelligence-as-a-Service（IaaS）。在托管 IaaS 模式下，Tekever
              保留机体所有权并负责运营维护，承担损耗风险，按运营小时或数据流交付计费。这种交付结构降低了民用海事监视机构和盟国边境机构的采购门槛。对核心防务客户，Tekever
              通过主权工业化锁定转换成本：公司建立本土制造中心（如 Swindon 工厂，并在 Aberporth 进行飞行测试），同时与主权防务框架对齐。提供标准外国现货防务硬件的竞争者，很难绕过英国和欧洲的技术主权要求。
            claimRefs:
              - CP005
              - CP009
