  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与融资背景
        blocks:
          - type: paragraph
            body: >
              Tekever 已确立为欧洲领先的自主无人航空系统（UAS）制造商，在高强度环境中展现出显著的运营验证。公司平台，尤其是 AR3 和 AR5 固定翼自主无人机，自 2022 年以来已在乌克兰累计超过 50,000
              个运营飞行小时，提供关键战场情报、监视、目标获取和侦察（ISTAR）。这段前线运营履历帮助 Tekever 拿下大型主权采购项目，最终在 2026 年 7 月，英国国防部选中 Tekever 交付 Project
              CORVUS，即英国陆军下一代监视能力；该框架项目价值最高 £400m、期限 10 年。


              在商业势头基础上，Tekever 于 2026 年 9 月 23 日宣布完成 $580m Series D 首次交割，投后估值 $6.4b。本轮由 UC Investments（University of
              California 首次直接投资欧洲）和长期支持者 Baillie Gifford 共同领投，Merlyn Advisors 以及现有投资者 Crescent Cove、Ventura Capital 和
              Iberis Capital 进行战略参与。这笔融资使 Tekever 累计股权融资达到 $677m，分布于 15 次融资事件，相比 2025 年 5 月 Series B 的 $1.33b估值和更早的
              €70m融资，出现了非同寻常的跃升。


              不过，$6.4b 入场估值带来了明显的估值拉伸。表面倍数反映的是面向未来的主权防务狂热，而非经审计的财务表现。历史收入运行率、年度经常性收入（ARR）、毛利率和 EBITDA 数据，均未经过公开审计或披露。尽管
              £400m CORVUS 项目提供了显著的主权需求支点，防务框架协议代表的是任务订单上限，而不是有保证的即时开票。因此，以 $6.4b
              进入的投资者面对未对冲的基本面溢价，普通股回报将对未经验证的合同转化计划和未披露的资本结构优先权高度敏感。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
