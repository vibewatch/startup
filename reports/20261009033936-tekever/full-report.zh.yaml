      - number: '5.2'
        title: 技术架构、航空电子与边缘智能
        blocks:
          - type: paragraph
            body: >-
              Tekever 平台的技术基础在于数字航空电子核心和专有人工智能栈。AR5 机载车辆系统通过确定性、容错总线架构通信，支持 MAVLink、DroneCAN、IP
              网络和工业串行协议（RS232/422/485）。飞行稳定和关键飞行指令执行运行在嵌入式实时操作系统（RTOS）及强化版 Embedded Linux 发行版上；系统工程和软件生命周期流程按
              DO-178C、ARP4754A
              等航空适航标准组织。飞机搭载多传感器载荷，包括光电和红外（EO/IR）陀螺稳定成像吊舱、用于跟踪水面船只的专用海事搜索雷达、自动识别系统（AIS）接收器和紧急示位无线电信标（EPIRB）天线。机载计算单元不把原始视频流通过受限卫星链路下传，而是在战术边缘运行
              ATLAS 情报软件和神经计算机视觉模型。ATLAS 融合多传感器数据，实时自动探测、跟踪船只，并将其与海事登记册分类匹配。在企业层，Tekever 使用 Docker 和 Kubernetes 集群在
              Google Cloud 上维护可扩展数据平台，通过 Apache Airflow 和 Spark 编排自动化机器学习流水线，持续接收遥测数据并优化探测模型。
