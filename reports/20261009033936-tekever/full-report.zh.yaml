      - number: '1.2'
        title: 高管领导、治理结构与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Tekever 长期由创始人兼首席执行官 Ricardo Mendes 领导，他负责全球运营执行、防务采购协同和公司资本化策略。联合创始人 Pedro Sinogas 和 Vitor Cristina
              主导了早期架构与技术战略；Pedro Sinogas 仍在 Tekever 各实体担任治理和公司领导职务。2026 年 9 月，公司扩大了战略治理阵容，迎来英国前国防大臣、现任 Merlyn Advisors
              投资组合经理 Sir Ben Wallace，担任战略投资者代表。Sir Ben Wallace 的加入，为 Tekever 扩大英国和欧洲大型军方合同交付带来了主权防务采购经验。运营工程领导分布在
              Swindon 的复合材料制造中心，以及西威尔士和葡萄牙的先进飞行测试中心；但主权客户谈判和机构融资协同仍高度依赖首席执行官 Ricardo Mendes。
