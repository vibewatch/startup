      - number: '8.2'
        title: 推荐立场、情景建模与估值敏感性
        blocks:
          - type: paragraph
            body: >
              权衡已验证的运营能力与严重的估值压力后，我们对 Tekever 的机构立场定为“跟踪”，风险评级高，估值判断偏高。在 $6.4b
              估值下，如果无法详细查阅数据室中的经审计损益表、积压任务订单计划和高级清算优先权，就没有理由承诺
              新的股权资本。欧洲双用途自主系统仍受主权需求强力推动，但审慎配置资本意味着要等到收入兑现可验证、二级市场定价回归理性。


              情景建模显示，地缘政治动能与运营执行之间存在极端失衡。乐观情景下，Tekever 将 £400m 的 CORVUS 合同快速转化为多年硬件交付，加快 NATO
              成员国的欧洲防务出口合同，并扩大高毛利的智能即服务软件数据流，最终在主权资本支持的 IPO 窗口取得 $8.0b 至 $10.0b 的估值。基准情景下，CORVUS 任务订单逐步爬坡，年规模为 £30m 至
              £40m；商业海上监视带来稳定但有限的贡献，隐含估值落在 $4.0b 至 $5.5b，意味着短期内相对当前轮次估值将出现倍数压缩。


              悲观情景显示下行风险严重，企业估值可能只有 $1.5b 至 $2.5b。下行触发因素包括政府重新分配预算、英国防务
              采购任务订单执行延迟、国际合同推迟，或新出现的反无人机电子战对策削弱现有固定翼平台的声学和雷达特征。沿着这条下行路径，如果无法证明独立经营盈利能力，后期投资者将暴露于结构化优先权压力和潜在的下轮融资重估。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
