      - number: '8.3'
        title: 退出准备度、尽调要求与论点失效触发因素
        blocks:
          - type: paragraph
            body: >
              Tekever 的组织与公司发展轨迹指向两条退出路径：在伦敦或巴黎进行欧洲防务科技上市，或出售给寻求整合自主系统的航空航天 主承包商。聘请知名防务顾问，以及 Baillie Gifford 和 UC
              Investments 的机构参与，都凸显其长期进入公开市场的抱负。 此外，公司已开始有计划地扩张工业能力，于 2026 年 9 月收购总部位于爱丁堡的液压推进开发商 Flowcopter，并与复合材料 专家
              iCOMAT 建立先进制造合作，以实现 AR5 机体的工业化生产。


              不过，潜在投资者必须持续监测几个明确的论点失效触发因素。首要因素是合同转化是否可靠：英国国防部 CORVUS 框架若出现 正式缩减、取消或长期采购争议，将从根本上削弱 Tekever
              的主权增长叙事。其他触发因素包括特种航空复合材料或航空电子设备 供应链出现重大中断、监管出口管制阻碍非 NATO 部署，或核心工程领导层发生高管更替。


              在当前水平投入成长资本或承诺二级交易之前，机构尽调必须填补三项关键信息缺口。第一，投资者必须查阅三年的经审计财务报表
              （FY2023–FY2025），核实收入构成、硬件与软件的利润率组合以及历史现金消耗。第二，必须审计 Project CORVUS 未来 24 个月
              的详细任务订单计划，确认具有约束力的最低采购承诺。最后，需要完整查看股权表，以评估清算优先权障碍、股息累积以及对 次级股东的稀释影响。
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV015
              - CV016
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 机构建议：严格遵守估值纪律，持续跟踪
            body: Tekever 在自主防务科技领域的领先运营地位，无法抵消其在 $6.4b 估值下缺乏经审计财务报表的问题。投资者应跟踪 Project CORVUS 的执行进展，并在投资前要求提供经核实的利润率和股权表数据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV010
          - type: callout
            title: 估值倍数压缩与框架执行风险
            body: £400m 的英国国防部 Project CORVUS 协议代表 10 年期的上限，并不等于有保障的即时现金。如果任务订单转化放缓， 或防务科技倍数向下重估，后期投资者将面临显著的估值压缩。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV014
