      - number: '3.2'
        title: 架构差异化：垂直整合与纯软件自主
        blocks:
          - type: paragraph
            body: >-
              Tekever 的核心运营护城河在于快速运营反馈闭环，以及对实体机体、机载 AI
              处理和通信航空电子的端到端整合。公司工程领导明确强调，完全垂直整合能支持快速、敏捷扩张，把前线电子战经验直接转化为生产改型。例如，乌克兰前线测试推动了 25 千克 AR3 Evo 的开发；该机型针对恶劣的 30
              节风况和电子战环境设计，续航 16 小时，并能在 5 分钟内完成从组装到起飞。在海事监视中，Tekever 的 AR5 平台把常规 Beyond Radio
              Line-of-Sight（BRLOS）高容量卫星通信与 50 千克载荷能力结合，用于海事雷达和光学传感器。Watchkeeper 等传统平台续航较低、维护要求更高，促使英国陆军在 Project CORVUS
              下绕过一场犹豫不决的八方竞争，以单一来源方式选择 Tekever 的 AR5，合同最高 £400m、为期 10 年。不过，Helsing
              等软件优先进入者带来长期替代压力：如果盟军防务部门统一采用硬件无关的任务软件，专有垂直整合无人机平台的竞争价值可能逐步承受利润率压缩。
