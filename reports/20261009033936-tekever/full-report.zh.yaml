            title: 主权框架执行与已承诺现金实现
            body: 英国国防部 CORVUS 等价值最高 £400m、期限 10 年的大型主权防务项目，能提供长期合同上限的可见度，但不能保证立即提款。预算优先级调整或任务订单签发行政延误，会带来重大现金时点风险。
