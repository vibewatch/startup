      - number: '7.2'
        title: 运营扩张、质量控制与次级供应依赖
        blocks:
          - type: paragraph
            body: >-
              Tekever 在英国和葡萄牙快速扩张生产足迹，带来尖锐的运营执行和质量控制风险。要扩大制造以履行多年期政府承诺——例如英国国防部 10 年内价值最高 £400m 的 CORVUS
              监视项目——就必须在复合材料机体制造、高容量卫星通信集成和 AI 任务航空电子组装上做到无失误。公开技术和招聘信息显示，公司仍在解决关键运营挑战，尤其是卫星通信延迟瓶颈，以及在恶劣海况下保持 20
              小时运营架次的高空气动力续航。任何部件故障、航空电子软件缺陷或复合材料制造问题，都可能危及前线军事行动并触发合同处罚。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
