  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与平台能力
        blocks:
          - type: paragraph
            body: >-
              Tekever 设计、制造并运营一整套自主无人航空系统（UAS），专门服务于要求严苛的海事态势感知和边境监视任务。公司的运营旗舰是 AR5
              无人航空系统，这是一款用于执行长期海上侦察任务的中空长航时固定翼平台。AR5 采用空气动力学复合材料机体，机身长 4.3 米、翼展 3.0 米，最大起飞重量（MTOW）150
              千克。凭借内部燃油容量和空气动力效率，平台可在视距外（BLOS）连续运行最长 12
              小时，在传统上需要昂贵载人海上巡逻机的广阔专属经济区（EEZ）提供持续海事覆盖。平台集成自动起飞和着陆（ATOL）飞控软件，既能从短距离非铺装跑道起飞，也能使用常规航空基础设施。除 AR5 外，Tekever
              还部署用于陆地和沿海侦察的战术 AR3 网络中心系统，并于 2026 年 7 月推出 AR6 系列，将产品组合延伸至英国主权重载自主物流。上述平台在欧洲、北美和盟国运营环境中累计飞行超过 100,000 小时。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE011
              - CE014
