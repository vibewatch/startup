        - 前线损耗与不断演变的电子战可能使机体过时
        - 在争议空域失去电子战生存能力，或任务严重失败
      - - 主权支持
        - £400M 英国陆军 CORVUS 合同确立长期主权收入锚点
        - 框架上限只是无约束力的帽额，并非承诺的年度现金流
        - 英国国防部削减预算、取消任务订单，或采购长期冻结
      - - 资本支持
        - UC Investments 与 Baillie Gifford 领投的 $580M D 轮提供充足流动性
        - $6.4B 高估值抬高后续融资和普通股回报的门槛
        - 后续交割出现降价轮重组，或战略投资者退出
      - - 技术栈
        - 集成式自主软件（ATLAS）与机体形成较高转换成本
        - 硬件制造强度高，限制毛利率扩张
        - 经审计数据表明软件收入仅占总收入很小一部分
    notes: 对照公开表述、主权合同披露和风险投资融资公告进行比较。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV008
      - CV011
      - CV012
  - id: TV003
    title: 场景投资判断模型：乐观、基准与悲观情景
    columns:
      - 情景
      - 隐含估值区间
      - 关键运营假设
      - 财务与市场驱动因素
      - 概率信号
    rows:
      - - 乐观情景
        - $8.0B - $10.0B
        - CORVUS 按 £40M/年全部转化；北约出口快速扩张
        - 软件 / 情报服务毛利率超过 60%；2028-2029 年 IPO
        - 25%
      - - 基准情景
        - $4.0B - $5.5B
        - CORVUS 交付逐步爬坡；选择性承接欧洲边境与海事合同
        - 硬件制造主导收入结构；利润率压缩至 30-40%
        - 50%
      - - 悲观情景
        - $1.5B - $2.5B
        - CORVUS 任务订单延迟；低成本无人机厂商带来竞争压力
        - 国际扩张造成现金严重消耗；降价轮优先权形成悬而未决的压力
        - 25%
    notes: 情景根据国防采购速度、毛利率结构和退出倍数，模拟企业估值敏感度。
    claimRefs:
      - CV003
      - CV004
      - CV008
      - CV012
      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: Tekever 公司与资本化里程碑时间线
    type: timeline
    summary: 梳理 2001 至 2026 年的公司基础事件、主要融资轮次和主权国防合同里程碑。
    data:
      items:
        - date: '2001'
          label: 在里斯本创立公司
          detail: Ricardo Mendes、Pedro Sinogas 与 Instituto Superior Técnico 的同学共同创立 Tekever，开发分布式计算软件。
          tone: neutral
        - date: '2009'
          label: 转向自主 UAS 工程
          detail: Tekever 开始开发固定翼和战术无人机系统，将分布式系统应用于航空电子与 ISR。
          tone: neutral
        - date: 2014-09
          label: 首笔外部创新拨款
          detail: 公司拿到首笔可追溯的外部创新资金，约 $819K，用于推进无人机空中监视原型走向成熟。
          tone: neutral
        - date: 2024-11
          label: €70M B 轮与主权业务扩张
          detail: Tekever 获 Baillie Gifford 领投的 €70M 融资，并得到北约创新基金（NIF）和英国 NSSIF 支持，以扩大国际生产。
          tone: positive
        - date: 2025-05
          label: 达到独角兽地位
          detail: Ventura Capital 领投的成长轮将 Tekever 估值推至 $1.33B，此前公司已在英吉利海峡和乌克兰投入运营。
          tone: positive
        - date: 2026-07
          label: 发布 AR6 重载平台
          detail: Tekever 推出 AR6 自主系统家族，将产品组合扩展到面向军事和工业任务的重载物流。
          tone: positive
        - date: 2026-08
          label: CORVUS £400M 英国国防部入选
          detail: 英国陆军选用 Tekever 的 AR5 系统参与 CORVUS 项目；这是一份为期 10 年、最高价值 £400 million 的合同，用于替换 Watchkeeper 无人机。
          tone: positive
        - date: 2026-09
          label: 收购 Flowcopter 推进技术
          detail: Tekever 收购总部位于爱丁堡的 Flowcopter，整合液压传动技术以提升重载飞行能力。
          tone: neutral
        - date: '2026-09-22'
          label: 与 Threod Systems 建立战略合作
          detail: 与爱沙尼亚 UAS 制造商 Threod Systems 签署战略谅解备忘录，扩大欧洲国防联合开发。
          tone: neutral
        - date: '2026-09-23'
          label: $580M D 轮，估值 $6.4B
          detail: 宣布由 UC Investments 与 Baillie Gifford 联合领投的 $580M D 轮融资，估值达到 $6.4B。
          tone: positive
    approximationNotes: 里程碑反映经核验的公开合同授标、产品发布时间和来自官方公告及行业媒体的投资公告。
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO007
      - CO009
      - CO010
      - CO014
      - CO015
  - id: FM001
    title: 市场规模与可触达需求层级
    type: pyramid
    summary: 展示从全球国防科技支出到 Tekever 已核验主权合同框架的分层市场规模。
    data:
      items:
        - label: 全球国防 C4ISR 与自主系统 TAM
          value: Multi-billion global spend
          details: 全球军方及政府在自主空中监视、电子设备和传感器系统上的总支出
        - label: 北约与欧洲主权 UAS SAM
          value: European regional C4ISR market
          details: 面向无 ITAR、原生欧洲 MALE、战术 ISR 平台以及情报即服务的可触达需求
        - label: 欧洲军用固定翼 MALE ISR
          value: Prime-dominated high-end MALE niche
          details: 长期由大型航空航天主承包商垄断的高载荷远程监视飞机细分市场
        - label: 双用途海事与边境巡逻服务
          value: Pan-European institutional surveillance spend
          details: 由海事安全机构、海岸警卫队和国土安全机构采购的运营型监视即服务
        - label: 英国主权国防框架分配
          value: Up to £400M over 10 years
          details: 英国陆军 CORVUS 项目为下一代主权战场监视能力设定的合同上限
        - label: Tekever 已执行框架 SOM 下限
          value: Operational multi-year programmes
          details: 覆盖英国国防部 CORVUS、葡萄牙空军 AR5 交付和乌克兰作战部署的活跃运营足迹
    approximationNotes: 各层代表机构市场范围；底层反映已确认的主权框架上限，而非已确认的年度收入。
    claimRefs:
      - CM001
      - CM006
      - CM007
      - CM008
  - id: FP001
    title: 竞争定位：硬件自主性与软件专业化
    type: quadrant
    summary: 按硬件垂直整合程度和软件自主深度，呈现欧洲无人防务厂商的相对位置。
    data:
      xAxis: 机体硬件整合（部件组装至内部复合材料制造）
      yAxis: 软件与任务自主深度（基础自动驾驶至高级 AI 与 EW 边缘智能）
      points:
        - label: Tekever
          x: 8.5
          'y': 8
          details: Fully vertically integrated composites (Swindon) combined with ATLAS AI and proven Ukraine EW resilience.
        - label: Helsing
          x: 1.5
          'y': 9.5
          details: Pure software military AI leader; hardware-agnostic integration across pan-European combat systems.
        - label: Quantum Systems
          x: 7
          'y': 6.5
          details: German tactical eVTOL hardware leader with proven battlefield ISR software capabilities.
        - label: 传统主承包商（Watchkeeper）
          x: 5.5
          'y': 3.5
          details: >-
            High legacy capital expenditure but challenged software adaptability and vulnerable operational
            availability.
        - label: Altus-LSA
          x: 6
          'y': 4.5
          details: Regional uncrewed systems innovator with modular payloads but narrower sovereign programme scale.
        - label: 盟军内部自研
          x: 4
          'y': 3
          details: Government laboratory and military organic build efforts with limited commercial manufacturing agility.
    approximationNotes: 依据公开技术规格、作战飞行小时和工业制造整合程度的比较分析，按 1.0 至 10.0 进行序数评分。
    claimRefs:
      - CP002
      - CP004
      - CP006
      - CP008
  - id: FI001
    title: 收入模式桥接与尚未量化的毛利转化
    type: flow
    summary: TEKEVER 将主权或机构任务需求转为生产和 / 或托管运营，但公开证据尚不足以量化最终形成的毛利。
    data:
      nodes:
        - id: mission-demand
          label: 客户任务需求
          detail: 监视、国防、安全或环境监测需求
        - id: procurement
          label: 合同或任务订单
          detail: 商业条款、最低承诺和时间安排未公开披露
        - id: build
          label: 集成系统生产
          detail: 飞机、传感器、软件、工程、质量和制造投入
        - id: deliver
          label: 交付与验收
          detail: 里程碑和收入确认触发条件未公开披露
        - id: operate
          label: 托管 ISR 运营
          detail: TEKEVER 还描述了一项托管情报与监视服务
        - id: revenue
          label: 产品与服务收入
          detail: 结构、金额、经常性和集中度未公开披露
        - id: gross-profit
          label: 毛利
          detail: 直接生产和服务成本不可得，因此无法量化转化
    approximationNotes: 仅作定性运营链路展示；未据此推断流线宽度、转化率、收入金额或毛利率。
    claimRefs:
      - CI001
      - CI002
      - CI011
      - CI012
      - CI016
  - id: FE001
    title: Tekever 端到端产品与技术架构
    type: stack
    summary: 六层架构模型覆盖物理机体制造、航空电子协议、多传感器载荷采集、通信数据链、机载边缘 AI 融合和云端分析。
    data:
      layers:
        - label: 传感与数据采集层
          detail: 集成光学、红外、雷达和应急收发器的多传感器载荷。
          modules:
            - 光电与红外（EO/IR）成像转塔
            - 专用海上搜索雷达系统
            - 自动识别系统（AIS）收发器
            - EPIRB 应急信标搜索天线
        - label: 机体与机械系统层
          detail: 复合材料结构、先进推进系统和不依赖跑道的飞行控制。
          modules:
            - 轻量化复合材料机体结构
            - Flowcopter 液压传动推进系统
            - 内置远程燃料电池与配电系统
            - 自动起飞与着陆（ATOL）装置
        - label: 航空电子与实时飞控层
          detail: 加固型实时计算和确定性的多协议通信总线。
          modules:
            - 运行加固型 RTOS / 嵌入式 Linux 的飞行计算机
            - MAVLink 与 DroneCAN 子系统间总线
            - DO-178C 与 ARP4754A 安全认证基线
            - 自主航点导航与失效保护逻辑
        - label: 通信与数据链织网层
          detail: 具备自动切换能力的冗余视距与卫星数据链。
          modules:
            - 视距（LoS）高带宽无线电数据链
            - 超视距（BLoS）卫星上行 / 下行链路
            - 动态 LoS/BLoS 自主切换控制器
            - 端到端加密的指令与遥测流
        - label: 边缘智能与 ATLAS 处理层
          detail: 机载神经计算机视觉和自动化多传感器航迹关联。
          modules:
            - 机载边缘计算加速器
            - ATLAS 实时自动目标识别（ATR）
            - 多传感器空间与时间数据融合
            - 低带宽可执行目标元数据压缩
        - label: 云端运营与服务交付层
          detail: 企业云编排、自动化 MLOps 流水线和客户门户。
          modules:
            - Google Cloud 企业分析基础设施
            - Docker 容器与 Kubernetes 集群编排
            - Apache Airflow 与 Spark 分布式 MLOps 流水线
            - 安全的客户监视即服务门户
    approximationNotes: 该架构综合整理自 Tekever 工程规格、职位描述和技术贸易资料。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
      - CE008
      - CE010
  - id: FU001
    title: 机构采用与扩张路径
    type: journey-map
    summary: 一条有来源支撑、从任务需求走向部署的客户路径；续约与扩张仍是主要证据缺口。
    data:
      items:
        - label: 1. 任务需求
          detail: 政府或专业运营商定义 ISR、海事安全、边境或应急响应任务。
          touchpoints:
            - 战术 ISR
            - 海上监视
            - 野火探测
        - label: 2. 评估与选型
          detail: 买方评估平台续航、通信、载荷、运营模式和主权要求。
          touchpoints:
            - 运营适配度
            - 采购流程
            - 技术保障
        - label: 3. 签约
          detail: 合作转化为直接平台采购、项目授标或托管监视服务。
          touchpoints:
            - 供应合同
            - 框架或项目上限
            - 托管 ISR 服务
        - label: 4. 交付与集成
          detail: 飞机、通信、分析、培训和支持必须接入客户运营。
          touchpoints:
            - 计划交付
            - 运营商就绪度
            - 任务系统集成
        - label: 5. 实时运营
          detail: 客户使用该系统执行国防、海事、边境、环境或应急任务。
          touchpoints:
            - 任务使用率
            - 可用性与事故数据
            - 运营结果
        - label: 6. 续约与扩张
          detail: 业务韧性取决于交付验收、任务订单的执行、续约、机队扩张和支持服务收入。
          touchpoints:
            - 续约率
            - 扩张订单
            - 留存与集中度
    approximationNotes: 该序列综合已观察到的合作状态；它不是经过测量的转化漏斗，目前也没有各阶段的转化率数据。
    claimRefs:
      - CU008
      - CU010
      - CU011
      - CU012
      - CU013
      - CU015
  - id: FR001
    title: 风险严重程度与发生可能性评估矩阵
    type: matrix
    summary: 按剩余严重程度和发生概率，评估 Tekever 面临的关键运营、主权、监管和估值风险。
    data:
      columns:
        - 可忽略
        - 较低
        - 中等
        - 高严重度
        - 关键
        - 灾难性
      rows:
        - label: 高可能性
          values:
            - null
            - null
            - label: 正常运营波动
            - label: 主权采购集中度
            - null
            - null
        - label: 中等可能性
          values:
            - null
            - label: 小型部件交付周期
            - label: SATCOM 链路延迟风险
            - label: 估值倍数收缩
            - null
            - null
        - label: 低可能性
          values:
            - null
            - null
            - label: 次级供应商中断
            - label: 两用物项出口许可限制
            - label: 前线飞行系统故障
            - null
    approximationNotes: 可能性与严重度分级是定性分析的综合判断，依据包括已报告的运营要求、合同条款和融资里程碑。
    claimRefs:
      - CR001
      - CR005
      - CR009
      - CR010
      - CR011
      - CR013
  - id: FV001
    title: 建议逻辑决策链
    type: flow
    summary: 把运营验证、主权合同中标、估值压力和持续跟踪建议串成一条逻辑链。
    data:
      nodes:
        - id: combat-validation
          label: 作战验证：乌克兰境内飞行时长超过 50,000 小时
        - id: operational-scale
          label: 运营规模：固定翼 AR3 和 AR5 已获部署验证
        - id: sovereign-anchor
          label: 采购锚点：英国国防部 £400M Project CORVUS 合同
        - id: valuation-stepup
          label: 估值重估：$580M D 轮融资，估值 $6.4B
        - id: financial-opacity
          label: 财务透明度不足：未经审计的收入、利润率和提款计划
        - id: final-recommendation
          label: 建议：持续跟踪（估值偏高，风险评级高）
      edges:
        - from: combat-validation
          to: operational-scale
        - from: operational-scale
          to: sovereign-anchor
        - from: sovereign-anchor
          to: valuation-stepup
        - from: valuation-stepup
          to: financial-opacity
        - from: financial-opacity
          to: final-recommendation
    approximationNotes: 该图展示了连接技术证据、合同里程碑和财务风险的决策流程。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV010
      - CV016
