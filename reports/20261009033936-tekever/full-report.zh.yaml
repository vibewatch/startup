      - number: '2.2'
        title: TAM、SAM 与受证据约束的规模视角
        blocks:
          - type: paragraph
            body: >-
              第三方估算差异很大，评估 Tekever 的可服务市场，必须把宏观防务科技支出拆成不同机构视角。全球 TAM 由军方和政府在自主航空系统及 C4ISR
              基础设施上的防务科技支出，构成数十亿美元机会；二级交易可比公司和主题筛选数据显示，公开传感器及防务承包商可比公司的估值在 €3.6b 至 €8.9b 之间。欧洲 SAM 聚焦北约盟国对海事态势感知、边境保护和
              MALE ISR 服务的主权需求，形成由英国国防部、European Maritime Safety Agency 和葡萄牙空军等机构项目驱动的聚焦机会。Tekever
              的可服务可获得市场（SOM）有具体多年期机构授予作为支撑，包括 10 年最高 £400m 的英国国防部 Project CORVUS 框架、葡萄牙空军 AR5
              采购，以及乌克兰持续进行的远程情报任务；在实际作战环境中，自主系统已证明关键作用。
