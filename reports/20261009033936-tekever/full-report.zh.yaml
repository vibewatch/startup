      - number: '7.4'
        title: 估值可持续性、资本密集度与信息不对称
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月，Tekever 完成由 UC Investments 和 Baillie Gifford 领投的 $580m Series D 首次交割，将公司估值推至
              $6.4b，接近上一年度披露估值的五倍。如此陡峭的倍数扩张，在没有公开披露经审计财务报表、历史收入拆分和单位层面毛利率数据的情况下，放大了估值下行和股权稀释风险。EquityZen
              等私人股权二级市场显示投资者需求仍在，但资本表清算优先权和营运资本消耗仍存在持续信息缺口。如果防务风险投资降温，或主权项目下的任务订单转化落后于激进增长里程碑，Tekever 可能面临估值压缩或下轮重组。
            claimRefs:
