  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Tekever 所处市场由主权防务情报、监视与侦察（ISR）以及海事态势感知定义，而不是泛化的商业无人机或小型消费级无人机。Tekever
              瞄准的是价格可负担、具备长航程和高载荷能力的中空长航时（MALE）固定翼无人航空系统，以及全托管 Intelligence-as-a-Service
              解决方案。纳入支出包括政府和机构对自主固定翼机体、机载传感器载荷、合成孔径雷达、卫星通信集成和交钥匙运营监视服务的采购。排除支出包括战术四旋翼、消费娱乐型
              UAV、业余配件及无关的企业巡检服务。现状替代方案主要是昂贵的载人海上巡逻机、有人驾驶监视直升机、轨道卫星任务调度，以及传统航空航天巨头提供的老一代 MALE 平台；这些方案资本成本高昂、采购周期漫长。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
