      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              北约盟国的结构性顺风推动市场扩张：东欧地缘政治摩擦升级、对主权国内制造和技术独立性的需求上升，以及机构对持续广域海事态势感知的要求。自主 UAS 在乌克兰的运营部署已累计超过 10,000
              个战斗飞行小时，并支持对高价值防空资产实施精确打击，证明自主系统相较传统载人资产具备成本效益。但采用仍受主权采购官僚程序、超视距（BVLOS）运营严格空域整合规定、卫星通信带宽依赖以及传统航空航天巨头竞争等关键因素限制。分析缺口集中在框架上限转化为已执行任务订单的比例，以及独立经审计商业合同披露的稀缺性。
