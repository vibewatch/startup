        title: 展示材料
        blocks:
          - type: callout
            title: 欧洲防务中的 MALE UAS 市场缺口
            body: >-
              NATO Innovation Fund 的研究指出，欧洲防务领域小型战术无人机进入者激增，而大型主承包商长期垄断昂贵的高端平台。Tekever 的竞争切口在于交付价格可负担、软件驱动、具备长航程和高载荷能力的
              MALE 系统，填补一次性小型无人机与成本高昂的传统航空航天项目之间的能力缺口。
            calloutType: insight
