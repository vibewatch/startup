  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：主承包商、软件纯玩家与战术专家
        blocks:
          - type: paragraph
            body: >-
              欧洲防务无人航空系统（UAS）和战场自主市场，分为传统防务航空航天巨头、软件优先的自主开发商和专业 UAS 机体创新者。Thales、Elbit Systems 和 MBDA 等传统巨头，过去凭借英国陆军
              Watchkeeper WK450 等大额多年期合同主导主权军方采购。然而，乌克兰战场观察到的实际损耗表明，传统平台存在严重部署脆弱性、官僚式开发周期长和单台采购成本高等问题。面对这些
              既有厂商，新一代欧洲进入者已从技术栈的不同环节切入。Helsing 代表软件优先的纯玩家模式，通过把人工智能操作层部署在盟军硬件上、但不拥有机体制造能力，估值达到 $18b。Quantum Systems
              则代表战术 ISR 和 eVTOL 硬件层，基准估值 $8b，重点优化前线步兵侦察。Tekever 通过垂直整合架构区别于这两种模式：公司设计并制造模块化、长航时复合材料机体（如 AR3 Evo 和
              AR5），同时保留自有软件、通信和托管 Intelligence-as-a-Service 交付能力。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
