callouts:
- calloutType: insight
  title: The MALE UAS Market Gap in European Defense
  body: As identified by the NATO Innovation Fund, European defense has seen a surge in small tactical drone entrants, while large prime contractors have historically monopolized expensive high-end platforms. Tekever’s competitive wedge lies in delivering affordable, software-centric MALE systems with long range and high payload capacity, bridging the capability gap between expendable small drones and cost-prohibitive legacy aerospace programs.
  claimRefs:
  - CM001
  - CM002
- calloutType: risk
  title: Sovereign Framework Drawdown Uncertainty
  body: While marquee contract selections like the £400 million UK MoD CORVUS programme establish substantial TAM credibility, framework agreements represent upper-ceiling procurement vehicles rather than guaranteed revenue schedules. Diligence must focus on the actual task order execution rate and sovereign budgetary appropriations.
  claimRefs:
  - CM008
  - CM010
