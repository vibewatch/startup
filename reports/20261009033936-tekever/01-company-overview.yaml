callouts:
  - calloutType: "strength"
    title: "Sovereign Dual-Use Demand and Prime Contractor Positioning"
    body: "Tekever has successfully transitioned from an emerging technology developer into a tier-one sovereign defence supplier, underscored by its £400 million 10-year British Army CORVUS contract and backings from the NATO Innovation Fund and UK NSSIF. Unlike pure-play hardware manufacturers, Tekever's vertically integrated stack and Intelligence-as-a-Service model generate operational lock-in across critical government customers."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO007"
      - "CO015"
  - calloutType: "risk"
    title: "Valuation Velocity vs. Financial Transparency Gap"
    body: "Tekever's valuation has surged from $1.33 billion in May 2025 to $6.4 billion in September 2026—a nearly five-fold expansion in 16 months. While peer multiples across defence technology (e.g., Helsing, Anduril) reflect elevated sector tailwinds, Tekever maintains private financial opacity with zero disclosed multi-year audited revenues, gross margins, or task-order drawdown schedules."
    claimRefs:
      - "CO001"
      - "CO009"
      - "CO010"
      - "CO016"
