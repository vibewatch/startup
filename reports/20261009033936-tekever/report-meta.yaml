  topStrengths:
    - Combat-proven AR3 / AR5 autonomy and >50,000 operational flight hours in Ukraine
    - Sovereign demand anchors from UK MoD CORVUS and other public-sector customers
    - Institutional capital support from UC Investments, Baillie Gifford, and existing backers
    - Vertically integrated hardware-software stack across multiple UK and Portugal sites
  topRisks:
    - Audited multi-year financial statements and margin structure are still undisclosed
    - Framework ceilings and programme wins may not convert into committed backlog or cash
    - Cap-table, liquidation preference, and dilution mechanics remain opaque
