      - number: '4.3'
        title: The Series D expands capacity but does not establish runway
        blocks:
          - type: paragraph
            body: >-
              Independent reporting says the September 2026 Series D first close was $580 million at a $6.4 billion
              valuation, with most rather than all of the planned round closed and further closings expected. Uses
              include international expansion, manufacturing, technology capacity, and acquisitions. That financing
              materially improves access to capital, but funding raised is not cash available: the public record
              provides no cash balance, burn rate, debt schedule, acquisition consideration, or restricted-use
              breakdown. Bloomberg's earlier report that talks for as much as €500 million at a €5.5 billion valuation
              were ongoing and subject to change also demonstrates how quickly financing terms moved. Runway and the
              next financing trigger cannot be calculated from the assigned evidence.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The strongest positive signal is the combination of institutional financing, a vertically integrated
              offering, and access to large government programmes. The counterweight is severe information asymmetry: no
              audited P&L, revenue series, gross margin, free cash flow, customer concentration, backlog conversion, or
              unit-economics bridge appears in the reviewed public sources. The model also carries simultaneous demands
              from production expansion, international delivery, technology development, and acquisitions. Until a data
              room reconciles signed orders to deliveries, recognized revenue, cash collections, direct costs, and
              working capital, TEKEVER's revenue quality, margin path, and capital adequacy cannot be underwritten with
              confidence.
            claimRefs:
              - CI003
              - CI004
              - CI010
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Programme ceiling is not revenue
            body: >-
              The CORVUS figure is stated as worth up to £400 million over ten years. Underwriting requires committed
              orders, delivery milestones, acceptance terms, and payment timing before any portion is modeled as revenue
              or cash.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
          - type: callout
            title: Gate the investment on data-room economics
            body: >-
              Require audited statements, contract-level backlog conversion, gross-margin bridges, cash and debt
              schedules, and customer concentration before relying on the latest financing as evidence of durable
              financial capacity.
            calloutType: recommendation
            claimRefs:
              - CI010
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Platform Capabilities
        blocks:
          - type: paragraph
            body: >-
              Tekever designs, manufactures, and operates an integrated family of autonomous uncrewed aircraft systems
              (UAS) engineered specifically for demanding maritime domain awareness and border surveillance missions.
              The operational flagship is the AR5 uncrewed aircraft system, a medium-altitude, long-endurance fixed-wing
              platform engineered to conduct extended maritime reconnaissance missions. The AR5 features an aerodynamic
              composite airframe with physical dimensions of 4.3 meters in fuselage length by 3.0 meters in wingspan,
              supporting a maximum takeoff weight (MTOW) of 150 kilograms. Configured with internal fuel capacity and
              aerodynamic efficiency for sustained loiter, the platform operates continuously for up to 12 hours beyond
              line of sight (BLOS), providing persistent maritime coverage over expansive exclusive economic zones
              (EEZs) that traditionally required expensive crewed maritime patrol aircraft. The platform incorporates
              automatic take-off and landing (ATOL) flight control software capable of operating from short, unpaved
              runways as well as conventional aviation infrastructure. Beyond the AR5, Tekever deploys the tactical AR3
              net-centric system for land and coastal reconnaissance, and in July 2026 unveiled the AR6 family to extend
              its portfolio into sovereign UK heavy-lift autonomous logistics. Together, these platforms have
              accumulated more than 100,000 operational flight hours across European, North American, and allied
              operational environments.
