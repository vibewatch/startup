      - number: '5.3'
        title: Surveillance-as-a-Service Delivery Model and Operational Workflows
        blocks:
          - type: paragraph
            body: >-
              Tekever differentiates operationally by packaging its uncrewed aviation hardware and analytics into an
              end-to-end surveillance-as-a-service delivery model. Rather than forcing government defense and maritime
              safety agencies to procure airframes, build internal maintenance depots, and train dedicated flight crews,
              Tekever provides turnkey maritime intelligence. Under this structure, Tekever owns and maintains the
              aircraft systems, deploys certified flight operators and ground control stations, manages line-of-sight
              and beyond-line-of-sight satellite communications links, and delivers actionable, geo-referenced
              surveillance feeds directly into client command operations centers. This delivery model is exemplified by
              Tekever's €30 million framework agreement with the European Maritime Safety Agency (EMSA) to provide
              dedicated AR5 surveillance across Nordic and Baltic maritime zones, as well as operational patrols for the
              UK Home Office and border security agencies. By converting large capital equipment procurement cycles into
              recurring operational contracts, Tekever lowers procurement friction for government buyers while capturing
              high-margin recurring software and data revenue. The operational validity of this approach is backed by
              more than 100,000 flight hours in demanding maritime environments, demonstrating mission availability and
              target detection rates that rival conventional crewed surveillance aircraft.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE014
          - type: table
            tableRef: TE002
