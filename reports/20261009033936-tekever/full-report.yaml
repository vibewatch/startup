figures:
  - id: FO001
    title: Tekever Corporate and Capitalization Milestone Timeline
    type: timeline
    summary: >-
      Chronology of foundational corporate events, major financing rounds, and sovereign defence contract milestones
      from 2001 to 2026.
    data:
      items:
        - date: '2001'
          label: Corporate Founding in Lisbon
          detail: >-
            Ricardo Mendes, Pedro Sinogas, and classmates from Instituto Superior Técnico incorporate Tekever to develop
            distributed computing software.
          tone: neutral
        - date: '2009'
          label: Autonomous UAS Engineering Pivot
          detail: >-
            Tekever initiates development of fixed-wing and tactical uncrewed aerial systems, applying distributed
            systems to avionics and ISR.
          tone: neutral
        - date: 2014-09
          label: Initial External Grant Capital
          detail: >-
            Company secures first tracked external innovation funding of approximately $819K to mature unmanned aerial
            surveillance prototypes.
          tone: neutral
        - date: 2024-11
          label: €70M Series B & Sovereign Expansion
          detail: >-
            Tekever raises €70 million led by Baillie Gifford and backed by the NATO Innovation Fund (NIF) and UK NSSIF
            to scale international production.
          tone: positive
        - date: 2025-05
          label: Unicorn Status Achievement
          detail: >-
            Growth round led by Ventura Capital values Tekever at $1.33 billion following operational deployment in the
            English Channel and Ukraine.
          tone: positive
        - date: 2026-07
          label: AR6 Heavy Lift Platform Unveiled
          detail: >-
            Tekever introduces AR6 autonomous system family, expanding its portfolio into heavy lift logistics for
            military and industrial missions.
          tone: positive
        - date: 2026-08
          label: CORVUS £400M UK MoD Selection
          detail: >-
            British Army selects Tekever's AR5 system for Project CORVUS, a 10-year contract worth up to £400 million to
            replace Watchkeeper drones.
          tone: positive
        - date: 2026-09
          label: Flowcopter Propulsion Acquisition
          detail: >-
            Tekever acquires Edinburgh-based Flowcopter to integrate hydraulic transmission technology for enhanced
            heavy-payload flight capabilities.
          tone: neutral
        - date: '2026-09-22'
          label: Threod Systems Strategic Partnership
          detail: >-
            Signs strategic memorandum of understanding with Estonian UAS manufacturer Threod Systems to expand European
            defence co-development.
          tone: neutral
        - date: '2026-09-23'
          label: $580M Series D at $6.4B Valuation
          detail: >-
            Announces $580 million Series D financing co-led by UC Investments and Baillie Gifford, reaching $6.4
            billion valuation.
          tone: positive
    approximationNotes: >-
      Milestones reflect verified public contract awards, product launch dates, and investment announcements from
      official releases and industry press.
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO007
      - CO009
      - CO010
      - CO014
      - CO015
