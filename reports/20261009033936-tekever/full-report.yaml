            body: >-
              Large sovereign defence programme selections, such as the UK Ministry of Defence's CORVUS award valued at
              up to £400 million over ten years, provide long-term contract ceiling visibility but do not guarantee
              immediate cash drawdowns. Budgetary reprioritization or administrative delays in task-order issuance pose
              substantial cash timing risks.
            calloutType: risk
            claimRefs:
              - CR007
