  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Government-led customer mix
        blocks:
          - type: paragraph
            body: >-
              Tekever's visible customer base is concentrated in institutional missions rather than ordinary enterprise
              purchasing. An independently edited operator list names defence, policing, maritime, and
              emergency-response organizations across Europe, Africa, North America, South America, and Southeast Asia,
              while company and third-party descriptions position the AR3 and AR5 around tactical ISR, border and
              coastal security, search and rescue, fisheries control, and environmental monitoring. The commercial model
              also varies by buyer: EquityZen describes surveillance-as-a-service, and Houlihan Lokey describes a
              managed ISR service for a global customer base, alongside direct aircraft procurement. This supports a
              segmentation between sovereign defence forces, civil-security agencies, and dual-use operators. It does
              not establish the revenue mix, payer economics, or relative durability of those segments.
