      - number: '1.3'
        title: Capitalization History, Sovereign Backers, and Valuation Expansion
        blocks:
          - type: paragraph
            body: >-
              Tekever's balance sheet underwent massive multi-stage expansion between 2024 and 2026 as European
              sovereign defence priorities accelerated capital flows into autonomous aerospace. After bootstrapping
              early operations with research grants and early venture backing from Iberis Capital and Cedrus Capital,
              Tekever raised a €70 million Series B round in late 2024 led by Baillie Gifford and backed by the NATO
              Innovation Fund (NIF), alongside the UK National Security Strategic Investment Fund (NSSIF) and Silicon
              Valley's Crescent Cove Advisors. By May 2025, secondary transactions and growth equity investments led by
              Ventura Capital valued Tekever between $1.25 billion and $1.33 billion, formally establishing unicorn
              status. On September 23, 2026, Tekever announced the first close of a landmark $580 million Series D
              financing co-led by UC Investments (marking the University of California investment office's first direct
              investment in Europe) and Baillie Gifford, catapulting the company's valuation to $6.4 billion. However,
              unaudited multi-year financial statements and lack of disclosed revenue multiples represent ongoing
              analytical constraints for institutional investors.
