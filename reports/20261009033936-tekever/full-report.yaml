  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The market for Tekever is defined by sovereign defence intelligence, surveillance, and reconnaissance
              (ISR) and maritime domain awareness, rather than generic commercial or small consumer drones. Tekever
              targets the specific segment for affordable Medium Altitude Long Endurance (MALE) fixed-wing unmanned
              aerial systems with extended operational range and high payload capacity, alongside fully managed
              Intelligence-as-a-Service solutions. Included spend comprises government and institutional procurement of
              autonomous fixed-wing airframes, onboard sensor payloads, synthetic aperture radar, satellite
              communications integration, and turn-key operational surveillance services. Excluded spend encompasses
              tactical quadcopters, consumer recreational UAVs, hobby accessories, and unrelated enterprise inspection
              services. Status-quo substitutes primarily consist of expensive crewed maritime patrol aircraft, piloted
              surveillance helicopters, orbital satellite tasking, and legacy MALE platforms supplied by traditional
              aerospace primes that impose prohibitive capital costs and lengthy acquisition timelines.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
      - number: '2.2'
        title: TAM, SAM, and evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing Tekever’s addressable market requires decomposing macro defense technology spending into segmented
              institutional lenses, given the wide variance in third-party estimates. At the global TAM layer, military
              and government defense technology spending on autonomous aerial systems and C4ISR infrastructure
              represents a multi-billion dollar opportunity, with secondary transaction comparables and thematic
              screeners valuing public sensor and defense contractor comparables from €3.6 billion to €8.9 billion. At
              the European SAM layer, sovereign NATO-allied demand for maritime domain awareness, border protection, and
              MALE ISR services forms a focused opportunity driven by institutional programmes across the UK Ministry of
              Defence, European Maritime Safety Agency, and Portuguese Air Force. Tekever’s serviceable obtainable
              market (SOM) is evidenced by concrete multi-year institutional awards, including the UK MoD Project CORVUS
              framework valued at up to £400 million over ten years, the Portuguese Air Force AR5 procurement, and
              ongoing long-range intelligence missions in Ukraine where autonomous systems have proven critical under
              operational conditions.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
