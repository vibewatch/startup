      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              Tekever operates under the long-standing executive direction of Founder and Chief Executive Officer
              Ricardo Mendes, who oversees global operational execution, defence procurement alignment, and corporate
              capitalization strategy. Co-founders Pedro Sinogas and Vitor Cristina spearheaded early architecture and
              technical strategy, with Pedro Sinogas maintaining ongoing governance and corporate leadership roles
              across Tekever entities. In September 2026, the company broadened its strategic governance bench by
              welcoming Sir Ben Wallace, former UK Secretary of State for Defence and current Portfolio Manager at
              Merlyn Advisors, as a strategic investor representative. Sir Ben Wallace's appointment adds sovereign
              defence procurement expertise as Tekever scales delivery of major British and European military contracts.
              Operational engineering leadership is distributed across composite manufacturing hubs in Swindon and
              advanced flight testing centers in West Wales and Portugal, though high reliance remains placed on Chief
              Executive Officer Ricardo Mendes for sovereign customer negotiations and institutional funding alignment.
            claimRefs:
