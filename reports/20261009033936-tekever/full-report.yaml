      - number: '7.3'
        title: Customer Concentration and Sovereign Procurement Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Tekever's revenue generation remains highly concentrated within a small cohort of government institutions
              and sovereign defense bodies, including the UK Home Office, the UK Ministry of Defence, the European
              Maritime Safety Agency, and the Portuguese Air Force. Long-term sovereign frameworks provide multi-year
              backlog visibility, but they expose Tekever to sovereign budget shifts, political realignment, procurement
              protest litigation, and administrative delays in task-order drawdowns. Framework ceilings do not represent
              committed, front-loaded cash flow. In addition, reliance on strategic partnerships—such as teaming
              arrangements with Threod Systems for tactical UAS integration and iCOMAT for advanced composites
              manufacturing—creates operational dependency on sub-tier industrial partners whose performance directly
              impacts Tekever's delivery milestones.
