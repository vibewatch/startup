  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Architecture
        blocks:
          - type: paragraph
            body: >-
              Tekever operates across defence, aerospace, and maritime surveillance domains that are heavily governed by
              stringent European Union and United Kingdom regulatory regimes. As an unmanned aerial systems manufacturer
              and surveillance-as-a-service provider deploying platforms such as the AR3, AR4, and AR5 in sensitive
              operational zones—including the English Channel for the UK Home Office and combat intelligence missions in
              Ukraine—the company is exposed to rigorous dual-use export control laws, military equipment licensing
              hurdles, and international air traffic integration mandates. Changes in sovereign procurement standards or
              bilateral export restrictions between the UK, Portugal, and third-party customer nations create material
              friction for delivery schedules. Furthermore, operating beyond visual line of sight requires ongoing
              national civil and military aviation safety approvals that limit deployment velocity.
            claimRefs:
              - CR001
              - CR002
