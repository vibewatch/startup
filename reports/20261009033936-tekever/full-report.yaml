      - number: '7.2'
        title: Operational Scaling, Quality Control, and Sub-Tier Supply Dependencies
        blocks:
          - type: paragraph
            body: >-
              The rapid expansion of Tekever's production footprint across the UK and Portugal introduces acute
              operational execution and quality control risks. Scaling manufacturing to fulfil multi-year government
              commitments—such as the UK Ministry of Defence CORVUS surveillance programme valued at up to £400 million
              over ten years—demands flawless execution in composite airframe fabrication, high-capacity satellite
              communications integration, and AI-enabled mission avionics assembly. Open technical and recruitment
              postings reveal ongoing critical operational challenges, specifically in resolving latency bottlenecks for
              satellite communications and maintaining high aerodynamic endurance during 20-hour operational sorties in
              adverse sea weather. Any component failure, avionic software defect, or composite manufacturing flaw could
              jeopardize frontline military operations and trigger contract penalties.
            claimRefs:
