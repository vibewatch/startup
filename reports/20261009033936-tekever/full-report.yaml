      - number: '6.3'
        title: Durability, concentration, and operating risk remain unquantified
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence does not disclose net revenue retention, gross revenue retention, logo churn,
              renewal rates, contract duration by customer, or revenue concentration. That omission is material because
              most named proof is tied to sovereign agencies whose procurement schedules and optional programme ceilings
              may diverge from annual billings. The customer proposition also carries demanding implementation
              requirements: Tekever's careers page highlights satellite-communications latency, 20-hour aerodynamics,
              and AI identification in extreme sea conditions. Historical evidence is not uniformly positive; the
              operator record cites a 2014 report that a Portuguese Navy drone crashed on its first takeoff. This single
              historical reference does not establish present reliability, but it reinforces the need for fleet-level
              availability, incident, loss, support, and renewal data before underwriting durable adoption.
