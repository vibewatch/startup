          - type: callout
            title: Avionics and Sensor Supply Chain Vulnerability
            body: >-
              Tekever remains exposed to external supply disruptions for advanced avionics microprocessors, specialized
              radar units, and electro-optical sensors, creating delivery risks against expanding multi-year sovereign
              defence programmes.
            calloutType: risk
            claimRefs:
