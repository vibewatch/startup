      versus software autonomy depth.
    data:
      xAxis: Airframe Hardware Integration (Component Assembly to In-House Composite Manufacturing)
      yAxis: Software & Mission Autonomy Depth (Basic Autopilot to Advanced AI & EW Edge Intelligence)
      points:
