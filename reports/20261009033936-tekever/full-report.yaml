        - label: Helsing
          x: 1.5
          'y': 9.5
          details: Pure software military AI leader; hardware-agnostic integration across pan-European combat systems.
        - label: Quantum Systems
          x: 7
          'y': 6.5
          details: German tactical eVTOL hardware leader with proven battlefield ISR software capabilities.
        - label: Legacy Primes (Watchkeeper)
