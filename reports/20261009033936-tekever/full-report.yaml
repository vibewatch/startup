      - number: '5.2'
        title: Technology Architecture, Avionics, and Edge Intelligence
        blocks:
          - type: paragraph
            body: >-
              The technological foundation of Tekever's platform resides in its digital avionics core and proprietary
              artificial intelligence stack. Onboard the AR5, vehicle systems communicate across a deterministic,
              fault-tolerant bus architecture implementing MAVLink, DroneCAN, IP networking, and industrial serial
              protocols (RS232/422/485). Flight stabilization and flight-critical command execution run on embedded
              real-time operating systems (RTOS) and hardened Embedded Linux distributions, with systems engineering and
              software lifecycle processes structured to satisfy aerospace airworthiness standards including DO-178C and
              ARP4754A. The aircraft carries a multi-sensor payload combining electro-optical and infrared (EO/IR)
              gyrostabilized imaging turrets, a dedicated maritime search radar for surface vessel tracking, automated
              identification system (AIS) receivers, and emergency position-indicating radiobeacon (EPIRB) antennas.
              Rather than downlinking raw video feeds across constrained satellite links, onboard compute units execute
              the ATLAS intelligence software to run neural computer vision models at the tactical edge. ATLAS performs
              multi-sensor data fusion, automatically detecting, tracking, and classifying vessels against maritime
              registries in real time. At the enterprise tier, Tekever maintains a scalable data platform on Google
              Cloud using Docker and Kubernetes clusters, orchestrating automated machine learning pipelines with Apache
              Airflow and Spark to continuously ingest telemetry and refine detection models.
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
