            title: Headline programme value is not customer durability
            body: >-
              CORVUS is described as worth up to GBP 400 million over ten years. Without firm-order drawdown,
              acceptance, renewal, utilization, and customer-level revenue data, that ceiling cannot substitute for
              backlog, retention, or recognized revenue.
