  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Financing Context
        blocks:
          - type: paragraph
            body: >
              Tekever has established itself as a leading European autonomous unmanned aerial systems (UAS)
              manufacturer, demonstrating significant operational validation across high-intensity environments. The
              company's platforms, most notably the AR3 and AR5 fixed-wing autonomous drones, have accumulated over
              50,000 operational flight hours in Ukraine since 2022, providing critical battlefield intelligence,
              surveillance, target acquisition, and reconnaissance (ISTAR). This frontline operational pedigree
              positioned Tekever to capture major sovereign procurement wins, culminating in July 2026 when the UK
              Ministry of Defence selected Tekever to deliver Project CORVUS, the British Army's next-generation
              surveillance capability under a framework programme valued at up to £400 million over ten years.


              Building on this commercial traction, Tekever announced the first close of a $580 million Series D
              financing round on September 23, 2026, valuing the enterprise at $6.4 billion post-money. The round was
              co-led by UC Investments (University of California) in its first direct European investment and long-term
              backer Baillie Gifford, alongside strategic participation from Merlyn Advisors and existing investors
              Crescent Cove, Ventura Capital, and Iberis Capital. This financing elevates Tekever's cumulative equity
              funding to $677 million across 15 financing events, marking an extraordinary step-up from its May 2025
              Series B valuation mark of $1.33 billion and earlier €70 million funding tranche.


              However, the $6.4 billion entry valuation introduces substantial valuation stretch. The headline multiple
              reflects forward-looking sovereign defense euphoria rather than audited financial performance. Neither
              historical revenue run-rates, annual recurring revenue (ARR), gross margins, nor EBITDA figures are
              publicly audited or disclosed. While the £400 million CORVUS programme provides a notable sovereign demand
              anchor, defense framework agreements represent task-order ceilings rather than guaranteed immediate
              billings. Consequently, investors entering at $6.4 billion face an unhedged fundamental premium where
              common equity returns are sensitive to unverified contract conversion schedules and undisclosed capital
              structure preferences.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV011
              - CV012
      - number: '8.2'
        title: Recommendation Stance, Scenario Modeling, and Valuation Sensitivity
        blocks:
          - type: paragraph
            body: >
              Balancing proven operational capabilities against acute valuation overhang, our institutional stance on
              Tekever is established as track with a high risk rating and a stretched valuation verdict. At $6.4
              billion, underwriting fresh equity capital cannot be justified without granular data-room access to
              audited profit-and-loss statements, backlog task-order schedules, and senior liquidation preferences.
              While sovereign tailwinds in European dual-use autonomy remain robust, disciplined capital allocation
              dictates waiting for verifiable revenue realization and secondary pricing rationalization.


              Scenario modeling highlights the extreme skew between geopolitical momentum and operational execution. In
              the bull case, Tekever successfully converts the £400 million CORVUS contract into rapid multi-year
              hardware deliveries, accelerates European defense export contracts across NATO members, and scales
              high-margin intelligence-as-a-service software data feeds, justifying an $8.0 billion to $10.0 billion
              valuation in an eventual sovereign-backed IPO window. Conversely, in the base case, CORVUS task orders
              ramp gradually at £30 million to £40 million annually, while commercial maritime surveillance generates
              steady but modest contributions, resulting in an implied valuation range of $4.0 billion to $5.5
              billion—suggesting near-term multiple compression from current round levels.


              The bear case scenario illustrates severe downside risk, modeling an enterprise valuation of $1.5 billion
              to $2.5 billion. Downside triggers include government budgetary reallocation, delays in UK defense
              procurement task-order execution, international contract pushbacks, or emerging anti-drone electronic
              warfare countermeasures that degrade existing fixed-wing acoustic and radar signatures. Under this
              downside trajectory, failure to demonstrate standalone operating profitability would leave late-stage
              investors exposed to structured preference overhang and potential down-round recaps.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV010
              - CV016
      - number: '8.3'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              Tekever's organizational and corporate trajectory points toward a dual exit path: a European defense-tech
              public listing in London or Paris, or a strategic sale to an aerospace prime seeking autonomous systems
              integration. The appointment of prominent defense advisors and institutional participation from Baillie
              Gifford and UC Investments underscore long-term public market ambitions. Furthermore, the company has
              begun programmatic industrial expansion, acquiring Edinburgh-based hydraulic propulsion developer
              Flowcopter in September 2026 and establishing advanced manufacturing partnerships with composite
              specialist iCOMAT to industrialize AR5 airframe production.


              Nevertheless, several definitive thesis-break triggers must be monitored by prospective investors.
              Foremost among these is contract conversion integrity: any formal reduction, cancellation, or protracted
              procurement dispute regarding the UK MOD CORVUS framework would fundamentally impair Tekever's sovereign
              growth narrative. Additional triggers include material supply chain disruption in specialized aerospace
              composites or avionics, regulatory export control barriers blocking non-NATO deployments, or senior
              executive turnover within core engineering leadership.


              Before committing growth capital or underwriting secondary transactions at current levels, institutional
              diligence must answer three critical information gaps. First, investors must inspect three years of
              audited financial statements (FY2023–FY2025) to verify underlying revenue composition, hardware versus
              software margin mix, and historical cash burn. Second, the detailed 24-month task-order schedule for
              Project CORVUS must be audited to verify binding minimum procurement commitments. Finally, full cap-table
              visibility is required to assess liquidation preference hurdles, dividend accruals, and dilution impact on
              junior equity holders.
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Institutional Recommendation: Track with Strict Valuation Discipline'
            body: >-
              Tekever's premier operational standing in autonomous defense tech does not offset the lack of audited
              financial statements at a $6.4 billion valuation. Investors should track progress on Project CORVUS
              execution while requiring verified margin and cap-table data before investing.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV010
          - type: callout
            title: Valuation Multiple Compression and Framework Execution Risk
            body: >-
              The £400 million UK MoD Project CORVUS agreement represents an upper ceiling over a 10-year period, not
              guaranteed immediate cash. If task-order conversion slows or defense tech multiples re-rate downward,
              late-stage investors risk substantial valuation compression.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV014
