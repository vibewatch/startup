  - id: FE001
    title: Tekever End-to-End Product and Technology Architecture
    type: stack
    summary: >-
      Six-layer architectural model spanning physical airframe manufacturing, avionics protocols, multi-sensor payload
      acquisition, communication datalinks, onboard edge AI fusion, and cloud analytics.
    data:
      layers:
        - label: Sensing & Data Acquisition Layer
          detail: Multi-sensor payload integrating optical, infrared, radar, and emergency transceivers.
          modules:
            - Electro-Optical and Infrared (EO/IR) Imaging Turret
            - Dedicated Maritime Search Radar System
            - Automated Identification System (AIS) Transceiver
            - EPIRB Emergency Beacon Search Antenna
        - label: Airframe & Mechanical Systems Layer
          detail: Composite structures, advanced propulsion, and runway-independent flight controls.
          modules:
            - Lightweight Composite Airframe Structure
            - Flowcopter Hydraulic Transmission Propulsion
            - Internal Long-Range Fuel Cell & Power Distribution
            - Automatic Take-Off and Landing (ATOL) Gear
        - label: Avionics & Real-Time Flight Control Layer
          detail: Hardened real-time computing and deterministic multi-protocol communication buses.
          modules:
            - Flight Computer Running Hardened RTOS / Embedded Linux
            - MAVLink and DroneCAN Inter-Subsystem Buses
            - DO-178C and ARP4754A Safety Certification Baselines
            - Autonomous Waypoint Navigation & Fail-Safe Logic
        - label: Communications & Datalink Fabric Layer
          detail: Redundant line-of-sight and satellite datalinks with automated handover.
          modules:
            - Line-of-Sight (LoS) High-Bandwidth Radio Datalink
            - Beyond-Line-of-Sight (BLoS) Satellite Uplink/Downlink
            - Dynamic LoS/BLoS Autonomous Handover Controller
            - End-to-End Encrypted Command & Telemetry Stream
        - label: Edge Intelligence & ATLAS Processing Layer
          detail: Onboard neural computer vision and automated multi-sensor track correlation.
          modules:
            - Onboard Edge Computing Accelerator
            - ATLAS Real-Time Automated Target Recognition (ATR)
            - Multi-Sensor Spatial and Temporal Data Fusion
            - Low-Bandwidth Actionable Target Metadata Compression
        - label: Cloud Operations & Service Delivery Layer
          detail: Enterprise cloud orchestration, automated MLOps pipelines, and customer portals.
          modules:
            - Google Cloud Enterprise Analytics Infrastructure
            - Docker Container & Kubernetes Cluster Orchestration
            - Apache Airflow & Spark Distributed MLOps Pipelines
            - Secure Customer Surveillance-as-a-Service Portal
    approximationNotes: >-
      Architectural representation synthesized from Tekever engineering specifications, job descriptions, and technical
      trade documentation.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
      - CE008
      - CE010
  - id: FU001
    title: Institutional adoption and expansion journey
    type: journey-map
    summary: >-
      A source-grounded customer path from mission need to deployment, with renewal and expansion remaining the
      principal evidence gap.
    data:
      items:
        - label: 1. Mission need
          detail: Government or specialist operator defines an ISR, maritime-security, border, or emergency-response mission.
          touchpoints:
            - Tactical ISR
            - Maritime surveillance
            - Wildfire detection
        - label: 2. Evaluation and selection
          detail: Buyer evaluates platform endurance, communications, payload, operating model, and sovereign requirements.
          touchpoints:
            - Operational fit
            - Procurement process
            - Technical assurance
        - label: 3. Contracting
          detail: Engagement becomes direct platform procurement, a programme award, or a managed surveillance service.
          touchpoints:
            - Supply contract
            - Framework or programme ceiling
            - Managed ISR service
        - label: 4. Delivery and integration
          detail: Aircraft, communications, analytics, training, and support must be integrated into customer operations.
          touchpoints:
            - Scheduled delivery
            - Operator readiness
            - Mission-system integration
        - label: 5. Live operations
          detail: Customer uses the system for defence, maritime, border, environmental, or emergency missions.
          touchpoints:
            - Mission utilization
            - Availability and incident data
            - Operational outcomes
        - label: 6. Renewal and expansion
          detail: >-
            Durability depends on accepted deliveries, task-order drawdown, renewal, fleet expansion, and support
            revenue.
          touchpoints:
            - Renewal rate
            - Expansion orders
            - Retention and concentration
    approximationNotes: >-
      The sequence synthesizes observed engagement states; it is not a measured conversion funnel and no stage
      conversion rates are available.
