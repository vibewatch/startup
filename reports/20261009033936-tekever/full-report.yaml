          - type: callout
            title: Mandate Full Data-Room Audit of Sub-Tier Suppliers and Cap-Table Preferences
            body: >-
              Prospective institutional investors must condition capital deployment on independent audit verification of
              FY2022–FY2025 financial statements, customer concentration percentages across UK MoD and EMSA accounts,
              and detailed sub-tier supplier SLA agreements for satellite avionics and composite components.
