chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Heritage, and Dual-Use Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              Tekever was incorporated in 2001 in Lisbon, Portugal, by co-founders Pedro Sinogas and Vitor Cristina,
              alongside classmates from Lisbon's Instituto Superior Técnico. Originally established to develop
              distributed networking software connecting physical devices to enterprise systems, the engineering team
              pivoted around 2009 toward applying distributed computing and avionics expertise directly to uncrewed
              aerial systems (UAS). Today, Tekever operates as a vertically integrated manufacturer and technology
              provider spanning tactical airframe fabrication, composite aerostructures, onboard avionics, satellite
              communications, and intelligence software. The company maintains dual headquarters across Lisbon,
              Portugal, and London, United Kingdom, operating specialized production and testing facilities across
              Swindon, Bristol, and Caldas da Rainha. Tekever's core commercial model couples direct system deliveries
              with long-term Intelligence-as-a-Service contracts across civil, maritime, and defence sectors, including
              continuous surveillance operations for the UK Home Office over the English Channel, maritime observation
              for the European Maritime Safety Agency (EMSA), and persistent tactical reconnaissance deployments with
              Ukrainian armed forces.
