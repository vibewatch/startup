      - number: '7.4'
        title: Valuation Sustainability, Capital Intensity, and Information Asymmetry
        blocks:
          - type: paragraph
            body: >-
              In September 2026, Tekever completed the first closing of a $580 million Series D financing round led by
              UC Investments and Baillie Gifford, catapulting the company's valuation to $6.4 billion—nearly five times
              its reported valuation from the prior year. This steep multiple expansion elevates downside valuation and
              equity dilution risks, particularly in the absence of publicly disclosed audited financial statements,
              historical revenue breakdowns, and unit-level gross margin data. Private share secondary markets such as
              EquityZen highlight ongoing investor demand alongside persistent information gaps regarding cap-table
              liquidation preferences and working capital burn. If defence venture capital funding cools or task-order
              conversion under sovereign programmes lags aggressive growth milestones, Tekever could face valuation
              compression or down-round restructuring.
            claimRefs:
