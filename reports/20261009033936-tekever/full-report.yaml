      - number: '4.2'
        title: Vertical integration creates control and capital intensity
        blocks:
          - type: paragraph
            body: >-
              The operating model spans aircraft, software, sensors, mission support, manufacturing, delivery, and
              service. That breadth can protect performance and speed field learning, but it also introduces a physical
              cost base unlike asset-light software: composite production, quality assurance, engineering labor,
              inventory, facilities, support, and deployment all precede or accompany customer revenue. The careers
              evidence confirms active production and quality roles, while financing disclosures direct proceeds toward
              production and technology capacity. No reviewed source quantifies bill-of- materials cost, manufacturing
              yield, service-delivery cost, utilization, gross margin, working-capital days, warranty burden, or capex.
              The margin path is therefore a diligence hypothesis, not a demonstrated result.
            claimRefs:
              - CI001
              - CI009
              - CI010
              - CI012
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
