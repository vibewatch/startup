      - number: '6.2'
        title: Named adoption is real, but maturity varies
        blocks:
          - type: paragraph
            body: >-
              The strongest current proof is contract-specific. Tekever announced in August 2026 that the UK Ministry of
              Defence selected it for CORVUS, worth up to GBP 400 million over ten years, and separately announced an
              AR5 supply contract with the Portuguese Air Force with delivery scheduled as early as September. Its news
              feed also describes the continuation and extension of a Canadian wildfire-detection relationship with
              Phoenix Heli-Flight. Third-party and tertiary evidence adds the European Maritime Safety Agency, UK Home
              Office, Ukraine, and other public operators. These records should not be treated as equivalent: selection,
              scheduled delivery, partnership, and active deployment are different maturity states. The GBP 400 million
              figure is explicitly an "up to" programme value, not evidence of an immediately committed order book or
              recognized revenue.
