chapter:
  number: 5
  title: "Product & Technology"
  summary: "Tekever operates a vertically integrated uncrewed aircraft architecture anchored by the AR5 medium-altitude maritime surveillance platform and proprietary ATLAS AI software. Delivering persistent maritime intelligence through an operational surveillance-as-a-service model across more than 100,000 flight hours, the company combines in-house composite airframe production, DO-178C-aligned avionics, and edge sensor fusion, while navigating external dependencies in avionics microprocessors, specialized sensors, and emerging satellite imagery alternatives."
sections:
  - id: "product-portfolio-capabilities"
    title: "Product Portfolio and Platform Capabilities"
    body: "Tekever designs, manufactures, and operates an integrated family of autonomous uncrewed aircraft systems (UAS) engineered specifically for demanding maritime domain awareness and border surveillance missions. The operational flagship is the AR5 uncrewed aircraft system, a medium-altitude, long-endurance fixed-wing platform engineered to conduct extended maritime reconnaissance missions. The AR5 features an aerodynamic composite airframe with physical dimensions of 4.3 meters in fuselage length by 3.0 meters in wingspan, supporting a maximum takeoff weight (MTOW) of 150 kilograms. Configured with internal fuel capacity and aerodynamic efficiency for sustained loiter, the platform operates continuously for up to 12 hours beyond line of sight (BLOS), providing persistent maritime coverage over expansive exclusive economic zones (EEZs) that traditionally required expensive crewed maritime patrol aircraft. The platform incorporates automatic take-off and landing (ATOL) flight control software capable of operating from short, unpaved runways as well as conventional aviation infrastructure. Beyond the AR5, Tekever deploys the tactical AR3 net-centric system for land and coastal reconnaissance, and in July 2026 unveiled the AR6 family to extend its portfolio into sovereign UK heavy-lift autonomous logistics. Together, these platforms have accumulated more than 100,000 operational flight hours across European, North American, and allied operational environments."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE011"
      - "CE014"
    tableRefs:
      - "TE001"
  - id: "technology-avionics-ai-architecture"
    title: "Technology Architecture, Avionics, and Edge Intelligence"
    body: "The technological foundation of Tekever's platform resides in its digital avionics core and proprietary artificial intelligence stack. Onboard the AR5, vehicle systems communicate across a deterministic, fault-tolerant bus architecture implementing MAVLink, DroneCAN, IP networking, and industrial serial protocols (RS232/422/485). Flight stabilization and flight-critical command execution run on embedded real-time operating systems (RTOS) and hardened Embedded Linux distributions, with systems engineering and software lifecycle processes structured to satisfy aerospace airworthiness standards including DO-178C and ARP4754A. The aircraft carries a multi-sensor payload combining electro-optical and infrared (EO/IR) gyrostabilized imaging turrets, a dedicated maritime search radar for surface vessel tracking, automated identification system (AIS) receivers, and emergency position-indicating radiobeacon (EPIRB) antennas. Rather than downlinking raw video feeds across constrained satellite links, onboard compute units execute the ATLAS intelligence software to run neural computer vision models at the tactical edge. ATLAS performs multi-sensor data fusion, automatically detecting, tracking, and classifying vessels against maritime registries in real time. At the enterprise tier, Tekever maintains a scalable data platform on Google Cloud using Docker and Kubernetes clusters, orchestrating automated machine learning pipelines with Apache Airflow and Spark to continuously ingest telemetry and refine detection models."
    claimRefs:
      - "CE004"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "surveillance-as-a-service-workflows"
    title: "Surveillance-as-a-Service Delivery Model and Operational Workflows"
    body: "Tekever differentiates operationally by packaging its uncrewed aviation hardware and analytics into an end-to-end surveillance-as-a-service delivery model. Rather than forcing government defense and maritime safety agencies to procure airframes, build internal maintenance depots, and train dedicated flight crews, Tekever provides turnkey maritime intelligence. Under this structure, Tekever owns and maintains the aircraft systems, deploys certified flight operators and ground control stations, manages line-of-sight and beyond-line-of-sight satellite communications links, and delivers actionable, geo-referenced surveillance feeds directly into client command operations centers. This delivery model is exemplified by Tekever's €30 million framework agreement with the European Maritime Safety Agency (EMSA) to provide dedicated AR5 surveillance across Nordic and Baltic maritime zones, as well as operational patrols for the UK Home Office and border security agencies. By converting large capital equipment procurement cycles into recurring operational contracts, Tekever lowers procurement friction for government buyers while capturing high-margin recurring software and data revenue. The operational validity of this approach is backed by more than 100,000 flight hours in demanding maritime environments, demonstrating mission availability and target detection rates that rival conventional crewed surveillance aircraft."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE005"
      - "CE014"
    tableRefs:
      - "TE002"
  - id: "technical-differentiation-risks"
    title: "Technical Differentiation, Supply Chain Dependencies, and Technology Risks"
    body: "Tekever's competitive differentiation rests on its proprietary training data moat and sovereign European manufacturing integration. The accumulation of more than 100,000 flight hours across diverse sea states and lighting conditions provides a proprietary computer vision dataset that standalone hardware entrants cannot easily duplicate. To strengthen aerodynamic efficiency and payload capacity, Tekever acquired Edinburgh-based Flowcopter in September 2026, integrating hydraulic transmission propulsion technology to enhance heavy-lift autonomy. Furthermore, the company partners with advanced manufacturing specialist iCOMAT to scale composite airframe production in the United Kingdom, reinforcing sovereign industrial capabilities backed by the NATO Innovation Fund. Nevertheless, Tekever faces critical supply chain and technology substitution risks. The company remains dependent on specialized Tier-1 suppliers for advanced avionics semiconductors, high-performance optical sensors, and specialized maritime radar hardware, where international export controls and lead-time volatility could constrain production scaling. Concurrently, rapid advances in commercial low-earth-orbit (LEO) satellite constellations offering synthetic aperture radar (SAR) and high-revisit optical coverage present an emerging technological substitute for broad-area ocean monitoring, requiring Tekever to continuously prove the tactical superiority of responsive, low-latency airborne loiter."
    claimRefs:
      - "CE010"
      - "CE012"
      - "CE013"
      - "CE015"
