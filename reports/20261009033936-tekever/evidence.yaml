evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited multi-year financial statements (FY2022-FY2025) confirming annual revenue, revenue run rate, gross margin
      percentages, and net income.
    whyItMatters: >-
      Without audited profit and loss disclosures, Tekever's $6.4 billion valuation cannot be validated against standard
      enterprise software or defence aerospace EV/Revenue multiples.
    diligencePath: >-
      Obtain confidential financial disclosures and audited auditor opinions through private data-room access during
      formal investor due diligence.
    relatedQuestionRefs:
      - QO006
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: >-
      Complete capitalization table with exact equity ownership percentages, share classes, liquidation preferences, and
      secondary transaction discounts.
    whyItMatters: >-
      Partial stakeholder enumeration prevents precise dilution modeling and assessment of senior liquidation preference
      overhang across Series B, Growth, and Series D tranches.
    diligencePath: >-
      Review full cap-table schedule, investor rights agreements, and certificate of incorporation amendments in the
      corporate data room.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: procurement-drawdown-schedules
    missingEvidence: Audited task-order drawdowns and delivery milestones under the UK MoD £400M Project CORVUS framework.
    whyItMatters: Framework ceilings can obscure actual near-term recognized annual revenue and production volume.
    diligencePath: Review UK MoD contract award notices and tender award disclosures for committed task orders.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: minor
    topic: commercial-market-sizing
    missingEvidence: >-
      Independent standardized TAM and SAM market studies segmenting European sovereign MALE fixed-wing ISR from general
      UAVs.
    whyItMatters: >-
      Public market estimates vary widely across research providers and conflate consumer, tactical, and strategic UAV
      segments.
    diligencePath: >-
      Obtain subscription aerospace and defense analyst reports (e.g. Janes, Teal Group) benchmarking MALE UAS
      procurement budgets.
    relatedQuestionRefs:
      - QM003
      - QM006
      - QM009
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      Three years of audited income statements, cash-flow statements, balance sheets, and accounting policies, with
      revenue split by product, service, geography, and customer.
    whyItMatters: >-
      Without audited historical performance, revenue scale, growth, profitability, cash conversion, and recognition
      quality cannot be verified.
    diligencePath: >-
      Obtain audited FY2023-FY2025 statements plus 2026 year-to-date management accounts and reconcile each period to
      bank records and the general ledger.
    relatedQuestionRefs:
      - QI003
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Price books, realized invoice prices, discounts, contract terms, and revenue mix for aircraft, software, mission
      services, support, and maintenance.
    whyItMatters: >-
      The public sources identify monetization mechanisms but do not establish pricing power, recurring mix, renewal, or
      revenue quality.
    diligencePath: >-
      Review contract and invoice cohorts by offering, customer, geography, and vintage, including renewal and
      change-order history.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Bill-of-materials cost, manufacturing yield, labor absorption, service-delivery cost, warranty expense, gross
      margin, CAC, sales cycle, and payback cohorts.
    whyItMatters: >-
      Vertical integration may improve control while increasing fixed cost, working capital, and delivery risk; public
      evidence cannot resolve the net effect.
    diligencePath: >-
      Build a product-and-service contribution-margin bridge and reconcile bid costs, pipeline conversion, sales cycles,
      and customer acquisition spending.
    relatedQuestionRefs:
      - QI004
      - QI009
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Closing cash proceeds, current cash, restricted cash, monthly burn, debt and lease schedules, acquisition
      commitments, capex plan, and base/downside runway.
    whyItMatters: >-
      Announced funding cannot be converted into cash available or runway without the balance sheet, obligations, and
      planned deployment schedule.
    diligencePath: >-
      Reconcile round-close documents to bank statements, then model monthly liquidity under base, delayed-procurement,
      and manufacturing-ramp scenarios.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: government-contracts
    missingEvidence: >-
      CORVUS and other programme task orders, minimum commitments, delivery milestones, acceptance criteria, termination
      rights, payment schedules, and backlog aging.
    whyItMatters: >-
      Programme ceilings can materially overstate near-term revenue visibility when drawdowns, delivery timing, or
      customer acceptance remain discretionary.
    diligencePath: >-
      Tie signed orders and funded task orders to production schedules, acceptance events, invoices, collections, and
      recognized revenue.
    relatedQuestionRefs:
      - QI003
      - QI007
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue, backlog, and cash collections by customer and programme, including exposure to EMSA, CORVUS, and other
      sovereign buyers.
    whyItMatters: >-
      Concentrated sovereign procurement can create volatility from budget timing, programme changes, acceptance delays,
      or policy shifts.
    diligencePath: >-
      Obtain top-ten customer and programme cohorts for revenue, backlog, gross margin, and collections, then stress the
      largest programme delays.
    relatedQuestionRefs:
      - QI007
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: satellite-substitution-risk
    missingEvidence: >-
      Independent quantitative benchmark comparing Tekever AR5 per-hour surveillance cost against high-revisit
      commercial Synthetic Aperture Radar (SAR) and optical satellite imagery.
    whyItMatters: >-
      Rapid improvements in commercial satellite constellation coverage could compress long-term demand or pricing power
      for airborne persistence surveillance patrols.
    diligencePath: >-
      Request customer comparative procurement trade studies and renewal telemetry from EMSA and UK Home Office maritime
      operations.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: subsystem-tier1-dependencies
    missingEvidence: >-
      Complete bill of materials and single-source supplier list for AR5 autopilot computing, satellite communications
      transceivers, and radar subsystems.
    whyItMatters: >-
      Avionics component shortages or export control restrictions could delay delivery schedules under the UK MOD CORVUS
      and EMSA framework agreements.
    diligencePath: >-
      Examine engineering supplier agreements, buffer inventory levels, and qualification timelines for secondary
      avionics suppliers during management diligence.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: >-
      Customer-level renewals, net and gross revenue retention, churn, contract duration, utilization, expansion orders,
      and cohort history.
    whyItMatters: Named awards do not show whether customers renew, expand, or generate durable recurring revenue after deployment.
    diligencePath: >-
      Request customer cohorts, contract schedules, renewal notices, utilization records, and customer-level revenue
      bridges from the data room.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue, backlog, committed order value, and cash collections by the five largest customers and by programme.
    whyItMatters: >-
      Most visible proof is public-sector demand, so optional framework timing or one delayed programme could materially
      affect realized revenue.
    diligencePath: >-
      Reconcile signed contracts and task orders to audited revenue and cash receipts, then calculate top-one,
      top-three, and top-five concentration.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-registry
