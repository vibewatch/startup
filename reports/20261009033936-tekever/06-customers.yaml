chapter:
  number: 6
  title: "Customers"
  summary: "Public evidence shows a government-led customer base spanning defence, maritime security, border surveillance, and a smaller dual-use emergency-response segment. Recent awards provide credible adoption signals, but public sources do not disclose customer-level revenue, retention, renewals, or the committed drawdown beneath headline framework ceilings."
sections:
  - id: "customer-mix"
    title: "Government-led customer mix"
    body: >-
      Tekever's visible customer base is concentrated in institutional missions rather than
      ordinary enterprise purchasing. An independently edited operator list names defence,
      policing, maritime, and emergency-response organizations across Europe, Africa, North
      America, South America, and Southeast Asia, while company and third-party descriptions
      position the AR3 and AR5 around tactical ISR, border and coastal security, search and
      rescue, fisheries control, and environmental monitoring. The commercial model also
      varies by buyer: EquityZen describes surveillance-as-a-service, and Houlihan Lokey
      describes a managed ISR service for a global customer base, alongside direct aircraft
      procurement. This supports a segmentation between sovereign defence forces,
      civil-security agencies, and dual-use operators. It does not establish the revenue mix,
      payer economics, or relative durability of those segments.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU008"
      - "CU011"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "adoption-proof"
    title: "Named adoption is real, but maturity varies"
    body: >-
      The strongest current proof is contract-specific. Tekever announced in August 2026 that
      the UK Ministry of Defence selected it for CORVUS, worth up to GBP 400 million over ten
      years, and separately announced an AR5 supply contract with the Portuguese Air Force
      with delivery scheduled as early as September. Its news feed also describes the
      continuation and extension of a Canadian wildfire-detection relationship with Phoenix
      Heli-Flight. Third-party and tertiary evidence adds the European Maritime Safety Agency,
      UK Home Office, Ukraine, and other public operators. These records should not be treated
      as equivalent: selection, scheduled delivery, partnership, and active deployment are
      different maturity states. The GBP 400 million figure is explicitly an "up to" programme
      value, not evidence of an immediately committed order book or recognized revenue.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU015"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-and-risk"
    title: "Durability, concentration, and operating risk remain unquantified"
    body: >-
      The assigned public evidence does not disclose net revenue retention, gross revenue
      retention, logo churn, renewal rates, contract duration by customer, or revenue
      concentration. That omission is material because most named proof is tied to sovereign
      agencies whose procurement schedules and optional programme ceilings may diverge from
      annual billings. The customer proposition also carries demanding implementation
      requirements: Tekever's careers page highlights satellite-communications latency,
      20-hour aerodynamics, and AI identification in extreme sea conditions. Historical
      evidence is not uniformly positive; the operator record cites a 2014 report that a
      Portuguese Navy drone crashed on its first takeoff. This single historical reference
      does not establish present reliability, but it reinforces the need for fleet-level
      availability, incident, loss, support, and renewal data before underwriting durable
      adoption.
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU013"
      - "CU014"
      - "CU015"
    figureRefs:
      - "FU001"
