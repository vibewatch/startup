chapter:
  number: 5
  title: "Product & Technology"
  summary: "SambaNova Systems delivers high-throughput AI inference via its proprietary Reconfigurable Dataflow Unit (RDU) chips and three-tier memory architecture, packaged as both hosted SambaCloud APIs and on-premises SambaRack infrastructure. While the platform offers drop-in OpenAI client compatibility and strong technical performance for agentic workloads, on-premises customer adoption is constrained by strict contractual title transfers, site survey mandates, and private hardware reliability metrics."
sections:
  - id: "section-product-definition"
    title: "Product Offerings and Customer Deployment Models"
    body: "SambaNova Systems structures its commercial offering across two distinct consumption form factors designed to serve different enterprise security and infrastructure operating profiles: the SambaCloud hosted inference service and the SambaStack on-premises platform [CE001]. For cloud-native developers and organizations prioritizing immediate access without physical hardware capital expenditure, SambaCloud exposes API endpoints with native OpenAI client compatibility, allowing developers to execute inference on open foundation models such as Llama and DeepSeek with zero client-side architectural rewrites [CE002]. For sovereign cloud operators, government agencies, and regulated financial institutions with strict data residency mandates, SambaNova packages the same underlying software stack into SambaRack on-premises hardware clusters [CE001, CE006]. Cluster operations and multi-node scaling across both public cloud and private enterprise data centers are managed by SambaOrchestrator, which automates model checkpoint deployment, dynamic load balancing, and fleet-wide telemetry monitoring across distributed compute nodes [CE011]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE006"
      - "CE011"
    tableRefs:
      - "TE001"
  - id: "section-architecture-hardware"
    title: "RDU Silicon Design and Tiered Memory Architecture"
    body: "At the foundation of SambaNova's technical differentiation is its proprietary Reconfigurable Dataflow Unit (RDU) processor architecture, which discards the instruction-fetch and register-file overhead of conventional von Neumann GPUs in favor of a spatially mapped dataflow compute graph [CE003]. To overcome the memory bandwidth and capacity bottlenecks inherent in large language model decode phases, the SN40L generation integrates a three-tier memory hierarchy combining on-chip static RAM (SRAM) for immediate tensor routing, High Bandwidth Memory (HBM) for active model weights, and high-capacity DDR memory for parameter staging [CE004]. This architectural arrangement directly enables Composition of Experts configurations, in which SambaNova has demonstrated serving up to 150 specialized model checkpoints totaling one trillion aggregate parameters with minimal switching latency [CE004, CE005]. Ongoing compiler and kernel-level optimizations continuously map emerging foundation architectures, including reasoning and mixture-of-experts models, onto the reconfigurable silicon fabric [CE010]."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE010"
    figureRefs:
      - "FE001"
  - id: "section-systems-infrastructure"
    title: "Rack-Scale Integration, Management, and Workflow Solutions"
    body: "Delivering dataflow compute at enterprise scale requires tight integration between physical rack infrastructure, baseboard management firmware, and distributed telemetry services [CE007]. SambaRack systems package RDU nodes into standard enterprise data center form factors, providing built-in hardware management via industry-standard Baseboard Management Controllers (BMCs), Redfish interfaces, IPMI, and OpenBMC environments [CE006, CE007]. In enterprise and air-gapped installations, platform reliability relies on Prometheus metrics exporters, Grafana visualization dashboards, and Kubernetes Helm chart deployment automation to monitor node health and hardware telemetry without external internet dependencies [CE013]. Customer onboarding and incident remediation are supported through tiered operational support packages that combine an authenticated support portal with shared dedicated Slack channels for premium cloud tiers and on-premises licensees [CE009]. Specialized systems and performance engineers continuously tune the compiler and runtime to alleviate hardware-software integration bottlenecks across high-throughput inference pipelines [CE012]."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE009"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE002"
  - id: "section-contractual-operational-risks"
    title: "Commercial Licensing, Environmental Surveys, and Technical Risks"
    body: "While SambaNova's technology architecture demonstrates compelling inference performance, commercial enterprise adoption carries significant contractual and operational responsibilities [CE008]. Under the SambaStack on-premises terms of service, title and risk of loss to physical hardware pass directly to the customer at the collection site, while SambaNova retains a purchase money security interest under the California Uniform Commercial Code as collateral [CE008]. Furthermore, customers must provide complete site and environmental survey information within sixty days of order execution, with failure to do so constituting an automatic material breach triggering immediate invoice acceleration [CE014]. These stringent contractual obligations, combined with high data center power density and thermal dissipation requirements, place substantial implementation risks on customer facility teams [CE008, CE014]."
    claimRefs:
      - "CE008"
      - "CE014"
    tableRefs:
      - "TE003"
