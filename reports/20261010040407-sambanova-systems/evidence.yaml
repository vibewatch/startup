evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financial-performance
    missingEvidence: >-
      Audited financial statements for fiscal years 2024 through 2026, disclosing GAAP/IFRS revenue, annual recurring
      revenue (ARR), gross margin profile, and operating cash burn.
    whyItMatters: >-
      Fundamental valuation multiples, unit economics, and cash runway cannot be independently established without
      audited top-line and margin disclosures.
    diligencePath: >-
      Request audited financial statements, board management presentations, and CPA review reports under NDA during
      formal diligence.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-shareholder-register
    missingEvidence: >-
      Full capitalization table detailing exact percentage ownership, option pool dilution, and voting share
      distribution across institutional and founder stakeholders.
    whyItMatters: >-
      Enables definitive assessment of voting control, liquidation preference seniority overhang across Series D/E/F,
      and common equity dilution.
    diligencePath: Request confidential cap table and stockholder register from company management under NDA.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO002
  - type: conflicting-data
    severity: minor
    topic: headcount-and-organizational-velocity
    missingEvidence: Official employee headcount census and departmental headcount distribution following 2025 restructuring events.
    whyItMatters: >-
      Third-party trackers display wide divergence in employee headcount estimates (ranging from 37 per Fortune
      citations to 478 per Crustdata), obscuring actual organizational scale.
    diligencePath: Review HR organizational census and verified LinkedIn headcount data directly with management.
    relatedQuestionRefs:
      - QO003
  - type: private-evidence-only
    severity: material
    topic: diligence-gaps
    missingEvidence: >-
      Audited product-level ARR breakdown between hardware rack sales and cloud API token consumption, alongside
      customer renewal retention rates.
    whyItMatters: >-
      Without segment-level ARR and customer retention data, sizing SambaNova's actual serviceable obtainable market
      penetration against incumbent GPUs cannot be validated.
    diligencePath: >-
      Request management diligence disclosures detailing customer cohort revenue, cloud versus on-premise contract mix,
      and customer gross margin profiles.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Audited customer revenue concentration, renewal retention rates, and sovereign government vs. commercial
      enterprise contract split.
    whyItMatters: >-
      Without verified breakdown of customer revenue, diligence cannot evaluate how dependent SambaNova is on sovereign
      subsidies versus competitive commercial market adoption.
    diligencePath: >-
      Request customer contract registry, annual recurring revenue by account, and sovereign vs commercial revenue
      segmentation during management diligence.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-burn
    missingEvidence: >-
      Audited financial statements detailing fiscal year revenue, gross margin by revenue stream, operating expenses,
      and cash burn rate.
    whyItMatters: >-
      Without audited figures, underwriting must rely on unverified commercial announcements and headline contract
      values, obscuring true unit margins and runway.
    diligencePath: >-
      Request confidential disclosure of audited 2024-2026 financial statements, balance sheet cash balances, and
      monthly operating burn.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: customer-concentration-and-retention
    missingEvidence: >-
      Disclosed revenue concentration across anchor accounts such as JPMorganChase and Vector Core Compute, along with
      net revenue retention rates.
    whyItMatters: >-
      High reliance on a few marquee hardware contracts increases revenue volatility if follow-on deployment phases or
      software renewals are delayed.
    diligencePath: >-
      Request an account-by-account revenue breakdown and cohort net revenue retention figures during formal management
      diligence.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: hardware-reliability-and-thermal-limits
    missingEvidence: >-
      Field telemetry, mean-time-between-failures (MTBF) statistics, and continuous thermal throttling benchmarks for
      production SambaRack deployments.
    whyItMatters: >-
      Without empirical hardware defect rates and thermal dissipation metrics under sustained batch inference,
      infrastructure underwriting cannot accurately model long-term hardware depreciation, cooling operating expenses,
      or node replacement frequency.
    diligencePath: >-
      Request customer data center environmental telemetry logs, hardware replacement RMA records, and third-party
      benchmark audits from existing sovereign or financial enterprise installations.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited cohort net revenue retention (NRR), gross retention (GRR), and annual logo churn figures broken down by
      on-premises hardware vs cloud inference customers.
    whyItMatters: >-
      Without cohort retention disclosures, investors cannot verify whether customers renew and expand on-premises
      hardware leases after initial 1-3 year commitments.
    diligencePath: >-
      Request audited revenue retention waterfall, customer cohort renewal rates, and contract renewal terms during
      private dataroom diligence.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Comprehensive registry of all 30+ enterprise customer contracts, pilot-to-production conversion rates, and
      contract values across commercial and government sectors.
    whyItMatters: >-
      Public disclosure reveals only a handful of flagship reference accounts (JPMorgan Chase, Argonne, Vector Core
      Compute, Saudi Aramco), leaving mid-tier deployment volume and revenue dispersion opaque.
    diligencePath: >-
      Obtain an anonymized customer account master list including ARR contribution, deployment tier (SambaRack vs
      SambaCloud), and contract tenure from company leadership.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory / legal risk register
    missingEvidence: >-
      Non-public contractual amendments, customized enterprise master services agreements, and full terms of the Intel
      strategic transaction.
    whyItMatters: >-
      Standard public click-through terms may differ significantly from negotiated indemnification and liability terms
      granted to key government and enterprise buyers.
    diligencePath: >-
      Request review of top-customer MSAs, unredacted Intel transaction agreements, and active litigation/dispute
      registers during confirmatory legal diligence.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: audited cash burn and gross margin dynamics
    missingEvidence: >-
      Audited financial statements detailing gross margins on hardware systems versus cloud API tokens, unit
      manufacturing costs, and operating cash burn for 2025-2026.
    whyItMatters: >-
      High capital intensity and custom silicon tape-out expenses could rapidly deplete cash reserves despite the July
      2026 Series F funding round.
    diligencePath: Obtain audited income statements, cash flow statements, and capital expenditure schedules through 2026.
    relatedQuestionRefs:
      - QR009
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-revenue-run-rate
    missingEvidence: Audited financial statements confirming SambaNova's 2025 and 2026 revenue, ARR, gross margin, and cash burn rate.
    whyItMatters: >-
      Without audited revenue or margin disclosures, determining whether the $11.0B Series F post-money valuation
      represents an acceptable revenue multiple versus public peers is impossible.
    diligencePath: >-
      Obtain confidential management financials, customer contract schedules, and revenue recognition policies under
      NDA.
    relatedQuestionRefs:
      - QV009
  - type: conflicting-data
    severity: material
    topic: secondary-valuation-spread
    missingEvidence: >-
      Trade-by-trade private secondary volume and transaction records reconciling Forge Global's $70.13 indicated price
      with the $127.10 Series F preferred issue price.
    whyItMatters: >-
      A 45% discount in secondary trading signals investor skepticism regarding whether SambaNova can achieve an IPO
      exit at or above the $11B Series F hurdle.
    diligencePath: >-
      Review secondary transfer notices, company right of first refusal (ROFR) logs, and broker-dealer transaction
      blotters.
    relatedQuestionRefs:
      - QV004
