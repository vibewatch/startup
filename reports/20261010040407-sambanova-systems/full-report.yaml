      - number: '1.4'
        title: Commercial Delivery Model, Customer Traction, and Critical Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              SambaNova has transitioned from early research-oriented deployments toward tier-one commercial and
              sovereign AI production contracts, while facing operational restructuring and persistent disclosure
              limitations. Under its commercial agreements, SambaNova supplies proprietary hardware appliances under a
              purchase-money security interest while licensing its SambaStack software platform under fixed subscription
              terms, with customer obligations encompassing site preparation, environmental compliance, and data
              sovereignty controls. Commercial adoption gained significant momentum in mid-2026 when financial services
              giant JPMorgan Chase selected SambaNova as an enterprise inference partner, deploying production SN40L and
              next-generation SN50 systems. The company has additionally expanded across sovereign AI deployments with
              regional telecommunications and utility operators, including stc Group and TEPCO Systems. Nonetheless,
              rigorous investment diligence identifies material operational headwinds and information gaps. Secondary
              records document workforce restructuring in April 2025 involving 77 layoffs, alongside divergent
              third-party headcount estimates. Most critically, SambaNova continues to operate without public disclosure
              of audited revenue, annual recurring revenue, gross margins, or cash burn rates, leaving underlying unit
              economics and cash runway as essential diligence priorities for prospective investors.
