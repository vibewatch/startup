      - number: '1.3'
        title: Capital Formation, Down-Round Dynamics, and the 2026 Series F Recapitalization
        blocks:
          - type: paragraph
            body: >-
              SambaNova's financing history reflects substantial institutional capital formation accompanied by
              pronounced private-market valuation volatility across changing macroeconomic cycles. Following early
              venture rounds led by Walden International, GV (Google Ventures), and Intel Capital, the company completed
              a $250 million Series C in February 2020 led by funds managed by BlackRock at a $2.5 billion valuation. In
              April 2021, amidst peak AI infrastructure capitalization, SoftBank Vision Fund 2 led a $676 million Series
              D round alongside sovereign wealth funds Temasek and GIC, establishing a post-money valuation exceeding
              $5.0 billion ($95.02 per Series D-1 preferred share). However, broader market contractions and hardware
              commercialization lead times precipitated a sharp recapitalization in February 2026: SambaNova raised $350
              million in Series E financing co-led by Vista Equity Partners and Cambium Capital at an implied $2.34
              billion valuation ($30.99 per Series E-1 preferred share), representing a structured down-round with
              senior liquidation preferences. Five months later, on July 8, 2026, the company executed a major corporate
              rebound by completing the first close of a $1.0 billion Series F financing round led by General Atlantic
              at an $11.0 billion post-money valuation ($127.10 per share). Cumulative paid-in equity capital across all
              priced rounds stands at approximately $2.4 billion to $2.5 billion.
