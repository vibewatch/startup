  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: AI Accelerator Landscape and Competitive Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The market for artificial intelligence acceleration is defined by an entrenched incumbent and an expanding
              cohort of specialized architecture challengers. NVIDIA commands an estimated 85% market share in AI
              hardware accelerators, driven by its pervasive H100 and Blackwell GPU architectures and the
              self-reinforcing developer lock-in of its CUDA software ecosystem. Against this dominant baseline,
              competitors diverge into cloud hyperscaler in-house silicon such as Google TPU and AWS Trainium, and
              specialized venture-backed chipmakers targeting low-latency inference. Among independent peers, Cerebras
              Systems provides the closest architectural comparison with its wafer-scale integration engine and post-IPO
              scale, while Groq delivers ultra-low-latency deterministic execution via its Language Processing Unit
              design despite licensing core technology to NVIDIA in December 2025. Meanwhile, Etched emerged as a
              heavily funded rival, securing $300M in Series A financing at a $10.3B valuation in July 2026 to target
              mixture-of-experts model inference. In this landscape, SambaNova Systems positions itself not merely as a
              component vendor, but as a full-stack infrastructure provider delivering dedicated rack-scale compute and
              managed cloud platforms.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP011
      - number: '3.2'
        title: Architectural Differentiation and Workload Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              SambaNova's technical differentiation centers on its Reconfigurable Dataflow Unit (RDU) architecture,
              which fundamentally diverges from the traditional SIMD/SIMT execution model of graphics processing units.
              While GPUs rely on dense parallel compute clusters bound by High Bandwidth Memory (HBM) capacity and
              memory bandwidth bottlenecks, SambaNova's three-tier memory architecture allows a single node to retain
              hundreds of distinct models in memory and switch between them in microseconds. This capability provides a
              structural advantage for emerging agentic AI workloads, where autonomous workflows alternate across
              specialized reasoning, coding, and tool-calling models. In February 2026, SambaNova introduced its
              fifth-generation SN50 RDU, delivering five times more compute per accelerator and four times greater
              network bandwidth to support clusters of up to 256 accelerators. In contrast to Cerebras's single-wafer
              manufacturing paradigm and Groq's SRAM-constrained memory envelope, SambaNova emphasizes disaggregated
              heterogeneous integration. This approach is exemplified by its strategic collaboration with Intel, which
              combines Intel GPUs for prompt processing, SambaNova RDUs for memory-intensive token generation, and Xeon
              6 CPUs for overall agent orchestration.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
