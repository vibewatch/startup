            body: >-
              SambaNova's financing trajectory reveals an intricate capitalization structure and substantial preference
              overhang that directly impact risk-adjusted returns for prospective investors. Regulatory filings document
              that the Series F round authorized 7,867,941 voting preferred shares and 1,573,588 non-voting preferred
              shares at an issue price of $127.09804 per share, targeting total proceeds of up to $1.2 billion. These
              newly authorized Series F shares carry an 8.0% annual non-cumulative dividend alongside a 1.0x
              non-participating liquidation preference senior to all previous venture rounds. Prior to this round,
              SambaNova traversed substantial valuation fluctuations: its April 2021 Series D led by SoftBank Vision
              Fund 2 achieved a $5.1 billion valuation, followed by late 2025 acquisition discussions with strategic
              partner Intel at roughly $1.6 billion, and an eventual Series E recapitalization in February 2026 at $2.34
              billion ($30.99 per Series E-1 share). Across scenario projections, our base case assigns a 55%
              probability to moderate enterprise inference growth, yielding a $9.0 billion to $11.0 billion enterprise
              value that delivers flat returns for Series F preferred capital. In a bear case (25% probability),
              intensified competitive pricing and customer attrition could compress enterprise value back to historical
              Series E levels ($3.0 billion to $4.5 billion), triggering severe impairment for junior equity and common
              shares.
