              residency mandates, SambaNova packages the same underlying software stack into SambaRack on-premises
              hardware clusters [CE001, CE006]. Cluster operations and multi-node scaling across both public cloud and
              private enterprise data centers are managed by SambaOrchestrator, which automates model checkpoint
              deployment, dynamic load balancing, and fleet-wide telemetry monitoring across distributed compute nodes
