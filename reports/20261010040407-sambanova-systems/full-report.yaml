        title: Product Offerings and Customer Deployment Models
        blocks:
          - type: paragraph
            body: >-
              SambaNova Systems structures its commercial offering across two distinct consumption form factors designed
              to serve different enterprise security and infrastructure operating profiles: the SambaCloud hosted
              inference service and the SambaStack on-premises platform [CE001]. For cloud-native developers and
              organizations prioritizing immediate access without physical hardware capital expenditure, SambaCloud
              exposes API endpoints with native OpenAI client compatibility, allowing developers to execute inference on
              open foundation models such as Llama and DeepSeek with zero client-side architectural rewrites [CE002].
