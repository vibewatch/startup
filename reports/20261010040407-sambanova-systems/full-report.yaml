      - number: '4.3'
        title: Capital Structure, Series F Valuation Dynamics, and Cash Runway
        blocks:
          - type: paragraph
            body: >-
              SambaNova's financing history reflects substantial capital accumulation necessary to sustain intensive
              semiconductor design cycles and data-center scale manufacturing. In July 2026, the company announced the
              first close of a $1.0 billion Series F financing round led by General Atlantic, establishing an $11.0
              billion post-money valuation. This round elevated SambaNova's cumulative institutional equity funding past
              $2.39 billion across six primary financing rounds. Major institutional backers across the cap table
              include BlackRock, SoftBank Vision Fund 2, Intel Capital, Google Ventures, Temasek Holdings, and Celesta
              Capital. Previously, the company completed a $676 million Series D round in 2021 at a post-money valuation
              exceeding $5.0 billion, establishing an early balance sheet cushion that supported subsequent R&D through
              the SN40L generation.


              Despite this strong headline capitalization, the July 2026 financing round introduced notable valuation
              stretching. The $11.0 billion post-money valuation represents an aggressive fivefold expansion over an
              implied $2.2 billion valuation recorded in private secondary markets just five months earlier. This steep
              multiple expansion occurred during an environment where executive leadership openly signaled interest in
              evaluating an initial public offering path. Maintaining a headcount of approximately 400 employees and
              supporting more than 30 enterprise and sovereign customers, SambaNova possesses adequate near-term
              liquidity following the $1.0 billion capital infusion. Nonetheless, the high cash absorption required for
              advanced packaging, high-bandwidth memory procurement, and foundry wafer commitments means ongoing capital
              adequacy remains closely tied to converting announced contracts into cash collections.
