      - number: '1.2'
        title: Founding Pedigree, Academic Roots, and Executive Governance
        blocks:
          - type: paragraph
            body: >-
              SambaNova Systems was co-founded in 2017 through a collaboration between seasoned enterprise hardware
              executives and pioneering Stanford University computer science faculty. Co-founder and Chief Executive
              Officer Rodrigo Liang previously served as Senior Vice President at Sun Microsystems and Oracle, where he
              directed mission-critical SPARC enterprise microprocessor and systems engineering initiatives. Co-founder
              and Chief Technologist Dr. Kunle Olukotun, widely recognized as the pioneer of commercial multi-core
              processor design through his leadership of the Stanford Hydra Chip Multiprocessor research project,
              provides the fundamental scientific foundation for SambaNova's parallel dataflow processing paradigms.
              Co-founder Dr. Christopher Ré, a MacArthur Foundation Fellow and associate professor at Stanford's InfoLab
              and AI Lab, contributes deep theoretical and applied expertise at the frontier of machine learning
              algorithms and system co-design. Governance and supply-chain execution are reinforced by Executive
              Chairman Lip-Bu Tan, former CEO of Cadence Design Systems and founding managing partner of Walden
              International, whose extensive semiconductor foundry relationships provide vital strategic oversight. In
              mid-2026, SambaNova initiated key executive transitions to prepare for organizational maturation and
              prospective public-market entry, naming Matt Padfield as Chief Financial Officer, Rich Heaton as Executive
              Vice President of Software, and former Cisco executive Mohsen Moazami as Vice Chair of Global Strategy.
            claimRefs:
              - CO002
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
