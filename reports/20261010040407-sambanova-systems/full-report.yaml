      - number: '5.2'
        title: RDU Silicon Design and Tiered Memory Architecture
        blocks:
          - type: paragraph
            body: >-
              At the foundation of SambaNova's technical differentiation is its proprietary Reconfigurable Dataflow Unit
              (RDU) processor architecture, which discards the instruction-fetch and register-file overhead of
              conventional von Neumann GPUs in favor of a spatially mapped dataflow compute graph [CE003]. To overcome
              the memory bandwidth and capacity bottlenecks inherent in large language model decode phases, the SN40L
              generation integrates a three-tier memory hierarchy combining on-chip static RAM (SRAM) for immediate
              tensor routing, High Bandwidth Memory (HBM) for active model weights, and high-capacity DDR memory for
              parameter staging [CE004]. This architectural arrangement directly enables Composition of Experts
              configurations, in which SambaNova has demonstrated serving up to 150 specialized model checkpoints
              totaling one trillion aggregate parameters with minimal switching latency [CE004, CE005]. Ongoing compiler
              and kernel-level optimizations continuously map emerging foundation architectures, including reasoning and
              mixture-of-experts models, onto the reconfigurable silicon fabric [CE010].
