      - number: '4.4'
        title: Financial Underwriting Verdict, Capital Intensity, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              From an institutional diligence perspective, SambaNova represents a compelling yet opaque investment
              opportunity. The company has validated technical product-market fit by securing flagship commercial
              relationships with premier financial institutions like JPMorganChase and booking multi-billion-dollar
              infrastructure commitments. Its differentiated 10kW air-cooled rack design directly addresses enterprise
              data center power bottlenecks, providing a defensible moat against general-purpose hyperscale GPU
              clusters. Moreover, its hybrid monetization model combines large upfront hardware contract values with
              recurring software subscription pull-through.


              However, SambaNova's private status shields critical financial performance indicators from independent
              verification. The company does not publicly disclose audited annual revenue, GAAP or non-GAAP gross
              margins, net cash burn, or net revenue retention. Consequently, external underwriting cannot ascertain
              whether hardware sales achieve acceptable manufacturing gross margins after factoring in advanced TSMC
              fabrication and memory packaging costs, nor whether software subscription revenues represent a durable,
              recurring base. Until management provides audited financial statements, historical cash burn rates, and
              customer concentration metrics for major anchor accounts, SambaNova's equity profile must be classified as
