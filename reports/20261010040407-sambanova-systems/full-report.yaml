        title: 'Market Sizing: TAM, SAM, and Addressable Inference Opportunity'
        blocks:
          - type: paragraph
            body: >-
              The addressable market for artificial intelligence accelerators is undergoing a structural shift from
              centralized model pre-training toward distributed enterprise and sovereign inference execution. Industry
              projections estimate the overall AI hardware accelerator total addressable market at approximately $150
              billion by 2026, with dedicated enterprise and cloud inference infrastructure representing a serviceable
              addressable market of roughly $45 billion. Within this envelope, regulated on-premises and sovereign AI
              deployments account for an estimated $18 billion market, driven by strict privacy, compliance, and
              national security mandates. SambaNova addresses this segment directly through hardware systems deployed at
              leading national laboratories and global financial institutions.
