chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Reconfigurable Dataflow Architecture
        blocks:
          - type: paragraph
            body: >-
              SambaNova Systems, Inc. is a venture-backed artificial intelligence infrastructure company incorporated in
              Delaware and headquartered in San Jose, California, having relocated its principal operating offices from
              Palo Alto. Established to address the architectural bottlenecks of legacy general-purpose graphics
              processing units in handling complex deep learning workloads, SambaNova designs an integrated, vertically
              engineered hardware-and-software stack. At the foundation of the company's product strategy is its
              proprietary Reconfigurable Dataflow Architecture, embodied in its Reconfigurable Dataflow Units (RDUs),
              which dynamically configure on-chip compute and multi-tier memory to optimize dataflow execution directly
              from algorithms to silicon. Unlike conventional fixed-pipeline processors, SambaNova's architecture
              decouples compute from memory constraints, enabling ultra-large frontier models and multi-modal neural
              networks to operate within compact data center power envelopes of approximately 10 kilowatts per rack.
              Commercially, the company delivers its compute capabilities via the SambaStack on-premises appliance
              licensing model and managed cloud services, targeting sovereign cloud operators, national scientific
              laboratories, and highly regulated global enterprises that require strict data residency and on-premises
              perimeter control.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
