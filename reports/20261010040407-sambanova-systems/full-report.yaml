      - number: '3.3'
        title: Commercial Packaging, Delivery Models, and GTM Distribution
        blocks:
          - type: paragraph
            body: >-
              SambaNova distributes its computing infrastructure across three commercial delivery models designed to
              capture customers across varying deployment maturities. Developers and digital-native companies access
              pre-trained open-weight models including Llama, DeepSeek, and MiniMax via the SambaCloud API on a
              usage-based consumption framework. For regulated enterprises and public sector agencies with strict data
              sovereignty mandates, SambaStack delivers dedicated RDU clusters deployed either in customer-operated data
              centers or hosted private environments. To address regional infrastructure providers, the turnkey
              SambaManaged offering enables third-party data center operators to launch branded inference clouds within
              approximately 90 days. This multi-tier go-to-market structure has driven traction with sovereign and
              regional cloud partners such as SoftBank in Japan, OVHcloud in Europe, SCX in Australia, and Argyll in the
              United Kingdom. These partnerships enable regional operators to bypass liquid-cooling retrofits and deploy
              air-cooled SambaRack systems within standard power envelopes. This commercial momentum supported
              SambaNova's $1.0B Series F funding round in June 2026, which reached an $11.0B post-money valuation led by
              General Atlantic.
            claimRefs:
              - CP007
              - CP008
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
      - number: '3.4'
        title: Switching Costs, Lock-in, and Moat Defensibility
        blocks:
          - type: paragraph
            body: >-
              Despite strong technical execution and high-profile distribution agreements, SambaNova faces steep
              structural switching costs that protect incumbent GPU deployments. Enterprise AI development remains
              overwhelmingly standardized on NVIDIA's CUDA libraries, triton compilers, and established orchestration
              tooling. Adopting SambaNova requires customers to migrate their software workloads onto the proprietary
              SambaFlow compiler toolchain, creating substantial friction for engineering teams reluctant to manage
              heterogeneous software environments. Furthermore, contractual mechanisms within SambaNova's commercial
              agreements reinforce platform dependency. Under the SambaStack on-premises terms of service, customers
              purchase hardware appliances but license system software under a recurring subscription term; upon
              non-renewal, the customer must immediately cease all use of the software, effectively leaving capital
              hardware stranded without an operational runtime. Compounded by aggressive roadmap execution from NVIDIA
              and well-capitalized startups like Cerebras and Etched, SambaNova's long-term defensibility depends on
              whether inference demand for large agentic models accelerates quickly enough to overcome enterprise CUDA
              inertia.
            claimRefs:
              - CP001
              - CP009
              - CP010
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Differentiation in Agentic Inference
            body: >-
              SambaNova's RDU memory architecture enables holding hundreds of models on a single node and switching
              between them in microseconds, providing architectural advantages for multi-turn agentic workflows that
              require coordinating specialized models.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: Enterprise Ecosystem Friction and Contractual Lock-in
            body: >-
              Enterprises face steep switching barriers moving from the established CUDA software ecosystem to
              SambaNova's proprietary stack. Furthermore, SambaStack on-premises terms require immediate cessation of
              software usage upon subscription non-renewal, risking stranded hardware investments.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Commercial Monetization, and Contract Mechanics
        blocks:
          - type: paragraph
            body: >-
              SambaNova Systems operates a multi-tiered commercial monetization model structured to capture enterprise
              spending across private data centers and cloud inference environments. The foundation of the company's
              commercial architecture is the turnkey SambaRack platform, which couples custom Reconfigurable Dataflow
              Unit (RDU) silicon with system-level compute, memory, and networking infrastructure. This hardware
              delivery is tightly integrated with SambaStack, a proprietary software platform providing model
              orchestration, compilation, and serving runtimes. By bundling high-capital-cost hardware with recurring
              software subscription licenses, SambaNova seeks to generate immediate upfront revenue upon equipment
              delivery while establishing high-margin annual software renewals. In parallel, the company offers
              SambaCloud to address developers and enterprise teams seeking managed API capacity without physical data
              center footprint commitments.


              Commercial contracting terms under the SambaStack On-Premises agreement enforce strict financial
              boundaries that insulate SambaNova from post-shipment operational liabilities. Hardware title and risk of
              loss transfer directly to the purchasing entity upon collection at SambaNova's facility, while SambaNova
              retains a purchase money security interest under the California Uniform Commercial Code until full invoice
              satisfaction. Furthermore, enterprise customers assume complete responsibility for freight logistics,
              import taxes, and installation expenses unless custom professional services are explicitly contracted.
              Crucially for cash flow certainty, payment obligations are contractually non-cancellable and
              non-refundable, and unpaid balances incur monthly late fees of 1.5%. Marquee enterprise
              deployments—highlighted by JPMorganChase's selection of SN40L and SN50 systems for private on-premises
              banking operations and an announced $3.5 billion multi-year infrastructure order from Vector Core
              Compute—demonstrate substantial commercial demand, yet highlight the execution burden of delivering custom
              systems on schedule.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
