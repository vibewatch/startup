companyProfile:
  summary: >-
    SambaNova Systems is a private AI infrastructure company that combines custom Reconfigurable Dataflow Unit hardware,
    SambaStack software, and managed cloud inference services for regulated enterprises and sovereign customers. Founded
    by Rodrigo Liang and Stanford professors Kunle Olukotun and Christopher Ré, the company now markets rack-scale
    on-premises systems and cloud inference endpoints to financial services, government, and infrastructure buyers. The
    July 2026 Series F first close at an $11.0 billion post-money valuation underscores strong strategic interest, but
    opacity around revenue, margins, customer concentration, and cash burn keeps diligence risk elevated.
