chapter:
  number: 6
  title: Customers
  summary: SambaNova focuses its go-to-market on sovereign AI entities, national laboratories, and Tier-1 financial institutions requiring secure on-premises rack-scale deployments. Key public anchors include JPMorgan Chase, Argonne National Laboratory, and a reported $3.5 billion multi-year commitment from Vector Core Compute, but customer concentration and strict commercial site-readiness terms shift substantial operational risk onto buyers.
sections:
  - id: customer-base-segmentation
    title: Customer Segmentation & Target Buyers
    body: 'SambaNova aligns its commercial strategy around organizations that require dedicated, high-throughput AI inference infrastructure rather than commodity multi-tenant public cloud services. The company organizes its customer base into four primary segments: Neoclouds and AI infrastructure providers, Sovereign AI initiatives, large Enterprises with heavy regulatory requirements (primarily financial services), and Government and Public Sector laboratories. In enterprise accounts, sales pursuits target executive buying committees comprising the Chief Information Officer, Chief Technology Officer, and heads of enterprise AI, while also navigating rigorous technology, risk, and procurement reviews. For these buyers, SambaNova emphasizes data sovereignty, predictable operational expenditure, and the 10kW per-rack power profile of its Reconfigurable Dataflow Unit architecture, which allows multi-trillion parameter model serving within existing data center power footprints.'
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU013
    tableRefs:
      - TU001
  - id: customer-adoption-trajectory
    title: Adoption Trajectory & Production Proof
    body: Public validation of SambaNova deployments has evolved from early high-performance computing research pilots into commercial enterprise and sovereign deployments. Third-party private market intelligence reports that SambaNova has established over 30 enterprise customer relationships across its hardware and cloud inference offerings. Early technical validation was anchored at the Department of Energy’s Argonne National Laboratory, where dataflow systems accelerated cosmic data cleanup and complex scientific workloads. Commercial momentum accelerated in July 2026 when JPMorgan Chase selected SambaNova as an enterprise inference-infrastructure partner, deploying SN40L and next-generation SN50 systems for on-premises banking workloads. Furthermore, the company reported a massive $3.5 billion order from Vector Core Compute scheduled over three years, while SoftBank serves as the initial deployment partner for the SN50 chip shipping in the second half of 2026.
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU002
      - TU003
  - id: procurement-friction-retention
    title: Procurement Friction, Contract Terms & Customer Journey
    body: While technical capabilities attract high-profile interest, SambaNova’s standard on-premises commercial contracts introduce meaningful procurement friction. Under the SambaStack on-premises terms of service, customers must arrange freight collection at their own cost and risk within 15 days of availability notice, and hardware is deemed automatically accepted after 30 days regardless of delivery or physical possession. Furthermore, if a customer facility fails to meet site readiness specifications before configuration personnel attend, SambaNova levies fees for aborted visits, personnel time, and rescheduling. Contractual liability is capped at amounts paid in the preceding 12 months with mutual disclaimers for lost profits and business interruption. To protect account health against these deployment hurdles, SambaNova maintains a dedicated customer success organization that monitors platform utilization, identifies churn risks, and conducts executive ROI business reviews to shepherd accounts from onboarding into renewal and expansion.
    claimRefs:
      - CU010
      - CU011
      - CU012
    figureRefs:
      - FU001
  - id: concentration-and-expansion-risks
    title: Account Concentration & Long-Term Expansion Risks
    body: SambaNova faces significant customer concentration and long-term retention uncertainties. Public filings and commercial disclosures do not report standardized net revenue retention, gross revenue retention, or logo churn rates, creating an analytical gap regarding how reliably initial deployments expand into follow-on hardware sales. Moreover, the reported $3.5 billion order from Vector Core Compute introduces substantial counterparty delivery and concentration risk, where overall corporate revenue trajectory depends heavily on a single infrastructure buyer’s rollout schedule. For financial institutions and government laboratories, long hardware evaluation cycles and high capital commitments per rack pose barriers to rapid departmental cross-selling, making continued software-level utilization monitoring essential to prevent customer churn.
    claimRefs:
      - CU004
      - CU006
      - CU012
      - CU014
