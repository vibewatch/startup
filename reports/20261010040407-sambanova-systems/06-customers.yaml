callouts:
  - calloutType: risk
    title: Rigid On-Premises Procurement and Site Acceptance Terms
    body: SambaNova's commercial contracts place strict operational and legal obligations on on-premises buyers. Customers must arrange and fund freight collection within 15 days of availability notice, are subject to deemed acceptance and full payment acceleration after 30 days, and face fee penalties if facility readiness delays installation. These terms protect vendor cash flow but introduce substantial procurement friction for institutional data center teams.
    claimRefs:
      - CU010
      - CU011
  - calloutType: insight
    title: Extreme Revenue Concentration in Anchor Infrastructure Deals
    body: While marquee enterprise wins like JPMorgan Chase demonstrate high-tier technical credibility, SambaNova's revenue profile appears heavily weighted toward massive wholesale commitments, such as the reported $3.5 billion three-year order from Vector Core Compute. Commercial health and production scaling depend heavily on execution against these concentrated counterparty contracts.
    claimRefs:
      - CU006
      - CU014
