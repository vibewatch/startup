  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值执行摘要与投资建议
        blocks:
          - type: paragraph
            body: >-
              SambaNova Systems 在人工智能硬件生态中占据一个出色却结构模糊的位置。2026 年 7 月，公司宣布由 General Atlantic 领投的 $1.0 billion Series F
              融资首轮交割，headline 投后估值达到 $11.0 billion。此次注资 让估值在约五个月内激增五倍，此前公司在 2026 年 2 月 Series E 的估值为 $2.34
              billion。商业采用里程碑 为企业兴趣提供了实质支撑：JPMorgan Chase 选择 SambaNova 作为安全本地 AI 推理的核心合作伙伴，使用 SN40L 和新推出的 SN50
              Reconfigurable Dataflow Units。SambaNova 总部位于加州圣何塞，将软硬件全栈 定位为大规模企业模型服务的 NVIDIA GPU
              基础设施专业替代方案。但投资判断仍明确要求继续研究，风险评级为高。 关键问题在于，SambaNova 没有公开披露经审计的收入、年度经常性收入（ARR）、毛利率或净现金消耗。 与此同时，Forge Global
              的私募二级市场报价显示 Forge Price 为每股 $70.13，较 $127.10 的 Series F 优先股发行价折价 45%。没有私下财务材料佐证，投资人无法以 $11.0 billion
              估值为依据投入成长型股权资本。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV009
              - CV011
