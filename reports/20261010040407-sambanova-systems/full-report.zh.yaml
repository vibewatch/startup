      - number: '6.3'
        title: 采购阻力、合同条款与客户旅程
        blocks:
          - type: paragraph
            body: >-
              技术能力虽能吸引高知名度客户，但 SambaNova 的标准本地部署商业合同带来明显采购阻力。根据 SambaStack 本地部署服务条款，客户须在收到可供提货通知后 15
              天内，自行承担成本和风险安排货运提货；无论实际交付或实体占有情况如何，硬件在 30 天后均视为自动接受。此外，如果客户设施在配置人员到场前未达到场地就绪规格，SambaNova
              会收取上门失败、人员工时和重新安排费用。合同责任上限为前 12 个月已支付金额，双方互相排除利润损失和业务中断责任。为保护客户账户健康、应对这些部署障碍，SambaNova
              设立专门的客户成功组织，监控平台使用率、识别流失风险，并开展高管 ROI 业务评审，推动客户从上线走向续约和扩张。
            claimRefs:
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU010
