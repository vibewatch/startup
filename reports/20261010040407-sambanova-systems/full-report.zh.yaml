      - number: '8.3'
        title: 融资历史、股权结构表动态与情景建模
        blocks:
          - type: paragraph
            body: >-
              SambaNova 的融资轨迹显示，其资本结构复杂，优先权负担沉重，直接影响潜在投资人的风险调整后回报。监管文件显示，Series F 授权发行 7,867,941 股有投票权优先股和 1,573,588
              股无投票权优先股，发行价为每股 $127.09804，目标总募资最高 $1.2 billion。这批新授权 Series F 股份享有 8.0% 年度非累积股息，并带有
              1.0x、非参与型清算优先权，优先于此前所有风险投资轮次。此轮融资前，SambaNova 经历了显著估值波动：2021 年 4 月 SoftBank Vision Fund 2 领投的 Series D 估值达到
              $5.1 billion；2025 年末与战略合作方 Intel 的收购谈判估值约 $1.6 billion；最终 2026 年 2 月 Series E 重组融资估值为 $2.34 billion （每股
              Series E-1 为 $30.99）。在情景预测中，基准情景给温和的企业推理增长 55% 的概率，对应 $9.0 billion 至 $11.0 billion 的企业价值，Series F
              优先股资本回报基本持平。悲观情景（概率 25%）下，竞争性定价加剧、客户流失，可能把企业价值压回历史 Series E 水平（$3.0 billion 至 $4.5 billion），令次级股权和普通股
              严重减值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV013
              - CV014
