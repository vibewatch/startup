      - number: '1.4'
        title: 商业交付模式、客户进展与关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              SambaNova 已从早期偏研究型部署转向一级商业和主权 AI 生产合同，但同时面临运营重组和持续的信息披露限制。根据商业协议，公司在购买款担保权益下供应专有硬件设备，并按固定订阅条款授权 SambaStack
              软件平台；客户则承担场地准备、环境合规和数据主权控制等义务。2026 年年中，金融服务巨头 JPMorgan Chase 选定 SambaNova 作为企业推理合作伙伴，部署生产环境 SN40L 和下一代
              SN50 系统，商业采用明显提速。公司还与包括 stc Group 和 TEPCO Systems 在内的区域电信及公用事业运营商拓展主权 AI
              部署。然而，严格的投资尽调仍发现重大运营阻力和信息缺口。二手记录显示，2025 年 4 月公司进行了涉及 77 人的裁员和员工重组，第三方对员工人数的估计也存在分歧。最关键的是，SambaNova
              仍未公开披露经审计收入、年度经常性收入、毛利率或现金消耗率，使底层单位经济和现金跑道成为潜在投资者必须优先核实的事项。
