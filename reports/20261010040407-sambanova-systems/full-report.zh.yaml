        - SN50 系统快速交付；Vector Core Compute $3.5B 合同转化为 $800M+ 年化收入；2027 年成功 IPO
        - 公开市场市值 $20.0B - $25.0B；AI 推理倍数扩张推动 Series F 入场价获得 1.8x - 2.3x 回报
        - TSMC 封装限制、供应链瓶颈及企业软件上线延迟
        - 20%（取决于高毛利软件栈扩张和硬件毛利率保持）
      - - 基准情景
        - 企业推理温和扩张；JPMorgan 本地部署成功；收入规模达到 $350M-$450M 年化运行率；IPO 延迟
        - $9.0B - $11.0B 估值；相对 Series F 估值约持平至 0.8x 回报，需要在 <= $75 / 股的价格严格把控二级市场入场
        - NVIDIA 和超大规模云厂商定制芯片（Google TPU、AWS Trainium / Inferentia）带来的定价压力
        - 55%（反映当前高成本资本环境，以及 $70.13 私募二级市场折价）
      - - 悲观情景
        - 企业推理转向超大规模云厂商 API；硬件更新周期停滞；收入停留在 $200M 以下；二级市场走弱
        - $3.0B - $4.5B 估值（接近 Series E / Series D 水平）；大幅下轮融资或资本重组，普通股股权损失 50-70%
        - Series F 1.0x 清算优先权悬置（$1.0B 高级优先权）吞噬较低级别的普通股和员工期权
        - 25%（有历史裁员、以 $1.6B 估值进行过的收购传闻及缺乏经审计收入支持）
    notes: >-
      情景依据 Series F 一级资本数据（$11.0B 投后估值，$127.10 / 股）、Forge Global 二级市场指示（$70.13 / 股），以及 Series D（$5.1B）和 Series
      E（$2.34B）的历史融资里程碑构建。
