  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、工作负载范围与边界
        blocks:
          - type: paragraph
            body: >-
              SambaNova Systems 处于人工智能推理和专业计算加速器领域，以定制 Reconfigurable Dataflow Units 对标传统 GPU
              架构。公司边界聚焦生产推理工作负载、大模型解码流水线和多轮智能体执行；在这些场景中，大容量内存和流式数据流处理能够减少内存带宽瓶颈。商品化客户端设备、移动处理器、个人计算芯片和非托管公有云基础设施不在其商业范围内。SambaNova
              将机架级本地硬件与云推理端点结合，面向希望安全、开箱即用地部署生成式 AI、又不想大幅改造数据中心的企业和主权环境。
