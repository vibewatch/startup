      - number: '4.2'
        title: GTM 经济性、解码 Token 工厂与运营约束
        blocks:
          - type: paragraph
            body: >-
              SambaNova 的 GTM 战略已从面向大众的高性能计算宣传，显著转向针对企业的生成式 AI
              推理部署。随着大语言模型开始被采用，企业主动接触量增长了四至五倍，交易势头加快，但也让现场工程、系统定制和交付运营承压。SambaNova 价值主张的商业核心是 token 工厂经济性：专用 RDU
              芯片优化推理解码吞吐和内存带宽。对于金融机构、国防机构和医疗组织等高度受监管行业的企业买家，在私有设施中运行数万亿参数模型，能够提供公有云 API 无法匹敌的监管合规和数据主权能力。

              从设施单位经济性看，SambaNova 利用独特的功耗优势降低客户部署门槛。标准 SambaRack 每个机架约消耗 10 kilowatts，并采用风冷；相比之下，传统 GPU 集群通常每个机架约消耗 140
              kilowatts，并需要昂贵的液冷基础设施。这种效率让企业客户可以把 SambaNova
              硬件接入现有企业数据中心的闲置空间，无需昂贵的设施改造，也无需申请新的市政公用事业配额。然而，这一部署优势被上游供应链的严重约束抵消。通过代工伙伴 TSMC 开发定制数据流芯片，需要三至四年的开发和生产周期，迫使
              SambaNova 在下游需求和模型架构完全稳定前数年，就为硅片产能投入大量营运资金。
            claimRefs:
              - CI006
