      - number: '8.2'
        title: 投资论点与结构性反论点
        blocks:
          - type: paragraph
            body: >-
              评估 SambaNova，必须在有吸引力的架构论点与持续存在的商业、运营反论点之间权衡。看多逻辑的核心是 SambaNova 自研的 Reconfigurable Dataflow Unit（RDU）架构与一体化
              SambaStack 软件层：它们让单个数据中心 机架在仅 10kW 功耗下服务万亿级参数模型。三层流式内存层级绕开了标准 GPU 的内存瓶颈，为主权机构、国防部门
              和要求安全本地执行的金融企业带来显著的总拥有成本优势。JPMorgan Chase 的生产部署，以及 Vector Core Compute 据报道、计划在三年内交付的 $3.5 billion
              基础设施订单，为商业化提供了佐证。反方则指出执行层面 的明显脆弱性。第一，私募市场看不清客户集中度、合同里程碑转化和软件订阅留存。第二，独立第三方分析师记录了 历史上的人员波动，包括 2025 年 4 月已披露的
              77 人裁员。第三，NVIDIA 无处不在的 CUDA 生态、快速的芯片 迭代，以及正在崛起的云巨头自研 ASIC，都可能压缩 SambaNova 的可服务细分市场。除非管理层证明客户合同
              能持续、可重复，而不是一次性硬件交付，风险收益比就仍然失衡。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
