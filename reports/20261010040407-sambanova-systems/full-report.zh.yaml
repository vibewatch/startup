chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与可重构数据流架构
        blocks:
          - type: paragraph
            body: >-
              SambaNova Systems, Inc. 是一家获得风险投资支持的人工智能基础设施公司，在 Delaware 注册，总部位于 California 州 San Jose，主要运营办公室此前从 Palo
              Alto 搬迁而来。公司成立之初，旨在解决传统通用图形处理单元处理复杂深度学习工作负载时的架构瓶颈，因此设计了一套软硬件一体化、纵向整合的技术栈。公司产品战略的基础是专有的 Reconfigurable
              Dataflow Architecture，具体由 Reconfigurable Dataflow
              Units（RDUs）实现：它能动态配置芯片上的计算资源和多层内存，让数据流执行从算法直接优化到硅片。不同于传统固定流水线处理器，SambaNova
              的架构将计算与内存约束解耦，使超大前沿模型和多模态神经网络能够在紧凑的数据中心功耗范围内运行，每个机架约 10 kilowatts。商业上，公司通过 SambaStack
              本地部署设备授权模式和托管云服务交付算力，目标客户是主权云运营商、国家科研实验室，以及需要严格数据驻留和本地边界控制的高度受监管全球企业。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
