              - CR010
      - number: '7.4'
        title: 财务模型、估值波动与论点失效情景
        blocks:
          - type: paragraph
            body: >-
              SambaNova 激进融资，既说明机构支持强，也说明业务资本密集度高。2026 年 7 月，公司完成由 General Atlantic 领投的 Series F 战略融资首轮交割，融资额 $1.0
              billion，投后估值 $11.0 billion [CR011]。 但私募二级市场交易显示流动性不足、价格发现不透明 [CR012]；如果公开市场 AI 公司的估值倍数收缩， 账面 headline
              估值可能大幅压缩 [CR011]。未经审计的财务指标无法确认硬件销售与云 API token 收入各自的毛利率；晶圆成本一旦上升，下行风险就会暴露 [CR006]。在下行情景中，Vector Core
              Compute 取消或下调承诺，都可能成为致命的论点失效触发点，让 SambaNova 积压硬件库存并承受营运资金压力 [CR008,
              CR014]。尽调必须核实客户合同的可执行性、取消赔偿，以及经过独立审计的单位经济模型 [CR014]。
            claimRefs:
              - CR006
              - CR008
              - CR011
              - CR012
              - CR014
