        title: 市场规模：TAM、SAM 与可触达推理机会
        blocks:
          - type: paragraph
            body: >-
              人工智能加速器的可触达市场正从集中式模型预训练，结构性转向分布式企业和主权推理执行。行业预测认为，到 2026 年，AI 硬件加速器的总体可服务市场约为 $150
              billion，其中专用企业和云推理基础设施对应约 $45 billion 的可服务市场。在这一范围内，受监管本地部署和主权 AI 部署预计构成 $18 billion
              市场，驱动力来自严格的隐私、合规和国家安全要求。SambaNova 通过部署于主要国家实验室和全球金融机构的硬件系统，直接服务这一细分市场。
