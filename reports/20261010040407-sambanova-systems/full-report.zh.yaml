        - 超大规模云厂商与 NVIDIA GPU 生态在开发者心智和 CUDA 软件兼容性上占据主导
        - 发布独立 MLPerf 推理基准，证明相对 NVIDIA Blackwell 系统具备 >=2 倍的性价比优势
      - - 客户验证
        - JPMorgan Chase 的头部机构采用，加上 Vector Core Compute 据报道 $3.5B 的多年基础设施订单，验证了企业需求
        - 收入集中在少数主权 / 国防客户，合同交付里程碑未经验证，收入因此可能大幅波动
        - 经审计的客户收入确认显示，超过 25 个不同生产客户中，非政府企业收入占比超过 50%
      - - 估值倍数
        - General Atlantic 领投的 $11.0B Series F 首轮融资锚定市场共识，并锁定多年增长跑道
        - 私募二级市场每股交易价为 $70.13（较 $127.10 优先股价格折价约 45%），显示市场流动性不足
        - 二级市场拍卖价格向 $127.10 的 Series F 基准收敛，买卖价差收窄且成交量上升
      - - 资本与流动性
        - 累计融资总额超过 $2.39B，加上一级机构支持，为公司穿越硬件流片周期提供显著跑道
        - 半导体流片和定制系统制造持续消耗数亿美元现金，存在下轮融资稀释风险
        - 验证经营现金流为正，或通过生产盈利确保现金跑道可延伸超过 24 个月
    notes: 论点综合管理层披露和企业采用里程碑；反论点纳入 Forge Global 的私募二级定价、历史裁员及未经验证的商业积压订单。
