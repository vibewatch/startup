    title: 公司里程碑时间线
    type: timeline
    summary: 梳理 SambaNova Systems 2017 至 2026 年的创立、架构、融资、产品发布和合作伙伴关系关键里程碑。
    data:
      items:
        - label: 2017-11
          title: Company Founding & Seed
          detail: Rodrigo Liang、Kunle Olukotun 和 Chris Ré 在 Palo Alto 创立公司，将可重构数据流计算商业化。
          tone: positive
        - label: 2018-06
          title: Series A ($56.6M)
          detail: Walden International 与 GV、Celesta Capital 共同领投 Series A，启动 RDU 芯片开发。
          tone: positive
        - label: 2019-04
          title: Series B ($150M)
          detail: Intel Capital 领投 Series B，GV 参与，加速芯片流片和编译器开发。
          tone: positive
        - label: 2020-02
          title: Series C ($250M)
          detail: BlackRock 领投 Series C，投后估值 $2.5B，为软件栈扩张和企业市场进入提供资金。
          tone: positive
        - label: 2020-12
          title: Emergence from Stealth & GA
          detail: DataScale 系统和 AI-as-a-Service 模式商业化发布，并获得 Best Innovation in AI Hardware。
          tone: positive
        - label: 2021-04
          title: Series D ($676M)
          detail: SoftBank Vision Fund 2 领投 Series D，投后估值 $5.1B，Temasek、GIC 和 BlackRock 共同参与。
          tone: positive
        - label: 2025-04
          title: Workforce Restructuring
          detail: Data Center Dynamics 报道公司裁员 77 人，运营收缩发生在私募市场融资干涸之际。
          tone: negative
        - label: 2026-02
          title: Series E & SN50 Unveiling
          detail: Vista Equity Partners 与 Cambium Capital 共同领投 $350M Series E，估值重置为 $2.34B；同时宣布 SN50 芯片。
          tone: warning
        - label: 2026-07
          title: Series F ($1B First Close) & JPMorgan
          detail: General Atlantic 以 $11B 投后估值领投 $1B 首次交割；JPMorgan Chase 部署 SN40L 和 SN50 系统。
          tone: positive
        - label: 2026-08
          title: Global Strategy Expansion
          detail: Mohsen Moazami 被任命为全球战略副主席，负责推动主权 AI 和国际企业增长。
          tone: positive
