      - number: '3.4'
        title: 转换成本、锁定与护城河防御力
        blocks:
          - type: paragraph
            body: >-
              尽管技术执行力强、分销协议也颇具影响力，SambaNova 仍面临能够保护现有 GPU 部署的高昂结构性转换成本。企业 AI 开发仍几乎完全标准化在 NVIDIA 的 CUDA 库、triton
              编译器和成熟编排工具上。采用 SambaNova 要求客户将软件工作负载迁移至专有的 SambaFlow 编译器工具链，这会给不愿管理异构软件环境的工程团队带来很大阻力。此外，SambaNova
              商业协议中的合同机制进一步强化平台依赖。根据 SambaStack
              本地部署服务条款，客户购买硬件设备，但按持续订阅期限授权系统软件；一旦不续约，客户必须立即停止使用软件，资本性硬件实际上会因失去可运行时而闲置。再加上 NVIDIA 激进的产品路线，以及
              Cerebras、Etched 等资金充足的初创公司，SambaNova 的长期防御力取决于大型智能体模型的推理需求能否足够快地增长，克服企业对 CUDA 的惯性。
            claimRefs:
              - CP001
              - CP009
              - CP010
