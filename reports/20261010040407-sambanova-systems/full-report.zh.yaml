  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: AI 加速器版图与竞争分类
        blocks:
          - type: paragraph
            body: >-
              人工智能加速市场由根深蒂固的现有巨头和不断扩大的专业架构挑战者群体构成。NVIDIA 凭借普及率极高的 H100 和 Blackwell GPU 架构，以及 CUDA 软件生态自我强化的开发者锁定，预计占据 AI
              硬件加速器市场 85% 的份额。在这一主导格局下，竞争者分为 Google TPU、AWS Trainium 等云超大规模厂商自研芯片，以及瞄准低延迟推理的专业风险投资芯片公司。在独立同业中，Cerebras
              Systems 凭借晶圆级整合引擎和 IPO 后规模，提供最接近的架构对照；Groq 则通过其 Language Processing Unit 设计实现超低延迟确定性执行，尽管它在 2025 年 12 月向
              NVIDIA 授权了核心技术。与此同时，Etched 成为资金充足的竞争者，于 2026 年 7 月以 $10.3B 估值完成 $300M Series
              A，目标是混合专家模型推理。在这一版图中，SambaNova 不只是组件供应商，而是提供专用机架级计算和托管云平台的全栈基础设施商。
            claimRefs:
