      - number: '3.3'
        title: 商业封装、交付模式与 GTM 分销
        blocks:
          - type: paragraph
            body: >-
              SambaNova 通过三种商业交付模式分销计算基础设施，以覆盖处于不同部署成熟度的客户。开发者和数字原生公司可在基于用量的消费框架下，通过 SambaCloud API 使用 Llama、DeepSeek 和
              MiniMax 等预训练开放权重模型。对于有严格数据主权要求的受监管企业和公共部门机构，SambaStack 提供专用 RDU 集群，部署在客户运营的数据中心或托管的私有环境中。面向区域基础设施供应商，交钥匙
              SambaManaged 产品让第三方数据中心运营商能够在约 90 天内推出品牌化推理云。这一多层次 GTM 结构已推动其与 SoftBank（日本）、OVHcloud（欧洲）、SCX（澳大利亚）和
              Argyll（英国）等主权及区域云合作伙伴取得进展。这些合作让区域运营商无需改造液冷系统，就能在标准功耗范围内部署风冷 SambaRack 系统。这一商业势头支撑了 SambaNova 2026 年 6 月由
              General Atlantic 领投的 $1.0B Series F，投后估值达到 $11.0B。
