      - number: '1.2'
        title: 创始团队、学术根基与高管治理
        blocks:
          - type: paragraph
            body: >-
              SambaNova Systems 于 2017 年由资深企业硬件高管与 Stanford University 计算机科学先驱教授合作创立。联合创始人兼首席执行官 Rodrigo Liang 曾任 Sun
              Microsystems 和 Oracle 高级副总裁，负责关键任务 SPARC 企业微处理器与系统工程项目。联合创始人兼首席技术官 Dr. Kunle Olukotun 通过领导 Stanford Hydra
              Chip Multiprocessor 研究项目，被广泛视为商业多核处理器设计先驱，为 SambaNova 的并行数据流处理范式提供了基础科学支撑。联合创始人 Dr. Christopher Ré 是
              MacArthur Foundation Fellow、Stanford InfoLab 和 AI Lab 副教授，在机器学习算法与系统协同设计前沿拥有深厚理论和应用经验。治理和供应链执行还得到执行董事长
              Lip-Bu Tan 的强化；他曾任 Cadence Design Systems CEO，也是 Walden International 创始管理合伙人，其广泛的半导体晶圆代工关系提供了关键战略监督。2026
              年年中，SambaNova 启动关键高管调整，为组织成熟及潜在上市做准备，任命 Matt Padfield 为首席财务官、Rich Heaton 为软件执行副总裁，并任命前 Cisco 高管 Mohsen
              Moazami 为全球战略副董事长。
            claimRefs:
