      - number: '6.4'
        title: 客户集中度与长期扩张风险
        blocks:
          - type: paragraph
            body: >-
              SambaNova 面临明显的客户集中度和长期留存不确定性。公开申报和商业披露未报告标准化净收入留存、总收入留存或 logo 流失率，因此无法分析初始部署能否可靠扩展为后续硬件销售。此外，Vector Core
              Compute 报告中的 $3.5 billion
              订单带来重大的交易对手交付和集中度风险，公司整体收入走势高度依赖单一基础设施买家的推出计划。对于金融机构和政府实验室，漫长的硬件评估周期及每个机架的高额资本承诺，都会阻碍快速的部门交叉销售，因此必须持续监控软件层面的使用率，防止客户流失。
            claimRefs:
              - CU004
              - CU006
              - CU012
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 严格的本地部署采购与场地验收条款
            body: >-
              SambaNova 的商业合同对本地部署买家施加严格的运营和法律义务。客户必须在收到可供提货通知后 15 天内安排并支付货运提货费用；30
              天后将视为接受硬件并加速支付全部款项；若设施就绪拖延安装，还会面临费用罚金。这些条款保护供应商现金流，却给机构数据中心团队带来显著采购阻力。
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
          - type: callout
            title: 锚定基础设施交易中的极端收入集中度
            body: >-
              JPMorgan Chase 等知名企业客户证明了 SambaNova 的顶级技术可信度，但公司的收入画像似乎高度依赖大型批发承诺，例如 Vector Core Compute 报告中的 $3.5
              billion、为期三年的订单。商业健康和生产规模化在很大程度上取决于这些集中交易对手合同的执行。
            calloutType: insight
            claimRefs:
              - CU006
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管批准、反垄断申报与合同责任
        blocks:
          - type: paragraph
            body: >-
              SambaNova Systems 处于受到严密监控的监管环境中，涉及合并控制、反垄断监督和国际出口管理。2026 年 4 月，Federal Trade Commission 就涉及 SambaNova 的
              Intel Corporation 收购交易，以交易编号 20261227 批准提前终止程序 [CR001]。这一许可正式结束了对 Intel 战略投资这家 AI 芯片初创公司的初步监管反垄断审查
              [CR002]。但紧密的公司治理关系——包括 Intel CEO Lip-Bu Tan 长期担任 SambaNova 董事长——仍可能引发利益冲突敏感性和更高监管审查
              [CR002]。从商业合同角度看，SambaNova 通过标准服务条款降低运营风险：将总责任限制在过去 12 个月支付的费用内，并排除后果性损害 [CR003]。此外，标准客户合同要求严格遵守 United
              States 出口管理法规，并禁止输入受国防管制的 ITAR 数据 [CR013]，从而保护供应商拓展主权 AI 机会 [CR004]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
      - number: '7.2'
        title: 运营执行、供应链与实体部署风险
        blocks:
          - type: paragraph
            body: >-
              软硬件一体化架构在制造、组装和客户数据中心调试环节都带来重大运营风险。SambaNova 的旗舰本地部署产品线要求客户承担通过货运代理提取实体机架的全部成本、物流负担和运输风险，并在收到可供提货通知后十五天内完成
              [CR005]。客户设施未达到严格的场地就绪规格（包括电力、冷却和布线前置条件）时，将触发视为接受条款，可能造成商业摩擦或部署延迟 [CR005]。在芯片设计上，SambaNova 的
              Reconfigurable Dataflow Units 将流式数据流逻辑与三层内存层级结合起来，包括片上 SRAM、High Bandwidth Memory 和外部 DDR
              [CR006]。制造良率缺陷、先进封装瓶颈或高密度客户机架中的热不稳定，都是持续存在的运营失效模式 [CR006]。公司在 California 州 Palo Alto 和 Texas 州 Austin
              的两处企业设施之间协调这些复杂的硬件工程和客户部署工作，并在混合办公模式下管理分散的工程团队 [CR007]。
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 客户积压集中度与供应商依赖
        blocks:
          - type: paragraph
            body: >-
              SambaNova 的交易对手高度集中，放大了未来商业表现的波动。2026 年 7 月，公司披露与 Vector Core Compute 达成一笔规模达 $3.5 billion
              的商业订单，计划在三年内完成部署 [CR008]。这一里程碑大幅推高了 SambaNova 的未来订单储备，但也让公司极易受到单一买方采购延迟、里程碑争议或资产负债表恶化的冲击
              [CR008]。企业级市场已经出现头部客户采用：JPMorganChase 选择 SN40 和 SN50 系统，用于本地化企业推理 [CR009]。要避免销售管道流失，企业标杆客户的交付必须做到零失误
              [CR009]。在上游，SambaNova 依赖第三方晶圆厂产能，也需要与包括 Intel Corporation 在内的关键投资方保持生态协同 [CR002]。
              治理由管理层牵头，并由专职董事长、副董事长和董事会共同监督 [CR010]；但半导体供应链的产能分配仍是 管理层无法直接控制的外部依赖 [CR006]。
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR008
