companyProfile:
  summary: >-
    SambaNova Systems 是一家私有 AI 基础设施公司，将定制 Reconfigurable Dataflow Unit 硬件、SambaStack 软件和托管云推理服务结合起来，服务受监管企业及主权客户。公司由
    Rodrigo Liang 以及 Stanford 教授 Kunle Olukotun 和 Christopher Ré 创立，如今面向金融服务、政府和基础设施买家销售机架级本地部署系统与云推理端点。2026 年 7
    月，Series F 首次交割对应 $11.0 billion 投后估值，体现出强劲的战略兴趣；但收入、利润率、客户集中度和现金消耗的不透明，使尽调风险仍处于高位。
