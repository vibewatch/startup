            body: >-
              SambaNova 部署的公开验证，已经从早期高性能计算研究试点发展到企业和主权商业部署。第三方私募市场情报称，SambaNova 在硬件和云推理产品中已建立超过 30 家企业客户关系。早期技术验证以
              Department of Energy 的 Argonne National Laboratory 为核心，数据流系统在那里加速了宇宙数据清理和复杂科学工作负载。2026 年 7 月，JPMorgan
              Chase 选择 SambaNova 作为企业推理基础设施合作伙伴，部署 SN40L 和下一代 SN50 系统处理本地银行工作负载，商业势头进一步加速。此外，公司报告称 Vector Core Compute
              下达了 $3.5 billion、分三年执行的巨额订单；SoftBank 则是 SN50 芯片的首个部署伙伴，该芯片将于 2026 年下半年出货。
            claimRefs:
