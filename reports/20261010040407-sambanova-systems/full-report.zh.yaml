              - CV014
      - number: '8.4'
        title: 市场可比、退出路径与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              公开与私募可比基准凸显了 SambaNova 当前资本结构中的定价张力。公开股票市场上，专业半导体和硬件可比公司的 企业价值倍数较为克制；私募二级平台则明显不认可 SambaNova
              的一级市场估值基准。具体而言，Forge Global 记录的二级交易价格为每股 $70.13，对应隐含估值显著低于 $7.0 billion，也说明二级市场流动性要求相对 一级 Series F 轮约 45%
              的折价。此外，尽管高管不时将上市描述为合理的未来路径，Forge Global 数据确认 SambaNova 尚未正式认可 IPO 时间表，也未提交保密的 S-1
              注册文件。机构投资人在投入资本前，必须解决五个问题： （1）取得经审计的 GAAP 收入、产品毛利率和客户留存指标；（2）检查 JPMorgan Chase 与 Vector Core Compute
              的客户集中度明细；（3）核对二级市场交易量和折价动态；（4）验证硬件交付周期与 TSMC 晶圆分配；（5）审阅股权结构表优先权条款和反稀释触发条件。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
