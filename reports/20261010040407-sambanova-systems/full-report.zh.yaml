            body: >-
              SambaNova 披露的 Vector Core Compute $3.5 billion、为期三年的部署承诺，带来了巨大的收入和库存集中风险。 Vector Core
              一旦延迟、重新谈判或出现融资困难，都会严重打击 SambaNova 的收入走势和营运资金。
