  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 六步决策流程：从 SambaNova 的架构、客户验证、估值跃升和二级市场折价，推导出“进一步研究”的建议。
    data:
      nodes:
        - label: 1. 核心技术与 RDU 架构
          detail: 可重构数据流单元架构解决了本地部署数万亿参数推理模型的内存约束。
        - label: 2. 战略客户进展
          detail: JPMorgan Chase 的本地推理部署带来 Tier-1 客户验证；据报道，Vector Core Compute 的多年积压订单达 $3.5B。
        - label: 3. 一级市场估值跃升
          detail: Series F 一级融资以 $1.0B 成交，对应 $11.0B 投后估值（每股 $127.10），为 2026 年 2 月 Series E 的 5 倍。
        - label: 4. 资本结构与优先权压力
          detail: Series F 优先股享有 1.0x 清算优先权和 8.0% 股息率，优先于更早的风险投资轮。
        - label: 5. 私募二级市场折价
          detail: Forge Global 二级市场价格为 $70.13，较 Series F 一级发行价折价约 45%。
        - label: 6. 建议：进一步研究
          detail: 估值已被拉高，且完全没有经审计的收入或利润率披露，因此在配置资本前必须继续跟踪。
    approximationNotes: 逻辑递进图，概括投资评估阶段，不涉及定量插值。
