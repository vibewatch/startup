      - number: '2.3'
        title: 买家画像、采购路径与商业动态
        blocks:
          - type: paragraph
            body: >-
              SambaNova
              的商业进入市场动作，将企业买家划分为受监管机构、国家科研超级计算设施和专业新云基础设施运营商。企业采购通常由首席技术官和首席信息官推动，他们需要本地治理以满足数据主权和合规要求。商业合作通常以多年期硬件销售搭配持续
              SambaStack 软件订阅的形式，通过标准企业主服务协议签署。为扩大触达，SambaNova 借助区域现场营销、系统集成商和云供应商渠道联盟，承接从公有云 API 转向专用私有基础设施的开发者工作负载。
