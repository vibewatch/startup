      - number: '2.4'
        title: 采用驱动因素、结构性约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              企业对替代 AI 架构的需求，受到 GPU 运营成本飙升、现有数据中心功耗上限，以及迅速出现的、会压垮传统内存层级的智能体多轮推理模型推动。然而，SambaNova 仍面临现有 GPU
              的市场主导地位、Nvidia 和 AMD 的激进定价压力，以及企业对采用非 CUDA 软件栈的持续顾虑。此外，缺少公开的细分层面
              ARR、客户续约率未披露、毛利率不透明，也阻碍了市场渗透率的独立验证。评估长期采用韧性，需要核实公司能否持续超越最初的政府和锚定金融客户承诺扩张。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
