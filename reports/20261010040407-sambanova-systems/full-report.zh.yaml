      - number: '5.2'
        title: RDU 芯片设计与分层内存架构
        blocks:
          - type: paragraph
            body: >-
              SambaNova 技术差异化的基础是专有 Reconfigurable Dataflow Unit（RDU）处理器架构：它放弃传统 von Neumann GPU
              的指令获取和寄存器文件开销，转而使用空间映射的数据流计算图 [CE003]。为克服大语言模型解码阶段固有的内存带宽和容量瓶颈，SN40L
              一代整合三层内存层级：用于即时张量路由的片上静态随机存取存储器（SRAM）、用于活跃模型权重的 High Bandwidth Memory（HBM），以及用于参数暂存的大容量 DDR 内存
              [CE004]。这一架构直接支持 Composition of Experts 配置；SambaNova 已展示以极低切换延迟服务最多 150 个专用模型检查点，合计参数量达到一万亿 [CE004,
              CE005]。持续进行的编译器和内核级优化，会不断把推理、混合专家等新兴基础模型架构映射到可重构硅片上 [CE010]。
            claimRefs:
              - CE003
