      - number: '1.3'
        title: 资本形成、下轮融资动态与 2026 年 Series F 资本重组
        blocks:
          - type: paragraph
            body: >-
              SambaNova 的融资历史显示，公司积累了大规模机构资本，但私募市场估值也随着宏观周期剧烈波动。早期风险轮融资由 Walden International、GV（Google Ventures）和 Intel
              Capital 主导；随后，公司于 2020 年 2 月完成 $250 million Series C，由 BlackRock 管理的基金领投，估值为 $2.5 billion。2021 年 4 月，在 AI
              基础设施资本化达到高峰之际，SoftBank Vision Fund 2 联合主权财富基金 Temasek 和 GIC 领投 $676 million Series D，投后估值超过 $5.0
              billion（每股 Series D-1 优先股 $95.02）。但更广泛的市场收缩和硬件商业化周期在 2026 年 2 月促成大幅资本重组：SambaNova 完成 $350 million Series E
              融资，由 Vista Equity Partners 和 Cambium Capital 共同领投，隐含估值 $2.34 billion（每股 Series E-1 优先股
              $30.99），属于带有高级清算优先权的结构性下轮融资。五个月后，即 2026 年 7 月 8 日，公司由 General Atlantic 领投完成 $1.0 billion Series F
              首次交割，投后估值达到 $11.0 billion（每股 $127.10），实现重大反弹。所有定价轮次累计实缴股权资本约为 $2.4 billion 至 $2.5 billion。
