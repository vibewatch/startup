            body: >-
              SambaNova 的 Series F 一级融资按每股 $127.10 建立了 $11.0 billion 的投后估值，而 Forge Global 的二级 市场交易报价显示每股仅 $70.13。这一 45%
              折价说明，鉴于缺乏经审计的财务表现且 IPO 时间不确定，私募 二级市场参与者要求很高的安全边际。
            calloutType: insight
            claimRefs:
              - CV001
              - CV007
              - CV008
          - type: callout
            title: 高级清算优先权 overhang 与次级资本的下轮融资风险
            body: >-
              新授权的 Series F 优先股规模为 $1.0 billion 至 $1.2 billion，带有 1.0x 清算优先权和 8.0% 年股息率， 且优先于所有此前股权轮次。若退出估值跌破 $11.0
              billion，普通股股东和早期期权持有人将面临严重的下行 空间压缩。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
