  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、商业变现与合同机制
        blocks:
          - type: paragraph
            body: >-
              SambaNova Systems 采用多层商业变现模式，覆盖企业在私有数据中心和云推理环境中的支出。商业架构的基础是交钥匙 SambaRack 平台，它将定制 Reconfigurable Dataflow
              Unit（RDU）芯片与系统级计算、内存和网络基础设施结合。该硬件交付与提供模型编排、编译和服务运行时的专有软件平台 SambaStack 紧密集成。通过将高资本成本硬件与持续软件订阅授权打包，SambaNova
              希望在设备交付时立即确认前期收入，同时建立高毛利的年度软件续约收入。与此同时，公司提供 SambaCloud，服务希望获得托管 API 容量、又不想承诺实体数据中心占用的开发者和企业团队。

              SambaStack On-Premises 协议中的商业合同条款设定严格的财务边界，使 SambaNova 免受发货后的运营责任影响。硬件所有权和损失风险在买方于 SambaNova
              设施提货时直接转移给采购实体，而在发票全部结清前，SambaNova 依据 California Uniform Commercial Code
              保留购买款担保权益。此外，除非明确签订定制专业服务，企业客户须完全负责货运物流、进口税和安装费用。对现金流确定性而言，支付义务不可取消且不可退款；未支付余额每月产生 1.5% 的滞纳金。JPMorganChase
              选择 SN40L 和 SN50 系统用于私有本地银行业务，以及 Vector Core Compute 已宣布的 $3.5 billion
              多年期基础设施订单，均显示出可观的商业需求，但也凸显了按期交付定制系统的执行负担。
