  - id: FE001
    title: 全栈产品架构与软硬件层级
    type: stack
    summary: 展示物理 RDU 芯片、三层内存、机架级控制、编译器运行时和客户端 API 层的集成层级。
    data:
      layers:
        - label: 客户端与集成层
          detail: 兼容 OpenAI 的 REST API 端点、SambaCloud 开发者门户、Python SDK 及企业 Slack 支持渠道。
          modules:
            - OpenAI 客户端兼容层
            - SambaCloud API 网关与身份验证
            - 开发者知识库与社区 Slack
        - label: 编排与集群管理
          detail: SambaOrchestrator 自动执行模型生命周期路由、集群自动扩缩容和跨数据中心遥测收集。
          modules:
            - SambaOrchestrator 生命周期管理器
            - 分布式集群负载均衡器
            - 机群健康与遥测导出器
        - label: 编译器与图运行时
          detail: 硬件感知的图编译、内核融合、量化，以及将模型图空间映射到数据流单元。
          modules:
            - 空间数据流图编译器
            - 内核融合与内存调度器
            - 基础模型分区引擎
        - label: 系统管理与固件
          detail: 基板管理控制器、Redfish 遥测、OpenBMC 固件和 Kubernetes Helm 编排。
          modules:
            - BMC 与 Redfish 固件接口
            - 隔离网络部署控制器
            - Prometheus / Grafana 监控栈
        - label: 机架基础设施层
          detail: SambaRack 高密度机箱、配电、散热及节点间高速网络。
          modules:
            - SambaRack 模块化计算机箱
            - 高密度供电与散热子系统
            - 机箱间网络互连
        - label: 芯片与内存架构
          detail: 可重构数据流单元（RDU）处理器芯片搭配三层内存，组合片上 SRAM、HBM 和 DDR。
          modules:
