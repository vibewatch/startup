schemaVersion: report-v2
artifact: customers
slug: smarthr-inc
runDate: 2026-10-19
company:
  name: SmartHR, Inc.
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows SmartHR targets multiple buyer groups across HR, labor,
    talent, employee self-service, and IT workflows, with third-party proof that
    usage spans both SMEs and larger enterprises. The visible adoption proof is
    directionally positive but still shallow because retained public sources do
    not disclose named deployments, retention cohorts, or customer concentration.
sections:
  - id: segment-footprint
    title: Segment footprint is broad across buyers, users, and company size
    body: |-
      SmartHR publicly positions itself as a worker-friendly back-office system
      spanning HR, payroll, talent management, employee self-service, and IT
      operations rather than a single-point labor tool. The official English and
      Japanese surfaces, plus the detailed function index, show buyer relevance
      for HR and labor teams, end-user relevance for employees and frontline
      staff, and adjacent relevance for internal IT administrators who depend on
      employee identity and workflow data. Third-party descriptions reinforce
      that breadth: SmartHR is described as B2B subscription SaaS and as a
      platform serving both large enterprises and SMEs, which supports a
      multi-segment customer thesis even though the retained pool does not name
      specific live accounts.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU013, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof is real but mostly social-proof and modeled-efficiency evidence
    body: |-
      The best public adoption evidence in this pool is indirect rather than a
      set of named enterprise case studies. ITreview shows SmartHR労務管理 with
      a 4.1 out of 5 satisfaction score from 218 reviews and indicates review
      coverage across companies of all sizes as of 2026-10-05, which is useful
      proof of active usage breadth. SmartHR also markets an approximately 88%
      labor-hour reduction for a modeled 1,000-employee deployment using several
      core workflows, but that figure is a company estimate rather than audited
      production customer ROI. Taken together, the retained evidence supports
      demand and product fit more than it proves durable deployment depth.
    claimRefs: [CU005, CU006, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: durability-expansion
    title: Expansion logic is visible, but retention and concentration remain public gaps
    body: |-
      The expansion story is easier to underwrite than the retention story from
      this source set. Official materials point to more than 120 external
      integrations and a broad module set, while the 2025 MIC market report says
      top HRTech vendors continue to expand enterprise-oriented functionality and
      rely on cross-sell and up-sell. That supports a land-and-expand hypothesis
      for SmartHR if initial labor-management adoption can widen into adjacent HR
      and IT workflows. However, none of the retained public sources disclose NRR,
      GRR, churn, renewal rate, contract length, or top-customer exposure, so
      durability and concentration still require private diligence rather than
      public inference.
    claimRefs: [CU007, CU010, CU011, CU012]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / strategic value
      - Gap
    rows:
      - - HR / labor operations teams
        - Buyer and admin user; employer is payer
        - Onboarding, employment contracts, payslips, year-end adjustment, labor workflows
        - Core wedge anchored in compliance-heavy back-office tasks
        - Public sources do not show seat counts, ACV, or segment mix
      - - Employees and frontline staff
        - End users; employer pays
        - Employee self-service, portal access, document delivery, communications
        - Broadens adoption beyond HR specialists
        - No public activation, MAU, or feature penetration data
      - - Internal IT / information-systems teams
        - Adjacent admin buyer/user; employer pays
        - SaaS account lifecycle and employee-data-linked IT operations
        - Adds cross-functional expansion path beyond HR
        - No public proof of attach rate for IT workflows
      - - Large enterprises
        - Enterprise HR leadership and operations; employer pays
        - Workforce productivity and labor-management digitization
        - Third-party reporting says SmartHR serves large enterprises
        - No named enterprise logos or contract durations in retained pool
      - - SMEs
        - SME owners or HR admins; employer pays
        - Digitized labor management and payroll-adjacent workflows
        - Third-party reporting says SmartHR serves SMEs and companies of every size
        - No public SME cohort, logo retention, or ARPA disclosure
    notes: >-
      Mixes official workflow descriptions with third-party segment descriptions;
      cells describe public evidence only, and missing numeric mix means the
      table should not be read as a revenue split.
    claimRefs: [CU001, CU003, CU004, CU005, CU013, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Review count
        - 218 reviews
        - "2026-10-05"
        - ITreview labor-management category page
        - Medium
        - Public proof that SmartHR has measurable user feedback volume
        - No verified count of total paying accounts or active users
      - - Satisfaction score
        - 4.1 / 5.0
        - "2026-10-05"
        - ITreview labor-management category page
        - Medium
        - Suggests acceptable product satisfaction among visible reviewers
        - No review-distribution detail or customer-retention link
      - - Company-size coverage
        - Reviews from all company sizes
        - "2026-10-05"
        - ITreview labor-management category page
        - Medium
        - Supports breadth across SMB and enterprise-style customers
        - No breakdown by account count, spend, or segment retention
      - - Modeled efficiency outcome
        - Approximately 88% labor-hour reduction
        - "2026-10-19"
        - SmartHR Japanese homepage
        - High
        - Shows the value proposition SmartHR uses in customer acquisition
        - Modeled 1,000-employee scenario, not audited realized savings
      - - Integration footprint
        - 120+ external service integrations
        - "2026-10-19"
        - SmartHR Japanese homepage
        - High
        - Improves deployment extensibility and expansion potential
        - No public attach rate or partner-sourced revenue share
      - - Commercial scale proxy
        - $100M ARR
        - "2024-02"
        - Tech Funding News
        - Medium
        - Indicates meaningful commercial traction before the 2024 Series E
        - ARR is not customer count, retention, or current 2026 revenue
      - - Category demand backdrop
        - JPY 138.5B FY2024; JPY 168.9B FY2025E
        - "2026-02-26"
        - MIC HRTech cloud market report page
        - Medium
        - Expanding category can support new-logo acquisition
        - Market growth does not prove SmartHR-specific share gains
    notes: >-
      This table combines product, review, press, and market signals; it shows
      public adoption proxies and commercial context, not a coherent cohort with
      comparable denominators.
    claimRefs: [CU006, CU007, CU008, CU009, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof record
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / freshness
      - Limitation
    rows:
      - - ITreview reviewer cohort
        - Companies of all sizes using labor-management software
        - Labor-management workflows under the SmartHR労務管理 listing
        - Production-like usage implied by live review activity, not a disclosed pilot
        - 4.1 / 5.0 from 218 reviews as of 2026-10-05
        - Anonymous reviewers; no named accounts, contract terms, or verified outcomes
      - - Large-enterprise proof from retained press
        - Large enterprises
        - HR management and labor-productivity workflows
        - Third-party press reports active service coverage, not a named pilot
        - 2024 reporting says SmartHR serves large enterprises
        - No named customer, no module depth, and no renewal evidence
      - - SME proof from retained press
        - SMEs / companies of every size
        - HR, payroll, and labor-management digitization
        - Third-party press reports active service coverage, not a named pilot
        - 2024 reporting says SmartHR serves SMEs and companies of every size
        - No named customer, no SME cohort metrics, and no expansion data
    notes: >-
      Partial sample only: the assigned public pool contains social proof and
      segment-level descriptions but no named customer case studies, so the
      table records the strongest retained adoption proofs and their limits.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial because the retained public evidence set lacks named customer
        case studies, public logos tied to live deployments, or auditable
        renewal disclosures for this chapter.
    claimRefs: [CU004, CU005, CU008, CU009]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence suggests SmartHR lands through compliance-heavy HR workflows, then expands through adjacent employee and IT use cases.
    data:
      nodes:
        - label: Compliance-heavy HR pain is the entry point
          actor: HR / labor administrators
          stage: Entry
          touchpoints:
            - Onboarding, contracts, payslips, and year-end adjustment are explicit landing workflows.
            - Official positioning emphasizes worker-friendly back-office automation.
          tone: positive
        - label: Procurement is consultative rather than self-serve
          actor: Employer buyer
          stage: Evaluation
          touchpoints:
            - ITreview lists pricing as quote-based.
            - Public sources do not expose contract length or ACV.
          tone: warning
        - label: Initial deployment centers on HR and labor operations
          actor: HR admins and employees
          stage: Deployment
          touchpoints:
            - Employee portal and employee database are core adoption surfaces.
            - Review activity implies real-world usage but not named references.
          tone: positive
        - label: Employee-facing usage broadens product reach
          actor: All employees, including part-time workers
          stage: Usage
          touchpoints:
            - Function pages say all employees can receive timely information.
            - Portal usage can increase data completeness and daily touchpoints.
          tone: positive
        - label: Cross-sell can extend into talent and IT workflows
          actor: HR leadership and internal IT
          stage: Expansion
          touchpoints:
            - More than 120 integrations expand the deployment surface.
            - MIC says top vendors continue to rely on cross-sell and up-sell.
          tone: positive
        - label: Durability still depends on private diligence
          actor: Investor / diligence team
          stage: Validation gap
          touchpoints:
            - No retained public NRR, GRR, churn, renewal, or concentration data.
            - Named deployment proof is missing from the assigned pool.
          tone: warning
    claimRefs: [CU001, CU003, CU007, CU009, CU010, CU012]
callouts:
  - calloutType: strength
    title: Multi-surface product fit supports expansion
    body: >-
      SmartHR is not limited to payroll paperwork: the retained official sources
      show HR, employee, and internal-IT workflows that can widen account value
      after an initial labor-management deployment.
    claimRefs: [CU001, CU003, CU007]
  - calloutType: insight
    title: Public traction proof is strongest in marketplace reviews
    body: >-
      The most concrete adoption proof in the assigned pool is ITreview's live
      review footprint, which is useful for breadth and satisfaction but still
      weaker than named enterprise case studies or renewal cohorts.
    claimRefs: [CU008, CU009]
  - calloutType: risk
    title: Durability and concentration remain underdisclosed
    body: >-
      SmartHR's public evidence supports category demand and expansion logic, but
      the retained sources do not let an investor underwrite retention quality,
      top-customer exposure, or channel concentration with confidence.
    claimRefs: [CU010, CU011, CU012]
