  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-disclosure
      missingEvidence: Current NRR, GRR, logo churn, renewal rate, and contract-length disclosure for SmartHR customers.
      whyItMatters: Durability is central to underwriting expansion efficiency and valuation quality in HR SaaS.
      diligencePath: Request current cohort, renewal, and churn metrics plus customer-contract terms from management.
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: named-customer-proof
      missingEvidence: Named customer case studies or public references that tie SmartHR to live production deployments and measured outcomes.
      whyItMatters: Review counts and investor quotes show usage breadth but are weaker than attributable deployment proof.
      diligencePath: Ask for three referenceable customers by segment with module scope, go-live date, ROI, and renewal status.
      relatedQuestionRefs: [QU002]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer, partner-channel, and segment concentration data for SmartHR's revenue base.
      whyItMatters: A broad workflow footprint can still mask dependence on a small number of large accounts or channels.
      diligencePath: Request revenue concentration by top accounts, channel mix, and segment mix over the last twelve months.
      relatedQuestionRefs: [QU007]
