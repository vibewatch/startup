  - id: FE001
    title: Public product architecture map
    type: stack
    summary: >-
      Public evidence points to a layered SmartHR stack that starts with employee touchpoints, runs through HR/talent/IT
      applications, and rests on shared data plus managed Google Cloud infrastructure.
    data:
      layers:
        - label: Employee touchpoints
          detail: Employee-facing access surfaces include portal, mobile access, payslips, forms, and communications.
          modules:
            - Employee portal
            - Mobile access
            - Document delivery
            - Approvals / forms
          outputs:
            - Information distribution to all employees
            - Timely access for frontline and office workers
        - label: HR compliance workflows
          detail: >-
            Core labor-management workflows cover onboarding, contracts, payroll-adjacent operations, and year-end
            adjustment.
          modules:
            - Onboarding / employment contracts
            - Payroll calculation
            - Payslips
            - Year-end adjustment
          outputs:
            - Paperless HR administration
        - label: Talent and organization workflows
          detail: Talent tools reuse the same workforce data across evaluation, planning, and development processes.
          modules:
            - Recruiting / candidate flow
            - Evaluation
            - Workforce allocation
            - Skills / qualifications / training
            - Surveys / analytics
          outputs:
            - Strategic people-management workflows
        - label: IT operations automation
          detail: IT-oriented features extend SmartHR into account lifecycle administration and AI-assisted employee support.
          modules:
            - SaaS account creation / deletion
            - Browser automation for non-API services
            - 24/7 AI inquiry response
          outputs:
            - Employee-data-driven IT operations
        - label: Shared employee data and integrations
          detail: A common employee-data layer supports records, org views, change history, and ecosystem connections.
          modules:
            - Employee database
            - Org chart generation
            - Change history
            - Future-dated changes
            - 120+ external integrations
          outputs:
            - Reusable master data across modules
        - label: Managed platform and controls
          detail: >-
            Google describes a managed Google Cloud runtime with standardized stacks, Terraform, and Google
            Workspace-linked permissions.
          modules:
            - Cloud Run front end
            - App Engine flexible back end
            - Terraform
            - Google Workspace permissions
          outputs:
            - Standardized product stacks
            - Reported 500 rps headroom
    claimRefs:
      - CE002
      - CE003
      - CE006
      - CE007
      - CE008
      - CE009
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests SmartHR lands through compliance-heavy HR workflows, then expands through adjacent
      employee and IT use cases.
    data:
      nodes:
        - label: Compliance-heavy HR pain is the entry point
          actor: HR / labor administrators
          stage: Entry
          touchpoints:
            - Onboarding, contracts, payslips, and year-end adjustment are explicit landing workflows.
            - Official positioning emphasizes worker-friendly back-office automation.
          tone: positive
        - label: Procurement is consultative rather than self-serve
          actor: Employer buyer
          stage: Evaluation
          touchpoints:
            - ITreview lists pricing as quote-based.
            - Public sources do not expose contract length or ACV.
          tone: warning
        - label: Initial deployment centers on HR and labor operations
          actor: HR admins and employees
          stage: Deployment
          touchpoints:
            - Employee portal and employee database are core adoption surfaces.
            - Review activity implies real-world usage but not named references.
          tone: positive
        - label: Employee-facing usage broadens product reach
          actor: All employees, including part-time workers
          stage: Usage
          touchpoints:
            - Function pages say all employees can receive timely information.
            - Portal usage can increase data completeness and daily touchpoints.
          tone: positive
        - label: Cross-sell can extend into talent and IT workflows
          actor: HR leadership and internal IT
          stage: Expansion
          touchpoints:
            - More than 120 integrations expand the deployment surface.
            - MIC says top vendors continue to rely on cross-sell and up-sell.
          tone: positive
        - label: Durability still depends on private diligence
          actor: Investor / diligence team
          stage: Validation gap
          touchpoints:
            - No retained public NRR, GRR, churn, renewal, or concentration data.
            - Named deployment proof is missing from the assigned pool.
          tone: warning
    claimRefs:
