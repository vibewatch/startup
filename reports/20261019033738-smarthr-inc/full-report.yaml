            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Financing context and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The financing context remains directionally positive but numerically unstable. Tracxn reports a $140M
              Series E on 2024-06-30 and $328M raised over 9 rounds, while Indexed lists $597.0M raised over 8 rounds
              and a later $96.0M growth equity round in November 2025. That spread is too large to treat either record
              as a precise valuation anchor without management confirmation. The best visible comparable set in the
              assigned pool is still public HCM and payroll software, because Tracxn places Workday and Paychex in
              SmartHR's top competitor set and ADP's investor page shows how large public incumbents can be at scale.
              But the assigned Workday SEC ixviewer fetch did not expose usable operating text, so the chapter still
              lacks a filing-backed public-comp revenue or multiple bridge that could tighten SmartHR's valuation range
              from public evidence alone.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenarios, exit readiness, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The practical result is a track recommendation with an explicitly conditional upgrade path. A bull outcome
              requires management to verify current ARR, gross margin, retention, and preference stack while also
              showing that the higher vendor-reported financing path is real and potentially converging toward a broader
              exit window. The base case keeps SmartHR in a wide $1.0B-$1.6B public evidence band, because the assigned
              sources do show product breadth and market position, but they do not prove premium economics. The bear
              case is a secondary or next-round markdown toward the lower end of that range if liquidity stays
              constrained, no public IPO process appears, or new capital arrives above the highest visible marks without
              stronger fundamentals. Final diligence should focus on current recurring revenue, retention, margin
              profile, customer concentration, and liquidation preferences before any price-led upgrade.
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: track, not buy'
            body: >-
              SmartHR still looks strategically relevant, but the assigned public evidence does not justify paying
              through a premium private mark before current economics and cap-table terms are verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: callout
            title: Main underwriting gap
            body: >-
              The biggest unresolved variable is not product quality but missing current ARR, margin, retention, and
              liquidation-preference evidence, which leaves upside and downside too sensitive to private information.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV015
