      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              TechCrunch reported a $140 million Series E led by KKR and Teachers' Ventures Growth, with the company
              saying the proceeds would fund new solutions, hiring, and organic and inorganic growth strategies. A later
              Business Wire-syndicated item on HRTechEdge reported a $96 million strategic minority investment from
              General Atlantic, but that article also says the stake was acquired from Coral Capital, which matters
              because a secondary share purchase is not the same as new cash available on SmartHR's balance sheet.


              The financing picture therefore signals sponsor support but not underwritten runway. Caplight shows an
              estimated $1 billion valuation, while TechCrunch said the company declined to comment on its current
              valuation. Together, the assigned pool is strong enough to support a view that SmartHR has institutional
              access to capital and real ARR scale, but not strong enough to underwrite current liquidity, efficiency,
              or valuation resilience without private-company materials.
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
