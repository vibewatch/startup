chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and public scale signals
        blocks:
          - type: paragraph
            body: >-
              Assigned official materials consistently frame SmartHR as more than a narrow payroll or e-government
              filing tool. The English homepage and service pages describe a worker-friendly back-office system spanning
              HR and labor management, payroll, attendance, talent management, employee self-service, and IT operations,
              while the Japanese product pages add evidence of employee-database, employee-portal, and SaaS
              account-management workflows. That breadth matters because later chapters should treat SmartHR as a
              platform play inside Japanese back-office software rather than as a single-feature compliance utility.
              Public scale signals are directionally strong but should be handled as company claims: SmartHR says the
              service launched in 2015, had signed up more than 80,000 companies as of April 2026, and had surpassed 2
              million mobile app installations as of February 2026. The same Japanese homepage also markets seven
              consecutive years of labor-management-cloud leadership and a modeled 88% reduction in total work hours for
              a 1,000-employee deployment, but those performance and share claims are not independently corroborated in
              the assigned pool. Headquarters, stage, valuation, and headcount remain weaker than product-scope evidence
              because the strongest public figures come from third-party preview pages rather than primary financing
              documents or company filings.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO007
              - CO008
              - CO009
