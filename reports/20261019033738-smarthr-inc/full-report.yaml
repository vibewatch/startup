      - number: '4.2'
        title: Monetization transparency and unit-economics blind spots
        blocks:
          - type: paragraph
            body: >-
              The retained official pages clearly show breadth of product surface - labor management, talent management,
              employee portal, employee database, and IT-oriented adjacencies - but they do not publish public list
              prices, contract terms, or realized discounting. Caplight's company page supports the high-level delivery
              model by classifying SmartHR as B2B subscription SaaS, yet that still falls short of the pricing evidence
              needed to bridge product breadth into actual ACV, take rate, or expansion math.


              The independent market backdrop is supportive rather than sufficient. Deloitte Tohmatsu MIC says Japan's
              HRTech cloud market is expanding, and MarketsandMarkets projects continued cloud-industry growth into
              2025, but neither source repairs the company-specific blind spots. No retained source in this chapter
              discloses gross margin, CAC, payback, NRR, burn, or cash runway, so the public record supports demand and
              software orientation, not a full unit-economics case.
