        title: Exhibits
        blocks:
          - type: callout
            title: Multi-surface product fit supports expansion
            body: >-
              SmartHR is not limited to payroll paperwork: the retained official sources show HR, employee, and
              internal-IT workflows that can widen account value after an initial labor-management deployment.
            calloutType: strength
            claimRefs:
