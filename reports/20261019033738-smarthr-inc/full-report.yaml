      - number: '5.3'
        title: Trust, deployment support, and technical risk
        blocks:
          - type: paragraph
            body: >
              SmartHR does show public support and deployment scaffolding: help-center content, paid-plan chat support,
              seminars, e-learning, and onboarding guides all suggest implementation is not treated as a pure self-serve
              motion. The integration surface is real as well, with public external-service integrations, a
              SmartHR-authored OmniAuth package, and third-party API commentary. Still, the most concrete independent
              developer evidence also highlights the main technical risk: public automation around SmartHR appears to
              depend on ordinary REST and OAuth flows rather than an official MCP layer, and scope handling plus token
              refresh are described as recurring failure modes. For diligence, that means SmartHR's product maturity
              looks credible for operators and buyers, but the external builder experience and trust controls need more
              direct verification than the assigned pool provides.
            claimRefs:
              - CE004
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Differentiation and roadmap direction
        blocks:
          - type: paragraph
            body: >
              The strongest public differentiator is not a single algorithmic moat but the combination of a broad
              Japanese HR workflow footprint, a unified employee-data model, and adjacent IT-operations automation.
              SmartHR's October 2026 browser-automation expansion matters because it extends the platform into account
              lifecycle tasks for non-API services, which is consistent with the company's positioning around
              employee-data-driven back-office coordination. That can deepen workflow lock-in if execution is strong,
              but it also raises the diligence bar on permissions, auditability, and reliability across connected
              third-party systems. Public materials do not yet provide enough direct evidence on those controls to
              underwrite them confidently.
            claimRefs:
              - CE005
              - CE009
              - CE010
              - CE013
