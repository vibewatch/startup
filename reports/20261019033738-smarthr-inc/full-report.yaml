  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The call stays at track because operating proof is visible but valuation proof is not.
    data:
      nodes:
        - id: product
          label: Product scope
          note: Official pages still position SmartHR across HR, payroll, talent, employee self-service, and IT operations.
        - id: proof
          label: Commercial proof
          note: Japanese pages cite 120+ integrations, modeled workflow savings, and a seven-year No.1 share claim.
        - id: financing
          label: Financing anchors
          note: The assigned vendor pages disagree on total capital raised and latest financing timing.
        - id: valuation
          label: Valuation conflict
          note: Visible current marks span $1.0B to $1.6B, which is too wide for a precise entry call.
        - id: public-comp-gap
          label: Public-comp gap
          note: >-
            Closest public comps are visible, but the assigned Workday filing fetch did not expose usable operating
            text.
        - id: call
          label: Current call
          note: Track until management verifies ARR, retention, gross margin, concentration, and preference terms.
