      - number: '6.2'
        title: Adoption proof is real but mostly social-proof and modeled-efficiency evidence
        blocks:
          - type: paragraph
            body: |-
              The best public adoption evidence in this pool is indirect rather than a
              set of named enterprise case studies. ITreview shows SmartHR労務管理 with
              a 4.1 out of 5 satisfaction score from 218 reviews and indicates review
              coverage across companies of all sizes as of 2026-10-05, which is useful
              proof of active usage breadth. SmartHR also markets an approximately 88%
              labor-hour reduction for a modeled 1,000-employee deployment using several
              core workflows, but that figure is a company estimate rather than audited
              production customer ROI. Taken together, the retained evidence supports
              demand and product fit more than it proves durable deployment depth.
            claimRefs:
              - CU005
              - CU006
