  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk view
        blocks:
          - type: paragraph
            body: >
              The risk picture is driven less by evidence of a single acute failure and more by how much operational and
              compliance surface SmartHR now spans. Official and partner materials place the product inside employee
              system-of-record workflows, payroll, talent management, government reporting, employee self-service, and
              IT account operations, while Japanese-language product pages add 120+ integrations and a 2026
              browser-automation extension for account creation and deletion on non-API services. That breadth raises
              the blast radius of any control, uptime, or configuration failure because the same platform touches
              regulated labor workflows, sensitive employee data, and downstream SaaS access in one operating loop.


              The second risk cluster is execution dependence. General Atlantic's 2025 transaction paired a new minority
              investor with an explicit plan for product expansion, partnerships, M&A, customer engagement, and GTM
              enhancement, while market research describes a fast-growing Japanese HRTech cloud category with 49 vendors
              and continued enterprise cross-sell and upsell pressure. SmartHR may be well positioned, but sustaining
              leadership now depends on shipping new modules, defending enterprise share, and coordinating an expanding
              integration ecosystem rather than simply riding first-wave digitization.


              The third cluster is financing and diligence opacity. Public signals show a strategic investment and
              secondary activity, but the assigned pool still leaves current ARR, churn, cash burn, and
              primary-cash-versus-secondary detail underdetermined. One discovered valuation URL is unusable because it
              resolves to unrelated consumer content, and another market-data page exposes only a preview plus
              sign-up-gated pricing history. That makes legal, security, and financing downside monitorable, but not
              fully underwritten, from public evidence alone.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Regulatory and operational exposure
        blocks:
          - type: paragraph
            body: >
              SmartHR's own materials are enough to show why legal, privacy, and operational risk matter even without a
              confirmed current enforcement action in the assigned pool. The company positions the platform as a system
              for payroll, labor management, talent workflows, employee records, government-reporting support, and IT
              operations. In practice that means errors can propagate into wage calculations, employee-data handling,
              statutory filings, access provisioning, and communications to a broad employee base rather than staying
              inside a narrow point tool.


              Mitigation evidence exists, but it is still mostly company-issued. SmartHR's feature pages cite
              encryption, audit logs, change-history management, and centralized employee data, which are directionally
              positive controls. The same source set, however, also shows new automation layers and broad
              external-service connectivity, so the residual question is not whether controls exist at all but whether
              they are independently tested at the scale implied by market-leadership claims. Because the assigned pool
              contains no regulator, court, certification, or incident-database source, the clean public record should
              be treated as an evidence gap, not as proof of no legal, security, or outage exposure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.3'
        title: Dependency, financing, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >
              Partner and capital dependencies are material because the public growth narrative is now intertwined with
              outside actors. General Atlantic's announcement frames SmartHR's next phase around strategic partnerships,
              GTM enhancement, customer support, M&A, and global scaling expertise, and the transaction itself involved
              buying Coral Capital's stake while Coral remained a minority shareholder. That structure can still be
              positive, but it means the most visible 2025 financing signal is not a simple clean read on fresh
              balance-sheet cash, which matters when investors try to judge runway or acquisition capacity from
              headlines alone.


              Market-data visibility is also imperfect. Caplight's preview page surfaces an estimated $1 billion
              valuation, an IPO-labelled last round, and a 2025 secondary event, but with pricing history locked behind
              sign-up. A separate discovered valuation URL resolves to unrelated WOWLS content, highlighting how fragile
              some third-party private-market evidence can be. Combined with MIC's view of a rapidly growing market
              where leading vendors are broadening enterprise functionality and pursuing cross-sell, the practical kill
              criteria are clear: evidence of compliance or security breakdown in payroll-grade workflows, failure to
              convert breadth into durable enterprise execution, or financing diligence that still cannot separate
              secondary liquidity from primary growth capital.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers to monitor
            body: >-
              Three events would most directly break the current risk case: a verified compliance or security failure
              touching payroll or employee-data workflows; evidence that SmartHR's expansion surface is creating more
              integration or provisioning fragility than customer value; or financing diligence that still cannot
              distinguish primary growth capital from secondary liquidity after the 2025 General Atlantic transaction.
            calloutType: risk
            claimRefs:
              - CR004
              - CR007
              - CR010
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              The strongest positive evidence in the assigned pool is operational rather than valuation-specific:
              SmartHR still describes itself as a worker-friendly back-office system spanning HR, payroll, talent
              management, employee self-service, and IT operations, while its Japanese product pages continue to present
              a broad feature set, 120-plus integrations, and modeled workflow savings for customers. That operating
              breadth keeps the company on a watchlist, but it does not clear the price test on its own. The current
              underwriting problem is that public market-data vendors disagree materially on both funding history and
              present value, with Tracxn showing a $1.6B current valuation and Caplight estimating $1.0B. Caplight also
              says SmartHR remains private, has no public market price, and has no publicly announced IPO plan, so there
              is no liquid public benchmark to validate an aggressive entry multiple today.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV016
