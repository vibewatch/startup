        title: Revenue model and disclosed traction
        blocks:
          - type: paragraph
            body: >-
              SmartHR's official surfaces position the business as a back-office software system spanning HR, payroll,
              talent management, employee self-service, and IT operations, while the Japanese product pages frame
              employee data as a centralized system-of-record asset that supports multiple workflow modules. That makes
              the public model look like multi-module B2B software rather than transaction revenue or services-heavy
              delivery, and third-party market data also classifies the company as subscription SaaS.


              Public scale disclosure is still narrow but meaningful. TechCrunch reported ARR of $100 million as of
              February 2024 and total FY2023 revenue of $80 million. Those figures establish real commercial traction,
              but they are stale relative to the 2026 run date and do not disclose current revenue mix by module,
