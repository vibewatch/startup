              - CO010
      - number: '1.2'
        title: Leadership bench, founder narrative, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founder-market-fit story is unusually clear in official materials. SmartHR says Shoji Miyata started
              the company after seeing pregnancy- and childcare-related paperwork place a needless burden on employees
              and employers, which directly connects product origin to Japan's paper-heavy labor and social-insurance
              workflows. Public leadership coverage beyond that origin story is thinner. The English business page names
              Masato Serizawa as CEO, and Caplight's preview page lists Yuji Mori as CFO, Takafumi Kurahashi as COO, and
              Takashi Adachi as Chief Product Officer, which is enough to establish a functional executive bench but not
              enough to underwrite governance quality, board composition, succession depth, or decision rights. In
              practical diligence terms, SmartHR looks founder- and management-led, but the assigned sources do not
              provide the governance detail that would let an investor separate brand narrative from institutionalized
              operating controls.
            claimRefs:
              - CO004
              - CO015
              - CO016
