  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Management verifies current ARR, margin, and retention; the higher vendor-reported funding path is real; and
          exit options broaden.
        - >-
          >$1.6B only after disclosed economics and financing evidence catch up with the strongest visible
          private-market signals.
        - Execution or disclosure fails to confirm premium SaaS quality.
        - Needs fresh financing or IPO evidence plus hard KPI disclosure.
      - - Base
        - >-
          Product breadth and claimed category position hold, but only mixed private-market data and company pages
          remain public.
        - $1.0B-$1.6B because the assigned pool supports strategic relevance but not precise premium underwriting.
        - Range stays too wide for an immediate buy decision.
        - Best fit with today's evidence set.
      - - Bear
        - >-
          Liquidity stays constrained, no IPO path appears, and the next financing clears closer to secondary
          indications than headline historical rounds.
        - <=$1.0B if downside price discovery dominates and fundamentals remain undisclosed.
        - A markdown can arrive before public KPI disclosure.
        - Consistent with the lower visible Caplight estimate and transfer restrictions.
      - - Diligence gate
        - Investors obtain current ARR, NRR, gross margin, customer concentration, and liquidation preference data.
        - Only then can expected return be tied to a specific entry price instead of a wide evidence band.
        - Without this package, apparent upside can be illusory.
        - Mandatory before an upgrade from track.
    notes: >-
      Ranges are bounded by the visible $1.0B and $1.6B marks in the assigned sources and should not be treated as
      precise fair values.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
