      - number: '1.3'
        title: Funding visibility and milestone cadence
        blocks:
          - type: paragraph
            body: >-
              The assigned pool shows a meaningful public milestone cadence, but financing transparency is still
              incomplete. SmartHR's official materials support a 2015 launch, a 2025 tenth anniversary, and continued
              2026 product and partnership activity, including AI-assisted browser automation and an HRD
              talent-management partnership. Caplight adds a visible round sequence from Series B in 2018 through Series
              E in 2024, a secondary round in late 2025, and an IPO-labelled round on 2026-03-17, plus a $1.0B estimated
              valuation and $357.79M of total funding raised. Those numbers are useful discovery signals, but they
              remain low confidence for investment judgment because the public page withholds detailed pricing charts,
              filing records, and underlying transaction support. The only clearly adverse view in the assigned pool
              comes from a 2026 Substack analysis, which argues SmartHR's original moat was automating manual data entry
              in Japanese offices and that generative AI could commoditize that entry point unless SmartHR turns
              accumulated HR data into higher-value decision support.
