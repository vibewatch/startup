      - number: '5.2'
        title: Architecture, integrations, and operating model
        blocks:
          - type: paragraph
            body: >
              The clearest public operating-model evidence comes from Google Cloud's migration case study. It describes
              SmartHR as having rebuilt the platform on managed Google Cloud services, with Cloud Run used for front-end
              Rails applications and App Engine flexible environment used for longer-running asynchronous back-end
              processing. The same case study says the migration was used to standardize product stacks, spread
              operational knowledge across teams, and make Terraform-based controls easier to apply. Taken together with
              SmartHR's own emphasis on a central employee database and 120-plus integrations, the public picture is of
              an application suite whose architecture is organized around shared data, managed runtime layers, and
              ecosystem connectivity rather than bespoke on-premise deployment.
            claimRefs:
              - CE003
