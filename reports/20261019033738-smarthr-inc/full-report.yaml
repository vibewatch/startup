          - type: callout
            title: Strategic capital helps, but does not equal proven runway
            body: >-
              The 2024 Series E proceeds were earmarked for product, hiring, and M&A, and the later General Atlantic
              transaction signals sponsor interest, but the same assigned evidence does not disclose current cash on
              hand and the later minority deal appears at least partly secondary rather than clearly fresh primary
              capital.
