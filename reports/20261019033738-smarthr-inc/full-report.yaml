          - type: callout
            title: Public traction proof is strongest in marketplace reviews
            body: >-
              The most concrete adoption proof in the assigned pool is ITreview's live review footprint, which is useful
              for breadth and satisfaction but still weaker than named enterprise case studies or renewal cohorts.
            calloutType: insight
