  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow coverage
        blocks:
          - type: paragraph
            body: >
              SmartHR is not presented as a single payroll point tool; its own English and Japanese surfaces describe a
              broader back-office suite that combines HR, payroll, talent management, employee self-service, and IT
              operations around shared employee records. The Japanese function catalog also shows separate product
              families for labor management, talent management, employee portal, employee database, IT solutions, and
              supporting utilities, which supports a module-map view rather than a monolith story. That breadth is
              strategically useful because it lets SmartHR sell around a common employee-data core, but it also means
              investors should diligence attach rates by module instead of assuming every installed account uses the
              full stack.
            claimRefs:
              - CE001
