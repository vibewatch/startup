            title: The buyer can still exit to accessibility, ecosystem, or global-standardization alternatives
            body: >-
              freee HR, MoneyForward, outsourced operators, and global suites each offer a credible reason to bypass
              SmartHR when English usability, pre-existing accounting stack, or multinational standardization matters
              more than SmartHR's deeper domestic HR scope.
