        title: Exhibits
        blocks:
          - type: callout
            title: Public economics stop at scale, not efficiency
            body: >-
              SmartHR has real public revenue scale, but the retained pool still lacks current gross margin,
              CAC/payback, NRR, burn, cash, and debt disclosure, so capital adequacy remains a diligence blocker rather
              than a solved underwriting input.
            calloutType: risk
            claimRefs:
