schemaVersion: "report-v2"
artifact: valuation
slug: smarthr-inc
runDate: 2026-10-19
company:
  name: "SmartHR, Inc."
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    SmartHR still shows enough category proof to stay investable, but the assigned
    valuation evidence does not support a fresh buy call. Public signals conflict on
    both total capital raised and current mark, while current ARR, retention, margin,
    and cap-table terms remain private, so the evidence-backed stance is track until
    price discovery improves.
sections:
  - id: recommendation-and-price-sensitivity
    title: "Recommendation and price sensitivity"
    body: >-
      The strongest positive evidence in the assigned pool is operational rather than
      valuation-specific: SmartHR still describes itself as a worker-friendly
      back-office system spanning HR, payroll, talent management, employee
      self-service, and IT operations, while its Japanese product pages continue to
      present a broad feature set, 120-plus integrations, and modeled workflow
      savings for customers. That operating breadth keeps the company on a watchlist,
      but it does not clear the price test on its own. The current underwriting
      problem is that public market-data vendors disagree materially on both funding
      history and present value, with Tracxn showing a $1.6B current valuation and
      Caplight estimating $1.0B. Caplight also says SmartHR remains private, has no
      public market price, and has no publicly announced IPO plan, so there is no
      liquid public benchmark to validate an aggressive entry multiple today.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context-and-comparable-signals
    title: "Financing context and comparable signals"
    body: >-
      The financing context remains directionally positive but numerically unstable.
      Tracxn reports a $140M Series E on 2024-06-30 and $328M raised over 9 rounds,
      while Indexed lists $597.0M raised over 8 rounds and a later $96.0M growth
      equity round in November 2025. That spread is too large to treat either record
      as a precise valuation anchor without management confirmation. The best visible
      comparable set in the assigned pool is still public HCM and payroll software,
      because Tracxn places Workday and Paychex in SmartHR's top competitor set and
      ADP's investor page shows how large public incumbents can be at scale. But the
      assigned Workday SEC ixviewer fetch did not expose usable operating text, so the
      chapter still lacks a filing-backed public-comp revenue or multiple bridge that
      could tighten SmartHR's valuation range from public evidence alone.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios-exit-readiness-and-diligence
    title: "Scenarios, exit readiness, and final diligence asks"
    body: >-
      The practical result is a track recommendation with an explicitly conditional
      upgrade path. A bull outcome requires management to verify current ARR, gross
      margin, retention, and preference stack while also showing that the higher
      vendor-reported financing path is real and potentially converging toward a
      broader exit window. The base case keeps SmartHR in a wide $1.0B-$1.6B public
      evidence band, because the assigned sources do show product breadth and market
      position, but they do not prove premium economics. The bear case is a secondary
      or next-round markdown toward the lower end of that range if liquidity stays
      constrained, no public IPO process appears, or new capital arrives above the
      highest visible marks without stronger fundamentals. Final diligence should
      focus on current recurring revenue, retention, margin profile, customer
      concentration, and liquidation preferences before any price-led upgrade.
    claimRefs: [CV001, CV004, CV007, CV008, CV009, CV010, CV011, CV012, CV015, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: "Recommendation summary table"
    columns:
      - "View"
      - "Recommendation"
      - "Confidence"
      - "Risk rating"
      - "Valuation stance"
      - "Decision implication"
    rows:
      - ["Current public-evidence view", "track", "medium", "medium", "unknown", "Strong domestic product proof, but public valuation anchors conflict and the current price cannot be underwritten from disclosed economics."]
      - ["Upgrade trigger", "buy", "medium", "medium", "attractive", "Need verified current ARR, margin, retention, and preference terms plus entry at or below a well-supported market mark."]
      - ["Downgrade trigger", "avoid", "medium", "high", "expensive", "Treat a raise above the highest visible private marks without stronger disclosed fundamentals as overvaluation risk."]
    notes: "Decision rows translate the assigned public evidence into entry discipline; they are not company guidance."
    claimRefs: [CV001, CV003, CV008, CV009, CV010, CV011, CV012, CV016]
  - id: TV002
    title: "Thesis / anti-thesis table"
    columns:
      - "Side"
      - "Argument"
      - "What would change the view"
    rows:
      - ["Thesis", "Official product pages still support a broad HR/payroll/talent/IT workflow suite with integration depth and modeled workflow savings.", "A verified slowdown in product breadth, adoption, or share would weaken premium-quality assumptions."]
      - ["Thesis", "Top-competitor lists still place SmartHR against major HCM/payroll platforms, implying category relevance rather than a niche point solution.", "Comparable evidence would strengthen if public-comp revenue and margin bridges became usable from filings."]
      - ["Anti-thesis", "Public market-data vendors disagree on total funding, latest financing, and current value, so current marks are not tightly underwritten.", "Management or primary financing documents that reconcile the record would narrow the range."]
      - ["Anti-thesis", "Private-company opacity still hides current ARR, retention, margin, and preference stack, which blocks a confident premium valuation call.", "A data room or audited KPI package could justify moving from track to buy."]
    notes: "Arguments reflect only the assigned fetched evidence set; undisclosed economics remain a material blocker."
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV008, CV013, CV014, CV015]
  - id: TV003
    title: "Bull / base / bear scenario table"
    columns:
      - "Case"
      - "Assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Management verifies current ARR, margin, and retention; the higher vendor-reported funding path is real; and exit options broaden.", ">$1.6B only after disclosed economics and financing evidence catch up with the strongest visible private-market signals.", "Execution or disclosure fails to confirm premium SaaS quality.", "Needs fresh financing or IPO evidence plus hard KPI disclosure."]
      - ["Base", "Product breadth and claimed category position hold, but only mixed private-market data and company pages remain public.", "$1.0B-$1.6B because the assigned pool supports strategic relevance but not precise premium underwriting.", "Range stays too wide for an immediate buy decision.", "Best fit with today's evidence set."]
      - ["Bear", "Liquidity stays constrained, no IPO path appears, and the next financing clears closer to secondary indications than headline historical rounds.", "<=$1.0B if downside price discovery dominates and fundamentals remain undisclosed.", "A markdown can arrive before public KPI disclosure.", "Consistent with the lower visible Caplight estimate and transfer restrictions."]
      - ["Diligence gate", "Investors obtain current ARR, NRR, gross margin, customer concentration, and liquidation preference data.", "Only then can expected return be tied to a specific entry price instead of a wide evidence band.", "Without this package, apparent upside can be illusory.", "Mandatory before an upgrade from track."]
    notes: "Ranges are bounded by the visible $1.0B and $1.6B marks in the assigned sources and should not be treated as precise fair values."
    claimRefs: [CV004, CV007, CV008, CV009, CV010, CV011, CV012]
figures:
  - id: FV001
    title: "Recommendation logic"
    type: flow
    summary: "The call stays at track because operating proof is visible but valuation proof is not."
    data:
      nodes:
        - id: product
          label: "Product scope"
          note: "Official pages still position SmartHR across HR, payroll, talent, employee self-service, and IT operations."
        - id: proof
          label: "Commercial proof"
          note: "Japanese pages cite 120+ integrations, modeled workflow savings, and a seven-year No.1 share claim."
        - id: financing
          label: "Financing anchors"
          note: "The assigned vendor pages disagree on total capital raised and latest financing timing."
        - id: valuation
          label: "Valuation conflict"
          note: "Visible current marks span $1.0B to $1.6B, which is too wide for a precise entry call."
        - id: public-comp-gap
          label: "Public-comp gap"
          note: "Closest public comps are visible, but the assigned Workday filing fetch did not expose usable operating text."
        - id: call
          label: "Current call"
          note: "Track until management verifies ARR, retention, gross margin, concentration, and preference terms."
      edges:
        - from: product
          to: proof
        - from: proof
          to: financing
        - from: financing
          to: valuation
        - from: valuation
          to: public-comp-gap
        - from: public-comp-gap
          to: call
    approximationNotes: "This sequence expresses underwriting logic, not mathematically derived probabilities."
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV008, CV009, CV013, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: "Recommendation: track, not buy"
    body: >-
      SmartHR still looks strategically relevant, but the assigned public evidence
      does not justify paying through a premium private mark before current
      economics and cap-table terms are verified.
    claimRefs: [CV001, CV008, CV009, CV010, CV011, CV012]
  - calloutType: risk
    title: "Main underwriting gap"
    body: >-
      The biggest unresolved variable is not product quality but missing current
      ARR, margin, retention, and liquidation-preference evidence, which leaves
      upside and downside too sensitive to private information.
    claimRefs: [CV009, CV010, CV015]
