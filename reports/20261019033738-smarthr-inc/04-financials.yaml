schemaVersion: "report-v2"
artifact: financials
slug: smarthr-inc
runDate: 2026-10-19
company:
  name: "SmartHR, Inc."
chapter:
  number: 4
  title: "Financials"
  summary: >-
    SmartHR has credible public evidence of software scale - TechCrunch reported
    $100 million ARR as of February 2024 and $80 million FY2023 revenue - but the
    assigned public record still leaves pricing realization, gross margin,
    CAC/payback, burn, and runway non-public. Fresh capital from the 2024 Series E
    and the later General Atlantic minority transaction supports expansion, but
    current revenue quality and capital adequacy still require private diligence.
sections:
  - id: revenue-model-and-traction
    title: "Revenue model and disclosed traction"
    body: |-
      SmartHR's official surfaces position the business as a back-office software system spanning HR, payroll, talent management, employee self-service, and IT operations, while the Japanese product pages frame employee data as a centralized system-of-record asset that supports multiple workflow modules. That makes the public model look like multi-module B2B software rather than transaction revenue or services-heavy delivery, and third-party market data also classifies the company as subscription SaaS.

      Public scale disclosure is still narrow but meaningful. TechCrunch reported ARR of $100 million as of February 2024 and total FY2023 revenue of $80 million. Those figures establish real commercial traction, but they are stale relative to the 2026 run date and do not disclose current revenue mix by module, customer cohort, or contract structure.
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI012]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: monetization-and-unit-economics
    title: "Monetization transparency and unit-economics blind spots"
    body: |-
      The retained official pages clearly show breadth of product surface - labor management, talent management, employee portal, employee database, and IT-oriented adjacencies - but they do not publish public list prices, contract terms, or realized discounting. Caplight's company page supports the high-level delivery model by classifying SmartHR as B2B subscription SaaS, yet that still falls short of the pricing evidence needed to bridge product breadth into actual ACV, take rate, or expansion math.

      The independent market backdrop is supportive rather than sufficient. Deloitte Tohmatsu MIC says Japan's HRTech cloud market is expanding, and MarketsandMarkets projects continued cloud-industry growth into 2025, but neither source repairs the company-specific blind spots. No retained source in this chapter discloses gross margin, CAC, payback, NRR, burn, or cash runway, so the public record supports demand and software orientation, not a full unit-economics case.
    claimRefs: [CI003, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy-and-underwriting-verdict
    title: "Capital adequacy and underwriting verdict"
    body: |-
      TechCrunch reported a $140 million Series E led by KKR and Teachers' Ventures Growth, with the company saying the proceeds would fund new solutions, hiring, and organic and inorganic growth strategies. A later Business Wire-syndicated item on HRTechEdge reported a $96 million strategic minority investment from General Atlantic, but that article also says the stake was acquired from Coral Capital, which matters because a secondary share purchase is not the same as new cash available on SmartHR's balance sheet.

      The financing picture therefore signals sponsor support but not underwritten runway. Caplight shows an estimated $1 billion valuation, while TechCrunch said the company declined to comment on its current valuation. Together, the assigned pool is strong enough to support a view that SmartHR has institutional access to capital and real ARR scale, but not strong enough to underwrite current liquidity, efficiency, or valuation resilience without private-company materials.
    claimRefs: [CI004, CI007, CI008, CI009, CI010, CI011]
tables:
