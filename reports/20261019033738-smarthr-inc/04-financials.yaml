    title: "Revenue streams table"
    columns:
      - "Stream"
      - "Mechanism"
      - "Unit"
      - "Current value/status"
      - "Quality"
      - "Diligence ask"
    rows:
      - ["Core HR and payroll workflows", "Subscription SaaS access to labor, payroll, benefits, and compliance workflows", "Contracted subscription basis not publicly disclosed", "Official pages confirm category presence; no public revenue split", "Product scope verified; monetization detail partial", "Request module-level ARR/revenue mix, billing metric, and renewal profile."]
      - ["Talent management", "Add-on or adjacent software module sold off the same employee-data base", "Pricing unit not publicly disclosed", "Function pages confirm module exists; attach rate is not public", "Expansion vector visible; revenue contribution unverified", "Request attach rate, ACV uplift, and bundle penetration by segment."]
      - ["Employee portal and employee database", "System-of-record layer that supports employee self-service and data capture", "Pricing unit not publicly disclosed", "Public pages position this as the data foundation for broader workflows", "Retention anchor visible; standalone monetization unclear", "Request logo retention, module adoption by cohort, and implementation scope."]
      - ["IT operations and adjacent convenience features", "Additional software modules that can expand wallet share after workforce data is centralized", "Pricing unit not publicly disclosed", "Offering exists on reviewed pages, but monetization path is not quantified", "Upsell option verified; commercial detail absent", "Request attach rate, packaging, services content, and gross-margin profile by module."]
    notes: "Rows summarize publicly visible product families and disclosed SaaS positioning; no retained source publishes module-level revenue mix, billing units, or realized economics."
    claimRefs: [CI001, CI002, CI003, CI012, CI015]
  - id: TI002
    title: "Pricing / monetization table"
    columns:
      - "Offer / surface"
      - "Price / unit / contract"
      - "List vs realized pricing"
      - "Discounts / unknowns"
      - "Source"
    rows:
      - ["SmartHR corporate site", "Not publicly disclosed", "Reviewed official page describes product scope, not public rate cards", "No public list price, minimum term, or implementation fee on retained page", "SmartHR official site"]
      - ["Labor management functions", "Not publicly disclosed", "Function page explains workflow value but not billing mechanics", "Need seat/entity basis, overage rules, and setup fees", "SmartHR function page"]
      - ["Talent management modules", "Not publicly disclosed", "Module presence is visible; add-on economics are not", "Need bundle uplift, discounting practice, and renewal behavior", "SmartHR function page"]
      - ["Overall delivery model", "B2B subscription SaaS", "Caplight classifies model/customer profile, not actual contract values", "No realized ASP, net retention, or gross-margin disclosure", "Caplight"]
    notes: "Retained public pages identify delivery model and product breadth but do not publish list prices or realized contract economics; 'Not publicly disclosed' marks a real disclosure gap, not zero pricing."
    claimRefs: [CI003, CI012, CI015]
  - id: TI003
    title: "Unit economics table"
    columns:
      - "Metric"
      - "Value / status"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["ARR (as of Feb. 2024)", "$100M", "Medium", "Best public recurring-scale datapoint, but stale by the 2026 run date", "Request current ARR, NRR, churn, and cohort growth."]
      - ["FY2023 revenue", "$80M total revenue", "Medium", "Shows historical scale but not current mix, realization, or margin", "Request FY2024-FY2026 revenue bridge by module and geography."]
      - ["Employee count at Series E", "About 1,000 employees", "Medium", "Useful for rough revenue-per-employee framing, but insufficient for efficiency underwriting", "Request current headcount by function and hiring plan against burn."]
      - ["Current valuation", "Company declined to comment; Caplight shows an estimated $1B valuation", "Low", "Valuation signal may imply reset risk, but estimate is unaudited", "Request latest preferred price, 409A, and recent secondary-clearing data."]
      - ["Gross margin / CAC payback / burn / runway", "Not publicly disclosed in retained sources", "Low", "These are the core metrics needed to underwrite margin path and capital adequacy", "Request management KPI pack, monthly cash waterfall, debt schedule, and lender covenants."]
    notes: "Values preserve original labels and periods from retained sources; 'Not publicly disclosed' means the assigned public pool did not surface enough evidence to underwrite the metric."
    claimRefs: [CI005, CI006, CI008, CI011, CI016]
