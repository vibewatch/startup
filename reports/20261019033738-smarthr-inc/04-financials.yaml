        - from: scale
          to: economics-gap
          label: "Profitability bridge remains undisclosed"
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI012, CI016]
callouts:
  - calloutType: risk
    title: "Public economics stop at scale, not efficiency"
    body: "SmartHR has real public revenue scale, but the retained pool still lacks current gross margin, CAC/payback, NRR, burn, cash, and debt disclosure, so capital adequacy remains a diligence blocker rather than a solved underwriting input."
    claimRefs: [CI005, CI006, CI016]
  - calloutType: insight
    title: "Strategic capital helps, but does not equal proven runway"
    body: "The 2024 Series E proceeds were earmarked for product, hiring, and M&A, and the later General Atlantic transaction signals sponsor interest, but the same assigned evidence does not disclose current cash on hand and the later minority deal appears at least partly secondary rather than clearly fresh primary capital."
    claimRefs: [CI007, CI009, CI010, CI016]
