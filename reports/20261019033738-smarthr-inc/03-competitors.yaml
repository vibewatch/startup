    },
    {
      "id": "switching-costs-and-durability",
      "title": "Switching costs and durability",
      "body": "The best buyer-side proof in the pool is not a benchmark but customer workflow testimony. ITreview users describe moving year-end adjustment, document submission, and employee-data administration out of paper and Excel into centralized online flows, while SmartHR's own Japanese homepage emphasizes that broad employee usage causes data to accumulate naturally across HR, labor, and IT-system work. That combination suggests SmartHR's moat is less about one isolated feature and more about replacing multiple administrative handoffs at once. The risk is that moat durability is segment-specific. Softwares.com explicitly says SmartHR's Japan localization is a strength against global HRIS products on compliance, but also a limit for multinationals that want one global system. In parallel, freee and MoneyForward each own buyer segments where ecosystem fit or lower operating friction can matter more than SmartHR's deeper HR scope.",
      "claimRefs": [
        "CP003",
        "CP010",
        "CP011",
        "CP012",
        "CP014",
        "CP015"
      ]
    }
  ],
