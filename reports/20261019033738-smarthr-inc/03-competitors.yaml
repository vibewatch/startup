      ]
    },
    {
      "id": "capability-and-packaging-tradeoffs",
      "title": "Capability and packaging tradeoffs",
      "body": "SmartHR's official surfaces consistently position the product as broader than a payroll calculator: the English site frames it as a worker-friendly back-office system spanning HR, payroll, talent management, employee self-service, and IT operations, while the Japanese feature catalog expands that into labor management, talent management, employee portals, employee databases, and IT-department workflows. That breadth is the core reason AQ treats SmartHR as the strongest option for HR-first teams, but the same evidence set shows clear tradeoffs. freee HR wins when English usability and native freee Accounting integration matter most; MoneyForward wins when bank transfer automation and MoneyForward Accounting fit matter most. Packaging evidence is directionally useful rather than audit-grade: AQ publishes approximate starting prices for the three domestic platforms, while Softwares.com describes SmartHR as custom-priced with a free tier, so list-price transparency is itself a competitive variable rather than a settled fact in the assigned pool.",
      "claimRefs": [
        "CP001",
        "CP002",
        "CP005",
        "CP006",
        "CP007",
        "CP008",
        "CP009",
        "CP010",
        "CP011"
      ],
      "tableRefs": [
        "TP002",
