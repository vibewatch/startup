  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "The assigned pool supports a focused domestic competition picture: SmartHR competes most directly with freee HR and MoneyForward Cloud Payroll, while manual or outsourced operations and global HR suites remain substitutes for the same workflow. SmartHR's advantage is Japan-specific HR depth and integrated workflow breadth; its weakest spots are English-first buyers, accounting-ecosystem lock-in elsewhere, and multinational teams that want one global HRIS."
  },
  "sections": [
    {
      "id": "landscape-and-segment-fit",
      "title": "Landscape and segment fit",
      "body": "The strongest direct alternatives in the assigned pool are the domestic trio AQ Partners compares explicitly: SmartHR, freee HR, and MoneyForward Cloud Payroll. Within that set, SmartHR is presented as the HR-first integrated option, freee as the lowest-friction choice for English-speaking teams and freee Accounting users, and MoneyForward as the deepest banking and payroll-operations stack for teams already committed to the MoneyForward ecosystem. Caplight adds adjacent names such as jinjer and HRBrain, but the pool does not provide enough current public detail to underwrite their product depth or packaging at the same fidelity. Outside software, the same job can still be solved by paper or Excel workflows, by outsourced payroll operators, or by global HR suites such as Workday or SAP when the buyer prioritizes global standardization over Japan-local workflow depth.",
      "claimRefs": [
        "CP004",
        "CP005",
        "CP006",
        "CP012",
        "CP013",
        "CP016"
      ],
      "tableRefs": [
