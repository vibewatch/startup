      - ["External builder surface", "REST API, OAuth authorization, sandbox, and a SmartHR-specific OmniAuth package provide integration hooks", "Developer documentation, scope design, and token lifecycle handling", "No official MCP layer, and third-party commentary flags auth and token-management pitfalls"]
    notes: "Architecture rows combine official product surfaces with a Google Cloud migration case study and third-party developer evidence; several controls remain only partially evidenced."
