evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: >-
      A current board roster, director biographies, governance committee structure, and explicit succession coverage for
      the disclosed executive bench.
    whyItMatters: Leadership titles alone do not establish control quality, institutionalization, or key-person risk.
    diligencePath: Request the latest board materials, org chart, and executive biographies during management diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: valuation-and-stage
    missingEvidence: >-
      Primary financing documents or company/investor confirmation for latest round type, valuation, total primary
      capital raised, and any secondary liquidity.
    whyItMatters: Current valuation stance and dilution analysis cannot rely on preview-level secondary-market data alone.
    diligencePath: >-
      Obtain the most recent financing deck, term sheet summary, and a management explanation of the 2026 IPO-labelled
      Caplight entry.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, NRR, gross margin, burn, cash runway, and official headcount.
    whyItMatters: These are core cover metrics for underwriting scale quality, operating leverage, and financing need.
    diligencePath: >-
      Request current board or investor updates with KPI definitions and bridge them to any disclosed customer and
      product metrics.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: >-
      Segment-level customer counts, ACV, and module attach rates needed to convert public category lenses into a
      defendable SmartHR SAM or SOM.
    whyItMatters: >-
      Without a spend-based segmentation model, broad TAM claims can overstate valuation headroom and hide monetization
      concentration in the core compliance wedge.
    diligencePath: >-
      Request internal cohort revenue by customer size, module family, and contract band, then rebuild the market stack
      from actual monetized segments.
    relatedQuestionRefs:
      - QM002
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owner
    missingEvidence: >-
      Current public evidence does not disclose who signs the contract by segment or how much IT-adjacent workflow
      expansion contributes to deal size.
    whyItMatters: >-
      Budget ownership determines sales-cycle length, cross-sell probability, and whether SmartHR can move beyond HR-led
      compliance budgets into broader platform spend.
    diligencePath: Review recent sales decks, pricing sheets, and win-loss interviews segmented by employee count and module bundle.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-scope-comparability
    missingEvidence: >-
      A normalized taxonomy that reconciles broad HR-tech market forecasts with narrower labor-management cloud share
      estimates.
    whyItMatters: >-
      The broad ¥820 billion forecast and the narrower share figures answer different questions, so using them
      interchangeably would distort adoption and valuation conclusions.
    diligencePath: >-
      Map each external estimate to a common category tree and note what workflow families are included or excluded
      before comparing penetration claims.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adjacent-competitors
    missingEvidence: >-
      Current public product-scope, pricing, and customer-segment evidence for HRBrain and jinjer comparable to the
      detail available for SmartHR, freee HR, and MoneyForward.
    whyItMatters: >-
      Without like-for-like product and pricing proof, the adjacent-competitor map is real but shallower than the
      direct-comparison map, which limits conviction on likely entrant or displacement risk.
    diligencePath: >-
      Collect current official product pages, pricing pages, and customer proof for HRBrain and jinjer, then rebuild the
      competitor-profile table with direct evidence instead of similarity-only signals.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Direct official SmartHR, freee, and MoneyForward pricing pages or procurement artifacts that reconcile AQ's
      approximate entry pricing with Softwares.com's SmartHR packaging description.
    whyItMatters: >-
      Packaging and price transparency are part of the competitive decision, and current evidence shows directionally
      useful but not fully reconciled pricing signals.
    diligencePath: >-
      Capture direct vendor pricing pages or commercial proposals for the three domestic platforms and separate list
      pricing, module gating, and free-tier or trial mechanics in the pricing table.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Current price book, packaging logic, standard contract term, and realized discounting by segment.
    whyItMatters: >-
      Without list-versus-realized pricing evidence, the chapter cannot bridge product breadth into ACV, payback, or
      revenue-quality underwriting.
    diligencePath: >-
      Request current rate cards, standard MSA and order-form templates, and a sample of closed-won contracts across SMB
      and enterprise segments.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-gap
    missingEvidence: Gross margin, CAC, CAC payback, NRR, monthly burn, cash balance, runway, and debt or covenant schedule.
    whyItMatters: >-
      These are the core metrics needed to underwrite margin path, capital intensity, and whether recent funding is
      enough to reach the next financing trigger.
    diligencePath: >-
      Request the last 24 months of management KPI packs, board materials, monthly cash waterfall, budget-versus-actual
      view, and lender documents.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: valuation-signal
    missingEvidence: >-
      Current primary valuation, recent secondary-clearing prices, and any board-approved 409A or internal valuation
      memo.
    whyItMatters: >-
      Caplight's $1 billion estimate creates possible markdown risk relative to earlier disclosed financing benchmarks,
      but the public evidence does not prove the current clearing price.
    diligencePath: >-
      Request the latest preferred share price, 409A package, and recent secondary transaction log with volumes and
      counterparties.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-streams
    missingEvidence: Module-level ARR or revenue mix, services versus software share, and customer concentration.
    whyItMatters: >-
      Public ARR and revenue totals do not reveal how much of SmartHR's scale is recurring, diversified, and likely to
      expand with attractive marginal economics.
    diligencePath: >-
      Request a revenue bridge by module, customer-size cohort, and services share, plus top-customer concentration and
      renewal data.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Primary public evidence on SmartHR's current security certifications, uptime commitments, privacy architecture,
      and incident history.
    whyItMatters: >-
      The chapter can describe product breadth and migration choices, but investors still cannot underwrite trust,
      resilience, or control maturity from the assigned pool alone.
    diligencePath: >-
      Review SmartHR's current trust center, security documentation, status history, certification scope, and privacy
      materials directly, then reconcile them against buyer requirements.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: >-
      Module-level attach rates, implementation duration, realized ROI by product line, and current customer penetration
      for IT-operations features.
    whyItMatters: >-
      SmartHR's strategic value depends on cross-sell depth and deployment success across modules, but public evidence
      mainly shows marketed capability breadth rather than realized usage depth.
    diligencePath: >-
      Request SKU-level customer counts, attach-rate cohorts, implementation benchmarks, and reference calls for
      payroll, talent, portal, and IT-operations modules.
    relatedQuestionRefs:
      - QE004
      - QE005
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-disclosure
    missingEvidence: Current NRR, GRR, logo churn, renewal rate, and contract-length disclosure for SmartHR customers.
    whyItMatters: Durability is central to underwriting expansion efficiency and valuation quality in HR SaaS.
    diligencePath: Request current cohort, renewal, and churn metrics plus customer-contract terms from management.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named customer case studies or public references that tie SmartHR to live production deployments and measured
      outcomes.
    whyItMatters: Review counts and investor quotes show usage breadth but are weaker than attributable deployment proof.
    diligencePath: Ask for three referenceable customers by segment with module scope, go-live date, ROI, and renewal status.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer, partner-channel, and segment concentration data for SmartHR's revenue base.
    whyItMatters: A broad workflow footprint can still mask dependence on a small number of large accounts or channels.
    diligencePath: Request revenue concentration by top accounts, channel mix, and segment mix over the last twelve months.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: legal-regulatory-verification
    missingEvidence: >-
      Current regulator, court, incident-database, and independent security-assurance evidence for SmartHR's legal,
      privacy, and outage posture.
    whyItMatters: >-
      The assigned pool shows that SmartHR sits inside payroll-grade and employee-data workflows, so a clean public
      record cannot be treated as proof that there are no enforcement, breach, or outage issues.
    diligencePath: >-
      Check Japanese regulator and court records, status / trust documentation, certifications, and incident archives
      directly; request the company's current security and compliance packet.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-underwriting-opacity
    missingEvidence: >-
      Current ARR, churn, gross margin, cash runway, and explicit primary-versus-secondary capital detail tied to the
      2025 General Atlantic transaction.
    whyItMatters: >-
      Without those figures, investors cannot tell whether SmartHR's expansion plan is comfortably financed or whether
      valuation and liquidity expectations are running ahead of fundamental disclosure.
    diligencePath: >-
      Request the latest board / investor materials, cap-table movement, secondary-primary split, and current SaaS
      operating metrics as part of financing diligence.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: access-blocked
    severity: minor
    topic: third-party-market-data-quality
    missingEvidence: Reliable, directly readable third-party private-market pricing and transaction history.
    whyItMatters: >-
      One candidate valuation URL is unusable and another exposes only a preview, which weakens independent
      triangulation of SmartHR's current private-market position.
    diligencePath: >-
      Replace weak web-market-data candidates with authenticated cap-table / secondary-market diligence or stronger
      independent reporting before leaning on public pricing signals.
    relatedQuestionRefs:
      - QR007
  - type: conflicting-data
    severity: material
    topic: valuation-range
    missingEvidence: Primary financing or board-approved valuation materials that reconcile the visible $1.0B and $1.6B marks.
    whyItMatters: >-
      Recommendation quality is price-sensitive, and today's public range is too wide to underwrite a precise entry
      price.
    diligencePath: >-
      Request the latest financing memo, cap-table snapshot, and management explanation for which external market-data
      record is current.
    relatedQuestionRefs:
      - QV001
  - type: private-evidence-only
    severity: material
    topic: economics-underwrite
    missingEvidence: Current ARR, NRR, gross margin, burn, and customer concentration data.
    whyItMatters: >-
      Without current software economics, upside cases can only be framed as scenario bands rather than underwritten
      returns.
    diligencePath: Obtain current KPI pack or audited management reporting covering recurring revenue, retention, and margin trends.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: >-
      Liquidation preferences, seniority, secondary-transfer mechanics, and any other preference overhang in the current
      cap table.
    whyItMatters: >-
      Entry discipline can look attractive on headline valuation while still producing weak realized outcomes after
      preference stacking.
    diligencePath: >-
      Review the latest cap table, financing documents, and side-letter restrictions before upgrading the
      recommendation.
    relatedQuestionRefs:
      - QV008
  - type: access-blocked
    severity: minor
    topic: public-comp-gap
    missingEvidence: >-
      A usable public-comp filing extract that exposes revenue, margin, or valuation-bridge text from an assigned
      comparable.
    whyItMatters: Public comp math would narrow scenario ranges and reduce dependence on opaque private-market vendor marks.
    diligencePath: >-
      Replace the ixviewer-only filing with a directly readable annual report or investor presentation from an assigned
      comparable source.
    relatedQuestionRefs:
      - QV004
