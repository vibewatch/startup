  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "SmartHR's market boundary is clearest in Japan's compliance-heavy labor-management software, where official product pages, a 2026 independent review, and an HBS case all point to paper-heavy HR workflows as the initial wedge. Public evidence supports several market lenses — a ¥820 billion 2032 HR-tech projection, 1.87 million Japanese business entities, more than 80,000 registered companies, and 45.8%/71.7% share proxies — but it does not isolate a clean SmartHR-specific SAM or SOM, so valuation still depends on proving monetization beyond the core domestic compliance use case."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and substitutes",
      "body": "The most defensible market boundary starts with Japanese HR and labor workflows that are still document-heavy, compliance-heavy, and local by design. SmartHR's own English and Japanese product surfaces position the product as a worker-facing back-office system spanning HR, payroll, talent management, employee communications, and selected IT operations, while the HBS case frames the original wedge as digitizing onboarding and social-insurance paperwork for a country that historically relied on paper processes. That supports including domestic labor-management cloud, adjacent talent and employee-data workflows, and employee-linked SaaS account operations. It also supports excluding global payroll, employer-of-record services, and broader collaboration software that is not anchored to the employee master record. The status quo substitute is still manual paperwork and fragmented point tools rather than a single modern suite, which is why localization matters more than generic HR-software breadth in this chapter.",
      "claimRefs": [
        "CM001",
        "CM002",
        "CM003",
        "CM004",
        "CM005"
      ],
      "tableRefs": [
        "TM001"
      ]
    },
    {
      "id": "sizing-lenses",
      "title": "Sizing lenses and what they do not prove",
      "body": "Public sources offer multiple useful sizing lenses, but they are not interchangeable and should not be collapsed into a synthetic TAM/SAM/SOM stack. The broadest lens is Kantenna's statement that Japan's HR-tech market could reach ¥820 billion by 2032, which is helpful for framing category headroom but broader than SmartHR's current compliance-led wedge. A narrower operational lens comes from the HBS case, which cites 1.87 million Japanese business entities that still relied heavily on manual HR paperwork and reports SmartHR share levels of 45.8% overall and 71.7% in the enterprise segment within labor-management cloud. Third-party 2026 sources also point to more than 80,000 registered companies on the platform, which is meaningful installed-base evidence but not revenue-weighted penetration. Together these lenses show a large domestic digitization opportunity, yet none discloses segment-level customer counts, module mix, or average contract value strongly enough to derive a clean public SAM or SOM for underwriting.",
      "claimRefs": [
        "CM006",
        "CM007",
        "CM008",
        "CM009",
        "CM011",
        "CM013"
      ],
      "tableRefs": [
        "TM002"
      ],
      "figureRefs": [
        "FM001"
      ]
    },
    {
      "id": "buyers-drivers-constraints",
      "title": "Buyer map, adoption drivers, and constraints",
      "body": "The buyer journey appears to ladder from small firms seeking fast digitization of records and payslips into larger employers that want a common employee-data layer for payroll-adjacent workflows, talent management, and internal communications. HR.software's review points to a free tier for organizations with up to 30 employees, suggesting a low-friction entry path at the micro end, while official pages expand the use case into portals, analytics, integrations, and AI-assisted account workflows that matter more to larger organizations. Budget ownership therefore likely starts with owners or back-office administrators in micro firms, shifts to HR and payroll leaders in SMBs, and broadens to CHRO or transformation budgets in larger deployments, with IT operations joining when account lifecycle automation becomes valuable. The constraints are equally clear: SmartHR's fit is tightly tied to Japan, its public evidence does not establish a clean spend-based SAM, and Kantenna's report of a delayed IPO after valuation pushback shows that even category leadership does not eliminate investor skepticism about how far the market can expand beyond the core domestic compliance wedge.",
      "claimRefs": [
        "CM003",
        "CM004",
        "CM010",
        "CM012",
        "CM013",
        "CM014"
      ],
      "tableRefs": [
        "TM003"
