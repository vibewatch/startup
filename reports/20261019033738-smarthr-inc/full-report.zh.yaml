      - number: '4.2'
        title: 变现透明度与单位经济盲区
        blocks:
          - type: paragraph
            body: >-
              保留的官方页面清楚展示了产品范围——劳务管理、人才管理、员工门户、员工数据库和 IT 周边——但没有公开标价、合同条款或实际折扣。 Caplight 将 SmartHR 归类为 B2B 订阅
              SaaS，支持高层交付模式判断，却仍不足以把产品广度连接到实际 ACV、抽成率或扩张数学。

              独立市场背景是支持性而非充分性证据。Deloitte Tohmatsu MIC 表示日本 HRTech 云市场正在扩大，MarketsandMarkets 预计云产业持续增长至 2025 年，
              但两者都无法修复公司层面的盲区。本章没有任何保留来源披露毛利率、CAC、回本期、NRR、烧钱速度或现金跑道，因此公开记录支持需求和软件属性， 却不足以构成完整的单位经济案例。
