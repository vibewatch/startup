      - number: '8.3'
        title: 情景、退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              实际结果是一个带明确条件升级路径的跟踪建议。乐观情景要求管理层核实当前 ARR、毛利率、留存和优先股堆叠，同时证明供应商报告的更高融资路径真实存在， 并可能向更宽的退出窗口靠拢。基准情景把 SmartHR 放在
              $1.0B-$1.6B 的宽泛公开证据区间内：指定来源确实显示产品广度和市场地位，但没有证明溢价经济性。 悲观情景是，如果流动性持续受限、没有公开 IPO
              流程，或新资本在更强基本面不足时高于最高可见估值，则向区间下沿进行二级或下一轮下调。 在任何由价格驱动的升级前，最终尽调应聚焦当前经常性收入、留存、利润率画像、客户集中度和清算优先权。
