  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 由于经营层面的证据可见、估值证据却不足，当前结论仍是跟踪。
    data:
      nodes:
        - id: product
          label: 产品范围
          note: 官方页面仍将 SmartHR 定位为覆盖 HR、薪资、人才、员工自助和 IT 运营的平台。
        - id: proof
          label: 商业证明
          note: 日本页面列出 120+ 个集成、模型显示的流程节省，以及连续七年排名第一的份额主张。
        - id: financing
          label: 融资锚点
          note: 分配的供应商页面对累计融资额和最近融资时间的说法不一致。
        - id: valuation
          label: 估值冲突
          note: 可见的当前估值在 $1.0B 至 $1.6B 之间，区间过宽，无法给出精确入场判断。
        - id: public-comp-gap
          label: 公开可比公司缺口
          note: 最接近的公开可比公司可见，但分配的 Workday 申报文件抓取未提供可用的经营文本。
        - id: call
          label: 当前结论
          note: 在管理层核实 ARR、留存、毛利率、集中度和优先权条款前，继续跟踪。
      edges:
        - from: product
          to: proof
        - from: proof
          to: financing
        - from: financing
          to: valuation
        - from: valuation
          to: public-comp-gap
        - from: public-comp-gap
          to: call
    approximationNotes: 这套顺序表达的是投资判断逻辑，而非数学推导出的概率。
    claimRefs:
