              11 月后来的 $96.0M 成长股权轮。差异太大，未经管理层确认，不能把任何一条记录当作精确估值锚点。 指定资料池中最可见的可比仍是公开 HCM 和薪资软件：Tracxn 将 Workday 和 Paychex
              列入 SmartHR 的主要竞争者，ADP 投资者页面则展示了大型公开市场既有巨头的规模。 但指定的 Workday SEC ixviewer
              抓取没有提供可用运营文本，因此本章仍缺少由申报支持的公开公司收入或倍数桥接，无法仅凭公开证据收紧 SmartHR 估值区间。
