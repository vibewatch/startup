      - number: '3.3'
        title: 切换成本与持久性
        blocks:
          - type: paragraph
            body: >-
              资料池中最好的买方证据不是基准测试，而是客户流程反馈。ITreview 用户描述如何把年末调整、文件提交和员工数据管理从纸面及 Excel 移到集中式在线流程； SmartHR 日文主页则强调，广泛的员工使用会让
              HR、劳务和 IT 系统数据自然积累。两者结合说明，SmartHR 的护城河不在某一孤立功能， 而在于一次替代多个行政交接。风险是护城河的持久性因细分市场而异。Softwares.com 明确指出，SmartHR
              的日本本地化在合规上构成相对全球 HRIS 的优势， 却限制了希望使用一套全球系统的跨国企业。同时，freee 和 MoneyForward 各自在某些客户群中拥有生态适配或更低运营摩擦的优势，可能比
              SmartHR 更深的 HR 范围重要。
            claimRefs:
              - CP003
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: SmartHR 的护城河是日本特定合规场景中的流程广度
            body: 在指定资料池中，SmartHR 最强的优势不是某个孤立功能，而是把 HR 管理、薪资、人才、员工自助和日本特定合规流程放在同一运营界面。
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP011
              - CP015
          - type: callout
            title: 买方仍可转向易用性、生态或全球标准化替代方案
            body: 当英文体验、既有会计栈或跨国标准化比 SmartHR 更深的国内 HR 范围重要时，freee HR、MoneyForward、外包服务商和全球套件都提供了绕开 SmartHR 的可信理由。
            calloutType: risk
