      - number: '1.2'
        title: 管理层梯队、创始人叙事与治理透明度
        blocks:
          - type: paragraph
            body: >-
              官方材料中的创始人与市场匹配叙事格外清晰。SmartHR 称 Shoji Miyata 在看到孕产和育儿相关纸面手续给员工及雇主带来不必要负担后创办公司，
              这直接把产品起点与日本纸面化严重的劳务和社会保险流程连接起来。除这一创始故事外，公开管理层信息较少。英文业务页面列 Masato Serizawa 为 CEO，Caplight 预览页列 Yuji Mori 为
              CFO、Takafumi Kurahashi 为 COO、Takashi Adachi 为首席产品官；这些信息足以确认基本的高管梯队，
              却不足以评估治理质量、董事会构成、继任深度或决策权。就实际尽调而言，SmartHR 由创始人和管理层主导，但指定来源没有提供足够治理细节， 让投资人区分品牌叙事与制度化运营控制。
