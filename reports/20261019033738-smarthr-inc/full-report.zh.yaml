  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险视图
        blocks:
          - type: paragraph
            body: >-
              风险图景的核心不是某个单一急性故障的证据，而是 SmartHR 现在覆盖的运营和合规面有多广。官方及合作伙伴材料把产品置于员工系统记录流程、薪资、人才管理、 政府申报、员工自助和 IT
              账户运营之中；日文产品页面还增加了 120+ 个集成，以及 2026 年面向非 API 服务账户创建和删除的浏览器自动化扩展。
              覆盖面越广，任何控制、可用性或配置故障的影响半径越大，因为同一平台在一个运营闭环里同时触及受监管的劳务流程、敏感员工数据和下游 SaaS 访问。

              第二类风险是执行依赖。General Atlantic 2025 年交易把新少数股东与产品扩展、合作、M&A、客户互动和 GTM 提升计划绑定在一起；市场研究则描述了一个拥有 49 家厂商、
              快速增长且企业交叉销售和追加销售压力持续的日本 HRTech 云品类。SmartHR 可能处于有利位置，但维持领先取决于推出新模块、守住企业份额并协调不断扩大的集成生态， 而不只是享受第一波数字化红利。

              第三类风险是融资和尽调不透明。公开信号显示战略投资和二级交易，但资料池仍无法确定当前 ARR、流失、现金消耗，以及一级现金与二级交易的区别。 一个找到的估值 URL
              会跳转到无关的消费内容，另一个市场数据页面只提供预览和需注册才能查看的定价历史。因此，法律、安全和融资下行风险可监测， 但仅凭公开证据无法完整评估。
