chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、范围与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              指定的官方材料始终把 SmartHR 定义为不止是狭窄的薪资或电子政务申报工具。英文主页和服务页面将其描述为面向员工的后台系统， 覆盖 HR 与劳务管理、薪资、考勤、人才管理、员工自助和 IT
              运营；日文产品页面还显示员工数据库、员工门户和 SaaS 账户管理流程。               因此，后续章节应把 SmartHR
              视为日本后台软件中的平台型业务，而不是单一功能的合规工具。公开规模信号方向上较强， 但应按公司口径处理：SmartHR 称服务于 2015 年上线，截至 2026 年 4 月已注册超过 80,000 家企业，截至
              2026 年 2 月移动应用安装量超过 2 million。日文主页还宣传连续七年劳务管理云领导地位，以及在 1,000 名员工部署中总工时减少 88% 的模型测算；这些绩效和份额说法
              这些由公司提出的绩效和份额说法未获指定资料池独立佐证。总部、阶段、估值和员工人数的证据弱于产品范围，因为最强的公开数字来自第三方预览页，而非一手融资文件或公司申报。
