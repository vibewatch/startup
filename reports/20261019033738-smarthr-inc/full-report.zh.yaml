    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 管理层核实当前 ARR、利润率和留存；供应商报告的较高融资路径确实存在；退出选择增多。
        - 只有在披露的经营数据和融资证据追上目前最强的私人市场信号后，>$1.6B 才成立。
        - 执行或披露未能证实其具备高质量 SaaS 特征。
        - 需要新的融资或 IPO 证据，以及硬 KPI 披露。
      - - 基准
        - 产品广度和声称的品类地位保持不变，但公开渠道只剩混杂的私人市场数据和公司页面。
        - $1.0B-$1.6B，因为分配的证据池支持其战略相关性，却不足以做出精确的溢价投资判断。
        - 区间仍然过宽，无法立即买入。
        - 最符合今天的证据集。
      - - 悲观
        - 流动性持续受限，看不到 IPO 路径，下一轮融资的成交价格更接近二级市场指示，而不是历史高点轮次。
        - 如果下行价格发现占主导、基本面仍未披露，则 <=$1.0B。
        - 在公开 KPI 披露前，估值可能先被下调。
        - 这与较低的 Caplight 可见估算和转让限制一致。
      - - 尽调门槛
        - 投资者获得当前 ARR、NRR、毛利率、客户集中度和清算优先权数据。
        - 只有这样，预期回报才能绑定到具体入场价，而不是宽泛的证据区间。
        - 没有这套资料，看似存在的上行空间可能只是幻觉。
        - 从跟踪升级前必须满足。
    notes: 区间由分配来源中可见的 $1.0B 和 $1.6B 估值锚定，不应被视为精确的公允价值。
