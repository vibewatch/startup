              TechCrunch 报道由 KKR 和 Teachers' Ventures Growth 领投的 $140 million Series E，公司称资金将用于新方案、招聘以及有机和无机增长战略。 后来
              Business Wire 联播、由 HRTechEdge 刊载的文章称 General Atlantic 投资 $96 million 战略性少数股权，但同时称该股份从 Coral Capital 手中收购；
              这一点很关键，因为二级股份购买不等同于 SmartHR 资产负债表上新增可用现金。

              因此融资图景说明有资方支持，却不足以确认可投资的现金跑道。Caplight 显示估算估值约 $1 billion，而 TechCrunch 称公司拒绝评论当前估值。 合起来，资料池足以支持 SmartHR
              拥有机构融资渠道和真实 ARR 规模，但不足以在没有私有公司材料的情况下评估当前流动性、效率或估值韧性。
