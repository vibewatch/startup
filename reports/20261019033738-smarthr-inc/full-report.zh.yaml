      - number: '3.2'
        title: 能力与产品包装的取舍
        blocks:
          - type: paragraph
            body: >-
              SmartHR 官方页面始终把产品定位为不止是薪资计算器：英文网站称其为面向员工、覆盖 HR、薪资、人才管理、员工自助和 IT 运营的后台系统， 日文功能目录又扩展到劳务管理、人才管理、员工门户、员工数据库和
              IT 部门流程。正因如此，AQ 把 SmartHR 视为 HR 优先团队的最强选择； 但同一证据也显示明显取舍：英文易用性和原生 freee Accounting 集成最重要时，freee
              更胜一筹；银行转账自动化和 MoneyForward Accounting 适配最重要时， MoneyForward 更胜一筹。包装证据只有方向性而非审计级：AQ
              发布三家本土平台的大致起价，Softwares.com 则称 SmartHR 采用定制价格并提供免费层， 因而标价透明度本身就是竞争变量，而非资料池已确认的事实。
