        title: 融资透明度与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              指定资料池显示公司有重要的公开里程碑，但融资透明度仍不完整。官方材料支持 2015 年上线、2025 年十周年，以及 2026 年持续推进产品和合作， 包括 AI 辅助浏览器自动化和 HRD
              人才管理合作。Caplight 补充了从 2018 年 Series B 到 2024 年 Series E、2025 年末二次交易、 2026-03-17 标注为 IPO 的融资，以及 $1.0B 估值和
              $357.79M 累计融资。这些估算数字适合用作发现线索，但由于公开页面不提供详细定价图、 申报记录和底层交易支持，投资判断的置信度仍低。资料池中唯一明显负面的观点来自 2026 年 Substack
              分析：SmartHR 最初的护城河是自动化 日本办公室的手工数据录入，而生成式 AI 可能使这一入口商品化，除非 SmartHR 把积累的 HR 数据转化为更高价值的决策支持。
