  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              最稳妥的市场边界应从日本仍高度依赖文件、合规要求且本地化明显的 HR 与劳务流程开始。SmartHR 的中英文产品页面把产品定位为面向员工的后台系统， 覆盖 HR、薪资、人才管理、员工沟通和部分 IT
              运营；HBS 案例则把最初切入口定义为：为长期依赖纸面流程的日本企业，把入职和社会保险手续数字化。 因此可纳入日本本土劳务管理云、相邻的人才和员工数据流程，以及与员工身份绑定的 SaaS
              账户运营；应排除全球薪资、雇主代理服务， 以及不以员工主数据为核心的广义协作软件。现状替代方案仍是手工文书和割裂的单点工具，而非一套现代化套件，所以本章中本地化比泛化的 HR 软件广度更重要。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM014
      - number: '2.2'
        title: 规模化视角及其不能证明的内容
        blocks:
          - type: paragraph
            body: >-
              公开来源提供了多个有用的规模化视角，但它们不可互换，也不应拼成一个虚构的 TAM/SAM/SOM 体系。最宽的口径来自 Kantenna： 日本 HR-tech 市场到 2032 年可能达到 ¥820
              billion，可用于描绘品类空间，但比 SmartHR 当前以合规为核心的切入口更宽。更窄的运营口径来自 HBS 案例： 日本仍高度依赖手工 HR 文书的企业实体有 1.87 million 家，劳务管理云中的
              SmartHR 份额为整体 45.8%、企业客户 71.7%。第三方 2026 年来源还显示平台上 注册企业超过 80,000
              家，这说明安装基础有意义，但不是按收入加权的渗透率。合并来看，这些视角证明国内数字化机会很大，却没有披露细分客户数、 模块组合或平均合同金额，无法可靠推导公开 SAM 或 SOM。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
              - CM013
