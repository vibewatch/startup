        - label: freee HR
          x: 3
          'y': 1
          detail: HR 深度不及 SmartHR，但英语支持最强，也最适配 freee 生态。
          claimRefs:
            - CP005
            - CP008
        - label: MoneyForward Cloud Payroll
          x: 4
          'y': 4
          detail: 对银行业务占比较高的薪资运营自动化能力强，但部署和语言负担更高。
          claimRefs:
            - CP006
            - CP009
        - label: 全球套件
          x: 4
          'y': 5
          detail: 企业覆盖面可能很广，但分配的证据池表明，通用全球 HRIS 难以应对日本特有的合规要求。
          claimRefs:
            - CP011
            - CP012
        - label: 手工 / Excel
          x: 1
          'y': 5
          detail: 自动化程度最低、内部投入最高；客户评价描述了使用 SmartHR 前的纸质和电子表格流程。
          claimRefs:
            - CP014
            - CP015
        - label: 外包薪资运营商
          x: 2
          'y': 4
          detail: 这种替代方案减少软件自助操作，但仍依赖外部专家和流程指导。
          claimRefs:
            - CP016
    approximationNotes: 坐标轴是根据分配的证据池推导的 1-5 序数评分，不是实测的市场份额或转化指标。
    claimRefs:
      - CP005
      - CP006
      - CP011
      - CP012
      - CP015
      - CP016
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据支持一条从员工数据采集到经常性软件收入的多模块 SaaS 路径，但无法进一步支持已披露的毛利转化。
    data:
      nodes:
        - id: adopt
          label: 雇主采用 SmartHR 流程
          detail: 官方页面将 SmartHR 定位为覆盖 HR、薪资、人才管理、员工自助和 IT 运营的平台。
        - id: data
          label: 员工数据成为系统记录资产
          detail: 日本功能页面称，持续使用会集中管理准确的员工信息。
        - id: modules
          label: 可增加劳务和人才模块
          detail: 已审阅的产品页面列出劳务管理、人才管理、员工门户、员工数据库、IT 解决方案和便利功能。
        - id: revenue
          label: 收入来自 B2B 订阅 SaaS
          detail: TechCrunch 将 SmartHR 描述为 SaaS 平台，Caplight 将其归类为 B2B 订阅 SaaS。
        - id: scale
          label: 公开牵引力达到 ARR 和收入里程碑
          detail: TechCrunch 报道，截至 2024 年 2 月，ARR 为 $100M，FY2023 收入为 $80M。
        - id: economics-gap
          label: 毛利转化仍无法依据公开资料做投资判断
          note: 留存来源没有披露毛利率、CAC / 回本周期、烧钱速度或资金续航。
          tone: warning
      edges:
        - from: adopt
          to: data
          label: 流程使用产生数据基础
        - from: data
          to: modules
          label: 系统记录支持交叉销售
        - from: modules
          to: revenue
          label: 多模块使用通过软件合同变现
        - from: revenue
          to: scale
          label: 公开收入和 ARR 数据证明牵引力
        - from: scale
          to: economics-gap
          label: 盈利能力桥接仍未披露
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI012
      - CI016
  - id: FE001
    title: 公开产品架构图
    type: stack
    summary: 公开证据显示，SmartHR 采用分层架构：从员工触点起步，贯穿 HR、人才和 IT 应用，底层依托共享数据与托管的 Google Cloud 基础设施。
    data:
      layers:
        - label: 员工触点
          detail: 面向员工的访问界面包括门户、移动访问、工资单、表单和通信。
          modules:
            - 员工门户
            - 移动访问
            - 文档发送
            - 审批 / 表单
          outputs:
            - 向全体员工分发信息
            - 让一线和办公室员工及时访问
        - label: HR 合规流程
          detail: 核心劳务管理流程覆盖入职、合同、薪资相关运营和年末调整。
          modules:
            - 入职 / 雇佣合同
            - 薪资计算
            - 工资单
            - 年末调整
          outputs:
            - 无纸化 HR 管理
        - label: 人才与组织流程
          detail: 人才工具在评估、规划和发展流程中复用同一套员工数据。
          modules:
            - 招聘 / 候选人流程
            - 评估
            - 人力分配
            - 技能 / 资质 / 培训
            - 调查 / 分析
          outputs:
            - 战略性人员管理流程
        - label: IT 运营自动化
          detail: 面向 IT 的功能将 SmartHR 延伸到账户全生命周期管理和 AI 辅助员工支持。
          modules:
            - SaaS 账户创建 / 删除
            - 面向非 API 服务的浏览器自动化
            - 24/7 AI 咨询响应
          outputs:
            - 员工数据驱动的 IT 运营
        - label: 共享员工数据与集成
          detail: 统一的员工数据层支持记录、组织视图、变更历史和生态连接。
          modules:
            - 员工数据库
            - 组织架构图生成
            - 变更历史
            - 未来生效的变更
            - 120+ 个外部集成
          outputs:
            - 各模块可复用的主数据
        - label: 托管平台与控制措施
          detail: Google 将其描述为托管的 Google Cloud 运行环境，配备标准化技术栈、Terraform 和与 Google Workspace 关联的权限。
          modules:
            - Cloud Run 前端
            - App Engine flexible 后端
            - Terraform
            - Google Workspace 权限
          outputs:
            - 标准化产品技术栈
            - 据报告具备 500 rps 余量
    claimRefs:
      - CE002
      - CE003
      - CE006
      - CE007
      - CE008
      - CE009
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据表明，SmartHR 先从合规要求高的 HR 流程切入，再向相邻的员工和 IT 用例扩展。
    data:
      nodes:
        - label: 合规压力高的 HR 痛点是切入口
          actor: HR / labor administrators
          stage: Entry
          touchpoints:
            - Onboarding, contracts, payslips, and year-end adjustment are explicit landing workflows.
            - Official positioning emphasizes worker-friendly back-office automation.
          tone: positive
        - label: 采购依赖咨询，而非完全自助
          actor: Employer buyer
          stage: Evaluation
          touchpoints:
            - ITreview lists pricing as quote-based.
            - Public sources do not expose contract length or ACV.
          tone: warning
        - label: 初始部署围绕 HR 和劳务运营
          actor: HR admins and employees
          stage: Deployment
          touchpoints:
            - Employee portal and employee database are core adoption surfaces.
            - Review activity implies real-world usage but not named references.
          tone: positive
        - label: 面向员工的使用扩大产品覆盖面
          actor: All employees, including part-time workers
          stage: Usage
          touchpoints:
            - Function pages say all employees can receive timely information.
            - Portal usage can increase data completeness and daily touchpoints.
          tone: positive
        - label: 交叉销售可以延伸到人才和 IT 流程
          actor: HR leadership and internal IT
          stage: Expansion
          touchpoints:
            - More than 120 integrations expand the deployment surface.
            - MIC says top vendors continue to rely on cross-sell and up-sell.
          tone: positive
        - label: 持续性仍取决于私人尽调
          actor: Investor / diligence team
          stage: Validation gap
          touchpoints:
            - No retained public NRR, GRR, churn, renewal, or concentration data.
            - Named deployment proof is missing from the assigned pool.
          tone: warning
    claimRefs:
      - CU001
      - CU003
      - CU007
      - CU009
      - CU010
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险敞口集中在合规敏感型运营、外部依赖的执行能力和融资透明度不足。
