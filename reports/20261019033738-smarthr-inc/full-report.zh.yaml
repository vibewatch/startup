      - number: '2.3'
        title: 买方地图、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              买方路径似乎从希望快速数字化记录和工资单的小企业，逐步延伸到需要共享员工数据层来支撑薪资周边流程、人才管理和内部沟通的大型雇主。 HR.software 的评测显示，最多 30
              名员工的组织可使用免费层，说明微型企业端进入门槛低；官方页面又把场景扩展到门户、分析、集成和 AI 辅助账户流程， 这些对大组织更重要。预算负责人可能先是微型企业的老板或后台管理员，再转为 SMB 的 HR
              和薪资负责人，规模更大时扩大到 CHRO 或转型预算； 当账户生命周期自动化变得有价值，IT 运营也会加入。约束同样明确：SmartHR 的适配性高度绑定日本，公开证据没有建立按支出的清晰 SAM，
              Kantenna 关于估值受阻而 IPO 延后的报道也说明，品类领先并不能消除投资人对市场能否超越国内核心合规切入口的疑虑。
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM013
              - CM014
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 国内合规切入口比完整钱包份额更容易评估
            body: 公开证据最强的部分是 SmartHR 对日本入职、社会保险、税务调整和员工数据流程的数字化；但其安装基础还能稳定吸收多少额外 HR-tech 或 IT 周边支出， 证据明显更弱。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
          - type: callout
            title: 清晰的公开 SAM/SOM 仍不存在
            body: 公开来源混合了品类预测、份额、客户数量和入门价格，却没有披露细分 ACV 或模块附加率；              因此投资人仍需私有变现证据，才能用宽泛 TAM 主张支撑溢价倍数。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场格局与细分匹配
        blocks:
          - type: paragraph
            body: >-
              指定资料池中最强的直接替代方案是 AQ Partners 明确比较的日本本土三家：SmartHR、freee HR 和 MoneyForward Cloud Payroll。 其中 SmartHR 被定位为 HR
              优先的一体化选择，freee 适合重视英文体验和 freee Accounting 的团队，MoneyForward 则是已经采用 MoneyForward 生态、
              需要更深银行和薪资运营能力团队的选择。Caplight 还列出 jinjer、HRBrain 等相邻产品，但资料池没有足够的当前公开细节，无法同等精度评估它们的产品深度和包装。 软件之外，纸面或 Excel
              流程、外包薪资服务商，以及 Workday 或 SAP 等全球 HR 套件也能完成同一任务；当买方更看重全球标准化而非日本本地流程深度时， 这些方案都可能替代 SmartHR。
            claimRefs:
              - CP004
              - CP005
