callouts:
  - calloutType: insight
    title: Broad product identity is better supported than economic transparency
    body: >-
      The assigned refresh pool is strong on what SmartHR is and what workflows it touches, but
      weak on what the business is worth today or how efficiently it grows.
    claimRefs: [CO001, CO002, CO009, CO010]
  - calloutType: risk
    title: Governance depth is still under-documented in public evidence
    body: >-
      Public sources identify a founder story and a small executive bench, but they do not expose
      enough board, succession, or control detail to underwrite governance quality.
    claimRefs: [CO015, CO016]
