      - Public value or status
      - As of
      - Confidence
      - Gap / caveat
    rows:
      - [Product scope, "HR, payroll, attendance, talent management, employee portal, and IT operations", "2026-10-19 access", High, "Official pages are consistent on breadth, but do not disclose module-level revenue mix."]
      - [Launch / operating start, "2015 launch claimed by SmartHR", "2026 official business page", Medium, "Caplight separately lists year founded as 2013, so the sources do not fully resolve incorporation date versus product launch date."]
      - [Customer accounts, "80,000+ companies signed up", "2026-04", Medium, "Company-defined as corporate accounts that completed office registration; not equivalent to paid active logos disclosed in a filing."]
      - [Mobile app installs, "2 million+", "2026-02", Medium, "Installation count is a usage signal, not contracted-seat disclosure."]
      - [Headquarters, "Tokyo", "2026 public preview", Low, "Headquarters appears on Caplight's public profile but is not corroborated on assigned official pages."]
      - [Stage / financing state, "Private; Caplight public preview labels last round as IPO on 2026-03-17", "2026-03-17", Low, "Needs primary financing documents or company confirmation; the assigned pool does not prove a public listing."]
      - [Estimated valuation, "$1.0B", "2026 public preview", Low, "Preview-level third-party estimate only; no assigned primary source corroborates valuation."]
      - [Total funding raised, "$357.79M", "2026 public preview", Low, "Preview-level third-party estimate only; no assigned primary source reconciles round proceeds."]
      - [Headcount, null, "2026-10-19", Low, "Official current headcount is not disclosed in the assigned pool; Caplight's employee range preview is too weak for a cover metric."]
      - [Revenue / ARR / NRR / gross margin, null, "2026-10-19", Low, "No assigned source provides current revenue, ARR, NRR, or margin disclosure."]
    notes: "Combines official company claims with third-party preview data; null marks unsupported cover metrics, and low-confidence financing fields still require primary diligence."
    claimRefs: [CO001, CO003, CO005, CO007, CO008, CO009, CO010]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Public role
      - Source-backed context
      - Functional coverage / dependency
      - Diligence ask
    rows:
      - [Shoji Miyata, Founder, "Official origin story ties product creation to paperwork pain around maternity and childcare leave in 2015.", "Strong founder-market-fit narrative; still need current operating involvement and board role.", "Confirm current ownership, board seat, and executive role."]
      - [Masato Serizawa, CEO, "Official business page references a message from CEO Masato Serizawa for the next decade.", "Signals current top executive ownership of strategy and messaging.", "Request full executive biography, tenure, and succession planning."]
      - [Yuji Mori, "Director; Chief Financial Officer; Head of Finance Investor Relations", "Named on Caplight's public key-people preview.", "Covers finance and investor-relations interface, but not enough to assess reporting depth.", "Validate tenure, responsibilities, and financing process ownership."]
      - [Takafumi Kurahashi, COO, "Named on Caplight's public key-people preview.", "Public evidence supports operating ownership in title only.", "Request operating KPI ownership and organizational span."]
      - [Takashi Adachi, Chief Product Officer, "Named on Caplight's public key-people preview.", "Suggests product leadership bench beyond founder story.", "Request roadmap ownership, engineering counterpart, and product governance."]
    notes: "Enumeration is intentionally partial because the assigned sources expose only a founder story, one named CEO reference, and a limited third-party executive preview rather than a full leadership or board roster."
    enumerationScope:
      coverage: partial
      basis: "Publicly named founder and executives surfaced in the assigned official pages and Caplight preview only; the assigned pool does not disclose the full management team or board."
    claimRefs: [CO004, CO015, CO016]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Public role
      - Observed importance
      - Source support
      - Diligence ask
    rows:
      - [World Innovation Lab, "Repeat investor", "Appears across Series A, C, and E in Caplight's public preview, implying long-duration backing.", "Caplight preview investor table", "Confirm current ownership and governance rights."]
      - [Coral Capital, "Repeat investor and secondary participant", "Listed in Series A, B, and C plus a secondary transaction, implying both early support and liquidity activity.", "Caplight preview investor table", "Confirm whether secondary activity changed control concentration."]
      - [Kohlberg Kravis Roberts, "Series E investor", "Signals later-stage institutional participation in the 2024 round.", "Caplight preview investor table", "Confirm check size, board rights, and any structured terms."]
      - [Whale Rock Capital Management, "Series D investor", "Suggests crossover or public-market-adjacent interest during the 2021 financing.", "Caplight preview investor table", "Confirm whether support extended beyond one round."]
      - [Tokio Marine & Nichido Fire Insurance, "Series B investor", "Adds strategic or insurance-adjacent capital to the public investor mix.", "Caplight preview investor table", "Clarify whether the relationship is purely financial or commercially strategic."]
    notes: "Enumeration is partial because the assigned pool exposes only a public preview of investors and rounds; it does not provide cap-table percentages, board seats, preference terms, or debt/credit facilities."
    enumerationScope:
      coverage: partial
      basis: "Rows are limited to investors and stakeholders explicitly visible in Caplight's public preview; the assigned pool does not expose the complete capitalization table or all financing counterparties."
    claimRefs: [CO009, CO010, CO011, CO016]
