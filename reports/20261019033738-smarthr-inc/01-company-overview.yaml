slug: smarthr-inc
runDate: 2026-10-19
company:
  name: SmartHR, Inc.
chapter:
  number: 1
  title: Company Overview
  summary: >-
    SmartHR presents itself as a broad back-office SaaS platform for Japanese employers,
    anchored in HR, payroll, talent management, employee self-service, and IT operations.
    The assigned refresh evidence supports real product breadth, a large installed base claim
    of 80,000 companies, and an active 2026 product cadence, but funding, valuation, board
    governance, and core financial metrics remain only partially public.
sections:
  - id: identity-and-scope
    title: Identity, scope, and public scale signals
    body: >-
      Assigned official materials consistently frame SmartHR as more than a narrow payroll or
      e-government filing tool. The English homepage and service pages describe a worker-friendly
      back-office system spanning HR and labor management, payroll, attendance, talent
      management, employee self-service, and IT operations, while the Japanese product pages
      add evidence of employee-database, employee-portal, and SaaS account-management workflows.
      That breadth matters because later chapters should treat SmartHR as a platform play inside
      Japanese back-office software rather than as a single-feature compliance utility.
      Public scale signals are directionally strong but should be handled as company claims:
      SmartHR says the service launched in 2015, had signed up more than 80,000 companies as of
      April 2026, and had surpassed 2 million mobile app installations as of February 2026.
      The same Japanese homepage also markets seven consecutive years of labor-management-cloud
      leadership and a modeled 88% reduction in total work hours for a 1,000-employee deployment,
      but those performance and share claims are not independently corroborated in the assigned
      pool. Headquarters, stage, valuation, and headcount remain weaker than product-scope
      evidence because the strongest public figures come from third-party preview pages rather
      than primary financing documents or company filings.
    claimRefs: [CO001, CO002, CO003, CO005, CO007, CO008, CO009]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership bench, founder narrative, and governance visibility
    body: >-
      The founder-market-fit story is unusually clear in official materials. SmartHR says Shoji
      Miyata started the company after seeing pregnancy- and childcare-related paperwork place a
      needless burden on employees and employers, which directly connects product origin to
      Japan's paper-heavy labor and social-insurance workflows. Public leadership coverage beyond
      that origin story is thinner. The English business page names Masato Serizawa as CEO, and
      Caplight's preview page lists Yuji Mori as CFO, Takafumi Kurahashi as COO, and Takashi
      Adachi as Chief Product Officer, which is enough to establish a functional executive bench
      but not enough to underwrite governance quality, board composition, succession depth, or
      decision rights. In practical diligence terms, SmartHR looks founder- and management-led,
      but the assigned sources do not provide the governance detail that would let an investor
      separate brand narrative from institutionalized operating controls.
    claimRefs: [CO004, CO015, CO016]
    tableRefs: [TO002, TO003]
  - id: financing-and-milestones
    title: Funding visibility and milestone cadence
    body: >-
      The assigned pool shows a meaningful public milestone cadence, but financing transparency is
      still incomplete. SmartHR's official materials support a 2015 launch, a 2025 tenth
      anniversary, and continued 2026 product and partnership activity, including AI-assisted
      browser automation and an HRD talent-management partnership. Caplight adds a visible round
      sequence from Series B in 2018 through Series E in 2024, a secondary round in late 2025,
      and an IPO-labelled round on 2026-03-17, plus a $1.0B estimated valuation and $357.79M of
      total funding raised. Those numbers are useful discovery signals, but they remain low
      confidence for investment judgment because the public page withholds detailed pricing charts,
      filing records, and underlying transaction support. The only clearly adverse view in the
      assigned pool comes from a 2026 Substack analysis, which argues SmartHR's original moat was
      automating manual data entry in Japanese offices and that generative AI could commoditize
      that entry point unless SmartHR turns accumulated HR data into higher-value decision support.
    claimRefs: [CO006, CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
