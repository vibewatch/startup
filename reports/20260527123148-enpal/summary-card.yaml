summary:
  headline: >-
    Enpal combines category-leading scale in German residential solar with a broadened home-electrification bundle and
    unusually deep structured-finance access, but opaque post-2023 valuation, limited audited profitability disclosure,
    service-quality/legal friction, and policy sensitivity justify a Track rating rather than an invest-now
    recommendation.
  overallScore: 6
  recommendation: track
  confidence: low
  riskRating: high
  valuationStance: fair
