callouts:
- calloutType: strength
  title: Twenty-year lease creates structural retention that no SaaS-style churn metric captures
  body: >-
    Enpal's installed base is protected by physical hardware lock-in, 20-year contractual terms, and
    multi-product bundling across solar, storage, wallbox, and heat pump. Switching is not an annual
    renewal decision but a logistical and financial event most residential customers will not undertake.
  claimRefs:
  - CU024
  - CU037
  - CU046
- calloutType: insight
  title: Heat pump market leadership in two years validates platform-extension thesis
  body: >-
    Enpal entered heat pumps only in 2023 and became Germany's market leader by H1 2025 with more than
    10,000 installs, confirming that the direct-sales motion and supply-chain infrastructure built for PV
    can be redeployed to adjacent product categories at speed.
  claimRefs:
  - CU013
  - CU014
  - CU015
- calloutType: risk
  title: Post-installation service quality is a documented vulnerability that could compound at scale
  body: >-
    Multiple independent review sources — Trustpilot corpus, diebewertung.de, gruenes.haus, and the
    cps-schliessmann analysis — identify consistent patterns of post-installation service failure: poor
    hotline access, grid-connection delays, subcontractor defects, and alleged billing disputes. If
    roughly 14% of customers generate roughly 66% of tickets as the adverse analysis estimates, service
    cost per customer is highly concentrated and will compound as the base grows.
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
