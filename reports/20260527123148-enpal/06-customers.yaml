  title: Expansion and concentration risk table
  notes: >-
    Channel dependency and geographic concentration are the most addressable near-term risks. Institutional
    financing counterparty concentration is a distinct capital-markets risk layer.
  columns:
  - Driver or risk
  - Type
  - Current evidence
  - Impact rating
  - Diligence path
  rows:
  - - Heat pump cross-sell within solar base
    - Expansion driver
    - Roughly one-third of revenue within 2 years; more than 10,000 installs
    - High positive
    - Request cross-sell penetration rate within existing solar customer base
  - - Enpal.One+ AI energy trading adoption
    - Expansion driver
    - Connected to tens of thousands of batteries; VPP ambition stated
    - Medium positive
    - Request active Enpal.One+ users and average per-customer revenue contribution
  - - Metrify smart-meter recurring revenue
    - Expansion driver
    - More than 50,000 smart meters; 70% recurring revenue growth post-spin-off
    - Medium positive
