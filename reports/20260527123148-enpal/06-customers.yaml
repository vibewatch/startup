- id: FU001
  title: Customer journey map
  type: journey-map
  summary: >-
    Maps the residential B2C homeowner journey from brand discovery through product activation and
    ecosystem expansion, highlighting the post-installation service friction point documented in
    adverse sources.
  approximationNotes: >-
    Stages synthesised from company press releases (SU001 SU003 SU013), lease-product descriptions
    (SU015 SU016 SU018), review analyses (SU007 SU009), and the Enpal.One+ capability claims (SU013).
    Stage durations are illustrative.
  data:
    nodes:
    - id: brand-discovery
      label: Brand discovery
      description: 72% of German homeowners recognise Enpal from a presented list; TV, digital, and referral channels drive awareness
    - id: sales-consultation
      label: Sales consultation
      description: Video call or in-home visit; lease or purchase options presented; zero-upfront lease prominently featured; high-pressure repeat-call tactics flagged in adverse reviews
    - id: contract-signed
      label: Contract signed
      description: 20-year lease at 98 to 350 EUR per month covering hardware, installation, maintenance, repairs, and insurance; or flexible purchase loan via EFS
    - id: installation
      label: Installation
      description: Enpal or partner team completes installation in 1 to 3 days; 82 to 88 percent of reviewers rate this phase excellent or good
    - id: grid-connection
      label: Grid-connection paperwork
      description: Key friction point — required filings with local network operator; some customers waited months for system activation due to incomplete paperwork
    - id: activation
      label: System activation and Enpal.One+
      description: App goes live; AI energy-trading platform connects battery to day-ahead electricity spot market; household enters virtual power plant
    - id: expand
      label: Cross-sell and ecosystem deepen
      description: Upsell to heat pump, EV wallbox, metrify smart-meter subscription, and additional battery capacity; ARPU deepens with each added product line
