  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      NRR, GRR, annual churn rate, early-termination frequency, lease default rate, consumer loan
      delinquency rate, and cohort-level payment performance by vintage and product line.
    whyItMatters: >-
      Structural lock-in from the 20-year lease mitigates voluntary churn, but it does not prevent
      financial default, dispute-driven termination, or legal cancellation. Without payment performance
      data the recurring cash-flow quality of the portfolio cannot be independently assessed.
    diligencePath: >-
      Request cohort-level data covering early-exit events by year and contract type; EFS consumer loan
      default and delinquency rates by vintage; and SPV-level covenant performance for the institutional
      investor-backed facilities.
    relatedQuestionRefs:
    - QU013
    - QU025
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table coverage
    missingEvidence: >-
      Named residential household case studies with outcome metrics; named C&I customers beyond Golf Valley
      München; named Enpal.pro partner installers with volume or revenue data.
    whyItMatters: >-
      The proof base is dominated by aggregate review scores rather than outcome-specific references. This
      is typical for residential solar but means an investor cannot independently verify economic outcomes
      for individual accounts.
    diligencePath: >-
      Request a list of referenceable residential and commercial customers, Enpal.pro partner case studies,
      and any available outcome metrics from the internal account-management database.
    relatedQuestionRefs:
    - QU008
    - QU026
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: enpal-pro-channel-metrics
    missingEvidence: >-
      Active installer-partner count on Enpal.pro, GMV or revenue transacted through the platform,
