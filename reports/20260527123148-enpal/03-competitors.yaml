    rows:
      - - 20-year lease / financing contract lock-in
        - >-
          Early-termination demand if energy prices fall further; refinancing competition
          from banks and utilities; Thermondo flex offering comparable instalment model
        - Medium
        - Request churn/termination rate on lease book; verify contractual penalty structure and duration distribution
      - - Enpal.One+ VPP and software ecosystem
        - >-
          1Komma5 Heartbeat AI opens to existing non-1Komma5 hardware; could divert VPP
          value creation from Enpal customers without requiring hardware swap
        - High
        - Verify whether Enpal.One+ contracts preclude third-party HEMS access; assess API openness
      - - Installed base scale (~115,000 households, ~1 GW)
        - >-
          1Komma5 claims 300,000+ systems; market consolidation may yield a larger
          competitor VPP at lower cost; hardware scale alone does not prevent churn
        - Medium
        - Obtain Enpal active-system and upsell-to-heat-pump conversion rates; verify 1 GW figure
      - - B2B platform Enpal.pro (installer network)
        - >-
          Zolar pivoted to B2B installer software; 1Komma5 and traditional SaaS players
          could compete in this segment; network effects unclear at current scale
        - Low
        - Request Enpal.pro installer count and GMV; assess differentiation vs Autarc, Spruce
      - - Hardware procurement and vertical integration
        - >-
          Solar modules are globally commoditised; Chinese module oversupply is compressing
          hardware margins; Enpal's pricing advantage can erode if procurement
          optimisation is not superior to competitors
        - High
        - Audit procurement terms, panel suppliers, and gross margin trend by product line 2022-2025

