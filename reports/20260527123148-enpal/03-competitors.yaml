      statement: >-
        1Komma5 Heartbeat AI manages 500 MW of flexible capacity across ~50,000 connected
        decentralised energy systems in Germany, Denmark, Sweden, and the Netherlands as of
        May 2025, saving those households €36.6M in electricity costs per company statement.
      type: third-party-reported
      topic: competitor differentiation
      sourceRefs:
        - SP004
        - SP013
      confidence: high
      freshness: recent

