  claims:
    - id: CP001
      statement: >-
        EUPD Research's August 2025 Market Leadership Study Europe named 1KOMMA5°, E.ON Solar,
        and Enpal (in alphabetical order) as Europe's three leading residential solar companies,
        distinguishing them on scale, digital platforms, and sector coupling.
      type: third-party-reported
      topic: competitive landscape
      sourceRefs:
        - SP012
        - SP001
      confidence: high
      freshness: recent

    - id: CP002
      statement: >-
        Germany's residential solar capacity grew 214% between 2022 and 2023 but only 6.66%
        between 2023 and 2024; residential installations fell approximately 20% year-over-year
        in 2024, compressing margins for D2C solar installers across the competitive set.
      type: third-party-reported
      topic: market context
      sourceRefs:
        - SP001
        - SP012
      confidence: high
      freshness: recent

    - id: CP003
      statement: >-
        Zolar raised ~€300M total from investors including Partech, AENU, and Energy Impact
        Partners; initiated insolvency proceedings in self-administration in July 2025 and
        reduced its workforce from ~400 to ~50 while pivoting from D2C installation to B2B
        installer software.
      type: third-party-reported
      topic: competitive landscape
      sourceRefs:
        - SP001
        - SP015
        - SP016
      confidence: high
      freshness: recent

    - id: CP004
      statement: >-
        Zolar grew revenue from €41M in 2022 to €86M in 2023 but incurred a net loss of €24M
        in 2023; the business model was described by its CEO as never being profitable on paper
        without a large cash balance, a gap relative to Enpal's capital structure.
      type: third-party-reported
      topic: competitive landscape
      sourceRefs:
        - SP001
        - SP016
      confidence: high
      freshness: recent

    - id: CP005
      statement: >-
        Germany has 5 million solar arrays installed with 104 GWp total capacity as of April 2025;
        the fragmented installer market includes over 24,000 firms across Europe, the majority
        being small regional Handwerker without national brand or financing capability.
      type: third-party-reported
      topic: market structure
      sourceRefs:
