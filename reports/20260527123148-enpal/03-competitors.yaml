localEvidence:
  searchQueries:
    - query: "1Komma5 Heartbeat AI VPP platform 2026 open retrofit existing systems"
      rationale: >-
        Covers 1Komma5's platform differentiation vs Enpal.One+; volatile token "2026"
        ensures freshness for a rapidly changing software capability.
    - query: "Enpal competitors Germany residential solar 2026 market share"
      rationale: >-
        Identifies the current competitive landscape for Enpal in the German home-energy
        solutions segment; 2026 token covers recent developments.
    - query: "Zolar insolvency restructuring B2B software pivot 2025"
      rationale: >-
        Confirms Zolar's exit from D2C competition; relevant adverse signal for the
        D2C installer category.
    - query: "Thermondo heat pump installer Germany 2026 solar expansion"
      rationale: >-
        Confirms Thermondo's scale and its entry into the solar vertical via FEBESOL;
        covers Enpal's heating-vertical competition.
    - query: "E.ON Solar residential PV packages Germany pricing 2026"
      rationale: >-
        Documents E.ON Solar's fixed-price package offer and positioning as a utility-
        backed alternative to Enpal; 2026 token ensures pricing is current.
    - query: "EUPD Research market leadership study residential solar Europe 2025"
      rationale: >-
        Third-party ranking of top three installers; confirms Enpal, 1Komma5, and E.ON
