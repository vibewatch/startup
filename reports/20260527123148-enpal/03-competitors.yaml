  - id: TP004
    title: Moat Durability / Competitive Risk Register
    notes: >-
      Severity ratings (High / Medium / Low) are qualitative analyst estimates based on
      publicly available evidence. Moat claims reflect Enpal's stated advantages; threats
      reflect competitive or structural forces observable in public data. Diligence asks
      are areas where investor verification would reduce uncertainty.
