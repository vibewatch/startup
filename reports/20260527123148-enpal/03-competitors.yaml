  evidenceGaps:
    - id: EGP001
      type: missing-source
      severity: material
      topic: E.ON Solar residential installation volume
      missingEvidence: >-
        E.ON Solar's residential solar installation volume (unit count or GWp) in Germany
        for 2024 is not publicly disclosed; the EUPD top-3 ranking does not include
        numerical installation data, making a true scale comparison with Enpal and 1Komma5
        impossible from public sources.
      whyItMatters: >-
        Without E.ON Solar's installation volume, the competitive intensity from the utility
        channel cannot be accurately assessed; E.ON may have scaled aggressively or remained
        a niche complement to its energy supply business.
      diligencePath: >-
        Request EUPD Research's detailed data supplement or E.ON's annual report disclosures
        on E.ON Solar subsidiary revenues; alternatively query sector associations (BSW Solar)
        for member-reported segment data.
      relatedQuestionRefs:
        - QP008
  
    - id: EGP002
      type: private-evidence-only
      severity: material
      topic: Enpal lease churn and early-termination rate
      missingEvidence: >-
        The fraction of Enpal customers who have requested early lease termination, the
        contractual penalty structure, and net retention of the lease book are not publicly
        disclosed; this is the primary unknown in the switching-cost moat assessment.
      whyItMatters: >-
        If the lease termination rate is material, the 20-year lease moat is weaker than
        stated; conversely, near-zero termination would confirm strong lock-in economics.
      diligencePath: >-
        Request lease book cohort data in the data room; review sample lease agreement
        for early-termination penalty clause language; obtain customer complaint data from
        Bundesnetzagentur or consumer review platforms (Trustpilot DE, Google Reviews).
      relatedQuestionRefs:
        - QP002
        - QP016
  
    - id: EGP003
      type: missing-source
      severity: material
      topic: Enpal.One+ VPP enrollment rate and grid revenue
      missingEvidence: >-
        The percentage of Enpal's 115,000+ households enrolled in Enpal.One+ and the
        total grid-flexibility revenue generated by the VPP are not publicly disclosed;
        without this, the VPP moat claim cannot be quantitatively benchmarked against
        1Komma5's 500 MW / 50,000-system Heartbeat AI disclosure.
      whyItMatters: >-
        VPP scale is a network-effect-driven moat; if Enpal's VPP remains significantly
        below 1Komma5's in connected capacity, 1Komma5 may generate superior per-customer
        grid-revenue and deepen its software advantage.
      diligencePath: >-
        Request Enpal.One+ enrollment data and VPP dispatch records; compare to 1Komma5's
        publicly disclosed 500 MW milestone; triangulate via Bundesnetzagentur balancing
        energy market disclosures.
      relatedQuestionRefs:
        - QP005
        - QP014
  
    - id: EGP004
      type: private-evidence-only
      severity: moderate
      topic: Enpal.pro installer network scale and revenue
      missingEvidence: >-
        The number of installer partners on Enpal.pro, their GMV, and Enpal's B2B platform
        revenue contribution are not publicly disclosed; as a result, the competitive overlap
        with Zolar's post-pivot software business and the strategic importance of the B2B
        channel cannot be assessed from public sources.
      whyItMatters: >-
        If Enpal.pro is scaling rapidly, it represents a second growth vector beyond D2C
        that could reduce dependence on consumer demand cycles; if nascent, the investment
        from the April 2025 raise may not yet translate to competitive differentiation.
      diligencePath: >-
        Request installer count and GMV from the data room; compare to Autarc and Spruce
        product pricing and customer count disclosures; assess installer NPS or churn rate.
      relatedQuestionRefs:
        - QP003
        - QP021
  
    - id: EGP005
      type: missing-source
      severity: moderate
      topic: Competitive win/loss data against 1Komma5 and E.ON Solar
      missingEvidence: >-
        No public win/loss or market share data exists at the homeowner level between Enpal,
        1Komma5, and E.ON Solar; EUPD ranks them collectively as top-3 but does not
        disclose relative shares within that tier.
      whyItMatters: >-
        Without win/loss data, Enpal's competitive positioning against its two most
        directly comparable peers cannot be objectively assessed; if E.ON Solar is gaining
        share in the upfront-purchase segment, Enpal's lease-focused positioning may leave
        that segment under-covered.
      diligencePath: >-
        Commission a targeted survey of recent solar adopters in Germany via a market
        research firm; request Enpal management's internal win/loss tracking; review
        Trustpilot and Google Reviews for mention of competitive shortlist decisions.
      relatedQuestionRefs:
        - QP015
  
    - id: EGP006
      type: missing-source
      severity: moderate
      topic: Platform comparison and contract exclusivity gaps
      missingEvidence: >-
        Enpal's standard lease and Enpal.One+ contract terms, including any exclusivity
        or third-party HEMS access restrictions, are not publicly available; the product
