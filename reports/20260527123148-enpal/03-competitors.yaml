      statement: >-
        1Komma5° reported €520M in revenue for 2024, up from €450M in 2023, with organic
        sales growing 36% to €490M; the company employs ~2,500 people across 80 sites in
        7 markets and states it is operationally profitable and debt-free.
      type: third-party-reported
      topic: competitor profile
      sourceRefs:
        - SP002
        - SP001
      confidence: high
      freshness: recent

    - id: CP007
      statement: >-
        1Komma5° raised approximately €400M in equity since its 2021 founding, including a
        €150M pre-IPO round in July 2025 led by Sabanci Climate Ventures; the company has
        not drawn on an approved €100M credit line, underscoring its debt-free capital profile.
      type: third-party-reported
      topic: competitor profile
      sourceRefs:
        - SP003
        - SP002
      confidence: high
      freshness: recent

