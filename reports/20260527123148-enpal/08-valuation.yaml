  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: ebitda-2025
      missingEvidence: "Audited 2025 P&L showing EBITDA line and margin; only operating-segment FCF has been publicly confirmed."
      whyItMatters: "The difference between positive operating FCF and positive EBITDA is material for the investment thesis; large depreciation, amortisation, or stock-based compensation charges could produce EBITDA losses even with positive FCF. Without confirmed EBITDA, the profitability narrative is structurally incomplete."
      diligencePath: "Request audited 2025 statutory accounts from Enpal IR/CFO; expect Handelsregister filing by Q3 2026."
      relatedQuestionRefs: [QV014, QV031]

    - type: private-evidence-only
      severity: blocking
      topic: current-valuation-mark
      missingEvidence: "Updated cap-table valuation or secondary-market transaction price post-January 2023."
      whyItMatters: "The last disclosed valuation is 3+ years old and predates the 2024 operating loss and 2025 recovery; entry discipline cannot be set without a current reference mark. The April 2025 raise silence on valuation is a warning signal that no mark confirming EUR 2.2B was available."
      diligencePath: "Primary data request from lead investors (TPG Rise Climate, SoftBank); data-room cap-table access; secondary-market broker inquiry (Carta, Forge, Nasdaq Private Market)."
      relatedQuestionRefs: [QV012, QV021]
      relatedTableRefs: [TV001, TV006]

    - type: private-evidence-only
      severity: material
      topic: customer-ltv-cohorts
      missingEvidence: "Annual customer churn rate, cohort retention schedule, and customer lifetime value by product type (solar, heat pump, storage)."
      whyItMatters: "The ABS asset quality and long-term recurring cash flows underpinning Enpal's capital structure are entirely dependent on customer retention; no public cohort or retention data exists, making ABS risk modelling speculative."
      diligencePath: "Primary interview with Enpal management; request cohort data from data room during formal due diligence process."
      relatedQuestionRefs: [QV015]

    - type: private-evidence-only
      severity: material
      topic: abs-covenant-terms
      missingEvidence: "Full SPV covenant package, LTV triggers, servicer-replacement provisions, and interest-rate waterfall terms for the EUR 1.1 billion ABS facility."
      whyItMatters: "Without covenant terms, the rate sensitivity of the ABS model cannot be stress-tested; a 200bp rate increase could trigger LTV covenant violations and require Enpal to post additional equity collateral, materially affecting liquidity."
      diligencePath: "Legal counsel or structuring advisors; formal request from Enpal CFO in data room."
      relatedQuestionRefs: [QV013]

    - type: stale
      severity: minor
      topic: governance-leadership-changes
      missingEvidence: "Confirmation of any leadership or governance changes since the January 2023 Series D, including CFO transition details, board composition changes, and management's official position on a future IPO or exit timeline."
      whyItMatters: "Management stability is a key diligence gate for a company at the restructuring and recovery phase Enpal is currently in; leadership changes without public disclosure reduce governance confidence. The IPO/exit timeline is a partial answer: no bank mandate or regulatory filing exists, but official management intent is unconfirmed."
      diligencePath: "LinkedIn, Handelsregister, and Enpal official communications; direct management discussion; legal advisor for dual-track activity."
      relatedQuestionRefs: [QV020, QV027]

    - type: enumeration-incomplete
      severity: minor
      topic: eu-private-solar-comps
      missingEvidence: "Confirmed 2026 revenue and enterprise value data for 1KOMMA5, Zolar, and other EU private solar/energy-services companies; and verified data on how German revenue concentration compares to more diversified EU energy-services peers."
