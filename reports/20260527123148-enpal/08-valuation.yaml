  - id: scenarios-financing
    title: Financing Structure, Scenarios, and Sensitivity
    body: >
      Enpal's capital structure is multi-layered and unconventional by European standards. Total equity raised
      across all rounds amounts to approximately EUR 325 million at disclosed closes, with investor base anchored
      by SoftBank Vision Fund II (EUR 130 million, Series C, October 2021), TPG Rise Climate (lead across Series
      D at EUR 215 million in January 2023 and the April 2025 growth round at EUR 110 million), Activate Capital,
      The Westly Group, and early financial infrastructure investors including BlackRock Alternatives, ING,
      UniCredit, and Pricoa Private Capital in the December 2022 structured refinancing. The company has exceeded
      EUR 5 billion in total financing commitments as of October 2024, the vast majority structured through
      ABS/warehouse facilities.

      The ABS model places customer solar-lease and ownership contracts into off-balance-sheet SPVs, enabling
      Enpal to monetise long-duration recurring cash flows from homeowners at lower interest rates than equity,
      but creates sensitivity to both credit-market tightening and rising base rates. The March 2024 EUR 1.1
      billion ABS facility from Barclays Europe, Bank of America, and Credit Agricole CIB with CPP Investments
      in mezzanine is the primary structural instrument. Its covenant terms and waterfall are not publicly
      disclosed, a critical diligence gap for assessing downside scenarios.

      Three investment scenarios are modelled. The bull case (approximately 25% probability signal) assumes Enpal
      expands into four or more European markets by 2028, achieves sustained EBITDA margins above 10%, and
      benefits from ABS market deepening toward US precedent; at a 3.5x multiple on EUR 1.8 billion revenue the
      implied valuation exceeds EUR 6 billion. The base case (approximately 50%) assumes Germany and Italy hold,
      EBITDA turns structurally positive by 2026, and multiples stabilise near 2.5x on EUR 1.5 billion; implied
      valuation approximately EUR 3.75 billion. The bear case (approximately 25%) assumes 2025 FCF is not
      replicated in 2026, ABS refinancing tightens, revenue stagnates around EUR 1.0 to 1.1 billion, and
      multiples compress to 1.5x; implied valuation approximately EUR 1.5 to 1.65 billion, a material down round
      from the last disclosed mark.
