  - id: exit-diligence
    title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
    body: >
      Exit readiness for Enpal at its current stage is constrained but credible over a 3 to 5 year horizon. No
      public evidence of an imminent IPO process or regulatory filing exists as of Q2 2026; management has not
      disclosed a timeline, and the April 2025 equity raise did not include an IPO ratchet or public-market
      commitment clause. Strategic exits via a European utility (E.ON, EnBW, EDF) or a large infrastructure
      investor represent the most likely near-term liquidity paths, supported by Enpal's asset-heavy ABS model
      which is readily compatible with infrastructure fund ownership structures. A Frankfurt or EURONEXT IPO
      remains possible in 2027 to 2028 if EBITDA proof and positive public-market comparable sentiment converge.

      Preference overhang from multi-round financing creates structural complexity for common equity holders.
      The Series C (approximately EUR 950 million post-money) and Series D (EUR 2.2 billion post-money) imply
      meaningful senior liquidation preferences above an earlier class; exact stacking is not publicly disclosed
      and is a priority diligence item.

      Five thesis-break triggers warrant explicit monitoring. A 2025 audit revealing EBITDA loss would collapse
      the FCF narrative and prompt immediate re-rating. An ABS refinancing gap of EUR 500 million or more would
      signal capital structure stress. A revenue miss of more than 10 percentage points below guidance in 2026
      would break the growth thesis. An adverse German regulatory ruling eliminating key solar subsidies would
      compress the addressable market. A confirmed down round below EUR 1.8 billion would signal investor
      confidence erosion and trigger base-case reassessment.
    claimRefs:
      - CV028
      - CV029
      - CV033
      - CV036
      - CV043
