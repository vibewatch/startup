callouts:
  - calloutType: recommendation
    title: "Conditional Track: Await Three Evidence Gates"
    body: >
      Current evidence supports a conditional track stance. Do not invest above EUR 3B EV without audited 2025
      EBITDA confirmation, an updated valuation mark (post-January 2023), and ABS covenant disclosure. An entry
      at or below EUR 2 billion enterprise value acquires Enpal at under 2x 2025 revenue, a discount exceeding
      60% to Sunrun's public EV/Revenue multiple, creating meaningful upside if the three evidence gates clear.
    claimRefs:
      - CV001
      - CV007
      - CV043
      - CV044

  - calloutType: risk
    title: "Down-Round Risk Is Material: 2025 Evidence Is Necessary Not Sufficient"
    body: >
      The April 2025 EUR 110 million equity raise at an undisclosed valuation, combined with a roughly EUR 50
      million operating loss in 2024, creates a credible scenario in which a new valuation mark falls below the
      January 2023 EUR 2.2 billion reference. This is consistent with broader late-stage down-round trends in
      2026. The 2025 positive operating free cash flow is encouraging but not sufficient: EBITDA and cash
      conversion must be confirmed through an independent audit before the risk of a valuation reset can be
      dismissed.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV024
      - CV032
      - CV033

  - calloutType: insight
    title: "ABS Model Is a Competitive Advantage and a Concentration Risk"
    body: >
      Enpal's ABS securitisation model, placing customer contracts into off-balance-sheet SPVs backed by
      Barclays, Bank of America, CPP Investments, and others, is the most operationally innovative aspect of
      the business and enables capital deployment at scale unachievable by equity-only peers. However, the model
      concentrates credit and refinancing risk in a structure whose covenant terms are undisclosed publicly. If
      ABS markets tighten by 100 to 200 basis points from 2024 levels, refinancing cost increases will compress
      margins and may impair the platform economics underpinning the entire growth thesis.
    claimRefs:
      - CV012
      - CV013
      - CV035

