  - id: valuation-comps
    title: Valuation Analysis and Comparable Set
    body: >
      The most reliable external anchor for Enpal's equity value is its January 2023 Series D post-money
      valuation of approximately EUR 2.2 billion (roughly USD 2.4 billion at 2023 EUR/USD). On 2025 revenue of
      EUR 1.1 billion this implies an EV/Revenue multiple of approximately 2.0x, markedly below the 5.4x median
      for public green-energy companies (Finerva 2026 data) and well below Sunrun's 6.1x EV/Revenue on USD 3.17
      billion TTM revenue as of Q1 2026.

      The discount is partially justified by structural differences. Enpal is private (illiquidity discount),
      operates in a higher-rate European market that is not yet as receptive to ABS-financed solar as the United
      States, and has not yet demonstrated sustained EBITDA profitability. A 30 to 40 percent private-to-public
      discount is consistent with analyst estimates for European climate-tech unicorns at equivalent stages.

      Within the private European market, Enpal's closest comparable is 1KOMMA5 degrees, valued at approximately
      USD 1 billion and growing rapidly but at considerably smaller scale. Zolar, valued at USD 250 to 400
      million, is an earlier-stage digital installer with a much narrower bundle. On revenue scale Enpal is best
      comped to Sunrun, though the US market commands higher multiples, higher customer density, and
      better-established solar ABS precedent. The failures of Sunnova (liquidation 2026) and SunPower (bankruptcy
      2025) serve as adverse comparables, illustrating that capital-intensive residential solar installers can
      fail rapidly when rate conditions deteriorate and refinancing markets tighten, a direct warning for
      Enpal's ABS-dependent model.

      Applying a 2.0 to 3.5x EV/Revenue range to 2026 to 2028 estimated revenues of EUR 1.2 to 1.5 billion
      yields a valuation corridor of approximately EUR 2.4 billion to EUR 5.3 billion. The midpoint of the base
      case (approximately EUR 3 billion) is modestly above the last disclosed mark, implying limited near-term
      upside unless revenue execution and EBITDA proof materially exceed consensus expectations or European
      multiples re-rate toward US levels.
