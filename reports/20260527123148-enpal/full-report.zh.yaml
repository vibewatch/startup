      - number: '2.4'
        title: 政策、监管框架与热泵 / EV 相邻市场
        blocks:
          - type: paragraph
            body: >-
              德国 Renewable Energy Sources Act（Erneuerbare-Energien-Gesetz, EEG）是住宅太阳能市场的结构性支柱。EEG 要求 100 kWp 以下系统从投运日起享有
              20 年固定上网电价。2026 年 2–7 月，Bundesnetzagentur 已公布 7.78 ct/kWh（部分上网，≤10 kWp）和 12.35 ct/kWh（全额上网，≤10
              kWp）电价，并约每半年下调 1%。这些费率是住宅太阳能 ROI 计算中最重要的经济锚。

              Solarpaket I（2024 年 5 月生效）带来几项利好市场的变化：简化全额上网和部分上网之间的年度切换、加快并网规则、强化租户电力，并为更大屋顶系统提供新支持。不过，截至报告日，European
              Commission 尚未批准针对 Solarpaket I 中 40+ kWp 系统 +1.5 ct/kWh 上调的拟议欧盟国家援助审查。Solar Peak
              Act（Solarspitzengesetz，2025 年 2 月）终止负电价时的补偿，并对新安装提出智能电表要求，给所有权方案增加了温和复杂度。

              2027 年 EEG 改革风险很关键。拟议改革将取消所有新小型 PV 系统（≤25 kW）的固定上网电价，让新增安装转向现货市场报酬。BSW-Solar
              警告，这可能显著拖慢安装，并危及数万个就业岗位。调查显示，如果没有保底电价，只有 ~40% 的潜在买家会继续购买。经济部长 Reiche 为改革辩护，称小型 PV 系统如今无需补贴也能盈利；行业强烈反驳这一说法。

              热泵相邻市场很重要。德国 Building Energy Act（GEG）推动分阶段替换化石燃料供暖；2025 年市场售出 299,000 台热泵（较 2024 年增长
              55%）。屋顶太阳能与热泵天然耦合，形成强交叉销售动态：PV 发电若以上网价值计算约 ~7 ct/kWh，但用于运行热泵、避免购电时价值约 ~27 ct/kWh，价值差达
              3.5×，让太阳能加热泵套装具备很强经济吸引力。PV+热泵组合包可以叠加 KfW 458 补助（最高覆盖热泵成本 70%）、EEG 上网电价和 0% VAT。

              EV 充电墙盒相邻市场也在增长。德国 EV 保有量扩张，推动家庭充电需求；自 2026 年 6 月起，能源共享监管允许居民和企业共享本地产生的太阳能电力，打开新的收入和留存模式。动态电价（2025
              年起所有供应商强制提供）正在增加一层优化空间，利好配有太阳能、储能和 EV 组合的家庭。
