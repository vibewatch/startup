  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与政策风险
        blocks:
          - type: paragraph
            body: >-
              Enpal 身处欧洲改革最活跃的能源监管环境之一。德国 Bundestag 2025 年 2 月通过立法，要求所有新 PV 安装配备 BSI 认证智能电表和智能控制单元；没有这类控制的系统，额定输出被限制在
              60%；对于 2 kW 及以上的新 PV，只要电力市场价格为负，EEG 上网电价就在该时段被暂停。Enpal 把自己描述为这些变化的受益者，因为公司已经作为德国最大的竞争性计量点运营商部署智能电表，也因为
              Enpal.One AI 管理器可以避免限发，并在现货市场交易剩余电力。不过，更长周期的监管风险更具威胁：柏林正在讨论的一项 2026 年改革草案，将完全取消新小型屋顶 PV
              的保障性上网电价，把运营者推向直接市场敞口。如果该提案推进，依赖 20 年保障补贴的消费者 ROI 叙事需要重写，并可能在 2024 年已收缩 19%
              的市场中压低新增客户需求。另外，劳动法风险已经活跃且重大。Manager Magazin 2024 年末发表调查报道，指称系统性劳动违规、工时接近每周 60 小时，以及拉美工人存在债役条件。Enpal 2025
              年 12 月赢得法院命令，禁止 Manager Magazin 重复具体指控，但 FAU Leipzig 记录了另一宗追讨工资案件：一次劳动争议后，Enpal 支付了 €8,500 欠款。德国 Supply
              Chain Due Diligence Act（LkSG）增加了合规层，要求 Enpal 审计整个安装网络的承包商劳动实践。消费者保护法带来进一步暴露：Verbraucherzentralen
              警告客户关注长合同期限、取消复杂性和不透明的总成本披露；截至 2025 年中，多家律所正代表 Enpal 客户准备合同取消案件。
