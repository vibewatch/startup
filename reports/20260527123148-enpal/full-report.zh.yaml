      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 有条件跟踪：等待三道证据门槛
            body: >
              现有证据支持有条件跟踪立场。若没有经审计的 2025 年 EBITDA 确认、更新估值标记（2023 年 1 月之后）和 ABS 契约条款披露，不应以高于 EUR 3B 企业价值投资。以不高于 EUR 2
              billion 企业价值进入，相当于以低于 2x 2025 年收入买入 Enpal，较 Sunrun 公开市场 EV/Revenue 倍数折价超过 60%；若三道证据门槛通过，上行空间可观。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV043
              - CV044
          - type: callout
            title: 估值下调轮风险实质存在：2025 年证据必要但不充分
            body: >
              2025 年 4 月 EUR 110 million 股权融资未披露估值，叠加 2024 年约 EUR 50 million 经营亏损，形成一个可信情景：新的估值标记可能低于 2023 年 1 月 EUR 2.2
              billion 参考值。这与 2026 年更广泛的后期估值下调轮趋势一致。2025 年经营自由现金流转正令人鼓舞，但并不充分：必须通过独立审计确认 EBITDA 和现金转换，才能排除估值重置风险。
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV024
              - CV032
              - CV033
          - type: callout
            title: ABS 模式既是竞争优势，也是集中风险
            body: >
              Enpal 的 ABS 证券化模式把客户合同放入表外 SPV，并由 Barclays、Bank of America、CPP Investments
              等支持，这是业务中最具运营创新性的部分，也让资本部署达到单靠股权的同业无法企及的规模。但这种模式把信用和再融资风险集中到一个契约条款未公开披露的结构里。如果 ABS 市场利差较 2024 年水平扩大 100 到
              200 个基点，再融资成本上升将压缩利润率，并可能伤及支撑整个增长论点的平台经济性。
            calloutType: insight
            claimRefs:
              - CV012
              - CV013
              - CV035
