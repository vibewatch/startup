            title: 20 年租赁创造结构性留存，SaaS 式流失指标无法捕捉
            body: Enpal 的已安装基础受到实物硬件锁定、20 年合约期限，以及太阳能、储能、wallbox 和热泵多产品捆绑保护。切换不是年度续约决定，而是一次物流和财务事件，大多数住宅客户不会承担。
