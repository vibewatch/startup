      - number: '5.2'
        title: 运营架构与技术平台
        blocks:
          - type: paragraph
            body: >-
              Enpal 的技术层位于物理硬件栈（组件、逆变器、电池、热泵、wallbox）和面向客户的 app 之间。EnpalBox 是本地 IoT 边缘设备，通过 Modbus/TCP 和 MQTT
              协议汇聚家庭内所有能源资产的数据，每户提供 100+ 个实时数据点（太阳能发电、电池 SoC、热泵温度、电网输入 / 输出、wallbox 状态）。盒子通过 LTE/Ethernet 与 Enpal
              云端通信。云端方面，Enpal 首席架构师确认，公司采用 MongoDB Atlas 作为“热存储”时间序列层；单个 M30 集群可支撑最多 100,000 台设备，年成本约 €6,600，Enpal
              团队称其极具成本效益。开源 Home Assistant 集成（github.com/derolli1976/enpal，200+ stars）暴露了 EnpalBox 的本地 API，说明盒子运行有文档的本地
              REST 接口。2025 年，Enpal 将 IoT 盒操作系统迁移到新平台，支持更高自动化和第三方集成。

              Enpal 消费者 app（iOS 版本 1.32.0，2026 年 5 月发布；Android 100,000+ 下载）提供实时发电监控、历史趋势分析和远程 EV 充电控制。App Store 列表显示最低
              iOS 15.0；截至 2026 年 5 月，4,456 个评分的平均分为 4.2/5。负面 app 评价提到 app 与 EnpalBox 间歇性连接问题，以及偶发数据展示缺口，指向边缘层可靠性不足。

              VPP 层面，Enpal 与 AI 交易专家 Entrix 于 2024 年 1 月成立 Flexa 合资公司（Enpal 持控股权）。Flexa 在五分钟连续日内市场上交易家庭电池（不同于早期 VPP
              提供商使用的日前市场），让套利周期更频繁：现货价格低或为负时充电，高峰价格窗口放电。到 2025 年 12 月，系统达到 10,000 个参与家庭、400 MW 聚合容量。Enpal 自有新闻稿称，完整的
              80,000+ 客户基础是最终扩展目标。gridX 播客中，Enpal 的 Dr. Wolfgang Gründinger 将其架构描述为“能源转型中的
              Apple——把顺滑技术与完全连接的生态系统结合起来”，强调垂直整合而非开放标准。
