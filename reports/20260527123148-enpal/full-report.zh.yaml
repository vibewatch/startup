      - number: '3.2'
        title: 直接的数字原生同业——1Komma5° 与 Zolar
        blocks:
          - type: paragraph
            body: >-
              1Komma5°（汉堡，2021 年成立）是 Enpal 最接近的直接同业，也是最重要的竞争威胁。公司 2024 年报告收入 €520M（2023 年为 €450M），在 7 个市场的 80 个站点雇佣约
              ~2,500 人，并在 2025 年 7 月完成 €150M pre-IPO 轮，使总股权融资达到约 ~€400M（无债务）。它的差异化资产是 Heartbeat AI，一个能源管理和虚拟电厂（VPP）平台；截至
              2025 年 11 月，该平台已向数百万既有非 1Komma5 系统开放。平台管理 500 MW 灵活容量，覆盖约 ~50,000 个接入系统；1Komma5 目标到 2030 年达到 20 GW。与 Enpal
              相比，关键战略差异在于：1Komma5 收取固定软件费，并把市场交易收益传递给客户，而不是作为能源供应利润留存。这种开放生态、收益传递模式，与 Enpal 封闭的 Enpal.One+
              结构性不同，可能对庞大的存量改造细分更有吸引力。创始人 Philipp Schröder 曾称 Kraken（Octopus Energy 技术平台）是 Heartbeat AI 最接近的竞争对手，而不是
              Enpal 的 VPP——这种表述把 1Komma5 定位成软件公司，而不是主要定位成安装商。1Komma5 当前订单中太阳能占比低于 50%，热泵、电池和 EV 充电构成其余部分，轨迹与 Enpal
              自身多元化相似。Zolar（柏林，2016 年成立）累计从 Partech、AENU 和 Energy Impact Partners 等 VC 融资约 ~€300M，收入从 €41M（2022 年）增至
              €86M（2023 年），随后录得 €24M 净亏损。面对消费需求急剧下降和融资成本上升，Zolar 于 2025 年 7 月启动自主管理下的破产程序，并从 D2C
              安装转向向本地安装商销售软件和配置工具，员工数从约 ~400 人降至 ~50 人。Zolar 崩盘是一条反向证据：在需求常态化的德国市场，若没有轻资产融资和自有软件，D2C
              太阳能安装商模式无法在规模上实现经济可持续。
