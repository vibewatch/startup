      - number: '7.5'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              Enpal 由创始人 Mario Kohle 主导，他与 Viktor Wingert（同时担任 CFO）和 Jochen Ziervogel
              共同创立公司。创始三人组掌握叙事权、投资人关系和资本市场信誉，形成关键人风险：包括 Barclays、Bank of America、Citi、Crédit Agricole 在内的 ABS 投资人群体，已直接与
              Kohle 和 Wingert 建立关系；一旦创始团队连续性中断，冲击会发生在 Enpal 仍需要为每一批新增安装进入 ABS 市场再融资的阶段。关键人之外，Enpal
              的销售文化也构成结构性执行风险。公司的地面销售团队主要按签约合同拿提成，独立分析和消费者投诉都把这种机制与系统装机过大、节省测算误导、施压式销售联系在一起，长期满意度因此受损。毛利中超过 60%
              流向销售佣金之后，公司能投向服务基础设施、软件可靠性和客户成功的空间就有上限。热泵转向是第三个执行风险：公司 2024 年安装 4,300 台热泵，2023 年为 600 台，增长轨迹达到
              7×；但热泵服务的技术问题尾部比光伏更长，各州监管审批流程不同，合格劳动力也稀缺。多元化是降低光伏周期性的正确战略方向，但一边处理存量服务积压和劳动法危机，一边执行复杂产品线切换，工作负荷异常高。德国市场集中度高（约占收入
              90%+），意味着德国住宅市场只要出现宏观、政治或天气驱动的走弱，Enpal 的增长轨迹就会立刻承受未分散的冲击。
