      - number: '3.4'
        title: 供暖垂直赛道——Thermondo 与相邻替代方案
        blocks:
          - type: paragraph
            body: >-
              Thermondo（柏林）是德国最大的热泵安装商，已安装超过 50,000 套供暖系统（包括 9,000+ 台热泵），员工超过 1,000 人，投资者包括 Brookfield、Future Energy
              Ventures、HV Capital、Vorwerk、Rocket Internet 和 10x。2024 年 4 月，Thermondo 收购光伏供应商 FEBESOL，把产品延伸到屋顶太阳能。2025 年
              7 月，Thermondo 获得 €50M SPV 支持贷款融资，用于让约 ~1,600 户家庭通过 15 年分期计划（thermondo flex）安装热泵；补贴后月付款可能低于 €100。这种分期 /
              融资模式在结构上类似 Enpal 自己的零首付产品，也说明 Thermondo 正从供暖侧向 Enpal 的热泵细分靠拢。Enpal 在 2023 年安装 600 台热泵，2024 年安装 4,300 台；截至
              2025 年，热泵约占 Enpal 核心业务收入三分之一。因此，供暖垂直竞争正在加剧：Thermondo 在 Handwerker 和燃气锅炉替换细分拥有分销深度，而 Enpal 正在补齐这块能力。Enpal
              热泵在补贴和融资后起价 €7,800；Thermondo 补贴后起价 €9,000，说明 Enpal 价格具备竞争力。两家公司都在与传统供暖 Handwerker 替换燃气锅炉这一默认现状竞争；对 2025
              年多数正在更换供暖系统（Heizungstausch）的德国家庭来说，这仍是主导选择。
            claimRefs:
              - CP019
