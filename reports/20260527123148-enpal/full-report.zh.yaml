  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价结构
        blocks:
          - type: paragraph
            body: >
              Enpal 的主要收入引擎是一份 20 年租赁合同：公司在客户家中安装、拥有并维护分布式能源资源（DER），并收取固定月费。客户无需承担前期资本成本；他们支付经常性租金，覆盖整个 20
              年期间的安装、维护、监控和保险。合同到期时，资产无需额外成本转移给客户。这一模式在组合层面产生稳定、长周期的经常性现金流，但经济性高度资本密集：Enpal
              必须通过特殊目的载体（SPV）和资产支持证券（ABS）仓储融资为每次安装预融资，因此相对报告收入，业务承担了可观的资产负债表杠杆。


              截至 2025 年，月度标价从紧凑型太阳能 PV 系统（约 ~4 kWp）的约 €59/month，到大型系统（约 ~10 kWp）的 €120–140/month 不等。电池储能、EV
              充电墙盒和智能计量可作为按月增量加入。热泵可作为附加或独立产品纳入同一租赁框架，但价格未公开披露。灵活消费者贷款产品（Enpal EasyFlex）于 2023 年推出，用于服务偏好拥有资产而非租赁的客户。


              收入确认遵循经常性收费模式：月度租金收入按每个期间确认。Enpal 热泵部门于 2023 年启动，到 2025 年已增长至约占核心细分收入三分之一（以 €1.1B+ 基数计算，约 €367M）。太阳能 PV
              租赁流仍是主要驱动力，而电池、智能电表和 EV 充电收入正在增长，但没有作为单独项目披露。重要的是，ABS 仓储结构让太阳能合同现金流经由 SPV 流转，在 Enpal 运营公司现金流和 SPV
              层级资产现金流之间形成切分，进而增加合并自由现金流分析难度。
