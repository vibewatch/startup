  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础横跨三个不同细分：直接住宅客户、安装商合作伙伴和商业客户
        blocks:
          - type: paragraph
            body: >-
              Enpal 的收入客户基础主要是德国和意大利的直接住宅业主。2026 年 1 月新闻稿和 2025 年 7 月 资料页都确认，截至 2025 年底，公司在德国和意大利服务超过 115,000 个家庭，并有超过
              300,000 个分布式能源资源（DER）接入 Enpal 平台。核心产品是一体化套餐——光伏系统、电池储能、EV wallbox、智能电表和热泵——按 20
              年租赁或灵活购买融资销售。该细分内部还可进一步拆分：（a）2019 年起进入平台的纯太阳能或太阳能 + 储能客户；（b）2023
              年开始新增的热泵客户，如今约占核心业务收入三分之一；（c）持有多条产品线的交叉销售采用者。地理集中度跟随自住房密度：Enpal 2025 年 8
              月新闻稿指出，北莱茵-威斯特法伦、巴登-符腾堡、下萨克森、巴伐利亚和黑森是安装最集中的五个德国州。


              第二个细分是安装商合作渠道 Enpal.pro，由联合创始人 Lukas Pauly 于 2023 年推出。Enpal.pro 是 B2B2C 平台，区域 PV 和 SHK
              安装商可通过它获得材料物流、规划工具、融资方案、客户线索、智能电表运营和并网支持。PV Magazine 2025 年 3 月报道称，Enpal
              打算把安装商合作作为未来商业模式的核心支柱，这是一次重要战略再定位。


              第三个细分是商业与工业（C&I），2024 年 4 月推出，首个具名安装为 Golf Valley München 的 250 kWp 屋顶系统。2025 年 7 月资料页确认 C&I
              是活跃且增长中的产品线，但除 Golf Valley 试点外，公开信息未披露客户数量、收入贡献或具名参考客户列表。
