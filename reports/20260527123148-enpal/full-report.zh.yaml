  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 论点
      - 支撑证据
      - 改变观点的条件
    rows:
      - - 市场领导地位：欧洲住宅太阳能
        - DE+IT 客户 115,000+；按收入计为欧盟最大安装商
        - 市场份额持续流失给 1KOMMA5 或新进入者
      - - 收入规模与恢复：2025 年 EUR 1.1B
        - 较上年增长 25%，从 EUR 860M 起；首次实现正经营 FCF
        - 2025 年 EBITDA 审计显示亏损，或 2026 年增长低于 15%
      - - ABS 资本创新：承诺额超过 EUR 5B
        - 欧洲住宅太阳能 ABS 先行者；Barclays、BofA、CPP 支持
        - ABS 市场收紧，或利率较 2025 基准高出 200 bps 以上
      - - 平台多元化：热泵与家庭能源
        - 热泵约占 2025 年收入三分之一；完整家庭能源组合
        - 热泵采用率崩塌，或竞争对手在集成执行上胜出
      - - 相对上市可比公司的估值折价
        - 约 2x 收入，低于 Sunrun/Enphase 的 5–6x；私营市场折价
        - EBITDA 结构性为负，或行业倍数永久压缩
      - - 收入有规模，2024 年仍经营亏损
        - 2024 年经营亏损约 EUR 50M；收入较 2023 年峰值下降 5%
        - 2025 年经审计 P&L 显示 EBITDA 转正且利润率改善
      - - 2025 年估值标记未披露
        - 2025 年 4 月融资未披露估值；EUR 2B+ 阶段并不常见
        - 新的公开标记估值达到或高于 EUR 2.5B，并有独立验证
      - - 德国集中：收入占比超过 90%
        - 单一市场风险；补贴波动；监管不确定性
        - 意大利、法国或波兰收入成功爬坡，占比超过 15%
      - - ABS 契约不透明
        - 公开 ABS 条款未披露；契约违约风险未知
        - 尽调中可取得完整契约包
      - - 同业失败：Sunnova 2026 年破产，SunPower 2025 年破产
        - 利率上行时，资本密集型太阳能安装商可能迅速失败
        - Enpal 在收紧环境下证明 ABS 可续作
    notes: |
      投资逻辑和反向逻辑各行是基于公开证据的分析判断。改变观点的条件是假设层面的条件，不是已确认预测。第 1–5 行支持投资逻辑；第 6–10 行支持反向逻辑。
