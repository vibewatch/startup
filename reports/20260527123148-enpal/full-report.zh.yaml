          - type: callout
            title: 智能电表技术领先提供了部分监管对冲
            body: >-
              德国 2025 年光伏控制法要求所有新装系统配备 BSI 认证智能电表和智能控制单元。Enpal 作为德国最大的竞争性计量点运营商，已经让大多数客户达到这一标准，并部署 Enpal.One AI
              manager，避免未受控系统会触发的 60% 输出限发。小型竞争对手需要多年才能复制这种真实的先发优势。
