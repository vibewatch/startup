      - number: '2.2'
        title: 市场规模：TAM、SAM 与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              测算德国住宅家庭电气化市场，需要叠加多种视角，而不是依赖单一自上而下的分析师数字。最宽的视角是潜在可寻址建筑存量：德国约 16.2 million 栋单户和两户住宅构成原始理论 TAM。以 10 kWp 系统加
              10 kWh 储能的平均安装成本约 €14,000（2026 年市场价格，0% VAT）计算，多十年更换周期里的一次性设备 TAM 约 €180–230 billion；如果按当前每年约
              400,000–600,000 套新增安装节奏折算，年支出约 €8–12 billion。

              加上热泵（平均系统成本约 €15,000–25,000；2025 年售出 ~299,000 台，估计市场价值约 ~$680 million USD）和 EV 充电墙盒，2025 年德国年度综合家庭电气化 TAM
              估计为 €10–15 billion；受储能加速（2026 年 Q1 储能新增同比增长 67%）和热泵恢复驱动，2026 年有望增至 €12–18 billion。S&P Global 和 Mordor
              Intelligence 分析师称，德国整体太阳能市场将以 ~6% CAGR 到 2031 年从 ~$X 增至 ~$X；但供应商发布的 TAM 数字常把住宅、商业和公用事业细分混在一起，未做清晰拆分。

              SAM（可服务市场）要小得多。屋顶适配性研究显示，60–70% 的单户住宅具备技术可行屋顶，可寻址存量降至约 10–11 million 户。截至 2025 年底，各类细分尺寸合计渗透约 5 million
              套系统，剩下约 5–6 million 户家庭构成核心未渗透 SAM。按当前平均系统价值，仅太阳能和储能的年度 SAM 机会约为 €6–9 billion。德国 2030 年 215 GW 太阳能装机目标（对比
              2025 年底约 ~117 GW）意味着四年新增约 ~98 GW——每年约 25 GW，而 2025 年运行率为 16.2 GW，需要市场显著扩张。

              相互矛盾的估计确实存在：Fraunhofer ISE 报告 2025 年净新增容量为 16.2 GW，而 BSW-Solar 自己的事实表（包含预期迟到登记）显示总新增 17.5 GW。IndexBox 引用
              BSW 的 2026 年 Q1 整体市场 3.51 GW（下降 6%），而 pv-magazine 2026 年 1 月标题仍在引用 2025 全年 17.5 GW。这些差异反映的是总额 vs. 净额口径，以及
              Marktstammdatenregister 中迟到登记滞后，并不是底层趋势本质不同。
