  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反方论点与建议
        blocks:
          - type: paragraph
            body: >
              Enpal 在欧洲气候科技独角兽中位置少见：它拥有 EUR 1.1 billion 年收入（2025），在德国和意大利住宅光伏安装市场占据主导，并率先跑通 ABS 模式，已撬动总融资承诺超过 EUR 5
              billion。这些结构性优势构成投资论点的核心：公司以规模化市场领导地位，叠加覆盖完整家庭能源栈（光伏、储能、热泵、EV 充电）的直销和服务平台，具备一定防御性。

              反方论点同样扎实。公司 2024 年收入接近 EUR 900 million，却录得约 EUR 50 million 经营亏损；2025 年也只是首次报告正经营自由现金流（不是 EBITDA）。TPG Rise
              Climate 再次领投的 2025 年 4 月 EUR 110 million 股权融资没有披露估值，这在该规模交易中并不常见，说明投资人对在更保守利率环境下确认 2023 年 1 月约 EUR 2.2
              billion 估值持谨慎态度。补贴波动（Enpal 曾公开批评德国 Resilienzbonus，并在 2024 年考虑减少国内投资）、德国地域集中度，以及契约条款未披露的复杂 ABS
              结构，也进一步压低估值信心。

              建议采取低至中等信心的有条件跟踪立场，等待三道证据门槛：(1) 2025 年经审计 EBITDA 确认，(2) 更新后的股权结构估值标记或二级市场参考，(3) EUR 1.1 billion ABS
              融资的契约条款和现金流瀑布披露。若投资人以不高于 EUR 2 billion 企业价值进入，相当于用低于 2x 2025 年收入买入 Enpal，较 Sunrun 当前公开市场 EV/Revenue 倍数折价超过
              60%；如果盈利叙事得到验证，上行弹性有吸引力。
