  summary: >-
    Enpal 由 Mario Kohle、Viktor Wingert 和 Jochen Ziervogel 于 2017 年在柏林创立，已经从 solar-as-a-service
    初创公司长成欧洲最大的住宅脱碳平台之一。公司把屋顶光伏、电池储能、充电墙盒、热泵、智能电表和 Enpal.One+ 能源管理层打包进同一个业主关系，资金来自股权以及大规模表外 ABS 和仓储融资设施。到 2025 年底，Enpal
