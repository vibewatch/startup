      - number: '6.4'
        title: 扩张与集中风险结构上可见，但披露不足
        blocks:
          - type: paragraph
            body: >-
              Enpal 的落地扩张逻辑依靠已安装基础内的产品交叉销售：给太阳能客户加装热泵或 wallbox，让家庭加入 metrify 智能电表服务，或把电池接入 Enpal.One+ AI
              能源交易平台。每新增一个产品，切换成本都会加深，也会为虚拟电厂生成更多数据。2024 年 10 月新闻稿称，€5 billion 融资承诺可支持 500,000+ 个 DER 安装和 3 GW
              容量，意味着相对当前 115,000 户家庭基础仍有显著扩张空间。


              Enpal.pro 安装商合作渠道同时带来扩张机会和渠道依赖风险。机会在于，Enpal.pro 把 Enpal
              无法直接规模化服务的家庭纳入触达范围，把供应链、规划工具、融资和智能电表运营授权给区域安装商。风险在于，如果大多数产生毛利的项目转向 Enpal.pro 合作伙伴，Enpal
              的经济性将依赖平台抽成，而不是直接持有合同——这是结构上不同的留存和利润率画像。


              地理集中度高：德国是主导市场，截至 2025 年中，意大利是唯一其他活跃地区。2024 年欧洲户用太阳能收缩
              20%，家庭资本项目的宏观环境也有挑战，意味着德国市场状况是新增客户量的主要风险杠杆。来自机构融资交易对手的收入——支持 SPV 的 BlackRock、ING、Barclays、Bank of
              America、Citi 和 Crédit Agricole CIB——代表资本市场层面的另一种交易对手集中，而不是家庭层面的集中。单个家庭收入天然分散在 115,000+ 个账户中，缓解了单一账户集中度。
