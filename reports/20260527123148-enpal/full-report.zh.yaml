      - number: '6.3'
        title: 结构性留存强；安装后服务质量是已有记录的软肋
        blocks:
          - type: paragraph
            body: >-
              租赁模式的结构性留存，是 Enpal 最有防御性的客户指标。业主一旦签下 20
              年租赁并完成硬件安装，就面临高切换成本：实物拆除、屋顶修复、合同终止，以及失去持续维护和保险。每增加一条产品线——热泵、wallbox、metrify 智能电表——这些成本都会加深。EUPD Research
              研究把能源耦合作为头部安装商的关键竞争差异化。


              安装后服务体验是公开记录中最清晰的反向信号。gruenes.haus 分析 2025 年 2 月至 7 月的 2,500 条 Trustpilot
              评价后发现，安装前咨询和安装本身持续获得称赞，但交付后投诉同样持续：热线难以接通、技术故障解决慢、难以拿到电网馈电补偿，以及被抛下的感受。Diebewertung.de
              记录了具体失败模式：因未向电网运营商提交必要文件导致安装数月无法上线、分包商质量缺陷、激进的重复电话销售策略，以及不透明定价。


              最尖锐的反向分析来自 Prof. Dr. Christoph Ph. Schliessmann 2025 年 5 月的独立战略评估。该评估估计，Enpal 的 PV 客户中 14% 产生了 66%
              的支持工单；销售佣金吸收超过 60% 毛利；计量点运营商 Inexogy 提起诉讼，称约 €0.9 million 未付发票涉及据称未经授权的电表安装。这些都是二手来源主张，不是经审计披露。Enpal 2026
              年 1 月新闻稿明确表示计划投资深化长期客户关系——这一表述意味着管理层意识到留存挑战。公开信息中没有 NRR、GRR、正式流失率或队列层面留存数据。
