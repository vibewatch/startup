      - number: '7.2'
        title: 运营与服务质量风险
        blocks:
          - type: paragraph
            body: >-
              Enpal
              的经营模式在销售端资本轻——客户无需预付款——但后端执行很重：公司必须安装、调试、接入智能计量系统，然后在多年合约内维护不断扩大的住宅能源资产池。这个模式只有在安装能力、软件可靠性和现场服务覆盖随销售同比例扩张时才成立。多个独立来源的证据显示，这些比例在
              2023–2024 年明显滑落。CPS Schliessmann 战略分析发现，Enpal 约 90,000 名 PV 客户中 14% 产生全部服务工单的
              66%，说明失败模式集中，而不是摩擦广泛分散。Reklamation24 列出 500 多件正式投诉，投诉解决率低于 40%；消费者评价聚合器记录了延迟安装、错误电表设置、app
              和软件故障，以及激进或误导性销售策略等模式。基础设施合作伙伴 Inexogy 发起的计量相关法律纠纷——主张近 €900,000
              未付发票，并指称未经授权的电表安装——为这幅运营摩擦图增加了第三方可信度。热泵扩张放大执行风险，因为热泵安装比屋顶 PV
              技术要求更高：需要持证供暖工程师、建筑内部管路集成，以及因市镇而异的并网文件。德国技术工种短缺让快速扩张这支劳动力变得困难；从拉美劳动力池招聘——Enpal 已在 PV
              业务中使用过这一路径——也引发了上一节所述劳动法审查。如果现有 100,000 客户太阳能资产池的服务积压又被热泵导入问题叠加，公开数据中已经可见的工单集中度会进一步陡化。
