      - number: '3.3'
        title: 公用事业巨头——E.ON Solar 与公用事业渠道
        blocks:
          - type: paragraph
            body: >-
              E.ON Solar 是德国住宅 PV 细分中资源最充足的现有竞争者，并在 EUPD Research Market Leadership Study 中与 Enpal 和 1Komma5 并列。E.ON
              以透明固定价提供交钥匙太阳能套装：Paket S（4 kWp + 5.12 kWh 电池）€11,999 起；Paket M（9.86 kWp + 7.7 kWh 电池）€16,999 起；Paket L（13
              kWp + 10 kWh 电池）€19,999 起。每个套装都包括 E.ON Home Energy Manager、10 年产品和性能保修，以及通过 E.ON 合作伙伴网络管理的安装。E.ON
              的竞争优势包括来自公用事业背景的品牌信任、既有住宅客户关系基础，以及全国安装商网络。相对 Enpal，它的限制是没有同样的租赁 / 零首付模式；E.ON 套装要求预付款或消费者融资。RWE 和
              Vattenfall 尚未建立可比的住宅 PV 零售位置，主要聚焦公用事业规模发电，因此截至 2026 年在住宅细分中不构成实质竞争威胁。德国太阳能行业组织（BSW Solar /
              Solarwirtschaft）指出市场高度分散：截至 2025 年 4 月，全国已安装超过 5 million 个太阳能阵列，总容量 104 GWp，绝大多数由区域 Handwerker
              安装，而不是前三家全国玩家。Enpal 与 E.ON 的主要渠道竞争，发生在那些想要全国品牌、端到端托管方案，同时有资本进行前期购买、无需租赁的业主群体。E.ON 通过 Home Energy Manager
              进入 HEMS（Home Energy Management System）空间，创造了扩展软件锁定效应的潜在路径，类似 Enpal.One+。
