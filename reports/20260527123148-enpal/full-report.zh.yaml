  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与结构
        blocks:
          - type: paragraph
            body: >-
              Enpal 经营的是德国住宅家庭电气化市场，广义上包括私人住宅分布式能源资产的安装、融资和服务。核心可寻址支出包括屋顶光伏（PV）系统（单户住宅通常为 5–20 kWp）、配套电池储能（5–15
              kWh），以及越来越多与同一家庭能源栈相邻的热泵和 EV 充电墙盒。核心范围不包括公用事业规模和商业 / 工业屋顶太阳能（30 kWp 以上）、地面电站，以及公共 EV
              快充基础设施。现状替代方案是家庭只从电网购电，按标准零售电价支付（2026 年平均约 ~€0.30–0.35/kWh），并用燃气或燃油锅炉供暖。

              德国是欧洲最大的 PV 市场，约有 16.2 million 栋单户和两户住宅。截至 2025 年底，超过 5 million 个 PV 系统在运（所有细分累计装机容量 116.8 GW），其中 30 kW
              以下住宅屋顶约占 38 GW。电池储能增长很快：BSW-Solar 报告，截至 2026 年初累计储能容量为 26 GWh，其中 82% 在住宅安装中。热泵相邻市场真实且在增长——2025 年德国售出
              299,000 台住宅热泵，占所有新供暖系统的 48%。EV 充电墙盒需求正随整体 EV 市场加速；德国 EV 充电基础设施市场 2025 年估计约 $1.36 billion，预计 2026 年达到 $1.75
              billion，其中住宅安装增长最快。

              关键结构边界包括：30 kW 以下住宅细分（Enpal 主战场）受 EEG 上网电价制度、2023 年以来硬件和安装 0% VAT、KfW loan 270（有效年利率 3.73%
              起）以及欧盟国家援助框架约束；该框架已推迟 Solarpaket I 中部分更高档位电价上调。热泵相邻支出受 Building Energy Act（GEG/Gebäudeenergiegesetz）和 KfW
              subsidy programme 458 管辖。充电墙盒仍需缴纳 19% VAT（不同于 PV 硬件），因此自然捆绑经济性略受限制。
            claimRefs:
