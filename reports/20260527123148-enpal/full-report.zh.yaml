      - number: '8.3'
        title: 融资结构、情景和敏感性
        blocks:
          - type: paragraph
            body: >
              按欧洲标准看，Enpal 的资本结构多层且非常规。所有轮次披露交割的股权融资总额约 EUR 325 million，投资人基础由 SoftBank Vision Fund II（EUR 130
              million，Series C，2021 年 10 月）、TPG Rise Climate（领投 2023 年 1 月 EUR 215 million Series D 和 2025 年 4 月 EUR 110
              million 增长轮）、Activate Capital、The Westly Group，以及 2022 年 12 月结构化再融资中的早期金融基础设施投资人 BlackRock
              Alternatives、ING、UniCredit、Pricoa Private Capital 锚定。截至 2024 年 10 月，公司总融资承诺已超过 EUR 5 billion，绝大多数通过 ABS /
              仓储融资设施安排。

              ABS 模式把客户光伏租赁和所有权合同放入表外 SPV，让 Enpal 能以低于股权的利率货币化来自家庭业主的长期经常性现金流，但也让公司同时暴露在信用市场收紧和基准利率上行之下。2024 年 3 月
              Barclays Europe、Bank of America、Credit Agricole CIB 提供、CPP Investments 参与夹层的 EUR 1.1 billion ABS
              融资，是主要结构性工具。其契约条款和现金流瀑布并未公开披露，这是评估下行情景的关键尽调缺口。

              模型包含三种投资情景。牛市情景（约 25% 概率信号）假设 Enpal 到 2028 年进入四个或更多欧洲市场，持续 EBITDA 利润率超过 10%，并受益于 ABS 市场向美国先例深化；按 EUR 1.8
              billion 收入 3.5x 倍数计算，隐含估值超过 EUR 6 billion。基准情景（约 50%）假设德国和意大利守住，EBITDA 到 2026 年转为结构性盈利，倍数稳定在 EUR 1.5
              billion 收入的约 2.5x；隐含估值约 EUR 3.75 billion。熊市情景（约 25%）假设 2025 年 FCF 不能在 2026 年复制，ABS 再融资收紧，收入停滞在 EUR 1.0 到
              1.1 billion，倍数压缩至 1.5x；隐含估值约 EUR 1.5 到 1.65 billion，较最近披露估值构成实质性估值下调轮。
