  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Enpal 的供应链、融资结构和产品平台如何连接起来，产生硬件收入、经常性收入和平台价值，并标出关键风险节点。
    data:
      nodes:
        - id: supply
          label: 深圳供应链中心
          detail: 对 PV 面板、电池、热泵和 wallbox 直接采购硬件；2020 年开设。相较依赖分销商的竞争对手，带来成本和供货优势。
          tone: positive
        - id: install
          label: 自有安装商网络
          detail: 1,000+ 名自有安装人员和电工；Dahlewitz Academy 培训第三方伙伴。安装垂直整合降低质量波动，也积累客户信任。
          tone: positive
        - id: finance
          label: 表外融资账簿（>€5B）
          detail: 客户贷款和租赁合同通过银行出资的特殊目的载体再融资。在不消耗股权资本的情况下支持零首付方案。
          tone: positive
        - id: platform
          label: Enpal.One+ AI 能源平台
          detail: 整合太阳能、电池、热泵、wallbox 和智能电表；通过 VPP（与 Entrix 的 Flexa 合资公司）优化能源交易。这是经常性收入策略的骨干。
          tone: positive
        - id: recurring
          label: 经常性收入流
          detail: 电价产品（16ct/kWh）、智能电表费用（Metrify）、维护包和 VPP 交易收入。Metrify 2025 年剥离后，经常性收入增长约 70%。
          tone: positive
        - id: risk_service
          label: 安装后服务风险
          detail: Trustpilot 评分呈双峰分布（4.0–4.2/5，27K+ 评论），Stiftung Warentest 也提示注意事项，说明经常性服务缺口会威胁客户留存和转介绍。
          tone: warning
      edges:
        - from: supply
          to: install
        - from: install
          to: platform
        - from: finance
          to: install
        - from: platform
          to: recurring
        - from: risk_service
          to: recurring
    approximationNotes: null
    claimRefs:
