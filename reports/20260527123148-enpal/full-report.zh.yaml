      - number: '1.4'
        title: 融资历史、资本结构与估值
        blocks:
          - type: paragraph
            body: >
              Enpal 拼出了一套由两部分组成的资本结构：风险投资和成长型投资者提供的股权，用于运营和增长 capex；另一部分是规模庞大的表外债务账簿，用于支持租赁和购买贷款产品背后的长期消费者融资。

              股权端，公司在早年获得未披露金额的种子轮及后续早期轮融资，投资方包括 SoftBank Vision Fund II、HV Capital、Picus Capital、Team Europe 和
              Princeville Climate Technologies。到 2021 年，这些轮次支撑的估值已超过 $1 billion，使 Enpal 成为独角兽。2023 年 9 月，Enpal 完成约 €215
              million 的 Series D，由 TPG Rise Climate 领投，投后估值约 €2.2 billion（当时约合 USD $2.35 billion），The Westly Group 和
              Activate Capital 也加入。这一轮由 Reuters 报道，并得到 Enpal 确认。2025 年 4 月，Enpal 又融资 €110 million，仍由 TPG Rise Climate
              领投，The Westly Group、Ontario Power Generation Pension
              Fund（OPG）和一家未具名的欧洲领先保险集团作为新投资者参投。该轮被描述为一周后即显著超额认购。Enpal 拒绝披露 2025 年融资估值，因此最后一个确认估值仍是 2023 年 9 月的 €2.2
              billion。根据 2025 年 7 月事实表，累计股权融资超过 €600 million。

              债务账簿明显更大。2022 年 12 月，Enpal 从 BlackRock Alternatives、ING、Pricoa Private Capital、UniCredit 和 Infranity 获得
              €855 million 债务再融资。2024 年，公司又与 Barclays Europe、Bank of America 和 Crédit Agricole CIB 安排一笔新的 €1.1 billion
              债务融资设施，让 Enpal 能在不稀释股权的情况下继续大规模提供零首付客户融资。公司事实表显示，其融资解决方案的总再融资承诺超过 €5
              billion，远高于股权基础，也凸显资产负债表的财务复杂度。契约条款、资产质押结构、追索权安排，以及客户融资的具体载体结构，公开资料均未描述，需要数据室审阅。
