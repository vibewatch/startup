  - id: FU004
    title: 结构性留存代理矩阵
    type: matrix
    summary: Enpal 没有公开队列留存数据。本矩阵为住宅 B2C 细分映射五个维度的结构性留存代理和可用证据质量。单元格是定性评估，不是实测留存率。
    approximationNotes: 所有单元格均为基于引用来源的结构性估计和分析师判断。Enpal 未披露经审计的留存数据。由于 Enpal 不发布 NRR、GRR 或逐期留存百分比，队列类型不适用。
