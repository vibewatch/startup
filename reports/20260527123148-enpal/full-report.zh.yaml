      - number: '3.5'
        title: 切换成本、锁定效应与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Enpal 的主要切换成本机制来自租赁和融资模式：住宅客户通常签署 20 年太阳能和电池系统租赁协议，或多年融资合同。提前终止会带来合同复杂度和潜在财务罚金，形成很强的售后粘性。第二层锁定来自
              Enpal.One+ 能源管理平台，它把太阳能发电、电池储能、EV 充电和热泵连接成家庭能源操作系统。加入 Enpal.One+ VPP 的家庭可从 19 Cent/kWh 起获得电力，并可因提供电网灵活性从
              Enpal 获得最高每年 €2,000 补偿。退出平台意味着失去这些变现流。第三个切换成本是自有智能电表和监控基础设施；转向竞争对手需要更换硬件。尽管存在这些护城河，1Komma5 的 Heartbeat AI
              如今已向既有非 1Komma5 硬件开放；如果 Enpal.One+ 接入可以被绕开，Enpal 客户可能无需更换硬件就接入竞争性 VPP。这是尚未解决的尽调问题。相对本地 Handwerker，Enpal
              的护城河在于分销简单性、全国品牌信任和融资能力；Handwerker 渠道缺乏全国规模、融资基础设施和软件能力。商品化硬件风险真实存在：太阳能组件全球定价，Enpal
              的硬件利润率取决于采购，而不是差异化。因此，持久护城河必须建立在软件、融资和 VPP 规模上。反向证据包括 Enpal 2024 年收入从 €905M 降至 €860M，以及公司在 2024 年 H1
              选择优先投资而非盈利；同期 1Komma5 始终保持运营盈利，并报告更强有机增长。
