      - number: '2.3'
        title: 买方分层与采用动态
        blocks:
          - type: paragraph
            body: >-
              德国住宅太阳能的主导买方画像，是单户或独立两户住宅的自住业主。他们同时是买方（决策者）、用户（消费自发电）和付款方（自掏腰包、通过 KfW 贷款，或通过 Enpal 模式这类租赁 /
              订阅）。预算完全由家庭掌握；没有第三方机构采购，因此市场天然分散，并高度依赖消费者信任。

              第二个细分是多户住宅业主（Mehrfamilienhaus）。其可寻址体量较小，但正通过 EEG 租户电力（Mieterstrom）制度增长。房东向租户直接供应 PV
              电力可获得溢价附加费（Mieterstromzuschlag）；该细分需要更复杂的计量和计费，渗透率仍低。第三个微细分是城市公寓租户，其采用路径局限于阳台光伏（最高 800W 逆变器 / 2 kWp
              面板的即插即用系统）——这是高增长但单户收入低的细分。

              各细分的采用触发点差异很大：自住业主主要受电费节省和能源独立驱动（尤其是 2022 年能源危机后），环境贡献和房产价值是次要动机。典型采用路径需要 6–18
              个月考虑期，常由邻居安装、能源价格冲击或定向数字营销触发。Credence Research 引用的调查数据显示，如果没有补贴，只有 ~40% 的家庭会推进太阳能安装，凸显补贴依赖。

              租赁 / 订阅细分（Enpal 模式）专门瞄准想要太阳能、但不愿前期投入资本的家庭。该细分对月付款水平敏感，而不是对系统总价敏感；因此更暴露于利率变化。安装商主导的现金购买细分按体量占主导（约 60%
              的新增安装），但分散在数千家 SME 安装商之间。

              关键采用约束包括：（1）融资成本——KfW 270 有效利率 3.73%+，让 €20,000 系统每年承担约 €750
              利息；（2）熟练工短缺带来的安装商瓶颈，限制并网时间线；（3）补贴政策不确定性造成需求延后；（4）德国南部太阳能密集区域电网拥塞；（5）有竞争力的中国组件进口压低系统价格，但也挤压安装商利润并导致破产（Zolar
              失去 50%+ 岗位；ESS Kempfle、Fellensiek、Solarmax 均于 2024 年申请破产）。
