      - number: '7.4'
        title: 合作伙伴与供应链依赖风险
        blocks:
          - type: paragraph
            body: >-
              Enpal 的家庭能源平台依赖一组外部关系，且这些关系的失败模式并不独立：硬件供应、ABS 投资者兴趣和电网运营商配合必须同时到位，订阅模式才跑得通。硬件方面，Enpal
              的大容量住宅热泵在中国制造。欧盟对中国太阳能组件的关税制度虽被规模采购优势部分抵消，但欧中贸易紧张升级以及欧盟针对可再生硬件的反倾销措施，带来成本突然上升风险；对于已经签固定价订阅的客户，这些成本无法转嫁。中国制造商在热泵供应链中的主导程度甚至高于
              PV 面板，替代性欧洲来源有限。资本端，M&G 是 Enpal €700M ABS 额度的核心仓储融资伙伴，EIB 和 EIF 为证券化项目中的部分分层提供担保。单一机构锚定方集中，若 M&G
              在续期点改变条款或退出，会造成再融资脆弱性。更广泛的欧洲户用太阳能贷款 ABS 市场仍处早期——Enpal 的 “Golden Ray 1”
              是欧洲首单户用太阳能证券化——二级市场流动性薄，压力情景下资产处置或组合重组可能成本高昂。计量基础设施方面，Enpal 依赖电网运营商和 DSO 提供连接性，Enpal.One
              虚拟电厂交易才能成立；任何针对计量接入权、智能电表互操作标准或去中心化资产电网费结构的监管变化，都可能扰乱 Enpal 作为差异化卖点呈现的能源交易收入。
