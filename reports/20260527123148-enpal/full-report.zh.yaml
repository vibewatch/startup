      - number: '5.5'
        title: 信任、安全、安保、隐私与质量控制
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Enpal 持有两项主要质量认证。第一项是 VDE “Standardized PV Power Plant” 证书（2023 年 7 月颁发，2024 年由 VDE
              Renewables GmbH 续期），使 Enpal 成为德国首家获得户用屋顶安装该证书的公司。VDE 审查覆盖完整流程，包括规划、工程、物流以及每个区域分支的 Elektromeister
              质量监督结构。第二项是 TÜV Saarland 客户满意度认证（证书号 SC46217），评级为“Gut”。获奖页面还列出另外两项 VDE 认证（2023 年，格式未说明）、Chip Testsieger
              2025（总体“gut”）以及公司连续赢得 Die Welt Service-Champion 排名（2023、2024、2025）。

              数据隐私方面，Enpal app 的 App Store 列表披露，“联系信息”会关联用户身份，“标识符”和“诊断信息”会被收集但不关联身份。公司网站包含标准 DSGVO（GDPR）隐私政策。没有公开披露 ISO
              27001、SOC 2 或类似信息安全认证；从企业或监管尽调角度看，这是缺口。电气安全方面，所有 Enpal 安装均遵守 DIN VDE 0100 布线标准，并由 Elektromeister
              监督。消费者评价网站 energiefluss24 在部分故障案例中引用“未遵守 DIN VDE”的情形，说明即便有认证结构，分包商差异仍是现实风险。

              公开评价中的反向模式一致：安装前和安装中满意度 80%+，但 17–30% 的评价者提到交付后的服务失败，包括热线打不通（等待 30+ 分钟）、邮件回复需要 5–7 天，以及公共事业并网行政延迟。消费者保护机构
              Verbraucherzentrale 已就 Enpal 合同条款发出警告，尤其涉及服务责任和价格上涨条款。Enpal 对具体媒体指控采取法律行动（2025 年柏林法院针对 Manager Magazin
              的禁令），说明公司积极维护声誉，也说明存在有争议的主张。
