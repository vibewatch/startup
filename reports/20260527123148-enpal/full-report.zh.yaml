  - id: TI005
    title: 公开财务缺口 — 尽调阻断项
    columns:
      - 缺失指标
      - 严重程度
      - 对分析的影响
      - 尽调路径
    rows:
      - - 按产品线划分的毛利率（光伏、热泵、电池、计量）
        - 阻断
        - 没有该指标，无法评估单位层面盈利能力或 LTV/CAC
        - 向管理层索取拆分 P&L，或获取经审计的集团账目
      - - 2024 和 2025 年经审计 EBITDA 与 EBIT
        - 阻断
        - 2024 年亏损幅度和 2025 年声称的拐点无法用公开数据验证
        - 要求提供 Enpal B.V. 向 KvK/lobbyregister 提交的 IFRS 合并损益表
      - - 按渠道划分的 CAC 和按队列划分的回本周期
        - 阻断
        - 无法承销单位经济或 LTV/CAC；销售效率是关键风险信号
        - 索取队列级销售漏斗数据，包括每份签约合同成本
      - - 合并现金余额和集团层面烧钱速度
        - 重大
        - SPV 层面和运营公司层面的流动性可能不一致；没有这项资料，无法量化再融资风险
        - 要求提供截至最近季度的合并资产负债表
      - - 债务契约条款与交叉违约条款
        - 重大
        - 再融资风险和运营约束触发条件仍未知
        - 要求法律数据室提供融资协议或契约条款摘要表
      - - 按队列和产品拆分的客户流失 / 留存率
        - 重大
        - 没有流失数据，LTV 估算没有约束；留存是经常性收入质量的关键关口
        - 要求提供按产品和地区拆分的月度队列留存数据
    notes: 所有缺口均截至 2026 年 5 月，基于公开信息评估。严重性评级反映其对财务测算的影响：阻断性缺口会阻止可靠财务建模；重大缺口会显著影响判断，但不完全阻止评估。
