      - number: '1.3'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Enpal 由三人创立，他们至今仍是公司身份的核心。Mario Kohle（生于 1984 年）是 CEO 兼联合创始人，此前创办过德国家居服务市场 Aroundhome（原
              Käuferportal），并在转向气候领域前将其建立后出售。Kohle 是 Enpal 的主要公开面孔，并获得 KfW Entrepreneurs' Award；《Financial
              Times》也按三年平均增长率将 Enpal 评为欧洲增长最快的能源公司。他在高增长、面向消费者数字平台上的经历，与 Enpal 用技术和融资简化复杂消费购买的模式高度匹配。

              Viktor Wingert 以金融和投资背景参与创办公司。2024 年 8 月新闻稿把他列为 Chief Investment Officer（CIO），2025 年 7 月事实表把他列为 CFO，2026 年
              1 月公司宣布他将转任深圳技术与生产基地负责人；此前负责中国站点的 Henning Rath 将于 2026 年 4 月离开。Johannes Roehren，此前为热泵部门 CFO，同时被任命为集团
              CFO。这意味着不到两年内，集团 CFO 职位已经由第三人接任（Jochen Cassel 截至 2024 年 8 月任该职；Wingert 到 2025 年 7 月接任；Roehren 于 2026 年 4
              月接任），这一模式值得尽调重点审视。Jochen Ziervogel 是第三位联合创始人，但公开材料中没有给出其高管头衔。

              Ben Merle 担任 Chief Product Officer，并曾就产品路线图决策接受行业媒体引用，包括在太阳能需求转弱时主动转向热泵。Leonardo DiCaprio 在媒体对 Kohle
              的采访中被称为早期投资者，但没有单独融资公告披露 DiCaprio 的具体持股。任何已审阅公开来源都没有披露董事会构成、投资者治理权、管理层股权和归属安排，因此治理结构是核心数据室问题。考虑到 Mario
              Kohle 同时担任战略决策者和公开发声人，关键人依赖被评为高。
