chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、企业结构与使命
        blocks:
          - type: paragraph
            body: >
              Enpal 是一家总部位于柏林的德国 greentech 公司，成立于 2017
              年，官方使命是把家庭接入可再生能源社区，并让清洁能源长期算账免费。公司采用垂直整合模式：自己获客、通过深圳供应链中心管理硬件供应，雇佣 1,000
              多名内部安装工和电工，同时接入第三方合作安装商，并靠持续能源管理、智能计量和融资服务维持长期客户关系。

              Enpal 官方事实表列出的法律形式是 B.V.（Besloten Vennootschap，荷兰私人有限公司结构），但为德国客户服务的运营实体在媒体报道中通常被称为 Enpal
              GmbH。这种双层结构——境外控股 B.V. 加本土 GmbH
              运营实体——在德国科技规模化公司中并不少见，便于更灵活地安排治理和投资者权利机制，但本报告审阅的公开文件没有说明确切公司层级。确认所有权链条、实体间协议，以及任何资产质押结构，是数据室的一阶任务。

              公司把自己的产品描述为“面向业主的一体化可再生能源解决方案”，在一条由 Enpal App 管理的客户关系下，组合光伏板、电池储能、EV 充电站（wallboxes）、热泵、智能电表和 Enpal.One+ AI
              能源管理平台。核心 B2C 产品之外，Enpal 还运营 Enpal.pro，这是面向独立太阳能和热泵安装商的 B2B2C 数字平台；自 2024
              年以来，公司还把触角延伸到商业与工业（C&I）太阳能安装。深圳供应链枢纽于 2020 年启用，让 Enpal 能直接控制 PV 硬件采购，在成本和供货确定性上形成小型竞争对手往往不具备的实质优势。

              2021 年，Enpal 成为首家跻身独角兽（估值超过 $1 billion）的欧洲 greentech 初创公司；公司把这一里程碑视为市场地位和商业模式得到验证。截至报告日，Enpal 仍为私营公司，未披露
              IPO 意向。
