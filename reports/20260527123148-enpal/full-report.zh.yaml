      - number: '6.2'
        title: 采用轨迹跑赢市场；具名证明基础薄，但有独立佐证
        blocks:
          - type: paragraph
            body: >-
              Enpal 2025 年增长值得注意，因为它发生在市场收缩背景下。EUPD Research 2025 年 8 月 Market Leadership Study 确认，2024 年欧洲户用太阳能安装量同比下降约
              20%。Enpal 2025 年把 PV 和热泵客户基础增加超过 30,000，年底达到超过 115,000 个家庭，意味着持续跑赢市场。运营子集团收入从 2024 年 €890 million 同比增长
              25%，达到超过 €1.1 billion。同一份 EUPD Research 研究把 Enpal 与 1KOMMA5°、E.ON Solar 并列为欧洲前三大户用太阳能安装商之一，独立确认了规模和能源耦合能力。


              热泵轨迹是客户采用证据中最亮眼的单一数据点。Enpal 直到 2023 年才进入热泵，2025 年上半年已安装超过 10,000 套，两年内成为德国市场领导者。2025 年 8 月新闻稿引用的独立 zNT
              排名显示，Enpal 2024 年在德国新增超过 4,300 套热泵安装，排名第一。热泵细分如今约占核心业务收入三分之一。


              2025 年夏季拆分出的 metrify 智能电表子公司，在拆分后经常性收入约增长 70%。metrify 已安装超过 50,000 个智能电表，提供一个重要的经常性收入代理指标，且大体独立于 PV
              租赁期限。住宅细分的具名客户证明仅限于汇总 Trustpilot 评价和单一具名商业客户。Enpal 不发布单个家庭案例研究——这是户用太阳能品类的结构性特征，不是 Enpal 独有缺口。
