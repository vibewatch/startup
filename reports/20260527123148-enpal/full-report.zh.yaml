      - number: '1.5'
        title: 财务表现、运营规模与反向信号
        blocks:
          - type: paragraph
            body: >
              Enpal 的收入轨迹呈现出快速增长、2024 年调整、2025 年恢复的节奏。收入从 2022 年的 €415 million 增至 2023 年的 €905 million，增幅 118%；后者经过审计，并由
              Enpal 于 2024 年 8 月发布。2023 年调整后 EBITDA 约 €21 million，经营现金流为正，略低于 2022 年报告的 €22.5 million
              EBITDA，尽管收入接近翻倍，说明快速扩张侵蚀了单位利润率。2024 年，公司报告收入下滑：Sifted 和 Handelsblatt 将其放在约 €860 million，而 Enpal 自己 2026 年
              1 月新闻稿在计算 2025 年同比增长 25% 时，把 2024 年基数写为 €890 million。€30 million 差异很可能来自合并范围不同（运营子集团 vs.
              全集团），公开资料尚未调和；经审计的 2024 年数据预计在 2026 年中公布。2025 年初步结果显示，收入超过 €1.1 billion——公司首次跨过 €1 billion
              门槛——动力来自热泵、Enpal.pro 和 C&I 分支增长，以及太阳能市场恢复。公司报告运营板块在 2025 年首次实现全年正自由现金流，这是财务可持续性的重要改善。

              规模上，Enpal 到 2025 年底在德国和意大利服务超过 115,000 户家庭，并在年内跨过 100,000 客户里程碑。超过 300,000 个分布式能源资源接入 Enpal 系统，装机容量约 1
              GW。公司员工超过 3,000 人（包括 1,000 多名安装工），运营 10 多个区域办公室，并在 Dahlewitz 学院拥有欧洲最大的安装商培训中心。

              反向信号集中在三处。第一，消费者评论平台呈现混合图景：Trustpilot 评分约 4.0–4.2/5，评论超过 27,000
              条，但分布呈双峰，五星和一星评价比例都很高。常见投诉包括安装后服务响应慢、并网和电表激活延迟，以及价格高于本地安装商。德国最权威消费者测试机构 Stiftung Warentest 已提示 Enpal
              合同中的注意事项，并建议仔细审阅合同条款。第二，CFO 任命快速接续（不到两年三任）是一条治理信号，尽调必须追问——虽然每次变动都被包装为自愿交接，但频率并不典型。第三，德国整体太阳能安装市场在 2024
              年明显收缩（新装增长率从 2023 年到 2024 年间的 214% YoY 降至约 7% YoY），考验 Enpal 模式韧性，并促使公司以 €100 million 投资热泵和新细分市场，作为有意设置的对冲。
