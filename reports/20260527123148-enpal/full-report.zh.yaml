          - type: callout
            title: Flexa VPP——5 分钟日内优势
            body: >-
              德国竞争 VPP 主要接入一级控制备用市场（如今被形容为饱和）或日前市场。Flexa 借助 Entrix 的 AI 算法，在 5 分钟间隔的连续日内交易中运行，允许更频繁套利；按 Enpal
              说法，参与家庭最高可节省 2× 成本。到 2025 年 12 月达到 400 MW 里程碑，证明已有实质商业牵引。
            calloutType: strength
            claimRefs:
              - CE013
              - CE014
              - CE015
          - type: callout
            title: 安装后服务缺口——重大反向信号
            body: >-
              多项独立评价分析（Gruenes.haus 2,500 条评价；energiefluss24 结构化 Trustpilot 数据）指向同一结论：安装体验正面，但交付后服务——热线等待超过 30 分钟、邮件 5–7
              天回复、并网行政失败——是一星评分和消费者保护警告的主要来源。若 energiefluss24 引用的 12–18% 技术故障率成立，以当前规模看，服务能力约束就是结构性质量控制风险。
            calloutType: risk
            claimRefs:
              - CE036
              - CE037
              - CE038
              - CE040
          - type: callout
            title: 电池供应商不透明
            body: Enpal 没有公开披露电池电芯或模组供应商。这是尽调缺口，因为电芯化学体系、循环寿命、热管理设计和保修条款，都会影响为 Enpal €5 billion ABS 项目提供底层支撑的融资能源资产的长期表现和残值。
            calloutType: risk
