      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: EEG 上网电价改革是最大的需求杀伤风险
            body: >-
              柏林政坛正在讨论的 2026 年 EEG 改革草案，将取消新建小型屋顶光伏 20 年保底上网电价。德国消费者采用光伏，历史上一直锚定这项补贴；如果取消补贴却没有等效的直接市场机制，新客户的 ROI
              叙事会改写，需求也会在一个 2024 年已收缩 19% 的市场里继续放缓。
            calloutType: risk
            claimRefs:
              - CR025
              - CR026
              - CR027
          - type: callout
            title: 劳动法指控仍有法律风险，也继续损害声誉
            body: >-
              Manager Magazin 的曝光（2024 年 10 月）和 FAU Leipzig 追讨工资案件，共同形成了 Enpal 劳动纠纷的公开记录。虽然 Enpal 在 2025 年 12
              月赢得法院命令，禁止该杂志的部分具体指控，但底层 LkSG 和劳动法合规问题仍要等审计完成和后续程序推进，尚未了结。
            calloutType: risk
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR041
          - type: callout
            title: ABS 资本结构新颖、对利率敏感，压力情景下验证不足
            body: >-
              Enpal 的 SPV 融资是欧洲首单住宅光伏证券化。新颖性意味着二级市场流动性很薄，资金成本随市场利率浮动，而客户订阅通常采用固定价格。欧洲 ABS
              市场只要发生错位——无论来自信用事件、监管变化还是利差上行——都会直接限制 Enpal 部署新增资产批次的能力。
            calloutType: risk
