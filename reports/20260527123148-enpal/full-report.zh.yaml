      - number: '5.3'
        title: 部署、集成、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              Enpal 用混合模式执行安装：自有员工加经过筛选的区域分包网络。每个区域分支都配备持证 Elektromeister（电工大师）担任质量主管，这是获得 2023 年 VDE 认证的前提。公司 2020 年推出
              Enpal Academy，称其为欧洲最大的太阳能行业培训中心，用来认证自有和合作安装人员。截至 2024 年 Q1，Academy 已在太阳能工种创造超过 1,000 个岗位，并计划在热泵工种再创造 1,000
              个岗位。2025 年 4 月 €110 million 融资明确用于扩大 Enpal.pro B2B 安装商平台；该平台为使用 Enpal 供应链、但以自有品牌安装的独立 HVAC/PV
              安装商提供全国采购、物流、规划和融资入口。

              客户评价（Gruenes.haus 在 2025 年中分析超过 2,500 条 Trustpilot 评价）显示，80%+ 安装能在承诺的 6
              周窗口内满意完成，物理安装质量总体正面。问题集中在安装后服务，尤其是并网登记、上网电价管理和客服可达性，这些构成大多数 1 星投诉。energiefluss24 基于截至 2026 年 2 月的结构化
              Trustpilot 数据，引用 12–18% 技术故障率，并称这是受访提供商中最高水平。Enpal 公开反驳未具体说明的媒体指控（2025 年 Manager Magazin 文章受到柏林法院禁令约束）。

              截至 2026 年，路线图聚焦四个支柱：（a）扩大热泵安装，朝公司原定 2026 年供暖板块 €1 billion 收入目标推进；（b）把 VPP 参与从 10,000 户扩大到全部 80,000+
              现有客户；（c）扩展智能电表网关铺设（公司博客称已安装 10,000 套）；（d）扩张 Enpal.pro B2B 平台。2025 年 4 月 €110 million
              股权融资明确投向这四个支柱。欧洲扩张（意大利和更多市场）出现在投资者材料中，但官方尚未发布产品上线时间表。
