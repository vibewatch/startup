      - number: '1.2'
        title: 产品、商业模式与市场进入
        blocks:
          - type: paragraph
            body: >
              Enpal 的产品策略自成立以来持续扩张，从 2019 年的单一太阳能租赁模式，演进为 2024 年覆盖全屋脱碳的生态系统。最初产品是一套太阳能即服务租赁方案，允许业主零首付安装 PV
              系统，并按月支付租金，直接移除了最常见的两个采用门槛——前期成本和安装复杂度。公司在 2021 年加入电池储能，2022 年加入 EV 充电墙盒，2023 年加入热泵，每一条产品线都沿用零首付融资逻辑。

              2023 年推出热泵具有战略意义：到 2025 年，热泵部门贡献约三分之一核心业务收入，Enpal 也声称自己在德国该细分市场居于领先。这种多元化是有意为之——Enpal 在 2024 年向新业务领域投入约
              €100 million，正是因为太阳能需求转弱；这在一定程度上隔离了全行业收缩带来的冲击，竞争对手 Zolar 被迫把员工数从约 400 人砍到 50 人，并转向软件。

              收入模式来自多条流。硬件收入来自所有产品线的销售和安装。经常性收入来自电力套餐（16 ct/kWh 起，公司自称德国最低）、智能电表运营费，以及可选维护和保险包。Enpal.One+
              通过优化电池充放电周期和电力交易创造价值，底层虚拟电厂（VPP）由一家名为 Flexa 的合资公司建设，Enpal 与 AI 公司 Entrix 于 2024 年共同创办该公司。2025 年夏天拆分出来的
              Metrify Smart Metering 子公司，在拆分后经常性收入已经增长约 70%，显示这条附属收入流的规模潜力。

              Enpal.pro 由 Lukas Pauly 于 2023 年创立，是一个 B2B2C 安装商平台，为独立安装商提供 24 小时材料交付、屋顶规划工具、并网服务和消费者融资入口，让 Enpal
              无需完全拥有这些安装项目，也能把品牌和收入触达延伸进安装商渠道。C&I 业务于 2024 年启动，面向商业规模太阳能；截至报告日，这仍是早期增长方向。事实表把灵活融资条款——零首付、最长 25
              年期限和非计划还款——描述为相对银行融资购买合同的关键差异化。
