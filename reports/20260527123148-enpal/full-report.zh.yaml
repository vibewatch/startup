        - 法律顾问或结构化顾问；尽调中向 Enpal CFO 索取
      - - 客户队列留存与 LTV
        - 年流失率、队列留存表、按产品划分的客户 LTV
        - 经常性收入耐久性支撑 ABS 价值；未公开披露
        - 与 Enpal 一手访谈；尽调中索取队列数据
      - - 股权结构表优先股堆叠
        - 按股份类别列示完整股权结构表，并附清算瀑布
        - Series C 和 D 的高级清算优先权会压低普通股价值
        - VC TPG、SoftBank，或数据室权限中由 Enpal 直接提供
      - - IPO 或退出时间表
        - 管理层计划、战略评估状态、双轨进程
        - 退出流动性窗口决定持有期和回报画像
        - 直接和管理层讨论；由法律顾问提供双轨证据
    notes: |
      优先事项是第 1–3 行（EBITDA、估值标记、ABS 契约）：缺少这些，建议不能从有条件观察上调。第 4–6 行对建模重要，但在价格足够保守时，不会阻挡有条件入场决定。
    claimRefs:
      - CV013
      - CV029
      - CV032
      - CV043
      - CV045
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: standard
    summary: 按时间记录 Enpal 自 2017 年至 2026 年 4 月的创立、产品发布、融资事件、监管遭遇和治理事件。
    data:
      items:
        - date: '2017'
          label: 公司创立
          detail: Mario Kohle、Viktor Wingert 和 Jochen Ziervogel 在柏林创立 Enpal，愿景是用租赁 / 融资模式简化并普及住宅太阳能。
          tone: positive
        - date: '2019'
          label: 太阳能即服务模式
          detail: 公司确立零前期成本的太阳能租赁方案；相较传统现金购买安装商，该方案成为核心商业差异点。
          tone: positive
        - date: '2020'
          label: 深圳供应链中心
          detail: 供应链中心在中国深圳开设，支持硬件直接采购，相比依赖第三方分销商的模式改善利润率。
          tone: positive
        - date: '2021'
          label: 独角兽地位；电池与电价产品推出
          detail: Enpal 成为欧洲首家绿色科技独角兽（估值 >$1B）。电池储能和电价产品推出，进一步加深一体化能源生态。
          tone: positive
        - date: '2022'
          label: Wallbox、Academy、意大利扩张
          detail: 新增 EV wallbox 产品；面向太阳能安装商的 Enpal Academy 在 Dahlewitz 开业；首次国际扩张进入意大利（Enpal Italia，米兰）。
          tone: positive
        - date: Dec 2022
          label: €855m 债务再融资
          detail: BlackRock Alternatives、ING、Pricoa、UniCredit 和 Infranity 提供 €855m，用于规模化支持表外客户融资账簿。
          tone: positive
        - date: '2023'
          label: 热泵、智能电表、Enpal.pro 推出
          detail: 热泵和智能电表补齐完整家庭脱碳套件；Enpal.pro B2B2C 安装商平台推出。监管波动（GEG 争论、补贴取消）压低 H2 太阳能需求。
          tone: neutral
        - date: Sep 2023
          label: Series D €215m，估值 €2.2B
          detail: TPG Rise Climate 领投 €215m Series D，投后估值 €2.2 billion，The Westly Group 和 Activate Capital 参投。
          tone: positive
        - date: Aug 2024
          label: 2023 年经审计业绩：€905m 收入
          detail: 首次公开发布接近 €1B 规模的经审计业绩：收入 €905m（+118% YoY）、调整后 EBITDA €21m、经营现金流为正。
          tone: positive
        - date: '2024'
          label: 收入下滑；向新板块投入 €100m
          detail: 收入下降至 €860–890m（来源冲突）；公司 H1 主动降低盈利优先级，向热泵、Enpal.One+ 和 C&I 投入 €100m；H2 恢复盈利。
          tone: warning
        - date: '2024'
          label: €1.1bn 债务融资工具；Flexa VPP 合资公司
          detail: Barclays、BofA 和 Crédit Agricole 提供新的 €1.1bn 债务融资工具。与 AI 公司 Entrix 推出 Flexa 合资公司，用于建设欧洲最大的虚拟电厂。
          tone: positive
        - date: Apr 2025
          label: €110m 股权融资；超额认购
          detail: TPG Rise Climate 领投 €110m 轮，OPG、Westly Group 和一家未具名欧洲保险公司参投。一周内超额认购；估值未披露。
          tone: positive
        - date: Jan 2026
          label: 2025 年业绩：收入 >€1.1B；自由现金流转正
          detail: 2025 年初步业绩收入超过 €1.1B（+25% YoY），运营板块首次实现全年正自由现金流。
          tone: positive
        - date: Apr 2026
          label: CFO 交接（<2 年内第 3 位）
          detail: Johannes Roehren 出任集团 CFO；Viktor Wingert 转去负责深圳运营；Henning Rath 离任。不到两年内第三次任命 CFO。
          tone: warning
