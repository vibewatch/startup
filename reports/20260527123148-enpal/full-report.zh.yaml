      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              Enpal 的财务叙事由三部分构成：资本密集型高速增长、2024 年中途盈利受挫，以及管理层称为结构性拐点的 2025 年运营分部 FCF 转正。收入故事可信且有佐证：收入两年内从 €415M 跳至
              €905M；2024 年持平到下滑后，2025 年恢复并超过 €1.1B；产品组合转向热泵，长期应改善混合毛利率。结构化融资项目成熟，并得到一线机构贷款方充分支持，说明资本市场参与者认可底层资产质量。


              但是，财务质量判断被缺失数据严重限制。2024 或 2025 年既未披露毛利率，也未披露 EBITDA；2023 年调整后 EBITDA 约
              2.3%，远低于资本密集型租赁模式要支撑杠杆所需的水平。销售佣金经济性、CAC 回本周期和分队列留存都只能靠私下材料验证。SPV/ABS
              结构意味着列报的经营现金流不是现金生成的完整图景。合并现金余额和具体债务契约未知。缺少这些输入，无法高置信度承销这家公司。


              主要尽调阻断项包括：（1）2024 和 2025 年经审计 IFRS 合并账目，列示各分部毛利率、EBITDA 和净利润；（2）队列层面的 CAC 和回本数据；（3）合并资产负债表与流动性画像；（4）主要 ABS
              融资的契约和交叉违约条款；（5）2024 年亏损和 2025 年 4 月 €110M 融资后，对 €2.2–2.4B Series D
              标记估值的任何重估。没有这些材料，财务质量评估只能是局部的——收入曲线和机构融资可信度为正面，但没有正式数据室则不具备投资可承销性。
