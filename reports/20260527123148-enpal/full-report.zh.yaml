  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - EEG 20 年保障上网电价（2026 年为最后一年）
        - 驱动（紧迫性）
        - 2026 年需求前置；2027 年风险
        - 拟取消电价前形成安装紧迫感；2026 年 H2 需求可能冲高
        - 跟踪 EEG 改革投票时间表；建模无固定电价的 2027 年情景
      - - PV + 储能硬件 0% VAT（自 2023 年起）
        - 驱动（结构性）
        - 持续；除非废止，否则永久
        - 典型 10 kWp + 储能系统可节省约 €3,000–5,000；降低获客成本
        - 核验是否符合 EU 国家援助规则；关注日落条款或上限
      - - 高零售电价（2026 年 €0.30–0.35/kWh）
        - 驱动（经济性）
        - 当前；电价已从 2022–23 年高位正常化
        - 光伏自用价值 30–35 ct/kWh，对比上网 7–8 ct/kWh；自用经济性强
        - 跟踪现货和零售价格走势；建模价格下跌敏感性
      - - 政策不确定性——拟于 2027 年 EEG 改革取消小型 PV 固定电价
        - 约束（反向）
        - 2026 年 H2 立法投票；若通过，2027 年生效
        - 若无固定电价，约 40% 潜在买家会放弃太阳能；2026 年后住宅 PV 新增量可能减半
        - 跟踪 Bundestag 投票时间表；评估市场电价情景下 Enpal 订阅用户合同条款
      - - 高融资成本（KfW 270 实际利率自 3.73% 起；一般市场利率）
        - 约束（财务）
        - 当前；取决于 ECB 利率周期
        - 租赁 / 订阅经济性承压；客户月供抬高
        - 建模 4%、5%、6% 资本成本情景下 Enpal 租赁经济性
      - - 安装工短缺 / 熟练技工瓶颈
        - 约束（运营）
        - 近期；2024–2026
        - 并网延误；订单流失；质量风险；限制市场吞吐量
        - 评估 Enpal 安装工网络深度；核验自有团队与分包商占比
      - - 中国组件价格竞争 / 德国安装商破产
        - 约束（结构性反向）
        - 自 2024 年以来持续
        - 住宅太阳能公司利润率受损；行业整合加速；集中度风险和潜在供应不确定性上升
        - 审查 Enpal 供应商多元化；核验组件采购来源和价格锁定
      - - 热泵 + PV 打包经济性（3.5× 价值倍数）
        - 驱动（邻近品类）
        - 当前；随 GEG 执法推进而增长
        - 运行热泵时，光伏自发电价值为 27 ct/kWh；打包 ROI 逻辑强
        - 评估 Enpal 热泵产品集成时间表，以及与 KfW 458 补贴的匹配度
    notes: 方向从市场层面而非公司层面判断。“时点”指因素最尖锐的时期。约束严重程度为作者基于引用来源估计。
