  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、组件与 SKU
        blocks:
          - type: paragraph
            body: >-
              Enpal 2026 年的商业方案，是面向德国自住房单户住宅的五组件能源解决方案。入口产品是屋顶太阳能 PV 阵列，采用来自 Tier-1 厂商的 450 Wp 双面 All-Black Glas-Glas
              组件，按订单定制容量（单户住宅通常 6–15 kWp；若一次性购买，平均 10 kWp 系统约 €18,000–€26,000）。第二个组件是品牌未披露的智能电池储能单元（Enpal
              网站没有说明电芯供应商，但行业来源把这一产品类别与 BYD 等厂商关联）。第三是 Enpal.One 能源管理器——自研 IoT 网关盒（“EnpalBox”）加云软件，负责编排所有连接设备，并在 Enpal
              消费者 app 中呈现数据。第四是 Bosch Compress 5800i AW 空气-水热泵，使用天然 R290 丙烷制冷剂，在 35°C 供水温度下 SCOP 最高 4.54，运行噪声 ≤40
              dB(A)。第五是面向 EV 充电、针对太阳能优化的 AC wallbox。

              除硬件包外，Enpal 提供 Enpal.One+ 能源电价，价格为 €0.19/kWh（德国媒体称英文网站标注 €0.16/kWh），并通过与 AI 专家 Entrix 的 Flexa 合资公司提供 VPP
              参与；符合条件的客户（最低要求为太阳能 + 电池）可让家庭资产进入连续日内电力市场交易，Enpal 对外宣传最高可获得 €2,000/年额外收益。公司还运营 Enpal.pro，这是面向区域安装商和 HVAC
              技工的 B2B 分销与服务平台。截至 2025 年，完整五组件组合的商业部署占 Enpal 新客户激活的大多数。智能电表网关项目已达到 10,000 套安装，为扩展电网服务铺设数据基础设施。

              获客模式走在线线索生成 + 上门咨询漏斗。Enpal 预计从初次咨询到完成并网安装平均需要 6 周。2026 年，公司的直面消费者渠道只服务德国；不过 solar.red 数据和 Enpal
              自有公告都提到意大利已有早期商业运营。
