  - id: FV001
    title: 投资建议逻辑链
    type: flow
    layout: standard
    summary: |
      从 Enpal 的市场地位、收入证明和商业模式出发，串到风险画像和估值水平，最终得出有条件跟进建议。
    data:
      nodes:
        - id: market
          label: 市场规模
          description: 欧洲住宅能源转型 EUR 100B+；德国每年 EUR 20B 资本开支机会；宏观顺风强
        - id: revenue
          label: 收入证明
          description: 2025 年收入 EUR 1.1B（同比 +25%）；经营 FCF 首次转正；该赛道欧盟最大住宅安装商
        - id: model
          label: 商业模式
          description: ABS 融资支撑的垂直一体化组合（光伏 + 储能 + 热泵 + EV）；复购平台
        - id: risk
          label: 风险画像
          description: 高：2024 年经营亏损 EUR 50M；ABS 契约条款未披露；集中在德国；补贴波动
        - id: valuation
          label: 估值水平
          description: 最近披露估值 EUR 2.2B（2023 年 1 月）；约为 2025 年收入 2x；较 Sunrun EV/Rev 折价 60%+；无 2025 年估值标记
        - id: rec
          label: 建议
          description: 有条件跟进：若 EBITDA 得到确认，低于 EUR 2B 具备吸引力；盈利能力证明前仍属高风险
      edges:
        - from: market
          to: revenue
        - from: revenue
          to: model
        - from: model
          to: risk
        - from: risk
          to: valuation
        - from: valuation
          to: rec
    approximationNotes: |
      节点描述综合公开证据。风险和估值节点在一手数据缺位时纳入估计和分析判断（EBITDA、契约条款、当前估值标记）。
