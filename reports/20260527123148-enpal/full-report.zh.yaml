      - number: '4.2'
        title: 增长轨迹与公开业务进展
        blocks:
          - type: paragraph
            body: >
              Enpal 交出了欧洲清洁技术领域最快的收入增长曲线之一。公司 2021 年收入约 €115M，2022 年增至 €415M，规模扩大到三倍多（约 261% YoY），2023 年又几乎翻倍至
              €905M（118% YoY），按收入跻身欧洲增长最快的未上市公司之一。2024 年增长失速：德国户用光伏市场在 2022–2023 年装机潮后降温，收入小幅降至约 €860–895M；Enpal
              管理层也承认进入「亏损区」，同时投入约 €100M 做重组和运营转型。2025 年反弹很强，官方业绩超过 €1.1B（+25% YoY），公司首次跨过 €1B 收入门槛，并声称运营集团层面自由现金流转正。


              截至 2025 年底，Enpal 服务超过 115,000 个家庭，覆盖德国和较新的意大利业务；累计安装分布式能源资源超过 300,000 套。仅 2025 年，光伏和热泵品类新增客户就超过 30,000。公司
              2023 年才推出热泵，2025 年中已跨过 10,000 台装机里程碑。GetLatka 基于 2024 年数据估计，单员工收入超过
              $550,000；这一生产率代理指标指向较高运营杠杆，但绝对员工数和具体方法未获独立确认。


              CBInsights 的第三方数据把最近一次标记估值放在约 $2.4B（来自 2023 年初 Series D）。2024 年亏损后，这一标记是否被下修仍未知；2025 年 4 月来自 TPG 和
              SoftBank 的 €110M 股权融资没有公开披露新估值。2025 年收入里程碑和 FCF 拐点是重要正面信号，但缺少 2024 和 2025 年经审计合并利润表数据，无法判断该估值是否站得住。
