      - number: '7.6'
        title: 缓释因素、监控指标和否决标准
        blocks:
          - type: paragraph
            body: >-
              风险层层叠加，但 Enpal 也有真实且有证据支撑的缓释因素。Enpal 作为德国最大的 wMSB，智能电表覆盖面让它在 2025 年光伏控制法下拥有结构性合规优势，小型竞争对手需要多年才能复制。EIB 和
              EIF 对高级 ABS 分层提供担保，构成可信的机构背书。TPG 在 2025 年 4 月注资，以及 Barclays、BofA、Citi、Crédit Agricole
              参与债务融资，都说明机构信心仍在。Enpal 在德国热泵市场的领先地位（公司称截至 2024 年）是真正的多元化一步，公司自研的 Enpal.One 能源交易平台也在硬件之上叠加了经常性软件价值层。2025
              年初重返盈利——若内部财务数据能够验证——将确认 2024 年经营亏损是周期性问题，而非结构性问题。投资人跟踪这个机会时，应盯住以下指标：月度收入轨迹和地域结构、滚动服务工单集中度（14%/66% 比例）、ABS
              市场利差与内部资金成本、拟取消保底上网电价的 EEG 改革进展，以及劳动法程序和 Inexogy 计量纠纷状态。破坏论点的触发器应界定得很紧：如果修订后的 EEG
              在没有替代性直接市场机制的情况下取消小规模保底上网电价；如果 Enpal 连续超过一批新增资产无法获得 ABS 再融资；如果劳动法程序得出系统性问题或带来监管处罚；或如果连续两个季度经营亏损扩大且没有证据支撑的
              EBITDA 盈亏平衡路径，就应重新承销，而不是延续原有仓位规模。
