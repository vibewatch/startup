      - number: '8.2'
        title: 估值分析和可比公司组
        blocks:
          - type: paragraph
            body: >
              Enpal 股权价值最可靠的外部锚点，是 2023 年 1 月 Series D 投后估值约 EUR 2.2 billion（按 2023 年 EUR/USD 约合 USD 2.4 billion）。以 2025
              年 EUR 1.1 billion 收入计算，隐含 EV/Revenue 约 2.0x，明显低于公开绿色能源公司 5.4x 中位数（Finerva 2026 数据），也远低于 Sunrun 截至 Q1
              2026、基于 USD 3.17 billion TTM 收入的 6.1x EV/Revenue。

              这部分折价有结构性原因。Enpal 是私人公司（存在流动性折价），所在的高利率欧洲市场还不像美国那样接受 ABS 融资光伏，并且尚未证明 EBITDA 能持续盈利。欧洲气候科技独角兽在类似阶段，分析师估计 30%
              到 40% 的私有公司相对上市公司折价是合理区间。

              在欧洲私人市场内，Enpal 最接近的可比对象是 1KOMMA5 degrees，估值约 USD 1 billion，增长很快但规模小得多。Zolar 估值 USD 250 到 400
              million，是阶段更早、组合更窄的数字化安装商。按收入规模看，Enpal 最适合对标 Sunrun，但美国市场给出更高倍数、客户密度更高，光伏 ABS 先例也更成熟。Sunnova（2026 年清算）和
              SunPower（2025 年破产）的失败是反向可比：当利率条件恶化、再融资市场收紧，资本密集型住宅光伏安装商可能快速倒下，这直接警示 Enpal 依赖 ABS 的模式。

              将 2.0 到 3.5x EV/Revenue 区间套用到 2026 到 2028 年预计收入 EUR 1.2 到 1.5 billion，对应估值走廊约 EUR 2.4 billion 到 EUR 5.3
              billion。基准情景中点（约 EUR 3 billion）只略高于最近披露估值，意味着除非收入执行和 EBITDA 证明显著超出市场共识，或欧洲倍数向美国水平重估，否则短期上行有限。
