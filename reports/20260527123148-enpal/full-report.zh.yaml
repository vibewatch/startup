      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 2027 年 EEG 改革可能让住宅太阳能需求减半
            body: >-
              德国政府的 EEG 改革草案提出，自 2027 年 1 月起，取消所有最高 25 kW 新 PV 系统的固定上网电价。BSW-Solar
              警告，这将危及数万个就业岗位，并显著拖慢太阳能扩张。行业调查显示，如果没有保底电价，只有 ~40% 的潜在买家会继续购买。对 Enpal 来说，EEG 电价是其订阅 ROI
              模型的一部分，因此这是结构性威胁，需要立即调整产品和定价模型。2026 年的提前购买效应可能抬高近期指标，同时掩盖 2026 年后底层需求悬崖风险。
            calloutType: risk
            claimRefs:
              - CM029
              - CM030
              - CM031
          - type: callout
            title: 电池储能加速扩大 Enpal 的捆绑收入
            body: >-
              住宅 PV 安装在下滑，但电池储能正急剧加速：2026 年 Q1 新投运住宅 + 商业储能 2 GWh，同比增长 67%，创下纪录。德国现有累计储能容量 26 GWh，其中 82% 在住宅系统中。对 Enpal
              这类能在核心太阳能安装之外捆绑储能、热泵和 EV 充电墙盒的运营商来说，这一趋势结构性提高单客户收入。10 kWp 太阳能 + 10 kWh 电池系统的自发自用经济性（回本约 11 年，独立 PV 约 8
              年）会在订阅生命周期内强化客户留存。
            calloutType: strength
            claimRefs:
              - CM005
              - CM006
              - CM014
              - CM033
          - type: callout
            title: 相互矛盾的规模估计要求尽调核验市场份额主张
            body: >-
              多个来源对德国 2025 年太阳能新增容量给出不同数字：Fraunhofer ISE 报告净新增 16.2 GW，BSW-Solar 事实表显示总新增 17.5 GW（包含估计迟到登记）。Mordor
              Intelligence 等分析师供应商把住宅、商业和公用事业细分混成一个市场数字。投资者在接受任何单一 TAM 数字前，应先严格界定边界，并要求 Enpal 给出锚定可验证安装商和订阅队列数据的 SAM、SOM
              估计，而不是只用自上而下的市场报告。
            calloutType: insight
            claimRefs:
              - CM016
              - CM017
              - CM037
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Enpal 经营的德国住宅家庭电气化市场，覆盖屋顶太阳能 PV、电池储能、热泵、EV 充电和能源管理软件。EUPD Research 2025 年 8 月 Market Leadership Study 将
              1Komma5°、E.ON Solar 和 Enpal（按字母顺序）列为欧洲三家领先住宅太阳能公司，是唯一因规模、数字平台和能源耦合而被区分出来的参与者。其下是一条高度分散的长尾：欧洲有超过 24,000 家本地
              Handwerker，多数缺乏全国品牌、融资基础设施或软件能力。德国住宅太阳能市场在 2022–2023 年间新增容量增长 214%，但 2023–2024 年仅增长 6.66%；2024 年销量下降
              20%，2025 年继续疲软，挤压小型玩家并加速整合。Zolar 曾是资本化第三强的 D2C 太阳能初创公司，融资约 ~€300M；2025 年进入破产程序后，从直接安装转向 B2B 软件，员工数从约 ~400
              人降至 ~50 人。这场结构性出清说明，在需求常态化环境下，只有拥有大装机基数、软件粘性或公用事业分销的公司，才能维持 D2C
              经济性。竞争集合可分为四层：（1）全国性数字原生安装商和能源平台（Enpal、1Komma5°）；（2）公用事业支持的品牌产品（E.ON Solar）；（3）专业垂直玩家（热泵领域的
              Thermondo）；（4）分散的本地安装商基盘。相邻的现状替代方案——继续使用电网电力和燃气供暖——仍是大多数德国业主的默认选择，也代表了最大一块可寻址但尚未捕获的需求。
