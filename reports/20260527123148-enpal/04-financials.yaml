  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: EBITDA
      missingEvidence: "Audited EBITDA and gross margin for 2024 and 2025 from Enpal B.V. consolidated IFRS income statement"
      whyItMatters: "The 2023 adjusted EBITDA of 2.3% is insufficient to underwrite the capital structure; 2024 and 2025 profitability are entirely self-reported without audited backing, making financial quality assessment impossible from public data alone."
      diligencePath: "Request the 2024 and 2025 Enpal B.V. IFRS consolidated accounts from the Dutch KvK or Bundestag lobbyregister once filed, or obtain directly from management under NDA."
      relatedQuestionRefs:
        - QI004

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: "Gross margin by product line (solar PV rental, heat pump, battery, smart metering) to enable segment-level LTV modelling"
      whyItMatters: "Without gross margin data, LTV/CAC analysis is impossible and the purported heat-pump margin improvement cannot be verified. The 2.3% EBITDA margin from 2023 masks cross-segment variation."
      diligencePath: "Require disaggregated P&L by product segment in the data room; cross-check against CAC estimates by channel and vintage cohort."
      relatedQuestionRefs:
        - QI015
        - QI006
        - QI016

    - type: private-evidence-only
      severity: blocking
      topic: CAC
      missingEvidence: "Customer acquisition cost by channel and vintage, payback period per customer cohort, and trailing-12-month average CAC for solar and heat pump segments"
      whyItMatters: "CAC is the primary lever on unit economics and LTV adequacy. Analyst critiques citing commissions at ~60% of gross margins cannot be verified or refuted without this data, and payback periods are completely unknown."
      diligencePath: "Request cohort-level sales funnel metrics (leads, qualification rate, signed contracts, cost per contract) segmented by direct and indirect channel and by product."
      relatedQuestionRefs:
        - QI007
        - QI024

    - type: missing-source
      severity: material
      topic: installed-capacity
      missingEvidence: "Total installed capacity in kWp across the managed DER portfolio and average system size per installation vintage"
      whyItMatters: "Portfolio capacity is a key indicator of asset quality, grid-export economics, and the revenue durability of the SPV-held contract book. It is referenced in market rankings but not quantified in absolute kWp terms."
      diligencePath: "Query official data releases from Bundesnetzagentur (German grid regulator) for registered residential DER installations cross-referenced to Enpal as installer; or request directly from management."
      relatedQuestionRefs:
        - QI025

    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: "Consolidated cash-on-hand, OpCo-level monthly burn rate, and key covenant terms on the major ABS facilities"
      whyItMatters: "The operating company's true liquidity position is obscured by the SPV structure. Covenant breaches or credit tightening could constrain installation volume and growth immediately; this is the core capital-adequacy risk."
      diligencePath: "Request consolidated treasury report including OpCo cash balance, undrawn warehouse capacity, and covenant compliance certificates from the last two reporting periods."
      relatedTableRefs:
        - TI004
      relatedQuestionRefs:
        - QI010
        - QI019
