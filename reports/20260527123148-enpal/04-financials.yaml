  - id: TI005
    title: Public Financial Gaps — Diligence Blockers
    columns:
      - Missing Metric
      - Severity
      - Impact on Analysis
      - Diligence Path
    rows:
      - - Gross margin by product line (solar, heat pump, battery, metering)
        - blocking
        - Cannot assess unit-level profitability or LTV/CAC without this
        - Request disaggregated P&L from management or audited group accounts
      - - Audited EBITDA and EBIT for 2024 and 2025
        - blocking
        - 2024 loss magnitude and 2025 claimed inflection are unverifiable from public data
        - Require Enpal B.V. IFRS consolidated income statement filed with KvK/lobbyregister
      - - CAC by channel and payback period by cohort
        - blocking
        - Cannot underwrite unit economics or LTV/CAC; sales efficiency is a key risk flag
        - Request cohort-level sales-funnel data including cost per signed contract
      - - Consolidated cash-on-hand and group-level burn rate
        - material
        - SPV-level and OpCo-level liquidity may diverge; refinancing risk unquantifiable without this
        - Request consolidated balance sheet as of most recent quarter
      - - Debt covenant terms and cross-default provisions
        - material
        - Refinancing risk and operational-constraint triggers are unknown
        - Request facility agreements or summary covenant schedule from legal data room
      - - Customer churn/retention rate by cohort and product
        - material
        - LTV estimates are unconstrained without churn data; retention is the key recurring-revenue quality gate
        - Request monthly cohort retention data segmented by product and region
    notes: "All gaps are assessed as of May 2026 based on publicly available information. Severity ratings reflect impact on financial underwriting: blocking gaps prevent reliable financial modeling; material gaps significantly affect judgment but do not entirely prevent assessment."
