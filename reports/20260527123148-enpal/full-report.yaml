  - id: FV001
    title: Recommendation Logic Chain
    type: flow
    layout: standard
    summary: >
      Chain from Enpal's market position, revenue proof, and business model through risk profile and valuation level to
      the conditional track recommendation.
    data:
      nodes:
        - id: market
          label: Market Scale
          description: >-
            EUR 100B+ European residential energy transition; Germany EUR 20B/yr capex opportunity; strong macro
            tailwinds
        - id: revenue
          label: Revenue Proof
          description: EUR 1.1B in 2025 (+25% YoY); first positive operating FCF; sector's largest EU residential installer
        - id: model
          label: Business Model
          description: ABS-financed vertically integrated bundle (solar + storage + heat pump + EV); repeat-purchase platform
        - id: risk
          label: Risk Profile
          description: 'HIGH: 2024 EUR 50M operating loss; undisclosed ABS covenants; Germany concentration; subsidy volatility'
        - id: valuation
