      - number: '6.3'
        title: Structural retention is strong; post-installation service quality is a documented vulnerability
        blocks:
          - type: paragraph
            body: >-
              The lease model's structural retention is Enpal's most defensible customer metric. A homeowner who has
              signed a 20-year lease and had hardware installed faces high switching costs: physical removal, roof
              repair, contract termination, and loss of ongoing maintenance and insurance. Each additional product line
              — heat pump, wallbox, metrify smart meter — deepens these costs. The EUPD Research study highlights sector
              coupling as a key competitive differentiator among top installers.


              The post-installation service experience is the clearest adverse signal in the public record. An analysis
              of 2,500 Trustpilot reviews from February to July 2025 (gruenes.haus) found consistent praise for the
              pre-installation consultation and the installation itself, but consistent complaints after handover: poor
              hotline reachability, slow technical fault resolution, difficulty obtaining grid feed-in compensation, and
              a perception of abandonment. Diebewertung.de documented specific failure patterns: installations unable to
              go live for months because required paperwork was not filed with grid operators, subcontractor-quality
              defects, aggressive repeat-call sales tactics, and non-transparent pricing.


              The most pointed adverse analysis is the May 2025 independent strategic review by Prof. Dr. Christoph Ph.
