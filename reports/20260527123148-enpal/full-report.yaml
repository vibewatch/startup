figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    layout: standard
    summary: >-
      A chronological record of Enpal's founding, product launches, financing events, regulatory encounters, and
      governance events from 2017 through April 2026.
    data:
      items:
        - date: '2017'
          label: Company founded
          detail: >-
            Mario Kohle, Viktor Wingert, and Jochen Ziervogel found Enpal in Berlin with a vision to simplify and
            democratise residential solar energy through a rental/financing model.
          tone: positive
        - date: '2019'
          label: Solar-as-a-service model
          detail: >-
            No-upfront-cost solar rental proposition established; becomes the core commercial differentiator against
            traditional cash-purchase installers.
          tone: positive
        - date: '2020'
          label: Shenzhen supply chain hub
          detail: >-
            Supply chain center opens in Shenzhen, China, enabling direct hardware procurement and improving margins
            versus third-party distributor models.
          tone: positive
        - date: '2021'
          label: Unicorn status; battery & tariff launched
          detail: >-
            Enpal becomes first European greentech unicorn (>$1B valuation). Battery storage and electricity tariff
            products launched, deepening the integrated energy ecosystem.
          tone: positive
        - date: '2022'
          label: Wallbox, Academy, Italy expansion
          detail: >-
            EV wallbox product added; Enpal Academy for solar installers opened in Dahlewitz; first international
            expansion into Italy (Enpal Italia, Milan).
          tone: positive
        - date: Dec 2022
          label: €855m debt refinancing
          detail: >-
            BlackRock Alternatives, ING, Pricoa, UniCredit, and Infranity provide €855m to fund the off-balance-sheet
            customer financing book at scale.
          tone: positive
        - date: '2023'
          label: Heat pump, smart meters, Enpal.pro launched
          detail: >-
            Full home decarbonisation suite completed with heat pumps and smart meters; Enpal.pro B2B2C installer
            platform launched. Regulatory turbulence (GEG debate, subsidy scrap) dampens H2 solar demand.
          tone: neutral
        - date: Sep 2023
          label: Series D €215m at €2.2B valuation
          detail: >-
            TPG Rise Climate leads €215m Series D at €2.2 billion post-money valuation, joined by The Westly Group and
            Activate Capital.
          tone: positive
        - date: Aug 2024
          label: '2023 audited results: €905m revenue'
          detail: >-
            First publicly released audited results at near-€1B scale: €905m revenue (+118% YoY), €21m adj. EBITDA,
            positive operating cash flow.
          tone: positive
        - date: '2024'
          label: Revenue dip; €100m invested in new segments
          detail: >-
            Revenue declines to €860–890m (conflicting sources); company deliberately deprioritises profitability in H1
            to invest €100m in heat pumps, Enpal.One+, and C&I; returns to profitability in H2.
          tone: warning
        - date: '2024'
          label: €1.1bn debt facility; Flexa VPP JV
          detail: >-
            New €1.1bn debt facility from Barclays, BofA, and Crédit Agricole. Flexa JV with AI company Entrix launched
            to build Europe's largest virtual power plant.
          tone: positive
        - date: Apr 2025
          label: €110m equity round; oversubscribed
          detail: >-
            TPG Rise Climate leads €110m round with OPG, Westly Group, and an unnamed European insurer. Oversubscribed
            in one week; valuation not disclosed.
          tone: positive
        - date: Jan 2026
          label: '2025 results: >€1.1B revenue; free cash flow positive'
          detail: >-
            Preliminary 2025 results exceed €1.1B revenue (+25% YoY) and mark the first full-year positive free cash
            flow for the operational segment.
          tone: positive
        - date: Apr 2026
          label: CFO transition (3rd in <2 years)
          detail: >-
            Johannes Roehren appointed group CFO; Viktor Wingert moves to lead Shenzhen operations; Henning Rath
            departs. Third CFO appointment in fewer than two years.
          tone: warning
    approximationNotes: null
