companyProfile:
  summary: >-
    Founded in Berlin in 2017 by Mario Kohle, Viktor Wingert, and Jochen Ziervogel, Enpal has grown from a
    solar-as-a-service startup into one of Europe’s largest residential decarbonization platforms. The company combines
    rooftop PV, battery storage, wallboxes, heat pumps, smart metering, and the Enpal.One+ energy-management layer under
    a single homeowner relationship, financed through a mix of equity and large off-balance-sheet ABS and warehouse
    facilities. Enpal crossed 115,000 households served by the end of 2025, exceeded €1.1 billion in 2025 revenue, and
    claims market leadership in German residential solar, heat pumps, and competitive smart metering. The core diligence
    question is whether Enpal’s scale, financing innovation, and product breadth outweigh its still-limited financial
    transparency, service- quality complaints, and regulatory exposure in Germany.
