      - number: '2.3'
        title: Buyer Segmentation and Adoption Dynamics
        blocks:
          - type: paragraph
            body: >-
              The dominant buyer profile in German residential solar is the owner-occupier of a single-family or
              detached two-family home. They are simultaneously the buyer (decision-maker), user (consumer of
              self-generated electricity), and payer (either out-of-pocket, via KfW loan, or via a lease/ subscription
              like Enpal's model). Budget ownership rests entirely with the household; there is no third-party
              institutional procurement, making the market inherently fragmented and consumer- trust dependent.

              A second segment is the multi-family housing owner (Mehrfamilienhaus), which is smaller in addressable
              volume but growing via the EEG tenant-electricity (Mieterstrom) regime. Landlords receive a premium
              surcharge (Mieterstromzuschlag) for supplying PV electricity directly to tenants; this segment requires
              more complex metering and billing and is under-penetrated. A third micro-segment is the urban apartment
              renter, whose adoption path is limited to balcony solar (plug-in systems up to 800W inverter/2 kWp panel)
              — a high-growth but low-revenue-per- unit segment.

              Adoption triggers differ sharply by segment: owner-occupiers are primarily motivated by electricity cost
              savings and energy independence (especially since the 2022 energy crisis), with secondary motivations of
              environmental contribution and property value. The typical adoption path involves a 6–18 month
              consideration period, often triggered by a neighbor installation, energy-price shock, or targeted digital
              marketing. Survey data cited by Credence Research suggests that without subsidies, only ~40% of households
              would proceed with solar installation, underscoring subsidy dependency.

              The lease/subscription segment (Enpal's model) specifically targets households who want solar but prefer
              zero upfront capital outlay. This segment is price-sensitive at the monthly payment level rather than the
              system cost level, and is more exposed to interest rate changes. The installer-led cash-purchase segment
              dominates by volume (~60% of new installations) but is fragmented across thousands of SME installers.

              Key adoption constraints include: (1) financing costs—KfW 270 effective rates of 3.73%+ make a €20,000
              system carry roughly €750/year in interest; (2) installer bottlenecks from skilled-trade shortages
              limiting grid connection timelines; (3) subsidy policy uncertainty creating demand defer; (4) grid
              congestion in solar-dense southern German regions; (5) competitive Chinese module imports collapsing
              system prices but also squeezing installer margins and causing insolvencies (Zolar lost 50%+ jobs; ESS
              Kempfle, Fellensiek, Solarmax all filed for insolvency in 2024).
