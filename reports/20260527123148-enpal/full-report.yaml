  - id: FO002
    title: Company Snapshot Logic
    type: flow
    layout: standard
    summary: >-
      How Enpal's supply chain, financing structure, and product platform connect to generate hardware revenue,
      recurring revenue, and platform value, with key risk nodes identified.
    data:
      nodes:
        - id: supply
          label: Shenzhen supply chain hub
          detail: >-
            Direct hardware procurement for PV panels, batteries, heat pumps, and wallboxes; opened 2020. Gives cost and
            availability advantage versus distributor-dependent competitors.
          tone: positive
        - id: install
          label: In-house installer network
          detail: >-
            1,000+ employed installers and electricians; Dahlewitz Academy trains third-party partners. Vertical
            integration of installation reduces quality variance and builds customer trust.
          tone: positive
        - id: finance
          label: Off-balance-sheet financing book (>€5B)
          detail: >-
            Customer loans and rental contracts refinanced through bank-funded special-purpose vehicles. Allows
            zero-down-payment proposition without consuming equity capital.
          tone: positive
        - id: platform
          label: Enpal.One+ AI energy platform
          detail: >-
            Integrates solar, battery, heat pump, wallbox, and smart meter; optimises energy trading via VPP (Flexa JV
            with Entrix). Backbone of recurring revenue strategy.
          tone: positive
        - id: recurring
          label: Recurring revenue streams
          detail: >-
            Electricity tariff (16ct/kWh), smart meter fees (Metrify), maintenance packages, and VPP trading revenue.
            Metrify recurring revenues grew ~70% post-spin-off in 2025.
          tone: positive
        - id: risk_service
          label: Post-installation service risk
          detail: >-
            Trustpilot bimodal distribution (4.0–4.2/5, 27K+ reviews) and Stiftung Warentest caveats signal recurring
            service gaps that threaten customer retention and referral.
          tone: warning
      edges:
        - from: supply
          to: install
