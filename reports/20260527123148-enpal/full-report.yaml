              - CI036
          - type: callout
            title: Margin Opacity and Continuous Capital Dependence
            body: >-
              Enpal's 2.3% adjusted EBITDA margin in 2023, an acknowledged operating loss in 2024, and undisclosed 2025
              earnings leave financial quality effectively unassessable from public data. The business model requires
              continuous origination of new structured-debt facilities to fund customer installations; any disruption to
              capital-markets access—from rising rates, portfolio performance concerns, or lender fatigue—would directly
              constrain installation volume and revenue growth. This dependence, combined with a 2022 operating cash
              drain of -€375M, represents the central financial risk.
            calloutType: risk
            claimRefs:
              - CI021
              - CI023
              - CI027
              - CI044
              - CI045
          - type: callout
            title: Data-Room Requirements Before Further Commitment
            body: >-
              Any financial commitment to Enpal must be preceded by a data room covering: (1) audited IFRS consolidated
              income statements for 2024 and 2025 with gross margin by segment; (2) cohort-level CAC and customer
              retention; (3) consolidated liquidity and covenant schedule; and (4) detailed ABS waterfall economics
              including excess spread and equity-tranche returns. Without these inputs, the 2025 revenue milestone and
              positive-FCF claim cannot be verified and the €2.2–2.4B Series D mark cannot be assessed for continued
              relevance.
