      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Contradictory Estimates'
        blocks:
          - type: paragraph
            body: >-
              Sizing the market for German residential home electrification requires stacking lenses rather than relying
              on a single top-down analyst number. The broadest lens is the stock of potentially addressable buildings:
              Germany's ~16.2 million single-family and two-family homes represent the raw theoretical TAM. At an
              average installed cost of approximately €14,000 for a 10 kWp system with 10 kWh storage (2026 market
              pricing, 0% VAT), the one-time equipment TAM is roughly €180–230 billion over the multi-decade replacement
              cycle, or roughly €8–12 billion in annual spend assuming the current pace of ~400,000–600,000 new annual
              installations.

              Adding heat pumps (average system cost ~€15,000–25,000; ~299,000 units sold in 2025 at an estimated market
              value of ~$680 million USD) and EV wallboxes, the annual combined home electrification TAM for Germany is
              estimated at €10–15 billion in 2025, with growth to €12–18 billion expected for 2026 driven by storage
              acceleration (Q1 2026 storage additions up 67% year-on-year) and heat pump recovery. Analysts at S&P
              Global and Mordor Intelligence cite the total Germany solar market growing from ~$X to ~$X with a ~6% CAGR
              through 2031, though vendor-published TAM figures frequently blend residential with commercial and utility
              segments without cleanly separating them.

              The SAM (Serviceable Addressable Market) is considerably smaller. Roof suitability studies suggest 60–70%
              of single-family homes have technically viable roofs, reducing the addressable stock to roughly 10–11
              million homes. Of these, penetration at end-2025 is approximately 5 million systems across all segment
              sizes, leaving roughly 5–6 million households as the core greenfield SAM. At current average system
              values, the annual SAM opportunity is approximately €6–9 billion for solar and storage alone. Germany's
              2030 target of 215 GW installed solar capacity (vs. ~117 GW at end-2025) implies adding ~98 GW in four
              years— roughly 25 GW/year against a 2025 run-rate of 16.2 GW, requiring significant market expansion.

              Contradictory estimates exist: Fraunhofer ISE reports 16.2 GW net capacity added in 2025, while
              BSW-Solar's own fact sheet (including expected late registrations) shows 17.5 GW gross. IndexBox cites
              BSW's 3.51 GW Q1 2026 total market (down 6%), while pv-magazine's January 2026 headline was still citing
              17.5 GW for full-year 2025. These discrepancies reflect gross vs. net accounting differences and
              late-registration lag in the Marktstammdatenregister, not fundamentally different underlying trends.
