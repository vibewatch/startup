      - number: '7.6'
        title: Mitigants, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Despite the layered risks, there are genuine and evidence-supported mitigants. Enpal's smart meter
              footprint—as Germany's largest wMSB—gives it a structural compliance advantage under the 2025 PV control
              law that will take years for smaller rivals to replicate. The EIB and EIF guarantee on senior ABS tranches
              provides a credible institutional backstop. TPG's April 2025 equity injection and the participation of
              Barclays, BofA, Citi, and Crédit Agricole in the debt facility signal continued institutional confidence.
              Enpal's heat pump market leadership in Germany (claimed as of 2024) is a real diversification step, and
              the company's proprietary Enpal.One energy-trading platform creates a recurring software-value layer on
              top of hardware. The early 2025 return to profitability—if verified by internal financials—would confirm
              that the 2024 operating loss was cyclical rather than structural. Investors monitoring this opportunity
              should track the following indicators: monthly revenue trajectory and geographic mix, rolling
              service-ticket concentration (the 14%/66% ratio), ABS market spread versus internal funding costs,
              regulatory progress on the EEG reform proposal that would eliminate guaranteed feed-in tariffs, and the
              status of the labor law proceedings and Inexogy metering dispute. Thesis-break triggers should be defined
              tightly: if a revised EEG eliminates small-scale guaranteed feed-in without an offsetting direct-market
              mechanism; if Enpal loses access to ABS refinancing for more than one consecutive cohort; if labor law
              proceedings result in systemic findings or regulatory sanctions; or if two consecutive quarters show
              deepening operating losses without an evidence-supported path to EBITDA breakeven, each of these should
              trigger a re-underwriting rather than a continuation of prior position sizing.
