            title: Institutional Depth in Structured Financing
            body: >-
              Enpal has secured more than €5B in cumulative financing commitments from a diverse syndicate of tier-1
              institutions (M&G, CPP Investments, Barclays, Bank of America, Crédit Agricole CIB, Citi, ING, DWS,
              BlackRock). The breadth and depth of this lender base validates the asset quality of Enpal's solar and
              heat-pump contract portfolios and provides a meaningful capital-markets moat that new entrants would
              struggle to replicate quickly.
            calloutType: strength
            claimRefs:
              - CI037
