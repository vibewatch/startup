  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Policy Risks
        blocks:
          - type: paragraph
            body: >-
              Enpal operates in one of the most actively reformed energy regulatory environments in Europe. The German
              Bundestag passed legislation in February 2025 requiring all new PV installations to have a BSI-certified
              smart meter and an intelligent control unit; systems without such control are curtailed to 60% of rated
              output; and the EEG feed-in tariff is withheld during any period of negative electricity market prices for
              new PV of 2 kW or larger. Enpal framed itself as a beneficiary of these changes because it already deploys
              smart meters as Germany's largest competitive meter-point operator and because its Enpal.One AI manager
              avoids curtailment and trades surplus energy on the spot market. However, the longer-arc regulatory risk
              is more threatening: a 2026 draft reform proposal under discussion in Berlin would eliminate guaranteed
              feed-in tariffs for new small rooftop PV entirely, shifting operators to direct market exposure. If that
              proposal advances, consumer ROI narratives dependent on a guaranteed 20-year subsidy would need to be
              rewritten, potentially suppressing new customer demand in a market that already contracted 19% in 2024.
              Separately, labor law risk is active and material. Manager Magazin published an exposé in late 2024
              alleging systematic labor violations, excessive working hours approaching 60-hour weeks, and
              debt-servitude conditions for Latin American workers. Enpal won a December 2025 court order barring
              Manager Magazin from repeating specific allegations, but FAU Leipzig documented a separate wage-recovery
              case in which Enpal paid €8,500 in arrears following a labor dispute. Germany's Supply Chain Due Diligence
              Act (LkSG) adds a compliance layer requiring Enpal to audit contractor labor practices across its
              installation network. Consumer protection law adds further exposure: Verbraucherzentralen warn customers
              about long contract tenures, cancellation complexity, and opaque total-cost disclosure, and multiple law
              firms are preparing contract-cancellation cases on behalf of Enpal customers as of mid-2025.
