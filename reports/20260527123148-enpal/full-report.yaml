      - number: '3.4'
        title: Heating Vertical — Thermondo and Adjacent Alternatives
        blocks:
          - type: paragraph
            body: >-
              Thermondo (Berlin) is Germany's largest heat pump installer, with more than 50,000 heating systems
              installed (including 9,000+ heat pumps), over 1,000 employees, and investors including Brookfield, Future
              Energy Ventures, HV Capital, Vorwerk, Rocket Internet, and 10x. In April 2024 Thermondo acquired FEBESOL,
              a photovoltaic provider, extending its offering into rooftop solar. In July 2025 Thermondo secured €50M in
              SPV-backed loan financing to enable ~1,600 households to install heat pumps via 15-year instalment plans
              (thermondo flex), with monthly payments potentially below €100 after subsidies. This instalment/financing
              model structurally mirrors Enpal's own zero-down offering and indicates Thermondo is converging on Enpal's
              heat pump segment from the heating side. Enpal installed 600 heat pumps in 2023 and 4,300 in 2024; heat
              pumps now account for approximately one-third of Enpal's core business revenue as of 2025. The
              heating-vertical competition is therefore intensifying: Thermondo has distribution depth in the Handwerker
              and gas-boiler-replacement segments that Enpal is building out. Enpal's heat pump starts at €7,800 with
              financing after subsidies; Thermondo's at €9,000 after subsidies, suggesting Enpal is price-competitive.
              Both companies compete against the default status-quo of gas boiler replacement by traditional heating
              Handwerker, which remains the dominant outcome for most German households undergoing a Heizungstausch in
              2025.
            claimRefs:
              - CP019
              - CP020
