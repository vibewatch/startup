      - number: '5.2'
        title: Operating Architecture and Technology Platform
        blocks:
          - type: paragraph
            body: >-
              Enpal's technology layer sits between the physical hardware stack (modules, inverter, battery, heat pump,
              wallbox) and the customer-facing app. The EnpalBox is a local IoT edge device that aggregates data from
              all in-home energy assets over Modbus/TCP and MQTT protocols, providing 100+ real-time data points per
              household (solar production, battery SoC, heat pump temperature, grid import/export, wallbox status). The
              box communicates to Enpal's cloud over LTE/Ethernet. On the cloud side, Enpal's Chief Architect confirmed
              the company adopted MongoDB Atlas as a "hot storage" time-series layer; a single M30 cluster can handle up
              to 100,000 devices at roughly €6,600/year, which Enpal's team described as highly cost-effective. An
              open-source Home Assistant integration (github.com/derolli1976/enpal, 200+ stars) exposes the EnpalBox's
              local API, demonstrating that the box runs a documented local REST interface. Enpal migrated the IoT box
              operating system to a new platform in 2025, enabling greater automation and third-party integration.

              The Enpal consumer app (iOS version 1.32.0, released May 2026; Android 100,000+ downloads) provides live
              production monitoring, historical trend analysis, and remote EV-charging control. The App Store listing
              shows iOS 15.0 minimum and a 4.2/5 average across 4,456 ratings as of May 2026. Negative app reviews cite
              intermittent connectivity between the app and the EnpalBox and occasional data-display gaps, indicating
              reliability gaps at the edge layer.

              For the VPP layer, Enpal and AI-trading specialist Entrix formed the Flexa joint venture in January 2024
              (Enpal holds the controlling stake). Flexa trades household batteries on the five-minute continuous
              intraday market (as opposed to the day-ahead market used by earlier VPP providers), enabling more frequent
              arbitrage cycles: charge when spot prices are low or negative, discharge during peak-price windows. The
              system reached 10,000 participating households and 400 MW aggregated capacity by December 2025. Enpal's
              own press release states the full 80,000+ customer base is the eventual expansion target. The gridX
              podcast with Enpal's Dr. Wolfgang Gründinger describes the architecture as "the Apple of the energy
              transition — combining sleek technology with a fully connected ecosystem," emphasising vertical
              integration over open standards.
