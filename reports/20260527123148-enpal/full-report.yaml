  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base spans three distinct segments — direct residential, installer-partner, and commercial
        blocks:
          - type: paragraph
            body: >-
              Enpal's revenue-generating customer base is dominated by direct residential homeowners in Germany and
              Italy. The January 2026 press release and the July 2025 factsheet both confirm more than 115,000
              households served across Germany and Italy at year-end 2025, with more than 300,000 distributed energy
              resources (DER) connected to the Enpal platform. The core offering is an integrated all-in-one package —
              photovoltaic system, battery storage, EV wallbox, smart meter, and heat pump — sold on a 20-year lease or
              a flexible purchase-financed basis. Within this segment Enpal can be sub-segmented further: (a) solar-only
              or solar-plus-storage customers who entered the platform from 2019 onward, (b) heat-pump customers added
              from 2023 who now represent roughly one-third of core-business revenue, and (c) cross-sell adopters who
              hold multiple product lines. Geographic concentration follows home-ownership density: Enpal's August 2025
              press release identifies North Rhine-Westphalia, Baden-Württemberg, Lower Saxony, Bavaria, and Hesse as
              the five German states with the highest concentration of installations.


              The second segment is the installer-partner channel, Enpal.pro, launched in 2023 by co-founder Lukas
              Pauly. Enpal.pro is a B2B2C platform through which regional PV and SHK installers access material
              logistics, planning tools, financing solutions, customer leads, smart-meter operations, and
              grid-connection support. PV Magazine reported in March 2025 that Enpal intended to make installer
              partnerships the central pillar of its business model going forward, a significant strategic
              repositioning.


              The third segment is Commercial and Industrial (C&I), launched in April 2024 with the first named
              installation being a 250 kWp rooftop system at Golf Valley München. The July 2025 factsheet confirms C&I
              is an active product line and growing, though no public customer count, revenue contribution, or named
              reference list beyond the Golf Valley pilot has been disclosed.
