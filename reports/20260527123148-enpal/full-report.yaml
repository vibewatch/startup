  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Structure
        blocks:
          - type: paragraph
            body: >-
              Enpal operates in the German residential home-electrification market, broadly defined as the installation,
              financing, and servicing of distributed energy assets on private dwellings. The core addressable spend
              includes rooftop photovoltaic (PV) systems (typically 5–20 kWp for single-family homes), co-located
              battery storage (5–15 kWh), and increasingly heat pumps and EV wallboxes as adjacent products on the same
              household energy stack. Excluded from the core scope are utility-scale and commercial/industrial rooftop
              solar (above 30 kWp), ground-mounted parks, and public EV fast-charging infrastructure. The status-quo
              substitute is a grid-only household purchasing electricity at the standard retail rate (averaging
              ~€0.30–0.35/kWh in 2026) with a gas or oil boiler for heating.

              Germany is Europe's largest PV market and home to approximately 16.2 million single- and two-family
              residential buildings. As of end-2025, more than 5 million PV systems were operational (cumulative
              installed capacity 116.8 GW across all segments), with residential rooftop below 30 kW accounting for
              roughly 38 GW of this total. Battery storage has grown rapidly: BSW-Solar reports 26 GWh cumulative
              storage capacity as of early 2026, with 82% in residential installations. The heat pump adjacency is real
              and growing—299,000 residential heat pumps were sold in Germany in 2025, representing 48% of all new
              heating systems. EV wallbox demand is accelerating alongside the broader EV market; the German EV charging
              infrastructure market is estimated at approximately $1.36 billion in 2025 and forecast to reach $1.75
              billion by 2026, with residential installations growing fastest.

              Key structural boundaries: the residential sub-30 kW segment (Enpal's home turf) is governed by the EEG
              feed-in tariff regime, 0% VAT on hardware and installation since 2023, KfW loan 270 financing at rates
              from 3.73% effective annual, and an EU state-aid framework that has delayed some higher-band tariff
              uplifts from Solarpaket I. Adjacent spend in heat pumps is governed by the Building Energy Act
              (GEG/Gebäudeenergiegesetz) and KfW subsidy programme 458. Wallboxes remain subject to 19% VAT (unlike PV
              hardware), limiting natural bundle economics slightly.
