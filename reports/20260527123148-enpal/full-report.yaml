      - number: '1.4'
        title: Funding History, Capital Structure, and Valuation
        blocks:
          - type: paragraph
            body: >
              Enpal has assembled a capital structure with two distinct components: equity from venture and growth
              investors that funds operations and growth capex, and a large off-balance-sheet debt book that funds the
              long-dated consumer financing that underlies its rental and purchase-loan products.

              On the equity side, the company raised an undisclosed seed round and earlier rounds with SoftBank Vision
              Fund II, HV Capital, Picus Capital, Team Europe, and Princeville Climate Technologies in its early years.
              By 2021, these rounds supported a valuation exceeding $1 billion, giving Enpal unicorn status. In
              September 2023, Enpal closed a Series D of approximately €215 million led by TPG Rise Climate at a
              post-money valuation of approximately €2.2 billion (USD $2.35 billion at the time), with The Westly Group
              and Activate Capital also joining. This was Reuters-reported and confirmed by Enpal. In April 2025, Enpal
              raised a further €110 million, again led by TPG Rise Climate, with participation from The Westly Group,
              the Ontario Power Generation Pension Fund (OPG), and an unnamed leading European insurance group as a new
              investor. The round was described as significantly oversubscribed after one week. Enpal declined to
              disclose a valuation for the 2025 round, making the last confirmed valuation the €2.2 billion figure from
              September 2023. Total equity raised exceeds €600 million per the July 2025 factsheet.

              The debt book is substantially larger. In December 2022, Enpal secured €855 million in debt refinancing
              from BlackRock Alternatives, ING, Pricoa Private Capital, UniCredit, and Infranity. In 2024, a new €1.1
              billion debt facility was arranged with Barclays Europe, Bank of America, and Crédit Agricole CIB,
              enabling Enpal to continue offering zero-down customer financing at scale without diluting equity. The
              company's factsheet reports that total refinancing commitments for its financing solutions exceed €5
              billion, dwarfing the equity base and underscoring the financial complexity of the balance sheet. Covenant
              terms, asset pledge structures, recourse provisions, and the exact vehicle structure of customer financing
              are not publicly described and require data-room review.
