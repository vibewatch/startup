      - number: '8.3'
        title: Financing Structure, Scenarios, and Sensitivity
        blocks:
          - type: paragraph
            body: >
              Enpal's capital structure is multi-layered and unconventional by European standards. Total equity raised
              across all rounds amounts to approximately EUR 325 million at disclosed closes, with investor base
              anchored by SoftBank Vision Fund II (EUR 130 million, Series C, October 2021), TPG Rise Climate (lead
              across Series D at EUR 215 million in January 2023 and the April 2025 growth round at EUR 110 million),
              Activate Capital, The Westly Group, and early financial infrastructure investors including BlackRock
              Alternatives, ING, UniCredit, and Pricoa Private Capital in the December 2022 structured refinancing. The
              company has exceeded EUR 5 billion in total financing commitments as of October 2024, the vast majority
              structured through ABS/warehouse facilities.

              The ABS model places customer solar-lease and ownership contracts into off-balance-sheet SPVs, enabling
              Enpal to monetise long-duration recurring cash flows from homeowners at lower interest rates than equity,
              but creates sensitivity to both credit-market tightening and rising base rates. The March 2024 EUR 1.1
              billion ABS facility from Barclays Europe, Bank of America, and Credit Agricole CIB with CPP Investments
              in mezzanine is the primary structural instrument. Its covenant terms and waterfall are not publicly
              disclosed, a critical diligence gap for assessing downside scenarios.

              Three investment scenarios are modelled. The bull case (approximately 25% probability signal) assumes
              Enpal expands into four or more European markets by 2028, achieves sustained EBITDA margins above 10%, and
              benefits from ABS market deepening toward US precedent; at a 3.5x multiple on EUR 1.8 billion revenue the
              implied valuation exceeds EUR 6 billion. The base case (approximately 50%) assumes Germany and Italy hold,
              EBITDA turns structurally positive by 2026, and multiples stabilise near 2.5x on EUR 1.5 billion; implied
              valuation approximately EUR 3.75 billion. The bear case (approximately 25%) assumes 2025 FCF is not
              replicated in 2026, ABS refinancing tightens, revenue stagnates around EUR 1.0 to 1.1 billion, and
              multiples compress to 1.5x; implied valuation approximately EUR 1.5 to 1.65 billion, a material down round
              from the last disclosed mark.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV021
              - CV025
              - CV026
              - CV027
              - CV035
          - type: table
            tableRef: TV004
            claimRefs:
              - CV025
              - CV026
              - CV027
      - number: '8.4'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Exit readiness for Enpal at its current stage is constrained but credible over a 3 to 5 year horizon. No
              public evidence of an imminent IPO process or regulatory filing exists as of Q2 2026; management has not
              disclosed a timeline, and the April 2025 equity raise did not include an IPO ratchet or public-market
              commitment clause. Strategic exits via a European utility (E.ON, EnBW, EDF) or a large infrastructure
              investor represent the most likely near-term liquidity paths, supported by Enpal's asset-heavy ABS model
              which is readily compatible with infrastructure fund ownership structures. A Frankfurt or EURONEXT IPO
              remains possible in 2027 to 2028 if EBITDA proof and positive public-market comparable sentiment converge.

              Preference overhang from multi-round financing creates structural complexity for common equity holders.
              The Series C (approximately EUR 950 million post-money) and Series D (EUR 2.2 billion post-money) imply
              meaningful senior liquidation preferences above an earlier class; exact stacking is not publicly disclosed
              and is a priority diligence item.

              Five thesis-break triggers warrant explicit monitoring. A 2025 audit revealing EBITDA loss would collapse
              the FCF narrative and prompt immediate re-rating. An ABS refinancing gap of EUR 500 million or more would
              signal capital structure stress. A revenue miss of more than 10 percentage points below guidance in 2026
              would break the growth thesis. An adverse German regulatory ruling eliminating key solar subsidies would
              compress the addressable market. A confirmed down round below EUR 1.8 billion would signal investor
              confidence erosion and trigger base-case reassessment.
            claimRefs:
              - CV028
              - CV029
              - CV033
              - CV036
              - CV043
              - CV045
          - type: table
            tableRef: TV005
            claimRefs:
              - CV006
              - CV027
              - CV032
              - CV035
          - type: table
            tableRef: TV006
            claimRefs:
              - CV013
              - CV029
              - CV032
              - CV043
              - CV045
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Conditional Track: Await Three Evidence Gates'
            body: >
              Current evidence supports a conditional track stance. Do not invest above EUR 3B EV without audited 2025
              EBITDA confirmation, an updated valuation mark (post-January 2023), and ABS covenant disclosure. An entry
              at or below EUR 2 billion enterprise value acquires Enpal at under 2x 2025 revenue, a discount exceeding
              60% to Sunrun's public EV/Revenue multiple, creating meaningful upside if the three evidence gates clear.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV043
              - CV044
          - type: callout
            title: 'Down-Round Risk Is Material: 2025 Evidence Is Necessary Not Sufficient'
            body: >
              The April 2025 EUR 110 million equity raise at an undisclosed valuation, combined with a roughly EUR 50
              million operating loss in 2024, creates a credible scenario in which a new valuation mark falls below the
              January 2023 EUR 2.2 billion reference. This is consistent with broader late-stage down-round trends in
              2026. The 2025 positive operating free cash flow is encouraging but not sufficient: EBITDA and cash
              conversion must be confirmed through an independent audit before the risk of a valuation reset can be
              dismissed.
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV024
              - CV032
              - CV033
          - type: callout
            title: ABS Model Is a Competitive Advantage and a Concentration Risk
            body: >
              Enpal's ABS securitisation model, placing customer contracts into off-balance-sheet SPVs backed by
              Barclays, Bank of America, CPP Investments, and others, is the most operationally innovative aspect of the
              business and enables capital deployment at scale unachievable by equity-only peers. However, the model
              concentrates credit and refinancing risk in a structure whose covenant terms are undisclosed publicly. If
              ABS markets tighten by 100 to 200 basis points from 2024 levels, refinancing cost increases will compress
              margins and may impair the platform economics underpinning the entire growth thesis.
            calloutType: insight
            claimRefs:
              - CV012
              - CV013
              - CV035
