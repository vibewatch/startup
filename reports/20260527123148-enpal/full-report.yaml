      - number: '6.2'
        title: Adoption trajectory shows market outperformance; named proof base is thin but independently corroborated
        blocks:
          - type: paragraph
            body: >-
              Enpal's 2025 growth is notable because it occurred against a contracting market. EUPD Research's August
              2025 Market Leadership Study confirmed that European residential solar installations fell roughly 20%
              year-over-year in 2024. Enpal grew its PV and heat pump customer base by more than 30,000 in 2025, ending
              the year at more than 115,000 households; this implies sustained outperformance. Revenue grew 25%
              year-over-year to more than €1.1 billion in the operational subgroup, from €890 million in 2024. The same
              EUPD Research study names Enpal as one of Europe's top three residential solar installers alongside
              1KOMMA5° and E.ON Solar — providing independent confirmation of scale and sector-coupling capability.


              The heat pump trajectory is the most impressive single data point in the adoption file. Enpal entered heat
              pumps only in 2023 and by the first half of 2025 had already installed more than 10,000 systems, achieving
              market leadership in Germany within two years. An independent zNT ranking cited in the August 2025 press
              release places Enpal first in Germany with more than 4,300 new heat pump installations in 2024. The heat
              pump segment now accounts for roughly one-third of core-business revenue.


              The metrify smart-metering subsidiary, spun off in summer 2025, grew its recurring revenues roughly 70%
              following the spin-off. With more than 50,000 smart meters installed, metrify adds an important
              recurring-revenue proxy that is largely independent of PV lease tenure. Named customer proof for the
              residential segment is limited to aggregate Trustpilot reviews and the single named commercial customer.
              Enpal does not publish individual household case studies — a structural feature of the residential solar
              category rather than an Enpal-specific gap.
