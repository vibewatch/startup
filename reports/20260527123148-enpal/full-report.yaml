      - number: '5.5'
        title: Trust, Safety, Security, Privacy and Quality Controls
        blocks:
          - type: paragraph
            body: >-
              Enpal holds two primary quality certifications as of May 2026. The first is the VDE "Standardized PV Power
              Plant" certificate (issued July 2023, renewed 2024 by VDE Renewables GmbH), making Enpal the first company
              in Germany to receive this credential for residential rooftop installations. VDE's review covered the
              complete process including planning, engineering, logistics, and the Elektromeister quality oversight
              structure in each regional branch. The second is TÜV Saarland customer satisfaction certification
              (certificate number SC46217) with a "Gut" rating. The awards page also lists two additional VDE
              certifications (2023, format not specified) alongside Chip Testsieger 2025 (overall "gut") and the
              company's consecutive wins in Die Welt Service-Champion rankings (2023, 2024, 2025).

              On data privacy, the Enpal app's App Store listing discloses that "contact information" is linked to user
              identity and "identifiers" and "diagnostics" are collected but not linked. The company's website includes
              a standard DSGVO (GDPR) privacy policy. No public disclosure of ISO 27001, SOC 2, or similar
              information-security certifications exists; this is a gap for enterprise or regulatory due-diligence
              purposes. On electrical safety, all Enpal installations comply with DIN VDE 0100 wiring standards,
              overseen by an Elektromeister. Consumer review site energiefluss24 cites instances of "DIN VDE not
              maintained" in a subset of fault cases, indicating that sub-contractor variability is a live risk despite
              the certification structure.

              The adverse pattern in public reviews is consistent: 80%+ satisfaction pre- and during installation, but
              17–30% of reviewers cite post-commissioning service failures including unreachable hotlines (30+ minute
              wait times), 5–7 day email response times, and delays in utility grid-connection administration. The
              consumer protection body Verbraucherzentrale has issued warnings about Enpal's contract terms,
              particularly regarding service responsibilities and price escalation clauses. Enpal has responded to
              specific media allegations with legal action (Berlin court injunction against Manager Magazin in 2025),
              suggesting the company actively defends its reputation but also that contested claims exist.
