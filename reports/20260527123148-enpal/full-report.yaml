  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Structure
        blocks:
          - type: paragraph
            body: >
              Enpal's primary revenue engine is a 20-year rental contract under which the company installs, owns, and
              services a distributed energy resource (DER) at a customer's home and charges a fixed monthly fee. The
              customer bears no upfront capital cost; instead they pay a recurring rent that includes installation,
              maintenance, monitoring, and insurance for the full 20-year term. At contract maturity the asset transfers
              to the customer at no additional cost. This model generates stable, long-duration recurring cash flows at
              the portfolio level, but the economics are deeply capital-intensive: Enpal must pre-finance each
              installation via special-purpose vehicles (SPVs) and asset-backed securities (ABS) warehouses, so the
              business bears substantial balance-sheet leverage relative to reported revenues.


              Monthly list prices as of 2025 range from approximately €59/month for a compact solar PV system (~4 kWp)
              to €120–140/month for a large system (~10 kWp). Battery storage, wallbox EV charging, and smart metering
              can be added as monthly increments. Heat pumps are available as an add-on or standalone product under the
              same rental framework, with pricing not publicly disclosed. A flexible consumer loan product (Enpal
              EasyFlex) was introduced in 2023 to serve customers who prefer ownership rather than rental.


              Revenue recognition follows the recurring-fee model: monthly rental income is recognised over each period.
              Enpal's heat pump division, launched in 2023, had grown to represent roughly one-third of core segment
              revenue by 2025 (approximately €367M on a €1.1B+ base). The solar PV rental stream remains the primary
              driver, while battery, smart-metering, and EV-charging revenues are growing but undisclosed as individual
              line items. Importantly, the ABS warehouse structure routes solar-contract cash flows through SPVs,
              creating a split between Enpal Operating Company cash flows and SPV-level asset cash flows that
              complicates analysis of consolidated free cash flow.
