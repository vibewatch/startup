  - id: TV005
    title: Thesis-Break Triggers and Monitoring Criteria
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - 2025 EBITDA audit reveals operating loss
        - Operating loss above EUR 30M in audited 2025 P&L
        - FCF narrative collapses; revenue quality questioned; growth thesis broken
        - Downgrade to avoid; exit at next liquidity window
      - - New financing round below EUR 1.8B valuation
        - Confirmed equity raise or secondary at below EUR 1.8B
        - Investor confidence signal; base case scenario invalidated
        - Reassess thesis; reduce target valuation range to bear case
      - - ABS refinancing gap or covenant breach
        - EUR 500M+ refinancing need unmet or covenant clause triggered
        - Capital structure distress; liquidity risk; asset impairment risk
        - Immediate review; escalate to distressed scenario
      - - Revenue growth below 10% in 2026
        - Full-year 2026 revenue growth below 10% vs 2025 EUR 1.1B base
        - Growth narrative breaks; multiple compression to 1.5-2x justified
        - Re-model; reduce target; track-to-exit mode
      - - Adverse German regulatory ruling on solar subsidies
        - Subsidy elimination or major reduction affecting TAM above 20%
        - Germany revenue base contracts; EU expansion cannot compensate near-term
        - Re-model Germany TAM; assess diversification pace
    notes: >
      Trigger thresholds are indicative and should be calibrated to the specific investor's risk tolerance and entry
      price. Monitoring cadence recommended: quarterly revenue and FCF review; annual EBITDA audit; continuous ABS
      market tracking.
