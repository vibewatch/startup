      - number: '5.3'
        title: Deployment, Integration, Support and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Enpal executes installations through a hybrid model: an in-house workforce alongside a vetted regional
              sub-contractor network. Each regional branch employs a licensed Elektromeister (master electrician) as
              quality supervisor, which was a prerequisite for the 2023 VDE certification. The company launched the
              Enpal Academy in 2020 — described as the largest solar-industry training centre in Europe — to certify
              both in-house and partner installers. As of Q1 2024, the Academy had created over 1,000 jobs in solar
              trades and was targeting a further 1,000 in heat-pump trades. The €110 million April 2025 raise
              specifically earmarks scaling the Enpal.pro B2B installer platform, which provides national purchasing,
              logistics, planning, and financing access to independent HVAC/PV installers who use Enpal's supply chain
              but install under their own brand.

              Customer reviews (over 2,500 Trustpilot reviews analysed by Gruenes.haus in mid-2025) report that 80%+ of
              installations complete satisfactorily within the 6-week promised window and that the physical installation
              quality is generally positive. However, post-installation service — particularly grid-connection
              registrations, feed-in tariff administration, and customer support reach — attracts the majority of 1-star
              complaints. The energiefluss24 analysis (based on structured Trustpilot data as of February 2026) cites a
              12–18% technical fault rate, which is characterised as the highest among surveyed providers. Enpal
              publicly disputes unspecified press allegations (a 2025 Manager Magazin article was subject to a Berlin
              court injunction).

              The roadmap as of 2026 focuses on four pillars: (a) scaling heat-pump installations toward the company's
              €1 billion heating-sector revenue target originally stated for 2026; (b) growing VPP participation from
              10,000 to all 80,000+ existing customers; (c) expanding smart meter gateway rollout (10,000 installed as
              of a corporate blog post); and (d) Enpal.pro B2B platform expansion. The April 2025 equity raise of €110
              million was explicitly earmarked for these four pillars. European expansion (Italy, further markets) is
              discussed in investor materials but no official product launch timeline has been published.
