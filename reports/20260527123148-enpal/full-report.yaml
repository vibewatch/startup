      - number: '3.3'
        title: Utility Incumbents — E.ON Solar and the Utility Channel
        blocks:
          - type: paragraph
            body: >-
              E.ON Solar is the most resourced incumbent competitor in Germany's residential PV segment, named alongside
              Enpal and 1Komma5 in the EUPD Research Market Leadership Study. E.ON offers turnkey solar packages at
              transparent fixed prices: Paket S (4 kWp + 5.12 kWh battery) from €11,999; Paket M (9.86 kWp + 7.7 kWh
              battery) from €16,999; and Paket L (13 kWp + 10 kWh battery) from €19,999. Each package includes the E.ON
              Home Energy Manager, a 10-year product and performance warranty, and managed installation through E.ON's
              partner network. E.ON's competitive advantages include brand trust from its utility heritage, an existing
              residential customer relationship base, and nationwide installer networks. Its limitation relative to
              Enpal is that it does not offer the same lease/zero-down model; E.ON packages require upfront payment or
              consumer financing. RWE and Vattenfall have not established comparable residential PV retail positions and
              focus primarily on utility-scale generation, making them non-material competitive threats in the
              residential segment as of 2026. The German solar industry body (BSW Solar / Solarwirtschaft) notes the
              broad market fragmentation: over 5 million solar arrays installed nationwide by April 2025 with 104 GWp
              total capacity, the vast majority installed by regional Handwerker rather than the top three national
              players. Enpal's main channel competition against E.ON is in the segment of homeowners who seek a
              nationally branded, end-to-end-managed solution but have the capital for upfront purchase rather than
              requiring a lease. E.ON's entry into the HEMS (Home Energy Management System) space through its Home
              Energy Manager creates a potential vector for expanding software lock-in similar to Enpal.One+.
