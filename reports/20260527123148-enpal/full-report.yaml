  - id: FU003
    title: Customer proof matrix
    type: matrix
    summary: >-
      Maps the quality dimensions of Enpal's publicly available customer proof set across four proof surfaces, showing
      that aggregate review data is strong but named individual-account proof with quantified outcomes is absent.
    approximationNotes: >-
      Cell labels are qualitative assessments grounded in the cited sources. Independence column reflects the degree to
      which evidence originates from a party other than Enpal.
    data:
      columns:
        - Aggregate Trustpilot reviews
        - Independent market rankings
        - Named C&I customer (Golf Valley)
        - Adverse review analyses
      rows:
        - label: Production deployment confirmed
          values:
            - label: 'Yes: 31,000+ live residential customers; production deployments, not pilots'
            - label: 'Yes: EUPD Research and zNT base rankings on installed capacity and deployments'
            - label: 'Yes: 250 kWp rooftop system installed April 2024; CEO testimonial confirms production'
            - label: 'Yes: post-installation complaints confirm production deployments in service'
        - label: Outcome specificity
          values:
            - label: 'Low: scores aggregate across all customers; no individual energy or bill outcome'
            - label: 'High: market leadership claim grounded in installed capacity and sector-coupling data'
            - label: 'Medium: energy autarky goal stated; no quantified kWh generation or EUR savings'
            - label: 'Medium: service failure patterns specific; financial impact to customer not quantified'
        - label: Independence and source tier
          values:
            - label: 'High: Trustpilot is independent; review volume and recency are verifiable'
            - label: 'High: EUPD Research and zNT are independent analysts; methodology stated'
            - label: 'Medium: Berlin Startups is press coverage of company announcement; CEO quote may be co-crafted'
            - label: 'High: adverse analyses (gruenes.haus, cps-schliessmann) written without Enpal input'
        - label: Retention visibility
          values:
            - label: 'Low: review score does not capture contract tenure or voluntary exit frequency'
            - label: 'Low: rankings measure installation volume and sector coupling, not multi-year retention'
            - label: 'Low: single installation; no multi-year operating history disclosed'
            - label: 'Medium: adverse data implies at-risk customers but does not show exit rates'
