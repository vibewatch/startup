      - number: '3.2'
        title: Direct Digital-Native Peers — 1Komma5° and Zolar
        blocks:
          - type: paragraph
            body: >-
              1Komma5° (Hamburg, founded 2021) is Enpal's closest direct peer and its most consequential competitive
              threat. The company reported €520M in revenue for 2024 (up from €450M in 2023), employs ~2,500 people
              across 80 sites in 7 markets, and raised €150M in a pre-IPO round in July 2025, bringing total equity to
              ~€400M (debt-free). Its differentiating asset is Heartbeat AI, an energy management and virtual power
              plant (VPP) platform that—as of November 2025—has been opened to millions of existing non-1Komma5 systems.
              The platform manages 500 MW of flexible capacity across ~50,000 connected systems; 1Komma5 targets 20 GW
              by 2030. The key strategic difference versus Enpal: 1Komma5 charges a flat-rate software fee and passes
              market-trading gains to customers rather than retaining them as an energy-supply margin. This
              open-ecosystem, value-pass-through model is structurally different from Enpal's closed Enpal.One+ and may
              be more attractive to the large retrofit segment. Founder Philipp Schröder has called Kraken (Octopus
              Energy's technology platform) the closest competitor to Heartbeat AI, not Enpal's VPP—a framing that
              positions 1Komma5 as a software business, not primarily an installer. Less than 50% of 1Komma5's orders
              are now solar, with heat pumps, batteries, and EV charging making up the rest, mirroring Enpal's own
              diversification trajectory. Zolar (Berlin, founded 2016) raised ~€300M total from VCs including Partech,
              AENU, and Energy Impact Partners, and grew revenues from €41M (2022) to €86M (2023) before incurring a
              €24M net loss. Faced with sharply declining consumer demand and rising financing costs, Zolar initiated
              insolvency proceedings in self-administration in July 2025 and pivoted from D2C installation to selling
              software and configuration tools to local installers, reducing its workforce from ~400 to ~50. Zolar's
              collapse is adversely informative: it demonstrates that the D2C solar installer model without asset-light
              financing and proprietary software is not economically sustainable at scale in a normalised German demand
              environment.
