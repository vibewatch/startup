      - number: '3.5'
        title: Switching Costs, Lock-in, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Enpal's primary switching-cost mechanism is its lease and financing model: residential customers typically
              sign 20-year lease agreements or multi-year financing contracts for solar and battery systems. Early
              termination involves contractual complexity and potential financial penalties, creating strong post-sale
              stickiness. The second layer of lock-in is the Enpal.One+ energy management platform, which connects solar
              generation, battery storage, EV charging, and heat pumps into a household energy operating system.
              Households enrolled in the Enpal.One+ VPP receive electricity from 19 Cent/kWh and can earn up to €2,000
              per year in Enpal compensation for grid flexibility. Exiting the platform means losing access to these
              monetisation streams. A third switching cost is the proprietary smart meter and monitoring infrastructure;
              moving to a competitor would require hardware replacement. Despite these moats, 1Komma5's Heartbeat AI—now
              open to existing non-1Komma5 hardware—could allow Enpal customers to plug into a competing VPP without
              hardware replacement if Enpal.One+ access can be bypassed. This is an unresolved diligence question. The
              moat against the local Handwerker is distribution simplicity, nationwide brand trust, and financing—the
              Handwerker channel lacks national scale, financing infrastructure, and software capability.
              Commodity-hardware risk is real: solar modules are globally priced, and Enpal's hardware margin depends on
              procurement, not differentiation. The durable moat must therefore rest on software, financing, and VPP
              scale. Adverse evidence includes Enpal's 2024 revenue decline from €905M to €860M and its decision to
              prioritise investment over profitability in H1 2024, while 1Komma5 maintained operational profitability
              throughout and reported stronger organic growth.
