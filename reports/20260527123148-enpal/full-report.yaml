      - number: '7.2'
        title: Operational and Service Quality Risks
        blocks:
          - type: paragraph
            body: >-
              Enpal's operating model is capital-light at the point of sale—customers pay no upfront cost—but
              execution-heavy on the back end: the company must install, commission, connect to the smart metering
              system, and then service a growing fleet of residential energy assets over multi-year contracts. This
              model works when installation capacity, software reliability, and field-service coverage scale in
              proportion with sales. Evidence from multiple independent sources suggests those ratios slipped materially
              in 2023–2024. The CPS Schliessmann strategic analysis finds that 14% of Enpal's approximately 90,000 PV
              customers generate 66% of all service tickets, indicating concentrated operational failure modes rather
              than broadly distributed friction. Reklamation24 lists over 500 formal complaints with a
              complaint-resolution rate below 40%; consumer review aggregators document patterns of delayed
              installations, incorrect meter setups, app and software failures, and aggressive or misleading sales
              tactics. A metering-related legal dispute filed by infrastructure partner Inexogy—claiming nearly €900,000
              in unpaid invoices and alleging unauthorized meter installations—adds a third-party credibility layer to
              the operational friction picture. The heat pump expansion amplifies execution risk because heat pump
              installations are more technically demanding than rooftop PV: they require certified heating engineers,
              in-building plumbing integration, and grid-connection paperwork that differs by municipality.
              Skilled-trades shortages in Germany make scaling this workforce quickly difficult, and sourcing from Latin
              American labor pools—a route Enpal already used for PV—has attracted the labor law scrutiny described in
              the prior section. Any service backlog on the existing 100,000-customer solar fleet that is compounded by
              heat pump onboarding problems would steepen the ticket concentration already visible in public data.
