  - id: FU004
    title: Structural retention proxy matrix
    type: matrix
    summary: >-
      No public cohort retention data is available for Enpal. This matrix maps structural retention proxies and
      available evidence quality across five dimensions for the residential B2C segment. Cells are qualitative
      assessments, not measured rates.
    approximationNotes: >-
      All cells are structural estimates and analyst assessments grounded in cited sources. No audited retention data
      has been disclosed. The cohort type is not used because Enpal does not publish numeric NRR, GRR, or
      period-over-period retention percentages.
    data:
      columns:
        - Year 1 contract
        - Year 2 to 5
        - Year 6 to 10
        - Year 10 to 20
      rows:
        - label: Contractual lock-in strength
          values:
            - label: Very high — no standard break clause in first year; 20-year lease fully binding
            - label: High — physical removal and roof repair create strong economic deterrent to exit
            - label: High — multi-product bundles deepen switching cost as heat pump and wallbox added
            - label: Moderate to high — approaching end-of-term; renewal or ownership transfer likely offered
        - label: Review-based satisfaction signal
          values:
            - label: Positive — installation phase receives 82 to 88 percent excellent or good ratings
            - label: Mixed — post-activation service complaints emerge within months of installation
            - label: Unknown — no public longitudinal satisfaction data available
            - label: Unknown — no public longitudinal satisfaction data available
        - label: Financial default risk proxy
          values:
            - label: Low estimate — EFS consumer loan underwriting filters high-risk applicants
            - label: Unknown — no vintage cohort payment data publicly disclosed
            - label: Unknown — 15-year+ horizon; macroeconomic sensitivity over long contract life
            - label: Unknown — end-of-contract refinancing and equipment condition not disclosed
        - label: Data availability
          values:
            - label: Company claims and review signal only; no audited retention data
            - label: Review signal only; no cohort or payment-performance data
            - label: Not disclosed by Enpal; no independent source available
            - label: Not disclosed by Enpal; no independent source available
