      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 2027 EEG Reform Could Halve Residential Solar Demand
            body: >-
              The German government's draft EEG reform proposes eliminating the fixed feed-in tariff for all new PV
              systems up to 25 kW starting January 2027. BSW-Solar warns this would jeopardise tens of thousands of jobs
              and slow solar expansion significantly. Industry surveys suggest only ~40% of prospective buyers would
              proceed without a guaranteed tariff. For Enpal, which relies on the EEG tariff as part of its subscription
              ROI model, this represents a structural threat requiring immediate product and pricing model adaptation.
              The 2026 pull-forward effect may inflate near-term metrics while masking the underlying post-2026 demand
              cliff risk.
            calloutType: risk
            claimRefs:
              - CM029
              - CM030
              - CM031
          - type: callout
            title: Battery Storage Acceleration Expands Enpal's Bundle Revenue
            body: >-
              While residential PV installations are declining, battery storage is accelerating sharply: Q1 2026 saw 2
              GWh of new residential + commercial storage commissioned, up 67% year-on-year, setting a record. Germany
              now has 26 GWh of cumulative storage capacity with 82% in residential systems. This trend structurally
              expands the revenue per customer for operators like Enpal who can bundle storage, heat pumps, and EV
              wallboxes alongside the core solar installation. The self-consumption economics of a 10 kWp solar + 10 kWh
              battery system (payback ~11 years vs. ~8 years standalone PV) reinforce customer retention throughout a
              subscription lifecycle.
            calloutType: strength
            claimRefs:
              - CM005
              - CM006
              - CM014
              - CM033
          - type: callout
            title: Contradictory Sizing Estimates Require Diligence on Market Share Claims
            body: >-
              Multiple sources cite different Germany solar capacity additions for 2025: Fraunhofer ISE reports 16.2 GW
              net, BSW-Solar's fact sheet shows 17.5 GW gross (including estimated late registrations). Analyst vendors
              like Mordor Intelligence blend residential, commercial, and utility segments into a single market figure.
              Investors should apply careful boundary logic before accepting any single TAM number, and should ask Enpal
              to demonstrate SAM and SOM estimates anchored to verifiable installer and subscription cohort data rather
              than top-down market reports.
