              are secondary-source claims, not audited disclosures. Enpal's January 2026 press release explicitly states
              plans to invest in deepening long-term customer relationships — language that implies management awareness
              of the retention challenge. No public NRR, GRR, formal churn rate, or cohort-level retention data exists.
