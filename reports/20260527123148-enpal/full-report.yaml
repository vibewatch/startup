  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Enpal operates in Germany's residential home-electrification market, which encompasses rooftop solar PV,
              battery storage, heat pumps, EV charging, and energy management software. EUPD Research's August 2025
              Market Leadership Study names 1Komma5°, E.ON Solar, and Enpal (in alphabetical order) as Europe's three
              leading residential solar companies, the only participants distinguished for scale, digital platforms, and
              sector coupling. Below this tier sits a highly fragmented long tail of more than 24,000 local Handwerker
              across Europe, most of whom lack national brand, financing infrastructure, or software capability.
              Germany's residential solar market added 214% capacity between 2022 and 2023 but grew only 6.66% between
              2023 and 2024; a 20% volume decline in 2024 followed by further softness in 2025 has squeezed smaller
              players and accelerated consolidation. Zolar, once the third-best-capitalised D2C solar startup with
              ~€300M raised, pivoted from direct installation to B2B software in 2025 after insolvency proceedings with
              a workforce reduced from ~400 to ~50. This structural shakeout is a signal that only companies with large
              installed bases, software stickiness, or utility distribution can sustain D2C economics in a normalised
              demand environment. The competitive set can be mapped across four tiers: (1) national digital-native
              installers and energy platforms (Enpal, 1Komma5°); (2) utility-backed branded offerings (E.ON Solar); (3)
              specialty verticals (Thermondo in heat pumps); and (4) the fragmented local-installer base. Adjacent
              status-quo alternatives—continuing to use grid electricity and gas heating— remain the default for the
              majority of German homeowners and represent the largest share of addressable but not yet captured demand.
