  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Maps the residential B2C homeowner journey from brand discovery through product activation and ecosystem
      expansion, highlighting the post-installation service friction point documented in adverse sources.
    approximationNotes: >-
      Stages synthesised from company press releases (SU001 SU003 SU013), lease-product descriptions (SU015 SU016
      SU018), review analyses (SU007 SU009), and the Enpal.One+ capability claims (SU013). Stage durations are
      illustrative.
    data:
      nodes:
        - id: brand-discovery
          label: Brand discovery
          description: >-
            72% of German homeowners recognise Enpal from a presented list; TV, digital, and referral channels drive
            awareness
        - id: sales-consultation
          label: Sales consultation
          description: >-
            Video call or in-home visit; lease or purchase options presented; zero-upfront lease prominently featured;
            high-pressure repeat-call tactics flagged in adverse reviews
        - id: contract-signed
          label: Contract signed
          description: >-
            20-year lease at 98 to 350 EUR per month covering hardware, installation, maintenance, repairs, and
            insurance; or flexible purchase loan via EFS
        - id: installation
          label: Installation
          description: >-
            Enpal or partner team completes installation in 1 to 3 days; 82 to 88 percent of reviewers rate this phase
            excellent or good
        - id: grid-connection
          label: Grid-connection paperwork
          description: >-
            Key friction point — required filings with local network operator; some customers waited months for system
            activation due to incomplete paperwork
        - id: activation
          label: System activation and Enpal.One+
          description: >-
            App goes live; AI energy-trading platform connects battery to day-ahead electricity spot market; household
            enters virtual power plant
        - id: expand
          label: Cross-sell and ecosystem deepen
          description: >-
            Upsell to heat pump, EV wallbox, metrify smart-meter subscription, and additional battery capacity; ARPU
            deepens with each added product line
    claimRefs:
      - CU003
      - CU010
      - CU011
      - CU012
      - CU018
      - CU040
      - CU041
  - id: FU002
    title: Adoption and deployment funnel
    type: flow
    summary: >-
      Discovery-to-ecosystem path for the residential B2C segment, showing the post-installation grid-connection
      friction point and the long-term cross-sell expansion layer.
    approximationNotes: >-
      Stage labels and transition descriptions are synthesised from review analyses (SU007 SU009 SU018), company lease
      descriptions (SU015 SU016), and press releases (SU001 SU003).
    data:
      nodes:
        - id: awareness
          label: Brand awareness
          description: >-
            72% German homeowner recognition from a presented list; TV, digital, referral programme; strongest
            residential solar brand in Germany
        - id: consultation
          label: Sales consultation and contract
          description: >-
            Zero-upfront 20-year lease or EFS purchase loan; aggressive sales tactics flagged in adverse reviews;
            financing removes 20,000 to 40,000 EUR upfront barrier
        - id: installation
          label: Installation (1 to 3 days)
          description: >-
            Enpal or subcontractor team installs PV, battery, wallbox, and optionally heat pump; 82 to 88 percent of
            reviewers rate installation excellent or good
        - id: grid-paperwork
          label: Grid-connection paperwork
          description: >-
            Critical friction point — required network-operator filings; some customers experienced months-long
            activation delays due to incomplete administrative filings
        - id: activation
          label: System activation and app onboarding
          description: >-
            Enpal.One+ AI energy-trading app goes live; battery connected to day-ahead spot market; metrify smart-meter
            subscription activated if applicable
        - id: in-life
          label: In-life recurring relationship
          description: >-
            Monthly lease payments; maintenance and repair coverage; hotline support — consistently rated poor
            post-activation; Enpal responds to 87% of negative Trustpilot reviews
        - id: cross-sell
          label: Cross-sell and ecosystem expansion
          description: >-
            Heat pump, wallbox, or additional battery added to household; metrify subscription deepens recurring
            revenue; VPP aggregation creates platform dependency
