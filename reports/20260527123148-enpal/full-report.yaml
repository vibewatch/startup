          description: Last disclosed EUR 2.2B (Jan 2023); ~2x 2025 revenue; 60%+ discount to Sunrun EV/Rev; no 2025 mark
        - id: rec
          label: Recommendation
          description: 'CONDITIONAL TRACK: Compelling entry below EUR 2B if EBITDA confirmed; high risk until profitability proven'
