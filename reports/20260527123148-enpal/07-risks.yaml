- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - EEG guaranteed feed-in elimination
    - Bundestag vote on revised EEG subsidy framework
    - Law passed removing guaranteed tariff for new small-scale PV without market-mechanism replacement
    - Re-underwrite demand model; stress new-customer ROI to market prices only; consider thesis revision
  - - ABS market closure
    - Enpal ABS facility renewal terms; new issuance spread vs. prior cohort
    - Failure to renew M&G warehouse, or new spread >150bps above prior cohort without price offset
    - Immediate liquidity concern; model run-rate requirements from equity only; escalate to avoid/research-more
  - - Labor law systemic finding
    - LkSG audit result; court rulings; regulatory sanction announcements
    - Court finding of systematic violation of Working Time Act or LkSG; regulatory sanction; class action filed
    - Assess reputational and direct financial exposure; require remediation plan with board oversight before next funding
  - - Deepening operating loss
    - Quarterly operating result disclosure or management reporting
    - Two consecutive quarters of worsening EBIT loss without evidence-supported path to breakeven
    - Re-examine unit economics and commission structure; revisit valuation basis
  - - Metering / Inexogy dispute escalation
    - Court docket; additional metering-related lawsuits
    - Judgment against Enpal exceeding €2M, or class of metering disputes exceeding €5M in aggregate
    - Model contingent liability; require legal indemnification carve-out in any investment documentation
  notes: Kill criteria are measurable and linked to observable events rather than opinions. Each is evidence-grounded in existing public signals.
