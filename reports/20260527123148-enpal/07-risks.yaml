    - Commission ratio still >55% after 2025 restructuring, or NPS below 40
  - - Service ticket concentration
    - 14% of customers generate 66% of tickets
    - High
    - Ticket-concentration ratio and first-time-fix rate
    - Ticket concentration remains above 60% for top 15% of customers at Q3 2025
