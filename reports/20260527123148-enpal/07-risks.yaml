    - Any court finding of systematic violation, or LkSG sanction
  - - ABS spread vs. lease yield
    - Novel asset class; index-linked funding; EIB/EIF partial guarantee
    - Critical
    - ABS issuance spread, Enpal stated lease cost-of-funds
    - ABS spread rises >150bps above prior cohort without offsetting lease yield adjustment
