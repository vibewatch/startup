- id: people-and-execution-risks
  title: People and Execution Risks
  body: 'Enpal is founder-led by Mario Kohle, co-founded with Viktor Wingert (who also serves as CFO) and Jochen Ziervogel. The concentration of narrative authority, investor relationships, and capital market credibility in this founding trio creates key-person risk: the ABS investor community, which includes banks like Barclays, Bank of America, Citi, and Crédit Agricole, has built relationships with Kohle and Wingert directly, and any disruption to that founding continuity would arrive at a moment when Enpal still needs to access ABS markets for the refinancing of every new installation cohort. Beyond key person, Enpal''s sales culture poses a structural execution risk. The company''s field sales force is compensated primarily on signed contracts, which independent analysis and consumer complaints both link to oversized system installations, misleading savings projections, and pressure tactics that damage long-term satisfaction. When more than 60% of gross margin goes to sales commissions, there is a ceiling on how much investment the company can make in service infrastructure, software reliability, and customer success. The heat pump pivot represents a third execution risk: the company installed 4,300 heat pumps in 2024 versus 600 in 2023—a 7× growth trajectory—but heat pump service has a longer tail of technical issues than PV, regulatory approval processes vary by state, and the qualified workforce required is scarce. Diversification is the right strategic direction for reducing solar cyclicality, but executing a complex product line transition while managing legacy service backlogs and a labor-law crisis is an unusually high workload. Geographic concentration in Germany (representing roughly 90%+ of revenue) means any macroeconomic, political, or weather-driven softening in the German residential market has immediate and undiversified impact on Enpal''s growth trajectory.'
