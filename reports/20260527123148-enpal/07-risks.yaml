  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cohort-unit-economics
    missingEvidence: Per-cohort gross margin, EBITDA contribution, default rate on ABS loans, and customer renewal rates broken out by product and installation year.
    whyItMatters: The ABS structure and fixed-price subscription model make unit economics the core test of long-run investability, but no public source provides cohort-level disclosure.
    diligencePath: Request ABS investor reporting package, SPV cash flow statements, per-cohort default rates, and management accounts for 2023 and 2024 by product line.
    relatedQuestionRefs:
    - QR020
    - QR022
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: LkSG-audit-status
    missingEvidence: Completed or in-progress LkSG (Supply Chain Due Diligence Act) audit documentation and remediation status for Enpal's subcontractor and international installation workforce.
    whyItMatters: Labor law allegations are legally active; the LkSG audit is required by German law; absence of public evidence means compliance posture is unverifiable.
    diligencePath: Request current LkSG audit provider, scope, findings, and remediation timeline; obtain litigation register including all pending worker claims.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: Inexogy-lawsuit-detail
    missingEvidence: Court docket, total contingent liability, and final disposition for the Inexogy metering dispute.
    whyItMatters: The Inexogy case introduces a third-party creditor who can attest to operational irregularities in Enpal's metering rollout; unquantified contingent liability complicates diligence.
    diligencePath: Obtain court filing, settlement status, and confirm whether other metering-related disputes are pending.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR001
  - type: stale
    severity: material
    topic: current-financial-statements
    missingEvidence: Audited 2024 financial statements for Enpal GmbH and consolidated group; 2025 interim operating results with third-party verification.
    whyItMatters: Management claims of Q1 2025 profitability and strongest-ever monthly revenues are unverified by audited data; the 2024 operating loss of ~€50M and prior SPV opacity mean historical figures alone cannot anchor an investment decision.
    diligencePath: Request audited 2024 accounts for both the operating entity and consolidated group including SPVs; request 2025 monthly management accounts and CFO bridge.
    relatedQuestionRefs:
    - QR011
    - QR028
    - QR032
    relatedTableRefs:
    - TR006
  - type: private-evidence-only
    severity: material
    topic: ABS-covenant-and-collateral-values
    missingEvidence: ABS facility covenants, collateral valuation methodology, EIB/EIF guarantee scope and conditions, and performance triggers for the M&G warehouse.
    whyItMatters: If regulatory changes reduce PV system economic value (e.g., subsidy elimination), covenant breaches could trigger ABS restructuring independent of Enpal's operating performance.
    diligencePath: Request ABS transaction documents, servicer reports, collateral valuation methodology, and covenant compliance certificate.
    relatedQuestionRefs:
    - QR009
    - QR024
    relatedTableRefs:
    - TR003
