callouts:
- calloutType: risk
  title: EEG feed-in tariff reform is the single biggest demand-destruction risk
  body: A 2026 draft EEG reform under political discussion in Berlin would remove the guaranteed 20-year feed-in tariff for new small rooftop PV. Consumer adoption of solar in Germany has historically been anchored to this subsidy; its removal without an equivalent direct-market mechanism would change the ROI narrative for new customers and slow demand in a market that already contracted 19% in 2024.
  claimRefs:
  - CR025
  - CR026
  - CR027
- calloutType: risk
  title: Labor law allegations remain legally live and reputationally damaging
  body: Manager Magazin's exposé (October 2024) and the FAU Leipzig wage-recovery case both establish a documented public record of labor disputes at Enpal. While Enpal won a December 2025 court order barring specific Magazine allegations, the underlying LkSG and labor-law compliance questions remain open pending audit completion and further proceedings.
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR041
- calloutType: risk
  title: ABS capital structure is novel, interest-rate sensitive, and under-tested in stress
  body: Enpal's SPV financing is Europe's first residential solar securitization. The novelty means secondary market liquidity is thin, and the cost-of-funds floats with market rates while customer subscriptions are often fixed-price. Any dislocation in the European ABS market—whether from credit events, regulatory change, or rising spreads—directly constrains Enpal's ability to deploy new cohorts.
  claimRefs:
  - CR016
  - CR022
  - CR033
- calloutType: insight
  title: Smart meter technology leadership provides a partial regulatory hedge
  body: Germany's 2025 PV control law mandates BSI-certified smart meters and intelligent control units for all new installations. Enpal, as Germany's largest competitive meter-point operator, already meets this standard for most customers and has deployed its Enpal.One AI manager to avoid the 60% output curtailment that would affect uncontrolled systems. This is a genuine first-mover advantage that smaller rivals will take years to replicate.
  claimRefs:
  - CR004
  - CR007
  - CR037
  - CR038
