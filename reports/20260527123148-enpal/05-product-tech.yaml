chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Enpal delivers a five-component residential energy platform — solar PV, battery storage, heat pump, EV wallbox, and the
    Enpal.One software layer — sold as a single turnkey bundle with zero-down-payment financing and full service coverage.
    The company's strongest technical credential is its 2023 VDE "Standardized PV Power Plant" certification (the first in
    Germany), reinforced by the Flexa virtual power plant joint venture that reached 400 MW aggregated capacity and 10,000
    households by December 2025. Key diligence gaps are the undisclosed battery-storage supplier, the privately held fault-rate
    data, and limited public evidence of the software architecture beyond press-reported technology stack choices.

sections:
  - id: product-service-definition
    title: Product Definition, Modules and SKUs
    body: >-
      Enpal's commercial offer in 2026 is a five-component energy solution for German owner-occupied single-family homes.
      The entry point is a rooftop solar PV array built from 450 Wp bifacial All-Black Glas-Glas modules sourced from Tier-1
      manufacturers, sized to order (typically 6–15 kWp for a single-family home at roughly €18,000–€26,000 for an average 10 kWp
      system if purchased outright). The second component is an intelligent battery storage unit of unspecified brand
      (Enpal's website does not name the cell supplier, though industry sources associate this product class with BYD and similar).
      Third is the Enpal.One energy manager — a proprietary IoT gateway box ("EnpalBox") plus cloud software that orchestrates
      all connected devices and presents data in the Enpal consumer app. Fourth is the Bosch Compress 5800i AW air-to-water
      heat pump, which uses natural R290 propane refrigerant, delivers up to a 4.54 SCOP at 35°C flow temperature, and operates
      at ≤40 dB(A). Fifth is a solar-optimised AC wallbox for EV charging.

      Beyond the hardware bundle, Enpal offers the Enpal.One+ energy tariff at €0.19/kWh (German press stated €0.16/kWh on the
      English site), and VPP participation via its Flexa joint venture with AI specialist Entrix, where eligible customers
      (solar + battery minimum) have household assets traded on the continuous intraday electricity market, with Enpal
      marketing up to €2,000/year in additional earnings. The company also runs Enpal.pro, a B2B distribution and service
      platform for regional installers and HVAC tradespeople. Commercial deployment of the full five-component bundle accounts
      for the majority of new Enpal customer activations as of 2025. A smart meter gateway programme has reached 10,000
      installations, laying the data infrastructure for expanded grid services.

      The customer acquisition model follows an online lead-generation and in-home-consultation funnel. Enpal projects an
      average 6-week timeline from initial consultation to commissioned installation. The company serves only Germany as of
      2026 in its direct-to-consumer channel, though solar.red data and Enpal's own releases note early-stage commercial
      operations in Italy.
