callouts:
  - calloutType: strength
    title: VDE-Certified Installation Standard
    body: >-
      Enpal is the first and, as of 2026, still the reference company in Germany to hold the VDE "Standardized PV Power Plant"
      certificate for residential rooftop PV. The certification covers the complete process (planning, engineering, logistics,
      and Elektromeister oversight), creating a quality moat that is difficult for regional installers to replicate quickly.
    claimRefs:
      - CE032
      - CE033

  - calloutType: strength
    title: Flexa VPP — 5-Minute Intraday Advantage
    body: >-
      Competing VPPs in Germany primarily access the primary-control-reserve market (now characterised as saturated) or the
      day-ahead market. Flexa's continuous intraday trading at 5-minute intervals — enabled by Entrix's AI algorithm — allows
      more frequent arbitrage cycles and, per Enpal, up to 2× cost savings for participating households. The 400 MW milestone
      by December 2025 demonstrates tangible commercial traction.
    claimRefs:
      - CE013
      - CE014
      - CE015

  - calloutType: risk
    title: Post-Installation Service Gap — Material Adverse Signal
    body: >-
      Multiple independent review analyses (Gruenes.haus 2,500 reviews; energiefluss24 structured Trustpilot data) converge on
      the same finding: installation experience is positive, but post-commissioning service — hotline wait times exceeding
      30 minutes, 5–7 day email response, grid-connection admin failures — is the primary source of 1-star ratings and
      consumer-protection warnings. At a 12–18% technical fault rate cited by energiefluss24, the service capacity constraint
      is a structural quality-control risk at current scale.
    claimRefs:
      - CE036
      - CE037
      - CE038
      - CE040

  - calloutType: risk
    title: Battery Supplier Opacity
    body: >-
      Enpal does not publicly disclose its battery cell or module supplier. This is a diligence gap because cell chemistry,
      cycle life, thermal management design, and warranty terms are material to the long-term performance and residual value
      of the financed energy assets that underpin Enpal's €5 billion ABS programme.
    claimRefs:
      - CE002
      - CE029

