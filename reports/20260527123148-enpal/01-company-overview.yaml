  - id: FO002
    title: Company Snapshot Logic
    type: flow
    layout: standard
    summary: >-
      How Enpal's supply chain, financing structure, and product platform connect to generate hardware
      revenue, recurring revenue, and platform value, with key risk nodes identified.
    data:
      nodes:
        - id: supply
          label: Shenzhen supply chain hub
          detail: >-
            Direct hardware procurement for PV panels, batteries, heat pumps, and wallboxes; opened 2020.
            Gives cost and availability advantage versus distributor-dependent competitors.
          tone: positive
        - id: install
          label: In-house installer network
          detail: >-
            1,000+ employed installers and electricians; Dahlewitz Academy trains third-party partners.
            Vertical integration of installation reduces quality variance and builds customer trust.
          tone: positive
        - id: finance
          label: Off-balance-sheet financing book (>€5B)
          detail: >-
            Customer loans and rental contracts refinanced through bank-funded special-purpose vehicles.
            Allows zero-down-payment proposition without consuming equity capital.
          tone: positive
        - id: platform
          label: Enpal.One+ AI energy platform
          detail: >-
            Integrates solar, battery, heat pump, wallbox, and smart meter; optimises energy trading
            via VPP (Flexa JV with Entrix). Backbone of recurring revenue strategy.
          tone: positive
        - id: recurring
          label: Recurring revenue streams
          detail: >-
            Electricity tariff (16ct/kWh), smart meter fees (Metrify), maintenance packages, and
            VPP trading revenue. Metrify recurring revenues grew ~70% post-spin-off in 2025.
          tone: positive
        - id: risk_service
          label: Post-installation service risk
          detail: >-
            Trustpilot bimodal distribution (4.0–4.2/5, 27K+ reviews) and Stiftung Warentest
            caveats signal recurring service gaps that threaten customer retention and referral.
          tone: warning
      edges:
        - from: supply
          to: install
        - from: install
          to: platform
        - from: finance
          to: install
        - from: platform
          to: recurring
        - from: risk_service
          to: recurring
    approximationNotes: null
    claimRefs:
      - CO005
      - CO006
      - CO008
      - CO012
      - CO024
      - CO040
      - CO045
      - CO048

  - id: FO003
    title: Snapshot KPIs
    type: kpi
    layout: standard
    summary: >-
      Publicly supportable KPIs showing strong scale and revenue trajectory but materially limited
      financial transparency beyond audited 2023 figures.
    data:
      items:
        - label: Revenue 2025 (preliminary)
          value: ">€1.1 billion"
          detail: >-
            First year exceeding €1B; +25% YoY; audited figure expected mid-2026.
            Heat pumps contribute ~one-third of core business revenue.
          tone: positive
        - label: Revenue 2023 (audited)
          value: €905 million
          detail: >-
            Most recent audited figure; +118% YoY from €415m in 2022. Adj. EBITDA ~€21m.
          tone: positive
        - label: Total Equity Raised
          value: ">€600 million"
          detail: >-
            Across multiple rounds including Series D (Sep 2023, €215m) and 2025 round (€110m).
            Cap table and individual stakes not public.
          tone: positive
        - label: Last Disclosed Valuation
          value: ~€2.2 billion (Sep 2023)
          detail: >-
            Reuters-reported Series D valuation; no valuation disclosed at April 2025 round.
            Current fair value unconfirmed.
          tone: neutral
        - label: Households Served (end-2025)
          value: ">115,000 (Germany + Italy)"
          detail: >-
            Self-reported; crossed 100,000 milestone during 2025. Includes solar, heat pump,
            and multi-product customers.
          tone: positive
        - label: Trustpilot Score
          value: "~4.0–4.2 / 5 (27,000+ reviews)"
          detail: >-
            Bimodal distribution with high proportions of both 5-star and 1-star reviews.
            Post-installation service is the primary complaint theme.
          tone: neutral
        - label: Adj. EBITDA / Margin
          value: Not public (2024 and 2025)
          detail: >-
            2023 adj. EBITDA ~€21m on €905m revenue (~2.3% margin). No 2024/2025 figures disclosed.
          tone: warning
        - label: Free Cash Flow
          value: Positive (first full year, 2025)
          detail: >-
            First full-year positive free cash flow in operational segment achieved in 2025.
            Prior years generated negative FCF from rapid investment cycle.
          tone: positive
    approximationNotes: >-
      Revenue figures are from the operating sub-group. Valuation is from Sep 2023 and may not
      reflect current market pricing. Trustpilot score is from Wayback-archived Feb 2026 page;
      live score may vary. EBITDA margin is calculated from disclosed 2023 figures only.
    claimRefs:
      - CO015
      - CO017
      - CO018
      - CO019
      - CO022
      - CO037
      - CO041
      - CO045

