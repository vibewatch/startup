  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation
      missingEvidence: >-
        No valuation was disclosed at the April 2025 equity round; the company actively declined to
        provide a post-money figure. The last confirmed valuation (€2.2B, Sep 2023) may be materially
        stale given the 2024 revenue dip, market contraction, and strategic investment cycle.
      whyItMatters: >-
        A stale two-year-old valuation is not sufficient for any investment decision or financial
        underwriting of the current equity stake.
      diligencePath: >-
        Obtain a current independent valuation from TPG Rise Climate's investor materials or commission
        an independent DCF using audited 2023 data, preliminary 2025 data, and the comparable multiples
        of listed European energy services companies.
      relatedQuestionRefs:
        - QO021

    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Board composition, investor governance rights, management equity plans, and vesting schedules
        are not disclosed in any public source. The unnamed European insurance group investor's identity
        is also unknown.
      whyItMatters: >-
        Without board composition, investor consent rights, and equity incentive plans, it is not possible
        to assess whether key-person and governance risks are adequately mitigated, or whether the
        company's strategic direction is stable.
      diligencePath: >-
        Request shareholder agreement, board minutes for 2024-2026, and management equity plan from
        data room; identify the anonymous insurance group investor through legal due diligence.
      relatedQuestionRefs:
        - QO022
        - QO008
      relatedTableRefs:
        - TO002

    - type: missing-source
      severity: material
      topic: legal-structure
      missingEvidence: >-
        The relationship between the B.V. holding company and the German GmbH operating entity has not
        been confirmed in any public corporate filing reviewed for this report. Dutch Chamber of Commerce
        (KVK) and German Handelsregister records have not been reviewed.
      whyItMatters: >-
        The holding-to-operating entity relationship determines where assets, liabilities, and guarantee
        obligations sit, which is material to debt covenant compliance and recourse analysis.
      diligencePath: >-
        Pull KVK extract for the B.V. holding and HRB extract for the German GmbH(s); confirm inter-entity
        service agreements, asset ownership, and guarantee structures.
      relatedQuestionRefs:
        - QO002

    - type: conflicting-data
      severity: material
      topic: revenue-2024
      missingEvidence: >-
        Sifted and Handelsblatt reported 2024 revenue at €860 million; Enpal's January 2026 press release
        cited €890 million as the 2024 comparator. The €30 million discrepancy has not been publicly
        reconciled and audited 2024 accounts have not yet been released as of the May 2026 report date.
      whyItMatters: >-
        The unreconciled revenue gap prevents reliable year-over-year comparisons and complicates
        modeling of the company's 2025 growth trajectory. It may reflect operating sub-group versus
        full-group consolidation differences.
      diligencePath: >-
        Obtain audited 2024 group accounts from Enpal; confirm sub-group scope and reconcile to the
        €890 million figure. Expected publication mid-2026.
      relatedQuestionRefs:
        - QO003

    - type: missing-source
      severity: material
      topic: regulatory-litigation
      missingEvidence: >-
        No public record of regulatory enforcement actions, lawsuits, or sanctions against Enpal was
        found in sources reviewed. However, no systematic regulatory database search (e.g., Bundesnetzagentur,
        Verbraucherzentrale, German courts) was conducted.
      whyItMatters: >-
        Given the scale of Enpal's consumer-facing financing contracts (>115,000 customers) and the
        Stiftung Warentest caveats about contract terms, the absence of any regulatory action in public
        sources may reflect a genuine clean record or an incomplete search.
      diligencePath: >-
        Commission a systematic search of German commercial courts (Handelsregister), Bundesnetzagentur
        decisions (smart meter regulation), BaFin records (consumer finance licensing), and
        Verbraucherzentrale complaints database.
      relatedQuestionRefs:
        - QO010

    - type: private-evidence-only
      severity: material
      topic: debt-structure
      missingEvidence: >-
        Covenant terms, asset pledges, recourse provisions, vehicle structures, and utilisation levels
        for both the 2022 (€855m) and 2024 (€1.1bn) debt facilities are not available in public sources.
      whyItMatters: >-
        With >€5 billion in refinancing commitments, the debt structure is the largest financial
        risk factor in the capital structure. Covenant breaches or facility non-renewal could
        impair Enpal's ability to offer customer financing, which is central to its value proposition.
      diligencePath: >-
        Obtain facility agreements, covenant compliance certificates, and current utilisation schedules
        from the data room; review recourse provisions between Enpal GmbH and the SPV lenders.
      relatedQuestionRefs:
        - QO007

