company:
  name: Enpal
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Enpal is a Berlin-based greentech unicorn founded in 2017 by Mario Kohle, Viktor Wingert, and Jochen
    Ziervogel that has grown into Europe's largest residential decarbonization platform, offering solar PV,
    battery storage, heat pumps, EV wallboxes, smart meters, and an AI energy-management platform
    (Enpal.One+) to homeowners in Germany and Italy. The company raised >€600 million in equity — including
    a September 2023 Series D at a €2.2 billion valuation and an oversubscribed €110 million round in April
    2025 led by TPG Rise Climate — while deploying >€5 billion in off-balance-sheet customer financing.
    Revenue surpassed €1.1 billion in 2025 (the first year exceeding €1 billion) after a temporary dip to
    €860–890 million in 2024; recurring post-installation service quality complaints and a rapid succession
    of CFO transitions are the principal non-financial diligence flags.

sections:
  - id: section-1
    title: Company Identity, Corporate Structure, and Mission
    body: >
      Enpal is a Berlin-headquartered German greentech company founded in 2017 with the stated mission of
      connecting households to a renewable energy community and making clean energy financially free in the
      long term. The company operates as a vertically integrated provider: it acquires residential customers,
      manages hardware supply through a Shenzhen-based supply chain center, employs more than 1,000 in-house
      installers and electricians alongside third-party partner installers, and retains long-term customer
      relationships through ongoing energy management, smart metering, and financing services.

      Enpal's official factsheet lists the legal form as a B.V. (Besloten Vennootschap, a Dutch private
      limited structure), although the operational entity serving German customers is commonly referred to
      as Enpal GmbH in press reporting. This dual structure — a foreign holding B.V. with a domestic GmbH
      operating entity — is common among German technology scale-ups seeking flexible governance and investor
      rights mechanisms, but the exact corporate hierarchy has not been detailed in public filings reviewed
      for this report. Confirming the ownership chain, inter-entity agreements, and any pledge structures
      over assets is a first-order data-room task.

      The company describes its product as an "all-in-one renewable energy solution for homeowners," combining
      photovoltaic panels, battery storage, EV charging stations (wallboxes), heat pumps, smart meters, and
      the Enpal.One+ AI energy-management platform under a single customer relationship managed via the Enpal
      App. Beyond the core B2C offering, Enpal operates Enpal.pro, a B2B2C digital platform for independent
      solar and heat pump installers, and since 2024 has extended its reach into commercial and industrial
      (C&I) solar installations. The Shenzhen supply chain hub, opened in 2020, provides direct procurement
      control over PV hardware, a material cost and availability advantage that smaller competitors often lack.

      In 2021, Enpal became the first European greentech startup to achieve unicorn status (a valuation exceeding
      $1 billion), a milestone the company cites as validation of its market position and business model. As of
      the report date, Enpal remains private with no stated IPO intention.
