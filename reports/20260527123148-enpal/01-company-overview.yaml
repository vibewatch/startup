      severity: minor
      topic: investors
      missingEvidence: >-
        Cap table is private; individual investor stakes, preference stack, and governance rights for
        all investors are unknown. The identity of the new European insurance group investor in the
        April 2025 round was not disclosed.
      whyItMatters: >-
        Preference stack and anti-dilution provisions determine effective equity value for any buyer
        or co-investor. The unnamed insurer's identity affects regulatory approval assessment and
