  - id: section-3
    title: Founders, Leadership, and Governance
    body: >
      Enpal was founded by three individuals who remain central to the company's identity. Mario Kohle (born
      1984), CEO and co-founder, previously founded Aroundhome (formerly Käuferportal), a German home-services
      marketplace that he built and sold before turning his attention to the climate sector. Kohle is the primary
      public face of Enpal and received the KfW Entrepreneurs' Award, with the Financial Times recognising
      Enpal as the fastest-growing energy company in Europe by average growth rate over a three-year period.
      His background in high-growth consumer-facing digital platforms maps closely to Enpal's model of
      simplifying a complex consumer purchase through technology and financing.

      Viktor Wingert co-founded the company with a financial and investment background. He was designated
      Chief Investment Officer (CIO) in press releases from August 2024, was listed as CFO in the July 2025
      factsheet, and was announced in January 2026 as transitioning to lead the company's technology and
      production site in Shenzhen as Henning Rath (the prior China site head) departs in April 2026.
      Johannes Roehren, previously CFO of the heat pump division, was simultaneously named group CFO.
      This represents the third person in the group CFO role within a span of fewer than two years
      (Jochen Cassel held the role as of August 2024; Wingert took it by July 2025; Roehren assumed it
      in April 2026), a pattern that warrants scrutiny in diligence. Jochen Ziervogel is the third
      co-founder but holds no named executive title in available public materials.

      Ben Merle serves as Chief Product Officer and has been quoted in industry media on product roadmap
      decisions, including the deliberate shift toward heat pumps amid solar demand softening. Leonardo
      DiCaprio is cited as an early investor in media interviews with Kohle, though no dedicated fundraise
      announcement names DiCaprio's specific stake. Board composition, investor governance rights,
      management equity, and vesting schedules are not disclosed in any reviewed public source, leaving
      governance structure as a primary data-room question. Key-person dependency on Mario Kohle is rated
      high given his dual role as strategic decision-maker and public spokesperson.
