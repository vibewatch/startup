summary:
  headline: Enpal 既有德国户用光伏的品类领先规模，也把家庭电气化产品包做宽，并拿到异常深的结构化融资通道；但 2023 年后估值不透明、经审计盈利披露有限、服务质量 / 法律摩擦和政策敏感度都很高，更适合给观察评级，而不是现在买入。
