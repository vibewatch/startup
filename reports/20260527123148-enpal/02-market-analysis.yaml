  - id: policy-regulatory-and-adjacency
    title: "Policy, Regulatory Framework, and Heat Pump / EV Adjacency"
    body: >-
      Germany's Renewable Energy Sources Act (Erneuerbare-Energien-Gesetz, EEG) is the structural
      backbone of the residential solar market. The EEG mandates a fixed feed-in tariff guaranteed for
      20 years from the date of commissioning for systems up to 100 kWp. For the period February–July
      2026, the Bundesnetzagentur has published rates of 7.78 ct/kWh (partial feed-in, ≤10 kWp) and
      12.35 ct/kWh (full feed-in, ≤10 kWp), with approximately 1% semi-annual degression. These
      rates represent the most important economic anchor for residential solar ROI calculations.

      Solarpaket I (effective May 2024) introduced several market-positive changes: simplified annual
      switching between full and partial feed-in, accelerated grid connection rules, tenant-electricity
      enhancements, and new support for larger rooftop systems. However, a proposed EU state-aid
      clearance for the Solarpaket I +1.5 ct/kWh uplift for 40+ kWp systems has not yet been granted
      by the European Commission as of the reporting date. The Solar Peak Act (Solarspitzengesetz,
      February 2025) ended compensation at negative electricity prices and imposed smart meter
      requirements for new installations, adding modest complexity to the ownership case.

      The critical 2027 EEG reform risk is the proposed elimination of fixed feed-in tariffs for all
      new small PV systems (≤25 kW), which would shift new installations to spot-market remuneration.
      BSW-Solar warns this could slow installations significantly and endanger tens of thousands of
      jobs. Surveys suggest only ~40% of would-be buyers would proceed without a guaranteed tariff.
      Economy Minister Reiche has defended the reform on the grounds that small PV systems are now
      profitable without subsidy, a claim the industry strongly disputes.

      Heat pump adjacency is material. Germany's Building Energy Act (GEG) drives phased replacement
      of fossil heating; the market saw 299,000 heat pumps sold in 2025 (55% growth vs. 2024). The
      natural coupling of rooftop solar with heat pumps creates a strong cross-sell dynamic: PV-
      generated electricity at ~7 ct/kWh feed-in value is worth ~27 ct/kWh when used to run a heat
      pump (avoided grid purchase), a 3.5× value differential that makes solar-plus-heat-pump bundles
      highly economically attractive. Combined PV+heat pump packages can leverage KfW 458 grants
      (up to 70% of heat pump cost) alongside EEG feed-in tariff and 0% VAT.

      EV wallbox adjacency is similarly growing. Germany's EV fleet is expanding, driving demand for
      home charging; from June 2026, energy-sharing regulation enables residents and businesses to
      share locally generated solar electricity, opening new revenue and retention models. Dynamic
      electricity tariffs (mandatory for all suppliers since 2025) are adding an optimization layer
      that benefits households with solar plus storage plus EV combinations.
