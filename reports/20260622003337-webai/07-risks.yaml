- id: operational-security
  title: Operational, Quality, and Security Risk
  body: 'Operationally, webAI inherits the security risks of agentic AI plus new ones created by its distributed architecture. The agentic risks are well catalogued: OWASP''s Agentic AI Top 10 documents attack surfaces such as tool misuse, memory poisoning, and goal manipulation, and peer-reviewed red-teaming shows agentic systems remain vulnerable to jailbreaks and prompt injection. For a platform whose pitch is autonomous agents acting on enterprise data, these are live, not theoretical, concerns, and the Cloud Security Alliance frames AI safety and security as a still-immature discipline. The distributed on-device design adds its own failure modes - device heterogeneity, synchronization, and partial outages - that centralized cloud serving avoids, and model-quality and hallucination risk persist in production because private deployment does not by itself guarantee accuracy or grounding. Optimizing for Apple Silicon also ties deployable capacity to Apple hardware availability, a supply dependency. The important nuance is that on-prem deployment is double-edged for security: it shrinks multi-tenant exposure but shifts a large share of the security burden into each customer''s environment, so it mitigates some risks while creating others. The risk-transmission figure shows how an upstream shock - a hardware constraint or a security failure - can cascade into deployment delays, customer loss, and ultimately financing risk.'
  claimRefs:
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: partner-dependency
  title: Partner and Dependency Risk
  body: 'webAI''s dependency map concentrates risk in a few critical relationships. The most important is technical: the platform is concentrated on Apple Silicon and the Apple-controlled MLX framework, so while MLX is open source, webAI cannot unilaterally control its direction, licensing, or continuity - a genuine single-vendor exposure at the heart of the stack. The second is commercial: with only a few publicly named references, webAI carries customer-concentration risk in which a single flagship account such as Oura may drive a disproportionate share of proof and possibly revenue. The third is financial: the visible capital base runs through a narrow set of providers and special-purpose vehicles, including OXCART WEBAI I and the EPQ webAI series seen in SEC filings, which suggests episodic syndication rather than a broad institutional base. Compounding these, partner and distribution channels remain early-stage, leaving acquisition reliant on a costly direct-sales motion, and webAI''s integration ecosystem is thinner than the marketplaces hyperscaler rivals can offer. The dependency figure maps these chains explicitly; the practical takeaway is that webAI''s fate is unusually tied to Apple''s roadmap, a small reference base, and a concentrated capital syndicate, any one of which is a legitimate diligence focus.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: financial-execution
  title: Financial, Model, and Execution Risk
  body: 'The financial and execution risks are where private disclosure and a rich valuation collide. A reported $2.5B valuation sits atop revenue webAI does not disclose - no ARR, gross margin, or burn rate - which is itself a model risk, because an outside investor cannot triangulate the valuation from public data and must take growth on faith. The SEC Form D filings that are public show small amounts sold against larger offerings, including roughly $1M of a $10M offering in one SPV, which reads as opportunistic, episodic financing rather than evidence of disclosed scale. Layered on top is execution risk. webAI is closely identified with founder-CEO David Stout and a compact senior team, creating key-person exposure, and scaling enterprise and public-sector sales while growing headcount is exactly the transition that has derailed similarly staged infrastructure companies. Competitively, hyperscalers and platform vendors can bundle agentic AI into existing relationships and pressure both webAI''s pricing and its differentiation, while the services-like cost of on-premises deployment and integration can compress margins relative to pure-SaaS comparables. The throughline is that the financial risks are amplified, not caused, by non-disclosure: the less webAI shows, the more the market must assume, and at a $2.5B mark those assumptions carry real downside.'
  claimRefs:
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  tableRefs:
  - TR004
- id: mitigations-kill-criteria
  title: Mitigations, Monitoring, and Kill Criteria
  body: 'Each principal risk has a credible mitigation, and a disciplined investor should track a specific set of indicators and pre-commit to explicit kill criteria. On regulation, formally adopting the NIST AI RMF and ISO/IEC 42001, and pursuing SOC 2 and FedRAMP authorization, would simultaneously reduce compliance risk and unlock regulated and government revenue. On dependency, diversifying beyond Apple Silicon - or demonstrating portability to other accelerators - would cut the single-vendor exposure, while webAI''s own architecture is already a partial security mitigation because keeping data on-device structurally narrows the breach surface. The monitoring indicators that matter most are funding cadence, net-new named customers, certification milestones, and any first disclosure of revenue or retention. The kill criteria should be set in advance: a flat or down round, or disclosed revenue far below the level a $2.5B valuation implies, would break the thesis; the public loss of a flagship customer such as Oura would break it given reference concentration; and a major security incident or demonstrated agentic-AI breach would break it given that trust is the entire value proposition. Framing the decision this way converts a hazy risk narrative into a small set of observable, falsifiable triggers - which is exactly what a $2.5B private mark demands.'
  claimRefs:
  - CR034
  - CR035
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
  - CR041
