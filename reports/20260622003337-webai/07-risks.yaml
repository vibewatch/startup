company:
  name: webAI
chapter:
  number: 7
  title: Risks
  summary: 'webAI''s severe risks are concentrated and structurally linked: a $2.5B valuation on undisclosed revenue, single-vendor dependency on Apple Silicon/MLX, agentic-AI security exposure documented by OWASP and red-teaming research, a certification gap for regulated buyers, and customer/capital concentration. Each has a credible mitigation, and we set explicit kill criteria - down round, flagship-customer loss, or a security breach.'
sections:
- id: risk-overview
  title: Severity-Ranked Risk Overview
  body: 'webAI''s risk profile is best understood as a small number of severe, structurally linked exposures rather than a long tail of minor issues. Three risks dominate. First is financial fragility: a reported $2.5B valuation rests on revenue webAI does not disclose, so the company is exposed to sharp multiple compression if growth disappoints or AI sentiment cools. Second is single-vendor dependency: the stack is concentrated on Apple Silicon and the Apple-controlled MLX framework, tying webAI to one hardware roadmap. Third is competitive pressure from hyperscalers that can bundle agentic AI into existing estates. We rank risks by the product of likelihood, impact, and mitigation maturity, adding weight wherever the underlying evidence is private rather than verifiable - because unverifiable risk is, for an outside investor, indistinguishable from unmitigated risk. On that basis, residual exposure is highest in the financial and customer dimensions, exactly where disclosure is thinnest. The macro backdrop sharpens all of this: with record AI investment running well ahead of sector revenue, the risk is that capital tightens precisely when a capital-intensive, pre-disclosure company most needs it. The sections that follow work through regulatory, operational, dependency, and financial risks, then set out mitigations and explicit kill criteria.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  figureRefs:
  - FR001
- id: regulatory-legal
  title: Regulatory and Legal Risk
  body: 'Regulatory and legal risk for webAI is less about any single statute and more about a fast-moving compliance frontier its customers will push onto it. AI-specific regulation is tightening globally, and instruments like the NIST AI Risk Management Framework and its Generative AI Profile codify obligations that webAI''s enterprise buyers will inherit and pass through in contracts. Data-privacy law bites directly: the Texas Data Privacy and Security Act governs personal-data processing for an Austin-based company and its customers, and equivalents apply wherever it sells. ISO/IEC 42001 and ISO/IEC 23894 are becoming de facto procurement gates for AI management and risk management. Against that bar, two gaps stand out. First, webAI has not publicly disclosed SOC 2, ISO 42001, or FedRAMP certification, which constrains regulated and public-sector sales where authorization is mandatory. Second, because the platform builds on Apple''s open MLX framework rather than proprietary models, its patent-style IP moat is unproven and harder to defend, even as industry-wide AI copyright and training-data litigation creates a latent legal backdrop. Data-residency rules cut both ways - a tailwind for demand but an ongoing multi-jurisdiction compliance burden. None of these is fatal, but together they define the regulatory homework a buyer must price in.'
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  tableRefs:
