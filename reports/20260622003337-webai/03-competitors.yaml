- id: capability-comparison
  title: Capability, Pricing, and Trust Comparison
  body: 'On capability, webAI''s differentiation is narrow but distinctive: fully on-device, distributed inference across hardware the customer already owns, optimized for Apple Silicon - a posture unusual among GPU-cloud-centric competitors. That focus trades breadth for a credible privacy and cost story. On pricing, the category is uniformly opaque: Microsoft, Palantir, and webAI alike avoid transparent list pricing, so buyers cannot run clean head-to-head price comparisons and must negotiate. On go-to-market, the gap is stark - hyperscalers and Salesforce distribute agents through suites customers have already bought, a near-frictionless channel webAI cannot match selling direct. On trust and regulatory posture, however, webAI is well positioned: it clusters with Palantir, Cohere North, Red Hat, and H2O.ai as the privacy and on-prem leaders, against cloud-first incumbents whose multi-tenant defaults are a liability for the most data-sensitive buyers. The competitive question is whether sovereignty leadership is enough to overcome the incumbents'' distribution and scale.'
  claimRefs:
  - CP018
  - CP019
  - CP020
  - CP021
  - CP022
  tableRefs:
  - TP002
  - TP003
  figureRefs:
  - FP002
- id: switching-distribution
  title: Switching Costs, Lock-in, and Distribution Power
  body: 'Competitive durability turns as much on distribution and lock-in as on raw capability. Once an agent platform is embedded in workflows and connected to enterprise data, switching costs are high: re-integration, retraining, and governance re-approval all impose real friction, which favors whichever vendor lands first. Yet enterprises increasingly multi-home, running cloud and private AI vendors in parallel; this caps any single vendor''s lock-in but also fragments webAI''s potential share of wallet. The decisive structural advantage sits with incumbents: bundling agents into suites enterprises already own - Microsoft 365, Salesforce, ServiceNow - gives them near-zero-friction distribution that a direct-selling challenger cannot replicate. On the supply side, competitors with hardware ties such as NVIDIA and Dell, or hyperscale compute such as AWS and Google, control inputs that webAI must either source or engineer around through its on-device, Apple Silicon approach. webAI''s counter is to turn the customer''s own hardware into the deployment substrate, sidestepping both cloud lock-in and supply dependence - a genuine differentiator, but one that raises deployment complexity.'
  claimRefs:
  - CP023
  - CP024
  - CP025
  - CP026
- id: moat-adverse
  title: Moat Durability and Adverse Competitive Evidence
  body: webAI's moat is real but contested. Its most defensible asset is a distributed, on-device architecture that runs models privately across a customer's own Apple Silicon and edge hardware, and its strongest proof point is the Oura deployment - reportedly a 10x cost reduction on a 2.2GB on-device model. That is a credible, quantified edge. The adverse case, however, is substantial. First, open-weight models from Mistral and frameworks like MLX risk commoditizing the model layer, eroding any differentiation that rests on proprietary inference rather than deployment engineering. Second, the most acute displacement threat is hyperscaler and Salesforce bundling, which can offer 'good-enough' private options at marginal cost to customers they already serve. Third, webAI is sub-scale on capital and distribution versus hyperscalers and the best-funded labs, so it must win on speed and focus. Fourth, the sovereign niche itself is crowding, with Cohere, Mistral, Red Hat, H2O, and Dell all marketing private deployment, while Glean, Writer, and Databricks press adjacent budgets. The durability verdict is that webAI's architectural wedge is defensible only if it keeps a deployment-experience and cost-performance lead the larger field cannot quickly copy.
  claimRefs:
  - CP027
  - CP028
  - CP029
  - CP030
