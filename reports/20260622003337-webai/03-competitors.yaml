- id: competitor-profiles
  title: Competitor Profiles and Scale
  body: The competitive set spans a vast range of scale. Microsoft, Google, and AWS each invest multiple billions of dollars in AI annually and carry distribution into virtually every large enterprise, a capital and reach advantage that dwarfs webAI's roughly $60 million raised. CB Insights' AI 100 confirms a dense field of well-funded challengers beneath them. Among direct sovereign competitors, Palantir is the most established, with deep on-prem and defense deployment experience; IBM watsonx targets hybrid and regulated-industry AI with governance tooling; and Cohere North markets private, in-VPC and on-prem enterprise AI that contests webAI's pitch head-on. Mistral's open-weight models, deployable on-prem, enable sovereign builds while pressuring the value of proprietary inference. The infrastructure layer - Red Hat OpenShift AI, Dell AI Factory, and NVIDIA enterprise stacks - supplies the building blocks customers and rivals can assemble themselves. Strategically, Microsoft is embedding agents across M365 and Azure through Copilot Studio, and Salesforce is making Agentforce the center of its platform, both leaning on incumbency that webAI lacks.
  claimRefs:
  - CP009
  - CP010
  - CP011
  - CP012
  - CP013
  - CP014
  - CP015
  - CP016
  - CP017
  tableRefs:
