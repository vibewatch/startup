chapter:
  number: 3
  title: Competitive Landscape
  summary: webAI contests a crowded field spanning cloud-first agent platforms, foundation-model labs, and on-prem/sovereign vendors; its on-device, Apple Silicon wedge is distinctive but threatened by hyperscaler bundling, open-weight commoditization, and a sub-scale capital base.
sections:
- id: landscape-overview
  title: Competitive Landscape Overview
  body: 'webAI sits in one of the most crowded categories in enterprise software, contested from several directions at once. The first class is cloud-first agent platforms - Microsoft Copilot, Salesforce Agentforce, ServiceNow AI Agents, Google''s agent stack, and AWS Bedrock - which deliver agents through public-cloud infrastructure and existing enterprise relationships. The second is foundation-model labs: OpenAI and Anthropic at the frontier, and Cohere and Mistral pushing explicitly private or on-prem enterprise deployments that contest webAI''s sovereignty message directly. The third, and most direct, is the on-prem and sovereign AI cohort - Palantir, IBM watsonx, Red Hat OpenShift AI, H2O.ai, Dell AI Factory, and NVIDIA enterprise stacks - that sells the owned-infrastructure model webAI champions. Around these sit RPA incumbents UiPath and Automation Anywhere repositioning toward agentic automation, enterprise-assistant specialists Glean and Writer, data platforms like Databricks moving into agents, and the ever-present internal-build substitute assembled from open-weight models and frameworks such as Apple''s MLX. Independent benchmarks list dozens of credible vendors, so webAI must win on a sharp, defensible wedge rather than breadth.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
