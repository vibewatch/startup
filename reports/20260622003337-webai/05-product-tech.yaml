- id: deployment-roadmap
  title: Deployment, Reliability, and Roadmap
  body: 'On deployment and reliability, webAI can point to production evidence that many similarly staged companies cannot. Deployments are installed into customer infrastructure, with onboarding and use-case guidance documented in webAI''s support resources and a CLI for programmatic management. The strongest reliability signals come from named production workloads: MacStadium reportedly sustains more than 20,000 requests per minute on webAI, and the Oura deployment runs a 2.2GB on-device model at roughly a 10x cost reduction. Those are concrete throughput and efficiency data points, not just demos. On roadmap, the public signals - the Intelligence Lab launch and continued module expansion announced through 2026 - suggest active investment in extending the platform, though webAI does not publish a detailed forward roadmap. Product maturity is visibly uneven: the orchestration core and on-device inference are production-proven, while some capability modules such as anomaly detection appear earlier-stage, and the developer ecosystem, though real, is still maturing. For a buyer, the practical implication is that the core platform is deployable today, but module-level maturity and support depth should be validated workload by workload.'
  claimRefs:
  - CE018
  - CE019
  - CE020
  - CE022
  - CE025
  - CE035
  tableRefs:
  - TE005
- id: differentiation-ip
  title: Differentiation and Intellectual Property
  body: webAI's technical differentiation is the integrated combination of model quantization, distributed on-device execution, and orchestration that keeps data local - a system-level capability rather than a single breakthrough. That framing matters for assessing the moat. Because the stack leverages open frameworks such as Apple's MLX rather than a proprietary frontier model, the defensible know-how looks like deployment and efficiency engineering - getting big models to run well on constrained local hardware - more than secret model IP. Independent coverage frames the ambition boldly, as making centralized data centers less necessary for enterprise AI. A rigorous buyer should, however, apply scrutiny in three places. First, several headline performance claims, such as the 10x cost reduction, are company- or single-customer-sourced and deserve independent benchmarking. Second, the reliance on Apple Silicon and the MLX ecosystem concentrates the stack on one hardware vendor's roadmap, a real dependency risk. Third, the distributed on-device design adds deployment and integration complexity that can erode its own cost and privacy benefits. The differentiation is real and unusual, but its durability rests on execution and engineering lead rather than on patents or model secrecy.
  claimRefs:
  - CE023
  - CE024
  - CE026
  - CE032
  - CE033
  - CE034
  figureRefs:
  - FE004
- id: trust-security
  title: Trust, Safety, Security, and Compliance
  body: 'Trust and security are arguably webAI''s strongest strategic ground, because they fall out of the architecture rather than being bolted on. Running models on-premises and on-device structurally reduces the data-exfiltration surface compared with multi-tenant cloud AI: data, models, and inference all stay inside the customer''s trust boundary, giving the enterprise auditable control over how AI behaves. That posture maps naturally onto the governance frameworks regulated buyers increasingly require - the NIST AI Risk Management Framework and the ISO/IEC 42001 AI management system standard - even where webAI has not published specific certifications. Quality control is the more open question: the value of a private model still depends on retrieval accuracy and model fidelity, which webAI addresses through its knowledge-graph RAG and ColVec1 retrieval research, but which a buyer should validate against their own data. The honest assessment is that webAI''s privacy and data-control story is structurally credible and well-aligned to compliance expectations, while published evidence of formal security certifications and independent quality benchmarks is thinner than the architecture''s promise and is a reasonable diligence request.'
  claimRefs:
  - CE027
  - CE028
  - CE029
  - CE030
