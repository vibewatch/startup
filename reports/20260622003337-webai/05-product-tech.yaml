chapter:
  number: 5
  title: Product and Technology
  summary: webAI is an end-to-end private AI platform - Navigator, Companion, Runtime, webFrame, and Network - that quantizes and distributes models to run on-device on Apple Silicon, keeping data in the customer's trust boundary; its moat is deployment and efficiency engineering over open frameworks, with production proof at Oura and MacStadium but uneven module maturity and single-ecosystem dependency.
sections:
- id: product-definition
  title: Product Definition and Customer Workflow
  body: 'In customer workflow terms, webAI is an end-to-end private AI platform: it lets an enterprise take its own data, build and train custom models, and run them on hardware it controls - on-premises or on device - rather than sending data to a shared public cloud. The workflow is anchored by two customer-facing products. Navigator is the build-train-deploy environment that turns domain knowledge into production models, giving technical teams a full lifecycle from data to deployed model. Companion is the consumption layer: a private AI assistant that connects ordinary employees to those domain-specific models through a secure chat interface, so the value reaches non-technical users. Beneath both sits Runtime, the orchestration control layer that powers every deployment across distributed devices. The result is a closed loop that mirrors how a regulated enterprise actually wants to adopt AI: data stays inside the trust boundary, models are tuned to the organization''s own knowledge, and employees interact with those models without that data ever transiting a third-party cloud. That workflow framing - private by construction, lifecycle-complete, and employee-accessible - is the heart of webAI''s product proposition and the basis for everything in its architecture.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  tableRefs:
  - TE002
  figureRefs:
  - FE002
- id: module-map
  title: Module, Asset, and Product-Line Map
  body: 'webAI''s platform decomposes into a layered set of modules that map cleanly onto a stack. At the top are the applications - Navigator for model creation and Companion for assistant-style consumption. Below them, Runtime provides orchestration; webFrame handles model execution and quantization; and the Network layer forms a distributed AI fabric that can spread a single workload across multiple devices. A developer CLI exposes the whole platform programmatically for model and deployment management. On top of this core, webAI ships capability modules and industry solutions: a multi-modal knowledge-graph RAG offering that grounds models in enterprise data; ColVec1 retrieval research aimed at smarter, more efficient retrieval; and edge solutions for computer vision and predictive anomaly detection that extend the platform into industrial and visual use cases. These are then packaged as vertical solutions for aviation, healthcare, and manufacturing. The module map matters for diligence because it shows webAI is not a single product but a platform with distinct layers, each of which can be a source of differentiation or, conversely, a dependency and maintenance burden.'
  claimRefs:
  - CE005
  - CE008
  - CE009
  - CE010
  - CE011
  - CE021
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: architecture
  title: Architecture and Operating Model
  body: Architecturally, webAI inverts the cloud AI model. Instead of centralizing inference in a hyperscaler data center, it runs models on-device and on-premises so data never leaves the customer's environment. Three engineering pieces make that feasible. webFrame compresses models through quantization so large models fit and run on local hardware. The Network layer distributes a model across multiple local devices, letting webAI run workloads that exceed any single device's memory budget. Runtime orchestrates the whole thing as a control plane. The platform is specifically optimized for Apple Silicon, exploiting unified memory and on-device acceleration, and aligns with Apple's open-source MLX array framework - a relationship that is both an enabler and a dependency. webAI publicly describes bringing the world's biggest models down to local devices, which is the crux of its technical story. The operating model contrasts sharply with GPU-cloud stacks from the hyperscalers and reflects the broader cost-of-cloud argument for repatriating steady-state inference. The architecture is genuinely differentiated, but it concentrates the stack on one hardware ecosystem and trades cloud elasticity for deployment-side engineering - a deliberate and consequential design choice.
  claimRefs:
  - CE012
  - CE006
  - CE007
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
