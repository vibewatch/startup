chapter:
  number: 8
  title: Valuation
  summary: The recommendation is TRACK (score ~7.2/10, medium confidence, medium risk, valuation stance stretched). webAI's $2.5B January 2026 pre-money valuation - up ~3.6x from $700M in 2024 on ~$60M disclosed raised - implies $100-167M of ARR at 15-25x AI-infrastructure multiples, aggressive against thin public traction. Closest comps are Cohere (~$6.8B) and Mistral (~$13.7B), not frontier labs. Convert to actionable only on disclosed revenue/retention or a newly priced round.
sections:
- id: investment-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'webAI is, at its core, a bet on a specific structural claim: that a large and growing share of enterprise and government AI workloads must run privately, on-premises, and on-device, and that webAI can own that deployment niche better than cloud-first incumbents. The bull thesis builds from three legs. First, the opportunity - edge and sovereign AI - is large and fast-growing, giving webAI room to scale if it converts demand. Second, the product works: Oura''s 2.2GB on-device model at roughly a 10x cost reduction and MacStadium''s 20,000-plus requests per minute are real production proof, not demos. Third, the positioning is genuinely differentiated against hyperscalers. The anti-thesis is equally concrete. A $2.5 billion valuation rests on revenue webAI does not disclose, competition from hyperscalers who can bundle agentic AI is intensifying, and the stack depends heavily on a single hardware ecosystem. Overlaying both is macro risk: with AI investment running roughly four-to-one ahead of sector revenue, a broad multiple compression would hit webAI''s mark hard. The honest synthesis is that the thesis rests on whether durable sovereign-AI demand - not AI hype - sustains growth, and that question cannot be settled from public evidence alone, which is precisely why the recommendation is calibrated rather than emphatic.'
