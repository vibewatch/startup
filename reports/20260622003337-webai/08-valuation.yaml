  - FV002
- id: scenarios
  title: Bull, Base, and Bear Scenarios
  body: 'Because webAI''s revenue is undisclosed, scenario analysis must be framed as explicit, falsifiable assumptions rather than precise forecasts. In the bull case, sovereign-AI adoption accelerates and webAI scales ARR toward $150-250 million, supporting an $8-15 billion valuation or exit; this is the category-leader outcome. In the base case, webAI becomes a solid niche leader with ARR of roughly $50-100 million, supporting a $3-5 billion valuation broadly in line with - or modestly above - today''s entry. In the bear case, AI-multiple compression and hyperscaler competition stall growth and force a down round near $1-1.5 billion. Two assumptions drive almost the entire range: webAI''s ARR trajectory and the prevailing AI-multiple regime at exit. The clearest downside triggers are a flat or down round, the loss of a flagship customer, or a broad AI re-rating. On current evidence, probability weight tilts toward the base case, with execution risk capping the likelihood of the bull outcome. The sharpest single data point is the implied-ARR math: at AI-infrastructure multiples of 15-25x, a $2.5 billion valuation implies roughly $100-167 million of ARR today - aggressive for a company that has disclosed only about $60 million raised, and the crux of why the base case, not the bull case, anchors the recommendation.'
