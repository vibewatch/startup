- id: comparable-valuation
  title: Comparable Valuation Set
  body: 'Comparable analysis places webAI in a premium-priced AI-infrastructure tier rather than the frontier-lab stratosphere. The multiple environment in 2026 spans roughly 20-50x revenue for foundation models, 15-25x for AI infrastructure, 8-20x for AI applications, and 3-7x for conventional SaaS - so the category an analyst assigns webAI matters enormously. The most instructive peers are not the giants but the mid-tier: Cohere, an enterprise-AI infrastructure company, was valued near $6.8 billion, and Mistral, a European sovereign-AI champion, near $13.7 billion and reportedly raising at around EUR 20 billion - evidence that sovereign-AI narratives command premium pricing, but typically on revenue scale webAI has not publicly demonstrated. Frontier labs - OpenAI near $850 billion, Anthropic near $380 billion, xAI near $200 billion - sit far above and mainly contextualize how small webAI''s $2.5 billion actually is in absolute terms. The appropriate comparable basis is AI-infrastructure and AI-application multiples, given webAI''s deployment-and-platform model. On that basis, webAI''s mark looks rich relative to disclosed traction, and the valuation-sensitivity figure makes the tension explicit by showing the ARR required to justify $2.5 billion across the plausible multiple range.'
