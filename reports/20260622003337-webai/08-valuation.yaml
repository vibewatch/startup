- id: exit-diligence
  title: Exit Readiness and Final Diligence Asks
  body: 'On exit, webAI''s realistic paths are a strategic acquisition by an enterprise-software, security, or infrastructure incumbent that wants private-AI capability, or a later IPO if revenue scales into the hundreds of millions. Neither is imminent, and exit readiness is genuinely limited today: thin public financials and governance disclosure would have to mature substantially before an IPO is credible, and an acquirer would demand the same financial and customer evidence this report repeatedly flags as missing. That makes the final diligence list short and pointed. The highest-priority ask is audited financials - revenue, ARR, gross margin, and burn - to anchor the valuation; the close second is customer concentration and retention data to test how durable the revenue base really is; and the third is a full capitalization table to quantify the preference and dilution overhang. Against those asks, an investor should pre-commit to explicit kill triggers - a flat or down round, the public loss of a flagship customer such as Oura, or a major security or agentic-AI breach - and recognize the broader thesis-break conditions: sovereign-AI demand proving to be hype, a sharp AI re-rating, or disclosed revenue landing far below the implied level. Framed this way, TRACK is not indecision; it is a disciplined wait for the two or three disclosures that would convert webAI from a watchlist name into an actionable one.'
