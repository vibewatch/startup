evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue and unit economics
    missingEvidence: Audited revenue, ARR, run-rate, and margin figures
    whyItMatters: Without revenue, the $2.5B valuation cannot be tied to financial scale or growth.
    diligencePath: Request a financial data room with audited statements and ARR build.
    relatedQuestionRefs:
      - QO017
      - QO016
  - type: conflicting-data
    severity: minor
    topic: founding provenance
    missingEvidence: Reconciliation of Tracxn's 2003 Grand Rapids/Meeks record with the 2019 Austin founding
    whyItMatters: Conflicting founding facts undermine confidence in third-party data and company history.
    diligencePath: Pull incorporation and corporate-registry filings to establish the legal entity timeline.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: leadership and founder table completeness
    missingEvidence: Complete executive roster and independent-director list
    whyItMatters: A partial leadership picture limits assessment of bench depth and governance independence.
    diligencePath: Request an org chart and board roster from the company.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: stakeholder or investor map ownership
    missingEvidence: Capitalization table and ownership percentages
    whyItMatters: Ownership concentration affects governance and downside protections.
    diligencePath: Request the cap table and shareholder agreements in diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Current verified headcount and org growth rate
    whyItMatters: Headcount validates scale-up pace implied by the valuation.
    diligencePath: Confirm headcount via the company and LinkedIn workforce data.
    relatedQuestionRefs:
      - QO018
  - type: conflicting-data
    severity: material
    topic: market sizing conflict across analysts
    missingEvidence: A definition-matched, reconciled market size for private enterprise AI
    whyItMatters: Order-of-magnitude forecast spread makes any single TAM unreliable for underwriting.
    diligencePath: Adopt one definition-matched lens and sensitivity-test the CAGR.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: material
    topic: webAI reachable market share
    missingEvidence: Company-specific pipeline, win-rate, and serviceable-share data
    whyItMatters: Without it, the bridge from TAM to webAI's opportunity is assumption, not measurement.
    diligencePath: Request pipeline coverage and segment win-rate data in diligence.
    relatedQuestionRefs:
      - QM022
      - QM010
  - type: stale
    severity: minor
    topic: adoption rate freshness
    missingEvidence: Audited 2026 enterprise production-adoption rate (not pilot intent)
    whyItMatters: Pilot-stage adoption overstates production demand given the production drop-off.
    diligencePath: Source a 2026 production-adoption survey and reconcile with pilot intent.
    relatedQuestionRefs:
      - QM024
      - QM020
  - type: missing-source
    severity: material
    topic: competitor win/loss evidence
    missingEvidence: Independent head-to-head win/loss data versus Palantir, Cohere, and Microsoft
    whyItMatters: Positioning maps are directional; real competitive outcomes require deal-level evidence.
    diligencePath: Request win/loss analysis and competitive displacement references in diligence.
    relatedQuestionRefs:
      - QP004
  - type: conflicting-data
    severity: material
    topic: moat vs open-weight commoditization
    missingEvidence: Evidence that webAI's edge survives open-weight model parity
    whyItMatters: If differentiation rests on inference rather than deployment, commoditization erodes the moat.
    diligencePath: Probe how much value sits in deployment engineering vs proprietary models.
    relatedQuestionRefs:
      - QP017
  - type: missing-source
    severity: minor
    topic: competitor pricing
    missingEvidence: Transparent, comparable competitor pricing
    whyItMatters: Opaque pricing prevents clean TCO comparison for buyers and underwriters.
    diligencePath: Triangulate pricing via customer interviews and procurement data.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
