- id: adoption-trajectory
  title: Adoption Trajectory and Deployment
  body: webAI's adoption trajectory is best read through its disclosed deployments rather than through metrics it does not publish. The clearest milestone is the February 2025 ŌURA partnership to power personalized, on-device health AI for Oura Ring members - an externally reported, brand-name deal. In aviation, webAI and Springshot launched an AI compliance platform for airline operations, again corroborated outside webAI's own pages. On the infrastructure side, MacStadium runs webAI in production and reportedly sustains more than 20,000 requests per minute, a concrete usage-scale signal. The honest gap is that webAI discloses no total customer count, account base, or active-deployment number, so the trajectory must be inferred from a sequence of named wins plus a developer-facing wedge rather than from an account curve. The public narrative frames edge AI in aviation and other operations as an expanding surface through 2026. The deployment path itself - discovery, security review, pilot, production, then expansion to more models and employees - is visible in how these references matured, but the absence of an aggregate denominator means a buyer should treat the trajectory as directionally positive yet quantitatively unproven.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU031
