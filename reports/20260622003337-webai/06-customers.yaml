- id: named-customer-proof
  title: Named Customer Proof
  body: 'The strength of webAI''s customer story rests on a small set of high-quality references. The Oura deployment is the flagship: it runs a 2.2GB on-device model at roughly a 10x cost reduction versus cloud inference, and Oura''s COO is on record choosing webAI specifically for privacy and on-device data control. That combination - a named outcome plus an executive rationale - is unusually strong proof for a company at this stage. MacStadium adds a different kind of evidence: a hard throughput metric of more than 20,000 requests per minute that demonstrates production serving at scale. Springshot supplies vertical depth, applying edge AI to airline compliance and ground operations. Taken together, however, webAI''s publicly named production customers are concentrated in just three flagship references. Evidence quality is strongest for Oura and MacStadium and lighter for broader vertical claims, which lean on solution pages rather than named accounts. The disciplined read is that these logos genuinely demonstrate adoption and real outcomes, but logos alone do not prove retention, renewal, or full production rollout across an account - a distinction a buyer must hold firmly when weighing the proof.'
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU032
  - CU033
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-durability
  title: Retention and Durability
  body: 'Retention is the weakest-evidenced part of webAI''s customer picture, and the company''s own quality bar demands honesty about it. webAI discloses no net revenue retention, gross retention, churn, or renewal-rate figures, so there is simply no quantitative retention series to assess. What can be said is structural and directional. On the structural side, on-premises deployments create high switching costs: once a custom model is embedded in a customer''s own infrastructure, ripping it out is costly, which supports durability provided the customer is satisfied. On the directional side, the Oura relationship appears to have persisted into 2026, with Oura''s CEO joining webAI''s board - a continuity signal, though a board seat is not the same as a renewal metric. Public satisfaction evidence is limited to vendor-published references rather than independent reviews or verified renewals, and headline usage numbers like 20,000 requests per minute are single-customer figures without an account-wide denominator. The fair conclusion is that webAI''s durability case is plausible on switching-cost logic but unsubstantiated on hard retention data, making retention metrics the single most important customer diligence ask.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU035
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration
  title: Expansion and Concentration Risk
  body: 'On the upside, webAI''s architecture lends itself to land-and-expand: a customer that deploys one model can add more models, extend Companion to more employees, and move into adjacent verticals without leaving the platform, so the natural motion is expansion within an account once trust is established. The offsetting risk is concentration. With only a handful of publicly named references, webAI carries reference-concentration risk, where a single flagship account such as Oura bears a disproportionate share of the proof burden - if that relationship soured publicly, the customer narrative would be materially weakened. Distribution looks primarily direct-sales today, with partnerships like Springshot as an emerging rather than dominant channel, which keeps customer acquisition costly and founder- and sales-team-dependent. Procurement friction compounds this: enterprise and especially government buyers of on-premises AI run long security-review and integration cycles that slow conversion. Third-party company databases reinforce the caution, showing thin disclosed traction metrics and underscoring how much of webAI''s customer evidence remains private. The expansion logic is real, but concentration, channel immaturity, and procurement drag are the dynamics a buyer must price in.'
  claimRefs:
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
