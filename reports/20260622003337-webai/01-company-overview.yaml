- id: milestones-adverse
  title: Milestones and Adverse Signals
  body: 'webAI''s milestone arc compresses a great deal of activity into 2025-2026. Founded in 2019, the company spent its early years building a distributed, on-device platform before a burst of commercial and financing milestones: an announced Oura partnership in 2025, the November 2025 launch of a real-time airline-compliance model with Springshot that Spirit Airlines deployed first, a $60 million Series A, and the January 2026 Series A extension at a $2.5 billion valuation paired with the launch of Intelligence Labs under Dr. PJ Maykish. The company also stamped its brand on a Congress Avenue building in Austin and is slated to appear at SXSW 2026. The most important adverse signal is evidentiary rather than operational: third-party aggregator Tracxn lists webAI as founded in 2003 in Grand Rapids by a different founder (James Meeks), directly conflicting with the company''s stated 2019 Austin founding by Stout, Baird, and Mauer. Whether this reflects a predecessor entity, a data error, or a corporate restructuring is unresolved, and it is the kind of provenance discrepancy a buyer should reconcile against incorporation records before underwriting the company''s history.'
