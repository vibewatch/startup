- id: snapshot-metrics
  title: Snapshot Metrics and Disclosure Gaps
  body: 'On the cover metrics that diligence typically anchors to, webAI presents an asymmetric picture: valuation and capital signals are well sourced, but operating financials are almost entirely private. The headline figures - a $2.5 billion valuation and roughly $60 million raised - are corroborated across company statements and independent reporting, but webAI has not disclosed revenue, ARR, or run-rate, and exact headcount is only estimable from third-party data in a 51-200 employee band as of mid-2025, with active hiring underway. In place of financial disclosure, the company leans on customer-reported performance proof points: Oura cites a 10x cost reduction versus OpenAI with matching performance in a 2.2GB on-device footprint, and MacStadium reports running webAI models at more than 20,000 concurrent API requests per minute on Apple Silicon. Spirit Airlines is named as the first airline to deploy webAI''s real-time compliance model. These are credible engineering signals, but they are company- and customer-sourced rather than audited, and a crowded field of 300-plus tracked competitors means the metrics that matter most for valuation - revenue, retention, and margins - remain unverifiable from public sources and constitute the central diligence gap for this chapter.'
  claimRefs:
  - CO035
