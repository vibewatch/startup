- id: leadership-governance
  title: Leadership, Founders, and Governance
  body: webAI was co-founded by David Stout, Ethan Baird, and Tyler Mauer, three computer engineers who met in Michigan; Stout, who grew up in a blue-collar household in rural Michigan, serves as co-founder and CEO and remains the public face of the company. The leadership bench has deepened materially in 2026. In January 2026 the company appointed Dr. PJ Maykish as Chief Intelligence Officer to lead a newly formed Intelligence Labs; Maykish previously served as Director for Technology Competition at the National Security Council and directed research for the National Security Commission on Artificial Intelligence, signaling a deliberate push into national-security and public-sector markets. That push was reinforced by the appointment of Dr. Jason Rathje as President of Public Sector to accelerate sovereign AI adoption across government and defense. On governance, David Shuman - chairman of Oura - chairs webAI's board, and in May 2026 Oura CEO Tom Hale joined the board of directors, tightening an already close commercial and governance relationship with Oura. The flip side of a charismatic, founder-led structure is concentrated key-person dependence on Stout, which the board is explicitly designed to support; full board composition and independent-director details are not comprehensively disclosed.
