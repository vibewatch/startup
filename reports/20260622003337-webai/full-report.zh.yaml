    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与创立故事
        blocks:
          - type: paragraph
            body: >-
              webAI 是一家位于 Texas 州 Austin 的企业软件公司，自称首个端到端私有 AI 平台，核心愿景是「AI 在数据所在之处运行」。2019 年，几位来自 Michigan
              的计算机工程师创立公司；他们很早就判断，医疗、制造、航空和国防里最敏感、风险最高的 AI 工作负载不适合放在公有云。创立命题延续至今：智能应在本地运行，隐私、韧性和所有权从架构里长出来。这也支撑了公司把自己定位为
              Microsoft Copilot、Google Vertex agents 等云优先既有厂商之外的主权、本地部署替代方案。公司虽起步于 Michigan，但总部已迁至 Austin
              市中心，服务航空、医疗、制造、教育、零售、金融服务、物流和公共部门客户。截至 2026 年，公司处于成长阶段，已完成 Series A 及 Series A 延伸轮。它的商业模式可以概括为：授权一套私有 AI
              平台——覆盖 Navigator 构建工作台和 Companion 助手——让企业在自有基础设施上构建并运营定制模型，而不是向超大云厂商租用推理能力。
