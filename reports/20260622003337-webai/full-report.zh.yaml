      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              需求集中在数据不能自由离开企业的细分领域。锚定买方包括医疗和金融服务中的受监管企业、政府和国防机构、工业和制造运营方，以及航空和物流企业——正是 webAI
              列出的行业。第五类正在快速出现：把端侧智能嵌入消费硬件的制造商，智能戒指厂商 Oura 就是例子。预算所有权很少只归一个席位：CIO 和 CTO 负责平台决策，CISO
              负责让主权性具备吸引力的数据保护授权，业务线领导则拥有受监管工作流及其
              ROI。政府和国防尤其重要，因为各国越来越把数据、模型和算力控制权视为战略资产。分析师对采用路径的判断相对一致：买方从认知走向试点，再到有限生产，最后才是企业级扩展；但生产阶段流失很陡。自治智能体从受控试点进入受监管生产工作流时，会暴露信任、安全和集成障碍，许多项目跨不过去。
