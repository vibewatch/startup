      - number: '3.4'
        title: 转换成本、锁定与分发权力
        blocks:
          - type: paragraph
            body: >-
              竞争耐久度既取决于原始能力，也同样取决于分发和锁定。智能体平台一旦嵌入工作流并连接企业数据，转换成本就很高：重新集成、重新训练和治理重新审批都会造成真实摩擦，先落地的厂商因此受益。不过，企业越来越倾向多栖，同时运行云端和私有
              AI 厂商；这限制了任何单一厂商的锁定，也切碎了 webAI 的潜在钱包份额。决定性的结构优势在既有厂商手中：把 agents 捆进企业已拥有的套件——Microsoft
              365、Salesforce、ServiceNow——给了它们近乎零摩擦的分发，直销挑战者无法复制。供给侧，NVIDIA 和 Dell 这类有硬件关系的竞争者，或 AWS、Google
              这类有超大规模算力的厂商，控制着 webAI 必须采购或绕开来工程化的投入。webAI 的反制，是把客户自有硬件变成部署底座，绕过云锁定和供应依赖——这是实质差异化，但也提高了部署复杂度。
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP026
      - number: '3.5'
        title: 护城河耐久度与负面竞争证据
        blocks:
          - type: paragraph
            body: >-
              webAI 的护城河真实存在，但持续受到挑战。它最可防守的资产，是能在客户自有 Apple Silicon 和边缘硬件上私有运行模型的分布式端侧架构；最强证明点是 Oura 部署——据称在 2.2GB
              端侧模型上实现 10x 成本降低。这是可信且量化的边缘优势。不过，负面情景也很重。第一，Mistral 的开放权重模型和 MLX
              这类框架可能把模型层商品化，侵蚀建立在专有推理而非部署工程上的差异化。第二，最尖锐的替代威胁来自超大云厂商和 Salesforce
              的捆绑销售，它们能以边际成本向既有客户提供「足够好」的私有选项。第三，与超大云厂商和资金最充足的实验室相比，webAI 在资本和分发上仍未成规模，因此必须靠速度和聚焦取胜。第四，主权 AI
              细分本身也在变拥挤，Cohere、Mistral、Red Hat、H2O 和 Dell 都在营销私有部署，Glean、Writer 和 Databricks 也在挤压相邻预算。耐久度结论是：只有当 webAI
              持续保持部署体验和成本性能领先，且更大阵营无法快速复制时，它的架构切入点才可防守。
