      - number: '7.6'
        title: 缓解、监控与否决标准
        blocks:
          - type: paragraph
            body: >-
              每项主要风险都有可信的缓解路径，纪律严明的投资者应跟踪一组具体指标，并预先承诺明确的否决标准。监管上，正式采用 NIST AI RMF 和 ISO/IEC 42001，并推进 SOC 2 与 FedRAMP
              授权，可以同时降低合规风险，打开受监管行业和政府收入。依赖上，跳出 Apple Silicon——或证明可移植到其他加速器——会削减单一供应商暴露；webAI
              自身架构已经是部分安全缓解，因为把数据留在端侧会从结构上缩窄泄露面。最重要的监控指标是融资节奏、净新增具名客户、认证里程碑，以及任何首次披露的收入或留存。否决标准应提前设定：平轮或下轮，或披露收入远低于
              $2.5B 估值所隐含水平，会打破论点；Oura 这类旗舰客户公开流失，会因参考案例集中而打破论点；重大安全事件或已证实的 agentic-AI
              breach，也会打破论点，因为信任就是全部价值主张。用这种方式框定决策，可以把模糊的风险叙事压缩成少数可观察、可证伪的触发器——这正是 $2.5B 私有估值所要求的。
