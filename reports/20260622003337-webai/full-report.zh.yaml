      - number: '4.4'
        title: 公开牵引力与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              牵引力上，webAI 能证明部署成立，但不能证明规模成立。公开记录包含定性、具名证据——与智能戒指厂商 Oura 的生产合作、基础设施提供商 MacStadium（据称每分钟处理 20,000+ 请求）以及通过
              Springshot 合作触达航空客户——但没有量化财务牵引力。公司未披露收入、ARR 或 run-rate；未披露付费客户总数；也没有发布单位数、地点数或活跃用户数。CB Insights
              对该公司的财务画像也印证了这种不透明，未列收入、利润率或 burn
              数据。结果是一种尖锐不对称：公司能证明技术在可信企业的生产环境中工作，从而降低产品命题风险；但它没有提供任何能让投资者测算业务规模或建模增长的数据。对一家背负数十亿美元估值的公司来说，这是核心财务缺口，也是任何财务评估都必须加重保留、并在公司提供
              data room 前视为暂定判断的原因。
            claimRefs:
              - CI015
