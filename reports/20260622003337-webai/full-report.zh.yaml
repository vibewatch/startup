  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入来源
        blocks:
          - type: paragraph
            body: >-
              webAI 的收入模式是企业平台许可，而不是自助式 SaaS。公司变现的是一套相连的栈：Navigator，即用于定制模型的构建—训练—部署环境；Companion，即面向每位员工的私有 AI
              助手；以及支撑部署的底层 Runtime 编排层。由于 Companion 按员工定位，较大的平台协议中几乎一定包含按席位计费部分，而本地部署通常会捆绑实施和支持服务。webAI
              不公布标价——交易是谈判型企业合同，这与 Palantir、Cohere 等私有 AI
              同行一致——因此外部观察者无法重建平均合同价值，也无法精确拆分许可、席位和服务之间的比例。另一个尽调细节是收入确认：本地部署的期限许可或永久许可，确认节奏可能不同于按期确认的
              SaaS；在没有披露会计政策的情况下，已确认收入的时点和质量无法验证。整体图景是：多产品变现设计可信，但实际经济性完全私有。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
