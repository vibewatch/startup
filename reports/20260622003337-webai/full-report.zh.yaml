            body: >-
              webAI 的资本故事在四个月内急剧提速。公司先完成 $60 million Series A，随后在 2026 年 1 月完成 Series A 延伸轮；公司称该轮获得超额认购，并将投前估值推至 $2.5
              billion。对一家按第三方追踪机构估算、累计公开融资只有约 $60 million 的公司来说，这一跳升非常醒目。Axios 将该延伸轮报道为「high
              double-digit」百万美元规模，但具体融资额没有公开披露，因此 $2.5 billion 估值到底对应多少新增一级资本，仍存在信息缺口。投资方组合质量和信念度值得注意：Marc Benioff 的
              TIME Ventures、Gavin Baker 领导的 Atreides Management 加入，老股东包括 Forerunner Ventures 和 OXCART
              Ventures。报道显示，规模更大的 Series B
              预计随后到来。十亿美元以上估值、公开融资额有限、轮次规模未披露三者叠加，意味着该估值更多由叙事、投资方质量和少数标杆客户证据驱动，而非公开可验证的财务规模。
