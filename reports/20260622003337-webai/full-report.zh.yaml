      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营上，webAI 继承了 agentic AI 的安全风险，也承接了分布式架构带来的新风险。agentic 风险已有清晰目录：OWASP 的 Agentic AI Top 10
              记录了工具误用、记忆投毒、目标操纵等攻击面；同行评审的红队研究也显示，agentic 系统仍容易受到越狱和提示注入影响。对一个主张让自主 agent
              处理企业数据的平台而言，这些不是理论担忧，而是现实问题；Cloud Security Alliance 也把 AI
              安全与防护定义为仍不成熟的领域。分布式端侧设计还带来自己的故障模式——设备异质性、同步和局部中断——这些是集中式云服务可以避开的；模型质量和幻觉风险在生产中仍会存在，因为私有部署本身不能保证准确性或扎实
              grounding。围绕 Apple Silicon 优化，也把可部署容量绑定到 Apple
              硬件供应上，形成供应依赖。关键细节是，本地部署在安全上是双刃剑：它缩小了多租户暴露面，却把很大一部分安全负担转移到每个客户环境中，因此一边缓解部分风险，一边制造新风险。风险传导图展示了上游冲击——硬件约束或安全故障——如何级联成部署延迟、客户流失，最终变成融资风险。
            claimRefs:
