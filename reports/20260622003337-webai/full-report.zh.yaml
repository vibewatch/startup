      - number: '8.3'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              webAI 的融资历史框定了入场决策。公司于 2024 年 9 月完成 $60M Series A，估值 $700M；第三方追踪机构显示，已披露总融资约为 $60M。2026 年 1
              月一轮超额认购融资中，公司投前估值为 $2.5B，融资金额仅被描述为数千万美元级，投资者包括 TIME Ventures、Atreides Management 和
              Forerunner。这条序列释放两个相反信号。积极面是，品牌投资者参与的超额认购轮是真实需求信号，说明成熟资本愿意承销这个故事。谨慎面是，估值从 $700M 升至 $2.5B——约 16 个月内大约 3.6
              倍——却没有披露收入来锚定上调幅度；按这个价格入场，需要相信 webAI 尚未公开证明的增长轨迹。投资者还必须建模优先权栈：多轮融资叠加 OXCART WEBAI I 和 EPQ webAI
              系列这类特殊目的载体，意味着分层清算优先权和潜在稀释压力，会排在新的普通股等价资本之前。克制结论是，公开证据支持 webAI 股权有需求，但单凭这些证据不足以支撑 $2.5B 价格。
