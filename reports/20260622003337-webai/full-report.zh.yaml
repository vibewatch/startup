      - number: '8.5'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >-
              可比分析把 webAI 放在高溢价 AI 基础设施层，而不是前沿实验室的平流层。2026 年倍数环境大致为：基础模型 20-50 倍收入、AI 基础设施 15-25 倍、AI 应用 8-20 倍、传统 SaaS
              3-7 倍——因此分析师把 webAI 归入哪个类别非常关键。最有参考意义的不是巨头，而是中腰部公司：企业 AI 基础设施公司 Cohere 估值约 $6.8B；欧洲主权 AI 冠军 Mistral 估值约
              $13.7B，据称正在以约 EUR 20B 融资。这说明主权 AI 叙事能拿到溢价定价，但通常需要 webAI 尚未公开证明的收入规模。前沿实验室——OpenAI 约 $850B、Anthropic 约
              $380B、xAI 约 $200B——远高于 webAI，主要用来说明 webAI 的 $2.5B 绝对规模其实很小。合适的可比基础是 AI 基础设施和 AI 应用倍数，因为 webAI
              是部署与平台模式。按这个基础，webAI 相对已披露牵引显得偏贵；估值敏感性图通过展示在合理倍数区间内支撑 $2.5B 所需的 ARR，把这种张力直接呈现出来。
