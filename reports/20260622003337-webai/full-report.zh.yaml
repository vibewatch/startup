  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              webAI 并不销售给一个单一、清晰的市场类别；它的机会位于三个相互重叠的市场交叉处——智能体 AI、边缘 / 端侧 AI、主权 / 私有
              AI——分析师通常分别衡量这些市场。其服务边界是企业软件：用于在客户自有基础设施上构建、部署并运营私有 AI
              模型和智能体，覆盖受监管、对延迟敏感的工作负载。边界内包括平台许可、模型构建与部署工具、本地编排；边界外包括消费者聊天机器人，以及 webAI 明确要替代的大部分纯公有云推理 API
              支出。买方权衡的现状替代品包括公有云 LLM API、Microsoft 和 Salesforce 的既有 copilot、ServiceNow agents、UiPath 等 RPA 套件、Palantir
              这类政府级平台，以及企业内部自建模型栈。由于这些替代品资金充足且已嵌入企业工作流，webAI 必须靠差异化的主权性、成本和端侧性能取胜，而不是靠创造新品类。争夺同一 CIO
              和业务线预算的厂商极为拥挤，这是该市场竞争边界最鲜明的特征。
