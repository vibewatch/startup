      - number: '3.3'
        title: 能力、定价与信任对比
        blocks:
          - type: paragraph
            body: >-
              能力层面，webAI 的差异化窄但鲜明：在客户已有硬件上实现完全端侧、分布式推理，并面向 Apple Silicon 优化——这在以 GPU
              云为中心的竞争者中并不常见。该聚焦牺牲了广度，换来可信的隐私和成本故事。定价层面，整个品类都不透明：Microsoft、Palantir 和 webAI
              都回避公开标价，买方无法进行干净的头对头价格比较，只能谈判。进入市场层面，差距很刺眼——超大云厂商和 Salesforce 通过客户已经购买的套件分发 agents，渠道几乎零摩擦，webAI
              直销无法匹配。但在信任和监管姿态上，webAI 位置不错：它与 Palantir、Cohere North、Red Hat 和 H2O.ai
              同属隐私和本地部署领导者阵营，对面是云优先既有厂商；后者的多租户默认设置，对最敏感数据买方构成负担。竞争问题在于：主权性领先是否足以抵消既有厂商的分发和规模优势。
