      - number: '6.4'
        title: 留存与耐久性
        blocks:
          - type: paragraph
            body: >-
              留存是 webAI 客户图景中证据最弱的一块，公司自身的质量标准也要求如实面对。webAI
              没有披露净收入留存、总留存、流失率或续约率，因此根本没有可评估的量化留存序列。能说的只有结构性和方向性。结构上，本地部署会制造高切换成本：定制模型一旦嵌入客户自有基础设施，替换代价很高；只要客户满意，这会支撑耐久性。方向上，Oura
              关系似乎延续到了 2026 年，Oura CEO 加入 webAI 董事会——这是连续性信号，但董事席位不等于续约指标。公开满意度证据仅限于供应商发布的参考案例，缺少独立评价或已验证续约；每分钟 20,000
              次请求这类醒目用量数字，也只是单客户数据，没有账户级分母。公允结论是，webAI 的耐久性逻辑在切换成本上说得通，但硬留存数据没有支撑；留存指标因此是客户尽调中最重要的一项。
            claimRefs:
              - CU021
