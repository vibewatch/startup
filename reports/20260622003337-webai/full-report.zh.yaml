      - number: '5.2'
        title: 模块、资产与产品线地图
        blocks:
          - type: paragraph
            body: >-
              webAI 的平台可拆成一组分层模块，清晰映射到一个技术栈。最上层是应用：Navigator 用于模型创建，Companion 用于助手式消费。其下，Runtime 提供编排；webFrame
              负责模型执行和量化；Network 层形成分布式 AI 织构，可把单一工作负载铺到多台设备上。开发者 CLI 暴露整个平台的编程入口，用于模型和部署管理。在这一核心之上，webAI
              提供能力模块和行业解决方案：多模态知识图谱 RAG，让模型扎根企业数据；ColVec1
              检索研究，目标是更智能、更高效的检索；以及面向计算机视觉和预测性异常检测的边缘解决方案，把平台延伸到工业和视觉用例。随后，这些能力被包装成航空、医疗和制造的垂直解决方案。模块地图对尽调很重要，因为它说明
              webAI 不是单一产品，而是一套有多个层次的平台；每一层都可能成为差异化来源，也可能反过来成为依赖和维护负担。
            claimRefs:
              - CE005
              - CE008
              - CE009
              - CE010
              - CE011
              - CE021
