          value: 250
        - label: 15x（基础设施低位）
          value: 167
        - label: 20x（基础设施中位）
          value: 125
        - label: 25x（基础设施高位）
          value: 100
        - label: 50x（基座模型）
          value: 50
    approximationNotes: 隐含 ARR 数字由上述倍数区间按算术推导得出。
    claimRefs:
      - CV027
      - CV033
