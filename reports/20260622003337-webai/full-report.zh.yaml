      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              webAI 由 David Stout、Ethan Baird 和 Tyler Mauer 共同创立，三人都是在 Michigan 相识的计算机工程师；Stout 出身 Michigan
              乡村蓝领家庭，担任联合创始人兼 CEO，仍是公司的公开门面。2026 年，管理层厚度明显增强。2026 年 1 月，公司任命 Dr. PJ Maykish 为 Chief Intelligence
              Officer，负责新组建的 Intelligence Labs；Maykish 此前在 National Security Council 担任 Technology Competition
              Director，并为 National Security Commission on Artificial Intelligence 负责研究，这显示公司有意切入国家安全和公共部门市场。Dr. Jason
              Rathje 出任 President of Public Sector 进一步强化了这一方向，目标是加速政府和国防中的主权 AI 采用。治理层面，Oura 董事长 David Shuman 担任 webAI
              董事会主席；2026 年 5 月，Oura CEO Tom Hale 加入董事会，使 webAI 与 Oura 之间本已紧密的商业和治理关系进一步加深。魅力型创始人主导结构的另一面，是公司对 Stout
              的关键人物依赖高度集中；董事会显然围绕支持这一结构来设计。完整董事会构成和独立董事细节尚未全面披露。
