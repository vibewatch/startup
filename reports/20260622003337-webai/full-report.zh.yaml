      - number: '8.6'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出上，webAI 的现实路径是被希望获得私有 AI 能力的企业软件、安全或基础设施既有公司战略收购，或在收入扩至数亿美元后走向后期
              IPO。两条都不迫近；今天的退出准备度确实有限：公开财务和治理披露很薄，必须大幅成熟后 IPO
              才可信；收购方也会要求本报告反复标记为缺失的同一组财务和客户证据。因此最终尽调清单短而尖锐。最高优先级是经审计财务——收入、ARR、毛利率和
              burn——用于锚定估值；紧随其后是客户集中度和留存数据，用来检验收入基础到底有多耐久；第三是完整股权结构表，用来量化优先权和稀释压力。面对这些问题，投资者应预先承诺明确的否决触发器——平轮或下轮、Oura
              这类旗舰客户公开流失，或重大安全 / agentic-AI breach——并认识到更广泛的论点破裂条件：主权 AI 需求被证明只是炒作、AI 估值急剧重估，或披露收入远低于隐含水平。这样框定后，TRACK
              不是犹豫不决，而是在有两三项披露能把 webAI 从观察名单标的变成可执行标的之前，保持纪律性等待。
            claimRefs:
