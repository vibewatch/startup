      - number: '6.3'
        title: 具名客户证明
        blocks:
          - type: paragraph
            body: >-
              webAI 客户叙事的强度，来自少数高质量参考案例。Oura 部署是旗舰案例：它在端侧运行 2.2GB 模型，成本相较云端推理约降低 10 倍；Oura COO 也公开表示，选择 webAI
              正是因为隐私和端侧数据控制。具名结果叠加高管决策理由，对这个阶段的公司来说是少见的强证明。MacStadium 提供另一类证据：每分钟超过 20,000
              次请求的硬吞吐指标，说明生产服务已经跑到一定规模。Springshot 则补上垂直深度，把边缘 AI 用于航空合规和地面运营。不过合在一起看，webAI 公开具名的生产客户仍集中在三个旗舰案例。Oura 和
              MacStadium 的证据质量最强，更宽泛的垂直行业主张则较弱，主要依赖解决方案页面，而不是具名账户。克制的解读是：这些 logo 确实展示了采用和真实结果，但仅有 logo
              不能证明留存、续约，或账户内全面生产化铺开——买方衡量证据时必须牢牢守住这个区别。
