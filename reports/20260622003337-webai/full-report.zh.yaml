      - number: '7.4'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              webAI 的依赖地图把风险集中在少数关键关系上。最重要的是技术依赖：平台集中在 Apple Silicon 和 Apple 控制的 MLX 框架上；即便 MLX 是开源的，webAI
              也无法单方面控制其方向、许可或连续性——这是技术栈核心处真正的单一供应商暴露。第二是商业依赖：公开具名参考案例只有少数几个，webAI 存在客户集中风险，Oura
              这样的单一旗舰账户可能承担不成比例的证明份额，甚至收入份额。第三是财务依赖：可见资本基础来自少数资金方和特殊目的载体，包括 SEC 文件中出现的 OXCART WEBAI I 和 EPQ webAI
              系列，这更像阶段性辛迪加融资，而不是广泛机构基础。叠加这些因素，伙伴和分销渠道仍在早期，获客依赖昂贵的直销动作；webAI 的集成生态也比 hyperscaler 竞争对手能提供的 marketplace
              更薄。依赖图明确画出这些链条；实际结论是，webAI 的命运异常依赖 Apple 路线图、少量参考客户和集中的资本辛迪加，其中任何一项都足以成为正当的尽调重点。
