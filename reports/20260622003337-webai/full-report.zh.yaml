      - number: '3.2'
        title: 竞争者画像与规模
        blocks:
          - type: paragraph
            body: >-
              竞争集合的规模跨度极大。Microsoft、Google 和 AWS 每年各自投入数十亿美元到 AI，并把分发触达几乎所有大型企业；这种资本和触达优势远超 webAI 约 $60 million 的融资规模。CB
              Insights AI 100 也印证了其下方还有一片资金充足的挑战者。直接主权竞争者中，Palantir 最成熟，拥有深厚的本地部署和国防落地经验；IBM watsonx 用治理工具面向混合和受监管行业
              AI；Cohere North 主打私有、in-VPC 和本地企业 AI，正面冲击 webAI 叙事。Mistral 可本地部署的开放权重模型支持主权构建，同时压低专有推理的价值。基础设施层——Red Hat
              OpenShift AI、Dell AI Factory 和 NVIDIA enterprise stacks——提供客户和竞争者都能自行组装的积木。战略上，Microsoft 正通过 Copilot
              Studio 把 agents 嵌入 M365 和 Azure，Salesforce 则把 Agentforce 做成平台中心，两者都倚重 webAI 不具备的既有地位。
