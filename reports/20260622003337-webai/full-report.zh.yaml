      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              webAI 市场的牛市逻辑建立在几股相互强化的力量上。第一，数据主权监管——EU AI Act 以及各国平行框架——从结构上把敏感工作负载推向私有、可控部署。第二，Andreessen Horowitz「cost
              of cloud」分析提出的云成本和回迁经济学显示，一旦使用规模扩大，把稳定推理负载移出公有云越来越划算，自有基础设施的 ROI
              会改善。第三，医疗、航空和制造中的延迟、隐私和离线韧性要求，有利于边缘和端侧执行。第四，采用动能本身也在增强：Gartner 预计，到 2026 年底，40% 企业应用将嵌入任务专用智能体，高于 2025 年不到
              5%。这些驱动也面对真实约束。本地部署复杂且集成很重，拉长销售周期；搭建主权基础设施需要资本，利好资金充足的厂商；围绕自治智能体的信任、安全和安保担忧限制了从试点到生产的跃迁。净效果是：市场长期增长曲线很陡，但执行门槛很高；能压缩部署复杂度并证明安全性的厂商会拿到不成比例的份额。
