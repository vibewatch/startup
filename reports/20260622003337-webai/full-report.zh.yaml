  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              webAI 的风险画像，与其说是一长串小问题，不如说是少数几个严重且结构上相互连接的暴露。三类风险占主导。第一是财务脆弱性：据报 $2.5B 估值建立在 webAI 未披露的收入之上，如果增长不及预期或 AI
              情绪降温，公司会暴露在剧烈倍数压缩中。第二是单一供应商依赖：技术栈集中在 Apple Silicon 和 Apple 控制的 MLX 框架上，把 webAI 绑在一条硬件路线图上。第三是 hyperscaler
              的竞争压力，它们可以把 agentic AI
              捆进既有客户体系。我们按发生概率、影响和缓解成熟度的乘积给风险排序；只要底层证据是私有而非可验证，就额外加权——因为对外部投资者来说，无法验证的风险与未缓解的风险没有区别。按这个框架，剩余暴露最高的是财务和客户维度，也正是披露最薄的地方。宏观背景让风险更尖锐：AI
              投资创纪录地大幅跑在行业收入前面，一旦资本收紧，最需要资金的恰恰会是这类资本密集、披露前阶段公司。后续章节将逐一处理监管、运营、依赖和财务风险，并列出缓解措施和明确的否决标准。
