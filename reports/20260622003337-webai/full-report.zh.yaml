      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              webAI 的融资历史是其财务画像中记录最充分的部分。公司于 2024 年 9 月以 $700 million 估值完成 $60 million Series A，并引入来自 Apple、Benchmark
              Capital 和 Activision Blizzard 的董事会成员。2026 年 1 月，公司以 $2.5 billion 投前估值完成一轮超额认购融资，TIME Ventures、Atreides
              Management（Gavin Baker）、Forerunner 和 OXCART Ventures 参与；该轮金额仅被描述为 double-digit millions，因此披露的累计融资仍锚定在约 $60
              million Series A。SEC 文件独立印证了投资者需求：一家 Austin SPV，OXCART WEBAI I LLC，于 2024 年 7 月提交 Form D，为接触 webAI 股权设立
              $10 million pooled vehicle；同一窗口，EPIQ Capital Group 管理的第二个 SPV 也提交文件——不过 OXCART 在提交日仅报告 $10 million
              募集目标中已售出 $1 million。两轮融资到账后，webAI 短期看似资本充足，但 burn 和确切 runway
              未披露，也没有公开证据显示存在债务或项目融资义务。投资方组合质量是真实加分项，部分抵消了硬财务缺失；但融资依赖仍然存在：要维持 $2.5 billion 估值，公司最终需要披露收入牵引力，或继续获得资本支持。
