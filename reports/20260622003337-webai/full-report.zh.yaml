      - number: '5.4'
        title: 部署、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              部署和可靠性方面，webAI 能拿出许多同阶段公司缺少的生产证据。部署安装在客户基础设施中，webAI 的支持资源记录了 onboarding 和用例指导，并提供 CLI
              做编程化管理。最强可靠性信号来自具名生产工作负载：MacStadium 据称在 webAI 上持续承载每分钟超过 20,000 个请求，Oura 部署则以约 10x 成本降低运行 2.2GB
              端侧模型。这些是具体吞吐和效率数据点，不只是 demo。路线图方面，公开信号——Intelligence Lab 启动以及截至 2026 年持续宣布的模块扩展——显示公司仍在积极投入平台延展，但 webAI
              没有发布详细前瞻路线图。产品成熟度明显不均：编排核心和端侧推理已有生产验证，一些能力模块如异常检测看起来更早期；开发者生态虽已存在，但仍在成熟。对买方的实际含义是：核心平台今天可部署，但模块级成熟度和支持深度应按工作负载逐项验证。
            claimRefs:
              - CE018
              - CE019
              - CE020
              - CE022
              - CE025
              - CE035
          - type: table
            tableRef: TE005
            claimRefs:
