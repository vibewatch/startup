      - number: '4.6'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务结论是：webAI 技术可信、资金充足，但经济性在公开信息中根本未被证明。估值跃升是最尖锐的张力：从 2024 年 $700 million 到 2026 年投前 $2.5 billion，约 16 个月上涨
              3.6x，却没有披露收入作为锚。作为规模参照，同业 Mistral 据称到 2026 年初 ARR 约 $400 million；webAI
              没有披露任何可比数据，因此其相对收入规模未知，隐含收入倍数也无法计算。受益于端侧成本优势，利润率路径看起来可能有吸引力；考虑到轻资产部署，资本强度也属中等，但两项判断都建立在推断而非数据上。收入质量——经常性占比、合同耐久度、客户集中度——完全无法评估。因此，主要尽调阻断项是：收入、ARR、毛利率、burn
              和客户数量完全未披露。合适姿态是建设性怀疑：强产品证据和可信投资方组合值得继续接触，但在公司开放财务 data room 前，估值无法承销。
