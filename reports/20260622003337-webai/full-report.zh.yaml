  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              webAI 本质上是在押注一个具体的结构性判断：企业和政府 AI 工作负载中，会有很大且持续增长的一部分必须私有、本地、端侧运行，而 webAI
              能比云优先的既有玩家更好地占住这个部署细分市场。看多论点有三条腿。第一，机会——边缘 AI 和主权 AI——足够大、增长足够快，只要 webAI 能转化需求，就有扩张空间。第二，产品能跑：Oura 的 2.2GB
              端侧模型带来约 10 倍成本下降，MacStadium 每分钟 20,000 次以上请求是真实生产证明，不是 demo。第三，相比 hyperscaler，定位确实差异化。反论点同样具体。$2.5B 估值建立在
              webAI 未披露的收入上，能捆绑 agentic AI 的 hyperscaler 竞争正在加剧，技术栈又高度依赖单一硬件生态。两边之上还叠着宏观风险：AI
              投资大约以四比一跑在行业收入前面，若广泛倍数压缩，webAI 的估值标记会受到重击。诚实的综合判断是，论点取决于持久的主权 AI 需求——而不是 AI
              热潮——能否支撑增长；仅靠公开证据无法回答这个问题，这也正是建议保持校准而非强烈表态的原因。
