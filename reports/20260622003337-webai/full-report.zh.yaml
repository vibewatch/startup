      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              webAI 的监管与法律风险，不主要来自某一部具体法规，而来自客户会转嫁给它的快速移动合规前沿。全球 AI 专项监管正在收紧，NIST AI Risk Management Framework 及其
              Generative AI Profile 等工具，已经把 webAI 企业买方会继承并通过合同下压的义务制度化。数据隐私法直接生效：Texas Data Privacy and Security Act
              约束总部在 Austin 的公司及其客户对个人数据的处理；webAI 销往其他地区时，也会遇到当地对应规则。ISO/IEC 42001 和 ISO/IEC 23894 正在成为 AI
              管理和风险管理的事实采购门槛。对照这个门槛，有两个缺口突出。第一，webAI 未公开披露 SOC 2、ISO 42001 或 FedRAMP 认证，这会限制需要强制授权的受监管行业和公共部门销售。第二，平台建立在
              Apple 开放的 MLX 框架上，而不是专有模型上，因此其专利式 IP 护城河未经证明，也更难防守；与此同时，全行业 AI
              版权和训练数据诉讼构成潜在法律背景。数据驻留规则是双刃剑——既拉动需求，也带来持续的多司法辖区合规负担。这些问题都不致命，但合在一起，定义了买方必须计入价格的监管功课。
