      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              由于 webAI 收入未披露，情景分析必须写成明确、可证伪的假设，而不是精确预测。牛市情景下，主权 AI 采用加速，webAI 将 ARR 扩至 $150-250M，支撑 $8-15B
              估值或退出；这是品类领导者结果。基准情景下，webAI 成为稳固的细分市场领导者，ARR 约 $50-100M，支撑 $3-5B 估值，大体与今天入场价相当或略高。熊市情景下，AI 倍数压缩和
              hyperscaler 竞争使增长停滞，并迫使公司以约 $1-1.5B 估值下轮融资。几乎整个区间都由两个假设驱动：webAI 的 ARR 轨迹，以及退出时的 AI
              倍数环境。最清晰的下行触发器是平轮或下轮、旗舰客户流失，或 AI 广泛重估。按当前证据，概率权重偏向基准情景，执行风险限制牛市结果的可能性。最尖锐的单一数据点是隐含 ARR 数学：按 AI 基础设施 15-25
              倍收入倍数，$2.5B 估值意味着今天约 $100-167M ARR——对一家只披露约 $60M 融资的公司来说偏激进，也正是基准情景而非牛市情景锚定建议的核心原因。
