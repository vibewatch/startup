      - number: '4.2'
        title: 进入市场与销售效率
        blocks:
          - type: paragraph
            body: >-
              webAI 的进入市场策略是面向受监管行业和公共部门买方的直接企业销售，目标包括航空、医疗、制造、金融服务等数据主权能驱动采购的细分。它是一种高接触、技术密集型销售：本地 AI
              部署需要安全、合规和集成审查，销售周期被拉长，获客成本也高于产品驱动模式。标准销售效率代理指标——CAC、回本周期、magic number
              或净收入留存——均未公开披露，因此只能做定性推断。早期迹象显示公司在搭建伙伴辅助层：Springshot 航空合规发布和公共部门高管任命，说明 webAI
              正在建立渠道和领域合作，以扩展一支被第三方画像估计为低数百人规模的直销队伍。对承销方而言，缺少任何量化 funnel 或效率指标是重大缺口：无法判断 webAI
              的增长是花高价买来的，还是高效获得的；而这一区分对估值耐久度至关重要。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI038
      - number: '4.3'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              webAI 的成本结构由一个不同寻常的架构选择塑造：推理运行在客户自有硬件和 Apple Silicon 上，而不是 webAI 运营的云 GPU
              上，因此公司把服务模型的大部分可变算力成本转移给客户。原则上，这会让 webAI 的销货成本轻于云托管 AI 厂商，相比超大规模 GPU 建设也具备更轻资产的基础设施资本开支画像。最强证据来自 Oura
              部署，据称运行 2.2GB 端侧模型时成本降低 10x，指向确实有利的推理经济性。抵消成本有两项。第一，webAI
              本质上是研发密集型平台公司——要构建模型执行、量化、分布式编排和开发者工具——工程薪酬几乎肯定是最大运营支出。第二，本地部署和集成服务需要人工，会拉低相对纯软件的混合毛利率。结果是：公司可能拥有类软件的毛利上限，但会被服务拖累，并背负沉重固定研发基数；关键在于，这一切都只是推断，因为
              webAI 未披露任何利润率、成本或营运资本数据。
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
