      - number: '2.2'
        title: 多重视角下的市场规模
        blocks:
          - type: paragraph
            body: >-
              没有分析师把「私有企业 AI」作为单独一条线来测算，因此最站得住脚的方法不是锚定一个宽泛数字，而是用多个视角交叉验证。智能体视角下，Grand View Research 估算 2025 年 AI agents
              市场为 USD 7.63 billion，到 2033 年增至 USD 182.97 billion（49.6% CAGR）；MarketsandMarkets 认为 2025 年为 USD 7.84
              billion，2030 年达 USD 52.62 billion（46.3%）；Precedence 预测 2026 年为 USD 11.55 billion，到 2035 年达 USD 294.66
              billion（43.57%）。边缘视角下，Grand View 估算 2025 年 edge AI 为 USD 24.91 billion（到 2033 年 CAGR 21.7%），Fortune
              Business Insights 则认为 2026 年为 USD 47.59 billion，到 2034 年达 USD 385.89 billion（29.9%）。主权视角下，Industry Today
              估算 2025 年 sovereign AI 约 USD 40 billion（到 2032 年达 USD 148 billion），Fact.MR 估算 2026 年 sovereign AI
              enablement services 为 USD 11.5 billion（到 2036 年达 USD 200 billion，33% CAGR）。Mordor 口径下 2026 年 USD 434
              billion 的整体 AI 市场并不适合作为 webAI 的 TAM，因为它大幅高估可触达机会。更紧的 SAM 应来自服务受监管企业和政府的主权与边缘切片：2026 年是低数百亿美元市场，而 webAI
              短期可获得份额只是其中一小部分，并集中在少数旗舰账户。
