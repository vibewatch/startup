      - number: '2.5'
        title: 相互冲突的估算与规模缺口
        blocks:
          - type: paragraph
            body: >-
              严谨的市场解读必须保留底层数据中的矛盾，而不是把它们抹平。AI-agent 估算差异明显：2025 年基准规模从 USD 7.63 billion 到 USD 7.92 billion 不等，CAGR 覆盖
              43.6% 到 49.6%，2030-2035 年预测随分析机构和终点年份不同，相差接近一个数量级。Edge AI 的基准年规模同样分化，从 2025 年 Grand View 的 USD 24.91
              billion 到 Fortune 的 USD 35.81 billion。它们不是四舍五入差异，而是市场定义不同，任何单一 TAM 数字都应因此打折。最重要的缺口在公司层面：没有公开来源能隔离 webAI
              在这些宽泛类别中的可触达收入或市场份额，因此从大 TAM 架到 webAI 自身机会的桥，是假设而不是实测事实。需求侧也有同样提醒：支撑牛市情景的 Gartner 研究同时警告，到 2027 年底，超过 40%
              的 agentic AI 项目可能因成本、价值不清和风险而取消——这说明头部采用预测内嵌了很高失败率。弥合这些缺口需要公司提供 pipeline 和 win-rate 数据，目前尚未公开。
