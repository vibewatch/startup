      - number: '6.5'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              向上看，webAI 的架构适合先落地再扩张：客户部署一个模型后，可以增加更多模型，把 Companion
              扩展到更多员工，并进入相邻垂直场景，不必离开平台。因此信任建立后，账户内扩张是自然动作。抵消这点的是集中风险。公开具名参考案例只有少数几个，webAI 承担参考案例集中风险，Oura
              这样的单一旗舰账户承载了不成比例的证明责任——如果这段关系公开转差，客户叙事会明显削弱。目前分销看起来主要靠直销，Springshot
              这类合作伙伴是新兴渠道而非主导渠道，这让获客成本高，也依赖创始人和销售团队。采购摩擦进一步放大问题：企业客户，尤其是政府买方，采购本地 AI
              要经历漫长的安全审查和集成周期，转化会被拖慢。第三方公司数据库也强化了谨慎判断，披露的牵引指标很薄，凸显 webAI
              很多客户证据仍在私域。扩张逻辑是真的，但集中度、渠道不成熟和采购拖累，是买方必须计入价格的动态。
