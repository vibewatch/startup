  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              webAI 所处的是企业软件中最拥挤的品类之一，竞争从多个方向同时压来。第一类是云优先智能体平台——Microsoft Copilot、Salesforce Agentforce、ServiceNow AI
              Agents、Google 的 agent stack 和 AWS Bedrock——它们通过公有云基础设施和既有企业关系交付智能体。第二类是基础模型实验室：前沿的 OpenAI 和
              Anthropic，以及明确推动私有或本地企业部署的 Cohere 和 Mistral，后两者直接挑战 webAI 的主权叙事。第三类也是最直接的一类，是本地部署和主权 AI 阵营——Palantir、IBM
              watsonx、Red Hat OpenShift AI、H2O.ai、Dell AI Factory 和 NVIDIA enterprise stacks——销售的正是 webAI
              主张的自有基础设施模式。外围还有 UiPath、Automation Anywhere 等 RPA 既有厂商转向 agentic automation，Glean 和 Writer
              等企业助手专家，Databricks 这类数据平台切入 agents，以及企业用开放权重模型和 Apple MLX 等框架拼出的内部自建替代方案。独立基准列出数十家可信厂商，因此 webAI
              必须靠尖锐、可防守的切入点获胜，而不是靠广度。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
