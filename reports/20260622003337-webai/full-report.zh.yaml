  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              放在客户工作流里看，webAI 是一套端到端私有 AI
              平台：企业把自有数据拿来构建和训练定制模型，并在自己控制的硬件上运行——本地或端侧——而不是把数据送进共享公有云。工作流由两个面向客户的产品锚定。Navigator
              是构建—训练—部署环境，把领域知识转化为生产模型，给技术团队一条从数据到已部署模型的完整生命周期。Companion 是消费层：一个私有 AI
              助手，通过安全聊天界面把普通员工连接到这些领域模型，让价值抵达非技术用户。两者下方是 Runtime，即支撑每次跨分布式设备部署的编排控制层。最终形成的闭环，贴合受监管企业真正想采用 AI
              的方式：数据留在信任边界内，模型围绕组织自身知识调优，员工与模型交互时，数据从不经过第三方云。这种工作流框架——从设计上私有、生命周期完整、员工可用——是 webAI 产品主张的核心，也是其架构的一切基础。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
