      - number: '8.2'
        title: 建议、置信度与评级
        blocks:
          - type: paragraph
            body: >-
              建议是 TRACK。webAI 是一家可信且有差异化的公司，但价格已经跑在披露证据前面；以今天的估值，它更适合作为高质量观察名单标的，而不是高确信买入。支撑评级刻意保持平衡。整体投资评分约为
              7.2/10——定性定位强、生产证明真实、市场可信，但被薄弱财务披露和偏高估值抵消。风险评级为中：风险章节识别的结构性风险是真实的，但大多可缓解，公司也没有显示出困境迹象。估值立场明确为偏紧，因为 $2.5B
              价格隐含了激进的前瞻增长，而公开证据尚未证实。置信度为中，并受同样反复出现的披露缺口限制——没有公开收入、利润率、留存或客户数量数据。实际姿态是主动跟踪
              webAI，并在三类事项出现时重新承销：披露收入或留存、新一轮定价融资，或竞争 / 监管格局出现重大变化。建议逻辑图展示了市场机会和产品证明如何被薄弱牵引和偏高价格折价，最终得到 TRACK。
