  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >-
              webAI 的客户不是由公司规模定义，而是由共同约束定义：他们不能或不愿把敏感数据送往公有云 AI 服务。公司瞄准需要私有、本地部署 AI
              的企业和政府组织，并明确列出一组宽泛垂直行业——航空、医疗、制造、教育、零售、金融服务、物流和公共部门。一个账户内部，购买中心会拆分：经济买方通常是企业 IT、安全或数据负责人，负责数据控制授权；终端用户则是通过
              Companion 接触模型的一线员工。公共部门是公司有意聚焦的方向，因为数据主权规则可能把本地部署 AI 从偏好变成硬性采购要求。战略逻辑在于，webAI 的价值正集中在受监管、数据敏感的细分市场——也就是云
              AI 在结构上处于劣势的地方；在那里，隐私、延迟和推理成本压过原始模型领先。尽调的关键细节是：这里的分层取决于监管和信任姿态，而不仅是员工数或行业；webAI
              的可服务基础，是每个垂直行业中把数据驻留视为不可谈判的那一部分。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU034
              - CU030
