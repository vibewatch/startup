      - number: '7.5'
        title: 财务、模型与执行风险
        blocks:
          - type: paragraph
            body: >-
              财务与执行风险，是私有披露和高估值正面相撞的地方。据报 $2.5B 估值压在 webAI 未披露的收入上——没有 ARR、毛利率或 burn
              rate——这本身就是模型风险，因为外部投资者无法用公开数据三角验证估值，只能相信增长。公开的 SEC Form D 文件显示，若干较大募资额度下实际售出金额较小，包括一个 SPV 的 $10M 发行中约售出
              $1M；这更像机会性、阶段性融资，而不是已披露规模的证据。上面还叠加执行风险。webAI 与创始人兼 CEO David Stout
              和精干高管团队高度绑定，带来关键人暴露；一边扩大员工规模，一边放大企业和公共部门销售，正是许多同阶段基础设施公司失速的转折点。竞争上，hyperscaler 和平台厂商可以把 agentic AI
              捆进既有关系，挤压 webAI 的定价和差异化；本地部署与集成带来的类服务成本，也可能相较纯 SaaS 可比公司压缩利润率。主线是，财务风险不是由不披露造成的，却会被不披露放大：webAI
              展示得越少，市场需要假设得越多；在 $2.5B 估值下，这些假设有真实下行。
