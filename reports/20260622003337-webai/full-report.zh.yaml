      - number: '5.3'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              架构上，webAI 反转了云 AI 模式。它不把推理集中到超大云厂商数据中心，而是在端侧和本地运行模型，使数据永远不离开客户环境。三块工程能力让这一点可行。webFrame
              通过量化压缩模型，让大模型能装进并运行在本地硬件上。Network 层把模型分发到多台本地设备，帮助 webAI 运行超过单台设备内存预算的工作负载。Runtime 则像控制平面一样编排全局。平台专门面向
              Apple Silicon 优化，利用统一内存和端侧加速，并与 Apple 开源 MLX array framework 对齐——这既是助力，也是依赖。webAI
              公开描述自己能把全球最大模型带到本地设备上，这是其技术故事的关键。其运营模式与超大云厂商的 GPU 云栈形成鲜明对照，也呼应了把稳定推理回迁的 broader cost-of-cloud
              论点。架构确实有差异化，但它把技术栈集中到一个硬件生态上，并用云弹性换取部署侧工程——这是有意为之且后果重大的设计选择。
            claimRefs:
              - CE012
              - CE006
              - CE007
              - CE013
              - CE014
              - CE015
              - CE016
              - CE017
