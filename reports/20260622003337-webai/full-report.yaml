              organizations that require private, on-premises AI, and it explicitly names a broad vertical set -
              aviation, healthcare, manufacturing, education, retail, financial services, logistics, and the public
              sector. Within an account the buying center splits: the economic buyer is typically an enterprise IT,
              security, or data leader who owns the data-control mandate, while the end users are line employees who
              reach the models through Companion. Public-sector buyers are a deliberate focus, because data-sovereignty
              rules can make on-premises AI a hard procurement requirement rather than a preference. The strategic logic
              is that webAI's value concentrates precisely in regulated, data-sensitive segments where cloud AI is
              structurally disadvantaged - the places where privacy, latency, and cost-of-inference outweigh raw model
              leadership. For diligence, the key nuance is that segmentation here is a function of regulatory and trust
              posture, not headcount or industry alone, and webAI's addressable base is the subset of each vertical that
