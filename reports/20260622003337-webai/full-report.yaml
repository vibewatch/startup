              On the upside, webAI's architecture lends itself to land-and-expand: a customer that deploys one model can
              add more models, extend Companion to more employees, and move into adjacent verticals without leaving the
              platform, so the natural motion is expansion within an account once trust is established. The offsetting
              risk is concentration. With only a handful of publicly named references, webAI carries
              reference-concentration risk, where a single flagship account such as Oura bears a disproportionate share
              of the proof burden - if that relationship soured publicly, the customer narrative would be materially
              weakened. Distribution looks primarily direct-sales today, with partnerships like Springshot as an
              emerging rather than dominant channel, which keeps customer acquisition costly and founder- and
              sales-team-dependent. Procurement friction compounds this: enterprise and especially government buyers of
              on-premises AI run long security-review and integration cycles that slow conversion. Third-party company
              databases reinforce the caution, showing thin disclosed traction metrics and underscoring how much of
              webAI's customer evidence remains private. The expansion logic is real, but concentration, channel
              immaturity, and procurement drag are the dynamics a buyer must price in.
            claimRefs:
              - CU025
              - CU026
              - CU027
              - CU028
              - CU029
