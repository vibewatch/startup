  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              webAI is, at its core, a bet on a specific structural claim: that a large and growing share of enterprise
              and government AI workloads must run privately, on-premises, and on-device, and that webAI can own that
              deployment niche better than cloud-first incumbents. The bull thesis builds from three legs. First, the
              opportunity - edge and sovereign AI - is large and fast-growing, giving webAI room to scale if it converts
              demand. Second, the product works: Oura's 2.2GB on-device model at roughly a 10x cost reduction and
              MacStadium's 20,000-plus requests per minute are real production proof, not demos. Third, the positioning
              is genuinely differentiated against hyperscalers. The anti-thesis is equally concrete. A $2.5 billion
              valuation rests on revenue webAI does not disclose, competition from hyperscalers who can bundle agentic
              AI is intensifying, and the stack depends heavily on a single hardware ecosystem. Overlaying both is macro
              risk: with AI investment running roughly four-to-one ahead of sector revenue, a broad multiple compression
              would hit webAI's mark hard. The honest synthesis is that the thesis rests on whether durable sovereign-AI
              demand - not AI hype - sustains growth, and that question cannot be settled from public evidence alone,
              which is precisely why the recommendation is calibrated rather than emphatic.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV003
              - CV006
      - number: '8.2'
        title: Recommendation, Confidence, and Rating
        blocks:
          - type: paragraph
            body: >-
              The recommendation is TRACK. webAI is a credible, differentiated company whose price has outrun its
              disclosed evidence, which makes it a high-quality watchlist position rather than a conviction buy at
              today's mark. The supporting ratings are deliberately balanced. The overall investment score lands at
              roughly 7.2 out of 10 - strong qualitative positioning, real production proof, and a credible market,
              offset by weak financial disclosure and a rich valuation. The risk rating is medium: the structural risks
              identified in the risk chapter are real but mostly mitigable, and the company shows no sign of distress.
              The valuation stance is explicitly stretched, because at $2.5 billion the price implies aggressive forward
              growth that public evidence does not yet corroborate. Confidence is medium and capped by the same
              disclosure gaps that recur throughout this report - no public revenue, margin, retention, or
              customer-count data. The practical posture that follows is to track webAI actively and re-underwrite the
              moment any of three things appears: disclosed revenue or retention, a newly priced round, or a material
              change in the competitive or regulatory landscape. The recommendation-logic figure traces how market
              opportunity and product proof are discounted by thin traction and a stretched price to arrive at TRACK.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV013
      - number: '8.3'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              webAI's financing history frames the entry decision. The company raised a $60 million Series A in
              September 2024 at a $700 million valuation, and third-party trackers put total disclosed funding at
              approximately $60 million. In an oversubscribed January 2026 round it was valued at $2.5 billion
              pre-money, with the round amount characterized only as double-digit millions and investors including TIME
              Ventures, Atreides Management, and Forerunner. That sequence carries two opposing signals. On the positive
              side, an oversubscribed round with brand-name investors is a genuine demand signal that sophisticated
              capital is willing to underwrite the story. On the cautionary side, the valuation rose from $700 million
              to $2.5 billion - roughly 3.6x in about sixteen months - without disclosed revenue to anchor the step-up,
              so entering at this price requires conviction on a growth trajectory webAI has not evidenced publicly.
              Investors must also model a preference stack: multiple rounds plus special-purpose vehicles such as OXCART
              WEBAI I and the EPQ webAI series imply layered liquidation preferences and potential dilution overhang
              that sit ahead of new common-equivalent capital. The disciplined conclusion is that public evidence
              supports demand for webAI's equity but not, on its own, the $2.5 billion price.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV014
              - CV017
              - CV016
      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Because webAI's revenue is undisclosed, scenario analysis must be framed as explicit, falsifiable
              assumptions rather than precise forecasts. In the bull case, sovereign-AI adoption accelerates and webAI
              scales ARR toward $150-250 million, supporting an $8-15 billion valuation or exit; this is the
              category-leader outcome. In the base case, webAI becomes a solid niche leader with ARR of roughly $50-100
              million, supporting a $3-5 billion valuation broadly in line with - or modestly above - today's entry. In
              the bear case, AI-multiple compression and hyperscaler competition stall growth and force a down round
              near $1-1.5 billion. Two assumptions drive almost the entire range: webAI's ARR trajectory and the
              prevailing AI-multiple regime at exit. The clearest downside triggers are a flat or down round, the loss
              of a flagship customer, or a broad AI re-rating. On current evidence, probability weight tilts toward the
              base case, with execution risk capping the likelihood of the bull outcome. The sharpest single data point
              is the implied-ARR math: at AI-infrastructure multiples of 15-25x, a $2.5 billion valuation implies
              roughly $100-167 million of ARR today - aggressive for a company that has disclosed only about $60 million
              raised, and the crux of why the base case, not the bull case, anchors the recommendation.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
          - type: table
            tableRef: TV003
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV027
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV021
              - CV022
      - number: '8.5'
        title: Comparable Valuation Set
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis places webAI in a premium-priced AI-infrastructure tier rather than the frontier-lab
              stratosphere. The multiple environment in 2026 spans roughly 20-50x revenue for foundation models, 15-25x
              for AI infrastructure, 8-20x for AI applications, and 3-7x for conventional SaaS - so the category an
              analyst assigns webAI matters enormously. The most instructive peers are not the giants but the mid-tier:
              Cohere, an enterprise-AI infrastructure company, was valued near $6.8 billion, and Mistral, a European
              sovereign-AI champion, near $13.7 billion and reportedly raising at around EUR 20 billion - evidence that
              sovereign-AI narratives command premium pricing, but typically on revenue scale webAI has not publicly
              demonstrated. Frontier labs - OpenAI near $850 billion, Anthropic near $380 billion, xAI near $200 billion
              - sit far above and mainly contextualize how small webAI's $2.5 billion actually is in absolute terms. The
              appropriate comparable basis is AI-infrastructure and AI-application multiples, given webAI's
              deployment-and-platform model. On that basis, webAI's mark looks rich relative to disclosed traction, and
              the valuation-sensitivity figure makes the tension explicit by showing the ARR required to justify $2.5
              billion across the plausible multiple range.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
          - type: table
            tableRef: TV004
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV028
              - CV032
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV027
              - CV033
      - number: '8.6'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              On exit, webAI's realistic paths are a strategic acquisition by an enterprise-software, security, or
              infrastructure incumbent that wants private-AI capability, or a later IPO if revenue scales into the
              hundreds of millions. Neither is imminent, and exit readiness is genuinely limited today: thin public
              financials and governance disclosure would have to mature substantially before an IPO is credible, and an
              acquirer would demand the same financial and customer evidence this report repeatedly flags as missing.
              That makes the final diligence list short and pointed. The highest-priority ask is audited financials -
              revenue, ARR, gross margin, and burn - to anchor the valuation; the close second is customer concentration
              and retention data to test how durable the revenue base really is; and the third is a full capitalization
              table to quantify the preference and dilution overhang. Against those asks, an investor should pre-commit
              to explicit kill triggers - a flat or down round, the public loss of a flagship customer such as Oura, or
              a major security or agentic-AI breach - and recognize the broader thesis-break conditions: sovereign-AI
              demand proving to be hype, a sharp AI re-rating, or disclosed revenue landing far below the implied level.
              Framed this way, TRACK is not indecision; it is a disciplined wait for the two or three disclosures that
              would convert webAI from a watchlist name into an actionable one.
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV039
              - CV040
              - CV025
          - type: table
            tableRef: TV006
            claimRefs:
              - CV037
              - CV038
              - CV036
              - CV019
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, then re-underwrite on disclosure
            body: >-
              webAI is a high-quality watchlist name; convert to actionable only on disclosed revenue/retention or a
              newly priced round.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV013
          - type: callout
