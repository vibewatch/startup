        title: Module, Asset, and Product-Line Map
        blocks:
          - type: paragraph
            body: >-
              webAI's platform decomposes into a layered set of modules that map cleanly onto a stack. At the top are
              the applications - Navigator for model creation and Companion for assistant-style consumption. Below them,
              Runtime provides orchestration; webFrame handles model execution and quantization; and the Network layer
              forms a distributed AI fabric that can spread a single workload across multiple devices. A developer CLI
              exposes the whole platform programmatically for model and deployment management. On top of this core,
              webAI ships capability modules and industry solutions: a multi-modal knowledge-graph RAG offering that
              grounds models in enterprise data; ColVec1 retrieval research aimed at smarter, more efficient retrieval;
              and edge solutions for computer vision and predictive anomaly detection that extend the platform into
              industrial and visual use cases. These are then packaged as vertical solutions for aviation, healthcare,
              and manufacturing. The module map matters for diligence because it shows webAI is not a single product but
              a platform with distinct layers, each of which can be a source of differentiation or, conversely, a
