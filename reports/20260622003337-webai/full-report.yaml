            body: >-
              On the cover metrics that diligence typically anchors to, webAI presents an asymmetric picture: valuation
              and capital signals are well sourced, but operating financials are almost entirely private. The headline
              figures - a $2.5 billion valuation and roughly $60 million raised - are corroborated across company
              statements and independent reporting, but webAI has not disclosed revenue, ARR, or run-rate, and exact
