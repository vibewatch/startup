            body: >-
              webAI's go-to-market is a direct enterprise motion aimed at regulated industries - aviation, healthcare,
              manufacturing, financial services - and public-sector buyers, the segments where data sovereignty is a
              purchase driver. This is a high-touch, technically intensive sale: on-prem AI deployments require
              security, compliance, and integration review, which lengthens sales cycles and raises the cost of customer
              acquisition relative to product-led models. None of the standard sales-efficiency proxies - CAC, payback
              period, magic number, or net revenue retention - are publicly disclosed, so efficiency can only be
              inferred qualitatively. There are early signs of a partner-assisted layer: the Springshot
              aviation-compliance launch and public-sector executive hires suggest webAI is building channel and domain
              partnerships to extend a direct salesforce that third-party profiles size in the low hundreds of
              employees. For an underwriter, the absence of any quantified funnel or efficiency metric is a material
              gap: it is impossible to judge whether webAI's growth is being bought expensively or efficiently, and that
