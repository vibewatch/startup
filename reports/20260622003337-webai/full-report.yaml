      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              webAI's capital story accelerated sharply over a four-month window. After raising a $60 million Series A,
              the company closed a Series A extension in January 2026 that it characterized as oversubscribed and that
              valued the business at $2.5 billion pre-money - a striking step-up for a company that, by third-party
              tracker estimates, has raised only about $60 million in total disclosed funding. Axios reported the
              extension as 'high double-digit' millions of dollars, but the precise size of the round was not publicly
              disclosed, leaving an information gap around exactly how much fresh primary capital the $2.5 billion
              valuation rests on. The investor syndicate is notable for its quality and conviction: Marc Benioff's TIME
              Ventures and Atreides Management (led by Gavin Baker) joined return backers including Forerunner Ventures
              and OXCART Ventures. Reporting suggests a larger Series B is expected to follow. The combination of a
              billion-dollar-plus valuation, modest disclosed cash raised, and undisclosed round size means the
              valuation is driven heavily by narrative, syndicate quality, and a small set of marquee customer proof
              points rather than by publicly verifiable financial scale.
