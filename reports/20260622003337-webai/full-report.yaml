      - number: '3.3'
        title: Capability, Pricing, and Trust Comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, webAI's differentiation is narrow but distinctive: fully on-device, distributed inference
              across hardware the customer already owns, optimized for Apple Silicon - a posture unusual among
              GPU-cloud-centric competitors. That focus trades breadth for a credible privacy and cost story. On
              pricing, the category is uniformly opaque: Microsoft, Palantir, and webAI alike avoid transparent list
              pricing, so buyers cannot run clean head-to-head price comparisons and must negotiate. On go-to-market,
              the gap is stark - hyperscalers and Salesforce distribute agents through suites customers have already
              bought, a near-frictionless channel webAI cannot match selling direct. On trust and regulatory posture,
              however, webAI is well positioned: it clusters with Palantir, Cohere North, Red Hat, and H2O.ai as the
              privacy and on-prem leaders, against cloud-first incumbents whose multi-tenant defaults are a liability
              for the most data-sensitive buyers. The competitive question is whether sovereignty leadership is enough
              to overcome the incumbents' distribution and scale.
            claimRefs:
              - CP018
              - CP019
              - CP020
              - CP021
              - CP022
