  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >-
              webAI's revenue model is an enterprise platform-licensing business rather than a self-serve SaaS one. The
              company monetizes a connected stack: Navigator, the build-train-deploy environment for custom models;
              Companion, a private per-employee AI assistant; and the underlying Runtime orchestration layer that powers
              deployments. Because Companion is positioned per employee, a seat-based component almost certainly sits
              inside larger platform agreements, while on-premises rollouts typically bundle implementation and support
              services. webAI does not publish list pricing - deals are negotiated enterprise contracts, consistent with
              private-AI peers such as Palantir and Cohere - which means outside observers cannot reconstruct average
              contract value or the precise split between licensing, seats, and services. A further diligence nuance is
              revenue recognition: on-prem term or perpetual licenses can recognize revenue on a different schedule than
              ratable SaaS, and with no disclosed accounting policy the timing and quality of recognized revenue cannot
              be verified. The net picture is a credible, multi-product monetization design whose actual economics
              remain entirely private.
