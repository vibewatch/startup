      - number: '5.3'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Architecturally, webAI inverts the cloud AI model. Instead of centralizing inference in a hyperscaler data
              center, it runs models on-device and on-premises so data never leaves the customer's environment. Three
              engineering pieces make that feasible. webFrame compresses models through quantization so large models fit
              and run on local hardware. The Network layer distributes a model across multiple local devices, letting
              webAI run workloads that exceed any single device's memory budget. Runtime orchestrates the whole thing as
              a control plane. The platform is specifically optimized for Apple Silicon, exploiting unified memory and
              on-device acceleration, and aligns with Apple's open-source MLX array framework - a relationship that is
              both an enabler and a dependency. webAI publicly describes bringing the world's biggest models down to
              local devices, which is the crux of its technical story. The operating model contrasts sharply with
              GPU-cloud stacks from the hyperscalers and reflects the broader cost-of-cloud argument for repatriating
              steady-state inference. The architecture is genuinely differentiated, but it concentrates the stack on one
              hardware ecosystem and trades cloud elasticity for deployment-side engineering - a deliberate and
              consequential design choice.
