      - number: '5.5'
        title: Differentiation and Intellectual Property
        blocks:
          - type: paragraph
            body: >-
              webAI's technical differentiation is the integrated combination of model quantization, distributed
              on-device execution, and orchestration that keeps data local - a system-level capability rather than a
              single breakthrough. That framing matters for assessing the moat. Because the stack leverages open
              frameworks such as Apple's MLX rather than a proprietary frontier model, the defensible know-how looks
              like deployment and efficiency engineering - getting big models to run well on constrained local hardware
              - more than secret model IP. Independent coverage frames the ambition boldly, as making centralized data
              centers less necessary for enterprise AI. A rigorous buyer should, however, apply scrutiny in three
              places. First, several headline performance claims, such as the 10x cost reduction, are company- or
              single-customer-sourced and deserve independent benchmarking. Second, the reliance on Apple Silicon and
              the MLX ecosystem concentrates the stack on one hardware vendor's roadmap, a real dependency risk. Third,
              the distributed on-device design adds deployment and integration complexity that can erode its own cost
              and privacy benefits. The differentiation is real and unusual, but its durability rests on execution and
              engineering lead rather than on patents or model secrecy.
