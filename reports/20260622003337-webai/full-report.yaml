              - CR024
      - number: '7.5'
        title: Financial, Model, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              The financial and execution risks are where private disclosure and a rich valuation collide. A reported
              $2.5B valuation sits atop revenue webAI does not disclose - no ARR, gross margin, or burn rate - which is
              itself a model risk, because an outside investor cannot triangulate the valuation from public data and
              must take growth on faith. The SEC Form D filings that are public show small amounts sold against larger
              offerings, including roughly $1M of a $10M offering in one SPV, which reads as opportunistic, episodic
              financing rather than evidence of disclosed scale. Layered on top is execution risk. webAI is closely
              identified with founder-CEO David Stout and a compact senior team, creating key-person exposure, and
              scaling enterprise and public-sector sales while growing headcount is exactly the transition that has
              derailed similarly staged infrastructure companies. Competitively, hyperscalers and platform vendors can
              bundle agentic AI into existing relationships and pressure both webAI's pricing and its differentiation,
              while the services-like cost of on-premises deployment and integration can compress margins relative to
              pure-SaaS comparables. The throughline is that the financial risks are amplified, not caused, by
              non-disclosure: the less webAI shows, the more the market must assume, and at a $2.5B mark those
              assumptions carry real downside.
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
          - type: table
            tableRef: TR004
            claimRefs:
              - CR030
              - CR033
              - CR031
              - CR027
      - number: '7.6'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Each principal risk has a credible mitigation, and a disciplined investor should track a specific set of
              indicators and pre-commit to explicit kill criteria. On regulation, formally adopting the NIST AI RMF and
              ISO/IEC 42001, and pursuing SOC 2 and FedRAMP authorization, would simultaneously reduce compliance risk
              and unlock regulated and government revenue. On dependency, diversifying beyond Apple Silicon - or
              demonstrating portability to other accelerators - would cut the single-vendor exposure, while webAI's own
              architecture is already a partial security mitigation because keeping data on-device structurally narrows
              the breach surface. The monitoring indicators that matter most are funding cadence, net-new named
              customers, certification milestones, and any first disclosure of revenue or retention. The kill criteria
              should be set in advance: a flat or down round, or disclosed revenue far below the level a $2.5B valuation
              implies, would break the thesis; the public loss of a flagship customer such as Oura would break it given
              reference concentration; and a major security incident or demonstrated agentic-AI breach would break it
              given that trust is the entire value proposition. Framing the decision this way converts a hazy risk
              narrative into a small set of observable, falsifiable triggers - which is exactly what a $2.5B private
              mark demands.
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
          - type: table
            tableRef: TR005
            claimRefs:
              - CR034
              - CR035
              - CR037
              - CR038
              - CR039
              - CR040
      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Unverifiable equals unmitigated
            body: >-
              With revenue, margin, and retention undisclosed, an outside investor must treat webAI's financial risk as
              unmitigated until a data room proves otherwise.
