      - number: '3.4'
        title: Switching Costs, Lock-in, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Competitive durability turns as much on distribution and lock-in as on raw capability. Once an agent
              platform is embedded in workflows and connected to enterprise data, switching costs are high:
              re-integration, retraining, and governance re-approval all impose real friction, which favors whichever
              vendor lands first. Yet enterprises increasingly multi-home, running cloud and private AI vendors in
              parallel; this caps any single vendor's lock-in but also fragments webAI's potential share of wallet. The
              decisive structural advantage sits with incumbents: bundling agents into suites enterprises already own -
              Microsoft 365, Salesforce, ServiceNow - gives them near-zero-friction distribution that a direct-selling
              challenger cannot replicate. On the supply side, competitors with hardware ties such as NVIDIA and Dell,
              or hyperscale compute such as AWS and Google, control inputs that webAI must either source or engineer
              around through its on-device, Apple Silicon approach. webAI's counter is to turn the customer's own
              hardware into the deployment substrate, sidestepping both cloud lock-in and supply dependence - a genuine
              differentiator, but one that raises deployment complexity.
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP026
      - number: '3.5'
        title: Moat Durability and Adverse Competitive Evidence
        blocks:
          - type: paragraph
            body: >-
              webAI's moat is real but contested. Its most defensible asset is a distributed, on-device architecture
              that runs models privately across a customer's own Apple Silicon and edge hardware, and its strongest
              proof point is the Oura deployment - reportedly a 10x cost reduction on a 2.2GB on-device model. That is a
              credible, quantified edge. The adverse case, however, is substantial. First, open-weight models from
              Mistral and frameworks like MLX risk commoditizing the model layer, eroding any differentiation that rests
              on proprietary inference rather than deployment engineering. Second, the most acute displacement threat is
              hyperscaler and Salesforce bundling, which can offer 'good-enough' private options at marginal cost to
              customers they already serve. Third, webAI is sub-scale on capital and distribution versus hyperscalers
