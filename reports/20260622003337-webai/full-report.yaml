      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The bull case for webAI's market rests on several mutually reinforcing drivers. First, data-sovereignty
              regulation - the EU AI Act and parallel national frameworks - structurally pushes sensitive workloads
              toward private, controllable deployments. Second, cloud-cost and repatriation economics, articulated in
              Andreessen Horowitz's 'cost of cloud' analysis, increasingly favor moving steady-state inference off
              public cloud once usage scales, improving the ROI of owned infrastructure. Third, latency, privacy, and
              offline-resilience requirements in healthcare, aviation, and manufacturing favor edge and on-device
              execution. Fourth, sheer adoption momentum: Gartner expects 40% of enterprise applications to embed
              task-specific agents by the end of 2026, up from under 5% in 2025. Against these drivers sit real
              constraints. On-prem deployment is complex and integration-heavy, lengthening sales cycles; building
              sovereign infrastructure is capital intensive, favoring well-funded vendors; and trust, safety, and
              security concerns about autonomous agents constrain the jump from pilot to production. The net effect is a
              market with a steep secular growth curve but a high execution bar, where vendors that can compress
              deployment complexity and prove security will capture disproportionate share.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
          - type: table
            tableRef: TM004
