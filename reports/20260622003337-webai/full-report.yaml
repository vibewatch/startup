  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Founding Story
        blocks:
          - type: paragraph
            body: >-
              webAI is an Austin, Texas-based enterprise software company that describes itself as the first end-to-end
              private AI platform, built around the vision of 'AI that runs where your data lives.' The company was
              founded in 2019 by a small team of computer engineers from Michigan who concluded early that the public
              cloud was the wrong venue for the most sensitive, high-stakes AI workloads in healthcare, manufacturing,
              aviation, and defense. That founding thesis - that intelligence should run locally with privacy,
              resilience, and ownership built in - still anchors the company's positioning as a sovereign, on-premises
              alternative to cloud-first incumbents such as Microsoft Copilot and Google Vertex agents. Although it
              began in Michigan, webAI has relocated its headquarters to downtown Austin, and serves aviation,
              healthcare, manufacturing, education, retail, financial services, logistics, and public-sector customers.
              As of 2026 the company sits at growth stage, having completed a Series A and a Series A extension. Its
              one-line model: license a private AI platform - spanning the Navigator build workbench and the Companion
              assistant - that lets enterprises build and operate custom models on infrastructure they own rather than
              renting inference from a hyperscaler.
