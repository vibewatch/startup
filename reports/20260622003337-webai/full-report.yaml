  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, webAI is an end-to-end private AI platform: it lets an enterprise take its own
              data, build and train custom models, and run them on hardware it controls - on-premises or on device -
              rather than sending data to a shared public cloud. The workflow is anchored by two customer-facing
              products. Navigator is the build-train-deploy environment that turns domain knowledge into production
              models, giving technical teams a full lifecycle from data to deployed model. Companion is the consumption
              layer: a private AI assistant that connects ordinary employees to those domain-specific models through a
              secure chat interface, so the value reaches non-technical users. Beneath both sits Runtime, the
              orchestration control layer that powers every deployment across distributed devices. The result is a
              closed loop that mirrors how a regulated enterprise actually wants to adopt AI: data stays inside the
              trust boundary, models are tuned to the organization's own knowledge, and employees interact with those
              models without that data ever transiting a third-party cloud. That workflow framing - private by
              construction, lifecycle-complete, and employee-accessible - is the heart of webAI's product proposition
              and the basis for everything in its architecture.
