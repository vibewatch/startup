      - number: '4.3'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              webAI's cost structure is shaped by an unusual architectural choice: because inference runs on
              customer-owned hardware and Apple Silicon rather than webAI-operated cloud GPUs, the company offloads much
              of the variable compute cost of serving models onto the customer. That should, in principle, give webAI a
              lighter cost of goods than cloud-hosted AI vendors and a comparatively asset-light infrastructure capex
              profile versus hyperscale GPU build-outs. The strongest evidence is the Oura deployment, reportedly a 10x
              cost reduction running a 2.2GB on-device model, which points to genuinely favorable inference economics.
              The offsetting costs are two-fold. First, webAI is fundamentally an R&D-intensive platform company -
              building model execution, quantization, distributed orchestration, and developer tooling - and that
              engineering payroll is almost certainly its largest operating expense. Second, on-prem deployment and
              integration services carry labor that can dilute blended gross margin relative to pure software. The
              result is a plausibly software-like margin ceiling with a services drag and a heavy fixed R&D base - but,
              crucially, every element of this is inferred, because webAI discloses no margin, cost, or working-capital
              data.
