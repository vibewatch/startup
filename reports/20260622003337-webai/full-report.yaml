  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              webAI's risk profile is best understood as a small number of severe, structurally linked exposures rather
              than a long tail of minor issues. Three risks dominate. First is financial fragility: a reported $2.5B
              valuation rests on revenue webAI does not disclose, so the company is exposed to sharp multiple
              compression if growth disappoints or AI sentiment cools. Second is single-vendor dependency: the stack is
              concentrated on Apple Silicon and the Apple-controlled MLX framework, tying webAI to one hardware roadmap.
              Third is competitive pressure from hyperscalers that can bundle agentic AI into existing estates. We rank
              risks by the product of likelihood, impact, and mitigation maturity, adding weight wherever the underlying
              evidence is private rather than verifiable - because unverifiable risk is, for an outside investor,
              indistinguishable from unmitigated risk. On that basis, residual exposure is highest in the financial and
              customer dimensions, exactly where disclosure is thinnest. The macro backdrop sharpens all of this: with
              record AI investment running well ahead of sector revenue, the risk is that capital tightens precisely
              when a capital-intensive, pre-disclosure company most needs it. The sections that follow work through
              regulatory, operational, dependency, and financial risks, then set out mitigations and explicit kill
              criteria.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk for webAI is less about any single statute and more about a fast-moving
              compliance frontier its customers will push onto it. AI-specific regulation is tightening globally, and
              instruments like the NIST AI Risk Management Framework and its Generative AI Profile codify obligations
              that webAI's enterprise buyers will inherit and pass through in contracts. Data-privacy law bites
              directly: the Texas Data Privacy and Security Act governs personal-data processing for an Austin-based
              company and its customers, and equivalents apply wherever it sells. ISO/IEC 42001 and ISO/IEC 23894 are
              becoming de facto procurement gates for AI management and risk management. Against that bar, two gaps
              stand out. First, webAI has not publicly disclosed SOC 2, ISO 42001, or FedRAMP certification, which
              constrains regulated and public-sector sales where authorization is mandatory. Second, because the
              platform builds on Apple's open MLX framework rather than proprietary models, its patent-style IP moat is
              unproven and harder to defend, even as industry-wide AI copyright and training-data litigation creates a
              latent legal backdrop. Data-residency rules cut both ways - a tailwind for demand but an ongoing
              multi-jurisdiction compliance burden. None of these is fatal, but together they define the regulatory
              homework a buyer must price in.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR010
              - CR009
      - number: '7.3'
        title: Operational, Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, webAI inherits the security risks of agentic AI plus new ones created by its distributed
              architecture. The agentic risks are well catalogued: OWASP's Agentic AI Top 10 documents attack surfaces
              such as tool misuse, memory poisoning, and goal manipulation, and peer-reviewed red-teaming shows agentic
              systems remain vulnerable to jailbreaks and prompt injection. For a platform whose pitch is autonomous
              agents acting on enterprise data, these are live, not theoretical, concerns, and the Cloud Security
              Alliance frames AI safety and security as a still-immature discipline. The distributed on-device design
              adds its own failure modes - device heterogeneity, synchronization, and partial outages - that centralized
              cloud serving avoids, and model-quality and hallucination risk persist in production because private
              deployment does not by itself guarantee accuracy or grounding. Optimizing for Apple Silicon also ties
              deployable capacity to Apple hardware availability, a supply dependency. The important nuance is that
              on-prem deployment is double-edged for security: it shrinks multi-tenant exposure but shifts a large share
              of the security burden into each customer's environment, so it mitigates some risks while creating others.
              The risk-transmission figure shows how an upstream shock - a hardware constraint or a security failure -
              can cascade into deployment delays, customer loss, and ultimately financing risk.
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
          - type: table
            tableRef: TR002
            claimRefs:
              - CR014
              - CR015
              - CR017
              - CR018
              - CR019
          - type: figure
            figureRef: FR002
            claimRefs:
              - CR004
              - CR017
      - number: '7.4'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              webAI's dependency map concentrates risk in a few critical relationships. The most important is technical:
              the platform is concentrated on Apple Silicon and the Apple-controlled MLX framework, so while MLX is open
              source, webAI cannot unilaterally control its direction, licensing, or continuity - a genuine
              single-vendor exposure at the heart of the stack. The second is commercial: with only a few publicly named
              references, webAI carries customer-concentration risk in which a single flagship account such as Oura may
              drive a disproportionate share of proof and possibly revenue. The third is financial: the visible capital
              base runs through a narrow set of providers and special-purpose vehicles, including OXCART WEBAI I and the
              EPQ webAI series seen in SEC filings, which suggests episodic syndication rather than a broad
              institutional base. Compounding these, partner and distribution channels remain early-stage, leaving
              acquisition reliant on a costly direct-sales motion, and webAI's integration ecosystem is thinner than the
              marketplaces hyperscaler rivals can offer. The dependency figure maps these chains explicitly; the
              practical takeaway is that webAI's fate is unusually tied to Apple's roadmap, a small reference base, and
              a concentrated capital syndicate, any one of which is a legitimate diligence focus.
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
          - type: table
            tableRef: TR003
            claimRefs:
              - CR021
              - CR023
              - CR024
              - CR026
          - type: figure
