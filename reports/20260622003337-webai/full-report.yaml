  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              webAI does not sell into a single, clean market category; its opportunity sits at the intersection of
              three overlapping markets - agentic AI, edge/on-device AI, and sovereign/private AI - each measured
              separately by analysts. The served boundary is enterprise software used to build, deploy, and operate
              private AI models and agents on infrastructure the customer owns, spanning regulated and latency-sensitive
              workloads. Included in that boundary are platform licenses, model build-and-deploy tooling, and on-prem
              orchestration; excluded are consumer chatbots and the bulk of pure public-cloud inference API spend, which
              webAI's thesis explicitly displaces. The relevant status-quo substitutes a buyer weighs are public-cloud
              LLM APIs, incumbent copilots from Microsoft and Salesforce, ServiceNow agents, RPA suites such as UiPath,
              government-grade platforms like Palantir, and in-house DIY model stacks. Because these substitutes are
              well funded and already embedded in enterprise workflows, webAI must win on differentiated sovereignty,
              cost, and on-device performance rather than on category creation. The crowded vendor field competing for
              the same CIO and line-of-business budgets is the defining feature of the market's competitive boundary.
            claimRefs:
              - CM001
              - CM002
