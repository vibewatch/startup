- id: market-sizing
  title: Market Sizing Across Multiple Lenses
  body: Because no analyst sizes 'private enterprise AI' as a single line, the most defensible approach is to triangulate across multiple lenses rather than anchor on one broad number. On the agentic lens, Grand View Research sizes AI agents at USD 7.63 billion in 2025 growing to USD 182.97 billion by 2033 (49.6% CAGR); MarketsandMarkets sees USD 7.84 billion in 2025 reaching USD 52.62 billion by 2030 (46.3%); and Precedence projects USD 11.55 billion in 2026 to USD 294.66 billion by 2035 (43.57%). On the edge lens, Grand View sizes edge AI at USD 24.91 billion in 2025 (21.7% CAGR to 2033) while Fortune Business Insights sees USD 47.59 billion in 2026 reaching USD 385.89 billion by 2034 (29.9%). On the sovereign lens, Industry Today sizes sovereign AI at roughly USD 40 billion in 2025 (to USD 148 billion by 2032) and Fact.MR sizes sovereign AI enablement services at USD 11.5 billion in 2026 (to USD 200 billion by 2036, 33% CAGR). The overall AI market - USD 434 billion in 2026 per Mordor - is the wrong TAM for webAI because it dramatically overstates the reachable opportunity. A tighter SAM, built from the sovereign and edge slices serving regulated enterprises and government, is a low-tens-of-billions market in 2026, of which webAI's near-term obtainable share is a small, flagship-account-concentrated fraction.
  claimRefs:
