- id: sizing-gaps-adverse
  title: Conflicting Estimates and Sizing Gaps
  body: 'A disciplined market read must preserve, not paper over, the contradictions in the underlying data. The AI-agent estimates conflict materially: 2025 base sizes range from USD 7.63 billion to USD 7.92 billion, CAGRs span 43.6% to 49.6%, and the 2030-2035 forecasts differ by close to an order of magnitude depending on the analyst and the end-year. Edge AI base-year sizes likewise diverge, from USD 24.91 billion (Grand View) to USD 35.81 billion (Fortune) in 2025. These are not rounding differences; they reflect different market definitions and should temper any single-number TAM. The most important gap is company-specific: no public source isolates webAI''s reachable revenue or market share within these broad categories, so the bridge from a large TAM to webAI''s own opportunity is an assumption, not a measured fact. On the demand side, the same Gartner research that fuels the bull case also warns that over 40% of agentic AI projects may be canceled by the end of 2027 on cost, unclear value, and risk - a reminder that headline adoption forecasts embed a high failure rate. Reconciling these gaps requires company-provided pipeline and win-rate data that is not yet public.'
