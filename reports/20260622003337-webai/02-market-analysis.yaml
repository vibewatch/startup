  - type: conflicting-data
    severity: material
    topic: market sizing conflict across analysts
    missingEvidence: A definition-matched, reconciled market size for private enterprise AI
    whyItMatters: Order-of-magnitude forecast spread makes any single TAM unreliable for underwriting.
    diligencePath: Adopt one definition-matched lens and sensitivity-test the CAGR.
