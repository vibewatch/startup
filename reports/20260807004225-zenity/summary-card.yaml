  topStrengths:
    - >-
      Strong category timing around enterprise AI-agent governance, unauthorized-action risk, and cross-platform control
      needs.
    - >-
      Coherent product architecture spanning posture, observability, runtime response, identity controls, and MCP/tool
      governance.
    - >-
      Better public customer proof than many AI-agent startups, including named case studies and multi-channel
      enterprise procurement routes.
