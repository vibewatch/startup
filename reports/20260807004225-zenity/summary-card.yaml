    - >-
      Native platform vendors such as Microsoft and ServiceNow can continue adding built-in governance features that
      compress differentiation.
    - >-
      Broad cross-platform scope raises execution burden, policy-complexity risk, and proof requirements across many
      ecosystems at once.
    - Large-round momentum may already embed premium expectations that only premium private metrics can justify.
  unresolvedGaps:
