tables:
- id: TM001
  title: Market boundary table
  columns:
  - Layer
  - Included in market?
  - Why it matters
  - Example evidence
  rows:
  - - Agent discovery / inventory
    - 'Yes'
    - Enterprises need to know which agents, tools, and identities exist before they can govern them
    - Zenity AI Observability; ServiceNow AI Control Tower
  - - Identity / permissions
    - 'Yes'
    - Agent risk is tightly linked to what credentials and privileges agents hold
    - Zenity agentic IAM; CyberArk Idira
  - - Runtime behavior controls
    - 'Yes'
    - Autonomous action is where scope violations and harmful behavior materialize
    - Zenity AIDR; AWS AgentCore security pain points
  - - Prompt-only defenses
    - Partially
    - Important but incomplete because prompts do not capture all agent actions
    - Lakera runtime messaging
  - - Generic model hosting / office productivity
    - No, unless agent governance is explicit
    - Hosting or productivity alone does not solve cross-system action risk
    - Exclusion rule for broad AI or office spend
  notes: The market is defined by control of agent behavior and access, not by every dollar of AI infrastructure or productivity spend.
  claimRefs:
  - CM001
  - CM006
  - CM008
  - CM026
  - CM029
