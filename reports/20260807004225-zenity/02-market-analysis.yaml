- id: TM005
  title: Sizing lenses table
  columns:
  - Lens
  - What to count
  - Why it helps
  - What is still missing
  rows:
  - - Deployment-surface lens
    - Number of major agent platforms in use
    - Captures where governance demand originates
    - Attach rates to security add-ons
  - - Identity / access lens
    - Agents, NHIs, secrets, tools, and MCP servers under management
    - Maps security demand to governed privileges
    - Average contract value per governed identity or agent
  - - Incident-pressure lens
    - Frequency of scope violations, incidents, and shadow agents
    - Explains budget urgency and timing
    - Conversion from incident pain to annual spend
  - - Compliance lens
    - Regulated workflows subject to NIST / EU AI Act / audit demands
    - Explains governance premium versus basic prompt defense
    - How many budgets treat this as mandatory rather than discretionary
  notes: These lenses are more defensible than a single TAM headline because the category still overlaps several existing security and platform budgets.
