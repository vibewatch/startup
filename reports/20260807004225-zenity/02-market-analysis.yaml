- id: sizing-lenses-and-market-verdict
  title: Sizing lenses and market verdict
  body: 'A credible sizing approach has to use multiple lenses rather than a single dramatic TAM headline. One lens is deployment-surface breadth: Microsoft, Salesforce, ServiceNow, AWS, OpenAI, Anthropic, and Google are all making it easier to put agents into production. A second lens is identity and governance complexity: every new agent, tool connection, MCP server, and privileged integration increases control-plane demand. A third lens is incident and compliance pressure, which pushes security budgets toward auditability, runtime controls, and ownership visibility. What remains missing is equally important: public attach rates to native platforms, standalone budget line items, cross-platform contract values, and durable win/loss data between specialists and incumbents. The prudent market verdict is therefore positive but disciplined. Zenity is addressing a real and expanding control problem, but market sizing precision is still worse than market urgency. A fourth lens is procurement
    reality: the same enterprise may buy one specialist for cross-platform auditability while relying on native controls for first-party workflows, which means the category can grow even before a clean standalone budget line fully appears. Investors should therefore treat sizing as layered, not singular.'
  claimRefs:
  - CM026
