callouts:
- calloutType: insight
  title: The category is real because autonomous action is real
  body: The clearest market signal is not a TAM report; it is that large shares of organizations already report unsanctioned agents, scope violations, and incidents. That makes runtime and governance controls more urgent than abstract model-risk talking points.
  claimRefs:
  - CM016
  - CM018
  - CM020
  - CM021
- calloutType: risk
  title: Native platforms can absorb some of the market
  body: Microsoft, Salesforce, ServiceNow, AWS, and identity incumbents are all building governance and control narratives of their own. Independent specialists like Zenity still have room, but they must prove cross-platform depth rather than rely on category novelty alone.
  claimRefs:
  - CM017
  - CM019
  - CM035
  - CM040
