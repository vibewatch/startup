chapter:
  number: 2
  title: Market Analysis
  summary: Zenity sits in an emerging enterprise control-plane market for AI agents rather than in a generic prompt-security niche. Adoption and incident signals are already strong across major agent platforms, but budget ownership, native-platform overlap, and precise market sizing remain unsettled, which supports a positive but disciplined market read.
sections:
- id: market-boundary-and-control-layers
  title: Market boundary and control layers
  body: 'Zenity does not sit in the broadest possible AI-security market. The better boundary is the enterprise control layer for discovering, governing, constraining, and auditing what AI agents can access and what actions they take across business systems. Zenity''s own product taxonomy is useful here: AISPM defines the posture layer, AI Observability defines the discovery layer, AI Detection and Response defines the runtime layer, agentic IAM defines the identity layer, and MCP security extends the surface to model-context and tool-call interactions. This boundary should include SaaS, cloud, and endpoint agents because that is how the company itself frames the problem. It should exclude generic model hosting, plain productivity software, and ordinary cybersecurity products unless they explicitly manage agent behavior. Framed this way, the category is not a narrow prompt filter niche and not a catch-all AI umbrella; it is a control-plane market growing around agent autonomy.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: buyers-users-and-platform-surfaces
  title: Buyers, users, and platform surfaces
  body: The buyer map is cross-functional because the underlying risk is cross-functional. Security leaders care about policy enforcement, identity teams care about privilege and ownership, SecOps cares about detection and response, compliance teams care about traceability, and AI-platform owners care about deployment friction. The main deployment surfaces are now obvious enough to anchor the market. Microsoft Copilot and Microsoft security products set buyer expectations for native controls inside the Microsoft estate. Salesforce markets Agentforce as a low-code autonomous-agent platform already used at broad scale. ServiceNow markets an entire AI-agent stack with Agent Studio, Agent Fabric, and AI Control Tower. AWS AgentCore, OpenAI's agent tools, Claude Enterprise, and Vertex AI Agent Builder extend the market into cloud and model-native workflows. This platform sprawl is why Zenity and its peers market cross-platform coverage rather than single-vendor point solutions.
  claimRefs:
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  - CM031
  - CM032
  tableRefs:
