- id: TM004
  title: Demand drivers vs adoption frictions
  columns:
  - Driver / friction
  - Public signal
  - What it means for demand
  - Caveat
  rows:
  - - Scope violations
    - 53% of organizations report them
    - Runtime controls and auditability become urgent
    - Survey was commissioned by Zenity
  - - Security incidents
    - 47% report an AI-agent incident in the past year
    - Raises willingness to fund controls
    - Incident severity and spend are not fully disclosed
  - - Shadow agents
    - 54% report unsanctioned agents
    - Discovery and ownership tooling become foundational
    - Shadow counts are self-reported
  - - Regulatory preparedness
    - Only 13% feel highly prepared
    - Governance spend can move from optional to necessary
    - Timing of enforcement varies by region
  - - Native-platform overlap
    - Microsoft / Salesforce / ServiceNow / AWS have their own controls
    - Independent vendors face bundling pressure
    - Cross-platform depth may still justify specialist spend
  notes: The strongest growth signals are real, but every signal carries a caveat about survey design, budgeting, or platform overlap.
