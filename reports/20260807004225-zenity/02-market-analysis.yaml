    - id: platforms
      label: Agent platforms
      detail: Microsoft, Salesforce, ServiceNow, AWS, OpenAI, Anthropic, and Google all create agent supply.
    - id: identities
      label: Identities and permissions
      detail: Agents inherit or receive access to data, tools, APIs, and non-human identities.
    - id: runtime
      label: Runtime behavior
      detail: Autonomous actions, tool calls, and workflows create the real risk surface.
    - id: governance
      label: Governance and audit
      detail: Ownership, policies, detection, response, and traceability become mandatory controls.
    - id: budgets
      label: Security budgets
      detail: CISO, IAM, AppSec, SecOps, and platform budgets all compete to own the problem.
