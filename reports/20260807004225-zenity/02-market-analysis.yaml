  columns:
  - Platform surface
  - What the platform supplies
  - Why it expands the market
  - Implication for Zenity
  rows:
  - - Microsoft Copilot / Foundry
    - Native agent ecosystem and security expectations
    - Creates enormous installed-base surface area
    - Zenity can sell cross-platform governance where Microsoft-native controls are insufficient
  - - Salesforce Agentforce
    - Low-code agent builder and autonomous customer workflows
    - Expands agent usage beyond IT into revenue teams
    - Zenity can target CRM-linked agent actions and policy enforcement
  - - ServiceNow AI Platform
    - Agent Studio, Agent Fabric, Control Tower
    - Normalizes central governance language for agents
    - Zenity can integrate into SecOps and compete with native tower controls
  - - AWS Bedrock AgentCore
    - Build / connect / secure / scale agent infrastructure
    - Makes tool-call and behavior security explicit cloud problems
    - Zenity can ride AWS growth while proving differentiated runtime depth
  - - OpenAI / Anthropic / Google
    - Model-native agent building and enterprise deployment surfaces
    - Expands the number of places agents can originate
    - Zenity can market coverage across heterogeneous model stacks
  notes: This table treats agent platforms as demand surfaces rather than as direct market-size estimates.
