- id: milestones-cover-metrics-and-caveats
  title: Milestones, cover metrics, and unresolved caveats
  body: The milestone record supports a high-momentum narrative, but it also defines the limits of what public diligence can underwrite. On the positive side, Zenity publicly ties its rise to rapid enterprise adoption, repeated platform launches, Gartner recognition as the 2026 company to beat in AI-agent governance, a FedRAMP In Process milestone, and customer-validated quotes from SoftBank and other regulated-enterprise contexts. It also says revenue tripled in each of the past two years and is on track to triple again in 2026, which is unusually strong growth language for a private cybersecurity company. On the negative side, the company still does not disclose absolute ARR, a precise customer count, exact valuation, secondary activity, debt, or full board composition. Startup Nation Central also shows that external databases can lag official updates, especially on headcount. The right use of this chapter is therefore as identity ground truth and momentum proof, not as a substitute for
    management materials on valuation support, governance, or economics.
