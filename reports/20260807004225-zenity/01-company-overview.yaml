company:
  name: Zenity
chapter:
  number: 1
  title: Company Overview
  summary: Zenity is a 2021-founded AI-agent security company led by co-founders Ben Kliger and Michael Bargury, with New York go-to-market operations, Tel Aviv R&D, a $125 million August 2026 Series C led by Norwest, and roughly $185 million of cumulative funding. Public evidence supports strong momentum across enterprise adoption, platform expansion, and category recognition, but exact valuation, ARR, full board composition, and financing terms remain private.
sections:
- id: identity-product-and-scale
  title: Identity, product, and operating footprint
  body: 'Zenity is now most credibly described as a late-stage private AI-agent security company rather than as a generic prompt-security vendor or a leftover low-code tool. Its own 2026 materials consistently define the platform as purpose-built for AI agents, with full-lifecycle coverage across discovery, posture management, real-time detection, inline prevention, and response. The same sources anchor the company in a dual-footprint operating model: go-to-market and operations led from New York, with research and development centered in Tel Aviv. Public company descriptions and independent press agree on the Israeli roots and U.S. commercial presence even when wording varies. Scale is strong by private-company standards but still mostly company-reported. Zenity says it serves predominantly Fortune 500 and Global 2000 organizations, counts SoftBank Corp. among customers, and has more than 230 employees worldwide. The caveat is that third-party databases lag the latest disclosure, so identity
    and scale should be treated as well-supported directionally but not fully audited numerically.'
