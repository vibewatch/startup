- id: funding-history-and-partner-base
  title: Funding history, investor syndicate, and distribution partners
  body: 'Zenity''s public financing record shows increasingly institutional backing and a widening strategic network. The company disclosed a $16.5 million Series A in September 2023 led by Intel Capital, followed by a strategic M12 investment in July 2024 and a $38 million Series B in October 2024 co-led by Third Point Ventures and DTCP. On August 3, 2026, it announced a $125 million Series C led by Norwest, adding Qumra Capital, SoftBank Vision Fund 2, Hitachi Ventures, and LG Technology Ventures while also retaining Vertex Ventures, Third Point Ventures, DTCP, and Intel Capital. Independent coverage from SiliconANGLE and Calcalist Tech converges on roughly $185 million of cumulative funding after the Series C. The operating implication is broader than capital alone: Microsoft and AWS marketplace listings, ServiceNow integration, Carahsoft public-sector channels, and product coverage for Claude Enterprise, OpenAI AgentKit, and Bedrock AgentCore all make the syndicate and partner map strategically
    relevant to future distribution.'
