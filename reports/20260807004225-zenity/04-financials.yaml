  - - Burn, cash, and runway
    - Needed for capital-adequacy analysis
    - Not publicly disclosed
    - Request monthly burn, cash on hand, and runway
  - - Retention and concentration
    - Needed for durability and downside analysis
    - Not publicly disclosed
    - Request NRR, GRR, renewal cohorts, and top-customer share
  - - Cap-table terms
    - Needed for economic outcome analysis
    - Not publicly disclosed
    - Request term sheet summary and preference stack
  notes: The blockers are fundamental enough that they should be treated as underwriting prerequisites, not as optional follow-up details.
