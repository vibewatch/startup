  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited ARR, absolute revenue, gross margin, burn, runway, retention, and customer concentration.
    whyItMatters: These are the minimum denominators required to underwrite a private security company rather than just admire momentum.
    diligencePath: Request audited financial package and cohort reporting.
    relatedQuestionRefs:
    - QI011
    - QI015
    - QI019
    - QI024
    - QI025
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-and-packaging
    missingEvidence: Pricing tiers, contract length, services mix, and revenue-recognition policy.
    whyItMatters: Without commercial structure, it is hard to infer sales efficiency or gross-margin durability.
    diligencePath: Request standard order forms, price lists, and bookings-to-revenue bridges.
    relatedQuestionRefs:
    - QI001
    - QI012
    - QI013
    - QI024
    relatedTableRefs:
    - TI001
  - type: conflicting-data
    severity: minor
    topic: headcount-discrepancy
    missingEvidence: Reconcile the 230+ employee disclosure with third-party databases that still show a lower band.
    whyItMatters: It is not thesis-breaking, but it is a reminder that outside databases lag company updates and can distort cost-structure inference.
    diligencePath: Confirm current headcount by function and geography.
    relatedQuestionRefs:
    - QI010
    - QI023
    relatedTableRefs:
    - TI002
