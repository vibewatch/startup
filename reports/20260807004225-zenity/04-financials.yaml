- id: cost-structure-and-comparable-benchmarks
  title: Cost structure clues and public-comparable benchmarks
  body: The public record offers only indirect clues on cost structure. More than 230 employees split across Tel Aviv R&D and New York go-to-market operations imply a meaningful spend base, and the continuing emphasis on platform breadth, research, and global expansion argues for ongoing investment rather than visible margin optimization. That is not inherently negative, but it means public-comp benchmarking is more instructive on scale thresholds than on direct multiple comparisons. Public leaders such as CrowdStrike, Zscaler, Okta, Cloudflare, and Palo Alto disclose billions of dollars of revenue or ARR and file detailed results with the SEC, which is why investors can debate their efficiency and valuation in public. Zenity is not yet comparable in that sense. Public-comparable data are useful mainly as a reminder of how much disclosure still separates Zenity from underwritable public-scale cyber businesses. That disclosure gap matters because premium cyber valuations usually rely on repeated
    proof of revenue quality, not just on a compelling market narrative.
  claimRefs:
  - CI019
  - CI020
  - CI023
  - CI024
  - CI025
