chapter:
  number: 4
  title: Financials
  summary: Zenity's public financial story is strong on capital access and growth momentum but weak on the denominators needed for underwriting. The company looks well funded enough to keep scaling, yet public evidence still does not disclose ARR, revenue, margin, burn, runway, or retention, so the financial verdict remains constructive on resilience and cautious on transparency.
sections:
- id: revenue-model-and-public-traction
  title: Revenue model and public traction
  body: Zenity's public materials support an enterprise-software business model rather than project revenue or consumer monetization. The company repeatedly describes a security and governance platform sold to some of the world's largest enterprises, including Fortune 500, Global 2000, and regulated-sector customers. SoftBank Corp. is named explicitly, which suggests enterprise sales motions with meaningful contract value rather than broad self-serve usage. The revenue proof is still mostly narrative rather than numeric. Zenity says revenue tripled in each of the past two years and is on track to triple again in 2026, but it does not publish absolute ARR or revenue. The right reading is therefore that traction looks real and probably enterprise-grade, but the public surface stops at threshold evidence instead of giving investors the hard denominators needed to benchmark recurring revenue quality. Even a bullish reader therefore has to separate sales relevance from verified economics.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI009
  - CI016
  tableRefs:
  - TI001
  - TI002
- id: capital-access-and-use-of-funds
  title: Capital access and use of funds
  body: 'Zenity''s financing record is the clearest financial strength visible publicly. The company moved from a $16.5 million Series A in 2023 to a strategic M12 investment in 2024, then a $38 million Series B in late 2024, and finally a $125 million Series C in August 2026. Independent coverage now places cumulative funding at roughly $185 million. The stated uses of capital matter as much as the amounts: Series B money went into product, engineering, sales, marketing, and partner expansion, while Series C money is earmarked for global expansion, platform innovation, and Zenity Labs. This pattern is consistent with a company still prioritizing scale and category leadership over visible efficiency harvesting. It also suggests that access to capital has improved rather than tightened, which is a meaningful positive signal even though no cash balance or runway is disclosed. It also matters that the company has not publicly signaled bridge financing, emergency restructuring, or visible retrenchment,
    which makes the current funding profile look offensive rather than defensive.'
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI013
