- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The provisional financial verdict is constructive on resilience and cautious on transparency. Zenity looks too well funded, too enterprise oriented, and too strategically backed to dismiss as a speculative edge case. At the same time, it remains too opaque for outside investors to judge revenue quality, margin path, sales efficiency, or capital intensity from public evidence alone. The biggest adverse risk is not a visible collapse in demand; it is that a very strong narrative can coexist with economics that are only average or worse. That is why ARR, gross margin, burn, runway, retention, customer concentration, and cap-table terms remain central diligence asks. Investors should preserve the contradiction: Zenity may be financially strong in practice, but the public record is still weak for underwriting. Public enthusiasm should therefore increase diligence intensity, not replace it.'
