    - Large enterprises need a formal risk framework
    - Supports overlay-governance demand
  - - EU AI Act
    - Documentation, oversight, and controls will matter more
    - European or global buyers need process maturity
    - Can increase demand and diligence burden
  - - FTC AI guidance
    - Impersonation and misuse are enforcement concerns
