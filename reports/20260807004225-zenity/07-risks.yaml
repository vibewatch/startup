  rows:
  - - Unauthorized action
    - Agents can take harmful actions in live systems
    - Zenity architecture and risk blogs
    - Core differentiator of the category
  - - Prompt injection / indirect input abuse
    - Input manipulation can trigger downstream unsafe actions
    - OWASP and Zenity risk materials
    - Still a foundational entry point
  - - Over-privileged access
    - Excess access turns small mistakes into major incidents
    - Zenity IAM and Copilot research
    - Identity and least privilege remain central
  - - Tool misuse / MCP abuse
    - Standardized tool interfaces widen attack surface
    - MCP layer and broader agent-tooling context
    - Protocol governance becomes security-critical
  - - Autonomy failures
    - Unchecked agent loops can create compounding harm
    - CSA incidents and browser/coding-agent research
    - Production controls matter more than demos
  notes: The relevant threat model is action-centric, not just prompt-centric.
