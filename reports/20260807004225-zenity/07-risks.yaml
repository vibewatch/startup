company:
  name: Zenity
chapter:
  number: 7
  title: Risks
  summary: Zenity operates in a market with real and growing enterprise urgency, but that urgency comes with unusually high proof burdens. Public sources support strong category relevance around unauthorized action, tool misuse, and agent autonomy, while also highlighting material execution, compliance, native-platform, and deployment-quality risks that require deeper diligence than usual for a cybersecurity startup.
sections:
- id: threat-model-and-attack-surface
  title: Threat model and attack surface
  body: 'Zenity''s public risk story is credible because it focuses on the parts of agentic AI that actually change enterprise exposure: delegated action, tool use, over-privileged access, and cross-system automation. The company''s own research on coding agents, browser agents, and Copilot Studio vulnerabilities reinforces that the relevant attack surface is not hypothetical. This is not just about unsafe prompts; it is about agents taking real actions in real systems. That framing aligns with external taxonomies from OWASP and the Cloud Security Alliance, which increasingly treat unchecked autonomy and excessive agency as distinct sources of harm. The key investor implication is that Zenity is operating in a threat environment where a small control failure can become a broad operational incident once agents have permission to act across business systems. That raises the value of prevention, but it also raises the cost of getting policy decisions wrong. That raises both urgency and scrutiny.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR014
  - CR031
  - CR037
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: legal-privacy-and-compliance-posture
  title: Legal, privacy, and compliance posture
  body: The public legal and compliance posture is directionally encouraging but incomplete. Zenity has visible privacy, terms, vulnerability disclosure, and coordinated disclosure materials, and it has public messaging around FedRAMP in process. Those are meaningful signals for an early growth company selling security into large enterprises and the public sector. But they do not resolve the deeper diligence questions around data handling, contractual allocations of risk, production incident process maturity, or the exact controls mapping buyers may require under frameworks such as NIST and the EU AI Act. Investors should therefore read the visible legal artifacts as threshold signals, not as closing evidence. For a company selling governance, buyers will eventually ask how customer data is processed, what telemetry is retained, which subprocessors matter, how cross-border issues are handled, and how incident obligations are allocated in contract language. More detail is still required.
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR018
  - CR020
  - CR027
  - CR028
  - CR029
  - CR033
  tableRefs:
  - TR002
  - TR003
  figureRefs:
  - FR002
- id: regulatory-and-go-to-market-risk
  title: Regulatory and go-to-market risk
  body: 'Zenity benefits from a market where regulation and buyer caution both increase category urgency. FTC, CISA, NIST, and EU guidance all make it easier to explain why enterprises need governance for AI agents. The tradeoff is that the same forces can slow down evaluation, procurement, and expansion. Public-sector channels illustrate the pattern well: Carahsoft and FedRAMP in process make access more credible, but they do not guarantee fast conversion or scaled deployment. The same two-sided dynamic applies to large enterprises, where legal, risk, and audit teams may become both Zenity''s best internal champions and its biggest timing constraint. That pattern can be attractive if Zenity becomes the natural translator between security teams and governance teams. It becomes risky if compliance complexity lengthens the time between technical validation and enterprise-wide rollout, especially in public-sector and regulated accounts where timing assumptions can easily slip.'
  claimRefs:
  - CR012
  - CR013
  - CR020
  - CR021
  - CR022
  - CR025
  - CR032
  - CR034
  - CR036
  tableRefs:
  - TR004
  figureRefs:
  - FR003
- id: execution-competition-and-risk-verdict
  title: Execution, competition, and risk verdict
  body: 'The largest strategic risk is that Zenity is trying to become the control plane for a market whose boundaries are still moving. Every added ecosystem, layer, and workflow can improve the moat, but it also increases implementation burden, policy complexity, and proof requirements. Native platform controls from Microsoft, ServiceNow, OpenAI, AWS, Google, and Salesforce will keep improving. That does not eliminate Zenity''s opportunity; it means the company has to prove that an independent overlay offers better cross-platform governance and faster response than native features alone. The net assessment is balanced: the market is real, the problem is urgent, and the diligence burden should be exceptionally high. The practical implication is simple: the company may deserve a premium strategic narrative, but it does not deserve light diligence. The more categories and ecosystems Zenity touches, the more important it becomes to test policy precision, deployment quality, implementation
    burden, and the real customer willingness to trust an overlay control plane. That is exactly where diligence should spend disproportionate time.'
  claimRefs:
