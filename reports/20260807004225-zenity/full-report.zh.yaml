              并未把进入智能体安全描述为剧烈转向，而是同一控制问题的自然延伸。这种连续性很重要，因为它说明公司进入智能体治理时，带着既有的政策与可见性框架，而不是被热点临时拉动。治理披露仍然不足。除 Intel Capital
              称 Yoni Greifman 于 2023 年加入董事会外，保留的公开材料没有清楚列出完整董事会、委员会结构或投资人控制安排。尽管创始人叙事很强，关键人依赖和董事会质量尽调仍未解决。
