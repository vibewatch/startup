  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与控制层
        blocks:
          - type: paragraph
            body: >-
              Zenity 并不处在最宽泛的 AI 安全市场里。更合适的边界，是企业控制层：发现、治理、约束并审计 AI 智能体能访问什么、会在业务系统中执行什么动作。Zenity 自己的产品分类在这里很有用：AISPM
              定义态势层，AI Observability 定义发现层，AI Detection and Response 定义运行时层，智能体 IAM 定义身份层，MCP
              安全将表面扩展到模型上下文和工具调用交互。这个边界应纳入
              SaaS、云和端点智能体，因为公司自己就是这样界定问题；除非产品明确管理智能体行为，否则应排除通用模型托管、普通生产力软件和常规网络安全产品。这样看，这个品类既不是狭窄的提示过滤器细分市场，也不是包罗万象的 AI
              大伞，而是围绕智能体自主性生长出来的控制平面市场。
