              Zenity 最清晰的技术差异化主张是：智能体 AI
              的核心风险是未经授权的动作，而不只是提示文本。关于意图感知检测和未经授权动作的文章，把买家推向一种控制模型：看智能体试图做什么、能访问什么，以及策略应允许、修改还是阻止该动作。公开研究强化了这个论点。围绕
              Copilot Studio
              漏洞、编码智能体攻击面、浏览器智能体攻击和更广泛治理盲区的工作显示，公司正尝试从真实利用路径中提炼产品方向。这本身不能证明生产深度，但确实让架构更像扎根于智能体在实践中如何失效。OWASP LLM Top 10
              等外部风险分类也解释了这种框架为何能引起共鸣：过度代理、不安全插件或工具使用、间接提示滥用，在智能体能代表用户或系统执行动作之后都会显著更危险。
