    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营版图
        blocks:
          - type: paragraph
            body: >-
              现在更可信的说法是，Zenity 是一家后期私有 AI 智能体安全公司，而不是泛化的提示安全供应商，也不是低代码工具的残余。公司自己的 2026 年材料持续把平台定义为专为 AI
              智能体打造，覆盖发现、态势管理、实时检测、内联阻断和响应全生命周期。同一批来源也把公司锚定在双地运营模式：市场拓展和运营由 New York 牵头，研发中心在 Tel
              Aviv。公开公司描述和独立媒体虽然措辞不同，但都认可其以色列根基和美国商业存在。按私营公司标准，规模已经不小，但大多仍来自公司自报。Zenity 称客户以 Fortune 500 和 Global 2000
              组织为主，SoftBank Corp. 也是客户之一，全球员工超过 230 人。需要注意的是，第三方数据库滞后于最新披露，因此公司身份和规模在方向上证据充分，但数字还不能视为完全审计。
