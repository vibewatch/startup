        title: 买家、用户与平台表面
        blocks:
          - type: paragraph
            body: >-
              买家地图横跨多个职能，因为底层风险本身就跨职能。安全负责人关注策略执行，身份团队关注权限和归属，SecOps 关注检测与响应，合规团队关注可追溯性，AI
              平台负责人关注部署摩擦。主要部署表面如今已经足够清晰，可以用来锚定市场。Microsoft Copilot 和 Microsoft 安全产品定义了买家对 Microsoft
              资产内原生控制的预期。Salesforce 将 Agentforce 定位为已经大规模使用的低代码自主智能体平台。ServiceNow 推出包含 Agent Studio、Agent Fabric 和 AI
              Control Tower 的完整 AI 智能体技术栈。AWS AgentCore、OpenAI 的智能体工具、Claude Enterprise 和 Vertex AI Agent
              Builder，又把市场延伸到云和模型原生工作流。平台蔓延正是 Zenity 及同类公司强调跨平台覆盖，而非单一供应商点状方案的原因。
