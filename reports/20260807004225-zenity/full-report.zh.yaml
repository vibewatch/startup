              案例研究，它们显示公司能够指向具体企业环境，而不是完全依赖匿名试点或概念性背书。这两个引用很重要，因为代表了不同工作流场景：Varonis 指向治理密集的数据环境，Telit Cinterion
              指向运营复杂性和工业相关性。两者合在一起不能证明广泛市场渗透，但已经跨过最基本的尽调门槛：现实场景中是否存在真实客户。即便如此，两个实名客户应被视为存在证明，而不是证明已广泛渗透所有目标垂直。更多引用会显著提升信心。实际结论是，Zenity
              已从假想供应商跨过门槛，成为可被引用的供应商；但它尚未提供足够多的实名客户，让客户名单本身构成可防守护城河。
