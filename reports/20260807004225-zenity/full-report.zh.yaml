figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Zenity 从 2021 年低代码安全创业公司起步，到 2026 年已成后期阶段的 AI 智能体安全平台，融资和生态里程碑都很强。
    data:
      items:
        - label: 成立
          date: 2021-04
          detail: Ben Kliger 和 Michael Bargury 围绕受 Microsoft 经历启发的安全判断创办 Zenity。
        - label: A 轮
          date: '2023-09-12'
          detail: Intel Capital 领投 $16.5M A 轮，验证早期 LCNC 安全需求。
        - label: M12 战略投资
          date: '2024-07-30'
          detail: Microsoft 风投部门投资，进一步加深生态协同。
        - label: B 轮
          date: '2024-10-29'
          detail: Third Point Ventures 与 DTCP 共同领投 $38M B 轮，总融资超过 $55M。
        - label: 覆盖 AWS AgentCore
          date: '2025-12-02'
          detail: Zenity 将全生命周期安全扩展到 Amazon Bedrock AgentCore。
        - label: FedRAMP In Process 状态
          date: '2026-03-12'
          detail: 公共部门合规里程碑显示其联邦市场野心。
        - label: Gartner 标杆公司
          date: '2026-04-23'
          detail: Zenity 宣布在 AI 智能体治理领域获得 Gartner 认可。
        - label: C 轮
          date: '2026-08-03'
          detail: Norwest 领投 $125M C 轮，使总融资约达 $185M，并披露员工数超过 230 人。
    approximationNotes: null
    claimRefs:
      - CO002
      - CO005
      - CO006
      - CO018
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
