  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与竞品分组
        blocks:
          - type: paragraph
            body: >-
              Zenity 面对的竞争格局比一张创业公司短名单更宽。最直接的专业厂商是 Prompt Security、Lakera、Oasis、Noma 和 Astrix，但真实的企业采购动作还包括 CyberArk
              等身份既有厂商、Check Point 等广义网络安全平台，以及 Microsoft、Salesforce、ServiceNow 和 AWS
              等原生应用或基础设施厂商。这意味着买家并不是在一个干净品类里做选择。他们是在不同控制哲学之间取舍：提示加固、运行时执行、身份治理、工作流原生编排和大型平台打包。实际结论是，分析 Zenity
              应按功能而不是标签。它最直接的竞争威胁来自在跨平台治理或动作层控制上重叠的厂商，而不是每一家官网写着“AI 安全”的公司。这也是简单市场地图低估真实挑战的原因。Fortune 500
              买家可以同时短列一家专业厂商、一家身份厂商和一个原生平台团队，并不觉得矛盾，因为各自解决同一控制问题的不同切片。
