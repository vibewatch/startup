      - number: '8.4'
        title: 退出准备度、终止触发条件与最终立场
        blocks:
          - type: paragraph
            body: >-
              Zenity 今天不必已经具备 IPO
              准备度才值得投，但它必须过掉比更小、更早期公司更高的一道尽调门槛。因此，最终立场应当是有条件的。若尽调确认留存强、扩张可持续、实施纪律好，并且入场价格仍给高端回报留出空间，这笔交易仍然有吸引力。反之，若尽调显示部署很浅、增长叙事背后的证据薄弱，或者估值已经按一流网络安全经济性定价，就应压价甚至放弃。只有高溢价叙事还不够。因此，在私有证据补上最大缺口前，估值答案都应保持有条件。一次好的尽调结果不只是证明
              Zenity 令人兴奋；它要证明热度下面的业务质量足以支撑有纪律的溢价。如果证据没有出现，耐心才是更好的投资动作。
