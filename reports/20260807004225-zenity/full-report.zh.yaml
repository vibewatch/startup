    type: flow
    layout: standard
    summary: Zenity 的逻辑链条从公民开发安全延伸到 AI 智能体运行时控制、企业牵引力和后期融资。
    data:
      nodes:
        - id: origin
          label: LCNC 安全起点
          detail: 最初使命是保护公民开发者构建的应用、自动化和工作流。
        - id: evolution
          label: AI 智能体治理演进
          detail: 同一套策略和可视化模型扩展到自主智能体。
        - id: runtime
          label: 运行时与态势控制
          detail: 发现、态势、检测、内联阻断和响应构成当前叙事核心。
        - id: customers
          label: 企业客户证据
          detail: 多数客户来自 Fortune 500 / Global 2000，加上 SoftBank 客户引言。
        - id: capital
          label: 战略资本结构
          detail: M12、Intel、Third Point、DTCP 和 Norwest 支持公司。
        - id: gaps
          label: 私有尽调缺口
          detail: ARR、估值、完整董事会构成和融资条款仍未披露。
      edges:
        - from: origin
          to: evolution
          label: 自然推进
        - from: evolution
          to: runtime
          label: 控制面扩大
        - from: runtime
          to: customers
          label: 价值主张
        - from: customers
          to: capital
          label: 支撑融资
        - from: gaps
          to: capital
          label: 投资判断保留项
