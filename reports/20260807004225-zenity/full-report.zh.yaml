        title: 威胁模型与攻击面
        blocks:
          - type: paragraph
            body: >-
              Zenity 的公开风险叙事可信，因为它聚焦于真正改变企业暴露面的智能体 AI 部分：委托动作、工具使用、过度授权访问和跨系统自动化。公司自己对编码智能体、浏览器智能体和 Copilot Studio
              漏洞的研究，也强化了相关攻击面并非假想。这不只是危险提示词问题，而是智能体在真实系统中执行真实动作。这个框架与 OWASP 和 Cloud Security Alliance
              的外部分类一致；后者越来越把未受控制的自主性和过度代理视为独立伤害来源。对投资人的关键含义是，Zenity
              所处威胁环境里，一旦智能体获准跨业务系统行动，一个小的控制失败就可能变成广泛运营事件。这提高了预防价值，也提高了策略判断出错的成本。紧迫性和审视强度都会上升。
