          - type: paragraph
            body: >-
              这里唯一站得住的估值方法是场景法。牛市情形下，Zenity 成为企业 AI 智能体的独立控制层，指标质量接近顶级网络安全公司。基准情形下，Zenity
              能坐稳一个重要品类领导者的位置，但还需要时间证明收入质量和部署深度。熊市情形下，原生平台会压窄切入口，或者客户扩张速度低于市场叙事假设。CrowdStrike、Zscaler 等公开可比公司给出区间高端，Palo
              Alto、Okta、Cloudflare、Fortinet 则提供更保守锚点。关键不是 Zenity
              今天就该拿某个上市公司倍数，而是证据越薄，入场纪律越要收紧。即使在成熟的上市安全公司里，市场重新定价增长质量时，估值区间也会大幅移动；这也是为什么给 Zenity
              建模要保持谦逊。场景纪律还能避开后期交易常见错误：先按融资轮次反推估值，再找可比公司背书。这里更稳妥的方法，是让证据深度决定 Zenity 应该落在溢价到保守区间的哪一端。
