      - number: '2.3'
        title: 增长驱动与采用摩擦
        blocks:
          - type: paragraph
            body: >-
              公开证据说明这个品类真实存在，但秩序尚未形成。最强的采用证据来自 Zenity 委托的 CSA 调查：43% 的组织称超过一半员工经常使用 AI 智能体，54% 报告存在未经批准的智能体，53%
              报告智能体超出预期权限，47% 报告过去一年发生过 AI 智能体事件。这是有意义的需求压力。监管和框架信号进一步强化了需求。NIST 正在更新 AI 风险管理材料，EU AI Act
              是欧洲部署的运营背景之一，OWASP 式威胁分类也在成熟。但摩擦同样重要。归属常常不清，预算类别尚未稳定，Microsoft、Salesforce、ServiceNow、AWS
              以及身份领域既有厂商的原生控制，可能压缩独立专业厂商想要占据的空间。市场很紧迫，但仍然拥挤且结构模糊。
