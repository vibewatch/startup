companyProfile:
  summary: >-
    Zenity 是一家以色列创立的 AI 智能体安全公司。Ben Kliger 和 Michael Bargury 在 Microsoft
    云安全工作中看到了自动化以及后续智能体系统里的治理盲区，随后创办了公司。公开材料显示，Zenity 从低代码与自动化安全切入，演进成企业 AI 智能体的跨平台控制层，把态势管理、可观测性、运行时检测与响应、智能体 IAM 和 MCP
    安全整合在一起。到 2026 年 8 月，Zenity 已完成 $125 million Series C 轮，称客户以 Fortune 500 和 Global 2000 企业为主，披露员工超过 230 人，并在
    Microsoft、AWS、ServiceNow 和公共部门生态中建立了可见渠道。市场与产品逻辑看起来真实；剩下的不确定性，是运营指标和股权条款能否完全支撑后期轮定价。
