      - number: '2.4'
        title: 规模测算视角与市场判断
        blocks:
          - type: paragraph
            body: >-
              可信的测算方法必须使用多重视角，而不是只给一个夸张的 TAM 标题。第一重视角是部署表面广度：Microsoft、Salesforce、ServiceNow、AWS、OpenAI、Anthropic 和
              Google 都在降低智能体进入生产环境的门槛。第二重是身份与治理复杂度：每新增一个智能体、工具连接、MCP
              服务器和高权限集成，控制平面需求都会增加。第三重是事件与合规压力，它会把安全预算推向可审计性、运行时控制和归属可见性。缺失的东西同样重要：原生平台的公开
              挂载率、独立预算项目、跨平台合同金额，以及专业厂商与既有厂商之间持久的赢单 / 输单数据。因此，审慎的市场判断是积极但克制。Zenity
              面向的控制问题真实且在扩张，但市场规模的精确度仍落后于市场紧迫性。第四重视角是采购现实：同一家企业可能购买一个专业厂商来做跨平台可审计性，同时依赖原生控制处理第一方工作流。也就是说，即便清晰的独立预算线尚未完全出现，品类仍然可以增长。因此投资人应把市场规模视为分层结构，而不是单一数字。
