  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Zenity 的产品更适合理解为企业 AI 智能体的跨平台控制层，而不是单一扫描功能。公开平台地图把问题拆成离散模块：AISPM 负责部署前态势，AI Observability 负责发现，AI
              Detection and Response 负责运行时监控与调查，智能体 IAM 负责归属和最小权限控制，MCP 安全
              负责模型上下文和工具调用治理。这个拆解很重要，因为它说明公司不只是描述一个威胁品类，而是在尝试把品类变成产品架构。由此形成的产品定义很宽，但逻辑连贯：找到智能体，理解它们能访问什么，观察它们做什么，并在动作越过策略边界时介入。这个框架也匹配外部围绕智能体形成的风险词汇：一旦工具、权限和委托动作进入循环，治理就必须从提示卫生扩展到动作治理。MCP
              等标准化努力让这一层更具战略意义，因为通用接口既会加速采用，也会加速滥用。
