            body: >-
              Zenity 的公开材料支撑的是企业软件商业模式，而不是项目收入或消费者变现。公司反复把自己描述为向全球最大企业销售的安全与治理平台，客户包括 Fortune 500、Global 2000
              和受监管行业。SoftBank Corp. 被明确点名，说明销售动作更像合同金额可观的企业销售，而不是大范围自助使用。收入证明仍以叙事为主，而非数字。Zenity 称过去两年收入每年翻三倍，2026
              年也有望再次翻三倍，但没有公布绝对 ARR
              或收入。正确读法是：牵引力看起来真实，且很可能达到企业级；但公开信息只给出门槛证据，没有给投资人用于衡量经常性收入质量的硬分母。即便乐观读者，也必须把销售相关性与已验证经济性分开。
