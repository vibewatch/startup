chapter:
  number: 5
  title: Product & Technology
  summary: 'Zenity''s product story is built around a coherent control-loop architecture for enterprise AI agents: discover them, assess posture, map identity and tool access, monitor runtime behavior, and intervene before unsafe actions occur. Public evidence supports strong cross-platform breadth and credible technical problem framing, but benchmark data and deep production references remain thinner than the breadth of the promise.'
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: 'Zenity''s product is best understood as a cross-platform control layer for enterprise AI agents rather than as a single scanning feature. Its public platform map breaks the problem into discrete modules: AISPM for pre-deployment posture, AI Observability for discovery, AI Detection and Response for runtime monitoring and investigation, agentic IAM for ownership and least-privilege controls, and MCP security for model-context and tool-call governance. That decomposition matters because it shows the company is not only describing a threat category; it is trying to turn the category into a product architecture. The resulting product definition is broad but coherent: find the agents, understand what they can access, watch what they do, and intervene when actions fall outside policy. That framework also matches the external risk vocabulary emerging around agents: once tools, permissions, and delegated actions enter the loop, governance has to extend beyond prompt hygiene into action
    governance. Standardization efforts such as MCP make that layer more strategic, because common interfaces can accelerate both adoption and abuse.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE039
  - CE041
  - CE046
