- id: trust-controls-and-product-verdict
  title: Trust controls and product verdict
  body: 'The public trust and compliance story is strong in concept and incomplete in proof. Zenity repeatedly emphasizes policy, auditability, ownership, and centralized visibility, and the ecosystem context from ServiceNow, Salesforce, and Microsoft shows why those controls matter. But the retained public source set does not include hard benchmark data on latency, false positives, reliability, or large-scale deployment depth for the current AI-agent modules. That leaves a two-sided verdict. The product architecture is coherent, timely, and aligned with where enterprise agents are going. The unresolved risk is whether operational depth has kept pace with the breadth of the promise and the pace of ecosystem expansion. Investors should treat that as a classic platform-company tension: aggressive coverage expansion can create a real moat, but it can also outrun the public evidence needed to prove uniform maturity across every supported stack. That is the core diligence issue for a category-defining
    security platform.'
