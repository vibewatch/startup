  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Threat model and attack surface
        blocks:
          - type: paragraph
            body: >-
              Zenity's public risk story is credible because it focuses on the parts of agentic AI that actually change
              enterprise exposure: delegated action, tool use, over-privileged access, and cross-system automation. The
              company's own research on coding agents, browser agents, and Copilot Studio vulnerabilities reinforces
              that the relevant attack surface is not hypothetical. This is not just about unsafe prompts; it is about
              agents taking real actions in real systems. That framing aligns with external taxonomies from OWASP and
              the Cloud Security Alliance, which increasingly treat unchecked autonomy and excessive agency as distinct
              sources of harm. The key investor implication is that Zenity is operating in a threat environment where a
              small control failure can become a broad operational incident once agents have permission to act across
              business systems. That raises the value of prevention, but it also raises the cost of getting policy
              decisions wrong. That raises both urgency and scrutiny.
