          - type: figure
            figureRef: FV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV032
      - number: '8.3'
        title: Scenarios and comparable lens
        blocks:
          - type: paragraph
            body: >-
              A scenario approach is the only defensible valuation method here. In the bull case, Zenity becomes the
              independent control layer for enterprise AI agents and grows into top-tier cyber quality metrics. In the
              base case, it becomes a meaningful category leader but needs time to prove revenue quality and deployment
              depth. In the bear case, native platforms narrow the wedge or customers expand more slowly than the market
              narrative assumes. Public comps such as CrowdStrike and Zscaler set the premium end of the range, while
              Palo Alto, Okta, Cloudflare, and Fortinet provide more conservative anchors. The lesson is not that Zenity
              deserves any specific public-company multiple today, but that entry discipline should tighten as proof
              gets thinner. Even within established public-security names, valuation bands move materially as markets
              re-rate growth quality, which is another reason to underwrite Zenity with humility. Scenario discipline
              also helps avoid a common late-stage mistake: reverse-engineering a valuation from the round and then
              looking for comps to justify it. Here, the more defensible method is to let proof depth determine where
              Zenity belongs on the premium-to-conservative spectrum.
            claimRefs:
              - CV012
              - CV013
