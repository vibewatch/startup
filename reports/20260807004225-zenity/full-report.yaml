      - number: '2.3'
        title: Growth drivers and adoption frictions
        blocks:
          - type: paragraph
            body: >-
              Public evidence says the category is real, but not yet orderly. The strongest adoption proof comes from
              the CSA survey commissioned by Zenity: 43% of organizations say more than half of employees use AI agents
              regularly, 54% report unsanctioned agents, 53% report agents exceeding intended permissions, and 47%
              report an AI-agent incident in the past year. That is meaningful demand pressure. Regulatory and framework
              signals strengthen it further. NIST is updating its AI risk-management materials, the EU AI Act is part of
              the operating backdrop for European deployments, and OWASP-style threat taxonomies are maturing. But the
              frictions are equally important. Ownership is often unclear, budget categories are unsettled, and native
              controls from Microsoft, Salesforce, ServiceNow, AWS, and identity incumbents can compress the space an
              independent specialist hopes to own. The market is urgent, but it is still crowded and structurally
              ambiguous.
