  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor cohorts
        blocks:
          - type: paragraph
            body: >-
              Zenity competes in a landscape that is broader than a startup short list. The most direct specialists are
              Prompt Security, Lakera, Oasis, Noma, and Astrix, but the real enterprise buying motion also includes
              identity incumbents such as CyberArk, broad cyber platforms such as Check Point, and native application or
              infrastructure vendors such as Microsoft, Salesforce, ServiceNow, and AWS. This means buyers are not
              choosing from one clean category. They are choosing among different control philosophies: prompt
              hardening, runtime enforcement, identity governance, workflow-native orchestration, and broad platform
              bundling. The practical takeaway is that Zenity should be analyzed by function rather than by label. Its
              most immediate competitive threat comes from vendors that overlap on cross-platform governance or
              action-layer control, not from every company that uses the phrase AI security on its homepage. That is why
              simplistic market maps understate the real challenge. A Fortune 500 buyer can shortlist one specialist,
              one identity vendor, and one native platform team without feeling inconsistent, because each is solving a
              different slice of the same control problem.
            claimRefs:
              - CP001
