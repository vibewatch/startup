              The founder set is straightforward: Ben Kliger is CEO and Michael Bargury is CTO, and both are repeatedly
              tied to the company's original thesis. The strongest founder-market-fit evidence comes from Intel
              Capital's Series A announcement, which says the pair previously led Microsoft cloud-security initiatives
              and saw firsthand how citizen-developed apps, automations, and later AI-driven workflows created security
              blind spots. M12's founder interview adds a useful interpretive layer: Zenity did not describe the move
              into agent security as a dramatic pivot, but as a natural extension of the same control problem. That
              continuity matters because it suggests the company entered agent governance with an existing
              policy-and-visibility frame instead of reacting opportunistically to hype. Governance disclosure is still
              thin. Beyond Intel Capital's statement that Yoni Greifman joined the board in 2023, the retained public
              set does not clearly enumerate the full board, committee structure, or investor-control arrangements. That
