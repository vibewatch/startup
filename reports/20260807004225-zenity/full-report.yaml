      - number: '3.2'
        title: Specialists vs identity-led vendors vs native platforms
        blocks:
          - type: paragraph
            body: >-
              The specialists overlap heavily in language but not perfectly in emphasis. Prompt Security leans toward
              skills, drift, and auditing; Lakera toward low-latency runtime defense; Noma toward end-to-end policy and
              monitoring; Oasis toward AI agents plus non-human identity; Astrix toward discover-secure-deploy with
              least-privileged access. CyberArk pushes identity as the control plane for the AI enterprise, while Check
              Point folds AI governance into a broader cyber platform. Native-platform vendors raise a different kind of
              threat because their advantage is not only features; it is trust, procurement access, and default
              distribution. Microsoft, Salesforce, ServiceNow, and AWS all expand the agent surface while also offering
              governance language of their own. Zenity's public response is to claim cross-platform coverage and
              action-layer depth, especially where enterprise agents span more than one platform at once.
