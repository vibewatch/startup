  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Integrated thesis and recommendation
        blocks:
          - type: paragraph
            body: >-
              Zenity clears the first hurdle of a premium cyber investment: the problem looks real, the product
              architecture looks coherent, and the company appears to have authentic enterprise traction rather than a
              purely conceptual AI story. At the same time, the public record is still thin where late-stage pricing
              matters most. ARR, retention, margin quality, deployment depth, and dilution terms remain undisclosed.
              That leads to a clear recommendation from public evidence alone: stay constructive, keep leaning in, but
              keep price discipline. That posture preserves upside without outsourcing judgment to headline momentum.
              Investors should notice that this is already a higher-quality starting point than many AI-native deals:
              the company has category validation, product coherence, and evidence of real customers. But a better
              starting point is not the same thing as a complete underwriting file. Nothing less is sensible.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV027
              - CV036
              - CV040
