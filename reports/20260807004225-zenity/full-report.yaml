      - number: '2.2'
        title: Buyers, users, and platform surfaces
        blocks:
          - type: paragraph
            body: >-
              The buyer map is cross-functional because the underlying risk is cross-functional. Security leaders care
              about policy enforcement, identity teams care about privilege and ownership, SecOps cares about detection
              and response, compliance teams care about traceability, and AI-platform owners care about deployment
              friction. The main deployment surfaces are now obvious enough to anchor the market. Microsoft Copilot and
              Microsoft security products set buyer expectations for native controls inside the Microsoft estate.
              Salesforce markets Agentforce as a low-code autonomous-agent platform already used at broad scale.
              ServiceNow markets an entire AI-agent stack with Agent Studio, Agent Fabric, and AI Control Tower. AWS
              AgentCore, OpenAI's agent tools, Claude Enterprise, and Vertex AI Agent Builder extend the market into
              cloud and model-native workflows. This platform sprawl is why Zenity and its peers market cross-platform
              coverage rather than single-vendor point solutions.
