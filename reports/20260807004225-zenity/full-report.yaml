      - number: '5.3'
        title: Technical differentiation and research loop
        blocks:
          - type: paragraph
            body: >-
              Zenity's clearest technical differentiation claim is that the core risk of agentic AI is unauthorized
              action rather than prompt text alone. The intent-aware-detection and unauthorized-action essays push
              buyers toward a control model based on what an agent is trying to do, what it can access, and whether
              policy should allow, modify, or block the action. Public research strengthens that argument. Work on
              Copilot Studio vulnerabilities, coding-agent attack surface, browser-agent attacks, and broader governance
              blind spots shows that the company is trying to derive product direction from real exploit paths. That
              does not prove production depth by itself, but it does make the architecture feel grounded in how agents
              fail in practice. External risk taxonomies such as OWASP's LLM Top 10 help explain why this framing
              resonates: excessive agency, insecure plugin or tool use, and indirect prompt abuse all become materially
              more dangerous once agents can take actions on behalf of users or systems.
