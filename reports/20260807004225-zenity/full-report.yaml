  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and control layers
        blocks:
          - type: paragraph
            body: >-
              Zenity does not sit in the broadest possible AI-security market. The better boundary is the enterprise
              control layer for discovering, governing, constraining, and auditing what AI agents can access and what
              actions they take across business systems. Zenity's own product taxonomy is useful here: AISPM defines the
              posture layer, AI Observability defines the discovery layer, AI Detection and Response defines the runtime
              layer, agentic IAM defines the identity layer, and MCP security extends the surface to model-context and
              tool-call interactions. This boundary should include SaaS, cloud, and endpoint agents because that is how
              the company itself frames the problem. It should exclude generic model hosting, plain productivity
              software, and ordinary cybersecurity products unless they explicitly manage agent behavior. Framed this
              way, the category is not a narrow prompt filter niche and not a catch-all AI umbrella; it is a
              control-plane market growing around agent autonomy.
            claimRefs:
              - CM001
