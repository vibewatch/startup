companyProfile:
  summary: >-
    Zenity is an Israeli-founded AI-agent security company created by Ben Kliger and Michael Bargury after their
    Microsoft cloud-security experience exposed governance blind spots in automations and later agentic systems. Public
    materials show a company that evolved from low-code and automation security into a cross-platform control layer for
    enterprise AI agents, combining posture management, observability, runtime detection and response, agentic IAM, and
    MCP security. By August 2026, Zenity had raised a $125 million Series C, described itself as serving predominantly
    Fortune 500 and Global 2000 customers, disclosed 230+ employees, and built visible routes into Microsoft, AWS,
    ServiceNow, and public-sector ecosystems. The market and product case look real; the remaining uncertainty is
    whether operating metrics and cap-table terms fully justify late-stage pricing.
