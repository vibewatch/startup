  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Zenity's public materials support an enterprise-software business model rather than project revenue or
              consumer monetization. The company repeatedly describes a security and governance platform sold to some of
              the world's largest enterprises, including Fortune 500, Global 2000, and regulated-sector customers.
              SoftBank Corp. is named explicitly, which suggests enterprise sales motions with meaningful contract value
              rather than broad self-serve usage. The revenue proof is still mostly narrative rather than numeric.
              Zenity says revenue tripled in each of the past two years and is on track to triple again in 2026, but it
