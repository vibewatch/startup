              - CV004
              - CV006
              - CV027
              - CV040
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The August 2026 Series C changes the valuation conversation because it almost certainly moved Zenity into
              late-growth pricing territory. SoftBank Vision Fund 2 participation, strong external coverage, and prior
              round history all point to a meaningful step-up, likely above the unicorn threshold. The caution is that
              the public record does not provide the cap-table detail or metric transparency required to know whether
              the price is merely ambitious or already stretched. Investors should therefore underwrite the entry off
              scenario tolerance, not round momentum. Late-stage rounds reward conviction, but they also punish
              investors who mistake scarcity value for underwriting quality. That distinction matters because big rounds
              can create social proof that overwhelms analysis. The right response is not skepticism for its own sake;
              it is insisting that the next tranche of diligence turns narrative strength into metric-backed confidence.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV029
              - CV032
          - type: table
            tableRef: TV003
