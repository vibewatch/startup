figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Zenity moved from a 2021 low-code security startup into a 2026 late-stage AI-agent security platform with strong
      financing and ecosystem milestones.
    data:
      items:
        - label: Founded
          date: 2021-04
          detail: Ben Kliger and Michael Bargury found Zenity around a Microsoft-informed security thesis.
        - label: Series A
          date: '2023-09-12'
          detail: $16.5M Series A led by Intel Capital validates early LCNC-security demand.
        - label: M12 strategic investment
          date: '2024-07-30'
          detail: Microsoft's venture arm invests and deepens ecosystem alignment.
        - label: Series B
          date: '2024-10-29'
          detail: $38M Series B co-led by Third Point Ventures and DTCP pushes total funding above $55M.
        - label: AWS AgentCore coverage
          date: '2025-12-02'
          detail: Zenity extends full-lifecycle security to Amazon Bedrock AgentCore.
        - label: FedRAMP In Process
          date: '2026-03-12'
          detail: Public-sector compliance milestone signals federal ambitions.
        - label: Gartner company to beat
          date: '2026-04-23'
          detail: Zenity announces Gartner recognition in AI agent governance.
        - label: Series C
          date: '2026-08-03'
          detail: >-
            $125M Series C led by Norwest brings total funding to about $185M and headcount disclosure to 230+
            employees.
    approximationNotes: null
    claimRefs:
      - CO002
      - CO005
      - CO006
      - CO018
