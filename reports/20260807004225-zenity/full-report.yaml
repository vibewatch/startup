      - number: '3.3'
        title: Distribution, research credibility, and switching dynamics
        blocks:
          - type: paragraph
            body: >-
              Distribution may matter more than feature checklists. Microsoft, ServiceNow, AWS, CyberArk, and Check
              Point can all approach the same buyer through existing contracts, installed systems, and broader security
              narratives. Zenity's $125 million Series C and 230-plus employee scale reduce credibility risk, but do not
              erase that asymmetry. Its strongest public offset is research credibility. The company has published
              exploit and vulnerability work around Copilot Studio and browser-agent attacks, which helps demonstrate
              that its competitive posture is grounded in how agents fail in practice. Even so, the public record still
              suggests a multi-homing future rather than a clean winner-take-all one. Buyers can rationally use native
              controls for first-party workflows while adding a specialist for cross-platform governance, especially if
              identity, policy, and runtime risks span multiple agent stacks.
