companyProfile:
  summary: >-
    Zenity is an Israeli-founded AI-agent security company created by Ben Kliger and Michael
    Bargury after their Microsoft cloud-security experience exposed governance blind spots in
    automations and later agentic systems. Public materials show a company that evolved from
    low-code and automation security into a cross-platform control layer for enterprise AI agents,
    combining posture management, observability, runtime detection and response, agentic IAM, and
    MCP security. By August 2026, Zenity had raised a $125 million Series C, described itself as
    serving predominantly Fortune 500 and Global 2000 customers, disclosed 230+ employees, and
    built visible routes into Microsoft, AWS, ServiceNow, and public-sector ecosystems. The market
    and product case look real; the remaining uncertainty is whether operating metrics and cap-table
    terms fully justify late-stage pricing.
  foundedDate: '2021-04-01'
  founders:
    - name: Ben Kliger
      role: Co-founder & CEO
      background: Former Microsoft cloud-security leader with direct experience in automation and governance risk.
      claimRefs: [CO007, CO008]
    - name: Michael Bargury
      role: Co-founder & CTO
      background: Former Microsoft cloud-security leader and security researcher focused on governance blind spots in automations and agents.
      claimRefs: [CO007, CO008]
  foundingLocation: Tel Aviv, Israel
  headquarters: New York, United States
  productSummary: >-
    Zenity sells a cross-platform security and governance layer for enterprise AI agents, covering
    discovery, posture management, observability, runtime detection and response, identity and
    access controls, and model-context/tool-call governance across major enterprise agent stacks.
  customerFocus: >-
    Fortune 500, Global 2000, regulated enterprises, and public-sector buyers adopting copilots,
    low-code agents, and custom agent workflows across Microsoft, AWS, ServiceNow, Salesforce,
    OpenAI, and related ecosystems.
  businessModel: >-
    B2B SaaS platform sold to large enterprises through direct sales plus partner and marketplace
    channels, with pricing likely combining enterprise licenses and environment- or usage-based
    expansion tiers; exact pricing and contract structure remain undisclosed.
  stage: Series C private cybersecurity company / likely unicorn-threshold valuation
  fundingStatus: >-
    $16.5M Series A in 2023, strategic M12 financing in 2024, $38M Series B in 2024, and a $125M
    Series C announced on 2026-08-03 led by Norwest with SoftBank Vision Fund 2 and other major
    investors, taking cumulative funding to roughly $185M.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO007, CO008, CO010, CO011, CO013, CE002, CE027, CU011, CU023, CV001, CV003, CV009]
