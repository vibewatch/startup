  topStrengths:
    - Strong category timing around enterprise AI-agent governance, unauthorized-action risk, and cross-platform control needs.
    - Coherent product architecture spanning posture, observability, runtime response, identity controls, and MCP/tool governance.
    - Better public customer proof than many AI-agent startups, including named case studies and multi-channel enterprise procurement routes.
    - Blue-chip investor syndicate and external momentum signals suggest authentic enterprise relevance rather than a purely conceptual AI-security story.
  topRisks:
    - Public evidence still lacks ARR, retention, margin, and deployment-depth metrics needed to underwrite late-stage pricing confidently.
    - Native platform vendors such as Microsoft and ServiceNow can continue adding built-in governance features that compress differentiation.
    - Broad cross-platform scope raises execution burden, policy-complexity risk, and proof requirements across many ecosystems at once.
    - Large-round momentum may already embed premium expectations that only premium private metrics can justify.
  unresolvedGaps:
    - Current ARR, growth quality, gross margin, and burn-efficiency metrics remain undisclosed.
    - Public sources do not reveal cap-table terms, liquidation preferences, or detailed dilution overhang.
    - Retention, customer concentration, and cross-platform deployment depth are still too opaque for precise underwriting.
    - Public evidence does not yet prove that Zenity's product maturity is uniformly deep across every ecosystem it claims to secure.
