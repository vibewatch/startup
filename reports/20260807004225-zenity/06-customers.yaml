    - Not disclosed
    - Request current customer segmentation by platform and vertical
  - - Renewal / expansion metrics
    - Needed to judge stickiness
    - Not disclosed
    - Request gross and net retention plus expansion case studies
  - - Deployment depth by ecosystem
    - Needed to test breadth claims
    - Not disclosed
    - Request current production rollout references across Microsoft, AWS, ServiceNow, and public sector
  - - Concentration data
    - Needed to gauge revenue risk
    - Not disclosed
    - Request top-customer concentration and contract duration data
  notes: These are normal private-company gaps, but they are important because the current valuation narrative presumes durable enterprise adoption.
