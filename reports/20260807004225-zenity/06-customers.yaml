chapter:
  number: 6
  title: Customers
  summary: Zenity's public customer evidence is stronger than many early AI-agent startups because it includes named case studies, marketplace listings, and partner-led procurement routes into Microsoft, AWS, ServiceNow, and public-sector channels. The public record supports authentic early enterprise traction, but it remains too thin on retention, concentration, and deployment depth to judge customer quality with high confidence.
sections:
- id: customer-proof-and-named-logos
  title: Customer proof and named logos
  body: 'Zenity''s public customer evidence is real but selective. The strongest named proofs are the Varonis and Telit Cinterion case studies, which show that the company can point to concrete enterprise environments rather than relying entirely on anonymous pilots or conceptual endorsements. Those two references matter because they represent different workflow contexts: Varonis suggests governance-heavy data environments, while Telit Cinterion suggests operational complexity and industrial relevance. Together they do not prove broad market penetration, but they do clear the most basic diligence hurdle of whether any real customers exist in the field. Even so, two named logos should be read as proof of existence rather than proof of broad penetration across every target vertical. More references would materially improve confidence. The practical takeaway is that Zenity has crossed the threshold from hypothetical vendor to referenceable supplier, but it has not yet supplied enough named
    logos to make the roster itself a defensible moat.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU023
  - CU027
  - CU028
  - CU033
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: channel-and-procurement-coverage
  title: Channel and procurement coverage
  body: Zenity's customer-access story is broader than its named logo list. Microsoft solution listings, Azure Marketplace availability, AWS Marketplace availability, ServiceNow partnership signals, and the Carahsoft public-sector route all indicate a deliberate strategy to meet enterprise buyers where procurement already happens. That matters because AI-agent security is often purchased alongside existing cloud, productivity, service-management, or reseller relationships rather than as a cold-start standalone budget item. The result is a go-to-market posture that mixes direct enterprise selling with partner leverage. That mix is especially helpful in cybersecurity, where new categories often win faster when they can be attached to existing cloud, productivity, and reseller procurement motions instead of creating entirely new buying processes.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU015
  - CU016
  - CU017
  - CU018
  - CU021
  - CU022
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
- id: traction-signals-and-buyer-receptivity
  title: Traction signals and buyer receptivity
  body: The public traction narrative is supported more by market signals than by disclosed cohort metrics. Intel Capital, SiliconANGLE, and Calcalist all reinforce the idea that Zenity is already selling into Fortune 500 and Global 2000 contexts and growing quickly enough to justify a very large Series C. The Gartner “company to beat” framing likely helps as well, because enterprise buyers in emerging categories often need a trusted external label before they allocate meaningful time or budget. If taken at face value, revenue tripling implies demand is moving beyond experimentation, although the public set does not provide the customer-count detail needed to model that growth precisely. The pattern is consistent with an enterprise vendor that has broken through initial credibility barriers but is still early in disclosure maturity. Investors can therefore treat the growth signals as directionally encouraging without mistaking them for cohort-quality proof. For investors, this means the
    top-line narrative should be treated as supportive context for diligence, not as a substitute for customer-level evidence on expansion and concentration. The ceiling could still be much higher.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU019
  - CU020
  - CU030
  - CU031
  - CU032
  - CU035
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: customer-risks-and-diligence-gaps
  title: Customer risks and diligence gaps
  body: 'The caution is that most retained proofs are curated. Case studies, listings, channel announcements, and partner writeups are meaningful, but they do not answer the questions that matter most for predictability: how concentrated the customer base is, how much land-and-expand is happening, what renewal behavior looks like, and how deeply current customers have rolled Zenity across agent ecosystems. That leaves a balanced verdict. Zenity appears to have authentic enterprise traction and channel credibility, yet the public record is still too thin to judge retention quality or deployment depth with confidence. Regulatory concern about AI misuse reinforces that caution: buyers may recognize the problem quickly while still expanding deployment stepwise until governance and compliance pathways harden. That can lengthen sales cycles or stretch land-and-expand timelines even for a category winner. In other words, public evidence supports relevance and momentum, but private diligence still
    has to do the heavy lifting on quality. That asymmetry is typical of strong but still-private enterprise software stories.'
  claimRefs:
  - CU013
  - CU014
  - CU024
  - CU025
  - CU026
  - CU029
  - CU034
  - CU036
