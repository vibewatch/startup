    - Narrative outruns economics
  - - Retention and expansion metrics
    - Needed to judge stickiness
    - Strong GRR/NRR and cross-platform expansion
    - Pilot-heavy or weak expansion
  - - Deployment-depth references
    - Needed to test execution quality
    - Named production rollouts across ecosystems
    - Thin or shallow deployments
  - - Cap table / preference detail
    - Needed to judge true entry risk
    - Clean terms with acceptable overhang
    - Complex seniority or investor-favoring structure
  notes: Without these asks answered, precision valuation work is premature.
