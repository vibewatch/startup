- id: exit-readiness-kill-triggers-and-final-stance
  title: Exit readiness, kill triggers, and final stance
  body: Zenity does not need to be IPO-ready today to be investable, but it does need to clear a higher diligence bar than a smaller earlier-stage company. The right final stance is therefore conditional. If diligence confirms strong retention, durable expansion, disciplined implementation, and an entry price that still leaves room for high-end returns, the deal remains attractive. If instead diligence shows shallow deployments, weak evidence behind the growth narrative, or a valuation already assuming best-in-class cyber economics, the price should be resisted or the deal declined. Premium narrative alone is not enough. The valuation answer should therefore remain conditional until private evidence closes the largest gaps. A good outcome from diligence would not just confirm that Zenity is exciting; it would show that the business quality underneath the excitement is strong enough to justify a disciplined premium. If that proof does not appear, patience is the better investing behavior.
