- id: financing-context-and-entry-discipline
  title: Financing context and entry discipline
  body: The August 2026 Series C changes the valuation conversation because it almost certainly moved Zenity into late-growth pricing territory. SoftBank Vision Fund 2 participation, strong external coverage, and prior round history all point to a meaningful step-up, likely above the unicorn threshold. The caution is that the public record does not provide the cap-table detail or metric transparency required to know whether the price is merely ambitious or already stretched. Investors should therefore underwrite the entry off scenario tolerance, not round momentum. Late-stage rounds reward conviction, but they also punish investors who mistake scarcity value for underwriting quality. That distinction matters because big rounds can create social proof that overwhelms analysis. The right response is not skepticism for its own sake; it is insisting that the next tranche of diligence turns narrative strength into metric-backed confidence.
  claimRefs:
  - CV008
  - CV009
  - CV010
  - CV011
  - CV014
  - CV029
  - CV032
  tableRefs:
  - TV003
  figureRefs:
  - FV002
- id: scenarios-and-comparable-lens
  title: Scenarios and comparable lens
  body: 'A scenario approach is the only defensible valuation method here. In the bull case, Zenity becomes the independent control layer for enterprise AI agents and grows into top-tier cyber quality metrics. In the base case, it becomes a meaningful category leader but needs time to prove revenue quality and deployment depth. In the bear case, native platforms narrow the wedge or customers expand more slowly than the market narrative assumes. Public comps such as CrowdStrike and Zscaler set the premium end of the range, while Palo Alto, Okta, Cloudflare, and Fortinet provide more conservative anchors. The lesson is not that Zenity deserves any specific public-company multiple today, but that entry discipline should tighten as proof gets thinner. Even within established public-security names, valuation bands move materially as markets re-rate growth quality, which is another reason to underwrite Zenity with humility. Scenario discipline also helps avoid a common late-stage mistake: reverse-engineering
    a valuation from the round and then looking for comps to justify it. Here, the more defensible method is to let proof depth determine where Zenity belongs on the premium-to-conservative spectrum.'
  claimRefs:
