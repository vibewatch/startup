  topStrengths:
    - 企业 AI 智能体治理、未授权动作风险和跨平台控制需求同时升温，品类窗口很好。
    - 产品架构连贯，覆盖态势、可观测性、运行时响应、身份控制以及 MCP / 工具治理。
    - 公开客户证据强于不少 AI 智能体创业公司，既有具名案例，也有多渠道企业采购路径。
    - 一线投资人组合和外部动能信号说明，Zenity 不是纯概念 AI 安全故事，而是真有企业相关性。
  topRisks:
    - 公开证据仍缺 ARR、留存、毛利和部署深度指标，不足以让人有把握地支撑后期轮定价。
    - Microsoft、ServiceNow 等原生平台厂商可以继续内置治理功能，挤压 Zenity 的差异化。
    - 跨平台范围很宽，执行负担、策略复杂度和多生态同时举证的压力都会上升。
    - 大额融资动能可能已经计入高溢价预期，只有同样高质量的私有指标才能消化。
  unresolvedGaps:
    - 当前 ARR、增长质量、毛利率和烧钱效率指标仍未披露。
    - 公开资料没有揭示股权结构条款、清算优先权或详细稀释压力。
    - 留存、客户集中度和跨平台部署深度仍然过于不透明，无法精确承保。
    - 公开证据还不能证明，Zenity 在其声称保护的每个生态里都有同样深的产品成熟度。
