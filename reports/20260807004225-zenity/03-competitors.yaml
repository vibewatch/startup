- id: TP005
  title: Moat / anti-moat table
  columns:
  - Argument
  - Support level
  - Why it holds or fails
  - What would change the view
  rows:
  - - Cross-platform action-layer depth is a moat
    - Supported
    - Zenity markets several major ecosystems rather than one native stack
    - Win/loss evidence showing real displacement
  - - Research output deepens trust
    - Supported
    - Copilot Studio and browser-agent research are tangible proof points
    - Customer proof that research leads to commercial preference
  - - Bundling pressure is manageable
    - Weakly supported
    - Incumbents and natives visibly overlap on the same buyer narrative
    - Evidence that buyers reject native-only stacks in practice
  - - Category ownership will remain specialist-led
    - Weakly supported
    - Consolidation and native-platform moves make ownership unsettled
    - Multiple years of renewal, expansion, and platform displacement data
  notes: The moat debate is really a debate about whether cross-platform governance becomes a system of record or a temporary gap filler.
