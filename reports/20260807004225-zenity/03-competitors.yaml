- id: TP003
  title: Native-platform and incumbent pressure table
  columns:
  - Vendor
  - Why it reaches the buyer
  - What it can bundle
  - Risk to Zenity
  rows:
  - - Microsoft
    - Existing M365 and security footprint
    - Copilot-native controls and procurement ease
    - Can become the default for Microsoft-centric shops
  - - Salesforce
    - CRM system of record and Agentforce builder
    - Workflow-native agent creation and guardrails
    - Can own sales / service use cases first
  - - ServiceNow
    - Workflow platform plus AI Control Tower
    - Governance, orchestration, and SecOps adjacency
    - Can argue that one control tower is enough
  - - AWS
    - Cloud infrastructure and AgentCore
    - Developer-adjacent agent infrastructure and security hooks
    - Can win cloud-native builds by default
  - - CyberArk / Check Point
    - Broad enterprise security trust
    - Identity and platform-suite bundling
    - Can absorb category budgets into larger programs
  notes: Bundling pressure comes from trust and contract position as much as from raw feature overlap.
