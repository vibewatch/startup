  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: Customer-level win/loss data against Microsoft-native, identity-native, and specialist rivals.
    whyItMatters: Without replacement and renewal evidence, competitive narratives remain homepage-level rather than underwriting-grade.
    diligencePath: Request win/loss analysis, displacement case studies, and renewal cohorts.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
    - TP005
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Discounting, seat or usage economics, and contract-minimum data across the competitive set.
    whyItMatters: Pricing power and switching-cost conclusions are weak without commercial data.
    diligencePath: Collect pricing sheets, benchmark proposals, and procurement feedback.
    relatedQuestionRefs:
    - QP019
    - QP024
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: minor
    topic: category-ownership
    missingEvidence: Evidence showing whether enterprises prefer a specialist system of record or a layered multi-vendor stack.
    whyItMatters: The market may support coexistence for years, but public evidence is still too thin to call a durable architecture winner.
    diligencePath: Interview customers using more than one agent-security or identity-governance tool.
