chapter:
  number: 3
  title: Competitors
  summary: Zenity competes in a crowded but still immature field that includes startup specialists, identity-led vendors, broad cybersecurity suites, and native platform providers. Its strongest public differentiation is cross-platform action-layer governance backed by research credibility, while its biggest risk is cumulative bundling pressure from platform and identity incumbents.
sections:
- id: landscape-and-cohorts
  title: Landscape and competitor cohorts
  body: 'Zenity competes in a landscape that is broader than a startup short list. The most direct specialists are Prompt Security, Lakera, Oasis, Noma, and Astrix, but the real enterprise buying motion also includes identity incumbents such as CyberArk, broad cyber platforms such as Check Point, and native application or infrastructure vendors such as Microsoft, Salesforce, ServiceNow, and AWS. This means buyers are not choosing from one clean category. They are choosing among different control philosophies: prompt hardening, runtime enforcement, identity governance, workflow-native orchestration, and broad platform bundling. The practical takeaway is that Zenity should be analyzed by function rather than by label. Its most immediate competitive threat comes from vendors that overlap on cross-platform governance or action-layer control, not from every company that uses the phrase AI security on its homepage. That is why simplistic market maps understate the real challenge. A Fortune 500
    buyer can shortlist one specialist, one identity vendor, and one native platform team without feeling inconsistent, because each is solving a different slice of the same control problem.'
  claimRefs:
  - CP001
  - CP002
  - CP008
  - CP009
  - CP010
  - CP036
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: specialists-vs-identity-vs-native-platforms
  title: Specialists vs identity-led vendors vs native platforms
  body: The specialists overlap heavily in language but not perfectly in emphasis. Prompt Security leans toward skills, drift, and auditing; Lakera toward low-latency runtime defense; Noma toward end-to-end policy and monitoring; Oasis toward AI agents plus non-human identity; Astrix toward discover-secure-deploy with least-privileged access. CyberArk pushes identity as the control plane for the AI enterprise, while Check Point folds AI governance into a broader cyber platform. Native-platform vendors raise a different kind of threat because their advantage is not only features; it is trust, procurement access, and default distribution. Microsoft, Salesforce, ServiceNow, and AWS all expand the agent surface while also offering governance language of their own. Zenity's public response is to claim cross-platform coverage and action-layer depth, especially where enterprise agents span more than one platform at once.
  claimRefs:
  - CP003
  - CP004
  - CP005
