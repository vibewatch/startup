  - FP003
- id: moat-durability-and-adverse-read
  title: Moat durability and the adverse read
  body: 'The best moat argument Zenity can currently make is not that it faces little competition, but that it is one of the few vendors trying to combine cross-platform discovery, identity context, and action-layer governance into a coherent operating model. The weakest moat argument is that bundling pressure will not matter. Public evidence shows consolidation and overlap everywhere: Astrix is now part of Cisco, CyberArk extends agentic identity controls, Check Point builds AI governance into a broad suite, and every major agent platform is adding native controls. The competitive read should therefore stay two-sided. Zenity appears credible enough to make enterprise shortlists, and the market is immature enough that no architecture has obviously won. But the same immaturity means pricing power, switching costs, and long-term category ownership remain unproven without win/loss evidence. In practice, the near-term outcome may be layered adoption: enterprises could standardize on one or two
    native platforms, add one specialist above them for independent governance, and still keep an identity-centric tool for privileged access. That scenario would preserve demand while limiting scarcity premiums.'
