evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: Explicit Series C valuation, any secondary component, and preference stack terms.
    whyItMatters: >-
      Recommendation quality in later chapters depends on whether a unicorn valuation is implied by price or by
      narrative only.
    diligencePath: Request cap table, term sheet summary, and financing memo.
    relatedQuestionRefs:
      - QO019
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Full board roster, committee structure, investor-control provisions, and succession planning.
    whyItMatters: Founder quality is visible, but governance quality cannot be judged from the public record alone.
    diligencePath: Request board materials, governance policies, and current board composition.
    relatedQuestionRefs:
      - QO020
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Absolute ARR, revenue, NRR, and customer-count disclosure beyond broad growth and cohort language.
    whyItMatters: The company uses strong momentum language, but later financial and valuation chapters need hard denominators.
    diligencePath: Request audited ARR bridge, customer counts, and retention metrics.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: Reconcile the 230+ employee disclosure with third-party databases still listing a 51–200 band.
    whyItMatters: It does not change the strategic story, but it is a signal that external databases lag current scale.
    diligencePath: Confirm current headcount by geography and function in management materials.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-gaps
    missingEvidence: Public attach rates, ACVs, and budget ownership data by deployment surface.
    whyItMatters: Without pricing and win-rate data, market urgency cannot be converted into a robust SAM or SOM model.
    diligencePath: Request customer pipeline segmentation, ACV data, and win/loss analysis by platform.
    relatedQuestionRefs:
      - QM022
      - QM023
      - QM024
    relatedTableRefs:
      - TM005
  - type: stale
    severity: minor
    topic: survey-neutrality
    missingEvidence: A fully vendor-neutral longitudinal benchmark for AI-agent incidents and governance maturity.
    whyItMatters: >-
      The CSA study is valuable but commissioned by Zenity, so it should be pressure-tested against independent
      multi-year data.
    diligencePath: Look for insurer, analyst, regulator, or MSSP benchmarks not commissioned by a single vendor.
    relatedQuestionRefs:
      - QM011
      - QM013
      - QM025
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Internal data showing whether AI-agent security lands in IAM, AppSec, SecOps, or dedicated AI-governance budgets.
    whyItMatters: Budget ownership determines both market size and the durability of independent-vendor spend.
    diligencePath: Interview security buyers and inspect current pipeline ownership patterns.
    relatedQuestionRefs:
      - QM005
      - QM021
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: Customer-level win/loss data against Microsoft-native, identity-native, and specialist rivals.
    whyItMatters: >-
      Without replacement and renewal evidence, competitive narratives remain homepage-level rather than
      underwriting-grade.
    diligencePath: Request win/loss analysis, displacement case studies, and renewal cohorts.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
      - TP005
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Discounting, seat or usage economics, and contract-minimum data across the competitive set.
    whyItMatters: Pricing power and switching-cost conclusions are weak without commercial data.
    diligencePath: Collect pricing sheets, benchmark proposals, and procurement feedback.
    relatedQuestionRefs:
      - QP019
      - QP024
    relatedTableRefs:
      - TP004
  - type: conflicting-data
    severity: minor
    topic: category-ownership
    missingEvidence: Evidence showing whether enterprises prefer a specialist system of record or a layered multi-vendor stack.
    whyItMatters: >-
      The market may support coexistence for years, but public evidence is still too thin to call a durable architecture
      winner.
    diligencePath: Interview customers using more than one agent-security or identity-governance tool.
    relatedQuestionRefs:
      - QP018
      - QP025
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited ARR, absolute revenue, gross margin, burn, runway, retention, and customer concentration.
    whyItMatters: >-
      These are the minimum denominators required to underwrite a private security company rather than just admire
      momentum.
    diligencePath: Request audited financial package and cohort reporting.
    relatedQuestionRefs:
      - QI011
      - QI015
      - QI019
      - QI024
      - QI025
    relatedTableRefs:
      - TI002
      - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-and-packaging
    missingEvidence: Pricing tiers, contract length, services mix, and revenue-recognition policy.
    whyItMatters: Without commercial structure, it is hard to infer sales efficiency or gross-margin durability.
    diligencePath: Request standard order forms, price lists, and bookings-to-revenue bridges.
    relatedQuestionRefs:
