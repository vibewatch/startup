  topStrengths:
    - >-
      Lumilens is attacking a real AI-cluster bottleneck in optical interconnects, not a speculative edge case, and
      market demand is moving in its direction.
    - >-
      Public product evidence is better than usual for a young hardware startup, with a multi-layer LumiCore roadmap and
      claims of qualified production shipping.
    - >-
      The company has unusually strong capital support, having raised more than $900M only about two years after
      formation.
    - >-
      Repeat-founder credibility and prior exits by Ankur Singla improve the odds of customer access, recruiting, and
      follow-on financing support.
    - >-
      Supplier-side corroboration from POET adds independent support that the commercial ramp is more substantive than a
      pure stealth narrative.
  topRisks:
    - >-
      Public customer proof is still concentrated around one unnamed anchor hyperscaler, leaving diversification and
      repeatability largely unproven.
    - >-
      No public revenue, gross margin, burn, backlog conversion, or retention data is available to underwrite the
      current valuation with operating evidence.
    - >-
      Manufacturing scale-up, yield, serviceability, and quality execution are critical hardware risks that remain only
      partially visible in public.
    - >-
      NVIDIA, Broadcom, Marvell, and other incumbent ecosystems can slow adoption even if Lumilens has attractive
      technology.
    - >-
      Private-round downside terms, liquidation preferences, and dilution mechanics remain undisclosed, which limits
      true return underwriting.
  unresolvedGaps:
    - >-
      Customer-level revenue, gross margin, burn, and cash-runway disclosures needed to connect strategic narrative to
      operating economics.
    - >-
      Clear evidence on whether the anchor program is expanding into multiple production accounts or remains one
      concentrated relationship.
    - Field reliability, yield, MTBF, and serviceability data across pluggable, NPO, and CPO deployments.
    - >-
      Cap-table waterfall, liquidation preferences, employee refresh needs, and other terms required for precise
      downside and exit modeling.
    - >-
      Objective proof of adoption versus incumbent alternatives such as NVLink, Ethernet, InfiniBand, and
      merchant-optics offerings.
