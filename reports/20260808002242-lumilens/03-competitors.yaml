  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Real price sheets, discounting norms, and cost-per-link comparisons across Lumilens
      and peers.
    whyItMatters: Without pricing data, the capability comparison cannot translate into a revenue-share
      or margin view.
    diligencePath: Request customer or vendor quotes and compare fully loaded cost per link for pluggables
      and native optics.
    relatedQuestionRefs:
    - QP010
    - QP015
    - QP020
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: head-to-head-win-rate
    missingEvidence: Actual RFP outcomes or design-win data versus Ayar, Lightmatter, and incumbent optical
      suppliers.
    whyItMatters: Strategic narratives are less useful than evidence of who customers pick in real procurement
      processes.
    diligencePath: Request design-win history, lost-deal reasons, and competitor references from management.
    relatedQuestionRefs:
    - QP011
    - QP025
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: reliability-benchmarks
    missingEvidence: Comparative field failure rates, serviceability metrics, and yield curves across
      the competitive set.
    whyItMatters: Trust and repair economics are likely to decide adoption speed for deeper optical integration.
    diligencePath: Request qualification reports, MTBF data, and RMA trends from Lumilens and any available
      customer pilots.
    relatedQuestionRefs:
    - QP019
    - QP024
    relatedTableRefs:
    - TP002
    - TP004
  - type: stale
    severity: minor
    topic: incumbent-roadmaps
    missingEvidence: Current 2026-2028 roadmaps from Broadcom, Nvidia, Cisco, and other incumbents for
      optical integration.
    whyItMatters: Incumbent moves can narrow Lumilens' strategic window faster than startup funding updates
      imply.
    diligencePath: Refresh roadmaps quarterly using OFC, GTC, Hot Chips, and investor disclosures.
    relatedQuestionRefs:
    - QP014
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: partner-boundaries
    missingEvidence: Clear boundaries between competitors, partners, and suppliers across the optical
      stack.
    whyItMatters: The same company can be partner, supplier, and competitor at different layers, changing
      moat analysis.
    diligencePath: Map each key relationship by layer of the stack and commercial dependence.
    relatedQuestionRefs:
    - QP005
    relatedTableRefs:
    - TP001
