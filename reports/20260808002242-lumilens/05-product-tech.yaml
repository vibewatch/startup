chapter:
  number: 5
  title: Product & Technology
  summary: Lumilens presents a coherent product-and-technology story built around the LumiCore platform,
    spanning pluggable scale-out optics today and NPO/CPO scale-up products over time. Public evidence
    is strongest on architecture intent, manufacturing ambition, and early shipping claims; it is weaker
    on formal reliability metrics, certifications, exact SKU detail, and independently measured field
    performance.
sections:
- id: definition
  title: Product definition and portfolio
  body: 'Lumilens is best understood as a hardware platform company for AI-cluster connectivity rather
    than as a single optics module vendor. In public materials it defines two customer jobs. The first
    is scale-out: replacing or augmenting conventional copper-linked rack and row interconnects with pluggable
    optical transceivers at 800G, 1.6T, and beyond. The second is scale-up: moving optics closer to the
    GPU with near-package and co-packaged designs so a tightly coupled training domain can extend beyond
    copper’s physical limits. That framing matters because it puts Lumilens in both the near-term transceiver
    market and the longer-horizon native-optics roadmap.


    The product logic is tied together by LumiCore, the common platform the company says spans silicon
    photonics, mixed-signal ICs, electrical-optical interposers, and optical systems. Publicly, LumiCore
    looks less like a consumer-facing SKU and more like the design and manufacturing base from which multiple
    product families are derived. The result is a portfolio story built around reusing technical modules
    across multiple deployment surfaces instead of winning only one form factor.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
