- id: architecture
  title: Architecture and operating model
  body: 'Architecturally, Lumilens claims control over the most difficult layers of the optical interconnect
    stack. Silicon photonics is named as the core medium, but the company also emphasizes mixed-signal
    ICs and electrical-optical interposers, suggesting that the value proposition sits at the electrical/optical
    boundary as much as in the optics themselves. That is consistent with the market problem: the hardest
    part of scaling AI clusters is not merely moving light through fiber, but packaging, routing, powering,
    and qualifying optical links in a way that hyperscalers can deploy at enormous volume.


    The manufacturing narrative reinforces that interpretation. Lumilens highlights process recipes, robotics,
    calibration, manufacturing execution systems, and custom test automation. Those claims imply an operating
    model closer to advanced systems manufacturing than to a fabless chip startup that outsources most
    productization friction. The POET relationship further suggests Lumilens is willing to combine in-house
    architecture with partner-supplied optical-engine capability when that speeds the overall platform
    ramp.'
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
