  - - Quality / manufacturing execution
    - Yield, reliability, or field-performance data
    - Material shortfall or missing data at ramp stage
    - Treat as thesis-break until resolved
  - - Supplier dependence
    - POET / partner scale progression
    - Supplier ramp stalls or becomes inconsistent with customer narrative
    - Assume delivery risk rising faster than demand
  - - Regulatory / export posture
    - New control or procurement requirement
    - Rule change that constrains target accounts or shipping pathways
    - Re-underwrite TAM and go-to-market scope
  - - Financial risk
    - Future financing terms
    - Down round or bridge financing without stronger commercial proof
    - Treat valuation and runway thesis as impaired
  notes: These kill criteria are intended to be monitorable and linked directly to investment implications
    rather than abstract concern statements.
