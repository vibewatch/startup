  - FR003
- id: people-mitigation
  title: People risk, mitigations, and kill criteria
  body: 'People, mitigation, and kill criteria tie the risk picture together. Lumilens benefits from repeat-founder
    credibility and a technically relevant leadership bench, which meaningfully helps with recruiting
    and strategic access. The size of the financing round also buys time. Those are real mitigants. But
    they do not eliminate the need for evidence. The key mitigations still have to show up in the form
    of customer expansion, stable supplier scale, and measurable quality data.


    The most important thesis-break triggers are therefore operational and commercial, not macroeconomic.
    If Lumilens cannot broaden beyond one anchor account, if quality data fails to support production
    scaling, or if regulatory constraints suddenly narrow the delivery path, the downside could appear
    quickly. Investors should monitor these as hard signals, not as abstract possibilities. Public evidence
    therefore supports a disciplined, practical monitoring framework: ask what changed in account breadth,
    quality metrics, supplier stability, and compliance readiness every quarter, and let those answers—not
    generic excitement about AI infrastructure—drive the risk rating.'
  claimRefs:
