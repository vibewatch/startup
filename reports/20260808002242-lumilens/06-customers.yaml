- id: retention
  title: Retention, repeat usage, and durability gaps
  body: 'Named customer proof remains the central weakness. The customer is not named, does not speak
    publicly, and does not provide a case study or performance metric. There is no public procurement
    record, no reference architecture jointly branded with Lumilens, and no public renewal or expansion
    disclosure. The best corroboration instead comes from the supplier side: POET disclosed an initial
    $50 million order and a larger framework that could scale much further if the customer ramp continues.
    That gives the public market some confidence that deployment is not fictional, but it still leaves
    major ambiguity around pace, breadth, and durability.


    Retention and satisfaction are even less visible. No NRR, GRR, churn, renewal cadence, contract term,
    or customer satisfaction metric is disclosed. The strongest durability proxies are indirect: production
    status is harder to reverse than a lab demo, and a supplier framework implies planned continuation
    beyond a one-off evaluation. Those are useful signals, but they are not substitutes for customer-cohort
    data.'
  claimRefs:
  - CU013
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU033
  - CU034
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion
  title: Expansion potential and concentration risk
  body: 'Expansion and concentration are the two sides of the same coin for Lumilens. The upside case
    is obvious: once a hyperscaler qualifies a connectivity platform, the program can expand by cluster
    generation, rack count, bandwidth tier, and eventually by architecture layer from pluggables into
    deeper optical integration. The downside is just as clear: if the current anchor account slows, narrows
    scope, or chooses an incumbent alternative, the public customer story could weaken very quickly because
    there is no disclosed diversified base to cushion the blow.


    Independent market and competitive sources reinforce that tension. Demand for AI optical networking
    is real and expanding, but customers also have other paths: InfiniBand, Ethernet fabrics backed by
    large incumbents, and competing optical-interconnect vendors. Procurement friction is therefore likely
    to stay high even in a favorable demand environment. The correct interpretation is not that Lumilens
    lacks customer proof. It is that the proof is strategically meaningful yet still concentrated, opaque,
    and incomplete.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
