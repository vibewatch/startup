- id: sizing-lenses
  title: Sizing lenses, geographies, and growth rates
  body: 'The sizing evidence supports a market that is already meaningful and still accelerating. TBRC
    projects AI data-center networking from $12.8 billion in 2026 to $30.17 billion by 2030, while DataM
    projects optical interconnects in AI data centers from $9.94 billion in 2025 to $31.04 billion in
    2033. TrendForce adds a narrower but very useful lens: AI-focused optical transceivers alone could
    reach $26 billion in 2026 as 800G and 1.6T links ramp. Goldman Sachs'' optical-networking framework
    is even more aggressive, framing a $154 billion AI-driven optical opportunity with the largest value
    pool in scale-up fabrics.


    Those lenses should not be averaged together mechanically because each boundary is different. The
    pragmatic takeaway is that Lumilens does not need the broadest TAM to justify attention. Even the
    conservative optical-specific lenses imply multibillion-dollar annual spend, and Lumilens'' own $100+
    billion framing is directionally consistent with the idea that optical content per cluster rises sharply
    as AI systems move from thousands toward tens of thousands of accelerators. The right diligence question
    is therefore not whether the market exists, but which part of that stack Lumilens can realistically
    win first and at what speed customers will move from pluggables to NPO and CPO.'
