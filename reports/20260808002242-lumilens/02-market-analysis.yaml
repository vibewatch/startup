  - type: private-evidence-only
    severity: material
    topic: lumilens-sam
    missingEvidence: Product-by-product serviceable market by customer segment, geography, and time horizon.
    whyItMatters: Public TAMs are too broad to prove whether Lumilens can convert market size into a winnable
      wedge.
    diligencePath: Request management's bottoms-up SAM/SOM model by product line and target account set.
    relatedQuestionRefs:
