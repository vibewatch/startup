    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: Pricing per pluggable, per optical engine, and expected delta between NPO and CPO
      deployments.
    whyItMatters: Adoption speed alone does not determine outcomes if pricing or margins collapse as the
      market scales.
    diligencePath: Request price lists, expected ASP curves, and margin waterfalls by product family.
    relatedQuestionRefs:
    - QM011
    - QM020
    relatedTableRefs:
