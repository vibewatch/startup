    severity: minor
    topic: tam-boundaries
    missingEvidence: A reconciled taxonomy across TBRC, DataM, TrendForce, and Goldman-style market lenses.
    whyItMatters: Investors can easily overstate market size by mixing non-comparable categories.
    diligencePath: Create one internal taxonomy that normalizes what is included in each source and maps
      Lumilens products against it.
