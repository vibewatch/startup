      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is a central part of the Lumilens story. Multiple 2026 profiles describe Ankur Singla
              as a repeat infrastructure founder whose earlier companies Contrail Systems and Volterra were acquired by
              Juniper Networks and F5 respectively. F5's January 2021 completion notice gives external confirmation that
              one of those exits reached close. Just as important, Mayfield said it backed Singla for the third time and
              led Lumilens from seed, indicating that existing infrastructure investors were willing to underwrite
              another deeply technical, capital-intensive build around the same founder.


              The operating bench is broader than a single founder, although public governance disclosure is still thin.
              Lumilens' website identifies Samuel Liu, Ted Schmidt, Ritesh Kapahi, and Dave Friedman as founders in
              product, technology, India operations, and operations roles respectively; it also names Weich Fang, Harish
              Devanagondi, and Mark Weiner in manufacturing, silicon engineering, and marketing. Public materials
              further claim the team draws from Cisco, Juniper Networks, Meta, Marvell, Lumentum, and Coherent. That
              breadth matters because Lumilens is not just designing chips: it is simultaneously building photonics,
              packaging, manufacturing operations, and hyperscaler-facing systems integration. The unresolved governance
              question is the board: no public source reviewed here discloses board composition or voting-control
              structure.
