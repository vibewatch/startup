chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and business model
        blocks:
          - type: paragraph
            body: >-
              Lumilens presents itself as a connectivity platform for AI infrastructure rather than a general-purpose
              photonics company. Its public materials consistently frame the company around one problem: very large AI
              clusters now fail first on network bandwidth, reach, and power rather than on raw GPU availability.
              Reuters described the company as San Jose-based when it covered the August 2026 financing, and Lumilens'
              own announcement says the company was founded in early 2024 and commercialized its first product in under
              two years. That combination places Lumilens in the rare category of a late-stage private hardware startup
              that reached production deployment before broad public launch.


              The company remains private and disclosure-light. It emerged from stealth only in August 2026, and public
              materials do not include audited financials, board composition, cap-table control terms, or precise
              customer counts. Even so, the core identity is clear: Lumilens sells optical interconnect hardware for
              both scale-out and scale-up AI networks, targeting hyperscalers that need to connect ever-larger GPU
              clusters with less power and lower latency than copper can support. In practical terms, the business is
              already beyond lab-stage concept risk, but it still sits well short of public-company transparency.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO032
