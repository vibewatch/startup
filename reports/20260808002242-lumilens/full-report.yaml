  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and what is actually public
        blocks:
          - type: paragraph
            body: >-
              Public financial disclosure around Lumilens is thin, but the revenue model is fairly clear. The company
              sells optical interconnect hardware into hyperscaler AI networks: pluggable transceivers today and, if
              adoption follows its roadmap, NPO and CPO over time. This is not a software-style recurring revenue story.
              Revenue recognition is likely tied to hardware qualification, production shipment, supplier ramp, and
              customer deployment timing. That distinction matters because public headlines about “multi-billion-dollar
              agreements” and “orders” do not tell us how much revenue is recognized today, how much is backlog, and how
              much is contingent on future milestones.


              What the public record does show is that Lumilens is already past pure research mode. The company says it
              is shipping into production AI data centers, and POET disclosed an initial $50 million purchase order plus
              a much larger multi-year supplier framework. Those data points support a real commercial ramp, but not a
              fully validated revenue-quality picture. Public sources still do not disclose revenue, ARR, customer
              count, or margin data.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI007
              - CI009
