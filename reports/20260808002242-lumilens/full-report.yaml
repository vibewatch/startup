  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and portfolio
        blocks:
          - type: paragraph
            body: >-
              Lumilens is best understood as a hardware platform company for AI-cluster connectivity rather than as a
              single optics module vendor. In public materials it defines two customer jobs. The first is scale-out:
              replacing or augmenting conventional copper-linked rack and row interconnects with pluggable optical
              transceivers at 800G, 1.6T, and beyond. The second is scale-up: moving optics closer to the GPU with
              near-package and co-packaged designs so a tightly coupled training domain can extend beyond copper’s
              physical limits. That framing matters because it puts Lumilens in both the near-term transceiver market
              and the longer-horizon native-optics roadmap.


              The product logic is tied together by LumiCore, the common platform the company says spans silicon
              photonics, mixed-signal ICs, electrical-optical interposers, and optical systems. Publicly, LumiCore looks
              less like a consumer-facing SKU and more like the design and manufacturing base from which multiple
              product families are derived. The result is a portfolio story built around reusing technical modules
              across multiple deployment surfaces instead of winning only one form factor.
