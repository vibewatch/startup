      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyer segmentation is unusually concentrated. Today, the primary buyer, user, and payer for Lumilens-style
              products is the hyperscaler or cloud operator designing AI clusters at pod or superpod scale. These
              operators care about three things at once: bandwidth density, power efficiency, and operational
              simplicity. In the near term, pluggable optics win because they fit existing operational models and
              already account for much of the market. In the medium term, scale-up architectures pressure customers
              toward NPO and eventually CPO because copper-reach and power limits become the gating constraint inside
              tightly coupled domains.


              There are also second-order buyers and influencers. Switch and ASIC vendors, packaging partners,
              foundries, and standards bodies influence adoption because optical deployment depends on whole-system
              compatibility, not just one module's performance. The Ultra Ethernet Consortium exists precisely because
              AI workloads demand more from Ethernet than older congestion-control designs provided. That also explains
              why Lumilens targets both scale-out and scale-up. The adoption path is likely to start with pluggables
              where budgets already exist, then widen into custom optical fabrics where a hyperscaler is willing to
              redesign the node for more performance per watt.
            claimRefs:
              - CM016
              - CM017
              - CM019
              - CM020
              - CM026
              - CM027
              - CM028
              - CM038
