companyProfile:
  summary: >-
    Lumilens is a San Jose-based private optical networking startup founded in early 2024 to address AI-cluster
    connectivity bottlenecks. The company markets the LumiCore platform across pluggable optics, near-packaged optics,
    and co-packaged optics, aiming to improve bandwidth density and reduce copper-related constraints inside large GPU
    clusters. Public evidence supports unusually strong early external validation for a young hardware company: a $700M+
    Series C at a $5.51B valuation, more than $900M total capital raised, repeat-founder leadership from Ankur Singla,
    supplier-side corroboration from POET, and claims of production shipping into a large unnamed hyperscaler. The
    biggest remaining unknowns are economics, diversification, and private-round downside protection.
