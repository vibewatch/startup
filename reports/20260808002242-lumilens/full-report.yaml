  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Customer diversification stalls
        - No meaningful second program or visible account expansion
        - Bull case collapses toward base/bear
        - Do not add capital at current price
      - - Quality / yield evidence disappoints
        - Material reliability or yield concern surfaces
        - Execution narrative weakens quickly
        - Reprice toward bear case
      - - Down round without stronger proof
        - Next financing resets mark below current level
        - Price discipline thesis vindicated negatively
        - Avoid following without new information edge
      - - Policy / export friction rises materially
        - Controls or procurement rules narrow target accounts
        - TAM and speed-to-close fall
        - Re-underwrite market and exit assumptions
    notes: These are monitorable thesis-break conditions, not background risks.
    claimRefs:
      - CV027
      - CV028
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue / backlog by customer
        - Revenue, bookings, backlog conversion, and account mix
        - Core test of price support
        - Management + finance diligence
      - - Quality / yield package
        - Yield, MTBF, failure rates, and field acceptance data
        - Tests manufacturability and durability
        - Operations + engineering diligence
      - - Cap table / preferences
        - Liquidation stack, dilution, employee refresh needs
        - Tests real return math at exit
        - Legal + finance diligence
      - - Customer reference depth
        - Named accounts, scope, and expansion history
        - Tests whether anchor proof generalizes
        - Commercial diligence under NDA
      - - Supplier / capacity resilience
        - POET dependency, second sourcing, and manufacturing contingency
        - Tests delivery risk under growth
        - Supply-chain diligence
    notes: >-
      If these asks are answered positively, the recommendation can move; if they are answered poorly, the current mark
      becomes hard to defend.
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV045
