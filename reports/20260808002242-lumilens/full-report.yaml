      - number: '5.3'
        title: Deployment, integration, and maturity
        blocks:
          - type: paragraph
            body: >-
              Public deployment evidence is stronger than one might expect for a 2024-founded hardware company, but it
              is still uneven. Lumilens says its first scale-out product completed qualification and is shipping into
              production AI data centers by 2026, which is a meaningful maturity signal. It implies more than lab
              science: some blend of packaging, reliability testing, and customer acceptance had to occur. Even so, the
              public record still does not disclose the reliability artifacts hyperscaler buyers normally require, such
              as MTBF data, thermal-cycle results, field failure rates, or detailed qualification scorecards.


              That asymmetry defines the current maturity picture. The pluggable scale-out offering appears closest to
              revenue-bearing deployment. NPO and CPO remain the higher-upside, higher-risk roadmap layers. Independent
              sector sources broadly support that sequencing: co-packaged optics remains technically promising but
              operationally difficult, so nearer-term pluggables can serve as the bridge while tighter optical
              integration matures. In other words, Lumilens appears to have chosen a rational roadmap, but the public
              evidence still stops short of proving end-state reliability.
