      - number: '3.3'
        title: Substitutes, switching cost, and distribution power
        blocks:
          - type: paragraph
            body: >-
              The most powerful substitutes are not startups but incumbent stacks. Broadcom, Nvidia, and the wider
              Ethernet ecosystem can bundle adjacent silicon, fabrics, and optics into customer relationships that
              already exist. Ultra Ethernet matters here because it strengthens the open-Ethernet answer to AI
              networking without requiring customers to bet on a brand-new vendor. Likewise, incumbents in pluggable
              optics still possess proven manufacturing scale and service processes that startups cannot yet match
              publicly.


              For Lumilens, switching costs cut both ways. They are relatively low in standardized pluggables, where
              buyers can multi-home vendors and swap parts over time. They become much higher once optics are
              co-designed into a node or package, but that is also where customer hesitation rises because
              serviceability, yield, and field-repair economics become harder. In other words, the highest-moat zone is
              also the hardest zone to win quickly.
            claimRefs:
              - CP008
              - CP020
              - CP021
              - CP022
              - CP023
              - CP017
          - type: table
            tableRef: TP003
            claimRefs:
              - CP018
              - CP019
              - CP020
              - CP035
          - type: figure
            figureRef: FP003
            claimRefs:
