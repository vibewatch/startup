      - number: '3.2'
        title: Direct peers and startup positioning
        blocks:
          - type: paragraph
            body: >-
              Among direct peers, Ayar Labs is the cleanest benchmark. It raised $500 million in Series E at a $3.75
              billion valuation in March 2026 and publicly frames itself as production-ready for scale-up CPO.
              Lightmatter is a different type of comparator: its Passage platform pushes a photonic-interposer and
              systems vision closer to hyperscaler co-design than pure pluggables. Both companies signal that serious
              capital and ecosystem support are gathering around scale-up optics, which is the same high-value
              destination that Lumilens wants to reach.


              Lumilens' differentiation is breadth. Public materials suggest it wants to monetize current scale-out
              demand with pluggables while also giving hyperscalers a migration path into NPO and CPO. That is
              potentially stronger than a single-point product story if customers value one common stack across
              generations. But the same breadth also means Lumilens competes on more fronts at once, against players
              with deeper specialization or stronger incumbency.
            claimRefs:
