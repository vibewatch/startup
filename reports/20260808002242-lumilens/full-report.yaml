      - number: '1.4'
        title: Product snapshot, milestones, and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Lumilens' public product snapshot is coherent even if important operating metrics remain private. The
              company sells three closely related product families: pluggable transceivers for scale-out fabrics,
              near-package optics for interim scale-up deployments, and co-packaged optics for longer-term native
              optical GPU fabrics. All are built on the LumiCore platform, which Lumilens describes as a common stack of
              silicon photonics, mixed-signal ICs, electrical-optical interposers, and optical systems. The company also
              emphasizes manufacturability as a differentiator, claiming in-house ownership of process recipes,
              automation, test equipment design, and MES tooling for high-volume output.


              The milestone line is already meaningful. In May 2026 POET disclosed a joint development and supply
              agreement with Lumilens, including an initial $50 million purchase order and a roadmap from 800G and 1.6T
              pluggables toward NPO and CPO, with engineering samples planned for late 2026 and customer-aligned ramps
              in 2027. In August 2026 the company then emerged from stealth and publicized the hyperscaler customer
              agreement. What remains missing are the standard diligence metrics for a private company at this
              valuation: revenue, ARR, customer count, headcount, gross margin, cash burn, and board oversight. Those
              omissions do not erase the technical or commercial signal, but they materially reduce outside visibility
              into operating quality.
