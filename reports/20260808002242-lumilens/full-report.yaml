        - Most natural public-evidence case
      - - Bear
        - No diversification, quality slippage, or valuation reset in next financing
        - $2–4B outcome; capital impairment risk
        - Concentration, quality, and pricing collide
        - Material probability
      - - Upside optionality
        - Platform becomes strategic M&A or broader category winner
        - '>$14B possible but speculative'
        - Requires evidence not yet public
        - Low probability today
    notes: >-
      These are scenario estimates, not sourced market prices. They translate the current evidence pattern into rough
      decision ranges.
