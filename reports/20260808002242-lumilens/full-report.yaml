  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape structure and who really competes
        blocks:
          - type: paragraph
            body: >-
              Lumilens does not compete in a narrow one-product lane. The real landscape includes direct optical
              startups, incumbent networking vendors, merchant-silicon ecosystems, and the status quo of continually
              improving Ethernet and InfiniBand stacks. That matters because customers can solve the same scaling
              problem in very different ways: by buying more pluggable optics, by redesigning node architectures around
              optical engines, by leaning into proprietary fabrics, or by waiting for open Ethernet stacks to improve.
              The result is a market where the enemy is not just one named startup, but any architecture that postpones
              or redirects optical spend away from Lumilens' preferred path.


              Direct peers such as Ayar Labs and Lightmatter matter because they attack the same future value pool
              around deeply integrated optics. Incumbents such as Broadcom, Nvidia, Cisco, Coherent, and large
              transceiver vendors matter because they already own the qualification loops, distribution channels, and
              manufacturing relationships that startups must break into. The competitive question is therefore less “who
              has the cleverest photonics” and more “who can convert optical novelty into production-approved volume
              fastest.”
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP009
              - CP034
