              buyer would ultimately want.


              The legal/IP angle is similarly under-documented in the public record. No litigation or enforcement
              surfaced in this run, which is directionally positive, but the optical-interconnect ecosystem is crowded
              with incumbent suppliers and large patent estates. In a capital-intensive market, even a manageable IP
