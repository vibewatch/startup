      - number: '4.2'
        title: Cost structure, capex, and working capital
        blocks:
          - type: paragraph
            body: >-
              The operating model appears expensive by design. Lumilens repeatedly emphasizes proprietary interposers,
              process recipes, robotics, test automation, and high-volume manufacturing systems. That suggests a
              business with significant fixed-cost investment in process engineering, tooling, calibration, and supplier
              management. The same operating choices could become a source of attractive gross margin if they yield
              better throughput, lower defect rates, and reuse across pluggables, NPO, and CPO. But they also imply a
              heavier pre-revenue or early-revenue cost structure than investors might assume from a generic
              “semiconductor startup” label.


              Working capital is a particular issue. Optical hardware ramps require inventory, qualification cycles,
              supplier deposits, and staged manufacturing commitments before all customer cash is collected. POET's
              public framework is useful evidence: an initial $50 million order and a potential $500 million cumulative
              supplier relationship indicate that Lumilens must fund a real hardware ramp, not just software
              engineering.
