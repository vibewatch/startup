      - number: '4.3'
        title: GTM motion, traction proxies, and concentration
        blocks:
          - type: paragraph
            body: >-
              Demand conditions are favorable. TrendForce, TBRC, and other market sources all point to strong growth in
              AI optical and AI-networking spend, which means Lumilens is chasing a real budget line. However, the GTM
              motion is likely concentrated and long-cycle. Public evidence suggests a small number of hyperscaler
              accounts, engineering-led qualification, and direct commercial relationships rather than broad channel-led
              selling. That profile can create excellent economics if a design win becomes a standard, but it also means
              one delayed customer ramp can meaningfully affect near-term revenue quality.


              The same concentration shapes financial risk. With only one publicly disclosed anchor-customer
              relationship and no published customer-count data, outside investors cannot tell whether revenue is
              diversified or effectively single-account. It also makes CAC, payback, and channel-efficiency analysis
              effectively impossible from the outside, because the commercial model depends on a tiny set of strategic
              programs rather than many comparable deals. In other words, strong demand does not automatically translate
              into resilient financial quality.
