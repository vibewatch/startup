  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and who actually pays
        blocks:
          - type: paragraph
            body: >-
              The public customer story for Lumilens is unusually narrow but also unusually concrete for a young
              deep-tech hardware company. The buyer universe is not the broad enterprise market. It is a small set of
              hyperscalers and adjacent platform teams building very large AI clusters where connectivity has become a
              limiting factor. Public sources consistently describe Lumilens as selling into that environment:
              production AI data centers, multi-million-transceiver fabrics, and future GPU-domain expansion beyond
              copper limits. That means the relevant buyer is typically a networking, infrastructure, or
              platform-architecture team with very high technical standards and long qualification cycles.


              This also means customer segmentation is highly concentrated by design. The current public record supports
              one anchor segment with conviction: hyperscaler operators running production AI clusters. Secondary buyer
              segments are plausible — accelerator platform teams, future sovereign-AI operators, or HPC-scale buyers —
              but public proof there is much weaker. Investors should therefore think of Lumilens less as a diversified
              customer-base story and more as a strategic-account story where a small number of programs determine most
              of the commercial outcome.
