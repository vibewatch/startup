            body: >-
              Regulatory and legal risk is real but currently less immediate than concentration and manufacturing risk.
              Lumilens sells into advanced AI infrastructure, a category that increasingly sits near export-control,
              procurement, and compliance scrutiny. Federal Register materials and NIST guidance show a policy direction
              that is getting tighter, not looser, around advanced-computing systems and the security obligations of
              suppliers. Publicly, however, Lumilens discloses only baseline privacy and terms pages. Those pages show
