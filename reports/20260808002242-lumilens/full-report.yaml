  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked core risks
        blocks:
          - type: paragraph
            body: >-
              Lumilens’ risk profile is concentrated rather than diffuse. The company does not appear to face an obvious
              near-term liquidity crunch after raising more than $900 million. Instead, the biggest risks cluster around
              whether one or two highly strategic programs can be converted into durable, repeatable production
              business. The public record supports one anchor hyperscaler relationship, but it does not support a
              diversified customer base. That means customer concentration is not a side issue; it is central to the
              whole underwriting problem.


              The second major cluster is productization and manufacturing. Lumilens publicly emphasizes automation,
              calibration, process recipes, and high-volume manufacturing, which is strategically sensible. But it also
              means investors are being asked to trust complex operational systems before public yield, reliability, and
              field-failure data are disclosed. In infrastructure hardware, execution failure often arrives through
              quality, schedule, or supplier slippage rather than through lack of market demand. Lumilens is exposed to
              exactly that pattern.
