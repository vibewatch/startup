      - number: '4.4'
        title: Capital adequacy verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The balance-sheet verdict is cautiously positive on solvency and cautious-to-negative on transparency.
              More than $900 million of lifetime funding materially reduces immediate financing risk, and the
              use-of-funds language implies the Series C is intended to scale a business that already has commercial
              pull. Yet public disclosure still omits the metrics that matter most for judging whether the current
              valuation is financially justified: recognized revenue, gross margin, backlog conversion, burn, runway,
              and debt.


              Investors should therefore separate capital adequacy from financial quality. Lumilens probably has enough
              capital to keep building. That does not mean it has proved revenue durability or attractive unit
              economics. The real financial trigger for the next phase is whether production shipments, supplier ramps,
              and customer deployment schedules become auditable revenue and margin evidence rather than just
              strategically impressive announcements. Until that evidence appears, the correct stance is to treat the
              financing as risk-reducing but not thesis-closing.
