      - number: '2.4'
        title: Growth drivers, constraints, and the real adoption debate
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are clear: larger AI clusters, higher optical content per cluster, and the
              industry-wide need to beat copper's reach and power limits. Lumilens' own launch materials point to a
              400,000-GPU facility requiring millions of transceivers and millions of fiber strands, while market
              sources point to 800G and 1.6T demand ramping quickly. But the constraint side is just as important.
              ADTEK, SemiAnalysis, and the arXiv paper all stress that CPO is not a plug-in replacement; it is an
              architectural commitment with packaging, thermal, reliability, and serviceability consequences. DataM
              likewise notes that technical complexity and scale requirements push buyers toward proven manufacturing
              partners.


              That leaves Lumilens in an attractive but demanding position. The company is aimed at the right bottleneck
              and a market that is unquestionably large enough, but it still needs to prove where its serviceable market
              starts, how much of the value pool remains in pluggables versus native optical fabrics, and whether
              customers will accept the operational trade-offs of deeper optical integration on the timeline implied by
              a $5.51 billion valuation. The chapter therefore ends with a positive demand view but a cautious
              adoption-timing view.
