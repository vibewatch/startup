              Expansion and concentration are the two sides of the same coin for Lumilens. The upside case is obvious:
              once a hyperscaler qualifies a connectivity platform, the program can expand by cluster generation, rack
              count, bandwidth tier, and eventually by architecture layer from pluggables into deeper optical
              integration. The downside is just as clear: if the current anchor account slows, narrows scope, or chooses
              an incumbent alternative, the public customer story could weaken very quickly because there is no
              disclosed diversified base to cushion the blow.


              Independent market and competitive sources reinforce that tension. Demand for AI optical networking is
              real and expanding, but customers also have other paths: InfiniBand, Ethernet fabrics backed by large
              incumbents, and competing optical-interconnect vendors. Procurement friction is therefore likely to stay
              high even in a favorable demand environment. The correct interpretation is not that Lumilens lacks
