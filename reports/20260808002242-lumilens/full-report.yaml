  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Lumilens is easy to articulate. The company is attacking a real
              AI-infrastructure bottleneck, not a speculative convenience problem. Optical interconnect demand is
              rising, customers increasingly care about connectivity as much as compute, and Lumilens has already
              assembled more public product proof than many private deep-tech peers by claiming qualified production
              shipping and a supplier-backed ramp. If those signals expand into a broader customer base, Lumilens could
              become an unusually important private infrastructure platform globally.


              The anti-thesis is equally straightforward. At a $5.51 billion post-money valuation, the market is already
              pricing in a large fraction of that future success before public revenue, margin, or diversification data
              exists. One meaningful but opaque customer program is not the same thing as a fully underwritten
              commercial franchise. The public case is therefore strong enough to keep Lumilens on the radar, but not
              strong enough to accept the price without additional diligence.
