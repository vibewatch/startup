  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              The most useful market boundary for Lumilens is not “all data-center hardware” and not even “all optical
              networking.” Public sources consistently place the company in the AI data-center networking layer where
              very large GPU clusters need low-latency, high-bandwidth links between accelerators, switches, racks, and
              optical engines. That layer includes Ethernet or InfiniBand switching, NICs and DPUs, optical pluggables,
              optical engines, and the silicon-photonics and packaging technologies that make those links scalable. It
              explicitly excludes the GPUs, HBM, power infrastructure, and real-estate footprint that drive the broader
              AI-capex cycle but are not Lumilens' product surface.


              This distinction matters because the spend pool is large enough without stretching the definition. TBRC
              sizes AI data-center networking at $12.8 billion in 2026, while DataM and other optical-specific sources
              put the optical subset between about $3.75 billion and $9.94 billion today depending on what is included.
              Lumilens is aiming at the overlap between today's high-volume pluggable optics and tomorrow's scale-up
              optical fabrics. That makes the company exposed to a real market, but also means investors should avoid
              citing top-down “AI infrastructure” numbers that implicitly include compute and cloud spend far outside
              Lumilens' addressable wedge.
            claimRefs:
              - CM001
              - CM002
              - CM003
