chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Lumilens 把自己定位为 AI 基础设施连接平台，而不是泛用型光子公司。公开材料始终围绕一个问题展开：超大型 AI 集群如今最先卡在网络带宽、连接距离和功耗上，而不是原始 GPU 供给。Reuters
              在报道 2026 年 8 月融资时称公司位于 San Jose；Lumilens 自己的公告则称公司成立于 2024 年初，并在不到两年内完成首个产品商业化。两条信息合在一起，把 Lumilens
              放进一个少见类别：一家后期私营硬件创业公司，在广泛公开亮相前已经进入生产部署。


              公司仍是私营状态，披露很少。Lumilens 直到 2026 年 8 月才走出隐身模式，公开材料没有审计财务、董事会构成、股权结构控制条款或精确客户数。即便如此，核心身份已经清楚：Lumilens
              向横向扩展和纵向扩展 AI 网络销售光互连硬件，目标客户是需要以低于铜互连的功耗和时延连接更大 GPU 集群的超大规模云厂商。务实地看，公司已经越过实验室概念风险，但距离上市公司级透明度仍很远。
