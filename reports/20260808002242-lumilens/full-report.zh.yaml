      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配度是 Lumilens 故事的核心。多篇 2026 年报道把 Ankur Singla 描述为连续基础设施创始人；他此前创办的 Contrail Systems 和 Volterra 分别被
              Juniper Networks 与 F5 收购。F5 在 2021 年 1 月发布的交易完成通知，从外部证实其中一次退出真正完成。同样重要的是，Mayfield 称这是第三次支持 Singla，并从种子轮领投
              Lumilens，说明既有基础设施投资者愿意围绕同一创始人再次押注一个深技术、高资本投入的项目。


              运营班底不只一名创始人，但公开治理披露仍薄。Lumilens 网站列出 Samuel Liu、Ted Schmidt、Ritesh Kapahi 和 Dave Friedman
              分别担任产品、技术、印度运营和运营职能的创始人；还列出 Weich Fang、Harish Devanagondi 和 Mark Weiner 负责制造、硅工程和市场。公开材料还称团队成员来自
              Cisco、Juniper Networks、Meta、Marvell、Lumentum 和 Coherent。这个宽度很关键，因为 Lumilens
              不只是设计芯片，而是在同时搭建光子、封装、制造运营和面向超大规模云厂商的系统集成能力。未解决的治理问题在董事会：本次审阅的公开来源都没有披露董事会构成或投票控制结构。
