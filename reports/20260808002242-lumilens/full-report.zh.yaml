            body: >-
              运营模型从设计上就很重。Lumilens
              反复强调专有中介层、工艺配方、机器人、测试自动化和大批量制造系统。这说明公司需要在工艺工程、工具、校准和供应商管理上投入显著固定成本。如果这些投入带来更高吞吐、更低缺陷率，并能在可插拔模块、NPO 和 CPO
              之间复用，同一套运营选择也可能成为有吸引力的毛利率来源。但它们也意味着，相比投资者从泛泛“半导体创业公司”标签里可能假设的水平，Lumilens 在收入前或收入早期会有更重的成本结构。


              营运资本尤其关键。光学硬件放量需要先准备库存、走认证周期、支付供应商定金，并分阶段承诺制造产能，然后才收齐客户现金。POET 的公开框架是有用证据：一笔初始 $50M 订单和一段潜在累计 $500M
              的供应商关系，说明 Lumilens 必须资助真实硬件放量，而不只是软件工程。
