              集群最难的部分，不只是让光在光纤里跑，而是要用超大规模云厂商能大批量部署的方式，完成光链路的封装、布线、供电和认证。


              制造叙事进一步强化了这一解读。Lumilens 突出工艺配方、机器人、校准、制造执行系统和定制测试自动化。这些主张意味着，它的运营模型更接近先进系统制造，而不是把大部分产品化摩擦外包出去的 fabless
              芯片创业公司。POET 关系还显示，当合作方提供的光引擎能力能加快整个平台放量时，Lumilens 愿意把内部架构与外部能力结合。
