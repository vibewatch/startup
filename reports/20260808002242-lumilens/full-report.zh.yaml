companyProfile:
  summary: >-
    Lumilens 是一家位于 San Jose 的私营光网络创业公司，2024 年初成立，瞄准 AI 集群连接瓶颈。公司围绕 LumiCore 平台销售可插拔光模块、近封装光学和共封装光学，目标是在大型 GPU
    集群内提升带宽密度、降低铜互连带来的约束。公开证据显示，这家年轻硬件公司的早期外部验证异常强：Series C 融资超过 $700M，估值 $5.51B；累计融资超过 $900M；Ankur Singla 具备连续创业背景；POET
    提供供应商侧佐证；公司还声称已向一家未披露的大型超大规模云厂商量产出货。最大未知数仍是经济性、多元化和私募轮下行保护。
