      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方分层异常集中。今天，Lumilens 这类产品的主要买方、使用方和付费方，是按 pod 或 superpod 规模设计 AI
              集群的超大规模云厂商或云运营商。这些运营商同时看三件事：带宽密度、功耗效率和运维简单度。短期内，可插拔光模块会胜出，因为它们适配既有运营模型，也已经占据大部分市场。中期看，纵向扩展架构会把客户推向
              NPO，最终推向 CPO，因为在紧耦合域内，铜互连距离和功耗限制会变成卡点。


              还存在二阶买方和影响方。交换机与 ASIC 供应商、封装伙伴、晶圆厂和标准组织都会影响采用，因为光学部署依赖整套系统兼容，而不是单个模块性能。Ultra Ethernet Consortium 的存在，正是因为
              AI 工作负载对 Ethernet 的要求已超过旧拥塞控制设计所能提供的能力。这也解释了 Lumilens
              为什么同时瞄准横向扩展和纵向扩展。采用路径很可能先从已有预算的可插拔模块开始，再扩展到定制光网络；前提是超大规模云厂商愿意为了更高每瓦性能而重新设计节点。
