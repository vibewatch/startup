      - number: '7.2'
        title: 监管、法律与 IP 风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险是真实存在的，但当前紧迫性低于集中度和制造风险。Lumilens 销售到先进 AI 基础设施；这一类别越来越靠近出口管制、采购和合规审查。Federal Register 资料和 NIST
              指引都显示，围绕先进计算系统和供应商安全义务的政策方向在收紧，而不是放松。不过，Lumilens
              公开披露的只有基础隐私和条款页面。这些页面显示公司具备基本运营规范，但不是超大规模云厂商或受监管买方最终会希望看到的采购级合规材料包。


              法律和 IP 角度在公开记录中同样缺少材料。本次梳理没有发现诉讼或执法事项，这是方向性正面信号；但光互连生态挤满既有供应商和大型专利组合。在资本密集型市场里，即便可控的 IP
              争议，如果发生在客户认证或量产放量期间，也可能扰乱商业进程。
