      - number: '6.4'
        title: 扩张潜力与集中度风险
        blocks:
          - type: paragraph
            body: >-
              扩张与集中度是 Lumilens
              的一枚硬币两面。上行情景很明显：一旦超大规模云厂商认证了一个连接平台，项目就可以按集群代际、机架数量、带宽层级扩张，并最终从可插拔模块深入到更深光学集成层。下行同样清楚：如果当前锚定账户放慢、缩窄范围或选择既有厂商替代方案，公开客户故事会很快变弱，因为没有披露的多元客户基础来缓冲冲击。


              独立市场和竞争来源也强化了这种张力。AI 光网络需求真实且在扩张，但客户还有其他路径：InfiniBand、大型既有厂商支持的 Ethernet
              网络，以及其他光互连供应商。因此，即便需求环境有利，采购摩擦也很可能维持高位。正确解读不是 Lumilens 缺少客户证明，而是其证明具备战略意义，却仍集中、不透明且不完整。
