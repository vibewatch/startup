      - number: '6.3'
        title: 留存、重复使用与耐久性缺口
        blocks:
          - type: paragraph
            body: >-
              具名客户证明仍是核心弱点。客户没有被点名，不公开发声，也没有提供案例研究或性能指标。公开资料中没有采购记录，没有与 Lumilens 联名的参考架构，也没有续约或扩张披露。最佳佐证反而来自供应商侧：POET
              披露了一笔初始 $50M 订单，以及一个在客户放量延续时可能进一步扩大的框架。这给公开市场一些信心，说明部署不是虚构的，但节奏、宽度和耐久性仍有重大模糊地带。


              留存和满意度更不可见。公司没有披露 NRR、GRR、流失率、续约节奏、合同期限或客户满意度指标。最强耐久性代理指标都是间接的：生产状态比实验室 demo
              更难撤回，供应商框架意味着计划中的延续，而不是一次性评估。这些信号有用，但不能替代客户 cohort 数据。
