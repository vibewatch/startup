  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入口径
        blocks:
          - type: paragraph
            body: >-
              对 Lumilens 最有用的市场边界，不是“所有数据中心硬件”，甚至也不是“所有光网络”。公开来源一致把公司放在 AI 数据中心网络层：超大型 GPU
              集群需要在加速器、交换机、机架和光引擎之间建立低时延、高带宽链路。这一层包括 Ethernet 或 InfiniBand 交换、NIC 与
              DPU、可插拔光模块、光引擎，以及让这些链路可扩展的硅光和封装技术。GPU、HBM、电力基础设施和地产面积虽然驱动更广义的 AI 资本开支周期，却不在 Lumilens 的产品表面内，因此应明确排除。


              这个区分很重要，因为不需要拉宽定义，支出池也足够大。TBRC 估算 2026 年 AI 数据中心网络市场为 $12.8B；DataM 和其他光学专项来源则根据纳入口径不同，把当前光学子集放在约 $3.75B 到
              $9.94B 之间。Lumilens 瞄准的是当下高出货量可插拔光模块与明天纵向扩展光网络之间的交集。这让公司暴露在一个真实市场里，但也意味着投资者不应引用自上而下的“AI 基础设施”数字，因为那些数字往往把远超
              Lumilens 可服务切口的计算和云支出也算进去。
