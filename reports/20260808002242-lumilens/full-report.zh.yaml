      - number: '1.4'
        title: 产品快照、里程碑与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Lumilens 的公开产品快照逻辑完整，虽然关键运营指标仍未公开。公司销售三组关系紧密的产品：用于横向扩展网络的可插拔收发器、用于过渡期纵向扩展部署的近封装光学，以及面向更长期原生光学 GPU
              网络的共封装光学。三者都建立在 LumiCore 平台上；Lumilens 将其描述为一套共享栈，涵盖硅光、混合信号
              IC、电-光中介层和光学系统。公司还强调可制造性是差异化来源，声称内部掌握工艺配方、自动化、测试设备设计和面向大批量产出的 MES 工具。


              里程碑已经有分量。2026 年 5 月，POET 披露与 Lumilens 签署联合开发和供应协议，包括一笔初始 $50M 采购订单，并规划从 800G 和 1.6T 可插拔模块走向 NPO 与
              CPO；工程样品计划在 2026 年末推出，2027 年按客户节奏放量。2026 年 8
              月，公司随后走出隐身模式，并公开超大规模云厂商客户协议。当前缺少的是这类估值下私营公司尽调的标准指标：收入、ARR、客户数、员工数、毛利率、现金消耗和董事会监督。这些缺口不会抹掉技术或商业信号，但会显著降低外部对运营质量的可见度。
