  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Lumilens 的投资论点很容易讲清楚。公司攻打的是真实 AI 基础设施瓶颈，不是可有可无的投机性便利功能。光互连需求在上升，客户越来越把连接看得与计算同等重要；Lumilens
              声称已经完成认证、进入生产出货，并有供应商背书的放量，因此公开产品证据已经超过许多私营深科技同行。如果这些信号扩展成更广泛客户基础，Lumilens 可能会成为全球范围内异常重要的私营基础设施平台。


              反论点同样直接。在 $5.51B 投后估值下，市场已经在公开收入、利润率或多元化数据出现前，就把未来成功的很大一部分计入价格。一个有意义但不透明的客户项目，并不等于一套已经充分验证的商业业务。因此，公开案例足以让
              Lumilens 留在观察名单上，但不足以在没有进一步尽调时接受这个价格。
