      - number: '8.4'
        title: 可比框架、退出准备度与最终问题
        blocks:
          - type: paragraph
            body: >-
              可比分析主要用来框定估值边界。成熟上市光通信龙头运营成熟度太高，不能当作阶段匹配的可比对象；无关的基础设施独角兽在产品和单位经济上差异太大，也不适合直接迁移倍数。不过它们至少说明，市场乐观时，资本密集、具战略属性的基础设施公司可以拿到并维持很高的私募估值，而且有时速度很快。


              因此回到投资建议。Lumilens 值得继续跟踪：它刚走出隐身期，产品和客户信号已经强过同阶段平均水平。但纪律性投资人仍需更多证据，才能把 $5.51B
              视为舒服的入场价。缺口主要有三块：客户层面的收入证明、质量与良率数据，以及实际股权结构下的回报测算。在这些补齐之前，正确态度不是不相信公司，而是不要只凭今天不完整的证据，就按明天成功后的价格买单。
            claimRefs:
