      - number: '6.2'
        title: 采用轨迹与部署证据
        blocks:
          - type: paragraph
            body: >-
              客户证据中最大的正面意外，是领先验证点的成熟度。Lumilens 并不只是说自己在送样或试点；它说首个横向扩展产品已完成认证，并根据一份数十亿美元客户协议向生产级 AI
              数据中心出货。多个来源重复了这一表述，POET 的供应商证据也让它更难被当成纯营销。相比许多私营光学创业公司，这是显著更强的公开客户信号。


              同时，采用轨迹仍只露出一部分。没有公开来源披露已有多少站点上线、安装了多少链路、协议中多少是已入账收入而非未来
              backlog，或部署是否已超出初始窄工作负载。结果是，客户故事真实到足以重要，但透明度还不足以直接转换成干净的部署模型或客户 cohort 模型。
