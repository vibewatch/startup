    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与真正公开的信息
        blocks:
          - type: paragraph
            body: >-
              Lumilens 的公开财务披露很薄，但收入模型相当清楚。公司向超大规模云厂商 AI 网络销售光互连硬件：今天是可插拔收发器；如果采用路径跟上路线图，未来会是 NPO 和
              CPO。这不是软件式经常性收入故事。收入确认很可能取决于硬件认证、量产出货、供应商放量和客户部署节奏。这个差别很关键，因为关于“数十亿美元协议”和“订单”的公开标题，无法告诉我们今天确认了多少收入、多少是
              backlog、多少又取决于未来里程碑。


              公开记录确实显示，Lumilens 已经越过纯研发阶段。公司称正在向生产级 AI 数据中心出货；POET 也披露了一笔初始 $50M
              采购订单和一个大得多的多年供应商框架。这些数据点支撑了真实商业放量，但还不足以验证完整的收入质量图景。公开来源仍未披露收入、ARR、客户数或利润率数据。
