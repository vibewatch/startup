      - number: '2.2'
        title: 测算口径、地域与增长率
        blocks:
          - type: paragraph
            body: >-
              市场测算证据显示，这个市场已经有意义，而且仍在加速。TBRC 预计 AI 数据中心网络会从 2026 年的 $12.8B 增至 2030 年的 $30.17B；DataM 预计 AI 数据中心光互连会从 2025
              年的 $9.94B 增至 2033 年的 $31.04B。TrendForce 提供了更窄但很有用的口径：仅 AI 聚焦的光收发器，随着 800G 和 1.6T 链路放量，2026 年就可能达到
              $26B。Goldman Sachs 的光网络框架更激进，把 AI 驱动的光学机会描述为 $154B，其中最大价值池在纵向扩展网络。


              这些口径边界不同，不能机械取平均。务实结论是，Lumilens 不需要最宽的 TAM 也值得关注。即便采用保守的光学专项口径，年支出也有数十亿美元；Lumilens 自己提出的 $100B+
              叙事，也与一个方向一致：AI 系统从数千个加速器走向数万个加速器时，每个集群的光学价值量会急剧上升。因此，正确的尽调问题不是市场是否存在，而是 Lumilens
              能先现实地赢下技术栈中的哪一块，以及客户会以多快速度从可插拔模块迁移到 NPO 和 CPO。
