      - number: '1.3'
        title: 资本基础、投资者与客户验证
        blocks:
          - type: paragraph
            body: >-
              Lumilens 直到 2026 年才公开亮相，融资规模却异常大。公司称 Series C 融资超过 $700M，估值 $5.51B，累计融资超过 $900M。本轮由 Atreides
              Management、Bain Capital Ventures、Meritech、Seligman Ventures 和 Spark Capital 共同领投，参与方名单更长，包括
              Addition、Alkeon、HarbourVest、J.P. Morgan Private Capital、Mayfield、MVP Ventures、Peak XV、Qualcomm
              Ventures、Redpoint Ventures、Seifdune 等。这种广度说明 Lumilens 已经从专业风险投资故事，升级为战略基础设施融资故事。


              资本信号似乎也匹配了异常早的商业验证。Lumilens 称，公司已根据一份数十亿美元客户协议向生产级 AI 数据中心出货，初始横向扩展产品在成立后约两年内完成认证。具体客户仍未披露；Reuters
              只指出买方可能是美国四大超大规模云厂商之一。即便没有点名客户，商业出货、数十亿美元 backlog 语言，再加上 POET 披露的供应商放量工作，都表明投资者资助的更像产能扩张，而不是纯探索性 R&D。
