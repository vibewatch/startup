  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与组合
        blocks:
          - type: paragraph
            body: >-
              最适合理解 Lumilens 的方式，是把它看作 AI 集群连接硬件平台公司，而不是单一光模块供应商。在公开材料中，公司定义了两项客户任务。第一项是横向扩展：用 800G、1.6T
              及更高速率的可插拔光收发器，替代或增强传统铜连接的机架和排间互连。第二项是纵向扩展：用近封装和共封装设计，把光学移近 GPU，让紧耦合训练域突破铜互连物理限制。这个框架很关键，因为它同时把 Lumilens
              放进近期收发器市场和更长期的原生光学路线图。


              LumiCore 把产品逻辑串在一起；公司称这个共享平台覆盖硅光、混合信号 IC、电-光中介层和光学系统。公开看，LumiCore 不像一个面向终端客户的
              SKU，更像一套设计与制造底座，多个产品家族都从这里派生。由此形成的产品组合故事，不是只赢一个外形规格，而是让技术模块在多个部署表面上复用。
