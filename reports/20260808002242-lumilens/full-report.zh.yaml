            body: >-
              护城河耐久性取决于两个问题。第一，Lumilens 能否用一个平台和一条制造学习曲线，比单点方案同行跑得更快？第二，在既有玩家把光学创新吸收到更大技术栈之前，它能否做到这一点？SemiAnalysis
              和其他怀疑性来源在这里有用，因为它们提醒我们，CPO 不是一夜之间必然发生的切换。一些超大规模云厂商可能会比光学创业公司希望的更久地依赖可插拔模块或开放 Ethernet
              改进。因此，耐心和认证深度与原始光子人才同样重要。


              投资含义不是非黑即白，而是更细。如果客户想要一个同时匹配近期横向扩展和未来纵向扩展需求的单一供应商，Lumilens
              看起来位置不错。如果客户偏好既有厂商打包方案、要求看到现场可靠性后才重做节点，或故意多供应商并用以削弱创业公司定价权，Lumilens 的优势就没那么明显。因此，即便终端市场在增长，竞争强度依然很高。
