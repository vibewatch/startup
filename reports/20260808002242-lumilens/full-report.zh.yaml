      - - 供应商依赖
        - POET / 伙伴规模化进展
        - 供应商放量停滞，或与客户叙事不一致
        - 假设交付风险上升快于需求
      - - 监管 / 出口姿态
        - 新管制或采购要求
        - 限制目标账户或发货路径的规则变化
        - 重新测算 TAM 和商业化落地范围
      - - 财务风险
        - 未来融资条款
        - 缺少更强商业证明时出现降价轮或过桥融资
        - 认定估值与资金续航假设受损
    notes: 这些否决标准意在可监控，并直接连到投资影响，而不是停留在抽象担忧。
    claimRefs:
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 跟踪 / 有条件
        - 中低
        - 高
        - 偏贵
        - 按当前价格承销前，需要做更多尽调
      - - 只有证据升级后才有条件加仓
        - 中
        - 高
        - 价格敏感
        - 需要收入 / 质量 / 客户深度证据
      - - 持有 / 列入观察
        - 高
        - 高
        - 合理默认立场
        - 公开证据有吸引力但不完整
    notes: 建议取决于证据和价格，不是在说公司质地差或市场不重要。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 多头：真实市场瓶颈叠加可信的早期产品验证
        - 具名客户扩张和更充分的经济性披露会强化这一点
      - - 多头：大额融资买来执行时间
        - 烧钱克制、质量爬坡有证据，会强化这一点
      - - 空头：价格已提前计入未来广泛成功
        - 更低进入价格或更强客户多元化会削弱这一担忧
      - - 空头：一个不透明的锚定客户还不够
        - 具名第二个项目或公开客户案例会削弱这一担忧
      - - 空头：缺少收入 / 利润率数据，挡住承销判断
        - 收入、毛利率和积压订单转化数据会削弱这一担忧
    notes: 摇摆因素都可验证；问题是大多今天并不公开。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 第二个客户项目、强质量数据、更广的量产验证
        - $10–14B 结果；相对本轮有吸引力的账面加价
        - 需要客户与制造两端同时执行到位
        - 较低但仍有意义
      - - 基准
        - 锚定项目真实存在，但多元化和经济性仍只部分可见
        - $5–7B 结果；相对当前水平最多只有温和上行
        - 集中度与不透明度仍然重要
        - 最符合公开证据的情景
      - - 悲观
        - 没有多元化、质量滑坡，或下一轮融资估值重置
        - $2–4B 结果；有资本减值风险
        - 集中度、质量和定价互相冲撞
        - 概率不可忽视
      - - 上行可选性
        - 平台成为战略并购标的，或赢下更广品类
        - 可能 >$14B，但仍属投机
        - 需要尚未公开的证据
        - 目前概率低
    notes: 这些是情景估算，不是有来源的市场价格。它们把当前证据格局转化为粗略决策区间。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Lumilens
        - 最新私募轮
        - $5.51B 投后估值；本轮 >$700M
        - 直接参考点
        - 收入和优先权结构未披露
      - - Hadrian
        - 私募估值
        - 2026 年 1 月估值 $1.6B
        - 资本密集型工业执行可比对象
        - 产品和买方群体不同
      - - Redwood Materials
        - 私募估值
        - 2026 年 1 月估值 >$6B
        - 基础设施规模私募市场可比对象
        - 储能，不是 AI 网络
      - - Valar Atomics
        - 私募估值
        - 据引用报道，$1B Series B 后估值 ~$6B
        - 显示投资人对前沿基础设施的兴趣
        - 核电不是有用的单位经济性匹配对象
      - - Coherent / Marvell / MACOM
        - 上市披露主体状态
        - 有 SEC 披露足迹的成熟上市既有厂商
        - 可作为晚期透明度应有水平的成熟度锚点
        - 阶段和倍数都不匹配
    notes: 本表刻意采用混合模型：它框定估值背景，而不是做虚假的苹果对苹果倍数比较。
    claimRefs:
      - CV001
      - CV032
      - CV033
      - CV034
      - CV029
    enumerationScope:
      coverage: partial
      basis: >-
        The public comp set is illustrative rather than exhaustive because few direct optical-networking startups
        disclose stage-comparable pricing and metrics.
  - id: TV005
    title: 论点破裂与否决触发条件表
    columns:
      - 触发条件
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 客户多元化停滞
        - 没有实质第二个项目或可见账户扩张
        - 乐观情景向基准 / 悲观坍缩
        - 不按当前价格追加资本
      - - 质量 / 良率证据不及预期
        - 出现实质可靠性或良率担忧
        - 执行叙事迅速转弱
        - 按悲观情景重新定价
      - - 无更强证据却出现折价轮
        - 下一轮融资将账面估值重置到当前水平以下
        - 价格纪律论点以负面方式得到验证
        - 没有新的信息优势就不要跟投
      - - 政策 / 出口摩擦显著上升
        - 管制或采购规则压窄目标客户
        - TAM 和成交速度下降
        - 重做市场与退出假设
    notes: 这些是可监控的论点破裂条件，不是背景风险。
    claimRefs:
      - CV027
      - CV028
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 按客户拆分的收入 / 积压订单
        - 收入、订单预订、积压订单转化和客户组合
        - 检验价格支撑的核心
        - 管理层 + 财务尽调
      - - 质量 / 良率材料包
        - 良率、MTBF、故障率和现场验收数据
        - 检验可制造性和耐久性
        - 运营 + 工程尽调
      - - 股权结构 / 优先权
        - 清算优先级、稀释、员工股权补充需求
        - 检验退出时的真实回报数学
        - 法务 + 财务尽调
      - - 客户访谈深度
        - 具名账户、范围和扩张历史
        - 检验锚定客户验证能否外推
        - NDA 下的商业尽调
      - - 供应商 / 产能韧性
        - 对 POET 的依赖、第二来源和制造应急方案
        - 检验增长中的交付风险
        - 供应链尽调
    notes: 如果这些问题得到正面回答，建议可以上调；如果回答很差，当前账面估值就很难守住。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV045
