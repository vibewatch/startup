  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的核心风险
        blocks:
          - type: paragraph
            body: >-
              Lumilens 的风险画像是集中式的，而不是分散式的。融资超过 $900M
              后，公司短期内似乎没有明显流动性危机。最大风险反而集中在一个问题上：一两个高度战略性的项目能否转化为耐久、可重复的生产业务。公开记录支持一个锚定超大规模云厂商关系，但不支持多元客户基础。这意味着客户集中度不是旁支问题，而是整个投资判断的核心。


              第二大风险簇是产品化和制造。Lumilens
              公开强调自动化、校准、工艺配方和大批量制造，这在战略上合理。但这也意味着，在公开良率、可靠性和现场故障数据披露前，投资者需要先相信复杂运营系统。基础设施硬件的执行失败，往往不是来自缺少市场需求，而是来自质量、进度或供应商滑坡。Lumilens
              正暴露在这种模式下。
