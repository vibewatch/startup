        title: 直接同行与创业公司定位
        blocks:
          - type: paragraph
            body: >-
              在直接同行中，Ayar Labs 是最清晰的基准。它在 2026 年 3 月以 $3.75B 估值完成 $500M Series E 融资，并公开把自己定位为可量产的纵向扩展 CPO 方案。Lightmatter
              是另一类可比对象：它的 Passage 平台推动光子中介层和系统愿景，更接近超大规模云厂商共创，而不是纯可插拔模块。两家公司都释放出同一信号：严肃资本和生态支持正在汇聚到纵向扩展光学，而这也是 Lumilens
              想抵达的高价值终点。


              Lumilens 的差异化在宽度。公开材料显示，公司想用可插拔模块变现当前横向扩展需求，同时也给超大规模云厂商一条迁移到 NPO 和 CPO
              的路径。如果客户重视跨代共用一套技术栈，这可能比单点产品故事更强。但同样的宽度也意味着 Lumilens 要在更多战线上同时竞争，对手要么更专精，要么既有地位更强。
