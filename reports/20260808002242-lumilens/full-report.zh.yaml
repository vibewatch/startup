  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局结构与真正的竞争对象
        blocks:
          - type: paragraph
            body: >-
              Lumilens 并不在狭窄的单一产品赛道竞争。真实格局包括直接光学创业公司、既有网络设备厂商、商用硅生态，以及持续改进的 Ethernet 和 InfiniBand
              技术栈本身。这很重要，因为客户可以用很不同的方式解决同一个扩展问题：购买更多可插拔光模块，围绕光引擎重做节点架构，押注专有网络，或等待开放 Ethernet
              技术栈改进。结果是，市场里的对手不只某一家被点名的创业公司，而是任何会推迟或重定向光学支出、偏离 Lumilens 偏好路径的架构。


              Ayar Labs 和 Lightmatter 等直接同行很重要，因为它们攻打的也是深度集成光学周围的未来价值池。Broadcom、Nvidia、Cisco、Coherent
              和大型收发器厂商等既有玩家也很重要，因为它们已经掌握客户认证循环、分销渠道和制造关系，而创业公司必须切进去。竞争问题因此不是“谁的光子技术最聪明”，而是“谁能最快把光学新意变成客户放行的量产规模”。
