  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与谁真正付费
        blocks:
          - type: paragraph
            body: >-
              Lumilens 的公开客户故事范围很窄，但对一家年轻深科技硬件公司而言又异常具体。买方宇宙不是广义企业市场，而是少数正在建设超大型 AI
              集群的超大规模云厂商及相邻平台团队；在这些集群里，连接已经成为限制因素。公开来源始终这样描述 Lumilens 的销售环境：生产级 AI 数据中心、百万级收发器网络，以及未来突破铜互连限制后的 GPU
              域扩张。这意味着真正买方通常是网络、基础设施或平台架构团队，技术标准极高，认证周期很长。


              因此，客户分层天然高度集中。当前公开记录可信地支持一个核心客群：运营生产级 AI 集群的超大规模云厂商。二级买方群体有可能存在——加速器平台团队、未来主权 AI 运营商，或 HPC
              规模买方——但公开证据弱得多。投资者因此不应把 Lumilens 看成客户基础多元化故事，而应把它看作战略大客户故事：少数项目决定大部分商业结果。
