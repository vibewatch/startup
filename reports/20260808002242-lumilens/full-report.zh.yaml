      - number: '3.3'
        title: 替代品、切换成本与分销权力
        blocks:
          - type: paragraph
            body: >-
              最强替代品不是创业公司，而是既有技术栈。Broadcom、Nvidia 和更广泛的 Ethernet 生态可以把邻近硅片、网络和光学打包进已经存在的客户关系。Ultra Ethernet
              在这里重要，因为它强化了开放 Ethernet 对 AI
              网络的答案，不要求客户押注一家全新供应商。同样，可插拔光模块的既有玩家仍拥有已经验证的制造规模和服务流程，这是创业公司目前还无法公开证明自己可以匹敌的能力。


              对 Lumilens
              而言，切换成本是双刃剑。在标准化可插拔模块中，切换成本相对低，买方可以多供应商并用，并随时间替换部件。一旦光学与节点或封装共同设计，切换成本就会高得多；但客户犹豫也会同步上升，因为可维护性、良率和现场维修经济性会变得更难。换句话说，护城河最高的区域，也是最难快速拿下的区域。
