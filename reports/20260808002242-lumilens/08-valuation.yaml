- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Lumilens
    - Latest private round
    - $5.51B post-money; >$700M round
    - Direct reference point
    - Revenue and preference stack undisclosed
  - - Hadrian
    - Private valuation
    - $1.6B valuation in Jan 2026
    - Capital-intensive industrial execution comp
    - Different product and buyer set
  - - Redwood Materials
    - Private valuation
    - '>$6B valuation in Jan 2026'
    - Infrastructure-scale private-mark comp
    - Energy storage, not AI networking
  - - Valar Atomics
    - Private valuation
    - ~$6B according to cited coverage after $1B Series B
    - Shows investor appetite for frontier infrastructure
    - Nuclear power is not a useful unit-economics match
  - - Coherent / Marvell / MACOM
    - Public filer status
    - Mature public incumbents with SEC filing footprint
    - Useful maturity anchors for what late-stage transparency looks like
    - Not stage-matched or multiple-matched
  notes: 'This table is intentionally mixed-model: it frames valuation context, not a false apples-to-apples
    multiple exercise.'
