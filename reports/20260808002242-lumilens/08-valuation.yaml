    - Named customer expansion and better economics disclosure would strengthen this
  - - 'Bull: large round buys time to execute'
    - Evidence of disciplined burn and quality ramp would strengthen this
  - - 'Bear: price already anticipates broad future success'
    - A lower entry price or stronger customer diversification would weaken this concern
  - - 'Bear: one opaque anchor customer is not enough'
    - A named second program or public customer case study would weaken this concern
  - - 'Bear: missing revenue / margin data blocks underwriting'
    - Revenue, gross margin, and backlog conversion data would weaken this concern
  notes: The swing factors are knowable; the problem is that most are not public today.
