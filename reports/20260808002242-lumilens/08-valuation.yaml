- id: scenarios
  title: Bull, base, and bear scenarios
  body: 'Scenario analysis is the cleanest way to handle that gap. In a bull case, Lumilens broadens beyond
    the anchor program, demonstrates durable quality and manufacturing, and begins to look like a strategic
    platform rather than a single-account success. In that world, a materially higher valuation can be
    justified because the customer and execution risks that dominate the current debate start to fall
    away.


    In a base case, the anchor program is real and commercially important, but diversification and economics
    remain only partly visible. That outcome could still validate the company but generate only modest
    mark-up from the current price. In a bear case, concentration persists, execution slips, or the next
    financing resets expectations; then the current mark would look aggressive in hindsight. The public
    record today supports the base case most naturally, not the bull case. That is exactly why the investment
    call should stay conditional and milestone-driven rather than narrative-driven.'
  claimRefs:
  - CV020
  - CV021
  - CV022
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV028
