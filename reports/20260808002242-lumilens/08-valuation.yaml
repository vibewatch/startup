- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Customer diversification stalls
    - No meaningful second program or visible account expansion
    - Bull case collapses toward base/bear
    - Do not add capital at current price
  - - Quality / yield evidence disappoints
    - Material reliability or yield concern surfaces
    - Execution narrative weakens quickly
    - Reprice toward bear case
  - - Down round without stronger proof
    - Next financing resets mark below current level
    - Price discipline thesis vindicated negatively
    - Avoid following without new information edge
  - - Policy / export friction rises materially
    - Controls or procurement rules narrow target accounts
    - TAM and speed-to-close fall
    - Re-underwrite market and exit assumptions
  notes: These are monitorable thesis-break conditions, not background risks.
