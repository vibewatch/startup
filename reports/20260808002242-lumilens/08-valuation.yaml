  - FV003
- id: comparables-exit
  title: Comparable frame, exit readiness, and final asks
  body: 'Comparable analysis is useful mainly for framing limits. Mature public optical incumbents are
    too operationally advanced to function as stage-matched comps, while unrelated infrastructure unicorns
    are too different in product and unit economics to justify direct multiple transfer. They do, however,
    show that capital-intensive, strategic infrastructure businesses can attract and sustain very large
    private valuations when markets are optimistic, sometimes very quickly.


    That leaves the recommendation. Lumilens deserves continued attention because the product and customer
    signals are stronger than average for a company only recently out of stealth. But a disciplined investor
    should still require more evidence before treating $5.51 billion as a comfortable entry. The key missing
    pieces are customer-level revenue proof, quality and yield data, and the actual cap-table return math.
    Until those arrive, the right stance is not disbelief in the company; it is skepticism about paying
    tomorrow’s success price with only today’s partial evidence.'
