  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue / backlog by customer
    - Revenue, bookings, backlog conversion, and account mix
    - Core test of price support
    - Management + finance diligence
  - - Quality / yield package
    - Yield, MTBF, failure rates, and field acceptance data
    - Tests manufacturability and durability
    - Operations + engineering diligence
  - - Cap table / preferences
    - Liquidation stack, dilution, employee refresh needs
    - Tests real return math at exit
    - Legal + finance diligence
  - - Customer reference depth
    - Named accounts, scope, and expansion history
    - Tests whether anchor proof generalizes
    - Commercial diligence under NDA
  - - Supplier / capacity resilience
    - POET dependency, second sourcing, and manufacturing contingency
    - Tests delivery risk under growth
    - Supply-chain diligence
  notes: If these asks are answered positively, the recommendation can move; if they are answered poorly,
    the current mark becomes hard to defend.
