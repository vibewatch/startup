  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Second customer program, strong quality data, broader production proof
    - $10–14B outcome; attractive markup from current round
    - Needs simultaneous execution across customers and manufacturing
    - Lower but meaningful
  - - Base
    - Anchor program is real, but diversification and economics stay only partly visible
    - $5–7B outcome; modest upside at best from current level
    - Concentration and opacity remain material
    - Most natural public-evidence case
  - - Bear
    - No diversification, quality slippage, or valuation reset in next financing
    - $2–4B outcome; capital impairment risk
    - Concentration, quality, and pricing collide
    - Material probability
  - - Upside optionality
    - Platform becomes strategic M&A or broader category winner
    - '>$14B possible but speculative'
    - Requires evidence not yet public
    - Low probability today
  notes: These are scenario estimates, not sourced market prices. They translate the current evidence
