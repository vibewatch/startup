  topStrengths:
    - Lumilens 打的是 AI 集群里真实存在的光互连瓶颈，不是边缘假设，市场需求也在顺着这个方向走。
    - 对一家年轻硬件公司来说，公开产品证据高于常态：LumiCore 路线图分层清楚，公司也声称已通过认证并进入量产出货。
    - 公司拿钱能力异常强，成立约两年就融资超过 $900M。
    - Ankur Singla 有连续创业和既往退出履历，提升了拿客户、招人和后续融资的概率。
    - POET 等供应商侧印证提供了独立支撑，说明商业爬坡不只是隐身叙事。
  topRisks:
    - 公开客户证据仍集中在一个未具名的锚定 hyperscaler，客户多元化和可复制性大多还没被证明。
    - 公开资料没有披露收入、毛利率、烧钱、积压订单转化或留存，难以用经营证据支撑当前估值。
    - 产能爬坡、良率、可维护性和质量执行都是关键硬件风险，公开能见度仍只有一部分。
    - 即便 Lumilens 技术有吸引力，NVIDIA、Broadcom、Marvell 等既有生态也可能拖慢采用。
    - 私募轮下行条款、清算优先权和稀释机制尚未披露，真实回报测算受限。
  unresolvedGaps:
    - 需要客户层面的收入、毛利率、烧钱和现金跑道披露，才能把战略叙事接到经营经济性上。
    - 需要清楚证据说明锚定项目是在扩展到多个量产账户，还是仍是一段高度集中的关系。
    - 插拔式、NPO 和 CPO 部署里的现场可靠性、良率、MTBF 和可维护性数据。
    - 股权瀑布、清算优先权、员工期权刷新需求及其他条款，用于精确建模下行和退出。
    - 相对 NVLink、Ethernet、InfiniBand 和商用光学器件等既有替代方案，客观采用证据仍缺失。
