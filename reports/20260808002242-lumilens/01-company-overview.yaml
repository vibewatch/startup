company:
  name: Lumilens
chapter:
  number: 1
  title: Company Overview
  summary: Lumilens is a San Jose-based private optical networking startup founded in early 2024 that
    emerged from stealth in August 2026 with more than $900 million raised and a $5.51 billion valuation.
    Public evidence already shows production shipment into an unnamed hyperscaler AI data center and a
    disclosed supplier ramp with POET, but revenue, customer concentration, governance, and headcount
    remain undisclosed.
sections:
- id: identity-stage
  title: Identity, stage, and business model
  body: 'Lumilens presents itself as a connectivity platform for AI infrastructure rather than a general-purpose
    photonics company. Its public materials consistently frame the company around one problem: very large
    AI clusters now fail first on network bandwidth, reach, and power rather than on raw GPU availability.
    Reuters described the company as San Jose-based when it covered the August 2026 financing, and Lumilens''
    own announcement says the company was founded in early 2024 and commercialized its first product in
    under two years. That combination places Lumilens in the rare category of a late-stage private hardware
    startup that reached production deployment before broad public launch.


    The company remains private and disclosure-light. It emerged from stealth only in August 2026, and
    public materials do not include audited financials, board composition, cap-table control terms, or
    precise customer counts. Even so, the core identity is clear: Lumilens sells optical interconnect
    hardware for both scale-out and scale-up AI networks, targeting hyperscalers that need to connect
    ever-larger GPU clusters with less power and lower latency than copper can support. In practical terms,
    the business is already beyond lab-stage concept risk, but it still sits well short of public-company
    transparency.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO032
  tableRefs:
  - TO001
- id: founders-leadership
  title: Founders, leadership, and governance visibility
  body: 'Founder-market fit is a central part of the Lumilens story. Multiple 2026 profiles describe Ankur
    Singla as a repeat infrastructure founder whose earlier companies Contrail Systems and Volterra were
    acquired by Juniper Networks and F5 respectively. F5''s January 2021 completion notice gives external
    confirmation that one of those exits reached close. Just as important, Mayfield said it backed Singla
    for the third time and led Lumilens from seed, indicating that existing infrastructure investors were
    willing to underwrite another deeply technical, capital-intensive build around the same founder.


    The operating bench is broader than a single founder, although public governance disclosure is still
    thin. Lumilens'' website identifies Samuel Liu, Ted Schmidt, Ritesh Kapahi, and Dave Friedman as founders
    in product, technology, India operations, and operations roles respectively; it also names Weich Fang,
    Harish Devanagondi, and Mark Weiner in manufacturing, silicon engineering, and marketing. Public materials
    further claim the team draws from Cisco, Juniper Networks, Meta, Marvell, Lumentum, and Coherent.
    That breadth matters because Lumilens is not just designing chips: it is simultaneously building photonics,
    packaging, manufacturing operations, and hyperscaler-facing systems integration. The unresolved governance
    question is the board: no public source reviewed here discloses board composition or voting-control
    structure.'
  claimRefs:
