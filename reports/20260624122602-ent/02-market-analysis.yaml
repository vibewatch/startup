chapter:
  number: 2
  title: Market Analysis
  summary: Ent addresses a combined endpoint, DLP, insider-risk and AI-governance market whose 2026 segments exceed $30 billion in aggregate and imply a $25-30 billion SAM, but the obtainable SOM is unquantified because pricing is undisclosed and Microsoft's bundling anchors the budget line.
sections:
- id: boundary-and-substitutes
  title: Market boundary, adjacencies and substitutes
  body: |-
    Ent sits at the intersection of four security budgets: endpoint security, data loss prevention, insider risk management and the emerging category of AI governance. Drawing the boundary before sizing matters, because Ent is an on-device agent that competes most directly with endpoint protection and EDR for placement on the device, while its differentiated value is in inferring intent for insider risk and governing both human users and AI agents. Gartner's definition of an endpoint protection platform as software deployed on devices to prevent and detect malicious activity anchors the core, and adjacent categories such as UEBA, CASB, EDR and AI governance border the perimeter.

    On this boundary, the spend Ent can credibly address includes on-device protection, content inspection and exfiltration control, behavioral insider-risk investigation, and controls over AI-agent actions. It excludes network firewalls, pure SIEM, and managed-SOC labor, which are adjacent but not on the endpoint. The status-quo substitutes Ent displaces are legacy DLP suites, EDR alerting workflows and manual insider-risk investigation, all of which the company argues are reactive. XDR and AI-SOC are treated as adjacent rather than core to avoid double counting in the sizing that follows. The practical test for inclusion is whether a budget line is spent on the device or workspace where Ent's agent runs, which keeps the boundary tight and defensible for the diligence reader rather than inflating the headline opportunity with loosely related security spend.
  claimRefs:
  - CM001
  - CM022
  - CM023
  - CM025
  - CM027
  - CM031
  tableRefs:
  - TM001
- id: sizing-multi-lens
  title: TAM, SAM and SOM across multiple lenses
  body: |-
    No single TAM number is reliable here, so the chapter triangulates. The global endpoint security market was roughly $18.58 billion in 2025 and about $20.79 billion in 2026, growing near 11.9% toward $32.52 billion by 2030. Within and beside it, EDR is estimated near $6.33 billion in 2026 and growing far faster at about 24% toward $18.68 billion by 2031, while DLP is about $4.67 billion in 2026 growing near 27% toward $12.53 billion by 2030. The broader XDR and AI-SOC opportunity is sized from $33.4 billion in 2025 to $89 billion by 2031, but with the loosest scope. Independent analysts disagree at the margins because they scope these segments differently, and those disagreements are preserved as a diligence item rather than averaged away.

    Combining endpoint, EDR and DLP gives an order-of-magnitude multi-segment reference above $30 billion before de-duplication, and a defensible 2026 SAM for Ent's combined workspace-security category is roughly $25-30 billion. The obtainable SOM, however, cannot be pinned down: Ent has not disclosed per-endpoint or per-seat pricing, and there is no public Ent-specific SAM or SOM calculation, so the startup-addressable slice remains only partly estimable and rests on category proxies.
  claimRefs:
