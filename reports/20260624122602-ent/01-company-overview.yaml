- id: funding-and-milestones
  title: Funding, investors, milestones and disclosure profile
  body: |-
    Ent announced $100 million in seed financing on June 16, 2026, led by Decibel with participation from Sequoia, Craft Ventures, Crosspoint Capital Partners, Shield Capital, Felicis and In-Q-Tel. That makes the round one of the largest seed financings in cybersecurity history and brings total capital raised to $100 million across a single round. In-Q-Tel's presence links Ent to U.S. national-security buyers, and Crosspoint adds cybersecurity-specialist private-equity backing. Notably, the company has not disclosed a specific post-money valuation, using only unicorn-territory language, and it has not published revenue, ARR or named customers.

    The milestone record is compact and concentrated: a 2025 stealth founding, a mid-2026 emergence with simultaneous financing and platform general availability, disclosed Global 2000 deployments in hospitality, financial services and defense, and a planned Black Hat USA 2026 presence in August. Skeptical coverage from The Next Web and DLP Test cautioned that the prevention narrative is no longer contrarian and that intent-detection and low-false-positive claims lack published independent benchmarks. As a result, Ent is best treated as a capital-rich, pedigree-heavy seed company whose narrative currently runs ahead of independently verifiable operating proof.
