callouts:
- calloutType: strength
  title: Rare founder-market fit anchored a record cybersecurity seed
  body: Ent pairs a proven RiskIQ exit to Microsoft with senior Microsoft security-AI leadership, and that pedigree underwrote one of the largest seed rounds in cybersecurity history. The combination of category experience, a tier-one syndicate led by Decibel, and a strategic In-Q-Tel relationship gives the company unusual early credibility and runway.
  claimRefs:
  - CO005
  - CO006
  - CO019
  - CO021
  - CO029
- calloutType: risk
  title: Thin disclosure and two-founder concentration require diligence
  body: Ent discloses no valuation, revenue, ARR or named customers, and the WSJ-reported ~100-person team leans heavily on its two co-founders. Skeptical outlets note the absence of independent benchmarks for the intent-inference claims. None is thesis-breaking, but together they mean the company should not yet be treated as a de-risked platform.
  claimRefs:
  - CO020
  - CO026
  - CO031
  - CO032
  - CO033
- calloutType: insight
  title: Capital and narrative are ahead of public proof
  body: The launch packaged founding, financing, product GA and early traction into a single news moment, which maximizes signaling but compresses the evidence a diligence reader can independently verify. The strongest verifiable facts are the round size and founder histories; the softest are valuation, customer scale and benchmarked efficacy.
