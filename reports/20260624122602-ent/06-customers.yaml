- id: adoption-trajectory-proof
  title: Adoption trajectory and named customer proof
  body: |-
    Ent's public adoption evidence is narrow but strategically credible. The company asserted on stealth exit that its platform is in production across Global 2000 enterprises, which implies real deployments existed before the June 2026 announcement. However, no specific customer count, ARR figure, or deployment breadth metric has been disclosed. The stealth period itself signals that Ent had paying customers before public launch — a positive signal versus a pre-revenue launch, but one that cannot be assessed for scale or durability without private data.

    The named customer proof set is limited to a single anonymous testimonial: an insider-threat lead at a public financial institution who described Ent as the first tool where they felt like an expert on day one. This quote indicates low time-to-value and ease of use, two critical buying criteria in enterprise security, but it is a single data point from an unidentifiable source. No case studies, deployment scale figures, outcome metrics, or reference accounts are publicly available. The three disclosed verticals — hospitality, financial services, and defense — are named in Ent's press release and picked up by multiple independent outlets including TechCrunch, VentureBurn, SiliconANGLE, and CityBiz, confirming the disclosure was intentional and widely covered. However, the verticals are stated as categorical rather than enumerated accounts, leaving the depth of each deployment unknown.

    TechCrunch characterized Ent as having deployed the platform across Global 2000 enterprises before going public, and VentureBurn noted early enterprise customers in regulated industries. SiliconANGLE similarly reported a base of Global 2000 customers before stealth exit. This convergence across independent outlets on the same company-provided framing increases confidence in the claim's existence, though it does not independently validate its depth or the distinction between production deployments and active evaluations. The evidence freshness is high — all proof dates from the June 2026 launch window — but the volume is thin. Diligence must treat the current proof set as a starting point, not a validation baseline.
