callouts:
- calloutType: strength
  title: Multi-vertical stealth traction across Global 2000 enterprises
  body: Ent exited stealth with disclosed deployments in hospitality, financial services, and defense — three large, regulated verticals with chronic insider-risk and AI-governance exposure. The anonymous financial-institution testimonial suggests low time-to-value, a critical buying signal for risk-averse enterprise security teams. IQT's participation further validates the defense vertical pathway.
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU009
  - CU020
- calloutType: risk
  title: 'Customer evidence is thin: one anonymous quote and three un-named verticals'
  body: All public customer proof as of June 2026 is company-asserted or anonymized. No named accounts, no case studies, no outcome metrics, and no retention or NRR data are available. The unverified Global 2000 claim and the absence of independent benchmarks mean that customer durability and concentration risk are entirely opaque to outside diligence.
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU027
  - CU033
  - CU034
- calloutType: recommendation
  title: Require named references, NRR data, and a cohort table before conviction
  body: Diligence should demand at least three named enterprise references, NRR and GRR data, contract length distribution, and a customer-count breakdown by vertical under NDA. The single anonymous testimonial and company-asserted Global 2000 claim are insufficient for a high-conviction investment judgment on customer durability.
  claimRefs:
  - CU027
  - CU028
  - CU039
  - CU034
- calloutType: insight
  title: Regulated-industry early adoption de-risks the initial sales motion
  body: Financial services, hospitality, and defense share a common need for insider-risk controls and data-sovereignty compliance that Ent's on-premise cloud deployment model directly addresses. CISA guidance and Verizon/IBM breach data confirm sustained regulatory and threat demand, providing structural tailwinds that reduce demand-cycle risk for the early customer base.
  claimRefs:
  - CU010
  - CU012
  - CU013
  - CU026
  - CU032
