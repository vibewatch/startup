- id: valuation-comparables
  title: Valuation context, comparables and scenarios
  body: |-
    The $100 million seed from tier-1 investors implies a valuation widely characterized as in unicorn territory, but no official post-money figure has been disclosed, so the implied number is not directly supported by public evidence, and seed preference and dilution terms remain unknown. With no Ent revenue public, comparables anchor the envelope. CrowdStrike trades as a large-cap platform worth tens of billions, SentinelOne sits in the mid-teens-of-billions class, and Palo Alto Networks exceeds $100 billion as a consolidation comparable; high-growth security software commands elevated EV/revenue multiples. On the private side, Wiz's record ARR ramp before a landmark acquisition frames the path a category-definer must travel, and recent security M&A shows acquirers paying strategic premiums.

    These inputs produce a scenario envelope rather than a point value. The bull case is an IPO or acquisition at $5 billion-plus if intent-aware security becomes a default layer; the base case is a Series A/B at $500 million to $1 billion-plus if early Global 2000 traction holds; and the bear case is commoditization, a down round or acqui-hire. Valuation is highly sensitive to assumed forward ARR and the multiple applied, and an outsized seed reduces entry discipline while raising the bar for the next round. Probability weighting tilts toward the base case with meaningful bear-case weight given execution risk.
