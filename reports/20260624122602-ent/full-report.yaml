  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing and go-to-market
        blocks:
          - type: paragraph
            body: >-
              Ent runs a SaaS subscription business, most likely priced per endpoint or per seat, though it has
              disclosed no pricing or list rates at launch. Its revenue mix is presently concentrated in early Global
              2000 deployments across financial services, hospitality and defense, with an AI-governance module and
              professional-services onboarding as emerging and prospective streams. Because the platform is hosted in
              each customer's own cloud, enterprise onboarding is a real services component rather than a pure
              self-serve motion.


              The go-to-market is a direct enterprise motion selling into CISO security organizations. That motion
              carries the sales-efficiency drag typical of enterprise security, where cycles commonly run six to twelve
              months or longer. At seed stage these efficiency measures are unobservable externally, so only proxies
              from comparable cloud and security SaaS apply. Reference pricing from incumbents - roughly $100 or more
