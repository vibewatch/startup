chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, founding and business model
        blocks:
          - type: paragraph
            body: >-
              Ent is an intent-aware workspace security company that emerged from stealth on June 16, 2026 with a
              lightweight on-device AI agent for Windows, macOS, Linux and browser extensions. Its core thesis is to
              bring prevention back to cybersecurity by using specialized AI models to evaluate the intent of both human
              users and AI agents in real time and intervene before incidents occur, rather than relying on
              after-the-fact detection. The platform is hosted in the customer's own cloud to preserve data sovereignty,
              and the company frames its use cases as insider risk detection, AI governance, data loss prevention,
              last-mile threat prevention and incident investigation.


              Public records place Ent's headquarters in San Francisco, California, though some coverage uses the
              broader San Francisco Bay Area, and direct confirmation is advisable. Founding timing is mildly
              conflicting: BankInfoSecurity reports a May 2025 founding and the Wall Street Journal says Ent launched in
              2025, while the company emerged publicly only in mid-2026. The safest canonical description is a
              2025-founded, seed-stage private company that operated in stealth for roughly a year before a high-profile
              2026 debut. The legal operating entity behind the ent.ai brand has been associated informally with the
              name Athena Formation Inc., but that is not firmly confirmed in primary disclosures and should be verified
              against incorporation records. In short, the identity is directionally clear but several basic facts still
              warrant primary confirmation during diligence.
