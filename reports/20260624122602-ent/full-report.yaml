  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis and recommendation
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Ent is that intent-aware workspace security could become a default enterprise
              layer, sold by an elite RiskIQ and Microsoft founding team whose prior RiskIQ exit to Microsoft for $500
              million-plus demonstrates value-creation, and validated by a tier-1 syndicate led by Decibel. The
              anti-thesis is equally clear: detection-first incumbents could embed intent-awareness and commoditize Ent
              before it scales, leaving its wedge to narrow and its single anonymous customer reference looking thin.
              These opposing cases are paired across product, team, market, customers and moat to make the central
              debate explicit.


              The recommendation is to track Ent rather than invest immediately - a compelling vision and pedigree with
              real early traction, but execution unproven at scale, undisclosed financials and a crowded,
              incumbent-anchored market. Confidence is moderate given thin disclosed financials and customer proof, and
              the high-variance risk profile justifies a track stance rather than immediate conviction. On balance, Ent
              is a high-quality, high-price, high-uncertainty seed best monitored toward its next round; if efficacy is
              independently validated and ARR scales, the call would move from track to invest, whereas incumbent
              feature parity would tip it toward the bear case.
            claimRefs:
              - CV001
              - CV002
