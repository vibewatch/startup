        title: TAM, SAM and SOM across multiple lenses
        blocks:
          - type: paragraph
            body: >-
              No single TAM number is reliable here, so the chapter triangulates. The global endpoint security market
              was roughly $18.58 billion in 2025 and about $20.79 billion in 2026, growing near 11.9% toward $32.52
              billion by 2030. Within and beside it, EDR is estimated near $6.33 billion in 2026 and growing far faster
              at about 24% toward $18.68 billion by 2031, while DLP is about $4.67 billion in 2026 growing near 27%
              toward $12.53 billion by 2030. The broader XDR and AI-SOC opportunity is sized from $33.4 billion in 2025
              to $89 billion by 2031, but with the loosest scope. Independent analysts disagree at the margins because
              they scope these segments differently, and those disagreements are preserved as a diligence item rather
              than averaged away.


              Combining endpoint, EDR and DLP gives an order-of-magnitude multi-segment reference above $30 billion
              before de-duplication, and a defensible 2026 SAM for Ent's combined workspace-security category is roughly
              $25-30 billion. The obtainable SOM, however, cannot be pinned down: Ent has not disclosed per-endpoint or
              per-seat pricing, and there is no public Ent-specific SAM or SOM calculation, so the startup-addressable
              slice remains only partly estimable and rests on category proxies.
