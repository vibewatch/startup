      - number: '5.2'
        title: Architecture, deployment, dependencies and roadmap
        blocks:
          - type: paragraph
            body: >-
              Architecturally, Ent is a hybrid edge-plus-cloud design: AI inference models run on the device for
              low-latency, real-time intent scoring, while the control plane, storage and forensic record live in the
              customer's own cloud to preserve data sovereignty. The agent is generally available across Windows, macOS,
              Linux and browser extensions, and deploys as a lightweight component that integrates into existing
              enterprise endpoints and security workflows. Its critical dependencies are the endpoint operating systems,
              browser-extension APIs, local device compute and the customer's cloud environment, and like any EDR-class
              agent it must balance observability against device resource use.


              The roadmap, as described at launch, spans AI governance, threat prevention, security integrations -
              connecting to SIEM, SOAR and identity systems - and multimodal endpoint intelligence that would extend
              observation to richer signals. Shipping across four endpoint surfaces at general availability indicates
              meaningful engineering maturity, and the on-device approach reduces cloud round-trips, supporting the
              company's sub-second intervention claims. Still, the planned integration and multimodal items are
              directional rather than shipped, so the maturity assessment separates what is generally available today
              from what remains prospective on the roadmap. Hiring activity across security research, AI engineering and
              platform roles is a further developer-side signal that build velocity is being sustained after launch
              rather than tapering.
