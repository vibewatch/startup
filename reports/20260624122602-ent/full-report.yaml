  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: direct, incumbent, adjacent and entrants'
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape Ent enters is crowded and concentrated. Its most direct competitors are endpoint
              platforms - CrowdStrike Falcon and SentinelOne Singularity - that pair AI-driven detection with autonomous
              response. The dominant incumbent is Microsoft Defender for Endpoint, distributed through Microsoft 365 E5
              bundling, which gives it near-zero marginal cost to a vast installed base. Platform consolidators such as
              Palo Alto Cortex XDR, alongside established incumbents Broadcom-owned Symantec, Trend Micro Vision One and
              Cybereason, round out the endpoint field.


              Bordering Ent's use cases are the data-loss-prevention and insider-risk specialists - Proofpoint, Varonis
              and DTEX - whose data-security and behavioral-analytics depth overlap with Ent's insider-risk and DLP
              claims. The status-quo substitute Ent displaces is reactive detection-and-alerting plus manual
              investigation, which the company frames as too slow for AI-accelerated attacks. Large enterprises could in
              principle build internal monitoring, but the intent-inference models are difficult to replicate, limiting
              build-versus-buy substitution. Finally, a cohort of new AI-agent-security entrants is forming to chase the
              same emerging AI-governance budget Ent targets, making the entrant frontier as important as the
              established field. In short, Ent is squeezed between deeply funded public platforms above and nimble
              specialists beside it, so its landscape position is best understood as a new wedge rather than a head-on
              replacement for any single incumbent category.
            claimRefs:
              - CP001
              - CP002
              - CP003
