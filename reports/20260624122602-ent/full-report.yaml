  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies and substitutes
        blocks:
          - type: paragraph
            body: >-
              Ent sits at the intersection of four security budgets: endpoint security, data loss prevention, insider
              risk management and the emerging category of AI governance. Drawing the boundary before sizing matters,
              because Ent is an on-device agent that competes most directly with endpoint protection and EDR for
              placement on the device, while its differentiated value is in inferring intent for insider risk and
              governing both human users and AI agents. Gartner's definition of an endpoint protection platform as
              software deployed on devices to prevent and detect malicious activity anchors the core, and adjacent
              categories such as UEBA, CASB, EDR and AI governance border the perimeter.


              On this boundary, the spend Ent can credibly address includes on-device protection, content inspection and
              exfiltration control, behavioral insider-risk investigation, and controls over AI-agent actions. It
              excludes network firewalls, pure SIEM, and managed-SOC labor, which are adjacent but not on the endpoint.
              The status-quo substitutes Ent displaces are legacy DLP suites, EDR alerting workflows and manual
              insider-risk investigation, all of which the company argues are reactive. XDR and AI-SOC are treated as
              adjacent rather than core to avoid double counting in the sizing that follows. The practical test for
              inclusion is whether a budget line is spent on the device or workspace where Ent's agent runs, which keeps
              the boundary tight and defensible for the diligence reader rather than inflating the headline opportunity
              with loosely related security spend.
            claimRefs:
              - CM001
              - CM022
              - CM023
              - CM025
              - CM027
              - CM031
