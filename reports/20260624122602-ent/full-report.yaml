      - number: '8.3'
        title: Returns, exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              A seed investor's return depends on Ent reaching a multi-billion outcome given the large implied entry
              valuation, with exit paths most plausibly an acquisition by a platform incumbent or, less likely
              near-term, an IPO. The endpoint and XDR markets' size and growth support a large potential outcome if Ent
              executes, and a robust cybersecurity funding climate supports a strong next round. CrowdStrike and
              SentinelOne prove the public-market value of scaled endpoint security, anchoring the upside, while the
              comparable set spanning public leaders, a marquee private round and recent M&A gives a defensible
              valuation envelope.


              The investment KPIs to track are ARR growth, net revenue retention, the conversion of anonymous proof into
              named references, and the false-positive rate as an efficacy signal, all against a strong $100 million
              balance sheet. The final diligence asks - ARR and pricing, independent efficacy benchmarks, cap table and
              preferences, named customer references, and burn and runway - are the gating items required before moving
              from track to invest. The thesis-break triggers are concrete: incumbent feature parity, sustained false
              positives, a failed marquee deployment or stalled financing. The single most decisive milestone is
              published, independent efficacy validation at a named customer; clearing it, with scaling ARR, would flip
              the recommendation from track to invest.
