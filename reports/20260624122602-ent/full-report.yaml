      - number: '7.2'
        title: Operational, dependency and competition risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the dominant risk is efficacy. Real-time intent inference can produce false positives that
              block legitimate work and erode trust, and Ent's sub-second inference and accuracy claims have not been
              independently benchmarked - the reason the efficacy risk is rated high-likelihood and high-impact. A
              fleet-wide on-device agent also carries reliability and performance risk if it degrades devices or fails,
              and the threat environment of costly breaches and shrinking dwell time validates demand while raising the
              stakes of getting prevention wrong. Verizon breach data shows human-driven and credential-based incidents
              remain dominant, and IBM data shows multimillion-dollar average breach costs, both reinforcing the value
              but also the consequence of failure.


              On dependencies and competition, Ent relies on each customer's cloud to host its control plane and
              forensic store, and on endpoint operating-system and browser APIs that could change. The most acute
              dependency is competitive: Microsoft and CrowdStrike pose concentrated risk through distribution and
              bundling, and competition risk compounds execution risk because incumbents can out-distribute Ent while it
              must still prove efficacy. Data-sovereignty obligations in defense and finance could further constrain
              deployments. Risks also transmit across domains - a privacy enforcement action or efficacy failure could
              stall sales, raise burn and force a financing event - so these exposures cannot be assessed in isolation.
            claimRefs:
