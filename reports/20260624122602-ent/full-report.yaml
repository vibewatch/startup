      - number: '2.3'
        title: Buyers, demand drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The economic buyer for Ent is the enterprise CISO, with security operations, IT and compliance as
              influencers, and budget ownership sitting primarily inside the security organization with overlap into IT
              and compliance. Ent's disclosed verticals - financial services, hospitality and defense - map to
              recognizable buying centers and adoption triggers: regulatory and fraud pressure in finance,
              distributed-workforce risk in hospitality, and national-security mandates in defense. The adoption path
              typically runs from a targeted pilot through vertical rollout to enterprise-wide deployment, gated by
              efficacy proof and the consolidation of point tools.


              On the demand side, AI-accelerated attacks are compressing dwell time and raising the value of prevention,
              the proliferation of autonomous AI agents is opening a new AI-governance budget line, and tightening
              data-protection regulation sustains DLP spend; endpoint proliferation and remote work expand the footprint
              further. The constraints are equally concrete. Microsoft's bundling of Defender into M365 E5 raises
              switching costs, North America concentrates spend, and skeptical coverage about false positives and
              unproven benchmarks means trust-based adoption can be slow. The net market read is a large, fast-growing,
              but incumbent-anchored opportunity where Ent's prevention thesis is most valuable precisely where AI is
              accelerating attacks.
