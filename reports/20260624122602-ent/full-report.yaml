      - number: '1.2'
        title: Founders, advisory bench and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Ent was co-founded by Elias Manousos and Brandon Dixon, two veterans of RiskIQ. Manousos co-founded and
              led RiskIQ for roughly fourteen years before Microsoft acquired it in July 2021 in a deal reported at more
              than $500 million, after which he served as a Microsoft corporate vice president for AI Copilot for
              Security and threat intelligence. Dixon co-founded PassiveTotal, which RiskIQ acquired, and later worked
              as a Security AI Strategist at Microsoft where he spearheaded the launch of Microsoft Security Copilot.
              This is unusually strong founder-market fit for an endpoint and AI-governance security company.


              That strength carries a corresponding key-person concentration. The two co-founders previously built and
              sold a company together, and the WSJ-reported headcount of roughly 100 is small relative to incumbents, so
              execution leans heavily on the founding pair. Ent has bolstered credibility with an advisory bench that it
              says includes former CISOs of Google, Aetna and MassMutual, a former NSA director, and a former Microsoft
              corporate vice president for Azure cloud security. Investor leads such as Decibel's Jon Sakoda add
              governance influence, but the full board composition and which investors hold seats or information rights
              are not publicly disclosed and remain a diligence item.
