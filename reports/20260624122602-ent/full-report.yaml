      - number: '6.1'
        title: Customer base segmentation and vertical evidence
        blocks:
          - type: paragraph
            body: >-
              Ent disclosed on stealth exit in June 2026 that its platform is deployed across Global 2000 enterprises in
              three verticals: hospitality, financial services, and defense. These three segments represent Ent's stated
              early adopter base and define the credible customer scope for diligence. The economic buyer in all three
              is the enterprise CISO, with security operations and compliance functions as co-stakeholders. The payer
              sits primarily within the CISO's security budget, with partial overlap into IT and compliance program
              funds depending on the use case.


              Financial services is the strongest signal vertical: a public institution's insider-threat lead provided
              the only named testimonial in public evidence, citing low time-to-value. Financial institutions are also
              the most active buyers of insider-threat tooling across the industry, driven by regulatory pressure, fraud
              risk, and the high cost of insider-driven breaches. Hospitality maps to Ent's last-mile threat-prevention
              use case, where distributed workforces and high data-access density create acute endpoint risk. Defense is
              the most strategically distinctive vertical: In-Q-Tel's participation in the seed round provides an
              implicit validator for the national-security applicability of the platform, and CISA guidance confirms
              that federal agencies actively build insider-threat detection programs across the lifecycle.


              The global enterprise security market context confirms structural demand across all three verticals. IBM's
              data breach research shows that organizations using AI-driven security tools achieve substantially lower
              breach costs and faster containment, while Verizon's DBIR confirms that a meaningful share of breaches
              involve internal actors through error, misuse, or compromised credentials. These independent data points
              validate Ent's buyer problem thesis even if they do not directly corroborate Ent's specific deployments.
              Beyond the three disclosed verticals, technology and SaaS enterprises are a logical next segment given the
              AI-agent governance use case, but no customer evidence for that vertical exists publicly as of June 2026.
