      - number: '3.2'
        title: Capability, pricing and go-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, Ent's differentiation is sharp: it claims real-time intent inference rather than
              after-the-fact signature or behavior matching, and uniquely says it evaluates the intent of both human
              users and AI agents - a scope no incumbent yet matches. It hosts in the customer's own cloud for data
              sovereignty, contrasting with the vendor-cloud model of CrowdStrike, SentinelOne and Defender. Both
              CrowdStrike and SentinelOne, however, push autonomous AI-driven response as their own core differentiator,
              and incumbents currently have only limited dedicated AI-agent governance, the precise gap Ent attacks.


              On pricing, the field is well understood while Ent's is not. CrowdStrike Falcon lists at roughly $100 or
              more per endpoint per year and SentinelOne near $80 for core tiers, while Microsoft Defender is
              effectively free to E5 holders - a powerful anchor. Ent has disclosed no pricing, so the comparison
              preserves that gap explicitly. On go-to-market, Microsoft and CrowdStrike wield outsized distribution
              through existing enterprise relationships, whereas Ent must sell a new agent into security organizations
              one vertical at a time. On trust and regulatory posture, Ent's customer-cloud hosting is a credible
              advantage for regulated buyers wary of vendor-cloud data exposure, and it may also ease procurement in
              defense and financial-services accounts where data-residency requirements complicate adopting
              vendor-hosted security telemetry.
