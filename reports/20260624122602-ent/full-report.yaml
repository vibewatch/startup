      - number: '5.3'
        title: Differentiation, trust, privacy and compliance
        blocks:
          - type: paragraph
            body: >-
              Ent's technical differentiation is inferring intent in real time across both human users and AI agents,
              rather than matching known-bad signatures after the fact, and it positions this as a complement that can
              sit alongside existing EDR. The proprietary asset underpinning the approach is its workspace-behavior
              training data, and intent-based controls map conceptually to behavior-analytics techniques catalogued in
              MITRE ATT&CK. The clearest risk is efficacy: real-time intent inference can produce false positives that
              disrupt legitimate activity, and no independent third-party benchmark of Ent's accuracy has been
              published, leaving real-world efficacy externally unvalidated.


              On trust and compliance, customer-cloud hosting keeps sensitive telemetry inside the customer's
              environment, supporting data-residency requirements, while privacy and data-minimization controls are
              essential for lawful employee monitoring. Recognized control catalogs such as NIST SP 800-53 define the
              access, audit and monitoring expectations enterprise buyers bring, and aligning to OWASP, CSA AI guidance
              and MITRE ATT&CK is how Ent can make a novel approach auditable. The net read is a credible,
              well-architected platform with a genuine wedge whose differentiation is strong but whose efficacy and
              privacy posture still require independent verification.
