      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Privacy regulation is a first-order, global exposure
            body: >-
              Endpoint monitoring of employees triggers GDPR purpose-limitation and proportionality duties, EDPB
              monitoring guidance, EU AI Act obligations on inference systems, plus US CCPA and FTC enforcement risk -
              all at once. Civil-liberties groups warn that pervasive workplace surveillance carries legal and
              reputational risk, making a documented privacy and AI-governance posture essential.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR008
              - CR032
          - type: callout
            title: Unproven efficacy meets dominant incumbents
            body: >-
              Ent's intent-inference and sub-second claims are not independently benchmarked, while Microsoft and
              CrowdStrike can out-distribute it through bundling. These risks compound: incumbents win on distribution
              while Ent must still prove it works, and a failed marquee deployment or incumbent feature parity is a
              clear thesis-break trigger.
            calloutType: risk
            claimRefs:
              - CR011
              - CR014
              - CR021
              - CR029
          - type: callout
            title: Pedigree, capital and governance are real offsets
            body: >-
              The founders' Microsoft and RiskIQ pedigree, a tier-1 investor syndicate, customer-cloud data sovereignty,
              and an advisory board including a former NSA director and former CISOs partially mitigate execution,
              financing and regulatory risk - though none substitutes for published efficacy evidence.
            calloutType: strength
            claimRefs:
              - CR019
