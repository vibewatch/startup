  topStrengths:
    - Elite founder-market fit anchored by RiskIQ and Microsoft security leadership.
    - Large, fast-growing market across endpoint security, DLP, insider risk and AI governance.
    - Lightweight on-device architecture and customer-cloud hosting create a differentiated prevention-first product story.
  topRisks:
    - No independent public benchmark validates Ent's intent-inference accuracy or false-positive rate.
    - Revenue, ARR, pricing, retention, valuation and customer concentration remain undisclosed.
    - Large incumbents such as Microsoft, CrowdStrike and SentinelOne can bundle adjacent capabilities and compress Ent's wedge.
    - Workplace monitoring, privacy and AI-governance regulation can complicate adoption in regulated geographies.
