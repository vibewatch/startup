companyProfile:
  summary: Ent is a seed-stage cybersecurity startup founded in 2025 by RiskIQ veterans Elias Manousos and Brandon Dixon. The company emerged from stealth on 2026-06-16 with a $100M seed round led by Decibel and positioned its product as an intent-aware workspace security layer that observes human and AI-agent activity on the endpoint, infers intent in real time, and intervenes before data exfiltration or insider-risk incidents complete. The public debate is whether exceptional founder pedigree and a large market can outrun thin disclosed customer proof, undisclosed economics and unbenchmarked efficacy.
  foundedDate: '2025-01-01'
  founders:
    - name: Elias Manousos
      role: Co-founder & CEO
      background: RiskIQ co-founder and former Microsoft security executive after RiskIQ's reported $500M+ sale.
      claimRefs: [CO005, CO006, CO007, CO008]
    - name: Brandon Dixon
      role: Co-founder
      background: PassiveTotal co-founder and former Microsoft Security Copilot leader with deep AI-security product experience.
      claimRefs: [CO005, CO009, CO010]
  foundingLocation: San Francisco Bay Area, California, USA
  headquarters: San Francisco, California, USA
  productSummary: Lightweight on-device AI agent for Windows, macOS, Linux and browser environments that infers user and AI-agent intent in real time to support insider-risk detection, AI governance, DLP, last-mile threat prevention and incident investigation.
  customerFocus: Global 2000 enterprises, especially hospitality, financial services, defense and other regulated environments.
  businessModel: Enterprise security software sold into the CISO budget, likely priced per endpoint or seat, with customer-cloud deployment and attached policy, governance and investigation workflows.
  stage: Seed-stage private
  fundingStatus: $100M seed announced on 2026-06-16 led by Decibel with Sequoia, Craft Ventures, Crosspoint Capital, Shield Capital, Felicis and In-Q-Tel participating; no post-money valuation disclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO015, CO018, CO021, CE001, CE005]
