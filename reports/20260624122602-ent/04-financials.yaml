- id: cost-and-traction
  title: Cost structure, unit economics and public traction
  body: |-
    On cost structure, an on-device SaaS agent can achieve high software gross margins once delivery scales - comparable security SaaS companies report margins commonly in the 70-80%-plus range. Ent's customer-cloud hosting shifts some infrastructure cost to the customer, which can help hosting gross margin, but it adds non-trivial onboarding and support cost for each enterprise deployment. The most capital-intensive element is building proprietary intent-inference AI models, which is talent- and research-intensive and front-loads cost ahead of revenue.

    On public traction, Ent has disclosed roughly 100 employees and general availability across Windows, macOS, Linux and browser extensions, but no revenue, ARR, burn or margin figures - all of which are private at seed stage. Third-party trackers list it as an early-stage, recently funded company without financial detail. Comparable benchmarks are demanding: category-defining security startups such as Wiz reached $100 million ARR in roughly eighteen months, and CrowdStrike and SentinelOne show subscription endpoint security scaling to billions in high-margin recurring revenue. Ent's potential is real, but its actual unit economics are presently unmeasurable from public evidence, so any contribution-margin or payback estimate carried here should be treated strictly as a comparable-derived placeholder pending management data.
  claimRefs:
