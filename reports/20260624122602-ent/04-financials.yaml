- id: capital-and-verdict
  title: Capital adequacy, runway and financial verdict
  body: |-
    Ent has raised $100 million in seed financing - its only disclosed round - led by Decibel with a tier-1 syndicate. At a typical burn for a roughly 100-person security startup investing heavily in AI R&D, that capital implies an estimated eighteen-to-twenty-four-month runway, sensitive to hiring pace, with proceeds most likely directed to engineering, model development, go-to-market and enterprise support. No debt or project-finance obligations have been disclosed. The next financing round will most plausibly be triggered by demonstrated Global 2000 traction and ARR milestones, and the robust cybersecurity funding climate supports Ent's ability to raise follow-on capital.

    The financial verdict is that Ent is well-capitalized but evidence-thin. Revenue quality is unproven, resting on early deployments rather than disclosed recurring revenue, and a $100 million seed sets a high performance bar with elevated burn expectations - skeptical coverage warns the round compresses the margin for execution error. The principal diligence blockers are undisclosed pricing, revenue, ARR, burn rate, runway and valuation. The financing dependency is therefore high until Ent demonstrates recurring revenue, making ARR milestones the decisive metric for the next round. Taken together, the chapter's financial read is that capital adequacy is a present strength while revenue quality and burn discipline remain unverified, and both must be confirmed before any valuation or return conclusion can be defended.
