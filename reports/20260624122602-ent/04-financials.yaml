chapter:
  number: 4
  title: Financials
  summary: Ent has raised a single $100M seed, runs a SaaS subscription model with undisclosed pricing, and likely has an estimated 18-24 month runway; comparable security SaaS implies a 70-80%+ gross-margin path, but revenue, ARR, burn and valuation are all undisclosed, leaving every core financial metric a diligence blocker.
sections:
- id: revenue-and-gtm
  title: Revenue model, pricing and go-to-market
  body: |-
    Ent runs a SaaS subscription business, most likely priced per endpoint or per seat, though it has disclosed no pricing or list rates at launch. Its revenue mix is presently concentrated in early Global 2000 deployments across financial services, hospitality and defense, with an AI-governance module and professional-services onboarding as emerging and prospective streams. Because the platform is hosted in each customer's own cloud, enterprise onboarding is a real services component rather than a pure self-serve motion.

    The go-to-market is a direct enterprise motion selling into CISO security organizations. That motion carries the sales-efficiency drag typical of enterprise security, where cycles commonly run six to twelve months or longer. At seed stage these efficiency measures are unobservable externally, so only proxies from comparable cloud and security SaaS apply. Reference pricing from incumbents - roughly $100 or more per endpoint per year for CrowdStrike, near $80 for SentinelOne core tiers, and effectively bundled for Microsoft Defender within E5 - frames Ent's likely per-endpoint monetization, but Ent's own economics remain undisclosed and must be obtained directly in diligence. The practical implication is that, at this stage, revenue modeling for Ent is necessarily a scenario exercise anchored to comparable per-endpoint economics rather than to any figure the company itself has confirmed.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
