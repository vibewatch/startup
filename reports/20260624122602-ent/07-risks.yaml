- id: people-financial-mitigation
  title: People, financial risk and mitigations
  body: |-
    On people and execution, key-person dependence on co-founders Elias Manousos and Brandon Dixon is acute for a roughly 100-person company, and a $100 million seed sets a high performance bar with elevated burn that is itself an execution risk if traction lags. Expanding beyond three verticals strains a small team, and the single anonymous customer reference leaves execution evidence thin. Financially, model risk is high because revenue, pricing and unit economics are undisclosed, and burn-and-runway risk is material against an estimated eighteen-to-twenty-four-month runway. Reputational risk is elevated by skeptical coverage questioning whether the prevention claims are truly differentiated.

    These risks have real offsets and mitigations. The founders' Microsoft and RiskIQ pedigree partially mitigates execution and credibility risk, a tier-1 investor syndicate eases financing risk while raising valuation expectations, and customer-cloud hosting plus an advisory board including a former NSA director and former CISOs help navigate regulation and sovereignty. But mitigation ultimately depends on demonstrable efficacy evidence Ent has not yet published. Investors should monitor false-positive rates, deployment renewals, regulatory filings and competitor releases, and treat sustained false-positive complaints, a privacy enforcement action, incumbent feature parity or a failed marquee deployment as explicit thesis-break triggers. Overall, the profile is high-variance: a credible team and capital set against unproven efficacy, heavy regulation and dominant incumbents.
