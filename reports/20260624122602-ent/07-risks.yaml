chapter:
  number: 7
  title: Risks
  summary: 'Ent''s risk profile is high-variance: first-order global privacy/AI regulation on employee monitoring (GDPR, EU AI Act, CCPA, FTC), unproven and un-benchmarked efficacy with false-positive exposure, concentrated incumbent competition from Microsoft and CrowdStrike, acute key-person dependence and undisclosed financials - partly offset by founder pedigree, tier-1 capital, customer-cloud sovereignty and a strong advisory board.'
sections:
- id: regulatory-risk
  title: Regulatory and legal risk
  body: |-
    Ent's single largest structural exposure is regulatory. Because the platform monitors how employees and AI agents act on the endpoint, it triggers significant privacy and data-protection obligations across multiple regimes simultaneously. In the EU, GDPR constrains workplace monitoring through purpose-limitation, proportionality and lawful-basis requirements, and the European Data Protection Board has issued guidance restricting intrusive employee monitoring. The EU AI Act adds a second layer: intent-inference systems could be classified as higher-risk, raising documentation and conformity costs. NIST's AI Risk Management Framework signals the governance expectations regulators will increasingly apply.

    In the United States, state privacy laws such as the CCPA grant data rights over monitoring data, and the FTC has a track record of enforcement against unfair or deceptive data practices. Civil-liberties groups warn that pervasive workplace surveillance carries legal and reputational risk. This regulatory complexity is genuinely global and concurrent, spanning EU GDPR and the AI Act alongside US state and federal regimes, and AI-agent governance is an emerging frontier where rules are still forming, creating compliance uncertainty. Insider-threat programs also face heightened government scrutiny, which is simultaneously a demand driver and a compliance obligation. A documented privacy and AI-governance posture is therefore essential, yet Ent has disclosed none publicly.
  claimRefs:
  - CR002
  - CR003
  - CR004
  - CR005
