      - number: '3.2'
        title: 能力、定价和商业化对比
        blocks:
          - type: paragraph
            body: >-
              能力上，Ent 的差异化很尖锐：它主张实时意图推断，而不是事后签名或行为匹配；并且独特地表示会评估人类用户和 AI 代理的意图——这个范围尚无现有巨头完全匹配。它把平台托管在客户自有云中以保障数据主权，这与
              CrowdStrike、SentinelOne 和 Defender 的厂商云模式形成对比。不过，CrowdStrike 和 SentinelOne 也把 AI
              驱动的自主响应推为自身核心差异点；现有巨头目前只有有限的专门 AI 代理治理能力，正是 Ent 攻击的缺口。


              定价上，行业清楚，Ent 不清楚。CrowdStrike Falcon 标价约每终端每年 $100 或以上，SentinelOne 核心档约 $80，而 Microsoft Defender 对 E5
              持有者实际上免费——这是强锚点。Ent 未披露定价，因此对比必须明确保留这个缺口。商业化上，Microsoft 和 CrowdStrike 依靠既有企业关系拥有超大分发，而 Ent
              必须把一个新代理逐个垂直行业卖进安全组织。信任和监管姿态上，Ent
              的客户云托管对担心厂商云数据暴露的受监管买方是可信优势；在防务和金融服务账户中，数据驻留要求会让采用厂商托管安全遥测更复杂，这一模式也可能降低采购阻力。
