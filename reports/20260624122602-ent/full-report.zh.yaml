      - number: '2.3'
        title: 买方、需求驱动和采用约束
        blocks:
          - type: paragraph
            body: >-
              Ent 的经济买方是企业 CISO，安全运营、IT 和合规是影响方；预算所有权主要在安全组织内，同时与 IT 和合规有重叠。Ent
              披露的垂直行业——金融服务、酒店和防务——对应清晰的购买中心和采用触发点：金融业的监管与欺诈压力，酒店业的分布式劳动力风险，以及防务领域的国家安全要求。采用路径通常从定向试点开始，经垂直推广，再到全企业部署；有效性证明和点工具整合会决定闸门。


              需求侧也很清楚：AI 加速攻击压缩驻留时间，提高预防价值；自主 AI 代理扩散打开新的 AI 治理预算线；数据保护监管收紧支撑 DLP 支出；终端增多和远程办公进一步扩大覆盖面。约束同样具体。Microsoft
              把 Defender 捆进 M365 E5，提高切换成本；北美集中支出；围绕误报和未证明基准的怀疑性报道，意味着基于信任的采用可能很慢。净市场判断是：机会大、增速快，但被现有巨头锚定；Ent 的预防主题在 AI
              加速攻击的场景中最有价值。
