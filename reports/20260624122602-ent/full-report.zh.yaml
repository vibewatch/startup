      - number: '8.3'
        title: 回报、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              由于隐含入场估值很高，种子投资人的回报取决于 Ent 能否走到数十亿美元级结果；最可能的退出路径是被平台型 incumbent 收购，近期 IPO 可能性较低。若 Ent 执行到位，endpoint 和 XDR
              市场的规模与增速支持较大的潜在结果；网络安全融资环境强劲，也支撑下一轮融资。CrowdStrike 和 SentinelOne 证明了规模化 endpoint security
              在公开市场的价值，锚定上行空间；公开龙头、标志性私募轮和近期 M&A 组成的可比集合，则给出一个可防守的估值区间。


              需要跟踪的投资 KPI 是 ARR 增长、净收入留存、匿名证明转化为具名客户背书，以及作为效果信号的误报率，并且都要放在 $100 million 资产负债表背景下看。最终尽调问题——ARR
              与定价、独立效果基准、cap table 与优先权、具名客户背书、burn 与 runway——是从跟踪转向投资前必须过关的 gating items。Thesis-break 触发器很具体：incumbent
              功能追平、持续误报、标杆部署失败或融资停滞。最关键的里程碑，是在具名客户处发布独立效果验证；若同时 ARR 扩张，建议就会从跟踪翻到投资。
