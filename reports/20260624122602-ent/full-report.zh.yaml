  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层和垂直证据
        blocks:
          - type: paragraph
            body: >-
              Ent 于 2026 年 6 月走出隐身模式时披露，其平台已部署在三个垂直行业的 Global 2000 企业中：酒店、金融服务和防务。这三个细分市场代表 Ent
              声称的早期采用者基础，也定义了尽调中可信的客户范围。三类客户的经济买方都是企业 CISO，安全运营和合规职能共同参与。付款方主要在 CISO 的安全预算内，并根据用例部分重叠到 IT 和合规项目资金。


              金融服务是信号最强的垂直行业：一家公共机构的内部威胁负责人提供了公开证据中唯一的具名类型推荐语，提到价值兑现时间短。受监管压力、欺诈风险和内部驱动泄露的高成本推动，金融机构也是全行业最活跃的内部威胁工具买方。酒店行业对应
              Ent 的最后一公里威胁预防用例，分布式劳动力和高数据访问密度会带来尖锐终端风险。防务是战略上最有区分度的垂直行业：In-Q-Tel 参与种子轮，为平台的国家安全适用性提供了隐含验证；CISA
              指导也确认，联邦机构会在整个生命周期内主动建设内部威胁检测项目。


              全球企业安全市场背景确认了三类垂直行业的结构性需求。IBM 的数据泄露研究显示，使用 AI 驱动安全工具的组织能显著降低泄露成本并更快遏制事件；Verizon 的 DBIR
              也确认，相当比例的泄露涉及内部人员，方式包括错误、滥用或凭证被攻陷。这些独立数据点验证了 Ent 的买方问题论点，即便不能直接证实 Ent 的具体部署。除三个已披露垂直行业外，鉴于 AI 代理治理用例，技术和
              SaaS 企业是合乎逻辑的下一细分市场；但截至 2026 年 6 月，该垂直行业没有公开客户证据。
