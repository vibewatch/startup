  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域和替代方案
        blocks:
          - type: paragraph
            body: >-
              Ent 位于四类安全预算的交汇处：终端安全、数据防泄漏、内部风险管理，以及新兴的 AI 治理。先划边界再做规模测算很重要，因为 Ent 是端侧代理，部署位置上最直接与终端防护和 EDR
              竞争；差异化价值则来自推断内部风险意图，并治理人类用户和 AI 代理。Gartner 对终端防护平台的定义——部署在设备上、用于预防和检测恶意活动的软件——锚定了核心范围；UEBA、CASB、EDR 和 AI
              治理等相邻品类构成外围。


              在这个边界内，Ent 能可信触达的支出包括端侧防护、内容检查和外泄控制、行为型内部风险调查，以及对 AI 代理动作的控制。网络防火墙、纯 SIEM 和托管 SOC 人力则被排除在外，它们相邻但不在终端上。Ent
              要替换的现状方案是传统 DLP 套件、EDR 告警工作流和人工内部风险调查；公司认为这些都偏反应式。XDR 和 AI-SOC 被视为相邻而非核心，以避免后续规模测算重复计算。纳入的实际测试是：预算是否花在 Ent
              代理运行的设备或工作区上。这让边界对尽调读者足够紧、也足够可辩护，而不是用松散相关的安全支出来抬高标题机会。
