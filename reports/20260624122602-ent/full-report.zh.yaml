      - number: '1.2'
        title: 创始人、顾问阵容和关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Ent 由 Elias Manousos 和 Brandon Dixon 共同创立，两人都是 RiskIQ 老将。Manousos 联合创立并领导 RiskIQ 约十四年，Microsoft 于 2021 年 7
              月收购 RiskIQ，据报交易额超过 $500M；之后他在 Microsoft 担任 AI Copilot for Security 和威胁情报企业副总裁。Dixon 联合创立 PassiveTotal，后者被
              RiskIQ 收购；此后他在 Microsoft 担任 Security AI Strategist，并主导 Microsoft Security Copilot 发布。对一家终端和 AI
              治理安全公司来说，这样的创始人—市场匹配度异常强。


              强履历也带来相应的关键人集中。两位联合创始人此前一起创办并出售过公司，WSJ 报道团队约 100 人，相比现有巨头规模很小，因此执行高度压在创始二人身上。Ent 也用顾问阵容补强可信度；公司称顾问包括
              Google、Aetna 和 MassMutual 前 CISO、一名前 NSA 局长，以及 Microsoft 前 Azure 云安全企业副总裁。Decibel 的 Jon Sakoda
              等领投方会带来治理影响力，但完整董事会构成，以及哪些投资人持有席位或信息权，尚未公开披露，仍是尽调项。
