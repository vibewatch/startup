        blocks:
          - type: paragraph
            body: >-
              Ent 于 2026 年 6 月 16 日宣布 $100M 种子轮融资，由 Decibel 领投，Sequoia、Craft Ventures、Crosspoint Capital Partners、Shield
              Capital、Felicis 和 In-Q-Tel 参投。这使该轮成为网络安全史上规模最大的种子轮之一，也让公司单轮累计融资达到 $100M。In-Q-Tel 的出现把 Ent
              连接到美国国家安全买方，Crosspoint 则增加网络安全专门私募股权背书。值得注意的是，公司没有披露具体投后估值，只使用独角兽区间语言，也没有公布收入、ARR 或具名客户。


              里程碑记录紧凑而集中：2025 年隐身创立；2026 年中同步公开、融资并推出平台 GA；披露在酒店、金融服务和防务领域已有 Global 2000 部署；计划于 8 月亮相 Black Hat USA
              2026。The Next Web 和 DLP Test 的怀疑性报道提醒，预防叙事已不再逆势，意图检测和低误报主张也缺少公开的独立基准。因此，更合适的定位是：Ent
              是一家资本充足、履历很强的种子期公司，但叙事目前领先于可独立核验的运营证据。
