      - number: '7.3'
        title: 人员、财务风险与缓释因素
        blocks:
          - type: paragraph
            body: >-
              人员与执行层面，对联合创始人 Elias Manousos 和 Brandon Dixon 的关键人依赖很重；对一家约 100 人的公司而言，$100 million 种子轮也把业绩门槛抬得很高，较高 burn
              本身就是执行风险，一旦 traction 滞后会更明显。公司若从三个垂直行业继续外扩，小团队会被拉紧；唯一匿名客户背书也让执行证据偏薄。财务上，收入、定价和单位经济均未披露，模型风险较高；按估算十八至二十四个月
              runway 看，burn 与 runway 风险也不轻。质疑预防主张是否真正差异化的怀疑性报道，则抬高了声誉风险。


              这些风险确有抵消和缓释因素。创始人的 Microsoft 和 RiskIQ 履历部分缓释了执行与可信度风险；一级投资人 syndicate 降低融资风险，同时也抬高估值预期；客户云托管，加上包括前 NSA
              局长和前 CISO 在内的顾问委员会，有助于处理监管与主权问题。但缓释最终仍取决于 Ent
              尚未发布的、可验证的效果证据。投资人应持续跟踪误报率、部署续约、监管文件和竞品发布，并把持续误报投诉、隐私执法行动、incumbent 功能追平或标杆部署失败视为明确的 thesis-break
              触发器。整体看，这是一家高方差公司：团队和资本可信，但效果未证、监管重、incumbents 强。
