    layout: standard
    summary: 企业安全 SaaS 的示意留存基准；公开证据完全没有 Ent 具体留存数据，需在 NDA 下索取。
    data:
      columns:
        - 第 3 个月
        - 第 6 个月
        - 第 12 个月
        - 第 24 个月
      rows:
        - label: 最佳企业安全 SaaS（基准）
          values:
            - 98
            - 95
            - 92
            - 88
        - label: 企业 SaaS 中位数（基准）
          values:
            - 90
            - 85
            - 80
            - 75
        - label: 低留存 SaaS 风险底线（参考）
          values:
            - 80
            - 72
            - 65
            - 55
    approximationNotes: 三行都是示意性基准，来自公开可得的安全 SaaS 留存数据；公开证据中没有 Ent 自身的留存数字。
    claimRefs:
      - CU015
      - CU027
      - CU034
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 按发生可能性和影响程度放置 Ent 的主要风险，效能、监管和竞争落在优先级最高的格子。
    data:
      columns:
        - 可能性
        - 影响
        - 优先级
      rows:
        - label: 效能未证实
          values:
            - 高
            - 高
            - 关键
        - label: 监管 / 隐私
          values:
            - 中
            - 高
            - 高
        - label: 既有厂商竞争
          values:
            - 高
            - 高
            - 关键
        - label: 关键人物依赖
          values:
            - 中
            - 高
            - 高
        - label: 烧钱 / 融资
          values:
            - 中
            - 中
            - 中
        - label: Agent 可靠性
          values:
            - 中
            - 中
            - 中
    approximationNotes: null
    claimRefs:
      - CR001
      - CR011
      - CR014
      - CR015
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 单一领域的冲击会如何外溢：隐私执法或效能失败会传导为销售停滞、烧钱加剧和融资压力。
    data:
      nodes:
        - id: privacy
          label: 隐私执法
        - id: efficacy
          label: 效能失败
        - id: sales
          label: 销售停滞
        - id: burn
          label: 烧钱加剧
        - id: financing
          label: 融资压力
        - id: competition
          label: 既有厂商追平
      edges:
        - from: privacy
          to: sales
          label: 劝退买方
        - from: efficacy
          to: sales
          label: 丢单
        - from: competition
          to: sales
          label: 替代
        - from: sales
          to: burn
          label: 推高
        - from: burn
          to: financing
          label: 迫使融资
    approximationNotes: null
    claimRefs:
      - CR022
      - CR029
      - CR037
      - CR042
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: Ent 对客户云、终端平台、资本提供方和监管环境的外部依赖。
    data:
      nodes:
        - id: ent
          label: Ent
        - id: ccloud
          label: 客户云
        - id: platforms
          label: OS / 浏览器 API
        - id: capital
          label: 资本提供方
        - id: reg
          label: 监管者
      edges:
        - from: ent
          to: ccloud
          label: 托管于
        - from: ent
          to: platforms
          label: 运行于
        - from: ent
          to: capital
          label: 资金来自
        - from: ent
          to: reg
          label: 受其监管
    approximationNotes: null
    claimRefs:
      - CR013
      - CR028
      - CR032
      - CR035
  - id: FV001
    title: 建议逻辑
    type: dag
    layout: standard
    summary: 证据如何导向「跟踪」建议：团队和市场很强，但效能未证实、进入价格高，限制了投资确信度。
    data:
      nodes:
        - id: team
          label: 顶尖团队 + 资本
        - id: market
          label: 大且增长的市场
        - id: efficacy
          label: 效能未证实
        - id: price
          label: 隐含估值高
        - id: rec
          label: 建议：跟踪
      edges:
        - from: team
          to: rec
          label: 支撑
        - from: market
          to: rec
          label: 支撑
        - from: efficacy
          to: rec
          label: 卡住
        - from: price
          to: rec
          label: 卡住
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV026
      - CV041
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 不同前瞻 ARR 和 EV/收入倍数假设下的示意性隐含估值（十亿美元）。
    data:
      items:
        - label: $50M ARR × 15x
          value: 0.75
        - label: $100M ARR × 15x
          value: 1.5
        - label: $100M ARR × 25x
          value: 2.5
        - label: $200M ARR × 25x
          value: 5
    approximationNotes: 示意性情景把公开安全软件倍数套用到假设的前瞻 ARR；Ent 的 ARR 尚未披露。
    claimRefs:
      - CV016
      - CV022
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: Ent 在熊市、基准和牛市结果下的情景估值区间（十亿美元）。
    data:
      items:
        - label: 熊市结果（$B）
          low: 0.1
          high: 0.5
          mid: 0.3
        - label: 基准结果（$B）
          low: 0.5
          high: 1.5
          mid: 1
        - label: 牛市结果（$B）
          low: 5
          high: 10
          mid: 7
    approximationNotes: 鉴于财务数据未披露、进入估值也未正式披露，情景区间只是估算。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV017
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 观察 Ent 走向下一轮融资的关键指标。
    data:
      items:
        - label: ARR 增长
          value: Track
          detail: 目前未披露。
          tone: neutral
        - label: 净收入留存
          value: Track
          detail: 耐久性信号。
          tone: neutral
        - label: 具名客户背书
          value: 0 public
          detail: 把匿名证据转成具名证明。
          tone: negative
        - label: 误报率
          value: Unknown
          detail: 效能信号。
          tone: warning
        - label: 种子轮融资额
          value: $100M
          detail: 资产负债表强劲。
          tone: positive
    approximationNotes: null
    claimRefs:
      - CV024
      - CV019
      - CV038
      - CV039
