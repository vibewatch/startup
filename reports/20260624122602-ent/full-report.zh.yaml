      - number: '6.2'
        title: 采用轨迹和具名客户证明
        blocks:
          - type: paragraph
            body: >-
              Ent 的公开采用证据狭窄，但战略上可信。公司在走出隐身时称平台已在 Global 2000 企业生产环境中使用，这意味着 2026 年 6 月公告前已有真实部署。不过，具体客户数量、ARR
              数字或部署广度指标都未披露。隐身期本身显示 Ent 在公开发布前已有付费客户——相较预收入发布是积极信号，但若没有私有数据，无法评估规模或耐久性。


              具名客户证明集仅限于一条匿名推荐语：一家公共金融机构的内部威胁负责人称，Ent
              是他们第一天使用就觉得自己像专家的第一个工具。这句话指向短价值兑现时间和易用性，两者都是企业安全中的关键购买标准；但它只是来自不可识别来源的单个数据点。没有案例研究、部署规模数字、结果指标或参考账户公开可得。三个已披露垂直行业——酒店、金融服务和防务——出现在
              Ent 新闻稿中，并被 TechCrunch、VentureBurn、SiliconANGLE 和 CityBiz
              等多个独立媒体报道，确认这一披露是有意且广泛传播的。不过，垂直行业是按类别而非账户列出，每个部署的深度仍未知。


              TechCrunch 将 Ent 描述为在公开前已把平台部署到 Global 2000 企业；VentureBurn 提到受监管行业的早期企业客户；SiliconANGLE 同样报道其隐身退出前已有 Global
              2000 客户基础。多个独立媒体在同一公司提供的表述上趋同，提高了对该主张存在性的信心，但并不能独立验证其深度，也不能区分生产部署和主动评估。证据新鲜度很高——所有证明都来自 2026 年 6
              月发布窗口——但数量很薄。尽调必须把当前证明集视为起点，而非验证基线。
