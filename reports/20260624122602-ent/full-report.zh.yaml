              商业化是直销企业动作，卖进 CISO 安全组织。这种销售动作带有企业安全典型的销售效率拖累，周期通常为 6 到 12 个月或更长。种子期外部看不到这些效率指标，因此只能使用可比云和安全 SaaS
              代理。现有巨头参考定价——CrowdStrike 每终端每年约 $100 或以上，SentinelOne 核心档接近 $80，Microsoft Defender 实际被捆进 E5——框定了 Ent
              可能的按终端货币化水平，但 Ent 自身经济性仍未披露，必须在尽调中直接获取。实际含义是，在这个阶段，Ent 的收入建模必然是情景练习，锚定可比的按终端经济性，而不是公司自己确认的任何数字。
