  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              Ent 的投资论点是：意图感知的工作空间安全可能成为企业默认层，由一支来自 RiskIQ 和 Microsoft 的精英创始团队销售；这支团队此前把 RiskIQ 以 $500 million+ 出售给
              Microsoft，证明过价值创造能力；同时，Decibel 领投的一级 syndicate 也给了早期验证。反论点同样清楚：以检测为先的 incumbents 可能把意图感知嵌入现有产品，在 Ent
              扩大规模前将其商品化，压窄 wedge，也让唯一匿名客户背书显得单薄。报告把正反两面按产品、团队、市场、客户和 moat 配对展开，让核心争议更明确。


              建议是跟踪 Ent，而不是立即投资——愿景和履历有吸引力，也有真实早期 traction，但规模化执行未证、财务未披露，市场拥挤且 anchored by
              incumbents。鉴于披露财务和客户证明都偏薄，信心为中等；高方差风险画像支持跟踪，而非立即形成强 conviction。整体看，Ent
              是一个高质量、高价格、高不确定性的种子轮，更适合观察到下一轮；若效果获得独立验证且 ARR 扩张，判断会从跟踪转向投资；若 incumbent 功能追平，则会倒向 bear case。
