      - number: '5.2'
        title: 架构、部署、依赖和路线图
        blocks:
          - type: paragraph
            body: >-
              架构上，Ent 是边缘加云的混合设计：AI 推理模型在设备上运行，以低延迟完成实时意图评分；控制平面、存储和取证记录则放在客户自有云中，以保留数据主权。代理已在 Windows、macOS、Linux
              和浏览器扩展上 GA，并以轻量组件形式部署，接入既有企业终端和安全工作流。关键依赖包括终端操作系统、浏览器扩展 API、本地设备算力和客户云环境；像任何 EDR
              级代理一样，它必须在可观测性和设备资源占用之间取得平衡。


              发布时描述的路线图覆盖 AI 治理、威胁预防、安全集成——连接 SIEM、SOAR 和身份系统——以及多模态终端智能，后者会把观察扩展到更丰富的信号。GA
              时已覆盖四类终端表面，显示出有意义的工程成熟度；端侧路径减少云端往返，也支撑公司关于亚秒级介入的主张。尽管如此，计划中的集成和多模态项目仍是方向性而非已交付，因此成熟度评估必须区分今天已 GA
              的内容和路线图上的前瞻项。安全研究、AI 工程和平台岗位的招聘活动，也从开发侧显示发布后构建速度仍在维持，而非放缓。
