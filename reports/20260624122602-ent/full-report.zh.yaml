      - number: '2.2'
        title: 多重视角下的 TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >-
              这里没有单一 TAM 数字可靠，因此本章做三角测算。全球终端安全市场 2025 年约为 $18.58B，2026 年约为 $20.79B，并以接近 11.9% 的速度增长，预计 2030 年达到
              $32.52B。其内部及旁侧，EDR 预计 2026 年约 $6.33B，并以约 24% 的更快速度增长，2031 年达到 $18.68B；DLP 2026 年约 $4.67B，以接近 27% 增长，2030
              年达到 $12.53B。更宽泛的 XDR 和 AI-SOC 机会从 2025 年的 $33.4B 测算到 2031 年的
              $89B，但口径最松。独立分析师在边缘处存在分歧，因为他们对这些细分市场的范围划分不同；这些分歧被保留为尽调项，而不是简单平均掉。


              合并终端、EDR 和 DLP，可得到去重前超过 $30B 的多细分市场量级参考；Ent 合并后的工作区安全品类，2026 年可防守 SAM 约为 $25-30B。但可获得 SOM 不能被钉牢：Ent
              没有披露按终端或按席位定价，也没有公开的 Ent 专属 SAM 或 SOM 计算，因此初创公司可触达的切片只能部分估算，并依赖品类代理。
