      - number: '3.3'
        title: 切换成本、护城河耐久性和替代风险
        blocks:
          - type: paragraph
            body: >-
              终端安全切换成本高，因为代理要全机队部署并接入 SOC 工作流；现有巨头捆绑——尤其是 Microsoft——形成锁定，抬高任何替代者的门槛。与此同时，企业经常同时使用终端、DLP
              和内部风险工具，这给能把多个点能力折进一个代理的整合型新进入者留下空间。Ent 的竞争准备度，建立在强创始人履历、$100M 弹药和覆盖金融、酒店、防务的早期 Global 2000 部署之上。


              Ent 护城河能否耐久，是核心问题。它的意图推断模型，以及人类加 AI 代理的覆盖范围，确实新颖；但现有巨头可能快速跟进并嵌入相似能力，怀疑性报道也指出，预防叙事已不再逆势，Ent
              没有发布独立基准。最弱的护城河因素是分发，Microsoft 和 CrowdStrike 占优。净判断是，Ent
              拥有真实产品楔子，但规模化尚未证明；它必须靠可展示的有效性和快速价值兑现取胜，而不是靠价格，才能突破现有巨头分发和锁定。若不能很快发布有说服力的有效性证据，最可能的结果是现有巨头吸收意图感知概念，Ent
              被挤到利基位置；这正是尽调读者必须权衡的核心竞争风险。
