  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              Ent 最大的结构性暴露是监管。平台监控员工和 AI 代理在终端上的行为，因此会同时触发多个制度下重大的隐私和数据保护义务。在欧盟，GDPR 通过目的限制、比例性和合法基础要求约束职场监控；European
              Data Protection Board 也发布过限制侵入式员工监控的指导。EU AI Act 增加第二层：意图推断系统可能被归为较高风险，从而提高文档和合规评估成本。NIST 的 AI Risk
              Management Framework 则显示监管者会越来越多施加的治理预期。


              在美国，CCPA 等州隐私法赋予用户对监控数据的数据权利；FTC 也有针对不公平或欺骗性数据实践执法的记录。公民自由组织警告，普遍性职场监视会带来法律和声誉风险。这种监管复杂性是真正全球且并发的：EU GDPR
              和 AI Act 与美国州和联邦制度并行；AI 代理治理仍是规则形成中的新前沿，带来合规不确定性。内部威胁项目也面临更高政府审查，这既是需求驱动，也是合规义务。因此，成文的隐私和 AI 治理姿态必不可少，但
              Ent 尚未公开披露。
