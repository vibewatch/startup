  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、模块和用例
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Ent 是一个轻量级端侧 AI 代理，观察人和 AI
              代理在工作区中的行为，并在安全事件完成前及时介入。它观察浏览器、应用、工作流和数据流动中的信号，然后评估意图，而不是等待已知恶意签名。核心模块包括工作区观察器、基于专门小型 AI
              模型的意图推断引擎、策略执行层、干预层，以及支持后续调查的取证记录。


              平台瞄准五个主要用例：内部风险检测、AI 治理、数据防泄漏、最后一公里威胁预防和事件调查。在每个用例中，代理观察一个动作——用户外泄数据、AI
              代理执行高风险步骤、敏感数据移动、被攻陷会话发起行为——推断意图是否恶意，并通过阻断、警告或放行来介入，同时写入取证时间线。专门治理 AI 代理意图是一项区分能力，也与 OWASP 的 LLM
              和代理风险工作、Cloud Security Alliance
              的新兴指导一致；自主代理引入新的攻击面，推动运行时治理需求。端到端看，这个产品最好被理解为一个位于工作区动作与后果之间的实时决策层，而不是又一个检测器；这正是意图叙事不只是营销标签的原因。
