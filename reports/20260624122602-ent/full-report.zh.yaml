            body: >-
              成本结构上，端侧 SaaS 代理一旦交付规模化，可以实现较高软件毛利率；可比安全 SaaS 公司常见毛利率在 70-80% 以上。Ent
              的客户云托管把部分基础设施成本转移给客户，有利于托管毛利，但每个企业部署也会增加不可忽视的上线和支持成本。资本最密集的部分，是构建专有意图推断 AI 模型；这依赖人才和研究，并把成本提前压在收入之前。


              公开牵引上，Ent 披露约 100 名员工，并在 Windows、macOS、Linux 和浏览器扩展上
              GA，但没有收入、ARR、现金消耗或毛利数据——种子期这些都仍属私有。第三方跟踪器将其列为早期、近期融资公司，未给出财务细节。可比基准很高：Wiz 等定义品类的安全初创公司约十八个月达到 $100M
              ARR；CrowdStrike 和 SentinelOne 则证明订阅型终端安全可以扩至数十亿美元高毛利经常性收入。Ent
              潜力真实，但从公开证据看，实际单位经济性目前无法衡量；因此本报告中的任何贡献毛利或回本估算，都应严格视为可比推导占位，等待管理层数据确认。
