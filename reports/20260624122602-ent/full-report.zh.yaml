chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部、创立和商业模式
        blocks:
          - type: paragraph
            body: >-
              Ent 是一家意图感知型工作区安全公司，2026 年 6 月 16 日走出隐身模式，推出适用于 Windows、macOS、Linux 和浏览器扩展的轻量级端侧 AI
              代理。核心判断是，网络安全需要把预防带回来：用专门的 AI 模型实时评估人类用户和 AI 代理的意图，在事件发生前介入，而不是事后检测。平台托管在客户自有云中，以保留数据主权；公司把用例表述为内部风险检测、AI
              治理、数据防泄漏、最后一公里威胁预防和事件调查。


              公开记录显示 Ent 总部位于加利福尼亚州旧金山，但部分报道使用更宽泛的旧金山湾区口径，建议直接确认。创立时间存在轻微冲突：BankInfoSecurity 称公司成立于 2025 年 5 月，Wall
              Street Journal 称 Ent 于 2025 年启动，而公司直到 2026 年中才公开亮相。最稳妥的标准表述是：一家 2025 年成立、种子期私营公司，在隐身约一年后于 2026
              年高调亮相。ent.ai 品牌背后的法律运营实体曾被非正式关联到 Athena Formation
              Inc.，但主要披露尚未牢固确认这一点，应对照注册文件核验。简言之，身份方向清楚，但若做尽调，几个基础事实仍需一手确认。
