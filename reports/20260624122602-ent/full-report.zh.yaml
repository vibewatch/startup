        title: 留存、耐久性、满意度和集中风险
        blocks:
          - type: paragraph
            body: >-
              Ent 的留存和耐久性证据在公开记录中完全缺席。没有披露 NRR、GRR、队列数据或合同期限信息。单条正面客户推荐语不足以推断留存——它说的是初始使用易度，不是持续参与或续约行为。G2、Capterra 或
              Gartner Peer Insights 上也没有 Ent 作为具体产品的评论条目；考虑到其 2026 年 6 月才走出隐身，以及企业评论平台为新产品积累评分通常存在滞后，这符合预期。


              市场层面的买方满意度对 Ent 定位是方向性正面的：CSO Online 报道安全买方偏好整合的内部风险、DLP 和 AI 治理平台；Help Net Security
              提到对可衡量缩短调查时间的需求；Gartner Peer Insights 的 EDR 评论语料强调，有效性、部署便利性和误报率是买方最重视的标准。Ent
              的匿名客户引用直接回应了部署便利性，显示其与市场层面买方预期一致。不过，The Next Web 和 DLP Test 都把意图推断准确率缺少独立基准列为可信度担忧；买方对未证明预防工具的谨慎，也是 DLP
              市场已有记录的采用风险。


              扩张潜力真实，但账户层面未记录。2026 年企业 DLP 整合趋势利好 Ent 的一体化平台路径；企业工作区内 AI 代理扩散，也为 AI 治理模块创造结构性增购机会。Ent
              的端侧、客户云部署模式降低了受监管买方的数据主权阻力，这是实质采购优势。不过，集中风险和渠道依赖结构上不透明。只有三个披露垂直行业、没有客户数量，外部无法判断 Ent
              收入是均匀分布，还是集中在某个锚定细分市场。未披露渠道或经销项目，意味着它采用直接企业销售动作，公司扩张时会增加销售周期风险。受监管行业的采购摩擦——包括数据驻留审计、安全评审和多方审批——可能显著拉长企业销售周期，必须计入
              CAC 和回本建模。
