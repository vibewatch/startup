      - number: '7.2'
        title: 运营、依赖和竞争风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，最大的风险是效果。实时意图推断可能误判，拦住正常工作、消耗信任；Ent 关于亚秒级推理和准确率的说法也没有独立基准验证——这正是效果风险被评为高可能性、高影响的原因。如果全终端部署的本地 agent
              拖慢设备或失效，还会带来可靠性和性能风险。高成本入侵与 dwell time 缩短的威胁环境验证了需求，也抬高了预防做错的代价。Verizon 入侵数据显示，人为驱动和凭证相关事件仍占主导；IBM
              数据显示，平均入侵成本达到数百万美元。两者都强化了产品价值，也放大了失败后果。


              依赖与竞争层面，Ent 依靠每个客户自己的云来托管控制平面和取证存储，也依靠可能变化的终端操作系统和浏览器 API。最尖锐的依赖其实来自竞争：Microsoft 和 CrowdStrike
              借分发与捆绑形成集中风险；竞争风险又会叠加执行风险，因为 incumbents 可以把 Ent 分发碾过去，而 Ent
              仍要证明产品有效。国防和金融行业的数据主权义务也可能进一步限制部署。风险还会跨域传导——一次隐私执法行动或效果失败，可能让销售停滞、烧钱加快，并迫使公司融资——因此这些风险不能孤立评估。
