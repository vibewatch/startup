  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接对手、现有巨头、相邻玩家和新进入者
        blocks:
          - type: paragraph
            body: >-
              Ent 进入的竞争格局拥挤且集中。最直接的竞争对手是终端平台——CrowdStrike Falcon 和 SentinelOne Singularity——它们把 AI
              驱动检测与自主响应结合起来。主导型现有巨头是 Microsoft Defender for Endpoint，借 Microsoft 365 E5 捆绑分发，对庞大装机基础而言边际成本接近零。Palo Alto
              Cortex XDR 等平台整合者，以及 Broadcom 旗下 Symantec、Trend Micro Vision One 和 Cybereason 等成熟厂商，共同构成终端战场。


              Ent 的用例旁边，是数据防泄漏和内部风险专门厂商——Proofpoint、Varonis 和 DTEX——它们在数据安全和行为分析上的深度，与 Ent 的内部风险和 DLP 主张重叠。Ent
              要替换的现状方案，是反应式检测、告警加人工调查；公司认为这对 AI 加速攻击太慢。大型企业原则上可以自建内部监控，但意图推断模型难以复制，限制了自建替代。最后，一批新的 AI 代理安全进入者正在形成，争夺 Ent
              盯上的同一条新兴 AI 治理预算线，使新进入者前沿与成熟战场同样重要。简言之，Ent 被夹在上方资金雄厚的上市平台和旁侧灵活的专门厂商之间；其格局位置更像一个新楔子，而非正面替代某个单一既有品类。
