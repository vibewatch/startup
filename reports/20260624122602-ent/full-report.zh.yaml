            title: 隐私监管是一阶全球风险
            body: >-
              员工终端监控会同时触发 GDPR 目的限制与比例原则义务、EDPB 监控指引、EU AI Act 对推断系统的要求，以及美国 CCPA 和 FTC
              执法风险。公民自由组织警告，广泛的职场监控会带来法律和声誉风险，因此公司必须建立有文档支撑的隐私与 AI 治理姿态。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR008
              - CR032
          - type: callout
            title: 效果未证，又面对强势 incumbents
            body: >-
              Ent 的意图推断与亚秒级主张没有独立基准验证；Microsoft 和 CrowdStrike 则可借捆绑把分发做得更强。这些风险会相互叠加：incumbents 靠分发取胜，Ent
              还必须证明产品有效；一次标杆部署失败或 incumbent 功能追平，都是清晰的 thesis-break 触发器。
            calloutType: risk
            claimRefs:
              - CR011
              - CR014
              - CR021
              - CR029
          - type: callout
            title: 履历、资本与治理是真实抵消因素
            body: >-
              创始人的 Microsoft 和 RiskIQ 履历、一级投资人 syndicate、客户云数据主权，以及包括前 NSA 局长和前 CISO
              在内的顾问委员会，能部分缓释执行、融资和监管风险——但任何一项都不能替代已发布的效果证据。
            calloutType: strength
            claimRefs:
              - CR019
