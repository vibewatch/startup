        title: 收入模式、定价和商业化
        blocks:
          - type: paragraph
            body: >-
              Ent 经营 SaaS 订阅业务，最可能按终端或席位定价，但发布时未披露定价或价目表。当前收入组合集中在金融服务、酒店和防务领域的早期 Global 2000 部署；AI
