      - number: '8.2'
        title: 估值背景、可比公司与情景
        blocks:
          - type: paragraph
            body: >-
              一级投资人出资 $100 million 种子轮，意味着市场普遍将估值描述为独角兽区间；但公司没有披露官方 post-money，因此隐含数字缺乏公开证据直接支持，种子轮优先权和稀释条款也仍未知。Ent
              没有公开收入，可比公司只能用来锚定区间。CrowdStrike 是价值数百亿美元的大型平台，SentinelOne 处在百亿美元中段量级，Palo Alto Networks 作为整合型可比公司超过 $100
              billion；高增长安全软件享有较高 EV/revenue multiples。私有市场侧，Wiz 在标志性收购前创下的 ARR 爬坡速度，勾勒出 category-definer 必须走出的路径；近期安全
              M&A 也显示收购方愿为战略价值支付溢价。


              这些输入给出的不是点估值，而是情景区间。牛市情景是：若意图感知安全成为默认层，IPO 或收购可达 $5 billion+；基准情景是：若早期 Global 2000 traction 站住，Series A/B
              估值为 $500 million 至 $1 billion+；熊市情景则是商品化、down round 或 acqui-hire。估值对假设的 forward ARR 和所用 multiple
              高度敏感；超大种子轮压低入场纪律，同时抬高下一轮门槛。按概率加权，结果偏向基准情景，但考虑执行风险，熊市权重也不小。
