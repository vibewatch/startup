evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A confirmed post-money valuation and cap table for the $100M seed round.
    whyItMatters: Valuation drives dilution analysis and the implied bar Ent must clear at Series A.
    diligencePath: Request the cap table or recent 409A valuation under NDA; cross-check any Form D filing.
    relatedQuestionRefs:
      - QO019
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Any revenue, ARR or customer-count figure for Ent.
    whyItMatters: Without revenue evidence, traction and capital efficiency cannot be benchmarked.
    diligencePath: Request management KPIs and reference customers under NDA.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: minor
    topic: governance leadership and founder
    missingEvidence: Confirmed board composition and which investors hold seats or information rights.
    whyItMatters: Governance terms shape control, future financing and key-person mitigation.
    diligencePath: Request the shareholder agreement and board roster; confirm Decibel and others' seats.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: legal entity
    missingEvidence: Primary confirmation of Ent's legal operating entity behind ent.ai.
    whyItMatters: The operating entity affects contracting, IP ownership and jurisdiction.
    diligencePath: Pull state incorporation records and any SEC Form D for the entity name.
    relatedQuestionRefs:
      - QO015
  - type: enumeration-incomplete
    severity: minor
    topic: investor map stakeholder
    missingEvidence: A complete list of all seed participants including undisclosed angels.
    whyItMatters: The named-investor table may omit smaller participants that affect the cap table.
    diligencePath: Reconcile the investor list against the Form D and company confirmation.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: som sizing
    missingEvidence: Ent's per-endpoint or per-seat pricing and target account count needed to compute a SOM.
    whyItMatters: Without pricing the obtainable share of the $25-30B SAM cannot be estimated.
    diligencePath: Request Ent's pricing model and pipeline coverage under NDA.
    relatedQuestionRefs:
      - QM021
      - QM022
  - type: conflicting-data
    severity: minor
    topic: market estimate conflict
    missingEvidence: Reconciliation of differing endpoint, EDR, DLP and XDR scopes across analyst firms.
    whyItMatters: Conflicting scopes inflate or deflate the headline TAM depending on definitions.
    diligencePath: Normalize segment definitions across TBRC, Mordor, Fortune and HiQual before sizing.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: competitor pricing
    missingEvidence: Ent's actual list and negotiated pricing versus per-endpoint incumbent pricing.
    whyItMatters: Without Ent pricing, the pricing comparison and SOM cannot be completed.
    diligencePath: Request Ent's price book and competitive displacement data under NDA.
    relatedQuestionRefs:
      - QP012
  - type: missing-benchmark
    severity: material
    topic: intent-inference efficacy
    missingEvidence: Independent, third-party benchmarks of Ent's intent-inference accuracy and false-positive rate versus incumbents.
    whyItMatters: Capability differentiation is unverified without external benchmarks, weakening the moat thesis.
    diligencePath: Commission or obtain third-party efficacy testing against CrowdStrike and Defender.
    relatedQuestionRefs:
      - QP019
      - QP020
      - QP021
  - type: private-evidence-only
    severity: material
    topic: revenue and arr
    missingEvidence: Ent's actual revenue, ARR, pricing and burn rate.
    whyItMatters: These determine traction quality, runway and the credibility of the implied valuation.
    diligencePath: Request management ARR, price book, monthly burn and cash balance under NDA.
    relatedQuestionRefs:
      - QI009
      - QI018
  - type: private-evidence-only
    severity: material
    topic: runway and burn
    missingEvidence: Ent's precise monthly burn and cash on hand to validate the 18-24 month runway estimate.
    whyItMatters: Runway dictates financing urgency and the next-round timeline.
    diligencePath: Request a cash-flow forecast and current cash balance.
    relatedQuestionRefs:
      - QI011
      - QI014
  - type: missing-source
    severity: material
    topic: intent efficacy benchmark
    missingEvidence: Independent benchmarks of Ent's intent-inference accuracy, false-positive rate and latency.
    whyItMatters: Efficacy claims and the prevention thesis cannot be validated without external testing.
    diligencePath: Commission third-party red-team and efficacy testing; request internal accuracy metrics.
    relatedQuestionRefs:
      - QE019
      - QE020
  - type: private-evidence-only
    severity: material
    topic: agent performance footprint
    missingEvidence: Measured CPU, memory and battery footprint of the on-device agent at scale.
    whyItMatters: Resource footprint affects deployability and user acceptance across large fleets.
    diligencePath: Request performance benchmarks and a production reference deployment.
    relatedQuestionRefs:
      - QE022
  - type: private-evidence-only
    severity: blocking
    topic: retention-metrics
    missingEvidence: Ent NRR, GRR, contract length, and cohort data needed to assess customer durability.
    whyItMatters: >-
      Retention is the single most important predictor of long-term SaaS value; its absence makes DCF and comps
      unreliable.
    diligencePath: Request NRR, GRR, and 12-month cohort table from Ent under NDA.
    relatedQuestionRefs:
      - QU009
      - QU010
      - QU024
  - type: private-evidence-only
    severity: blocking
    topic: customer-count
    missingEvidence: Exact customer count and ARR by account needed to quantify concentration risk.
    whyItMatters: Without a count, the Global 2000 claim could represent 3 or 30 accounts with very different risk profiles.
    diligencePath: Request customer count and ARR by vertical cohort under NDA.
    relatedQuestionRefs:
      - QU004
      - QU012
  - type: missing-source
    severity: material
    topic: named-customer-references
    missingEvidence: Independently verifiable named customer references are absent from public evidence.
    whyItMatters: Anonymous deployment claims without named references cannot support high-confidence investment conviction.
    diligencePath: Seek 3+ named enterprise references willing to speak with investors before conviction.
    relatedQuestionRefs:
      - QU006
      - QU011
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Revenue or deployment distribution across vertical segments is undisclosed.
    whyItMatters: If one vertical or account drives the majority of ARR, churn in that segment could be existential.
    diligencePath: Map ARR by vertical and by top-3 customer under NDA.
    relatedQuestionRefs:
      - QU012
      - QU025
  - type: missing-source
    severity: minor
    topic: benchmark-validation
    missingEvidence: No independent benchmark for Ent's intent-inference accuracy or false-positive rate has been published.
    whyItMatters: >-
      Buyer caution around unproven efficacy can slow enterprise adoption, especially in DLP markets with a history of
      false-positive pain.
    diligencePath: Request or commission independent red-team or third-party benchmark prior to investment.
    relatedQuestionRefs:
      - QU014
      - QU027
  - type: missing-benchmark
    severity: material
    topic: efficacy and false-positive evidence
    missingEvidence: Independent benchmarks of Ent's intent-inference accuracy, false-positive rate and latency.
    whyItMatters: Efficacy is the highest-likelihood, highest-impact risk and cannot be assessed without external testing.
    diligencePath: Commission third-party efficacy and red-team testing; request internal accuracy metrics.
    relatedQuestionRefs:
      - QR008
      - QR009
  - type: private-evidence-only
    severity: material
    topic: regulatory and legal risk posture
    missingEvidence: Ent's data-protection impact assessments, lawful-basis analysis and AI-governance documentation.
    whyItMatters: Privacy and AI-Act exposure is a first-order risk that depends on undisclosed compliance posture.
    diligencePath: Request DPIAs, AI Act conformity analysis and employee-monitoring legal review.
    relatedQuestionRefs:
      - QR002
      - QR006
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: valuation and cap table
    missingEvidence: Ent's official post-money valuation, cap table, and seed preference/dilution terms.
    whyItMatters: Entry price, overhang and return math cannot be confirmed without these.
    diligencePath: Request the cap table, SAFE/round terms and a recent 409A under NDA.
    relatedQuestionRefs:
