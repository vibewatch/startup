- id: moat
  title: Switching costs, moat durability and displacement risk
  body: |-
    Endpoint security carries high switching costs because agents are deployed fleet-wide and wired into SOC workflows, and incumbent bundling - Microsoft's above all - creates lock-in that raises the bar for any displacer. At the same time, enterprises frequently multi-home endpoint, DLP and insider-risk tools, which leaves room for a consolidating entrant that can fold several point capabilities into one agent. Ent's competitive readiness rests on a strong founder pedigree, a $100 million war chest and early Global 2000 deployments across finance, hospitality and defense.

    The durability of Ent's moat is the central question. Its intent-inference models and human-plus-AI-agent scope are genuinely novel, but they are vulnerable to fast-following incumbents who could embed similar capabilities, and skeptical coverage notes that prevention messaging is no longer contrarian and that Ent has published no independent benchmarks. The weakest moat factor is distribution, where Microsoft and CrowdStrike dominate. The net verdict is that Ent holds a real product wedge that is unproven at scale; it must win on demonstrable efficacy and rapid time-to-value rather than price to overcome incumbent distribution and lock-in. Should it fail to publish convincing efficacy evidence quickly, the most likely outcome is that incumbents absorb the intent-aware concept and Ent is relegated to a niche, which is the core competitive risk a diligence reader must weigh.
