callouts:
- calloutType: strength
  title: A genuine product wedge against detection-first incumbents
  body: Ent is the only platform in the comparison claiming real-time intent inference across both human users and AI agents, hosted in the customer's own cloud. Against CrowdStrike, SentinelOne and Defender - all detection-led and vendor-cloud-hosted - this is a differentiated wedge for regulated buyers.
  claimRefs:
  - CP014
  - CP015
  - CP016
  - CP028
  - CP033
- calloutType: risk
  title: Incumbent distribution and fast-follow risk are severe
  body: Microsoft bundles Defender into E5 at near-zero marginal cost and CrowdStrike holds deep enterprise distribution. Intent-awareness could be embedded by these platforms, and Ent has published no independent benchmarks, leaving its moat's durability unproven against fast followers.
  claimRefs:
  - CP013
  - CP018
  - CP020
  - CP021
  - CP022
- calloutType: insight
  title: The contest is time-to-value versus lock-in
  body: Because endpoint switching costs and bundling are high, Ent must win on demonstrable efficacy and rapid time-to-value to justify displacing or supplementing incumbents rather than competing on price.
