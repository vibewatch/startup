chapter:
  number: 5
  title: Product and Technology
  summary: Ent is a lightweight on-device AI agent that observes workspace signals, infers the intent of humans and AI agents via small local models, and intervenes just in time, with policy and forensics hosted in the customer's own cloud; it is GA across Windows, macOS, Linux and browser, with a clear roadmap, but its efficacy is unbenchmarked and false-positive risk is unverified.
sections:
- id: product-and-usecases
  title: Product definition, modules and use cases
  body: |-
    In customer-workflow terms, Ent is a lightweight on-device AI agent that watches how people and AI agents act in the workspace and steps in just in time to prevent a security incident before it completes. It observes signals across the browser, applications, workflows and data movement, then evaluates intent rather than waiting for a known-bad signature. Its core modules are a workspace observer, an intent-inference engine built on specialized small AI models, a policy-enforcement layer, an intervention layer and a forensic record that supports later investigation.

    The platform targets five primary use cases: insider-risk detection, AI governance, data loss prevention, last-mile threat prevention and incident investigation. In each, the agent observes an action - a user exfiltrating data, an AI agent taking a risky step, sensitive data moving, a compromised session acting - infers whether intent is malicious, and intervenes by blocking, warning or permitting, while writing a forensic timeline. Governing the intent of AI agents specifically is a distinguishing capability, aligning with emerging guidance from OWASP's LLM and agent risk work and the Cloud Security Alliance, as autonomous agents introduce new attack surfaces that motivate runtime governance. Read end to end, the product is best understood not as another detector but as a real-time decision layer that sits between a workspace action and its consequence, which is what makes the intent framing more than a marketing label.
  claimRefs:
  - CE001
