company:
  name: "Agrovision"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Fruitist's product stack is a vertically integrated premium-berry platform rather than a
    pure brand wrapper: the company publicly ties its consumer offer to owned or controlled
    growing assets, diversified microclimates, postharvest shelf-life tools, and berry-level
    quality inspection. The evidence supports real physical-stack differentiation, but public
    proof remains much thinner on company-specific control assurance, certification, and
    deployment reliability metrics than on merchandising and expansion claims.
sections:
  - id: "product-definition-and-offer"
    title: "Consumer offer and product map"
    body: >-
      The customer-facing product is not generic fresh fruit; Fruitist is positioned as a
      branded healthy-snacking line built around premium blueberries and extended into other
      superfruits and grab-and-go formats. Public sources consistently describe the company as
      having shifted from an agriculture-first identity toward a consumer brand, with the 2020
      Fruitist launch later becoming the corporate name. The portfolio now spans jumbo and
      organic blueberries, adjacent berries and cherries, and newer snack formats, which
      matters because the product promise is flavor, crunch, and convenience rather than only
      commodity volume.
    claimRefs: ["CE001", "CE002", "CE011"]
    tableRefs: ["TE001", "TE002"]
    figureRefs: ["FE001"]
  - id: "operating-architecture-and-delivery"
    title: "Operating architecture is the real product moat"
    body: >-
      The retained evidence points to a physical operating stack that begins well upstream of
      the retail shelf. Agrovision is described as vertically integrated across growing,
      packing, shipping, and marketing, with a diversified microclimate footprint used to
      support year-round supply. That operating design is paired with explicit postharvest
      tooling: Agrovision says a RipeLocker partnership extends shelf life and that AI is used
      to assess berry quality. Independent postharvest commentary reinforces why those claims
      matter—arrival quality depends on disciplined coordination across harvest, cooling,
      packing, transit, and commercial routing, not on a single isolated intervention.
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE007"]
    tableRefs: ["TE003"]
  - id: "maturity-differentiation-and-control-risks"
    title: "Maturity is improving, but control assurance is still under-documented"
    body: >-
      The product stack looks commercially scaled, but not fully de-risked. Recent sources show
      continued expansion into snack cups, broader fruit lines, and a first chief technology
      officer, which suggests the company is still formalizing the systems needed to support
      broader retail reach. At the same time, premium-fruit consistency remains exposed to
      sector-wide postharvest failure modes and Peru-specific climate disruption that can impair
      firmness, sugars, and export timing. Public evidence describes the physical chain and
      category story much better than it documents Agrovision-specific certifications, control
      dashboards, or incident history, so diligence on safety, compliance, and repeatable
      service reliability is still incomplete. That leaves open whether the company has
      institutionalized quality governance to the same degree that it has professionalized brand,
      sourcing, and retail expansion.
    claimRefs: ["CE008", "CE009", "CE010", "CE012", "CE013"]
callouts:
  - calloutType: "strength"
    title: "Differentiation is operational, not just branding"
    body: >-
      The strongest public proof is Agrovision's ability to pair branded healthy-snacking
      positioning with a controlled physical stack spanning microclimate supply, postharvest
      handling, and berry-level quality control.
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE011"]
  - calloutType: "risk"
    title: "Premium consistency rides on climate and execution discipline"
    body: >-
      Independent evidence shows berry quality degrades through cumulative execution failures,
      while Peru's active Coastal El Niño outlook raises the probability of firmness and
      logistics disruption in a critical origin market.
    claimRefs: ["CE007", "CE008", "CE009", "CE012"]
