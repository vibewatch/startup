      - ["Packing, cooling, and postharvest workflow", "Preserves firmness, bloom, and commercial shelf life before export", "Fast handoffs from harvest to cooling plus process discipline", "Independent evidence says quality loss accumulates when any step in the chain slips"]
      - ["RipeLocker shelf-life extension", "Extends stated shelf life versus conventional handling", "Partner technology and correct process fit by route", "Claim is company-described; independent performance validation is not public"]
      - ["AI berry quality assessment", "Screens fruit against premium quality standards", "Image/inspection tooling plus usable operating thresholds", "No public false-positive, throughput, or defect-removal data"]
      - ["Retail expansion and merchandising layer", "Turns berry supply into branded shelf presence", "Major retail distribution, packaging execution, and replenishment reliability", "No public shelf-availability or store-level performance metrics"]
    notes: >-
      This table describes the physical operating stack evidenced in retained sources, not a
      verified internal software architecture diagram.
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE007", "CE009", "CE010"]
