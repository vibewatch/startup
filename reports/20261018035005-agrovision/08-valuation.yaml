    notes: "Rows summarize the main underwrite-versus-wait debate using only evidence retained in this chapter; null economics are a diligence gap, not a hidden positive."
    claimRefs: ["CV001", "CV008", "CV009", "CV010", "CV012", "CV013", "CV016"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "Brand velocity, premium pricing, and vertical integration prove structurally better economics than public produce peers.", "Value moves clearly above the latest disclosed unicorn anchor only if investors can justify paying for branded growth rather than produce exposure.", "Margin proof fails to materialize; growth depends too heavily on promotion or channel expansion.", "Requires disclosed margin improvement, retailer sell-through evidence, and clean financing terms."]
      - ["Base", "The company continues growing, but outside investors still rely on limited public financial disclosure.", "Value remains around the latest ~$1B public anchor until better economics and cap-table clarity are disclosed.", "The company remains financeable but hard to underwrite precisely.", "Most consistent with today's evidence set."]
      - ["Bear", "Current scale masks weaker cash economics, or the next round introduces downside pricing or investor protections.", "Value falls below the latest public unicorn mark if growth slows or financing terms imply a reset.", "Down-round risk, multiple compression, and operational volatility in premium fresh produce.", "Would be signaled by weaker growth, lower-quality financing, or failure to reconcile distribution and profitability claims."]
    notes: "Scenario rows are coarse by design: the evidence supports directional ranges relative to the latest public valuation anchor, not precise discounted-cash-flow outputs."
    claimRefs: ["CV005", "CV006", "CV008", "CV009", "CV012", "CV015", "CV016"]
