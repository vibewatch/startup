    columns: ["Frame", "Argument", "What would change the view"]
    rows:
      - ["Thesis", "Fruitist has real commercialization proof: $400M sales, large retail distribution, and fresh capital behind a branded healthy-snacking story.", "Upgrade if management shows that branded growth converts into durable gross-margin and cash-generation advantages."]
      - ["Anti-thesis", "Public produce comps trade at much lower revenue and EBITDA multiples, so private scarcity alone does not justify paying up.", "Loosen this concern only if public or diligence data show economics materially better than commodity produce peers."]
