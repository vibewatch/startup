        title: Recent milestones support the growth story, while agriculture-specific risk remains real
        blocks:
          - type: paragraph
            body: >-
              The milestone arc is clear: the consumer brand launched before the parent-company rename, the company
              expanded into China, local production came online there in early 2025, and the 2025 financing round paired
              new capital with additional executive appointments. But the assigned sources also underline that
