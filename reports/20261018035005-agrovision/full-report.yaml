            body: >-
              The strongest adoption proof is named shelf presence and repeated public door-count claims, not disclosed
              repeat-purchase data. Company-distributed releases in 2024 and 2025 keep naming the same major U.S. retail
              accounts and say the brand now reaches more than 12,500 retail locations, while independent trade coverage
              adds a concrete UK proof point: an exclusive Whole Foods Market launch for the GoBerry snack format with
              further expansion planned. FreshFruitPortal and InvestInAg both frame customer demand as supporting
              continued expansion, but the quality of proof remains mixed because those signals still stop short of
              active-account retention, same-store sell-through, or cohort evidence.
            claimRefs:
              - CU004
              - CU005
