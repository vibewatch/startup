              - CI005
          - type: callout
            title: Underwriting still depends on diligence, not disclosure
            body: >-
              Public evidence does not close the key investment questions around realized pricing, margin, shrink, cash
              burn, runway, debt, and customer concentration, so climate or supply shocks could hit economics more
              sharply than the current public story implies.
