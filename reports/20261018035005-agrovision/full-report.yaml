chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, brand pivot, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The current public picture is of a company founded as Agrovision in 2012 that now markets under the
              Fruitist brand and increasingly describes itself as a consumer-led healthy-snacking business rather than
              only a grower. Company and third-party materials consistently describe a vertically integrated model
              spanning farming, packing, shipping, and marketing, with berries positioned as a premium substitute for
              processed snacks. Independent reporting places the headquarters in California and describes agricultural
              or commercial operations across Oregon, Mexico, Chile, Peru, Morocco, Egypt, India, and China. The scale
              story is directionally strong, but several operating metrics remain company-quoted rather than
              independently audited.
