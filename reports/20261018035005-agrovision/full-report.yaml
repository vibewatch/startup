      - number: '3.2'
        title: 'Buying criteria: premium genetics, continuity, and merchandising support matter more than list price'
        blocks:
          - type: paragraph
            body: >-
              The pooled evidence says the competition is being fought on fruit quality consistency, pack-out
              performance, and the retailer's ability to run premium programs across more weeks of the year. Fruitist's
              own interview says the market is now segmented into conventional, premium, jumbo, and super jumbo fruit,
              which implies that a buyer is choosing a quality-and-merchandising program rather than a commodity box.
              Naturipe is pressing the same premiumization route through proprietary varieties and larger display
              programs, while Fall Creek's Sekoya platform shows that breeders are trying to capture value upstream by
              improving storability, size distribution, and harvest efficiency for growers. Public price sheets are
              absent across the assigned pool, so the commercial comparison is packaging and program structure, not
              verified realized pricing.
