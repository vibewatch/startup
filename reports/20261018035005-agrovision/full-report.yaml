      - number: '4.3'
        title: Capital needs, financing dependency, and external pressure
        blocks:
          - type: paragraph
            body: >-
              Agrovision’s public financing narrative remains expansion-led. In March 2024 the company said a new
              Aliment-led growth investment would fund global expansion, distribution, product development, and
              technology; later public reporting said Agrovision then secured another $100 million in August 2024,
              pushing valuation above $1 billion. In October 2025 Fruitist announced a further $150 million equity round
              led by J.P. Morgan Asset Management, again framed around expansion and consumer demand rather than
              balance-sheet repair. The September 2025 CFO hire and board additions suggest more institutional finance
              discipline, but public sources still do not disclose cash on hand, monthly burn, runway, or debt
              obligations. External risk also remains live: 2026 blueberry-market coverage warned that El Niño
              conditions in Peru could delay supply and reduce yields, affecting availability and pricing.
            claimRefs:
              - CI002
              - CI003
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The core positive is that Agrovision looks commercially real rather than purely narrative: there is a
              disclosed funding cadence, reported annual sales above $400 million, broad retailer distribution, and
              visible investment in shelf-life control that plausibly supports premium positioning. The underwriting
              problem is that none of that resolves gross margin quality, cash conversion, or liquidity durability.
              Because public evidence does not disclose realized pricing, contribution margin, burn, runway, or customer
              concentration, the business still screens as capital-intensive and diligence-heavy. The right conclusion
              is not that the model is broken, but that revenue quality and margin path cannot yet be underwritten to
              investment-grade confidence from public sources alone.
            claimRefs:
              - CI004
              - CI011
              - CI013
              - CI014
              - CI015
