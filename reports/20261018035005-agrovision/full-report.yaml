  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category logic
        blocks:
          - type: paragraph
            body: >
              Agrovision's market boundary is narrower than "all produce" and narrower than "all snacks." The company's
              current wedge is premium branded berries led by jumbo blueberries, with adjacent blackberries,
              raspberries, cherries, and grab-and-go formats positioned for healthier snacking occasions. That makes the
              relevant substitution set two-sided: on one side, other premium berries and year-round fresh-fruit
              programs competing for produce shelf space; on the other, processed or indulgent snacks competing for the
              same between-meal demand.


              The evidence also shows why boundary discipline matters. Company and investor materials cite global
              snacking and healthy-snacking markets that are much broader than branded fresh berries, while import and
              price data describe the narrower operating market that actually governs availability, retail planning, and
              margin. For diligence, the most decision-useful frame is therefore premium berries sold through year-round
              retail programs, with healthier-snacking adjacencies treated as upside context rather than as a direct
              TAM.
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM010
              - CM013
              - CM014
      - number: '2.2'
        title: Sizing lenses and market structure
        blocks:
          - type: paragraph
            body: >
              The retained independent evidence is strongest on category structure, not on a single published TAM
              figure. U.S. blueberry demand is increasingly met by imports: imports represented about 65% of domestic
              availability from 2022 through 2024, and imported fruit accounted for roughly 99% of USDA-reported
              shipment volume in early 2026 before the U.S. spring peak. Peru is the key swing supplier within that
              structure, shipping about 405.9 million pounds to the United States in 2025, or 56% of total U.S.
              blueberry import volume.


              That import intensity matters because it links Agrovision's growth to supply continuity, seasonal
              arbitrage, and retail replenishment more than to a single analyst market-size estimate. The broader market
              figures in company-linked material are still useful, but only as non-comparable lenses: a $600 billion
              global snacking framing, a $100 billion healthy-snack framing, and a $32 billion berry-subcategory growth
              projection are different boundaries, not a clean TAM-to-SOM funnel.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM014
          - type: figure
            figureRef: FM001
