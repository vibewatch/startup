        title: Operating architecture is the real product moat
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a physical operating stack that begins well upstream of the retail shelf.
              Agrovision is described as vertically integrated across growing, packing, shipping, and marketing, with a
              diversified microclimate footprint used to support year-round supply. That operating design is paired with
              explicit postharvest tooling: Agrovision says a RipeLocker partnership extends shelf life and that AI is
              used to assess berry quality. Independent postharvest commentary reinforces why those claims
              matter—arrival quality depends on disciplined coordination across harvest, cooling, packing, transit, and
              commercial routing, not on a single isolated intervention.
