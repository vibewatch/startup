  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation depends on real demand proof offset by a large disclosure gap between the private valuation
      anchor and public-market benchmarks.
    data:
      nodes:
        - id: market
          label: Category demand
          summary: Healthy snacks remain a large category with North America as the largest region.
          note: Supports why premium fresh snacking can attract investor attention.
        - id: commercial
          label: Commercial proof
          summary: Fruitist has publicly reported $400M sales and 12,500+ retail locations.
          note: Shows scaled distribution rather than pilot-stage traction.
        - id: capital
          label: Capital support
          summary: The company closed a fresh $150M equity round and retained a unicorn valuation anchor.
          note: Validates continued investor appetite, but not price sufficiency.
        - id: comp
          label: Public comp check
          summary: Dole screens at about 7.1x EV/EBITDA and 0.16x sales in public snapshots.
          note: The public benchmark is materially less generous than the private headline mark.
        - id: gaps
          label: Missing underwriting data
          summary: Public disclosures omit margin, cash-flow, and financing-term detail.
          note: Without these fields, valuation precision would be false confidence.
        - id: call
          label: Recommendation
          summary: Track until economics and cap-table terms are disclosed.
          note: A higher-conviction stance needs proof that branded growth outruns produce-like valuation gravity.
      edges:
        - from: market
          to: commercial
          label: Demand helps
          detail: Category tailwinds matter only if they convert into real shelf traction.
        - from: commercial
          to: capital
          label: Traction attracts capital
          detail: Scale and distribution helped support the latest financing.
        - from: capital
          to: comp
          label: Price needs context
          detail: A private unicorn mark still has to clear public benchmark scrutiny.
        - from: comp
          to: gaps
          label: Benchmark is incomplete
          detail: Without margins and terms, investors cannot judge whether the premium is earned.
        - from: gaps
          to: call
          label: Decision rule
          detail: Missing underwriting data keeps the call at track rather than buy.
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
      - CV016
