    summary: >-
      The public record shows a clear 2012-2026 progression from grower platform to branded snack company, but the
      timeline also exposes financing opacity and agriculture-specific execution risk.
    data:
      items:
        - date: '2012'
          label: Agrovision is founded
          detail: Independent and company-linked reporting consistently dates the founding to 2012.
          tone: positive
          claimRefs:
            - CO001
        - date: '2020'
          label: Fruitist consumer brand debuts
          detail: >-
            ItalianBerry says the consumer-facing Fruitist label was introduced in 2020 before the parent-company
            rename.
          tone: positive
          claimRefs:
            - CO002
        - date: '2022'
          label: Commercial presence in China begins
          detail: Just Food says the company had commercial presence in China from 2022 before local production started.
          tone: opportunity
          claimRefs:
            - CO005
        - date: 2024-03
          label: Aliment Capital leads a financing round
          detail: Just Food and Invest in Ag both point to a March 2024 round that added capital and scaling support.
          tone: positive
          claimRefs:
            - CO006
        - date: 2024-08
          label: Valuation reportedly moves above $1B
          detail: Invest in Ag says an August 2024 equity financing of $100M pushed the company above a $1B valuation.
          tone: positive
          claimRefs:
            - CO007
        - date: 2025 Q1
          label: First China-grown blueberry crop is harvested
          detail: >-
            Just Food reports the group's first locally grown blueberry crop in China during the opening quarter of
            2025.
          tone: opportunity
          claimRefs:
            - CO005
        - date: '2025-05-13'
          label: Agrovision rebrands as Fruitist
          detail: >-
            Independent coverage ties the rename to the consumer brand and a more explicit premium healthy-snacking
            thesis.
          tone: positive
          claimRefs:
            - CO002
            - CO011
        - date: 2025-10-29/30
          label: $150M J.P. Morgan-led financing closes
          detail: >-
            Company-controlled and independent coverage frame the round as expansion capital and pair it with new
            leadership disclosures.
          tone: positive
          claimRefs:
