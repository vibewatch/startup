      - number: '3.3'
        title: 'Durability: differentiated, but exposed to multi-homing and upstream genetics competition'
        blocks:
          - type: paragraph
            body: >-
              Fruitist still has a real differentiation story: the company claims a premium blueberry leadership
              position, has invested more than $350 million into operations, is extending Peru volume, and has recently
              added senior finance and board talent associated with scaling and governance. But the same pool also shows
              why the moat is contestable. Peru supply is deep, multiple exporters remain larger by reported seasonal
              tonnage, Naturipe is already winning premium growth with proprietary varieties, and Fall Creek is
              marketing genetics that promise better shelf life and larger fruit without requiring retailers to commit
              to Fruitist's branded route. That leaves Fruitist competing on execution, supply continuity, and category
              management rather than on exclusive access to premium fruit quality.
