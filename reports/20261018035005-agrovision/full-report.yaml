              - CM009
              - CM010
              - CM014
      - number: '2.3'
        title: Buyer map, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >
              The practical buyer is the retailer or import-program category team that needs reliable premium produce
              velocity, while the economic payer is the end consumer choosing a better-for-you snack. The evidence
              points to three core adoption drivers: repeatable eating quality, year-round availability created by
              geographically staggered production, and a consumer shift toward fresher and more functional snacks.


              Those drivers support premium positioning, but the constraint stack is equally clear. U.S. market prices
              moved higher in early 2026, showing that availability still tightens when weather or seasonality bites.
              Peru's crop remains sensitive to chilling-hour deficits, humidity, disease pressure, and logistics
              disruption, so the supply base that enables year-round programs also introduces climate and execution
              risk. Management argues tariffs are manageable because the footprint is diversified, but a valuation case
              still has to underwrite import dependence, cold-chain execution, and supply volatility rather than
              assuming branded demand alone clears those frictions.
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM011
              - CM012
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: branded premium supply versus incumbents, partners, and status quo sourcing'
        blocks:
          - type: paragraph
            body: >-
              The relevant buyer alternatives span more than one peer set. Fruitist's own materials frame the company as
              a direct-to-retail, fully integrated premium berry supplier, while its 2022 Berries Paradise partnership
              expanded that offer into a three-berry platform with 10,000 planted acres and 120 million pounds of output
              from Peru and Mexico. That makes the immediate comparison set a mix of branded premium marketers, Peru
              export incumbents, and retailers' existing multi-source procurement model rather than only VC-backed berry
              brands. The independent season ranking in Italian Berry reinforces the point: Agrovision Peru was large in
              2025/26, but still trailed Camposol and Hortifrut on Peru export tonnage, so scale alone is not a
              defensible moat.
