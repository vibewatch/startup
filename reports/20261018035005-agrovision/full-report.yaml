      - number: '6.3'
        title: Durability, concentration, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public customer story is thinnest. None of the reviewed sources disclose NRR, GRR,
              churn, renewal rates, contract length, or top-customer concentration, so the available record proves
              distribution momentum but not retention quality. That missing evidence matters because outside
              food-and-beverage diligence frameworks explicitly punish retailer concentration, churn, and weak
              customer-level proof, and fresh-produce economics can blunt pricing power even when category demand is
              favorable. It also leaves investors unable to separate repeat velocity from launch-driven merchandising
              wins or seasonal trial spikes. The result is a customer narrative that is directionally strong on access
              and demand creation but still under-documented on stickiness and account concentration.
            claimRefs:
              - CU009
              - CU010
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named retail proof is real, even if the economics are not
            body: >-
              Agrovision has more customer proof than a logo wall: repeated named-chain lists, a 12,500-door scale
              claim, and an independently reported Whole Foods UK launch together make shelf presence credible.
            calloutType: strength
            claimRefs:
              - CU002
              - CU004
              - CU006
          - type: callout
            title: Durability is still under-documented
            body: >-
              The reviewed sources do not disclose retention, renewal, churn, or top-account concentration, and current
              public country counts conflict, so the customer story is directionally strong but not diligence-complete.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk picture
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence points to a three-part risk stack. First, Agrovision remains exposed to
              agricultural and export volatility because Peru is still under a Coastal El Niño alert through November
              2026 and berry programs are unusually perishable. Second, the company is scaling with long biological lead
              times: management told AgFunder that production investments can take about five years to mature, while
              third-party coverage still frames the company around fresh financing and valuation milestones rather than
              around disclosed margin or cash conversion data. Third, broad retail reach reduces single-door dependence,
              but it also raises the cost of any fill-rate or quality miss because the brand promise now spans more than
              12,500 retail locations and 40 countries. The heatmap therefore ranks climate/logistics volatility,
              capital intensity, and retailer dependence as the highest residual exposures.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR008
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR015
              - CR016
      - number: '7.2'
        title: Operational and regulatory execution risk
        blocks:
          - type: paragraph
            body: >-
              Agrovision's footprint is an operating advantage only if the company can manage it without service or
              compliance slips. Independent coverage now describes production or development across Peru, Mexico, Chile,
              Morocco, Egypt, India, China, Oregon, Romania, Thailand, Indonesia, and the Philippines, which increases
              exposure to labor markets, phytosanitary rules, weather variance, and cross-border logistics. Sector
              reports also flag labor inflation and tighter pesticide and importer standards as live risks for berries
              in 2025-2026. The operational benchmark from Driscoll's is useful here: the economics of fresh berries can
              deteriorate within days when routes fail or temperature control slips. What remains unproven publicly is
              Agrovision's own audit, recall, insurance, and crisis-response record, so regulatory and food-safety risk
              should be treated as partially mitigated rather than closed.
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
