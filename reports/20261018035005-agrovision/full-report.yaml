              - CR008
              - CR009
              - CR010
              - CR013
      - number: '7.3'
        title: Commercial, capital, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The category backdrop is constructive: both market researchers and Tastewise show a growing berry and
              healthy-snacking market. That backdrop does not remove business-model risk, because Agrovision is
              simultaneously broadening crop lines, launching portable formats like Snack Cups, and building new
              geographies while public disclosures still omit customer concentration, gross margin, working-capital
              intensity, and debt or covenant detail. The latest capital rounds reduce near-term funding pressure, but
              they also underscore how dependent the model remains on continued execution before orchards mature and
              before branded velocity is proven across a larger product set. Investors should therefore monitor retailer
              retention, weather-adjusted fill rates, and the need for additional external capital as explicit kill
              criteria.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Top thesis-break triggers
            body: >-
              Treat the underwriting case as broken if Peru weather disruption causes repeated export misses, if the
              company needs more capital before current plantings mature, or if major retail doors show delisting, heavy
              promotional dependence, or sustained quality complaints.
            calloutType: risk
            claimRefs:
              - CR008
              - CR015
              - CR016
          - type: callout
            title: Regulatory risk is still under-documented
            body: >-
              The retained public pool does not yet prove Agrovision's own certification, recall, or litigation posture,
              so investors should require primary compliance evidence before assuming low legal or food-safety risk.
            calloutType: assumption
            claimRefs:
              - CR010
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Investment call: track the company, not the price blindly'
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a price-sensitive track call rather than a buy. Current reporting and
              company-linked financing coverage show that Fruitist has fresh demand proof: a $150 million equity round
              led by J.P. Morgan Asset Management, reported sales above $400 million, and distribution into more than
              12,500 retail locations. That is enough to show the company has moved beyond concept-stage storytelling
              and into scaled commercialization. The missing piece is underwriting detail. The reviewed sources do not
              disclose current round pricing mechanics, dilution, liquidation preferences, debt draw, gross margin,
              EBITDA, or cash conversion, so the public record does not yet prove that a unicorn valuation is cheap.


              The best public comparable available in this worker pool is Dole, which screens at roughly 7.1x EV/EBITDA
              and 0.16x sales on late-2025 public-market data. Agrovision deserves some premium if branded velocity,
              vertical integration, and healthy-snacking positioning really translate into structurally better economics
              than commodity produce peers, but that premium must be earned with margin and cash-flow evidence, not
              inferred from scale alone. On the facts available here, the right call is to keep the company on the
              active watchlist and require economics-focused diligence before underwriting above the latest disclosed
              unicorn anchor.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV009
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: Why the upside is real, and why the anti-thesis still matters
        blocks:
          - type: paragraph
            body: >-
              The upside case is straightforward. Fruitist is selling into a large healthy-snacking category that one
              market source sizes at $117.9 billion in 2026, with North America representing 39.8% of demand, and the
              company has translated that theme into actual shelf presence and fresh capital. Blueberry trade data also
              support the idea that Agrovision operates inside a category with durable supply-chain relevance: the
              United States imported 720 million pounds of fresh blueberries in 2025, with Peru alone supplying 406
              million pounds, a meaningful point because Fruitist's footprint and product quality narrative depend on
              year-round berry sourcing.


              The anti-thesis is just as important. The same category research flags higher production costs and
              ingredient sourcing challenges as a restraint, which matters even more for a company built on fresh
              premium fruit rather than shelf-stable packaged snacks. Public sources also disagree on whether Fruitist
              is active in 28 countries or 40 countries, a small but telling sign that some headline scale metrics still
              need management reconciliation. Most importantly, the comp gap versus public produce names remains wide
              enough that investors should not assume a premium multiple is durable without evidence on repeat rates,
              retailer velocity, and margin structure.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: Scenario framing and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The latest public valuation anchor still points to a company worth roughly $1 billion on more than $400
              million of sales, which implies about 2.5x sales before considering debt or preference terms. That is not
              obviously excessive for a fast-growing branded food platform, but it is also not self-evidently cheap when
              the nearest public produce comp screens at a fraction of that revenue multiple and the current round's
              actual pricing terms are undisclosed. The base case is therefore a hold-in-diligence posture: the business
              may deserve the mark, but the public evidence does not yet prove it.


              What would change the call is concrete and measurable. A more constructive stance would require
              management-level disclosure of gross margin, EBITDA or contribution margin, customer and retailer
              concentration, current cap-table mechanics, and evidence that branded berry velocity can hold through
              wider international distribution. A more negative stance would be warranted if the next financing resets
              the price, if premium-snack demand weakens, or if operating data show that the brand is not converting
              scale into durable cash economics. Until one of those paths is evidenced, scenario work should stay
              deliberately coarse and tied to diligence gates rather than false precision.
            claimRefs:
              - CV005
              - CV008
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Current recommendation
            body: >-
              Track Agrovision/Fruitist rather than chase the headline unicorn mark: the company has enough evidence of
              scale to stay in active diligence, but not enough public economics or financing detail to justify a
              conviction entry.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV015
              - CV016
          - type: callout
            title: What could break the thesis
            body: >-
              A financing reset, weak sell-through economics, or evidence that the company is still produce-like on
              margins despite branded positioning would all make the current mark look expensive rather than merely
              under-disclosed.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV012
              - CV016
