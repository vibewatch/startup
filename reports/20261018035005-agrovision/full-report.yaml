  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scoring from the assigned evidence places Fruitist high on integrated supply control and premium-brand
      leverage, but not alone in premium-category pressure.
    data:
      xAxis:
        label: Integrated supply / operating control (ordinal 1-5)
        min: 1
        max: 5
        lowLabel: Fragmented / indirect
        highLabel: Integrated / direct
        description: Higher scores indicate more evidence of controlling production, supply chain, and buyer interface.
      yAxis:
        label: Premium differentiation leverage (ordinal 1-5)
        min: 1
        max: 5
        lowLabel: Commodity / generic
        highLabel: Premium / proprietary
        description: Higher scores indicate more evidence of branded, varietal, or merchandising leverage in premium berries.
      points:
        - label: Fruitist
          x: 5
          'y': 5
          detail: Direct-to-retail premium berry branding plus vertically integrated and year-round supply claims.
        - label: Naturipe
          x: 3
          'y': 4
          detail: >-
            Retail-facing premium merchandising and proprietary varieties, but the assigned pool does not show the same
            integrated global footprint.
        - label: Camposol / Hortifrut
          x: 4
          'y': 2
          detail: >-
            Higher reported Peru export scale, but the assigned pool is thinner on consumer-facing premium
            differentiation.
        - label: Berries Paradise
          x: 3
          'y': 3
          detail: >-
            Strong berry-category complement and continuity, but evidenced here as a partner rather than a standalone
            premium brand.
        - label: Fall Creek / Sekoya
          x: 2
          'y': 4
          detail: >-
            Differentiation comes from genetics, storability, and fruit-size performance rather than a retailer-facing
            supply program.
        - label: Retailer multi-source build
          x: 2
          'y': 2
          detail: Lower branded differentiation, but retains buyer flexibility and weakens switching costs.
    approximationNotes: >-
      Scores are evidence-backed ordinals derived from the assigned pool only; they are not source-published coordinates
      or market-share values.
    claimRefs:
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: Public revenue-to-gross-profit bridge (proxy view)
    type: flow
    summary: >-
      Public sources allow a logic bridge from reliable supply into branded revenue, but the gross-profit step is still
      proxy-based because Agrovision does not disclose realized pricing or margin.
    data:
      nodes:
        - label: Year-round supply platform
          value: Diversified microclimates + vertical integration
          note: Public sources describe owned / controlled production across multiple growing regions.
        - label: Direct retail distribution
          value: 12,500+ North American retail locations; 40 countries
          note: Channel breadth is disclosed publicly, but customer concentration is not.
        - label: Branded berry revenue
          value: Fruitist blueberries, adjacent berries, snack cups; Big Skye in China
          note: Revenue shape is visible; revenue mix by line and region is not.
        - label: Postharvest and cold-chain performance
          value: Up to 12 weeks shelf life claim; 0–2 °C discipline matters
          note: Shelf-life technology and cold-chain execution plausibly determine shrink and claims cost.
        - label: Gross-profit conversion
          value: Margin sensitive to shrink, logistics, and fruit quality
          note: Industry literature says berry postharvest losses often exceed 25% of production.
        - label: Expansion capital
          value: 2024 and 2025 equity rounds earmarked for growth
          note: Public capital is framed around expansion, distribution, technology, and demand capture.
      edges:
        - from: Year-round supply platform
          to: Direct retail distribution
          relationship: Reliable supply supports retailer placement.
        - from: Direct retail distribution
          to: Branded berry revenue
          relationship: Retail doors convert placement into sell-through.
        - from: Branded berry revenue
          to: Postharvest and cold-chain performance
          relationship: Fresh-produce revenue quality depends on keeping fruit saleable.
        - from: Postharvest and cold-chain performance
          to: Gross-profit conversion
          relationship: Shrink and logistics discipline shape realized profitability.
        - from: Gross-profit conversion
          to: Expansion capital
          relationship: Opaque margins increase reliance on external funding for growth.
    approximationNotes: >-
      This is a qualitative bridge derived from disclosed operations, financing use, and category science; Agrovision
      does not publish realized pricing, gross margin, or contribution-margin bridges.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI015
  - id: FE001
    title: Fruitist product architecture map
    type: stack
    summary: >-
      Public evidence depicts a layered physical stack that runs from branded demand creation through microclimate
      sourcing, postharvest control, and climate-sensitive export execution.
    data:
      layers:
        - label: Demand positioning
          detail: Healthy-snacking narrative designed to compete with processed snacks.
          modules:
            - Fruitist consumer brand
            - Premium jumbo blueberry positioning
            - Snackable convenience framing
          outputs:
            - Premium shelf story
            - Impulse-use-case relevance
        - label: Portfolio layer
          detail: Blueberries anchor the offer while adjacent berries and cherries widen the assortment.
          modules:
            - Fruitist Blueberries
            - Fruitist Jumbo Blueberries
            - Blackberries, raspberries, and cherries
            - Snack cups / snackable formats
          outputs:
            - Broader superfruit basket
        - label: Sourcing network
          detail: Diversified microclimates and multiple producing countries support year-round supply.
          modules:
            - Peru
            - Mexico
            - Oregon
            - Morocco
            - Additional sourcing in Chile, India, China
          outputs:
            - Year-round supply claim
        - label: Postharvest control
          detail: Quality preservation depends on shelf-life tools plus disciplined cooling and packing.
          modules:
            - RipeLocker shelf-life extension
            - Cooling and packing operations
            - Berry-level AI quality assessment
          outputs:
            - Freshness window extension
            - Premium-quality target
        - label: Export and retail delivery
          detail: The agronomic stack must survive logistics and fixed retail programs to create value.
          modules:
            - Packing and shipping
            - Retail expansion
            - Global distribution programs
          outputs:
            - Shelf-ready fruit
            - Scaled retail reach
        - label: Risk-control layer
          detail: Climate monitoring and contingency practices matter because Peru weather can affect quality and timing.
          modules:
            - Drainage systems
            - Climate monitoring
            - Contingency protocols
          outputs:
            - Rain-event resilience
            - Residual climate and route risk
    approximationNotes: null
    claimRefs:
