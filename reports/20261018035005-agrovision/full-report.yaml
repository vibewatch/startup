        title: Maturity is improving, but control assurance is still under-documented
        blocks:
          - type: paragraph
            body: >-
              The product stack looks commercially scaled, but not fully de-risked. Recent sources show continued
              expansion into snack cups, broader fruit lines, and a first chief technology officer, which suggests the
              company is still formalizing the systems needed to support broader retail reach. At the same time,
              premium-fruit consistency remains exposed to sector-wide postharvest failure modes and Peru-specific
              climate disruption that can impair firmness, sugars, and export timing. Public evidence describes the
              physical chain and category story much better than it documents Agrovision-specific certifications,
              control dashboards, or incident history, so diligence on safety, compliance, and repeatable service
              reliability is still incomplete. That leaves open whether the company has institutionalized quality
