      - number: '4.2'
        title: Pricing visibility and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a premium positioning story, not a usable pricing model. The retained sources
              describe premium blueberries, expanding berry lines, and new snack-cup SKUs, but they do not publish list
              price, realized net price, retailer rebates, or customer-level contract structure. That pushes
              underwriting toward operational proxies. Agrovision’s RipeLocker partnership says the storage system can
              maintain berry freshness for up to 12 weeks—three times the norm—and the company frames that as a way to
              reduce shrink and reach more distant markets. Independent technical literature shows why that matters:
              berries are unusually perishable, postharvest losses often exceed 25% of production, and even small
              deviations from a 0–2 °C cold chain can sharply worsen spoilage economics.
            claimRefs:
