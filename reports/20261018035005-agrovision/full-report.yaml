  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Agrovision’s monetization is straightforward in shape but not in disclosure depth: the company markets
              premium berries directly to retailers under Fruitist and markets blueberries in China under Big Skye, so
              revenue appears to come primarily from branded fresh-produce sell-through rather than software-like
              recurring contracts or marketplace fees. Public traction signals are meaningful. By September 2025, a
              Fruitist announcement hosted by Blue Book Services said annual sales had surpassed $400 million, and by
              October 2025 the company said its products were sold in more than 12,500 retail locations across North
              America and 40 countries worldwide. What is still missing is mix: none of the retained public sources
              break revenue by berry type, geography, channel, retailer, or branded format.
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI006
              - CI007
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
