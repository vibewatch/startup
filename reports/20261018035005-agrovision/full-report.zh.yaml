            body: >-
              最有力的证据指向三层风险。第一，秘鲁的沿海厄尔尼诺警报仍持续至 2026 年 11 月，且浆果项目极易腐败，因此 Agrovision 仍暴露于农业和出口波动。第二，公司在漫长的生物生产周期下扩张：管理层告诉
              AgFunder，生产投资约需五年才能成熟；第三方报道仍围绕新融资和估值里程碑描述公司，而不是披露的利润率或现金转化数据。第三，广泛的零售覆盖降低了对单一门店的依赖，却也让任何供货率或品质失误的代价更高，因为品牌承诺如今覆盖超过
              12,500 个零售门店和 40 个国家。因此，热力图将气候/物流波动、资本密集度和零售商依赖列为最高残余风险。
