      - number: '3.3'
        title: 持久性：具备差异化，但暴露于多供应商采购和上游品种竞争
        blocks:
          - type: paragraph
            body: >-
              Fruitist 确实有差异化故事：公司称其处于高端蓝莓领导地位，已向运营投入超过 $350
              million，正在扩大秘鲁产量，近期还引入了有规模化和治理经验的高级财务及董事会人才。但同一批来源也说明了护城河为何可被挑战。秘鲁供应充足，多家出口商按已报告季节吨位仍更大；Naturipe
              已凭专有品种赢得高端增长；Fall Creek 推销的品种承诺更长货架期和更大果实，零售商无需承诺采用 Fruitist 的品牌路径。因此，Fruitist
              的竞争点是执行、供应连续性和品类管理，而不是独家掌握高端果实品质。
