  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 根据指定证据进行的序数评分显示，Fruitist 的供应整合控制和高端品牌杠杆得分较高，但高端品类竞争压力并非只有它一家承受。
    data:
      xAxis:
        label: 供应整合 / 运营控制（序数 1-5）
        min: 1
        max: 5
        lowLabel: Fragmented / indirect
        highLabel: Integrated / direct
        description: Higher scores indicate more evidence of controlling production, supply chain, and buyer interface.
      yAxis:
        label: 高端差异化杠杆（序数 1-5）
        min: 1
        max: 5
        lowLabel: Commodity / generic
        highLabel: Premium / proprietary
        description: Higher scores indicate more evidence of branded, varietal, or merchandising leverage in premium berries.
      points:
        - label: Fruitist
          x: 5
          'y': 5
          detail: 面向零售的高端浆果品牌，加上垂直整合和全年供应的主张。
        - label: Naturipe
          x: 3
          'y': 4
          detail: 面向零售的高端陈列和专有品种，但指定证据池没有显示其拥有同等程度的全球整合布局。
        - label: Camposol / Hortifrut
          x: 4
          'y': 2
          detail: 报告中的秘鲁出口规模更大，但指定证据池对其面向消费者的高端差异化着墨较少。
        - label: Berries Paradise
          x: 3
          'y': 3
          detail: 浆果品类互补性和持续性较强，但在此证据中它是合作伙伴，而非独立的高端品牌。
        - label: Fall Creek / Sekoya
          x: 2
          'y': 4
          detail: 差异化来自遗传育种、耐储存性和果实大小表现，而不是面向零售商的供应计划。
        - label: 零售商多来源采购
          x: 2
          'y': 2
          detail: 品牌差异化较低，但保留买方灵活性，也削弱了转换成本。
    approximationNotes: 分数是仅根据指定证据池得出的、有证据支撑的序数判断；它们不是来源发布的坐标或市场份额数据。
    claimRefs:
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: 公开收入到毛利的桥接（代理视角）
    type: flow
    summary: 公开来源可以把可靠供应与品牌收入逻辑连接起来，但毛利这一步仍基于代理指标，因为 Agrovision 没有披露实际定价或利润率。
    data:
      nodes:
        - label: 全年供应平台
          value: Diversified microclimates + vertical integration
          note: 公开来源描述了公司在多个种植区域拥有或控制的产能。
        - label: 直接零售分销
          value: 12,500+ North American retail locations; 40 countries
          note: 渠道覆盖广度已公开，但客户集中度未披露。
        - label: 品牌浆果收入
          value: Fruitist blueberries, adjacent berries, snack cups; Big Skye in China
          note: 收入形态可见，但未披露按产品线和地区划分的收入结构。
        - label: 采后和冷链表现
          value: Up to 12 weeks shelf life claim; 0–2 °C discipline matters
          note: 保鲜技术和冷链执行很可能决定损耗和索赔成本。
        - label: 毛利转化
          value: Margin sensitive to shrink, logistics, and fruit quality
          note: 行业文献称，浆果采后损耗往往超过产量的 25%。
        - label: 扩张资本
          value: 2024 and 2025 equity rounds earmarked for growth
          note: 公开资本主要投向扩张、分销、技术和需求获取。
      edges:
        - from: Year-round supply platform
          to: Direct retail distribution
          relationship: 可靠供应支撑零售上架。
        - from: Direct retail distribution
          to: Branded berry revenue
          relationship: 零售门店将上架转化为售出。
        - from: Branded berry revenue
          to: Postharvest and cold-chain performance
          relationship: 鲜果收入质量取决于能否让水果保持可销售状态。
        - from: Postharvest and cold-chain performance
          to: Gross-profit conversion
          relationship: 损耗控制和物流纪律塑造实际盈利能力。
        - from: Gross-profit conversion
          to: Expansion capital
          relationship: 利润率不透明，意味着增长更依赖外部融资。
    approximationNotes: 这是一座根据已披露运营、融资用途和品类科学搭建的定性桥梁；Agrovision 没有公布实际定价、毛利率或贡献毛利桥接。
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI015
  - id: FE001
    title: Fruitist 产品架构图
    type: stack
    summary: 公开证据呈现出一套分层的实体链条：从品牌需求创造，到微气候采购、采后控制，再到受气候影响的出口执行。
    data:
      layers:
        - label: 需求定位
          detail: 以健康零食为叙事，与加工零食竞争。
          modules:
            - Fruitist 消费品牌
            - 高端巨型蓝莓定位
            - 即食便利性叙事
          outputs:
            - 高端货架故事
            - 即兴消费场景相关性
        - label: 产品组合层
          detail: 蓝莓是核心，其他浆果和樱桃扩大了产品组合。
          modules:
            - Fruitist Blueberries
            - Fruitist Jumbo Blueberries
            - 黑莓、覆盆子和樱桃
            - 零食杯 / 即食形式
          outputs:
            - 更广的超级水果篮子
        - label: 采购网络
          detail: 多样化微气候和多个生产国支撑全年供应。
          modules:
            - 秘鲁
            - 墨西哥
            - 俄勒冈
            - 摩洛哥
            - 智利、印度、中国的其他采购
          outputs:
            - 全年供应主张
        - label: 采后控制
          detail: 品质保持依赖保鲜工具，以及严格的冷却和包装。
          modules:
            - RipeLocker 延长保鲜期
            - 冷却和包装运营
            - 浆果级 AI 质量评估
          outputs:
            - 延长新鲜窗口
            - 高端品质目标
        - label: 出口和零售交付
          detail: 农业生产链必须经受物流和固定零售计划的考验，才能创造价值。
          modules:
            - 包装和运输
            - 零售扩张
            - 全球分销计划
          outputs:
            - 可直接上架的水果
            - 规模化零售触达
        - label: 风险控制层
          detail: 秘鲁天气可能影响品质和时点，因此气候监测和应急实践很重要。
          modules:
            - 排水系统
            - 气候监测
            - 应急预案
          outputs:
            - 抗降雨事件韧性
            - 残余气候和路线风险
    approximationNotes: null
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE009
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Agrovision 当前的客户证据从高端品牌定位延伸到指定零售商分销，再进入地域和形式扩张，但业务持续性仍有待验证。
    data:
      items:
        - label: 高端浆果定位
          actor: Fruitist 品牌 / 果蔬采购商
          channel: 官方品牌和零售陈列
          touchpoints:
            - 高端覆盆子、蓝莓和黑莓
            - 全国零售商均有销售
        - label: 美国指定连锁渗透
          actor: 会员制商店、杂货店和天然食品采购商
          channel: 北美零售分销
          touchpoints:
            - Costco、Giant、Publix、Sprouts、Trader Joe's、Walmart、Whole Foods 等零售商
            - 2024 年和 2025 年发布中反复出现的指定客户名单
        - label: 零食形式需求创造
          actor: 注重健康的零食消费者
          channel: 即拿即走的果蔬 / 零食消费场景
          touchpoints:
            - Fruitist Snack Cups
            - GoBerry 随身蓝莓包装
            - 报道将 GLP-1 需求叙事列为购买助推因素
        - label: 英国高端零售测试
          actor: Whole Foods Market UK 零售商
          channel: 独家发布合作伙伴
          touchpoints:
            - Whole Foods Market 独家上架
            - 橱窗展示支持
            - 计划在 2026 年前进一步拓展英国市场
        - label: 国际铺开
          actor: 超市、会员制商店和高端独立零售商
          channel: 多区域零售商网络
          touchpoints:
            - 12,500+ 个零售网点
            - 公开资料中的 28 国和 40 国覆盖数量
            - 报道涉及北美、欧洲、英国、中东和亚洲
        - label: 持续性尽调检查点
          actor: 投资人 / 尽调团队
          channel: 留存和集中度证明
          touchpoints:
            - 没有公开 NRR、GRR、流失率或续约数据
            - 未披露头部客户占比或合同期限
            - 品类经济性无法消除定价权风险
