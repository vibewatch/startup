  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 该建议取决于真实需求证明，但私人估值锚点与公开市场基准之间存在巨大的披露缺口。
    data:
      nodes:
        - id: market
          label: 品类需求
          summary: Healthy snacks remain a large category with North America as the largest region.
          note: 说明高端鲜食零食为何能吸引投资人关注。
        - id: commercial
          label: 商业证明
          summary: Fruitist has publicly reported $400M sales and 12,500+ retail locations.
          note: 展示的是规模化分销，而非试点阶段的市场进展。
        - id: capital
          label: 资本支持
          summary: The company closed a fresh $150M equity round and retained a unicorn valuation anchor.
          note: 验证投资人持续的兴趣，但不能证明价格足够合理。
        - id: comp
          label: 公开可比检查
          summary: Dole screens at about 7.1x EV/EBITDA and 0.16x sales in public snapshots.
          note: 公开市场基准明显不如私人市场的高位估值慷慨。
        - id: gaps
          label: 缺失的投资判断数据
          summary: Public disclosures omit margin, cash-flow, and financing-term detail.
          note: 没有这些字段，估值精度就只是虚假的确定感。
        - id: call
          label: 建议
          summary: Track until economics and cap-table terms are disclosed.
          note: 要提高确信度，必须证明品牌增长速度超过农产品式估值的牵引。
      edges:
        - from: market
          to: commercial
          label: 需求助力
          detail: 品类顺风只有转化为真实货架动销后才有意义。
        - from: commercial
          to: capital
          label: 牵引力吸引资本
          detail: 规模和分销帮助支撑了最近一轮融资。
        - from: capital
          to: comp
          label: 价格需要语境
          detail: 私人市场独角兽估值仍需经受公开市场基准的检验。
        - from: comp
          to: gaps
          label: 基准并不完整
          detail: 没有利润率和交易条款，投资人无法判断这份溢价是否真正获得。
        - from: gaps
          to: call
          label: 决策规则
          detail: 缺失投资判断数据，使结论停留在跟踪，而不是买入。
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
      - CV016
