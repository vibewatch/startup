            body: >-
              公开信息呈现的 Agrovision 成立于 2012 年，如今以 Fruitist
              品牌营销，并越来越多地将自己描述为消费者驱动的健康零食企业，而不只是种植商。公司和第三方材料都将其描述为覆盖种植、包装、运输和营销的垂直整合模式，把浆果定位为加工零食的高端替代品。独立报道显示其总部在加州，并在俄勒冈州、墨西哥、智利、秘鲁、摩洛哥、埃及、印度和中国开展农业或商业运营。规模故事总体有力，但若干运营指标仍来自公司自述，尚未经过独立审计。
