  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 品牌销售速度、高端定价和垂直整合证明其经济性在结构上优于公开生鲜同行。
        - 只有投资者能够证明应为品牌增长而非生鲜敞口付费，价值才会明显高于最新披露的独角兽估值锚点。
        - 利润率证据未能兑现；增长过度依赖促销或渠道扩张。
        - 需要披露利润率改善、零售商售罄率证据和清晰的融资条款。
      - - 基准
        - 公司继续增长，但外部投资者仍依赖有限的公开财务披露。
        - 在披露更好的经济性和股权表明细前，价值维持在最新约 $1B 的公开锚点附近。
        - 公司仍具备融资能力，但难以精确评估。
        - 与当前证据集合最为一致。
      - - 悲观
        - 当前规模掩盖了较弱的现金经济性，或下一轮融资引入下行定价或投资者保护条款。
        - 若增长放缓或融资条款意味着估值重置，价值将跌破最新公开独角兽估值。
        - 下轮融资风险、倍数压缩，以及高端鲜品运营波动。
        - 增长转弱、融资质量下降，或无法调和分销与盈利说法，都将发出这一信号。
    notes: 情景行有意保持粗粒度：证据只支持相对于最新公开估值锚点的方向性区间，不支持精确的现金流折现结果。
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV009
      - CV012
      - CV015
      - CV016
