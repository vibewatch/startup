        title: 管理层梯队扩大，但关键人依赖仍围绕创始人
        blocks:
          - type: paragraph
            body: >-
              作为联合创始人兼 CEO，Steve Magami 仍是公司对外的核心面孔，品牌重新定位、融资叙事和品类论点也主要由他阐述。公司在 2025 年还披露了财务、技术和董事会层面的新增成员，包括出任 CFO 的
              Rich Sullivan、加入董事会的 Thomas Seifert 和 June Yang，以及首任 CTO Jim
              Trahanas。这扩大了表层治理和执行覆盖，但指定来源没有披露委员会架构、董事会独立性、创始人持股或贷款方控制，因此治理深度仍无法从外部核实。
