  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类逻辑
        blocks:
          - type: paragraph
            body: >
              Agrovision
              的市场边界比“所有农产品”窄，也比“所有零食”窄。公司当前切入口是以巨型蓝莓为主的高端品牌浆果，并延伸至黑莓、覆盆子、樱桃和即拿即走形态，瞄准更健康的零食场景。因此，相关替代集合有两面：一面是争夺农产品货架空间的其他高端浆果和全年鲜果项目；另一面是争夺同一餐间需求的加工或高热量零食。


              证据也说明了为什么必须守住边界。公司和投资人材料引用的全球零食及健康零食市场，远比品牌鲜浆果宽泛；进口和价格数据描述的则是实际决定供给、零售规划和利润率的更窄运营市场。因此，对尽调最有用的框架是：通过全年零售项目销售的高端浆果；健康零食邻近市场只能作为上行背景，不能直接视为
              TAM。
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
              - CM011
