      - number: '2.3'
        title: 买方图谱、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >
              实际买方是需要稳定高端农产品周转的零售商或进口项目品类团队，经济支付者则是选择更健康零食的终端消费者。证据指向三项核心采用驱动：稳定可复制的食用品质、由地域错开的生产创造的全年供应，以及消费者转向更鲜、更具功能性的零食。


              这些因素支撑高端定位，但约束同样清晰。2026
              年初美国市场价格走高，说明天气或季节性冲击时供给仍会收紧。秘鲁作物仍易受低温时数不足、湿度、病害压力和物流中断影响，因此，支撑全年项目的供应基础也带来了气候和执行风险。管理层认为足迹多元化后关税可控，但估值判断仍需把进口依赖、冷链执行和供应波动纳入评估，不能假设单靠品牌需求就能消除这些摩擦。
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM013
              - CM015
