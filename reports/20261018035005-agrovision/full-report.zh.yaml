  - id: TV002
    title: 正论 / 反论表
    columns:
      - 框架
      - 论点
      - 哪些事实会改变判断
    rows:
      - - 正论
        - Fruitist 有真实商业化证据：$400M 销售额、大规模零售分销，以及支撑品牌健康零食故事的新资本。
        - 若管理层证明品牌增长能转化为持久的毛利率和现金创造优势，则上调判断。
      - - 反论
        - 公开生鲜可比公司的收入和 EBITDA 倍数低得多，因此仅凭私有资产稀缺性不足以支持溢价买入。
        - 只有公开数据或尽调数据证明其经济性显著优于大宗生鲜同行，才可放松这一担忧。
      - - 执行风险
        - 即使品类有吸引力，鲜果仍面临成本、采购和质量控制压力。
        - 若管理层在多个季节证明产量韧性、腐损控制和零售销售速度，则降低风险判断。
    notes: 各行仅用本章留存的证据概括评估与等待之间的主要争论；经济性为空是尽调缺口，不是隐藏的正面因素。
