      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              核心利好是 Agrovision 并非只有故事，商业化已有实据：融资节奏公开，年销售额据报超过 $400
              million，零售覆盖广，并明显投入货架期管理，可能支撑高端定位。问题是，这些证据仍回答不了毛利率质量、现金转化和流动性能否持续。公开资料未披露实际定价、贡献毛利率、现金消耗、现金跑道或客户集中度，因此这仍是一门重资本生意，必须深挖尽调。结论不是模式已经失效，而是单靠公开资料，尚无法以投资级置信度评估收入质量和利润率路径。
