      - number: '2.2'
        title: 规模测算视角与市场结构
        blocks:
          - type: paragraph
            body: >
              保留的独立证据最能说明品类结构，而不是某个单一的已发布 TAM 数字。美国蓝莓需求越来越依赖进口：2022 至 2024 年，进口约占国内供应量的 65%；2026 年初美国春季旺季前，进口水果约占 USDA
              报告运输量的 99%。秘鲁是这一结构中的关键弹性供应方，2025 年向美国发运约 405.9 million pounds，占美国蓝莓进口总量的 56%。


              进口依赖之所以重要，是因为 Agrovision
              的增长更多取决于供应连续性、季节性套利和零售补货，而不是某个分析师给出的单一市场规模估计。公司关联材料中的更宽泛市场数字仍有参考价值，但只能作为不可比的观察视角：$600 billion 全球零食市场、$100
              billion 健康零食市场和 $32 billion 浆果子品类增长预测对应不同边界，并不是一条清晰的 TAM 到 SOM 漏斗。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM014
