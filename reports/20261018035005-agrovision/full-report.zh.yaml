  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：品牌高端供应对阵既有企业、合作伙伴与传统采购
        blocks:
          - type: paragraph
            body: >-
              相关买方替代方案不止一组可比对象。Fruitist 自有材料将公司定位为直接面向零售、完全整合的高端浆果供应商；2022 年与 Berries Paradise
              的合作又将产品扩展为三种浆果平台，在秘鲁和墨西哥拥有 10,000 英亩种植面积、120 million pounds
              产量。因此，直接比较对象是品牌高端营销商、秘鲁出口老牌企业和零售商现有的多来源采购模式的组合，而不只是 VC 支持的浆果品牌。Italian Berry 的独立季节排名进一步印证了这一点：Agrovision
              Peru 在 2025/26 年规模可观，但秘鲁出口吨位仍落后于 Camposol 和 Hortifrut，因此规模本身不是可守住的护城河。
