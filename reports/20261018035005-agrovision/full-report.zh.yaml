  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开市场进展
        blocks:
          - type: paragraph
            body: >-
              Agrovision 的变现形式清楚，但披露深度不足：公司以 Fruitist 品牌直接向零售商营销高端浆果，并以 Big Skye
              品牌在中国销售蓝莓，因此收入看起来主要来自品牌鲜农产品的终端销售，而不是软件式经常性合同或平台费。公开市场进展信号很有意义。2025 年 9 月，Blue Book Services 托管的一则 Fruitist
              公告称年销售额已超过 $400 million；到 2025 年 10 月，公司称产品已在北美超过 12,500 个零售门店和全球 40
              个国家销售。仍缺少的是收入构成：保留的公开来源都没有按浆果品种、地域、渠道、零售商或品牌形态拆分收入。
