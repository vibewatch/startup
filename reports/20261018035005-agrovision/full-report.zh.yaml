        title: 定价可见度与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据支持高端定位故事，但不足以建立可用的定价模型。保留来源描述了高端蓝莓、扩展中的浆果产品线和新的杯装零食
              SKU，却没有公布标价、实际净价、零售商返利或客户层面的合同结构。因此，投资判断只能转向运营代理指标。Agrovision 的 RipeLocker 合作称，该储存系统可将浆果新鲜度维持最长 12
              周——为通常水平的三倍——公司将其描述为减少损耗、触达更远市场的手段。独立技术文献说明其重要性：浆果极易腐败，采后损耗经常超过产量的 25%，冷链即使轻微偏离 0–2 °C，也可能显著恶化腐损经济性。
