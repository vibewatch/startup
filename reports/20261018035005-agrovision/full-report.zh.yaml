      - number: '8.2'
        title: 上行空间为何真实，以及反方论点为何仍重要
        blocks:
          - type: paragraph
            body: >-
              上行逻辑很直接。Fruitist 正在进入一个庞大的健康零食品类；某市场来源估计该品类 2026 年规模为 $117.9 billion，北美占需求的
              39.8%，公司已将这一主题转化为真实货架覆盖和新资本。蓝莓贸易数据也支持 Agrovision 所处品类具有持久供应链价值：美国 2025 年进口了 720 million pounds
              鲜蓝莓，其中秘鲁单独供应 406 million pounds。这个数字很重要，因为 Fruitist 的版图和产品品质故事依赖全年浆果采购。


              反方论点同样重要。同一份品类研究将更高的生产成本和原料采购挑战列为约束；对于依赖鲜食高端水果、而非耐储存包装零食的公司，这一点尤其重要。公开来源还对 Fruitist 究竟活跃于 28 个还是 40
              个国家说法不一，这是一个细小但有启示意义的信号，说明部分头部规模指标仍需管理层对账。最重要的是，与公开农产品公司的可比差距仍足够大，投资人不能在没有复购率、零售周转率和利润率结构证据的情况下，假设高倍数可持续。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: 情景框架与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              最近的公开估值锚点仍指向一家销售额超过 $400 million、价值约 $1 billion 的公司，不考虑债务或优先权条款时隐含销售额倍数约为
              2.5x。对于快速增长的品牌食品平台，这一估值并非明显过高；但最近的公开农产品可比公司收入倍数只有其一小部分，且当前轮次实际定价条款未披露，因此也不能自证便宜。基准情景应是持有并继续尽调：公司或许配得上这一估值，但公开证据尚未证明这一点。


              改变判断的条件应具体且可衡量。更积极的立场需要管理层披露毛利率、EBITDA
              或贡献利润率、客户和零售商集中度、当前股权表机制，并证明品牌浆果周转率在更广泛国际分销下仍能维持。如果下一轮融资下调价格、高端零食需求走弱，或运营数据表明品牌无法将规模转化为持久的现金经济性，则应采取更负面的立场。在其中一条路径得到证实之前，情景分析应有意保持粗略，并绑定尽调关口，而不是制造虚假的精确度。
            claimRefs:
              - CV005
              - CV008
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 当前建议
            body: 跟踪 Agrovision/Fruitist，而不是追逐头条独角兽估值：公司有足够规模证据，值得继续主动尽调，但公开经济性和融资细节不足以支持高确信度买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV015
              - CV016
          - type: callout
            title: 哪些因素可能击穿投资论点
            body: 融资重置、疲弱的终端销售经济性，或证明公司尽管有品牌定位但利润率仍像普通农产品，都会让当前估值显得昂贵，而不只是披露不足。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV012
              - CV016
