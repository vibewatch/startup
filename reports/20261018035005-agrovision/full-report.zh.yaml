  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资判断：跟踪公司，不要盲目追价
        blocks:
          - type: paragraph
            body: >-
              公开证据支持对价格敏感的跟踪判断，而不是买入。当前报道和公司关联融资报道显示，Fruitist 已有新鲜的需求证明：J.P. Morgan Asset Management 领投的 $150 million
              股权融资、据报超过 $400 million 的销售额，以及覆盖超过 12,500
              个零售门店。这足以说明公司已超越概念阶段叙事，进入规模化商业化。缺失的是投资判断细节。审阅来源没有披露当前轮次的定价机制、稀释、清算优先权、债务提款、毛利率、EBITDA
              或现金转化，因此公开记录尚未证明独角兽估值便宜。


              这一工作池中最好的公开可比公司是 Dole，按 2025 年末公开市场数据，其 EV/EBITDA 约为 7.1x，销售额倍数为
              0.16x。如果品牌周转率、垂直整合和健康零食定位确实带来比大宗农产品同行更好的结构性经济性，Agrovision
              应享有一定溢价；但溢价必须用利润率和现金流证据赢得，不能只凭规模推断。基于现有事实，正确做法是将公司留在主动观察名单中，并在按最新披露的独角兽锚点进行投资判断前，要求以经济性为核心的尽调。
