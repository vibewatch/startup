            body: >-
              汇总证据显示，竞争焦点在于果实品质稳定性、包装出货表现，以及零售商能否在一年更多周数里运营高端项目。Fruitist
              自己的采访称市场如今分为常规、高端、巨型和超巨型水果，买方因此选择品质与陈列项目，而非一箱大宗商品。Naturipe 通过专有品种和更大型陈列项目推进同一条高端化路线；Fall Creek 的 Sekoya
