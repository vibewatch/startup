      - number: '4.3'
        title: 资本需求、融资依赖与外部压力
        blocks:
          - type: paragraph
            body: >-
              Agrovision 的公开融资叙事仍以扩张为主。2024 年 3 月，公司称 Aliment 领投的新增长投资将用于全球扩张、分销、产品开发和技术；随后公开报道称 Agrovision 在 2024 年 8
              月又获得 $100 million，使估值超过 $1 billion。2025 年 10 月，Fruitist 宣布由 J.P. Morgan Asset Management 领投的另一轮 $150
              million 股权融资，仍围绕扩张和消费者需求，而非修复资产负债表。2025 年 9 月聘任 CFO
              并新增董事会成员，说明机构化财务纪律有所增强，但公开来源仍未披露现金余额、月度烧钱、现金跑道或债务义务。外部风险也仍在：2026 年蓝莓市场报道警告，秘鲁的厄尔尼诺状况可能推迟供应并降低产量，影响供给和价格。
