schemaVersion: report-v2
artifact: financials
slug: agrovision
runDate: 2026-10-18
company:
  name: Agrovision
chapter:
  number: 4
  title: Financials
  summary: >-
    Agrovision/Fruitist shows real commercial traction—management-linked sources say the business surpassed
    $400 million in annual sales by September 2025 and distributed into more than 12,500 North American
    retail locations plus 40 countries by October 2025—but public underwriting still depends on proxies
    rather than disclosed unit economics. The company continues to raise expansion capital while berry
    perishability, cold-chain sensitivity, and Peru climate exposure keep margin, working-capital, and
    runway judgment materially underdetermined.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      Agrovision’s monetization is straightforward in shape but not in disclosure depth: the company markets
      premium berries directly to retailers under Fruitist and markets blueberries in China under Big Skye,
      so revenue appears to come primarily from branded fresh-produce sell-through rather than software-like
      recurring contracts or marketplace fees. Public traction signals are meaningful. By September 2025,
      a Fruitist announcement hosted by Blue Book Services said annual sales had surpassed $400 million, and by October
      2025 the company said its products were sold in more than 12,500 retail locations across North America
      and 40 countries worldwide. What is still missing is mix: none of the retained public sources break
      revenue by berry type, geography, channel, retailer, or branded format.
    claimRefs: [CI001, CI004, CI005, CI006, CI007, CI014]
    tableRefs: [TI001]
  - id: pricing-and-unit-economics
    title: Pricing visibility and unit-economics proxies
    body: >-
      Public evidence supports a premium positioning story, not a usable pricing model. The retained sources
      describe premium blueberries, expanding berry lines, and new snack-cup SKUs, but they do not publish
      list price, realized net price, retailer rebates, or customer-level contract structure. That pushes
      underwriting toward operational proxies. Agrovision’s RipeLocker partnership says the storage system
      can maintain berry freshness for up to 12 weeks—three times the norm—and the company frames that as a
      way to reduce shrink and reach more distant markets. Independent technical literature shows why that
      matters: berries are unusually perishable, postharvest losses often exceed 25% of production, and even
      small deviations from a 0–2 °C cold chain can sharply worsen spoilage economics.
    claimRefs: [CI006, CI008, CI009, CI010, CI014, CI015]
    tableRefs: [TI002, TI003]
    figureRefs: [FI001]
  - id: capital-needs-and-financing-dependency
    title: Capital needs, financing dependency, and external pressure
    body: >-
      Agrovision’s public financing narrative remains expansion-led. In March 2024 the company said a new
      Aliment-led growth investment would fund global expansion, distribution, product development, and
      technology; later public reporting said Agrovision then secured another $100 million in August 2024,
      pushing valuation above $1 billion. In October 2025 Fruitist announced a further $150 million equity
      round led by J.P. Morgan Asset Management, again framed around expansion and consumer demand rather
      than balance-sheet repair. The September 2025 CFO hire and board additions suggest more institutional
      finance discipline, but public sources still do not disclose cash on hand, monthly burn, runway, or
      debt obligations. External risk also remains live: 2026 blueberry-market coverage warned that El Niño
      conditions in Peru could delay supply and reduce yields, affecting availability and pricing.
    claimRefs: [CI002, CI003, CI011, CI012, CI013, CI014]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      The core positive is that Agrovision looks commercially real rather than purely narrative: there is a
      disclosed funding cadence, reported annual sales above $400 million, broad retailer distribution, and
      visible investment in shelf-life control that plausibly supports premium positioning. The underwriting
      problem is that none of that resolves gross margin quality, cash conversion, or liquidity durability.
      Because public evidence does not disclose realized pricing, contribution margin, burn, runway, or
      customer concentration, the business still screens as capital-intensive and diligence-heavy. The right
      conclusion is not that the model is broken, but that revenue quality and margin path cannot yet be
      underwritten to investment-grade confidence from public sources alone.
    claimRefs: [CI004, CI011, CI013, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Fruitist premium blueberries
        - Direct retail produce sales under the flagship consumer brand
        - Cases / clamshells / snackable packs
        - Flagship line; company reports 12,500+ North American retail locations and 40 countries by Oct. 2025
        - Strong channel-reach signal, but no revenue mix or realized pricing disclosure
        - Revenue, gross margin, and shrink by SKU / retailer / geography
      - - Fruitist raspberries, blackberries, and cherries
        - Adjacent branded berry lines sold through the same retail network
        - Fresh berry packs / cases
        - Public sources describe ongoing scale-up beyond blueberries
        - Product breadth is clear; contribution by line is not
        - Revenue split and margin by berry category
      - - Big Skye blueberries in China
        - Consumer blueberry sales in China under a separate brand
        - Fresh berry packs
        - Active according to company descriptions, but no disclosed volume or price
        - Confirms international monetization, not economics
        - China revenue, channel mix, and working-capital profile
      - - Fruitist snack cups
        - Grab-and-go fresh-blueberry SKU for convenience snacking
        - Single-serve cups
        - Introduced in 2025 as a new branded format
        - Helpful sign of merchandising innovation; no sell-through or margin data
        - Velocity, retailer uptake, and unit economics versus clamshells
    notes: >-
      Rows summarize retained public evidence on disclosed revenue channels; values are descriptive because
      the company does not publish segment revenue mix, realized pricing, or product-level profitability.
    claimRefs: [CI001, CI005, CI006, CI007]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / channel
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Fruitist fresh berries in North American retail
        - Not publicly disclosed
        - Retained sources describe distribution and branding, not a public price sheet
        - Unknown retailer rebates, promo support, and net realization
        - Company releases and Blue Book coverage
      - - Big Skye blueberries in China
        - Not publicly disclosed
        - Brand presence is public; pricing architecture is not
        - Unknown distributor terms and local channel economics
        - Agrovision company descriptions
      - - Fruitist snack cups
        - Not publicly disclosed
        - Launch confirmed, but no list price or margin disclosure
        - Unknown packaging uplift, trade spend, and cannibalization versus core packs
        - October 2025 Fruitist financing announcement
    notes: >-
      Retained public sources describe channels and product formats but not list price, realized net price,
      retailer incentives, or contract structure; “not publicly disclosed” is literal, not zero.
    claimRefs: [CI001, CI006, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Annual sales
        - "> $400 million annual sales by Sep. 2025"
        - High
        - Shows meaningful scale and validates that the model is commercially active
        - Audited revenue, growth rate, and seasonality bridge
      - - Retail footprint
        - "> 12,500 North American retail locations; 40 countries"
        - Medium
        - Supports demand breadth and channel penetration as revenue-quality proxies
        - Door productivity, retailer concentration, and reorder cadence
      - - Shelf-life / shrink proxy
        - Up to 12 weeks without loss of quality; “three times the norm” in partner announcement
        - Medium
        - Longer shelf life can lower shrink, widen geography, and protect gross profit
        - Realized shrink reduction, spoilage rate, and sell-through by lane
      - - Berry postharvest loss benchmark
        - Losses often exceed 25% of production in the category
        - Medium
        - Illustrates why logistics and storage control are financially material
        - Agrovision-specific shrink, claims, and write-off history
      - - Cold-chain sensitivity
        - 0–2 °C is critical; small deviations can sharply worsen respiration
        - Medium
        - Margin and working capital likely depend on temperature control discipline
        - Temperature excursions, rejection rates, and claims cost
      - - CAC / payback / gross margin / burn / runway
        - Not publicly disclosed
        - Low
        - These are the missing metrics that determine capital efficiency and financing dependency
        - Cohort-level CAC, gross margin bridge, cash burn, runway, and debt schedule
    notes: >-
      Rows mix company-reported scale signals with independent category benchmarks; “not publicly disclosed”
      means the retained public record did not provide a usable company-specific value.
    claimRefs: [CI004, CI005, CI008, CI009, CI010, CI014]
figures:
  - id: FI001
    title: Public revenue-to-gross-profit bridge (proxy view)
    type: flow
    summary: >-
      Public sources allow a logic bridge from reliable supply into branded revenue, but the gross-profit
      step is still proxy-based because Agrovision does not disclose realized pricing or margin.
    data:
      nodes:
        - label: Year-round supply platform
          value: Diversified microclimates + vertical integration
          note: Public sources describe owned / controlled production across multiple growing regions.
        - label: Direct retail distribution
          value: 12,500+ North American retail locations; 40 countries
          note: Channel breadth is disclosed publicly, but customer concentration is not.
        - label: Branded berry revenue
          value: Fruitist blueberries, adjacent berries, snack cups; Big Skye in China
          note: Revenue shape is visible; revenue mix by line and region is not.
        - label: Postharvest and cold-chain performance
          value: Up to 12 weeks shelf life claim; 0–2 °C discipline matters
          note: Shelf-life technology and cold-chain execution plausibly determine shrink and claims cost.
        - label: Gross-profit conversion
          value: Margin sensitive to shrink, logistics, and fruit quality
          note: Industry literature says berry postharvest losses often exceed 25% of production.
        - label: Expansion capital
          value: 2024 and 2025 equity rounds earmarked for growth
          note: Public capital is framed around expansion, distribution, technology, and demand capture.
      edges:
        - from: Year-round supply platform
          to: Direct retail distribution
          relationship: Reliable supply supports retailer placement.
        - from: Direct retail distribution
          to: Branded berry revenue
          relationship: Retail doors convert placement into sell-through.
        - from: Branded berry revenue
          to: Postharvest and cold-chain performance
          relationship: Fresh-produce revenue quality depends on keeping fruit saleable.
        - from: Postharvest and cold-chain performance
          to: Gross-profit conversion
          relationship: Shrink and logistics discipline shape realized profitability.
        - from: Gross-profit conversion
          to: Expansion capital
          relationship: Opaque margins increase reliance on external funding for growth.
    approximationNotes: >-
      This is a qualitative bridge derived from disclosed operations, financing use, and category science;
      Agrovision does not publish realized pricing, gross margin, or contribution-margin bridges.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI015]
callouts:
  - calloutType: strength
    title: Scale signal is real
    body: >-
      The strongest financial positive is not a disclosed margin curve but a disclosed demand footprint:
      reported annual sales above $400 million plus broad retail distribution make Agrovision more tangible
      than a typical private-food narrative story.
    claimRefs: [CI004, CI005]
  - calloutType: risk
    title: Underwriting still depends on diligence, not disclosure
    body: >-
      Public evidence does not close the key investment questions around realized pricing, margin,
      shrink, cash burn, runway, debt, and customer concentration, so climate or supply shocks could hit
      economics more sharply than the current public story implies.
    claimRefs: [CI013, CI014, CI015]
