evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current FTE and seasonal labor breakdown by geography and function.
    whyItMatters: >-
      Labor intensity drives operating leverage, climate resilience, and execution risk in a vertically integrated
      produce business.
    diligencePath: Request HR reporting for permanent and seasonal workers by country, plus recent hiring or attrition trends.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited revenue, gross margin, EBITDA, cash burn, debt, and covenant disclosures for 2024-2025.
    whyItMatters: Later valuation and financing judgments are weak without audited profitability and liquidity context.
    diligencePath: Request audited financial statements, lender materials, and board-approved budget versus actuals.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: capital-raised
    missingEvidence: A reconciled financing history separating equity, debt, secondaries, and any non-equity capital.
    whyItMatters: Conflicting public totals prevent clean dilution, ownership, and valuation analysis.
    diligencePath: Obtain the cap table, financing chronology, term sheets, and current debt summary with outstanding balances.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: Board committee structure, independent director roles, founder ownership, and investor control rights.
    whyItMatters: Governance depth and downside protection cannot be inferred from announcement-level leadership additions.
    diligencePath: Request board materials, shareholder agreement summaries, committee rosters, and the latest governance chart.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent TAM, SAM, and SOM work for branded premium berries or fresh healthy snacking, with explicit geography,
      buyer population, and methodology.
    whyItMatters: >-
      Without a defensible independent sizing stack, valuation arguments can over-index on broad snack adjacencies that
      are not directly addressable by fresh produce brands.
    diligencePath: >-
      Request management's market model, then reconcile it against retailer category data, public berry consumption
      datasets, and any third-party syndicated produce-category scans.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Retailer-level velocity, repeat purchase, promo effectiveness, and margin performance by channel.
    whyItMatters: >-
      The market story depends on premium velocity and repeat behavior, but the retained public evidence does not prove
      how durable that economics is across retailers or seasons.
    diligencePath: >-
      Ask for category manager references, retailer scorecards, sell-through cohorts, and margin bridges by channel and
      season.
    relatedQuestionRefs:
      - QM003
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Current retailer price lists, pack architecture, rebate structure, and contract duration for Fruitist, Naturipe,
      and comparable Peru exporters.
    whyItMatters: >-
      The chapter can describe premium segmentation, but it cannot verify whether Fruitist commands durable realized
      pricing power or merely premium marketing language.
    diligencePath: >-
      Request current customer decks, retail contracts, and invoice samples from management and compare against Naturipe
      or retailer procurement benchmarks.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-cost-evidence
    missingEvidence: >-
      Named retailer case studies showing exclusivity, retention, or shelf-space dependence on Fruitist versus
      multi-source berry procurement.
    whyItMatters: >-
      Without customer proof, the inferred multi-homing risk remains more credible than any unsupported claim of buyer
      lock-in.
    diligencePath: >-
      Collect retailer testimonials, shelf-set data, or category review documents that show whether Fruitist displaces
      or merely complements incumbent suppliers.
    relatedQuestionRefs:
      - QP004
  - type: missing-source
    severity: minor
    topic: competitor-funding
    missingEvidence: Comparable public funding, ownership, or balance-sheet detail for peer berry marketers and genetics platforms.
    whyItMatters: The profile table can compare scale and strategic direction, but not capital endurance across competitors.
    diligencePath: >-
      Pull private-company financing disclosures, lender materials, or public-company segment reporting for the leading
      comparator set.
    relatedQuestionRefs:
      - QP001
      - QP006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Agrovision price lists, invoice samples, retailer rebate structure, and net realized pricing by SKU and channel.
    whyItMatters: Premium branding does not prove net price realization or gross-margin quality.
    diligencePath: Request customer contracts, invoice cohorts, and weekly sell-through / promo reports by SKU.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Company-specific gross margin, shrink, CAC, payback, sales-cycle, and contribution-margin data.
    whyItMatters: >-
      These metrics determine whether Agrovision’s scale is creating durable cash earnings or just absorbing more
      capital.
    diligencePath: >-
      Request board / lender packs with cohort economics, shrink history, margin bridge, and channel-level CAC / payback
      analysis.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: blocking
    topic: liquidity-runway
    missingEvidence: Current cash balance, monthly burn, runway, debt facilities, covenants, and project-finance obligations.
    whyItMatters: >-
      Repeated expansion rounds do not reveal whether the company is adequately capitalized or close to another
      financing trigger.
    diligencePath: Request cap table, debt schedule, monthly cash bridge, and 12- to 18-month liquidity forecast.
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by retailer, geography, berry category, and seasonal cohort.
    whyItMatters: Broad door count can still mask meaningful exposure to a small set of buyers or seasonal lanes.
    diligencePath: Request top-10 customer concentration, repeat-order rates, and gross sales by retailer / region / berry line.
  - type: missing-source
    severity: material
    topic: control-assurance
    missingEvidence: >-
      Company-specific food-safety certifications, audit cadence, recall history, and control dashboards for cold-chain
      execution.
    whyItMatters: >-
      Premium-fruit differentiation depends on repeatable quality assurance, but public sources do not verify how
      Fruitist measures and governs that promise.
    diligencePath: >-
      Request GlobalG.A.P./GFSI or equivalent certifications, QA SOPs, seasonal reject-rate dashboards, and any recall
      or incident logs.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: shelf-life-tech
    missingEvidence: >-
      Independent trial results showing how RipeLocker or AI sorting affect shrink, shelf life, or retailer sell-through
