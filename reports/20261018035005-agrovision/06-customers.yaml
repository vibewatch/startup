company:
  name: Agrovision
chapter:
  number: 6
  title: Customers
  summary: Agrovision has credible shelf-presence evidence across major U.S. grocery and club chains plus a newly documented UK Whole Foods listing, but most adoption proof is still company-issued distribution data rather than independently disclosed retention or account economics. Public sources support expansion into snackable formats and broad international retail reach, yet they leave renewal, concentration, and even the exact country footprint unresolved.
sections:
- id: customer-mix-and-channel-footprint
  title: Customer mix and channel footprint
  body: 'Current public evidence points to Agrovision selling through a retailer-led model rather than a single wholesale channel. The official Fruitist brand page positions the company as a premium berry supplier with blueberries, raspberries, and blackberries available at retailers nationwide, while company-issued releases extend that picture into U.S. grocery, club, and natural-food accounts and into international supermarket, club, and high-end independent channels. External market data also fits that posture: blueberry demand is routed through supermarkets, convenience, online, and snack-oriented end markets, which helps explain why Agrovision keeps emphasizing premium snacking formats rather than bulk commodity fruit alone.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU012
  tableRefs:
  - TU001
- id: adoption-proof-and-expansion-signals
  title: Adoption proof and expansion signals
  body: 'The strongest adoption proof is named shelf presence and repeated public door-count claims, not disclosed repeat-purchase data. Company-distributed releases in 2024 and 2025 keep naming the same major U.S. retail accounts and say the brand now reaches more than 12,500 retail locations, while independent trade coverage adds a concrete UK proof point: an exclusive Whole Foods Market launch for the GoBerry snack format with further expansion planned. FreshFruitPortal and InvestInAg both frame customer demand as supporting continued expansion, but the quality of proof remains mixed because those signals still stop short of active-account retention, same-store sell-through, or cohort evidence.'
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU011
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU001
- id: durability-concentration-and-diligence-gaps
  title: Durability, concentration, and diligence gaps
  body: Durability is where the public customer story is thinnest. None of the reviewed sources disclose NRR, GRR, churn, renewal rates, contract length, or top-customer concentration, so the available record proves distribution momentum but not retention quality. That missing evidence matters because outside food-and-beverage diligence frameworks explicitly punish retailer concentration, churn, and weak customer-level proof, and fresh-produce economics can blunt pricing power even when category demand is favorable. It also leaves investors unable to separate repeat velocity from launch-driven merchandising wins or seasonal trial spikes. The result is a customer narrative that is directionally strong on access and demand creation but still under-documented on stickiness and account concentration.
  claimRefs:
  - CU009
  - CU010
  - CU013
  - CU014
