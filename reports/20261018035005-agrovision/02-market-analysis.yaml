figures:
  - id: FM001
    title: Market sizing lens from snack adjacency to operating market
    type: pyramid
    summary: The strongest available evidence does not support a single comparable TAM/SAM/SOM stack, so this lens moves from broad snack adjacencies into observed blueberry-market structure and then to Fruitist's own reported scale.
    data:
      items:
        - label: Global snacking adjacency
          value: 600
          unit: USD bn
          valueNote: Broad company-framed top-of-funnel market
          note: Not berry-specific and not directly addressable by fresh fruit alone.
          claimRefs: [CM010]
        - label: Healthy snack adjacency
          value: 100
          unit: USD bn
          valueNote: Company-linked healthy-snack framing
          note: Narrower than total snacking, but still broader than premium berries.
          claimRefs: [CM010]
        - label: Berry sub-category forecast
          value: 32
          unit: USD bn
          valueNote: Expected value over the next five years
          note: Forecast methodology and geography are not disclosed in the retained source.
          claimRefs: [CM010]
        - label: U.S. fresh blueberry imports in 2025
          value: 719.8
          unit: M lb
          valueNote: Record annual import volume
          note: Operating-market volume lens rather than spend.
          claimRefs: [CM005]
        - label: Peru share of U.S. blueberry imports in 2025
          value: 405.9
          unit: M lb
          valueNote: 56% of total U.S. import volume
          note: Shows concentration in the key supply origin rather than end-market demand.
          claimRefs: [CM006]
        - label: Fruitist trailing-12-month sales
          value: 400
          unit: USD m
          valueNote: Company-reported sales over the past 12 months
          note: Company scale lens, not market size.
          claimRefs: [CM009]
    approximationNotes: The layers intentionally mix market-value, volume, and company-scale lenses because the retained evidence does not provide a single comparable TAM/SAM/SOM dataset for branded premium berries.
    claimRefs: [CM005, CM006, CM009, CM010, CM014]
