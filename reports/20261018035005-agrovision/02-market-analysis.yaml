      - ["Club and warehouse retail", "Produce buyer for bulk-pack produce", "Families and value-conscious bulk shoppers", "Consumers", "Large-format fresh-snack program where quality consistency matters", "Merchandising budget", "Reliable supply plus differentiated eating quality."]
