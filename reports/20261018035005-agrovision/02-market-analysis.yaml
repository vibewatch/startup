      - Limitation
    rows:
      - [Business Wire via FinancialContent, 2025, Global, "$600B global snacking market", null, "Company financing release frames Fruitist against all snacking", Low, "Very broad adjacency; not berry-specific and not an addressable market for fresh fruit."]
      - [InvestInAg, 2025, Global, "$100B healthy snack market", null, "Trade article says Fruitist aims to disrupt healthy snacks", Low, "Still company-linked framing; boundary differs from total snacking."]
      - [InvestInAg, 2025, Global, "$32B berry sub-category in the next five years", null, "Trade article cites a forward-looking berry-category projection", Low, "Forecast methodology and geographic scope are not disclosed."]
      - [FreshFruitPortal / USDA Market News, 2026, United States, "719.8M lb fresh blueberry imports in 2025", "+5% vs. 2024", "Observed trade-flow lens for the U.S. operating market", Medium, "Volume lens, not spend; U.S. only."]
      - [International Blueberry Organization / USDA, 2026, "Peru to U.S.", "405.9M lb; 56% share of U.S. imports", null, "Observed supplier-concentration lens within the U.S. market", Medium, "Import-share lens, not total category value."]
      - [FreshFruitPortal / USDA Market News, 2026, United States, "$28.10-$31.15 per flat wholesale; $3.21-$3.55 per 6-ounce retail", "+10% to +14% vs. prior year months cited", "Observed early-2026 pricing lens for market tightness", Medium, "Short-window pricing data rather than full-year market economics."]
    notes: These lenses are intentionally non-additive and non-comparable across units; they show adjacency, supply concentration, and pricing rather than a single clean TAM-to-SOM stack.
    claimRefs: [CM004, CM005, CM006, CM007, CM010, CM014]
