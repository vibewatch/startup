company:
  name: Agrovision
chapter:
  number: 2
  title: Market Analysis
  summary: Fruitist is best understood as a premium-berry and healthier-snacking play rather than a generic produce vendor, but the retained evidence does not support a clean independent TAM/SAM/SOM stack. The strongest external sizing signals instead come from U.S. blueberry import dependence, Peru's dominant export role, and company-linked adjacency claims spanning premium berries, healthy snacks, and broader snacking.
sections:
  - id: market-boundary
    title: Market boundary and category logic
    body: |
      Agrovision's market boundary is narrower than "all produce" and narrower than "all snacks." The company's current wedge is premium branded berries led by jumbo blueberries, with adjacent blackberries, raspberries, cherries, and grab-and-go formats positioned for healthier snacking occasions. That makes the relevant substitution set two-sided: on one side, other premium berries and year-round fresh-fruit programs competing for produce shelf space; on the other, processed or indulgent snacks competing for the same between-meal demand.

      The evidence also shows why boundary discipline matters. Company and investor materials cite global snacking and healthy-snacking markets that are much broader than branded fresh berries, while import and price data describe the narrower operating market that actually governs availability, retail planning, and margin. For diligence, the most decision-useful frame is therefore premium berries sold through year-round retail programs, with healthier-snacking adjacencies treated as upside context rather than as a direct TAM.
    claimRefs: [CM001, CM002, CM009, CM010, CM011, CM012, CM014]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and market structure
    body: |
      The retained independent evidence is strongest on category structure, not on a single published TAM figure. U.S. blueberry demand is increasingly met by imports: imports represented about 65% of domestic availability from 2022 through 2024, and imported fruit accounted for roughly 99% of USDA-reported shipment volume in early 2026 before the U.S. spring peak. Peru is the key swing supplier within that structure, shipping about 405.9 million pounds to the United States in 2025, or 56% of total U.S. blueberry import volume.

      That import intensity matters because it links Agrovision's growth to supply continuity, seasonal arbitrage, and retail replenishment more than to a single analyst market-size estimate. The broader market figures in company-linked material are still useful, but only as non-comparable lenses: a $600 billion global snacking framing, a $100 billion healthy-snack framing, and a $32 billion berry-subcategory growth projection are different boundaries, not a clean TAM-to-SOM funnel.
    claimRefs: [CM004, CM005, CM006, CM007, CM009, CM010, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyer map, adoption drivers, and constraints
    body: |
      The practical buyer is the retailer or import-program category team that needs reliable premium produce velocity, while the economic payer is the end consumer choosing a better-for-you snack. The evidence points to three core adoption drivers: repeatable eating quality, year-round availability created by geographically staggered production, and a consumer shift toward fresher and more functional snacks.

      Those drivers support premium positioning, but the constraint stack is equally clear. U.S. market prices moved higher in early 2026, showing that availability still tightens when weather or seasonality bites. Peru's crop remains sensitive to chilling-hour deficits, humidity, disease pressure, and logistics disruption, so the supply base that enables year-round programs also introduces climate and execution risk. Management argues tariffs are manageable because the footprint is diversified, but a valuation case still has to underwrite import dependence, cold-chain execution, and supply volatility rather than assuming branded demand alone clears those frictions.
    claimRefs: [CM003, CM007, CM008, CM013, CM015]
    tableRefs: [TM003]
