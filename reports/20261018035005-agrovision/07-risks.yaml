callouts:
  - calloutType: "risk"
    title: "Top thesis-break triggers"
    body: >-
      Treat the underwriting case as broken if Peru weather disruption causes repeated export
      misses, if the company needs more capital before current plantings mature, or if major
      retail doors show delisting, heavy promotional dependence, or sustained quality
      complaints.
    claimRefs: ["CR008", "CR015", "CR016"]
  - calloutType: "assumption"
    title: "Regulatory risk is still under-documented"
    body: >-
      The retained public pool does not yet prove Agrovision's own certification, recall, or
      litigation posture, so investors should require primary compliance evidence before
      assuming low legal or food-safety risk.
    claimRefs: ["CR010", "CR014"]
