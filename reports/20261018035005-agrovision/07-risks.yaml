company:
  name: "Agrovision"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Agrovision's residual risk stack is led by climate and export-logistics volatility,
    long-dated capital payback, and customer/channel dependence rather than by weak category
    demand. Public evidence shows strong funding access and broad distribution, but it does
    not yet disclose the compliance, margin, concentration, or contingency metrics needed to
    underwrite those risks as low.
sections:
  - id: "ranked-risk-picture"
    title: "Ranked residual risk picture"
    body: >-
      The strongest evidence points to a three-part risk stack. First, Agrovision remains
      exposed to agricultural and export volatility because Peru is still under a Coastal El
      Niño alert through November 2026 and berry programs are unusually perishable. Second,
      the company is scaling with long biological lead times: management told AgFunder that
      production investments can take about five years to mature, while third-party coverage
      still frames the company around fresh financing and valuation milestones rather than
      around disclosed margin or cash conversion data. Third, broad retail reach reduces
      single-door dependence, but it also raises the cost of any fill-rate or quality miss
      because the brand promise now spans more than 12,500 retail locations and 40
      countries. The heatmap therefore ranks climate/logistics volatility, capital intensity,
      and retailer dependence as the highest residual exposures.
    claimRefs: ["CR002", "CR003", "CR004", "CR006", "CR008", "CR015", "CR016"]
    figureRefs: ["FR001"]
  - id: "operational-and-regulatory-execution"
    title: "Operational and regulatory execution risk"
    body: >-
      Agrovision's footprint is an operating advantage only if the company can manage it
      without service or compliance slips. Independent coverage now describes production or
      development across Peru, Mexico, Chile, Morocco, Egypt, India, China, Oregon, Romania,
      Thailand, Indonesia, and the Philippines, which increases exposure to labor markets,
      phytosanitary rules, weather variance, and cross-border logistics. Sector reports also
      flag labor inflation and tighter pesticide and importer standards as live risks for
      berries in 2025-2026. The operational benchmark from Driscoll's is useful here: the
      economics of fresh berries can deteriorate within days when routes fail or temperature
      control slips. What remains unproven publicly is Agrovision's own audit, recall,
      insurance, and crisis-response record, so regulatory and food-safety risk should be
      treated as partially mitigated rather than closed.
    claimRefs: ["CR005", "CR007", "CR008", "CR009", "CR010", "CR014"]
    tableRefs: ["TR001", "TR002"]
  - id: "commercial-capital-and-dependency-risk"
    title: "Commercial, capital, and dependency risk"
    body: >-
      The category backdrop is constructive: both market researchers and Tastewise show a
      growing berry and healthy-snacking market. That backdrop does not remove business-model
      risk, because Agrovision is simultaneously broadening crop lines, launching portable
      formats like Snack Cups, and building new geographies while public disclosures still
      omit customer concentration, gross margin, working-capital intensity, and debt or
      covenant detail. The latest capital rounds reduce near-term funding pressure, but they
      also underscore how dependent the model remains on continued execution before orchards
      mature and before branded velocity is proven across a larger product set. Investors
      should therefore monitor retailer retention, weather-adjusted fill rates, and the need
      for additional external capital as explicit kill criteria.
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR011", "CR012", "CR013", "CR015", "CR016"]
    tableRefs: ["TR003"]
