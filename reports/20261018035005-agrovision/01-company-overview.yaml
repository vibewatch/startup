company:
  name: "Agrovision"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Agrovision now presents itself to consumers as Fruitist, a vertically integrated berry
    platform that has tried to move from upstream agriculture into a branded healthy-snacking
    story. Public evidence supports meaningful scale, a 2024-2025 financing cadence, and a
    widened executive bench, but headline metrics on revenue, total capital raised, geographic
    reach, and workforce size still rely on mixed or unaudited disclosures.
sections:
  - id: "identity-and-model"
    title: "Identity, brand pivot, and operating footprint"
    body: >-
      The current public picture is of a company founded as Agrovision in 2012 that now markets
      under the Fruitist brand and increasingly describes itself as a consumer-led healthy-snacking
      business rather than only a grower. Company and third-party materials consistently describe a
      vertically integrated model spanning farming, packing, shipping, and marketing, with berries
      positioned as a premium substitute for processed snacks. Independent reporting places the
      headquarters in California and describes agricultural or commercial operations across Oregon,
      Mexico, Chile, Peru, Morocco, Egypt, India, and China. The scale story is directionally
      strong, but several operating metrics remain company-quoted rather than independently audited.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO011", "CO012"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership bench is broader, but key-person dependence remains founder-centric"
    body: >-
      Steve Magami remains the central public face of the business as co-founder and chief
      executive, and the brand repositioning, fundraising narrative, and category thesis are still
      largely articulated through him. During 2025 the company also disclosed additions to finance,
      technology, and board leadership, including Rich Sullivan as CFO, Thomas Seifert and June
      Yang to the board, and Jim Trahanas as its first CTO. That broadens surface-level governance
      and execution coverage, but the assigned source pool does not disclose committee structure,
      board independence, founder ownership, or lender controls, so governance depth is still not
      externally verifiable.
    claimRefs: ["CO009", "CO010", "CO015"]
    tableRefs: ["TO002"]
  - id: "funding-scale-and-stakeholders"
    title: "Funding momentum is visible, but the capital stack is still not cleanly public"
    body: >-
      Public reporting supports a sequence of external financings: an Aliment Capital-led round in
      March 2024, a further August 2024 equity infusion that pushed valuation above $1 billion, and
      a $150 million round led by J.P. Morgan Asset Management in late October 2025. The same
      public record also shows why diligence still needs a direct cap-table readout. Yahoo framed
      lifetime equity funding at $443 million, while ItalianBerry cited more than $600 million of
      raised capital, suggesting a likely mix of equity, other capital, or different reporting
      cutoffs rather than a single reconciled figure. Stakeholder importance is therefore obvious,
      but economics, ownership, and control rights are not.
    claimRefs: ["CO006", "CO007", "CO008", "CO013", "CO014", "CO015"]
    tableRefs: ["TO003"]
  - id: "milestones-and-current-caveats"
    title: "Recent milestones support the growth story, while agriculture-specific risk remains real"
    body: >-
      The milestone arc is clear: the consumer brand launched before the parent-company rename, the
      company expanded into China, local production came online there in early 2025, and the 2025
      financing round paired new capital with additional executive appointments. But the assigned
      sources also underline that Agrovision remains exposed to agricultural execution risk. Public
      commentary around a possible IPO remains speculative, not company-confirmed, and 2026 Peru
      crop reporting warned that abnormal weather could still disrupt productivity in the region
      where Fruitist has its largest disclosed growing footprint. For later chapters, the core
      takeaway is that the business may be building a branded moat on top of a still climate- and
      capital-sensitive production base.
    claimRefs: ["CO005", "CO007", "CO008", "CO010", "CO016"]
    figureRefs: ["FO001"]
