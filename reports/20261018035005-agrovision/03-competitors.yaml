        min: 1
        max: 5
        lowLabel: "Commodity / generic"
        highLabel: "Premium / proprietary"
        description: "Higher scores indicate more evidence of branded, varietal, or merchandising leverage in premium berries."
      points:
        - label: "Fruitist"
          x: 5
          y: 5
          detail: "Direct-to-retail premium berry branding plus vertically integrated and year-round supply claims."
        - label: "Naturipe"
          x: 3
          y: 4
          detail: "Retail-facing premium merchandising and proprietary varieties, but the assigned pool does not show the same integrated global footprint."
        - label: "Camposol / Hortifrut"
          x: 4
          y: 2
          detail: "Higher reported Peru export scale, but the assigned pool is thinner on consumer-facing premium differentiation."
        - label: "Berries Paradise"
          x: 3
          y: 3
          detail: "Strong berry-category complement and continuity, but evidenced here as a partner rather than a standalone premium brand."
        - label: "Fall Creek / Sekoya"
          x: 2
          y: 4
          detail: "Differentiation comes from genetics, storability, and fruit-size performance rather than a retailer-facing supply program."
        - label: "Retailer multi-source build"
          x: 2
          y: 2
          detail: "Lower branded differentiation, but retains buyer flexibility and weakens switching costs."
    approximationNotes: "Scores are evidence-backed ordinals derived from the assigned pool only; they are not source-published coordinates or market-share values."
    claimRefs: ["CP014", "CP015", "CP016"]
