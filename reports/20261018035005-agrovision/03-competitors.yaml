      - ["Peru exporter volume contract", "Public price not disclosed; evidence centers on export tonnage instead of pack-level economics", "High-volume supply and destination reach", "Brand support, category-management service, and premium pack mix by exporter", "Can satisfy volume demand even when premium brand economics are unclear"]
