schemaVersion: report-v2
artifact: customers
slug: garner-health
runDate: '2026-06-04'
company:
  name: Garner Health
chapter:
  number: 6
  title: Customers
  summary: >-
    Garner's customer traction is real and broad enough to clear the customer-proof bar: independent February 2026 coverage put the company at more than 700 organizations and 2.5 million members, while May 2026 company-distributed financing materials said it was nearing 800 customers and partners with more than 2.5 million people covered. The strongest public proof sits in employer and broker case studies—MarketStar, Metal Exchange Corporation, Nightingale Education Group, Alera, HUB, McGriff, and USI—plus expanding provider-side partnerships with Marathon and Atlantic Health. The biggest remaining diligence gaps are retention, concentration, exact payer mix, and whether mixed member-review surfaces signal a real trust or adoption ceiling.
sections:
  - id: scale-and-segmentation
    title: Customer base size, buyer mix, and date-sensitive scale markers
    body: >-
      Garner's public customer footprint is best read as a range rather than a single immutable number. Independent February 2026 coverage from Fierce Healthcare said Garner served 700 organizations and reached 2.5 million members, while May 2026 PR-distributed financing materials and the Yahoo Finance mirror said the company partnered with almost 800 customers and more than 2.5 million people. That looks like rapid growth over a short interval, not a contradiction, but the exact denominator still matters because the company alternates among customers, clients, employers, and partners. The buyer mix is broader than just self-insured HR teams. Garner's solution pages explicitly target employers, advisors, health plans, and providers, and the case-study record shows both self-funded and fully insured employers using the product as an overlay on existing networks. Public evidence also supports a layered buyer-user-payer model: employers and health plans pay, advisors and brokers distribute, provider organizations use referral analytics, and members are the end users whose behavior drives savings. What remains undisclosed is the exact vertical split, payer/TPA count, enterprise versus mid-market mix, and how much of the near-800 count is true paying employers versus channel or strategic partners.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU040, CU041, CU047, CU048, CU049]
    tableRefs: [TU001, TU002]
    figureRefs: [FU002]
  - id: named-customer-proof
    title: Named employer, advisor, and logo proof is the strongest public traction evidence
    body: >-
      Garner has unusually specific public customer proof for a private benefits-navigation company, but it is uneven in depth. The cleanest named employer cases are MarketStar, Metal Exchange Corporation, and Nightingale Education Group. All three show Garner layered onto existing plans rather than replacing the carrier, and all three publish concrete cost or out-of-pocket outcomes. Broker-channel proof is even richer: Alera, HUB, McGriff, and USI each have dedicated advisor-story pages showing mutual-client counts, new-client additions, and selected case outcomes across nonprofit healthcare, construction engineering, manufacturing, hospitality, real estate, apparel, and other employer types. Large-logo proof is broader but shallower. The May 2026 financing press release named USA Today, Paylocity, the University of Oklahoma, and Archer-Daniels-Midland, while Kleiner Perkins highlighted Kaiser, Volkswagen, and Advanced Auto Parts among the client base. Those names are useful credibility markers, but only ADM has a quoted use-case narrative in the fetched set. The right interpretation is that Garner has credible named proof across employer and broker channels, but not a fully auditable public roster showing production depth, contract status, or renewal durability for each logo.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU024, CU025, CU048, CU050]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: member-economics-and-adoption
    title: Member economics and ROI evidence are strong, but adoption is not universal
    body: >-
      Garner's public ROI story is built around three repeating metrics: lower plan spend, lower out-of-pocket spending, and unusually high usage for a navigation benefit. Official employer and advisor pages say 75% of employers lower medical trend by more than 5% in year one, around 46% of eligible members use Garner annually, and employees who engage pay about 80% less out of pocket. The Aon-backed analysis is the most formal multi-employer outcome study in the set, reporting 7.4% lower medical spend and $345 lower PMPY for Garner-eligible members from 2020 through 2024. Case studies then show how those economics play out on the ground: MarketStar avoided a projected 37% renewal increase, MEC reduced actual claims PEPM by 12% and saved $736,000, Nightingale cut net paid claims by 13%, and advisor-led cases cite double-digit claims reductions with 59% to 81% employee use and 90%+ out-of-pocket relief in some cohorts. Newer product claims point in the same direction. Garner's first-dollar HSA design claims 27% lower total costs and 28% higher engagement, while Predictive Outreach claims 3x engagement versus generic navigation. Still, a 46% annual use rate means most eligible members do not engage in a given year, so the benefit clearly improves behavior but does not eliminate activation friction.
    claimRefs: [CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU048, CU049]
    tableRefs: [TU004]
    figureRefs: []
  - id: channels-and-non-employer-customers
    title: Distribution channels extend beyond direct employers into brokers, health plans, and providers
    body: >-
      Garner is not just selling one employer-navigation SKU. The advisor record shows brokers as a major acquisition channel: Alera, HUB, McGriff, and USI all present Garner as a tool for winning renewals, opening doors, or differentiating benefit strategy, and the older C2 partnership demonstrates consortium-style distribution through multiple regional brokerages. The health-plan and provider pages extend the model further. Garner says health plans can layer the incentive model onto existing plans without refiling or custom integrations, while providers can use API, UI, and custom-insight tools through DataPro. Provider-side proof is no longer theoretical. Marathon uses Garner data inside employer-sponsored primary care and referral coordination, and Atlantic Health says it will use Garner both to steer employer members to Atlantic physicians and to inform internal quality-improvement work. DataPro materials also say the platform is available to insurance carriers, benefits programs, and value-based care participants. Geography and segment evidence are directionally supportive but incomplete: advisor stories mention seven Alera markets, eight HUB offices, multi-state McGriff and USI partnerships, and customer examples in Utah, Oregon, Illinois, Tennessee, and the western U.S., yet none of the fetched sources provide a clean state-by-state, carrier-by-carrier, or employer-size-by-employer-size breakdown.
    claimRefs: [CU036, CU037, CU038, CU039, CU040, CU041, CU049, CU050, CU051]
    tableRefs: [TU005]
    figureRefs: [FU001]
  - id: durability-concentration-and-adverse-evidence
    title: Durability and concentration remain under-disclosed, and review surfaces are mixed
    body: >-
      The biggest customer diligence risk is not whether Garner has traction; it is whether that traction is as durable and diversified as the headline numbers imply. None of the fetched official or independent sources disclosed NRR, GRR, logo churn, contract length, cohort renewal rates, broker concentration, top-customer concentration, or a verified Fortune-500 share. Public evidence therefore supports customer momentum but not retention quality in the SaaS-style sense. The public adverse record is also meaningful enough to mention. Birdeye shows a 2.2-star average across 45 reviews and highlights a recent complaint questioning Garner's provider-approval logic; JustUseApp aggregates 118 user reviews, reports a 3.6/5 app-store average, but still assigns only a 33.3/100 safety and legitimacy score; and SHRM's vendor-review page includes one glowing partner review alongside another extremely negative critique focused on compliance, quality, and data management. These surfaces are noisy and not all are high-quality diligence sources, but they do indicate skepticism around provider selection consistency, trust, and execution. Combined with the fact that public annual engagement is still only 46%, the customer case is best described as strong on acquisition and ROI proof, but only partially proven on retention, concentration, and member trust.
    claimRefs: [CU003, CU042, CU043, CU044, CU045, CU046, CU047, CU048, CU049, CU050]
    tableRefs: []
    figureRefs: [FU004]
