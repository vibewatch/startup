      - [Metal Exchange Corporation, Self-funded manufacturer, 'Overlay benefit with $1,000 incentive and no network change', Production case study, '47% sign-up, 12% claims PEPM reduction, $736K annual savings', 'Named official case only; no independent customer-side corroboration fetched']
      - [Nightingale Education Group, Fully insured employer, PPO and HDHP redesign with Garner layered on top, Production case study, '13% lower net paid claims, 61% use, 88% lower OOP when using Garner', Named official case only; no long-term renewal data]
      - [Alera Group, Broker / advisor channel, Shared-client distribution and plan redesign support, Production advisor relationship, '67 shared clients plus case showing -21.8% net paid claims and 96% lower OOP', Advisor-authored proof rather than employer-side quote]
      - [HUB, Broker / advisor channel, Shared-client distribution and new business attach, Production advisor relationship, '15 mutual clients, 35% attach, case examples with -19.1% and -26.7% net paid claims', 'Mostly broker-authored evidence; no client roster']
      - [McGriff, Broker / advisor channel, Multi-year employer cost-reduction deployments, Production advisor relationship, '27 mutual clients with multi-year claims reductions and 84% to 95% satisfaction in examples', Official advisor story rather than independent broker survey]
      - [USI, Broker / advisor channel, Regional partnerships and plan redesign with Garner incentives, Production advisor relationship, '37 shared clients and case examples with -14.5% claims and 96% lower OOP', 'Published cases still selected examples, not full portfolio']
      - [ADM, Large enterprise employer logo, Employer quote in financing release, Public logo and quote proof, VP of Total Rewards says Garner helps remove friction and connect employees to eligible high-quality providers, No quantitative employer outcome in fetched set]
      - [Atlantic Health, Health system / provider partner, Use Garner to steer employer members and support internal quality work, Announced live partnership, Expands proof into provider-side quality and referral workflows, No publicly reported utilization or savings yet]
      - [Marathon Health, Primary care and referral partner, Care navigators use Garner DataPro for specialist referrals, Production partner workflow, '75% of members choose the recommended referral option with navigator support', Partner proof rather than direct employer renewal proof]
    notes: Enumeration is partial because Garner publishes selected stories, not a full roster of employers, brokers, health plans, or provider partners.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU024, CU025, CU037, CU038]
  - id: TU004
    title: ROI / repeat usage / satisfaction table
    columns: [Metric, Public value, Segment, Confidence, Diligence ask]
    rows:
      - [Medical-spend reduction in formal study, '7.4% lower medical spend and $345 lower PMPY', Multi-employer Aon study, High, Request sample size employer count and renewal persistence]
      - [Employer savings marker, '75% of employers lower trend by >5% in year one', Broad employer base, Medium, Request cohort size and definition of lower trend]
      - [Average total-spend reduction, '12% lower total healthcare spend in first year', Broad employer base, Medium, Request denominator and audited methodology]
      - [Average member out-of-pocket savings, '80% lower out-of-pocket when members use Garner', Member economics, Medium, Request episode mix and variance by specialty]
      - [Annual eligible-member usage, '46% use Garner annually', Broad member base, Medium, Request repeat-usage and activation by tenure]
      - [First-Dollar HSA economics, '27% lower total costs; 28% higher engagement; top-provider use rose from 23% to 43%', HSA design adopters, Medium, Request customer count and audited before-after cohorts]
      - [Predictive Outreach response, '76% said Garner correctly identified needs; 3x engagement versus generic tools', Higher-risk members, Medium, Request contact volume conversion to completed care]
      - [Marathon referral conversion and satisfaction, '75% choose recommended referral; referral NPS in high 90s', Referral-supported members, Medium, Request current scale outside Indianapolis example set]
      - [Public NRR / GRR / churn, null, All customers, High, Request logo retention gross retention and cohort renewals by segment]
      - [Public contract length / concentration, null, Employers and channels, High, Request average contract term and top-broker or top-customer exposure]
    notes: Null means no public disclosure found in fetched official, partner, news, or review surfaces for this chapter; row values mix enterprise-wide markers with program-specific examples.
    claimRefs: [CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU043]
  - id: TU005
    title: Channel / distribution and concentration map table
    columns: [Channel / expansion driver, Evidence, Impact, Concentration / friction risk, Diligence path]
    rows:
      - [Direct employer sales, Official employer page plus named employer stories, Core revenue engine with visible ROI proof, Exact top-customer concentration is not public, Request customer-count and ARR mix by employer size]
      - [Advisor / broker channel, Alera HUB McGriff USI and C2 partner stories, Multiplies distribution and helps win renewals, Broker concentration could become hidden customer-acquisition concentration, Request top broker share of new bookings and renewals]
      - [Health plans / TPAs, Dedicated health-plan page and payer-oriented positioning, Opens co-branded or embedded distribution inside existing plans, No named payer roster or implementation depth, Request named health-plan and TPA clients plus go-live count]
      - [Health systems / providers, Atlantic and Marathon partnerships plus provider page, Extends Garner from benefits buyer to referral and quality-improvement workflows, Early-stage partner set may still be concentrated, Request active users and revenue contribution from provider segment]
      - [Primary-care and referral workflows, Marathon primary-care partnership and DataPro materials, Creates expansion path after employer sale and raises clinical-stickiness, Needs care-navigator adoption and workflow integration to sustain usage, Request referral-volume and repeat-use cohorts]
      - [Value-based care / carrier analytics, DataPro says available to carriers and VBC participants, Broadens product fit beyond navigation benefit, Public proof is mostly positioning not customer count, Request named VBC participants and case-study outcomes]
    notes: This table combines distribution mechanics with concentration risk because Garner's public gaps are greatest around which channels drive bookings and renewals.
    claimRefs: [CU008, CU018, CU020, CU036, CU037, CU038, CU039, CU042, CU049, CU050, CU051]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Garner's public journey starts with employer or broker discovery, turns into member use, and can expand into payer or provider referral workflows.
    data:
      items:
        - { label: 'Broker or employer identifies renewal pressure', stage: acquisition, note: 'Alera HUB McGriff USI and direct employer pages frame Garner as a renewal and affordability solution' }
        - { label: 'Garner layers onto existing plan and network', stage: activation, note: 'No carrier replacement or plan refiling is required in employer and health-plan materials' }
        - { label: 'Members search for Top Providers and receive incentives', stage: usage, note: '46% annual usage marker and 80% lower OOP claim anchor the member value proposition' }
        - { label: 'Employer receives ROI and renewal outcomes', stage: value, note: 'Aon and case studies frame claims reductions and renewal relief as the buyer payoff' }
        - { label: 'Advisor channel adds more mutual clients', stage: expansion, note: 'Alera HUB McGriff and USI all report growing shared-client counts' }
        - { label: 'Provider and health-system workflows adopt DataPro', stage: expansion, note: 'Marathon Atlantic and provider pages show referral and quality-improvement use cases' }
    approximationNotes: Public evidence supports the stages and expansion loops, but not stage-by-stage conversion rates.
    claimRefs: [CU005, CU008, CU018, CU026, CU028, CU036, CU037, CU038, CU050]
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: Public customer proof narrows from broad covered lives and customer counts to annual engagement and then to the even smaller subset with disclosed retention visibility.
    data:
      items:
        - { stage: 'Public customer / partner marker', value: 800, label: 'Almost 800 customers / partners in May 2026' }
        - { stage: 'Covered members / people', value: 2500000, label: '>2.5M people reached' }
        - { stage: 'Annual eligible-member use', value: 46, label: '46% of eligible members use Garner annually' }
        - { stage: 'High-use named examples', value: 61, label: '61% usage in MarketStar and Nightingale examples' }
        - { stage: 'Public retention cohorts disclosed', value: 0, label: 'No public NRR / GRR / churn cohorts' }
    approximationNotes: This funnel mixes absolute counts and percentages to show visibility layers rather than a true customer conversion model; the final zero means no public retention cohort disclosure, not literal zero retention.
    claimRefs: [CU001, CU002, CU010, CU015, CU026, CU043]
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Garner has strong named case-study and advisor proof, moderate logo and partner proof, and weak public durability visibility.
    data:
      columns: [Evidence quality, Outcome specificity, Durability visibility]
      rows:
        - label: Named employer case studies
          values: [High, High, Low]
        - label: Advisor / broker stories
          values: [Medium-high, High, Low]
        - label: Health-system and referral partnerships
          values: [Medium, Medium, Low]
        - label: Large-logo mentions in financing and investor materials
          values: [Medium, Low, Low]
        - label: Review and marketplace surfaces
          values: [Low-medium, Low, Low]
        - label: Retention disclosure
          values: [Low, Low, Very low]
    approximationNotes: Evidence-quality labels are qualitative judgments based on whether the fetched source names a customer, quantifies outcomes, and discloses repeat behavior or renewals.
    claimRefs: [CU022, CU023, CU024, CU025, CU037, CU038, CU043, CU044, CU045, CU046, CU048]
  - id: FU004
    title: Retention / repeat cohort visibility proxy
    type: cohort
    layout: standard
    summary: Public sources show cohort formation and a few renewal anecdotes, but not true retention percentages.
    data:
      columns: [Implementation, Year 1, Year 2]
      rows:
        - label: Public logo-retention disclosure
          values: [100, 0, 0]
        - label: Public revenue-retention disclosure
          values: [100, 0, 0]
        - label: Public member repeat-usage disclosure
          values: [100, 0, 0]
        - label: Public adverse churn or trust signals
          values: [0, 1, 0]
    approximationNotes: The cohort is a visibility proxy rather than a real renewal chart; 100 means the cohort exists conceptually, 0 means no public retention percentage was disclosed, and the single adverse signal is a review-surface anecdote rather than a rate.
    claimRefs: [CU043, CU044, CU045, CU046, CU048]
callouts:
  - calloutType: strength
    title: Garner has unusually rich broker-channel proof for a private navigation company
    body: Alera, HUB, McGriff, and USI each publish mutual-client counts plus outcome-heavy case examples, making advisor-led distribution one of the clearest customer-proof surfaces in the chapter.
    claimRefs: [CU016, CU018, CU020, CU022, CU036]
  - calloutType: insight
    title: Customer proof now extends into provider-side workflows
    body: Atlantic Health, Marathon, and DataPro materials show Garner evolving from an employer benefit into a referral and quality-improvement data layer for health systems, providers, and value-based care participants.
    claimRefs: [CU037, CU038, CU039, CU050, CU051]
  - calloutType: risk
    title: Traction is real, but durability and trust are still only partially proven
    body: Public evidence supports acquisition and ROI, yet there is still no disclosed NRR, GRR, concentration, or renewal data, and review surfaces include meaningful skepticism about provider-approval consistency and execution quality.
    claimRefs: [CU043, CU044, CU045, CU046, CU049]
