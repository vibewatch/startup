  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: Public NRR, GRR, logo-retention, contract-length, and cohort-renewal data by customer segment.
      whyItMatters: Without renewal or cohort data, the chapter can prove acquisition and selected ROI examples but not recurring-revenue durability.
      diligencePath: Request customer-retention cohorts, gross and net retention, average contract length, and logo churn by employer, advisor-sold, and provider-partner segments.
      relatedQuestionRefs: [QU020, QU025]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Top-customer share, top-broker share, and exact split of employers versus partners versus health plans in the near-800 total.
      whyItMatters: Distribution concentration can make a large customer count look diversified when bookings or renewals are actually dependent on a few channels.
      diligencePath: Request customer-count, ARR, and renewal concentration by top employer, broker, payer, and provider partner.
      relatedQuestionRefs: [QU021, QU022]
      relatedTableRefs: [TU005]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: A fuller public roster of named employers, payers, providers, and partners with production status and deployment dates.
      whyItMatters: The chapter has enough named proof to establish traction, but not enough to infer total segment mix or retention quality from logos alone.
      diligencePath: Request a customer roster or larger reference sheet with segment, go-live year, case-study permission status, and renewal status.
      relatedQuestionRefs: [QU008, QU009, QU010]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: payer-mix
      missingEvidence: Named health-plan or TPA customers, implementation counts, and payer-specific outcome data.
      whyItMatters: Official pages say Garner sells to health plans, but the revenue importance and production depth of that segment are still unclear.
      diligencePath: Request named payer references, number of live plan clients, covered lives, and underwriting or renewal outcomes for payer deployments.
      relatedQuestionRefs: [QU006, QU021]
      relatedTableRefs: [TU001, TU005]
    - type: missing-source
      severity: minor
      topic: size-and-vertical-mix
      missingEvidence: Exact enterprise, mid-market, and small-group mix plus vertical breakdown across healthcare, manufacturing, education, and other industries.
      whyItMatters: Public case studies show diversity, but not enough to underwrite where the company is actually strongest or most concentrated.
      diligencePath: Request customer counts and ARR by employer size band, funding type, geography, and industry vertical.
      relatedQuestionRefs: [QU017, QU018, QU019]
      relatedTableRefs: [TU001]
    - type: conflicting-data
      severity: minor
      topic: lives-serviced
      missingEvidence: Reconciliation between Shortlister's 500,000-lives marketplace metadata and 2.5 million-member 2026 company-scale claims.
      whyItMatters: Inconsistent public metadata can confuse diligence on current scale and segment fit if directories lag company disclosures.
      diligencePath: Treat marketplace listings as non-canonical until Garner or an independent outlet confirms the relevant date and denominator.
      relatedQuestionRefs: [QU001, QU019]
