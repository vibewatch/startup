  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: Named proofs come only from fetched public case studies, advisor stories, partner announcements, and high-visibility logo mentions; Garner does not publish a complete customer roster.
    columns: [Customer / proof surface, Segment, Deployment / use case, Production vs pilot, Outcome, Limitation]
    rows:
