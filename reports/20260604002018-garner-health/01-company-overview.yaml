- id: risks-and-open-questions
  title: Adverse signals, inconsistencies, and open diligence items
  body: 'The most important overview risks are not existential red flags, but they are material enough to preserve now so later chapters do not overstate certainty. First, adverse user feedback exists: the fetched Birdeye page showed a low aggregate rating and a recent complaint that Garner''s approved-provider logic can feel inconsistent, while Forbes separately noted online complaints that the network may feel too restrictive. Second, some company metrics need scope discipline. Garner''s published metric counts vary across sources, customer totals move quickly by date, and the best public headcount evidence is stale. Third, governance and capital reconciliation remain incomplete. The chapter can support that Garner is large, well funded, and strategically validated, but it cannot yet support a precise board map, a fresh workforce number, or a fully reconciled cumulative capital figure that cleanly separates primary funding from tender activity.'
