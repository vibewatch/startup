- id: milestones-and-expansion
  title: Milestones, product expansion, and scale-up
  body: 'The milestone record shows Garner evolving from a network-overlay benefit into a broader data and AI platform. By late 2021 the company was already pitching national expansion and reporting 100 employer customers. From 2023 onward, the official newsroom adds evidence of trust and product maturity: a SOC 2 Type II certification, growing partnership depth with Marathon Health, and the public launch of DataPro after an extended client pilot. By 2026 the AI narrative becomes central, with Garner Assistant presented as the member interface and Research Agent positioned as the internal engine that keeps clinical rankings current. Commercial scale also tightened quickly. Public reporting moved from more than 700 organizations in February 2026 to almost 800 employers and partners by May 2026, while official materials anchored revenue around $200 million and member reach above 2.5 million people.'
  claimRefs:
  - CO005
  - CO013
  - CO014
  - CO015
  - CO016
