company:
  name: Garner Health
chapter:
  number: 1
  title: Company Overview
  summary: Garner Health is a New York-based, founder-led healthcare navigation and provider-analytics company that reached a $2.74B Series E valuation by May 2026. The strongest evidence points to a dual-surface model—employer benefits plus provider referral analytics—built on a large claims dataset and incentive design, with scale above 2.5M people but still-open diligence gaps around governance, exact headcount, and fully reconciled cumulative capital.
sections:
- id: identity-and-model
  title: Identity, product scope, and economic model
  body: Garner Health presents itself as a healthcare quality and navigation platform that tries to change patient behavior with both better information and better incentives. The official product stack has two visible surfaces. First, Garner sells an employer-sponsored benefit that layers onto existing health plans, steers members to Top Providers, and reimburses most or all out-of-pocket costs when members use those providers. Second, Garner has expanded into provider-facing workflows through Garner DataPro, which packages referral and performance analytics for care-delivery organizations and other healthcare intermediaries. As of the canonical run date, the company should be treated as a late-stage private Series E business founded in 2019, with New York as the best-supported operating base but not yet an officially foregrounded headquarters detail in the fetched official pages. Its core economic claim is that better physician selection lowers both medical spend and patient friction.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO006
  - CO038
  - CO039
  tableRefs:
  - TO001
  figureRefs:
  - FO002
  - FO003
- id: leadership-and-dependencies
  title: Leadership bench and key-person dependency
  body: 'The cleanest leadership fact in the fetched evidence is that Garner is publicly founder-led. Nick Reber is the founder and CEO on the official about page, he is the quoted voice in financing and partnership announcements, and outside profiles still frame the company through his personal experience with misdiagnosis and his earlier work at Bridgewater and Oscar Health. The broader disclosed executive bench covers product and data, revenue, finance, and provider partnerships, which suggests functional coverage is in place for a business selling to employers and health systems. Even so, governance disclosure remains thin: the fetched materials do not provide a current board roster, board committee structure, or investor-control map. That means the chapter can support a founder-centric operating picture, but not a full governance assessment.'
  claimRefs:
  - CO018
  - CO019
  - CO020
  tableRefs:
  - TO002
- id: capital-and-stakeholders
  title: Capital formation and strategic stakeholders
  body: Garner's financing arc is now clear enough to show a major step-up in scale even if cumulative capital is still only partially reconciled. Third-party 2026 recaps point to seed and Series A financing before a $45 million Series B in 2021, then a $118 million Series D at a $1.35 billion valuation in February 2026, followed only months later by a $100 million Series E at a $2.74 billion valuation. The investor base is notable because it mixes classic software venture firms with healthcare strategics. Optum Ventures entered in 2021, Kaiser Permanente Ventures appears across later rounds and on its portfolio page, and Mercy shows up both as an investor and provider-side user. That combination suggests Garner is no longer just a benefits startup pitch; it is increasingly being underwritten as infrastructure connecting employers, providers, and performance data.
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
  - CO029
  - CO041
  - CO042
