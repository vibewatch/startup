      - CV014
      - CV015
      - CV048
      - CV049
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Public evidence supports a wide valuation distribution because multiple selection matters almost as much as
      revenue growth.
    data:
      items:
        - label: Bear case
          low: 1
          mid: 1.2
          high: 1.4
          displayValue: $1.0B-$1.4B
          detail: Revenue reaches about $240M and trades at 4x-6x.
          tone: negative
        - label: Base case
          low: 2.4
          mid: 2.7
          high: 3
          displayValue: $2.4B-$3.0B
          detail: Revenue reaches about $320M and trades at 7.5x-9.5x.
          tone: warning
        - label: Bull case
          low: 4.6
          mid: 5
          high: 5.5
          displayValue: $4.6B-$5.5B
          detail: Revenue reaches about $420M and still commands an 11x-13x premium.
          tone: positive
    approximationNotes: >-
      Ranges are scenario-based valuation outputs for investment discussion; they do not incorporate unknown preference
      economics.
    claimRefs:
      - CV047
      - CV048
      - CV049
      - CV050
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Garner scores well on market pull and traction, but much lower on disclosure quality and present valuation
      support.
    data:
      items:
        - label: Market need
          score: 9
          detail: Employer healthcare cost pain and provider-quality opacity remain large and persistent.
          tone: positive
        - label: Traction / adoption
          score: 8
          detail: Nearly 800 organizations and >2.5M covered people are real scale markers.
          tone: positive
        - label: Growth quality
          score: 8
          detail: '>130% growth at Series D and ~200M gross ARR by Series E are unusually strong.'
          tone: positive
        - label: Penetration runway
          score: 8
          detail: ~2.4% broad self-funded penetration leaves meaningful expansion headroom.
          tone: positive
        - label: Economics visibility
          score: 4
          detail: Public evidence does not yet bridge gross ARR to audited net revenue or margins.
          tone: warning
        - label: Valuation support
          score: 4
          detail: The current multiple is above all fetched public and transaction comps.
          tone: warning
        - label: Evidence quality
          score: 5
          detail: Enough to track aggressively, not enough to underwrite casually.
          tone: neutral
    approximationNotes: >-
      Scores are 0-10 ordinal judgments synthesized from the fetched public evidence for investment-committee
      discussion.
    claimRefs:
      - CV013
      - CV015
      - CV041
      - CV042
      - CV044
      - CV052
      - CV053
