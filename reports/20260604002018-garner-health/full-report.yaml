        title: Capital formation and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              Garner's financing arc is now clear enough to show a major step-up in scale even if cumulative capital is
              still only partially reconciled. Third-party 2026 recaps point to seed and Series A financing before a $45
              million Series B in 2021, then a $118 million Series D at a $1.35 billion valuation in February 2026,
              followed only months later by a $100 million Series E at a $2.74 billion valuation. The investor base is
              notable because it mixes classic software venture firms with healthcare strategics. Optum Ventures entered
              in 2021, Kaiser Permanente Ventures appears across later rounds and on its portfolio page, and Mercy shows
              up both as an investor and provider-side user. That combination suggests Garner is no longer just a
              benefits startup pitch; it is increasingly being underwritten as infrastructure connecting employers,
              providers, and performance data.
