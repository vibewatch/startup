  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Ranked risk view: structural trust and governance outrank disclosed litigation today'
        blocks:
          - type: paragraph
            body: >-
              Garner does not appear to have a major public lawsuit, OCR action, FTC case, or breach notice already
              hanging over it in the fetched archive set, so the risk story is not about an already-known legal blowup.
              The more material issue is structural. Garner asks employers and members to trust a recommendation engine
              that uses claims data, transparency files, provider records, review signals, scheduling logic, and
              reimbursement administration in one workflow. If any layer is wrong or hard to explain, the problem does
              not stay local. It can turn into member confusion, weaker steerage, more buyer skepticism at renewal, and
              lower channel leverage against broader navigation platforms. That is why privacy and vendor governance,
              methodology explainability, directory accuracy, and commercial durability rank ahead of pure litigation
              risk in this chapter. The public record is directionally strong on product ambition and market demand, but
              still thin on auditability, concentration, and renewal quality. That combination makes Garner investable
              only if diligence proves the control stack is stronger than the public disclosure pack shows today.
