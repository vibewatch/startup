      - number: '6.3'
        title: Member economics and ROI evidence are strong, but adoption is not universal
        blocks:
          - type: paragraph
            body: >-
              Garner's public ROI story is built around three repeating metrics: lower plan spend, lower out-of-pocket
              spending, and unusually high usage for a navigation benefit. Official employer and advisor pages say 75%
              of employers lower medical trend by more than 5% in year one, around 46% of eligible members use Garner
              annually, and employees who engage pay about 80% less out of pocket. The Aon-backed analysis is the most
              formal multi-employer outcome study in the set, reporting 7.4% lower medical spend and $345 lower PMPY for
              Garner-eligible members from 2020 through 2024. Case studies then show how those economics play out on the
              ground: MarketStar avoided a projected 37% renewal increase, MEC reduced actual claims PEPM by 12% and
              saved $736,000, Nightingale cut net paid claims by 13%, and advisor-led cases cite double-digit claims
              reductions with 59% to 81% employee use and 90%+ out-of-pocket relief in some cohorts. Newer product
              claims point in the same direction. Garner's first-dollar HSA design claims 27% lower total costs and 28%
              higher engagement, while Predictive Outreach claims 3x engagement versus generic navigation. Still, a 46%
              annual use rate means most eligible members do not engage in a given year, so the benefit clearly improves
              behavior but does not eliminate activation friction.
