              Garner looks important, but the current price already discounts a strong execution path and cleaner future
              disclosure.
            calloutType: recommendation
            claimRefs:
              - CV015
              - CV052
              - CV053
          - type: callout
            title: The premium case is built on real growth, not story stock rhetoric
            body: >-
              The company disclosed roughly $200M of gross ARR after five years of doubling and still has low
              broad-market penetration.
            calloutType: strength
            claimRefs:
              - CV003
              - CV013
              - CV041
          - type: callout
            title: The biggest valuation risk is disclosure quality, not lack of customer demand
            body: >-
              The Series E press release disclosed gross ARR and a second tender offer, but not audited net revenue or
              cap-table economics.
            calloutType: risk
            claimRefs:
              - CV004
              - CV044
              - CV045
          - type: callout
            title: Base case assumes Garner grows into, rather than immediately exceeds, the current mark
            body: >-
              The public evidence supports roughly current-value validation in the base case and much better returns
              only in the bull case.
            calloutType: assumption
            claimRefs:
              - CV048
              - CV050
