      - number: '6.5'
        title: Durability and concentration remain under-disclosed, and review surfaces are mixed
        blocks:
          - type: paragraph
            body: >-
              The biggest customer diligence risk is not whether Garner has traction; it is whether that traction is as
              durable and diversified as the headline numbers imply. None of the fetched official or independent sources
              disclosed NRR, GRR, logo churn, contract length, cohort renewal rates, broker concentration, top-customer
              concentration, or a verified Fortune-500 share. Public evidence therefore supports customer momentum but
              not retention quality in the SaaS-style sense. The public adverse record is also meaningful enough to
              mention. Birdeye shows a 2.2-star average across 45 reviews and highlights a recent complaint questioning
              Garner's provider-approval logic; JustUseApp aggregates 118 user reviews, reports a 3.6/5 app-store
              average, but still assigns only a 33.3/100 safety and legitimacy score; and SHRM's vendor-review page
              includes one glowing partner review alongside another extremely negative critique focused on compliance,
              quality, and data management. These surfaces are noisy and not all are high-quality diligence sources, but
              they do indicate skepticism around provider selection consistency, trust, and execution. Combined with the
              fact that public annual engagement is still only 46%, the customer case is best described as strong on
              acquisition and ROI proof, but only partially proven on retention, concentration, and member trust.
