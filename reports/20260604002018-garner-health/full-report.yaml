      - number: '4.5'
        title: Adverse evidence and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence in this chapter is not that Garner lacks demand; it is that the public proof set is
              still too selective for a clean late-stage private-company underwrite. Birdeye complaints and Forbes
              reporting both show that some members view the provider logic as restrictive or inconsistent, which
              matters because the revenue model depends on behavior change and trust. More importantly, public
              comparables warn against assuming that revenue scale alone guarantees margin durability. Accolade’s sale
              at roughly 1.5x trailing revenue after losing about $100 million on $414 million of revenue is a reminder
              that navigation businesses can be strategically relevant and still financially disappointing as standalone
              public equities. Garner’s own May 2026 round implies about 13.7x ARR, far richer than that downside comp.
              That premium may be justified if DataPro expands mix and automation drives software-like margins, but the
              public evidence does not yet prove either point. The clean takeaway is therefore balanced: recurring
              demand looks real, but profitability quality and cash durability remain unverified.
