  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Factor
      - Type
      - Timing
      - Evidence
      - Market implication
      - Diligence ask
    rows:
      - - Employer medical inflation remains high
        - Driver
        - Now through 2026
        - Mercer, BGH, PwC, Milliman, McKinsey all show high-single-digit pressure
        - Creates urgency for savings-oriented navigation and steerage
        - Test whether Garner savings persist after first-year implementation
      - - Employee cost burden is already material
        - Driver
        - Current
        - KFF shows premium contributions and $1,886 average deductible; McKinsey says cost sharing has saturated
        - Supports solutions that lower spend without more cost shifting
        - Measure whether Garner reduces realized employee friction, not just claims cost
      - - Self-funded employer exposure
        - Driver
        - Structural
        - KFF says 67% of covered workers are self-funded
        - Direct claims-risk ownership makes ROI legible to buyers
        - Segment Garner customers by self-funded versus fully insured channel mix
      - - Provider-quality transparency demand
        - Driver
        - Current
        - 'BGH: 82% cite higher-quality-provider navigation and 82% cite quality transparency'
        - Supports provider-ranking and referral-analytics products
        - Validate whether quality data alone changes referral behavior without incentives
      - - AI-enabled navigation and analytics
        - Driver
        - Current / near-term
        - Garner, Quantum, Aon, PwC all frame AI as augmenting navigation or analytics
        - Can improve scale, update speed, and personalization
        - Separate real workflow gains from AI marketing claims
      - - Value-based care adjacency
        - Driver
        - Current / medium-term
        - Garner DataPro sells to VBC participants; BGH highlights integrated care teams
        - Expands buyer set beyond pure employer benefits
        - Quantify provider-side revenue contribution relative to employer benefits
      - - Vendor consolidation / point-solution fatigue
        - Constraint
        - Current
        - Aon and BGH say employers are eliminating vendors and scrutinizing performance
        - Harder to win as a standalone point solution without integration
        - Assess whether Garner lands directly, through carriers, or via bundle strategies
      - - Integration and change-management friction
        - Constraint
        - Current
        - Quantum and Rightway emphasize minimal disruption and TPA / benefits-team integration
        - Category adoption depends on fitting existing plan operations
        - Map typical implementation timeline, claims feeds, and member-launch effort
      - - Trust and clinician-replacement limits
        - Constraint
        - Current
        - PwC says people accept digital navigation/admin help but not clinician replacement
        - AI alone is not a sufficient buying story
        - Check how much human support Garner maintains per covered life
      - - Restrictive-network perception
        - Constraint
        - Current
        - KFF steering and narrow-network evidence shows tradeoff between savings and choice
        - Members may resist or misunderstand steerage if recommendations feel opaque
        - Test complaint rates, adoption by unionized or choice-sensitive populations, and communication burden
    notes: >-
      Drivers and constraints are intentionally mixed because market growth is real, but adoption depends on trust,
      integration, and proof. The category is not supply-constrained; it is execution-constrained.
