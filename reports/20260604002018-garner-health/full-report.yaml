      - number: '3.2'
        title: Incumbents, legacy vendors, and adjacent substitutes widen the field
        blocks:
          - type: paragraph
            body: >-
              The harder competitive problem for Garner is that buyers can solve similar pain from multiple directions.
              Evernorth turns benefits navigation into a carrier-linked orchestration layer that works across multiple
              plans and more than 100 vendor or plan partners. Apree shows how legacy navigation has already migrated
              toward bundled navigation plus care delivery, while Castlight still markets navigation as a data-rich app
              rather than a standalone category. At the same time, employers can allocate budget to condition-specific
              alternatives with clearer ROI stories. Hinge sells musculoskeletal access and claims reduction, Spring
              sells measurement-based mental-health matching and therapy, and Sword now markets AI-led care across MSK,
              women’s health, mental health, and cardiometabolic needs. Those vendors do not replace Garner’s
              provider-steerage thesis one-for-one, but they do compete for the same benefits dollars and member
              attention. That makes the relevant landscape larger than direct navigation peers alone.
