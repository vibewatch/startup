  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization mechanics
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial evidence says Garner monetizes through an employer-paid overlay rather than
              through insurance risk, provider commissions, or consumer subscriptions. Official FAQ and employer pages
              consistently describe a benefit layered on top of an existing carrier network, funded by employers, and
              reinforced with employer-funded HRA or incentive accounts that reimburse out-of-pocket costs when members
              use Garner-designated providers. Forbes adds the clearest open-web contract signal: employers pay a
              monthly per-employee fee. That matters because it makes the recurring revenue model legible even though
              list PEPM pricing is not disclosed. The same source set also supports a second revenue surface. Garner’s
              2021 Series B announcement already referenced a provider-referral product line, and the later DataPro
              launch shows the quality engine being packaged for provider organizations, carriers, and value-based-care
              participants. The open question is not whether Garner has recurring revenue; it is how much of reported
              revenue is high-margin software versus reimbursement-linked economics and service administration.
