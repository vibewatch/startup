      - number: '3.4'
        title: Switching costs exist, but they do not create absolute lock-in
        blocks:
          - type: paragraph
            body: >-
              The public evidence points to moderate switching costs rather than hard lock-in. Most vendors layer on top
              of existing plans, so employers are usually not ripping out core insurance to adopt or replace navigation.
              That lowers the absolute barrier to movement. But implementation still matters because data feeds, vendor
              connections, member communications, support staffing, and pharmacy or rewards workflows all have to be
              reconfigured. Competitors market themselves as making these handoffs easy, which is itself a clue that
              buyers worry about transition friction. Multi-homing is also structurally common: employers can keep a
              carrier, add navigation, retain point solutions, and pair in a PBM or specialty program. For Garner, that
              means moat durability cannot rely on being the only surface in the stack. The more durable moat claims are
              provider-quality measurement, referral logic, reimbursement economics, and employer trust that the
              steerage is actually improving care. If broader platforms or carriers can replicate those capabilities and
              bundle them into wider ecosystems, Garner’s focused wedge narrows quickly.
