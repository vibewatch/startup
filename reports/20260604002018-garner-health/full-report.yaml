      - number: '8.2'
        title: 'Round history and penetration lens: the repricing was fast, while market penetration is still early'
        blocks:
          - type: paragraph
            body: >-
              The simplest way to read Garner is as an early-penetration business that has been repriced like a
              later-certainty asset. The February 2026 Series D valued the company at $1.35 billion, and the May 2026
              Series E pushed that to $2.74 billion, a roughly 103% step-up in about one quarter. Yet the same public
              evidence says Garner still covers only about 2.5 million people. That sounds large until it is placed
              against the broad self-funded employer opportunity. KFF’s 2025 employer survey supports a rough 103
              million-life self-funded lens, which means Garner has reached only about 2.4% of that broad pool. In other
              words, the runway argument is real. But so is the underwriting discipline problem: the company is being
              valued on gross ARR, on a still-small share of the addressable employer base, and with no public bridge
              from gross ARR to audited net revenue. The current price therefore embeds continued penetration expansion
              rather than merely monetizing today’s footprint.
