        title: Traction, contract quality, and go-to-market proxies
        blocks:
          - type: paragraph
            body: >-
              Garner’s open-web traction looks strong for a private navigation company, but the most useful underwriting
              signals are a mix of revenue, customer count, implementation friction, and channel leverage rather than
              any single SaaS metric. By February 2026, independent coverage placed Garner at about 700 organizations
              and 2.5 million covered members, and by May 2026 the company said it was approaching 800 organizations
              with gross ARR around $200 million. Those are meaningful scale markers, especially because the product is
              designed to sit on top of an existing plan instead of requiring a disruptive carrier switch. Garner’s FAQ
              says implementation typically takes 60 to 90 days, which implies faster deployment than replacing network
              or plan infrastructure. Broker evidence also matters. The HUB case study suggests partner economics can
              support growth, with 15 mutual clients, 11 new clients added in 2024, and a 35% attach rate after clients
              learn about the product. The caveat is that public sources still disclose savings and engagement far more
              readily than realized price, retention, or CAC payback.
