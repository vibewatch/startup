            body: >-
              The milestone record shows Garner evolving from a network-overlay benefit into a broader data and AI
              platform. By late 2021 the company was already pitching national expansion and reporting 100 employer
              customers. From 2023 onward, the official newsroom adds evidence of trust and product maturity: a SOC 2
