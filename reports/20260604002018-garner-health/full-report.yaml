          detail: USD millions required to support $2.74B at a strong public-comp multiple.
          tone: warning
        - label: Revenue needed at 10x
          value: 274
          detail: USD millions required to support $2.74B at a premium public-comp multiple.
          tone: warning
        - label: Current disclosed gross ARR
          value: 200
          detail: Approximate May 2026 gross ARR from the Series E press release.
          tone: positive
    approximationNotes: Thresholds are simple valuation-to-revenue bridges using the current round mark; they are not DCF outputs.
