      - number: '2.5'
        title: Constraints, trust limits, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The category also carries real adoption friction. Employers are not shopping in a vacuum; they are
              simultaneously consolidating vendors, demanding ROI proof, and trying not to create yet another
              disconnected member experience. Aon and Business Group on Health both highlight vendor evaluation and
              consolidation pressure, which means navigation vendors must prove integration and measurable outcomes
              before they scale across an employer base. Member perception is another constraint. KFF's discussion of
              tiered and narrow networks shows that steerage can work economically, but it can also feel restrictive if
              members perceive reduced choice or opaque recommendations. PwC adds a trust boundary around AI: people are
              comfortable with digital tools handling navigation and administrative coordination, but not replacing
              clinicians. Finally, the main analytical gap is TAM precision. Public evidence strongly supports enormous
              upstream healthcare spending and a large self-funded opportunity, but it does not produce a clean,
              independent dollar market size for navigation and provider-quality-analytics vendors. For Garner, the key
              investment question is therefore less about whether money exists in the system and more about whether the
              company can convert cost pressure into trusted, low-friction adoption.
            claimRefs:
              - CM006
              - CM007
              - CM029
              - CM041
              - CM044
              - CM045
              - CM046
              - CM049
              - CM050
              - CM052
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Practical TAM is self-funded employer lives, not a standalone software line item
            body: >-
              The strongest market-sizing conclusion is that Garner should be underwritten against the
              employer-sponsored financing pool and, more specifically, the self-funded employer segment where claims
              savings matter immediately. Public sources support a broad ~103 million-life self-funded lens and a >2.5
              million-life current Garner footprint, but they do not support a clean third-party dollar TAM for
              navigation vendors.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM046
              - CM047
              - CM048
          - type: callout
            title: 2026 cost pressure keeps buyer urgency elevated
            body: >-
              Cost-trend estimates from Mercer, Business Group on Health, PwC, Milliman, Aon, and McKinsey cluster in a
              high single-digit range for the near term. That means employers are actively looking for new plan designs,
              steerage tools, and measurable savings rather than assuming incremental premium increases are acceptable.
            calloutType: strength
            claimRefs:
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
          - type: callout
            title: Integration, trust, and restrictive-network perception can slow rollout
            body: >-
              This category wins only when members trust the recommendations and employers can deploy the product
              without creating extra friction. Vendor consolidation, ROI scrutiny, AI trust limits, and the perception
              that steerage restricts choice can all delay adoption even when the economic case is strong.
            calloutType: risk
