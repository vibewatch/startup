      - number: '2.2'
        title: Sizing lenses and relevant spending pools
        blocks:
          - type: paragraph
            body: >-
              The market is unquestionably large, but public evidence does not support one clean standalone navigation
              TAM. The strongest top-down lens is employer-sponsored coverage itself: KFF says 154 million non-elderly
              people are covered, average 2025 premiums are $9,325 single and $26,993 family, and 67% of covered workers
              are already in self-funded plans where employers directly bear claims-risk. Mercer adds a plan-sponsor
              cost lens: employer-sponsored coverage reached $17,496 per employee in 2025 and could move above $18,500
              in 2026 even after mitigation. CMS and Peterson-KFF Health System Tracker provide a broader payer
              backdrop, projecting $5.6 trillion of national health spending in 2025 and continued private-insurance
              growth, even if that growth moderates in 2026. Those are the spending pools Garner and peers seek to
              influence. A practical serviceable-market lens is therefore self-funded employer lives, not a standalone
              software category. Applying KFF's self-funded share to the employer-sponsored covered population suggests
              a broad, approximate 103 million-life self-funded opportunity. Against that backdrop, Garner's reported
              coverage of more than 2.5 million people implies low-single-digit penetration. The conclusion is not that
              the end market is small; it is that TAM precision is weaker than demand-side pressure.
            claimRefs:
