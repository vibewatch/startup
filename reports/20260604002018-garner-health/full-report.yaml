companyProfile:
  summary: >-
    Garner Health is a New York-based, founder-led healthcare navigation company founded in 2019 by Nick Reber. Public
    evidence describes a dual-surface business: an employer-sponsored overlay benefit that steers members to
    high-performing in-network physicians and reimburses qualifying out-of-pocket costs, plus Garner DataPro for
    provider, carrier, and value-based-care referral analytics. By May 2026, Garner said it had almost 800 customers or
    partners, served more than 2.5 million people, and reached approximately $200 million of gross ARR, while raising a
    $100 million Series E at a $2.74 billion valuation. The company looks meaningfully scaled and strategically
    validated, but it remains a private business with thin public disclosure on audited financials, revenue quality, and
    capital structure.
  foundedDate: '2019-01-01'
  founders:
    - name: Nick Reber
      role: Founder & CEO
      background: >-
        Founder-market fit is tied to his personal experience with multiple back surgeries and prior work at Bridgewater
        Associates and Oscar Health.
      claimRefs:
        - CO018
        - CO019
  foundingLocation: New York, New York, United States
  headquarters: New York, New York, United States
  productSummary: >-
    Garner sells an overlay healthcare-navigation benefit that works on top of existing health plans, helps members find
    Top Providers, and reimburses qualifying out-of-pocket costs when those providers are used. The platform also
    includes Garner Assistant and concierge support for member workflows, while Garner DataPro extends the same
    provider-performance engine into referral, health-plan, and provider analytics use cases.
  customerFocus: >-
    Self-insured and fully insured employers, advisors and brokers, health plans, provider organizations, and
    value-based-care participants, with employees, dependents, and patients as the end users whose behavior change
    drives savings.
  businessModel: >-
    Public evidence supports an employer-paid overlay model with monthly per-employee contract economics,
    employer-funded incentive or HRA-style reimbursements, and an emerging provider- analytics or referral-data revenue
    surface through DataPro.
  stage: Late-stage private (Series E completed May 2026)
  fundingStatus: >-
    Garner closed a $100 million Series E in May 2026 at a $2.74 billion valuation after a $118 million Series D in
    February 2026 at a $1.35 billion valuation. Publicly disclosed primary capital totals about $280 million, excluding
    an undisclosed Optum strategic investment.
