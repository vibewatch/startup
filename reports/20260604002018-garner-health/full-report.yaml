  - id: TV006
    title: Valuation bridge / thesis-break triggers table
    columns:
      - trigger
      - threshold or evidence
      - transmission to thesis
      - action implication
    rows:
      - - Gross ARR does not bridge cleanly to audited net revenue
        - Finance room shows material net-versus-gross adjustments or heavy reimbursement pass-throughs.
        - The current 13.7x headline multiple is overstated versus public net-revenue comps.
        - Re-underwrite at a lower effective revenue base before considering new capital.
      - - Growth decelerates faster than the premium case assumes
        - >-
          Forward growth falls materially below the current >100% or strong-growth framing before margin quality is
          visible.
        - >-
          The company stops looking like a premium-growth outlier and starts screening like a high-quality but normal
          platform.
        - Move from stretched to expensive and tighten acceptable entry price.
      - - Public multiple range stays compressed
        - Hinge-like names fail to expand while downside comps remain between ~0.2x and 1.4x.
        - The public exit window cannot validate the current private premium.
        - Assume base-case multiple closer to high-single-digits, not low-teens.
      - - Tender or preference terms are investor-unfriendly
        - >-
          Series E or tender docs show rich preferences, heavy secondary mix, or economics that disadvantage new
          common-equivalent holders.
        - Headline valuation overstates what new money is really buying.
        - Pause investment work until the cap table is transparently modeled.
      - - Retention and concentration disappoint
        - Cohort, broker, payer, or employer concentration is higher than expected or renewal quality is weak.
        - Revenue durability falls below what a premium multiple requires.
        - Shift the underwriting lens toward downside transaction comps.
    notes: >-
      These are thesis-break triggers, not generic risks; each would directly impair the assumptions needed to defend
      the Series E price.
    claimRefs:
      - CV039
      - CV040
      - CV044
      - CV045
      - CV050
      - CV055
  - id: TV007
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Cap table and preferences
        - Series D and E security terms, liquidation stack, participation rights, and any ratchets or MFNs.
        - Late-stage headline valuation can be economically misleading without waterfall context.
        - Counsel room, financing documents, and board-approved cap table export.
      - - Revenue definition
        - >-
          Bridge from disclosed gross ARR to audited net revenue, including reimbursement flows and any gross billing
          pass-through.
        - >-
          The central valuation multiple depends on whether the $200M figure is economically comparable to public
          net-revenue metrics.
        - Audited financials, revenue-recognition memo, and CFO review.
      - - Tender economics
        - Size, pricing, buyer mix, and relationship of the second tender to the primary Series E financing.
        - Secondary liquidity can affect price discovery and effective entry economics.
        - Board materials and tender closing memo.
      - - Retention and concentration
        - >-
          NRR, GRR, logo churn, contract duration, top-customer share, broker concentration, and payer or provider
          channel mix.
        - Premium multiples require durable and diversified recurring revenue.
        - Cohort dashboards and concentration schedules.
      - - Unit economics and margin profile
        - >-
          Gross margin, contribution margin, implementation-cost structure, CAC payback, and support intensity by
          product.
        - Public comps price economic quality, not just top-line growth.
        - Finance KPI pack and operating review.
      - - IPO readiness
        - Audited statements, governance package, quarterly close discipline, and public-company reporting readiness.
        - >-
          The most plausible premium-validation path is a later IPO or late-stage financing with public-quality
          disclosure.
        - CFO, auditors, and external counsel readiness plan.
    notes: 'These asks are intentionally narrow: each could move either the recommendation or the acceptable entry price.'
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV054
      - CV055
