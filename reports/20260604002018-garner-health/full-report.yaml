            body: >-
              Garner is not just selling one employer-navigation SKU. The advisor record shows brokers as a major
              acquisition channel: Alera, HUB, McGriff, and USI all present Garner as a tool for winning renewals,
              opening doors, or differentiating benefit strategy, and the older C2 partnership demonstrates
              consortium-style distribution through multiple regional brokerages. The health-plan and provider pages
              extend the model further. Garner says health plans can layer the incentive model onto existing plans
              without refiling or custom integrations, while providers can use API, UI, and custom-insight tools through
              DataPro. Provider-side proof is no longer theoretical. Marathon uses Garner data inside employer-sponsored
              primary care and referral coordination, and Atlantic Health says it will use Garner both to steer employer
              members to Atlantic physicians and to inform internal quality-improvement work. DataPro materials also say
              the platform is available to insurance carriers, benefits programs, and value-based care participants.
              Geography and segment evidence are directionally supportive but incomplete: advisor stories mention seven
              Alera markets, eight HUB offices, multi-state McGriff and USI partnerships, and customer examples in Utah,
