chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and economic model
        blocks:
          - type: paragraph
            body: >-
              Garner Health presents itself as a healthcare quality and navigation platform that tries to change patient
              behavior with both better information and better incentives. The official product stack has two visible
              surfaces. First, Garner sells an employer-sponsored benefit that layers onto existing health plans, steers
              members to Top Providers, and reimburses most or all out-of-pocket costs when members use those providers.
              Second, Garner has expanded into provider-facing workflows through Garner DataPro, which packages referral
              and performance analytics for care-delivery organizations and other healthcare intermediaries. As of the
              canonical run date, the company should be treated as a late-stage private Series E business founded in
              2019, with New York as the best-supported operating base but not yet an officially foregrounded
              headquarters detail in the fetched official pages. Its core economic claim is that better physician
              selection lowers both medical spend and patient friction.
