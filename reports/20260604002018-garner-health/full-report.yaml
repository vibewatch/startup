  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct navigation peers set the closest benchmark
        blocks:
          - type: paragraph
            body: >-
              Garner is not competing against every digital-health company equally. The closest job-to-be-done rivals
              are the vendors that sell employers a front door for cost reduction, care guidance, and benefits support
              while layering on enough clinical or claims intelligence to change member behavior. Included Health,
              Quantum Health, Rightway, and the combined Transcarent/Accolade platform all fit that description more
              closely than single-condition vendors do. The common thread is that each sells into self-insured employers
              and promises lower cost plus lower friction, but the strategic shapes differ. Included pushes an
              all-in-one model across clinical, financial, and administrative support. Transcarent now pairs advocacy
              and primary care with WayFinding, specialty care, pharmacy, and a partner marketplace. Quantum leans on
              incumbent trust, high-touch coordination, and deep integration breadth. Rightway is the most explicit
              about combining navigation with a neutral PBM. Garner’s public pitch is narrower: provider-quality
              steerage, reimbursement incentives, and provider analytics rather than a full benefits ecosystem
              orchestrator.
