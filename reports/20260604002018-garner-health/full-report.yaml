      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The primary economic buyer is the employer benefits function, usually anchored in a CHRO or
              benefits-leader budget and increasingly influenced by finance when claims pressure rises. Self-insured
              employers matter most because they directly feel claims savings, but the channel map is multi-sided:
              carriers and TPAs can distribute or embed navigation, and provider organizations can buy referral
              analytics or use them through value-based care programs. Employees are the day-to-day users, while
              providers are the supply-side objects of steerage and measurement. Deloitte says employers want solutions
              that go beyond traditional cost and network design, while SHRM still shows health benefits at the top of
              the employer priority stack. Business Group on Health and Aon add that employers are judging vendor
              performance, quality outcomes, and high-value care pathways rather than merely adding more point
              solutions. That makes the adoption path relatively clear: cost pressure creates attention; broker,
              carrier, and benefits teams evaluate options; implementation must fit the existing carrier or TPA stack;
              launch then depends on member engagement and provider trust; and renewal depends on demonstrating savings
              and experience gains. Vendors that can keep the carrier and minimize disruption have a structural
              advantage.
