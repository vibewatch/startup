  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category definition
        blocks:
          - type: paragraph
            body: >-
              Garner does not sell a full health plan or a general digital-health bundle. The most evidence-backed
              market boundary is narrower: employer-sponsored healthcare navigation, provider-quality analytics, and
              incentive-backed steerage layered onto existing medical coverage. KFF's survey shows employers already use
              high-performance, tiered, and narrow-network designs to steer utilization toward better-value providers,
              while peer category pages from Included Health, Quantum, Rightway, and Accolade consistently define
              navigation as a front door for medical, financial, and administrative questions, provider search, claims
              help, and care guidance. Garner pushes that category one step further through DataPro, which turns
              provider-quality measurement into a referral-analytics product for provider organizations, carriers,
              benefits programs, and value-based care participants. Included spend therefore covers navigation
              workflows, billing and claims guidance, provider selection and referral analytics, quality transparency,
              and incentive administration. Excluded spend covers core insurance underwriting, direct claims payment,
              PBM economics, and standalone care delivery. This boundary matters because Garner rides the economics of
              employer healthcare spend, but it captures value only in the decision and workflow layer.
            claimRefs:
