    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bull
        - >-
          Revenue scales to about $420M, penetration expands materially beyond today’s 2.4% broad self-funded lens, and
