        - Treat the company as structurally undercontrolled and haircut valuation or pause diligence
      - - Ranking explainability and fairness
        - Model-governance packet
        - No calibration study, no external review, no appeal path, or high unexplained false-positive rates
        - Assume recommendation trust can deteriorate and require heavier discounting
      - - Directory accuracy and scheduling reliability
        - Operational mismatch metrics
        - Meaningful rates of wrong numbers, stale availability, or failed referrals persist without improvement plan
        - Reduce confidence in savings claims and member adoption durability
      - - Member trust and reimbursement administration
        - Complaint and turnaround trend
        - Billing, reimbursement, or support complaints rise faster than usage, or turnaround times breach internal SLA
        - Assume member activation and employer renewal risk are increasing
      - - Commercial durability and concentration
        - Retention and mix bridge
        - Management cannot show healthy renewal cohorts or concentration within acceptable limits
        - Treat growth as less durable than headline adoption or funding suggests
      - - Channel and platform competition
        - Win-loss and displacement data
        - Bundled alternatives repeatedly block overlay deployments or compress pricing in core segments
        - Reframe Garner as a niche overlay rather than a durable front-door platform
    notes: >-
