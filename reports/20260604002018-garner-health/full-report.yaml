            body: >-
              Garner's public customer footprint is best read as a range rather than a single immutable number.
              Independent February 2026 coverage from Fierce Healthcare said Garner served 700 organizations and reached
              2.5 million members, while May 2026 PR-distributed financing materials and the Yahoo Finance mirror said
              the company partnered with almost 800 customers and more than 2.5 million people. That looks like rapid
              growth over a short interval, not a contradiction, but the exact denominator still matters because the
              company alternates among customers, clients, employers, and partners. The buyer mix is broader than just
              self-insured HR teams. Garner's solution pages explicitly target employers, advisors, health plans, and
              providers, and the case-study record shows both self-funded and fully insured employers using the product
              as an overlay on existing networks. Public evidence also supports a layered buyer-user-payer model:
              employers and health plans pay, advisors and brokers distribute, provider organizations use referral
              analytics, and members are the end users whose behavior drives savings. What remains undisclosed is the
              exact vertical split, payer/TPA count, enterprise versus mid-market mix, and how much of the near-800
              count is true paying employers versus channel or strategic partners.
