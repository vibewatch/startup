          Comparable set: Garner screens above healthy public comps and far above distressed or acquired navigation
          assets
        blocks:
          - type: paragraph
            body: >-
              Public and transaction comps do not give a single clean answer, but they do define the valuation envelope.
              Hinge Health is the most constructive public benchmark in this set: about 7.8x trailing revenue with 47%
              growth, 85% gross margin, and expanding operating leverage. Doximity trades around 6.1x and shows what a
              high-quality, network-led healthcare software asset can command in public markets. Teladoc, Health
              Catalyst, and Evolent sit much lower, at about 0.5x, 0.3x, and 0.2x respectively, while the Accolade /
              Transcarent takeout landed near 1.4x revenue. Garner at 13.7x is therefore above every fetched public or
              transaction benchmark here. That does not prove the round is wrong, because Garner is still private and
              growing much faster than the downside set. It does mean the burden of proof is asymmetric: investors need
              evidence that Garner deserves a premium even to Hinge, not merely a premium to distressed digital-health
              comps.
