      - number: '4.3'
        title: Unit economics assumptions, cost structure, and margin path
        blocks:
          - type: paragraph
            body: >-
              Garner’s public unit-economics story is persuasive on customer value but incomplete on margin quality. The
              value side is easy to find: the company and partner case studies cite 7.4% lower medical spend in an
              Aon-backed analysis, $116 PEPM savings in a metals-manufacturer case study, and double-digit or better
              claims reductions in advisor case studies. Those numbers support buyer willingness to renew if the savings
              hold. The harder question is what sits between that value and gross profit. Garner’s model appears to
              require claims-data ingestion, implementation help, member engagement support, incentive administration,
              and reimbursement workflows, so it should not be underwritten as pure software despite the analytics moat.
              Public peers frame the margin envelope. Accolade shows that navigation-heavy platforms can still lose
              money at substantial revenue scale, while Hinge shows that a more automated digital-health platform can
              reach 85% gross margin and 26% non-GAAP operating margin. Teladoc sits between those poles with positive
              EBITDA and cash generation but still reported GAAP losses. Garner’s likely path to profitability therefore
              depends on automation and accounting treatment, not just topline growth.
