  - id: TP001
    title: Competitor profile table
    columns:
      - Vendor / alternative
      - Category
      - Public scale / funding context
      - Target buyer / segment
      - Product scope
      - Notable differentiation
      - Limitation vs Garner lens
    rows:
      - - Garner Health
        - Direct peer
        - Private; Series E at $2.74B valuation disclosed in 2026
        - Self-insured employers; expanding provider-side analytics users
        - Provider-quality steerage, reimbursement incentive, DataPro referral analytics
        - Focused economic wedge around doctor choice plus incentive design
        - Narrower front-door scope and less obvious channel power than broader platforms
      - - Included Health
        - Direct peer
        - Large private platform; open-web scale details selective in current official pages
        - Large employers, payers, public sector buyers
        - Virtual care, navigation, advocacy, benefits and administrative support
        - Whole-person AI+EQ model plus active 2026 product expansion
        - Less explicit public proof than Garner on reimbursement economics for doctor steerage specifically
      - - Transcarent + Accolade
        - Direct peer
        - '>20M members and >1,700 employer/health-plan clients after 2025 merger'
        - Self-insured employers and health plans
        - WayFinding, specialty care, pharmacy, advocacy, expert opinions, primary care, partner marketplace
        - Broadest integrated navigation stack in the peer set
        - Breadth can make it a larger platform decision, not a narrow steerage add-on
      - - Quantum Health
        - Direct peer / incumbent
        - 25+ years in category; 500+ employers; 850+ integrations claimed publicly
        - Employers seeking high-touch navigation over existing plans
        - Navigation, care coordination, analytics, point-solution orchestration
        - Incumbent trust, integration depth, and employer familiarity
        - Less distinct public provider-ranking wedge than Garner
      - - Rightway
        - Direct peer
        - Private; over 3M members and >97% client retention claimed in 2025 release
        - Employers seeking navigation plus PBM savings
        - Care navigation, bill resolution, PBM, pharmacy navigation
        - Transparent-fee economics and pharmacist-led PBM integration
        - More pharmacy-centered than provider-quality-centered
      - - Evernorth Benefits Navigation
        - Carrier incumbent
        - Scaled health-services platform inside The Cigna Group
        - Employers, unions, government entities, health-plan ecosystems
        - Vendor-agnostic navigation, rewards, Care Guides, reporting, linked care/pharmacy assets
        - Existing carrier and benefits distribution plus broad service stack
        - Carrier-linked model may feel less differentiated if employer wants an overlay specialist
      - - apree / Castlight
        - Legacy incumbent / integrated alternative
        - Private integrated navigation-plus-primary-care platform; Castlight remains active brand
        - Employers and members seeking bundled navigation and primary care
        - Navigation app, Care Guides, primary and preventive care, performance guarantees
        - Legacy data asset and willingness to share risk
        - Legacy brand position suggests navigation can be folded into a broader services bundle
      - - Hinge Health
        - Adjacent substitute
        - Public company with 2026 revenue guidance of $801M
        - Employers and plans buying MSK solutions
        - MSK care, PT, specialists, condition-specific guidance
        - Strong quantified ROI and public-market credibility
        - Not a full benefits-navigation replacement
      - - Spring Health
        - Adjacent substitute
        - Private; official employer page says >20M covered lives globally
        - Employers buying behavioral-health access and EAP replacement
        - Mental-health matching, therapy, psychiatry, employer analytics
        - Clear condition-category ownership and fast access
        - Budget competitor, not broad medical navigation
      - - Sword Health
        - Adjacent substitute
        - Private; $40M round at $4B valuation disclosed in 2025
        - Employers and plans buying AI-led specialty care
        - AI care across MSK, women’s, mental, and cardiometabolic care
        - Strong ROI framing and expanding care surface
        - Still condition-led relative to end-to-end navigation
      - - Self-navigation / internal build
        - Status quo substitute
        - No venture scale needed, but hidden labor burden is high
        - HR teams, carrier portals, existing vendor stack
        - Employees navigate fragmented tools themselves; employer coordinates vendors manually
        - No new vendor contract required
        - Complexity, low trust, and poor orchestration are exactly the pain point rivals exploit
    notes: >-
      Rows compare the main ways an employer can solve Garner’s job, including direct peers, incumbents, adjacent
      substitutes, and status quo. Exact private-company scale is shown only where current public evidence supports it;
      otherwise the cell stays qualitative.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the major direct peers, incumbent alternatives, adjacent substitutes, and status quo options visible in
        current public sources, but not every regional consultant or niche point solution.
