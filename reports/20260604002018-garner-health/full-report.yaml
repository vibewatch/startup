  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: strong company quality, but the current round already prices in most of the public upside'
        blocks:
          - type: paragraph
            body: >-
              Garner looks like a real late-stage winner on quality of problem, growth, and customer proof. The May 2026
              Series E round set a $2.74 billion valuation on approximately $200 million of disclosed gross ARR, or
              about 13.7x, after the company had already raised a $1.35 billion Series D only months earlier. That
              valuation is not impossible to defend, because public evidence also shows more than 2.5 million covered
              people, nearly 800 organizations, more than five years of doubling, and employer ROI claims that are
              directionally strong. The problem is price, not existence. At today’s mark, investors are paying ahead of
              audited disclosure and ahead of public-market proof that economics look more like Hinge Health’s
              high-growth profile than like the compressed digital-health and care-enablement set. That makes the
              current call research-more: stay engaged, but do not treat the Series E price as a casual buy level.
