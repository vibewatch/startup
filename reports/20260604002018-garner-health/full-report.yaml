        title: Funding history, capital adequacy, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Garner’s capital formation is straightforward on sequence but not fully reconciled on cumulative dollars.
              Third-party and company sources support a path from a 2020 seed round to a February 2021 Series A, a $45
              million Series B in late 2021, an undisclosed Optum strategic investment that same year, then a leap to a
              $118 million Series D at a $1.35 billion valuation in February 2026 and a $100 million Series E at a $2.74
              billion valuation in May 2026. Adding the disclosed seed, A, B, D, and E amounts yields about $280 million
              of primary capital, but the undisclosed Optum amount means the true cumulative figure cannot be pinned
              down exactly from open-web evidence. The capital-adequacy read is even murkier. Garner’s Series E press
              release says the company recently completed a second employee tender offer, which means 2026 capital
              activity included liquidity as well as growth investment. Yet no reviewed source discloses cash on hand,
              burn, runway, debt, or covenants. Investors can see access to capital, but they still cannot see the
              balance-sheet durability behind it.
