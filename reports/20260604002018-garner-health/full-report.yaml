            body: >-
              Garner has enough public trust surface to clear an enterprise-procurement threshold, but not enough to
              fully clear technical diligence. The official record supports SOC 2 Type II, HIPAA business-associate
              positioning, optional Plaid-linked reimbursement flows, app-store privacy disclosures, and an engineering
              culture that emphasizes security, APIs, and AI systems. It also supports that AI is being used in at least
              four places: member self-service through Garner Assistant, literature review and metric maintenance
              through Research Agent, directory-data cleaning, and employer analytics on issues like AI upcoding. But
              the public evidence stops well short of a complete AI architecture disclosure. There is no public
              discussion of model vendors, evaluation benchmarks, human override rules, latency commitments, or whether
              Top Provider recommendations update in real time versus on a scheduled refresh. Just as important, Garner
              publicly says providers cannot see their individual rankings directly. That preserves objectivity, but it
