callouts:
- calloutType: insight
  title: Recurring demand is clearer than true margin quality
  body: 'Public sources make the revenue mechanism and savings logic legible: employers fund the benefit, members use it at meaningful rates, and ARR is now around $200 million. What stays opaque is how much of that reported revenue is software-like versus reimbursement-linked or service-intensive.'
  claimRefs:
  - CI004
  - CI017
  - CI032
  - CI045
- calloutType: risk
  title: Late-stage funding strength does not equal verified runway
  body: Two large 2026 rounds and a tender offer prove capital access, but they do not prove cash durability because public sources still omit cash, burn, runway, debt, and covenant detail.
  claimRefs:
  - CI023
  - CI030
  - CI031
  - CI050
- calloutType: risk
  title: The valuation premium leaves little room for public-comp disappointment
  body: Garner’s implied ~13.7x ARR multiple is dramatically richer than Accolade’s take-private multiple. That gap can close through strong execution, but it can also close through multiple compression if the market decides navigation is more service-heavy than software-like.
  claimRefs:
  - CI037
  - CI042
  - CI043
  - CI044
