  rows:
  - - Employer navigation admin fee
    - Forbes says employers pay a monthly per-employee fee.
    - Recurring PEPM-style employer contract
    - Likely recurring and contractually sticky
    - Employer pays; monthly per-employee framing is public.
    - Exact PEPM, discounting, and average contract value are undisclosed.
  - - Employer-funded incentive / HRA overlay
    - FAQ and broker materials say employers fund HRA or incentive accounts tied to Top Provider usage.
    - Employer-funded reimbursement pool
    - Potentially pass-through or lower-quality revenue depending on accounting
    - Incentives are core to behavior-change model.
    - Gross vs net accounting treatment is not public.
  - - Provider analytics / referral intelligence
    - Series B and DataPro materials describe a provider-facing analytics surface.
    - Likely subscription, data-service, or analytics contract
    - Potentially higher-margin than benefit administration if software-led
    - Second revenue surface clearly exists in public materials.
    - No public revenue contribution or pricing.
  - - Broker / partner distribution
    - HUB and PGP materials show broker and partner involvement in sales and benefit design.
    - Channel-assisted employer contract
    - Can reduce selling friction and widen reach
    - Broker attach evidence exists.
    - Channel commissions, economics, and partner concentration are undisclosed.
  - - AI/member-assistance upsell value
    - Series E release ties AI product expansion to future growth and member expansion.
    - Likely bundled inside core contract today
    - May improve retention and operating leverage over time
    - AI is part of growth narrative and product roadmap.
    - No standalone monetization disclosure.
  notes: Rows separate the visible revenue surfaces from the unresolved accounting treatment. Public evidence supports recurring employer-paid revenue, but not a clean split between software fees, pass-through reimbursements, and provider-analytics contribution.
