- id: TI006
  title: Capital adequacy and public financial gaps table
  columns:
  - Item
  - Public value / status
  - Why it matters
  - Exact diligence path
  rows:
  - - Cash on hand
    - Unknown
    - Needed to assess runway after two 2026 financings
    - Request latest balance sheet and cash roll-forward.
  - - Monthly burn
    - Unknown
    - Separates growth investment from financing dependency
    - Request management accounts with monthly cash burn.
  - - Runway months
    - Unknown
    - Late-stage rounds do not prove liquidity durability by themselves
    - Build runway bridge from cash, burn, and hiring plan.
  - - Debt / covenant obligations
    - No public debt facility identified in reviewed sources
    - Debt could tighten flexibility even if equity capital is strong
    - Request debt schedule, covenants, and any recourse obligations.
  - - Tender / secondary activity
    - Second employee tender disclosed in Series E release
    - Liquidity events can absorb capital without extending runway proportionally
    - Request tender size, price, and primary-versus-secondary split.
  - - Next-round trigger
    - Unknown
    - Important to know whether the next raise is optional growth capital or necessary operating support
    - Request board plan with downside, base, and upside financing cases.
  - - Revenue recognition for reimbursements
    - Unknown gross vs net treatment
    - Directly affects margin quality and comparable revenue multiple analysis
    - Request revenue-accounting memo and audited financial statements.
  notes: Unknown means the reviewed public sources did not provide a supportable number. The lack of disclosed liquidity metrics is the main reason capital adequacy cannot be treated as verified despite substantial recent fundraising.
