  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: GAAP revenue waterfall showing how employer fees, reimbursements, and any provider-analytics revenue are recognized.
    whyItMatters: Gross-versus-net treatment for employer-funded reimbursements materially changes how much of Garner’s reported revenue is high-margin software versus pass-through economics.
    diligencePath: Request audited or board-approved revenue-recognition memos plus segment-level revenue detail for employer admin fees, reimbursements, and provider analytics.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI001
    - TI005
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: Round-by-round financing schedule that separates seed, Series A, Series B, Optum strategic capital, Series D, Series E, and any secondary or tender proceeds.
    whyItMatters: Open-web sources support the sequence of rounds but not a fully reconciled cumulative total, which affects dilution analysis and true primary capital raised.
    diligencePath: Request cap-table history or financing summary from management or lead investors and reconcile it against the disclosed round amounts and tender language.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI003
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, debt balances, covenant headroom, and runway bridge.
    whyItMatters: Without liquidity data, the chapter can describe capital access but cannot underwrite whether Garner needs another round for survival, growth acceleration, or both.
    diligencePath: Request latest management accounts, cash roll-forward, debt schedule, and board materials that show operating plan versus available liquidity.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI006
  - type: missing-source
    severity: material
    topic: next-round-trigger
    missingEvidence: Management operating plan tying hiring, AI investment, provider-platform expansion, and tender policy to financing thresholds.
    whyItMatters: Two large 2026 financings plus a tender offer show capital activity, but public evidence does not reveal the next-round trigger or target cash buffer.
    diligencePath: Ask management for a 24-month plan with base, upside, and downside cash cases plus explicit financing trigger points.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI006
