- id: TI005
  title: Unit economics and profitability bridge table
  columns:
  - Driver / metric
  - Public value or status
  - Confidence
  - Margin implication
  - Diligence ask
  rows:
  - - Employer price realization
    - Monthly per-employee fee disclosed, exact PEPM not public
    - Medium
    - Recurring contract revenue is real, but pricing power is not directly measurable
    - Request realized PEPM by customer segment and contract cohort.
  - - Member engagement
    - ~46% engagement / usage
    - Medium
    - Higher engagement should improve savings realization and renewal likelihood
    - Request engagement by client age, plan type, and channel.
  - - Documented savings proof
    - 7.4% lower spend in Aon study; case studies from 12% to 26.7% claims reduction
    - Medium
    - Supports willingness to pay and renewal, though still largely company-distributed evidence
    - Request third-party actuarial studies and renewal cohorts.
  - - Reimbursement accounting
    - Not publicly disclosed
    - Medium
    - Could materially alter gross-margin interpretation if reimbursements are recorded gross
    - Request GAAP policy and sample journal treatment.
  - - Service intensity
    - Implementation, concierge, education, and incentive administration are all visible in public materials
    - Medium
    - Points away from pure-SaaS margins without more automation
    - Request service headcount per covered life and case mix.
  - - Channel efficiency proxy
    - HUB says 35% of informed clients add Garner
    - Medium
    - Channel distribution may lower CAC if attach rates persist
    - Request broker-sourced pipeline share and channel economics.
  - - Comparable margin envelope
    - Accolade loss-making at scale; Teladoc EBITDA-positive but GAAP-loss making; Hinge high gross margin and 26% op margin
    - Medium
    - Likely margin range is wide and mix-dependent
    - Request cohort gross margin and contribution margin by product line.
  notes: This table intentionally mixes known values with null-like status entries because the chapter’s core issue is not lack of commercial traction but lack of auditable margin disclosure. Every unknown row has a specific diligence ask.
