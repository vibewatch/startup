company:
  name: Garner Health
chapter:
  number: 4
  title: Financials
  summary: 'Garner’s public financial story is strongest on recurring employer-paid revenue, savings evidence, and capital access, with gross ARR around $200M by May 2026 and a second provider-analytics surface now visible. The weak point is disclosure quality: public sources still do not show audited financials, cash, burn, runway, or gross-versus-net reimbursement accounting, so the $2.74B round should be read as a premium growth-quality bet rather than proof of verified profitability.'
sections:
- id: revenue-model-and-pricing
  title: Revenue model and monetization mechanics
  body: 'The strongest public financial evidence says Garner monetizes through an employer-paid overlay rather than through insurance risk, provider commissions, or consumer subscriptions. Official FAQ and employer pages consistently describe a benefit layered on top of an existing carrier network, funded by employers, and reinforced with employer-funded HRA or incentive accounts that reimburse out-of-pocket costs when members use Garner-designated providers. Forbes adds the clearest open-web contract signal: employers pay a monthly per-employee fee. That matters because it makes the recurring revenue model legible even though list PEPM pricing is not disclosed. The same source set also supports a second revenue surface. Garner’s 2021 Series B announcement already referenced a provider-referral product line, and the later DataPro launch shows the quality engine being packaged for provider organizations, carriers, and value-based-care participants. The open question is not whether Garner
    has recurring revenue; it is how much of reported revenue is high-margin software versus reimbursement-linked economics and service administration.'
