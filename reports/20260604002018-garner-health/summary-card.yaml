summary:
  headline: >-
    Garner appears to be a credible late-stage healthcare navigation winner with real scale and a differentiated
    data-and-incentives model, but the $2.74 billion Series E already prices in premium execution while public
    disclosure on margins, retention, and capital structure remains too thin for a clean buy call.
