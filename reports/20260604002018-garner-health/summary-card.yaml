  topStrengths:
    - >-
      Garner combines a differentiated claims-data and provider-ranking engine with incentive design, creating a product
      that is more defensible than a generic navigation front end.
    - >-
      Public scale signals are meaningful for a private healthcare-navigation company: almost 800 customers or partners,
      more than 2.5 million people covered, and roughly $200 million of gross ARR by May 2026.
    - >-
      The business now spans employer benefits, broker distribution, health-plan overlays, and provider referral
      analytics, which broadens go-to-market routes and deepens strategic relevance.
    - >-
      The Series E syndicate led by Index Ventures with repeat participation from Kleiner Perkins, Redpoint, Thrive,
      Sequoia, Founders Fund, and Kaiser Permanente Ventures is strong validation.
  topRisks:
    - >-
      Public disclosure is still too thin for a late-stage underwrite: there is no audited GAAP revenue bridge, no clear
      gross-to-net accounting, no margin profile, and no visibility into cap-table preferences or tender economics.
    - >-
      Garner's trust stack is complex because provider rankings, directory accuracy, reimbursement workflows, and PHI or
      vendor governance all have to work together for the ROI story to hold.
    - >-
      Commercial durability remains under-disclosed because public sources do not show NRR, GRR, churn, customer
      concentration, broker concentration, or clean paying-customer definitions.
    - >-
      Broader navigation platforms and payer-led front doors could squeeze Garner's channel position even if its
      physician-quality model remains differentiated.
  unresolvedGaps:
    - Exact gross-to-net revenue bridge, audited financial statements, and current margin profile.
    - >-
      Cap-table preference stack, tender mechanics, and whether the headline Series E valuation maps cleanly to
      new-money economics.
    - Retention, cohort behavior, NRR/GRR, logo churn, and customer or broker concentration.
    - Model-governance evidence for provider rankings, directory accuracy, appeals, and AI-assisted workflows.
    - Fresh verified headcount and a cleaner split between customers, employers, partners, and other counterparties.
