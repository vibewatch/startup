  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Redacted contracts or consultant benchmark data that show actual employer pricing, minimums, and performance-gurantee mechanics across Garner and its direct peers.
    whyItMatters: Packaging comparisons are evidence-based, but exact price remains the clearest unresolved variable for procurement and payback comparisons.
    diligencePath: Request recent redacted contracts, consultant scorecards, or buyer-side benchmark sheets for Garner, Included, Quantum, Rightway, Transcarent, and Evernorth.
    relatedQuestionRefs:
    - QP012
    - QP013
    - QP014
