- id: adverse-evidence-and-bottom-line
  title: Adverse evidence raises the bar rather than invalidating the category
  body: The best adverse evidence in this chapter is not that navigation is unnecessary; it is that the market punishes vendors that fail to reach enough breadth, trust, or scale. Fierce reported that Accolade entered its sale process with $414 million of fiscal 2024 revenue but a $100 million net loss, and the company was ultimately taken private in a $621 million transaction. That is bad evidence for a thin standalone narrative, but not for the underlying employer pain point. In fact, the merger created a stronger rival with more than 20 million members, 1,700-plus clients, and a broader clinical surface. Hinge’s public-market disclosures further show that adjacent employer-benefits vendors can scale materially once the product and ROI story resonate. The practical conclusion for Garner is therefore nuanced. The company’s focused steerage and reimbursement design remain a real wedge, but buyers that prioritize integrated breadth, existing channel access, or vendor consolidation have credible
    alternatives that are already larger and often more deeply embedded.
