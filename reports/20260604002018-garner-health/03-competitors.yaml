- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public price / unit signal
  - Contract-model evidence
  - Included capabilities visible publicly
  - What remains unknown
  - Implication
  rows:
  - - Garner
    - Exact employer pricing undisclosed
    - Employer-sponsored benefit with member reimbursement and provider-steerage economics
    - Doctor ranking, out-of-pocket reimbursement, provider analytics adjacency
    - PEPM / performance-fee structure and DataPro pricing are not public
    - Buyer must underwrite ROI from steerage, not a public rate card
  - - Included
    - Exact pricing undisclosed
    - Enterprise all-in-one healthcare platform
    - Virtual care, navigation, advocacy, administrative and financial support
    - Unit pricing, guarantee structure, and reimbursement design are not public in fetched pages
    - Competes on breadth and member experience more than public price transparency
  - - Transcarent+Accolade
    - Exact pricing undisclosed
    - One contract, one bill, unified partner marketplace, single platform
    - Navigation, care experiences, primary care, expert opinions, pharmacy, partner ecosystem
    - Module pricing and minimums are not public
    - Packaging directly answers vendor-consolidation pressure
  - - Quantum
    - Exact pricing undisclosed
    - Navigation contract supported by savings and integration claims
    - Navigation, care coordination, analytics, partner orchestration
    - Commercial terms and bundle structure are not public
    - Trust and proof points are public, but price discovery still needs diligence
  - - Rightway
    - Admin-fee model is public; exact dollar level undisclosed
    - Single transparent fee, 100% pass-through, SureSpend ceiling
    - PBM, pharmacy navigation, care navigation, bill resolution
    - Specific admin fee, implementation fees, and renewal mechanics are not public
    - Most transparent economic framing among direct peers
  - - Evernorth
    - Exact pricing undisclosed
    - Navigation layered across benefits ecosystem with rewards and Care Guides
    - Vendor-agnostic navigation, reporting, rewards, broader care/pharmacy links
    - Whether priced standalone, bundled, or subsidized in broader client relationships
    - Carrier-linked bundles can be hard for specialists to displace on price
  - - apree / Castlight
    - Exact pricing undisclosed
    - Performance guarantees plus upside/downside risk language
    - Navigation, Care Guides, primary and preventive care
    - Base fees, risk-share thresholds, and implementation economics are not public
    - Incumbent can compete on shared-risk packaging rather than list price
  - - Spring
    - Member visits can run through in-network claims or self-pay; employer price undisclosed
    - Employer mental-health contract plus insurance or self-pay at member level
    - Mental-health matching, therapy, psychiatry, analytics
    - Employer PMPM / case-rate structure is not public
    - Adjacent vendors can look more tangible to buyers because member billing mechanics are clearer
  - - Hinge / Sword
    - Exact employer pricing undisclosed
    - Outcome- and ROI-framed specialty contracts
    - Condition-specific AI and clinical care with strong savings claims
    - Actual employer fee basis and guarantee mechanics differ by client and are not public
    - Specialists win budget with hard outcome claims even without transparent list prices
  notes: Public packaging evidence is much richer than public rate cards. Unknown means the exact commercial term was not recoverable from the reviewed sources and should be diligence-requested rather than inferred.
