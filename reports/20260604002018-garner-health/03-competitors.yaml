callouts:
- calloutType: insight
  title: Garner’s competitive wedge is clarity, not category breadth
  body: Garner stands out for focusing the employer value story on provider selection, steerage incentives, and provider analytics. That is a cleaner proposition than the all-purpose platforms, but it also means Garner must prove that its focused wedge matters more than breadth in actual procurement.
  claimRefs:
  - CP001
  - CP002
  - CP042
  - CP048
- calloutType: risk
  title: Integrated platforms and carrier-linked incumbents have more distribution power
  body: Transcarent, Quantum, and Evernorth all show publicly that scale, partner ecosystems, and incumbent access are major buying criteria. Garner can still win, but it is fighting wider channel power rather than a blank slate.
  claimRefs:
  - CP009
  - CP013
  - CP031
  - CP046
  - CP054
- calloutType: risk
  title: Accolade’s outcome is adverse for thin standalone narratives
  body: Accolade’s sale does not prove navigation is weak demand. It shows that the market increasingly rewards navigation platforms that can add more clinical breadth, stronger economics, or both. Garner should assume consolidation raises—not lowers—the bar.
  claimRefs:
  - CP038
  - CP051
  - CP054
