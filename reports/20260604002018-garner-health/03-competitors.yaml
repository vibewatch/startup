- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Garner moat claim
  - Threat / evidence
  - Severity
  - Why this matters
  - Mitigation or diligence ask
  rows:
  - - Provider-quality measurement is differentiated
    - Broad platforms or carriers can add steerage features and bundle them with wider care and advocacy surfaces
    - High
    - If steerage becomes just another module, Garner loses bargaining power
    - Audit ranking methodology durability, data refresh cadence, and measurable delta versus broad platforms
  - - Reimbursement incentive changes member behavior
    - Employer or member pushback can frame steerage as restrictive or administratively complex
    - Medium
    - The wedge works only if members trust recommendations and use them
    - Request adoption, repeat-use, and grievance data by employer cohort
  - - Direct employer overlay keeps implementation lighter than replacing a plan
    - Transcarent, Rightway, and Evernorth all explicitly sell simplification over existing plans too
    - Medium
    - Ease-of-launch is not unique if rivals make the same promise
    - Review implementation timelines, file dependencies, and live-service staffing needs versus peers
  - - DataPro opens provider-side adjacency
    - Provider analytics is not yet the main public purchase story, and provider-access moats could prove weaker than employer-facing moats
    - Medium
    - Adjacency can expand TAM, but only if provider adoption becomes real and sticky
    - Validate DataPro revenue mix, attach rate, and renewal behavior
  - - Focused scope can keep ROI story cleaner
    - Vendor-consolidation pressure favors one-platform buyers and wider ecosystems
    - High
    - Broad platforms can win procurement even when individual modules are less differentiated
    - Map consultant feedback and deals lost to one-platform procurement motions
  - - Navigation overlays are sticky once communications and integrations are live
    - Multi-homing is common and employers can swap overlays without replacing the underlying carrier
    - Medium
    - Switching friction slows churn but does not eliminate it
    - Request churn reasons, transition win/loss analysis, and overlap with incumbent carrier tools
  - - Category weakness could help Garner by discrediting rivals
    - 'Accolade shows the opposite: weak standalone economics can end in consolidation that creates a stronger rival'
    - High
    - Adverse sector evidence can still raise the competitive bar
    - Monitor M&A and benchmark Garner’s breadth versus merged platforms quarterly
  - - Legacy navigation looks dated
    - Castlight and apree show navigation can persist inside broader risk-sharing or primary-care bundles
    - Medium
    - Incumbents can commoditize navigation and still remain credible in RFPs
    - Test whether brokers view navigation as a standalone budget line or a bundled capability
  notes: Severity reflects competitive risk to Garner’s durability, not certainty that the threat will materialize. The register intentionally mixes direct-peer, incumbent, and substitute risks because buyer procurement spans all three.
