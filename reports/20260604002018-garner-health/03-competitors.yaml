  - type: private-evidence-only
    severity: material
    topic: private-scale-disclosure
    missingEvidence: Audited current member, client, retention, and revenue figures for private peers whose open-web disclosures are selective or dated.
    whyItMatters: Scale and retention influence distribution power and resilience, but several private platforms disclose only selective snapshots.
    diligencePath: Ask management or consultants for current client counts, covered lives, gross retention, and net retention by competitor where available.
    relatedQuestionRefs:
    - QP003
    - QP022
    - QP023
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: channel-economics
    missingEvidence: Broker, carrier, TPA, and consultant channel-economics data that quantifies who controls distribution and which vendors are embedded versus overlaid.
    whyItMatters: The strategic argument that breadth and channel power matter is strong, but the exact magnitude of consultant and carrier leverage is still inferred rather than quantified.
    diligencePath: Interview benefit consultants, carriers, and recent buyer wins/losses to map reseller economics, data-access dependencies, and consultant influence on vendor selection.
