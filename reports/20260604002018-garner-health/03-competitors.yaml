- id: packaging-pricing-and-distribution
  title: Packaging and distribution matter more publicly than exact price
  body: 'Open-web pricing is thin across the category, so the right comparison is contract architecture rather than list price. Transcarent is explicit about selling one contract, one bill, and a unified experience across partner solutions. Rightway is unusually transparent on economic structure: a single admin fee, 100% pass-through pricing, no supply-chain ownership, and a spend-cap guarantee. Apree similarly emphasizes performance guarantees and willingness to share upside or downside risk. Evernorth sells navigation as a vendor-agnostic layer that reduces benefits-management fatigue and centralizes rewards, reporting, and Care Guides. Garner, Included, Quantum, and most others do not publish employer rate cards. Distribution signals are easier to observe than price. Quantum advertises 850-plus point-solution or partner integrations, Evernorth has 100-plus vendor and plan partners, and Transcarent now pairs scale with consultant and partner reach after absorbing Accolade. Garner’s focused
    proposition can be easier to explain, but broader distribution ecosystems still carry procurement weight.'
