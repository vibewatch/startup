- id: diligence-and-exit-readiness
  title: 'Final diligence and exit readiness: the company could grow into the price, but the public evidence set is not yet underwriter-grade'
  body: 'The public record is good enough to justify serious attention and too thin to justify price-insensitive underwriting. Garner’s quality claims are directionally reinforced by customer scale, engagement, and premium growth, but the missing evidence sits exactly where late-stage valuation risk is greatest: audited revenue definition, margin conversion, retention quality, channel concentration, cap-table preferences, and tender economics. Public-company-quality disclosure exists for Hinge and Teladoc; it does not exist for Garner. That means the most supportable path to liquidity is a future IPO or another private round after management provides a finance room that bridges gross ARR to audited net revenue and clarifies security economics. Until then, the investment posture should be disciplined curiosity. Stay close, define downside triggers in advance, and require evidence that the headline valuation is economically real for new money rather than only narratively defensible from growth
    headlines.'
