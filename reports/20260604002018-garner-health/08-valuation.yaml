- id: TV005
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Revenue scales to about $420M, penetration expands materially beyond today’s 2.4% broad self-funded lens, and investors still pay 11x-13x for category leadership.
    - $4.6B-$5.5B implied value, or meaningful upside versus the current round.
    - Requires durable growth, cleaner accounting disclosure, and Hinge-like quality signals rather than generic digital-health comps.
    - low-medium
  - - Base
    - Revenue reaches about $320M, growth remains healthy but decelerates, and the market prices Garner at 7.5x-9.5x like a premium public comp.
    - $2.4B-$3.0B implied value, roughly around the current mark with limited upside.
    - Even solid execution may only validate, not exceed, today’s price.
    - medium
  - - Bear
    - Revenue reaches only about $240M, multiple compresses to 4x-6x, and investors treat the company more like a good but not scarcity-priced healthcare platform.
    - $1.0B-$1.4B implied value, roughly back toward or below Series D territory.
    - Downside can come from accounting-quality concerns, multiple compression, or weaker retention without a demand collapse.
    - medium
  notes: Scenarios use a revenue-multiple framework because the public record is too thin on audited margins, cash flow, and security terms for a DCF-grade model.
