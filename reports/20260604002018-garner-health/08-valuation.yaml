- id: scenario-range-and-thesis-breaks
  title: 'Scenario range: current price roughly matches a strong base case, while the bear case falls back toward Series D territory'
  body: 'The right scenario method is a revenue-multiple framework, not a DCF, because public evidence is strong on growth direction and weak on audited margins, cash generation, and security terms. In a bull case, Garner can grow into roughly $420 million of revenue and still command an 11x to 13x premium multiple, which would justify about $4.6 billion to $5.5 billion of value. In a base case, revenue reaches about $320 million and public-market normalization trims the multiple to 7.5x to 9.5x, implying about $2.4 billion to $3.0 billion. In a bear case, revenue reaches only about $240 million while the market prices the company closer to 4x to 6x revenue, pulling value back to around $1.0 billion to $1.4 billion. That distribution is why the round looks full: the current $2.74 billion mark already sits close to a strong base case, while the downside is large if growth quality, accounting quality, or public multiples disappoint.'
