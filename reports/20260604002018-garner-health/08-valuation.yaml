  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-preferences
    missingEvidence: Series E and Series D security terms, liquidation preferences, participation rights, and any MFN or ratchet mechanics.
    whyItMatters: Late-stage headline valuations can materially overstate common-equivalent value when preference stacks are rich.
    diligencePath: Request signed financing docs, cap table waterfall, and counsel summary of rights.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV007
  - type: private-evidence-only
    severity: blocking
    topic: revenue-definition
    missingEvidence: Bridge from disclosed gross ARR to audited GAAP revenue, including net-versus-gross treatment and any reimbursement pass-throughs.
    whyItMatters: A 13.7x multiple on gross ARR is materially less reliable than the same multiple on audited net revenue.
    diligencePath: Request audited or reviewed financials plus a revenue-recognition memo from finance and auditors.
    relatedQuestionRefs:
    - QV002
    - QV030
    relatedTableRefs:
    - TV007
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, logo churn, renewal timing, top-customer concentration, and broker or payer concentration.
    whyItMatters: Multiple durability depends on recurring-revenue quality and buyer diversification, not just top-line growth.
    diligencePath: Request cohort tables by customer segment and concentration schedules for top accounts and channels.
    relatedQuestionRefs:
    - QV023
    - QV024
    relatedTableRefs:
    - TV007
  - type: private-evidence-only
    severity: material
    topic: tender-economics
    missingEvidence: Tender size, price per share, buyer mix, and relationship between the tender and the primary Series E financing.
    whyItMatters: Secondary liquidity can support the headline mark without proving identical economics for new primary capital.
    diligencePath: Request board materials and closing memo for the second tender offer.
    relatedQuestionRefs:
    - QV006
    - QV029
    relatedTableRefs:
    - TV006
    - TV007
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, contribution margin, CAC payback, and implementation-cost profile by product line.
    whyItMatters: Private premiums should be benchmarked to economic quality, especially when public comps already disclose margin profiles.
    diligencePath: Request CFO KPI pack and implementation P&L by cohort.
    relatedQuestionRefs:
    - QV013
    - QV024
    relatedTableRefs:
    - TV004
    - TV007
