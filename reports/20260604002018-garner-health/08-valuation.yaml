chapter:
  number: 8
  title: Valuation
  summary: Garner Health is a high-quality late-stage asset, but the May 2026 Series E at $2.74B already prices in premium execution and cleaner future disclosure. On the disclosed roughly $200M of gross ARR, the round implies about 13.7x and sits above every fetched public or transaction comp in this chapter, so the main stance is research-more with a stretched valuation view rather than an outright buy.
sections:
- id: recommendation-and-current-price
  title: 'Recommendation: strong company quality, but the current round already prices in most of the public upside'
  body: 'Garner looks like a real late-stage winner on quality of problem, growth, and customer proof. The May 2026 Series E round set a $2.74 billion valuation on approximately $200 million of disclosed gross ARR, or about 13.7x, after the company had already raised a $1.35 billion Series D only months earlier. That valuation is not impossible to defend, because public evidence also shows more than 2.5 million covered people, nearly 800 organizations, more than five years of doubling, and employer ROI claims that are directionally strong. The problem is price, not existence. At today’s mark, investors are paying ahead of audited disclosure and ahead of public-market proof that economics look more like Hinge Health’s high-growth profile than like the compressed digital-health and care-enablement set. That makes the current call research-more: stay engaged, but do not treat the Series E price as a casual buy level.'
