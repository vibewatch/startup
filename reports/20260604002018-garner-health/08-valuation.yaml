- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Hinge Health
    - Market cap / TTM revenue / Q1 2026 quality
    - ~7.8x revenue; 47% YoY growth; 85% gross margin; 26% non-GAAP operating margin outlook
    - Best fetched public comp for a high-growth employer-benefit platform with software-like gross margins.
    - MSK-focused platform with public-company discipline and category differences versus navigation.
  - - Doximity
    - Market cap / TTM revenue
    - ~6.1x revenue
    - Useful premium benchmark for a network-and-data healthcare software asset with strong public liquidity.
    - Advertising and workflow model differ from employer navigation economics.
  - - Teladoc
    - Market cap / TTM revenue / Q1 2026 growth
    - ~0.5x revenue; Q1 revenue down 2% YoY
    - Scaled digital-health lower bound and cautionary multiple-compression comp.
    - Mixed asset portfolio and challenged post-pandemic growth make it a downside rather than central comp.
  - - Accolade / Transcarent
    - Transaction value / TTM revenue
    - ~1.4x revenue on $621M takeout for a navigation asset
    - Closest fetched M&A comp for health-benefits navigation and employer-facing support services.
    - Distressed public seller and strategic take-private transaction, not a healthy IPO-quality premium multiple.
  - - Health Catalyst
    - Market cap / TTM revenue
    - ~0.3x revenue
    - Healthcare analytics downside floor for slower-growth software-enablement assets.
    - Provider analytics business with different customer set and lower growth.
  - - Evolent Health
    - Market cap / TTM revenue
    - ~0.2x revenue
    - Another public care-enablement floor showing how low services-heavy healthcare platforms can trade.
    - Services mix and payer/provider economics differ substantially from Garner’s product model.
  notes: The comp set is intentionally mixed because no single public company perfectly matches Garner’s employer navigation, incentives, provider analytics, and AI tooling blend.
  enumerationScope:
