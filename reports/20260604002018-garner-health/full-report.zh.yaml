        title: 资本形成与战略股东
        blocks:
          - type: paragraph
            body: >-
              Garner 的融资轨迹已经足够清楚，可以看到规模的大幅跃迁，尽管累计资本仍只能部分核对。第三方 2026 年回顾显示，公司在 2021 年 $45 million Series B 之前有种子轮和 Series
              A，随后在 2026 年 2 月以 $1.35 billion 估值完成 $118 million Series D，仅数月后又以 $2.74 billion 估值完成 $100 million Series
              E。投资人组合值得注意，因为它把传统软件风投和医疗战略方混在一起。Optum Ventures 于 2021 年进入，Kaiser Permanente Ventures
              出现在后续多轮和其投资组合页面上，Mercy 既是投资人，也是医疗服务提供方用户。这一组合说明，Garner 不再只是一个福利创业公司的叙事；它越来越被当作连接雇主、医疗服务提供方和表现数据的基础设施来承销。
