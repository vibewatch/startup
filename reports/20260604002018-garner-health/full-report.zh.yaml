        - 导航资产 $621M 收购，约 1.4x 收入
        - 在健康福利导航和面向雇主的支持服务里，是已抓取最接近的 M&A 可比。
        - 这是承压公开卖方和战略私有化交易，不是健康 IPO 质量资产的溢价倍数。
