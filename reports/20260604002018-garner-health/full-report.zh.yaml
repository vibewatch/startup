  - id: TV006
    title: 估值桥 / 投资论点破裂触发表
    columns:
      - 触发项
      - 阈值或证据
      - 对投资论点的传导
      - 行动含义
    rows:
      - - Gross ARR 无法干净桥接到经审计净收入
        - 财务资料室显示重大净额 / 总额调整，或大量报销转付。
        - 相比公开净收入可比，公司当前 13.7x 表观倍数被高估。
        - 先用更低有效收入基数重新承保，再考虑新资金。
      - - 增长放缓快于溢价情景假设
        - 在利润率质量显现之前，前瞻增长就显著低于当前 >100% 或强增长叙事。
        - 公司不再像溢价增长离群值，而开始像高质量但普通的平台。
        - 把立场从偏紧调到昂贵，并收紧可接受入场价。
      - - 公开市场倍数区间持续受压
        - 类似 Hinge 的公司未能扩张，而下行可比仍停留在 ~0.2x 到 1.4x 之间。
        - 公开退出窗口无法验证当前私募溢价。
        - 假设基准情景倍数更接近高个位数，而不是低十位数。
      - - 要约或优先权条款对投资者不友好
        - Series E 或要约文件显示优厚优先权、老股转让占比过高，或经济性不利于新的普通股等效持有人。
        - 表观估值夸大了新资金真正买到的东西。
        - 暂停投资工作，直到能透明建模股权结构表。
      - - 留存和集中度不达预期
        - 队列、经纪、支付方或雇主集中度高于预期，或续约质量偏弱。
        - 收入耐久性低于溢价倍数所要求的水平。
        - 将承保视角转向下行交易可比。
    notes: 这些是投资论点破裂触发项，不是泛泛风险；每一项都会直接伤害支撑 Series E 价格所需的假设。
