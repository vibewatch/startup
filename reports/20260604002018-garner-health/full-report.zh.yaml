        title: 成员、医疗服务提供方与买方面
        blocks:
          - type: paragraph
            body: >-
              Garner 最好被理解为工作流产品，而不只是价格透明度小工具。对成员而言，实时表面是 Garner 网页 / 移动体验，加上 Garner Assistant 和 Concierge
              团队：用户按症状、专科或医生姓名搜索，看到网络内 Top Providers
              及预约可得性，把获认可医生加入护理团队，并在就诊后获得符合条件自付费用的报销。对雇主和健康计划而言，产品被有意作为叠加层销售，而不是替代网络。Garner
              称，它可以架在现有计划、保险公司和医生网络之上，同时把推荐与雇主出资的 HRA 或激励账户配在一起。对医疗服务提供方和导航员而言，DataPro 通过
              API、现成界面和定制分析，把同一套排名引擎延伸到转诊工作流。三个表面共同的设计选择，是靠指引加钱来改变行为，而不是简单发布一个评分。
