      - number: '2.2'
        title: 规模测算视角与相关支出池
        blocks:
          - type: paragraph
            body: >-
              市场无疑很大，但公开证据无法支持一个干净的独立导航 TAM。最强的自上而下视角，是雇主赞助保障本身：KFF 称 154 million 非老年人获得覆盖，2025 年平均保费为单人 $9,325、家庭
              $26,993，且 67% 的受保员工已经在自筹资金计划里，雇主直接承担理赔风险。Mercer 补充了计划赞助方成本视角：雇主赞助保障在 2025 年达到每名员工 $17,496，即便采取缓解措施，2026
              年也可能超过 $18,500。CMS 和 Peterson-KFF Health System Tracker 提供了更宽的支付方背景，预计 2025 年全国医疗支出为 $5.6
              trillion，商业保险仍会增长，即便 2026 年增速放缓。这些就是 Garner 和同类公司试图影响的支出池。因此，务实的可服务市场视角是自筹资金雇主覆盖人数，而不是一个独立软件品类。将 KFF
              的自筹资金占比套到雇主赞助覆盖人群上，得到一个大致约 103 million 人的自筹资金机会。以此为背景，Garner 报告覆盖超过 2.5 million
              人，意味着渗透率仍是低个位数。结论不是终端市场小；而是 TAM 精度弱于需求端压力。
