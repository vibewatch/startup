            body: >-
              Garner 的公开客户足迹最好读成一个区间，而不是单一不变数字。Fierce Healthcare 在 2026 年 2 月的独立报道称，Garner 服务 700 家机构，覆盖 2.5 million
              名成员；2026 年 5 月经新闻稿分发的融资材料及 Yahoo Finance 镜像则称，公司与近 800 个客户和超过 2.5 million
              人合作。这看起来是短时间内快速增长，而不是矛盾；但确切分母仍重要，因为公司在客户、客户方、雇主和合作伙伴之间切换用词。买方组合不只是自保 HR 团队。Garner
              的解决方案页面明确面向雇主、顾问、健康计划和医疗服务提供方，案例研究记录也显示，自筹资金和全保雇主都把产品作为现有网络上的叠加层来使用。公开证据还支持一个分层的买方—用户—支付方模型：雇主和健康计划付款，顾问和经纪人分销，医疗服务组织使用转诊分析，成员是以行为驱动节省的终端用户。仍未披露的是确切垂直行业拆分、支付方
              / TPA 数量、企业与中端市场组合，以及接近 800 这个口径里有多少是真正付费雇主，而不是渠道或战略合作伙伴。
