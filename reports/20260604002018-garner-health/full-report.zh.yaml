      - number: '7.3'
        title: 运营风险落在数据质量、报销执行和成员信任上，而不只是传统软件在线率
        blocks:
          - type: paragraph
            body: >-
              Garner 给成员的承诺听起来很简单：找到合适的网内医生，获得排期和账单帮助，并拿到报销支持。但这项承诺依赖一条脆弱的运营链。CMS 的历史回顾、LexisNexis 的 2025 年调查和 KFF
              的网络充足性分析都强化了一点：医生目录数据经常错误、过期或难以使用。Garner
              事实上也承认这个风险，因为它称价值驱动设计只有在成员能找到正确电话号码和医生可约时间时才有效，也把每日摄取数据加人工核验描述为缓释手段。问题在于，公开的缓释措辞不等于公开的错误率证据。Garner
              还要求成员信任其报销文件处理和礼宾式支持，而应用商店描述也把账单与文书帮助作为核心工作流功能。评价渠道噪声很大，但方向上有参考价值：App Store 看起来健康，而 Birdeye、JustUseApp
              和一条负面 SHRM 评价都指向无法轻易排除的信任和执行担忧。因此，运营尽调要回答的问题是：Garner 内部的错配、投诉、周转和例外指标，是否比这些公开代理信号干净得多。
