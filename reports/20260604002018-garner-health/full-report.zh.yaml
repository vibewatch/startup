          detail: Series D 称同比增长 >130%；Series E 披露总 ARR 约 $200M，此前 5 年持续翻倍。
          tone: positive
        - id: runway
          label: 渗透空间
          detail: 覆盖人群超过 2.5M，但按宽口径自保雇主视角看，仍只相当于约 2.4%。
          tone: positive
        - id: price
          label: 当前 13.7x 倍数
          detail: Series E 标记已经把 Garner 的定价抬到本章抓取到的所有公开可比公司和交易可比之上。
          tone: warning
        - id: disclosure
          label: 披露缺口
          detail: 公开来源没有把总 ARR 接到经审计净收入，也没有披露优先股堆叠。
          tone: warning
        - id: decision
          label: 继续研究
          detail: 保持紧密跟踪，但在承销新资金前，需要更强证据或更好价格。
          tone: neutral
      edges:
        - from: growth
          to: price
        - from: runway
          to: price
        - from: price
          to: decision
        - from: disclosure
          to: decision
    approximationNotes: null
    claimRefs:
      - CV003
      - CV013
      - CV015
      - CV044
      - CV052
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 只有 Garner 继续增长，并撑住两位数溢价倍数，当前标记才显得舒服。
    data:
      items:
        - label: 6x 倍数所需收入
          value: 456.7
          detail: 在成熟高质量公开公司倍数下，支撑 $2.74B 所需收入，单位为 USD 百万美元。
          tone: negative
        - label: 8x 倍数所需收入
          value: 342.5
          detail: 在强公开可比公司倍数下，支撑 $2.74B 所需收入，单位为 USD 百万美元。
          tone: warning
        - label: 10x 倍数所需收入
          value: 274
          detail: 在溢价公开可比公司倍数下，支撑 $2.74B 所需收入，单位为 USD 百万美元。
          tone: warning
        - label: 当前披露总 ARR
          value: 200
          detail: Series E 新闻稿给出的 2026 年 5 月总 ARR 近似值。
          tone: positive
    approximationNotes: 阈值只是用当前轮次标记做出的估值—收入简单桥接，不是 DCF 输出。
    claimRefs:
      - CV003
      - CV014
      - CV015
      - CV048
      - CV049
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持很宽的估值分布，因为倍数选择几乎和收入增长一样重要。
    data:
      items:
        - label: 悲观情景
          low: 1
          mid: 1.2
          high: 1.4
          displayValue: $1.0B-$1.4B
          detail: 收入达到约 $240M，交易倍数为 4x-6x。
          tone: negative
        - label: 基准情景
          low: 2.4
          mid: 2.7
          high: 3
          displayValue: $2.4B-$3.0B
          detail: 收入达到约 $320M，交易倍数为 7.5x-9.5x。
          tone: warning
        - label: 乐观情景
          low: 4.6
          mid: 5
          high: 5.5
          displayValue: $4.6B-$5.5B
          detail: 收入达到约 $420M，仍享有 11x-13x 溢价。
          tone: positive
    approximationNotes: 这些区间是供投资讨论的情景化估值输出，未纳入未知的优先股经济条款。
    claimRefs:
      - CV047
      - CV048
      - CV049
      - CV050
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Garner 在市场拉力和牵引力上得分不错，但披露质量和当前估值支撑明显弱得多。
    data:
      items:
        - label: 市场需求
          score: 9
          detail: 雇主医疗成本痛点和医疗服务方质量不透明仍然巨大且长期存在。
          tone: positive
        - label: 牵引力 / 采用
          score: 8
          detail: 近 800 家组织和 >2.5M 覆盖人群是真实规模信号。
          tone: positive
        - label: 增长质量
          score: 8
          detail: '>130% 增长和 Series E 时约 $200M 总 ARR，强度异乎寻常。'
          tone: positive
        - label: 渗透空间
          score: 8
          detail: ~2.4% 的宽口径自保雇主渗透率，留下有意义的扩张空间。
          tone: positive
        - label: 经济性可见度
          score: 4
          detail: 公开证据尚未把总 ARR 接到经审计净收入或利润率。
          tone: warning
        - label: 估值支撑
          score: 4
          detail: 当前倍数高于抓取到的所有公开公司和交易可比。
          tone: warning
        - label: 证据质量
          score: 5
          detail: 足以积极跟踪，但不足以轻松承销。
          tone: neutral
    approximationNotes: 分数是 0-10 的序位判断，综合抓取到的公开证据，用于投委会讨论。
    claimRefs:
      - CV013
      - CV015
      - CV041
      - CV042
      - CV044
      - CV052
      - CV053
