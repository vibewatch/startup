companyProfile:
  summary: >-
    Garner Health 是一家总部位于纽约、由创始人领导的医疗导航公司，Nick Reber 于 2019
    年创立。公开证据显示，它有两层业务表面：一层是雇主赞助的叠加福利，把成员导向网络内高表现医生，并报销符合条件的自付费用；另一层是 Garner DataPro，面向医疗服务提供方、保险公司和价值医疗转诊分析。到 2026 年 5
    月，Garner 称其拥有近 800 个客户或合作伙伴，服务超过 2.5 million 人，达到约 $200 million 总 ARR，并以 $2.74 billion 估值完成 $100 million Series
    E。公司已具备相当规模，也获得战略验证，但仍是私营企业，经审计财务、收入质量和资本结构的公开披露都很薄。
  foundedDate: '2019-01-01'
  founders:
    - name: Nick Reber
      role: 创始人兼 CEO
      background: 创始人与市场的匹配，来自他多次背部手术的个人经历，以及此前在 Bridgewater Associates 和 Oscar Health 的工作。
      claimRefs:
        - CO018
        - CO019
  foundingLocation: New York, New York, United States
  headquarters: New York, New York, United States
  productSummary: >-
    Garner 销售一种叠加式医疗导航福利，搭在现有健康计划之上，帮助成员找到 Top Providers，并在使用这些医生时报销符合条件的自付费用。平台还包含 Garner Assistant 和礼宾支持来承接成员流程；Garner
    DataPro 则把同一套医生表现引擎延伸到转诊、健康计划和医疗服务提供方分析场景。
  customerFocus: 自保和全保雇主、顾问和经纪人、健康计划、医疗服务组织以及价值医疗参与方；员工、家属和患者是终端用户，他们的行为改变驱动节省。
  businessModel: 公开证据支持一种由雇主付费的叠加模式，合同经济性按每名员工每月计费，雇主出资提供激励或 HRA 式报销，并通过 DataPro 形成新兴的医生分析或转诊数据收入面。
