      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛
        - 收入放大到约 $420M，渗透率显著高于今天按广义自保口径计算的 2.4%，投资者仍愿为品类领导地位支付 11x-13x。
        - 隐含价值 $4.6B-$5.5B，或相对当前轮有显著上行。
        - 需要耐久增长、更干净的会计披露，以及类似 Hinge 的质量信号，而不是泛数字医疗可比。
        - 低-中
      - - 基准
        - 收入达到约 $320M，增长仍健康但放缓，市场像给优质公开可比那样，以 7.5x-9.5x 给 Garner 定价。
        - 隐含价值 $2.4B-$3.0B，大致贴近当前标记，上行有限。
        - 即便执行扎实，也可能只是验证今天价格，而非超过它。
        - 中
      - - 熊
        - 收入只达到约 $240M，倍数压缩到 4x-6x，投资者把公司视为好平台，但不是稀缺定价的医疗平台。
