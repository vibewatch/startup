      - number: '6.5'
        title: 持续性和集中度披露不足，评价渠道也有分歧
        blocks:
          - type: paragraph
            body: >-
              客户尽调最大的风险不是 Garner 是否有牵引力，而是这种牵引力是否像头部数字暗示的那样持久且分散。抓取到的官方或独立来源都没有披露 NRR、GRR、logo
              流失、合同期限、队列续约率、经纪商集中度、头部客户集中度，或经验证的 Fortune 500 占比。因此，公开证据支持客户动能，但无法证明 SaaS 意义上的留存质量。公开负面记录也足够值得提及。Birdeye
              在 45 条评价中给出 2.2 星均分，并突出了一条近期投诉，质疑 Garner 的医生批准逻辑；JustUseApp 汇总 118 条用户评价，报告应用商店均分 3.6/5，但仍只给出 33.3/100
              的安全与合法性评分；SHRM
              的供应商评价页面则同时有一条高度正面的合作伙伴评价，以及另一条围绕合规、质量和数据管理的极端负面批评。这些渠道噪声很大，也不全是高质量尽调来源，但确实显示出外界对医生筛选一致性、信任和执行的怀疑。再加上公开年参与率仍只有
