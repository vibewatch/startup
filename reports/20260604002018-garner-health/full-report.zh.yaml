              公开证据指向中等切换成本，而不是硬锁定。多数供应商叠加在现有计划之上，所以雇主采用或替换导航时，通常不是拆掉核心保险。这降低了迁移的绝对门槛。但实施仍然重要，因为数据馈送、供应商连接、成员沟通、支持人员配置，以及药房或奖励工作流，都必须重新配置。竞争对手把交接容易作为卖点，本身就说明买方担心转换摩擦。多宿主在结构上也很常见：雇主可以保留保险公司，增加导航，保留点状方案，并配上
              PBM 或专科项目。对 Garner
              而言，这意味着护城河耐久性不能依赖自己是栈里唯一表面。更耐久的护城河主张，是医生质量测量、转诊逻辑、报销经济性，以及雇主相信导流确实在改善护理。如果更广的平台或保险公司能够复制这些能力，并把它们捆进更宽生态，Garner
