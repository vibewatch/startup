            body: >-
              Garner 在公开材料中有意把实施故事讲成低摩擦。雇主和 FAQ 页面称，上线通常需要 60 到 90 天，只需要资格或注册文件加保险公司理赔数据，并可与主要保险公司、TPA、HRIS
              平台，以及全保和自筹资金计划设计配合。健康计划页面补充说，产品可以支持更丰富的福利设计，包括首美元选项，而无需改变计划备案或医生合同。这很重要，因为商业主张依赖叠加在现有基础设施之上，而不是替换基础设施。实际依赖因此集中在干净的资格数据馈送、及时理赔接入、准确的医生目录刷新、报销规则配置，以及开放注册或年中上线时的成员沟通。Marathon
              Health 的合作伙伴证据显示，同一架构可以延伸到转诊支持：导航员可以在现有护理协调工作流中使用
              DataPro，而不是从零重建。依赖图有吸引力，但它仍依赖第三方数据权利，以及持续的支付方或保险公司配合；公开材料没有充分记录这些。
