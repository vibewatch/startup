            body: >-
              读懂 Garner 最简单的方法，是把它看作一家渗透率仍早、却已被重定价成后期确定性资产的公司。2026 年 2 月 Series D 将公司估值定在 $1.35B，2026 年 5 月 Series E 推到
              $2.74B，约一个季度内上调约 103%。但同一组公开证据也显示，Garner 覆盖人数仍只有约 250 万。这个数字本身不小，但放到广义自保雇主机会里就早了。KFF 的 2025 年雇主调查支持一个粗略的
              1.03 亿自保人群视角，也就是说 Garner 只触达这个广义池子的约 2.4%。换句话说，跑道论证是真实的。但承销纪律问题同样真实：公司按 gross ARR
              被估值，在可服务雇主基数中的份额仍小，也没有公开桥接 gross ARR 到经审计净收入。当前价格因此嵌入了持续渗透扩张，而不只是变现今天的足迹。
