      - number: '4.5'
        title: 反向证据与承销结论
        blocks:
          - type: paragraph
            body: >-
              本章的反向证据不是 Garner 缺少需求，而是公开证据集仍过于选择性，无法支持一份干净的后期私营公司承销。Birdeye 投诉和 Forbes
              报道都显示，部分成员认为医生逻辑受限或不一致；这很重要，因为收入模式依赖行为改变和信任。更重要的是，公开可比公司提醒投资人，不能假设收入规模本身就保证利润率耐久性。Accolade 在 $414 million
              收入上亏损约 $100 million，随后以约 1.5x 过去收入倍数出售私有化；这提醒人们，导航业务可以具备战略相关性，同时作为独立上市股票仍令人失望。Garner 自己 2026 年 5 月轮次隐含约
              13.7x ARR，远高于该下行情景可比。如果 DataPro
              扩大收入组合、自动化推动软件式利润率，这一溢价可能合理；但公开证据尚未证明任一点。因此，清晰结论是平衡的：经常性需求看起来真实，但盈利质量和现金耐久性仍未核实。
