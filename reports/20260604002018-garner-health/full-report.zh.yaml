  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现机制
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务证据显示，Garner 通过雇主付费叠加层变现，而不是保险风险、医生佣金或消费者订阅。官方 FAQ 和雇主页面一致描述了一种叠加在现有保险公司网络之上的福利，由雇主出资，并通过雇主出资的 HRA
              或激励账户加强；成员使用 Garner 指定医生时，这些账户报销自付费用。Forbes 给出了最清晰的全网公开合同信号：雇主按每名员工每月付费。这一点重要，因为即便 PEPM
              标价未披露，经常性收入模式仍然可读。同一组来源也支持第二个收入表面。Garner 2021 年 Series B 公告已经提到医生转诊产品线；后来 DataPro
              发布，显示质量引擎正在打包给医疗服务组织、保险公司和价值医疗参与方。开放问题不是 Garner 有没有经常性收入，而是报告收入里有多少是高毛利软件，又有多少连着报销经济性和服务管理。
