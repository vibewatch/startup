        title: 理赔数据护城河、排名引擎与 DataPro 架构
        blocks:
          - type: paragraph
            body: >-
              最强的产品差异化主张，是 Garner 的数据基础。在当前官方页面中，公司描述了一套覆盖超过 60 billion 份医疗记录、约 320 million 名患者的数据集，包含跨 80-plus 专科的
              550-plus 个专科特定指标；当前营销材料有时写成 82 个亚专科。公开材料称，排名引擎融合去标识化理赔、医院和健康计划透明度数据、公开医生信息，以及持续刷新的目录信号。Garner 还称，它用 AI
              和人工核验来提升电话、地址和预约可得性准确度，然后在 DataPro 内用于转诊、在成员产品内用于 Top Provider 推荐的，是同一套底层引擎。公开 API 文档很薄但有意义：它显示医生级评分、NPI
              字段、地点、网络参与情况和 Top Provider 标记，意味着这是一项可实时嵌入的推荐服务，而不是静态表格导出。仍不透明的是，这些评分背后的确切风险调整逻辑、权重、刷新节奏和医生申诉流程。
