  - id: TM004
    title: 增长驱动因素与制约因素表
    columns:
      - 因素
      - 类型
      - 时间
      - 证据
      - 市场含义
      - 尽调问题
    rows:
      - - 雇主医疗通胀仍高
        - 驱动因素
        - 当前至 2026 年
        - Mercer、BGH、PwC、Milliman、McKinsey 均显示高个位数压力
        - 节省导向的导航和导流需求更急迫
        - 检验 Garner 的节省能否在首年实施后延续
      - - 员工成本负担已很重
        - 驱动因素
        - 当前
        - KFF 显示保费分摊和 $1,886 平均免赔额；McKinsey 认为成本分摊已触顶
        - 支持不再转嫁成本、直接降低支出的方案
        - 衡量 Garner 是否降低员工实际摩擦，而不只是理赔成本
      - - 自筹资金雇主敞口
        - 驱动因素
        - 结构性
        - KFF 称 67% 的参保员工在自筹资金计划中
        - 直接承担理赔风险，让买方看得清 ROI
        - 按自筹资金与全额保险渠道组合拆分 Garner 客户
      - - 医疗提供方质量透明度需求
        - 驱动因素
        - 当前
        - BGH：82% 提到更高质量提供方导航，82% 提到质量透明度
        - 支撑提供方排名和转诊分析产品
        - 验证没有激励时，单靠质量数据能否改变转诊行为
      - - AI 赋能的导航和分析
        - 驱动因素
        - 当前 / 近期
        - Garner、Quantum、Aon、PwC 均把 AI 定位为增强导航或分析
        - 可能提升规模化能力、更新速度和个性化
        - 区分真实工作流收益与 AI 营销口径
      - - 价值医疗邻近市场
        - 驱动因素
        - 当前 / 中期
        - Garner DataPro 面向 VBC 参与方销售；BGH 强调整合式护理团队
        - 买方集合从单纯雇主福利扩展出去
        - 量化医疗提供方侧收入相对雇主福利的贡献
      - - 供应商整合 / 点状解决方案疲劳
        - 制约因素
        - 当前
        - Aon 和 BGH 称雇主在淘汰供应商并严审绩效
        - 缺少集成时，独立点状方案更难赢单
        - 评估 Garner 是直销落地、通过保险公司落地，还是靠打包策略落地
      - - 集成与变更管理摩擦
        - 制约因素
        - 当前
        - Quantum 和 Rightway 强调低干扰，以及与 TPA / 福利团队集成
        - 品类采用取决于能否嵌入既有计划运营
        - 梳理典型实施周期、理赔数据馈送和成员上线工作量
      - - 信任与替代临床医生的边界
        - 制约因素
        - 当前
        - PwC 称人们接受数字导航 / 行政协助，但不接受替代临床医生
        - 单靠 AI 讲不成充分采购理由
        - 核查 Garner 对每个覆盖人群保留多少人工支持
      - - 限制性网络观感
        - 制约因素
        - 当前
        - KFF 关于导流和窄网络的证据显示，节省与选择权存在取舍
        - 如果推荐显得不透明，成员可能抵触或误解导流
        - 测试投诉率、工会化或重视选择权人群的采用情况，以及沟通负担
    notes: 这里有意把驱动因素和制约因素放在一起：市场增长是真实的，但采用取决于信任、集成和证据。 这个品类不缺供给，卡点在执行。
