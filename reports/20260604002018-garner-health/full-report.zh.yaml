        - 验证经纪人把导医视为独立预算项，还是捆绑能力
    notes: 严重性反映的是 Garner 持久性的竞争风险，而不是威胁一定会成真。登记表有意混合直接同业、既有玩家和替代品风险，因为买方采购横跨这三类。
