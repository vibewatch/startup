      - number: '8.5'
        title: 最终尽调和退出准备度：公司可能长进价格，但公开证据集还达不到承销级
        blocks:
          - type: paragraph
            body: >-
              公开记录足以支持认真关注，但太薄，不足以支持不计价格的承销。Garner
              的质量主张得到客户规模、参与度和高增长的方向性强化，但缺失证据恰好落在后期估值风险最大的地方：经审计收入定义、利润率转换、留存质量、渠道集中度、股权结构优先权和 tender 经济性。Hinge 和
              Teladoc 具备上市公司级披露；Garner 还没有。这意味着最可支撑的流动性路径，是未来 IPO 或又一轮私募融资；前提是管理层提供一个财务资料室，把 gross ARR
              桥接到经审计净收入，并澄清证券经济性。在此之前，投资姿态应是有纪律的好奇。保持靠近，提前定义下行触发条件，并要求证据证明头部估值对新钱在经济上真实，而不只是能被增长叙事辩护。
