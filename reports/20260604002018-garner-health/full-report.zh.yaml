  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接导航同业构成最近的基准
        blocks:
          - type: paragraph
            body: >-
              Garner 并不是同所有数字医疗公司一视同仁竞争。最接近的待办任务对手，是那些向雇主销售一个成本降低、护理指引和福利支持前门，同时叠加足够临床或理赔智能来改变成员行为的供应商。Included
              Health、Quantum Health、Rightway，以及合并后的 Transcarent/Accolade
              平台，都比单病种供应商更符合这一描述。共同点是，它们都卖给自保雇主，并承诺降低成本、降低摩擦；但战略形态不同。Included 推动覆盖临床、财务和行政支持的一体化模式。Transcarent
              现在把倡导和初级保健，与 WayFinding、专科护理、药房和合作伙伴市场配在一起。Quantum 倚重既有信任、高接触协调和深度集成广度。Rightway 最明确地把导航与中立 PBM 结合。Garner
              的公开话术更窄：医生质量导流、报销激励和医生分析，而不是完整福利生态编排器。
