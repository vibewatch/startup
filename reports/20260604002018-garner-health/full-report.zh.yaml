            body: >-
              Garner 公开的单位经济故事在客户价值上有说服力，但在利润率质量上不完整。价值端很容易找到：公司和合作伙伴案例研究引用了 Aon 背书分析中医疗支出低 7.4%、金属制造商案例研究中 $116 PEPM
              节省，以及顾问案例研究中的两位数或更高理赔降幅。如果节省保持，这些数字支持买方愿意续约。更难的问题，是从该价值到毛利润之间究竟放着什么。Garner
              模型似乎需要理赔数据接入、实施帮助、成员参与支持、激励管理和报销工作流，因此即便有分析护城河，也不应按纯软件来承销。公开同业给出利润率边界。Accolade
              显示，重导航平台即使收入规模可观，仍可能亏钱；Hinge 则显示，更自动化的数字医疗平台可以达到 85% 毛利率和 26% non-GAAP 经营利润率。Teladoc 介于两端，EBITDA 和现金生成转正，但
              GAAP 仍亏损。因此，Garner 通向盈利的路径取决于自动化和会计处理，而不只是收入增长。
