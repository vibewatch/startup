      - number: '6.3'
        title: 成员经济性和 ROI 证据强，但采用并非普遍
        blocks:
          - type: paragraph
            body: >-
              Garner 的公开 ROI 叙事围绕三项反复出现的指标：计划支出下降、自付支出下降，以及作为一项导航福利少见的高使用率。官方雇主和顾问页面称，75% 的雇主在第一年把医疗成本趋势压低超过 5%，约 46%
              的符合条件成员每年使用 Garner，参与使用的员工自付费用约少 80%。Aon 支持的分析是这组材料中最正式的多雇主结果研究，报告称 2020 至 2024 年，Garner 覆盖成员的医疗支出低
              7.4%，PMPY 低 $345。案例研究进一步展示这些经济性如何落地：MarketStar 避免了预计 37% 的续约涨幅，MEC 将实际理赔 PEPM 降低 12% 并节省
              $736,000，Nightingale 将净已付理赔砍掉 13%，顾问主导的案例则提到两位数理赔下降、员工使用率 59% 至 81%，部分队列自付减免超过 90%。较新的产品主张也指向同一方向。Garner 的
              first-dollar HSA 设计声称总成本低 27%、参与度高 28%，Predictive Outreach 声称互动率是通用导航的 3 倍。不过，46%
              的年使用率意味着多数符合条件成员在某一年不会使用，因此这项福利显然改善行为，但没有消除激活摩擦。
