            - label: 目录或预约摩擦
              tone: risk
              detail: 电话、可约性或转诊数据出错，会员信任会很快被削弱。
            - label: 更宽平台挤压渠道
              tone: risk
              detail: 打包导航和多合作伙伴平台会削弱 Garner 的分销杠杆。
        - label: 中等可能性
          values:
            - label: 评论噪声混杂
              tone: neutral
              detail: 公开评论平台信号不一致，应持续监控，但不能过度解读。
            - label: AI 治理疑问
              tone: risk
              detail: 新的 AI 辅助工作流会抬高可解释性和监督预期。
            - label: 方法论不透明卡住采购
              tone: risk
              detail: 缺少审计或申诉细节，会拖慢销售或削弱雇主信心。
        - label: 低可能性
          values:
            - label: 已公开立案的重大执法
              tone: positive
              detail: 已审阅档案中未浮现当前重大案件。
            - label: 单一评论平台引发广泛流失
              tone: neutral
              detail: 没有运营证据印证时，噪声很大的评论网站本身不太可能打破投资逻辑。
