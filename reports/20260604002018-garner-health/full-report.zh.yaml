  - id: TV007
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 股权结构表和优先权
        - Series D 和 Series E 证券条款、清算顺位、参与权，以及任何反稀释调价或 MFN。
        - 没有瀑布分配背景，后期表观估值可能在经济上误导。
        - 法务资料室、融资文件和董事会批准的股权结构表导出。
      - - 收入定义
        - 从已披露 gross ARR 到经审计净收入的桥，包括报销流和任何总额计费转付。
        - 核心估值倍数取决于 $200M 这个数字在经济上是否可比于公开市场净收入指标。
        - 经审计财务报表、收入确认备忘录和 CFO 复核。
      - - 要约经济性
        - 规模、定价、买方结构，以及第二次要约与 Series E 轮主要融资的关系。
        - 老股流动性会影响价格发现和实际入场经济性。
        - 董事会材料和要约交割备忘录。
      - - 留存与集中度
        - NRR、GRR、客户数流失率、合同期限、头部客户占比、经纪商集中度，以及支付方或服务方 渠道组合。
        - 溢价倍数需要经久且分散的经常性收入支撑。
        - 队列看板和集中度明细表。
      - - 单位经济性与利润率结构
        - 按产品拆分毛利率、贡献毛利、实施成本结构、CAC 回本周期和支持强度。
        - 公开可比公司定价看经济质量，不只看收入增长。
        - 财务 KPI 包和经营复盘。
      - - IPO 准备度
        - 经审计报表、治理文件包、季度结账纪律和上市公司报告准备度。
        - 最可能验证溢价的路径，是后续 IPO 或带有上市公司级披露的后期融资。
        - CFO、审计师和外部法律顾问准备计划。
