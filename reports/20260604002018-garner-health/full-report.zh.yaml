  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序：结构性信任与治理风险目前高于已披露诉讼
        blocks:
          - type: paragraph
            body: >-
              在已抓取的档案中，Garner 看起来没有重大公开诉讼、OCR 行动、FTC 案件或泄露通知悬在头上，因此风险叙事不是已经爆雷的法律事件。更实质的问题是结构性风险。Garner
              要求雇主和成员信任一个推荐引擎；这个引擎把理赔数据、透明度文件、医生记录、评价信号、排期逻辑和报销管理放在同一条工作流里。任何一层出错或解释不清，问题都不会局部化。它可能演变成成员困惑、导流变弱、续约时买方怀疑加重，以及面对更宽的导航平台时渠道杠杆下降。因此，本章把隐私和供应商治理、方法可解释性、目录准确性、商业持续性排在纯诉讼风险前面。公开记录在产品野心和市场需求上方向很强，但在可审计性、集中度和续约质量上仍然偏薄。只有尽调证明其控制栈强于当前公开披露包，Garner
              才具备可投资性。
