      - number: '1.5'
        title: 反向信号、不一致与待尽调事项
        blocks:
          - type: paragraph
            body: >-
              公司概况里最重要的风险并非生死级红旗，但足够重要，需要先保留下来，避免后续章节过度确定。第一，存在反向用户反馈：抓取到的 Birdeye 页面显示综合评分偏低，且近期有投诉称 Garner
              的认可医生逻辑会让人觉得不一致；Forbes 也另行提到网上投诉，认为网络可能过于受限。第二，公司部分指标需要严格限定范围。Garner
              发布的指标口径在来源之间会变，客户总数随日期快速移动，最好的公开员工数证据已经过时。第三，治理和资本核对仍不完整。本章可以支持 Garner
              规模大、资金充足、得到战略验证，但还不能支持精确董事会图、最新员工数，或能清晰拆分新股融资与要约活动的累计资本总额。
