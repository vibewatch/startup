            body: >-
              上市和交易可比不能给出一个干净答案，但能画出估值区间。Hinge Health 是这组中最积极的上市基准：约 7.8x 往绩收入，增长 47%，毛利率 85%，经营杠杆扩大。Doximity 约
              6.1x，展示了高质量、网络驱动型医疗软件资产在公开市场可获得的定价。Teladoc、Health Catalyst 和 Evolent 低得多，分别约 0.5x、0.3x 和 0.2x；Accolade /
              Transcarent 收购落在约 1.4x 收入。Garner 的 13.7x 因此高于这里抓取到的所有上市或交易基准。这并不证明本轮错误，因为 Garner
              仍是未上市公司，增长也远快于下行情景组。但它意味着举证责任不对称：投资人需要证据证明 Garner 甚至值得相对 Hinge 溢价，而不只是相对承压数字健康可比公司溢价。
