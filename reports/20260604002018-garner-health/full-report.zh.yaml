  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >-
              Garner 卖的不是完整健康计划，也不是泛数字医疗套件。最有证据支撑的市场边界更窄：雇主赞助的医疗导航、医生质量分析，以及叠加在现有医疗保障上的激励式导流。KFF
              调查显示，雇主已经使用高表现、分层和窄网络设计，把使用量导向性价比更高的医疗服务提供方；Included Health、Quantum、Rightway 和 Accolade
              等同类品类页面，也一致把导航定义为医疗、财务和行政问题、医生搜索、理赔帮助和护理指引的前门。Garner 通过 DataPro
              把品类再往前推一步，将医生质量测量变成面向医疗服务组织、保险公司、福利项目和价值医疗参与方的转诊分析产品。因此，纳入支出包括导航工作流、账单和理赔指引、医生选择和转诊分析、质量透明度以及激励管理；排除支出包括核心保险承保、直接理赔支付、PBM
              经济性和独立护理交付。这个边界很重要，因为 Garner 搭的是雇主医疗支出的经济性，但只在决策和工作流层捕获价值。
