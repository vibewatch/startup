  - id: TP001
    title: 竞争对手画像表
    columns:
      - 供应商 / 替代方案
      - 类别
      - 公开规模 / 融资背景
      - 目标买方 / 细分市场
      - 产品范围
      - 主要差异化
      - 相对 Garner 视角的局限
    rows:
      - - Garner Health
        - 直接同行
        - 私营；2026 年披露 Series E 轮估值 $2.74B
        - 自筹资金雇主；正在扩展医疗提供方侧分析用户
        - 医疗提供方质量导流、报销激励、DataPro 转诊分析
        - 围绕医生选择和激励设计切入，经济楔子清晰
        - 前端入口范围更窄，渠道势能也不如更宽的平台明显
      - - Included Health
        - 直接同行
        - 大型私营平台；当前官网对公开规模细节披露较选择性
        - 大型雇主、支付方、公共部门买方
        - 虚拟医疗、导航、倡导、福利和行政支持
        - 全人 AI+EQ 模型，加上 2026 年产品仍在积极扩张
        - 针对医生导流的报销经济性，公开证据不如 Garner 明确
      - - Transcarent + Accolade
        - 直接同行
        - 2025 年合并后 >20M 成员、>1,700 个雇主 / 健康计划客户
        - 自筹资金雇主和健康计划
        - WayFinding、专科护理、药房、倡导、专家意见、初级保健、合作伙伴市场
        - 同行中最宽的整合导航栈
        - 产品宽度会把采购变成更大的平台决策，而不是单一导流附加模块
      - - Quantum Health
        - 直接同行 / 既有厂商
        - 品类深耕 25+ 年；公开声称服务 500+ 雇主、完成 850+ 集成
        - 希望在既有计划上叠加高触达导航的雇主
        - 导航、护理协调、分析、点状方案编排
        - 既有厂商信任、集成深度和雇主熟悉度
        - 公开提供方排名切入点不如 Garner 鲜明
      - - Rightway
        - 直接同行
        - 私营；2025 年新闻稿称覆盖 3M+ 成员、客户留存率 >97%
        - 需要导航叠加 PBM 节省的雇主
        - 护理导航、账单解决、PBM、药房导航
        - 透明收费经济性，以及药剂师主导的 PBM 集成
        - 相比医疗提供方质量，更以药房为中心
      - - Evernorth Benefits Navigation
        - 保险公司系既有厂商
        - The Cigna Group 旗下规模化健康服务平台
        - 雇主、工会、政府实体、健康计划生态
        - 供应商中立导航、奖励、Care Guides、报告、联动的护理 / 药房资产
        - 既有保险公司与福利分销渠道，加上宽服务栈
        - 如果雇主想要叠加型专门厂商，保险公司绑定模式可能显得差异化不足
      - - apree / Castlight
        - 传统既有厂商 / 整合型替代方案
        - 私营整合型导航 + 初级保健平台；Castlight 仍是活跃品牌
        - 寻求打包导航和初级保健的雇主与成员
        - 导航 App、Care Guides、初级和预防护理、绩效保证
        - 传统数据资产，以及愿意共担风险
        - 传统品牌定位说明导航可以被折进更宽的服务包
      - - Hinge Health
        - 邻近替代方案
        - 上市公司，2026 年收入指引为 $801M
        - 采购 MSK 方案的雇主和健康计划
        - MSK 护理、物理治疗（PT）、专科医生、病种指导
        - ROI 量化强，且有公开市场可信度
        - 不能完整替代福利导航
      - - Spring Health
        - 邻近替代方案
        - 私营；官方雇主页面称全球覆盖 >20M 人
        - 采购行为健康入口和 EAP 替代方案的雇主
        - 心理健康匹配、治疗、精神科、雇主分析
        - 病种品类归属清晰，访问速度快
        - 是预算竞争者，不是宽医疗导航
      - - Sword Health
        - 邻近替代方案
        - 私营；2025 年披露以 $4B 估值融资 $40M
        - 采购 AI 主导专科护理的雇主和健康计划
        - 覆盖 MSK、女性健康、心理健康和心代谢护理的 AI 护理
        - ROI 叙事强，护理覆盖面在扩展
        - 相对端到端导航，仍由病种牵引
      - - 自助导航 / 内部自建
        - 现状替代方案
        - 不需要风投式规模化，但隐性人力负担高
        - HR 团队、保险公司门户、既有供应商栈
        - 员工自行穿梭于碎片化工具；雇主手工协调供应商
        - 不需要新签供应商合同
        - 复杂、信任低、编排差，正是竞争对手利用的痛点
    notes: 各行比较雇主解决 Garner 这项任务的主要方式，包括直接同行、既有厂商、邻近替代方案和现状方案。 私营公司的确切规模只在当前公开证据支持时列出；否则单元格保持定性。
