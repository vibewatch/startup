      - number: '7.4'
        title: 渠道、竞争和商业持续性风险可能和核心科学同样重要
        blocks:
          - type: paragraph
            body: >-
              即使 Garner 的医生排名引擎运行良好，公司仍要在一个雇主医疗成本快速上升、竞争性导航平台不断拓宽范围的市场里赢单。Mercer 和 Business Group on Health
              很清楚地展示了经济紧迫性，但紧迫性上升并不保证采用速度变快；它常常带来更严苛的采购和续约审查。Aon 的趋势说明还显示，雇主正在用激励、导航方案和更严格的供应商管理来应对，这意味着 Garner
              面对的是一群正在主动精简供应商栈的买方。与此同时，Evernorth、Quantum、Included Health 和 Transcarent 都在营销更宽的导航或一体化方案，Mordor
              也明确描述了雇主整合碎片化点解决方案、以及支付方主导的数字前门。Garner 自己的公开数据没有闭合商业风险回路，因为抓取材料没有披露 NRR、GRR、合同期限，或按雇主、经纪商、承运人、TPA
              拆分的集中度。这留下了一个清晰的承销缺口：Garner 可能在医生质量分析上有差异化，但投资人仍需要私下证据，证明业务能够续约、经由中介渠道扩张，并避免变成别人前门里的一个功能。
