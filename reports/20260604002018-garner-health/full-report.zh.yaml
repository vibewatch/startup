              作为一家私营导航公司，Garner 的公开牵引力看起来很强，但最有用的承销信号，不是某一个 SaaS 指标，而是收入、客户数、实施摩擦和渠道杠杆的组合。到 2026 年 2 月，独立报道称 Garner 拥有约
              700 家机构和 2.5 million 覆盖成员；到 2026 年 5 月，公司称接近 800 家机构，总 ARR 约 $200
              million。这些都是有意义的规模标记，尤其因为产品设计是搭在现有计划之上，而不是要求破坏性更换保险公司。Garner FAQ 称实施通常需要 60 到 90
              天，意味着部署速度快于替换网络或计划基础设施。经纪人证据也重要。HUB 案例研究显示，合作伙伴经济性可以支持增长：15 个共同客户、2024 年新增 11 个客户，客户了解产品后附加率达到
              35%。但需要保留一个但书：公开来源对节省和参与度披露远多于实际价格、留存或 CAC 回本周期。
