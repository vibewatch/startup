      - number: '2.4'
        title: 拉动品类需求的增长驱动
        blocks:
          - type: paragraph
            body: >-
              最重要的增长驱动很简单：雇主医疗成本压力很强，而且被广泛交叉印证。Mercer、Business Group on Health、PwC、Milliman、Aon 和 McKinsey 都描述了
              2025-2026 年成本通胀，区间仍显著高于舒适水平，即便采取缓解措施也是如此。KFF 补充说，员工已经承担了实质性保费缴费和免赔额暴露，单纯转移成本更难持续。McKinsey
              明确认为，员工成本分摊已经触及饱和，雇主正在寻找更好的计划设计、更高价值医疗服务提供方和更强成员体验。Business Group on Health
              显示，雇主对导向更高质量医生和质量数据透明度有强烈兴趣；Garner 的 DataPro 和 Research Agent 也说明医生质量分析与 AI 辅助指引正在汇合。PwC
              再加上一层消费者视角：人们越来越期待协调一致的数字体验，频繁使用健康科技，并希望系统更偏预防。合在一起，这些信号说明，即便没有被普遍接受的供应商 TAM
              数字，品类仍能增长。医疗支出上升、自保雇主压力、价值医疗、透明度需求和数字化预期，正在把市场向前拉。
