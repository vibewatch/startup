              对一家私营福利导航公司而言，Garner 拥有异常具体的公开客户证据，但深度不均。最干净的具名雇主案例是 MarketStar、Metal Exchange Corporation 和 Nightingale
              Education Group。三者都显示 Garner 叠加在现有计划之上，而不是替换保险公司；三者也都发布具体成本或自付费用结果。经纪人渠道证据更丰富：Alera、HUB、McGriff 和 USI
              各有专门的顾问故事页面，显示共同客户数、新客户新增，以及非营利医疗、建筑工程、制造、酒店、房地产、服装和其他雇主类型中的精选案例结果。大品牌标识证据更广但更浅。2026 年 5 月融资新闻稿提到 USA
              Today、Paylocity、University of Oklahoma 和 Archer-Daniels-Midland；Kleiner Perkins 则在客户群中突出 Kaiser、Volkswagen
              和 Advanced Auto Parts。这些名字是有用的可信度标记，但抓取集中只有 ADM 有引用过的使用场景叙事。正确解读是，Garner
              在雇主和经纪人渠道都有可信具名证据，但没有一份完全可审计的公开名单，能显示每个品牌标识的实际上线深度、合同状态或续约耐久性。
