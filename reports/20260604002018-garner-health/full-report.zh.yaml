  - id: TM003
    title: 细分市场 / 买方地图
    columns:
      - 细分市场
      - 经济买方
      - 用户
      - 支付方
      - 工作流 / 集成路径
      - 预算负责人
      - 采用触发因素
    rows:
      - - 大型自筹资金雇主
        - CHRO / 福利负责人，CFO 有影响力
        - 员工及家属
        - 雇主计划发起方
        - 覆盖在既有保险公司 / TPA 之上；面向成员上线；续约看节省证明
        - 福利预算 / 理赔风险负责人
        - 医疗费用趋势承压，需要可衡量的节省
      - - 通过保险公司或 TPA 触达的中型市场雇主
        - 经纪人、保险公司、TPA 或 HR 负责人
        - 员工及家属
        - 雇主，按保险公司定价项目付款
        - 通常嵌入或通过计划技术栈分发，而非从零替换
        - 福利预算，由顾问 / 保险公司共同影响
        - 需要改善体验，但不更换核心计划
