      - number: '7.2'
        title: 数据治理、方法黑箱和监管敞口是首要风险簇
        blocks:
          - type: paragraph
            body: >-
              Garner 的价值主张异常依赖敏感数据和难以审计的决策逻辑。公司称其处理与雇主相连的信息，可能受 HIPAA 和 HITECH
              约束；收集报销文件；从第三方和公开来源汇集医生信息；并使用第三方供应商处理服务互动。公司还称，排名引擎使用 500 多项指标、600
              亿份病历，并把本地同行纳入质量加成本比较。这些披露有帮助，但离买方或投资人真正想看的治理包仍差很远。公开页面没有发布完整指标权重、校准研究、外部审计或公开申诉机制。HHS 指引进一步抬高门槛，警告向追踪供应商披露
              PHI 可能未经授权，也显示不当披露和缺少保护措施仍是常见执法主题。Garner
              的条款还通过责任免责声明和仲裁条款把相当多责任转出公司；这可能降低直接法律敞口，但如果成员质疑结果，也会抬高信任摩擦。由于审查的公开档案中没有出现重大正式行动，正确结论不是“无风险”，而是 Garner
              最大的法律和监管风险来自结构性合规与可解释性，而非已经披露的诉讼。
