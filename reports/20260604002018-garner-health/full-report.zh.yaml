      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              主要经济买方是雇主福利职能，通常挂在 CHRO 或福利负责人预算下；理赔压力上升时，财务部门的影响力也越来越大。自保雇主最重要，因为它们会直接感受到理赔节省，但渠道图是多边的：保险公司和 TPA
              可以分销或嵌入导航，医疗服务组织可以购买转诊分析，或通过价值医疗项目使用。员工是日常用户，医疗服务提供方则是被导流和衡量的供给侧对象。Deloitte 称，雇主想要的解决方案要超越传统成本和网络设计；SHRM
              仍显示健康福利位于雇主优先级栈顶。Business Group on Health 和 Aon
              补充说，雇主评判的是供应商表现、质量结果和高价值护理路径，而不只是增加更多点状方案。因此，采用路径相对清楚：成本压力先制造关注；经纪人、保险公司和福利团队评估选项；实施必须适配既有保险公司或 TPA
              栈；上线随后取决于成员参与和医生信任；续约取决于能否证明节省和体验提升。能保留保险公司并减少扰动的供应商，有结构性优势。
