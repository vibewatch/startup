      - number: '4.4'
        title: 融资历史、资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Garner 的资本形成在顺序上清楚，但累计美元数无法完全核对。第三方和公司来源支持这样一条路径：2020 年种子轮，2021 年 2 月 Series A，2021 年底 $45 million Series
              B，同年金额未披露的 Optum 战略投资，随后跃升到 2026 年 2 月以 $1.35 billion 估值完成 $118 million Series D，并在 2026 年 5 月以 $2.74
              billion 估值完成 $100 million Series E。把已披露的种子轮、A、B、D、E 金额相加，约为 $280 million 新股融资；但 Optum
              金额未披露，意味着真实累计数字无法从公开证据精确钉住。资本充足性解读更模糊。Garner 的 Series E 新闻稿称，公司最近完成了第二次员工要约收购，这意味着 2026
              年资本活动既包括流动性，也包括增长投资。但审阅过的来源没有披露现金、烧钱速度、现金跑道、债务或契约。投资人能看到资本可得性，却仍看不到其背后的资产负债表耐久性。
