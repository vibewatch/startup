    rows:
      - - 医疗服务方质量测量具备差异化
        - 综合平台或保险公司可以加入就医引导功能，并与更广泛的照护和权益支持界面打包
        - 高
        - 一旦就医引导变成普通模块，Garner 会失去议价能力
        - 审计排名方法的持久性、数据刷新节奏，以及相较综合平台的可量化差异
      - - 报销激励会改变会员行为
        - 雇主或会员反弹可能把就医引导视为限制性安排，或认为行政流程复杂
        - 中
        - 只有会员信任并使用推荐，这个切入点才成立
        - 按雇主队列索取采纳、重复使用和投诉数据
      - - 直接叠加在雇主端，实施比替换医保计划更轻
        - Transcarent、Rightway 和 Evernorth 也都明确出售叠加在现有计划之上的简化方案
        - 中
        - 如果对手也承诺易启动，低实施门槛就不独特
        - 对比同业审查实施周期、文件依赖和上线服务人员需求
      - - DataPro 打开医疗服务方邻近业务
        - 医疗服务方分析还不是公开材料里的主要购买理由，医疗服务方准入护城河可能弱于雇主端护城河
        - 中
        - 邻近业务可以扩大 TAM，但前提是医疗服务方真的采用，而且粘性足够
        - 验证 DataPro 收入结构、附加率和续约行为
      - - 聚焦范围能让 ROI 叙事更干净
        - 供应商整合压力有利于偏好单一平台的买方和更宽生态
        - 高
        - 即使单个模块差异化较弱，综合平台也能赢下采购
        - 梳理顾问反馈，以及输给单一平台采购动作的交易
      - - 沟通和集成上线后，导医叠加层具备粘性
        - 多供应商并用很常见，雇主可在不更换底层保险公司的情况下替换叠加层
        - 中
        - 切换摩擦会拖慢流失，但不能消除流失
        - 索取流失原因、切换交易输赢分析，以及与既有保险公司工具的重叠情况
      - - 品类走弱可能因削弱对手而利好 Garner
        - Accolade 证明了相反情况：独立经济性弱，最后可能通过整合催生更强对手
        - 高
        - 板块反向证据仍可能抬高竞争门槛
        - 按季度跟踪 M&A，并将 Garner 的覆盖广度与合并后平台对标
      - - 传统导医显得老旧
        - Castlight 和 apree 表明，导医可以在更广的风险共担或初级医疗包中继续存在
