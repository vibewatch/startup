      - number: '8.4'
        title: 情景区间：当前价格大致贴近强基准情景，熊市情景则回落到 Series D 区间
        blocks:
          - type: paragraph
            body: >-
              正确的情景方法是收入倍数框架，而不是 DCF，因为公开证据在增长方向上强，在经审计利润率、现金生成和证券条款上弱。牛市情景中，Garner 可增长到约 $420M 收入，并仍获得 11x 至 13x
              的溢价倍数，对应约 $4.6B 至 $5.5B 价值。基准情景中，收入达到约 $320M，公开市场正常化把倍数压到 7.5x 至 9.5x，对应约 $2.4B 至 $3.0B。熊市情景中，收入只达到约
              $240M，而市场按接近 4x 至 6x 收入给公司定价，价值回落到约 $1.0B 至 $1.4B。这个分布解释了为什么本轮显得满：当前 $2.74B
              标记已经接近强基准情景；如果增长质量、会计质量或公开市场倍数令人失望，下行空间很大。
