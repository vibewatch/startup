  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：公司质地强，但当前轮次已定价大部分公开上行空间
        blocks:
          - type: paragraph
            body: >-
              从问题质量、增长和客户证明看，Garner 像是一家真实的后期赢家。2026 年 5 月的 Series E 轮把估值定在 $2.74B，基于已披露约 $200M 的 gross ARR，约
              13.7x；而公司几个月前才完成估值 $1.35B 的 Series D。这一估值并非无法辩护，因为公开证据还显示其覆盖超过 250 万人、近 800 家组织、连续五年以上翻倍，雇主 ROI
              主张方向上也很强。问题不是公司是否存在，而是价格。在今天的标记下，投资人已经在审计披露之前、也在公开市场证明其经济性更像 Hinge Health
              的高增长画像而非被压缩的数字健康和护理赋能组合之前付款。因此，当前判断应是继续研究：保持跟进，但不要把 Series E 价格当作随手可买的水平。
