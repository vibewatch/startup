      - number: '2.5'
        title: 约束、信任上限与证据缺口
        blocks:
          - type: paragraph
            body: >-
              这个品类也有真实的采用摩擦。雇主并不是在真空中采购；它们同时在整合供应商、要求 ROI 证明，并尽量避免再造一个割裂的成员体验。Aon 和 Business Group on Health
              都强调供应商评估和整合压力，这意味着导航供应商必须先证明集成能力和可衡量结果，才能在雇主基数里扩张。成员感知是另一道约束。KFF
              关于分层和窄网络的讨论显示，导流在经济上可以奏效，但如果成员觉得选择被减少、推荐不透明，也会显得受限。PwC 还给 AI
              划出信任边界：人们接受数字工具处理导航和行政协调，但不接受它替代临床医生。最后，主要分析缺口是 TAM
              精度。公开证据强力支持上游医疗支出巨大、自筹资金机会很大，但没有给出一个干净、独立的导航和医生质量分析供应商美元市场规模。对 Garner
              而言，关键投资问题因此不太是系统里有没有钱，而是公司能否把成本压力转化为可信、低摩擦的采用。
