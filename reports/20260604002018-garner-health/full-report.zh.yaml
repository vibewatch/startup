      - number: '6.4'
        title: 分销渠道不止直销雇主，还延伸到经纪商、健康计划和医疗服务方
        blocks:
          - type: paragraph
            body: >-
              Garner 不是只卖一个雇主导航 SKU。顾问材料显示，经纪商是重要获客渠道：Alera、HUB、McGriff 和 USI 都把 Garner 作为赢下续约、打开客户入口或拉开福利策略差异的工具；更早的 C2
              合作也证明它能借多家区域经纪机构做联盟式分销。健康计划和医疗服务方页面把模式又往外推了一层。Garner 称，健康计划无需重新备案或定制集成，就能把激励模型叠加到现有计划上；医疗服务方则可通过 DataPro
              使用 API、UI 和定制洞察工具。医疗服务方侧的证明已不再停留在理论上。Marathon 在雇主赞助的初级保健和转诊协调中使用 Garner 数据，Atlantic Health 称将同时用 Garner
              把雇主成员导向 Atlantic 医生，并为内部质量改进提供依据。DataPro 材料还称，保险承运人、福利项目和价值医疗参与方都可以使用该平台。地域和细分市场证据方向上支撑，但不完整：顾问故事提到 7 个
              Alera 市场、8 个 HUB 办公室、McGriff 与 USI 的多州合作，以及犹他、俄勒冈、伊利诺伊、田纳西和美国西部的客户案例；但抓取到的来源没有一个给出清晰的按州、按保险承运人或按雇主规模拆分。
