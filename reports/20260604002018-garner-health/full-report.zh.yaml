              Garner 的公开信任表面足以越过企业采购门槛，但不足以完全通过技术尽调。官方记录支持 SOC 2 Type II、HIPAA 商业伙伴定位、可选的 Plaid 连接报销流程、App Store
              隐私披露，以及强调安全、API 和 AI 系统的工程文化。它也支持 AI 至少用在四处：通过 Garner Assistant 做成员自助，通过 Research Agent
