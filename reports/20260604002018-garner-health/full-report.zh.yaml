    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与经济模式
        blocks:
          - type: paragraph
            body: >-
              Garner Health 把自己定位为医疗质量和导航平台，靠更好的信息和更好的激励来改变患者行为。官方产品栈有两个可见表面。第一，Garner 销售雇主赞助福利，叠加在现有健康计划之上，把成员导向 Top
              Providers，并在成员使用这些医生时报销大部分或全部自付费用。第二，Garner 通过 Garner DataPro
              扩展到面向医疗服务提供方的工作流，把转诊和表现分析打包给医疗服务组织及其他医疗中介。截至规范运行日期，公司应被视为一家成立于 2019 年的后期私营 Series E
              企业；纽约是公开证据最支持的运营基地，但抓取到的官方页面尚未把总部信息作为重点。它的核心经济主张是：选对医生，可以同时降低医疗支出和患者摩擦。
