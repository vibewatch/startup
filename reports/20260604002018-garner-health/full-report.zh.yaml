  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 方向
      - 什么会改变观点
    rows:
      - - 在雇主导航赛道，增长和客户牵引仍异常强。
        - 投资论点
        - 若经验证收入增长或会员扩张放缓，溢价逻辑会迅速变弱。
      - - 相对广阔的自保雇主机会，渗透仍在早期。
        - 投资论点
        - 如果公司无法以有吸引力的经济性突破约 2.5M 覆盖人群，跑道价值会下降。
      - - 雇主 ROI 和参与度主张显示，产品不只是商品化的医生查找工具。
        - 投资论点
        - 独立留存、队列经济性和续约数据会让该主张更具可投资性。
      - - 当前 13.7x gross-ARR 倍数已经高过所有已抓取的公开或交易可比公司。
        - 反论点
        - 经审计的收入质量和类似 Hinge 的利润率证据，可能证明支付高于公开市场的倍数是合理的。
      - - Gross ARR 和要约表述给表观估值留下经济含义上的模糊空间。
        - 反论点
        - 股权结构瀑布分配和经审计收入桥会显著降低不确定性。
      - - 导航资产收购下限约为 1.4x 收入，说明战略退出可能发生在远低于高溢价私募轮的标记上。
        - 反论点
        - 如果公司有耐久 IPO 路径，并具备公开市场质量的披露，M&A 下限类比的重要性会下降。
    notes: 该论点网格把公司质量和价格质量拆开；这正是后期私募轮的核心问题。
