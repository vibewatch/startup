- id: constraints-and-evidence-gaps
  title: Constraints, trust limits, and evidence gaps
  body: >-
    The category also carries real adoption friction. Employers are not shopping in a vacuum; they are simultaneously consolidating
    vendors, demanding ROI proof, and trying not to create yet another disconnected member experience. Aon and Business Group
    on Health both highlight vendor evaluation and consolidation pressure, which means navigation vendors must prove integration
    and measurable outcomes before they scale across an employer base. Member perception is another constraint. KFF's discussion
    of tiered and narrow networks shows that steerage can work economically, but it can also feel restrictive if members perceive
    reduced choice or opaque recommendations. PwC adds a trust boundary around AI: people are comfortable with digital tools
    handling navigation and administrative coordination, but not replacing clinicians. Finally, the main analytical gap is
    TAM precision. Public evidence strongly supports enormous upstream healthcare spending and a large self-funded opportunity,
    but it does not produce a clean, independent dollar market size for navigation and provider-quality-analytics vendors.
    For Garner, the key investment question is therefore less about whether money exists in the system and more about whether
    the company can convert cost pressure into trusted, low-friction adoption.
