callouts:
- calloutType: insight
  title: Practical TAM is self-funded employer lives, not a standalone software line item
  body: >-
    The strongest market-sizing conclusion is that Garner should be underwritten against the employer-sponsored financing
    pool and, more specifically, the self-funded employer segment where claims savings matter immediately. Public sources
    support a broad ~103 million-life self-funded lens and a >2.5 million-life current Garner footprint, but they do not support
    a clean third-party dollar TAM for navigation vendors.
  claimRefs:
  - CM001
  - CM005
  - CM046
  - CM047
  - CM048
- calloutType: strength
  title: 2026 cost pressure keeps buyer urgency elevated
  body: >-
    Cost-trend estimates from Mercer, Business Group on Health, PwC, Milliman, Aon, and McKinsey cluster in a high single-digit
    range for the near term. That means employers are actively looking for new plan designs, steerage tools, and measurable
    savings rather than assuming incremental premium increases are acceptable.
  claimRefs:
  - CM022
  - CM023
  - CM024
  - CM025
  - CM026
  - CM027
  - CM028
- calloutType: risk
  title: Integration, trust, and restrictive-network perception can slow rollout
  body: >-
    This category wins only when members trust the recommendations and employers can deploy the product without creating extra
    friction. Vendor consolidation, ROI scrutiny, AI trust limits, and the perception that steerage restricts choice can all
    delay adoption even when the economic case is strong.
