company:
  name: Garner Health
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Garner operates inside a very large employer-sponsored healthcare spend pool, but the strongest evidence supports sizing
    the opportunity through multiple lenses rather than one clean standalone navigation TAM. The most practical conclusion
    is a broad self-funded employer lens of roughly 100 million lives, with Garner already at more than 2.5 million covered
    people, while near-term demand is reinforced by 2026 employer medical-cost forecasts clustering from roughly 6.7% to 9%+
    and adoption is constrained mainly by integration, trust, ROI proof, and restrictive-network perception.
sections:
- id: market-boundary-and-scope
  title: Market boundary and category definition
  body: >-
    Garner does not sell a full health plan or a general digital-health bundle. The most evidence-backed market boundary is
    narrower: employer-sponsored healthcare navigation, provider-quality analytics, and incentive-backed steerage layered
    onto existing medical coverage. KFF's survey shows employers already use high-performance, tiered, and narrow-network
    designs to steer utilization toward better-value providers, while peer category pages from Included Health, Quantum, Rightway,
    and Accolade consistently define navigation as a front door for medical, financial, and administrative questions, provider
    search, claims help, and care guidance. Garner pushes that category one step further through DataPro, which turns provider-quality
    measurement into a referral-analytics product for provider organizations, carriers, benefits programs, and value-based
    care participants. Included spend therefore covers navigation workflows, billing and claims guidance, provider selection
    and referral analytics, quality transparency, and incentive administration. Excluded spend covers core insurance underwriting,
    direct claims payment, PBM economics, and standalone care delivery. This boundary matters because Garner rides the economics
    of employer healthcare spend, but it captures value only in the decision and workflow layer.
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
