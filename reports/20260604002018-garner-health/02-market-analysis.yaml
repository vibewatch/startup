  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: procurement-cycle
    missingEvidence: >-
      Publicly disclosed implementation timelines, procurement-cycle length, and renewal timing by employer size for navigation
      vendors.
    whyItMatters: >-
      Garner's market is constrained more by adoption velocity than by top-down spend. Without cycle-length data, it is harder
      to underwrite ramp speed and payback timing.
    diligencePath: >-
      Request customer implementation case studies, average days from signed contract to launch, and sales-cycle data segmented
      by direct employer sale versus carrier / TPA channel.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: standalone-navigation-tam
    missingEvidence: >-
      Independent bottom-up dollar TAM that separates navigation and provider-quality-analytics vendor revenue from overall
      employer healthcare spend.
    whyItMatters: >-
      A clean third-party TAM would improve comparability across vendors and reduce dependence on lives-based or sponsor-cost
      proxy lenses.
    diligencePath: >-
      Triangulate broker RFP data, public buyer budgets, and peer revenue disclosures to build a bottoms-up model for navigation
      and provider-analytics spend per covered life.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
