- id: growth-drivers
  title: Growth drivers expanding category demand
  body: >-
    The most important growth driver is simple: employer medical-cost pressure is intense and broadly corroborated. Mercer,
    Business Group on Health, PwC, Milliman, Aon, and McKinsey all describe 2025-2026 cost inflation in a range that remains
    well above comfort, even after mitigation. KFF adds that employees are already carrying material premium contributions
    and deductible exposure, which makes pure cost shifting harder to sustain. McKinsey explicitly argues that employee cost
    sharing has reached saturation and that employers are now looking for better plan designs, higher-value providers, and
    stronger member experience. Business Group on Health shows strong employer interest in navigation to higher-quality providers
    and transparency of quality data, while Garner's DataPro and Research Agent illustrate how provider-quality analytics
    and AI-assisted guidance are converging. PwC adds a consumer layer: people increasingly expect coordinated digital experiences,
    use health technology frequently, and want prevention-oriented systems. Together, those signals suggest the category can
    grow even without a universally accepted vendor TAM number. The market is being pulled forward by rising medical spend,
    self-insured employer pressure, value-based care, transparency demand, and digital expectations.
  claimRefs:
