- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Garner solution
  - Measurable benefit
  - Limitation
  rows:
  - - Find a high-value specialist
    - Search by symptom, specialty, or doctor and compare in-network options
    - Assistant, app, and concierge return Top Providers with availability and network context
    - Garner claims 46% engagement and average 80% lower out-of-pocket cost when members use Top Providers
    - Public evidence does not quantify false-positive or abandoned-search rates
  - - Turn guidance into reimbursable care
    - Member must add provider before visit and confirm eligible costs after adjudication
    - Approved provider list plus HRA-style reimbursement workflow inside the benefit
    - Reduces out-of-pocket friction while preserving existing insurance plan
    - Exact adjudication latency and denial reasons are not public
  - - Support complex scheduling or billing questions
    - Member escalates to human support when self-service is insufficient
    - Concierge team handles scheduling, paperwork, and claim questions
    - Blended digital plus human workflow increases practical usability
    - No public throughput or first-response SLA
  - - Run specialist referrals for care navigation
    - Navigator needs cost and quality data for named specialists
    - DataPro supplies ranked referral options, directory data, and custom queries
    - Marathon reports higher uptake of recommended referrals and lower procedure costs
    - Partner case evidence is still concentrated in a small public sample
  - - Model employer waste and savings opportunity
    - Benefits team needs a quantified view of current-network leakage
    - Provider Impact Analysis and ROI reporting benchmark NPI-level utilization against Garner performance data
    - Lets buyer evaluate savings without replacing networks
    - Methodology for opportunity sizing is not fully public
  - - Package value-added benefit through a health plan
    - Carrier wants richer design without refiling plans
    - Garner layers onto existing plan design, provider contracts, and employer distribution
    - Supports first-dollar or stronger incentive options with low operational disruption
    - Named carrier integrations and production depth are not disclosed
  notes: Workflow rows combine official member, employer, provider, and partner materials; benefits are company-claimed unless specifically attributed to Marathon or Aon.
