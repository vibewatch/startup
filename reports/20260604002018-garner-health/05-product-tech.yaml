- id: claims-data-and-ranking-engine
  title: Claims-data moat, ranking engine, and DataPro architecture
  body: 'The strongest product differentiation claim is Garner''s data foundation. Across current official pages, the company describes a dataset spanning more than 60 billion medical records from roughly 320 million patients, with 550-plus specialty-specific metrics across more than 80 specialties and current marketing sometimes stating 82 subspecialties. Public materials say the ranking engine blends de-identified claims, hospital and health-plan transparency data, public provider information, and continuously refreshed directory signals. Garner also says it applies AI and manual verification to improve phone, address, and appointment-availability accuracy, then uses the same underlying engine inside DataPro for referrals and inside the member product for Top Provider recommendations. Public API documentation is thin but meaningful: it shows provider-level scores, NPI fields, locations, network participation, and Top Provider flags, which implies a live embeddable recommendation service
    rather than a static spreadsheet export. What remains opaque is the exact risk-adjustment logic, weighting, refresh cadence, and provider appeal process behind those scores.'
