- id: integration-and-implementation
  title: Integration, implementation, and operating dependencies
  body: 'Garner''s implementation story is deliberately low-friction in public materials. Employer and FAQ pages say launch usually takes 60 to 90 days, requires only an eligibility or enrollment file plus carrier claims data, and works with major carriers, TPAs, HRIS platforms, and both fully insured and self-funded plan designs. Health-plan pages add that the product can support richer benefit designs, including first-dollar options, without changing plan filings or provider contracts. That matters because the commercial proposition depends on layering on top of existing infrastructure instead of replacing it. The practical dependencies are therefore concentrated in clean eligibility feeds, timely claims ingestion, accurate provider-directory refresh, reimbursement-rule configuration, and member communication at open enrollment or mid-year launch. Partner evidence from Marathon Health suggests the same architecture can extend into referral support: navigators can use DataPro inside existing
    care-coordination workflows instead of rebuilding them from scratch. The dependency map is attractive, but it still relies on third-party data rights and ongoing payer or carrier cooperation that are not fully documented in public.'
