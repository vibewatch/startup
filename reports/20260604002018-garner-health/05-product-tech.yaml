- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Member app + web search
    - Employee / dependent
    - GA / live
    - In-network Top Provider search plus reimbursement workflow in one experience
    - No public module-level usage split between web, iOS, Android, and concierge-assisted searches
  - - Garner Assistant
    - Member
    - Publicly launched in 2026
    - 24/7 front door for provider search, benefits guidance, claims and reimbursement status, and appointment actions
    - No public disclosure of model provider, fallback logic, or answer-quality metrics
  - - Concierge operations
    - Member with complex needs
    - GA / live
    - Human scheduling, billing, and paperwork support complements self-service surfaces
    - No public SLA, staffing ratio, or complex-case resolution data
  - - Employer / health-plan overlay benefit
    - Benefits leader / carrier
    - GA / live
    - Works on top of existing plans and uses HRA-style incentives instead of network replacement
    - Pricing, carrier-specific implementation depth, and sample admin reporting are not public
  - - Garner DataPro
    - Provider navigators / referral teams / carriers
    - GA / live after selective rollout
    - Provider-performance data packaged for referral support rather than only employee navigation
    - Pricing, contract minimums, and production API customer count are not public
  - - Research Agent + metric maintenance tooling
    - Internal clinical, research, and data teams
    - Publicly announced / internally operated
    - Turns literature review into refreshed ranking logic and keeps metrics current at scale
    - No public validation, governance, or provider appeal workflow is disclosed
  notes: Rows summarize the product surfaces described across official member, employer, provider, FAQ, and AI-launch materials; status is public-facing maturity, not internal roadmap completion.
