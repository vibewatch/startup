  evidenceGaps:
  - type: missing-source
    severity: material
    topic: methodology-opacity
    missingEvidence: A public technical note or customer diligence packet that specifies risk adjustment, peer grouping, score thresholds, refresh cadence, and provider appeal rules for Top Provider designations.
    whyItMatters: Without auditable methodology detail, employers and providers must trust the ranking engine at a high level rather than verify how a specific recommendation was produced.
    diligencePath: Request methodology and governance documents under NDA, including score construction examples for several specialties and the provider-dispute workflow.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: ai-architecture-limits
    missingEvidence: Technical disclosure of model vendors, evaluation benchmarks, human review thresholds, latency expectations, and fallback behavior for Assistant and Research Agent.
    whyItMatters: The AI narrative is becoming central to the product, but public evidence does not yet support underwriting real-time autonomy, safety controls, or operating cost assumptions.
    diligencePath: Request architecture diagrams, vendor list, model-governance policies, and production QA metrics for AI-assisted workflows.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: data-rights
    missingEvidence: Contract-level clarity on how carrier, TPA, employer, and third-party data rights are structured, how durable they are, and what provider opt-out means in practice.
    whyItMatters: Garner's moat and deployment model both depend on durable data access; weak or narrow rights could limit coverage, refresh quality, or future commercialization.
    diligencePath: Review sample data-sharing agreements, data-license terms, provider opt-out operations, and any concentration by carrier or data supplier.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: minor
    topic: security-depth
    missingEvidence: Public detail on uptime commitments, encryption standards, penetration-testing cadence, incident history, and tenant-isolation architecture.
    whyItMatters: SOC 2 and privacy-policy language show baseline seriousness but not enough detail to evaluate operational resilience or enterprise-grade architecture quality.
    diligencePath: Request trust-center materials, security whitepapers, and recent third-party audit summaries during technical diligence.
    relatedQuestionRefs:
    - QE018
    - QE023
    relatedTableRefs:
    - TE004
