callouts:
- calloutType: strength
  title: Overlay distribution is a real product advantage
  body: Garner's strongest workflow advantage is that it does not ask employers or carriers to rip out the existing network. The product layers guidance and money on top of the current plan, which lowers implementation friction and makes the referral engine more distributable across employers, health plans, and provider navigators.
  claimRefs:
  - CE001
  - CE017
  - CE018
  - CE020
- calloutType: risk
  title: Ranking explainability remains the key product-tech diligence gap
  body: Public materials explain what inputs Garner uses and why the company believes the rankings are objective, but they do not expose score thresholds, risk-adjustment logic, refresh cadence, or a provider-facing appeal workflow. That makes the ranking engine commercially compelling yet still partly black box from a diligence perspective.
  claimRefs:
  - CE009
  - CE013
  - CE035
  - CE036
  - CE037
- calloutType: assumption
  title: The AI story appears assistive, not yet fully autonomous
  body: Assistant and Research Agent are credible extensions of the existing data platform, but the public record supports an assistive AI thesis more than an autonomous one. Garner shows AI improving self-service, literature review, and directory maintenance; it does not publicly show closed-loop clinical decisioning or real-time autonomous provider-routing governance.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE047
  - CE048
