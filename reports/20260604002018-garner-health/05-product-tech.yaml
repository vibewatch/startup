- id: TE004
  title: Trust / compliance / risk register table
  columns:
  - Control / issue
  - Status
  - Scope
  - Why it matters
  - Open gap
  rows:
  - - SOC 2 Type II
    - Publicly announced
    - Enterprise trust and security posture
    - Supports procurement readiness for employers, plans, and providers
    - No public detail on control families, scope boundaries, or annual reports
  - - HIPAA business-associate posture
    - Publicly stated in privacy policy
    - Employer user PHI and reimbursement workflows
    - Signals legal framing for handling sensitive health data
    - No public BAA template, audit cadence, or breach-response detail
  - - Optional Plaid-linked reimbursements
    - Publicly stated
    - Bank-account connection for reimbursement processing
    - Improves operational ease for member payments
    - Adds third-party financial-data dependency and consent-management complexity
  - - No pay-to-play provider placement
    - Publicly stated
    - Ranking independence and referral trust
    - Important safeguard against directory monetization conflicts
    - Public evidence still does not show provider-level explainability or appeals
  - - Provider ranking visibility
    - Providers currently cannot access rankings directly
    - Contestability and provider trust
    - Protects independence from gaming but weakens explainability
    - No public route for providers to review or challenge scores
  - - Directory-data accuracy challenge
    - Officially foregrounded and independently validated as systemic industry problem
    - Provider phone, address, specialty, and availability data
    - Core to whether steerage and booking work in practice
    - Garner publishes strong accuracy claims but no third-party audit
  - - App-store privacy labels
    - Publicly visible
    - User-linked data categories and diagnostics
    - Gives members a consumer-facing data disclosure surface
    - Does not substitute for deeper architecture or retention disclosures
  - - AI governance disclosure
    - Not publicly detailed
    - Assistant, Research Agent, directory AI, and analytics products
    - Critical for underwriting automation, bias, and safety risk
    - No public model-vendor, eval, latency, or override documentation
  notes: Rows separate controls that are publicly supported from risks that remain unresolved because public product and policy materials stop short of technical audit detail.
