- id: TE003
  title: Technology / operating architecture and implementation dependency table
  columns:
  - Layer / process
  - Public evidence
  - Key dependency
  - Implementation implication
  - Risk
  rows:
  - - Data acquisition
    - Official pages cite 60B+ de-identified medical records, 320M+ patients, transparency data, and third-party provider data
    - Carrier / payer claims access, employer eligibility files, public provider data
    - Coverage breadth and refresh quality depend on continuing data rights and feed health
    - Public documentation does not specify refresh SLAs, vendor roster, or rights durability
  - - Ranking engine
    - 550+ specialty metrics across 80+ or 82 specialties evaluate outcomes, evidence-based care, and cost efficiency
    - Risk adjustment, peer grouping, specialty taxonomies, and clinical research updates
    - Buyers can understand the concept but not audit exact scoring logic
    - Score thresholds, calibration, and appeals are not public
  - - Directory accuracy pipeline
    - Garner says AI plus manual verification continuously improves phone, address, and appointment availability data
    - Web/provider signals, human QA, and reconciliation processes
    - Supports steerage use cases where members need bookable providers, not just names
    - Official accuracy figures vary by page and no external audit is public
  - - Delivery surfaces
    - App, Assistant, Concierge, DataPro UI/API, employer reporting, and plan reporting all sit on same core data asset
    - Reliable APIs, mobile distribution, member identity, and plan-rule configuration
    - Single intelligence layer can serve multiple buying centers
    - Public docs do not show tenant isolation, uptime, or versioning policies
  - - Incentive and reimbursement operations
    - Garner is structured as an overlay benefit with HRA-style reimbursements and optional Plaid linkages
    - Plan rules, adjudicated claims, bank-link workflows, employer funding rules
    - Benefit design mechanics are central to engagement, not peripheral admin
    - Public evidence is thin on reconciliation controls and payment operations
  - - Research and analytics extensions
    - Research Agent and employer analytics posts show literature review, GLP-1, and AI-upcoding analysis on top of core data
    - Internal research tooling, data science workflows, and governance
    - Extends moat beyond provider search into employer decision support
    - No public evidence yet on independent validation of these newer analytics modules
  notes: This table reflects only publicly observable architecture and dependency layers; internal cloud, database, and model-serving details remain undisclosed.
