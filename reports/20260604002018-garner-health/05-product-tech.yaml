company:
  name: Garner Health
chapter:
  number: 5
  title: Product & Technology
  summary: 'Garner''s product stack is a two-sided overlay on existing health plans: a member-facing search and reimbursement benefit plus provider and plan analytics surfaces. Public evidence supports a meaningful claims-data and workflow moat, but it still leaves material diligence gaps around ranking explainability, model governance, and the exact data-rights and real-time architecture behind the AI narrative.'
sections:
- id: member-and-buyer-surfaces
  title: Member, provider, and buyer surfaces
  body: 'Garner is best understood as a workflow product, not just a price-transparency widget. For members, the live surface is the Garner web/mobile experience plus Garner Assistant and a Concierge team: the user searches by symptom, specialty, or doctor name, sees in-network Top Providers with appointment availability, adds approved providers to a care team, and later receives reimbursement for qualifying out-of-pocket costs after the visit. For employers and health plans, the product is intentionally sold as an overlay rather than a replacement network. Garner says it can sit on top of existing plans, carriers, and provider networks while pairing recommendations with an employer-funded HRA or incentive account. For providers and navigators, DataPro extends the same ranking engine into referral workflows through an API, an off-the-shelf interface, and custom analyses. The common design choice across all three surfaces is behavior change through guidance plus money, not simply publishing
    a score.'
