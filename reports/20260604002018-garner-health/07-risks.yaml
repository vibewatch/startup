tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / exposure
  - Jurisdiction
  - Public status
  - Likelihood
  - Severity
  - Mitigation evidence
  - Residual exposure
  - Diligence path
  rows:
  - - HIPAA and HITECH handling of PHI and reimbursement records
    - U.S. federal
    - Garner acknowledges HIPAA-sensitive information and reimbursement-document handling, while HHS continues active privacy and security enforcement
    - Medium
    - High
    - Privacy policy plus published HIPAA guidance show the company is operating inside a known control framework
    - Residual exposure is still high because no public control-attestation pack or incident-response evidence is published
    - Request HIPAA role map, BAAs, retention schedule, reimbursement-workflow controls, and audit findings
  - - Tracking-technology and vendor-disclosure risk
    - U.S. federal
    - HHS warns PHI disclosures to tracking vendors can be unauthorized under HIPAA
    - Medium
    - High
    - Garner discloses vendor collection in its policy, which is better than silent collection
    - Public materials do not show the actual vendor list, consent logic, or PHI-scrubbing controls
    - Request marketing-tech inventory, SDK governance, consent logs, and privacy-impact assessments
  - - Physician-tiering transparency and steering challenge
    - U.S. private-plan and state markets
    - Garner publishes methodology summaries, but AAFP warns tiered or narrowed networks should not rely only on cost or utilization
    - Medium
    - High
    - Garner says recommendations are not pay-to-play and require quality plus cost outperformance
    - Metric weights, calibration, external audit, and appeal rights remain undisclosed
    - Request methodology governance charter, validation studies, appeals process, and false-positive rates
  - - Provider-directory accuracy and access claims
    - U.S. federal and commercial-plan context
    - CMS and KFF show persistent directory inaccuracy, while Garner says its design only works if phone and availability data are right
    - High
    - High
    - Garner says it uses daily data ingestion plus human verification to improve precision
    - The company does not publish live mismatch rates, appointment-success rates, or directory SLA compliance
    - Request current mismatch, wrong-number, not-accepting-new-patient, and failed-scheduling metrics
  - - Consumer dispute and liability allocation
    - U.S. contract law
    - Garner terms disclaim responsibility for provider care and payment disputes and require arbitration
    - Medium
    - Medium
    - Standardized terms reduce open-ended litigation exposure
    - The same terms can amplify member-friction and trust risk if reimbursement or steerage outcomes disappoint
    - Review complaint volumes, arbitration history, reimbursement denials, and member-resolution SLAs
  - - Disclosed litigation and formal enforcement status
    - U.S. public-record review
    - The fetched HHS, OCR, and FTC archive set did not surface a major current Garner action
    - Low
    - Medium
    - No major public case is already overhanging the company in the reviewed set
    - Absence of a public case does not lower structural privacy, methodology, or trust risk
    - Continue litigation, OCR, and FTC monitoring and confirm management representation letters
  notes: Rows are ordered by present investment consequence rather than certainty of legal liability, and the last row explicitly distinguishes the absence of a disclosed case from the absence of structural risk.
