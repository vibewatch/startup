- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Counterparty / channel
  - Role
  - Concentration signal
  - Failure scenario
  - Severity
  - Mitigation evidence
  - Residual exposure
  rows:
  - - Employer buying committees and renewals
    - Self-insured and fully insured employer sponsors
    - Budget holder and renewal gate
    - Public cost pressure is clear, but Garner does not disclose renewal cohorts or retention
    - ROI is not trusted quickly enough and sales cycles lengthen
    - High
    - Garner has a differentiated savings story and adoption proof
    - Unknown retention and renewal quality keep exposure high
  - - Broker and consultant distribution
    - Advisors, consultants, and benefits intermediaries
    - Potential acquisition and renewal leverage
    - Public concentration is undisclosed
    - A few influential intermediaries shape deal flow or slow adoption
    - High
    - Public materials show Garner is designed to layer onto existing plans
    - Need broker mix, attach rates, and top-channel exposure
  - - Carrier and TPA channel control
    - Health plans, TPAs, and incumbent benefits administrators
    - Can bundle, permit, or block overlay navigation models
    - Exact payer or TPA roster is not public in this chapter's source set
    - Bundled alternatives or administrative resistance compress channel access
    - High
    - Garner can sit on top of existing plans rather than replace them
    - Need named payer partners, integration terms, and exclusion clauses
  - - Broader navigation platform competitors
    - Evernorth, Quantum, Included, Transcarent, and similar platforms
    - Compete for the same employer attention and budget
    - Competitors market vendor-agnostic or all-in-one solutions at scale
    - Garner is out-bundled or forced into lower-price overlay positioning
    - High
    - Garner still differentiates on doctor-quality analytics and reimbursement incentives
    - Scale, bundling, and multi-partner distribution can still squeeze share
  - - Claims, transparency, and external data inputs
    - Data suppliers and external signals
    - Feed provider scoring and availability
    - Public source set shows dependence but not supplier redundancy
    - Input degradation weakens ranking precision and directory confidence
    - Medium
    - Garner describes a broad multi-source data stack
    - Need supplier map, refresh SLAs, and fallback logic
  - - Customer-mix opacity
    - Employers, brokers, carriers, and TPAs
    - Determines revenue durability and margin quality
    - No public concentration bridge is disclosed
    - A few accounts or channels dominate economics
    - High
    - Public evidence shows meaningful scale but not mix quality
    - Request top-10 account exposure, channel margin, and renewal rights
  notes: The central dependency risk is not a single cloud vendor; it is the combined dependence on employer budgets, intermediated distribution, incumbent administrators, and external data quality.
