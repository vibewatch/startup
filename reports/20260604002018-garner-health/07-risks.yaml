- id: operational-data-quality-and-member-trust
  title: Operational risk sits in data quality, reimbursement execution, and member trust rather than classic software uptime alone
  body: 'Garner’s promise sounds simple to members—find the right in-network doctor, get help with scheduling and billing, and receive reimbursement support—but that promise rests on a fragile operating chain. CMS’s historical review, LexisNexis’s 2025 survey, and KFF’s network-adequacy analysis all reinforce that provider-directory data are often wrong, stale, or hard to use. Garner implicitly agrees with that risk because it says value-driven designs only work if members can find the correct phone number and provider availability, and because it describes daily ingestion plus human verification as the mitigation. The problem is that public mitigation language is not the same as public error-rate evidence. Garner also asks members to trust reimbursement-document handling and concierge support, while its app-store descriptions market billing and paperwork help as core workflow features. Review surfaces are noisy but directionally relevant: the App Store looks healthy, whereas Birdeye, JustUseApp,
    and a negative SHRM review point to trust and execution concerns that cannot be dismissed out of hand. The operational question for diligence is therefore whether Garner’s internal mismatch, complaint, turnaround, and exception metrics look much cleaner than these public proxies suggest.'
