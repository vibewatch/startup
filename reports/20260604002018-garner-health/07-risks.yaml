- id: data-governance-methodology-and-regulatory
  title: Data governance, methodology opacity, and regulatory exposure are the top risk cluster
  body: Garner’s value proposition is unusually dependent on sensitive data and hard-to-audit decision logic. The company says it handles employer-linked information that may be subject to HIPAA and HITECH, collects reimbursement documentation, gathers doctor information from third-party and public sources, and uses third-party vendors for service interactions. It also says its ranking engine uses 500-plus metrics, 60 billion medical records, and quality-plus-cost comparisons against local peers. Those disclosures are helpful, but they stop well short of the governance pack a buyer or investor would really want. The public pages do not publish full metric weights, calibration studies, external audits, or a public appeals regime. HHS guidance raises the bar further by warning that PHI disclosures to tracking vendors can be unauthorized, and by showing that impermissible disclosures and lack of safeguards remain common enforcement themes. Garner’s terms also shift meaningful responsibility
    away from the company through liability disclaimers and arbitration, which may reduce direct legal exposure while raising trust friction if members dispute outcomes. Because no major formal action surfaced in the reviewed public archives, the correct conclusion is not “risk-free”; it is that Garner’s biggest legal and regulatory risk is structural compliance and explainability risk, not already-disclosed litigation.
