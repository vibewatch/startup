  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ranking-governance
    missingEvidence: External validation, calibration studies, false-positive or false-negative rates, and a defined appeal or correction process for physician rankings.
    whyItMatters: Without auditability, investors cannot tell whether methodology opacity is a manageable disclosure gap or a real procurement and trust blocker.
    diligencePath: Request the latest methodology-governance packet, change-log, external review, and any provider or employer appeal workflow materials.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: NRR, GRR, logo churn, cohort renewal rates, contract duration, and implementation-to-renewal conversion by segment.
    whyItMatters: Public adoption and savings claims do not tell investors whether Garner is compounding inside accounts or merely winning new logos.
    diligencePath: Request customer cohort tables by vintage, segment, and channel plus renewal reasons for wins, flat renewals, and churn.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: channel-concentration
    missingEvidence: Top employer, broker, carrier, and TPA concentration plus any channel-specific margin or exclusivity terms.
    whyItMatters: Commercial durability depends on whether Garner controls its own distribution economics or is vulnerable to a small number of gatekeepers.
    diligencePath: Request a concentration bridge, top-10 customer and partner schedule, and the commercial terms of the most important channel relationships.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: operational-error-rates
    missingEvidence: Current provider-directory mismatch rates, failed-scheduling rates, reimbursement turnaround times, complaint taxonomy, and member-support SLA performance.
    whyItMatters: These metrics determine whether public review noise is a false alarm or a real early warning of trust and renewal risk.
    diligencePath: Request weekly or monthly operational dashboards for directory accuracy, reimbursement, concierge queues, and issue-resolution times.
    relatedQuestionRefs:
    - QR009
    - QR010
    relatedTableRefs:
    - TR002
    - TR004
