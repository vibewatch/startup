- id: channel-competition-and-commercial-durability
  title: Channel, competition, and commercial durability risk may matter as much as the core science
  body: 'Even if Garner’s physician-ranking engine works well, the company still has to win inside a market where employer healthcare costs are climbing sharply and where competing navigation platforms are broadening their scope. Mercer and Business Group on Health show the economic urgency clearly, but rising urgency does not guarantee fast adoption; it often creates tougher procurement and renewal scrutiny. Aon’s trend note adds that employers are responding with incentives, navigation solutions, and tighter vendor management, which means Garner is selling into a buyer set that is actively rationalizing its vendor stack. At the same time, Evernorth, Quantum, Included Health, and Transcarent are all marketing broader navigation or all-in-one solutions, and Mordor explicitly describes employer consolidation of fragmented point solutions plus payer-led digital front doors. Garner’s own public data do not close the commercial risk loop because the fetched set does not disclose NRR, GRR, contract
    duration, or concentration by employer, broker, carrier, or TPA. That leaves a clear underwriting gap: Garner may be differentiated on doctor-quality analytics, but investors still need private evidence that the business can renew, scale through intermediated channels, and avoid becoming a feature inside someone else’s front door.'
