summary:
  headline: >-
    Garner 看起来是可信的后期 healthcare navigation 赢家，已有真实规模和差异化的数据 + 激励模型；但 $2.74 billion Series E
    已计入高质量执行，利润率、留存和资本结构公开披露仍太薄，无法给出干净买入结论。
