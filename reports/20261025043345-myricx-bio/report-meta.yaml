  topStrengths:
    - Differentiated NMTi payload biology with published mechanistic support and company-reported preclinical activity.
    - Strong strategic validation through the announced Novartis transaction and prior institutional financing.
    - Experienced scientific, ADC, and clinical-development leadership signals.
  topRisks:
