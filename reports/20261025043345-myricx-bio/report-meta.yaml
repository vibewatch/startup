companyProfile:
  summary: >-
    Myricx Bio is a London-based biotechnology company developing antibody-drug conjugates that use
    N-myristoyltransferase inhibitor payloads for oncology. The retained evidence names B7-H3 and HER2-directed lead
    contexts, describes a preclinical pipeline, and records an announced acquisition by Novartis with upfront and
    contingent consideration. The platform has scientific and strategic differentiation, but clinical translation and
    standalone operating disclosure remain limited.
