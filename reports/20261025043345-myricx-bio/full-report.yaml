      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy cannot be calculated from the assigned public evidence. Companies House shows the legal
              entity's last accounts made up to 31 July 2025 and next accounts due by 30 September 2027, but the
              overview page excerpt does not provide cash, liabilities, burn, or debt balances. The announced
              acquisition was still conditional on closing conditions in the Imperial account, and the company's
              acquisition release is explicitly a paid press release; neither source supplies a standalone balance sheet
              or a bridge from Series A proceeds to remaining cash. ADC comparables show why future capital requirements
              can be substantial: Pfizer's completed Seagen acquisition was approximately $43 billion, while BioMed
              Nexus describes ADC manufacturing as requiring specialized antibody, payload, linker, and safety
              capabilities and identifies safety, manufacturing capacity, and pricing as persistent challenges. Those
              comparables are contextual rather than forecasts for Myricx Bio. The financial verdict is therefore
              strategically validated but operationally under-disclosed: diligence should obtain the pre-close cash
              balance, monthly burn, debt and obligations, cap table, milestone schedule, and post-close accounting
