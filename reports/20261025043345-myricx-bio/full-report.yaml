  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and maturity
        blocks:
          - type: paragraph
            body: >-
              Myricx Bio's product is not a marketed medicine or a general-purpose ADC service; it is a proprietary
              payload platform intended to be incorporated into antibody-drug conjugates for oncology. The company
              describes two lead ADC assets directed at the established B7-H3 and HER2 targets, alongside a broader
              preclinical NMTi-ADC pipeline. Its core design choice is to inhibit N-myristoyltransferase, an enzyme
              involved in protein myristoylation, instead of relying on the more common TOPO-1 or tubulin payload
              classes. The July 2026 transaction announcement states that Myricx has advanced a pre-clinical pipeline
              and that Novartis is acquiring two lead assets, so the strongest current maturity label is preclinical
              platform plus lead constructs, not clinical validation. The 2024 financing announcement reports efficacy
              and safety findings in multiple solid-cancer models, but those are company-reported preclinical results
              and do not substitute for IND-enabling toxicology or human pharmacology.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE011
      - number: '5.2'
        title: Mechanism and ADC operating architecture
        blocks:
          - type: paragraph
            body: >-
              The platform's proposed mechanism is biologically differentiated but operationally dependent on the full
              ADC construct. The bioRxiv study reports that NMT inhibition was synthetic lethal with deregulated MYC in
              cancer models, with mitochondrial complex I protein-synthesis failure and loss of the assembly factor
              NDUFAF4 preceding mitochondrial dysfunction. Translating that biology into an ADC requires an antibody
              that binds an appropriate tumour-associated antigen, internalization, linker stability in circulation,
              intracellular payload release, and sufficient active payload exposure in tumour cells. Independent ADC
              literature identifies conjugation site, linker chemistry, linker length, steric hindrance, and cleavable
              versus non-cleavable linkage as determinants of stability, release, efficacy, and toxicity. This makes the
              platform more than a payload swap: its practical value depends on construct-level optimization and target
              context. The retained evidence does not disclose Myricx's exact antibody formats, linker chemistry,
              drug-to-antibody ratio, release kinetics, or analytical release specifications.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
