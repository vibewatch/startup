            body: >-
              The leadership record shows a transition from founder-led scientific formation toward a more
              execution-oriented biotech team. The financing announcement identifies Robin Carr as CTO and says he
              joined from GSK in 2019, spearheading the pivot from small-molecule NMT inhibitors toward ADC payloads.
