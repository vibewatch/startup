          The disclosed $1.5 billion maximum is a transaction ceiling, not a new-money valuation range; target return
          remains unavailable without ownership and timing.
        - Qualitative only; no defensible numeric probability in the reviewed sources.
        - Milestone eligibility narrows or clinical translation is target-specific.
      - - Base
        - The $1.1 billion upfront consideration is paid, while clinical and milestone uncertainty persists.
        - >-
          Use the upfront amount as evidence of strategic willingness to pay, not as independently verified intrinsic
          value.
        - Most evidence supports strategic validation but not price-independent underwriting.
        - Closing delay, adverse adjustments, or failure to obtain the clinical package.
      - - Bear
        - Transaction fails to close, contingent payments are not earned, or safety / efficacy prevents development.
        - >-
          No public evidence supports a valuation floor; downside could be severe and should not be assigned false
          precision.
        - Peer ADC failures establish plausible modality downside, not a Myricx-specific failure rate.
        - Dose-limiting toxicity, inadequate efficacy at tolerated exposure, or inability to reproduce activity.
    notes: >-
      Scenario values are limited to disclosed transaction anchors; probabilities, standalone ranges, and investor
      returns are intentionally left unquantified.
