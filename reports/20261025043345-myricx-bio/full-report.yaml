  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The proposed NMTi-ADC value chain runs from tumour biology and antibody targeting through linker-controlled
      release, payload mechanism, and manufacturability.
    data:
      layers:
        - label: Target biology
          detail: Select the tumour-associated antigen and biological context.
          items:
            - label: Antigen selection
              detail: B7-H3 and HER2 are named lead-target contexts; broader target inventory is not disclosed.
              value: B7-H3 / HER2
            - label: Tumour context
              detail: Solid-tumour settings are the stated development scope.
              value: Solid tumours
        - label: Antibody
          detail: Bind and internalize through the selected tumour-associated antigen.
          items:
            - label: Target binding
              detail: Target-binding antibody component; specific format is not retained.
              value: null
        - label: Linker and conjugation
          detail: Control systemic stability, conjugation, and intracellular release.
          items:
            - label: Linker
              detail: Myricx-specific linker chemistry is not retained.
              value: null
            - label: Conjugation
              detail: Site and drug-to-antibody ratio are not retained.
              value: null
        - label: Payload and mechanism
          detail: Deliver the NMTi payload and express the proposed cancer-cell mechanism.
          items:
            - label: NMTi payload
              detail: N-myristoyltransferase inhibitor payload class with a differentiated mechanism.
              value: NMT inhibition
            - label: Biomarker hypothesis
              detail: Published biology links NMT inhibition to MYC-deregulated cancer models.
              value: MYC-deregulated models
        - label: Translational evidence
          detail: Test efficacy, exposure, resistance positioning, and tolerability in relevant models.
          items:
            - label: Model evidence
              detail: Company reports solid-tumour models and activity in models refractory to Topo1i ADCs.
              value: Preclinical
        - label: Development and control
          detail: Establish clinical, CMC, quality, and release readiness.
          items:
            - label: CMC and clinical translation
              detail: IND-enabling, GMP, and human safety evidence are not established in the retained pool.
              value: Gap
    approximationNotes: >-
      The stack is a conceptual operating architecture, not a measured process map; null values denote undisclosed
