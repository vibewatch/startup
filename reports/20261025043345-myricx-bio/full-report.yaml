  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform
        blocks:
          - type: paragraph
            body: >-
              Myricx Bio is described by Novartis and the company announcement as a privately held, UK-headquartered
              biotechnology company focused on a new class of antibody-drug conjugate payloads. The platform uses
              N-myristoyltransferase inhibitors, with lead ADC assets directed at B7-H3 and HER2. The retained evidence
              consistently describes the pipeline as preclinical rather than clinical. The scientific proposition is
              differentiated payload biology, not a demonstrated clinical product: Novartis says the payload is designed
              to address limitations of commonly used TOPO-1 and tubulin payload classes, while its own release
              qualifies potential activity and clinical validation. Myricx was spun out of Imperial College London and
              the Francis Crick Institute, and the company announcement names Professor Ed Tate, Dr Roberto Solari, and
              Dr Andrew Bell as founders. London is the only location established by the retained sources; no
              independently verified headcount, revenue, customer, or product-commercialization metric is available.
