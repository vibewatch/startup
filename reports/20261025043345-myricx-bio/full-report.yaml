      - number: '5.3'
        title: Differentiation, deployment, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The principal differentiator is the orthogonal NMTi payload mechanism and the associated possibility of
              addressing resistance or tolerability limitations of established ADC payload classes. The 2026 acquisition
              materials frame this as potential to broaden ADC use across solid-tumour settings, while the 2024
              financing materials describe bystander activity and activity in models refractory to Topo1i-based ADCs.
              Those statements support a differentiated development hypothesis, not a demonstrated therapeutic index in
              patients. The platform also carries familiar ADC execution risks: antigen heterogeneity and
              on-target/off-tumour exposure, linker instability or incomplete intracellular release, payload resistance,
              systemic toxicity, manufacturing complexity, and uncertain translation from xenograft or organoid models.
              The source set does not provide a validated clinical safety package, regulatory status for a specific
              construct, a manufacturing partner, batch-release data, cybersecurity controls, or a public
              reliability/support process; these are material diligence gaps for a preclinical biotech.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE016
      - number: '5.4'
        title: Diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The next technical diligence step is construct-level rather than platform-level. A reviewer should request
              the lead-asset data package by antibody, antigen, linker, payload, drug-to-antibody ratio, release
              pathway, and model, with raw exposure and tolerability data rather than headline tumour-regression
              statements. The package should also connect the MYC/NMT mechanism to biomarker selection and explain
              whether the same payload chemistry is portable across B7-H3, HER2, and other antibody contexts.
              IND-enabling toxicology, pharmacokinetics, immunogenicity, stability-indicating assays, process
              development, and GMP readiness are not established by the retained evidence. The announced Novartis
              acquisition validates strategic interest and provides a potential development sponsor, but the transaction
              was expected to close in the second half of 2026 subject to customary conditions, so closing and
              post-close technical ownership should be verified separately.
            claimRefs:
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Mechanistic differentiation
            body: >-
              NMT inhibition gives Myricx a payload mechanism distinct from common TOPO-1 and tubulin ADC classes, with
              a published biological rationale and company-reported preclinical activity.
            calloutType: strength
            claimRefs:
              - CE005
              - CE010
          - type: callout
            title: Preclinical translation remains binary
            body: >-
              The evidence supports a differentiated hypothesis, but does not establish human efficacy, a clinical
              therapeutic window, or construct-level portability across targets.
            calloutType: risk
            claimRefs:
              - CE003
              - CE012
              - CE015
          - type: callout
            title: Request the construct data package
            body: >-
              Underwrite the lead ADCs only after reviewing linker and payload exposure, IND-enabling toxicology,
              biomarker strategy, and manufacturing-control evidence for each construct.
            calloutType: recommendation
            claimRefs:
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              Myricx is a pre-commercial biotechnology developer rather than a software or services vendor with
              disclosed paying accounts. Its immediate economic counterparties are biopharma developers and strategic
              acquirers that can license, develop, manufacture, and commercialize antibody-drug conjugates; the ultimate
              users are oncology patients and treating clinicians, while payers and health systems would matter only
              after a medicine is approved. Myricx describes itself as focused on discovery and development of
              NMT-inhibitor payloads for ADCs, and its 2024 financing announcement says the company was building
              laboratories and an in-house R&D team rather than reporting customer contracts. The Novartis ownership
              statement confirms a strategic-owner relationship, but it is not evidence of recurring customer revenue or
              a launched product. Customer segmentation is therefore organized around development counterparties,
              clinical users, and eventual treatment channels, with scale and revenue fields left unverified.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signal is progression of the platform toward clinical development and the ability
              to attract new life-science investors, not measured customer usage. The 2024 financing source states that
              funds would advance NMTi-ADCs toward clinical proof of concept and establish London laboratory operations;
              it does not disclose active customers, contracted accounts, renewal rates, net revenue retention, repeat
              purchases, utilization, or paid deployments. External oncology and ADC sources establish that
              breast-cancer care, B7-H3 programs, and other ADC platforms address clinically meaningful treatment
              workflows, but they do not validate Myricx adoption. A durable customer thesis would require
              construct-level clinical progress, named development or licensing counterparties, and longitudinal
              evidence that any partnership expands beyond a one-time strategic transaction.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
