              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU008
              - CU012
              - CU013
      - number: '6.3'
        title: Named proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named counterparties in the retained material are investors and strategic ecosystem participants, not
              disclosed commercial customers. The Series A announcement names Novo Holdings, Abingworth, British Patient
              Capital, Cancer Research Horizons, Eli Lilly, Brandon Capital, and Sofinnova Partners, and says Novo and
              Abingworth representatives joined the board. That is evidence of financing and governance participation,
              while the company announcement describes preclinical efficacy and a planned move into clinical
              development; neither proves a customer deployment or outcome. The later ownership statement identifies
              Novartis as the owner from August 28, 2026, creating strategic concentration in one parent and making
              future external partnering, internal portfolio priority, and development funding important diligence
              questions. Competitor ADC programs illustrate that oncology customers can have alternatives, so Myricx
              must demonstrate differentiated clinical value rather than rely on platform novelty alone.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic validation is stronger than commercial proof
            body: >-
              Investor participation, planned clinical progression, and Novartis ownership support strategic interest,
              but the evidence does not show paying customers, active deployments, or retention.
            calloutType: strength
            claimRefs:
              - CU005
              - CU010
              - CU013
          - type: callout
            title: Customer concentration and proof gap
            body: >-
              With no disclosed recurring customer base and a strategic owner now controlling the company, customer
              durability and external demand remain unverified.
            calloutType: risk
            claimRefs:
              - CU003
              - CU007
              - CU012
          - type: callout
            title: Request construct-level partnering and clinical evidence
            body: >-
              Diligence should obtain executed collaboration terms, development milestones, clinical enrollment and
              response data, and evidence of any external customer or partner expansion beyond the Novartis transaction.
            calloutType: recommendation
            claimRefs:
              - CU008
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implications
        blocks:
          - type: paragraph
            body: >-
              Myricx's principal risk is translational rather than conceptual. The company describes multiple
              patent-protected NMTi series, compatibility with a range of linkers, and complete tumour regression in in
              vivo models, but the retained company materials do not provide a clinical dose, human safety dataset, or a
              construct-level package that confirms the platform's therapeutic window across antibodies and indications.
              The independent ADC resistance review explains why ADC outcomes depend on the interacting antibody,
              linker, and payload, and identifies antigen down-regulation, altered internalization or routing, impaired
              cytosolic release, and drug efflux as escape mechanisms. Those mechanisms make an apparently
              differentiated payload insufficient on its own. The resulting investment implication is to treat the
              platform as strategically validated but clinically binary until human pharmacology, tolerability,
              exposure, and response data are disclosed.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Regulatory, legal, and transaction exposure
        blocks:
          - type: paragraph
            body: >-
              The retained regulatory evidence is a general U.S. biotechnology coordination framework, not a
              Myricx-specific approval or IND record; therefore it supports the existence of a coordinated safety and
              transparency regime but cannot be used to infer that Myricx has cleared any regulatory milestone.
              Companies House records show material post-announcement corporate changes: Novartis was notified as a
              person with significant control on 2 September 2026, share rights were varied, directors changed, and the
              accounting period was extended. Novo Holdings' 6 July 2026 announcement says the transaction was expected
              to close in the second half of 2026 subject to customary closing conditions, including regulatory
              approvals. Until closing and the post-close operating structure are confirmed, transaction completion,
              governance continuity, IP ownership, and responsibility for development obligations remain diligence
              items.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, quality, partner, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              The company stated in its Series A announcement that financing would be used to build the NMTi ADC payload
              platform and advance candidates toward clinical proof of concept; the same announcement described a
              transition from a virtual company toward its own laboratories and in-house R&D team. That transition
              creates execution dependencies in assay reproducibility, conjugation and linker control, analytical
              characterization, toxicology, manufacturing readiness, and hiring. The acquisition announcement provides a
              potential capital and platform sponsor, but it also introduces integration and milestone-dependency risk
              because up to $1.5 billion includes $1.1 billion upfront plus potential milestone payments, and the
              announcement does not disclose milestone conditions or development decision rights. No retained source
              supplies standalone cash, burn, debt, working-capital, supplier concentration, or quality-system data.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR012
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The appropriate monitoring plan focuses on measurable evidence rather than the existence of a promising
              mechanism. Near-term positive signals would include a completed acquisition, disclosed IND-enabling
              package, reproducible exposure and tolerability across more than one NMTi-ADC construct, and a
              first-in-human study with a justified starting dose. Thesis-break signals would include failure to close
              the transaction, a material delay in regulatory submissions, dose-limiting toxicity that narrows the
              therapeutic index, loss of activity in clinically relevant models, evidence that antigen or linker
              behavior prevents payload delivery, or a decision to discontinue the platform. The retained evidence
              supports these as diligence and monitoring criteria; it does not establish that any criterion has already
              been met.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR009
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core risk
            body: >-
              A novel payload mechanism can broaden ADC optionality while remaining exposed to the same delivery,
              resistance, safety, and clinical-development bottlenecks that have limited prior ADC programs.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Diligence posture
            body: >-
              Keep the risk rating high until transaction close, human safety and exposure data, and construct-level
              evidence establish that NMTi payload differentiation translates into a usable clinical therapeutic window.
            calloutType: recommendation
            claimRefs:
              - CR007
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision frame and recommendation
        blocks:
          - type: paragraph
            body: >-
              The decision is not whether Myricx attracted strategic interest; the disclosed transaction already answers
              that question. Invest Europe reports an agreement worth up to $1.5 billion, including $1.1 billion in cash
              upfront and as much as $400 million in milestones. The investable question is whether that headline can be
              reused as a fair-value mark or entry price. It cannot. The reviewed evidence does not disclose closing
              adjustments, milestone definitions, liquidation preferences, ownership at exit, or the distribution of
              proceeds. Accordingly, the recommendation is research more / track, with medium confidence and high risk.
              Any new underwriting at a headline-equivalent price should wait for transaction documents, construct-level
              human data, and a cap-table waterfall. This is price discipline, not a negative judgment on the platform.
            claimRefs:
              - CV001
              - CV002
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV014
              - CV016
      - number: '8.2'
        title: Financing context, proof, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Myricx entered the strategic process from a well-funded but still evidence-sensitive position. Cancer
              Research Horizons reported a £90 million ($114 million) Series A intended to build the NMTi payload
              platform and advance NMTi-ADCs through clinical proof of concept; Invest Europe reports £104 million of
              total seed and Series A funding. The official publications page lists a 2025 Cell Reports paper on MYC
              deregulation and NMT inhibition, which supports biological relevance but is not a substitute for a
              clinical safety, pharmacokinetic, or efficacy package for the acquired constructs. The anti-thesis is
              therefore straightforward: strategic scarcity and preclinical differentiation may have driven the price
              before clinical risk was retired. Evidence from failed or modestly active peer ADC programs shows that
              linker-payload promise does not eliminate therapeutic-index and efficacy risk.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV014
              - CV016
      - number: '8.3'
        title: Comparable calibration and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Comparable transactions are useful only after adjusting for development stage, acquired scope, and
              guaranteed versus contingent value. Gilead's Tubulis agreement offers the clearest current contrast: $3.15
              billion upfront plus up to $1.85 billion contingent for a company whose lead asset was already in Phase
              1b/2 and whose second program had initial clinical data. Earlier transactions cited by Nature include $2.0
              billion for Ambrx, whose lead asset was in Phase 2, and $1.8 billion for ProfoundBio with three
              clinical-stage candidates. Those references do not mechanically value Myricx; they show why a
              clinical-stage premium and platform breadth must be separated from headline deal size. A consultancy's
              proprietary phase benchmarks are retained only as a low-confidence sensitivity, not an independent
              valuation verdict.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Scenarios, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The bull case is a completed acquisition followed by milestone achievement and clinical translation of the
              NMTi-ADC platform; its observable ceiling is the disclosed $1.5 billion headline, not an independently
              appraised intrinsic value. The base case treats the $1.1 billion upfront as evidence of strategic
              willingness to pay while withholding a standalone valuation range until deal mechanics and human data are
              available. The bear case is milestone non-payment or clinical failure, for which the public record
              supplies no defensible valuation floor. Thesis-break triggers are a failure to close, materially narrower
              milestone eligibility than the headline suggests, dose-limiting toxicity, insufficient efficacy at
              tolerated exposure, or inability to reproduce activity across antibody contexts. Final diligence should
              obtain the purchase agreement, closing evidence, cap table and preference waterfall, milestone schedule,
              and full IND-enabling and early clinical package before assigning a target return.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Strategic validation is real, but a reported acquisition headline is not a reusable entry valuation. Hold
              the recommendation at research more / track until transaction mechanics and clinical evidence support a
              return model.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV016
          - type: callout
            title: No defensible public valuation floor
            body: >-
              The assigned evidence supports an upside ceiling and peer references, but not a standalone downside floor.
              A precise bear-case value would be invented.
            calloutType: risk
            claimRefs:
              - CV014
              - CV016
