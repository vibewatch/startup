  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the development and eventual commercialization of oncology antibody-drug
              conjugates, with Myricx positioned specifically in the payload layer rather than as a complete antibody,
              linker, manufacturing, or hospital-distribution business. The company describes NMTi payloads as intended
              to work across solid-tumor settings and its disclosed preclinical leads target B7-H3 and HER2. This makes
              the near-term buyer set pharmaceutical oncology developers and strategic partners, while the eventual
              payer is a health system or insurer and the user is an oncologist treating a biomarker-defined patient.
              The category's demand is supported by the global cancer burden and by commercial ADC products already
              reaching multi-billion-dollar sales, but this does not make every payload platform's opportunity
              equivalent to total ADC product revenue. Excluded from the company-specific boundary are all ADC sales
              outside the target-antigen and payload contexts Myricx can technically address, contract manufacturing
              revenue, and unrelated antibody or oncology spending. Status-quo substitutes include existing TOPO-1 and
              tubulin-payload ADCs, conventional chemotherapy, other targeted therapies, and internal development by
              large pharmaceutical companies. The strategic market signal is therefore strong, while the conversion from
              category spend to Myricx revenue remains unproven.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              Available public estimates show why a single TAM number would be misleading. Grand View Research reports
              USD 14.5 billion in 2025 and USD 16.7 billion in 2026 for the global ADC market, forecasting USD 32.1
              billion by 2033 at an 11.5% CAGR. The Business Research Company reports a higher USD 16.53 billion 2025
              base and USD 20.28 billion in 2026, reaching USD 46.95 billion in 2030 at a 23.3% forecast CAGR. DCAT
              Value Chain Insights, citing Roots Analysis, uses an approximately USD 15 billion 2025 product-market
              estimate and separately sizes ADC contract manufacturing at approximately USD 1.7 billion in 2025 and USD
              3.2 billion in 2035. These figures use different scopes, methodologies, and forecast horizons; they should
              be treated as alternative lenses rather than reconciled into a point estimate. A Myricx SAM would need to
              remove non-oncology and non-target segments, distinguish platform licensing from product sales, and
              reflect clinical-stage attrition. No public source isolates a Myricx-specific SOM, so any precise share or
              conversion assumption would be unsupported.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The adoption path is staged. In the current preclinical phase, Myricx's primary economic buyer is a
              pharmaceutical company seeking a differentiated payload mechanism, with licensing or acquisition as the
              most visible route; the Novartis agreement demonstrates strategic interest but is not evidence of
              recurring commercial revenue. Later buyers would include clinical development organizations and
              manufacturing partners, while hospitals and payers would determine uptake after approval. Hospital
              pharmacy accounted for 52.8% of ADC distribution in Grand View Research's 2025 segmentation, illustrating
              that administration, storage, infusion, reimbursement, and adverse-event management are part of the
              adoption system. The principal constraints are clinical validation of the NMT mechanism and therapeutic
              index, target and linker portability, regulatory approval, specialist manufacturing, payer acceptance, and
              competition from established payload classes. The competitive field is crowded: Patsnap reports 2,868 ADC
              drug records, 1,519 ongoing Phase 2/3 trials, and 20 marketed assets as of June 2026. Thus, the
              acquisition validates strategic scarcity more than it proves broad patient-level adoption, and diligence
              should focus on construct-level data and the terms and milestones that determine whether platform value
              converts into cash.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
