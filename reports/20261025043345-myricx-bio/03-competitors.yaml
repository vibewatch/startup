schemaVersion: "report-v2"
artifact: competitors
slug: myricx-bio
runDate: 2026-10-25
company:
  name: Myricx Bio
chapter:
  number: 3
  title: Competitors
  summary: >-
    Myricx occupies a differentiated but unvalidated niche in ADC payloads: NMT
    inhibition is positioned as orthogonal to dominant topoisomerase-I and tubulin
    classes, while Pacylex is the clearest mechanistic peer already in human studies.
    The competitive advantage is therefore platform novelty and potential payload
    breadth, not yet clinical or commercial proof.
sections:
  - id: landscape
    title: Competitive landscape and stage asymmetry
    body: >-
      Myricx is not competing with a single like-for-like product. Its relevant set spans
      payload-platform companies, clinical NMT inhibitor developers, established ADC
      payload classes, and the status quo of internal discovery at large pharmaceutical
      companies. The strongest direct mechanistic comparator in the retained evidence is
      Pacylex: its March 2025 announcement describes oral zelenirstat as a first-in-class
      NMT inhibitor in an AML Phase 1/2 study and separately identifies 27 additional
      NMTis as potential ADC payloads. That creates a stage advantage for Pacylex in
      human validation, although its lead program is an oral small molecule for
      hematologic cancer rather than Myricx's ADC-first solid-tumor strategy. Myricx's
      own disclosed differentiation is an NMTi payload class intended to address
      limitations of commonly used TOPO-1 and tubulin payloads; the claim remains
      preclinical and company/partner sourced.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buyer-comparison
    title: Capability, buying criteria, and substitutes
    body: >-
      The buyer decision is an integrated development and partnering decision, not a
      simple price comparison. ADC sponsors evaluate payload mechanism, antigen and
      linker compatibility, bystander behavior, therapeutic window, manufacturability,
      clinical stage, and access to validated antibodies and development know-how. The
      retained ADC review explains that payload release depends on the antibody, linker,
      intracellular processing, and drug-to-antibody ratio, and that cleavable linkers
      can improve delivery while increasing exposure to neighboring antigen-negative
      cells. This makes Myricx's reported bystander activity potentially relevant to
      heterogeneous tumors, but it also means that payload claims cannot be separated
      from construct-level evidence. Established HER2 ADCs demonstrate that validated
      target biology and clinical outcomes remain a formidable substitute for a novel
      payload platform.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: durability
    title: Moat durability and displacement risks
    body: >-
      Myricx's moat is strongest where proprietary NMT chemistry, biological insight,
      and construct-specific data reinforce one another; it is weakest if NMT inhibition
      becomes reproducible through alternative chemistry or if incumbent payload
      platforms solve the same therapeutic-window problem. The retained resistance review
      states that advanced-stage patients treated with ADCs usually develop resistance
      and groups mechanisms into antigen expression, ADC processing, and payload
      efflux. That creates a real demand for new payloads, but it also raises a
      portability test: a platform must show repeatable benefit across antigens,
      linkers, DARs, and tumor contexts. Myricx's 2025 partner release reports durable
      regressions in multiple solid-cancer models and a nominated development candidate,
      while the independent clinical-stage comparator evidence shows that NMT biology is
      already being pursued outside Myricx. Until human data and construct-level
      comparisons are public, the durability judgment remains medium confidence.
    claimRefs: [CP009, CP010, CP011, CP012]
  - id: commercial-structure
    title: Commercial structure, pricing, and distribution power
    body: >-
      Public evidence does not provide a like-for-like platform price for Myricx,
      Pacylex, or internal pharmaceutical development. The observable commercial
      anchors instead sit at different levels of the value chain: Myricx raised
      £90 million ($114 million) to fund platform and pipeline development; the
      announced Novartis transaction was valued at up to $1.5 billion, including
      $1.1 billion upfront and potential milestones; and an industry estimate places
      annual U.S. therapy costs at $168,000 for Enhertu and $174,000 for Trodelvy.
      None is a realized NMTi payload license price. Novartis ownership nevertheless
      changes distribution power by placing Myricx inside an incumbent oncology
      developer, while undisclosed licensing, royalty, manufacturing, and transfer
      economics prevent a defensible buyer-level price comparison.
    claimRefs: [CP004, CP013, CP015, CP016]
    tableRefs: [TP003]
