    notes: "Cells marked Unknown are evidence gaps, not negative findings; the matrix compares disclosed capability and stage rather than inventing scores."
    claimRefs: [CP002, CP005, CP006, CP007, CP009, CP010, CP014]
  - id: TP003
    title: Pricing, packaging, and commercial-model comparison
    columns: [Alternative, Disclosed unit or model, Public amount, What it includes or excludes, Competitive implication]
    rows:
      - [Myricx platform development, Series A financing, "£90m ($114m)", R&D capitalization rather than customer price or licensing consideration, Shows capital available for development but not buyer economics]
      - [Myricx acquisition, Strategic M&A consideration, "$1.1bn upfront plus up to $400m in milestones", Whole-company transaction rather than payload unit price, Signals strategic scarcity but is not a reusable platform price]
      - [Pacylex NMT program, Clinical-stage company development, "Not disclosed", No payload license fee royalty or product price in retained release, Buyer economics remain unknown]
      - [Enhertu, Annual U.S. therapy cost estimate, "$168,000", Market-report estimate rather than realized net price or platform fee, Approved-product economics are not directly comparable to preclinical licensing]
      - [Trodelvy, Annual U.S. therapy cost estimate, "$174,000", Market-report estimate rather than realized net price or platform fee, Provides an end-product affordability benchmark only]
      - [Internal pharmaceutical build, In-house R&D and manufacturing, "Not disclosed", No allocated cost transfer price or opportunity cost in assigned sources, Incumbents can substitute internal capability without publishing its economics]
    notes: "Amounts use different units and transaction levels and must not be compared as equivalent prices; null terms mean not disclosed in the assigned pool, not zero."
    claimRefs: [CP004, CP013, CP015, CP016]
