    title: "Competitive positioning: novelty versus translational validation"
    type: quadrant
    summary: "Myricx is positioned high on payload novelty but below clinical-stage comparators on translational validation in the retained evidence."
    data:
      points:
        - {label: Myricx Bio, x: 4, y: 2, detail: "NMTi-ADC platform and preclinical candidate disclosures; no human efficacy in assigned sources"}
        - {label: Pacylex, x: 4, y: 4, detail: "NMTi mechanism with Phase 1/2 AML study and clinical lead"}
        - {label: HER2 ADCs, x: 2, y: 5, detail: "Validated target and clinical outcomes, but established payload/target strategy"}
        - {label: Topo-1 payloads, x: 2, y: 4, detail: "Incumbent payload class with market presence and clinical precedent"}
        - {label: Tubulin payloads, x: 2, y: 4, detail: "Incumbent payload class referenced as a comparator"}
        - {label: Internal pharma build, x: 3, y: 4, detail: "Scale and development infrastructure are plausible advantages, but program evidence is not public"}
callouts:
  - calloutType: strength
    title: Orthogonal mechanism is the investable differentiator
    body: Myricx's clearest competitive claim is a payload mechanism distinct from dominant TOPO-1 and tubulin classes, with partner-reported activity in multiple solid-tumor models.
    claimRefs: [CP003, CP009]
  - calloutType: risk
    title: Clinical-stage NMT competition narrows the moat
    body: Pacylex has already described a Phase 1/2 clinical study for an NMT inhibitor and identifies additional NMTis as potential ADC payloads, so Myricx must prove construct-level and clinical differentiation.
    claimRefs: [CP001, CP012]
  - calloutType: recommendation
    title: Underwrite portability, not novelty alone
    body: The next diligence gate should be matched, antigen-diverse evidence linking NMTi chemistry to therapeutic-window and resistance advantages over incumbent payloads.
    claimRefs: [CP006, CP007, CP011]
