      - [Cancer Research Horizons, investor / translational partner, participation in Myricx Series A, "Financing participation; not a customer deployment", "Capital and translational ecosystem access", "No customer outcome or retained-use evidence disclosed"]
      - [Novo Holdings and Abingworth, lead investors, Series A financing and board participation, "Financing and governance; not customer deployment", "Resources for laboratories, R&D team, and clinical progression", "No recurring revenue or retention evidence disclosed"]
    notes: "This is a partial enumeration of named counterparties in the retained sources, not a customer list; each row distinguishes financing or ownership from production use."
    claimRefs: [CU010, CU011, CU012, CU013]
