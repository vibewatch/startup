  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: adoption
      missingEvidence: Executed licensing, collaboration, or customer contracts showing counterparties, economics, stage, and rights.
      whyItMatters: Without contracts, strategic ownership and investor participation cannot be separated from commercial customer demand.
      diligencePath: Request the complete partner and license schedule, including active, terminated, and contingent relationships.
      relatedQuestionRefs: [QU002, QU005, QU006]
    - type: missing-source
      severity: blocking
      topic: retention
      missingEvidence: Clinical and commercial longitudinal metrics including enrollment, response, safety, renewal, repeat use, and revenue by relationship.
      whyItMatters: The current record cannot establish product-market fit, durability, or expansion.
      diligencePath: Obtain a construct-level clinical package and a customer/partner cohort schedule with denominators and dates.
      relatedQuestionRefs: [QU003, QU004, QU008]
    - type: enumeration-incomplete
      severity: material
      topic: customer-proof
      missingEvidence: A complete list of named development partners, sites, licensees, and any external users.
      whyItMatters: The retained named-counterparty list is dominated by investors and a strategic owner, so concentration and reference quality remain uncertain.
      diligencePath: Reconcile the counterparty register to board minutes, business-development records, and clinical-site agreements.
      relatedQuestionRefs: [QU005, QU006]
      relatedTableRefs: [TU003]
