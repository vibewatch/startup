company:
  name: Myricx Bio
chapter:
  number: 6
  title: Customers
  summary: Myricx Bio has a differentiated oncology payload platform and strategic validation from investors and its Novartis ownership transition, but the retained evidence does not establish a commercial customer base, recurring revenue, retention, or production deployments. The customer thesis is therefore an addressable-workflow and partnering thesis rather than a demonstrated adoption thesis.
sections:
  - id: buyer-and-user-map
    title: Buyer, user, and payer map
    body: Myricx is a pre-commercial biotechnology developer rather than a software or services vendor with disclosed paying accounts. Its immediate economic counterparties are biopharma developers and strategic acquirers that can license, develop, manufacture, and commercialize antibody-drug conjugates; the ultimate users are oncology patients and treating clinicians, while payers and health systems would matter only after a medicine is approved. Myricx describes itself as focused on discovery and development of NMT-inhibitor payloads for ADCs, and its 2024 financing announcement says the company was building laboratories and an in-house R&D team rather than reporting customer contracts. The Novartis ownership statement confirms a strategic-owner relationship, but it is not evidence of recurring customer revenue or a launched product. Customer segmentation is therefore organized around development counterparties, clinical users, and eventual treatment channels, with scale and revenue fields left unverified.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: The strongest adoption signal is progression of the platform toward clinical development and the ability to attract new life-science investors, not measured customer usage. The 2024 financing source states that funds would advance NMTi-ADCs toward clinical proof of concept and establish London laboratory operations; it does not disclose active customers, contracted accounts, renewal rates, net revenue retention, repeat purchases, utilization, or paid deployments. External oncology and ADC sources establish that breast-cancer care, B7-H3 programs, and other ADC platforms address clinically meaningful treatment workflows, but they do not validate Myricx adoption. A durable customer thesis would require construct-level clinical progress, named development or licensing counterparties, and longitudinal evidence that any partnership expands beyond a one-time strategic transaction.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-concentration
    title: Named proof, expansion, and concentration
    body: Named counterparties in the retained material are investors and strategic ecosystem participants, not disclosed commercial customers. The Series A announcement names Novo Holdings, Abingworth, British Patient Capital, Cancer Research Horizons, Eli Lilly, Brandon Capital, and Sofinnova Partners, and says Novo and Abingworth representatives joined the board. That is evidence of financing and governance participation, while the company announcement describes preclinical efficacy and a planned move into clinical development; neither proves a customer deployment or outcome. The later ownership statement identifies Novartis as the owner from August 28, 2026, creating strategic concentration in one parent and making future external partnering, internal portfolio priority, and development funding important diligence questions. Competitor ADC programs illustrate that oncology customers can have alternatives, so Myricx must demonstrate differentiated clinical value rather than rely on platform novelty alone.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
callouts:
  - calloutType: strength
    title: Strategic validation is stronger than commercial proof
    body: Investor participation, planned clinical progression, and Novartis ownership support strategic interest, but the evidence does not show paying customers, active deployments, or retention.
    claimRefs: [CU005, CU010, CU013]
  - calloutType: risk
    title: Customer concentration and proof gap
    body: With no disclosed recurring customer base and a strategic owner now controlling the company, customer durability and external demand remain unverified.
    claimRefs: [CU003, CU007, CU012]
  - calloutType: recommendation
    title: Request construct-level partnering and clinical evidence
    body: Diligence should obtain executed collaboration terms, development milestones, clinical enrollment and response data, and evidence of any external customer or partner expansion beyond the Novartis transaction.
    claimRefs: [CU008, CU012, CU013]
