evidenceGaps:
  - type: stale
    severity: material
    topic: acquisition-status
    missingEvidence: >-
      An executed transaction-closing announcement or regulatory filing confirming whether the Novartis acquisition
      completed.
    whyItMatters: >-
      Upfront consideration, ownership, governance, and the company's current operating identity depend on closing
      status.
    diligencePath: Obtain Novartis, Myricx, or applicable regulatory closing disclosures dated on or before the run date.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: private-metrics
    missingEvidence: Current standalone cash, burn, debt, headcount, revenue, cap table, and customer or partnership metrics.
    whyItMatters: The announced financing and acquisition amounts do not establish liquidity, operating scale, or obligations.
    diligencePath: >-
      Request management accounts, capitalization table, debt schedule, employee roster, and transaction data room
      materials.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: access-blocked
    severity: minor
    topic: access-blocked
    missingEvidence: A readable independent profile from The Pharma Letter rather than the retained consent-preference page.
    whyItMatters: >-
      The source may provide an additional independent leadership or milestone cross-check, but it is not needed for the
      retained core claims.
    diligencePath: Retrieve a directly readable article or an equivalent independent profile without relying on the blocked page.
    relatedQuestionRefs:
      - QO003
      - QO006
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: A complete current board, executive, ownership, and control-rights register.
    whyItMatters: Named leaders and investors do not establish present control, succession coverage, or key-person mitigation.
    diligencePath: Request the current board minutes, shareholder register, option schedule, and executive organization chart.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: clinical-readiness
    missingEvidence: >-
      IND-enabling toxicology, linker behavior, first-in-human starting-dose rationale, and current clinical-entry
      status.
    whyItMatters: >-
      The strategic price validates interest in the platform but does not establish clinical efficacy, safety, or
      development probability.
    diligencePath: >-
      Request the lead-construct development plan, preclinical package, regulatory interactions, and clinical trial
      timeline.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: Construct-level clinical and commercial data that isolate the reachable B7-H3 and HER2 payload opportunity.
    whyItMatters: Broad ADC market estimates cannot establish Myricx's SAM, SOM, or platform revenue potential.
    diligencePath: >-
      Obtain management's target-by-target epidemiology, development plan, partnering assumptions, and risk-adjusted
      revenue model.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: adoption
    missingEvidence: >-
      Clinical, CMC, and payer evidence showing the NMTi payload can achieve a differentiated therapeutic index and be
      manufactured at scale.
    whyItMatters: Those evidence points determine whether strategic interest converts into clinical adoption and economics.
    diligencePath: >-
      Request the IND-enabling package, construct comparability data, manufacturing plan, and proposed reimbursement
      assumptions.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: sizing
    missingEvidence: A harmonized market definition and source methodology reconciliation for the different 2025-2033 ADC forecasts.
    whyItMatters: >-
      Published estimates range materially and could otherwise create false precision in valuation or market-share
      analysis.
    diligencePath: >-
      Reconcile publisher definitions, revenue bases, geographies, and forecast periods before using a single planning
      case.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: comparative-efficacy
    missingEvidence: >-
      Matched head-to-head efficacy, safety, and resistance data for Myricx NMTi-ADCs versus TOPO-1 and tubulin ADC
      controls.
    whyItMatters: >-
      Without matched controls, platform novelty cannot be translated into a durable buyer advantage or valuation
      premium.
    diligencePath: >-
      Request blinded preclinical study reports with matched antibodies, antigens, linker designs, drug-to-antibody
      ratios, and statistical analysis.
    relatedQuestionRefs:
      - QP004
      - QP006
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: translation
    missingEvidence: >-
      Current IND, trial-registration, and first-in-human status for Myricx's lead NMTi-ADC after the expected 2026
      clinical entry.
    whyItMatters: >-
      Pacylex already has a Phase 1/2 NMT program, so timing and human validation materially affect relative competitive
      position.
    diligencePath: Verify ClinicalTrials.gov, MHRA, and company disclosures, then obtain the clinical development plan.
    relatedQuestionRefs:
      - QP002
      - QP008
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Platform licensing, milestone, royalty, and co-development terms for Myricx and relevant ADC payload peers.
    whyItMatters: Competitive strength is monetized through partnering economics rather than a transparent product price.
    diligencePath: Obtain executed or redacted partnering agreements and comparable payload-platform transactions.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Latest management accounts, cash balance, monthly burn, runway, debt, leases, commitments, and cap table.
    whyItMatters: >-
      Without these inputs, the reviewer cannot determine whether the pre-close company was solvent, how much Series A
      capital remained, or what obligations could reduce proceeds.
    diligencePath: >-
      Request the latest management accounts, bank statements, cash bridge, debt schedule, cap table, and board-approved
      operating plan under NDA.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: monetization
    missingEvidence: >-
      Definitive acquisition agreement, milestone definitions, probabilities, payment timing, taxes, fees, and
      accounting treatment.
    whyItMatters: >-
      Up to $1.5 billion is not a risk-adjusted cash value when $400 million is described as potential milestones and
      closing remains conditional in the assigned source.
    diligencePath: Obtain the signed transaction documents and management's probability-weighted consideration bridge.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
