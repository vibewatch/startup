callouts:
  - calloutType: strength
    title: Strategic validation is visible
    body: The proposed Novartis consideration and the Series A demonstrate financing and strategic interest in the platform, but neither substitutes for clinical or operating proof.
    claimRefs: [CI002, CI003, CI005]
  - calloutType: risk
    title: Liquidity and milestone economics remain opaque
    body: Public evidence does not disclose cash, burn, runway, debt, milestone probabilities, or net proceeds, preventing a conventional standalone underwriting model.
    claimRefs: [CI009, CI010, CI011, CI014]
  - calloutType: recommendation
    title: Request the pre-close finance pack
    body: Obtain the latest management accounts, cash bridge, cap table, transaction agreement, milestone schedule, and development budget before treating the announced maximum value as realized economics.
    claimRefs: [CI003, CI011, CI014]
