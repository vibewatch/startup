company:
  name: Myricx Bio
chapter:
  number: 4
  title: Financials
  summary: Myricx Bio's public financial evidence is dominated by a £90 million 2024 Series A and a proposed Novartis acquisition worth up to $1.5 billion, including $1.1 billion cash upfront and potential milestones. No public source in the assigned pool discloses standalone revenue, gross margin, cash, burn, runway, realized pricing, or debt, so underwriting remains transaction- and science-led rather than operating-metric-led.
sections:
  - id: financing-and-transaction
    title: Financing and transaction economics
    body: >-
      The clearest public financing datapoint is the £90 million Series A announced in 2024,
      described by Imperial as one of the largest Series A rounds ever raised by a European
      academic biotech spinout. Imperial says the round enabled Myricx Bio to scale operations,
      expand its team, and advance its pipeline; the assigned Cancer Research Horizons page is
      a reserve source for that financing but is not used here because the chapter can satisfy its
      source floor without it. The July 2026 proposed Novartis transaction is a different
      economic object from funding: Imperial reports up to $1.5 billion, including $1.1 billion
      cash upfront plus potential milestone payments, while the company's paid release uses the
      same terms. The headline value therefore should not be treated as cash available to the
      pre-close company, recurring revenue, or realized exit proceeds. The transaction was
      expected to close in H2 2026 subject to customary closing conditions, including regulatory
      approvals, so the public record supports an announced consideration structure rather than
      a completed cash receipt as of the source dates.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: revenue-and-unit-economics
    title: Revenue model and unit economics
    body: >-
      Myricx Bio's disclosed operating model is preclinical drug discovery and development,
      not a commercial software or marketplace model. The public descriptions identify a
      proprietary NMTi payload platform and two lead ADC assets directed at B7-H3 and HER2,
      but the assigned evidence does not disclose product sales, licensing receipts, contract
      economics, customer count, clinical utilization, gross margin, or a recognized revenue
      stream. The most defensible financial interpretation is therefore a capital-consuming R&D
      platform with potential future value from partnering or acquisition, not an underwritten
      revenue business. The Novartis announcement frames the economics as cash upfront plus
      contingent milestones, which implies a material distinction between fixed consideration
      and development-dependent upside; it does not reveal milestone probabilities, payment
      timing, accounting treatment, or net proceeds to shareholders. Official Novartis results
      provide context for the buyer's scale, but they do not establish Myricx Bio's revenue
      quality or unit economics.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy-and-underwriting
    title: Capital adequacy and underwriting blockers
    body: >-
      Capital adequacy cannot be calculated from the assigned public evidence. Companies House
      shows the legal entity's last accounts made up to 31 July 2025 and next accounts due by
      30 September 2027, but the overview page excerpt does not provide cash, liabilities,
      burn, or debt balances. The announced acquisition was still conditional on closing
      conditions in the Imperial account, and the company's acquisition release is explicitly a
      paid press release; neither source supplies a standalone balance sheet or a bridge from
      Series A proceeds to remaining cash. ADC comparables show why future capital requirements
      can be substantial: Pfizer's completed Seagen acquisition was approximately $43 billion,
      while BioMed Nexus describes ADC manufacturing as requiring specialized antibody, payload,
      linker, and safety capabilities and identifies safety, manufacturing capacity, and pricing
      as persistent challenges. Those comparables are contextual rather than forecasts for
      Myricx Bio. The financial verdict is therefore strategically validated but operationally
      under-disclosed: diligence should obtain the pre-close cash balance, monthly burn, debt and
      obligations, cap table, milestone schedule, and post-close accounting treatment before
      assigning value to contingent consideration.
    claimRefs: [CI011, CI012, CI013, CI014]
    tableRefs: []
tables:
  - id: TI001
    title: Financing and transaction terms
    columns: [Event, Period/status, Amount or terms, Financial interpretation, Diligence ask]
    rows:
      - [Seed financing, "2019", "Seed funding from Brandon Capital and Sofinnova Partners", "Capital supported company formation; amount is not disclosed in the assigned sources", "Obtain round size, ownership, preference stack, and use of proceeds"]
      - [Series A, "2024", "£90 million", "Company-building and R&D capital; not revenue or current cash", "Reconcile proceeds to historical burn, current cash, and remaining obligations"]
      - [Novartis acquisition, "Announced 2026-07-06; expected close H2 2026", "Up to $1.5 billion, including $1.1 billion cash upfront plus potential milestones", "Announced consideration; headline value includes contingent upside and is not cash available before closing", "Obtain definitive agreement, milestone schedule, closing status, taxes, fees, and shareholder proceeds"]
      - [Legal-entity accounts, "Last made up 2025-07-31", "Next accounts due 2027-09-30", "Filing timetable confirms an accounts record but not liquidity", "Review filed accounts, notes, liabilities, and post-balance-sheet events"]
    notes: "Amounts and dates are source-reported; the acquisition figure is announced maximum consideration, not recognized revenue or confirmed cash received."
    claimRefs: [CI001, CI002, CI003, CI004, CI011]
  - id: TI002
    title: Revenue and monetization evidence
    columns: [Potential stream, Mechanism or unit, Public value/status, Quality, Diligence ask]
    rows:
      - [Product sales, "Approved ADC product units", null, "Unavailable; pipeline is described as preclinical", "Obtain product-by-product clinical and regulatory status and launch assumptions"]
      - [Licensing or partnering, "Upfronts, milestones, royalties", "Potential milestone payments appear in the announced acquisition terms", "Company/academic announcement; contingent and not quantified by milestone", "Obtain transaction agreement and any retained royalty or earn-out rights"]
      - [Research funding, "Equity financing", "£90 million Series A in 2024", "Historical financing, not operating revenue", "Obtain cap table, investor rights, and use-of-funds schedule"]
      - [Acquisition consideration, "Cash upfront plus milestones", "Up to $1.5 billion; $1.1 billion cash upfront", "Announced consideration subject to closing conditions", "Confirm closing, accounting recognition, taxes, and net proceeds"]
    notes: "Null values mean no public value was found in the assigned successful source text; they do not imply zero revenue or zero consideration."
    claimRefs: [CI002, CI003, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, null, low, "No public revenue figure supports a quality or growth assessment", "Obtain audited revenue, licensing receipts, and recognition policy"]
      - [Gross margin, null, low, "Payload and ADC economics cannot be assessed without cost of goods and manufacturing terms", "Obtain COGS, CDMO terms, batch economics, and transfer pricing"]
      - [Cash on hand, null, low, "The acquisition headline does not establish pre-close liquidity", "Obtain latest bank balances and restricted-cash schedule"]
      - [Burn and runway, null, low, "Series A size does not reveal remaining runway", "Obtain monthly cash burn, hiring plan, and scenario runway"]
      - [Debt and obligations, null, low, "Conditional closing and development work may carry obligations not visible in announcements", "Obtain debt, leases, license payments, commitments, and change-of-control terms"]
      - [Milestone probability, null, low, "Contingent consideration could be material but is not risk-adjusted publicly", "Obtain milestone definitions, probability assumptions, and payment timing"]
    notes: "Unavailable metrics are deliberately null; each null has a specific diligence request and must not be converted into a zero or estimate."
    claimRefs: [CI006, CI008, CI009, CI010, CI011, CI014]
