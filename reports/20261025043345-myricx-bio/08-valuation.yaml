    title: Recommendation logic from evidence to entry discipline
    type: flow
    summary: "The sequence separates scientific and strategic validation from the evidence required to underwrite a new entry price."
    data:
      nodes:
        - id: public-science
          label: "Public science"
          detail: "Peer-reviewed NMT biology supports mechanism relevance."
        - id: funded-platform
          label: "Funded platform build"
          detail: "$114 million Series A targeted platform and clinical-proof development."
        - id: strategic-price
          label: "Strategic validation"
          detail: "$1.1 billion upfront and up to $400 million contingent consideration are reported."
        - id: clinical-gap
          label: "Clinical evidence gap"
          detail: "The assigned public evidence does not include a human clinical package for Myricx constructs."
        - id: structure-gap
          label: "Return-model gap"
          detail: "Cap table, preferences, dilution, closing adjustments, and milestone definitions are private."
        - id: decision
          label: "Research more / track"
          detail: "Require deal documents and human data before price-specific underwriting."
    approximationNotes: "This is a qualitative decision sequence; node order is not a probability or value scale."
    claimRefs: [CV005, CV007, CV008, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Strategic validation is real, but a reported acquisition headline is not a reusable entry
      valuation. Hold the recommendation at research more / track until transaction mechanics
      and clinical evidence support a return model.
    claimRefs: [CV001, CV002, CV016]
  - calloutType: risk
    title: No defensible public valuation floor
    body: >-
      The assigned evidence supports an upside ceiling and peer references, but not a standalone
      downside floor. A precise bear-case value would be invented.
    claimRefs: [CV014, CV016]
