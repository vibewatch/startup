company:
  name: Myricx Bio
chapter:
  number: 8
  title: Valuation
  summary: >-
    The disclosed Novartis agreement provides a $1.1 billion upfront and up-to-$1.5 billion
    strategic exit reference, but it does not establish a transferable standalone valuation
    for a new investor. Public evidence supports a research-more or track posture: Myricx has
    differentiated scientific signals and a premium strategic outcome, while the reviewed
    record lacks the private deal documents, investor return waterfall, and human clinical
    package required for a price-specific underwriting.
sections:
  - id: decision-frame
    title: Decision frame and recommendation
    body: >-
      The decision is not whether Myricx attracted strategic interest; the disclosed transaction
      already answers that question. Invest Europe reports an agreement worth up to $1.5 billion,
      including $1.1 billion in cash upfront and as much as $400 million in milestones. The
      investable question is whether that headline can be reused as a fair-value mark or entry
      price. It cannot. The reviewed evidence does not disclose closing adjustments, milestone
      definitions, liquidation preferences, ownership at exit, or the distribution of proceeds.
      Accordingly, the recommendation is research more / track, with medium confidence and high
      risk. Any new underwriting at a headline-equivalent price should wait for transaction
      documents, construct-level human data, and a cap-table waterfall. This is price discipline,
      not a negative judgment on the platform.
    claimRefs: [CV001, CV002, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-proof
    title: Financing context, proof, and anti-thesis
    body: >-
      Myricx entered the strategic process from a well-funded but still evidence-sensitive
      position. Cancer Research Horizons reported a £90 million ($114 million) Series A intended
      to build the NMTi payload platform and advance NMTi-ADCs through clinical proof of concept;
      Invest Europe reports £104 million of total seed and Series A funding. The official
      publications page lists a 2025 Cell Reports paper on MYC deregulation and NMT inhibition,
      which supports biological relevance but is not a substitute for a clinical safety,
      pharmacokinetic, or efficacy package for the acquired constructs. The anti-thesis is
      therefore straightforward: strategic scarcity and preclinical differentiation may have
      driven the price before clinical risk was retired. Evidence from failed or modestly active
      peer ADC programs shows that linker-payload promise does not eliminate therapeutic-index
      and efficacy risk.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV014]
    tableRefs: [TV002]
  - id: comparable-calibration
    title: Comparable calibration and entry discipline
    body: >-
      Comparable transactions are useful only after adjusting for development stage, acquired
      scope, and guaranteed versus contingent value. Gilead's Tubulis agreement offers the
      clearest current contrast: $3.15 billion upfront plus up to $1.85 billion contingent for a
      company whose lead asset was already in Phase 1b/2 and whose second program had initial
      clinical data. Earlier transactions cited by Nature include $2.0 billion for Ambrx, whose
      lead asset was in Phase 2, and $1.8 billion for ProfoundBio with three clinical-stage
      candidates. Those references do not mechanically value Myricx; they show why a
      clinical-stage premium and platform breadth must be separated from headline deal size.
      A consultancy's proprietary phase benchmarks are retained only as a low-confidence
      sensitivity, not an independent valuation verdict.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV015]
    tableRefs: [TV003]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and thesis-break triggers
    body: >-
      The bull case is a completed acquisition followed by milestone achievement and clinical
      translation of the NMTi-ADC platform; its observable ceiling is the disclosed $1.5 billion
      headline, not an independently appraised intrinsic value. The base case treats the
      $1.1 billion upfront as evidence of strategic willingness to pay while withholding a
      standalone valuation range until deal mechanics and human data are available. The bear case
      is milestone non-payment or clinical failure, for which the public record supplies no
      defensible valuation floor. Thesis-break triggers are a failure to close, materially
      narrower milestone eligibility than the headline suggests, dose-limiting toxicity,
      insufficient efficacy at tolerated exposure, or inability to reproduce activity across
      antibody contexts. Final diligence should obtain the purchase agreement, closing evidence,
      cap table and preference waterfall, milestone schedule, and full IND-enabling and early
      clinical package before assigning a target return.
    claimRefs: [CV001, CV002, CV007, CV008, CV009, CV014, CV016]
