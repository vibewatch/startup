  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, "Research more / track", "Do not treat strategic validation as de-risked investability."]
      - [Confidence, Medium, "Transaction terms are reported, but decisive private documents are absent."]
      - [Risk rating, High, "Clinical translation, contingent consideration, and deal-close uncertainty remain material."]
      - [Valuation stance, "Stretched / opaque for a new headline-equivalent entry", "Require a discount or milestone-linked structure until the evidence gaps close."]
      - [Return target, "Not supportable from public evidence", "Model returns only after ownership, preferences, dilution, taxes, and timing are disclosed."]
      - [Exit path, "Strategic acquisition agreement", "Verify closing and the conditions attached to the $400 million contingent component."]
    notes: "Assessments distinguish reported transaction consideration from standalone fair value; no investor return is inferred from funding raised."
    claimRefs: [CV001, CV002, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "A 2025 peer-reviewed paper listed by Myricx links MYC deregulation to sensitivity to NMT inhibition.", "Construct-level human pharmacology and efficacy would convert mechanism evidence into clinical proof."]
      - [Thesis, "The $114 million Series A funded platform build-out and progression toward clinical proof of concept.", "Evidence that capital did not produce an IND-ready package would weaken execution confidence."]
      - [Thesis, "The disclosed Novartis agreement includes $1.1 billion upfront consideration.", "Failure to close or a materially different final consideration would weaken strategic-price validation."]
      - [Anti-thesis, "The reviewed Myricx materials do not provide human clinical results for the acquired constructs.", "Auditable first-in-human safety, exposure, and response data would reduce this gap."]
      - [Anti-thesis, "Peer ADC programs have been discontinued or described as only modestly active despite platform rationale.", "A reproducible therapeutic window across targets would reduce modality-specific downside."]
      - [Anti-thesis, "Public sources do not disclose ownership, preferences, or the proceeds waterfall.", "The final cap table and transaction waterfall are required to estimate realized investor returns."]
    notes: "The anti-thesis records missing evidence and peer modality failures; it does not infer that Myricx experienced the same outcomes."
    claimRefs: [CV002, CV003, CV004, CV005, CV007, CV014, CV016]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Acquisition closes; milestones are achievable; NMTi-ADC activity translates clinically across more than one antibody context.", "The disclosed $1.5 billion maximum is a transaction ceiling, not a new-money valuation range; target return remains unavailable without ownership and timing.", "Qualitative only; no defensible numeric probability in the reviewed sources.", "Milestone eligibility narrows or clinical translation is target-specific."]
      - [Base, "The $1.1 billion upfront consideration is paid, while clinical and milestone uncertainty persists.", "Use the upfront amount as evidence of strategic willingness to pay, not as independently verified intrinsic value.", "Most evidence supports strategic validation but not price-independent underwriting.", "Closing delay, adverse adjustments, or failure to obtain the clinical package."]
      - [Bear, "Transaction fails to close, contingent payments are not earned, or safety / efficacy prevents development.", "No public evidence supports a valuation floor; downside could be severe and should not be assigned false precision.", "Peer ADC failures establish plausible modality downside, not a Myricx-specific failure rate.", "Dose-limiting toxicity, inadequate efficacy at tolerated exposure, or inability to reproduce activity."]
    notes: "Scenario values are limited to disclosed transaction anchors; probabilities, standalone ranges, and investor returns are intentionally left unquantified."
    claimRefs: [CV001, CV002, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
