company:
  name: Myricx Bio
chapter:
  number: 1
  title: Company Overview
  summary: Myricx Bio is a London-based biotechnology company developing preclinical antibody-drug conjugates that use N-myristoyltransferase inhibitor payloads. Its announced acquisition by Novartis values the transaction at up to $1.5 billion, but the evidence remains preclinical and the closing, clinical translation, and standalone operating metrics are not established in the retained sources.
sections:
  - id: identity-and-platform
    title: Identity and platform
    body: "Myricx Bio is described by Novartis and the company announcement as a privately held, UK-headquartered biotechnology company focused on a new class of antibody-drug conjugate payloads. The platform uses N-myristoyltransferase inhibitors, with lead ADC assets directed at B7-H3 and HER2. The retained evidence consistently describes the pipeline as preclinical rather than clinical. The scientific proposition is differentiated payload biology, not a demonstrated clinical product: Novartis says the payload is designed to address limitations of commonly used TOPO-1 and tubulin payload classes, while its own release qualifies potential activity and clinical validation. Myricx was spun out of Imperial College London and the Francis Crick Institute, and the company announcement names Professor Ed Tate, Dr Roberto Solari, and Dr Andrew Bell as founders. London is the only location established by the retained sources; no independently verified headcount, revenue, customer, or product-commercialization metric is available."
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and dependence
    body: The leadership record shows a transition from founder-led scientific formation toward a more execution-oriented biotech team. The financing announcement identifies Robin Carr as CTO and says he joined from GSK in 2019, spearheading the pivot from small-molecule NMT inhibitors toward ADC payloads. The later transaction announcement identifies Mohit Rawat as CEO, joining in 2025 to steer preclinical development and the next stage of growth. The retained financing text also names an independent non-executive chair, Chris Martin, and scientific and clinical leaders Francesca Zammarchi and Robert McCleod. Novo Holdings and Abingworth representatives joined the board in connection with the Series A. This supports functional coverage across science, ADC development, clinical planning, and financing, but the evidence does not provide a complete current board roster, ownership table, succession plan, or formal key-person mitigation. The platform remains dependent on translating founder-originated NMT biology into a clinically viable ADC portfolio.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002]
  - id: financing-and-milestones
    title: Financing, transaction, and milestones
    body: Myricx raised a £90 million Series A, reported as approximately $114 million, with Novo Holdings and Abingworth co-leading and British Patient Capital, Cancer Research Horizons, Eli Lilly, Brandon Capital, and Sofinnova Partners participating. The financing was earmarked for the NMTi ADC platform and clinical proof-of-concept preparation, not reported as revenue or cash on hand. Novartis subsequently announced an agreement to acquire Myricx for $1.1 billion upfront and up to $400 million in potential milestone payments, for a headline value of up to $1.5 billion. The transaction was expected to close in the second half of 2026 subject to customary conditions including regulatory approvals; the retained evidence does not verify completion. The sequence from 2019 spinout, 2023 preclinical presentations and team expansion, 2024 Series A, 2025 CEO appointment, and 2026 acquisition agreement is supported, while clinical entry, cash balance, burn, debt, cap table, and realized consideration remain open diligence items.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
