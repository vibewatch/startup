  - calloutType: insight
    title: Strategic scarcity is validated, not clinical de-risking
    body: "Novartis's announced acquisition supports strategic demand for differentiated ADC payloads, but the source material describes Myricx's pipeline as preclinical and does not establish approved-product revenue or a company-specific market share."
    claimRefs: [CM002, CM010, CM014]
  - calloutType: risk
    title: Sizing uncertainty is material
    body: "Public ADC estimates range from approximately USD 15 billion to USD 16.53 billion for 2025 and use different scopes; a defensible Myricx SAM/SOM requires construct-level clinical and partnering evidence that is not public in the assigned sources."
    claimRefs: [CM005, CM006, CM007, CM014]
