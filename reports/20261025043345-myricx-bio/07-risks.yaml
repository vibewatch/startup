      - [Biology does not generalize across antigens or tumour contexts, "Two lead antigen contexts are named, while the company describes multiple solid-tumour models (SR002); no human validation retained.", Medium, Critical, Early, "High before clinical proof of concept.", "Test matched constructs across antigen density, tumour type, and patient-derived material."]
      - [Acquired ADC resistance or off-target toxicity, "Review documents resistance through antigen, trafficking, release, and efflux mechanisms and notes dosing is limited by adverse effects (SR005).", Medium, High, Partial, "High pending exposure and repeat-dose toxicology.", "Obtain safety pharmacology, tissue distribution, resistance monitoring, and dose-interruption rules."]
      - [Virtual-to-in-house R&D execution, "Series A release describes a planned transition to own laboratories and in-house R&D (SR007).", Medium, High, Developing, "Medium-high during buildout and hiring.", "Verify facilities, quality systems, key hires, vendor qualification, and milestone delivery."]
    notes: "The register separates observed source facts from residual-risk judgments; no retained source confirms a security incident, product outage, or manufacturing failure."
    claimRefs: [CR001, CR003, CR009, CR010, CR011]
