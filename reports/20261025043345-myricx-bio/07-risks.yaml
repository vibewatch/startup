      - [Regulatory authorities, "UK and U.S. biotechnology and medicines regulators", "Approval or IND-enabling requirements delay or prevent clinical entry.", Critical, "Use formal regulatory plan and documented agency interactions.", "High because company-specific status is not retained.", "Obtain regulatory correspondence and submission calendar."]
      - [ADC development and manufacturing ecosystem, "Antibody, linker, conjugation, analytical, and CRO/CDMO providers", "Assay, supply, or comparability failure delays candidate selection or clinical material.", High, "Dual-source critical activities and lock specifications early.", "Medium-high; supplier concentration is undisclosed.", "Request vendor map, capacity commitments, quality agreements, and costed plan."]
      - [Capital and operating disclosures, "Company and new owner", "Unseen burn, obligations, or working-capital needs constrain development choices.", High, "Reconcile financing, transaction proceeds, budget, and obligations.", "High because standalone financial data are absent.", "Obtain cash, burn, debt, commitments, and cap-table/consideration detail."]
    notes: "Partner and financial exposures are risk assessments, not claims that a counterparty has failed. Funding raised and transaction consideration are not treated as cash available for operations."
    claimRefs: [CR007, CR008, CR009, CR012]
