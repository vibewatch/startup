  - id: TP004
    title: "Moat Durability and Competitive Risk Register"
    columns:
      - Moat Claim
      - Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - Proprietary autonomous-lab experimental data flywheel
        - CuspAI and others also accumulate proprietary materials datasets; open-access GNoME structures partially commoditize baseline predictions
        - High
        - "Verify Periodic's experimental data generation rate, dataset uniqueness, and evidence that proprietary data materially outperforms public baselines in discovery yield"
      - - Elite founding-team talent moat (Fedus/Cubuk from OpenAI/DeepMind)
        - Large AI labs (Google, OpenAI, Microsoft) can recruit equivalent talent and redirect to materials AI; FutureHouse and Isomorphic also recruited from same pool
        - Medium
        - "Track whether founding team composition translates to defensible IP or just temporary brand advantage; assess equity retention and retention risk at 20+ hires"
      - - Early commercial traction with semiconductor industry
        - Schrödinger, Citrine, and Microsoft already have established semiconductor-industry relationships and distribution
        - High
        - "Identify contract scope, exclusivity, and renewal pipeline; confirm whether semiconductor revenue covers operating costs or is still pre-commercial"
      - - Vertical integration across AI model + robotics + data
        - Lab-OS orchestration startups (Automata, Synthace, UniteLabs) provide modular alternatives that decouple AI from hardware; Schrödinger Bunsen AI may achieve agentic science without physical lab investment
        - High
        - "Monitor whether enterprise customers prefer Periodic's closed stack or mix-and-match orchestration; assess if vertical integration is a moat or a capex burden"
      - - Capital advantage ($300M seed; $500M+ Series A talks)
        - Schrödinger holds $406M cash and Recursion $665M; CuspAI has $130M+ with unicorn-round talks; capital alone is not a moat at these levels
        - Medium
        - "Assess burn rate vs. Recursion's $560M annual loss precedent; require disclosure of cash runway and revenue ramp timeline"
      - - Absence of equivalent autonomous-lab peer at materials scale
        - "Emerging: Atinary launched first SDL in 2026; Chemify/Chemifarm offers chemistry-as-code network; A-Lab (Berkeley) validated fully autonomous materials synthesis"
        - Medium
        - Confirm whether Berkeley A-Lab, Chemify, or well-funded academic consortia could replicate Periodic's lab capacity without the startup cost structure
      - - Network effects from academic grant program
        - FutureHouse and academic cloud labs (Emerald, CMU) provide similar open-science academic engagement at lower cost to academics
        - Low
        - Assess whether academic grant program converts to commercial customers or primarily serves PR
    notes: >
      Severity ratings are qualitative assessments based on publicly available evidence.
      "High" indicates the threat has evidence of active near-term competitive activity.
      "Medium" indicates credible but not-yet-materialized threat. Diligence asks represent
      unresolved questions requiring private-company data to resolve.
