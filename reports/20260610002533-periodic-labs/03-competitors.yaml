  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Periodic Labs commercial revenue
      missingEvidence: "Periodic Labs revenue, contract count, and semiconductor customer terms are entirely undisclosed; the company has confirmed commercial engagement but no financial details."
      whyItMatters: "Without revenue data, it is impossible to assess whether commercial traction is meaningful ($1M vs. $10M+) or pre-revenue, which significantly affects the valuation analysis and moat assessment."
      diligencePath: "Request management accounts showing quarterly revenue, contract pipeline, and customer renewal rates directly from the company."
      relatedQuestionRefs: [QP008]

    - type: missing-source
      severity: material
      topic: Periodic Labs experimental throughput
      missingEvidence: "No independent benchmark or third-party validation of Periodic Labs' autonomous lab throughput, discovery yield, or comparison against DeepMind's A-Lab or CuspAI's prediction pipeline."
      whyItMatters: "The company's entire moat claim rests on generating superior proprietary data faster than competitors; without throughput benchmarks, the data-flywheel thesis is unverified."
      diligencePath: "Request lab operational metrics (experiments per day, material synthesis success rate, data generation rate per lab) and compare against A-Lab's published 41/58 compounds over 17 days."
      relatedQuestionRefs: [QP021]

    - type: private-evidence-only
      severity: material
      topic: Periodic Labs autonomous lab autonomy level
      missingEvidence: "No independent assessment of Periodic Labs' actual lab autonomy level (TRL scale, percentage of experiments requiring human intervention, closed-loop cycle time)."
      whyItMatters: "Most competitors claim autonomous operation but operate at Level 2-3; if Periodic operates similarly, its moat claim vs. orchestration-layer alternatives is significantly weaker."
      diligencePath: "Commission an independent lab-visit technical audit comparing Periodic's automation stack against industry TRL assessments from robotics analysts."
      relatedQuestionRefs: [QP012, QP014]

    - type: missing-source
      severity: material
      topic: Schrödinger Bunsen AI full capability disclosure
      missingEvidence: "Bunsen AI co-scientist was announced as summer 2026 but full capability specification, benchmark performance, and materials science scope were not publicly disclosed as of June 2026."
      whyItMatters: "If Bunsen matches Periodic's AI-scientist capability on top of Schrödinger's established simulation platform and customer base, Schrödinger becomes a direct peer rather than an incumbent alternative."
      diligencePath: "Monitor Schrödinger's Bunsen launch announcement (expected Q3 2026) and assess capability overlap with Periodic Labs' target workload."
      relatedQuestionRefs: [QP011]

    - type: private-evidence-only
      severity: minor
      topic: CuspAI synthesis-aware model validation
      missingEvidence: "CuspAI's claim of synthesis-aware models (generating manufacturable rather than only computationally-stable materials) has not been independently peer-reviewed as a distinct capability."
      whyItMatters: "If synthesis-aware generation is validated, CuspAI has a genuine technical moat vs. pure-DFT approaches; if it is marketing language for marginal improvement, the differentiation is weaker."
      diligencePath: "Review any published papers or independently verified case studies from Meta, Kemira, or Hyundai citing CuspAI synthesis yield vs. baseline computational methods."
      relatedQuestionRefs: [QP009]

    - type: missing-source
      severity: minor
      topic: Chemify synthesis network competitive comparison
      missingEvidence: "Chemify's Chemifarm distributed synthesis network has no public third-party benchmark or independent comparison against Periodic Labs' vertically-integrated autonomous lab; Chemify's commercial pricing and throughput metrics are undisclosed."
      whyItMatters: "If Chemify's synthesis-as-a-service model gains enterprise adoption, it could provide the physical-lab layer that currently differentiates Periodic Labs without requiring the same capital investment in owned lab infrastructure."
      diligencePath: "Review Chemify's published case studies and request throughput benchmarks for its Chemifarm network; compare against Periodic Labs' per-experiment cost and cycle time."
      relatedQuestionRefs: [QP025]

