  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        A publicly available, primary-source SOM estimate for autonomous AI-scientist platforms
        (as opposed to the broader AI in lab automation or AI materials discovery categories),
        isolating the sub-segment where Periodic Labs operates.
      whyItMatters: >-
        Without a verified SOM, it is not possible to independently validate the valuation multiple
        implied by Periodic Labs' $7.5B in-progress round relative to the available market opportunity.
      diligencePath: >-
        Request from Periodic Labs a bottoms-up SAM/SOM model based on disclosed pipeline and
        contract discussions; cross-check against customer interviews in pharma and battery verticals.
      relatedQuestionRefs:
        - QM003

    - type: private-evidence-only
      severity: material
      topic: adoption-constraints
      missingEvidence: >-
        Documented cases of enterprise customers churning from or failing to productize AI materials
        discovery pilots, or third-party analyses attributing specific commercial failures to the
        platform category.
      whyItMatters: >-
        The bullish market sizing narrative is not balanced without evidence of failed deployments;
        absence of documented failures in early-stage markets often reflects private rather than
        non-existent evidence.
      diligencePath: >-
        Interview 3–5 enterprise R&D directors in pharma and battery sectors who evaluated AI
        materials discovery tools; obtain pilot outcomes including terminations or extended evaluation
        periods beyond 12 months.
      relatedQuestionRefs:
        - QM010
        - QM025

    - type: conflicting-data
      severity: minor
      topic: market-sizing
      missingEvidence: >-
        Reconciled methodology for the four overlapping market definitions (AI materials discovery,
        AI in lab automation, autonomous chemical lab, total lab automation) across analyst reports
        that use inconsistent scope and geographic boundaries, and a breakdown of SAM by end-use
        vertical (battery, semiconductor, superconductor, pharma) as a share of total AI materials
        discovery spend.
      whyItMatters: >-
        The $970M AI materials discovery TAM and $5.75B autonomous chemical lab estimates are
        potentially double-counting shared segments, making true addressable-market calculations
        unreliable without methodological reconciliation. Without a vertical SAM breakdown, it is
        not possible to determine which vertical generates the largest near-term revenue opportunity.
      diligencePath: >-
        Obtain underlying methodology documents from ResearchAndMarkets or DimensionMarketResearch;
        conduct primary interviews with 2–3 independent market researchers who have modeled the
        segment boundaries separately; request vertical-specific pipeline data from Periodic Labs.
      relatedQuestionRefs:
        - QM014

