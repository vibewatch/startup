  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "Net Revenue Retention (NRR), Gross Revenue Retention (GRR), customer churn rate, and contract renewal data; no public evidence exists and management data room access is required."
      whyItMatters: "Without retention metrics, it is impossible to distinguish a land-and-expand engine from a pilot-only engagement model — the difference is fundamental to valuation and growth trajectory."
      diligencePath: "Request cohort-level NRR and GRR in management data room; confirm whether any customer has renewed, expanded, or disengaged since September 2025 launch."
      relatedQuestionRefs:
        - QU018
      relatedTableRefs:
        - TU004

    - type: private-evidence-only
      severity: material
      topic: contract-value
      missingEvidence: "Average contract value (ACV), deal structure (time-and-materials vs. SaaS vs. IP license), and any disclosed payment terms or minimum commitments."
      whyItMatters: "Commercial model determines unit economics, CAC payback, expansion potential, and NRR trajectory; current opacity makes financial modeling speculative."
      diligencePath: "Obtain representative contract or term sheet to determine pricing model, IP allocation, and renewal structure; confirm whether a standard commercial framework has been established."
      relatedQuestionRefs:
        - QU012

    - type: private-evidence-only
      severity: material
      topic: procurement-friction
      missingEvidence: "Actual sales cycle length from first contact to signed contract, customer acquisition cost (CAC), and win/loss data against competing approaches or internal R&D tools."
      whyItMatters: "Long CAC cycles in semiconductor and defense R&D drain capital at a company burning $10-15M/month; understanding CAC payback is essential to assessing go-to-market efficiency."
      diligencePath: "Request CRM data showing pipeline stage durations; interview early customers about procurement timeline and decision-making process."
      relatedQuestionRefs:
        - QU023

    - type: missing-source
      severity: minor
      topic: failed-pilots
      missingEvidence: "Any evidence of pilots that did not advance to production, customers that disengaged, or technical evaluations that failed to convert."
      whyItMatters: "At sub-12-month age, the absence of visible failures could reflect genuine quality or simply reflect that no independent reporting on customer outcomes exists yet; the gap affects probability of adoption success."
      diligencePath: "Request pipeline win/loss analysis; conduct reference calls with any customer willing to discuss evaluation outcomes; ask management directly about evaluation-to-contract conversion rate."
      relatedQuestionRefs:
        - QU024
      relatedTableRefs:
        - TU003
