callouts:
  - calloutType: strength
    title: Confirmed revenue and multi-sector traction at sub-12-month age
    body: >-
      Periodic Labs confirmed revenue generation from semiconductor customers within months of public launch
      (September 2025), and a16z confirmed active customer relationships in three sectors — semiconductors,
      space, and defense — representing massive combined R&D budgets. The $500M follow-on round being
      "significantly oversubscribed" validates investor conviction in the customer pipeline beyond the
      initial seed thesis.
    claimRefs:
      - CU001
      - CU010
      - CU039

  - calloutType: risk
    title: Customer proof opacity limits diligence confidence
    body: >-
      No named customers, no independent testimonials, no G2/Gartner reviews, and no production-confirmed
      case studies exist in the public record. All customer evidence is mediated through company or investor
      statements. This opacity is common at this stage in deep-tech but makes it structurally impossible to
      independently assess retention, concentration, contract terms, or expansion trajectory without
      management data-room access.
    claimRefs:
      - CU007
      - CU020
      - CU021
      - CU037

  - calloutType: risk
    title: Materials science timelines and buyer skepticism are structural adoption barriers
    body: >-
      The AI materials discovery sector has not yet demonstrated a commercial breakthrough. MIT Technology
      Review documented that no autonomous-lab startup has achieved utility beyond stability predictions,
      and industry analysts cite a 60-70% failure rate for AI-materials ventures reaching commercial
      production. Enterprise buyers in semiconductor and defense R&D are risk-averse; procurement
      cycles are long; and IP ownership questions remain unresolved. These sector-level barriers
      are not unique to Periodic Labs but will constrain adoption velocity across the category.
    claimRefs:
      - CU027
      - CU028
      - CU029
      - CU023

