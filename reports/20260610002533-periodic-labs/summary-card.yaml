summary:
  headline: >-
    Periodic Labs combines one of the strongest founder teams in frontier AI and materials science with an ambitious
    autonomous-lab thesis and exceptional investor validation, but the company remains far from commercially proven and
    the reported 2026 financing mark prices in success well before public revenue or customer evidence justifies it.
