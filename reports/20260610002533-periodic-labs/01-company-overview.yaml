  - id: milestones-commercial
    title: Key Milestones and Commercial Progress
    body: >-
      Periodic Labs trajectory from concept to one of the most highly valued seed-stage companies
      in venture history took under eighteen months. The founding conversation between Fedus and
      Cubuk occurred approximately seven months before the September 2025 emergence meaning roughly
      February 2025 when both recognized that robotic automation materials simulation and LLM
      reasoning had simultaneously matured enough to build a genuine AI-science platform. Fedus
      announced his OpenAI departure on March 17 2025 triggering a reverse-pitch frenzy from VCs;
      Felicis committed before the company was incorporated. By the time of the September 30 2025
      stealth launch the team had grown to over twenty elite researchers an initial laboratory had
      been established in San Francisco and early experimental data and simulations were running
      though the robotic systems were still being trained. The company first disclosed commercial
      engagement is with an unnamed semiconductor manufacturer facing chip heat dissipation
      challenges; custom AI agents were trained on the manufacturer experimental data to help
      engineers iterate faster. Observer also reported that the customer base includes space and
      defense sector companies. In March 2026 Bloomberg reported Periodic Labs was in deal talks
      at approximately $7 billion and by May 2026 Forbes reported the round was advanced and
      significantly oversubscribed at $7.5 billion. The company debuted on the Forbes AI 50 Brink
      list in 2026. As of the June 2026 run date no public announcement of a completed
      superconductor discovery had been made consistent with the long development cycles typical
      of materials research and the company stated emphasis on building the data flywheel first.
      Scientific critics including Yann LeCun of Meta argue that current AI pattern-matching
      capabilities fall short of genuine hypothesis-forming required for autonomous scientific
      discovery and a 2025 Nature study found AI tools may narrow the diversity of scientific
      inquiry even as they amplify individual researchers output. These concerns represent
      material risks to the core thesis that must be resolved through demonstrated experimental
      outcomes.
