companyProfile:
  summary: >-
    Periodic Labs is a San Francisco startup founded in 2025 by former OpenAI post-training leader Liam
    Fedus and former Google DeepMind materials-science lead Ekin Dogus Cubuk. The company is building
    "AI scientists": closed-loop systems that combine frontier models, simulation workflows, and
    autonomous laboratory infrastructure to generate hypotheses, run experiments, and discover new
    materials. Publicly described use cases include high-temperature superconductors and semiconductor
    heat-dissipation problems, with early commercial activity reported in semiconductor, space, and
    defense accounts. Periodic raised a record $300M seed round in September 2025 at a roughly $1.3B
    post-money valuation and was reported in 2026 to be discussing a new financing at about $7.5B.
    The core diligence question is not whether the team is exceptional—it is whether the company can
    convert scientific promise into repeatable commercial outcomes fast enough to justify the valuation step-up.
  foundedDate: "2025-03-01"
  founders:
    - name: "Liam Fedus"
      role: "CEO and Co-Founder"
      background: >-
        Former OpenAI Vice President of Research for Post-Training; previously studied physics and
        computer science at MIT, UC San Diego, and MILA, and left OpenAI in March 2025 to found
        Periodic Labs.
      claimRefs: [CO011, CO013, CO014]
    - name: "Ekin Dogus Cubuk"
      role: "Co-Founder"
      background: >-
        Former Google Brain and Google DeepMind materials-science leader who founded the materials
        science research group and co-created the GNoME line of AI materials-discovery work.
      claimRefs: [CO015, CO016]
  foundingLocation: "San Francisco, CA, USA"
  headquarters: "San Francisco, CA, USA"
  productSummary: >-
    Periodic Labs sells AI-science workflows for physical R&D: models that form hypotheses, run
    simulations, interpret customer experimental data, and ultimately connect to autonomous robotic
    laboratories that can execute experiments and feed results back into the system. The near-term
    commercial wedge is bespoke problem-solving for advanced industrial R&D teams, including a publicly
    described semiconductor heat-dissipation engagement.
  customerFocus: >-
    Advanced industrial R&D teams—especially engineers and researchers in semiconductor, materials,
    energy, aerospace, space, and defense organizations with large experimental budgets and hard
    physical-world optimization problems.
  businessModel: >-
    Today the business appears to be contract-based AI-science services and custom agent deployments
    for enterprise R&D customers, with longer-term upside from licensing proprietary data, licensing
    discovered IP, and potentially commercializing breakthrough materials discovered on the platform.
    Pricing is bespoke and not publicly disclosed.
  stage: "Seed"
  fundingStatus: >-
    Confirmed funding consists of a $300M seed round announced September 30, 2025 and led by
    Andreessen Horowitz, with Felicis, Accel, NVIDIA's venture arm, Jeff Bezos, Eric Schmidt, Jeff
    Dean, and Elad Gil among disclosed backers. Public reporting in May 2026 said the company was in
    advanced talks to raise at least $500M at roughly a $7.5B valuation, reportedly led by AMP.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO014, CO015, CO016, CO023, CO024, CI010, CI015, CI016, CU001, CU005]

summary:
  headline: >-
    Periodic Labs combines one of the strongest founder teams in frontier AI and materials science with
    an ambitious autonomous-lab thesis and exceptional investor validation, but the company remains far
    from commercially proven and the reported 2026 financing mark prices in success well before public
    revenue or customer evidence justifies it.
