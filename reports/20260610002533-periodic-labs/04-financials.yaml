  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue and gross margin
      missingEvidence: >-
        Periodic Labs' revenue run rate, ARR, gross margin per contract, and aggregate income
        statement data are not publicly available; the company has not voluntarily disclosed
        any financial metrics.
      whyItMatters: >-
        Without revenue and margin data, the financial chapter cannot assess commercial traction,
        the validity of the $7.5B valuation, or whether the unit economics are sustainable at
        scale. This gap makes underwriting impossible from public sources.
      diligencePath: >-
        Request audited or management-prepared quarterly P&L including revenue by contract,
        direct costs (lab, compute, talent per engagement), and gross margin from Periodic Labs
        investor relations.
      relatedQuestionRefs:
        - QI001
        - QI025

    - type: private-evidence-only
      severity: blocking
      topic: burn rate and cash balance
      missingEvidence: >-
        Actual monthly cash burn, cash position as of Q2 2026, and any credit facility or
        project-finance terms are not disclosed.
      whyItMatters: >-
        Runway determination is critical for assessing financing risk and timing of next capital
        need. Without confirmed burn data, runway estimates carry significant uncertainty.
      diligencePath: >-
        Request monthly treasury balance and burn statement from CFO or finance team; confirm
        existence and terms of any debt facility or equipment lease.
      relatedQuestionRefs:
        - QI006
        - QI017

    - type: private-evidence-only
      severity: material
      topic: Series A close status
      missingEvidence: >-
        The $500M Series A at $7.5B valuation was in "advanced talks" per Forbes as of May 2026
        but has not been confirmed closed as of the June 10, 2026 run date.
      whyItMatters: >-
        A confirmed Series A close substantially extends runway and de-risks near-term capital
        adequacy; an unconfirmed round leaves open the possibility that terms have changed or
        the round has not yet funded.
      diligencePath: >-
        Monitor company announcements and Bloomberg/Forbes coverage for official close announcement;
        request signed term sheet or funding confirmation in due diligence.
      relatedQuestionRefs:
        - QI017

    - type: enumeration-incomplete
      severity: material
      topic: customer count and concentration
      missingEvidence: >-
        The number of paying customers, revenue per customer, and customer industry breakdown
        are not disclosed. Only one specific use case (semiconductor heat dissipation) has been
        publicly named.
      whyItMatters: >-
        Customer concentration risk is a first-order risk for a bespoke contract business; if
        one or two customers account for the majority of revenue, churn from a single customer
        would materially impair financials.
      diligencePath: >-
        Request full customer list (anonymized if necessary) with revenue tier, contract start
        date, renewal status, and industry.
      relatedQuestionRefs:
        - QI021

