  - id: capital-adequacy-and-runway
    title: Capital Adequacy and Runway
    body: >-
      Periodic Labs entered 2026 with its $300 million seed round as the entirety of its
      disclosed capital. Monthly burn rate is not disclosed; analyst estimates range from
      $5 million to $15 million per month, reflecting the combination of lab buildout,
      compute spend, and competitive talent costs. At the midpoint of $10 million per month,
      the $300 million seed would provide approximately 30 months of runway from the September
      2025 close, or roughly through March 2028 — well ahead of the Series A close. The
      lower bound ($5M/month) extends runway to 60 months; the upper bound ($15M/month)
      compresses it to 20 months, potentially reaching mid-2027 before the Series A capital
      arrives.

      The Series A, if closed at $500 million and $7.5 billion valuation, would provide an
      additional 33–100 months of runway at the same burn rates, effectively funding the
      company through the mid-2030s at moderate burn. This is structurally important because
      materials science discovery timelines — even with AI acceleration — are measured in
      years. A $800 million total raise would give the company a credible multi-year runway
      to demonstrate breakthroughs before needing to access capital markets again.

      However, capital adequacy risk persists from the liquidation preference structure:
      the $300 million in seed preferred stock represents a liquidation preference ahead of
      all common shareholders. In any exit at or below the implied $1.2–$1.3 billion seed
      valuation, common equity holders (including employees) receive nothing. The Series A
      will add further preference stack. UpsideList estimates a bear-case scenario of
      -70% equity value from current levels if commercialization stalls, which would wipe
      out common equity entirely. The company's debt and project-finance obligations are not
      disclosed; there is no public indication of credit facilities or equipment leases
      supplementing the equity base, though the SEC Form D filed in May 2026 for a
      Sydecar-administered SPV indicates ongoing secondary investor fundraising activity
      around Periodic Labs.
