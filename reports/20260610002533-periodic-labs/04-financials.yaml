  - id: public-financial-information-gaps
    title: Public Financial Information Gaps
    body: >-
      As a private company at the Series A stage, Periodic Labs has minimal public financial
      disclosure obligations and has not voluntarily published financial metrics beyond
      confirming the existence of paying customers in the semiconductor, space, and defense
      verticals. Standard SaaS and deep-tech metrics — ARR, gross margin, NRR, CAC,
      payback period, customer count, churn, revenue growth YoY — are entirely undisclosed.
      Financial projections, unit economics, or product pricing have not been released.

      The absence of a direct SEC Form D by Periodic Labs itself is notable: the company
      either used a Regulation D exemption without public filing under an alternate entity
      name, or relies on structural exemptions. The identified SEC Form D (filed May 2026)
      belongs to an AGC-Sydecar SPV that invested in Periodic Labs, confirming secondary
      investment activity but not providing direct capitalization data on the company's
      balance sheet or income statement.

      For a diligence engagement, the key private-metric requests are: monthly burn rate,
      runway per quarter, gross margin by contract, customer count and revenue concentration,
      ARR or revenue run rate, IP co-ownership terms, next-round trigger conditions, and
      any debt or credit facility documentation. None of these are obtainable from public
      sources as of June 2026, creating a substantial information asymmetry for any
      would-be equity investor or commercial partner.
    claimRefs:
