company:
  name: Periodic Labs
chapter:
  number: 4
  title: Financials
  summary: >-
    Periodic Labs is a pre-revenue-scale deep-tech startup operating on a $300 million seed round
    raised in September 2025 at a $1.3 billion valuation, with a $500 million Series A at a $7.5
    billion valuation in advanced negotiations as of May 2026. The company generates early revenue
    from bespoke AI-science contracts in the semiconductor, space, and defense industries but has
    not disclosed ARR, revenue run rate, gross margin, or burn rate. Capital intensity is very
    high — the model requires building proprietary autonomous robotic laboratories estimated at
    $10–50 million per site, with analyst-estimated monthly burn of $5–15 million. The primary
    financial risk is a binary-outcome dynamic in materials discovery combined with an aggressive
    valuation trajectory that embeds substantial unproven commercial milestones.

sections:
  - id: revenue-model-and-commercial-traction
    title: Revenue Model and Commercial Traction
    body: >-
      Periodic Labs' primary revenue model is contract-based AI-science services — often termed
      "AI-lab-as-a-service" — in which the company engages enterprise customers in the
      semiconductor, space, and defense industries to accelerate materials R&D using its autonomous
      robotic laboratories and AI-scientist platform. Revenue recognition is bespoke and
      milestone-driven rather than subscription-based, creating inherent revenue lumpiness and
      customer-concentration risk. At company launch in September 2025, Liam Fedus publicly
      disclosed one concrete use case: a semiconductor manufacturer facing chip heat dissipation
      problems, for whom Periodic is training custom AI agents to interpret experimental data and
      iterate faster. The company's official website confirms engagement with space and defense
      customers as well.

      Pricing is not publicly disclosed and is likely structured around contract value, research
      scope, timeline, and potential co-ownership of resulting materials IP. Sources describe
      contracts as potentially worth tens of millions of dollars for high-impact engagements.
      Three secondary revenue streams are plausible but not confirmed: (1) material IP licensing
      if the company discovers commercially viable compounds, (2) proprietary experimental data
      licensing to train external AI systems, and (3) direct materials commercialization for
      breakthrough discoveries. Revenue figures, customer count, and ARR are not public as of
      June 2026. Despite the company's stated commercial traction, no analyst or investor
      commentary has cited specific revenue metrics. TechFundingNews noted that "unlike many
      peers, the company is generating revenue," which distinguishes Periodic Labs from
      pre-revenue comparables but falls short of a financial disclosure.

      GTM efficiency proxies (CAC, payback period, NRR, customer count) are entirely
      undisclosed. The go-to-market motion appears to be a direct-sales, enterprise model
      targeting R&D heads and chief scientists at large industrial companies, with the value
      proposition centered on compressing multi-year materials discovery cycles. Customer
      relationships in defense and semiconductor sectors typically require deep technical
      engagement, which implies long sales cycles and limited scalability versus software GTM.
    claimRefs:
