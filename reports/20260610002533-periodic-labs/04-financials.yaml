callouts:
  - calloutType: risk
    title: Binary-Outcome Capital Risk
    body: >-
      Materials science timelines run 5–10 years from discovery to commercial production.
      ViaNews and comparable case studies (Atomwise in AI drug discovery) document a
      60–70% failure rate for AI-materials ventures reaching commercial scale. At an
      estimated $5–15M monthly burn, the $300M seed provides limited recovery time if
      early autonomous-lab results disappoint. The preference stack ($300M ahead of
      common equity) means downside scenarios disproportionately affect employees and
      late common holders.
    claimRefs:
      - CI017
      - CI029
      - CI031
      - CI034

  - calloutType: insight
    title: Valuation Trajectory Outpacing Commercial Evidence
    body: >-
      The sixfold valuation jump from $1.3B to $7.5B in under eight months reflects
      exceptional investor enthusiasm anchored in team credentials and strategic vision
      rather than disclosed financial performance. The arXiv paper on AI investment
      dynamics (June 2026) flags the pattern of pre-revenue foundational AI startups
      reaching multi-billion valuations on talent and narrative alone. Until ARR, gross
      margin, and customer retention are disclosed, the $7.5B valuation is a sentiment
      signal, not a fundamentals-derived figure.
    claimRefs:
      - CI009
      - CI027
      - CI028
      - CI035

  - calloutType: recommendation
    title: Priority Diligence Requests Before Equity Commitment
    body: >-
      Before committing equity, require: (1) audited or management-prepared revenue and
      gross margin by contract; (2) monthly burn and cash balance as of Q2 2026; (3)
      confirmed Series A close documentation; (4) customer contract terms including
      duration, renewal options, IP ownership, and revenue concentration; (5) autonomous
      lab performance data versus conventional experimental timelines; (6) cap table
      showing full liquidation waterfall. These items are standard for a deep-tech Series
      A and not substitutable by narrative or investor social proof.
    claimRefs:
      - CI013
      - CI027
      - CI029
      - CI037

