      - number: '6.2'
        title: 客户证明与具名部署
        blocks:
          - type: paragraph
            body: >-
              公开记录中最具体的客户证明，是一家半导体制造商部署 Periodic Labs 的定制 AI 智能体，用来分析散热实验数据并加快芯片工程迭代周期。官方公司网站描述了这一部署，a16z 和 Inc.
              也独立确认，但客户名称没有披露。a16z 指出「Periodic 已经在与航天、国防和半导体客户合作」，确认牵引力不止半导体案例，已经跨多个行业。TechFundingNews 在 2026 年 3
              月独立报道，Periodic Labs「已经拿下半导体行业客户」，且「与许多同行不同，公司正在产生收入」。

              客户证明质量受不透明限制：本次研究没有找到具名客户、已发布案例、G2 或 Gartner Peer Insights 评价，也没有独立客户证言。Forbes 将 Periodic Labs 纳入其首届 2026
              AI 50 Brink List，而入选标准要求「早期牵引力」，提供了有限独立验证。截至 2025 年 10 月，TechCrunch 报道称公司的机器人手臂「尚未启动运行」，暗示部分早期客户项目可能处在 AI
              智能体和仿真阶段，而不是完整闭环自主实验室部署。任何公开来源都没有确认半导体项目究竟属于试点还是生产部署。
