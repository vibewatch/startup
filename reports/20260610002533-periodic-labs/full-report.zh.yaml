  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品愿景与 AI 科学家核心架构
        blocks:
          - type: paragraph
            body: >
              Periodic Labs 的核心产品是一个「AI 科学家」系统，目标是在物理科学中自动化完整科学发现周期。公司在公开发布材料和 a16z 投资公告中阐明的创始论点是：大语言模型已经耗尽估计 10
              trillion token 的互联网语料，需要一种质变的新数据源——靠直接与物理世界互动生成的自有实验结果。产品架构把 AI 推理系统放进物理实验室设备的闭环反馈中，让 AI
              提出假设、用机器人实验检验假设、观察预测是否经得住物理现实，再据此更新模型。自然本身就是强化学习环境——每一次合成实验都会确认或反驳 AI 的材料预测，提供互联网语料中没有的、明确且高保真的训练信号。

              公司用「从比特到原子」描述自己的路径——把数字 AI
              推理（bits）与物理世界实验（atoms）接起来。初始目标应用选择高温超导体发现，是因为相关物理实验相对较快，结果高度可验证（导电性和临界温度可客观测量），物理仿真生态（密度泛函理论）也足够成熟，能在投入机器人合成实验前缩小候选搜索空间。每次实验都会产生数
              GB 高质量数据，包括传统科学文献很少发表的失败结果——由此形成一套会随实验次数增长、仅靠公共数据库无法复制的自有训练语料。

              第二条商业产品线已经启动：为一家未具名半导体制造商训练定制 AI 智能体，帮助其解决芯片散热问题。这条产品线把 Periodic Labs
              的实验推理能力转化为近期开票的企业产品，让工程师能更快解释并迭代实验数据，而不必等完整自主机器人集成落地。这种双模式策略——研究阶段发现超导体，商业阶段交付工程智能体——让公司在更长周期的材料发现平台成熟前拥有近期收入载体。公司还服务航天和国防客户，但没有披露项目细节。
