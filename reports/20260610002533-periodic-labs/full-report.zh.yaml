      - number: '2.2'
        title: TAM、SAM 与 SOM：多视角测算
        blocks:
          - type: paragraph
            body: >-
              测算 AI 驱动材料发现，至少需要三层嵌套视角，因为没有单一分析师报告覆盖从自主实验室硬件到 SaaS 发现层的全栈。最窄、也最直接相关的分支——专用 AI 材料发现平台——2025 年价值约 $740M，按
              The Business Research Company 的 AI in Materials Discovery Global Market Report 2026，预计 2026 年达到 $970M，并以
              30.3% CAGR 增长至 2030 年 $2.77B。

              再上一层，实验室自动化中的 AI 市场（包括药物发现 AI、基因组学自动化和材料科学）2025 年为 $3.54B，预计 2026 年达到 $4.19B，CAGR 为
              18.4%。最广的可比市场——覆盖硬件、软件和 AI 的整体实验室自动化市场——2025 年为 $8.03B，2026 年为 $8.83B。自主化学实验室市场把硬件机器人与 AI 控制层结合起来，2026
              年估计为 $5.75B，并以 14.5% CAGR 增长至 2035 年。

              面向自主 AI 科学家平台模型（Periodic Labs 的路径）的 SOM 还无法用公开数据验证；行业分析师尚未单独拆出这个子分支。一个保守代理——AI 材料发现软件分支的 12%——意味着 2026 年
              SOM 约 $116M，但该估计高度不确定，且应标注为证据缺口。所有市场规模数字都带有分析师方法论风险，应视为数量级锚点，而不是精确预测。
