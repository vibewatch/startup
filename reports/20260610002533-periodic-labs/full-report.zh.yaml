  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 建立在一个可防守且时点正确的论点上：AI 进步的前沿已经从文本和代码转向物理实验，能够打造自驱动实验室——自主猜想、实验和学习的系统——的初创公司，将拥有下一代真实世界训练数据。创始人
              Liam Fedus（前 OpenAI 研究副总裁、ChatGPT 共同创造者）和 Ekin Dogus Cubuk（前 Google Brain 与 DeepMind 材料科学负责人、里程碑式 GNoME
              晶体发现论文共同作者）履历清晰有力。团队有 20 多名来自 Meta、OpenAI 和 DeepMind 的研究人员，许多人放弃了可观股权包加入；这是任何 AI
              垂直中最精英的创始阵容之一。公司已经与一家受芯片散热困扰的半导体制造商展开早期商业合作，这是一个可触摸的证明点，也让 Periodic 区别于没有收入的纯研究同行。


              反向逻辑有三根支柱。第一，公司没有公开披露收入基础，任何收入倍数锚点都无法建立；拟议 $7.5B
              估值完全建立在团队质量、战略叙事和早期信号上。第二，不到八个月估值跳涨六倍，意味着投资人情绪已经跑在可识别运营里程碑之前——从 2025 年 9 月种子轮到 2026
              年中轮次讨论之间，公开信息中没有产品、客户规模或实验室基础设施的阶跃变化。第三，工业规模自主实验室系统仍未经技术验证；截至 2025 年末，Periodic
              的机器人自动化层尚未运行，从概念验证走到可靠生产实验室的时间线存在重大不确定性。投资含义是观察建议：团队值得持续覆盖，但若要在 $7.5B 估值投入新资本，应以商业规模里程碑和机器人实验室上线证据为前提。
