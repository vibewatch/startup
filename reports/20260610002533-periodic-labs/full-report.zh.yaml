      - number: '2.5'
        title: 垂直商业化路径
        blocks:
          - type: paragraph
            body: >-
              AI 材料发现平台近期商业化路径集中在四个垂直领域，它们在准备度、买方紧迫性和收入模式上不同。电池与储能准备度最高：全球电池储能市场围绕固态电解质和新电极化学的商业紧迫性，正好对应 AI
              平台生成并筛选新材料配方的能力。SandboxAQ 的 AQVolt26 计划和欧盟 33 方 AI 电池联盟，都验证了这一应用路径的商业成熟度。半导体紧随其后：AI
              平台现在能够提出符合芯片属性要求的新型镓合金和 2D 材料，直接接入先进逻辑和存储供应链。

              高温超导体是 Periodic Labs
              明确表述的主要目标，也可以说是上行空间最高的垂直领域——其在量子计算和电网基础设施中的商业应用会带来转型级经济价值——但科学风险和时间线风险也最高，因为从预测结构走到规模化验证合成，室温超导体领域从未跑通。制药相邻发现工具（赋形剂、新型药物递送支架、生物相容材料）构成
              $300B 制药 R&D 预算中的一个大型增长子分支；IQVIA 的 Global Trends in R&D 2026 报告确认，AI 在 pre-IND 材料筛选中的作用正在扩大。面向这些垂直领域的 SaaS
              模式平台可实现 70–90% 毛利率，显著高于传统 CRO 服务，使商业模式在规模化后具备较强防御性。
