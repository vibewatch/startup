    title: 护城河耐久性与竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓解措施 / 尽调问题
    rows:
      - - 自有自主实验室实验数据飞轮
        - CuspAI 等公司也在积累自有材料数据集；开放访问的 GNoME 结构会部分商品化基线预测
        - 高
        - 核验 Periodic 的实验数据生成速度、数据集独特性，以及自有数据是否在发现产出上显著跑赢公共基线
      - - 精英创始团队人才护城河（Fedus/Cubuk 来自 OpenAI/DeepMind）
        - 大型 AI 实验室（Google、OpenAI、Microsoft）能招到同等人才，并转向材料 AI；FutureHouse 和 Isomorphic 也从同一人才池招人
        - 中
        - 跟踪创始团队构成能否转化为可防御 IP，还是只是短期品牌优势；评估 20+ 人团队的股权留存和人员留任风险
      - - 半导体行业早期商业牵引
        - Schrödinger、Citrine 和 Microsoft 已经拥有成熟的半导体行业关系和分发
        - 高
        - 识别合同范围、排他性和续约管线；确认半导体收入是否覆盖运营成本，还是仍处于商业化前阶段
      - - AI 模型 + 机器人 + 数据的垂直整合
        - 实验室 OS 编排初创公司（Automata、Synthace、UniteLabs）提供模块化替代方案，把 AI 与硬件解耦； Schrödinger Bunsen AI 可能无需投资物理实验室也能跑出智能体科学
        - 高
        - 观察企业客户更偏好 Periodic 的封闭栈，还是混搭式编排；判断纵向整合到底是护城河，还是资本开支负担
      - - 资本优势（$300M 种子轮；Series A 洽谈超过 $500M）
        - Schrödinger 持有 $406M 现金，Recursion 持有 $665M；CuspAI 已有 $130M+，且在洽谈独角兽轮融资；在这个量级，资本本身不是护城河
        - 中
        - 对照 Recursion 年亏损 $560M 的先例评估烧钱速度；要求披露现金跑道和收入爬坡时间表
      - - 材料规模上缺少同等自主实验室同行
        - 正在出现：Atinary 于 2026 年推出首个 SDL；Chemify/Chemifarm 提供 chemistry-as-code 网络；A-Lab（Berkeley）验证了全自主材料合成
        - 中
        - 确认 Berkeley A-Lab、Chemify 或资金充足的学术联盟，能否在没有创业公司成本结构的情况下复制 Periodic 的实验室能力
      - - 学术资助计划带来的网络效应
        - FutureHouse 和学术云实验室（Emerald、CMU）以更低学术端成本提供类似的开放科学参与机制
        - 低
        - 评估学术资助计划能否转化为商业客户，还是主要服务于公关
    notes: |
      严重程度评级基于公开证据作定性判断。「高」表示已有证据显示威胁在近期竞争中活跃。「中」表示威胁可信但尚未实质落地。尽调问题代表仍未解决、需要私营公司数据才能回答的问题。
