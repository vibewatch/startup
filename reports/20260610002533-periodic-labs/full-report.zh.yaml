      - number: '5.6'
        title: 附录
        blocks:
          - type: callout
            title: 自有数据飞轮构成结构性可防守护城河
            body: >
              Periodic Labs 最可防守的竞争优势是结构性的，而不是算法性的。每一次自主实验室运行都会产生数 GB
              实验数据——包括通常被科学文献排除的失败数据——并直接进入模型训练。由此形成一个飞轮：更好的模型生成更好的实验，更好的实验生成更好的训练数据。数据来自与物理世界的互动，而不是从互联网抓取，因此纯软件竞争者无法复制。团队履历（GNoME、ChatGPT
              后训练）与自有物理数据管线的组合，就是架构护城河；但要兑现这一点，Bits 和 Atoms 两条轨道必须同时跑起来。
            calloutType: strength
            claimRefs:
              - CE006
              - CE028
              - CE033
          - type: callout
            title: 机器人落地是关键且未经验证的执行依赖
            body: >
              完整 AI 科学家论点依赖 Atoms 轨道（机器人粉末合成）能够自主且可靠地运行。截至 2025 年 10 月，联合创始人 Cubuk 确认机器人组件尚未运行。截至 2026 年 6 月，公司仍在为 Menlo
              Park 实验室积极招聘自动化工程师和工艺工程师。数据护城河、RL 训练闭环和超导体发现项目都依赖这项能力。如果实验室自动化扩展起来比预期更难或更慢，Periodic Labs 相对纯软件 AI for
              science 路线的差异化会显著收窄。
            calloutType: risk
            claimRefs:
              - CE018
              - CE019
              - CE029
              - CE039
          - type: callout
            title: 自然即 RL 假设：物理科学会像数学和代码基准一样扩展
            body: >
              公司的核心架构赌注是，把物理实验当作强化学习环境，会以类似代码执行和数学验证推动 AlphaCode 与 AlphaProof
              的速度改进模型。这个类比表面上有说服力——物理结果像代码测试结果一样可验证——但也面临实质差异：物理实验需要数小时到数天，而代码只需毫秒；实验包含无法消除的测量噪声；材料合成成本高于计算；材料化学搜索空间也远大于有明确测试套件的编程任务。「从物理实验中
              RL」能否在商业相关时间窗口内收敛，是公司最重要且未经验证的论点。
