      - number: '6.4'
        title: 留存、持久性与扩张
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Periodic Labs
              没有披露留存、NRR、GRR、流失率或合同期限数据，任何第三方来源也没有识别到这些信息。即使最早期采用者，客户关系也不到十二个月，仅靠公开数据做队列层面的留存分析在结构上不可能。公司声称的「在前沿领域落地并扩张」策略——先解决有清晰评估标准的关键点问题，再在账户内扩展——暗示其扩张模型围绕深度领域编码和工作流扩展设计，而不是订阅层级增购。a16z
              公告所述的「通过中期训练和强化学习编码深度领域知识」，一旦客户自有实验数据嵌入定制模型，就可能形成高切换成本。

              客户扩张的商业模式尚未公开定义。Periodic Labs 没有披露是按模型训练、按实验周期、按 API 调用收费，还是通过年度企业许可证收费。这种模糊性让外部无法预测
              NRR、留存经济性或头部客户收入集中度。Academic Grant Program 表明公司愿意与机构建立有粘性的非付费关系，这些关系未来可能转化为付费企业关系。没有发现正式续约、长期承诺或客户合同结构的证据。
