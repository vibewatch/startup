      - number: '8.4'
        title: 附录
        blocks:
          - type: callout
            title: 观察：顶级团队，但入场价格偏高
            body: >-
              Periodic Labs 具备创始团队、投资逻辑差异化和早期市场验证，足以成为 AI 驱动科学发现中的品类定义公司。但拟议的 $7.5B 估值——没有已披露收入锚点，自动化实验室尚未达到商业规模，种子轮后 8
              个月估值跃升近 6 倍——把执行风险嵌入到了会打破入场纪律的程度。观察：在按 $7.5B 部署资本之前，继续跟踪自动化实验室上线、收入里程碑和 Series A 成交条款。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV009
              - CV036
              - CV037
          - type: callout
            title: 主要风险：估值在所有可衡量维度上都跑在运营证据前面
            body: >-
              核心风险不是技术投资逻辑，而是为期权性支付的价格。按 $7.5B 且没有披露收入计算，在任何合理的近期 ARR 假设下，隐含 EV/Revenue 倍数都超过 150x。上市 Robotics and AI 公司
              EV/Revenue 中位数为 3.4x（Finerva 2026），即便 LLM 供应商也只有 39.5x（Finro 2026 年一季度）——私有 AI
              科学溢价真实存在，但不是没有上限。自动化实验室延迟、倍数压缩，或来自超大规模云厂商项目的竞争，都可能触发低于当前标记的情景。
            calloutType: risk
            claimRefs:
              - CV025
              - CV028
              - CV029
              - CV037
              - CV038
          - type: callout
            title: 明确的团队厚度和结构性数据护城河使其区别于所有同行
            body: >-
              Periodic Labs 的创始团队——ChatGPT、GNoME 和神经注意力机制的共同创造者——是在任何 AI
              科学垂直领域里组出的最强履历组合。公司的闭环实验室模型生成自有实验数据，包括无法从公开文献抓取的失败实验，形成会随时间复利的结构性数据优势。早期半导体客户接触证明了真实商业拉力，而不只是研究兴趣。
            calloutType: strength
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
          - type: callout
            title: 基准情景假设自动化实验室 2027 年下半年上线，2031 年 ARR 达到 $150M
            body: >-
              基准情景下 $5.5–9B 的估值区间，要求自动化机器人实验室到 2027 年下半年实现商业化运行，至少两个半导体以外的主要垂直领域到 2028 年签下商业合同，ARR 到 2031 年达到
              $150-250M。这些假设有可能兑现，但并不确定。如果到 2028 年仍无法让实验室运营起来，或无法跳出初始半导体客户实现多元化，情景将滑向悲观情景。
