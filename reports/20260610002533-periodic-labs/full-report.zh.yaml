      - number: '8.3'
        title: 建议、尽调与退出准备
        blocks:
          - type: paragraph
            body: >-
              证据权重支持给出观察建议，但估值立场偏高。Periodic Labs 在团队、投资逻辑和市场规模上都明确达标。现阶段的否决因素是入场价格：在没有公开收入锚点的情况下按 $7.5B
              入场，回报曲线要求公司近乎完美执行，晚进入的资本才可能拿到符合创投要求的收益。如果投资逻辑兑现，早期按 $1.3B 进入的种子轮投资人位置仍然很好。新资本按 $7.5B 进入，门槛显著更高：要拿到 3x
              回报，就需要以 $22.5B 退出，这要么靠公司在 AI 科学赛道取得品类主导地位，要么靠超大规模云厂商以显著高于今日隐含价值的价格战略收购。


              2026 年轮次超额认购，以及市场已在讨论更高估值的快速跟投轮，都是正面的流动性信号，也同时是风险信号。在高价格下投资者需求超过额度，可能反映坚定信念，也可能是羊群效应——2026 年 AI
              科学环境里两者都存在。SEC Form D 证据（CIK 0002122824，2026-05-29 提交）显示，一个由 Sydecar 管理的微型 SPV（AGC Wealt Periodic Labs I）从
              7 名投资者募集 $4.7M，说明部分资本并非通过直接机构持仓进入，而是经由面向散户可触达的共同投资工具进入；即便在私有市场，这种模式有时也会出现在风险转移动态之前。


              2025-2026 年 AI 科学 M&A 环境提供了可信的退出路径：Siemens 在 2025 年以 $5.1B 收购 Dotmatics，超大规模云厂商正在扩建 AI 科学部门（OpenAI
              的「OpenAI for Science」部门），Isomorphic Labs $2.1B 的 Series B 也确认机构愿意为规模化 AI 发现平台下注。如果 Periodic
              在一两个材料垂直领域实现经过商业验证的发现，5 年内以 $10-15B 被战略收购是有可能的。IPO 路径需要 7-10 年，前提是公司达到公开市场能接受的收入规模。若要按 $7.5B
              估值进入，关键尽调问题应集中在商业收入基线、自动化实验室上线状态、已发现材料的 IP 归属、股权结构表和优先股堆叠细节，以及相对超大规模云厂商实验室项目的竞争差异化能持续多久。
