  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业：Neolab 与自主发现初创公司
        blocks:
          - type: paragraph
            body: >
              Periodic Labs 最接近的直接竞争对手，是那些把 AI 基础模型与物理自主实验室基础设施结合起来、规模化生成新实验数据的公司。CuspAI（英国 Cambridge，成立于 2024
              年）是最清晰的可比对象：它的平台充当「材料世界的搜索引擎」，为目标属性生成具备合成可行性的化学组成。CuspAI 在种子轮和 Series A 中累计融资 $130M（2025 年 9 月，由 NEA 和
              Temasek 共同领投），投后估值约 $520M；随后它与 Meta、Kemira 和 Hyundai Motor Group 洽谈商业合同，把非正式估值推至约 $800M，并在 2026 年初进入
              $200M+ 融资洽谈，目标为超过 $1B 的独角兽级估值。Tracxn 上 CuspAI 列出 73 个活跃竞争对手；其创始人 Prof. Max Welling（前 Microsoft Research
              Distinguished Scientist）和 Dr. Chad Edwards（前 Quantinuum）也给它带来强学术与深科技可信度，可与 Periodic 的 OpenAI/DeepMind
              履历相提并论。

              第二个直接同业是 FutureHouse，一家旧金山非营利机构，由 Eric Schmidt 支持（他也是 Periodic 投资人），明确瞄准自主 AI 科学家目标。TechCrunch 将
              FutureHouse 与 Periodic、Tetsuwan Scientific 并列为同一使命空间的公司。Tetsuwan Scientific
              是一家小型初创公司，也瞄准自主实验室科学工作流。材料科学之外，Isomorphic Labs（Google DeepMind 拆分公司）于 2025 年初融资 $600M，估值未公开披露，目标是带物理实验室集成的
              AI 驱动药物设计；虽然其重点是制药而非材料，但团队和技术路径与 Periodic Labs 有实质重叠。

              Periodic Labs 相对 CuspAI 和其他 AI 信息学同业宣称的关键差异在于：（1）全闭环自主实验室，生成物理实验数据，而不只是计算预测；（2）每次实验形成的自研数据飞轮；（3）范围更广——追求通用
              AI 科学家，而不是特定领域搜索引擎。不过，Periodic 尚未发布验证其发现产出优于同业的基准；CuspAI 具备合成感知的生成模型，以及 DeepMind 的 GNoME（联合创始人 Cubuk
              曾参与），都已经展示了强预测到验证管线，而且不需要完整物理实验室集成。
