      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              对一个深科技登月项目而言，Periodic Labs 在种子轮到 Series A 阶段讲出了一个财务上可信的故事：融资能力突出、使命有差异化、早期商业信号已经出现，资本基础也足以支撑数年运营。不到八个月估值从
              $1.3 billion 跳到 $7.5 billion，反映投资人确实热情高涨；但这个价格也嵌入了一个乐观情景——自主实验室效率得到证明，半导体客户扩大投入，材料突破能在投资人的时间窗口内出现。

              目前收入质量偏低：收入仍处早期，定制化、项目制明显，没有披露复购、规模或多元化。毛利率路径存在结构性不确定——实验室模式资本开支重，前期实验室成本摊销后，早期收入毛利率可能为负。对一家软件相邻公司来说，资本强度极高；它更像专业
              CRO、纳米科技公司或早期制药公司，而不是纯 AI 公司。ViaNews 的反向分析和关于 AI 投资动态的 arXiv 论文都提示，VC
              支持的自主科学初创公司面临二元化结果和漫长资本周期，可能不符合典型基金回报时间表。

              关键尽调阻断项包括：（a）确认 Series A 是否已按报道的 $7.5 billion 估值完成交割；（b）私下披露烧钱速度、现金跑道和单项目毛利率；（c）客户合同条款（收入金额、期限、IP
              所有权）；（d）通往下一次融资事件的里程碑路线图；（e）任何关于自主实验室相对传统实验方法表现的独立验证。在这些问题解决之前，财务图景高度依赖管理层叙事和投资人热情，而不是可验证的牵引指标。
