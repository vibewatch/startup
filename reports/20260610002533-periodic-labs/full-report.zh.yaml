      - number: '5.5'
        title: 信任、安全、技术风险与关键证据缺口
        blocks:
          - type: paragraph
            body: >
              Periodic Labs 所处领域中，AI 预测与物理验证之间的差距既是护城河来源，也是最大的执行风险。负责尽调的 a16z 牵头合伙人指出，前沿 AI
              模型在凝聚态物理中的科学分析能力「客观上很糟糕」，并且「相对人类研究者更差」——公司自己的牵头投资人承认，起点 AI 能力低于人类专家基线。Periodic Labs
              声称会靠闭环训练弥合这一差距，但目前这仍是一个开放且未经验证的问题。

              超导体发现目标带有结构性风险。尽管国际研究投入数十年，室温超导体仍停留在理论层面。2023 年 LK-99
              事件——一个曾短暂吸引巨大关注、随后无法被独立复现的主张——说明超导体声明在审查下可以多快坍塌。Via.news 指出，传统材料开发从实验室到商业部署平均需要 10 到 20
              年，这在投资人回报周期和物理科学时间线之间制造了结构性张力。AI 在材料科学中的应用迄今商业成功有限；物理验证瓶颈不能仅靠提高预测速度消除。

              截至 2026 年 4 月，Periodic Labs 尚未发表关于其 AI 科学家能力的同行评审论文或外部基准。闭源权重策略排除了外部评估。Sakana AI 的开源 AI Scientist-v2
              系统可作为理解行业成熟度的有用参照——它自主生成了一篇被 ICLR workshop 接收的论文——但该系统运行在数字 ML 研究中，而不是物理世界材料发现，也与 Periodic Labs 无关联。

              信任、安全和数据安全协议尚未公开记录。公司用工业规模机器人进行化学合成，带来材料处理、安全认证和监管合规问题，而公开材料没有回应这些问题。自有实验数据集的知识产权保护——公司声称的主要护城河——仍是治理缺口。公开材料中没有出现已披露的数据治理政策、商业客户许可条款或
              AI 安全监督协议。
