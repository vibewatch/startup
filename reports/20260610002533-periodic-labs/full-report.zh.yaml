      - number: '5.2'
        title: 技术栈：Bits 与 Atoms 双轨平台
        blocks:
          - type: paragraph
            body: >
              Periodic Labs 围绕两条明确命名的轨道组织技术，公开招聘和内部沟通中都能看到：一条是「Bits」，覆盖 LLM
              研究、机器学习基础设施和分布式训练工程；另一条是「Atoms」，覆盖物理实验室自动化、机器人、粉末合成工艺工程、薄膜沉积和材料表征。双轨架构反映了公司的根本判断：要交付 AI
              科学家，必须同时在两个很少共存于同一组织的领域做到极强。

              「Atoms」平台以粉末合成实验室为核心，机器人手臂混合前驱体化学品，在炉中加热到指定温度，再用表征仪器测量所得材料的电导率、磁响应、晶体结构等性质。公司在 2025 年 10 月确认，加州 Menlo Park
              的实验室正在建设，但当时完整机器人栈尚未运行。截至 2026 年 6 月，招聘信息显示公司正在招自动化工程师、工艺工程师（粉末）、材料合成与薄膜方向研究科学家，以及聚焦半导体的多物理场仿真科学家——说明
              Atoms 轨道仍在积极建设，范围已经超出最初的粉末合成重点。

              「Bits」平台以面向科学推理的 LLM 训练和微调为核心。公司通过三类训练来构建领域专用 AI 模型：用科学文献预训练，用自有实验数据中期训练，并根据实验结果做强化学习。联合创始人 Cubuk
              将这一路径描述为把物理当作类似数学和代码的「可验证环境」——在这些领域，RL 驱动的 AI 进展最快。Bits 团队招聘分布式训练工程师、ML
              系统工程师和超级计算工程师，显示训练大规模领域专用模型所需的基础设施规模。

              连接两条轨道的是一层量子力学仿真，用来在进入物理合成前缩小候选搜索空间。这一层直接继承 GNoME 方法——用图神经网络预测晶体稳定性——以及密度泛函理论软件工具，让 AI
              能快速筛选数百万种候选化合物组成，再选择一个子集做物理验证。a16z
              的投资逻辑明确写道：「模型会阅读文献、运行量子力学仿真、在实验室中行动，并从自然本身获得反馈。」负向实验结果会被有意捕获并纳入训练数据；相比只偏向正向结果的已发表科学文献，这构成结构性优势。
