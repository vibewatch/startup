      - number: '7.4'
        title: 治理、执行与缓释框架
        blocks:
          - type: paragraph
            body: >
              Periodic Labs 的创始团队由 Ekin Dogus Cubuk（Google DeepMind 的 GNoME 架构师）和 Liam Fedus（前 OpenAI
              研究副总裁）组成，具备极强科学与商业信誉。但这种集中依赖也是重大关键人风险：任一创始人离开，都会削弱公司吸引顶级科学人才、维持投资人信心和执行高难度研究路线图的能力。公开信息中没有披露继任计划或领导层厚度。董事会
              VC 色彩重——a16z、Nvidia 以及 Bezos 关联方——可能会施压公司更快拿出商业证明，牺牲有条理的科学验证。治理风险还延伸到自主系统监督。截至报告运行日，Periodic Labs 未披露 AI
              治理政策、双重用途筛查协议，也没有披露面向自主实验室运营的 AI 安全框架。在 CSIS、RAND 和 Nature Biotechnology 都呼吁对实验室场景中的生成式 AI
              工具强制内置生物安全保障的环境下，这会带来声誉和监管暴露。即使公共事故并非 Periodic Labs 直接造成，只要涉及 AI 化学工具，也可能触发全行业监管审查并扰乱运营。Periodic Labs
              及其投资人可采取的缓释措施包括：采用 ANSI/A3 R15.06-2025 机器人安全协议并记录风险评估；在 AI
              实验设计管线中嵌入双重用途筛查；对所有机器人控制系统做网络安全监测；在规模化合成前设置强制人工监督检查点。投资人应监控的终止标准包括：（1）18 个月内未能合成并独立验证任何 AI
              预测材料；（2）任何针对自主实验室运营的联邦监管执法行动；（3）首个商业里程碑前任一联合创始人离职；（4）在没有披露商业合作或许可协议的情况下消耗超过 75%
              已融资资本；（5）任何涉及双重用途或不安全自主合成的公开事件。
