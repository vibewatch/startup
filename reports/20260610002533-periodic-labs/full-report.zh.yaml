      - number: '1.2'
        title: 创始团队、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 由 Liam Fedus 和 Ekin Dogus Cubuk 共同创立，两人都是过去十年最有履历背书的 AI 与材料科学研究者。担任 CEO 的 Fedus 拥有 MIT 物理学
              BS（2010）、UC San Diego 物理学 MS（2016），以及 Universite de Montreal 和 MILA 计算机科学 PhD（2020），导师包括 Yoshua Bengio 和
              Hugo Larochelle。在 Google Brain，他是 Switch Transformer 论文（2021）的第一作者；该架构是稀疏混合专家语言模型扩展到万亿参数的参考方案。2022 年他加入
              OpenAI，任高级研究科学家，随后成为数据飞轮负责人并共同创造 ChatGPT，领导 GPT-4o、o1-mini 和 o1-preview 的后训练，2024 年 10 月升任后训练研究副总裁，2025 年
              3 月离职。Cubuk 获得 Harvard PhD，并在 Stanford 完成博士后，之后在 Google Brain 和 Google DeepMind 领导材料与化学研究团队；他共同署名 2023 年
              GNoME 论文，识别出约 220 万个新的稳定晶体结构。同年，他还共同发表了一个里程碑演示：全自动机器人 A-Lab 按 AI 生成配方，在 17 天内合成 41 种新化合物。除两位联合创始人外，创始团队还包括
              OpenAI o1 和 o3 推理模型创造者 Alexandre Passos；曾发现超导体的材料科学家 Eric Toberer；以及 Microsoft MatterGen 材料科学生成式 AI 系统创造者
              Matt Horton。另有 20 多名研究者来自 Meta、OpenAI、DeepMind、Databricks 和 Samsung，其中许多人放弃了大量未归属股权加入。科学顾问委员会由 Stanford
              诺贝尔化学奖得主 Carolyn Bertozzi 主持，并包括超导物理和材料科学权威。Wilson Sonsini Goodrich and Rosati
              为种子轮交易提供法律顾问。关键人物集中风险很实质：两位联合创始人都是投资逻辑和投资人信心的中心，公司也没有公开披露接班计划。
