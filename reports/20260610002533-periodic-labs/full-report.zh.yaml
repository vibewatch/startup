      - number: '1.4'
        title: 关键里程碑与商业进展
        blocks:
          - type: paragraph
            body: >-
              从概念到成为风险投资史上估值最高的种子阶段公司之一，Periodic Labs 只用了不到 18 个月。Fedus 和 Cubuk 的创始对话发生在 2025 年 9 月亮相前约 7 个月，也就是大约 2025
              年 2 月；当时两人判断，机器人自动化、材料仿真和 LLM 推理已经同时成熟，足以搭建真正的 AI 科学平台。Fedus 于 2025 年 3 月 17 日宣布离开 OpenAI，引发 VC
              反向路演狂潮；Felicis 在公司尚未注册时就已承诺投资。到 2025 年 9 月 30 日隐身发布时，团队已扩大到 20
              多名顶尖研究者，在旧金山建立了初始实验室，早期实验数据和仿真已经跑起来，尽管机器人系统仍在训练。公司首次披露的商业项目来自一家未具名半导体制造商，对方面临芯片散热挑战；Periodic
              用该制造商的实验数据训练定制 AI 智能体，帮助工程师更快迭代。Observer 还报道，客户基础包括航天和国防行业公司。2026 年 3 月，Bloomberg 报道 Periodic Labs 正以约 $7B
              估值洽谈交易；到 2026 年 5 月，Forbes 报道本轮已进入深入阶段，并以 $7.5B 估值显著超额认购。公司入选 2026 年 Forbes AI 50 Brink 榜单。截至 2026 年 6
              月报告日期，公司尚未公开宣布完成任何超导体发现；这符合材料研究通常较长的开发周期，也符合公司先搭建数据飞轮的表述。包括 Meta 的 Yann LeCun 在内的科学批评者认为，当前 AI
              的模式匹配能力不足以支撑自主科学发现所需的真正假设形成；2025 年一项 Nature 研究也发现，AI
              工具虽然放大个体研究者产出，却可能缩窄科学探索的多样性。这些担忧构成核心论点的实质风险，必须靠已展示的实验结果来消解。
