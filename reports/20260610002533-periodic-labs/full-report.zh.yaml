      - number: '4.2'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 的成本结构由三类主导：（1）自主实验室资本开支和持续维护；（2）AI 计算基础设施（用于训练和推理的 GPU 集群与云计算）；（3）从 OpenAI、DeepMind 和 Meta
              吸引研究者所需的顶尖人才薪酬。公司已经聘用了一批离开这些公司并放弃大量股权包的研究者，意味着需要远高于市场的薪酬来吸引这类人才。第四类较小成本是办公设施和
              G&A。这种组合更像资本密集型物理科学基础设施业务，而不是软件公司。

              自主实验室建设是最具结构新意的成本项。可比云实验室平台提供了有用的地板基准：Emerald Cloud Lab 自有数据显示，一个标准自动化化学设施的初始仪器成本为 $1.4M–$3.6M，年度维护为
              $288K–$720K；NCBI/PMC 学术研究引用 $250K/year 作为仅访问 Emerald Cloud Lab 完整仪器套件的入门成本。Periodic Labs
              正在建设完全自研的设施，包括定制机器人、粉末合成系统和集成 AI 反馈闭环——成本层级显著高于访问费模式。行业分析师估计，每个完全自主的材料发现站点建设成本为 $10–50 million，这与 $300
              million 融资规模相符。若规划多个站点，实验室总资本可能达到 $100–200 million，在首轮回本之前就吃掉种子轮很大一部分。

              毛利率在结构上不确定：AI 科学合同收费率高（单个项目可能 $5–20M），但要抵消实验室折旧、计算和人才成本，而这些成本很难按合同分摊。纯软件类比会高估毛利；纯
              CRO（合同研究组织）类比会低估毛利。公司没有披露毛利率。ViaNews 分析师提示，如果早期结果令人失望，「资本结构给转向或时间线延长留下的空间有限」，这凸显了高固定成本相对软件同业会降低运营灵活性的风险。
