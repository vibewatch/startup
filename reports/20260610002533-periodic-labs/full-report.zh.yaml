      - number: '5.3'
        title: 技术血统：GNoME、ChatGPT 与 MatterGen 谱系
        blocks:
          - type: paragraph
            body: >
              创始团队的技术履历，是 Periodic Labs 产品主张和执行 AI 科学家论点能力的核心。联合创始人兼 CEO Liam Fedus 曾任 OpenAI 后训练研究副总裁，领导团队创造了 ChatGPT
              和首个万亿参数神经网络。他在后训练上的专长——决定模型行为的关键 RL 微调和指令对齐阶段——可以直接迁移到 Periodic Labs 正在构建的「从自然中 RL」训练范式。联合创始人 Ekin Dogus
              Cubuk 曾领导 Google Brain 和 DeepMind 的材料与化学研究团队。他最知名的成果是 GNoME（Graph Networks for Materials Exploration），即
              2023 年 Nature 论文：团队用基于 DFT 计算晶体能量训练的图神经网络，识别出超过 2.2 million 个潜在稳定的无机晶体结构，这是已知材料史上最大规模的一次扩展。GNoME 证明，AI
              预测材料可以在机器人合成实验室中验证；Berkeley A-Lab 在同一个 2023 研究周期中，按 AI 配方合成了 41 种新化合物。这个先例直接支撑 Periodic Labs
              的架构，也验证了闭环路径的可行性。

              除两位联合创始人外，团队还包括 Alexandre Passos（OpenAI o1 和 o3 推理模型共同创造者）、Eric Toberer（曾任 Colorado School of Mines
              的材料科学家，做出过关键超导体发现）以及 Matt Horton（Microsoft MatterGen 的创造者之一，MatterGen 是用于生成式材料发现的 LLM）。公司称已从
              OpenAI、DeepMind、Meta、Databricks 和 Samsung 招募超过 20 名研究人员，其中许多人放弃数千万到数亿美元未归属股权加入公司。《纽约时报》将这场人才迁移报道为近年 AI
              史上最值得关注的事件之一。

              一个独特的团队实践强化了技术融合：每周跨学科教学，物理学家教 LLM 围绕量子力学推理，ML 研究人员学习物理直觉。联合创始人 Cubuk
              表示：「我们确实认为紧密耦合极其重要。」创始人还记录称，粉末合成工作流中的机器人手臂可靠性直到最近才达到足以支撑可靠自主实验的门槛；创始人认为，这种时点上的汇合正是现在适合创建 Periodic Labs
              的关键原因。
