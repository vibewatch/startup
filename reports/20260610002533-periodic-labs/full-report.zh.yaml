  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业牵引
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 的主要收入模式是合同制 AI 科学服务，常被称为「AI-lab-as-a-service」；公司与半导体、航天和国防行业的企业客户合作，用自主机器人实验室和 AI 科学家平台加速材料
              R&D。收入确认更偏定制化和里程碑驱动，而非订阅制，因此天然存在收入波动和客户集中风险。2025 年 9 月公司发布时，Liam Fedus
              公开披露了一个具体用例：一家半导体制造商面临芯片散热问题，Periodic 正为其训练定制 AI 智能体，解读实验数据并更快迭代。公司官网也确认与航天和国防客户有合作。

              定价未公开披露，可能围绕合同价值、研究范围、时间线，以及结果材料 IP
              的潜在共同所有权来设计。来源称，高影响力项目的合同可能价值数千万美元。三条次级收入流有可能成立，但尚未确认：（1）如果公司发现具备商业可行性的化合物，可授权材料 IP；（2）向外部 AI
              系统授权自研实验数据；（3）直接商业化突破性发现材料。截至 2026 年 6 月，收入数字、客户数和 ARR
              均未公开。尽管公司声称已有商业牵引，没有任何分析师或投资人评论引用了具体收入指标。TechFundingNews 提到「不同于许多同业，公司正在产生收入」，这让 Periodic Labs
              区别于收入前可比公司，但仍不是财务披露。

              GTM 效率代理指标（CAC、回本周期、NRR、客户数）完全未披露。Go-to-market 动作看起来是直销企业模式，目标是大型工业公司的 R&D
              负责人和首席科学家，价值主张集中在压缩多年材料发现周期。国防和半导体行业客户关系通常需要深度技术参与，这意味着销售周期长，相比软件 GTM 可扩展性有限。
