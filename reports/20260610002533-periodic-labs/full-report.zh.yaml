chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、使命与产品策略
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 是一家总部位于旧金山的人工智能公司，2025 年 3 月成立，目标很明确：创造 AI
              科学家，也就是能够形成假设、设计并执行物理实验室实验，并在物理科学发现中持续迭代的自主系统。公司仍是私营种子阶段实体，没有公开财务披露。它的核心论点是，前沿 AI 模型已经基本吃尽互联网上约 10 万亿个文本
              token；要取得有意义的科学进展，AI 系统必须直接从物理世界生成新的实验数据。Periodic Labs
              的产品策略围绕三根互相咬合的支柱：第一，自主机器人实验室，在全自动闭环中执行粉末合成和材料表征实验；第二，高保真 AI
              驱动仿真模型，在高成本物理测试前缩小实验搜索空间；第三，大语言模型研究助手，分析结果、生成新假设并指挥后续实验周期。每次实验都可能产生数 GB
              自研数据，包括传统科学很少发表的负结果，进而形成竞争对手拿不到的训练语料。公司第一个商业应用，是帮助一家半导体制造商解决芯片散热问题，用该制造商的实验数据训练定制 AI
              智能体。更长期的科学登月目标，是发现更接近常温条件下工作的高温超导体；一旦成立，可能改变电网、交通和计算。公司也瞄准航天和国防客户，这些领域的材料 R&D 周期同样昂贵且缓慢。Periodic Labs
              明确把自己同消费级 AI 创业公司区分开来：它不追求通用人工智能，也不做聊天用大语言模型，而是完全聚焦物理科学发现闭环，在那里，自然本身就是强化学习环境。
