      - number: '6.5'
        title: 采购障碍与采用风险
        blocks:
          - type: paragraph
            body: >-
              半导体和国防行业采购自主 AI 实验室平台，在结构上速度很慢。这些垂直行业典型验证、安全审查和批准周期为 12-24 个月；国防采购还需要 ITAR
              合规审查、数据驻留保证，以及法律、IT、采购和高管层多方对齐。IP 所有权不确定是实质障碍：在国防和半导体 R&D 中，AI 发现的材料洞见归客户还是归 Periodic
              Labs，具有显著商业和战略价值含义，而公开信息尚未澄清。

              更大的行业层面风险是，AI 材料发现还没有出现商业化「尤里卡时刻」。MIT Technology Review 2025 年 12
              月报道，没有一家自主实验室初创公司证明自己在稳定性预测之外有实用价值，计算仿真与物理合成之间的差距仍是主要瓶颈。Vianews.market 引述称，AI 材料项目走到商业化生产的失败率为
              60-70%。这些行业层面信号会影响所有买方信心，不只是 Periodic Labs。公司的「自然作为 RL
              环境」论点——真实物理实验会生成可操作、自有的数据——架构上成立，但尚未在规模商业化上得到证明；早期企业买方很可能要求大量试点，才会承诺生产级合同。竞争平台（Lila
              Sciences、CuspAI、Radical AI）在重叠垂直中面临同样的采用摩擦。
