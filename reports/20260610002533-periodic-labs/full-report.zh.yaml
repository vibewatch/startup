      - number: '3.4'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >
              Periodic Labs 的核心护城河主张建立在自研实验数据飞轮上：每次自主实验室运行都生成高质量、源自实验室的数据，用来训练更好的 AI
              模型，并相对依赖互联网抓取或公开材料数据库的竞争对手拉开差距。这个概念很有吸引力，但在商业规模上尚未验证。

              2025 年材料科学自驱实验室子分支约为 $0.12B，并以约 40% CAGR 增长至 2030 年 $0.65B；但跨所有垂直领域的「自主闭环发现」被评估为 TRL 6（试点规模），量产成熟预计在
              2028–2030 年。按独立市场分析，物理实验室 AI 的「ChatGPT 时刻」是 2028–2030 年事件，并非近在眼前。在此期间，实验室自动化的价值创造几乎完全迁移到软件 / AI
              编排层，Automata、Benchling 和 Strateos 等公司已经在激烈竞争。

              商品化风险真实存在：液体处理和机器人工作单元自动化现在已处于 TRL 8–9，实际上已经商品化；可防御位置在 AI 编排和数据生成平台。正如「Lab OS
              wars」所示，这一层竞争异常激烈。Schrödinger 的 Bunsen AI 发布（2026 年夏季）意味着最成熟的计算平台正在获得智能体 AI 能力。Microsoft Azure Quantum
              Elements 带来超大规模云厂商分发。Google 持续以零边际成本向用户发布 GNoME 级研究工具，使基准预测能力免费可得。

              反向证据：VIA News 的金融分析师指出 Periodic Labs 的 $300M 烧钱风险令人担忧，并提到超导体突破没有清晰商业时间线。Sapio Sciences 在 SLAS 2026
              的一项调查发现，45% 的科学家在使用未经授权的影子 AI 工具，因为官方平台没能满足他们——这说明需求端确实有拉力，但也说明采购漏斗不成熟、组织信任度低。行业分析师指出，多数「自主实验室」实际处于 Level
              2–3 自主（针对特定任务的脚本化闭环），而不是 Periodic Labs 宣传的通用科学自主。Periodic Labs
              正从半导体行业客户获得早期商业收入，但没有披露收入数字、达到产品市场契合的时间线，或实验吞吐量基准。
