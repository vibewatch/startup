      - number: '7.2'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >
              Periodic Labs 运营自主机器人实验室，处理反应性、新型且可能有害的化学化合物。这会立即触发 OSHA Laboratory Standard（29 CFR 1910.1450）以及其 2024
              Hazard Communication Standard 更新下的合规义务；该更新与 GHS 第 7 版对齐，要求所有被处理化学品满足新的标签和 SDS 要求，包括毒性特征未知的 AI 生成新候选物。OSHA
              机器人标准要求所有自动化设备满足 lockout/tagout 要求，2025 年 9 月发布的 ANSI/A3 R15.06-2025 也要求每一个新增或修改后的机器人流程都要有记录化风险评估。OSHA
              事故数据库记录了 2024 年 2 月一起员工被机器人手臂压死的事故，说明即便成熟工业机器人部署也可能造成致命后果。双重用途暴露带来性质不同的监管风险。2022 年一项实验记录显示，AI
              化学工具在关闭安全过滤器后，数小时内可生成数千种潜在可武器化分子。CSIS、RAND 和 US National Security Commission on Emerging Biotechnology
              都已指出，自主 AI 实验室是新兴生物安全风险来源，而现有治理框架不足以应对。EU AI Act（2024 amendment）将 AI 驱动的实验室平台归为高风险。Arms Control
              Association 2025 年 11 月报道称，台式合成监管缺口会制造结构性生物安全漏洞，与自主材料实验高度类似。若监管机构对自主实验室 AI 采取执法行动——CSIS 和 RAND
              都主张这么做——公司可能被要求停运或承担当前未预算的高成本许可制度。IP 和法律风险是第三个维度。AI 生成材料发现的发明人身份在 USPTO 和 EPO
              都未解决。训练数据诉讼风险正在升级；如果新材料与战略国防应用交叉，还可能触发出口管制义务。
