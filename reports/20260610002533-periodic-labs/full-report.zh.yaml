              截至 2026 年 6 月，Periodic Labs 尚未公开宣布其自主实验室完成任何材料发现。Yann LeCun 等怀疑者，以及 2025 年 Futurism/Wiley 对在职科学家的调查（AI
              信任度大幅下降）都提示，当前 AI 的模式匹配可能撑不起真正的自主科学假设生成。2025 年 Nature 研究还发现，AI
              工具可能缩窄科学探索的多样性。运营上，两位联合创始人是公司身份和投资人论点的中心，也没有公开披露接班或治理结构。这些风险叠加据报道 $7.5B、且仍处发现前阶段的估值，构成任何投资人最主要的尽调问题。
