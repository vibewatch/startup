      - number: '3.2'
        title: 现有平台：计算化学与材料信息学
        blocks:
          - type: paragraph
            body: >
              材料科学买方在考虑 Periodic Labs 前，通常会遇到三类现状替代方案：Schrödinger、Citrine Informatics 和 Microsoft Azure Quantum
              Elements。

              Schrödinger（NASDAQ: SDGR，成立于 1990 年）是最成熟的基于物理的仿真和 AI 材料平台。其 2026 年 Q1 总收入为 $58.6M（ACV $28.4M，同比
              +12%），不过随着公司从永久授权转向托管（订阅）授权，软件收入同比下降 21%。截至 2026 年 Q1，Schrödinger 持有 $406M 现金，并计划在 2026
              年夏季推出「Bunsen」——一个智能体 AI 共同科学家，直接竞争 Periodic 的 AI 科学家愿景。Lilly 以 $2.3B 收购 Ajax Therapeutics（使用了 Schrödinger
              发现的分子）验证了 Schrödinger 的历史记录，也让它在监管和制药信任上有强差异化。对材料科学客户，Schrödinger 把同一套物理优先核心用于分子仿真。

              Citrine Informatics（Redwood City, CA）截至 2025 年 Series C 已累计融资约 $81.3M，客户包括
              LyondellBasell、Eastman、Panasonic、Michelin 和 LANXESS。Citrine 的 DataManager 和 VirtualLab
              工具面向特种化学品和先进材料公司，帮助它们从小而稀疏的数据集中提取价值。它的 SaaS 模式和企业材料 R&D 聚焦（而不是从零发现）让它成为仿真既有厂商的互补工具，也部分替代 Periodic
              的数据生成价值主张。截至 2026 年，Citrine 收入估计在 $10–$100M 区间。

              Microsoft Azure Quantum Elements 代表来自超大规模云厂商的平台风险。Microsoft 已进入 AI
              驱动材料发现，可能冲击小型专业玩家。它的云规模和企业分发优势远超任何初创公司；已经在 Azure 生态内的材料科学家，可以以很低切换摩擦采用新的材料 AI 工具。同样，Google DeepMind 的
              GNoME——预测了 220 万个新晶体结构（其中 380,000 个高度稳定），其第一作者正是 Periodic Labs 联合创始人 Ekin Cubuk——仍是开放且被广泛引用的研究工具，整个社区无需向
              Periodic 付费即可在其基础上建设。
