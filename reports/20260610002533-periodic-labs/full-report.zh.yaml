    rows:
      - - 合成缺口
        - AI 预测热力学稳定的晶体结构，但在现实实验室条件下无法合成
        - GNoME：2.2M 个预测，截至 2025 年末约 736 个被合成并验证
        - 高
        - 吞吐量的核心约束；自主机器人无法跨越根本性的合成障碍
      - - 腐蚀性幻觉
        - 模型生成科学上看似合理、事实却错误的输出，并逃过标准错误检测
        - arXiv 2025 年 4 月：幻觉分类研究发现，AI 生成科学文本中的幻觉比例会影响下游实验设计
        - 中高
        - 闭环自主实验会在人工复核之前放大传播
      - - DFT 训练数据偏差
        - 主动学习所用密度泛函理论标签带有系统性近似误差
        - 计算材料科学文献已充分记录 DFT 近似误差
        - 中
        - 模型重训练循环会继承系统性误差；重新校准很耗资源
      - - 可复现性失败
        - AI 预测的合成路线无法在不同实验室设备或条件下复现
        - 多篇 GNoME 后续批评指出缺少独立实验验证
        - 中高
        - 客户验证和 IP 申报都依赖可复现性；单一实验室合成不够
      - - 自主范围漂移
        - 人类监督减少后，AI 会选择预定发现领域之外的实验方向
        - 自主智能体安全文献记录了这一概念风险；未报告 Periodic Labs 直接事故
        - 中低
