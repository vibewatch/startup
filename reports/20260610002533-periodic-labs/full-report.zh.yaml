            body: >-
              Periodic Labs 服务的是一个窄但高价值的客户宇宙：半导体制造、航空航天和太空探索、国防系统等大型工业 R&D 组织中的工程师和研究人员。买方通常是 R&D
              负责人、材料科学负责人或工程副总裁，手里有可观实验数据预算，也有明确材料难题——先进芯片散热、再入飞行器隔热、国防系统中的磁体性能——传统方法未能在既定时间内解决。用户则是实验室工程师或计算科学家，他们接收 AI
              智能体输出，并决定是否启动下一轮实验周期。公开信息中没有消费者端界面、没有渠道合作伙伴层，也没有披露地理分层。

              a16z 将目标行业描述为「代表数万亿美元 R&D 支出」，并明确点名半导体、先进制造、能源和航空航天为主要影响垂直。Fedus 将理想客户描述为「并没有特别好用工具」且拥有「庞大 R&D 预算」的组织，把
              ICP 锚定在技术需求和预算能力，而不是公司规模。官方网站公布 Academic Grant Program
