  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与竞争性支出
        blocks:
          - type: paragraph
            body: >-
              AI 驱动的材料发现，是更广泛实验室科学技术栈中的一个独立市场分支。核心产品类别包括软件平台和软硬一体系统，用生成式
              AI、图神经网络和大语言模型提出、仿真并通过实验验证新的材料组成——把过去按十年计的发现周期压缩到数月或数年。它不同于一般实验室自动化（仪器控制、液体处理、LIMS）：主要价值主张不是吞吐量管理，而是假设生成和实验设计。

              纳入的支出包括 AI 平台授权、自主实验室 SaaS 订阅、AI 驱动的计算筛选工具，以及专为闭环发现设计的机器人系统。排除的支出包括通用分析仪器、临床试验自动化、标准 CRO/CDO
              外包，以及主要用于数据管理而非发现的 AI 工具。Periodic Labs 的上游机会还包括若干相邻支出池：$8.83B 的整体实验室自动化市场、$300B 的全球制药 R&D
              预算，以及规模可比的化学品和先进材料 R&D 板块。现状替代方案是手工组合合成、传统计算化学和合同 CRO 服务——这些方案相较 AI 指挥的闭环系统，都明显更慢，也更吃资本。
