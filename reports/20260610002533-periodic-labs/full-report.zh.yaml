      - number: '5.4'
        title: 运营状态、路线图与关键依赖
        blocks:
          - type: paragraph
            body: >
              截至 2025 年 10 月，Periodic Labs 确认已在 San Francisco 搭建研究实验室，并在积极处理实验数据、仿真和测试部分预测。联合创始人 Cubuk 明确告诉
              TechCrunch，机器人组件「还需要一点时间训练」——说明发布时完整 Atoms 轨道自主闭环尚未运行。截至 2026 年 6 月，Menlo Park
              实验室仍在招聘自动化工程师、工艺工程师（粉末）以及材料合成与薄膜方向研究科学家。面向半导体的多物理场仿真科学家招聘，显示技术路线图正在从最初的粉末合成超导体重点，扩展到薄膜沉积和半导体工艺工作流；这也确认产品范围比公开叙事暗示的更宽。

              公司的产品路线图有三个可见阶段：（1）为超导体发现建设并扩展自主粉末合成 Atoms
              实验室；（2）为半导体客户部署商业化工程智能体；（3）扩展到更多材料目标，包括电池、催化剂、磁体、隔热盾，最终到药物化合物。a16z 投资逻辑将先进制造、材料科学、半导体、能源和航空航天列为优先市场，合计约占全球
              GDP 的 $15 trillion。Forbes 2026 年 5 月报道称，公司后续一轮融资在 $7.5 billion 估值下大幅超额认购，且已经在讨论以更高估值快速跟进的下一轮融资。

              关键依赖包括：（a）实验室规模下可靠的机器人硬件；据联合创始人证词，这项能力最近才足够成熟；（b）训练大型领域专用模型所需规模的 GPU / 计算资源，Nvidia 的 NVentures
              作为战略种子投资人，暗示硬件层面对齐；（c）前沿 ML 与物理科学交叉处的专业人才，公司正在从顶级 AI 实验室积极招募；（d）与 R&D
              预算大、实验评价标准清晰的行业客户建立关系。闭源权重策略降低了开源复制风险，但也限制了外部验证能力主张。公司没有披露与云服务商的具体计算基础设施安排，也没有说明与 NVentures 的战略关系性质。
