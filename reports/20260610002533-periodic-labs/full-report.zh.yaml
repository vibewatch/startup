      - number: '1.3'
        title: 融资历史、估值与投资人版图
        blocks:
          - type: paragraph
            body: >-
              2025 年 9 月 30 日，Periodic Labs 走出隐身状态，宣布以 $1.3B 投后估值融资 $300M，完成了风险投资史上最大的种子轮之一。本轮由 Andreessen Horowitz a16z
              领投；第一张机构支票来自 Felicis Ventures 合伙人 Peter Deng，这位前 OpenAI 高管在公司尚未注册、尚未命名前就已承诺投资。其他机构投资方包括 DST
              Global、NVentures（NVIDIA 风险投资部门）和 Accel。天使团包括 Amazon 创始人 Jeff Bezos、前 Google CEO Eric Schmidt、Google 首席科学家
              Jeff Dean 和投资人 Elad Gil。尽管 Fedus 的离职推文早期信号让外界以为 OpenAI 会投资，创始人向 TechCrunch 确认 OpenAI 并非 Periodic Labs
              的支持者；他们选择 a16z，是为了获得更广的战略资源。约 $1.0B 的投前估值，反映的是投资人愿意为一家发布时没有产品、没有收入、没有披露 IP 的公司支付的价格。Wilson Sonsini
              Goodrich and Rosati 担任该交易法律顾问。到 2026 年 3 月，Bloomberg 报道 Periodic Labs 正洽谈交易，目标估值约 $7B。到 2026 年 5 月 7
              日，Forbes 确认公司正深入洽谈以 $7.5B 估值融资至少 $500M，本轮由 AMP 领投；AMP 是前 a16z GP Anjney Midha
              创立的投资载体。报道称本轮显著超额认购，并讨论紧随其后的、更高估值追加轮。不到九个月内，估值从 $1.3B 到 $7.5B，约六倍升值，属于种子阶段公司最快的已记录估值跃迁之一，反映出投资人对 AI for
              science 赛道的广泛信心。没有公开报道显示公司有老股交易、债务或授信安排。
