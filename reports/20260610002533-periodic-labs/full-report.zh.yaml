          label: 第 3 步：机器人粉末合成——Atoms 实验室混合前驱体粉末、在炉中加热，产出物理样品（截至 2025 年 10 月仍在建设）
        - id: characterization
          label: 第 4 步：物理表征——仪器测量电导率、临界温度、晶体结构和磁响应
        - id: data_capture
          label: 第 5 步：自研数据捕获——记录包括失败在内的所有结果；生成 GB 级结构化实验数据集
        - id: model_update
          label: 第 6 步：AI 模型更新——用新实验数据做中期训练和 RL 微调；自然界提供明确训练信号
        - id: next_hypothesis
          label: 第 7 步：精炼假设——改进后的 AI 生成目标更精准的下一轮候选物；循环重启
    approximationNotes: 工作流综合自 a16z 投资文章、periodic.com、TechCrunch 2025 年 10 月报道和 AI Insider 报道。第 3 步 （机器人合成）截至 2025 年 10 月尚未完全自动化。
