    title: Periodic Labs 技术与运营架构
    columns:
      - 层级 / 组件
      - 系统角色
      - 关键依赖
      - 技术风险
    rows:
      - - LLM 假设生成（Bits）
        - 从文献和既往实验数据提出候选材料组成和合成条件
        - 前沿 LLM 能力；特定领域科学训练数据
        - a16z 称 AI 推理在凝聚态物理上低于人类专家；输出质量未经外部验证
      - - 量子力学模拟（Bridge）
        - 缩小搜索空间；在物理合成前过滤低概率候选
        - DFT 软件（VASP、Quantum ESPRESSO 或同等工具）；模拟运行所需算力
        - 面对新型化合物类别，模拟准确率会下降；假阳性会浪费实验室产能
      - - 机器人粉末合成（Atoms）
        - 混合前驱体粉末，在炉中加热，并规模化产出物理样品
        - 可靠的粉末合成机械臂；材料供应链；化学安全基础设施
        - 截至 2025 年 10 月尚未完全运行；建设时间表和吞吐量未披露
      - - 材料表征（Atoms）
        - 测量合成样品的电导率、临界温度、结构和磁性
        - 分析仪器（XRD、SQUID 磁强计等）；校准和计量规程
        - 仪器吞吐量限制每日实验量；测量误差会传导到训练数据
      - - 专有数据管线
        - 摄取、标注并存储所有实验结果，包括失败样本；供模型训练使用
        - 扎实的数据工程；科学实验记录的元数据标准
        - 数据集质量、标注准确性和覆盖范围尚未经过独立评估
      - - AI 模型训练（Bits）
        - 在专有实验数据上对领域模型做中期训练和 RL 微调
        - GPU / 超算集群；通过 NVentures 与 Nvidia 形成战略协同；分布式训练基础设施
        - 算力依赖带来基础设施成本，也可能形成供应商集中风险
      - - 商业代理层（Bits）
        - 将 AI 科学家能力打包给外部客户（半导体、航天、国防）
        - 客户数据访问协议；工程导入；IP 授权条款
