      - number: '6.3'
        title: 伙伴生态与进入市场
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 的投资人联合体同时也是早期进入市场网络。NVIDIA 的 NVentures 参与 $300M 种子轮，为公司连接半导体硬件基础设施，并可能向芯片 R&D 组织提供热引荐。领投方
              a16z 围绕先进制造和材料科学对 $15 trillion GDP 的影响有明确论点，也主动撰写了关于半导体、航天和国防牵引力的客户叙事。Felicis（第一张支票）、DST Global 和 Accel
              补齐机构网络。个人投资人包括 Jeff Bezos（Amazon）、Eric Schmidt（前 Google CEO）、Jeff Dean（Google Senior Fellow）和 Elad
              Gil，各自带来个人行业网络。

              硅谷顶级科技律师事务所之一 Wilson Sonsini Goodrich & Rosati 为创始轮提供法律顾问，确认交易合法性。Bromley Capital Partners（UK）披露其在 2026 年
              1 月为一笔投向 Periodic Labs 的数百万美元私募配售提供顾问服务，显示投资人基础正在扩展到全球机构参与者。2026 年 5 月针对「AGC Wealt Periodic Labs I」提交的 SEC
              Form D——AGC AI Nexus Fund 旗下基金载体——为持续结构化投资活动提供了监管确认。Forbes 2026 年 5 月报道的 $500M
              后续轮被描述为「大幅超额认购」，且公司正在讨论快速跟进的下一轮融资——这是投资人和市场对客户管线有强信心的又一个信号。
