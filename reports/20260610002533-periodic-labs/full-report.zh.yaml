      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最主要的增长驱动，是 AI 已展示出把材料发现到商业化周期从数十年压缩到约一到两年的能力；任何面临竞争时间压力的大型 R&D 组织都会因此被吸引。生成式 AI
              能力提升——尤其是可预测晶体结构稳定性的图神经网络，以及 DeepMind 的 GNoME 这类大模型（识别出 220 万种稳定材料）——已经把叙事从猜想推向验证。美国（CHIPS Act、DOE
              材料计划）、欧盟（电池 AI 联盟、MPIE 牵头、横跨 12 个国家的 33 方项目）和中国先进材料规划中的国家竞争力项目，形成政策顺风，补充了私营部门需求。

              与这些驱动相对，四个结构性采用约束分量很重。第一，数据质量和自研数据所有权是企业端首要瓶颈：实验数据集被孤岛化，往往缺乏标准化，还受复杂 IP 协议约束。第二，截至 2026 年，只有 29% 的企业报告 AI
              带来显著 ROI，意味着发现平台必须先给出具体、可衡量的结果，企业 R&D 预算才会大规模投入。第三，AI 治理不成熟普遍存在——按 Deloitte，2026 年只有约 25% 的组织拥有成熟 AI
              治理框架——这会拉长销售周期并增加合规负担，尤其在 AI 监管已覆盖 68 个国家的背景下。第四，AI 人才缺口（到 2026 年全球约 350
              万个岗位空缺）限制了潜在客户部署和维护复杂发现系统的内部能力。ComputeForecast 识别出的第五个结构性约束是，企业 AI
              采用基础设施搭建速度慢于技术本身，形成反复出现的部署滞后，并持续跑输市场乐观预期。
