              作为一家仍处在 Series A 阶段的私营公司，Periodic Labs 的公开财务披露义务很少，也没有主动公布财务指标；公开信息只确认公司在半导体、航天和国防垂直领域已有付费客户。标准 SaaS
              和深科技指标——年经常性收入（ARR）、毛利率、净留存率（NRR）、获客成本（CAC）、回本周期、客户数、流失率、收入同比增长——全部未披露。财务预测、单位经济模型和产品定价也没有发布。

              Periodic Labs 本身没有直接提交 SEC Form D，这一点值得注意：公司要么通过其他实体名称使用 Regulation D 豁免且未公开备案，要么依赖结构性豁免。已识别的 SEC Form
              D（2026 年 5 月提交）属于投资 Periodic Labs 的 AGC-Sydecar SPV，能确认有老股交易活动，但不能提供公司资产负债表或损益表层面的直接资本化数据。

              尽调中最关键的私有指标请求包括：月度烧钱速度、按季度计算的现金跑道、按合同拆分的毛利率、客户数与收入集中度、ARR 或收入运行率、IP 共同所有权条款、下一轮融资触发条件，以及任何债务或授信文件。截至 2026
