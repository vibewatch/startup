  - id: TR001
    title: 监管 / 法律风险登记表
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        OSHA standards 29 CFR 1910.1450 and 29 CFR 1910.147, ANSI/A3 R15.06-2025 robotics standard, EU AI Act 2024, and
        relevant biosecurity frameworks including NSCEB and CSIS analysis.
    columns:
      - 监管领域
      - 具体义务
      - Periodic Labs 暴露
      - 合规状态
      - 风险级别
    rows:
      - - OSHA Lab Standard（29 CFR 1910.1450）
        - 所有处理的新型化合物都需要化学卫生计划、PPE、通风橱和培训
        - AI 生成的新候选材料毒性未知；缺少毒理数据时必须按危险品处理
        - 未公开披露；推定进行中
        - 高
      - - OSHA HCS 2024 / GHS Rev 7
        - 2024 年起更新所有危险化学品的 SDS 和标签；2026 年前全面合规
        - 自主合成新材料会生成没有既有 SDS 数据的化合物
        - 未见公开合规声明
        - 高
      - - OSHA Lockout/Tagout（29 CFR 1910.147）
        - 所有机械臂和自动化设备维护都需要能源控制程序
        - 拥有多套机器人系统的自主实验室需要成文 LOTO 计划
        - 未披露
        - 中
      - - ANSI/A3 R15.06-2025
        - 每个新增或修改的机器人流程前都必须完成成文风险评估；2025 年 9 月生效
        - AI 持续改变实验变量，意味着机器人配置会频繁更新
        - 未披露；新标准截至 2025 年 9 月生效
        - 高
      - - 双重用途 / 生物安全
        - NSCEB、CSIS 和 EU AI Act 对自主 AI 实验室平台的高风险分类
        - 未披露双重用途筛查规程；CSIS 和 RAND 已识别结构性缺口
        - 未披露政策
        - 严重
    claimRefs:
