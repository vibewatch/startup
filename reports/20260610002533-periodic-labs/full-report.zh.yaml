      - number: '8.2'
        title: 估值背景、可比公司与情景
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 2025 年 9 月种子轮投后估值 $1.3B，对一家尚未有收入的深科技初创公司已经偏激进。若 2026 年拟议轮次按 $7.5B 推进，公司估值将高于 Sakana AI 据报道
              $2.65B 的 Series B 标记（2025 年 11 月），高于 Pathos AI $1.6B 的 Series D 估值，也高于所有已披露的私有 AI 科学可比公司。只有 Isomorphic
              Labs 的融资规模接近：它带着 DeepMind 的 AlphaFold 这项已被验证的先例进入市场，与 Eli Lilly 和 Novartis 有活跃药企合作，潜在里程碑付款最高 $3B，并在 2025 年
              3 月完成首笔外部融资 $600M （Series A），随后在 2026 年 5 月完成 $2.1B Series B；但公司未披露投后估值。


              Finro 2026 年一季度覆盖 575 家 AI 公司的数据给出市场参照。LLM 供应商的 EV/Revenue 中位数为 39.5x（平均 73.5x），种子阶段 AI 公司的中位数为 20.2x，Data
              Intelligence 公司的中位数为 14.3x。 Finerva 数据显示，上市 Robotics and AI 公司的 EV/Revenue 中位数只有 3.4x，低于 2021 年高点的 6x。若估值
              $7.5B、假设 ARR 为 $50M，隐含倍数将超过 150x——高于 LLM 供应商类别中位数，说明估值完全锚定长期发现经济性，而不是近期收入。私有 AI 市场相对上市可比公司的溢价真实且持续存在，但按
              Periodic 的隐含倍数看，即便以 2026 年标准衡量，这一差距也异常大。


              这里按 5 年退出窗口（2031 年）建模三种情景。乐观情景假设公司凭借在半导体、电池和特种材料垂直领域的平台主导地位实现 $500M+ ARR，并以 20-30x 倍数退出，估值 $12-20B。基准情景预计
              ARR 为 $150-250M，有 2-3 个合作伙伴，自动化实验室到 2027 年投入运行，对应退出估值 $5.5-10B——相对 $7.5B 入场价大致持平到小幅回报。悲观情景假设自动化实验室延迟到 2028
              年以后，收入规模未能兑现，倍数压缩到 10-15x，估值低于当前标记。Gartner 2026 年 4 月预测，2026 年全球半导体收入将超过 $1.3T（同比增长 64%，AI 芯片占总量
              30%），这验证了可解决问题的规模；但 Periodic 近期能吃下多少市场，仍取决于尚未去风险的实验室落地和商业化执行。
