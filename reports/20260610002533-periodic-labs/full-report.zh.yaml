            title: 创始人履历和人才密度无可匹敌
            body: >-
              Fedus 在 OpenAI 的后训练领导经历（ChatGPT、GPT-4o、o1），叠加 Cubuk 在自主实验室和材料发现上的记录（GNoME、A-Lab），形成了一组独特搭配，正好对应 AI
              科学家论点最需要的两种能力。Alexandre Passos（o1/o3）、Eric Toberer（超导体化学）和 Matt
              Horton（MatterGen）的加入进一步强化了这个优势。没有其他初创公司同时在三根支柱上拼出同等级深度。
