      - number: '7.3'
        title: 资本、商业与竞争风险
        blocks:
          - type: paragraph
            body: >
              Periodic Labs 于 2025 年 9 月完成的 $300 million 种子轮，是科学 AI 初创公司史上最大的种子轮之一。资本带来异常充足的现金跑道，但也同时把公司锁进 VC
              规模回报预期，而这种预期与材料科学商业化时间线在结构上错位。历史上，突破性材料——包括 Periodic Labs 瞄准的超导体——从初始发现到商业可用产品需要 10 到 15
              年。第三方财务分析估计，考虑自主实验室基础设施、来自 OpenAI 和 DeepMind 的顶尖研究人才以及 GPU 计算需求，年运营成本为 $50-75 million，意味着如果没有商业收入流，$300M
              种子轮可能在四到六年内耗尽。MIT Technology Review 2025 年 12 月指出，AI 材料发现初创公司尚未跨过实验室到市场的转化门槛，而这是证明 VC 规模回报假设所必需的；PitchBook
              2026 年分析也称该品类通往 VC 回报是一条「曲折道路」。竞争压力进一步压缩商业可选项。Lila Sciences 完成 $550M 融资，CuspAI 融资 $154M，Microsoft 于 2025 年
              1 月以 MIT 开源许可证发布 MatterGen，使 AI 预测层商品化。Google DeepMind 的 GNoME 正在公开发表结果。Orbital Industries 于 2026 年获得 $50M
              Series B，正在推进 AI 加制造的垂直整合模式。投资人集中还制造额外金融风险向量：Andreessen Horowitz 和 Nvidia 是锚定投资人，而 Nvidia 同时持有 Orbital
              Industries 的组合敞口，可能在未来融资或合作讨论中形成潜在利益冲突。如果公司寻求 Series A 资本，而早期里程碑让任何锚定投资人失望，逆向选择动态可能加速团队流失并拖延商业时间线。WEF
              分析强调，把 AI 预测转化为可上市材料，需要监管批准、制造验证和客户采用步骤；Periodic Labs 尚未公开披露如何处理这些步骤。
