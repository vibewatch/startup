companyProfile:
  summary: >-
    Periodic Labs 是一家旧金山初创公司，由前 OpenAI 后训练负责人 Liam Fedus 和前 Google DeepMind 材料科学负责人 Ekin Dogus Cubuk 于 2025 年创立。公司在打造「AI
    科学家」：把前沿模型、仿真工作流和自主实验室基础设施接成闭环，用来生成假设、运行实验并发现新材料。公开描述的应用包括高温超导体和半导体散热问题；早期商业活动据称覆盖半导体、航天和国防客户。Periodic 于 2025 年 9
    月完成创纪录的 $300M 种子轮，投后估值约 $1.3B；2026 年又被报道正在讨论约 $7.5B 估值的新一轮融资。核心尽调问题不是团队是否出色——而是公司能否足够快地把科学前景变成可重复的商业结果，以支撑这次估值跃迁。
