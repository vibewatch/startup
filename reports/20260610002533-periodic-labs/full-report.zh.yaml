      - number: '3.3'
        title: 相邻自主实验室与云 CRO 平台
        blocks:
          - type: paragraph
            body: >
              另一类竞争者提供实验室即服务基础设施层，而 Periodic Labs 目标是把这一层内化：云实验室、CRO 自动化平台和编排初创公司。

              Emerald Cloud Lab（ECL，Austin, TX）运营一座完全由软件控制的设施，超过 200 种仪器型号可通过 ECL Command Center 全天候远程访问。ECL
              面向生命科学和生物技术，而不是先进材料合成，但它的「云实验室」模式是 Periodic 自主实验室的直接概念先例。ECL 的定价——每年可能超过
              $250,000——使其主要服务于资金充足的商业客户。Strateos 提供类似云实验室模式，用符号编程支持自主工作流，目标是制药和合成生物学应用。Arctoris 为药物发现 CRO 搭建自主机器人工作单元。

              Recursion Pharmaceuticals（NASDAQ: RXRX）是端到端 AI 加物理实验室发现公司的公开市场先例。截至 2026 年 Q1，Recursion 股价约 $3.20–$3.50（从
              $40 以上峰值下跌），Q1 收入为 $6.47M（低于预期），持有 $665M 现金。其 Recursion OS 平台摄入 50+ PB 自研生物数据。Recursion 的股价表现给 Periodic
              Labs 投资人敲响警钟：即便一家 AI 实验室公司资金充足、人员到位，也可能需要多年商业验证，市场才会给出溢价估值。Recursion 约 $560M 的年化净亏损和收入不及预期，凸显在临床 /
              材料证据点出现之前，AI 实验室平台变现有多难。

              在 SLAS 2026 上，15 家公司竞争成为 AI 赋能实验室的操作系统层——Biosero、Automata、Synthace、UniteLabs 等。Automata 于 2026 年 1 月完成
              $45M Series C，战略投资方为 Danaher Ventures，直接把 Danaher 的仪器组合与 Automata 的 LINQ 编排平台连接起来。Ginkgo Bioworks 通过与
              OpenAI 合作，于 2026 年 2 月发表结果，显示 GPT-5 自主执行 36,000 次蛋白质合成实验，将 sfGFP 生产成本降低约 40%。这个概念验证对 Periodic 的「AI
              科学家」叙事形成压力：大规模 AI 实验室实验已经由既有玩家执行，而不只是资金雄厚的新进入者。Atinary 在 SLAS 2026 于 Boston 启动首个物理自驱实验室，直接进入材料与制药自主优化空间。
