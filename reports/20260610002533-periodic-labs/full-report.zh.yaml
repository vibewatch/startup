      - number: '4.3'
        title: 资本充足性与现金跑道
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 进入 2026 年时，已披露资本全部来自 $300 million 种子轮。月度烧钱速度未披露；分析师估计区间为每月 $5 million 到 $15
              million，反映实验室建设、计算支出和竞争性人才成本的组合。按每月 $10 million 中位数计算，$300 million 种子轮可从 2025 年 9 月交割起提供约 30 个月现金跑道，也就是大约到
              2028 年 3 月——明显早于 Series A 交割。下限（$5M/month）把跑道延至 60 个月；上限（$15M/month）压缩至 20 个月，可能在 Series A 资金到账前的 2027
              年中触及。

              如果 Series A 以 $500 million、$7.5 billion 估值交割，在相同烧钱速度下会再提供 33–100 个月现金跑道，在中等烧钱速度下基本可把公司资助到 2030
              年代中期。这一点在结构上重要，因为材料科学发现周期——即便有 AI 加速——也以年为单位。累计 $800 million 融资将给公司一条可信的多年跑道，用来在再次接触资本市场前证明突破。

              不过，资本充足性风险仍来自清算优先权结构：$300 million 种子轮优先股在所有普通股股东之前拥有清算优先权。任何等于或低于隐含 $1.2–$1.3 billion
              种子轮估值的退出中，普通股持有人（包括员工）都拿不到回报。Series A 还会增加进一步的优先股堆叠。UpsideList 估计，如果商业化停滞，悲观情景下当前水平的股权价值可能下跌
              -70%，这会完全抹去普通股价值。公司的债务和项目融资义务未披露；没有公开迹象显示有授信安排或设备租赁补充股权资本，不过 2026 年 5 月提交的、由 Sydecar 管理 SPV 的 SEC Form D
              表明，围绕 Periodic Labs 的二级投资人融资活动仍在进行。
