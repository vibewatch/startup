  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与 AI 模型风险
        blocks:
          - type: paragraph
            body: >
              Periodic Labs 的核心论点建立在一串技术假设上，每一环都有重大失败风险。最根本的是合成缺口：包括 DeepMind GNoME 等前代系统在内，AI
              模型经常预测出在物理世界中很难或无法实现的结构。GNoME 预测了 2.2 million 个晶体结构；其中只有大约 380,000 个被认为潜在稳定，截至 2025 年底，只有约 736
              个得到独立合成和验证。Periodic Labs 的自主系统会面对同样约束——数字预测并不保证物理可实现，瓶颈已经从模型推理转移到实验室验证。第二个技术风险是 AI 幻觉。2025 年 4 月发表于 arXiv
              的学术研究区分了良性模型错误和「腐蚀性幻觉」——这类输出科学上看似合理，但事实错误且难以识别。在 AI
              输出直接驱动机器人实验排队的闭环自主实验室中，腐蚀性幻觉可能在人工审查发现前穿过多个实验周期，浪费昂贵试剂，并为下游模型再训练生成误导性数据。底层数据质量是第三个担忧。主动学习循环依赖密度泛函理论计算提供真值标签；系统性
              DFT 偏差会把错误传入迭代训练周期。物理实验也无法像数字 AI 训练那样以接近零边际成本扩展，限制了投资人可能期待的迭代速度。随着系统自动化程度提高而逐步减少人在环监督，会进一步压缩发现失败的窗口。
