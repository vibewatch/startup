      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              可以识别出四类主要商业买方，它们的预算归属、采用触发点和准备度各不相同。制药和生物技术公司是当前 AI 实验室自动化的最大部署基础，驱动力来自董事会层面的 AI 药物发现要求，以及压缩 pre-IND
              材料筛选周期的可能性。电池和储能公司面对 EV 与电网储能市场的竞争压力，近期准备度最高；SandboxAQ 的 AQVolt26 固态电池材料项目就是证据之一。半导体制造商正在成为增长分支，因为 AI
              平台现在已经能够为下一代芯片供应链提出新的镓合金和二维材料。

              特种化学品公司的即时准备度较低——数据资产碎片化，内部 AI 治理框架也不成熟——但随着 ROI
              证据累积，它们代表着一个大型潜在市场。政府机构和学术研究联盟构成第二层买方，尤其是与国家竞争力任务绑定的超导体和先进半导体项目。亚太是增长最快的地区，受中国 16%+ 年度制药 R&D
              增长和国家支持的先进材料投资计划驱动。北美仍拥有最大的绝对市场份额，并承载该行业多数私营 VC 投资。
