company:
  name: Periodic Labs
chapter:
  number: 7
  title: Risks
  summary: 'Periodic Labs confronts a multi-layered risk stack spanning AI-model reliability (synthesis gap, hallucination,
    reproducibility), regulatory and dual-use chemical safety obligations, extreme capital intensity relative to deep-tech
    commercialization timelines, a crowded competitive landscape anchored by well-resourced incumbents, and key-person dependency
    on two star founders. The $300 million seed round provides exceptional runway but simultaneously creates investor-return
    pressure at odds with materials-science discovery cycles that historically span a decade or more. Residual dual-use and
    governance risks from autonomous chemical experimentation represent emerging regulatory exposure that current frameworks
    do not fully address, and no public AI governance policy has been disclosed by the company.

    '
sections:
- id: technical-model-risks
  title: Technical and AI-Model Risks
  body: 'Periodic Labs'' core thesis rests on a chain of technical assumptions, each carrying material failure risk. The most
    fundamental is the synthesis gap: AI models, including predecessor systems like DeepMind''s GNoME, routinely predict structures
    that prove difficult or impossible to realize in the physical world. GNoME predicted 2.2 million crystal structures; only
    approximately 380,000 were deemed potentially stable, and as of late 2025 only around 736 have been independently synthesized
    and verified. Periodic Labs'' autonomous systems will face the same constraint — digital prediction does not guarantee
    physical realizability, and the bottleneck has shifted from model inference to laboratory validation. A second technical
    hazard is AI hallucination. Academic research published on arXiv in April 2025 distinguishes between benign model errors
    and "corrosive hallucinations" — outputs that are scientifically plausible but factually incorrect and resistant to detection.
    In a closed-loop autonomous lab where AI outputs directly drive robotic experiment queuing, a corrosive hallucination
    can propagate through many experimental cycles before human review detects it, wasting costly reagents and generating
    misleading data for downstream model retraining. Underlying data quality is a third concern. Active learning loops depend
    on density functional theory calculations for ground-truth labels; systematic DFT biases propagate errors into iterative
    training cycles. Physical experiments also cannot scale at near-zero marginal cost the way digital AI training can, limiting
    the iteration speed investors may expect. Progressively reducing human-in-the-loop oversight as the system automates compounds
    these risks by shrinking the window for catching failures.

    '
