- id: regulatory-legal-safety
  title: Regulatory, Legal, and Safety Risks
  body: 'Periodic Labs operates autonomous robotic laboratories handling reactive, novel, and potentially hazardous chemical
    compounds. This creates immediate compliance obligations under OSHA''s Laboratory Standard (29 CFR 1910.1450) and its
    2024 Hazard Communication Standard update aligned with the GHS 7th revision, which mandates new labeling and SDS requirements
    for all chemicals handled, including novel AI-generated candidates whose toxicity profiles are unknown. OSHA''s robotics
    standards impose lockout/tagout requirements on all automated equipment, and the September 2025 publication of ANSI/A3
    R15.06-2025 requires documented risk assessments before every new or modified robotic process. OSHA''s accident database
    records a February 2024 fatality in which an employee was crushed by a robot arm, illustrating that even mature industrial
    robot deployments can produce fatal outcomes. Dual-use exposure presents a qualitatively different regulatory risk. A
    2022 experiment documented that AI chemistry tools could generate thousands of potentially weaponizable molecules in hours
    when safety filters were disabled. CSIS, RAND, and the US National Security Commission on Emerging Biotechnology have
    all flagged autonomous AI laboratories as sources of emerging biosecurity risk that current governance frameworks do not
    adequately address. The EU AI Act (2024 amendment) classifies AI-driven lab platforms as high-risk. Arms Control Association
    reported in November 2025 that benchtop synthesis regulatory gaps create structural biosecurity vulnerabilities directly
    analogous to autonomous materials experimentation. A regulatory enforcement action targeting autonomous laboratory AI
    — which CSIS and RAND both advocate — could require operational halts or costly licensing regimes not currently budgeted.
    IP and legal risk is a third dimension. Inventorship status of AI-generated material discoveries is unresolved at both
    USPTO and EPO. Training-data litigation risk is escalating, and export control obligations may apply if novel materials
    intersect with strategic defense applications.

    '
