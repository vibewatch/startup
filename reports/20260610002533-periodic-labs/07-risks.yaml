    type: missing-source
    topic: ai-governance
    severity: material
    missingEvidence: No AI governance framework, dual-use screening protocol, or autonomous system safety policy has been
      publicly disclosed by Periodic Labs as of June 2026.
    whyItMatters: Regulatory bodies and ESG-sensitive investors increasingly require published AI safety frameworks; absence
      creates exposure from sector-wide incidents and potential enforcement actions by NSCEB, CSIS-advocated regulators, or
      EU AI Act supervisory authorities.
    diligencePath: Request the company's internal AI safety documentation and any board-level governance resolutions; benchmark
      against RAND and CSET recommendations.
    relatedQuestionRefs:
