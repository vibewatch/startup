    whyItMatters: Novel materials with potential defense applications could face export licensing requirements that restrict
      commercialization in key markets or create compliance costs not budgeted in the $300M seed.
    diligencePath: Engage export control counsel to review materials categories as discovery progresses; request company position
      on EAR classification.
