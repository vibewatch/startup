    whyItMatters: Without compliance documentation, investors cannot assess whether autonomous laboratory operations meet
      occupational safety and chemical handling requirements, creating material legal and operational risk.
    diligencePath: Request compliance documentation directly from the company; consult OSHA inspection records and state safety
      agency registries.
