  - id: valuation-context-comparables-scenarios
    title: "Valuation Context, Comparables, and Scenarios"
    body: >-
      Periodic Labs' $1.3B seed valuation in September 2025 was already aggressive for a pre-revenue deep-tech startup. The proposed $7.5B 2026 round would position the company above Sakana AI's reported $2.65B Series B mark (November 2025), above Pathos AI's $1.6B Series D valuation, and at a premium to every disclosed private AI science comparator. Only Isomorphic Labs—which entered the market with DeepMind's AlphaFold as proven prior art, active pharmaceutical partnerships with Eli Lilly and Novartis generating up to $3B in potential milestones, and its first external capital raise of $600M (Series A, March 2025) followed by a $2.1B Series B (May 2026)—has raised at comparable magnitudes, though without disclosing a post-money valuation.


      Finro's Q1 2026 dataset of 575 AI companies provides a market context anchor. LLM vendors trade at a median 39.5x EV/Revenue (average 73.5x), seed-stage AI companies at a median 20.2x, and Data Intelligence companies at a median 14.3x. Finerva data shows public Robotics and AI companies trade at only 3.4x median EV/Revenue, down from 6x in the 2021 peak. At $7.5B and an assumed $50M ARR, the implied multiple would exceed 150x—above the LLM vendor category median and suggestive of a valuation anchored entirely on long-run discovery economics, not near-term revenue. Private AI market premiums over public comps are real and persistent, but the gap at Periodic's implied multiple is extraordinary even by 2026 standards.


      Three scenarios are modeled for a 5-year exit horizon (2031). The Bull case assumes $500M+ ARR driven by platform dominance across semiconductor, battery, and specialty materials verticals, supporting an exit at 20-30x at $12-20B. The Base case projects $150-250M ARR with 2-3 partnerships and autonomous labs operational by 2027, implying an exit at $5.5-10B—roughly flat to a modest return from the $7.5B entry. The Bear case assumes autonomous lab delays past 2028, revenue scale failing to materialize, and multiple compression to 10-15x, producing a valuation below the current mark. The Gartner April 2026 forecast that global semiconductor revenue will exceed $1.3T in 2026 (64% YoY growth, with AI chips representing 30% of the total) validates the scale of the addressable problem, but Periodic's near-term capture of that market is dependent on un-de-risked laboratory and commercialization execution.
