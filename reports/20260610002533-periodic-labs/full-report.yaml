      - number: '1.3'
        title: Funding History Valuation and Investor Landscape
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs executed one of the largest seed rounds in venture-capital history when it emerged from
              stealth on September 30 2025 announcing $300 million at a $1.3 billion post-money valuation. The round was
              led by Andreessen Horowitz a16z; the first institutional check came from Felicis Ventures partner Peter
              Deng a former OpenAI executive who committed before the company was even incorporated or named. Additional
              institutional participants included DST Global NVentures (NVIDIA venture-capital arm) and Accel. The angel
              syndicate included Amazon founder Jeff Bezos former Google CEO Eric Schmidt Google Chief Scientist Jeff
              Dean and investor Elad Gil. Despite early signals in Fedus departure tweet suggesting OpenAI would invest
              the founders confirmed to TechCrunch that OpenAI is not a backer of Periodic Labs; the decision was made
              to work with a16z for broader strategic resources. The pre-money valuation of approximately $1.0 billion
              reflects what investors were willing to pay for a company with no product no revenue and no disclosed IP
              at the time of launch. Wilson Sonsini Goodrich and Rosati served as legal counsel for the transaction. By
              March 2026 Bloomberg reported Periodic Labs was in deal talks targeting approximately $7 billion in
              valuation. By May 7 2026 Forbes confirmed the company was in advanced talks to raise at least $500 million
              at a $7.5 billion valuation in a round led by AMP an investment vehicle founded by former a16z GP Anjney
              Midha. The round was described as significantly oversubscribed with discussions of a fast-follow
              additional round at even higher valuation. The approximately sixfold appreciation from $1.3 billion to
              $7.5 billion in under nine months ranks among the fastest recorded valuation increases for a seed-stage
              company reflecting broad investor conviction in the AI-for-science sector. No secondaries debt or credit
              facilities have been publicly reported.
