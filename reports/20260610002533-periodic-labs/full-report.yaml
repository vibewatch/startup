  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Bull, base, and bear exit valuation ranges for Periodic Labs at a 5-year horizon (2031), each reflecting distinct
      assumptions about autonomous lab operationalization, commercial revenue ramp, and AI multiple environments.
    data:
      items:
        - label: 'Bear Case (2031): Lab delays, minimal revenue, multiple compression'
