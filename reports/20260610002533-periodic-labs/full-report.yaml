            title: 'Nature-as-RL Assumption: Physical Science Will Scale Like Math and Code Benchmarks'
            body: >
              The company's core architectural bet is that treating physical experiments as a reinforcement learning
              environment will drive model improvement at rates analogous to how code execution and math verification
              enabled AlphaCode and AlphaProof. This analogy has surface plausibility—physical outcomes are verifiable,
              like code test results—but faces meaningful disanalogies: physical experiments take hours to days versus
              milliseconds for code; they involve irreducible measurement noise; materials synthesis is costlier than
              compute; and the search space for materials chemistry is vastly larger than for programming tasks with
              defined test suites. Whether RL-from-physical- experiments converges in commercially relevant timeframes
              is the company's most consequential unverified thesis.
