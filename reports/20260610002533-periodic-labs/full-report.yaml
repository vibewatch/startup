            title: Core Scientific Thesis Unproven; Key-Person Concentration Severe
            body: >-
              As of June 2026 Periodic Labs has not publicly announced any completed materials discovery from its
              autonomous lab. Skeptics including Yann LeCun and the 2025 Futurism/Wiley survey of working scientists
              where AI trust dropped sharply highlight that current AI pattern-matching may not support genuine
              autonomous scientific hypothesis generation. The 2025 Nature study further found AI tools may narrow the
              diversity of scientific inquiry. Operationally both co-founders are central to the company identity and
              investor thesis and no succession or governance structure has been publicly disclosed. These risks
              combined with a reported $7.5 billion valuation that is pre-discovery constitute the primary diligence
              questions for any investor.
