      - number: '5.2'
        title: 'Technology Stack: Bits and Atoms Dual-Track Platform'
        blocks:
          - type: paragraph
            body: >
              Periodic Labs structures its technology around two explicitly named tracks, visible in its public job
              listings and internal communications: "Bits," covering LLM research, machine learning infrastructure, and
              distributed training engineering; and "Atoms," covering physical lab automation, robotics, powder
              synthesis process engineering, thin-film deposition, and materials characterization. This dual-track
              architecture reflects the company's fundamental insight that delivering an AI scientist requires
              simultaneous excellence in two domains that rarely exist within a single organization.

              The "Atoms" platform centers on powder synthesis laboratories where robotic arms mix precursor chemicals,
              heat them in furnaces to specified temperatures, and subject the resulting materials to characterization
              instruments that measure properties including electrical conductivity, magnetic response, and crystal
              structure. The company confirmed in October 2025 that laboratory construction was underway in Menlo Park,
              California, though the full robotic stack was not yet operational at that time. Job listings as of June
              2026 show active hiring for Automation Engineers, Process Engineers (Powder), Research Scientists in
              Materials Synthesis and Thin Films, and a Multiphysics Simulation Scientist focused on
              semiconductors—indicating the Atoms track continues active buildout beyond the original powder synthesis
              focus.

              The "Bits" platform centers on LLM training and fine-tuning for scientific reasoning. The company builds
              domain-specific AI models through a combination of pre-training on scientific literature, mid-training on
              proprietary experimental data, and reinforcement learning against experimental outcomes. Co-founder Cubuk
              described the approach as treating physics as a "verifiable environment" analogous to math and
              code—domains where RL-driven AI has progressed fastest. The Bits team hires Distributed Training
              Engineers, ML Systems Engineers, and Supercompute Engineers, signaling the infrastructure scale necessary
              for training large domain-specialized models.

              Bridging the two tracks is a quantum mechanical simulation layer that narrows the candidate search space
              before committing to physical synthesis. This layer inherits directly from the GNoME methodology—graph
              neural networks for predicting crystal stability—and from density functional theory software tools,
              enabling the AI to rapidly screen millions of candidate compound compositions before selecting a subset
              for physical validation. The a16z investment thesis explicitly states: "The models will read literature,
              run quantum mechanical simulations, take action in the lab, and get feedback from nature itself." Negative
              experimental results are deliberately captured and included in the training data—a structural advantage
              over the published scientific literature, which has strong publication bias toward positive outcomes only.
