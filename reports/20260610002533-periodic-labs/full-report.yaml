  - id: FR001
    title: 'Risk Heatmap: Periodic Labs Risk Universe'
    type: matrix
    description: >
      Multi-dimensional risk heatmap scoring seven risk categories on probability (x-axis) and impact severity (y-axis).
      Each cell includes a tone indicator and brief descriptor.
    data:
      columns:
        - label: Low Probability
          tone: positive
        - label: Medium Probability
          tone: neutral
        - label: High Probability
          tone: negative
      rows:
        - label: Critical Impact
          values:
            - label: N/A
              tone: neutral
              detail: No critical-impact, low-probability risks identified at this stage.
            - label: Regulatory Shutdown
              tone: negative
              detail: >-
                Federal enforcement action targeting autonomous lab; sector-wide OSHA or DHS response to dual-use
                incident.
            - label: Synthesis Gap Persists
              tone: negative
              detail: >-
                AI predictions remain largely unrealizable; core product thesis invalidated. Consistent with GNoME-era
                verification rate.
        - label: High Impact
          values:
            - label: Co-founder Departure
              tone: negative
              detail: Loss of Cubuk or Fedus before commercial milestone; severe but low-probability given equity incentives.
            - label: Capital Exhaustion
              tone: negative
              detail: Burn rate of $50-75M/yr exhausts $300M within 4-6 years without commercial revenue.
            - label: Corrosive Hallucination Incident
              tone: negative
              detail: AI-generated errors propagate through multiple autonomous experiment cycles before detection.
        - label: Medium Impact
          values:
            - label: DFT Data Bias
              tone: neutral
              detail: >-
                Systematic approximation errors in training labels reduce model accuracy; correctable with
                recalibration.
            - label: IP Inventorship Disputes
              tone: neutral
              detail: USPTO/EPO uncertainty on AI-generated inventorship; blocks or delays patent filings.
            - label: Competitive Commoditization
              tone: negative
              detail: MatterGen MIT release and GNoME open publication erode prediction-layer differentiation.
    claimRefs:
      - CR001
      - CR003
      - CR020
      - CR025
      - CR026
  - id: FR002
    title: Commercial Risk Transmission Chain
    type: dag
    description: >
      Directed acyclic graph tracing how upstream technical and regulatory risks transmit through commercial and
      competitive channels to investor-return outcomes.
    data:
      nodes:
        - id: N1
          label: AI Synthesis Gap
          detail: Predicted structures remain largely unrealizable in physical laboratory setting.
          tone: negative
        - id: N2
          label: Slow Experimental Throughput
          detail: Physical synthesis cannot scale at near-zero marginal cost; iteration rate constrained.
          tone: negative
        - id: N3
          label: Delayed Milestone Proof
          detail: First independently verified material discovery takes longer than investor timeline expects.
          tone: negative
        - id: N4
          label: Regulatory Compliance Burden
          detail: OSHA, ANSI/A3, and dual-use screening requirements increase operational overhead.
          tone: negative
        - id: N5
          label: Increased OpEx
          detail: Compliance, safety, and legal costs add to the $50-75M estimated annual burn.
          tone: negative
        - id: N6
          label: Competitive Pressure
          detail: MatterGen open-source, GNoME publications, Lila Sciences $550M reduce differentiation window.
          tone: negative
        - id: N7
          label: Compressed Commercial Window
          detail: Competitor announcements erode first-mover advantage before Periodic Labs achieves product-market fit.
          tone: negative
        - id: N8
          label: Series A Adverse Selection
          detail: Anchor investor (Nvidia) holds conflicting portfolio position; difficult financing environment.
          tone: negative
        - id: N9
          label: Investor Return Impairment
          detail: VC-scale returns require 10-50x; materials-science timelines compress realistic multiples.
          tone: negative
      edges:
        - from: N1
          to: N2
          label: causes
        - from: N2
          to: N3
          label: leads to
        - from: N4
          to: N5
          label: drives
        - from: N5
          to: N3
          label: compounds
        - from: N6
          to: N7
          label: creates
        - from: N3
          to: N8
          label: triggers
        - from: N7
          to: N8
          label: worsens
        - from: N8
          to: N9
          label: results in
    claimRefs:
      - CR020
      - CR022
      - CR024
      - CR025
      - CR026
      - CR041
  - id: FR003
    title: Governance Risk Dependency Tree
    type: dag
    description: >
      Dependency graph showing how the absence of an AI governance policy creates cascading risk exposure across
      regulatory, reputational, and operational dimensions.
    data:
      nodes:
        - id: G1
          label: No AI Governance Policy
          detail: >-
            Periodic Labs has not disclosed an AI governance framework, dual-use screening protocol, or safety policy as
            of June 2026.
          tone: negative
        - id: G2
          label: No Dual-Use Screening
          detail: Autonomous AI-directed synthesis has no disclosed filter preventing weaponizable compound generation.
          tone: negative
        - id: G3
          label: No Incident Response Plan
          detail: Absence of safety framework means no defined response if autonomous synthesis produces hazardous output.
          tone: negative
        - id: G4
          label: Regulatory Exposure
          detail: CSIS and RAND advocate mandatory governance for autonomous AI labs; current gap invites enforcement.
          tone: negative
        - id: G5
          label: Reputational Risk
          detail: Public incident — even sector-wide — could associate Periodic Labs with unsafe autonomous AI chemistry.
          tone: negative
        - id: G6
          label: Investor Confidence Risk
          detail: ESG-sensitive LPs and corporate partners may avoid companies without published AI safety frameworks.
          tone: negative
        - id: G7
          label: 'Mitigation: ANSI/A3 Adoption'
          detail: Adopting R15.06-2025 robot safety documentation provides first layer of defensible compliance.
          tone: positive
        - id: G8
          label: 'Mitigation: Publish AI Safety Policy'
          detail: >-
            Proactive publication of dual-use screening and human-oversight checkpoints reduces regulatory and
            reputational exposure.
          tone: positive
      edges:
        - from: G1
          to: G2
          label: implies
        - from: G1
          to: G3
          label: implies
        - from: G2
          to: G4
          label: creates
        - from: G3
          to: G5
          label: amplifies
        - from: G4
          to: G6
          label: feeds
        - from: G5
          to: G6
          label: compounds
        - from: G7
          to: G4
          label: partially mitigates
        - from: G8
          to: G4
          label: substantially mitigates
        - from: G8
          to: G5
          label: substantially mitigates
    claimRefs:
      - CR030
      - CR031
      - CR032
      - CR034
      - CR035
      - CR039
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Chain from market scale, team depth, product differentiation, and early traction through valuation risk to a TRACK
      recommendation.
    data:
      nodes:
        - id: market
          label: 'Large TAM: Semiconductor, pharma, energy materials R&D ($1.3T+ semiconductor market in 2026)'
        - id: team
          label: 'World-class Team: OpenAI VP + DeepMind materials lead; 20+ elite researchers'
        - id: product
          label: 'Differentiated Product: Proprietary autonomous experimental data loop; closed-loop AI scientist'
        - id: traction
          label: 'Early Commercial Traction: Semiconductor manufacturer engagement; paying customers'
        - id: valuation_risk
          label: 'Valuation Risk: $7.5B proposed, no revenue anchor, 6x jump in 8 months'
        - id: recommendation
          label: 'TRACK: Monitor for autonomous lab go-live and commercial revenue scale before entry at $7.5B'
      edges:
        - from: market
          to: recommendation
        - from: team
          to: recommendation
        - from: product
          to: recommendation
        - from: traction
          to: recommendation
        - from: valuation_risk
          to: recommendation
