      - number: '2.5'
        title: Vertical Commercialization Vectors
        blocks:
          - type: paragraph
            body: >-
              Four verticals represent the near-term commercialization path for AI materials discovery platforms,
              differing in readiness, buyer urgency, and revenue model. Battery and energy storage is the
              highest-readiness vertical: the global battery storage market's commercial urgency around solid-state
              electrolytes and new electrode chemistries directly maps to AI platforms' ability to generate and screen
              novel material formulations. SandboxAQ's AQVolt26 initiative and the EU's 33-partner AI battery consortium
              both validate the commercial maturity of this application vector. Semiconductors are close behind: AI
              platforms can now propose novel gallium alloys and 2D materials at chip-relevant properties, feeding
              directly into advanced logic and memory supply chains.

              High-temperature superconductors represent Periodic Labs' stated primary target and arguably the
              highest-upside vertical—commercial applications in quantum computing and power-grid infrastructure would
              carry transformative economic value—but also carry the highest scientific and timeline risk, as the step
              from predicted structure to validated synthesis at scale has never been achieved for room-temperature
              superconductors. Pharma-adjacent discovery tools (excipients, novel drug-delivery scaffolds, biocompatible
              materials) represent a large and growing sub-segment of the $300B pharmaceutical R&D budget, with IQVIA's
              Global Trends in R&D 2026 report confirming AI's growing role in pre-IND material screening. SaaS-model
              platforms targeting these verticals can achieve gross margins of 70–90%, substantially above traditional
              CRO services, making the business model highly defensible at scale.
