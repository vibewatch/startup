      - number: '1.2'
        title: Founding Team Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs was co-founded by Liam Fedus and Ekin Dogus Cubuk two of the most credentialed AI and
              materials-science researchers of the past decade. Fedus who serves as CEO holds a BS in physics from MIT
              (2010) an MS in physics from UC San Diego (2016) and a PhD in computer science from the Universite de
              Montreal and MILA (2020) co-advised by Yoshua Bengio and Hugo Larochelle. At Google Brain he was the lead
              author of the Switch Transformer paper (2021) the reference architecture for sparse mixture-of-experts
              language models scaling to a trillion parameters. He joined OpenAI in 2022 as a senior research scientist
              became data-flywheel lead and co-creator of ChatGPT led post-training for GPT-4o o1-mini and o1-preview
              and was promoted to VP of Research for Post-Training in October 2024 before departing in March 2025. Cubuk
              earned his PhD from Harvard and completed a postdoc at Stanford before leading the materials and chemistry
              research team at both Google Brain and Google DeepMind where he co-authored the 2023 GNoME paper that
              identified approximately 2.2 million novel stable crystal structures. He also co-published the same year a
              landmark demonstration of a fully automated robotic A-Lab that synthesized 41 novel compounds in 17 days
              from AI-generated recipes. The founding team beyond the co-founders includes Alexandre Passos a creator of
              OpenAI o1 and o3 reasoning models; Eric Toberer a materials scientist who has made prior superconductor
              discoveries; and Matt Horton a creator of Microsoft MatterGen a generative AI system for materials
              science. More than twenty additional researchers were recruited from Meta OpenAI DeepMind Databricks and
              Samsung many foregoing substantial unvested equity to join. The scientific advisory board is chaired by
              Nobel Chemistry laureate Carolyn Bertozzi of Stanford and includes authorities in superconducting physics
              and materials science. Wilson Sonsini Goodrich and Rosati advised on the seed transaction. Key-person
              concentration risk is material: both co-founders are central to the thesis and investor conviction and the
              company lacks a publicly disclosed succession plan.
