      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Unmatched Founder Pedigree and Talent Density
            body: >-
              The combination of Fedus post-training leadership at OpenAI (ChatGPT GPT-4o o1) and Cubuk autonomous-lab
              and materials-discovery track record (GNoME A-Lab) represents a unique pairing of the two capabilities
              most directly required for the AI-scientist thesis. The additional recruitment of Alexandre Passos (o1/o3)
              Eric Toberer (superconductor chemistry) and Matt Horton (MatterGen) reinforces this advantage. No other
              startup has assembled comparable depth across all three pillars simultaneously.
