      - number: '3.2'
        title: 'Incumbent Platforms: Computational Chemistry and Materials Informatics'
        blocks:
          - type: paragraph
            body: >
              Three incumbents represent the status-quo alternatives a materials-science buyer encounters before
              considering Periodic Labs: Schrödinger, Citrine Informatics, and Microsoft Azure Quantum Elements.

              Schrödinger (NASDAQ: SDGR, founded 1990) is the most established physics-based simulation and AI-materials
              platform. Its Q1 2026 total revenue was $58.6M (ACV $28.4M, +12% YoY), though software revenue fell 21%
              YoY as the company transitions from perpetual to hosted (subscription) licensing. Schrödinger held $406M
              in cash as of Q1 2026 and is positioned to launch "Bunsen," an agentic AI co-scientist, in summer
              2026—directly competing with Periodic's AI scientist vision. The Lilly/$2.3B acquisition of Ajax
              Therapeutics (which used a Schrödinger-discovered molecule) validates Schrödinger's track record and gives
              it strong differentiation on regulatory and pharma trust. For materials science customers, Schrödinger
              applies the same physics-first core to molecular simulation.

              Citrine Informatics (Redwood City, CA) has raised ~$81.3M total through a 2025 Series C, with customers
              including LyondellBasell, Eastman, Panasonic, Michelin, and LANXESS. Citrine's DataManager and VirtualLab
              tools target specialty chemicals and advanced materials companies needing to extract value from small,
              sparse datasets. Its SaaS model and focus on enterprise materials R&D (rather than discovery-from-scratch)
              position it as a complementary tool to simulation incumbents and a partial substitute for Periodic's
              data-generation value proposition. Citrine's revenue is estimated in the $10–$100M range as of 2026.

              Microsoft Azure Quantum Elements represents the platform risk from a hyperscaler. Microsoft has entered
              AI-driven materials discovery, potentially disrupting smaller specialist players. Its cloud-scale and
              enterprise distribution advantages are substantially greater than any startup's; materials scientists
              already in the Azure ecosystem can adopt new materials-AI tools with minimal switching friction.
              Similarly, Google DeepMind's GNoME—which predicted 2.2 million new crystal structures (380,000 highly
              stable) and whose lead author is Periodic Labs co-founder Ekin Cubuk—remains an open, widely-cited
              research tool that the broader community can build on without paying Periodic.
