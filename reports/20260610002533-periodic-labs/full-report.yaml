  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Competitive Spend
        blocks:
          - type: paragraph
            body: >-
              AI-driven materials discovery is a distinct market segment within the broader laboratory science
              technology stack. The core product category encompasses software platforms and integrated
              hardware-software systems that apply generative AI, graph neural networks, and large language models to
              propose, simulate, and experimentally validate novel material compositions—compressing discovery cycles
              that historically spanned decades into months or years. This segment differs from general lab automation
              (instrument control, liquid handling, LIMS) in that the primary value proposition is hypothesis generation
              and experimental design, not throughput management.

              Included spend covers AI platform licenses, autonomous-lab SaaS subscriptions, AI-driven computational
              screening tools, and robotics systems purpose-built for closed-loop discovery. Excluded spend includes
              general analytical instruments, clinical-trial automation, standard CRO/CDO outsourcing, and AI tools
              primarily for data management rather than discovery. Adjacent spend pools that represent Periodic Labs'
              upstream opportunity include the $8.83B total lab automation market, the $300B global pharmaceutical R&D
              budget, and the comparable chemicals and advanced-materials R&D segment. Status-quo substitutes are manual
              combinatorial synthesis, traditional computational chemistry, and contracted CRO services—all measurably
              slower and more capital-intensive than AI-directed closed-loop systems.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
