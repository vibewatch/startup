    rows:
      - - Synthesis Gap
        - >-
          AI predicts thermodynamically stable crystal structures that cannot be synthesized under realistic laboratory
          conditions
        - 'GNoME: 2.2M predictions, ~736 synthesized and verified as of late 2025'
        - High
        - Core constraint on throughput; autonomous robots cannot overcome fundamental synthesis barriers
      - - Corrosive Hallucination
        - Model generates scientifically plausible but factually incorrect outputs that evade standard error-detection
        - >-
          arXiv April 2025: hallucination taxonomy study identifies hallucinations in AI-generated scientific text at
          rates affecting downstream experimental design
        - Medium-High
        - Closed-loop autonomous experimentation amplifies propagation before human review
      - - DFT Training-Data Bias
        - Density functional theory labels used for active learning carry systematic approximation errors
        - DFT approximation error well-documented in computational materials science literature
        - Medium
        - Model retraining loops inherit systematic error; recalibration is resource-intensive
      - - Reproducibility Failure
        - AI-predicted synthesis routes do not reproduce across different laboratory equipment or conditions
        - Multiple post-GNoME critiques note lack of independent experimental validation
        - Medium-High
        - Customer validation and IP filing depend on reproducibility; single-lab synthesis is insufficient
      - - Autonomous Scope Creep
        - As human oversight is reduced, AI selects experimental directions outside intended discovery domains
        - Conceptual risk documented in autonomous agent safety literature; no direct Periodic Labs incident reported
        - Low-Medium
        - Dual-use chemicals could be generated absent dual-use screening in the experimental design pipeline
