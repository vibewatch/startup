          high: 2000
        - label: 'Base Case (2031): $150-250M ARR, 2-3 partnerships, moderate multiples'
          low: 5500
          high: 9000
        - label: 'Bull Case (2031): $500M+ ARR, platform dominance, 25-35x exit multiple'
          low: 12000
          high: 20000
    approximationNotes: >-
      All figures in USD millions. Ranges reflect analyst scenario modeling based on peer benchmarks and public
      reporting; they are not company-issued guidance. Entry valuation assumed at $7.5B. Dilution from subsequent rounds
      not reflected.
