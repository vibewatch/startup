  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Vision and AI Scientist Core Architecture
        blocks:
          - type: paragraph
            body: >
              Periodic Labs' core product is an "AI scientist" system designed to automate the full scientific discovery
              cycle in the physical sciences. The company's founding thesis, articulated in its public launch materials
              and the a16z investment announcement, is that large language models have now exhausted the estimated 10
              trillion token internet corpus and require a qualitatively new data source: proprietary experimental
              results generated by direct physical interaction with the world. The product architecture operationalizes
              this thesis by placing an AI reasoning system in a closed feedback loop with physical laboratory
              equipment, enabling the AI to generate hypotheses, test them in robotic experiments, observe whether its
              predictions held against physical reality, and update its models accordingly. Nature itself serves as the
              reinforcement learning environment—every synthesis run either confirms or refutes the AI's materials
              prediction, providing unambiguous, high-fidelity training signal unavailable in any internet corpus.

              The company describes its approach with the phrase "from bits to atoms"—a reference to the integration of
              digital AI reasoning (bits) with physical-world experimentation (atoms). The initial target application,
              discovering high-temperature superconductors, was chosen because the physics experiments are relatively
              fast, the outcomes are highly verifiable (conductivity and critical temperature are objectively
              measurable), and the physical simulation ecosystem (density functional theory) is mature enough to narrow
              the candidate search space before committing to robotic synthesis runs. Each experiment generates
              gigabytes of high-quality data including failure outcomes that are seldom published in conventional
              scientific literature—creating a proprietary training corpus that grows with every run and cannot be
