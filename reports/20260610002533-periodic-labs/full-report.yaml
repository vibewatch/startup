      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 30%+ CAGR in a Well-Defined Software Segment
            body: >-
              The AI in materials discovery software market is growing at 30.3% CAGR and is projected to nearly triple
              from $970M (2026) to $2.77B by 2030. This rate substantially exceeds the 9.9% CAGR of the broader lab
              automation market, confirming that buyers are specifically seeking AI-native discovery tools rather than
              incremental instrument upgrades. For a seed-stage company raising at a $7.5B valuation, entering a
              30%-growth segment at scale creates a credible long-run revenue narrative.
            calloutType: strength
            claimRefs:
              - CM006
              - CM009
          - type: callout
            title: Enterprise AI Adoption Structurally Lags Capability
            body: >-
              Despite compelling technology, only 29% of enterprises report significant AI ROI as of 2026, and
              enterprise adoption infrastructure consistently takes longer to build than the technology itself.
              ComputeForecast identifies this as a recurring structural dynamic, not a temporary immaturity gap. For
              Periodic Labs, this translates into extended sales cycles, heavy pilot dependency, and meaningful
              customer-acquisition cost even in a high-conviction market.
            calloutType: risk
            claimRefs:
              - CM025
              - CM030
          - type: callout
            title: Battery and Semiconductor Verticals Offer Earlier Revenue Than Superconductors
            body: >-
              While Periodic Labs' stated primary target—high-temperature superconductors—represents the highest
              long-run upside, battery and semiconductor AI discovery are already in commercial pilot transitions with
              quantifiable buyer urgency (SandboxAQ AQVolt26, TechXplore semiconductor AI reporting). Investors should
              probe whether Periodic Labs has a near-term revenue bridge in these verticals while superconductor science
              matures, or whether the company is dependent on superconductor breakthroughs for its first commercial
              revenue.
            calloutType: insight
            claimRefs:
