  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical and AI-Model Risks
        blocks:
          - type: paragraph
            body: >
              Periodic Labs' core thesis rests on a chain of technical assumptions, each carrying material failure risk.
              The most fundamental is the synthesis gap: AI models, including predecessor systems like DeepMind's GNoME,
              routinely predict structures that prove difficult or impossible to realize in the physical world. GNoME
              predicted 2.2 million crystal structures; only approximately 380,000 were deemed potentially stable, and
              as of late 2025 only around 736 have been independently synthesized and verified. Periodic Labs'
              autonomous systems will face the same constraint — digital prediction does not guarantee physical
              realizability, and the bottleneck has shifted from model inference to laboratory validation. A second
              technical hazard is AI hallucination. Academic research published on arXiv in April 2025 distinguishes
              between benign model errors and "corrosive hallucinations" — outputs that are scientifically plausible but
              factually incorrect and resistant to detection. In a closed-loop autonomous lab where AI outputs directly
              drive robotic experiment queuing, a corrosive hallucination can propagate through many experimental cycles
              before human review detects it, wasting costly reagents and generating misleading data for downstream
              model retraining. Underlying data quality is a third concern. Active learning loops depend on density
              functional theory calculations for ground-truth labels; systematic DFT biases propagate errors into
              iterative training cycles. Physical experiments also cannot scale at near-zero marginal cost the way
              digital AI training can, limiting the iteration speed investors may expect. Progressively reducing
              human-in-the-loop oversight as the system automates compounds these risks by shrinking the window for
              catching failures.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
