      - number: '5.3'
        title: 'Technical Heritage: GNoME, ChatGPT, and MatterGen Lineage'
        blocks:
          - type: paragraph
            body: >
              The founding team's technical credentials are central to Periodic Labs' product claims and its capacity to
              execute on the AI scientist thesis. Liam Fedus, co-founder and CEO, was VP of Post-Training Research at
              OpenAI, where he led the team that created ChatGPT and the first trillion-parameter neural network. His
              expertise in post-training—the critical RL fine-tuning and instruction alignment phase that determines
              model behavior—is directly applicable to the RL-from-nature training paradigm Periodic Labs is building.
              Ekin Dogus Cubuk, co-founder, led the materials and chemistry research team at Google Brain and DeepMind.
              His most recognized work is GNoME (Graph Networks for Materials Exploration), a 2023 Nature paper in which
              graph neural networks trained on DFT-computed crystal energies were used to identify over 2.2 million
              potentially stable inorganic crystal structures—the largest expansion of known materials in history. GNoME
              demonstrated that AI-predicted materials could be validated in robotic synthesis labs; the Berkeley A-Lab
              synthesized 41 novel compounds from AI recipes in the same 2023 research cycle. This precedent directly
              underpins Periodic Labs' architecture and validates the feasibility of the closed-loop approach.

              Beyond the two co-founders, the team includes Alexandre Passos (co-creator of OpenAI's o1 and o3 reasoning
              models), Eric Toberer (a materials scientist who has made key superconductor discoveries, formerly of
              Colorado School of Mines), and Matt Horton (a creator of Microsoft's MatterGen, an LLM for generative
              materials discovery). The company reports having hired more than 20 researchers from OpenAI, DeepMind,
              Meta, Databricks, and Samsung, many forgoing tens to hundreds of millions of dollars in unvested equity to
              join the company. The New York Times reported this talent migration as one of the most notable in recent
              AI history.

              A distinctive team practice reinforces technical integration: weekly cross-discipline teaching sessions
              where physicists teach LLMs to reason about quantum mechanics and ML researchers learn the physics
              intuitions. Co-founder Cubuk noted: "We do feel like a tight coupling is extremely important." The
              founders also documented that robotic arm reliability for powder synthesis workflows only recently reached
              a threshold sufficient to support reliable autonomous experiments—a confluence of timing the founders
