      - number: '7.4'
        title: Governance, Execution, and Mitigation Framework
        blocks:
          - type: paragraph
            body: >
              Periodic Labs' founding team of Ekin Dogus Cubuk (GNoME architect at Google DeepMind) and Liam Fedus
              (former VP of Research at OpenAI) provides exceptional scientific and commercial credibility. However,
              this concentrated dependency represents a material key-person risk: departure of either founder would
              impair the company's ability to attract top-tier scientific talent, maintain investor confidence, and
              execute a technically demanding research roadmap. No succession plan or leadership depth has been publicly
              disclosed. The board is VC-heavy — a16z, Nvidia, and Bezos-affiliated — which may create pressure for
              rapid commercial proof at the expense of methodical scientific validation. Governance risk extends to
              autonomous system oversight. As of the runDate, Periodic Labs has disclosed no AI governance policy, no
              dual-use screening protocol, and no AI safety framework for its autonomous laboratory operations. This
              creates reputational and regulatory exposure in an environment where CSIS, RAND, and Nature Biotechnology
              have all published calls for mandatory built-in biosecurity safeguards for generative AI tools operating
              in laboratory settings. A public incident — even one not directly caused by Periodic Labs — involving an
              AI chemistry tool could trigger sector-wide regulatory scrutiny that disrupts operations. Mitigations
              available to Periodic Labs and its investors include: adoption of ANSI/A3 R15.06-2025 robot safety
              protocols with documented risk assessments; dual-use screening embedded in the AI experimental design
              pipeline; cybersecurity monitoring for all robotic control systems; and mandatory human-oversight
              checkpoints before scaled synthesis. Kill criteria that investors should monitor include: (1) failure to
              synthesize and independently verify any AI-predicted material within 18 months; (2) any federal regulatory
              enforcement action targeting autonomous laboratory operations; (3) departure of either co-founder before
              first commercial milestone; (4) consumption of more than 75% of raised capital without a disclosed
              commercial partnership or licensing agreement; and (5) any public incident involving dual-use or unsafe
              autonomous synthesis.
