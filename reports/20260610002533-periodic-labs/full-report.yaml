chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity Mission and Product Strategy
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs is a San Francisco-headquartered artificial intelligence company founded in March 2025 with
              the explicit goal of creating AI scientists that are autonomous systems capable of forming hypotheses
              designing and executing physical laboratory experiments and iterating on discoveries in the physical
              sciences. The company operates as a private seed-stage entity with no public financial disclosures. Its
              core thesis is that frontier AI models have effectively exhausted the approximately ten trillion text
              tokens available on the internet and that meaningful scientific progress now requires giving AI systems
              the tools to generate novel experimental data directly from the physical world. Periodic Labs product
              strategy centers on three interlocked pillars: first autonomous robotic laboratories that execute powder
              synthesis and material characterization experiments in a fully automated closed loop; second high-fidelity
              AI-driven simulation models that narrow the experimental search space before costly physical testing; and
              third large-language-model research assistants that analyze results generate new hypotheses and direct
              subsequent experiment cycles. Each experimental run can produce gigabytes of proprietary data including
              the negative results that are rarely published in traditional science creating a training corpus available
              to no competitor. The company first commercial application is helping a semiconductor manufacturer solve
              chip heat dissipation problems by training custom AI agents on the manufacturer experimental data. Its
              longer-term scientific moonshot is the discovery of high-temperature superconductors that operate closer
              to ambient conditions which could transform power grids transportation and computing. The company also
              targets customers in space and defense where materials R&D cycles are similarly expensive and slow.
              Periodic Labs frames itself explicitly in contrast with consumer AI ventures: it does not pursue general
              artificial intelligence or large language models for chat but focuses entirely on the physical-sciences
              discovery loop where nature itself serves as the reinforcement-learning environment.
