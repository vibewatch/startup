      - number: '2.2'
        title: 'TAM, SAM, and SOM: Multi-Lens Sizing'
        blocks:
          - type: paragraph
            body: >-
              Sizing AI-driven materials discovery requires at least three nested lenses because no single analyst
              report covers the full stack from autonomous-lab hardware to the SaaS discovery layer. The narrowest and
              most directly relevant segment—purpose-built AI materials discovery platforms—was valued at approximately
              $740M in 2025 and is forecast at $970M in 2026, growing at a 30.3% CAGR toward $2.77B by 2030, according
              to The Business Research Company's AI in Materials Discovery Global Market Report 2026.

              One layer up, the AI in lab automation market (which includes drug-discovery AI, genomics automation, and
              materials science) was $3.54B in 2025 and is projected at $4.19B in 2026 at an 18.4% CAGR. The broadest
              comparable—the total lab automation market covering hardware, software, and AI—stands at $8.03B in 2025
              and $8.83B in 2026. The autonomous chemical laboratory market, which combines hardware robotics with AI
              control layers, is estimated at $5.75B in 2026 growing at 14.5% CAGR through 2035.

              Sizing the SOM for an autonomous AI-scientist platform model (Periodic Labs' approach) is not yet
              verifiable from public data; industry analysts have not isolated this sub-segment separately. A
              conservative proxy—12% of the AI materials discovery software segment—implies approximately $116M SOM in
              2026, but this estimate is highly uncertain and an evidence gap is noted. All market sizing figures carry
              inherent analyst-methodology risk and should be treated as order-of-magnitude anchors rather than precise
              forecasts.
