companyProfile:
  summary: >-
    Periodic Labs is a San Francisco startup founded in 2025 by former OpenAI post-training leader Liam Fedus and former
    Google DeepMind materials-science lead Ekin Dogus Cubuk. The company is building "AI scientists": closed-loop
    systems that combine frontier models, simulation workflows, and autonomous laboratory infrastructure to generate
    hypotheses, run experiments, and discover new materials. Publicly described use cases include high-temperature
    superconductors and semiconductor heat-dissipation problems, with early commercial activity reported in
    semiconductor, space, and defense accounts. Periodic raised a record $300M seed round in September 2025 at a roughly
    $1.3B post-money valuation and was reported in 2026 to be discussing a new financing at about $7.5B. The core
    diligence question is not whether the team is exceptional—it is whether the company can convert scientific promise
    into repeatable commercial outcomes fast enough to justify the valuation step-up.
