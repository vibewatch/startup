      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Proprietary Data Flywheel Creates Structurally Defensible Moat
            body: >
              Periodic Labs' most defensible competitive advantage is structural rather than algorithmic. Each
              autonomous lab run generates gigabytes of experimental data—including failure data typically excluded from
              scientific literature—that feeds directly into model training. This creates a flywheel where better models
              generate better experiments, which generate better training data. Because the data is produced by physical
              interaction with the world rather than scraped from the internet, it cannot be replicated by pure-software
              competitors. The combination of team pedigree (GNoME, ChatGPT post-training) and a proprietary physical
              data pipeline is the architectural moat—one that requires both the Bits and Atoms tracks to be
              simultaneously operational to realize.
