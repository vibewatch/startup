  evidenceGaps:
  - type: missing-source
    severity: material
    topic: human-study-design
    missingEvidence: The full first-in-human protocol, dose-escalation plan, patient selection logic, and any disclosed FDA meeting history for the liver study.
    whyItMatters: Without protocol detail, it is impossible to judge whether NewLimit’s accelerated timeline rests on a realistic clinical package or on aspirational sequencing of milestones.
    diligencePath: Request the pre-IND briefing package, FDA correspondence, protocol synopsis, and biomarker analysis plan from management before underwriting the 2027 study.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: cmc-and-scale-up
    missingEvidence: The candidate’s CMC package, contract-manufacturing map, release assays, comparability plan, and batch-failure history.
    whyItMatters: The public record confirms manufacturing progress but not whether the process is reproducible, scalable, or regulator-ready for a clinical lot and subsequent expansion.
    diligencePath: Obtain CMC summaries, CMO statements of work, process-development timelines, analytical release criteria, and comparability memos.
    relatedQuestionRefs:
    - QR030
  - type: private-evidence-only
    severity: material
    topic: freedom-to-operate
    missingEvidence: An outside-counsel freedom-to-operate opinion mapping NewLimit’s payloads, vectors, screening methods, and delivery chemistry against third-party patent estates.
    whyItMatters: Public patents and case law show the field is legally active, but only a targeted FTO review can determine whether NewLimit faces blocking patents or manageable licensing needs.
    diligencePath: Request current patent landscape analyses, active claim charts, licenses, and litigation watchlists from management and external IP counsel.
    relatedQuestionRefs:
    - QR021
    - QR030
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: A fuller public inventory of agency interactions, jurisdiction-specific filings, and any confidential legal disputes beyond what is visible in open sources.
    whyItMatters: The public register captures the main visible risk categories but likely misses private agency feedback, draft filings, and negotiated legal exposures that matter in diligence.
    diligencePath: Extend diligence to data-room regulatory correspondence, board materials, and outside-counsel summaries, and then refresh the risk register before investment committee.
    relatedQuestionRefs:
    - QR029
    - QR030
    relatedTableRefs:
    - TR001
