- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Lead-program safety failure
    - Public tox update or trial-enabling package
    - Any disclosed tumorigenicity, identity-loss, or severe off-target finding in the liver candidate
    - Immediate thesis-break until mechanism and dose window are re-underwritten
  - - CMC slippage
    - Manufacturing or clinical-timing update
    - No clear clinical-lot readiness, comparability, or regulator-facing manufacturing package by the time trial timing is reaffirmed
    - Downgrade conviction and treat timeline claims as promotional until process evidence is shown
  - - Protocol opacity
    - Management diligence response
    - No protocol synopsis, biomarker logic, or FDA interaction summary made available in diligence
    - Pause investment and classify readiness as unproven
  - - Freedom-to-operate friction
    - IP diligence output
    - Outside counsel cannot produce a clean or manageable FTO story for lead payloads and delivery stack
    - Apply legal holdback or require license path before closing
  - - Reputational blowback
    - Press, regulator, or partner feedback
    - A high-profile setback shifts NewLimit from disease-first biotech to generalized longevity hype in stakeholder perception
    - Tighten communication requirements and revisit partner appetite
  - - Capital-market reset
    - Next financing or internal mark
    - Material down-step in financing terms before human proof despite large current cash balance
    - Reassess whether scale is funding science or merely extending uncertainty
  notes: Kill criteria are defined only for observable public or diligence-visible events that would materially change the investment case.
