    topic: open-risks
    sourceRefs:
    - SE002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE002
    - QE021
    - QE022
  - id: CE005
    statement: The discovery engine begins with in silico reprogramming models, pooled genomics screens, and functional assays rather than single-target drug screening.
