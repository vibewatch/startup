- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Risk
  rows:
  - - Ambrosia in silico models
    - Prioritize which TF payloads to test
    - Large labeled perturbation corpus and protein-foundation embeddings
    - Model quality can outrun wet-lab truth if training data or objective functions are biased
  - - Pooled TF construction and screening chemistries
    - Generate and track many combinatorial payloads in parallel
    - Reliable barcoding, cloning, and reagent build quality
    - Reagent QC failures or barcode ambiguity can poison downstream conclusions
  - - RESTORE-seq / single-cell readout stack
    - Measure cell-state response to each payload at scale
    - Single-cell sequencing throughput and bioinformatics pipelines
    - Transcriptional wins may not map cleanly to durable function or safety
  - - Humanized liver and age-specific animal models
    - Bridge human-cell discovery to physiological phenotypes
    - Consistent model construction and translational relevance
    - Model success may not hold under human dosing constraints
  - - mRNA sequence engineering
    - Turn TF payloads into manufacturable drug substance
    - IVT, purification, QC, and sequence-design iteration
    - Potency, dsRNA burden, and specificity trade off against manufacturability
  - - Organ-targeted LNP delivery chemistries
    - Deliver payloads to hepatocytes, T cells, or renal endothelium
    - Chemistry optimization, biodistribution assays, and repeat-dose tolerability
    - Non-liver targeting remains substantially less derisked than hepatocyte delivery
  - - PK/PD biomarkers + CMC + clinical operations
    - Convert promising payloads into IND-ready programs
    - Qualified assays, batch records, compliant manufacturing, and protocol design
    - The platform can stall even with strong biology if endpoints or manufacturing are not clinical-grade
  notes: Architecture rows mix discovery and development layers because NewLimit’s product only exists when those layers work together.
