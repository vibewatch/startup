    statement: NewLimit’s current therapeutic programs focus on hepatocytes, T cells, and endothelial cells across metabolic, immune, and vascular disease contexts.
    type: company-claimed
    topic: pipeline-focus
    sourceRefs:
    - SE002
    - SE003
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE001
    - QE003
  - id: CE003
    statement: The company’s liver-first strategy is explicitly tied to clinically demonstrated LNP-RNA delivery into hepatocytes and an initial alcohol-related liver disease use case with later metabolic expansion.
    type: company-claimed
    topic: liver-first-rationale
    sourceRefs:
    - SE002
    - SE003
    - SE032
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE003
    - QE004
