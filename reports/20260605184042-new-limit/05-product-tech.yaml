- id: TE002
  title: Workflow / use-case table
  columns:
  - User job / disease need
  - Current workflow / pain point
  - NewLimit solution
  - Measurable benefit signal
  - Current limitation
  rows:
  - - Old hepatocytes in fatty liver or ALD
    - Standard liver-disease care does not reverse age-dependent loss of regeneration
    - Deliver transcription-factor payloads by LNP-mRNA to reset hepatocyte age
    - Improved regeneration and alcohol-resilience in preclinical models
    - Human efficacy and repeat-dose safety remain unproven
  - - Aged CD8 T-cell dysfunction
    - Older immune cells clear targets less efficiently and can become dysregulated
    - Reprogram old T cells toward youthful killing activity with payload mRNA
    - Three reported payloads restore youthful killing activity
    - In vivo delivery, persistence, and clinical indication remain early
  - - Age-damaged renal endothelium
    - CKD lacks strong regenerative interventions and endothelial aging is hard to target
    - Use renal-endothelial delivery chemistry plus age-specific injury models
    - Old-versus-young injury model and claimed >60% renal endothelial delivery
    - No public therapeutic payload efficacy package
  - - Payload prioritization across thousands of TF combinations
    - Brute-force wet-lab search is too small for the design space
    - Ambrosia ranks payloads before screening and learns from new data
    - '>2X better discovery rate or >60% more hits in company simulations'
    - External validation remains limited to company-authored technical material
  - - Program advancement into IND-enabling work
    - Discovery outputs do not automatically become clinic-ready candidates
    - Layer mRNA engineering, CMC, biomarkers, and protocol design onto discovery hits
    - Large-scale batch start and four candidate PD biomarkers disclosed
    - Qualification packages and regulatory submissions are not public
  notes: The “benefit signal” column records public preclinical or platform signals, not validated clinical endpoints.
