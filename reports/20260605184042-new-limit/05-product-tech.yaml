  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: payload-opacity
    missingEvidence: Exact transcription-factor identities, sequence designs, dose ranges, and composition-of-matter details for the lead liver payload are not public.
    whyItMatters: Without payload composition and dose architecture, outside investors cannot independently assess mechanism novelty, off-target biology, or defensibility.
    diligencePath: Request the lead-candidate technical package under NDA, including factor identities, sequence optimization history, and dose-ranging rationale.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: blocking
    topic: chronic-safety
    missingEvidence: No public chronic-dosing, large-animal, or independent peer-reviewed safety package shows sustained identity preservation and tumor surveillance under repeat dosing.
    whyItMatters: Partial reprogramming only becomes investable as a medicine if the safe window can be maintained through real dosing schedules without latent dedifferentiation or neoplasia.
    diligencePath: Request GLP toxicology, repeat-dose pharmacology, off-target transcriptomics, and pathology readouts for liver and non-liver programs before underwriting timing to clinic.
    relatedQuestionRefs:
    - QE022
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: biomarker-validity
    missingEvidence: Public materials mention four candidate PD biomarkers and epigenetic-age shifts, but not the qualification thresholds, assay transfer package, or causal bridge to clinical benefit.
    whyItMatters: If biomarkers are only correlational, NewLimit may have a strong discovery engine but still lack a regulatory-grade efficacy readout for first-in-human studies.
    diligencePath: Review the biomarker-selection memo, assay-validation data, and any clock-versus-function bridge analyses that define what a meaningful response looks like in vivo.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: nonhepatic-delivery
    missingEvidence: Public evidence for T-cell and renal-endothelial delivery remains early and company-authored, with no public dose-response, manufacturability, or candidate-selection package.
    whyItMatters: The non-liver programs matter for platform value, but they may be much harder to dose, target, and scale than the hepatocyte-first program suggests.
    diligencePath: Request biodistribution, potency, manufacturability, and safety data for immune and vascular delivery chemistries before assigning material value to those programs.
    relatedQuestionRefs:
    - QE021
    - QE025
    relatedTableRefs:
    - TE001
    - TE003
  - type: missing-source
    severity: material
    topic: clinical-visibility
    missingEvidence: Public sources discuss next-year phase 1 ambitions, but no public trial registry entry, protocol synopsis, or regulatory milestone calendar is visible as of runDate.
    whyItMatters: Timing risk is one of the biggest inputs to underwriting capital intensity and technical de-risking; rhetoric alone is not enough to model execution.
    diligencePath: Ask management for the first-in-human protocol synopsis, CMC critical path, regulatory correspondence timeline, and gating assumptions behind the projected trial start.
    relatedQuestionRefs:
    - QE013
    - QE025
    relatedTableRefs:
    - TE005
