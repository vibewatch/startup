- id: discovery-engine-and-operating-architecture
  title: 'Discovery engine and operating architecture: AI prioritization plus pooled human-cell screening'
  body: |-
    The technical center of gravity is NewLimit’s discovery engine, which tries to solve a combinatorial search problem that is too large for brute force. The company’s official science materials say RESTORE-seq uses DNA-barcoded transcription-factor pools so thousands of payload hypotheses can be tested in parallel, while the operating plan says those hits are then filtered through functional assays and preclinical models rather than through transcriptional readouts alone. This is the right architecture for partial reprogramming, because the field’s main failure mode is over-indexing on pretty clock or expression shifts that do not survive contact with function, delivery, or safety.

    Ambrosia is the companion computational layer. NewLimit’s own research site, ICML workshop page, and OpenReview paper all describe a transfer-learning approach that uses protein foundation models to navigate a search space of more than 10^16 plausible transcription-factor combinations. Importantly, NewLimit claims not just better prediction accuracy but an iterative lab-in-the-loop workflow that improves hit discovery per dollar. The operating model exposed in hiring reinforces that this is a software-enabled wet-lab platform: computational biologists are asked to run production pipelines for single-cell perturbation screens, functional-genomics hires still build viral-vector reagents and custom chemistries, and internal tooling extends into microservice applications that move data between experimental teams. In other words, the platform is not a single assay or a single model; it is a tightly coupled factory for proposing, screening, and triaging payloads in human-cell-centric systems.
