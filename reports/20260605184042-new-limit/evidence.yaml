evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      A current executive roster, board list, observer rights, and governance package are still missing from retained
      public sources.
    whyItMatters: >-
      Founder dependence and investor oversight are core company-overview questions, and later chapters should not guess
      governance structure.
    diligencePath: >-
      Request the current org chart, board deck index, board roster, observer rights, and committee charters from
      management.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding-visibility
    missingEvidence: >-
      A company-canonical total funding figure and exact post-money valuation mechanics for the 2026 Series C are not
      publicly retained.
    whyItMatters: >-
      Valuation, dilution, and investor-control analysis all depend on clean round math rather than mixed press and
      database reconstructions.
    diligencePath: >-
      Request the financing summary, cap table, round-close notices, and board-approved valuation memos for the
      2025-2026 financings.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-headcount
    missingEvidence: No retained source gives a management-confirmed current 2026 employee and contractor count with geography split.
    whyItMatters: >-
      Headcount is a canonical scale and capital-efficiency input, especially for a company claiming unusual technical
      throughput.
    diligencePath: >-
      Ask management for current FTE and contractor counts by function and site, plus the hiring plan tied to clinical
      preparation.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue-and-runway
    missingEvidence: No retained public source discloses revenue, ARR, burn, cash, or runway.
    whyItMatters: Financing visibility without operating-economics visibility can create a false sense of diligence completeness.
    diligencePath: Request revenue or collaboration income, burn, cash, runway, and budget assumptions through first-in-human dosing.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-coverage
    missingEvidence: >-
      Internal dates for exact lab openings, board changes, and non-public program milestones are absent from the public
      chronology.
    whyItMatters: >-
      The milestone table is the chronology of record for public diligence, but private inflection points could affect
      pace and execution quality.
    diligencePath: >-
      Request an internal milestone log that aligns hiring, financing closes, program launches, and manufacturing
      readiness with exact dates.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: clinical-readiness
    missingEvidence: Detailed IND-enabling toxicology, batch-release, and protocol evidence for New Limit's first human study.
    whyItMatters: >-
      Without concrete IND-ready evidence, the difference between an announced trial year and actual first-patient
      dosing remains material to market-entry timing.
    diligencePath: >-
      Request the IND filing status, clinicaltrials.gov identifier, CMC release criteria, and first-site activation
      plan.
    relatedQuestionRefs:
      - QM018
  - type: private-evidence-only
    severity: material
    topic: aging-indication-pathway
    missingEvidence: >-
      Public evidence that regulators or payers would accept a broad aging or healthspan label rather than a
      disease-specific indication.
    whyItMatters: >-
      This determines whether New Limit can eventually graduate from single-disease economics to a platform valuation
      based on broad aging claims.
    diligencePath: >-
      Ask management for regulator feedback on biomarker strategy, label ambition, and payer conversations beyond the
      first indication.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: sam-som-sizing
    missingEvidence: >-
      Indication-level prevalence, treatable-patient filters, delivery eligibility, pricing assumptions, and penetration
      curves for ALD, immune, and kidney programs.
    whyItMatters: >-
      Published sector TAMs are too broad to estimate New Limit's real SAM or near-term SOM with investment-grade
      confidence.
    diligencePath: >-
      Build a bottoms-up model from target indications, likely administration setting, expected pricing corridor, and
      eligible-patient share.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-visibility
    missingEvidence: >-
      Public development economics, transfer prices, launch pricing assumptions, and partner revenue-share terms for
      direct reprogramming peers.
    whyItMatters: >-
      Without commercial terms it is impossible to test whether NewLimit’s liver-first strategy is truly cheaper or
      easier to scale than rival platform routes.
    diligencePath: >-
      Request board materials or investor updates showing target indication pricing, COGS assumptions, and any partner
      term sheets for NewLimit and comparable peers.
    relatedQuestionRefs:
      - QP013
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: altos-program-opacity
    missingEvidence: >-
      A named Altos candidate, indication, delivery route, and regulator-facing package that would reveal actual product
      readiness.
    whyItMatters: >-
      Altos’s capital and talent lead is real, but without candidate-level disclosure it is hard to know whether
      NewLimit is actually ahead on translational velocity.
    diligencePath: >-
      Ask management or sector specialists for unpublished Altos program maps, hiring packets, or trial-prep evidence
      beyond public science narratives.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: stale
    severity: material
    topic: turn-bio-verification
    missingEvidence: >-
      A fresh 2026 primary-source update from Turn Biotechnologies confirming its active pipeline, trial timing, and
      HanAll economics.
    whyItMatters: >-
      Turn is the clearest transient-mRNA analogue to NewLimit, but current public verification leans on secondary
