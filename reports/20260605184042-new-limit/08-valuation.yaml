- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Clinical start slips materially
    - First human liver trial slides meaningfully beyond the next planned window
    - The premium for speed and scientific surprise compresses quickly if NewLimit looks like a normal prehuman platform.
    - Re-cut valuation toward base or bear band and do not pay the June 2026 mark.
  - - Safety or biodistribution problem appears
    - Toxicology, off-target, or biomarker incoherence weakens the reprogramming story
    - The market stops thinking about Beam-like upside and starts thinking about platform fragility.
    - Pause investment until risk is re-underwritten on new data.
  - - Preference stack is investor-unfriendly
    - Series C terms reveal heavy liquidation preference, ratchets, or unusual downside protection
    - Headline valuation stops representing clean common-equity value.
    - Demand lower entry price or pass.
  - - Cash runway is shorter than headlines imply
    - Post-round treasury or burn suggests the company may need capital before meaningful human proof
    - Financing strength becomes less of a moat and down-round risk rises.
    - Model dilution more harshly and re-open the thesis.
  - - Longevity sentiment re-rates
    - Sector skepticism intensifies after poor readouts or hype backlash elsewhere
    - A field-wide compression amplifies NewLimit-specific disappointment.
    - Use stricter public-comp anchors and avoid narrative-based valuation support.
  notes: These are valuation kill triggers, not generic operating risks. Each trigger directly changes what a rational buyer should pay today.
  claimRefs:
  - CV020
  - CV029
  - CV030
  - CV045
  - CV047
  - CV048
  - CV050
  - CV052
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cap table and financing terms
    - Liquidation preferences, anti-dilution, participating features, pro rata rights, and any secondary mix from the Series C
    - Headline valuation can misstate common-equity economics if the round is structurally protective.
    - Company counsel review plus latest cap table and financing docs.
  - - Cash, burn, and runway
    - Post-Series-C cash balance, monthly burn, 2026-2028 operating plan, and milestone-linked financing needs
    - A giant round is not the same thing as a comfortable runway to proof.
    - CFO model review and board-approved operating plan.
  - - IND-enabling package
    - Biodistribution, tox, durability, dose range, and chemistry-manufacturing-controls package for the liver program
    - The public mark only works if the translational package is strong enough to get into and through humans cleanly.
    - Clinical, CMC, and regulatory diligence.
  - - Human biomarker strategy
    - Exact pharmacodynamic biomarkers, success thresholds, and timing of first read-through
    - Investors need to know what evidence will actually move valuation between scenario bands.
    - Protocol review plus biomarker memo from translational team.
  - - Platform extensibility and portfolio economics
    - How fast new cell-type programs can be advanced without overwhelming cost and management bandwidth
    - A major piece of upside comes from whether NewLimit becomes one asset or a repeatable portfolio machine.
    - R&D planning review and program-level capital allocation model.
  notes: These asks focus only on the few hidden variables that could most materially change the current recommendation or the price a disciplined investor should pay.
