- id: recommendation-kill-triggers-and-diligence
  title: Recommendation, kill triggers, and diligence
  body: 'The public-data recommendation is research-more, not buy. NewLimit has real positives: rapid platform progress, a credible founder-investor base, meaningful manufacturing and biomarker preparation, and a market large enough to attract exceptional private capital if the biology works in humans. But the current valuation still looks expensive on public evidence because it already approximates Beam''s public value and exceeds a long list of companies with more advanced clinical proof. The biggest kill trigger is straightforward: any slip in IND timing, early safety, or biomarker coherence would force investors to stop valuing NewLimit like a near-clinical winner and start valuing it like a preproof platform in a more skeptical longevity tape. A second kill trigger is term opacity. If the Series C contains heavy preferences, unusual downside protection, or a narrower cash runway than the headline dollars imply, the common-equity economics could look worse than the public mark suggests.
    The diligence agenda is therefore narrow: cap table and term stack, post-round cash and burn, IND-enabling toxicology and biodistribution, first-in-human trial design, and the exact biomarker package needed to convince later crossover or strategic capital.'
