- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: This table covers the most decision-useful public gene-editing, cell-therapy, AI-drug-discovery, and longevity-biotech references plus one large private rejuvenation benchmark; it is not exhaustive because direct private reprogramming comps remain sparse and terms are mostly undisclosed.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - NewLimit (subject)
    - Latest disclosed private valuation
    - ~$3.1B after $435M Series C
    - Direct underwriting object; tests how much translation is already priced in.
    - No public revenue, burn, or term-stack disclosure.
  - - Beam Therapeutics
    - June 2026 market cap
    - $3.02B
    - Closest public reminder that a serious gene-editing platform can be worth about NewLimit’s current mark.
    - Beam is public and already operates with clinically validated delivery technologies.
  - - Intellia Therapeutics
    - June 2026 market cap
    - $1.85B
    - Useful comparator for a genome-editing company with Phase 3 data and curative-treatment positioning.
    - Different modality and public-market sentiment can distort the comparison.
  - - CRISPR Therapeutics
    - June 2026 market cap
    - $5.02B
    - Upper public benchmark with one approved therapy and multiple clinical programs.
    - Approved-product exposure makes this a demanding benchmark for a prehuman company.
  - - Recursion Pharmaceuticals
    - June 2026 market cap
    - $1.72B
    - Good platform benchmark for AI-enabled drug discovery plus first-patient-dosed evidence.
    - Recursion’s business model is broader than age reprogramming.
  - - Sana Biotechnology
    - June 2026 market cap
    - $0.75B
    - Relevant lower-band cell-engineering comparator when proof is limited and investor patience thins.
    - Cell therapy is not the same modality as epigenetic reprogramming.
  - - Editas Medicine
    - June 2026 market cap
    - $0.40B
    - Harsh reminder that exciting editing stories can still trade cheaply in public markets.
    - Editas has company-specific execution history that is not a perfect read-through.
  - - BioAge Labs
    - June 2026 market cap
    - $0.71B
    - Useful public longevity benchmark with actual clinical milestones around metabolic aging.
    - BioAge is a public longevity name but not a direct reprogramming peer.
  - - Altos Labs
    - Launch funding benchmark
    - $3.0B of launch funding
    - Shows that private capital can support moonshot rejuvenation platforms at multibillion-dollar scale.
    - Funding is not the same as market cap or a priced crossover valuation.
  notes: The set intentionally mixes public market caps with one private funding benchmark because direct private reprogramming marks are scarce and usually opaque on terms.
