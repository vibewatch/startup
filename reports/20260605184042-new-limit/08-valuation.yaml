- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Comparable anchor / logic
  - Indicative valuation range
  - Probability signal
  - Main trigger
  rows:
  - - Bear
    - IND timing slips, safety or off-target questions rise, and the market re-rates NewLimit like a lower-proof longevity or platform biotech.
    - Closer to BioAge / Sana / lower Recursion style public anchors.
    - $0.7B-$1.5B
    - ~35% from a public-data perspective
    - Delay, toxicology surprise, or a harsh shift away from longevity-risk assets.
  - - Base
    - NewLimit keeps translating quickly but remains prehuman or early-human without decisive proof by the next financing window.
    - Intellia-to-Beam plus a scarcity premium for reprogramming novelty.
    - $1.8B-$2.8B
    - ~45% and most consistent with what is visible today
    - Execution remains good but not good enough to erase proof and disclosure gaps.
  - - Bull
    - First human trial begins on schedule and early safety / biomarker signals are unusually clean, preserving momentum into later stages.
    - Beam-to-CRISPR style public-value corridor with private scarcity premium.
    - $3.0B-$5.0B
    - ~20% because the current mark already leans this way
    - Clinical entry and read-through exceed typical prehuman platform expectations.
  - - Current price hurdle
    - The June 2026 mark assumes something between the top of base and the low end of bull today.
    - Requires private evidence or early human proof that is stronger than public evidence alone.
    - ~$3.1B current reference
    - Already embedded in the round
    - Any miss versus the bull-ish path likely creates downside asymmetry.
  notes: These ranges are not DCF outputs. They are milestone- and comparable-based valuation bands built for a private, pre-revenue biotech with no disclosed term stack.
