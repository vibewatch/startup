  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  rows:
  - - Recommendation
    - research-more
    - The company may be exceptional, but public evidence is still too thin on human proof, term stack, and runway to underwrite the June 2026 mark.
  - - Confidence
    - medium
    - Funding and comparable evidence are real, but valuation precision remains limited by missing terms and no disclosed revenue or burn.
  - - Risk rating
    - high
    - Current valuation already assumes unusually smooth translation from preclinical platform to human proof in a hype-sensitive field.
  - - Valuation stance
    - expensive
    - The ~$3.1B mark is roughly Beam-like and above several public peers that already have clinical or approved-product exposure.
  - - Decision implication
    - Proceed only with price discipline and deep private diligence
    - A lower entry band or unusually clean private evidence could improve the call materially.
  notes: 'This summary is explicitly price-sensitive: the scientific opportunity may be real, but the current mark already embeds a premium outcome before first-in-human proof.'
