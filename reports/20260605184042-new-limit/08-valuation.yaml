  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: Series C cap table, liquidation preferences, anti-dilution protections, participation rights, pro rata rights, and any secondary sale mechanics.
    whyItMatters: Without the term stack, the headline $3.1B mark may not represent clean common-equity value for a new investor.
    diligencePath: Request the latest cap table, financing documents, side letters, and a counsel summary of downside protections.
    relatedQuestionRefs:
    - QV004
    - QV025
    - QV030
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Post-Series-C cash balance, monthly burn, program-by-program spend, and runway through IND and early human readouts.
    whyItMatters: A giant round does not guarantee enough runway to reach proof without another financing, and dilution risk is impossible to underwrite without this bridge.
    diligencePath: Request CFO operating plan, board budget, treasury waterfall, and scenario runway model from close through first data.
    relatedQuestionRefs:
    - QV028
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: clinical-package
    missingEvidence: IND-enabling toxicology, biodistribution, durability, CMC package, and exact first-in-human protocol for the liver program.
    whyItMatters: The current valuation only works if the translational package is strong enough to convert platform excitement into credible human proof on schedule.
    diligencePath: Run regulatory, clinical, and CMC diligence on the full IND package and the biomarker decision tree for dose escalation and success criteria.
    relatedQuestionRefs:
    - QV020
    - QV023
    - QV028
    - QV030
  - type: private-evidence-only
    severity: material
    topic: platform-economics
    missingEvidence: Program-level capital allocation, expected cost to add new cell types, and evidence that the platform can scale beyond the first liver asset without losing focus.
    whyItMatters: A large part of upside depends on whether NewLimit is one good asset or a repeatable portfolio engine worth paying a platform premium for.
    diligencePath: Review R&D planning models, headcount plan, and expected spend per new program alongside data on payload translation rates.
    relatedQuestionRefs:
    - QV023
    - QV028
    - QV030
  - type: missing-source
    severity: material
    topic: tv004-direct-private-reprogramming-comps
    missingEvidence: Closer private epigenetic-reprogramming valuation marks, financing terms, and milestone disclosures than the retained Altos funding benchmark.
    whyItMatters: TV004 is intentionally partial because the best private reprogramming peers do not publish clean current marks or term stacks, which limits like-for-like valuation work.
    diligencePath: Request specialist broker data, investor references, and direct company diligence on closer private reprogramming peers before treating TV004 as exhaustive.
    relatedQuestionRefs:
    - QV018
    - QV021
    - QV022
    - QV030
    relatedTableRefs:
    - TV004
