- id: milestones-contradictions-and-risk
  title: Milestones, contradictions, and execution risk
  body: 'The same evidence that makes the story compelling also defines the core risk. NewLimit now claims
    a first liver reprogramming medicine can reach human trials in 2027, and outside reporting corroborates
    that this is the company’s target. But both the company’s own operating plan and independent field
    coverage say the hard problems are still safety, delivery, dose control, and preserving cell identity
    while resetting age. MIT Technology Review’s 2026 review of the broader reprogramming field is especially
    relevant because it highlights tumor formation in animal models and argues that even the first human
    use cases remain proof-of-concept, not broad rejuvenation. There are also smaller but important factual
    contradictions in the company record: some official materials say NewLimit was founded in 2021, while
    later company and database sources say 2022; public location references alternate between South San
    Francisco and San Francisco; and financing visibility is far better than governance or economics visibility.
    Later chapters should therefore reuse this chapter’s facts but treat valuation, scale, and clinical
    timing with deliberate caution.'
