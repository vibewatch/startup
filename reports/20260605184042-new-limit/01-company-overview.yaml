- id: capital-formation-and-stakeholders
  title: Capital formation, funding chronology, and stakeholder map
  body: NewLimit’s financing history is unusually visible for a private biotech, but not perfectly tidy.
    The founding record starts with founder capital, which the 2021 launch post described as $105 million
    initially, while later company materials describe an initial $110 million founder commitment. External
    venture money became public in May 2023 with a $40 million Series A backed by Dimension, Kleiner Perkins,
    Founders Fund, and angels. The company then stepped up again in May 2025 with a $130 million Series
    B led by Kleiner Perkins, followed just five months later by an additional $45 million round at a
    $1.62 billion cap that brought in Lilly, Duke Management, Section 32, Abstract, and insiders. By June
    2026, NewLimit announced a $435 million Series C led by Founders Fund, while STAT reported an approximately
    $3.1 billion valuation. The stakeholder picture therefore shows increasing scientific validation and
    investor ambition, but not full public visibility into ownership, preferences, board rights, or a
    single canonical total-raised number.
