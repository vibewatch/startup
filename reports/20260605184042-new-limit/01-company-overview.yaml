  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: A current executive roster, board list, observer rights, and governance package are
      still missing from retained public sources.
    whyItMatters: Founder dependence and investor oversight are core company-overview questions, and later
      chapters should not guess governance structure.
    diligencePath: Request the current org chart, board deck index, board roster, observer rights, and
      committee charters from management.
    relatedQuestionRefs:
    - QO010
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: funding-visibility
    missingEvidence: A company-canonical total funding figure and exact post-money valuation mechanics
      for the 2026 Series C are not publicly retained.
    whyItMatters: Valuation, dilution, and investor-control analysis all depend on clean round math rather
      than mixed press and database reconstructions.
    diligencePath: Request the financing summary, cap table, round-close notices, and board-approved valuation
      memos for the 2025-2026 financings.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: current-headcount
    missingEvidence: No retained source gives a management-confirmed current 2026 employee and contractor
      count with geography split.
    whyItMatters: Headcount is a canonical scale and capital-efficiency input, especially for a company
      claiming unusual technical throughput.
    diligencePath: Ask management for current FTE and contractor counts by function and site, plus the
      hiring plan tied to clinical preparation.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
    - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue-and-runway
    missingEvidence: No retained public source discloses revenue, ARR, burn, cash, or runway.
    whyItMatters: Financing visibility without operating-economics visibility can create a false sense
      of diligence completeness.
    diligencePath: Request revenue or collaboration income, burn, cash, runway, and budget assumptions
      through first-in-human dosing.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-coverage
    missingEvidence: Internal dates for exact lab openings, board changes, and non-public program milestones
      are absent from the public chronology.
    whyItMatters: The milestone table is the chronology of record for public diligence, but private inflection
      points could affect pace and execution quality.
    diligencePath: Request an internal milestone log that aligns hiring, financing closes, program launches,
      and manufacturing readiness with exact dates.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO004
