company:
  name: NewLimit
chapter:
  number: 1
  title: Company Overview
  summary: NewLimit is a South San Francisco longevity-biotech company developing epigenetic reprogramming
    medicines, backed first by founder capital and then by a rapid financing ladder that culminated in
    a $435 million Series C in June 2026. Public materials show unusually detailed platform and preclinical
    progress around liver, immune, and vascular programs, but the company remains prehuman, founder-heavy,
    and exposed to field-level safety, delivery, and disclosure risk—including unresolved contradictions
    around founding year, exact total funding, and current headcount.
sections:
- id: identity-and-mission
  title: Identity, mission, and what the company says it builds
  body: 'NewLimit presents itself as a biotech rather than a longevity think tank. The homepage, science
    pages, and 2021 launch post consistently describe the company as trying to add healthy years to human
    life by restoring youthful function in old cells. The core thesis is that aging reflects reversible
    epigenetic drift, not only irreversible damage, so medicines can potentially reset cell behavior without
    fully erasing cell identity. Official materials further show that this is not just a broad anti-aging
    slogan: the company talks about transcription-factor payloads, AI-designed experiments, pooled genomics
    screens, and specific therapeutic programs in liver, immune, and vascular biology. Just as important,
    the launch post says NewLimit wanted to build a for-profit, product-oriented biotechnology company,
    not a paper-first academic institute. The public record still leaves gaps on commercialization, customers,
    and revenue, but the identity of the company—as a capitalized, preclinical epigenetic-reprogramming
    drug developer—is clear.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  tableRefs:
  - TO001
- id: founders-leadership-and-base
  title: Founders, leadership, and geographic base
  body: 'Founder and leadership evidence is strong at the top and thinner below. Brian Armstrong is consistently
    presented as a co-founder and major capital provider, but 2023 TechCrunch reporting is important because
    it narrows his operating role: Armstrong described himself as an investor and board member while saying
    Jacob Kimmel and Greg Johnson were running the business day to day. That early ambiguity appears to
    have resolved by 2026, when the Series C announcement names Kimmel as CEO & President. Kimmel’s background
    at Calico and Greg Johnson’s machine-learning background at Amazon and the Allen Institute fit the
    company’s scientific and computational priorities, while Blake Byers brings both scientific training
    and venture-capital credibility from his decade at GV. Current hiring and recent updates support South
    San Francisco as the operating base, though some outside profiles still say San Francisco more broadly.
    What remains unclear is the full executive roster, formal board composition, and succession depth
    beneath the founder-heavy public face.'
