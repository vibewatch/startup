callouts:
- calloutType: strength
  title: Founder capital and scientific storytelling bought NewLimit unusual room to scale fast
  body: Few early-stage biotechs begin with this much founder capital and then add three large public
    financings while still prehuman. That financial freedom appears to have let NewLimit build a heavy
    technical stack, keep a highly technical team, and move from discovery framing toward candidate manufacturing
    faster than its own founders originally expected.
  claimRefs:
  - CO007
  - CO008
  - CO022
  - CO024
  - CO032
  - CO039
- calloutType: risk
  title: The thesis is still exposed to modality-level safety and translation risk
  body: The strongest adverse signal is not a scandal inside NewLimit but the state of the field itself.
    Independent coverage says partial reprogramming still carries tumor, cell-identity, delivery, and
    dose-control risk, while NewLimit’s own operating plan concedes that key biological and engineering
    questions remain open. Until human data exists, this is still a high-variance scientific bet.
  claimRefs:
  - CO043
  - CO044
  - CO045
  - CO046
  - CO047
- calloutType: assumption
  title: Do not mistake financing transparency for full diligence transparency
  body: Public sources are good enough to reconstruct funding chronology, but not good enough to settle
    exact current headcount, board composition, cap-table mechanics, or economics. Later chapters should
    therefore treat NewLimit as well-financed but still materially under-disclosed in governance and operating
    metrics.
  claimRefs:
  - CO018
  - CO026
  - CO048
