- id: scientific-thesis-and-operating-progress
  title: Scientific thesis, discovery engine, and progress to clinic
  body: 'Public scientific progress is also more concrete than a typical overview chapter would expect.
    NewLimit’s scientific pages and progress posts explain a repeated workflow: use Ambrosia AI to propose
    transcription-factor payloads, test large numbers of payloads in pooled genomics screens, read out
    cell state with single-cell methods, then validate the best hits in functional assays and animal models.
    The company says this process now spans liver, immune, and vascular programs. In 2025 updates, NewLimit
    reported three TF sets with preclinical efficacy in liver-disease models, more than 4,000 TF sets
    tested across hepatocytes and T cells, and a third vascular program. The 2025 year-in-review raised
    the bar further, claiming a first preclinical candidate, 36 payloads that restore youthful function,
    and more than 1,000-times field scale in payload testing. By March 2026, NewLimit said its first candidate
    had moved into large-scale manufacturing and that it had identified pharmacodynamic biomarkers. These
    are all company-generated signals, not human data, but they do indicate a transition from pure platform
    building toward an actual development program.'
