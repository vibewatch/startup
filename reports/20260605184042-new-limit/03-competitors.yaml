callouts:
- calloutType: insight
  title: NewLimit’s clearest wedge is the engine, not yet the endpoint
  body: Relative to Altos and Retro, NewLimit’s strongest public advantage is not a human-stage asset but a more audit-able loop of discovery, optimization, and disclosure. That matters because the whole field still lacks human efficacy; today, the company that can learn fastest may be better positioned than the company that simply raised first.
  claimRefs:
  - CP002
  - CP003
  - CP040
  - CP043
- calloutType: risk
  title: Money and prestige have not yet solved translation
  body: Altos shows that extraordinary capital does not automatically yield a transparent product path, and Calico shows that even an 11-year big-pharma alliance can still end without durable commercial validation. NewLimit should therefore be compared against failed patience as much as against successful science.
