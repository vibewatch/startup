  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-visibility
    missingEvidence: Public development economics, transfer prices, launch pricing assumptions, and partner revenue-share terms for direct reprogramming peers.
    whyItMatters: Without commercial terms it is impossible to test whether NewLimit’s liver-first strategy is truly cheaper or easier to scale than rival platform routes.
    diligencePath: Request board materials or investor updates showing target indication pricing, COGS assumptions, and any partner term sheets for NewLimit and comparable peers.
    relatedQuestionRefs:
    - QP013
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: altos-program-opacity
    missingEvidence: A named Altos candidate, indication, delivery route, and regulator-facing package that would reveal actual product readiness.
    whyItMatters: Altos’s capital and talent lead is real, but without candidate-level disclosure it is hard to know whether NewLimit is actually ahead on translational velocity.
    diligencePath: Ask management or sector specialists for unpublished Altos program maps, hiring packets, or trial-prep evidence beyond public science narratives.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
