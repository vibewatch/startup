    severity: material
    topic: turn-bio-verification
    missingEvidence: A fresh 2026 primary-source update from Turn Biotechnologies confirming its active pipeline, trial timing, and HanAll economics.
    whyItMatters: Turn is the clearest transient-mRNA analogue to NewLimit, but current public verification leans on secondary landscape trackers rather than a live company disclosure.
    diligencePath: Re-check Turn press releases, HanAll filings, and any clinical registry entries before underwriting Turn as a current benchmark peer.
