  - type: missing-source
    severity: material
    topic: repeat-dosing-safety
    missingEvidence: Long-duration animal and human data on repeat dosing, off-target activity, and tumor surveillance after partial reprogramming.
    whyItMatters: The business model for most platforms depends on whether patients need one intervention or repeated lifelong dosing, yet public evidence still does not settle that question.
    diligencePath: Request chronic-tox packages, repeat-dose studies, or regulator briefing books from direct peers and compare them with NewLimit’s current liver program plan.
