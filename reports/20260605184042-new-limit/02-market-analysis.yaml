- id: regulation-reimbursement-adjacent-economics
  title: Regulation, reimbursement, and adjacent advanced-therapy economics
  body: 'The cleanest commercial analog for NewLimit is not wellness but advanced therapeutics, especially gene and cell therapies that already force regulators and payers to confront high upfront prices, uncertain durability, and novel manufacturing burdens. FDA and NIH materials make clear that products in this neighborhood move through CBER-led IND and BLA processes, with expedited pathways available but only after human data appear. Adjacent market evidence also shows why reimbursement will matter as much as biology. CMS''s cell and gene therapy access model ties payment to outcomes for multimillion-dollar sickle-cell therapies, while ISPOR analyses show both sticker prices in the $2.2M to $3.8M range and ongoing pressure for rebates, negotiated reductions, and outcomes-based contracts. AABB''s summary of the 2026 Medicare proposal adds another caution: manufacturing and tissue-procurement costs can be folded back into product payment logic, squeezing margins. Meanwhile, the broader
    cell and gene therapy sector already has thousands of developers, thousands of trials, and double-digit billions of annual investment, so NewLimit is entering a commercialization environment that is active but unforgiving. The lesson for diligence is that regulatory openness exists, but the burden of evidence, durability, and payment design remains extremely high.'
