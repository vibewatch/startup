  evidenceGaps:
  - type: missing-source
    severity: material
    topic: clinical-readiness
    missingEvidence: Detailed IND-enabling toxicology, batch-release, and protocol evidence for New Limit's first human study.
    whyItMatters: Without concrete IND-ready evidence, the difference between an announced trial year and actual first-patient dosing remains material to market-entry timing.
    diligencePath: Request the IND filing status, clinicaltrials.gov identifier, CMC release criteria, and first-site activation plan.
    relatedQuestionRefs:
    - QM018
  - type: private-evidence-only
    severity: material
    topic: aging-indication-pathway
    missingEvidence: Public evidence that regulators or payers would accept a broad aging or healthspan label rather than a disease-specific indication.
    whyItMatters: This determines whether New Limit can eventually graduate from single-disease economics to a platform valuation based on broad aging claims.
    diligencePath: Ask management for regulator feedback on biomarker strategy, label ambition, and payer conversations beyond the first indication.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: material
    topic: sam-som-sizing
    missingEvidence: Indication-level prevalence, treatable-patient filters, delivery eligibility, pricing assumptions, and penetration curves for ALD, immune, and kidney programs.
    whyItMatters: Published sector TAMs are too broad to estimate New Limit's real SAM or near-term SOM with investment-grade confidence.
    diligencePath: Build a bottoms-up model from target indications, likely administration setting, expected pricing corridor, and eligible-patient share.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
