- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Aging demographics and chronic disease burden
    - Driver
    - Ongoing
    - Supports durable demand for therapies that improve multiple age-related outcomes
    - Match New Limit's initial indications to large reimbursable disease burdens rather than abstract longevity claims
  - - Disease-first regulatory path through CBER
    - Mixed
    - Near-term
    - Creates a real route to market but forces indication-specific evidence and endpoints
    - Obtain New Limit's intended first indication, endpoint package, and regulator interaction history
  - - Adjacent CGT reimbursement innovation
    - Driver
    - Near-term
    - Outcomes-based models show payers will negotiate for transformative therapies if economics can be bounded
    - Test whether New Limit's likely price point could fit medical-benefit or outcomes-based contracts
  - - High price and durability uncertainty in CGTs
    - Constraint
    - Near-term
    - Commercial success requires evidence strong enough to justify multimillion-dollar or otherwise premium reimbursement
    - Benchmark expected durability and comparator savings against current CGT launches
  - - Manufacturing and payment-policy complexity
    - Constraint
    - Near-term
    - Bundled procurement/manufacturing payment rules can compress margins and raise CMC execution risk
    - Review New Limit's manufacturing strategy, cost-of-goods assumptions, and provider reimbursement route
  - - Selective 2026 capital markets
    - Constraint
    - Current
    - Follow-on capital should remain available for standout science, but only with clearer data and timelines
    - Pressure-test funding plan under slower fundraising and milestone-heavy partnership structures
  - - Scientific skepticism about longevity timelines
    - Constraint
    - Ongoing
    - Hype can raise financing, but weak translation can delay adoption and compress multiples
    - Separate biomarker progress from evidence of durable clinical benefit and payer-relevant outcomes
  notes: Rows combine commercial drivers with execution constraints because New Limit's market is gated as much by regulation, reimbursement, and capital discipline as by theoretical TAM.
