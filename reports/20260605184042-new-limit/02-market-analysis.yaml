tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to New Limit
  rows:
  - - Disease-focused epigenetic reprogramming medicines
    - RNA, vector, or related therapeutic programs intended to restore youthful function in specific diseased cell types
    - General wellness products, biomarkers sold without therapeutic claims
    - Biopharma partners pre-approval; providers and payers post-approval
    - Core target market and most faithful definition of New Limit's near-term lane
  - - Adjacent cell and gene therapies
    - High-cost advanced therapies, manufacturing services, specialist treatment-center budgets, outcomes-based reimbursement structures
    - Small-molecule primary-care drugs and routine wellness spend
    - Health systems, Medicaid, Medicare, commercial payers
    - Best commercial analog for pricing, evidence, and reimbursement design
  - - Longevity biotech services and diagnostics
    - Biological-age testing, consultation, preventive programs, some clinic services
    - Disease-modifying therapeutic claims unless separately regulated
    - Consumers, employers, clinics
    - Relevant as a broad sector benchmark but not a good proxy for New Limit's first products
  - - Consumer longevity / clinic memberships
    - Preventive screening, hormone or wellness programs, imaging-based memberships
    - Hospital-administered disease therapeutics
    - Consumers and employers
    - Important for sector enthusiasm but mostly outside New Limit's disease-first route
  - - Status-quo chronic disease management
    - Existing liver, kidney, immune, and age-related disease treatment pathways and budgets
    - Age-reversal claims not tied to reimbursable endpoints
    - Specialist providers and insurers
    - This is the incumbent budget pool New Limit must displace or complement
  notes: Boundary logic separates broad longevity-spend estimates from the narrower disease-therapeutic lane New Limit is actually trying to enter.
