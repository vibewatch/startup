      - number: '6.4'
        title: 反向视角：商业化证据缺失与集中风险
        blocks:
          - type: paragraph
            body: >-
              反向逻辑不是 NewLimit 缺少有吸引力的科学故事；问题在于公开商业化证据仍几乎完全缺席。保留来源没有点名任何卫生系统上市伙伴、支付方试点、PBM 协议、试验站点网络、重复企业买方，或续约、NRR
              等留存式指标。这意味着外部人看不出公司会先通过制药合作变现、尝试自研更深入进入临床，还是在外部伙伴保持谨慎时撞上融资悬崖。因此，集中风险虽然面向未来，却是真实存在的：一两家未来制药交易对手、少数专科试验站点和狭窄的首个适应症，可能主导早期商业路径。


              品类本身也有摩擦。NewLimit
              处在长寿和重编程市场，连友好的行业报道都承认，这个市场被过度推销挤得很拥挤；监管和科学文献也持续强调，先进重编程或相邻基因编辑路线存在脱靶、基因组完整性、异质性、生物标志物和肿瘤相关风险。在 NewLimit
              能用真实的人体、医疗服务方和支付方证据替代利益相关方准备度之前，客户章节应被读成一张「哪些人必须被说服」的地图，而不是他们已经被说服的证据。
