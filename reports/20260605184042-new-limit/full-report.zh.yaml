      - number: '6.2'
        title: 今天有哪些公开证据
        blocks:
          - type: paragraph
            body: >-
              今天最强的公开证据不是客户牵引，而是利益相关方准备度。NewLimit 2026 年 1–2 月更新称，首个候选药物已经进入大规模制造，并且识别出 4 个候选药效学（PD）生物标志物。2025
              年度回顾还补充说，2026 年是公司从纯研究组织转向一体化研发公司的过渡年。招聘数据强化了这一转变：公司正在招聘制造负责人、临床开发 VP、PK/PD 测定专家、药品分析和 mRNA
              工程人才。你会在跨越临床前到临床边界时招聘这些岗位，而不是在已经拥有一台现场销售或支付方签约机器时。


              具名外部证据也大多是间接的。公开可识别的外部利益相关方包括 Eli Lilly 相关资本、Duke 相关资本，以及顾问委员会成员 Matthew Breyer 和 Benjamin
              Humphreys。这些关系重要，因为它们释放了转化和临床开发可信度。但它们仍然不等于具名付费客户、在人体中使用该疗法的医疗服务方，或同意覆盖的支付方。实际结论很冷：公开档案支持科学动能和生态相关性，但不支持真实采纳。
