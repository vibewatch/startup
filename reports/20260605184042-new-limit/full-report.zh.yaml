      - number: '7.3'
        title: 融资、集中度与执行风险
        blocks:
          - type: paragraph
            body: >-
              NewLimit 的融资实力真实存在，但这把刀有两面。公司快速完成 $130 million Series B 轮、在 $1.62 billion 估值上限上追加 $45 million，随后又完成 $435
              million Series C
              轮。这消除了许多生物科技平台会死于其中的近期生存风险，但也给一家仍没有人体数据的公司立下异常高的预期。投资者承销的不只是生物学；他们也在承销一次压缩的组织建设。公开招聘显示，NewLimit
              仍在补制造负责人、临床开发、PK/PD、药品分析和 mRNA 工程岗位，同时把 2026
              年描述为成为一体化研发组织的一年。这是典型的执行拥堵画像：科学、制造、分析、临床运营和融资叙事必须一起成熟。集中度问题比头条式平台故事更尖锐。独立报道和公司自身更新都显示，当前价值主张仍压倒性依赖肝脏证据，血管和免疫项目明显更早。如果肝脏研究延迟、生物标志物表现令人失望，或每月
              IV 给药在运营上显得别扭，融资叙事就会从战略充裕转为「公司在证据前面烧钱」的证据。
