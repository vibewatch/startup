      - number: '3.3'
        title: 资本、人才和合作伙伴杠杆
        blocks:
          - type: paragraph
            body: >-
              在资本上，NewLimit 已进入更严肃的量级。公开披露现在显示，公司完成了 1.30 亿美元 Series B、据报由 Eli Lilly 领投且投后估值 16.2 亿美元的 2025 年 4,500
              万美元融资，以及一轮与人体试验雄心挂钩的 4.35 亿美元 Series C。这仍无法匹配 Altos 大得多的弹药库，但已足以缩小差距，让 NewLimit
              不再能被当作一个小型科学项目。更重要的是，投资人名单现在包含这个领域真正看重的验证信号：Kleiner Perkins、Founders Fund，以及 Lilly 式战略信誉，而不只是名人资本。


              合作关系揭示第二层竞争。Retro 与 Multiply Labs 的交易，显示它严肃对待细胞类产出的制造。Juvenescence 的 M42 联盟给了它一个 AI、基因组学和临床基础设施故事，而
              NewLimit 目前没有公开展示这种故事。Buck/Selah 合资企业显示 Juvenescence 如何围绕衰老生物学拆分出聚焦疾病的下注。Calico 则提供反面提醒：即便是持续 11 年的 AbbVie
              联盟，也没有保证持久转化。人才同样不对称。Altos 在顶尖科学家密度上似乎仍最强，Arc 激烈争夺计算和系统生物学人才，而 NewLimit 自己的更新显示，它正在从 Shape
              Therapeutics、ArsenalBio、Arc 和相邻 AI 生物学团队招聘运营人才。实际读数是，NewLimit 现在在资本和招聘上有竞争力，但在下游合作伙伴基础设施上，仍不如一些相邻对手扎根深。
