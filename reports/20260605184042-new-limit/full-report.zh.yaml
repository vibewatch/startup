            title: 不要把融资透明度误当成完整尽调透明度
            body: 公开来源足以重建融资时间线，但不足以确认当前精确人数、董事会构成、股权结构机制或经济性。因此，后续章节应把 NewLimit 视为资金充足，但在治理和运营指标上仍有重大披露不足。
