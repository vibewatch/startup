      - number: '2.3'
        title: 监管、报销和相邻先进疗法经济性
        blocks:
          - type: paragraph
            body: >-
              NewLimit 最干净的商业类比不是健康管理，而是先进疗法，尤其是已经迫使监管者和支付方应对高前期价格、疗效持久性不确定和新型制造负担的基因与细胞疗法。FDA 和 NIH 材料清楚表明，这一邻域的产品要走
              CBER 主导的 IND 和 BLA 流程；加速通道存在，但要等人体数据出现之后。相邻市场证据也说明，报销的重要性会和生物学一样高。CMS
              的细胞与基因治疗准入模型，把数百万美元镰状细胞疗法的支付与结果挂钩；ISPOR 分析则显示，标价在 220 万至 380 万美元区间，同时返利、谈判降价和基于结果的合同压力持续存在。AABB 对 2026 年
              Medicare 提案的总结又加了一层提醒：制造和组织采购成本可能被折回产品支付逻辑，从而挤压利润率。与此同时，更广泛的细胞与基因治疗行业已经有数千家开发者、数千项试验和数百亿美元级年度投资，因此
              NewLimit 进入的是一个活跃但苛刻的商业化环境。尽调要吸取的教训是：监管开放性存在，但证据、持久性和支付设计的负担仍极高。
