      - number: '1.4'
        title: 科学论点、发现引擎和走向临床的进展
        blocks:
          - type: paragraph
            body: >-
              公开科学进展也比一般概览章节预期的更具体。NewLimit 的科学页面和进展文章解释了一套反复运行的工作流：用 Ambrosia AI
              提出转录因子载荷，在汇集式基因组学筛选中测试大量载荷，用单细胞方法读出细胞状态，再在功能实验和动物模型中验证最佳命中。公司称，这一流程现在覆盖肝脏、免疫和血管项目。在 2025 年更新中，NewLimit
              报告了三组在肝病模型中具备临床前疗效的转录因子组合，在肝细胞和 T 细胞中测试了超过 4,000 组转录因子组合，并启动第三个血管项目。2025 年年终回顾进一步抬高标准，宣称已有首个临床前候选药物、36
              个可恢复年轻功能的载荷，以及载荷测试规模超过该领域 1,000 倍。到 2026 年 3 月，NewLimit
              称首个候选药物已进入大规模生产，并已识别药效学生物标志物。这些都是公司自己生成的信号，不是人体数据，但确实表明公司正在从纯平台建设转向实际开发项目。
