  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品到底是什么：年龄重编程药物，而不是泛长寿平台
        blocks:
          - type: paragraph
            body: >-
              NewLimit 正在开发一个具体的治疗产品类别：基于 mRNA 和脂质纳米颗粒的药物，在衰老细胞内短暂表达转录因子载荷，让这些细胞恢复年轻功能。关键产品区别不是抽象的「面向衰老的
              AI」或「重编程研究」，而是在保留目标细胞身份的方式下递送部分表观遗传重编程。运营计划明确写道，完全多能性式重编程会同时重置年龄和细胞类型，而 NewLimit
              的目标是在不抹去分化状态的情况下重置年龄。这个框架很重要，因为公司的首个可商业化产品不是泛化抗衰干预，而是一个特定疾病药物，其收益必须让临床医生、监管者和支付方看得懂。


              公开层面，产品组合已经围绕三个细胞区室组织：用于代谢和肝病的肝细胞、用于免疫功能障碍的 T 细胞，以及用于血管衰老且初始聚焦肾脏的内皮细胞。肝脏仍是主导楔子，因为面向肝细胞的 LNP-RNA
              递送，在临床上比免疫或内皮靶向更可操作；同时，酒精相关和代谢性肝病提供了比「衰老」本身更近的疾病终点。公司自己的披露也表明，这仍是一个建设中的平台，而不是已经完成的模态：NewLimit
              称，正确载荷、正确安全窗口和正确递送系统，仍是活跃的工程问题。这种组合——清晰的疾病切入口，加上未解决的平台级依赖——是尽调中最核心的产品技术事实模式。
