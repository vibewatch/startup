chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命，以及公司声称要做什么
        blocks:
          - type: paragraph
            body: >-
              NewLimit 把自己定位为生物科技公司，而不是长寿智库。官网、科学页面和 2021
              年发布文章都反复说明，公司希望通过恢复衰老细胞的年轻功能，为人类增加健康寿命。核心论点是，衰老反映的是可逆的表观遗传漂移，而不只是不可逆损伤，因此药物有可能在不彻底抹去细胞身份的情况下重置细胞行为。官方材料还显示，这并不是一句宽泛的抗衰口号：公司谈到转录因子载荷、AI
              设计实验、汇集式基因组学筛选，以及肝脏、免疫、血管生物学中的具体治疗项目。同样关键的是，发布文章称 NewLimit
              希望建立一家以产品为导向、营利性的生物科技公司，而不是以论文为先的学术机构。公开记录在商业化、客户和收入上仍有缺口，但公司身份已经清楚：一家资本充足、处于临床前阶段的表观遗传重编程药物开发商。
