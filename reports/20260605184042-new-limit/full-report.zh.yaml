      - number: '7.2'
        title: 监管、法律与制造风险
        blocks:
          - type: paragraph
            body: >-
              这里的监管陷阱，是以为 NewLimit 既不编辑生殖系 DNA，也不交付经典病毒载体，路径就会明显更轻。公开 FDA 和 NIH 材料并不支持这个结论。该机构当前框架仍然要求：涉及类编辑机制时，要有 IND
              级别的脱靶或基因组完整性风险证据；延迟不良事件可想象时，要做长期随访；与常规疗法相比，还要承担异常繁重的化学、制造与控制（CMC）工作。因此，公开记录支持一个清晰结论：NewLimit
              可以对外销售一个疾病优先的疗法，但运营上必须像复杂细胞与基因治疗申办方一样行事。这会把制造和法律暴露提前。公司已经在谈大规模制造，但外部投资者仍看不到可比性、放行检测、供应商集中度或 FDA
              会议纪要。自由实施权（FTO）也仍是活问题，不是后台清理项。公开专利族已经主张广泛的 OCT4-KLF4-SOX2 式年轻化载体；当前生物科技判例也显示，商业化前开发者不能简单假设安全港会让早期专利风险消失。
