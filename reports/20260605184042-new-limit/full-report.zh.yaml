  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和变现状态
        blocks:
          - type: paragraph
            body: >-
              NewLimit 还没有传统意义上的运营收入模式。最强证据来自公司自己的证券文件：2023 年 5 月 Form D、2025 年 1 月修订版和 2025 年 5 月 Form
              D，都把发行人归入「无收入」。官网、科学和融资材料都把公司描述为表观遗传重编程药物开发商，主项目正向明年首次肝脏聚焦人体试验推进，而不是已经上市、有标价或报销的疗法。这让 NewLimit
              在经济属性上更接近消耗资本的治疗研发平台，而不是拥有产品或版税现金流的商业化生物科技公司。


              因此，可支撑的未来变现路径狭窄而熟悉：临床成功最终可能转化为处方药收入，也可能带来合作或授权收入，但公开来源今天没有披露价格、支付方假设、合作经济性或外部平台收入。即便最详细的 2026
              年报道，仍把价值创造框在科学里程碑，而不是客户获取或销售效率。承销时，正确看法是：当前融资在为未来疗法的期权价值买单，而不是支撑一家已有收入质量、定价权或确认毛利的企业。
