      - number: '5.4'
        title: 转化栈、质量控制和关键依赖
        blocks:
          - type: paragraph
            body: >-
              NewLimit 的公开招聘足迹显示，公司正在努力成为一体化研发组织，而不是停留在发现工作室。mRNA 工程岗位提到 IVT、TFF、层析、dsRNA 定量、污染物分析、SOP
              撰写和批记录；制造负责人岗位明确说明 DNA、mRNA 和 LNP CMC 现在位于关键路径；PK/PD 岗位显示公司正在做生物分布和药效学生物标志物资格确认；临床副总裁岗位明确要求首次人体、FDA
              和美国以外监管经验。再加上 Melissa Calton 的转化职责，可见的转化栈是真实存在的。


              但这不应被误认为全面去风险。公开材料显示的是建设信号，不是经审计的执行产出。NewLimit 披露了四个候选药效学生物标志物，并称首个大规模批次正在推进，但它没有公开展示实验资格确认包、GMP 网络细节、支持
              IND 的毒理包，或协议级试验设计。关键依赖图仍穿过至少七个瓶颈：载荷设计质量、汇集式筛选保真度、人源化模型相关性、mRNA 序列优化、器官特异性 LNP
              递送、生物标志物有效性，以及监管级制造和临床运营。因此，转化问题不是 NewLimit
              有没有看到这些依赖——它显然看到了——而是公开证据是否足以说明这些依赖正在以足够快的速度关闭，从而支撑其声称的临床推进节奏。这比发现故事本身更难证明。
