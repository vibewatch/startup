      - number: '1.2'
        title: 创始人、领导层和地理基地
        blocks:
          - type: paragraph
            body: >-
              创始人和领导层证据在最高层很强，往下则变薄。Brian Armstrong 一直被列为联合创始人和主要出资人，但 2023 年 TechCrunch 的报道很重要，因为它收窄了他的运营角色：Armstrong
              称自己是投资人和董事会成员，并表示 Jacob Kimmel 与 Greg Johnson 负责公司的日常运营。到 2026 年，这种早期模糊性似乎已解决，Series C 公告将 Kimmel 列为 CEO
              兼总裁。Kimmel 在 Calico 的背景和 Greg Johnson 在 Amazon、Allen Institute 的机器学习背景，契合公司的科学和计算重点；Blake Byers
              则带来科学训练，以及在 GV 十年的风投信誉。当前招聘和近期更新支持 South San Francisco 作为运营基地，尽管一些外部资料仍更宽泛地写作 San
              Francisco。仍不清楚的是完整高管名单、正式董事会构成，以及创始人色彩很重的公开面孔之下的接班梯队。
