      - number: '8.2'
        title: 市场愿意为什么买单，不会为什么买单
        blocks:
          - type: paragraph
            body: >-
              更广泛的资本背景是支持性的，但有选择性，并不亢奋。J.P. Morgan 的 2026 年 Q1 回顾称，风险资本仍在流入，但正集中到后期资产和更清晰的临床或商业化路径上。长寿专项数据讲的是类似故事：2026 年
              Q1 长寿生物科技融资平均 $91.2 million，中位数只有 $21.8 million，说明少数离群交易承担了大部分金额。LongevityNext
              更尖锐的表述对估值尤其相关：投资者越来越愿意资助那些把衰老转化为监管者、支付方或开方者能读懂的业务，而不是简单奖励「衰老很重要」这个口号。这是解读 NewLimit
              融资的有利版本。反向解读是，同一领域仍会被指责炒作和过度医疗化野心。ScienceAlert、The Conversation 和 MIT Technology Review
              都强调，许多长寿商业化仍跑在证据前面，而部分重编程本身也带有肿瘤和转化风险。NewLimit 可能是这个品类里更严肃的玩家之一，但它仍继承了估值折价，因为投资者和批评者都认为这个领域容易过度承诺。
