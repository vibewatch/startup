  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-useful public gene-editing, cell-therapy, AI-drug-discovery, and
        longevity-biotech references plus one large private rejuvenation benchmark; it is not exhaustive because direct
        private reprogramming comps remain sparse and terms are mostly undisclosed.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - NewLimit（标的）
        - 最新披露私有估值
        - $435M Series C 后约 $3.1B
        - 直接核保对象；用来测试已有多少转化预期被计入价格。
        - 未公开收入、烧钱或条款栈。
      - - Beam Therapeutics
        - 2026 年 6 月市值
        - $3.02B
        - 最接近的上市参照，提醒严肃基因编辑平台可以值到 NewLimit 当前估值附近。
        - Beam 已上市，且已有经过临床验证的递送技术。
      - - Intellia Therapeutics
        - 2026 年 6 月市值
        - $1.85B
        - 对拥有 Phase 3 数据、定位治愈性治疗的基因组编辑公司，是有用参照。
        - 模态不同，公开市场情绪也会扭曲比较。
      - - CRISPR Therapeutics
        - 2026 年 6 月市值
        - $5.02B
        - 上市公司上沿基准，拥有一款获批疗法和多个临床项目。
        - 已有获批产品敞口，对人体前公司是苛刻基准。
      - - Recursion Pharmaceuticals
        - 2026 年 6 月市值
        - $1.72B
        - AI 赋能药物发现平台的良好基准，并已有首例患者给药证据。
        - Recursion 商业模式比年龄重编程更宽。
      - - Sana Biotechnology
        - 2026 年 6 月市值
        - $0.75B
        - 当验证有限、投资人耐心变薄时，Sana 是下沿细胞工程可比对象。
        - 细胞疗法与表观遗传重编程不是同一模态。
      - - Editas Medicine
        - 2026 年 6 月市值
        - $0.40B
        - 提醒人：再令人兴奋的编辑故事，也可能在公开市场低价交易。
        - Editas 有公司自身执行历史，不能完全外推。
      - - BioAge Labs
        - 2026 年 6 月市值
        - $0.71B
        - 围绕代谢衰老已有实际临床里程碑，是有用的上市长寿基准。
        - BioAge 是上市长寿公司，但不是直接重编程同业。
      - - Altos Labs
        - 启动融资基准
        - $3.0B 启动融资
        - 显示私有资本可以在数十亿美元尺度支持登月式复壮平台。
        - 融资额不等于市值，也不等于定价后的 crossover 估值。
    notes: 本组刻意混合上市市值和一个私有融资基准，因为直接的私有重编程估值标记稀缺，条款通常不透明。
