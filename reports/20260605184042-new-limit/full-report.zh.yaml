      - number: '8.4'
        title: 建议、淘汰触发点与尽调
        blocks:
          - type: paragraph
            body: >-
              基于公开数据的建议是继续研究，而不是买入。NewLimit
              有真实亮点：平台进展很快、创始人兼投资人基础可信、制造和生物标志物准备有分量；如果生物学能在人体中成立，市场也足够大，能吸引杰出的私募资本。但按公开证据看，当前估值仍显昂贵，因为它已经接近 Beam
              的上市市值，并超过一长串临床证据更成熟的公司。最大的淘汰触发点很直接：IND 时间、早期安全性或生物标志物一致性任何一个滑坡，都会迫使投资者停止把 NewLimit
              按接近临床的赢家估值，转而把它按更怀疑的长寿市场里一个尚未证明的平台估值。第二个淘汰触发点是条款不透明。如果 Series C
              含有重清算优先权、异常下行保护，或现金跑道比头条融资额暗示的更窄，普通股经济性可能比公开标记更差。因此，尽调议程很窄：股权结构表和条款堆栈、融资后现金和烧钱速度、IND
              支持毒理和生物分布、首次人体试验设计，以及说服后续跨界投资者或战略资本所需的精确生物标志物包。
