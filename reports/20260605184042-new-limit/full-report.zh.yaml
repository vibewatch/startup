    rows:
      - - 人口老龄化和慢性病负担
        - 驱动因素
        - 持续
        - 支撑对能改善多种年龄相关结果的疗法的长期需求
        - 将 New Limit 的首批适应症锚定到规模大、可报销的疾病负担，而不是抽象的长寿叙事
      - - 先做疾病、经 CBER 的监管路径
        - 双向
        - 近期
        - 给出真实上市路径，但也要求按适应症提交证据和终点
        - 拿到 New Limit 拟定的首个适应症、终点组合和监管沟通记录
      - - 相邻 CGT 报销创新
        - 驱动因素
        - 近期
        - 结果导向模型表明，只要经济性有边界，支付方愿意为变革性疗法谈判
        - 测试 New Limit 可能定价能否装进医疗福利或结果导向合同
      - - CGT 高价与持久性不确定
        - 约束
        - 近期
        - 商业成功需要足够强的证据，才能支撑数百万美元级或其他高价报销
        - 对标当前 CGT 上市案例，衡量预期持久性和相对可比疗法的节省
      - - 制造和支付政策复杂度
        - 约束
        - 近期
        - 打包采购 / 制造支付规则可能压缩利润，并抬高 CMC 执行风险
        - 审查 New Limit 的制造策略、销货成本假设和服务提供方报销路径
      - - 2026 年资本市场更挑剔
        - 约束
        - 当前
        - 出色科学仍应能拿到后续资本，但前提是数据和时间表更清楚
        - 在融资放慢、合作更偏里程碑付款的情境下，压力测试资金计划
      - - 科学界对长寿时间表的质疑
        - 约束
        - 持续
        - 热度能撬动融资，但转化乏力会拖慢采用、压缩估值倍数
        - 将生物标志物进展，与持久临床获益和支付方关心结果的证据拆开看
    notes: 这些行把商业驱动因素和执行约束放在一起，因为 New Limit 的市场不只取决于理论总可用市场（TAM），也同样受监管、报销和资本纪律把关。
