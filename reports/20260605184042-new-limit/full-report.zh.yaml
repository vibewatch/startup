  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 融资强度、科学动能、公开市场门槛和领域层面怀疑如何共同导向继续研究建议。
    data:
      nodes:
        - id: capital
          label: 资本证明：$130M B 轮和 $45M 延伸融资之后，又完成 $435M Series C 轮
          type: input
        - id: science
          label: 科学动能：制造已启动，生物标志物已识别，试验目标为明年
          type: input
        - id: opacity
          label: 不透明：无收入、无公开条款堆叠、无公开现金跑道
          type: input
        - id: comparables
          label: 公开市场门槛：当前估值约等于 Beam，高于几家临床阶段同业
          type: input
        - id: sector
          label: 板块风险：长寿炒作和重编程安全性怀疑仍然真实存在
          type: input
        - id: decision
          label: 当前结论：继续研究 / 高风险 / 昂贵
          type: process
        - id: upgrade
          label: 上调路径：干净人体证据，加干净条款或更低入场价格
          type: output
        - id: downgrade
          label: 下调路径：进度滑坡、安全问题或对投资者不友好的条款
          type: output
      edges:
        - from: capital
          to: decision
        - from: science
          to: decision
        - from: opacity
          to: decision
        - from: comparables
          to: decision
        - from: sector
          to: decision
        - from: decision
          to: upgrade
        - from: decision
          to: downgrade
    approximationNotes: 该流程是决策图，不是财务模型。它展示在当前价格下，哪些证据类别会推动建议变化。
