      - number: '3.2'
        title: 平台、递送和成熟度比较
        blocks:
          - type: paragraph
            body: >-
              NewLimit 的公开产品论点在这个领域异常具体。它称自己使用新的转录因子载荷，通过 RESTORE-seq 和 Ambrosia 发现，并以 LNP-RNA 递送，肝脏是首个临床滩头阵地。这与主导 Altos
              以及更广泛重编程讨论的 Yamanaka 因子叙事形成了清晰对比。NewLimit 自己的更新现在描述了一个临床前候选药物、16 个动物疗效载荷、36
              个细胞疗效载荷，以及肝脏、免疫和血管项目。这不能让公司获得临床验证，但确实让它成为同行中公开临床前包最明确的公司之一。


              竞争对手在模态上分化很明显。Retro 是多模态：自噬、细胞疗法和重编程。Calico 本质上是生物学与药物发现平台。AgeX 侧重再生干细胞和血管细胞项目。Juvenescence
              是组合式临床阶段长寿公司，横跨小分子、生物制剂和细胞疗法。Arc 是转化研究机构，而不是常规资产公司。这些差异重要，因为递送和产品架构会塑造商业风险。靶向肝脏的
              LNP-mRNA，看起来比离体器官工作、广泛发现联盟或多能细胞疗法项目更有工业熟悉度。缺点是 NewLimit 的成熟度仍停留在临床前，因此它表面上的优势基于已披露系统性能和早期候选药物选择，而不是注册试验证据。
