      - number: '6.3'
        title: 商业化实际会怎样发生
        blocks:
          - type: paragraph
            body: >-
              如果 NewLimit 在临床上成功，商业化胜负会发生在医疗服务方和支付方工作流里，而不是大众消费者叙事里。NIH 的报销指南说得很明确：FDA
              批准本身并不创造商业成功；没有覆盖，医生大概率不会开方。同一指南还说，报销规划应至少在上市前 24 个月启动，创新者必须尽早识别目标人群、医疗服务方和支付方，并据此塑造临床证据。PharmExec
              更进一步指出，支付方和医疗系统如今共同控制采纳；处方集、医嘱集、EHR 默认值和机构路径，决定了一个名义上已被覆盖的疗法是否真的会被使用。


              这个框架和 NewLimit
              高度相关，因为它的首个疗法被定位为输注型肝病药物，而不是简单的口服基层用药。由专科医疗服务方给药的疗法，在大范围支付方铺开前，就会先遇到医疗福利编码、护理场景、处方集和工作流问题。换句话说，NewLimit
              未来的客户旅程要先穿过专科试验中心、肝病服务方和支付方证据关卡，远早于它看起来像大众市场需求。
