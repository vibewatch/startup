  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 真正的客户利益相关方是谁
        blocks:
          - type: paragraph
            body: >-
              NewLimit
              仍处于临床前阶段，所以真正有用的客户问题不是「今天谁在付钱？」，而是「公司要商业化，谁必须点头？」公司自己的运营计划和独立报道都指向一条分阶段的利益相关方阶梯。第一批最终用户是酒精相关及更广义的脂肪肝患者，因为
              NewLimit 多次把肝脏确定为首个治疗切入点。触达这些患者，要靠肝病专家、胃肠病医生、具备输注能力的医疗服务机构，以及负责专科药订购和随访落地的卫生系统。支付方和 PBM
              站在下一环：他们还不是客户，但会决定任何获批疗法在经济上能否使用。


              企业买方这条线更重要。临床前平台型生物科技公司最早真正可变现的交易对手，往往是制药合作方、被许可方或共同开发伙伴；这些机构能为后期试验、制造放大和上市基础设施买单。这也是为什么 NewLimit
              当前的公开证据更像一份伙伴准备度材料，而不是客户账本：适应症选择、制造建设、生物标志物工作和顾问招募。换句话说，NewLimit 已经有可识别的利益相关方，但还没有持久的公开采纳证据。
