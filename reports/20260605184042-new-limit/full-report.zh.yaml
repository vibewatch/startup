  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和已发布的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              NewLimit 最适合理解为一家建立在衰老生物学之上的疾病治疗公司，而不是泛泛的「长寿」品牌。公司自己的材料持续描述转录因子药物，通过 RNA 递送，并由高通量筛选和 AI
              支撑，具体切入口在肝细胞、免疫细胞和内皮生物学。这会立刻收窄可用的市场定义。已发布的长寿 TAM
              往往把年龄检测、诊所、预防项目、补充剂和直接面向消费者服务打包在一起；这些类别对更广泛行业可能有商业意义，但并不描述 NewLimit
              近期走向收入的路径。因此，实用的市场视角是分层的。最上层是广义长寿生物科技支出，已发布的 2025–2026 年估算集中在 200 亿美元出头。再往下是更宽的长寿治疗叙事，到 2030 年代初可达 400
              亿美元以上，但其中包含补充剂和健康管理。再往下，则是细胞与表观遗传重编程更窄的资本通道；CB Insights 显示 2025 年只有两笔披露融资交易。尽调的关键结论不是市场很小，而是 NewLimit
              可信的商业通道远窄于最大那些已发布 TAM 数字。
