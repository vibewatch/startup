      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 创始人资本和科学叙事给了 NewLimit 异常大的快速扩张空间
            body: >-
              很少有早期生物科技公司一开始就拿到这么多创始人资本，随后又在仍未进入人体阶段时连续完成三轮大型公开融资。这种财务自由似乎让 NewLimit
              得以搭建厚重的技术栈，维持高度技术化的团队，并比创始人最初预期更快地从发现叙事走向候选药物生产。
            calloutType: strength
            claimRefs:
