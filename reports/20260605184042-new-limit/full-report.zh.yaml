  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 根据阶段和可比锚点，而不是收入倍数，给出 NewLimit 悲观、基准和乐观估值带。
    data:
      items:
        - label: 悲观情景
          low: 700
          mid: 1100
          high: 1500
          note: 延迟或安全性冲击会把公司推向更低的公开长寿 / 平台锚点。
        - label: 基准情景
          low: 1800
          mid: 2300
          high: 2800
          note: 进展不错，但在人体证据和条款改善前，仍低于当前估值。
        - label: 乐观情景
          low: 3000
          mid: 3900
          high: 5000
          note: 按时进入临床，加上强外推信号，可守住 Beam 到 CRISPR 这一套估值逻辑。
    approximationNotes: 区间刻意保持粗颗粒度。它们表达一家无收入私营生物技术公司的里程碑和市值逻辑，而不是假装公开数据足以支撑精确 DCF。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV047
      - CV048
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以 IC 口径给 NewLimit 机会打分，维度包括科学动能、融资强度、公开价格支撑、证明、披露和下行不对称。
    data:
      items:
        - label: 科学动能
          value: 4.5
          note: 制造、生物标志物和临床前速度，都好于典型人体前平台证据。
        - label: 融资强度
          value: 5
          note: $435M Series C 轮加上强投资方，对这个阶段很例外。
        - label: 公开价格支撑
          value: 1.5
          note: 当前估值已与 Beam 重叠，并超过几家公开临床阶段同业。
        - label: 临床证明
          value: 1
          note: 目前还没有公开人体安全性或疗效数据。
        - label: 披露质量
          value: 1.5
          note: 没有公开条款堆叠、现金跑道或收入披露。
        - label: 下行不对称
          value: 1.5
          note: 任何滑坡都可能让公司重估到便宜得多的公开可比组。
        - label: 期权价值
          value: 3.5
          note: 如果早期人体数据强，平台可能扩到肝脏以外，上行仍有意义。
    approximationNotes: 分数是方向性判断辅助，不是机械投资模型。低分主要反映证明和披露缺失，不是否定科学雄心。
    claimRefs:
      - CV015
      - CV016
      - CV018
      - CV020
      - CV024
      - CV039
      - CV040
      - CV046
      - CV049
      - CV052
