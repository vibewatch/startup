      - number: '3.4'
        title: 差异化的持久性和怀疑者观点
        blocks:
          - type: paragraph
            body: >-
              看多 NewLimit
              的理由是，它的护城河可能比同行更快复利。公司的优势不只是一个肝脏资产，而是一个发现引擎：筛选数千种转录因子组合、频繁发布技术更新，并且似乎围绕可重复的搜索—学习闭环设计。如果这个闭环真的能提高发现效率，并持续找到更安全的非
              Yamanaka 载荷，它可能比单一治疗概念更难复制。肝脏优先的 LNP 路径，也比一些竞争对手使用的宽泛平台话术更容易被商业化理解。


              怀疑者观点仍然有力。没有领先的细胞重编程公司展示过公开人体疗效数据。综述文献持续指出，致瘤性、细胞身份不稳定、递送控制和重复给药不确定性，是最核心的未解风险。Retro
              的临床阶段状态常被夸大，因为它的人体资产基于自噬，而不是基于重编程。Altos 拥有非凡资本和人才，但公开项目不透明，外界无法知道 NewLimit 究竟是真的领先，还是只是更透明。Calico 与 AbbVie
              分手是尤其重要的反向信号，因为它说明，即便是长周期老年科学，也可能无法把资金和声望转化为持久商业路径。结果是一个有层次的判断：NewLimit
              是该领域位置最好的临床前挑战者之一，但在缺少人体安全性、重复给药和产品经济性证据时，其差异化还不算持久。
