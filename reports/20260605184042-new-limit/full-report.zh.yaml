      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 临床启动显著延误
        - 首项人体肝脏试验明显滑出下一个计划窗口
        - 如果 NewLimit 看起来像普通人体前平台，速度和科学惊喜溢价会迅速压缩。
        - 将估值重切向基准或悲观区间，不支付 2026 年 6 月估值。
      - - 出现安全性或生物分布问题
        - 毒理、脱靶或生物标志物不一致削弱重编程故事
        - 市场不再押注 Beam 式上行，而开始给平台脆弱性定价。
        - 暂停投资，直到用新数据重新评估风险。
      - - 优先权结构不利于投资者
        - Series C 轮条款显示高额清算优先权、估值棘轮或异常下行保护
        - 表面估值不再代表干净的普通股权益价值。
        - 要求更低入场价，否则放弃。
      - - 现金跑道短于表面信息
        - 融资后现金余额或现金消耗显示，公司可能在拿到有意义人体证据前就需要再融资
        - 融资实力的护城河属性下降，下轮下调风险上升。
        - 更严厉地建模稀释，并重新审视投资论点。
      - - 长寿板块情绪重估
        - 其他地方读出不佳或炒作反噬后，板块质疑加剧
        - 全领域压缩会放大市场对 NewLimit 的失望。
        - 使用更严格的公开可比锚点，避免用叙事支撑估值。
    notes: 这些是估值杀伤触发器，不是通用经营风险。每个触发器都会直接改变理性买方今天应支付的价格。
    claimRefs:
      - CV020
      - CV029
      - CV030
      - CV045
      - CV047
      - CV048
      - CV050
      - CV052
  - id: TV006
    title: 最终尽调追问表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构和融资条款
        - Series C 轮的清算优先权、反稀释、参与分配条款、按比例跟投权以及任何二级交易混合
        - 如果本轮结构性保护较重，表面估值会扭曲普通股经济性。
        - 公司律师审阅，加最新股权结构表和融资文件。
      - - 现金、现金消耗和现金跑道
        - Series C 轮后现金余额、月度现金消耗、2026–2028 年运营计划，以及与里程碑挂钩的融资需求
        - 巨额融资不等于到验证节点前都有舒适现金跑道。
        - CFO 模型审阅和董事会批准的运营计划。
      - - IND 支持包
        - 肝脏项目的生物分布、毒理、持久性、剂量范围和 CMC 包
        - 公开估值只有在转化资料包足够强、能顺利进入并跑通人体阶段时才站得住。
        - 临床、CMC 和监管尽调。
      - - 人体生物标志物策略
        - 确切药效学标志物、成功阈值和首次读出时间
        - 投资者需要知道哪类证据会真正推动估值在情景区间之间移动。
        - 方案审阅，加转化团队的生物标志物备忘录。
      - - 平台延展性和组合经济性
        - 在不压垮成本和管理带宽的情况下，新细胞类型项目能推进多快
        - 上行空间很大一部分取决于 NewLimit 会变成单一资产，还是可复制的组合机器。
        - R&D 规划审阅和项目级资本分配模型。
    notes: 这些追问只聚焦少数隐藏变量；它们最可能实质改变当前建议，或改变纪律性投资者应支付的价格。
    claimRefs:
      - CV020
      - CV041
      - CV046
      - CV047
      - CV048
      - CV049
      - CV052
