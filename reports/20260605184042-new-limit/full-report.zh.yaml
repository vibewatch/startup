      - number: '5.3'
        title: 管线成熟度和疾病重点：一个领先肝脏候选药物，免疫与血管项目更早
        blocks:
          - type: paragraph
            body: >-
              公开证据持续显示一个三层成熟度栈。最前面是肝细胞项目：NewLimit 称其已从人源化肝脏筛选，推进到一个具名临床前候选药物；该候选药物可恢复再生功能并增强对酒精损伤的韧性，随后进入大规模生产。公司自己的年终和
              2026 年初更新称，现在有多个具备多效性作用的肝脏载荷；Fierce 和 Longevity
              的外部报道也重复了同样的肝脏优先叙事：领先组合含少于十个转录因子，脂肪肝人群可能是切入口，长期则希望从肝病走向代谢衰老。


              免疫项目落后一层，但并非无足轻重。NewLimit 称，它在衰老 CD8 T 细胞中展示了功能救援，而不只是年轻表达签名；后续更新还宣称有超过十个 T
              细胞功能载荷。这很有意义，因为它表明公司至少在尝试证明功能，且对象是递送和脱靶风险都远高于肝脏的细胞类型。血管项目更早。NewLimit 已以肾脏内皮为重点启动该项目，称一种新 LNP 化学体系可实现超过 60%
              的肾脏内皮递送，并建立了一个让年龄依赖性内皮失败可测量的损伤模型。合起来看，管线像一架连贯的梯子：相对可操作的肝脏优先产品；一个免疫项目，用来检验平台能否泛化到更难目标；一个血管项目，拓宽平台价值，但仍是三者中最具投机性的。
