      - number: '5.2'
        title: 发现引擎和运营架构：AI 排序加汇集式人类细胞筛选
        blocks:
          - type: paragraph
            body: >-
              技术重心是 NewLimit 的发现引擎，它试图解决一个大到无法靠蛮力穷举的组合搜索问题。公司官方科学材料称，RESTORE-seq 使用 DNA
              条形码标记的转录因子池，让数千个载荷假设可以并行测试；运营计划则称，这些命中随后会经过功能实验和临床前模型过滤，而不是只看转录读数。这是部分重编程需要的架构，因为该领域主要失败模式，是过度相信漂亮的时钟或表达变化，而这些变化到了功能、递送或安全性面前站不住。


              Ambrosia 是配套的计算层。NewLimit 自己的研究网站、ICML 研讨会页面和 OpenReview 论文，都描述了一种迁移学习方法，利用蛋白基础模型在超过 10^16
              种可能的转录因子组合搜索空间里导航。重要的是，NewLimit
              不只声称预测准确率更好，还声称有一个实验室在环的迭代工作流，可以提高每美元命中发现数量。招聘中暴露的运营模式进一步说明，这是一个软件赋能的湿实验平台：计算生物学家要为单细胞扰动筛选运行生产级流水线，功能基因组学岗位仍要构建病毒载体试剂和定制化学体系，内部工具还延伸到在实验团队之间移动数据的微服务应用。换句话说，平台不是单一实验，也不是单一模型；它是一个紧耦合工厂，用以在以人类细胞为中心的系统中提出、筛选和分诊载荷。
