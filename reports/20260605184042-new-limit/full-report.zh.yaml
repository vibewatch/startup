      - number: '2.4'
        title: 资本、人才和时间线现实感
        blocks:
          - type: paragraph
            body: >-
              资本市场证据足以支撑一个严肃类别，但不足以支持盲目乐观。NewLimit 为该领域吸引了异常大额融资，长寿主题融资显然仍能完成；但 Crunchbase 和 J.P. Morgan 都描述了一个比 2021
              年登月式阶段更挑剔的环境。投资人奖励的是差异化科学、更清晰的临床路径和更强的数据包，而不只是叙事雄心。这种选择性又与人才密度相互作用。NewLimit 自己称，2025 年 5 月约 34 人团队中超过 90%
              是技术人员，招聘页面强调执行强度高、没有纯管理岗位的文化。科学判断也确实复杂。最新 Cell 综述认为，部分重编程可以在模型中恢复年轻特征；但 MIT Technology Review 和 STAT
              都强调，长寿叙事经常跑在转化前面，要在群体层面移动人类健康曲线非常困难。最重要的是，NewLimit 自己的时间线信号在 2026 年内发生变化：外部报道暗示距离临床大约还要两年，而公司 2026 年 6
              月的文章则声称首次人体试验可在明年开始。这不是否定市场的理由，但足以要求投资人把机会写成分阶段、逐病种推进的建设，而不是近期的大众长寿平台。
