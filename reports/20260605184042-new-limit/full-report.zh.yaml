            body: >-
              NewLimit 进入估值章节时，融资叙事异常强，公开估值桥却异常弱。强的部分看得见。公司和媒体来源都同意，NewLimit 在 2026 年 6 月完成 $435 million Series C；此前在
              2025 年 5 月完成 $130 million Series B，并于 2025 年 10 月在 $1.62 billion 估值上限上追加 $45 million。公开 SEC 文件还显示，NewLimit
              多次将自身归类为没有收入，这意味着承销问题不是当前销售倍数或客户效率，而是当前价格已经假设了多少转化成功。这个问题重要，因为公开证据仍未披露清算优先权、反稀释保护、老股交易占比、当前现金余额或烧钱速度。与此同时，管理层自己的更新显示科学进展确实加速：领先候选药物进入大规模制造，首批次完成
              20%，生物标志物工作正在推进。因此，正确的入场纪律不是把公司简单斥为空心故事，而是承认：对一家仍处于人体前、收入前、条款不透明状态的公司来说，本轮价格已经很苛刻。
