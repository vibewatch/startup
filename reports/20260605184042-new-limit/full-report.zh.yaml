      - number: '7.4'
        title: 声誉、政治与伦理风险
        blocks:
          - type: paragraph
            body: >-
              NewLimit
              不只暴露在实验室失败下，也暴露在长寿叙事的政治里。公司自己的融资公告反复把抗衰药物描述为一个可能远大于传统疗法、并几乎惠及所有人的品类。这套话术可能有利于招聘和融资，但也会招来疾病优先型生物科技公司有时能暂缓的问题。学术生物伦理研究已把延寿研究视为现实争议：资源分配、公平性、炒作管理，以及社会是否应把稀缺资本用于延长寿命，而不是在熟悉的医疗优先事项内改善生活质量。领域声誉让问题更尖锐。独立报道明确说，长寿生物科技仍与江湖骗子和过度推销相邻，这意味着
              NewLimit
              不仅要在直接竞争中捍卫可信度，还要对抗笼罩品类的背景怀疑。实际表现可能是监管者谨慎、支付方不适、伙伴犹豫，或者媒体叙事对挫折和雄心表述都反应过度。公司可以靠疾病优先、数据优先来降低这一风险，但公开记录里的话术已经让风险变成结构性问题，而不是假设。
