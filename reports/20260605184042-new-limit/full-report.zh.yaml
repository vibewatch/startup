      - number: '1.3'
        title: 资本形成、融资时间线和利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              NewLimit 的融资史对一家私营生物科技公司来说异常可见，但并不完全整齐。创立记录始于创始人资本：2021 年发布文章称初始金额为 1.05 亿美元，后来的公司材料则写作创始人初始承诺 1.10
              亿美元。外部风险资本在 2023 年 5 月公开进入，公司获得由 Dimension、Kleiner Perkins、Founders Fund 和天使投资人支持的 4,000 万美元 Series A。2025
              年 5 月，公司再次上台阶，完成 Kleiner Perkins 领投的 1.30 亿美元 Series B；仅五个月后又追加一轮 4,500 万美元融资，估值上限为 16.2 亿美元，引入 Lilly、Duke
              Management、Section 32、Abstract 和内部投资人。到 2026 年 6 月，NewLimit 宣布 Founders Fund 领投 4.35 亿美元 Series C，STAT
              报道其估值约为 31 亿美元。因此，利益相关方图谱显示科学验证和投资人雄心都在增强，但外界仍看不到所有权、优先权、董事会权利，或一个唯一权威的累计融资数。
