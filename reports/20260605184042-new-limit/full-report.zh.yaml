  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 支付方
      - 与 New Limit 的相关性
    rows:
      - - 疾病聚焦的表观遗传重编程药物
        - RNA、载体或相关治疗项目，旨在恢复特定病变细胞类型的年轻态功能
        - 普通健康管理产品、没有治疗声明就出售的生物标志物
        - 获批前为生物制药合作伙伴；获批后为医疗服务方和支付方
        - New Limit 近期赛道的核心目标市场和最贴切定义
      - - 相邻细胞与基因疗法
        - 高成本先进疗法、制造服务、专科治疗中心预算、基于结果的报销结构
        - 小分子基层用药和常规健康管理支出
        - 卫生系统、Medicaid、Medicare、商业支付方
        - 定价、证据和报销设计的最佳商业类比
      - - 长寿生物科技服务与诊断
        - 生物年龄检测、咨询、预防项目、部分诊所服务
        - 疾病修饰治疗声明，除非单独受监管
        - 消费者、雇主、诊所
        - 可作为广义板块基准参考，但不是 New Limit 首批产品的好代理指标
      - - 消费者长寿 / 诊所会员
        - 预防筛查、激素或健康管理项目、基于影像的会员服务
        - 医院给药的疾病疗法
        - 消费者和雇主
        - 能抬高板块热度，但基本不在 New Limit 疾病优先路径内
      - - 现状慢性病管理
        - 现有肝脏、肾脏、免疫和年龄相关疾病治疗路径及预算
        - 未绑定可报销终点的年龄逆转声明
