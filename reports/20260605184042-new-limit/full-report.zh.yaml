      - number: '5.5'
        title: 技术怀疑点：安全性、生物标志物有效性和非肝脏可转化性仍是硬关
        blocks:
          - type: paragraph
            body: >-
              最重要的怀疑点是，NewLimit
              最强的公开证据仍来自公司自己，且停留在临床前。年轻生物科技公司常有这种情况，但在这里更重要，因为部分重编程处在返老还童与去分化之间的狭窄走廊。独立文献支持一种在体细胞身份丢失前存在「安全窗口」的想法，但同一批文献也把癌症风险、器官特异性递送和时钟解读列为未解决的转化问题。NewLimit
              自己的披露通过强调身份保留、动物实验未观察到肿瘤形成，以及生物标志物建设，部分回应了这些问题；但这些数据仍是选择性的，大多没有以同行评议的疾病开发形式发表。


              因此，肝脏是正确起点，但不应被误当成平台可泛化的证明。肝细胞递送受益于已有 LNP 先例和更容易的生物分布逻辑；T
              细胞和肾脏内皮没有这种优势。即便在肝脏内部，领先产品的精确转录因子组成、剂量架构、长期重复给药安全性和生物标志物包仍不透明。更广泛领域才刚在别处进入首个人体表观遗传重编程试验，这意味着 NewLimit
              仍在要求投资人在公司特异性临床证据出现前承销一个类别。谨慎读法不是科学很弱——公开进展是真实的——而是安全监测、生物标志物因果性和递送可重复性，仍是强大发现引擎与持久治疗平台之间的主要门槛。
