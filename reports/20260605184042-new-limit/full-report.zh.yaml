            body: >-
              公开证据指向一个迅速上升的成本底座，因为 NewLimit 正从发现进入开发。公司 2026 年 1–2 月更新称，首个候选药物进入大规模生产，首个大规模批次已完成 20%，并识别出四个药效学生物标志物。2025
              年年终回顾另称，2026 年是 NewLimit 从研究型企业转向一体化研发组织的一年。这些里程碑有财务意义，因为它们意味着支出不再只是早期平台发现，还会投向
              CMC、分析开发、实验资格确认、生物标志物工作、监管准备、动物研究和最终试验运营。


              招聘数据强化了这一判断。Greenhouse 至少列出十个岗位，覆盖制造负责人、临床开发 VP、PK/PD 实验、药品分析、免疫学、计算生物学和人才招聘；Fierce 则报道公司总体约 50
              名员工。这样的组合意味着一家仍处于收入前阶段的公司正在实质性扩张人数。管理层确实声称 Ambrosia 系统让每美元发现数量提高超过 2
              倍，并曾把计划描述为资本高效，这可能提高发现效率。但筛选设计层的效率，不能取消为制造、转化生物学、临床基础设施，以及肝脏、免疫和血管生物学中的多个治疗项目继续投入的必要性。
