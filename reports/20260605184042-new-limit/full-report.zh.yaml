  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 正方：科研推进速度真实
        - 制造、生物标志物和首个候选项目都比管理层最初计划来得更快。
        - 私有毒理、生物分布和试验包必须证明，速度没有牺牲严谨性。
      - - 正方：融资能力异乎寻常
        - $435M Series C 融资接在 $130M B 轮和 $45M 延展轮之后，说明顶级投资人仍在为这个故事买单。
        - 如果股权结构偏清算优先，或现金跑道短于预期，头部融资强度的意义会打折。
      - - 正方：稀缺溢价仍可能存在
        - 长寿资本仍会奖励少数看起来能被监管方和合作方读懂的平台型生物技术公司。
        - 只有 NewLimit 持续把平台工作转化为具体治疗里程碑，这份溢价才守得住。
      - - 反方：没有收入，也没有人体数据
        - Form D 文件仍写着 No Revenues，公开来源也没有显示人体安全性或有效性结果。
        - 干净的首次人体试验包和可信的生物标志物读穿，会显著削弱这个反对意见。
      - - 反方：上市同业比预期更便宜
        - Intellia、Recursion、Sana、Editas 和 BioAge 的交易估值都不高于 NewLimit，尽管已有临床或公开市场敞口。
        - 如果 NewLimit 按期进入临床并产生异常强的早期信号，可比集合可以上移。
      - - 反方：长寿炒作会放大风险
        - 独立评论仍认为，许多长寿资本跑在证据前面；一旦验证滞后，情绪可能急转直下。
        - 更清晰的监管切入点和严肃疾病框架，有助于把 NewLimit 与行业里更吵的叙事切开。
    notes: 反论点不是 NewLimit 缺少雄心或进展，而是从平台承诺到普通股吸引力的公开桥梁仍未搭完。
