  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 版图范围：直接同行、相邻玩家和现状替代品
        blocks:
          - type: paragraph
            body: >-
              NewLimit 已不再落在一个很小的「抗衰创业公司」篮子里。竞争场现在分成四类实际会争夺同一预算或人才池的玩家。第一类是直接的部分重编程同行，如 Altos Labs 和 Retro
              Biosciences，它们试图把返老还童生物学转化为药物。第二类是 Calico 这样的既有长寿生物学平台，它们不是押注单一重编程模态，而是用更宽的发现引擎攻击衰老。第三类是 Arc
              Institute、Juvenescence、AgeX 和 Turn Biotechnologies
              等相邻平台玩家；即便产品架构不同，它们也会争夺科学人才、转化基础设施和投资人注意力。第四类是现状替代品：传统的特定疾病药物开发，以及由合作伙伴主导的衰老生物学项目；它们看起来可能更慢，但监管打法更清楚。


              关键竞争洞察是，NewLimit
              不只会被拿来和那些说自己做「部分重编程」的公司相比。任何组织只要能展示更多已验证的转化进展、更安全的递送、更强的合作伙伴，或资金更充裕的人才机器，都会成为比较对象。公开追踪器现在统计到至少 18
              家围绕部分重编程和细胞返老还童的活跃公司，但整个领域仍没有公开人体疗效数据。这意味着叙事强度、科学透明度和产品路径可信度，比品牌本身更重要。在这个版图中，NewLimit 最强的直接可比对象是 Altos 和
              Retro；Calico、Juvenescence、AgeX、Arc 和 Turn 则定义了相邻压力，一旦执行滑坡，它们会压窄 NewLimit 的差异化。
