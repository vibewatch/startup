      - number: '4.5'
        title: 财务结论和尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              NewLimit
              的财务画像同时强劲又披露不足。强劲，是因为公司集结了一线投资人基础和披露资本栈，少有临床前长寿公司能匹配。披露不足，是因为公司仍没有提供能让承销人把融资优势转化为清晰跑道或资本效率判断的核心指标：没有资金余额、没有月度烧钱、没有季度运营费用拆分、没有临床预算、没有销售成本假设，也没有公开定价或报销框架。公开证据足以说明公司正在积极向临床建设，但不足以判断其支出计划相对科学延误风险是否自律。


              主要投资担忧是人体证据之前的估值拉伸。这里的技术谨慎并不抽象：受尊敬的学术和医学来源继续强调，操纵表观遗传程序和基因编辑系统可能带来严重安全、监督，甚至癌症风险。NewLimit
              自己的科学进展可能真实，但融资故事仍建立在里程碑可信度上，而不是商业证明上。因此，尽调必须聚焦资金储备、烧钱速度、CMC 成本、1
              期预算、各项目决策门，以及需要什么具体人体数据包，才能证明公司应该继续自筹推进，或以不低于当前估值再融一轮。
