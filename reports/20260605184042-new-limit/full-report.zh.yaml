      - number: '1.5'
        title: 里程碑、矛盾和执行风险
        blocks:
          - type: paragraph
            body: >-
              同一批让故事有吸引力的证据，也界定了核心风险。NewLimit 现在声称首个肝脏重编程药物可在 2027
              年进入人体试验，外部报道也佐证这是公司的目标。但公司的运营计划和独立行业报道都说，难题仍是安全性、递送、剂量控制，以及在重置年龄时保留细胞身份。MIT Technology Review 2026
              年对更广泛重编程领域的综述尤其相关，因为它强调了动物模型中的肿瘤形成，并指出即便首批人体使用场景也仍是概念验证，而不是广泛返老还童。公司记录里还有一些较小但重要的事实矛盾：部分官方材料称 NewLimit 成立于
              2021 年，后来的公司和数据库来源则称 2022 年；公开地点表述在 South San Francisco 和 San Francisco
              之间切换；融资可见度远高于治理或经济性可见度。因此，后续章节应复用本章事实，但对估值、规模和临床时间表保持有意的谨慎。
