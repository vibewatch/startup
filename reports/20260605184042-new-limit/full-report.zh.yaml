      - number: '2.2'
        title: 买方、用户、支付方和采用路径
        blocks:
          - type: paragraph
            body: >-
              衰老本身不是可获批的疾病标签，因此 NewLimit
              的初始市场围绕特定疾病临床路径组织，而不是面向消费者的抗衰结账流程。可能的经济买方是专科医疗服务体系、生物制药合作方，以及最终那些已经在慢性肝病、免疫疾病和肾病上重金投入的支付方。代谢项目指向肝病学和肝病照护；免疫项目指向自身免疫或感染性疾病治疗场景；血管项目指向肾脏和心血管相邻照护，因为内皮功能障碍可测量且成本高。这种疾病优先框架同时影响采用和预算归属。门槛不只是某个疗法能否让细胞时钟上「更年轻」。关键是它能否改善肝病医生、肾脏科医生、免疫科医生、医院系统和支付方已经跟踪的结局。实践中，NewLimit
              还面对两阶段买方栈：获批前，投资人和可能的制药合作方为平台开发买单；获批后，医疗服务和支付系统决定使用量。这使市场在长期愿景上巨大，在近期采购现实中又高度设门槛。
