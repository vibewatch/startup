          - type: callout
            title: 这套论点仍暴露在模态级安全性和转化风险之下
            body: >-
              最强的反向信号不是 NewLimit 内部的丑闻，而是这个领域本身的状态。独立报道称，部分重编程仍存在肿瘤、细胞身份、递送和剂量控制风险；NewLimit
              自己的运营计划也承认，关键生物学和工程问题仍未解决。在出现人体数据之前，这仍是一笔高方差的科学赌注。
