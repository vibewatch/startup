  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 流程
      - 作用
      - 依赖
      - 风险
    rows:
      - - Ambrosia 计算模型
        - 确定哪些 TF 载荷优先测试
        - 大型带标签扰动语料和蛋白基础模型嵌入
        - 训练数据或目标函数有偏时，模型质量可能跑在湿实验真实结果前面
      - - 池化 TF 构建和筛选化学
        - 并行生成并追踪大量组合载荷
        - 可靠的条形码、克隆和试剂构建质量
        - 试剂 QC 失败或条形码歧义会污染下游结论
      - - RESTORE-seq / 单细胞读出栈
        - 规模化测量每个载荷引发的细胞状态响应
        - 单细胞测序通量和生物信息学管线
        - 转录层面的胜利未必能顺畅映射到持久功能或安全性
      - - 人源化肝脏和年龄特异性动物模型
        - 把人源细胞发现桥接到生理表型
        - 一致的模型构建和转化相关性
        - 模型成功未必能在人类给药约束下成立
      - - mRNA 序列工程
        - 把 TF 载荷转成可制造的原料药
        - IVT、纯化、QC 和序列设计迭代
        - 效力、dsRNA 负荷和特异性会与可制造性相互取舍
