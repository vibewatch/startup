  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 科学失败、安全性与递送风险
        blocks:
          - type: paragraph
            body: >-
              NewLimit
              的核心风险在于，首次人体研究要求平台一次证明太多东西。公司现在已经把平台叙事和明年的肝脏试验绑在一起，但公开证据仍停留在临床前区间：动物再生、候选生物标志物、内部筛选，以及关于特异性和未见肿瘤形成的官方说法。这样的披露比多数长寿初创公司更好，却仍不等于在人体中证明持久安全性。外部文献很重要，因为它准确解释了这个领域仍会在哪里失败。部分重编程可以带来再生收益，但让再生成为可能的同一套去分化逻辑，也会提高肿瘤发生、细胞身份丧失、器官功能障碍，或剂量窗口窄到无法商业化放大的风险。递送是第二个瓶颈。NewLimit
              自身进展最强的地方，正是 LNP
              生物学天然有利的肝脏。核酸递送综述说明了为什么这点重要：生物分布、免疫清除、内体逃逸和肝外靶向，即便对资本充足的团队也很难。结果是一条看似很窄的科学关键路径：如果肝脏项目不能顺利转化，更大的平台故事会很快变弱。
