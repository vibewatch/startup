      - number: '7.5'
        title: 缓释措施、监测项与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              正确的尽调姿态既不是「因为长寿是炒作所以回避」，也不是「因为科学令人兴奋所以买入」。正确姿态是围绕可观察关口分阶段承销。公开证据已经告诉我们下一步必须过什么关：可信的疾病特异性试验设计、能面对监管的 CMC
              包、生物标志物逻辑能走出内部筛选，以及不依赖一厢情愿的自由实施权图景。这也是为什么未来 12 到 18 个月比公司头条式总融资更重要。如果 NewLimit
              能展示一个完整的肝脏项目，具备具体临床设计、可复现制造和外部看得懂的安全性逻辑，当前很多怀疑就能收窄为正常临床阶段生物科技风险。如果做不到，下行传导会很快，因为肝脏项目当前承载着融资可信度、平台可信度和公司大部分公开差异化。实际结论是，投资者应该像监控一个里程碑堆栈一样跟踪
              NewLimit，而不是把它当作泛长寿品牌。决定性事件已经可见：人体研究准备度、制造可复现性、法律许可，以及疾病优先证据能否跟上平台级野心。
