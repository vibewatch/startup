      - number: '8.3'
        title: 可比框架与情景区间
        blocks:
          - type: paragraph
            body: >-
              由于 NewLimit 不披露收入，最诚实的公开框架是市值可比和里程碑逻辑，而不是合成销售倍数。按这个框架，当前估值标记已经激进。CompaniesMarketCap 页面显示，截至 2026 年 6
              月，Beam 市值 $3.02 billion，Intellia $1.85 billion，CRISPR Therapeutics $5.02 billion，Recursion $1.72
              billion，Sana $0.75 billion，Editas $0.40 billion，BioAge $0.71 billion。这些同业背后的公司官方页面说明了为什么这种比较会让 NewLimit
              多头不舒服：其中几家上市公司已经有获批疗法、Phase 3 数据、Phase 1 给药或其他真实临床暴露。NewLimit
              没有。这并不意味着公司永远无法证明高于这些同业的估值合理；它意味着今天的标记在第一个人体证据点之前，已经为科学速度和稀缺性定价出溢价。情景框架也就自然成立。乐观情景要求按时进入人体，并拿出
              清晰的早期读出，让投资者开始考虑 Beam 到 CRISPR 的估值带。基准情景假设 NewLimit
              仍是稀缺但仍在人体前的平台，估值应略低于当前标记。悲观情景假设延迟、安全担忧或倍数压缩，将估值推向较低的上市基因编辑和长寿队列。
