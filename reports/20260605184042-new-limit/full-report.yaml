      - number: '3.2'
        title: Platform, delivery, and maturity comparison
        blocks:
          - type: paragraph
            body: >-
              NewLimit’s public product thesis is unusually specific for this field. It says it uses novel
              transcription-factor payloads, discovered through RESTORE-seq and Ambrosia, and delivers them as LNP-RNA
              with the liver as its first clinical beachhead. That is a clear contrast to the better-known
              Yamanaka-factor narrative that dominates discussion of Altos and much of the broader reprogramming
              discourse. NewLimit’s own updates now describe one preclinical candidate, 16 animal-efficacy payloads, 36
              cell-efficacy payloads, and liver, immune, and vascular programs. This does not make the company
              clinically validated, but it does make it one of the most explicit preclinical packages in the peer set.


              Competitors split sharply by modality. Retro is multimodal: autophagy, cell therapies, and reprogramming.
              Calico is fundamentally a biology-and-drug-discovery platform. AgeX leans on regenerative stem-cell and
              vascular-cell programs. Juvenescence is a portfolio-style clinical-stage longevity company spanning small
              molecules, biologics, and cell therapy. Arc is a translational research institute rather than a
              conventional asset company. These distinctions matter because delivery and product architecture shape
              commercial risk. Liver-directed LNP-mRNA looks more industrially familiar than ex vivo organ work, broad
              discovery alliances, or pluripotent cell-therapy programs. The downside is that NewLimit’s maturity is
              still preclinical, so its apparent edge is based on disclosed systems performance and early candidate
              selection rather than registered trial evidence.
