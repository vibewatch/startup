      - number: '6.3'
        title: How commercialization would actually happen
        blocks:
          - type: paragraph
            body: >-
              If NewLimit succeeds clinically, commercialization will be won or lost in provider and payer workflows
              rather than on a general-interest consumer narrative. NIH’s reimbursement guide is explicit that FDA
              approval alone does not create commercial success: without coverage, physicians are unlikely to prescribe.
              The same guide says reimbursement planning should start at least 24 months before launch and that
              innovators must identify target populations, providers, and payers early while shaping clinical evidence
              accordingly. PharmExec goes a step further, arguing that both payers and health systems now control
              adoption, with formularies, order sets, EHR defaults, and institutional pathways determining whether a
              therapy that is nominally covered is actually used.


              That framework is highly relevant to NewLimit because its first therapy is framed as an infused liver
              medicine rather than a simple oral primary-care drug. A therapy administered through specialty providers
              creates medical-benefit coding, site-of-care, formulary, and workflow questions before a broad payer
              rollout is even possible. In other words, NewLimit’s future customer journey runs through specialized
              trial centers, hepatology providers, and payer evidence gates long before it resembles mass-market demand.
