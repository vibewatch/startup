      - number: '7.4'
        title: Reputational, political, and ethical risk
        blocks:
          - type: paragraph
            body: >-
              NewLimit is exposed not only to laboratory failure but also to the politics of longevity rhetoric. The
              company’s own financing posts repeatedly frame aging medicines as a category that could be much larger
              than traditional therapeutics and beneficial to nearly everyone. That may be effective recruiting and
              fundraising language, but it also invites questions that disease-first biotech companies can sometimes
              postpone. Academic bioethics work now treats life-extension research as a live debate about resource
              allocation, fairness, hype management, and whether societies should spend scarce capital extending
              lifespan rather than improving quality of life within familiar medical priorities. Field reputation makes
              this sharper. Independent coverage explicitly says longevity biotech still sits near charlatans and
              over-salesmanship, which means NewLimit has to defend its credibility not only against direct competitors
              but also against the ambient skepticism surrounding the category. In practice, that can show up as
              regulator caution, payer discomfort, partner hesitancy, or press narratives that overreact to either
              setbacks or ambitious claims. The company can lower this risk by staying disease-first and data-first, but
              the rhetoric already in the public record means the risk is structural, not hypothetical.
            claimRefs:
              - CR030
              - CR031
              - CR032
              - CR034
              - CR035
