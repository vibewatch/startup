  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and published sizing lenses
        blocks:
          - type: paragraph
            body: >-
              NewLimit is best understood as a disease-therapeutics company built on aging biology, not as a generic
              'longevity' brand. The company's own materials consistently describe transcription-factor medicines,
              delivered through RNA and enabled by high-throughput screening and AI, with specific entry points in
              hepatocytes, immune cells, and endothelial biology. That immediately narrows the usable market definition.
              Published longevity TAMs often bundle together age testing, clinics, preventive programs, supplements, and
              direct-to-consumer services; those categories may be commercially important for the broader sector, but
              they do not describe NewLimit's near-term route to revenue. The practical market lens is therefore
              layered. At the top sits broad longevity biotech spending, where published 2025-2026 estimates cluster
              around the low-$20B range. Below that sits a still-broader longevity therapeutics framing that reaches
              into the $40B-plus range by the early 2030s but includes supplements and wellness. Below that again sits
              the much narrower capital lane for cellular and epigenetic reprogramming, where CB Insights shows only two
              disclosed 2025 funding deals. For diligence, the key takeaway is not that the market is small, but that
              NewLimit's credible commercial lane is far narrower than the largest published TAM numbers.
