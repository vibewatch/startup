      - number: '7.3'
        title: Financing, concentration, and execution risk
        blocks:
          - type: paragraph
            body: >-
              NewLimit’s financing strength is real, but it cuts both ways. The company assembled a $130 million Series
              B, a $45 million extension on a $1.62 billion cap, and then a $435 million Series C in rapid succession.
              That removes the near-term survival risk that kills many biotech platforms, yet it also establishes an
              unusually high expectation set for a company that still has no human data. Investors are not only
              underwriting the biology; they are underwriting a compressed organizational buildout. Public hiring shows
              NewLimit is still staffing head-of-manufacturing, clinical-development, PK/PD, drug-product analytical,
              and mRNA-engineering roles while describing 2026 as the year it becomes an integrated R&D organization.
              That is a classic execution-jam profile: science, manufacturing, analytics, clinical operations, and
              financing narrative all have to mature together. The concentration issue is sharper than the headline
              platform story suggests. Independent coverage and the company’s own updates both show that the current
              value proposition still rests overwhelmingly on liver proof, with vascular and immune programs clearly
              earlier. If the liver study slips, disappoints on biomarkers, or proves operationally awkward through
              monthly IV dosing, the financing narrative can turn from strategic abundance to evidence that the company
              is spending ahead of proof.
