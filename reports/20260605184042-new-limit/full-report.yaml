          Liquidation preferences, anti-dilution, participating features, pro rata rights, and any secondary mix from
          the Series C
        - Headline valuation can misstate common-equity economics if the round is structurally protective.
        - Company counsel review plus latest cap table and financing docs.
      - - Cash, burn, and runway
        - Post-Series-C cash balance, monthly burn, 2026-2028 operating plan, and milestone-linked financing needs
        - A giant round is not the same thing as a comfortable runway to proof.
        - CFO model review and board-approved operating plan.
      - - IND-enabling package
        - >-
          Biodistribution, tox, durability, dose range, and chemistry-manufacturing-controls package for the liver
          program
        - >-
          The public mark only works if the translational package is strong enough to get into and through humans
          cleanly.
        - Clinical, CMC, and regulatory diligence.
      - - Human biomarker strategy
        - Exact pharmacodynamic biomarkers, success thresholds, and timing of first read-through
        - Investors need to know what evidence will actually move valuation between scenario bands.
