      - number: '2.2'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Because aging itself is not an approvable disease label, NewLimit's initial market is organized around
              disease-specific clinical pathways rather than a consumer anti-aging checkout flow. The likely economic
              buyers are specialist provider systems, biopharma partners, and eventually payers that already spend
              heavily on chronic liver, immune, and kidney disease. The metabolic program points toward hepatology and
              liver-disease care; the immunology program points toward autoimmune or infectious-disease treatment
              settings; and the vascular program points toward renal and cardiovascular-adjacent care where endothelial
              dysfunction is measurable and costly. That disease-first framing matters for both adoption and budget
              ownership. The gate is not simply whether a therapy makes cells 'younger' on a clock. It is whether it
              improves outcomes that hepatologists, nephrologists, immunologists, hospital systems, and payers already
              track. In practice, NewLimit also faces a two-stage buyer stack: before approval, investors and perhaps
              pharma collaborators finance platform development; after approval, provider and payer systems determine
              utilization. This makes the market simultaneously huge in long-run aspiration and highly gated in
              near-term procurement reality.
