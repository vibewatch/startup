  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'What the product actually is: age-reprogramming medicines, not a generic longevity platform'
        blocks:
          - type: paragraph
            body: >-
              NewLimit is developing a concrete therapeutic product class: mRNA- and lipid-nanoparticle-based medicines
              that temporarily express transcription-factor payloads inside aged cells so those cells regain youthful
              function. The critical product distinction is not “AI for aging” or “reprogramming research” in the
              abstract, but partial epigenetic reprogramming delivered in a way that preserves the target cell’s
              identity. The operating plan is explicit that full pluripotency-style reprogramming resets age and cell
              type together, while NewLimit’s goal is to reset age without erasing the differentiated state. That
              framing matters because the company’s first commercializable product is not a generalized anti-aging
              intervention; it is a disease-specific medicine whose benefit has to be legible to clinicians, regulators,
              and payers.


              Publicly, the portfolio is already organized around three cell compartments: hepatocytes for metabolism
              and liver disease, T cells for immune dysfunction, and endothelial cells for vascular aging with an
              initial kidney focus. The liver remains the lead wedge because hepatocyte-directed LNP-RNA delivery is
              clinically more tractable than immune or endothelial targeting, and because alcohol-related and metabolic
              liver disease offer nearer-term disease endpoints than “aging” itself. The company’s own disclosures also
              make clear that this is still a platform-in-construction rather than a finished modality: NewLimit says
              the right payloads, the right safety window, and the right delivery systems are still active engineering
              questions. That combination—a sharp disease entry point plus unresolved platform-level dependencies—is the
              central product-tech fact pattern for diligence.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE008
