  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring of the NewLimit opportunity on science momentum, financing strength, public price support, proof,
      disclosure, and downside asymmetry.
    data:
      items:
        - label: Science momentum
          value: 4.5
          note: Manufacturing, biomarkers, and preclinical speed are better than typical prehuman platform evidence.
        - label: Financing strength
          value: 5
          note: $435M Series C plus strong investors is exceptional for stage.
        - label: Public price support
          value: 1.5
          note: Current mark already overlaps with Beam and exceeds several public clinical peers.
        - label: Clinical proof
          value: 1
          note: No human safety or efficacy data are public yet.
        - label: Disclosure quality
          value: 1.5
          note: No public term stack, cash runway, or revenue disclosures.
        - label: Downside asymmetry
          value: 1.5
          note: Any slippage can re-rate the company into a much cheaper public-comp set.
        - label: Option value
          value: 3.5
          note: If early human data are strong, the upside remains meaningful because the platform could widen beyond liver.
    approximationNotes: >-
      Scores are directional judgment aids rather than a mechanical investment model. Low values mostly reflect missing
      proof and disclosure, not a denial of scientific ambition.
    claimRefs:
      - CV015
      - CV016
      - CV018
      - CV020
      - CV024
