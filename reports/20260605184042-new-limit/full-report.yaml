  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - 'THESIS: scientific velocity is real'
        - Manufacturing, biomarkers, and a first candidate arrived faster than management originally planned.
        - Private tox, biodistribution, and trial package must show that speed did not come at the expense of rigor.
      - - 'THESIS: capital access is extraordinary'
        - A $435M Series C after a $130M B and $45M extension shows that elite investors continue to fund the story.
        - >-
          If the cap table is preference-heavy or runway is shorter than expected, headline financing strength becomes
          less meaningful.
      - - 'THESIS: scarcity premium can still exist'
        - >-
          Longevity capital still rewards a small set of platform-biotech names that look legible to regulators and
          partners.
        - That premium holds only if NewLimit continues translating platform work into concrete therapeutic milestones.
      - - 'ANTI-THESIS: no revenue and no human data'
        - Form D filings still say No Revenues, and public sources show no human safety or efficacy results.
        - A clean first-in-human package with credible biomarker read-through would reduce this objection materially.
      - - 'ANTI-THESIS: public peers are cheaper than expected'
        - >-
          Intellia, Recursion, Sana, Editas, and BioAge all trade at or below NewLimit despite live clinical or
          public-market exposure.
        - >-
          If NewLimit enters clinic on schedule and generates unusually strong early signals, the comparison set can
          move upward.
      - - 'ANTI-THESIS: longevity hype is a multiplier risk'
        - >-
          Independent commentary still says much longevity capital runs ahead of evidence and can flip harshly when
          proof lags.
        - >-
          A clearer regulatory wedge and serious disease framing would help separate NewLimit from the sector’s noisier
          narratives.
    notes: >-
      The anti-thesis is not that NewLimit lacks ambition or progress. It is that the public bridge from platform
      promise to common-equity attractiveness is still incomplete.
