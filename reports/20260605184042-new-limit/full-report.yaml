      - number: '8.3'
        title: Comparable frame and scenario range
        blocks:
          - type: paragraph
            body: >-
              Because NewLimit discloses no revenue, the most honest public framework is market-cap comparables and
              milestone logic, not synthetic sales multiples. On that basis, the current mark is already aggressive.
              CompaniesMarketCap pages show Beam at $3.02 billion, Intellia at $1.85 billion, CRISPR Therapeutics at
              $5.02 billion, Recursion at $1.72 billion, Sana at $0.75 billion, Editas at $0.40 billion, and BioAge at
              $0.71 billion as of June 2026. The official company pages behind those peers show why the comparison is
              uncomfortable for NewLimit bulls: several of these public names already have approved therapies, Phase 3
              data, Phase 1 dosing, or other live clinical exposure. NewLimit does not. That does not mean the company
              can never justify a valuation above those peers. It means today's mark already prices in a premium for
              scientific speed and scarcity before the first human proof point. The scenario frame follows naturally.
              Bull requires on-time entry into humans and clean early read-through that lets investors think about a
              Beam-to-CRISPR band. Base assumes NewLimit remains a rare but still prehuman platform and belongs somewhat
              below the current mark. Bear assumes delay, safety concerns, or multiple compression and pushes valuation
              toward the lower public gene-editing and longevity cohort.
