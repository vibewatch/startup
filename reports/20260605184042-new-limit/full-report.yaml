      - number: '1.2'
        title: Founders, leadership, and geographic base
        blocks:
          - type: paragraph
            body: >-
              Founder and leadership evidence is strong at the top and thinner below. Brian Armstrong is consistently
              presented as a co-founder and major capital provider, but 2023 TechCrunch reporting is important because
              it narrows his operating role: Armstrong described himself as an investor and board member while saying
              Jacob Kimmel and Greg Johnson were running the business day to day. That early ambiguity appears to have
              resolved by 2026, when the Series C announcement names Kimmel as CEO & President. Kimmel’s background at
              Calico and Greg Johnson’s machine-learning background at Amazon and the Allen Institute fit the company’s
              scientific and computational priorities, while Blake Byers brings both scientific training and
              venture-capital credibility from his decade at GV. Current hiring and recent updates support South San
              Francisco as the operating base, though some outside profiles still say San Francisco more broadly. What
              remains unclear is the full executive roster, formal board composition, and succession depth beneath the
              founder-heavy public face.
