  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      How financing strength, scientific momentum, public-market hurdles, and field-level skepticism combine into a
      research-more recommendation.
    data:
      nodes:
        - id: capital
          label: 'Capital proof: $435M Series C after $130M B and $45M extension'
          type: input
        - id: science
          label: 'Science momentum: manufacturing started, biomarkers identified, trial targeted next year'
          type: input
        - id: opacity
          label: 'Opacity: no revenue, no public term stack, no public runway'
          type: input
        - id: comparables
          label: 'Public hurdle: current mark sits around Beam and above several clinical-stage peers'
          type: input
        - id: sector
          label: 'Sector risk: longevity hype and reprogramming-safety skepticism remain real'
          type: input
        - id: decision
          label: 'Current call: research-more / high risk / expensive'
          type: process
        - id: upgrade
          label: 'Upgrade path: clean human proof plus clean terms or lower entry price'
          type: output
        - id: downgrade
          label: 'Downgrade path: slippage, safety issues, or investor-unfriendly terms'
          type: output
      edges:
        - from: capital
          to: decision
        - from: science
          to: decision
        - from: opacity
          to: decision
        - from: comparables
          to: decision
        - from: sector
          to: decision
        - from: decision
          to: upgrade
        - from: decision
          to: downgrade
    approximationNotes: >-
      The flow is a decision map rather than a financial model. It shows which evidence categories move the
      recommendation at the current price.
