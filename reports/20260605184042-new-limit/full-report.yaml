  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape scope: direct peers, adjacencies, and status quo substitutes'
        blocks:
          - type: paragraph
            body: >-
              NewLimit no longer sits in a tiny “anti-aging startup” bucket. The competitive field now breaks into four
              practical classes that can win the same budget or talent pool. First are direct partial-reprogramming
              peers such as Altos Labs and Retro Biosciences, which are trying to convert rejuvenation biology into
              medicines. Second are incumbent longevity-biology platforms such as Calico that attack aging through
              broader discovery engines rather than a single reprogramming modality. Third are adjacent platform players
              such as Arc Institute, Juvenescence, AgeX, and Turn Biotechnologies, which matter because they compete for
              scientific talent, translational infrastructure, and investor attention even when their product
              architecture differs. Fourth is the status quo substitute: conventional disease-specific drug development
              and partnership-led aging biology programs that may feel slower but have clearer regulatory playbooks.


              The important competitive insight is that NewLimit is not judged only against other companies that say
              “partial reprogramming.” It is judged against any organization that can show more verified translational
              progress, safer delivery, stronger partners, or a better-capitalized talent machine. Public trackers now
              count at least 18 active companies around partial reprogramming and cellular rejuvenation, yet the whole
              field still lacks public human efficacy data. That means narrative strength, scientific transparency, and
              product-path credibility matter more than branding alone. In this landscape, NewLimit’s strongest direct
              comparators are Altos and Retro, while Calico, Juvenescence, AgeX, Arc, and Turn define the adjacent
              pressure that can narrow its differentiation if execution slips.
            claimRefs:
              - CP010
