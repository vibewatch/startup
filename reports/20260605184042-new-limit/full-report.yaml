      - number: '8.2'
        title: What the market will and will not pay for
        blocks:
          - type: paragraph
            body: >-
              The broader capital backdrop is supportive but selective, not euphoric. J.P. Morgan's Q1 2026 review says
              venture capital is still flowing, yet it is concentrating around later-stage assets and clearer clinical
              or commercial pathways. Longevity-specific datasets tell a similar story: Q1 2026 longevity biotech
              financings averaged $91.2 million but had only a $21.8 million median, so a small number of outlier deals
              are doing most of the work. LongevityNext's sharper framing is especially relevant for valuation:
              investors are increasingly funding businesses that translate aging into something legible to regulators,
              payers, or prescribers, rather than simply rewarding the slogan that aging is important. That is the
              favorable interpretation of NewLimit's raise. The adverse interpretation is that the same field still
              attracts accusations of hype and over-medicalized ambition. ScienceAlert, The Conversation, and MIT
              Technology Review all emphasize that much longevity commercialization still runs ahead of evidence, while
              partial reprogramming itself carries tumor and translational risk. NewLimit may be one of the more serious
              actors in the category, but it still inherits the valuation penalty of operating inside a field investors
              and critics both see as prone to overpromising.
