  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Status
        blocks:
          - type: paragraph
            body: |-
              NewLimit does not yet have an operating revenue model in the conventional sense. The strongest
              evidence comes from the company’s own securities filings: the May 2023 Form D, its January 2025
              amendment, and the May 2025 Form D all classify the issuer under "No Revenues." Official website,
              science, and financing materials all describe the company as a developer of epigenetic-reprogramming
              medicines, with the lead program advancing toward a first liver-focused human trial next year, not a
              marketed therapy with list prices or reimbursement. That makes NewLimit economically closer to a
              capital-consuming therapeutic R&D platform than to a commercial biotech with product or royalty cash
              flow.

              The supportable future monetization path is therefore narrow and familiar: clinical success could
              eventually translate into prescription-drug revenue and possibly partnering or licensing income, but
              no public source discloses prices, payer assumptions, collaboration economics, or external platform
              revenue today. Even the most detailed 2026 reporting still frames value creation around scientific
              milestones, not customer acquisition or sales efficiency. For underwriting purposes, the right view
              is that current financing is funding option value on future therapeutics rather than supporting a
              business with existing revenue quality, pricing power, or recognized gross profit.
