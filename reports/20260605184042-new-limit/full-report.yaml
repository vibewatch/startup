      - number: '3.3'
        title: Capital, talent, and partner leverage
        blocks:
          - type: paragraph
            body: >-
              On capital, NewLimit has moved into a more serious weight class. Public disclosures now show a $130
              million Series B, a reported $45 million 2025 financing led by Eli Lilly at a $1.62 billion post-money
              valuation, and a $435 million Series C tied to human-trial ambitions. That still does not match Altos’s
              far larger war chest, but it reduces the gap enough that NewLimit can no longer be dismissed as a small
              science project. More important, its investor list now includes exactly the kind of validation signal that
              matters in this space: Kleiner Perkins, Founders Fund, and Lilly-style strategic credibility rather than
              only celebrity capital.


              Partnerships reveal a second layer of competition. Retro’s deal with Multiply Labs suggests seriousness
              about manufacturing cell-based outputs. Juvenescence’s M42 alliance gives it an AI, genomics, and
              clinical-infrastructure story that NewLimit does not yet have publicly. The Buck/Selah joint venture shows
              how Juvenescence can spin out focused disease bets around aging biology. Calico, by contrast, offers the
              cautionary example: even an 11-year AbbVie alliance did not guarantee durable translation. Talent is
              similarly asymmetric. Altos still appears strongest on elite scientist density, Arc competes aggressively
              for computational and systems-biology talent, and NewLimit’s own updates show it hiring operators from
