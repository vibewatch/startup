      - number: '4.5'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: |-
              NewLimit’s financial profile is simultaneously strong and underdisclosed. Strong, because it has
              assembled a blue-chip investor base and a disclosed capital stack that few preclinical longevity
              companies can match. Underdisclosed, because the company still provides none of the core metrics that
              would let an underwriter convert that funding advantage into a crisp view on runway or capital
              efficiency: no treasury balance, no monthly burn, no quarterly opex split, no clinical budget, no
              COGS assumptions, and no public pricing or reimbursement framework. Public evidence is sufficient to
              say the company is building aggressively toward the clinic, but not sufficient to determine whether
              the spending plan is disciplined relative to the risk of scientific delay.

              The main investment concern is valuation stretch before proof in humans. Technical caution is not
              abstract here: respected academic and medical sources continue to emphasize that manipulating
              epigenetic programs and gene-editing systems can create serious safety, oversight, and even cancer
              risks. NewLimit’s own scientific progress may be real, but the financing story still rests on
              milestone credibility rather than on commercial proof. Diligence therefore has to focus on treasury,
              burn, CMC cost, phase 1 budget, decision gates by program, and what specific human-data package would
              justify either self-funding forward or another round at or above the current valuation.
