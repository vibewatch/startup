  - id: FR002
    title: Risk transmission map
    type: dag
    summary: The same liver-study milestone transmits into safety, CMC, financing, and platform credibility simultaneously.
    data:
      nodes:
        - id: n1
          label: Cell-identity or safety miss
          detail: Tumorigenicity, dedifferentiation, or off-target concern
          type: risk
        - id: n2
          label: CMC slippage
          detail: Clinical-lot or comparability failure
          type: risk
        - id: n3
          label: Protocol opacity
          detail: No credible public or diligence-visible study design
          type: risk
        - id: n4
          label: FTO friction
          detail: Licensing or litigation overhang
          type: risk
        - id: n5
          label: First liver study delayed or weakened
          detail: Core milestone misses 2027 expectations
          type: impact
        - id: n6
          label: Financing leverage falls
          detail: Harder to support valuation and next capital step
          type: impact
        - id: n7
          label: Platform credibility narrows
          detail: Vascular and immune stories look earlier and less fundable
          type: impact
        - id: n8
          label: Reputation shifts toward hype
          detail: Stakeholders treat company as category risk, not data-first biotech
          type: impact
        - id: n9
          label: Investment thesis breaks
          detail: Position needs full re-underwrite or holdback
          type: impact
      edges:
