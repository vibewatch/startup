      - number: '5.3'
        title: 'Pipeline maturity and disease focus: one lead liver candidate, earlier immune and vascular programs'
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently shows a three-tier maturity stack. At the front is the hepatocyte program,
              where NewLimit says it has moved from humanized-liver screens to a named preclinical candidate that
              restores regenerative function and resilience to alcohol injury, then into large-scale manufacturing. The
              company’s own year-end and early-2026 updates say it now has multiple liver payloads with pleiotropic
              effects, and outside coverage from Fierce and Longevity repeats the same liver-first narrative: fewer than
              ten transcription factors in the lead combination, fatty-liver populations as the likely entry point, and
              a broader ambition to move from liver disease into metabolic aging over time.


              The immune program is one step behind but not trivial. NewLimit says it has shown functional rescue in
              aged CD8 T cells, not merely youthful expression signatures, and later updates claim more than ten T-cell
              functional payloads. That is meaningful because it suggests the company is at least trying to prove
              function in cell types where delivery and off-target risk are much harder than in the liver. The vascular
              program is earlier still. NewLimit has launched it with a kidney-endothelium focus, claims more than 60%
              renal endothelial delivery with a new LNP chemistry, and has built an injury model that makes
              age-dependent endothelial failure measurable. Taken together, the pipeline looks like a coherent ladder: a
              comparatively tractable liver-first product, an immune program testing whether the platform generalizes to
              harder targets, and a vascular program that broadens platform value but remains the most speculative of
              the three.
