        title: Financing Stack, Investors, and Capital Adequacy
        blocks:
          - type: paragraph
            body: |-
              NewLimit’s financing history now looks like a classic venture ladder for a category-defining biotech,
              but on unusually large dollar terms for a program that has not yet generated human data. SEC and
              company-announced disclosures show a $72.2M 2023 exempt offering, a $130.0M May 2025 Form D, a $45M
              October 2025 extension at a $1.62B cap, and a $435M June 2026 Series C. Investor quality is also
              notable: the syndicate spans specialist or health-adjacent capital such as Eli Lilly Ventures and a
              broad group of crossover or tech investors including Founders Fund, Thrive, Greenoaks, Quiet,
              Kleiner Perkins, Valor, Human Capital, and Nat Friedman/Daniel Gross.

              This capital stack clearly reduces near-term financing risk, but it does not make runway underwritable.
              No retained public source gives cash on hand, monthly burn, or scenario runway. The same facts that
              justify a larger treasury also imply a larger cash appetite: broad platform science, multiple active
              programs, manufacturing scale-up, biomarker development, and a likely phase 1 start in 2027. The best
              public conclusion is therefore conditional. NewLimit appears well funded relative to stage, but public
              investors cannot tell whether the current round buys a comfortable multi-year runway or merely enough
              time to reach the first human readout that must justify the next valuation step.
