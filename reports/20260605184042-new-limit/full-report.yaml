      - number: '7.2'
        title: Regulatory, legal, and manufacturing risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory trap here is assuming that because NewLimit is not editing germline DNA or shipping a
              classic viral vector, the path will be meaningfully lighter. Public FDA and NIH materials do not support
              that conclusion. The agency’s current framework still expects IND-grade evidence on off-target or
              genome-integrity risk where editing-like mechanisms are involved, long-term follow-up where delayed
              adverse events are plausible, and unusually heavy chemistry, manufacturing, and controls work compared
              with conventional therapeutics. The public record therefore supports a clear conclusion: NewLimit may
              market a disease-first therapy, but it must operationally behave like a complex cell-and-gene-therapy
              sponsor. That brings manufacturing and legal exposure forward in time. The company is already talking
              about large-scale manufacturing, but outside investors still cannot see comparability, release testing,
              vendor concentration, or FDA meeting minutes. Freedom-to-operate is another live issue rather than a
              back-office clean-up item. Public patent families already claim broad OCT4-KLF4-SOX2-style rejuvenation
              vectors, and current biotech case law shows that precommercial developers cannot simply assume the safe
              harbor makes early-stage patent risk disappear.
