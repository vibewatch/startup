              - CR037
              - CR038
      - number: '7.5'
        title: Mitigations, monitors, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The correct diligence posture is neither “avoid because longevity is hype” nor “buy because the science is
              exciting.” The right posture is staged underwriting around observable gates. Public evidence already tells
              us what must clear next: a credible disease-specific trial design, a regulator-ready CMC package,
              biomarker logic that translates beyond internal screens, and a freedom-to-operate picture that does not
              depend on wishful thinking. That is also why the next 12 to 18 months matter more than the company’s total
              headline funding. If NewLimit can show an intact liver program with concrete clinical design, reproducible
              manufacturing, and externally legible safety logic, much of the current skepticism can narrow into a
              normal clinical-stage biotech risk profile. If it cannot, the downside transmission is fast because the
              liver program currently carries financing credibility, platform credibility, and much of the company’s
              public differentiation. The practical conclusion is that investors should monitor this company like a
              milestone stack, not like a generalized longevity brand. The decisive events are visible: human-study
              readiness, manufacturing reproducibility, legal clearance, and whether disease-first evidence can keep
              pace with platform-level ambition.
            claimRefs:
