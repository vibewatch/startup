chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and what the company says it builds
        blocks:
          - type: paragraph
            body: >-
              NewLimit presents itself as a biotech rather than a longevity think tank. The homepage, science pages, and
              2021 launch post consistently describe the company as trying to add healthy years to human life by
              restoring youthful function in old cells. The core thesis is that aging reflects reversible epigenetic
              drift, not only irreversible damage, so medicines can potentially reset cell behavior without fully
              erasing cell identity. Official materials further show that this is not just a broad anti-aging slogan:
              the company talks about transcription-factor payloads, AI-designed experiments, pooled genomics screens,
              and specific therapeutic programs in liver, immune, and vascular biology. Just as important, the launch
              post says NewLimit wanted to build a for-profit, product-oriented biotechnology company, not a paper-first
              academic institute. The public record still leaves gaps on commercialization, customers, and revenue, but
              the identity of the company—as a capitalized, preclinical epigenetic-reprogramming drug developer—is
              clear.
