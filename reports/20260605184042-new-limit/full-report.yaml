  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              NewLimit enters the valuation chapter with an unusually strong financing narrative and an unusually weak
              public valuation bridge. The strong part is visible. Company and press sources agree that NewLimit closed
              a $435 million Series C in June 2026, after a $130 million Series B in May 2025 and a $45 million
              extension in October 2025 at a $1.62 billion cap. Public SEC filings also show that NewLimit repeatedly
              classified itself as having no revenues, which means the underwriting question is not about current sales
              multiples or customer efficiency. It is about how much translational success the current price is already
              assuming. That question matters because public evidence still does not disclose liquidation preferences,
              anti-dilution protections, secondary mix, current cash balance, or burn. At the same time, management's
              own updates show meaningful scientific acceleration: the lead candidate moved into large-scale
              manufacturing, the first batch reached 20% completion, and biomarker work is under way. The right entry
              discipline therefore is not to dismiss the company as vapor. It is to recognize that the round price is
              already demanding for a business that remains prehuman, pre-revenue, and term-opaque.
