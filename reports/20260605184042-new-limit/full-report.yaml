      - number: '4.4'
        title: Financing Benchmarks and Valuation Context
        blocks:
          - type: paragraph
            body: |-
              Benchmarking makes NewLimit’s latest financing look exceptional even in a strong longevity market.
              Longevity.Technology’s Q1 2026 dataset put average longevity-biotech deal size at $91.2M and the
              median at $21.8M. NewLimit’s $435M Series C is therefore roughly 4.8x the average and about 20x the
              median, which places it firmly in the outlier class rather than in the ordinary run of preclinical
              financings. J.P. Morgan’s Q1 2026 biopharma report is also important context: it describes a
              selective funding market skewed toward later-stage assets and clearer commercial pathways, with
              therapeutics and discovery-platform venture funding down versus Q1 2025. In that context, NewLimit’s
              ability to raise a round of this scale reflects unusually strong investor conviction.

              That strength cuts both ways. Outside reporting places the company around a $3.1B valuation before
              first-in-human data, while management’s own 2025 and 2026 fundraising messages tie capital access to
              scientific acceleration rather than to revenue or partnership receipts. Compared with upper-end
              rejuvenation benchmarks like Altos Labs’ $3B launch funding, NewLimit is still smaller in absolute
              capital terms. But relative to sector medians and to its own stage, the valuation already assumes a
              high probability that preclinical liver data, CMC execution, and early human safety signals will
              translate cleanly enough to preserve financing momentum.
