      - number: '5.5'
        title: 'Technical skepticism: safety, biomarker validity, and non-liver translatability remain the hard part'
        blocks:
          - type: paragraph
            body: >-
              The most important skeptical point is that NewLimit’s strongest public evidence is still company-authored
              and preclinical. That is not unusual for a young biotech, but it matters more here because partial
              reprogramming lives in a narrow corridor between rejuvenation and dedifferentiation. Independent
              literature supports the idea of a “safe window” before somatic identity is lost, yet that same literature
              also frames cancer risk, organ-specific delivery, and clock interpretation as unsolved translational
              problems. NewLimit’s own disclosures partially address this by emphasizing identity preservation, lack of
              observed neoplasia in animal work, and biomarker build-out, but those data remain selective and mostly
              unpublished in peer-reviewed disease-development form.


              Liver is therefore the right place to start, but it should not be mistaken for proof that the platform
              generalizes. Hepatocyte delivery benefits from an existing LNP precedent and easier biodistribution logic;
              T cells and renal endothelium do not. Even within liver, the lead product’s exact transcription-factor
              composition, dose architecture, long-term repeat-dosing safety, and biomarker package remain opaque. The
              broader field has only just reached first-human epigenetic-reprogramming trials elsewhere, which implies
              that NewLimit is still asking investors to underwrite a category before company-specific clinical proof
              exists. The prudent read is not that the science is weak—public progress is real—but that safety
              surveillance, biomarker causality, and delivery reproducibility are still the principal gating items
              between a powerful discovery engine and a durable therapeutic platform.
            claimRefs:
              - CE004
              - CE019
              - CE038
              - CE039
