  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Clinical start slips materially
        - First human liver trial slides meaningfully beyond the next planned window
        - >-
          The premium for speed and scientific surprise compresses quickly if NewLimit looks like a normal prehuman
          platform.
        - Re-cut valuation toward base or bear band and do not pay the June 2026 mark.
      - - Safety or biodistribution problem appears
        - Toxicology, off-target, or biomarker incoherence weakens the reprogramming story
        - The market stops thinking about Beam-like upside and starts thinking about platform fragility.
        - Pause investment until risk is re-underwritten on new data.
      - - Preference stack is investor-unfriendly
        - Series C terms reveal heavy liquidation preference, ratchets, or unusual downside protection
        - Headline valuation stops representing clean common-equity value.
        - Demand lower entry price or pass.
      - - Cash runway is shorter than headlines imply
        - Post-round treasury or burn suggests the company may need capital before meaningful human proof
        - Financing strength becomes less of a moat and down-round risk rises.
        - Model dilution more harshly and re-open the thesis.
      - - Longevity sentiment re-rates
        - Sector skepticism intensifies after poor readouts or hype backlash elsewhere
        - A field-wide compression amplifies NewLimit-specific disappointment.
        - Use stricter public-comp anchors and avoid narrative-based valuation support.
    notes: >-
      These are valuation kill triggers, not generic operating risks. Each trigger directly changes what a rational
      buyer should pay today.
