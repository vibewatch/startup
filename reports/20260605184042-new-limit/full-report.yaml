      - number: '6.2'
        title: What public proof exists today
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence today is not customer traction but stakeholder readiness. NewLimit’s
              January-February 2026 update says the first candidate has moved into large-scale manufacturing and that
              four candidate pharmacodynamic biomarkers have been identified. The 2025 year-in-review adds that 2026 is
              the transition from a pure research organization to an integrated R&D company. Hiring data reinforce that
              shift: the company is recruiting a Head of Manufacturing, a VP of Clinical Development, PK/PD assay
              specialists, drug-product analytics, and mRNA engineering talent. These are the roles you hire when you
              are trying to cross the preclinical-to-clinic boundary, not when you already have a field sales or
              payer-contracting machine.


              Named external proof is also mostly indirect. Publicly identified outside stakeholders include Eli
              Lilly-related capital, Duke-linked capital, and advisory board members Matthew Breyer and Benjamin
              Humphreys. Those relationships matter because they signal translational and clinical-development
              credibility. But they are still not the same as a named paying customer, a provider using the therapy in
              humans, or a payer agreeing to cover it. The practical conclusion is stark: the public file supports
              scientific momentum and ecosystem relevance, but not real adoption.
