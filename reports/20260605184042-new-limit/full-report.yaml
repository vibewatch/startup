  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Scientific failure, safety, and delivery risk
        blocks:
          - type: paragraph
            body: >-
              NewLimit’s core risk is that the first human study asks the platform to prove too many things at once. The
              company has now tied the platform narrative to a liver trial next year, but the public evidence still sits
              in the preclinical zone: animal regeneration, biomarker candidates, internal screens, and official claims
              about specificity and lack of neoplasia. That is better disclosure than most longevity startups provide,
              yet it is still not the same as showing durable safety in people. The external literature matters because
              it explains exactly where the field can still fail. Partial reprogramming can deliver regeneration
              benefits, but the same dedifferentiation logic that makes regeneration possible also raises the risk of
              tumorigenesis, loss of identity, organ dysfunction, or a dose window too narrow to scale commercially.
              Delivery is a second bottleneck. NewLimit’s own progress is strongest where LNP biology is naturally
              favorable—the liver. Reviews of nucleic-acid delivery show why that matters: biodistribution, immune
              clearance, endosomal escape, and extrahepatic targeting remain hard even for well-capitalized teams. The
              result is a deceptively narrow scientific critical path: if the liver program does not translate cleanly,
              the broader platform story weakens quickly.
            claimRefs:
