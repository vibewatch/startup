  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Indicative bear, base, and bull valuation bands for NewLimit built from stage and comparable anchors rather than
      revenue multiples.
    data:
      items:
        - label: Bear case
          low: 700
          mid: 1100
          high: 1500
          note: Delay or safety shock pushes the company toward lower public longevity / platform anchors.
        - label: Base case
          low: 1800
          mid: 2300
          high: 2800
          note: Good progress but still below the current mark until human proof and terms improve.
        - label: Bull case
          low: 3000
          mid: 3900
          high: 5000
          note: On-time clinical entry plus strong read-through preserves Beam-to-CRISPR style valuation logic.
    approximationNotes: >-
      Ranges are intentionally coarse. They express milestone and market-cap logic for a private, no-revenue biotech
      rather than pretending public data supports precise DCF math.
