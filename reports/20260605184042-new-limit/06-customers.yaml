- id: adverse-view
  title: 'Adverse view: missing commercial proof and concentration risk'
  body: |-
    The adverse case is not that NewLimit lacks a compelling scientific story; it is that public commercialization proof is still almost entirely absent. No retained source names a health-system launch partner, payer pilot, PBM agreement, trial site network, repeat enterprise buyer, or any retention-style metric such as renewals or NRR. That means outsiders cannot tell whether the company will monetize first through a pharma partnership, attempt to self-develop deeper into the clinic, or face a financing cliff if outside partners remain cautious. The concentration risk is therefore forward-looking but real: one or two future pharma counterparties, a small set of specialized trial sites, and a narrow first indication could dominate the early commercial path.

    There is also category friction. NewLimit is operating in a longevity and reprogramming market that even sympathetic trade coverage admits has been crowded by over-salesmanship, while regulatory and scientific literature continue to highlight off-target, genome-integrity, heterogeneity, biomarker, and tumor-related risks for advanced reprogramming or adjacent gene-editing approaches. Until NewLimit can replace stakeholder readiness with actual human, provider, and payer proof, the customers chapter should be read as a map of who must be convinced—not as evidence that they already have been.
