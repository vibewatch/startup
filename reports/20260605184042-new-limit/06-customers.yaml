- id: TU001
  title: NewLimit stakeholder segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public proof today
  - Strategic value
  - Gap
  rows:
  - - Pharma collaborator / licensee
    - 'Buyer: pharma BD and external innovation teams'
    - Fund late-stage trials, manufacturing, and commercialization via partnership or license
    - No named licensing or co-development deal disclosed
    - Most plausible first enterprise buyer for a preclinical platform biotech
    - Need named counterparties, deal structure, and economics
  - - Trial investigators and specialty centers
    - 'Users: hepatology-focused investigators and study sites'
    - Run first liver studies and generate translational proof
    - No named sites or investigators disclosed publicly
    - Gatekeepers for first human data and protocol execution
    - Need site list, inclusion criteria, and site-of-care plan
  - - Hepatology providers / infusion-capable health systems
    - 'Users: hepatologists, GI specialists, outpatient infusion systems'
    - Administer and monitor a future liver therapy
    - Only indirect proof via indication choice and infusion-style plan
    - Would convert approval into actual patient use
    - Need workflow, ordering, safety-monitoring, and reimbursement detail
  - - Payers / PBMs / CMS
    - 'Payers: Medicare, Medicaid, commercial insurers, managed pharmacy and medical benefit organizations'
    - Coverage, coding, payment, and utilization management
    - No payer strategy or contracts disclosed
    - Coverage determines whether providers can prescribe at scale
    - Need HEOR plan, coding path, and target evidence package
  - - Patients and caregivers
    - 'End users: ALD, fatty-liver, and broader metabolic-liver patients'
    - Seek disease modification and preserved liver function
    - Disease burden evidenced; no NewLimit patient use yet
    - Ultimate value capture depends on patient benefit and access
    - Need human efficacy, safety, and adherence data
  - - Academic / KOL / research collaborators
    - Advisors, disease experts, translational researchers
    - Shape target selection, biomarkers, and clinical strategy
    - Named advisors disclosed; no sponsored-collaboration economics disclosed
    - Influence design quality and external credibility
    - Need formal collaborator map and role boundaries
  notes: Rows distinguish eventual economic buyers from near-term scientific or clinical influencers. Public proof is strongest for stakeholder categories and weakest for actual commercial adoption.
