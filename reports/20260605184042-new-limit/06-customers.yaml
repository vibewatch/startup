  title: Today’s proof is stakeholder readiness, not customer traction
  body: |-
    NewLimit’s public record shows manufacturing progress, biomarker work, advisors, and trial-readiness hiring. It does not yet show a single named paying customer, deployed provider, health system, or payer contract.
