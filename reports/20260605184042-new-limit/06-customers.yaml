    topic: named-commercial-counterparties
    missingEvidence: Names, roles, and economics of any active pharma, provider, payer, or health-system counterparties working with NewLimit today.
    whyItMatters: Without named counterparties, the chapter cannot distinguish credible commercial traction from general ecosystem interest.
    diligencePath: Request the active BD funnel, signed collaboration list, and any executed option, license, or sponsored-research agreements.
