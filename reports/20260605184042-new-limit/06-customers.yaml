company:
  name: NewLimit
chapter:
  number: 6
  title: Customers
  summary: |-
    NewLimit does not yet show public evidence of paying customers, deployed providers, payer contracts, or health-system adoption. The real stakeholder map today is future-oriented: initial end users are alcohol-related and metabolic liver-disease patients, their providers are hepatology and infusion-centered health systems, and the most plausible near-term enterprise buyer is a pharma partner or licensee rather than a hospital or insurer. Public proof is limited to scientific progress, investor/advisor credibility, and hiring for manufacturing and clinical development, while reimbursement, provider workflow, and safety evidence remain major commercialization gates.
sections:
- id: stakeholder-map
  title: Who the real customer stakeholders are
  body: |-
    NewLimit is still preclinical, so the useful customer question is not “who is paying today?” but “who would have to say yes for the company to become commercial?” The company’s own operating plan and independent coverage point to a staged stakeholder ladder. The first end users are patients with alcohol-related and broader fatty-liver disease, because NewLimit has repeatedly identified the liver as its first therapeutic beachhead. Those patients are reached through hepatologists, gastroenterologists, infusion-capable provider groups, and the health systems that operationalize specialty-drug ordering and follow-up. Payers and PBMs sit one step later: they are not yet customers, but they will decide whether any approved therapy is economically usable.

    The enterprise-buyer story is even more important. For a preclinical platform biotech, the earliest truly monetizable counterparties are often pharma collaborators, licensees, or co-development partners that can finance later-stage trials, manufacturing scale, and launch infrastructure. That is why NewLimit’s current public proof looks more like a partner-readiness dossier than a customer ledger: clinical indication selection, manufacturing buildout, biomarker work, and advisor recruitment. Said differently, NewLimit already has identifiable stakeholders, but not yet durable public adoption proof.
