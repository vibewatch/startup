- calloutType: risk
  title: Commercial concentration could emerge before revenue does
  body: |-
    Because NewLimit is still preclinical, early monetization may depend on a tiny set of future pharma partners, specialty trial centers, and reimbursement gatekeepers. That creates concentration risk long before reported revenue exists.
