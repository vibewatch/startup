companyProfile:
  summary: New Limit is a private longevity-biotech company building partial epigenetic reprogramming medicines, with current programs centered on hepatocytes, T cells, and endothelial cells and a liver-first path toward human trials. The company has moved from founder-funded formation into a very large private-financing stack, while still presenting as a no-revenue, preclinical therapeutics platform whose public evidence is strongest on scientific progress and weakest on commercial disclosure.
