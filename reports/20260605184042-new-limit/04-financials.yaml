- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact evidence needed
  - Why management likely has it
  - Priority
  rows:
  - - Cash balance
    - Cannot calculate runway or downside financing risk
    - Current treasury balance and unrestricted cash
    - Treasury is a standard board-level reporting item after a $435M raise
    - blocking
  - - Monthly burn and quarterly opex
    - Cannot judge capital efficiency or time to next round
    - Last 6 quarters of R&D, G&A, and CMC spend
    - Management must already track burn to size hiring and trial plans
    - blocking
  - - Phase 1 budget and timeline detail
    - Cannot assess whether Series C fully funds first-in-human execution
    - Trial budget, patient count, site count, and contingency assumptions
    - Clinical and finance teams need this to authorize phase-1 startup
    - blocking
  - - CMC cost per batch / per dose
    - Cannot estimate gross margin path or cash needed through dose escalation
    - Batch cost, release-testing cost, and expected yields
    - Manufacturing is already underway and must be budgeted internally
    - material
  - - Pricing and reimbursement assumptions
    - No valuation framework for eventual product economics
    - Target indication pricing corridor, payer mix, and dosing assumptions
    - Commercial planning normally starts well before pivotal development
    - material
  - - Cap table after Series C
    - Cannot assess dilution, insider ownership, or future round sensitivity
    - Fully diluted cap table and option pool schedule
    - The company must have updated ownership records after closing the round
    - material
  - - Partnership / licensing pipeline
    - Cannot include non-dilutive cash as a financing offset
    - Any live BD discussions, term sheets, or partner outreach strategy
    - Management and board would track active counterparties if present
    - material
  - - Audited financial statements or board package
    - Public claims remain impossible to reconcile to formal accounts
    - Latest audited statements or board-level budget-to-actual package
    - A company of this scale should maintain formal finance reporting even if private
    - blocking
  notes: These are the highest-leverage missing items for financial diligence. Public sources provide scientific and financing momentum but not underwriting-grade operating data.
