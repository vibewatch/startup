- id: capital-intensity
  title: Cost Structure, Burn Proxies, and Capital Intensity
  body: |-
    Public evidence points to a sharply rising cost base as NewLimit moves from discovery into
    development. The company’s January-February 2026 update says its first candidate entered large-scale
    manufacturing, the first large-scale batch was already 20% complete, and four pharmacodynamic
    biomarkers had been identified. The 2025 year-in-review separately says 2026 is the year NewLimit
    transitions from a research enterprise into an integrated R&D organization. Those milestones matter
    financially because they imply spending on CMC, analytical development, assay qualification,
    biomarker work, regulatory preparation, animal studies, and eventual trial operations—not just on
    earlier-stage platform discovery.

    Hiring data reinforce that interpretation. Greenhouse listed at least ten openings across head of
    manufacturing, VP clinical development, PK/PD assays, drug product analytics, immunology,
    computational biology, and talent acquisition, while Fierce reported about 50 staffers overall.
    That combination implies meaningful headcount expansion in a company that is still pre-revenue.
    Management does claim >2X more discoveries per dollar from its Ambrosia system and previously
    described its plan as capital efficient, which may improve discovery productivity. But efficiency at
    the screen-design layer does not remove the need to fund manufacturing, translational biology,
    clinical infrastructure, and multiple therapeutic programs in liver, immune, and vascular biology.
