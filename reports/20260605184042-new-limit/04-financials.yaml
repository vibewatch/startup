callouts:
- calloutType: strength
  title: Capital access is real, not theoretical
  body: |-
    NewLimit has assembled one of the strongest disclosed financing stacks in longevity biotech. The
    size and quality of the syndicate materially reduce the risk that the company fails because capital
    markets are closed to it in the near term.
  claimRefs:
  - CI012
  - CI014
  - CI016
- calloutType: risk
  title: Valuation is ahead of human proof
  body: |-
    A roughly $3.1B valuation ahead of first-in-human data means investors are underwriting translation,
    manufacturing, and early safety before they have direct clinical evidence. That is a powerful vote of
    confidence, but it also sets a high bar for the first data package.
  claimRefs:
  - CI015
  - CI031
  - CI034
  - CI040
- calloutType: risk
  title: Runway remains opaque despite the large round
  body: |-
    Public sources disclose financing events but not treasury balance, monthly burn, or the cost of the
    first clinical plan. Without those items, outsiders can see that NewLimit is well funded in gross
    terms but still cannot calculate a credible runway.
  claimRefs:
  - CI041
  - CI042
  - CI044
- calloutType: recommendation
  title: Priority diligence package before underwriting
  body: |-
    Request treasury, monthly burn, 2026-2027 operating plan, CMC batch-cost detail, first-trial budget,
    and a fully diluted cap table. Those items are the shortest path from a compelling science-and-funding
    story to a financial model that can actually be underwritten.
  claimRefs:
  - CI041
  - CI042
  - CI045
  - CI046
