  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Cash balance and runway
    missingEvidence: No public treasury balance, monthly burn, or runway model is disclosed.
    whyItMatters: Without treasury and burn, a $435M round cannot be translated into runway months or downside financing risk.
    diligencePath: Request current cash balance, last twelve months of monthly burn, and base/bear runway scenarios from finance leadership.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: Quarterly opex split
    missingEvidence: No retained source breaks spending into R&D, G&A, CMC, or clinical prep.
    whyItMatters: The company is transitioning into integrated R&D, so spending mix now determines how much of the round is durable platform investment versus near-term trial burn.
    diligencePath: Request budget-to-actual statements for 2025 and 2026 showing R&D, G&A, CMC, and capitalized items separately.
    relatedQuestionRefs:
    - QI017
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: Phase 1 budget and operating plan
    missingEvidence: No patient count, site plan, or trial-budget disclosure is public.
    whyItMatters: Series C adequacy depends on whether first-in-human execution is a modest safety study or a broader proof-of-biology package.
    diligencePath: Request phase-1 protocol assumptions, site count, enrollment plan, drug-supply budget, and contingency reserves.
    relatedQuestionRefs:
    - QI017
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: CMC cost per batch and per dose
    missingEvidence: Public sources confirm large-scale manufacturing has started but do not disclose batch cost, yield, release testing, or expected dose cost.
    whyItMatters: CMC can dominate preclinical and early clinical cash use for novel RNA/LNP therapeutics.
    diligencePath: Request batch record cost build, QA/QC testing budget, expected yield, and internal versus CDMO manufacturing split.
    relatedQuestionRefs:
    - QI018
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: Pricing and reimbursement assumptions
    missingEvidence: No list price, payer mix, or gross-to-net framework is disclosed for the liver program.
    whyItMatters: Without even a preliminary price corridor, the company cannot be benchmarked against analogous metabolic or hepatology therapies.
    diligencePath: Request internal pricing work, target product profile, expected dosing cadence, and payer or KOL feedback.
    relatedQuestionRefs:
    - QI004
    - QI018
    relatedTableRefs:
    - TI002
    - TI005
  - type: missing-source
    severity: material
    topic: Cap table after Series C
    missingEvidence: No public fully diluted cap table or ownership schedule was retained.
    whyItMatters: Dilution sensitivity matters when a company has already stepped from a $1.62B cap to roughly $3.1B before human data.
    diligencePath: Request post-Series-C cap table, option pool, SAFEs or converts, and board-approved ownership waterfall.
    relatedQuestionRefs:
    - QI013
    - QI014
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: Partnership and licensing pipeline
    missingEvidence: No retained source discloses active BD counterparties, draft term sheets, or planned partnership timing.
