company:
  name: Hermeus

chapter:
  number: 7
  title: Risks
  summary: >-
    Hermeus faces a multi-layered risk profile dominated by three critical uncertainties: the
    unproven turbine-based combined-cycle (TBCC) flight mode transition at the heart of its
    Chimera II engine, 100% revenue dependence on a single DoD customer category that absorbed
    a 43% FY2026 budget cut, and the absence of a commercial certification pathway for the
    Halcyon Mach 5 civil aircraft concept. Structural debt ($150M of $350M Series C) and an
    in-program CEO transition compound execution risk. The thesis hinges on successful TBCC
    flight demonstration in the 2026–2027 window; failure of that milestone would constitute
    a near-term thesis-break.

sections:
  - id: technical-execution-propulsion-risk
    title: Technical Execution & Propulsion Risk
    body: >-
      Hermeus' core technology bet is the Turbine-Based Combined Cycle (TBCC) Chimera engine,
      which must seamlessly transition from turbojet to ramjet mode in flight across the Mach
      2–3 handover envelope. The only demonstrated mode-transition was a ground test at the
      University of Notre Dame in late 2022 using the smaller Chimera I (GE J85 core); the
      full-scale Chimera II flight demonstration with the Pratt & Whitney F100 precooler plus
      integrated ramjet module is untested in flight. Quarterhorse Mk 2.1 reached Mach 1.21
      on May 26, 2026 — the first privately funded supersonic unmanned flight in the US —
      using only the turbine, not the ramjet. The Mach gap from 1.21 to the Chimera II target
      of Mach 3.3+ spans major uncharted engineering territory: variable-geometry inlet
      transitions, bypass duct management, and aerothermal loads exceeding 1,000 °C. From
      Mach 3.3+ to the Darkhorse operational target of Mach 5+, an additional leap with no
      demonstrated precedent in reusable runway-launched vehicles remains. The FAA authorized
      only seven supersonic test flights through December 31, 2026, tightly constraining
      the risk-reduction cadence. Materials science is a systemic bottleneck: the US supply
      chain for hypersonic-grade heat-resistant composites and carbon-carbon components is
      documented as a national-level vulnerability by NDIA, with most suppliers geared for
      low-rate production only. Hermeus opened the first phase of its HEAT facility in
      Jacksonville to accelerate engine testing, but the facility cannot resolve upstream
      supplier constraints. CEO Shore acknowledged expecting to crash aircraft during
      development, underscoring that incremental vehicle losses are a planned occurrence,
      not an edge case.
    claimRefs:
