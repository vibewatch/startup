  - id: financial-valuation-financing-risk
    title: Financial, Valuation & Financing Risk
    body: >-
      The April 2026 Series C raised $350M at a $1B unicorn valuation, but $150M of this was
      structured debt from Silicon Valley Bank (First Citizens), Pinegrove Venture Partners,
      Hercules Capital, and Trinity Capital — not equity. In a capital-intensive, pre-revenue
      aerospace hardware company, debt introduces covenant risk, interest obligations, and
      maturity wall exposure that equity capital does not. Hermeus has not disclosed revenue
      or ARR, and its $1B valuation implies a large implicit multiple on government contract
      milestone payments only. Critical analysts note the valuation is "on paper" and depends
      entirely on delivery: "if Quarterhorse delivers before procurement patience shifts back
      to Lockheed or Northrop." Total capital raised exceeds $500M since 2018, yet no
      production facility exists and CEO Shore confirmed the next capital raise must fund
      manufacturing buildout — a further dilution and execution risk. The combination of
      $150M in debt obligations, no disclosed commercial revenue, extreme capital intensity
      of hypersonic hardware, and a leadership transition mid-program creates a compounding
      financial fragility risk. Comparable ventures in adjacent sectors — Boom Supersonic
      has been given 50-50 odds by its own customer airline CEO — illustrate the pattern
      of large raises followed by protracted execution timelines in commercial supersonic.
