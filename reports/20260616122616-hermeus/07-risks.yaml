callouts:
  - calloutType: risk
    title: "TBCC Flight Demo Is the Critical Near-Term Thesis Test"
    body: >-
      The single most binary risk for Hermeus is whether the Chimera II TBCC engine
      successfully completes an in-flight mode transition from turbojet to ramjet on
      Quarterhorse Mk 3. This milestone — expected to be attempted in 2026–2027 — has
      no in-flight precedent at this scale for a runway-launched vehicle. Failure would
      require program restructuring at best or constitute a thesis-break at worst,
      as Darkhorse operational viability and the entire Mach 5+ roadmap depends on it.
    claimRefs:
      - CR001
      - CR002
      - CR003

  - calloutType: recommendation
    title: "Track Three Kill Criteria at Each Quarterly Program Review"
    body: >-
      Investors should monitor three monitorable triggers at each program review:
      (1) Quarterhorse Mk 3 TBCC in-flight mode-transition result; (2) DoD hypersonic
      budget trajectory in NDAA markups vs. the FY2026 43% cut baseline; and
      (3) DIU contract renewal or successor contract award by H1 2027. If any two of
      three deteriorate simultaneously, the investment thesis should be re-evaluated
      regardless of technical progress on other fronts.
    claimRefs:
      - CR001
      - CR009
      - CR011

  - calloutType: assumption
    title: "Commercial Pathway Assumed Post-2030 and Dependent on FAA Rulemaking"
    body: >-
      This chapter assumes the Halcyon commercial aircraft program represents a post-2030
      revenue opportunity contingent on FAA noise certification standards (projected 2027)
      and Senate passage of H.R. 3410. All near-term financial risk analysis treats
      Hermeus as a defense-only company; any Halcyon valuation uplift is excluded as
      an unproven future optionality item.
    claimRefs:
      - CR018
      - CR019
      - CR023

