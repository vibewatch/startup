  - id: manufacturing-talent-execution-risk
    title: Manufacturing, Talent & Execution Risk
    body: >-
      Hermeus lacks a dedicated production facility as of mid-2026; CEO Shore explicitly
      stated that building one will be the focus of a future capital raise, meaning the
      stated target of 12–15 aircraft per year remains aspirational and dependent on a round
      not yet funded. The June 1, 2026 CEO transition from founding CEO AJ Piplica to newly
      appointed CEO Zach Shore introduces key-person risk at the most critical inflection
      point — between prototype validation and production scale. Piplica moves to Executive
      Chairman but operational leadership now rests with Shore, whose tenure in the role is
      measured in days. Hermeus employs approximately 275–299 people with over 100 open
      positions, signaling aggressive hiring pressure in a talent market constrained by ITAR's
      US-person requirement, which excludes the majority of the global aerospace engineering
      workforce. The corporate headquarters relocation from Atlanta, Georgia to El Segundo,
      California, announced April 2026, risks attrition among Atlanta-based staff who may
      not relocate. NDIA documented the US hypersonic engineering talent shortage as a
      national-level strategic vulnerability, with most specialists concentrated at defense
      primes offering higher total compensation and greater job security than a startup.
      Hermeus' rapid iterative hardware approach ("build and test" at approximately one
      aircraft per year) compresses development timelines, but also compresses time to
      resolve materials and manufacturing process failures before program milestones — each
      vehicle loss extends schedule and burns capital. Supply chain fragility for
      hypersonic-grade materials (advanced composites, carbon-carbon, high-temperature
      alloys) is documented by both NDIA and the Atlantic Council as a US national risk,
      with most suppliers geared for low-rate production only.
