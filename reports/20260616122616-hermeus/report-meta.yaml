companyProfile:
  summary: >
    Hermeus is a 2018-founded defense aviation startup that has built unusual technical and customer credibility
    for its stage. The company has progressed from early AFWERX work to a $219 million DIU-linked high-Mach
    flight program involving the U.S. Air Force and Navy, while its Quarterhorse Mk 2.1 became the first
    privately funded unmanned aircraft publicly known to break the sound barrier in active flight testing.
    Hermeus' strategic logic is to use rapid hardware iteration, turbine-based combined-cycle propulsion, and
    autonomy to create reusable high-speed military aircraft, with commercial passenger transport as a distant
    optionality rather than the near-term business case.
  foundedDate: "2018-01-01"
  founders:
    - name: "AJ Piplica"
      role: "Co-founder; Executive Chairman"
      background: >
        Former Generation Orbit CEO who previously led development of the U.S. Air Force X-60A hypersonic
        X-plane program before founding Hermeus.
      claimRefs: ["CO002", "CO006", "CO007"]
    - name: "Skyler Shuford"
      role: "Co-founder; board observer"
      background: >
        Public company-overview sources identify Shuford as part of the original founding team and still linked
        to governance as an observer despite later launching a separate defense startup.
      claimRefs: ["CO002"]
  foundingLocation: "Atlanta, Georgia"
  headquarters: "El Segundo, California"
  productSummary: >
    Hermeus is building a reusable high-speed aircraft stack rather than a single demonstrator: the Quarterhorse
    flight-test family, the Chimera TBCC propulsion program, and the longer-term Darkhorse autonomous platform
    for ISR, strike, and payload-release missions.
  customerFocus: >
    Current customer focus is U.S. defense: DIU, Air Force, Navy, AFRL, and adjacent mission owners seeking
    high-Mach unmanned aircraft and hypersonic testing / payload-release capability.
  businessModel: >
    Near-term monetization comes from government R&D, prototype, and flight-test contracts plus follow-on
    defense program transition work; the long-term thesis is production and operation of reusable military
    high-speed aircraft, with civilian hypersonic transport as a distant adjacency.
  stage: "Series C"
  fundingStatus: >
    Closed a $350 million Series C in April 2026 at a $1 billion post-money valuation, structured as $200
    million of equity plus $150 million of venture debt, and publicly states total capital raised now exceeds
    $500 million.
  disclosureProfile: "private-undisclosed"
  claimRefs: ["CO001", "CO003", "CO004", "CO005", "CO010", "CO012", "CO016", "CO021", "CO026", "CV017"]
summary:
  headline: >
    Hermeus has real proof of life—Mach 1.21 flight, a $219 million DIU-backed defense pathway, and a blue-chip
    investor set—but it is still pre-production, economically opaque, and dependent on difficult Mach 3 /
    payload-release and acquisition-transition milestones, so the prudent stance is research-more rather than buy.
