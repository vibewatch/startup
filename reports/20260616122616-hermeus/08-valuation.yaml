  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "revenue and burn rate"
      missingEvidence: "Hermeus quarterly burn rate, revenue breakdown (milestone payments vs. grants), and net cash position"
      whyItMatters: "Without burn rate, the $350M runway is uncalibrated; a >$30M/quarter burn implies 24–30 month runway, and a financing gap risk materializes before Mach 3 if burn is higher"
      diligencePath: "Data room access; bank statement review; financial model from company; alternatively, infer from headcount × aerospace loaded labor cost estimates"
      relatedQuestionRefs: [QV012, QV027]

    - type: private-evidence-only
      severity: blocking
      topic: "cap table and preference stack"
      missingEvidence: "Full capitalization table including preference layers, liquidation preferences, anti-dilution provisions, and debt conversion terms across six equity rounds plus $150M debt"
      whyItMatters: "At a $1B valuation with six rounds and $150M senior debt, common equity may have limited recovery in a moderate exit; critical for return modeling"
      diligencePath: "Data room: cap table summary, term sheets from each round, debt term sheets from Hercules, Trinity, Pinegrove, SVB"
      relatedQuestionRefs: [QV013, QV031]

    - type: private-evidence-only
      severity: material
      topic: "DoD contract pipeline beyond DIU"
      missingEvidence: "Specific DoD programs Hermeus is actively competing for (other than DIU), letters of intent, and backlog composition beyond the $219M DIU vehicle"
      whyItMatters: "The $1B valuation implies a future production contract pipeline; without visibility, the valuation premium is entirely option value with no contract basis"
      diligencePath: "SAM.gov solicitation review; DoD contract award databases; direct discussion with company on competitive acquisitions in progress"
      relatedQuestionRefs: [QV019, QV023, QV024]

    - type: private-evidence-only
      severity: material
      topic: "milestone payment schedule and structure"
      missingEvidence: "Whether DIU contract payments are tied to specific speed/performance gates (Mach 2, Mach 3, payload release), and the dollar amounts per milestone"
      whyItMatters: "Milestone payments directly determine runway; understanding when cash arrives vs. when it is spent determines whether a forced bridge or down-round is triggered"
      diligencePath: "DIU contract review via FOIA if necessary; direct discussion with company; data room"
      relatedQuestionRefs: [QV019, QV023]

    - type: enumeration-incomplete
      severity: material
      topic: "competitive procurement landscape"
      missingEvidence: "Full set of companies competing for the same DoD hypersonic reusable aircraft programs, including classified or IRAD-stage competitors"
      whyItMatters: "If a funded prime or better-resourced startup wins the next competitive DoD hypersonic aircraft program-of-record, Hermeus' production path is materially impaired"
      diligencePath: "ITAR-cleared competitive landscape review; classified briefings if accessible; SAM.gov solicitation monitoring"
      relatedQuestionRefs: [QV024, QV032]
      relatedTableRefs: [TV004]

    - type: missing-source
      severity: material
      topic: "Darkhorse program cost and timeline"
      missingEvidence: "Estimated development cost from current Quarterhorse phase through Darkhorse Mach 5 initial operational capability, and DoD funding availability for that program"
      whyItMatters: "The bull case requires Darkhorse to reach production; if total development cost exceeds $2B+, the current funding trajectory is insufficient and additional dilutive rounds are required"
      diligencePath: "Analogous hypersonic platform development cost data (SR-71, X-51A, ARRW cost history); direct discussion with company; DoD program budget documentation"
      relatedQuestionRefs: [QV026]

