  - id: scenario-analysis
    title: Scenario Analysis and Downside Risks
    body: >-
      The valuation is best framed through milestone-probability scenarios rather than revenue multiples,
      given the pre-revenue stage. The bull case requires Mach 3 flight in H1 2027, Darkhorse production
      contract by 2029–2030, and sustained sector re-rating—all achievable if the current technical
      trajectory holds. The base case assumes modest schedule slippage (Mach 3 by late 2027), continued
      DiU milestone payments, and a follow-on Series D at or above the current mark, with
      commercialization of Darkhorse pushed to the early 2030s. The bear case is driven by
      technology or procurement failure: if Mach 3 slips past 2028, the competitive window against
      incumbents narrows, the debt covenants become stressed, and a down-round or government program
      redirect becomes probable.

      The principal downside risks are: (1) single-customer concentration—virtually all revenue flows
      through the U.S. government, specifically the Air Force and Navy DIU channel; (2) DOGE procurement
      uncertainty—the FY2026 budget saw $11 billion+ in defense efficiency cuts, and R&D advisory
      services are a primary target; (3) CEO transition—the Zach Shore handoff from AJ Piplica coincided
      with the supersonic flight, and the new CEO's ability to maintain the development pace and government
      relationship is untested; (4) debt obligation—$150 million in venture debt creates fixed obligations
      that complicate equity financing options in a down scenario; (5) hypersonic program systemic risk—
      GAO documented that four of six DoD hypersonic programs have not adopted modern digital engineering
      practices, and HACM's design review was six months late with cost estimates exceeding baseline,
      suggesting Hermeus' pipeline customers face their own procurement headwinds.
