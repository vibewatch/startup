summary:
  headline: >
    Hermeus 已有真实进展——Mach 1.21 飞行、DIU 支撑的 $219 million 防务路径和一线投资人组合——但公司仍未量产，经济性不透明，还依赖艰难的 Mach 3 /
    载荷释放和采办转化里程碑；审慎立场应是继续研究，而不是买入。
