  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross margin
      missingEvidence: >-
        Hermeus gross margin on government OTA contracts — cost of revenue, direct manufacturing and
        materials costs, and resulting margin percentage are entirely private and have not appeared
        in any disclosed document.
      whyItMatters: >-
        Gross margin is the foundational metric for assessing whether Hermeus's government contract
        revenue model is economically sustainable at scale and whether the company can self-fund
        production-stage operations without continuous capital raises.
      diligencePath: >-
        Request management-reviewed P&L or gross-margin range in investor due diligence. Compare
        to analogous government hardware contractors (Kratos, Shield AI) at comparable development stages.
      relatedQuestionRefs:
        - QI009

    - type: private-evidence-only
      severity: material
      topic: burn rate
      missingEvidence: >-
        Monthly cash consumption, cash-on-hand balance as of June 2026, and debt service schedule
        for the $150M venture debt tranche are not publicly available.
      whyItMatters: >-
        Without confirmed burn data, the 18–42 month runway estimate has a factor-of-two uncertainty.
        The debt covenant structure could accelerate cash needs materially vs. equity-only scenarios.
      diligencePath: >-
        Request monthly bank statements or audited cash-flow statements, plus the full debt term sheet
        including interest rate, covenant thresholds, and maturity date.
      relatedQuestionRefs:
        - QI023

    - type: missing-source
      severity: material
      topic: per-unit production cost
      missingEvidence: >-
        Per-aircraft manufacturing cost for Quarterhorse Mk 2 at a 12–15 aircraft/year production rate
        has not been disclosed by Hermeus or any independent analyst. No analogous public program exists
        for direct benchmark.
      whyItMatters: >-
        Without a per-unit cost model, it is impossible to verify whether the pricing claim ("less
        expensive than a manned fighter, competitive with CCA") can be achieved and what gross margin
        would result from a production contract.
      diligencePath: >-
        Request conceptual manufacturing cost model from management. Benchmark against Kratos XQ-58
        (target ~$3M per unit) and General Atomics MQ-9 (~$10M). Note: production facility does not yet
        exist, so any estimate would be pre-industrialization.
      relatedQuestionRefs:
        - QI026

    - type: private-evidence-only
      severity: material
      topic: revenue model comparison
      missingEvidence: >-
        Hermeus's government contract win rate, proposal volume, and revenue-per-contract compared to
        peers such as Anduril (which has disclosed some contract data) and Kratos (public company with
        reported financials) are not available.
      whyItMatters: >-
        Understanding how Hermeus's contract-win economics compare to its nearest public peers would
        validate or question the sustainability of the government-only revenue model as a long-term
        business.
      diligencePath: >-
        Compare against Kratos 10-K (government contract revenues, gross margins ~25%) and Anduril
        disclosed contract wins. Request Hermeus proposal pipeline and BD conversion rate.
      relatedQuestionRefs:
        - QI024

    - type: private-evidence-only
      severity: material
      topic: capital adequacy — next-round trigger
      missingEvidence: >-
        Hermeus has not disclosed specific next-round trigger milestones, minimum cash thresholds that
        would initiate fundraising, or any planned capital event for manufacturing facility acquisition.
      whyItMatters: >-
        Shore explicitly said manufacturing facilities would require a future capital raise. Without
        knowing when and at what scale, investors cannot assess dilution risk or evaluate whether
        the existing $350M raise covers the company through a contract-to-production transition.
      diligencePath: >-
        Request internal capital planning model and board-approved trigger thresholds for next fundraising.
        Model out manufacturing facility capex based on comparable aerospace production facilities
        (e.g., Kratos Mojave facility, Northrop Spirit Aerosystems RUAG-equivalent).
      relatedQuestionRefs:
        - QI023

