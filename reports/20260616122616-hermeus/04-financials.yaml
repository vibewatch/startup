callouts:
  - calloutType: risk
    title: Debt Overhang Risk — $150M Structured Debt with Undisclosed Covenants
    body: >-
      The $150M venture debt tranche in the Series C is a notable structural risk for a hardware startup at
      Hermeus's development stage. Unlike equity, debt carries covenant obligations and a fixed repayment
      schedule. If the Quarterhorse Mk 2.2 and 2.3 flight-test campaigns encounter significant delays—a
      normal risk in aerospace development—the company may face debt service pressure before securing
      production contracts. Covenant terms, maturity dates, and interest rates have not been disclosed.
      Investors should treat this debt as a material gating risk item requiring full term-sheet review.
    claimRefs:
      - CI026
      - CI032

  - calloutType: risk
    title: Single-Customer Concentration — 100% Revenue from U.S. Government
    body: >-
      All of Hermeus's revenue sources are U.S. government RDT&E contracts, with no commercial customers,
      no allied-nation contracts, and no civil aviation revenue. This creates two concentration risks: (1)
      U.S. hypersonic RDT&E budget volatility—DoD's request dropped 43% from FY2025 to FY2026—could reduce
      future contract flow, and (2) any political or procurement-cycle disruption could halt cash inflows
      with no commercial backstop. The absence of a program of record means every post-2027 revenue dollar
      depends on procurement decisions not yet made.
    claimRefs:
      - CI015
      - CI043
      - CI044

  - calloutType: insight
    title: Debt-Financed Capex Strategy — Deliberate and Sector-Appropriate
    body: >-
      CEO Piplica's explicit use of $150M venture debt to finance manufacturing capacity rather than
      diluting equity is consistent with best practice for capital-intensive hardware startups. The
      participation of Hercules Capital and Trinity Capital (established venture lenders familiar with
      hardware balance sheets) and Silicon Valley Bank (large tech lender) suggests the debt structure
      was professionally underwritten. This reduces equity dilution at a stage where valuation is rising,
      but creates the covenant and repayment obligations noted in the risk callout above.
    claimRefs:
      - CI026
      - CI031
      - CI006

