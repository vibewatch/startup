evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Hermeus has not disclosed revenue run rate, ARR, gross margin, burn rate, or cash runway as a private company.
      Only government contract ceiling obligations are publicly available.
    whyItMatters: >-
      Without revenue and burn metrics, it is impossible to assess capital efficiency, runway duration from the $350M
      Series C, or whether the $219M DIU contract represents a meaningful share of operating budget.
