  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Darkhorse-specifications
      missingEvidence: >-
        Published performance specifications (Mach number ceiling, payload capacity, range, endurance),
        TRL, development timeline, and funding plan for the Darkhorse platform.
      whyItMatters: >-
        Darkhorse is the company's primary commercial product for defense customers; without disclosed specs
        or a funded development plan, the program's strategic value is unquantifiable and acquisition timing
        is speculative.
      diligencePath: >-
        Request program fact sheet and TRL assessment from Hermeus under NDA; obtain contract vehicle details
        from DoD/AFRL/DARPA program offices; review any Congressional testimony referencing Darkhorse.
      relatedQuestionRefs: [QE011]

    - type: missing-source
      severity: material
      topic: TBCC-in-flight-transition
      missingEvidence: >-
        In-flight data from any Hermeus vehicle demonstrating turbojet-to-ramjet mode transition, including
        inlet behavior, turbine temperature profiles, and combustion stability during transition.
      whyItMatters: >-
        The in-flight TBCC transition is the most critical undemonstrated technical milestone; without empirical
        in-flight evidence, performance claims for Mk3 and Darkhorse remain aspirational and the engineering
        risk of the overall program is difficult to bound.
      diligencePath: >-
        Monitor Quarterhorse Mk3 flight test results when published; obtain post-flight data reports from
        Hermeus or DoD under appropriate clearance; review technical papers from HEAT facility tests.

    - type: private-evidence-only
      severity: material
      topic: autonomy-avionics-architecture
      missingEvidence: >-
        Technical specifications, architecture documentation, or independent validation of the GNC/autonomy
        stack, including sensor suite, control laws, failure modes, and payload-release sequencing logic.
