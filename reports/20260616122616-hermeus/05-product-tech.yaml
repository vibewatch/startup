      sourceRefs: [SE019, SE020, SE029]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE006, QE025]

    - id: CE007
      statement: >-
        The FAA granted Hermeus a Special Airworthiness Certificate in the Experimental Category (SAC-EC) for Quarterhorse Mk2.1
        on March 12, 2026, following a year-long collaboration and rigorous aircraft inspection; flight testing was authorized
        at Spaceport America within White Sands Missile Range airspace.
