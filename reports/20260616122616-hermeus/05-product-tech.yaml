  - id: autonomy-and-manufacturing
    title: Autonomy Stack and Manufacturing Infrastructure
    body: >-
      All Quarterhorse aircraft operate as unmanned systems piloted remotely from Hermeus's dedicated
      ground "flight deck." At supersonic and hypersonic speeds, aerodynamic response times fall below
      human-reflex thresholds, requiring an onboard autonomy and guidance, navigation, and control (GNC)
      stack to process real-time sensor data and execute control inputs. Hermeus's autonomy architecture
      supports unmanned operation across the full speed envelope and is a prerequisite for the autonomous
      payload-release capability contracted under the DIU extension. The company does not maintain a public
      software repository, and no open-source developer-facing platform exists; practitioner-community
      visibility comes through engineering talks, recruiting signals, and defense analyst publications. The
      primary manufacturing site is a 110,000 sq ft factory in Atlanta, Georgia, used for aircraft assembly,
      light manufacturing, and subsystem testing — including avionics and structures testing in-house.
      Hermeus also operates a propulsion test facility at Dekalb-Peachtree Airport (PDK), approximately
      nine minutes from the factory. In April 2026, following the $350M Series C, Hermeus relocated its
      corporate headquarters from Atlanta to El Segundo, California, while retaining Atlanta as the
      manufacturing base. CEO Zach Shore (who succeeded AJ Piplica as CEO; Piplica remains Executive
      Chairman) stated that the company could build 12–15 aircraft per year at initial scale with present
      facilities. Production manufacturing capability remains nascent; the Series C's planned use-of-funds
      includes scaling manufacturing for the next phase of DoD deliveries.
