      topic: FAA-certification
      sourceRefs: [SE009, SE027, SE034]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE007]

    - id: CE008
      statement: >-
        The primary technical risk of the TBCC program is the undemonstrated in-flight mode transition: no commercially
        developed TBCC has completed a clean turbojet-to-ramjet transition in flight at relevant Mach numbers, with
        engineering risks centering on variable-inlet shock management, turbine blade thermal protection, and closed-loop
        mode-switching control.
      type: inferred
      topic: TBCC-risks
      sourceRefs: [SE030, SE031, SE028]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE008]

    - id: CE009
      statement: >-
        Hermeus's autonomy stack enables Quarterhorse to fly unmanned from a dedicated remote ground control flight deck,
        processing real-time sensor data for guidance, navigation, and control at supersonic speeds where direct
        human-reflex remote piloting is impractical.
