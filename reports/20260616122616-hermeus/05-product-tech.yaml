  claims:
    - id: CE001
      statement: >-
        The Hermeus Quarterhorse program comprises five distinct prototype types: Mk0 (non-flying Ironbird subsystem testbed),
        Mk1 (J85-powered subsonic demonstrator), Mk2 series (F100-powered supersonic series, three sub-variants),
        Mk3 (Chimera TBCC hypersonic demonstrator), and Darkhorse (planned Mach 5+ operational UAS).
      type: company-claimed
      topic: product-roadmap
      sourceRefs: [SE001, SE007, SE029]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE001]

    - id: CE002
      statement: >-
        Quarterhorse Mk2.1 achieved Mach 1.21 on its third test flight on May 26, 2026, over White Sands Missile Range,
        becoming the first privately developed unmanned aircraft to fly supersonic.
      type: observed
      topic: flight-test-milestone
      sourceRefs: [SE003, SE014, SE018]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE002, QE010]

    - id: CE003
      statement: >-
        Hermeus demonstrated turbojet-to-ramjet mode transition in ground tests of the Chimera engine in November 2022,
        but as of June 2026 no in-flight TBCC mode transition has been demonstrated by any Hermeus vehicle.
      type: observed
      topic: TBCC-transition
      sourceRefs: [SE007, SE029, SE031]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE003]

    - id: CE004
      statement: >-
        The Chimera precooler is a heat exchanger mounted in the F100 air intake that lowers stagnation temperature of incoming air,
        extending the turbine engine's effective speed ceiling from approximately Mach 1.5 to Mach 2.5+.
      type: company-claimed
      topic: Chimera-precooler
      sourceRefs: [SE002, SE005, SE023]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE004]

    - id: CE005
      statement: >-
        Quarterhorse Mk3, designed to carry the full Chimera II TBCC engine, was targeted for first flight in 2026 and aims to
        attempt the SR-71 Blackbird's air-breathing speed record of Mach 3.32 set in 1976.
      type: company-claimed
      topic: Mk3-roadmap
      sourceRefs: [SE017, SE029, SE032]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE005]

    - id: CE006
      statement: >-
        Hermeus opened the High Enthalpy Air-Breathing Test Facility (HEAT) at Cecil Airport, Jacksonville, Florida,
        in January 2025; Phase 1 was completed in approximately three months, at roughly one-eighth the schedule
        and one-tenth the cost of comparable new-build engine test cells.
