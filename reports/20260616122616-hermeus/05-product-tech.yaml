figures:
  - id: FE001
    title: Chimera TBCC Propulsion Architecture Stack
    type: stack
    layout: standard
    summary: Seven-layer architecture of the Chimera turbine-based combined-cycle engine from turbofan core to vehicle airframe.
    data:
      layers:
        - id: turbofan-core
          label: "Turbine Core — Pratt & Whitney F100"
          detail: "Commercial COTS turbofan; >30M flight hours; provides subsonic and low-supersonic thrust (takeoff through Mach ~1.5); eliminates custom engine development cost"
        - id: precooler
          label: "Hermeus Proprietary Precooler"
          detail: "Heat exchanger on F100 intake; lowers stagnation temperature of incoming air; extends turbine ceiling from Mach ~1.5 to Mach 2.5+; key TBCC enabler; ground-tested with F100 (2024)"
        - id: variable-inlet
          label: "Variable Geometry Inlet"
          detail: "Controls internal shock structure and airflow distribution; delivers conditioned airflow to turbine in low-speed mode and routes flow to ramjet in transition; precision machined"
        - id: bypass-isolator
          label: "Bypass Duct / Isolator"
          detail: "Routes high-Mach airflow around turbine core at transition (~Mach 2.8+); protects rotating turbine blades from inlet stagnation temperatures; thermally isolated passage"
        - id: ramjet-combustor
          label: "Ramjet Combustor Stage"
          detail: "Air-breathing combustor for hypersonic propulsion (Mach 3–5+); not yet flight-tested; ground-demonstrated in Chimera test campaign (2022); Chimera II targets Mach 5+"
        - id: gnc-autonomy
          label: "GNC / Autonomy Stack"
          detail: "Real-time guidance, navigation, and control; supports unmanned remote operation and future autonomous payload release; interfaces with secure ground control flight deck"
        - id: airframe-tps
          label: "Delta-Wing Airframe + Thermal Protection System"
          detail: "Supersonic/hypersonic airframe with delta-wing configuration; variable geometry; leading-edge and surface thermal protection for Mach 3+ sustained flight; F-16 scale on Mk2"
    approximationNotes: "Layer order reflects airflow path, not physical stacking. TRL values not shown; Chimera ramjet stage is estimated TRL <5 for in-flight readiness as of June 2026."
    claimRefs:
      - CE004
      - CE016
      - CE022
      - CE034

  - id: FE002
    title: Quarterhorse Mission Operating Flow
    type: flow
    layout: standard
    summary: End-to-end operational flow from DoD mission tasking through runway launch, speed envelope expansion, and vehicle recovery.
    data:
      nodes:
        - id: tasking
          label: "1. Mission Tasking (DoD / DIU)"
          detail: "Test objective defined by DoD/DIU partners; flight authorization obtained from FAA/WSMR"
        - id: preflight
          label: "2. Ground Pre-Flight & Systems Check"
          detail: "Hermeus flight deck (El Segundo/Spaceport America); avionics, fuel, engine, autonomy stack verification"
        - id: launch
          label: "3. Runway Launch (Spaceport America)"
          detail: "Autonomous runway takeoff in turbine mode; remote supervision from flight deck; standard airfield infrastructure"
        - id: subsonic-climb
          label: "4. Subsonic Climb and Systems Checkout"
          detail: "Turbine mode (F100 + precooler active); GNC validates stability and control; data telemetered to flight deck"
        - id: supersonic-accel
          label: "5. Supersonic Acceleration (Turbine + Precooler, Mach 1–2.5)"
          detail: "Precooler cools inlet stagnation air; turbine operates above standard ceiling; demonstrated to Mach 1.21 on Mk2.1"
        - id: tbcc-transition
          label: "6. TBCC Mode Transition (~Mach 2.8) [MK3 / FUTURE]"
          detail: "Variable inlet adjusts shock; bypass duct opens; airflow routed around turbine to ramjet combustor; critical undemonstrated step"
        - id: hypersonic-cruise
          label: "7. Hypersonic Cruise — Ramjet Mode (Mach 3–5+) [FUTURE]"
          detail: "Ramjet combustor provides propulsion; turbine core bypassed; Mk3 targets Mach 3.32+ (SR-71 record); Darkhorse targets Mach 5+"
        - id: payload-release
          label: "8. Autonomous Payload Release [DIU CONTRACT SCOPE]"
          detail: "GNC/autonomy stack executes payload separation at speed; undemonstrated as of Jun 2026; primary deliverable of $219M DIU contract"
        - id: descent
          label: "9. Controlled Descent and Return"
          detail: "Deceleration; turbine re-engagement (reverse TBCC transition); approach to recovery airfield"
        - id: recovery
          label: "10. Runway Landing and Vehicle Recovery"
          detail: "Autonomous runway landing; vehicle inspected and refurbished for next flight; reusability is key program differentiator"
    approximationNotes: "Steps 6–8 represent future planned capabilities not yet demonstrated in flight. Step 9 TBCC reverse transition assumes engine restart capability not yet validated."
