chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Hermeus is executing a staged rapid-prototyping roadmap toward reusable hypersonic flight anchored on its
    Chimera turbine-based combined-cycle (TBCC) engine. As of June 2026 the Quarterhorse Mk 2.1 has achieved
    Mach 1.21 — the first supersonic flight by a privately developed unmanned aircraft — with Mk 2.2/2.3
    targeting Mach 1.6 and Mach 3 by summer 2026 and H1 2027 respectively. The HEAT ground test facility in
    Jacksonville (online January 2025) underpins engine-level validation, while the $219M DIU contract
    extension tasks the program with demonstrating autonomous payload release at speed. Critical technical
    risks center on the undemonstrated in-flight TBCC mode transition and the absence of any DoD program-of-record
    acquisition path.

sections:
  - id: aircraft-platforms
    title: Aircraft Platforms — Quarterhorse, Darkhorse, and Halcyon
    body: >-
      Hermeus structures its product portfolio as a linked ladder of prototypes, each designed to retire a
      specific technical risk before the next level is attempted. The Quarterhorse Mk 0, a non-flying
      "Ironbird" testbed, validated avionics, fuel, hydraulic, and structural subsystems in a ground
      environment before any aircraft flew. Quarterhorse Mk 1 — powered by a GE J85 engine — made its
      maiden flight on May 21, 2025 at Edwards Air Force Base, roughly 18 months from design start in Q4
      2023, validating high-speed takeoff and landing aerodynamics. Mk 1 is approximately one-third the
      size and one-quarter the weight of the Mk 2 series. Quarterhorse Mk 2.1, approximately the size of
      an F-16 and powered by a Pratt & Whitney F100 engine fitted with a proprietary precooler, flew its
      maiden flight at Spaceport America in February 2026 and reached Mach 1.21 on May 26, 2026 — becoming
      the first privately developed unmanned aircraft to fly supersonic in the United States. The company is
      currently building Mk 2.2 (targeting the world's fastest unmanned aircraft speed record) and Mk 2.3
      (targeting Mach 3 in the first half of 2027). Quarterhorse Mk 3 will be the first airframe to
      integrate the complete Chimera II TBCC engine and is targeted to attempt the SR-71 Blackbird's
      air-breathing speed record of Mach 3.32, set in 1976. Looking further out, Darkhorse is Hermeus's
      planned operational Mach 5+ multi-mission hypersonic UAS for defense and national security, with an
      end-of-decade deployment target. The Halcyon remains a conceptual commercial passenger concept
      targeting Mach 5 on 125+ transatlantic routes, with no funded development timeline as of June 2026.
