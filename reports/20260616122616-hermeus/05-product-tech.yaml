      diligencePath: >-
        Request software architecture review and ground-in-the-loop simulation data under NDA; review any
        defense certification test reports filed with USAF or DIU.

    - type: missing-source
      severity: minor
      topic: developer-practitioner-community
      missingEvidence: >-
