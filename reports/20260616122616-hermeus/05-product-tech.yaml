    - id: CE023
      statement: >-
        Engineering skeptics in the hypersonic community point to three unresolved TBCC challenges: (1) variable-inlet
        shock management to prevent unstart during transition, (2) thermal protection of rotating turbine blades at
        inlet stagnation temperatures above design limits, and (3) reliable closed-loop mode-switching at varying
