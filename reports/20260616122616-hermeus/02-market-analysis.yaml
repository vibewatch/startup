  - id: market-sizing
    title: Market Sizing — Multiple Lenses from Defense Budget and Analyst Reports
    body: >
      No single published estimate cleanly captures Hermeus's serviceable market because the company
      occupies a novel niche that straddles hypersonic test infrastructure, uncrewed combat aircraft,
      and advanced propulsion. Five distinct sizing lenses are applied here; they should not be summed.

      The broadest lens is the global hypersonic technology market (covering missiles, glide vehicles,
      spaceplanes, and aircraft): The Business Research Company (TBRC) estimated this at $8.46B in
      2025, growing to $9.46B in 2026 at an 11.8% CAGR. A wider scope lens—the global hypersonic
      flight market (aircraft and spacecraft combined)—was estimated at $11.43B in 2025 and projected
      at $14.46B in 2026 by Precedence Research (CAGR 26.51%). These two estimates diverge sharply
      because Precedence Research applies a broader methodology that includes commercial and government
      spacecraft, whereas TBRC focuses on weapons-grade hypersonic systems. The narrowest aircraft-only
      lens from Stratistics MRC places the hypersonic aircraft market at approximately $1.6B in 2026.

      From a defense budget lens, the Congressional Research Service's August 2025 update confirmed
      the Pentagon's FY2026 budget request for hypersonic research was $3.9B—down from $6.9B in
      FY2025—reflecting cuts and portfolio consolidation. The broader DoD FY2026 budget for unmanned
      and remotely operated aerial vehicles was $9.4B (across all services), and the total autonomy and
      autonomous systems line was $13.4B. The Air Force CCA program specifically received $789.4M in
      FY2026 RDT&E (contingent on the reconciliation bill; only $111M without it), with procurement
      beginning in FY2027 at $996.5M for approximately 30 first-lot airframes.

      Hermeus's government-confirmed SAM floor is derived from its actual contracted pipeline: the
      $219M total DIU/HyCAT contract ceiling (through 2027), the prior $60M AFWERX follow-on, and
      participating subcontract value within the $1.45B Kratos-led MACH-TB program. Total verifiable
      DoD awards to Hermeus through mid-2026 exceed $280M. This is a floor, not a ceiling: transition
      to a CCA production program or a standalone high-mach strike platform would represent a step
      change in revenue potential, but that transition has not yet occurred and carries adoption risk.

      The global supersonic jet market (predominantly military supersonic fighters; commercial supersonic
      is not yet operational) was $29.5B in 2025 and projected at $31.4B in 2026 at a 4.8% CAGR per
      Fortune Business Insights. Hermeus does not compete in this market today—its Quarterhorse is
      supersonic but uncrewed and in prototype status—but it illustrates the long-run category potential
      if the company successfully scales to operational uncrewed high-mach aircraft.

      Analyst estimates are contradictory and should be treated with caution: the $1.6B hypersonic-
      aircraft-only estimate and the $14.46B hypersonic flight market estimate differ by nearly 9×,
      reflecting methodological scope rather than measurement error. Investors and decision-makers
      should anchor on verified DoD budget lines and contract data rather than secondary market reports.
