  - id: buyers-procurement-constraints
    title: Buyers, Procurement Pathways, Growth Drivers, and Adoption Constraints
    body: >
      The primary buyer for Hermeus's current product is the U.S. federal government through the
      Department of Defense. Budget ownership is bifurcated: the Defense Innovation Unit (DIU) owns
      HyCAT and other OTA prototype contracts and reports directly to the Office of the Secretary
      of Defense; AFWERX is the Air Force's innovation arm funded through RDT&E and SBIR/STTR accounts.
      The Air Force Life Cycle Management Center (AFLCMC) and Air Force Futures own the CCA program
      budget. The Navy is participating in Hermeus's expanded DIU contract as a co-funding partner,
      with NAVAIR as the technical counterpart. DIU Military Deputy Maj. Gen. Joseph Kunkel has been
      the most vocal public advocate for Hermeus's Quarterhorse, publicly calling for mass production
      as a "game-changing warfighting capability."

      Procurement follows a three-stage DoD pathway. Stage one is prototype via OTA or AFWERX/SBIR
      (where Hermeus currently sits). Stage two would be Middle Tier Acquisition (MTA), a faster
      pathway enabling rapid prototyping and fielding within five years. Stage three is a full
      program of record with approved requirements and long-term funding. As of the August 2025 CRS
      report, the DoD had not established any programs of record for hypersonic weapons or aircraft.
      The House Armed Services Committee's FY2027 NDAA draft called for a DoD transition plan to
      be submitted by March 2027, signaling congressional intent to force a decision.

      Growth drivers are compelling. China and Russia have likely fielded operational hypersonic glide
      vehicles per the CRS, creating urgency that drives DoD procurement appetite. The DoD named
      "scaled hypersonics" as one of six critical technology imperatives. The FY2026 Pentagon R&D
      budget of $179B is the largest in Pentagon history. The HyCAT program creates recurring
      demand for commercial hypersonic test services independent of weapons programs. Hermeus's
      TBCC Chimera engine (turbine-to-ramjet transition demonstrated November 2022) is a unique
      propulsion capability; DARPA's High Mach Gas Turbine (HMGT) program launched in late 2025
      with $10M+ to mature competing TBCC architectures, validating the technology class.

      Adoption constraints are substantial. The absence of any program of record means Hermeus
      depends entirely on prototype OTA contracts that can be modified or curtailed without a long
      acquisition baseline. The GAO July 2024 report found cost and schedule overruns across DoD
      hypersonic programs, with HACM behind schedule and cost baseline significantly exceeded.
      Test range capacity is a critical bottleneck: Hermeus CEO AJ Piplica stated in January 2025
      that hypersonic test facilities are "booked up for over a year" with prohibitively expensive
      costs—one reason Hermeus built the HEAT facility in Jacksonville, Florida. ITAR and USML
      controls effectively limit the customer base to the U.S. government and approved FMS partners.
      Capital intensity is high: Hermeus has no dedicated manufacturing facility yet (Shore has
      indicated production buildout will require a future capital raise), and initial production
      capacity is estimated at 12–15 aircraft per year. The Atlantic Council's October 2025
      task force report found DoD services historically defund weapons programs to cover cost
      overruns on platform programs—a structural risk for Hermeus that is unresolved.
