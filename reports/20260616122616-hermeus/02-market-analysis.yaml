callouts:
  - calloutType: risk
    title: "No Program of Record — All Revenue Is Prototype-Stage"
    body: >
      As of the August 2025 CRS report, the DoD has not established any programs of record for hypersonic weapons or aircraft. Every dollar of Hermeus's current government revenue comes from OTA prototype contracts that can be modified, extended, or curtailed without the acquisition baseline protections of a formal program. The HASC FY2027 NDAA draft requires DoD to submit a hypersonic technology transition strategy by March 2027, creating a near-term forcing function — but also confirming that the transition has not yet occurred. This is the single most material market risk for Hermeus's near-term revenue durability.
    claimRefs:
      - CM033
      - CM039
  - calloutType: insight
    title: "$219M DIU Contract Is Among the Largest Ever Awarded by DIU"
    body: >
      The May 2026 DIU contract modification brought Hermeus's total DIU contract ceiling to $219M — described by reporting as one of the largest awards in DIU's history. Combined with the prior $60M AFWERX follow-on and participation in the $1.45B MACH-TB program, Hermeus has secured verifiable DoD contract exposure exceeding $280M. DIU Military Deputy Maj. Gen. Kunkel has explicitly called for mass production as a warfighting capability, signaling strong near-term institutional support from the office managing the contract.
    claimRefs:
      - CM017
      - CM023
  - calloutType: assumption
    title: "Commercial Supersonic Adjacency Is Long-Term, Not Near-Term"
    body: >
      Hermeus's founding vision included commercial hypersonic air travel, and its AFWERX presidential airlift contract signals future Air Force interest in that application. However, the company has explicitly deprioritized commercial aviation in favor of defense. The global commercial supersonic market (led by Boom Overture, targeting service entry 2029–2030) is projected at roughly $31B in 2026 — but this is almost entirely manned military supersonic fighters. A genuine commercial hypersonic addressable market for Hermeus is a post-2030 assumption that depends on successful hypersonic aircraft certification and regulatory approval of supersonic overland flight.
    claimRefs:
      - CM003
      - CM005
      - CM026

