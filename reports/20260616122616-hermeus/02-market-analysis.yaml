chapter:
  number: 2
  title: Market Analysis
  summary: >
    Hermeus's primary addressable market is U.S. Department of Defense demand for high-mach uncrewed aircraft in ISR, strike, and hypersonic testing roles, anchored by OTA prototype contracts through DIU and AFWERX. The broader global hypersonic technology market is estimated at $9.5–$14.5B in 2026 across conflicting analyst methodologies, while the DoD's dedicated hypersonic R&D budget for FY2026 stands at $3.9B per the Congressional Research Service. Near-term market capture is bounded by the absence of any DoD program of record for hypersonic aircraft, technology maturity constraints, scarce test range capacity, and the CCA program trajectory ($789M FY2026 RDT&E), but growth drivers including geopolitical urgency, a record $179B Pentagon R&D budget, and Hermeus's $219M DIU contract create a credible near-term pathway.

sections:
  - id: market-boundary
    title: Market Boundary and Landscape
    body: >
      Hermeus sits at the intersection of three concentric demand zones. The core near-term market is
      U.S. DoD demand for high-mach uncrewed aircraft platforms—prototypes, test vehicles, and early
      operational systems—procured through Other Transaction Authority (OTA) vehicles managed by the
      Defense Innovation Unit (DIU) and the Air Force innovation arm AFWERX. This includes the HyCAT
      (Hypersonic and High-Cadence Airborne Testing Capabilities) program, the MACH-TB (Multi-Service
      Advanced Capabilities Hypersonic Testbed) program, and direct AFWERX contract pathways for
      Presidential and Executive Airlift studies. A broader adjacent ring includes the Air Force's
      Collaborative Combat Aircraft (CCA) program, which the Quarterhorse has been explicitly positioned
      to compete against for near-term procurement as an affordable high-speed uncrewed wingman.
      The outermost ring—long-term commercial supersonic and hypersonic point-to-point air transport
      (e.g., Boom Overture at Mach 1.7, commercial entry targeted 2029–2030)—is a strategic adjacency
      Hermeus has not abandoned but has deprioritized in favor of its defense-first pivot.

      Status-quo substitutes for Hermeus's target mission sets include the F-15E Strike Eagle
      (newest variants ~$100M, manned, limited by pilot survivability), the MQ-9 Reaper (subsonic ISR
      and strike, widely deployed but inherently slow), and concept-stage alternatives like the
      Collaborative Combat Aircraft (Anduril YFQ-44A and General Atomics YFQ-42A, both subsonic-to-
      low supersonic). No operationally fielded aircraft in the U.S. inventory today can sustain flight
      above Mach 3, let alone Mach 5. The SR-71 Blackbird retired in 1998; its air speed record of
      Mach 3.3 still stands. Hermeus's Quarterhorse is targeting Mach 3 by 2027—directly in the
      capability gap between subsonic CCAs and the SR-71 speed regime.

      Export markets are tightly constrained by ITAR and the U.S. Munitions List (USML), which classifies
      hypersonic aircraft and all associated technical data as defense articles. All technology transfers
      require DDTC licensing. The Netherlands' April 2026 commitment to fund two CCA Increment 1
      aircraft shows allied appetite exists but confirms sales are government-to-government only,
      channeled through FMS or specific exemptions rather than direct commercial export.
