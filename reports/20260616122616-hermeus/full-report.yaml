              - CP037
              - CP027
          - type: callout
            title: DIU Validation Anchors Near-Term Defense Revenue
            body: >-
              The $219M DIU contract, up from $23M in 2023, plus explicit Air Force and Navy partnership in the most
              recent award, gives Hermeus a credible short-to-medium defense revenue path while hypersonic development
              continues. DIU Major General Kunkel publicly stated that a mass-produced Quarterhorse could be
              "game-changing" as a weapon. This validation is not available to Destinus (limited U.S. access), Venus
              Aerospace (propulsion-only), or Boom (commercial-only).
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
          - type: callout
            title: Expendable Missiles Dominate Near-Term Hypersonic Budget
            body: >-
              Of the $3.9B+ DoD FY2026 hypersonic allocation, the majority flows to expendable missiles (ARRW, HACM,
              Dark Eagle) that solve kinetic strike without reusability. A reusable Mach 3+ vehicle's ROI case must be
              made on ISR persistence, mission flexibility, and per-sortie cost over a fleet life—not just acquisition
              price. Until DoD explicitly programs a reusable high-Mach vehicle program-of-record, Hermeus competes
              partly against its own customer's existing procurement culture.
