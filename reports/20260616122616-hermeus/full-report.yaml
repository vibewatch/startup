      - number: '5.5'
        title: Technical Risks, Certification Gaps, and System-Integration Challenges
        blocks:
          - type: paragraph
            body: >-
              The Hermeus program faces a stack of interrelated engineering and institutional risks that increase in
              severity as the aircraft advances toward hypersonic speeds. The most fundamental technical risk is the
              undemonstrated in-flight TBCC mode transition: no commercially developed system has ever executed a clean
              turbojet-to-ramjet handoff in flight at relevant Mach numbers. Historical precedents (the SR-71's J58 and
              NASA's X-51) required massive government investment, extensive facility access, and multiple test articles
              to achieve partial analogues. Engineering skeptics point to three specific challenges: (1) managing the
              variable inlet's shock positioning to prevent unstart during transition; (2) protecting turbine blades
              from inlet stagnation temperatures above design limits as Mach rises; and (3) achieving reliable
              closed-loop mode-switching control under conditions of aerothermal load variation. The thermal management
              problem is amplified by materials durability: high-temperature alloys and composites at the leading edge
              face cyclic heating in sustained flights above Mach 3 for which no in-flight data yet exists for Hermeus
              designs. On the certification and assurance side, the FAA Experimental Certificate is scoped narrowly to
              Quarterhorse Mk 2.1 at Spaceport America within WSMR airspace; any future operational military aircraft
              requires Air Force airworthiness under MIL-SPEC processes that have not yet been initiated. No DoD
              program-of-record exists for Hermeus technology: the House Armed Services Committee's FY2027 NDAA draft
              explicitly called out that no hypersonic S&T program has been transitioned to a major acquisition program,
              directly constraining the near-term scaling path. Supply-chain concentration in Pratt & Whitney as the
              sole F100 engine supplier, and dependence on Spaceport America and WSMR airspace availability, are
              additional operational risk vectors.
