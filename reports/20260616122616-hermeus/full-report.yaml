companyProfile:
  summary: >
    Hermeus is a 2018-founded defense aviation startup that has built unusual technical and customer credibility for its
    stage. The company has progressed from early AFWERX work to a $219 million DIU-linked high-Mach flight program
    involving the U.S. Air Force and Navy, while its Quarterhorse Mk 2.1 became the first privately funded unmanned
    aircraft publicly known to break the sound barrier in active flight testing. Hermeus' strategic logic is to use
    rapid hardware iteration, turbine-based combined-cycle propulsion, and autonomy to create reusable high-speed
    military aircraft, with commercial passenger transport as a distant optionality rather than the near-term business
    case.
