chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Product Architecture
        blocks:
          - type: paragraph
            body: >-
              Hermeus Corporation is a venture-backed defense aviation company founded in 2018 in Atlanta, Georgia,
              focused on the rapid design, build, and test of high-Mach and hypersonic aircraft for national security
              customers. The company's stated mission is to give the U.S. and its allies an asymmetric speed advantage
              over adversaries by delivering high-speed unmanned aircraft at the pace of the modern battlefield rather
              than the traditional decade-scale defense acquisition timeline. Its primary customer is the Department of
              War (previously DoD), with the U.S. Air Force and U.S. Navy engaged as operational partners under the
              expanded DIU contract.

              The core product architecture spans three layers. First is the Chimera engine family — a turbine-based
              combined cycle (TBCC) engine that runs as a turbofan at low speeds and bypasses air around the turbine to
              engage a ramjet at high Mach numbers. Hermeus demonstrated turbojet-to-ramjet transition in November 2022,
              making Chimera the world's first commercially developed TBCC engine. Second is the Quarterhorse
              demonstrator family — four aircraft in increasing capability bands. Mk 0 was a non-flying dynamic iron
              bird; Mk 1 (GE J85-powered) validated high-speed takeoff/landing at Edwards AFB in May 2025; Mk 2.1 (Pratt
              & Whitney F100, F-16 scale) became the world's first privately-funded unmanned supersonic jet on May 26,
              2026, reaching Mach 1.21 in just its third test flight. Mk 2.2 and 2.3 are planned for 2026-2027 before Mk
              3 integrates Chimera II targeting Mach 3.3+. Third is the Darkhorse UAS — a multi-mission reusable
              hypersonic drone powered by Chimera II with the Pratt & Whitney F100 core, targeting operational defense
              deployment at scale. Halcyon, a commercial passenger aircraft with New York-to-London in 90 minutes
              capability, remains a long-term aspiration after the company pivoted primarily to defense markets. Hermeus
              operates across four locations: Atlanta GA (110,000 sq ft engineering and manufacturing HQ), El Segundo CA
              (new prototyping HQ), Jacksonville FL (HEAT test facility for hypersonic propulsion), and Washington DC
              (policy proximity).
