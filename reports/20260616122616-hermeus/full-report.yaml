      - number: '1.4'
        title: Milestones, Government Contracts, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The most compelling traction signal is execution cadence: from founding in 2018 to supersonic flight in
              May 2026, Hermeus achieved eight years of milestones in roughly the time some defense primes spend on
              design reviews. Chimera engine validated turbojet-to-ramjet transition in November 2022. Quarterhorse Mk 1
              flew from Edwards AFB in May 2025. The HEAT facility came online in Jacksonville in January 2025 to
              address U.S. hypersonic test infrastructure gaps. Mk 2.1 went from maiden flight (March 2, 2026) to
              supersonic (Mach 1.21, May 26, 2026) in just 85 days and three sorties — earning the FAA's Special
              Airworthiness Certificate in March and breaking the sound barrier over White Sands Missile Range. Air
              Force Magazine and Breaking Defense independently confirmed this as the first privately-funded unmanned
              supersonic flight in aviation history.

              Government contract traction mirrors the technical pace. The 2020 AFWERX study ($1.5M) seeded the
              executive airlift concept. The 2021 USAF contract ($60M, jointly funded) validated Quarterhorse as a
              platform. The 2023 DIU HyCAT award ($23M) brought the Pentagon's prototyping arm as a formal customer. The
              May 2026 DIU modification ($159M additional, $219M total ceiling) paired USAF and USN as operational
              stakeholders and targeted Mach 3 payload release in flight — described by DIU Military Deputy Major
              General Kunkel as a potential "game-changing warfighting capability."

              Three adverse signals deserve close attention. First, the Pentagon's FY2026 hypersonic weapons budget was
              cut 43 percent from $6.9 billion to $3.9 billion, with the Congressional Research Service noting the DoD
              has not established any program of record for hypersonic weapons. This creates funding-cycle risk:
              contracted awards can continue, but future sole-source follow-ons depend on services that lack formal
              acquisition pathways. Second, CEO Shore confirmed in May 2026 that hypersonic flight capability remains
              "at least several years out," meaning Darkhorse and Chimera II TBCC remain pre-revenue milestones. Third,
              co-founder attrition — two founders no longer with the firm, Skyler Shuford launching Reaxiomatic — raises
              institutional knowledge and talent-retention questions even as the public-facing leadership bench has
              deepened with Shore, Furger, and Nakamaru.
