              $60M StratFI follow-on, to a $23M HyCAT award, to the current $219M modification. Hermeus also disclosed
              early-stage discussions with multiple combatant commands for exercise support and experimentation, though
              specific commands or contract values have not been publicly confirmed. The Quarterhorse Mk 2.1 achieved
