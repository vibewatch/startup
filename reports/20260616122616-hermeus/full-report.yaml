      - number: '8.3'
        title: Comparable Set and Valuation Framework
        blocks:
          - type: paragraph
            body: >-
              No directly comparable public company exists—Hermeus is pre-revenue, defense-focused, unmanned, and
              hypersonic-adjacent, a profile that does not match any public aerospace or defense prime. The most useful
              reference class is late-stage private defense-tech companies: Anduril ($61 billion, Series H May 2026,
              $2.2 billion 2025 revenue), Shield AI ($12.7 billion, Series G March 2026, estimated $300 million 2025
              revenue), and Saronic ($9.25 billion, 2026, maritime autonomy). These comps imply 14–42× forward revenue
              multiples for revenue-generating defense-tech platforms with strong government contract positions. Hermeus
              at $1 billion with no disclosed revenue is at the pre-revenue frontier of this category—essentially a
              milestone-option play rather than a revenue-multiple story.

              The nearest product analogue is Boom Technology (commercial supersonic, $1.5 billion valuation as of
              December 2025), which also has no production revenue and similarly anchors value to government-recognized
              milestones and market-creation potential. Boom's XB-1 achieved supersonic flight in January 2025 with a
              human pilot; Hermeus' advantage is the unmanned defense angle, which provides a clearer near-term revenue
              pathway than Boom's commercial certification path. Public defense prime Lockheed Martin (Hermeus' implicit
              long-term competitor via the SR-72 concept) trades at roughly 1.6× trailing revenue, providing a valuation
              floor concept for a mature production-stage program. The market.us research estimates the hypersonic
              aircraft market at $1.5 billion in 2024 growing to $2.8 billion by 2034 at a 6.5% CAGR; Mordor
              Intelligence sizes the broader hypersonic weapons market at $8.24 billion in 2025 growing to $14.78
              billion by 2030 at a 12.4% CAGR. US DoD alone budgeted $6.9 billion for hypersonic systems in FY2025, a
              47% increase from FY2023, providing substantial procurement headroom for a successful platform.
            claimRefs:
              - CV021
              - CV022
              - CV023
