      - number: '8.5'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Hermeus is a Series C company with no disclosed path to IPO in the near term. The natural exit sequence
              follows the Anduril/Shield AI pattern: demonstrate operational capability, secure a production contract,
              raise a Series D/E at a higher valuation, and list when the company reaches $200+ million in annual
              contract revenue and has a credible backlog. Palmer Luckey noted in June 2026 that Anduril's eventual IPO
              is certain and necessary for the company to compete for larger contracts—this observation applies to
              Hermeus as well once it matures beyond development-stage programs. A strategic acquisition by a defense
              prime (Northrop Grumman, Lockheed Martin, Boeing, RTX) is the alternative exit; RTX Ventures'
              participation in the Series C syndicate and the engine supply relationship with Pratt & Whitney create a
              natural strategic anchor.

              The critical diligence gaps are significant: Hermeus does not disclose revenue, burn rate, backlog
              composition, or cap table structure. The preference stack across six rounds of equity plus $150 million in
              venture debt creates unknown liquidation preference layers. The exact terms of the DIU contract and
              whether revenues are milestone-based, time-and-materials, or cost-plus are not public. Before issuing a
              buy recommendation, an investor would need to verify: actual quarterly burn rate, DoD contract pipeline
              beyond the $219 million DIU program, expected Mach 3 flight date with contractual milestone payments
              attached, and the preference stack calculation at the $1 billion mark that determines common equity
              recovery in a moderate-outcome scenario.
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
