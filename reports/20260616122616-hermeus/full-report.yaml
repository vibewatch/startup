      - number: '4.2'
        title: Capital Adequacy, Funding History, and Capital Stack
        blocks:
          - type: paragraph
            body: >-
              Hermeus has raised more than $500M in total capital across seven funding events since its 2018 founding,
              reaching a $1B post-money valuation with the April 2026 Series C. The Series C comprised $200M in equity
              (led by Khosla Ventures, with continued participation from Canaan Partners, Founders Fund, RTX Ventures,
              Bling Capital, In-Q-Tel, and new investors including Cox Enterprises/Socium Ventures, Destiny Tech100,
              Georgia Tech Foundation, 137 Ventures, and GSBackers) and $150M in structured venture debt from Silicon
              Valley Bank, Pinegrove Venture Partners, Hercules Capital, and Trinity Capital. CEO AJ Piplica explicitly
              described the debt tranche as a deliberate strategy to finance hardware manufacturing capacity
              non-dilutively, an unusual but defensible approach for a hardware-first defense startup.

              Prior rounds: Seed (2019, Khosla Ventures), Series A (2020, ~$16M, Canaan Partners lead), $60M USAF/VC
              joint StratFI contract (2021), and Series B (March 2022, $100M, led by Sam Altman with Founders Fund and
              In-Q-Tel entering). The Series C nearly tripled total historical capital.

              Capital is being deployed toward: (1) scaling a fleet of three F-16-class aircraft simultaneously, (2)
              expanding manufacturing in Atlanta (110,000 sq-ft facility shifting to production), (3) opening a new El
              Segundo, CA headquarters for engineering and prototyping, and (4) targeting >200 El Segundo employees by
              mid-2027. No burn rate has been disclosed; sector benchmarks for hardware-rich aerospace startups at this
              development intensity suggest $10–20M/month in operational spending, implying an estimated 18–42 month
              runway from Series C proceeds—an approximation only. The $150M debt component adds structured repayment
              obligations that create financial pressure if flight-test campaigns slip materially. An independent
              analysis from Robotics Press describes this as the chapter's key downside scenario: "Debt service
              obligations on $150M create financial pressure if test campaigns slip."

              Separate from equity/debt, cumulative government contract cash (approximately $78.5M per Obviant data) has
              partially offset operating costs, though these are milestone-contingent and thus variable.
