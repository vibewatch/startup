      - number: '5.2'
        title: Chimera TBCC Engine Architecture and Propulsion Stack
        blocks:
          - type: paragraph
            body: >-
              The Chimera engine is the technical centerpiece of the Hermeus program and the first commercially
              developed turbine-based combined-cycle (TBCC) propulsion system. In turbine mode, Chimera uses a
              commercial Pratt & Whitney F100 turbofan core — the same engine powering the F-15 and F-16, with over 30
              million flight hours across its service life — providing reliable subsonic and low-supersonic thrust from
              runway to approximately Mach 1.5. A proprietary Hermeus precooler sits at the F100 air intake and uses a
              compact heat-exchanger to lower stagnation temperatures of incoming air, extending the turbine's effective
              speed ceiling from approximately Mach 1.5 to Mach 2.5+. Above Mach 2.8, the engine is designed to bypass
              airflow around the turbine core via a duct-isolator assembly and complete combustion in a ramjet chamber,
              enabling efficient propulsion to hypersonic speeds. Hermeus demonstrated turbojet-to-ramjet mode
              transition in ground tests in November 2022 — a milestone the company and DoD described as "one of the
              most important technological feats to making operational hypersonic flight a reality." Sea-level static
              ground tests of Chimera were completed in full in a prior campaign; the HEAT facility now provides the
              next phase of high-enthalpy, vitiated-airflow ground simulation before in-flight demonstration on Mk 3.
              The Chimera II variant for Darkhorse and post-Mk3 aircraft will extend the speed ceiling to Mach 5+. The
              COTS approach to the turbine core eliminates an estimated billions in custom engine development costs and
              compresses schedule by leveraging decades of F100 production and maintenance infrastructure. A key
              unresolved question is whether the precooler and bypass-duct architecture will cleanly manage the shock
              structure and thermal loads during in-flight mode transitions at Mach 2.5–3, a regime where inlet unstart
              and blade over-temperature remain engineering risk items.
