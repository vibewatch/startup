      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: First Private UAS to Achieve Supersonic Flight
            body: >-
              Quarterhorse Mk 2.1 reached Mach 1.21 on May 26, 2026 — the first supersonic flight by a privately
              developed unmanned aircraft in the United States. The milestone arrived on the platform's third test
              flight, 364 days after Mk 1's maiden flight, demonstrating a hardware iteration cadence without recent
              parallel in commercial aviation. The DoD's largest-ever DIU award ($219M) followed within days, confirming
              institutional confidence in the program's execution pace.
            calloutType: strength
            claimRefs:
              - CE002
              - CE010
              - CE012
          - type: callout
            title: In-Flight TBCC Mode Transition Remains Undemonstrated
            body: >-
              The Chimera engine's turbojet-to-ramjet mode transition in flight is the single most critical unresolved
              technical risk in the program. Hermeus demonstrated the transition in ground conditions in November 2022,
              but no commercially developed TBCC system has achieved this in flight at relevant Mach numbers. Until
              Quarterhorse Mk 3 demonstrates this capability, claims of Mach 4+ performance remain aspirational. Failure
              to achieve clean in-flight transition on Mk 3 would require a significant program reassessment.
            calloutType: risk
            claimRefs:
              - CE003
              - CE008
              - CE023
          - type: callout
            title: No DoD Program-of-Record Acquisition Path
            body: >-
              The House Armed Services Committee's FY2027 NDAA draft explicitly stated that DoD has not transitioned any
              hypersonic science-and-technology program into a major acquisition program of record, directly limiting
              near-term scaling beyond demonstration contracts. Hermeus currently operates under Other Transaction
              Authority via DIU, which enables rapid experimentation but cannot fund large-scale production without
              program-of-record designation. This gap represents the most significant institutional risk to the
              company's commercialization timeline.
            calloutType: risk
            claimRefs:
