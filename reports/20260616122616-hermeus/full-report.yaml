            title: 43% Pentagon Hypersonic Budget Cut Threatens Future Revenue Pipeline
            body: >-
              The Pentagon's FY2026 hypersonic weapons budget was reduced 43 percent from $6.9B to $3.9B, and the DoD
              has yet to establish any program of record for hypersonic weapons. This means Hermeus is operating in a
              prototyping / experimentation funding pool rather than a structured acquisition program, increasing
              dependency on continued DIU and service experimentation dollars that can be redirected annually through
              budget cycles.
            calloutType: risk
