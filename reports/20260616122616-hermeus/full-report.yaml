        - Mach 3 not achieved by Q3 2028
        - Core de-risking event delayed; increases probability of competitor closing gap; triggers runway concern
        - Downgrade to avoid; reassess at bear-case valuation floor
      - - DOGE / budget cut to DIU contract
        - DIU contract reduced by >20% or terminated in FY2027 budget
        - Eliminates primary revenue stream; forces emergency equity raise likely below $1B mark
        - Immediate reassess; potential down-round materializes
      - - CEO transition execution gap
        - More than 6-month delay in any scheduled test flight post Shore CEO assumption
        - Leadership transition confirmed as execution risk; investor confidence erodes
        - Research-more retained but confidence downgraded to low
      - - Competitive displacement
        - Lockheed, Northrop, or RTX wins primary DoD hypersonic aircraft program-of-record over Hermeus
        - Startup's path to production contract blocked by prime contractor with superior relationship leverage
        - Bear case realized; strategic acquisition at haircut or liquidation preferred exit
      - - Debt covenant stress
        - Hermeus misses a milestone-tied debt payment or seeks covenant waiver
        - Signals burn exceeds runway; equity dilution via restructuring likely material
        - Reassess capital structure; position holders at risk of significant dilution
    notes: >-
      Kill triggers are thesis-break events, not routine business risk; any single trigger warrants immediate
      re-evaluation of position.
