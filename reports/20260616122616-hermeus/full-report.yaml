      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Pre-Revenue Valuation at $1 Billion: Missing Evidence for Underwriting'
            body: >-
              The $1 billion post-money valuation cannot be underwritten from public data alone. Hermeus discloses no
              revenue, burn rate, backlog composition, or preference stack. The sole economic anchors are $219 million
              in total DIU contract commitments (development-stage, not production revenue) and sector-comparable
              multiples from Anduril and Shield AI—which both have real revenue bases. Any investment decision requires
              a data room covering: quarterly burn, milestone payment schedule, cap table with preference layers, and
              the pipeline of DoD programs beyond the current DIU vehicle.
            calloutType: risk
            claimRefs:
              - CV011
              - CV038
              - CV039
              - CV040
          - type: callout
            title: Supersonic Milestone as a Fundamental De-Risking Event
            body: >-
              The May 26, 2026 supersonic flight at Mach 1.21—achieved on only the third test flight, 85 days after Mk
              2.1's maiden flight—is the most significant valuation-positive event in Hermeus' history. It proves that
              the F100 engine integration, variable inlet, and delta-wing aerodynamics work in the supersonic regime.
              This reduces the technology probability adjustment for Mach 3 flight (which adds ramjet TBCC complexity)
              and meaningfully improves the bull-case probability. No publicly known privately-funded unmanned jet had
              previously achieved this milestone.
            calloutType: insight
            claimRefs:
              - CV003
              - CV004
              - CV005
          - type: callout
            title: Valuation Assumes Continued Defense-Tech Premium Multiple Environment
            body: >-
              The $1 billion valuation is only justifiable under current defense-tech sector conditions, where Anduril
              and Shield AI command 14–42× forward revenue multiples. If sector multiples compress—whether due to rising
              interest rates, public market corrections in defense tech names, or a failed defense IPO setting a
              negative precedent—Hermeus' option premium would reprice downward materially. The current environment
              ($4.5B+ defense-tech VC in Q1 2026 alone) is historically unprecedented and may not persist through a full
              market cycle.
            calloutType: assumption
            claimRefs:
              - CV022
              - CV028
              - CV034
