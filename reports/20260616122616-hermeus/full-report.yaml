  - id: TE003
    title: Chimera TBCC Technology and Operating Architecture
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Technical Risk
    rows:
      - - Chimera Turbine Core (P&W F100)
        - Subsonic and low-supersonic propulsion; runway takeoff through Mach ~1.5
        - Pratt & Whitney supply chain; RTX Ventures overlap
        - Single-source engine supply; afterburner life at cyclic high-speed use
      - - Hermeus Proprietary Precooler
        - Heat exchanger extends turbine ceiling from Mach ~1.5 to Mach 2.5+; cools intake stagnation air
        - Hermeus proprietary design; no commercial alternative
        - >-
          Novel heat exchanger under extreme delta-T; materials fatigue at cyclic heating; not yet validated in
          sustained supersonic flight
      - - Variable Geometry Inlet
        - Manages shock structure and airflow split; delivers conditioned air to both turbine and ramjet modes
        - Integrated airframe design; machined geometry precision
        - Shock positioning errors cause inlet unstart; tolerance stack-up at hypersonic Mach
      - - Bypass Duct / Isolator
        - Routes high-Mach airflow around turbine core in ramjet mode; protects rotating blades above Mach 2.8
        - Integrated with airframe; high-temperature alloy supply
        - Thermal cycling fatigue at extreme Mach; duct geometry must prevent flow separation
      - - Ramjet Combustor Stage
        - Air-breathing hypersonic combustion (Mach 3–5+); primary propulsion in TBCC ramjet mode
        - High-temperature combustor material sourcing; HEAT facility validation
        - Not flight-tested as of June 2026; sustained combustion stability unproven at scale
      - - Delta-Wing Airframe / Thermal Protection
        - Supersonic/hypersonic lift and stability; leading-edge and surface thermal protection
        - Titanium and composite supply chain; specialized manufacturing
        - Leading-edge thermal loads above Mach 3; limited public data on TPS durability at sustained Mach 3+
      - - GNC / Autonomy Stack
        - Real-time flight control, navigation, and mission management for unmanned operation
        - Ground-control uplink reliability; GPS accuracy at hypersonic altitude
        - Signal latency and potential plasma-sheath GPS disruption at hypersonic speeds; no public technical disclosure
      - - Ground Control Flight Deck
        - Remote unmanned operation; mission tasking; emergency override
        - Secure uplink; FAA-approved ground station design
        - Hypersonic communication disruption risk; FAA authorization required per flight increment
      - - HEAT Ground Test Facility
        - High-Mach vitiated airflow ground simulation of hypersonic engine conditions
        - Legacy Navy infrastructure at Cecil Airport Jacksonville FL; future expansion funding
        - >-
          Ground simulation of true hypersonic flight conditions still incomplete; Phase 2 expansion needed for
          continuous high-Mach airflow
    notes: >-
      TRL assessments are analyst-inferred from public milestones; Hermeus does not publish TRL data. Ramjet combustor
      TRL is estimated <5 for in-flight readiness as of June 2026. Dependency column reflects the most limiting external
      constraint per layer.
