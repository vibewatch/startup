      - number: '3.3'
        title: 'Status-Quo Substitutes: Hypersonic Missiles, ISR Drones, and Conventional Platforms'
        blocks:
          - type: paragraph
            body: >-
              The largest competing force against Hermeus is not another startup but the category of expendable and
              conventional substitutes the DoD currently uses to solve the same operational problems: time-critical
              strike, ISR penetration, and rapid-response force projection.

              The U.S. Air Force's FY2026 budget requests $387.1M for initial ARRW production (Lockheed Martin, Mach 5+
              boost-glide, B-52 carried) and $802.8M for continued HACM development (Raytheon, air-breathing scramjet,
              F-15/F-35 carried). Together they absorb over $1.2B of the DoD's approximately $3.9B FY2026 hypersonic
              portfolio. The GAO reported that HACM is behind schedule and that Raytheon is projecting it will
              significantly exceed its cost baseline. A 2023 Congressional Budget Office study estimated the Army Dark
              Eagle LRHW boost-glide missile at $41M per unit for a 300-missile buy; the Army confirmed initial units
              will exceed this estimate. These expendable systems solve kinetic strike without requiring reusability,
              pilot safety, or commercial certification—but they cannot conduct sustained ISR, persistent monitoring, or
              multi-mission operations.

              Northrop Grumman's RQ-4B Global Hawk remains the backbone of U.S. HALE ISR, deployed over the Black Sea in
              February 2026 but designed for endurance and altitude rather than speed or contested-airspace penetration.
              The classified Northrop RQ-180 addresses stealth penetrating ISR without hypersonic speed. DARPA and
              Northrop's XRQ-73 SHEPARD hybrid-electric ISR drone made its first flight in April 2026, targeting low
              acoustic signature, not high Mach. Congress has explicitly noted that DoD has not yet completed the
              transition of hypersonic technologies from S&T prototyping to major acquisition programs and demanded a
              plan by March 2027—confirming that the current substitute-dominated environment may persist longer than
              Hermeus's fundraising narrative assumes.
            claimRefs:
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
      - number: '3.4'
        title: Competitive Moat Assessment and Adverse Lens
        blocks:
          - type: paragraph
            body: >-
              Hermeus's stated moats—iterative TBCC propulsion development, a DIU-validated defense pathway, and
              dual-use revenue optionality—face meaningful displacement risks that require adverse scrutiny.

              The primary technical moat, the Chimera engine's TBCC transition from gas turbine to ramjet during flight,
              has not yet been demonstrated in actual flight conditions as of June 2026. Hermeus Mk 2.3 targets Mach 3
              in H1 2027, but the full Chimera cycle for Mach 5 is deferred to the future Darkhorse platform—a
              multi-year technology risk. Lockheed Martin holds classified TBCC IP from SR-71 and Aerojet Rocketdyne
              work dating to 2006, with Skunk Works resources orders of magnitude larger than Hermeus. Even
              prime-contractor execution of TBCC has never been flight-demonstrated at Mach 6, and critics compare the
              SR-72 program's cost trajectory to the Zumwalt-class destroyer ($23B for three ships).

              On the procurement side, the HASC FY2027 draft legislation explicitly noted that DoD has not completed
              hypersonic technology transition to major acquisition programs—the governance threshold Hermeus must cross
              from DIU OTA to program-of-record. GAO documented that four of six DoD hypersonic weapon programs fail to
              solicit user feedback or use digital engineering tools, suggesting systemic acquisition risk affecting the
              whole sector. The Atlantic Council's February 2026 Hypersonics Task Force—which includes Hermeus's chief
              revenue officer—frames the technology as a national security imperative but also identifies cost
              sustainability as an explicit challenge requiring policy intervention.

              Distribution and switching costs favor incumbents: Anduril and Kratos hold existing USAF/USMC CCA
              program-of-record relationships, AI autonomy platforms (Lattice and Prism respectively), and combat
              pedigrees that give them near-term claim on CCA-adjacent missions. Hermeus must convince buyers to wait
              for Mach 3+ before committing production contracts—an ask that grows harder with each Anduril or Kratos
              win.
