            body: >-
              Hermeus operates at the intersection of three distinct regulatory regimes, each presenting material
              independent risk. First, 14 CFR §91.817 prohibits civil aircraft from exceeding Mach 1 over US territory;
              Hermeus obtained a Special Flight Authorization (SFA) for experimental-only test flights valid through
              December 31, 2026, at White Sands Missile Range. The June 2025 Executive Order directing the FAA to lift
              the overland supersonic ban and finalize commercial noise certification standards by June 2027 creates a
              policy tailwind, but the Supersonic Aviation Modernization Act (H.R. 3410) passed the House in March 2026
              and has not yet cleared the Senate — leaving the commercial supersonic framework uncertain. If commercial
              certification standards are not finalized by 2027 as directed, Halcyon's entire civilian business case is
              blocked. Second, the International Traffic in Arms Regulations (22 CFR Parts 120–130, implementing 22
              U.S.C. §2778) subject all Hermeus technology, technical data, and defense services to strict export
              controls. Every employee, contractor, and partner must be a "U.S. person" unless an export license is
              obtained from the State Department's DDTC, severely restricting the global talent pool and all
              international partnership opportunities. Deemed-export violations can result in criminal penalties and
              contract termination. Third, the Halcyon commercial aircraft would require a FAA Type Certificate under 14
              CFR Part 25 (transport-category aircraft), a process with zero established precedent at Mach 5 and no
              projected timeline. Hermeus engaged Holland & Knight for FAA and defense lobbying at a $90,000 engagement,
              signaling active but early-stage regulatory navigation work.
