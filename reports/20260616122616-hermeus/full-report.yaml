      - number: '8.2'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Hermeus has raised capital across six identifiable rounds since its 2018 founding: an undisclosed Khosla
              Ventures seed, a $16 million Series A led by Canaan (2020), $60 million from USAF and venture investors
              (2021), a $100 million Series B led by Sam Altman in March 2022, and the April 2026 Series C. Total equity
              plus debt capital raised exceeds $500 million, confirmed by the company's own press release. The Series C
              structure—$200 million equity, $150 million debt from Silicon Valley Bank, Pinegrove Venture Partners,
              Hercules Capital, and Trinity Capital—is unusually sophisticated for a Series C hardware startup and
              reflects management's stated desire to limit dilution while funding significant manufacturing capital
              expenditure. The use of venture debt at this scale signals some lender confidence in the DoD contract
              receivable stream, but it also creates a fixed-cost obligation layer on a business with no product
              revenue.

              From a price-per-evidence perspective the $1 billion post-money valuation is 4.6× the total capital
              deployed prior to this round (roughly $215 million pre-Series C equity). Applying the $219 million total
              DIU contract value as a proxy for contracted backlog implies a valuation-to-backlog multiple of
              approximately 4.6×—aggressive relative to public defense primes (Lockheed Martin trades at roughly 1.6×
              revenue), but low relative to venture-stage defense-tech peers (Shield AI at $12.7 billion implies
              multiples far above Hermeus' implied ratio). The critical unknown is post-Series C burn rate: three
              simultaneous aircraft builds, expansion to El Segundo, and workforce growth toward 300 employees suggest
              quarterly burn well above $30 million, implying the $350 million runway may last 24–30 months depending on
              DoD milestone payments.
