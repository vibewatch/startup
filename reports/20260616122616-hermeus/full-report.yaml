              Hermeus derives 100% of current revenue from a single category of customer — U.S. government defense
              agencies — with its entire contracted revenue base concentrated in the Defense Innovation Unit (DIU)
              vehicle, totaling $219M after the May 2026 contract modification. This extreme customer concentration
              means any contract termination or non-renewal would reduce revenue to near zero. The risk is materially
              elevated by the Pentagon cutting the FY2026 hypersonic weapons budget by 43%, from $6.9B to $3.9B, even as
              adversaries China and Russia operate deployed hypersonic boost-glide systems. DOGE-driven "efficiencies"
              of $11.1B in DoD spending create additional procurement uncertainty, with small businesses and advisory
              contractors hit especially hard. The House Armed Services Committee's draft FY2027 NDAA explicitly notes
              that DoD has not yet completed the transition of hypersonic technologies from science and technology into
              major acquisition programs — a direct structural threat to Hermeus' programmatic pathway. Despite years of
              targeted investment, DoD has not fielded a single operational hypersonic platform, and Congressional
              pressure to show results intensifies each year. If procurement patterns revert to legacy prime contractors
              (Lockheed Martin, Northrop Grumman) — both of which have active classified hypersonic programs — Hermeus
              could face contract non-renewal even if technical milestones are achieved on schedule. The early AFWERX
              seed contract ($1.5M in 2020, $60M in 2021) anchored Hermeus in the DoD ecosystem early, but anchoring
              creates dependency as much as it creates opportunity. A single contractor customer concentration at 100%
              is a thesis-break risk if programmatic priorities shift.
