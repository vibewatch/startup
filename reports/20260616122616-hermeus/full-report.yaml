              - CO031
          - type: callout
            title: $150M Debt Tranche Signals Capital Efficiency Orientation
            body: >-
              Structuring $150M of the $350M Series C as non-dilutive debt — from SVB, Hercules, Pinegrove, and Trinity
              Capital — is unusual for a hardware-intensive pre-production defense startup. Management's explicit
              rationale (per CEO Piplica) is to finance capital-intensive manufacturing without further diluting the cap
              table. This discipline, if maintained, could improve IRR for equity holders but creates covenant and
              coverage risk if the flight test cadence slips.
