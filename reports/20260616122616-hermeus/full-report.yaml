      - number: '1.3'
        title: Capital History, Investors, and Valuation
        blocks:
          - type: paragraph
            body: >-
              Hermeus has compiled a well-structured capital history across five formal financing events plus
              substantial government contract revenue. The seed round in 2019 (approximately $2.1 million) was led by
              Khosla Ventures. Series A ($16 million, 2021) was led by Canaan Partners with Khosla, Bling Capital, and
              others. Series B ($100 million, March 2022) was led by Sam Altman — then president of Y Combinator and CEO
              of OpenAI — with participation from Peter Thiel's Founders Fund (both new to the cap table), In-Q-Tel (the
              CIA's investment arm), and existing investors. RTX Ventures (Raytheon Technologies) followed with a
              strategic investment in May 2022 that deepened the Pratt & Whitney engine relationship. Series C ($350
              million, April 7, 2026) was led by Khosla Ventures returning to lead, with $200 million equity and $150
              million debt. Equity co-investors include Canaan, Founders Fund, RTX Ventures, Bling, In-Q-Tel, Cox
              Enterprises via Socium Ventures, Destiny Tech100, Georgia Tech Foundation, 137 Ventures, and GSBackers.
              Debt came from Silicon Valley Bank (First Citizens), Pinegrove VP, Hercules Capital, and Trinity Capital.
              CEO Piplica noted the debt tranche was deliberate: "if we can finance a large portion of our spend
              non-dilutively, it's absolutely the way to do it."

              The Series C brought total capital raised above $500 million and established a $1 billion post-money
              valuation, granting Hermeus unicorn status. Revenue, ARR, gross margin, and burn rate metrics are not
              publicly disclosed. The only publicly visible financial indicators are government contract awards — the
              $219 million DIU ceiling and prior USAF and AFWERX contracts aggregating roughly $82 million — which do
              not constitute full revenue recognition. Exact private financial metrics require direct due-diligence
              access to management accounts.
