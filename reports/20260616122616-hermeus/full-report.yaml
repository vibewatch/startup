  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Government Contract Structure
        blocks:
          - type: paragraph
            body: >-
              Hermeus's revenue model is entirely anchored to U.S. government research, development, test, and
              evaluation (RDT&E) contracts structured as Other Transaction Agreements (OTAs)—a procurement vehicle
              allowing DoD to move faster than traditional FAR-based contracts. The company earns payments upon
              achieving defined technical milestones (flight tests, subsystem demonstrations, data deliverables) rather
              than on a subscription, product-sale, or per-unit basis. There is no commercial revenue, no recurring
              software or services revenue, and no ARR.

              The largest current contract is the Defense Innovation Unit HyCAT (Hypersonic and High-Cadence Airborne
              Testing Capabilities) OTA, which Hermeus began under a November 2023 initial award of approximately $23M
              and which was expanded in May 2026 by $159M, bringing the total ceiling to $219M—described by both Hermeus
              and DIU as one of the largest OTAs the unit has ever issued. Flight tests with USAF and Navy in 2026 and
              2027 will draw down this ceiling upon milestone completion. Hermeus also holds a 2021 $60M jointly-funded
              USAF StratFI contract (AFLCMC/AFRL/VCs) for the Quarterhorse prototype program, a $1.5M 2020 AFWERX Air
              Force One feasibility study, and a position in the $950M-ceiling JADC2 IDIQ pool (FA861222DB016) awarded
              June 2022 and shared among 27 vendors; actual task-order awards from the IDIQ are not public.

              Hermeus is now explicitly marketing Quarterhorse Mk 2 as a standalone military product—a less-expensive
              alternative to manned fighters and competitive with Collaborative Combat Aircraft programs—but no
              production contract or program of record exists as of June 2026. Third-party contract-analytics data
              (Obviant via Tectonic Defense) reports $78.5M in actual government contract awards to Hermeus to date,
              versus the $219M DIU OTA ceiling, illustrating the distinction between ceiling authority and cash drawn.
              All current contracts sit in the pre-production RDT&E phase. The company's "Department of War" branding
              signals its deliberate single-customer focus on national security missions, which simplifies near-term
              revenue generation but concentrates customer risk.
