      - number: '5.3'
        title: Test Infrastructure, Flight Operations, and Program Milestones
        blocks:
          - type: paragraph
            body: >-
              Hermeus operates an integrated test infrastructure spanning ground engine testing, flight test operations,
              and an Atlanta manufacturing facility. The High Enthalpy Air-Breathing Test Facility (HEAT), opened in
              January 2025 at Cecil Airport, Jacksonville, Florida, provides the only privately operated ground test
              cell capable of simulating high-Mach, vitiated airflow for air-breathing propulsion systems. Hermeus
              retrofitted legacy U.S. Navy test infrastructure (built in 1959 and expanded in 1989), completing Phase 1
              in approximately three months at roughly one-eighth the schedule and one-tenth the cost of comparable
              new-build test cells. Initial tests at HEAT used the Pratt & Whitney F100, with future expansion planned
              for continuous high-Mach vitiated airflow simulating true hypersonic conditions. For flight testing,
              Hermeus operates out of Spaceport America, New Mexico, within White Sands Missile Range airspace. The FAA
              granted Hermeus a Special Airworthiness Certificate in the Experimental Category (SAC-EC) for Quarterhorse
              Mk 2.1 on March 12, 2026, following a year-long collaboration; the FAA then issued a Special Flight
              Authorization in April 2026 permitting up to seven supersonic test flights through end of 2026. Flight
              test data from each Quarterhorse variant feeds directly into the design of the next, with the program
              achieving its first supersonic milestone on the Mk 2.1's third test flight — just 364 days after Mk 1's
              maiden flight. The Defense Innovation Unit (DIU) expanded its contract with Hermeus to a $219M ceiling in
              May/June 2026 to fund demonstration of high-Mach flight and autonomous payload release, with the Air Force
              and Navy named as service partners. Hermeus also participates in the DIU HyCAT portfolio and is a
              subplatform for Kratos's $1.45B MACH-TB 2.0 contract. Edwards AFB's Experimental Test Force collaborated
              with Hermeus during Mk 1 operations.
