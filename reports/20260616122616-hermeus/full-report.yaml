            title: TBCC In-Flight Transition Unproven
            body: >-
              Hermeus's primary technical moat—the Chimera engine's jet-to-ramjet transition—has not been demonstrated
              in flight as of June 2026. Every competitor racing toward Mach 5 (including Lockheed's classified SR-72
              and Stratolaunch's rocket-glide Talon-A) either bypasses TBCC or holds legacy IP. If Chimera transition
              fails or is delayed past 2028, Hermeus's hypersonic claims rest entirely on ground tests, weakening its
              differentiation from high-subsonic CCA peers.
