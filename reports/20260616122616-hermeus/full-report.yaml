      - number: '4.3'
        title: Unit Economics, Cost Structure, and Private Financial Gaps
        blocks:
          - type: paragraph
            body: >-
              Hermeus is a pre-production, pre-commercial-revenue company. No gross margin, CAC, payback period,
              contribution margin, LTV, or confirmed per-unit manufacturing cost data are available in any public
              source. All meaningful unit economics metrics are private and have not been disclosed to public markets or
              in any regulatory filing.

              Cost structure is dominated by engineering and manufacturing labor (~280–300 employees mid-2026),
              materials and components (predominantly the Pratt & Whitney F100-229 engine which Hermeus can partially
              source from refurbished Air Force inventory), test range fees, and facility costs across four sites
              (Atlanta, El Segundo, Jacksonville HEAT facility, and Washington DC). The High Enthalpy Air-breathing Test
              (HEAT) facility in Jacksonville, FL, came online in January 2025 and represents a material fixed-cost
              investment in proprietary hypersonic propulsion test infrastructure.

              The RTX Ventures strategic investment (announced May 2022) and the ongoing Pratt & Whitney F100 engine
              integration are financially significant: by adopting a proven engine platform rather than developing a
              custom turbine, Hermeus substantially reduced near-term R&D capex and accelerated the path to flight
              testing. This does not eliminate engine unit cost, but it lowers the capital required to reach initial
              flight milestones.

              On pricing, President Zach Shore told Breaking Defense that the Quarterhorse would be "certainly less
              expensive than a manned fighter and highly competitive to a CCA," and separately to Tectonic Defense that
              the aircraft is designed for mass producibility at World War II production cadence. Shore estimated 12–15
              aircraft/year as an initial production rate at scale. Neither a price point nor a cost-per-aircraft figure
              has been disclosed. The company itself acknowledged in May 2026 that dedicated manufacturing facilities
              for series production do not yet exist and would require a future capital raise. These are material gaps
              for production-stage financial underwriting.
