      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Supersonic Milestone Validates Rapid Prototyping Model
            body: >-
              Achieving supersonic flight (Mach 1.21) with a privately-funded unmanned jet on only the third test
              sortie, less than three months after maiden flight, demonstrates an iterative development cadence with no
              close parallel in modern aviation. This milestone directly de-risks the technical transition to Mach 2 and
              Mach 3 and substantially strengthens the DoD customer relationship.
            calloutType: strength
            claimRefs:
