company:
  name: Hermeus
chapter:
  number: 6
  title: Customers
  summary: >
    Hermeus' only confirmed payers are U.S. federal government agencies—principally the Defense Innovation Unit
    (DIU), Air Force, and Navy—under a cumulative ~$283M+ in awarded contracts since 2020, including the $219M
    DIU HyCAT total, a 2021 $60M AFLCMC/AFRL StratFI award, and smaller AFWERX and SBIR grants. The company has
    zero commercial customers and no program-of-record production contract; every agreement is an R&D or
    demonstration-phase OTA. Customer proof is substantive for the government channel—DIU's military deputy
    publicly endorsed the Quarterhorse as a potential "game-changing warfighting capability," the Air Force Test
    Center at Edwards partnered directly for Mk 1 airworthiness, and Kratos Defense is integrating the Quarterhorse
    into the Navy/MDA MACH-TB program—but adoption remains pre-operational. Traditional retention metrics are
    inapplicable at this stage, and the pilot-to-program transition risk is material given HASC criticism of DoD's
    failure to move hypersonic programs into formal acquisition and a 43% cut in hypersonic weapons development
    appropriations reported in 2026.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Procurement Landscape
    body: >
      Hermeus operates exclusively within the U.S. federal defense procurement ecosystem; there are no confirmed
      commercial, international, or non-governmental customers as of June 2026. The company's buyer landscape
      is segmented into four tiers: (1) the Defense Innovation Unit (DIU) as prime contract vehicle and funding
      authority under the HyCAT initiative; (2) the Air Force, which participates as both a co-funder (AFLCMC,
      AFWERX, AFRL) and as a test partner (Air Force Test Center at Edwards AFB); (3) the U.S. Navy, named
      explicitly as a partner in the May 2026 DIU contract expansion; and (4) sub-customers such as Kratos
      Defense, which is integrating Hermeus aircraft into the $1.45B Navy/MDA MACH-TB program. All procurement
      flows through Other Transaction Authority (OTA) contracts and AFWERX Strategic Financing (StratFI)
      mechanisms, not through traditional Program of Record or Major Defense Acquisition Program pathways. The
      "Vector Initiative" led by the Presidential and Executive Airlift Directorate (AFLCMC/PA) originated the
      relationship in 2020 with a $1.5M AFWERX study for hypersonic presidential airlift, establishing the
      customer thesis that Hermeus technology could serve senior leader transport, ISR, and mobility missions.
      In-Q-Tel's participation in the Series C confirms CIA/intelligence community interest, though no public
      intelligence contracts have been announced. The commercial hypersonic airliner program (targeting Mach 5+
      civil transport) has no prototype expected before 2029 and no signed customer letters of intent; it
      represents a future, speculative market segment, not current revenue.
