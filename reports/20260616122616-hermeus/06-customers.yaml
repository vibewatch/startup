  - id: retention-expansion-concentration
    title: Retention, Expansion, Concentration Risk, and Adverse Lens
    body: >
      Hermeus has no commercial revenue, no paying subscribers, and no traditional SaaS or hardware retention
      metrics (NRR, GRR, churn). In lieu of standard retention data, the relevant durability signal is government
      contract continuity: every contract relationship established since 2020 has been renewed or expanded, with
      zero lapsed or cancelled awards. The AFWERX-to-StratFI-to-DIU HyCAT trajectory reflects compound customer
      deepening within the same government ecosystem. However, this is structurally distinct from commercial
      retention—DoD contract continuity is subject to appropriations cycles, Congressional direction, program
      office transitions, and OTA award authority limits that commercial NRR is not. The concentration risk is
      severe: 100% of Hermeus revenue derives from a single payer category (U.S. federal government), with the
      DIU as the dominant contract vehicle. DIU does not hold independent procurement authority to move programs
      into production; transition to a military service program office is required before any volume acquisition
      can occur. CEO Shore acknowledged this explicitly, stating that after Mk 2.3 hits its Mach 3 milestone,
      Hermeus would be "rounding the edges" and working with a military branch "to transition the aircraft into
      service." The House Armed Services Committee's draft FY2027 NDAA stated that "the Department of Defense
      has not yet completed transition of hypersonic weapon technologies from science and technology, prototyping,
      and middle-tier acquisition efforts into major acquisition capabilities," and called for a transition plan
      by March 2027—a direct indictment of the pilot-to-program gap that is Hermeus' primary acquisition risk.
      A separate analysis cited a 43% reduction in hypersonic weapons development appropriations in the same
      period, representing a material adverse signal for sector customer spend. Hermeus has responded by
      investing in direct government relations ($1.8M+ lobbying since 2023) to maintain Congressional support
      and push for favorable FAA and DoD acquisition regulations, but these expenditures confirm the dependency
      rather than mitigate it. On expansion: Hermeus is "already very much engaged in transition discussions"
      with both the Air Force and Navy per CEO Shore, and the L3Harris sensor integration partnership
      (formalized through the Series C investor relationship) represents a potential sub-program revenue stream
      within future DoD contracts. Allied nation customers are cited as future targets but no specific agreements
      or LOIs are publicly confirmed.
