callouts:
  - calloutType: risk
    title: Single-Customer Concentration and Pilot-to-Program Gap
    body: >
      Hermeus is 100% dependent on U.S. federal government contracts, with DIU as the sole prime contract vehicle.
      The transition from DIU OTA demonstration to a military service program-of-record is the single most material
      business risk: DIU's $219M ceiling cannot by itself fund production, and Congress explicitly noted in draft
      FY2027 NDAA language that DoD has failed to transition hypersonic programs into major acquisition. A 43% cut
      in hypersonic appropriations and $1.8M+ in Hermeus lobbying since 2023 underscore the structural fragility
      of a pipeline that depends on one government customer ecosystem to move from prototype to fleet.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU031
      - CU037

  - calloutType: strength
    title: Exceptional Government Customer Endorsement Depth
    body: >
      The quality and specificity of government customer endorsements is unusually strong for a startup at
      demonstration stage. The DIU's most senior military official publicly tied the Quarterhorse to mass
      production and weaponization. The Air Force Test Center embedded engineers for a novel airworthiness
      pathway. Kratos—a major defense prime with a $1.45B program—selected the Quarterhorse as a testbed
      component. These signals collectively suggest that institutional customer confidence is high, even if
      formal production contracts have not yet followed.
    claimRefs:
      - CU012
