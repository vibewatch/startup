  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: contract obligations vs. ceiling
      missingEvidence: Actual obligated spend to date against the $219M DIU ceiling; contract period-of-performance details; option periods and termination clauses
      whyItMatters: The $219M is a contract ceiling, not a committed spend figure; actual revenue could be far lower if options are not exercised
      diligencePath: File FOIA request for DIU/Hermeus contract instruments; request USASpending.gov award data; ask company directly for program milestone payment schedule
      relatedQuestionRefs:
        - QU023

    - type: private-evidence-only
      severity: material
      topic: classified contracts
      missingEvidence: Any classified or non-public DoD, NRO, NGA, or intelligence community contracts with Hermeus beyond the publicly disclosed awards
      whyItMatters: In-Q-Tel participation and the nature of the programs suggest additional non-public agreements may exist; omitting them understates customer base depth and diversification
      diligencePath: Request cleared due diligence review of Hermeus classified contract portfolio; ask management for count and nature (R&D vs. operational) of any non-public agreements
      relatedQuestionRefs:
        - QU024

    - type: missing-source
      severity: material
      topic: FY2027 appropriations allocation
      missingEvidence: Congressional appropriations line items or DoD budget requests allocating specific funding for a Hermeus program-of-record transition in FY2027 defense budget
      whyItMatters: Transition from OTA demonstration to program of record requires explicit Congressional authorization and appropriations; without this, the $219M ceiling is the end of the near-term funding runway
      diligencePath: Monitor Senate/House Armed Services Committee FY2027 markup; track DoD Research, Development, Test and Evaluation (RDT&E) budget exhibits for hypersonic line items
      relatedQuestionRefs:
        - QU025

    - type: private-evidence-only
      severity: material
      topic: L3Harris partnership terms
      missingEvidence: Contract structure, revenue share, exclusivity, scope, and duration of the L3Harris sensor integration partnership within Hermeus programs
      whyItMatters: L3Harris is both investor and partner; understanding whether this creates a meaningful revenue stream or merely a technical sub-arrangement changes the customer concentration picture
      diligencePath: Request partnership agreement summary in due diligence; clarify whether L3Harris integration is mandated in government contracts or optional; confirm exclusivity
      relatedQuestionRefs:
        - QU026

    - type: missing-source
      severity: material
      topic: commercial customer pipeline
      missingEvidence: Any confirmed airline letter of intent, MOU, term sheet, or pre-order for Hermeus' future civilian hypersonic transport program
      whyItMatters: Hermeus' commercial airline thesis is the primary non-defense diversification narrative; absence of any LOI means the entire near-term customer base is DoD-only
      diligencePath: Request full commercial partnership pipeline in due diligence; ask management for timeline to first commercial LOI and conditions for signing; benchmark against Boom Supersonic's airline LOI strategy
      relatedQuestionRefs:
        - QU027
      relatedTableRefs:
        - TU003

