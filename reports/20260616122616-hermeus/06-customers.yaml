  - id: named-customer-proof-adoption
    title: Named Customer Proof and Adoption Trajectory
    body: >
      The government customer evidence is unusually strong for a pre-production defense startup. DIU's Military
      Deputy Maj. Gen. Joseph "Solo" Kunkel publicly declared that if the Quarterhorse can be mass-produced, it
      "becomes a game-changing warfighting capability" and confirmed the DIU has identified "a significant number
      of use cases where it can be used as a weapon." CEO AJ Piplica stated that "customers at the Department of
      War are paying close attention to how fast this program is moving," framing the pace of development as a
      competitive signal. The Air Force Test Center (AFTC) Experimental Test Force at Edwards partnered directly
      with Hermeus for the novel airworthiness certification process for Mk 1, employing Section 927 of the 2024
      FAA Reauthorization Act for expedited waiver processing—a demonstration of institutional commitment, not
      just transactional contract execution. Kratos Defense selected Hermeus Quarterhorse Mk 2 as a component of
      its own $1.45B MACH-TB contract, meaning a major defense prime has committed to Hermeus' platform as an
      operational testing asset. The adoption trajectory since 2020 shows a consistent pattern of contract
      expansion and technical validation: from a $1.5M conceptual study, to a $60M StratFI follow-on, to a
      $23M HyCAT award, to the current $219M modification. Hermeus also disclosed early-stage discussions with
      multiple combatant commands for exercise support and experimentation, though specific commands or contract
      values have not been publicly confirmed. The Quarterhorse Mk 2.1 achieved its first unmanned supersonic
      flight on May 26, 2026 (Mach 1.21), the first privately funded unmanned aircraft publicly known to exceed
      the sound barrier during active flight testing—a milestone cited directly by the Air Force as evidence
      Hermeus can deliver on its commitments.
