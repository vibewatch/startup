      - number: '8.3'
        title: 可比公司与估值框架
        blocks:
          - type: paragraph
            body: >-
              没有直接可比的上市公司——Hermeus 尚无收入、聚焦国防、无人化、邻近高超音速，这一画像不匹配任何上市航天或国防主承包商。最有用的参照组是后期私营国防科技公司：Anduril（$61 billion，2026
              年 5 月 Series H，2025 年收入 $2.2 billion）、Shield AI（$12.7 billion，2026 年 3 月 Series G，2025 年收入估计 $300
              million）和 Saronic（$9.25 billion，2026 年，海上自主）。这些可比对象意味着，已有收入且政府合同位置强的国防科技平台，可获得 14–42× 远期收入倍数。Hermeus 估值 $1
              billion 且未披露收入，处在这一类别的收入前边界——本质上是一个里程碑期权，而不是收入倍数故事。

              最近的产品类比是 Boom Technology（商业超音速，截至 2025 年 12 月估值 $1.5 billion），同样没有生产收入，也同样把价值锚定在政府认可的里程碑和市场创造潜力上。Boom 的
              XB-1 于 2025 年 1 月由人类飞行员驾驶完成超音速飞行；Hermeus 的优势是无人国防角度，相比 Boom 的商业认证路径，近期收入路径更清晰。上市国防主承包商 Lockheed Martin（通过
              SR-72 概念成为 Hermeus 隐含长期竞争者）约以 1.6× 过去十二个月收入交易，为成熟生产阶段项目提供估值底部概念。market.us 研究估计，高超音速飞机市场将从 2024 年的 $1.5
              billion 增长到 2034 年的 $2.8 billion，CAGR 为 6.5%；Mordor Intelligence 将更广义高超音速武器市场规模估为 2025 年 $8.24 billion，到
              2030 年增至 $14.78 billion，CAGR 为 12.4%。仅 U.S. DoD 在 FY2025 就为高超音速系统预算 $6.9 billion，较 FY2023 增长
              47%，为成功平台留下了可观采购空间。
