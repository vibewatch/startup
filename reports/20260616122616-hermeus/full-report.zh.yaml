      - number: '8.4'
        title: 情景分析与下行风险
        blocks:
          - type: paragraph
            body: >-
              鉴于公司仍处收入前阶段，估值最好用里程碑概率情景来框，而不是用收入倍数。多头情景要求 2027 年上半年完成 Mach 3 飞行、2029–2030 年拿到 Darkhorse
              生产合同、赛道估值继续重定价；如果当前技术轨迹维持，这些都可达成。基准情景假设进度小幅滑移（2027 年底达到 Mach 3）、DIU 里程碑付款延续，并以不低于当前估值完成后续 Series D，同时
              Darkhorse 商业化推迟到 2030 年代初。空头情景由技术或采购失败驱动：如果 Mach 3 滑到 2028 年之后，相对现有主承包商的竞争窗口会收窄，债务契约开始承压，降价轮或政府项目改道将变得可能。

              主要下行风险包括：（1）单一客户集中——几乎所有收入都流经美国政府，具体是 Air Force 和 Navy 的 DIU 渠道；（2）DOGE 采购不确定性——FY2026 预算出现 $11 billion+
              国防效率削减，R&D 咨询服务是主要目标；（3）CEO 交接——Zach Shore 从 AJ Piplica 手中接棒，恰逢超音速飞行，新 CEO 能否维持开发速度和政府关系尚未验证；（4）债务义务——$150
              million 风险债带来固定义务，在下行情景中会让股权融资选项更复杂；（5）高超音速项目系统性风险——GAO 记录，六个 DoD 高超音速项目中有四个尚未采用现代数字工程实践，HACM
              设计评审晚了六个月，成本估计超过基线，说明 Hermeus 的管线客户自身也面临采购逆风。
            claimRefs:
