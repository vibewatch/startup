        title: 附录
        blocks:
          - type: callout
            title: TBCC 飞行演示是近期投资逻辑的关键测试
            body: >-
              对 Hermeus 来说，最二元的风险是 Chimera II TBCC 发动机能否在 Quarterhorse Mk 3 上成功完成从涡喷到冲压的飞行中模式转换。该里程碑预计在 2026–2027
              年尝试；在跑道起飞车辆中，这一规模没有飞行先例。如果失败，最好也要重组项目，最坏则会击穿投资逻辑，因为 Darkhorse 的作战可行性和整条 Mach 5+ 路线图都取决于它。
