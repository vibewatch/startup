  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反逻辑
        blocks:
          - type: paragraph
            body: >-
              Hermeus 的多头逻辑，建立在独特技术进展、政府验证和有利赛道宏观三者叠加之上。公司 2026 年 5 月完成首个私营资金支持的无人超音速飞行（Mach 1.21），这是 Mk 2.1 首飞后仅 85
              天的第三次试飞；这种开发速度在现代航空中没有先例。Pentagon 的 Defense Innovation Unit 已通过两次合同行动承诺 $219 million（2023 年 11 月原始合同，加
              2026 年 5 月修改），验证 Air Force 和 Navy 认为 Hermeus 平台具备作战用途。投资方包括 In-Q-Tel（CIA 的风险投资机构）、RTX Ventures（其子公司供应 F100
              发动机）、Founders Fund 和 Khosla Ventures，均具备深厚国防领域尽调能力。国防科技风险投资仅 2026 年 Q1 就达到创纪录的 $4.5
              billion+，这压低了市场对依赖里程碑的国防硬件所用折现率。

              反逻辑同样重要。从生产角度看，Hermeus 完全处于收入前阶段；所有资金来自开发合同和股权融资，不是经常性产品收入。$1 billion 估值内嵌很大的期权溢价：达到 Mach 3（目标 2027
              年上半年）、完成 Darkhorse Mach 5 飞行器、拿到规模足以支撑投后估值的生产合同，这些都尚未证明。GAO 关于 DoD 高超音速项目的研究记录了普遍进度延误和成本超支（HACM
              首次设计评审晚了六个月；LRHW 滑至 FY2025），意味着 Hermeus 的政府客户自身也有项目不稳定性。CEO 交接——Zach Shore 于 2026 年 5 月下旬接替创始人 AJ
              Piplica——在关键拐点引入领导层执行风险。DOGE 推动的效率审查在 FY2026 从 DoD 项目中削减 $11 billion+；尽管 Hermeus 合同目前看似未受影响，R&D 咨询和协助服务却是
              DOGE 的主要目标类别。
