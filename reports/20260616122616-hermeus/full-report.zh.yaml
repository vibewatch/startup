        - 创造相邻采购渠道；Hermeus CEO 已明确瞄准 CCA 竞争力
        - 跟踪 CCA Increment 1 最终生产决定；观察 Anduril / GA 入选的影响
      - - HyCAT 项目需要商业可复用高速测试台
