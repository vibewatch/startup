      - number: '7.2'
        title: 国防采购、预算与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              Hermeus 当前 100% 收入来自单一客户类别——美国政府国防机构——全部签约收入都集中在 Defense Innovation Unit（DIU）工具中；2026 年 5 月合同修改后，总额为
              $219M。这种极端客户集中意味着，任何合同终止或不续约，都会让收入接近归零。风险还被 Pentagon FY2026 高超音速武器预算削减 43% 明显放大，预算从 $6.9B 降至
              $3.9B；与此同时，中国和俄罗斯等对手已经部署高超音速助推 - 滑翔系统。DOGE 推动的 DoD 支出「效率提升」削减 $11.1B，进一步制造采购不确定性，小企业和咨询承包商受冲击尤其重。House
              Armed Services Committee 的 FY2027 NDAA 草案明确指出，DoD 尚未完成把高超音速技术从科学与技术转入重大采办项目——这对 Hermeus
              的项目化路径构成直接结构性威胁。尽管多年定向投入，DoD 尚未部署任何作战型高超音速平台，国会要求拿出成果的压力逐年加大。如果采购模式回归传统主承包商（Lockheed Martin、Northrop
              Grumman）——两者都有活跃的保密高超音速项目——即便 Hermeus 按期达成技术里程碑，也可能面对合同不续约。早期 AFWERX 种子合同（2020 年 $1.5M、2021 年 $60M）很早把
              Hermeus 锚定在 DoD 生态内，但锚定带来依赖，也带来机会。如果项目优先级变化，单一承包客户 100% 集中就是击穿投资逻辑的风险。
