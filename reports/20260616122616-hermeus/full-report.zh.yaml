      - number: '6.4'
        title: 附录
        blocks:
          - type: callout
            title: 单一客户集中与试点到项目缺口
            body: >
              Hermeus 100% 依赖美国联邦政府合同，DIU 是唯一主合同工具。从 DIU OTA 演示转入军种正式列装项目，是最重大的业务风险：DIU 的 $219M 上限本身无法资助生产，国会也在 FY2027
              NDAA 草案措辞中明确指出，DoD 未能把高超音速项目转入重大采办。高超音速拨款削减 43%，叠加 Hermeus 自 2023 年以来 $1.8M+
              游说支出，凸显出这条管线的结构性脆弱：它依赖单一政府客户生态，把原型推进到机队。
            calloutType: risk
            claimRefs:
              - CU026
              - CU027
              - CU028
              - CU031
