  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入与现金消耗
        - Hermeus 不披露收入、季度现金消耗或现金头寸
        - 没有现金消耗率，现金跑道只能猜；$350M 可能撑 18–36 个月，取决于假设
        - 公司（资料室）；通过尽调查看银行流水
      - - DoD 合同管线
        - 除 DIU 工具外，Hermeus 正在竞争哪些具体项目并未公开
        - 合同管线决定 $1B 估值是由可识别收入支撑，还是纯粹的期权溢价
        - 公司；DoD 合同授予数据库（USASpending、SAM.gov）
      - - 股权结构与清算优先权栈
        - 未披露股权结构；6 轮股权融资叠加 $150M 债务，优先级和转换条款未知
        - 中等退出情景下，普通股持有人在高级优先权之后可能所剩无几；这是回报建模的关键
        - 公司（资料室）；审查条款清单
      - - Mach 3 里程碑合同条款
        - DoD 里程碑付款是否绑定具体速度 / 性能门槛并未公开
        - 里程碑付款结构直接影响现金跑道和下轮融资风险
        - 公司；DIU 合同 FOIA 申请或直接尽调
      - - 现金消耗率 vs. DIU 里程碑付款
        - 净现金头寸轨迹（现金消耗扣除 DoD 里程碑付款）未知
        - 决定 Series D 时间点是被迫融资（现金低）还是机会型融资（现金跑道充足）
        - 公司财务团队，在尽调中确认
      - - 竞争性采购格局
        - 并非所有追逐同一 DoD 高超音速可重复使用飞机任务的公司都已公开
        - 下一次竞争性授标中，若 Hermeus 面对已有资金支持的传统主承包商，赢得生产合同的概率会急剧下降
        - DoD 合同征询；行业日参会名单；如可接触，查看涉密简报
    notes: 六项都对投资决策具有实质性影响；仅靠公开来源无法解决任何一项。
