  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与政府合同结构
        blocks:
          - type: paragraph
            body: >-
              Hermeus 的收入模式完全锚定美国政府研究、开发、测试与评估（RDT&E）合同，结构是 Other Transaction Agreements（OTAs）——一种让 DoD 比传统 FAR
              合同更快行动的采购工具。公司按明确技术里程碑收款（飞行测试、子系统演示、数据交付），而不是按订阅、产品销售或单机交付收费。它没有商业收入，没有经常性软件或服务收入，也没有 ARR。

              当前最大合同是 Defense Innovation Unit HyCAT（Hypersonic and High-Cadence Airborne Testing
              Capabilities）OTA。Hermeus 于 2023 年 11 月通过约 $23M 初始授予启动该合同，2026 年 5 月又追加 $159M，使总上限达到 $219M——Hermeus 和 DIU
              均称其为该机构有史以来金额最大的 OTA 之一。2026 和 2027 年与 USAF、Navy 的飞行测试将在完成里程碑后消耗该上限。Hermeus 还持有 2021 年 $60M 联合出资 USAF
              StratFI 合同（AFLCMC/AFRL/VCs），用于 Quarterhorse 原型项目；2020 年 $1.5M AFWERX Air Force One 可行性研究；以及 2022 年 6 月授予、由
              27 家供应商共享、上限 $950M 的 JADC2 IDIQ 池（FA861222DB016）席位；该 IDIQ 的实际任务订单授予额未公开。

              Hermeus 现在明确把 Quarterhorse Mk 2 作为独立军用产品营销——它比有人战斗机更便宜，并可与 Collaborative Combat Aircraft 项目竞争——但截至 2026 年
              6 月还没有生产合同或正式列装项目。第三方合同分析数据（Obviant via Tectonic Defense）报告 Hermeus 迄今实际政府合同授予额为 $78.5M，而 DIU OTA 上限为
              $219M，说明上限授权与已提取现金之间有区别。所有当前合同都处于量产前 RDT&E 阶段。公司的“Department of
              War”品牌表达了它对国家安全任务的刻意单一客户聚焦；这能简化近期收入生成，但也集中客户风险。
