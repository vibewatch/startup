          - type: callout
            title: 政府客户背书深度异常突出
            body: >
              对处于演示阶段的创业公司来说，政府客户背书的质量和具体程度都异常强。DIU 最高级别军事官员公开把 Quarterhorse 与量产和武器化挂钩。Air Force Test Center
              为一条全新的适航路径嵌入工程师。Kratos 这家拥有 $1.45B 项目的大型国防主承包商，也选择 Quarterhorse
              作为测试平台组件。即使正式生产合同尚未跟上，这些信号合在一起，仍说明机构客户信心很高。
