        - 释放现金消耗超过现金跑道的信号；重组带来的股权稀释可能很大
        - 重新评估资本结构；持仓方有显著稀释风险
    notes: 终止触发器是击穿投资论点的事件，不是常规经营风险；任一触发器出现，都应立即重新评估持仓。
    claimRefs:
