  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 国防和高速无人飞机竞争者
        blocks:
          - type: paragraph
            body: >-
              Hermeus 最直接的国防竞争者分三类：高超音速测试基础设施提供商、Collaborative Combat Aircraft（CCA）开发商，以及瞄准同一速度区间的保密主承包商。

              Stratolaunch 运营可重复使用的 Talon-A 载具，作为 Pentagon 合同下的 Mach 5+ 测试服务。2026 年 3 月 6 日，它与 U.S. Missile Defense
              Agency 完成 FEX-04，这是公司自 2024 年 12 月以来第三次确认的高超音速飞行。Stratolaunch 的商业模式是测试容量提供商，而非作战载具制造商，因此与 Hermeus
              的直接产品重叠有限；但它会争夺政府高超音速技术资金，也证明空射、可重复使用高超音速飞行在当前资本条件下可以实现。Stratolaunch 的 Spirit of Mojave（Boeing 747-400
              载机）支持全球范围测试运营，扩大了客户基础。

              Anduril Industries 于 2026 年 3 月在俄亥俄州 $1 billion Arsenal-1 工厂进入 YFQ-44 Fury 低速率生产。Fury 与 General Atomics
              YFQ-42 一同入选 USAF CCA Increment I，目标 Mach 0.95，使用 Williams FJ44-4M 涡扇，尺寸约为 F-16 的一半。Anduril 已获得约 $5B
              风险资金，目标年产能 150 架，带来 Hermeus 尚未建立的制造规模。Kratos XQ-58A Valkyrie 已在 Oklahoma City 投产，已与 F-35、F-22 和 F-15EX 完成
              20 多次作战相关演示飞行，并在 2026 年 1 月与 Northrop Grumman 一起获得 USMC MUX TACAIR CCA 项目 $231.5M OTA。Kratos 的可消耗 $4–10M
              单机模型支持规模采购。Anduril 和 Kratos 目前都不瞄准 Mach 3+，这为 Hermeus 留出它想占据的速度区间缺口；但两者已经捕获了当前政府客户可能愿意用较低速度满足的任务需求。

              Lockheed Martin 的 SR-72 “Son of Blackbird” 是 Mach 6 TBCC 领域的主承包商既有玩家。Wikipedia 和国防分析师指出，截至 2026
              年初，它仍是设计概念，尚无公开确认试飞，可能在 2030 年代服役。2026 年 3 月一篇 19FortyFive 分析警告，该项目可能成为“$10 billion 错误”，理由是极端热载荷管理挑战和 TBCC
              发动机转换复杂性——这些也是 Hermeus 面对 Chimera 的风险。如果保密 SR-72 推进，Lockheed 将从潜在合作者变成占优既有玩家，手握数十年 SR-71 IP、Skunk Works
              资源和直接空军关系。
