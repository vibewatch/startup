  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与产品架构
        blocks:
          - type: paragraph
            body: >-
              Hermeus Corporation 是一家风险投资支持的国防航空公司，2018
              年创立于佐治亚州亚特兰大，面向国家安全客户，快速设计、制造并测试高马赫和高超音速飞机。公司公开使命是用高速无人飞机交付能力，让美国及其盟友相对对手获得非对称速度优势；节奏要贴近现代战场，而不是传统国防采购动辄十年的周期。它的主要客户是
              Department of War（此前为 DoD），在扩大的 DIU 合同下，美国空军和美国海军作为作战伙伴参与。

              核心产品架构分三层。第一层是 Chimera 发动机家族——一种涡轮基组合循环（TBCC）发动机，低速时以涡扇方式运行，高马赫数时让空气绕过涡轮并接入冲压发动机。Hermeus 于 2022 年 11
              月演示了从涡喷到冲压的转换，使 Chimera 成为全球首个商业开发的 TBCC 发动机。第二层是 Quarterhorse 验证机家族——四架能力逐步提升的飞机。Mk 0 是不飞行的动态铁鸟；Mk 1（GE
              J85 动力）于 2025 年 5 月在 Edwards AFB 验证高速起降；Mk 2.1（Pratt & Whitney F100，F-16 级尺寸）在 2026 年 5 月 26
              日成为全球首架私人资助的无人超音速喷气机，仅第三次试飞就达到 Mach 1.21。Mk 2.2 和 2.3 计划在 2026–2027 年推出，之后 Mk 3 将集成 Chimera II，目标 Mach
              3.3+。第三层是 Darkhorse UAS——由 Chimera II 搭配 Pratt & Whitney F100 核心驱动的多任务、可重复使用高超音速无人机，目标是在国防作战中规模化部署。Halcyon
              是一款商业客机，设想 90 分钟完成纽约到伦敦航程；公司转向国防市场后，它仍是长期愿景。Hermeus 在四地运营：乔治亚州亚特兰大（110,000 sq ft 工程与制造总部）、加州 El
              Segundo（新原型总部）、佛罗里达州 Jacksonville（高超音速推进 HEAT 测试设施）和 Washington DC（贴近政策）。
