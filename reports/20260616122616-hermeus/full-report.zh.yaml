      - number: '7.3'
        title: 监管、安全与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              Hermeus 站在三套不同监管制度的交叉点，每一套都带来独立的实质性风险。第一，14 CFR §91.817 禁止民用飞机在美国领土上空超过 Mach 1；Hermeus 获得了仅限实验测试飞行的
              Special Flight Authorization（SFA），有效期至 2026 年 12 月 31 日，地点在 White Sands Missile Range。2025 年 6 月的
              Executive Order 要求 FAA 取消陆上超音速禁令，并在 2027 年 6 月前完成商业噪声认证标准，这形成政策顺风；但 Supersonic Aviation Modernization
              Act（H.R. 3410）于 2026 年 3 月通过 House 后，尚未通过 Senate——商业超音速框架仍不确定。如果商业认证标准未能按要求在 2027 年前定稿，Halcyon
              的整个民用商业逻辑都会被堵住。第二，International Traffic in Arms Regulations（22 CFR Parts 120–130，执行 22 U.S.C. §2778）将
              Hermeus 所有技术、技术数据和国防服务纳入严格出口管制。除非获得 State Department DDTC 的出口许可，否则每名员工、承包商和合作伙伴都必须是「U.S.
              person」，这严重限制全球人才池和所有国际合作机会。视同出口违规可能导致刑事处罚和合同终止。第三，Halcyon 商用飞机需要依据 14 CFR Part 25（运输类飞机）取得 FAA Type
              Certificate；Mach 5 下这一流程没有任何既有先例，也没有预计时间表。Hermeus 以 $90,000 聘请 Holland & Knight 进行 FAA
              和国防游说，说明公司正在主动推进监管路径，但仍处早期。
