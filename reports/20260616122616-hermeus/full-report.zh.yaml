        title: 市场规模——来自国防预算和分析师报告的多重视角
        blocks:
          - type: paragraph
            body: >
              没有一个已发布估算能干净覆盖 Hermeus 的可服务市场，因为公司占据的是一个新颖细分，横跨高超音速测试基础设施、无人作战飞机和先进推进。这里采用五个不同规模视角；它们不应相加。

              最宽口径是全球高超音速技术市场（覆盖导弹、滑翔飞行器、空天飞机和飞机）：The Business Research Company（TBRC）估算 2025 年为 $8.46B，2026 年增至
              $9.46B，CAGR 为 11.8%。更宽的全球高超音速飞行市场口径（飞机和航天器合并）由 Precedence Research 估算 2025 年为 $11.43B，2026 年预计为
              $14.46B（CAGR 26.51%）。这两个估算差异很大，因为 Precedence Research 的方法更宽，纳入商业和政府航天器；TBRC 则聚焦武器级高超音速系统。Stratistics MRC
              给出的最窄飞机专属口径，将高超音速飞机市场估在 2026 年约 $1.6B。

              从国防预算视角看，Congressional Research Service 2025 年 8 月更新确认，Pentagon FY2026 高超音速研究预算请求为 $3.9B——低于 FY2025 的
              $6.9B——反映削减和组合整合。更宽的 DoD FY2026 无人和远程操控航空器预算为 $9.4B（覆盖所有军种），自治和自主系统总预算线为 $13.4B。空军 CCA 项目在 FY2026 RDT&E
              中专门获得 $789.4M（取决于调和法案；没有该法案仅 $111M），采购则从 FY2027 开始，约 30 架首批机体对应 $996.5M。

              Hermeus 经政府确认的 SAM 下限来自其实际签约管线：DIU/HyCAT 合同总上限 $219M（至 2027 年）、此前 $60M AFWERX 后续合同，以及参与 Kratos 牵头的 $1.45B
              MACH-TB 项目中的分包价值。截至 2026 年中，Hermeus 可核验 DoD 授予额超过 $280M。这是下限，不是上限：如果转入 CCA
              生产项目或独立高马赫打击平台，收入潜力会阶跃式上升；但转化尚未发生，且有采用风险。

              全球超音速喷气机市场（主要是军用超音速战斗机；商用超音速尚未运营）2025 年为 $29.5B，Fortune Business Insights 预计 2026 年为 $31.4B，CAGR
              4.8%。Hermeus 今天不在这个市场竞争——其 Quarterhorse 是超音速，但无人且仍处原型状态——但如果公司成功扩展到作战无人高马赫飞机，这个市场能说明长期品类潜力。

              分析师估算彼此矛盾，应谨慎看待：$1.6B 的高超音速飞机专属估算，与 $14.46B 的高超音速飞行市场估算相差近 9×，反映的是方法范围差异，而非测量误差。投资者和决策者应锚定已验证的 DoD
              预算线和合同数据，而不是二级市场报告。
