  - id: TE003
    title: Chimera TBCC 技术和运行架构
    columns:
      - 层级 / 部件
      - 角色
      - 关键依赖
      - 技术风险
    rows:
      - - Chimera 涡轮核心（P&W F100）
        - 亚音速和低超音速推进；跑道起飞至约 Mach 1.5
        - Pratt & Whitney 供应链；RTX Ventures 重叠
        - 单一来源发动机供应；加力燃烧室在循环高速使用下的寿命
      - - Hermeus 专有预冷器
        - 换热器把涡轮上限从约 Mach 1.5 拉到 Mach 2.5+；冷却进气滞止空气
        - Hermeus 专有设计；没有商业替代方案
        - 新型换热器承受极端 delta-T；循环加热下材料疲劳；尚未在持续超音速飞行中验证
      - - 可变几何进气道
        - 管理激波结构和气流分流；向涡轮与冲压两种模式输送调理后的空气
        - 一体化机体设计；机加工几何精度
        - 激波定位错误会导致进气道不起动；高超音速 Mach 下公差叠加
      - - 旁通管道 / 隔离段
        - 冲压模式下引导高 Mach 气流绕过涡轮核心；Mach 2.8 以上保护旋转叶片
        - 与机体集成；高温合金供应
        - 极端 Mach 下热循环疲劳；管道几何必须防止流动分离
      - - 冲压燃烧室级
        - 吸气式高超音速燃烧（Mach 3–5+）；TBCC 冲压模式下的主推进
        - 高温燃烧室材料来源；HEAT 设施验证
        - 截至 2026 年 6 月尚未飞行测试；持续燃烧稳定性尚未在规模化状态下证明
      - - 三角翼机体 / 热防护
        - 超音速 / 高超音速升力和稳定性；前缘和表面热防护
        - 钛和复合材料供应链；专业化制造
        - Mach 3 以上前缘热载荷；持续 Mach 3+ 下 TPS 耐久性的公开数据有限
      - - GNC / 自主栈
        - 无人运行所需的实时飞控、导航和任务管理
        - 地面控制上行链路可靠性；高超音速高度下的 GPS 精度
        - 高超音速下信号时延和潜在等离子体鞘 GPS 中断；没有公开技术披露
      - - 地面控制飞行甲板
        - 远程无人操作；任务下达；紧急接管
        - 安全上行链路；FAA 批准的地面站设计
        - 高超音速通信中断风险；每个飞行增量都需要 FAA 授权
      - - HEAT 地面测试设施
        - 用高 Mach 污染气流在地面模拟高超音速发动机工况
        - Jacksonville FL Cecil Airport 的既有 Navy 基础设施；未来扩建资金
        - 地面对真实高超音速飞行工况的模拟仍不完整；Phase 2 扩建需要连续高 Mach 气流
    notes: TRL 评估由分析师根据公开里程碑推断；Hermeus 不发布 TRL 数据。截至 2026 年 6 月，冲压燃烧室面向飞行准备度的 TRL 估计低于 5。依赖列反映每一层最受限制的外部约束。
