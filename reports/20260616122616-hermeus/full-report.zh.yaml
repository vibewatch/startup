        - 约束
        - 中期
        - 单架原型机前期成本高（约 F-15 成本区间）；大规模生产可行性未获验证
        - 要求提供单位经济模型；对标 Anduril YFQ-44A 和 GA YFQ-42A 成本目标
      - - 国会怀疑态度 / 转化计划要求
        - 约束
        - 2026–2027
        - HASC 要求 DoD 在 2027 年 3 月前提交高超音速转化战略；延误可能冻结预算
        - 跟踪 Senate Armed Services Committee 对高超音速正式采办项目时间的立场
      - - 各军种削减武器 / 飞机项目以覆盖平台超支（Atlantic Council）
