            title: 债务悬顶风险——$150M 结构化债务，契约未披露
            body: >-
              Series C 中的 $150M 风险债，对 Hermeus 这个研发阶段的硬件创业公司来说，是一个突出的结构性风险。债务不同于股权，附带契约义务和固定还款表。如果 Quarterhorse Mk 2.2 和
              2.3 的飞行测试出现重大延误——航天研发中很常见——公司可能在拿到生产合同前就承受偿债压力。契约条款、到期日和利率均未披露。投资人应把这笔债务视为实质性闸门风险，需要完整审阅条款清单。
            calloutType: risk
