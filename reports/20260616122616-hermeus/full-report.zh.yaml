      - number: '3.2'
        title: 商业超音速和军民两用高超音速挑战者
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic 是资本最充足的商业高速航空公司，已融资约 $1 billion。其 XB-1 验证机在两次超音速飞行中达到 Mach 1.1+，完成 Overture
              气动和“无爆震巡航”噪声轮廓验证后，于 2025 年 2 月退役。Overture 目标 64–80 名乘客、Mach 1.7、航程 4,250 nm，约 2030 年商业投入，并获得
              United、American 和 Japan Airlines 承诺。Boom 的 Mach 1.7 速度区间远低于 Hermeus Halcyon 的 Mach 5
              目标，两者位于不同市场层级、经济性不同：Boom 在重建 Concorde 市场，而 Hermeus 必须在 Boom 之上创造一个全新价格点。行业怀疑者指出，Boom
              面临北卡罗来纳工厂制造延误、认证复杂度，以及规模化运营成本与票务收入是否匹配的未解问题。

              Destinus 是一家瑞士—荷兰航空航天创业公司，同时瞄准国防无人机和商业高超音速航空。它通过股权、可转债和银行授信累计融资约 €400 million——包括一条 €50M Commerzbank
              授信——截至 2026 年中正在进行 $200M pre-IPO 轮融资。2022 年后，Destinus 果断转向国防：乌克兰是确认客户，每月接收 100+ 架无人机（Lord、Hornet 和 Ruta
              变体）；Destinus 官网如今聚焦 Kryla（饱和巡航）、Hornet Block 1/2（拦截机）和 Ruta Block 1/2/3（纵深打击）产品。2026 年 4 月，Destinus 与
              Rheinmetall 宣布成立 Rheinmetall Destinus Strike Systems（51/49 JV），开发 700-km 巡航导弹和弹道火箭炮。2025 年 8 月收购瑞士 AI 公司
              Daedalean（约 $223M），补上自主飞行技术。Destinus 是与 Hermeus 军民两用战略最接近的欧洲参照，但瑞士中立出口约束——部分被荷兰总部迁移缓解——限制了它进入美国市场。

              Venus Aerospace 是休斯敦创业公司，已融资 $106M+，战略投资人包括 Lockheed Martin Ventures；其旋转爆震火箭发动机（RDRE）已在 2024 年 5 月以 2,000
              lb 推力完成飞行验证。其 Stargazer Mach 9 客运概念仍未产生收入且停留在概念阶段。Venus 与 Hermeus 的竞争更多发生在推进供应链，而非整机集成竞争；但 Lockheed
              的股权投资说明主承包商在多种推进路径上分散押注。
