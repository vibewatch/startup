      - number: '7.5'
        title: 制造、人才与执行风险
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Hermeus 缺少专用生产设施；CEO Shore 明确表示，建设生产设施将是未来融资重点，意味着每年 12–15 架飞机的目标仍是愿景，依赖一轮尚未融到的钱。2026 年 6 月 1
              日，CEO 从创始 CEO AJ Piplica 交接给新任 CEO Zach Shore，在原型验证到生产规模化之间这个最关键拐点，引入关键人风险。Piplica 转任 Executive
              Chairman，但运营领导权现在落到 Shore 手中，而他任职时间还只能按天计算。Hermeus 约有 275–299 名员工，开放岗位超过 100 个，显示招聘压力很大；ITAR 的 U.S.-person
              要求又限制人才市场，排除了全球大多数航天工程劳动力。公司 2026 年 4 月宣布将总部从 Georgia 州 Atlanta 迁至 California 州 El Segundo，可能导致不愿搬迁的
              Atlanta 员工流失。NDIA 将美国高超音速工程人才短缺列为国家级战略脆弱点；多数专家集中在国防主承包商，后者能给出比创业公司更高的总薪酬和更强的工作稳定性。Hermeus
              快速迭代硬件路线（约每年「制造并测试」一架飞机）压缩了开发时间线，但也压缩了在项目里程碑前解决材料和制造工艺失败的时间——每损失一架飞行器，都会拉长进度并烧掉资本。NDIA 和 Atlantic Council
              都将高超音速级材料（先进复合材料、碳 - 碳、高温合金）的供应链脆弱性列为美国国家风险，多数供应商只适配低速率生产。
