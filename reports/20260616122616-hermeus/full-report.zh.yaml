      - number: '1.3'
        title: 资本历史、投资人与估值
        blocks:
          - type: paragraph
            body: >-
              Hermeus 已经形成结构清晰的资本历史：五轮正式融资，加上可观的政府合同收入。2019 年种子轮（约 $2.1 million）由 Khosla Ventures 领投。Series A（$16
              million，2021 年）由 Canaan Partners 领投，Khosla、Bling Capital 等参投。Series B（$100 million，2022 年 3 月）由当时担任 Y
              Combinator 总裁、OpenAI CEO 的 Sam Altman 领投，Peter Thiel 的 Founders Fund（两者均为新进入股东）、In-Q-Tel（CIA
              投资机构）和既有投资人参投。RTX Ventures（Raytheon Technologies）在 2022 年 5 月跟进战略投资，加深了与 Pratt & Whitney 发动机的关系。Series
              C（$350 million，2026 年 4 月 7 日）由回归领投的 Khosla Ventures 主导，结构为 $200 million 股权和 $150 million 债务。股权共同投资人包括
              Canaan、Founders Fund、RTX Ventures、Bling、In-Q-Tel、通过 Socium Ventures 参与的 Cox Enterprises、Destiny
              Tech100、Georgia Tech Foundation、137 Ventures 和 GSBackers。债务来自 Silicon Valley Bank（First
              Citizens）、Pinegrove VP、Hercules Capital 和 Trinity Capital。CEO Piplica
              指出，债务部分是有意安排：“如果我们能用非稀释方式为大部分支出融资，那绝对应该这么做。”

              Series C 将累计融资推高到 $500 million 以上，并确立 $1 billion 投后估值，使 Hermeus
              跻身独角兽。收入、ARR、毛利率和烧钱速度指标均未公开披露。公开可见的财务指标只有政府合同授予额——$219 million DIU 上限，以及此前 USAF 和 AFWERX 合同合计约 $82
              million——这些并不等于全部收入确认。准确的私营财务指标需要直接尽调访问管理账目。
