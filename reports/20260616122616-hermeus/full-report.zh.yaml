  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术执行与推进风险
        blocks:
          - type: paragraph
            body: >-
              Hermeus 的核心技术押注是 Turbine-Based Combined Cycle（TBCC）Chimera 发动机；它必须在 Mach 2–3
              交接包线内，于飞行中顺畅完成涡喷到冲压模式转换。唯一已演示的模式转换，是 2022 年底在 University of Notre Dame 用较小的 Chimera I（GE J85
              核心）完成的地面测试；全尺寸 Chimera II 搭配 Pratt & Whitney F100 预冷器和集成冲压模块，尚未在飞行中测试。Quarterhorse Mk 2.1 于 2026 年 5 月 26
              日达到 Mach 1.21——美国首个私营资金支持的超音速无人飞行——但只用了涡轮，没有用冲压。Mach 1.21 到 Chimera II 目标 Mach 3.3+
              之间，横跨大量未知工程区：可变几何进气道转换、旁通管道管理，以及超过 1,000 °C 的气动热载荷。从 Mach 3.3+ 到 Darkhorse 作战目标 Mach
              5+，还要再跨一大步；可重复使用、跑道起飞车辆在这一点上没有已演示先例。FAA 只授权到 2026 年 12 月 31 日前进行七次超音速试飞，严重限制风险降低节奏。材料科学是系统性瓶颈：NDIA
              将美国高超音速级耐热复合材料和碳 - 碳部件供应链列为国家级脆弱点，多数供应商只适配低速率生产。Hermeus 在 Jacksonville 启用 HEAT
              设施一期以加速发动机测试，但该设施无法解决上游供应商约束。CEO Shore 承认，研发期间预计会摔飞机，说明逐步损失飞行器是计划内事件，不是边缘案例。
            claimRefs:
