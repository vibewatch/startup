      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Hermeus 的收入质量在政府合同这一维度很高——来自 DIU 和 USAF 的 OTA
              带来制度背书，也有里程碑闸门约束——但管线很窄：客户类别单一，平台项目单一，而且完全处于商业化前阶段。收入模式不是经常性收入，也不像软件，除非拿到尚未授出的生产合同，否则无法规模化。以公司阶段看，这并不意外；但任何用收入倍数估值的方法，都会被这一点卡住。

              最重大的财务风险包括：（1）政府支出集中——DoD 高超音速 RDT&E 预算从 FY2025 的 $6.9B 降至 FY2026 的 $3.9B，降幅 43%，说明该条线并不免疫预算压力；国会也明确指出 DoD
              尚无任何已部署的高超音速平台；（2）$150M
              结构化债务带来固定还款节奏，叠加重资本硬件研发，一旦任何大型试验推迟，财务腾挪空间会收窄；（3）公司尚无专用制造设施，未来为生产爬坡融资，很可能需要证明当前还看不到的商业化生产经济性；（4）Hermeus
              没有正式列装项目，也没有 USAF 或 Navy 的多年采购承诺，意味着 2027 年之后的所有收入，都取决于政府尚未作出的决定。

              Robotics Press 将投资逻辑概括为「有吸引力，但护城河很窄」——可信的技术里程碑能撑起叙事，但 $1B 估值与一家仍在飞行测试、尚无确认生产收入的公司之间，确实存在落差。独立分析也指出，从 DIU
              风险降低 OTA 走到多年拨款的正式列装项目，中间要穿过 DoD 预算政治和主承包商竞争；单靠任何一次飞行测试结果，都无法保证这条路打通。

              关键尽调问题包括：经审计或审阅的财务报表（私营公司，未披露）、已确认的月度烧钱额、合同现金提款节奏和积压订单、剩余 DIU 款项的具体里程碑触发条件、12–15 架 /
              年产能下的单机制造成本模型、债务契约条款、下一轮融资触发阈值，以及 Hermeus 的 IR/M&A 或 IPO 时间表。
