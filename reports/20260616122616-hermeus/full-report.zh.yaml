      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Hermeus 自 2018 年成立以来，已完成六轮可识别融资：Khosla Ventures 未披露金额的种子轮、Canaan 领投的 $16 million Series A（2020 年）、来自 USAF
              和风险投资人的 $60 million（2021 年）、Sam Altman 2022 年 3 月领投的 $100 million Series B，以及 2026 年 4 月 Series
              C。公司新闻稿确认，累计股权加债务融资超过 $500 million。Series C 结构为 $200 million 股权、$150 million 债务，债务来自 Silicon Valley
              Bank、Pinegrove Venture Partners、Hercules Capital 和 Trinity Capital；对一家 Series C
              硬件创业公司来说，这一结构异常复杂，也反映管理层一边资助大额制造资本开支，一边限制稀释的明确意图。如此规模的风险债说明贷款方对 DoD 合同应收流有一定信心，但也给一家没有产品收入的公司增加了一层固定成本义务。

              从「每单位证据价格」看，$1 billion 投后估值是本轮前已投入总资本（Series C 前股权约 $215 million）的 4.6×。若用 $219 million DIU
              合同总额近似签约积压订单，估值 / 积压订单倍数约为 4.6×——相对于上市国防主承包商偏激进（Lockheed Martin 交易倍数约为 1.6× 收入），但相对于风险阶段国防科技同行偏低（Shield AI
              $12.7 billion 估值意味着倍数远高于 Hermeus 的隐含比例）。关键未知数是 Series C 后烧钱率：三架飞机同时制造、扩张到 El Segundo、员工规模向 300
              人增长，显示季度烧钱很可能显著高于 $30 million；这意味着 $350 million 资金续航可能持续 24–30 个月，具体取决于 DoD 里程碑付款。
