      - number: '5.3'
        title: 测试基础设施、飞行运行与项目里程碑
        blocks:
          - type: paragraph
            body: >-
              Hermeus 运行一套一体化测试基础设施，覆盖地面发动机测试、飞行测试运行和 Atlanta 制造设施。High Enthalpy Air-Breathing Test Facility（HEAT）于 2025
              年 1 月在 Florida 州 Jacksonville 的 Cecil Airport 启用，是唯一由私营部门运营、能够为吸气式推进系统模拟高马赫污染气流的地面试验舱。Hermeus 改造了原 U.S.
              Navy 测试基础设施（1959 年建成，1989 年扩建），约三个月完成一期，用时约为同类新建试验舱的八分之一，成本约为十分之一。HEAT 的初始测试使用 Pratt & Whitney
              F100，未来计划扩展到连续高马赫污染气流，以模拟真实高超音速条件。飞行测试方面，Hermeus 以 New Mexico 州 Spaceport America 为基地，在 White Sands
              Missile Range 空域内运行。经过一年合作，FAA 于 2026 年 3 月 12 日向 Hermeus 的 Quarterhorse Mk 2.1 颁发 Experimental Category
              Special Airworthiness Certificate（SAC-EC）；随后又在 2026 年 4 月签发 Special Flight Authorization，允许其在 2026
              年底前最多进行七次超音速试飞。每个 Quarterhorse 变体的飞行测试数据，都会直接进入下一代设计；该项目在 Mk 2.1 第三次试飞时达成首个超音速里程碑，距离 Mk 1 首飞仅 364
              天。Defense Innovation Unit（DIU）在 2026 年 5 月 / 6 月把与 Hermeus 的合同上限扩大至 $219M，用于资助高马赫飞行和自主载荷释放演示，Air Force 和
              Navy 被列为军种伙伴。Hermeus 也参与 DIU HyCAT 组合，并是 Kratos $1.45B MACH-TB 2.0 合同的子平台。Edwards AFB 的 Experimental Test
              Force 在 Mk 1 运行期间与 Hermeus 合作。
