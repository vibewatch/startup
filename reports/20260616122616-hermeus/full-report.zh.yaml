              在 $350M Series C 中，将来自 SVB、Hercules、Pinegrove 和 Trinity Capital 的 $150M
              设计为非稀释债务，对于一家硬件密集、尚未量产的国防创业公司并不常见。管理层给出的明确理由（据 CEO Piplica）是为资本密集型制造融资，同时不进一步稀释股权结构。若能保持这种纪律，股权持有人的 IRR
              可能改善；但一旦飞行测试节奏滑坡，也会带来 covenant 和覆盖风险。
