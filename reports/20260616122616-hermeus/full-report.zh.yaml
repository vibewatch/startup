      - number: '6.3'
        title: 留存、扩张、集中风险与反向视角
        blocks:
          - type: paragraph
            body: >
              Hermeus 没有商业收入、没有付费订阅者，也没有传统 SaaS 或硬件留存指标（NRR、GRR、churn）。没有标准留存数据时，相关的耐久性信号是政府合同连续性：自 2020
              年建立的每一段合同关系都已续约或扩展，没有授标失效或取消。AFWERX 到 StratFI 再到 DIU HyCAT 的轨迹，显示同一政府生态内客户深度持续加深。但这与商业留存在结构上不同——DoD
              合同连续性受拨款周期、国会指示、项目办公室换届和 OTA 授标权限上限影响，商业 NRR 则不受这些因素约束。集中风险很重：Hermeus 100% 收入来自单一付款方类别（美国联邦政府），DIU
              是主导合同工具。DIU 没有独立采购权限把项目推进生产；任何批量采办发生前，项目必须转入军种项目办公室。CEO Shore 明确认可这一点，称 Mk 2.3 达到 Mach 3 里程碑后，Hermeus
              会「打磨边角」，并与一个军种合作「把飞机转入服役」。House Armed Services Committee 的 FY2027 NDAA 草案称，「Department of Defense
              尚未完成将高超音速武器技术从科学与技术、原型开发和中层采办工作转入重大采办能力」，并要求在 2027 年 3 月前提交转型计划——这直接点出了 Hermeus
              最大采办风险：试点到项目之间的缺口。另一项分析提到，同期高超音速武器开发拨款减少 43%，这是该赛道客户支出的实质性反向信号。Hermeus 的应对是投入直接政府关系（自 2023 年以来游说支出
              $1.8M+），以维持国会支持，并推动有利的 FAA 和 DoD 采办监管；但这些支出更确认了依赖，而不是缓释依赖。扩张方面，CEO Shore 表示 Hermeus 已「非常深入地参与转型讨论」，对象包括
              Air Force 和 Navy；L3Harris 传感器集成合作（通过 Series C 投资方关系正式化）则代表未来 DoD 合同中的潜在子项目收入流。盟国客户被列为未来目标，但没有公开确认的具体协议或
              LOI。
