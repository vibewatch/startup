              CEO Piplica 明确用 $150M 风险债来支持制造产能，而不是稀释股权，这符合重资本硬件创业公司的常见最佳实践。Hercules Capital 和 Trinity
              Capital（熟悉硬件资产负债表的成熟风险贷款机构）以及 Silicon Valley
              Bank（大型科技贷款机构）参与其中，说明债务结构经过专业承销。公司在估值上行阶段减少了股权稀释，但也承担了上文风险提示中的契约和还款义务。
