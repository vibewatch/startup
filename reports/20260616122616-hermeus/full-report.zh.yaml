      - number: '6.2'
        title: 具名客户证明与采用轨迹
        blocks:
          - type: paragraph
            body: >
              对一家尚未量产的国防创业公司来说，Hermeus 的政府客户证据异常强。DIU 的 Military Deputy Maj. Gen. Joseph “Solo” Kunkel 公开表示，如果
              Quarterhorse 能够量产，它「会成为改变战场规则的作战能力」，并确认 DIU 已识别出「大量可将其作为武器使用的场景」。CEO AJ Piplica 表示，「Department of War
              的客户正在密切关注这个项目推进得有多快」，把开发速度包装成竞争信号。Edwards 的 Air Force Test Center（AFTC）Experimental Test Force 直接与 Hermeus
              合作，为 Mk 1 走全新的适航认证流程，并使用 2024 FAA Reauthorization Act 第 927 条进行快速豁免处理——这体现的是机构承诺，不只是交易性合同执行。Kratos Defense
              选择 Hermeus Quarterhorse Mk 2 作为其 $1.45B MACH-TB 合同的一部分，意味着一家大型国防主承包商已把 Hermeus 平台纳入作战测试资产。自 2020
              年以来的采用轨迹，呈现出合同扩展和技术验证持续叠加的模式：从 $1.5M 概念研究，到 $60M StratFI 后续项目，再到 $23M HyCAT 授标，再到当前 $219M 修改。Hermeus
              还披露，已与多个作战司令部就演习支持和试验展开早期讨论，但具体司令部或合同金额尚未公开确认。Quarterhorse Mk 2.1 于 2026 年 5 月 26 日完成首次无人超音速飞行（Mach
              1.21），是公开已知第一架在主动飞行测试期间突破音障的私营资金支持无人机；Air Force 直接引用该里程碑，作为 Hermeus 能履约的证据。
