      - number: '2.3'
        title: 买方、采购路径、增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              Hermeus 当前产品的主要买方，是通过 Department of Defense 采购的美国联邦政府。预算归属被拆成两条：Defense Innovation Unit（DIU）拥有 HyCAT 和其他
              OTA 原型合同，并直接向 Office of the Secretary of Defense 汇报；AFWERX 是空军创新机构，资金来自 RDT&E 和 SBIR/STTR 账户。Air Force
              Life Cycle Management Center（AFLCMC）和 Air Force Futures 掌握 CCA 项目预算。海军作为共同出资伙伴参与 Hermeus 扩大的 DIU 合同，NAVAIR
              是技术对口方。DIU Military Deputy Maj. Gen. Joseph Kunkel 是 Hermeus Quarterhorse
              最积极的公开倡导者，公开呼吁将其量产为一种“改变游戏规则的作战能力”。

              采购遵循三阶段 DoD 路径。第一阶段是通过 OTA 或 AFWERX/SBIR 做原型（Hermeus 目前就在这里）。第二阶段将是 Middle Tier
              Acquisition（MTA），这是一条更快路径，可在五年内快速原型和部署。第三阶段是拥有获批需求和长期资金的完整正式列装项目。截至 2025 年 8 月 CRS 报告，DoD
              尚未为高超音速武器或飞机建立任何正式列装项目。House Armed Services Committee 的 FY2027 NDAA 草案要求 DoD 在 2027 年 3
              月前提交高超音速技术转化计划，显示国会有意逼出决策。

              增长驱动很强。按 CRS 说法，中国和俄罗斯很可能已经部署作战高超音速滑翔飞行器，制造紧迫感并推动 DoD 采购意愿。DoD 将“规模化高超音速”列为六大关键技术要务之一。FY2026 Pentagon R&D
              预算达 $179B，为 Pentagon 史上最高。HyCAT 项目创造了独立于武器项目的商业高超音速测试服务复购需求。Hermeus 的 TBCC Chimera 发动机（2022 年 11
              月演示涡轮到冲压转换）是一项独特推进能力；DARPA 的 High Mach Gas Turbine（HMGT）项目在 2025 年末启动，投入 $10M+ 来成熟竞争性 TBCC 架构，验证了这一技术类别。

              采用约束也很重。没有任何正式列装项目，意味着 Hermeus 完全依赖原型 OTA 合同；这类合同没有长期采购基线，可被修改或缩减。GAO 2024 年 7 月报告发现，DoD
              高超音速项目普遍出现成本和进度超支，HACM 进度落后且成本基线显著超出。测试场容量是关键瓶颈：Hermeus CEO AJ Piplica 于 2025 年 1
              月表示，高超音速测试设施“已经排满一年多”，且成本高到难以承受——这也是 Hermeus 在佛罗里达州 Jacksonville 自建 HEAT 设施的原因之一。ITAR 和 USML
              管制实际上把客户群限制在美国政府和获批 FMS 伙伴。资本强度很高：Hermeus 尚无专用制造设施（Shore 曾表示生产建设需要未来融资），初始产能估计为每年 12–15 架。Atlantic Council
              2025 年 10 月任务组报告发现，DoD 各军种历史上会削减武器项目经费以覆盖平台项目成本超支——这是 Hermeus 尚未解决的结构性风险。
