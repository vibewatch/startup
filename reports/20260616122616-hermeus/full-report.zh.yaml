      - number: '8.5'
        title: 退出就绪度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Hermeus 仍处在 Series C 阶段，短期内没有披露 IPO 路径。更自然的退出顺序会沿着 Anduril / Shield AI 的轨迹走：先证明作战能力，拿下生产合同，再以更高估值融资 Series
              D/E，等年合同收入超过 $200 million、积压订单也足够可信之后再上市。Palmer Luckey 在 2026 年 6 月指出，Anduril 最终 IPO
              是确定且必要的，因为公司要靠公开市场资本竞争更大合同；Hermeus 一旦走出开发阶段项目，这一判断同样适用。另一条退出路径是被国防主承包商战略收购（Northrop Grumman、Lockheed
              Martin、Boeing、RTX）；RTX Ventures 参与 Series C 财团，加上 Pratt & Whitney 的发动机供应关系，构成天然战略锚点。

              关键尽调缺口仍然很大：Hermeus 没有披露收入、烧钱速度、积压订单构成，也没有披露股权结构。六轮股权融资叠加 $150 million 风险债，意味着清算优先权层级不透明。DIU
              合同的具体条款、收入是按里程碑、工时材料还是成本加成确认，外界也看不到。投资人要给出买入建议，至少需要核实：实际季度烧钱速度、$219 million DIU 项目之外的 DoD 合同管线、绑定合同里程碑付款的
              Mach 3 预计试飞日期，以及 $1 billion 估值节点下的清算优先权堆栈计算——这决定了中等结果情景里普通股能回收多少。
            claimRefs:
