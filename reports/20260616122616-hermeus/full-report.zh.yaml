  - id: FE001
    title: Chimera TBCC 推进架构栈
    type: stack
    layout: standard
    summary: Chimera 涡轮基组合循环发动机的七层架构，从涡扇核心延伸到飞行器机体。
    data:
      layers:
        - id: turbofan-core
          label: 涡轮核心——Pratt & Whitney F100
          detail: 商用 COTS 涡扇；累计飞行小时 >30M；提供亚音速和低超音速推力（起飞到 Mach ~1.5）；省掉自研发动机成本
        - id: precooler
          label: Hermeus 自研预冷器
          detail: F100 进气道上的换热器；降低进气驻点温度；将涡轮上限从 Mach ~1.5 推到 Mach 2.5+；TBCC 的关键使能部件；已与 F100 完成地面测试（2024）
        - id: variable-inlet
          label: 可变几何进气道
          detail: 控制内部激波结构和气流分配；低速模式下向涡轮输送调理后的气流，并在转换时将气流导向冲压发动机；精密加工
        - id: bypass-isolator
          label: 旁通管道 / 隔离段
          detail: 转换时（约 Mach 2.8+）将高马赫气流绕过涡轮核心；保护旋转涡轮叶片免受进气驻点高温影响；热隔离通道
        - id: ramjet-combustor
          label: 冲压燃烧室阶段
          detail: 用于高超音速推进的吸气式燃烧室（Mach 3–5+）；尚未飞行测试；已在 Chimera 测试活动中完成地面演示（2022）；Chimera II 目标 Mach 5+
        - id: gnc-autonomy
          label: GNC / 自主栈
          detail: 实时制导、导航与控制；支持无人远程操作和未来自主载荷释放；与安全地面控制飞行甲板对接
        - id: airframe-tps
          label: 三角翼机体 + 热防护系统
          detail: 采用三角翼布局的超音速 / 高超音速机体；可变几何；前缘和表面热防护支持 Mach 3+ 持续飞行；Mk2 为 F-16 级尺寸
    approximationNotes: 层级顺序反映气流路径，不代表物理堆叠。未展示 TRL 数值；截至 2026 年 6 月，Chimera 冲压发动机阶段的飞行就绪度估计 TRL <5。
    claimRefs:
      - CE004
      - CE016
      - CE022
      - CE034
  - id: FE002
    title: Quarterhorse 任务运行流程
    type: flow
    layout: standard
    summary: 从 DoD 任务下达到跑道起飞、速度包线扩展和载具回收的端到端作战流程。
    data:
      nodes:
        - id: tasking
          label: 1. 任务下达（DoD / DIU）
          detail: DoD/DIU 合作方定义测试目标；从 FAA/WSMR 取得飞行授权
        - id: preflight
          label: 2. 地面飞行前与系统检查
          detail: Hermeus 飞行甲板（El Segundo/Spaceport America）；验证航电、燃料、发动机、自主栈
        - id: launch
          label: 3. 跑道起飞（Spaceport America）
          detail: 涡轮模式自主跑道起飞；飞行甲板远程监督；使用标准机场基础设施
        - id: subsonic-climb
          label: 4. 亚音速爬升与系统检查
          detail: 涡轮模式（F100 + 预冷器启用）；GNC 验证稳定性和控制；数据回传至飞行甲板
        - id: supersonic-accel
          label: 5. 超音速加速（涡轮 + 预冷器，Mach 1–2.5）
          detail: 预冷器冷却进气驻点空气；涡轮在标准上限以上运行；Mk2.1 已演示至 Mach 1.21
        - id: tbcc-transition
          label: 6. TBCC 模式转换（~Mach 2.8）[MK3 / 未来]
          detail: 可变进气道调整激波；旁通管道打开；气流绕过涡轮并导入冲压燃烧室；关键但尚未演示的一步
        - id: hypersonic-cruise
          label: 7. 高超音速巡航——冲压模式（Mach 3–5+）[未来]
          detail: 冲压燃烧室提供推进；涡轮核心被旁通；Mk3 目标 Mach 3.32+（SR-71 纪录）；Darkhorse 目标 Mach 5+
        - id: payload-release
          label: 8. 自主载荷释放 [DIU 合同范围]
          detail: GNC/自主栈在高速下执行载荷分离；截至 2026 年 6 月尚未演示；是 $219M DIU 合同的主要交付物
        - id: descent
          label: 9. 受控下降与返航
          detail: 减速；涡轮重新接入（反向 TBCC 转换）；进近回收机场
        - id: recovery
          label: 10. 跑道着陆与载具回收
          detail: 自主跑道着陆；载具检查并翻修后进入下一次飞行；可重复使用是项目关键差异点
    approximationNotes: 第 6–8 步代表未来计划能力，尚未飞行演示。第 9 步 TBCC 反向转换假设发动机可重启，但尚未验证。
    claimRefs:
      - CE009
      - CE019
      - CE022
      - CE040
