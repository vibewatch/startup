      - number: '7.4'
        title: 财务、估值与融资风险
        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月的 Series C 在 $1B 独角兽估值下融资 $350M，但其中 $150M 是来自 Silicon Valley Bank（First Citizens）、Pinegrove
              Venture Partners、Hercules Capital 和 Trinity Capital
              的结构化债务，不是股权。对一家重资本、尚无收入的航天硬件公司来说，债务带来股权资本没有的契约风险、利息义务和到期墙敞口。Hermeus 没有披露收入或 ARR，$1B
              估值意味着公司只靠政府合同里程碑付款，就背负了很高的隐含倍数。批判性分析师指出，该估值只是「纸面」估值，完全取决于交付：「如果 Quarterhorse 能在采购耐心转回 Lockheed 或 Northrop
              之前交付」。自 2018 年以来，公司累计融资超过 $500M，但仍没有生产设施；CEO Shore 确认，下一轮融资必须资助制造建设——这带来进一步稀释和执行风险。$150M
              债务义务、未披露商业收入、高超音速硬件极高资本强度，以及项目中途领导层交接，叠加成复合财务脆弱性风险。相邻赛道的可比项目——Boom Supersonic 自己的航空公司客户 CEO 给出的成败概率是
              50-50——说明商业超音速常见模式是大额融资之后，执行时间线长期拉长。
            claimRefs:
              - CR030
              - CR031
              - CR032
              - CR038
              - CR039
