        - 首架由私人资金支持的无人超音速飞机（Mach 1.21，2026 年 5 月）；现代航空最快的研发节奏
        - 超音速 ≠ 高超音速；Mach 3 和冲压发动机集成是难得多的工程挑战
        - 若 2027 年底前完成 Mach 3 演示，风险会实质性下降
      - - 政府合同
        - DIU 项目总额 $219M；Air Force + Navy 背书；In-Q-Tel 进入股东名单
        - DoD 高超音速项目长期存在进度延误（GAO）；DOGE 从 R&D 预算中削减 $11B+
        - 获得带多年资金的生产合同，将改变风险画像
      - - 竞争护城河
        - RTX 发动机合作；Edwards AFB 测试关系；高超音速迭代节奏领先 8 年
        - Lockheed SR-72、Northrop、Leidos 资源都更强；传统主承包商掌握合同关系
        - Hermeus 若以单一来源方式赢得 DoD 正式列装项目，将释放决定性差异化信号
      - - 市场规模
        - 高超音速武器市场 $8.24B（2025）→ $14.78B（2030）；DoD FY2025 高超音速预算 $6.9B
        - Hermeus 瞄准更大市场中的细分赛道（无人可重复使用飞机）；飞机 ≠ 导弹规模
        - 明确 Hermeus 正在竞争的具体后续 DoD 项目
