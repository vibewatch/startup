      - number: '5.2'
        title: Chimera TBCC 发动机架构与推进栈
        blocks:
          - type: paragraph
            body: >-
              Chimera 发动机是 Hermeus 项目的技术核心，也是首个商业开发的涡轮基组合循环（TBCC）推进系统。涡轮模式下，Chimera 采用商用 Pratt & Whitney F100
              涡扇核心——同款发动机用于 F-15 和 F-16，服役期累计飞行小时超过 3000 万——从跑道起飞到约 Mach 1.5，提供可靠的亚音速和低超音速推力。Hermeus 专有预冷器位于 F100
              进气口，用紧凑换热器降低来流滞止温度，把涡轮的有效速度上限从约 Mach 1.5 推到 Mach 2.5+。超过 Mach 2.8 后，发动机设计为借助管道 -
              隔离段组件让气流绕过涡轮核心，并在冲压燃烧室完成燃烧，从而把高效推进延伸到高超音速。Hermeus 2022 年 11 月在地面测试中演示了涡喷到冲压模式转换——公司和 DoD
              称其为「让作战型高超音速飞行成为现实的最重要技术成就之一」。Chimera 的海平面静态地面测试已在此前一轮测试中全部完成；在 Mk 3 飞行演示前，HEAT 设施现在承担下一阶段的高焓、污染气流地面模拟。用于
              Darkhorse 和 Mk3 之后机型的 Chimera II 变体，会把速度上限推至 Mach 5+。涡轮核心采用 COTS 路线，借助数十年的 F100
              生产和维护基础设施，省掉估计数十亿美元的定制发动机开发成本，并压缩进度。关键未解问题是：在 Mach 2.5–3
              的飞行中模式转换期间，预冷器和旁通管道架构能否干净管理激波结构和热载荷；在这一速度段，进气道不起动和叶片超温仍是工程风险。
