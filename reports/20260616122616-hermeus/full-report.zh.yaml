              - CP034
      - number: '3.4'
        title: 竞争护城河评估与反向视角
        blocks:
          - type: paragraph
            body: >-
              Hermeus 公开声称的护城河——迭代式 TBCC 推进开发、DIU 验证的国防路径，以及军民两用收入期权——都面临实质替代风险，需要从反向视角审视。

              主要技术护城河是 Chimera 发动机在飞行中从燃气涡轮转换为冲压发动机的 TBCC 转换；截至 2026 年 6 月，这一点尚未在实际飞行条件下演示。Hermeus Mk 2.3 目标 2027 年 H1
              达到 Mach 3，但 Mach 5 的完整 Chimera 循环被推迟到未来 Darkhorse 平台——这是多年技术风险。Lockheed Martin 拥有来自 SR-71 和 Aerojet
              Rocketdyne 2006 年以来工作的保密 TBCC IP，Skunk Works 资源量级远大于 Hermeus。即便主承包商执行 TBCC，也从未在 Mach 6 完成飞行演示；批评者把 SR-72
              项目的成本轨迹类比为 Zumwalt 级驱逐舰（三艘 $23B）。

              采购侧，HASC FY2027 草案明确指出，DoD 尚未完成高超音速技术向重大采购项目的转化——这正是 Hermeus 必须跨过的治理门槛，从 DIU OTA 进入正式列装项目。GAO 记录显示，六个 DoD
              高超音速武器项目中有四个未征求用户反馈或使用数字工程工具，暗示影响整个行业的系统性采购风险。Atlantic Council 2026 年 2 月 Hypersonics Task Force（成员包括
              Hermeus 首席收入官）把该技术定义为国家安全要务，但也把成本可持续性列为需要政策干预的明确挑战。

              分销和转换成本有利于既有玩家：Anduril 和 Kratos 已拥有 USAF/USMC CCA 正式列装项目关系、AI 自主平台（分别为 Lattice 和 Prism），以及作战履历，使它们在近期 CCA
              相邻任务上更有主张权。Hermeus 必须说服买方先等 Mach 3+，再承诺生产合同——随着 Anduril 或 Kratos 每赢下一单，这个要求都会更难。
