      - number: '1.4'
        title: 里程碑、政府合同与不利信号
        blocks:
          - type: paragraph
            body: >-
              最有说服力的牵引信号是执行节奏：从 2018 年创立到 2026 年 5 月实现超音速飞行，Hermeus 用大约一些国防主承包商花在设计评审上的时间，跑完了八年的里程碑。Chimera 发动机在 2022 年
              11 月验证了涡喷到冲压的转换。Quarterhorse Mk 1 于 2025 年 5 月从 Edwards AFB 起飞。HEAT 设施于 2025 年 1 月在 Jacksonville
              投运，用来补美国高超音速测试基础设施缺口。Mk 2.1 从首飞（2026 年 3 月 2 日）到超音速（Mach 1.21，2026 年 5 月 26 日）只用了 85 天和三架次——3 月取得 FAA
              Special Airworthiness Certificate，并在 White Sands Missile Range 上空突破音障。Air Force Magazine 和 Breaking
              Defense 分别确认，这是航空史上首次由私人资金支持的无人超音速飞行。

              政府合同牵引与技术速度相互印证。2020 年 AFWERX 研究（$1.5M）播下行政专机概念。2021 年 USAF 合同（$60M，联合出资）验证了 Quarterhorse 作为平台的价值。2023 年
              DIU HyCAT 授予（$23M）让 Pentagon 原型机构成为正式客户。2026 年 5 月 DIU 修改项（新增 $159M，总上限 $219M）把 USAF 和 USN
              配成作战利益相关方，并把目标指向飞行中 Mach 3 载荷释放——DIU Military Deputy Major General Kunkel 称其可能成为“改变游戏规则的作战能力”。

              三个不利信号需要紧盯。第一，Pentagon FY2026 高超音速武器预算从 $6.9 billion 削减 43% 至 $3.9 billion，Congressional Research Service
              指出 DoD 尚未为高超音速武器建立任何正式列装项目。这带来资金周期风险：已签合同可以延续，但未来单一来源后续合同取决于缺乏正式采购路径的军种。第二，CEO Shore 在 2026 年 5
              月确认，高超音速飞行能力仍“至少还要几年”，意味着 Darkhorse 和 Chimera II TBCC 仍是收入前里程碑。第三，联合创始人流失——两名创始人已不在公司，Skyler Shuford 创办
              Reaxiomatic——即便 Shore、Furger 和 Nakamaru 让公开领导梯队变厚，也仍引发机构知识和人才留存问题。
