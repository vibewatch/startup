      - number: '5.4'
        title: 自主栈与制造基础设施
        blocks:
          - type: paragraph
            body: >-
              所有 Quarterhorse 飞行器都以无人系统运行，由 Hermeus 专用地面「flight
              deck」远程操控。进入超音速和高超音速后，气动响应时间低于人类反射阈值，机载自主与制导、导航、控制（GNC）栈必须处理实时传感器数据并执行控制输入。Hermeus 的自主架构支持全速度包线内的无人运行，也是
              DIU 扩展合同中自主载荷释放能力的前提。公司没有公开软件仓库，也没有面向开发者的开源平台；从业者社区能看到的信号，主要来自工程演讲、招聘信息和国防分析师出版物。主要制造地点是 Georgia 州 Atlanta
              的 110,000 sq ft 工厂，用于飞机装配、轻制造和子系统测试——包括内部航电和结构测试。Hermeus 还在 Dekalb-Peachtree
              Airport（PDK）运营一处推进测试设施，距工厂约九分钟车程。2026 年 4 月，在完成 $350M Series C 后，Hermeus 将公司总部从 Atlanta 迁至 California 州 El
              Segundo，同时保留 Atlanta 作为制造基地。CEO Zach Shore（接替 AJ Piplica 出任 CEO；Piplica 仍任 Executive
              Chairman）表示，凭现有设施，公司初始规模下每年可制造 12–15 架飞机。生产制造能力仍处萌芽期；Series C 资金用途计划包括扩大制造规模，以支持下一阶段 DoD 交付。
