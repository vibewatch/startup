      - number: '4.3'
        title: 单位经济、成本结构与私营财务缺口
        blocks:
          - type: paragraph
            body: >-
              Hermeus 是一家尚未量产、尚无商业收入的公司。任何公开来源都没有毛利率、CAC、回本周期、贡献利润、LTV
              或确认的单机制造成本数据。所有有意义的单位经济指标都是私有的，未向公开市场披露，也未出现在任何监管文件中。

              成本结构由工程和制造人力（2026 年中约 280–300 名员工）、材料和部件（主要是 Pratt & Whitney F100-229 发动机，Hermeus
              可从翻新的空军库存中部分获取）、测试场费用，以及四地设施成本（亚特兰大、El Segundo、Jacksonville HEAT 设施和 Washington DC）主导。位于佛罗里达州 Jacksonville
              的 High Enthalpy Air-breathing Test（HEAT）设施于 2025 年 1 月上线，是公司在专有高超音速推进测试基础设施上的重大固定成本投入。

              RTX Ventures 战略投资（2022 年 5 月宣布）和持续推进的 Pratt & Whitney F100 发动机集成在财务上很重要：Hermeus
              采用已验证发动机平台，而不是自研定制涡轮，显著降低了近期 R&D capex，并加快通往飞行测试的路径。这不能消除发动机单机成本，但降低了达到初始飞行里程碑所需资本。

              定价方面，President Zach Shore 告诉 Breaking Defense，Quarterhorse 会“肯定比有人战斗机便宜，并且相对 CCA 很有竞争力”；他又单独告诉 Tectonic
              Defense，该飞机按二战生产节奏下可大规模生产来设计。Shore 估计规模化后的初始产能为每年 12–15 架。公司未披露价格点，也未披露单机成本。公司自身在 2026 年 5
              月承认，系列生产所需的专用制造设施尚不存在，并需要未来融资。这些都是生产阶段财务承销中的重大缺口。
