      - number: '3.3'
        title: 现状替代品：高超音速导弹、ISR 无人机和常规平台
        blocks:
          - type: paragraph
            body: >-
              Hermeus 面前最大的竞争力量不是另一家创业公司，而是 DoD 当前用来解决同类作战问题的可消耗和常规替代品：时敏打击、ISR 突防和快速反应力量投送。

              美国空军 FY2026 预算请求为初始 ARRW 生产拨款 $387.1M（Lockheed Martin，Mach 5+ 助推滑翔，B-52 携带），并为持续 HACM 开发拨款
              $802.8M（Raytheon，吸气式超燃冲压，F-15/F-35 携带）。两者合计吸收 DoD 约 $3.9B FY2026 高超音速组合中的 $1.2B 以上。GAO 报告称，HACM
              进度落后，Raytheon 预计其成本将显著超过基线。Congressional Budget Office 2023 年研究估算，Army Dark Eagle LRHW 助推滑翔导弹在 300
              枚采购量下单价为 $41M；陆军确认初始批次将超过该估算。这些可消耗系统解决了动能打击，不需要可重复使用、飞行员安全或商业认证——但它们无法执行持续 ISR、持久监视或多任务行动。

              Northrop Grumman 的 RQ-4B Global Hawk 仍是美国 HALE ISR 骨干，2026 年 2 月部署在 Black Sea
              上空，但设计目标是续航和高度，而不是速度或争议空域突防。保密 Northrop RQ-180 解决隐身突防 ISR，但没有高超音速速度。DARPA 和 Northrop 的 XRQ-73 SHEPARD 混合电动
              ISR 无人机于 2026 年 4 月首飞，目标是低声学特征，而不是高马赫。国会已明确指出，DoD 尚未完成高超音速技术从 S&T 原型到重大采购项目的转化，并要求 2027 年 3
              月前提交计划——这确认当前由替代品主导的环境，可能比 Hermeus 融资叙事假设的更久。
            claimRefs:
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
