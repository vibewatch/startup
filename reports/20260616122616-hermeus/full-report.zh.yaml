  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与采购格局
        blocks:
          - type: paragraph
            body: >
              Hermeus 只在美国联邦国防采购生态内运行；截至 2026 年 6 月，没有确认的商业、国际或非政府客户。公司的买方格局分四层：（1）Defense Innovation Unit（DIU）作为 HyCAT
              项目下的主合同工具和出资机构；（2）Air Force 同时以共同出资方（AFLCMC、AFWERX、AFRL）和测试伙伴（Edwards AFB 的 Air Force Test
              Center）身份参与；（3）U.S. Navy 在 2026 年 5 月 DIU 合同扩展中被明确列为伙伴；（4）Kratos Defense 等子客户，正把 Hermeus 飞行器集成进 $1.45B
              Navy/MDA MACH-TB 项目。所有采购都走 Other Transaction Authority（OTA）合同和 AFWERX Strategic Financing（StratFI）机制，而不是传统
              Program of Record 或 Major Defense Acquisition Program 路径。Presidential and Executive Airlift
              Directorate（AFLCMC/PA）主导的「Vector Initiative」在 2020 年以 $1.5M AFWERX 高超音速总统空运研究开启关系，确立了客户假设：Hermeus
              技术可服务高级领导人运输、ISR 和机动任务。In-Q-Tel 参与 Series C，确认 CIA / 情报界有兴趣，尽管尚无公开情报合同宣布。商业高超音速客机项目（目标 Mach 5+ 民用运输）预计
              2029 年前不会有原型机，也没有已签署的客户意向书；它代表未来的投机性市场分部，不是当前收入。
