      - number: '5.5'
        title: 技术风险、认证缺口与系统集成挑战
        blocks:
          - type: paragraph
            body: >-
              Hermeus 项目面临一组相互勾连的工程和制度风险；飞机越接近高超音速，风险越重。最根本的技术风险，是尚未在飞行中演示的 TBCC
              模式转换：在相关马赫数下，还没有任何商业开发系统完成过干净的涡喷到冲压飞行交接。历史参照（SR-71 的 J58 和 NASA 的
              X-51）都依赖巨额政府投入、大量设施权限和多架测试机，才实现了部分近似结果。工程怀疑者指出三项具体挑战：（1）管理可变进气道激波位置，避免转换期间不起动；（2）随着马赫数上升，保护涡轮叶片免受超过设计上限的进气滞止温度影响；（3）在气动热载荷变化条件下，实现可靠的闭环模式切换控制。材料耐久性进一步放大了热管理问题：前缘高温合金和复合材料在
              Mach 3 以上持续飞行中会经历循环加热，而 Hermeus 设计尚无此类飞行数据。认证和保障方面，FAA Experimental Certificate 范围很窄，仅覆盖 Spaceport
              America、WSMR 空域内的 Quarterhorse Mk 2.1；未来任何作战型军用飞机，都需要按 MIL-SPEC 流程取得 Air Force 适航，而该流程尚未启动。Hermeus 技术没有
              DoD 正式列装项目：House Armed Services Committee 的 FY2027 NDAA 草案明确指出，尚无任何高超音速 S&T 项目转入重大采办项目，直接限制近期开规模路径。Pratt &
              Whitney 作为唯一 F100 发动机供应商形成供应链集中，以及对 Spaceport America 和 WSMR 空域可用性的依赖，也是额外运营风险。
