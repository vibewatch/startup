      - number: '5.6'
        title: 附录
        blocks:
          - type: callout
            title: 首个实现超音速飞行的私营 UAS
            body: >-
              Quarterhorse Mk 2.1 于 2026 年 5 月 26 日达到 Mach 1.21——这是美国私营部门开发的无人机首次完成超音速飞行。该里程碑出现在平台第三次试飞，距 Mk 1 首飞 364
              天，展示出近年商业航空少见的硬件迭代节奏。数日内，DoD 史上最大 DIU 授标（$219M）随之落地，确认机构层面对项目执行速度有信心。
            calloutType: strength
