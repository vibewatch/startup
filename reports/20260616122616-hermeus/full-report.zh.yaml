      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Hermeus 于 2018 年由 AJ Piplica、Glenn Case、Mike Smayda 和 Skyler Shuford 创立。Piplica 来自 Generation Orbit Launch
              Services，曾为美国空军领导 X-60A 高超音速 X-plane 项目，创始人与高超音速市场之间有直接匹配。2026 年 6 月 1 日，Piplica 转任执行董事长；四年前加入
              Hermeus、先后担任 Chief Revenue Officer 和 President 的 Zach Shore 出任 CEO。Shore 曾主导获取重大国防合同并扩展商业职能，在 Piplica
              的技术和投资者关系重心之外补上运营深度。公司在 2026 年 5 月 11 日宣布交接，距离超音速里程碑只有数日。

              2026 年上半年，高管团队的关键变化包括：Steve Furger 于 2026 年 1 月出任 CTO，负责长期技术路线图；Kim Nakamaru 于 2026 年 4 月出任 General
              Counsel，她此前在 Relativity Space 担任同一职位，并为复杂航空航天制造商搭建法律 / 监管基础设施。Ramin Nader 担任 VP Finance，Tim Hampton 担任 VP
              Information & Security。治理图景里有一个关键人物集中度提示：Piplica 的名字贯穿资本战略、投资者关系和创始叙事；Shore 转任 CEO
              至少部分是为了把运营执行与资本战略领导拆开。不利信号包括 Forbes 报道称，截至 2026 年 5 月，另有两名联合创始人已不在公司；Skyler Shuford 虽保留董事会观察员席位，但已创办名为
              Reaxiomatic 的新国防创业公司。这种联合创始人流失模式在成熟中的创业公司并不少见，但仍需要尽调机构知识交接，以及任何竞业限制或 IP 转让协议。
