            body: >-
              House Armed Services Committee 的 FY2027 NDAA 草案明确表示，DoD 尚未将任何高超音速科学与技术项目转入重大正式采办项目，这直接限制了演示合同之外的近期放量。
              Hermeus 目前通过 DIU 采用 Other Transaction Authority 运行，这能支持快速试验，但没有正式列装项目指定，就无法资助大规模生产。这个缺口是公司商业化时间表上最重大的制度风险。
