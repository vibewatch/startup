      - number: '4.2'
        title: 资本充足性、融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Hermeus 自 2018 年创立以来，已通过七次融资事件筹集超过 $500M 总资本，并在 2026 年 4 月 Series C 后达到 $1B 投后估值。Series C 包括 $200M
              股权（Khosla Ventures 领投，Canaan Partners、Founders Fund、RTX Ventures、Bling Capital、In-Q-Tel 继续参投，新投资人包括 Cox
              Enterprises/Socium Ventures、Destiny Tech100、Georgia Tech Foundation、137 Ventures 和 GSBackers）以及来自 Silicon
              Valley Bank、Pinegrove Venture Partners、Hercules Capital 和 Trinity Capital 的 $150M 结构化风险债。CEO AJ Piplica
              明确称，债务部分是为了以非稀释方式为硬件制造能力融资的有意策略；对于一家硬件优先的国防创业公司，这种做法少见但可辩护。

              此前轮次包括：种子轮（2019 年，Khosla Ventures）、Series A（2020 年，约 $16M，Canaan Partners 领投）、$60M USAF/VC 联合 StratFI
              合同（2021 年），以及 Series B（2022 年 3 月，$100M，Sam Altman 领投，Founders Fund 和 In-Q-Tel 进入）。Series C 让历史累计资本几乎增加两倍。

              资本投向包括：（1）同时扩展三架 F-16 级飞机机队；（2）扩大亚特兰大制造（110,000 sq-ft 设施从工程转向生产）；（3）在加州 El Segundo 开设新的工程与原型总部；（4）目标到 2027
              年中 El Segundo 员工超过 200 人。公司未披露烧钱速度；以该开发强度下硬件密集型航空航天创业公司的行业基准看，运营支出可能为每月 $10–20M，意味着 Series C 所得资金带来估计
              18–42 个月跑道——这只是近似值。$150M 债务部分增加了结构化偿付义务；如果飞行测试计划显著滑坡，将形成财务压力。Robotics Press 的一份独立分析把这描述为本章关键下行情景：“$150M
              债务服务义务会在测试计划滑坡时造成财务压力。”

              除股权 / 债务外，累计政府合同现金（按 Obviant 数据约 $78.5M）已部分抵消运营成本，但这些现金取决于里程碑，因此具有可变性。
