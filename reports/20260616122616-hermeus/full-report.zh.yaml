  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与格局
        blocks:
          - type: paragraph
            body: >
              Hermeus 位于三层同心需求区交汇处。核心近期市场，是美国 DoD 对高马赫无人飞机平台的需求——原型机、测试载具和早期作战系统——采购工具主要是 Defense Innovation
              Unit（DIU）管理的 Other Transaction Authority（OTA）载体，以及空军创新机构 AFWERX。这包括 HyCAT（Hypersonic and High-Cadence
              Airborne Testing Capabilities）项目、MACH-TB（Multi-Service Advanced Capabilities Hypersonic Testbed）项目，以及面向
              Presidential and Executive Airlift 研究的直接 AFWERX 合同路径。更外一圈相邻市场是空军 Collaborative Combat
              Aircraft（CCA）项目；Quarterhorse 已被明确定位为可参与近期采购竞争的、价格可负担的高速无人僚机。最外圈是长期商业超音速和高超音速点对点航空运输（例如 Boom Overture，Mach
              1.7，目标 2029–2030 年商业投入）——这是 Hermeus 尚未放弃的战略相邻方向，但在国防优先转向后已被降级。

              Hermeus 目标任务集的现状替代品包括 F-15E Strike Eagle（最新变体约 ~$100M，有人驾驶，受飞行员生存性限制）、MQ-9 Reaper（亚音速 ISR 和打击，部署广泛但天然慢），以及
              Collaborative Combat Aircraft 等概念阶段替代品（Anduril YFQ-44A 和 General Atomics
              YFQ-42A，均为亚音速到低超音速）。美国现役清单里，今天没有任何已部署飞机能持续在 Mach 3 以上飞行，更不用说 Mach 5。SR-71 Blackbird 于 1998 年退役；其 Mach 3.3
              空速纪录仍然保持。Hermeus 的 Quarterhorse 目标是在 2027 年达到 Mach 3——正打在亚音速 CCA 与 SR-71 速度区间之间的能力缺口上。

              出口市场受到 ITAR 和 U.S. Munitions List（USML）严格约束，后者将高超音速飞机及所有相关技术数据归类为防务物项。所有技术转移都需要 DDTC 许可。荷兰 2026 年 4
              月承诺资助两架 CCA Increment 1 飞机，说明盟友需求存在；但也确认销售只能以政府对政府方式推进，通过 FMS 或特定豁免，而不是直接商业出口。
