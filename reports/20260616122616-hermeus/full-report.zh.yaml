              Chimera 发动机在飞行中从涡喷切换到冲压模式，是项目中最关键的未解技术风险。Hermeus 2022 年 11 月在地面条件下演示了这一转换，但还没有商业开发的 TBCC
              系统在相关马赫数下完成飞行转换。除非 Quarterhorse Mk 3 证明这项能力，否则 Mach 4+ 性能仍只是目标。如果 Mk 3 无法实现干净的飞行中转换，项目需要进行重大重估。
