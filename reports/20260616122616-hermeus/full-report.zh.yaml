      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 没有正式列装项目——所有收入仍处原型阶段
            body: >
              截至 2025 年 8 月 CRS 报告，DoD 尚未为高超音速武器或飞机建立任何正式列装项目。Hermeus 当前政府收入的每一美元都来自 OTA
              原型合同；这些合同可以被修改、延长或缩减，没有正式项目采购基线保护。HASC FY2027 NDAA 草案要求 DoD 在 2027 年 3
              月前提交高超音速技术转化战略，形成近期决策压力——但也确认转化尚未发生。这是 Hermeus 近期收入耐久性面临的最重大市场风险。
            calloutType: risk
            claimRefs:
              - CM033
              - CM039
          - type: callout
            title: $219M DIU 合同跻身 DIU 史上最大授予之列
            body: >
              2026 年 5 月 DIU 合同修改后，Hermeus 的 DIU 合同总上限升至 $219M——报道称其为 DIU 史上最大授予之一。叠加此前 $60M AFWERX 后续合同，以及参与 $1.45B
              MACH-TB 项目，Hermeus 已锁定超过 $280M 的可核验 DoD 合同敞口。DIU Military Deputy Maj. Gen. Kunkel
              明确呼吁把它量产为作战能力，说明管理该合同的办公室在近期给予强机构支持。
            calloutType: insight
            claimRefs:
              - CM017
              - CM023
          - type: callout
            title: 商业超音速相邻机会是长期项，不是近期项
            body: >
              Hermeus 的创始愿景包括商业高超音速航空旅行，其 AFWERX 总统专机合同也显示空军未来可能对该用途感兴趣。不过，公司已明确把商业航空降级，转而优先国防。全球商业超音速市场（由 Boom Overture
              领跑，目标 2029–2030 年投入服务）预计 2026 年约 $31B——但其中几乎全是有人驾驶军用超音速战斗机。Hermeus 真正可服务的商业高超音速市场，是 2030
              年后的假设，取决于高超音速飞机认证成功，以及监管批准陆上超音速飞行。
            calloutType: assumption
