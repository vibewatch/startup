  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 飞行器平台——Quarterhorse、Darkhorse 与 Halcyon
        blocks:
          - type: paragraph
            body: >-
              Hermeus 把产品组合设计成一条原型机阶梯：每一级先消掉一个特定技术风险，再进入下一级。Quarterhorse Mk 0
              是不飞行的「Ironbird」试验台，在任何飞机升空前，先在地面环境验证航电、燃油、液压和结构子系统。Quarterhorse Mk 1 搭载 GE J85 发动机，2025 年 5 月 21 日在
              Edwards Air Force Base 首飞，距 2023 年 Q4 开始设计约 18 个月，验证了高速起降气动。Mk 1 体积约为 Mk 2 系列的三分之一，重量约为四分之一。Quarterhorse
              Mk 2.1 体量接近 F-16，搭载配有 Hermeus 专有预冷器的 Pratt & Whitney F100 发动机，2026 年 2 月在 Spaceport America 首飞，并于 2026 年 5
              月 26 日达到 Mach 1.21——成为美国首架由私营部门开发并完成超音速飞行的无人机。公司目前在制造 Mk 2.2（目标是全球最快无人机速度纪录）和 Mk 2.3（目标是在 2027 年上半年达到 Mach
              3）。Quarterhorse Mk 3 将是首个集成完整 Chimera II TBCC 发动机的机体，目标挑战 SR-71 Blackbird 在 1976 年创下的吸气式 Mach 3.32
              速度纪录。再往后，Darkhorse 是 Hermeus 规划中的作战型 Mach 5+ 多任务高超音速 UAS，面向国防和国家安全，目标是在本十年末部署。Halcyon 仍停留在商业客运概念阶段，目标是在
              125+ 条跨大西洋航线上达到 Mach 5；截至 2026 年 6 月，没有已获资金支持的开发时间表。
