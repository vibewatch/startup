      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: $1 Billion 收入前估值：承销仍缺关键证据
            body: >-
              仅靠公开数据，无法承销 $1 billion 投后估值。Hermeus 没有披露收入、烧钱速度、积压订单构成或清算优先权堆栈。唯一的经济锚点是 DIU 合同承诺总额 $219
              million（开发阶段，不是生产收入），以及 Anduril、Shield AI
              等可比国防科技公司的倍数——但两家公司都有真实收入基础。任何投资决定都需要数据室覆盖：季度烧钱、里程碑付款安排、带清算优先权层级的股权表，以及当前 DIU 工具之外的 DoD 项目管线。
            calloutType: risk
            claimRefs:
              - CV011
              - CV038
              - CV039
              - CV040
          - type: callout
            title: 超音速里程碑是一次基础性去风险事件
            body: >-
              2026 年 5 月 26 日，Quarterhorse Mk 2.1 仅在第三次试飞、首飞 85 天后就以 Mach 1.21 达成超音速飞行，这是 Hermeus 历史上最重要的估值正向事件。它证明 F100
              发动机集成、可变进气道、三角翼气动布局能在超音速区间跑通。Mach 3 飞行还会叠加冲压喷气 TBCC
              复杂度，但这次结果降低了技术概率折扣，也明显抬高了牛市情景概率。此前没有公开已知的私人资助无人喷气机达成过这一里程碑。
            calloutType: insight
            claimRefs:
              - CV003
              - CV004
              - CV005
          - type: callout
            title: 估值假设国防科技高溢价倍数环境延续
            body: >-
              只有在当前国防科技行业环境下，$1 billion 估值才说得通：Anduril 和 Shield AI 享有 14–42×
              远期收入倍数。如果行业倍数收缩——无论原因是利率上行、公开市场国防科技公司回调，还是某个国防 IPO 失败树立负面先例——Hermeus 的期权溢价都会大幅下修。当前环境（仅 2026 年 Q1 国防科技 VC
              就超过 $4.5B）在历史上没有先例，也未必能穿越完整市场周期。
            calloutType: assumption
            claimRefs:
              - CV022
              - CV028
              - CV034
