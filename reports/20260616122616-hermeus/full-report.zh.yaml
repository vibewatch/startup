      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 超音速里程碑验证快速原型模式
            body: >-
              私人资助无人喷气机在首飞不到三个月后、仅第三次测试架次就实现超音速飞行（Mach 1.21），显示出一种现代航空中几乎找不到近似参照的迭代开发节奏。该里程碑直接降低了通往 Mach 2 和 Mach 3
              的技术转换风险，也显著强化了 DoD 客户关系。
            calloutType: strength
            claimRefs:
              - CO021
              - CO039
          - type: callout
            title: Pentagon 高超音速预算削减 43%，威胁未来收入管线
            body: >-
              Pentagon FY2026 高超音速武器预算从 $6.9B 降至 $3.9B，降幅 43%；DoD 仍未为高超音速武器建立任何正式列装项目。也就是说，Hermeus 仍在原型 /
              实验资金池里运营，而不是在结构化采购项目中运营；它更依赖 DIU 和各军种持续投向实验的资金，而这些资金每年都可能在预算周期中被重新分配。
