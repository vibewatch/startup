        - 如果 Chimera II 在飞行中跑通涡轮到冲压转换，将打开 Mach 5+ 市场
        - 验证 DARPA HMGT 竞争，以及 Chimera II 是否面对 DoD 资助的竞品发动机
      - - DoD 尚无高超音速飞机正式采办项目
        - 约束
        - 近期；可能在 2027–2028 年解决
        - 全部收入都来自原型 / OTA；没有经常性生产合同；中止风险高
        - 跟踪 HASC FY2027 NDAA 对 2027 年 3 月前提交转化计划的要求
      - - GAO 记录了 DoD 高超音速项目普遍延期、超支
        - 约束
        - 持续
        - 削弱机构胃口；相邻项目（HACM、ARRW）的预算压力可能挤出 Hermeus
        - 查阅即将发布的 GAO 年度武器报告，获取 HACM 状态更新
      - - 高超音速试验场基础设施稀缺
        - 约束
        - 近期（2025–2027）
        - 限制 Hermeus 测试节奏；推动 HEAT 设施投入，但基础设施仍是瓶颈
        - 核实 HEAT 设施 Phase 2（vitiated airflow）完工时间；评估 White Sands 和 Edwards 容量
      - - ITAR / USML 对高超音速技术实行出口管制
        - 约束
        - 永久 / 结构性
        - 买方群体受限于美国政府和获批 FMS / ITAR 豁免伙伴；无法直接商业出口
        - 评估 AUKUS 豁免潜力；跟踪 DDTC 关于高超音速 USML 修订的最终规则
      - - Hermeus 没有生产制造设施
        - 约束
        - 近期；2026–2028
        - 若不再融资建设制造能力，无法扩至每年 12–15 架以上
        - 确认 El Segundo 总部设施产能；评估 Atlanta 生产重心切换时间
