          - type: callout
            title: 单一客户集中——100% 收入来自美国政府
            body: >-
              Hermeus 的全部收入来源都是美国政府 RDT&E 合同，没有商业客户、没有盟国合同，也没有民航收入。这带来两类集中风险：（1）美国高超音速 RDT&E 预算波动——DoD FY2026 申请额较
              FY2025 下降 43%——可能压缩未来合同流；（2）任何政治或采购周期扰动，都可能让现金流入中断，而公司没有商业收入托底。没有正式列装项目，意味着 2027 年之后每一美元收入，都取决于尚未作出的采购决定。
