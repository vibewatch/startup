        - $150M 债务降低稀释；成熟债务银团暗示合同可见度
        - 零收入业务背上固定债务义务；Mach 3 若滑延 12+ 个月，压力会放大
        - 公开披露合同里程碑付款计划，将让现金跑道更清楚
      - - 团队
        - Founders Fund、Sam Altman、Khosla、RTX Ventures 均在 Series C 中复投或加仓
        - 关键技术拐点上 CEO 交接（Shore 接替 Piplica）构成执行风险
