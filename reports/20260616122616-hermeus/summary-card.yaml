  topStrengths:
    - >-
      Technical execution is real: Quarterhorse Mk 2.1 reached Mach 1.21 in May 2026, giving Hermeus a differentiated
      milestone versus most private aerospace startups.
    - >-
      Government validation is tangible rather than aspirational: DIU expanded the program ceiling to $219M with Air
      Force and Navy participation around future operational use cases.
    - >-
      The investor syndicate is strategically credible for defense aviation, including Khosla Ventures, Founders Fund,
      In-Q-Tel, and RTX Ventures.
    - >-
      Hermeus is pursuing a reusable unmanned military aircraft niche that has fewer direct peers than missiles,
      conventional drones, or commercial supersonic airliners.
  topRisks:
    - >-
      The company remains pre-production and does not disclose revenue, burn, backlog quality, or unit economics, making
      conventional underwriting difficult.
    - >-
      Technical risk remains high because Mach 1.21 is not Mach 3 or Mach 5, and the more difficult propulsion,
      payload-release, and thermal-management milestones still sit ahead.
    - >-
      Customer concentration is extreme: virtually all visible demand and revenue pathways run through U.S. government
      prototype and experimentation channels.
    - >-
      Aviation and acquisition transition risk is material because DIU-style prototype success does not guarantee a
      program-of-record or scaled production contract.
    - >-
      The $150M debt tranche increases financing complexity and downside sensitivity if flight milestones slip or
      follow-on contracts slow.
    - >-
      Leadership transition risk is non-trivial because Zach Shore took over as CEO in mid-2026 at the same time the
      company entered its most consequential test-and-scale phase.
  unresolvedGaps:
    - Exact recognized revenue, quarterly burn, and remaining cash runway are not publicly disclosed.
    - The payment profile, options, and milestone gating inside the $219M DIU agreement are not public.
    - The current cap table, preference stack, and debt covenant package are not public.
    - >-
      No public evidence cleanly establishes a production-program transition path beyond prototype and experimentation
      phases.
    - Commercial customer demand, if any, remains aspirational rather than evidenced by LOIs, pre-orders, or contracts.
