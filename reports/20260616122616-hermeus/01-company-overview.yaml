  - id: leadership-governance
    title: Leadership, Founders, and Governance
    body: >-
      Hermeus was founded in 2018 by AJ Piplica, Glenn Case, Mike Smayda, and Skyler Shuford.
      Piplica came from Generation Orbit Launch Services, where he led the X-60A hypersonic X-plane
      program for the U.S. Air Force, providing direct founder-market fit in hypersonics. As of
      June 1, 2026, Piplica transitioned to Executive Chairman while Zach Shore, who joined Hermeus
      four years earlier and served as Chief Revenue Officer then President, became CEO. Shore oversaw
      the acquisition of major defense contracts and the scaling of commercial functions, providing
      operational depth alongside Piplica's technical and investor-relations focus. The transition
      was announced on May 11, 2026, just days before the company's supersonic milestone.

      Key changes in the senior leadership team during the first half of 2026 include: Steve Furger
      appointed CTO in January 2026 to lead the long-term technical roadmap; Kim Nakamaru appointed
      General Counsel in April 2026, joining from Relativity Space where she served in the same role
      and built legal/regulatory infrastructure for a complex aerospace manufacturer. Ramin Nader
      serves as VP Finance and Tim Hampton as VP Information & Security. The governance picture carries
      a key-person concentration note: Piplica's name appears across capital strategy, investor relations,
      and founding narrative, and the shift of Shore to the CEO role is at least partly designed to
      separate operational execution from capital-strategic leadership. Adverse signals include Forbes
      reporting as of May 2026 that two additional co-founders are no longer with the company, and Skyler
      Shuford, though retaining an observer board seat, has launched a new defense startup called
      Reaxiomatic. This co-founder attrition pattern — while common in maturing startups — warrants
      diligence on institutional knowledge transfer and any non-compete or IP transfer agreements.
