chapter:
  number: 1
  title: Company Overview
  summary: >-
    Hermeus is an Atlanta-based defense aviation startup founded in 2018 that reached unicorn status
    in April 2026 after closing a $350 million Series C at a $1 billion post-money valuation, bringing
    total capital raised above $500 million. Its Quarterhorse Mk 2.1 became the world's first privately-
    developed unmanned supersonic jet (Mach 1.21) on May 26, 2026, and a $219 million DIU contract
    ceiling positions the company as a credible near-term U.S. defense supplier — though the 43 percent
    FY2026 Pentagon hypersonic budget cut and the lack of any DoD program of record remain material risks.

sections:
  - id: identity-mission-product
    title: Identity, Mission, and Product Architecture
    body: >-
      Hermeus Corporation is a venture-backed defense aviation company founded in 2018 in Atlanta, Georgia,
      focused on the rapid design, build, and test of high-Mach and hypersonic aircraft for national
      security customers. The company's stated mission is to give the U.S. and its allies an asymmetric
      speed advantage over adversaries by delivering high-speed unmanned aircraft at the pace of the modern
      battlefield rather than the traditional decade-scale defense acquisition timeline. Its primary customer
      is the Department of War (previously DoD), with the U.S. Air Force and U.S. Navy engaged as
      operational partners under the expanded DIU contract.

      The core product architecture spans three layers. First is the Chimera engine family — a turbine-based
      combined cycle (TBCC) engine that runs as a turbofan at low speeds and bypasses air around the turbine
      to engage a ramjet at high Mach numbers. Hermeus demonstrated turbojet-to-ramjet transition in
      November 2022, making Chimera the world's first commercially developed TBCC engine. Second is the
      Quarterhorse demonstrator family — four aircraft in increasing capability bands. Mk 0 was a non-flying
      dynamic iron bird; Mk 1 (GE J85-powered) validated high-speed takeoff/landing at Edwards AFB in
      May 2025; Mk 2.1 (Pratt & Whitney F100, F-16 scale) became the world's first privately-funded
      unmanned supersonic jet on May 26, 2026, reaching Mach 1.21 in just its third test flight. Mk 2.2
      and 2.3 are planned for 2026-2027 before Mk 3 integrates Chimera II targeting Mach 3.3+. Third is
      the Darkhorse UAS — a multi-mission reusable hypersonic drone powered by Chimera II with the
      Pratt & Whitney F100 core, targeting operational defense deployment at scale. Halcyon, a commercial
      passenger aircraft with New York-to-London in 90 minutes capability, remains a long-term aspiration
      after the company pivoted primarily to defense markets. Hermeus operates across four locations:
      Atlanta GA (110,000 sq ft engineering and manufacturing HQ), El Segundo CA (new prototyping HQ),
      Jacksonville FL (HEAT test facility for hypersonic propulsion), and Washington DC (policy proximity).
