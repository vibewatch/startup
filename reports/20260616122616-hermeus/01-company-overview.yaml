callouts:
  - calloutType: strength
    title: Supersonic Milestone Validates Rapid Prototyping Model
    body: >-
      Achieving supersonic flight (Mach 1.21) with a privately-funded unmanned jet on only the third
      test sortie, less than three months after maiden flight, demonstrates an iterative development
      cadence with no close parallel in modern aviation. This milestone directly de-risks the technical
      transition to Mach 2 and Mach 3 and substantially strengthens the DoD customer relationship.
    claimRefs:
      - CO021
      - CO039

  - calloutType: risk
    title: 43% Pentagon Hypersonic Budget Cut Threatens Future Revenue Pipeline
    body: >-
      The Pentagon's FY2026 hypersonic weapons budget was reduced 43 percent from $6.9B to $3.9B,
      and the DoD has yet to establish any program of record for hypersonic weapons. This means
      Hermeus is operating in a prototyping / experimentation funding pool rather than a structured
      acquisition program, increasing dependency on continued DIU and service experimentation dollars
      that can be redirected annually through budget cycles.
    claimRefs:
      - CO029
      - CO030
      - CO031

  - calloutType: insight
    title: $150M Debt Tranche Signals Capital Efficiency Orientation
    body: >-
      Structuring $150M of the $350M Series C as non-dilutive debt — from SVB, Hercules, Pinegrove,
      and Trinity Capital — is unusual for a hardware-intensive pre-production defense startup.
      Management's explicit rationale (per CEO Piplica) is to finance capital-intensive manufacturing
      without further diluting the cap table. This discipline, if maintained, could improve IRR for
      equity holders but creates covenant and coverage risk if the flight test cadence slips.
    claimRefs:
      - CO010
      - CO011

