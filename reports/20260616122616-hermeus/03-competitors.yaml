  - id: commercial-hypersonic-competitors
    title: "Commercial Supersonic and Dual-Use Hypersonic Challengers"
    body: >-
      Boom Supersonic is the best-capitalised commercial high-speed aviation company, with approximately
      $1 billion raised. Its XB-1 demonstrator was retired in February 2025 after achieving Mach 1.1+ in
      two supersonic flights, completing a validation campaign for Overture aerodynamics and the "boomless
      cruise" noise profile. Overture targets 64–80 passengers at Mach 1.7 with a 4,250 nm range,
      commercial entry around 2030, and airline commitments from United, American, and Japan Airlines.
      Boom's Mach 1.7 speed regime is far below Hermeus Halcyon's Mach 5 target, placing the two in
      different market tiers with different economics: Boom is rebuilding the Concorde market while Hermeus
      must create an entirely new price-point above Boom. Industry skeptics note Boom faces manufacturing
      delays at its North Carolina facility, certification complexity, and unresolved questions about
      operating cost versus ticket revenue at scale.

      Destinus is a Swiss-Dutch aerospace startup targeting both defense drones and commercial hypersonic
      aviation. It has raised approximately €400 million across equity, convertibles, and bank facilities—
      including a €50M Commerzbank line—and as of mid-2026 is raising $200M in a pre-IPO round. Destinus
      pivoted decisively toward defense after 2022: Ukraine is a confirmed customer receiving 100+ drones
      monthly (Lord, Hornet, and Ruta variants), and the Destinus official website now centers on Kryla
      (saturation cruise), Hornet Block 1/2 (interceptor), and Ruta Block 1/2/3 (deep strike) products.
      In April 2026 Destinus and Rheinmetall announced Rheinmetall Destinus Strike Systems (51/49 JV) to
      develop a 700-km cruise missile and ballistic rocket artillery. The August 2025 acquisition of Swiss
      AI firm Daedalean (~$223M) adds autonomous flight technology. Destinus is the closest European parallel
      to Hermeus's dual-use strategy, but Swiss neutrality export constraints—partially mitigated by the
      Dutch HQ move—limit its U.S. market access.

      Venus Aerospace, a Houston startup with $106M+ raised including Lockheed Martin Ventures as a
      strategic investor, has flight-proven its rotating detonation rocket engine (RDRE) at 2,000 lb
      thrust in May 2024. Its Stargazer Mach 9 passenger concept remains pre-revenue and conceptual.
      Venus competes more in the propulsion supply chain than in integrated vehicle competition with Hermeus,
      but Lockheed's equity stake signals prime-contractor hedging across multiple propulsion approaches.
