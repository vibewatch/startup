callouts:
  - calloutType: risk
    title: "TBCC In-Flight Transition Unproven"
    body: >-
      Hermeus's primary technical moat—the Chimera engine's jet-to-ramjet transition—has not been
      demonstrated in flight as of June 2026. Every competitor racing toward Mach 5 (including
      Lockheed's classified SR-72 and Stratolaunch's rocket-glide Talon-A) either bypasses TBCC
      or holds legacy IP. If Chimera transition fails or is delayed past 2028, Hermeus's hypersonic
      claims rest entirely on ground tests, weakening its differentiation from high-subsonic CCA peers.
    claimRefs:
      - CP037
      - CP027

  - calloutType: strength
    title: "DIU Validation Anchors Near-Term Defense Revenue"
    body: >-
      The $219M DIU contract, up from $23M in 2023, plus explicit Air Force and Navy partnership in
      the most recent award, gives Hermeus a credible short-to-medium defense revenue path while
      hypersonic development continues. DIU Major General Kunkel publicly stated that a mass-produced
      Quarterhorse could be "game-changing" as a weapon. This validation is not available to
      Destinus (limited U.S. access), Venus Aerospace (propulsion-only), or Boom (commercial-only).
    claimRefs:
      - CP001
      - CP002

  - calloutType: insight
    title: "Expendable Missiles Dominate Near-Term Hypersonic Budget"
    body: >-
      Of the $3.9B+ DoD FY2026 hypersonic allocation, the majority flows to expendable missiles
      (ARRW, HACM, Dark Eagle) that solve kinetic strike without reusability. A reusable Mach 3+
      vehicle's ROI case must be made on ISR persistence, mission flexibility, and per-sortie cost
      over a fleet life—not just acquisition price. Until DoD explicitly programs a reusable
      high-Mach vehicle program-of-record, Hermeus competes partly against its own customer's
      existing procurement culture.
    claimRefs:
      - CP028
      - CP030
      - CP031

