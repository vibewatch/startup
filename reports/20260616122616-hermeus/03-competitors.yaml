  - id: competitive-moat-assessment
    title: "Competitive Moat Assessment and Adverse Lens"
    body: >-
      Hermeus's stated moats—iterative TBCC propulsion development, a DIU-validated defense pathway, and
      dual-use revenue optionality—face meaningful displacement risks that require adverse scrutiny.

      The primary technical moat, the Chimera engine's TBCC transition from gas turbine to ramjet during
      flight, has not yet been demonstrated in actual flight conditions as of June 2026. Hermeus Mk 2.3
      targets Mach 3 in H1 2027, but the full Chimera cycle for Mach 5 is deferred to the future Darkhorse
      platform—a multi-year technology risk. Lockheed Martin holds classified TBCC IP from SR-71 and
      Aerojet Rocketdyne work dating to 2006, with Skunk Works resources orders of magnitude larger than
      Hermeus. Even prime-contractor execution of TBCC has never been flight-demonstrated at Mach 6, and
      critics compare the SR-72 program's cost trajectory to the Zumwalt-class destroyer ($23B for three ships).

      On the procurement side, the HASC FY2027 draft legislation explicitly noted that DoD has not completed
      hypersonic technology transition to major acquisition programs—the governance threshold Hermeus must
      cross from DIU OTA to program-of-record. GAO documented that four of six DoD hypersonic weapon programs
      fail to solicit user feedback or use digital engineering tools, suggesting systemic acquisition risk
      affecting the whole sector. The Atlantic Council's February 2026 Hypersonics Task Force—which includes
      Hermeus's chief revenue officer—frames the technology as a national security imperative but also
      identifies cost sustainability as an explicit challenge requiring policy intervention.

      Distribution and switching costs favor incumbents: Anduril and Kratos hold existing USAF/USMC CCA
      program-of-record relationships, AI autonomy platforms (Lattice and Prism respectively), and combat
      pedigrees that give them near-term claim on CCA-adjacent missions. Hermeus must convince buyers to
      wait for Mach 3+ before committing production contracts—an ask that grows harder with each Anduril
      or Kratos win.
