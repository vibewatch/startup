  - id: status-quo-substitutes
    title: "Status-Quo Substitutes: Hypersonic Missiles, ISR Drones, and Conventional Platforms"
    body: >-
      The largest competing force against Hermeus is not another startup but the category of expendable
      and conventional substitutes the DoD currently uses to solve the same operational problems: time-critical
      strike, ISR penetration, and rapid-response force projection.

      The U.S. Air Force's FY2026 budget requests $387.1M for initial ARRW production (Lockheed Martin,
      Mach 5+ boost-glide, B-52 carried) and $802.8M for continued HACM development (Raytheon, air-breathing
      scramjet, F-15/F-35 carried). Together they absorb over $1.2B of the DoD's approximately $3.9B FY2026
      hypersonic portfolio. The GAO reported that HACM is behind schedule and that Raytheon is projecting
      it will significantly exceed its cost baseline. A 2023 Congressional Budget Office study estimated
      the Army Dark Eagle LRHW boost-glide missile at $41M per unit for a 300-missile buy; the Army confirmed
      initial units will exceed this estimate. These expendable systems solve kinetic strike without
      requiring reusability, pilot safety, or commercial certification—but they cannot conduct sustained ISR,
      persistent monitoring, or multi-mission operations.

      Northrop Grumman's RQ-4B Global Hawk remains the backbone of U.S. HALE ISR, deployed over the
      Black Sea in February 2026 but designed for endurance and altitude rather than speed or contested-airspace
      penetration. The classified Northrop RQ-180 addresses stealth penetrating ISR without hypersonic speed.
      DARPA and Northrop's XRQ-73 SHEPARD hybrid-electric ISR drone made its first flight in April 2026,
      targeting low acoustic signature, not high Mach. Congress has explicitly noted that DoD has not yet
      completed the transition of hypersonic technologies from S&T prototyping to major acquisition programs
      and demanded a plan by March 2027—confirming that the current substitute-dominated environment may
      persist longer than Hermeus's fundraising narrative assumes.
