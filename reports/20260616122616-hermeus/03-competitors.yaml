  evidenceGaps:
    - type: missing-source
      severity: material
      topic: unit-cost-pricing
      missingEvidence: >-
        Per-unit cost for ARRW initial production run, HACM flyaway cost, Anduril YFQ-44 Fury
        unit price, and Hermeus Quarterhorse price target are all undisclosed or classified.
      whyItMatters: >-
        Unit cost governs the relative economics of the reusable-aircraft-versus-expendable-missile
        trade; if Quarterhorse cannot compete on per-sortie cost at meaningful production rates,
        the addressable market shrinks to niche defense testing.
      diligencePath: >-
        Submit FOIA requests for ARRW procurement contract unit cost; obtain HACM budget exhibits
        from HASC/SASC testimony; ask Hermeus directly for cost-per-flight target and design-to-cost
        specs; compare against Kratos's reported $4–10M attritable range.
      relatedQuestionRefs:
        - QP025

    - type: private-evidence-only
      severity: material
      topic: classified-programs
      missingEvidence: >-
        Scope, status, and budget of classified hypersonic ISR vehicle programs (post-RQ-180 Northrop,
        Boeing advanced hypersonics, DARPA Special Access Programs) that may compete directly with
        Hermeus are entirely unknown from open sources.
      whyItMatters: >-
        A classified prime-contractor program with existing government backing and production
        infrastructure could emerge as a dominant competitor before Hermeus achieves program-of-record
        status, rendering the DIU OTA insufficient as a moat.
      diligencePath: >-
        Monitor cleared-contractor employment postings for undisclosed hypersonic programs; review
        USAF Special Access Program budget exhibits (Exhibit R-2) where declassified; seek
        conversations with DoD acquisition officials through Atlantic Council task-force channels.

    - type: missing-source
      severity: blocking
      topic: chimera-tbcc-transition
      missingEvidence: >-
        No public engineering data exists on Chimera TBCC engine jet-to-ramjet transition performance;
        Hermeus has not disclosed ground test results or transition TRL for the ramjet combustion cycle.
      whyItMatters: >-
        TBCC transition is the central technical claim for Mach 5 capability and the primary
        differentiation from high-subsonic CCAs; without flight-demonstrated transition data,
        the hypersonic moat rests solely on company assertions.
      diligencePath: >-
        Review DIU HyCAT program deliverables and technical data rights provisions; seek engine
        ground-test reports through AFWERX contract deliverable access; monitor flight-test readiness
        reporting for Mk 2.2 and Mk 2.3 flight test programs.

    - type: missing-source
      severity: material
      topic: commercial-aviation-demand
      missingEvidence: >-
        No confirmed commercial airline customer commitments or letters of intent for Hermeus Halcyon;
        Boom has publicly disclosed LOIs from United, American, and Japan Airlines while Hermeus has
        disclosed no equivalent commercial traction.
      whyItMatters: >-
        Commercial demand validation is essential for the dual-use thesis; without airline partnerships,
        Halcyon is an unfunded long-range roadmap item that does not reduce Hermeus's single-customer
        (U.S. government) concentration risk.
      diligencePath: >-
        Monitor Hermeus investor communications and press releases for airline partnership announcements;
        ask directly about commercial aviation pipeline and any MOU or LOI activity in diligence.

    - type: stale
      severity: minor
      topic: destinus-itar-compliance
      missingEvidence: >-
        Full regulatory impact of Dutch HQ move on Destinus's ability to obtain ITAR licenses
        and access U.S. defense procurement is not publicly confirmed; Rheinmetall JV structure
        and its implications for U.S. market entry are not yet finalized.
      whyItMatters: >-
        Destinus's ability to compete in U.S. defense markets depends on resolving Swiss neutrality
        conflicts and obtaining appropriate ITAR/EAR authorizations, which may limit it as a genuine
        U.S. market competitor versus a European-only player.
      diligencePath: >-
        Review DDTC registration records and Dutch BEIS export license filings; analyze Rheinmetall
        JV agreement (when public) for U.S. technology transfer provisions; monitor Destinus U.S.
        office openings or DoD RFI responses.

