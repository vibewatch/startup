  - FI002
- id: public-traction-and-capital-adequacy
  title: Public traction proxies and capital adequacy
  body: 'Public traction evidence is real but uneven. Forbes gave the clearest single revenue figure, estimating annual revenue around $75 million and reporting 300 percent growth in the AI business. NotCo AI’s own surface claims more than 20 CPG customers, while BHB Food reported Brazil distribution expansion from 2,000 to 3,400 points of sale. Kraft Heinz press releases and retailer pages show mainstream U.S. and Canadian channel access. Financing history also gives context: the 2021 $235 million Series D and the 2022 $70 million extension remain the last clearly sourced rounds tied to the current operating model. But capital adequacy itself is still opaque. No retained source gives current cash, monthly burn, debt schedule, or hard runway. That means public evidence can support strategic direction and rough scale, but not a clean solvency or dilution forecast.'
  claimRefs:
