- id: cost-structure-margin-and-gtm
  title: Cost structure, margins, and GTM reset
  body: The most important financial distinction in retained coverage is the split between NotCo’s AI division and its consumer CPG division. Forbes described a profitable enterprise software business with an estimated 70 percent gross income margin and an unprofitable in-house products unit. That does not make the enterprise business fully underwritable, because the article does not disclose segment revenue or customer retention, but it does clarify the direction of travel. Cost discipline also appears to have intensified. AgFunderNews, Just Food, Yahoo, and Emol all describe layoffs, SKU delisting, the closure of the New York office, and a transfer of North American sales and marketing to Kraft Heinz. Those steps imply management is shrinking fixed commercial cost where partner leverage is stronger. In other words, the company is trying to move the P&L mix away from capital-hungry standalone consumer expansion and toward higher-margin platform economics.
  claimRefs:
  - CI004
  - CI005
  - CI009
  - CI010
  - CI011
  - CI018
  - CI023
  - CI030
  tableRefs:
  - TI003
