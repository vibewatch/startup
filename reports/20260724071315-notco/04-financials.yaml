chapter:
  number: 4
  title: Financials
  summary: Public financial evidence for NotCo is thin but directionally clear. The company now looks like a hybrid model in which branded consumer products create proof and distribution, while the higher-margin enterprise AI division drives the most attractive economics. The main underwriting problem is not lack of strategic logic; it is lack of disclosed revenue mix, cash, burn, contract pricing, and retention data.
sections:
- id: revenue-model-and-monetization
  title: Revenue streams and monetization logic
  body: 'Retained sources support a hybrid revenue model, not a single-line packaged-food business. NotCo’s branded products still matter: the brochure and public product surfaces show a cross-category consumer portfolio, while Kraft Heinz press releases and retailer listings prove that NotCo participates in co-branded mainstream CPG launches. At the same time, NotCo AI and the Giuseppe page explicitly market product-development and formulation workflows to external food companies, with the company claiming more than 20 global CPG customers. This creates three monetization lanes: direct branded sales, partner-led co-branded sales, and enterprise AI / formulation revenue. Public evidence is much stronger on the existence of these lanes than on their economics. Retail product pages prove availability but not sell-through economics; enterprise pages prove positioning and customer count but not ACV or contract structure. Additional marketplace pages on Amazon and Whole Foods reinforce that the
    brand has real consumer distribution, but they still do not reveal realized net revenue or profitability. The result is a credible hybrid business with incomplete monetization transparency.'
  claimRefs:
  - CI001
  - CI002
  - CI013
  - CI014
  - CI015
  - CI016
  - CI029
  tableRefs:
  - TI001
  - TI002
