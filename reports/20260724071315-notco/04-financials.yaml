- id: financial-verdict-and-blockers
  title: Financial verdict, comp context, and diligence blockers
  body: 'The best public way to interpret NotCo is as a company trying to escape the economics of a pure plant-based CPG brand without abandoning consumer proof entirely. Beyond Meat’s 2024 results are a useful warning: even category leaders can struggle to produce healthy branded-food margins. That makes the software-like enterprise division strategically important, not optional. However, that same enterprise story is where the public record is weakest on pricing, ACV, revenue recognition, and retention. Public-company comps like Beyond and Oatly are useful only as boundary markers. They show what category pressure looks like and how public investors value plant-based names, but they do not substitute for NotCo’s own private metrics. The practical verdict is therefore constructive on strategic direction but cautious on underwriting quality. The company may be improving its margin mix, yet an investor still needs segment revenue, segment gross profit, cash, burn, partner economics, and contract
    cohorts before calling the capital structure comfortable.'
