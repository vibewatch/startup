- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Enterprise depth fails to materialize
    - No credible renewal / usage proof despite continued AI narrative
    - AI premium weakens sharply
    - Move from track toward avoid unless price resets
  - - Partner dependence worsens
    - Visible pullback or economics deterioration with Kraft Heinz
    - North America reach becomes less reliable
    - Increase discount to valuation
  - - Profitability target slips again
    - Another delay without clearer cash disclosure
    - Liquidity risk rises materially
    - Assume higher dilution risk
  - - Labeling restrictions broaden
    - Further legal or regulatory limits on naming / packaging
    - Brand communication becomes less flexible
    - Reassess consumer-brand value
  notes: These triggers are phrased in monitorable external terms because private dashboards are unavailable.
  claimRefs:
  - CV019
  - CV025
  - CV026
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current price and cap table
    - Post-2022 pricing, preferences, dilution, secondary activity
    - Without this there is no reliable entry-underwriting math
    - Request financing documents and cap table
  - - Liquidity and runway
    - Cash, debt, covenants, burn
    - Needed to assess dilution timing
    - Request current balance sheet and cash bridge
  - - Enterprise customer depth
    - Named logos, ACVs, renewals, active usage
    - Determines whether AI narrative deserves premium treatment
    - Request cohort and contract data
  - - Partner economics
    - Kraft Heinz commercial terms and dependence
    - Controls value capture in North America
    - Request JV and distribution summary
  - - Segment P&L
    - AI vs branded revenue and margin split
    - Needed to value hybrid business correctly
    - Request segment-level financials
  notes: These asks are prioritized by how directly they could move the recommendation or price.
