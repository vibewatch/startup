  topStrengths:
    - Proprietary Giuseppe and the broader NotCo AI platform create a more differentiated story than a pure plant-based CPG brand.
    - The company has real commercialization proof across branded products, Kraft Heinz launches, and a claimed base of 20+ global CPG users.
    - Management has already shifted strategy toward cost discipline and higher-margin enterprise workflows rather than pure geographic expansion.
  topRisks:
    - Public evidence does not establish a current priced round, cap table, or liquidity benchmark, making valuation support weak.
    - Branded plant-based categories remain under pressure, creating real risk that consumer-side weakness dilutes the AI premium.
    - North American commercialization appears increasingly dependent on Kraft Heinz and other partners.
    - Legal and labeling constraints can still impair consumer-brand flexibility and economics.
  unresolvedGaps:
    - Current cap table, share price, preferences, dilution, and any 2025-2026 secondary activity.
    - Segment-level revenue, margins, and cash-burn disclosure across branded CPG and AI-platform activities.
    - Named enterprise customers, contract depth, renewal behavior, and customer concentration.
    - Current workforce size, board composition, and governance depth beyond the founders.
