companyProfile:
  summary: NotCo is a Chile-founded food-tech company that began with plant-based consumer products and increasingly presents itself as a hybrid business spanning branded foods and an enterprise AI platform for food manufacturers. Public evidence supports a 2015 founding date, Matias Muchnick's continued leadership as cofounder and CEO, a last clearly sourced $1.5 billion valuation anchor from 2021, and a 2023-2025 operating reset focused on efficiency, partner leverage, and higher-margin AI workflows.
  foundedDate: '2015-01-01'
  founders:
    - name: Matias Muchnick
      role: Cofounder and CEO
      background: Founder of Eggless in Chile and the primary public strategist, fundraiser, and commercial spokesperson for NotCo.
      claimRefs: [CO003, CO044]
    - name: Karim Pichara
      role: Cofounder and CTO
      background: Technical steward publicly associated with Giuseppe and NotCo's machine-learning stack.
      claimRefs: [CO004]
    - name: Pablo Zamora
      role: Cofounder
      background: Scientist-cofounder still identified in investor and media materials, though current operating role is less visible publicly.
      claimRefs: [CO005]
  foundingLocation: Chile
  headquarters: Santiago, Chile
  productSummary: NotCo sells branded plant-based products such as NotMilk, NotBurger, and NotChicken while also marketing NotCo AI / Giuseppe as a workflow and formulation platform for food companies.
  customerFocus: Retail consumers, partner-routed mainstream shoppers, and enterprise food manufacturers or CPG innovation teams.
  businessModel: Hybrid model combining branded consumer packaged food sales with enterprise AI and formulation-platform revenue.
  stage: Late-stage private (Series D / D extension)
  fundingStatus: Public evidence supports a $235M Series D in 2021 at a $1.5B valuation and a $70M Series D extension in 2022; no later priced round was clearly verified in retained sources.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO007, CO008, CO012, CO013, CO014, CO020, CO024, CV001]
