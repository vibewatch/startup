chapter:
  number: 6
  title: Customers
  summary: NotCo has real customer proof across U.S. grocery shelves, marketplace channels, partner-led launches, and a claimed base of 20+ enterprise CPG customers. The customer story is credible on breadth and availability, but still weak on retention, contract depth, and North American channel concentration.
sections:
- id: segments-and-customer-types
  title: Customer segments and who pays
  body: The public customer picture splits into three layers. First are end consumers buying NotCo-branded products such as NotMilk and NotBurger in retail channels. Second are partner-routed customers buying co-branded products like Kraft mac and cheese or plant-based mayo in mainstream packaged-food aisles. Third are enterprise food manufacturers, where the public record is thinner but still meaningful because NotCo AI says more than 20 global CPGs are already building on the platform. That means buyer, user, and payer vary by segment. In consumer CPG, shoppers buy while retailers and partner brands determine assortment. In the enterprise segment, food-company R&D and innovation teams appear to be the users and likely budget owners. This segmentation matters because consumer proof is far easier to observe publicly than enterprise durability, renewals, contract depth, and budget ownership dynamics. It also means NotCo’s strongest visible adoption signal today is channel availability, whereas
    its most economically important users may still sit inside private enterprise workflows that outsiders cannot easily see.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU027
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-and-named-proof
  title: Adoption trajectory and named customer proof
  body: 'NotCo’s named customer proof is much stronger on channels than on end-customer cohorts. Whole Foods pages prove current own-brand placement for NotMilk and NotBurger. Walmart, Target, Kroger, and Publix prove current presence for co-branded Kraft Heinz NotCo products. Amazon and Thrive Market broaden that proof into ecommerce assortment. Partner press releases are especially important because they connect the shelf products to intentional commercial launches rather than stray marketplace residue. Brazil adds another adoption signal: BHB Food reported growth from 2,000 to 3,400 points of sale in one year. The public pattern is therefore consistent with real adoption. What it does not show is how quickly products turn, how long they stay listed, or which channels generate the most durable economics. In other words, availability is well evidenced but revenue quality is still largely hidden.'
