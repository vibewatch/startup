tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / strategic value
  - Gap
  rows:
  - - Retail consumers / own-brand
    - Buyer=user=payer consumer; retailer is gatekeeper
    - Buy NotMilk, NotBurger, and other NotCo-branded foods
    - Direct proof of brand demand and shelf relevance
    - No repeat-purchase or household concentration data
  - - Partner-routed mainstream shoppers
    - Buyer=user=payer consumer; Kraft Heinz and retailers control route to shelf
    - Buy co-branded mac and cheese, mayo, and related convenience foods
    - Mainstream channel reach beyond niche vegan shelves
    - Partner economics and retailer velocity unknown
  - - Enterprise CPG customers
    - R&D / innovation / procurement teams likely user and payer
    - Use NotCo AI / Giuseppe for formulation and product-development workflows
    - Potentially higher-margin land-and-expand engine
    - No contract depth or renewal disclosure
  - - Brazil / LATAM retail footprint
    - Consumers and regional distributors
    - Category expansion in Brazil and other markets
    - Shows geographic resilience beyond North America
    - Country-level revenue mix undisclosed
  - - Ecommerce specialty buyers
    - Online health-oriented or convenience shoppers
    - Order NotCo through Amazon / Thrive
    - Adds assortment breadth and low-friction discovery
    - Marketplace repeat and acquisition costs unknown
  notes: The segment split reflects how public customer proof naturally divides between observable shelf products and less visible enterprise workflows.
