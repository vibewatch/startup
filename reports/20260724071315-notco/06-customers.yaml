    - label: Awareness
      value: Retail shelf discovery | partner brand trust | marketplace search | enterprise sourcing
      note: Consumers often meet NotCo through existing retailer habits; enterprise buyers meet it through innovation workflows.
    - label: Trial
      value: Buy NotMilk / NotBurger / Kraft NotCo SKU | run first formulation project
      note: Trial evidence is strong in retail, weaker in enterprise.
    - label: Repeat
      value: Rebuy in grocery aisle | repeat AI workflow project
      note: Retail repeat is only indirectly visible; enterprise repeat is largely undisclosed.
    - label: Expansion
      value: Cross-category basket growth | more retailer doors | more CPG projects
      note: Kraft repeat launches and Brazil door growth suggest some expansion paths.
    - label: Concentration check
      value: Partner leverage and channel dependence
