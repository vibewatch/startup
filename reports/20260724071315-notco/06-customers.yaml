- id: durability-and-satisfaction
  title: Durability, repeat usage, and satisfaction visibility
  body: Durability is the weakest part of the public customer record. There is no disclosed NotCo-specific NRR, GRR, churn, contract length, or cohort table for either the consumer or enterprise business. The best publicly retained proxies are indirect. Category-level GFI data suggests plant-based milk has better repeat purchase than plant-based meat and seafood, which matters because NotMilk may be structurally stickier than some other categories. Retail review summaries provide lightweight satisfaction clues for products like Kraft’s plant-based mac and cheese, but they are not rigorous retention data. For enterprise AI, the gap is even larger. The company names an aggregate base of 20+ CPG customers but does not disclose renewal behavior or depth of workflow usage. As a result, durability has to be inferred from continued assortment breadth and repeat partner launches rather than hard cohort evidence, which is a meaningful underwriting limitation for investors and commercial partners
    alike.
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU024
  - CU031
  - CU032
  - CU033
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration
  title: Expansion loops and concentration risk
  body: 'NotCo clearly has multiple expansion paths, but each comes with a caveat. Retail breadth across Whole Foods, Walmart, Target, Kroger, Publix, Amazon, and Thrive suggests the brand can reach several shopper types and use cases. Brazil’s distribution growth suggests geographic expansion remains possible where channel fit exists. The enterprise platform introduces a second expansion path: land a food manufacturer workflow, then potentially expand usage across projects or brands. However, the clearest concentration risk is North America’s increasing dependence on Kraft Heinz. AgFunder, Just Food, Yahoo, and Emol all describe a strategy where U.S. and Canadian sales and marketing now sit with the partner. That may improve efficiency, but it also means one partner has disproportionate influence over customer access, merchandising leverage, and category priorities in a critical market. Concentration therefore sits more in channel control than in the count of visible storefronts. That distinction
    matters because many logos can still mask one decisive gatekeeper economically and strategically.'
  claimRefs:
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU025
  - CU026
  - CU035
