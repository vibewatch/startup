  rows:
  - - Beyond Meat
    - Direct branded peer / public comparable
    - NASDAQ-listed; full public filings and 2024 results
    - Retail and foodservice plant-based meat
    - NotCo adds AI-platform narrative and broader cross-category identity
    - Public results show category pressure and weak margins
  - - Impossible Foods
    - Direct branded peer / private
    - Large private branded meat player; exact current valuation not disclosed in retained sources
    - Retail and foodservice plant-based meat
    - NotCo markets Giuseppe externally, not just as internal science
    - Private economics and pricing transparency remain limited
  - - Oatly
    - Adjacent public comparable
    - NASDAQ-listed dairy-alternative company
    - Retail plant-based dairy and beverages
    - NotCo spans meat, dairy, mayo, and enterprise tooling
    - Not directly comparable on meat or B2B formulation
  - - Lightlife / Field Roast
    - Incumbent-backed branded peers
    - Maple Leaf-owned brand portfolio
    - Retail refrigerated and frozen plant protein
    - NotCo has stronger AI/platform narrative
    - Backed by larger parent-company distribution and capital
  - - Raised & Rooted
    - Incumbent extension
    - Tyson-owned brand option inside larger protein system
    - Retail plant-based meat consumers
    - NotCo is more category-native and innovation-led
    - Tyson can subsidize or reposition the segment
  - - Garden Gourmet / Sweet Earth
    - Incumbent extension
    - Nestlé-backed global plant-based brands
    - Retail and packaged-food buyers
    - NotCo has stronger Latin American identity and AI angle
    - Nestlé has superior scale and retailer access
  - - Motif
    - Adjacent B2B rival
    - Food-tech ingredient / formulation platform
    - Food-manufacturer R&D and innovation teams
    - NotCo couples platform story with consumer proof from its own brands
    - Retained sources do not prove a mass-market consumer brand
  - - Perfect Day
    - Adjacent B2B rival
    - Food-tech platform focused on enabling proteins and partnerships
    - Food-manufacturer and ingredient buyers
    - NotCo is broader across branded consumer categories
    - Not a direct branded meat comparable
  - - Daring
    - Focused direct peer
    - Focused branded plant-based chicken company
    - Retail consumers seeking chicken analogues
    - NotCo is broader across categories and AI narrative
    - Narrower specialization may sharpen messaging in one aisle
  - - Quorn / New Wave
    - Substitute classes
    - Mycoprotein and seafood-alternative brands
    - Consumers reducing animal protein via other formats
    - NotCo remains broader across familiar staples and co-branded CPG
    - Substitutes expand choice and reduce share of mind
  notes: Rows are a targeted working set rather than an exhaustive global census. The goal is to cover the main branded, incumbent, and enabling-platform competitors a diligence process would compare against NotCo.
