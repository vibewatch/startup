- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Peer
  - Visible public price / contract model
  - Included capabilities
  - Unknowns / discount risk
  - Implication for NotCo
  rows:
  - - NotCo
    - Retail shelf pricing exists by SKU; enterprise contract pricing not public
    - Branded products plus Giuseppe workflows
    - Realized margins, promo spend, and ACVs unknown
    - Price thesis must separate consumer CPG from enterprise deals
  - - Beyond Meat
    - Retail SKU pricing visible in market; no enterprise contract model
    - Finished meat alternatives
    - Trade spend and realized retailer terms not public here
    - Competes on shelf velocity more than platform lock-in
  - - Impossible Foods
    - Retail/menu pricing visible in market; contract model not public
    - Finished meat alternatives plus ingredient-science branding
    - Exact foodservice economics opaque
    - Science story does not equal transparent economics
  - - Oatly
    - Retail SKU pricing visible; public-company disclosure at aggregate level
    - Oat-based dairy products
    - Realized sell-in and promo economics not visible by SKU
    - Useful for sentiment, weaker for direct price parity
  - - Motif / Perfect Day
    - Enterprise-style commercial model implied
    - Ingredient or formulation enabling technology
    - No retained public ACV or discount schedules
    - B2B willingness-to-pay remains a primary diligence ask
  notes: This table intentionally marks most economics as unknown because retained official sources emphasize product surfaces and strategy rather than realized pricing or enterprise contract value.
