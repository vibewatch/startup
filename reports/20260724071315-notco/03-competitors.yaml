- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Current support
  - Mitigation / diligence ask
  rows:
  - - Giuseppe as proprietary formulation engine
    - Food-tech rivals also sell enabling science and internal R&D can copy portions of workflow
    - High
    - NotCo clearly markets Giuseppe externally
    - Request customer case studies and workflow ROI evidence
  - - Cross-category branded portfolio
    - Retail consumers can switch brands easily and category demand is uneven
    - High
    - Multiple NotCo categories are public
    - Request repeat purchase and household penetration by category
  - - Latin American brand leadership
    - Global incumbents can outspend startups in new regions
    - Medium-High
    - NotCo has regional identity and distribution proof
    - Request country-level market shares and retailer concentration
  - - Partnership-led distribution
    - Partner priorities may diverge from NotCo priorities
    - High
    - Partnership model is visible in current strategy
    - Request partner economics and exit clauses
  - - Consumer proof feeding enterprise sales
    - Category softness could reduce the signaling value of branded products
    - Medium-High
    - Concept is strategically coherent
    - Request evidence that CPG clients cite NotCo consumer proof in purchase decisions
  - - Asset-light manufacturing model
    - Low asset lock-in means peers can reach market without owning factories too
    - Medium
    - Common category structure
    - Request supplier map and capacity reservations
  notes: Severity reflects competitive transmission to growth, margin, or strategic bargaining power rather than legal or existential company risk.
