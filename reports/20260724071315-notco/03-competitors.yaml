- id: moat-durability-and-displacement
  title: Moat durability, commoditization risk, and likely displacement paths
  body: 'NotCo’s moat is most defensible when viewed as a combination of proprietary formulation data, enterprise workflow positioning, and cross-category consumer proof. It is less defensible if an investor reduces the story to “another plant-based brand.” Category headwinds matter because they compress the value of generic sustainability marketing and increase the value of real distribution leverage. Beyond’s public financial stress is important adverse evidence: the flagship listed peer has shown how quickly category excitement can fade when repeat economics disappoint. Incumbents with larger balance sheets can stay in the game longer and pressure startup margins through retailer relationships, brand spending, and tolerance for lower segment returns. The net result is that NotCo probably does have a differentiated position, but it is not a winner-take-all moat. The biggest risk is a slow commoditization path in which incumbents and adjacent science platforms capture most of the value
    while retail branded plant-based companies fight over a smaller-than-expected market.'
