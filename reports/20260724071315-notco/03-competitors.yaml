- id: profiles-and-positioning
  title: Competitor profiles and strategic direction
  body: 'The profiles break into three strategic archetypes. Beyond and Impossible are the best-known direct branded meat peers, but their public narratives differ: Beyond is the most transparent because it is public, while Impossible still emphasizes product science and brand. Oatly is a dairy-alternative public benchmark that demonstrates how a plant-based consumer company can gain global recognition yet still remain exposed to public-market volatility. Lightlife and Field Roast illustrate the Maple Leaf model of housing several plant-protein brands inside a broader food company. Tyson and Nestlé represent “option value” incumbents: they do not need plant-based to carry the whole corporation to keep competing. Motif and Perfect Day show the enterprise-science alternative, selling enabling technology to food manufacturers rather than trying to win every refrigerator door directly. NotCo is unusual because it spans both consumer proof and enterprise tooling, but that also forces it to execute
    in two very different competitive motions.'
