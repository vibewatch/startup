- id: capabilities-pricing-and-switching
  title: Capability comparison, pricing opacity, and switching costs
  body: Public evidence supports a capability comparison, but not a clean price comparison. Official competitor pages show product breadth, ingredient emphasis, and brand scope; they do not usually reveal retail sell-in economics, promotional budgets, or enterprise contract terms. That matters because shelf competition in plant-based foods is low-lock-in and promotion heavy. Consumers can multi-home between Beyond, Impossible, NotCo, Oatly, or an incumbent private-label option with almost no technical switching cost, so brand preference and distribution are decisive. Enterprise buyers are different. Once a food manufacturer embeds an ingredient or formulation workflow, switching becomes slower because teams must repeat testing, reformulation, and compliance work. NotCo’s advantage here is that Giuseppe is explicitly marketed as an externalized workflow engine rather than only an internal R&D secret. Still, the chapter treats any hard pricing or enterprise ACV comparison as a diligence gap
    because retained sources do not disclose contract economics.
  claimRefs:
  - CP014
  - CP015
  - CP016
  - CP017
  - CP018
  - CP019
  - CP020
  - CP033
