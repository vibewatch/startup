chapter:
  number: 2
  title: Market Analysis
  summary: 'NotCo sells into two adjacent markets: a mature-but-challenged plant-based food market and an earlier-stage AI-for-food-formulation market. The evidence shows meaningful demand and large theoretical TAMs, but the near-term commercial reality is a narrower serviceable market shaped by price parity gaps, taste skepticism, channel concentration, and the company’s own decision to consolidate around better-margin products and enterprise customers.'
sections:
- id: market-boundary
  title: Market boundary and job-to-be-done
  body: 'NotCo sits inside a broader alternative-protein and plant-based foods ecosystem, but that headline label is too wide for diligence. The company actually addresses two overlapping jobs. The first is consumer substitution: creating plant-based milks, burgers, chicken, mayonnaise, snacks, and co-branded products that compete for shelf space and menu slots against incumbent animal-based foods. The second is workflow acceleration for food manufacturers: helping CPG R&D, procurement, innovation, and reformulation teams design products faster, lower cost, and with better sensory or regulatory fit. That distinction matters because the buyer, budget owner, and adoption path differ by lane. In branded CPG, the immediate reference market is plant-based meat, plant-based dairy, and adjacent better-for-you packaged foods sold through retail and foodservice. In enterprise AI, the relevant comparison set is food-product-development software, formulation tools, and outsourced R&D. Public sources
    confirm that the plant-based category remains large but uneven: it has enough scale to matter, yet price and taste gaps continue to keep mainstream household penetration and repeat purchase below what bulls once expected. NotCo’s opportunity is therefore not “all food,” but a narrower wedge where product reformulation, margin protection, and conventional-channel distribution can solve real buyer pain better than generic plant-based branding alone.'
