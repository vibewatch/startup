- id: drivers-constraints-and-failure-modes
  title: Drivers, constraints, and failure modes
  body: 'The market still has real structural tailwinds. Consumers continue to show interest in healthier and more sustainable foods; regulatory and retailer pressure keeps reformulation on the agenda; plant-based price gaps can narrow when conventional proteins become more expensive; and large food companies increasingly need tools that can speed product iteration. But the constraints are equally visible in recent data. Plant-based meat and seafood dollar sales were down 10 percent in 2025, only 11 percent of U.S. households bought the category, and the share of total packaged meat dollars remained roughly 1.4 percent. Food Institute coverage shows that even globally interested consumers often do not translate stated interest into regular purchasing because price, flavor, convenience, and trust still lag. This is the key market failure mode for NotCo: if plant-based consumer products never become compelling on mainstream price-taste tradeoffs, the branded business caps out in niche channels.
    The offset is the AI business. Enterprise buyers can still justify NotCo even if retail category growth disappoints, provided Giuseppe helps with ingredient volatility, clean-label reformulation, or faster concept-to-shelf execution. The most attractive version of the market, therefore, is not a pure plant-based growth rebound but a two-engine model where consumer products prove the concept while enterprise software monetizes the underlying know-how.'
