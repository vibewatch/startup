- id: sizing-lenses
  title: TAM, SAM, and evidence-constrained serviceable market
  body: 'Available sizing evidence supports a layered market view instead of one single TAM number. At the broadest level, GFI reported $28.6 billion in global retail sales across plant-based meat, seafood, milk, yogurt, ice cream, cheese, and related categories in 2024. The U.S. plant-based retail market alone was $8.1 billion in 2024 and $7.9 billion in 2025, which means the category is large but no longer in hypergrowth. More specific category data matters more for NotCo. ResearchAndMarkets estimated the U.S. plant-based meat market at $2.25 billion in 2023 with a path to $5.25 billion by 2029, while a global plant-based meat lens put that category at $9.57 billion in 2024 growing toward $21.81 billion by 2030. TechCrunch also cited a much broader $290 billion 2035 alternative-protein estimate from Boston Consulting Group and Blue Horizon, but that number is best treated as theoretical long-horizon TAM rather than current serviceable demand. For underwriting, the relevant SAM is narrower:
    the set of premium plant-based dairy and meat categories plus enterprise food-manufacturer budgets where NotCo can either sell branded products or monetize Giuseppe. Public data do not cleanly isolate that SAM by geography and channel, so the report preserves a range rather than a false point estimate.'
