company:
  name: NotCo
chapter:
  number: 7
  title: Risks
  summary: 'NotCo’s risk profile is dominated by three interacting issues: legal and regulatory scrutiny over labeling, commercial dependence on Kraft Heinz in North America, and financial opacity around the cash runway and customer depth of the AI business. Category headwinds make these risks more important because the branded CPG business appears economically weaker than the enterprise unit.'
sections:
- id: legal-and-regulatory
  title: Regulatory and legal risk
  body: The cleanest primary risk evidence in the public record is legal. Chile’s Supreme Court ruled that NotCo can keep the NotMilk trademark but must remove milk-linked language and dairy imagery from packaging and advertising. That ruling matters because it directly touches packaging, shelf communication, and brand equity. It also shows that labeling is not a theoretical debate for NotCo; it is an active operating constraint. The U.S. regulatory backdrop reinforces that pressure. FDA’s 2025 draft guidance on plant-based alternatives says animal-derived names can be used only when labeling is not false or misleading and when plant sources are disclosed clearly. Together, these sources create a risk surface where legal, regulatory, product, and marketing teams are tightly coupled. NotCo may adapt successfully, but the burden is ongoing. The broader lesson is that every new market can add another naming, advertising, or unfair-competition interpretation that has to be monitored continuously
    and conservatively.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR024
  - CR029
  - CR034
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-and-model-risk
  title: Operational, product, and financial-model risk
  body: The second layer of risk comes from the plant-based category itself and from how hard it is to operate profitably inside it. GFI data and Beyond Meat’s public results show that category enthusiasm does not guarantee healthy repeat economics or margins. NotCo’s own restructuring in 2025—layoffs, SKU cuts, and commercial consolidation—confirms that the company has already needed to respond to pressure. The product risk is not that NotCo lacks technology; it is that the branded consumer business may still absorb margin pressure while the more attractive AI business remains under-disclosed on customer depth and renewal. Supply-chain and manufacturing risk are also shaped by the asset-light model. NotCo avoids the full cost of owned plants, but that makes it dependent on partners for production and distribution. Financial opacity amplifies all of this because public sources still do not disclose current cash, debt, or burn. In practice, a modest category setback can become a financing
    problem faster when margins and liquidity are both partially hidden.
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR008
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR017
  - CR018
  - CR035
  - CR036
  - CR037
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: partner-and-execution-risk
  title: Partner dependence and execution risk
  body: North America now appears structurally more concentrated through Kraft Heinz than it once did. AgFunder, Just Food, Yahoo, and Emol all describe a setup where U.S. and Canadian sales and marketing were handed to the partner. This may be rational, but it concentrates commercial leverage in one counterparty. If the partner slows support, changes priorities, or extracts too much economic value, NotCo’s channel access and category visibility can weaken quickly. Execution risk also remains meaningful. Geographic consolidation shows discipline, but it also shows the company has already had to retreat from earlier expansion ambitions. The B2B pivot could still work, yet that success depends on turning workflow interest into deep, renewable enterprise usage—a part of the story the public record still does not reveal with precision. That makes a superficially efficient commercial model potentially brittle underneath and harder to diagnose early.
  claimRefs:
  - CR009
  - CR010
  - CR022
  - CR023
  - CR025
  - CR027
  - CR030
  - CR032
  - CR039
  tableRefs:
  - TR003
  - TR004
  figureRefs:
  - FR003
- id: people-monitoring-and-thesis-breakers
  title: People risk, monitoring indicators, and thesis-break triggers
  body: Muchnick remains central enough to create real key-person exposure. Governance visibility is also limited because the public record does not supply a detailed board map or succession structure. The jobs-page developer signal is thin, which does not prove organizational weakness but does limit outside confidence in engineering cadence and team depth. The right monitoring frame therefore combines people, liquidity, partner, and category indicators. Investors should watch whether profitability targets slip again, whether partner-backed category launches continue, whether category repeat improves, and whether any further legal or regulatory action restricts labeling flexibility. The biggest unresolved blocker is that the three top risks—customer-depth opacity, partner concentration, and liquidity opacity—compound each other. If one worsens, it can accelerate the others. That compounding effect is why this chapter ranks risk as high rather than merely elevated. A company can survive one
    opaque variable; surviving three at once is materially harder.
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR026
  - CR028
  - CR031
  - CR033
  - CR038
  - CR040
