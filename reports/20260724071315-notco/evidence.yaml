evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A current public or private board roster, committee structure, and observer-rights map.
    whyItMatters: Governance quality and control rights cannot be assessed from founder biographies and investor names alone.
    diligencePath: Request the board deck, board roster, and side-letter summary in a diligence room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: current-headcount
    missingEvidence: A verified current employee count broken out by geography and by CPG vs AI platform divisions.
    whyItMatters: >-
      Headcount is a core scale and burn proxy, but public sources only expose an outdated 2021 figure or indirect
      estimates.
    diligencePath: Request the current org snapshot or latest monthly board KPI pack.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: audited-revenue-mix
    missingEvidence: Audited revenue, gross profit, and business-mix disclosure for the CPG and AI-platform divisions.
    whyItMatters: >-
      Feature articles cite estimated revenue and growth, but underwriting requires segment-level margin and revenue
      quality.
    diligencePath: Request audited financial statements and segment P&L by division.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: current-valuation
    missingEvidence: A priced round term sheet or verified post-2022 financing disclosure that establishes current valuation.
    whyItMatters: >-
      The last clearly sourced valuation is from 2021; any current investment case needs an updated mark or an explicit
      markdown view.
    diligencePath: Request the latest cap table, financing documents, and any bridge or secondary transaction summaries.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
      - TO003
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: cash-runway
    missingEvidence: Exact cash balance, burn, and covenant or debt constraints behind management’s runway claim.
    whyItMatters: A five-year runway claim is directionally helpful but too imprecise for capital adequacy analysis.
    diligencePath: Request monthly cash bridge, runway model, and debt schedule.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
