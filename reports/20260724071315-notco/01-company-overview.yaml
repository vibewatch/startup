- id: founders-leadership-governance
  title: Founders, leadership, and governance visibility
  body: 'Matias Muchnick remains the defining public leader of NotCo as cofounder and CEO, and his public biography anchors the company’s commercial narrative: he previously founded Eggless in Chile and uses that operating experience to frame NotCo as both a mission-driven food company and an AI-enabled formulation engine. Karim Pichara is consistently identified as cofounder and CTO, with his role centered on machine learning, the molecular-data architecture behind Giuseppe, and the link between scientific research and formulation automation. Investor and media profiles also continue to identify Pablo Zamora as a cofounder, but his current operating role is less visible than Muchnick’s or Pichara’s. The main governance weakness is not founder mismatch but disclosure scarcity. Reviewed official pages do not publish a public board roster, detailed executive bench, or a current org chart. That matters because the company has been executing a strategy reset since late 2023 and still appears
    highly dependent on Muchnick’s judgment as strategist, fundraiser, public spokesperson, and commercial dealmaker. Governance diligence should therefore focus less on founder-market fit—which is clear—and more on board independence, succession depth, and the authority split between the consumer and AI-platform divisions.'
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO034
  - CO044
  tableRefs:
