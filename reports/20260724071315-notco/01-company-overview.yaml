- id: milestones-scale-and-operating-reset
  title: Milestones, scale signals, and the 2023-2025 operating reset
  body: 'The milestone record shows a company that first proved the consumer concept, then used that proof to pivot into enterprise AI. Early milestones include the 2015 founding in Chile, U.S. market entry in 2020, and the 2021 Series D that established unicorn status. Since then, milestones have centered on distribution leverage and operating reset rather than simple geographic expansion. The Kraft Heinz joint venture announced in 2022 produced multiple co-developed products, including plant-based Kraft Mac & Cheese in 2023 and Oscar Mayer plant-based hot dogs and sausages in 2024. By 2025, Muchnick described a tougher environment: layoffs, delisting underperforming SKUs, closing the New York office, handing U.S. and Canadian sales and marketing to Kraft Heinz, and pushing group-wide profitability to 2027. At the same time, trade and feature coverage describes genuine scale signals inside the business: over 20 global CPGs using the AI platform, seven of the top ten or top twenty food companies
    cited in different interviews, 130 consumer products across Latin America, Brazil distribution rising to 3,400 points of sale, and a 300% annual growth claim for the AI business. The pattern is not a clean hypergrowth curve but a consolidation around the parts of NotCo that appear to have better margins, better customer pull, and better strategic defensibility.'
