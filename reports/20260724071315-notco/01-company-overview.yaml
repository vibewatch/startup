- id: funding-investors-capital-base
  title: Funding history, investor base, and capital posture
  body: 'NotCo’s capital history is reasonably well documented through 2022 and less clear afterward. TechCrunch reported the July 2021 Series D at $235 million and a $1.5 billion valuation, while Forbes’ 2026 profile retrospectively describes total capital raised at more than $425 million. That retrospective total is directionally consistent with a sequence of disclosed financings: roughly $30 million in 2019, $85 million in 2020, a separate 2021 check from Enlightened Hospitality, the July 2021 Series D, and a $70 million Series D extension in December 2022. The investor base mixes classic venture capital, food-industry specialists, celebrities, and strategic ecosystem backers: Tiger Global, Bezos Expeditions, L Catterton, Kaszek Ventures, The Craftory, Roger Federer, Lewis Hamilton, DFJ Growth, and Enlightened Hospitality all appear in reviewed coverage. The capital story also reinforces the company’s shift in identity. Muchnick explicitly describes earlier fundraising as necessary to
    keep developing the AI stack without forcing all resources into the consumer brand; recent interviews instead emphasize cost discipline, operating efficiency, and not needing to re-enter private markets soon. Because no public primary round with terms was verified after the 2022 extension, diligence should treat the 2021 $1.5 billion mark as the last clearly sourced valuation anchor rather than a current fair value.'
