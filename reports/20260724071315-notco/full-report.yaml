        title: Operational, product, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              The second layer of risk comes from the plant-based category itself and from how hard it is to operate
              profitably inside it. GFI data and Beyond Meat’s public results show that category enthusiasm does not
              guarantee healthy repeat economics or margins. NotCo’s own restructuring in 2025—layoffs, SKU cuts, and
              commercial consolidation—confirms that the company has already needed to respond to pressure. The product
              risk is not that NotCo lacks technology; it is that the branded consumer business may still absorb margin
              pressure while the more attractive AI business remains under-disclosed on customer depth and renewal.
              Supply-chain and manufacturing risk are also shaped by the asset-light model. NotCo avoids the full cost
              of owned plants, but that makes it dependent on partners for production and distribution. Financial
              opacity amplifies all of this because public sources still do not disclose current cash, debt, or burn. In
              practice, a modest category setback can become a financing problem faster when margins and liquidity are
              both partially hidden.
