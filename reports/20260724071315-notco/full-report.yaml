      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, don’t chase
            body: >-
              NotCo may deserve continued attention, but public evidence does not yet support a strong buy call at an
              unknown current price.
            calloutType: recommendation
            claimRefs:
