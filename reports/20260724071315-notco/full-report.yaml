            claimRefs:
              - CV004
              - CV006
              - CV010
              - CV022
              - CV029
      - number: '8.2'
        title: Recommendation, confidence, and price discipline
        blocks:
          - type: paragraph
            body: >-
              Given the available evidence, the right recommendation is track. That is more constructive than an avoid
              call because NotCo has real strategic differentiation and genuine commercial proof. But it is less
              aggressive than buy because the company remains a private, partially opaque security in a difficult
              category. Confidence should be medium because too many of the most important valuation inputs remain
              estimates or unknowns. Risk should be high because partner concentration, labeling risk, and financial
              opacity can all impair value. Valuation stance should remain unknown rather than confidently cheap or
              expensive. Without a current priced round, an investor cannot know whether today’s entry would be at a
              deep markdown, a flat hold, or an AI-driven premium to the old peak. Price discipline therefore matters
              more here than narrative enthusiasm, especially when the sector has already repriced so sharply globally.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV022
              - CV038
          - type: table
            tableRef: TV001
