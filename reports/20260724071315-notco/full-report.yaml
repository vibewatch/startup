      - number: '7.4'
        title: People risk, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Muchnick remains central enough to create real key-person exposure. Governance visibility is also limited
              because the public record does not supply a detailed board map or succession structure. The jobs-page
              developer signal is thin, which does not prove organizational weakness but does limit outside confidence
              in engineering cadence and team depth. The right monitoring frame therefore combines people, liquidity,
              partner, and category indicators. Investors should watch whether profitability targets slip again, whether
              partner-backed category launches continue, whether category repeat improves, and whether any further legal
              or regulatory action restricts labeling flexibility. The biggest unresolved blocker is that the three top
              risks—customer-depth opacity, partner concentration, and liquidity opacity—compound each other. If one
              worsens, it can accelerate the others. That compounding effect is why this chapter ranks risk as high
              rather than merely elevated. A company can survive one opaque variable; surviving three at once is
              materially harder.
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR026
              - CR028
