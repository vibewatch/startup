              - CV009
              - CV022
              - CV028
      - number: '8.3'
        title: Scenarios and comparable set
        blocks:
          - type: paragraph
            body: >-
              The scenario frame is more useful than a single point estimate. In the bull case, Giuseppe becomes the
              dominant economic engine and investors increasingly view NotCo as food-industry infrastructure rather than
              as a challenged plant-based brand. In the base case, the company keeps making commercial progress but
              remains too opaque for a premium software multiple. In the bear case, enterprise depth disappoints and the
              market re-rates the company toward stressed food-tech or plant-based comparables. Beyond Meat is the key
              downside public comp because it shows how category leaders can still struggle. Oatly adds a dairy-adjacent
              public lens, while Tyson and Maple Leaf remind investors that well-capitalized incumbents can stay in the
              category without needing startup-style multiples. Impossible Foods is relevant as a private brand
              benchmark, but it does not solve the price-discovery problem. The comp set therefore informs direction far
              more than it supports pinpoint precision. It should be read as a range-setting tool, not as a substitute
              for direct cap-table evidence, term-sheet review, or real customer-segment economics.
            claimRefs:
              - CV011
              - CV012
