        - date: '2021-07-26'
          label: Series D at $1.5B
          detail: Tiger Global leads a $235M round that pushes NotCo into unicorn status.
          tone: positive
          claimRefs:
            - CO012
        - date: '2022-12-12'
          label: $70M extension and B2B push
          detail: Forbes reports a $70M Series D extension tied to making Giuseppe available to other companies.
          tone: positive
          claimRefs:
            - CO013
            - CO007
