      Timeline of NotCo’s shift from Chilean plant-based startup to dual-track CPG and enterprise-AI company, with the
      North America reset highlighted as the key adverse turn.
    data:
      items:
        - date: '2015'
          label: Founded in Chile
          detail: NotCo begins with the thesis that AI can reformulate animal-based foods with plant ingredients.
          tone: positive
          claimRefs:
            - CO001
            - CO006
        - date: '2019'
          label: Series B
          detail: Roughly $30M financing round brings in The Craftory and Bezos-linked capital.
          tone: positive
          claimRefs:
            - CO015
        - date: '2020'
          label: U.S. entry
          detail: NotMilk enters U.S. retail and the company expands beyond Latin America.
          tone: positive
          claimRefs:
