chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, geography, and business model
        blocks:
          - type: paragraph
            body: >-
              NotCo was founded in Chile in 2015 and built its early brand around plant-based consumer products such as
              NotMilk, NotBurger, NotChicken, NotMayo, and NotIceCream. The company’s original wedge was using its
              proprietary Giuseppe AI to break foods down at the molecular level and search across plant ingredients for
              combinations that mimic animal-derived taste, texture, smell, and functionality. The public operating
              footprint has evolved from a pure consumer packaged goods story into a hybrid model with two linked
              businesses. One is the branded CPG arm, which demonstrates what the technology can do in real retail and
              foodservice settings; the other is an enterprise AI platform that sells workflow and formulation tools to
              large CPG and food manufacturers. Official platform materials describe NotCo AI as an end-to-end
              product-development platform serving more than 20 global CPGs, while long-form interviews with Matias
              Muchnick describe a decade-long data asset, 10,000-plus formulations, and a deliberate effort to move the
              P&L closer to a technology company than a conventional food brand. Geography is now best understood as a
              split operating map rather than one clean headquarters line: the company is Chile-founded and
              Chile-headquartered in contemporary trade coverage, while Muchnick himself lives between Santiago and San
              Francisco and older materials also referenced New York and San Francisco offices during the North American
              expansion phase.
