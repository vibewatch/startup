      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real risk is compounded, not isolated
            body: >-
              Legal, partner, and liquidity risks reinforce each other; the company can probably manage any one of them,
              but a combination could quickly weaken strategic flexibility.
            calloutType: risk
            claimRefs:
              - CR018
              - CR024
              - CR030
              - CR040
          - type: callout
            title: Commercial proof still matters
            body: >-
              Live launches and retail breadth show that NotCo is not a paper company, which partially offsets the bear
              case even as disclosure remains thin.
            calloutType: strength
            claimRefs:
              - CR025
              - CR033
              - CR039
          - type: callout
            title: The AI pivot changes the risk mix, not the need for proof
            body: >-
              The higher-margin enterprise story can improve the company, but only if the market eventually gets real
              evidence of customer depth, renewal, and adoption quality.
            calloutType: insight
