              co-branded products like Kraft mac and cheese or plant-based mayo in mainstream packaged-food aisles.
              Third are enterprise food manufacturers, where the public record is thinner but still meaningful because
              NotCo AI says more than 20 global CPGs are already building on the platform. That means buyer, user, and
              payer vary by segment. In consumer CPG, shoppers buy while retailers and partner brands determine
              assortment. In the enterprise segment, food-company R&D and innovation teams appear to be the users and
              likely budget owners. This segmentation matters because consumer proof is far easier to observe publicly
              than enterprise durability, renewals, contract depth, and budget ownership dynamics. It also means NotCo’s
              strongest visible adoption signal today is channel availability, whereas its most economically important
              users may still sit inside private enterprise workflows that outsiders cannot easily see.
