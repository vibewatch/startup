  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape is broader than a simple NotCo-versus-Beyond framing. Direct peers include
              branded plant-based food companies such as Beyond Meat, Impossible Foods, Daring, and category-specific
              substitutes like Quorn. Adjacent public comparables such as Oatly matter because they compete for the same
              plant-based consumer, retailer attention, and investor narrative even though they are concentrated in
              dairy alternatives rather than meat. Incumbents matter at least as much as startups. Tyson, Nestlé, and
              Maple Leaf can keep plant-based options in market as extensions of much larger protein or packaged-food
              systems. On the enterprise side, Motif and Perfect Day compete for food-manufacturer innovation budgets
              with enabling science, ingredient, or formulation stories rather than a NotBurger-style shelf brand. The
              real status quo is still conventional animal products and internal R&D inside large food companies. That
              means NotCo must beat both branded alternatives on taste and price and internal development teams on speed
              and iteration quality.
