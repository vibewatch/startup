      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              Before any investment committee should stretch beyond a track call, the diligence process needs a sharper
              answer to four questions. First, what is the actual current price and cap-table structure? Second, what
              are the current cash balance and runway assumptions? Third, how deep and renewable is enterprise customer
              usage? Fourth, how economically dependent is North America on Kraft Heinz? Those are the levers that can
              move the recommendation. The main thesis-break trigger is also clear: if enterprise depth fails to emerge
              while plant-based category pressure persists, the AI premium collapses and NotCo starts to look much
              closer to a challenged branded-food company. Conversely, stronger segment-level disclosure or a
              significantly cheaper entry price could improve the call. Until then, underwriting discipline should
              outrank fear of missing out. The purpose of this chapter is therefore to bound judgment responsibly, not
              to force false precision from incomplete inputs or incomplete market signaling.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV027
              - CV028
              - CV039
