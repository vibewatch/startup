  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The cleanest primary risk evidence in the public record is legal. Chile’s Supreme Court ruled that NotCo
              can keep the NotMilk trademark but must remove milk-linked language and dairy imagery from packaging and
              advertising. That ruling matters because it directly touches packaging, shelf communication, and brand
              equity. It also shows that labeling is not a theoretical debate for NotCo; it is an active operating
              constraint. The U.S. regulatory backdrop reinforces that pressure. FDA’s 2025 draft guidance on
              plant-based alternatives says animal-derived names can be used only when labeling is not false or
              misleading and when plant sources are disclosed clearly. Together, these sources create a risk surface
              where legal, regulatory, product, and marketing teams are tightly coupled. NotCo may adapt successfully,
              but the burden is ongoing. The broader lesson is that every new market can add another naming,
              advertising, or unfair-competition interpretation that has to be monitored continuously and
              conservatively.
