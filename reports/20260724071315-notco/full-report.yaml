  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case for NotCo is not simply that it sells plant-based foods. It is that the company appears
              to be evolving into a hybrid AI-plus-food business where consumer products validate the platform while
              enterprise workflows could capture higher-margin value. Forbes’ 2026 profile is the strongest single piece
              of support for that idea, describing a profitable AI division with an estimated 70 percent gross income
              margin. The anti-thesis is just as important: branded plant-based categories remain under pressure,
              commercialization still depends heavily on Kraft Heinz in North America, and the public record offers no
              clean proof of current price or liquidity. In other words, the company may be good, but the price may
              still be wrong or at least unknowable from public evidence alone. A quality business and a good investment
              are not identical if the entry terms cannot be verified, benchmarked, and stress-tested.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV025
              - CV026
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
