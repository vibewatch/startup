chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、地域与商业模式
        blocks:
          - type: paragraph
            body: >-
              NotCo 2015 年创立于智利，早期品牌围绕 NotMilk、NotBurger、NotChicken、NotMayo、NotIceCream 等植物基消费品搭建。公司的最初切口，是用自研 Giuseppe
              AI 在分子层面拆解食物，并在植物原料里寻找组合，去模拟动物来源食品的味道、口感、气味和功能性。公开运营足迹已经从单纯的消费包装食品故事，演变成两个相互连接的业务：一块是品牌
              CPG，靠真实零售和餐饮场景证明技术能产出什么；另一块是企业级 AI 平台，向大型 CPG 和食品制造商销售工作流与配方工具。官方平台材料称，NotCo AI 是端到端产品开发平台，服务超过 20 家全球
              CPG；Matias Muchnick 的长访谈则提到十年数据资产、10,000
              多个配方，以及有意把损益结构（P&L）拉向科技公司而非常规食品品牌的努力。地域上，现在更适合理解为一张拆分的运营地图，而不是一条清楚的总部线：近期行业报道称公司创立于智利、总部也在智利；Muchnick
              本人往返于 Santiago 和 San Francisco；更早的材料在北美扩张阶段也提到过 New York 和 San Francisco 办公室。
