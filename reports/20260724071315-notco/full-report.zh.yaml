      - number: '1.3'
        title: 融资历史、投资人基础与资本姿态
        blocks:
          - type: paragraph
            body: >-
              NotCo 到 2022 年为止的资本历史相当清楚，之后就模糊得多。TechCrunch 报道了 2021 年 7 月的 $235M Series D 和 $1.5B 估值；Forbes 2026
              年的画像则回溯称累计融资超过 $425M。这个回溯总额与一串已披露融资大体一致：2019 年约 $30M，2020 年 $85M，2021 年 Enlightened Hospitality
              的另一笔投资，2021 年 7 月的 Series D，以及 2022 年 12 月 $70M 的 Series D 延伸轮。投资人基础混合了传统 VC、食品行业专家、名人和战略生态支持者：Tiger
              Global、Bezos Expeditions、L Catterton、Kaszek Ventures、The Craftory、Roger Federer、Lewis Hamilton、DFJ Growth
              和 Enlightened Hospitality 都出现在已审阅报道中。资本故事也强化了公司身份的转变。Muchnick 明确说，早期融资是为了继续开发 AI
              栈，避免所有资源被迫投向消费品牌；近期访谈则更强调成本纪律、运营效率，以及短期内不需要重新进入私募市场。由于 2022 年延伸轮之后没有验证到带条款的公开新股融资，尽调应把 2021 年的 $1.5B
              视为最后一个来源清楚的估值锚点，而不是当前公允价值。
