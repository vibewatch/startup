      - number: '1.4'
        title: 里程碑、规模信号与 2023-2025 年经营重置
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，这家公司先证明消费端概念，再用这个证明转向企业级 AI。早期里程碑包括 2015 年在智利创立、2020 年进入美国市场，以及 2021 年确立独角兽身份的 Series
              D。此后，里程碑更多围绕分销杠杆和经营重置，而不是简单的地理扩张。2022 年宣布的 Kraft Heinz 合资公司产出了多个共同开发产品，包括 2023 年的植物基 Kraft Mac & Cheese，以及
              2024 年 Oscar Mayer 植物基热狗和香肠。到 2025 年，Muchnick 描述的环境更艰难：裁员、下架表现不佳的 SKU、关闭 New York 办公室，把美国和加拿大销售与营销交给 Kraft
              Heinz，并把集团整体盈利推迟到 2027 年。与此同时，行业和特写报道也描述了业务内部的真实规模信号：超过 20 家全球 CPG 使用 AI 平台；不同访谈中提到前十或前二十大食品公司中的 7 家；拉美
              130 个消费产品；巴西分销点从 2,000 增至 3,400 个；AI 业务年增长 300% 的说法。整体形态不是一条干净的超高速增长曲线，而是向 NotCo
              中利润率更好、客户拉力更强、战略防御性更高的部分集中。
