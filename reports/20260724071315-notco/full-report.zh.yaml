  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与谁付钱
        blocks:
          - type: paragraph
            body: >-
              公开客户图景分为三层。第一层是终端消费者，在零售渠道购买 NotMilk、NotBurger 等 NotCo 品牌产品。第二层是经合作伙伴触达的客户，在主流包装食品货架购买 Kraft Mac & Cheese
              或植物基蛋黄酱等联名产品。第三层是企业食品制造商，公开记录更薄，但仍有意义，因为 NotCo AI 称已有超过 20 家全球 CPG 在平台上构建。这意味着买方、用户和付款方随分层而变。在消费 CPG
              中，购物者购买，零售商和合作品牌决定上架组合。在企业分层中，食品公司的研发和创新团队看起来是用户，也很可能是预算负责人。这个分层重要，因为消费者证明比企业耐久性、续约、合同深度和预算归属动态更容易被公开观察到。它也意味着，NotCo
              今天最强的可见采用信号是渠道可得性，而经济上最重要的用户可能仍在外部难以看见的私有企业工作流内部。
