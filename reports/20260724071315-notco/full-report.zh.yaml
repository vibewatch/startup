              - CV009
              - CV022
              - CV028
      - number: '8.3'
        title: 情景与可比集合
        blocks:
          - type: paragraph
            body: >-
              情景框架比单点估值更有用。牛市情景里，Giuseppe 成为主导经济引擎，投资人越来越把 NotCo
              看作食品行业基础设施，而不是受挑战的植物基品牌。基准情景里，公司继续推进商业化，但披露仍太不透明，无法获得高端软件倍数。熊市情景里，企业客户深度不及预期，市场把公司重估到承压食品科技或植物基可比公司附近。Beyond
              Meat 是关键下行公开可比，因为它说明品类龙头仍可能挣扎。Oatly 提供乳品相邻公开视角；Tyson 和 Maple Leaf
              提醒投资人，资本充足的既有玩家可以留在品类里，而不需要创业公司式倍数。Impossible Foods
              可作为私有品牌基准，但不能解决价格发现问题。因此，可比集合更多提供方向，而不是支持精确点估值。它应被当作定范围工具，而不是替代直接股权结构证据、条款清单审阅或真实客户分群经济性。
