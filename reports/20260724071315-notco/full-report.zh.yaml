  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 旧 $1.5B 锚点会导向很不同的叙事，关键看投资人愿意给这家混合型公司多少收入倍数。
    data:
      items:
        - label: 按 $75M 收入、4x 倍数
          value: 300
        - label: 按 $75M 收入、8x 倍数
          value: 600
        - label: 按 $75M 收入、12x 倍数
          value: 900
        - label: 按 $75M 收入、20x 倍数
          value: 1500
    approximationNotes: 数值为隐含股权价值，单位为百万美元；计算采用 Forbes 估算的 $75M 收入和示例倍数。这些是情景工具，不是估值标记。
    claimRefs:
      - CV003
      - CV035
      - CV036
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 示例估值区间会大幅拉宽，因为正确倍数取决于投资人给 AI 部门与品牌食品拖累各放多大权重。
    data:
      items:
        - label: 悲观
          low: 300
          high: 600
        - label: 基准
          low: 600
          high: 1200
        - label: 乐观
          low: 1200
          high: 1800
    approximationNotes: 数值为示例性百万美元估值，基于 $75M 收入估计和 4x-24x 的宽情景倍数，覆盖承压食品科技到高溢价混合型 AI 叙事。
    claimRefs:
