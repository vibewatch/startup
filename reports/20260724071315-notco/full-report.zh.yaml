              配方收入。公开证据对这些路径是否存在的支撑，远强于对其经济性的支撑。零售产品页面证明可买到，但不证明终端销售经济性；企业页面证明定位和客户数，但不证明 ACV 或合同结构。Amazon 和 Whole Foods
