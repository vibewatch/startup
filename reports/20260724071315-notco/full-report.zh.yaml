      - number: '2.3'
        title: 买方分层、采用路径与购买触发
        blocks:
          - type: paragraph
            body: >-
              NotCo 的买方可拆成三个实际分层。第一类是直接在货架上购买的零售购物者，通常购买植物基牛奶、肉类、零食或联名便利食品。根据 GFI
              的零售研究，这些购物者比美国平均家庭更年轻、更富裕、受教育程度更高，而且仍然对味道和价格高度敏感。第二类是餐饮或渠道买方，他们想要菜单差异化、更健康定位，或在不自建配方能力的情况下提供可信的植物基选项。第三类是企业食品制造商，尤其是
              CPG 创新、研发、采购和监管团队，他们希望 Giuseppe
              提速概念生成、改配方或成本优化。因此，采用触发也不同。消费者会在口味、熟悉度、陈列和价格改善时尝试；零售商关心动销和家庭渗透率；企业买方关心速度、利润保护和合规。NotCo
              企业适配最强的证据，是公司现在对外称服务超过 20 家全球
              CPG，并明确把工具定位在让产品组合面向未来、减少试错，以及把杂乱研发数据转化为可执行实验。买方旅程因此从认知和试验，走向零售复购或企业账户中的工作流集成；最大的摩擦点仍集中在价格溢价、信任和主流习惯惯性。
