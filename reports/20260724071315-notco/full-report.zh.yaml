            body: >-
              公开证据把 Giuseppe 描述成一套工作流栈，而不是黑箱配方神谕。官方页面谈到发现、产品简报生成、原料搜索和优化；Forbes 与 AgFunder 补充了数据护城河叙事，称公司积累了约 10
              年私有数据和超过 10,000 个带感官反馈的配方。这意味着其架构至少有四个功能层：自研数据、发现与构思、配方优化，以及商业化为品牌或合作品牌产品。关键产品洞察不只是 AI 能搜索分子，而是 NotCo
              声称能把这套工作流嵌入客户流程。保留来源中的运营模式仍偏轻资产：公开证据几乎不显示公司拥有自有制造基础设施，却有大量合作伙伴上新、零售商分销和工作流营销证据。不过，具体集成界面仍不透明，因为公开来源没有披露
              API、系统连接器或 SLA。
