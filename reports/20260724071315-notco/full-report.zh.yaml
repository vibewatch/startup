      - number: '2.2'
        title: TAM、SAM 与受证据约束的可服务市场
        blocks:
          - type: paragraph
            body: >-
              现有规模证据支持分层看市场，而不是给一个单一 TAM 数字。最宽口径下，GFI 报告 2024 年全球植物基肉、海鲜、牛奶、酸奶、冰淇淋、奶酪及相关品类的零售销售额为 $28.6B。仅美国植物基零售市场，2024
              年为 $8.1B，2025 年为 $7.9B，说明这个品类很大，但已不再处于超高速增长。对 NotCo 更重要的是更具体的品类数据。ResearchAndMarkets 估计，美国植物基肉市场 2023 年为
              $2.25B，到 2029 年可达 $5.25B；全球植物基肉口径则把该品类 2024 年规模放在 $9.57B，并预计到 2030 年增至 $21.81B。TechCrunch 还引用 Boston
              Consulting Group 和 Blue Horizon 对 2035 年替代蛋白 $290B 的更宽估计，但这个数字更适合作为理论上的远期 TAM，而不是当前可服务需求。做投资假设时，相关 SAM
              要窄得多：高端植物基乳品和肉类品类，加上 NotCo 能销售品牌产品或变现 Giuseppe 的企业食品制造商预算。公开数据无法按地域和渠道干净拆出这一 SAM，因此本报告保留区间，而不是制造一个虚假的点估计。
