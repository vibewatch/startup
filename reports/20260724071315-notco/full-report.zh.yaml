            body: 仍在推进的上新和零售广度显示，NotCo 不是纸面公司；即使披露仍薄，这也部分抵消了悲观情景。
            calloutType: strength
            claimRefs:
              - CR025
              - CR033
              - CR039
          - type: callout
            title: AI 转向改变的是风险组合，不是证明需求
            body: 更高毛利的企业业务叙事可以改善公司质量，但前提是市场最终看到客户深度、续约和采用质量的真实证据。
            calloutType: insight
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR022
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              NotCo 的正面逻辑不只是它卖植物基食品，而是公司似乎正在变成 AI + 食品的混合业务：消费品验证平台，企业工作流则可能捕获更高毛利价值。Forbes 2026 年特写是支持这一判断的最强单一证据，文中描述其
              AI 部门已盈利，估计毛利率为 70%。反论点同样重要：品牌植物基品类仍承压，北美商业化仍高度依赖 Kraft
              Heinz，公开记录也没有给出当前价格或流动性的干净证明。换句话说，公司可能不错，但价格可能仍然不对，或至少无法只靠公开证据判断。若入场条款无法验证、对标和压力测试，优质业务并不等于好投资。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV025
              - CV026
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV020
              - CV025
              - CV028
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV006
              - CV010
              - CV022
              - CV029
      - number: '8.2'
        title: 建议、信心与价格纪律
        blocks:
          - type: paragraph
            body: >-
              基于现有证据，合适建议是跟踪。这比回避更建设性，因为 NotCo
              有真实战略差异化，也有真实商业证明。但它也不到买入级别，因为公司仍是私有、部分不透明的证券，所在品类也困难。信心应为中等，因为太多关键估值输入仍是估计或未知。风险应为高，因为合作伙伴集中、标签风险和财务不透明都可能损害价值。估值立场应保持未知，而不是自信地说便宜或昂贵。没有当前定价轮，投资人无法知道今天入场是大幅折价、持平延续，还是因
              AI 溢价高于旧高点。因此，这里价格纪律比叙事热情更重要，尤其全球该板块已大幅重估。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV022
              - CV038
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: figure
