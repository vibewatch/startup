      - number: '2.4'
        title: 驱动因素、约束与失败模式
        blocks:
          - type: paragraph
            body: >-
              这个市场仍有真实的结构性顺风。消费者持续关注更健康、更可持续的食品；监管和零售商压力让改配方留在议程上；当传统蛋白变得更贵时，植物基价格差距可能收窄；大型食品公司也越来越需要能加快产品迭代的工具。但近期数据里的约束同样清楚。2025
              年植物基肉和海鲜销售额下降 10%，只有 11% 的美国家庭购买该品类，占包装肉类总销售额的份额仍约为 1.4%。Food Institute
              的报道显示，即使全球范围内有兴趣的消费者，也常常不会把口头兴趣转化为定期购买，因为价格、风味、便利性和信任仍然落后。这是 NotCo
              的关键市场失败模式：如果植物基消费品始终无法在主流价格—口味权衡上足够有吸引力，品牌业务就会封顶在小众渠道。抵消项是 AI 业务。即使零售品类增长令人失望，只要 Giuseppe
              能帮助处理原料波动、清洁标签改配方或更快把概念推上货架，企业买方仍可能为 NotCo 付费。因此，最有吸引力的市场形态不是植物基增长单引擎反弹，而是双引擎：消费产品证明概念，企业软件变现底层能力。
