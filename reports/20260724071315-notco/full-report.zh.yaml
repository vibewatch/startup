  summary: >-
    NotCo 是一家创立于智利的食品科技公司，早期从植物基消费品切入，如今越来越像一家横跨品牌食品和企业级食品制造 AI 平台的混合型公司。公开证据支持几个核心事实：2015 年成立，联合创始人兼 CEO Matias
    Muchnick 仍在掌舵，最后一个来源清晰的估值锚点是 2021 年的 $1.5B，2023-2025 年的经营重置则把重点放在效率、合作伙伴杠杆和毛利更高的 AI 工作流上。
