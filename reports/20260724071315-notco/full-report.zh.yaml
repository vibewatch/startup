      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Matias Muchnick 作为联合创始人兼 CEO，仍是 NotCo 最核心的公开领导者；他的公开履历也支撑着公司的商业叙事：他曾在智利创办 Eggless，并用那段运营经历把 NotCo
              定位成一家使命驱动的食品公司，同时也是 AI 赋能的配方引擎。Karim Pichara 一直被列为联合创始人兼 CTO，角色重心在机器学习、Giuseppe
              背后的分子数据架构，以及科学研究与配方自动化之间的连接。投资人和媒体画像仍把 Pablo Zamora 列为联合创始人，但他的当前运营角色不如 Muchnick 或 Pichara
              清晰。主要治理弱点不是创始人不匹配，而是披露稀缺。已审阅的官方页面没有公开董事会名单、详细高管梯队或当前组织架构图。这个问题重要，因为公司自 2023 年末以来一直在执行战略重置，而且看起来仍高度依赖
              Muchnick 作为战略制定者、融资负责人、公开发言人和商业交易推动者的判断。因此，治理尽调应少花时间验证已经清楚的创始人—市场匹配，更多聚焦董事会独立性、接班梯队，以及消费品与 AI
              平台两个部门之间的权责拆分。
