        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              公开记录中最干净的一手风险证据是法律。智利最高法院裁定，NotCo 可以保留 NotMilk
              商标，但必须从包装和广告中移除与牛奶相关的表述和乳制品图像。这个裁决重要，因为它直接触及包装、货架沟通和品牌资产。它也说明，标签不是 NotCo
              的理论争论，而是正在发生的运营约束。美国监管背景进一步强化了压力。FDA 2025
              年关于植物基替代品的指南草案称，只有在标签不虚假、不误导且清楚披露植物来源时，才能使用动物来源名称。合在一起，这些来源构成了一张风险面：法律、监管、产品和营销团队紧密耦合。NotCo
              可能成功适应，但负担会持续存在。更广泛的教训是，每进入一个新市场，都可能增加一种新的命名、广告或不正当竞争解释，需要持续、保守地监控。
