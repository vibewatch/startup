      - number: '8.4'
        title: 最后尽调问题与论点破坏点
        blocks:
          - type: paragraph
            body: >-
              在任何投委会把建议从跟踪往上推之前，尽调需要更清楚回答四个问题。第一，当前实际价格和股权结构是什么？第二，当前现金余额和跑道假设是什么？第三，企业客户使用到底有多深、续约性有多强？第四，北美在经济上多依赖
              Kraft Heinz？这些才是能改变建议的杠杆。主要论点破坏触发器也清楚：如果企业客户深度没有出现，而植物基品类压力持续，AI 溢价会坍塌，NotCo
              会更接近一家受挑战的品牌食品公司。反过来，更强的分部级披露，或显著更便宜的入场价，都可能改善建议。在那之前，承销纪律应压过错失恐惧。本章目的不是从不完整输入和不完整市场信号中强行得出虚假精确，而是负责任地框定判断。
