  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与待完成任务
        blocks:
          - type: paragraph
            body: >-
              NotCo
              位于更广泛的替代蛋白和植物基食品生态里，但这个大标签对尽调来说太宽。公司实际解决两类相互重叠的任务。第一类是消费者替代：做出植物基牛奶、汉堡、鸡肉、蛋黄酱、零食和联名产品，与既有动物来源食品争夺货架和菜单位置。第二类是食品制造商的工作流提速：帮助
              CPG 研发、采购、创新和改配方团队更快设计产品，降低成本，并获得更好的感官或监管适配。这个区分重要，因为每条线的买方、预算负责人和采用路径都不同。品牌 CPG
              的直接参照市场，是通过零售和餐饮销售的植物基肉、植物基乳品，以及相邻的更健康包装食品。企业级 AI
              的相关对照，则是食品产品开发软件、配方工具和外包研发。公开来源确认，植物基品类仍大但不均衡：规模足够重要，但价格和味道差距继续压低主流家庭渗透率和复购，低于多头曾经的预期。因此，NotCo
              的机会不是「所有食品」，而是一个更窄的楔子：在这里，产品改配方、利润保护和传统渠道分销，能比泛泛的植物基品牌更好地解决真实买方痛点。
