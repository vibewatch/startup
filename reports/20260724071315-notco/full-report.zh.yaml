  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 旅程因客群而异，但通常从货架或伙伴发现开始，最后走向复购或更广泛的工作流采用。
    data:
      items:
        - label: 认知
          value: Retail shelf discovery | partner brand trust | marketplace search | enterprise sourcing
          note: 消费者常通过既有零售商习惯接触 NotCo；企业买家则通过创新工作流接触。
        - label: 试用
          value: Buy NotMilk / NotBurger / Kraft NotCo SKU | run first formulation project
          note: 零售试用证据强，企业证据较弱。
        - label: 复购
          value: Rebuy in grocery aisle | repeat AI workflow project
          note: 零售复购只能间接看到；企业复购大多未披露。
        - label: 扩张
          value: Cross-category basket growth | more retailer doors | more CPG projects
          note: Kraft 重复发布和巴西门店增长显示出一些扩张路径。
        - label: 集中度检查
          value: Partner leverage and channel dependence
          note: 北美越来越多地经由 Kraft Heinz 进入市场。
