              SKU、商业整合——确认公司已经需要应对压力。产品风险不是 NotCo 缺技术，而是品牌消费者业务可能仍吸收利润率压力，而更有吸引力的 AI
              业务在客户深度和续约上披露不足。轻资产模式也塑造了供应链和制造风险。NotCo
              避开了自有工厂的完整成本，但也因此依赖合作伙伴生产和分销。财务不透明进一步放大所有这些风险，因为公开来源仍不披露当前现金、债务或烧钱速度。实践中，当利润率和流动性都部分隐藏时，一次温和的品类挫折也可能更快变成融资问题。
