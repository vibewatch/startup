            body: >-
              最具体的公开信任和合规证据，不来自安全页面或认证看板，而来自标签法律和法院审查。智利最高法院裁定，NotCo 可以保留 NotMilk 商标，但必须从包装和广告中移除与牛奶相关的表述和乳制品图像。另一个背景是
              FDA 2025 年关于植物基替代品的指南草案，强调命名不得虚假或误导，并应清楚披露植物来源。这些进展意味着，包装、命名和货架呈现都是 NotCo
              真实的产品管理职责。它们也凸显了公开界面缺什么：没有广泛可见的状态页、安全包或 Giuseppe 正式可靠性披露。这个缺口不否定产品，但限制了外部对运营质量控制和全球长期企业信任的信心。尽调的关键问题是，即使
