  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 公开证据指向一套分层架构：从专有数据出发，经由工作流模块，走向商业产品输出。
    data:
      layers:
        - label: 商业化层
          detail: NotCo 品牌和伙伴品牌产品证明产出已上真实货架
          tone: positive
        - label: 优化层
          detail: Giuseppe 工具在成本、质量和可行性约束下优化配方
          tone: positive
        - label: 发现 / 构思层
          detail: 发现工作流生成需求简报、搜索原料、塑造实验
          tone: positive
        - label: 科学反馈层
          detail: 人类感官反馈和配方迭代会随时间改进产出
          tone: neutral
        - label: 私有数据基础
          detail: 10 年数据和 10,000+ 个配方被描述为基础护城河
          tone: positive
    claimRefs:
