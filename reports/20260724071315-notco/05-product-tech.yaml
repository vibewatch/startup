  - FE004
- id: trust-quality-and-compliance
  title: Trust, quality, and compliance controls
  body: 'The most concrete public trust and compliance evidence does not come from a security page or certification dashboard; it comes from labeling law and court scrutiny. Chile’s Supreme Court ruled that NotCo can keep the NotMilk trademark but must remove milk-linked language and dairy imagery from packaging and advertising. Separately, FDA’s 2025 draft guidance on plant-based alternatives emphasizes that naming must not be false or misleading and that plant sources should be clearly disclosed. These developments mean packaging, naming, and aisle presentation are real product-management responsibilities for NotCo. They also highlight what is missing from the public surface: there is no widely visible status page, security pack, or formal reliability disclosure for Giuseppe. That absence does not invalidate the product, but it limits outside confidence in operational quality controls and long-term enterprise trust globally. For diligence, the key question is whether NotCo has strong internal
    governance around formulation claims, regulatory review, and customer deployment support even if it does not publish those processes externally.'
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE030
  - CE033
  - CE036
