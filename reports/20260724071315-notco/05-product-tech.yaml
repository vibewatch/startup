    - Trade-offs usually require many iterations
    - Optimization layer against business constraints
    - Faster prototype improvement
    - No public API / workflow evidence
  - - Prove consumer acceptance
    - R&D tools can be abstract to buyers
    - NotCo-branded products show output on shelf
