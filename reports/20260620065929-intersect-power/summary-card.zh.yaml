  topStrengths:
    - 公司开创了共址能源园区模型，超大规模云厂商将其视为 AI 基础设施供电的关键路径；Google 的 $4.75B 收购验证了这一点。
    - 与 Tesla（15.3 GWh Megapacks）和 First Solar（合计 6.4 GW）的长期供应协议锁定了规模化硬件，形成耐久采购护城河。
    - IPX spinout 后，平台覆盖 4.4 GW 太阳能和 8.8 GWh 电池储能；运营或在建基础设施 $15B，证明团队能在 gigawatt 级别交付。
    - 创始人主导的团队拥有深厚公用事业级太阳能运营经验，并获得蓝筹投资人支持（Google、TPG Rise Climate、CAI、Greenbelt）。
    - FERC 共址框架正朝有利于公司的方向演进，监管程序正在为数据中心邻近发电制定更清晰规则。
  topRisks:
    - 对 Sheldon Kimber 的关键人依赖明显；收购后与 Google 进行文化和战略整合，其离任或分心风险更高。
    - California 的 CAISO 限发和并网队列积压，可能拖延或搁浅组合内大型太阳能和储能资产。
    - 建设成本通胀、供应链扰动和组件关税风险，可能压缩 $15B 在建组合的项目经济性。
    - 单一客户集中风险：Google 既是收购方，也是主导购电方，限制收购后实体的商业选择。
    - FERC 共址规则制定仍在进行；不利裁决可能要求昂贵电网升级，或限制表后能源交付安排。
  unresolvedGaps:
    - 收入、EBITDA 和单位经济性未公开披露；每 MWh 能源成本和项目级 IRR 仍不透明。
    - 收购后员工数和组织深度未知；与 Google 的整合风险无法量化。
    - IPX Power 在与 Google 分离后的独立融资能力和客户 pipeline 需要进一步尽调。
    - Darden Project（美国最大太阳能 + 电池项目）的许可时间表和 capex 定稿仍未披露。
    - Google 与持续运营的 Intersect 实体之间的收购后商业条款未公开。
