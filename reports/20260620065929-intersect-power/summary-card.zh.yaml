summary:
  headline: >-
    Intersect Power 是定义品类的共址清洁能源平台；Google 以 $4.75B 收购，验证了“电力优先”的 AI 基础设施逻辑可以规模化。$12B
    总企业价值体现投资人对共址模型的强信心，但许可、电网互联和供应链交付仍绑定显著执行风险。
