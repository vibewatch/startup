  - - Strategic equity / M&A capital
    - Implied value partly observable through transactions
    - Ownership dilution and interim returns not fully public
    - TPG and Google transaction announcements
    - Valuation support exists despite operating opacity
  notes: This table focuses on pricing architecture because realized tariffs and margins are not public.
