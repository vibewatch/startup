    - Prevents quality-of-revenue assessment
    - Request 2025 and 2026 revenue by project and contract type
  - - EBITDA and gross margin
    - Prevents profitability and operating-leverage assessment
    - Request management P&L and gross-margin bridge
  - - Cash on hand and net debt
    - Prevents runway and leverage assessment
