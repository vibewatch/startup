- id: financial-gaps-and-verdict
  title: Financial Gaps and Underwriting Verdict
  body: >-
    Public disclosures are strong enough to establish financing sophistication and strategic validation, but weak on current operating performance. There is enough evidence to say that Intersect has mobilized billions of dollars of project and corporate capital, secured very large equipment commitments, and attracted both hyperscale and sponsor capital at meaningful valuations. There is not enough evidence to calculate current revenue, EBITDA, cash on hand, or leverage for the Google-owned entity. Nor is there enough public detail to allocate historical and future assets cleanly between Google-owned Intersect and TPG-backed IPX.


    The verdict is therefore positive on financeability and negative on disclosure completeness. Intersect looks underwritable only with confidential materials. The public record can support a high-level judgment on capital formation and project-finance capability, but not a full investment memo on earnings quality or runway. The public file is therefore a strong capital-markets dossier, but only a partial corporate-finance record. Today.
