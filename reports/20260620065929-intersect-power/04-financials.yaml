- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current Value / Status
  - Quality
  - Diligence Ask
  rows:
  - - Solar energy offtake
    - Contracted output from utility-scale solar projects
    - MWh under PPA or bilateral offtake
    - Publicly evidenced but not aggregated to corporate revenue
    - Moderate visibility
    - Request project-level contracted volumes and price decks
  - - Battery storage monetization
    - Arbitrage, capacity, and ancillary-value capture
    - MWh and capacity payments
    - Portfolio buildout is visible; realized pricing is not public
    - Moderate visibility
    - Request nodal revenue assumptions and dispatch cases
  - - Co-located data-center anchor offtake
    - Large-load campuses anchor new clean-power assets
    - MW and long-term contracted energy / capacity
    - Strategic partnership disclosed; terms not public
    - Low-medium visibility
    - Request anchor offtake terms and credit support
  - - Renewable attributes / resource adequacy
    - RECs, RA, and similar project-linked products
    - Certificates / MW-month
    - Visible at project level for some California assets
    - Low-medium visibility
    - Request attribute-retention and capacity-payment assumptions
  - - Development / financing value capture
    - Value in siting, queue control, procurement, and project financing
    - Project margin / sale uplift
    - Clearly real but not disclosed separately
    - Low visibility
    - Request development-fee and asset-rotation policy
  notes: Public sources show mechanisms but not realized company-wide revenue mix.
