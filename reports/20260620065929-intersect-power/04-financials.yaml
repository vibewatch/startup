- id: capital-stack-and-financing-structure
  title: Capital Stack and Financing Structure
  body: >-
    Intersect’s financing history shows a repeatable layered capital model. The 2022 $750 million growth-equity round strengthened the corporate platform. The 2023 Lumina and Oberon financing combined $2.4 billion of new commitments with $675 million of previously announced commitments across construction financing, tax equity, operational letters of credit, and portfolio term debt. The 2024 Texas BESS financing added another $837 million across construction debt, tax equity, and term debt for three standalone battery projects. Separate from asset-level SPV financing, the company also closed an up-to-$800 million revolving corporate credit facility to support platform liquidity and letters of credit.


    This matters because it shows that Intersect is financeable across multiple asset classes, but also that it is structurally dependent on external capital. The platform does not look self-funded from public operating cash flow; it scales by repeatedly bringing in sponsor equity, lenders, tax-equity investors, and strategic capital against development and operating assets. Google’s 2026 takeout validates that model, but does not remove the underlying capital intensity.
