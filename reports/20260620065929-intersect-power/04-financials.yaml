chapter:
  number: 4
  title: Financials
  summary: Intersect’s public financial picture is rich on capital formation and sparse on current operating metrics. Public sources clearly show repeated use of growth equity, construction debt, tax equity, term debt, revolving credit, and strategic M&A, culminating in Google’s $4.75 billion acquisition plus assumed debt and a parallel IPX spinout that TPG values within a combined $12 billion enterprise-value outcome. What remains undisclosed are current revenue, EBITDA, cash, and runway, so underwriting has to rely on project-finance architecture and capital-intensity proxies rather than a conventional P&L.
sections:
- id: revenue-model-and-monetization
  title: Revenue Model and Monetization Logic
  body: >-
    Intersect monetizes infrastructure delivery rather than software subscriptions. Official sources show a platform that develops, owns, and operates grid-tied clean-energy resources and co-located facilities for large industrial loads including data centers. Project and partnership releases imply several revenue mechanisms: contracted solar offtake, battery monetization, renewable attributes or capacity products tied to projects, and long-term large-load anchor offtake for hyperscale campuses. The economic unit is therefore energized capacity plus contract quality, not user seats or license volume.


    The practical implication is that the company’s economics depend on capital efficiency, interconnection timing, procurement certainty, and counterparty quality. These drivers show up directly in the financing and supply-chain disclosures. The public record is good enough to identify how value is created, but not good enough to quantify realized pricing or margin by stream. Later chapters should therefore treat the monetization model as visible in structure but opaque in realized outcomes.
  claimRefs:
  - CI001
  - CI002
  - CI010
