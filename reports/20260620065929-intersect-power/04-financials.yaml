- id: unit-economics-proxies-and-capital-intensity
  title: Unit-Economics Proxies and Capital Intensity
  body: >-
    Because Intersect does not publicly disclose revenue, margin, or cash-flow metrics, public unit economics must be inferred from proxies. The strongest public proxies are cost-of-capital access, speed from concept to COD, procurement leverage, and counterparty quality. The financing releases show that major lenders, tax-equity providers, and strategic investors repeatedly back the platform. The Tesla and First Solar agreements show that supply certainty is not just an operating detail; it is a financial input that lowers schedule risk and can make future financings easier to close.


    This is a capital-hungry model. Every additional gigawatt requires land, queue progress, engineering, procurement, and construction funding before operating cash arrives. That is why conventional SaaS metrics are the wrong public lens here. The better lens is whether Intersect can keep turning customer urgency and contract quality into lower perceived risk for lenders and buyers.
