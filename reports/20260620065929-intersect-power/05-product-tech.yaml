- id: hardware-stack
  title: 'Hardware stack: Tesla storage, First Solar modules, and operating projects'
  body: 'The public record shows that Intersect''s present technology stack depends heavily on third-party hardware leaders. Tesla supplies the battery backbone: the 2024 agreement covers 15.3 GWh of Megapacks through 2030, extends a pre-existing relationship, and underpins a fleet that Intersect says will approach 10 GWh of deployed large-scale storage by the end of 2027. First Solar is the analogous module supplier on the photovoltaic side, with a 2.4 GWDC order that took total expected deployed First Solar volume to roughly 6.4 GWDC by 2027. Named operating assets convert those procurement claims into physical proof. Oberon, Athos III, Radian, and Lumina demonstrate that Intersect is repeatedly moving multi-hundred-megawatt solar and solar-plus-storage sites from financing into operation across California and Texas. The supplier choices also clarify where technical control ends: Intersect integrates, finances, and deploys, while Tesla and First Solar remain critical equipment dependencies.'
