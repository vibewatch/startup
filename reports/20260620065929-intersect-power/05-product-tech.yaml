- id: trust-quality
  title: Trust, quality, and public disclosure limits
  body: The trust profile is adequate for a developer-led infrastructure company but materially weaker than the deployment proof. Public sources establish named hardware suppliers, named operating sites, lender participation, and project-level operating claims. They do not establish fleetwide degradation metrics, uptime history, inverter or balance-of-plant performance, cyber controls, or a disclosed software-governance framework for energy-park operations. Tesla's own Megapack documentation confirms that the battery product bundles controls and software with the hardware, which helps explain why Intersect can execute quickly but also increases dependency on external systems. The absence of public detail is not unusual for a private developer, yet it matters for a diligence process because co-located energy parks serving AI loads will need more than construction proof; they will need dispatch reliability, cyber resilience, and long-duration operating data. In that sense, the main product
    question is no longer whether Intersect can build large sites, but whether it can document operating excellence at the same level of specificity.
  claimRefs:
  - CE029
  - CE030
  - CE034
  - CE035
