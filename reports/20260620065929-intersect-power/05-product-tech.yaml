company:
  name: Intersect Power
chapter:
  number: 5
  title: Product & Technology
  summary: 'Intersect''s product is a project system: utility-scale solar, battery storage, project finance, and load siting packaged into co-located energy parks. Public evidence strongly supports deployment maturity for solar and solar-plus-storage assets and for supplier-backed procurement, but operating transparency around fleet performance, software governance, and co-located controls remains limited.'
sections:
- id: product-definition
  title: Co-located energy park product and buyer workflow
  body: Intersect's product is not a single battery, panel, or software SKU. The public material describes a project system that co-locates renewable generation, battery storage, interconnection rights, and digital-load siting so that AI infrastructure can come online faster than a grid-only procurement path would allow. The About and Solutions pages frame this as scalable infrastructure for an AI-constrained power market rather than a merchant solar developer pitch. In practice the buyer workflow starts with a large load customer or utility-scale power need, continues through site control and project financing, layers in solar and storage hardware from named suppliers, and ends with an operating asset whose power can serve either the grid or co-located demand. That product framing matters because Intersect's technology edge is systems integration, speed, and repeatable large-project execution rather than ownership of core battery chemistry, inverter IP, or solar-module manufacturing.
