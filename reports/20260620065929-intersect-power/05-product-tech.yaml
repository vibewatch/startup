- id: scale-roadmap
  title: Deployment proof, financing cadence, and scale roadmap
  body: Intersect's product maturity is best judged by the cadence of financings and commercial-operation milestones rather than by software release notes or manufacturing throughput. The 2022 $3.1 billion portfolio financing, the Athos III and Oberon construction financings, the Radian and Lumina financings, and the 2024 revolving facility collectively show a capital-intensive but repeatable deployment engine. On the operating side, Oberon and Athos III prove solar-plus-storage integration in California; Radian and Lumina prove solar execution in Texas; and the 2023 battery-additions announcement plus the 2024 Texas storage financing show the company has widened from solar-led execution into battery-led portfolios. Forbes' profile of Sheldon Kimber positions Darden as the next physical-scale step, with a permitted California project that would be the country's largest solar-and-battery installation. The roadmap is therefore concrete on asset scale and capital needs, but still thin on public
    performance disclosures once assets are operating.
  claimRefs:
