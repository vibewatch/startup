- id: software-dispatch
  title: Dispatch software, deployment speed, and project architecture
  body: 'The Texas storage portfolio gives the clearest product-level look at software and dispatch architecture. Intersect disclosed that Lumina II and Radian will be operated on Tesla Autobidder, meaning a meaningful slice of the value proposition depends on external market-optimization software layered over Tesla hardware rather than a named Intersect-native control stack. The same disclosures state that each site uses 86 Megapacks, delivers 320 MWh of two-hour storage, and moved from concept to commissioned in under 12 months. Those are unusually concrete operating details for a private infrastructure developer and support the argument that Intersect''s product advantage comes from compressing project-development timelines and packaging repeatable design choices into a portfolio workflow. They also surface a risk: if dispatch economics or vendor software performance diverge from expectations, Intersect has limited public evidence of an internally differentiated fallback.'
