  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: trust-gap
    missingEvidence: Fleetwide battery degradation, uptime, and dispatch-margin data for operating storage projects.
    whyItMatters: Operating performance is necessary to judge whether the product advantage is durable beyond construction speed.
    diligencePath: Request operating dashboards or independent asset reports for Oberon, Athos III, and the Texas BESS trio.
  - type: missing-source
    severity: material
    topic: co-location-controls
    missingEvidence: Detailed control architecture for co-located energy parks serving digital load, including fallback and cyber controls.
    whyItMatters: AI-load customers will care about power quality, resilience, and software-governance assurances before relying on the assets.
    diligencePath: Request system architecture diagrams, control-room workflows, and any cyber or power-quality certification package.
  - type: missing-source
    severity: minor
    topic: interconnection
    missingEvidence: Project-by-project interconnection queue position, curtailment assumptions, and export constraints for named projects.
    whyItMatters: These factors shape realized project economics and the reliability of the co-location thesis.
    diligencePath: Request queue filings, interconnection agreements, and merchant-curtailment models for the major California and Texas assets.
