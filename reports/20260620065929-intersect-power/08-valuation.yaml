- id: TV006
  title: Thesis-break and final diligence asks table
  columns:
  - Topic
  - Missing evidence / trigger
  - Why it matters
  - Diligence path or action implication
  rows:
  - - Project economics
    - Per-site cash flow, margin, and contract bridge from transaction value
    - Needed to convert strategic premium into underwritable returns
    - Request project model extracts or board materials
  - - Customer diversification
    - Named customer roster beyond Google and utility-class abstractions
    - Needed to reduce concentration discount
    - Request top-customer concentration and contract-tenor summary
  - - Regulatory clarity
    - FERC / PJM outcomes for co-located load
    - Could expand or compress premium materially
    - Track filings and update downside case on adverse outcomes
  - - First-site execution
    - Haskell County schedule, budget, and commissioning milestones
    - Closest proof point for repeatability
    - Treat major delay as thesis-break trigger
  - - IPX economics
    - Standalone leverage, cash generation, and offtake mix
    - Needed to assess the value of the residual platform
    - Request spinout capitalization and operating plan
  notes: Final diligence asks focus on what would move the recommendation, not on what is already visible from public headlines.
