company:
  name: Intersect Power
chapter:
  number: 8
  title: Valuation
  summary: 'The public record clearly supports strategic value: Google paid $4.75 billion plus debt, TPG framed the full transaction plus IPX spinout at $12 billion, and the pre-sale platform had meaningful scale. What it does not support is high-confidence intrinsic-value precision, because detailed project economics, customer diversification, and rule clarity remain incomplete. The right stance is Track / Research More with medium confidence and a fair-to-stretched valuation view.'
sections:
- id: thesis-antithesis
  title: Investment thesis and anti-thesis
  body: 'The valuation debate starts with an unusual fact pattern: Google did not simply sign more clean-power contracts, it bought the developer. That alone is powerful evidence that Intersect''s combination of development speed, siting capability, and data-center power strategy is strategically valuable. The bull thesis is that Google validated a scarce control point in a power-constrained AI economy and that the 2024 partnership plus 2026 acquisition created a new category of premium infrastructure platform. The anti-thesis is that the premium may already be paid for. Public economics remain thin, co-location rules are still evolving, and Google remains the only named hyperscaler customer. Investors therefore have strong evidence of strategic value but incomplete evidence of durable cash-flow quality. In that setting, the right judgment is neither dismissive nor euphoric: the business looks valuable, but the public record is not detailed enough to justify a high-conviction bargain thesis
    after a multi-billion-dollar strategic takeout.'
  claimRefs:
