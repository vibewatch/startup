- id: comparables
  title: Comparable transactions and platform references
  body: The comparable set is necessarily messy, which is exactly why valuation discipline matters. The most relevant transaction benchmark in the source set is not a public-company multiple; it is Google's own Clearway procurement path. Google contracted 1.2 GW and more than $2.4 billion of infrastructure investment through Clearway without acquiring the developer, which helps show what contracted clean-power access alone can look like. The Intersect acquisition is much larger and therefore appears to price platform control and speed-to-power, not merely output. The competitor platform pages from Clearway, NextEra, Brookfield, AES, Invenergy, Arevon, SB Energy, and Leeward are useful because they show how deep and sponsor-rich the infrastructure field is. They are less useful for precise valuation math because the cited pages do not provide like-for-like market multiples or detailed segment economics. The right use of comps here is to frame strategic scarcity and infrastructure-platform
    quality, not to pretend public pages create a neat EV per megawatt formula.
