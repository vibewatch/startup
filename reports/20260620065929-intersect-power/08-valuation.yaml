  - - TPG enterprise-value framing
    - $12B including IPX spinout
    - Best public whole-platform valuation reference
    - Comes from selling shareholder, not a neutral appraisal
  - - IPX scale
    - 4.4 GW solar + 8.8 GWh storage; ~$10B capital investments
    - Shows residual asset platform scale after sale
    - Does not disclose cash flow or leverage
  - - Pre-sale operating / construction base
    - $15B assets operating or under construction
    - Supports premium for existing scale and development engine
    - Asset value is not equivalent to equity value
  - - Growth option
    - 10.8 GW by 2028 and $20B infrastructure target
    - Shows why strategic buyers may pay beyond static portfolio value
    - Targets are execution-dependent
  notes: This table isolates the public valuation anchors before scenario modeling.
