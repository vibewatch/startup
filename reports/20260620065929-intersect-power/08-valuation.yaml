  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: project-economics
    missingEvidence: Project-level cash flow, margin, leverage, and customer-term data for the acquired assets and the IPX spinout.
    whyItMatters: Transaction prices alone are not enough to decide whether the premium is attractive or stretched.
    diligencePath: Request management model excerpts or fairness-materials detail under NDA.
  - type: missing-source
    severity: material
    topic: customer-diversification
    missingEvidence: Named buyer diversification beyond Google and utility-class references.
    whyItMatters: Concentration is the clearest discount factor in the public record.
    diligencePath: Request top-customer concentration and signed pipeline by market and segment.
  - type: missing-source
    severity: material
    topic: TV004 comp coverage remains partial because public pages do not provide a fully priced comparable universe.
    missingEvidence: A fuller priced comp set with market values, leverage, and segment mix for infrastructure peers.
    whyItMatters: Without priced comps, valuation relies more on scenarios and transaction triangulation than on cross-sectional multiple analysis.
    diligencePath: Build a private comp sheet using public filings, equity research, and asset transaction data.
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: minor
    topic: post-acquisition operating plan
    missingEvidence: A detailed operating and governance plan showing how value creation is split between Google-owned assets and IPX.
    whyItMatters: Needed to understand where future upside actually accrues after the transaction.
    diligencePath: Request post-close governance, cap structure, and operating-rights summary.
