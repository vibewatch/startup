- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Thesis argument
  - Support
  - Anti-thesis argument
  - What would change the view
  rows:
  - - Google paid for a scarce control point in AI-era power infrastructure
    - Acquisition, platform scale, and data-center demand evidence
    - The premium may already be paid, with economics still opaque
    - Project-level cash flows and first-site proof validate durable returns
  - - Intersect offers speed-to-power rather than commodity generation alone
    - Partnership and acquisition language emphasizes acceleration
    - Co-location rules remain unsettled and could erode the advantage
    - Clear rule outcomes and repeatable site delivery reduce uncertainty
  - - Portfolio and growth option justify premium valuation
    - $15B assets, 10.8 GW target, $20B infrastructure ambition
    - Targets can overstate realizable value if markets, capital, or customers disappoint
    - Named diversification and operating metrics show conversion from plan to performance
  - - Strategic ownership by Google de-risks demand
    - Google is buyer, partner, and sponsor
    - Google concentration can become a single-point failure for narrative and expansion
    - Additional named hyperscaler or utility counterparties reduce single-buyer risk
  notes: The anti-thesis is not a denial of strategic value; it is a warning against extrapolating strategic value into precise fair-value certainty.
