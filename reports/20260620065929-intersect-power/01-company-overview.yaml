- id: leadership-and-governance
  title: Leadership, Governance, and Key-Person Dependence
  body: >-
    Founder and chief executive Sheldon Kimber is the central executive dependency in the public record. Intersect’s own leadership page and profile describe him as the architect of the company’s financing and supply-chain strategy, and his prior operating roles at Recurrent Energy and Calpine explain why capital formation and deployment speed show up so heavily in Intersect’s model. The About page also shows a compact senior team — including finance, commercial, operations, administrative, capital-markets, procurement, and engineering leaders — that is designed around project execution rather than software-style product management.


    Governance changed materially with each major financing step. The 2022 growth-equity transaction added TPG Rise Climate representation alongside continuing investors such as CAI and Greenbelt-linked stakeholders, while the 2024 Google/TPG funding round deepened strategic-control influence without displacing Kimber from the CEO seat. The March 2026 Google close preserved the Intersect brand and Kimber’s operating role, but it also carved the legacy grid-tied fleet into IPX Power, meaning governance and asset ownership are now split across two related but distinct platforms. That split reduces organizational simplicity and increases key-person dependence on Kimber’s ability to manage the Google relationship while preserving continuity across projects already in development.
