company:
  name: Intersect Power
chapter:
  number: 1
  title: Company Overview
  summary: Intersect Power is a San Francisco-founded clean-energy infrastructure developer that pivoted from a grid-tied solar-and-storage builder into a co-located data-center power platform before Google agreed to buy the digital-power business for $4.75 billion plus assumed debt. The post-close structure split the legacy grid-tied fleet into IPX Power, majority backed by TPG Rise Climate, valuing the combined transactions at $12 billion and leaving Sheldon Kimber leading Intersect’s Google-owned platform while IPX retained 4.4 GW of solar PV and 8.8 GWh of storage in construction or operation.
sections:
- id: identity-and-operating-model
  title: Identity, Founding, and Operating Model
  body: >-
    Intersect Power is a clean energy developer and infrastructure platform founded in 2016 and headquartered in San Francisco, California. Company-owned surfaces consistently describe the business as a builder, owner, and operator of very large renewable-energy and storage assets, while third-party coverage shows that by late 2024 the company had extended that model into co-located data-center power parks. The company’s current operating identity is therefore not just “solar developer,” but a developer of grid-tied and co-located energy-and-digital infrastructure that tries to shorten the time between site control, power delivery, and large-load energization.


    The business model evolved in two steps. First, Intersect scaled a utility-scale solar-plus-storage platform across Texas and California through project finance, supply-chain contracting, and long-dated offtake relationships. Second, the Google and TPG partnership announced in December 2024 repositioned Intersect as a “power-first” data-center infrastructure developer that could pair hyperscale load with on-site clean generation and storage. The post-acquisition Solutions page keeps that framing, emphasizing AI infrastructure, co-location, and fast-ramping firming sources rather than standalone renewable development alone. That identity shift matters for every later chapter because it changes the relevant buyer set, regulatory exposure, and valuation frame from a conventional IPP lens to an infrastructure-and-capacity-delivery lens.
