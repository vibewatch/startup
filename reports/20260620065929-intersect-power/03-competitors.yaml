- id: buyer-access-and-data-center-positioning
  title: Buyer Access, Data-Center Positioning, and Distribution Power
  body: >-
    A crucial competitive dimension is access to the same buyer set Intersect is targeting. Clearway’s 2026 independent coverage is especially relevant because it shows Clearway winning large carbon-free power commitments from Google, including articles that reference roughly 1.2 GW of supply and a multibillion-dollar power deal structure. SB Energy already positions Google as the anchor customer on Orion and calls that arrangement Google’s largest solar investment in the world. Constellation, as an incumbent clean and reliable generation provider, also frames the data economy and electrification as core demand themes, even if the specific fetched data-center landing page returned a 404. The implication is that Intersect is competing for hyperscaler mindshare against platforms that already have demonstrated Google or large-load relationships.


    Distribution power also differs sharply across the landscape. NextEra emphasizes fully funding project costs for customers and bringing utility-scale projects online quickly. Clearway highlights the ability to arrange 100% of required project funding through sponsor equity, construction financing, tax equity, and debt. Brookfield and AES signal breadth and reliability more than project-level customization. Intersect’s answer is a more integrated co-location proposition, but buyers with existing trusted relationships may still prefer incumbent suppliers unless Intersect’s faster energization path is materially better.
