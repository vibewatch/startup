- id: moat-durability-and-competitive-risks
  title: Moat Durability, Commoditization Risk, and Where Intersect Still Wins
  body: >-
    Intersect’s strongest competitive claims are speed, co-location design, and the ability to bridge renewable generation with large-load requirements. The company’s Google transaction and post-close Solutions page support the view that hyperscalers value that packaging. But those same claims are also reproducible by better-capitalized incumbents. If co-location becomes a standardized market design, then the unique value may migrate away from who first framed the energy-park concept and toward who can most cheaply finance, site, and interconnect it at scale. That favors players like NextEra, Brookfield, and Clearway, all of which already manage more assets or capital than Intersect.


    The moat is therefore real but conditional. Intersect appears strongest where speed-to-power, shared-infrastructure design, and large project packaging matter more than existing utility fleet breadth. It appears weaker where customers primarily value balance-sheet depth, existing operating portfolio, or incumbent retail-generation relationships. The chapter’s risk register treats commoditization, hyperscaler bargaining power, supply-chain imitation, and financing competition as the principal durability tests. The competitive verdict is that Intersect is differentiated enough to matter, but not insulated enough to ignore scaled incumbents or sponsors with similar customer access.
