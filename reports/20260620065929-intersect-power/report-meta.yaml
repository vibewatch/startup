companyProfile:
  summary: >-
    Intersect Power, founded in 2016 by Sheldon Kimber and headquartered in San
    Francisco, CA, built one of the most capital-efficient large-scale solar and
    battery storage platforms in the United States. The company pioneered
    co-located "energy park" projects that pair gigawatt-scale solar generation
    and multi-gigawatt-hour battery storage directly adjacent to hyperscaler data
    centers, eliminating long-distance transmission and enabling near-100%
    carbon-free power for AI compute workloads. By December 2024 Intersect held
    a 2.2 GW solar and 2.4 GWh battery base portfolio, secured a strategic
    partnership with Google and TPG Rise Climate, and closed an ~$800M equity
    round targeting $20B of renewable infrastructure by 2030. Google completed
    the $4.75B acquisition of Intersect's digital power business in March 2026,
    while TPG and co-investors spun out the grid-tied assets into IPX Power at a
    $12B combined enterprise value.
  foundedDate: "2016-01-01"
  founders:
    - name: Sheldon Kimber
      role: Founder and CEO
      background: >-
        Former COO at Recurrent Energy and executive at Calpine, Goldman Sachs,
        and Accenture; deep operational background in utility-scale solar
        development and power trading.
      claimRefs: [CO004, CO005]
  foundingLocation: "San Francisco, CA"
  headquarters: "San Francisco, CA"
  productSummary: >-
    Large-scale solar PV projects (200–800+ MW) co-located with multi-hundred-MWh
    to multi-GWh Tesla Megapack battery storage systems, connected directly to
    hyperscaler data center campuses; also sells into utility and merchant markets
    via long-term PPAs and shorter-tenor offtake contracts.
  customerFocus: >-
    Hyperscaler cloud and AI companies (principally Google) requiring gigawatt-scale
    carbon-free power for data center campuses; secondarily, utilities in California
    and Texas seeking large-scale renewables under long-term offtake agreements.
  businessModel: >-
    Infrastructure developer and owner-operator: Intersect finances construction
    with project debt, tax equity, and corporate equity; revenue comes from
    long-term PPAs and energy-market sales; capital is recycled through
    refinancing and strategic sales once projects reach commercial operation.
  stage: Acquired (Google, March 2026)
  fundingStatus: >-
    Acquired by Google for $4.75B plus debt (March 2026); prior equity rounds
    include $750M from TPG Rise Climate, CAI, and Trilantic (2022) and ~$800M
    from Google and TPG (December 2024); total project financing exceeded $6B
    across the base portfolio.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO020, CO022]
summary:
  headline: >-
    Intersect Power is a category-defining co-located clean energy platform whose
    $4.75B acquisition by Google validates the power-first AI infrastructure thesis
    at scale; the $12B total enterprise value signals strong investor conviction in
    the co-location model, with significant execution risk tied to permitting,
    grid interconnection, and supply-chain delivery.
