- id: people-customer
  title: People, customer concentration, and strategic dependency
  body: Key-person and customer concentration are intertwined here. Sheldon Kimber remains the founder, CEO, and public architect of the company's strategy, and public materials do not disclose a detailed succession plan. At the same time, Google is the only named hyperscaler customer in the public record and now anchors the ownership and go-to-market story for the digital power business. TPG says the spun-out IPX platform serves utilities and other customers, which helps, but named diversification is still thin. The concentration risk is not just that Google is big; it is that the market now interprets the strategy through Google's continued enthusiasm. That helps commercial credibility, but it also means any pullback, reprioritization, or site delay can reverberate through financing, recruiting, and counterparties. In short, strategic sponsorship is a mitigation and a dependency at the same time.
  claimRefs:
  - CR023
  - CR024
  - CR025
  - CR026
  - CR037
  - CR038
  tableRefs:
  - TR004
- id: capital-mitigation
  title: Capital-markets risk, monitoring signals, and thesis-break triggers
  body: 'Intersect''s risk stack becomes investable only if the company can keep financing it. The public financing record is impressive but also revealing: repeated billion-dollar project financings, a large BESS financing, and an $800 million revolver show that capital intensity is not a side issue but a core operating requirement. If debt markets tighten, tax-equity appetite weakens, or construction risk rises because of regulatory or first-site delays, the company can face a negative chain reaction even with healthy demand. The right mitigation framework is therefore monitorable, not narrative. Track FERC rules, queue movement, curtailment trends, ERCOT constraint updates, supplier deliveries, site-construction timelines, and any signals around Kimber or Google commitment. A thesis break would not require a total collapse; it would require a visible impairment to the repeatability of the model. That could be a hostile co-location ruling, a major delay in Haskell County, a financing freeze,
    or a strategic retreat by Google.'
