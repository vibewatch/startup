company:
  name: Intersect Power
chapter:
  number: 7
  title: Risks
  summary: Intersect Power's risk stack is dominated by unresolved co-location rules, grid-market friction in California and Texas, supplier concentration around Tesla and First Solar, capital intensity, and heavy dependence on Google and Sheldon Kimber. Strategic sponsorship helps, but it does not remove regulatory, congestion, first-site, or financing risks.
sections:
- id: regulatory-legal
  title: Regulatory and legal risk around co-located load
  body: 'Intersect''s highest non-technical risk is regulatory: the economic promise of co-locating data-center load with new generation still depends on how power-market operators and regulators classify that load, allocate network costs, and treat energy delivered behind or adjacent to the meter. FERC opened a process on co-location issues in late 2024 and then pushed PJM to create clearer rules in 2025, which legal commentators described not as a solved problem but as proof that the rules are still being written. For Intersect, this matters because the flagship Google strategy is explicitly built around co-located energy parks. A favorable rule set could reward the model; an unfavorable one could force more costly grid treatment, slower interconnection, or narrower contract structures. The Google acquisition does not remove this risk. It changes who owns the assets, but it does not change the fact that the projects must function inside evolving market rules.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR034
  - CR038
  - CR040
  - CR042
  tableRefs:
