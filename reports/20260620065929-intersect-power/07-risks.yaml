  evidenceGaps:
  - type: missing-source
    severity: material
    topic: project-level rule exposure
    missingEvidence: Project-by-project treatment of co-located load, network charges, and interconnection assumptions for the first energy parks.
    whyItMatters: General regulatory commentary cannot substitute for actual commercial assumptions embedded in signed projects.
    diligencePath: Request the regulatory memo and interconnection assumptions for Haskell County and other first-wave sites.
  - type: private-evidence-only
    severity: material
    topic: operating-controls
    missingEvidence: Cyber controls, outage history, and power-quality documentation for the control stack serving co-located load.
    whyItMatters: The public record proves procurement and financing more than operating resilience.
    diligencePath: Request certifications, incident logs, and third-party reliability reviews.
  - type: missing-source
    severity: material
    topic: utility-customer-diversification
    missingEvidence: Named utility or grid-offtake roster behind the IPX customer base.
    whyItMatters: Diversification claims are difficult to underwrite without counterparties and revenue mix.
    diligencePath: Request customer concentration table and offtake tenor mix for the grid-tied portfolio.
  - type: missing-source
    severity: minor
    topic: succession-plan
    missingEvidence: Formal leadership succession and delegated operating authority for Kimber and key project executives.
    whyItMatters: Key-person risk is meaningful because public leadership visibility is concentrated.
    diligencePath: Request board-approved succession documentation and emergency transition plan.
