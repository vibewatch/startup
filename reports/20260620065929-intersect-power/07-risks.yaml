- id: grid-market
  title: 'Grid and market risk: CAISO curtailment, ERCOT constraints, and queues'
  body: 'The company is concentrated in precisely the two U.S. power markets where demand is strongest and grid complexity is hardest to ignore. In California, CAISO''s 2025 curtailment reports confirm that renewable curtailment remains a real operating condition, which can reduce solar capture and push more of the value stack onto storage optimization or co-located load absorption. In Texas, ERCOT''s own materials describe a system absorbing rapid growth in both electricity demand and generating resources while still carrying explicit transmission and system-constraint concerns. LBNL''s national queue data adds a structural point: interconnection delay remains a generic development risk even for well-capitalized sponsors. Energy parks can help by matching load and supply more directly, and Energy Innovation argues they are a rational response to demand growth, but none of those sources suggest a frictionless bypass. The market risk is therefore two-sided: the same demand boom that makes
    Intersect strategically valuable also makes execution and congestion risks harder to escape.'
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
