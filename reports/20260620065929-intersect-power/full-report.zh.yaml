      - number: '7.2'
        title: 电网和市场风险：CAISO 弃电、ERCOT 约束与队列
        blocks:
          - type: paragraph
            body: >-
              公司恰好集中在美国两个需求最强、也最难忽视电网复杂性的电力市场。加州方面，CAISO 2025
              年弃电报告确认，可再生能源弃电仍是真实运营条件，可能压低太阳能捕获率，并把更多价值栈推向储能优化或共址负载吸收。德州方面，ERCOT
              自己的材料描述了一个同时吸收电力需求和发电资源快速增长的系统，并仍明确存在输电和系统约束担忧。LBNL 全国队列数据补充了结构性问题：即便对资本实力强的发起方，互联延迟仍是普遍开发风险。Energy park
              可以通过更直接匹配负载和供给来缓解，Energy Innovation 也认为它们是应对需求增长的理性方案，但没有任何来源暗示这是一条无摩擦绕行路。市场风险因此是双向的：同一轮需求繁荣让 Intersect
              具备战略价值，也让执行和拥堵风险更难摆脱。
