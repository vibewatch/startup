      - number: '8.2'
        title: 交易背景与价格真正买到什么
        blocks:
          - type: paragraph
            body: >-
              公开记录里最清晰的估值锚，是交易价格和 IPX 拆分对应的企业价值框架。TPG 称 Google 支付 $4.75 billion 加债务，并称包含 IPX 在内的总企业价值为 $12
              billion。这并不等于核心开发平台按一个简单倍数交易。价格买到的似乎是一组东西：既有资产、未来项目管线、数据中心 送电速度的控制权，以及能源园区部署的战略期权。pv magazine
              进一步给出规模背景：运营或建设中的资产为 $15 billion，预计到 2028 年约 10.8 GW 上线或在开发中；合作材料还给出 $20 billion
              的未来基础设施雄心。换句话说，公开估值锚奖励的是现有组合规模加未来共址项目的期权价值，而不只是既有资产的近期 EBITDA。
