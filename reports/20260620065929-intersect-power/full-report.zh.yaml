  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：既有巨头、平台型 IPP 与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Intersect 的竞争格局横跨三类玩家。第一类是 NextEra Energy Resources、Brookfield Renewable、Constellation
              等超大型既有电力和基础设施平台，它们带来 Intersect 目前还无法匹配的规模、资本市场通道和运营宽度。第二类是 Clearway、SB Energy、Arevon、Invenergy
              等聚焦清洁能源的开发商和业主运营商，它们更直接地在项目开发、融资结构、土地控制和混合可再生加储能交付上竞争。第三类是零售能源或传统电网供应商等替代提供方，它们可以通过更慢或整合度更低的路径服务同一个终端客户问题。


              这个格局重要，因为买方并不会抽象地购买“可再生能源”。公用事业、CCA、hyperscaler 和大型工业负载购买的是速度、可靠性、合同结构、融资确定性，以及社区或供应链定位的组合。因此，Intersect
              的护城河不是简单的太阳能专长，而是把发电、储能和大负载设计打包成一套连贯项目开发方案的能力。问题在于，这套组合能否顶住更大竞争对手：它们拥有更多发电容量、更多运营资产，或与同一批 hyperscaler
              已有客户关系。
