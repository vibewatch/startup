      - number: '2.2'
        title: 规模测算、容量供给与队列视角
        blocks:
          - type: paragraph
            body: >-
              现实的市场规模视角必须从物理供给约束出发，而不是从 TAM 口号出发。LBNL 队列数据显示，到 2025 年底，超过 2,060 GW 总发电和储能容量正在积极申请互联；同一数据集中的 2024
              版显示，队列中约有 956 GW 太阳能和 890 GW 储能。这些数字证明供给底盘巨大，但也证明队列规模不等于可建设供应：2000 年至 2019 年申请互联的容量中，到 2024 年底只有 13%
              达到商业运营，已建项目的队列中位时长也拉长到四年以上。


              对 Intersect 来说，相关 SAM 是公用事业级发电和储能中真正能跨过选址、输电、融资和买方匹配门槛的部分。Energy Innovation 2024 年关于 “energy parks”
              的论文在这里有价值，因为它把机会从不受约束的可再生部署，重新框定为围绕共享基础设施和大型消费者更快上市。因此，本章的金字塔和区间图采用可建设容量逻辑：最外层是总排队容量，然后是已有协议的较小队列容量，再往内是未来几年内可为共址或公用事业承购用途现实融资的新项目切片。
