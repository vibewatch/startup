      - number: '2.3'
        title: 采用驱动、电网摩擦与监管约束
        blocks:
          - type: paragraph
            body: >-
              需求逻辑很强，但约束逻辑同样重要。CAISO 2024 年弃用了 3.4 million MWh 公用事业级风电和太阳能发电量，同比增长 29%，其中太阳能占 93%。与此同时，ERCOT 报告 2025 年 5
              月需求创下 65,614 MW 纪录，并同时面对电池出力上升和大负载互联申请激增。这些数据说明，仅有新增发电还不够；市场也重视区位匹配、储能时长、输电接入和灵活需求。


              共址是有前景的答案，但还没有完全定型。FERC 2025 年 2 月的说明理由令和 2025 年 12 月的 PJM 命令都称，现有电价规则并不是为大型共址数据中心负载设计的。Utility Dive、Mintz
              和 Beveridge & Diamond 对由此产生的框架解读一致：共址可以加快部署并改善成本匹配，但前提是监管机构和电网运营商把服务规则讲清楚。Intersect
              的市场窗口存在，是因为这些摩擦让电力交付能力变得稀缺；但同一批摩擦也是主要采用约束，可能放慢项目落地或削弱经济优势。
