            body: >-
              单看平台规模，Intersect 小于多数具名竞争对手。NextEra 称其在可再生能源、核电、天然气和储能合计拥有超过 40,000 MW 总发电容量。Brookfield 报告管理资产 $142B、容量
              46,000 MW。Clearway 的发起人和收益型结构给了它 13.6 GW 总组合，以及风电、太阳能和储能的深厚开发管线。Constellation
              把自己定位为数据经济和电气化提供清洁可靠能源的供应商，这意味着它从既有发电加零售角度切入同一需求问题，而不是只从开发商角度切入。


              更直接的可再生开发同业也很有规模。SB Energy 项目页面显示，900 MWdc Orion Solar Belt 由 Google 担任锚定客户，1.6 GWh Athos 储能项目在建，并在 2023
              年为 1.3 GW 太阳能组合完成总额 $2.4B 的融资包。Arevon 报告拥有并运营 6+ GW，超过 670 MW 在建，过去两年项目融资超过 $5.1B。Invenergy
              官方网站内容在抓取页面集中不够容易访问，但仍称公司已开发超过 200 个清洁能源项目，并列出太阳能、风电、储能、输电和地热为活跃技术。这些不是小众开发商，而是规模化基础设施竞争者。
