            body: >-
              Intersect 的融资历史显示出可复制的分层资本模式。2022 年 $750M 成长股权轮强化了公司平台。2023 年 Lumina 和 Oberon 融资把 $2.4B 新承诺与此前已宣布的 $675M
              承诺结合起来，覆盖建设融资、税务股权、运营信用证和组合定期债务。2024 年德州 BESS 融资又为三个独立电池项目加入 $837M，覆盖建设债务、税务股权和定期债务。除资产级 SPV 融资外，公司还完成最高
              $800M 的循环公司信贷工具，用于支持平台流动性和信用证。


              这点重要，因为它说明 Intersect
              能跨多个资产类别融资，但也说明公司结构上依赖外部资本。公开运营现金流看不出平台可以自我融资；它通过反复引入发起人股权、贷款方、税务股权投资者和战略资本，针对开发和运营资产扩张。Google 2026
              年收购验证了这个模式，但没有消除底层资本密集度。
