  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              估值争论从一个不寻常的事实开始：Google 不只是签了更多清洁电力合同，而是买下了开发商。这本身就强有力地证明，Intersect
              把开发速度、选址能力和数据中心电力战略拼在一起，具有战略价值。多头论点是，Google 验证了电力受限的 AI 经济中一个稀缺控制点；2024 年合作加上 2026
              年收购，创造出一种新的高溢价基础设施平台。反论点是，溢价可能已经付过。公开经济数据仍少，共址规则还在演化，Google
              仍是唯一点名的超大规模客户。因此，投资人有强证据证明战略价值，却缺少足够证据证明现金流质量可持续。在这种情况下，合理判断既不是否定，也不是狂热：业务看起来有价值，但在一笔数十亿美元战略收购之后，公开记录还不足以支撑高确信度的便宜货论点。
