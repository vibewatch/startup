  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 将公开估值争论框定为情景区间，而非单点公允价值。
    data:
      items:
        - label: 熊市公开公允价值框架
          low: 7
          mid: 8
          high: 9
          displayValue: $7B-$9B
          detail: 集中度、监管或融资拖累把价值压到既定平台 EV 之下
          tone: risk
        - label: 基准公开公允价值框架
          low: 10
          mid: 11
          high: 12
          displayValue: $10B-$12B
          detail: 以 TPG 披露的 EV 框架为锚，假设执行取得中等成功
          tone: neutral
        - label: 牛市公开公允价值框架
          low: 13
          mid: 14.5
          high: 16
          displayValue: $13B-$16B
          detail: 需要规则清晰、首个站点按时执行，并捕获更广泛需求
          tone: positive
        - label: 已完成收购价格
          low: 4.75
          mid: 4.75
          high: 4.75
          displayValue: $4.75B + debt
          detail: Google 为收购 Intersect 股权和资产支付的价格
          tone: neutral
    approximationNotes: 区间是围绕交易锚点搭建的公开证据情景框架，不是完整 DCF 或市场倍数模型。
    claimRefs:
      - CV001
      - CV002
      - CV023
      - CV024
      - CV025
      - CV031
      - CV041
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 基于公开证据集，对主要承销维度打分。
    data:
      items:
        - label: 战略客户验证
          value: 5 / 5
          detail: Google 从合作伙伴和投资人变成收购方，这是战略相关性的异常强证明。
        - label: 资产和平台规模
          value: 4 / 5
          detail: $15B 运营 / 在建基础与 2028 年 10.8 GW 目标，支撑有意义的规模。
        - label: 可比交易支撑质量
          value: 3 / 5
          detail: 交易锚点不错，但干净的公开倍数可比对象偏弱。
        - label: 经济性透明度
          value: 2 / 5
          detail: 项目现金流、利润率和客户条款大多仍未公开。
        - label: 监管确定性
          value: 2 / 5
          detail: FERC 和市场规则不确定性仍笼罩共址论点。
        - label: 客户多元化
          value: 2 / 5
          detail: 公开记录中，Google 是唯一具名的超大规模云锚定客户。
        - label: 执行证明路径
          value: 3 / 5
          detail: 首个共址站点提供了近期里程碑，但尚未完全证明可复制。
    approximationNotes: null
    claimRefs:
