  - id: FR004
    title: 电网与集中度敞口排序
    type: bar
    layout: standard
    summary: 比较公开可见风险敞口的相对强度。
    data:
      items:
        - label: 监管 / 共址不确定性
          value: 5
          detail: 规则仍在变化，是最高结构性风险
        - label: Google 集中度
          value: 5
          detail: 单一具名超大规模云买方撑起叙事
        - label: 资本强度
          value: 4
          detail: 反复取得项目融资是模式核心
        - label: CAISO / ERCOT 市场摩擦
          value: 4
          detail: 限电和约束可能损伤实际经济性
        - label: 供应商集中
          value: 3
          detail: Tesla 和 First Solar 集中度高，且公开可见
        - label: 关键人依赖
          value: 3
          detail: Kimber 集中度重要，但并非单独决定因素
    approximationNotes: 数值是基于公开证据集的 1-5 序数分析师严重性评分，不是概率预测。
