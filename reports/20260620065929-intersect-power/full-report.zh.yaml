      - number: '3.4'
        title: 护城河耐久性、商品化风险与 Intersect 仍能取胜的位置
        blocks:
          - type: paragraph
            body: >-
              Intersect 最强的竞争主张是速度、共址设计，以及把可再生发电与大负载需求连接起来的能力。公司的 Google 交易和交割后 Solutions 页面支持这一观点：hyperscaler
              看重这种打包能力。但这些主张也可以被资本更充足的既有巨头复刻。如果共址成为标准化市场设计，独特价值可能会从谁先提出 energy-park 概念，转向谁能以更低成本大规模融资、选址和互联。这有利于
              NextEra、Brookfield、Clearway 这类玩家，因为它们已经管理比 Intersect 更多的资产或资本。


              因此，护城河真实存在，但带条件。Intersect
              在送电速度、共享基础设施设计和大型项目打包比既有公用事业资产宽度更重要的场景下最强；在客户主要看重资产负债表深度、现有运营组合或既有零售发电关系时更弱。本章风险登记把商品化、hyperscaler
              议价能力、供应链模仿和融资竞争视为主要耐久性测试。竞争结论是，Intersect 足够差异化，值得重视；但还没有强到可以无视规模化既有巨头，或拥有类似客户触达的发起方。
