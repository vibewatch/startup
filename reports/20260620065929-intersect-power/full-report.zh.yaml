chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与运营模式
        blocks:
          - type: paragraph
            body: >-
              Intersect Power 是一家清洁能源开发商和基础设施平台，2016 年创立，总部位于加州旧金山。公司自有材料一直把业务描述为超大型可再生能源和储能资产的建设者、业主和运营商；第三方报道则显示，到
              2024 年底，公司已把这个模式延伸到共址数据中心电力园区。因此，公司当前的运营身份不只是“太阳能开发商”，而是并网和共址能源及数字基础设施开发商，试图压缩从场址控制、电力交付到大负载送电之间的时间。


              商业模式分两步演进。第一步，Intersect 通过项目融资、供应链合同和长期承购关系，在德州和加州扩张公用事业级太阳能加储能平台。第二步，2024 年 12 月宣布的 Google 和 TPG 合作，把
              Intersect 重新定位为“电力优先”的数据中心基础设施开发商，可以把 hyperscale 负载与现场清洁发电和储能配对。收购后的 Solutions 页面延续了这一定位，强调 AI
              基础设施、共址和快速爬坡的稳供来源，而不只是独立可再生能源开发。这种身份转换会影响后续每一章，因为相关买方、监管敞口和估值框架都从传统 IPP 视角转向基础设施和容量交付视角。
