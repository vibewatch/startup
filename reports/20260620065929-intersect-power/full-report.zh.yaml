  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Intersect
              变现的是基础设施交付，而不是软件订阅。官方来源显示，平台为数据中心等大型工业负载开发、持有并运营并网清洁能源资源和共址设施。项目和合作公告暗示了几种收入机制：签约太阳能承购、电池变现、与项目绑定的可再生属性或容量产品，以及
              hyperscale 园区的长期大负载锚定承购。因此，经济单元是已送电容量加合同质量，而不是用户席位或许可证数量。


              实际含义是，公司经济性取决于资本效率、互联时点、采购确定性和交易对手质量。这些驱动因素直接出现在融资和供应链披露中。公开记录足以识别价值如何创造，但不足以量化各收入流的实际定价或利润率。因此，后续章节应把变现模式视为结构可见、实际结果不透明。
