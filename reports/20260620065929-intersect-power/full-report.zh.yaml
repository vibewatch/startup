      - number: '1.3'
        title: 规模、资产与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              对一家私营开发商来说，Intersect 的规模故事披露得异常充分，因为它的项目级新闻稿、合作伙伴公告和收购后 Solutions 页面合在一起，给出了资本投入、已签设备和运营资产的连续清单。Google
              交易前，传统可再生平台已达到有意义的运营规模：公司在 2024 年 12 月合作公告中披露 2.2 GW 运营太阳能基础和 2.4 GWh 运营或在建储能；后续页面和交易报道则指向 $15B
              运营或在建基础设施，以及到 2028 年底预计 10.8 GW 进入建设或运营。


              里程碑记录也说明 Intersect 靠一套可复制打法扩张。公司先在组合层面为 Lumina 和 Oberon 融资，再为德州独立电池项目融资，随后与 Tesla 和 First Solar
              签下超大设备承诺，最后把这台执行机器转向共址 AI 基础设施。项目完工——德州的 Lumina、加州的 Oberon 和 Athos III、德州的
              Radian——证明公司不只是宣布未来容量，而是在把承诺转成运营中的 MW 和 MWh。这种运营证明，正是后期投资者和 Google 能够把平台按基础设施而非概念组合承销的原因。
