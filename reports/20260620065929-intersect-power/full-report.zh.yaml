      - number: '7.5'
        title: 资本市场风险、监测信号与论点破裂触发点
        blocks:
          - type: paragraph
            body: >-
              Intersect 的风险栈只有在公司持续融到钱时才具备可投性。公开融资记录很亮眼，也很说明问题：多次十亿美元级项目融资、一笔大型 BESS 融资，以及 $800 million
              循环信贷，说明资本强度不是旁枝，而是核心运营要求。如果债务市场收紧、税务权益胃口转弱，或监管和首站延误推高建设风险，即便需求健康，公司也可能遭遇负向连锁反应。因此，正确的缓释框架应当可监测，而不是只靠叙事。需要跟踪
              FERC 规则、队列推进、弃电趋势、ERCOT 约束更新、供应商交付、站点建设时间表，以及 Kimber 或 Google
              承诺的任何信号。论点破裂不需要全面崩塌；只要模型可复制性受到可见损伤就足够。可能的触发包括不利的共址裁决、Haskell County 重大延误、融资冻结，或 Google 战略退让。
