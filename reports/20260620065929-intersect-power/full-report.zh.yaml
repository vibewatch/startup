      - number: '7.4'
        title: 人员、客户集中度与战略依赖
        blocks:
          - type: paragraph
            body: >-
              关键人风险和客户集中度在这里交织。Sheldon Kimber 仍是创始人、CEO，也是公司战略的公开设计者；公开材料没有披露详细接班计划。与此同时，Google
              是公开记录中唯一点名的超大规模客户，现在也锚定了数字电力业务的所有权和商业化叙事。TPG 称拆分出的 IPX 平台服务公用事业公司和其他客户，这有所缓释，但已点名的多元化仍然单薄。集中风险不只是 Google
              体量大，而是市场现在会通过 Google 持续投入的热情来解读这套战略。这提升了商业可信度，也意味着任何撤退、优先级调整或站点延误，都可能传导到融资、招聘和交易对手。简言之，战略背书同时是缓释项和依赖项。
            claimRefs:
              - CR023
              - CR024
              - CR025
              - CR026
              - CR037
              - CR038
