        blocks:
          - type: paragraph
            body: >-
              公开披露足以确认融资成熟度和战略验证，但对当前运营表现很弱。证据足以说明 Intersect 已调动数十亿美元项目和公司资本，锁定超大设备承诺，并在有意义估值下吸引 hyperscale
              和发起方资本。但证据不足以计算 Google 持有实体的当前收入、EBITDA、手头现金或杠杆。公开细节也不足以把历史和未来资产清晰分配给 Google 持有的 Intersect 与 TPG 支持的 IPX。


              因此，结论是融资能力为正，披露完整度为负。Intersect 只有在获得保密材料后才适合承销。公开记录可以支持对资本形成和项目融资能力的高层判断，但不能支撑一份关于盈利质量或 runway
              的完整投资备忘录。公开档案是一份强资本市场材料，但只是部分公司财务记录。就目前而言。
