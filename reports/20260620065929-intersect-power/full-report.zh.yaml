      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开记录里，创始人兼 CEO Sheldon Kimber 是核心高管依赖。Intersect 自己的领导层页面和人物简介把他描述为公司融资和供应链战略的架构师；他此前在 Recurrent Energy 和
              Calpine 的运营经历，也解释了为什么资本形成和部署速度在 Intersect 模式里如此突出。About
              页面还显示，公司高管团队精简，覆盖财务、商业、运营、行政、资本市场、采购和工程等职能，围绕项目执行搭建，而不是软件式产品管理。


              每一轮重大融资都显著改变治理结构。2022 年成长股权交易引入 TPG Rise Climate 代表，同时保留 CAI 和 Greenbelt 相关股东等持续投资者；2024 年 Google/TPG
              融资进一步加深战略控制影响，但没有让 Kimber 离开 CEO 席位。2026 年 3 月 Google 交割后保留 Intersect 品牌和 Kimber 的运营角色，同时把传统并网资产切入 IPX
              Power，这意味着治理和资产所有权现在分布在两个相关但不同的平台上。这种分拆降低了组织简洁度，也增加了关键人物依赖：Kimber 必须在管理 Google 关系的同时，维持已开发项目的连续性。
