      - number: '5.5'
        title: 信任、质量与公开披露边界
        blocks:
          - type: paragraph
            body: >-
              对一家开发商主导的基础设施公司来说，信任画像够用，但明显弱于部署证明。公开来源确认了具名硬件供应商、具名运营场站、贷款方参与和项目级运营主张。它们没有确认全舰队衰减指标、可用率历史、逆变器或厂区配套表现、网络安全控制，或
              energy-park 运营的软件治理框架。Tesla 自己的 Megapack 文档确认，电池产品把控制和软件与硬件打包，这解释了 Intersect
              为什么能快速执行，也加大了对外部系统的依赖。缺少公开细节对私营开发商并不罕见，但在尽调中很重要，因为服务 AI 负载的共址 energy park
              不只需要建设证明；还需要调度可靠性、网络韧性和长周期运营数据。换言之，主要产品问题已经不再是 Intersect 能否建设大型场站，而是能否以同等具体度证明运营卓越。
