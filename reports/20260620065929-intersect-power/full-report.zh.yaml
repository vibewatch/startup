      - number: '6.5'
        title: 耐久性、集中度与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据对合同耐久性的支持在一个狭窄维度很强，在其他几个维度很弱。强在 Google
              从投资者到战略伙伴再到收购方的递进，是强烈的显示偏好信号：客户愿意随着产品成熟加深承诺。弱在可得来源没有披露定价、惩罚条款、续约机制、客户数指标，或
              NRR、流失率等经典留存指标。这意味着客户集中风险在结构上仍然很高。Google 是可得数据集中唯一具名 hyperscaler 客户，也是主导性战略交易对手；公用事业客户证明大多停留在类别层面，而不是 logo
              层面。FERC 仍在推进的共址程序又增加了一个耐久性变量，因为未来客户合同可能取决于输电运营商如何处理共址负载。因此，投资者应把当前客户基础视为已验证但狭窄：真实、具有战略重要性，同时仍高度集中。
