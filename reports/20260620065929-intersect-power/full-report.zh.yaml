      - number: '8.4'
        title: 多头、基准与空头情景
        blocks:
          - type: paragraph
            body: >-
              情景分析最适合现有公开证据。基准情景围绕 TPG 披露的 $12 billion 企业价值框架展开，假设 Google 的战略逻辑成立、首批站点按期推进，IPX
              继续作为可信的并网平台运营。多头情景需要更多条件：共址规则更清晰、Haskell County 执行成功、能源园区模板可复制的证据更多，以及额外超大规模客户需求或 2028
              年容量计划变现更强。空头情景不需要灾难性失败；只要监管摩擦、资本市场收紧、集中度和运营证明延迟叠加，市场就可能重新把公司看作资本密集型开发商，而不是稀缺战略控制点。因此，推荐结论对价格敏感。战略价值真实存在，但只有执行把战略转化为可复制的运营证明，溢价才会继续复利。
