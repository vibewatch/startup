  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 展示战略、证据、风险和透明度如何共同形成建议。
    data:
      nodes:
        - id: n1
          label: Google 收购验证战略溢价
        - id: n2
          label: 平台规模和增长期权都很大
        - id: n3
          label: 监管和集中度折价仍然显著
        - id: n4
          label: 公开经济性仍不完整
        - id: n5
          label: 建议：跟踪 / 继续研究，置信度中等
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
