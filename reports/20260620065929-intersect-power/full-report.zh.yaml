              Intersect 将继续由 Sheldon Kimber 领导，并与 Google 技术基础设施团队合作，这把客户关系变成深度嵌入的运营关系，而不是标准
              PPA。对尽调而言，这是客户证明和关系耐久性最强的可得证据。它也最清楚地说明，对至少一家有迫切 time-to-power 需求的 hyperscaler 来说，这个产品有战略价值。
