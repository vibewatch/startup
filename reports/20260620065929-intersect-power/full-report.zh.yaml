companyProfile:
  summary: >-
    Intersect Power 由 Sheldon Kimber 于 2016 年创立，总部位于加州旧金山，搭出了美国资本效率最高的大型太阳能和电池储能平台之一。公司率先推进共址 “energy park” 项目，把 GW
    级太阳能发电和多 GWh 电池储能直接放在 hyperscaler 数据中心旁边，减少长距离输电，为 AI 计算负载提供接近 100% 的无碳电力。截至 2024 年 12 月，Intersect 拥有 2.2 GW 太阳能和
    2.4 GWh 电池基础组合，与 Google 和 TPG Rise Climate 达成战略合作，并完成约 $800M 股权融资，目标到 2030 年撬动 $20B 可再生基础设施。Google 于 2026 年 3 月以
    $4.75B 收购 Intersect 的数字电力业务；TPG 和共同投资者则把并网资产分拆为 IPX Power，合并企业价值为 $12B。
