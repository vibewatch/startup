  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方问题
        blocks:
          - type: paragraph
            body: >-
              Intersect 的相关市场比泛美国可再生能源更窄，又比简单的太阳能开发商同业更宽。Intersect
              竞争于公用事业级可再生发电、公用事业级储能，以及一个正在形成的共址大负载基础设施市场；买方不只是公用事业或社区选择聚合商，也包括需要快速电力交付的 hyperscale
              数据中心开发商或锚定承购方。因此，边界包括新增公用事业级太阳能、风电、储能、混合能源园区、互联权，以及把这些要素转化为可送电容量所需的开发服务，客户既有公用事业，也有大负载客户。


              买方真正购买的是通往可靠容量的速度。EIA《Annual Energy Outlook 2026》称，美国电力消费在长期平稳后重新增长，并特别指出数据中心服务器用电是主要因素。Google
              自己的数据中心页面显示，多个美国园区正在开发中，包括 Haskell County 和其他几个德州场址，这是大负载需求曲线不再是假设的直接买方证据。因此，Intersect
              的市场机会位于电网规划方、hyperscaler 和开发商都看重速度、互联确定性，以及为新增供应融资的能力的位置，而不只是交易现有电力。
