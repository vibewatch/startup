    title: 从合作到收购的时间线
    type: timeline
    layout: standard
    summary: 按顺序放置从合作到完成收购的关键估值锚点。
    data:
      items:
        - date: '2024-12-10'
          label: Google / TPG / Intersect 宣布合作
          detail: 共址负载、$20B 基础设施雄心，以及约 $800M 融资轮
        - date: '2026-01-02'
          label: 公开收购报道扩散
          detail: pv magazine 总结 $15B 资产基础和 10.8 GW 容量目标
        - date: '2026-03-10'
          label: Google 收购完成
          detail: $4.75B 加债务；TPG 称包括 IPX 剥离在内的总企业价值为 $12B
        - date: '2026-03-10'
          label: IPX 作为独立发电商推出
          detail: 4.4 GW 太阳能、8.8 GWh 储能，以及约 $10B 资本投资基础
    approximationNotes: null
