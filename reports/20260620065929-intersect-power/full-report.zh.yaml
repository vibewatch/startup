  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 突出最能影响溢价扩大或收缩的驱动因素。
    data:
      items:
        - label: 共址规则有利
          value: 3
          detail: 将提高市场对溢价估值的信心
        - label: 首个站点按时交付
          value: 3
          detail: 验证能源园区论点可复制
        - label: 新增具名客户、降低集中度
          value: 2
          detail: 降低集中度折价
        - label: 资本市场收紧
          value: -2
          detail: 可能拖慢项目并压缩估值
        - label: 规则结果不利或站点延误
          value: -3
          detail: 将实质削弱战略溢价叙事
    approximationNotes: 敏感性数值是序数方向评分，不是建模得出的企业价值百分比变化。
