      - number: '3.3'
        title: 买方触达、数据中心定位与分销能力
        blocks:
          - type: paragraph
            body: >-
              一个关键竞争维度，是能否触达 Intersect 正在瞄准的同一买方群。Clearway 2026 年独立报道尤其相关，因为它显示 Clearway 从 Google 赢得大型无碳电力承诺，包括提到约 1.2
              GW 供应和数十亿美元电力交易结构的文章。SB Energy 已把 Google 定位为 Orion 的锚定客户，并称该安排是 Google 全球最大的太阳能投资。Constellation
              作为既有清洁可靠发电供应商，也把数据经济和电气化框定为核心需求主题，即使具体抓取的数据中心落地页返回 404。含义是，Intersect 在争夺 hyperscaler 心智时，面对的是已经证明拥有 Google
              或大负载关系的平台。


              各家的分销能力也明显不同。NextEra 强调为客户全额承担项目成本并快速上线公用事业级项目。Clearway 突出通过发起人股权、建设融资、税务股权和债务安排 100% 所需项目资金的能力。Brookfield
              和 AES 更强调广度和可靠性，而不是项目级定制。Intersect 的答案是一套整合度更高的共址主张，但已有可信关系的买方仍可能偏好既有供应商，除非 Intersect 的更快送电路径明显更好。
