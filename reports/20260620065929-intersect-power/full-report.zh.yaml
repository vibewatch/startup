            body: >-
              公开记录显示，Intersect 当前技术栈高度依赖第三方硬件领导者。Tesla 提供电池骨干：2024 年协议覆盖到 2030 年的 15.3 GWh Megapack，延续既有关系，并支撑 Intersect
              所称到 2027 年底接近 10 GWh 已部署大型储能的舰队。First Solar 是光伏侧的对应组件供应商，2.4 GWDC 订单把到 2027 年预计部署的 First Solar 总量推至约 6.4
              GWDC。具名运营资产把这些采购主张转化为实物证明。Oberon、Athos III、Radian 和 Lumina 表明，Intersect 正在加州和德州反复把数百 MW
              级太阳能及太阳能加储能场站从融资推进到运营。供应商选择也划清了技术控制边界：Intersect 负责集成、融资和部署，Tesla 和 First Solar 仍是关键设备依赖。
