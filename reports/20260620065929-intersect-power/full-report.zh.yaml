              将 Darden
              称为美国最大的太阳能加电池项目，它令人瞩目，正因为规模异常大；但同样因为单站点延误就可能困住资本和管理层注意力，风险也更高。相比采购头条，公开披露的网络控制、停运历史和全车队运营指标更少。投资人因此更容易核实供应栈，而不是运营韧性栈。
