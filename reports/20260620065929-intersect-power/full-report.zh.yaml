      - number: '8.5'
        title: 退出准备度、尽调问题与推荐纪律
        blocks:
          - type: paragraph
            body: >-
              新投资人最难的问题，不是 Intersect 是否重要到值得 Google 收购；答案已经给出。更难的是，还剩什么可投，以及在什么条件下可投。收购移除了进入数字电力论点 的清晰创投式入口，也把注意力转向
              Google 内部的价值创造路径和 IPX 的独立经济性。因此，自然应给出「跟踪 / 继续研究」 推荐，置信度为中等。更积极的立场需要项目级现金流证据、Google
              之外已点名客户的多元化，以及共址规则演化如何改变资产经济性的更清晰说明。最终尽调应聚焦首站里程碑、IPX 内部的公用事业和客户集中度，以及 $4.75 billion 收购与 $12 billion
              企业价值框架之间的精确财务桥接。在这些问题回答之前，审慎姿态是尊重战略溢价，但不要把单笔交易过度拟合成过于精确的内在价值模型。
