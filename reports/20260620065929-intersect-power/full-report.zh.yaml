  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 共址负载的监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              Intersect 最高的非技术风险是监管：把数据中心负载与新增发电共址的经济承诺，仍取决于电力市场运营商和监管机构如何分类该负载、分摊网络成本，以及处理表后或邻近电表交付的电能。FERC 2024
              年底开启共址议题程序，随后在 2025 年推动 PJM 制定更清晰规则；法律评论者把这描述为规则仍在书写，而不是问题已经解决。对 Intersect 来说，这很重要，因为旗舰 Google 战略明确建立在共址
              energy park 上。有利规则可能奖励这一模式；不利规则可能迫使项目接受成本更高的电网处理、更慢互联或更窄合同结构。Google
              收购并没有消除这个风险。它改变的是资产归属，不改变项目必须在演进中的市场规则内运行这一事实。
