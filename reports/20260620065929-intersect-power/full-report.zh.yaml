      - number: '2.4'
        title: 买方地图与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场至少有四类买方。传统公用事业和 CCA 为资源充裕性和能源供应购买长期可再生和储能容量。Hyperscaler
              购买电力容量、排期确定性和无碳属性，以支持新园区。独立发电商和开发商购买互联位置、融资结构和采购关系。氢能、高端制造等大型工业负载，如果足够灵活、能把负载与本地发电配对，也可以适配 “energy park”
              模式。Intersect 最接近 hyperscaler 加开发商的交集，但传统资产也服务公用事业、零售商和社区聚合商。


              最大尽调缺口不是广义市场是否存在；公开数据已让这一点很清楚。未解决的问题更窄、更运营化：哪些地区的互联时间表仍能快到有意义，共址负载有多少能在不遭遇惩罚性电价处理的情况下被服务，以及表后或合同需求框架是否会在
              PJM 之外的 RTO 形成标准。这些不是抽象政策细节。它们决定了巨大的可再生加储能机会，有多少能按 Intersect 需要的时间表转化为可融资、可送电项目。
