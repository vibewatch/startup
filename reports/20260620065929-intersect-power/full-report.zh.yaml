  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与真正具名的客户
        blocks:
          - type: paragraph
            body: >-
              Intersect 的公开客户故事异常集中，也异常战略化。公司卖的不是零售电力产品或广义软件服务，而是向能够承销公用事业级发电、储能或共址数字负载的实体出售基础设施结果。About 和 Solutions
              页面把可服务买方框定为大负载基础设施需求，而不是家庭或小企业。因此，披露的客户账本自然分成三类：为数据中心寻求 time-to-power 的
              hyperscaler、需要加州和德州可再生及储能容量的公用事业或电网买方，以及未来可与发电共址的大型工业负载。公开证据只直接点名一个 hyperscaler 交易对手：Google。并网侧，TPG 称分拆出的
              IPX 业务服务加州和德州的公用事业及其他客户，但引用材料中并未广泛披露单个公用事业名称。这个区别重要，因为买方论点比具名证明基础更宽。
