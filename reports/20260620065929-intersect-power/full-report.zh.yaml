      - number: '8.3'
        title: 可比交易与平台参照
        blocks:
          - type: paragraph
            body: >-
              可比集必然混杂，这正是估值纪律重要的原因。来源集中最相关的交易基准不是上市公司倍数，而是 Google 自己通过 Clearway 采购的路径。Google 通过 Clearway 签下 1.2 GW、超过
              $2.4 billion 的基础设施投资，却没有收购开发商，这有助于说明单纯签约清洁电力接入可以是什么样。Intersect
              收购规模大得多，因此定价看起来买的是平台控制权和送电速度，而不只是电量。Clearway、NextEra、Brookfield、AES、Invenergy、Arevon、SB Energy 和 Leeward
              的竞争平台页面有用，因为它们显示基础设施领域纵深足、赞助方也多。它们对精确估值数学帮助较小，因为所引页面没有提供可比口径的市场倍数或细分经济数据。这里使用可比公司的正确方式，是框定战略稀缺性和基础设施平台质量，而不是假装公开页面能推出整齐的每兆瓦
              EV 公式。
