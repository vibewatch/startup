      - number: '1.4'
        title: 战略转型、所有权分拆与未决风险
        blocks:
          - type: paragraph
            body: >-
              2024 年 12 月到 2026 年 3 月，是 Intersect 历史上的决定性转型窗口。Google 和 TPG 先用约 $800M 融资支持共址战略，并提出到本十年末催化 $20B
              可再生基础设施的目标。随后，Google 以 $4.75B 加承担债务收购数字电力业务；TPG 和现有投资者把并网资产分拆进 IPX Power，合并企业价值为 $12B。这一序列验证了 Intersect
              执行引擎的市场价值，但也意味着外部尽调必须把“Intersect”视为两类不同资产：问题是 Google 持有的数字电力，还是 TPG 支持的 IPX。


              主要未决风险来自共址负载周围的监管和市场执行。Utility Dive、FERC 和法律分析来源都把共址描述为仍在变化的政策领域，电价规则清晰度、成本分摊和可靠性规则还没有定型。因此，Intersect
              的战略受益于速度和买方紧迫感，但还没有被稳定市场规则完全去风险。董事会构成、私营财务报表，以及交割前开发管线有多少留在 Google 持有的 Intersect 而不是
              IPX，也仍不清楚。这些不确定性不否定平台质量，但意味着公司概览应被理解为转型期画像，而不是静态公司快照。
