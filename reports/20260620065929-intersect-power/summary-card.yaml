  topStrengths:
    - >-
      Pioneered the co-located energy-park model that hyperscalers view as the critical path for powering AI
      infrastructure, validated by Google's $4.75B acquisition.
    - >-
      Long-term supply agreements with Tesla (15.3 GWh Megapacks) and First Solar (6.4 GW total) lock in hardware at
      scale and create a durable procurement moat.
    - >-
      Platform reach of 4.4 GW solar and 8.8 GWh battery storage (post-IPX spinout) and $15B of infrastructure in
      operation or under construction demonstrates proven execution at gigawatt scale.
    - >-
      Founder-led team with deep utility-scale solar operating experience and blue-chip investor backing (Google, TPG
      Rise Climate, CAI, Greenbelt).
    - >-
      FERC co-location framework evolving in the company's favor, with regulatory proceedings establishing clearer rules
      for data-center-adjacent generation.
  topRisks:
    - >-
      Key-person dependence on Sheldon Kimber; departure or distraction risk is elevated post-acquisition amid cultural
      and strategic integration with Google.
    - >-
      CAISO curtailment and interconnection queue backlogs in California could delay or strand large solar and storage
      assets in the portfolio.
    - >-
      Construction-cost inflation, supply-chain disruptions, and module tariff risk could compress project economics on
      the $15B under-construction portfolio.
    - >-
      Single-customer concentration risk: Google is both acquirer and dominant offtaker, limiting commercial optionality
      for the post-acquisition entity.
    - >-
      FERC co-location rulemaking is ongoing; an adverse ruling could require costly grid upgrades or limit
      behind-the-meter energy delivery arrangements.
  unresolvedGaps:
    - >-
      Revenue, EBITDA, and unit economics are not publicly disclosed; cost-of-energy per MWh and project-level IRR
      remain opaque.
    - Headcount and organizational depth post-acquisition are unknown; integration risk with Google is unquantified.
    - >-
      IPX Power's independent financing capacity and customer pipeline after the Google separation need further
      diligence.
    - Darden Project (largest US solar+battery) permitting timeline and capex finalization remain undisclosed.
    - Post-acquisition commercial terms between Google and the continuing Intersect entity are not public.
