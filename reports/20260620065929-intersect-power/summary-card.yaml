summary:
  headline: >-
    Intersect Power is a category-defining co-located clean energy platform whose $4.75B acquisition by Google validates
    the power-first AI infrastructure thesis at scale; the $12B total enterprise value signals strong investor
    conviction in the co-location model, with significant execution risk tied to permitting, grid interconnection, and
    supply-chain delivery.
