      - number: '7.5'
        title: Capital-markets risk, monitoring signals, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Intersect's risk stack becomes investable only if the company can keep financing it. The public financing
              record is impressive but also revealing: repeated billion-dollar project financings, a large BESS
              financing, and an $800 million revolver show that capital intensity is not a side issue but a core
              operating requirement. If debt markets tighten, tax-equity appetite weakens, or construction risk rises
              because of regulatory or first-site delays, the company can face a negative chain reaction even with
              healthy demand. The right mitigation framework is therefore monitorable, not narrative. Track FERC rules,
              queue movement, curtailment trends, ERCOT constraint updates, supplier deliveries, site-construction
              timelines, and any signals around Kimber or Google commitment. A thesis break would not require a total
              collapse; it would require a visible impairment to the repeatability of the model. That could be a hostile
              co-location ruling, a major delay in Haskell County, a financing freeze, or a strategic retreat by Google.
