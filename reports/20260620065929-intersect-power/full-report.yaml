    title: Valuation / return range
    type: range
    layout: standard
    summary: Frames the public valuation debate as a scenario range rather than a single-point fair value.
    data:
      items:
        - label: Bear public fair-value frame
          low: 7
          mid: 8
          high: 9
          displayValue: $7B-$9B
          detail: Concentration, regulatory, or financing drag pushes value below the stated platform EV
          tone: risk
        - label: Base public fair-value frame
          low: 10
          mid: 11
          high: 12
          displayValue: $10B-$12B
          detail: Anchors on TPG's stated EV frame with moderate execution success
          tone: neutral
        - label: Bull public fair-value frame
          low: 13
          mid: 14.5
          high: 16
          displayValue: $13B-$16B
          detail: Requires rule clarity, timely first-site execution, and broader demand capture
          tone: positive
        - label: Completed acquisition price
          low: 4.75
          mid: 4.75
          high: 4.75
          displayValue: $4.75B + debt
          detail: Google's paid price for the acquired Intersect stake and assets
          tone: neutral
    approximationNotes: >-
      Ranges are public-evidence scenario frames built around the transaction anchors, not a full DCF or market-multiple
