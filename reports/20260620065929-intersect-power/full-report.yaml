      - number: '1.3'
        title: Scale, Assets, and Milestone Record
        blocks:
          - type: paragraph
            body: >-
              Intersect’s scale story is unusually well disclosed for a private developer because its project-level
              press releases, partner announcements, and the post-acquisition Solutions page collectively reveal a
              running inventory of capital deployed, contracted equipment, and operating assets. The legacy renewable
              platform had already reached meaningful operating scale before the Google transaction: the company
              disclosed a 2.2 GW operating solar base and 2.4 GWh of storage in operation or construction at the
              December 2024 partnership announcement, while later pages and deal coverage point to $15 billion of
              infrastructure operating or under construction and 10.8 GW expected in construction or operation by late
              2028.


              The milestone record also shows how Intersect scaled through a repeatable playbook. It financed Lumina and
              Oberon at portfolio level, then financed standalone Texas batteries, then signed very large equipment
              commitments with Tesla and First Solar, and then shifted that execution engine toward co-located AI
              infrastructure. Project completions — Lumina in Texas, Oberon and Athos III in California, and Radian in
              Texas — demonstrate that the company is not merely announcing future capacity but converting commitments
              into operating megawatts and megawatt-hours. That operating proof is why later-stage investors and Google
              could underwrite the platform as infrastructure rather than as a concept portfolio.
