  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Incumbents, Platform IPPs, and Buyer Alternatives'
        blocks:
          - type: paragraph
            body: >-
              Intersect’s competitive landscape spans three classes. First are very large incumbent power and
              infrastructure platforms such as NextEra Energy Resources, Brookfield Renewable, and Constellation, each
              of which brings scale, capital-market access, and operating breadth that Intersect cannot yet match.
              Second are focused clean-energy developers and owner-operators such as Clearway, SB Energy, Arevon, and
              Invenergy, which compete more directly on project development, financing structures, land control, and
              hybrid renewable-plus-storage delivery. Third are substitute providers such as retail-energy or
              conventional-grid suppliers that can serve the same end-customer problem through a slower or less
              integrated path.


              That landscape matters because buyers do not purchase “renewables” abstractly. Utilities, CCAs,
              hyperscalers, and large industrial loads buy a combination of speed, reliability, contract structure,
              financing certainty, and community or supply-chain positioning. Intersect’s moat is therefore not simple
              solar expertise; it is the ability to package generation, storage, and large-load design into a coherent
              project-development offering. The question is whether that package is durable against bigger competitors
              with more generation capacity, more operating assets, or existing customer relationships with the same
              hyperscalers.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
