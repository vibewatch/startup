      - number: '3.2'
        title: Platform Scale and Offering Comparison
        blocks:
          - type: paragraph
            body: >-
              On pure platform scale, Intersect is smaller than most of the named competitors. NextEra says it has more
              than 40,000 MW of total generating capacity across renewables, nuclear, natural gas, and storage.
              Brookfield reports $142 billion of assets under management and 46,000 MW of capacity. Clearway’s sponsor
              and yield structure gives it a 13.6 GW gross portfolio plus a deep development pipeline in wind, solar,
              and storage. Constellation positions itself as a provider of clean, reliable energy for the data economy
              and electrification, which means it approaches the same demand problem from an incumbent
              generation-and-retail angle rather than from a developer-only angle.


              The more direct renewable-development peers are also substantial. SB Energy’s project pages show a 900
              MWdc Orion Solar Belt with Google as anchor customer, a 1.6 GWh Athos storage project under construction,
              and a 2023 financing package totaling $2.4 billion for a 1.3 GW solar portfolio. Arevon reports 6+ GW
              owned and operated, more than 670 MW under construction, and more than $5.1 billion of project financing
              in the last two years. Invenergy’s official site content is less cleanly accessible in the fetched page
              set, but it still states that the company has developed more than 200 clean-energy projects and lists
              solar, wind, storage, transmission, and geothermal as active technologies. These are not niche developers;
              they are scaled infrastructure competitors.
