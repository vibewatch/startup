      - number: '8.2'
        title: Transaction context and what the price is really buying
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation anchors in the public record are the transaction price and the enterprise-value
              framing around the IPX spinout. TPG said Google paid $4.75 billion plus debt and that the total enterprise
              value including IPX was $12 billion. That is not the same thing as saying the core development platform
              trades on a simple multiple. The price appears to buy a combination of existing assets, future project
              pipeline, control over time-to-power for data centers, and a strategic option on energy-park deployment.
              pv magazine adds important scale context by citing $15 billion of assets operating or under construction
              and about 10.8 GW expected online or in development by 2028, while the partnership materials add a $20
              billion future infrastructure ambition. In other words, the public valuation anchors reward present
              portfolio scale plus the option value of future co-located projects, not just near-term EBITDA from
              existing assets.
