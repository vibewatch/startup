      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is the best fit for the public evidence. The base case centers on TPG's stated $12
              billion enterprise-value framing and assumes Google's strategic logic holds, first sites move on schedule,
              and IPX continues to operate as a credible grid-tied platform. The bull case requires more: clearer
              co-location rules, successful Haskell County execution, more evidence that the energy-park template is
              repeatable, and either additional hyperscaler demand or stronger monetization of the 2028 capacity plan.
              The bear case does not require catastrophic failure; it only requires a combination of regulatory
              friction, capital-market tightening, concentration, and delayed operational proof that pushes the market
              back toward viewing the company as a capital-intensive developer rather than a scarce strategic control
              point. That is why the recommendation is price-sensitive. Strategic value is real, but a premium only
              compounds if execution converts strategy into repeatable operating proof.
