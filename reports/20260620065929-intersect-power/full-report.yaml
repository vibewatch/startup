      - number: '8.5'
        title: Exit readiness, diligence asks, and recommendation discipline
        blocks:
          - type: paragraph
            body: >-
              For a fresh investor, the hardest question is not whether Intersect mattered enough for Google to buy it;
              that is already answered. The harder question is what remains investable and under what conditions. The
              acquisition removes the clean venture-style entry path into the digital-power thesis and shifts attention
              to the value-creation path inside Google and the standalone economics of IPX. That naturally argues for a
              Track / Research More recommendation with medium confidence. A more constructive stance would require
              project-level cash-flow evidence, named customer diversification beyond Google, and better clarity on how
              evolving co-location rules change asset economics. Final diligence should therefore focus on first-site
              milestones, utility and customer concentration inside IPX, and the exact financial bridge between the
              $4.75 billion acquisition and the $12 billion enterprise-value framing. Until those questions are
              answered, the prudent posture is to respect the strategic premium but avoid overfitting a single
              transaction into an overly precise intrinsic value model.
