      - number: '2.2'
        title: Sizing, Capacity Supply, and the Queue Lens
        blocks:
          - type: paragraph
            body: >-
              A realistic market-size lens has to start from physical supply constraints rather than from headline TAM
              rhetoric. LBNL’s queue data show that more than 2,060 GW of total generation and storage capacity were
              actively seeking interconnection by the end of 2025, while the 2024 edition embedded in the same dataset
              showed roughly 956 GW of solar and 890 GW of storage in queue. Those numbers prove the supply base is
              enormous, but they also prove that queue volume is not the same thing as buildable supply: only 13% of
              capacity requesting interconnection between 2000 and 2019 had reached commercial operation by the end of
              2024, and median queue duration for built projects has stretched to more than four years.


              For Intersect, that means the relevant SAM is the subset of utility-scale generation and storage that can
              actually clear siting, transmission, financing, and buyer-alignment hurdles. Energy Innovation’s 2024
              “energy parks” paper is useful here because it reframes the opportunity around shared infrastructure and
              faster time to market for large consumers rather than around unconstrained renewable deployment. The
              pyramid and range figures in this chapter therefore use buildable-capacity logic: an outer layer of total
              queued capacity, then a smaller layer of queue capacity with agreements, then an even smaller slice of new
              projects realistically financeable for co-located or utility offtake use over the next few years.
