    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Intersect Power is a clean energy developer and infrastructure platform founded in 2016 and headquartered
              in San Francisco, California. Company-owned surfaces consistently describe the business as a builder,
              owner, and operator of very large renewable-energy and storage assets, while third-party coverage shows
              that by late 2024 the company had extended that model into co-located data-center power parks. The
              company’s current operating identity is therefore not just “solar developer,” but a developer of grid-tied
              and co-located energy-and-digital infrastructure that tries to shorten the time between site control,
              power delivery, and large-load energization.


              The business model evolved in two steps. First, Intersect scaled a utility-scale solar-plus-storage
              platform across Texas and California through project finance, supply-chain contracting, and long-dated
              offtake relationships. Second, the Google and TPG partnership announced in December 2024 repositioned
              Intersect as a “power-first” data-center infrastructure developer that could pair hyperscale load with
              on-site clean generation and storage. The post-acquisition Solutions page keeps that framing, emphasizing
              AI infrastructure, co-location, and fast-ramping firming sources rather than standalone renewable
              development alone. That identity shift matters for every later chapter because it changes the relevant
              buyer set, regulatory exposure, and valuation frame from a conventional IPP lens to an
              infrastructure-and-capacity-delivery lens.
