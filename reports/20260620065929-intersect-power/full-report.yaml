      - number: '7.4'
        title: People, customer concentration, and strategic dependency
        blocks:
          - type: paragraph
            body: >-
              Key-person and customer concentration are intertwined here. Sheldon Kimber remains the founder, CEO, and
              public architect of the company's strategy, and public materials do not disclose a detailed succession
              plan. At the same time, Google is the only named hyperscaler customer in the public record and now anchors
              the ownership and go-to-market story for the digital power business. TPG says the spun-out IPX platform
              serves utilities and other customers, which helps, but named diversification is still thin. The
              concentration risk is not just that Google is big; it is that the market now interprets the strategy
              through Google's continued enthusiasm. That helps commercial credibility, but it also means any pullback,
              reprioritization, or site delay can reverberate through financing, recruiting, and counterparties. In
              short, strategic sponsorship is a mitigation and a dependency at the same time.
            claimRefs:
