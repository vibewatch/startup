      - number: '7.3'
        title: Operational and supply-chain risk in the build stack
        blocks:
          - type: paragraph
            body: >-
              Intersect's operating model is intentionally standardized, but standardization creates dependency
              concentration. Public sources make clear that Tesla is not merely a battery vendor; it is a major hardware
              supplier through 2030 and, on named Texas projects, the supplier of the Autobidder software layer. First
              Solar plays a similar role on the photovoltaic side, with a large multi-year module agreement covering a
              meaningful share of near-term deployment. Those relationships are logical and can improve delivery
              certainty. They also create exposure if one supplier misses schedules, reprices, changes software
              capabilities, or reallocates product. Project scale compounds the issue. Darden, described by Forbes as
              the largest solar-and-battery project in the United States, is impressive precisely because it is
              unusually large; it is also riskier because a single-site delay can trap capital and management attention.
              Public disclosure remains thinner on cyber controls, outage history, and fleetwide operating metrics than
              on procurement headlines, which means investors can verify the supply stack more easily than the operating
              resilience stack.
