      - number: '1.4'
        title: Strategic Transition, Ownership Split, and Open Risks
        blocks:
          - type: paragraph
            body: >-
              The December 2024 to March 2026 period is the decisive transition window in Intersect’s history. Google
              and TPG first funded a co-location strategy with an approximately $800 million round and a stated ambition
              to catalyze $20 billion of renewable infrastructure by decade end. Google then acquired the digital-power
              business for $4.75 billion plus assumed debt, while TPG and existing investors spun the grid-tied assets
              into IPX Power at a combined enterprise value of $12 billion. This sequence validates the market value of
              Intersect’s execution engine, but it also means outside diligence has to treat “Intersect” as two
              different assets depending on whether the question is about Google-owned digital power or TPG-backed IPX.


              The principal open risk is regulatory and market execution around co-located load. Utility Dive, FERC, and
              legal analysis sources all describe co-location as a live policy area where tariff clarity, cost
              allocation, and reliability rules are still evolving. Intersect’s strategy is therefore commercially
              advantaged by speed and buyer urgency, but not yet de-risked by settled market rules. Additional unknowns
              remain around board composition, private financial statements, and how much of the pre-close development
              pipeline will stay with Google-owned Intersect versus IPX. Those uncertainties do not negate the quality
              of the platform, but they do mean the company overview should be read as a transition-state profile rather
              than a static corporate snapshot.
            claimRefs:
              - CO015
              - CO016
              - CO020
              - CO021
              - CO022
              - CO023
              - CO030
