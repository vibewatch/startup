      - number: '2.4'
        title: Buyer Map and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The market has at least four buyer clusters. Traditional utilities and CCAs buy long-dated renewable and
              storage capacity for resource adequacy and energy supply. Hyperscalers buy power capacity, schedule
              certainty, and carbon-free attributes to support new campuses. Independent power producers and developers
              buy interconnection positions, financing structures, and procurement relationships. Large industrial loads
              such as hydrogen and advanced manufacturing buyers can also fit the “energy park” model if they are
              flexible enough to pair load with local generation. Intersect sits closest to the
              hyperscaler-plus-developer overlap, but its legacy assets also serve utilities, retailers, and community
              aggregators.


              The biggest diligence gap is not whether the broad market exists; the public data make that obvious. The
              unresolved questions are narrower and more operational: which geographies can still clear interconnection
              timelines fast enough to matter, how much co-located load can be served without punitive tariff treatment,
              and whether behind-the-meter or contract-demand frameworks will become standard across RTOs outside PJM.
              Those are not abstract policy details. They determine how much of the enormous renewable-and-storage
              opportunity can be converted into financeable, energizable projects on the timeline Intersect needs.
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
