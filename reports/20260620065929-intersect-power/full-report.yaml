            title: Queue volume is opportunity and warning at the same time
            body: >-
              The U.S. has ample proposed renewable and storage capacity on paper, but the queue statistics show why
              Intersect’s real edge is converting positions into deliverable projects rather than simply being exposed
              to the broad renewables TAM.
