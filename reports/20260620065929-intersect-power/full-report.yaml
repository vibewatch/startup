            body: >-
              Intersect monetizes infrastructure delivery rather than software subscriptions. Official sources show a
              platform that develops, owns, and operates grid-tied clean-energy resources and co-located facilities for
              large industrial loads including data centers. Project and partnership releases imply several revenue
              mechanisms: contracted solar offtake, battery monetization, renewable attributes or capacity products tied
              to projects, and long-term large-load anchor offtake for hyperscale campuses. The economic unit is
              therefore energized capacity plus contract quality, not user seats or license volume.


