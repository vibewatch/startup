  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and the Buyer Problem
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Intersect is narrower than generic U.S. renewables and broader than a simple
              solar-developer peer set. Intersect competes in utility-scale renewable generation, utility-scale storage,
              and an emerging co-located large-load infrastructure market in which the buyer is not merely a utility or
              community-choice aggregator, but also a hyperscale data-center developer or anchor offtaker seeking fast
              power delivery. The boundary therefore includes new utility-scale solar, wind, storage, hybrid energy
              parks, interconnection rights, and the development services required to turn those ingredients into
              energizable capacity for utilities and large-load customers.


              The problem being purchased is speed to reliable capacity. EIA’s Annual Energy Outlook 2026 says U.S.
              electricity consumption is now growing again after a long flat period and specifically identifies
              data-center server energy use as a major factor. Google’s own data-center page shows multiple U.S.
              campuses in development, including Haskell County and several other Texas sites, which is direct buyer
              evidence that the large-load demand curve is no longer hypothetical. Intersect’s market opportunity
              therefore sits where grid planners, hyperscalers, and developers all value speed, interconnection
              certainty, and the ability to finance new supply rather than merely trade existing power.
            claimRefs:
