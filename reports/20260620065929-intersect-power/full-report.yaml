companyProfile:
  summary: >-
    Intersect Power, founded in 2016 by Sheldon Kimber and headquartered in San Francisco, CA, built one of the most
    capital-efficient large-scale solar and battery storage platforms in the United States. The company pioneered
    co-located "energy park" projects that pair gigawatt-scale solar generation and multi-gigawatt-hour battery storage
    directly adjacent to hyperscaler data centers, eliminating long-distance transmission and enabling near-100%
    carbon-free power for AI compute workloads. By December 2024 Intersect held a 2.2 GW solar and 2.4 GWh battery base
    portfolio, secured a strategic partnership with Google and TPG Rise Climate, and closed an ~$800M equity round
    targeting $20B of renewable infrastructure by 2030. Google completed the $4.75B acquisition of Intersect's digital
    power business in March 2026, while TPG and co-investors spun out the grid-tied assets into IPX Power at a $12B
    combined enterprise value.
  foundedDate: '2016-01-01'
