  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: Scores the main underwriting dimensions from the public evidence set.
    data:
      items:
        - label: Strategic customer validation
          value: 5 / 5
          detail: Google moved from partner and investor to acquirer, which is exceptional proof of strategic relevance.
        - label: Asset and platform scale
          value: 4 / 5
          detail: $15B operating/construction base and 10.8 GW 2028 target support meaningful scale.
        - label: Comparable support quality
          value: 3 / 5
          detail: Transaction anchors are good, but clean public multiple comparables are weak.
        - label: Transparency of economics
          value: 2 / 5
          detail: Project cash flows, margins, and customer terms remain largely private.
        - label: Regulatory certainty
          value: 2 / 5
          detail: FERC and market-rule uncertainty still cloud the co-location thesis.
        - label: Customer diversification
          value: 2 / 5
          detail: Google is the only named hyperscaler anchor in the public record.
        - label: Execution proof path
          value: 3 / 5
          detail: The first co-located site provides a near-term milestone but has not yet fully proven repeatability.
    approximationNotes: null
