  - - Battery-cost and hybridization trend
    - Positive
    - Current
    - Improves ability to firm renewables and shape load
    - Validate duration assumptions by market
  - - Transmission buildout lag
    - Negative
    - Current to long-term
    - Extends value of behind-the-fence or shared-POI solutions
    - Prioritize markets with deliverability headroom
  notes: Constraints are not thesis-breaking on their own; they are precisely what makes deliverable capacity valuable.
