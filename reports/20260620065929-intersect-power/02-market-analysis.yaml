- id: adoption-drivers-and-grid-friction
  title: Adoption Drivers, Grid Friction, and Regulatory Constraints
  body: >-
    The demand case is strong, but the constraint case is just as important. CAISO curtailed 3.4 million MWh of utility-scale wind and solar output in 2024, up 29% year over year, and solar accounted for 93% of that curtailed energy. ERCOT, meanwhile, reported record demand of 65,614 MW in May 2025 and is simultaneously confronting both rising battery output and a surge in large-load interconnection requests. Those data points show that new generation alone is not enough; the market also values locational fit, storage duration, transmission access, and flexible demand.


    Co-location is a promising but not fully settled answer to that friction. FERC’s February 2025 show-cause order and December 2025 PJM order both say existing tariffs were not designed with large co-located data-center loads in mind. Utility Dive, Mintz, and Beveridge & Diamond all interpret the resulting framework the same way: co-location can speed deployment and improve cost alignment, but only if regulators and grid operators make the service rules clearer. Intersect’s market window exists because those frictions make power-delivery capability scarce, yet those same frictions are the principal adoption constraint that could slow project realization or reduce economic advantage.
