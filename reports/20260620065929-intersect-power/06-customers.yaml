chapter:
  number: 6
  title: Customers
  summary: Public customer proof is real but narrow. Google is the anchor hyperscaler customer, strategic partner, and eventual acquirer of the digital power business; utility and grid-serving buyers remain important to the model, but their named public roster is thin, leaving concentration and contract-transparency risks high.
sections:
- id: customer-base
  title: Customer base segmentation and what is actually named
  body: 'Intersect''s public customer story is unusually concentrated and unusually strategic. The company is not selling a retail power product or a broad software service; it is selling infrastructure outcomes to entities that can underwrite utility-scale generation, storage, or co-located digital load. The About and Solutions pages frame the addressable buyer as large-load infrastructure demand rather than households or small businesses. The disclosed book therefore sorts naturally into three customer classes: hyperscalers seeking time-to-power for data centers, utility or grid buyers that need renewable and storage capacity in California and Texas, and large industrial loads that can be co-located with generation over time. Public evidence names only one hyperscaler counterparty outright: Google. For the grid-tied side, TPG says the spun-out IPX business serves utilities and other customers in California and Texas, but individual utility names are not broadly disclosed in the cited materials.
    That distinction matters because the buyer thesis is broader than the named-proof base.'
  claimRefs:
