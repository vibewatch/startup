- id: google-anchor
  title: Google as anchor customer, strategic partner, and acquirer
  body: Google is the center of gravity for the current customer analysis. The December 2024 partnership announcement established Google as the anchor demand-side customer for Intersect's co-located energy-park product, with a stated plan to deliver gigawatts of new data-center capacity and catalyze $20 billion of renewable-power infrastructure. By March 2026, the relationship escalated from partner and minority investor to full acquirer of the digital power business, with TPG and Cleary both confirming a $4.75 billion cash transaction plus assumed debt. Cleary also said Intersect would continue under Sheldon Kimber and partner with Google's technical infrastructure team, which turns the customer relationship into a deeply embedded operating relationship rather than a standard PPA. For diligence purposes, this is the strongest available evidence of customer proof and relationship durability. It is also the clearest sign that the product is strategically valuable to at least one hyperscaler
    with acute time-to-power needs.
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
