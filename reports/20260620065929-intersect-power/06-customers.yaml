- id: utility-offtake
  title: Utility and community-choice buyer classes in California and Texas
  body: 'The utility side of the customer base is more important than the named proof suggests, but it is also less transparent. TPG''s post-acquisition release says IPX Power will serve utilities and other customers across California and Texas using a 4.4 GW solar and 8.8 GWh storage portfolio, which implies that grid-serving buyers remain core to the monetization model after Google took the digital power assets. Yet the public materials cited here do not enumerate a broad customer roster by utility or offtaker name. Community-choice aggregators such as SDCommunity Power and Ava Community Energy are useful buyer-class references because they are the sort of California load-serving entities that contract for utility-scale renewable output, but the evidence does not identify them as direct Intersect counterparties. The correct diligence takeaway is therefore twofold: utility and grid buyers are clearly part of the revenue architecture, but public proof on named utility relationships remains
    weaker than the proof for Google.'
  claimRefs:
  - CU009
  - CU020
  - CU021
  - CU022
  - CU023
  - CU035
  - CU036
  - CU040
