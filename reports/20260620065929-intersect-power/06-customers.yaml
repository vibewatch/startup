- id: hyperscaler-demand
  title: Broader hyperscaler demand and procurement alternatives
  body: 'The customer thesis does not rest only on Google. Google''s own sustainability and data-center materials show why a buyer like this would pursue unconventional power procurement: electricity availability, carbon-free matching, and data-center siting are all strategic constraints. Independent market evidence shows that hyperscalers are using multiple procurement pathways simultaneously. The Clearway examples show Google signing long-duration PPAs across several power markets to backstop data-center demand, while the Intersect transaction shows Google also paying for development control when it believes control can accelerate capacity delivery. Utility Dive''s reporting on load growth adds the market-wide context: data-center expansion is pushing buyers toward co-location, demand-response tools, and power-first infrastructure strategies. Taken together, the evidence supports a real and growing hyperscaler customer segment; it does not support the conclusion that Intersect has a diversified
    named customer roster within that segment.'
  claimRefs:
  - CU010
  - CU012
  - CU013
  - CU014
