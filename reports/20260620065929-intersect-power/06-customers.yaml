  - TU006
  figureRefs:
  - FU005
- id: durability-risk
  title: Durability, concentration, and diligence gaps
  body: 'Public evidence on contract durability is strong in one narrow sense and weak in several others. It is strong because Google''s progression from investor to strategic partner to acquirer is a powerful revealed-preference signal: the customer was willing to deepen its commitment as the product matured. It is weak because the available sources do not disclose pricing, penalty schedules, renewal mechanics, customer-count metrics, or classical retention indicators such as NRR and churn. That means customer concentration risk remains high by construction. Google is the only named hyperscaler customer and the dominant strategic counterparty in the available dataset, while utility customer proof is mostly category-level rather than logo-level. FERC''s continuing co-location proceedings add another durability variable because future customer contracts may depend on how transmission operators treat colocated load. Investors should therefore treat the current customer base as validated but
    narrow: real, strategically important, and still highly concentrated.'
  claimRefs:
  - CU017
  - CU018
  - CU028
  - CU029
  - CU030
