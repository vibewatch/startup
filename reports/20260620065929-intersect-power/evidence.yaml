evidenceGaps:
  - type: missing-source
    severity: material
    topic: post-close board composition
    missingEvidence: A current board roster or governance summary for Google-owned Intersect and separately for IPX Power.
    whyItMatters: Governance determines control, reserved matters, and how much founder influence survives post-close.
    diligencePath: Request board list and governance rights from management or transaction counsel.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: asset split between Intersect and IPX
    missingEvidence: >-
      A project-by-project asset ownership schedule allocating pre-close development, operating, and construction assets
      between the two post-close entities.
    whyItMatters: Without an asset map, later chapters can misattribute cash flows, customers, or capex obligations.
    diligencePath: Request post-close asset schedule and transition-service summary from management.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: private financial metrics
    missingEvidence: Current revenue, EBITDA, cash, debt, and headcount disclosures for Google-owned Intersect and IPX.
    whyItMatters: >-
      The absence of current financial metrics limits underwriting and forces later chapters to rely on project-finance
      proxies.
    diligencePath: Request 2025 and 2026 management financial package and lender materials.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: stale
    severity: minor
    topic: co-location regulatory rules
    missingEvidence: Final tariff treatment and cost-allocation rules for co-located large loads across relevant RTOs.
    whyItMatters: >-
      The co-location strategy is commercially attractive but still partially dependent on evolving regulatory
      frameworks.
    diligencePath: Monitor FERC and relevant RTO proceedings and request management’s regulatory-risk memo.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: material
    topic: regional SAM for Intersect
    missingEvidence: >-
      A region-by-region buildable-capacity model for Texas, California, and other target markets after queue,
      permitting, and buyer filters.
    whyItMatters: A national queue number is too broad to underwrite Intersect’s actual go-to-market footprint.
    diligencePath: Build a geo-screened supply model using queue status, congestion, and campus announcements.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: stale
    severity: material
    topic: co-location rules outside PJM
    missingEvidence: >-
      Finalized tariff treatment and study-process standards for co-located load in ERCOT, CAISO, and other relevant
      regions.
    whyItMatters: Co-location economics can change materially if contract-demand or behind-the-meter treatment differs by market.
    diligencePath: Track FERC, ERCOT, CAISO, and utility rulemakings; request management regulatory memo.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: missing-source
    severity: minor
    topic: project-level demand by hyperscaler site
    missingEvidence: Public MW demand figures for each announced Google campus relevant to Intersect’s footprint.
    whyItMatters: Campus location evidence is strong, but precise power-demand numbers would sharpen the buyer map and SOM.
    diligencePath: Review utility filings, local permits, and community briefings for campus MW requirements.
    relatedQuestionRefs:
      - QM005
      - QM025
  - type: conflicting-data
    severity: minor
    topic: buildable-capacity lens
    missingEvidence: Consistent market-publisher methodology for translating queue capacity into financed project supply.
    whyItMatters: Analyst houses often publish dollar TAMs that are too abstract for infrastructure underwriting.
    diligencePath: Build an internal capacity-conversion model and reconcile with project-finance data.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: realized pricing and win-rate comparison
