evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, investor-seat map, and succession or committee structure.
    whyItMatters: Governance concentration is a core overview risk once the company approaches public markets.
    diligencePath: Request the latest shareholder agreement, board resolutions, and IPO counseling governance workplan.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Primary round documents or an IPO counseling filing that states the latest post-money valuation.
    whyItMatters: The difference between RMB 6-7bn and RMB 10bn+ materially changes valuation framing for later chapters.
    diligencePath: Obtain the 2026 D-series term sheet, cap-table summary, or formal pre-IPO materials.
    relatedQuestionRefs:
      - QO011
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, recurring-service mix, margin, and cash-flow disclosure for 2025-2026.
    whyItMatters: >-
      Aerospace Yuxing can be a real infrastructure asset and still be unattractive if economics are project-like or
      capital inefficient.
    diligencePath: Collect management accounts, audited statements, and cohort revenue by mission type.
    relatedQuestionRefs:
      - QO023
      - QO025
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current independent employee count or social-insurance filing tied to the main operating entities.
    whyItMatters: Headcount is a common cover metric and a proxy for execution capacity and burn.
    diligencePath: Request a current HR summary or pull the latest registry / social-insurance disclosures across the group.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-coverage
    missingEvidence: >-
      A complete official newsroom archive or corporate history that fills every major financing, licensing, and product
      milestone between 2016 and 2026.
    whyItMatters: >-
      The milestone table is intentionally partial because official news pages were not directly enumerable from the
      current site fetch, so some intermediate events may still be missing.
    diligencePath: >-
      Request an internal milestone deck or a complete official news export, then reconcile it against financing and
      mission archives.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: yuxing-sam
    missingEvidence: >-
      A public revenue bridge from satellite-internet TAM to TT&C, gateway, calibration, and in-orbit-operations spend
      addressable by Aerospace Yuxing.
    whyItMatters: >-
      Without segment pricing and contract values, the open-source evidence cannot cleanly convert broad constellation
      activity into Yuxing-specific revenue opportunity.
    diligencePath: Request segment-level pricing, utilization, and contract-value data from management or IPO materials.
    relatedQuestionRefs:
      - QM009
      - QM024
  - type: private-evidence-only
    severity: material
    topic: infrastructure-pricing
    missingEvidence: >-
      Public rate cards or signed contract disclosures for TT&C, data reception, gateway, or long-term orbit-management
      services.
    whyItMatters: >-
      Pricing opacity prevents bottom-up SAM or SOM modeling and obscures whether the market scales more with mission
      count or with managed assets.
    diligencePath: Obtain customer contracts, list pricing, or bid data across launch support and recurring operations services.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: minor
    topic: filing-to-deployment-conversion
    missingEvidence: >-
      An authoritative public deployment plan matching Chinese filing envelopes to realistic launcher availability and
      milestone timing.
    whyItMatters: The market narrative can be overstated if filing scale is treated as near-term physical deployment or spend.
    diligencePath: Track launch manifests, operator schedules, and ITU milestone compliance against each flagship constellation.
    relatedQuestionRefs:
      - QM019
      - QM025
  - type: missing-source
    severity: minor
    topic: segment-budget-splits
    missingEvidence: >-
      Public evidence showing what share of budgets sits with state operators, telcos, and remote-industry buyers across
      the Chinese non-terrestrial stack.
    whyItMatters: >-
      Buyer concentration affects sales cycles, bargaining power, and whether Yuxing faces procurement or consumer-style
      economics.
    diligencePath: Request customer-mix disclosure or infer it from public tenders and procurement notices in the next refresh.
    relatedQuestionRefs:
      - QM011
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Current price cards, realized contract terms, discount ladders, and service-level commitments for Aerospace
      Yuxing’s TT&C, in-orbit management, and calibration offerings.
    whyItMatters: >-
      The chapter can compare packaging logic across peers, but it cannot underwrite Yuxing’s commercial durability
      without knowing whether its services price like scarce mission assurance or commodity support.
    diligencePath: Request sample contracts, rate cards, SLA schedules, and utilization reports for each major Yuxing service line.
    relatedQuestionRefs:
      - QP017
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-mix
    missingEvidence: >-
      Named customer roster, revenue concentration by program, and service-line mix between launch support, long-term
      operations, safety, calibration, and equipment sales.
    whyItMatters: >-
      Integrated operators and sovereign programs may behave very differently as customers; without customer mix, it is
      hard to know whether Yuxing is selling into durable recurring demand or episodic project work.
    diligencePath: >-
      Request top-customer concentration, revenue by mission type, renewal rates, and split between one-time equipment
      and recurring operations support.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
      - TP004
  - type: missing-source
    severity: material
    topic: service-reliability-benchmarking
    missingEvidence: >-
      Independent uptime, pass-success, anomaly-response, and SLA performance data for Aerospace Yuxing that can be
      compared against KSATlite, Leaf, AWS, or ATLAS.
    whyItMatters: >-
      Several competitors publish network-performance or automation signals, but Yuxing’s public materials do not offer
      equivalent standardized reliability benchmarks.
    diligencePath: >-
      Request historical SLA reports, pass-success data, mean-time-to-recovery metrics, and customer references that
      quantify operational reliability.
    relatedQuestionRefs:
      - QP021
      - QP025
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-coverage
    missingEvidence: >-
      A complete public map of every Chinese state-owned ground-segment provider, military-adjacent integrator, and
      foreign relay-network entrant active in 2026.
    whyItMatters: >-
      The competitor table is intentionally scoped to the most decision-relevant classes. Important niche relay, SSA, or
      government-system actors may still exist outside the retained public set.
    diligencePath: >-
      Expand the landscape with procurement databases, satellite operator RFPs, and regulator or program prime
      disclosures focused on Chinese mission-support contracts.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: security-compliance
    missingEvidence: >-
      Comparable published security, export-control, or compliance certifications for Yuxing versus AWS, ATLAS, KSAT,
      and SSC.
    whyItMatters: >-
      Trust posture matters heavily in ground-segment procurement, but public evidence in the retained set is richer for
      U.S.-aligned or international vendors than for Yuxing.
    diligencePath: >-
      Request compliance documentation, customer security questionnaires, and any regulator or standards certifications
      relevant to mission operations.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-margin-disclosure
