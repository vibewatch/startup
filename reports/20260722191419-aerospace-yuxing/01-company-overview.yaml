- id: capital-history-and-ipo-window
  title: Capital History, Valuation Markers, and IPO Window
  body: 'The funding record supports a company that has moved well beyond early-stage venture backing, but the public disclosure is still messy at the exact valuation level. The cleanest recent capital facts are the August 2025 C+ round and the June 2026 D-series package. 36Kr reports a 430 million RMB C+ financing with Cinda Capital, Gongda Venture Capital, Caitong Capital, Hanjiang Capital, Changjiang Capital, Nice Group, and Jigang Group. Sina, Tencent, NetEase, and Baidu''s English company page all line up around the next step: D, D+, and D++ financings totaling nearly 2 billion RMB in June 2026, with a syndicate that included Sequoia China, Qianhai Ark, China Unicom''s strategic-emerging-industries vehicle, Zijin Mining, SAIC Motor, Wuliangye, and several financial investors.


    Where the record becomes less clean is valuation. Sina and NetEase describe the company as entering the RMB 10 billion-plus unicorn bracket after the D+ phase, which roughly aligns with the user-supplied $1.5 billion directional framing after normal FX translation. Jiemian, however, places the company in a more modest RMB 6 billion to RMB 7 billion range while still describing it as a unicorn. Without primary filing documents or a term sheet, the safest chapter-one stance is that the company clearly crossed into late-stage-unicorn territory in 2026 but that the exact current mark is not yet reconciled across public outlets.


    IPO preparation is more straightforward. Jiemian says the company signed counseling with Guotai Haitong Securities on 2026-05-28 and completed filing on 2026-06-05; Baidu''s English company page repeats the filing date. That sequence, combined with the large 2025-2026 financing cycle, shows a company using private capital to extend its infrastructure lead while opening a public-markets option. What the public file still does not disclose is equally important: revenue, recurring-service mix, margin structure, and cash generation remain absent.'
