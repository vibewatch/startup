- id: milestones-and-strategic-trajectory
  title: Milestones, In-Orbit Servicing Expansion, and Adverse Lens
  body: 'The milestone chronology shows a company broadening from measurement-and-control infrastructure into higher-value in-orbit service ambition. Tertiary histories place the first decisive markers in 2017 and 2018, when Aerospace Yuxing built China''s first third-party commercial TT&C station, obtained the first commercial TT&C radio-station license, and established a command center. By 2020 it was operating around the Zhongwei remote-sensing calibration field, extending beyond command-and-control into data-quality infrastructure. The 2025 Wuhan branch then pushed the company toward an in-orbit-servicing R&D footprint tied to orbital-operation robots.


    The most important recent milestone is Yuxing-3 06. Global Times and People''s Daily say the satellite launched on 2026-03-16, that it is China''s first commercial experimental satellite equipped with a flexible robotic arm, and that it validated simulated refueling and docking operations. Global Times adds that the project sits inside a mission series led by subsidiary Sustain Space, while People''s Daily frames the target end-state as a "space 4S shop" for maintenance, refueling, and orbital servicing. This matters strategically because it expands Aerospace Yuxing from a monitoring-and-control narrative into one about lifetime extension, servicing, and debris mitigation. The company is trying to move from keeping satellites alive to actively manipulating and sustaining them.


    The adverse lens is not scandal but underwriting ambiguity. Jiemian calls the sector heavy-asset and cash intensive; Shuziqushi says investors still need disclosure on revenue mix, customer concentration, utilization, and cash flow. Those warnings fit the observed gaps in this chapter. Aerospace Yuxing clearly has real infrastructure and mission depth. The unresolved question is how much of that depth converts into repeatable, high-quality economics rather than project-driven service revenue.'
