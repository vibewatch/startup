company:
  name: Aerospace Yuxing
chapter:
  number: 1
  title: Company Overview
  summary: 'Aerospace Yuxing, publicly branded as 航天驭星 and Emposat, is a Beijing-based commercial-space infrastructure company focused on TT&C, ground systems, remote-sensing calibration, and spacecraft in-orbit operations rather than on satellite manufacturing alone. Public sources support a 2016 founding, a 2025-2026 capital-raising sprint culminating in nearly RMB 2bn of D-series financing and IPO counseling, and a strategic expansion into in-orbit servicing through the Yuxing-3 06 robotic-arm mission. The main overview caveat is disclosure quality: operating depth is real, but current valuation, headcount, board structure, and revenue economics remain incompletely disclosed or publicly inconsistent.'
sections:
- id: identity-and-positioning
  title: Identity, Positioning, and Operating Footprint
  body: 'Aerospace Yuxing is best understood as the in-orbit infrastructure layer behind China''s commercial-space buildout rather than as a classic satellite prime or launch company. Official materials brand the business as 航天驭星 and Emposat, describe a 2016 founding, and place headquarters in Beijing''s Haidian district. The company mission is unusually explicit: make satellites easier to use by building the ground, software, and operational systems that keep them controllable after launch. In practice that means launch-segment tracking, telemetry, and command (TT&C), long-term flight-control support, payload-data reception, remote-sensing calibration, collision warning, and related digital applications. The fetched corpus consistently shows a company trying to monetize the non-glamorous but unavoidable "backend" of space operations.


    The footprint also matters strategically. Official pages say the company has built more than 60 ground-station sets and an integrated calibration field, with branches or operating nodes spanning Beijing, Xi''an, Zhengzhou, Zhongwei, Qitaihe, Jinghe, Hebi, the South Pacific, Africa, and South America. Partner material adds that a 2023 phase-two network was designed to support more than 3,000 satellites, although that specific capacity claim is still only company- or partner-sourced. Even discounting the least corroborated scale claims, the evidence supports the narrower but important conclusion that Aerospace Yuxing has assembled a real physical service network, not just a software layer or consulting label.


    That positioning helps explain why the company is described in outside coverage as "space property management." Shuziqushi makes the analogy explicit by comparing Aerospace Yuxing with global ground-station-as-a-service specialists rather than vertically integrated space companies. The official product/service taxonomy points the same way: the company sells ground systems, communication products, and operations software because those assets are prerequisites for running a commercial TT&C network at scale.'
