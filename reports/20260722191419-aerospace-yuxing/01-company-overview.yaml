- id: platform-depth-and-service-architecture
  title: Platform Depth, Product Stack, and Service Architecture
  body: 'Aerospace Yuxing''s commercial relevance comes from combining services with proprietary infrastructure. Official service pages show the company operating across launch TT&C, early-orbit support, long-term constellation management, collision warning, health management, remote-sensing calibration, and mission planning. Product pages add three enabling layers: ground-station systems, communication/baseband hardware, and mission software. The integrated architecture matters because it allows the company to sell both recurring operations and enabling equipment, while keeping tighter control over compatibility across sites and missions. 36Kr adds a useful economic angle by saying key products are more than 90 percent self-developed and already shipped in batch quantities to constellation-related customers.


    The technical breadth is unusually concrete for a private Chinese space-infrastructure company. The ground-systems page publishes performance detail for 12-meter X-band and 4.5-meter S/X/Ka systems, including EIRP, G/T, capture times, tracking precision, data-recording rates, and 7x24 automated operation. The communication-products page lists integrated TT&C basebands, high-speed data-transmission basebands, X-band transponders, and integrated TT&C/data-transmission units. The software page describes mission planning, telemetry processing, command management, 3D visualization, and digital-twin style functions. This is the profile of a company trying to own the operational middle layer between satellite manufacturers and end users, not merely to broker station time.


    This architecture also explains why third-party sources say the company already serves state aerospace units, commercial launch providers, satellite companies, universities, and research institutes. Customers that cannot justify building their own global TT&C footprint still need compliant command, telemetry, and data-return coverage. Aerospace Yuxing therefore participates in a structurally necessary layer of the commercial-space stack, with service depth that appears broader than a single-point ground-station vendor but still narrower than a fully vertically integrated satellite operator.'
