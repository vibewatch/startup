- id: deployment-reliability-support-and-roadmap
  title: Deployment, Reliability, Support, and Roadmap
  body: |-
    Public deployment evidence is strongest in three areas. First is mature ground operations: the company says its software has gone through years of mission practice and can quickly integrate different satellites and ground equipment. Second is the remote-sensing calibration field in Zhongwei, which looks like a real fixed asset with quantified sub-systems and performance thresholds. Third is the 2026 Yuxing-3 06 / Xiyuan-0 robotic-arm mission, which gives the company a concrete space-servicing technology demonstration rather than a slide-deck ambition.

    The robotic-arm evidence is substantive but should be read carefully. Multiple 2026 reports agree that Yuxing-3 06 completed four key test modes: autonomous simulated refueling, human teleoperation, visual-servo docking, and force-controlled manipulation. Independent reporting also notes a drag-augmentation deorbit experiment and a plan to leverage Yuxing’s ground infrastructure for low-latency human-in-the-loop servicing. But the same reporting is explicit that the refueling was simulated and that no actual propellant transfer was confirmed. That keeps the technology in the demo and validation stage rather than in scaled commercial service.

    Roadmap evidence is therefore asymmetric. The ground-software and station stack appear iterated and deployed. The calibration asset looks operational. The in-orbit servicing branch looks promising and differentiated, but public sources do not yet show a contracted commercial roadmap, a repeat mission pipeline, or a timeline from demo to revenue. The honest product verdict must keep those stages separate.
