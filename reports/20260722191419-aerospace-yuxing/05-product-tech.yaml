chapter:
  number: 5
  title: Product & Tech
  summary: 'Aerospace Yuxing’s product stack is broad and technically specific: TT&C ground systems, communications hardware, cloud-native control software, remote-sensing calibration infrastructure, safety and deorbit services, and a new in-orbit servicing branch anchored by the Yuxing-3 06 flexible robotic-arm mission. The strongest public proof is in the ground-ops stack and calibration assets; the newest space-servicing technology is credible as a demonstration but still early as a commercial product.'
sections:
- id: product-definition-and-module-map
  title: Product Definition and Module Map
  body: |-
    Aerospace Yuxing’s product definition is broader than a single satellite-ground-station product. Official materials show a layered stack: ground systems, communications systems, software systems, full-lifecycle TT&C services, long-term in-orbit management, safety and collision services, and a commercial calibration field for optical, SAR, and laser-altimetry missions. In customer-workflow terms, the company is trying to own the mission-control layer from launch support through routine operations, with selected hardware and software products embedded inside that workflow.

    The hardware side includes integrated TT&C baseband, high-speed data-reception baseband, X-band transponders, and multi-band ground-station assets. The software side is unusually detailed for a private Chinese space-infrastructure company: Yuxing’s own pages describe orbit determination, attitude control, task planning, telemetry processing, telecommand management, ground-station control, 3D visualization, and digital-twin systems. The service side then wraps those modules into customer outcomes such as launch support, constellation management, calibration, and space-safety operations.

    This layered structure matters because it explains both the company’s differentiation and its complexity. Yuxing is not simply selling a station or a software console; it is packaging an operating architecture. That is good for stickiness, but it also means maturity differs by module. The legacy mission-operations stack is much more productized and field-proven than the newest in-orbit servicing branch.
