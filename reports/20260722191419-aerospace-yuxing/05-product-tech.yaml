  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: servicing-commercial-roadmap
    missingEvidence: Signed customers, repeat missions, or a public commercialization timeline for the robotic-arm / in-orbit servicing branch.
    whyItMatters: The demo is technically meaningful, but product maturity cannot be upgraded to commercial readiness without evidence of a repeatable mission pipeline.
    diligencePath: Request post-demo roadmap, customer LOIs, partner contracts, and next-mission schedules.
    relatedQuestionRefs:
    - QE013
    - QE015
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: reliability-slas
    missingEvidence: Independent uptime, pass-success, anomaly-response, and software reliability metrics for the mission-control stack.
    whyItMatters: Public sources describe features and controls but do not provide externally benchmarkable proof of operating quality.
    diligencePath: Request SLA reports, incident logs, and third-party security or quality audits.
    relatedQuestionRefs:
    - QE018
    - QE019
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: patent-families
    missingEvidence: A directly enumerated patent-family list or official patent database export tied to Yuxing’s products.
    whyItMatters: Patent count alone does not reveal moat quality or relevance to current modules.
    diligencePath: Pull CNIPA or management-provided patent-family schedules mapped to products and services.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: hardware-install-base
    missingEvidence: Shipment volume, installed base, and field-failure statistics for Yuxing’s baseband, transponder, and ground-station products.
    whyItMatters: Hardware differentiation is credible, but market adoption and reliability are not public.
    diligencePath: Request installed-base summary, return rates, and top customer deployments by hardware module.
