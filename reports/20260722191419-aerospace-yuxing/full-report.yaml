  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold / event
      - transmission to thesis
      - action implication
    rows:
      - - Weak economics disclosure
        - IPO or financing materials show poor margins, weak utilization, or limited recurring mix.
        - Breaks the idea that scale is translating into durable value.
        - Reset valuation band downward or walk away.
      - - Operational incident
        - Major TT&C / launch-support / in-orbit failure becomes public.
        - Damages mission-critical trust and customer willingness to expand.
        - Pause diligence and reassess customer risk premium.
      - - Regulatory / licensing surprise
        - Key service line requires harder-to-obtain or partner-dependent approvals than expected.
        - Cuts addressable revenue and raises execution friction.
        - Demand licensing map before proceeding.
      - - Customer / ecosystem concentration
        - Anchor launch or constellation programs internalize work or shift to alternatives.
        - Reduces utilization and compresses pricing power.
        - Re-cut base case using lower growth and lower margin assumptions.
      - - Aggressive pricing without proof
        - New round prices at the top public narrative while major diligence gaps remain open.
        - Turns a good company into a poor entry point.
        - Decline or insist on stronger structure / terms.
    notes: These are monitorable events that should change the investment posture, not abstract concerns.
    claimRefs:
      - CV023
      - CV032
      - CV033
      - CV034
      - CV037
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner / diligence path
    rows:
      - - Management accounts
        - Revenue, gross margin, EBITDA, cash, debt, and burn by quarter and by service line.
        - Converts hype into underwritable economics.
        - Request CFO pack / board materials.
      - - Utilization and cohort data
        - Ground-station utilization, renewal rates, launch-to-operations conversion, and SLA performance.
        - Shows whether infrastructure is compounding or just expanding.
        - Request operations dashboard and cohort analysis.
      - - Customer concentration
        - Top customers, contract duration, average deal size, and backlog.
        - Determines whether revenue durability is broad or fragile.
        - Request sales pipeline and top-account summary.
      - - Licensing / compliance map
        - Service-by-service permits, partner dependencies, overseas site approvals, and any regulator correspondence.
        - Regulation can cap revenue and delay execution.
        - Request legal/compliance memo.
      - - Incident history
        - Mission failures, near misses, refunds, SLA breaches, and insurance / liability profile.
        - Reliability is the product in mission-critical infrastructure.
        - Request risk committee / QA logs.
      - - Cap table / preference stack
        - Current ownership, liquidation preferences, anti-dilution terms, and recent round rights.
        - Determines what headline valuation means for new money and common.
        - Request full cap table and term sheets.
    notes: These are the minimum materials needed to move from research-more to an investable decision.
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV035
