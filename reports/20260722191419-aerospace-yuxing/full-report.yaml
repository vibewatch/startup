      - number: '6.2'
        title: Named Deployments and Production Proof
        blocks:
          - type: paragraph
            body: >-
              The most important customer proof is not a logo wall but a short list of named missions that clearly
              required production-grade operational support. On its homepage, Yuxing says it has provided full-process
              TT&C service for Galactic Energy's Ceres-1 series from the maiden Y1 launch through Y9. That is unusually
              strong repeat-use evidence for an infrastructure provider because it spans multiple missions across years
              rather than a single marketing case. Separate Galactic Energy launch pages show the rocket family itself
              continuing to scale in 2025, while 2026 China Daily and Global Times coverage shows Ceres-1 still flying
              regularly.


              The second clear proof point is PIESAT's Nuwa constellation. Yuxing's own site says it acted as the TT&C
              overall unit and teamed with Xi'an Huanyu and Guoke Hualu to secure high-rate data reception for the first
              four-satellite Nuwa launch in March 2023. PIESAT's own website and multiple Xinhua-carried reports confirm
              that the first PIESAT-1 batch was a four-satellite commercial remote-sensing formation for commercial data
              services, and the company later expanded the constellation with a second four-satellite batch in late
              2024.


              The third named case is Beijing-3C. Yuxing says it provided TT&C for all four satellites launched in May
              2024 and used stations in Zhongwei, Mengla, Sanya, and Southeast Asia to receive telemetry and inject
              commands. Government, People's Daily, and SpaceNews reporting independently confirm the four-satellite
              launch and identify the customer-side operator as 21AT. Together, these cases prove that Yuxing is not
              just selling components; it is trusted on live launch and in-orbit workflows where failure would be
              visible and costly.
