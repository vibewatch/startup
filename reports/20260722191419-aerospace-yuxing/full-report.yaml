  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Classes and Why Yuxing Faces More Than One Peer Set
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing is not competing against one clean like-for-like rival. Its own official materials place
              it in commercial measurement, control, communications, payload-data reception, remote-sensing calibration,
              and in-orbit management rather than in a single narrow ground-pass brokerage business. That means the most
              relevant benchmarks split into at least four classes: global outsourced ground-network operators such as
              KSAT and SSC; cloud- or API-led ground-segment utilities such as AWS Ground Station, Leaf Space, and
              ATLAS; integrated constellation operators such as Geespace and SpaceSail that can keep mission operations
              in-house; and status-quo internal-build programs that prefer to own their stations, licenses, and
              procedures.


              The global benchmark class matters because it shows what the top end of outsourced mission assurance looks
              like. KSAT pairs TT&C, LEOP, hosted ground infrastructure, lunar communications, and satellite operations
              with a network of more than 280 antennas across 26 locations. SSC makes a similar but older-market claim,
              positioning itself as one of the world’s largest and most dependable ground-station networks while also
              offering spacecraft operations and engineering services. Yuxing’s official posture is narrower
              geographically but comparable in ambition: it says it has built a 60-plus-station network and a
              comprehensive calibration field, and that it has already served more than 370 satellites and rockets.


              The substitute class is just as important. AWS, Leaf, and ATLAS do not merely sell antenna time; they
              package software, APIs, and workflow abstraction that reduce the need for buyers to assemble bespoke
              ground infrastructure. At the far end, Geespace and SpaceSail show how integrated operators can compete
              for the same mission budgets without ever becoming independent infrastructure vendors. For Yuxing, the
              competitive question is therefore not "who has another antenna network?" but "who can solve satellite
              operations, data delivery, and mission activation with less friction or better political fit than Yuxing
              can?"
