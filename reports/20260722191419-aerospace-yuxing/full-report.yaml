      - number: '3.3'
        title: Commercial Models, Switching Costs, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              The biggest commercial difference across the field is not technical capability but packaging. AWS
              publishes the cleanest public contract logic in the retained set: pay only for antenna minutes, choose
              on-demand or reserved scheduling, and keep processing inside AWS or route data back to your own
              infrastructure. Leaf is almost as explicit, arguing that customers should pay only for what they use and
              disclosing both network scale and the rough capex and maintenance burden of building a station yourself.
              ATLAS competes on a single API, LEOP support, and federated-network abstraction; KSAT competes on service
              depth and operational reliability; Yuxing and the Chinese integrated operators disclose far less about
              realized contract terms.


              That difference creates two procurement effects. First, price discovery is much easier for standardized
              cloud-led or GSaaS workflows than for sovereign or project-style mission support. Second, the true
              switching cost is not the antenna. It sits in licensing, onboarding, mission software integration, data
              routing, operational procedures, anomaly response, and customer approvals. AWS says operators must
              complete licensing and onboarding before using the network. Leaf’s technical documentation says a
              self-built station also requires regulatory approvals, operating software, maintenance teams, and either
              owned sites or teleports. ATLAS and KSAT both stress that their value is eliminating the need to build a
              new provider stack from scratch.


              This means multi-homing is real but not free. A sophisticated operator can mix providers, combine public
              clouds with federated networks, or keep some assets in-house while outsourcing overflow and LEOP support.
              But once workflows, security approvals, and operational habits are embedded, mission-critical programs
              gain soft lock-in even when physical exclusivity is absent. Yuxing benefits from this if it becomes the
              trusted domestic operator-of-record for Chinese programs; it suffers if buyers conclude that a cheaper,
              more automated, or more vertically integrated alternative can perform the same mission with less bespoke
              support.
