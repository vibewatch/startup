      - number: '8.5'
        title: Recommendation, Thesis / Anti-Thesis, and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              The supported recommendation is TRACK / RESEARCH-MORE, with medium confidence and a high risk rating. The
              company has enough operating and customer proof to stay active in the pipeline, and the strategic position
              inside Chinese commercial-space infrastructure is real. That is the thesis. The anti-thesis is that every
              element an investor would need to transform strategic importance into dependable equity returns remains
              insufficiently disclosed: service-line economics, station utilization, concentration, preference overhang,
              licensing map, incident history, and the exact relationship between headline financing and durable
              cash-generation. The recommendation is therefore price-sensitive, not binary. Below or around the lower
              public late-stage marker, with real downside protection and confirmatory diligence, the story can merit
              serious engagement. At the aggressive top end of public narrative, the evidence is not strong enough.


              The next diligence step is equally clear. Request the management accounts, service-line cohorts,
              utilization data, concentration table, licensing and overseas-site map, incident/SLA history, and current
              cap table. Then reconcile the financing story against actual economic performance. If those materials show
              strong recurring mix, healthy utilization, and acceptable downside structure, the valuation band can move
              up. If they do not, the current public excitement is more likely to compress than to compound. In short:
              do not dismiss Aerospace Yuxing, but do not outsource underwriting discipline to the 2026 financing
              headlines either.
