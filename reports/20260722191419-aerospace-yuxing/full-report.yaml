companyProfile:
  summary: >-
    Aerospace Yuxing, publicly branded as Emposat and 航天驭星, is a Beijing-based commercial space infrastructure company
    founded in 2016. Public evidence shows a broad mission-critical service stack spanning launch and early-orbit TT&C,
    long-term spacecraft operations, safety management, remote-sensing calibration, and adjacent
    ground/software/communications products. The company appears strategically well-positioned inside China's
    commercial-space buildout, with a 60-plus-station network, hundreds of paid missions served, named customer proof,
    and active IPO counseling in 2026. The main challenge is not whether the business is real; it is whether the current
    price can be underwritten without audited economics, concentration data, licensing detail, and cap-table visibility.
