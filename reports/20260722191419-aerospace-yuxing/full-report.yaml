          to: synthesis
          label: Supports upside
        - from: risk
          to: synthesis
          label: Raises discount rate
        - from: valuation
          to: synthesis
          label: Caps willingness to pay
        - from: synthesis
          to: call
          label: 'Net: diligence, not blind conviction'
