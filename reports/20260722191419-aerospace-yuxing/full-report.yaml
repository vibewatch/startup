      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Yuxing's real market is the control layer, not the whole broadband headline
            body: >-
              The strongest market insight is that Aerospace Yuxing monetizes the ground-and-operations layers that
              constellations and telcos need before service activation, so the most relevant demand drivers are
              launches, gateways, standards, and recurring control tasks rather than retail subscriber hype.
