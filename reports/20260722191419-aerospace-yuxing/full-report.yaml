    title: Recommendation logic
    type: flow
    layout: wide
    summary: How market proof, customer proof, risk, and valuation support translate into the recommendation.
    data:
      nodes:
        - id: proof
          label: Operating proof
          description: Hundreds of missions served and named customer / launch cases.
        - id: market
          label: Strategic market
          description: Chinese commercial-space buildout creates room for infrastructure providers.
        - id: risk
          label: Risk / disclosure gap
          description: Economics, concentration, regulation, and cap-table visibility remain incomplete.
        - id: valuation
          label: Price support
          description: Public marks conflict; high-end narrative is not underwritten publicly.
        - id: synthesis
          label: Synthesis
          description: Good company candidate, incomplete investment proof at current information level.
        - id: call
          label: 'Recommendation: Track / research-more'
          description: Stay engaged, but require confirmatory diligence and disciplined price.
      edges:
        - from: proof
          to: synthesis
