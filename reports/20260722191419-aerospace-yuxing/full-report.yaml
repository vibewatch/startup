      - number: '5.2'
        title: Architecture, Operating Model, and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              The official software pages provide the clearest architecture disclosure in the retained set. Yuxing says
              the control platform uses a browser/server structure, Vue front-end, Java back-end, microservices, cloud
              servers, cloud storage, and containerized operations under Kubernetes, with high availability, elastic
              scaling, load balancing, and backup. Functionally, the stack breaks into a management layer, task
              planning, telemetry processing, telecommand management, orbit management, ground-station management, data
              relay, visualization, and a station digital-twin system. That is a modern web-operations architecture
              rather than a purely local control console.


              The workflow implication is straightforward. Orbit data and mission rules feed task planning, which then
              drives telemetry, telecommand, and station control. Ground-station management handles automation and
              device access. Data relay moves traffic between station, software, and users. Visualization and digital
              twins provide situational awareness. Safety and deorbit services sit across the stack, using daily
              collision calculations, health prediction, and control logic. This is the practical reason Yuxing can sell
              both mission-support services and product modules: the products are really pieces of a larger operating
              loop.


              Customer use also looks more operational than consumer-facing. Operators come to Yuxing for launch
              support, satellite control, payload data landing, calibration, and safety or end-of-life services. The
              technology matters insofar as it reduces manual operations, shortens response time, or enables
              capabilities مثل complex orbit control and near-real-time human-in-the-loop operations. That
