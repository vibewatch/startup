              - CV022
              - CV036
      - number: '8.2'
        title: Why the Company Is Worth Valuing at All
        blocks:
          - type: paragraph
            body: >-
              The easiest mistake on a thinly disclosed private company is to jump straight to skepticism and miss the
              substance. Yuxing has enough public proof to avoid that trap. Official pages show that the company is not
              pitching one narrow point product; it participates in launch and early-orbit TT&C, long-term in-orbit
              management, safety management, calibration, and related hardware/software products. Customer-side and
              independent reporting add real-world proof points across PIESAT, Beijing-3C/21AT launch coverage, and
              broader commercial-launch support. That evidence matters because it means the valuation debate is about
              entry discipline and underwriting quality, not about whether the company exists or whether anyone pays for
              it.


              The same evidence also shapes the upside case. A space-infrastructure provider that already sits inside
              launch, constellation operations, and safety workflows can plausibly deepen wallet share as Chinese
              commercial space expands. The strongest upside path is not a single moonshot program but the compounding
              of mission-critical services into longer-term operating relationships, plus selective upside from adjacent
              products or servicing. Yet this is exactly where public evidence runs out. The business is real; the
              persistence and profitability of that business are still mostly unpriced from outside. Investors should
              therefore keep two truths in mind at once: Yuxing has earned serious diligence, and Yuxing has not yet
              earned a no-discount valuation.
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV030
              - CV040
              - CV041
              - CV042
      - number: '8.3'
        title: Public Comps Give a Band, Not a Point Estimate
        blocks:
          - type: paragraph
            body: >-
              Because Yuxing does not disclose audited operating metrics, the public comparable set is best used as a
              framing tool rather than a plug-and-play multiple engine. The retained July 2026 market-data set is wide
              enough to prove the point on its own. Planet Labs, a more data-platform-oriented EO story, trades around
              an $8.1-$8.2B market cap and roughly 23.8x EV/revenue. Spire, a smaller multi-product space-data platform,
              sits near a $0.44-$0.45B market cap and about 6.5x EV/revenue. Iridium, a mature recurring satcom
              infrastructure benchmark, sits around $5.0B market cap and 7.6x EV/revenue on far larger revenue. At the
              other extreme, AST SpaceMobile trades at a multi-tens-of-billions market cap with EV/revenue above 222x,
              showing how strategic narrative and optionality can overwhelm near-term fundamentals.


              Those numbers are useful precisely because they are not directly transferable. Planet and Spire are better
              benchmarks for commercialization discipline and public-market tolerance for satellite/data platforms.
              Iridium is useful for what mature recurring satcom can command with better disclosure. ASTS is useful as a
              warning that the space sector sometimes prices dreams very richly — but also that such pricing depends on
              a very different story, customer base, and capital-market context. For Yuxing, the lesson is that
              comparables support only a wide range. They do not eliminate the need for a disclosure discount or justify
              paying the top end of private-market hype by analogy.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
