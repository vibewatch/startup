      - number: '7.3'
        title: Dependency, Customer, and Market-Structure Risk
        blocks:
          - type: paragraph
            body: >-
              Yuxing's public customer proof is real but narrow. The named roster is short and concentrated inside
              China's commercial-space ecosystem: Galactic Energy on the launch side, PIESAT and 21AT on the
              Earth-observation side, plus generic references to global users and additional launch families in later
              media coverage. That means the chapter can prove adoption but not broad diversification. If Chinese
              commercial-launch cadence slows, if one large constellation operator internalizes more workflow, or if a
              state-backed platform captures the next wave of anchor demand, Yuxing's utilization and growth could
              soften quickly even while the overall sector still looks healthy on paper.


              There is also a layered dependency problem. The Nuwa case shows Yuxing operating as part of a larger
              network with Xi'an Huanyu and Guoke Hualu, which highlights that some customer outcomes may depend on
              partner capacity rather than on purely owned infrastructure. On the overseas side, Yuxing markets a global
              footprint, but the retained public set still does not name a foreign anchor customer. Meanwhile,
              Reuters-reported evidence from Brazil and Orbital Radar's tracking of SpaceSail/Qianfan show that large,
              state-backed Chinese constellation players are already winning international demand and moving quickly.
              That does not exclude Yuxing from overseas roles, but it raises the risk that international monetization
              sits downstream of larger ecosystem players rather than directly on Yuxing's balance sheet.


              The result is a business that may be strategically important but still economically dependent on a
              relatively small number of ecosystem motions: Chinese launch cadence, domestic constellation buildout,
              regulator-approved service categories, and partner access where licenses or local market structure favor
              larger state-linked entities.
