  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Yuxing typically enters at the most mission-critical operational point—launch and first acquisition—then expands
      into routine ops, payload workflows, and safety services.
    data:
      nodes:
        - id: j1
          label: Launcher / Operator Procurement
          description: Mission owner chooses a provider for launch support, early-orbit control, or constellation operations.
        - id: j2
          label: Network Planning & Integration
          description: Frequency, station, orbit, and protocol planning align Yuxing stations and software to the mission profile.
        - id: j3
          label: Launch & First Acquisition
          description: >-
            Launch TT&C, separation confirmation, telemetry reception, and first command injection create the
            highest-trust moment.
        - id: j4
          label: Routine In-Orbit Operations
          description: The workflow can expand into recurring station passes, orbit determination, planning, and problem handling.
        - id: j5
          label: Payload Data / Calibration
          description: Remote-sensing users can add data reception and calibration services once the spacecraft is operating.
        - id: j6
          label: Safety / End-of-Life / Special Ops
          description: >-
            The deepest relationship layers in collision warning, maneuver support, deorbit, and future servicing use
            cases.
