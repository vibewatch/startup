      - number: '8.4'
        title: Scenario Analysis and Where Price Stops Working
        blocks:
          - type: paragraph
            body: >-
              The valuation question is best answered with scenarios. In the bull case, Yuxing translates its verified
              launch-control footprint into sticky multi-year constellation operations, preserves regulatory
              positioning, keeps commercial-launch cadence healthy, and proves that newer capabilities such as servicing
              or higher-value integrated products are more than narrative. That path can justify value moving toward or
              beyond the top public unicorn talk, because investors would be underwriting not only strategic relevance
              but also a stronger recurring-revenue mix. In the base case, the company remains clearly real and
              strategically relevant, but still thinly disclosed; the most reasonable underwriting band stays near the
              lower public 60-70亿元 marker, with investors paying for installed position but demanding a discount for
              missing economics.


              The bear case is not that the company disappears. It is that public-market preparation or a new financing
              round exposes weaker-than-expected unit economics, customer concentration, or infrastructure utilization
              just as launch cadence, regulation, or capital markets become less forgiving. In that scenario, the right
              valuation frame falls sharply into a 20-40亿元 zone, particularly if the cap table or preference stack
              proves unfriendly to new money or common-equity outcomes. The practical implication is blunt: price stops
              working well before proof stops working. Yuxing can remain a strategically meaningful company and still be
              a poor investment at the wrong mark.
            claimRefs:
