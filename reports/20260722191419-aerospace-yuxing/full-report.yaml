      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a real company with an unclear price, not an unclear company with a clear price
            body: >-
              The core valuation lesson is that Yuxing has enough mission, customer, and product proof to merit serious
              investor attention, but not enough public economics disclosure to justify treating the boldest 2026
              valuation headlines as settled fair value.
            calloutType: insight
            claimRefs:
