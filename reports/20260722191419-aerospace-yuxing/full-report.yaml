          items:
            - Management
            - Task planning
            - Telemetry
            - Telecommand
            - Orbit
            - Visualization / digital twin
        - label: Ground & comms hardware
          detail: Physical modules and assets that execute TT&C and data reception
          items:
            - Ground stations
            - Integrated baseband
            - High-speed baseband
            - X-band transponder
        - label: Specialized infrastructure
          detail: Differentiated assets and services layered on top of the core stack
          items:
            - Calibration field
            - Collision workflows
            - Deorbit controls
            - Robotic-arm demo branch
