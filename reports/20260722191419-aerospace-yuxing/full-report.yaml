  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing’s product definition is broader than a single satellite-ground-station product. Official
              materials show a layered stack: ground systems, communications systems, software systems, full-lifecycle
              TT&C services, long-term in-orbit management, safety and collision services, and a commercial calibration
              field for optical, SAR, and laser-altimetry missions. In customer-workflow terms, the company is trying to
              own the mission-control layer from launch support through routine operations, with selected hardware and
              software products embedded inside that workflow.


              The hardware side includes integrated TT&C baseband, high-speed data-reception baseband, X-band
              transponders, and multi-band ground-station assets. The software side is unusually detailed for a private
              Chinese space-infrastructure company: Yuxing’s own pages describe orbit determination, attitude control,
              task planning, telemetry processing, telecommand management, ground-station control, 3D visualization, and
              digital-twin systems. The service side then wraps those modules into customer outcomes such as launch
              support, constellation management, calibration, and space-safety operations.


              This layered structure matters because it explains both the company’s differentiation and its complexity.
              Yuxing is not simply selling a station or a software console; it is packaging an operating architecture.
              That is good for stickiness, but it also means maturity differs by module. The legacy mission-operations
              stack is much more productized and field-proven than the newest in-orbit servicing branch.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE009
