            body: >-
              Aerospace Yuxing clearly deserves a valuation chapter because the company is not just a concept-stage
              space story. Public materials and 2026 reporting show a late-stage business with an active IPO-counseling
              path, a broad service stack, and enough mission history to attract real institutional attention. But that
              same public record does not produce one clean price. The retained June 2026 sources disagree on both
              cumulative funding and current mark: some frame the company around a roughly 60-70亿元 valuation zone, while
              a more aggressive report places it into a 100亿元-class unicorn narrative. That is not a minor rounding
              issue. It is the core reason a disciplined investor cannot treat the latest financing headlines as a fully
              underwritten fair value.


              The right way to read the financing context is therefore asymmetric. The positive signal is real: repeated
              2026 coverage, IPO guidance, and continued hiring/procurement imply a company still expanding rather than
              retrenching. The negative signal is also real: public disclosures still do not provide audited revenue,
              margin, cash, debt, backlog, utilization, or customer concentration, and even headline metrics such as
              paid missions and financing totals vary by source. For valuation purposes, the June 2026 round headlines
              are evidence that the market wants exposure to the story, not evidence that the current price is already
              justified. That distinction sets up the rest of the chapter: use public price markers as anchors, then
              discount heavily for missing economics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV020
              - CV023
              - CV035
              - CV038
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV003
