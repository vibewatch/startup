      - number: '3.2'
        title: Capability, Architecture, and Trust / Regulatory Posture
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is where the competitor set separates most clearly. Yuxing’s stack is
              mission-operations heavy: early-orbit and long-term TT&C, in-orbit management, collision and safety
              services, calibration, and ground equipment across S/X/Ka bands. KSAT and SSC overlap most directly on
              mission assurance, but they do so from globally distributed networks with mature outsourced-service
              positioning. AWS overlaps differently: it standardizes common satellite workflows into a cloud-managed
              service, supports public S- and X-band workflows, publishes site locations, exposes console and API
              controls, and offers dedicated antennas when public sites are insufficient. Leaf and ATLAS push the same
              direction more explicitly for new-space operators, emphasizing automated scheduling, single-integration
              access, and federated networks that lower the integration burden of multi-site operations.


              Trust and regulatory posture are not symmetrical across the field. Yuxing’s domestic advantage is that it
              explicitly supports frequency coordination, launch-permit application, in-orbit safety management, and
              calibration inside the Chinese operating environment. That makes it structurally closer to state-program
              or domestic commercial-space workflows than Western ground networks are. By contrast, AWS and ATLAS
              highlight secure APIs, digital twins, 24/7 operations, and government-grade workflows, which are
              attractive for buyers already living inside U.S.-aligned cloud and defense ecosystems. Geespace adds
              another kind of trust posture: it bundles its own constellation, chips, modules, antennas, terminals, and
              vertical solutions, so customers can buy an integrated service instead of stitching together multiple
              vendors.


              The practical result is that Yuxing is strongest where a buyer values China-local execution, long-life
              mission support, and adjacent safety/calibration capability. It is weaker where buyers want the most
              transparently documented global footprint, plug-and-play APIs, or a bundled downstream connectivity
              product. That distinction matters because many procurement decisions will be made on trust, workflow
              compatibility, and licensing fit long before a mission team compares raw antenna specs.
