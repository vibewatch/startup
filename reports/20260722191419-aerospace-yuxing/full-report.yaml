  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and What Is Actually Monetized
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing is not a pure software or pure hardware company, so its public revenue model has to be
              reconstructed from the service stack it discloses. Official pages show at least four monetizable buckets:
              launch and early-orbit measurement-and-control support, long-term in-orbit management, remote-sensing
              calibration and payload-data services, and product sales such as ground systems or communications
              equipment. That mix matters because it implies different revenue timing. Early-orbit and launch support
              are event-driven. Long-term spacecraft operations can be recurring but are still mission-linked and
              operationally intensive. Calibration and safety services look specialized and potentially higher value,
              but public pricing is absent. Equipment and software product sales could expand ticket size while also
              pulling the company toward lower-margin project economics.


              The strongest public traction signals are directionally positive but messy. The official intro says the
              company has served more than 370 satellites and rockets. A June 2026 Tencent/IPO article says the count is
              674 paid satellites and rockets. Jiemian reports the company has provided paid services to more than 500
              satellites and rockets and that service volume doubled for four straight years. Those figures all point in
              the same direction — Yuxing is not pre-revenue — but they are too inconsistent to convert directly into
              revenue without customer mix, contract value, and duration.


              The practical conclusion is that Yuxing likely monetizes a bundle of mission-critical services plus
              selective product revenue. That is better than relying on one thin service line, but it also means classic
              SaaS shortcuts such as ARR multiple thinking or simple seat-based pricing are inappropriate. The right
              frame is service mix, utilization, and the share of revenue that renews once a satellite leaves the launch
              phase.
