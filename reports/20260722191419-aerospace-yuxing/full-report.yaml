  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Yuxing’s product is a stack: mission software, ground hardware, service workflows, and specialized infrastructure
      rather than one isolated SKU.
    data:
      layers:
        - label: Customer jobs
          detail: External workflows the stack is built to serve
          items:
            - Launch TT&C
            - Routine in-orbit ops
            - EO data landing
            - Calibration
            - Safety / deorbit
            - Future servicing
        - label: Control software
