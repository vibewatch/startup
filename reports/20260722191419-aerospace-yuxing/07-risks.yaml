  evidenceGaps:
  - type: missing-source
    severity: material
    topic: licenses-and-permits
    missingEvidence: A complete list of licenses, permits, filings, and approval dependencies by service line, site, and subsidiary.
    whyItMatters: The public set proves regulation matters but does not reveal whether Yuxing already holds every permit needed for each monetized service.
    diligencePath: Request a license matrix covering frequency coordination, station operations, cross-border data handling, launch support, and any telecom or remote-sensing permissions.
    relatedQuestionRefs:
    - QR006
    - QR008
    - QR027
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: data-governance
    missingEvidence: Important-data assessment, localization policy, outbound-transfer controls, cyber architecture, and incident-response process.
    whyItMatters: Data and cybersecurity law are a top-tier risk, but the company's actual governance stack is not public.
    diligencePath: Request data inventory, classification policy, security-review triggers, vendor map, and incident logs.
    relatedQuestionRefs:
    - QR002
    - QR003
    - QR005
    - QR027
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: operational-reliability
    missingEvidence: Uptime, incident history, SLA commitments, mission-failure attribution, insurance coverage, and spare-parts strategy.
    whyItMatters: A mission-critical infrastructure business cannot be underwritten confidently without reliability data.
    diligencePath: Request site-level uptime, incident postmortems, insurance schedules, and customer SLA terms.
    relatedQuestionRefs:
    - QR010
    - QR011
    - QR013
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: economics-and-concentration
    missingEvidence: Revenue mix, margin by service line, top-customer share, station utilization, backlog, burn, cash, and debt.
    whyItMatters: These are the variables that determine whether infrastructure scale creates operating leverage or just ongoing capital need.
    diligencePath: Request audited historical financials plus customer, utilization, and backlog schedules.
    relatedQuestionRefs:
    - QR017
    - QR021
    - QR022
    - QR040
    relatedTableRefs:
