- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Data / licensing compliance risk
    - Evidence of important-data classification, outbound-review friction, or missing service licenses
    - Any regulator notice, failed review, or inability to secure required partner structure
    - Pause valuation expansion and demand a full legal-compliance workstream.
  - - Mission-delivery reliability risk
    - Named launch or constellation incident, missed acquisition, or public customer complaint
    - Any material mission failure attributable to Yuxing systems or processes
    - Re-rate the business from infrastructure moat to operational-liability story.
  - - Launch-cadence concentration risk
    - Commercial-launch throughput or named launcher cadence weakens for multiple quarters
    - Two consecutive periods of visibly weaker launch activity without offsetting operator wins
    - Cut growth assumptions and pressure-test station utilization.
  - - Servicing-branch overstatement risk
    - No signed commercial contract, no actual propellant-transfer proof, or repeated demo-only messaging
    - Another year of demo progress without commercial conversion
    - Value servicing at zero beyond option value.
  - - Disclosure / IPO risk
    - Management cannot reconcile mission counts, funding totals, or permit inventory in diligence
    - Any persistent KPI inconsistency into formal filing prep
    - Treat IPO path as a risk event rather than a de-risking event.
  - - Capital-intensity risk
    - Capex and procurement keep rising without audited margin or utilization proof
    - Expansion spend continues while economics remain opaque
    - Require audited unit economics before underwriting premium multiples.
  notes: The goal is to translate a broad risk list into monitorable thesis-break conditions that can be tested during diligence and portfolio monitoring.
