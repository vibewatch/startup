  rows:
  - - Launch / early-orbit TT&C
    - Mission-based support for rocket launch and early orbital operations
    - Per mission / support window
    - Officially disclosed as core service; no public pricing
    - Potentially high-value but episodic
    - Request average contract value, launch cadence, and gross margin by mission type.
  - - Long-term in-orbit management
    - Ongoing planning, data handling, orbit keeping, issue diagnosis, constellation support
    - Per satellite / per constellation / term contract
    - Officially disclosed; recurring model plausible but not quantified
    - Best candidate for recurring revenue
    - Request renewal rates, average contract duration, and monthly per-satellite pricing.
  - - Safety and collision / space-situation support
    - In-orbit safety management, warning, and related support
    - Per satellite / risk-service contract
    - Officially disclosed; no public volume or price data
    - Could be differentiated and higher-margin if scarce
    - Request service attach rates and standalone pricing.
  - - Remote-sensing calibration / payload data services
    - Calibration field usage and payload-data support
    - Per campaign / per satellite / data service
    - Officially disclosed; no public volume or price data
    - Specialized service with unclear repeat cadence
    - Request average project value and repeat frequency.
  - - Ground systems / communications products
    - Ground stations, baseband, communication products, software systems
    - Per product / project delivery
    - Product family publicly disclosed; no public revenue split
    - Can boost ticket size but may dilute margin quality
    - Request hardware versus software versus service revenue mix.
  - - Engineering / permits / integration support
    - Frequency coordination, launch permits, integration and consulting support
    - Per project
    - Visible in official positioning, but no public commercialization detail
    - Important for go-to-market and stickiness
    - Request attach rate to operations contracts and average sales-cycle length.
  notes: The table reflects monetizable activities visible in public materials, not reported segment revenue. Several rows may be bundled together in actual contracts.
