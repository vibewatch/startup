- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - current public proxy
  - why proxy is insufficient
  - exact diligence path
  rows:
  - - Revenue by service line
    - Cannot tell whether economics are recurring or project-heavy
    - Official service and product menus
    - Menus show what can be sold, not what is actually sold
    - Obtain management P&L by stream and top 20 contracts.
  - - Gross margin by stream
    - Cannot assess operating leverage or pricing power
    - External station-cost proxies and product self-development claims
    - Proxies do not show realized service labor or site costs
    - Request gross margin waterfalls by stream and by representative contract.
  - - Cash on hand and runway
    - Cannot judge financing dependency or downside risk
    - IPO counseling and repeated fundraising
    - Fundraising history is not cash availability
    - Request latest cash balance, debt, and 12-month cash bridge.
  - - Customer concentration
    - Cannot assess renewal and bargaining risk
    - Mission count claims and partner lists
    - Counts and logos do not reveal revenue concentration
    - Request top-customer revenue share and churn.
  - - Station utilization
    - Cannot infer margin sensitivity or capex productivity
    - Public station-count claims
    - Station count without occupancy says little about economics
    - Request utilization by site, band, and time period.
  - - Official filing detail
    - Cannot fully reconcile IPO status or capital-market path from primary docs
    - Secondary articles plus blocked EID platform fetch
    - Secondary coverage is not a filing document
    - Retrieve the company-specific counseling filing and progress reports from regulator systems or management.
  notes: These are the specific missing numbers that block a real underwriting view. They should be asked directly in diligence, not estimated from marketing material.
