- id: cost-structure-and-unit-economics-proxies
  title: Cost Structure and Unit-Economics Proxies
  body: |-
    The best available unit-economics evidence is indirect, but it is still informative. Jiemian explicitly describes commercial space TT&C as a heavy-asset, long-cycle business that requires ongoing spending on ground-station infrastructure, RF systems, antennas, baseband equipment, site operations, and domestic plus foreign compliance. AWS’s FAQ makes the same structural point from the buyer side: traditionally, operators need significant capital investment to build ground stations and operating centers, which is precisely the cost burden managed-service platforms are trying to remove. Leaf’s technical documentation puts rough numbers on one part of that burden, saying a typical S/X-band antenna can cost roughly €400k-€500k plus about €7k per month of maintenance.

    Those proxies suggest that Yuxing’s gross margin is highly sensitive to station utilization, network mix, and how much work can be standardized. A launch-support contract with dedicated staff and short burst usage looks very different from a multi-year in-orbit management contract that reuses existing infrastructure. The company’s own product pages further imply that some contracts may include equipment sales, software, and integrated data services, which again makes margin quality dependent on mix rather than on one uniform service SKU.

    Public competitors sharpen the point. AWS exposes per-minute scheduling, licensing workflow, and cancellation rules, while Leaf markets no-commitment usage and expansion of shared network capacity. Those utility-like models set an outside price ceiling for standardized missions. Yuxing can probably defend better economics where the job is regulatory, safety-critical, or deeply integrated into Chinese launch and satellite workflows. But without utilization, renewal, and product-versus-service mix disclosure, the current margin path is still a diligence question rather than a reportable fact.
