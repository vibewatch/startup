  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-margin-disclosure
    missingEvidence: Revenue by stream, gross margin by stream, EBITDA or operating loss, and audited 2025-2026 financial statements.
    whyItMatters: Without actual revenue and margin numbers the chapter cannot move beyond structural inference into underwriting.
    diligencePath: Request audited statements, management accounts, revenue-recognition policy, and gross-margin waterfalls by stream.
    relatedQuestionRefs:
    - QI020
    - QI025
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, debt facilities, project-finance obligations, and monthly burn / runway.
    whyItMatters: Capital adequacy is the core financial diligence question and cannot be answered from public materials alone.
    diligencePath: Request the latest balance sheet, debt schedule, 13-week cash forecast, and board runway materials.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: material
    topic: traction-and-funding-counts
    missingEvidence: A reconciled mission-count table and financing chronology that explains why public sources cite 370, 500+, and 674 paid missions and >RMB 1bn versus >RMB 2bn financing.
    whyItMatters: The conflict does not negate traction, but it prevents precise financial modeling and weakens confidence in public benchmarking.
    diligencePath: Obtain a company-certified KPI history and cap-table / financing summary aligned to specific dates.
    relatedQuestionRefs:
    - QI005
    - QI010
    relatedTableRefs:
    - TI003
    - TI004
  - type: access-blocked
    severity: material
    topic: ipo-filing-detail
    missingEvidence: The company-specific IPO counseling filing and subsequent official progress reports from regulator systems.
    whyItMatters: Secondary reporting corroborates the timeline, but a primary filing is needed to reconcile precise capital-market status and disclosures.
    diligencePath: Retrieve the company-specific record from the electronic disclosure platform or request the filing package directly from management or counsel.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: segment-mix-utilization
    missingEvidence: Contract cohort data showing stream mix, station utilization, renewal rates, and hardware versus service contribution.
    whyItMatters: This is the missing link between credible activity and credible profitability.
    diligencePath: Request site-level utilization, contract cohort renewals, and stream-level P&L by quarter.
    relatedQuestionRefs:
    - QI002
    - QI016
    - QI021
    relatedTableRefs:
    - TI001
    - TI003
