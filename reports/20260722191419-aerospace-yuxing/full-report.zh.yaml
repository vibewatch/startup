  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前价值 / 状态
      - 质量
      - 尽调问题
    rows:
      - - 发射 / 早期轨道 TT&C
        - 为火箭发射和早期轨道运行提供按任务计的支持
        - 每项任务 / 支持窗口
        - 官方披露为核心服务；无公开定价
        - 潜在价值高，但呈事件性
        - 索取按任务类型拆分的平均合同价值、发射节奏和毛利率。
      - - 长期在轨管理
        - 持续规划、数据处理、轨道保持、问题诊断、星座支持
        - 每颗卫星 / 每个星座 / 定期合同
        - 官方已披露；经常性模式可信，但未量化
        - 最可能形成经常性收入
        - 索取续约率、平均合同期限和每卫星月度定价。
      - - 安全和碰撞 / 空间态势支持
        - 在轨安全管理、预警和相关支持
        - 每颗卫星 / 风险服务合同
        - 官方已披露；无公开量或价格数据
        - 如果能力稀缺，可能差异化且毛利更高
        - 索取服务附加率和独立定价。
      - - 遥感校准 / 载荷数据服务
        - 校准场使用和载荷数据支持
        - 每次项目 / 每颗卫星 / 数据服务
        - 官方已披露；无公开量或价格数据
        - 专业服务，重复节奏不清楚
        - 索取平均项目价值和重复频次。
      - - 地面系统 / 通信产品
        - 地面站、基带、通信产品、软件系统
        - 每项产品 / 项目交付
        - 产品族已公开披露；无公开收入拆分
        - 可抬高客单价，但可能稀释毛利质量
        - 索取硬件、软件和服务的收入组合。
      - - 工程 / 许可 / 集成支持
        - 频率协调、发射许可、集成和咨询支持
        - 每个项目
        - 官方定位中可见，但没有公开商业化细节
        - 对进入市场和粘性很重要
        - 索取其与运营合同的附加率，以及平均销售周期长度。
    notes: 这张表反映公开材料里可见的可变现活动，不是报告分部收入。实际合同中，若干行可能被打包在一起。
