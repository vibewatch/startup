      - number: '4.4'
        title: 财务结论与承销阻断点
        blocks:
          - type: paragraph
            body: >-
              财务结论是双面的。积极一面，Yuxing 有足够公开商业现实信号，能避开深科技常见的未收入陷阱：宽服务栈、数百次付费任务说法、持续融资，以及可信的 IPO
              准备流程。公司似乎还销售到任务关键型工作流中，价格不是唯一变量，这可以支撑比裸商品接入业务更好的经济性。


              消极一面，投资人通常用来承销质量的几乎所有指标都缺失。没有公开收入、ARR、毛利率、EBITDA、现金余额、月度烧钱、债务栈、客户集中度、合同期限或站点利用率披露。公开融资总额和任务数量指标本身也在不同来源之间不一致。甚至官方备案路径也只从保留抓取集里部分可见，因为电子披露平台在抓取时阻断了直接访问。


              因此，纪律性结论是：Aerospace Yuxing 看起来可融资且具备战略价值，但仅凭公开信息，目前无法按经济性承销。正确尽调路径是在判断收入质量、利润率轨迹或现金充足性前，拿到管理账、合同
              cohort、利用率和 SLA 数据，以及实际 IPO 辅导材料。
