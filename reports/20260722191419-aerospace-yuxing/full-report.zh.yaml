      - - 公开估值锚
        - 一个来源为 RMB 6-7bn，另一个来源为 RMB 10bn
        - 低到中
        - 估值直接影响 IPO 叙事和下行情景
        - 索取当前股权结构和最新轮投后估值。
      - - IPO 辅导状态
