      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Aerospace Yuxing
        - 聚焦中国的商业地面站与运营服务专家
        - 60+ 个地面站；服务 370+ 颗卫星和火箭
        - 中国发射、卫星、EO 和在轨运营客户
        - TT&C、长期在轨管理、定标、安全和频率协调支持
        - 公开定价、具名客户结构和全球披露的自助服务版图都很稀疏。
      - - KSAT
        - 全球外包地面网络标杆
        - 26 个地点、280+ 副天线；KSATlite 服务 150+ 家运营方
        - EO、发射、TT&C、月球和星座运营方
        - 服务组合很宽，运营深度和全球覆盖都强
        - 公开成交价格不透明；作为外国供应商，对中国本地主权工作流的适配更弱。
      - - SSC Space
        - 老牌全球地面站与运营服务商
        - SSC 称其拥有全球最大、最灵活的地面站网络之一
        - 民用、科学、电信和任务运营客户
        - 在发射、地面站和航天器运营上积累深
        - 现有公开资料在当前站点数量、定价或软件抽象层上不如 KSAT 明确。
      - - AWS Ground Station
        - 云托管地面站工具
        - 10 个具名公开地点，另有未披露的专用天线
        - 已用 AWS 承载存储、处理和任务工作流的运营方
        - 全托管服务、公开定价逻辑、直接云集成、数字孪生
        - 公开文档列明的频段 / 轨道比部分定制化供应商更窄，对中国本地任务的适配也弱。
      - - Leaf Space
        - 新航天 GSaaS 运营方
        - 40+ 个站点；每月 23,000+ 次过境；18 站扩张计划
        - 小卫星、星座，以及寻找灵活 GSaaS 的运营方
        - 有竞争力的无承诺采购姿态、披露的站点经济性、自动化排期
        - 支持窗口和披露版图仍小于最大规模的全球标杆。
      - - ATLAS Space Operations
        - 联邦式 GSaaS 与任务运营平台
        - 50+ 副天线；34+ 个全球地点；2B+ 网络指标
        - 商业、民用和防务航天器运营方
        - 单一 API、聚焦 LEOP、联邦模式、安全主导定位
        - 缺少公开定价，最强公开定位偏美国中心，而非中国中心。
      - - Geespace
        - 中国一体化 LEO 卫星通信运营商和解决方案供应商
        - 64 颗在轨卫星；最多支持 20M 用户；20+ 项国内测试和 20+ 个国家测试
        - 车辆、海事、应急、IoT 和电信相关垂直场景
        - 自有星座，加上芯片、模块、天线、终端和垂直合作伙伴
        - 不是中立第三方基础设施供应商；内部优先级可能压过外部客户需求。
      - - SpaceSail / SSST
        - 国家支持的一体化宽带运营商
        - 目标 2026 年上半年在巴西启动；与 Telebras 签署公共部门 MOU
        - 政府和主权连接项目
        - 政治背书强，可直接争夺国家连接预算
        - 现有公开资料很少揭示第三方外包需求或定价。
      - - 内部自建 / 国家集成商
        - 现状替代方案
