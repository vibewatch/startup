  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争类别，以及为什么 Yuxing 面对不止一组同行
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing
              并不是在和一个完全可比的对手竞争。它自己的官方材料把公司放在商业测控、通信、载荷数据接收、遥感定标和在轨管理中，而不是单一狭窄的地面站过境时段经纪业务里。因此，最有用的参照至少分成四类：KSAT 和 SSC
              这类全球外包地面网络运营商；AWS Ground Station、Leaf Space 和 ATLAS 这类云端或 API 驱动的地面段公用设施；Geespace 和 SpaceSail
              这类能把任务运营留在内部的一体化星座运营商；以及偏好自有站点、牌照和流程的既有内部自建项目。


              全球参照组很重要，因为它展示了外包任务保障的顶端形态。KSAT 把 TT&C、LEOP、托管地面基础设施、月球通信和卫星运营，与覆盖 26 个地点、280 多副天线的网络组合在一起。SSC
              的主张类似但市场更老，定位为全球最大且最可靠的地面站网络之一，同时提供航天器运营和工程服务。Yuxing 的官方姿态在地理上更窄，但野心可比：它称自己已建设 60 多座地面站网络和综合定标场，并已服务 370
              多颗卫星和火箭。


              替代者类别同样重要。AWS、Leaf 和 ATLAS 不只是卖天线时段；它们把软件、API 和工作流抽象打包，降低买方自组定制地面基础设施的必要性。再往远端看，Geespace 和 SpaceSail
              展示了一体化运营商如何在不成为独立基础设施供应商的情况下争夺同一批任务预算。因此，Yuxing 的竞争问题不是「谁还有另一个天线网络？」而是「谁能用比 Yuxing
              更少摩擦或更强政治适配，解决卫星运营、数据交付和任务激活？」
