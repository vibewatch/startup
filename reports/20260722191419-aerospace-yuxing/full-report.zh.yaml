      - number: '4.2'
        title: 成本结构与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              最好的单位经济性证据是间接的，但仍有信息量。界面明确把商业航天 TT&C 描述为重资产、长周期业务，需要持续投入地面站基础设施、RF 系统、天线、基带设备、站点运营，以及国内外合规。AWS FAQ
              从买方侧给出同样结构性判断：传统上，运营商需要大量资本投入来建设地面站和运营中心，而托管服务平台正是在管理这部分成本负担。Leaf 技术文档给出了其中一块负担的粗略数字：一套典型 S/X 波段天线成本约
              €400k-€500k，另需每月约 €7k 维护费。


              这些代理指标说明，Yuxing
              的毛利率对站点利用率、网络组合和标准化程度高度敏感。一个需要专门人员、短时突发使用的发射支持合同，与一个复用既有基础设施的多年在轨管理合同，经济性完全不同。公司自己的产品页还暗示，部分合同可能包含设备销售、软件和一体化数据服务，这同样让利润率质量取决于组合，而不是某一个统一服务
              SKU。


              公开竞争者进一步凸显这一点。AWS 披露按分钟排程、牌照流程和取消规则；Leaf
              则营销无承诺使用和共享网络容量扩张。这些公用设施式模型为标准化任务设置了外部价格上限。任务带有监管属性、安全关键性，或深度嵌入中国发射与卫星工作流时，Yuxing
              大概率能守住更好经济性。但在没有利用率、续约和产品 / 服务组合披露前，当前利润率路径仍是尽调问题，而不是可报告事实。
