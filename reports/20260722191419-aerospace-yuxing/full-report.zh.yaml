      - number: '7.3'
        title: 依赖、客户和市场结构风险
        blocks:
          - type: paragraph
            body: >-
              Yuxing 的公开客户证据真实但偏窄。具名名单很短，并集中在中国商业航天生态内：发射侧是 Galactic Energy，地球观测侧是 PIESAT 和
              21AT，后续媒体报道还笼统提到全球用户和其他发射家族。这意味着本章能证明采用，不能证明广泛多元化。如果中国商业发射节奏放慢，如果某个大型星座运营商把更多工作流内化，或者如果国家背景平台拿走下一波锚定需求，即便整个行业在纸面上仍健康，Yuxing
              的利用率和增长也可能迅速走弱。


              还存在分层依赖问题。Nuwa 案例显示 Yuxing 是与 Xi'an Huanyu、Guoke Hualu
              共同组成更大网络的一部分，这提示某些客户结果可能依赖合作伙伴能力，而不是完全自有基础设施。海外侧，Yuxing 营销全球足迹，但保留下来的公开资料仍没有点名海外锚定客户。与此同时，Reuters 报道的巴西证据和
              Orbital Radar 对 SpaceSail / Qianfan 的跟踪显示，大型国家背景中国星座玩家已经在赢得国际需求，并且推进很快。这不排除 Yuxing
              承接海外角色，但增加了一个风险：国际变现可能位于更大生态玩家下游，而不是直接落到 Yuxing 的资产负债表上。


              结果是，业务可能具有战略重要性，但经济上仍依赖少数生态动作：中国发射节奏、国内星座建设、获监管批准的服务类别，以及在牌照或本地市场结构偏向更大国资关联实体时获得合作伙伴入口。
