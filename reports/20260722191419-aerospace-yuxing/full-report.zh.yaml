      - number: '6.3'
        title: 重复使用和耐久性信号
        blocks:
          - type: paragraph
            body: >-
              耐久性是证据质量下降的地方。公开来源证明了规模和重复运营使用，但没有披露典型软件式留存指标，例如 NRR、GRR、续约率、平均合同期限或客户满意度分数。最好的可见耐久性代理，是重复任务分配。Galactic
              Energy 是最干净的例子，因为 Yuxing 声称双方关系从 Ceres-1 Y1 延续到 Y9。更宽的公司规模指标也暗示持续复用：Yuxing 的公开标尺从服务 370 多颗星箭，移动到 500
              多次付费星箭服务，再到 2026 年中期 674 颗付费星箭。


              Taibo 2026 年 1 月报道补充了有用的运营质感。报道称，Yuxing 在 2025 年完成 Ceres-1、Lijian-1 和 Gravity-1 发射控制任务，全年执行 10 次火箭发射控制任务和
              47 次卫星飞控任务，并声称商业发射控制付费服务市场覆盖率为 92.8%。即便部分翻译后的指标显得别扭、需要谨慎处理，信息方向是一致的：客户不是用一次网络就消失。


              不过，重复使用不等于耐久经济性。保留下来的材料没有显示多少客户续约、单一发射商或星座贡献多少收入、多少工作是一次性咨询而非经常性运营，也没有说明「全球用户」这类笼统表述之外是否存在海外客户。因此，客户章节在采用证据上扎实，但在客户质量上仍不完整。
