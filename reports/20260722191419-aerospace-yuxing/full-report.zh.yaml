      - number: '1.2'
        title: 领导层、治理与披露质量
        blocks:
          - type: paragraph
            body: >-
              公开证据在创始人层面很强，在其他管理层面则很薄。界面、Baidu
              英文公司页和官方联系方式都把赵磊标识为创始人、法定代表人、控制人，也是公司最核心的公开面孔。界面还给出了已抓取材料中最清晰的创始人与市场匹配叙事：赵磊本科就读天津大学机械工程，后来在国防科技大学完成研究生学习，之后在中国空间技术研究院从事卫星研制十多年，并于
              2016 年创办 Aerospace Yuxing。这个背景与公司把国家级任务保障能力商业化为基础设施的方向相匹配。


              赵磊以下的公开团队阵容要窄得多。人民日报把副总裁曹梦列为驭星三号 06 星任务发言人；陈静则以子公司 Sustain Space CTO
              身份出现在机械臂项目中。官方材料还称，更广义的核心团队来自传统航天系统单位。但本章抓取到的来源没有披露完整高管名单、独立董事、投资人董事席位或接班计划。这个缺口不小，尤其是公司已经进入 IPO
              辅导，很快需要从创始人叙事切换到更结构化的治理披露。


              因此，公司呈现出典型后期私营公司治理画像：创始人高度居中，技术纵深看起来可信，但制度化控制的公开信息不完整。这不会抹掉已经取得的运营成果；但投资人若把第一章证据当作底层事实，就应把治理集中度作为概览级风险继续带入，而不能假设董事会流程或第二梯队管理深度已经去风险。
