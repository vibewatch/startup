      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 这是价格不清楚的真实公司，不是公司不清楚但价格清楚
            body: 核心估值教训是，Yuxing 有足够任务、客户和产品证据值得投资人认真关注，但公开经济性披露不足，不足以把最大胆的 2026 年估值标题视为已落定的公允价值。
            calloutType: insight
