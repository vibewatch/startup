      - number: '6.4'
        title: 扩张路径和集中度风险
        blocks:
          - type: paragraph
            body: >-
              扩张逻辑直观。Yuxing
              可以先为高频发射的民营火箭公司提供发射支持，再为星座运营商增加入轨初期和日常运营，随后交叉销售数据接收、定标、安全和复杂轨道控制服务。公司的服务目录明确围绕这一推进顺序设计，具名案例也与之吻合。如果中国发射节奏和国内星座部署继续上行，公司应能在同一技术工作流内找到多条自然
              加购路径。


              但公开资料对多元化的证明，远薄于对采用的证明。具名客户名单很短，高度集中在中国，且仍集中于入轨初期或任务关键运营。公开材料没有披露大客户占比、按细分市场的客户数量、分部收入结构或单个账户期限。这意味着，一个在任务层面看似多元化的业务，在收入层面仍可能集中。


              国际上，Yuxing 明确营销全球足迹，但保留下来的公开材料中没有出现具名海外锚定客户。与此同时，Reuters 报道的巴西证据显示，SpaceSail
              这类中国国家背景星座运营商可以拿下大型海外账户。这不能直接否定 Yuxing 的扩张机会，但说明国际锚定账户可能先被更大的生态玩家拿走，基础设施专家如 Yuxing 尚未进入公众视野。
