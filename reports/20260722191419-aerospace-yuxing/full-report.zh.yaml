      - number: '2.2'
        title: 规模测算视角：服务收入、在轨足迹与基础设施吞吐量
        blocks:
          - type: paragraph
            body: >-
              公开规模证据使用了几套彼此不兼容的单位，硬压成一个整齐 TAM 会制造虚假精确。第一种视角是服务市场收入。The Business Research Company 估算全球卫星互联网市场 2026 年为
              $7.42 billion，2030 年达 $12.69 billion；这有助于证明品类具备商业意义，但范围太宽，不能单独代表 Yuxing 的可触达层。第二种视角是战略轨道规模。Orbital
              Radar、MERICS、China Daily 及其他报道都显示中国建设规模很大：仅国网和千帆规划卫星就约 28,000 颗，2026 年中前已发射 350 多颗，而中国向 ITU 提交的更广泛申报包络超过
              200,000 颗卫星。


              卫星数量重要，因为它们意味着未来会有备案、发射支持、地面网关、轨道控制和持续网络运营需求。但这些数字仍不是市场收入。ITU
              自身指引明确指出，申报不等于物理卫星一一对应，启用和里程碑义务存在，反囤积措施也会影响部署节奏。换句话说，申报足迹是野心和战略定位信号，不是收入积压。这就是市场分析的核心陷阱：最大的公开数字往往最不接近变现。


              具体到 Yuxing，最有支撑的规模结论是，公司处在一个巨大且加速的基础设施建设周期里，但它的 SAM
              明显窄于完整全球卫星互联网收入市场，也窄于最激进的中国申报数量。更多星座需要网关、TT&C、定标和长期轨道管理时，公司会受益；但每新增一个名义宽带用户，或每一颗递交给 ITU 的纸面卫星，都不会自动变成
              Yuxing 的收入。因此，本章把轨道野心、产业产能和服务市场收入视为彼此独立的观察镜头，而不是可直接相加的市场规模数字。
