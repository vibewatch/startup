  - id: TV002
    title: 正方 / 反方投资论点表
    columns:
      - 维度
      - 正向论点
      - 反向论点
      - 哪些证据会改变判断
    rows:
      - - 市场
        - 中国商业航天建设和星座需求，为基础设施专业公司留下空间。
        - 行业增长本身不保证重资产运营商有漂亮单位经济性。
        - 按服务线展示多年需求可见性和客户级在手订单。
      - - 产品
        - Yuxing 覆盖测控、长期运营、安全、校准和相邻产品。
        - 宽产品线也可能掩盖低毛利项目组合和执行摊子过大。
        - 按产品和服务族披露毛利率与附加率数据。
      - - 客户
        - 具名任务和客户证明了采用度和相关性。
        - 公开客户名单仍窄，集中度无法排除。
        - 披露前 10 大客户集中度、续约数据和合同期限。
      - - 财务
        - 后期融资和 IPO 辅导意味着资本通道仍在。
        - 没有公开收入、EBITDA、现金或利用率披露，价格仍不透明。
        - 提供经审计管理账，以及股权结构 / 优先权细节。
      - - 战略上行
        - 在轨服务和更高价值的一体化运营，可能把故事从商品化地面接入拉开。
        - 上行仍早，不能像已验证一样资本化。
        - 展示新垂直的商业合同、真实里程碑和已实现经济性。
    notes: 这张表把公司质量和给定价格下是否可投拆开。
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV009
      - CV030
      - CV031
      - CV040
  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 发射控制份额转化为高黏性星座运营，发射节奏保持健康，相邻高价值服务成熟。
        - 如果披露显著改善，可支撑估值进入约 80-120 亿元区间。
        - 执行滑坡、监管收紧，或期权价值始终无法变现。
        - 有可能，但证据还没支撑到位。
      - - 基准
        - 公司仍具战略相关性，也有真实商业业务，但短期内经审计经济性仍有限。
        - 承销应锚定较低公开标记附近、折扣后的 50-70 亿元区间。
        - 集中度和披露仍压制价格支撑。
        - 目前最站得住脚。
      - - 悲观
        - IPO 或融资材料揭示利润率、利用率或集中度偏弱；市场环境也变得更不宽容。
        - 价值压缩至 20-40 亿元的重置 / 降估值融资区间。
        - 股权结构拖累和重资产经济性会放大下行。
        - 不容忽视。
      - - 放弃 / 禁入价格区
        - 融资轮按最高公开独角兽叙事定价，却没有硬经济性。
        - 即使公司仍有战略重要性，风险回报也变得没有吸引力。
        - 新钱是在为期权价值买单，但价格已经假设它被证明。
        - 没有新披露就回避。
    notes: 区间是作者为承销纪律做的估算，不代表市场出清真实价格。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV036
      - CV041
      - CV042
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 2026 年 7 月市场信号
      - 相关性
      - 局限性
    rows:
      - - Planet Labs
        - 市值约 $8.05-$8.23B；EV/收入约 23.81x；收入（ttm）约 $335.61M。
        - 对地理空间 / 卫星数据平台的估值容忍度有参考价值。
        - 公开披露更好，数据平台敞口也多于 Yuxing。
      - - Spire Global
        - 市值约 $0.44-$0.45B；EV/收入约 6.51x；收入（ttm）约 $63.51M。
        - 可作为多元航天数据和分析平台的小盘标杆。
        - 业务组合、规模和公开市场历史都不同于 Yuxing。
      - - AST SpaceMobile
        - 市值约 $18.9-$24.0B；EV/收入高于 222x；收入（ttm）约 $84.94M。
        - 可作为卫星连接期权价值定价样本。
        - 叙事、客户和监管语境都不能与 Yuxing 直接比较。
      - - Iridium
        - 市值约 $4.96-$5.01B；EV/收入约 7.60x；收入（ttm）约 $875.84M。
        - 成熟卫星通信基础设施标杆，具备经常性收入。
        - 网络成熟度和披露基础远高于 Yuxing。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows are illustrative public anchors chosen to span earth observation, space data, strategic connectivity, and
        mature satcom infrastructure rather than an exhaustive global peer set.
    notes: 可比信号用于给估值划边界，不用于论证倍数可以直接迁移。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
  - id: TV005
    title: 论点破裂与终止触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 经济性披露偏弱
        - IPO 或融资材料显示利润率差、利用率弱或经常性收入占比有限。
        - 打破规模正在转化为持久价值的假设。
        - 下调估值区间，或退出。
      - - 运营事故
        - 重大测控 / 发射支持 / 在轨故障公开。
        - 损害任务关键型信任，也削弱客户扩张意愿。
        - 暂停尽调，重新评估客户风险溢价。
      - - 监管 / 许可意外
        - 关键服务线所需审批比预期更难拿，或更依赖合作伙伴。
        - 削减可服务收入，并抬高执行摩擦。
        - 继续推进前，先要求许可地图。
      - - 客户 / 生态集中
        - 锚定发射或星座项目将工作内部化，或转向替代方案。
        - 降低利用率，并压缩定价权。
        - 用更低增长和更低利润率假设重切基准情景。
      - - 无证明的激进定价
        - 重大尽调缺口仍未关闭，新一轮却按顶格公开叙事定价。
        - 好公司也会变成糟糕入场点。
        - 放弃，或坚持更强结构 / 条款。
    notes: 这些是应该改变投资姿态的可监控事件，不是抽象担忧。
    claimRefs:
      - CV023
      - CV032
      - CV033
      - CV034
      - CV037
  - id: TV006
    title: 最终尽调资料要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 管理账
        - 按季度和服务线拆分的收入、毛利率、EBITDA、现金、债务和现金消耗。
        - 把热度转化为可承销的经济性。
        - 索取 CFO 包 / 董事会材料。
      - - 利用率和队列数据
        - 地面站利用率、续约率、发射到运营转化率和 SLA 表现。
        - 看清基础设施是在复利还是只是在扩张。
        - 索取运营看板和队列分析。
      - - 客户集中度
        - 头部客户、合同期限、平均合同金额和在手订单。
        - 判断收入韧性是分散还是脆弱。
        - 索取销售漏斗和头部客户摘要。
      - - 许可 / 合规地图
        - 按服务拆分的许可、合作伙伴依赖、海外站点审批和任何监管沟通。
        - 监管可以封顶收入，也会拖慢执行。
        - 索取法务 / 合规备忘录。
      - - 事故历史
        - 任务失败、险情、退款、SLA 违约和保险 / 责任概况。
        - 任务关键型基础设施里，可靠性就是产品。
        - 索取风险委员会 / QA 日志。
      - - 股权结构 / 优先权层级
        - 当前股权、清算优先权、反稀释条款和近期融资轮权利。
        - 决定名义估值对新钱和普通股意味着什么。
        - 索取完整股权结构表和条款清单。
    notes: 这些是从继续研究走向可投资决策所需的最低材料。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV035
      - CV036
