chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing 更像是中国商业航天建设背后的在轨基础设施层，而不是传统卫星主制造商或发射公司。官方材料使用 航天驭星 和 Emposat 作为品牌，披露公司成立于 2016
              年，总部位于北京海淀区。公司使命说得很直白：建设地面、软件和运营系统，让卫星发射后仍可控，从而让卫星更容易使用。落到业务上，就是发射段跟踪、遥测与指令（TT&C）、长期飞控支持、载荷数据接收、遥感定标、碰撞预警，以及配套数字应用。已抓取语料一致指向一家公司：它试图把空间运营中不光鲜但绕不开的「后端」变成收入。


              足迹本身也有战略意义。官方页面称，公司已建设 60 多套地面站和一处综合定标场，分支或运营节点覆盖北京、西安、郑州、中卫、七台河、精河、鹤壁、南太平洋、非洲和南美。合作伙伴材料还称，2023
              年二期网络设计目标是支撑 3,000 多颗卫星，但这一容量说法目前仍主要来自公司或合作伙伴。即便对最难佐证的规模口径打折，证据仍支持一个更窄但重要的结论：Aerospace Yuxing
              已经拼出真实的物理服务网络，而不只是软件层或咨询标签。


              这种定位也解释了为什么外部报道会把公司称为「空间物业管理」。数智趋势把类比讲得很明确：它把 Aerospace Yuxing 与全球地面站即服务专家相比，而不是与垂直一体化航天公司相比。官方产品 /
              服务分类也指向同一逻辑：公司销售地面系统、通信产品和运营软件，因为这些资产是大规模运营商业 TT&C 网络的前置条件。
