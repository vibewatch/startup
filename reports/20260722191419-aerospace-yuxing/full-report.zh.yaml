      - number: '7.2'
        title: 运营、技术和安全风险
        blocks:
          - type: paragraph
            body: >-
              Yuxing 最强的业务证据，也是它的核心运营风险：公司活跃在任务关键时刻，失败无法被藏起来。发射
              TT&C、首次捕获、多站中继、轨道控制和指令注入，都是错过一次过站、出现信号缺口、软件故障或硬件延误就可能立刻影响任务的工作流。官方服务页面描述了一个覆盖境内外站点、多个频段的全球网络。广度支撑护城河和客户价值，也让运营模型暴露在站点
              uptime、跨境物流、本地审批、RF 设备就绪、工控机可靠性、人员交接质量，以及多故障点日程同步之下。


              采购线索强化了重资产现实。2026 年关于天线罩、工控机、天线结构和厂房改造的招标公告显示，Yuxing
              仍在投入扩张或维护交付能力。这本身不是负面，但意味着供应链延迟、供应商质量问题、安装滑坡或产能利用不足都可能压缩利润率。Tencent 的 IPO
              辅导报道明确称，这是一个重资产、长周期业务，仍需持续投入站点、RF 系统、天线、基带设备和合规。


              最新技术分支又加了一层风险。多份 2026 年来源确认了有意义的机械臂和在轨服务进展，但 SpaceNews
              特别指出，加注是模拟的，尚未确认实际推进剂转移。因此，服务分支在战略上有吸引力，但技术和商业成熟度仍不足。投资人应把服务叙事视为有执行风险和标题风险的上行可选项，而不是已经去风险的运营线。
