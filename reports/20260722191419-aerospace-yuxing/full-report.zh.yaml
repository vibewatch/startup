      - number: '7.4'
        title: 财务、人员和执行风险及缓释
        blocks:
          - type: paragraph
            body: >-
              财务风险一部分可见，一部分被遮住。公开报道清楚表明，Yuxing 运营重资产、长周期模式，并持续投入网络和设备扩张。近期融资和 IPO
              辅导说明资本入口真实存在，但保留下来的材料仍缺少收入、毛利率、烧钱、债务、利用率、在手订单 和现金数据。外部人因此能看到公司需要资本，却还无法判断新增资本是在高效驱动增长，还是只是维持资产强度所必需。


              人员和执行风险也很重要。公司称核心团队来自传统航天系统单位，并有 300 多名员工，这令人安心，但也凸显其对稀缺任务运营、RF、轨道控制和软件人才的依赖。公司同时运营 TT&C
              服务、长期运营、定标、安全工作流、通信产品、软件平台和演示阶段的服务分支，还在准备进入公开市场。对一家详细内控尚未披露的私营公司来说，执行面太宽。与天线罩、工控机和产线改造相关的招标活动，也暗示子公司与站点之间需要协同，规模化过程中更容易产生运营拖累。


              缓释因素确实存在。服务目录覆盖多个相邻工作流，而不是押注单一产品；标准体系和 CNSA 新监管可能降低长期模糊性；近期融资和 IPO
              辅导也会拓宽资本选项。但这些缓释都不能替代核心尽调问题。投资人在给估值下结论前，仍需要真实牌照地图、经审计的单位经济、客户集中度数据、事故历史，以及最新服务叙事没有跑在底层运营基础前面的证据。
            claimRefs:
