  - id: TP005
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 缓释 / 尽调问题
    rows:
      - - 中国本地 TT&C 和任务支持深度
        - AWS、ATLAS 和 Leaf 持续把标准工作流抽象成 API 和托管工具
        - 中高
        - 云牵头的竞争者越来越多地销售自动化、自助调度和更容易的集成
        - 索取赢单 / 输单数据，证明国内监管适配何时压过云牵头采购的简单性。
      - - 安全、校准和在轨管理邻近能力
        - 一体化星座运营商规模起来后，可以把这些工作流留在内部
        - 高
        - Geespace 销售全栈，SpaceSail 已在海外推进主权端到端服务项目
        - 索取客户证据，证明星座成熟后第三方仍会外包这些功能。
      - - 已安装的国内基础设施
        - 对大型主权项目来说，自建这一现状选项仍然可信
        - 中
        - 建站昂贵又麻烦，但部分买方仍看重直接控制
        - 要求管理层提供站点利用率、续约率，以及外包胜过自建的案例。
      - - 任务保障声誉
        - KSAT 和 SSC 等全球标杆公开运营深度更长、披露的全球覆盖更广
        - 中高
        - KSAT 披露 280+ 副天线和 150+ 家 KSATlite 运营商；SSC 宣传其拥有全球最大网络之一
        - 索取 Yuxing 的独立正常运行时间、异常响应和 SLA 指标。
      - - 项目式方案广度
        - 即便能力栈很宽，定价不透明也可能掩盖糟糕经济性
        - 高
        - AWS 和 Leaf 公开的定价逻辑远多于 Yuxing
        - 索取样本合同、定价阶梯，以及按任务类型拆分的服务毛利率数据。
      - - 地面网络不可或缺性
        - 常久在线网状 / 中继概念可能降低对独立站点过境窗口的依赖
        - 中
        - Leaf 明确把 TreeNet 包装为能减少对有限地面过境窗口的依赖；AWS 数字孪生和自动化也在压缩传统工作流价值
        - 建模拆分 Yuxing 哪些收入流依赖过境窗口稀缺性，哪些依赖更深的任务服务专业能力。
    notes: 严重性反映未来 24–36 个月内，这些风险可能如何影响 Yuxing 保持差异化定价或战略相关性的能力。
