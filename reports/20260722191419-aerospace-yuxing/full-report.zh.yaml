      - number: '3.4'
        title: 护城河耐久性与反向案例
        blocks:
          - type: paragraph
            body: >-
              Yuxing 的护城河真实但有边界。证据支撑最强的差异点，是国内任务服务宽度、对频率协调和发射许可的明确支持、云平台不容易自然复制的在轨安全与定标服务，以及能支持中国发射和卫星项目的 60
              多座地面站网络。买方需要中国本地运营伙伴，而不是通用全球天线 API 时，这些优势最有价值。


              反向案例来自两端。上游，全球 GSaaS 龙头持续降低摩擦：AWS 把标准地面接入商品化为云公用设施，ATLAS 把许多站点变成一个集成界面，Leaf 则专门用 TreeNet
              降低对离散地面过境的依赖。下游，Geespace 和 SpaceSail 等一体化运营商可以自己拿下客户关系，打包终端和垂直应用，并借助电信运营商或政府直接合作，把 Yuxing
              本可销售的服务内部化。Geespace 的全栈产品线和 SpaceSail 的巴西 Telebras 动作很重要，因为它们说明竞争不是理论上的。


              底线是，Yuxing
