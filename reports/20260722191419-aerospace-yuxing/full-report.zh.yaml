  - id: TP004
    title: 分销 / 覆盖 / 信任对比
    columns:
      - 主体
      - 公开覆盖信号
      - 分销动作
      - 信任 / 监管姿态
      - 自建替代威胁
      - 含义
    rows:
      - - Aerospace Yuxing
        - 60+ 座地面站；累计服务 370+ 颗卫星和火箭
        - 把任务服务卖进中国商业航天和国家关联航天工作流
        - 国内任务支持、许可、安全和校准能力强
        - 中高
        - 买方需要中国本地、能承担主体责任的运营方，而不是通用云工具时，Yuxing 最合适。
      - - KSAT
        - 26 个地点部署 280+ 副天线；KSATlite 有 150+ 家运营商
        - 围绕任务保障和外包运营做企业直销
        - 国际任务信任度高；在中国的国内政治适配较弱
        - 中
        - Yuxing 的外包服务规模标杆就是 KSAT。
      - - SSC Space
        - 全球网络，加运营和工程服务
        - 跨机构和长周期航天任务积累的传统关系
        - 传统信任度高；保留来源集中，自助式现代工具的公开细节较少
        - 中
        - 更像既有巨头标杆，而不是快速迭代的软件颠覆者。
      - - AWS Ground Station
        - 10 个公开站点，加专用天线选项
        - 在 AWS 账户关系内自助式云上入门
        - 以 AWS 为核心的买方信任度强，但许可和地区政治仍然重要
        - 中低
        - 任务能标准化到云原生运营时，AWS Ground Station 竞争最猛。
      - - Leaf Space
        - 40+ 座站、每月 23k+ 次过境，并扩展 18 个站点
        - 面向新航天和星座运营商的 GSaaS 销售动作
        - 靠透明度、文档和运营商背书建立信任
        - 中低
        - Leaf Space 证明，小玩家也能靠清晰度和运营简单性赢单。
      - - ATLAS
        - 50+ 副天线、34+ 个地点，加南太平洋扩张
        - 通过一个集成界面销售联合网络
        - 安全牵头、偏国防友好的美国姿态
        - 中低
        - ATLAS 抬高了市场对 API 驱动编排和 LEOP 支持的预期。
      - - Geespace / SpaceSail
        - Geespace 有 64 星运营证明；SpaceSail 有公共部门扩张证明
        - 捆绑电信、政府和垂直伙伴关系
        - 在中国关联的主权项目里政治适配度高；服务信任绑定自身星座
        - 低
        - 一体化运营商一旦控制客户关系，就能绕开第三方运营商。
      - - 自建
        - 项目自有站点、人员和许可证
        - 采购牵头的资本开支项目
        - 主权控制最大，但执行负担重
        - None
        - 对高度定制或安全敏感任务来说，自建仍是天然现状选项。
    notes: 这张表比较的是分销和信任姿态，而不是纯技术能力，因为很多卫星服务采购先看审批、安全和工作流适配，再看单位价格。
