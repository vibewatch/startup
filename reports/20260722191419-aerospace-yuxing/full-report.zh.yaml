  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和披露风险
        blocks:
          - type: paragraph
            body: >-
              Yuxing
              所在的栈里，监管不是背景音，而是产品本身的一部分。公司自我介绍称可支持卫星频率协调和发射许可申请，这意味着客户交付依赖牌照、审批和面向监管的流程工作。随着中国把商业航天规则体系正式化，这一点会更重要。2025
              年末至 2026 年，CNSA 设立专门的商业航天部门，发布商业航天标准体系，规划治理、研发、发射与 TT&C、应用和设施等领域 1,000 多项标准，并强调 2025-2027
              年高质量安全发展行动计划。这些举措有利于行业成形，但也提高了一个概率：在公司完全具备公开市场条件之前，合规负担、审批周期、文档要求和可审计性要求会先上升。


              数据和网络安全层同样重要。《数据安全法》适用于中国境内数据处理活动；如果损害中国利益，部分境外行为也会被纳入。法律建立了重要数据、核心数据、国家安全审查和出口管制逻辑。对一家通过分布式地面网络处理遥测、轨道、载荷，甚至遥感数据的公司来说，这些都直接相关。《个人信息保护法》和修订后的《网络安全法》又给网络和信息处理加上单独义务。即便
              Yuxing 不是消费互联网公司，任何云软件、运营者账号系统、站控系统或客户支持数据流，也仍在这套法律边界内。


              最后是披露风险。Yuxing 已有 IPO
              辅导动向，但付费任务、融资总额和估值标尺等公开事实在不同来源之间仍不一致。这很关键，因为资本密集型基础设施公司一旦接受监管机构、承销商和机构投资人的逐项检验，就没有多少空间去容忍粗糙的口径调节。
