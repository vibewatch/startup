      - number: '1.5'
        title: 里程碑、在轨服务扩张与反向视角
        blocks:
          - type: paragraph
            body: >-
              里程碑时间线显示，公司正在从测控基础设施向更高价值的在轨服务野心扩展。第三方历史资料把最早关键标记放在 2017 年和 2018 年：Aerospace Yuxing 建成中国首个第三方商业 TT&C
              站，取得首张商业 TT&C 无线电台执照，并建立指挥中心。到 2020 年，公司围绕中卫遥感定标场运营，从指挥与控制延伸到数据质量基础设施。2025 年武汉分公司又围绕轨道运营机器人，形成在轨服务研发足迹。


              最近最重要的里程碑是驭星三号 06 星。Global Times 和人民日报称，该卫星于 2026-03-16 发射，是中国首颗搭载柔性机械臂的商业试验卫星，并验证了模拟加注和对接操作。Global Times
              补充称，该项目属于子公司 Sustain Space 主导的任务系列；人民日报则把目标终局表述为用于维护、加注和在轨服务的「太空 4S 店」。战略意义在于，它把 Aerospace Yuxing
              从监测与控制叙事扩展到寿命延长、服务和碎片缓解叙事。公司试图从让卫星活着，走向主动操作并维持卫星。


              反向视角不是丑闻，而是承销模糊。界面称该行业重资产、资金密集；数智趋势称，投资人仍需要收入结构、客户集中度、利用率和现金流披露。这些警示与本章观察到的缺口相吻合。Aerospace Yuxing
              显然有真实基础设施和任务深度。尚未解决的问题，是这些深度有多少能转化为可重复、高质量的经济性，而不是项目驱动的服务收入。
