      - number: '2.4'
        title: 增长驱动、采用约束与对 Yuxing 的含义
        blocks:
          - type: paragraph
            body: >-
              需求驱动强，而且看得见。2026 年，中国把卫星互联网提升到产业议程中，批准专项标准化推进，继续快速发射星座，并持续强化 6G 与韧性叙事。人民日报和新华社报道把低轨网络视为智能手机直连和 6G
              一体化的核心支撑。腾讯产业排名显示上游产能正在形成：58 家卫星工厂，规划产能超过每年 6,800 颗卫星。36Kr 则把市场直接连到 Yuxing 的切入点，称 GW 和 G60 加速推高了
              TT&C、数据接收和网关基础设施需求。所有这些都利好销售控制与运营层的公司。


              约束同样实质。GSMA 警告，D2D 无法在高密度地区复制地面容量。Deloitte 指出，终端可负担性和网关建设是现实瓶颈。ITU 规则意味着申报仍要转化为协调、发射和运营。MERICS
              补充称，可重复使用火箭和部署瓶颈仍然真实存在；SatNews 的解读最严厉，把 244,000 个轨道 /
              频率坑位的申报潮称为监管圈地，而不是现实的短期部署计划。这些约束不会杀死市场，而是定义真实市场在哪里。即便最宽泛的纸面野心无法完全兑现，一个低密度、任务关键、运营商合作的市场仍可能大到足以显著影响 Yuxing。


              含义是，Yuxing 同时杠杆于上行与摩擦。更多发射、更多星座和更多标准化，会创造更多核心服务需求。但如果申报野心跑在发射节奏前面，如果运营商无法经济地激活终端，或星座在达到稳定服务前停滞，那么理论 TAM
              的一部分永远不会转化为经常性基础设施收入。因此，市场案例应沿着部署和运营顺序承销，而不是沿着最大的星座标题承销。
