        title: 部署、可靠性、支持和路线图
        blocks:
          - type: paragraph
            body: >-
              公开部署证据最强的有三块。第一是成熟地面运营：公司称其软件经过多年任务实践，能快速接入不同卫星和地面设备。第二是中卫遥感定标场，看起来是一项真实固定资产，并披露了量化子系统和性能阈值。第三是 2026 年
              Yuxing-3 06 / Xiyuan-0 机械臂任务，它给公司提供了具体的空间服务技术演示，而不是停在路演材料里的愿景。


              机械臂证据有实质内容，但要谨慎解读。多篇 2026 年报道一致称，Yuxing-3 06 完成了四类关键测试模式：自主模拟加注、人在环遥操作、视觉伺服对接和力控操作。独立报道还提到一项增阻离轨实验，以及借助
              Yuxing 地面基础设施做低时延人在环服务的计划。但同一批报道也明确说，加注是模拟的，尚未确认实际推进剂转移。因此，该技术仍处在演示和验证阶段，还没有进入规模化商业服务。


              路线图证据因此不对称。地面软件和站网栈看起来已经迭代并部署。定标资产看起来已投入运营。在轨服务分支有前景，也有差异化，但公开资料还没看到已签约的商业路线图、重复任务管线，或从演示走向收入的时间表。诚实的产品判断必须把这些阶段分开。
