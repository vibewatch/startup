  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing 的产品定义不止一个卫星地面站产品。官方材料呈现的是一套分层栈：地面系统、通信系统、软件系统、全生命周期 TT&C 服务、长期在轨管理、安全与碰撞服务，以及面向光学、SAR
              和激光测高任务的商业定标场。放到客户工作流里，公司想从发射支持到日常运行拿下任务控制层，并把部分硬件和软件产品嵌进这条流程。


              硬件侧包括一体化 TT&C 基带、高速数据接收基带、X 频段转发器和多频段地面站资产。在中国民营空间基础设施公司中，Yuxing
              对软件披露得少见地细：自有页面列出定轨、姿态控制、任务规划、遥测处理、遥控管理、地面站控制、3D 可视化和数字孪生系统。服务侧再把这些模块包成客户结果，包括发射支持、星座管理、定标和空间安全运营。


              这套分层结构重要，因为它解释了公司的差异化，也解释了复杂度。Yuxing
              不是只卖一个站或一套软件控制台，而是在打包一套运营架构。粘性因此更强，模块成熟度也会拉开差距。传统任务运营栈的产品化和外场验证，明显强于最新的在轨服务分支。
