      - number: '1.3'
        title: 平台深度、产品栈与服务架构
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing
              的商业价值来自服务与自有基础设施的组合。官方服务页显示，公司业务横跨发射测控、入轨早期支持、长期星座管理、碰撞预警、健康管理、遥感定标和任务规划。产品页又补上三层支撑：地面站系统、通信 /
              基带硬件和任务软件。这种一体化架构很重要，因为它让公司既能销售持续运营服务，也能销售使能设备，同时在不同站点和任务之间守住更强兼容性。36Kr 还补充了一个有用的经济性视角：关键产品自研比例超过
              90%，并已向星座客户批量交付。


              在一家中国私营空间基础设施公司里，这种技术宽度相当具体。地面系统页披露了 12 米 X 波段和 4.5 米 S/X/Ka 系统的性能细节，包括 EIRP、G/T、捕获时间、跟踪精度、数据记录速率和 7x24
              自动化运行。通信产品页列出一体化测控基带、高速数传基带、X 波段应答机，以及测控 / 数传一体化单元。软件页描述任务规划、遥测处理、指令管理、3D
              可视化和数字孪生式功能。这不是单纯撮合站点时段的公司，而是在试图占住卫星制造商与终端用户之间的运营中间层。


              这种架构也解释了为什么第三方来源称，公司已经服务国家航天单位、商业发射服务商、卫星公司、高校和科研院所。无法自建全球 TT&C 足迹的客户，仍然需要合规的指令、遥测和数据回传覆盖。因此，Aerospace
              Yuxing 参与的是商业航天栈中结构性必需的一层；它的服务深度看起来比单点地面站供应商更宽，但仍窄于完全垂直一体化的卫星运营商。
