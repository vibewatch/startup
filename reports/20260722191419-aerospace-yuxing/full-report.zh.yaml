      - number: '6.2'
        title: 具名部署和生产级证据
        blocks:
          - type: paragraph
            body: >-
              最重要的客户证据不是客户标识墙，而是一小组具名任务；这些任务显然需要生产级运营支持。Yuxing 在官网称，它从 Galactic Energy Ceres-1 系列首飞 Y1 到 Y9 提供了全流程 TT&C
              服务。对基础设施提供商来说，这是一条少见的强重复使用证据，因为它跨越多年、多次任务，而不是单个营销案例。另一些 Galactic Energy 发射页面显示，该火箭家族本身在 2025 年继续扩张；2026 年
              China Daily 和 Global Times 报道也显示 Ceres-1 仍在规律发射。


              第二个清晰证据点是 PIESAT 的 Nuwa 星座。Yuxing 自有网站称，它在 2023 年 3 月 Nuwa 首批四星发射中担任 TT&C 总体单位，并与 Xi'an Huanyu、Guoke Hualu
              协作，保障高速率数据接收。PIESAT 自有网站和多篇 Xinhua 转发报道确认，首批 PIESAT-1 是面向商业数据服务的四星商业遥感编队；公司后来在 2024 年底又用第二批四星扩展了星座。


              第三个具名案例是 Beijing-3C。Yuxing 称，它为 2024 年 5 月发射的四颗卫星全部提供 TT&C，并使用中卫、勐腊、三亚和东南亚站点接收遥测、注入指令。政府、People's Daily 和
              SpaceNews 的报道独立确认了这次四星发射，并将客户侧运营方识别为 21AT。合起来看，这些案例证明 Yuxing 不只是卖组件；在一旦失败就会暴露且代价高昂的实况发射和在轨工作流中，客户愿意信任它。
