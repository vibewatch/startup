      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本故事远比损益表更可见。多家 2026 年 6 月来源显示，Yuxing 在一轮私人融资激增后，由国泰海通辅导进入 IPO 准备。最干净的共同事实是，公司于 2026-05-28 签署辅导协议，并于
              2026-06-05 完成辅导备案。除此之外，公开数字开始分叉。一篇 2026 年 6 月腾讯文章称累计融资超过 20 亿元人民币，并把公司放在 60 亿至 70 亿元人民币独角兽区间。另一篇腾讯 / IPO
              文章称累计融资超过 10 亿元人民币。新浪和腾讯对 6 月 D / D+ / D++ 序列的报道称，最新融资包本身接近 20 亿元人民币；网易则称 D+ 阶段把公司推入 100 亿元人民币独角兽区间。


              正确解读不是某一个来源一定为真、其他一定为假，而是 Yuxing
              明确处在后期阶段，同时公开口径仍不一致。方向毫不含糊：公司具备足够规模、投资人支持和被市场感知的战略价值，足以推进公开市场准备。精确总额、当前估值，以及资产负债表可用资本，在没有一手文件前仍未解决。


              关于充足性，仍可给出结构性判断。Yuxing 面向一个需要基础设施、合规和工程纵深的业务销售。它自己的网络野心、产品开发和国际站点足迹都意味着持续现金需求。IPO
              辅导因此不像可选品牌动作，更像一家试图为基础设施扩张和技术开发融资、又不想永远依赖私人轮次的公司所走的合理步骤。但由于没有公开现金、烧钱、债务或 runway 数字，资本充足性只能是战略推断，不是审计结论。
