      - number: '3.2'
        title: 能力、架构与信任 / 监管姿态
        blocks:
          - type: paragraph
            body: >-
              能力宽度最能拉开竞争者差距。Yuxing 的栈偏重任务运营：入轨早期和长期 TT&C、在轨管理、碰撞与安全服务、定标，以及横跨 S/X/Ka 波段的地面设备。KSAT 和 SSC
              在任务保障上重合最直接，但它们依托全球分布式网络和成熟外包服务定位。AWS 的重合方式不同：它把常见卫星工作流标准化为云托管服务，支持公开 S 波段和 X 波段工作流，披露站点位置，提供控制台和 API
              控制，并在公开站点不足时提供专用天线。Leaf 和 ATLAS 更明确地面向新航天运营商，强调自动排程、单次集成接入和联合网络，降低多站点运营的集成负担。


              各家的信任与监管姿态并不对称。Yuxing 的国内优势在于，它明确支持中国运营环境下的频率协调、发射许可申请、在轨安全管理和定标。这让它在结构上比西方地面网络更贴近国家项目或国内商业航天工作流。相反，AWS 和
              ATLAS 强调安全 API、数字孪生、24/7 运营和政府级工作流，对已经处在美国阵营云与防务生态中的买家更有吸引力。Geespace
              又给出另一种信任姿态：它把自己的星座、芯片、模块、天线、终端和垂直解决方案捆在一起，客户可以买一体化服务，而不是把多个供应商拼起来。


              实际结果是，买方重视中国本地执行、长寿命任务支持以及相邻安全 / 定标能力时，Yuxing 最强；买方想要最透明披露的全球足迹、即插即用 API
              或打包下游连接产品时，它较弱。这个差异重要，因为很多采购决定在任务团队比较原始天线规格前，就已经由信任、工作流兼容性和牌照适配决定。
