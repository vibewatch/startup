companyProfile:
  summary: >-
    Aerospace Yuxing 对外品牌为 Emposat 和 航天驭星，是一家 2016
    年成立、总部位于北京的商业空间基础设施公司。公开证据显示，它的任务关键型服务栈很宽，覆盖发射与入轨早期测控（TT&C）、长期航天器运营、安全管理、遥感定标，以及相邻的地面 / 软件 /
    通信产品。公司在中国商业航天建设中占位较好：60 多座地面站网络、数百次付费任务、具名客户验证，并在 2026 年进入 IPO
    辅导。核心问题不是业务是否真实，而是在缺少经审计经济性、客户集中度、牌照细节和股权结构可见度时，当前价格能否被承销。
