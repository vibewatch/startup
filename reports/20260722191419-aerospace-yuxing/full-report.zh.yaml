  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流与实际变现内容
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing
              既不是纯软件公司，也不是纯硬件公司，所以公开收入模型只能从它披露的服务栈反推。官方页面显示，至少有四类可变现项目：发射和入轨早期测控支持、长期在轨管理、遥感定标和载荷数据服务，以及地面系统或通信设备等产品销售。这个组合重要，因为它意味着收入确认节奏不同。入轨早期和发射支持按事件驱动。长期航天器运营可能具备经常性，但仍然与任务绑定且运营强度高。定标和安全服务看起来专业化且潜在价值更高，但公开定价缺失。设备和软件产品销售可能放大客单价，也可能把公司拉向利润率更低的项目经济性。


              最强公开牵引信号方向积极，但口径杂乱。官方简介称，公司已服务 370 多颗卫星和火箭。一篇 2026 年 6 月腾讯 / IPO 文章称数量为 674 颗付费卫星和火箭。界面报道，公司已为 500
              多颗卫星和火箭提供付费服务，且服务量连续四年翻倍。这些数字都指向同一方向——Yuxing 不是未收入公司——但在缺少客户结构、合同金额和持续期的情况下，它们不能直接换算成收入。


              实际结论是，Yuxing 很可能变现的是一组任务关键型服务，加上选择性产品收入。这比依赖一条很薄的服务线更好，但也意味着 ARR 倍数思维或简单席位定价这类经典 SaaS
              捷径并不适用。正确框架应是服务结构、利用率，以及卫星离开发射阶段后仍会续约的收入占比。
