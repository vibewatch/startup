  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 主体
      - 公开合同模式
      - 公开价格 / 单位信号
      - 包含能力
      - 未知项
      - 含义
    rows:
      - - Aerospace Yuxing
        - 从官方服务栈推断为项目和服务打包
        - 保留来源集没有公开价目表
        - TT&C、在轨管理、安全、校准和设备
        - 实际定价、合同期限、折扣和利用率未公开
        - 商业质量比能力叙事更难对标。
      - - AWS Ground Station
        - 按需或预留的天线分钟数调度
        - 只按天线时间付费；预留折扣需要 12 个月月度承诺
        - 托管天线、调度、API、向 AWS 交付数据、数字孪生、专用天线选项
        - 实际预留折扣和大客户让利未公开
        - 该组里最透明的公用事业式竞争者。
      - - Leaf Space
        - GSaaS，按使用付费 / 无承诺姿态
        - 保留页面没有精确的每分钟价目表，但公司称只为实际使用付费
        - TT&C、载荷交付、自动化调度、部署规划、全球网络接入
        - 精确分层和企业折扣结构未公开
        - 买方想要灵活外包运营、又不愿投入重资本开支时，Leaf Space 是强挑战者。
      - - KSAT
        - 托管外包网络和任务服务
        - 保留来源集没有公开价格表
        - 全球地面网络、TT&C、LEOP、托管基础设施、月球网络、卫星运营
        - 实际定价和 KSATlite 套餐层级未公开
        - KSAT 拼的是服务深度，不是价格透明度。
      - - ATLAS
        - 通过 Freedom 平台提供联合式 GSaaS
        - 保留来源集没有公开价目表
        - 单一 API、联合网络接入、LEOP 支持、分析、安全工作流
        - 客户定价、合同最低额和合作站点经济性未公开
        - ATLAS 赢在集成抽象，而不是标价简单。
      - - Geespace / SpaceSail
        - 捆绑连接和方案项目
        - 保留来源集没有公开的每分钟或每合同定价
        - 星座服务，加上硬件、终端以及垂直或主权服务项目
        - 单位经济性、补贴强度和伙伴收入分成未公开
        - 一体化运营商能把全栈打包，从而压低独立基础设施供应商的价格。
      - - 自建
        - 资本项目加持续运营支出
        - S/X 频段地面站约 €400k-€500k，另有约 €7k 月维护费
        - 完整资产控制、专用工作流、本地人员和自有合规路径
        - 真实总成本取决于许可证、站址、人员配置和网络冗余
        - 对有规模的主权或安全敏感项目来说，现状选项仍然可信。
    notes: 这是打包方式对比，不是标准化价格表。保留来源集能支持的最强结论是透明度差异：云牵头的 GSaaS 玩家公开了远多于 Yuxing 或中国一体化运营商的定价逻辑。
