      - number: '5.2'
        title: 架构、运营模式和客户工作流
        blocks:
          - type: paragraph
            body: >-
              保留下来的材料中，官方软件页面对架构披露最清楚。Yuxing 称控制平台采用浏览器 / 服务器架构，前端用 Vue，后端用 Java，以微服务、云服务器、云存储和 Kubernetes
              容器化运行，并支持高可用、弹性扩展、负载均衡和备份。按功能拆，栈内包括管理层、任务规划、遥测处理、遥控管理、轨道管理、地面站管理、数据中继、可视化和站网数字孪生系统。这更像现代 Web
              运营架构，而不是纯本地控制台。


              工作流含义很直接。轨道数据和任务规则进入任务规划，再驱动遥测、遥控和站控。地面站管理负责自动化和设备接入。数据中继在地面站、软件和用户之间搬运流量。可视化和数字孪生提供态势感知。安全与离轨服务横跨整套栈，使用每日碰撞计算、健康预测和控制逻辑。Yuxing
              能同时卖任务支持服务和产品模块，实际原因就在这里：产品本质上是更大运营闭环里的部件。


              客户使用场景也更偏运营，而不是面向消费者。运营方找
              Yuxing，是为了发射支持、卫星控制、载荷数据落地、定标，以及安全或寿命末期服务。技术的价值体现在减少人工操作、缩短响应时间，或跑通复杂轨道控制、近实时人在环操作等能力。这个客户工作流视角，也把传统栈和新的在轨服务分支连了起来。
