      - number: '2.3'
        title: 买方分群、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              Yuxing
              可服务市场里，最早可信买家是机构客户，而不是大众零售。国家星座运营方及其制造伙伴位于核心位置，因为它们承担部署负担，需要从发射到稳定运营都合规的测量、控制和地面网络支持。电信运营商是直连设备场景中的第二大预算所有者：GSMA
              明确指出，D2D 最适合作为运营商控制频谱安排下的补充覆盖层，而不是绕开运营商的独立零售渠道。这意味着移动运营商通常控制客户关系和持牌频谱，卫星与基础设施一侧则提供非地面容量、网关和运营支持。


              第三类买方是韧性或移动性要求很高的垂直行业。工信部和 GSMA
              都指向海洋、山区、沙漠、航空、科学考察和灾害响应等场景：地面网络缺失、受损或延伸成本太高时，卫星链路价值最清楚。这些细分场景采购往往更集中，对基础设施主导方案的接受度也更高。它们更需要可靠监测、控制和激活，而不是消费者营销声量，这与
              Yuxing 当前产品与服务栈相当匹配。


              采用路径也偏向基础设施专家。价值释放要等监管申报、标准对齐、卫星建设、发射执行、入轨早期管理，以及运营商集成或任务激活逐步完成。每一步都会给地面和运营玩家创造机会。这也解释了为什么 Yuxing
              的机会随发射节奏和星座复杂度放大，而不是随消费者宽带市场的原始规模放大。星座如果不能被可靠控制、协调并投入运营服务，就无法向终端用户或政府任务收费。
