  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分和购买中心
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing 面向的不是一个单一客户池。官方服务页面至少显示四类不同客户任务：需要发射阶段 TT&C
              覆盖的发射服务商；需要入轨初期和日常在轨管理的卫星运营商；需要载荷数据接收和定标的遥感运营商；以及需要安全、碰撞预警、轨道控制或寿命末期支持的运营方。实际使用者可能是任务运营团队，买方则可能是发射商、卫星所有者、星座项目或有关联的政府背景运营方。因此，真正的销售界面围绕工作流，而不是围绕产品。


              公开记录还显示，Yuxing 通常从任务中最早且运营最关键的节点切入：发射和首次捕获。官方材料强调，国内外站点提供全程发射 TT&C
              覆盖，入轨初期多站中继，并在分离后立即注入指令。这个支点一旦建立，公司就能扩展到日常过站、轨道控制、载荷下行、定标和安全服务。这是一条合理的基础设施先落地再扩张路径，因为发射或入轨初期的第一次运营失败，对客户的代价远高于后续工作流摩擦。


              不透明的是这些任务背后的真实付款方组合。保留下来的来源证明了具名商业关系和重复发射支持，但没有披露发射商、星座运营商、政府关联任务、海外客户或一次性工程项目之间的比例。投资人因此应把本章读作真实采用的证据，而不是多元化经常性收入的证据。
