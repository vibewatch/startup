  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing 的可服务市场不是「所有商业航天」，也不只是公开卫星互联网标题常强调的终端零售宽带市场。工信部 2026
              年解读是已抓取材料中最干净的边界文件：它把卫星互联网描述为空天地一体化基础设施，用来解决覆盖缺口、韧性需求和战略自主目标，价值链覆盖卫星制造、发射、地面设备、用户终端和运营服务。这个定义很重要，因为
              Aerospace Yuxing 变现的是中游和下游基础设施层——TT&C、地面站、数据接收、定标和长期轨道运营，而不是完整消费者服务栈。


              因此，纳入支出覆盖三类。第一类是主权和准主权星座基础设施：国网、千帆及相邻国家或省级项目需要备案支持、发射支持、入轨早期控制和持续网络运营。第二类是运营商主导的连接扩展，尤其是直连设备和远程覆盖；即便零售界面属于电信运营商，网关、监管合规和持续监测仍是刚需。第三类是任务关键型移动和韧性需求——海事、航空、应急响应、科学考察和偏远工业场景——卫星链路的胜出点不是在城市里打败光纤，而是在地面网络失效的地方仍能工作。


              最贴近公司变现的市场之外，边界同样重要。标准城市宽带订阅、通用发射收入和宽泛航天器制造收入都在相邻位置，但并不等同于 Yuxing
              的实际变现层。因此，一个关于数十亿美元卫星互联网市场的标题判断可以方向正确，却仍然无法说明 TT&C 和地面基础设施专家的可服务机会；分析必须先拆出价值链里真正需要 Yuxing 这类运营商的部分。
