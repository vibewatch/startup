      - number: '8.4'
        title: 情景分析和价格失效点
        blocks:
          - type: paragraph
            body: >-
              估值问题最好用情景回答。牛市情景下，Yuxing
              把已验证的发射控制足迹转化为有粘性的多年星座运营，守住监管位置，保持健康商业发射节奏，并证明服务或更高价值集成产品等新能力不只是叙事。这条路径可以支撑估值向公开独角兽说法的顶部靠近，甚至超过该水平，因为投资人需要相信的不只是战略相关性，还包括更强的经常性收入结构。基准情景下，公司依然真实且具战略相关性，但披露仍薄；最合理的投资判断区间仍靠近公开的较低
              60-70 亿元标尺，投资人为已安装位置付费，同时要求缺失经济性的折扣。


              熊市情景不是公司消失，而是公开市场准备或新一轮融资暴露出弱于预期的单位经济、客户集中度或基础设施利用率，同时发射节奏、监管或资本市场变得不那么宽容。在这种情形下，合理估值框架会迅速落入 20-40
              亿元区间，尤其当股权结构表或优先权结构对新资金或普通股回报不友好时。现实含义很直接：价格会先于证据失效。Yuxing 可以仍是战略上有意义的公司，但在错误价格上仍是糟糕投资。
