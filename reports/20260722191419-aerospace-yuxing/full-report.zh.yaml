      - number: '1.4'
        title: 资本历史、估值标记与 IPO 窗口
        blocks:
          - type: paragraph
            body: >-
              融资记录显示，公司早已越过早期风投阶段，但公开披露在精确估值上仍然杂乱。最近最清楚的资本事实，是 2025 年 8 月 C+ 轮和 2026 年 6 月 D 系列融资包。36Kr 报道，C+ 轮融资 4.30
              亿元人民币，投资方包括信达资本、工大创投、财通资本、汉江资本、长江资本、尼斯集团和济钢集团。新浪、腾讯、网易和 Baidu 英文公司页对下一步基本一致：2026 年 6 月完成 D、D+、D++ 轮合计近 20
              亿元人民币融资，投资方包括红杉中国、前海方舟、中国联通战略性新兴产业载体、紫金矿业、SAIC Motor、五粮液和多家财务投资人。


              记录变得不那么干净的地方在估值。新浪和网易称，公司在 D+ 阶段后进入 100 亿元人民币以上独角兽区间，这与用户提供的 15 亿美元方向性框架在常规汇率换算后大体一致。但界面把公司放在更温和的 60 亿至 70
              亿元人民币区间，同时仍称其为独角兽。没有一手备案文件或 term sheet，本章最稳妥的立场是：公司在 2026 年明确进入后期独角兽阶段，但当前精确估值尚未在公开媒体口径中对齐。


              IPO 准备更直接。界面称，公司于 2026-05-28 与国泰海通证券签署辅导协议，并于 2026-06-05 完成备案；Baidu 英文公司页重复了备案日期。这个时间序列叠加 2025-2026
              年的大额融资周期，显示公司正用私人资本延长基础设施领先，同时打开公开市场选项。公开文件仍未披露的内容同样关键：收入、经常性服务占比、利润率结构和现金生成仍然缺席。
