      - number: '5.4'
        title: 差异化、信任和质量控制
        blocks:
          - type: paragraph
            body: >-
              Yuxing 最能守住的技术差异化，不是某个奇特载荷，而是自研任务软件、多频段地面与通信产品、定标基础设施，以及安全 / 轨道控制服务的组合。36Kr 还给了一个重要的经济-技术线索：关键产品自研比例超过
              90%。这支撑了一个判断：Yuxing 在积累系统级能力，而不是只把第三方盒子集成到一起。与 Jingji Communication 完成的 4.2Gbps X
              频段测试也重要，因为它是一个具体证据，说明公司的地面资产能承载超高码率遥感下行。


              信任和质量控制可见，但不完整。官方页面提到权限与网关控制、数据备份、实时监控、碰撞风险计算，以及自动化或无人值守运行。定标场披露的测量精度少见地具体。机械臂报道也比许多中国商业航天演示给出更多运营细节。可是，公开材料缺少第三方
              可用性指标、正式认证或已发布的可靠性 SLA，外部投资人无法据此把这套栈和成熟全球运营商做基准比较。


              结论是，技术画像可信但不均衡。Yuxing
              最强的定位，是中国任务运营和基础设施平台，并叠加定标与安全能力。它在尝试在轨服务上确有创新。但最新分支还没被证明是一组商业产品，公开信任控制也更多是描述性披露，而非独立审计结果。
