  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景，以及公开定价不能证明什么
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing 显然值得单独写估值章，因为它不只是概念阶段的太空故事。公开材料和 2026 年报道显示，公司已进入后期，IPO
              辅导路径活跃，服务栈很宽，也有足够任务历史来吸引真正的机构关注。但同一份公开记录给不出一个干净价格。保留下来的 2026 年 6 月来源，对累计融资和当前标记都不一致：有的把公司放在约 60-70
              亿元估值区间，也有更激进报道把它写进 100 亿元级独角兽叙事。这不是小数点式的取整问题，而是纪律性投资人不能把最新融资标题当作经充分尽调的公允价值的核心原因。


              因此，融资背景应不对称地解读。正面信号是真实的：2026 年反复报道、IPO 辅导以及持续招聘 /
              采购，意味着公司仍在扩张而非收缩。负面信号也真实：公开披露仍没有收入、利润率、现金、债务、在手订单、利用率或客户集中度等经审计数据，付费任务和融资总额等标题指标也会因来源而异。估值上，2026 年 6
              月融资标题证明市场想要这个故事的敞口，并不证明当前价格已经合理。这个区别决定了本章后续方法：把公开价格标尺当锚，再对缺失经济性给出重折扣。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV020
              - CV023
              - CV035
              - CV038
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV003
              - CV020
              - CV021
              - CV022
              - CV036
      - number: '8.2'
        title: 为什么公司值得估值
        blocks:
          - type: paragraph
            body: >-
              面对披露很薄的私营公司，最容易犯的错误是直接跳到怀疑，反而错过实质。Yuxing 有足够公开证据避开这个陷阱。官方页面显示，公司不是在推一个狭窄点产品；它参与发射和入轨初期
              TT&C、长期在轨管理、安全管理、定标，以及相关硬件 / 软件产品。客户侧和独立报道又补充了 PIESAT、Beijing-3C / 21AT
              发射保障，以及更广泛商业发射支持的真实案例。这些证据重要，因为它说明估值争论应围绕入场纪律和尽调质量，而不是公司是否存在、是否有人付钱。


              同一批证据也塑造上行情景。一个已经嵌入发射、星座运营和安全工作流的空间基础设施提供商，随着中国商业航天扩张，合理地可能加深钱包份额。最强上行路径不是单个登月式项目，而是任务关键服务复合成更长期运营关系，再叠加相邻产品或在轨服务的选择性上行。可公开证据恰好在这里断掉。业务是真实的；业务持续性和盈利性，从外部看仍大多未被定价。投资人因此要同时记住两件事：Yuxing
              值得认真尽调，但还没赢得无折扣估值。
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV030
              - CV040
              - CV041
              - CV042
      - number: '8.3'
        title: 公开可比公司给出区间，不给单点估计
        blocks:
          - type: paragraph
            body: >-
              由于 Yuxing 不披露经审计运营指标，公开可比公司最好用作框架工具，而不是即插即用的倍数引擎。保留下来的 2026 年 7 月市场数据本身已经足够说明区间很宽。Planet Labs
              更偏数据平台型地球观测故事，市值约 $8.1-$8.2B，EV/revenue 约 23.8x。Spire 是规模更小的多产品空间数据平台，市值约 $0.44-$0.45B，EV/revenue 约
              6.5x。Iridium 是成熟经常性卫星通信基础设施基准，收入规模大得多，市值约 $5.0B，EV/revenue 7.6x。另一个极端是 AST
              SpaceMobile，市值达到数百亿美元，EV/revenue 超过 222x，显示战略叙事和可选性可以压过短期基本面。


              这些数字有用，恰恰因为它们不能直接迁移。Planet 和 Spire 更适合用来观察商业化纪律，以及公开市场对卫星 / 数据平台的容忍度。Iridium
              可用来判断披露更充分时，成熟经常性卫星通信能获得什么定价。ASTS 则提醒人们，空间板块有时会给梦想很高估值——但这种估值依赖完全不同的故事、客户基础和资本市场环境。对 Yuxing
              来说，启示是可比公司只能支撑宽区间。它们不能消除披露折扣，也不能靠类比证明应支付私人市场叙事的顶部价格。
