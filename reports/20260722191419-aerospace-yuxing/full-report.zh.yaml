          values:
            - 100
            - 0
            - 0
            - 0
    approximationNotes: 这个队列是可见度代理，而不是真正的留存图：100 表示该时间跨度有公开可见证明，0 表示没有公开披露。
    claimRefs:
      - CU012
      - CU024
      - CU027
      - CU028
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 风险最高的象限是数据 / 许可合规、任务交付可靠性、资本强度叠加披露不透明；较新的在轨服务风险也高，因为叙事可能跑在证据前面。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: 数据安全 / 许可合规
          values:
            - 高
            - 高
            - 中低
            - 高
        - label: 任务交付中断 / 可靠性
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 客户和发射节奏集中度
          values:
            - 中高
            - 高
            - 中低
            - 高
        - label: 资本强度 / 披露不透明
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 在轨服务分支技术 / 商业化缺口
          values:
            - 高
            - 中高
            - 低
            - 高
        - label: 人员与执行压力
          values:
            - 中高
            - 中高
            - 中
            - 中高
    approximationNotes: 单元格是基于公开证据质量和下行不对称性得出的定性排序，而不是精算概率。
    claimRefs:
      - CR001
      - CR008
      - CR016
      - CR019
      - CR024
      - CR026
      - CR033
      - CR039
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管变化、运营故障和资本强度冲击都会传导到收入质量、客户信任，最终压到估值和 IPO 准备度。
    data:
      nodes:
        - id: a1
          label: 数据 / 许可收紧
        - id: a2
          label: 地面网络或任务交付失败
        - id: a3
          label: 重资本开支 + 经济性不透明
        - id: a4
          label: 在轨服务叙事跑赢证据
        - id: a5
          label: 客户信任和中标率走弱
        - id: a6
          label: 利用率 / 利润率 / 现金转化走弱
        - id: a7
          label: IPO 可信度和估值压缩
      edges:
        - from: a1
          to: a5
        - from: a1
          to: a7
        - from: a2
          to: a5
        - from: a2
          to: a6
        - from: a3
          to: a6
        - from: a3
          to: a7
        - from: a4
          to: a7
        - from: a5
          to: a6
        - from: a6
          to: a7
    approximationNotes: 该 DAG 突出公开证据中可见的主要因果通道，而不是每一个二阶相互作用。
    claimRefs:
      - CR010
      - CR019
      - CR021
      - CR024
      - CR030
      - CR038
      - CR039
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Yuxing 同时依赖监管方、站点和设备供应、发射节奏、运营商需求、伙伴网络和资本市场；任何一层失效，都可能传导到利用率和估值。
    data:
      nodes:
        - id: d1
          label: CNSA / MIIT / CSRC / 数据监管机构
        - id: d2
          label: 地面站站址、RF 硬件、工控机
        - id: d3
          label: 民营发射客户和节奏
        - id: d4
          label: EO 运营商客户（PIESAT、21AT 等）
        - id: d5
          label: 伙伴交付网络和海外准入
        - id: d6
          label: 资本市场 / 融资路径
        - id: d7
          label: Aerospace Yuxing 核心服务平台
        - id: d8
          label: 收入质量、利用率和估值
      edges:
        - from: d1
          to: d7
        - from: d2
          to: d7
        - from: d3
          to: d7
        - from: d4
          to: d7
        - from: d5
          to: d7
        - from: d6
          to: d7
        - from: d7
          to: d8
    approximationNotes: 这张图将外部依赖栈压缩为最直接影响 Yuxing 交付并变现基础设施服务能力的几层。
    claimRefs:
      - CR011
      - CR018
      - CR026
      - CR027
      - CR028
      - CR031
      - CR032
      - CR038
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 市场证明、客户证明、风险和估值支撑如何转化为推荐结论。
    data:
      nodes:
        - id: proof
          label: 运营证明
          description: 已服务数百项任务，并有具名客户 / 发射案例。
        - id: market
          label: 战略市场
          description: 中国商业航天建设为基础设施服务商留出空间。
        - id: risk
          label: 风险 / 披露缺口
          description: 经济性、集中度、监管和股权结构可见度仍不完整。
        - id: valuation
          label: 价格支撑
          description: 公开标记相互冲突；高位叙事没有公开证据托底。
        - id: synthesis
          label: 综合判断
          description: 公司是不错的候选标的，但在当前信息水平下，投资证明仍不完整。
        - id: call
          label: 推荐：跟踪 / 继续研究
          description: 保持接触，但要求确认性尽调和有纪律的价格。
      edges:
        - from: proof
          to: synthesis
          label: 让公司仍具可投性
        - from: market
          to: synthesis
          label: 支撑上行空间
        - from: risk
          to: synthesis
          label: 抬高折现率
        - from: valuation
          to: synthesis
          label: 限制支付意愿
        - from: synthesis
          to: call
          label: 净结论：尽调，而非盲目信念
    approximationNotes: 仅为定性决策图；节点权重是作者判断，而不是数学模型。
    claimRefs:
      - CV024
      - CV025
      - CV029
      - CV030
      - CV031
  - id: FV002
    title: 估值敏感性（人民币十亿元）
    type: bar
    layout: wide
    summary: 示意性情景中点显示，证明和披露改善或恶化时，价值变化有多快。
    data:
      items:
        - label: 熊市 / 重估
          value: 3
        - label: 折价基准
          value: 6
        - label: 证据支撑的上行
          value: 9
        - label: 叙事外推
          value: 11
    approximationNotes: 中点是作者基于情景假设和公开证据估算，并非观察到的市场出清价格。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
  - id: FV003
    title: 估值 / 回报区间（RMB 十亿元）
    type: range
    layout: wide
    summary: 以低 / 基准 / 高三档呈现公开估值锚、基准投资测算、下行重估和上行情形。
    data:
      items:
        - label: 2026 年公开估值标记区间
          low: 6
          mid: 7
          high: 10
        - label: 基准投资测算区间
          low: 5
          mid: 6
          high: 7
        - label: 熊市 / 重估区间
          low: 2
          mid: 3
          high: 4
        - label: 牛市 / 证据支撑区间
          low: 8
          mid: 10
          high: 12
    approximationNotes: 各区间体现明确假设下的估值纪律，未对稀释或清算优先权建模，二者均未披露。
    claimRefs:
      - CV003
      - CV020
      - CV021
      - CV022
      - CV036
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 基于当前信息集，给出可供投委会使用的主要投资维度评分卡。
    data:
      items:
        - label: 市场机会
          value: 8
        - label: 产品 / 平台深度
          value: 8
        - label: 客户验证
          value: 7
        - label: 护城河韧性
          value: 6
        - label: 经济性可见度
          value: 3
        - label: 风险画像（分数越高越安全）
          value: 4
        - label: 估值支撑
          value: 4
        - label: 按价格衡量的证据质量
          value: 5
    approximationNotes: 评分是作者按 1-10 分量表给出的判断，用来概括章节证据，而不是替代证据。
    claimRefs:
      - CV024
      - CV025
      - CV030
      - CV031
      - CV037
      - CV040
