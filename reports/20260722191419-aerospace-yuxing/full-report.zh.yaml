      - number: '8.5'
        title: 建议、正反命题和最终尽调
        blocks:
          - type: paragraph
            body: >-
              有支撑的建议是跟踪 /
              继续研究，置信度中等、风险评级高。公司有足够运营和客户证据留在管线里，且在中国商业航天基础设施中的战略位置真实存在。这是正命题。反命题是，投资人要把战略重要性转化为可靠股权回报所需的每个要素，披露仍不足：服务线经济性、站点利用率、集中度、优先权包袱、牌照地图、事故历史，以及融资标题和可持续现金生成之间的精确关系。因此，建议对价格敏感，而不是二元判断。在公开较低后期估值标尺附近或以下，只要有真实下行保护和确认性尽调，这个故事值得认真接触。若按公开叙事的激进顶部定价，现有证据不够强。


              下一步尽调同样清楚。索取管理账、服务线分群数据、利用率数据、集中度表、牌照与海外站点地图、事故 / SLA
              历史和当前股权结构表。然后把融资故事与真实经济表现逐项核对。如果这些材料显示经常性收入结构强、利用率健康、下行结构可接受，估值区间可以上移。如果没有，当前公开热度更可能压缩，而不是复合。简言之：不要轻易否定
              Aerospace Yuxing，但也不要把投资纪律外包给 2026 年融资标题。
