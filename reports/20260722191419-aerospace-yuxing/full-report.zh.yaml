      - number: '3.3'
        title: 商业模式、转换成本与多供应商并用
        blocks:
          - type: paragraph
            body: >-
              竞争者之间最大的商业差异不是技术能力，而是包装方式。保留材料里，AWS 披露的公开合同逻辑最干净：只为天线分钟数付费，选择按需或预留排程，并把处理留在 AWS 内部或把数据路由回自有基础设施。Leaf
              几乎同样明确，主张客户只为实际使用付费，并披露网络规模，以及自建站点大致 capex 和维护负担。ATLAS 以单一 API、LEOP 支持和联合网络抽象竞争；KSAT 以服务深度和运营可靠性竞争；Yuxing
              与中国一体化运营商对实际合同条款披露少得多。


              这种差异带来两种采购效果。第一，标准化云端或 GSaaS 工作流比主权或项目式任务支持更容易发现价格。第二，真正的转换成本不是天线，而是牌照、上线、任务软件集成、数据路由、运营流程、异常响应和客户审批。AWS
              称，运营商必须完成牌照和上线流程后才能使用网络。Leaf 技术文档称，自建站点还需要监管审批、运营软件、维护团队，以及自有场地或 teleports。ATLAS 和 KSAT
              都强调，它们的价值在于让客户不必从零搭建新的供应商栈。


              这意味着多供应商并用真实存在，但并不免费。成熟运营商可以混用供应商，组合公有云与联合网络，或把部分资产留在内部，同时外包溢出需求和 LEOP
              支持。但一旦工作流、安全审批和运营习惯嵌入，任务关键项目即便没有物理排他，也会形成软锁定。Yuxing
              如果成为中国项目可信的国内登记运营商，就会受益；如果买方认定更便宜、更自动化或更垂直一体化的替代方案能用更少定制支持完成同一任务，它就会受损。
