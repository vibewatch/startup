  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Current price cards, realized contract terms, discount ladders, and service-level commitments for Aerospace Yuxing’s TT&C, in-orbit management, and calibration offerings.
    whyItMatters: The chapter can compare packaging logic across peers, but it cannot underwrite Yuxing’s commercial durability without knowing whether its services price like scarce mission assurance or commodity support.
    diligencePath: Request sample contracts, rate cards, SLA schedules, and utilization reports for each major Yuxing service line.
    relatedQuestionRefs:
    - QP017
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-mix
    missingEvidence: Named customer roster, revenue concentration by program, and service-line mix between launch support, long-term operations, safety, calibration, and equipment sales.
    whyItMatters: Integrated operators and sovereign programs may behave very differently as customers; without customer mix, it is hard to know whether Yuxing is selling into durable recurring demand or episodic project work.
    diligencePath: Request top-customer concentration, revenue by mission type, renewal rates, and split between one-time equipment and recurring operations support.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: material
    topic: service-reliability-benchmarking
    missingEvidence: Independent uptime, pass-success, anomaly-response, and SLA performance data for Aerospace Yuxing that can be compared against KSATlite, Leaf, AWS, or ATLAS.
    whyItMatters: Several competitors publish network-performance or automation signals, but Yuxing’s public materials do not offer equivalent standardized reliability benchmarks.
    diligencePath: Request historical SLA reports, pass-success data, mean-time-to-recovery metrics, and customer references that quantify operational reliability.
    relatedQuestionRefs:
    - QP021
    - QP025
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-coverage
    missingEvidence: A complete public map of every Chinese state-owned ground-segment provider, military-adjacent integrator, and foreign relay-network entrant active in 2026.
    whyItMatters: The competitor table is intentionally scoped to the most decision-relevant classes. Important niche relay, SSA, or government-system actors may still exist outside the retained public set.
    diligencePath: Expand the landscape with procurement databases, satellite operator RFPs, and regulator or program prime disclosures focused on Chinese mission-support contracts.
    relatedQuestionRefs:
    - QP001
    - QP002
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: minor
    topic: security-compliance
    missingEvidence: Comparable published security, export-control, or compliance certifications for Yuxing versus AWS, ATLAS, KSAT, and SSC.
    whyItMatters: Trust posture matters heavily in ground-segment procurement, but public evidence in the retained set is richer for U.S.-aligned or international vendors than for Yuxing.
    diligencePath: Request compliance documentation, customer security questionnaires, and any regulator or standards certifications relevant to mission operations.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP004
