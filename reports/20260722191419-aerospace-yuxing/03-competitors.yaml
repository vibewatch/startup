  - CP004
  - CP039
- calloutType: risk
  title: Automation and vertical integration can squeeze stand-alone operators from both ends
  body: AWS/ATLAS/Leaf keep making standardized ground access easier, while Geespace and SpaceSail can bundle end-service relationships directly. That combination can compress the value of a mid-layer infrastructure specialist unless Yuxing’s regulatory and mission depth stays decisive.
  claimRefs:
  - CP020
  - CP021
  - CP033
  - CP042
  - CP043
