- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - evidence
  - mitigation / diligence ask
  rows:
  - - China-local TT&C and mission-support depth
    - AWS, ATLAS, and Leaf keep abstracting standard workflows into APIs and managed utilities
    - Medium-high
    - Cloud-led rivals increasingly sell automation, self-service scheduling, and easier integration
    - Request win/loss data showing when domestic regulatory fit outweighs cloud-led procurement simplicity.
  - - Safety, calibration, and in-orbit management adjacency
    - Integrated constellation operators can keep these workflows in-house once scale rises
    - High
    - Geespace sells a full stack and SpaceSail is already pursuing sovereign end-service programs abroad
    - Request customer evidence showing third parties still outsource these functions after constellation maturity.
  - - Installed domestic infrastructure
    - Status-quo internal build remains credible for large sovereign programs
    - Medium
    - Building a station is expensive and cumbersome, but some buyers still value direct control
    - Ask management for station utilization, renewal rates, and examples where outsourcing beat internal build.
  - - Mission-assurance reputation
    - Global benchmarks such as KSAT and SSC have longer public operating depth and more disclosed global reach
    - Medium-high
    - KSAT discloses 280+ antennas and 150+ KSATlite operators; SSC markets one of the world’s largest networks
    - Request independent uptime, anomaly-response, and SLA metrics for Yuxing.
  - - Project-style solution breadth
    - Pricing opacity can hide poor economics even when the capability stack is broad
    - High
    - AWS and Leaf expose far more public pricing logic than Yuxing does
    - Request sample contracts, pricing ladders, and service gross-margin data by mission type.
  - - Ground-network indispensability
    - Always-on mesh / relay concepts can reduce reliance on discrete station passes
    - Medium
    - Leaf’s TreeNet is explicitly marketed as reducing dependence on limited ground passes; AWS digital twin and automation also compress traditional workflow value
    - Model which Yuxing revenue streams depend on pass scarcity versus deeper mission-services expertise.
  notes: Severity reflects the likely effect on Yuxing’s ability to keep differentiated pricing or strategic relevance over the next 24–36 months.
