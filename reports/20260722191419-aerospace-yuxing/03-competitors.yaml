  rows:
  - - Aerospace Yuxing
    - China-centric commercial ground-and-operations specialist
    - 60+ ground stations; 370+ satellites and rockets served
    - Chinese launch, satellite, EO, and in-orbit operations customers
    - TT&C, long-term in-orbit management, calibration, safety, and frequency-coordination support
    - Public pricing, named-customer mix, and globally disclosed self-service footprint are sparse.
  - - KSAT
    - Global outsourced ground-network benchmark
    - 280+ antennas at 26 locations; KSATlite serves 150+ operators
    - EO, launch, TT&C, lunar, and constellation operators
    - Very broad service portfolio with strong operational depth and global reach
    - Public realized pricing is opaque and foreign-provider fit is weaker for China-local sovereign workflows.
  - - SSC Space
    - Incumbent global ground-station and operations provider
    - One of the world’s largest and most flexible ground station networks per SSC
    - Civil, science, telecom, and mission-operations customers
    - Long heritage across launch, ground stations, and spacecraft operations
    - Retained public set is less explicit than KSAT on current site counts, pricing, or software abstraction.
  - - AWS Ground Station
    - Cloud-managed ground-station utility
    - 10 named public locations plus undisclosed dedicated antennas
    - Operators already using AWS for storage, processing, and mission workflows
    - Fully managed service, public pricing logic, direct cloud integration, digital twin
    - Publicly documented bands/orbits are narrower than some bespoke providers, and China-local mission fit is weak.
  - - Leaf Space
    - New-space GSaaS operator
    - 40+ stations; 23,000+ passes/month; 18-station expansion plan
    - Smallsats, constellations, and operators seeking flexible GSaaS
    - Competitive no-commitment posture, disclosed station economics, automated scheduling
    - Support window and disclosed footprint remain smaller than the largest global benchmarks.
  - - ATLAS Space Operations
    - Federated GSaaS and mission-operations platform
    - 50+ antennas; 34+ global locations; 2B+ network metrics
    - Commercial, civil, and defense spacecraft operators
    - Single API, LEOP focus, federated model, security-led positioning
    - Public pricing is absent and the strongest public posture is U.S.-centric rather than China-centric.
  - - Geespace
    - Integrated Chinese LEO satcom operator and solution vendor
    - 64 satellites in orbit; support for up to 20M users; 20+ domestic and 20+ country tests
    - Vehicles, maritime, emergency, IoT, and telecom-linked verticals
    - Own constellation plus chips, modules, antennas, terminals, and vertical partnerships
    - Not a neutral third-party infrastructure vendor; internal priorities can dominate.
  - - SpaceSail / SSST
    - State-backed integrated broadband operator
    - Brazil launch target in 1H26; Telebras public-sector MOU
    - Government and sovereign connectivity programs
    - Can compete directly for national connectivity budgets with strong political backing
    - Retained public set reveals little about third-party outsourcing demand or pricing.
  - - Internal build / state integrators
    - Status-quo alternative
    - Building an S/X station can cost about €400k-€500k plus ~€7k monthly maintenance
    - Programs with sovereign-control, security, or bespoke workflow needs
    - Maximum control over licensing, procedures, and data paths
    - Capex-heavy, slow to scale, and operationally burdensome versus GSaaS or outsourcing.
  notes: The row set intentionally mixes direct vendors, integrated operators, and internal-build alternatives because the buyer job is mission assurance and satellite-service activation, not just buying one more antenna contract.
