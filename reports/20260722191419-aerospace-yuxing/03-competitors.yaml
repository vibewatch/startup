  title: Domestic mission depth is the company’s clearest defensible lane
  body: Frequency-coordination support, long-life in-orbit management, safety services, and remote-sensing calibration are more defensible for Yuxing than pure commodity antenna access, especially inside China-centric missions.
  claimRefs:
