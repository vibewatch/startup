- id: why-the-company-is-worth-valuing-at-all
  title: Why the Company Is Worth Valuing at All
  body: |-
    The easiest mistake on a thinly disclosed private company is to jump straight to skepticism and miss the substance. Yuxing has enough public proof to avoid that trap. Official pages show that the company is not pitching one narrow point product; it participates in launch and early-orbit TT&C, long-term in-orbit management, safety management, calibration, and related hardware/software products. Customer-side and independent reporting add real-world proof points across PIESAT, Beijing-3C/21AT launch coverage, and broader commercial-launch support. That evidence matters because it means the valuation debate is about entry discipline and underwriting quality, not about whether the company exists or whether anyone pays for it.

    The same evidence also shapes the upside case. A space-infrastructure provider that already sits inside launch, constellation operations, and safety workflows can plausibly deepen wallet share as Chinese commercial space expands. The strongest upside path is not a single moonshot program but the compounding of mission-critical services into longer-term operating relationships, plus selective upside from adjacent products or servicing. Yet this is exactly where public evidence runs out. The business is real; the persistence and profitability of that business are still mostly unpriced from outside. Investors should therefore keep two truths in mind at once: Yuxing has earned serious diligence, and Yuxing has not yet earned a no-discount valuation.
  claimRefs:
