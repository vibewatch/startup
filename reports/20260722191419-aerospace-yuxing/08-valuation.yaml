- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - dimension
  - thesis
  - anti-thesis
  - what would change the view
  rows:
  - - Market
    - China commercial-space buildout and constellation demand create room for infrastructure specialists.
    - Sector growth alone does not guarantee attractive unit economics for a heavy-asset operator.
    - Show multi-year demand visibility and customer-specific backlog by service line.
  - - Product
    - Yuxing covers TT&C, long-term operations, safety, calibration, and adjacent products.
    - Breadth can also hide low-margin project mix and execution sprawl.
    - Provide gross margin and attach-rate data by product and service family.
  - - Customers
    - Named missions and customers prove adoption and relevance.
    - Public roster is still narrow, making concentration impossible to dismiss.
    - Provide top-10 customer concentration, renewal data, and contract duration.
  - - Financials
    - Late-stage financing and IPO counseling imply continuing capital access.
    - No public revenue, EBITDA, cash, or utilization disclosure means price is still opaque.
    - Provide audited management accounts and cap-table / preference details.
  - - Strategic upside
    - Servicing and higher-value integrated operations could expand the story beyond commodity ground access.
    - That upside is still early and should not be capitalized as if proven.
    - Show commercial contracts, actual milestones, and realized economics for new verticals.
  notes: The table separates company quality from investability at a given price.
