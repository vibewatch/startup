- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - core assumptions
  - valuation logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Launch-control share converts into sticky constellation operations, launch cadence stays healthy, and adjacent high-value services mature.
    - Supports a move into roughly the 80-120亿元 zone if disclosure improves materially.
    - Execution slips, regulation tightens, or optionality never monetizes.
    - Possible but not yet earned.
  - - Base
    - Company remains strategically relevant and commercially real, but audited economics stay limited in the near term.
    - Keep underwriting near a discounted 50-70亿元 band anchored on the lower public marker.
    - Concentration and disclosure still cap price support.
    - Most defensible today.
  - - Bear
    - IPO or financing materials reveal weak margins, utilization, or concentration; market conditions get less forgiving.
    - Value compresses toward a 20-40亿元 reset/down-round band.
    - Cap-table overhang and heavy-asset economics amplify downside.
    - Meaningful.
  - - Walk-away / no-go price zone
    - Round is priced like the highest public unicorn narrative without hard economics.
    - Risk/reward becomes unattractive even if the company remains strategically important.
    - New money funds optionality at a price already assuming proof.
    - Avoid absent new disclosure.
  notes: Bands are author estimates intended for underwriting discipline, not statements of market-clearing truth.
