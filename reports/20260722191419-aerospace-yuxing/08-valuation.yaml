  requirement: assumptions, valuation/return logic, key risks, probability signal.
- name: Comparable valuation table
  requirement: comparable, metric, multiple/valuation/status, relevance, limitation.
- name: Thesis-break and kill triggers table
  requirement: trigger, threshold, transmission to thesis, action implication.
- name: Final diligence asks table
  requirement: topic, missing evidence, why it matters, owner or diligence path.
