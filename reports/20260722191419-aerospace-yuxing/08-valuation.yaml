- id: public-comps-give-a-band-not-a-point-estimate
  title: Public Comps Give a Band, Not a Point Estimate
  body: |-
    Because Yuxing does not disclose audited operating metrics, the public comparable set is best used as a framing tool rather than a plug-and-play multiple engine. The retained July 2026 market-data set is wide enough to prove the point on its own. Planet Labs, a more data-platform-oriented EO story, trades around an $8.1-$8.2B market cap and roughly 23.8x EV/revenue. Spire, a smaller multi-product space-data platform, sits near a $0.44-$0.45B market cap and about 6.5x EV/revenue. Iridium, a mature recurring satcom infrastructure benchmark, sits around $5.0B market cap and 7.6x EV/revenue on far larger revenue. At the other extreme, AST SpaceMobile trades at a multi-tens-of-billions market cap with EV/revenue above 222x, showing how strategic narrative and optionality can overwhelm near-term fundamentals.

    Those numbers are useful precisely because they are not directly transferable. Planet and Spire are better benchmarks for commercialization discipline and public-market tolerance for satellite/data platforms. Iridium is useful for what mature recurring satcom can command with better disclosure. ASTS is useful as a warning that the space sector sometimes prices dreams very richly — but also that such pricing depends on a very different story, customer base, and capital-market context. For Yuxing, the lesson is that comparables support only a wide range. They do not eliminate the need for a disclosure discount or justify paying the top end of private-market hype by analogy.
  claimRefs:
