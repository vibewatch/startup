    topic: economics-and-utilization
    missingEvidence: Revenue by service line, gross margin, EBITDA, cash burn, debt, station utilization, launch-to-operations conversion, and SLA performance.
    whyItMatters: These variables determine whether Yuxing deserves a premium infrastructure multiple or a discounted heavy-asset valuation.
