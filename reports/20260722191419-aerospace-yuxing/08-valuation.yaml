company:
  name: Aerospace Yuxing
chapter:
  number: 8
  title: Valuation
  summary: 'Aerospace Yuxing is valuable enough to merit serious diligence but not transparent enough to support a clean price. Public 2026 evidence shows a late-stage, mission-proven Chinese space-infrastructure company with IPO-counseling momentum, broad service scope, and real customer proof, yet it does not support one settled valuation mark: retained sources conflict between a roughly 60-70亿元 late-stage band and a more aggressive 100亿元 unicorn narrative. Public comps reinforce caution rather than precision — Planet Labs and AST SpaceMobile show how richly the market can value space platforms, while Spire and Iridium show the discipline imposed by recurring economics and disclosure. The supported recommendation is therefore track / research-more, underwrite near the lower public marker with a mandatory disclosure discount, and avoid paying top-end narrative pricing until audited economics, concentration, licensing, and cap-table details are in hand.'
contentRequirements:
- Investment thesis and anti-thesis tied to market, product, customers, financials, competition, and risks.
- Recommendation, confidence, risk rating, valuation stance, and target return/hold/exit where supportable.
- Current financing/valuation context, entry discipline, dilution/preference overhang, and whether public evidence supports the price.
- Bull/base/bear cases with explicit assumptions, valuation ranges, probability signals, and downside triggers.
- Comparable set — public companies, private rounds, M&A, milestone or model-appropriate references.
- Exit readiness and final diligence asks plus thesis-break triggers.
