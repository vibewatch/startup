  acceptedTypes:
  - flow
  requirement: Chain from scale/proof/risks/valuation to recommendation.
- name: Valuation sensitivity
  acceptedTypes:
  - bar
  requirement: Sensitivity to revenue, margin, multiple, milestone probability, utilization, or other driver.
- name: Valuation / return range
  acceptedTypes:
  - range
  requirement: Low/base/high valuation, exit, dilution, or return outcomes with explicit assumptions.
- name: Investment KPIs
  acceptedTypes:
  - kpi
  requirement: IC-ready scoring across market, proof, moat, economics, risk, valuation, and evidence quality.
evidenceStrategy:
- Use prior chapter evidence first, then gather recommendation-critical financing/valuation/comp data directly.
- Valuation/financing — latest rounds, valuation marks, cap-table/preference clues, debt/project finance, public/private comps, M&A, secondary marks.
- Scenario drivers — growth, margin, retention, unit economics, approvals, milestones, loss rates, multiples, exit window.
- Adverse/downside — overvaluation, down-round risk, multiple compression, regulatory blockers, customer concentration, failed commercialization.
qualityBar:
- Recommendation is price-sensitive and evidence-sensitive, not a generic company-quality score.
- Use a valuation method matching business model and stage; show what diligence or price change would move the call.
- Do not issue buy unless thesis and anti-thesis are evidence-supported and valuation has sufficient support.
- If valuation inputs are missing, prefer research-more or track over false precision.
- Include adverse searches on overvaluation, down-round risk, governance, liquidity, or commercialization failure.
sections:
- id: current-financing-context-and-what-public-pricing-does-not-prove
  title: Current Financing Context and What Public Pricing Does Not Prove
  body: |-
    Aerospace Yuxing clearly deserves a valuation chapter because the company is not just a concept-stage space story. Public materials and 2026 reporting show a late-stage business with an active IPO-counseling path, a broad service stack, and enough mission history to attract real institutional attention. But that same public record does not produce one clean price. The retained June 2026 sources disagree on both cumulative funding and current mark: some frame the company around a roughly 60-70亿元 valuation zone, while a more aggressive report places it into a 100亿元-class unicorn narrative. That is not a minor rounding issue. It is the core reason a disciplined investor cannot treat the latest financing headlines as a fully underwritten fair value.

    The right way to read the financing context is therefore asymmetric. The positive signal is real: repeated 2026 coverage, IPO guidance, and continued hiring/procurement imply a company still expanding rather than retrenching. The negative signal is also real: public disclosures still do not provide audited revenue, margin, cash, debt, backlog, utilization, or customer concentration, and even headline metrics such as paid missions and financing totals vary by source. For valuation purposes, the June 2026 round headlines are evidence that the market wants exposure to the story, not evidence that the current price is already justified. That distinction sets up the rest of the chapter: use public price markers as anchors, then discount heavily for missing economics.
  claimRefs:
