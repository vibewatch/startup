  topStrengths:
    - Real mission-critical product breadth across launch TT&C, long-term operations, safety, calibration, and software/hardware systems
    - Public proof of scale through a 60-plus-station network, hundreds of paid missions, and named commercial-space customer cases
    - Strategic tailwind from China's commercial-space buildout and the company's active 2026 IPO-preparation path
  topRisks:
