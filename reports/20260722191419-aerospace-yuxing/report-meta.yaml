companyProfile:
  summary: Aerospace Yuxing, publicly branded as Emposat and 航天驭星, is a Beijing-based commercial space infrastructure company founded in 2016. Public evidence shows a broad mission-critical service stack spanning launch and early-orbit TT&C, long-term spacecraft operations, safety management, remote-sensing calibration, and adjacent ground/software/communications products. The company appears strategically well-positioned inside China's commercial-space buildout, with a 60-plus-station network, hundreds of paid missions served, named customer proof, and active IPO counseling in 2026. The main challenge is not whether the business is real; it is whether the current price can be underwritten without audited economics, concentration data, licensing detail, and cap-table visibility.
  foundedDate: '2016-10-12'
  founders:
    - name: Zhao Lei
      role: Founder, legal representative, and controlling shareholder
      background: Mechanical-engineering and defense-space background; public reporting identifies him as the company's founder and actual controller.
      claimRefs: [CO011, CO012, CO013]
  foundingLocation: null
  headquarters: Beijing, China
  productSummary: The disclosed platform combines launch TT&C, long-term in-orbit management, safety and collision-management services, remote-sensing calibration infrastructure, and related hardware/software systems for mission operations.
  customerFocus: Launch providers, satellite operators, constellation programs, and remote-sensing users that need mission-critical operations and data infrastructure rather than generic software seats.
  businessModel: Infrastructure-heavy service and product mix combining mission-based launch/early-orbit support, longer-term satellite operations, safety and calibration services, and selective hardware/software product revenue.
  stage: Private / late growth
  fundingStatus: Public 2026 coverage indicates continued late-stage financing and IPO-counseling momentum, but cumulative funding and current valuation markers remain publicly inconsistent.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO006, CO007, CO011, CU001, CU007, CI034, CI035, CV002, CV003]
