- id: sizing-lenses-and-what-they-actually-mean
  title: 'Sizing Lenses: Service Revenue, Orbital Footprint, and Infrastructure Throughput'
  body: 'Public sizing evidence comes in several incompatible units, so collapsing them into one neat TAM would create false precision. The first lens is service-market revenue. The Business Research Company sizes the global satellite internet market at $7.42 billion in 2026 and $12.69 billion by 2030, which is useful for showing that the category is commercially meaningful but too broad to stand in for Yuxing''s addressable layer on its own. The second lens is strategic-orbital scale. Orbital Radar, MERICS, China Daily, and related reporting all show a very large Chinese buildout: about 28,000 satellites planned for Guowang and Qianfan alone, more than 350 already launched by mid-2026, and a much larger filing envelope of 200,000-plus satellites across broader Chinese submissions to the ITU.


    Those satellite-count numbers matter because they imply future demand for filing work, launch support, ground gateways, orbit control, and recurring network operations. But they are still not market revenue. ITU''s own guidance is explicit that filings are not one-to-one with physical satellites, that bring-into-use and milestone obligations exist, and that warehousing countermeasures shape deployment timing. In other words, the filing footprint is a signal of ambition and strategic positioning, not a revenue backlog. This is the core analytical trap in the market: the biggest public numbers are often the least monetization-ready.


    For Yuxing specifically, the best supported sizing conclusion is that the company sits inside a large and accelerating infrastructure buildout, but its SAM is materially narrower than either the full global satellite-internet revenue market or the most aggressive Chinese filing counts. The company benefits when more constellations need gateways, TT&C, calibration, and long-term orbit management. It does not automatically monetize every additional notional broadband user or every paper satellite filed at the ITU. That is why this chapter treats orbital ambition, industrial capacity, and service-market revenue as separate lenses rather than as directly additive market-size figures.'
