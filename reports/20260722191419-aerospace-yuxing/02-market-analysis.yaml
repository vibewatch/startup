  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: yuxing-sam
    missingEvidence: A public revenue bridge from satellite-internet TAM to TT&C, gateway, calibration, and in-orbit-operations spend addressable by Aerospace Yuxing.
    whyItMatters: Without segment pricing and contract values, the open-source evidence cannot cleanly convert broad constellation activity into Yuxing-specific revenue opportunity.
    diligencePath: Request segment-level pricing, utilization, and contract-value data from management or IPO materials.
    relatedQuestionRefs:
    - QM009
    - QM024
  - type: private-evidence-only
    severity: material
    topic: infrastructure-pricing
    missingEvidence: Public rate cards or signed contract disclosures for TT&C, data reception, gateway, or long-term orbit-management services.
    whyItMatters: Pricing opacity prevents bottom-up SAM or SOM modeling and obscures whether the market scales more with mission count or with managed assets.
    diligencePath: Obtain customer contracts, list pricing, or bid data across launch support and recurring operations services.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: minor
    topic: filing-to-deployment-conversion
    missingEvidence: An authoritative public deployment plan matching Chinese filing envelopes to realistic launcher availability and milestone timing.
    whyItMatters: The market narrative can be overstated if filing scale is treated as near-term physical deployment or spend.
    diligencePath: Track launch manifests, operator schedules, and ITU milestone compliance against each flagship constellation.
    relatedQuestionRefs:
    - QM019
    - QM025
  - type: missing-source
    severity: minor
    topic: segment-budget-splits
    missingEvidence: Public evidence showing what share of budgets sits with state operators, telcos, and remote-industry buyers across the Chinese non-terrestrial stack.
    whyItMatters: Buyer concentration affects sales cycles, bargaining power, and whether Yuxing faces procurement or consumer-style economics.
    diligencePath: Request customer-mix disclosure or infer it from public tenders and procurement notices in the next refresh.
    relatedQuestionRefs:
    - QM011
