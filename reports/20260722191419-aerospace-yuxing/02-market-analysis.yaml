chapter:
  number: 2
  title: Market Analysis
  summary: Aerospace Yuxing operates inside a China-led satellite-internet and space-infrastructure market where the headline numbers are enormous but the monetizable layers are uneven. Public evidence supports a global satellite-internet market of $7.42 billion in 2026, a Chinese sovereign buildout of roughly 28,000 planned Guowang and Qianfan satellites with 350-plus already launched, and a much larger 200,000-plus ITU filing footprint that signals ambition more than near-term revenue. For Yuxing, the practical SAM is the ground-and-operations layer — TT&C, gateways, calibration, and in-orbit services — whose growth depends on launch cadence, standards, and recurring mission operations rather than on retail broadband adoption alone.
sections:
- id: market-boundary-and-included-spend
  title: Market Boundary and Included Spend
  body: 'The relevant market for Aerospace Yuxing is not "all commercial space" and not simply the end-user retail broadband market that public satellite internet headlines tend to emphasize. MIIT''s 2026 explainer is the cleanest boundary document in the fetched set: it describes satellite internet as integrated space-air-ground infrastructure built to solve coverage gaps, resilience needs, and strategic-independence goals, with a value chain spanning satellite manufacturing, launch, ground equipment, user terminals, and operating services. That definition matters because Aerospace Yuxing monetizes the middle and downstream infrastructure layers — TT&C, ground stations, data reception, calibration, and long-term orbit operations — rather than the full consumer-service stack.


    Included spend therefore covers three buckets. First is sovereign and quasi-sovereign constellation infrastructure: Guowang, Qianfan, and adjacent national or provincial programs need filing support, launch support, early-orbit control, and recurring network operations. Second is operator-led connectivity extension, especially direct-to-device and remote coverage, where gateways, regulatory compliance, and ongoing monitoring remain mandatory even if the retail face belongs to a telecom operator. Third is mission-critical mobility and resilience demand — maritime, aviation, emergency response, scientific expeditions, and remote industrial sites — where satellite links win not by beating fiber in cities but by working where terrestrial networks fail.


    What sits outside the most relevant market is equally important. Standard urban broadband subscriptions, generic launch revenue, and broad spacecraft manufacturing revenues are all adjacent, but they are not the same as Yuxing''s practical monetization layer. A headline claim about a multibillion-dollar satellite internet market can therefore be directionally true and still not say much about the serviceable opportunity for a TT&C and ground-infrastructure specialist unless the analysis first isolates the part of the value chain that actually requires operators like Yuxing.'
