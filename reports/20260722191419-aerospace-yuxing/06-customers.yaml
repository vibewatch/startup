  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: Public NRR, GRR, renewal, contract-duration, and backlog metrics by customer segment.
    whyItMatters: The chapter can prove adoption and some repeat use, but it cannot underwrite recurring-revenue durability or mission-to-ARR conversion.
    diligencePath: Request cohort retention, contract length, committed minimum volumes, and backlog by launch, satellite-ops, calibration, and safety-service customers.
    relatedQuestionRefs:
    - QU017
    - QU025
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer share, segment revenue mix, and the split between launcher, operator, government-affiliated, and foreign accounts.
    whyItMatters: Mission count alone can hide a business that is concentrated in a few launch families or constellation programs.
    diligencePath: Request revenue and gross margin by top 10 customers, by service line, and by domestic versus international customer.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-roster
    missingEvidence: A broader named roster of constellation operators, launchers, and foreign customers with dates and service scope.
    whyItMatters: Three named proofs are enough to establish traction but not enough to infer diversification or segment penetration.
    diligencePath: Request a customer reference sheet listing customer, segment, first mission date, current status, geography, and permission to cite.
    relatedQuestionRefs:
    - QU008
    - QU020
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: customer-quality
    missingEvidence: Independent uptime, SLA, incident, and customer-satisfaction metrics tied to real contracts.
    whyItMatters: Operational infrastructure businesses can look sticky while still losing renewals if reliability or service quality is uneven.
    diligencePath: Request SLA terms, incident history, mission success statistics, NPS or survey data, and customer references tied to reliability.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: minor
    topic: international-customers
    missingEvidence: Named non-China customer accounts, contract scope, local compliance path, and renewal status.
    whyItMatters: The marketing message emphasizes global reach, but the public customer record is still overwhelmingly China-centered.
    diligencePath: Request at least three named foreign accounts plus proof of local licensing, billing, and ongoing use.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU023
    relatedTableRefs:
    - TU005
