company:
  name: Aerospace Yuxing
chapter:
  number: 6
  title: Customers
  summary: Public evidence shows Aerospace Yuxing already serves real launch and satellite-operator customers, with the clearest proof in launch TT&C, early-orbit operations, and data-intensive remote-sensing missions. The strongest named cases are Galactic Energy, PIESAT's Nuwa constellation, and 21AT's Beijing-3C constellation, but retention, concentration, and international customer economics remain largely undisclosed.
sections:
- id: customer-segments-and-buying-center
  title: Customer Segments and Buying Center
  body: 'Aerospace Yuxing is not selling into one monolithic customer pool. The official service pages show at least four distinct customer jobs: launch providers that need launch-phase TT&C coverage; satellite operators that need early-orbit and routine in-orbit management; remote-sensing operators that need payload data reception and calibration; and operators that need safety, collision-warning, orbit-control, or end-of-life support. In practice, the user may be a mission-operations team while the buyer is a launcher, satellite owner, constellation program, or affiliated government-backed operator. That makes the real selling surface workflow-centric rather than product-centric.


    The public record also suggests that Yuxing usually wedges into the earliest operationally critical point in the mission: launch and first acquisition. Official materials emphasize full-route launch TT&C coverage across domestic and overseas stations, early-orbit multi-station relay, and command injection immediately after separation. Once that foothold is established, the company can expand into routine station passes, orbit control, payload downlink, calibration, and safety services. That is a sensible infrastructure land-and-expand motion, because the first operational failure during launch or early orbit is far more costly to a customer than later workflow frictions.


    What remains opaque is the exact payer mix behind those jobs. The retained source set proves named commercial relationships and repeated launch support, but it does not disclose the split between launchers, constellation operators, government-affiliated missions, foreign customers, or one-off engineering engagements. Investors should therefore read the chapter as proof of real adoption, not as proof of diversified recurring revenue.'
