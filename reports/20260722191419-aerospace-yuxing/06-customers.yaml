- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - scale
  - revenue / strategic value
  - gap
  rows:
  - - Launch providers
    - 'Buyer: launcher mission team; User: launch ops; Payer: launch company or mission prime'
    - Launch TT&C, separation confirmation, first acquisition, command injection
    - 'Named: Galactic Energy; 2025 Taibo also names Ceres-1, Lijian-1, Gravity-1 work'
    - High repeat potential when a launcher flies frequently; best wedge for later cross-sell
    - No disclosed contract value, per-launch pricing, or top-launcher concentration.
  - - Commercial EO satellite operators / constellations
    - 'Buyer: constellation operator; User: flight-control and payload teams'
    - Early orbit, routine ops, high-rate downlink, data relay
    - 'Named: PIESAT Nuwa and 21AT Beijing-3C'
    - Creates multi-pass, multi-year operating workload and deeper workflow lock-in
    - No public segment ARR or satellite-operator roster beyond a few cases.
  - - Remote-sensing calibration users
    - 'Buyer: EO operator or data owner; User: calibration / downstream analytics teams'
    - Optical, SAR, and laser-altimetry calibration / validation
    - Officially positioned for optical, SAR, and laser-altimetry satellites
    - Higher-value specialized service layered on top of network assets
    - No named paying calibration customers are public.
  - - In-orbit safety and orbit-control users
    - 'Buyer: satellite owner; User: operations and safety teams'
    - Collision warning, orbit prediction, maneuver support, deorbit planning
    - Official service catalog proves offering, but named customers are scarce
    - Raises stickiness after launch and routine operations are in place
    - No public success-rate, alert-quality, or renewal metrics by customer.
  - - Future servicing / debris customers
    - 'Buyer: satellite owner or mission sponsor; User: servicing mission teams'
    - Potential robotic-arm, refueling, debris, and special operations support
    - No public customer contracts yet
    - Could open a new premium service line if demo-stage tech commercializes
    - Still pre-commercial in the retained public set.
  notes: The segment map follows the operational workflow visible in official materials and named public cases rather than a legal-entity customer list.
