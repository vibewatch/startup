- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Serve more private-launch missions as Chinese commercial launch cadence rises
    - Revenue could still be concentrated in a small number of launch families or launcher groups
    - Medium-high upside with medium-high concentration risk
    - Request revenue by launcher customer, mission count by launcher, and attach rate into post-launch services.
  - - Expand from launch support into routine constellation operations
    - Named proof is strongest at launch and early orbit, weaker on long-duration managed-service contracts
    - Could deepen gross margin and switching costs if real
    - Request customer examples that progressed from launch support to multi-year operations contracts.
  - - Cross-sell data reception and calibration to EO constellation operators
    - Public named calibration customers are missing
    - Specialized services may be valuable but currently under-proven
    - Request named calibration customers, annual usage frequency, and pricing model.
  - - Use global ground footprint to win overseas accounts
    - No named foreign anchor customer is public, while state-backed rivals publicly win large overseas satellite-internet accounts
    - International upside may be slower than network-footprint marketing suggests
    - Request foreign-customer roster, local compliance path, and competitive win/loss examples.
  - - Broaden into safety, deorbit, and future servicing
    - Newest services may be technologically differentiated but commercially immature
    - Could create premium service lines but may not yet contribute materially
    - Request revenue mix, pipeline, and signed pilots or contracts for safety and servicing services.
  notes: The main analytical gap is not whether Yuxing has customers; it is whether those customers are diversified and durable enough to support premium valuation.
