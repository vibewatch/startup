- id: repeat-usage-and-durability-signals
  title: Repeat Usage and Durability Signals
  body: 'Durability is where the evidence quality drops. Public sources prove scale and repeated operational use, but they do not disclose classic software-style retention metrics such as NRR, GRR, renewal rate, average contract term, or customer satisfaction scores. The best visible durability proxy is repeated mission assignment. Galactic Energy is the cleanest example because Yuxing claims a multi-launch relationship extending from Ceres-1 Y1 through Y9. The broader company-scale metrics also imply ongoing reuse: Yuxing''s public markers move from more than 370 serviced satellites and rockets, to more than 500 paid star-and-rocket services, to 674 paid satellites and rockets by mid-2026.


    Taibo''s January 2026 report adds helpful operational texture. It says Yuxing completed launch-control tasks for Ceres-1, Lijian-1, and Gravity-1 in 2025, executed 10 rocket launch-control missions and 47 satellite flight-control missions during the year, and claimed 92.8% commercial launch-control paid-service market coverage. Even if some translated metrics are awkward and should be treated carefully, the message is consistent: customers are not using the network once and disappearing.


    Still, repeat usage is not the same as durable economics. The retained set does not show how many customers renew, how much one launcher or one constellation contributes to revenue, how much work is one-off consulting versus recurring operations, or whether foreign customers exist beyond generic “global users” language. That keeps the customer chapter solid on adoption proof but incomplete on customer quality.'
