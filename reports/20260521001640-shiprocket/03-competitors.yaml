  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: NimbusPost financials
      missingEvidence: >-
        NimbusPost's audited FY25 revenue, net loss/profit, and monthly active merchant count
        are not publicly disclosed; estimates from Tracxn and media vary significantly.
      whyItMatters: >-
        Without verified NimbusPost financials, the direct aggregator competitive gap analysis
        relies on estimates that could overstate or understate the competitive threat.
      diligencePath: >-
        Request NimbusPost financial data from Xpressbees investor reporting or regulatory
        filings with Ministry of Corporate Affairs (MCA ROC data).
      relatedQuestionRefs: [QP017]
      relatedTableRefs: [TP001]

    - type: private-evidence-only
      severity: material
      topic: Shiprocket carrier contract terms
      missingEvidence: >-
        Shiprocket's carrier-by-carrier rate schedules, exclusivity clauses, and revenue-share
        agreements are not disclosed in the DRHP at individual carrier level.
      whyItMatters: >-
        The carrier rate spread is the core revenue mechanism of the aggregation model;
        carrier consolidation risks can only be properly assessed with actual contract terms.
      diligencePath: >-
        Obtain carrier master service agreements and volume commitment schedules in data room
        due diligence. Focus on top-5 carriers (approximately 86% of volume per DRHP).
      relatedQuestionRefs: [QP006]
      relatedTableRefs: [TP004]

    - type: private-evidence-only
      severity: material
      topic: Shiprocket merchant churn rate by tier
      missingEvidence: >-
        Net merchant churn rates by subscription tier (Lite, Business, Advanced, Pro) and
        cohort-level retention data are not publicly disclosed.
      whyItMatters: >-
        Churn rate by tier is critical for assessing whether the freemium funnel converts to
        paid tiers or primarily serves as a free acquisition channel for competitors' sampling.
      diligencePath: >-
        Request merchant cohort analytics and tier migration rates in diligence data room.
        Compare against NimbusPost's claimed "switching motivators" from merchant surveys.
      relatedQuestionRefs: [QP018]
      relatedTableRefs: [TP004]

    - type: missing-source
      severity: minor
      topic: Amazon ASCS India launch timeline
