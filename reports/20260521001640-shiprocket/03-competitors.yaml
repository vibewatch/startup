callouts:
  - calloutType: risk
    title: Carrier consolidation compresses aggregator spread
    body: >-
      Delhivery's absorption of Ecom Express and CEO Barua's public dismissal of Xpressbees'
      viability signal that India's express carrier market is consolidating to three listed players.
      As carrier choice narrows, Shiprocket's negotiating leverage on wholesale rates may diminish,
      compressing the spread between what it pays carriers and what it charges merchants — the
      core economic mechanism of the aggregation model.
    claimRefs:
      - CP010
      - CP013
      - CP037
      - CP038

  - calloutType: risk
    title: Amazon ASCS is a structural substitution threat
    body: >-
      Amazon Supply Chain Services (launched May 2026) opens Amazon's global logistics network to
      all businesses. For Shiprocket merchants who are also Amazon marketplace sellers — a large
      proportion of Shiprocket's 400K+ base — Amazon can fulfill their entire logistics workflow
      without an intermediary aggregator. Delhivery's 4% share price decline on announcement day
      signals the market views this as a structural disruption to the intermediary logistics model.
    claimRefs:
      - CP005
      - CP027
      - CP034
      - CP042

  - calloutType: risk
    title: Persistent service quality complaints weaken brand moat
    body: >-
      Active adverse reviews on PissedConsumer (May 2026), MouthShut, and ConsumerComplaints
      document false delivery attempt markings, unauthorized weight deductions, delayed COD
      remittances, and unresponsive support. NimbusPost explicitly cites faster COD remittance and
      fewer hidden charges as switching motivators in its own merchant-facing content. At the
      micro-to-mid volume tier where switching friction is lowest, sustained service quality issues
      are the primary driver of merchant churn.
    claimRefs:
      - CP036
      - CP020

  - calloutType: strength
    title: 400K+ merchant data network is the durable competitive moat
    body: >-
      Shiprocket's accumulation of 8+ years of RTO data, NDR outcomes, pin-code delivery
      performance, and carrier reliability metrics across 400K+ merchants creates an analytical
      baseline that no direct aggregator peer can replicate quickly. The RADAR and Shunya AI
      systems convert this historical data into real-time carrier allocation decisions that
      improve delivery reliability and reduce merchant RTO rates — a compound learning advantage
      that deepens with every additional shipment processed.
    claimRefs:
      - CP035
      - CP029
      - CP030

