  - id: switching-costs-lock-in-distribution
    title: Switching Costs, Lock-in, and Distribution Power
    body: >-
      Shiprocket's primary merchant lock-in mechanisms are technical and analytical rather than
      contractual. The platform's multi-carrier label automation, COD reconciliation workflows,
      marketplace API integrations (Shopify, WooCommerce, Magento, Amazon, Flipkart, Meesho),
      and ERP/WMS connectors each require bespoke implementation effort. A merchant migrating to
      NimbusPost or ClickPost must re-implement these integrations, retrain staff, and accept
      a parallel-run period during which both systems must be maintained — a realistic switching
      cost of several weeks of engineering effort and operational disruption. For merchants with
      more than five active sales channels, this cost is material.


      Analytical lock-in is a second and growing mechanism. Shiprocket's RADAR system accumulates
      pin-code-level delivery performance data, carrier RTO rates, and NDR success patterns
      specific to each merchant's product mix and customer geography. This historical baseline
      cannot be migrated — it must be rebuilt from scratch at a new platform, implying higher RTO
      rates and worse carrier allocation decisions for 3-6 months post-migration. For D2C brands
      where RTO rates directly affect working capital and customer lifetime value, this is a
      meaningful barrier.


      Multi-homing risk is highest at the micro-merchant and freemium tier, where low switching
      friction allows merchants to test NimbusPost or ClickPost in parallel with minimal cost.
      Enterprise accounts (above Rs 5 lakh/month in shipping spend) with deep ERP integrations
      face substantially higher switching friction and are the most defensible cohort. The ClickPost
      vs. Shiprocket competitive boundary lies precisely at this enterprise segment, where ClickPost's
      superior analytics and SLA management capabilities draw merchants who have outgrown
      Shiprocket's generalist tooling.


      Distribution power is concentrated in Shiprocket's favor at present: 400K+ onboarded merchants
      constitutes a market position no direct aggregator peer approaches. Unicommerce's OMS platform
      (Rs 204 crore FY26) creates indirect channel competition by enabling merchants to integrate
      their logistics allocation through Unicommerce's ShipSense AI rather than through Shiprocket's
      dashboard, weakening Shiprocket's role as the single logistics control plane. Amazon ASCS
      creates the most structural substitution threat for merchants who are also Amazon marketplace
      sellers: their Amazon-channel logistics can be handled end-to-end within the Amazon ecosystem,
      reducing the share of total merchant volume that flows through an aggregator.
