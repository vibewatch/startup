  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat Claim
      - Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - 400K+ merchant network with multi-channel integrations
        - Multi-homing by micro-merchants; NimbusPost free-tier adoption
        - Medium
        - Confirm net merchant churn rate, especially for Lite/free tier cohort
      - - Proprietary RTO and pin-code performance data (RADAR / Shunya AI)
        - Data becomes a commodity as competitors accumulate comparable throughput
        - Low-Medium
        - Quantify accuracy advantage vs. competitors; assess model refresh cadence
      - - Carrier rate negotiation leverage (42+ carriers, 400K+ merchants as volume)
        - Carrier consolidation (Delhivery + Ecom Express; XpressBees rationalization)
        - High
        - Obtain carrier contract terms; confirm renegotiation clauses and exclusivity
      - - Freemium acquisition funnel and brand recognition among Indian D2C merchants
        - Amazon ASCS direct substitution; ClickPost enterprise pull from top-tier merchants
        - Medium-High
        - Track cohort conversion from Lite to paid tiers; assess enterprise churn signals
      - - Fulfillment center infrastructure (asset-light ownership model)
        - Delhivery's 18K+ pin-code sortation network and 24M+ sq ft warehousing advantage
        - Medium
        - Assess Shiprocket's fulfillment center count, locations, and utilization vs. plan
      - - Multi-channel OMS position (Engage360, Checkout, Sense)
        - Unicommerce OMS platform bundling ShipSense AI; merchants may prefer single-vendor OMS
        - Medium
        - Confirm integration depth and merchant cohorts using both Unicommerce and Shiprocket
    notes: >-
      Severity ratings are qualitative assessments based on analyst reports, merchant reviews, and
      management commentary. "High" means the threat could materially reduce Shiprocket's revenue
      or margin within 24 months if unaddressed. Carrier contract terms are not publicly disclosed
      in the DRHP at the carrier-by-carrier level — this is a diligence gap.
