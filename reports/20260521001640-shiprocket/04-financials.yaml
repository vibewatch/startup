company:
  name: "Shiprocket"
chapter:
  number: 4
  title: "Financials"
  summary: >
    Shiprocket is one of India's few pre-IPO logistics-tech platforms whose financials are now substantially
    public, thanks to a confidential DRHP filed with SEBI in May 2025 and an Updated Draft Red Herring
    Prospectus (UDRHP) filed on December 12, 2025. FY25 operating revenue reached ₹1,632 crore (24% YoY),
    divided between a mature core domestic-shipping and value-added-tech segment (₹1,306 crore, 80%) and
    an emerging segment spanning cross-border, martech, omnichannel, and payments (₹326 crore, 20%). The
    company turned consolidated cash EBITDA positive at ₹7 crore in FY25 versus a ₹128 crore burn the year
    before, while net loss narrowed 87.5% to ₹74.4 crore, largely because ₹91 crore of ESOP expense
    remained below operating income. Core adjusted EBITDA was ₹156.9 crore (12% margin), confirmed by
    management, and the core segment has been EBITDA positive since FY2022. The revenue model is
    consumption-based: merchants prepay a wallet; per-shipment charges (₹20–45 per 500g depending on
    plan) and subscription plan fees are the principal monetisation levers, with no published take-rate
    percentage. Net Revenue Retention for core merchants was 103.51% in FY25, recovering from 96.27% in
    FY24, though down from 122.64% in FY23 — a material directional signal. Power Merchant ARPU compressed
    from ₹1.44 crore (FY24) to ₹0.88 crore (FY25) before partially recovering to ₹0.94 crore in H1 FY26,
    an adverse trend that requires explanation. Balance-sheet health is reasonable — ₹501.7 crore cash
    and bank balances at March 2025 against ₹233.8 crore total borrowings at September 2025 — but the
    planned IPO of ₹2,342.3 crore (₹1,100 crore fresh issue) targets growth investment, debt repayment,
    and acquisitions, not survival. Acquisition-integration impairments of ₹176.7 crore (Omuni ₹124.6 crore
    and Swiftly/Wigzo ₹52.1 crore) hit FY25 exceptional items and represent the sharpest adverse flag:
    inorganic growth has so far produced write-downs, not incremental EBITDA. Revenue growth decelerated to
    15% in H1 FY26 from 24% in FY25. Key underwriting gaps include gross margin by segment, realised pricing
    versus list pricing, a detailed CAC and payback schedule, actual FLDG utilisation under the ₹200 million
    cap, and the hidden cost of the emerging-segment subsidy that management has not quantified publicly.

sections:
  - id: "revenue-streams"
    title: "Revenue Streams and Monetisation Model"
    body: >
      Shiprocket's revenue is generated entirely from merchant activity on its platform and is structured
      in two reported segments. The Core Business (domestic shipping platform plus Shipping Apps, value-added
      software tools) contributed ₹1,306 crore in FY25, growing 20% YoY; it has been the cash engine of the
      company since FY2022. The Emerging Business — comprising ShiprocketX (cross-border shipping), Shiprocket
      Cargo (B2B bulk), Shiprocket Capital (lending services), Engage360 (WhatsApp-centric martech), Checkout
      (one-click checkout), and Omuni (omnichannel retail) — contributed ₹326 crore in FY25 (+41% YoY), up
      from 11% of total revenue two years prior to 20% now. The primary monetisation mechanism for domestic
      shipping is a consumption-based, prepaid-wallet model: merchants fund a wallet account and per-shipment
      charges are deducted on each order. Revenue is therefore directly coupled to shipment volume, mix (weight,
      zone, plan tier), and active-merchant count. The company does not publish a headline take-rate percentage
      applied to Gross Merchandise Value; the DRHP defines take rate as "the percentage of enabled GMV that an
      e-commerce enablement platform captures as revenue" and uses it as a KPI, but the FY25 absolute take-rate
      figure is not in public materials. Other income of ₹42.8 crore in FY25 (largely interest on cash balances
      and miscellaneous gains) is disclosed separately and not counted in operating revenue. Shiprocket Capital
      currently operates under a "direct selling agent" model and a first-loss default guarantee (FLDG) pilot:
      the company itself earns referral/service fees and bears FLDG exposure capped at ₹200 million, not the
      loan principal. Recurring revenue quality in the core segment is supported by a 103.51% NRR in FY25,
      implying existing cohorts expanded net spending faster than churn cost.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI001]
    figureRefs: [FI001]

  - id: "pricing-monetisation"
    title: "Pricing Model, Plan Economics, and Revenue Mix"
    body: >
      Shiprocket publishes tiered subscription plans that bundle platform access with discounted per-shipment
      rates, creating a two-layer monetisation structure. The Lite plan (free) carries a base domestic rate
      of approximately ₹29 per 500g; the Business plan (₹199/month) drops this to roughly ₹26/500g; the
      Advanced plan (₹499/month, 50–200 orders) to approximately ₹23/500g; and the Pro plan (₹799/month,
      3,000–10,000 orders) to ₹20/500g. These are list rates; actual per-shipment revenue varies by courier
      partner assigned, weight slab, delivery zone, Cash-on-Delivery surcharge, and applicable promotional
      cashback and incentives. The DRHP defines Contribution Margin as Revenue minus Cost of Merchant Solutions,
      communication cost, payment gateway charges, promotional cashback, performance marketing, fulfilment-centre
      costs, and salary of warehouse staff; this is the closest publicly disclosed unit-economics figure, though
      exact values by period are not in the public UDRHP excerpts available. For emerging business segments,
      pricing is varied and not publicly published: ShiprocketX cross-border pricing is quote-based; Engage360
      and Checkout are SaaS subscription models; Shiprocket Capital earns referral and FLDG fees. The Power
      Merchant segment — defined as merchants averaging more than 100 unique monthly transactions — is the
      highest-revenue cohort. Power Merchant ARPU compressed from ₹1.44 crore per merchant in FY24 to
      ₹0.88 crore in FY25 (a 39% decline), which the company attributes partly to the merger of Pickrr
      volumes at lower rates and cohort composition, before recovering slightly to ₹0.94 crore in H1 FY26.
      The absence of a realised pricing table disaggregated by plan tier, courier, and geography is a diligence
      gap that prevents triangulating stated list pricing against reported revenue.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI002]
    figureRefs: []

  - id: "margins-unit-economics"
    title: "Margins, Cost Structure, and Unit Economics"
    body: >
      Shiprocket's largest cost line is "Cost of Merchant Solutions", which rose 20% YoY to ₹1,213 crore in
      FY25 — effectively the pass-through and net logistics cost of fulfilling shipments for merchants, including
      third-party courier payments. This single line represents roughly 74% of operating revenue, establishing
      a structurally thin gross margin characteristic of logistics-aggregator businesses. Employee benefit
      expenses fell 26.8% to ₹314.9 crore (from ₹430 crore in FY24), primarily because ESOP expenses dropped
      from ₹192.6 crore to ₹91 crore, while cash headcount held stable at approximately 1,300 employees. IT
      expenses rose 11.4% to ₹44.9 crore and advertising rose 12.2% to ₹21.1 crore. All other overheads
      (marketing, server, communication, warehouse management, D&A, other) totalled approximately ₹221 crore.
      Total expenses were essentially flat at ₹1,749 crore versus ₹1,709 crore in FY24. The blended unit-cost
      ratio improved to ₹1.07 per rupee earned versus ₹1.30 in FY24. The core segment achieved adjusted EBITDA
      of approximately ₹156.9 crore (12% margin) in FY25, representing 2.2x improvement from FY24, which
      management describes as the "flywheel" funding emerging-segment investment. The emerging segment is still
      loss-making at an EBITDA level, though its cash EBITDA improved 25% YoY. EBITDA margin at the consolidated
      level remains negative at -3.68%. ROCE was -6.1% in FY25. The company's ₹91 crore ESOP charge is a non-
      cash item; removing it would render the business nominally profitable at the consolidated PAT level for
      FY25. Gross margin by segment, contribution margin by plan tier, and CAC / payback are not publicly
      available and are the principal underwriting gaps for unit-economics modelling.
    claimRefs: [CI014, CI015, CI016, CI017, CI018, CI019, CI020, CI021]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: "capital-adequacy"
    title: "Capital Adequacy, Traction, and Financing Path"
    body: >
      At March 31, 2025, Shiprocket held ₹501.7 crore in cash and bank balances, part of ₹1,254.6 crore
      in total current assets. Total borrowings at September 30, 2025 were ₹2,337.85 million (≈₹233.8 crore),
      comprising primarily short-term bank credit and overdraft facilities. The Company Overview chapter
      details the full round-by-round funding chronology; for capital-adequacy purposes the key point is that
      Shiprocket has raised over ₹2,700 crore ($320M+) in cumulative equity across multiple rounds with Temasek,
      LightRock, Bertelsmann, Tribe Capital, Zomato, PayPal, MUFG Bank, and KDT Ventures among investors, and
      reached unicorn status at $1.3 billion valuation in 2022. The company's stated reason for the IPO is
      growth acceleration rather than survival: the CFO explicitly said the business has "a reasonably healthy
      cash balance." Of the planned ₹1,100 crore fresh issue proceeds: ₹294 crore is earmarked for marketing
      and merchant acquisition; ₹211 crore for technology infrastructure; ₹211 crore for debt repayment and
      prepayment; and the remainder for inorganic acquisitions and general corporate purposes including
      fulfilment-centre lease and commission expenses. A pre-IPO placement of up to ₹220 crore is being
      considered, which would reduce the fresh issue size. H1 FY26 net loss of ₹38.3 crore at ₹942.7 crore
      revenue (annualised ~₹1,885 crore) implies the company is operating near breakeven absent ESOP costs.
      The FLDG pilot under Shiprocket Capital is capped at ₹200 million total exposure; no defaults had been
      recorded as of the UDRHP date, but the programme creates contingent liability that scales if the pilot
      expands without external credit enhancement. Acquisition-related borrowings and any future warehouse-lease
      obligations from fulfilment-centre expansion are the principal capital-intensity drivers.
    claimRefs: [CI022, CI023, CI024, CI025, CI026, CI027, CI028, CI029]
    tableRefs: [TI004]
    figureRefs: [FI003, FI004]

  - id: "financial-verdict"
    title: "Financial Verdict: Revenue Quality, Margin Path, and Diligence Blockers"
    body: >
      Shiprocket's financial narrative has materially improved: a 24% revenue CAGR over two years, 87.5%
      loss reduction, cash EBITDA positive for the first time at consolidated level, and a core segment that
      generates real cash profit. The DRHP and UDRHP filings provide more public financial disclosure than most
      Indian pre-IPO logistics startups, enabling a meaningful first-pass underwriting. Revenue quality in the
      core segment is good — consumption-based, recurring, with NRR above 100% in FY25. However, four adverse
      signals temper confidence. First, Power Merchant ARPU compressed 39% YoY in FY25 (₹1.44 crore to ₹0.88
      crore), likely reflecting rate concessions or mix shift from Pickrr integration; while H1 FY26 shows
      partial recovery to ₹0.94 crore, the FY24 peak has not been restored. Second, acquisition integration
      has destroyed capital: ₹124.6 crore Omuni impairment and ₹52.1 crore Swiftly/Wigzo impairment both
      recognised in FY25 as exceptional items confirm that inorganic growth has not converted to EBITDA
      incrementally. Third, revenue growth decelerated to 15% in H1 FY26 from 24% in FY25, raising the
      question of whether the base rate of growth is converging toward logistics-sector norms. Fourth, the
      emerging segment is still EBITDA-loss-making; the ₹157 crore core EBITDA is effectively subsidising
      ₹150+ crore of investment in cross-border, martech, and omnichannel that has not yet earned its cost
      of capital. The following financial inputs remain unavailable for underwriting: gross margin by segment,
      actual Contribution Margin values, realised pricing versus list pricing, CAC by channel, payback period,
      customer-concentration breakdown, free cash flow, warehouse-lease schedule, and detailed FLDG utilisation.
      Diligence should focus on recovering these metrics before any primary investment decision.
    claimRefs: [CI030, CI031, CI032, CI033, CI034, CI035, CI036, CI037]
    tableRefs: [TI005]
    figureRefs: []

