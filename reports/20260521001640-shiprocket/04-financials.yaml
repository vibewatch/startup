figures:
  - id: "FI001"
    title: "Revenue model bridge — from merchant activity to operating revenue and adjusted EBITDA"
    type: flow
    summary: >
      Shiprocket's revenue model is a two-segment, consumption-based funnel. Merchants top up a prepaid wallet,
      generate shipments, and per-shipment charges (the dominant monetisation event) are deducted. Core segment
      profit funds emerging-segment investment. The bridge below shows FY25 actuals where available and
      estimated nodes where the metric is not publicly available.
    claimRefs: [CI001, CI002, CI003, CI004, CI006]
