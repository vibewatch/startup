callouts:
  - calloutType: strength
    title: "AI-Driven Data Flywheel"
    body: >-
      620 million unique transactions and 140 million end-consumer profiles create a data
      asset that continuously improves RTO prediction, courier allocation, and checkout
      conversion models. This moat is cumulative and deepens with scale, making the AI
      platform harder to replicate for newer entrants.
    claimRefs:
      - CE019
      - CE020
      - CE021

  - calloutType: risk
    title: "Top-5 Courier Concentration — No Exclusive Contracts"
    body: >-
      Five courier partners carry 86% of shipment volume as of September 2025, and
      Shiprocket holds no exclusive contracts with any logistics partner. A strategic
      prioritization shift or exit by even one top courier could impair SLAs for the
      majority of merchants, with no contractual backstop. This is the most structurally
      significant operational risk in the product stack.
    claimRefs:
      - CE035
      - CE036

  - calloutType: risk
    title: "User Review Scores Signal Operational Quality Gap"
    body: >-
      GetApp (3.0/5, 33 reviews), Capterra (3.0/5, 33 reviews), and SaaSworthy
      (2.9/5 user rating, 1,000+ ratings) consistently flag billing transparency,
      unexplained wallet deductions, fake delivery attempts, and slow support as
      unresolved issues. These persist despite the AI platform improvements and suggest
      a product-operations gap that impacts merchant trust and retention.
    claimRefs:
      - CE038

  - calloutType: insight
    title: "Asset-Light Model Is a Double-Edged Sword"
    body: >-
      The asset-light aggregator model enables rapid geographic and category expansion
      without capital commitment, but it structurally transfers last-mile service quality
      risk to third-party courier partners. Shiprocket Quick, the hyperlocal product,
      extends this risk to same-day delivery—a segment where consumer expectations are
      especially high and failures are immediately visible.
    claimRefs:
      - CE007
      - CE039

