  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: ISO certification
      missingEvidence: >-
        Specific ISO standard number (e.g., ISO 27001, ISO 27701, ISO 9001) for
        Shiprocket's infrastructure certification, and scope of certified systems.
      whyItMatters: >-
        Different ISO standards have materially different security and compliance
        implications; "ISO-certified" without specification cannot be evaluated for
        adequacy under enterprise procurement requirements.
      diligencePath: >-
        Request the ISO certificate and certification scope letter from Shiprocket in
        due diligence; verify issuing body (BSI, Bureau Veritas, etc.).
      relatedQuestionRefs: [QE005]

    - type: missing-source
      severity: material
      topic: checkout product metrics
      missingEvidence: >-
        Independent verification of Shiprocket Checkout's merchant count, checkout
        GMV handled, and cart-abandonment improvement data from sources other than
        Shiprocket itself.
      whyItMatters: >-
        Checkout is presented as a key high-margin emerging product. Without external
        merchant volume data, its commercial traction cannot be independently assessed.
      diligencePath: >-
        Review DRHP detailed emerging-business revenue breakdown by sub-segment (once
        disclosed), or obtain merchant references using the checkout product.
      relatedQuestionRefs: [QE012, QE023]

    - type: missing-source
      severity: material
      topic: Shunya AI adoption
      missingEvidence: >-
        Verified merchant adoption numbers, active users, revenue contribution, and
        model accuracy benchmarks for Shunya AI beyond the press launch in July 2025.
      whyItMatters: >-
        Shunya AI is positioned as a next-generation product differentiator; without
        adoption data, the claim of serving 1.5 lakh merchants cannot be validated.
      diligencePath: >-
        Request Shunya AI MAU and revenue data in IPO disclosure or pre-IPO diligence
        sessions; seek third-party AI benchmark comparisons.
      relatedQuestionRefs: [QE009]

    - type: missing-source
      severity: material
      topic: developer ecosystem scale
      missingEvidence: >-
        Verified GitHub star counts, public repository commit activity, WordPress
        plugin active-install count, and npm/PyPI download metrics for Shiprocket SDKs.
      whyItMatters: >-
        Developer ecosystem size determines the stickiness of open-platform integrations
        and the quality of the external developer community that extends the platform.
      diligencePath: >-
        Pull live GitHub metrics for github.com/shiprocket; check wordpress.org plugin
        page for active install counts; verify npm package download stats.
      relatedQuestionRefs: [QE024]

    - type: private-evidence-only
      severity: material
      topic: fulfillment center utilization
      missingEvidence: >-
        Utilization rates (% of capacity used) for Shiprocket's 35 fulfillment centers,
        breakdown of owned vs. leased vs. third-party-managed capacity, and per-FC SLA
        performance metrics.
      whyItMatters: >-
        Low utilization inflates fixed costs; high utilization creates risk of service
        disruption during peak seasons. Neither scenario can be assessed without
        utilization data.
      diligencePath: >-
        Request fulfillment network data room with per-FC capacity, utilization, lease
        terms, and renewal dates in pre-IPO diligence.
      relatedQuestionRefs: [QE019]

    - type: enumeration-incomplete
      severity: minor
      topic: competitive comparison
      missingEvidence: >-
        Direct product capability comparison between Shiprocket's checkout, fulfillment,
        and AI tools versus key competitors (GoKwik, Unicommerce, Delhivery's merchant
        solutions) on verifiable feature parity and pricing.
      whyItMatters: >-
        Differentiation claims require competitive context to evaluate whether Shiprocket's
        feature set is truly distinctive or commoditizing.
      diligencePath: >-
        Pull competitor product pages and DRHP/prospectus filings for listed peers;
        conduct structured buyer interviews with merchants using multiple platforms.
      relatedQuestionRefs: [QE012, QE026]

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TE001, TE003, TE004, and TE005 include notes fields with data-source caveats, estimation
      basis, and partial coverage explanations as required by the tableNotes rule. TE002 also
      includes notes marking company-claimed benefits. All notes are present and specific.
  - dimension: unverifiedSource
    reason: >-
      SE025 (Medianama, Dec 2025 IPO coverage) was fetched during research but the specific URL
      path /2025/12/223-shiprocket-ipo/ was not captured in the run-specific fetch log under the
      STARTUP_FETCH_LOG_PATH env; Medianama's IPO reporting is well-established, the article was
      read and its content is consistent with DRHP disclosures, and the factual DPDP compliance
      claim (CE034) is cross-confirmed by SE003 (DRHP filing, reputationTier=high).
