  - id: trust-compliance-risk
    title: "Trust, Compliance & Technical Risk"
    body: >-
      Shiprocket's infrastructure is ISO-certified per the DRHP disclosure, with
      information security protocols described as "robust." Platform uptime was 99.84%
      across all services in March 2025—consistent with SaaS-grade reliability, though
      this is a single-month figure. The weight management system and the independent
      COD remittance cycle address specific merchant trust issues. Shiprocket holds 41
      registered trademarks plus 8 from subsidiaries under India's Trademarks Act, 1999;
      no patent portfolio is disclosed, meaning the IP moat rests primarily on trademark
      protection and proprietary data assets rather than hard patents.

      India's Digital Personal Data Protection Act 2023 and DPDP Rules 2025 apply to
      Shiprocket as a Data Fiduciary, given the scale of consumer address, behavioral,
      and financial data it processes. Key obligations (consent management, data rights,
      breach notification) phase in through May 2027, creating a compliance tail risk
      for an IPO-stage company. User review aggregators show mixed signals: GetApp and
      Capterra rate the platform 3.0/5 (33 reviews each), and SaaSworthy users give 2.9/5
      (1,000+ ratings), with recurring complaints about unexplained wallet deductions,
      support responsiveness, fake delivery attempts, and billing transparency. These
      signals indicate a product-quality gap in customer-facing operational reliability
      that AI-driven logistics alone has not yet closed. The top-5 courier concentration
      (86% of volume) and the absence of exclusive contracts with partners are the most
      structurally significant risks: a major courier exit or prioritization shift would
      degrade SLAs immediately across a majority of shipments. Slow integration of Pickrr
      and Omuni (Omuni impaired ₹124.6 Cr in FY25) raises questions about whether
      Shiprocket's modular architecture genuinely absorbs acquired capabilities or
      simply runs them in parallel.
    claimRefs:
      - CE032
      - CE033
      - CE034
      - CE035
