  - id: ai-intelligence
    title: "AI/ML Intelligence & Innovation Layer"
    body: >-
      Shiprocket has deployed AI and ML models across multiple operational functions.
      The courier recommendation engine ranks carriers by historical performance,
      cost, and PIN-code-level success rates, with fallback rules for route blocking
      and custom merchant configurations. The RTO prediction model flags high-risk
      orders before dispatch; combined with the checkout-level RTO address filter and
      COD-to-prepaid nudge, this is the platform's most commercially differentiated AI
      application. The EDD prediction system (75.26% accuracy in H1 FY26) uses past
      shipment data to surface delivery-date confidence at checkout. The NDR panel adds
      address score intelligence to triage failed delivery attempts. Engage360 uses
      AI-generated consumer insights from 140 million end-consumer profiles to enable
      targeted WhatsApp marketing campaigns. Shiprocket Co-Pilot is an AI-driven account
      management tool for real-time operational recommendations.

      In July 2025, Shiprocket launched Shunya AI—described as India's first sovereign
      multimodal AI engine for MSMEs. Shunya AI supports voice, text, and image inputs
      in 9+ Indian languages and is hosted on Cloudfiniti (Larsen & Toubro) GPU
      infrastructure, keeping all data within India for regulatory compliance.
      Capabilities include automated cataloguing, bilingual product listings, GST-compliant
      invoice generation, WhatsApp voice-to-order automation, and AI agent functions for
      logistics and delivery recommendations. It is priced at ₹499 per month (freemium
      with 25 free queries). The platform aims to serve 1.5 lakh merchants. The IPO
      proceeds earmark ₹211 crore for technology investment, a portion of which targets
      AI infrastructure and model improvement. Data asset breadth—620 million unique
      transactions from inception to September 2025—is a material moat if used to train
      proprietary models that competitors cannot replicate.
