summary:
  headline: >-
    Shiprocket combines real platform scale, improving unit economics, and strong cohort stickiness, but litigation
    overhang, courier concentration, and a stretched $1.21B private mark justify a TRACK stance until IPO pricing is
    visible.
  overallScore: 6.4
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
