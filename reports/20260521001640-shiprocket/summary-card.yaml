  topStrengths:
    - >-
      Category leader in Indian merchant shipping and commerce enablement, with disclosed scale, 42 active courier
      partners, and broad product adjacency beyond core shipping.
    - >-
      Financial disclosure improved sharply post-UDRHP, revealing FY25 revenue of ₹1,632 crore, positive cash EBITDA,
      and core-business profitability since FY2022.
    - >-
      Core-business NRR of 103.51% and long-run merchant cohort compounding indicate real platform stickiness rather
      than purely transactional usage.
    - >-
      Asset-light model reduces fleet and warehouse capex burden relative to integrated logistics peers, supporting
      faster product expansion and partner-based reach.
  topRisks:
    - >-
      Top five courier partners accounted for 83.33% of FY25 shipment volume, creating material partner leverage and
      service-quality dependence.
    - >-
      SEBI filing discloses active criminal, tax, and civil matters including an FIR against founders; legal overhang
      remains meaningful ahead of IPO.
    - >-
      The emerging segment is growing but still appears margin-dilutive, while FY25 acquisition impairments show that
      inorganic expansion has not yet translated cleanly into EBITDA.
    - >-
      At roughly 6.2x FY25 revenue, the $1.21B private mark demands a software-style premium over public logistics comps
      before IPO pricing is even known.
    - >-
      Merchant-scale disclosures are inconsistent between 4 lakh+ cumulative businesses scaled and 165,231 FY2025 active
      merchants, limiting confidence in headline customer narratives.
  unresolvedGaps:
    - >-
      Exact cumulative funding is not fully reconciled across public databases; reported totals range above $320M and
      higher in some trackers.
    - >-
      Gross margin, realised take rate by shipment, and segment-level profitability for cross-border, martech, and
      fulfillment remain undisclosed.
    - The legal outcomes of founder-related FIR matters and newer consumer / subsidiary proceedings remain unresolved.
    - >-
      IPO valuation range, price band, and public-market appetite are not yet known, making current entry discipline
      highly sensitive to listing terms.
    - >-
      Current active-merchant trend after H1FY26 decline versus FY2025 is unclear, and true merchant churn is not
      publicly disclosed.
