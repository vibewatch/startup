  - id: SO-scale
    title: Scale snapshot and commercial metrics
    body: >-
      As of the most recent public disclosures (UDRHP, FY25 filings, company statements), Shiprocket markets a cumulative
      "4 lakh+ businesses scaled" claim while DRHP-filed active merchants were 165,231 in FY2025; it covers 19,000+
      serviceable pin codes across India and delivers to 220+
      countries and territories globally. As of September 30, 2025, the company had 42 active courier partners, with
      the top 5 accounting for approximately 86% of total shipment volumes—a courier concentration risk prominently
      flagged in the DRHP risk factors. Shiprocket holds no exclusive contracts with its logistics partners, meaning
      partners may prioritize competitors or exit relationships. The company operates 42+ fulfillment centers.


      Financial performance has improved substantially in FY25. Revenue from operations grew 24% YoY to Rs 1,632
      crore from Rs 1,316 crore in FY24. Core business revenue grew over 20% YoY to Rs 1,306 crore, contributing
      80% of total revenue. The company turned cash EBITDA positive at Rs 7 crore in FY25, versus a cash EBITDA
      burn of Rs 128 crore in FY24. Net loss narrowed 87.5% to Rs 74.5 crore in FY25 from Rs 595 crore in FY24
      (the latter inflated by Rs 240 crore exceptional charges and Rs 192 crore ESOP expenses). H1 FY26
      (April–September 2025) revenue reached Rs 942.7 crore, up 15% YoY, with net loss of Rs 38.3 crore (down 10%
      YoY). The company had Rs 501.7 crore in cash and bank balances as of March 2025. Employee headcount was
      approximately 1,300 as of FY25, stable year-on-year. Total expenditure in FY25 was approximately Rs 1,749
      crore, marginally higher than Rs 1,709 crore in FY24; employee benefit expenses fell 26.8% to Rs 314.9 crore.
