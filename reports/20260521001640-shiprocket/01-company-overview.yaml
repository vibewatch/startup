figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Shiprocket's public chronology runs from a 2011 incorporation through 2017 platform launch, a 2021–2022
      unicorn fundraising and M&A cluster, FY24 integration stress, and FY25 recovery into cash EBITDA profitability
      ahead of a targeted H1 FY27 IPO.
    data:
      items:
        - date: '2011-09-28'
          label: Incorporated as Bigfoot Retail Solutions
          detail: Legal entity formed in New Delhi; founding directors Gautam Kapoor and Saahil Goel.
          tone: neutral
        - date: '2017-01-01'
          label: Shiprocket platform launch
          detail: Multi-carrier aggregator for D2C brands and online sellers officially launched by co-founders.
          tone: positive
        - date: '2021-12-01'
          label: "Series E / unicorn at $1.3B"
          detail: Temasek and LightRock led approximately $185M round; unicorn milestone achieved.
          tone: positive
        - date: '2022-06-01'
          label: Pickrr acquisition ~$200M
          detail: Largest acquisition; added 40%+ shipment volume but integration costs surged through FY24.
          tone: neutral
        - date: '2022-08-01'
          label: "Series E extension at $1.3B"
          detail: LightRock/Temasek-led $32M top-up; Omuni and Wigzo integrations underway.
          tone: neutral
        - date: '2024-12-17'
          label: "Series E3 at $1.21B valuation"
          detail: Rs 219 Cr from KDT Ventures, MUFG Bank, Tribe Capital; flat-to-down round.
          tone: warning
        - date: '2025-03-31'
          label: FY25 — cash EBITDA positive
          detail: Revenue Rs 1632 Cr (+24% YoY); net loss Rs 74.5 Cr (down 87.5%); cash EBITDA Rs 7 Cr.
          tone: positive
        - date: '2025-12-12'
          label: UDRHP filed — Rs 2342 Cr IPO
          detail: Fresh issue Rs 1100 Cr; OFS Rs 1242 Cr; H1 FY27 IPO targeted.
          tone: positive
    approximationNotes: >-
