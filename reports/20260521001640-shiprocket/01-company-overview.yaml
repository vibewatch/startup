callouts:
  - calloutType: strength
    title: Improving financial trajectory heading into IPO
    body: >-
      The 87.5% reduction in net losses (Rs 595 Cr to Rs 74.5 Cr) and the turn to cash EBITDA positivity in FY25
      support a credible path toward accounting profitability. The core business has been cash EBITDA positive for
      five consecutive years, providing a durable margin engine that funds emerging-segment investment.
    claimRefs:
      - CO036
      - CO037
      - CO038
      - CO039
  - calloutType: risk
    title: Acquisition integration and courier concentration are material risks
    body: >-
      The DRHP explicitly flags slow integration of Pickrr, Omuni, and Wigzo as risks. Omuni and Wigzo each
      suffered impairment losses in FY25 (Rs 124.6 Cr and Rs 52.1 Cr respectively). Separately, the top 5 courier
      partners account for approximately 86% of shipment volumes with no exclusive contracts, creating revenue
      concentration and delivery reliability exposure.
    claimRefs:
      - CO050
      - CO051
      - CO052
      - CO053
  - calloutType: risk
    title: FIR against founders is an active adverse legal disclosure
    body: >-
      The UDRHP discloses a first information report filed by a third party against the company's owners including
      Saahil Goel. This is a live legal risk that diligence must independently assess, including the identity of
      the complainant, the nature of the allegations, and status of any judicial proceedings.
    claimRefs:
      - CO019
      - CO020
  - calloutType: insight
    title: Flat-to-down round in December 2024 despite strong revenue growth
    body: >-
      The December 2024 Series E3 was conducted at an estimated $1.21 billion, slightly below the $1.3 billion
      unicorn valuation of August 2022, even though revenue more than doubled in the intervening two fiscal years.
      This valuation compression likely reflects risk-adjusted pricing for ongoing net losses and integration
      challenges. The IPO will be the primary price-discovery event.
    claimRefs:
      - CO022
      - CO024
      - CO025
      - CO029

