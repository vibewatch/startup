  - id: SO-capital
    title: Funding history, valuation, and investor map
    body: >-
      Shiprocket has raised over $320 million across multiple rounds from 2013 through December 2024. The company
      achieved unicorn status in August 2022 when it raised approximately $32 million in a Series E extension at a
      $1.3 billion post-money valuation led by Temasek and LightRock. The December 2024 Series E3 extension—Rs 219
      crore (approximately $26 million) led by KDT Ventures, with participation from MUFG Bank, Tribe Capital, SAI
      Global, Huddle Ventures, and Agility International—was conducted at an estimated $1.21 billion post-money
      valuation per Fintrackr analysis of RoC filings. This represents a slight step-down from the $1.3 billion
      unicorn valuation, despite revenue more than doubling over the prior two fiscal years.


      The capital history reflects both strategic and financial investors. Early rounds (Seed 2013, Series A 2014
      and 2016) were led by 500 Global, Bertelsmann India Investments (now Bertelsmann Nederland B.V.), and
      Nirvana Ventures. Series B (2017–18) consolidated Bertelsmann's position. Series C (2020–21), Series D
      (mid-2021), and a strategic investment from Zomato (now Eternal Limited) preceded the large Series E round of
      approximately $185 million in December 2021. Bertelsmann Nederland B.V. emerged as the largest external
      institutional stakeholder per TheKredible data. Eternal (formerly Zomato) holds approximately 6.85% and
      Temasek approximately 5.29%.


      The proposed IPO of Rs 2,342 crore—comprising a fresh issue of Rs 1,100 crore and an OFS of Rs 1,242 crore
      by existing shareholders including LightRock, Tribe Capital, Bertelsmann, Arvind Ltd, and co-founders—
      represents the primary liquidity pathway. IPO proceeds are earmarked for marketing (Rs 294 crore),
      technology (Rs 211 crore), debt repayment (Rs 211 crore), inorganic acquisitions, and general corporate
      purposes. The UDRHP was filed with SEBI in December 2025; the company targets an IPO in H1 FY27.
