  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: courier-concentration
      missingEvidence: >-
        Exact revenue and volume split by each of the top 5 courier partners and the terms of service agreements;
        whether Shiprocket has minimum commitment arrangements that partially mitigate concentration risk.
      whyItMatters: >-
        DRHP flags that top 5 couriers control approximately 86% of volume with no exclusive contracts; any
        partner departure or renegotiation could significantly disrupt operations and margins.
      diligencePath: >-
        Data room review of all logistics partner agreements, volume and revenue by partner per quarter, and any
        contractual protections, SLAs, or transition plans for partner replacement.

    - type: private-evidence-only
      severity: material
      topic: fir-adverse-legal
      missingEvidence: >-
        Identity of the third-party complainant, nature of the FIR allegations, current judicial status, and any
        legal advice received by the company on likely outcome or settlement.
      whyItMatters: >-
        An unresolved FIR naming the MD/CEO creates personal liability and potential regulatory risk for the IPO
        process; SEBI may require disclosure or clarification before approving the listing.
      diligencePath: >-
        Legal data-room review of the FIR filing, judicial order sheet, company's formal legal position, and any
        indemnity or D&O insurance coverage applicable to the founders.

    - type: private-evidence-only
      severity: material
      topic: cap-table-reconciliation
      missingEvidence: >-
        Fully reconciled cap table showing exact pre-IPO stakes for all institutional investors including
        Bertelsmann, LightRock, PayPal, March Capital, and CCPS conversion ratios and liquidation preferences.
      whyItMatters: >-
        Valuation chapter and return-scenario analysis cannot be completed without knowing exact dilution,
        preference stack, and fully diluted share count.
      diligencePath: >-
        Data room: cap table, SHA with all parties, CCPS conversion terms, and any side letters with priority
        shareholders.
      relatedQuestionRefs:
        - QO005
        - QO006
        - QO007

    - type: enumeration-incomplete
      severity: material
      topic: acquisitions-integration-outcomes
      missingEvidence: >-
        Detailed standalone P&L for Pickrr, Omuni, and Wigzo post-acquisition; integration roadmap with
        milestones and current completion status for each acquired entity.
      whyItMatters: >-
        Two acquisitions (Omuni, Wigzo) have already been impaired; Pickrr is the largest acquisition by deal
        size; understanding whether integration is complete is critical for FY26 margin and profitability outlook.
      diligencePath: >-
        Data room: subsidiary P&Ls, consolidation adjustments, management-reported integration KPIs, and any
        revised business plans for Pickrr, Omuni, and Swiftly.
      relatedTableRefs:
        - TO004
      relatedQuestionRefs:
        - QO017

    - type: missing-source
      severity: minor
      topic: eternal-commercial-relationship
      missingEvidence: >-
        Evidence of any ongoing commercial relationship between Eternal Limited (Zomato) and Shiprocket beyond
        the equity investment; data on whether Eternal merchants use Shiprocket's logistics or checkout products.
      whyItMatters: >-
        The strategic rationale for Eternal's $75M investment is unclear if it is purely financial; any commercial
        dependency or synergy is relevant to understanding customer concentration and revenue defensibility.
      diligencePath: >-
        Review Eternal's annual reports for any disclosure of Shiprocket partnership; ask Shiprocket for
        commercial contracts or data-sharing arrangements with Eternal.
