  - id: SO-leadership
    title: Founders, leadership, board, and governance
    body: >-
      Shiprocket was co-founded in 2017 by Saahil Goel, Vishesh Khurana, Akshay Ghulati, and Gautam Kapoor.
      Saahil Goel serves as Managing Director and Chief Executive Officer and has been a director since
      September 30, 2011; he was appointed MD and CEO by a board resolution dated December 14, 2023 for a
      five-year term. He holds a BSc in Business from Western International University, Arizona and an MBA/MSc
      from the Joseph M. Katz Graduate School of Business, Pennsylvania, and previously held roles at Max New
      York Life Insurance and SDLC Partners LP. Gautam Kapoor is Executive Director and Chief Operating Officer,
      also a director since the company's founding date of September 28, 2011, responsible for day-to-day
      operations and execution of strategic initiatives; he holds a BCom from Delhi University and a BSc in
      Business from Western International University. Tanmay Kumar serves as Chief Financial Officer and has been
      the primary financial spokesperson in FY25 results communications.


      The board comprises seven directors as of the UDRHP filing. Arjun Sethi (Non-Executive Director since
      October 8, 2020) is affiliated with Tribe Capital and brings venture and technology operating experience.
      Four independent directors—Chetan Kumar Mathur, Kaushik Dutta, Vani Gupta Dandia, and Brijesh Kumar
      Agrawal—were appointed in 2024–2025 as part of pre-IPO governance strengthening. Vishesh Khurana and
      Akshay Ghulati remain individual selling shareholders in the proposed IPO but do not hold named board
      directorships per the UDRHP.


      Key-person concentration is a material governance risk. The business strategy, investor relationships, and
      public positioning are closely identified with Saahil Goel. The DRHP also discloses a first information
      report (FIR) filed by a third party against the company's owners including Saahil Goel, creating a live
      adverse regulatory item that diligence must track. A separate litigation was filed by QNT Sports India
      Private Limited against Pickrr (a subsidiary) before a Chief Judicial Magistrate in October 2024.
      Kaushik Dutta, an independent director of Shiprocket, also sits on the board of Eternal Limited (formerly
      Zomato), creating a board-level connection between Shiprocket and its strategic investor.
