  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: take-rate monetisation model
      missingEvidence: >-
        Precise take-rate breakdown by service line (shipping aggregation vs fulfilment vs
        checkout vs cross-border) that would let an investor model downside scenarios under
        ONDC commission pressure.
      whyItMatters: >-
        The SOM calculation depends on take rate applied to enabled GMV; without segment-level
        take-rate data the revenue opportunity estimate has wide uncertainty bounds.
      diligencePath: >-
        Request segment-level revenue and enabled GMV from Shiprocket management; cross-reference
        with Unicommerce peer disclosures and DRHP revenue-by-segment tables.
      relatedQuestionRefs:
        - QM028

    - type: stale
      severity: minor
      topic: AI-driven logistics cost reduction
      missingEvidence: >-
        Independent third-party validation of the 18–25% logistics cost reduction figure
