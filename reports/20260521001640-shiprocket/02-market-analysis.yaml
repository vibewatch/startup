chapter:
  number: 2
  title: Market Analysis
  summary: >-
    India's horizontal e-commerce enablement ecosystem offered a $92–101 billion gross merchandise
    value opportunity for new-age platforms in CY 2024, with the ecommerce logistics sub-market
    sized at $7–20 billion by various analysts at 9–20% CAGR. Shiprocket's primary addressable
    market—Direct Commerce—generated $7–9 billion GMV in CY 2024 and is expected to grow at
    20–25% CAGR through CY 2029, anchored by 60 million MSMEs, a rapidly expanding D2C sector,
    and tier-2/3 city digital adoption. Structural constraints including 20–39% RTO rates,
    cash-on-delivery dominance, courier network dependence, and ONDC-driven margin pressure
    moderate but do not negate the growth outlook for a well-positioned enablement platform.

sections:
  - id: market-boundary
    title: Market Boundary and Scope
    body: >-
      Shiprocket operates at the intersection of three spending pools: online commerce (direct brand
      websites and marketplace-assisted channels), offline/social commerce (digitally enabled
      hyperlocal and WhatsApp-driven sales), and cross-border merchandise exports. Together these
      represent a gross merchandise value (GMV) opportunity of ₹7.7–8.4 trillion ($92–101 billion)
      for new-age end-to-end horizontal e-commerce enablement platforms in CY 2024, according to
      Redseer analysis commissioned for the SEBI UDRHP. Within that broad canvas, Direct Commerce
      (merchants selling via owned websites without intermediary commission) generated $7–9 billion
      GMV and accounted for 10–13% of online retail; cross-border merchandise retail contributed
      approximately $60 billion GMV; and digitally enabled social commerce added $1.4–2.2 billion.
      Offline in-store orders serviced through platform logistics add another $20–24 billion.
      India's broader ecommerce market stood at $125 billion in 2024 and is projected to reach
      $345 billion by 2030 at an 18.4% CAGR. Excluded from Shiprocket's primary addressable
      spend are pure marketplace transaction fees (Amazon/Flipkart take rates), grocery quick
      commerce infrastructure (Blinkit/Zepto dark stores), and B2B industrial procurement.
      Status-quo substitutes include single-courier direct contracts, captive logistics arms of
      large retailers, and spreadsheet-based COD reconciliation—methods that Shiprocket's
      multi-courier aggregation and tech stack directly displace.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
    tableRefs:
      - TM001

  - id: market-sizing
    title: Market Sizing Across Multiple Lenses
    body: >-
      Analyst estimates for the Indian ecommerce logistics market diverge materially, reflecting
      different scope definitions and proprietary modelling assumptions. Mordor Intelligence
      places the 2026 market at $7.25 billion, growing to $11.14 billion by 2031 at an 8.98%
      CAGR—the most conservative estimate, anchored in narrow logistics-only spend. IMARC Group
      arrives at $19.54 billion for 2025, projected to reach $103.83 billion by 2034 at a 20.39%
      CAGR, likely incorporating broader fulfilment and value-added services. OMR Global sizes
      the 2025 market at $10.8 billion with a 2035 target of $46.8 billion (15.8% CAGR). MarkWide
      Research sets 2026 at $8.7 billion growing to roughly $27 billion by 2035 at 18.4%. These
      estimates represent a roughly 3× spread between the floor (Mordor) and ceiling (IMARC),
      emphasising that methodology and scope choices drive as much variance as economic assumptions.
      The SEBI UDRHP Redseer analysis provides the most granular SAM view for Shiprocket: Direct
      Commerce GMV of $7–9 billion in CY 2024 growing at 20–25% CAGR to CY 2029, giving a Direct
      Commerce SAM of roughly $17–27 billion by 2029. Broadening to include marketplace logistics,
      Shiprocket's effective SAM aligns with mid-range ecommerce logistics estimates of $10–14
      billion in 2026. India's D2C ecommerce market (the demand-side proxy) was $87.5 billion in
      2025 by Mordor Intelligence, expanding at 24.3% CAGR to $322.1 billion by 2031—providing
      structural demand pull. The contradictions across reports are preserved here as a diligence
      signal: no single estimate should anchor valuation analysis without scope reconciliation.
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
