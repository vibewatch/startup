      whyItMatters: >-
        If AI cost-reduction claims are overstated, merchant ROI calculations and Shiprocket's
        value proposition messaging may not hold up to scrutiny during IPO due diligence.
      diligencePath: >-
        Review Shiprocket's own cost-per-shipment trend data (available in DRHP historical
        financials); benchmark against Delhivery and Shadowfax per-unit cost disclosures.
      relatedQuestionRefs:
        - QM020

    - type: conflicting-data
      severity: material
      topic: ecommerce logistics market size
      missingEvidence: >-
        Scope-reconciled comparison of Mordor ($6.65B), OMR ($10.8B), and IMARC ($19.54B)
