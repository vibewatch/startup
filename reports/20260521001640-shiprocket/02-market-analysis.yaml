callouts:
  - calloutType: insight
    title: Contradictory Market Size Estimates Signal Scope Ambiguity
    body: >-
      Published analyst estimates for the Indian ecommerce logistics market span a nearly 3×
      range ($6.65B to $19.54B for 2025), driven entirely by scope definition rather than
      economic disagreement. Mordor Intelligence uses a narrow logistics-only definition while
      IMARC appears to include broader fulfilment and value-added services. Investors should
      require scope-adjusted comparisons before using any single estimate in a valuation model.
      The Redseer/DRHP Direct Commerce GMV sizing ($7–9B SAM) is the most relevant anchor
      for Shiprocket because it is methodology-transparent and audited through the IPO disclosure process.
    claimRefs:
      - CM007
      - CM008
      - CM014

  - calloutType: risk
    title: RTO Structural Headwind Compresses Both Merchant and Platform Economics
    body: >-
      RTO rates of 20–39% represent the market's most acute structural challenge, not a
      temporary aberration. Every undelivered order costs the merchant twice (forward + return
      shipping) with zero revenue, and reduces Shiprocket's take-rate revenue on the failed
      transaction. COD dominance—with 58% festive-season return rates on COD orders—makes
      this a systemic constraint tied to payment behaviour, not courier quality. While
      Shiprocket's NDR tooling and address intelligence reduce RTO, broader adoption among
      price-sensitive MSME sellers remains limited.
    claimRefs:
      - CM032
      - CM033
      - CM034

  - calloutType: assumption
    title: ONDC Take-Rate Risk is Medium-Term, Not Immediate
    body: >-
      ONDC's open commerce protocol could compress platform take rates over a 3–5 year horizon
      as logistics APIs become interoperable. However, Business Standard reporting (May 2025)
      documents significant fragmentation and adoption friction in ONDC, moderating the near-term
      disruption risk. Shiprocket's current ~1–2% take rate on enabled GMV has headroom above
      ONDC's ~3% commission ceiling on the discovery layer—the risk is that ONDC lowers the
      floor for the broader aggregation value proposition rather than directly competing.
    claimRefs:
      - CM035
      - CM038

