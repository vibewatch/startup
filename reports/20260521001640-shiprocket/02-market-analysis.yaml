  - id: constraints
    title: Adoption Constraints and Market Risks
    body: >-
      The Indian ecommerce market's structural constraints create both platform risk for Shiprocket
      and barriers to merchant adoption. The most acute is the return-to-origin (RTO) problem:
      Unicommerce's dataset of 6,000+ D2C brands and 410 million FY2026 shipments shows RTO
      spiked to 39.2% at the November 2025 festive peak, with COD orders returning at a 58%
      rate during the festive quarter. Brands that adopted prepaid incentives, pin-code-level
      courier routing, and address verification reduced their RTO to 21% by March 2026—but
      most small merchants lack the operational sophistication to implement these fixes. This
      creates a revenue and margin drag for both merchants and the platform. Courier network
      dependence is a second structural risk: while Shiprocket's 42+ courier partners reduce
      single-courier concentration, last-mile performance remains contingent on underlying
      carrier quality in remote geographies. Consumer court complaints and review-platform data
      document repeated instances of unresolved delivery failures and disputed COD settlements.
      Last-mile delivery itself accounts for 40–55% of total logistics expenditure, and rising
      real estate costs in major fulfillment corridors along with diesel price volatility
      compress operator margins. On the regulatory front, India's Digital Personal Data
      Protection Act creates compliance overhead for cross-border data flows, and ONDC's
      open-protocol architecture could commoditise shipping aggregation over time by enabling
      smaller logistics providers to compete on a level API surface. Business Standard reporting
      confirms ONDC has faced adoption friction and fragmented buyer-seller experience, moderating
      near-term market disruption risk but sustaining longer-term structural pressure on
      platform take rates. Cash-on-delivery preference among 70% of non-metro shoppers means
      working-capital cycles remain stretched for merchants, creating credit demand that
      Shiprocket's financing products must address to maintain merchant stickiness.
    claimRefs:
      - CM032
      - CM033
      - CM034
      - CM035
      - CM036
      - CM037
      - CM038

