            title: AI-Driven Data Flywheel
            body: >-
              620 million unique transactions and 140 million end-consumer profiles create a data asset that
              continuously improves RTO prediction, courier allocation, and checkout conversion models. This moat is
              cumulative and deepens with scale, making the AI platform harder to replicate for newer entrants.
