  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - NRR retreats below 100%
        - Core NRR < 100% in any two consecutive reporting periods (H1/H2)
        - Converts net-expansion story to net-churn; destroys SaaS premium; reduces justified multiple to 3–3.5x
        - Downgrade to AVOID; mark private position to bear case (₹5,700 crore cap)
      - - Power Merchant ARPU fails to recover
        - Power ARPU stays below ₹0.90 crore through FY26E
        - Revenue concentration risk; top cohort not growing; implies pricing or volume weakness beyond Pickrr mix
        - Downgrade to RESEARCH-MORE; require gross-margin disclosure before further commitment
      - - IPO priced below ₹8,000 crore market cap
        - Price band implies market cap < ₹8,000 crore (3.6x FY25 / ~4.3x FY26E revenue)
        - Negative return vs. Dec 2024 $1.21B private mark; OFS at these levels signals insider exits at a markdown
        - Avoid IPO allocation; evaluate post-listing at ≤4x NTM revenue after 90-day lock-up
      - - Repeat acquisition impairment > ₹100 crore
        - Additional goodwill/intangible write-down > ₹100 crore in any FY
        - >-
          Sustained inorganic value destruction; undermines capital-allocation discipline; reduces book net worth
          pre-IPO
        - Demand full acquisition pipeline review; pause exposure; revise thesis from TRACK to RESEARCH-MORE
      - - Delhivery enters SME merchant segment at scale
        - Delhivery SME merchant count > 200,000 by FY27E (vs. ~100,000 today)
        - Structural threat to Shiprocket's primary moat — direct competition at identical merchant segment
        - Downgrade to AVOID; category risk becomes base case
      - - Emerging-segment EBITDA loss neutralises core
        - Emerging EBITDA loss > ₹200 crore on consolidated basis
        - >-
          Core cash engine (₹157 crore EBITDA) neutralised; company net cash-burning at scale; PAT breakeven delayed
          beyond FY29
        - Demand sub-segment P&L disclosure; pause investment until emerging trajectory visible
    notes: >
      Trigger thresholds are defined by the analyst based on public evidence and comparable benchmarks. They represent
      the levels at which the thesis assumptions materially break. Transmission and action implications are directional;
      final investment decisions require updated financial disclosures and legal and compliance review.
    claimRefs:
      - CV025
      - CV027
      - CV031
      - CV039
      - CV043
      - CV044
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters for Valuation
      - Diligence Path
    rows:
      - - Segment gross margins
        - 'Gross margin (revenue minus direct COGS) by segment: core domestic shipping vs. each emerging sub-segment'
        - >-
          Required to verify whether the 12% core EBITDA margin is structural vs. mix-driven; validates the SaaS premium
          vs. logistics discount
        - CFO management accounts; compare Unicommerce public SaaS gross margin (~58%) as proxy for SaaS layer
      - - Realised ASP per shipment
        - Actual realised revenue per shipment net of promotional cashbacks, by plan tier and geographic zone
        - >-
          Bridges list pricing (₹20–45/500g) to reported ₹1,632 crore revenue; explains Power ARPU compression from
          ₹1.44 crore to ₹0.88 crore
        - CFO management accounts; DRHP average-revenue-per-unique-transaction metric by plan tier
      - - CAC and payback period
        - >-
          Customer acquisition cost by channel (performance marketing, outbound, referral) and payback period by plan
          tier
        - >-
          Required to evaluate ₹294 crore marketing allocation (largest IPO use of proceeds); without payback, ROI of
          the largest investment is unknown
        - Channel-level marketing spend vs. new merchant cohort data from CFO; compare to cohort revenue curves
      - - Emerging-segment sub-P&L
        - 'EBITDA loss disaggregated by sub-segment: ShiprocketX, Engage360, Checkout, Omuni, Cargo, Capital'
        - >-
          Determines which sub-segment is closest to breakeven; guides capital allocation priority for acquisition
          budget
        - >-
          Management accounts with sub-segment P&L; compare disclosed aggregate emerging EBITDA improvement (25% YoY) to
          sub-segment level
      - - FLDG utilisation and credit quality
        - Current FLDG utilisation vs. ₹200 million cap; merchant credit quality in Shiprocket Capital book
        - >-
          Contingent liability scale is unknown; if Capital scales, FLDG exposure could materially impair; no default
          history ≠ low risk
        - >-
          Shiprocket Capital loan book: outstanding FLDG balances, merchant CIBIL distribution, default rate by product
          type
      - - Residual acquisition goodwill
        - >-
          Residual goodwill and intangibles from Glaucus, Pickrr portfolio after Omuni (₹124.6 crore) and Wigzo (₹52.1
          crore) write-downs
        - >-
          Further impairments possible from remaining portfolio; impairments reduce book net worth and could affect IPO
          anchor price
        - >-
          Current carrying values of all acquisition goodwill/intangibles; auditor recoverable-value assessment for each
          remaining entity
    notes: >
      Evidence gaps are ranked by valuation materiality. All six items represent private data not available in the
      public UDRHP or third-party sources. These constitute the minimum due-diligence requirements before underwriting
      the 6.2x FY25 revenue multiple at private entry or IPO allocation.
