  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Platform Reach
        blocks:
          - type: paragraph
            body: >
              Shiprocket defines its merchant universe as MSMEs (businesses with annual revenue below ₹2,500 million)
              and Large Retailers (above ₹2,500 million revenue per annum). As of the six months ended September 30,
              2025 (H1FY26), the platform counted 145,269 Active Merchants — merchants who conducted at least one
              transaction during the period. The company's marketing materials reference "4 lakh+ businesses scaled,"
              but this is a cumulative all-time figure and must not be conflated with the SEBI-filed active merchant
              count of 145,269 for H1FY26 or 165,231 for FY2025. The marketing figure exceeds the active count because
              it captures every merchant who ever transacted on the platform, including those who have since churned or
              reduced activity.


              Power Merchants — those averaging more than 100 unique transactions per active month — numbered 8,596 in
              H1FY26 (5.92% of the active base), and their per-merchant ARPU was ₹0.94 million for the six-month period,
              implying they collectively drive an estimated high-majority share of platform revenue even though they
              represent a small fraction of the merchant count. The non-power majority (136,673 merchants) contributes
              the long tail of volume at substantially lower ARPU. Cross-border merchants served by ShiprocketX numbered
              4,555 in H1FY26 with ₹3,115.8 million aggregate GMV — still a small but rapidly growing segment (3.1% of
              active merchants). Fulfillment customers (using Shiprocket's warehouse and 3PL network) represent another
              sub-segment; the company claims 1,000+ ecommerce businesses for fulfillment, though a precise active count
              is not separately disclosed in the DRHP. Tier 2 and Tier 3 city sellers are an explicit strategic target,
              served through geo-targeted digital marketing, radio campaigns on regional FM stations, and planned new
              regional offices.
