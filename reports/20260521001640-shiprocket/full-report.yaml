      - number: '4.3'
        title: Margins, Cost Structure, and Unit Economics
        blocks:
          - type: paragraph
            body: >
              Shiprocket's largest cost line is "Cost of Merchant Solutions", which rose 20% YoY to ₹1,213 crore in FY25
              — effectively the pass-through and net logistics cost of fulfilling shipments for merchants, including
              third-party courier payments. This single line represents roughly 74% of operating revenue, establishing a
              structurally thin gross margin characteristic of logistics-aggregator businesses. Employee benefit
              expenses fell 26.8% to ₹314.9 crore (from ₹430 crore in FY24), primarily because ESOP expenses dropped
              from ₹192.6 crore to ₹91 crore, while cash headcount held stable at approximately 1,300 employees. IT
              expenses rose 11.4% to ₹44.9 crore and advertising rose 12.2% to ₹21.1 crore. All other overheads
              (marketing, server, communication, warehouse management, D&A, other) totalled approximately ₹221 crore.
              Total expenses were essentially flat at ₹1,749 crore versus ₹1,709 crore in FY24. The blended unit-cost
              ratio improved to ₹1.07 per rupee earned versus ₹1.30 in FY24. The core segment achieved adjusted EBITDA
              of approximately ₹156.9 crore (12% margin) in FY25, representing 2.2x improvement from FY24, which
              management describes as the "flywheel" funding emerging-segment investment. The emerging segment is still
              loss-making at an EBITDA level, though its cash EBITDA improved 25% YoY. EBITDA margin at the consolidated
              level remains negative at -3.68%. ROCE was -6.1% in FY25. The company's ₹91 crore ESOP charge is a non-
              cash item; removing it would render the business nominally profitable at the consolidated PAT level for
              FY25. Gross margin by segment, contribution margin by plan tier, and CAC / payback are not publicly
