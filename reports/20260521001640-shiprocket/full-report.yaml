      - number: '6.5'
        title: Adverse Evidence and Platform Weak Spots
        blocks:
          - type: paragraph
            body: >
              The most significant adverse signal is Shiprocket's Trustpilot rating of 1.6/5 ("Bad"), aggregated from
              reviews in late 2025 and early 2026. Complaints document fake delivery attempts (couriers marking orders
              as delivered or attempted without visit), non-responsive customer support, unauthorized volumetric weight
              deductions from merchant wallets, coercive wallet-refund-only policies, and orders marked "customer
              unavailable" without any contact attempt. A merchant complaint formally filed at consumercourt.net alleges
              "unfair trade practices, deficiency of service, unauthorized deductions, coercive refund policy, mental
              harassment and financial loss," suggesting cases have escalated to formal consumer grievance forums.


              G2 reviews (4.0/5) reveal a split audience: merchant-side users generally praise courier aggregation and
              onboarding ease, while enterprise users and D2C sellers with high volumes flag support delays and billing
              discrepancies. SoftwareSuggest reviews identify similar patterns. These adverse signals are mostly
              attributable to third-party courier partners, which Shiprocket aggregates without owning the final mile;
              however, aggregator platforms bear reputational responsibility for partner failures that end consumers
              attribute to Shiprocket branding.


              DRHP-disclosed structural risks include: (a) MSME merchant churn — many merchants are early-stage and face
              scaling challenges; (b) slower-than-expected integration of Pickrr, Omuni (₹124.6Cr impairment in FY2025),
              and Swiftly (₹52.1Cr impairment) acquisitions; (c) dependence on online marketing channels that are
              vulnerable to AI-driven search disruption; and (d) the Emerging Business segment (cross-border, martech,
              fulfillment) remains loss-making while requiring continued investment. New product categories (Shiprocket
              Quick, ShiprocketX) are early-stage, with Quick generating revenue only from Q4FY25 onward, and
              cross-border competition is intense from established global logistics players.
            claimRefs:
              - CU043
              - CU044
              - CU045
              - CU046
              - CU047
              - CU048
              - CU049
              - CU050
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Rising Consumer Stickiness Across Five Consecutive Periods
            body: >
              End-consumer repeat rates have increased every measured period — from 42.37% in FY2023 to 64.56% in H1FY26
              — without a single reversal. In absolute terms, 27.29 million of 42.27 million H1FY26 consumers were
              returning buyers. Combined with merchant cohort transaction multiples (FY2018 cohort at 20.93x by Year 7),
              this suggests Shiprocket-enabled merchants are growing faster than the platform's own active merchant
              count would imply, with existing cohorts expanding materially.
            calloutType: strength
            claimRefs:
              - CU025
              - CU026
              - CU027
              - CU028
              - CU029
          - type: callout
            title: MSME Churn Structural Vulnerability
            body: >
              The DRHP explicitly acknowledges that a large portion of the merchant base comprises MSMEs "which are more
              vulnerable to business failure and may face challenges in sustaining their operations." An increase in
              merchant turnover raises CAC and pressures unit economics. The H1FY26 active count of 145,269 is lower
              than FY2025's 165,231, implying a net reduction in active merchants at the full-year level even as gross
              new additions remain healthy at 56,925. This gap — active count declining even as acquisitions continue —
              is a structural signal of ongoing MSME merchant attrition that investors should model explicitly.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU047
          - type: callout
            title: 4-Lakh Marketing Claim vs. 145K Active Merchants — Reconciliation Required
            body: >
              Shiprocket markets "4 lakh+ (400,000+) businesses scaled" prominently. The SEBI UDRHP shows 145,269 active
              merchants in H1FY26 and 165,231 in FY2025. The ~2.5x gap between the marketing claim and the active count
              reflects cumulative all-time registrations (including churned or inactive merchants), not the current
              engaged base. Diligence analysis should anchor on the DRHP-filed active count and avoid treating the
              marketing figure as a proxy for current customer traction.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: callout
            title: Last-Mile Delivery Quality Risk Reflected in Consumer Ratings
            body: >
              Trustpilot rates Shiprocket 1.6/5 ("Bad") based on a pattern of fake delivery attempts, non-responsive
              support, and unauthorized wallet deductions. Though most last-mile failures originate with third-party
              courier partners, the Shiprocket brand absorbs consumer dissatisfaction. This creates a reputational
              externality that can elevate merchant churn if merchants attribute poor consumer experience to the
              logistics platform. The top 5 courier partners handle ~86% of volume, concentrating this service risk.
            calloutType: risk
