      - number: '7.5'
        title: People, Execution Risk, and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              Key-person concentration in CEO and co-founder Saahil Goel is the primary people risk at Shiprocket. Goel
              has been named in a criminal FIR filed by a third party, for which he has filed a quashing application.
              Any adverse outcome in that proceeding — a failed quash application leading to charge-sheet, arrest, or
              disqualification — would constitute an immediate material adverse event that would almost certainly halt
              the IPO process and trigger investor redemption clauses. Beyond litigation risk, Goel's centrality to
              strategy, investor relations, and corporate culture means his departure under any circumstances (even
              voluntary) would be a significant leadership discontinuity, given that Shiprocket has no publicly
              disclosed CEO succession plan. The company's acquisition-driven growth model has created organizational
              complexity: post-Omuni, Wigzo, Rocketbox, and Pickrr integrations, the leadership roster is large and
              distributed, with Inc42's analysis of Shiprocket's org chart noting a layered structure across
              engineering, product, operations, and marketing functions. Integration execution risk — whether acquired
              teams are retained, whether technology stacks have been unified, and whether revenue synergies have
              materialized — remains partially opaque from public disclosures alone. IPO execution risk is real: SEBI
              granted approval (nod confirmed by Entrackr, April 2026), but listing timing, market conditions, and
              oversubscription dynamics can diverge from plan, and any new adverse news between filing and listing could
              require re-filing or withdrawal. Kill criteria defined for this investment include: (1) courier
              concentration rising above 90% in top-5 partners without a meaningful alternative pipeline; (2) a
              confirmed cybersecurity breach resulting in DPDPA regulatory action or mass merchant exodus; (3) Saahil
              Goel's quashing application being dismissed, leading to disqualification proceedings; (4) goodwill
              impairment exceeding ₹2,000 million in any year post-IPO, signaling systematic acquisition failure; and
              (5) operating cash outflow exceeding ₹3,000 million in FY26, indicating that the IPO proceeds are being
              consumed faster than the stated plan.
