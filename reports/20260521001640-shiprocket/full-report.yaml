          - type: callout
            title: CEO FIR Overhang — Kill Trigger if Quashing Fails
            body: >
              Saahil Goel, CEO and co-founder, has a criminal FIR filed against him by a third party, and has filed a
              quashing application in the appropriate court. If the quashing application is dismissed and charges are
              framed, there is a material risk of SEBI disqualifying him as a director-promoter, which would effectively
              halt the IPO process. This is defined as a kill trigger in the mitigation table. Investors should require
              an unconditional update on the quashing application status as a condition of any pre-IPO commitment.
