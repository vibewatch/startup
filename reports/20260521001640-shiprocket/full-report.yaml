              Brinztech's September 2025 darknet alert citing a Shiprocket database sale has not been publicly confirmed
              or denied by Shiprocket. If the breach is confirmed, India's DPDPA and CERT-In notification regulations
              may impose disclosure obligations and penalties. Investors should request a formal cybersecurity
              assessment, penetration test results, and written confirmation of whether any breach notification was made
