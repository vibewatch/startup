      - number: '2.2'
        title: Market Sizing Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              Analyst estimates for the Indian ecommerce logistics market diverge materially, reflecting different scope
              definitions and proprietary modelling assumptions. Mordor Intelligence places the 2026 market at $7.25
              billion, growing to $11.14 billion by 2031 at an 8.98% CAGR—the most conservative estimate, anchored in
              narrow logistics-only spend. IMARC Group arrives at $19.54 billion for 2025, projected to reach $103.83
              billion by 2034 at a 20.39% CAGR, likely incorporating broader fulfilment and value-added services. OMR
              Global sizes the 2025 market at $10.8 billion with a 2035 target of $46.8 billion (15.8% CAGR). MarkWide
              Research sets 2026 at $8.7 billion growing to roughly $27 billion by 2035 at 18.4%. These estimates
              represent a roughly 3× spread between the floor (Mordor) and ceiling (IMARC), emphasising that methodology
              and scope choices drive as much variance as economic assumptions. The SEBI UDRHP Redseer analysis provides
              the most granular SAM view for Shiprocket: Direct Commerce GMV of $7–9 billion in CY 2024 growing at
              20–25% CAGR to CY 2029, giving a Direct Commerce SAM of roughly $17–27 billion by 2029. Broadening to
              include marketplace logistics, Shiprocket's effective SAM aligns with mid-range ecommerce logistics
              estimates of $10–14 billion in 2026. India's D2C ecommerce market (the demand-side proxy) was $87.5
              billion in 2025 by Mordor Intelligence, expanding at 24.3% CAGR to $322.1 billion by 2031—providing
              structural demand pull. The contradictions across reports are preserved here as a diligence signal: no
              single estimate should anchor valuation analysis without scope reconciliation.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
