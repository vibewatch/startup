      - number: '4.5'
        title: 'Financial Verdict: Revenue Quality, Margin Path, and Diligence Blockers'
        blocks:
          - type: paragraph
            body: >
              Shiprocket's financial narrative has materially improved: a 24% revenue CAGR over two years, 87.5% loss
              reduction, cash EBITDA positive for the first time at consolidated level, and a core segment that
              generates real cash profit. The DRHP and UDRHP filings provide more public financial disclosure than most
              Indian pre-IPO logistics startups, enabling a meaningful first-pass underwriting. Revenue quality in the
              core segment is good — consumption-based, recurring, with NRR above 100% in FY25. However, four adverse
              signals temper confidence. First, Power Merchant ARPU compressed 39% YoY in FY25 (₹1.44 crore to ₹0.88
              crore), likely reflecting rate concessions or mix shift from Pickrr integration; while H1 FY26 shows
              partial recovery to ₹0.94 crore, the FY24 peak has not been restored. Second, acquisition integration has
              destroyed capital: ₹124.6 crore Omuni impairment and ₹52.1 crore Swiftly/Wigzo impairment both recognised
              in FY25 as exceptional items confirm that inorganic growth has not converted to EBITDA incrementally.
              Third, revenue growth decelerated to 15% in H1 FY26 from 24% in FY25, raising the question of whether the
              base rate of growth is converging toward logistics-sector norms. Fourth, the emerging segment is still
              EBITDA-loss-making; the ₹157 crore core EBITDA is effectively subsidising ₹150+ crore of investment in
              cross-border, martech, and omnichannel that has not yet earned its cost of capital. The following
              financial inputs remain unavailable for underwriting: gross margin by segment, actual Contribution Margin
              values, realised pricing versus list pricing, CAC by channel, payback period, customer-concentration
              breakdown, free cash flow, warehouse-lease schedule, and detailed FLDG utilisation. Diligence should focus
              on recovering these metrics before any primary investment decision.
