      - number: '7.3'
        title: Partner, Dependency, and Competitive Risks
        blocks:
          - type: paragraph
            body: >
              Courier partner concentration is the single most structurally important risk at Shiprocket. Of 42 active
              courier partners, the top five accounted for 83.33% of total shipment volume in FY25 and 85.75% in H1FY26
              (six months ended September 30, 2025) — a concentration that has increased year-over-year. This means that
              defection, financial distress, or a pricing renegotiation by any single top-three partner would materially
              impair Shiprocket's ability to serve merchants at the volume and rate it currently offers. Delhivery
              (NSE-listed) and Xpressbees are simultaneously Shiprocket's largest courier dependencies and its most
              significant competitive threats in the 3PL market, creating a structural conflict of interest: Shiprocket
              relies on them for fulfillment while they compete for the same enterprise merchant segment. Amazon's
              supply chain services arm and Meesho's in-house logistics have accelerated in-housing of logistics by
              large platforms, directly compressing the addressable market for Shiprocket's enterprise segment. Strategy
              Boffins and industry analysis consistently highlight that Delhivery's first-party infrastructure and
              Xpressbees' capital backing give them pricing durability that Shiprocket — as an aggregator without
              first-party courier fleet — cannot easily match. Cloud and technology infrastructure dependency on
              hyperscalers (predominantly AWS) represents a standard but real concentration risk for platform uptime. On
              the capital side, FLDG lending partners and the NBFC ecosystem are subject to RBI Digital Lending
              Directions 2025, which impose regulatory capital and reporting obligations on lenders and LSPs (Loan
              Service Providers) that could restrict the availability or economics of Shiprocket's credit products. The
              acquisition portfolio (Omuni, Wigzo, Rocketbox, Pickrr) has generated impairments of ₹1,246.41 million
              (Omuni) and ₹521.01 million (Wigzo) in FY24, demonstrating integration execution risk. The goodwill
              carrying value representing 44.62% of total assets in FY25 is contingent on successful integration and
              revenue achievement of these assets. Cross-border shipping regulatory changes, tariff uncertainty, and the
              need for country-specific compliance infrastructure add a partner dependency layer for ShiprocketX's
              international network.
