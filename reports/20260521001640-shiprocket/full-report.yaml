      - number: '8.5'
        title: 'Recommendation: TRACK — IPO Listing Is the Risk-Adjusted Entry Point'
        blocks:
          - type: paragraph
            body: >
              On the evidence available as of May 2026, Shiprocket warrants a TRACK recommendation with a HIGH risk
              rating and STRETCHED valuation stance. The company's platform leadership, NRR recovery, and IPO approval
              provide a clear liquidity event horizon. However, the 6.2x FY25 revenue private multiple — 93% above
              Delhivery and above the global private SaaS median of 4.8x — requires near-perfect execution on three
              simultaneously: NRR must re-accelerate above 105%, the emerging segment (20% of revenue) must reach EBITDA
              breakeven, and revenue growth must recover from 15% in H1 FY26 to 20%+ in FY27. The presence of a large
              OFS (₹1,242 crore) and two consecutive acquisition impairments signal that insider confidence in the
              current private mark may be partially qualified.

              Private entry at $1.21 billion should be evaluated against IPO pricing: if the price band implies a market
              cap above ₹12,000 crore (>6x FY27E revenue), the private mark is attractive on a relative basis; if the
              band implies ₹8,000–11,000 crore, it is roughly in line; and below ₹8,000 crore would imply a markdown.
              The base case targets approximately ₹11,000 crore market cap (5x FY27E ₹2,200 crore revenue), representing
              a 2–3x return on last private round capital over a 12–18 month IPO horizon. The bear case at 3x FY27
              revenue implies ₹5,700 crore — a capital loss. Conviction is medium on the platform and low on the
              valuation at current multiple. The thesis is conditioned on receipt of segment gross margin and CAC
              disclosures before final underwriting.
