      - number: '8.3'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The positive thesis for Shiprocket rests on platform leadership, financial inflection, and cohort
              compounding. Shiprocket is India's largest new-age horizontal e-commerce enablement platform by revenue
              per the Redseer report, serving 400,000+ onboarded merchants with 4 lakh merchant coverage and enabling $3
              billion in annualised GMV, representing 4.5–5% of India's e-commerce volume. The platform's
              consumption-based wallet model creates recurring revenue driven by merchant GMV, not contract renewals,
              delivering a 103.51% core NRR in FY25 — up from 96.27% in FY24. The FY2018 cohort's 20.93x transaction
              compounding by Year 7 (FY25) demonstrates the platform's ability to grow with merchants over time,
              supporting a SaaS-like recurring cash flow narrative. FY25 marked the first year of cash EBITDA positivity
              (₹7 crore) and a core adjusted EBITDA of ₹157 crore at a 12% margin on core revenue.

              The anti-thesis is anchored in valuation premium and execution gaps. At 6.2x FY25 revenue, Shiprocket
              carries a 93% EV/Sales premium to Delhivery and a 39% premium to Unicommerce — premia that can only hold
              if the SaaS re-rating narrative is validated by accelerating NRR and emerging-segment profitability. The
              FY24 net loss of ₹595 crore (driven by ₹244 crore restructuring, ₹192 crore ESOP, and emerging-segment
              investment) and ₹176.7 crore of FY25 exceptional impairments on Omuni (₹124.6 crore) and Wigzo/Swiftly
              (₹52.1 crore) acquisitions demonstrate that inorganic growth has produced write-downs rather than
              incremental EBITDA. Power Merchant ARPU fell 39% in FY25 (₹1.44 → ₹0.88 crore) before partially
              recovering; its root cause has not been publicly disclosed. Revenue growth decelerated to 15% in H1 FY26,
              reducing the forward growth support for the current multiple. The OFS quantum of ₹1,242 crore signals that
              existing investors are seeking partial liquidity at listing, creating near-term selling pressure.
