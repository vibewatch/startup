      - number: '2.3'
        title: Buyer and Merchant Segmentation
        blocks:
          - type: paragraph
            body: >-
              Shiprocket's merchant universe divides into two regulatory tiers: MSMEs (enterprises with annual revenue
              below ₹2,500 million) and Large Retailers (above ₹2,500 million). Within MSMEs—which number approximately
              60 million in India—the platform serves D2C brand founders, marketplace sellers, social commerce
              micro-entrepreneurs, and cross-border exporters. Buyer behavior data from Shiprocket's own seller base
              shows 71% of orders originating from non-metro India, with Personal Care (27%), Apparel & Footwear (20%),
              and Electronics (9%) as top categories; 84% of purchases occur on weekends, reflecting consumer shopping
              habits aligned with disposable time. Women-led MSMEs account for 20.5% of registered businesses and
              generate 19% of employment, representing an underserved but rapidly digitalizing segment. D2C brands
              within this universe seek full ownership of the customer relationship, using Shiprocket for checkout
              optimisation, multi-courier shipping, and post-purchase marketing; they are the budget owners and payers.
              Marketplace sellers primarily need shipping aggregation and COD settlement—often without a dedicated
              logistics team. Large retailers integrate at the ERP level and negotiate volume-based SLAs. ONDC's entry
              into the ecosystem has expanded the total addressable seller base by enrolling 700,000+ vendors on an open
              protocol that charges approximately 3% commission versus the 15–25% typical of incumbent marketplaces,
              creating a new cohort of enabled but price-sensitive buyers.
