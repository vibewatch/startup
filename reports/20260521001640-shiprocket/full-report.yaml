  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and Regulatory Risks
        blocks:
          - type: paragraph
            body: >
              Shiprocket's SEBI Updated Draft Red Herring Prospectus (UDRHP), filed December 12, 2025, discloses a
              material litigation dossier that IPO investors must assess carefully. The company has initiated four
              criminal proceedings with a combined disputed amount of ₹53.91 million, arising from alleged fraudulent
              activities by third parties against Shiprocket. Against the company (and its subsidiaries), there is one
              criminal proceeding, ten tax-authority disputes aggregating ₹27.09 million, and one material civil
              dispute; total exposure on the "against" side is approximately ₹50.93 million. The most sensitive item is
              a criminal First Information Report (FIR) lodged by a third party against co-founders including CEO Saahil
              Goel, who has filed a quashing application in the appropriate court — the outcome of that application is
              undisclosed as of the UDRHP date. The subsidiary Pickrr (acquired for approximately $200 million in 2022)
              is the subject of a criminal proceeding by QNT Sports at the Chief Judicial Magistrate court, with a
              complaint filed on October 4, 2024. Blue Line Logistics may also seek to implead the company or Pickrr
              through a public-database search. An entirely new proceeding — filed by Orosil Smiths India Limited at the
              District Consumer Disputes Redressal Commission (South District), Delhi, in May 2026 — post-dates the
              UDRHP and involves lost shipments, refund claims, compensation for business loss, and loss of goodwill;
              this is not reflected in the UDRHP disclosures and represents incremental disclosed risk. On the
              regulatory front, RBI Digital Lending Directions 2025 constrain Shiprocket's Instant COD and FLDG-backed
              credit pilots: FLDG aggregate exposure is capped at ₹200 million across the portfolio, with a 5%
              per-outstanding-loan limit; the company must comply with these caps or risk regulatory sanction. Consumer
              courts across India have received hundreds of complaints against Shiprocket from aggrieved merchants and
              end consumers, with Trustpilot registering 1.6/5 ("Bad"), PissedConsumer showing over 1,400 reviews, and
              ConsumerComplaints.in accumulating hundreds of unresolved cases. While individual consumer complaints
              rarely constitute material legal risk, their volume signals systemic service failures that could invite
              regulatory scrutiny of consumer protection obligations and weigh on brand credibility during the IPO
              roadshow.
