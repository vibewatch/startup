  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              Shiprocket operates at the intersection of three spending pools: online commerce (direct brand websites
              and marketplace-assisted channels), offline/social commerce (digitally enabled hyperlocal and
              WhatsApp-driven sales), and cross-border merchandise exports. Together these represent a gross merchandise
              value (GMV) opportunity of ₹7.7–8.4 trillion ($92–101 billion) for new-age end-to-end horizontal
              e-commerce enablement platforms in CY 2024, according to Redseer analysis commissioned for the SEBI UDRHP.
              Within that broad canvas, Direct Commerce (merchants selling via owned websites without intermediary
              commission) generated $7–9 billion GMV and accounted for 10–13% of online retail; cross-border merchandise
              retail contributed approximately $60 billion GMV; and digitally enabled social commerce added $1.4–2.2
              billion. Offline in-store orders serviced through platform logistics add another $20–24 billion. India's
              broader ecommerce market stood at $125 billion in 2024 and is projected to reach $345 billion by 2030 at
              an 18.4% CAGR. Excluded from Shiprocket's primary addressable spend are pure marketplace transaction fees
              (Amazon/Flipkart take rates), grocery quick commerce infrastructure (Blinkit/Zepto dark stores), and B2B
              industrial procurement. Status-quo substitutes include single-courier direct contracts, captive logistics
              arms of large retailers, and spreadsheet-based COD reconciliation—methods that Shiprocket's multi-courier
              aggregation and tech stack directly displace.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
