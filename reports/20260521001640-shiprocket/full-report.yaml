  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio & Module Architecture
        blocks:
          - type: paragraph
            body: >-
              Shiprocket offers two business segments: Core Business and Emerging Business. The Core Business is the
              domestic shipping platform, a courier aggregator connecting merchants to 42 active partners covering
              19,000+ pin codes nationwide. It provides AI-driven courier allocation, a non-delivery report (NDR) panel,
              weight management with a Zero Weight Discrepancy Guarantee Program, COD remittance independent of courier
              cycles, and EDD prediction achieving 75.26% accuracy in H1 FY26. The fulfillment vertical, running 35
              fulfillment centers, adds managed warehousing with 12+ channel integrations and promises up to 99.9%
              operational accuracy.

              The Emerging Business segment contains five product clusters. Cargo and Fulfillment includes Shiprocket
              Cargo (domestic B2B/PTL/FTL), the fulfillment network, and Shiprocket Omuni—an omnichannel commerce
              platform integrating online marketplaces, brand websites, and physical stores. The Cross-Border cluster
              (ShiprocketX, CargoX, LaunchX) served 168 countries through September 2025, then narrowed to 135 countries
              in H1 FY26 via 20 supply chain partners. The Ads and Marketing cluster comprises Engage360 (WhatsApp-first
              AI marketing) and Shiprocket Checkout (one-click checkout, prefilled data, fraud prevention,
              COD-to-prepaid conversion, high-RTO address filtering). The Others cluster includes Shiprocket Quick
              (hyperlocal same-day aggregator launched September 2024), Shiprocket Capital (lending via 12 NBFC
              partners), Shiprocket Sense (AI-driven RTO prediction and address intelligence API), and Shunya AI
              (multimodal commerce AI launched July 2025). The breadth of modules is a deliberate cross-sell flywheel:
              each additional product deepens merchant lock-in and raises average revenue per user.
