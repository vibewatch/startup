  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetisation Model
        blocks:
          - type: paragraph
            body: >
              Shiprocket's revenue is generated entirely from merchant activity on its platform and is structured in two
              reported segments. The Core Business (domestic shipping platform plus Shipping Apps, value-added software
              tools) contributed ₹1,306 crore in FY25, growing 20% YoY; it has been the cash engine of the company since
              FY2022. The Emerging Business — comprising ShiprocketX (cross-border shipping), Shiprocket Cargo (B2B
              bulk), Shiprocket Capital (lending services), Engage360 (WhatsApp-centric martech), Checkout (one-click
              checkout), and Omuni (omnichannel retail) — contributed ₹326 crore in FY25 (+41% YoY), up from 11% of
              total revenue two years prior to 20% now. The primary monetisation mechanism for domestic shipping is a
              consumption-based, prepaid-wallet model: merchants fund a wallet account and per-shipment charges are
              deducted on each order. Revenue is therefore directly coupled to shipment volume, mix (weight, zone, plan
              tier), and active-merchant count. The company does not publish a headline take-rate percentage applied to
              Gross Merchandise Value; the DRHP defines take rate as "the percentage of enabled GMV that an e-commerce
              enablement platform captures as revenue" and uses it as a KPI, but the FY25 absolute take-rate figure is
              not in public materials. Other income of ₹42.8 crore in FY25 (largely interest on cash balances and
              miscellaneous gains) is disclosed separately and not counted in operating revenue. Shiprocket Capital
              currently operates under a "direct selling agent" model and a first-loss default guarantee (FLDG) pilot:
              the company itself earns referral/service fees and bears FLDG exposure capped at ₹200 million, not the
              loan principal. Recurring revenue quality in the core segment is supported by a 103.51% NRR in FY25,
              implying existing cohorts expanded net spending faster than churn cost.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
