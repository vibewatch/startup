        title: Exhibits
        blocks:
          - type: callout
            title: Structural Courier Concentration — Highest Probability, Highest Impact
            body: >
              Shiprocket's top-five courier partners account for 83.33% of FY25 and 85.75% of H1FY26 shipment volume. As
              an aggregator without a first-party courier fleet, Shiprocket has limited ability to compel partners to
              maintain pricing, service levels, or exclusivity. Any defection by a top-three partner would require
              emergency re-routing that could breach merchant SLAs and trigger mass complaints. This concentration is
              the highest-probability, highest-impact structural risk in the investment thesis.
            calloutType: insight
