  - id: FI002
    title: Unit economics bridge — per-shipment P&L approximation
    type: flow
    summary: >
      A qualitative unit-economics bridge for a representative Shiprocket domestic shipment. Numeric inputs are derived
      from list pricing and public cost data; courier cost and contribution margin are approximated because segment
      gross margin is not publicly disclosed. All nodes with approximation notes should be confirmed with management in
      diligence.
    claimRefs:
      - CI008
      - CI009
      - CI014
      - CI018
    approximationNotes: >
      Revenue per shipment is estimated from published plan pricing (₹20–45/500g domestic). Courier cost pass- through
      is estimated at 65–70% of ASP based on the ₹1,213 crore CoMS / ₹1,632 crore revenue ratio. Contribution Margin
      components are from DRHP definition but not disclosed as absolute values for FY25. All figures are approximations;
      none are management-confirmed at the per-shipment level.
    data:
      nodes:
        - id: list-price
          label: 'List per-shipment revenue: ₹20–45 / 500g (varies by plan tier)'
          detail: Pro plan base ₹20/500g; Lite plan ₹29/500g; actual realized ASP not disclosed
          claimRefs:
            - CI008
        - id: promo-cashback
          label: 'Less: promotional cashbacks and incentives'
          detail: Included in DRHP Contribution Margin definition as deduction; quantum not disclosed
          claimRefs:
            - CI009
        - id: courier-cost
          label: 'Less: courier partner cost (pass-through ≈ 65–70% of revenue estimate)'
          detail: CoMS of ₹1,213 crore vs. ₹1,632 crore revenue implies ~74% blended; core margin likely better
          claimRefs:
            - CI014
        - id: contribution-margin
          label: 'Contribution Margin: not disclosed (estimated positive for Core; negative for parts of Emerging)'
          detail: DRHP defines CM as Revenue less CoMS, comms, payment gateway, promo, marketing, FC costs, warehouse salary
          claimRefs:
            - CI018
        - id: opex-overhead
          label: 'Less: G&A, tech, D&A overhead allocation (~13% of revenue)'
          detail: Employee cost ₹315 crore + IT ₹45 crore + Advertising ₹21 crore + other ≈₹221 crore total overheads
          claimRefs:
            - CI015
        - id: ebitda-per-ship
          label: 'Cash EBITDA: ~₹0.04/shipment (consolidated, implied from ₹7 crore total vs. ~220K daily shipments)'
          detail: Extremely thin consolidated margin; core is materially better; emerging drag suppresses blended
          claimRefs:
            - CI016
      edges:
