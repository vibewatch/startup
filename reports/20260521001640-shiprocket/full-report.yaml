    rows:
      - - API Gateway / REST layer
        - Ingests 12.22B monthly hits; routes to microservices
        - RESTful, JSON; Bearer token auth; Postman collections
        - Third-party cloud compute (vCPUs, RAM)
        - Cloud provider outage; API schema breaking changes
      - - Event Backbone
        - Async messaging between microservices; 400M events/day
        - Apache Kafka
        - Kafka cluster availability; internal expertise
        - Kafka lag under peak load; operational complexity at scale
      - - Courier Allocation Engine (CORE)
        - AI-driven courier ranking and assignment per shipment
        - ML models (historical performance, cost, PIN-code data)
        - Data freshness from 42 courier integrations
        - Model staleness if courier behavior changes; no exclusive contracts
      - - Order & AWB Management
        - 'Order lifecycle: creation → AWB → pickup → tracking → NDR → COD'
        - Microservices; event-driven upserts in MySQL
        - MySQL reliability; sharding strategy
        - Year-based sharding adds routing complexity for cross-year queries
      - - Database Layer
        - 30+ DB instances; hot data (12 months) + archived (year shards)
        - MySQL; vertical + horizontal sharding; Elasticsearch for metadata
        - Elasticsearch indexing latency for older data queries
        - Historical query degradation; data migration risk during resharding
      - - CDC / Data Pipeline
        - Change-data capture; streams state changes to analytics
        - Debezium; 450 GB CDC log/day; 3.5 TB DB inserts/updates/day
        - Debezium operational continuity
        - Pipeline failure could cause analytics lag
      - - In-Memory Cache
        - 970M reads/writes/month; fast lookup for live operations
        - In-memory data stores (Redis/Memcached implied)
        - Cache invalidation consistency
        - Cache drift if write-path events are delayed
      - - Compute Infrastructure
        - 7,604 vCPUs, 27.35 TB RAM (Sep 2025); auto-scales to peak
        - Third-party cloud (cloud-agnostic per DRHP)
        - Cloud-provider contract and availability
        - 100% dependency on third-party cloud; no private data center
      - - AI/ML Workloads
        - RTO prediction, EDD, courier recommendation, fraud detection, profiling
        - Dedicated ML infrastructure; Shunya AI on Cloudfiniti GPU cloud
        - Training data quality; GPU availability (Cloudfiniti)
        - Accuracy plateaus without new data diversity; regulatory AI scrutiny
      - - Fulfillment Management System
        - Unified warehouse + inventory + order routing for 35 FCs
        - Proprietary WMS + Shiprocket Omuni (partially)
        - Physical FC operations (10 of 35 FCs managed by 3P)
        - 3P FC management risk; Omuni integration lag post-impairment
    notes: >-
      Technology stack inferred from Shiprocket Engineering blog, DRHP disclosures, and developer documentation.
