      - number: '6.3'
        title: Retention, Durability, and Cohort Behavior
        blocks:
          - type: paragraph
            body: >
              End-consumer repeat rates — the share of consumers served in a given period who had previously transacted
              through a Shiprocket-enabled merchant — have risen consistently over five periods: 42.37% in FY2023,
              46.79% in FY2024, 51.11% in FY2025, 57.31% in H1FY25, and 64.56% in H1FY26. This is an aggregate platform
              metric across the Core Business (excluding Pickrr end consumers), not a cohort-specific retention rate,
              but the upward trend strongly suggests increasing consumer stickiness on Shiprocket-enabled storefronts.
              In absolute terms, 27.29 million of the 42.27 million consumers served in H1FY26 were repeat buyers, up
              from 15.74 million in FY2023.


              For merchant cohorts, the DRHP discloses transaction retention multiples rather than merchant count
              retention rates. The FY2018 merchant cohort grew its transaction volume 20.93 times by Year 7 (FY2025),
              the FY2019 cohort 4.80 times by Year 6, the FY2020 cohort 2.56 times by Year 5, the FY2021 cohort 1.51
              times by Year 4, and FY2022 and FY2023 cohorts reached 1.71x and 1.10x by Years 3 and 2 respectively.
              These multiples indicate deepening engagement rather than mere retention, showing that merchants who stay
              on the platform expand their transaction volumes substantially over time. This is a meaningful proxy for
              net revenue retention, though the company does not disclose a formal NRR or GRR figure.


              CAC for the Core Business has declined from ₹4,772 in FY2023 to ₹3,361 in FY2025 and further to ₹2,818 in
              H1FY26, indicating improving unit economics on acquisition. Power merchant cross-sell depth is evidenced
              by 52.27% of power merchants using more than three products in H1FY26. Self-serve onboarding reached
              96.92% (no human support required) with a 62.57% First Call Resolution Rate, suggesting the platform
              handles scale without proportionate support cost growth. Platform satisfaction signals are mixed: G2 shows
              4.0/5 from 108 reviews, while Trustpilot rates Shiprocket "Bad" at 1.6/5 — mostly from end consumers
              experiencing failed deliveries — and Capterra customer support scores average 2.4/5. These consumer-facing
              ratings reflect last-mile partner performance as much as Shiprocket's own platform quality, but
              reputational spillover onto merchants is a retention risk.
            claimRefs:
