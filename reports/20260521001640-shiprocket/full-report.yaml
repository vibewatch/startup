  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Private Valuation Context, Entry Discipline, and IPO Structure
        blocks:
          - type: paragraph
            body: >
              Shiprocket's last disclosed private valuation mark is $1.21 billion, established through the December 2024
              Series E-III extension round in which ₹219 crore ($26 million) was raised from Koch Strategic Platforms,
              MUFG Innovation Partners, KDT Ventures (lead, ₹124.5 crore), Tribe Capital, and Huddle Ventures. SEBI CCPS
              allotment filings confirmed the round at ₹43,394 per share, which Fintrackr/Entrackr estimated implies a
              post-allotment valuation of approximately $1.21 billion. One independent aggregator (Affluense.ai) cites a
              lower figure of approximately $1.1 billion for the same round, creating a $110 million uncertainty band in
              the private mark. The company's peak valuation was approximately $1.3 billion at the August 2022 Series E
              (TCV-led, $33.5 million), suggesting the December 2024 round represents a flat-to-marginal markdown from
              peak rather than a step-up, a material signal for late-stage entry discipline. Total cumulative funding
              exceeds $320 million across nine rounds.

              The SEBI-approved IPO targets total proceeds of ₹2,342.35 crore: a fresh issue of ₹1,100 crore and an OFS
              of ₹1,242.35 crore from existing shareholders (Koch, MUFG, TCV, Tribe, and others). The OFS quantum is
              larger than the fresh issue, signalling meaningful insider monetisation at listing. A pre-IPO placement of
              up to ₹220 crore can reduce the fresh issue if exercised before the price band is set. No price band has
              been announced as of May 2026; market consensus points to an implied market cap of ₹10,000–14,000 crore
              and listing in H1 FY27. Fresh issue proceeds are allocated: ₹294 crore marketing/merchant acquisition,
              ₹211 crore technology, ₹211 crore debt repayment, and the balance for acquisitions and general corporate
              purposes. Revenue decelerated to 15% in H1 FY26 from 24% in FY25, reducing the near-term cash flow support
              for the entry multiple; whether the deceleration is cyclical or structural is the key underwriting
              question for this IPO.
