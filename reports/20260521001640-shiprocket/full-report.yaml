      - number: '8.2'
        title: Comparable Valuation Analysis — Public Companies, Private Rounds, and Global Benchmarks
        blocks:
          - type: paragraph
            body: >
              The comparable set spans three layers: Indian public-market logistics-tech (Delhivery), Indian
              public-market e-commerce SaaS (Unicommerce), and global private/public SaaS medians. Each comparator has
              material structural differences from Shiprocket's hybrid logistics-SaaS model, requiring a blended
              multiple approach rather than single-peer anchoring.

              Delhivery (NSE: DELHIVERY) is the most direct listed peer by segment (e-commerce logistics, India,
              API-led). As of May 2026, Delhivery trades at an EV/FY25 Sales multiple of 3.21x on a ₹34,200 crore market
              cap (₹8,932 crore FY25 revenue). Its FY25 EBITDA of ₹376 crore implies a 4.2% EBITDA margin and a 52x
              EV/EBITDA multiple; the company turned consolidated PAT-positive at ₹162 crore in FY25 for the first time.
              Delhivery operates at approximately 5x Shiprocket's revenue scale and has a pure-logistics (no merchant
              SaaS) business model, which structurally limits its achievable multiple versus a SaaS-heavy comparable.
              Shiprocket's $1.21 billion private mark at 6.2x FY25 revenue commands a 93% premium to Delhivery's 3.21x,
              requiring the market to price the SaaS layer at a substantial premium above logistics economics.

              Unicommerce (NSE: UNIECOM) provides the SaaS-layer multiple reference. Unicommerce trades at 4.45x
              EV/Revenue and 25.7x EV/EBITDA on a ₹958 crore market cap, with FY26 revenue of ₹204 crore and a 16.3%
              EBITDA margin. Unicommerce's stock declined approximately 38% in the 12 months preceding May 2026,
              signalling India SaaS multiple compression, not expansion. The gap between Unicommerce's 4.45x and
              Shiprocket's 6.2x implies the market must price Shiprocket's superior scale, growth rate, and retention
              metrics at a 39% premium to a pure-SaaS peer — or view the logistics volume as incremental revenue
              quality.

              Nykaa (NSE: NYKAA), a consumer-tech D2C enablement platform, trades at approximately 8x EV/Revenue,
              providing the upper bound for India consumer-tech re-rating. Zomato and other Indian new-age tech
              platforms trade at 7–10x EV/Revenue. Shiprocket's 6.2x falls in the lower half of this India premium band,
              supportive of the valuation if growth re-accelerates.

              Global private SaaS median EV/Revenue was approximately 4.8x in 2025, and public SaaS median approximately
              6x, representing the floor and ceiling of the software-comparable band. Shiprocket's 6.2x sits in line
              with the global public SaaS median despite being private, reflecting the Indian IPO premium expectation
              but leaving limited upside from pure SaaS re-rating unless NRR exceeds 110% and the emerging segment
              reaches profitability.
