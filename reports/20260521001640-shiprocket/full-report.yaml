      - number: '4.2'
        title: Pricing Model, Plan Economics, and Revenue Mix
        blocks:
          - type: paragraph
            body: >
              Shiprocket publishes tiered subscription plans that bundle platform access with discounted per-shipment
              rates, creating a two-layer monetisation structure. The Lite plan (free) carries a base domestic rate of
              approximately ₹29 per 500g; the Business plan (₹199/month) drops this to roughly ₹26/500g; the Advanced
              plan (₹499/month, 50–200 orders) to approximately ₹23/500g; and the Pro plan (₹799/month, 3,000–10,000
              orders) to ₹20/500g. These are list rates; actual per-shipment revenue varies by courier partner assigned,
              weight slab, delivery zone, Cash-on-Delivery surcharge, and applicable promotional cashback and
              incentives. The DRHP defines Contribution Margin as Revenue minus Cost of Merchant Solutions,
              communication cost, payment gateway charges, promotional cashback, performance marketing,
              fulfilment-centre costs, and salary of warehouse staff; this is the closest publicly disclosed
              unit-economics figure, though exact values by period are not in the public UDRHP excerpts available. For
              emerging business segments, pricing is varied and not publicly published: ShiprocketX cross-border pricing
              is quote-based; Engage360 and Checkout are SaaS subscription models; Shiprocket Capital earns referral and
              FLDG fees. The Power Merchant segment — defined as merchants averaging more than 100 unique monthly
              transactions — is the highest-revenue cohort. Power Merchant ARPU compressed from ₹1.44 crore per merchant
              in FY24 to ₹0.88 crore in FY25 (a 39% decline), which the company attributes partly to the merger of
              Pickrr volumes at lower rates and cohort composition, before recovering slightly to ₹0.94 crore in H1
              FY26. The absence of a realised pricing table disaggregated by plan tier, courier, and geography is a
              diligence gap that prevents triangulating stated list pricing against reported revenue.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
