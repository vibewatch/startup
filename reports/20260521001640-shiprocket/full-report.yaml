chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal history, and operating model
        blocks:
          - type: paragraph
            body: >-
              Shiprocket is an India-headquartered e-commerce enablement platform whose core proposition is
              multi-carrier shipping aggregation for direct-to-consumer (D2C) brands, MSMEs, and online retailers. The
              company's legal entity was originally incorporated as Bigfoot Retail Solutions Private Limited on
              September 28, 2011 in New Delhi under the Companies Act 1956 (CIN: U72900DL2011PLC225614). The entity was
              renamed to Shiprocket Private Limited via a shareholders' resolution dated June 12, 2024, with a fresh
              certificate of incorporation issued July 19, 2024. It was subsequently converted to a public limited
              company—Shiprocket Limited—pursuant to a shareholders' resolution dated January 18, 2025, with a
              certificate of incorporation issued February 18, 2025. The Shiprocket brand and platform are understood to
              have launched in 2017 when the co-founders built the multi-carrier shipping product that is now the core
              business. This 2011 versus 2017 distinction is material: the legal entity predates the Shiprocket brand by
              six years and later-chapter financial analyses should anchor incorporation to 2011 and operational/brand
              launch to 2017.


              The registered office is in Delhi; the corporate office is in Gurugram, Haryana. The operating model is a
              technology-enabled logistics marketplace: Shiprocket connects merchants to 42+ active courier partners
              (including Delhivery, FedEx, Aramex, Xpressbees, DTDC, and Shadowfax), offers automated pricing and
              carrier selection, real-time tracking, and a suite of adjacent tools under a consumption-based pricing
              model. Beyond core domestic shipping, the platform has expanded into: ShiprocketX for cross-border
              logistics across 220+ countries; Fulfillment (warehousing and fulfillment center operations); Engage360
              (WhatsApp-centric marketing automation); Checkout (one-click checkout reducing cart abandonment);
              Trends/Intelligence (AI-driven market analytics); Capital (lending facilitation via NBFC partners);
              Shiprocket Quick (same-day/quick commerce, September 2024); and Shunya AI (multimodal AI engine for SMBs,
              July 2025). Emerging segments together accounted for approximately 20% of FY25 revenue, up from 11% two
              years prior, with 41% YoY growth.
