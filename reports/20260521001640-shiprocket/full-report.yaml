      - number: '5.3'
        title: Integration Ecosystem & Developer Platform
        blocks:
          - type: paragraph
            body: >-
              Shiprocket has built an open-platform strategy around 250+ ecosystem partners accumulated from April 2021
              to September 2025. Partners span logistics and fulfillment providers, communication platforms (WhatsApp,
              SMS, email), shopping cart connectors (Shopify, WooCommerce, Magento, Amazon, Flipkart, Meesho, and
              others), payment gateways, ERPs, developers, credit providers, and loyalty programs. The platform supports
              12+ formal channel integrations with major marketplaces and D2C storefronts, allowing a merchant to manage
              unified inventory and order routing from one dashboard.

              On the developer side, Shiprocket exposes RESTful APIs for order creation, AWB assignment, label
              generation, tracking, NDR workflows, COD reconciliation, and inventory management. The API reference is
              documented at apidocs.shiprocket.in with Postman collections for easy testing. SDKs are available for
              Node.js, PHP, and Python. An active WordPress plugin for WooCommerce sits on wordpress.com and integrates
              auto-order import, live shipping rates, bulk label generation, and real-time tracking. The GitHub
              organization at github.com/shiprocket hosts sample integration repositories. Stack Overflow carries
              questions tagged "shiprocket" indicating active third-party developer adoption. This open developer
              posture is a strategic differentiator versus closed courier-aggregator models but depends on continued
              maintenance quality. The DRHP identifies a material risk that third-party platform changes (OS updates,
              API deprecations, payment-gateway policy changes) could impair platform interoperability without
              Shiprocket's control.
