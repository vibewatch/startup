      - number: '3.3'
        title: Capability, Pricing, and GTM Comparison
        blocks:
          - type: paragraph
            body: >-
              On pricing, Shiprocket's tiered subscription model (Lite free / Business Rs 699/month / Advanced Rs
              1,499/month / Pro Rs 2,499/month) bundles platform access with carrier rate discounts. Domestic shipping
              rates start at approximately Rs 20-22/500g for high-volume senders; NimbusPost's comparable starting rate
              is similar but merchants report lower effective all-in costs due to fewer hidden weight-dispute charges.
              ClickPost charges enterprise SaaS fees on top of negotiated carrier rates, making it meaningfully more
              expensive than either aggregator at small volumes but more transparent at scale. Direct carrier contracts
              with Blue Dart or FedEx require minimum volume commitments (typically 3,000-5,000+ shipments/month) that
              effectively exclude micro-sellers who constitute a large share of Shiprocket's merchant base.


              On core capabilities, Shiprocket leads direct aggregator peers on total carrier count (42+ vs.
              NimbusPost's 25+), geographic coverage (19,000+ pin codes domestically and 220+ countries via
              ShiprocketX), and multi-channel OMS integration depth. ClickPost leads on enterprise analytics, carrier
              SLA visibility, and global carrier breadth (350+). NimbusPost leads on self-reported COD remittance speed
              and is preferred by merchants prioritizing cost efficiency over feature breadth.


              On GTM model, Shiprocket's freemium entry (Lite plan) combined with progressive plan upgrades creates a
              large acquisition funnel that NimbusPost and ClickPost cannot match at scale. The ClickPost aggregators
              benchmark (2026) ranks Shiprocket "best for high-volume D2C and marketplace sellers" at 4.0/5 G2 rating,
              while ShipKaro (a smaller competitor) scores 4.5/5 on the same platform — a gap that adverse merchant
              reviews attribute to Shiprocket's support quality degradation at volume. Shiprocket's branded
              post-purchase experience (RADAR, Sense, NDR dashboards) and AI-driven RTO reduction (15-25% improvement
              per company-reported data) differentiate it from pure rate aggregators but create dependency on
              Shiprocket's proprietary data models.


              Delhivery's direct SME sales effort — where it sells courier capacity directly to merchants bypassing
              aggregators — competes with Shiprocket on the high-volume seller cohort (typically above 10,000
              shipments/month). Shadowfax's specialization in quick commerce (90% YoY growth in H1 FY26) creates a
              capability gap Shiprocket is trying to close through its Quick product (same-day/quick commerce, launched
              September 2024).
