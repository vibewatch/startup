      - number: '3.2'
        title: Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Delhivery is the dominant carrier-side player in Indian express logistics with Rs 10,508 crore FY26
              revenue (17.5% YoY growth), Rs 153 crore net profit, and over 1 billion express parcels shipped in FY26
              (40% YoY volume growth). Its April 2025 acquisition of Ecom Express for Rs 1,407 crore cash added
              substantial volume, sortation infrastructure, and institutional knowledge of B2C courier economics.
              Delhivery's CEO Sahil Barua stated during the Q4 FY26 earnings call that "there are now three listed
              players in the Express logistics space — Delhivery, Blue Dart, and Shadowfax — and I don't see a reason
              for XpressBees to exist," signaling that the post-Ecom consolidation phase is accelerating sector
              rationalization. Delhivery also launched Delhivery Local (intra-city) in six cities with Rs 60 crore FY26
              annualized revenue run rate and Delhivery International (economy air parcel, four countries), directly
              competing with Shiprocket's ShiprocketX and Quick adjacencies.


              Shadowfax (Flipkart-backed, Eight Roads Ventures as largest institutional shareholder) reported Rs 2,485
              crore FY25 revenue (32% YoY) and Rs 6.4 crore net profit — first full-year profitable. Its H1 FY26 revenue
              surged 68% YoY to Rs 1,806 crore with Rs 21 crore profit (2x H1 FY25 level), driven by quick commerce
              (+82.6% YoY for hyperlocal segment, ~20% of revenue). Shadowfax covers 14,700+ pin codes through 125,000+
              delivery partners and filed a UDRHP with SEBI for a Rs 2,000 crore IPO (Rs 1,000 crore fresh issue)
              targeting December 2025 / January 2026 listing. As a carrier partner of Shiprocket, Shadowfax's
              competitive position is dual: it is both a revenue contributor to Shiprocket through platform-routed
              volumes and a potential substitute when merchants seek direct volume contracts.


              Xpressbees (Alibaba, Blackstone, TPG-backed, $1.2-1.4B valuation, $580M+ total funding) reported Rs 2,874
              crore FY25 revenue (flat YoY from Rs 2,831 crore) and Rs 370 crore net loss — 85% loss expansion driven by
              escalating logistics and facility costs. Cash reserves collapsed from Rs 1,331 crore (FY24) to Rs 172
              crore (FY25). Despite being an investor in NimbusPost (Shiprocket's direct aggregator competitor),
              Xpressbees' own operating trajectory is structurally challenged, with Delhivery's CEO publicly questioning
              its survival rationale.


              NimbusPost (~Rs 181 crore FY25 estimated revenue, ~350-400 employees) is the most credible direct
              aggregator rival still operating independently. Xpressbees holds a strategic stake, which provides carrier
              access advantages and capital support. NimbusPost competes primarily on lower merchant-facing rates and
              faster COD remittance timelines (2-3 days vs. Shiprocket's 2-4 days per independent comparisons) with 25+
              carrier integrations.


              ClickPost (Series A, ~$7M total funding from Inflexor, Athera, Riverwalk, Rebright) targets the enterprise
              D2C segment (Nykaa, Puma, Acer) with 350+ global carrier integrations, advanced NDR/SLA analytics, and
              post-purchase experience tools. It processes over 1 million shipments daily but is not an aggregator in
              the traditional sense — it charges enterprise SaaS fees rather than earning the carrier rate spread.


              Unicommerce (NSE: UNIECOM, listed August 2024, market cap Rs 967 crore as of May 2026) reported Rs 204.3
              crore FY26 revenue (52% YoY), Rs 20.5 crore PAT, and Rs 43.9 crore adjusted EBITDA. Its OMS/WMS platforms
              serve 450+ enterprise brands. It directly competes with Shiprocket's Engage360, Checkout, and analytics
              modules rather than core shipping, but its inclusion of logistics allocation (ShipSense AI) blurs this
              boundary.
