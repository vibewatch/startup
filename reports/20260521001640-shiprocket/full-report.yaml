      - number: '8.4'
        title: IPO Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              Shiprocket's IPO path is procedurally clear: SEBI granted approval on October 31, 2025, and the Updated
              Draft Red Herring Prospectus was filed on December 12, 2025. The company targets a book-built offering
              with no price band announced as of May 2026. The IPO mechanism is a 100% book-built offer; the pre-IPO
              placement of up to ₹220 crore reduces the fresh issue if exercised. Proceeds of ₹294 crore earmarked for
              marketing and merchant acquisition represent the largest single use of funds and the most
              diligence-sensitive allocation, as no CAC or payback metric has been publicly disclosed to assess ROI.
              Debt repayment of ₹211 crore would reduce the ₹233.8 crore borrowings outstanding as of September 2025,
              improving leverage but not altering cash generation.

              The most critical outstanding diligence asks are: (1) segment gross margin by core vs. emerging
              sub-segments — without which the structural profitability path cannot be modelled; (2) realised ASP per
              shipment net of cashbacks, bridging list pricing to reported revenue; (3) CAC and payback by channel,
              validating the ₹294 crore marketing allocation; (4) FLDG utilisation under the ₹200 million cap for
              Shiprocket Capital; and (5) residual acquisition goodwill carrying values following the FY25 impairments.
              Absent these five data sets, the 6.2x FY25 revenue multiple cannot be verified from a first-principles
              unit-economics model.

              Thesis-break triggers: NRR retreating below 100% for two consecutive periods would signal net merchant
              churn and eliminate the SaaS premium; Power ARPU failing to reach ₹0.95+ crore by FY26E would confirm
              revenue concentration weakness; IPO market cap below ₹8,000 crore at price band implies a negative return
              vs. last round; Delhivery crossing 200,000 SME merchants would constitute structural market-share threat;
              and additional acquisition impairments exceeding ₹100 crore would confirm capital-allocation risk.
