      - number: '4.4'
        title: Capital Adequacy, Traction, and Financing Path
        blocks:
          - type: paragraph
            body: >
              At March 31, 2025, Shiprocket held ₹501.7 crore in cash and bank balances, part of ₹1,254.6 crore in total
              current assets. Total borrowings at September 30, 2025 were ₹2,337.85 million (≈₹233.8 crore), comprising
              primarily short-term bank credit and overdraft facilities. The Company Overview chapter details the full
              round-by-round funding chronology; for capital-adequacy purposes the key point is that Shiprocket has
              raised over ₹2,700 crore ($320M+) in cumulative equity across multiple rounds with Temasek, LightRock,
              Bertelsmann, Tribe Capital, Zomato, PayPal, MUFG Bank, and KDT Ventures among investors, and reached
              unicorn status at $1.3 billion valuation in 2022. The company's stated reason for the IPO is growth
              acceleration rather than survival: the CFO explicitly said the business has "a reasonably healthy cash
              balance." Of the planned ₹1,100 crore fresh issue proceeds: ₹294 crore is earmarked for marketing and
              merchant acquisition; ₹211 crore for technology infrastructure; ₹211 crore for debt repayment and
              prepayment; and the remainder for inorganic acquisitions and general corporate purposes including
              fulfilment-centre lease and commission expenses. A pre-IPO placement of up to ₹220 crore is being
              considered, which would reduce the fresh issue size. H1 FY26 net loss of ₹38.3 crore at ₹942.7 crore
              revenue (annualised ~₹1,885 crore) implies the company is operating near breakeven absent ESOP costs. The
              FLDG pilot under Shiprocket Capital is capped at ₹200 million total exposure; no defaults had been
              recorded as of the UDRHP date, but the programme creates contingent liability that scales if the pilot
              expands without external credit enhancement. Acquisition-related borrowings and any future warehouse-lease
              obligations from fulfilment-centre expansion are the principal capital-intensity drivers.
