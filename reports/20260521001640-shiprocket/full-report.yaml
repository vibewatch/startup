      - number: '5.2'
        title: Platform Architecture & Technology Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Shiprocket's technology stack is built on a cloud-native microservices architecture orchestrated through
              containers and served via third-party cloud infrastructure. Each business capability—order management,
              courier allocation, tracking, fulfillment routing, checkout, and analytics—operates as an independent
              microservice, enabling fault isolation, independent scaling, and continuous deployment without
              full-platform downtime. An Apache Kafka event backbone processes 400 million events daily, enabling
              asynchronous, real-time communication between microservices. This event-driven design allows upserts
              (idempotent writes) to keep database state consistent even when events replay during failures.

              The database layer relies on MySQL with a hybrid sharding strategy. Vertical sharding splits the orders
              table into a hot orders table (frequently accessed) and an orders_meta table (less-accessed) in a separate
              database, reducing I/O. Horizontal sharding organizes data by year, keeping only the prior 12 months in
              the active database and routing older queries via Elasticsearch-indexed metadata to year-specific
              archives. The platform also uses Debezium for CDC log streaming (450 GB/day) and has 30+ DB instances. As
              of September 2025, the platform runs 7,604 vCPUs and 27.35 TB of memory, a 99.7%/128% YoY increase from
              September 2024. API traffic grew from 6.31 billion monthly hits in 2024 to 12.22 billion in 2025. The DRHP
              discloses ISO certification for the infrastructure. The platform runs on third-party cloud, creating a
              dependency on cloud-provider SLAs outside Shiprocket's direct control.
            claimRefs:
              - CE011
