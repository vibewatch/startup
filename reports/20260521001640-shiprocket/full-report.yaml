companyProfile:
  summary: >
    Shiprocket is an Indian commerce-enablement platform that helps merchants manage shipping, fulfillment, checkout,
    marketing, cross-border logistics, and merchant financing through an asset-light software layer sitting on top of
    third-party logistics partners. The legal entity was incorporated in New Delhi in 2011 as Bigfoot Retail Solutions,
    while the Shiprocket platform is generally described as launching in 2017 under founders Saahil Goel, Gautam Kapoor,
    Vishesh Khurana, and Akshay Ghulati. Shiprocket now reports 42 active courier partners, 19,000+ serviceable Indian
    pin codes, cross-border reach into 160+ countries in the DRHP (220+ in marketing materials), and active merchants of
    165,231 in FY2025. FY25 revenue reached ₹1,632 crore with core-business NRR of 103.51% and consolidated cash EBITDA
    turning positive at ₹7 crore. The December 2024 Series E-III extension priced the company at about $1.21B, and a
    ₹2,342.3 crore IPO is planned following SEBI filings in 2025.
