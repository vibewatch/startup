          - type: callout
            title: Asset-Light Model Is a Double-Edged Sword
            body: >-
              The asset-light aggregator model enables rapid geographic and category expansion without capital
              commitment, but it structurally transfers last-mile service quality risk to third-party courier partners.
              Shiprocket Quick, the hyperlocal product, extends this risk to same-day delivery—a segment where consumer
              expectations are especially high and failures are immediately visible.
