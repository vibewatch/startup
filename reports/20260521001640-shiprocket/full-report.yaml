            body: >-
              Five courier partners carry 86% of shipment volume as of September 2025, and Shiprocket holds no exclusive
              contracts with any logistics partner. A strategic prioritization shift or exit by even one top courier
              could impair SLAs for the majority of merchants, with no contractual backstop. This is the most
