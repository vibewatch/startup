      - number: '7.4'
        title: Financial Model and Credit Risks
        blocks:
          - type: paragraph
            body: >
              Shiprocket's financial risk profile is defined by four compounding factors: persistent net losses,
              negative operating cash flows, a high goodwill-to-asset ratio, and a credit exposure through FLDG lending.
              On losses, the company reported restated net losses of ₹744.49 million in FY25, ₹5,951.81 million in FY24,
              and ₹3,593.08 million in FY23. The FY25 improvement (a 87.5% loss reduction) resulted primarily from cost
              restructuring and reduced acquisition goodwill charges rather than a step-change in core operating
              economics. Revenue was ₹16,323 million in FY25, with the path to profitability at the implied IPO
              valuation of approximately ₹24,000–27,000 crore (at pre-IPO secondary transaction multiples) requiring
              continued revenue growth at low incremental cost. Operating cash flows were negative ₹2,159.92 million in
              FY24 and negative ₹1,379.57 million in FY23; FY25 operating cash flow data from the DRHP suggests
              continued negative free cash flow before IPO proceeds. This means Shiprocket remains dependent on external
              financing — equity and possibly debt — to fund operations, making the IPO proceeds and any post-IPO
              capital raises essential to its operating plan. The FLDG-backed credit pilot is capped at ₹200 million
              aggregate by RBI Digital Lending Directions 2025, with a 5% limit per outstanding loan portfolio; while
              this limits near-term upside from the financial services revenue line, it also caps the credit loss
              exposure. Goodwill at 44.62% of total assets (FY25) reflects the acquisition-heavy growth strategy; the
              FY24 precedent of ₹1,246.41 million Omuni and ₹521.01 million Wigzo impairments confirms that when
              acquired entities underperform, the balance sheet consequences are severe. Any further impairment would
              directly increase reported losses and could trigger debt covenants or investor concern. Working capital
              management — particularly COD remittance float and advance payments from merchants — provides a natural
              offset but is insufficient to cover operating losses at the current scale. The combination of these
              factors means that any revenue growth shortfall, macro-driven merchant spending slowdown, or courier price
              hike could delay breakeven materially, creating valuation risk at the proposed IPO price.
