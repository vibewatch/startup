      - number: '6.4'
        title: Expansion Dynamics and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Revenue concentration at Shiprocket is moderate and improving. In H1FY26 the top 1, 5, and 20 active
              merchants contributed 3.12%, 7.76%, and 17.22% of revenue, respectively — improving from 3.67%, 9.70%, and
              20.20% in FY2025 and 4.37%, 10.30%, and 21.25% in H1FY25. The top 10 merchants collectively contributed
              11.81% in H1FY26. The company reports it experienced no material loss of power merchants in H1FY26,
              FY2025, or FY2024, though concentration in the top cohort remains non-trivial. The identity of the top
              single merchant (contributing 3.12% alone) is not disclosed.


              Land-and-expand dynamics are visible: Power Merchants increasingly adopt multiple products, with 52.27%
              using three or more services — shipping, fulfillment, checkout, cross-border, or financial products — up
              from 39.21% in FY2023. The Emerging Business segment (cross-border, martech, omnichannel) grew 41% YoY in
              FY2025 and now accounts for 20% of total revenue, up from 11% two years earlier. New merchant acquisition
              through the Emerging Business channel increased to 24.23% of additions in H1FY26 from just 3.19% in
              FY2023, showing product-led cross-segment growth.


              Channel dependencies present risks. Shiprocket relies heavily on digital discovery (search engines, social
              media, app stores) to attract new merchants; the DRHP explicitly flags AI-generated overviews and
              algorithm changes as risks to web traffic. Partner-channel exposure is illustrated by the Fynd partnership
              — meaningful for 300+ brands but concentrated in a single platform. The top 5 courier partners handled
              ~86% of shipment volumes in H1FY26 (42 active courier partners total), creating a delivery-quality
              dependency on third-party logistics providers whose service failures reflect on Shiprocket's brand.
