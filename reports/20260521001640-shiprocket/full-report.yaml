            body: >-
              GetApp (3.0/5, 33 reviews), Capterra (3.0/5, 33 reviews), and SaaSworthy (2.9/5 user rating, 1,000+
              ratings) consistently flag billing transparency, unexplained wallet deductions, fake delivery attempts,
              and slow support as unresolved issues. These persist despite the AI platform improvements and suggest a
              product-operations gap that impacts merchant trust and retention.
            calloutType: risk
            claimRefs:
