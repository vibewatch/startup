      - number: '1.5'
        title: Milestone chronology, acquisitions, and adverse events
        blocks:
          - type: paragraph
            body: >-
              Shiprocket's history spans from the incorporation of its legal shell in 2011 through a 2017 brand/product
              launch, a series of acquisitions in 2022, a painful integration period in FY23–FY24, and a recovery into
              cash EBITDA profitability in FY25. The acquisition strategy was aggressive: between February and July 2022
              the company completed at least four transactions—Glaucus Supply Chain Solutions (warehousing), Pickrr
              Technologies (logistics aggregation, approximately $200 million in a cash-and-stock deal representing the
              company's largest acquisition), Omuni (omnichannel commerce, acquired from Arvind Internet for
              approximately Rs 200 crore), and Wigzo (marketing automation, 79% stake). These acquisitions drove an 80%
              revenue surge in FY23 to Rs 1,089 crore but also widened net losses significantly as integration costs,
              ESOP expenses, and goodwill impairments weighed on results. FY24 net loss widened further to Rs 595 crore.


              Adverse events disclosed in the DRHP are material and must be tracked. The DRHP explicitly discloses a
              first information report (FIR) filed by a third party against the company's owners including Saahil Goel;
              a litigation filed by QNT Sports India Private Limited against Pickrr before a Chief Judicial Magistrate
              in October 2024; an impairment loss of Rs 124.6 crore on Omuni in FY25 (performance significantly below
              business-plan projections); and an impairment loss of Rs 52.1 crore on Wigzo in FY25. In July 2025,
              Shiprocket launched Shunya AI and signed a JV agreement with Ultrasafe AI. The company filed its UDRHP
              with SEBI in December 2025 and converted to Shiprocket Limited in February 2025 as part of IPO
              preparation.
