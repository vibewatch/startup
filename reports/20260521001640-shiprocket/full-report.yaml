      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >-
              Four structural forces underpin the Indian ecommerce enablement market's trajectory through 2031. First,
              geographic expansion: tier-2 and tier-3 cities contributed 66% of new D2C orders in FY2026 and tier-3
              cities posted 21% YoY growth accounting for 38% of order volumes in the 2025 summer season, signalling
              that the next wave of Indian ecommerce is sub-metropolitan. This expands Shiprocket's total seller base as
              entrepreneurs in smaller cities seek affordable multi-courier reach without building in-house logistics
              teams. Second, D2C brand proliferation: the Indian D2C market recorded 33% GMV growth and 34% order volume
              growth in FY2026, with AI-driven fulfilment estimated to reduce logistics costs by 18–25% when adopted at
              scale. Third, ONDC democratisation: the open commerce protocol lowers platform dependency, exposes MSMEs
              to national buyers, and creates logistics demand that shipping aggregators can capture without committing
              to marketplace exclusivity. Fourth, cross-border growth: India's $60 billion cross-border merchandise
              retail GMV opportunity—growing at 14–20% CAGR—combined with government initiatives (DDP shipping, duty
              drawback) creates a new revenue pool for ShiprocketX. Supporting these drivers, India's internet
              subscriber base crossed 1.028 billion in December 2025, UPI processed 20.39 billion transactions in
              January 2026, and quick commerce expanded at 70–80% CAGR to reach $7–8 billion in FY25—all raising the
              baseline of digital commerce activity that flows through Shiprocket's platform.
            claimRefs:
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
