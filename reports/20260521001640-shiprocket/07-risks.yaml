company:
  name: Shiprocket
chapter:
  number: 7
  title: Risks
  summary: >
    Shiprocket faces a layered risk profile across legal, operational, partner, financial,
    and people dimensions ahead of its planned ₹2,342 crore IPO. On the legal and regulatory
    front, SEBI UDRHP disclosures reveal four active criminal proceedings filed by the company
    (₹53.91 million in dispute), one criminal and ten tax proceedings against it (₹50.93 million
    total including ₹27.09 million in tax), an FIR against co-founders with Saahil Goel having
    filed a quashing application, a criminal proceeding by QNT Sports against acquired entity
    Pickrr (October 2024), and a May 2026 consumer commission case filed by Orosil Smiths.
    Operationally, a September 2025 darknet database-sale alert (Brinztech), persistent Trustpilot
    "Bad" rating of 1.6/5, and over 1,400 PissedConsumer reviews signal merchant-facing quality
    and cybersecurity risks. Partner concentration is the single largest structural risk: the top
    five courier partners account for 83.33% of FY25 shipment volume and 85.75% in H1FY26,
    giving them substantial negotiating leverage. Financially, restated net losses of ₹744.49
    million (FY25), ₹5,951.81 million (FY24), and ₹3,593.08 million (FY23), combined with
    negative operating cash flows, mean the path to profitability at the targeted IPO valuation
    remains contentious. Goodwill represents 44.62% of total assets (FY25) following acquisitions
    including Pickrr (~$200 million) and Omuni, whose FY24 impairment of ₹1,246.41 million
    illustrates the integration risk. The FLDG-capped credit pilot (₹200 million aggregate,
    5% per portfolio) and RBI Digital Lending Directions 2025 compliance add a regulatory
    layer to financial risk. Kill criteria include any courier partner defection reducing top-5
    concentration below 70%, a cybersecurity breach resulting in regulatory action or mass merchant
    churn, and a litigation outcome involving co-founder disqualification.

sections:
  - id: legal-regulatory-risks
    title: Legal and Regulatory Risks
    body: >
      Shiprocket's SEBI Updated Draft Red Herring Prospectus (UDRHP), filed December 12, 2025,
      discloses a material litigation dossier that IPO investors must assess carefully. The company
      has initiated four criminal proceedings with a combined disputed amount of ₹53.91 million,
      arising from alleged fraudulent activities by third parties against Shiprocket. Against
      the company (and its subsidiaries), there is one criminal proceeding, ten tax-authority
      disputes aggregating ₹27.09 million, and one material civil dispute; total exposure on
      the "against" side is approximately ₹50.93 million. The most sensitive item is a criminal
      First Information Report (FIR) lodged by a third party against co-founders including CEO
      Saahil Goel, who has filed a quashing application in the appropriate court — the outcome
      of that application is undisclosed as of the UDRHP date. The subsidiary Pickrr (acquired
      for approximately $200 million in 2022) is the subject of a criminal proceeding by QNT
      Sports at the Chief Judicial Magistrate court, with a complaint filed on October 4, 2024.
      Blue Line Logistics may also seek to implead the company or Pickrr through a public-database
      search. An entirely new proceeding — filed by Orosil Smiths India Limited at the District
      Consumer Disputes Redressal Commission (South District), Delhi, in May 2026 — post-dates
      the UDRHP and involves lost shipments, refund claims, compensation for business loss, and
      loss of goodwill; this is not reflected in the UDRHP disclosures and represents incremental
      disclosed risk. On the regulatory front, RBI Digital Lending Directions 2025 constrain
      Shiprocket's Instant COD and FLDG-backed credit pilots: FLDG aggregate exposure is capped
      at ₹200 million across the portfolio, with a 5% per-outstanding-loan limit; the company must
      comply with these caps or risk regulatory sanction. Consumer courts across India have received
      hundreds of complaints against Shiprocket from aggrieved merchants and end consumers, with
      Trustpilot registering 1.6/5 ("Bad"), PissedConsumer showing over 1,400 reviews, and
      ConsumerComplaints.in accumulating hundreds of unresolved cases. While individual consumer
      complaints rarely constitute material legal risk, their volume signals systemic service
      failures that could invite regulatory scrutiny of consumer protection obligations and
      weigh on brand credibility during the IPO roadshow.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
