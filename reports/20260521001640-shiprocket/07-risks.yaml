figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >
      Risk heatmap plotting Shiprocket's identified risks by likelihood (columns) and severity
      (rows), with cell labels indicating specific risk items. Positions reflect public-evidence
      assessment and are indicative, not actuarial.
    data:
      columns:
        - "Low Likelihood"
        - "Medium Likelihood"
        - "High Likelihood"
      rows:
        - label: "Critical Severity"
          values:
            - "—"
