  - id: operational-cybersecurity-risks
    title: Operational and Cybersecurity Risks
    body: >
      Shiprocket's platform reliability and data security are material concerns ahead of the IPO.
      In September 2025, cybersecurity research firm Brinztech issued an alert stating that a
      threat actor had claimed on darknet forums to be selling Shiprocket's database, including
      customer personally identifiable information (PII) and details of a platform vulnerability.
      Shiprocket has not publicly confirmed or denied the breach, and the company has not filed
      an incident report with CERT-In or equivalent authority that is publicly accessible. Without
      independent forensic confirmation, the scope and validity of this claim remain unverified,
      but it constitutes a material risk disclosure item for IPO investors, particularly given
      India's upcoming DPDPA (Digital Personal Data Protection Act) enforcement environment.
      Operational quality risk is evidenced by persistent merchant complaints about fake delivery
      attempts (couriers marking orders "out for delivery" or "delivery attempted" without
      actually attempting them), unauthorized weight-discrepancy deductions, delayed COD remittances,
      and unresponsive customer support. Trustpilot's 1.6/5 "Bad" rating, Capterra's review corpus
      citing pricing disputes and support failures, PissedConsumer's 1,400+ reviews, and
      ConsumerComplaints.in cases all corroborate systemic last-mile execution and billing integrity
      issues. These are not isolated incidents — the pattern persists across multiple independent
      platforms. Quick commerce (10-minute and 30-minute delivery) is structurally disrupting the
      D2C marketplace: Shiprocket launched "Quick" in 58 cities with 7,070 merchant sign-ups
      (H1FY26), but Zomato, Swiggy, and Blinkit are entrenching aggregated logistics networks
      that may serve D2C brands directly, reducing reliance on Shiprocket's aggregation layer.
      The ONDC marketplace has similarly failed to achieve the merchant activation volumes initially
      projected, reducing one anticipated demand channel. Cross-border operations face rising
      customs complexity: S&P Global and Seatrade Maritime both cite 2026 regulatory changes
      in trade and shipping as top-tier risks, creating compliance overhead for Shiprocket's
      ShiprocketX segment. Collectively, these operational risks — delivery quality, cybersecurity,
      competitive displacement, and cross-border compliance — require operational due diligence
      beyond DRHP disclosures before any investment commitment.
    claimRefs:
      - CR013
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
