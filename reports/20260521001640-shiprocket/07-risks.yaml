  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory / legal risk register completeness
      missingEvidence: >
        The SEBI UDRHP litigation summary does not provide individual case-by-case detail
        (specific courts, case numbers, hearing dates, or named opposing parties) for the
        four criminal proceedings by Shiprocket, the single criminal proceeding against it,
        or the ten tax disputes. Post-UDRHP proceedings (Orosil Smiths, potential Blue Line
        impleadment) are sourced only from secondary platforms and have not been independently
        verified with official court records. FY26 (post-September 2025) litigation status
        for all proceedings is unknown.
      whyItMatters: >
        Litigation details are material diligence items for any IPO investor: case-by-case
        court status, likelihood of adverse outcomes, and indemnification or insurance coverage
        are not assessable from the UDRHP summary alone. The QNT Sports CJM case and potential
        Blue Line impleadment represent inherited Pickrr liabilities whose quantum is unquantified.
      diligencePath: >
        Request a litigation schedule from legal counsel with case numbers, courts, current
        hearing status, and estimated liability range for each proceeding; verify post-UDRHP
        proceedings via official NCDRC and DCDRC case search systems; obtain D&O insurance
        policy details covering promoter litigation.
      relatedTableRefs:
        - TR001
      relatedQuestionRefs:
        - QR011
        - QR016

    - type: missing-source
      severity: material
      topic: September 2025 cybersecurity breach scope and regulatory disclosure
      missingEvidence: >
        The September 2025 Brinztech darknet alert asserting that Shiprocket's database was
        for sale has not been confirmed by any independent forensic firm, CERT-In incident
        report, or Shiprocket management statement. The scope (number of records, type of PII,
        financial data exposure), the validity of the threat actor's claim, and whether any
        regulatory notification was made remain entirely unknown from public sources.
      whyItMatters: >
        If the breach is confirmed and Shiprocket failed to notify CERT-In within the
        mandatory 6-hour window under the IT Act / CERT-In Directions, the company faces
        regulatory penalties and IPO prospectus liability for non-disclosure. DPDPA
        enforcement in 2026 may also impose additional data-principal notification obligations.
      diligencePath: >
        Request a board-approved cybersecurity incident register; obtain written confirmation
        of whether CERT-In was notified for any incident in 2025–26; commission an independent
        penetration test and security posture assessment before IPO commitment; verify
        cyber-insurance coverage and limits.
      relatedQuestionRefs:
        - QR022
        - QR023

    - type: private-evidence-only
      severity: minor
      topic: courier partner contract terms and exclusivity provisions
      missingEvidence: >
        The identities, contract terms, pricing mechanisms, and exclusivity provisions of
        Shiprocket's top-5 courier partners are not publicly disclosed. Whether Shiprocket
        has minimum volume guarantees, termination protections, or pricing caps in contracts
        with its highest-concentration partners is unknowable from public sources.
      whyItMatters: >
        The courier concentration risk cannot be properly assessed without understanding
        whether partners have termination-for-convenience clauses, whether pricing is
        fixed or variable, and whether any partner has the right to refuse service during
        peak volumes. Adverse contract terms would significantly raise the severity rating
        of the concentration risk.
      diligencePath: >
        Request redacted copies of agreements with top-5 courier partners covering pricing
        mechanisms, termination provisions, SLA obligations, and exclusivity terms;
        interview courier partner relationship managers; assess exposure to unilateral
        pricing renegotiation.
      relatedQuestionRefs:
        - QR024

