  - id: financial-model-credit-risks
    title: Financial Model and Credit Risks
    body: >
      Shiprocket's financial risk profile is defined by four compounding factors: persistent net
      losses, negative operating cash flows, a high goodwill-to-asset ratio, and a credit exposure
      through FLDG lending. On losses, the company reported restated net losses of ₹744.49 million
      in FY25, ₹5,951.81 million in FY24, and ₹3,593.08 million in FY23. The FY25 improvement
      (a 87.5% loss reduction) resulted primarily from cost restructuring and reduced acquisition
      goodwill charges rather than a step-change in core operating economics. Revenue was ₹16,323
      million in FY25, with the path to profitability at the implied IPO valuation of approximately
      ₹24,000–27,000 crore (at pre-IPO secondary transaction multiples) requiring continued revenue
      growth at low incremental cost. Operating cash flows were negative ₹2,159.92 million in FY24
      and negative ₹1,379.57 million in FY23; FY25 operating cash flow data from the DRHP suggests
      continued negative free cash flow before IPO proceeds. This means Shiprocket remains dependent
      on external financing — equity and possibly debt — to fund operations, making the IPO proceeds
      and any post-IPO capital raises essential to its operating plan. The FLDG-backed credit pilot
      is capped at ₹200 million aggregate by RBI Digital Lending Directions 2025, with a 5%
      limit per outstanding loan portfolio; while this limits near-term upside from the financial
      services revenue line, it also caps the credit loss exposure. Goodwill at 44.62% of total
      assets (FY25) reflects the acquisition-heavy growth strategy; the FY24 precedent of
      ₹1,246.41 million Omuni and ₹521.01 million Wigzo impairments confirms that when acquired
      entities underperform, the balance sheet consequences are severe. Any further impairment
      would directly increase reported losses and could trigger debt covenants or investor concern.
      Working capital management — particularly COD remittance float and advance payments from
      merchants — provides a natural offset but is insufficient to cover operating losses at the
      current scale. The combination of these factors means that any revenue growth shortfall,
      macro-driven merchant spending slowdown, or courier price hike could delay breakeven
      materially, creating valuation risk at the proposed IPO price.
    claimRefs:
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
    figureRefs:
      - FR002

  - id: people-execution-kill-criteria
    title: People, Execution Risk, and Kill Criteria
    body: >
      Key-person concentration in CEO and co-founder Saahil Goel is the primary people risk at
      Shiprocket. Goel has been named in a criminal FIR filed by a third party, for which he has
      filed a quashing application. Any adverse outcome in that proceeding — a failed quash
      application leading to charge-sheet, arrest, or disqualification — would constitute an
      immediate material adverse event that would almost certainly halt the IPO process and trigger
      investor redemption clauses. Beyond litigation risk, Goel's centrality to strategy, investor
      relations, and corporate culture means his departure under any circumstances (even voluntary)
      would be a significant leadership discontinuity, given that Shiprocket has no publicly
      disclosed CEO succession plan. The company's acquisition-driven growth model has created
      organizational complexity: post-Omuni, Wigzo, Rocketbox, and Pickrr integrations, the
      leadership roster is large and distributed, with Inc42's analysis of Shiprocket's org chart
      noting a layered structure across engineering, product, operations, and marketing functions.
      Integration execution risk — whether acquired teams are retained, whether technology stacks
      have been unified, and whether revenue synergies have materialized — remains partially
      opaque from public disclosures alone. IPO execution risk is real: SEBI granted approval
      (nod confirmed by Entrackr, April 2026), but listing timing, market conditions, and
      oversubscription dynamics can diverge from plan, and any new adverse news between filing
      and listing could require re-filing or withdrawal. Kill criteria defined for this investment
      include: (1) courier concentration rising above 90% in top-5 partners without a meaningful
      alternative pipeline; (2) a confirmed cybersecurity breach resulting in DPDPA regulatory
      action or mass merchant exodus; (3) Saahil Goel's quashing application being dismissed,
      leading to disqualification proceedings; (4) goodwill impairment exceeding ₹2,000 million
      in any year post-IPO, signaling systematic acquisition failure; and (5) operating cash
      outflow exceeding ₹3,000 million in FY26, indicating that the IPO proceeds are being
      consumed faster than the stated plan.
    claimRefs:
      - CR042
      - CR043
      - CR044
      - CR045
      - CR046
      - CR047
      - CR048
    tableRefs:
      - TR004
      - TR005

