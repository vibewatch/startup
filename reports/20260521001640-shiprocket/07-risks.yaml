callouts:
  - id: callout-courier-concentration
    type: risk
    title: Structural Courier Concentration — Highest Probability, Highest Impact
    body: >
      Shiprocket's top-five courier partners account for 83.33% of FY25 and 85.75% of
      H1FY26 shipment volume. As an aggregator without a first-party courier fleet,
      Shiprocket has limited ability to compel partners to maintain pricing, service levels,
      or exclusivity. Any defection by a top-three partner would require emergency re-routing
      that could breach merchant SLAs and trigger mass complaints. This concentration is the
      highest-probability, highest-impact structural risk in the investment thesis.
    claimRefs:
      - CR023
      - CR024

  - id: callout-goel-fir
    type: risk
    title: CEO FIR Overhang — Kill Trigger if Quashing Fails
    body: >
      Saahil Goel, CEO and co-founder, has a criminal FIR filed against him by a third party,
      and has filed a quashing application in the appropriate court. If the quashing application
      is dismissed and charges are framed, there is a material risk of SEBI disqualifying him
      as a director-promoter, which would effectively halt the IPO process. This is defined as
      a kill trigger in the mitigation table. Investors should require an unconditional update on
      the quashing application status as a condition of any pre-IPO commitment.
    claimRefs:
      - CR003
      - CR042
      - CR043

  - id: callout-breach-uncertainty
    type: risk
    title: September 2025 Cybersecurity Alert — Unconfirmed but Disclosure Obligation Possible
    body: >
      Brinztech's September 2025 darknet alert citing a Shiprocket database sale has not been
      publicly confirmed or denied by Shiprocket. If the breach is confirmed, India's DPDPA
      and CERT-In notification regulations may impose disclosure obligations and penalties.
      Investors should request a formal cybersecurity assessment, penetration test results, and
      written confirmation of whether any breach notification was made to CERT-In.
    claimRefs:
      - CR014

