company:
  name: Shiprocket
chapter:
  number: 6
  title: Customers
  summary: >
    Shiprocket's active merchant base stood at 145,269 in H1FY26 (six months ended
    September 30, 2025), down from 165,231 in FY2025, with 8,596 "Power Merchants"
    (>100 transactions/month) estimated to drive the majority of revenue. End-consumer
    repeat rates have risen steadily from 42.37% in FY2023 to 64.56% in H1FY26,
    evidencing deepening platform stickiness. Named case studies across D2C brands
    (Studd Muffyn, Ghar Soaps, Giva, Blackberrys, Bata) show multi-product expansion
    and revenue uplift, though claims carry company-only attribution caveats.
    Trustpilot's "Bad" 1.6/5 rating and merchant complaints about fake delivery
    attempts and unauthorized deductions represent a material adverse signal on
    last-mile execution and support quality that warrants independent due diligence.

sections:
  - id: customer-segmentation
    title: Customer Base Segmentation and Platform Reach
    body: >
      Shiprocket defines its merchant universe as MSMEs (businesses with annual
      revenue below ₹2,500 million) and Large Retailers (above ₹2,500 million
      revenue per annum). As of the six months ended September 30, 2025 (H1FY26),
      the platform counted 145,269 Active Merchants — merchants who conducted at
      least one transaction during the period. The company's marketing materials
      reference "4 lakh+ businesses scaled," but this is a cumulative all-time
      figure and must not be conflated with the SEBI-filed active merchant count
      of 145,269 for H1FY26 or 165,231 for FY2025. The marketing figure exceeds
      the active count because it captures every merchant who ever transacted on
      the platform, including those who have since churned or reduced activity.


      Power Merchants — those averaging more than 100 unique transactions per active
      month — numbered 8,596 in H1FY26 (5.92% of the active base), and their
      per-merchant ARPU was ₹0.94 million for the six-month period, implying they
      collectively drive an estimated high-majority share of platform revenue even
      though they represent a small fraction of the merchant count. The non-power
      majority (136,673 merchants) contributes the long tail of volume at substantially
      lower ARPU. Cross-border merchants served by ShiprocketX numbered 4,555 in
      H1FY26 with ₹3,115.8 million aggregate GMV — still a small but rapidly growing
      segment (3.1% of active merchants). Fulfillment customers (using Shiprocket's
      warehouse and 3PL network) represent another sub-segment; the company claims
      1,000+ ecommerce businesses for fulfillment, though a precise active count is
      not separately disclosed in the DRHP. Tier 2 and Tier 3 city sellers are an
      explicit strategic target, served through geo-targeted digital marketing, radio
      campaigns on regional FM stations, and planned new regional offices.
    claimRefs:
