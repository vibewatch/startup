  - id: TU005
    title: Expansion and Concentration Risk Table
    columns:
      - Expansion Driver
      - Concentration Risk
      - Severity
      - Impact if Stressed
      - Diligence Path
    rows:
      - - Land-and-expand via product cross-sell (Power Merchants)
        - Power merchants 5.92% of base; ~85% of revenue estimated
        - High
        - Loss of power merchant cohort would be materially adverse
        - Audited segment revenue; power merchant churn rate; contract length
      - - Tier 2 / 3 city merchant acquisition
        - Coverage thin; 7 regional offices in metro areas primarily
        - Medium
        - Slow Tier 2/3 expansion limits TAM realization and new-merchant adds
        - Field reference checks in Tier 2/3 cities; non-metro merchant churn
      - - Cross-border (ShiprocketX) scale-up
        - "4,555 merchants = 3.1% of active base; 4 shipping lanes only"
        - Medium
        - Immature revenue; high competition from global logistics incumbents
        - Lane-specific merchant adds quarterly; GMV per lane; competitor pricing
      - - Fynd channel partnership (300+ D2C brands)
        - Single-partner channel; no exclusivity confirmed
        - Low-Medium
        - Channel concentration; Fynd could integrate competing logistics
        - Confirm exclusivity terms; track brand adds per quarter; MFN clause
      - - Checkout platform (7,688 merchants; ₹27,382.78M GMV)
        - Checkout proprietary; switching cost moderate
        - Medium
        - Competition from Razorpay Magic Checkout and similar
        - Merchant churn from checkout; GMV retention after product switch
      - - Top merchant concentration (top 1 = 3.12% of revenue)
        - Single merchant contributes over 3% alone; identity not disclosed
        - Medium
        - Material but manageable loss; improving trend (was 4.37% in H1FY25)
        - Identity of top merchant; contract renewal terms and covenants
      - - Courier partner concentration (top 5 = ~86% of volume)
        - Dependence on Bluedart, Delhivery, and top partners
        - High
        - Service disruption by top courier degrades merchant satisfaction
        - SLA-level data per courier; contingency for courier exit or dispute
    notes: >
      Power merchant revenue share (~85%) is an estimate derived from ARPU × count
      relative to total H1FY26 revenue from operations; this is not the figure disclosed
      in the DRHP. Top merchant concentration data and courier share are SEBI UDRHP
      facts. Fynd exclusivity status is based on news reporting and not confirmed by
      agreement disclosure.

