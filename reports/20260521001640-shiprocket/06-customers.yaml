callouts:
  - calloutType: strength
    title: Rising Consumer Stickiness Across Five Consecutive Periods
    body: >
      End-consumer repeat rates have increased every measured period — from 42.37% in
      FY2023 to 64.56% in H1FY26 — without a single reversal. In absolute terms,
      27.29 million of 42.27 million H1FY26 consumers were returning buyers. Combined
      with merchant cohort transaction multiples (FY2018 cohort at 20.93x by Year 7),
      this suggests Shiprocket-enabled merchants are growing faster than the platform's
      own active merchant count would imply, with existing cohorts expanding materially.
    claimRefs:
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029

  - calloutType: risk
    title: MSME Churn Structural Vulnerability
    body: >
      The DRHP explicitly acknowledges that a large portion of the merchant base
      comprises MSMEs "which are more vulnerable to business failure and may face
      challenges in sustaining their operations." An increase in merchant turnover
      raises CAC and pressures unit economics. The H1FY26 active count of 145,269 is
      lower than FY2025's 165,231, implying a net reduction in active merchants at the
      full-year level even as gross new additions remain healthy at 56,925. This gap —
      active count declining even as acquisitions continue — is a structural signal
      of ongoing MSME merchant attrition that investors should model explicitly.
    claimRefs:
      - CU001
      - CU002
      - CU047

  - calloutType: insight
    title: 4-Lakh Marketing Claim vs. 145K Active Merchants — Reconciliation Required
    body: >
      Shiprocket markets "4 lakh+ (400,000+) businesses scaled" prominently. The SEBI
      UDRHP shows 145,269 active merchants in H1FY26 and 165,231 in FY2025. The
      ~2.5x gap between the marketing claim and the active count reflects cumulative
      all-time registrations (including churned or inactive merchants), not the current
      engaged base. Diligence analysis should anchor on the DRHP-filed active count and
      avoid treating the marketing figure as a proxy for current customer traction.
    claimRefs:
      - CU001
      - CU002
      - CU004

  - calloutType: risk
    title: Last-Mile Delivery Quality Risk Reflected in Consumer Ratings
    body: >
      Trustpilot rates Shiprocket 1.6/5 ("Bad") based on a pattern of fake delivery
      attempts, non-responsive support, and unauthorized wallet deductions. Though most
      last-mile failures originate with third-party courier partners, the Shiprocket
      brand absorbs consumer dissatisfaction. This creates a reputational externality
      that can elevate merchant churn if merchants attribute poor consumer experience
      to the logistics platform. The top 5 courier partners handle ~86% of volume,
      concentrating this service risk.
    claimRefs:
      - CU043
      - CU044
      - CU045
      - CU050

