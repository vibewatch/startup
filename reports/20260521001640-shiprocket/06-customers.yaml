  - id: retention-durability
    title: Retention, Durability, and Cohort Behavior
    body: >
      End-consumer repeat rates — the share of consumers served in a given period
      who had previously transacted through a Shiprocket-enabled merchant —
      have risen consistently over five periods: 42.37% in FY2023, 46.79% in FY2024,
      51.11% in FY2025, 57.31% in H1FY25, and 64.56% in H1FY26. This is an aggregate
      platform metric across the Core Business (excluding Pickrr end consumers), not
      a cohort-specific retention rate, but the upward trend strongly suggests
      increasing consumer stickiness on Shiprocket-enabled storefronts. In absolute
      terms, 27.29 million of the 42.27 million consumers served in H1FY26 were repeat
      buyers, up from 15.74 million in FY2023.


      For merchant cohorts, the DRHP discloses transaction retention multiples rather
      than merchant count retention rates. The FY2018 merchant cohort grew its
      transaction volume 20.93 times by Year 7 (FY2025), the FY2019 cohort 4.80 times
      by Year 6, the FY2020 cohort 2.56 times by Year 5, the FY2021 cohort 1.51 times
      by Year 4, and FY2022 and FY2023 cohorts reached 1.71x and 1.10x by Years 3 and 2
      respectively. These multiples indicate deepening engagement rather than mere
      retention, showing that merchants who stay on the platform expand their transaction
      volumes substantially over time. This is a meaningful proxy for net revenue
      retention, though the company does not disclose a formal NRR or GRR figure.


      CAC for the Core Business has declined from ₹4,772 in FY2023 to ₹3,361 in FY2025
      and further to ₹2,818 in H1FY26, indicating improving unit economics on
      acquisition. Power merchant cross-sell depth is evidenced by 52.27% of power
      merchants using more than three products in H1FY26. Self-serve onboarding
      reached 96.92% (no human support required) with a 62.57% First Call Resolution
      Rate, suggesting the platform handles scale without proportionate support cost
      growth. Platform satisfaction signals are mixed: G2 shows 4.0/5 from 108 reviews,
      while Trustpilot rates Shiprocket "Bad" at 1.6/5 — mostly from end consumers
      experiencing failed deliveries — and Capterra customer support scores average
      2.4/5. These consumer-facing ratings reflect last-mile partner performance as much
      as Shiprocket's own platform quality, but reputational spillover onto merchants
      is a retention risk.
    claimRefs:
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: expansion-concentration
    title: Expansion Dynamics and Concentration Risk
    body: >
      Revenue concentration at Shiprocket is moderate and improving. In H1FY26 the
      top 1, 5, and 20 active merchants contributed 3.12%, 7.76%, and 17.22% of revenue,
      respectively — improving from 3.67%, 9.70%, and 20.20% in FY2025 and 4.37%,
      10.30%, and 21.25% in H1FY25. The top 10 merchants collectively contributed
      11.81% in H1FY26. The company reports it experienced no material loss of power
      merchants in H1FY26, FY2025, or FY2024, though concentration in the top cohort
      remains non-trivial. The identity of the top single merchant (contributing 3.12%
      alone) is not disclosed.


      Land-and-expand dynamics are visible: Power Merchants increasingly adopt multiple
      products, with 52.27% using three or more services — shipping, fulfillment, checkout,
      cross-border, or financial products — up from 39.21% in FY2023. The Emerging
      Business segment (cross-border, martech, omnichannel) grew 41% YoY in FY2025
      and now accounts for 20% of total revenue, up from 11% two years earlier.
      New merchant acquisition through the Emerging Business channel increased to
      24.23% of additions in H1FY26 from just 3.19% in FY2023, showing product-led
      cross-segment growth.


      Channel dependencies present risks. Shiprocket relies heavily on digital
      discovery (search engines, social media, app stores) to attract new merchants;
      the DRHP explicitly flags AI-generated overviews and algorithm changes as risks
      to web traffic. Partner-channel exposure is illustrated by the Fynd partnership —
      meaningful for 300+ brands but concentrated in a single platform. The top 5
      courier partners handled ~86% of shipment volumes in H1FY26 (42 active courier
      partners total), creating a delivery-quality dependency on third-party logistics
      providers whose service failures reflect on Shiprocket's brand.
    claimRefs:
      - CU035
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040
      - CU041
      - CU042
    tableRefs:
      - TU005

  - id: adverse-signals
    title: Adverse Evidence and Platform Weak Spots
    body: >
      The most significant adverse signal is Shiprocket's Trustpilot rating of 1.6/5
      ("Bad"), aggregated from reviews in late 2025 and early 2026. Complaints document
      fake delivery attempts (couriers marking orders as delivered or attempted without
      visit), non-responsive customer support, unauthorized volumetric weight deductions
      from merchant wallets, coercive wallet-refund-only policies, and orders marked
      "customer unavailable" without any contact attempt. A merchant complaint formally
      filed at consumercourt.net alleges "unfair trade practices, deficiency of service,
      unauthorized deductions, coercive refund policy, mental harassment and financial
      loss," suggesting cases have escalated to formal consumer grievance forums.


      G2 reviews (4.0/5) reveal a split audience: merchant-side users generally praise
      courier aggregation and onboarding ease, while enterprise users and D2C sellers
      with high volumes flag support delays and billing discrepancies. SoftwareSuggest
      reviews identify similar patterns. These adverse signals are mostly attributable
      to third-party courier partners, which Shiprocket aggregates without owning the
      final mile; however, aggregator platforms bear reputational responsibility for
      partner failures that end consumers attribute to Shiprocket branding.


      DRHP-disclosed structural risks include: (a) MSME merchant churn — many
      merchants are early-stage and face scaling challenges; (b) slower-than-expected
      integration of Pickrr, Omuni (₹124.6Cr impairment in FY2025), and Swiftly
      (₹52.1Cr impairment) acquisitions; (c) dependence on online marketing channels
      that are vulnerable to AI-driven search disruption; and (d) the Emerging Business
      segment (cross-border, martech, fulfillment) remains loss-making while requiring
      continued investment. New product categories (Shiprocket Quick, ShiprocketX) are
      early-stage, with Quick generating revenue only from Q4FY25 onward, and cross-border
      competition is intense from established global logistics players.
    claimRefs:
      - CU043
      - CU044
      - CU045
      - CU046
      - CU047
      - CU048
      - CU049
      - CU050

