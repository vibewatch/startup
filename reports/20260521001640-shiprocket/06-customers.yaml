  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: net revenue retention
      missingEvidence: >
        Formal NRR (Net Revenue Retention) or GRR (Gross Revenue Retention) metrics
        by merchant cohort — the standard SaaS/marketplace durability KPI — are not
        disclosed in the SEBI UDRHP or any public filing.
      whyItMatters: >
        Without NRR/GRR, it is impossible to quantify whether revenue per cohort is
        expanding (net expansion revenue from upsell and cross-sell) or contracting
        (churn losses exceed expansion). The transaction multiple data is a partial proxy
        only for active cohorts, not a net revenue measure inclusive of churn.
      diligencePath: >
        Request management presentation with cohort-level NRR and GRR broken out
        by merchant segment (MSME, mid-market, enterprise), period, and product line.
      relatedQuestionRefs:
        - QU021

    - type: missing-source
      severity: material
      topic: competitor retention comparison
      missingEvidence: >
        Comparable retention or repeat-purchase metrics for major competitors (Delhivery
        for logistics, Unicommerce for e-commerce enablement, ClickPost for shipping
        aggregation) to benchmark Shiprocket's 64.56% repeat rate and merchant cohort
        multiples against the industry.
      whyItMatters: >
        Without a competitive benchmark, it is unclear whether Shiprocket's retention
        metrics represent category leadership or merely match the industry average driven
        by India's growing e-commerce tailwind.
      diligencePath: >
        Review Delhivery's investor filings and Unicommerce's annual reports for
        comparable retention disclosures; contact industry analysts at Redseer or RedSeer
        for market-level repeat-purchase benchmarks.
      relatedQuestionRefs:
        - QU017

    - type: enumeration-incomplete
      severity: minor
      topic: named customer proof table
      missingEvidence: >
        Shiprocket's full power merchant roster (8,596 merchants) is not enumerated, and
        only company-curated DRHP case studies and website testimonials are available.
        Large merchants beyond the eight profiled in the DRHP are not publicly named.
      whyItMatters: >
        Independent reference checks on large enterprise customers (such as boAt, Bata,
        or the anonymous top-1 merchant at 3.12% of revenue) would provide higher-quality
        evidence on renewal intent, satisfaction, and contract terms than company-authored
        case studies.
      diligencePath: >
        Request a reference list of 10–15 power merchants for independent calls; check
        LinkedIn/press releases for merchant announcements of Shiprocket usage.
      relatedTableRefs:
        - TU003
      relatedQuestionRefs:
        - QU007

    - type: missing-source
      severity: material
      topic: MSME churn rate
      missingEvidence: >
        The precise merchant annual churn rate (% of prior-period active merchants not
        active in the current period) is not disclosed, making it impossible to compute
        implicit net merchant retention from the DRHP data.
      whyItMatters: >
        If gross adds of 74,473 in FY2025 and 56,925 in H1FY26 are compared against
        active merchant counts, meaningful attrition is implied, but the exact churn
        rate is not computable from published data alone.
      diligencePath: >
        Request cohort-level merchant active/inactive tables for each fiscal year (FY2022
        through H1FY26) from management; benchmark MSME churn rate against comparable
        platforms in the Redseer study cited in the DRHP.
      relatedQuestionRefs:
        - QU026

