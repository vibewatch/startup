  - id: named-customer-proof
    title: Named Customer Proof and Case-Study Evidence
    body: >
      Shiprocket's SEBI UDRHP discloses six named case studies with quantified
      outcomes. Studd Muffyn (wellness/lifestyle D2C, onboarded January 2021) used
      Domestic Shipping, RTO Suit, Brand Boost, and Checkout, and grew revenue 29
      times from FY2023 to FY2025. Ghar Soaps (skincare D2C, since 2020) deployed
      shipping, fulfilment, and checkout products and grew revenue 15 times over the
      same period. Winston Electronics (grooming D2C, FY2021) with shipping, Checkout,
      RTO Suit, and Instant COD grew revenue 4 times. Giva (jewellery D2C) leveraged
      domestic shipping, cross-border trade, Secure, and Fulfilment and showed a 3x
      revenue engagement increase. Blackberrys (menswear, FY2023) used checkout
      integration and saw a 27% conversion rate uplift and 18% growth in prepaid orders.
      Bata (global footwear) manages 1,500 retail outlets via Shiprocket Omuni with
      unified online/offline order fulfilment.


      All DRHP case studies carry the explicit caveat that revenue improvements
      "do not necessarily mean that our platform was the only factor contributing
      to such increases." This is a meaningful limitation — none of the outcome
      metrics are independently audited, and the sample is curated by Shiprocket.
      From the official customers page, MTR (Orkla India) has shipped online orders
      via Shiprocket for five years, citing reliable, hassle-free service. Lili Origin
      (fragrance D2C, 500,000+ customers) has worked with Shiprocket for one-and-a-half
      years managing logistics through peak demand and escalations. The June 2025 Fynd
      partnership brought Shiprocket's logistics intelligence — courier selection, price
      comparison, and order tracking — live for over 300 active D2C brands on Fynd's
      Order Management System, demonstrating partner-channel distribution.


      The checkout platform served 7,688 merchants with ₹27,382.78 million GMV in
      H1FY26, providing a direct revenue-engagement measure. Shiprocket Quick (launched
      Q3FY25) covered 58 cities and reached 7,070 active merchants and 48,382 unique
      transactions by Q4FY25, confirming early traction for hyperlocal delivery.
    claimRefs:
