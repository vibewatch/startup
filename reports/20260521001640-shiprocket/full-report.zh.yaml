      - number: '1.5'
        title: 里程碑年表、收购与不利事件
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 的历史从 2011 年法律壳注册开始，经历 2017 年品牌 / 产品上线、2022 年一系列收购、FY23–FY24 的痛苦整合期，并在 FY25 恢复至现金 EBITDA
              盈利。收购策略激进：2022 年 2 月至 7 月，公司至少完成四笔交易——Glaucus Supply Chain Solutions（仓储）、Pickrr Technologies（物流聚合，现金加股票交易约
              $200 million，也是公司最大收购）、Omuni（全渠道商业，从 Arvind Internet 以约 Rs 200 crore 收购）和 Wigzo（营销自动化，79% 股权）。这些收购推动 FY23
              收入增长 80% 至 Rs 1,089 crore，但整合成本、ESOP 费用和商誉减值压低业绩，也显著扩大净亏损。FY24 净亏损进一步扩大至 Rs 595 crore。


              DRHP 披露的不利事件很重要，必须跟踪。DRHP 明确披露：一名第三方向包括 Saahil Goel 在内的公司所有者提交 FIR；QNT Sports India Private Limited 于 2024
              年 10 月在 Chief Judicial Magistrate 面前针对 Pickrr 提起诉讼；FY25 对 Omuni 计提 Rs 124.6 crore 减值损失（业绩显著低于商业计划预测）；FY25
              对 Wigzo 计提 Rs 52.1 crore 减值损失。2025 年 7 月，Shiprocket 推出 Shunya AI，并与 Ultrasafe AI 签署 JV 协议。作为 IPO
              准备的一部分，公司于 2025 年 12 月向 SEBI 提交 UDRHP，并于 2025 年 2 月转为 Shiprocket Limited。
