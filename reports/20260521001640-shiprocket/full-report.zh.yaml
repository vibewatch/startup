            body: >-
              Shiprocket 积累了 8+ 年 RTO 数据、NDR 结果、pin-code 配送表现和覆盖 400K+ 商户的承运商可靠性指标，形成直接聚合商同行无法快速复制的分析基线。RADAR 和 Shunya
              AI 系统把历史数据转化为实时承运商分配决策，改善配送可靠性并降低商户 RTO 率——每处理一件新包裹，复合学习优势都会加深。
