      - number: '2.5'
        title: 采用约束与市场风险
        blocks:
          - type: paragraph
            body: >-
              印度电商市场的结构性约束，同时给 Shiprocket 带来平台风险，也阻碍商户采用。最尖锐的是 return-to-origin（RTO）问题：Unicommerce 覆盖 6,000+ 个 D2C
              品牌、410 million 个 FY2026 包裹的数据集显示，RTO 在 2025 年 11 月节庆高峰升至 39.2%，节庆季度 COD 订单退回率达到 58%。采用预付激励、pin-code
              级快递路由和地址验证的品牌，到 2026 年 3 月把 RTO 降至 21%；但多数小商户缺乏执行这些修正的运营能力。RTO 同时拖累商户和平台的收入与利润率。快递网络依赖是第二个结构性风险：Shiprocket
              的 42+ 家快递伙伴降低了单一快递集中度，但偏远地区最后一公里表现仍取决于底层承运商质量。消费者法院投诉和评论平台数据记录了多起未解决配送失败和 COD 结算争议。最后一公里配送本身占总物流支出的
              40–55%；主要履约走廊的房地产成本上升，加上柴油价格波动，挤压运营商利润率。监管方面，印度《Digital Personal Data Protection Act》增加跨境数据流合规负担；ONDC
              的开放协议架构可能让小型物流服务商在统一 API 表面上竞争，长期商品化运输聚合。Business Standard 的报道确认，ONDC
              面临采用摩擦和碎片化买卖双方体验，缓和了近期市场颠覆风险，但维持了对平台抽佣率的长期结构性压力。非一线城市购物者中 70% 偏好货到付款，意味着商户营运资金周期仍被拉长，形成信贷需求；Shiprocket
              的融资产品必须解决这一点，才能维持商户粘性。
            claimRefs:
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 相互矛盾的市场规模估算显示范围不清
            body: >-
              已发布的分析师估算显示，印度电商物流市场 2025 年规模横跨近 3 倍区间（$6.65B 至 $19.54B），差异完全由范围定义驱动，而不是经济判断分歧。Mordor Intelligence
              使用狭义物流定义，IMARC 似乎纳入更宽的履约和增值服务。投资者在把任何单一估算放进估值模型前，应要求做范围调整后的比较。Redseer/DRHP 的 Direct Commerce GMV 测算（$7–9B
              SAM）对 Shiprocket 最相关，因为其方法透明，并经 IPO 披露流程审计。
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM014
          - type: callout
            title: RTO 结构性逆风同时压缩商户和平台经济性
            body: >-
              20–39% 的 RTO 率是市场最尖锐的结构性挑战，不是临时异常。每个未送达订单让商户付出两次成本（正向 + 退回运输）且没有收入，也会减少 Shiprocket 在失败交易上的抽佣收入。COD 主导——节庆季
              COD 订单退回率 58%——使这成为与支付行为绑定的系统性约束，而非快递质量问题。Shiprocket 的 NDR 工具和地址智能能降低 RTO，但价格敏感的 MSME 卖家中更广泛采用仍有限。
            calloutType: risk
            claimRefs:
              - CM032
              - CM033
              - CM034
          - type: callout
            title: ONDC 抽佣率风险在中期，而非眼前
            body: >-
              随着物流 API 互通，ONDC 的开放商业协议可能在 3–5 年周期内压缩平台抽佣率。不过，Business Standard 2025 年 5 月报道显示 ONDC
              存在显著碎片化和采用摩擦，缓和了近期颠覆风险。Shiprocket 当前在赋能 GMV 上约 1–2% 的抽佣率，低于 ONDC 在发现层约 3% 的佣金上限，仍有空间；风险在于 ONDC
              降低了更广义聚合价值主张的地板，而不是直接竞争。
            calloutType: assumption
            claimRefs:
              - CM035
              - CM038
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              印度电商物流市场有不同竞争层，每一层都在价值链的不同位置与 Shiprocket 的主张相交。在直接聚合商层，NimbusPost（Xpressbees 支持，FY25 收入约 Rs 181 crore）和
              ClickPost（企业物流 SaaS，总融资约 $7 million）通过多承运商费率谈判和统一追踪仪表盘，争夺同一批 D2C 商户。Pickrr 和 Shyplite 过去是两个最可信的直接对手，2022
              年被 Shiprocket 以合计约 $200 million 吸收，实际上清空了中等规模聚合商格局。


              在重资产既有玩家层，Delhivery（FY26 收入 Rs 10,508 crore，净利润 Rs 153 crore）和 Shadowfax（FY25 收入 Rs 2,485 crore，净利润 Rs 6.4
              crore，Rs 2,000 crore IPO 待定）并不以聚合商身份直接竞争——它们就是 Shiprocket 路由所经过的承运商——但其直接 SME
              销售动作和直连承运商定价形成替代压力。Xpressbees（FY25 收入 Rs 2,874 crore，净亏损 Rs 370 crore）仍在亏损，并面临 Delhivery CEO 2026 年 5
              月公开提出的生存问题。


              相邻 SaaS 竞争对手包括 Unicommerce（2024 年 8 月起在 NSE/BSE 上市，FY26 收入 Rs 204 crore，PAT Rs 20.5 crore），它作为 OMS/WMS
              平台，经常与 Shiprocket 的 Engage360、Checkout 和履约模块捆绑或竞争。最新进入者威胁是 Amazon Supply Chain Services（ASCS），2026 年 5
              月推出，向任何企业开放 Amazon 的全球货运、仓储、履约和最后一公里网络；对也在 Amazon 销售的商户而言，这是对聚合商的直接替代威胁。


              现状替代方案——与 Blue Dart、DTDC、India Post 或 FedEx 直签合同——对有足够件量并能单独谈判的商户仍可行，通常需要每月超过 10,000 件。大型集团如 Tata、Reliance
              Retail 和 Flipkart 会部署内部自建替代方案（专有物流管理系统），但对构成 Shiprocket 核心可服务市场的 SME 和 D2C 品牌而言，经济性不成立。
            claimRefs:
