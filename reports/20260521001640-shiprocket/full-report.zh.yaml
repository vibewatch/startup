      - number: '7.3'
        title: 伙伴、依赖与竞争风险
        blocks:
          - type: paragraph
            body: >
              快递伙伴集中度是 Shiprocket 结构上最重要的单一风险。在 42 个活跃快递伙伴中，前五大在 FY25 占总发货量 83.33%，H1FY26（截至 2025 年 9 月 30 日止六个月）升至
              85.75%——集中度同比提高。这意味着任何一个前三大伙伴流失、财务承压或重新谈价，都会实质损害 Shiprocket 以当前业务量和价格服务商户的能力。Delhivery（NSE-listed）和
              Xpressbees 同时是 Shiprocket 最大的快递依赖和 3PL 市场最重要的竞争威胁，形成结构性利益冲突：Shiprocket 依赖它们履约，而它们又争夺同一批企业商户。Amazon
              供应链服务部门和 Meesho 自建物流加速大型平台物流 in-housing，直接压缩 Shiprocket 企业分部的可服务市场。Strategy Boffins 和行业分析反复指出，Delhivery
              的第一方基础设施和 Xpressbees 的资本支持，让它们具备 Shiprocket 作为无自有快递车队聚合器难以匹配的价格韧性。云和技术基础设施对 hyperscalers（主要是
              AWS）的依赖，是标准但真实的平台 uptime 集中风险。资本侧，FLDG 贷款伙伴和 NBFC 生态受 RBI Digital Lending Directions 2025 约束，该规定对 lenders
              和 LSPs（Loan Service Providers）施加监管资本和报告义务，可能限制 Shiprocket 信贷产品的供给或经济性。收购组合（Omuni、Wigzo、Rocketbox、Pickrr）在
              FY24 产生 ₹1,246.41 million（Omuni）和 ₹521.01 million（Wigzo）减值，证明整合执行有风险。FY25 商誉账面价值占总资产
              44.62%，取决于这些资产成功整合并实现收入。跨境发货监管变化、关税不确定性，以及按国家建设合规基础设施的需求，又给 ShiprocketX 的国际网络增加一层伙伴依赖。
