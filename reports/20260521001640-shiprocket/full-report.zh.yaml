  - id: FI001
    title: 收入模型桥——从商户活动到营业收入和调整后 EBITDA
    type: flow
    summary: >
      Shiprocket 的收入模型是一个按用量计费的双分部漏斗。商户先给预付钱包充值，再产生货运，系统扣除每票费用（主要变现事件）。核心分部利润为新兴分部投入供血。下方桥图在可得处使用 FY25
      实际数，公开缺失的指标则用估计节点表示。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI006
    data:
      nodes:
        - id: merchant-base
          label: 累计服务 400,000+ 企业；约 145,000 活跃（2025 年 9 月）；8,229 个 Power Merchants（FY25）
          detail: 活跃定义为相关期间 ≥1 笔交易；Power Merchants = 每月 >100 笔唯一交易
          claimRefs:
            - CI003
        - id: wallet-topup
          label: 商户为预付钱包充值；按货运每票扣费
          detail: 模型确保服务交付前先收款；降低 Shiprocket 应收账款风险
          claimRefs:
            - CI001
        - id: core-revenue
          label: 核心分部收入 ₹1,306 crore（FY25；同比 +20%）
          detail: 国内配送 + Shipping Apps 软件工具；占营业总收入 80%
          claimRefs:
            - CI002
        - id: emerging-revenue
          label: 新兴分部收入 ₹326 crore（FY25；同比 +41%）
          detail: ShiprocketX 跨境、Engage360 营销科技、Checkout、Shiprocket Capital、Omuni、Cargo；占总额 20%
          claimRefs:
            - CI004
        - id: total-revenue
          label: 营业总收入 ₹1,632 crore（FY25；同比 +24%）
          detail: 加上 ₹42.8 crore 其他收入（利息 + 杂项）= ₹1,675 crore 总收入
          claimRefs:
            - CI006
        - id: core-ebitda
          label: 核心调整后 EBITDA ₹156.9 crore（核心利润率约 12%）
          detail: 同比改善 2.2x；为新兴分部投入供血；核心自 FY2022 起 EBITDA 为正
          claimRefs:
            - CI015
        - id: consol-cash-ebitda
          label: 合并现金 EBITDA +₹7 crore（FY25）；净亏损 ₹74.4 crore（ESOP ₹91 crore 扭曲 PAT）
          detail: 全年合并现金 EBITDA 首次转正；FY24 现金 EBITDA 为 -₹128 crore
          claimRefs:
            - CI016
            - CI017
      edges:
        - from: merchant-base
          to: wallet-topup
          label: 商户入驻与钱包充值
        - from: wallet-topup
          to: core-revenue
          label: 每票扣费（₹20–45 / 500g）+ Shipping Apps 订阅
        - from: wallet-topup
          to: emerging-revenue
          label: 跨境、营销科技 SaaS、Checkout 费用、Capital 推荐
        - from: core-revenue
          to: total-revenue
          label: 核心（80%）
        - from: emerging-revenue
          to: total-revenue
          label: 新兴（20%）
        - from: total-revenue
          to: core-ebitda
          label: 扣除快递成本（₹1,213 crore CoMS）+ ₹315 crore 员工成本
        - from: core-ebitda
          to: consol-cash-ebitda
          label: 核心利润减新兴业务 EBITDA 亏损；合并净额 ₹7 crore
  - id: FI002
    title: 单位经济桥——每票 P&L 近似
    type: flow
    summary: |
      以一票典型 Shiprocket 国内配送为例，搭建定性单位经济桥。数字输入来自标价和公开成本数据；由于未公开分部毛利率，快递成本和贡献利润率均为近似。所有带近似说明的节点，都应在尽调中向管理层确认。
    claimRefs:
      - CI008
      - CI009
      - CI014
      - CI018
    approximationNotes: >
      每票收入按公开套餐价格估计（国内 ₹20–45/500g）。基于 ₹1,213 crore CoMS / ₹1,632 crore 收入比率，快递成本转嫁估计为 ASP 的 65–70%。贡献利润率构成来自 DRHP 定义，但
      FY25 未披露绝对值。所有数字均为近似；没有任何数字获得管理层按每票口径确认。
    data:
      nodes:
        - id: list-price
          label: 标价每票收入：₹20–45 / 500g（随套餐层级变化）
          detail: Pro 套餐基准 ₹20/500g；Lite 套餐 ₹29/500g；实际实现 ASP 未披露
          claimRefs:
            - CI008
        - id: promo-cashback
          label: 减：促销返现和激励
          detail: DRHP 将其作为扣减项纳入贡献利润率定义；金额未披露
          claimRefs:
            - CI009
        - id: courier-cost
          label: 减：快递合作伙伴成本（转嫁约为收入估计的 65–70%）
          detail: ₹1,213 crore CoMS 与 ₹1,632 crore 收入对比，意味着混合比例约 74%；核心利润率可能更好
          claimRefs:
            - CI014
        - id: contribution-margin
          label: 贡献利润率：未披露（估计核心为正；新兴部分业务为负）
          detail: DRHP 将 CM 定义为收入减 CoMS、通信、支付网关、促销、营销、FC 成本、仓库薪资
          claimRefs:
            - CI018
        - id: opex-overhead
          label: 减：G&A、技术、D&A 间接费用分摊（约占收入 13%）
          detail: 员工成本 ₹315 crore + IT ₹45 crore + 广告 ₹21 crore + 其他约 ₹221 crore，总间接费用
          claimRefs:
            - CI015
        - id: ebitda-per-ship
          label: 现金 EBITDA：约 ₹0.04/票（合并口径，由 ₹7 crore 总额相较约 220K 日均货运推算）
          detail: 合并利润率极薄；核心明显更好；新兴业务拖累压低混合水平
          claimRefs:
            - CI016
      edges:
        - from: list-price
          to: promo-cashback
          label: 实现净计费
        - from: promo-cashback
          to: courier-cost
          label: 返现调整后
        - from: courier-cost
          to: contribution-margin
          label: 物流毛利
        - from: contribution-margin
          to: opex-overhead
          label: 直接成本后
        - from: opex-overhead
          to: ebitda-per-ship
          label: 经营利润贡献
