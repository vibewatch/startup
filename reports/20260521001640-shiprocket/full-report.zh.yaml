  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 私募估值背景、入场纪律与 IPO 结构
        blocks:
          - type: paragraph
            body: >
              Shiprocket 最近一次公开披露的私募估值标记为 $1.21 billion，来自 2024 年 12 月 Series E-III 延展轮；该轮从 Koch Strategic
              Platforms、MUFG Innovation Partners、KDT Ventures（领投，₹124.5 crore）、Tribe Capital 和 Huddle Ventures 募得 ₹219
              crore（$26 million）。 SEBI CCPS 配售文件确认本轮价格为每股 ₹43,394，Fintrackr/Entrackr 据此估算，配售后估值约为 $1.21 billion。
              一个独立聚合平台 Affluense.ai 对同一轮给出约 $1.1 billion 的较低数字，使私募标记存在 $110 million 的不确定区间。 公司峰值估值约为 2022 年 8 月 Series
              E（TCV 领投，$33.5 million）时的 $1.3 billion，说明 2024 年 12 月这一轮相较峰值基本持平或小幅下调，而非上调；这对后期入场纪律是一个重要信号。 九轮累计融资总额超过
              $320 million。

              SEBI 批准的 IPO 计划募资总额为 ₹2,342.35 crore：新股发行 ₹1,100 crore，现有股东（Koch、MUFG、TCV、Tribe 等）OFS ₹1,242.35 crore。 OFS
              规模高于新股发行，意味着上市时内部人变现诉求明显。 若在价格区间确定前执行，最高 ₹220 crore 的 pre-IPO 配售可相应减少新股发行规模。 截至 2026 年 5
              月，公司尚未公布价格区间；市场共识指向隐含市值 ₹10,000–14,000 crore，并在 H1 FY27 上市。 新股募资用途分配为：₹294 crore 用于营销 / 商户获取，₹211 crore
              用于技术，₹211 crore 用于偿债，余额用于收购和一般公司用途。 收入增速从 FY25 的 24% 放缓至 H1 FY26 的 15%，削弱了入场倍数近期的现金流支撑；这种放缓是周期性还是结构性，是本次
              IPO 承销判断的关键问题。
