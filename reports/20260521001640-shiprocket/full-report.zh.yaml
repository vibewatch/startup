            body: >
              终端消费者复购率在每个已衡量期间都上升——从 FY2023 的 42.37% 升至 H1FY26 的 64.56%，没有一次回落。绝对数看，H1FY26 的 42.27 million 消费者中有 27.29
              million 是复购买家。结合商户 cohort 交易倍数（FY2018 cohort 到第 7 年为 20.93x），这表明 Shiprocket-enabled merchants
              的增长快于平台自身活跃商户数所暗示的水平，既有 cohorts 正在实质扩张。
            calloutType: strength
