      - number: '8.2'
        title: 可比估值分析——上市公司、私募轮次与全球基准
        blocks:
          - type: paragraph
            body: >
              可比样本分三层：印度公开市场物流科技公司（Delhivery）、印度公开市场电商 SaaS 公司（Unicommerce），以及全球私营 / 公开 SaaS 中位数。 每个可比对象与 Shiprocket
              的物流-SaaS 混合模型都有实质结构差异，因此应采用混合倍数，而不是锚定单一同业。

              Delhivery（NSE: DELHIVERY）按业务分部看是最直接的上市可比公司（印度电商物流、API 驱动）。 截至 2026 年 5 月，Delhivery 市值 ₹34,200 crore，FY25
              收入 ₹8,932 crore，对应 EV/FY25 Sales 3.21x。 FY25 EBITDA 为 ₹376 crore，意味着 EBITDA 利润率 4.2%、EV/EBITDA 52x；公司 FY25
              首次实现合并 PAT 转正，达到 ₹162 crore。 Delhivery 收入规模约为 Shiprocket 的 5 倍，且业务模型是纯物流（没有商户 SaaS），相较 SaaS
              权重更高的可比对象，其可实现倍数在结构上受限。 Shiprocket $1.21 billion 的私募标记相当于 FY25 收入 6.2x，较 Delhivery 的 3.21x 溢价 93%，要求市场把
              SaaS 层定价为显著高于物流经济性的溢价。

              Unicommerce（NSE: UNIECOM）提供 SaaS 层倍数参考。Unicommerce 市值 ₹958 crore，对应 EV/Revenue 4.45x、EV/EBITDA 25.7x，FY26
              收入 ₹204 crore，EBITDA 利润率 16.3%。 Unicommerce 股价在 2026 年 5 月前 12 个月下跌约 38%，显示印度 SaaS 倍数在收缩，而非扩张。 Unicommerce
              4.45x 与 Shiprocket 6.2x 之间的差距，意味着市场必须用 39% 的溢价定价 Shiprocket 更大的规模、更高的增长率和更好的留存指标——或者把物流量视为增量收入质量。

              Nykaa（NSE: NYKAA）作为消费科技 D2C 赋能平台，交易约为 EV/Revenue 8x，为印度消费科技重估提供上限。 Zomato 和其他印度新一代科技平台的 EV/Revenue 在
              7–10x。Shiprocket 的 6.2x 落在这一印度溢价区间的下半部；如果增长重新加速，该估值具备支撑。

              2025 年全球私营 SaaS EV/Revenue 中位数约为 4.8x，公开 SaaS 中位数约为 6x，构成软件可比区间的下限和上限。 Shiprocket 6.2x 尽管仍是私营公司，却与全球公开
              SaaS 中位数基本一致，反映了印度 IPO 溢价预期；但除非 NRR 超过 110%、新兴业务实现盈利，单靠 SaaS 重估带来的上行空间有限。
