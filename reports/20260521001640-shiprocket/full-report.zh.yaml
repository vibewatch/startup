      - number: '8.4'
        title: IPO 退出准备度、尽调问题与投资逻辑破裂触发项
        blocks:
          - type: paragraph
            body: >
              Shiprocket 的 IPO 路径在程序上已经清晰：SEBI 于 2025 年 10 月 31 日批准，更新版 Draft Red Herring Prospectus 于 2025 年 12 月 12
              日提交。 公司目标是簿记建档发行，截至 2026 年 5 月尚未公布价格区间。 IPO 机制为 100% 簿记建档；若最高 ₹220 crore 的 pre-IPO 配售被执行，将减少新股发行规模。 募资中
              ₹294 crore 被指定用于营销和商户获取，是单项最大用途，也是最需要尽调的资金分配，因为公司尚未公开 CAC 或回本指标，无法评估 ROI。 ₹211 crore 偿债将减少截至 2025 年 9 月的
              ₹233.8 crore 未偿借款，改善杠杆，但不会改变现金生成能力。

              当前最关键的未决尽调问题包括：（1）核心业务与新兴子业务的分部毛利率——没有它就无法建模结构性盈利路径；（2）扣除返现后的每单实际 ASP，把标价与报告收入接起来；（3）按渠道拆分的 CAC 和回本周期，验证
              ₹294 crore 营销分配；（4）Shiprocket Capital 在 ₹200 million 上限下的 FLDG 使用情况；（5）FY25 减值后剩余收购商誉账面价值。 缺少这五组数据，FY25 收入
              6.2x 的倍数就无法用自下而上的单位经济模型验证。

              投资逻辑破裂触发项：NRR 连续两个期间跌破 100%，意味着商户净流失并抹去 SaaS 溢价；Power ARPU 到 FY26E 未能达到 ₹0.95+ crore，将确认收入集中度弱点；价格区间隐含 IPO
              市值低于 ₹8,000 crore，则相对上一轮为负回报；Delhivery SME 商户超过 200,000，将构成结构性市场份额威胁；新增收购减值超过 ₹100 crore，将确认资本配置风险。
