          label: 风险：NRR 低于 FY23 峰值；高价值商户 ARPU 下降 39%；₹176.7 crore 收购减值；OFS 压力
          detail: 收入增速从 FY25 的 24% 放缓至 H1 FY26 的 15%；新兴业务 EBITDA 未披露
          claimRefs:
            - CV021
            - CV027
            - CV046
        - id: valuation
          label: 估值：$1.21B / FY25 收入 6.2x——较 Delhivery 溢价 93%；约与公开 SaaS 中位数（6x）一致
          detail: 偏高立场；只有在 SaaS 重估 + NRR >105% + 新兴业务盈亏平衡时才说得通
          claimRefs:
            - CV028
            - CV038
            - CV039
        - id: ipo
          label: IPO：SEBI 已批准；2025 年 12 月提交 UDRHP；预计 H1 FY27 上市；明确流动性事件
          detail: 总规模 ₹2,342 crore；₹1,242 crore OFS 意味着内部人在上市时套现
          claimRefs:
            - CV005
            - CV009
        - id: recommendation
          label: 推荐：观察——IPO 上市是风险调整后入口；私募标记 6.2x 偏高
          detail: 风险：高；立场：偏高；基准情景回报为 IPO 周期内 2–3x
          claimRefs:
            - CV043
      edges:
        - from: scale
          to: recommendation
          label: 支撑
        - from: proof
          to: recommendation
          label: 支撑
        - from: risks
          to: recommendation
          label: 约束
        - from: valuation
          to: recommendation
          label: 构成条件
