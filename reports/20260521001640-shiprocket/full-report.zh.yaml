      - number: '5.2'
        title: 平台架构与技术基础设施
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 的技术栈建立在 cloud-native
              微服务架构上，由容器编排，并通过第三方云基础设施提供服务。订单管理、快递分配、追踪、履约路由、结账和分析等每项业务能力都作为独立微服务运行，从而支持故障隔离、独立扩缩容和持续部署，不必让整个平台停机。Apache
              Kafka 事件主干每天处理 400 million 个事件，让微服务之间实现异步、实时通信。事件驱动设计允许 upserts（幂等写入）在故障期间事件重放时仍保持数据库状态一致。

              数据库层依赖 MySQL，并采用混合分片策略。垂直分片把订单表拆成 hot orders table（高频访问）和单独数据库中的 orders_meta table（低频访问），以降低
              I/O。水平分片按年份组织数据，只把过去 12 个月保留在活跃数据库中，较旧查询则通过 Elasticsearch 索引元数据路由到按年份划分的归档库。平台还使用 Debezium 做 CDC 日志流（450
              GB/天），并拥有 30+ DB instances。截至 2025 年 9 月，平台运行 7,604 vCPUs 和 27.35 TB 内存，较 2024 年 9 月分别同比增长 99.7%/128%。API
              流量从 2024 年每月 6.31 billion 次请求增至 2025 年 12.22 billion 次。DRHP 披露基础设施具备 ISO 认证。平台运行在第三方云上，形成对云服务商 SLA
              的依赖，Shiprocket 无法直接控制。
