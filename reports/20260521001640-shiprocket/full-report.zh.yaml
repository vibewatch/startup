  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现模式
        blocks:
          - type: paragraph
            body: >
              Shiprocket 的收入全部来自平台上的商户活动，并按两个披露分部组织。Core Business（国内发货平台加 Shipping Apps 等增值软件工具）FY25 贡献 ₹1,306
              crore，同比增长 20%；自 FY2022 起就是公司的现金引擎。Emerging Business 包括 ShiprocketX（跨境发货）、Shiprocket Cargo（B2B
              大宗货运）、Shiprocket Capital（贷款服务）、Engage360（以 WhatsApp 为核心的营销技术）、Checkout（一键结账）和 Omuni（全渠道零售），FY25 贡献 ₹326
              crore，同比增长 41%，收入占比从两年前的 11% 升至当前
              20%。国内发货的主要变现机制是按用量计费的预付钱包：商户先给钱包充值，每笔订单再扣除单票费用。因此，收入直接绑定发货量、组合（重量、区域、套餐层级）和活跃商户数。公司没有披露套用于 Gross
              Merchandise Value 的 headline take-rate 百分比；DRHP 将 take rate 定义为“电商赋能平台从 enabled GMV 中转化为收入的百分比”，并把它作为
              KPI，但 FY25 的绝对 take-rate 数值未见公开材料。FY25 其他收入 ₹42.8 crore（主要是现金余额利息和杂项收益）单独披露，不计入经营收入。Shiprocket Capital
              目前采用“direct selling agent”模式，并试点 first-loss default guarantee（FLDG）：公司自身赚取转介 / 服务费，并承担上限 ₹200 million 的
              FLDG 敞口，而不是贷款本金。核心分部的经常性收入质量由 FY25 103.51% NRR 支撑，意味着既有 cohort 的净支出扩张快于流失成本。
