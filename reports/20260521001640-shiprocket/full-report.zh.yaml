      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              定价上，Shiprocket 的分层订阅模式（Lite 免费 / Business Rs 699/月 / Advanced Rs 1,499/月 / Pro Rs
              2,499/月）把平台访问与承运商费率折扣打包。国内运输费率对高件量发件人约从 Rs 20-22/500g 起；NimbusPost
              可比起步价类似，但商户反馈有效全包成本更低，因为隐藏重量争议收费更少。ClickPost 在谈判后的承运商费率之上收取企业 SaaS 费用，小件量时明显贵于两个聚合商，但规模化后透明度更高。与 Blue Dart
              或 FedEx 直签承运商合同需要最低件量承诺（通常每月 3,000-5,000+ 件），实际上排除了占 Shiprocket 商户基础很大一部分的微型卖家。


              核心能力上，Shiprocket 在直接聚合商同行中领先：总承运商数量（42+，对 NimbusPost 的 25+）、地理覆盖（印度国内 19,000+ 个 pin code，并通过 ShiprocketX
              覆盖 220+ 个国家）以及多渠道 OMS 集成深度。ClickPost 在企业分析、承运商 SLA 可见性和全球承运商广度（350+）上领先。NimbusPost 在自述 COD
              回款速度上领先，也更受重视成本效率而非功能广度的商户偏好。


              GTM 模式上，Shiprocket 的免费增值入口（Lite 计划）叠加逐步升级套餐，形成了 NimbusPost 和 ClickPost 难以在规模上匹配的大获客漏斗。ClickPost
              aggregators benchmark（2026）把 Shiprocket 评为“最适合高件量 D2C 和 marketplace 卖家”，G2 评分 4.0/5；而较小竞争对手 ShipKaro
              在同一平台得分 4.5/5——负面商户评论将这一差距归因于 Shiprocket 在放量后的支持质量下降。Shiprocket 的品牌化购买后体验（RADAR、Sense、NDR 仪表盘）和 AI 驱动 RTO
              降低（公司披露改善 15-25%）将其与纯费率聚合商区分开，但也让商户依赖 Shiprocket 的专有数据模型。


              Delhivery 的直接 SME 销售动作——绕过聚合商直接向商户销售快递运力——在高件量卖家群体（通常每月超过 10,000 件）上与 Shiprocket 竞争。Shadowfax 对快速商业的专注（H1
              FY26 同比增长 90%）形成了 Shiprocket 正试图通过 Quick 产品（同日 / 快速商业，2024 年 9 月推出）补上的能力缺口。
