      - number: '7.2'
        title: 运营与网络安全风险
        blocks:
          - type: paragraph
            body: >
              IPO 前，Shiprocket 的平台可靠性和数据安全是重大关切。2025 年 9 月，网络安全研究公司 Brinztech 发布警报称，有威胁行为者在 darknet forums 声称出售
              Shiprocket 数据库，内容包括客户 personally identifiable information（PII）和平台漏洞细节。Shiprocket 未公开确认或否认该泄露，公司也没有向
              CERT-In 或同等机构提交可公开获取的事件报告。缺少独立取证确认时，该说法的范围和真实性仍未验证，但鉴于印度即将进入 DPDPA（Digital Personal Data Protection
              Act）执行环境，它对 IPO 投资人构成重大风险披露项。持续的商户投诉证明运营质量风险：虚假派送尝试（快递员把订单标记为“out for delivery”或“delivery
              attempted”但实际未尝试）、未经授权的重量差异扣款、COD 回款延迟和客服无响应。Trustpilot 1.6/5 “Bad”评分、Capterra
              评论集中提到定价争议和支持失败、PissedConsumer 1,400+ 条评论，以及 ConsumerComplaints.in
              案例，都相互印证了系统性的最后一公里执行和账单完整性问题。这不是孤立事件——该模式横跨多个独立平台持续存在。Quick commerce（10 分钟和 30 分钟配送）正在结构性冲击 D2C
              marketplace：Shiprocket 在 58 个城市推出 “Quick”，H1FY26 获得 7,070 个商户注册，但 Zomato、Swiggy 和 Blinkit
              正在夯实聚合物流网络，可能直接服务 D2C 品牌，降低其对 Shiprocket 聚合层的依赖。ONDC marketplace
              同样未达到最初预计的商户激活规模，减少了一个原本预期的需求渠道。跨境业务面对上升的海关复杂度：S&P Global 和 Seatrade Maritime 都把 2026 年贸易和航运监管变化列为最高层级风险，给
              Shiprocket 的 ShiprocketX 分部带来合规开销。综合看，交付质量、网络安全、竞争替代和跨境合规这些运营风险，都要求在 DRHP 披露之外做运营尽调，之后才能做任何投资承诺。
