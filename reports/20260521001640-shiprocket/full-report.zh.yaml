  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 处在三个支出池的交汇处：在线商业（品牌自有网站和 marketplace 辅助渠道）、线下 / 社交商业（数字化赋能的同城和 WhatsApp 驱动销售）以及跨境商品出口。根据为 SEBI
              UDRHP 委托 Redseer 完成的分析，CY 2024 这些领域合计为新一代端到端横向电商赋能平台带来 ₹7.7–8.4 trillion（$92–101 billion）的 GMV
              机会。在这个大盘中，Direct Commerce（商户通过自有网站销售、无需中介佣金）产生 $7–9 billion GMV，占在线零售 10–13%；跨境商品零售贡献约 $60 billion
              GMV；数字化社交商业贡献 $1.4–2.2 billion。通过平台物流服务的线下店内订单再增加 $20–24 billion。印度更广义电商市场 2024 年为 $125 billion，预计 2030 年以
              18.4% CAGR 增至 $345 billion。Shiprocket 主要可服务支出不包括纯 marketplace 交易费（Amazon/Flipkart
              抽佣率）、生鲜快速商业基础设施（Blinkit/Zepto 暗仓）以及 B2B 工业采购。现状替代方案包括单一快递直签合同、大型零售商自有物流部门，以及基于电子表格的 COD 对账——Shiprocket
              的多快递聚合和技术栈直接替代这些方法。
