        - 管道失败可能造成分析滞后
      - - 内存缓存
        - 970M reads/writes/month；为实时运营提供快速查询
        - 内存数据存储（隐含 Redis / Memcached）
        - 缓存失效一致性
        - 写路径事件延迟会造成缓存漂移
      - - 计算基础设施
        - 7,604 vCPU、27.35 TB RAM（2025 年 9 月）；自动扩展到峰值
        - 第三方云（DRHP 称 cloud-agnostic）
        - 云服务商合同与可用性
