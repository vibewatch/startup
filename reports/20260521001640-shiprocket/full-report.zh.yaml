      - number: '2.3'
        title: 买家与商户分层
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 的商户宇宙分为两个监管层级：MSME（年收入低于 ₹2,500 million 的企业）和 Large Retailers（高于 ₹2,500 million）。在印度约 60
              million 家 MSME 中，平台服务 D2C 品牌创始人、marketplace 卖家、社交电商微型创业者和跨境出口商。Shiprocket 自身卖家基础的买家行为数据显示，71%
              订单来自非一线城市印度，Personal Care（27%）、Apparel & Footwear（20%）和 Electronics（9%）是前三大品类；84%
              购买发生在周末，反映消费行为与可支配时间一致。女性主导的 MSME 占注册企业 20.5%，贡献 19% 就业，是服务不足但快速数字化的细分。这个宇宙里的 D2C 品牌追求完整掌控客户关系，用
              Shiprocket 做结账优化、多快递运输和购买后营销；它们是预算拥有者和付款方。Marketplace 卖家主要需要运输聚合和 COD 结算，往往没有专职物流团队。大型零售商在 ERP
              层面集成，并谈判基于量的 SLA。ONDC 进入生态后，通过开放协议纳入 700,000+ 卖家，把总可服务卖家基础做大；该协议收取约 3% 佣金，而既有 marketplace 通常为
              15–25%，由此形成一批已被赋能但价格敏感的新买家。
