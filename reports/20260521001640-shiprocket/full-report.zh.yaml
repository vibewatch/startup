      - number: '6.2'
        title: 具名客户证明与案例研究证据
        blocks:
          - type: paragraph
            body: >
              Shiprocket 的 SEBI UDRHP 披露六个具名案例研究，并量化结果。Studd Muffyn（健康 / 生活方式 D2C，2021 年 1 月入驻）使用 Domestic Shipping、RTO
              Suit、Brand Boost 和 Checkout，FY2023 至 FY2025 收入增长 29 倍。Ghar Soaps（护肤 D2C，2020 年起）部署发货、履约和结账产品，同期收入增长 15
              倍。Winston Electronics（男士护理 D2C，FY2021）使用发货、Checkout、RTO Suit 和 Instant COD，收入增长 4 倍。Giva（珠宝
              D2C）利用国内发货、跨境贸易、Secure 和 Fulfilment，收入互动提升 3 倍。Blackberrys（男装，FY2023）使用结账集成，转化率提升 27%，预付订单增长
              18%。Bata（全球鞋履）通过 Shiprocket Omuni 管理 1,500 家零售门店，实现线上 / 线下统一订单履约。


              所有 DRHP 案例研究都附有明确 caveat：收入改善“并不一定意味着我们的平台是促成这些增长的唯一因素”。这是有意义的限制——没有任何结果指标经过独立审计，样本也由 Shiprocket
              策划。官方客户页显示，MTR（Orkla India）已通过 Shiprocket 发出线上订单五年，称其服务可靠、无摩擦。Lili Origin（香水 D2C，500,000+ customers）与
              Shiprocket 合作一年半，在需求高峰和升级投诉中管理物流。2025 年 6 月的 Fynd partnership 让 Shiprocket 的物流智能——快递选择、价格比较和订单追踪——在 Fynd 的
              Order Management System 上为超过 300 个活跃 D2C 品牌上线，展示了伙伴渠道分发能力。


              结账平台在 H1FY26 服务 7,688 个商户，处理 ₹27,382.78 million GMV，提供直接的收入互动指标。Shiprocket Quick（Q3FY25 推出）覆盖 58 个城市，到
              Q4FY25 达到 7,070 个活跃商户和 48,382 笔唯一交易，确认同城配送早期 traction。
