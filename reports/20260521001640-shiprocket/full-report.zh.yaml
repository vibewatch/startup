  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与平台触达
        blocks:
          - type: paragraph
            body: >
              Shiprocket 将其商户宇宙定义为 MSMEs（年收入低于 ₹2,500 million 的企业）和 Large Retailers（年收入高于 ₹2,500 million）。截至 2025 年 9 月
              30 日止六个月（H1FY26），平台有 145,269 个 Active Merchants，即期内至少完成一笔交易的商户。公司营销材料提到“4 lakh+ businesses
              scaled”，但这是累计历史口径，不得与 SEBI 文件中的 H1FY26 145,269 个活跃商户或 FY2025 165,231
              个活跃商户混同。营销口径高于活跃商户数，因为它包含所有曾在平台交易过的商户，包括后来流失或活动减少者。


              Power Merchants 指每个活跃月平均超过 100 笔唯一交易的商户，H1FY26 有 8,596 个（占活跃基础 5.92%），六个月 per-merchant ARPU 为 ₹0.94
              million，意味着它们虽然只占商户数的一小部分，却共同驱动了估计中的高多数平台收入。非 power majority（136,673 个商户）贡献长尾业务量，ARPU 明显更低。ShiprocketX
              服务的跨境商户 H1FY26 有 4,555 个，合计 GMV 为 ₹3,115.8 million，仍是一个小但快速增长的分部（占活跃商户 3.1%）。Fulfillment 客户（使用 Shiprocket
              的仓库和 3PL 网络）是另一子分部；公司声称履约业务服务 1,000+ ecommerce businesses，但 DRHP 未单独披露精确活跃数量。Tier 2 和 Tier 3
              城市卖家是明确战略目标，服务方式包括地域定向数字营销、区域 FM 电台广告，以及计划中的新区域办公室。
