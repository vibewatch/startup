      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              四股结构性力量支撑印度电商赋能市场到 2031 年的轨迹。第一，地理扩张：tier-2 和 tier-3 城市贡献 FY2026 新 D2C 订单的 66%；tier-3 城市在 2025 年夏季订单量中占
              38%，同比增长 21%，说明印度电商下一波增长在非大都会地区。这扩大了 Shiprocket 的卖家基础，因为小城市创业者希望获得可负担的多快递触达，而不是自建物流团队。第二，D2C 品牌扩散：印度 D2C
              市场 FY2026 GMV 增长 33%、订单量增长 34%；若规模化采用，AI 驱动履约预计可降低物流成本 18–25%。第三，ONDC 民主化：开放商业协议降低平台依赖，让 MSME
              触达全国买家，并创造运输聚合商可捕获的物流需求，无需绑定 marketplace 独家。第四，跨境增长：印度 $60 billion 的跨境商品零售 GMV 机会以 14–20% CAGR
              增长，叠加政府举措（DDP shipping、duty drawback），为 ShiprocketX 创造新收入池。支撑这些驱动因素的是，印度互联网订阅用户在 2025 年 12 月突破 1.028
              billion，UPI 在 2026 年 1 月处理 20.39 billion 笔交易，快速商业以 70–80% CAGR 扩张并在 FY25 达到 $7–8 billion——这些都抬高了流经
              Shiprocket 平台的数字商业活动基线。
