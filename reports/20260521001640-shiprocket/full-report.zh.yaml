  - id: FE001
    title: Shiprocket 产品架构栈
    type: stack
    layout: wide
    summary: 从面向商户的工具到底层基础设施的全栈产品架构，展示四个平台层级。
    data:
      layers:
        - label: 商户获取与增长层
          detail: AI 驱动工具帮助 MSME 获客、获取信贷并生成市场情报——Shunya AI、Engage360、Trends 和 Capital。
          items:
            - Shunya AI（多模态 MSME AI）
            - Engage360（WhatsApp AI 营销）
            - Shiprocket Trends（市场情报）
            - Shiprocket Capital（NBFC 信贷匹配）
        - label: 商业转化层
          detail: Checkout 优化、地址智能和 EDD 展示，用来转化购物者并降低 RTO——对应 Checkout、Sense 和 Promise 产品。
          items:
            - Shiprocket Checkout（一键结账、COD→预付、RTO 过滤）
            - Shiprocket Sense（地址增强、自动填充 API）
            - Shiprocket Promise（EDD 徽章）
        - label: 物流与履约层
          detail: 围绕 42 家快递、35 个 FC 和 19K+ PIN 码区域做端到端发货编排，跨境由 ShiprocketX 覆盖，同城由 Quick 覆盖。
          items:
            - 国内发货（42 家快递、19K+ PIN 码区域、NDR、重量管理）
            - Shiprocket Fulfillment（35 个 FC、12+ 渠道、B2B+D2C）
            - Shiprocket Cargo（国内 B2B PTL/FTL）
            - Shiprocket Quick（同城聚合器，2024 年 9 月）
            - ShiprocketX + CargoX + LaunchX（跨境，135 个国家）
