          - type: callout
            title: Amazon ASCS 是结构性替代威胁
            body: >-
              Amazon Supply Chain Services（2026 年 5 月推出）向所有企业开放 Amazon 全球物流网络。对同时也是 Amazon marketplace 卖家的 Shiprocket
              商户——Shiprocket 400K+ 基础中占比很大——Amazon 可以在没有中介聚合商的情况下履行其完整物流工作流。Delhivery 股价在公告日下跌 4%，说明市场把这视为对中介物流模式的结构性冲击。
            calloutType: risk
