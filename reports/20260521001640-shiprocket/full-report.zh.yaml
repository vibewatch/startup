      - number: '4.5'
        title: 财务结论：收入质量、利润率路径与尽调阻碍
        blocks:
          - type: paragraph
            body: >
              Shiprocket 的财务叙事已明显改善：两年收入 CAGR 24%，亏损减少 87.5%，合并层面首次实现现金 EBITDA 转正，核心分部产生真实现金利润。DRHP 和 UDRHP
              文件给出的公开财务披露多于多数印度 pre-IPO 物流初创公司，足以做有意义的第一轮承销判断。核心分部收入质量不错——按用量计费、经常性，FY25 NRR 超过
              100%。但四个负面信号压低信心。第一，Power Merchant ARPU 在 FY25 同比压缩 39%（₹1.44 crore 降至 ₹0.88 crore），可能反映费率让利或 Pickrr
              整合带来的组合迁移；H1 FY26 虽部分恢复至 ₹0.94 crore，但仍未回到 FY24 峰值。第二，收购整合已经毁损资本：FY25 确认的 ₹124.6 crore Omuni 减值和 ₹52.1
              crore Swiftly/Wigzo 减值均作为 exceptional items，证明非有机增长尚未增量转化为 EBITDA。第三，收入增速从 FY25 的 24% 降至 H1 FY26 的
              15%，引出一个问题：基础增速是否正在向物流行业常态收敛。第四，新兴分部仍处于 EBITDA 亏损；₹157 crore 的核心 EBITDA 实际上在补贴跨境、营销技术和全渠道领域超过 ₹150 crore
              的投资，而这些业务尚未赚回资本成本。承销仍缺少以下财务输入：按分部划分的毛利率、实际 Contribution Margin 数值、实际定价相对标价、按渠道划分的
              CAC、回收期、客户集中度拆分、自由现金流、仓库租赁计划表，以及详细 FLDG 使用情况。尽调应先补回这些指标，再做任何 primary investment 决策。
