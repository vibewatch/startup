  - id: FV002
    title: 估值敏感性
    type: bar
    summary: |
      可比公司 EV/Revenue 倍数与 Shiprocket 当前私募标记，展示 Shiprocket 相对公开同行和全球基准的溢价。
    claimRefs:
      - CV028
      - CV032
      - CV035
      - CV036
      - CV038
    data:
      items:
        - label: Delhivery（NSE，FY25）
          value: 3.21
          note: 印度公开物流科技公司；市值 ₹34,200 crore
        - label: 全球私营 SaaS 中位数（2025）
          value: 4.8
          note: Ful.io 2025 分析；美国 / 欧洲加权
        - label: Unicommerce（NSE，FY26）
          value: 4.45
          note: 印度公开电商 SaaS；市值 ₹958 crore
        - label: Shiprocket @ $1.21B / FY25 收入
          value: 6.17
          note: 2024 年 12 月私募标记；FY25 收入 ₹1,632 crore；汇率 83 INR/USD
        - label: 公开 SaaS 中位数（2025）
          value: 6
          note: 全球公开 SaaS 中位数；参考上限
        - label: Nykaa EV/Revenue（估计）
          value: 8
          note: 印度消费科技上限；根据公开市场数据估算
    approximationNotes: >
      Nykaa 倍数根据截至 2026 年 5 月的公开市场数据估算。Shiprocket 价值采用 Fintrackr/Entrackr 的 $1.21B 估算，汇率 83 INR/USD。所有公开倍数截至 2026 年 5
      月，来自 StockAnalysis.com 和 Multiples.vc。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: |
      IPO 上市时（H1 FY27 目标）乐观、基准和悲观情景隐含市值区间，并列明 FY27 收入和适用 EV/Revenue 倍数假设。
    claimRefs:
      - CV040
      - CV041
      - CV042
    data:
      items:
        - label: 悲观情景——倍数压缩至 3x（物流重估，收入放缓）
          low: 5000
          high: 6500
          note: FY27E 收入 ₹1,900 crore，EV/Revenue 3.0x；假设 NRR < 100% 且收入增长 < 15%
        - label: 基准情景——FY27E 收入 5x，部分 SaaS 溢价
          low: 9500
          high: 12000
          note: FY27E 收入 ₹2,200 crore，EV/Revenue 5.0x；NRR 103–106%；收入增长 18–20%
        - label: 乐观情景——SaaS 重估下 FY27E 收入 6.5x（NRR >110%，新兴业务盈亏平衡）
          low: 14000
          high: 17000
          note: FY27E 收入 ₹2,500 crore，EV/Revenue 6.5x；假设 NRR 重新加速且新兴业务 EBITDA 转正
    approximationNotes: |
      所有数值单位为 ₹ crore。区间代表指示性市值（非 EV）估算。收入预测是分析师基于公开 FY25 和 H1 FY26 实际数据作出的估算，没有公司指引。倍数假设来自可比公司组分析。
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: |
      面向投委会的七项投资维度评分：市场机会、业务验证、竞争护城河、单位经济、风险画像、估值和证据质量。
    claimRefs:
      - CV019
      - CV020
      - CV025
      - CV028
      - CV038
      - CV043
      - CV044
      - CV045
      - CV047
    data:
      items:
        - label: 市场机会
          value: ★★★★☆ (4/5)
          note: 印度电商物流；$3B+ GMV；电商渗透率 4.5–5%；庞大且具长期增长顺风
        - label: 业务验证
          value: ★★★☆☆ (3/5)
          note: FY25 现金 EBITDA 转正；NRR 修复；核心 EBITDA 12%；新兴业务 EBITDA 未披露
        - label: 竞争护城河
          value: ★★★☆☆ (3/5)
          note: 4L+ 商户；API 平台；队列复利；Delhivery 扩大商户侧重点，护城河受到挑战
        - label: 单位经济
          value: ★★★☆☆ (3/5)
          note: 核心 EBITDA ₹157 crore（12%）；新兴业务 EBITDA 为负；高价值商户 ARPU 被压缩但在修复；分部利润率存在缺口
        - label: 风险画像
          value: ★★☆☆☆ (2/5)
          note: 收购减值 ₹176.7 crore；NRR 低于 FY23 峰值；OFS 信号；收入放缓；FLDG 或有敞口
        - label: 估值吸引力评分
          value: ★★☆☆☆ (2/5)
          note: FY25 收入 $1.21B，对应 6.2x；相比 Delhivery（3.21x）偏高；IPO 倍数要靠 SaaS 重估叙事撑住
        - label: 证据质量
          value: ★★★★☆ (4/5)
          note: UDRHP + 独立新闻来源；主要缺口：分部毛利率、CAC / 回本周期、FLDG 使用率
