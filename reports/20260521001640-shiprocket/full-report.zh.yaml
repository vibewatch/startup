      - number: '7.5'
        title: 人员、执行风险与终止标准
        blocks:
          - type: paragraph
            body: >
              Shiprocket 最主要的人员风险，集中在 CEO 兼联合创始人 Saahil Goel 身上。Goel 被第三方提交的刑事 FIR 点名，他已申请撤销该案。
              一旦程序出现不利结果——撤销申请失败并导致起诉书、逮捕或任职资格取消——就会构成立即的重大不利事件，几乎必然中止 IPO 进程，并触发投资者赎回条款。 诉讼风险之外，Goel
              在战略、投资者关系和企业文化上的中心地位也意味着，无论因何离任（即便是自愿离任），都会造成显著的领导层断档，因为 Shiprocket 尚未公开披露 CEO 继任计划。
              公司靠收购拉动增长，组织复杂度已经被推高：整合 Omuni、Wigzo、Rocketbox 和 Pickrr 后，管理层阵容庞大且分散，Inc42 对 Shiprocket
              组织架构的分析也指出，工程、产品、运营和营销职能都呈现多层结构。 整合执行风险——被收购团队是否留住、技术栈是否统一、收入协同是否兑现——仅凭公开披露仍有一部分看不清。 IPO 执行风险真实存在：SEBI
              已批准（Entrackr 2026 年 4 月确认点头），但上市时间、市场环境和超额认购情况都可能偏离计划；申报到上市之间一旦出现新的负面消息，可能需要重新申报或撤回。
              本投资设定的否决标准包括：（1）前五大快递伙伴集中度升至 90% 以上，且没有实质替代管线；（2）确认发生网络安全事件，并引发 DPDPA 监管行动或商户大规模流失；（3）Saahil Goel
              的撤销申请被驳回，并导致任职资格取消程序；（4）IPO 后任一年度商誉减值超过 ₹2,000 million，显示系统性收购失败；（5）FY26 经营性现金流出超过 ₹3,000 million，表明 IPO
              募资消耗快于既定计划。
