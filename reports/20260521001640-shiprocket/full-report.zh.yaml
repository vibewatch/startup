  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - NRR 回落至 100% 以下
        - 任意连续两个报告期（H1/H2）核心 NRR < 100%
        - 净扩张故事转为净流失；摧毁 SaaS 溢价；合理倍数降至 3–3.5x
        - 下调至避免；将私人持仓按熊市情形（₹5,700 crore 市值）估值
      - - Power Merchant ARPU 未能恢复
        - Power ARPU 到 FY26E 仍低于 ₹0.90 crore
        - 收入集中度风险；头部客群不增长；暗示 Pickrr 组合以外还存在定价或货量疲弱
        - 下调至继续研究；进一步投入前要求披露毛利率
      - - IPO 定价低于 ₹8,000 crore 市值
        - 价格区间意味着市值 < ₹8,000 crore（3.6x FY25 / 约 4.3x FY26E 收入）
        - 相对 2024 年 12 月 $1.21B 私人估值为负回报；OFS 在该水平出让，说明内部人在折价退出
        - 避免 IPO 配售；90 天锁定期后在 ≤4x NTM 收入处评估上市后机会
      - - 重复收购减值 > ₹100 crore
        - 任一财年新增商誉 / 无形资产减值 > ₹100 crore
        - 外延并购持续毁损价值；削弱资本配置纪律；IPO 前账面净资产被压低
        - 要求完整复盘收购管线；暂停敞口；把投资逻辑从「观察」调整为「继续研究」
      - - Delhivery 大规模进入 SME 商户段
        - FY27E 前 Delhivery SME 商户数 > 200,000（目前约 100,000）
        - 对 Shiprocket 核心护城河构成结构性威胁——在同一商户段直接竞争
        - 下调至「回避」；品类风险进入基准情景
      - - 新兴业务 EBITDA 亏损抵消核心业务
        - 合并口径新兴业务 EBITDA 亏损 > ₹200 crore
        - 核心现金引擎（₹157 crore EBITDA）被抵消；公司在规模化后仍净烧钱；PAT 盈亏平衡推迟到 FY29 之后
        - 要求披露子分部 P&L；在新兴业务轨迹清晰前暂停投资
    notes: |
      触发阈值由分析师基于公开证据和可比基准设定。达到这些水平时，投资逻辑假设会发生实质性破裂。传导路径和应对动作仅具方向性；最终投资决定仍需更新后的财务披露，以及法律与合规审查。
    claimRefs:
      - CV025
      - CV027
      - CV031
      - CV039
      - CV043
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 对估值的重要性
      - 尽调路径
    rows:
      - - 分部毛利率
        - 按分部披露毛利率（收入减直接 COGS）：核心国内配送与各新兴子分部
        - 需要验证 12% 核心 EBITDA 利润率到底是结构性水平，还是由业务组合推高；也用于判断应给 SaaS 溢价还是物流折价
        - CFO 管理账；以 Unicommerce 公开 SaaS 毛利率（约 58%）作为 SaaS 层代理对比
      - - 每票实现 ASP
        - 扣除促销返现后，按套餐层级和地理区域划分的每票实际实现收入
        - 把标价（₹20–45/500g）和已披露 ₹1,632 crore 收入接起来；解释 Power ARPU 从 ₹1.44 crore 压缩到 ₹0.88 crore 的原因
        - CFO 管理账；DRHP 中按套餐层级划分的每笔唯一交易平均收入指标
      - - CAC 与回本周期
        - 按渠道（效果营销、外呼、推荐）划分的获客成本，以及按套餐层级划分的回本周期
        - 需要据此评估 ₹294 crore 营销资金安排（IPO 募资最大用途）；没有回本周期，最大一笔投入的 ROI 无法判断
        - CFO 提供渠道级营销支出与新商户队列数据；对比队列收入曲线
      - - 新兴业务子分部 P&L
        - 按子分部拆分 EBITDA 亏损：ShiprocketX、Engage360、Checkout、Omuni、Cargo、Capital
        - 判断哪个子分部最接近盈亏平衡；为收购预算的资本配置优先级排序
        - 带子分部 P&L 的管理账；把已披露的新兴业务整体 EBITDA 改善（同比 25%）下钻到子分部
      - - FLDG 使用率与信贷质量
        - 当前 FLDG 使用额与 ₹200 million 上限对比；Shiprocket Capital 账簿中的商户信贷质量
        - 或有负债规模未知；Capital 一旦放量，FLDG 敞口可能带来实质减值；没有违约历史 ≠ 低风险
        - Shiprocket Capital 贷款簿：未结 FLDG 余额、商户 CIBIL 分布、按产品类型划分的违约率
      - - 剩余并购商誉
        - Omuni（₹124.6 crore）和 Wigzo（₹52.1 crore）减值后，Glaucus、Pickrr 组合留下的商誉和无形资产
        - 剩余组合仍可能继续减值；减值会压低账面净资产，并可能影响 IPO 锚定价格
        - 所有并购商誉 / 无形资产的当前账面价值；审计师对每个剩余实体的可收回价值评估
    notes: |
      证据缺口按估值重要性排序。六项都属于私有数据，公开 UDRHP 或第三方来源无法取得。在私人入场或 IPO 配售时承销 6.2x FY25 收入倍数前，这些是最低尽调要求。
    claimRefs:
      - CV011
      - CV012
      - CV020
      - CV021
      - CV022
      - CV027
      - CV044
