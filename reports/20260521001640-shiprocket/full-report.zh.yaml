          - type: callout
            title: MSME 流失的结构性脆弱性
            body: >
              DRHP 明确承认，商户基础中有很大一部分是 MSMEs，“更容易遭遇经营失败，并可能在维持运营方面面临挑战”。商户 turnover 上升会推高 CAC，并压缩单位经济性。H1FY26 活跃商户数为
              145,269，低于 FY2025 的 165,231，意味着即便新增总量仍健康（56,925），全年层面的活跃商户也净减少。这个缺口——获客持续但活跃数下降——是 MSME
              商户持续流失的结构性信号，投资人应显式建模。
            calloutType: risk
