      - - 数据库层
        - 30+ 个 DB 实例；热数据（12 个月）+ 归档数据（按年份分片）
        - MySQL；垂直 + 水平分片；Elasticsearch 存元数据
        - Elasticsearch 对旧数据查询的索引延迟
        - 历史查询性能下降；重新分片时的数据迁移风险
      - - CDC / 数据管道
        - 变更数据捕获；把状态变化流式送入分析系统
