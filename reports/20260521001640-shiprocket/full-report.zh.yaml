  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险
        blocks:
          - type: paragraph
            body: >
              Shiprocket 于 2025 年 12 月 12 日提交的 SEBI Updated Draft Red Herring Prospectus（UDRHP）披露了一组重大诉讼事项，IPO
              投资人必须仔细评估。公司已发起四项刑事程序，争议金额合计 ₹53.91 million，源于第三方针对 Shiprocket 的涉嫌欺诈活动。针对公司（及其子公司）一侧，有一项刑事程序、十项税务机关争议（合计
              ₹27.09 million）和一项重大民事争议；“被诉”侧总敞口约 ₹50.93 million。最敏感事项是一名第三方向包括 CEO Saahil Goel 在内的联合创始人提交的 criminal
              First Information Report（FIR）；Goel 已向适当法院申请撤销，但截至 UDRHP 日期，该申请结果未披露。子公司 Pickrr（2022 年以约 $200 million 收购）涉及
              QNT Sports 在 Chief Judicial Magistrate court 提起的一项刑事程序，投诉提交日期为 2024 年 10 月 4 日。Blue Line Logistics
              也可能通过公开数据库检索申请把公司或 Pickrr 追加为当事方。一项全新程序——Orosil Smiths India Limited 于 2026 年 5 月在德里 District Consumer
              Disputes Redressal Commission（South District）提起——晚于 UDRHP，涉及货件遗失、退款请求、经营损失赔偿和商誉损失；UDRHP
              披露未反映该事项，构成增量已披露风险。监管层面，RBI Digital Lending Directions 2025 限制 Shiprocket 的 Instant COD 和 FLDG-backed
              credit pilots：FLDG 总敞口在组合层面上限为 ₹200 million，且每笔未偿贷款限额为 5%；公司必须遵守这些上限，否则可能遭遇监管制裁。印度各地消费者法院已收到数百起针对
              Shiprocket 的受害商户和终端消费者投诉，Trustpilot 评分为 1.6/5（“Bad”），PissedConsumer 显示超过 1,400 条评论，ConsumerComplaints.in
              累积数百个未解决案例。单个消费者投诉很少构成重大法律风险，但数量显示系统性服务失败，可能引发监管方对消费者保护义务的审查，并在 IPO 路演期间压低品牌可信度。
