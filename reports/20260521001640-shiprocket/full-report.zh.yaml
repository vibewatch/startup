      - number: '4.4'
        title: 资本充足性、牵引力与融资路径
        blocks:
          - type: paragraph
            body: >
              截至 2025 年 3 月 31 日，Shiprocket 持有现金和银行余额 ₹501.7 crore，总流动资产为 ₹1,254.6 crore 的一部分。截至 2025 年 9 月 30 日，总借款为
              ₹2,337.85 million（约 ₹233.8 crore），主要由短期银行授信和透支额度构成。Company Overview 章节列出完整的逐轮融资时间线；从资本充足性看，关键在于 Shiprocket
              已通过多轮股权融资累计募集超过 ₹2,700 crore（$320M+），投资方包括 Temasek、LightRock、Bertelsmann、Tribe Capital、Zomato、PayPal、MUFG
              Bank 和 KDT Ventures，并在 2022 年以 $1.3 billion 估值成为独角兽。公司给出的 IPO 理由是加速增长，而非求生：CFO 明确表示业务拥有“相当健康的现金余额”。计划募集的
              ₹1,100 crore 新股发行款中，₹294 crore 用于营销和商户获取，₹211 crore 用于技术基础设施，₹211 crore
              用于偿还和提前偿还债务，剩余用于非有机收购和一般公司用途，包括履约中心租赁和佣金费用。公司正考虑最高 ₹220 crore 的 pre-IPO placement，这会降低新股发行规模。H1 FY26 净亏损
              ₹38.3 crore、收入 ₹942.7 crore（年化约 ₹1,885 crore），意味着若不计 ESOP 成本，公司已接近盈亏平衡。Shiprocket Capital 的 FLDG 试点总敞口上限为
              ₹200 million；截至 UDRHP 日期未记录违约，但如果试点在没有外部信用增级的情况下扩张，会形成随规模放大的或有负债。收购相关借款，以及履约中心扩张带来的未来仓库租赁义务，是资本强度的主要驱动因素。
