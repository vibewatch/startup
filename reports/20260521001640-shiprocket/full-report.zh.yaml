  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与模块架构
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 提供两个业务分部：Core Business 和 Emerging Business。Core Business 是国内发货平台，一个连接商户和 42 个活跃合作伙伴的快递聚合器，覆盖全国
              19,000+ pin codes。它提供 AI 驱动的快递分配、non-delivery report（NDR）面板、带 Zero Weight Discrepancy Guarantee Program
              的重量管理、独立于快递周期的 COD 回款，以及在 H1 FY26 达到 75.26% 准确率的 EDD 预测。履约垂直业务运营 35 个 fulfillment centers，叠加托管仓储、12+
              渠道集成，并承诺最高 99.9% 的运营准确率。

              Emerging Business 分部包含五个产品集群。Cargo and Fulfillment 包括 Shiprocket Cargo（国内 B2B/PTL/FTL）、履约网络，以及 Shiprocket
              Omuni——一个整合在线市场、品牌官网和线下门店的全渠道商业平台。Cross-Border 集群（ShiprocketX、CargoX、LaunchX）截至 2025 年 9 月服务 168 个国家，之后在
              H1 FY26 通过 20 个供应链伙伴收窄至 135 个国家。Ads and Marketing 集群包括 Engage360（WhatsApp-first AI marketing）和 Shiprocket
              Checkout（一键结账、预填数据、防欺诈、COD 转预付、高 RTO 地址过滤）。Others 集群包括 Shiprocket Quick（2024 年 9 月推出的同城当日达聚合器）、Shiprocket
              Capital（通过 12 家 NBFC 伙伴放贷）、Shiprocket Sense（AI 驱动的 RTO 预测和地址智能 API），以及 Shunya AI（2025 年 7 月推出的多模态商业
              AI）。模块广度是有意设计的交叉销售飞轮：商户每多用一个产品，锁定就更深，平均每用户收入也更高。
