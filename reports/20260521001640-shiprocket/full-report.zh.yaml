      - number: '8.5'
        title: 建议：观察——IPO 上市是风险调整后的入场点
        blocks:
          - type: paragraph
            body: >
              基于截至 2026 年 5 月可得证据，Shiprocket 应给予观察建议，风险评级为高，估值立场为偏高。 公司的平台领导地位、NRR 修复和 IPO 获批，提供了清晰的流动性事件窗口。 但 FY25 收入
              6.2x 的私募倍数——比 Delhivery 高 93%，也高于全球私营 SaaS 4.8x 中位数——要求三件事同时近乎完美执行：NRR 必须重新加速至 105% 以上，新兴业务（收入占比 20%）必须达到
              EBITDA 盈亏平衡，收入增长必须从 H1 FY26 的 15% 恢复到 FY27 的 20%+。 大规模 OFS（₹1,242
              crore）和连续两次收购减值同时存在，表明内部人对当前私募估值的信心可能带有一定保留。

              私募入场价 $1.21 billion 应对照 IPO 定价评估：如果价格区间隐含市值高于 ₹12,000 crore（>6x FY27E 收入），私募标记在相对意义上有吸引力；如果区间隐含
              ₹8,000–11,000 crore，则大致持平；低于 ₹8,000 crore 则意味着下调估值。 基准情景目标约为 ₹11,000 crore 市值（FY27E ₹2,200 crore 收入的
              5x），对应上一轮私募资本在 12–18 个月 IPO 窗口内获得 2–3x 回报。 悲观情景按 FY27 收入 3x 计算，隐含 ₹5,700 crore——资本亏损。
              对平台的确信度为中等，对当前倍数下的估值确信度为低。最终承销前，投资逻辑以取得分部毛利率和 CAC 披露为条件。
