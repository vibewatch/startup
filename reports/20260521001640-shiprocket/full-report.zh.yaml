        - 快商 + D2C 尾程
        - 快商领先；125K+ 配送伙伴；14,700+ PIN code
        - 承运商，不是聚合器；快商细分可能难以扩展成通用平台
      - - Xpressbees
        - 承运商 / 电商物流
        - Rs 2,874 Cr FY25 收入；Rs 370 Cr 净亏损；$1.4B 估值
        - 电商 + B2B 物流
        - NimbusPost 战略投资方；背后有 Alibaba/Blackstone 等广泛支持
        - 亏损很深；Delhivery CEO 公开质疑其可持续性；现金储备耗尽
      - - NimbusPost
        - 直接聚合器同行
        - 约 Rs 181 Cr FY25 估算收入；Xpressbees 战略投资方
        - SME / D2C 价格敏感型商户
        - 实际费率更低；COD 回款更快；无最低量要求
        - 商户基础小得多；承运商集成更少；分析能力有限
      - - ClickPost
        - 企业物流 SaaS
        - 总融资约 $7M（2024 年 Series A）；估算收入约 $30M
        - 企业 D2C 品牌（Nykaa、Puma、Acer）
        - 350+ 全球承运商；SLA 分析更强；聚焦购后 CX
        - 不是费率聚合器；SaaS 模式要求技术成熟度；无免费增值层
      - - Unicommerce
        - 相邻 OMS / WMS SaaS
        - Rs 204 Cr FY26 收入；Rs 967 Cr 市值；BSE/NSE 上市
        - 品牌运营商和物流服务商
        - 已上市且盈利；OMS/WMS 平台捆绑物流分配（ShipSense AI）
        - 不是发货聚合器；在 OMS 层竞争，不靠承运商价差
      - - Pickrr
        - 原直接聚合器（现已并入）
        - 2022 年 6 月被 Shiprocket 以约 $200M 收购
        - 与 Shiprocket 基础重叠的 D2C 商户
        - Shiprocket 通过收购清除了这一竞争对手
        - 不再独立；已并入 Shiprocket 平台
      - - Shyplite
        - 原直接聚合器（现已并入）
        - 印度业务约在 2022 年被 Shiprocket 收购
        - SME 电商卖家
        - Shiprocket 通过收购清除了这一竞争对手
        - 不再独立；已并入 Shiprocket 平台
      - - Amazon ASCS
        - 新进入者 / 平台物流
        - Amazon 全球规模；印度物流网络
        - 任何企业（不只限 Amazon）
        - 空运 + 陆运 + 仓储 + 尾程一体化；没有中介利润
        - 目前处于美国发布阶段；印度可用时间线不清楚；存在市场平台偏向
      - - 直接承运商合同
        - 现状替代方案
        - 单个承运商定价（Blue Dart、DTDC、India Post、FedEx）
        - 高货量商户（每月 10K+ 票）
        - 极高货量下绝对成本更低；没有聚合器利润
        - 需要逐家签承运商合同；没有统一看板；运营负担高
    notes: >-
      收入 / 估值数字为截至 2026 年 5 月的最新可得数据；Xpressbees 和 NimbusPost 为私营公司，财务数据基于监管申报和媒体报道。 Amazon ASCS
      印度发布时间线尚未公开；市场进入状态根据美国发布公告和分析师评论推断。“规模 / 融资”列在私营公司收入未公开时， 会混合使用收入和总融资。
