      - number: '3.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 承运商整合压缩聚合商价差
            body: >-
              Delhivery 吸收 Ecom Express，以及 CEO Barua 公开否定 Xpressbees 生存能力，都显示印度快递承运商市场正整合为三家上市玩家。随着承运商选择变少，Shiprocket
              对批发费率的谈判杠杆可能下降，压缩其支付给承运商与向商户收费之间的价差——这是聚合模式的核心经济机制。
            calloutType: risk
            claimRefs:
