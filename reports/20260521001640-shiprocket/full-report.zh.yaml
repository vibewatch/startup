      - number: '6.4'
        title: 扩张动态与集中度风险
        blocks:
          - type: paragraph
            body: >
              Shiprocket 的收入集中度中等且在改善。H1FY26，前 1、5、20 个活跃商户分别贡献收入的 3.12%、7.76% 和 17.22%，优于 FY2025 的 3.67%、9.70% 和
              20.20%，也优于 H1FY25 的 4.37%、10.30% 和 21.25%。前 10 大商户 H1FY26 合计贡献 11.81%。公司称 H1FY26、FY2025 或 FY2024 均未发生
              power merchants 的重大流失，但头部 cohort 集中度仍不低。最大单一商户身份未披露，其单独贡献 3.12%。


              Land-and-expand 动态可见：Power Merchants 越来越多采用多产品，52.27% 使用三项或更多服务——发货、履约、结账、跨境或金融产品——高于 FY2023 的
              39.21%。Emerging Business 分部（跨境、营销技术、全渠道）FY2025 同比增长 41%，目前占总收入 20%，两年前为 11%。通过 Emerging Business 渠道获取的新商户在
              H1FY26 升至新增商户的 24.23%，FY2023 仅为 3.19%，显示产品驱动的跨分部增长。


              渠道依赖带来风险。Shiprocket 严重依赖数字发现（搜索引擎、社交媒体、app stores）吸引新商户；DRHP 明确提示 AI-generated overviews 和算法变化会影响 web
              traffic。Fynd partnership 展示了伙伴渠道敞口——对 300+ 品牌有意义，但集中在单一平台。H1FY26，前 5 大快递伙伴处理约 86% 发货量（总计 42
              个活跃快递伙伴），形成对第三方物流提供商的交付质量依赖；其服务失败会反映到 Shiprocket 品牌上。
            claimRefs:
