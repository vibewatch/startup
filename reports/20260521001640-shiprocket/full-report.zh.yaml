      - number: '2.2'
        title: 多视角市场规模测算
        blocks:
          - type: paragraph
            body: >-
              分析师对印度电商物流市场的估算分歧很大，反映范围定义和专有建模假设不同。Mordor Intelligence 将 2026 年市场定为 $7.25 billion，并以 8.98% CAGR 增长至 2031
              年 $11.14 billion——这是最保守估计，锚定狭义物流支出。IMARC Group 给出 2025 年 $19.54 billion，并预计 2034 年以 20.39% CAGR 达到 $103.83
              billion，可能纳入更宽的履约和增值服务。OMR Global 估算 2025 年市场为 $10.8 billion，2035 年目标为 $46.8 billion（15.8% CAGR）。MarkWide
              Research 将 2026 年定为 $8.7 billion，2035 年增至约 $27 billion，CAGR 18.4%。这些估算在底部（Mordor）和顶部（IMARC）之间约差 3
              倍，说明方法和范围选择带来的差异不亚于经济假设。SEBI UDRHP 中 Redseer 分析为 Shiprocket 提供了最细的 SAM 视角：Direct Commerce 在 CY 2024 的 GMV
              为 $7–9 billion，并以 20–25% CAGR 增长至 CY 2029，意味着到 2029 年 Direct Commerce SAM 约 $17–27 billion。若扩大到包括
              marketplace 物流，Shiprocket 的有效 SAM 与 2026 年中位电商物流估算 $10–14 billion 对齐。Mordor Intelligence 估算，作为需求侧代理的印度 D2C
              电商市场 2025 年为 $87.5 billion，并以 24.3% CAGR 增长至 2031 年 $322.1
              billion，提供结构性需求拉动。这里保留各报告之间的矛盾，作为尽调信号：未先调和范围，任何单一估算都不应作为估值分析锚点。
