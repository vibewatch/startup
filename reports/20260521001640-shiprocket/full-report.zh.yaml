companyProfile:
  summary: >
    Shiprocket 是印度的商业赋能平台，靠架在第三方物流伙伴之上的轻资产软件层，帮助商户管理运输、履约、结账、营销、跨境物流和商户融资。法律实体 2011 年在新德里以 Bigfoot Retail Solutions
    名义成立；Shiprocket 平台通常被描述为 2017 年由 Saahil Goel、Gautam Kapoor、Vishesh Khurana 和 Akshay Ghulati 创立并上线。Shiprocket 目前披露 42
    家活跃快递伙伴、覆盖印度 19,000+ 个可服务 pin code、DRHP 中披露跨境触达 160+ 个国家（营销材料为 220+），FY2025 活跃商户 165,231 家。FY25 收入达到 ₹1,632
    crore，核心业务 NRR 为 103.51%，合并口径现金 EBITDA 转正至 ₹7 crore。2024 年 12 月 Series E-III 延伸轮将公司定价约 $1.21B；2025 年向 SEBI
    备案后，公司计划发行 ₹2,342.3 crore 的 IPO。
