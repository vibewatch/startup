      - number: '3.5'
        title: 护城河耐久性、商品化风险与不利证据
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 最强的护城河仍是商户数据网络的绝对规模——400K+ 商户、8+ 年 RTO 模式、按 pin code 和产品品类拆分的承运商表现，以及 NDR
              转化数据。这一数据集确实专有，NimbusPost 或 ClickPost 要复制，需要多年同等吞吐量。RADAR AI 系统和 Shunya AI 多模态模型（2025 年 7
              月）试图把这一数据优势转化为可持续的分析产品，并支撑更高订阅层级。承运商价差护城河更脆弱——Shiprocket 通过谈判获得批发承运商费率，再按零售费率向商户收费，中间差额构成收益；Delhivery CEO
              称 B2C 物流“烧钱周期已经结束”，释放出承运商可能收紧定价纪律、压缩 Shiprocket 传递给商户的价差的信号。


              最持续的不利证据来自商户评论平台。PissedConsumer（截至 2026 年 5 月）显示，活跃投诉包括包裹被标记为“尝试配送”但实际没有尝试、未经授权的重量收费、COD 回款延迟。MouthShut 和
              ConsumerComplaints 也出现类似主题：脚本化客服回应、未解决账单争议和追踪差异。NimbusPost 的比较分析（供应商撰写，但引用商户反馈）明确指出，“隐藏重量收费更少”和“COD 回款更快”是
              NimbusPost 相对 Shiprocket 的竞争优势——独立商户评论模式也印证这些主张。上述投诉在 400K+ 商户规模上持续存在，在切换摩擦最低的中等件量层形成竞争脆弱性。


              行业向整合迁移——Delhivery 吸收 Ecom Express、Xpressbees 可能理性化，以及 Amazon ASCS
              进入——对聚合商经济性构成中期风险。如果承运商市场整合为三家上市玩家（Delhivery、Blue Dart、Shadowfax），聚合商的价格谈判杠杆会下降。Amazon 的 3PL 推进使 Delhivery
              股价在公告日下跌 4%，反映市场担忧一体化物流平台会随时间结构性替代第三方中介。Shiprocket IPO
              募资用途措辞（技术投资、履约基础设施、收购）显示公司自己也认识到，纯聚合不够——必须增加专有履约基础设施和 AI 能力，才能保持可防守性。
