  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对承销判断的影响
      - 尽调路径
    rows:
      - - 按分部拆分的毛利率（核心与新兴）
        - 无法判断利润率轨迹，或判断业务更像 SaaS 还是更像物流
        - 向 CFO 要求经审计分部 P&L 到 P&L 科目级别；用 Unicommerce 公开文件作代理对比
      - - 按套餐层级和分区拆分的单票实际 ASP
        - 无法把标价与披露收入对上；ARPU 压缩来源未解释
        - CFO 管理账；对照 DRHP 披露的每笔唯一交易平均收入
      - - 按渠道拆分的 CAC 与回收期
        - 无法计算 LTV:CAC，也无法评估 ₹294 crore 营销投入的回收可行性
        - 渠道级营销支出与新增商户 cohort 数据；cohort 留存曲线
      - - Power Merchant ARPU 下降根因
        - FY25 ARPU 下降 39%（₹1.44 crore → ₹0.88 crore）是最主要的负面单位经济信号；尚未确认是费率让利还是结构切换
        - Pickrr 整合前后商户级收入拆分；管理层对定价动作的说明
      - - 新兴业务分部 EBITDA 亏损按子分部拆分
        - 无法判断跨境、martech 还是全渠道是主要拖累，也无法判断各自是否有不同的利润率路径
        - 按子分部列示贡献利润率的管理账
      - - 自由现金流与经营现金流（FY25）
        - Cash EBITDA 不等于经营现金流，原因是营运资本变动；烧钱速度不确定
        - FY25 年度账目中的经审计现金流量表
      - - FLDG 使用量 vs. ₹200 million 上限
        - 或有负债规模；商户借款人池的信用质量
        - Shiprocket Capital 贷款簿：未偿 FLDG 敞口、商户 CIBIL 分布、违约经验
      - - 快递集中度风险（前 5 家 = 86% 货量）
        - 合同条款、排他性、定价重谈风险
        - 快递合同摘要；各套餐层级下每 500g 快递成本拆分
      - - 剩余收购商誉减值敞口
        - Omuni 与 Swiftly 已计提减值；Glaucus 及其他收购可能仍有残余风险
        - 所有收购形成的商誉和无形资产当前账面价值；审计师对可收回金额的评估
      - - FY26 指引与合并 EBITDA 盈亏平衡路径
        - H1 FY26 增长 15%，低于 FY25 的 24%，显示增速放缓；管理层未给出指引
        - 管理层预测；新兴业务分部盈亏平衡时间表的情景分析
