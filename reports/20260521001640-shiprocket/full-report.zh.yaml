      - number: '5.5'
        title: 信任、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              根据 DRHP 披露，Shiprocket 基础设施已获 ISO 认证，信息安全协议被描述为“robust”。2025 年 3 月，全服务平台 uptime 为 99.84%——符合 SaaS
              级可靠性，但这只是单月数据。重量管理系统和独立 COD 回款周期解决了具体的商户信任痛点。Shiprocket 拥有 41 个注册商标，子公司另有 8 个，均受印度 Trademarks Act, 1999
              保护；未披露专利组合，意味着 IP 护城河主要来自商标保护和自有数据资产，而不是硬专利。

              考虑到 Shiprocket 处理消费者地址、行为和金融数据的规模，印度 Digital Personal Data Protection Act 2023 和 DPDP Rules 2025 适用于其 Data
              Fiduciary 身份。关键义务（同意管理、数据权利、泄露通知）将分阶段落实至 2027 年 5 月，给 IPO 阶段公司带来合规尾部风险。用户评价聚合器信号不一：GetApp 和 Capterra 均为
              3.0/5（各 33 条评论），SaaSworthy 用户评分为 2.9/5（1,000+
              ratings），反复投诉不明钱包扣款、支持响应慢、虚假派送尝试和账单透明度。这些信号显示客户面运营可靠性存在产品质量缺口，仅靠 AI 物流尚未补上。Top-5 快递集中度（86%
              业务量）和缺少与伙伴的独家合同，是结构性最重大的风险：若大型快递商退出或改变优先级，多数发货的 SLA 会立刻下降。Pickrr 和 Omuni 整合缓慢（Omuni 在 FY25 减值 ₹124.6
              Cr），也引出一个问题：Shiprocket 的模块化架构究竟能否真正吸收被收购能力，还是只是把它们并行运行。
