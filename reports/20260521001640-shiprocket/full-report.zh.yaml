      - number: '3.2'
        title: 竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Delhivery 是印度快递物流中占主导的承运商侧玩家，FY26 收入 Rs 10,508 crore（同比增长 17.5%）、净利润 Rs 153 crore，并在 FY26 发送超过 1 billion
              个快递包裹（件量同比增长 40%）。其 2025 年 4 月以 Rs 1,407 crore 现金收购 Ecom Express，增加了大量件量、分拣基础设施和 B2C 快递经济性的机构知识。Delhivery
              CEO Sahil Barua 在 Q4 FY26 业绩电话会上表示，“Express logistics 领域现在有三家上市玩家——Delhivery、Blue Dart 和 Shadowfax——我看不到
              XpressBees 存在的理由”，显示后 Ecom 整合阶段正在加速行业理性化。Delhivery 还在六个城市推出 Delhivery Local（城内），FY26 年化收入 run rate 为 Rs 60
              crore，并推出 Delhivery International（经济型航空包裹，四个国家），直接竞争 Shiprocket 的 ShiprocketX 和 Quick 相邻业务。


              Shadowfax（Flipkart 支持，Eight Roads Ventures 为最大机构股东）披露 FY25 收入 Rs 2,485 crore（同比增长 32%），净利润 Rs 6.4
              crore——首次全年盈利。H1 FY26 收入同比激增 68% 至 Rs 1,806 crore，利润 Rs 21 crore（为 H1 FY25 的 2 倍），由快速商业推动（同城业务同比
              +82.6%，约占收入 20%）。Shadowfax 通过 125,000+ 名配送伙伴覆盖 14,700+ 个 pin code，并向 SEBI 提交 Rs 2,000 crore IPO 的 UDRHP（Rs
              1,000 crore 新股发行），目标 2025 年 12 月 / 2026 年 1 月上市。作为 Shiprocket 的承运商伙伴，Shadowfax 的竞争位置是双重的：它既通过平台路由件量为
              Shiprocket 贡献收入，也可能在商户寻求直接件量合同时成为替代方案。


              Xpressbees（Alibaba、Blackstone、TPG 支持，估值 $1.2-1.4B，总融资 $580M+）披露 FY25 收入 Rs 2,874 crore（与 FY24 的 Rs 2,831
              crore 基本持平），净亏损 Rs 370 crore——物流和设施成本上升推动亏损扩大 85%。现金储备从 Rs 1,331 crore（FY24）骤降至 Rs 172 crore（FY25）。尽管
              Xpressbees 投资了 NimbusPost（Shiprocket 的直接聚合商竞争对手），其自身运营轨迹仍面临结构性挑战，Delhivery CEO 已公开质疑其生存理由。


              NimbusPost（FY25 估算收入约 Rs 181 crore，约 350-400 名员工）是仍独立运营的最可信直接聚合商对手。Xpressbees
              持有战略股权，为其提供承运商接入优势和资本支持。NimbusPost 主要靠更低的商户侧费率和更快的 COD 回款周期竞争（独立比较显示为 2-3 天，而 Shiprocket 为 2-4 天），并有 25+
              家承运商集成。


              ClickPost（Series A，来自 Inflexor、Athera、Riverwalk、Rebright 的总融资约 $7M）瞄准企业级 D2C 细分（Nykaa、Puma、Acer），拥有 350+
              个全球承运商集成、先进 NDR/SLA 分析和购买后体验工具。它每日处理超过 1 million 个包裹，但不是传统意义上的聚合商——它收取企业 SaaS 费用，而不是赚承运商费率价差。


              Unicommerce（NSE: UNIECOM，2024 年 8 月上市，截至 2026 年 5 月市值 Rs 967 crore）披露 FY26 收入 Rs 204.3 crore（同比增长 52%）、PAT
              Rs 20.5 crore、调整后 EBITDA Rs 43.9 crore。其 OMS/WMS 平台服务 450+ 个企业品牌。它不是在核心运输上竞争，而是直接竞争 Shiprocket 的
              Engage360、Checkout 和分析模块；但其纳入物流分配（ShipSense AI）后，这条边界变得模糊。
