    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律沿革与运营模式
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 是总部位于印度的电商赋能平台，核心卖点是为直接面向消费者（D2C）品牌、MSME 和在线零售商提供多承运商运输聚合。公司法律实体最初于 2011 年 9 月 28 日根据 1956
              年《公司法》在新德里注册为 Bigfoot Retail Solutions Private Limited（CIN: U72900DL2011PLC225614）。2024 年 6 月 12
              日，股东决议将实体更名为 Shiprocket Private Limited，并于 2024 年 7 月 19 日取得新的公司注册证书。随后，公司依据 2025 年 1 月 18
              日股东决议转为公众有限公司——Shiprocket Limited，并于 2025 年 2 月 18 日取得注册证书。市场通常理解，Shiprocket 品牌和平台在 2017
              年上线，当时联合创始人做出了如今的核心业务——多承运商运输产品。2011 与 2017 年的区别很关键：法律实体比 Shiprocket 品牌早六年成立，后续章节的财务分析应把注册成立锚定在 2011 年，把运营
              / 品牌上线锚定在 2017 年。


              注册办公室在德里；公司办公室在 Haryana 的 Gurugram。运营模式是技术驱动的物流市场：Shiprocket 连接商户与 42+ 家活跃快递伙伴（包括
              Delhivery、FedEx、Aramex、Xpressbees、DTDC 和 Shadowfax），提供自动定价和承运商选择、实时追踪，以及一套按使用量计费的相邻工具。除核心国内运输外，平台已扩展到：面向
              220+ 个国家的跨境物流 ShiprocketX；Fulfillment（仓储和履约中心运营）；Engage360（以 WhatsApp
              为中心的营销自动化）；Checkout（降低弃购的一键结账）；Trends/Intelligence（AI 驱动的市场分析）；Capital（通过 NBFC 伙伴撮合贷款）；Shiprocket Quick（同日
              / 快速商业，2024 年 9 月）；以及面向 SMB 的多模态 AI 引擎 Shunya AI（2025 年 7 月）。新兴业务合计贡献 FY25 收入约 20%，两年前为 11%，同比增长 41%。
