      - number: '6.3'
        title: 留存、耐久性与 cohort 行为
        blocks:
          - type: paragraph
            body: >
              终端消费者复购率——某一期间内通过 Shiprocket-enabled merchant 服务过且此前已有交易的消费者占比——连续五个期间上升：FY2023 为 42.37%，FY2024 为
              46.79%，FY2025 为 51.11%，H1FY25 为 57.31%，H1FY26 为 64.56%。这是 Core Business 范围内的聚合平台指标（不含 Pickrr 终端消费者），不是
              cohort-specific retention rate，但上行趋势强烈暗示 Shiprocket-enabled storefronts 的消费者粘性在增强。绝对数看，H1FY26 服务的 42.27
              million 消费者中，27.29 million 是复购买家，高于 FY2023 的 15.74 million。


              商户 cohort 方面，DRHP 披露的是交易留存倍数，而不是商户数量留存率。FY2018 商户 cohort 到第 7 年（FY2025）交易量增长 20.93 倍；FY2019 cohort 到第 6
              年增长 4.80 倍；FY2020 cohort 到第 5 年增长 2.56 倍；FY2021 cohort 到第 4 年增长 1.51 倍；FY2022 和 FY2023 cohorts 分别在第 3 年和第
              2 年达到 1.71x 和 1.10x。这些倍数体现的是互动加深，而不只是留存，说明留在平台上的商户会随着时间显著扩大交易量。这是 net revenue retention 的有意义
              proxy，尽管公司未披露正式 NRR 或 GRR。


              Core Business 的 CAC 从 FY2023 的 ₹4,772 降至 FY2025 的 ₹3,361，并进一步降至 H1FY26 的 ₹2,818，说明获客单位经济性在改善。Power
              merchant 交叉销售深度体现在 H1FY26 有 52.27% 的 power merchants 使用超过三个产品。自助入驻达到 96.92%（无需人工支持），First Call Resolution
              Rate 为 62.57%，说明平台能在支持成本不成比例增长的情况下承载规模。平台满意度信号混杂：G2 的 108 条评论给出 4.0/5，而 Trustpilot 将 Shiprocket 评为 1.6/5
              “Bad”——主要来自经历派送失败的终端消费者——Capterra 的客户支持平均分为 2.4/5。这些面向消费者的评分反映最后一公里伙伴表现，也反映 Shiprocket
              自身平台质量，但声誉外溢到商户端会形成留存风险。
