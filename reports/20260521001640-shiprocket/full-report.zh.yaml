          - type: callout
            title: 持续服务质量投诉削弱品牌护城河
            body: >-
              PissedConsumer（2026 年 5 月）、MouthShut 和 ConsumerComplaints 上的活跃负面评论记录了虚假配送尝试标记、未经授权的重量扣费、COD
              回款延迟和支持无响应。NimbusPost 在自身面向商户的内容中明确把 COD 回款更快、隐藏收费更少列为切换动机。在切换摩擦最低的微型到中等件量层，持续服务质量问题是商户流失的主要驱动因素。
