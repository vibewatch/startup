            body: >
              Trustpilot 基于虚假派送尝试、支持无响应和未经授权钱包扣款等模式，给 Shiprocket 1.6/5（“Bad”）。尽管多数最后一公里失败源自第三方快递伙伴，Shiprocket
              品牌仍会吸收消费者不满。如果商户把糟糕消费者体验归因于物流平台，这种声誉外部性会抬高商户流失。前 5 大快递伙伴处理约 86% 业务量，进一步集中这一服务风险。
