      - number: '5.3'
        title: 集成生态与开发者平台
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 围绕开放平台战略搭建了 250+ 生态伙伴，积累期从 2021 年 4 月至 2025 年 9
              月。伙伴覆盖物流和履约提供商、通信平台（WhatsApp、SMS、email）、购物车连接器（Shopify、WooCommerce、Magento、Amazon、Flipkart、Meesho
              等）、支付网关、ERP、开发者、信贷提供方和忠诚度计划。平台支持 12+ 正式渠道集成，连接主要 marketplace 和 D2C 店面，让商户可在一个仪表盘管理统一库存和订单路由。

              开发者侧，Shiprocket 暴露 RESTful APIs，用于创建订单、分配 AWB、生成面单、追踪、NDR 工作流、COD 对账和库存管理。API reference 记录在
              apidocs.shiprocket.in，并提供 Postman collections 便于测试。SDK 覆盖 Node.js、PHP 和 Python。用于 WooCommerce 的活跃
              WordPress plugin 位于 wordpress.com，集成自动导入订单、实时运费、批量面单生成和实时追踪。github.com/shiprocket 上的 GitHub organization
              托管示例集成仓库。Stack Overflow 有带 “shiprocket” 标签的问题，显示第三方开发者仍在采用。相较封闭式快递聚合器，这种开放开发者姿态是战略差异点，但它依赖持续维护质量。DRHP
              指出一个重大风险：第三方平台变化（OS 更新、API 废弃、支付网关政策变化）可能在 Shiprocket 无法控制的情况下损害平台互操作性。
