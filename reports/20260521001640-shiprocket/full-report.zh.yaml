      - number: '8.3'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Shiprocket 的正向逻辑建立在平台领导地位、财务拐点和队列复利上。 按 Redseer 报告，以收入计，Shiprocket 是印度最大的新一代横向电商赋能平台，服务 400,000+ 入驻商户，覆盖 4
              lakh 商户，并支撑 $3 billion 年化 GMV，占印度电商交易量的 4.5–5%。 平台基于消耗的钱包模型，使经常性收入由商户 GMV 驱动，而不是由合同续约驱动；核心 NRR 在 FY25 达到
              103.51%，高于 FY24 的 96.27%。 FY2018 队列到第 7 年（FY25）交易额复合增长 20.93x，证明平台能够随商户共同增长，支撑类似 SaaS 的经常性现金流叙事。 FY25
              是公司首次实现 cash EBITDA 转正（₹7 crore）的年份，核心调整后 EBITDA 达 ₹157 crore，在核心收入上对应 12% 利润率。

              反向逻辑锚定在估值溢价和执行缺口。 按 FY25 收入 6.2x 计算，Shiprocket 较 Delhivery 的 EV/Sales 溢价 93%，较 Unicommerce 溢价 39%；只有当 NRR
              重新加速、新兴业务盈利验证 SaaS 重估叙事时，这些溢价才站得住。 FY24 净亏损 ₹595 crore（由 ₹244 crore 重组、₹192 crore ESOP 和新兴业务投入驱动），以及 FY25
              对 Omuni（₹124.6 crore）和 Wigzo/Swiftly（₹52.1 crore）收购计提的 ₹176.7 crore 特殊减值，说明外延增长带来的不是增量 EBITDA，而是减值。 Power
              Merchant ARPU 在 FY25 下滑 39%（₹1.44 → ₹0.88 crore）后才部分恢复，根本原因尚未公开披露。 收入增速在 H1 FY26 放缓至 15%，削弱了当前倍数的前瞻增长支撑。
              ₹1,242 crore 的 OFS 规模表明现有投资者希望在上市时获得部分流动性，带来近期抛压。
