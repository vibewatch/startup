      - number: '1.2'
        title: 创始人、管理层、董事会与治理
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 由 Saahil Goel、Vishesh Khurana、Akshay Ghulati 和 Gautam Kapoor 于 2017 年联合创立。Saahil Goel
              担任董事总经理兼首席执行官，自 2011 年 9 月 30 日起任董事；董事会于 2023 年 12 月 14 日决议任命其为 MD 兼 CEO，任期五年。他拥有 Arizona 的 Western
              International University 商学 BSc 学位，以及 Pennsylvania 的 Joseph M. Katz Graduate School of Business 的 MBA/MSc
              学位，此前曾在 Max New York Life Insurance 和 SDLC Partners LP 任职。Gautam Kapoor 是执行董事兼首席运营官，也自公司 2011 年 9 月 28
              日成立日起任董事，负责日常运营和战略举措落地；他拥有 Delhi University 的 BCom 学位和 Western International University 的商学 BSc 学位。Tanmay
              Kumar 担任首席财务官，并在 FY25 业绩沟通中是主要财务发言人。


              截至 UDRHP 提交，董事会由七名董事组成。Arjun Sethi（自 2020 年 10 月 8 日起任非执行董事）与 Tribe Capital
              相关，带来风险投资和科技运营经验。四名独立董事——Chetan Kumar Mathur、Kaushik Dutta、Vani Gupta Dandia 和 Brijesh Kumar Agrawal——于
              2024–2025 年获任命，是 IPO 前加强治理的一部分。根据 UDRHP，Vishesh Khurana 和 Akshay Ghulati 仍是拟议 IPO 中的个人出售股东，但未担任列名董事会职务。


              关键人集中是实质性治理风险。业务战略、投资者关系和公开定位都与 Saahil Goel 绑定很深。DRHP 还披露，一名第三方向包括 Saahil Goel 在内的公司所有者提交了 first
              information report（FIR），形成仍在进行的不利监管事项，尽调必须跟踪。另有一起诉讼由 QNT Sports India Private Limited 于 2024 年 10 月在 Chief
              Judicial Magistrate 面前针对 Pickrr（一家子公司）提起。Shiprocket 独立董事 Kaushik Dutta 同时也是 Eternal Limited（原
              Zomato）董事会成员，在 Shiprocket 与其战略投资者之间形成董事会层面的连接。
