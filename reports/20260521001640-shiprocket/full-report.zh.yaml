      - number: '5.4'
        title: AI/ML 智能与创新层
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 已在多个运营环节部署 AI 和 ML 模型。快递推荐引擎按历史表现、成本和 PIN-code 级成功率给承运商排序，并为线路封锁和商户自定义配置设置 fallback 规则。RTO
              预测模型在发货前标记高风险订单；结合结账层 RTO 地址过滤和 COD 转预付 nudges，这是平台商业差异化最强的 AI 应用。EDD 预测系统（H1 FY26 准确率
              75.26%）用历史发货数据在结账时给出交付日期置信度。NDR 面板叠加地址评分智能，用于分流失败派送尝试。Engage360 从 140 million 个终端消费者画像中生成 AI 消费者洞察，支持定向
              WhatsApp marketing campaigns。Shiprocket Co-Pilot 是 AI 驱动的账户管理工具，提供实时运营建议。

              2025 年 7 月，Shiprocket 推出 Shunya AI，称其为印度首个面向 MSMEs 的主权多模态 AI 引擎。Shunya AI 支持 9+ 印度语言的语音、文本和图像输入，托管在
              Cloudfiniti（Larsen & Toubro）GPU 基础设施上，为合规把所有数据留在印度境内。能力包括自动编目、双语商品 listing、符合 GST 的发票生成、WhatsApp
              语音下单自动化，以及面向物流和配送建议的 AI agent 功能。价格为每月 ₹499（freemium，含 25 次免费查询）。平台目标服务 1.5 lakh 商户。IPO 募集资金中 ₹211 crore
              指定用于技术投资，其中一部分投向 AI 基础设施和模型改进。数据资产广度——从成立至 2025 年 9 月的 620 million 笔唯一交易——如果用于训练竞争对手无法复制的自有模型，就是实质护城河。
