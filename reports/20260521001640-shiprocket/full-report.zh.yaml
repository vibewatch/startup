      - number: '4.3'
        title: 利润率、成本结构与单位经济性
        blocks:
          - type: paragraph
            body: >
              Shiprocket 最大的成本项是“Cost of Merchant Solutions”，FY25 同比增长 20% 至 ₹1,213
              crore，本质上是为商户履约发货所需的转付和净物流成本，包括第三方快递付款。单项成本约占经营收入 74%，说明物流聚合商业务天然毛利很薄。员工福利费用从 FY24 的 ₹430 crore 降至 ₹314.9
              crore，下降 26.8%，主要因为 ESOP 费用从 ₹192.6 crore 降至 ₹91 crore，而现金口径员工数稳定在约 1,300 人。IT 费用增长 11.4% 至 ₹44.9
              crore，广告费用增长 12.2% 至 ₹21.1 crore。其他所有间接费用（营销、服务器、通信、仓库管理、折旧摊销及其他）合计约 ₹221 crore。总费用基本持平，为 ₹1,749
              crore，FY24 为 ₹1,709 crore。混合单位成本率从 FY24 的每赚 ₹1 花 ₹1.30 改善至 ₹1.07。核心分部 FY25 实现调整后 EBITDA 约 ₹156.9 crore（12%
              利润率），较 FY24 改善 2.2 倍，管理层称其为给新兴分部投资供血的“flywheel”。新兴分部在 EBITDA 层面仍亏损，但现金 EBITDA 同比改善 25%。合并层面 EBITDA 利润率仍为
              -3.68%。FY25 ROCE 为 -6.1%。公司 ₹91 crore 的 ESOP 费用是非现金项；剔除后，FY25 合并 PAT 层面名义上可实现盈利。按分部划分的毛利率、按套餐层级划分的贡献毛利，以及
              CAC / 回收期未公开，是单位经济性建模的主要承销缺口。
