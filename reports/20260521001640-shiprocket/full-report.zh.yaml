      - number: '6.5'
        title: 负面证据与平台弱点
        blocks:
          - type: paragraph
            body: >
              最重大的负面信号是 Shiprocket 在 Trustpilot 上 1.6/5（“Bad”）的评分，汇总自 2025 年末和 2026
              年初的评论。投诉记录包括虚假派送尝试（快递员未上门却标记订单已送达或已尝试派送）、客服无响应、未经授权从商户钱包扣除体积重量费用、强制只退回钱包余额的政策，以及订单在没有任何联系尝试下被标记为“customer
              unavailable”。一名商户在 consumercourt.net 正式提交的投诉指称“不公平贸易行为、服务缺陷、未经授权扣款、强制退款政策、精神骚扰和财务损失”，说明个别案例已升级至正式消费者申诉平台。


              G2 评论（4.0/5）显示受众分裂：商户端用户普遍称赞快递聚合和入驻便利，企业用户和高业务量 D2C 卖家则指出支持延迟和账单差异。SoftwareSuggest
              评论也呈现类似模式。这些负面信号多归因于第三方快递伙伴，Shiprocket 聚合它们但不拥有最后一公里；不过，聚合器平台仍要为终端消费者归因到 Shiprocket 品牌上的伙伴失败承担声誉责任。


              DRHP 披露的结构性风险包括：（a）MSME 商户流失——许多商户处于早期阶段，面临扩张挑战；（b）Pickrr、Omuni（FY2025 减值 ₹124.6Cr）和 Swiftly（减值
              ₹52.1Cr）收购整合慢于预期；（c）依赖在线营销渠道，易受 AI 驱动搜索冲击；（d）Emerging Business 分部（跨境、营销技术、履约）仍亏损，却需要持续投资。新产品类别（Shiprocket
              Quick、ShiprocketX）仍处早期，Quick 仅从 Q4FY25 开始产生收入，跨境业务还面临成熟全球物流玩家的激烈竞争。
            claimRefs:
              - CU043
