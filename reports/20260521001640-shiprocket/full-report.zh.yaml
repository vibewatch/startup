      - number: '1.4'
        title: 规模快照与商业指标
        blocks:
          - type: paragraph
            body: >-
              按最新公开披露（UDRHP、FY25 备案、公司声明），Shiprocket 对外营销口径称累计“帮助 4 lakh+ 家企业扩张”，而 DRHP 备案的 FY2025 活跃商户为 165,231
              家；平台覆盖印度 19,000+ 个可服务 pin code，并向全球 220+ 个国家和地区配送。截至 2025 年 9 月 30 日，公司有 42 家活跃快递伙伴，其中前 5 家贡献约 86%
              的总包裹量——DRHP 风险因素中突出提示的快递集中度风险。Shiprocket 与物流伙伴没有独家合同，意味着伙伴可能优先服务竞争对手或退出合作。公司运营 42+ 个履约中心。


              FY25 财务表现明显改善。经营收入同比增长 24%，从 FY24 的 Rs 1,316 crore 增至 Rs 1,632 crore。核心业务收入同比增长超过 20%，达到 Rs 1,306
              crore，贡献总收入的 80%。公司 FY25 现金 EBITDA 转正至 Rs 7 crore，而 FY24 现金 EBITDA 消耗为 Rs 128 crore。FY25 净亏损从 FY24 的 Rs
              595 crore 收窄 87.5% 至 Rs 74.5 crore（后者受到 Rs 240 crore 特殊费用和 Rs 192 crore ESOP 费用抬高）。H1 FY26（2025 年 4–9
              月）收入达到 Rs 942.7 crore，同比增长 15%，净亏损 Rs 38.3 crore（同比下降 10%）。截至 2025 年 3 月，公司现金和银行余额为 Rs 501.7 crore。FY25
              员工人数约 1,300 人，同比稳定。FY25 总支出约 Rs 1,749 crore，略高于 FY24 的 Rs 1,709 crore；员工福利费用下降 26.8% 至 Rs 314.9 crore。
