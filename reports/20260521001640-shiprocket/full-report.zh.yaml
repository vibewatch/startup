              - CU047
          - type: callout
            title: 4 lakh 营销口径 vs. 145K 活跃商户——需要调和
            body: >
              Shiprocket 显眼宣传“4 lakh+（400,000+）businesses scaled”。SEBI UDRHP 显示 H1FY26 活跃商户为 145,269，FY2025 为
              165,231。营销口径与活跃数之间约 2.5x 的差距反映的是累计历史注册（包括已流失或不活跃商户），而非当前参与基础。尽调分析应锚定 DRHP 备案的活跃商户数，避免把营销数字当作当前客户 traction
              的 proxy。
