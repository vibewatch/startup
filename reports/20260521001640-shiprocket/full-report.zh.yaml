      - number: '1.3'
        title: 融资历史、估值与投资者版图
        blocks:
          - type: paragraph
            body: >-
              2013 年至 2024 年 12 月，Shiprocket 多轮融资累计超过 $320 million。2022 年 8 月，公司由 Temasek 和 LightRock 领投，以 $1.3 billion
              投后估值完成约 $32 million 的 Series E 延伸轮，跻身独角兽。2024 年 12 月 Series E3 延伸轮融资 Rs 219 crore（约 $26 million），由 KDT
              Ventures 领投，MUFG Bank、Tribe Capital、SAI Global、Huddle Ventures 和 Agility International 参投；根据 Fintrackr 对
              RoC 备案的分析，投后估值约 $1.21 billion。尽管此前两个财年收入翻倍以上，这一轮估值仍较 $1.3 billion 的独角兽估值小幅下调。


              资本历史同时反映战略投资者和财务投资者。早期轮次（2013 年种子轮、2014 年和 2016 年 Series A）由 500 Global、Bertelsmann India Investments（现
              Bertelsmann Nederland B.V.）和 Nirvana Ventures 领投。Series B（2017–18）巩固了 Bertelsmann 的位置。Series
              C（2020–21）、Series D（2021 年中）以及 Zomato（现 Eternal Limited）的战略投资，发生在 2021 年 12 月约 $185 million 的大型 Series E
              之前。按 TheKredible 数据，Bertelsmann Nederland B.V. 成为最大的外部机构股东。Eternal（原 Zomato）持股约 6.85%，Temasek 持股约 5.29%。


              拟议 IPO 规模 Rs 2,342 crore，包括 Rs 1,100 crore 新股发行和 Rs 1,242 crore 由 LightRock、Tribe
              Capital、Bertelsmann、Arvind Ltd 及联合创始人等现有股东出售的 OFS，是主要流动性路径。IPO 募资用途包括营销（Rs 294 crore）、技术（Rs 211
              crore）、债务偿还（Rs 211 crore）、非有机收购和一般公司用途。公司于 2025 年 12 月向 SEBI 提交 UDRHP；目标是在 FY27 上半年 IPO。
