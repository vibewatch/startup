      - number: '4.2'
        title: 定价模型、套餐经济性与收入组合
        blocks:
          - type: paragraph
            body: >
              Shiprocket 披露分层订阅套餐，把平台访问权和折扣单票价格打包，形成两层变现结构。Lite 套餐（免费）的国内基础价格约 ₹29/500g；Business 套餐（₹199/月）降至约
              ₹26/500g；Advanced 套餐（₹499/月，50–200 单）约 ₹23/500g；Pro 套餐（₹799/月，3,000–10,000 单）为
              ₹20/500g。这些是标价；实际单票收入会随分配的快递伙伴、重量档、配送区域、货到付款附加费，以及适用的促销返现和激励变化。DRHP 将 Contribution Margin 定义为收入减去 Merchant
              Solutions 成本、通信成本、支付网关费用、促销返现、效果营销、履约中心成本和仓库员工薪酬；这是公开披露中最接近单位经济性的指标，但可获得的公开 UDRHP 摘录没有给出分期精确值。Emerging
              Business 各分部定价各不相同，且未公开发布：ShiprocketX 跨境价格按询价确定；Engage360 和 Checkout 是 SaaS 订阅模式；Shiprocket Capital 赚取转介费和
              FLDG 费用。Power Merchant 分部定义为月均超过 100 笔唯一交易的商户，是收入最高的 cohort。Power Merchant ARPU 从 FY24 每商户 ₹1.44 crore 压缩至
              FY25 ₹0.88 crore（下降 39%），公司部分归因于 Pickrr 低费率业务量并入和 cohort 构成变化；H1 FY26 小幅回升至 ₹0.94
              crore。缺少按套餐层级、快递商和地域拆分的实际定价表，是尽调缺口，无法把披露标价和报告收入交叉验证。
