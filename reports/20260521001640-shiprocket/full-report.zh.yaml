      - number: '3.4'
        title: 切换成本、锁定与分发能力
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 对商户的主要锁定机制是技术和分析，而不是合同。平台的多承运商面单自动化、COD 对账工作流、marketplace API
              集成（Shopify、WooCommerce、Magento、Amazon、Flipkart、Meesho）以及 ERP/WMS 连接器，每一项都需要定制实施。商户迁移到 NimbusPost 或
              ClickPost，必须重新实施这些集成、重新培训员工，并接受一段并行运行期，在此期间两个系统都要维护——现实切换成本是数周工程投入和运营中断。对拥有五个以上活跃销售渠道的商户，这一成本很重要。


              分析锁定是第二个且正在增强的机制。Shiprocket 的 RADAR 系统积累了 pin-code 级配送表现数据、承运商 RTO 率，以及与每个商户产品组合和客户地理分布相关的 NDR
              成功模式。这一历史基线无法迁移，必须在新平台从零重建，意味着迁移后 3-6 个月 RTO 率更高、承运商分配决策更差。对 RTO 率直接影响营运资金和客户生命周期价值的 D2C 品牌，这是有意义的壁垒。


              多归属风险在微型商户和免费增值层最高，因为低切换摩擦让商户能以很低成本并行测试 NimbusPost 或 ClickPost。企业账户（每月运输支出超过 Rs 5 lakh）有深度 ERP
              集成，切换摩擦明显更高，也是最可防守的群体。ClickPost 与 Shiprocket 的竞争边界恰在企业细分，ClickPost 更强的分析和 SLA 管理能力吸引已经超出 Shiprocket
              通用型工具能力的商户。


              当前分发能力集中在 Shiprocket 一侧：400K+ 已入驻商户形成直接聚合商同行无法接近的市场位置。Unicommerce 的 OMS 平台（FY26 Rs 204 crore）通过让商户经由
              Unicommerce 的 ShipSense AI 而非 Shiprocket 仪表盘集成物流分配，形成间接渠道竞争，削弱 Shiprocket 作为单一物流控制平面的角色。Amazon ASCS 对同时也是
              Amazon marketplace 卖家的商户构成最结构性的替代威胁：其 Amazon 渠道物流可以在 Amazon 生态内端到端处理，减少流经聚合商的商户总件量份额。
            claimRefs:
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
