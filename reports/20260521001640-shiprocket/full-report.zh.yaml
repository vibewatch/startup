      - number: '7.4'
        title: 财务模型与信用风险
        blocks:
          - type: paragraph
            body: >
              Shiprocket 的财务风险画像由四个因素叠加决定：持续净亏损、经营现金流为负、高商誉 / 资产比，以及 FLDG 贷款带来的信用敞口。亏损方面，公司报告 FY25 重述净亏损 ₹744.49
              million，FY24 为 ₹5,951.81 million，FY23 为 ₹3,593.08 million。FY25 改善（亏损减少
              87.5%）主要来自成本重组和收购商誉费用下降，而不是核心经营经济性出现阶跃变化。FY25 收入为 ₹16,323 million；若按 pre-IPO 二级交易倍数隐含的约 ₹24,000–27,000
              crore IPO 估值，公司通往盈利需要收入继续增长且增量成本较低。经营现金流 FY24 为负 ₹2,159.92 million，FY23 为负 ₹1,379.57 million；DRHP 中 FY25
              经营现金流数据暗示在 IPO 募资前自由现金流仍为负。这意味着 Shiprocket 仍依赖外部融资——股权，也可能包括债务——来支持运营，IPO 募集资金和任何 post-IPO 融资都对其运营计划至关重要。受
              RBI Digital Lending Directions 2025 约束，FLDG-backed credit pilot 总敞口上限为 ₹200 million，且每个未偿贷款组合限额
              5%；这限制了金融服务收入线的近期上行空间，也封顶了信用损失敞口。商誉占总资产 44.62%（FY25），反映收购驱动的增长策略；FY24 的 ₹1,246.41 million Omuni 和 ₹521.01
              million Wigzo 减值先例确认，一旦被收购实体表现不佳，资产负债表后果会很重。任何进一步减值都会直接增加报告亏损，并可能触发债务 covenants 或投资人担忧。营运资本管理——尤其 COD 回款
              float 和商户预付款——提供自然抵消，但不足以覆盖当前规模下的经营亏损。上述因素叠加意味着，任何收入增长不及预期、宏观驱动的商户支出放缓，或快递提价，都可能实质推迟盈亏平衡，并在拟议 IPO
              价格上形成估值风险。
