  evidenceGaps:
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "segment-gross-margins"
      missingEvidence: "Gross margin (revenue minus direct COGS) by segment — core domestic shipping vs. each emerging sub-segment (ShiprocketX, Engage360, Checkout, Omuni, Cargo, Capital) — for FY23–FY25"
      whyItMatters: "Required to verify whether the 12% core EBITDA margin is structural vs. mix-driven; without segment gross margins, the SaaS premium vs. logistics discount cannot be first-principles modelled and the 6.2x EV/Revenue multiple cannot be validated from unit economics"
      diligencePath: "CFO management accounts to gross profit line by segment; compare Unicommerce's published SaaS gross margin (16.3% EBITDA, implied gross margin ~58%) as proxy for Shiprocket's SaaS layer"
      relatedQuestionRefs: [QV024, QV032]
      relatedTableRefs: [TV006]

    - type: "private-evidence-only"
      severity: "material"
      topic: "acquisition-impairment-track-record"
      missingEvidence: "Residual goodwill and intangible carrying values from all remaining acquisitions (Glaucus, Pickrr portfolio, other entities) after FY25 write-downs of ₹176.7 crore; auditor recoverable-value assessments"
      whyItMatters: "₹176.7 crore of impairments on Omuni and Wigzo/Swiftly in FY25 alone signals that prior acquisitions did not deliver modelled returns; further impairments from the remaining portfolio would reduce book net worth and affect IPO pricing anchor"
      diligencePath: "Audited goodwill and intangibles schedule by acquisition entity from FY25 annual accounts; auditor-signed recoverable-value note for each remaining entity; disclosed in UDRHP but specific carrying values not publicly available"
      relatedQuestionRefs: [QV026]
      relatedTableRefs: [TV006]

    - type: "private-evidence-only"
      severity: "material"
      topic: "operating-cashflow-vs-cash-ebitda"
      missingEvidence: "FY25 operating cash flow and free cash flow — cash EBITDA ≠ operating cash flow due to working capital movements, lease payments (IFRS 16 repayments), and capex; the gap quantifies actual liquidity vs. accounting measure"
      whyItMatters: "The ₹7 crore cash EBITDA may overstate liquidity if working capital absorbs cash or lease obligations are material; understanding true FCF is required before ascribing recurring cash-flow value to the platform"
      diligencePath: "Audited cash flow statement from FY25 MCA annual accounts; accounts receivable and payable ageing schedule; IFRS 16 lease payment schedule"
      relatedQuestionRefs: [QV033]
      relatedTableRefs: [TV006]

    - type: "private-evidence-only"
      severity: "material"
      topic: "power-arpu-root-cause"
      missingEvidence: "Attribution of Power Merchant ARPU decline from ₹1.44 crore (FY24) to ₹0.88 crore (FY25): pricing concessions vs. cohort composition change post-Pickrr integration vs. volume contraction at top merchants"
      whyItMatters: "39% ARPU compression at the highest-value cohort is the most adverse unit-economics signal; if rate-driven, the compression may recur and invalidate the SaaS premium thesis; if Pickrr-mix-driven, it may be a one-time integration effect"
      diligencePath: "Merchant-level revenue breakdown pre/post Pickrr integration from CFO; pricing action log; Power Merchant count evolution FY23–H1 FY26"
      relatedQuestionRefs: [QV034]
      relatedTableRefs: [TV006]

    - type: "private-evidence-only"
      severity: "moderate"
      topic: "comparable-m&a-and-secondary-marks"
      missingEvidence: "M&A transaction comparables for India logistics-SaaS or e-commerce enablement platforms; secondary market transaction marks for Shiprocket shares pre-IPO; comparable set in TV004 is limited to public equities and global benchmarks due to absence of M&A data"
      whyItMatters: "M&A comps and secondary marks would provide additional valuation anchors beyond public-equity multiples; their absence means TV004's comparable set is partial by necessity, not comprehensive"
      diligencePath: "PitchBook M&A transaction search for India logistics-SaaS and e-commerce enablement deals 2022–2026; secondary market brokers for pre-IPO Shiprocket shares if available"
      relatedQuestionRefs: [QV024]
      relatedTableRefs: [TV004]

