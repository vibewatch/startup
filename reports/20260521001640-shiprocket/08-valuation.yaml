sections:
  - id: "private-valuation-context"
    title: "Private Valuation Context, Entry Discipline, and IPO Structure"
    body: >
      Shiprocket's last disclosed private valuation mark is $1.21 billion, established through the
      December 2024 Series E-III extension round in which ₹219 crore ($26 million) was raised from
      Koch Strategic Platforms, MUFG Innovation Partners, KDT Ventures (lead, ₹124.5 crore), Tribe
      Capital, and Huddle Ventures. SEBI CCPS allotment filings confirmed the round at ₹43,394 per
      share, which Fintrackr/Entrackr estimated implies a post-allotment valuation of approximately
      $1.21 billion. One independent aggregator (Affluense.ai) cites a lower figure of approximately
      $1.1 billion for the same round, creating a $110 million uncertainty band in the private mark.
      The company's peak valuation was approximately $1.3 billion at the August 2022 Series E (TCV-led,
      $33.5 million), suggesting the December 2024 round represents a flat-to-marginal markdown from
      peak rather than a step-up, a material signal for late-stage entry discipline. Total cumulative
      funding exceeds $320 million across nine rounds.

      The SEBI-approved IPO targets total proceeds of ₹2,342.35 crore: a fresh issue of ₹1,100 crore
      and an OFS of ₹1,242.35 crore from existing shareholders (Koch, MUFG, TCV, Tribe, and others).
      The OFS quantum is larger than the fresh issue, signalling meaningful insider monetisation at
      listing. A pre-IPO placement of up to ₹220 crore can reduce the fresh issue if exercised before
      the price band is set. No price band has been announced as of May 2026; market consensus points
      to an implied market cap of ₹10,000–14,000 crore and listing in H1 FY27. Fresh issue proceeds
      are allocated: ₹294 crore marketing/merchant acquisition, ₹211 crore technology, ₹211 crore
      debt repayment, and the balance for acquisitions and general corporate purposes. Revenue
      decelerated to 15% in H1 FY26 from 24% in FY25, reducing the near-term cash flow support
      for the entry multiple; whether the deceleration is cyclical or structural is the key underwriting
      question for this IPO.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016, CV017, CV023]
    tableRefs: [TV001, TV003]
    figureRefs: [FV003]

  - id: "comparable-analysis"
    title: "Comparable Valuation Analysis — Public Companies, Private Rounds, and Global Benchmarks"
    body: >
      The comparable set spans three layers: Indian public-market logistics-tech (Delhivery), Indian
      public-market e-commerce SaaS (Unicommerce), and global private/public SaaS medians. Each
      comparator has material structural differences from Shiprocket's hybrid logistics-SaaS model,
      requiring a blended multiple approach rather than single-peer anchoring.

      Delhivery (NSE: DELHIVERY) is the most direct listed peer by segment (e-commerce logistics,
      India, API-led). As of May 2026, Delhivery trades at an EV/FY25 Sales multiple of 3.21x on a
      ₹34,200 crore market cap (₹8,932 crore FY25 revenue). Its FY25 EBITDA of ₹376 crore implies
      a 4.2% EBITDA margin and a 52x EV/EBITDA multiple; the company turned consolidated PAT-positive
      at ₹162 crore in FY25 for the first time. Delhivery operates at approximately 5x Shiprocket's
      revenue scale and has a pure-logistics (no merchant SaaS) business model, which structurally
      limits its achievable multiple versus a SaaS-heavy comparable. Shiprocket's $1.21 billion private
      mark at 6.2x FY25 revenue commands a 93% premium to Delhivery's 3.21x, requiring the market
      to price the SaaS layer at a substantial premium above logistics economics.

      Unicommerce (NSE: UNIECOM) provides the SaaS-layer multiple reference. Unicommerce trades at
      4.45x EV/Revenue and 25.7x EV/EBITDA on a ₹958 crore market cap, with FY26 revenue of ₹204
      crore and a 16.3% EBITDA margin. Unicommerce's stock declined approximately 38% in the 12
      months preceding May 2026, signalling India SaaS multiple compression, not expansion. The gap
      between Unicommerce's 4.45x and Shiprocket's 6.2x implies the market must price Shiprocket's
      superior scale, growth rate, and retention metrics at a 39% premium to a pure-SaaS peer —
      or view the logistics volume as incremental revenue quality.

      Nykaa (NSE: NYKAA), a consumer-tech D2C enablement platform, trades at approximately 8x
      EV/Revenue, providing the upper bound for India consumer-tech re-rating. Zomato and other
      Indian new-age tech platforms trade at 7–10x EV/Revenue. Shiprocket's 6.2x falls in the
      lower half of this India premium band, supportive of the valuation if growth re-accelerates.

      Global private SaaS median EV/Revenue was approximately 4.8x in 2025, and public SaaS
      median approximately 6x, representing the floor and ceiling of the software-comparable band.
      Shiprocket's 6.2x sits in line with the global public SaaS median despite being private,
      reflecting the Indian IPO premium expectation but leaving limited upside from pure SaaS
      re-rating unless NRR exceeds 110% and the emerging segment reaches profitability.
    claimRefs: [CV028, CV029, CV030, CV031, CV032, CV033, CV034, CV035, CV036, CV037, CV038, CV039]
    tableRefs: [TV004]
    figureRefs: [FV002]

  - id: "investment-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: >
      The positive thesis for Shiprocket rests on platform leadership, financial inflection, and
      cohort compounding. Shiprocket is India's largest new-age horizontal e-commerce enablement
      platform by revenue per the Redseer report, serving 400,000+ onboarded merchants with 4 lakh
      merchant coverage and enabling $3 billion in annualised GMV, representing 4.5–5% of India's
      e-commerce volume. The platform's consumption-based wallet model creates recurring revenue
      driven by merchant GMV, not contract renewals, delivering a 103.51% core NRR in FY25 — up
      from 96.27% in FY24. The FY2018 cohort's 20.93x transaction compounding by Year 7 (FY25)
      demonstrates the platform's ability to grow with merchants over time, supporting a SaaS-like
      recurring cash flow narrative. FY25 marked the first year of cash EBITDA positivity (₹7 crore)
      and a core adjusted EBITDA of ₹157 crore at a 12% margin on core revenue.

      The anti-thesis is anchored in valuation premium and execution gaps. At 6.2x FY25 revenue,
      Shiprocket carries a 93% EV/Sales premium to Delhivery and a 39% premium to Unicommerce —
      premia that can only hold if the SaaS re-rating narrative is validated by accelerating NRR
      and emerging-segment profitability. The FY24 net loss of ₹595 crore (driven by ₹244 crore
      restructuring, ₹192 crore ESOP, and emerging-segment investment) and ₹176.7 crore of
      FY25 exceptional impairments on Omuni (₹124.6 crore) and Wigzo/Swiftly (₹52.1 crore)
      acquisitions demonstrate that inorganic growth has produced write-downs rather than
      incremental EBITDA. Power Merchant ARPU fell 39% in FY25 (₹1.44 → ₹0.88 crore) before
      partially recovering; its root cause has not been publicly disclosed. Revenue growth
      decelerated to 15% in H1 FY26, reducing the forward growth support for the current multiple.
      The OFS quantum of ₹1,242 crore signals that existing investors are seeking partial
      liquidity at listing, creating near-term selling pressure.
    claimRefs: [CV019, CV020, CV025, CV026, CV027, CV040, CV041, CV042, CV043, CV044, CV045, CV046, CV047]
    tableRefs: [TV002]
    figureRefs: []

  - id: "ipo-exit-readiness"
    title: "IPO Exit Readiness, Diligence Asks, and Thesis-Break Triggers"
    body: >
      Shiprocket's IPO path is procedurally clear: SEBI granted approval on October 31, 2025, and
      the Updated Draft Red Herring Prospectus was filed on December 12, 2025. The company targets
      a book-built offering with no price band announced as of May 2026. The IPO mechanism is a
      100% book-built offer; the pre-IPO placement of up to ₹220 crore reduces the fresh issue if
      exercised. Proceeds of ₹294 crore earmarked for marketing and merchant acquisition represent
      the largest single use of funds and the most diligence-sensitive allocation, as no CAC or
      payback metric has been publicly disclosed to assess ROI. Debt repayment of ₹211 crore
      would reduce the ₹233.8 crore borrowings outstanding as of September 2025, improving
      leverage but not altering cash generation.

      The most critical outstanding diligence asks are: (1) segment gross margin by core vs.
      emerging sub-segments — without which the structural profitability path cannot be modelled;
      (2) realised ASP per shipment net of cashbacks, bridging list pricing to reported revenue;
      (3) CAC and payback by channel, validating the ₹294 crore marketing allocation; (4) FLDG
      utilisation under the ₹200 million cap for Shiprocket Capital; and (5) residual acquisition
      goodwill carrying values following the FY25 impairments. Absent these five data sets, the
      6.2x FY25 revenue multiple cannot be verified from a first-principles unit-economics model.

      Thesis-break triggers: NRR retreating below 100% for two consecutive periods would signal
      net merchant churn and eliminate the SaaS premium; Power ARPU failing to reach ₹0.95+ crore
      by FY26E would confirm revenue concentration weakness; IPO market cap below ₹8,000 crore
      at price band implies a negative return vs. last round; Delhivery crossing 200,000 SME
      merchants would constitute structural market-share threat; and additional acquisition
      impairments exceeding ₹100 crore would confirm capital-allocation risk.
    claimRefs: [CV005, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016, CV022]
    tableRefs: [TV005, TV006]
    figureRefs: []

  - id: "recommendation"
    title: "Recommendation: TRACK — IPO Listing Is the Risk-Adjusted Entry Point"
    body: >
      On the evidence available as of May 2026, Shiprocket warrants a TRACK recommendation with
      a HIGH risk rating and STRETCHED valuation stance. The company's platform leadership,
      NRR recovery, and IPO approval provide a clear liquidity event horizon. However, the
      6.2x FY25 revenue private multiple — 93% above Delhivery and above the global private
      SaaS median of 4.8x — requires near-perfect execution on three simultaneously: NRR must
      re-accelerate above 105%, the emerging segment (20% of revenue) must reach EBITDA
      breakeven, and revenue growth must recover from 15% in H1 FY26 to 20%+ in FY27.
      The presence of a large OFS (₹1,242 crore) and two consecutive acquisition impairments
      signal that insider confidence in the current private mark may be partially qualified.

      Private entry at $1.21 billion should be evaluated against IPO pricing: if the price
      band implies a market cap above ₹12,000 crore (>6x FY27E revenue), the private mark
      is attractive on a relative basis; if the band implies ₹8,000–11,000 crore, it is
      roughly in line; and below ₹8,000 crore would imply a markdown. The base case targets
      approximately ₹11,000 crore market cap (5x FY27E ₹2,200 crore revenue), representing
      a 2–3x return on last private round capital over a 12–18 month IPO horizon. The bear
      case at 3x FY27 revenue implies ₹5,700 crore — a capital loss. Conviction is medium
      on the platform and low on the valuation at current multiple. The thesis is conditioned
      on receipt of segment gross margin and CAC disclosures before final underwriting.
    claimRefs: [CV017, CV018, CV021, CV023, CV024, CV038, CV039, CV040, CV041, CV042, CV043, CV044, CV045]
    tableRefs: []
    figureRefs: [FV001, FV004]

