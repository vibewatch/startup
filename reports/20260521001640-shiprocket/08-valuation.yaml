      available in the public UDRHP or third-party sources. These constitute the minimum due-diligence
      requirements before underwriting the 6.2x FY25 revenue multiple at private entry or IPO allocation.
    claimRefs: [CV011, CV012, CV020, CV021, CV022, CV027, CV044]

figures:
  - id: "FV001"
    title: "Recommendation logic"
    type: flow
    summary: >
      The recommendation chain from Shiprocket's evidence base (scale, financial proof, risks, valuation)
      to the TRACK recommendation, identifying which signals drive conviction and which constrain it.
    claimRefs: [CV019, CV025, CV038, CV043, CV044, CV045]
    data:
      nodes:
        - id: "scale"
          label: "Scale: India's #1 new-age e-commerce platform; 4L+ merchants; $3B GMV; 220+ countries"
          detail: "Largest new-age horizontal platform by revenue per Redseer; 15% H1 FY26 growth"
          claimRefs: [CV047]
        - id: "proof"
          label: "Proof: Cash EBITDA positive FY25; core adj. EBITDA ₹157 crore (12%); NRR 103.51%"
          detail: "First cash EBITDA positive year; NRR recovering from 96.27% FY24 trough"
          claimRefs: [CV019, CV020, CV025]
        - id: "risks"
          label: "Risks: NRR below FY23 peak; Power ARPU down 39%; ₹176.7 crore acquisition impairments; OFS pressure"
          detail: "Revenue decelerated to 15% H1 FY26 from 24% FY25; emerging EBITDA not disclosed"
          claimRefs: [CV021, CV027, CV046]
        - id: "valuation"
          label: "Valuation: $1.21B / 6.2x FY25 revenue — 93% premium to Delhivery; ~in-line with public SaaS median (6x)"
          detail: "STRETCHED stance; justifiable only on SaaS re-rating + NRR >105% + emerging breakeven"
          claimRefs: [CV028, CV038, CV039]
        - id: "ipo"
          label: "IPO: SEBI approved; UDRHP filed Dec 2025; H1 FY27 expected listing; definitive liquidity event"
          detail: "₹2,342 crore total; ₹1,242 crore OFS implies insider monetisation at listing"
          claimRefs: [CV005, CV009]
        - id: "recommendation"
          label: "Recommendation: TRACK — IPO listing is the risk-adjusted entry; private mark stretched at 6.2x"
          detail: "Risk: HIGH; Stance: STRETCHED; Base-case return 2–3x on IPO horizon"
          claimRefs: [CV043]
      edges:
        - from: "scale"
          to: "recommendation"
          label: "supports"
        - from: "proof"
          to: "recommendation"
          label: "supports"
        - from: "risks"
          to: "recommendation"
          label: "constrains"
        - from: "valuation"
          to: "recommendation"
          label: "conditions"
        - from: "ipo"
          to: "recommendation"
          label: "enables exit"

  - id: "FV002"
    title: "Valuation sensitivity"
    type: bar
    summary: >
      EV/Revenue multiples across comparable companies and Shiprocket's current private mark,
      illustrating the premium Shiprocket carries relative to public peers and global benchmarks.
    claimRefs: [CV028, CV032, CV035, CV036, CV038]
    data:
      items:
        - label: "Delhivery (NSE, FY25)"
          value: 3.21
          note: "Public Indian logistics-tech; ₹34,200 crore market cap"
        - label: "Global Private SaaS Median (2025)"
          value: 4.8
          note: "Ful.io 2025 analysis; US/EU weighted"
        - label: "Unicommerce (NSE, FY26)"
          value: 4.45
          note: "Public Indian e-commerce SaaS; ₹958 crore market cap"
        - label: "Shiprocket @ $1.21B / FY25 Revenue"
          value: 6.17
          note: "Private mark Dec 2024; ₹1,632 crore FY25 revenue; exchange rate 83 INR/USD"
        - label: "Public SaaS Median (2025)"
          value: 6.0
          note: "Global public SaaS median; reference ceiling"
        - label: "Nykaa EV/Revenue (est.)"
          value: 8.0
          note: "India consumer-tech ceiling; estimate from public market data"
    approximationNotes: >
      Nykaa multiple is estimated from public market data as of May 2026.
      Shiprocket value uses Fintrackr/Entrackr $1.21B estimate at 83 INR/USD.
      All public multiples as of May 2026 from StockAnalysis.com and Multiples.vc.

  - id: "FV003"
    title: "Valuation / return range"
    type: range
    summary: >
      Bull, base, and bear case implied market cap ranges at IPO listing (H1 FY27 target),
      with assumptions on FY27 revenue and applicable EV/Revenue multiple.
    claimRefs: [CV040, CV041, CV042]
    data:
      items:
        - label: "Bear case — multiple compression to 3x (logistics re-rating, revenue deceleration)"
          low: 5000
          high: 6500
          note: "FY27E revenue ₹1,900 crore at 3.0x EV/Revenue; assumes NRR < 100% and revenue growth < 15%"
        - label: "Base case — 5x FY27E revenue with partial SaaS premium"
          low: 9500
          high: 12000
          note: "FY27E revenue ₹2,200 crore at 5.0x EV/Revenue; NRR 103–106%; revenue growth 18–20%"
        - label: "Bull case — 6.5x FY27E revenue on SaaS re-rating (NRR >110%, emerging breakeven)"
          low: 14000
          high: 17000
          note: "FY27E revenue ₹2,500 crore at 6.5x EV/Revenue; assumes NRR re-acceleration and emerging EBITDA positive"
    approximationNotes: >
      All values in ₹ crore. Ranges represent indicative market cap (not EV) estimates.
      Revenue projections are analyst estimates based on public FY25 and H1 FY26 actuals with no
      company guidance. Multiple assumptions derived from comparable set analysis.

  - id: "FV004"
    title: "Investment KPIs"
    type: kpi
    summary: >
