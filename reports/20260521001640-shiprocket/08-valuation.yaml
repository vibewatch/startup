          note: "Core EBITDA ₹157 crore (12%); emerging EBITDA-negative; Power ARPU compressed but recovering; gaps in segment margins"
        - label: "Risk Profile"
          value: "★★☆☆☆ (2/5)"
          note: "Acquisition impairments ₹176.7 crore; NRR below FY23 peak; OFS signal; revenue deceleration; FLDG contingent"
        - label: "Valuation attractiveness score"
