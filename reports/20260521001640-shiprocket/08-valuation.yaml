company:
  name: "Shiprocket"
chapter:
  number: 8
  title: "Valuation"
  summary: >
    Shiprocket carries a last-known private valuation of $1.21 billion (approximately ₹10,075 crore at
    83 INR/USD), set via the December 2024 Series E-III extension — implying 6.2x FY25 reported revenue
    of ₹1,632 crore and approximately 64x core adjusted EBITDA of ₹157 crore. This represents a 93%
    premium to Delhivery's public market EV/Sales of 3.21x and a 39% premium to Unicommerce's 4.45x,
    requiring a durable SaaS re-rating narrative rather than a logistics-only multiple to hold at IPO.
    The SEBI-approved IPO (October 31, 2025; UDRHP December 12, 2025) targets total proceeds of
    ₹2,342 crore (₹1,100 crore fresh, ₹1,242 crore OFS), providing the first definitive liquidity event
    for late-stage private investors after approximately $320M+ in total funding across eight years.
    The investment thesis rests on three pillars: India's largest new-age horizontal e-commerce platform
    by revenue (Redseer), a cash EBITDA inflection in FY25 with NRR recovering to 103.51%, and cohort
    stickiness evidenced by the FY2018 merchant cohort compounding 20.93x by Year 7. The anti-thesis
    centres on the 6.2x multiple premium that can only hold if NRR re-accelerates above 105%, the emerging
    segment (₹326 crore, 20% of revenue) reaches EBITDA breakeven, and IPO pricing is not marked down
    from last round. Revenue growth decelerated to 15% in H1 FY26 from 24% in FY25, Power Merchant ARPU
    compressed 39% in FY25 before partially recovering, and ₹176.7 crore in acquisition impairments
    (Omuni, Wigzo) in FY25 signal that inorganic capital has not yet produced incremental EBITDA. The base
    case targets ~₹11,000 crore market cap at IPO (FY27E ₹2,200 crore revenue at 5x), implying a 2–3x
    return on the last private round mark; the bear case implies a capital loss. Recommendation: TRACK —
    monitor IPO price band announcement before committing; private entry at $1.21B is stretched; IPO
    listing is the risk-adjusted entry point. Risk rating: HIGH. Valuation stance: STRETCHED.

