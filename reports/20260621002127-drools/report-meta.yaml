companyProfile:
  summary: Drools is India's best-known homegrown premium pet food brand, selling dry food, wet food, treats, and now fresh pet food through national retail, specialty pet channels, e-commerce, and exports. The company has strategic backing from L Catterton and Nestlé, meaningful domestic manufacturing scale, and strong category-tailwind exposure, but still discloses less about economics and governance than its unicorn valuation would ideally warrant.
  headquarters: Delhi, India
  productSummary: Premium dry food, wet food, treats, and fresh pet food for dogs and cats sold through 40,000+ outlets, specialty retail, and e-commerce.
  customerFocus: Indian urban pet owners, value-conscious mass households, and premium upgraders seeking packaged nutrition for dogs and cats.
  businessModel: Consumer packaged goods business monetizing branded pet nutrition through retail, specialty pet channels, e-commerce, and exports.
