sections:
- id: identity-disambiguation-and-footprint
  title: Identity, Disambiguation, And Footprint
  body: 'Drools is a scaled Indian pet food brand with unicorn status confirmed by Nestlé’s 2025 minority stake, but public disclosure still lags the company’s strategic importance. This section focuses on identity, disambiguation, and footprint. Reviewed public sources consistently show that Drools has enough scale and strategic relevance to justify serious diligence, but they also preserve meaningful blind spots that matter for underwriting. The evidence base combines official materials, filings-style company profiles, retailer surfaces, market reports, and at least one adverse source where required. That mix is useful because it prevents the chapter from becoming pure marketing summary or pure skepticism. The strongest facts are real, the contradictions should be preserved rather than smoothed away, and the remaining gaps are large enough to affect recommendation confidence. This section uses local claims and chapter-specific exhibits to keep the analysis self-contained and avoid cross-chapter
    ID leakage. Investors should therefore treat the chapter as evidence-led but intentionally conservative: where facts are well supported, the prose states them directly; where the public file is thin, the analysis preserves that uncertainty instead of smoothing it away. That discipline matters because Drools is already important enough that small disclosure gaps can change underwriting outcomes.'
