companyProfile:
  summary: >-
    Drools is India's best-known homegrown premium pet food brand, selling dry food, wet food, treats, and now fresh pet
    food through national retail, specialty pet channels, e-commerce, and exports. The company has strategic backing
    from L Catterton and Nestlé, meaningful domestic manufacturing scale, and strong category-tailwind exposure, but
    still discloses less about economics and governance than its unicorn valuation would ideally warrant.
  headquarters: Delhi, India
  productSummary: >-
    Premium dry food, wet food, treats, and fresh pet food for dogs and cats sold through 40,000+ outlets, specialty
    retail, and e-commerce.
  customerFocus: >-
    Indian urban pet owners, value-conscious mass households, and premium upgraders seeking packaged nutrition for dogs
    and cats.
  businessModel: >-
    Consumer packaged goods business monetizing branded pet nutrition through retail, specialty pet channels,
    e-commerce, and exports.
  stage: Growth / strategic minority investment stage
  disclosureProfile: private-undisclosed
  claimRefs:
    - CO001
    - CO017
    - CO024
    - CO025
    - CE001
    - CE011
  foundedDate: '2009-01-01'
  founders:
    - name: Fahim Sultan Ali
      role: Founder
      background: Public company-profile and media sources consistently identify him as the founder and promoter behind Drools.
      claimRefs:
        - CO008
  foundingLocation: Rajnandgaon, Chhattisgarh, India
  fundingStatus: >-
    Raised $60M from L Catterton in 2023 and added a minority strategic investment from Nestlé in 2025 at a unicorn
    valuation.
