sections:
- id: market-boundary-and-status-quo-substitut
  title: Market Boundary And Status-Quo Substitutes
  body: 'India’s pet-food market is growing fast but still under-penetrated, giving Drools a favorable backdrop without eliminating range uncertainty around TAM and premium adoption. This section focuses on market boundary and status-quo substitutes. Reviewed public sources consistently show that Drools has enough scale and strategic relevance to justify serious diligence, but they also preserve meaningful blind spots that matter for underwriting. The evidence base combines official materials, filings-style company profiles, retailer surfaces, market reports, and at least one adverse source where required. That mix is useful because it prevents the chapter from becoming pure marketing summary or pure skepticism. The strongest facts are real, the contradictions should be preserved rather than smoothed away, and the remaining gaps are large enough to affect recommendation confidence. This section uses local claims and chapter-specific exhibits to keep the analysis self-contained and avoid
    cross-chapter ID leakage. Investors should therefore treat the chapter as evidence-led but intentionally conservative: where facts are well supported, the prose states them directly; where the public file is thin, the analysis preserves that uncertainty instead of smoothing it away. That discipline matters because Drools is already important enough that small disclosure gaps can change underwriting outcomes.'
