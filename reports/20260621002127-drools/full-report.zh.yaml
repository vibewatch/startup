    - CO017
    - CO024
    - CO025
    - CE001
    - CE011
  foundedDate: '2009-01-01'
  founders:
    - name: Fahim Sultan Ali
      role: 创始人
      background: 公开公司资料和媒体来源一致将其认定为 Drools 背后的创始人兼发起人。
      claimRefs:
        - CO008
  foundingLocation: Rajnandgaon, Chhattisgarh, India
  fundingStatus: 2023 年从 L Catterton 融资 $60M，2025 年又引入 Nestlé 少数股战略投资，估值达到独角兽水平。
