companyProfile:
  summary: >-
    Drools 是印度最知名的本土高端宠物食品品牌，销售干粮、湿粮、零食，如今也做鲜食宠物食品，渠道覆盖全国零售、宠物专门渠道、电商和出口。公司背后有 L Catterton 和 Nestlé
    的战略支持，国内制造规模可观，也吃到强品类顺风；但围绕经济性和治理的披露，仍低于其独角兽估值应有的透明度。
  headquarters: Delhi, India
  productSummary: 面向犬猫的高端干粮、湿粮、零食和鲜食宠物食品，经由 40,000+ 个网点、专门零售和电商销售。
  customerFocus: 印度城市宠物主人、看重性价比的大众家庭，以及为犬猫寻找包装营养食品的高端升级用户。
  businessModel: 消费品业务，靠零售、宠物专门渠道、电商和出口销售品牌宠物营养产品变现。
  stage: Growth / strategic minority investment stage
  disclosureProfile: private-undisclosed
