chapter:
  number: 6
  title: "Customers"
  summary: "Grafana Labs reports more than 10,000 customers and materially deeper multi-product use, but the assigned evidence is predominantly company-issued and does not disclose NRR, GRR, churn, contract duration, or customer concentration. Named customer statements indicate operational use at TeleTracking, Deutsche Telekom, and BlackRock, while independent validation of deployment durability remains limited."
sections:
  - id: "customer-segments-and-adoption-surfaces"
    title: "Customer segments and adoption surfaces"
    body: >-
      The public metrics describe overlapping populations rather than a clean customer funnel. A
      March 2026 company release cited more than 25 million users and 7,000-plus customers, while
      the August 2026 company release said the customer count had crossed 10,000. The latter also
      reported about 66,000 monthly active self-serve organizations and more than 18,000
      organizations using Grafana Assistant across paid and free plans. These figures distinguish
      community reach, customer relationships, self-serve activity, and feature adoption, but they
      cannot be added or divided because overlap, payer status, and contracted-customer
      denominators are not disclosed. AWS Marketplace, credits, and migration support add a
      channel-assisted procurement route whose booking contribution is also undisclosed.
    claimRefs:
      - "CU001"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU015"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-and-account-expansion"
    title: "Adoption and account expansion"
    body: >-
      Company-reported usage and product-density metrics point to both a broader cloud footprint
      and deeper contracted-account adoption. Monthly active Grafana Cloud users rose from roughly
      127,000 to more than 251,000 over two years, and monthly active self-serve organizations rose
      from about 42,000 to 66,000 over the same period. Within the separately described contracted
      customer population, average products used increased from 2.3 to 4.4; 87.8% used at least two
      products and 64.9% used at least four. These are strong expansion signals, but they are not
      retention rates. The release gives no starting cohort, revenue weighting, churn, renewal,
      contract-length, or paid-conversion denominator, so the metrics do not establish NRR, GRR,
      or durable unit economics.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
  - id: "named-customer-proof"
    title: "Named customer proof"
    body: >-
      The strongest named proof in the assigned pool consists of customer quotations carried in
      company-issued or company-controlled material. TeleTracking's engineering director described
      centralized visibility across AWS-native resources and proprietary services and said the
      integration significantly reduced mean time to resolution, but supplied no baseline or
      measured reduction. Deutsche Telekom representatives said an AI-powered situation room kept
      millions of viewers online with zero downtime during a backup-infrastructure failure and
      reduced dashboard-building time from four months to one day. BlackRock's Head of
      Observability described more information, connectivity, and value, but gave no quantified
      result. These statements indicate operational relevance; none supplies contract value,
      renewal history, independent audit evidence, or a complete production-scope description.
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU003"
  - id: "durability-concentration-and-evidence-quality"
    title: "Durability, concentration, and evidence quality"
    body: >-
      Public evidence supports a land-and-expand thesis but not its durability. The multi-product
      metrics show breadth inside contracted accounts, while the AWS agreement can reduce adoption
      friction through credits, Marketplace transactions, and migration programs. Neither source
      reports renewal rates, cohort survival, top-customer share, bookings influenced by AWS, or
      channel economics. A low-reputation editorial section on a company job-repost page argues
      that open-source commoditization and competitor bundling could pressure pricing power; this
      is an adverse hypothesis, not an independent benchmark or observed churn evidence. The
      assigned pool contains no direct customer complaints, failed deployments, procurement
      records, or independently measured retention study. Investment diligence therefore needs
      customer-level cohorts, concentration schedules, and reference calls before treating product
      density as proof of defensibility.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU015"
      - "CU016"
