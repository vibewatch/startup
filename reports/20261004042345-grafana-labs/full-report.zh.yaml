chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与运营模式
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs 的法定注册实体为 Raintank Inc.（以 Grafana Labs 名义经营），是一家后期阶段的开发者基础设施与可观测性软件供应商，由 Raj Dutt、Torkel
              Ödegaard 和 Anthony Woods 于 2014 年创立 [CO001, CO002]。公司总部位于纽约，但采用 100% 远程优先模式，约有 1,400 至 1,500+ 名员工，分布在 40
              多个国家；其产品已成为基础设施遥测的默认可视化界面 [CO001, CO002, CO003]。商业模式建立在广泛的开源采用之上——Grafana OSS 用户估计为 25M 至 35M——并通过全托管
              Grafana Cloud 服务、企业自托管订阅和工作流自动化套件实现变现 [CO002, CO005, CO007,
              CO008]。这种混合模式绕过了传统企业销售中的摩擦，把数百万次免费的开发者部署转化为不同部署层级的付费企业关系 [CO002, CO007]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO007
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
