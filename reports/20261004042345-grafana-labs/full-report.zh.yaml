  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资边界比通用监控软件窄、比仪表盘宽。Grafana
              销售覆盖指标、日志、追踪、事件响应、测试和合成监控的全栈可观测性平台，应用层还提供上下文故障排查。因此相关支出包括托管遥测、分析、可靠性工作流、埋点和遥测成本控制，但不包括通用计算、无关安全工具，以及不产生或分析运营信号的应用开发支出。现实替代方案包括自托管开源、传统监控、原始日志、内部工具、超大规模云厂商原生服务和其他托管可观测性平台。Grafana
              承诺无需替换式迁移即可连接现有数据源，这扩大了触达范围，却也保留多重部署，使市场份额难以仅凭安装量或插件使用量推断。
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM008
              - CM009
      - number: '2.2'
        title: 受证据约束的市场规模估算
        blocks:
          - type: paragraph
            body: >-
              没有任何成功分配的来源提供方法可比的可观测性 TAM、SAM 或 Grafana 可获得份额货币估算。现有最强指标是分母不同的采用代理指标。Infra Play 复述公司声称的 7,000+ 家客户组织及覆盖
              Fortune 50 之 70%；QuantLogix 报告 3,500 万开源用户，但其宣传性表述和未披露方法使可信度偏低。Grafana 联合创始人还称 73% 的组织正在使用或评估
              OpenTelemetry，但抓取的摘录没有调查分母。这些指标说明触达范围和标准势头，而非支出规模；不能相乘、当作漏斗转化率比较，或视为独立验证的市场规模估计。
            claimRefs:
