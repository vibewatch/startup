      - number: '2.4'
        title: 增长驱动、采用约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              微服务复杂度上升、信号类型增多、开放标准埋点和 AI 工作负载的运营负担共同拉动需求。产品扩展到应用可观测性和 AI 辅助调查，回应了从展示数据转向寻找根因的需求。经济和行为因素构成反向压力：Woods
              承认成本与价值是首要考量，迁移也很昂贵；Infra Play 则认为年轻开发者对 Grafana 仪表盘的依附可能更弱，AI 原生工作负载常偏好 Datadog、Sentry 或
              ClickHouse。Grafana 声称遥测量最多可减少 80%，或能改善 ROI，但这只是厂商口径，不是独立基准。只有尽调证明付费转化、使用持久性和分客群留存后，估值才应奖励标准驱动的分发与工作流扩张。
            claimRefs:
              - CM002
              - CM004
              - CM007
              - CM008
              - CM010
              - CM011
