  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局、同类形态与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              企业可观测性市场主要分为四类竞争形态：专有全栈老牌厂商、开源及混合平台专家、超大规模云厂商原生监控工具，以及内部自建的现状方案。Datadog（$2.45B ARR、约 $39B 市值）和 Dynatrace
              将指标、日志与追踪整合进统一架构，提升易用性，却把客户数据锁在专有仓库中。Grafana Labs 则依靠普及的开源可视化层和解耦后端引擎，运营“大帐篷”混合商业模式：Grafana Mimir
              负责指标、Grafana Loki 负责日志聚合、Grafana Tempo 负责分布式追踪。除商业软件厂商外，公司还面对内部平台团队管理的自托管开源技术栈，以及嵌入 Amazon Web
              Services、Microsoft Azure 和 Google Cloud Platform 的原生遥测服务。云厂商拥有巨大的原生分发优势和既有计费关系，而自托管开源部署也经常直接与 Grafana Labs
              的付费转化竞争。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP009
              - CP010
      - number: '3.2'
        title: 能力架构、定价机制与 TCO 权衡
        blocks:
          - type: paragraph
            body: >-
              企业采购评估显示，各平台在定价机制、能力深度和总拥有成本上差异很大。Datadog 将基础设施主机监控（每主机每月 $15 至
              $18）与双层日志定价结合，把摄入（$0.10/GB）和索引（$1.70/GB）分开，在遥测密集、高基数环境中常造成账单冲击。Grafana Cloud Pro 的基础摄入费更低：指标约为每 1,000
              个活跃序列 $8，保留 13 个月；日志和追踪摄入费为 $0.50/GB，保留 30 天；另收每位活跃用户每月 $15 的席位费。相比 New Relic 的按用户模式（每用户每月 $99 至 $549）和
              Dynatrace 的按主机计费（每主机小时 $0.08），Grafana Cloud 为指标密集型工作负载提供更细粒度的成本治理。Grafana Labs 还部署 Adaptive
              Telemetry，自动识别冗余运营数据并聚合噪声遥测，最多将客户遥测账单降低 80%，保护企业预算。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
