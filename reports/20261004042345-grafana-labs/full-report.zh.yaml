              - CO004
              - CO005
              - CO007
              - CO012
      - number: '1.2'
        title: 领导层架构、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs 的领导架构由三位联合创始人支撑：首席执行官 Raj Dutt、副总裁 Anthony Woods 和 Grafana 项目创建者 Torkel Ödegaard [CO001,
              CO002]。Dutt 负责整体战略、企业定位和商业定价，Woods 负责架构愿景与技术规模化，Ödegaard 则主导开源工程文化和仪表盘扩展能力 [CO002, CO003,
              CO004]。更广泛的管理团队还包括 OpenTelemetry 联合创始人 Ted Young 等战略引进人才，以强化标准治理；日本等地区也由专门的区域管理层推动扩张 [CO003,
              CO004]。Grafana 的信誉牢牢建立在开源社区信任和中立的“大帐篷”遥测接入之上，因此创始工程团队的留任是重要治理因素；一级机构投资者积极参与私人二级要约和董事会管理，则构成平衡 [CO002,
              CO004, CO006]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
