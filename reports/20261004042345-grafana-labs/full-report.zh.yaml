  - id: TV003
    title: 乐观、基准和悲观情景
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 高增长和高留存；利润率与现金创造能力强
        - 按 $400M 代理值的 20 倍至 25 倍计，为 $8.0B-$10.0B
        - 高倍数压缩且退出延迟
        - 经审计指标支持达到 Datadog 级别的质量
      - - 基准
        - 增长趋于正常；利润率改善；近期不会上市退出
        - 按 $400M 代理值的 10 倍至 15 倍计，为 $4.0B-$6.0B
        - 流动性不足和稀释降低实际回报
        - 当前证据填补所有核心财务尽调缺口
      - - 悲观
        - 增长或留存走弱；现金消耗持续
        - 按 $400M 代理值的 3 倍至 7 倍计，为 $1.2B-$2.8B
        - 下轮融资、优先权悬置且没有退出
        - 指标向较低的上市公司可比倍数靠拢
    notes: 示例性分析师情景采用第三方 $400M 收入或 ARR 代理值及若干上市公司可比倍数锚点；这些不是公司指引，也不是观察到的交易价格。
