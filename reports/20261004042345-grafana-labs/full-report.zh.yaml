        title: 展示
        blocks:
          - type: callout
            title: 采用代理指标不是市场规模
            body: 用户触达、客户标识、标准采用和 Fortune 50 渗透使用不同分母。把它们当成漏斗，或乘以假设合同金额，会制造虚假精确；必须先拿到分客群支出、留存和工作负载数据。
            calloutType: risk
