              Grafana Labs 实际上拆解了传统 IPO。公司反复组织私人二级出售和员工要约，例如 2025 年 9 月 $150M 流动性轮和 2026 年 2 月 GIC
              主导的交易，在满足员工及早期投资者流动性的同时，保护财务数据和战略灵活性 [CO002, CO006]。
            calloutType: insight
