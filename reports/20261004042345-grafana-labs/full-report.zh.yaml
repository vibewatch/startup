      - number: '3.3'
        title: 护城河持久性、替代动态与商业摩擦
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs 的防御力来自超过 2,000 万用户的社区覆盖和 100 多个数据库及平台集成。采用 Prometheus、OpenTelemetry
              等开放标准，让企业无需厂商锁定或替换专有代理即可建立多云监控。但公司也有明显商业弱点：工程团队常自托管开源软件，依靠社区 Slack 支持，绕过 Grafana Enterprise Stack 或托管
              Cortex/Mimir 支持等付费订阅，形成对自身社区的内部竞争。为把自助用户转为年度企业承诺，Grafana Labs 配备专门的 Velocity 客户经理和技术现场团队。同时 AWS、Azure、GCP
              持续扩展原生监控工具，随着企业工作负载原生迁移到托管云，独立第三方厂商面临被绕开的风险。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: 开源中立性是采购端对抗厂商锁定的解药
            body: >-
              Grafana Labs 对 Datadog 和 Dynatrace 的核心竞争切口是“大帐篷”式可组合性。Grafana 支持 OpenTelemetry、Prometheus 等开放标准，并连接 100
              多个独立数据源，让企业买方无需昂贵的专有代理迁移即可查询遥测。
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP009
          - type: callout
            title: 内部 OSS 蚕食与云厂商去中介风险
            body: Grafana Labs 面临两项结构性商业逆风：企业客户可能满足于社区支持的免费自托管开源软件；原生云厂商也在把集成式可观测性工具直接扩展进超大规模云基础设施。
            calloutType: risk
            claimRefs:
              - CP004
