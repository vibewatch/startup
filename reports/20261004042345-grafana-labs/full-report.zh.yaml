          detail: TechCrunch 报道 2024 年 ARR 超过 $250M，付费客户超过 5,000 家
        - id: mark-conflict
          label: 相互冲突的估值标记
          detail: 2026 年来源报告估值为 $6B 和 $9B
        - id: comp-test
          label: 可比性检验
          detail: 选定上市公司的收入倍数介于 2.4 倍至 22.7 倍
        - id: diligence-gate
          label: 缺失的投资者证据
          detail: 经审计的质量、完全稀释后的所有权、优先权和退出计划
        - id: recommendation
          label: 继续研究
          detail: 只有在取得披露信息，或价格得到已验证指标支持后，才继续推进
