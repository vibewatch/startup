  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与商业组合
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs 通过 Grafana Cloud 与自托管 Grafana Enterprise Stack 订阅组成的双交付架构，将开源可观测性生态商业化。Grafana Cloud 是全托管
              SaaS
              平台，整合运营指标（Mimir）、日志（Loki）、追踪（Tempo）、持续剖析（Pyroscope）和前端监控（Faro），采用多租户用量及分层订阅计费。变现主要来自遥测摄入、活跃序列和保留运营数据的消耗，并叠加涵盖基于角色的访问控制、审计日志和合规认证的企业治理层。为缓解遥测成本膨胀带来的预算摩擦，公司定位
              Adaptive Telemetry 工具，最多削减客户遥测支出 80%，同时锁定承诺型 SaaS 合同金额。公司目前仅将估计约 1% 的 2,000
