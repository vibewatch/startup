  - id: FO001
    title: Grafana Labs 演进与企业里程碑进展
    type: timeline
    summary: 按时间梳理公司成立、重大融资里程碑、ARR 成就和平台规模。
    data:
      items:
        - date: '2014-01-01'
          label: 创立与注册成立
          detail: Raj Dutt、Torkel Ödegaard 和 Anthony Woods 在母公司 Raintank Inc. 旗下创立公司。
          tone: neutral
        - date: '2024-08-01'
          label: D 轮融资扩展与 $250M ARR
          detail: 完成 $270M 的新股与老股融资，估值超过 $6B；ARR 达到约 $250M。
          tone: positive
        - date: '2025-09-30'
          label: 二次交易与 $400M ARR
          detail: ARR 超过 $400M，客户数超过 7,000 家；Ontario Teachers 领投 $150M 老股转让。
          tone: positive
        - date: '2026-02-03'
          label: FY26 规模与全球扩张
          detail: 报告称 ARR 持续超过 $400M，设立日本子公司，并覆盖 Fortune 50 中的 70%。
          tone: positive
        - date: '2026-02-28'
          label: GIC 领投的 $9B 私有估值
          detail: 完成由 GIC 领投、报告估值为 $9B 的融资，以维持私有状态下的增长。
          tone: positive
        - date: '2026-07-23'
          label: IPO 前简报与 $9.5B 跟踪估值
          detail: 二级市场跟踪基于 3,500 万开源用户，估算公允估值约为 $9.5B。
          tone: neutral
        - date: '2026-08-26'
          label: $600M ARR 与 10,000 家客户里程碑
          detail: ARR 突破 $600M，付费组织达到 10,000 家，增长由生成式 AI 工作负载可观测性推动。
          tone: positive
        - date: '2026-10-04'
          label: 持续保持独立私营状态
          detail: 继续以私营公司运营，未提交公开 IPO 文件，也未披露盈利指标。
          tone: warning
    approximationNotes: 日期代表已披露的里程碑公告和机构简报日期；早期的 2014 年创立日期已统一到日历年年初。
