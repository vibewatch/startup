      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              保留证据中最后一笔得到一致佐证的交易，是 2024 年 8 月的一级加二级交易：TechCrunch 报道交易金额约 $270M、估值超过 $6B；Forge 则单独显示该轮投后估值 $6.23B。2026
              年参考点尚未确定。Multiples 以 $6B 对应 $400M 收入或 ARR 代理值，隐含 15.0x；Forge 却显示 2026 年 2 月 $9B 的 Series E
              估值，相当于同一未经审计代理值的 22.5x。Forge 还显示 1.0x
              清算优先权，但公开证据无法确定完整优先级、完全摊薄股数、期权池或二级转让经济性。只有调和这些冲突及所有权条款后，才能确定有纪律的入场上限。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV013
              - CV016
      - number: '8.3'
        title: 情景框架与可比参考
        blocks:
          - type: paragraph
            body: >-
              情景框架只把 $400M 作为已报告的收入或 ARR 代理值，而非经审计 GAAP 收入。Multiples 列出公开可观测性及开发者基础设施可比公司，收入倍数从 PagerDuty 的 2.4x 到
              Datadog 的 22.7x，Elastic 为 4.9x、Dynatrace 为 7.5x。将明确倍数区间应用于代理值，得到示意性熊市区间 $1.2-$2.8B、基准区间 $4.0-$6.0B、牛市区间
              $8.0-$10.0B。这些是投资评估情景，不是观察到的公司估值。Forge 的 $9B 估值处于牛市区间，因此需要高增长、留存、利润率和现金生成证明；若倍数压缩至公开可比中位水平，相对该估值将有显著下行空间。
            claimRefs:
              - CV003
              - CV004
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备、论点破坏触发器与尽调
        blocks:
          - type: paragraph
            body: >-
              QuantLogix 报道 Grafana Labs 没有 IPO 申报，并认为私人要约和融资在不受公开市场审查的情况下提供了流动性；由于它是低等级分析师来源，该信号应验证，不能视为定论。Forge
              也称市场活动有限，并警告私人公司指标可能只依赖很少输入，不一定代表可交易市场价格。Built In 资料显示有股权薪酬，因此完全摊薄所有权分析不可或缺。投资前，应取得经审计财务、ARR 与 GAAP
              收入对账、NRR/GRR、队列流失、按部署模式拆分的毛利率、自由现金流、债务、完整优先权结构、期权池和二级条款，以及董事会批准的退出规划。论点破坏触发器包括持久增长低于
              20%、留存疲弱、毛利率持续恶化、现金持续消耗且没有可信盈亏平衡路径，或在缺乏公开质量证据时以高于牛市区间的价格入场。
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 继续研究。公开记录支持业务质量，但在没有经审计的收入质量、留存、利润率、现金流、稀释、优先权和退出证据前，不支持以高于 $6B 的价格进行风险调整后的入场。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV013
              - CV016
