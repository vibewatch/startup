      - number: '1.3'
        title: 资本结构、二级流动性与估值轨迹
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs 建立了灵活的私人资本结构，在无需接受公开市场上市审查的情况下满足机构流动性和资本需求 [CO002]。截至 2024 年中，公司累计一级融资超过 $537M；2024 年 8 月完成
              Series D 增资，估值超过 $6B。随后，Ontario Teachers' Pension Plan 联合 Sapphire Ventures 和 Tiger Global 主导 2025 年 9
              月二级交易，并配套 $150M 员工要约 [CO002, CO006]。私人二级市场追踪显示，2026 年初估值升至约 $9.5B；2026 年 2 月 GIC 主导私人轮融资的报道进一步印证这一点
              [CO002]。商业规模也沿着相似轨迹增长：ARR 从 2024 年 8 月约 $250M 增至 2025 年 9 月超过 $400M、客户数 7,000，随后在 2026 年 8 月达到 $600M
              ARR、10,000 名客户 [CO002, CO004, CO007]。尽管营收规模强劲，精确现金消耗、GAAP 盈利能力和优先清算顺位仍是未披露的私人指标 [CO002, CO012]。
