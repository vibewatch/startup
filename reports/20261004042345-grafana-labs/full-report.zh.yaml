      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              采用从一线实践者开始，但随着技术资产变复杂，会扩大为管理层采购。Anthony Woods 认为早期采用者是主动寻找新工具的工程师，而主流组织更倾向自上而下采用，并逐渐纳入高管。日常用户可能是
              SRE、平台、DevOps 或开发者，付款方则更可能是工程或技术负责人。Grafana
              的商业获客销售岗位支持有意识的企业转化，但转载内容只有职位名称，无法证明配额、区域经济性或客户组合。现有开源用户可凭熟悉度转向托管服务；工具分散的企业有整合路径；AI
              原生团队则受到遥测增长触发，但面对强劲替代品，可能偏好自动化、查询优先的工作流。
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM014
              - CM015
