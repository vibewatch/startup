      - number: '5.2'
        title: 运营架构、LGTM 引擎与 eBPF 采集
        blocks:
          - type: paragraph
            body: >-
              核心技术架构将开放标准与解耦的存储、查询引擎结合，传统上称为 LGTM 技术栈（Loki、Grafana、Tempo、Mimir）。可视化层的 Grafana 12 引入受 Kubernetes CRD
              启发的动态仪表盘、上下文感知编辑和 LLM 辅助查询生成。指标层以 Grafana Mimir 为核心，3.0 版本通过 Apache Kafka 异步缓冲和流式 Mimir Query
              Engine（MQE）拆分摄入与查询执行，使峰值查询内存最多降低 92%。分布式追踪中，Tempo 提供高吞吐追踪索引和 Model Context Protocol（MCP）服务器支持；Loki
              处理可水平扩展的日志聚合。Grafana Alloy 与 Kubernetes 的 Alloy Operator 统一遥测采集，Beyla 则通过 eBPF 自动埋点，并已上游贡献给 OpenTelemetry
              项目以降低埋点摩擦。
