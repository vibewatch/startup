  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-quality
      missingEvidence: Audited GAAP revenue, ARR reconciliation, gross margin by deployment model, NRR, GRR, cohort churn, free cash flow, cash, debt, and runway.
      whyItMatters: These metrics determine whether a premium revenue multiple and target return are supportable.
      diligencePath: Obtain audited financial statements, the latest board package, ARR bridge, cohort schedules, and cash-flow forecast in a management data room.
      relatedQuestionRefs: [QV002, QV003, QV007, QV010]
      relatedTableRefs: [TV001, TV003]
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: Executed 2026 financing documents reconciling the $6 billion and $9 billion third-party valuation records.
      whyItMatters: The unresolved entry price changes the implied multiple and downside in every scenario.
      diligencePath: Review the signed stock-purchase agreement, amended charter, closing capitalization, and primary-versus-secondary proceeds schedule.
      relatedQuestionRefs: [QV004, QV005]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: capitalization
      missingEvidence: Fully diluted capitalization, option pool, equity-compensation dilution, liquidation seniority, participation rights, and secondary-transfer terms.
      whyItMatters: Preference and dilution overhang can materially reduce common-equity returns even if enterprise value rises.
      diligencePath: Obtain the post-close cap table, charter, investor-rights agreement, option ledger, 409A history, and tender documentation.
      relatedQuestionRefs: [QV009]
      relatedTableRefs: [TV001, TV002]
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: Board-approved IPO or sale plan, banker engagement, audited public-company controls, and a credible exit timeline.
      whyItMatters: Without a verified liquidity path, hold period and return targets cannot be calculated.
      diligencePath: Interview the CFO and board, review readiness workstreams, and request written milestones for an IPO, strategic sale, or future tender.
      relatedQuestionRefs: [QV006, QV007]
