company:
  name: Grafana Labs
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a research-more recommendation rather than a priced investment:
    TechCrunch documented a 2024 transaction above $6 billion, while two 2026 market-data
    sources conflict between $6 billion and $9 billion. Grafana Labs has credible commercial
    proof, but the absence of audited revenue quality, retention, margin, cash-flow, fully
    diluted capitalization, and complete preference data prevents a defensible return case.
sections:
  - id: recommendation-and-thesis
    title: Recommendation and investment thesis
    body: >-
      The recommendation is research-more, with medium confidence and high underwriting risk.
      The positive case is real but not yet investable from public evidence alone: TechCrunch
      reported more than $250 million of ARR and more than 5,000 paying customers in August
      2024, while Grafana Labs markets an open, interoperable platform and claims Adaptive
      Telemetry can reduce telemetry costs by up to 80%. Those points support distribution,
      monetization, and a differentiated cost-control narrative. The anti-thesis is price and
      evidence quality. Current private marks conflict, the latest $400 million metric is
      described by one aggregator as revenue while its methodology permits revenue or ARR,
      and no retained source supplies audited margins, retention, cash flow, or a complete
      capitalization table. Entry should therefore wait for a verified price and private
      diligence package rather than treating company quality as proof of value.
    claimRefs: [CV002, CV003, CV008, CV009, CV012, CV016]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The last consistently corroborated transaction in the retained evidence is the August
      2024 primary-and-secondary deal: TechCrunch reported about $270 million of transaction
      value and a valuation above $6 billion, and Forge separately displays a $6.23 billion
      post-money mark for that round. The 2026 reference point is not settled. Multiples records
      $6 billion against a $400 million revenue or ARR proxy, implying 15.0x, whereas Forge
      displays a $9 billion Series E mark in February 2026, equivalent to 22.5x that same
      unaudited proxy. Forge also displays a 1.0x liquidation preference, but public evidence
      does not establish the complete seniority stack, fully diluted share count, option pool,
      or secondary-transfer economics. A disciplined entry ceiling cannot be finalized until
      those conflicts and ownership terms are reconciled.
    claimRefs: [CV001, CV003, CV004, CV005, CV013, CV016]
  - id: scenarios-and-comparables
    title: Scenario framework and comparable references
    body: >-
      The scenario framework uses the $400 million figure only as a reported revenue-or-ARR
      proxy, not audited GAAP revenue. Multiples lists selected public observability and
      developer-infrastructure comparables from 2.4x revenue for PagerDuty through 22.7x for
      Datadog, with Elastic at 4.9x and Dynatrace at 7.5x. Applying explicit multiple bands to
      the proxy produces an illustrative bear range of $1.2-$2.8 billion, a base range of
      $4.0-$6.0 billion, and a bull range of $8.0-$10.0 billion. These are underwriting
      scenarios, not observed company valuations. The $9 billion Forge mark sits in the bull
      band and therefore requires premium growth, retention, margin, and cash-generation proof.
      Multiple compression toward the public-comp middle would create substantial downside
      from that mark.
    claimRefs: [CV003, CV004, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, thesis-break triggers, and diligence
    body: >-
      QuantLogix reports that Grafana Labs had no IPO filing and argues that private tenders and
      raises have supplied liquidity without public-market scrutiny; because it is a low-tier
      analyst source, that signal should be verified rather than treated as definitive. Forge
      also labels market activity limited and warns that private-company metrics may rely on
      very few inputs and may not represent a tradable market price. Equity compensation is
      visible in the Built In profile, making fully diluted ownership analysis essential.
      Before investment, obtain audited financials, ARR-to-GAAP-revenue reconciliation,
      NRR/GRR, cohort churn, gross margin by deployment model, free cash flow, debt, the complete
      preference stack, option-pool and secondary terms, and board-approved exit planning.
      Thesis-break triggers are sub-20% durable growth, weak retention, negative gross-margin
      progression, continued cash burn without a credible path to breakeven, or an entry above
      the bull band without public-quality evidence.
    claimRefs: [CV005, CV006, CV010, CV011, CV012, CV016]
