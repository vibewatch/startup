          detail: "2026 sources report $6B and $9B valuations"
        - id: comp-test
          label: Comparable test
          detail: "Selected public revenue multiples span 2.4x to 22.7x"
        - id: diligence-gate
          label: Missing investor proof
          detail: "Audited quality, fully diluted ownership, preferences, and exit plan"
        - id: recommendation
          label: Research more
          detail: "Proceed only after disclosure or at a price supported by verified metrics"
    approximationNotes: >-
      This is a qualitative decision sequence; it does not assign probabilities or imply that
      each step has equal weight.
    claimRefs: [CV002, CV003, CV004, CV009, CV010, CV012, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Research more. The public record supports business quality, but not a risk-adjusted entry
      above $6 billion without audited revenue quality, retention, margin, cash-flow, dilution,
      preference, and exit evidence.
    claimRefs: [CV003, CV004, CV012, CV013, CV016]
