  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, What would change the view]
    rows:
      - [Thesis, "Open standards and no-rip-and-replace positioning can sustain adoption", "Independent retention and expansion data showing durable paid conversion"]
      - [Thesis, "Reported ARR and paying-customer scale demonstrate commercial traction", "Audited revenue reconciliation and cohort-level customer evidence"]
      - [Anti-thesis, "A $9B mark prices the company at 22.5x the reported $400M proxy", "Sustained premium growth plus strong gross margin and free-cash-flow evidence"]
      - [Anti-thesis, "Private liquidity and incomplete capitalization data obscure investor returns", "Verified fully diluted cap table, preferences, secondary terms, and exit plan"]
    notes: >-
      Arguments distinguish company claims from third-party reports; each change condition is a
      diligence requirement, not a forecast.
    claimRefs: [CV002, CV004, CV005, CV006, CV008, CV009, CV014, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Premium growth and retention; strong margins and cash generation", "$8.0B-$10.0B at 20x-25x the $400M proxy", "Premium-multiple compression and delayed exit", "Audited metrics support Datadog-like quality"]
      - [Base, "Growth normalizes; margins improve; no near-term public exit", "$4.0B-$6.0B at 10x-15x the $400M proxy", "Illiquidity and dilution reduce realized return", "Current evidence clears all core financial diligence gaps"]
      - [Bear, "Growth or retention weakens; cash burn persists", "$1.2B-$2.8B at 3x-7x the $400M proxy", "Down round, preference overhang, and no exit", "Metrics converge toward lower public-comparable multiples"]
    notes: >-
      Illustrative analyst scenarios use a third-party $400M revenue-or-ARR proxy and selected
      public-comp multiple anchors; they are not company guidance or observed transaction prices.
    claimRefs: [CV003, CV004, CV013, CV014, CV015, CV016]
