callouts:
  - calloutType: "insight"
    title: "Sustained Liquidity Without Public Listing Friction"
    body: "Grafana Labs has effectively unbundled the traditional IPO. By orchestrating repeated private secondary sales and employee tenders—such as the $150M September 2025 liquidity round and the February 2026 GIC-led transaction—the company satisfies employee and early investor liquidity while protecting its financial data and strategic flexibility [CO002, CO006]."
    claimRefs:
      - "CO002"
      - "CO006"
  - calloutType: "risk"
    title: "Private Profitability and Margin Opacity"
    body: "While top-line ARR expansion from $400M to $600M indicates strong commercial adoption, Grafana Labs has disclosed zero audited figures regarding cash burn, GAAP gross margins across Grafana Cloud vs Enterprise, or bottom-line profitability, leaving net unit economics obscured for outside investors [CO004, CO007, CO012]."
    claimRefs:
      - "CO004"
      - "CO007"
      - "CO012"
