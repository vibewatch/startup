company:
  name: "Grafana Labs"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Grafana Labs commercializes the ubiquitous open-source Grafana visualization stack alongside managed telemetry backends in Grafana Cloud, scaling annual recurring revenue from ~$250M in August 2024 to $400M+ in September 2025 and surpassing $600M ARR with over 10,000 customers by August 2026. The business operates a remote-first model across 40+ countries and has raised significant growth capital and secondary liquidity from top-tier institutional sponsors, though complete historical liquidation preferences and audited margins remain private."
sections:
  - id: "corporate-identity-and-operating-model"
    title: "Corporate Identity, Foundation, and Operating Model"
    body: "Grafana Labs, legally incorporated as Raintank Inc. (doing business as Grafana Labs), is a late-stage developer infrastructure and observability software provider founded in 2014 by Raj Dutt, Torkel Ödegaard, and Anthony Woods [CO001, CO002]. Headquartered in New York City while operating as a 100% remote-first organization with approximately 1,400 to 1,500+ employees distributed across more than 40 countries, the company commercializes the default visualization interface for infrastructure telemetry [CO001, CO002, CO003]. The company’s commercial model pairs broad open-source adoption—spanning an estimated 25M to 35M users of Grafana OSS—with monetization through fully managed Grafana Cloud services, enterprise self-managed subscriptions, and workflow automation suites [CO002, CO005, CO007, CO008]. This hybrid structure allows Grafana Labs to bypass traditional enterprise sales friction, transforming millions of free developer deployments into paying enterprise relationships across diverse deployment tiers [CO002, CO007]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO005"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO001"
  - id: "founding-team-and-governance"
    title: "Leadership Architecture, Governance, and Key-Person Exposure"
    body: "The leadership structure of Grafana Labs is anchored by its three co-founders: Chief Executive Officer Raj Dutt, Vice President Anthony Woods, and Grafana project creator Torkel Ödegaard [CO001, CO002]. Dutt directs overall strategic direction, enterprise positioning, and commercial pricing models, while Woods oversees architectural vision and technical scaling, and Ödegaard steers open-source engineering ethos and dashboard extensibility [CO002, CO003, CO004]. The broader executive bench is supported by strategic hires including OpenTelemetry co-founder Ted Young to reinforce standards governance, alongside regional executives driving geographic expansion such as dedicated subsidiaries in Japan [CO003, CO004]. Because Grafana's credibility rests firmly on open-source community trust and neutral 'big-tent' telemetry ingestion, retention of its founding engineering leadership represents a material governance factor, balanced by backing from tier-one institutional investors who participate actively in private secondary tenders and board stewardship [CO002, CO004, CO006]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO006"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale-trajectory"
    title: "Capitalization, Secondary Liquidity, and Valuation Trajectory"
    body: "Grafana Labs has established a flexible private capitalization strategy that satisfies institutional liquidity and capital needs without public market listing scrutiny [CO002]. Following cumulative primary funding of over $537M through mid-2024, Grafana closed an August 2024 Series D extension valuing the firm at >$6B, followed by a September 2025 secondary transaction led by Ontario Teachers' Pension Plan alongside Sapphire Ventures and Tiger Global, which was paired with a $150M employee tender [CO002, CO006]. Private secondary tracking indicated marks walking to ~$9.5B by early 2026, reinforced by reports of a GIC-led private round in February 2026 [CO002]. Commercial scale has mirrored this capital trajectory, compounding from ~$250M ARR in August 2024 to >$400M ARR with 7,000 customers by September 2025, and hitting $600M ARR with 10,000 customers by August 2026 [CO002, CO004, CO007]. Despite strong top-line scale, precise cash burn, GAAP profitability, and preferred liquidation seniority remain undisclosed private metrics [CO002, CO012]."
    claimRefs:
      - "CO002"
      - "CO004"
      - "CO006"
      - "CO007"
      - "CO012"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
