evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited financial statements detailing GAAP gross margin across Grafana Cloud vs Enterprise licenses, operating
      income, and net burn rate.
    whyItMatters: >-
      Without audited profitability disclosures or deployment-specific margins, outside analysts cannot verify unit
      economic sustainability at $600M ARR.
    diligencePath: >-
      Request confidential financial disclosure pack, audited income statements, or S-1 draft disclosures under NDA
      during pre-IPO diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: informative
    topic: executive-leadership-enumeration
    missingEvidence: >-
      Full organizational executive roster and complete employment agreements for non-founder functional vice
      presidents.
    whyItMatters: >-
      Public sources disclose co-founders and select VPs, but mid-level executive bench depth remains unverified without
      an organizational chart.
    diligencePath: Review full executive org chart and retention agreements during management diligence.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: informative
    topic: stakeholder-cap-table-enumeration
    missingEvidence: >-
      Exhaustive capitalization table disclosing exact percentage ownership, option pool dilution, and liquidation
      preferences across all investor classes.
    whyItMatters: >-
      Public sources identify lead institutional investors and secondary sponsors, but exact waterfall distribution and
      voting control remain confidential.
    diligencePath: Inspect audited cap table and investor rights agreements in pre-IPO data room.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      An independent observability market estimate with explicit category boundary, base year, geography, and
      methodology.
    whyItMatters: >-
      Without a comparable spend denominator, customer and user counts cannot be translated into TAM, SAM, or market
      share.
    diligencePath: >-
      Obtain current analyst market datasets or public-company segment disclosures and reconcile their included products
      before sizing.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Contract values, workload consumption, win rates, retention, and revenue mix by customer segment and deployment
      model.
    whyItMatters: >-
      These data determine whether open-source reach and logo penetration convert into a defensible serviceable and
      obtainable market.
    diligencePath: >-
      Request cohort-level bookings, ARR, usage, gross retention, and net retention by segment in the diligence data
      room.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM007
  - type: access-blocked
    severity: minor
    topic: inaccessible-source
    missingEvidence: The substantive Contrary Research company breakdown behind the fetched privacy-only response.
    whyItMatters: >-
      The source was allocated as net-new evidence but cannot corroborate market definition, sizing, or competitive
      claims in its retrieved form.
    diligencePath: >-
      Review an authorized accessible copy or replace it with another successful source assigned through the research
      workflow.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: sizing-comparability
    missingEvidence: >-
      Comparable independent estimates that use the same observability definition, geography, period, and buyer
      denominator.
    whyItMatters: >-
      The available 35 million users, 7,000+ organizations, Fortune 50 penetration, and OpenTelemetry adoption figures
      describe unlike populations.
    diligencePath: >-
      Normalize at least two independent market estimates and reconcile exclusions for monitoring, security, incident
      response, and self-managed software.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: >-
      Audited gross margin by deployment model (Grafana Cloud vs. Grafana Enterprise) and multi-cloud infrastructure
      compute/storage COGS.
    whyItMatters: >-
      Validating whether high gross margin estimates hold under heavy telemetry egress and multi-cloud infrastructure
      loads.
    diligencePath: Request audited revenue and COGS schedules segmented by Cloud hosting and Enterprise licenses.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
