  - type: private-evidence-only
    severity: material
    topic: contractual liability carve-outs
    missingEvidence: >-
      Empirical enterprise contract exception log showing the frequency and financial terms of negotiated uncapped
      liability or data breach indemnification carve-outs.
    whyItMatters: >-
      Standard public Terms of Service cap liability at fees paid, but enterprise Fortune 500 customers frequently
      demand uncapped indemnities for data breaches, representing unquantified legal tail risk.
    diligencePath: >-
      Request legal diligence disclosure of top 20 enterprise MSAs to examine bespoke limitation-of-liability schedules
      and cyber insurance coverage.
    relatedTableRefs:
      - TR001
