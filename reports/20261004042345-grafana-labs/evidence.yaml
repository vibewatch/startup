  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: NRR, GRR, logo churn, renewal rates, contract duration, and cohort survival by customer tier.
    whyItMatters: Product breadth and active usage cannot establish whether customer and revenue cohorts remain durable.
    diligencePath: >-
      Request audited monthly and annual customer cohorts with beginning ARR, churn, contraction, expansion, and ending
      ARR by spend band.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: customer-and-channel-concentration
    missingEvidence: Top-customer revenue shares and the share of bookings or ARR sourced, influenced, or transacted through AWS.
    whyItMatters: >-
      Undisclosed customer or channel concentration could make reported growth less diversified and more sensitive to
      individual counterparties.
    diligencePath: >-
      Review the top-25 customer schedule, channel-attributed bookings, Marketplace economics, renewal exposure, and AWS
      agreement terms.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete customer-reference census distinguishing pilots, production deployments, failed deployments, renewals,
      and independently measured outcomes.
    whyItMatters: >-
      Three favorable customer statements cannot establish deployment success or durability across the full customer
      base.
    diligencePath: >-
      Obtain the customer-reference list, select a stratified sample by tier and tenure, and conduct unscripted
      reference calls.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: material
    topic: population-comparability
    missingEvidence: >-
      Definitions and overlap for users, customers, contracted customers, self-serve organizations, and Assistant
      organizations.
    whyItMatters: >-
      Without consistent denominators, public activity metrics cannot be converted into acquisition, paid-conversion, or
      retention rates.
    diligencePath: >-
      Request the metric dictionary and a reconciliation bridge across community, free, self-serve paid, and contracted
      populations.
    relatedQuestionRefs:
      - QU001
      - QU002
      - QU009
    relatedTableRefs:
      - TU001
      - TU002
  - type: missing-source
    severity: material
    topic: independent-adverse-customer-evidence
    missingEvidence: >-
      Direct customer complaints, failed-deployment evidence, procurement records, or an independent retention
      benchmark.
    whyItMatters: >-
      The retained adverse commentary is low-reputation and does not verify actual churn, procurement friction, or
      deployment failure.
    diligencePath: >-
      Review support escalations, loss analyses, churn surveys, procurement records, and independent customer
      interviews.
    relatedQuestionRefs:
      - QU004
