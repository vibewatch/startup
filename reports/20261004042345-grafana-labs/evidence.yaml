    severity: material
    topic: capital adequacy
    missingEvidence: Current cash on hand, monthly net burn rate, and committed debt facility maturities.
    whyItMatters: Determining forward runway and whether sustained expansion to >$600M ARR requires near-term capital injection.
    diligencePath: Review year-to-date balance sheet, cash flow statements, and debt agreements.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
