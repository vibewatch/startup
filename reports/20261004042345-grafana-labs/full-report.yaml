      - number: '3.3'
        title: Moat Durability, Displacement Dynamics, and Commercial Friction
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs derives defensibility from its community footprint of over 20 million users and more than 100
              supported database and platform integrations. The adoption of open standards like Prometheus and
              OpenTelemetry enables enterprises to establish multi-cloud monitoring without vendor lock-in or
              proprietary agent rip-and-replace requirements. Nevertheless, the company confronts distinct commercial
              vulnerabilities. A primary operational friction is internal competition against its own open-source
              community: engineering teams frequently self-host the open-source software and rely on community Slack
              channels for support, bypassing paid commercial support subscriptions (such as Grafana Enterprise Stack or
              hosted Cortex/Mimir support). To convert self-serve users into annual enterprise commitments, Grafana Labs
              deploys specialized Velocity Account Executives and dedicated technical field teams. Simultaneously, major
              cloud providers (AWS, Azure, GCP) continuously expand native monitoring utilities that threaten to
              disintermediate independent third-party vendors as enterprise workloads shift natively to managed
              hyperscaler clouds.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Open-Source Neutrality as a Procurement Antidote to Vendor Lock-In
            body: >-
              Grafana Labs' core competitive wedge against Datadog and Dynatrace is its 'big tent' composability. By
              supporting open standards such as OpenTelemetry and Prometheus, and connecting to over 100 distinct data
              sources, Grafana allows enterprise buyers to query telemetry without undergoing expensive proprietary
              agent migrations.
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP009
          - type: callout
            title: Internal OSS Cannibalization and Hyperscaler Disintermediation Risks
            body: >-
              Grafana Labs faces two structural commercial headwinds: enterprise prospects remaining satisfied with free
              self-hosted open-source software supported by community channels, and native cloud providers expanding
              integrated observability tools directly into hyperscaler infrastructure.
            calloutType: risk
            claimRefs:
