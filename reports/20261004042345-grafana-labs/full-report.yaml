  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is narrower than generic monitoring software and broader than dashboards. Grafana
              markets a full-stack observability platform spanning metrics, logs, traces, incident response, testing,
              and synthetic monitoring, while its application layer adds contextual troubleshooting. The relevant spend
              therefore includes managed telemetry, analysis, reliability workflows, instrumentation, and telemetry-cost
              controls. It excludes general-purpose compute, unrelated security tooling, and application-development
              spend that does not produce or analyze operational signals. The practical substitutes are self-managed
              open source, legacy monitoring, raw logs, internal tooling, hyperscaler-native services, and other managed
              observability platforms. Grafana's promise to connect existing data sources without a rip-and-replace
              migration expands reach, but also preserves multi-homing and makes market share harder to infer from
              installation or plugin usage alone.
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
