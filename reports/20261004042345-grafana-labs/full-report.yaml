              - CE011
      - number: '5.2'
        title: Operating Architecture, LGTM Engines, and eBPF Collection
        blocks:
          - type: paragraph
            body: >-
              The core technology architecture combines open standards with decoupled storage and query engines,
              historically known as the LGTM stack (Loki, Grafana, Tempo, Mimir). At the visualization tier, Grafana 12
              introduced dynamic dashboards with Kubernetes CRD-inspired schemas, context-aware editing, and
              LLM-assisted query generation. The metrics tier is anchored by Grafana Mimir, whose 3.0 release separated
              ingestion and query execution via Apache Kafka asynchronous buffers and the streaming Mimir Query Engine
              (MQE), cutting peak query memory consumption by up to 92%. In distributed tracing, Tempo provides
              high-throughput trace indexing and Model Context Protocol (MCP) server support, while Loki handles
              horizontally scalable log aggregation. Telemetry collection is unified through Grafana Alloy and the Alloy
              Operator for Kubernetes, alongside eBPF-based auto-instrumentation via Beyla, which was contributed
              upstream to the OpenTelemetry project to lower instrumentation friction.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE014
          - type: figure
