        title: Unit Economics, Cost Structure, and Margin Dynamics
        blocks:
          - type: paragraph
            body: >-
              The underlying cost structure of Grafana Labs reflects cloud multi-tenancy and distributed engineering
              operations. Commercial assessments indicate gross margins of approximately 80% to 90%, supported by
              open-source community distribution and efficient bottom-up developer onboarding that keeps customer
              acquisition costs substantially lower than legacy top-down software vendors. However, delivery costs
              include meaningful cloud hosting, egress, and multi-cloud infrastructure compute across Amazon Web
              Services, Microsoft Azure, and Google Cloud Platform. Sales efficiency is driven by a hybrid go-to-market
              structure pairing bottom-up developer self-service with field sales alignment, pairing regional sales vice
              presidents, sales directors, account executives, and solutions engineers. Critical underwriting
              metrics—specifically net revenue retention (NRR), gross revenue retention (GRR), customer acquisition cost
              (CAC) payback periods, and exact GAAP gross margin figures—remain undisclosed private data points that
