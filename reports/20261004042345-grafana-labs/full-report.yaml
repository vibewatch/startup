        title: Leadership Architecture, Governance, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              The leadership structure of Grafana Labs is anchored by its three co-founders: Chief Executive Officer Raj
              Dutt, Vice President Anthony Woods, and Grafana project creator Torkel Ödegaard [CO001, CO002]. Dutt
              directs overall strategic direction, enterprise positioning, and commercial pricing models, while Woods
              oversees architectural vision and technical scaling, and Ödegaard steers open-source engineering ethos and
