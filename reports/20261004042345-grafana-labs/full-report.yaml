      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is pulled by microservice complexity, more signal types, open-standard instrumentation, and the
              operational burden of AI workloads. Product expansion into application observability and AI-assisted
              investigation addresses the need to move from displaying data toward finding root causes. The
              counterweight is economic and behavioral: Woods acknowledges that cost versus value is top of mind and
              that migration is expensive, while Infra Play argues that younger developers may have less attachment to
              Grafana dashboards and that AI-native workloads often favor Datadog, Sentry, or ClickHouse. Grafana's
              claimed telemetry reduction of up to 80% could improve ROI, but it is a vendor claim rather than an
              independent benchmark. Valuation should therefore reward standards-led distribution and workflow expansion
              only after diligence demonstrates paid conversion, durable usage, and retention by segment.
            claimRefs:
