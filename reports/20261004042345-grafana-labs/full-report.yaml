      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Adoption begins with practitioners but broadens into an executive purchase as estates become more complex.
              Anthony Woods describes early adopters as engineers who seek new tools, whereas mainstream organizations
              adopt more top-down and increasingly involve executives. This separates the daily user—SRE, platform,
              DevOps, or developer—from the likely payer in engineering or technology leadership. Grafana's active
              commercial-acquisition sales role supports a deliberate enterprise conversion motion, though the repost
              exposes only the title and cannot establish quota, territory economics, or customer mix. Existing
              open-source users have a familiarity-led path toward managed services; enterprises with fragmented tooling
              have a consolidation path; AI-native teams have a telemetry-growth trigger but face strong alternatives
              and may prefer automated, query-first workflows.
            claimRefs:
              - CM006
              - CM010
