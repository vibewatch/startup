  - id: FE001
    title: Grafana Labs Open Observability Architecture Stack
    type: stack
    summary: >-
      Hierarchical architecture of the Grafana observability stack spanning agentic workflows, telemetry engines, and
      collection agents.
    data:
      layers:
        - label: Application & Experience Layer
          detail: Grafana 12 dynamic dashboards, contextual visualization, and LLM query generation
          modules:
            - Grafana 12 Dashboards
            - Frontend Observability
        - label: Agentic Intelligence Layer
          detail: Natural language assistance and autonomous multi-agent operational incident investigation
          modules:
            - Grafana Assistant
            - Assistant Investigations
        - label: Governance & Telemetry Economics Layer
          detail: Automated telemetry downsampling and multi-signal relationship mapping
          modules:
            - Adaptive Telemetry Suite
            - Cloud Knowledge Graph
        - label: Telemetry Engine Tier (LGTM)
          detail: Decoupled horizontal storage and query engines across telemetry types
          modules:
            - Mimir 3.0 Metrics
            - Loki Log Management
            - Tempo 2.9 Tracing
        - label: Data Collection & Edge Instrumentation Layer
          detail: OpenTelemetry collection agents and kernel-level auto-instrumentation
          modules:
            - Grafana Alloy
            - Alloy Kubernetes Operator
            - Beyla eBPF Auto-Instrumentation
        - label: Deployment & Managed Infrastructure Layer
          detail: Multi-tenant SaaS and sovereign deployment topologies
          modules:
            - Grafana Cloud (Multi-tenant SaaS)
            - Grafana Bring Your Own Cloud (BYOC)
            - Grafana Federal Cloud (FedRAMP High / DoD IL5)
    approximationNotes: >-
