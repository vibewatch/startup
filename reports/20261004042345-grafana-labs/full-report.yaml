      - number: '1.3'
        title: Capitalization, Secondary Liquidity, and Valuation Trajectory
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs has established a flexible private capitalization strategy that satisfies institutional
              liquidity and capital needs without public market listing scrutiny [CO002]. Following cumulative primary
              funding of over $537M through mid-2024, Grafana closed an August 2024 Series D extension valuing the firm
              at >$6B, followed by a September 2025 secondary transaction led by Ontario Teachers' Pension Plan
              alongside Sapphire Ventures and Tiger Global, which was paired with a $150M employee tender [CO002,
              CO006]. Private secondary tracking indicated marks walking to ~$9.5B by early 2026, reinforced by reports
              of a GIC-led private round in February 2026 [CO002]. Commercial scale has mirrored this capital
              trajectory, compounding from ~$250M ARR in August 2024 to >$400M ARR with 7,000 customers by September
              2025, and hitting $600M ARR with 10,000 customers by August 2026 [CO002, CO004, CO007]. Despite strong
              top-line scale, precise cash burn, GAAP profitability, and preferred liquidation seniority remain
              undisclosed private metrics [CO002, CO012].
