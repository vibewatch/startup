        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              No successful allocated source provides a methodologically comparable currency estimate for observability
              TAM, SAM, or Grafana's attainable share. The strongest available measures are adoption proxies with
              different denominators. Infra Play reproduces company-originated claims of 7,000+ customer organizations
              and penetration of 70% of the Fortune 50; QuantLogix reports 35 million open-source users, but its
              promotional framing and lack of disclosed methodology keep confidence low. Grafana's co-founder also cites
              73% of organizations as using or evaluating OpenTelemetry, without the survey denominator in the fetched
              excerpt. These measures establish reach and standards momentum, not spend. They cannot be multiplied,
              compared as funnel conversion, or treated as an independently verified market-size estimate.
            claimRefs:
              - CM005
