  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Managed Observability Portfolio
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs structures its product delivery around open-source visualization, unified telemetry
              ingestion, and managed enterprise operations. At the user workflow level, engineering and SRE teams
              configure data sources across distributed environments, construct dynamic operational dashboards, and
              correlate metrics, logs, traces, and continuous profiling signals without vendor lock-in. The commercial
              portfolio centers on Grafana Cloud, a fully managed software-as-a-service offering providing centralized
              telemetry management, prebuilt integrations, and automated alerting across both cloud and bare-metal
              systems. For enterprise customers facing sovereignty, data gravity, or strict compliance mandates, Grafana
              provides specialized deployment topologies: Grafana Bring Your Own Cloud (BYOC), which runs managed
              environments inside customer AWS or GCP accounts, and Grafana Federal Cloud, operating with FedRAMP High
              authorization and DoD IL5 compliance.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
