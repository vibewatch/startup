    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Grafana Labs, legally incorporated as Raintank Inc. (doing business as Grafana Labs), is a late-stage
              developer infrastructure and observability software provider founded in 2014 by Raj Dutt, Torkel Ödegaard,
              and Anthony Woods [CO001, CO002]. Headquartered in New York City while operating as a 100% remote-first
              organization with approximately 1,400 to 1,500+ employees distributed across more than 40 countries, the
              company commercializes the default visualization interface for infrastructure telemetry [CO001, CO002,
              CO003]. The company’s commercial model pairs broad open-source adoption—spanning an estimated 25M to 35M
              users of Grafana OSS—with monetization through fully managed Grafana Cloud services, enterprise
              self-managed subscriptions, and workflow automation suites [CO002, CO005, CO007, CO008]. This hybrid
              structure allows Grafana Labs to bypass traditional enterprise sales friction, transforming millions of
              free developer deployments into paying enterprise relationships across diverse deployment tiers [CO002,
              CO007].
