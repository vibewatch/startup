callouts:
  - calloutType: "risk"
    title: "Telemetry Cost Drift as Primary Churn Catalyst"
    body: "The primary driver of customer friction in observability platforms is unplanned cost expansion resulting from high-cardinality metrics and unbounded log retention. While Grafana Labs provides Adaptive Telemetry to mitigate this risk, failure by enterprise buyers to implement strict governance can lead to severe budget drift and procurement renegotiations."
    claimRefs:
      - "CR005"
      - "CR006"
  - calloutType: "insight"
    title: "Architectural Neutrality Buffers Cloud Dependency"
    body: "Unlike closed observability silos, Grafana Labs' support for open standards such as OpenTelemetry and Prometheus alongside Bring Your Own Cloud (BYOC) deployment modes provides meaningful resilience against single-cloud lock-in, enabling multi-cloud hedging."
    claimRefs:
      - "CR010"
      - "CR011"
