    body: "Grafana Labs' core competitive wedge against Datadog and Dynatrace is its 'big tent' composability. By supporting open standards such as OpenTelemetry and Prometheus, and connecting to over 100 distinct data sources, Grafana allows enterprise buyers to query telemetry without undergoing expensive proprietary agent migrations."
