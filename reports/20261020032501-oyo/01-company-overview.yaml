company:
  name: "OYO"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    OYO is a founder-led, global short-stay hospitality platform with 293,554 reported
    storefronts as of December 31, 2025, spanning hotel, home, and listing models. Its
    June 2026 updated IPO filing frames a debt-reduction transaction, but conflicting
    third-party descriptions of SEBI status and missing current cap-table evidence keep
    the financing stage provisional.
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      Oravel Stays Limited is the legal company behind the OYO consumer brand. Third-party
      filing analysis dates incorporation to November 5, 2012 and locates the corporate
      office in Gurugram, while OYO's own history starts the operating story with its first
      property in Gurugram in 2013. The model is broader than a hotel-booking marketplace:
      OYO supplies branding, distribution, pricing, property-management, and operational
      tools to independent property owners, while also using managed, leased, franchise,
      vacation-home, and listing structures. Revenue therefore mixes booking commissions,
      subscriptions, and franchise fees rather than representing a single homogeneous room
      business. That mix supports asset-light expansion but makes storefront totals and
      accounting revenue poor stand-alone measures of underlying operating intensity.
    claimRefs: ["CO001", "CO002", "CO007"]
    tableRefs: ["TO001"]
  - id: "scale-and-economic-footprint"
    title: "Scale and economic footprint"
    body: >-
      The latest allocated evidence reports 293,554 storefronts across more than 35 countries
      at December 31, 2025. Most storefronts were homes or listing-only supply rather than
      hotels, so the headline network count should not be read as an owned-room count or as
      a customer denominator. Reported full-time employment was 3,434 on the same date.
      Operating revenue was INR 6,940.97 crore for the first nine months of FY2026; this is
      revenue for that stub period, not ARR, bookings, or cash available. No verified current
      customer count is present in the assigned evidence, and the 26.43 million "loyal
      members" reported by one broker page is not substituted for customers.
    claimRefs: ["CO003", "CO004", "CO014"]
  - id: "leadership-governance-and-capital"
    title: "Leadership, governance, and capital stakeholders"
    body: >-
      Founder Ritesh Agarwal remains Chairman and a disclosed promoter, making founder
      continuity and succession material diligence issues. OYO's public people pages name
      directors and advisers with operating, accounting, fraud-examination, consumer, and
      investor backgrounds, but they do not provide a complete current executive roster or
      committee map in the assigned text. Prior filing-oriented sources identify SoftBank,
      Lightspeed, Sequoia, Airbnb, and Microsoft among key backers, while the updated filing
      analysis names Ritesh Agarwal, RA Hospitality Holdings, and SoftBank-affiliated SVF
      India Holdings as promoters. These disclosures establish important stakeholders, not
      their current fully diluted ownership, preference rights, voting arrangements, or
      secondary-liquidity intentions.
    claimRefs: ["CO005", "CO006", "CO008"]
    tableRefs: ["TO002", "TO003"]
  - id: "milestones-and-current-stage"
    title: "Milestones and current stage"
    body: >-
      OYO's official timeline records rapid product and geographic expansion from 2013
      through 2021, followed by a materially different capital phase. A third-party analysis
      reports the December 2024 acquisition of G6 Hospitality for approximately USD 525
      million, financed primarily through a USD 830 million term loan. The June 29, 2026
      updated draft prospectus was described as a fresh issue of up to INR 6,650 crore with
      no offer for sale and still awaiting SEBI observations. That detailed filing account
      conflicts with a June 2026 article claiming approval had already been received. The
      prudent current-stage label is therefore "updated DRHP filed; regulatory status requires
      direct confirmation," not "approved" or "listed." A reported USD 7-8 billion target is
      an IPO aspiration, not an independently established present valuation.
    claimRefs: ["CO009", "CO010", "CO011", "CO012", "CO013", "CO015", "CO016"]
    figureRefs: ["FO001"]
