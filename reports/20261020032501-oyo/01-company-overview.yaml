    title: "Company milestone timeline"
    type: "timeline"
    summary: >-
      OYO's official expansion milestones lead into the debt-funded G6 acquisition and a
      still-provisional 2026 IPO process.
    data:
      items:
        - date: "2013"
          label: "First OYO opens"
          detail: "OYO says its first property opened at C68 South City 1 in Gurugram."
          tone: "positive"
          claimRefs: ["CO015"]
        - date: "2014"
          label: "Series A"
          detail: "The official timeline records Series A funding."
          tone: "positive"
          claimRefs: ["CO015"]
        - date: "2015"
          label: "OYO app launches"
          detail: "The consumer app launched as the network expanded across India."
          tone: "positive"
          claimRefs: ["CO015"]
        - date: "2016"
          label: "First expansion outside India"
          detail: "Malaysia became OYO's first region outside India."
          tone: "positive"
          claimRefs: ["CO015"]
        - date: "2018"
          label: "Expansion beyond Asia"
          detail: "The official timeline records entry into the United Kingdom."
          tone: "positive"
          claimRefs: ["CO016"]
        - date: "2018"
          label: "OYO OS launches"
          detail: "OYO introduced an operating system for property managers."
          tone: "positive"
          claimRefs: ["CO016"]
        - date: "2019"
          label: "Vacation-home acquisition"
          detail: "OYO acquired @Leisure Group to enter vacation homes across 40 countries."
          tone: "positive"
          claimRefs: ["CO016"]
        - date: "2021"
          label: "OYO360 launches"
          detail: "OYO launched a self-onboarding platform for property patrons."
          tone: "positive"
          claimRefs: ["CO016"]
        - date: "2024-12"
          label: "G6 Hospitality acquisition"
          detail: "A filing analysis reports a roughly USD 525 million acquisition financed primarily by a USD 830 million term loan."
          tone: "warning"
          claimRefs: ["CO009"]
        - date: "2026-06-29"
          label: "Updated DRHP-I"
          detail: "An updated draft filing proposed up to INR 6,650 crore of fresh issuance with no offer for sale."
          tone: "warning"
          claimRefs: ["CO010", "CO011"]
    approximationNotes: >-
      Dates through 2021 follow OYO's company timeline; the G6 and IPO milestones rely on
      allocated third-party filing analyses, and the IPO regulatory status remains disputed.
    claimRefs: ["CO009", "CO010", "CO011", "CO015", "CO016"]
callouts:
  - calloutType: "risk"
    title: "IPO status is not cleanly corroborated"
    body: >-
      A June article says SEBI approval was received, while a later, filing-specific analysis
      describes the June 29 document as pre-observation. Direct SEBI records and the latest
      filed prospectus are required before treating the offering as approved.
    claimRefs: ["CO010", "CO011", "CO012"]
