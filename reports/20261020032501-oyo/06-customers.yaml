      - ["Property occupancy", "65%-75%", "Not stated in fetched text", "Datanext", "Low", "Suggests utilization across the network", "No property cohort, geography, weighting, or observation window"]
      - ["OYO Wizard members", "More than 10 million", "Data as of 2026-07-05", "Litmus", "Low", "Shows a claimed loyalty audience", "No active, paid, or transacting-member denominator"]
      - ["Repeat rate", "~55%", "Data as of 2026-07-05", "Litmus", "Low", "Offers a directional durability signal", "No cohort, booking window, geography, or audited methodology"]
      - ["India bookings through OYO-owned channels", "90%", "Not stated in fetched text", "Gonukkad", "Low", "Would imply strong direct distribution if verified", "No booking denominator, measurement period, or independent corroboration"]
