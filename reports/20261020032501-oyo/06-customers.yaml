      - [Corporate travelers, "Employee is user; employer or travel manager may pay", "SilverKey, Collection O, and managed business travel", "Corporate page and product guide confirm an acquisition surface", "Potentially repeatable managed demand", "Official positioning without account proof", "Named accounts, room nights, renewal, and contract economics"]
