figures:
  - id: FU001
    title: Claimed customer acquisition and expansion journey
    type: journey-map
    summary: The operating loop joins property-owner acquisition to multi-channel traveler demand, with loyalty and property economics intended to drive repeat activity.
    data:
      nodes:
        - label: Operator acquisition
          name: Operator acquisition
          detail: Independent hotel owners seek occupancy, pricing support, and digital visibility.
          touchpoints:
            - OYO partner outreach
            - Property assessment
        - label: Onboarding and operations
          name: Onboarding and operations
          detail: OYO offers revenue management, inventory, property-management, and guest-experience tools.
          touchpoints:
            - Revenue management
            - Property management system
        - label: Multi-channel distribution
          name: Multi-channel distribution
          detail: Properties are listed across more than ten global OTAs, affiliate sites, and OYO channels.
          touchpoints:
            - OYO channels
            - External travel platforms
        - label: Traveler booking
          name: Traveler booking
          detail: Budget, leisure, corporate, and home-stay segments select an accommodation surface.
          touchpoints:
            - App or website
            - Corporate travel surface
        - label: Stay and service recovery
          name: Stay and service recovery
          detail: Guest support and review response are intended to preserve trust after booking.
          touchpoints:
            - 24-hour customer service
            - Review response
        - label: Repeat and expansion
          name: Repeat and expansion
          detail: Loyalty and direct booking may support repeat demand, while owner economics may support property retention or expansion.
          touchpoints:
            - OYO Wizard
            - Direct channels
    approximationNotes: "The sequence reflects the mechanisms described by retained sources; it does not quantify conversion, retention, or time between stages."
    claimRefs: [CU002, CU003, CU005, CU010, CU011]
callouts:
  - calloutType: insight
    title: Reach is not the same as retention
    body: Public sources offer several large adoption figures, but none supplies a cohort definition, comparable time series, or independent audit.
    claimRefs: [CU007, CU008, CU009, CU010, CU011]
  - calloutType: risk
    title: Partner trust is part of customer durability
    body: Historical disputes over contract changes, payments, discounting, and data transparency make operator renewal evidence as important as traveler repeat evidence.
    claimRefs: [CU013, CU016]
