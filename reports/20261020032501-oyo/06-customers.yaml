      - [Travel managers and public-sector buyers, "Organization is buyer and payer; travelers are users", "Ad hoc through exclusive accommodation arrangements", "Official partner portal claims alliances but names no counterparties", "Potential contracted demand and channel diversification", "Company claim with no disclosed customer reference", "Named counterparties, duration, volume, and concentration"]
