company:
  name: OYO
chapter:
  number: 6
  title: Customers
  summary: >-
    OYO serves a two-sided customer base of accommodation operators and travelers, with corporate travel and loyalty as additional demand surfaces. The assigned evidence shows broad claimed adoption but weak referenceability: no named customer deployment with a dated outcome, audited retention metric, or customer-concentration disclosure was available.
sections:
  - id: two-sided-customer-base
    title: A two-sided base with distinct buyers, users, and payers
    body: >-
      OYO's customer system has two primary sides. Independent accommodation operators supply rooms and pay OYO through revenue share or platform economics, while travelers choose and pay for stays. The official partner portal markets revenue management, property management, channel distribution, guest support, and marketing to operators. On the demand side, OYO's own travel guide positions Townhouse for millennial travelers, OYO Home and Home Luxe for leisure stays, and SilverKey and Collection O for corporate or mixed business-leisure use. A separate OYO for Business page confirms a corporate acquisition surface, but its fetched page does not identify current accounts, transaction volume, or geographic coverage. The segmentation is strategically broad, yet public evidence does not connect each segment to revenue contribution or current active-customer counts.
    claimRefs: [CU001, CU002, CU005, CU006]
    tableRefs: [TU001]
  - id: adoption-signals
    title: Adoption appears broad, but the disclosed metrics are not decision-grade
    body: >-
      The available adoption indicators point to meaningful supply and demand, but nearly all are secondary claims without denominators or reproducible methodology. One analysis reports roughly 12,000 active India hotels in 2024. Another states that OYO serves more than 100 million travelers annually and that properties run at 65% to 75% occupancy, without identifying the measurement period, property cohort, or whether travelers are unique. Litmus reports more than 10 million Wizard members, an approximately 88% app-booking mix, and an approximately 55% repeat rate as of its July 2026 data date; these are useful directional signals, not audited cohort retention. Gonukkad's claim that 90% of India bookings come through OYO-owned channels likewise lacks a disclosed transaction base. The evidence supports reach, but not a clean adoption trajectory.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU002]
  - id: acquisition-to-expansion
    title: The expansion loop links owner tooling, distribution, and traveler loyalty
    body: >-
      OYO's claimed expansion mechanism begins with an operator seeking occupancy and online visibility. The partner portal then offers pricing, inventory, property-management, guest-experience, and content tools before distributing the property through more than ten global online travel agencies, affiliate sites, and OYO channels. Travelers discover and book inventory, after which service and review handling are intended to protect conversion and repeat use. Loyalty through OYO Wizard and direct-channel booking can reduce dependence on external acquisition, while improved property economics can encourage operator retention or portfolio expansion. However, the assigned evidence does not disclose owner renewal, property churn, loyalty activity, or channel-level acquisition cost, so the loop is a supported operating mechanism rather than a quantified retention engine.
    claimRefs: [CU002, CU003, CU004, CU010, CU011]
    figureRefs: [FU001]
  - id: referenceability-and-risk
    title: Named proof, durability, and concentration remain the core diligence gaps
    body: >-
      None of the eight retained sources identifies a named current corporate account or hotel partner together with a dated deployment scope and measurable outcome. OYO's partner page says alliances span travel-management companies, corporations, and government agencies, with arrangements ranging from ad hoc to fully exclusive, but names and economics are absent. The adverse evidence also matters: Markhub summarizes historical partner complaints concerning unilateral contract changes, delayed payments, discounting, and booking-data transparency, alongside traveler complaints about property mismatches, cancellations, overbooking, refunds, and support. Those reports are not current churn measurements, yet they show why logos and booking claims cannot substitute for renewal evidence. Underwriting still requires NRR or equivalent supply retention, traveler cohorts, contract duration, top-account exposure, and channel concentration.
    claimRefs: [CU004, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
