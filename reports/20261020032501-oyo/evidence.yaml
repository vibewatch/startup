evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: ipo-status
    missingEvidence: Direct SEBI records and the latest filed prospectus establishing the current review or approval status.
    whyItMatters: >-
      The difference between a draft filing, observations, approval, and an open book materially changes financing
      certainty.
    diligencePath: >-
      Obtain the current SEBI issue record and issuer-filed prospectus, then reconcile dates against the June 2026
      reports.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Current fully diluted cap table, cumulative capital raised, preferences, promoter pledges, and secondary
      transactions.
    whyItMatters: >-
      Ownership, liquidation economics, dilution, and control cannot be inferred from a historical investor list or
      target valuation.
    diligencePath: >-
      Request the latest capitalization schedule, shareholder agreements, financing documents, and pre-IPO placement
      term sheet.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: A current customer definition and verified count with period, geography, and duplicate-account methodology.
    whyItMatters: Members, guests, bookings, and properties use different denominators and cannot substitute for customer scale.
    diligencePath: Request cohort-level customer and booking extracts reconciled to reported platform metrics.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete current executive, board, committee, tenure, independence, and succession schedule.
    whyItMatters: Public biographies do not establish decision rights, committee coverage, or resilience beyond the founder.
    diligencePath: >-
      Request the current organization chart, board and committee charters, director appointment records, and succession
      plan.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A reputable current market study with a defined base year, geography, lodging-spend boundary, room supply, ADR,
      occupancy, growth methodology, and OYO-eligible segment cuts.
    whyItMatters: >-
      Without common-period inputs, broad hotel-market values cannot be converted into a defensible SAM or SOM for OYO's
      fee-bearing inventory.
    diligencePath: >-
      Obtain a current hospitality-market dataset and reconcile it to OYO's active-room inventory, geography, property
      eligibility, booked nights, and realized take rate.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Current partner contracts, fee schedules, cohort retention, onboarding conversion, room-night production, and
      segment-level contribution economics.
    whyItMatters: >-
      These inputs determine how much fragmented supply is economically obtainable and whether owner adoption converts
      market breadth into durable fee revenue.
    diligencePath: >-
      Review data-room partner agreements and cohort dashboards, then interview a representative sample of current and
      churned hotel owners.
    relatedQuestionRefs:
      - QM004
      - QM006
    relatedTableRefs:
      - TM003
  - type: stale
    severity: material
    topic: corporate-travel
    missingEvidence: >-
      Current corporate-customer count, contracted room nights, geographies, buyer titles, renewal, pricing, and
      budget-owner evidence.
    whyItMatters: >-
      The sparse corporate page confirms positioning but cannot establish present adoption or a measurable corporate
      accommodation segment.
    diligencePath: >-
      Obtain the current corporate sales pipeline, signed-customer roster, cohort retention, and procurement interviews
      segmented by employer size and geography.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: peer-scale
    missingEvidence: Current direct-peer property counts, funding, revenue, geographic mix, and segment share on a comparable basis.
    whyItMatters: Without harmonized current scale data, relative network effects and entrant capacity cannot be underwritten.
    diligencePath: >-
      Obtain current filings, investor materials, and property directories for FabHotels and Treebo, then normalize
      dates and definitions.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Current realized take rates, discounts, guarantees, rebates, termination rights, and channel fees by geography.
    whyItMatters: Public list or estimated rates do not establish partner economics, switching costs, or OYO's pricing power.
    diligencePath: Sample executed OYO and peer franchise agreements and reconcile them to owner payout statements.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: quality-benchmark
    missingEvidence: >-
      Independent, like-for-like guest satisfaction, cancellation, cleanliness, and owner-churn benchmarks across OYO,
      direct peers, and unbranded hotels.
    whyItMatters: The moat depends on standardization outcomes, not merely the documented breadth of OYO's tools.
    diligencePath: Commission a market-matched property cohort study and validate review data against booking and complaint records.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, cash-flow statement, debt and lease maturity schedule, covenants,
      guarantees, and acquisition-financing detail.
    whyItMatters: >-
      Without these items, adjusted EBITDA, PAT, cumulative funding, and acquisition consideration cannot establish
      runway or refinancing resilience.
    diligencePath: >-
      Obtain audited FY26 statements, latest management accounts, bank and debt confirmations, covenant certificates,
      and a 24-month base/downside liquidity model.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: >-
      Realized take rate, recognized-revenue bridge, gross margin, property contribution margin, CAC, sales cycle,
      payback, direct-versus-OTA mix, refunds, incentives, and repeat-booking cohorts.
    whyItMatters: >-
      Public growth metrics cannot show whether OYO retains attractive economics after channel fees, partner support,
      discounts, refunds, and customer remediation.
    diligencePath: >-
      Request monthly segment and channel cohorts for the last 24 months, reconcile GBV to recognized revenue and cash,
      and test contribution margin by property type and geography.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Current public repository, package registry, API forum, engineering talk, practitioner-community, or equivalent
      developer-activity evidence tied to OYO.
    whyItMatters: >-
      Without a developer surface or credible practitioner proxy, technical maturity, release velocity, maintainability,
      and ecosystem adoption cannot be independently assessed.
    diligencePath: >-
      Request OYO's engineering repository and release inventory, then obtain current contribution, deployment,
      incident, and API-adoption metrics with dated exports.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: architecture-and-reliability
    missingEvidence: >-
      Current system architecture, vendor dependencies, data flows, API topology, uptime, latency, incident history,
      disaster recovery tests, and regional deployment controls.
    whyItMatters: >-
      Public workflow descriptions do not establish whether the platform is resilient, scalable, or consistently
      integrated across brands and geographies.
    diligencePath: >-
      Conduct a technical architecture review and inspect twelve months of service-level dashboards, incident
      postmortems, recovery tests, and dependency inventories.
    relatedQuestionRefs:
      - QE003
      - QE004
      - QE008
  - type: private-evidence-only
    severity: material
    topic: trust-and-security
    missingEvidence: >-
      Security certifications, penetration-test results, privacy-impact assessments, data-retention schedules,
      payment-control attestations, breach history, and incident-response exercises.
    whyItMatters: >-
      OYO handles booking, identity, payment, property, and guest data, while retained sources provide no control-level
      substantiation.
    diligencePath: >-
      Review current SOC or ISO reports, PCI scope, pen-test remediation, privacy records, incident register, and
      board-level security reporting.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: roadmap-and-maturity
    missingEvidence: >-
      A dated product roadmap, module-level adoption, deprecation policy, integration catalog, support service levels,
      and property-level quality-audit outcomes.
    whyItMatters: Marketed breadth may conceal uneven maturity, regional variance, legacy systems, or weak partner adoption.
    diligencePath: >-
      Obtain the current roadmap and module telemetry segmented by brand, geography, property cohort, version, support
      tier, and audit result.
    relatedQuestionRefs:
      - QE002
      - QE004
      - QE008
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: >-
      Current NRR or equivalent property retention, traveler repeat cohorts, churn, renewal rates, contract duration,
      and satisfaction metrics.
    whyItMatters: Without cohort and renewal evidence, broad booking or member counts do not establish durable supply or demand.
    diligencePath: >-
      Request audited monthly property cohorts, traveler booking cohorts, cancellations, renewals, and satisfaction
      trends by geography and brand for FY2025-FY2027 year to date.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named hotel partners and institutional travel customers with deployment dates, production scope, outcomes, and
      reference permission.
    whyItMatters: >-
      Unnamed claims cannot distinguish active production relationships from marketing surfaces, pilots, or historical
      arrangements.
    diligencePath: >-
      Obtain at least five reference calls spanning hotel owners, corporate travel buyers, and major regions, then
      reconcile each account to contract and booking records.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-customer, top-property-group, channel, and geography shares of bookings and net revenue, including
      exclusive-contract exposure.
    whyItMatters: >-
      The public evidence cannot quantify dependence on large operator groups, institutional buyers, OYO-owned channels,
      or external OTAs.
    diligencePath: >-
      Review monthly gross booking value and net revenue concentration for the top 10 counterparties, channels, and
      geographies, plus contract termination rights.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: minor
    topic: adoption
    missingEvidence: >-
      Primary definitions and reconciliations for reported traveler, occupancy, loyalty-member, app-mix, repeat-rate,
      and direct-booking metrics.
    whyItMatters: Inconsistent periods and missing denominators prevent a reliable adoption time series or cross-source comparison.
    diligencePath: >-
      Reconcile every public adoption KPI to source-system extracts, definitions, geography, period, unique-user logic,
      and an audited management reporting pack.
    relatedQuestionRefs:
      - QU002
      - QU009
  - type: missing-source
    severity: material
    topic: operating-controls
    missingEvidence: >-
      Current independent security certifications, control attestations, uptime history, incident logs, complaint
      cohorts, and property-level quality-audit results.
    whyItMatters: >-
      Company descriptions of tools do not establish whether controls work consistently across brands, partners, and
      geographies.
    diligencePath: >-
      Request SOC or equivalent reports, penetration-test summaries, incident registers, availability SLAs, refund and
      complaint cohorts, and quality-audit pass rates by brand.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: concentration-and-thresholds
    missingEvidence: >-
      Current lender covenants, maturity ladder, cash interest, top hotel-owner and channel concentrations, payout
      aging, and management-approved trigger thresholds.
    whyItMatters: >-
      Without contractual and denominator-level data, the timing and magnitude of dependency failures cannot be
      quantified.
    diligencePath: >-
      Review debt agreements, treasury schedules, partner and channel concentration reports, payout aging, and board
      risk limits in a management data room.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: legal-risk
    missingEvidence: >-
      Complete matter-by-matter litigation, tax, regulatory, and licensing schedule with claimed amounts, provisions,
      procedural posture, and next deadlines.
    whyItMatters: >-
      Public summaries identify categories of proceedings but cannot establish aggregate downside or whether the listed
      matters are exhaustive.
    diligencePath: >-
      Reconcile the latest prospectus risk schedules to court and regulator dockets and obtain outside-counsel
      probability and loss-range assessments.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Fully diluted cap table, option and warrant schedule, preference waterfall, debt maturities, selling-holder
      allocation, and final primary-versus-secondary offer mix.
    whyItMatters: >-
      These terms determine dilution, enterprise value, proceeds available to the company, and the distribution of exit
      value to new public shareholders.
    diligencePath: >-
      Obtain the updated public DRHP, audited cap-table schedule, debt agreements, and shareholder rights documents
      before setting a price or return target.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: comparable-valuation
    missingEvidence: >-
      A period-aligned public comparable set with enterprise value, revenue, EBITDA, growth, franchise mix, and
      geographic exposure.
    whyItMatters: >-
      Private round marks and an IPO target cannot establish fair value across different transaction dates, security
      rights, and operating scopes.
    diligencePath: >-
      Build a filing-sourced comparable set after the updated prospectus discloses OYO's current share count, net debt,
      segment mix, and normalized EBITDA.
    relatedQuestionRefs:
      - QV005
  - type: missing-source
    severity: material
    topic: g6-integration
    missingEvidence: >-
      Pro-forma G6 revenue, EBITDA, franchise retention, RevPAR, integration costs, and post-acquisition cash
      conversion.
    whyItMatters: >-
      The acquisition materially changed OYO's asset base and financing flows, so legacy results are not sufficient to
      underwrite the combined company's earnings quality.
    diligencePath: >-
      Request audited pro-forma statements, monthly integration KPIs, franchise churn, and management's synergy bridge
      before treating G6 as valuation-accretive.
    relatedQuestionRefs:
      - QV004
      - QV006
