  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Current public repository, package registry, API forum, engineering talk, practitioner-community, or equivalent developer-activity evidence tied to OYO.
      whyItMatters: Without a developer surface or credible practitioner proxy, technical maturity, release velocity, maintainability, and ecosystem adoption cannot be independently assessed.
      diligencePath: Request OYO's engineering repository and release inventory, then obtain current contribution, deployment, incident, and API-adoption metrics with dated exports.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: architecture-and-reliability
      missingEvidence: Current system architecture, vendor dependencies, data flows, API topology, uptime, latency, incident history, disaster recovery tests, and regional deployment controls.
      whyItMatters: Public workflow descriptions do not establish whether the platform is resilient, scalable, or consistently integrated across brands and geographies.
      diligencePath: Conduct a technical architecture review and inspect twelve months of service-level dashboards, incident postmortems, recovery tests, and dependency inventories.
      relatedQuestionRefs: [QE003, QE004, QE008]
    - type: private-evidence-only
      severity: material
      topic: trust-and-security
      missingEvidence: Security certifications, penetration-test results, privacy-impact assessments, data-retention schedules, payment-control attestations, breach history, and incident-response exercises.
      whyItMatters: OYO handles booking, identity, payment, property, and guest data, while retained sources provide no control-level substantiation.
      diligencePath: Review current SOC or ISO reports, PCI scope, pen-test remediation, privacy records, incident register, and board-level security reporting.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: material
      topic: roadmap-and-maturity
      missingEvidence: A dated product roadmap, module-level adoption, deprecation policy, integration catalog, support service levels, and property-level quality-audit outcomes.
      whyItMatters: Marketed breadth may conceal uneven maturity, regional variance, legacy systems, or weak partner adoption.
      diligencePath: Obtain the current roadmap and module telemetry segmented by brand, geography, property cohort, version, support tier, and audit result.
      relatedQuestionRefs: [QE002, QE004, QE008]
