    notes: >-
      Values retain each publisher's metric and denominator; no row is a validated OYO TAM, SAM, or
      SOM, and the incompatible lenses must not be summed.
    claimRefs: [CM008, CM009, CM011, CM014]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Independent hotel, "Owner or operator", "Property staff and guests", "Owner through fees or revenue share", "Onboard inventory, connect channels, manage price and bookings", "Property owner or general manager", "Need for occupancy, distribution, or simpler operations"]
      - [Budget leisure, "Traveler", "Traveler and companions", "Traveler", "Search, compare, book, stay, review", "Household or individual", "Affordable stay with more predictable standards"]
      - [Corporate travel, "Employer or travel function", "Employee traveler", "Employer", "Search or contract, book, reconcile", "Not disclosed", "Need for centrally manageable business accommodation"]
      - [Townhouse, "Value-conscious premium-economy traveler", "Traveler", "Traveler or employer", "Book a branded neighborhood hotel", "Household, individual, or employer", "Preference for a more designed mid-market experience"]
      - [Homes and vacation stays, "Traveler and property owner", "Leisure guest", "Traveler; owner pays platform or management charges", "List or manage home, distribute, book, stay", "Owner and household", "Private-home format or seasonal-demand support"]
      - [SilverKey and Collection O, "Corporate or mixed-purpose traveler", "Business and leisure guest", "Traveler or employer", "Select corporate-oriented accommodation and book", "Not disclosed", "Proximity, work amenities, and cost-efficient quality"]
    notes: >-
      Buyer roles are inferred from official segment descriptions and partner workflows; budget
      ownership, contract values, and procurement authority remain undisclosed.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM012]
figures:
  - id: FM001
    title: Evidence-constrained market hierarchy
    type: pyramid
    summary: >-
      The hierarchy separates a broad, weakly sourced hotel-market estimate from the progressively
      narrower OYO-relevant conversion and demand layers; it is not a proportional TAM/SAM/SOM chart.
    data:
      nodes:
        - label: Broad India hotel market
          value: "Approximately $32B"
          detail: "One low-reputation source; base year and methodology not disclosed."
        - label: Projected India hotel market
          value: "$52B by 2027"
          detail: "Publisher projection without a stated CAGR or methodology."
        - label: Independent and unbranded supply
          value: "90%+ of hotel rooms"
          detail: "Claimed room share, not revenue or automatically partnerable inventory."
        - label: Budget-to-mid-range traveler demand
          value: "Value not disclosed"
          detail: "OYO's stated target segment; current room-night demand is unavailable."
        - label: OYO-relevant owner services
          value: "Pricing, channels, PMS, guest support, marketing, payments"
          detail: "Serviceable layer depends on owner adoption and local operating execution."
        - label: OYO obtainable share
          value: "Not supportable"
          detail: "Requires eligible rooms, ADR, occupancy, take rate, retention, and geography filters."
    approximationNotes: >-
      The first three values are reproduced from one low-reputation secondary source; layer widths and
      order are conceptual and do not encode proportional market size.
    claimRefs: [CM008, CM009, CM003, CM004, CM013]
callouts:
  - calloutType: risk
    title: Market size is not obtainable share
    body: >-
      The public evidence lacks a common-period bridge from hotel spend or room supply to eligible OYO
      inventory, booked room nights, fee take rate, and retained partner revenue. Underwriting a precise
      SAM or SOM from the broad estimates would overstate evidentiary confidence.
    claimRefs: [CM008, CM009, CM013]
