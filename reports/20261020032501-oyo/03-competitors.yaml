company:
  name: "OYO"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    OYO competes simultaneously with branded budget-hotel aggregators, online travel
    agencies, home-sharing platforms, established midscale chains, and unbranded
    independent hotels. Its broad operating toolkit and property portfolio are
    differentiators, but the assigned evidence does not independently establish
    current peer scale, realized pricing, or durable quality superiority.
sections:
  - id: "landscape"
    title: "The competitive set is broader than branded budget aggregators"
    body: >-
      FabHotels and Treebo are the closest named Indian analogues because they also
      standardize independently owned budget or midscale properties. Yet OYO also
      competes with Booking.com, Agoda, and MakeMyTrip for guest discovery and hotel
      distribution; with Airbnb for value-oriented alternative stays; with established
      midscale brands when Townhouse or Collection O moves upmarket; and with the
      fragmented independent supply that a property owner can continue operating
      without a flag. Booking.com is unusually both an alternative route to demand and
      a channel through which OYO distributes inventory. Internal hotel operations and
      direct walk-in demand therefore remain status-quo substitutes, not merely a
      residual category. The evidence names these classes consistently, but current
      peer property counts, funding, and segment shares are not verified in the
      assigned source set.
    claimRefs: [CP005, CP006, CP007, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: "capability-and-distribution"
    title: "OYO differentiates through operating control layered onto distribution"
    body: >-
      OYO's official partner surface presents a bundled proposition: revenue
      management, channel management, property-management software, guest-experience
      support, content marketing, and payment reconciliation. It also says properties
      can be listed across more than ten global online travel agencies and affiliate
      sites. This is a wider operating remit than a pure marketplace listing, and the
      portfolio spans hotel, home, corporate, budget, and midmarket formats. The same
      breadth increases execution complexity, however, because service quality is
      delivered by independently owned properties rather than by a uniformly owned
      estate. The capability advantage is therefore credible as product scope, while
      superior realized outcomes versus peers remain unproven in the available
      evidence.
    claimRefs: [CP001, CP002, CP003, CP004, CP011]
    tableRefs: [TP002]
  - id: "pricing-and-switching"
    title: "Pricing evidence is indicative, while channel dependence limits lock-in"
    body: >-
      One independent but medium-reputation comparison estimates OYO's hotel take at
      20–30% of booking value, Booking.com's hotel commission near 15%, and Airbnb's
      split fees near 3% for hosts plus 14% for guests. These are not contractual or
      independently corroborated realized rates, so they should be treated as
      directional rather than underwritten economics. OYO can create partner switching
      costs through its property-management, pricing, inventory, and reconciliation
      workflows, but multi-homing remains structurally possible because the same
      official partner proposition emphasizes distribution across external OTAs.
      That dependence gives large demand aggregators bargaining power even when OYO
      owns the property-level brand and operating layer. Current discounts, guarantees,
      termination terms, and peer contracts remain private-evidence gaps.
    claimRefs: [CP002, CP006, CP012, CP014]
    tableRefs: [TP003]
  - id: "moat-and-adverse-evidence"
    title: "Scale and software can reinforce the moat, but partner trust is the weak link"
    body: >-
      OYO's defensibility rests on combining a recognizable budget brand, broad supply,
      property-level software, revenue management, and multi-channel distribution.
      That combination is harder to reproduce than a listings page alone, and the
      Motel 6 and Studio 6 portfolio described by the assigned analysis broadens the
      competitive base beyond India. The adverse record cuts against a simple network-
      effect thesis: the assigned case study reports hotel-owner allegations involving
      unpaid dues, unilateral contract changes, and aggressive discounting, while also
      cataloguing quality inconsistency and booking-service complaints. A separate
      analysis describes standardization across independent operators as an unresolved
      structural tension. The resulting moat looks operational rather than proprietary:
      it can be durable if partner economics and quality controls hold, but can erode
      through churn, multi-homing, OTA power, or a return to unbranded operation.
    claimRefs: [CP008, CP009, CP010, CP013, CP016]
callouts:
  - calloutType: "strength"
    title: "Full-stack partner tooling is the clearest differentiator"
    body: >-
      OYO publicly offers pricing, channel, property, guest-experience, marketing, and
      payment workflows in one partner proposition, extending beyond pure distribution.
    claimRefs: [CP001, CP002]
  - calloutType: "risk"
    title: "Differentiation depends on partner execution"
    body: >-
      Reported partner disputes and inconsistent property quality indicate that brand
      scale does not by itself guarantee standardized delivery or durable lock-in.
    claimRefs: [CP008, CP009, CP010]
