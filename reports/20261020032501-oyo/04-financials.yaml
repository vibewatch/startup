slug: "oyo"
runDate: "2026-10-20"
company:
  name: "OYO"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    OYO's public narrative has shifted from scale at any cost toward reported profitability:
    secondary sources cite strong Q1 FY26 growth and FY25 adjusted EBITDA progress, while OYO's
    own partner pages describe an asset-light monetization stack built around pricing,
    distribution, property software, and payouts. The evidence is still insufficient for cash
    underwriting because audited cash, burn, debt maturities, realized take rates, customer
    acquisition economics, and segment margins are not available in the assigned public record.
sections:
  - id: "revenue-model"
    title: "Revenue model and monetization mechanics"
    body: >-
      OYO's public operating surfaces support a multi-sided, largely asset-light model rather than
      a simple room-resale business. The hotel-partner proposition combines dynamic revenue
      management, distribution across more than ten online travel agencies and OYO channels,
      property-management software, marketing, payment reconciliation, and weekly payouts. An
      independent strategic review also characterizes the model as franchise-led and less exposed
      to long-term leases. Corporate travel and differentiated accommodation brands broaden the
      demand and product mix, but none of the assigned sources discloses realized commission rates,
      discount leakage, contract duration, or revenue-recognition policies. Consequently, the
      mechanics are visible while the economic capture is not: list-facing capabilities and
      booking distribution should not be mistaken for verified take rate, recognized revenue, or
      gross profit.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI006"]
    tableRefs: ["TI001"]
    figureRefs: ["FI001"]
  - id: "reported-traction"
    title: "Reported traction and profit quality"
    body: >-
      The latest assigned financial summary reports Q1 FY26 revenue of ₹2,019 crore, adjusted
      EBITDA of ₹550 crore, PAT of ₹200 crore, and GBV of ₹7,277 crore, with each metric growing
      sharply year over year. It also reports ₹1,576 crore of Hotels revenue versus ₹443 crore for
      Homes, indicating that Hotels remained the larger reported revenue contributor in that
      quarter. A separate 2026 case study cites FY25 revenue of ₹6,463 crore and adjusted EBITDA of
      ₹1,132 crore. These directional signals are encouraging but remain secondary-source figures
      in the assigned pool. GBV is transaction volume, not revenue; adjusted EBITDA is not cash
      generation; PAT is not a substitute for a cash-flow statement; and cross-period figures
      should not be combined into an annual run rate without audited reconciliation.
    claimRefs: ["CI007", "CI008", "CI009", "CI010", "CI011", "CI012", "CI013"]
    tableRefs: ["TI002"]
  - id: "cost-and-capital"
    title: "Cost structure and capital adequacy"
    body: >-
      Public evidence offers only coarse proxies for the cost base. The franchise-led model should
      reduce owned-real-estate exposure, while a 2022 restructuring cut 600 corporate and
      technology roles from a stated 3,700-person base even as OYO planned 250 hires. Those facts
      show operating flexibility, not current labor efficiency or cash burn. Capital demands also
      remain material: a secondary source describes the G6 Hospitality purchase as a $525 million
      all-cash acquisition, while Tracxn reports $3.47 billion of cumulative funding. Funding raised
      is not cash available, and acquisition consideration does not establish the residual cash
      balance. Without an audited balance sheet, cash-flow statement, debt schedule, working-capital
      bridge, or acquisition-financing detail, runway and refinancing risk cannot be responsibly
      quantified.
    claimRefs: ["CI006", "CI014", "CI015", "CI016"]
    tableRefs: ["TI003"]
  - id: "financial-verdict"
    title: "Financial verdict and underwriting blockers"
    body: >-
      The evidence supports a cautiously improving operating story, not a complete financial
      underwriting case. Reported growth across revenue, adjusted EBITDA, PAT, and GBV suggests
      that the repositioning toward higher-value hotels and broader brands may be producing better
      accounting outcomes. However, revenue quality cannot be scored without segment-level
      recognition policies, realized pricing, refunds and incentives, customer concentration, and
      repeat-booking economics. Margin durability cannot be tested without direct-versus-OTA mix,
      property-level contribution margins, franchise support costs, and G6 integration economics.
      Capital adequacy remains the decisive blocker: investors need current cash, restricted cash,
      debt and lease obligations, burn, working-capital seasonality, and downside liquidity before
      treating adjusted EBITDA or cumulative funding as evidence of self-sufficiency.
    claimRefs: ["CI001", "CI007", "CI008", "CI009", "CI010", "CI011", "CI014", "CI015", "CI016"]
