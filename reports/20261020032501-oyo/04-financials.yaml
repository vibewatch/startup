  - id: "TI003"
    title: "Unit economics and capital adequacy diligence matrix"
    columns: ["Metric or obligation", "Public value/status", "Confidence", "Why it matters", "Required evidence"]
    rows:
      - ["Realized take rate and net revenue retention", "Unavailable", "Low", "Determines revenue capture after discounts, refunds, and partner incentives", "Contract-level billings, recognized revenue, refunds, incentives, and cohort retention"]
      - ["CAC, sales cycle, and payback", "Unavailable", "Low", "Tests whether corporate, direct, and OTA demand can scale efficiently", "Channel-level spend, new customers, repeat rate, gross profit, and payback cohorts"]
      - ["Gross margin and property contribution margin", "Unavailable", "Low", "Separates platform leverage from service-delivery and franchise support costs", "Segment COGS, OTA fees, property support, customer remediation, and contribution profit"]
      - ["Cash, burn, and runway", "Unavailable", "Low", "Adjusted EBITDA and PAT do not establish liquidity or downside resilience", "Audited cash flow, unrestricted cash, monthly burn, working-capital seasonality, and downside plan"]
      - ["Debt, leases, and maturity ladder", "Unavailable", "Low", "Refinancing and fixed obligations can consume reported operating improvement", "Lender schedule, rates, covenants, maturities, leases, guarantees, and restricted cash"]
      - ["G6 acquisition consideration", "$525 million all-cash, secondary-source report", "Medium", "A material acquisition can alter leverage, cash, integration cost, and segment mix", "Purchase accounting, funding sources, assumed liabilities, synergies, and integration spend"]
      - ["Cumulative funding", "$3.47 billion reported by Tracxn", "Medium", "Shows historical external-capital dependence but not current liquidity", "Current cap table, primary financing documents, cash balance, and use-of-funds bridge"]
      - ["Workforce restructuring proxy", "600 roles cut from a 3,700-person base in 2022; 250 hires planned", "High for the historical event", "Shows prior cost reset but not current headcount or personnel efficiency", "Current headcount, personnel expense by function, restructuring charges, and productivity metrics"]
    notes: "Unavailable fields are explicit evidence gaps rather than zero values; funding raised is not cash on hand, and historical restructuring is not a current burn estimate."
    claimRefs: ["CI006", "CI014", "CI015", "CI016"]
