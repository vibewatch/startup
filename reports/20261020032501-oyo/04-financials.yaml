callouts:
  - calloutType: "risk"
    title: "Liquidity remains the gating financial question"
    body: >-
      Reported adjusted EBITDA, PAT, cumulative funding, and transaction volume cannot establish
      cash adequacy. Underwriting should remain conditional on audited cash flow, debt and lease
      schedules, acquisition financing, working-capital seasonality, and a downside runway model.
    claimRefs: ["CI008", "CI009", "CI010", "CI014", "CI015", "CI016"]
