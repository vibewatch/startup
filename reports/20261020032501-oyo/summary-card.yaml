  topStrengths:
    - Reported global scale of 293,554 storefronts across more than 35 countries.
    - Reported FY25 profitability and positive operating cash flow indicate an operating turn.
    - Broad partner platform and multi-brand portfolio support an asset-light expansion model.
  topRisks:
    - Leverage remains high, with 75% of proposed IPO proceeds earmarked for debt repayment.
    - Pending legal and regulatory matters include potential Zostel dilution and competition proceedings.
    - The reported $7-8 billion target is materially above OYO's reported 2024 private valuation marks.
    - Property-level quality, partner trust, and G6 integration remain execution-sensitive.
  unresolvedGaps:
    - Latest primary prospectus, final SEBI status, offer terms, book demand, and allocation.
    - Fully diluted cap table, preference waterfall, promoter holdings, and dilution bridge.
    - Current unrestricted cash, debt-maturity ladder, covenants, and pro-forma G6 economics.
    - Audited segment margins, free cash flow, realized take rates, CAC, and unit economics.
    - Verified property and traveler retention cohorts, concentration, and quality metrics.
    - Current architecture, security controls, service levels, and incident history.
