        title: Leadership, governance, and capital stakeholders
        blocks:
          - type: paragraph
            body: >-
              Founder Ritesh Agarwal remains Chairman and a disclosed promoter, making founder continuity and succession
              material diligence issues. OYO's public people pages name directors and advisers with operating,
              accounting, fraud-examination, consumer, and investor backgrounds, but they do not provide a complete
              current executive roster or committee map in the assigned text. Prior filing-oriented sources identify
              SoftBank, Lightspeed, Sequoia, Airbnb, and Microsoft among key backers, while the updated filing analysis
              names Ritesh Agarwal, RA Hospitality Holdings, and SoftBank-affiliated SVF India Holdings as promoters.
