  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than all travel or all lodging. OYO's evidenced core is the
              intermediation and brand layer for hotels, homes, and related short-stay inventory: owners retain the
              property while OYO supplies distribution, technology, revenue management, marketing, and a consumer-facing
              brand. Included spend therefore consists of commissions, franchise or service fees, and other
              consideration linked to room distribution and property support. Hotel real estate ownership, airlines,
              destination activities, and unrelated long-term housing should not be counted without segment evidence.
              The relevant status quo is an independent property selling directly or through third-party online travel
              agencies; branded chains, OTAs, and vacation-rental platforms are adjacent substitutes rather than
              automatically additive TAM. OYO's own portfolio spans budget, mid-market, home, and corporate-oriented
              formats, so valuation should distinguish those buyer jobs instead of applying one undifferentiated
              hospitality multiple.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM008
              - CM009
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Available public evidence supports directional scale, not an auditable TAM/SAM/SOM cascade. A
              low-reputation independent analysis describes India's hotel market as approximately $32 billion, projected
              to reach $52 billion by 2027, and says more than 90% of rooms are independent and unbranded. Those figures
              imply a large conversion pool but disclose neither a base year nor a methodology, CAGR, room-night
              denominator, or the share economically reachable by OYO. Other lenses show breadth rather than market
              value: a 2026 case study says OYO operates in more than 35 countries, while Tracxn reports 568 active
              competitors, 15 funded. These measures cannot be added or treated as revenue opportunity. A financeable
              sizing model still needs current room supply, average daily rate, occupancy, take rate, geography, and
              eligible-property filters tied to the same period.
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM014
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Hotel owners or operators are the principal supply-side buyer and economic payer for OYO's property
              services; travelers are the booking user and ultimately fund room revenue. OYO's partner page markets
              AI-enabled pricing, distribution to more than ten global OTAs and affiliate sites, a property-management
              system, guest support, content marketing, and payment reconciliation. This indicates an adoption path from
              listing and channel expansion through operating-system use, rather than a single booking lead. Demand
              segments are also distinct: OYO's official material positions Townhouse toward millennial travelers, OYO
              Home toward private-home stays, SilverKey toward corporate workers, and Collection O toward business and
              leisure guests. The corporate surface confirms a business solution exists, but its sparse content does not
              establish who owns the travel budget, contract size, renewal behavior, or present geographic coverage.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Fragmented hotel supply is the central structural driver because independent owners can gain brand
              visibility, channels, pricing tools, and operational software without selling the asset. Product breadth
              can extend demand beyond leisure into corporate and longer-stay use cases, while direct OYO channels and
              third-party OTAs can broaden occupancy sources. The same model creates execution constraints: an
              independent analysis flags competition from hotel chains and OTAs, quality consistency across properties,
              customer concerns, and profitability sensitivity to occupancy. OYO's 2026 case study also describes
              earlier regulatory issues and partner disputes, which makes trust and local execution part of adoption
              timing rather than a separate risk topic. Board-level fraud and audit credentials are a governance input,
              not proof that property-level controls work. Valuation should therefore reward verified fee growth and
              partner retention, not gross market estimates or unsigned inventory.
            claimRefs:
              - CM002
              - CM003
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market size is not obtainable share
            body: >-
              The public evidence lacks a common-period bridge from hotel spend or room supply to eligible OYO
              inventory, booked room nights, fee take rate, and retained partner revenue. Underwriting a precise SAM or
              SOM from the broad estimates would overstate evidentiary confidence.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is broader than branded budget aggregators
        blocks:
          - type: paragraph
            body: >-
              FabHotels and Treebo are the closest named Indian analogues because they also standardize independently
              owned budget or midscale properties. Yet OYO also competes with Booking.com, Agoda, and MakeMyTrip for
              guest discovery and hotel distribution; with Airbnb for value-oriented alternative stays; with established
              midscale brands when Townhouse or Collection O moves upmarket; and with the fragmented independent supply
              that a property owner can continue operating without a flag. Booking.com is unusually both an alternative
              route to demand and a channel through which OYO distributes inventory. Internal hotel operations and
              direct walk-in demand therefore remain status-quo substitutes, not merely a residual category. The
              evidence names these classes consistently, but current peer property counts, funding, and segment shares
              are not verified in the assigned source set.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP006
              - CP016
      - number: '3.2'
        title: OYO differentiates through operating control layered onto distribution
        blocks:
          - type: paragraph
            body: >-
              OYO's official partner surface presents a bundled proposition: revenue management, channel management,
              property-management software, guest-experience support, content marketing, and payment reconciliation. It
              also says properties can be listed across more than ten global online travel agencies and affiliate sites.
              This is a wider operating remit than a pure marketplace listing, and the portfolio spans hotel, home,
              corporate, budget, and midmarket formats. The same breadth increases execution complexity, however,
              because service quality is delivered by independently owned properties rather than by a uniformly owned
              estate. The capability advantage is therefore credible as product scope, while superior realized outcomes
              versus peers remain unproven in the available evidence.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP007
              - CP009
              - CP010
      - number: '3.3'
        title: Pricing evidence is indicative, while channel dependence limits lock-in
        blocks:
          - type: paragraph
            body: >-
              One independent but medium-reputation comparison estimates OYO's hotel take at 20–30% of booking value,
              Booking.com's hotel commission near 15%, and Airbnb's split fees near 3% for hosts plus 14% for guests.
              These are not contractual or independently corroborated realized rates, so they should be treated as
              directional rather than underwritten economics. OYO can create partner switching costs through its
              property-management, pricing, inventory, and reconciliation workflows, but multi-homing remains
              structurally possible because the same official partner proposition emphasizes distribution across
              external OTAs. That dependence gives large demand aggregators bargaining power even when OYO owns the
              property-level brand and operating layer. Current discounts, guarantees, termination terms, and peer
              contracts remain private-evidence gaps.
            claimRefs:
              - CP002
              - CP006
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: Scale and software can reinforce the moat, but partner trust is the weak link
        blocks:
          - type: paragraph
            body: >-
              OYO's defensibility rests on combining a recognizable budget brand, broad supply, property-level software,
              revenue management, and multi-channel distribution. That combination is harder to reproduce than a
              listings page alone, and the Motel 6 and Studio 6 portfolio described by the assigned analysis broadens
              the competitive base beyond India. The adverse record cuts against a simple network- effect thesis: the
              assigned case study reports hotel-owner allegations involving unpaid dues, unilateral contract changes,
              and aggressive discounting, while also cataloguing quality inconsistency and booking-service complaints. A
              separate analysis describes standardization across independent operators as an unresolved structural
              tension. The resulting moat looks operational rather than proprietary: it can be durable if partner
              economics and quality controls hold, but can erode through churn, multi-homing, OTA power, or a return to
              unbranded operation.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Full-stack partner tooling is the clearest differentiator
            body: >-
              OYO publicly offers pricing, channel, property, guest-experience, marketing, and payment workflows in one
              partner proposition, extending beyond pure distribution.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
          - type: callout
            title: Differentiation depends on partner execution
            body: >-
              Reported partner disputes and inconsistent property quality indicate that brand scale does not by itself
              guarantee standardized delivery or durable lock-in.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization mechanics
        blocks:
          - type: paragraph
            body: >-
              OYO's public operating surfaces support a multi-sided, largely asset-light model rather than a simple
              room-resale business. The hotel-partner proposition combines dynamic revenue management, distribution
              across more than ten online travel agencies and OYO channels, property-management software, marketing,
              payment reconciliation, and weekly payouts. An independent strategic review also characterizes the model
              as franchise-led and less exposed to long-term leases. Corporate travel and differentiated accommodation
              brands broaden the demand and product mix, but none of the assigned sources discloses realized commission
              rates, discount leakage, contract duration, or revenue-recognition policies. Consequently, the mechanics
              are visible while the economic capture is not: list-facing capabilities and booking distribution should
              not be mistaken for verified take rate, recognized revenue, or gross profit.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
