chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Oravel Stays Limited is the legal company behind the OYO consumer brand. Third-party filing analysis dates
              incorporation to November 5, 2012 and locates the corporate office in Gurugram, while OYO's own history
              starts the operating story with its first property in Gurugram in 2013. The model is broader than a
              hotel-booking marketplace: OYO supplies branding, distribution, pricing, property-management, and
              operational tools to independent property owners, while also using managed, leased, franchise,
              vacation-home, and listing structures. Revenue therefore mixes booking commissions, subscriptions, and
              franchise fees rather than representing a single homogeneous room business. That mix supports asset-light
              expansion but makes storefront totals and accounting revenue poor stand-alone measures of underlying
              operating intensity.
            claimRefs:
              - CO001
              - CO002
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO010
              - CO011
              - CO013
              - CO014
      - number: '1.2'
        title: Scale and economic footprint
        blocks:
          - type: paragraph
            body: >-
              The latest allocated evidence reports 293,554 storefronts across more than 35 countries at December 31,
              2025. Most storefronts were homes or listing-only supply rather than hotels, so the headline network count
              should not be read as an owned-room count or as a customer denominator. Reported full-time employment was
              3,434 on the same date. Operating revenue was INR 6,940.97 crore for the first nine months of FY2026; this
              is revenue for that stub period, not ARR, bookings, or cash available. No verified current customer count
              is present in the assigned evidence, and the 26.43 million "loyal members" reported by one broker page is
              not substituted for customers.
            claimRefs:
              - CO003
              - CO004
              - CO014
