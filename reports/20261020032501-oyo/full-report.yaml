figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      OYO's official expansion milestones lead into the debt-funded G6 acquisition and a still-provisional 2026 IPO
      process.
    data:
      items:
        - date: '2013'
          label: First OYO opens
          detail: OYO says its first property opened at C68 South City 1 in Gurugram.
          tone: positive
          claimRefs:
            - CO015
        - date: '2014'
          label: Series A
          detail: The official timeline records Series A funding.
          tone: positive
          claimRefs:
            - CO015
        - date: '2015'
          label: OYO app launches
          detail: The consumer app launched as the network expanded across India.
          tone: positive
          claimRefs:
            - CO015
        - date: '2016'
          label: First expansion outside India
          detail: Malaysia became OYO's first region outside India.
          tone: positive
          claimRefs:
            - CO015
        - date: '2018'
          label: Expansion beyond Asia
          detail: The official timeline records entry into the United Kingdom.
          tone: positive
          claimRefs:
            - CO016
        - date: '2018'
          label: OYO OS launches
          detail: OYO introduced an operating system for property managers.
          tone: positive
          claimRefs:
            - CO016
        - date: '2019'
          label: Vacation-home acquisition
          detail: OYO acquired @Leisure Group to enter vacation homes across 40 countries.
          tone: positive
          claimRefs:
            - CO016
        - date: '2021'
          label: OYO360 launches
          detail: OYO launched a self-onboarding platform for property patrons.
          tone: positive
          claimRefs:
            - CO016
        - date: 2024-12
          label: G6 Hospitality acquisition
          detail: >-
            A filing analysis reports a roughly USD 525 million acquisition financed primarily by a USD 830 million term
            loan.
          tone: warning
          claimRefs:
            - CO009
        - date: '2026-06-29'
          label: Updated DRHP-I
          detail: An updated draft filing proposed up to INR 6,650 crore of fresh issuance with no offer for sale.
          tone: warning
          claimRefs:
            - CO010
            - CO011
    approximationNotes: >-
      Dates through 2021 follow OYO's company timeline; the G6 and IPO milestones rely on allocated third-party filing
      analyses, and the IPO regulatory status remains disputed.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO015
      - CO016
  - id: FM001
    title: Evidence-constrained market hierarchy
    type: pyramid
    summary: >-
      The hierarchy separates a broad, weakly sourced hotel-market estimate from the progressively narrower OYO-relevant
      conversion and demand layers; it is not a proportional TAM/SAM/SOM chart.
    data:
      nodes:
        - label: Broad India hotel market
          value: Approximately $32B
          detail: One low-reputation source; base year and methodology not disclosed.
        - label: Projected India hotel market
          value: $52B by 2027
          detail: Publisher projection without a stated CAGR or methodology.
        - label: Independent and unbranded supply
          value: 90%+ of hotel rooms
          detail: Claimed room share, not revenue or automatically partnerable inventory.
        - label: Budget-to-mid-range traveler demand
          value: Value not disclosed
          detail: OYO's stated target segment; current room-night demand is unavailable.
        - label: OYO-relevant owner services
          value: Pricing, channels, PMS, guest support, marketing, payments
          detail: Serviceable layer depends on owner adoption and local operating execution.
        - label: OYO obtainable share
          value: Not supportable
          detail: Requires eligible rooms, ADR, occupancy, take rate, retention, and geography filters.
    approximationNotes: >-
      The first three values are reproduced from one low-reputation secondary source; layer widths and order are
      conceptual and do not encode proportional market size.
    claimRefs:
      - CM008
      - CM009
      - CM003
      - CM004
      - CM013
  - id: FP001
    title: Competitive positioning by distribution reach and operating control
    type: quadrant
    summary: >-
      Ordinal 1–5 synthesis: OYO combines broad distribution with greater property-level control than pure marketplaces,
      while direct peers and substitutes remain less documented.
    data:
      points:
        - label: OYO
          x: 4
          'y': 5
          note: Broad multi-channel distribution and the fullest documented operating toolkit.
        - label: FabHotels / Treebo
          x: 2
          'y': 4
          note: Similar branded model, but current reach and capabilities are not verified in the assigned pool.
        - label: Booking.com / Agoda / MakeMyTrip
          x: 5
          'y': 1
          note: High distribution role with limited property-level operating control in the cited comparison.
        - label: Airbnb
          x: 5
          'y': 2
          note: Broad marketplace reach with host-led property operations.
        - label: Unbranded independents
          x: 1
          'y': 3
          note: Direct property control but limited standardized distribution and brand support.
        - label: Midscale hotel chains
          x: 3
          'y': 5
          note: Higher operating control; direct reach comparison is not quantified in assigned evidence.
    approximationNotes: >-
      Axes are analyst-authored ordinal scores from 1 (low) to 5 (high), not measured market statistics; x represents
      distribution reach and y represents property-level operating control.
    claimRefs:
      - CP002
      - CP006
      - CP016
  - id: FI001
    title: Revenue model to cash-underwriting bridge
    type: flow
    summary: >-
      Public evidence traces supply enablement through reported accounting outputs, but the final cash-conversion step
      remains unverified.
    data:
      nodes:
        - id: partner-supply
          label: Partner property supply
          detail: Independent hotels and homes provide the underlying inventory.
        - id: revenue-management
          label: Revenue management
          detail: OYO describes AI-enabled dynamic pricing intended to improve occupancy and revenue.
        - id: distribution
          label: Distribution
          detail: Inventory is distributed through OYO channels, 10+ OTAs, affiliates, and direct-demand relationships.
        - id: bookings-gbv
          label: Bookings and GBV
          detail: Q1 FY26 GBV was reported at ₹7,277 crore; GBV is not recognized revenue.
        - id: recognized-revenue
          label: Reported revenue
          detail: Q1 FY26 revenue was reported at ₹2,019 crore, including Hotels and Homes.
        - id: accounting-profit
          label: Adjusted EBITDA and PAT
          detail: Q1 FY26 adjusted EBITDA and PAT were reported at ₹550 crore and ₹200 crore.
        - id: cash-conversion
          label: Cash conversion unavailable
          detail: >-
            Cash, working capital, debt service, acquisition funding, and runway are not disclosed in the assigned
            evidence.
      edges:
        - from: partner-supply
          to: revenue-management
        - from: revenue-management
          to: distribution
        - from: distribution
          to: bookings-gbv
        - from: bookings-gbv
          to: recognized-revenue
        - from: recognized-revenue
          to: accounting-profit
        - from: accounting-profit
          to: cash-conversion
    approximationNotes: >-
      No conversion rates, take rates, or cash values are inferred; the sequence shows disclosed mechanics and evidence
      gaps, not value-proportional flows.
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI008
      - CI009
      - CI010
      - CI016
  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: >-
      Public evidence supports four operating layers from demand capture to property execution, while internal technical
      components and control evidence remain undisclosed.
    data:
      layers:
        - label: Demand discovery
          detail: Travelers and corporate buyers discover OYO-branded and affiliated accommodation.
          modules:
            - Consumer search
            - Corporate travel demand
        - label: Booking interfaces
          detail: Consumer and corporate surfaces capture searches, reservations, and stay-management activity.
          modules:
            - OYO booking surface
            - OYO for Business
        - label: Booking and inventory coordination
          detail: Centralized workflows coordinate property availability and reservation updates.
          modules:
            - Centralized booking
            - Real-time inventory updates
        - label: Revenue and distribution
          detail: Partner tools support pricing decisions and distribution across OYO and external channels.
          modules:
            - Dynamic pricing
            - OTA and affiliate channel management
        - label: Property operations
          detail: Property-management and guest-support workflows connect digital reservations to local execution.
          modules:
            - Property management
            - Guest experience support
        - label: Trust and reconciliation
          detail: Audit, review, payment, and reconciliation processes are described publicly but lack control-level evidence.
          modules:
            - Service audits and reviews
            - Payments and reconciliation
    approximationNotes: >-
      The layer sequence is synthesized from public workflow descriptions; it does not assert specific services,
      vendors, APIs, data stores, or deployment boundaries.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE012
      - CE015
  - id: FU001
    title: Claimed customer acquisition and expansion journey
    type: journey-map
    summary: >-
      The operating loop joins property-owner acquisition to multi-channel traveler demand, with loyalty and property
      economics intended to drive repeat activity.
    data:
      nodes:
        - label: Operator acquisition
          name: Operator acquisition
          detail: Independent hotel owners seek occupancy, pricing support, and digital visibility.
          touchpoints:
            - OYO partner outreach
            - Property assessment
        - label: Onboarding and operations
          name: Onboarding and operations
          detail: OYO offers revenue management, inventory, property-management, and guest-experience tools.
          touchpoints:
            - Revenue management
            - Property management system
        - label: Multi-channel distribution
          name: Multi-channel distribution
          detail: Properties are listed across more than ten global OTAs, affiliate sites, and OYO channels.
          touchpoints:
            - OYO channels
            - External travel platforms
        - label: Traveler booking
          name: Traveler booking
          detail: Budget, leisure, corporate, and home-stay segments select an accommodation surface.
          touchpoints:
            - App or website
            - Corporate travel surface
        - label: Stay and service recovery
          name: Stay and service recovery
          detail: Guest support and review response are intended to preserve trust after booking.
          touchpoints:
            - 24-hour customer service
            - Review response
        - label: Repeat and expansion
          name: Repeat and expansion
          detail: >-
            Loyalty and direct booking may support repeat demand, while owner economics may support property retention
            or expansion.
          touchpoints:
            - OYO Wizard
            - Direct channels
    approximationNotes: >-
      The sequence reflects the mechanisms described by retained sources; it does not quantify conversion, retention, or
      time between stages.
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU010
      - CU011
