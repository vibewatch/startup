  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - - Thesis
        - Reported FY25 income and PAT indicate an operating turn
        - Audited current-period growth and cash conversion below the reported trajectory
      - - Thesis
        - G6 adds established US economy lodging brands
        - Weak franchise retention or integration costs that erase expected operating leverage
      - - Anti-thesis
        - Partner quality and brand consistency remain execution-sensitive
        - Verified property-level quality, retention, and refund trends across major regions
      - - Anti-thesis
        - Capital structure and issue economics are not sufficiently disclosed
        - Fully diluted cap table, preference waterfall, debt ladder, and use-of-proceeds bridge
    notes: >-
      The table separates reported operating evidence from unresolved underwriting conditions; no row converts
      accounting profit into cash available to equity holders.
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV011
      - CV014
      - CV015
      - CV016
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside or confirmation trigger
    rows:
      - - Bull
        - Audited growth and cash conversion persist; G6 integrates; preferences are clean
        - $7-8B reported target becomes testable, but return remains unquantifiable without offer terms
        - Low until updated filing is public
        - Confirmed pro-forma margins, cash conversion, and book demand
      - - Base
        - Turnaround persists but disclosure and integration evidence remain incomplete
        - $3.8B December 2024 private mark is a historical anchor, not fair value
        - Most consistent with current evidence
        - Full cap table, debt, preference, and segment disclosures
      - - Bear
        - Quality, travel demand, or G6 integration weakens and financing complexity persists
        - $2.72B July 2024 private mark is a historical downside reference, not a forecast floor
        - Material because execution risks remain
        - Negative cash generation, partner deterioration, or weak IPO demand
    notes: >-
      Scenario values are reported private marks and the reported IPO target from different dates and transaction
      contexts; they are not directly comparable intrinsic valuations or probability-weighted forecasts.
