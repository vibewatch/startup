      - number: '4.2'
        title: Reported traction and profit quality
        blocks:
          - type: paragraph
            body: >-
              The latest assigned financial summary reports Q1 FY26 revenue of ₹2,019 crore, adjusted EBITDA of ₹550
              crore, PAT of ₹200 crore, and GBV of ₹7,277 crore, with each metric growing sharply year over year. It
              also reports ₹1,576 crore of Hotels revenue versus ₹443 crore for Homes, indicating that Hotels remained
              the larger reported revenue contributor in that quarter. A separate 2026 case study cites FY25 revenue of
              ₹6,463 crore and adjusted EBITDA of ₹1,132 crore. These directional signals are encouraging but remain
              secondary-source figures in the assigned pool. GBV is transaction volume, not revenue; adjusted EBITDA is
              not cash generation; PAT is not a substitute for a cash-flow statement; and cross-period figures should
              not be combined into an annual run rate without audited reconciliation.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public evidence offers only coarse proxies for the cost base. The franchise-led model should reduce
              owned-real-estate exposure, while a 2022 restructuring cut 600 corporate and technology roles from a
              stated 3,700-person base even as OYO planned 250 hires. Those facts show operating flexibility, not
              current labor efficiency or cash burn. Capital demands also remain material: a secondary source describes
              the G6 Hospitality purchase as a $525 million all-cash acquisition, while Tracxn reports $3.47 billion of
              cumulative funding. Funding raised is not cash available, and acquisition consideration does not establish
              the residual cash balance. Without an audited balance sheet, cash-flow statement, debt schedule,
              working-capital bridge, or acquisition-financing detail, runway and refinancing risk cannot be responsibly
              quantified.
            claimRefs:
              - CI006
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a cautiously improving operating story, not a complete financial underwriting case.
              Reported growth across revenue, adjusted EBITDA, PAT, and GBV suggests that the repositioning toward
              higher-value hotels and broader brands may be producing better accounting outcomes. However, revenue
              quality cannot be scored without segment-level recognition policies, realized pricing, refunds and
              incentives, customer concentration, and repeat-booking economics. Margin durability cannot be tested
              without direct-versus-OTA mix, property-level contribution margins, franchise support costs, and G6
              integration economics. Capital adequacy remains the decisive blocker: investors need current cash,
              restricted cash, debt and lease obligations, burn, working-capital seasonality, and downside liquidity
              before treating adjusted EBITDA or cumulative funding as evidence of self-sufficiency.
            claimRefs:
              - CI001
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Liquidity remains the gating financial question
            body: >-
              Reported adjusted EBITDA, PAT, cumulative funding, and transaction volume cannot establish cash adequacy.
              Underwriting should remain conditional on audited cash flow, debt and lease schedules, acquisition
              financing, working-capital seasonality, and a downside runway model.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              OYO serves two linked workflows: travelers discover and manage stays, while property operators manage
              inventory, pricing, distribution, guests, content, payments, and reviews. The official partner page
              presents these functions as a single operating suite and says channel management reaches more than ten
              global online travel agencies and affiliates. A separate official corporate page exposes an OYO for
              Business booking surface, although the fetched page does not describe controls, integrations, or service
              levels. On the consumer side, OYO's own guide segments accommodation into Townhouse, OYO Home, SilverKey,
              Collection O, and OYO Home Luxe, with different traveler, work, and stay contexts. This breadth is
              commercially useful, but the pages are marketing descriptions rather than evidence of uniform production
              quality across properties.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
              - CE007
              - CE012
      - number: '5.2'
        title: Operating architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The observable architecture is a workflow stack rather than a disclosed software stack. Guest and
              corporate interfaces feed booking demand; partner tools coordinate inventory, real-time bookings, pricing,
              channels, operations, service, and reconciliation; and execution ultimately occurs at independently
              operated or managed properties. An academic review describes centralized booking, digital property
              onboarding, dynamic pricing, and OYO OS support for daily operations, while a case-study deck
              characterizes OYO OS as combining pricing, audits, dashboards, and AI feedback. These sources establish
              the intended operating model, not the present cloud design, data lineage, API topology, release cadence,
              or deployment reliability. The architecture therefore appears operationally integrated but remains
              technically unverified.
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE008
              - CE012
              - CE015
      - number: '5.3'
        title: Maturity, portfolio breadth, and differentiation
        blocks:
          - type: paragraph
            body: >-
              OYO's defensible product proposition is the combination of accommodation branding, distribution demand,
              and hotel-operating software rather than a single consumer application. Independent but low-authority
              coverage describes the wider PRISM portfolio as spanning OYO, premium hotel brands, Motel 6 and Studio 6,
              European vacation-rental brands, workspaces, and events; it also characterizes technology solutions for
              property management and revenue optimization as an early-stage line. A hospitality-industry book preview
              historically places OYO in a chapter titled "The Big Disruptor," corroborating that external observers
              viewed the model as category-changing. However, neither that historical framing nor current marketing
              proves differentiated algorithms, proprietary data advantage, consistent implementation, or switching
              costs. Diligence should separate portfolio reach from verified technical advantage.
            claimRefs:
              - CE010
              - CE011
              - CE013
      - number: '5.4'
        title: Trust, reliability, security, and roadmap gaps
        blocks:
          - type: paragraph
            body: >-
              Trust and execution are the principal product risks in the allocated evidence. A 2025 case-study deck
              identifies partner retention, partner satisfaction, and consistent service audits as continuing
              challenges, while the academic review says continuous technology adaptation, cybersecurity, privacy,
              consent, and cross-geography regulation require further work. Those are directional warnings, not verified
              incident records. The official ESG URL returned only an independent-director biography in the prefetched
              text, so it supplied no usable detail on privacy controls, security certifications, quality systems, or
              incident response. No allocated source provides uptime history, penetration-test results, data-flow
              documentation, API documentation, public repository/package activity, or a dated roadmap. These omissions
              should be treated as evidence gaps, not as proof that controls or developer activity are absent.
            claimRefs:
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product diligence hinges on operating proof
            body: >-
              Public materials describe a broad and plausible operating platform, but underwriting should require
              current architecture, reliability, security, quality-audit, and product-roadmap evidence before assigning
              a technology premium.
            calloutType: risk
            claimRefs:
              - CE003
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A two-sided base with distinct buyers, users, and payers
        blocks:
          - type: paragraph
            body: >-
              OYO's customer system has two primary sides. Independent accommodation operators supply rooms and pay OYO
              through revenue share or platform economics, while travelers choose and pay for stays. The official
              partner portal markets revenue management, property management, channel distribution, guest support, and
              marketing to operators. On the demand side, OYO's own travel guide positions Townhouse for millennial
              travelers, OYO Home and Home Luxe for leisure stays, and SilverKey and Collection O for corporate or mixed
              business-leisure use. A separate OYO for Business page confirms a corporate acquisition surface, but its
              fetched page does not identify current accounts, transaction volume, or geographic coverage. The
              segmentation is strategically broad, yet public evidence does not connect each segment to revenue
              contribution or current active-customer counts.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
      - number: '6.2'
        title: Adoption appears broad, but the disclosed metrics are not decision-grade
        blocks:
          - type: paragraph
            body: >-
              The available adoption indicators point to meaningful supply and demand, but nearly all are secondary
              claims without denominators or reproducible methodology. One analysis reports roughly 12,000 active India
              hotels in 2024. Another states that OYO serves more than 100 million travelers annually and that
              properties run at 65% to 75% occupancy, without identifying the measurement period, property cohort, or
              whether travelers are unique. Litmus reports more than 10 million Wizard members, an approximately 88%
              app-booking mix, and an approximately 55% repeat rate as of its July 2026 data date; these are useful
              directional signals, not audited cohort retention. Gonukkad's claim that 90% of India bookings come
              through OYO-owned channels likewise lacks a disclosed transaction base. The evidence supports reach, but
              not a clean adoption trajectory.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: The expansion loop links owner tooling, distribution, and traveler loyalty
        blocks:
          - type: paragraph
            body: >-
              OYO's claimed expansion mechanism begins with an operator seeking occupancy and online visibility. The
              partner portal then offers pricing, inventory, property-management, guest-experience, and content tools
              before distributing the property through more than ten global online travel agencies, affiliate sites, and
              OYO channels. Travelers discover and book inventory, after which service and review handling are intended
              to protect conversion and repeat use. Loyalty through OYO Wizard and direct-channel booking can reduce
              dependence on external acquisition, while improved property economics can encourage operator retention or
              portfolio expansion. However, the assigned evidence does not disclose owner renewal, property churn,
              loyalty activity, or channel-level acquisition cost, so the loop is a supported operating mechanism rather
              than a quantified retention engine.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU010
              - CU011
      - number: '6.4'
        title: Named proof, durability, and concentration remain the core diligence gaps
        blocks:
          - type: paragraph
            body: >-
              None of the eight retained sources identifies a named current corporate account or hotel partner together
              with a dated deployment scope and measurable outcome. OYO's partner page says alliances span
              travel-management companies, corporations, and government agencies, with arrangements ranging from ad hoc
              to fully exclusive, but names and economics are absent. The adverse evidence also matters: Markhub
              summarizes historical partner complaints concerning unilateral contract changes, delayed payments,
              discounting, and booking-data transparency, alongside traveler complaints about property mismatches,
              cancellations, overbooking, refunds, and support. Those reports are not current churn measurements, yet
              they show why logos and booking claims cannot substitute for renewal evidence. Underwriting still requires
              NRR or equivalent supply retention, traveler cohorts, contract duration, top-account exposure, and channel
              concentration.
            claimRefs:
              - CU004
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU004
              - CU010
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reach is not the same as retention
            body: >-
              Public sources offer several large adoption figures, but none supplies a cohort definition, comparable
              time series, or independent audit.
            calloutType: insight
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: callout
            title: Partner trust is part of customer durability
            body: >-
              Historical disputes over contract changes, payments, discounting, and data transparency make operator
              renewal evidence as important as traveler repeat evidence.
            calloutType: risk
            claimRefs:
              - CU013
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and underwriting posture
        blocks:
          - type: paragraph
            body: >-
              The risk stack is led by leverage and refinancing dependence. OYO's July 2026 IPO filing contemplated a Rs
              6,650 crore primary issue and earmarked Rs 4,987.5 crore, or 75% of the proceeds, for repayment or
              prepayment of borrowings through a Singapore subsidiary. Total borrowings of Rs 7,485 crore exceeded net
              worth of Rs 6,147 crore at December 31, 2025. This planned deleveraging is tangible, but until proceeds
              settle debt it remains an execution-dependent mitigation. The next tier combines pending legal matters,
              overseas exposure, and network-quality risk. These are linked rather than independent: 83.8% of revenue in
              the nine months ended December 2025 came from outside India, while acquisitions made the United States and
              Europe the two largest regional contributors. The matrix uses qualitative labels rather than probability
              estimates because the public evidence does not disclose loss distributions or control-test results.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
              - CR016
      - number: '7.2'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The most quantifiable legal exposure is the long-running Zostel dispute: OYO's filing, as summarized by
              Moneycontrol, says an adverse outcome could require issuance or transfer of up to 7% of share capital or
              an equivalent monetary amount. Competition Commission of India proceedings also remain pending, with the
              filing warning of possible business and reputational effects from an adverse ruling or additional
              penalties. The same source lists tax, regulatory, and civil proceedings involving the company,
              subsidiaries, promoters, and directors, but the assigned evidence does not enumerate every matter, claimed
              amount, or procedural deadline. Repeated IPO attempts add execution risk rather than a separate legal
              liability: an Economic Times topic page describes the 2026 filing as the third attempt after earlier
              delays and withdrawals. The register is therefore explicitly partial and directs diligence toward the
              underlying prospectus, court dockets, and regulator orders.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR010
      - number: '7.3'
        title: Operating, quality, and technology control risk
        blocks:
          - type: paragraph
            body: >-
              OYO's partner-facing materials describe tools for inventory, real-time bookings, pricing, channel
              distribution, payment reconciliation, and weekly payouts. Those capabilities are relevant mitigations, but
              they are company claims and do not establish uptime, accuracy, payout timeliness, cybersecurity, or
              property-level service consistency. The control burden is broad: OYO's own travel guide describes multiple
              formats spanning Townhouse, Home, SilverKey, Collection O, and Home Luxe, while a third-party
              retrospective characterizes the historical 157,000-property network as operationally difficult and says
              partner trust and quality perception were damaged during rapid expansion. The current ESG page fetched for
              this review supplies a board biography rather than measurable safety, privacy, certification, or incident
              data. This is a disclosure gap, not evidence that controls or incidents are absent. Residual risk stays
              elevated until management provides control attestations, reliability history, complaint trends, and
              brand-level quality outcomes.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Dependencies, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The most important dependencies are public-market access for deleveraging, performance in international
              geographies, acquired-brand integration, and hotel-owner and distribution relationships. Monitor gross
              debt, cash interest, covenant headroom, and the amount of IPO proceeds actually applied to debt; any
              failure to complete the offering without an alternative refinancing plan would weaken the mitigation case.
              For legal matters, require quarterly status, claimed exposure, and outside-counsel probability ranges for
              Zostel, CCI, and other material proceedings. For operations, track property churn, guest complaints,
              refunds, payout aging, booking-system availability, and quality audit pass rates by brand and geography.
              Thesis-break triggers are an adverse Zostel outcome near the disclosed 7% ceiling, material CCI penalties
              or operating restrictions, sustained deterioration in the US or Europe without offsetting growth, or
              rising partner and guest failures despite the stated operating-tool suite. Exact covenant, concentration,
              and incident thresholds require private diligence and are not inferred here.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break conditions
            body: >-
              Reassess the investment case if deleveraging does not close without a credible refinancing alternative, if
              Zostel approaches the disclosed 7% dilution or equivalent cash outcome, if CCI action materially restricts
              operations, or if partner and guest quality indicators worsen despite the stated control suite.
            calloutType: risk
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR011
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more rather than buy or pass. Independent reports place the proposed fresh
              issue at INR 66.5 billion and the targeted equity valuation at $7-8 billion, but the assigned evidence
              does not provide a fully diluted share count, enterprise value, preference waterfall, debt schedule, or a
              pro-forma bridge for G6 Hospitality. That prevents a defensible per-share value, return target, or
              hold-period underwriting. The price signal is also demanding relative to Tracxn's reported December 2024
              post-money mark of $3.8 billion: the IPO target implies roughly 1.8-2.1 times that reference before
              adjusting for dilution, debt, or acquisition effects. This is a negotiation anchor, not an intrinsic-value
              conclusion. Confidence is medium-low, risk is high, and the valuation stance is stretched and unsupported
              pending prospectus-grade evidence.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV008
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: Operating proof and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis has improved because reported FY25 total income reached INR 63.259 billion, profit after tax
              reached INR 2.448 billion, and operating cash flow was positive at INR 3.213 billion. OYO also acquired G6
              Hospitality for $525 million, adding established US brands, while its own partner materials describe
              revenue-management, channel, and property-management tools that can support an asset-light operating
              model. The anti-thesis is that accounting profit and operating cash flow do not establish free cash flow,
              integration success, or durable property-level quality. Independent critical coverage highlights
              partner-quality, cyclicality, international execution, and brand consistency as downside pathways. The
              evidence therefore supports a turnaround signal, not a clean proof of earnings quality or scalable
              public-market economics.
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence triggers
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should use disclosed marks as references rather than manufacture a discounted-cash-flow
              range. The bull case requires the $7-8 billion ask to be supported by audited current-period growth, cash
              conversion, G6 integration metrics, and a clean preference structure. The base case treats the $3.8
              billion December 2024 private mark as a historical anchor and withholds a price view until the updated
              prospectus supplies enterprise-value inputs. The bear case uses the $2.72 billion July 2024 mark as
              another historical reference if quality or integration deteriorates; it is not a forecast floor. Exit
              readiness depends on final SEBI-facing disclosures, book demand, and governance clarity. Thesis-break
              triggers are renewed negative cash generation, material partner quality deterioration, failed G6
              integration, or pricing that remains near the target without transparent dilution and preference terms.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is not yet underwritable
            body: >-
              The reported target cannot be translated into enterprise value or investor return without fully diluted
              ownership, debt, preferences, offer allocation, and pro-forma acquisition economics.
            calloutType: risk
            claimRefs:
              - CV001
              - CV008
              - CV015
              - CV016
          - type: callout
            title: Decision gate
            body: >-
              Reconsider the stance only after current audited financials, G6 integration KPIs, cap-table terms, and
              market-clearing book demand are available.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV014
              - CV016
