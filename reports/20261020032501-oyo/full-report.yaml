        title: Milestones and current stage
        blocks:
          - type: paragraph
            body: >-
              OYO's official timeline records rapid product and geographic expansion from 2013 through 2021, followed by
              a materially different capital phase. A third-party analysis reports the December 2024 acquisition of G6
              Hospitality for approximately USD 525 million, financed primarily through a USD 830 million term loan. The
