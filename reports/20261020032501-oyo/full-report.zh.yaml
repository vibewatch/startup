  - id: FV001
    title: 从证据到决策的推荐逻辑
    type: flow
    summary: 一条按顺序展开的投资判断链说明，为什么即使运营证据有所改善，在报告目标价下仍只能作出“继续研究”的决定。
    data:
      nodes:
        - id: private-marks
          label: 历史私募市场估值
          value: $2.72B to $3.8B in 2024
        - id: operating-turn
          label: 运营拐点
          value: FY25 PAT INR 2.448B
        - id: strategic-scale
          label: 战略规模
          value: $525M G6 acquisition
        - id: platform-breadth
          label: 平台广度
          value: Partner tools and multi-brand stays
        - id: unresolved-risks
          label: 尚未解决的投资判断风险
          value: Quality, integration, and capital structure
        - id: decision
          label: 决策
          value: Research more; do not endorse $7-8B
      edges:
        - source: private-marks
          target: operating-turn
        - source: operating-turn
          target: strategic-scale
        - source: strategic-scale
          target: platform-breadth
        - source: platform-breadth
          target: unresolved-risks
        - source: unresolved-risks
          target: decision
    approximationNotes: 数值来自来源所报告的历史交易或会计数据；该流程传达的是决策顺序，不代表与数值成比例的大小，也不是估值模型。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
