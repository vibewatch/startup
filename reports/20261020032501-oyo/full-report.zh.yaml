        title: 成熟度、组合广度与差异化
        blocks:
          - type: paragraph
            body: >-
              OYO 的可防御产品主张，是把住宿品牌、分销需求和酒店运营软件结合起来，而不是依靠单一消费者应用。独立但权威性较低的报道称更广义的 PRISM 组合覆盖 OYO、高端酒店品牌、Motel 6 和 Studio
              6、欧洲度假租赁品牌、办公空间及活动；同时把物业管理和收益优化技术解决方案描述为早期业务线。酒店业书籍预览曾把 OYO 放在题为 “The Big Disruptor”
              的章节，印证外部观察者曾将其模式视为改变品类。但无论历史定位还是当前营销，都不能证明差异化算法、专有数据优势、一致实施或转换成本。尽调应把组合触达与已验证的技术优势分开。
            claimRefs:
              - CE010
              - CE011
              - CE013
      - number: '5.4'
        title: 信任、可靠性、安全与路线图缺口
        blocks:
          - type: paragraph
            body: >-
              在分配证据中，信任和执行是产品的主要风险。2025
              年案例演示指出伙伴留存、伙伴满意度和一致的服务审计仍是挑战；学术综述称持续技术适配、网络安全、隐私、同意和跨地域监管仍需进一步工作。这些是方向性警示，不是经核实的事故记录。预取文本中的官方 ESG URL
              只返回一份独立董事简介，未提供隐私控制、安全认证、质量体系或事故响应的可用细节。分配来源没有提供正常运行时间历史、渗透测试结果、数据流文档、API
              文档、公开代码库或软件包活动，也没有带日期的路线图。应把这些遗漏视为证据缺口，而不是控制或开发者活动不存在的证明。
            claimRefs:
