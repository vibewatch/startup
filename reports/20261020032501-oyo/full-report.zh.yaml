chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Oravel Stays Limited 是 OYO 消费品牌背后的法律主体。第三方备案分析将其成立日期定为 2012 年 11 月 5 日，办公地址位于 Gurugram；OYO 自己的历史则从 2013 年在
              Gurugram 开设第一家物业开始讲述运营故事。其模式不只是酒店预订市场：OYO
              向独立物业所有者提供品牌、分销、定价、物业管理和运营工具，同时采用托管、租赁、加盟、度假屋和房源等结构。因此收入由预订佣金、订阅费和加盟费组成，并非单一同质化的客房业务。这种组合支持轻资产扩张，但也意味着门店总数和会计收入都不能单独衡量底层运营强度。
            claimRefs:
              - CO001
              - CO002
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO010
              - CO011
              - CO013
              - CO014
      - number: '1.2'
        title: 规模与经济覆盖
        blocks:
          - type: paragraph
            body: >-
              最新分配证据显示，截至 2025 年 12 月 31 日，OYO 在 35 个以上国家拥有 293,554 家门店。多数门店是民宿或仅挂牌房源，而非酒店，因此网络总量不能理解为自有客房数或客户分母。同日全职员工为
              3,434 人。FY2026 前 9 个月经营收入为 INR 6,940.97 crore；这是该短期间收入，不是 ARR、预订额或可用现金。分配证据没有经过核实的当前客户数；某经纪页面报告的 26.43
              million “忠诚会员”也未被替代性地当作客户。
            claimRefs:
              - CO003
              - CO004
              - CO014
      - number: '1.3'
        title: 领导层、治理与资本利益相关方
        blocks:
          - type: paragraph
            body: >-
              创始人 Ritesh Agarwal 仍任董事长并被披露为发起人，使创始人延续性和继任成为重要尽调事项。OYO
              的公开人员页面列出具有运营、会计、欺诈审查、消费者和投资者背景的董事及顾问，但分配文本没有提供完整的当前高管名单或委员会架构。此前面向备案的来源将
              SoftBank、Lightspeed、Sequoia、Airbnb 和 Microsoft 列为主要支持者；更新后的备案分析则列出 Ritesh Agarwal、RA Hospitality Holdings
              和 SoftBank 关联的 SVF India Holdings 为发起人。这些披露能确认重要利益相关方，但不能确认其当前完全稀释后持股、优先权、投票安排或二级流动性意图。
            claimRefs:
