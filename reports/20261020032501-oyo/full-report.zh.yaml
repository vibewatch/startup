      - number: '4.2'
        title: 已报告牵引力与利润质量
        blocks:
          - type: paragraph
            body: >-
              最新分配的财务摘要报告 Q1 FY26 收入 ₹2,019 crore、调整后 EBITDA ₹550 crore、PAT ₹200 crore 和 GBV ₹7,277
              crore，且每项指标同比均大幅增长。摘要还报告 Hotels 收入 ₹1,576 crore、Homes 收入 ₹443 crore，说明该季度 Hotels 仍是较大的报告收入贡献者。另一份 2026
              年案例引用 FY25 收入 ₹6,463 crore 和调整后 EBITDA ₹1,132 crore。这些方向性信号令人鼓舞，但仍是来源池中的二手数字。GBV 是交易量，不是收入；调整后 EBITDA
              不是现金产生；PAT 不能替代现金流量表；未经审计勾稽，不应把跨期间数字拼成年度运行率。
