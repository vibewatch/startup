  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资判断姿态
        blocks:
          - type: paragraph
            body: >-
              风险堆栈由杠杆和再融资依赖主导。OYO 2026 年 7 月 IPO 备案拟议 INR 6,650 crore 新发行，并拨出 INR 4,987.5 crore（即募集资金的
              75%）通过新加坡子公司偿还或提前偿还借款。截至 2025 年 12 月 31 日，总借款 INR 7,485 crore，高于净资产 INR 6,147
              crore。计划去杠杆是实质性缓解措施，但在募集资金偿债完成前，仍取决于执行。下一层风险包括未决法律事项、海外敞口和网络质量风险。这些风险相互关联而非独立：截至 2025 年 12 月的九个月中，83.8%
              收入来自印度以外；收购后美国和欧洲成为两个最大的区域贡献者。由于公开证据未披露损失分布或控制测试结果，矩阵采用定性标签而非概率估计。
            claimRefs:
              - CR002
