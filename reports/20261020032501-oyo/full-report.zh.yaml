  - id: FM001
    title: 受证据约束的市场层级
    type: pyramid
    summary: 该层级将来源薄弱的宽泛酒店市场估计，与逐步收窄的 OYO 相关转化和需求层分开；它不是按比例绘制的 TAM/SAM/SOM 图。
    data:
      nodes:
        - label: India 广义酒店市场
          value: Approximately $32B
          detail: 一个声誉较低的来源；未披露基准年份和方法论。
        - label: India 预计酒店市场
          value: $52B by 2027
          detail: 出版方预测，但未说明 CAGR 或方法论。
        - label: 独立及非品牌供给
          value: 90%+ of hotel rooms
          detail: 声称的客房份额，不是收入，也不代表可自动合作的库存。
        - label: 经济型至中端旅客需求
          value: Value not disclosed
          detail: OYO 自述的目标客群；当前间夜需求不可得。
        - label: OYO 相关业主服务
          value: Pricing, channels, PMS, guest support, marketing, payments
          detail: 可服务层取决于业主采用程度和当地运营执行。
        - label: OYO 可获得份额
          value: Not supportable
          detail: 需要经过符合条件的客房、ADR、入住率、抽成率、留存率和地域筛选。
    approximationNotes: 前三个数值复现自一个声誉较低的二手来源；层宽和顺序是概念性的，不编码市场规模的比例。
    claimRefs:
      - CM008
      - CM009
      - CM003
      - CM004
      - CM013
  - id: FP001
    title: 按分销触达和运营控制力定位竞争格局
    type: quadrant
    summary: 序数 1–5 综合评分：OYO 兼具广泛分销和高于纯平台的物业层面控制力，而直接同行及替代方案的记录更少。
    data:
      points:
        - label: OYO
          x: 4
          'y': 5
          note: 多渠道分销广泛，且拥有记录最完整的运营工具组。
        - label: FabHotels / Treebo
          x: 2
          'y': 4
          note: 模式相近，但指定来源池未验证当前触达和能力。
        - label: Booking.com / Agoda / MakeMyTrip 渠道
          x: 5
          'y': 1
          note: 分销作用强，但所引比较中的物业层面运营控制有限。
        - label: Airbnb
          x: 5
          'y': 2
          note: 平台触达广泛，物业运营由房东主导。
        - label: 非品牌独立酒店
          x: 1
          'y': 3
          note: 直接控制物业，但标准化分销和品牌支持有限。
        - label: 中端酒店连锁
          x: 3
          'y': 5
          note: 运营控制力更高；指定证据未量化直接触达对比。
    approximationNotes: 坐标轴是分析师编制的 1（低）至 5（高）序数评分，不是测量得到的市场统计；x 轴代表分销触达，y 轴代表物业层面运营控制力。
    claimRefs:
      - CP002
      - CP006
      - CP016
  - id: FI001
    title: 收入模式到现金投资判断的桥接
    type: flow
    summary: 公开证据从供给赋能追踪到已报道的会计产出，但最终的现金转化步骤仍未验证。
    data:
      nodes:
        - id: partner-supply
          label: 合作物业供给
          detail: 独立酒店和住宅提供底层库存。
        - id: revenue-management
          label: 收益管理
          detail: OYO 描述了旨在提升入住率和收入的 AI 动态定价。
        - id: distribution
          label: 分销
          detail: 库存通过 OYO 渠道、10+ 个 OTA、关联方及直接需求关系分发。
        - id: bookings-gbv
          label: 预订与 GBV
          detail: Q1 FY26 GBV 报道为 ₹7,277 crore；GBV 不计入确认收入。
        - id: recognized-revenue
          label: 已报道收入
          detail: Q1 FY26 收入报道为 ₹2,019 crore，包括 Hotels and Homes。
        - id: accounting-profit
          label: 调整后 EBITDA 与 PAT
          detail: Q1 FY26 调整后 EBITDA 和 PAT 报道分别为 ₹550 crore 和 ₹200 crore。
        - id: cash-conversion
          label: 现金转化不可得
          detail: 指定证据未披露现金、营运资本、偿债、收购融资及现金跑道。
      edges:
        - from: partner-supply
          to: revenue-management
        - from: revenue-management
          to: distribution
        - from: distribution
          to: bookings-gbv
        - from: bookings-gbv
          to: recognized-revenue
        - from: recognized-revenue
          to: accounting-profit
        - from: accounting-profit
          to: cash-conversion
    approximationNotes: 没有推断转化率、抽成率或现金数值；该序列展示已披露的机制和证据缺口，不代表按价值比例绘制的流向。
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI008
      - CI009
      - CI010
      - CI016
  - id: FE001
    title: 受证据约束的产品架构图
    type: stack
    summary: 公开证据支持从需求捕捉到物业执行的四个运营层，但内部技术组件和控制证据仍未披露。
    data:
      layers:
        - label: 需求发现
          detail: 旅客和企业买家发现 OYO 品牌及关联住宿。
          modules:
            - 消费者搜索
            - 企业差旅需求
        - label: 预订界面
          detail: 面向消费者和企业的界面承接搜索、预订及住宿管理活动。
          modules:
            - OYO 预订界面
            - OYO for Business 企业服务
        - label: 预订与库存协调
          detail: 集中式工作流协调物业可用性和预订更新。
          modules:
            - 集中式预订
            - 实时库存更新
        - label: 收益与分销
          detail: 合作方工具支持定价决策，并在 OYO 及外部渠道分发库存。
          modules:
            - 动态定价
            - OTA 与关联渠道管理
        - label: 物业运营
          detail: 物业管理和住客支持工作流把数字预订接到本地执行。
          modules:
            - 物业管理
            - 住客体验支持
        - label: 信任与对账
          detail: 公开描述了审计、评价、付款和对账流程，但缺少控制层面的证据。
          modules:
            - 服务审计与评价
            - 付款与对账
    approximationNotes: 层级顺序综合自公开工作流描述；它不主张具体服务、供应商、API、数据存储或部署边界。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE012
      - CE015
  - id: FU001
    title: 声称的客户获取与扩张旅程
    type: journey-map
    summary: 运营闭环把物业业主获取与多渠道旅客需求连接起来，并试图用忠诚度和物业经济性推动重复活动。
    data:
      nodes:
        - label: 经营者获取
          name: Operator acquisition
          detail: 独立酒店业主寻求入住率、定价支持和数字曝光。
          touchpoints:
            - OYO partner outreach
            - Property assessment
        - label: 入驻与运营
          name: Onboarding and operations
          detail: OYO 提供收入管理、库存管理、物业管理和宾客体验工具。
          touchpoints:
            - Revenue management
            - Property management system
        - label: 多渠道分销
          name: Multi-channel distribution
          detail: 物业房源分布在十多个全球 OTA、联盟网站和 OYO 渠道上。
          touchpoints:
            - OYO channels
            - External travel platforms
        - label: 旅客预订
          name: Traveler booking
          detail: 预算型、休闲、企业和民宿客群选择住宿入口。
          touchpoints:
            - App or website
            - Corporate travel surface
        - label: 入住与服务补救
          name: Stay and service recovery
          detail: 客服支持和评价回应旨在维持预订后的信任。
          touchpoints:
            - 24-hour customer service
            - Review response
        - label: 复购与扩张
          name: Repeat and expansion
          detail: 忠诚度和直订可能支撑重复需求；业主经济性可能支持留住物业或扩大物业规模。
          touchpoints:
            - OYO Wizard
            - Direct channels
    approximationNotes: 该序列反映保留来源所描述的机制；不量化转化率、留存率或阶段间耗时。
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU010
      - CU011
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 根据已披露状态、潜在影响和可观察到的缓解措施成熟度，对六项后果最重大的剩余风险作定性比较。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
      rows:
        - label: 杠杆与再融资
          values:
            - 去杠杆完成前均为高
            - 高
            - 计划用 IPO 资金偿债
        - label: Zostel 争议
          values:
            - 可能；未量化
            - 高
            - 未披露
        - label: CCI 及其他程序
          values:
            - 可能；未量化
            - 高
            - 未披露
        - label: 海外收入敞口
          values:
            - 持续性
            - 高
            - 地域多元化
        - label: 网络规模下的服务质量
          values:
            - 持续性
            - 高
            - 工具能力为公司所称；结果未经验证
        - label: 酒店、渠道与结算运营
          values:
            - 可能；未量化
            - 高
            - 工具能力为公司所称；控制措施未经验证
    approximationNotes: 这些类别是定性综合，不是测量所得的概率或损失估计；没有可比的控制测试数据集可供使用。
