      - number: '4.4'
        title: 财务结论与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              证据支持谨慎改善的运营故事，但还不是完整的财务投资判断案例。收入、调整后 EBITDA、PAT 和 GBV
              的报告增长，说明转向更高价值酒店和更广品牌可能带来更好的会计结果。然而，没有分部收入确认政策、实际定价、退款与激励、客户集中度及复购经济性，就无法评估收入质量。没有直营与 OTA
              组合、物业层贡献利润、加盟支持成本和 G6 整合经济性，也无法检验利润率持久性。资本充足性仍是决定性障碍：在把调整后 EBITDA
              或累计融资视为自给自足证据前，投资者需要当前现金、受限现金、债务和租赁义务、现金消耗、营运资金季节性及下行情景流动性。
