  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议是“继续研究”，而非买入或放弃。独立报告将拟议新发行规模定为 INR 66.5 billion，将目标股权估值定为 $7-8 billion，但分配证据没有完全稀释后股数、企业价值、优先权瀑布、债务明细或
              G6 Hospitality 的备考桥接。因此无法可靠计算每股价值、回报目标或持有期投资判断结果。相对于 Tracxn 报告的 2024 年 12 月投后估值 $3.8 billion，这一价格信号也偏高：IPO
              目标在计入稀释、债务或收购影响前，约为该参考值的 1.8-2.1 times。这是谈判锚点，不是内在价值结论。在等待招股书级证据前，置信度为中低、风险高，估值立场偏高且缺乏支持。
