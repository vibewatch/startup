      - number: '4.3'
        title: 成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              公开证据只能提供粗略的成本基础代理指标。加盟驱动模式应减少自有地产敞口；2022 年重组从名义 3,700 人的基础上裁减 600 个企业和技术岗位，同时 OYO 计划招聘 250
              人。这些事实说明运营弹性，而非当前劳动效率或现金消耗。资本需求仍然重大：二手来源称 G6 Hospitality 收购是 $525 million 全现金交易，Tracxn 报告累计融资 $3.47
              billion。已筹融资不等于可用现金，收购对价也不能说明剩余现金余额。没有经审计资产负债表、现金流量表、债务明细、营运资金桥接或收购融资细节，就不能负责任地量化资金续航和再融资风险。
