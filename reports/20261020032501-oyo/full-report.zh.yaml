            title: 论点破坏条件
            body: 如果去杠杆无法在没有可信替代再融资方案的情况下完成、Zostel 接近已披露的 7% 稀释或等额现金结果、CCI 行动实质性限制运营，或伙伴与宾客质量指标在既有控制套件下恶化，应重新评估投资案例。
