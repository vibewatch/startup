      - number: '8.2'
        title: 运营证明与反论点
        blocks:
          - type: paragraph
            body: >-
              由于已报告 FY25 总收入达到 INR 63.259 billion、税后利润达到 INR 2.448 billion、经营现金流为正 INR 3.213 billion，投资论点有所改善。OYO 还以
              $525 million 收购 G6
              Hospitality，增加了成熟的美国品牌；其伙伴材料也描述了可支撑轻资产模式的收益管理、渠道和物业管理工具。反论点是，会计利润和经营现金流不能证明自由现金流、整合成功或物业层质量持久。独立批评性报道把伙伴质量、周期性、国际执行和品牌一致性列为下行路径。因此证据支持反转信号，但还不是盈利质量或可规模化公开市场经济性的清晰证明。
            claimRefs:
