      - number: '1.4'
        title: 里程碑与当前阶段
        blocks:
          - type: paragraph
            body: >-
              OYO 官方时间线记录了 2013 至 2021 年间快速的产品和地域扩张，随后进入明显不同的资本阶段。第三方分析称其于 2024 年 12 月以约 USD 525 million 收购 G6
              Hospitality，主要由 USD 830 million 定期贷款融资。2026 年 6 月 29 日更新的招股书草案据称拟发行最多 INR 6,650 crore，且不含老股出售，目前仍在等待 SEBI
              意见。该详细备案说法与一篇声称已经获批的 2026 年 6 月文章相冲突。因此，稳妥的当前阶段标签应是“已提交更新版 DRHP；监管状态需直接确认”，而不是“已批准”或“已上市”。据报 USD 7-8
              billion 的目标是 IPO 期望，不是独立确立的当前估值。
