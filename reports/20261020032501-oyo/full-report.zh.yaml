  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场小于全部旅行或全部住宿。已有证据支持的 OYO 核心，是酒店、民宿及相关短住库存的中介和品牌层：业主保留物业，OYO
              提供分销、技术、收益管理、营销和面向消费者的品牌。因此可计入的支出包括佣金、加盟或服务费，以及与客房分销和物业支持相关的其他对价。没有分部证据时，不应计入酒店地产持有、航空、目的地活动和无关的长期住房。相关现状是独立物业直接销售或通过第三方在线旅行社销售；连锁品牌、OTA
              和度假租赁平台属于相邻替代方案，不能自动叠加进 TAM。OYO 组合覆盖经济型、中端、民宿和企业导向模式，估值应区分这些买方需求，而非套用一个不加区分的酒店业倍数。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM008
              - CM009
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有公开证据支持方向性规模判断，却不足以构建可审计的 TAM/SAM/SOM 级联。一份声誉较低的独立分析称印度酒店市场约为 $32 billion，预计 2027 年达到 $52 billion，并称超过
              90% 的客房由独立、非品牌经营者提供。但这些数字没有披露基准年、方法、CAGR、间夜分母或 OYO 在经济上可触达的份额，最多只能说明潜在转化池很大。其他口径体现的是覆盖面而非市场价值：2026 年案例称
              OYO 在 35 个以上国家运营，Tracxn 则报告 568 个活跃竞争者、其中 15
              个获得融资。这些指标不能相加，也不能直接视为收入机会。可融资的规模模型仍需同一期间的当前客房供给、平均日房价、入住率、抽成率、地域和合资格物业筛选条件。
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM014
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              酒店所有者或经营者是 OYO 物业服务的主要供给侧买方和经济付费方；旅行者是预订用户，并最终支付客房收入。OYO 合作伙伴页面推广 AI 定价、向十多个全球 OTA
              和联盟网站分销、物业管理系统、宾客支持、内容营销和支付对账。采用路径从挂牌和渠道扩张延伸到运营系统使用，而非只获取一次预订线索。需求群体也彼此不同：OYO 官方材料将 Townhouse 定位给千禧一代旅行者，将
              OYO Home 定位给私人住宅住宿，将 SilverKey 定位给企业员工，将 Collection O
              定位给商务和休闲宾客。企业入口确认存在企业解决方案，但内容稀少，无法说明谁掌握差旅预算、合同规模、续约行为或当前地域覆盖。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              酒店供给分散是核心结构性驱动：独立业主无需出售资产，就能获得品牌曝光、渠道、定价工具和运营软件。产品覆盖面可把需求从休闲扩展到企业和长住场景；OYO 直营渠道与第三方 OTA
              也能拓宽入住来源。同一模式带来执行约束：独立分析指出酒店连锁和 OTA 竞争、物业间质量一致性、客户担忧以及盈利对入住率的敏感性。OYO 的 2026
              年案例还描述了早期监管问题和合作伙伴纠纷，使信任与本地执行成为采用时点的一部分，而不是孤立的风险主题。董事会层面的反欺诈和审计资历是治理输入，不代表物业层面的控制有效。因此，估值应奖励已验证的收费增长和伙伴留存，而不是宽泛的市场估算或未签约库存。
            claimRefs:
              - CM002
              - CM003
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 市场规模不等于可取得份额
            body: 公开证据缺少同一期间的桥接关系，无法把酒店支出或客房供给连接到 OYO 合资格库存、已预订间夜、收费抽成率和留存的合作伙伴收入。用宽泛估算去评估精确的 SAM 或 SOM，会夸大证据置信度。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争集合不止品牌化经济型聚合商
        blocks:
          - type: paragraph
            body: >-
              FabHotels 和 Treebo 是最接近的已点名印度类比公司，因为它们同样标准化独立持有的经济型或中端物业。但 OYO 还与 Booking.com、Agoda 和 MakeMyTrip
              争夺宾客发现和酒店分销；与 Airbnb 争夺注重性价比的替代住宿；当 Townhouse 或 Collection O
              上探中高端时，也会与成熟中端品牌竞争；同时还面临业主可以不挂品牌、继续自行运营的分散独立供给。Booking.com 特别之处在于，它既是需求替代路径，也是 OYO
              分销库存的渠道。酒店内部运营和线下直接客流因此仍是现状替代方案，而不是残余类别。来源对这些类别的描述一致，但分配来源集未核实当前同业物业数、融资和分部份额。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP006
              - CP016
      - number: '3.2'
        title: OYO 把运营控制叠加在分销之上形成差异化
        blocks:
          - type: paragraph
            body: >-
              OYO
              官方合作伙伴页面呈现一套组合方案：收益管理、渠道管理、物业管理软件、宾客体验支持、内容营销和支付对账；同时称物业可在十多个全球在线旅行社及联盟网站挂牌。这比纯市场挂牌承担更广的运营职责，组合也覆盖酒店、民宿、企业、经济型和中端模式。但范围越广，执行越复杂，因为服务质量由独立拥有的物业交付，而不是由统一持有的资产组合交付。因此，能力优势作为产品范围是可信的；相对同行的实际优越结果，在现有证据中仍未得到证明。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP007
              - CP009
              - CP010
      - number: '3.3'
        title: 定价证据仅具指示性，渠道依赖限制锁定
        blocks:
          - type: paragraph
            body: >-
              一份独立但声誉中等的比较估算，OYO 酒店抽取预订价值的 20–30%，Booking.com 酒店佣金约 15%，Airbnb 分成费用约为房东 3% 加宾客
              14%。这些不是合同约定或独立交叉印证的实际费率，只能作为方向性信息，不能直接用于评估经济性。OYO
              可通过物业管理、定价、库存和对账流程制造合作伙伴转换成本，但多平台经营仍然结构性可行，因为同一官方合作方案强调通过外部 OTA 分销。这种依赖让大型需求聚合商拥有议价能力，即使 OYO
              掌握物业层品牌和运营层。当前折扣、担保、终止条款和同业合同仍是私有证据缺口。
            claimRefs:
              - CP002
              - CP006
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: 规模和软件可强化护城河，但伙伴信任是薄弱环节
        blocks:
          - type: paragraph
            body: >-
              OYO 的防御力来自可识别的经济型品牌、广泛供给、物业层软件、收益管理和多渠道分销的组合。这个组合比单独的房源页面更难复制；分配分析所述的 Motel 6 和 Studio 6
              组合也让竞争基础超出印度。负面记录削弱了简单网络效应论：分配案例报告酒店业主曾指称欠款、单方面修改合同和激进折扣，同时列举质量不一致及预订服务投诉。另一份分析把独立经营者之间的标准化描述为未解决的结构性张力。因此护城河更像运营能力而非专有资产：只要伙伴经济性和质量控制站得住，它可以持久；但流失、多平台经营、OTA
              权力或回归无品牌运营都可能侵蚀它。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP013
              - CP016
