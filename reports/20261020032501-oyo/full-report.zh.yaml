  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现机制
        blocks:
          - type: paragraph
            body: >-
              OYO 的公开运营入口支持多边、以轻资产为主的模式，而非简单的客房转售业务。酒店伙伴方案结合动态收益管理、通过十多个在线旅行社及 OYO
              渠道分销、物业管理软件、营销、支付对账和每周结算。一份独立战略评估也把该模式定性为加盟驱动、较少暴露于长期租赁。企业差旅和差异化住宿品牌拓宽需求及产品组合，但分配来源没有披露实际佣金率、折扣泄漏、合同期限或收入确认政策。因此机制可见，经济捕获却不清楚：面向挂牌的能力和预订分销不能等同于已验证的抽成率、确认收入或毛利。
