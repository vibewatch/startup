      - number: '7.4'
        title: 依赖、监测指标与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              最重要的依赖包括用于去杠杆的公开市场准入、国际地域表现、收购品牌整合，以及酒店业主和分销关系。应监测总债务、现金利息、契约余量和实际用于偿债的 IPO
              资金；若无法完成发行且没有替代再融资方案，缓解论据会减弱。法律事项应要求按季度更新状态、索赔敞口和外部律师对 Zostel、CCI
              及其他重大程序的概率区间。运营方面，应按品牌和地域跟踪物业流失、宾客投诉、退款、付款账龄、预订系统可用性和质量审计通过率。论点破坏触发器包括接近披露 7% 上限的不利 Zostel 结果、重大 CCI
              处罚或运营限制、美国或欧洲持续恶化且没有增长抵消，或尽管已有运营工具套件，伙伴和宾客失败仍上升。具体契约、集中度和事故阈值需要私有尽调，本文不作推断。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
