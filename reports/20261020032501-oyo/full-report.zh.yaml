      - number: '8.3'
        title: 情景、退出准备度与尽调触发器
        blocks:
          - type: paragraph
            body: >-
              情景分析应把已披露估值作为参考，而不是制造贴现现金流区间。乐观情景要求 $7-8 billion 要价由经审计的当期增长、现金转化、G6 整合指标和清晰的优先股堆叠支撑。基准情景把 2024 年 12 月
              $3.8 billion 私募估值作为历史锚点，等待更新招股书提供企业价值输入后再判断价格。若质量或整合恶化，悲观情景可使用 2024 年 7 月 $2.72 billion
              估值作为另一历史参考，但它不是预测底价。退出准备度取决于面向 SEBI 的最终披露、簿记需求和治理清晰度。论点破坏触发器包括现金再次转负、伙伴质量实质性恶化、G6
              整合失败，或在稀释和优先权条款不透明时价格仍接近目标。
