    title: Regulatory / legal risk register
    columns:
      - Rule, license, or case
      - Jurisdiction
      - Public status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Zostel dispute
        - India
        - Pending; adverse outcome could require up to 7% of share capital or equivalent money
        - Possible, not quantified
        - High
        - No settlement or reserve detail in assigned evidence
        - High dilution or cash-cost tail
        - Obtain current docket, legal opinion, reserve, and cap-table sensitivity
      - - Competition Commission of India proceedings
        - India
        - Proceedings relating to a CCI order remain pending
        - Possible, not quantified
        - High
        - No outcome-specific mitigation disclosed in assigned evidence
        - Penalty, operating, and reputation risk
        - Review orders, appeal posture, potential penalties, and remediation evidence
      - - Tax, regulatory, and civil proceedings
        - Multiple jurisdictions
        - Filing lists matters involving the group, promoters, and directors
        - Variable and not enumerated
        - Medium
        - Ordinary-course framing only
        - Aggregate exposure and deadline uncertainty
        - Reconcile the complete litigation schedule to provisions and contingent liabilities
      - - Multi-jurisdiction operating compliance
        - US, Europe, India, and other markets
        - 83.8% of nine-month revenue to December 2025 was generated outside India
        - Recurring structural exposure
        - High
        - Geographic diversity, but no control inventory in assigned evidence
        - Local regulatory changes can affect most revenue
        - Obtain license, privacy, labor, tax, and franchise compliance matrices by country
    notes: >-
      Partial public-evidence register ordered by assessed severity; likelihood and severity are
      qualitative analyst judgments tied to disclosed status and potential consequence, not
      statistical probabilities. Null case amounts and deadlines remain diligence gaps.
    enumerationScope:
      coverage: partial
      basis: >-
        Matters identified in the assigned 2026 filing coverage and risk sources; the complete
        prospectus schedules and court dockets were not present in the worker evidence pool.
    claimRefs: [CR004, CR006, CR007, CR008, CR010]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Inconsistent property-level service across brands and geographies
        - Recurring execution risk
        - High
        - Partner tools and brand standards are described, but outcomes are unverified
        - High
        - Current complaint, refund, audit-pass, and property-churn cohorts
      - - Pricing, inventory, booking, or channel-management failure
        - Possible, not quantified
        - High
        - OYO claims AI pricing, PMS, and multi-OTA channel tools
        - Medium-high
        - Uptime, incident history, model controls, reconciliation error rates, and SLAs
      - - Delayed or disputed partner payment reconciliation
        - Possible, not quantified
        - High
        - OYO claims easy reconciliation and weekly payouts
        - Medium-high
        - Payout aging, dispute rates, reserves, and partner satisfaction
      - - Control fragmentation across accommodation formats
        - Recurring execution risk
        - Medium-high
        - Multiple formats have defined positioning, but no common control scorecard is disclosed
        - Medium-high
        - Brand-level quality, safety, privacy, and incident metrics
    notes: >-
      Company-issued capability descriptions establish stated mitigations, not their effectiveness.
      Likelihood and residual labels are qualitative because reliability, security, and quality
      denominators are unavailable in the assigned evidence.
    claimRefs: [CR010, CR011, CR012, CR013, CR014, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Deleveraging capital
        - IPO investors and lenders
        - Fund debt repayment and maintain liquidity
        - 75% of proposed IPO proceeds earmarked for debt repayment
        - IPO delay, smaller raise, or refinancing on weaker terms
        - High
        - All-primary issue and stated repayment allocation
        - High until debt is repaid and covenant headroom is verified
      - - International operating markets
        - Guests, owners, and regulators outside India
        - Generate most group revenue
        - 83.8% of nine-month revenue to December 2025
        - Local downturn, regulatory change, or execution miss
        - High
        - Diversification across countries
        - High because exact country and counterparty concentrations are undisclosed
      - - Acquired US and European portfolios
        - G6 Hospitality and Leisure Group businesses
        - Drive the two largest regional revenue shares
        - US 27.1% and Europe 23.6% of revenue in the cited period
        - Integration miss or brand-level performance deterioration
        - High
        - Established regional brands and geographic diversification
        - Medium-high without segment economics and integration KPIs
      - - Hotel and distribution ecosystem
        - Property owners, OTAs, affiliates, and corporate demand partners
        - Supply rooms, distribute inventory, and settle payments
        - OYO states access to 10+ OTAs; counterparty shares are undisclosed
        - Owner churn, channel disruption, pricing error, or payout dispute
        - High
        - PMS, channel management, revenue management, and weekly payout tools
        - Medium-high until churn, SLA, and payout-aging evidence is supplied
    notes: >-
      Concentration figures retain their disclosed revenue periods and denominators. Counterparty,
      covenant, and brand-level concentrations are unknown rather than estimated.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR011, CR012, CR013]
