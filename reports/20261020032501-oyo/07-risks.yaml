callouts:
  - calloutType: risk
    title: Thesis-break conditions
    body: >-
      Reassess the investment case if deleveraging does not close without a credible refinancing
      alternative, if Zostel approaches the disclosed 7% dilution or equivalent cash outcome, if
      CCI action materially restricts operations, or if partner and guest quality indicators
      worsen despite the stated control suite.
    claimRefs: [CR002, CR006, CR007, CR011, CR012, CR016]
