  topStrengths:
    - 据报道，公司已在超过 35 个国家覆盖 293,554 家门店。
    - 据报道，FY25 已实现盈利且经营现金流为正，显示经营状况出现转折。
    - 广泛的合作伙伴平台和多品牌组合，支撑轻资产扩张模式。
  topRisks:
    - 杠杆率仍然很高，拟议 IPO 募集资金的 75% 已指定用于偿还债务。
    - 待决的法律和监管事项包括 Zostel 可能被稀释，以及竞争相关程序。
    - 据报道，$7-8 billion 目标价明显高于 OYO 据报道在 2024 年的私募估值记录。
    - 单物业质量、合作伙伴信任和 G6 整合仍取决于执行。
  unresolvedGaps:
    - 最新版主招股说明书、最终 SEBI 状态、发行条款、簿记需求和配售情况。
    - 完全摊薄后的股权结构表、优先权瀑布、发起人持股情况和稀释桥接表。
    - 当前不受限制的现金、债务到期梯度、契约，以及 G6 的备考经济数据。
    - 经审计的分部利润率、自由现金流、实际抽成率、获客成本（CAC）和单位经济模型。
    - 经核实的物业和旅客留存队列、集中度及质量指标。
    - 当前架构、安全控制、服务水平和事故历史。
