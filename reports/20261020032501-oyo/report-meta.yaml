    Oravel Stays Limited, operating as OYO, is a founder-led global hospitality platform connecting independent
    accommodation operators with travelers. It combines consumer and corporate booking surfaces with operator tools for
    pricing, distribution, property management, guest service, and payments across a multi-brand portfolio.
