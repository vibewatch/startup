callouts:
  - calloutType: risk
    title: Price is not yet underwritable
    body: >-
      The reported target cannot be translated into enterprise value or investor return
      without fully diluted ownership, debt, preferences, offer allocation, and pro-forma
      acquisition economics.
    claimRefs: [CV001, CV008, CV015, CV016]
  - calloutType: recommendation
    title: Decision gate
    body: >-
      Reconsider the stance only after current audited financials, G6 integration KPIs,
      cap-table terms, and market-clearing book demand are available.
    claimRefs: [CV007, CV014, CV016]
