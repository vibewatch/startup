schemaVersion: "report-v2"
artifact: valuation
slug: oyo
runDate: 2026-10-20
company:
  name: OYO
chapter:
  number: 8
  title: Valuation
  summary: >-
    OYO's reported $7-8 billion IPO target sits materially above its disclosed 2024 private
    marks while the available evidence does not expose fully diluted ownership, preferences,
    debt, or pro-forma G6 economics. The appropriate stance is research-more with high risk:
    the profitability turn is relevant, but public evidence is insufficient to underwrite
    the proposed price or a target return.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is research-more rather than buy or pass. Independent reports place
      the proposed fresh issue at INR 66.5 billion and the targeted equity valuation at
      $7-8 billion, but the assigned evidence does not provide a fully diluted share count,
      enterprise value, preference waterfall, debt schedule, or a pro-forma bridge for G6
      Hospitality. That prevents a defensible per-share value, return target, or hold-period
      underwriting. The price signal is also demanding relative to Tracxn's reported December
      2024 post-money mark of $3.8 billion: the IPO target implies roughly 1.8-2.1 times that
      reference before adjusting for dilution, debt, or acquisition effects. This is a
      negotiation anchor, not an intrinsic-value conclusion. Confidence is medium-low, risk
      is high, and the valuation stance is stretched and unsupported pending prospectus-grade
      evidence.
    claimRefs: [CV001, CV005, CV006, CV008, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: operating-proof-and-anti-thesis
    title: Operating proof and anti-thesis
    body: >-
      The thesis has improved because reported FY25 total income reached INR 63.259 billion,
      profit after tax reached INR 2.448 billion, and operating cash flow was positive at
      INR 3.213 billion. OYO also acquired G6 Hospitality for $525 million, adding established
      US brands, while its own partner materials describe revenue-management, channel, and
      property-management tools that can support an asset-light operating model. The
      anti-thesis is that accounting profit and operating cash flow do not establish free
      cash flow, integration success, or durable property-level quality. Independent critical
      coverage highlights partner-quality, cyclicality, international execution, and brand
      consistency as downside pathways. The evidence therefore supports a turnaround signal,
      not a clean proof of earnings quality or scalable public-market economics.
    claimRefs: [CV002, CV003, CV007, CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-diligence-triggers
    title: Scenarios, exit readiness, and diligence triggers
    body: >-
      Scenario analysis should use disclosed marks as references rather than manufacture a
      discounted-cash-flow range. The bull case requires the $7-8 billion ask to be supported
      by audited current-period growth, cash conversion, G6 integration metrics, and a clean
      preference structure. The base case treats the $3.8 billion December 2024 private mark
      as a historical anchor and withholds a price view until the updated prospectus supplies
      enterprise-value inputs. The bear case uses the $2.72 billion July 2024 mark as another
      historical reference if quality or integration deteriorates; it is not a forecast floor.
      Exit readiness depends on final SEBI-facing disclosures, book demand, and governance
      clarity. Thesis-break triggers are renewed negative cash generation, material partner
      quality deterioration, failed G6 integration, or pricing that remains near the target
      without transparent dilution and preference terms.
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV014, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision field, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, Research more, "Reported IPO target but incomplete pricing inputs", "Do not underwrite until prospectus-grade terms are available"]
      - [Confidence, Medium-low, "Multiple independent reports but no primary filing in the assigned pool", "Treat all valuation conclusions as provisional"]
      - [Risk rating, High, "Integration, quality, cyclicality, and capital-structure uncertainty", "Require downside protection and explicit kill criteria"]
      - [Valuation stance, "Stretched / unsupported", "$7-8B target versus $2.72B and $3.8B 2024 private marks", "Use marks as anchors, not fair-value estimates"]
    notes: >-
      Dollar marks are third-party-reported equity valuation references from different 2024
      dates; the $7-8B figure is a reported target, not an independently verified fair value.
    claimRefs: [CV001, CV005, CV006, CV008, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "Reported FY25 income and PAT indicate an operating turn", "Audited current-period growth and cash conversion below the reported trajectory"]
      - [Thesis, "G6 adds established US economy lodging brands", "Weak franchise retention or integration costs that erase expected operating leverage"]
      - [Anti-thesis, "Partner quality and brand consistency remain execution-sensitive", "Verified property-level quality, retention, and refund trends across major regions"]
      - [Anti-thesis, "Capital structure and issue economics are not sufficiently disclosed", "Fully diluted cap table, preference waterfall, debt ladder, and use-of-proceeds bridge"]
    notes: >-
      The table separates reported operating evidence from unresolved underwriting conditions;
      no row converts accounting profit into cash available to equity holders.
    claimRefs: [CV002, CV003, CV007, CV011, CV014, CV015, CV016]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Case, Assumptions, Valuation / return logic, Probability signal, Downside or confirmation trigger]
    rows:
      - [Bull, "Audited growth and cash conversion persist; G6 integrates; preferences are clean", "$7-8B reported target becomes testable, but return remains unquantifiable without offer terms", "Low until updated filing is public", "Confirmed pro-forma margins, cash conversion, and book demand"]
      - [Base, "Turnaround persists but disclosure and integration evidence remain incomplete", "$3.8B December 2024 private mark is a historical anchor, not fair value", "Most consistent with current evidence", "Full cap table, debt, preference, and segment disclosures"]
      - [Bear, "Quality, travel demand, or G6 integration weakens and financing complexity persists", "$2.72B July 2024 private mark is a historical downside reference, not a forecast floor", "Material because execution risks remain", "Negative cash generation, partner deterioration, or weak IPO demand"]
    notes: >-
      Scenario values are reported private marks and the reported IPO target from different
      dates and transaction contexts; they are not directly comparable intrinsic valuations
      or probability-weighted forecasts.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV014]
