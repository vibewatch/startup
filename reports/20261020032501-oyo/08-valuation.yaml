  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: >-
        Fully diluted cap table, option and warrant schedule, preference waterfall, debt
        maturities, selling-holder allocation, and final primary-versus-secondary offer mix.
      whyItMatters: >-
        These terms determine dilution, enterprise value, proceeds available to the company,
        and the distribution of exit value to new public shareholders.
      diligencePath: >-
        Obtain the updated public DRHP, audited cap-table schedule, debt agreements, and
        shareholder rights documents before setting a price or return target.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: comparable-valuation
      missingEvidence: >-
        A period-aligned public comparable set with enterprise value, revenue, EBITDA, growth,
        franchise mix, and geographic exposure.
      whyItMatters: >-
        Private round marks and an IPO target cannot establish fair value across different
        transaction dates, security rights, and operating scopes.
      diligencePath: >-
        Build a filing-sourced comparable set after the updated prospectus discloses OYO's
        current share count, net debt, segment mix, and normalized EBITDA.
      relatedQuestionRefs: [QV005]
    - type: missing-source
      severity: material
      topic: g6-integration
      missingEvidence: >-
        Pro-forma G6 revenue, EBITDA, franchise retention, RevPAR, integration costs, and
        post-acquisition cash conversion.
      whyItMatters: >-
        The acquisition materially changed OYO's asset base and financing flows, so legacy
        results are not sufficient to underwrite the combined company's earnings quality.
      diligencePath: >-
        Request audited pro-forma statements, monthly integration KPIs, franchise churn, and
        management's synergy bridge before treating G6 as valuation-accretive.
      relatedQuestionRefs: [QV004, QV006]
