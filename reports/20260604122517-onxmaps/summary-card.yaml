summary:
  headline: >-
    OnX appears to have built a real, scaled outdoor-mapping subscription platform, but the public record still lacks
    enough revenue-quality, retention, and term disclosure to underwrite the July 2025 ~$1.4B valuation with conviction.
  overallScore: 6.3
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: fair
