    headcount: 400
  topStrengths:
    - >-
      Multi-app platform breadth across Hunt, Offroad, Backcountry, and Fish extends the original hunting wedge into a
      broader outdoor-software bundle
    - >-
      Public growth signals are strong, with ARR reported up 10x through 2022 and nearly tripled again over the
      following three years
    - >-
      Hunt shows unusually strong public customer proof through millions of hunters, high app-store ratings, and
      multi-million download signals
    - The 2025 financing cycle materially reduced near-term capital pressure and added credible late-stage investors
    - The business monetizes through recurring subscriptions plus business licensing rather than one-time map sales
  topRisks:
    - >-
      Map quality depends on external parcel, route, and access datasets that can refresh slowly and still generate
      boundary-confidence complaints
    - >-
      Public disclosure is too thin to underwrite current ARR dollars, revenue, gross margin, NRR, cash, burn, or
      product mix with precision
    - >-
      Competition is fragmented but credible, and switching costs look moderate because offline maps, route tools, and
      boundary features are widely available
    - >-
      Billing, refund, privacy, and consumer-protection friction can convert trust issues into churn and support-cost
      pressure
    - >-
      The current valuation only looks fair if private revenue quality and cap-table terms prove stronger than the
      public record can verify today
  unresolvedGaps:
    - >-
      Current ARR dollars, recognized revenue, gross margin, CAC, payback, NRR, cash balance, and runway remain
      undisclosed
    - >-
      Product-level paid-subscriber counts and mix across Hunt, Offroad, Backcountry, Fish, and business licensing are
      still missing
    - >-
      Series C and later growth-equity documents, including liquidation preferences and governance rights, remain
      private
    - >-
      Security-control depth, incident history, and third-party assurance evidence are not publicly disclosed in enough
      detail
    - Long-term data-licensing economics and refresh-cost burden remain opaque despite their importance to product trust
