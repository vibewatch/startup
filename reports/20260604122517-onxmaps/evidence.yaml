evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-opacity
    missingEvidence: Current ARR, revenue run rate, and supporting margin/retention metrics.
    whyItMatters: >-
      Public growth multiples and valuation signals are hard to underwrite without absolute revenue scale and unit
      economics.
    diligencePath: Request current board deck, monthly KPI pack, and finance model bridge from 2022 Series B to current period.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Full board roster, seat allocation, ownership percentages, and governance rights after the 2025 investment cycle.
    whyItMatters: Control rights, investor influence, and founder dilution cannot be assessed from the public record alone.
    diligencePath: Request cap table, board-consent history, and current governance chart from counsel or CFO.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: subscriber-gap
    missingEvidence: Paid-subscriber count, churn/retention, and product-level subscriber mix behind the reported 3M+ total.
    whyItMatters: >-
      A consumer subscription business cannot be valued well from aggregate subscriber figures without paid conversion
      and cohort quality.
    diligencePath: Request subscriber bridge by app and tier, plus monthly active, paid active, churn, and trial-conversion data.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: round-size-conflict
    missingEvidence: >-
      Authoritative financing documents that resolve whether Summit’s initial 2018 investment should be treated as
      $20.3M or $26M.
    whyItMatters: The discrepancy affects normalized dilution history and the baseline for later funding comparisons.
    diligencePath: Obtain closing press release, board minutes, or executed financing documents for the 2018 round.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: late-stage-financing-terms
    missingEvidence: >-
      Exact terms that connect the official 2025 TCV announcement to the later reported $280M Series C and $1.4B
      valuation.
    whyItMatters: Late-stage valuation, liquidation stack, and investor rights are central to underwriting upside and downside.
    diligencePath: >-
      Request 2025 financing memo, investor syndicate summary, and any amended charter or preferred terms created in the
      late-stage round.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: TO002 executive-roster coverage gap
    missingEvidence: >-
      A complete current executive roster and formal organization chart covering the full leadership bench behind the
      named public leaders.
    whyItMatters: >-
      The public roster is good enough for narrative orientation but not sufficient to evaluate bench depth, succession
      readiness, or decision ownership across product and go-to-market.
    diligencePath: Request current org chart, executive bios, and a leadership-by-function roster from HR or the CEO office.
    relatedQuestionRefs:
      - QO006
      - QO024
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: specialized SAM
    missingEvidence: >-
      A credible public or management-provided market model that isolates paid demand for hunt, fish, off-road, and
      backcountry mapping rather than the broader outdoor-navigation category.
    whyItMatters: >-
      Without a clean SAM estimate, valuation depends on broad category proxies and activity-base reasoning rather than
      a directly measured specialized software market.
    diligencePath: >-
      Request management’s internal TAM/SAM model and subscriber conversion assumptions by product line, then test them
      against cohort retention and regional coverage completeness.
    relatedQuestionRefs:
      - QM019
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: OnX SOM
    missingEvidence: Current paying subscribers, product mix, ARPU, and paid conversion by Hunt, Fish, Offroad, and Backcountry.
    whyItMatters: >-
      SOM is the most decision-useful market figure for underwriting revenue scale, but public sources reviewed here do
      not disclose it.
    diligencePath: Ask management for current subscribers, trial-to-paid conversion, churn, and product-level revenue by geography.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: audience overlap
    missingEvidence: >-
      Unduplicated user overlap across the hunter, angler, OHV, backcountry, and broad outdoor participant populations
      relevant to OnX.
    whyItMatters: >-
      Bottom-up SAM estimates can be materially overstated if participation pools are added together without overlap
      adjustment.
    diligencePath: Use first-party CRM or survey data to build a de-duplicated audience map across products and seasonal cohorts.
    relatedQuestionRefs:
      - QM021
      - QM019
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: international overlay coverage
    missingEvidence: >-
      Province- and country-level inventory of where cadastral, route, crown-land, and recreation overlays are
      commercially licensable outside the current U.S. and Canada footprint.
    whyItMatters: >-
      Geographic expansion appears supply-constrained by data availability, so country-level TAM claims beyond current
      coverage could be overstated.
    diligencePath: Build a market-by-market data-rights inventory before underwriting expansion outside North America.
    relatedQuestionRefs:
      - QM018
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: paid-market-share
    missingEvidence: Paid subscriber counts, paid conversion, and revenue share by onX product and by major rival product line.
    whyItMatters: >-
      Without monetized-share data, public brand or app-usage proxies can overstate how much of the category each vendor
      actually captures in paid revenue.
    diligencePath: >-
      Request monthly and annual paid subscribers, conversion by funnel, and product-level revenue mix for onX and
      benchmark it against any available board / investor materials on rivals.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: multi-homing-and-churn
    missingEvidence: Cohort retention, cancellation reasons, and overlap of users who actively keep multiple mapping apps at once.
    whyItMatters: >-
      The low-switching-cost thesis is directionally supported by reviews, but the investment case needs hard churn and
      overlap data to know whether onX is a habitual home screen app or just one tool in a rotating bundle.
    diligencePath: >-
      Ask for retention curves, churn surveys, and any mobile-analytics or CRM segmentation that distinguishes
      single-app loyalists from multi-app explorers.
    relatedQuestionRefs:
      - QP021
      - QP026
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: data-licensing-economics
    missingEvidence: >-
      Vendor contracts, refresh cadence, and gross-margin impact for land-ownership, recent-imagery, trail-verification,
      and other licensed datasets used inside onX experiences.
    whyItMatters: >-
      If core data inputs are costly, non-exclusive, or operationally fragile, the apparent moat from land-access
      context and trail coverage is less durable than the product surface suggests.
    diligencePath: >-
      Request the mapping and data-vendor list, contract terms, refresh SLAs, and a cost-of-revenue breakdown tied to
