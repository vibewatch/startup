  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-arr-dollars
    missingEvidence: Current ARR, GAAP revenue, and segment mix by Hunt, Offroad, Backcountry, and Business.
    whyItMatters: Without absolute ARR and segment mix, the disclosed growth multipliers cannot be translated into revenue quality, retention, or valuation support.
    diligencePath: Request the last twelve months of subscription bookings, net revenue by product line, and current ARR bridge from management.
    relatedQuestionRefs:
    - QI008
    - QI016
    - QI026
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, and management runway plan after the 2025 Series C.
    whyItMatters: Capital adequacy cannot be underwritten from disclosed funding alone because the company does not publish balance sheet or cash flow data.
    diligencePath: Request the latest board deck, monthly cash flow, and 12-18 month operating plan showing cash balance, burn, and runway assumptions.
    relatedQuestionRefs:
    - QI010
    - QI024
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, app-store mix, web billing mix, CAC, payback period, net revenue retention, and refund rate.
    whyItMatters: The business likely has attractive recurring-revenue characteristics, but margin durability cannot be judged without unit-economics disclosure.
    diligencePath: Ask for cohort retention, billing-channel mix, gross-margin bridge, and fully loaded CAC / payback by product.
    relatedQuestionRefs:
    - QI017
    - QI021
  - type: conflicting-data
    severity: material
    topic: revenue-estimate-conflict
    missingEvidence: A reconciled explanation for why ZoomInfo shows $102.5M while IncFact shows over $500M of annual revenue.
    whyItMatters: A five-fold spread in public estimates makes valuation work highly sensitive to which external database is used.
    diligencePath: Obtain audited or board-level revenue figures and reconcile them against the third-party databases before relying on external benchmarks.
    relatedQuestionRefs:
    - QI008
    - QI022
  - type: access-blocked
    severity: minor
    topic: app-intelligence
    missingEvidence: Readable independent app-intelligence detail for Sensor Tower revenue/download pages, which fetched without extracting the key underlying metrics.
    whyItMatters: App-intelligence data could tighten the bottom-up view of mobile billings and acquisition efficiency, especially for Hunt.
    diligencePath: Collect screenshots or exports from Sensor Tower/AppMagic/data.ai and reconcile them with internal mobile billing data.
    relatedQuestionRefs:
    - QI008
    - QI014
