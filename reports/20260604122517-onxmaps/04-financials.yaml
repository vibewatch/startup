  - CI024
  - CI025
  - CI026
  - CI039
  - CI043
- calloutType: assumption
  title: Series C likely shifted onX from runway risk toward execution risk
  body: The 2025 $280M raise and Summit's profitable-growth language imply that near-term solvency is less of a concern than execution on pricing, retention, and margin discipline. That is still an assumption until cash and EBITDA are disclosed.
