- id: SI004
  title: Capital adequacy, burn proxies, and path to profitability
  body: 'Capital adequacy looks substantially stronger after the 2025 raise than it did in the 2022 window. Premier Alternatives and TexAu both place the latest round at roughly $280M and cumulative funding near $388M, with the company valued around $1.4B. Unlike many venture-backed consumer apps, onX also has an unusual public profitability clue: Summit described the company as showing profitable growth in the 2025 strategic-investment announcement. If that phrasing is directionally accurate, the 2025 capital may have been raised more as growth acceleration capital than as rescue runway.


    Still, cash on hand and burn remain undisclosed. Public salary bands from current roles and broad employee estimates imply a meaningful fixed-cost base across engineering, geospatial data, AI, customer experience, and marketing. That means the path to profitability depends on retaining annual subscribers efficiently, shifting mix toward higher-margin direct or business revenue, and preventing data-quality issues from inflating support costs. The right working assumption is that financing risk fell sharply after Series C, but that precise runway and burn cannot be verified without board-level financials.'
