- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Current ARR and revenue by product
    - Without product-level revenue, growth quality and mix cannot be tied to valuation
    - Request the last-twelve-month revenue bridge across Hunt, Offroad, Backcountry, and Business
  - - Cash balance, burn, and runway
    - The 2025 round looks large, but real liquidity cannot be inferred without balance-sheet data
    - Request monthly cash flow, current cash balance, and runway assumptions from the latest board deck
  - - Gross margin by billing channel
    - Direct web, app-store, and business contracts likely have different economics
    - Request gross-margin bridge by channel and product, including payment and platform fees
  - - CAC, payback, and net revenue retention
    - Strong ARR growth does not prove efficient acquisition or durable retention
    - Request cohort retention, paid acquisition mix, CAC, payback, and NRR by product line
  - - Promo conversion and discount dependence
    - Backcountry's current sale could be opportunistic or structurally required for demand generation
    - Request list-vs-realized ASP and post-promo renewal outcomes
  - - Support and data-quality cost
    - Map accuracy issues can raise support load and churn, but cost is not visible publicly
    - Request ticket volume, refund rate, and map-correction backlog by product
  - - Reconciled revenue estimate
    - ZoomInfo and IncFact diverge too widely to serve as a valuation anchor
    - Provide audited or investor-board revenue figures and reconcile them against the external databases
  - - Business seat count and ACV
    - The business/team channel may improve revenue quality, but its scale is hidden
    - Request business ARR, seat count, ACV, and renewal rate
  notes: These are the main blockers to underwriting margin durability, burn, and path to profitability from public evidence alone. Each row includes the exact evidence request needed to close the gap.
