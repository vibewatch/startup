- id: SI003
  title: Unit economics and sales-efficiency proxies
  body: 'Unit economics are directionally attractive but still under-disclosed. The product set is software-first, billed through annual or monthly subscriptions, and sold into enthusiast categories where offline maps, land ownership data, and workflow-specific features create real willingness to pay. Hunt Elite is especially notable: annual billing at $99.99 is almost $80 cheaper than twelve months of monthly billing, which nudges users toward up-front cash collection and lowers short-term churn risk. Separate app memberships also create room for ARPU expansion among heavy outdoor users, while team licenses add a second path to higher-value seats outside consumer app stores.


    The key drags on realized unit economics are also visible. App-store distribution likely introduces platform fees for mobile-originated subscriptions. Backcountry''s current sale price suggests onX is willing to use discounts aggressively for acquisition or seasonal activation, which may pressure realized ARPU even if list pricing remains healthy. Meanwhile, support materials and adverse reviews show data-quality remediation is a live operating cost: inaccurate property or ownership information can trigger support tickets, update work, and cancellations. Public sources therefore support a positive recurring-revenue thesis, but not a closed-form CAC, payback, gross margin, or NRR model.'
