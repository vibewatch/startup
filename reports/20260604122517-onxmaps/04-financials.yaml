- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Recurring revenue model
    - Standalone subscriptions across three apps plus business seats
