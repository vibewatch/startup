- id: SI005
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is directionally positive on revenue quality and capital access, but still not fully underwritable. onX clearly runs a recurring subscription model with product-specific pricing, broad consumer adoption, and a nascent business/team channel. Official disclosures show years of strong ARR compounding, and the 2025 financing plus profitable-growth language argue that this is not a fragile, promo-only consumer app story. In that sense, the company looks healthier than many outdoor or navigation startups that rely on one niche SKU or one fundraise.


    The blocker is precision. Public databases disagree sharply on revenue, no public source gives ARR dollars, and the company does not disclose cash, burn, gross margin, CAC, payback, NRR, or channel mix. That means investors can defend a thesis that onX is a scaled, probably efficient subscription platform—but not yet a hard valuation model. The next diligence step should be to reconcile actual revenue, billing-channel mix, and margin structure against the strong but incomplete growth narrative now visible in public sources.'
