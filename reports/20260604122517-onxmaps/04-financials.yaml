company:
  name: OnXmaps
chapter:
  number: 4
  title: Financials
  summary: onX monetizes through standalone subscriptions across Hunt, Offroad, and Backcountry plus per-user business licenses. Official disclosures show ARR increased 10x through 2022 and nearly tripled again over the next three years, while outside revenue databases range from $102.5M to over $500M and management does not disclose cash or burn. The 2025 $280M Series C at roughly a $1.4B valuation likely removed near-term financing pressure, but underwriting still hinges on missing ARR, margin, CAC, and segment-mix disclosure.
sections:
- id: SI001
  title: Revenue model, pricing architecture, and recurring revenue quality
  body: 'onX monetizes primarily through recurring subscriptions sold across three standalone adventure-specific apps—Hunt, Offroad, and Backcountry—with separate paid access required for each product. That structure matters financially because it creates a clean recurring-revenue engine, but also lets onX price-discriminate by use case instead of forcing one umbrella bundle. Hunt carries the richest current pricing ladder: $34.99 single-state, $49.99 two-state, $99.99 yearly Elite, and $14.99 monthly Elite. Offroad mirrors the $34.99 / $99.99 annual ladder, while Backcountry presently shows a deep promotional sale that cuts Premium and Elite far below their nominal list prices.


    onX is not purely consumer anymore. The business page makes clear that the company now sells per-user business licenses with team administration, single-invoice renewals, and explicit business-use rights. That matters for revenue quality because consumer subscriptions, in-app renewals, and business/team seats likely have different gross-margin and retention profiles. The support article also confirms a product architecture that encourages stacked spend: a user who hunts, wheels, and backpacks can end up paying for multiple apps rather than one shared subscription.'
