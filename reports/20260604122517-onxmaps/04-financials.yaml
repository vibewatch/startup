- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Hunt subscriptions
    - Standalone consumer membership sold direct and via app stores
    - USD per user per year or month
    - Live; $34.99 / $49.99 / $99.99 yearly or $14.99 monthly Elite
    - High recurring quality if renewals stay strong; annual prepay helps cash conversion
    - Request current Hunt ARR, renewal rates, direct-vs-app-store mix, and refund rate
  - - Offroad subscriptions
    - Standalone consumer membership for motorized trail users
    - USD per user per year
    - Live; $34.99 Premium / $99.99 Elite
    - Recurring and likely healthy gross margin, but seasonal demand can affect growth cadence
    - Request Offroad subscriber count, annual retention, and CAC by acquisition channel
  - - Backcountry subscriptions
    - Standalone consumer membership for hiking / ski / climbing workflows
    - USD per user per year
    - Live; support lists $29.99 Premium while current promo cuts Premium to $9 and Elite to $30
    - Recurring but lower realized ARPU during promotions; evidence of active pricing experimentation
    - Request promo conversion data, post-promo churn, and realized ARPU versus list price
  - - Business / team licenses
    - Per-user seats with team admin, single invoice, and business-use rights
    - USD per seat per year
    - Live; priced per user, quote/detail not public
    - Potentially higher quality than app-store consumer revenue because seats can be direct-billed and centrally renewed
    - Request business ARR, seat count, average contract value, and segment concentration
  - - Multi-product household spend
    - Users can buy more than one standalone app rather than one umbrella subscription
    - USD per user across apps
    - Possible but not disclosed
    - Can lift ARPU for heavy outdoor users, but depends on overlap and cross-sell execution
    - Request overlap of Hunt / Offroad / Backcountry subscribers and attach rate across products
  notes: Rows separate live recurring products from inferred cross-sell behavior. Pricing is current public list or promo pricing; realized revenue, subscriber counts, and segment mix remain undisclosed.
