- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public signal
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Latest valuation
    - 1.4B USD as of Jul 2025
    - Medium
    - Shows investor willingness to fund the business at unicorn scale
    - Verify post-money and any secondary component of the 2025 round
  - - Total disclosed funding
    - 387.7M USD across four rounds
    - Medium
    - Provides a hard ceiling for external capital raised to date
    - Request complete cap table and financing chronology from management
  - - Latest round size
    - 280.0M USD Series C / later-stage VC in Jul 2025
    - Medium
    - Large new capital likely reduced immediate financing pressure
    - Confirm primary vs. secondary mix and intended use of proceeds
  - - Prior round
    - 87.4M USD Series B in Oct 2022
    - High
    - Useful baseline for understanding how much incremental capital was added before the 2025 step-up
    - Request post-Series-B cash burn and how much of that capital remained pre-Series C
  - - Profitability signal
    - Summit called growth profitable in the 2025 announcement
    - Medium
    - Suggests the company may be around breakeven or EBITDA positive rather than deeply cash-burning
    - Request EBITDA, operating income, and free cash flow by year
  - - Cash on hand
    - Undisclosed publicly
    - Low
    - Even a large round does not reveal current liquidity after operating uses or any secondary sales
    - Request latest balance sheet and monthly cash balance
  - - Burn / runway
    - Undisclosed; public sources only support broad cost-base proxies
    - Low
    - Runway cannot be underwritten from fundraising data alone
    - Request board runway analysis and monthly burn trend
  - - Next-round trigger
    - Not publicly disclosed
    - Low
    - If onX is already profitable, next financing may be optional; if not, runway could still matter materially
    - Ask management whether growth can be funded internally under the current plan
  notes: Capital data uses public market-data summaries plus the official Series B disclosure. Cash and burn are intentionally left undisclosed because public evidence does not support a defensible point estimate.
