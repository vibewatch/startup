- calloutType: risk
  title: Public revenue databases are too inconsistent to support a hard valuation model
  body: ZoomInfo and IncFact disagree on revenue by at least a factor of five, while ARR dollars remain undisclosed. Until management reconciles those figures, investors can defend only a qualitative—not precise—valuation view.
  claimRefs:
