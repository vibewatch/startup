callouts:
- calloutType: strength
  title: Recurring revenue quality is visible even if the dollar amount is not
  body: The public record clearly shows a subscription engine, annual-prepay incentives, multiple paid verticals, and a business-seat motion. That combination is a better revenue-quality setup than a one-time transaction or advertising model.
  claimRefs:
  - CI006
  - CI007
  - CI030
