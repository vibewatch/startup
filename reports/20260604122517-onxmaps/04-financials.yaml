    - Annual prepay improves cash collection and can lower churn versus purely monthly billing
    - Request annual-vs-monthly mix and renewal rates
  - - App-store dependence
    - Apple and Google list paid memberships but do not reveal billing mix
    - Low
    - Mobile-originated subscriptions may incur platform fees and lower realized margin than direct web billing
    - Request direct-web vs. app-store billing split and take-rate impact
  - - Pricing experimentation
    - Backcountry promo cuts listed pricing sharply during the current campaign
