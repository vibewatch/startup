    - Discounting may support acquisition but can compress realized ARPU and complicate payback analysis
    - Request promo conversion, retention, and payback cohorts
  - - Hiring / opex signal
    - Current roles span Growth, AI, Hunt, Offroad, Partnerships, Geospatial, and Customer Experience with six-figure salaries
    - Low
    - Continued hiring implies sustained reinvestment rather than pure harvest mode
    - Request total headcount, payroll burden, and hiring plan by function
  - - Data-quality support burden
    - onX acknowledges variable source accuracy and adverse reviews cite unresolved ownership errors
    - Medium
    - Support, corrections, and churn from map issues can reduce contribution margin
    - Request ticket volumes, map-error backlog, and cancellation reasons
  - - Absolute margin / burn
    - Not publicly disclosed
    - Low
    - Gross margin, CAC, payback, NRR, and burn are still the key underwriting gaps
    - Request cohort model, CAC/payback, NRR, and monthly burn
