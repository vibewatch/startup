      - number: '7.5'
        title: Financial exposure, residual risk, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The financial risk is less about imminent collapse than about opacity and adverse unit economics under
              stress. Public sources clearly show the price surface and the existence of a large subscriber base, but
              they do not expose churn, refund rate, customer-support cost, app-store fee leakage, county-data
              acquisition cost, or contribution margin by plan. That means investors cannot tell from public evidence
              whether onX’s attractive outdoor-software story is underwritten by durable subscription economics or by a
              model that becomes brittle if cancellations rise, support demand spikes, or platform and data costs drift
              upward. Pricing pressure is not imaginary: critics already frame recurring land-data subscriptions as
              extractive, while user complaints show that billing and support friction can directly threaten willingness
              to renew. The right underwriting stance is therefore monitor-first. If accuracy complaints persist,
              cancellation friction draws scrutiny, or reliability incidents start hitting a product with hundreds of
              thousands of public ratings, the downside travels quickly from trust to churn to refund cost and support
              load. The business can likely mitigate many issues operationally, but the absence of audited public
              financials means investors need explicit kill criteria and private diligence before assuming the model is
              as resilient as the brand appears.
            claimRefs:
