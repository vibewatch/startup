      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat the last round as plausible price discovery, not as proof of fair value
            body: >-
              The 2025 financing stack is real and the growth signals are good, but the public record still withholds
              the denominator that would let outside investors underwrite the mark with conviction. That is why the
              right posture is to keep working the deal while insisting on revenue, retention, and terms before paying
              up.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV050
              - CV051
          - type: callout
            title: A high revenue outcome can justify the mark, but it is not yet verifiable
            body: >-
              If onX truly has revenue well above $300M and strong cash conversion, the current valuation can look fair
              or even attractive against public comps. The issue is not that the bull case is impossible; it is that the
              best available public revenue estimate is still low-confidence and methodologically weak.
            calloutType: assumption
            claimRefs:
              - CV040
