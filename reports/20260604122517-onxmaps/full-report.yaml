        title: Product surface and shared workflows
        blocks:
          - type: paragraph
            body: >-
              onXmaps now presents itself as a portfolio rather than a single hunting app. The homepage and
              app-directory surface a four-app family—Hunt, Offroad, Backcountry, and Fish—while business terms show the
              company already thinks about those products as a common account and entitlement layer rather than
              unrelated brands. The common customer promise is not pure GIS depth for specialists; it is a packaged
              outdoor-navigation workflow that helps users discover terrain, understand access, plan a route, save maps
              offline, and then execute in the field with the same account and saved content. Hunt is the most fully
              disclosed flagship, Offroad is the clearest route-planning and in-dash product, and Backcountry is the
              strongest conditions and guidebook product. Across all of them, onX keeps repeating the same primitives:
              boundaries, layers, markups, route planning, offline use, and multi-device continuity. That suggests a
              shared platform underneath several verticalized front ends rather than separate products built from
              scratch each time.
