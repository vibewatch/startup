  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Market trust, access pressure, and data-accuracy risk
        blocks:
          - type: paragraph
            body: >-
              The biggest practical risk to onX is not that hunters stop wanting digital maps; it is that trust in the
              map layers degrades faster than the subscription model can absorb. onX markets itself as a confidence tool
              for knowing where users can and cannot hunt, but its own terms and feature pages also concede the core
              caveat: parcel and conditions data depend on outside providers, change frequently, and must be
              independently verified before action. The land-ownership feature page says the company pulls from more
              than 3,100 counties, while independent commentary notes those upstream sources refresh on inconsistent
              cadences. That leaves onX exposed to a familiar trust failure pattern for mapping products: even a low
              incidence of stale or wrong parcel data can create disproportionate reputational damage because the
              consequence for a user may be trespass risk, a ruined hunt, or a lost relationship with a landowner.
              Public complaint surfaces already show exactly that kind of anger, including allegations of wrong owner
              names and even property shown as public hunting ground. Market risk compounds the data problem. OnX has a
              large installed base, visible subscription pricing, and competitors eager to frame recurring payments as a
              trap or to market higher-precision alternatives. Outdoor Life also documents a second-order backlash risk:
              as digital access tools reveal more routes and parcels, some users and biologists worry the product
              increases crowding and wildlife pressure, which could turn a growth story into a public-relations and
              policy liability in sensitive areas.
            claimRefs:
              - CR015
              - CR018
              - CR019
              - CR020
              - CR021
