              underwritable. onX clearly runs a recurring subscription model with product-specific pricing, broad
              consumer adoption, and a nascent business/team channel. Official disclosures show years of strong ARR
              compounding, and the 2025 financing plus profitable-growth language argue that this is not a fragile,
              promo-only consumer app story. In that sense, the company looks healthier than many outdoor or navigation
