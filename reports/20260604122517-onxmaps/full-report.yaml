      - number: '4.2'
        title: Growth evidence and public traction proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial signal is not an absolute revenue number but the growth cadence management
              has disclosed at two points in time. In 2022, onX said ARR had increased 10x over the prior four years. In
              2025, it said ARR had nearly tripled over the following three years. Taken together, those statements
              imply that onX remained a strong grower even after moving beyond its original Hunt niche. Public traction
              proxies point in the same direction: Apple lists 274K ratings and a 4.9 score for Hunt, while the official
              Hunt, Offroad, and Backcountry pages all market massive data coverage and millions of users.


              The problem is that outside databases do not agree on how that growth translates into current revenue.
              ZoomInfo estimates revenue at $102.5M while IncFact places it above $500M and admits the figure is a
              statistical evaluation. That spread is too wide to anchor underwriting. The safest read is that onX has a
              meaningfully scaled subscription business with strong growth and a large consumer footprint, but not that
              the public record supports a precise 2026 revenue or ARR dollar figure.
