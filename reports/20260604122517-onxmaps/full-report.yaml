      - number: '7.4'
        title: Platform, data-supplier, and IP dependency risk
        blocks:
          - type: paragraph
            body: >-
              OnX’s operating leverage is inseparable from outside platforms and data suppliers. On mobile, Apple and
              Google mediate billing, refunds, and account state for in-app subscribers. On the product side, parcel
              lines and some public-land layers depend on county, state, USDA, and BLM-linked information that onX does
              not fully control. That means the company can be blamed for defects whose root cause sits upstream in
              county refresh cadence, public-data changes, or platform policy shifts. The dependency stack also widens
              legal exposure. The Mountain Project/OpenBeta conflict shows onX is willing to take aggressive action
              around data ownership and reuse when it sees strategic leakage, yet that same episode created a public
              contradiction narrative because Mountain Project language around user ownership sat awkwardly beside DMCA
              enforcement. The issue matters beyond climbing: once an outdoor-platform company accumulates
              user-generated waypoints, routes, reports, or community data, any ambiguity around what the company can do
              with that content becomes a repeatable risk vector. OnX’s own terms intensify that concern by saying user
              content remains user-owned while granting onX a perpetual, irrevocable license to use and modify it in
              connection with the service. Investors should underwrite this as a dependency-and-rights stack, not just a
              mapping stack.
            claimRefs:
              - CR016
              - CR017
