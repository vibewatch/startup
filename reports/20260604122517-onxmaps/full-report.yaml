      - number: '7.2'
        title: Regulatory, privacy, and consumer-protection risk
        blocks:
          - type: paragraph
            body: >-
              OnX’s consumer-subscription model creates a dense regulatory surface even before any company-specific
              enforcement action appears. The company’s own terms say mobile subscriptions auto-renew, are mediated by
              Apple or Google when bought in-app, and do not stop billing merely because the app is uninstalled. Refunds
              are channel-specific: web purchases have a 30-day window, while App Store and Google refunds must be
              sought through the platform that collected the money. That operating model collides directly with the
              direction of consumer law. California’s 2025 automatic-renewal alert says subscription businesses must
              secure express consent, give easy cancellation, send renewal notices for long-term plans and trials, and
              let online sign-ups cancel online; the FTC’s negative-option rulemaking similarly centers on unwanted
              recurring charges and obstacle-free cancellation. Those rules matter to onX because public complaints
              already describe users being bounced between Apple and onX when trying to cancel or recover charges.
              Privacy risk is similarly meaningful rather than abstract. OnX discloses precise location collection,
              analytics and advertising partner data flows, California privacy rights, and legal-process disclosures;
              Apple’s privacy label adds that tracking-related data may include location, content, search, browsing,
              identifiers, usage data, and diagnostics. Outdoor Life further shows why this matters in practice:
              subpoenaed waypoint evidence became part of the Wyoming corner-crossing fight, turning a convenience
              feature into litigation-sensitive evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
