      - number: '3.3'
        title: Public share proxies point to segmented leadership, while switching costs remain low
        blocks:
          - type: paragraph
            body: >-
              Exact paid market shares are not publicly disclosed, so the best available read comes from brand and usage
              proxies. OnX Hunt says millions trust the product. HuntStand says it has 2 million active hunters. BaseMap
              says it is trusted by over 1 million hunters. Territory Supply says AllTrails is used by more than 10
              million outdoor enthusiasts each year. Those signals do not describe one company swallowing the whole
              category; they describe segmented leadership. OnX appears strongest in U.S. hunting and off-road legality
              workflows, AllTrails in mainstream day-hike discovery, Gaia in advanced route planning, and Avenza in
              specialized offline maps. Just as important, reviewers routinely recommend using more than one app. That
              is a strong sign that user behavior is multi-homing rather than winner-take-all. Low switching friction is
              not surprising when GPX imports, desktop planning, offline maps, and topographic or satellite basemaps are
              commonplace. OnX therefore benefits from habit, relevance, and data packaging more than from any hard
              technical lock-in that would stop a user from trialing Gaia for one trip, AllTrails for another, and
              HuntStand or BaseMap during hunting season.
            claimRefs:
