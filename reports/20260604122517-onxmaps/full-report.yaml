      - number: '3.4'
        title: 'The moat looks moderate: strong vertical packaging, but constant parity and bundle pressure'
        blocks:
          - type: paragraph
            body: >-
              The most defensible bullish case for OnX is not that rivals lack maps or offline navigation. They do not.
              The stronger case is that OnX has built a purpose-specific brand around legal access, verified land
              context, and a clean product split by pursuit. That helps the company avoid the one-size-fits-all problem
              visible in broader platforms. Even so, the adverse evidence matters. Outdoor Life historically saw
              HuntStand beating on value. Property boundaries are no longer unique. GOHUNT can charge more because its
              western research stack goes deeper for a narrower buyer. Gaia and Avenza win when map depth or
              authoritative imports matter more than discovery. AllTrails remains the mass-market discovery default. And
              The Verge surfaced a direct onX product criticism—battery drain—that matters in a phone-first category.
              Taken together, this looks like a durable but not impregnable moat. OnX can still lead if it keeps pairing
              land-access data with differentiated vertical UX, but underwriting the moat as hard lock-in would
              overstate the evidence. The key diligence need is private proof on paid share, retention, and the
              economics of the data layers behind the experience.
