  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              onX looks like a real late-stage winner, not a narrative-only outdoor app. CB Insights and PremierAlts
              both place the July 2025 valuation at roughly $1.4 billion and total capital raised near $388 million, and
              the November 2025 follow-on growth-equity round brought in TCV and Cross Creek without displacing Summit
              Partners. Official statements add two more important signals: management says ARR nearly tripled over the
              prior three years, and Summit describes the growth as profitable. Those are exactly the kinds of
              ingredients that can support a premium consumer-subscription or vertical-platform multiple. The problem is
              that the public record still does not show the denominator that matters most. There is no audited revenue
              bridge, no disclosed net retention, no product-level paid-subscriber count, and no usable visibility into
              preference terms. That means the last round should be treated as a plausible fair-value marker rather than
              as proof that the price is attractive. The right public-evidence posture is therefore research-more, not
              buy or avoid.
            claimRefs:
              - CV001
