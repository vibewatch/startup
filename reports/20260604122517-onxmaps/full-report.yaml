            body: >-
              The IP picture is modest but real. Justia lists a January 2026 onXmaps patent grant for map-data
              compression intended to reduce network traffic, which fits the company’s offline-heavy, mobile-first
              product design. Trademark records are broader than the patent record and arguably more commercially
              important: ONX, ONX BACKCOUNTRY, and ONX OFFROAD all appear across software, mapping-service, weather, and
