      - number: '8.4'
        title: Final diligence asks and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The diligence path is straightforward. Investors need a real revenue bridge, product-level retention, a
              clean view on gross margin and free-cash-flow conversion, and the actual Series C and November 2025 terms.
              Without those files, even a seemingly fair headline mark can hide weak cohort quality or
              investor-unfriendly economics. The adverse inputs matter for the same reason. JustUseApp and ArcheryTalk
              are not high-authority sources, but they are useful reminders that retention in subscription mapping
              products depends on trust in the underlying data. If accuracy complaints cluster in boundary-sensitive use
              cases, then a premium hunting subscription can lose renewal power faster than a casual fitness app.
              Likewise, onX Hunt sits in a measured participation market, not an infinite social-network TAM. None of
              that makes the company weak. It means the kill triggers are financial and behavioral, not cosmetic: if
              verified revenue is well below the hurdle band, if churn is meaningfully worse than consumer-app
              benchmarks, or if preference terms dilute new-money economics, the current valuation stops being fair and
              starts becoming expensive. Until those questions are closed, price discipline is the core thesis.
            claimRefs:
              - CV024
