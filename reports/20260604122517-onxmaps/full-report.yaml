companyProfile:
  summary: |
    OnXmaps is a Missoula-rooted private outdoor mapping software company founded in 2009 by Eric
    Siegfried and now led by CEO Laura Orvidas. The business evolved from SD-card hunting maps into a
    broader multi-app subscription platform spanning Hunt, Offroad, Backcountry, Fish, and selected
    team or business licensing. Public evidence shows meaningful scale signals — including reported
    3M+ subscribers, 400+ employees, and strong historical ARR-growth multiples — alongside a late-stage
    financing profile anchored by a reported July 2025 $280M Series C near a $1.4B valuation and a
    later November 2025 growth-equity event. At the same time, the company remains materially opaque on
    current ARR dollars, audited revenue, retention, and financing terms.
