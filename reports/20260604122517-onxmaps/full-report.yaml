chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Suite, and Business Model
        blocks:
          - type: paragraph
            body: >-
              onX describes its mission as awakening the adventurer inside everyone, and its founder story is unusually
              product-specific: Eric Siegfried says he started the company in 2009 so hunters could see public-land
              boundaries in the field. The business first sold SD-card map chips, then launched the Hunt app in 2013,
              and now markets a broader consumer subscription platform of activity-specific navigation apps. Public
              company and investor materials consistently anchor the company in Missoula, Montana, while careers and
              Montana ecosystem sources add Bozeman operations and distributed “Basecamps” around the U.S.


              Today the platform spans four branded apps—onX Hunt, onX Offroad, onX Backcountry, and onX Fish—sold
              through recurring subscription tiers rather than one-time software licenses. The flagship Hunt product
              remains the clearest expression of the original wedge: private/public land boundaries, offline maps,
              3D/LiDAR views, weather, route building, and trail-camera integrations for hunters. Offroad extends the
              same land-and-location stack to motorized recreation, Backcountry applies it to hiking/skiing/climbing
              navigation, and Fish adds lake discovery and species filters for anglers. That app-suite expansion matters
              because it reframes onX from a niche hunting utility into a broader outdoor consumer software platform.
