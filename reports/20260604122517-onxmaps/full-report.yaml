      - number: '1.2'
        title: Leadership Bench, Governance, and Organizational Footprint
        blocks:
          - type: paragraph
            body: >-
              Leadership has clearly shifted from founder-led execution to professionalized scale-up management. Laura
              Orvidas is the public CEO across financing, impact, and investor materials, while Summit says it recruited
              her from Amazon as part of a planned transition that moved founder Eric Siegfried into an advisor and
              board role. That continuity matters because the founder story remains central to the brand, but day-to-day
              operating credibility now rests on a broader executive bench. Montana High Tech’s directory identifies
              Joshua Spitzer, Jann Butler, Chris Harvey Bate, Owen Samuels, and Chris Sledz in senior roles, and careers
              pages emphasize a still-growing organization spread across engineering, product, marketing, geospatial,
              and customer-facing functions.


              Governance visibility is only partial. Public materials identify investor-linked board participants such
              as Colin Mistele of Summit and, after the 2025 TCV transaction, Woody Marshall of TCV; they also say
              Madison Valley Partners and Eric Siegfried remain active in governance. But there is no public board
              roster, seat allocation, or ownership breakdown. That means later-stage control dynamics—especially around
              the 2025 investment cycle and the reported Series C—cannot be fully understood from public sources alone,
              even though public evidence is sufficient to show the company now operates with a multi-party investor
              governance structure rather than a purely founder-controlled model.
