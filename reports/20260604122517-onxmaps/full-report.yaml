  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Buyer Logic
        blocks:
          - type: paragraph
            body: >-
              OnX’s market should be bounded as specialized outdoor field-navigation and land-intelligence software
              rather than as the whole outdoor economy or the full global digital-map stack. The company itself sells
              distinct products for Hunt, Offroad, Backcountry, and Fish, with product pages emphasizing offline
              navigation, species or terrain layers, route planning, and private or public land context rather than
              generic social discovery or general-purpose mapping. That boundary matters because the broad U.S. outdoor
              economy already reaches hundreds of billions of dollars of value added, but only a narrow slice of that
              spend flows into software subscriptions and premium map layers.


              The included spend pool is therefore subscription or transactional spend for field mapping workflows where
              legal access, land ownership, trail legality, or resource-specific overlays matter. That includes hunt
              land-boundary intelligence, fish discovery layers, off-road trail legality and turn-by-turn navigation,
              and backcountry terrain or hazard interpretation. It excludes most lodging, apparel, hardware, guided-trip
              revenue, and the broader commodity map infrastructure market except as an adjacent ceiling. Public-data
              dependencies are central to the boundary: OnX says public-land layers are statewide, but parcel
              completeness depends on county and state data availability, which means the product’s utility is partly a
              function of source-data openness rather than pure software distribution.
            claimRefs:
