  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      How data-quality and reliability failures can propagate from the map layer into legal complaints, support load,
      churn, and valuation pressure.
    data:
      nodes:
        - id: upstream-data-lag
          label: Upstream data lag
          detail: County/state or public-data refresh cadence slips or source data is wrong.
        - id: bad-boundary-output
          label: Bad boundary / access output
          detail: Users see stale owner names, wrong lot lines, or missing layers.
        - id: field-failure
          label: Field-use failure
          detail: Users hit missing lot lines, login issues, black screens, or offline defects during a hunt.
        - id: support-and-refund-load
          label: Support / refund load
          detail: Complaints, refund requests, and support tickets rise.
        - id: consumer-legal-noise
          label: Consumer / legal noise
          detail: Trespass allegations, cancellation complaints, or regulator attention increase.
        - id: churn-and-margin
          label: Churn / margin pressure
          detail: Renewal willingness falls while support and refund cost rise.
        - id: valuation-hit
          label: Valuation hit
          detail: Opaque economics plus visible trust erosion reduce underwriting confidence.
      edges:
        - from: upstream-data-lag
          to: bad-boundary-output
          label: creates
        - from: bad-boundary-output
          to: field-failure
          label: surfaces as
        - from: field-failure
          to: support-and-refund-load
          label: drives
        - from: bad-boundary-output
          to: consumer-legal-noise
          label: can trigger
        - from: support-and-refund-load
          to: churn-and-margin
          label: compresses
        - from: consumer-legal-noise
          to: churn-and-margin
          label: undermines trust
        - from: churn-and-margin
          to: valuation-hit
          label: reduces confidence
    approximationNotes: The DAG abstracts causal links visible in complaint, legal, and policy sources; it does not quantify elasticity.
    claimRefs:
