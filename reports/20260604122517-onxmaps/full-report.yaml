  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Verified revenue misses the comp hurdle
        - Board-level revenue is materially below ~$200M-$250M or badly mismatched to the bull narrative.
        - The public comp set stops supporting the $1.4B mark.
        - Re-cut the case closer to the bear range or walk.
      - - Retention looks weak
        - >-
          Cohort churn, support burden, or product complaints show materially worse renewal behavior than premium
          subscription apps.
        - Premium pricing stops converting into durable value.
        - Lower multiples, demand a lower entry, or wait.
      - - Margin conversion is thin
        - Gross margin or FCF conversion cannot support the reverse-DCF hurdle.
        - A fair-looking valuation becomes expensive on cash economics.
        - Re-underwrite against lower-margin software or hybrid-service comps.
      - - Preference stack is investor-unfriendly
        - Series C or November 2025 terms embed liquidation or governance protections that distort the headline mark.
        - Effective entry economics worsen even if the nominal valuation holds.
        - Pause or demand a structured deal.
      - - Cross-vertical expansion disappoints
        - Offroad, Backcountry, and Fish fail to show meaningful paid uptake beyond Hunt.
        - The platform story collapses back to a narrower hunting-app story.
        - Shift the case to lower TAM and lower multiple assumptions.
    notes: >-
      These are valuation kill triggers, not generic company risks: each one can directly invalidate the price rather
      than just make the story less pleasant.
