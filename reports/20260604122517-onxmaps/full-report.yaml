      - number: '6.3'
        title: Retention, repeat usage, and satisfaction
        blocks:
          - type: paragraph
            body: >-
              The public durability story is proxy-heavy and differs materially by product. Hunt has the strongest
              overall satisfaction signal: high ratings on owned, Apple, Google, and AppBrain surfaces plus anecdotes of
              multi-year use and offline reliance on remote hunts. Backcountry also looks constructive, with 4.7/5 on
              the owned page, a user saying he uses it multiple times a week, and strong safety-oriented testimonials.
              Offroad is the soft spot. Its iOS ratings remain solid, but Google Play is only 3.4/5 and the visible
              complaints are specific: Android Auto instability, weak offline navigation, disappointing trail discovery,
              and difficulty filtering for real-world use. Hunt is not complaint-free — Google Play and JustUseApp both
              surface support, login, renewal, or land-data grievances — and Backcountry has Android bugs and refund
              complaints as well. Still, the public evidence is much more useful as a satisfaction and defect barometer
              than as true retention evidence. None of the reviewed sources disclose NPS, GRR, NRR, or churn, so renewal
              quality remains an open diligence area rather than a proven strength.
