      - number: '7.3'
        title: Operational reliability and support execution risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, onX sells a high-stakes field tool with a support model that is still visibly limited. The
              product promise spans offline maps, live location sharing, 3D terrain, trail-camera integrations,
              rangefinder and binocular sync, in-dash navigation, desktop research tools, and device-specific flows on
              both Apple and Android. That breadth is strategically attractive, but it multiplies failure modes. The
              official troubleshooting hub already points to membership issues, missing markups, missing map
              information, CarPlay problems, compass problems, and chip-update errors. Independent problem trackers show
              the public symptom side of the same complexity: login failures, crashes, black screens, missing satellite
              imagery, missing lot lines, and not-working reports in 2026. Complaint aggregators add anecdotal but
              directionally consistent allegations of lost saved items, account confusion, poor phone access, and long
              waits for support. OnX says its live phone and SMS team operates during Montana business hours, with
              virtual-agent or email workflows outside those windows and a one-business-day typical response time. That
              may be acceptable for routine billing questions; it is less comforting for a product used before daylight
              in remote terrain where a missing layer, bad sync, or login lockout can immediately destroy the value of a
              paid subscription. The residual risk is not merely downtime; it is support elasticity versus the
              real-world timing and emotional stakes of outdoor navigation.
            claimRefs:
              - CR012
              - CR014
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
