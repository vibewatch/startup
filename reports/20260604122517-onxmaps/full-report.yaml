      - number: '8.2'
        title: Comparable bounds and revenue hurdles
        blocks:
          - type: paragraph
            body: >-
              The best public bounding exercise is to ask what kind of revenue base would make a $1.4 billion mark look
              ordinary rather than promotional. The comp set here is intentionally mixed: Garmin captures
              outdoor-navigation and map-adjacent trust; Life360 captures paid location utility on mobile; Duolingo
              captures premium consumer-app engagement; Zillow captures data-layer and map-centric consumer behavior;
              Match Group reflects mature subscription-app monetization; and Airbnb acts as an upper-end consumer
              platform reference. Those names span about 2.27x to 7.11x sales, with a median around 5.35x. At that band,
              onX would need roughly $197 million of revenue at the high end, about $280 million at 5x sales, and nearly
              $467 million at 3x. That math is why the public case is neither obviously cheap nor obviously expensive. A
              low-confidence IncFact estimate says revenue is over $500 million, which would make the mark look
              conservative, but the profile itself warns that its revenue figure is statistical and its industry coding
              is weak. The valuation can be defended; it just is not yet verified.
            claimRefs:
