  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: The valuation call improves on sponsor quality and growth proof, but still stops at the missing-denominator test.
    data:
      nodes:
        - id: A
          label: $1.4B private mark
          detail: Independent databases corroborate the July 2025 valuation and roughly $388M raised.
          tone: neutral
        - id: B
          label: Sponsor support
          detail: TCV and Cross Creek came in while Summit stayed engaged.
          tone: positive
        - id: C
          label: Growth signal
          detail: Management says ARR nearly tripled in three years and Summit says growth is profitable.
          tone: positive
        - id: D
          label: Platform breadth
          detail: Premium pricing and multi-app expansion support a broader outdoor-platform story.
          tone: positive
        - id: E
          label: Public comp band
          detail: Relevant public names span about 2.27x to 7.11x sales.
          tone: neutral
        - id: F
          label: Denominator still private
          detail: Audited revenue, retention, and terms remain outside the public record.
          tone: risk
        - id: G
          label: research-more / fair
          detail: The mark is plausible, but not yet fully underwriteable from public evidence alone.
          tone: risk
      edges:
        - from: A
          to: B
          label: supports
        - from: B
          to: C
          label: reinforces
        - from: C
          to: D
          label: feeds
        - from: D
          to: E
          label: maps to
        - from: E
          to: F
          label: still requires
        - from: F
          to: G
          label: therefore
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV012
      - CV013
      - CV015
      - CV039
      - CV050
      - CV051
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Revenue support for the current mark varies sharply depending on the multiple or margin lens investors apply.
    data:
      items:
        - label: 3x sales hurdle
          value: 467
          detail: Revenue needed if onX trades like a lower-premium subscription or mature app asset.
          tone: risk
        - label: 5x sales hurdle
          value: 280
          detail: Revenue needed near the comp-set median logic.
          tone: neutral
        - label: 7.1x sales hurdle
          value: 197
          detail: Revenue needed at Life360-like premium utility-app multiples.
          tone: positive
        - label: DCF hurdle @ 20% FCF margin
          value: 490
          detail: Revenue needed if onX converts cash more like a good but not elite software asset.
          tone: risk
        - label: DCF hurdle @ 25% FCF margin
          value: 392
          detail: Revenue needed at a stronger cash-conversion profile.
          tone: neutral
        - label: DCF hurdle @ 30% FCF margin
          value: 327
          detail: Revenue needed if onX proves very strong software-like cash economics.
          tone: positive
    claimRefs:
      - CV040
      - CV042
      - CV043
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The current mark lands inside the public-evidence base case, with upside available if the private denominator
      proves strong.
    data:
      items:
        - label: Bear fair value
          low: 0.7
          mid: 0.9
          high: 1.1
          displayValue: $0.7B-$1.1B
          detail: Verified revenue is weak or renewal quality disappoints.
          tone: risk
        - label: Base fair value
          low: 1.2
          mid: 1.5
          high: 1.8
          displayValue: $1.2B-$1.8B
          detail: Revenue and margins clear but do not over-deliver.
          tone: neutral
        - label: Bull fair value
          low: 2
          mid: 2.4
          high: 2.8
          displayValue: $2.0B-$2.8B
          detail: External high-end revenue signals prove roughly right and platform expansion sticks.
          tone: positive
        - label: Current reference mark
          low: 1.4
          mid: 1.4
          high: 1.4
          displayValue: $1.4B
          detail: July 2025 Series C reference point.
          tone: neutral
    claimRefs:
      - CV001
      - CV040
      - CV041
      - CV042
      - CV043
      - CV049
      - CV050
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: The core valuation KPI set is strong enough to justify work, but incomplete for a clean sign-off.
    data:
      items:
        - label: Latest known valuation
          value: $1.4B
          detail: Corroborated by multiple private-market databases.
          tone: neutral
        - label: Total raised
          value: $387.7M
          detail: Signals real sponsor support, not just product hype.
          tone: positive
        - label: ARR growth since 2022
          value: ~3x in 3 years
          detail: Official management claim from the TCV announcement.
          tone: positive
        - label: Longer-term ARR growth
          value: 10x since 2018 by 2022
          detail: Shows a multi-year pattern of scaling into the current financing.
          tone: positive
        - label: Public comp band
          value: 2.27x-7.11x sales
          detail: Range across mature subscription apps, location utility, outdoor trust, and consumer platforms.
          tone: neutral
        - label: 5x-sales revenue hurdle
          value: ~$280M
          detail: Simple current-value support threshold for the private mark.
          tone: neutral
        - label: Reverse-DCF revenue hurdle
          value: ~$327M-$490M
          detail: Depends on whether steady-state FCF margin is 30% or 20%.
          tone: risk
        - label: Low-confidence external revenue estimate
          value: '>$500M'
          detail: Interesting, but not reliable enough to anchor the memo without corroboration.
          tone: positive
        - label: Missing proof
          value: Revenue / NRR / preference terms
          detail: Most important blockers to a buy call.
          tone: risk
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV039
      - CV040
      - CV042
      - CV043
      - CV049
      - CV050
