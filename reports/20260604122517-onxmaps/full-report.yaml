      - number: '2.3'
        title: Growth Drivers, Headwinds, and Regulatory Structure
        blocks:
          - type: paragraph
            body: >-
              Growth drivers for OnX’s market are unusually tangible. Participation is still expanding in gateway
              activities like hiking, camping, and fishing; public-land visitation remains enormous across NPS, USFS,
              and BLM estates; and digital mapping is benefiting from better smartphone GPS, offline workflows,
              AI-assisted routing, and richer GIS data. Analysts of outdoor navigation and digital maps also point to
              commercial, public-safety, and government end markets beyond consumer self-pay subscriptions. OnX’s own
              messaging sits close to field decision-making—species distribution, route planning, trail legality,
              property lines, and offline navigation—which matches the categories seeing repeated public investment and
              participation.


              The headwinds are equally concrete. FWS still frames hunter and angler recruitment and retention as a
              national challenge, meaning some of OnX’s highest-value user groups are not uniformly growing. Privacy and
              data-security concerns are rising across navigation products. Source-data availability is patchy,
              especially for parcel boundaries and landowner identity. And for off-road use, legal route status depends
              on current official maps rather than on GPS reach alone. That makes the market defensible, because
              specialized products solve a harder job than generic maps, but it also makes the market operationally
              demanding: product quality depends on constant ingestion, normalization, and maintenance of official
              land-access data.
