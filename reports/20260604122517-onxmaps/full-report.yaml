            - Downloads remain device-specific and storage-sensitive
        - label: Property / land-access data
          values:
            - Mature but dependency-heavy
            - County-sourcing claims + support workflows
            - Refresh cadence is slow and data can be stale
        - label: Desktop-to-mobile sync
          values:
            - Mature
            - Web Map + support explanation of synced content
