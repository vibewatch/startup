  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Capability-by-capability maturity view showing where onX looks established versus where public diligence still
      runs thin.
    data:
      columns:
        - Current maturity
        - Primary evidence
        - Main limitation
      rows:
