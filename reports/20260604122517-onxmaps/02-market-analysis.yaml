- id: tam-sam-som-and-sizing-lenses
  title: TAM, SAM, SOM, and Sizing Lenses
  body: |-
    Multiple sizing lenses are available, but they answer different questions. At the broadest context level, BEA put the 2024 U.S. outdoor recreation economy at $696.7 billion of value added, while ORR framed the same ecosystem at $1.3 trillion of gross output and 5.2 million jobs. Those numbers are too broad to use as OnX TAM, but they show the scale of the activity system around outdoor participation. OIA’s 2024 summary put the 2023 outdoor participant base at 175.8 million people, while FWS counted roughly 40 million anglers and 14.4 million hunters in 2022. Public-land usage is similarly large: the Forest Service estimated 164 million annual recreation visits, NPS said park visitors generated $56.3 billion of economic output in 2024, and BLM logged 80.8 million visits plus 21.9 million off-highway participants.

    The narrowest public top-down software proxy is the outdoor navigation app market, estimated by one public analyst at $2.85 billion globally in 2024 and about $1.05 billion in North America. A broader adjacent digital-map estimate reaches $25.3 billion globally, but that includes GIS, navigation maps, and mapping data well beyond OnX’s specialty workflows. SAM and SOM are therefore evidence-constrained: public sources scale the relevant activity base and the surrounding app category, but they do not disclose unduplicated overlap across hunters, anglers, OHV users, and backcountry users or OnX’s own paid-subscriber count.
