chapter:
  number: 2
  title: Market Analysis
  summary: 'OnX operates in a large but multi-layered market: public sources show a $696.7 billion U.S. outdoor recreation economy, a 175.8 million outdoor participant base, and a much narrower $1.05 billion North American outdoor navigation app proxy that best matches the company’s current footprint. The strongest adoption drivers are sustained public-land use, growth in gateway outdoor activities, and better GIS/navigation tech, while the binding headwinds are patchy parcel and access data, privacy concerns, route-legality compliance, and the absence of public evidence to cleanly isolate SAM or SOM. Canada is the clearest geographic expansion vector visible in public sources, but international expansion beyond North America remains constrained by overlay-data availability rather than app distribution alone.'
sections:
- id: market-boundary-and-buyer-logic
  title: Market Boundary and Buyer Logic
  body: |-
    OnX’s market should be bounded as specialized outdoor field-navigation and land-intelligence software rather than as the whole outdoor economy or the full global digital-map stack. The company itself sells distinct products for Hunt, Offroad, Backcountry, and Fish, with product pages emphasizing offline navigation, species or terrain layers, route planning, and private or public land context rather than generic social discovery or general-purpose mapping. That boundary matters because the broad U.S. outdoor economy already reaches hundreds of billions of dollars of value added, but only a narrow slice of that spend flows into software subscriptions and premium map layers.

    The included spend pool is therefore subscription or transactional spend for field mapping workflows where legal access, land ownership, trail legality, or resource-specific overlays matter. That includes hunt land-boundary intelligence, fish discovery layers, off-road trail legality and turn-by-turn navigation, and backcountry terrain or hazard interpretation. It excludes most lodging, apparel, hardware, guided-trip revenue, and the broader commodity map infrastructure market except as an adjacent ceiling. Public-data dependencies are central to the boundary: OnX says public-land layers are statewide, but parcel completeness depends on county and state data availability, which means the product’s utility is partly a function of source-data openness rather than pure software distribution.
