- id: TM004
  title: Growth Drivers and Constraints
  columns:
  - Factor
  - Direction
  - Timing
  - Mechanism
  - Implication for OnX
  - Diligence ask
  rows:
  - - Record outdoor participation growth
    - Driver
    - Current
    - More people are entering gateway activities such as hiking, camping, and fishing
    - Expands top-of-funnel demand for specialized maps
    - Validate which gateway cohorts convert to paid subscriptions
  - - Large hunt / fish participation base
    - Driver
    - Current
    - FWS still counts tens of millions of anglers and hunters
    - Supports large category relevance for Hunt and Fish
    - Request cohort conversion and retention by product
  - - Heavy public-land visitation
    - Driver
    - Current
    - NPS, USFS, and BLM visitation remain very large
    - Sustains recurring demand for land-access and offline tools
    - Ask which land systems drive highest engagement
  - - GIS, AI, and smartphone improvement
    - Driver
    - Current to medium term
    - Better location accuracy, richer layers, and smarter routing raise willingness to pay
    - Supports premium product differentiation
    - Test whether AI features improve retention or upsell
  - - Federal GIS map mandates
    - Driver
    - Medium term
    - EXPLORE Act should widen availability of official transport and route data
    - Can improve supply of legal-route datasets for off-road products
    - Monitor actual implementation pace by agency and district
  - - Patchy parcel and overlay data
    - Constraint
    - Current
    - County, state, and provincial data rights vary
    - Limits geographic completeness and slows new-market launches
    - Map coverage completeness and refresh lag by geography
  - - Privacy and location-data concerns
    - Constraint
    - Current
    - Consumers and institutional buyers are sensitive to tracking and data sharing
    - May raise compliance cost and reduce adoption of always-on features
    - Review data-governance posture and opt-in rates
  - - Legal route dependence and annual map refresh
    - Constraint
    - Current
    - Off-road access depends on current official route maps rather than generic GPS
    - Raises maintenance burden but protects specialized app value
    - Audit ingestion workflow for MVUM and equivalent route datasets
  - - Canada-first expansion path
    - Driver with limit
    - Near term
    - Existing Canada coverage is monetized, but outside North America overlays stay thin
    - Canada is realistic; broader internationalization is slower
    - Assess province-by-province data rights and economics before further expansion
  notes: Driver and constraint directions reflect how each factor changes adoption pace, monetization quality, or geographic completeness rather than whether outdoor participation exists at all.
