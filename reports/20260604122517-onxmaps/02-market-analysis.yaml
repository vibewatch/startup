  evidenceGaps:
  - type: missing-source
    severity: material
    topic: specialized SAM
    missingEvidence: A credible public or management-provided market model that isolates paid demand for hunt, fish, off-road, and backcountry mapping rather than the broader outdoor-navigation category.
    whyItMatters: Without a clean SAM estimate, valuation depends on broad category proxies and activity-base reasoning rather than a directly measured specialized software market.
    diligencePath: Request management’s internal TAM/SAM model and subscriber conversion assumptions by product line, then test them against cohort retention and regional coverage completeness.
    relatedQuestionRefs:
    - QM019
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: OnX SOM
    missingEvidence: Current paying subscribers, product mix, ARPU, and paid conversion by Hunt, Fish, Offroad, and Backcountry.
    whyItMatters: SOM is the most decision-useful market figure for underwriting revenue scale, but public sources reviewed here do not disclose it.
    diligencePath: Ask management for current subscribers, trial-to-paid conversion, churn, and product-level revenue by geography.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: audience overlap
    missingEvidence: Unduplicated user overlap across the hunter, angler, OHV, backcountry, and broad outdoor participant populations relevant to OnX.
    whyItMatters: Bottom-up SAM estimates can be materially overstated if participation pools are added together without overlap adjustment.
    diligencePath: Use first-party CRM or survey data to build a de-duplicated audience map across products and seasonal cohorts.
    relatedQuestionRefs:
    - QM021
    - QM019
    relatedTableRefs:
    - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: international overlay coverage
    missingEvidence: Province- and country-level inventory of where cadastral, route, crown-land, and recreation overlays are commercially licensable outside the current U.S. and Canada footprint.
    whyItMatters: Geographic expansion appears supply-constrained by data availability, so country-level TAM claims beyond current coverage could be overstated.
    diligencePath: Build a market-by-market data-rights inventory before underwriting expansion outside North America.
    relatedQuestionRefs:
    - QM018
    - QM024
    relatedTableRefs:
    - TM004
