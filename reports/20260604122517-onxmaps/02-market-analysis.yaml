- id: geographic-expansion-and-serviceable-market
  title: Geographic Expansion and Serviceable Market
  body: |-
    Regulation and geography shape the serviceable market as much as consumer demand does. The EXPLORE Act now directs BLM and the Forest Service to make GIS-compliant transportation and motor-vehicle-use maps publicly available within five years of January 2025 and to review them over time, which is a structural tailwind for map-data availability. Federal policy also explicitly encourages additional motorized and nonmotorized access where appropriate, potentially expanding the amount of mapped recreation inventory over time. At the same time, Forest Service MVUM pages remind users that routes not shown are not open to motorized travel, and the agency said in June 2026 that it could no longer update or add new digital MVUMs to the Avenza store. That combination is a reminder that official route data can improve, but distribution and refresh friction remain real.

    For geography, Canada is the most credible expansion frontier visible in public evidence. OnX Hunt already sells Canada coverage and lists Crown Lands, outfitting areas, draw zones, furblock units, and pricing tiers that include Canada or all 50 states plus Canada. By contrast, OnX Offroad says detailed overlays outside the United States, Canada, and limited Mexico are not yet available. The practical conclusion is that near-term expansion is constrained less by app-store reach than by acquiring and normalizing high-quality cadastral, access, and route datasets market by market.
