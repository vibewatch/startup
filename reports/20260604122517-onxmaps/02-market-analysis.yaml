callouts:
- calloutType: insight
  title: The best public TAM proxy is narrow, not broad
  body: The $25.3 billion global digital map estimate is useful only as an adjacent ceiling. The better public TAM proxy for OnX is the North American outdoor-navigation app category because it at least matches the company’s current geography and consumer use case. Everything broader starts to pull in GIS infrastructure, automotive navigation, and enterprise mapping that OnX does not directly monetize today.
  claimRefs:
  - CM031
  - CM034
  - CM035
  - CM042
- calloutType: risk
  title: Data rights and refresh burden are the binding market constraint
  body: 'Outdoor mapping looks like a software market on the surface, but its service quality depends on timely access to official parcel, access, and route datasets. OnX’s own parcel-coverage note, the legal status of MVUM routes, and the Avenza distribution change all point to the same risk: category growth is real, but market capture depends on operational excellence in ingesting and refreshing public-data layers.'
  claimRefs:
  - CM004
  - CM027
  - CM028
  - CM046
  - CM047
- calloutType: assumption
  title: Canada is the next logical geography, not general global expansion
  body: Public evidence supports a Canada-first expansion thesis because OnX already sells Canada coverage and lists Canada-specific land and hunting-unit layers. The same evidence says detailed overlays outside the U.S., Canada, and limited Mexico are missing, so any more ambitious international TAM story should be treated as a diligence assumption rather than an established market fact.
  claimRefs:
  - CM003
  - CM005
  - CM006
  - CM045
