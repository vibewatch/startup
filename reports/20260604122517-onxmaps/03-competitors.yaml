- id: TP003
  title: Pricing / packaging comparison
  enumerationScope:
    coverage: partial
    basis: Rows compare headline public list pricing or clearly described package structure for the most relevant alternatives visible in retained 2025-2026 public sources; enterprise discounts and promo codes are excluded.
  columns:
  - company
  - headline-list-price
  - packaging
  - included-strength
  - implication
  rows:
  - - onX Hunt
    - $34.99/yr single-state Premium; $49.99/yr two-state; $99.99/yr Elite
    - State-based tiers up to nationwide Elite
    - Land ownership, offline maps, 420+ layers, route builder, aerial intel
    - Competitive for serious hunters, but boundaries are no longer unique
  - - HuntStand
    - $29.99/yr Pro; $69.99/yr Pro Whitetail
    - Free core app plus paid hunting tiers
    - Property boundaries, monthly satellite, 3D mapping, unlimited offline maps
    - Aggressive price-to-feature value keeps pressure on onX in deer and lease use cases
  - - BaseMap
    - $39.99/yr Pro; $69.99/yr Pro Advantage; $99.99/yr Pro Ultimate
    - Three national tiers plus group discounts
    - 50-state ownership, hunt planning, wind, offline maps
    - Direct price and feature overlap with onX limits premium pricing power
  - - GOHUNT Maps
    - $169.99/yr
    - Single premium hunting stack
    - Draw odds, unit profiles, western hunt intel, maps, offline use
    - Materially pricier but more specialized for western tag strategy
  - - Gaia GPS
    - $39.99/yr Premium or bundled with Outside+
    - Free core app plus map-layer premium
    - 300+ map sources, offline downloads, route planning, print / layer depth
    - Often chosen for map depth rather than lowest price
  - - AllTrails
    - $35.99/yr Plus
    - Free discovery layer plus premium trail tools
    - Offline maps, trail conditions, wrong-turn alerts, Garmin route send
    - Affordable mass-market option that widens discovery competition
  - - Avenza Maps
    - Free core app; paid maps / premium options vary
    - Map-store and import model
    - Offline GPS on purchased or imported authoritative maps
    - Different monetization model can win specialized users who dislike subscriptions
  - - Garmin BaseCamp
    - Free desktop software; hardware sold separately
    - Software plus handheld-device ecosystem
    - Desktop planning and device sync
    - Substitute cost sits mostly in hardware, not app subscription
  - - ScoutLook (legacy)
    - $5.99/month for property lines in 2018
    - Free weather app plus paid property-line layer
    - Weather, ScentCone, property lines, offline saved areas
    - Legacy price point shows how early parcel data began commoditizing
  notes: List prices are retained public prices or clearly stated package examples; they are not realized net pricing and do not include one-off promotions except where a page explicitly framed the offer as current list structure.
