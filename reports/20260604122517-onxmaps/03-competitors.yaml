  title: Competitor profile table
  enumerationScope:
    coverage: partial
    basis: Rows cover the most commercially relevant direct peers, adjacencies, substitutes, and one absorbed legacy brand visible in retained 2018-2026 public sources for outdoor-navigation app buyers.
  columns:
  - competitor
  - category
