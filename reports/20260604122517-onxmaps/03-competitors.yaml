chapter:
  number: 3
  title: Competitors
  summary: OnX competes in a fragmented mapping market where hunting-land apps, backcountry route planners, day-hike discovery tools, and legacy GPS substitutes each own different parts of the job. Its best edge is vertical packaging—separate Hunt, Offroad, Backcountry, and Fish apps layered onto land-access and trail datasets—but offline maps, property boundaries, and route tools are already widespread enough that the moat looks moderate rather than winner-take-all.
sections:
- id: landscape-and-segmentation
  title: Direct peers, adjacencies, and substitutes solve overlapping outdoor-navigation jobs
  body: 'The competitive landscape around OnX is not one neat ring of like-for-like apps. OnX has chosen a portfolio strategy, splitting the market into Hunt, Offroad, Backcountry, and Fish rather than asking one interface to satisfy every pursuit. That creates one cluster of direct hunting-land competitors—HuntStand, BaseMap, GOHUNT Maps, and historically ScoutLook—and another cluster of adjacent substitutes led by Gaia GPS, AllTrails, Avenza Maps, and Garmin’s enduring desktop / handheld ecosystem. The direct hunting rivals emphasize parcel lines, scouting, weather, or draw-odds intelligence. The adjacent rivals emphasize route discovery, map-layer depth, authoritative imported maps, or rugged-device reliability. ScoutLook now matters mainly as history because HuntStand absorbed it in 2019, but that history is strategically relevant: useful features in this market do get copied, bundled, and absorbed. The implication for investors is that buyers are not deciding among identical products;
    they are choosing among tools optimized for different outdoor workflows, with onX strongest where legality, land access, and pursuit-specific context matter most.'
