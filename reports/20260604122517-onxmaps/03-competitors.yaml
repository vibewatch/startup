  rows:
  - - onX
    - Direct portfolio leader
    - Millions trust Hunt; 650K+ off-road trail miles; four branded apps
    - Hunters, off-roaders, backcountry users, anglers
    - Separate pursuit-specific apps tied to land-access, trail, and imagery layers
    - Core map features are no longer unique and exact paid share is undisclosed
  - - HuntStand
    - Direct hunting peer
    - 2M active hunters; 4.8M hunt areas; 210M acres managed
    - Hunters and land managers
    - Stand reservations, monthly satellite, group mapping, large free-to-paid funnel
    - Scale claims are company-reported and much of the brand is hunting-specific, not broad outdoor
  - - BaseMap
    - Direct hunting peer
    - 1M+ hunters; 150M+ parcel records; 175M+ addresses
    - Hunters who want land ownership plus planning research
    - Guaranteed land ownership, HuntPlanner, HuntWind, one membership for 50 states
    - Less visible outside hunting and weaker mainstream brand than onX or AllTrails
  - - GOHUNT Maps
    - Direct / niche hunting peer
    - All 50 states official scope; western big-game focus in reviews
    - Western big-game hunters and tag-research users
    - Draw odds, unit profiles, layered western hunt intelligence
    - Highest retained public price point and less compelling for generic single-state use
  - - Gaia GPS
    - Adjacent backcountry / off-road peer
    - Longstanding multipurpose brand; 300+ map sources in review coverage
    - Backcountry planners, overlanders, advanced mappers
    - Deep map layers, custom routes, strong offline planning flexibility
    - Steeper learning curve and more pricing / stewardship complaints after Outside bundling
  - - AllTrails
    - Adjacent mainstream substitute
    - 400K+ trail maps; 10M+ annual users in review coverage
    - Day hikers, runners, casual outdoor users
    - Discovery, user reviews, trail photos, beginner-friendly interface
    - Less specialized for land ownership, hunting, or advanced off-grid map work
  - - Avenza Maps
    - Adjacent specialized substitute
    - Digital map store and professional/offline positioning
    - Professionals, backcountry specialists, hunters needing authoritative maps
    - Offline use on imported or purchased authoritative maps
    - Not built primarily for trail discovery or broad consumer community
  - - Garmin BaseCamp / handhelds
    - Legacy substitute
    - Persistent Garmin hardware ecosystem; BaseCamp desktop software still available
    - Users who prefer rugged devices or desktop-first planning
    - Rugged offline substitute when phones are fragile or battery constrained
    - Dedicated handhelds are niche and the UX is dated versus phone apps
  - - ScoutLook (legacy)
    - Absorbed legacy competitor
    - Property-lines and weather utility absorbed into HuntStand
    - Hunters who previously wanted weather plus property-line tools
    - Early weather / ScentCone differentiation and nationwide property-line claims
    - No longer stands alone after migration into HuntStand
