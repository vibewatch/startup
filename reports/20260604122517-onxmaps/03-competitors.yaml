  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: paid-market-share
    missingEvidence: Paid subscriber counts, paid conversion, and revenue share by onX product and by major rival product line.
    whyItMatters: Without monetized-share data, public brand or app-usage proxies can overstate how much of the category each vendor actually captures in paid revenue.
    diligencePath: Request monthly and annual paid subscribers, conversion by funnel, and product-level revenue mix for onX and benchmark it against any available board / investor materials on rivals.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: multi-homing-and-churn
    missingEvidence: Cohort retention, cancellation reasons, and overlap of users who actively keep multiple mapping apps at once.
    whyItMatters: The low-switching-cost thesis is directionally supported by reviews, but the investment case needs hard churn and overlap data to know whether onX is a habitual home screen app or just one tool in a rotating bundle.
    diligencePath: Ask for retention curves, churn surveys, and any mobile-analytics or CRM segmentation that distinguishes single-app loyalists from multi-app explorers.
    relatedQuestionRefs:
    - QP021
    - QP026
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: data-licensing-economics
    missingEvidence: Vendor contracts, refresh cadence, and gross-margin impact for land-ownership, recent-imagery, trail-verification, and other licensed datasets used inside onX experiences.
    whyItMatters: If core data inputs are costly, non-exclusive, or operationally fragile, the apparent moat from land-access context and trail coverage is less durable than the product surface suggests.
    diligencePath: Request the mapping and data-vendor list, contract terms, refresh SLAs, and a cost-of-revenue breakdown tied to each major dataset or layer family.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
