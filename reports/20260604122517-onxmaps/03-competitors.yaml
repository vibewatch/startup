- id: TP004
  title: Moat durability / competitive risk register
  enumerationScope:
    coverage: partial
    basis: Rows isolate the main public moat claims and countervailing threats that matter most for underwriting a phone-first outdoor-navigation platform in 2026.
  columns:
  - moat-claim
  - threat
  - severity
  - evidence
  - mitigation-or-diligence-ask
  rows:
  - - Vertical product split improves fit by pursuit
    - Rivals can still match individual features and undercut pricing
    - High
    - HuntStand, BaseMap, GOHUNT, Gaia, and AllTrails all own strong slices of the job
    - Request product-level retention and cross-sell rates across Hunt, Offroad, Backcountry, and Fish
  - - Land-ownership context is hard to replicate
    - Property boundaries and landowner detail are already common across hunting peers
    - High
    - HuntStand, BaseMap, GOHUNT, and ScoutLook all marketed property-line access
    - Audit actual data freshness, legal accuracy, and refresh costs rather than assuming exclusivity
  - - Off-road trail curation creates a dataset edge
    - Gaia can win advanced users with deeper map customization and planning
    - Medium
    - Reviewers consistently score onX Offroad higher for trail database and Gaia higher for customization
    - Request active trail-contribution, verification, and refresh metrics by state
  - - Mass-market discovery can be converted into monetization
    - AllTrails may own discovery while onX owns only narrower vertical workflows
    - Medium
    - AllTrails is positioned as the easiest day-hiking discovery app with 10M+ annual-user proxy
    - Measure how often discovery-first users later convert into land-access or premium route-planning buyers
  - - Phone-first UX beats legacy GPS tools
    - Battery drain, privacy, or routing friction can push serious users toward Gaia, Avenza, or Garmin substitutes
    - Medium
    - The Verge dropped onX from a battery test and reviewers still stack multiple apps
    - Request battery, crash, and churn metrics by product and trip type
  - - Brand scale alone can defend share
    - Segmented share proxies imply multiple durable brands rather than one winner-take-all leader
    - Medium
    - HuntStand, BaseMap, AllTrails, Gaia, and GOHUNT all retain visible brand wedges
    - Underwrite moat on habit plus workflow fit, not on assumed monopoly or network effects
  notes: Severity ratings are analytical judgments based on retained public evidence; they are not company-disclosed risk labels.
