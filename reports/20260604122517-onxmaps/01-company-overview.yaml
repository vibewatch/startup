- id: milestones-risks
  title: Milestones, Partnerships, and Accuracy-Related Diligence Risks
  body: 'onX’s milestone pattern shows a company repeatedly broadening the original Hunt wedge into a more diversified outdoor platform. After beginning with GPS chips and the Hunt app, the company acquired Outdoor Project and Adventure Projects in 2020, launched Backcountry in early 2021, introduced Fish in 2025, and used 2025-2026 partnerships with Moultrie, T-Mobile, Ford, and Toyota to extend feature depth, connectivity, and distribution. Its access-and-stewardship work is not just corporate social responsibility branding; both the 2024 and 2025 impact reports tie the company identity to public-land advocacy, grantmaking, and data-driven policy campaigns such as the MAPLand Act implementation milestone.


    The main adverse diligence signal is not regulatory trouble but product-reliability boundaries. onX’s own support documentation says map accuracy depends on upstream data quality, parcel layers update only every one to two years, and satellite imagery is four years old on average in Offroad. The company actively solicits map-error reports, which is constructive, but it also implies persistent correction backlog and uneven local data quality. Independent review surfaces are directionally positive overall—especially in the app stores—yet SlashGear and ArcheryTalk preserve a consistent caution that property boundaries can be stale or offset and should not be treated as survey-grade legal evidence. For a product that monetizes confidence in where a user may legally go, that caveat is strategically important.'
