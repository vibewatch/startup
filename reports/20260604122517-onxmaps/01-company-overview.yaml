- id: capital-scale-valuation
  title: Capital Formation, Scale Signals, and Funding Ambiguity
  body: 'The clearest documented capital history starts in 2018, when TechCrunch and other contemporaneous coverage described Summit Partners leading onX’s first institutional round at $20.3 million after nearly a decade of founder-led growth. Summit’s current portfolio page later describes that initial investment as $26 million, creating a minor chronology conflict that should be resolved from financing documents before using any fully normalized dilution history. The next undisputed disclosed round is the October 2022 Series B: onX announced an $87.4 million growth investment led by Summit, with Madison Valley Partners and existing investors participating, and paired that announcement with claims of 10x ARR growth and 300%+ team growth since 2018.


    Late-stage funding is materially less transparent. onX’s November 2025 release announced a strategic investment from TCV and new support from Cross Creek, but did not disclose check size or valuation. Summit and onX framed the business at that point as having nearly tripled ARR over the prior three years, grown to 3M+ subscribers, and delivered 19x+ ARR growth and 5.7x employee growth since Summit’s initial backing. TechCrunch’s January 2026 unicorn roundup then added the missing late-stage signal: it reported a $280 million Series C at nearly a $1.4 billion valuation and more than $380 million total capital raised. Taken together, the public record is strong enough to support late-stage-unicorn status, but weak enough that cap-table, ownership, and exact round-term diligence remain mandatory.'
