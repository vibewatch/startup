  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-opacity
    missingEvidence: Current ARR, revenue run rate, and supporting margin/retention metrics.
    whyItMatters: Public growth multiples and valuation signals are hard to underwrite without absolute revenue scale and unit economics.
    diligencePath: Request current board deck, monthly KPI pack, and finance model bridge from 2022 Series B to current period.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Full board roster, seat allocation, ownership percentages, and governance rights after the 2025 investment cycle.
    whyItMatters: Control rights, investor influence, and founder dilution cannot be assessed from the public record alone.
    diligencePath: Request cap table, board-consent history, and current governance chart from counsel or CFO.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: subscriber-gap
    missingEvidence: Paid-subscriber count, churn/retention, and product-level subscriber mix behind the reported 3M+ total.
    whyItMatters: A consumer subscription business cannot be valued well from aggregate subscriber figures without paid conversion and cohort quality.
    diligencePath: Request subscriber bridge by app and tier, plus monthly active, paid active, churn, and trial-conversion data.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: round-size-conflict
    missingEvidence: Authoritative financing documents that resolve whether Summit’s initial 2018 investment should be treated as $20.3M or $26M.
    whyItMatters: The discrepancy affects normalized dilution history and the baseline for later funding comparisons.
    diligencePath: Obtain closing press release, board minutes, or executed financing documents for the 2018 round.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: late-stage-financing-terms
    missingEvidence: Exact terms that connect the official 2025 TCV announcement to the later reported $280M Series C and $1.4B valuation.
    whyItMatters: Late-stage valuation, liquidation stack, and investor rights are central to underwriting upside and downside.
    diligencePath: Request 2025 financing memo, investor syndicate summary, and any amended charter or preferred terms created in the late-stage round.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: TO002 executive-roster coverage gap
    missingEvidence: A complete current executive roster and formal organization chart covering the full leadership bench behind the named public leaders.
    whyItMatters: The public roster is good enough for narrative orientation but not sufficient to evaluate bench depth, succession readiness, or decision ownership across product and go-to-market.
    diligencePath: Request current org chart, executive bios, and a leadership-by-function roster from HR or the CEO office.
    relatedQuestionRefs:
    - QO006
    - QO024
    relatedTableRefs:
    - TO002
