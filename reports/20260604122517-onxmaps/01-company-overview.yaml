company:
  name: OnXmaps
chapter:
  number: 1
  title: Company Overview
  summary: 'OnXmaps is a Missoula-rooted outdoor mapping platform founded in 2009 by Eric Siegfried and now led by CEO Laura Orvidas, with a four-app subscription suite spanning hunting, off-roading, backcountry travel, and fishing. Public sources show a clear early financing path through Summit-led 2018 and 2022 rounds, then a more opaque late-stage phase in which TCV invested in 2025 and TechCrunch later reported a $280M Series C at nearly a $1.4B valuation and more than $380M total capital raised. The company also carries a meaningful diligence caveat: its own support materials acknowledge map accuracy depends on source data, parcel refreshes can take one to two years, and some users still report boundary inaccuracies.'
sections:
- id: identity-product-model
  title: Identity, Product Suite, and Business Model
  body: 'onX describes its mission as awakening the adventurer inside everyone, and its founder story is unusually product-specific: Eric Siegfried says he started the company in 2009 so hunters could see public-land boundaries in the field. The business first sold SD-card map chips, then launched the Hunt app in 2013, and now markets a broader consumer subscription platform of activity-specific navigation apps. Public company and investor materials consistently anchor the company in Missoula, Montana, while careers and Montana ecosystem sources add Bozeman operations and distributed “Basecamps” around the U.S.


    Today the platform spans four branded apps—onX Hunt, onX Offroad, onX Backcountry, and onX Fish—sold through recurring subscription tiers rather than one-time software licenses. The flagship Hunt product remains the clearest expression of the original wedge: private/public land boundaries, offline maps, 3D/LiDAR views, weather, route building, and trail-camera integrations for hunters. Offroad extends the same land-and-location stack to motorized recreation, Backcountry applies it to hiking/skiing/climbing navigation, and Fish adds lake discovery and species filters for anglers. That app-suite expansion matters because it reframes onX from a niche hunting utility into a broader outdoor consumer software platform.'
