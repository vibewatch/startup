        title: 留存、重复使用与满意度
        blocks:
          - type: paragraph
            body: >-
              公开耐久性叙事严重依赖代理指标，并且各产品差异明显。Hunt 的总体满意度信号最强：自有、Apple、Google 和 AppBrain
              表面评分都高，还有多年使用和远程狩猎中依赖离线能力的轶事。Backcountry 也偏正面，自有页面评分 4.7/5，有用户称每周多次使用，并有强安全导向评价。Offroad 是软肋。它的 iOS 评分仍扎实，但
              Google Play 只有 3.4/5，可见投诉也很具体：Android Auto 不稳定、离线导航弱、路线发现令人失望、难以按真实使用筛选。Hunt 并非没有投诉——Google Play 和
              JustUseApp 都出现支持、登录、续费或土地数据抱怨——Backcountry 也有 Android bug
              和退款投诉。尽管如此，公开证据更适合作为满意度和缺陷温度计，而不是真正的留存证据。审阅来源均未披露 NPS、GRR、NRR 或流失率，所以续费质量仍是开放尽调事项，而不是已证明的优势。
