        title: 单位经济与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              单位经济方向上有吸引力，但披露仍不足。产品集以软件为先，通过年度或月度订阅计费，销售给户外爱好者类别；离线地图、土地所有权数据和工作流专属功能带来真实付费意愿。Hunt Elite 尤其值得注意：按年计费
              $99.99，比十二个月月付便宜近 $80，这会推动用户预付现金，并降低短期流失风险。独立应用会员也为重度户外用户的 ARPU 扩张留下空间，团队许可则在消费者应用商店之外增加第二条通向高价值席位的路径。


              拖累实际单位经济的关键因素也可见。应用商店分发很可能给来自移动端的订阅带来平台费用。Backcountry 当前促销价表明 onX 愿意为获客或季节激活大力打折，即使标价仍健康，也可能压低实际
              ARPU。与此同时，支持材料和反向评论显示，数据质量修复是持续运营成本：不准确的财产或所有权信息可能触发支持工单、更新工作和取消订阅。因此，公开来源支持正面的循环收入逻辑，但无法拼出封闭形式的
              CAC、回本周期、毛利率或 NRR 模型。
