companyProfile:
  summary: >
    OnXmaps 是一家根植于 Missoula 的私人户外地图软件公司，Eric Siegfried 于 2009 年创立，现由 CEO Laura Orvidas 领导。公司从 SD
    卡狩猎地图起步，演进为更宽的多应用订阅平台，覆盖 Hunt、Offroad、Backcountry、Fish，以及部分团队或企业许可。公开证据显示它已有可观规模信号——包括据报道 3M+ 订阅用户、400+ 员工和强劲的历史 ARR
    增长倍数——融资画像也进入后期阶段：据报道 2025 年 7 月完成 $280M Series C 轮，估值接近 $1.4B，随后在 2025 年 11 月又发生一笔成长股权融资。与此同时，公司在当前 ARR
    金额、经审计收入、留存和融资条款上仍明显不透明。
