  - id: TM004
    title: 增长驱动因素与约束
    columns:
      - 因素
      - 方向
      - 时点
      - 机制
      - 对 OnX 的影响
      - 尽调追问
    rows:
      - - 户外参与度创纪录增长
        - 驱动因素
        - 当前
        - 更多人进入徒步、露营、钓鱼等入门级活动
        - 为专业地图扩大获客入口需求
        - 验证哪些入门队列会转为付费订阅
      - - 庞大狩猎 / 钓鱼参与基础
        - 驱动因素
        - 当前
        - FWS 统计的钓鱼者和猎人仍有数千万
        - 支撑 Hunt 和 Fish 的大品类相关性
        - 索取按产品拆分的队列转化与留存
      - - 公共土地访问量大
        - 驱动因素
        - 当前
        - NPS、USFS 和 BLM 访问量仍很大
        - 支撑土地进入权和离线工具的持续需求
        - 追问哪些土地系统带来最高参与度
      - - GIS、AI 和智能手机改进
        - 驱动因素
        - 当前至中期
        - 定位更准、图层更丰富、路线更智能，会提高付费意愿
        - 支撑高端产品差异化
        - 测试 AI 功能是否提升留存或增购
      - - 联邦 GIS 地图法定要求
        - 驱动因素
        - 中期
        - EXPLORE Act 应会扩大官方交通和路线数据的可用性
        - 可改善越野产品的合法路线数据集供给
        - 按机构和辖区监测实际落地节奏
      - - 地块和叠加图层数据不完整
        - 约束
        - 当前
        - 县、州、省的数据权利不一
        - 限制地理覆盖完整性，并拖慢新市场上线
        - 按地区核查地图覆盖完整度和刷新滞后
      - - 隐私和位置数据担忧
        - 约束
        - 当前
        - 消费者和机构买方对跟踪和数据共享敏感
        - 可能推高合规成本，并降低常开功能采用率
        - 审查数据治理姿态和选择加入率
      - - 合法路线依赖与年度地图刷新
        - 约束
        - 当前
        - 越野通行依赖最新官方路线图，而不是通用 GPS
        - 提高维护负担，但守住专业 App 价值
        - 审计 MVUM 及同类路线数据集的摄取工作流
      - - 加拿大优先扩张路径
        - 有上限的驱动因素
        - 近期
        - 现有加拿大覆盖已经变现，但北美以外叠加图层仍薄弱
        - 加拿大路径现实；更广泛国际化会更慢
        - 继续扩张前，逐省评估数据权利和经济性
    notes: 这里的驱动因素和约束，指各因素如何改变采用节奏、变现质量或地理覆盖完整性，而不是户外参与本身是否存在。
