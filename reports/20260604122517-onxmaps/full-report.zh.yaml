        - 要求按 Premium、Premium Two State 和 Elite 提供订阅人数与转化率
      - - Offroad 免费转付费阶梯
        - 尽管 iOS 满意度稳健，Android 口碑偏弱可能压低转化或续费
        - 产品可凭试用和年度计划增长，但缺陷可能压低 LTV
        - 要求提供试用转付费率和按平台拆分的流失率
