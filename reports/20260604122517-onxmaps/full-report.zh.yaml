        title: 信任、隐私与公开缺口
        blocks:
          - type: paragraph
            body: >-
              信任和质量控制在公开层面存在，但更偏运营，而不是企业级保障。onX
              发布隐私政策，解释为什么需要位置和照片访问，把客户标注存到服务器端以便同步，并提供负责任披露邮箱。公司也反复提醒用户，地图准确性、可用性和状态取决于外部提供方和动态数据集。这个提醒并非理论问题：USDA
              地理数据来源页面本身称其数据不是法律文件，反向评论证据也显示，错误土地所有者姓名可能造成真实擅闯风险。对户外导航产品来说，这些不是表面问题，而是触及安全、通行合法性和客户信任。缺失的内容同样重要。本文审阅的公开来源没有提供公开
              uptime SLA、事故历史、地块 / 影像 / 路线输入的详细供应商清单，或注明日期、说明下一步功能及时间的路线图。这让尽调只能倚靠功能宽度和持续发版信号，而不是企业级披露纪律。
