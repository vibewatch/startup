      - number: '8.2'
        title: 可比边界与收入门槛
        blocks:
          - type: paragraph
            body: >-
              最好的公开边界测算，是反问怎样的收入基数能让 $1.4 billion 标记看起来普通，而不是促销式定价。这里的可比公司组合有意混合：Garmin 代表户外导航和地图相邻信任；Life360
              代表移动端付费位置工具；Duolingo 代表高端消费者应用参与度；Zillow 代表数据层和地图中心的消费者行为；Match Group 体现成熟订阅应用变现；Airbnb
              则作为高端消费者平台参照。这些公司销售额倍数约在 2.27x 到 7.11x，中位数约 5.35x。按这个区间，onX 在高端倍数下需要约 $197 million 收入，在 5x 销售额下需要约 $280
              million，在 3x 下接近 $467 million。这组数学解释了为什么公开案例既不显然便宜，也不显然昂贵。低置信度的 IncFact 估计称收入超过 $500
              million，这会让当前标记显得保守；但该档案自己也警告，收入数字是统计估算，行业编码也弱。估值可以被辩护，只是还没有被验证。
