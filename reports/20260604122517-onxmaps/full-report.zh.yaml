              onX 已远远超出手机地图产品。CarPlay 和 Android Auto
              是真实界面，但支持文档清楚表明，车机使用是移动应用的受控延伸，而不是完整独立客户端。应用商店列表也显示集成层正在变宽，现在包括猎摄相机、兼容测距仪和望远镜、Apple Watch 或 Wear
              OS，以及实时位置共享功能。这些界面很重要，因为它们把 onX 变成了协调和设备编排产品，而不只是静态地图应用。公开工程信号也与这个判断一致。Built In 岗位列出 Core Viewer 地图引擎、3D
              地图渲染、跨平台 SDK、可扩展 IAM、越野后端服务、lakehouse 数据平台和 AI 系统的工作。这是有意义的开发者信号证据，说明 onX
              仍在投入基础平台工作，而不只是内容陈列。更不清楚的是这些岗位背后的具体技术栈：公开来源显示招聘需求，但没有给出完整架构图、服务边界或生产可靠性数字。
