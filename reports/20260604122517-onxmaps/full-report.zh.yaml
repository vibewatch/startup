  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 发现、试用和实地使用环节的证据最扎实；到了续费、活跃订阅用户和企业级部署阶段，证据明显变弱。
    data:
      nodes:
        - id: awareness
          label: 认知
          description: 自有页面、应用商店和评论清楚呈现了猎人、越野用户和荒野用户各自要完成的任务。
        - id: trial
          label: 试用 / 免费层
          description: 三款产品都宣传免费使用或七天试用，降低了首次使用门槛。
        - id: paid
          label: 付费会员
          description: 套餐阶梯和应用内购买能看到付费转化路径，但公司没有公开披露转化率。
        - id: field
          label: 实地部署
          description: 具名评论显示，用户在狩猎、家庭越野旅行和对安全敏感的荒野出行中实际使用产品。
        - id: renewal
          label: 续费 / 升级
          description: 续费只能从重复使用轶事和 Elite 增购路径推断，不能靠公司披露的留存数据验证。
        - id: managed
          label: 托管账户
          description: 团体会员确实存在，但公开材料里具名客户标识或集中度证据很薄。
      edges:
        - from: awareness
          to: trial
          label: 按产品区分的应用发现
        - from: trial
          to: paid
          label: 年度套餐或 Elite 增购
        - from: paid
          to: field
          label: 离线地图、图层、路线规划、安全用途
        - from: field
          to: renewal
          label: 重复使用或重新考虑订阅
        - from: paid
          to: managed
          label: 员工福利 / 团体管理员路径
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU011
      - CU019
      - CU031
      - CU039
      - CU042
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: standard
    summary: Hunt 的公开证据栈最深，Offroad 的口碑质量最弱；团体会员虽有战略意义，证据却最薄。
    data:
      columns:
        - 证据质量
        - 结果具体性
        - 重复信号
        - 留存可见度
      rows:
        - label: Hunt 消费者触点
          values:
            - 高 — 自有 + Apple + Google + AppBrain
            - 高 — 地块边界、离线狩猎、多年使用
            - 中 — 几年使用 / 离线麋鹿狩猎轶事
            - 低 — 未披露流失或 NRR
        - label: Offroad 消费者触点
          values:
            - 高 — 自有 + Apple + Google + AppBrain
            - 中 — 小径、露营、家庭使用、SxS 使用
            - 低 — 公开重复使用证据很少
            - 低 — 投诉声量高于续费证据
        - label: Backcountry 消费者触点
          values:
            - 中 — 留存样本仅含自有 + Google
            - 高 — 徒步、骑行、滑雪巡游、安全用途
            - 中 — 每周多次使用轶事
            - 低 — 未披露队列或续费
        - label: 团体会员打法
          values:
            - 低 — 一个自有员工福利页面
            - 低 — 只有管理员流程，没有客户标识
            - 低 — 没有重复使用或支出证据
            - 低 — 集中度完全未披露
    claimRefs:
      - CU005
      - CU016
      - CU025
      - CU033
      - CU036
      - CU039
      - CU041
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: OnX 五大主要风险类别的相对概率、影响、缓释成熟度和剩余暴露。
    data:
      columns:
        - 市场 / 信任
        - 监管 / 隐私
        - 运营 / 技术
        - 依赖 / IP
        - 财务 / 模型
      rows:
        - label: 概率
          values:
            - 高
            - 中高
            - 中高
            - 中
            - 中
        - label: 影响
          values:
            - 极高
            - 高
            - 高
            - 高
            - 高
        - label: 缓释成熟度
          values:
            - 中等
            - 中等
            - 中低
            - 中低
            - 低
        - label: 剩余暴露
          values:
            - 高
            - 高
            - 高
            - 中高
            - 高
    approximationNotes: 单元格记录作者基于留存来源做出的定性综合判断，并非精算概率。
    claimRefs:
      - CR010
      - CR018
      - CR026
      - CR030
      - CR038
      - CR046
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 数据质量和可靠性故障如何从地图层传导到法律投诉、客服负载、流失和估值压力。
    data:
      nodes:
        - id: upstream-data-lag
          label: 上游数据滞后
          detail: 县 / 州或公共数据刷新节奏延误，或源数据本身出错。
        - id: bad-boundary-output
          label: 边界 / 通行结果错误
          detail: 用户看到过期业主姓名、错误地块线或缺失图层。
        - id: field-failure
          label: 实地使用故障
          detail: 用户狩猎时遇到地块线缺失、登录问题、黑屏或离线缺陷。
        - id: support-and-refund-load
          label: 客服 / 退款负载
          detail: 投诉、退款请求和支持工单上升。
        - id: consumer-legal-noise
          label: 消费者 / 法律噪声
          detail: 擅闯指控、取消订阅投诉或监管关注增加。
        - id: churn-and-margin
          label: 流失 / 利润率压力
          detail: 续费意愿下降，支持和退款成本同时上升。
        - id: valuation-hit
          label: 估值受损
          detail: 经济性不透明叠加可见的信任侵蚀，压低承销信心。
      edges:
        - from: upstream-data-lag
          to: bad-boundary-output
          label: 造成
        - from: bad-boundary-output
          to: field-failure
          label: 表现为
        - from: field-failure
          to: support-and-refund-load
          label: 推高
        - from: bad-boundary-output
          to: consumer-legal-noise
          label: 可能触发
        - from: support-and-refund-load
          to: churn-and-margin
          label: 挤压
        - from: consumer-legal-noise
          to: churn-and-margin
          label: 削弱信任
        - from: churn-and-margin
          to: valuation-hit
          label: 降低信心
    approximationNotes: 这张 DAG 抽象了投诉、法律和政策来源中可见的因果链路；它不量化弹性。
    claimRefs:
      - CR015
      - CR021
      - CR022
      - CR030
      - CR033
      - CR036
      - CR043
      - CR046
      - CR047
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 位于 OnX 和终端用户之间的关键外部平台与数据供应商。
    data:
      nodes:
        - id: apple-google
          label: Apple / Google
          detail: 移动计费、退款、订阅状态、商店政策和设备生态规则。
        - id: county-state-records
          label: 县 / 州记录
          detail: 用于地块边界图层的地块和业主数据。
        - id: public-agency-data
          label: BLM / USDA 关联公共数据
          detail: 应用中引用的公共土地和政府信息界面。
        - id: onx-platform
          label: OnX 应用层
          detail: 地图、账户、离线同步、标注、社交功能和集成。
        - id: user-experience
          label: 用户体验
          detail: 订阅用户在实地和续费时看到的体验。
        - id: revenue-and-trust
          label: 收入 / 信任
          detail: 续费、支持成本、投诉和品牌声誉。
      edges:
        - from: apple-google
          to: onx-platform
          label: 居中处理计费 / 账户状态
        - from: county-state-records
          to: onx-platform
          label: 提供地块数据
        - from: public-agency-data
          to: onx-platform
          label: 提供公共土地图层
        - from: onx-platform
          to: user-experience
          label: 交付
        - from: user-experience
          to: revenue-and-trust
          label: 决定
        - from: apple-google
          to: revenue-and-trust
          label: 影响费用和取消
    approximationNotes: 这张图把更宽的依赖栈简化为留存公开来源里最可见的交易对手。
    claimRefs:
      - CR002
      - CR016
      - CR017
      - CR041
      - CR042
      - CR043
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 资方质量和增长证据改善了估值判断，但缺失分母这一关仍然过不去。
    data:
      nodes:
        - id: A
          label: $1.4B 私募估值标记
          detail: 独立数据库相互印证了 2025 年 7 月估值，以及大约 $388M 的累计融资。
          tone: neutral
        - id: B
          label: 资方支持
          detail: TCV 和 Cross Creek 进场，Summit 仍保持参与。
          tone: positive
        - id: C
          label: 增长信号
          detail: 管理层称 ARR 三年内接近增至三倍，Summit 称增长具备盈利性。
          tone: positive
        - id: D
          label: 平台宽度
          detail: 溢价定价和多应用扩张支撑更宽的户外平台叙事。
          tone: positive
        - id: E
          label: 公开可比公司区间
          detail: 可比上市公司销售倍数约在 2.27x 至 7.11x 之间。
          tone: neutral
        - id: F
          label: 分母仍未公开
          detail: 经审计收入、留存和条款仍不在公开记录中。
          tone: risk
        - id: G
          label: 继续研究 / 合理
          detail: 这个估值标记说得通，但仅靠公开证据还无法完整承销。
          tone: risk
      edges:
        - from: A
          to: B
          label: 支撑
        - from: B
          to: C
          label: 加强
        - from: C
          to: D
          label: 注入
        - from: D
          to: E
          label: 映射到
        - from: E
          to: F
          label: 仍需
        - from: F
          to: G
          label: 因此
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV012
      - CV013
      - CV015
      - CV039
      - CV050
      - CV051
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 投资者采用不同倍数或利润率视角时，当前估值标记需要的收入支撑差异很大。
    data:
      items:
        - label: 3x 销售倍数门槛
          value: 467
          detail: 如果 onX 按较低溢价订阅或成熟应用资产定价，需要达到的收入。
          tone: risk
        - label: 5x 销售倍数门槛
          value: 280
          detail: 接近可比公司组中位数逻辑时，需要达到的收入。
          tone: neutral
        - label: 7.1x 销售倍数门槛
          value: 197
          detail: 按 Life360 式高溢价工具应用倍数定价时，需要达到的收入。
          tone: positive
        - label: DCF 门槛 @ 20% FCF 利润率
          value: 490
          detail: 如果 onX 的现金转化更像优质但非顶尖软件资产，需要达到的收入。
          tone: risk
        - label: DCF 门槛 @ 25% FCF 利润率
          value: 392
          detail: 更强现金转化画像下需要达到的收入。
          tone: neutral
        - label: DCF 门槛 @ 30% FCF 利润率
          value: 327
          detail: 如果 onX 证明自己拥有很强的软件式现金经济性，需要达到的收入。
          tone: positive
    claimRefs:
      - CV040
      - CV042
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前估值标记落在公开证据支撑的基准情景内；如果私有分母被证明足够强，仍有上行空间。
    data:
      items:
        - label: 悲观公允价值
          low: 0.7
          mid: 0.9
          high: 1.1
          displayValue: $0.7B-$1.1B
          detail: 经验证收入偏弱，或续费质量令人失望。
          tone: risk
        - label: 基准公允价值
          low: 1.2
          mid: 1.5
          high: 1.8
          displayValue: $1.2B-$1.8B
          detail: 收入和利润率过线，但没有超额兑现。
          tone: neutral
        - label: 乐观公允价值
          low: 2
          mid: 2.4
          high: 2.8
          displayValue: $2.0B-$2.8B
          detail: 外部高端收入信号被证明大致正确，平台扩张站稳。
          tone: positive
        - label: 当前参考估值标记
          low: 1.4
          mid: 1.4
          high: 1.4
          displayValue: $1.4B
          detail: 2025 年 7 月 Series C 参考点。
          tone: neutral
    claimRefs:
      - CV001
      - CV040
      - CV041
      - CV042
      - CV043
      - CV049
      - CV050
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 核心估值 KPI 组合足以支撑继续工作，但还不足以无保留签核。
    data:
      items:
        - label: 最新已知估值
          value: $1.4B
          detail: 多个私募市场数据库相互印证。
          tone: neutral
        - label: 累计融资
          value: $387.7M
          detail: 说明真实资方支持存在，而不只是产品热度。
          tone: positive
        - label: 2022 年以来 ARR 增长
          value: ~3x in 3 years
          detail: TCV 公告中的管理层正式说法。
          tone: positive
        - label: 更长期 ARR 增长
          value: 10x since 2018 by 2022
          detail: 显示公司以多年节奏扩张，最终进入当前融资。
          tone: positive
        - label: 公开可比公司区间
          value: 2.27x-7.11x sales
          detail: 覆盖成熟订阅应用、位置工具、户外信任和消费者平台的区间。
          tone: neutral
        - label: 5x 销售倍数收入门槛
          value: ~$280M
          detail: 支撑当前估值的简化收入门槛。
          tone: neutral
        - label: 反向 DCF 收入门槛
          value: ~$327M-$490M
          detail: 取决于稳态 FCF 利润率是 30% 还是 20%。
          tone: risk
        - label: 低置信度外部收入估计
          value: '>$500M'
          detail: 有参考价值，但没有佐证前不足以支撑备忘录。
          tone: positive
        - label: 缺失证据
          value: Revenue / NRR / preference terms
          detail: 阻碍买入判断的最重要因素。
          tone: risk
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV039
      - CV040
      - CV042
      - CV043
      - CV049
      - CV050
