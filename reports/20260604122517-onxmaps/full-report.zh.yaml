      - number: '5.2'
        title: 地图、数据架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开可见架构在用户工作流和数据图层层面最强。onX Hunt 的浏览器版 Web
              Map、支持文章和功能页面描述了一个系统：规划通常从桌面开始，再同步到移动端离线执行。离线地图把底图和图层数据打包到设备，在没有蜂窝服务时保留 GPS 功能，并且可以先从网页创建，再在移动端本地下载。Route
              Builder 依赖一张能贴合道路和步道的路线图，但当图不完整时，仍提供手动兜底。onX 的土地技术栈似乎混合了内部打包数据和外部数据流：财产线来自 3,100
              多个县，公共政府图层带有通行限定，应用商店披露则把用户导向 USDA Forest Service、BLM 和 ArcGIS 公共数据来源。最终结果是一套实用但高度依赖外部的运营模式：onX
              掌握面向用户的规划、同步和打包层，而重要原始输入仍来自外部，并以不均匀节奏刷新。
