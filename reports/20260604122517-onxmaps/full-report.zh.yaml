      - number: '6.4'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              OnX 在产品层面有可信扩张机制，但几乎没有公开披露客户集中度。Hunt 可以从单州向双州、全国 Elite 向上销售。Offroad 和 Backcountry 各自运行从免费到付费的阶梯，包含
              Premium、Elite 和免费试用入口。团体会员增加了另一条扩张路径，因为买方可以为 30+ 员工购买 Elite
              权限并集中管理账户；分享、离线地图和实时位置共享等协作功能，也让应用在家庭、狩猎队或骑行车队内部更有用。问题是，公开证据止步于最具经济决定性的问题之前。OnX 没有点名员工福利客户，没有披露
              Hunt、Offroad 和 Backcountry 各自贡献的收入占比，也没有说明是否有任何单一渠道、地区或大客户占比过高。社区讨论也显示真实切换风险：用户在价格、航空影像、地图深度和功能宽度上把 OnX 与
              HuntStand、BaseMap 和 Gaia 对比，其中 Offroad 看起来最脆弱。因此，公开客户案例支持「真实采用，且产品市场任务清楚」，但不支持「耐久性或集中度能见度已完全承销」。
