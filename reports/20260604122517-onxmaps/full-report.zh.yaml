  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与共享工作流
        blocks:
          - type: paragraph
            body: >-
              onXmaps 现在把自己呈现为一个组合，而不是单一狩猎应用。首页和应用目录展示了四应用家族——Hunt、Offroad、Backcountry 和
              Fish——商业条款则显示，公司已经把这些产品视为共同账户和权益层，而非互不相关的品牌。共同的客户承诺不是给专家提供纯粹 GIS
              深度，而是打包一套户外导航工作流，帮助用户发现地形、理解通行、规划路线、离线保存地图，然后在野外用同一账户和已保存内容执行。Hunt 是披露最充分的旗舰，Offroad
              是最清楚的路线规划和车机产品，Backcountry 则是最强的条件信息和指南产品。在所有产品里，onX
              反复强调同一组原子能力：边界、图层、标注、路线规划、离线使用和多设备连续性。这说明底层更像一个共享平台，上面跑着几个垂直化前端，而不是每次从零搭建的独立产品。
