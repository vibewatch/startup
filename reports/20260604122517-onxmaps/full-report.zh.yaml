      - number: '3.3'
        title: 公开份额代理指标指向分层领导，切换成本仍低
        blocks:
          - type: paragraph
            body: >-
              精确付费市场份额没有公开披露，所以最好可用判断来自品牌和使用代理指标。OnX Hunt 称数百万人信任该产品。HuntStand 称拥有 2 million 活跃猎人。BaseMap 称获得超过 1
              million 猎人信任。Territory Supply 称 AllTrails 每年被超过 10 million 户外爱好者使用。这些信号不是在描述一家公司吞下整个类别；它们描述的是分层领导。OnX
              看起来在美国狩猎和越野合法性工作流最强，AllTrails 在主流日间徒步发现最强，Gaia 在高级路线规划最强，Avenza
              在专门离线地图最强。同样重要的是，评论者经常建议同时使用不止一个应用。这强烈表明用户行为是多归属，而非赢家通吃。当 GPX 导入、桌面规划、离线地图和地形或卫星底图都很常见时，切换摩擦低并不意外。因此，OnX
              受益于习惯、相关性和数据打包，多过任何会阻止用户为一次旅行试用 Gaia、为另一次旅行使用 AllTrails、狩猎季再用 HuntStand 或 BaseMap 的硬技术锁定。
