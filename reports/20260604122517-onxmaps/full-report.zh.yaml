      - number: '8.4'
        title: 最终尽调要求与论点破坏项
        blocks:
          - type: paragraph
            body: >-
              尽调路径很直接。投资人需要真实的收入桥、产品层面留存、毛利率和自由现金流转化的清晰视图，以及实际的 Series C 和 2025 年 11
              月条款。没有这些文件，哪怕看似合理的头部估值也可能藏着弱队列质量或对投资人不友好的经济条款。反向输入同样重要。JustUseApp 和 ArcheryTalk
              不是高权威来源，但它们提醒了一件有用的事：订阅制地图产品的留存取决于用户对底层数据的信任。如果准确性投诉集中在边界敏感的使用场景，高端狩猎订阅失去续订力的速度会快过休闲健身应用。同样，onX Hunt
              所在的是一个可测量的参与市场，不是无限大的社交网络
              TAM。这些都不说明公司弱。它说明否决触发器是财务和行为，而不是表面观感：如果验证后的收入远低于门槛区间，如果流失明显差于消费者应用基准，或如果优先权条款稀释新钱经济性，当前估值就会从合理变成昂贵。在这些问题关闭之前，价格纪律就是核心投资逻辑。
