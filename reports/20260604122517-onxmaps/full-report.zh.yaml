  - id: FP003
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: standard
    summary: onX 相对最可见竞品基准和品类约束的竞争就绪度，用紧凑的公开代理指标呈现。
    approximationNotes: 条目是公开代理指标和分析摘要，不是经审计的市场份额数据。由于准确付费份额仍未公开，它们只能作为有用的方向性信号。
    claimRefs:
      - CP002
      - CP006
      - CP012
      - CP023
      - CP028
      - CP039
      - CP040
    data:
      items:
        - label: onX 产品组合
          value: 4 vertical apps
          note: Hunt、Offroad、Backcountry 和 Fish 支持按活动打包，而不是共用一个通用界面
        - label: onX Offroad 覆盖代理指标
          value: 650K+ trail miles
          note: 机动化路线覆盖的可见广度，给了 onX 一个由数据撬动的越野切口
        - label: HuntStand 公开规模代理指标
          value: 2M active hunters
          note: 表明 onX 不是唯一一个有复购参与度主张、且已具规模的狩猎地图品牌
        - label: BaseMap 公开规模代理指标
          value: 1M+ hunters
          note: 另一个信号：基于地块数据的狩猎应用已经能支撑多个有意义的品牌
        - label: AllTrails 发现代理指标
          value: 400K+ trail maps; 10M+ annual users
          note: 即便 onX 掌握更窄的垂直用例，主流发现触达也在别处
        - label: 中档价格集群
          value: $29.99-$39.99 annual entry for many paid plans
          note: 公开价格带很紧，限制了单靠价格建立护城河的说法
        - label: 护城河就绪度结论
          value: Moderate, not hard lock-in
          note: 品牌加土地场景打包看起来耐久；发现、路线规划和专业地图仍很容易从别处获得
  - id: FI001
    title: 收入模型桥
    type: flow
    layout: standard
    summary: onX 借助按产品划分的会员，把免费应用发现转化为循环消费者和商业订阅收入。
    approximationNotes: 这条流程有来源支撑，但做了简化。公开来源显示的是定价架构和企业席位动作，不是实际转化率、渠道组合或续费比例。
    data:
      nodes:
        - id: discover
          label: 免费发现
          detail: 用户先下载免费应用，或在网页和移动端浏览 onX，然后再付费
          tone: neutral
        - id: product-choice
          label: 产品选择
          detail: 用户选择 Hunt、Offroad、Backcountry，或企业 / 团队部署
          tone: neutral
        - id: trial
          label: 试用 / 选择套餐
          detail: 会员阶梯和免费试用把用户推向 Premium 或 Elite 档位
          tone: neutral
        - id: billing
          label: 计费渠道
          detail: 用户通过网页年度续费、应用月度续费或团队发票付款
          tone: neutral
        - id: subscription
          label: 循环订阅收入
          detail: 单独订阅在各产品内续费，而不是共享一个总括套餐
          tone: positive
        - id: expansion
          label: ARPU 扩张
          detail: 跨产品叠加和企业席位可以抬高单个客户或账户的总支出
          tone: positive
        - id: gross-profit
          label: 扣除服务成本后的毛利
          detail: 只要支持、数据授权和获客成本受控，软件经济性就有吸引力
          tone: positive
      edges:
        - from: discover
          to: product-choice
          label: 由用例驱动的入口
        - from: product-choice
          to: trial
          label: 免费档或试用
        - from: trial
          to: billing
          label: 选择年度、月度或团队计费
        - from: billing
          to: subscription
          label: 付费会员激活功能
        - from: subscription
          to: expansion
          label: 交叉销售更多应用或席位
        - from: expansion
          to: gross-profit
          label: 更高循环收入摊薄固定成本
    claimRefs:
      - CI001
      - CI004
      - CI006
      - CI007
      - CI029
      - CI031
      - CI037
  - id: FI002
    title: 单位经济性桥
    type: flow
    layout: standard
    summary: 公开证据指向软件式利润率，但实际单位经济性取决于计费组合、折扣和支持负担。
    approximationNotes: onX 未披露毛利率、CAC 或 NRR，因此该图是定性图。它映射公开可见的成本和现金转化驱动因素，而不是假装精确量化。
    data:
      nodes:
        - id: acquisition
          label: 获客支出
          detail: 品牌营销、合作伙伴和增长团队把用户带进各个垂直领域
          tone: neutral
        - id: conversion
          label: 试用转付费
          detail: 用户转为 Premium 或 Elite 会员，常伴随年度预付激励
          tone: neutral
        - id: billing-mix
          label: 计费组合
          detail: 直接网页、应用商店和企业发票很可能有不同的净经济性
          tone: neutral
        - id: realized-arpu
          label: 实际 ARPU
          detail: 标价会被促销、产品组合以及月付还是年付的选择压低
          tone: neutral
        - id: service-costs
          label: 服务和数据成本
          detail: 地理空间数据、支持、地图纠错和产品招聘会吃掉收入
          tone: warning
        - id: margin-outcome
          label: 贡献利润率结果
          detail: 直接年度续费会改善利润率；折扣或重支持负荷会拉低利润率
          tone: positive
      edges:
        - from: acquisition
          to: conversion
          label: 付费和自然获客
        - from: conversion
          to: billing-mix
          label: 渠道决定净留成
        - from: billing-mix
          to: realized-arpu
          label: 平台费和折扣塑造净价
        - from: realized-arpu
          to: service-costs
          label: 收入必须覆盖数据、支持和薪酬
        - from: service-costs
          to: margin-outcome
          label: 支持负担之后的剩余贡献
    claimRefs:
      - CI029
      - CI030
      - CI032
      - CI033
      - CI035
      - CI037
      - CI041
