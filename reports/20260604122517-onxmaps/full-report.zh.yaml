            body: >-
              IP 图景不算深，但是真实存在。Justia 列出一项 2026 年 1 月授予 onXmaps
              的专利，涉及用于降低网络流量的地图数据压缩，契合公司离线重、移动优先的产品设计。商标记录比专利记录更宽，商业上可能更重要：ONX、ONX BACKCOUNTRY 和 ONX OFFROAD
              都出现在软件、地图服务、天气和导航相关类别中。这个组合本身不能证明深护城河，但确实强化了一个判断：onX 正在保护多界面地图业务，而不是窄媒体品牌。公开材料也暗示了混合的自研 /
              外采姿态。公司似乎自建应用工作流、同步、会员体系，以及至少部分渲染 /
              压缩技术，同时依赖外部县级、联邦和平台数据来源来获得地块、所有权和公共土地输入。因此，依赖负担不只是数据质量；还包括权利、刷新节奏，以及把外部数据集包装成用户愿意订阅的专有体验的成本。
