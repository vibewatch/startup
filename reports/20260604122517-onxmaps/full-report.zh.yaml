  - id: TV005
    title: 投资逻辑破裂与杀出触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 核实收入达不到可比公司门槛
        - 董事会层面的收入明显低于 ~$200M-$250M，或与乐观叙事严重不匹配。
        - 公开可比公司组合不再支撑 $1.4B 估值。
        - 按更接近悲观区间重做模型，或退出。
      - - 留存显弱
        - 队列流失、支持负担或产品投诉显示，续费表现明显差于高端订阅 app。
        - 高端定价无法再转化为持久价值。
        - 下调倍数、要求更低入场价，或继续等待。
      - - 利润率转化偏薄
        - 毛利率或 FCF 转化撑不住反向 DCF 门槛。
        - 看似合理的估值，在现金经济性上会变贵。
        - 按更低利润率的软件或混合服务可比公司重做投资测算。
      - - 优先股堆叠对投资人不友好
        - Series C 或 2025 年 11 月条款嵌入清算或治理保护，扭曲表面估值。
        - 即使名义估值不变，实际入场经济性也会变差。
        - 暂停，或要求结构化交易。
      - - 跨垂类扩张不及预期
        - Offroad、Backcountry 和 Fish 没有在 Hunt 之外显示有意义的付费采用。
        - 平台故事退回更窄的狩猎 app 故事。
        - 把案例切到更低 TAM 和更低倍数假设。
    notes: 这些是估值杀出触发项，不是泛泛的公司风险：每一项都可能直接推翻价格，而不只是让故事没那么好听。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
      - CV024
      - CV025
      - CV040
      - CV042
      - CV043
      - CV050
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入和 ARR 桥接
        - 2024-2026 年经董事会批准的收入、ARR 和产品层付费订阅用户数。
        - 这个分母决定 $1.4B 是销售额的 2x、5x 还是更高。
        - 财务团队、董事会材料和审计师编制的桥接表。
      - - 按产品拆分的留存和流失
        - Hunt、Offroad、Backcountry 和 Fish 的总留存、续费、退款和支持成本数据。
        - 只有续费质量耐久，高端 app 定价才有意义。
        - 收入运营、队列看板和客户支持分析。
      - - 毛利率和 FCF 转化
        - 按产品拆分的托管、影像、地图数据和支持成本结构。
        - 反向 DCF 对利润率敏感；转化偏弱会打破估值逻辑。
        - CFO 复核，加上云和供应商成本拆解。
      - - 股权结构表和优先权
        - Series C 和 2025 年 11 月融资文件、投资人权利和清算堆叠。
        - 表面估值可能与真实经济入场价值明显偏离。
        - 律师审阅融资文件和附函。
      - - 交叉销售质量
        - 有多少用户购买一款以上 app，以及这对 ARPU 和流失的影响。
        - 只有钱包份额扩大，平台逻辑才比单 app 逻辑更值钱。
        - 产品分析和客户队列研究。
      - - 数据质量和投诉趋势
        - 边界准确性升级率、县级数据延迟和整改流程。
        - 地图本身就是承诺，信任被侵蚀会打击续费。
        - 支持运营和源数据管理复核。
    notes: 这些是把案例从看似可行推进到可按当前估值承做所需的最低尽调要求。
    claimRefs:
      - CV021
      - CV024
      - CV025
      - CV040
      - CV042
      - CV043
      - CV050
      - CV051
