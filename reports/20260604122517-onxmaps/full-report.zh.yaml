            body: >-
              公开采用证明在 Hunt 上最强，在 Offroad 上有意义，在 Backcountry 上更小但仍真实。Hunt 结合了自有话术中的「数百万猎人」，以及异常大的应用表面足迹：274K 条 Apple
              评分、5M+ Google Play 下载，以及 AppBrain 8.7 million 终身下载估计。Offroad 明显更小，但不是小众：8.3K 条 Apple 评分、1M+ Google Play
              下载，以及 AppBrain 3 million 终身下载估计。Backcountry 在可见规模上又低一档，自有页面有 5,500 条评分，Google Play 下载为
              500K+，但其表面积仍足以支撑专门用户社区。具名客户证明也存在，主要来自应用商店和自有表面评价，而不是企业案例研究：Hunt 用户提到多年使用和成功的州外狩猎，Offroad 用户提到家庭路线规划和 SxS
              使用，Backcountry 用户提到反复用于滑雪、骑行、徒步和安全关键场景。缺失项和已出现项一样重要：保留来源中没有任何一个披露付费订阅用户数、活跃用户数或产品级收入结构。
