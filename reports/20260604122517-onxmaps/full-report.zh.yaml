      - number: '2.2'
        title: TAM、SAM、SOM 与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              可用的规模测算视角很多，但回答的问题不同。在最宽的语境层面，BEA 将 2024 年美国户外休闲经济的增加值定为 $696.7 billion；ORR 则把同一生态系统描述为 $1.3 trillion 总产出和
              5.2 million 个就业岗位。这些数字太宽，不能作为 OnX 的 TAM，但能显示户外参与活动系统的规模。OIA 2024 年摘要称，2023 年户外参与者基数为 175.8 million 人；FWS
              统计 2022 年约有 40 million 钓鱼者和 14.4 million 猎人。公共土地使用规模同样很大：Forest Service 估计年度休闲访问量 164 million 次，NPS 称 2024
              年公园游客带来 $56.3 billion 经济产出，BLM 记录 80.8 million 次访问和 21.9 million 名越野公路参与者。


              最窄的公开自上而下软件代理指标是户外导航应用市场，一家公开分析机构估计 2024 年全球规模为 $2.85 billion，北美约为 $1.05 billion。更宽的相邻数字地图估计达到全球 $25.3
              billion，但它包含 GIS、导航地图和地图数据，远超 OnX 的专业工作流。因此，SAM 和 SOM 受证据限制：公开来源能放大相关活动人群和周边应用类别，但没有披露猎人、钓鱼者、OHV
              用户和野外用户之间的去重重叠，也没有披露 OnX 自己的付费订阅用户数。
