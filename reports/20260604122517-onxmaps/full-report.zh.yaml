  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 收入与利润率假设
      - 估值逻辑
      - 示意公允价值
    rows:
      - - 乐观
        - 25%
        - 外部 >$500M 收入估计方向上被证明正确；产品层留存强；FCF 利润率达到高端 app 结果的上沿。
        - 约 5x-6x 销售额的高端公开 app / 平台倍数，加上强劲反向 DCF 覆盖。
        - $2.0B-$2.8B
      - - 基准
        - 50%
        - 核实收入大致落在 $250M-$350M 区间；盈利性增长真实但不顶尖；流失和支持成本可接受。
        - 约 4x-5x 销售额，反向 DCF 要求高但并非不可能。
        - $1.2B-$1.8B
      - - 悲观
        - 25%
        - 核实收入低于 $200M 出头，或流失比定价暗示的更差；投诉是续费质量变弱的早期证据。
        - 更接近 3x-4x 销售额，对表面估值缺少足够 FCF 支撑。
        - $0.7B-$1.1B
      - - 概率加权
        - —
        - 基准情景占主导，乐观情景仍取决于私有文件。
        - 上述情景中点加权。
        - ~$1.45B
    notes: 这些区间是锚定公开可比公司算法和反向 DCF 门槛的情景判断，不来自 onX 披露的利润表。
