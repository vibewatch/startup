  - id: TP001
    title: 竞争对手画像表
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most commercially relevant direct peers, adjacencies, substitutes, and one absorbed legacy brand
        visible in retained 2018-2026 public sources for outdoor-navigation app buyers.
    columns:
      - 竞争对手
      - 类别
      - 规模或代理指标
      - 目标细分
      - 差异化
      - 局限
    rows:
      - - onX
        - 直接产品组合龙头
        - 数百万人信任 Hunt；650K+ 越野路线英里；四个品牌 App
        - 猎人、越野玩家、偏远户外用户、钓鱼者
        - 按活动拆分专门 App，绑定土地进入权、路线和影像图层
        - 核心地图功能已不再独特，精确付费占比未披露
      - - HuntStand
        - 直接狩猎同业
        - 2M 活跃猎人；4.8M 狩猎区域；管理 210M 英亩
        - 猎人和土地管理者
        - 猎位预订、月度卫星图、群组地图、大型免费转付费漏斗
        - 规模口径由公司自报，品牌很大程度上聚焦狩猎，不是广义户外
      - - BaseMap
        - 直接狩猎同业
        - 1M+ 猎人；150M+ 地块记录；175M+ 地址
        - 需要土地所有权信息和规划研究的猎人
        - 土地所有权保证、HuntPlanner、HuntWind、一个会员覆盖 50 州
        - 狩猎以外能见度较低，主流品牌弱于 onX 或 AllTrails
      - - GOHUNT Maps
        - 直接 / 小众狩猎同业
        - 官方覆盖 50 州；评测聚焦西部大型猎物
        - 西部大型猎物猎人和标签研究用户
        - 抽签概率、单元画像、分层西部狩猎情报
        - 保留公开价格点最高，对通用单州使用吸引力较弱
      - - Gaia GPS
        - 相邻偏远户外 / 越野同业
        - 长期多用途品牌；评测覆盖 300+ 地图来源
        - 偏远户外规划者、陆上穿越玩家、高阶地图用户
        - 深度地图图层、自定义路线、强离线规划灵活性
        - 学习曲线更陡；并入 Outside 套餐后，价格和平台管理方面投诉更多
      - - AllTrails
        - 相邻主流替代品
        - 400K+ 路线地图；评测覆盖称年用户 10M+
        - 日间徒步者、跑步者、轻度户外用户
        - 发现、用户评价、路线照片、新手友好界面
        - 对土地所有权、狩猎或高阶离网地图工作不够专业
      - - Avenza Maps
        - 相邻专业替代品
        - 数字地图商店，定位专业 / 离线
        - 专业人员、偏远户外专家、需要权威地图的猎人
        - 导入或购买权威地图后离线使用
        - 核心不是路线发现或广泛消费者社区
      - - Garmin BaseCamp / handhelds 设备
        - 传统替代品
        - Garmin 硬件生态仍在；BaseCamp 桌面软件仍可用
        - 偏好耐用设备或桌面优先规划的用户
        - 手机易损或电量受限时，可作为耐用离线替代
        - 专用手持设备偏小众，UX 较手机 App 老旧
      - - ScoutLook (legacy)
        - 被吸收的传统竞争对手
        - 地界线和天气工具并入 HuntStand
        - 过去需要天气和地界线工具的猎人
        - 早期天气 / ScentCone 差异化，以及全国地界线覆盖主张
        - 迁入 HuntStand 后不再独立存在
    notes: 规模和价格单元格优先使用仍可访问的官方页面；缺少官方数据时使用独立评测。未披露的融资和订阅用户数据按未知处理，不做推断。
