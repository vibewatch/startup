      - number: '2.3'
        title: 增长驱动、逆风与监管结构
        blocks:
          - type: paragraph
            body: >-
              OnX 所在市场的增长驱动异常具体。徒步、露营、钓鱼等入口活动仍在扩张；NPS、USFS 和 BLM 土地的公共访问量依然巨大；更好的智能手机 GPS、离线工作流、AI 辅助路线和更丰富的 GIS
              数据正在推高数字地图能力。户外导航和数字地图分析师也指向消费者自付订阅之外的商业、公共安全和政府终端市场。OnX
              自己的信息更贴近野外决策——物种分布、路线规划、道路合法性、财产线和离线导航——这与反复获得公共投资和用户参与的类别相吻合。


              逆风同样具体。FWS 仍把猎人和钓鱼者招募与留存定义为全国性挑战，意味着 OnX
              一些最高价值用户群并非均匀增长。导航产品的隐私和数据安全担忧正在上升。源数据可得性不均，尤其是地块边界和土地所有者身份。越野使用方面，合法路线状态取决于当前官方地图，而不只是 GPS
              是否可达。这让市场具备防御性，因为专业产品解决的任务比通用地图更难；但也让市场运营要求更高：产品质量取决于持续接入、标准化和维护官方土地通行数据。
