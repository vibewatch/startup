  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - onX（标的）
        - 2025 年 7 月私有估值标记
        - ~$1.4B 估值；隐含倍数取决于未披露收入
        - 直接价格发现，也体现资方支付意愿。
        - 公开记录仍缺少经审计收入和优先股条款。
      - - Garmin
        - 2026 年 6 月公开市场交易
        - 6.15x P/S；$45.89B 市值；$7.25B FY2025 收入
        - 户外导航和地图信任最好的参照。
        - Garmin 的硬件和设备业务占比远高于 onX。
      - - Duolingo
        - 2026 年 3 月至 6 月公开市场交易
        - 4.55x P/S；$1.10B TTM 收入；$5.00B 市值
        - 有用的高端消费者订阅 app 基准。
        - 语言学习比狩猎地图更容易养成习惯，全球规模也更大。
      - - Life360
        - 2026 年 3 月至 6 月公开市场交易
        - 7.11x P/S；$528.98M TTM 收入；$3.74B 市值
        - 付费移动定位工具最接近的公开类比。
        - 安全和家庭协同不同于户外娱乐用例。
      - - Zillow
        - 2026 年 6 月公开市场交易
        - 3.02x P/S；$2.69B TTM 收入；$8.12B 市值
        - 以地图为核心的数据层和消费者工具参照。
        - 平台撮合经济性不同于 onX 的直接订阅模式。
      - - Match Group
        - 2026 年 6 月公开市场交易
        - 2.27x P/S；$3.52B TTM 收入；$8.00B 市值
        - 成熟订阅 app 的有用下限。
        - 社交网络动态与户外导航差异很大。
      - - Airbnb
        - 2026 年 6 月公开市场交易
        - ~6.3x 销售额；$12.64B TTM 收入；$79.28B 市值
        - 品牌和习惯强度的高端消费者平台参照。
        - 平台抽成经济性与 onX 有结构性差异。
    notes: 这张表完整覆盖本章估值集：一个直接私有估值标记和六个公开参照，横跨户外信任、消费者订阅、工具、地图数据和成熟 app 变现。
