      - number: '1.4'
        title: 里程碑、合作伙伴与准确性相关尽调风险
        blocks:
          - type: paragraph
            body: >-
              onX 的里程碑模式显示，公司反复把最初的 Hunt 切口拓宽为更多元的户外平台。公司从 GPS 芯片和 Hunt 应用起步，2020 年收购 Outdoor Project 和 Adventure
              Projects，2021 年初推出 Backcountry，2025 年推出 Fish，并在 2025-2026 年与 Moultrie、T-Mobile、Ford 和 Toyota
              合作，延伸功能深度、连接能力和分发。它在准入和公共土地保护上的投入不只是企业社会责任品牌包装；2024 和 2025 年影响力报告都把公司身份与公共土地倡议、资助和数据驱动政策活动绑定，包括 MAPLand
              Act 的落地里程碑。


              主要反向尽调信号不是监管麻烦，而是产品可靠性的边界。onX 自己的支持文档称，地图准确性取决于上游数据质量，地块图层每一到两年才更新一次，Offroad
              中的卫星影像平均已有四年历史。公司积极征集地图错误报告，这是正向信号，但也意味着纠错积压持续存在，地方数据质量参差不齐。独立评论表面总体方向偏正面——尤其是应用商店——但 SlashGear 和
              ArcheryTalk 留下了一条一致提醒：财产边界可能过时或偏移，不应被当作测绘级法律证据。对一个靠用户「可以合法去哪里」的信心变现的产品来说，这个限定具有战略重要性。
