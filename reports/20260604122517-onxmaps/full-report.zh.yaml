  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方地图
        blocks:
          - type: paragraph
            body: >-
              OnX 更适合被理解为一组独立户外导航产品，而不是单一打包客户基础。官方支持明确说明，Hunt、Offroad 和 Backcountry
              有不同会员体系，支付一个产品并不会解锁其他产品的付费功能。这很重要，因为买方、用户、付款人的模式会随应用变化。Hunt 面向在公共和私人土地上导航、规划标签、侦察远程地形的猎人。Offroad
              面向机动用户——4x4、SxS、ATV、越野摩托、雪地摩托和 overlanding 客户——他们需要路线发现、露营、土地数据和团队导航。Backcountry
              面向徒步者、攀岩者、背包客、山地车手和滑雪用户，提供路线规划和安全图层。唯一明确公开的非消费者动作是员工福利 / 团体会员页面，显示管理者买方可以跨一个或多个 Elite
              产品管理员工个人账户。这把付款人基础扩展到个人订阅者之外，但公开记录仍更强地指向自助式爱好者，而非大型企业账户。
