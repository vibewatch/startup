  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方逻辑
        blocks:
          - type: paragraph
            body: >-
              OnX 的市场应界定为专门的户外野外导航和土地情报软件，而不是整个户外经济，也不是完整的全球数字地图技术栈。公司自己为 Hunt、Offroad、Backcountry 和 Fish
              销售不同产品，产品页面强调离线导航、物种或地形图层、路线规划、私有或公共土地语境，而非通用社交发现或通用地图。这个边界很重要，因为美国广义户外经济的增加值已达数千亿美元，但其中只有很窄一部分支出流向软件订阅和高级地图图层。


              因此，纳入的支出池是野外地图工作流中的订阅或交易支出，前提是合法通行、土地所有权、道路合法性或特定资源图层很重要。它包括狩猎土地边界情报、钓鱼发现图层、越野道路合法性和逐向导航、野外地形或风险解读。它排除大部分住宿、服装、硬件、向导旅行收入，以及更宽的商品化地图基础设施市场，后者最多只是相邻上限。公共数据依赖是边界的核心：OnX
              称公共土地图层覆盖全州，但地块完整性取决于县和州数据可得性，也就是说，产品效用部分取决于源数据开放程度，而不只是软件分发。
