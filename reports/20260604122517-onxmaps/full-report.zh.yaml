  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    enumerationScope:
      coverage: partial
      basis: >-
        Rows isolate the main public moat claims and countervailing threats that matter most for underwriting a
        phone-first outdoor-navigation platform in 2026.
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 缓解措施或尽调问题
    rows:
      - - 按垂直场景拆产品，能提升场景贴合度
        - 对手仍可补齐单项功能，并用低价切入
        - 高
        - HuntStand、BaseMap、GOHUNT、Gaia 和 AllTrails 都占住了这项任务的强切片
        - 要求提供 Hunt、Offroad、Backcountry 和 Fish 的产品级留存率与交叉销售率
      - - 土地权属语境难复制
        - 产权边界和地主明细在狩猎同业中已很常见
        - 高
        - HuntStand、BaseMap、GOHUNT 和 ScoutLook 都营销过产权线访问
        - 审计实际数据新鲜度、法律准确性和刷新成本，而不是假设其独家
      - - 越野路线策展沉淀数据优势
        - Gaia 可凭更深的地图自定义和规划能力拿下高阶用户
        - 中
        - 评测者普遍给 onX Offroad 的路线数据库更高分，给 Gaia 的自定义更高分
        - 要求按州提供活跃路线贡献、核验和刷新指标
      - - 大众发现入口可以转化为变现
        - AllTrails 可能占住发现入口，而 onX 只掌握更窄的垂直工作流
        - 中
        - AllTrails 被定位为最容易上手的一日徒步发现 App，并有 10M+ 年度用户代理指标
        - 衡量先从发现进入的用户后来转化为土地准入或高级路线规划买家的频率
      - - 手机优先 UX 胜过传统 GPS 工具
        - 耗电、隐私或路线摩擦会把重度用户推向 Gaia、Avenza 或 Garmin 替代品
        - 中
        - The Verge 因电池测试剔除了 onX，评测者仍会叠用多款 App
        - 要求按产品和出行类型提供电池、崩溃和流失指标
      - - 仅靠品牌规模可以守住份额
        - 分场景份额代理指标显示，市场可能有多个耐久品牌，而非赢家通吃
        - 中
        - HuntStand、BaseMap、AllTrails、Gaia 和 GOHUNT 都保有可见的品牌楔子
        - 评估护城河时看用户习惯和工作流贴合度，不要假定垄断或网络效应
    notes: 严重性评级是基于保留公开证据的分析判断，不是公司披露的风险标签。
