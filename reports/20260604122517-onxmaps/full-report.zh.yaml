      - number: '7.3'
        title: 运营可靠性与支持执行风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，onX 卖的是高风险野外工具，但支持模式仍然明显有限。产品承诺覆盖离线地图、实时位置共享、3D 地形、猎摄相机集成、测距仪和望远镜同步、车载导航、桌面研究工具，以及 Apple 和 Android
              两端的设备专属流程。这种宽度在战略上有吸引力，但也成倍增加故障模式。官方故障排查中心已经列出会员问题、标注丢失、地图信息缺失、CarPlay
              问题、指南针问题和芯片更新错误。独立问题追踪器展示了同一复杂性的公开症状：登录失败、崩溃、黑屏、卫星影像缺失、地块线缺失，以及 2026
              年的无法使用报告。投诉聚合站还给出轶事但方向一致的指控：保存项丢失、账户混乱、电话支持难接通、等待支持时间长。onX 称，真人电话和 SMS 团队按 Montana
              工作时间运转，非工作时段走虚拟代理或邮件流程，典型响应时间为一个工作日。这对常规账单问题也许够用；但对一款常在天亮前、偏远地形中使用的产品来说，图层缺失、同步异常或登录锁定都可能立刻毁掉付费订阅的价值。剩余风险不只是宕机，而是支持弹性能否匹配户外导航的现实时间点和情绪代价。
