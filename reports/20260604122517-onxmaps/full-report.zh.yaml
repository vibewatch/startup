      - number: '2.4'
        title: 地理扩张与可服务市场
        blocks:
          - type: paragraph
            body: >-
              监管和地理对可服务市场的塑造，不亚于消费者需求。EXPLORE Act 现在要求 BLM 和 Forest Service 在 2025 年 1 月后的五年内公开提供符合 GIS
              标准的交通和机动车使用地图，并持续审查，这会从结构上利好地图数据可得性。联邦政策也明确鼓励在适当情况下增加机动和非机动通行，可能随着时间扩大可被制图的休闲资源库存。与此同时，Forest Service 的
              MVUM 页面提醒用户，地图未显示的路线不向机动车开放；该机构还在 2026 年 6 月表示，无法再更新或新增数字 MVUM 到 Avenza
              商店。这个组合提醒我们，官方路线数据可能改善，但分发和刷新摩擦仍然真实存在。


              地理上，加拿大是公开证据中最可信的扩张前沿。OnX Hunt 已经销售加拿大覆盖，并列出 Crown Lands、向导服务区域、抽签区、furblock 单元，以及包含加拿大或美国 50
              州加加拿大的定价层级。相比之下，OnX Offroad 称，美国、加拿大和有限墨西哥之外的详细图层尚不可用。现实结论是，近期扩张受限的不是应用商店触达，而是需要按市场获取并标准化高质量地籍、通行和路线数据集。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM025
              - CM026
              - CM027
              - CM028
              - CM045
              - CM046
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 最好的公开 TAM 代理指标是窄口径，不是宽口径
            body: >-
              $25.3 billion 的全球数字地图估计只能作为相邻上限。对 OnX 来说，更好的公开 TAM 代理指标是北美户外导航应用类别，因为它至少匹配公司的当前地理范围和消费者用例。再宽的口径都会开始纳入 GIS
              基础设施、汽车导航和企业地图，而 OnX 今天并不直接从中变现。
            calloutType: insight
            claimRefs:
              - CM031
              - CM034
              - CM035
              - CM042
          - type: callout
            title: 数据权利与刷新负担是绑定市场的约束
            body: >-
              户外地图表面上像软件市场，但服务质量取决于能否及时获取官方地块、通行和路线数据集。OnX 自己的地块覆盖说明、MVUM 路线的法律状态和 Avenza
              分发变化，都指向同一风险：类别增长真实存在，但市场获取取决于接入和刷新公共数据图层的运营能力。
            calloutType: risk
            claimRefs:
              - CM004
              - CM027
              - CM028
              - CM046
              - CM047
          - type: callout
            title: 加拿大是下一个合乎逻辑的地理市场，而非泛全球扩张
            body: >-
              公开证据支持加拿大优先扩张逻辑，因为 OnX 已经销售加拿大覆盖，并列出加拿大专属土地和狩猎单元图层。同一证据也说明，美国、加拿大和有限墨西哥之外缺少详细图层，因此任何更激进的国际 TAM
              叙事，都应被视为尽调假设，而不是已经成立的市场事实。
