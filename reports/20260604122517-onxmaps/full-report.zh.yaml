      - number: '4.2'
        title: 增长证据与公开牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务信号不是绝对收入数字，而是管理层在两个时间点披露过的增长节奏。2022 年，onX 称 ARR 在过去四年增长 10x。2025 年，公司称随后三年 ARR 近乎翻三倍。合在一起看，这些表述意味着
              onX 即使走出最初 Hunt 小众市场后，仍保持强增长。公开牵引力代理指标指向同一方向：Apple 列出 Hunt 有 274K 条评分、得分 4.9；官方 Hunt、Offroad 和 Backcountry
              页面都宣传大规模数据覆盖和数百万用户。


              问题在于，外部数据库并不一致地把这种增长转换成当前收入。ZoomInfo 估计收入为 $102.5M，IncFact 则把收入放在 $500M
              以上，并承认该数字是统计评估。这个差距太宽，无法锚定承销。最安全的判断是，onX 拥有一个有实质规模的订阅业务，增长强劲、消费者覆盖面大；但公开记录还不足以支持精确的 2026 年收入或 ARR 金额。
