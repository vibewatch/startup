      - number: '7.4'
        title: 平台、数据供应商与 IP 依赖风险
        blocks:
          - type: paragraph
            body: >-
              onX 的经营杠杆离不开外部平台和数据供应商。移动端上，Apple 和 Google 为应用内订阅用户中介账单、退款和账户状态。产品端上，地块线和部分公共土地图层依赖县、州、USDA 和 BLM 相关信息，onX
              不能完全控制。这意味着公司可能因为缺陷挨骂，而根因其实在上游：县级刷新节奏、公共数据变化或平台政策调整。依赖栈也扩大了法律暴露。Mountain Project / OpenBeta 冲突显示，只要 onX
              认为存在战略泄漏，它愿意围绕数据所有权和再利用采取强硬动作；但同一事件也制造了公开的矛盾叙事，因为 Mountain Project 关于用户所有权的表述与 DMCA
              执法并不协调。这个问题不只关乎攀岩：一家户外平台公司一旦积累用户生成的航点、路线、报告或社区数据，围绕公司能如何使用这些内容的任何模糊地带，都会变成可重复出现的风险向量。onX
              自己的条款又加深了这点担忧：用户内容仍归用户所有，但用户授予 onX 一项永久、不可撤销的许可，允许其为服务使用并修改内容。投资人应把它当作依赖与权利栈来承销，而不只是一套地图栈。
