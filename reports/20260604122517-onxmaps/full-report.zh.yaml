      - number: '7.5'
        title: 财务暴露、剩余风险与否决标准
        blocks:
          - type: paragraph
            body: >-
              财务风险的核心不在于公司马上崩盘，而在于压力下的不透明和不利单位经济。公开来源清楚展示了价格面和庞大订阅基础的存在，但没有披露流失率、退款率、客户支持成本、应用商店费用流失、县级数据获取成本，或按计划拆分的贡献利润率。因此，投资人无法从公开证据判断，onX
              吸引人的户外软件故事，究竟由耐久的订阅经济支撑，还是一旦取消上升、支持需求激增、平台和数据成本上行就会变脆。定价压力并非想象：批评者已经把经常性土地数据订阅描述成榨取式收费，用户投诉也显示，账单和支持摩擦会直接威胁续订意愿。正确的承销姿态因此应先监控。如果准确性投诉持续存在、取消摩擦引来审查，或可靠性事件开始击中一款拥有数十万公开评分的产品，下行会迅速从信任传导到流失、退款成本和支持负荷。公司很可能通过运营动作缓解许多问题，但缺少经审计的公开财务，意味着投资人在假设模式像品牌看起来那样有韧性之前，需要明确的否决标准和私下尽调。
