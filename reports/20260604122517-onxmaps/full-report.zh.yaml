  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 投资逻辑
      - 改变判断的因素
    rows:
      - - 资方质量
        - 2018、2022 和 2025 年，多家可信的成长型投资人持续加码。
        - 如果上报的私有收入与董事会层面的真实情况明显脱节，这个信号会变弱。
      - - 产品变现
        - onX 多款 app 都能做高端定价，还有交叉销售和 Elite 增购空间。
        - 如果实际付费转化和续费偏弱，单靠标价撑不起估值。
      - - 平台宽度
        - 数百万用户和四款 app 套件，让 onX 看起来不只是单一垂类的狩猎工具。
        - 如果使用仍高度集中在 Hunt，且 Offroad / Backcountry 变现偏弱，平台逻辑就会变薄。
      - - 公开可比公司背景
        - 只要 onX 收入稳稳高于 $200M 出头，公开 app 和平台可比公司可以支撑 $1.4B 估值。
        - 如果核实收入明显低于这条线，同一组可比公司会指向下行。
      - - 反向信号
        - 边界准确性投诉会在依赖信任的产品里制造真实续费风险。
        - 留存和支持记录如果干净，投资人就应降低对轶事投诉的权重。
      - - 披露缺口
        - 反向逻辑不是 onX 弱，而是分母里太多内容仍关在数据室。
        - 经审计收入、NRR 和优先股条款，可能把立场从合理推到有吸引力。
    notes: 反向逻辑主要是缺少分母证据，不是品类相关性或资方质量有问题。
