  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、相邻产品和替代品解决重叠的户外导航任务
        blocks:
          - type: paragraph
            body: >-
              OnX 周围的竞争格局不是一圈整齐的同类应用。OnX 选择了组合策略，把市场拆成 Hunt、Offroad、Backcountry 和
              Fish，而不是要求一个界面满足所有活动。这样形成了一个直接狩猎土地竞争者集群——HuntStand、BaseMap、GOHUNT Maps，以及历史上的 ScoutLook——也形成了另一个相邻替代品集群，由
              Gaia GPS、AllTrails、Avenza Maps 和 Garmin 长期存在的桌面 /
              手持生态领衔。直接狩猎对手强调地块线、侦察、天气或抽签概率情报。相邻对手强调路线发现、地图图层深度、权威导入地图或坚固设备可靠性。ScoutLook 如今主要是历史，因为 HuntStand 在 2019
              年吸收了它，但这段历史具有战略意义：这个市场中的有用功能确实会被复制、打包并吸收。对投资者的含义是，买方不是在一堆相同产品中选择；他们是在为不同户外工作流优化的工具之间选择，onX
              在合法性、土地通行和活动专属语境最重要的地方最强。
