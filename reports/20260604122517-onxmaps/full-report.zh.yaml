chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品套件与商业模式
        blocks:
          - type: paragraph
            body: >-
              onX 将自己的使命表述为唤醒每个人心中的冒险者，创始故事也异常贴近产品本身：Eric Siegfried 说，他在 2009 年创办公司，是为了让猎人在野外能看清公共土地边界。公司最初销售 SD
              卡地图芯片，2013 年推出 Hunt 应用，如今则把一套更宽的消费者订阅平台推向市场，平台由按活动区分的导航应用组成。公司和投资方公开材料一直把 Missoula, Montana 作为公司锚点，招聘页面和
              Montana 生态来源则补充了 Bozeman 业务，以及分布在美国各地的「Basecamps」。


              今天，平台覆盖四个品牌应用——onX Hunt、onX Offroad、onX Backcountry 和 onX Fish——通过循环订阅层级销售，而不是一次性软件许可。旗舰 Hunt
              产品仍最清楚地体现最初切口：面向猎人的私有 / 公共土地边界、离线地图、3D/LiDAR 视图、天气、路线构建和猎摄相机集成。Offroad 把同一套土地与位置能力延伸到机动休闲，Backcountry 用于徒步
              / 滑雪 / 攀岩导航，Fish 则为钓鱼者增加湖泊发现和鱼种筛选。应用套件的扩张很关键，因为它把 onX 从小众狩猎工具重新定义为更宽的户外消费者软件平台。
