        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务结论在收入质量和资本获取上方向正面，但仍不足以完整承销。onX 显然运行着循环订阅模式，具备按产品区分的定价、宽广消费者采用，以及刚起步的企业 / 团队渠道。官方披露显示 ARR 多年强劲复合增长，2025
              年融资和 profitable-growth 表述也说明这不是一个脆弱、只靠促销的消费者应用故事。从这个意义上说，公司看起来比许多依赖单一小众 SKU 或单次融资的户外或导航创业公司更健康。


              阻塞点是精确度。公开数据库在收入上差异很大，没有公开来源给出 ARR 金额，公司也不披露现金、烧钱、毛利率、CAC、回本周期、NRR 或渠道结构。因此，投资者可以为「onX
              是有规模、可能高效的订阅平台」这一逻辑辩护，但还无法建立硬估值模型。下一步尽调应把实际收入、计费渠道组合和利润率结构，与公开来源中已经可见但仍不完整的强增长叙事逐项核对。
