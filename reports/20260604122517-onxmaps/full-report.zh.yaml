  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与循环收入质量
        blocks:
          - type: paragraph
            body: >-
              onX 主要靠循环订阅变现，订阅跨三个独立的冒险专属应用销售——Hunt、Offroad 和 Backcountry——每个产品都需要单独付费访问。这个结构在财务上重要，因为它创造了清晰的循环收入引擎，同时也让
              onX 能按用例区分定价，而不是强推一个总包。Hunt 的当前定价阶梯最丰富：$34.99 单州、$49.99 双州、$99.99 年度 Elite，以及 $14.99 月度 Elite。Offroad 沿用
              $34.99 / $99.99 的年度阶梯，Backcountry 目前则显示大幅促销，把 Premium 和 Elite 价格砍到远低于名义标价。


              onX 已不再是纯消费者业务。企业业务页面明确显示，公司现在销售按用户计价的企业许可，包含团队管理、单一发票续约和明确的商业使用权。它影响收入质量，因为消费者订阅、应用内续费和企业 /
              团队席位很可能有不同毛利率和留存画像。支持文章也确认了一种鼓励叠加消费的产品架构：一个既狩猎、又开越野车、还背包徒步的用户，可能最终为多个应用付费，而不是购买一个共享订阅。
