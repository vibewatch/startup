            body: >-
              2025 年融资后，资本充足性看起来比 2022 年窗口期强得多。Premier Alternatives 和 TexAu 都把最新一轮放在约 $280M，累计融资接近 $388M，公司估值约
              $1.4B。不同于许多风投支持的消费者应用，onX 还有一条少见的公开盈利线索：Summit 在 2025 年战略投资公告中称公司呈现 profitable growth。如果这个措辞方向上准确，2025
              年资本更可能是增长加速资金，而不是救命跑道。


              不过，现金在手和烧钱速度仍未披露。当前岗位的公开薪资区间和宽口径员工估算意味着，公司在工程、地理空间数据、AI、客户体验和营销上有可观固定成本基础。因此，盈利路径取决于能否高效留住年度订阅用户、把收入组合转向更高毛利的直销或企业收入，并防止数据质量问题推高支持成本。合适的工作假设是，Series
              C 之后融资风险大幅下降，但没有董事会级财务数据，就无法验证精确现金跑道和烧钱速度。
