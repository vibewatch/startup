      - number: '1.3'
        title: 资本形成、规模信号与融资不确定性
        blocks:
          - type: paragraph
            body: >-
              最清楚的有据可查资本历史始于 2018 年，当时 TechCrunch 和其他同期报道称，Summit Partners 在 onX 近十年创始人主导增长之后，领投了公司第一轮机构融资，金额为 $20.3
              million。Summit 当前的投资组合页面后来把这笔初始投资描述为 $26 million，形成一个小的时间线冲突；在使用完全标准化的稀释历史之前，应先用融资文件厘清。下一轮无争议的披露融资是 2022 年
              10 月的 Series B：onX 宣布获得 $87.4 million 成长投资，由 Summit 领投，Madison Valley Partners 和现有投资者参投；公司同时称，2018 年以来 ARR
              增长 10x，团队增长 300%+。


              后期融资透明度明显更低。onX 2025 年 11 月发布稿宣布获得 TCV 战略投资，并得到 Cross Creek 新支持，但未披露支票规模或估值。Summit 和 onX 当时把公司描述为过去三年 ARR
              近乎翻三倍、订阅用户增长到 3M+，且自 Summit 初始支持以来 ARR 增长 19x+、员工增长 5.7x。TechCrunch 2026 年 1 月独角兽综述随后补上了缺失的后期信号：它报道称，公司完成
              $280 million Series C 轮，估值接近 $1.4 billion，累计融资超过 $380
              million。合在一起看，公开记录足以支持后期独角兽状态，但也弱到必须继续尽调股权结构、所有权和准确轮次条款。
