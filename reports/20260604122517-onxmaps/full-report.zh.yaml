      - number: '8.3'
        title: DCF 与情景逻辑
        blocks:
          - type: paragraph
            body: >-
              反向 DCF 视角得到的答案类似。在 10% 折现率和 3% 终值增长假设下，$1.4 billion 价值需要约 $98 million 稳态自由现金流。若 onX 最终能交付 30% 到 20%
              的自由现金流率，对应稳态收入约为 $327 million 到 $490
              million。对于一家盈利、多应用、拥有数百万用户和高端分层结构的订阅平台，这些收入门槛并不荒唐；只是公开材料尚未证明。因此，情景表把当前标记放在基准区间内，而不是放在其上方。乐观情景下，低置信度的 >$500
              million 收入估计方向正确，Hunt、Offroad、Backcountry 和 Fish
              之间交叉销售跑通，留存强到足以支撑高端应用或平台倍数。悲观情景下，真实分母明显更低，流失高于定价暗示，产品准确性投诉则是续订拖累的早期警报。基准情景位于两者之间；没有数据室证明，不支持加价买入。
