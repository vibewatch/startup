      - number: '7.2'
        title: 监管、隐私与消费者保护风险
        blocks:
          - type: paragraph
            body: >-
              即使还没有出现针对公司的执法行动，onX 的消费者订阅模式也已经带来密集的监管暴露。公司自己的条款写明，移动端订阅会自动续订；如果通过应用内购买，Apple 或 Google
              负责中介；卸载应用本身不会停止扣费。退款也按渠道切开：网页购买有 30 天窗口，App Store 和 Google 退款则必须找收款平台处理。这套运营模式正撞上消费者法的方向。California 2025
              年自动续订提醒要求订阅业务取得明确同意、提供便捷取消、为长期计划和试用发送续订通知，并允许线上注册的用户线上取消；FTC 围绕负选项的规则制定同样聚焦不受欢迎的重复扣费和无障碍取消。上述规则对 onX
              很关键，因为公开投诉已经写到，用户在取消或追回扣款时被 Apple 和 onX 来回踢皮球。隐私风险同样具体，而不是抽象概念。onX 披露会收集精确位置、分析与广告伙伴数据流、California
              隐私权，以及法律程序披露；Apple 的隐私标签还显示，追踪相关数据可能包括位置、内容、搜索、浏览、标识符、使用数据和诊断信息。Outdoor Life 进一步说明了它在实践中的分量：传票调取的航点证据进入
              Wyoming corner-crossing 争议，把一个便利功能变成了诉讼敏感证据。
