      - number: '1.2'
        title: 领导层厚度、治理与组织版图
        blocks:
          - type: paragraph
            body: >-
              领导结构已明显从创始人主导执行，转向职业化扩张管理。Laura Orvidas 在融资、影响力和投资方材料中都是公开 CEO；Summit 则称，公司从 Amazon 招募她，是计划内交接的一部分，创始人
              Eric Siegfried 随之转入顾问和董事角色。延续性很重要，因为创始故事仍是品牌核心，但日常经营可信度现在落在更宽的高管班底上。Montana High Tech 的目录列出 Joshua
              Spitzer、Jann Butler、Chris Harvey Bate、Owen Samuels 和 Chris Sledz 担任高管；招聘页面也强调，公司仍在工程、产品、营销、地理空间和客户职能上扩张。


              治理能见度只有一部分。公开材料列出与投资方相关的董事会参与者，如 Summit 的 Colin Mistele，以及 2025 年 TCV 交易后的 TCV Woody Marshall；材料还称 Madison
              Valley Partners 和 Eric Siegfried 仍积极参与治理。但公开资料没有董事会名册、席位分配或所有权拆分。因此，后期控制动态——尤其围绕 2025 年投资周期和据报道的 Series C
              轮——无法仅靠公开来源完全看清，尽管公开证据已足以说明公司现在采用多方投资者治理结构，而非完全由创始人控制。
