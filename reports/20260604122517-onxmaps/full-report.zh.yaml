  - id: TP003
    title: 定价 / 打包对比
    enumerationScope:
      coverage: partial
      basis: >-
        Rows compare headline public list pricing or clearly described package structure for the most relevant
        alternatives visible in retained 2025-2026 public sources; enterprise discounts and promo codes are excluded.
    columns:
      - 公司
      - 主打标价
      - 打包方式
      - 所含强项
      - 影响
    rows:
      - - onX Hunt
        - 单州 Premium 每年 $34.99；两州每年 $49.99；Elite 每年 $99.99
        - 按州分层，最高到全国 Elite
        - 土地权属、离线地图、420+ 个图层、路线构建器、航拍情报
        - 对重度猎人有竞争力，但边界数据已不再独特
      - - HuntStand
        - Pro 每年 $29.99；Pro Whitetail 每年 $69.99
        - 免费核心 App 加付费狩猎层级
        - 产权边界、月度卫星图、3D 地图、无限离线地图
        - 价格 / 功能比激进，持续压制 onX 在鹿猎和租地场景的空间
      - - BaseMap
        - Pro 每年 $39.99；Pro Advantage 每年 $69.99；Pro Ultimate 每年 $99.99
        - 三个全国层级加团队折扣
        - 50 州权属、狩猎规划、风况、离线地图
        - 价格和功能与 onX 直接重叠，限制其 Premium 定价权
      - - GOHUNT Maps
        - 每年 $169.99
        - 单一高级狩猎组合
        - 抽签概率、单元画像、西部狩猎情报、地图、离线使用
        - 价格明显更高，但更专注西部标签策略
      - - Gaia GPS
        - Premium 每年 $39.99，或随 Outside+ 打包
        - 免费核心 App 加地图图层 Premium
        - 300+ 地图源、离线下载、路线规划、打印 / 图层深度
        - 用户往往为地图深度选择，而不是最低价格
      - - AllTrails
        - Plus 每年 $35.99
        - 免费发现层加高级步道工具
        - 离线地图、步道状况、偏航提醒、发送 Garmin 路线
        - 便宜的大众选项扩大了发现入口竞争
      - - Avenza Maps
        - 免费核心 App；付费地图 / Premium 选项因情况而异
        - 地图商店和导入模式
        - 在购买或导入的权威地图上提供离线 GPS
        - 不同变现模式可吸引不喜欢订阅的专业用户
      - - Garmin BaseCamp
        - 免费桌面软件；硬件另售
        - 软件加手持设备生态
        - 桌面规划和设备同步
        - 替代成本主要落在硬件，而不是 App 订阅
      - - ScoutLook（旧版）
        - 2018 年产权线每月 $5.99
        - 免费天气 App 加付费产权线图层
        - 天气、ScentCone、产权线、离线保存区域
        - 早期价格点显示地块数据很早就开始商品化
    notes: 标价采用保留的公开价格或明确列示的套餐示例；这些不是实际净价，也不包含一次性促销，除非页面明确把该优惠写成当前标价结构。
