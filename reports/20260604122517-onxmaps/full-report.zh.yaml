      - number: '3.4'
        title: 护城河看似中等：垂直封装强，但持续同质化和捆绑压力不小
        blocks:
          - type: paragraph
            body: >-
              对 OnX 最有防御性的乐观论点，不是对手缺少地图或离线导航。它们并不缺。更强的论点是，OnX
              围绕合法通行、已验证土地语境和按活动清晰拆分的产品，建立了专用品牌。这有助于公司避开更宽平台上可见的一刀切问题。即便如此，反向证据仍然重要。Outdoor Life 历史上认为 HuntStand
              在性价比上胜出。财产边界不再独特。GOHUNT 能收更高价格，因为它面向更窄买方的西部研究技术栈更深。Gaia 和 Avenza 在地图深度或权威导入比发现更重要时胜出。AllTrails
              仍是大众市场发现默认选择。The Verge 还提出一个直接的 onX 产品批评——耗电——在手机优先类别中很重要。合在一起看，这是一条耐用但并非牢不可破的护城河。只要 onX 继续把土地通行数据与差异化垂直
              UX 配对，它仍能领先；但把护城河承销为强锁定，会夸大证据。关键尽调需求是拿到付费份额、留存以及体验背后数据图层经济性的私有证明。
