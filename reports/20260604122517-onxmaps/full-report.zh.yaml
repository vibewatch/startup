  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 市场信任、准入压力与数据准确性风险
        blocks:
          - type: paragraph
            body: >-
              onX 最大的实际风险，不是猎人不再需要数字地图，而是地图图层的可信度下滑得比订阅模式能消化的速度更快。onX
              把自己定位成一款信心工具，帮助用户判断哪里能猎、哪里不能猎；但它自己的条款和功能页也承认核心前提：地块和环境数据依赖外部供应商，变化频繁，用户行动前必须自行核验。土地所有权功能页称，公司从 3,100
              多个县拉取数据；独立评论则指出，上游来源的刷新节奏并不一致。因此，onX
              暴露在地图产品常见的信任失效模式里：过期或错误地块数据哪怕发生率不高，也可能造成不成比例的声誉伤害，因为用户承担的后果可能是误闯风险、一次狩猎泡汤，或与土地所有者关系受损。公开投诉渠道已经呈现这种愤怒，包括业主姓名错误，甚至把私人地产显示为公共狩猎地的指控。市场风险又放大了数据问题。onX
              有庞大的安装基础、清晰可见的订阅价格，也有竞争对手急于把持续付费包装成陷阱，或用更高精度的替代方案抢市场。Outdoor Life
              还记录了二阶反弹风险：数字通行工具揭示更多路线和地块后，一些用户和生物学家担心产品会增加拥挤和野生动物压力，在敏感地区把增长故事变成公关和政策负债。
