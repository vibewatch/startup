  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              onX 看起来像真正的后期赢家，而不是只有叙事的户外应用。CB Insights 和 PremierAlts 都把 2025 年 7 月估值放在约 $1.4 billion，累计融资接近 $388
              million；2025 年 11 月的后续成长股权轮引入 TCV 和 Cross Creek，同时没有挤出 Summit Partners。官方声明又给出两个重要信号：管理层称 ARR
              在此前三年接近翻了三倍，Summit
              也把增长描述为盈利性增长。这些正是支撑高溢价消费者订阅或垂直平台倍数的要素。问题在于，公开记录仍没有给出最关键的分母。没有经审计的收入桥，没有披露净留存，没有产品层面的付费订阅用户数，也看不到可用的优先权条款。因此，上一轮应被视为一个可能合理的公允价值标记，而不是价格有吸引力的证明。基于公开证据，正确姿态是继续研究，而不是买入或回避。
