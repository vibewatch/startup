  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - Hunt 订阅
        - 面向消费者的独立会员，通过直销和应用商店销售
        - 每用户每年或每月 USD
        - 已上线；年费 $34.99 / $49.99 / $99.99，或 Elite 月费 $14.99
        - 如果续费保持强劲，经常性质量高；年度预付有助现金转化
