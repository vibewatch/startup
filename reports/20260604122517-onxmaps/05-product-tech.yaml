- id: ip-and-build-vs-buy
  title: IP, patents, and build-vs-buy
  body: 'The IP picture is modest but real. Justia lists a January 2026 onXmaps patent grant for map-data compression intended to reduce network traffic, which fits the company’s offline-heavy, mobile-first product design. Trademark records are broader than the patent record and arguably more commercially important: ONX, ONX BACKCOUNTRY, and ONX OFFROAD all appear across software, mapping-service, weather, and navigation-related classes. That portfolio does not prove a deep moat on its own, but it does reinforce that onX is protecting a multi-surface mapping business rather than a narrow media brand. Public materials also imply a hybrid build-vs-buy posture. The company appears to build its own app workflow, sync, memberships, and at least some rendering/compression technology, while relying on outside county, federal, and platform data sources for parcel, ownership, and public-land inputs. The dependency burden is therefore not just on data quality; it is also on rights, refresh cadence,
    and the cost of wrapping external datasets into a proprietary experience that users are willing to subscribe to.'
  claimRefs:
