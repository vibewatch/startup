  evidenceGaps:
  - type: missing-source
    severity: material
    topic: external-data-suppliers
    missingEvidence: Named commercial suppliers and contract terms for parcel, imagery, or routing inputs beyond the public government sources onX discloses.
    whyItMatters: Those suppliers shape product quality, refresh cadence, vendor lock-in, and gross-margin durability for the core mapping experience.
    diligencePath: Request a vendor schedule, data-license summary, and the internal ownership matrix for each major layer and basemap family.
    relatedQuestionRefs:
    - QE020
    - QE031
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability-sla
    missingEvidence: Internal uptime targets, incident history, support response metrics, and any enterprise or business SLA commitments.
    whyItMatters: Without those metrics, investors can see feature breadth but cannot underwrite operational consistency or support quality at scale.
    diligencePath: Request status-page history, support KPI dashboards, renewal support terms, and any contractual SLA exhibits used in business accounts.
    relatedQuestionRefs:
    - QE029
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: forward-roadmap
    missingEvidence: A dated roadmap showing upcoming features, milestone timing, and product ownership by vertical.
    whyItMatters: Public evidence today is dominated by what has already shipped or what onX is hiring for, which limits forecasting confidence.
    diligencePath: Request quarterly product-roadmap materials, roadmap review decks, and the feature-flag or launch calendar for Hunt, Offroad, and Backcountry.
    relatedQuestionRefs:
    - QE030
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: engineering-stack-detail
    missingEvidence: Exact production architecture, cloud topology, databases, languages, and rendering-stack details behind the map engine and data platform.
    whyItMatters: Public jobs prove investment direction, but not whether the architecture is efficient, resilient, or defensible versus peers.
    diligencePath: Request an engineering architecture review, service diagram, dependency inventory, and current observability or test-coverage metrics.
    relatedQuestionRefs:
    - QE021
    - QE022
    relatedTableRefs:
    - TE003
