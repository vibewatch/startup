callouts:
- calloutType: strength
  title: The strongest product asset is a reusable outdoor-mapping platform, not a single app gimmick
  body: Public materials show onX repeatedly packaging the same offline, routing, boundary, sync, and device-integration primitives into Hunt, Offroad, and Backcountry. That kind of reuse supports faster cross-vertical feature transfer than a product line built from isolated codebases and isolated data workflows.
  claimRefs:
  - CE001
  - CE002
  - CE006
  - CE029
  - CE043
- calloutType: risk
  title: Data-source opacity and stale-boundary risk are the main technical underwriting concerns
  body: The product is powerful, but it is built on dynamic external datasets and legal-access judgments that public sources say users must still verify themselves. Review evidence that wrong landowner names can create trespass risk is not trivial for a product whose core value proposition is confidence in where you stand.
  claimRefs:
  - CE015
  - CE016
  - CE026
  - CE028
  - CE039
  - CE040
