- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Government geodata inputs
    - Supply public-land, roads, trails, and other base reference layers
    - USDA Forest Service, BLM, ArcGIS and similar public sources
    - Coverage, freshness, and legal-use caveats are controlled outside onX
  - - County/state parcel ingestion
    - Power property boundaries, landowner names, tax-address context
    - County and local records plus onX in-house processing
    - County quality varies; stale ownership can create trespass exposure
  - - Basemap and imagery stack
    - Deliver topo, hybrid, lidar, recent imagery, and satellite context
    - Imagery vendors and internal tiling/refresh pipelines
    - Exact commercial suppliers and SLAs are not public
  - - Routing graph + route builder
    - Snap routes to roads/trails and support turn-by-turn navigation
    - Underlying road/trail graph quality and update cadence
    - Graph gaps force manual point-draw workaround
  - - Offline packaging layer
    - Bundle basemap and layer data for field use without service
    - Device storage, mobile OS background behavior, GPS availability
    - Downloads are device-specific and high resolution increases storage burden
  - - Web/mobile map engine
    - Render 2D/3D maps, support TerrainX and synchronized views
    - Core Viewer map engine, 3D renderer, cross-platform SDK, browser support
    - Public stack detail is limited to hiring signals rather than architecture docs
  - - Account, markup, and sharing layer
    - Persist user content and sync it across devices or groups
    - onX backend storage, IAM, sharing controls
    - Public docs do not expose audit, retention, or admin-policy depth
  - - Device/integration layer
    - Bridge apps to in-dash screens, optics, watches, and trail cameras
    - Apple, Google, compatible hardware vendors
    - Platform-policy shifts or vendor incompatibility can reduce functionality
  - - Data/AI platform
    - Support analytics, ML, governance, and cross-product data work
    - Lakehouse architecture, GCP tooling, AI systems, data-science workflows
    - Public sources prove hiring demand, not production maturity or safety guardrails
  notes: This table blends directly documented workflows with careful inference from support docs, app-store disclosures, and public job postings; undocumented internals remain explicit diligence gaps.
