  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE043
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: mapping-data-architecture-and-operating-model
  title: Mapping, data architecture, and operating model
  body: 'The publicly visible architecture is strongest at the user-workflow and data-layer level. onX Hunt’s browser-based Web Map, support articles, and feature pages describe a system where planning often starts on desktop, then syncs to mobile for offline execution. Offline maps bundle basemap and layer data onto the device, preserve GPS functionality without cell service, and can be created from the web before being downloaded locally on mobile. Route Builder depends on a routing graph that can snap to roads and trails but still exposes manual fallbacks when the graph is incomplete. onX’s land stack appears to mix internally packaged data with outside feeds: property lines draw from more than 3,100 counties, public-government layers come with access caveats, and app-store disclosures point users to USDA Forest Service, BLM, and ArcGIS public data sources. The net result is a practical but dependency-heavy operating model: onX owns the user-facing planning, sync, and packaging layer,
    while important raw inputs remain externally sourced and refresh at uneven cadences.'
