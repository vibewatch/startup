- id: trust-privacy-and-public-gaps
  title: Trust, privacy, and public gaps
  body: 'Trust and quality controls are present publicly, but they are more operational than enterprise-assurance oriented. onX publishes a privacy policy, explains why it needs location and photo access, stores customer markups server-side for sync, and offers a responsible-disclosure inbox. It also repeatedly warns users that map accuracy, availability, and conditions depend on external providers and dynamic datasets. That warning is not theoretical: the USDA geodata source page itself says its data are not legal documents, and adverse review evidence shows that incorrect landowner names can create real trespass risk. For an outdoor-navigation product, those are not cosmetic problems. They touch safety, access legality, and customer trust. What remains missing is equally important. Public sources reviewed here do not provide a public uptime SLA, incident history, detailed supplier list for parcel/imaging/routing inputs, or a dated roadmap explaining what arrives next and when. That leaves
    diligence resting on feature breadth and active shipping signals rather than on enterprise-grade disclosure discipline.'
