- id: devices-integrations-and-development-signals
  title: Devices, integrations, and development signals
  body: 'onX has expanded well beyond a phone-only mapping product. CarPlay and Android Auto are real surfaces, but the support docs make clear that in-dash usage is a controlled extension of the mobile app rather than a full independent client. App-store listings also show a widening integration layer that now includes trail cameras, compatible rangefinders and binoculars, Apple Watch or Wear OS, and live location-sharing features. Those surfaces matter because they turn onX into a coordination and device-orchestration product as much as a static maps app. Public engineering signals line up with that view. Built In job listings describe work on the Core Viewer map engine, 3D map rendering, a cross-platform SDK, scalable IAM, off-road backend services, a lakehouse data platform, and AI systems. That is meaningful developer-signal evidence that onX is still investing in foundational platform work, not just content merchandising. What is less visible is the exact technical stack beneath those
    roles: public sources show the hiring demand, but not the full architecture diagram, service boundaries, or production reliability numbers.'
