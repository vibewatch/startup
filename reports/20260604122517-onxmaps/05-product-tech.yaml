- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - Privacy policy + location disclosure
    - Published
    - Explains account data, precise location collection, third-party sharing, and retention principles
    - No public processor-by-processor map or detailed admin controls by product
  - - Server-side markup storage
    - Published
    - Markups sync across devices and can be shared with other users
    - Public docs do not show detailed retention, encryption-at-rest, or audit logging
  - - Responsible disclosure channel
    - Published
    - Vulnerability reporting via security@onxmaps.com
    - No public bug bounty, policy safe harbor, or remediation metrics
  - - Accuracy and availability disclaimers
    - Published
    - Terms and provider pages say data are dynamic and must be independently verified
    - Users still bear material access/safety risk if data are stale
  - - Land-data and imagery refresh guidance
    - Published
    - Private/government land data every 1-2 years; standard imagery about 4 years old on average; newer recent imagery can be faster
    - Refresh claims vary by layer and do not substitute for dataset-level SLAs
  - - Supported device/browser guidance
    - Published
    - Browser requirements, offline behaviors, and in-dash setup are documented
    - No public performance or crash-rate reporting
  - - Independent adverse user signal
    - Present
    - Review aggregation includes complaints about incorrect landowner names and reliability issues
    - No public incident log or systematic correction-speed disclosure
  notes: Controls listed here come from official policy/support pages plus one independent review source; absence of an item does not imply it is missing internally, only that it was not visible publicly.
