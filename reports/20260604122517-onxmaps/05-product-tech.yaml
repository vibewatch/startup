- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - onX solution
  - Measurable benefit
  - Limitation
  rows:
  - - Plan a trip from home
    - Open web map, study terrain, drop markups, sync to phone
    - Desktop Web Map plus account sync
    - Bigger-screen planning carries into field execution
    - Offline downloads themselves still have to be completed on the device
  - - Stay legal around land access
    - Inspect parcel and government ownership before moving
    - Private Lands, Government Lands, and Possible Access layers
    - Shows owner name, tax address when available, and access caveats
    - Ownership data can still be stale or incomplete by county/source
  - - Build an approach route
    - Choose snap-to routing or hand-drawn lines
    - Route Builder in Hunt or Offroad
    - Reduces guesswork and supports road/trail-following paths
    - Routing graph gaps force manual workaround
  - - Keep navigating without service
    - Download basemap and layers to the device before leaving coverage
    - Offline Maps with low/medium/high detail levels
    - GPS location still works without cell service
    - Downloaded files are device-specific and consume storage
  - - Use the map from the vehicle
    - Connect the phone to a compatible in-dash screen
    - CarPlay or Android Auto support
    - Quick map-view, basemap, and waypoint actions while driving
    - Most advanced tools still require the handset
  - - Coordinate with a group
    - Share saved content or live locations during a trip
    - Shared folders, live location sharing, trail camera or optics integrations
    - Lower coordination friction and better field awareness
    - Public docs do not describe enterprise-grade guardrails or auditing
  notes: Benefits are described from public workflow docs and official feature pages, not from audited ROI studies or contract-backed SLAs.
