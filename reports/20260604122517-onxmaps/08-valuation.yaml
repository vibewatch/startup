company:
  name: OnXmaps
chapter:
  number: 8
  title: Valuation
  summary: Public market data and private-market databases make the July 2025 $1.4B onX valuation real enough to take seriously, but not transparent enough to underwrite cleanly from the outside. Official sources show premium pricing, multi-app expansion, and strong ARR growth, while public comps suggest the mark can be defended if revenue is comfortably above roughly $200M to $300M. Because audited revenue, retention, and preference terms are still private, the disciplined public-evidence call is research-more with medium confidence, medium-high risk, and a fair valuation stance.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'onX looks like a real late-stage winner, not a narrative-only outdoor app. CB Insights and PremierAlts both place the July 2025 valuation at roughly $1.4 billion and total capital raised near $388 million, and the November 2025 follow-on growth-equity round brought in TCV and Cross Creek without displacing Summit Partners. Official statements add two more important signals: management says ARR nearly tripled over the prior three years, and Summit describes the growth as profitable. Those are exactly the kinds of ingredients that can support a premium consumer-subscription or vertical-platform multiple. The problem is that the public record still does not show the denominator that matters most. There is no audited revenue bridge, no disclosed net retention, no product-level paid-subscriber count, and no usable visibility into preference terms. That means the last round should be treated as a plausible fair-value marker rather than as proof that the price is attractive. The right
    public-evidence posture is therefore research-more, not buy or avoid.'
  claimRefs:
