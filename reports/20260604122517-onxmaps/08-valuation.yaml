- id: dcf-and-scenario-logic
  title: DCF and scenario logic
  body: A reverse-DCF lens reaches a similar answer. Using a simple 10% discount rate and 3% terminal growth assumption, a $1.4 billion value requires about $98 million of steady-state free cash flow. That translates into roughly $327 million to $490 million of steady-state revenue depending on whether onX can eventually deliver 30% to 20% free-cash-flow margins. Those revenue hurdles are not absurd for a profitable, multi-app subscription platform with millions of users and a premium tier structure; they are simply not proven in public. That is why the scenario table keeps the current mark inside the base range rather than above it. In the bull case, the low-confidence >$500 million revenue estimate proves directionally right, cross-sell works across Hunt, Offroad, Backcountry, and Fish, and retention is strong enough to justify upper-end app or platform multiples. In the bear case, the real denominator is materially lower, churn is higher than the pricing suggests, and the product-accuracy
    complaints are early warning signs of renewal drag. The base case sits between those two outcomes and does not support paying up without data-room proof.
