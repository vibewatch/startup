  - - Valuation stance
    - fair
    - The current mark is plausibly supportable, but only if private revenue quality clears.
  - - Entry discipline
    - Pay only after diligence or with downside protection
    - A clean buy at the headline mark is harder to justify than a structured or diligence-conditioned entry.
  - - Primary proof needed
