- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Revenue and margin assumption
  - Valuation logic
  - Illustrative fair value
  rows:
  - - Bull
    - 25%
    - External >$500M revenue estimate proves directionally right; product-level retention is strong; free-cash-flow margin reaches the upper end of premium app outcomes.
    - Upper-end public app/platform multiple of roughly 5x-6x sales, plus strong reverse-DCF coverage.
    - $2.0B-$2.8B
  - - Base
    - 50%
    - Verified revenue sits in roughly the $250M-$350M zone; profitable growth is real but not elite; churn and support economics are acceptable.
    - Roughly 4x-5x sales and a reverse-DCF that is demanding but not impossible.
    - $1.2B-$1.8B
  - - Bear
    - 25%
    - Verified revenue is below the low-$200Ms or churn is worse than pricing implies; complaints are early evidence of weaker renewal quality.
    - Closer to 3x-4x sales and insufficient FCF support for the headline mark.
    - $0.7B-$1.1B
  - - Probability-weighted
    - —
    - Base case dominates while the bull case stays contingent on private files.
    - Weighted midpoint of the above scenarios.
    - ~$1.45B
  notes: These ranges are scenario judgments anchored to public comp math and reverse-DCF hurdle work, not to a disclosed onX income statement.
