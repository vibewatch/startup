- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - onX (subject)
    - July 2025 private mark
    - ~$1.4B valuation; implied multiple depends on undisclosed revenue
    - Direct price discovery and sponsor willingness to pay.
    - Public record still lacks audited revenue and preference terms.
  - - Garmin
    - June 2026 public trading
    - 6.15x P/S; $45.89B market cap; $7.25B FY2025 revenue
    - Best outdoor-navigation and trust-in-maps read-through.
    - Hardware and devices are much larger parts of Garmin than of onX.
  - - Duolingo
    - March to June 2026 public trading
    - 4.55x P/S; $1.10B TTM revenue; $5.00B market cap
    - Useful premium consumer-subscription app benchmark.
    - Language learning is more habit-forming and globally scaled than hunting maps.
  - - Life360
    - March to June 2026 public trading
    - 7.11x P/S; $528.98M TTM revenue; $3.74B market cap
    - Closest public analog for paid location utility on mobile.
    - Safety and family coordination differ from outdoor-recreation use cases.
  - - Zillow
    - June 2026 public trading
    - 3.02x P/S; $2.69B TTM revenue; $8.12B market cap
    - Map-centric data layer and consumer utility reference.
    - Marketplace economics differ from onX's direct subscription model.
  - - Match Group
    - June 2026 public trading
    - 2.27x P/S; $3.52B TTM revenue; $8.00B market cap
    - Useful mature subscription-app lower bound.
    - Social-network dynamics differ sharply from outdoor navigation.
  - - Airbnb
    - June 2026 public trading
    - ~6.3x sales; $12.64B TTM revenue; $79.28B market cap
    - Upper-end consumer platform reference for brand and habit strength.
    - Marketplace take-rate economics are structurally different from onX.
  notes: 'This table is exhaustive for the valuation set used in this chapter: one direct private mark and six public read-through comparables spanning outdoor trust, consumer subscription, utility, map data, and mature app monetization.'
