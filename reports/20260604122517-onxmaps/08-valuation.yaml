- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Thesis
  - What would change the view
  rows:
  - - Sponsor quality
    - Multiple credible growth investors kept leaning in across 2018, 2022, and 2025.
    - A sharp disconnect between reported private revenue and board-level reality would weaken that signal.
  - - Product monetization
    - onX has premium pricing across multiple apps, with room for cross-sell and elite upsell.
    - If actual paid conversion and renewal are weak, list price alone will not support the valuation.
  - - Platform breadth
    - Millions of users and a four-app suite make onX look broader than a one-vertical hunting tool.
    - If usage remains heavily hunt-centric with weak offroad/backcountry monetization, the platform case thins out.
  - - Public comp context
    - Public app and platform comparables can support a $1.4B mark if onX revenue is comfortably above the low-$200Ms.
    - If verified revenue is materially below that threshold, the same comps point to downside.
  - - Adverse signals
    - Boundary-accuracy complaints create real renewal risk in a trust-dependent product.
    - A clean retention and support record would reduce the weight investors should put on anecdotal complaints.
  - - Disclosure gap
    - The anti-thesis is not that onX is weak; it is that too much of the denominator still sits in the data room.
    - Audited revenue, NRR, and preference terms could move the stance from fair to attractive.
  notes: The anti-thesis is mostly about missing denominator proof, not about category relevance or sponsor quality.
