- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue and ARR bridge
    - Board-approved revenue, ARR, and product-level paid subscribers for 2024-2026.
    - This is the denominator that determines whether $1.4B is 2x, 5x, or more of sales.
    - Finance team, board deck, and auditor-prepared bridge.
  - - Retention and churn by product
    - Gross retention, renewal, refund, and support-cost data for Hunt, Offroad, Backcountry, and Fish.
    - Premium app pricing only matters if renewal quality is durable.
    - Revenue operations, cohort dashboards, and customer-support analytics.
  - - Gross margin and FCF conversion
    - Hosting, imagery, mapping-data, and support cost structure by product.
    - The reverse DCF is margin-sensitive; weak conversion would break the valuation case.
    - CFO review plus cloud and vendor cost workup.
  - - Cap table and preferences
    - Series C and November 2025 financing documents, investor rights, and liquidation stack.
    - Headline valuation can diverge materially from true economic entry value.
    - Counsel review of financing docs and side letters.
  - - Cross-sell quality
    - How many users buy more than one app and what that does to ARPU and churn.
    - The platform thesis is worth more than the single-app thesis only if wallet share expands.
    - Product analytics and customer cohort work.
  - - Data quality and complaint trends
    - Boundary-accuracy escalation rates, county-data latency, and remediation process.
    - Trust erosion can hit renewals in a product where the map itself is the promise.
    - Support operations and source-data management review.
  notes: These are the minimum diligence asks required to move the case from plausible to underwriteable at the current mark.
