  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-denominator
    missingEvidence: Board-level ARR or revenue by product, paying subscribers, renewal rates, and gross margin disclosure.
    whyItMatters: Without a verified denominator, it is impossible to know whether the $1.4B mark is sub-3x sales or meaningfully richer.
    diligencePath: Request audited or board-approved revenue bridge, subscriber counts, and cohort retention by product.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-terms
    missingEvidence: Series C and later growth-equity documents showing pre- and post-money valuation, liquidation preferences, participation, anti-dilution, and board rights.
    whyItMatters: Headline valuation can overstate the economics available to a new investor if the preference stack or protective terms are investor-favorable to prior rounds.
    diligencePath: Review financing documents, counsel summaries, and any side letters for the July and November 2025 transactions.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: tam-and-retention
    missingEvidence: Current product-level active users, paid subscribers, churn, and any participation data that ties the hunting-heavy starting point to broader outdoor categories.
    whyItMatters: Public scale headlines and millions-of-users messaging do not reveal whether onX has enough durable subscription density to merit premium consumer-software multiples.
    diligencePath: Obtain product analytics and retention dashboards for Hunt, Offroad, Backcountry, and Fish, plus management's TAM bridge by vertical.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV005
    - TV006
