  - type: private-evidence-only
    severity: material
    topic: subscriber-scale-and-product-mix
    missingEvidence: Paid subscriber counts, active users, and revenue mix by Hunt, Offroad, and Backcountry.
    whyItMatters: Downloads and ratings prove reach, but they do not show how much of the customer base is paying, active, or economically meaningful.
    diligencePath: Request monthly active subscribers, paid subscribers, product-line revenue, and trial-to-paid conversion by app.
    relatedQuestionRefs:
    - QU012
