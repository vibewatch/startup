- id: TU006
  title: Public review and complaint snapshot
  columns:
  - Surface
  - Positive signal
  - Adverse signal
  - What it likely means
  - Primary gap
  rows:
  - - Google Play Hunt
    - Large reach plus 4.6 rating and 5M+ downloads
    - Login, support, and offline-coordinate complaints
    - Hunt has real adoption but still non-trivial service friction
    - Need complaint rate and renewal data
  - - Google Play Offroad
    - 1M+ downloads show real demand
    - 3.4 rating plus Android Auto, offline, and trail-quality complaints
    - Offroad likely has the noisiest churn risk in the portfolio
    - Need platform-specific retention and bug-fix cadence
  - - Google Play Backcountry
    - 500K+ downloads and useful-field-use reviews
    - Crashes, missing Android features, denied refund
    - Backcountry demand is real but Android parity matters for trust
    - Need refund rate and defect trend by release
  - - JustUseApp Hunt complaints
    - Shows some users still find the product indispensable
    - Property-name accuracy and pricing complaints are explicit
    - Land-data trust is central to customer value, so data errors matter disproportionately
    - Need error rate by county and refund / correction workflow
  - - Hunting forums
    - Many users say onX is worth paying for and works well offline
    - Price and feature comparisons repeatedly push users toward HuntStand or BaseMap
    - The product wins on trust and land data, but not always on value perception
    - Need cancellation-reason and win-loss data
  - - Overlanding forums
    - Some users defend onX property lines and trail use
    - Gaia is repeatedly cited as stronger on map layers, GPX, and value
    - Competitive pressure in Offroad is more direct and feature-based than in Hunt
    - Need competitor-specific churn and save metrics
  notes: This table is a qualitative sentiment snapshot drawn from retained complaint, app-store, and forum sources; it is not a representative survey.
