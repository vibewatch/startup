chapter:
  number: 6
  title: Customers
  summary: 'OnX has strong public customer proof for its Hunt business and credible but smaller proof for Offroad and Backcountry: owned pages, app stores, AppBrain, and forums all show distinct user segments and real field usage. The public record is much weaker on durability and concentration. There are plenty of ratings and testimonials, but no disclosed NPS, retention, active-subscriber, or top-customer data, and Offroad in particular shows meaningful quality-driven churn risk on Android and in forum comparisons.'
sections:
- id: customer-segmentation-and-buyer-map
  title: Customer segmentation and buyer map
  body: OnX is best understood as a portfolio of separate outdoor-navigation products rather than a single bundled customer base. Official support explicitly says Hunt, Offroad, and Backcountry have distinct memberships and that paying for one product does not unlock paid features in the others. That matters because the buyer-user-payer pattern changes by app. Hunt is aimed at hunters navigating public and private land, planning tags, and scouting remote terrain. Offroad is built for motorized users — 4x4, SxS, ATV, dirt bike, snowmobile, and overlanding customers — who need trail discovery, camping, land data, and group navigation. Backcountry is built for hikers, climbers, backpackers, mountain bikers, and ski users who want route planning and safety overlays. The only clearly public non-consumer motion is the employee-perk / group-membership page, which shows an admin buyer managing individual employee accounts across one or more Elite products. That broadens the payer base beyond solo
    subscribers, but the public record still points much more strongly to self-serve enthusiasts than to large enterprise accounts.
  claimRefs:
