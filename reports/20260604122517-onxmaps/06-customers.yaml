- id: TU003
  title: Named customer proof table
  columns:
  - Customer / public proof
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / public signal
  - Limitation
  rows:
  - - Hunt iOS reviewers (Bjrink, spin317, Leethe3rd)
    - Hunters using Hunt in the field
    - Solo out-of-state antelope hunt planning, multi-year use, ongoing subscription
    - Production / repeated field use
    - Property boundaries, offline scouting, and customer support cited as real value
    - Owned and App Store surfaces are curated and do not prove renewal economics
  - - Hunt Android reviewers (Anthony Malliris, David Hogan, older Google Play reviewer)
    - Hunters and adjacent outdoor users
    - Active subscription, hunting/fishing/hiking use, remote offline needs
    - Production / live use with mixed outcomes
    - Shows real paid use plus concrete complaints about login, support, and offline functionality
    - One-surface sample; complaint-heavy excerpts may overstate downside
  - - Offroad iOS reviewers (Scottpdx12345678, gtr987, Millennial Dad)
    - Family off-roaders, backcountry moto riders, dispersed campers
    - Trip planning, trail selection, legal-land navigation, family use
    - Production / live trips
    - Demonstrates clear consumer utility for families and vehicle-based adventures
    - Still largely testimonial rather than verified repeat-purchase data
  - - Offroad Android / AppBrain commenters (Zack, CHAD B, Samuel Larson, DJ Birdwell)
    - Android off-roaders and SxS users
    - Android Auto, offline navigation, trail-search depth, overlanding/SxS use
    - Production / live use with strong complaints
    - Provides both positive user-value proof and direct evidence of churn-risk bugs
    - Mixed channels; not a clean cohort or net promoter read
  - - Backcountry members and reviewers (Snowrambo, That News Guy, Carl Fredrickson, Josh Snyder)
    - Hikers, backpackers, skiers, and mountain bikers
    - Offline navigation, safety, backpacking, ski touring, route planning
    - Production / live trips with some failures
    - Best public evidence that Backcountry is used repeatedly in consequential field settings
    - Public proof is still anecdotal and does not identify enterprise or guide customers
  notes: Partial enumeration of named public customer proof grouped by product surface; onX does not publicly name enterprise, HR-benefit, or channel customers in the retained sources.
  enumerationScope:
    coverage: partial
    basis: Rows summarize the named public reviewers and testimonials visible across retained owned, App Store, Google Play, and forum surfaces; no public enterprise logo list or case-study set was found.
