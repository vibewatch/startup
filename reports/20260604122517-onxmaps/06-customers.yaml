  - type: private-evidence-only
    severity: material
    topic: enterprise-and-group-customer-proof
    missingEvidence: Named employee-perk or group-membership customers, seat counts, contract sizes, and renewal histories.
    whyItMatters: The group-membership motion could be strategically important, but today the public evidence only proves that the offer exists, not that it is material.
    diligencePath: Request logo list, top accounts by seats and ARR, use frequency, and case studies for the employee-perk / group-membership channel.
