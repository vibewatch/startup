figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: The public customer journey starts with product-specific discovery, moves through free or paid plan selection, and only later expands into group or crew workflows.
  data:
    items:
    - id: discover
      label: Discover need
      actor: Hunter / off-roader / backpacker / HR admin
      description: Customers first self-select into Hunt, Offroad, Backcountry, or a group-benefit conversation based on the outdoor job they need solved.
      channels:
      - Owned product pages
      - App stores
      - Forums / reviews
      - Employee-perk page
    - id: choose-product
      label: Choose product + plan
      actor: Mostly self-serve consumer; sometimes admin buyer
      description: Support and pricing pages emphasize separate subscriptions, plan ladders, and free trials rather than a single bundled suite.
      channels:
      - Pricing pages
      - Support article
      - App-store trial prompts
    - id: field-use
      label: Field use
      actor: Individual user or group / family / hunting party
      description: The core proof of value comes from offline navigation, land access, trail discovery, and safety-critical use in the field.
      channels:
      - Owned testimonials
      - Apple reviews
      - Google Play reviews
    - id: share-and-manage
      label: Share / manage
      actor: Hunting partners, riding crews, employee admins
      description: Location sharing, shared folders, markups, and account management create the most visible collaboration loops.
      channels:
      - Owned product pages
      - Employee-perk FAQ
    - id: renew-or-switch
      label: Renew / upgrade / switch
      actor: Subscriber comparing alternatives
      description: Customers either renew, upgrade to Elite, or compare against HuntStand, BaseMap, or Gaia when price or quality becomes painful.
      channels:
      - Pricing ladders
      - Forums
      - Complaint surfaces
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU023
  - CU027
  - CU031
  - CU042
- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: standard
  summary: The evidence is strongest at discovery, trial, and field use; it becomes much weaker at renewal, active-subscriber, and enterprise-scale stages.
  data:
    nodes:
    - id: awareness
      label: Awareness
      description: Owned pages, app stores, and reviews clearly surface distinct customer jobs for hunters, off-roaders, and backcountry users.
    - id: trial
      label: Trial / free tier
      description: All three products advertise free access or seven-day trials, which lowers first-use friction.
    - id: paid
      label: Paid membership
      description: Paid conversion is visible through plan ladders and in-app purchases, but no public conversion rate is disclosed.
    - id: field
      label: Field deployment
      description: Named reviews show live use in hunts, family off-road trips, and safety-sensitive backcountry outings.
    - id: renewal
      label: Renewal / upgrade
      description: Renewal is inferred from repeat-use anecdotes and Elite upsell paths rather than disclosed retention data.
    - id: managed
      label: Managed accounts
      description: Group memberships exist, but public proof of named logos or concentration is thin.
    edges:
    - from: awareness
      to: trial
      label: product-specific app discovery
    - from: trial
      to: paid
      label: annual plan or Elite upsell
    - from: paid
      to: field
      label: offline maps, layers, routing, safety use
    - from: field
      to: renewal
      label: repeat use or subscription reconsideration
    - from: paid
      to: managed
      label: employee-perk / group admin path
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU011
  - CU019
  - CU031
  - CU039
  - CU042
