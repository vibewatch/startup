  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: NPS, CSAT, GRR, NRR, churn, refund rates, and cohort retention by product line and platform.
    whyItMatters: The current chapter relies on ratings and anecdotes, which are useful signals but not sufficient to underwrite true durability.
    diligencePath: Request product-level retention dashboards, cancellation reasons, refund rates, and any customer-satisfaction survey history.
    relatedQuestionRefs:
    - QU023
    - QU024
    relatedTableRefs:
