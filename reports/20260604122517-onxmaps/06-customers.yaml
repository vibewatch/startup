- id: expansion-paths-and-concentration-risk
  title: Expansion paths and concentration risk
  body: 'OnX has credible expansion mechanics at the product level, but almost no public disclosure on customer concentration. Hunt can upsell from one-state to two-state to nationwide Elite. Offroad and Backcountry each run a free-to-paid ladder with Premium, Elite, and free-trial entry points. Group memberships add one more expansion path because buyers can purchase Elite access for 30+ employees and manage accounts centrally, while collaboration features such as sharing, offline maps, and live location-sharing make the apps more useful inside families, hunting parties, or riding crews. The problem is that public evidence stops before the economically decisive questions. OnX does not name employee-perk customers, disclose what share of revenue comes from Hunt versus Offroad versus Backcountry, or reveal whether any single channel, region, or large customer matters disproportionately. Community threads also show real switching risk: users compare OnX against HuntStand, BaseMap, and Gaia
    on price, aerial imagery, map depth, and feature breadth, and Offroad appears most vulnerable on that front. The public customer case therefore supports “real adoption with clear product-market jobs,” but not “fully underwritten durability or concentration visibility.”'
