tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / proof
  - Strategic value
  - Gap
  rows:
  - - Self-serve hunters
    - Buyer=user=payer; occasionally shared within a hunting party
    - Land access, scouting, units, weather, offline navigation
    - Millions claim on owned surfaces; 274K Apple ratings; 5M+ Play downloads
    - Largest and best-proven customer segment in public evidence
    - No public split by casual vs serious or Elite vs Premium users
  - - Serious multi-state / Elite hunters
    - Buyer=user=payer
    - Nationwide maps, research tools, pro deals, recent imagery, route building
    - Elite pricing and feature pages target 50-state + Canada use and application planning
    - Higher-ARPU expansion layer inside Hunt
    - No public Elite penetration or renewal data
  - - Motorized off-road users
    - Buyer=user=payer; sometimes family or crew organizer pays
    - Trail discovery, dispersed camping, land ownership, CarPlay/Android Auto, crew location sharing
    - 8.3K Apple ratings, 1M+ Play downloads, 3M AppBrain downloads
    - Second-largest visible app audience with clear recreational job
    - Android quality complaints raise durability risk
  - - Backcountry non-motorized users
    - Buyer=user=payer
    - Hiking, backpacking, ski touring, climbing, mountain biking, route safety
    - 5,500 owned-page ratings; 500K+ Play downloads; 650K+ trails on Play
    - Broadens onX beyond hunting and motorsports into four-season outdoor planning
    - Public scale is smaller and Android complaints persist
  - - Employee-perk / group accounts
    - Buyer=HR or benefits admin; users=employees; payer=company
    - Elite memberships as wellbeing / outdoor perk with admin-managed provisioning
    - Employee-perk page says hundreds of companies use onX and accounts are usually active within 7 business days
    - Potentially sticky non-consumer channel and cross-product entry point
    - No named logos, seat counts, spend, or renewal disclosure
  - - Comparator-sensitive shoppers
    - Buyer=user=payer
    - Cross-shopping OnX against HuntStand, BaseMap, or Gaia based on price and feature fit
    - Forum threads repeatedly compare value, aerial imagery, map depth, and offline performance
    - Important because it constrains pricing power and churn by product line
    - No published win-rate or cancellation data by competitor
  notes: Mixes official segmentation with customer-community evidence; missing seat counts and revenue mix are genuine public-data gaps.
