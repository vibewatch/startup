- id: adoption-trajectory-and-public-proof
  title: Adoption trajectory and public proof
  body: 'Public adoption proof is strongest for Hunt, meaningful for Offroad, and smaller but still real for Backcountry. Hunt combines owned-language about “millions of hunters” with unusually large app-surface footprints: 274K Apple ratings, 5M+ Google Play downloads, and AppBrain’s 8.7 million lifetime-download estimate. Offroad is clearly smaller but not niche: 8.3K Apple ratings, 1M+ Google Play downloads, and AppBrain’s 3 million lifetime-download estimate. Backcountry sits another step down in visible scale, with 5,500 ratings on the owned page and 500K+ Google Play downloads, but its surface area is still substantial enough to support a dedicated user community. Named customer proof also exists, mostly through app-store and owned-surface testimonials rather than enterprise case studies: Hunt users cite multi-year use and successful out-of-state hunts, Offroad users cite family trail planning and SxS use, and Backcountry users cite repeated ski, bike, hike, and safety-critical use.
    What is missing is just as important as what is present: no source in the retained set discloses paid subscriber counts, active users, or product-level revenue mix.'
