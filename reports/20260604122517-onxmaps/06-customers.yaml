- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Hunt upsell ladder
    - Premium one-state users may never graduate to two-state or Elite
    - Upsell path exists, but public penetration by tier is unknown
    - Request subscriber counts and conversion by Premium, Premium Two State, and Elite
  - - Offroad free-to-paid ladder
    - Weak Android sentiment may cap conversion or renewal despite solid iOS satisfaction
    - Product can grow through trial and yearly plans, but bugs may suppress LTV
    - Request trial-to-paid conversion and platform-specific churn
  - - Backcountry free-to-paid ladder
    - Smaller visible footprint means it may remain niche without stronger repeat-trip retention
    - Seven-day trial and differentiated trail/safety layers create upsell logic
    - Request repeat-purchase, trip frequency, and Elite mix by activity
  - - Group memberships / employee perk
    - No public customer logos, seat counts, or contract sizes
    - Could provide sticky non-consumer revenue and cross-product expansion
    - Request top group accounts, seat counts, use frequency, and renewal history
  - - Cross-product outdoor households
    - Separate memberships can either deepen wallet share or fragment it if customers choose only one app
    - Portfolio breadth helps onX cover multiple outdoor jobs
    - Request overlap rates across Hunt, Offroad, and Backcountry payers
  - - Competitive switching pressure
    - Forums repeatedly compare OnX with HuntStand, BaseMap, and Gaia on price, imagery, and feature depth
    - Switching risk likely highest in Offroad and among price-sensitive hunters
    - Request cancellation reasons, competitor win/loss data, and save-offer effectiveness
  - - Top-customer concentration
    - No public disclosure exists for revenue concentration by enterprise, channel, or geography
    - Impossible to underwrite concentration risk from public evidence alone
    - Request top-10 customer / channel revenue share and product-line mix
  notes: Expansion paths are visible in product design and pricing ladders, but concentration is mostly private evidence today.
