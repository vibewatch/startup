companyProfile:
  summary: >-
    Founded in 2023, Dash0 is a New York-headquartered observability company built around OpenTelemetry and open query
    interfaces. Its platform combines managed metrics, logs, traces, and resource monitoring with telemetry controls,
    AI-development governance, and Agent0 workflows that investigate incidents and draft remediation. The company raised
    a $110 million Series B at a $1 billion valuation in March 2026, but it does not publicly disclose the operating
    metrics needed to assess revenue quality or capital efficiency.
  foundedDate: null
