  headquarters: New York, USA
  productSummary: >-
    Managed OpenTelemetry-native observability for metrics, logs, traces, resources, websites, and synthetic checks,
    with SignalControl telemetry processing, Darkplane AI-development oversight, and Agent0 investigation and
    remediation workflows.
  customerFocus: >-
    Developers, SREs, and platform-engineering teams, particularly organizations already using OpenTelemetry and seeking
    a managed observability backend.
  businessModel: >-
    Usage-linked SaaS pricing based on telemetry sent and stored, with separate credit-based consumption for Agent0
    Automations.
