chapter:
  number: 6
  title: Customers
  summary: >-
    Dash0 has one unusually detailed public production-migration reference and several named
    customer testimonials, while two independent directories report roughly 600 customers.
    Adoption quality beyond those examples remains difficult to underwrite because retention,
    contract, expansion, and concentration metrics are not publicly disclosed in the retained evidence.
sections:
  - id: customer-segments
    title: Buyer segments and fit
    body: >-
      The clearest demonstrated buyer is an engineering organization that already operates
      OpenTelemetry collectors and wants a managed observability backend without proprietary
      instrumentation. Nutrient fits that profile: its platform team moved Kubernetes, ECS, CDN,
      and CI telemetry by changing collector endpoints and credentials rather than redeploying
      applications. An independent product review describes the ideal buyer more broadly as a
      platform-engineering or SRE leader, especially in a Kubernetes environment, while Dash0's
      own product surface spans web monitoring, application performance, AI workloads, and cloud
      infrastructure. This supports a developer, SRE, and platform-engineering buyer thesis, but
      it does not establish a quantified segment mix. The same review flags a hard boundary:
      organizations requiring self-hosted or air-gapped deployment are a poor fit because the
      product is delivered as managed SaaS. A separate independent review argues that per-signal
      pricing aligns well with teams that send rich OpenTelemetry metadata, although that is a
      product-fit assessment rather than customer economics.
    claimRefs: [CU003, CU011, CU012, CU013, CU015]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption and named-customer proof
    body: >-
      Nutrient provides the strongest public adoption evidence because it describes a completed
      migration, operating scope, timing, and remaining work. It reports that the technical
      migration required mere hours, while the full process from decision to closing the former
      vendor account took about six weeks. The case involved terabytes of events and hundreds of
      millions of metric data points per month, making it more informative than a logo alone.
      Dash0's own site adds named testimonials from Vercel and Chargetrip and reports a 4.8 out of
      5 rating from 43 G2 reviews. Two independent directories separately report approximately
      600 customers and name Zalando and Taco Bell; one also names The Telegraph. Those directories
      improve corroboration of the broad count, but neither discloses its counting method, active
      customer definition, contract status, or revenue denominator. Most named accounts therefore
      remain references rather than verified deployment-level case studies.
    claimRefs: [CU001, CU002, CU004, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002, TU003]
  - id: adoption-journey
    title: Deployment path and expansion surfaces
    body: >-
      The Nutrient migration shows why OpenTelemetry-native positioning can reduce initial
      deployment friction. Existing SDK instrumentation and locally managed collectors remained
      in place; the team changed exporter configuration, then rebuilt dashboards, recreated and
      retuned alerts, and relearned query workflows. This distinction matters because telemetry
      portability did not make every operational artifact portable. Nutrient subsequently said it
      was consolidating on Dash0 with dashboards as code, deeper alerting integration, and wider
      tracing, which is a concrete but single-customer expansion signal. Dash0 also says its
      customers increasingly reach data through MCP and CLI interfaces rather than only a browser,
      suggesting additional agent-oriented usage surfaces. That statement is company-issued and
      should not be treated as independent evidence of expansion revenue or retention.
    claimRefs: [CU001, CU002, CU003, CU005, CU014]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, concentration, and diligence priorities
    body: >-
      Public proof is strongest at the acquisition and implementation stages and weakest after
      deployment. None of the retained customer-facing sources discloses net revenue retention,
      gross revenue retention, logo churn, renewal rates, contract length, customer-level revenue
      concentration, or channel mix. The 600-customer reports therefore cannot establish customer
      durability, average contract value, enterprise mix, or whether a small number of large
      accounts drives economics. The public testimonials are positive but company-hosted, and the
      single detailed customer case cannot establish cohort behavior. Investment diligence should
      request customer and revenue cohorts, renewal and expansion waterfalls, top-10 concentration,
      contract duration and termination rights, production-versus-pilot status for named accounts,
      and direct references from recent wins, renewals, and losses. Until those data are available,
      land-and-expand and low-concentration assumptions should remain unproven rather than inferred
      from logos, review scores, or product breadth.
    claimRefs: [CU006, CU009, CU010, CU016]
