schemaVersion: "report-v2"
artifact: risks
slug: dash0
runDate: 2026-10-20
company:
  name: Dash0
chapter:
  number: 7
  title: Risks
  summary: >-
    Dash0's highest residual risks are governance and reliability controls around autonomous
    operations, execution across a rapidly widening product scope, and limited public evidence
    on enterprise assurance and financial durability. OpenTelemetry portability and visible
    telemetry controls mitigate lock-in and cost risk, but the assigned evidence does not support
    quantified incident, concentration, burn, or compliance conclusions.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The evidence supports a qualitative, not actuarial, risk ranking. The most consequential
      exposure is the combination of autonomous operational actions and incomplete public assurance
      evidence: Dash0 says Agent0 can investigate incidents, draft fixes, and run triggered
      automations under customer-defined guardrails, while the assigned source set contains no
      regulator, court, certification, audit, incident-history, or service-level record that tests
      those controls. Execution risk ranks next because AutoMerge is still described as coming next,
      other SignalControl functions remain prospective, and an independent review calls the AI
      functionality new and insufficiently proven. Retention and telemetry economics are more
      observable: an independent review reports 30-day retention for logs and traces and warns that
      per-record pricing can punish noisy instrumentation. These findings justify explicit pilot,
      control, and disclosure gates rather than an assumption that no recorded incident means no
      incident occurred.
    claimRefs: [CR001, CR002, CR007, CR008, CR009, CR010, CR015, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal-and-governance
    title: Regulatory, legal, and autonomous-change governance
    body: >-
      The assigned pool does not establish Dash0's current certification scope, privacy-control
      testing, data-processing terms, breach history, litigation status, intellectual-property
      disputes, or regulatory posture. That is an evidence gap, not an adverse finding. It matters
      because the product ingests production telemetry and the company now describes automations
      that can investigate failures and open infrastructure or code changes. Dash0 says customers
      define guardrails and that Agent0 can leave a proposed fix as a pull request, which are useful
      control primitives, but the public materials reviewed here do not provide independent testing
      of approval boundaries, audit logs, rollback behavior, tenant isolation, or privileged-access
      controls. Investment clearance should therefore require current SOC reports and bridge
      letters, penetration-test summaries, DPA/subprocessor materials, insurance, incident and
      claims schedules, and a live demonstration of human approval and rollback controls.
    claimRefs: [CR009, CR010, CR015, CR016]
    tableRefs: [TR001]
  - id: operating-and-execution-risk
    title: Operating reliability and execution risk
    body: >-
      Product breadth is increasing faster than the available independent operating record.
      Dash0's official materials span observability, Agent0, Darkplane, SignalStore, and
      SignalControl; an official strategy post describes AutoMerge as forthcoming and parts of the
      volume-control pipeline as upcoming. The same post labels a 74% signal-volume reduction as an
      illustrative pipeline run, so it should not be generalized into a customer savings benchmark.
      An independent review says Agent0 is the newest and least proven part of the platform and
      recommends validating it during a trial. The review also highlights fixed 30-day retention
      for several high-volume signals and the young platform's shorter enterprise procurement and
      edge-case history. A production-scale proof of concept should test ingest spikes, cardinality,
      query latency, failover, export, alert fidelity, automated-action boundaries, and recovery
      time using the investor's expected workload rather than a toy service.
    claimRefs: [CR001, CR002, CR003, CR007, CR008, CR009, CR010, CR013]
    tableRefs: [TR002]
  - id: dependencies-and-financial-model
    title: Dependencies, concentration, and financial-model risk
    body: >-
      OpenTelemetry reduces proprietary collection lock-in, but it does not remove dependence on
      Dash0's hosted service, its execution roadmap, or integration of acquired products. An
      independent profile reports two acquisitions in 2026, creating product and team integration
      work alongside the move into autonomous operations. Customer scale is reported at more than
      600 by one independent profile and more than 750 by another, but those figures originate from
      company reporting and do not disclose revenue concentration, renewal quality, cohort
      retention, or acquired-versus-organic contribution. Financial durability is similarly
      unquantified: two independent profiles say revenue or profitability is not publicly
      disclosed, while one reports only management's aspiration to reach $100 million in ARR
      quickly. The kill criteria are a failed production pilot, material control exceptions,
      inability to export data or cap spend, concentrated customer or cloud exposure, or runway
      insufficient to complete the advertised roadmap without near-term financing.
    claimRefs: [CR004, CR005, CR006, CR011, CR012, CR014, CR016]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or rule area
      - Jurisdiction / scope
      - Evidence status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure and diligence path
    rows:
      - - Security, privacy, and compliance assurance
        - US, EU, and customer-specific regimes
        - No regulator, audit, certification, DPA, or incident record is present in the assigned evidence
        - Unknown
        - High
        - Unverified
        - High until current attestations, subprocessors, pentest results, claims history, and incident schedules are reviewed
      - - Autonomous code or infrastructure change governance
        - Customer production environments
        - Company materials describe user-defined guardrails and pull-request-based fixes
        - Medium
        - High
        - Claimed controls, not independently tested
        - High until RBAC, approvals, audit logging, rollback, and privilege boundaries pass a live control test
      - - Retention and records-management fit
        - Contractual and regulated retention requirements
        - Independent review reports 30-day retention for logs, spans, span events, and web events
        - Medium
        - High for customers requiring longer raw-data retention
        - Product constraint identified; archival path unverified
        - Medium-high until export completeness, retrieval, legal hold, deletion, and archival economics are tested
      - - Portability and exit rights
        - Customer contracts and technical migration
        - Company materials emphasize OpenTelemetry, PromQL, SQL, and exportability
        - Low-medium
        - Medium
        - Standards-based architecture is a partial mitigant
        - Medium until bulk export, schema fidelity, egress timing, termination assistance, and contract rights are verified
    notes: >-
      Partial register based only on the assigned prefetched evidence; likelihood and severity are
      analyst assessments, "unknown" means no qualifying evidence was available, and no row proves
      the absence of an incident, claim, or regulatory obligation.
    enumerationScope:
      coverage: partial
      basis: Publicly observable regulatory, legal, data-governance, and autonomous-change risks in the assigned 2026 evidence pool.
    claimRefs: [CR001, CR003, CR009, CR010, CR015, CR016]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitor or kill criterion
    rows:
      - - Autonomous investigation or remediation exceeds intended authority
        - Medium
        - High
        - Guardrails and pull-request workflow are company-claimed
        - High without independent control testing
        - Kill if privileged actions bypass approval, audit, rollback, or least-privilege controls
      - - Logs or traces needed after the standard retention window
        - Medium
        - High for regulated or forensic workloads
        - Fixed retention is identified; external archival is unverified
        - Medium-high
        - Kill if complete export, legal hold, or required retrieval windows cannot be demonstrated
      - - Telemetry spike causes spend or ingest instability
        - Medium
        - Medium-high
        - Spam filter is described as live; sampling and derive-and-convert are described as upcoming
        - Medium
        - Kill if a production-volume trial cannot cap spend and preserve material signals during a spike
      - - Roadmap breadth outruns delivery and support capacity
        - Medium
        - High
        - Fresh capital and product expansion help, but no delivery SLA or staffing evidence is in the pool
        - Medium-high
        - Kill if roadmap milestones slip, support response misses contract, or core observability reliability regresses
    notes: >-
      Likelihood, severity, and residual exposure are qualitative synthesis from current product
      statements and the independent MakerStack review; no incident frequency, uptime history, or
      loss denominator was publicly available in the assigned pool.
    claimRefs: [CR001, CR002, CR003, CR007, CR008, CR009, CR010, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or system
      - Role and concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - OpenTelemetry ecosystem
        - OpenTelemetry collectors, SDKs, and compatible tooling
        - Core ingestion and portability standard
        - Standard evolution or incomplete integration creates compatibility gaps
        - Medium
        - Open interfaces and multiple compatible tools reduce proprietary lock-in
        - Low-medium; verify version support and export fidelity
      - - Hosted Dash0 control and data plane
        - Dash0
        - Central service for telemetry query, alerting, and automation
        - Outage, degradation, or privileged automation failure impairs incident response
        - High
        - Customer instrumentation remains standards-based
        - High until SLA, architecture, disaster recovery, status history, and exit tests are reviewed
      - - Acquired product and team integration
        - Lumigo and Polar Signals
        - Two reported 2026 acquisitions expand serverless and profiling capability
        - Integration distraction, product overlap, or retention issues slow the core roadmap
        - Medium-high
        - Shared OpenTelemetry positioning may reduce technical mismatch
        - Medium; require integration milestones, retention data, and architecture ownership
      - - Customer and revenue base
        - Reported base of more than 600 to more than 750 customers
        - Scale is visible, but revenue concentration and acquired contribution are undisclosed
        - Loss of a large account or weak renewals undermines operating leverage
        - High
        - Broader customer count may diversify exposure
        - Unknown until top-customer, cohort, GRR, NRR, ACV, and organic-growth schedules are reviewed
    notes: >-
      Customer counts are third-party reports of company figures, not audited revenue evidence;
      revenue, profitability, concentration, retention, acquisition contribution, and cloud-vendor
      exposure remain unavailable in the assigned pool.
    claimRefs: [CR004, CR005, CR006, CR011, CR014, CR016]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative prioritization of evidence-backed and evidence-gap risks; cells are assessments,
      not measured probabilities or loss estimates.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative assessment from the assigned public evidence, with unknown retained where evidence is absent.
        - label: Impact
          detail: Potential investment or customer consequence rather than a quantified loss amount.
        - label: Mitigation maturity
          detail: Distinguishes company-claimed controls from independently demonstrated controls.
        - label: Residual risk
          detail: Exposure remaining after the mitigations visible in the assigned evidence.
      rows:
        - label: Autonomous-action governance
          note: Guardrails and pull-request workflows are described, but independent control testing is absent.
          values:
            - {label: Medium, tone: medium}
            - {label: High, tone: high}
            - {label: Claimed, tone: warning}
            - {label: High, tone: high}
        - label: Security and compliance assurance
          note: No qualifying audit, regulator, certification, or incident evidence was allocated to this chapter.
          values:
            - {label: Unknown, tone: neutral}
            - {label: High, tone: high}
            - {label: Unverified, tone: warning}
            - {label: High, tone: high}
        - label: Retention and forensic fit
          note: Independent review reports fixed 30-day retention for logs and traces.
          values:
            - {label: Medium, tone: medium}
            - {label: High, tone: high}
            - {label: Partial, tone: warning}
            - {label: Medium-high, tone: high}
        - label: Product-scope execution
          note: AutoMerge and parts of SignalControl are described as future or upcoming.
          values:
            - {label: Medium, tone: medium}
            - {label: High, tone: high}
            - {label: Developing, tone: warning}
            - {label: Medium-high, tone: high}
        - label: Acquisition integration
          note: Independent profile reports Lumigo and Polar Signals acquisitions during 2026.
          values:
            - {label: Medium, tone: medium}
            - {label: Medium-high, tone: high}
            - {label: Unverified, tone: warning}
            - {label: Medium, tone: medium}
        - label: Financial and customer durability
          note: Revenue, profitability, retention, concentration, burn, and runway are not established.
          values:
            - {label: Unknown, tone: neutral}
            - {label: High, tone: high}
            - {label: Unverified, tone: warning}
            - {label: High, tone: high}
    approximationNotes: >-
      Likelihood, impact, maturity, and residual labels are qualitative analyst judgments anchored
      to the cited claims; no numerical probability, incident rate, or expected-loss model is implied.
    claimRefs: [CR001, CR002, CR004, CR007, CR008, CR009, CR010, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Investment gating conditions
    body: >-
      Do not treat missing public incidents or claims as a clean record. Require a production-scale
      pilot, current assurance package, autonomous-action control test, complete financial and
      concentration schedules, and acquisition-integration plan before underwriting enterprise
      durability or near-term autonomous-operations upside.
    claimRefs: [CR001, CR004, CR009, CR014, CR015, CR016]
