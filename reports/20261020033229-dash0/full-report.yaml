      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Dash0's March 2026 Series B raised $110 million, brought reported total funding to $155 million, and set a
              $1 billion valuation. The investor announcement says the largest allocation is for Agent0, with meaningful
              spending also planned for US go-to-market expansion, core engineering, and targeted acquisitions. These
              commitments make the round strategically relevant, but funding raised is not cash available: the retained
              evidence does not disclose the post-close cash balance, monthly burn, debt, acquisition consideration,
              working-capital needs, or runway. The financial verdict is therefore mixed. Pricing architecture and
              customer growth indicate monetization potential, while the absence of revenue, margin, retention, and
              liquidity data prevents an investable view on revenue quality, capital intensity, or the next financing
              trigger.
            claimRefs:
              - CI007
