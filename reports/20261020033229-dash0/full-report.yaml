chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and product scope
        blocks:
          - type: paragraph
            body: >-
              Dash0 was founded in 2023 and describes itself as German-founded and headquartered in New York. The
              company is at the Series B stage after its March 2026 financing, which valued it at $1 billion. Its core
              proposition is an OpenTelemetry-native platform spanning metrics, logs, traces, and resources, with a
              broader company-claimed loop from AI-assisted code governance through production diagnosis and
              remediation. That standards-led architecture is the clearest organizing principle for the business model:
              sell engineering teams a unified observability and operations platform without requiring proprietary
              collection agents. The retained sources do not establish revenue, gross margin, or recurring-revenue
              scale, so stage and valuation should not be read as proof of commercial efficiency.
            claimRefs:
              - CO001
