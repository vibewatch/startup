      - number: '5.3'
        title: Maturity, differentiation, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              Dash0's defensible product thesis is open-standard collection paired with richer context and agent-facing
              access. The New Stack independently reported the OpenTelemetry design, Triage, metadata enrichment, and
              Spam Filters in 2025, which provides useful historical corroboration that the product was more than a 2026
              roadmap narrative. The public GitHub organization also demonstrates a developer surface through OTelBin
              and community channels, although the assigned evidence does not establish repository activity, contributor
              breadth, or package adoption. The largest underwriting risk is proof, not conceptual architecture. No
              retained source supplies a public uptime history, security attestation, data-retention specification,
              incident record, recovery objective, or measured accuracy for autonomous diagnosis and pull-request
              generation. OpenTelemetry can lower re-instrumentation friction, but it does not by itself validate
              operational reliability, safe autonomous action, backend portability, or roadmap execution.
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE012
