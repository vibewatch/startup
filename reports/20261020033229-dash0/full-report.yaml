      was estimated.
    claimRefs:
      - CM005
      - CM015
  - id: FP001
    title: Directional competitive positioning by deployment control and workflow breadth
    type: quadrant
    summary: An ordinal map of six representative options, intended to frame diligence rather than rank product quality.
    data:
      xAxis:
        label: 'Deployment control: managed only (1) to self-host/BYOC choice (5)'
        min: 1
        max: 5
      yAxis:
        label: 'Workflow breadth: focused observability (1) to broader operations suite (5)'
        min: 1
        max: 5
      points:
        - label: Dash0
          x: 1
          'y': 4
          detail: Managed OTel-native platform expanding into AI coding governance and automated remediation.
        - label: Datadog
          x: 1
          'y': 5
          detail: Managed incumbent positioned around broad integrations, security, and observability modules.
        - label: Better Stack
          x: 1
          'y': 5
          detail: Managed alternative positioned around observability plus incident management.
        - label: Middleware
          x: 5
          'y': 4
          detail: Claims SaaS, BYOC, on-premises, and hybrid deployment plus AI-SRE workflows.
        - label: SigNoz
          x: 5
          'y': 2
          detail: Open-source, self-hosted OTel-native route with a narrower evidenced operations scope.
        - label: Coroot
          x: 5
          'y': 3
          detail: Self-hosted eBPF route with profiling and infrastructure emphasis.
    approximationNotes: >-
      Ordinal 1-5 placements are analyst classifications derived from vendor-authored product descriptions, not measured
      market scores or independent benchmarks; small coordinate differences are not meaningful.
