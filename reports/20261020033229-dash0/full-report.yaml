      - number: '2.3'
        title: Buyers, users, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              Dash0's stated users are developers, SREs, and platform engineers, while the economic buyer is more likely
              an engineering, infrastructure, or platform leader accountable for reliability and observability spend.
              Security and compliance teams can influence deployment because telemetry may contain sensitive operational
              data, but the reviewed evidence does not show that they own the budget. Adoption is most plausible where a
              team already uses or is standardizing on OpenTelemetry and wants a managed backend with one query and
              operating surface. Consumption pricing shifts the purchase case from seat count to post-filter telemetry
              volume, retention needs, and Agent0 usage. The buying proof should therefore compare a representative
              noisy workload, not a clean demo, against the incumbent's all-in operating cost.
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
