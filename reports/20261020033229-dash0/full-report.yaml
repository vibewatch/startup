      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              OpenTelemetry standardization, rising telemetry volume, and pressure to correlate AI-generated code with
              production incidents are credible demand drivers, although Dash0's cited productivity and incident
              statistics are company-presented secondary evidence rather than an independently reviewed benchmark. The
              platform's strongest adoption mechanism is migration from an existing OpenTelemetry collector into a
              managed backend without making a proprietary collection agent the center of the stack. Constraints are
              equally material: self-hosting requirements, long-retention policies, entrenched incumbent estates,
              uncontrolled cardinality, weak service ownership, data-governance requirements, and caution around
              automated remediation. Open standards reduce instrumentation switching cost but do not eliminate the cost
              of recreating dashboards, alerts, access controls, or operational habits.
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad category growth is not company-specific demand
            body: >-
              The $3.35 billion category estimate cannot be converted into Dash0 TAM or SOM without independently
              sourced segment definitions, target-account counts, workload volumes, realized pricing, and evidence of
              buyer conversion.
            calloutType: risk
            claimRefs:
              - CM005
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Buyers can solve the observability and production-reliability job through several distinct routes. Broad
              incumbents such as Datadog, New Relic, and Dynatrace emphasize product breadth, enterprise history, and
              large integration catalogs. OpenTelemetry-native products such as SigNoz and Middleware compete more
              directly on telemetry portability, while Coroot offers an eBPF-led, self-hosted route. Better Stack and
              other incident platforms broaden the decision from observability into on-call and incident workflow. The
              status quo also includes internal operation of OpenTelemetry collectors plus open-source storage and
              dashboards. Because the comparison sources are written by vendors selling alternatives, the landscape is
              useful for identifying buyer choices but not for declaring an objective winner.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
