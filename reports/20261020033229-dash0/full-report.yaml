        title: Exhibits
        blocks:
          - type: callout
            title: Comparative evidence is commercially interested
            body: >-
              All four comparison publishers in the assigned pool sell competing products. Their claims are useful
              hypotheses for diligence, not independent benchmarks of price, feature quality, or customer preference.
            calloutType: risk
            claimRefs:
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Dash0 presents a usage-linked model rather than a conventional per-seat SaaS schedule. Its own site says
              billing is based on logs, spans, and metric data points sent and stored, while storage is charged only on
              telemetry retained after SignalControl filtering. Agent0 Automations adds a separate credit-based
              consumption mechanic, implying that observability storage and autonomous-agent activity can become
              distinct billable units. The company offers a free starting path, but that is an acquisition motion rather
              than evidence of conversion, contract value, or realized price. TNW independently describes data-volume
              pricing rather than seat or signal-type pricing, while NeuronFeed says current tiers must be requested.
              Public materials therefore explain billing logic but not enterprise discounts, commitments, overages,
              contract duration, or revenue recognition.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
