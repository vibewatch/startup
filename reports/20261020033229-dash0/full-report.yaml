  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Dash0 is no longer presented as a single observability console. Its current documentation describes a core
              observability surface for metrics, logs, traces, resources, service monitoring, alerting, dashboards,
              website monitoring, and synthetic monitoring, alongside Agent0 for AI-assisted SRE work, Darkplane for
              AI-coding oversight, and SignalControl for telemetry-volume management. In the customer workflow, teams
              instrument applications through OpenTelemetry, route signals into Dash0, investigate correlated production
              behavior, and apply filtering or automation at different points in that loop. The product breadth is
              strategically coherent because each module uses production or development signals, but maturity is uneven:
              the official July 2026 roadmap labels some functions as shipping while placing AutoMerge and parts of
              SignalControl in the future. Buyers therefore need module-level contracting and acceptance criteria,
              rather than treating the suite as uniformly production-ready.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE011
