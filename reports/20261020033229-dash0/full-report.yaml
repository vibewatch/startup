      - number: '5.2'
        title: Architecture, integration, and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The public architecture is strongest at the ingestion boundary. Dash0 states that it is built on
              OpenTelemetry, PromQL, and Perses, while a TrueFoundry integration guide documents OTLP/HTTP endpoints,
              authorization tokens, regional ingress, and dataset headers. A separate partner guide describes OTLP/HTTP,
              OTLP/gRPC, and the Kubernetes Operator. These sources support interoperability at collection time, not
              portability of every higher-level artifact or equivalence with competing backends. Above ingestion,
              SignalControl filters, samples, converts, and rolls up data before storage; SignalStore is described as
              the shared signal foundation for human and agent access through a console, PromQL, SQL, MCP, CLI, and API.
              This layered model reduces proprietary instrumentation dependency, but customers still depend on Dash0's
              hosted ingestion endpoints, authorization model, storage, correlation logic, and product-specific
              operational controls.
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE009
