      - number: '4.2'
        title: Traction without revenue-quality disclosure
        blocks:
          - type: paragraph
            body: >-
              TNW and Balderton both reported more than 600 paying customers in March 2026. TNW also reported 270
              customers at the October 2025 Series A, implying more than a doubling in roughly five months. That is a
              useful commercial-velocity signal, but it does not establish ARR, average contract value, expansion,
              churn, customer concentration, or sales efficiency. An undated Beatable profile says Dash0 serves more
              than 800 customers, creating a freshness and definition problem rather than a clean current metric: the
              retained page does not state whether that count is paying customers, accounts, or another population.
              Management reporting is required before customer growth can be translated into durable recurring revenue
              or an efficient go-to-market motion.
            claimRefs:
              - CI007
              - CI008
              - CI016
      - number: '4.3'
        title: Cost structure and unit-economics gaps
        blocks:
          - type: paragraph
            body: >-
              Public product architecture identifies likely economic drivers but not their financial values.
              SignalControl filters, converts, samples, and rolls up telemetry before storage; Dash0 describes one
              illustrative pipeline that reduced log, metric, and span volume by 74%. That may improve customer bill
              control and Dash0's storage efficiency, but an illustrative technical outcome is not evidence of company
              gross margin. Given billing tied to telemetry, retained storage, and agent credits, infrastructure
              consumption and agent inference are likely variable cost drivers, while support, engineering, and
              enterprise sales add operating expense. No retained source quantifies hosting cost, service-delivery
              labor, capex, gross margin, CAC, payback, or retention, so the direction and scalability of unit economics
              remain unverified.
            claimRefs:
              - CI013
