    title: Dash0 addressable-market evidence stack
    type: pyramid
    summary: >-
      Only the broad observability layer has an assigned numeric estimate; each narrower layer remains unquantified and
      must not be read as a value-proportional funnel.
    data:
      nodes:
        - id: broad-observability
          label: Broad observability category
          value: $3.35B in 2026
          detail: Third-party article estimate; geography and underlying methodology unavailable.
        - id: managed-observability
          label: Managed observability
          value: Not isolated
          detail: Would exclude self-hosted and internally operated observability spend.
        - id: opentelemetry-native
          label: OpenTelemetry-native backends
          value: Not isolated
          detail: No reviewed source sizes spend specifically tied to OpenTelemetry-native backends.
        - id: dash0-serviceable
          label: Dash0 serviceable market
