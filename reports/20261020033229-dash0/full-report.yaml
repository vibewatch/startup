  - id: FI001
    title: Revenue and gross-profit evidence bridge
    type: flow
    summary: Public evidence reaches billing mechanics but stops before realized revenue, delivery cost, and gross profit.
    data:
      nodes:
        - id: customer-activity
          label: Customer telemetry and agent activity
          detail: Logs, spans, metric data points, stored telemetry, and Agent0 runs create measurable activity.
        - id: signal-control
          label: SignalControl shaping
          detail: Filtering, conversion, sampling, and rollups can reduce stored volume before billing.
        - id: billing-units
          label: Public billing units
          detail: Telemetry sent and stored plus credit-based Agent0 automation are the disclosed mechanics.
        - id: realized-price
          label: Realized price
          detail: Rate cards, discounts, commitments, contract duration, and overages are unavailable.
        - id: recognized-revenue
          label: Recognized revenue
          detail: ARR, revenue, growth, mix, and recognition policy are unavailable.
        - id: gross-profit
          label: Gross profit
          detail: Hosting, inference, support, service-delivery cost, and gross margin are unavailable.
    approximationNotes: This is an evidence-availability flow, not a quantified conversion funnel or forecast.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI013
      - CI014
      - CI015
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly described layers from signal generation through ingestion, storage, analysis, and agentic action, with
      current and roadmap boundaries preserved.
    data:
      layers:
        - label: Telemetry producers
          detail: Applications, infrastructure, browsers, LLMs, and coding agents create operational and development signals.
          modules:
            - Applications
            - Kubernetes and cloud infrastructure
            - Browser sessions
            - AI agents
          outputs:
            - Traces
            - Metrics
            - Logs
            - Resources and events
        - label: OpenTelemetry collection
          detail: >-
            Standard SDKs, Collector pipelines, and the Dash0 Kubernetes Operator send signals without a proprietary
            collection agent.
          modules:
            - OpenTelemetry SDKs
            - OpenTelemetry Collector
            - Dash0 Kubernetes Operator
          outputs:
            - OTLP HTTP
            - OTLP gRPC
        - label: Regional ingestion
          detail: Authenticated region-specific endpoints receive telemetry and route it by dataset.
          modules:
            - Regional ingress
            - Authorization token
            - Dataset header
          outputs:
            - Accepted telemetry streams
        - label: SignalControl
          detail: >-
            Pre-storage controls filter noise and are described as converting, sampling, and rolling up high-volume
            signals.
          modules:
            - Spam Filter
            - Derive and Convert
            - Trace sampling
            - Time-series rollups
          outputs:
            - Reduced retained signal volume
        - label: SignalStore and query
          detail: Dash0 describes a shared OpenTelemetry-native store with human and agent interfaces.
          modules:
            - PromQL
            - SQL
            - Console
            - MCP
            - CLI
            - API
          outputs:
            - Correlated production context
        - label: Product and action surfaces
          detail: >-
            Observability, Agent0, and Darkplane consume shared context; some automation and governance functions are
            roadmap items.
          modules:
            - Observability
            - Agent0
            - Agent0 Automations
            - Darkplane
          outputs:
            - Investigation
            - Alerts
            - Draft fixes
            - AI-development governance
    approximationNotes: >-
      This is a conceptual map of public product claims, not a verified internal system diagram; current and roadmap
      components coexist in the source descriptions.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE009
      - CE011
  - id: FU001
    title: Documented Nutrient adoption journey
    type: journey-map
    summary: >-
      One customer's path from portable OpenTelemetry instrumentation to production migration and planned expansion,
      with the non-portable work preserved.
    data:
      nodes:
        - label: Portable baseline
          detail: Applications already emitted OTLP through locally managed OpenTelemetry Collectors.
          touchpoints:
            - OpenTelemetry SDKs
            - Local collectors
            - Terraform and GitOps
        - label: Evaluation and review
          detail: The team evaluated alternatives and completed compliance review after deciding to leave its former vendor.
          touchpoints:
            - Vendor evaluation
            - Compliance review
            - Cost modeling
        - label: Exporter change
          detail: Collector endpoints and credentials changed without application redeployment.
          touchpoints:
            - Collector configuration
            - Credentials
            - Environment rollout
        - label: First services
          detail: Initial services sent telemetry to Dash0 by mid-May 2026.
          touchpoints:
            - Kubernetes
            - ECS
            - CDN and CI
        - label: Non-portable rebuild
          detail: Dashboards were rebuilt, alerts recreated and retuned, and query habits relearned.
          touchpoints:
            - Dashboards
            - Alert rules
            - Query language
        - label: Consolidate and expand
          detail: The former account closed on 9 June, with wider tracing and deeper alerting planned.
          touchpoints:
            - Account closure
            - Wider tracing
            - Deeper alerting
    approximationNotes: >-
      This is a source-reported sequence for one customer, not a representative conversion funnel or a benchmark for
      implementation duration.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative prioritization of evidence-backed and evidence-gap risks; cells are assessments, not measured
      probabilities or loss estimates.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative assessment from the assigned public evidence, with unknown retained where evidence is absent.
        - label: Impact
          detail: Potential investment or customer consequence rather than a quantified loss amount.
        - label: Mitigation maturity
          detail: Distinguishes company-claimed controls from independently demonstrated controls.
        - label: Residual risk
          detail: Exposure remaining after the mitigations visible in the assigned evidence.
      rows:
        - label: Autonomous-action governance
          note: Guardrails and pull-request workflows are described, but independent control testing is absent.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Claimed
              tone: warning
            - label: High
              tone: high
        - label: Security and compliance assurance
          note: No qualifying audit, regulator, certification, or incident evidence was allocated to this chapter.
          values:
            - label: Unknown
              tone: neutral
            - label: High
              tone: high
            - label: Unverified
              tone: warning
            - label: High
              tone: high
        - label: Retention and forensic fit
          note: Independent review reports fixed 30-day retention for logs and traces.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Partial
              tone: warning
            - label: Medium-high
              tone: high
        - label: Product-scope execution
          note: AutoMerge and parts of SignalControl are described as future or upcoming.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Developing
              tone: warning
            - label: Medium-high
              tone: high
        - label: Acquisition integration
          note: Independent profile reports Lumigo and Polar Signals acquisitions during 2026.
          values:
            - label: Medium
              tone: medium
            - label: Medium-high
              tone: high
            - label: Unverified
              tone: warning
            - label: Medium
              tone: medium
        - label: Financial and customer durability
          note: Revenue, profitability, retention, concentration, burn, and runway are not established.
          values:
            - label: Unknown
              tone: neutral
            - label: High
              tone: high
            - label: Unverified
              tone: warning
            - label: High
              tone: high
    approximationNotes: >-
      Likelihood, impact, maturity, and residual labels are qualitative analyst judgments anchored to the cited claims;
      no numerical probability, incident rate, or expected-loss model is implied.
