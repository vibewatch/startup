        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The $110 million Series B is a financing event, not evidence of current cash, burn, debt capacity, or
              months of runway. Planned product, US go-to-market, and acquisition spending could consume materially
              different amounts.
            calloutType: risk
            claimRefs:
              - CI009
              - CI012
              - CI013
          - type: callout
            title: Gate underwriting on a management financial pack
            body: >-
              Require an ARR bridge, product and cohort revenue, realized pricing, gross margin, retention, CAC/payback,
              customer concentration, cash, burn, debt, and downside runway before assigning revenue-quality or
              capital-adequacy credit.
            calloutType: recommendation
            claimRefs:
