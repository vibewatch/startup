figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Dash0 moved from founding to a unicorn-priced Series B in under three years, while public operating disclosure
      remained limited.
    data:
      items:
        - date: '2023'
          label: Company founded
          detail: Dash0 was founded around an OpenTelemetry-native observability thesis.
          tone: neutral
          claimRefs:
            - CO001
            - CO003
        - date: '2024-11-04'
          label: Seed financing
          detail: The public profile records a $9.5 million seed round led by Accel.
          tone: positive
          claimRefs:
            - CO007
        - date: 2024-11
          label: Commercial launch
          detail: The independent company profile dates the product launch to November 2024.
          tone: neutral
          claimRefs:
            - CO001
            - CO007
        - date: '2025-10-02'
          label: Series A
          detail: Dash0 raised $35 million in a round reported as led by Accel.
          tone: positive
          claimRefs:
            - CO008
        - date: 2025-11
          label: Agent0 introduced
          detail: Dash0 says it introduced its agentic AI platform for observability.
          tone: positive
          claimRefs:
            - CO009
        - date: 2026-02
          label: Lumigo acquisition
          detail: An independent company profile reports the Lumigo acquisition for serverless and LLM observability.
          tone: neutral
          claimRefs:
            - CO010
        - date: '2026-03-23'
          label: Series B and unicorn valuation
          detail: Dash0 announced a $110 million Series B at a $1 billion valuation and more than 600 paying customers.
          tone: positive
          claimRefs:
            - CO011
            - CO012
            - CO013
            - CO014
        - date: '2026-07-06'
          label: Scope expands beyond observability
          detail: Dash0 described a broader product loop spanning SignalStore, Darkplane, and Agent0 automations.
          tone: neutral
          claimRefs:
            - CO003
            - CO009
