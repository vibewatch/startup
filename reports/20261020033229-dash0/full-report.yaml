        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder and chief executive Mirko Novakovic brings direct observability experience from co-founding
              Instana, which IBM acquired in 2020. Public profiles also identify Ben Blackmore as a co-founder, while
              the Series B announcement says Balderton partner Rana Yared joined the board. This is relevant
              founder-market fit, but the public record remains too thin to assess decision rights, independent-director
              coverage, succession planning, or the allocation of responsibilities below the founders. Novakovic is also
              the dominant quoted strategic voice across the retained company materials, making management depth and
              key-person resilience appropriate diligence priorities rather than established weaknesses. Management
              materials should supply the full board, executive roster, vesting, and succession framework.
