        title: Financing history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing sequence begins with a $9.5 million seed round in November 2024, followed by a $35
              million Series A in October 2025 and a $110 million Series B led by Balderton in March 2026. The latest
