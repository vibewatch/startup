              - CP009
              - CP010
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Dash0's open-standard architecture is a double-edged moat. It lowers adoption friction and supports a
              credible anti-lock-in position, yet the same portability can make multi-homing or migration easier when
              another vendor offers broader workflows, self-hosting, or a preferred billing unit. The official shift
              beyond observability creates a possible data-and-workflow loop across coding, telemetry, and remediation,
              but durability depends on Agent0 accuracy, customer trust, and repeatable commercial wins that are not
              disclosed here. A March competitor article described Agent0 as beta and unable to produce fixes, while
              later Dash0 materials state that it is generally available and can open pull requests. That dated
              contradiction demonstrates why competitor matrices require current primary-source verification before
              underwriting.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
