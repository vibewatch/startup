      - number: '3.3'
        title: Pricing, portability, and switching dynamics
        blocks:
          - type: paragraph
            body: >-
              Dash0 describes pricing as usage-based by telemetry signal without per-seat charges, while vendor
              comparisons frame the alternatives around host, data-ingest, per-core, or modular pricing. These units are
              not directly comparable without a customer's real telemetry mix, retention, cardinality, discounts, and
              support requirements. OpenTelemetry reduces technical lock-in because compatible destinations can receive
              OTLP data, but it does not make switching costless: dashboards, alerts, query languages, retention
              history, incident workflows, and procurement still require migration. Self-hosted options add deployment
              control but transfer storage and operating burden to the customer. A proof using representative workloads
              is therefore more decision-useful than list-price arithmetic.
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP010
              - CP011
              - CP016
