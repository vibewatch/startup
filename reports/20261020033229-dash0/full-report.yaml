  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The defensible core boundary is managed full-stack observability for modern engineering teams: collection,
              storage, querying, alerting, and investigation of logs, metrics, traces, frontend signals, infrastructure,
              and AI workloads. Dash0's official materials place OpenTelemetry, PromQL, and Perses at the foundation and
              emphasize a single operating surface from frontend through infrastructure. The boundary should exclude the
              much larger universe of AI software spending and general developer productivity tools; Darkplane and
              autonomous remediation are adjacencies until separate buyer budgets and attach rates are evidenced.
              Status-quo substitutes include incumbent APM suites, self-hosted or open-source observability, internally
              operated OpenTelemetry pipelines, and fragmented point tools. Open instrumentation lowers collection
              lock-in, but platform-specific dashboards, monitors, retention policies, and automations can still create
              migration work.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM013
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The only explicit category estimate in the assigned evidence comes from AgentMarketCap, which reports a
              $3.35 billion observability market in 2026 and a $6.93 billion projection for 2031 at a 15.62% CAGR. Those
              figures are useful as a broad category ceiling, not as Dash0 TAM, because the underlying market study,
              geography, spend inclusions, and publisher methodology were not available in the prefetched text. The same
              article cites much larger agentic-AI spending, but that pool is not a subset of observability and is
              therefore excluded from the sizing stack. No reviewed source quantifies OpenTelemetry-native backend
              spend, Dash0's reachable customer population, workload volumes, or realistic share. A bottom-up SAM/SOM
              requires account counts by segment, telemetry volume, retention mix, conversion, and net pricing.
            claimRefs:
              - CM005
              - CM006
              - CM013
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM013
