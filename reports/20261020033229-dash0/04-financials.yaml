schemaVersion: "report-v2"
artifact: "financials"
slug: "dash0"
runDate: 2026-10-20
company:
  name: "Dash0"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Dash0 publicly describes usage-linked telemetry and storage pricing, credit-based
    Agent0 automation, more than 600 paying customers, and a $110 million Series B.
    The retained evidence does not disclose ARR, realized pricing, gross margin, cash,
    burn, runway, retention, CAC, or payback, so revenue quality and capital adequacy
    cannot yet be underwritten.
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and pricing architecture"
    body: >-
      Dash0 presents a usage-linked model rather than a conventional per-seat SaaS
      schedule. Its own site says billing is based on logs, spans, and metric data
      points sent and stored, while storage is charged only on telemetry retained
      after SignalControl filtering. Agent0 Automations adds a separate credit-based
      consumption mechanic, implying that observability storage and autonomous-agent
      activity can become distinct billable units. The company offers a free starting
      path, but that is an acquisition motion rather than evidence of conversion,
      contract value, or realized price. TNW independently describes data-volume
      pricing rather than seat or signal-type pricing, while NeuronFeed says current
      tiers must be requested. Public materials therefore explain billing logic but
      not enterprise discounts, commitments, overages, contract duration, or revenue
      recognition.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001, TI002]
  - id: "traction-and-sales-efficiency"
    title: "Traction without revenue-quality disclosure"
    body: >-
      TNW and Balderton both reported more than 600 paying customers in March 2026.
      TNW also reported 270 customers at the October 2025 Series A, implying more than
      a doubling in roughly five months. That is a useful commercial-velocity signal,
      but it does not establish ARR, average contract value, expansion, churn, customer
      concentration, or sales efficiency. An undated Beatable profile says Dash0
      serves more than 800 customers, creating a freshness and definition problem
      rather than a clean current metric: the retained page does not state whether
      that count is paying customers, accounts, or another population. Management
      reporting is required before customer growth can be translated into durable
      recurring revenue or an efficient go-to-market motion.
    claimRefs: [CI007, CI008, CI016]
  - id: "cost-structure-and-unit-economics"
    title: "Cost structure and unit-economics gaps"
    body: >-
      Public product architecture identifies likely economic drivers but not their
      financial values. SignalControl filters, converts, samples, and rolls up
      telemetry before storage; Dash0 describes one illustrative pipeline that
      reduced log, metric, and span volume by 74%. That may improve customer bill
      control and Dash0's storage efficiency, but an illustrative technical outcome
      is not evidence of company gross margin. Given billing tied to telemetry,
      retained storage, and agent credits, infrastructure consumption and agent
      inference are likely variable cost drivers, while support, engineering, and
      enterprise sales add operating expense. No retained source quantifies hosting
      cost, service-delivery labor, capex, gross margin, CAC, payback, or retention,
      so the direction and scalability of unit economics remain unverified.
    claimRefs: [CI013, CI014, CI015]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: "capital-adequacy-and-verdict"
    title: "Capital adequacy and financial verdict"
    body: >-
      Dash0's March 2026 Series B raised $110 million, brought reported total funding
      to $155 million, and set a $1 billion valuation. The investor announcement says
      the largest allocation is for Agent0, with meaningful spending also planned for
      US go-to-market expansion, core engineering, and targeted acquisitions. These
      commitments make the round strategically relevant, but funding raised is not
      cash available: the retained evidence does not disclose the post-close cash
      balance, monthly burn, debt, acquisition consideration, working-capital needs,
      or runway. The financial verdict is therefore mixed. Pricing architecture and
      customer growth indicate monetization potential, while the absence of revenue,
      margin, retention, and liquidity data prevents an investable view on revenue
      quality, capital intensity, or the next financing trigger.
    claimRefs: [CI007, CI009, CI010, CI011, CI012, CI013, CI015]
tables:
  - id: "TI001"
    title: "Revenue streams and monetization status"
    columns: ["Stream", "Mechanism", "Billing unit", "Public status", "Revenue quality", "Diligence ask"]
    rows:
      - ["Core observability", "Ingest and analyze logs, spans, and metrics", "Telemetry items sent and stored", "Commercial product; realized price undisclosed", "Usage-linked but unquantified", "Provide ARR by product, committed versus overage revenue, and cohort mix"]
      - ["SignalStore storage", "Retain selected telemetry after SignalControl", "Telemetry retained", "Storage is billed only on kept telemetry", "Potentially recurring; retention terms undisclosed", "Provide storage commitments, retention periods, and infrastructure gross margin"]
      - ["Agent0 Automations", "Autonomous production-operation runs", "Credits per run or activity", "Company states credit-based pricing", "Consumption potential; conversion and margin unknown", "Provide credit schedule, attach rate, utilization, and inference cost"]
      - ["Darkplane and adjacent modules", "AI coding cost, adoption, and productivity visibility", "Not publicly disclosed", "Product available; separate monetization not disclosed", "Unknown packaging and revenue contribution", "Provide SKU packaging, cross-sell rate, and realized price"]
    notes: "Mechanics come from Dash0 product materials and TNW; realized pricing, discounts, contract terms, revenue mix, and recognition policy are not public."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI013]
  - id: "TI002"
    title: "Pricing and commercial-motion evidence"
    columns: ["Offer or unit", "Public description", "List versus realized", "Commercial implication", "Evidence limit"]
    rows:
      - ["Free start / trial", "Start for free and free-trial calls to action", "Entry offer only", "May lower evaluation friction", "No conversion, duration, or free-tier limits disclosed"]
      - ["Telemetry ingestion", "Logs, spans, and metric data points sent and stored", "Public billing basis; no rate card retained", "Usage expands with monitored activity", "No realized price, minimum, discount, or overage data"]
      - ["Storage", "Billed only for telemetry retained after filtering", "Public billing basis; no rate retained", "SignalControl may reduce billable storage volume", "No retention tiers or storage margin disclosed"]
      - ["Agent0 automation", "Credit-based pricing keeps run cost visible", "Mechanism disclosed; credit price absent", "Adds a consumption surface beyond storage", "No attach rate, consumption curve, or inference-cost data"]
    notes: "The table distinguishes public billing mechanics from realized enterprise pricing; NeuronFeed reports that current tiers require direct inquiry."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
  - id: "TI003"
    title: "Unit economics and capital-adequacy scorecard"
    columns: ["Metric", "Public value", "Confidence", "Why it matters", "Diligence request"]
    rows:
      - ["Paying customers", "More than 600 in March 2026; undated third-party profile says more than 800", "Medium", "Signals traction but definitions and current count differ", "Reconcile paying accounts, logos, and active production customers by quarter"]
      - ["ARR / revenue / growth", "Unavailable", "Low", "Required to assess scale and revenue quality", "Provide audited monthly revenue, ARR bridge, growth, and product mix"]
      - ["Gross margin and hosting cost", "Unavailable", "Low", "Tests whether usage growth produces operating leverage", "Provide gross margin by product and telemetry type, including agent inference cost"]
      - ["CAC, payback, sales cycle, and channel economics", "Unavailable", "Low", "Determines whether rapid customer growth is efficient", "Provide cohort CAC, fully loaded payback, cycle length, and partner economics"]
      - ["NRR, churn, and concentration", "Unavailable", "Low", "Measures durability and downside from logo loss", "Provide GRR, NRR, expansion, churn, top-10 concentration, and ACV distribution"]
      - ["Cash, burn, debt, and runway", "$110M Series B raised; liquidity metrics unavailable", "Medium on financing, low on adequacy", "Funding does not establish cash available or runway", "Provide post-close cash, monthly burn, debt, acquisition obligations, and downside runway"]
    notes: "Unavailable means no retained public source disclosed the metric; the financing amount is not treated as cash on hand or runway."
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI016]
figures:
  - id: "FI001"
    title: "Revenue and gross-profit evidence bridge"
    type: "flow"
    summary: "Public evidence reaches billing mechanics but stops before realized revenue, delivery cost, and gross profit."
    data:
      nodes:
        - id: "customer-activity"
          label: "Customer telemetry and agent activity"
          detail: "Logs, spans, metric data points, stored telemetry, and Agent0 runs create measurable activity."
        - id: "signal-control"
          label: "SignalControl shaping"
          detail: "Filtering, conversion, sampling, and rollups can reduce stored volume before billing."
        - id: "billing-units"
          label: "Public billing units"
          detail: "Telemetry sent and stored plus credit-based Agent0 automation are the disclosed mechanics."
        - id: "realized-price"
          label: "Realized price"
          detail: "Rate cards, discounts, commitments, contract duration, and overages are unavailable."
        - id: "recognized-revenue"
          label: "Recognized revenue"
          detail: "ARR, revenue, growth, mix, and recognition policy are unavailable."
        - id: "gross-profit"
          label: "Gross profit"
          detail: "Hosting, inference, support, service-delivery cost, and gross margin are unavailable."
    approximationNotes: "This is an evidence-availability flow, not a quantified conversion funnel or forecast."
    claimRefs: [CI001, CI002, CI003, CI013, CI014, CI015]
callouts:
  - calloutType: "risk"
    title: "Funding is not runway"
    body: >-
      The $110 million Series B is a financing event, not evidence of current cash,
      burn, debt capacity, or months of runway. Planned product, US go-to-market, and
      acquisition spending could consume materially different amounts.
    claimRefs: [CI009, CI012, CI013]
  - calloutType: "recommendation"
    title: "Gate underwriting on a management financial pack"
    body: >-
      Require an ARR bridge, product and cohort revenue, realized pricing, gross margin,
      retention, CAC/payback, customer concentration, cash, burn, debt, and downside
      runway before assigning revenue-quality or capital-adequacy credit.
    claimRefs: [CI007, CI013, CI015, CI016]
