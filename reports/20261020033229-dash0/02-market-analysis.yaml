callouts:
  - calloutType: risk
    title: Broad category growth is not company-specific demand
    body: >-
      The $3.35 billion category estimate cannot be converted into Dash0 TAM or SOM
      without independently sourced segment definitions, target-account counts, workload
      volumes, realized pricing, and evidence of buyer conversion.
    claimRefs: [CM005, CM015]
