      - [Dash0 obtainable market, Current, Not available, Not disclosed, Not available, "Requires win rate, deployment ramp, retention, and capacity constraints", Unresolved, "No supported SOM or penetration basis"]
    notes: >-
      Values retain the source's stated periods and units; no currency conversion,
      geographic allocation, or interpolation was applied.
    claimRefs: [CM005, CM006, CM013]
