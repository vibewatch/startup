    data:
      xAxis:
        label: "Deployment control: managed only (1) to self-host/BYOC choice (5)"
        min: 1
        max: 5
      yAxis:
        label: "Workflow breadth: focused observability (1) to broader operations suite (5)"
        min: 1
        max: 5
      points:
        - label: Dash0
          x: 1
          y: 4
          detail: "Managed OTel-native platform expanding into AI coding governance and automated remediation."
        - label: Datadog
          x: 1
          y: 5
          detail: "Managed incumbent positioned around broad integrations, security, and observability modules."
        - label: Better Stack
          x: 1
          y: 5
          detail: "Managed alternative positioned around observability plus incident management."
        - label: Middleware
          x: 5
          y: 4
