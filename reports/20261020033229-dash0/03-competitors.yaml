  - id: TP002
    title: Capability and buying-criteria matrix
    columns:
      - Buying criterion
      - Dash0 evidence
      - Alternative evidence
      - Diligence interpretation
    rows:
      - ["Telemetry model", "OpenTelemetry-native across metrics, logs, traces, and resources", "SigNoz and Middleware are described as OTel-native; Coroot combines eBPF with OTLP", "Standards narrow architectural differentiation"]
      - ["Deployment control", "Competitor comparisons describe SaaS-only deployment", "Coroot and SigNoz offer self-hosting; Middleware claims BYOC and on-premises options", "Regulated buyers may favor deployment flexibility"]
      - ["AI investigation and remediation", "Official sources say Agent0 scans, traces issues to commits, and drafts pull requests", "Vendor comparisons describe AI investigation or remediation across several alternatives", "Independent task-level benchmark is missing"]
      - ["Incident lifecycle", "No built-in on-call or status-page capability is evidenced in the assigned Dash0 sources", "Middleware and Better Stack comparisons position incident workflow as an alternative advantage", "Potential bundle disadvantage requires direct product verification"]
      - ["Experience breadth", "Official docs list website and synthetic monitoring alongside core observability", "Incumbents are described as broader in integrations, security, mobile, and hybrid coverage", "Breadth may outweigh OTel purity in enterprise procurement"]
      - ["Portability and lock-in", "OpenTelemetry, PromQL, APIs, MCP, and CLI support an open-interface position", "OTel-compatible peers can receive the same standardized telemetry", "Data portability reduces but does not eliminate migration work"]
    notes: >-
      Matrix cells report what the assigned sources state, not hands-on validation; unsupported
      product qualities, benchmark performance, and completeness are intentionally not scored.
    claimRefs: [CP001, CP002, CP003, CP006, CP007, CP008, CP009, CP010, CP011, CP013, CP016]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Vendor or route
      - Reported charging unit
      - Packaging or deployment
      - Unsupported inputs
      - Investment implication
    rows:
      - [Dash0, "Usage by telemetry signal", "Managed platform; no per-seat charge claimed", "Realized discounts, customer ingest mix, and gross margin", "Transparent units help modeling, but spend still scales with emitted volume"]
      - [Coroot, "Per-core positioning plus customer-run infrastructure", "Open-source self-hosted and enterprise options", "Normalized support, storage, labor, and production topology", "Predictability trades against operational burden"]
      - [Middleware, "Per-GB and feature usage according to its own article", "SaaS, BYOC, on-premises, and hybrid claimed", "Contract minimums, discounts, and like-for-like retention", "Deployment choice may matter more than headline unit price"]
      - [Datadog, "Per-host plus separately metered modules according to vendor comparisons", "Broad modular SaaS suite", "Enterprise discounts and comparable feature bundle", "Breadth can justify cost but complicates normalized comparison"]
      - [New Relic, "Data ingest plus user seats according to vendor comparisons", "Managed full-stack platform", "Current first-party prices and realized seat mix", "Seat economics vary sharply with team size"]
      - [SigNoz, "Free self-hosted software or usage-based cloud according to vendor comparisons", "Community, cloud, and enterprise routes", "Infrastructure labor, support, and enterprise terms", "Low license cost does not equal low total cost"]
    notes: >-
      Pricing models are directional and not a current quote. No normalized workload, retention
      period, discount schedule, taxes, support tier, or total-cost benchmark was available.
    claimRefs: [CP004, CP008, CP009, CP010, CP016]
