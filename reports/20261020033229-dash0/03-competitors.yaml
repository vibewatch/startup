        - label: SigNoz
          x: 5
          y: 2
          detail: "Open-source, self-hosted OTel-native route with a narrower evidenced operations scope."
        - label: Coroot
          x: 5
          y: 3
          detail: "Self-hosted eBPF route with profiling and infrastructure emphasis."
    approximationNotes: >-
      Ordinal 1-5 placements are analyst classifications derived from vendor-authored product
      descriptions, not measured market scores or independent benchmarks; small coordinate
      differences are not meaningful.
    claimRefs: [CP002, CP006, CP007, CP008, CP009, CP010, CP015, CP016]
