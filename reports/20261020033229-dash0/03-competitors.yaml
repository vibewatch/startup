      - [Coroot, "eBPF and self-hosted substitute", "Not independently verified in assigned evidence", "Infrastructure teams wanting self-hosting and zero-code collection", "eBPF instrumentation and per-core positioning", "Comparison and cost example are issued by Coroot"]
