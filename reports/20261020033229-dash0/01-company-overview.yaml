        Obtain the current cap table, charter, voting agreements, board minutes,
        committee charters, executive roster, and succession plan from management.
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: financial-scale
      missingEvidence: >-
        Current ARR, GAAP revenue, growth, gross margin, net retention, cash,
        burn, runway, customer concentration, and ACV distribution.
      whyItMatters: >-
        Funding raised, valuation, and customer count cannot establish revenue
        quality, capital efficiency, or the durability of commercial traction.
      diligencePath: >-
        Request audited financials, monthly management accounts, bank statements,
        ARR and customer cohort bridges, and the latest board-approved plan.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
    - type: conflicting-data
      severity: material
      topic: headcount
      missingEvidence: >-
        A current payroll-backed employee count reconciled to the public
        profile's incompatible January, March, and April 2026 figures.
      whyItMatters: >-
        Headcount informs burn, organizational scale, hiring velocity, and the
        credibility of operating-leverage assumptions.
      diligencePath: >-
        Obtain an anonymized payroll roster by function, geography, start date,
