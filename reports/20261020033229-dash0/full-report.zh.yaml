    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与产品范围
        blocks:
          - type: paragraph
            body: >-
              Dash0 成立于 2023 年，自称源自德国、总部位于纽约。公司在 2026 年 3 月融资后进入 Series B 阶段，估值达到 $1 billion。其核心主张是以 OpenTelemetry
              为原生基础，覆盖指标、日志、追踪和资源，并据公司自述把 AI
              辅助代码治理延伸到生产诊断与修复。以标准为中心的架构是其商业模式最清晰的组织原则：向工程团队出售统一的可观测性和运维平台，而不要求使用专有采集代理。留存来源无法证明收入、毛利率或经常性收入规模，因此不能把阶段和估值当作商业效率的证明。
