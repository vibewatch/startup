      - number: '2.3'
        title: 买方、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              Dash0 所称用户是开发者、SRE
              和平台工程师；经济买方更可能是负责可靠性和可观测性支出的工程、基础设施或平台负责人。遥测可能含有敏感运营数据，因此安全与合规团队能够影响部署，但已审阅证据没有显示预算由他们掌握。最可能采用的场景，是团队已经使用或正在标准化
              OpenTelemetry，并希望获得一个托管后端、统一查询和操作界面。按用量计费会让采购逻辑从席位数转向过滤后的遥测量、留存需求和 Agent0
              用量。因此，采购验证应拿真实的嘈杂工作负载，而不是干净演示，去对比现有方案的全包运营成本。
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM011
              - CM012
              - CM016
      - number: '2.4'
        title: 采用驱动与约束
        blocks:
          - type: paragraph
            body: >-
              OpenTelemetry 标准化、遥测量上升，以及把 AI 生成代码与生产事故关联起来的压力，都是可信的需求驱动因素；不过 Dash0
              引用的生产力和事故统计来自公司呈现的二手证据，并非独立审阅的基准。平台最强的采用机制，是把现有 OpenTelemetry collector
              迁移到托管后端，而不让专有采集代理成为技术栈中心。约束同样重要：自托管要求、长期留存政策、根深蒂固的传统系统、失控的基数、薄弱的服务归属、数据治理要求，以及对自动修复的谨慎。开放标准降低了埋点切换成本，却不会消除重建仪表板、告警、访问控制或运营习惯的成本。
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
