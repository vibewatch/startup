  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方细分与匹配度
        blocks:
          - type: paragraph
            body: >-
              已展示得最清楚的买方，是已经运营 OpenTelemetry collector、希望在不使用专有埋点的情况下获得托管可观测性后端的工程组织。Nutrient 符合这一画像：其平台团队通过修改 collector
              端点和凭据，迁移了 Kubernetes、ECS、CDN 和 CI 遥测，而无需重新部署应用。独立产品评测把理想买方更宽泛地描述为平台工程或 SRE 负责人，尤其是在 Kubernetes 环境中；Dash0
              自身产品面还覆盖网页监控、应用性能、AI 工作负载和云基础设施。这支持开发者、SRE
              和平台工程买方的论点，却没有建立量化的细分结构。同一评测指出了明确边界：要求自托管或隔离网络部署的组织匹配度较差，因为产品以托管 SaaS 交付。另一份独立评测认为，按信号定价很适合发送丰富
              OpenTelemetry 元数据的团队，但这属于产品匹配判断，不是客户经济性证据。
