        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              指定证据中唯一明确的品类估算来自 AgentMarketCap：其称 2026 年可观测性市场为 $3.35 billion，2031 年预计为 $6.93 billion，CAGR 为
              15.62%。这些数字只能作为宽泛的品类上限，不能当作 Dash0 的 TAM，因为预取文本没有提供底层市场研究、地域、支出范围和发布方方法论。同一文章提到规模更大的 agentic-AI
              支出，但该池子并不属于可观测性，因此应排除在规模测算之外。已审阅来源没有量化 OpenTelemetry 原生后端支出、Dash0 可触达的客户群、工作负载量或现实份额。自下而上的 SAM/SOM
              需要按细分统计账户数、遥测量、留存结构、转化率和净定价。
