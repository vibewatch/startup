        - 只有经验证的前瞻经济性仍留有创投级回报空间，当前 $1B 估值才站得住
        - 一手队列数据与可重复的竞争胜出
        - 即便产品扩张，增长或留存仍未达标
      - - 基准
        - 客户势头延续，但收入质量与条款仍属非公开信息
