  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              买方可以通过几条不同路径解决可观测性和生产可靠性问题。Datadog、New Relic 和 Dynatrace 等大型传统厂商强调产品广度、企业历史和庞大的集成目录。SigNoz、Middleware 等
              OpenTelemetry 原生产品更直接地围绕遥测可移植性竞争，Coroot 则提供 eBPF 驱动的自托管路径。Better Stack 等事故平台把决策从可观测性扩展到值班和事故流程。现状还包括内部运营
              OpenTelemetry collector，加上开源存储和仪表板。由于比较来源由销售替代方案的厂商撰写，这些材料适合识别买方选择，却不能用来宣布客观赢家。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP016
