        blocks:
          - type: paragraph
            body: >-
              投资论点建立在标准原生架构、据报道的客户加速和更广的产品面上。Dash0 称其平台采用 OpenTelemetry、PromQL 和开放接口，2026 年 7 月路线图则从可观测性延伸到
              SignalStore、Darkplane 和 Agent0 自动化。公司报告称上线九个月后客户超过 270 个，独立资料后来重复了超过 600
              个付费客户。反论点是，这些客户数没有揭示合同规模、留存、毛利率或集中度。一份独立评测还指出 Dash0 运营历史很短、Datadog 的集成生态大得多，并可能不适合小团队、严格数据驻留买方和面临迁移成本的客户。
