  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可守住的核心边界，是面向现代工程团队的托管式全栈可观测性：收集、存储、查询、告警，以及对日志、指标、追踪、前端信号、基础设施和 AI 工作负载的调查。Dash0 的官方材料把
              OpenTelemetry、PromQL 和 Perses 放在底层，并强调从前端到基础设施的单一操作界面。市场边界应排除规模更大的 AI
              软件支出和一般开发者生产力工具；在有独立买方预算和附加率证据之前，Darkplane 与自动修复仍只是相邻方向。现状替代方案包括传统 APM 套件、自托管或开源可观测性、内部运营的 OpenTelemetry
              管道，以及碎片化的点工具。开放式埋点降低了采集层锁定，但特定平台的仪表板、监控器、留存政策和自动化仍会制造迁移工作。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
