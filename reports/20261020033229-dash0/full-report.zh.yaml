  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Dash0 已不再只是一个可观测性控制台。当前文档描述的核心可观测性面覆盖指标、日志、追踪、资源、服务监控、告警、仪表板、网站监控和合成监控，同时配有面向 AI 辅助 SRE 工作的 Agent0、负责 AI
              编码监督的 Darkplane，以及管理遥测量的 SignalControl。在客户工作流中，团队通过 OpenTelemetry 为应用埋点，把信号路由到
              Dash0，调查相互关联的生产行为，并在不同环节应用过滤或自动化。产品广度在战略上是连贯的，因为每个模块都使用生产或开发信号；但成熟度并不均衡：官方 2026 年 7 月路线图把部分功能标为已上线，同时把
              AutoMerge 和部分 SignalControl 放到未来。买方需要按模块设置合同和验收标准，而不应把整套产品视为同样准备好投入生产。
