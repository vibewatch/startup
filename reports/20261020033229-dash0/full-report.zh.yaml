        blocks:
          - type: paragraph
            body: >-
              公开证据不足以支持点预测、概率百分比或精确估值区间。乐观情景要求经验证的 ARR 规模、持久增长、强留存和企业采用，在当前公开价格或更低价格下填补证据缺口。基准情景把 $1 billion
              视为融资事实，而非内在价值，待一手指标和条款到位后再入场。悲观情景是下轮融资或长期流动性不足：客户增长无法转化为收入质量，年轻平台输给成熟生态，或计划中的产品扩张稀释执行。因而，情景信号应是尽调结果，而非臆造的概率。
