      - number: '7.4'
        title: 依赖、集中度与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              OpenTelemetry 降低了专有采集锁定，却没有消除对 Dash0 托管服务、执行路线图或被收购产品整合的依赖。一份独立资料称公司于 2026
              年完成两起收购，这在转向自主运营的同时带来了产品和团队整合工作。一份独立资料称客户规模超过 600，另一份称超过
              750，但这些数字来自公司口径，并未披露收入集中度、续约质量、队列留存或收购与自然增长的贡献。财务持久性同样没有量化：两份独立资料称收入或盈利能力未公开，另一份只报告管理层希望快速达到 $100 million
              ARR。终止标准包括生产试点失败、重大控制例外、无法导出数据或限制支出、客户或云暴露过度集中，或跑道不足以在短期融资前完成宣传中的路线图。
