        title: 架构、集成与运营依赖
        blocks:
          - type: paragraph
            body: >-
              公开架构在摄入边界最强。Dash0 称其构建于 OpenTelemetry、PromQL 和 Perses 之上；TrueFoundry 集成指南则记录了 OTLP/HTTP
              端点、授权令牌、区域入口和数据集标头。另一份合作伙伴指南描述了 OTLP/HTTP、OTLP/gRPC 和 Kubernetes
              Operator。这些来源证明了采集时的互操作性，却不证明每种上层资产都可移植，也不证明与竞争后端等价。在摄入层之上，SignalControl 会在存储前过滤、采样、转换并汇总数据；SignalStore
              被描述为人和代理共享的信号基础，可通过控制台、PromQL、SQL、MCP、CLI 和 API 访问。这种分层模型降低了对专有埋点的依赖，但客户仍依赖 Dash0
              的托管摄入端点、授权模型、存储、关联逻辑和产品特有的运营控制。
