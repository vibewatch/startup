              下一步决策应要求当前 ARR
              桥接、已确认收入历史、毛利率、净留存、客户集中度、烧钱和跑道，并全部绑定到报告期和来源系统。融资尽调应取得股权结构表、期权池、清算优先权、参与权、反稀释条款、债务和任何收购义务。商业工作应把据报道的付费客户数与
              ACV 队列和流失率对账；技术工作应在参考电话中测试 Agent0 结果和 OpenTelemetry 迁移主张。退出准备度仍未经证明，因为已审阅记录只有历史 IPO
