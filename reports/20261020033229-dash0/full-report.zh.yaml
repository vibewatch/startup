        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Dash0 展示的是用量挂钩模式，而非传统的按席位 SaaS 价目表。公司网站称账单基于发送和存储的日志、spans 与指标数据点；存储只对 SignalControl 过滤后保留下来的遥测计费。Agent0
              Automations 另设积分消耗机制，意味着可观测性存储和自主代理活动可能成为不同的计费单位。公司提供免费起步路径，但那是获客动作，不是转化率、合同价值或实际价格的证据。TNW
              独立描述为按数据量定价，而不是按席位或信号类型定价；NeuronFeed 则称当前档位需要申请。公开材料解释了计费逻辑，却没有解释企业折扣、承诺量、超额费、合同期限或收入确认。
