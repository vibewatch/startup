      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              Dash0 的 2026 年 3 月 Series B 融资 $110 million，使据报道的累计融资达到 $155 million，并把估值定在 $1 billion。投资方公告称最大一笔分配给
              Agent0，同时还计划在美国市场进入、核心工程和定向收购上投入可观资金。这些承诺让本轮融资具有战略意义，但筹资额不等于可用现金：留存证据没有披露交割后的现金余额、月度烧钱、债务、收购对价、营运资金需求或跑道。因此财务结论是混合的。定价架构和客户增长显示出变现潜力，但缺少收入、利润、留存和流动性数据，使人无法对收入质量、资本密度或下一次融资触发点形成可投资判断。
            claimRefs:
