      - number: '3.2'
        title: 差异化与能力边界
        blocks:
          - type: paragraph
            body: >-
              Dash0 的官方产品面覆盖指标、日志、追踪、资源、网站监控、合成监控、遥测量控制和 Agent0。审阅材料中最清晰的差异点，是 Agent0 能持续扫描环境、把问题追溯到提交，并起草 pull
              request，而不是停留在仪表板或对话式查询。公司还通过 SignalStore、SignalControl 和 Darkplane 扩大范围，把生产遥测与 AI 辅助软件交付连接起来。这会提升产品价值，但也让
              Dash0 更接近资金更充足的套件和事故平台。能力比较仍属暂定，因为指定材料中没有独立基准测试调查准确率、修复质量、集成完整性或生产可靠性。
