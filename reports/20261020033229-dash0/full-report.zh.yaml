        blocks:
          - type: paragraph
            body: >-
              Nutrient 的迁移说明了 OpenTelemetry 原生定位为何能降低初始部署摩擦。既有 SDK 埋点和本地管理的 collector 保持不变；团队修改 exporter
              配置，然后重建仪表板、重新创建并调优告警，也重新熟悉查询工作流。这一差异很重要，因为遥测可移植并没有让每个运营资产都可移植。Nutrient 后来表示将统一使用
              Dash0，配合代码化仪表板、更深的告警集成和更广的追踪范围，这是具体但仅来自单一客户的扩张信号。Dash0 还称客户越来越多地通过 MCP 和 CLI
              接触数据，而不只是使用浏览器，暗示了额外的面向代理的使用面。该说法来自公司，不应被当作扩张收入或留存的独立证据。
