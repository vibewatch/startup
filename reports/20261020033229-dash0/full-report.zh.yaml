  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              当前建议是跟踪 / 继续研究，置信度中低，投资判断风险高，估值立场从偏高到未经验证不等。2026 年 3 月的一份报告称最新轮次为 $110 million，公开估值为 $1 billion；多个二手来源重复了约
              $155 million 的累计融资。这些事实证明了投资者需求和可观的资本基础，却不证明价格有支撑。留存的估值资料明确称本轮 EV/收入未披露，并只把一个含糊且未标日期的 ARR 数字归因于 YouTube
              采访。即使该 ARR 指标方向上正确，也只能支持公开估值与 ARR 比率的宽松上限，不能形成可辩护的入场倍数或目标回报。
