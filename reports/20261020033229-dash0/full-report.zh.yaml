            body: >-
              公开证据在获客和实施阶段最强，在部署之后最弱。留存的面向客户来源都没有披露净收入留存、毛收入留存、logo 流失、续约率、合同期限、客户层面的收入集中度或渠道结构。因此，600
              客户的报告不能证明客户持久性、平均合同价值、企业客户占比，或是否由少数大客户驱动经济性。公开推荐虽为正面，却由公司托管；单一详细客户案例也不能证明队列行为。投资尽调应要求客户和收入队列、续约与扩张瀑布、前 10
