        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              证据支持的是定性而非精算式的风险排序。最重要的暴露，是自主运营动作与公开保障证据不完整的结合：Dash0 称 Agent0
              能调查事故、起草修复，并在客户定义的护栏下运行触发式自动化；但指定来源集中没有监管机构、法院、认证、审计、事故历史或服务等级记录来检验这些控制。执行风险排在其次，因为 AutoMerge 仍被描述为即将推出，其他
              SignalControl 功能仍属未来，一份独立评测称 AI 功能较新且证据不足。留存和遥测经济性更容易观察：独立评测报告日志和追踪的留存期为 30
              天，并警告按记录计价可能惩罚嘈杂埋点。这些发现支持设置明确的试点、控制和披露门槛，而不是因为没有记录事故就假定没有发生事故。
