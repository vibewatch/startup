      - number: '3.3'
        title: 定价、可移植性与切换动态
        blocks:
          - type: paragraph
            body: >-
              Dash0
              描述的是按遥测信号计费的用量定价，不收取席位费；供应商比较则把替代方案放在主机数、数据摄入量、每核或模块化定价上。没有客户真实的遥测结构、留存、基数、折扣和支持需求，这些单位无法直接比较。OpenTelemetry
              让兼容目标能够接收 OTLP
              数据，降低了技术锁定，但切换并不会变得没有成本：仪表板、告警、查询语言、留存历史、事故流程和采购都需要迁移。自托管方案增加部署控制，却把存储和运营负担转给客户。因此，使用代表性工作负载做验证，比算标价更有决策价值。
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP010
              - CP011
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP008
              - CP009
              - CP010
              - CP016
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Dash0
              的开放标准架构是一道双刃剑护城河。它降低采用摩擦，支持可信的反锁定定位；但同样的可移植性，也会在其他厂商提供更广工作流、自托管或更合适计费单位时，让多厂商并用或迁移更容易。官方把范围扩展到可观测性之外，可能在编码、遥测和修复之间形成数据与工作流闭环，但其持久性取决于
              Agent0 的准确性、客户信任和可重复的商业胜利，而这些在此处没有披露。3 月的一篇竞争者文章称 Agent0 仍处于 beta、无法生成修复；Dash0 后来的材料则称其已普遍可用并能打开 pull
              request。这一按日期变化的矛盾，说明竞争矩阵在投资判断前必须用当前一手来源核实。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
