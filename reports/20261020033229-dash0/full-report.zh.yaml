    summary: 公开证据触及计费机制，但止步于实际收入、交付成本与毛利之前。
    data:
      nodes:
        - id: customer-activity
          label: 客户遥测与智能体活动
          detail: 日志、span、指标数据点、已存储遥测与 Agent0 运行都会产生可测量活动。
        - id: signal-control
          label: SignalControl 塑形
          detail: 过滤、转换、采样与汇总可以在计费前减少存储量。
        - id: billing-units
          label: 公开计费单位
          detail: 已发送和存储的遥测，以及基于额度的 Agent0 自动化，是已披露的计费机制。
        - id: realized-price
          label: 实际价格
          detail: 费率卡、折扣、承诺量、合同期限与超额用量均不可得。
        - id: recognized-revenue
          label: 确认收入
          detail: ARR、收入、增长、结构与收入确认政策均不可得。
        - id: gross-profit
          label: 毛利
          detail: 托管、推理、支持、服务交付成本与毛利率均不可得。
    approximationNotes: 这是证据可得性流程，不是量化转化漏斗或预测。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI013
      - CI014
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从信号生成到采集、存储、分析与智能体行动的公开描述层次，同时保留当前功能与路线图边界。
    data:
      layers:
        - label: 遥测生产者
          detail: 应用、基础设施、浏览器、LLM 与编码智能体产生运营和开发信号。
          modules:
            - 应用
            - Kubernetes 与云基础设施
            - 浏览器会话
            - AI 智能体
          outputs:
            - 追踪
            - 指标
            - 日志
            - 资源与事件
        - label: OpenTelemetry 采集
          detail: 标准 SDK、Collector 流水线与 Dash0 Kubernetes Operator 无需专有采集代理即可发送信号。
          modules:
            - OpenTelemetry SDK
            - OpenTelemetry Collector
            - Dash0 Kubernetes Operator
          outputs:
            - OTLP HTTP
            - OTLP gRPC
        - label: 区域采集
          detail: 经过认证的区域专属端点接收遥测，并按数据集进行路由。
          modules:
            - 区域入口
            - 授权令牌
            - 数据集标头
          outputs:
            - 已接收的遥测流
        - label: SignalControl
          detail: 存储前控制会过滤噪声，并被描述为对高容量信号进行转换、采样与汇总。
          modules:
            - 垃圾过滤器
            - 派生与转换
            - Trace 采样
            - 时间序列汇总
          outputs:
            - 减少后的保留信号量
        - label: SignalStore 与查询
          detail: Dash0 描述了一个共享的 OpenTelemetry 原生存储，配有人类与智能体接口。
          modules:
            - PromQL
            - SQL
            - 控制台
            - MCP
            - CLI
            - API
          outputs:
            - 关联后的生产环境上下文
        - label: 产品与行动界面
          detail: 可观测性、Agent0 与 Darkplane 消费共享上下文；部分自动化与治理功能仍属于路线图项目。
          modules:
            - 可观测性
            - Agent0
            - Agent0 自动化
            - Darkplane
          outputs:
            - 调查
            - 告警
            - 修复草案
            - AI 开发治理
    approximationNotes: 这是公开产品主张的概念图，不是经核验的内部系统图；来源描述同时包含当前组件与路线图组件。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE009
      - CE011
  - id: FU001
    title: 已记录的 Nutrient 采用历程
    type: journey-map
    summary: 一位客户从可移植的 OpenTelemetry 埋点到生产迁移及计划扩展的路径，同时保留了不可移植的工作。
    data:
      nodes:
        - label: 可移植基线
          detail: 应用已经通过本地管理的 OpenTelemetry Collector 发出 OTLP。
          touchpoints:
            - OpenTelemetry SDKs
            - Local collectors
            - Terraform and GitOps
        - label: 评估与审查
          detail: 团队决定离开原供应商后评估了替代方案，并完成合规审查。
          touchpoints:
            - Vendor evaluation
            - Compliance review
            - Cost modeling
        - label: 导出器变更
          detail: Collector 端点与凭据发生变化，无需重新部署应用。
          touchpoints:
            - Collector configuration
            - Credentials
            - Environment rollout
        - label: 首批服务
          detail: 首批服务在 2026 年 5 月中旬前后将遥测发送至 Dash0。
          touchpoints:
            - Kubernetes
            - ECS
            - CDN and CI
        - label: 不可移植部分重建
          detail: 团队重建了仪表盘，重新创建并调校告警，也重新熟悉了查询习惯。
          touchpoints:
            - Dashboards
            - Alert rules
            - Query language
        - label: 整合与扩展
          detail: 原账户于 6 月 9 日关闭，计划扩大追踪范围并深化告警。
          touchpoints:
            - Account closure
            - Wider tracing
            - Deeper alerting
    approximationNotes: 这是一个客户的来源报道流程，不代表一般转化漏斗，也不是实施时长基准。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 对有证据支持的风险与证据缺口风险进行定性排序；单元格是判断，不是测量得到的概率或损失估计。
    data:
      columns:
        - label: 可能性
          detail: 基于指定公开证据的定性判断；证据缺失处保留未知。
        - label: 影响
          detail: 潜在的投资或客户后果，而非量化损失金额。
        - label: 缓解成熟度
          detail: 区分公司声称的控制措施与独立证明的控制措施。
        - label: 剩余风险
          detail: 在指定证据可见的缓解措施之后仍剩余的敞口。
      rows:
        - label: 自主行动治理
          note: 资料描述了护栏与拉取请求工作流，但没有独立控制测试。
          values:
