            body: >-
              TNW 和 Balderton 都报道称 Dash0 在 2026 年 3 月拥有超过 600 个付费客户。TNW 还报道称 2025 年 10 月 Series A 时有 270
              个客户，意味着约五个月内翻了一倍以上。这是有用的商业速度信号，但不能证明 ARR、平均合同价值、扩张、流失、客户集中度或销售效率。一份未标日期的 Beatable 资料称 Dash0 服务超过 800
              个客户，带来的是新鲜度和口径问题，而不是干净的当前指标：留存页面没有说明该数字是付费客户、账户还是其他群体。要把客户增长转化为持久的经常性收入或高效的市场进入动作，仍需要管理层报告。
            claimRefs:
              - CI007
              - CI008
              - CI016
      - number: '4.3'
        title: 成本结构与单位经济缺口
        blocks:
          - type: paragraph
            body: >-
              公开产品架构指出了可能的经济驱动因素，却没有给出财务数值。SignalControl 在存储前过滤、转换、采样和汇总遥测；Dash0 描述过一条示例管道，可把日志、指标和 span 量减少
              74%。这可能改善客户账单控制和 Dash0
              的存储效率，但示例性技术结果不是公司毛利率的证据。由于计费与遥测、保留存储和代理积分挂钩，基础设施消耗和代理推理可能是变动成本驱动项，而支持、工程和企业销售会增加运营费用。留存来源没有量化托管成本、服务交付人力、资本开支、毛利率、CAC、回本期或留存，因此单位经济的方向和可扩展性仍未经验证。
