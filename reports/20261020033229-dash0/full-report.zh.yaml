        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Mirko Novakovic 曾共同创办 Instana，具备直接的可观测性经验；IBM 于 2020 年收购 Instana。公开资料还将 Ben Blackmore
              列为联合创始人，Series B 公告则称 Balderton 合伙人 Rana Yared
              加入董事会。这说明创始人与市场的匹配度，但公开记录仍不足以评估决策权、独立董事覆盖、继任规划，或创始人以下的职责分配。留存的公司材料中，Novakovic
              也是被引用最多的战略发言人，因此管理层深度和关键人韧性应列为尽调重点，而非既成弱点。管理层材料应提供完整董事会、管理层名单、归属安排和继任框架。
