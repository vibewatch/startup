evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Full executive and board roster, committee structure, voting rights, founder vesting, succession plan, and
      investor protective provisions.
    whyItMatters: >-
      Public founder credentials and one board appointment do not establish governance quality, control allocation, or
      resilience to key-person loss.
    diligencePath: >-
      Obtain the current cap table, charter, voting agreements, board minutes, committee charters, executive roster, and
      succession plan from management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Current ARR, GAAP revenue, growth, gross margin, net retention, cash, burn, runway, customer concentration, and
      ACV distribution.
    whyItMatters: >-
      Funding raised, valuation, and customer count cannot establish revenue quality, capital efficiency, or the
      durability of commercial traction.
    diligencePath: >-
      Request audited financials, monthly management accounts, bank statements, ARR and customer cohort bridges, and the
      latest board-approved plan.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A current payroll-backed employee count reconciled to the public profile's incompatible January, March, and April
      2026 figures.
    whyItMatters: >-
      Headcount informs burn, organizational scale, hiring velocity, and the credibility of operating-leverage
      assumptions.
    diligencePath: >-
      Obtain an anonymized payroll roster by function, geography, start date, and employment status, then reconcile
      contractors and acquired teams.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: company-specific-sizing
    missingEvidence: >-
      Independent segment-level spend, target-account counts, telemetry volumes, realized pricing, conversion, and
      retention evidence for Dash0's reachable market.
    whyItMatters: >-
      Without these inputs, a broad observability estimate cannot be translated into a defensible company-specific TAM,
      SAM, SOM, or valuation growth case.
    diligencePath: >-
      Obtain management's account-level pipeline and customer cohort export, reconcile it to invoiced telemetry volumes
      and net pricing, and benchmark the resulting segments against an independent observability market study.
    relatedQuestionRefs:
      - QM003
  - type: private-evidence-only
    severity: material
    topic: buyer-budget
    missingEvidence: >-
      Procurement records identifying the economic buyer, budget source, sales cycle, win rate, and migration cost by
      customer segment.
    whyItMatters: >-
      Product positioning identifies users but does not establish who controls budget or how quickly technical interest
      converts into durable spend.
    diligencePath: >-
      Review a representative sample of signed order forms, CRM opportunities, lost deals, implementation plans, and
      customer references by segment.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM007
  - type: missing-source
    severity: material
    topic: competitive-performance
    missingEvidence: >-
      Independent win-loss data, customer retention by cohort, standardized pricing outcomes, migration completion
      rates, and task-level Agent0 benchmarks.
    whyItMatters: Without outcome evidence, differentiation and moat durability cannot be separated from vendor positioning.
    diligencePath: >-
      Review management win-loss records and cohort data, then run reference calls and a representative
      telemetry-and-incident bake-off.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: conflicting-data
    severity: material
    topic: evidence-conflict
    missingEvidence: >-
      A dated release record and independent production validation of Agent0's current general-availability
      capabilities.
    whyItMatters: >-
      The assigned sources disagree on maturity and remediation, making older comparison pages unsafe as current product
      evidence.
    diligencePath: >-
      Obtain release notes, customer references, and production success and rollback rates for autonomous investigations
      and pull-request generation.
    relatedQuestionRefs:
      - QP008
      - QP010
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Like-for-like customer quotes using identical ingest, cardinality, retention, support, deployment, and discount
      assumptions.
    whyItMatters: >-
      Vendor charging units differ, so public list-price examples do not establish realized total cost or gross-margin
      advantage.
    diligencePath: >-
      Issue a common workload specification to shortlisted vendors and compare signed quotes plus customer operating
      costs.
    relatedQuestionRefs:
      - QP005
      - QP010
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: ARR, revenue growth, gross margin, CAC, payback, sales cycle, and channel economics.
    whyItMatters: Without these metrics, customer growth cannot be converted into a view on revenue quality or efficient scaling.
    diligencePath: >-
      Obtain audited monthly financials, an ARR bridge, product and cohort margins, and fully loaded acquisition
      economics from management.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Post-close cash, monthly burn, debt, working-capital needs, acquisition obligations, downside plan, and runway.
    whyItMatters: The financing amount alone does not establish liquidity, capital intensity, or the next-round trigger.
    diligencePath: >-
      Review the latest balance sheet, cash-flow forecast, debt schedule, acquisition commitments, and monthly downside
      runway.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current rate card, enterprise minimums, discounts, overages, contract duration, committed spend, and
      revenue-recognition policy.
    whyItMatters: Public billing units do not reveal realized price, predictability, or revenue quality.
    diligencePath: Sample customer contracts and invoices across cohorts and reconcile them to the revenue ledger.
    relatedQuestionRefs:
      - QI002
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
  - type: conflicting-data
    severity: material
    topic: customers
    missingEvidence: >-
      A dated reconciliation of paying customers, active production accounts, logos, ACV distribution, churn, and
      concentration.
    whyItMatters: >-
      The 600 and 800-plus public figures may reflect different dates or definitions and cannot support a current
      revenue estimate.
    diligencePath: Obtain quarterly customer-count definitions, logo cohorts, billed-account exports, and top-customer concentration.
    relatedQuestionRefs:
      - QI005
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-and-reliability
    missingEvidence: >-
      Independent uptime history, incident data, recovery objectives, security attestations, privacy controls, and
      data-retention terms.
    whyItMatters: >-
      Enterprise adoption and safe production operation depend on controls that product descriptions and integration
      guides do not validate.
    diligencePath: >-
      Request the current SOC 2 report, penetration-test summary, DPA, subprocessors, status history, incident
      postmortems, SLOs, RTO, and RPO.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: Agent0
    missingEvidence: Production accuracy, escalation, accepted-fix, rollback, and false-action rates for Agent0 and Automations.
    whyItMatters: >-
      Autonomous investigation and code changes can create operational or security risk if guardrails and quality are
      not measured.
    diligencePath: >-
      Review sampled production runs, approval policies, audit logs, benchmark methodology, customer references, and
      rollback tests.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: roadmap
    missingEvidence: Committed delivery dates and production evidence for AutoMerge and the roadmap portions of SignalControl.
    whyItMatters: >-
      The suite thesis depends partly on functions that official materials distinguish from currently shipping
      capabilities.
    diligencePath: >-
      Obtain the product roadmap, release criteria, design-partner usage, launch dates, and contractual availability
      commitments.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: customer-economics-gap
    missingEvidence: >-
      Cohort-level NRR, GRR, logo churn, renewal and expansion rates, contract duration, top-10 revenue concentration,
      customer ACV distribution, and channel-sourced revenue.
    whyItMatters: >-
      Without these metrics, public customer counts and testimonials cannot establish revenue durability,
      land-and-expand performance, or concentration risk.
    diligencePath: >-
      Request monthly and annual customer and revenue cohorts, renewal waterfalls, contracts, top-customer schedules,
      and channel-attribution reports; reconcile them to billing records.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A complete current customer roster with production-versus-pilot status, use case, deployment size, contract date,
      and independently verified outcome.
    whyItMatters: Public logos and directory mentions do not show which accounts are active, material, or in production.
    diligencePath: >-
      Obtain the CRM customer export and reference list, then sample recent wins, renewals, pilots, and losses for
      direct customer calls.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-count-methodology
    missingEvidence: A dated primary-source definition and reconciliation for the reported 600-plus customers.
    whyItMatters: >-
      Independent directories repeat a similar count but do not disclose whether it includes trials, pilots,
      subsidiaries, churned accounts, or only paying production customers.
    diligencePath: >-
      Request a management-certified customer-count bridge by quarter with definitions for paying, active, production,
      pilot, trial, and churned accounts.
  - type: enumeration-incomplete
    severity: material
    topic: legal-security-assurance
    missingEvidence: >-
      Current SOC and ISO scope, bridge letters, penetration tests, DPA and subprocessor records, privacy assessments,
      regulatory correspondence, litigation and claims schedules, cyber insurance, incident history, and
      autonomous-action control evidence.
    whyItMatters: >-
      Without these materials, likelihood and mitigation maturity for the chapter's highest-impact governance, privacy,
      security, and legal risks cannot be verified.
    diligencePath: >-
      Obtain the current assurance package and legal schedules, interview the security and legal owners, and run a
      witnessed control test covering RBAC, approvals, logs, rollback, and data export.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited or board-quality ARR bridge, gross margin, burn, cash, runway, working capital, customer concentration,
      GRR, NRR, ACV distribution, and acquired-versus-organic growth.
    whyItMatters: >-
      Funding raised is not cash available, customer count is not revenue quality, and the public record cannot
      establish whether Dash0 can fund its expanded roadmap or absorb churn.
    diligencePath: >-
      Review monthly financials, bank balances, board forecasts, cohort and concentration exports, acquisition
      contribution, debt and preference terms, and the hiring plan against runway.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: operating-reliability
    missingEvidence: >-
      Independently verifiable uptime history, material incident and root-cause records, SLA performance,
      disaster-recovery tests, capacity benchmarks, support response data, and cloud or infrastructure concentration.
    whyItMatters: >-
      Product claims and customer testimonials do not establish production reliability, recovery performance, or the
      probability and impact of a platform outage.
    diligencePath: >-
      Review status and incident exports, SLA credits, postmortems, architecture and dependency maps, disaster-recovery
      results, and a production-scale load and failover test.
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Dated primary evidence for ARR, recognized revenue, growth, gross margin, net retention, ACV distribution,
      customer concentration, burn, cash, and runway.
    whyItMatters: >-
      These inputs determine whether the headline valuation can support target returns and whether customer growth is
      economically durable.
    diligencePath: >-
      Obtain audited or board-approved financial statements, monthly KPI bridges, and customer-cohort schedules;
      reconcile each metric to source systems.
    relatedQuestionRefs:
      - QV002
      - QV006
      - QV008
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Current cap table, option pool, liquidation preferences, participation rights, anti-dilution protections, debt,
      and acquisition obligations.
    whyItMatters: Headline post-money valuation does not reveal dilution, preference overhang, or common-equity downside.
    diligencePath: >-
      Review executed financing documents, the fully diluted cap table, debt agreements, and acquisition consideration
