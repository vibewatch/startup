callouts:
  - calloutType: risk
    title: Headline valuation is not an underwriting multiple
    body: >-
      The $1 billion mark is well corroborated as a financing fact, but the retained
      evidence does not provide the dated, exact ARR or enterprise-value bridge needed
      to convert it into a reliable revenue multiple.
    claimRefs: [CV002, CV007, CV008, CV009, CV010]
  - calloutType: recommendation
    title: Upgrade only after primary metric and term verification
    body: >-
      The recommendation can improve if data-room evidence validates revenue quality,
      customer cohorts, capital efficiency, and financing terms while preserving
      venture-scale return headroom at the proposed entry price.
    claimRefs: [CV006, CV014, CV016]
