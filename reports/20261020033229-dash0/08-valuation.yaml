    notes: "Views are analyst judgments based on the retained public sources; no audited financial statements or financing documents were available."
    claimRefs: [CV001, CV002, CV003, CV007, CV008, CV009, CV010, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-supported argument
      - Counterweight
      - What would change the view
    rows:
      - [Product, "OpenTelemetry-native platform with Agent0 and an expanding control-plane roadmap", "Roadmap breadth increases delivery risk", "Referenceable production outcomes and roadmap delivery"]
      - [Customers, "Company reported 270+ customers in 2025; independent profiles later report 600+", "No ACV, retention, or concentration disclosure", "Cohort-level ARR, churn, and concentration data"]
      - [Competition, "Open standards and claimed transparent pricing can lower switching friction", "A review cites incumbent maturity and a much larger integration ecosystem", "Measured win rates and displacement economics"]
      - [Valuation, "Large round provides resources for product and market expansion", "Headline price lacks a disclosed round revenue multiple", "Verified metrics that support target returns at the entry price"]
    notes: "Customer figures and product advantages are reported or company-claimed; they are not substitutes for audited revenue-quality evidence."
    claimRefs: [CV003, CV005, CV006, CV011, CV012, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Assumptions
      - Valuation and return logic
      - Probability signal
      - Downside or thesis-break trigger
    rows:
      - [Bull, "Verified ARR materially above the secondary floor; durable growth, retention, and enterprise wins", "Current $1B mark becomes supportable only if verified forward economics offer venture-scale return headroom", "Primary cohort data and repeatable competitive wins", "Growth or retention misses despite product expansion"]
      - [Base, "Customer momentum continues but revenue quality and terms remain private", "No precise range is supportable; defer entry or negotiate price and protections after diligence", "Metrics reconcile but do not demonstrate premium economics", "Round terms or burn make expected returns unattractive"]
      - [Bear, "Adoption does not convert into durable ARR; incumbent maturity and execution breadth weigh on outcomes", "Down-round, preference overhang, or prolonged illiquidity can impair common-equity returns", "Weak cohorts, high concentration, or delayed roadmap proof", "Material churn, failed enterprise expansion, or financing stress"]
    notes: "Cases are conditional frameworks, not probability-weighted forecasts; missing ARR precision, cash-flow data, and financing terms prevent numeric valuation ranges."
    claimRefs: [CV002, CV006, CV007, CV008, CV009, CV010, CV014, CV015]
