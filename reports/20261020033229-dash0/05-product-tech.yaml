      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: roadmap
      missingEvidence: Committed delivery dates and production evidence for AutoMerge and the roadmap portions of SignalControl.
      whyItMatters: The suite thesis depends partly on functions that official materials distinguish from currently shipping capabilities.
