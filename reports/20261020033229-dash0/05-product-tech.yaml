      - Current workflow
      - Dash0 solution
      - Measurable benefit evidence
      - Limitation
    rows:
      - [Instrument and ingest telemetry, Configure SDK Collector or Kubernetes Operator and OTLP endpoint, Standard OTLP ingestion into regional Dash0 endpoints, Partner guides confirm concrete protocols and configuration, No assigned benchmark measures setup time or migration effort]
      - [Investigate a production issue, Correlate frontend backend infrastructure and telemetry signals, Unified observability plus Triage and Agent0, Independent reporting describes contextual triage behavior, No public accuracy MTTR or accepted-fix denominator]
      - [Control telemetry cost and volume, Filter sample convert or roll up signals before storage, SignalControl pipeline and count-based pricing model, Company materials describe pre-storage controls and transparent units, Savings and signal-loss tradeoffs lack independent benchmarks]
      - [Govern AI-assisted development, Reconcile coding-agent usage cost and output with repository activity, Darkplane AI Coding Insights and planned AutoMerge, Official roadmap identifies shipping and coming components, No external proof of policy quality or development outcomes]
    notes: >-
      Benefits are qualitative unless a retained source provides a denominator; missing
      performance, savings, and accuracy measures are intentionally shown as gaps.
    claimRefs: [CE003, CE004, CE005, CE007, CE008, CE009, CE011]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Publicly supported mechanism
      - Dependency
      - Principal risk
    rows:
      - [Telemetry producers, Generate application infrastructure browser and AI-agent signals, OpenTelemetry-compatible instrumentation, SDK Collector Operator and correct semantic conventions, Incomplete or inconsistent instrumentation]
      - [Ingestion boundary, Receive traces metrics and logs, Regional OTLP HTTP or gRPC endpoints with authorization, Dash0 ingress availability credentials and network path, Endpoint or authentication failure]
      - [SignalControl, Shape data before storage, Filtering conversion sampling and time-series rollups, Rule quality and staged feature availability, Useful-signal loss or roadmap slippage]
      - [SignalStore and query layer, Store and expose shared production context, Company-described PromQL SQL console MCP CLI and API access, Dash0 backend schemas access controls and retention, Portability above raw telemetry is unproven]
      - [Application surfaces, Observe govern and act on signals, Observability Darkplane Agent0 and Automations, Correlation models guardrails and product integrations, Incorrect autonomous diagnosis or action]
    notes: >-
      The architecture is reconstructed only from retained public documentation and
      partner integration guides; internal implementation, service levels, and control
      effectiveness remain unverified.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE008, CE009]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly described layers from signal generation through ingestion, storage,
      analysis, and agentic action, with current and roadmap boundaries preserved.
    data:
      layers:
        - label: Telemetry producers
          detail: Applications, infrastructure, browsers, LLMs, and coding agents create operational and development signals.
          modules: [Applications, Kubernetes and cloud infrastructure, Browser sessions, AI agents]
          outputs: [Traces, Metrics, Logs, Resources and events]
        - label: OpenTelemetry collection
          detail: Standard SDKs, Collector pipelines, and the Dash0 Kubernetes Operator send signals without a proprietary collection agent.
          modules: [OpenTelemetry SDKs, OpenTelemetry Collector, Dash0 Kubernetes Operator]
          outputs: [OTLP HTTP, OTLP gRPC]
        - label: Regional ingestion
          detail: Authenticated region-specific endpoints receive telemetry and route it by dataset.
          modules: [Regional ingress, Authorization token, Dataset header]
          outputs: [Accepted telemetry streams]
        - label: SignalControl
          detail: Pre-storage controls filter noise and are described as converting, sampling, and rolling up high-volume signals.
          modules: [Spam Filter, Derive and Convert, Trace sampling, Time-series rollups]
          outputs: [Reduced retained signal volume]
        - label: SignalStore and query
          detail: Dash0 describes a shared OpenTelemetry-native store with human and agent interfaces.
          modules: [PromQL, SQL, Console, MCP, CLI, API]
          outputs: [Correlated production context]
        - label: Product and action surfaces
          detail: Observability, Agent0, and Darkplane consume shared context; some automation and governance functions are roadmap items.
          modules: [Observability, Agent0, Agent0 Automations, Darkplane]
          outputs: [Investigation, Alerts, Draft fixes, AI-development governance]
    approximationNotes: >-
      This is a conceptual map of public product claims, not a verified internal system
      diagram; current and roadmap components coexist in the source descriptions.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE008, CE009, CE011]
