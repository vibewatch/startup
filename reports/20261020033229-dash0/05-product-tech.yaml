      diligencePath: Request the current SOC 2 report, penetration-test summary, DPA, subprocessors, status history, incident postmortems, SLOs, RTO, and RPO.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: Agent0
      missingEvidence: Production accuracy, escalation, accepted-fix, rollback, and false-action rates for Agent0 and Automations.
