  topStrengths:
    - >-
      Real multi-vertical customer proof with concrete operational outcomes across fintech, insurance, nonprofit,
      pharma, and cloud software environments.
    - Strong product positioning around Workbench, integration breadth, and cloud-centric co-managed MDR workflows.
    - Valuation anchor that is plausible relative to public cyber comp dispersion rather than obviously stretched.
