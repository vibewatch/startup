  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: proprietary detection depth
    missingEvidence: Detection-content architecture, tuning quality metrics, false-positive rates, and efficacy benchmarks.
    whyItMatters: Integration breadth alone does not prove durable technical differentiation or superior outcome quality.
    diligencePath: Request engineering/product review, efficacy metrics, and customer benchmark data.
    relatedQuestionRefs:
    - QE019
    - QE025
  - type: private-evidence-only
    severity: material
    topic: roadmap and SIEM adjacency
    missingEvidence: Roadmap, release cadence, and quantified win-loss evidence around managed-SIEM objections.
    whyItMatters: A recurring SIEM gap could materially weaken the platform’s long-term wedge.
    diligencePath: Request product roadmap, release logs, and competitor-specific loss reasons.
    relatedQuestionRefs:
    - QE018
    - QE020
    - QE025
  - type: private-evidence-only
    severity: minor
    topic: platform reliability
    missingEvidence: Uptime, SLA, incident history, and regional support-operating metrics.
    whyItMatters: Enterprise trust requires more than case studies and reviews.
    diligencePath: Request SLA documents, platform reliability metrics, and service postmortem history.
    relatedQuestionRefs:
    - QE025
