- id: TE005
  title: Roadmap / release / development-stage table
  columns:
  - area
  - current public state
  - next likely maturation question
  - evidence status
  - diligence ask
  rows:
  - - Managed SIEM / log storage adjacency
    - Peer review suggests a gap or partner dependence
    - Will Expel build, bundle, or partner more deeply?
    - Publicly partial / adverse
    - Request roadmap and win-loss evidence around SIEM objections.
  - - Vulnerability prioritization
    - Publicly launched / promoted adjacency
    - Is it a wedge, attach feature, or material revenue product?
    - Publicly partial
    - Request customer count, pricing, and expansion metrics.
  - - Phishing defense
    - Public service exists
    - How deeply automated and differentiated is it?
    - Publicly partial
    - Request workflow diagrams and attach rate.
  - - Cloud-native coverage breadth
    - Many setup guides and customer stories
    - How quickly are new cloud services and detections added?
    - Publicly strong on breadth, partial on depth
    - Request release cadence and detection-content roadmap.
  - - International / enterprise scale operations
    - Funding uses cite international expansion
    - Can support quality and detection efficacy scale globally?
    - Publicly partial
    - Request regional delivery model, staffing, and response SLAs.
  notes: Roadmap assessment is necessarily partial because public product-release telemetry is limited.
