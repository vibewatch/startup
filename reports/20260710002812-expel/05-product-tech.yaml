callouts:
- calloutType: strength
  title: The technical wedge is operational integration, not a single sensor
  body: Public evidence consistently supports the idea that Expel’s value comes from stitching many external tools into a coherent analyst workflow. That makes the platform attractive where customers already own a heterogeneous security stack and want leverage rather than replacement.
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE014
  - CE026
- calloutType: risk
  title: Adjacent functionality may decide whether the platform stays differentiated
  body: The biggest technical risk in the retained public evidence is not failure of core MDR; it is whether category convergence around logging, SIEM, and broader platform ownership erodes the integration-led wedge. The PeerSpot managed-SIEM critique is the clearest outward sign of that risk.
  claimRefs:
  - CE024
  - CE029
  - CE030
  - CE031
  - CE035
