chapter:
  number: 5
  title: Product & Technology
  summary: Expel delivers a software-enabled security-operations service anchored by its Workbench platform, broad third-party integrations, and analyst-led response workflows rather than a closed endpoint-only product. The product and technical story is strongest in cloud, identity, and mixed-tool environments; the main technical diligence gaps concern roadmap depth, proprietary-IP defensibility, and how far the current platform closes adjacent needs such as managed SIEM and log retention.
sections:
- id: product-scope
  title: What Expel actually delivers
  body: 'Expel’s product should be understood as an operating system for managed detection and response rather than a single point tool. Official pages show the company packaging coverage for endpoint, cloud, SaaS, phishing, and vulnerability prioritization workflows, all tied together in Workbench. The service definition matters because buyers are not only purchasing software—they are purchasing analyst judgment, response operations, and automation on top of existing telemetry. Public product pages repeatedly emphasize that Expel uses customer tools and signals already in place instead of demanding a full rip-and-replace deployment. That makes the delivered asset a combination of integration layer, workflow UI, detection content, investigation routines, and human operating model. It also explains why the product catalog looks broader than a simple MDR SKU list: each package or add-on expands the surface area Workbench can monitor or act on. The technical underwriting question is therefore
    not “does Expel have an agent?” but “how effectively can Workbench normalize, prioritize, investigate, and coordinate action across many environments?”'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  tableRefs:
  - TE001
  - TE002
