- id: architecture-and-deployment
  title: Architecture, integrations, and deployment mechanics
  body: The strongest public evidence in this chapter comes from setup documentation. Expel publishes support material for Microsoft 365, Microsoft 365 Defender, AWS CloudTrail, AWS GuardDuty, Azure Monitor, AKS, Google Cloud Platform, Google SecOps, and Splunk, among others. That documentation demonstrates that the technical model is integration-heavy, API-heavy, and highly dependent on reliable telemetry ingestion from customer-owned systems. Workbench materials say the company supports more than 160 integrations, which fits the picture painted by the setup library. This architecture has two important implications. First, deployment can be relatively fast because the product plugs into existing tools instead of replacing them. Second, the platform’s value depends on breadth and depth of integrations, signal quality, and the company’s ability to maintain these connections as cloud and security vendors evolve. In technical terms, Expel’s moat is likely less about exclusive raw telemetry
    and more about normalization, orchestration, analyst workflow, and accumulated operational know-how on top of a large integration graph.
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  tableRefs:
