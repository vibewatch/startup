- id: TE004
  title: Trust / quality / compliance table
  columns:
  - dimension
  - public signal
  - why it matters
  - remaining gap
  rows:
  - - Analyst recognition
    - IDC and Forrester landing pages highlight positive MDR analyst assessment
    - Suggests execution maturity and buyer credibility
    - Not equivalent to source code, security, or uptime disclosure.
  - - Customer outcome proof
    - Qlik, Better, Dayton, and Affirm stories show production use
    - Indicates workflow fit beyond slideware
    - Case studies are positive-selected and not full diligence evidence.
  - - Operational transparency
    - Workbench and review commentary emphasize visible workflow and easy-to-use interface
    - Transparency can reduce black-box SOC concern
    - No detailed public SLA / uptime / reliability report retained.
  - - Integration breadth
    - 160+ integrations plus many setup guides
    - Suggests product maturity and maintenance discipline
    - No public breakdown of most-used vs long-tail integrations.
  - - Security and compliance depth
    - Cloud and regulated-customer evidence imply baseline trustworthiness
    - Important for enterprise adoption
    - Detailed public security architecture and compliance mappings remain limited in retained sources.
  notes: Trust signals are real but mostly indirect; deeper diligence should request architecture, SLA, and control documentation.
