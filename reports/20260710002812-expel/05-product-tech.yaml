  - - Detection, triage, and response playbooks
    - Convert raw signals into action
    - Service descriptions and customer outcomes
    - Analyst operations plus automation quality
    - Public sources do not quantify false-positive or tuning performance.
  - - Cloud / identity / log-source onboarding
    - Connect customer estate quickly
    - AWS, Azure, GCP, M365, Splunk setup docs
    - Customer admin access and telemetry quality
    - Onboarding speed depends on customer readiness and permissions.
  - - Partner telemetry ecosystem
    - Expands visibility without owning every sensor
    - Official package and setup breadth
    - Health of partner ecosystem
    - Platform value is partly dependent on vendors Expel does not control.
