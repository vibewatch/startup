    - Extends MDR into user-focused threat workflows
    - Need attach-rate and evidence of technical differentiation versus email-native tools.
  - - Vulnerability prioritization
    - Security operations and vulnerability teams
    - Newer adjacency
    - Connects exposure data with analyst prioritization and action
    - Need pricing, adoption, and roadmap evidence.
