company:
  name: Expel
chapter:
  number: 2
  title: Market Analysis
  summary: Expel sells into a mature but still fast-growing MDR market where buyers increasingly want 24x7 threat monitoring, response authority, and cloud/identity coverage without building a full internal SOC. Public market estimates differ, but multiple sources agree that the category is growing at roughly low-20s CAGR, with demand driven by talent shortages, attack complexity, regulation, and cloud sprawl, while cost, data-sovereignty, and incumbent-platform competition constrain adoption.
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: Managed detection and response is not identical to the entire cybersecurity market. Public market guides and competitor materials consistently define MDR as a human-led, continuously operated service layer that combines monitoring, detection, investigation, and response across customer environments. That boundary matters for Expel because the relevant spend is closer to outsourced or co-managed security operations budgets than to total security software spend. The practical substitutes are internal SOC teams, legacy MSSPs, point-tool combinations such as SIEM plus EDR plus managed EDR, and broader platform vendors that bundle managed response into larger suites. CyberProof’s 2026 MDR market map and Gartner-oriented guidance both stress that a true MDR provider is differentiated by human-led operations and actionable findings rather than tool-only monitoring. Expel’s own materials line up with that definition by emphasizing transparency, integrations, and analyst-led remediation.
    The result is a market that is narrower than generic “cybersecurity,” broader than endpoint-only managed EDR, and increasingly converging toward MXDR-style coverage across cloud, identity, endpoint, email, and network surfaces.
  claimRefs:
  - CM001
  - CM002
  - CM015
  - CM033
  - CM035
  tableRefs:
  - TM001
  figureRefs:
  - FM003
- id: market-size-and-segment-lenses
  title: Sizing the arena with multiple lenses
  body: Open-market sizing estimates are directionally consistent but not identical. Mordor Intelligence estimates the MDR market at $4.19 billion in 2025, $5.09 billion in 2026, and $13.45 billion by 2031, implying a 21.45% CAGR. MarketsandMarkets publishes a larger 2026 starting point of $6.22 billion and a 2031 forecast of $17.64 billion, or 23.2% CAGR. ResearchAndMarkets and CyberProof both reinforce that the category now covers more than classic endpoint monitoring, which helps explain why different publishers produce different totals. For Expel, the most useful lens is not a single TAM number but the bracket created by those estimates plus public evidence on geography and vertical mix. Mordor says North America held 45.78% of 2025 revenue and BFSI held 28.74%, while healthcare is among the fastest-growing verticals. Combining those market lenses with GetLatka’s 2025 Expel revenue estimate of $142.2 million implies only low-single-digit share of the global MDR market, suggesting room
    to grow even if the exact denominator is noisy. At the same time, public evidence is not detailed enough to isolate Expel’s precise SAM or SOM by segment, region, or customer size.
  claimRefs:
