callouts:
- calloutType: strength
  title: Category growth is structural, not just cyclical
  body: 'The public evidence lines up on the main point even when exact market books disagree: organizations are outsourcing more threat detection and response work because attack complexity, cloud sprawl, talent shortages, and compliance pressure are not going away. That structural demand backdrop supports durable interest in Expel’s model.'
  claimRefs:
  - CM004
  - CM005
  - CM016
  - CM018
  - CM019
  - CM037
- calloutType: risk
  title: A growing market does not eliminate packaging and platform pressure
  body: MDR may be expanding at a low-20s CAGR, but adoption is still constrained by price sensitivity, sovereignty requirements, incumbent suites, and buyer preferences for integrated log-management or broader bundled platforms. Expel still has to win competitively, not just show up in a good category.
  claimRefs:
  - CM020
  - CM021
  - CM026
  - CM027
  - CM028
  - CM031
