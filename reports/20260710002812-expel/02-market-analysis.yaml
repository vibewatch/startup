- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver / constraint
  - direction
  - timing
  - implication for adoption
  - diligence ask
  rows:
  - - Cyberattack sophistication and AI-enabled threats
    - driver
    - current
    - Pushes buyers toward 24x7 detection and faster response
    - Ask how much of Expel pipeline is driven by cloud/identity attack concerns.
  - - Cybersecurity talent shortage and SOC burnout
    - driver
    - current
    - Makes outsourced or co-managed coverage economically attractive
    - Request win/loss reasons versus internal-build alternatives.
  - - Regulatory and compliance pressure
    - driver
    - current to medium term
    - Expands MDR demand in regulated verticals such as finance and healthcare
    - Test whether Expel sees stronger conversion in regulated segments.
  - - Cyber-insurance and board pressure for outcomes
    - driver
    - current
    - Rewards vendors that can show measurable response improvements
    - Request customer proof around insurer or board-driven purchases.
  - - High total cost of ownership for SMEs
    - constraint
    - current
    - Can shrink the bottom end of the addressable market
    - Clarify lowest-ACV package economics and support burden.
  - - Data sovereignty and telemetry localization
    - constraint
    - current to medium term
    - Can complicate multi-region delivery and cross-border scaling
    - Ask management how EMEA delivery and data handling are structured.
  - - Incumbent platform bundles and suite competition
    - constraint
    - current
    - Raises switching costs and puts pressure on standalone vendors
    - Review win rates against CrowdStrike, Rapid7, Sophos, and Arctic Wolf.
  - - Managed-SIEM expectations in some evaluations
    - constraint
    - current
    - Can create feature-fit gaps in certain RFPs
    - Ask where Expel loses deals due to SIEM or log-retention expectations.
  notes: Constraints are not thesis-killers, but they show where category growth may not translate evenly into Expel bookings.
