  rows:
  - - Cloud-native enterprise
    - Security architect or SecOps manager
    - Internal SOC and cloud teams
    - CISO / security operations budget
    - Need 24x7 cloud and identity coverage without rip-and-replace
    - Qlik story shows Kubernetes and API credibility matter.
  - - Lean regulated healthcare / public-interest org
    - CISO / CIO
    - Small security team
    - CIO/CISO with compliance pressure
    - Need round-the-clock coverage despite lean staff
    - Dayton story shows healthcare response-time pain point.
  - - Mid-market multi-tool environment
    - Head of security or IT security manager
    - Security analysts
    - Security budget with procurement review
    - Need faster time-to-value and analyst augmentation
    - Expel’s bring-your-own-tool model reduces migration friction.
  - - Board-sensitive enterprise buyer
    - CISO and procurement
    - Security leadership
    - Security + finance
    - Need measurable outcomes, transparent reporting, and response authority
    - Official materials stress audit trail and visible homework.
  - - Cost-sensitive smaller buyer
    - IT manager or outsourced provider
    - Generalist team
    - IT/security shared budget
    - Need MDR but face quote sensitivity and packaging scrutiny
    - TrustRadius pricing and peer reviews suggest affordability can still be a filter.
  notes: The buyer map synthesizes official customer stories, Gartner criteria, pricing pages, and peer review commentary.
