tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance to Expel
  rows:
  - - Core MDR
    - 24x7 monitoring, detection, investigation, response, and analyst-led remediation
    - Standalone software sold without service operations
    - CISO, SecOps leader, or security budget owner
    - This is Expel’s direct revenue pool.
  - - Managed EDR / endpoint-only services
    - Endpoint triage and response tied mainly to endpoint telemetry
    - Broader cloud, identity, email, and network workflows
    - Security operations or endpoint owner
    - A substitute for narrower deployments but not a full match for Expel’s pitch.
  - - Legacy MSSP / SOC outsourcing
    - Monitoring and alert handling, sometimes with limited response
    - Modern co-managed transparency and cloud-native integrations
    - IT/security operations
    - Status-quo competitor in replacement evaluations.
  - - In-house SOC plus point tools
    - Internal staffing, SIEM/EDR tools, and bespoke workflows
    - Third-party managed service cost
    - Internal security leader and finance
    - A do-it-yourself substitute when buyers have enough talent and scale.
  - - Broader cyber platform bundles
    - Platform suites that include managed response within a larger stack
    - Pure-play software modules with no managed layer
    - Procurement, platform owner, CISO
    - Important when Expel competes against larger suites rather than specialist services.
  notes: The boundary focuses on the spend a buyer would rationally compare with Expel, not all cybersecurity spend.
