- id: drivers-and-constraints
  title: Growth drivers, constraints, and what they mean for Expel
  body: 'The strongest growth drivers are structural rather than cyclical. Mordor and Thomson Reuters both point to rising attack sophistication, compliance pressure, and the widening shortage of skilled defenders. CyberProof adds that MDR is broadening into MXDR, CTEM, and AI-assisted workflows, while Red Canary’s MDR explainer cites strong evaluation intent across enterprise buyers. Expel is well positioned for those trends because its public materials already stress cloud coverage, automation, and co-managed operations. The constraints are also real. Mordor highlights high total cost of ownership for SMEs and data-sovereignty concerns that can fragment telemetry and raise delivery cost. Peer review evidence shows that feature gaps such as managed-SIEM expectations can still matter in competitive evaluations. Public-company and private-platform competitors also span a very wide scale range, from high-growth cloud leaders like CrowdStrike to more value-priced or consolidating platforms
    like Rapid7 and Sophos/Secureworks. For Expel, that means market growth alone is not enough: the company still has to win on transparency, integrations, time-to-value, and measurable outcomes while proving it can expand economically across regions and verticals.'
