  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Expel SAM and SOM precision
    missingEvidence: Regional revenue mix, vertical mix, customer-size mix, and pipeline conversion by segment.
    whyItMatters: Without those inputs the market model stays top-down and directional rather than a decision-grade bottoms-up forecast.
    diligencePath: Request revenue by region, vertical, and ACV band plus pipeline by segment.
    relatedQuestionRefs:
    - QM009
    - QM025
  - type: conflicting-data
    severity: minor
    topic: contradictory market-book estimates
    missingEvidence: A management-approved market-definition bridge explaining why publisher totals differ.
    whyItMatters: Different category boundaries can materially change share and valuation narratives.
    diligencePath: Ask management to reconcile which market boundary they use for board and fundraising materials.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: minor
    topic: buyer-conversion timing
    missingEvidence: Win-cycle length and conversion rates by segment.
    whyItMatters: Adoption timing affects sales efficiency and the realism of growth assumptions.
    diligencePath: Request sales-cycle, POC, and win-rate data by cloud enterprise, regulated vertical, and mid-market segment.
    relatedQuestionRefs:
    - QM024
