company:
  name: Expel
chapter:
  number: 4
  title: Financials
  summary: 'Public financial visibility on Expel is limited but directionally positive: third-party revenue trackers show fast growth from roughly $85 million in 2024 to about $142 million in 2025, while official sources confirm a large capital base and a software-first service model with modest physical capex. The main underwriting challenge is not whether the company has real revenue, but that core metrics such as gross margin, burn, NRR, CAC payback, and runway remain undisclosed.'
sections:
- id: revenue-model
  title: Revenue model, pricing, and public traction
  body: 'Expel’s public monetization looks like classic contracted MDR revenue rather than usage-led consumption or marketplace take rates. The company sells managed security packages across endpoint, cloud, and SaaS surfaces, with TrustRadius exposing list-style starting prices for some packages. Official materials reinforce that Expel monetizes by layering analyst operations, automation, and integrations onto signals customers already own, which implies recurring service revenue tied to asset counts or protected environments rather than one-time deployment revenue. Public traction is visible but still mostly third-party estimated. GetLatka reports Expel at $85.2 million of revenue in 2024 and $142.2 million in 2025, while StartupHub estimates annual revenue around $108.6 million and IncFact places the company in a very broad $100–$500 million range. Those sources differ materially, but they all point in the same direction: Expel is no longer an early-stage pre-scale startup. Revenue quality
    likely benefits from recurring contracts and embedded workflows, but public data is not good enough to separate subscription-like MDR ARR from professional services, incident response, or adjacent product revenue.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
