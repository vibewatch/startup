  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: core unit economics
    missingEvidence: Gross margin, NRR, GRR, CAC, payback, and services-vs-recurring revenue mix.
    whyItMatters: Without them, the investor cannot judge revenue quality or the sustainability of growth.
    diligencePath: Request board pack or monthly KPI dashboard with historical unit-economics metrics.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI023
  - type: private-evidence-only
    severity: material
    topic: liquidity and runway
    missingEvidence: Current cash, monthly burn, cash-flow statement, and fundraising plans.
    whyItMatters: Capital adequacy is the main missing ingredient for downside underwriting.
    diligencePath: Request current balance sheet, monthly cash bridge, and management base-case runway model.
    relatedQuestionRefs:
    - QI021
    - QI024
    - QI025
  - type: private-evidence-only
    severity: minor
    topic: revenue mix
    missingEvidence: Breakout of contracted recurring MDR revenue versus adjacent services and expansions.
    whyItMatters: Public pricing exists, but list prices do not reveal actual revenue composition or ARR quality.
    diligencePath: Request revenue by product line, package, and services component for the last eight quarters.
    relatedQuestionRefs:
    - QI005
