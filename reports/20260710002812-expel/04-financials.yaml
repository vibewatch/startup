- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  rows:
  - - Gross margin by package
    - Without it, revenue quality and operating leverage remain speculative
    - Request quarterly gross margin history and margin by endpoint/cloud/SaaS package.
  - - NRR / GRR by cohort
    - Without retention metrics, valuation quality is uncertain
    - Request cohort tables by year, segment, and ACV band.
  - - Cash balance and monthly burn
    - Without liquidity data, runway cannot be underwritten
    - Request last 24 months of monthly cash bridge and current balance sheet.
  - - Customer concentration
    - Without top-account exposure, downside risk is hidden
    - Request top-10 customer revenue concentration and logo churn data.
  - - Sales efficiency by segment
    - Without CAC and payback, growth durability is unclear
    - Request CAC, payback, quota attainment, and win rates by segment.
  - - Services vs recurring revenue mix
    - Without mix, ARR multiple comparison can mislead
    - Request percentage of revenue that is contracted recurring MDR versus non-recurring services.
  - - International revenue and delivery mix
    - Without geo split, scale and data-sovereignty cost are unclear
    - Request revenue, gross margin, and delivery headcount by region.
  notes: These are the blockers that prevent a clean valuation or downside case from public information alone.
