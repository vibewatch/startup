- id: go-to-market-and-sales-efficiency
  title: GTM motion and sales-efficiency proxies
  body: 'The public sales motion appears consultative but not heavyweight in implementation. Expel’s official material emphasizes that the SOC can connect through APIs rather than agents and begin monitoring in a matter of hours, while the customer page says many surveyed customers see value in less than 30 days. PeerSpot commentary similarly describes onboarding as straightforward and often completed within days if access is provided. That combination matters financially because faster onboarding generally reduces implementation cost, shortens time to billable value, and improves customer confidence during the first renewal cycle. Funding announcements also show that a meaningful share of prior capital was earmarked for product development, go-to-market expansion, partner growth, and international scaling. What remains missing is the hard efficiency layer: no public evidence discloses sales-cycle length, CAC, payback, gross retention, or NRR. As a result, the underwriting case can say revenue
    growth is real and service activation is comparatively fast, but it cannot yet say whether growth is efficient, durable, or heavily supported by ongoing sales and support investment.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
