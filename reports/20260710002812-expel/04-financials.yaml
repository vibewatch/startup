- id: capital-adequacy-and-financial-verdict
  title: Capital adequacy, financing dependency, and diligence blockers
  body: 'Official funding history shows Expel raised $140.3 million in Series E in late 2021 at a valuation above $1 billion and then extended that round in 2022, bringing total funding to $288.8 million. GetLatka still reports the lower pre-extension total of $257.8 million, which is useful because it highlights the difference between some third-party trackers and the company’s own updated total. There is no public evidence in the retained set of a new equity financing after the 2022 extension, which implies the company has had to support growth from prior capital and operating performance rather than repeat fundraising. That is directionally positive, but cash sufficiency cannot be proven publicly because no balance-sheet or burn disclosure exists for this private company. Public-company comparables help frame the category’s capital intensity: Rapid7 and CrowdStrike both disclose significant recurring-revenue bases and public-market valuations, while Secureworks’ last public market cap
    before acquisition was only about $0.75 billion, showing the range of possible outcomes. The financial verdict is therefore mixed but workable: revenue growth appears credible, physical capital intensity appears low, and prior capital raised was substantial, but investors still need private data on burn, gross margin, NRR, customer concentration, and runway before underwriting valuation or downside protection confidently.'
