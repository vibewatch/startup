    - 当前现金余额、月度烧钱、现金跑道和融资计划在公开渠道不可见。
    - 头部客户集中度、按行业拆分的 ARR 和伙伴渠道收入未披露。
    - 公开记录还无法完全厘清诉讼、监管沟通或事件处理敞口。
