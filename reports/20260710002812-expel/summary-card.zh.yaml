  topStrengths:
    - 金融科技、保险、非营利、制药和云软件环境都有真实客户证据，并给出了具体运营成效。
    - Workbench、集成广度和云中心的共管 MDR 工作流撑起了清晰产品定位。
    - 相比上市网络安全公司估值分布，估值锚点尚有合理性，并非明显拉得过高。
    - 官方信任、隐私和合规姿态支撑其面向高端企业销售的可信度。
    - 历史融资规模看起来足以支撑真实规模，而不只是故事阶段公司。
  topRisks:
    - 留存、毛利率、烧钱速度和现金跑道未公开，估值质量难以下重注。
    - 捆绑型平台竞争者和 SIEM 周边预期，可能压低专业 MDR 公司的倍数。
    - 客户集中度和伙伴渠道贡献的收入结构仍未披露。
    - 24x7 响应业务一旦检测、集成或人员配置下滑，服务质量风险会很重。
    - 法律和监管姿态看起来可控，但 Expel 仍是私营公司，披露仍不足。
  unresolvedGaps:
