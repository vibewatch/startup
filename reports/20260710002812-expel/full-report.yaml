        - from: d3
          to: d4
        - from: d4
          to: d5
        - from: d5
          to: d6
        - from: d3
          to: d6
          label: workflow visibility affects trust
    approximationNotes: This map blends technical and operating dependencies because the service outcome depends on both.
    claimRefs:
      - CR034
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation stays constructive only if business quality is confirmed by private metrics rather than
      contradicted by them.
    data:
      nodes:
        - id: n1
          label: Strong public customer and product evidence
        - id: n2
          label: Current implied multiple ~7x–9x revenue
        - id: n3
          label: Private diligence checks retention, margin, runway, concentration
        - id: n4
          label: Metrics strong enough to justify premium specialist multiple
        - id: n5
          label: Proceed / invest constructively
        - id: n6
          label: If metrics disappoint, re-rate lower or pause
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n3
          to: n6
    approximationNotes: This flow is an investment-decision abstraction, not a company operating process.
    claimRefs:
      - CV036
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Expel’s implied valuation multiple is sensitive primarily to which public revenue estimate you use and whether you
      assume private quality is premium or merely adequate.
    data:
      items:
        - label: Implied multiple on $142.2M revenue
          value: 7
          unit: x revenue / value anchor
        - label: Implied multiple on $108.6M revenue
          value: 9.2
          unit: x revenue / value anchor
        - label: SentinelOne public multiple
          value: 6.4
          unit: x revenue / value anchor
        - label: Rapid7 public multiple
          value: 0.9
          unit: x revenue / value anchor
        - label: CrowdStrike public multiple
          value: 42
          unit: x revenue / value anchor
    approximationNotes: >-
      Public-company values use market cap as a practical anchor; Expel values use the $1.0B private mark and public
      revenue estimates.
    claimRefs:
      - CV037
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Scenario range for interpreting the current $1B mark given revenue estimates and likely quality outcomes.
    data:
      items:
        - label: Current implied revenue multiple (x)
          low: 7
          high: 9.2
          displayValue: 7.0x–9.2x
          detail: Depends on whether you use GetLatka or StartupHub 2025 revenue estimate.
          tone: neutral
        - label: Public growth-comp sanity band (x)
          low: 6.4
          high: 42
          displayValue: 6.4x–42.0x
          detail: SentinelOne at the low end of growth comps, CrowdStrike at the high end of elite leaders.
          tone: positive
        - label: Compression-risk anchor (x)
          low: 0.9
          high: 1.5
          displayValue: ~0.9x–1.5x
          detail: Rapid7 market-cap/revenue-style compression and modest downside anchor logic.
          tone: negative
    approximationNotes: >-
      The compression anchor is illustrative and not a forecast; it exists to show how sensitive private valuation can
      be to quality disappointment.
    claimRefs:
      - CV038
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Compact indicators that most directly determine whether Expel’s current private valuation is fair.
    data:
      items:
        - label: Private valuation anchor
          value: $1.0B+
          unit: latest public mark
          note: 2021 Series E announcement said valuation was above $1B.
        - label: 2025 revenue estimate
          value: $142.2M
          unit: GetLatka est.
          note: Higher public revenue estimate used in the multiple range.
        - label: Alternate revenue estimate
          value: $108.6M
          unit: StartupHub est.
          note: Lower public estimate widens implied multiple.
        - label: Implied multiple band
          value: 7.0x–9.2x
          unit: revenue
          note: Core public valuation read.
        - label: SentinelOne public benchmark
          value: ~6.4x
          unit: revenue
          note: Closest growth-software public sanity check in the retained set.
        - label: Rapid7 compression benchmark
          value: ~0.9x
          unit: revenue / market cap signal
          note: Downside caution benchmark.
        - label: CrowdStrike leader benchmark
          value: ~42.0x
          unit: revenue
          note: Upper-bound leader benchmark, not a like-for-like expectation.
    approximationNotes: KPIs are intentionally mixed public anchors to show valuation context rather than one homogeneous trading screen.
    claimRefs:
      - CV039
