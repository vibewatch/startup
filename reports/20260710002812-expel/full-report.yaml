chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Expel positions itself as a managed detection and response provider built to give customers a modern
              security operations center without forcing them to replace existing tools. The company homepage, About
              page, Workbench materials, and customer stories consistently describe a co-managed model in which Expel
              analysts operate around the clock, use APIs and integrations rather than heavy rip-and-replace
              deployments, and expose their work through the Expel Workbench platform. That combination matters because
              it differentiates Expel from both legacy MSSPs and fully outsourced black-box services. Public company and
              market-profile pages also converge on stable identity facts: Expel was founded in 2016, is based in
              Herndon, Virginia, and sells MDR, phishing response, cloud monitoring, and vulnerability-prioritization
              capabilities. The broad message across official materials is that technology creates speed while humans
              supply context, judgment, and customer-specific response. Public evidence is strong on what Expel sells
              and how it wants to be perceived, while still thinner on audited company-scale disclosures such as exact
              current revenue, customer count, and margin profile.
