      - number: '3.3'
        title: Capability, packaging, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Public capability evidence suggests that Expel’s strongest public wedge is openness rather than monolithic
              breadth. Workbench materials emphasize 160-plus integrations and a model that can sit on top of existing
              tools. PeerSpot reviewers independently reinforce that point, praising fast onboarding, a large
              integration library, and a clear user experience, especially for cloud-heavy environments. That is not the
              same thing as having the broadest native suite. CrowdStrike and Rapid7 each market integrated platform
              coverage across endpoint, identity, cloud, and broader SOC functions, which can be attractive for
              consolidation-oriented buyers. Red Canary stresses augmentation and analyst depth, while Arctic Wolf
              stresses concierge service plus a large commercial SOC data set. Pricing remains mostly opaque across the
              category. TrustRadius publishes a visible starting point for Expel, but most competing MDR vendors force a
              sales-led process or provide no public price cards. That opacity limits exact apples-to-apples comparisons
              and increases the importance of win-loss data that is not public.
            claimRefs:
