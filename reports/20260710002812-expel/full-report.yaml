          - type: figure
            figureRef: FV001
            claimRefs:
              - CV036
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The valuation is not crazy; the opacity is the problem
            body: >-
              On public numbers alone, Expel’s ~$1B mark can be defended as reasonable for a premium specialist with
              real growth and customer proof. The key problem is not headline multiple stretch—it is the lack of private
              metrics needed to tell whether Expel deserves the premium.
            calloutType: insight
            claimRefs:
              - CV002
              - CV003
              - CV018
              - CV027
          - type: callout
            title: A fair-looking price can still be a bad investment if the hidden metrics are weak
            body: >-
              Because the current implied multiple is already in the high-single-digit range on public revenue
              estimates, disappointment on retention, gross margin, concentration, or runway could compress value
              quickly. The absence of a public valuation bubble does not eliminate private-company downside.
            calloutType: risk
            claimRefs:
              - CV021
