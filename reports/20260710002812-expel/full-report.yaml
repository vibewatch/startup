  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Expel’s customer journey usually starts with alert pain and cloud complexity, proceeds through rapid connection of
      existing tools, and expands as internal teams rely more on Workbench and managed response.
    data:
      nodes:
        - id: j1
          label: Pain recognition
          detail: Small or stretched security team is overwhelmed by alert volume, cloud complexity, or limited 24x7 coverage
          tone: negative
        - id: j2
          label: Evaluation
          detail: Buyer compares MDR providers based on cloud fit, integrations, and trust in co-managed operations
          tone: neutral
        - id: j3
          label: Onboarding
          detail: Existing telemetry is connected and workflows aligned with internal processes
          tone: positive
        - id: j4
          label: Steady-state use
          detail: Expel handles triage, reduces noise, and surfaces high-priority findings with context
          tone: positive
        - id: j5
          label: Expansion
          detail: Customer adds more clouds, log sources, or adjacent security workflows over time
          tone: positive
    approximationNotes: >-
      The map synthesizes repeated steps across named customer stories and review commentary rather than a single
      canonical lifecycle doc.
    claimRefs:
      - CU036
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Public customer stories show a path from evaluation and onboarding to production value and deeper workflow
      reliance.
    data:
      nodes:
        - id: f1
          label: Team faces noisy alerts, cloud risk, or staffing gap
        - id: f2
          label: Expel selected after multi-vendor evaluation or prior operator familiarity
        - id: f3
          label: Telemetry and workflows connected during onboarding
        - id: f4
          label: Production alert triage and response transferred to joint workflow
        - id: f5
          label: Customer realizes measurable value in MTTR, staffing leverage, or reduced noise
        - id: f6
          label: Coverage expands into more clouds, logs, or security use cases
      edges:
