            body: >-
              The business model likely benefits from software leverage, but it still relies heavily on scarce security
              talent and on customers continuing to trust a premium provider in a consolidating market. That creates
              execution risk around analyst hiring, retention, and leadership scale as the company expands
              internationally and supports more complex environments. Financial-model risk is also material because
              burn, gross margin, customer concentration, and runway remain private. Public sources can support a case
              that revenue growth is real and capital raised was substantial, but they cannot prove that the company has
              enough liquidity or retention quality to navigate a tougher competitive period without adverse pricing or
              fundraising dynamics. Public-company and market-data comparables reinforce the risk of divergence in
              outcomes: category leaders can command huge scale and valuation, but slower-growth or less-differentiated
              assets can compress dramatically. The right kill criteria are therefore not sensational events alone; they
              are measurable signals such as worsening competitive displacement, evidence of SIEM-gap losses,
              deteriorating onboarding or support quality, hidden concentration, or inability to fund growth efficiently
              without another round.
