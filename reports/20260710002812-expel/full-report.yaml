companyProfile:
  summary: >-
    Expel is a private managed detection and response company founded in 2016 and headquartered in Herndon, Virginia. It
    sells a software-enabled, co-managed security operations service centered on the Expel Workbench platform, with
    broad integrations across cloud, identity, SaaS, and endpoint environments. Public evidence supports meaningful
    customer adoption, strong cloud-centric product fit, and a historical valuation above $1 billion, but many
    underwriting-critical metrics remain private.
  foundedDate: '2016-01-01'
