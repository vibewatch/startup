    claimRefs:
      - CR033
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Expel’s product and outcomes depend on cloud platforms, security-tool partners, customer action, and internal
      delivery teams all operating coherently.
    data:
      nodes:
        - id: d1
          label: AWS / Microsoft / Google telemetry
        - id: d2
          label: Splunk / SecOps / customer SIEM context
        - id: d3
          label: Workbench and integrations
        - id: d4
          label: Analyst staffing and playbooks
        - id: d5
          label: Customer response authority
        - id: d6
