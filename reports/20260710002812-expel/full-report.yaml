            title: Category growth is structural, not just cyclical
            body: >-
              The public evidence lines up on the main point even when exact market books disagree: organizations are
              outsourcing more threat detection and response work because attack complexity, cloud sprawl, talent
              shortages, and compliance pressure are not going away. That structural demand backdrop supports durable
