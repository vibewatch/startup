  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risks are manageable but under-disclosed
        blocks:
          - type: paragraph
            body: >-
              Expel operates in a sector where legal and regulatory risk is real even when there is no obvious public
              enforcement headline. Managed detection and response providers process sensitive telemetry, coordinate
              investigations, and often act on behalf of customers across cloud, identity, endpoint, and SaaS
              environments. That creates recurring exposure to privacy, contractual authority, evidence handling, and
              cross-border data-governance issues. Public macro sources such as the World Economic Forum and Thomson
              Reuters show why this matters in 2026: cyber threats, fraud, privacy obligations, and broader compliance
              burdens are all rising. Expel's own notices and security-compliance pages show that management is at least
              addressing this risk directly: the company says it participates in the Data Privacy Framework, names a
              Data Protection Officer, states that the FTC has jurisdiction over DPF compliance, publishes
              subprocessors, and maintains formal security and privacy programs including ISO 27001, ISO 27701, SOC 2
              Type II, and NIST 800-171-aligned controls. Those are meaningful mitigants, but they are not the same as
              seeing actual customer contracts, regulator correspondence, or breach-handling files. Investors should
              still verify them independently. At the same time, the retained public record does not surface a clear
              Expel-specific regulatory action, major lawsuit, or securities-filing disclosure trail, because the
              company is private and legal databases require deeper case-level diligence than a surface web scan
              provides. That is not a clean bill of health. It means the investor should treat legal/regulatory risk as
              partially opaque rather than disproven. The right stance is severity-aware but evidence-humble: there are
              obvious exposure vectors, some visible mitigants, and incomplete public litigation or enforcement
              visibility.
            claimRefs:
              - CR001
              - CR002
              - CR003
