      - number: '1.3'
        title: Capital base, scale signals, and public-metric uncertainty
        blocks:
          - type: paragraph
            body: >-
              Funding history is the clearest public scale signal. Expel’s November 2021 Series E release announced
              $140.3 million at a valuation above $1 billion, while the October 2022 extension added another $30 million
              and brought official total funding to $288.8 million. Tracxn’s round history corroborates six rounds and
              rounds the cumulative total to about $289 million. Public third-party trackers then provide directional
              but not perfectly aligned operating scale. GetLatka estimates 2025 revenue at $142.2 million versus $85.2
              million in 2024, while StartupHub gives a lower $108.6 million estimate range and IncFact only brackets
              revenue broadly at $100-500 million. Headcount trackers also diverge: Tracxn shows 419 employees on a 2024
              entity snapshot and 479 employees on a later company trend, while GetLatka estimates 508 employees. The
              safest reading is not that one data vendor is necessarily wrong, but that Expel is large enough to show up
              across private-company databases while still not publishing audited or investor-grade operating metrics in
              public. That is good enough to support a real scale story, but not good enough to remove diligence gaps
              around exact ARR, efficiency, and capital needs.
