  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: Several different risk classes can flow into the same revenue, retention, margin, and valuation outcomes.
    data:
      nodes:
        - id: r1
          label: Legal / privacy issue
        - id: r2
          label: Service-quality miss or integration failure
        - id: r3
          label: Customer dissatisfaction or slower response
        - id: r4
          label: Higher churn / weaker expansion
        - id: r5
          label: Margin compression or slower growth
        - id: r6
