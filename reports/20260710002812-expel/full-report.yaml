            body: >-
              The product chapter shows why operational risk is central. Expel’s value depends on correctly ingesting
              customer telemetry, keeping dozens of integrations working, prioritizing real threats, and executing fast
              enough that customers trust the service during live incidents. That creates failure modes around false
              negatives, degraded connector quality, noisy detections, staffing strain, and platform reliability. The
              Meet Group, Make-A-Wish, Markel, and other customers all emphasize how much responsibility they shift onto
              Expel; that level of trust is a strength, but it also raises the severity of any service miss. Dependency
              risk is equally important. Expel’s open-overlay strategy depends on cloud vendors, Microsoft, Google,
              Splunk, and other third-party tools whose APIs, permissions, schemas, and commercial incentives can
              change. Larger suite vendors also remain a strategic dependency threat because they can reduce customer
              motivation to maintain an external overlay. The public risk is therefore not one dependency but a chain:
              telemetry access, integration health, analyst workflow quality, and customer response authority must all
              hold together for the product to deliver value.
