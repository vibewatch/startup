            - Medium
        - label: Secureworks / Sophos
          values:
            - Unknown
            - Medium
            - Medium-high
            - Unknown
            - Unknown
    approximationNotes: >-
      Ratings are conservative categorical summaries of retained public evidence; unknown reflects lack of sufficiently
      specific public proof, not a negative assessment.
    claimRefs:
      - CP034
  - id: FP003
    title: Moat / readiness KPIs
    type: kpi
    layout: standard
    summary: Compact set of public metrics that frame Expel’s competitive position relative to larger peers.
    data:
      items:
        - label: Expel integrations
          value: 160+
          unit: integrations
          note: Workbench materials emphasize broad third-party-tool support.
        - label: Expel customer value proof
          value: <30 days
          unit: time to value
          note: Official customer survey says many customers see value in under 30 days.
        - label: Arctic Wolf benchmark
          value: 10,000+
          unit: customers
          note: Shows specialist-peer scale advantage versus most private MDR vendors.
        - label: Rapid7 benchmark
          value: 11,500+
          unit: customers
          note: Public-platform scale benchmark.
        - label: Rapid7 ARR benchmark
          value: $832M
          unit: ARR
          note: Shows the revenue base of a public-platform competitor.
        - label: CrowdStrike ARR benchmark
          value: $5.25B
          unit: ARR
          note: Illustrates how large a bundled MDR incumbent can be.
        - label: Peer-review friction point
          value: Managed SIEM gap
          unit: buying criterion
          note: PeerSpot review flags log-storage/SIEM adjacency as a limitation.
    approximationNotes: >-
      This panel mixes company metrics and competitor benchmarks on purpose to show relative scale and buying-criteria
      asymmetry rather than homogeneous financial KPIs.
    claimRefs:
      - CP035
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: How customer environments turn into recurring service revenue for Expel.
    data:
      nodes:
        - id: n1
          label: Customer already owns endpoint, cloud, identity, or SaaS telemetry
        - id: n2
          label: Expel connects through APIs and integrations rather than heavy hardware deployment
        - id: n3
          label: Workbench plus analysts triage, investigate, and respond
        - id: n4
          label: Recurring MDR package is sold by protected environment / unit
        - id: n5
          label: Expansion comes from additional clouds, users, or managed surfaces
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
    approximationNotes: This bridge is qualitative because Expel does not disclose revenue mix or formal ARR mechanics publicly.
    claimRefs:
      - CI036
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: wide
    summary: Public evidence supports a partial service-economics model but leaves the key leverage nodes undisclosed.
    data:
      nodes:
        - id: u1
          label: Lead generation via direct sales, partner, and brand channels
        - id: u2
          label: Evaluation and onboarding accelerated by API-based integrations
        - id: u3
          label: Recurring revenue activated through MDR contract
        - id: u4
          label: Gross margin shaped by analysts, automation, and support intensity
        - id: u5
          label: Retention / expansion depends on workflow value and coverage breadth
        - id: u6
          label: Cash generation remains unknown without margin and burn disclosure
      edges:
        - from: u1
          to: u2
        - from: u2
          to: u3
        - from: u3
          to: u4
        - from: u4
          to: u5
        - from: u5
          to: u6
    approximationNotes: >-
      The flow reflects what must happen economically, but only onboarding-speed and revenue estimates are public; CAC,
      gross margin, NRR, and burn remain undisclosed.
    claimRefs:
      - CI037
  - id: FI003
    title: Financial estimate range
    type: range
    layout: wide
    summary: Public revenue and capital estimates form a bounded range rather than a precise audited statement.
    data:
      items:
        - label: 2025 annual revenue (USD M)
          low: 108.6
          high: 142.2
          displayValue: $108.6M–$142.2M
          detail: StartupHub estimate versus GetLatka estimate.
          tone: positive
        - label: Total funding through 2022 (USD M)
          low: 257.8
          high: 288.8
          displayValue: $257.8M–$288.8M
          detail: GetLatka tracker total versus official updated total after extension.
          tone: neutral
        - label: Revenue scale signal from IncFact (USD M)
          low: 100
          high: 500
          displayValue: $100M–$500M
          detail: Very broad range; useful only as a sanity band, not a valuation input.
          tone: neutral
    approximationNotes: >-
      This figure intentionally shows contradictions across public trackers instead of collapsing them into one claimed
      number.
    claimRefs:
      - CI038
  - id: FI004
    title: Capital intensity / cash-flow map
    type: matrix
    layout: wide
    summary: Public evidence points to low physical capex but meaningful people and go-to-market intensity.
    data:
      columns:
        - Cash / margin implication
        - Confidence
      rows:
        - label: No hardware, inventory, or manufacturing footprint visible
          values:
            - Lower physical capex than hardware businesses
            - High
        - label: 24x7 analyst operations and customer success
          values:
            - People costs likely meaningful
            - High
        - label: Automation and R&D investment emphasized in funding uses
          values:
            - Could improve margin over time but requires sustained engineering spend
            - Medium
        - label: International and channel expansion highlighted in funding releases
          values:
            - Growth investment may have continued after 2022
            - Medium
        - label: Current cash, burn, and runway undisclosed
          values:
            - Liquidity cannot be underwritten from public data
            - High
    approximationNotes: The matrix uses cost-category logic, not disclosed financial statements, because the company remains private.
    claimRefs:
      - CI039
  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Public evidence suggests a layered architecture from customer telemetry through integrations, Workbench, and
      managed response operations.
    data:
      layers:
        - label: Customer telemetry sources
          modules:
            - Endpoint and identity tools
            - Cloud logs and controls
            - SaaS and productivity signals
            - Email / phishing context
        - label: Integration and ingestion layer
          modules:
            - API connectors
            - Auth / permission setup
            - Normalization across third-party tools
        - label: Workbench operating layer
          modules:
            - Alert triage
            - Investigation workflow
            - Customer-visible reporting and collaboration
        - label: Detection and response operations
          modules:
            - Analyst review
            - Automation and playbooks
            - Active response coordination
        - label: Expansion modules
          modules:
            - Phishing defense
            - Vulnerability prioritization
            - Additional clouds / log sources
    approximationNotes: >-
      The stack is synthesized from public product pages and setup documentation rather than internal engineering
      diagrams.
    claimRefs:
      - CE036
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      The customer workflow starts with connecting existing telemetry, then moves into joint response and ongoing
      expansion.
    data:
      nodes:
        - id: w1
          label: Customer keeps existing security tools and telemetry
        - id: w2
          label: Expel connects APIs / permissions for target sources
        - id: w3
          label: Signals land in Workbench for analyst triage and investigation
        - id: w4
          label: Customer and Expel coordinate response in a co-managed model
        - id: w5
          label: Additional clouds, users, or managed surfaces are added over time
      edges:
        - from: w1
          to: w2
        - from: w2
          to: w3
        - from: w3
          to: w4
        - from: w4
          to: w5
    approximationNotes: >-
      This operating flow abstracts common deployment and steady-state steps visible in setup docs, case studies, and
      Workbench positioning.
    claimRefs:
      - CE037
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Expel’s product value depends on partner telemetry, customer access, Workbench quality, and analyst operations all
      functioning together.
    data:
