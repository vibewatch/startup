            body: >-
              Expel’s public timeline shows a coherent build-out from founding to scaled operating platform. Official
              milestones say the company launched in May 2016, introduced Expel Workbench and landed its first customer
              in June 2017, launched managed phishing in October 2020, reached unicorn status in November 2021, expanded
