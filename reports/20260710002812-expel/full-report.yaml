  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Expel actually delivers
        blocks:
          - type: paragraph
            body: >-
              Expel’s product should be understood as an operating system for managed detection and response rather than
              a single point tool. Official pages show the company packaging coverage for endpoint, cloud, SaaS,
              phishing, and vulnerability prioritization workflows, all tied together in Workbench. The service
              definition matters because buyers are not only purchasing software—they are purchasing analyst judgment,
              response operations, and automation on top of existing telemetry. Public product pages repeatedly
              emphasize that Expel uses customer tools and signals already in place instead of demanding a full
              rip-and-replace deployment. That makes the delivered asset a combination of integration layer, workflow
              UI, detection content, investigation routines, and human operating model. It also explains why the product
              catalog looks broader than a simple MDR SKU list: each package or add-on expands the surface area
              Workbench can monitor or act on. The technical underwriting question is therefore not “does Expel have an
              agent?” but “how effectively can Workbench normalize, prioritize, investigate, and coordinate action
              across many environments?”
