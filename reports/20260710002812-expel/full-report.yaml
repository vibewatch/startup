      - number: '4.3'
        title: Cost structure, gross margin drivers, and what we still do not know
        blocks:
          - type: paragraph
            body: >-
              Expel’s business model should be less capital intensive than hardware or infrastructure vendors because
              the service is delivered through software, remote integrations, and analyst operations rather than
              factories, inventory, or field deployment fleets. The main cost buckets implied by public materials are
              security analysts, threat hunters, engineering and automation investment, cloud/software infrastructure,
              customer success, and ongoing maintenance of an expanding integration catalog. Series E commentary about
              doubled technology partners, increased investigations, and improved analyst effectiveness through
              automation supports the idea that margin expansion depends on software leverage over labor. That is
              promising, but it is not the same thing as disclosed gross margin. No public source in the retained set
              provides gross margin, contribution margin, net retention, or support burden per customer. Public-company
              comps such as CrowdStrike and Rapid7 show what good cybersecurity-software economics can look like at
              scale, but they are not substitutes for Expel’s own data because their product mixes and go-to-market
              structures are broader. The financial model therefore remains a partial one: likely attractive
              software-service economics, but no underwriting-grade proof of gross-margin trajectory or sales
              efficiency.
