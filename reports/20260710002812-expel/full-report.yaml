      - number: '5.4'
        title: Technical differentiation and key technical risks
        blocks:
          - type: paragraph
            body: >-
              The product thesis is strongest when the buyer values an open, co-managed security-operations layer more
              than a single-vendor security stack. Expel’s technical differentiation appears to come from three things
              working together: fast integration-led deployment, analyst workflow visibility in Workbench, and the
              ability to coordinate investigations across many external tools. That is valuable and likely sticky once
              deployed, but it is not immune to competitive pressure. Larger suites can improve workflow UX, bundle
              adjacent functionality such as logging or native data storage, and use scale to reduce perceived
              integration friction. The product risk is therefore not that Expel lacks a product—it clearly has one—but
              that parts of the category are converging. To underwrite the technical moat, investors still need deeper
              evidence on roadmap velocity, proprietary content, platform reliability metrics, and how often the
              managed-SIEM objection appears in real evaluations. Public evidence supports the conclusion that Expel’s
