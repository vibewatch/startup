      - number: '3.4'
        title: What looks durable and what looks vulnerable
        blocks:
          - type: paragraph
            body: >-
              Expel’s public moat appears real but moderate rather than impregnable. The clearest durable elements are
              workflow trust, integration coverage, quick time-to-value, and the transparency narrative around
              Workbench. Those are hard to replicate instantly because they depend on analyst process, product design,
              and accumulated integrations, not just sales collateral. Even so, they are not untouchable. CrowdStrike,
              Rapid7, and Sophos/Secureworks can cross-subsidize MDR inside broader software relationships. Arctic Wolf
              can lean on its scale and concierge model, while ReliaQuest and Red Canary can compete on open-platform
              and analyst-led narratives that resemble parts of Expel’s pitch. Peer feedback also exposes one sharp
              vulnerability: buyers who want a managed SIEM or bundled log storage may prefer other platforms or require
              a partner overlay. In other words, Expel’s moat is strongest when buyers value speed, openness, and
              co-managed operation; it weakens when the RFP prioritizes suite breadth, bundled economics, or one-vendor
              data-plane ownership.
