  topStrengths:
    - Real multi-vertical customer proof with concrete operational outcomes across fintech, insurance, nonprofit, pharma, and cloud software environments.
    - Strong product positioning around Workbench, integration breadth, and cloud-centric co-managed MDR workflows.
    - Valuation anchor that is plausible relative to public cyber comp dispersion rather than obviously stretched.
    - Official trust, privacy, and compliance posture supports premium-enterprise selling credibility.
    - Historical capital raised appears substantial enough to support real scale, not just a narrative-stage company.
  topRisks:
    - Retention, gross margin, burn, and runway are not public, limiting conviction on valuation quality.
    - Bundled platform competitors and SIEM-adjacent expectations can pressure a specialist MDR multiple.
    - Customer concentration and partner-sourced revenue mix remain undisclosed.
    - Service-quality risk is severe in a 24x7 response business if detections, integrations, or staffing degrade.
    - Legal and regulatory posture appears manageable but is still under-disclosed because Expel is private.
  unresolvedGaps:
    - NRR, GRR, logo churn, and contract-length data remain unavailable publicly.
    - Gross margin, services-versus-recurring revenue mix, and onboarding cost profile are not disclosed.
    - Current cash balance, monthly burn, runway, and financing plans are not publicly visible.
    - Top-customer concentration, ARR by vertical, and partner-sourced revenue are not disclosed.
    - Public records do not fully settle litigation, regulator correspondence, or incident-handling exposure.
