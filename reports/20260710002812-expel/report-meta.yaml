companyProfile:
  summary: Expel is a private managed detection and response company founded in 2016 and headquartered in Herndon, Virginia. It sells a software-enabled, co-managed security operations service centered on the Expel Workbench platform, with broad integrations across cloud, identity, SaaS, and endpoint environments. Public evidence supports meaningful customer adoption, strong cloud-centric product fit, and a historical valuation above $1 billion, but many underwriting-critical metrics remain private.
  foundedDate: '2016-01-01'
  founders:
    - name: Dave Merkel
      role: Co-founder & CEO
      background: Co-founder and current CEO leading Expel's analyst-plus-automation MDR model and product expansion across major environments.
      claimRefs: [CO010, CO011]
  foundingLocation: Herndon, Virginia, USA
  headquarters: Herndon, Virginia, USA
  productSummary: Workbench-centered MDR platform and operating model spanning endpoint, cloud, SaaS, phishing, and vulnerability-prioritization workflows through a co-managed service layer.
  customerFocus: Cloud-heavy, regulated, and operationally lean security teams that need 24x7 detection and response without building a large internal SOC.
  businessModel: Recurring MDR packages sold across protected environments and user bases, augmented by adjacent security services and cross-surface expansion opportunities.
  stage: Series E
  fundingStatus: Officially raised $288.8M through the 2022 Series E extension after a 2021 round that valued the company above $1B.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO019, CE001, CE008, CI026, CV001]
summary:
  headline: Expel looks like a real, premium MDR asset with credible growth and customer proof, but the current valuation should only be underwritten after private confirmation of retention, margins, concentration, and runway.
