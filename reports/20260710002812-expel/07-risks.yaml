- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Competitive bundling pressure
    - Loss reasons vs suite vendors
    - Meaningful increase in losses tied to one-vendor platform preference
    - Revise valuation multiple and demand win-loss evidence before conviction.
  - - Managed-SIEM product gap
    - RFP disqualification rate
    - Recurring loss pattern attributable to logging / SIEM expectations
    - Treat as roadmap-critical and haircut expansion assumptions.
  - - Service-quality degradation
    - Onboarding time, CSAT, or incident-response satisfaction worsens
    - Trend deterioration across multiple quarters
    - Assume higher churn risk and weaker premium pricing power.
  - - Liquidity risk
    - Current cash and burn show limited runway
    - Runway falls below internally acceptable threshold without financing plan
    - Require financing plan and re-underwrite downside.
  - - Customer concentration surprise
    - Top-account exposure or vertical concentration disclosed as high
    - Any single customer or small set drives outsized ARR
    - Increase downside case and require account-level diligence.
  - - Regulatory / legal surprise
    - Material dispute, enforcement inquiry, or breach-handling controversy surfaces
    - Any unresolved major matter with customer or regulator significance
    - Pause thesis until counsel and management responses are reviewed.
  notes: Kill criteria are designed to be monitorable events or thresholds, not abstract concerns.
