callouts:
- calloutType: risk
  title: The biggest risk may be what public sources cannot quantify
  body: Expel’s visible strengths make the company easier to like than to underwrite. The sharpest residual risk is still private-company opacity around churn, concentration, burn, and litigation—areas where the public record is incomplete rather than affirmatively clean.
  claimRefs:
  - CR006
  - CR021
  - CR028
  - CR030
- calloutType: insight
  title: Open-overlay strategy creates both moat and dependency
  body: The same design choice that makes Expel attractive in mixed-tool environments also ties the company to third-party API health, telemetry quality, and customer-owned response processes. That is a sophisticated but fragile kind of leverage.
  claimRefs:
  - CR016
  - CR017
  - CR018
  - CR034
