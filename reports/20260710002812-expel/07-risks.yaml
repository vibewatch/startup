  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: litigation and regulatory posture
    missingEvidence: Counsel memo, litigation schedule, regulator correspondence, DPA terms, and cross-border data-handling details.
    whyItMatters: Public search surfaces are not enough to rule out liabilities or quantify downside.
    diligencePath: Run counsel diligence and request full legal schedule plus privacy/compliance pack.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR005
    - QR030
  - type: private-evidence-only
    severity: material
    topic: service-quality trend
    missingEvidence: False-positive/false-negative indicators, SLA metrics, escalation volume, staffing ratios, and support quality trend.
    whyItMatters: Operational risk cannot be sized from case studies and one peer review alone.
    diligencePath: Request service-operations KPI dashboard and quality-review process.
    relatedQuestionRefs:
