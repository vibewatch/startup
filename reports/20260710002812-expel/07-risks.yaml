    - Structural exposure; no specific public enforcement found in retained scan
    - Medium
    - High
    - Co-managed workflows, platform visibility, and customer-specific scoping likely help
    - Still material because telemetry and response activity can create privacy and contractual disputes
    - Review DPA terms, incident playbooks, cross-border data handling, and any regulator correspondence.
  - - Cross-border data governance and sector compliance burden
    - U.S. + international enterprise environments
    - Rising macro requirement set in 2026
    - Medium
    - Medium-high
