company:
  name: Expel
chapter:
  number: 6
  title: Customers
  summary: Expel’s public customer proof is strongest in cloud-heavy, regulated, and operationally lean organizations that need 24x7 detection and response without building a large internal SOC. Named deployments across fintech, insurance, healthcare, nonprofit, pharma, publishing/social, and data-intelligence segments show real production use and measurable workflow gains, but public evidence remains weak on exact customer count, retention, and concentration.
sections:
- id: segments
  title: Who buys and uses Expel
  body: 'The public evidence suggests Expel’s customer base is defined less by company size alone than by a recurring operational pattern: organizations with meaningful cloud, identity, or mixed-tool complexity that still want a co-managed security partner rather than a full one-vendor suite. Named references span fintech, insurance, healthcare, nonprofits, pharmaceuticals, data-intelligence software, and consumer internet platforms. Across those segments, the user is often the internal security team, the buyer is usually a security leader or infrastructure/security manager, and the payer appears to be the security or broader IT budget owner. Several stories emphasize that the customer wanted to free a small team from constant alert triage while still getting meaningful detection and response depth. That makes Expel look especially relevant for lean but sophisticated teams: buyers who know enough to value integrations, cloud detections, and response context, but who do not want to hire a
    large 24x7 SOC. The common use case is therefore not generic “security outsourcing,” but operational leverage for internal teams facing too many alerts, too few specialists, or too much cloud complexity.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-proof
  title: Named deployments show real production adoption
  body: 'Expel’s named customer proof is unusually concrete for a private cybersecurity company. Markel reports more than a 60% improvement in mean time to remediate after deploying Expel and folding SIEM signals into Workbench. The Meet Group says the service cut alert volume from six or seven alerts per day to around one per week and saved 10 to 15 hours of weekly investigation time. Affirm reports a 50% reduction in manual security triage and a 40% improvement in mean time to remediate across more than a dozen AWS accounts. Make-A-Wish says Expel shortened alert-to-fix timelines from days to minutes and avoided the need to add two or three more security staff. The pharmaceutical and data-intelligence stories reinforce a similar pattern: onboarding was fast, the internal team got out of the alert queue, and Expel’s platform enabled deeper focus on strategic work. This is strong evidence of production deployment and user value, even though it is still biased toward success stories selected
    for publication.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: retention-and-durability
  title: Durability looks plausible, but retention remains mostly a diligence gap
  body: 'Public signals support the idea that Expel should be sticky once installed, but they do not prove retention quantitatively. The reasons are structural: integrations are spread across multiple telemetry sources, analysts build shared process knowledge with the customer, and Workbench becomes part of incident and governance workflow. Case studies repeatedly describe customers using Expel to reshape the internal security team’s day-to-day work rather than to solve a one-off project. That usually implies meaningful switching cost. Review sources also help at the margin. PeerSpot commentary rates customer service highly and describes both new adoption and some switching between providers after evaluations. Gartner, G2, and TrustRadius review surfaces indicate that buyers are actively reviewing the category, though the retained text is weaker on exact score extraction than on qualitative themes. The key problem is that none of these public surfaces substitutes for NRR, GRR, logo churn,
    contract length, or cohort retention. As a result, durability is best described as high-probability but under-disclosed.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration
  title: Expansion vectors are visible; concentration risk is not
  body: Public evidence suggests several plausible land-and-expand motions. Customers can start with one cloud or telemetry set and then add other clouds, SaaS signals, phishing workflows, or SIEM-linked visibility. Stories such as Markel, Make-A-Wish, and the data-intelligence company show expansion into broader cloud, identity, or reporting use cases over time. Public reviews also suggest Expel can help rationalize redundant tools, which could make the service more central rather than less. What is not visible publicly is concentration. There is no retained source that discloses total customer count with precision, revenue by vertical, top-account exposure, or the portion of business acquired through channels or strategic partners. That means the positive customer proof should not be confused with a diversified revenue base. Investors can reasonably conclude that Expel serves real customers in multiple verticals and can expand within accounts; they cannot yet conclude that the book of
    business is unconcentrated or that expansion economics are uniform across segments.
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
