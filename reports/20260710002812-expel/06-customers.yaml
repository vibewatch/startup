callouts:
- calloutType: strength
  title: The customer proof is real, varied, and operationally specific
  body: Expel’s public references do not look like shallow logo walls. Multiple customer stories publish concrete before-and-after workflow outcomes, especially around MTTR, alert reduction, staffing leverage, and cloud-security operations. That meaningfully increases confidence that the service is deployed in production and valued by users.
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
- calloutType: risk
  title: Retention confidence is still mostly inferential
  body: The same stories that prove usage do not prove retention. There is still no public NRR, GRR, contract-length, or cohort disclosure, so investors must not confuse strong named customer proof with a fully underwritten customer-quality profile.
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU039
