- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Add more telemetry sources and clouds after initial deployment
    - Total customer count and vertical mix not precisely disclosed
    - Expansion may be strong, but denominator is unclear
    - Request expansion ARR by module and multi-product attach rates.
  - - Move from alert triage support to broader governance and reporting workflows
    - Top-customer revenue concentration not disclosed
    - Large accounts could contribute outsized ARR or reference value
    - Request top-10 customer concentration and logo list by ARR band.
  - - Cross-sell phishing defense or vulnerability prioritization
    - Adoption of newer adjacencies unclear
    - Adjacency upside may be real but not yet visible
    - Request attach-rate and pipeline for add-on modules.
  - - Channel / partner leverage in cloud ecosystems
    - Partner-sourced revenue mix not public
    - Channel dependence could affect margin and access
    - Request sourced-pipeline and sourced-ARR mix by partner type.
  - - Geographic expansion
    - Regional customer mix and delivery mix not public
    - International growth may raise service-delivery complexity
    - Request customer and ARR split by geography plus support model.
  notes: Positive customer proof is visible, but concentration and expansion quality remain private-company diligence topics.
