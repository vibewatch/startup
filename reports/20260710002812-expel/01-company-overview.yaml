- id: milestones-proof-and-open-gaps
  title: Milestones, customer proof, and open diligence gaps
  body: 'Expel’s public timeline shows a coherent build-out from founding to scaled operating platform. Official milestones say the company launched in May 2016, introduced Expel Workbench and landed its first customer in June 2017, launched managed phishing in October 2020, reached unicorn status in November 2021, expanded into EMEA in October 2022, and relaunched its partner program in September 2023. Current product and customer materials add operating proof rather than just chronology. The homepage and Workbench materials advertise 160-plus integrations and a 14-minute critical-incident MTTR with auto-remediation, while customer stories from Qlik and Dayton Children’s show concrete cloud, Kubernetes, and healthcare use cases. IDC and Gartner materials reinforce that buyers and analysts view Expel as a legitimate MDR leader rather than a niche tool vendor. Even so, the company overview still carries unresolved gaps that matter to investors: exact customer count is not public, gross margin
    and burn are undisclosed, public headcount trackers disagree, and even official MTTR claims vary slightly across pages. The business is clearly real and established; the remaining work is less about proving existence and more about validating unit economics, retention, and governance detail.'
