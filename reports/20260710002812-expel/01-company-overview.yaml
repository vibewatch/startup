  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current ARR and margin profile
    missingEvidence: Audited or management-certified ARR, revenue mix, gross margin, burn, and runway metrics.
    whyItMatters: These values determine whether public valuation markers still look justified versus current economics.
    diligencePath: Request board deck, latest monthly financial package, and revenue cohort bridge.
    relatedQuestionRefs:
    - QO024
    - QO010
  - type: private-evidence-only
    severity: material
    topic: customer count and concentration
    missingEvidence: Current customer count, top-customer concentration, and retention data.
    whyItMatters: Category leadership claims are stronger if diversified customer scale and renewals are proven.
    diligencePath: Request customer cohort, NRR/GRR, and top-10 customer exposure from management.
    relatedQuestionRefs:
    - QO013
    - QO024
  - type: conflicting-data
    severity: minor
    topic: headcount precision
    missingEvidence: A single management-confirmed employee count.
    whyItMatters: Public trackers disagree, which affects revenue-per-employee and operating-efficiency heuristics.
    diligencePath: Confirm current FTE count and department split with finance or HR.
    relatedQuestionRefs:
    - QO012
  - type: private-evidence-only
    severity: material
    topic: board rights and control structure
    missingEvidence: Board roster, voting rights, preference stack, and investor protections.
    whyItMatters: Governance structure can materially affect financing flexibility and exit outcomes.
    diligencePath: Request cap table, charter, investor rights agreement, and current board observer list.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO005
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 public milestone coverage
    missingEvidence: A fuller list of internal milestones such as customer-count inflections, board changes, and exact international launch steps.
    whyItMatters: The public milestone record is directionally strong but incomplete, which limits precision when mapping execution tempo against financing and product expansion.
    diligencePath: Request internal timeline or board materials that reconcile product, hiring, and geography milestones to financing dates.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: minor
    topic: debt and non-equity financing
    missingEvidence: Public evidence showing whether Expel has venture debt, credit facilities, or other non-equity obligations.
    whyItMatters: Capital structure affects dilution, runway, and downside protection for investors and employees.
    diligencePath: Search company financing docs and request debt schedules or credit agreements from management.
    relatedQuestionRefs:
    - QO010
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership completeness
    missingEvidence: A full public board roster, committee structure, and every executive vice president or general manager role.
    whyItMatters: Founder and executive biographies are strong, but incomplete governance detail limits assessment of bench depth and control distribution.
    diligencePath: Request current board deck, org chart, and committee memberships from management.
    relatedQuestionRefs:
    - QO006
    - QO025
    relatedTableRefs:
    - TO002
