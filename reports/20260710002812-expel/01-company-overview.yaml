callouts:
- calloutType: strength
  title: Technology-enabled transparency is the core brand promise
  body: Expel’s most repeated differentiator is not just outsourced monitoring; it is a transparent, software-enabled operating model that lets customers keep their stack, see the audit trail, and work with analysts in real time through Workbench. That combination shows up across official product pages and customer stories, making it more than a one-off marketing line.
  claimRefs:
  - CO003
  - CO005
  - CO032
  - CO035
  - CO036
- calloutType: risk
  title: Public operating metrics are still thinner than the market-position narrative
  body: Funding, product breadth, and customer examples are well evidenced, but exact revenue, customer count, gross margin, burn, and governance terms are not publicly disclosed with audit-grade precision. Diligence therefore shifts from proving category relevance to verifying economic quality and control structure.
  claimRefs:
  - CO022
  - CO023
  - CO024
  - CO027
  - CO041
