company:
  name: Expel
chapter:
  number: 1
  title: Company Overview
  summary: Expel is a Herndon, Virginia managed detection and response provider founded in 2016 by former Mandiant and AOL security operators who built the company around transparent, technology-driven security operations. Public evidence strongly supports unicorn status, roughly $289 million of cumulative funding, and meaningful product and customer proof, but current revenue, customer-count, and governance disclosures remain partly dependent on third-party estimators rather than audited company reporting.
sections:
- id: identity-and-operating-model
  title: Identity and operating model
  body: 'Expel positions itself as a managed detection and response provider built to give customers a modern security operations center without forcing them to replace existing tools. The company homepage, About page, Workbench materials, and customer stories consistently describe a co-managed model in which Expel analysts operate around the clock, use APIs and integrations rather than heavy rip-and-replace deployments, and expose their work through the Expel Workbench platform. That combination matters because it differentiates Expel from both legacy MSSPs and fully outsourced black-box services. Public company and market-profile pages also converge on stable identity facts: Expel was founded in 2016, is based in Herndon, Virginia, and sells MDR, phishing response, cloud monitoring, and vulnerability-prioritization capabilities. The broad message across official materials is that technology creates speed while humans supply context, judgment, and customer-specific response. Public evidence
    is strong on what Expel sells and how it wants to be perceived, while still thinner on audited company-scale disclosures such as exact current revenue, customer count, and margin profile.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO028
  - CO032
  - CO041
  tableRefs:
  - TO001
