  - FO002
- id: leadership-and-governance
  title: Leadership, founders, and governance posture
  body: Leadership disclosure is better than financial disclosure. Expel’s About page names Dave Merkel as co-founder and CEO, Justin Bajko as co-founder and chief strategy officer, and Yanek Korff as co-founder and chief operating officer. It also identifies Greg Notch as CTO, Scott Fuselier as CRO, Jessica Dodson as CMO, and Zach Blaine as CFO. The biographies matter because they show repeated Mandiant, FireEye, AOL, CrowdStrike, and enterprise-security operating experience across the top team. That background supports the company’s claim that it was built by practitioners frustrated with noisy, opaque security services. Governance is somewhat less transparent. Tracxn and financing releases point to investor-board representation from CapitalG and Paladin figures, and Tracxn lists a 10-person board, but Expel’s own public pages do not publish a canonical board roster or control-rights summary. The practical implication for diligence is that the management bench looks credible and relevant,
    but board composition, voting control, and investor protections still need confirmation from private materials rather than open web evidence alone.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO041
