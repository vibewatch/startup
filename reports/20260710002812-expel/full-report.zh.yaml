      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 留存质量
        - NRR / GRR 低于投资假设可接受阈值
        - 相较高端软件预期明显偏弱
        - 下调至更低倍数，并重新考虑持仓。
      - - 客户集中度
