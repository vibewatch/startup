      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 估值并不离谱，问题在于不透明
            body: 仅看公开数字，Expel 约 $1B 的估值可以说合理：它是一家有真实增长和客户证明的高端专科公司。关键问题不是表面倍数拉得太长，而是缺少私人指标，无法判断 Expel 是否配得上这份溢价。
