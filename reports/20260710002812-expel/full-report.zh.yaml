  - id: TR005
    title: 缓解措施和止损条件表
    columns:
      - 风险
      - 可监控触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 竞争性捆绑压力
        - 相对套件供应商的输单原因
        - 因偏好单一供应商平台导致的输单显著增加
        - 调整估值倍数，并在形成确信前要求输赢分析证据。
      - - 托管 SIEM 产品缺口
        - RFP 淘汰率
        - 归因于日志 / SIEM 预期的反复输单模式
        - 视为路线图关键项，并下调扩张假设。
      - - 服务质量下滑
        - 上线时间、CSAT 或事件响应满意度恶化
        - 多个季度趋势走弱
        - 假设流失风险更高、高端定价能力更弱。
      - - 流动性风险
        - 当前现金和烧钱速度显示现金续航期有限
        - 现金续航期低于内部可接受阈值且没有融资计划
        - 要求融资计划，并重新审视下行情形。
      - - 客户集中度意外
        - 披露头部账户暴露或行业集中度较高
        - 任一单一客户或少数客户贡献超比例 ARR
        - 提高下行情形权重，并要求账户级尽调。
      - - 监管 / 法律意外
        - 重大争议、执法问询或数据泄露处理争议浮现
        - 任何涉及客户或监管意义的未解决重大事项
        - 在律师和管理层回应审阅前暂停投资论点。
    notes: 止损条件应当是可监控事件或阈值，而不是抽象担忧。
