        - 加大下行情景权重，并在可能时重新谈判条款。
      - - 服务经济性
        - 毛利率显著低于健康的软件赋能服务水平
        - 增长下经营杠杆有限
        - 按质量较低的服务资产处理，而非高端软件服务混合体。
      - - 竞争压力
        - 赢单 / 输单数据显示套件替代或 SIEM 缺口流失加剧
        - 被捆绑平台反复替代
        - 下调终局倍数假设和扩张预期。
      - - 流动性
        - 没有可信计划时跑道过短
        - 需要被动融资或接受不利条款
        - 暂停或重置估值立场。
