          - type: callout
            title: 市场增长不能消除包装和平台压力
            body: MDR 可能以低 20% 区间的 CAGR 扩张，但采用仍受价格敏感、主权要求、既有套件，以及买家对集成日志管理或更广泛捆绑平台的偏好约束。Expel 仍要在竞争中赢，而不是只出现在一个好品类里。
