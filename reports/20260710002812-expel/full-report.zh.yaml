        - from: w4
          to: w5
    approximationNotes: 这套运营流程抽象了设置文档、客户案例和 Workbench 定位中可见的常见部署与稳态步骤。
    claimRefs:
      - CE037
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Expel 的产品价值取决于合作伙伴遥测、客户访问权限、Workbench 质量和分析师运营协同运转。
    data:
      nodes:
        - id: d1
          label: 客户遥测可用性
        - id: d2
          label: 第三方 API 和连接器
        - id: d3
          label: Workbench 标准化和工作流
        - id: d4
          label: 分析师 playbook 和自动化
        - id: d5
          label: 客户响应权限和跟进执行
        - id: d6
          label: 可衡量的安全结果
      edges:
        - from: d1
          to: d2
        - from: d2
          to: d3
        - from: d3
          to: d4
        - from: d4
          to: d5
        - from: d5
          to: d6
        - from: d2
          to: d4
          label: 源数据质量影响自动化
    approximationNotes: 这个 DAG 捕捉依赖逻辑，不是字面意义的软件调用图。
    claimRefs:
      - CE038
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: 能力成熟度在核心 MDR 和云集成上看起来最强；较新的邻近能力或 SIEM 邻近预期，公开证据不够充分。
    data:
      columns:
        - 公开广度
        - 公开深度
        - 商业清晰度
        - 风险水平
      rows:
        - label: 核心 MDR / Workbench
          values:
            - 高
            - 高
            - 高
            - 低
        - label: 云集成
          values:
            - 高
            - 中高
            - 高
            - 中低
        - label: 钓鱼防御
          values:
            - 中
            - 中
            - 中
            - 中
        - label: 漏洞优先级排序
          values:
            - 中
            - 中低
            - 中低
            - 中高
        - label: 托管 SIEM / 日志存储邻近能力
          values:
            - 低
            - 低
            - 低
            - 高
    approximationNotes: 这张矩阵是基于公开证据的成熟度评估，不是内部路线图评分卡。
    claimRefs:
      - CE039
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Expel 的客户旅程通常始于告警痛点和云复杂性；先快速接入既有工具，之后随着内部团队更依赖 Workbench 和托管响应而扩张。
    data:
      nodes:
        - id: j1
          label: 痛点识别
          detail: 小型或人手紧张的安全团队被告警量、云复杂性或有限的 24x7 覆盖压垮
          tone: negative
        - id: j2
          label: 评估
          detail: 买家根据云适配度、集成能力以及对共同管理运营的信任来比较 MDR 供应商
          tone: neutral
        - id: j3
          label: 上线
          detail: 连接既有遥测数据，并让工作流对齐内部流程
          tone: positive
        - id: j4
          label: 稳态使用
          detail: Expel 处理分诊、降低噪音，并带着上下文呈现高优先级发现
          tone: positive
        - id: j5
          label: 扩张
          detail: 客户后续增加更多云、日志来源或邻近安全工作流
          tone: positive
    approximationNotes: 这张图综合了具名客户故事和评论中反复出现的步骤，而不是某一份标准生命周期文档。
    claimRefs:
      - CU036
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开客户故事显示，路径从评估和上线走向生产价值，再走向更深的工作流依赖。
    data:
      nodes:
        - id: f1
          label: 团队面临告警噪音、云风险或人手缺口
        - id: f2
          label: 经过多供应商评估，或因操作者此前熟悉，客户选择 Expel
        - id: f3
          label: 上线阶段接入遥测数据和工作流
        - id: f4
          label: 生产告警分诊和响应转入联合工作流
        - id: f5
          label: 客户在 MTTR、人力杠杆或降噪上看到可衡量价值
        - id: f6
          label: 覆盖扩展到更多云、日志或安全用例
      edges:
        - from: f1
          to: f2
        - from: f2
          to: f3
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
    approximationNotes: 这个漏斗从客户故事中归纳，而不是披露的产品驱动增长指标集。
    claimRefs:
      - CU037
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 具名客户证明的证据质量和具体度不一，但多个细分市场显示的是实际生产结果，而非只有 logo 背书。
    data:
      columns:
        - 结果具体度
        - 生产成熟度
        - 云 / 复杂环境关联度
        - 留存可见度
      rows:
        - label: Affirm
          values:
            - 高
            - 高
            - 高
            - 低
        - label: Markel
          values:
            - 高
            - 高
            - 中高
            - 低
        - label: Make-A-Wish
          values:
            - 高
            - 高
            - 高
            - 低
        - label: The Meet Group
          values:
            - 高
            - 高
            - 高
            - 低
        - label: 制药
          values:
            - 中高
            - 高
            - 中
            - 低
        - label: 数据智能公司
          values:
            - 中高
            - 高
            - 高
            - 低
    approximationNotes: 所有行的留存可见度都偏低，因为公开案例研究很少披露续约或 cohort 行为。
    claimRefs:
      - CU038
  - id: FU004
    title: 留存 / 重复队列
    type: cohort
    layout: wide
    summary: 按细分市场估算留存视角；这只是结构性假设，等待真实流失和续约披露。
    data:
      columns:
        - 第 1 年
        - 第 2 年
        - 第 3 年
      rows:
        - label: 云原生企业 / 金融科技
          values:
            - 92
            - 88
            - 84
        - label: 受监管企业 / 保险
          values:
            - 93
            - 89
            - 85
        - label: 人手精简的医疗 / 非营利组织
          values:
            - 90
            - 84
            - 78
        - label: 云软件 / 互联网平台
          values:
            - 91
            - 86
            - 80
    approximationNotes: 这些百分比是分析师估算，来自观察到的工作流黏性和转换成本逻辑，不是公司披露的留存指标；一旦有实际 cohort 数据，应立即替换。
    claimRefs:
      - CU039
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 基于公开证据和剩余尽调缺口，对 Expel 主要残余风险按严重度加权。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余严重度
      rows:
        - label: 隐私 / 监管暴露
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 服务质量 / 漏检风险
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 平台 / API 依赖
          values:
            - 中高
            - 高
            - 中
            - 高
        - label: 竞争性捆绑压力
          values:
            - 高
            - 中高
            - 中
            - 高
        - label: 私营公司财务不透明
          values:
            - 高
            - 中高
            - 低
            - 高
        - label: 人员 / 扩张执行
          values:
            - 中高
            - 中高
            - 中
            - 中高
    approximationNotes: 这张热力图是基于公开证据的判断框架，不是精算评分系统。
    claimRefs:
      - CR032
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 几类不同风险都可能传导到同一组收入、留存、利润率和估值结果。
    data:
      nodes:
        - id: r1
          label: 法律 / 隐私问题
        - id: r2
          label: 服务质量失误或集成失败
        - id: r3
          label: 客户不满或响应变慢
        - id: r4
          label: 流失上升 / 扩张走弱
        - id: r5
          label: 利润率压缩或增长放缓
        - id: r6
          label: 估值下降或融资压力
        - id: r7
          label: 竞争性捆绑压力
        - id: r8
          label: 财务不透明 / 投资人折价
      edges:
        - from: r1
          to: r3
        - from: r2
          to: r3
        - from: r3
          to: r4
        - from: r4
          to: r5
        - from: r5
          to: r6
        - from: r7
          to: r4
        - from: r8
          to: r6
        - from: r2
          to: r5
    approximationNotes: 这个 DAG 强调影响投资结果的因果路径，而不只是罗列孤立风险。
    claimRefs:
      - CR033
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Expel 的产品和结果取决于云平台、安全工具合作伙伴、客户行动和内部交付团队协调运转。
    data:
      nodes:
        - id: d1
          label: AWS / Microsoft / Google 遥测
        - id: d2
          label: Splunk / SecOps / 客户 SIEM 上下文
        - id: d3
          label: Workbench 和集成
        - id: d4
          label: 分析师配置和 playbook
        - id: d5
          label: 客户响应权限
        - id: d6
          label: 安全结果和续约信心
      edges:
        - from: d1
          to: d3
        - from: d2
          to: d3
        - from: d3
          to: d4
        - from: d4
          to: d5
        - from: d5
          to: d6
        - from: d3
          to: d6
          label: 工作流可见性影响信任
    approximationNotes: 这张图混合了技术和运营依赖，因为服务结果同时取决于两者。
    claimRefs:
      - CR034
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 只有私有指标证实业务质量、而不是与公开判断相矛盾时，建议才保持建设性。
    data:
      nodes:
        - id: n1
          label: 公开客户和产品证据较强
        - id: n2
          label: 当前隐含收入倍数 ~7x–9x
        - id: n3
          label: 私下尽调核查留存、利润率、资金续航期和集中度
        - id: n4
          label: 指标足够强，能支撑专业厂商溢价倍数
        - id: n5
          label: 推进 / 建设性投资
        - id: n6
          label: 如果指标不及预期，下调估值或暂停
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n3
          to: n6
    approximationNotes: 这套流程是投资决策抽象，不是公司运营流程。
    claimRefs:
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: Expel 的隐含估值倍数主要敏感于两个变量：采用哪一个公开收入估算，以及你假设私有业务质量是溢价还是仅仅合格。
    data:
      items:
        - label: 基于 $142.2M 收入的隐含倍数
          value: 7
          unit: x revenue / value anchor
        - label: 基于 $108.6M 收入的隐含倍数
          value: 9.2
          unit: x revenue / value anchor
        - label: SentinelOne 公开市场倍数
          value: 6.4
          unit: x revenue / value anchor
        - label: Rapid7 公开市场倍数
          value: 0.9
          unit: x revenue / value anchor
        - label: CrowdStrike 公开市场倍数
          value: 42
          unit: x revenue / value anchor
    approximationNotes: 公开公司价值以市值作为实用锚点；Expel 价值使用 $1.0B 私有估值标记和公开收入估算。
    claimRefs:
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 在收入估算和可能的质量结果下，当前 $1B 标记应放在情景区间中解读。
    data:
      items:
        - label: 当前隐含收入倍数（x）
          low: 7
          high: 9.2
          displayValue: 7.0x–9.2x
          detail: 取决于你使用 GetLatka 还是 StartupHub 的 2025 年收入估算。
          tone: neutral
        - label: 公开增长可比公司的校验区间（x）
          low: 6.4
          high: 42
          displayValue: 6.4x–42.0x
          detail: SentinelOne 是增长可比公司的低端，CrowdStrike 是精英龙头的高端。
          tone: positive
        - label: 倍数压缩风险锚点（x）
          low: 0.9
          high: 1.5
          displayValue: ~0.9x–1.5x
          detail: Rapid7 市值 / 收入式压缩，以及温和下行情景的锚点逻辑。
          tone: negative
    approximationNotes: 压缩锚点只是示意，不是预测；它用来说明私有估值对质量不及预期有多敏感。
    claimRefs:
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 这些紧凑指标最直接决定 Expel 当前私有估值是否公允。
    data:
      items:
        - label: 私有估值锚点
          value: $1.0B+
          unit: latest public mark
          note: 2021 年 Series E 公告称估值超过 $1B。
        - label: 2025 年收入估算
          value: $142.2M
          unit: GetLatka est.
          note: 倍数区间采用较高的公开收入估算。
        - label: 替代收入估算
          value: $108.6M
          unit: StartupHub est.
          note: 较低的公开估算会扩大隐含倍数。
        - label: 隐含倍数区间
          value: 7.0x–9.2x
          unit: revenue
          note: 核心公开估值读数。
        - label: SentinelOne 公开基准
          value: ~6.4x
          unit: revenue
          note: 保留样本里，它是最接近的增长软件公开市场校验点。
        - label: Rapid7 压缩基准
          value: ~0.9x
          unit: revenue / market cap signal
          note: 下行警示基准。
        - label: CrowdStrike 龙头基准
          value: ~42.0x
          unit: revenue
          note: 上限龙头基准，不是同类预期。
    approximationNotes: KPI 有意混合多个公开锚点，用来展示估值语境，而不是构成单一同质的交易筛选。
    claimRefs:
      - CV039
