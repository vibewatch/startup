  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代集合
        blocks:
          - type: paragraph
            body: >-
              Expel 竞争的不只是其他风投支持的 MDR 初创公司。实际选择集合包括 Arctic Wolf、Red Canary、ReliaQuest 和 Secureworks 等开放 XDR
              或共管专家；CrowdStrike 和 Rapid7 等把 MDR 打包进更大软件资产的上市平台供应商；以及已经配备 SOC 的大型组织选择自建。Red Canary 的 MDR
              解释材料明确把这个品类框定为现有团队的增强层或替代层，Arctic Wolf 和 CrowdStrike 则把自己的服务定位为广义安全运营平台的延伸。这意味着 Expel
              通常会被放在一张混合评分卡上评估：服务质量、上线速度、对第三方工具的覆盖广度、在云重型环境中的运营能力，以及买家是想要开放叠加层还是更完整的套件整合。因此，品类结构上竞争激烈，但替代集合足够分散，买家仍有充分理由选择
              Expel 这样的专家，而不是大型套件或内部自建。
            claimRefs:
              - CP001
              - CP006
              - CP014
              - CP018
              - CP021
              - CP022
