      - number: '8.3'
        title: 投资论点、反论点和情景逻辑
        blocks:
          - type: paragraph
            body: >-
              牛市情境很直接。Expel
              看起来确实有客户喜爱、很强的云和集成适配、明确的运营差异化，估值倍数相对一流网络安全增长资产也不苛刻。如果私人尽调确认毛利率健康、留存强劲，且资金跑道足以避免被动融资，那么拉长到多年维度，$1B
              估值可能显得保守。反论点同样清楚。如果公司的高端定位掩盖了扩张乏力、服务交付成本更高、客户集中，或明显的 SIEM
              产品缺口，那么当前估值可能已经吃掉大部分好消息。基准情境因此必须带条件。缺失的私人指标若给出正面答案，Expel
              在合适条款下可以投；但仅靠公开记录，还不足以支撑无条件的高确信判断。情景分析最该绑定收入质量，而不是英雄式 TAM 假设：牛市情境需要证明高效增长；熊市情境只需要留存、定价权或资本充足性小幅不及预期。
            claimRefs:
              - CV018
