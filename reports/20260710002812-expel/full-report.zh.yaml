      - number: '7.2'
        title: 运营与平台依赖风险驱动日常敞口
        blocks:
          - type: paragraph
            body: >-
              产品章节解释了为什么运营风险居中。Expel
              的价值取决于能否正确摄取客户遥测、保持数十项集成运转、优先处理真实威胁，并在真实事件中快到足以让客户信任服务。这会产生围绕漏报、连接器质量下降、检测噪声、人员压力和平台可靠性的失败模式。The Meet
              Group、Make-A-Wish、Markel 等客户都强调他们把多少责任转移给 Expel；这种信任是优势，也抬高了任何服务失误的严重性。依赖风险同样重要。Expel
              的开放叠加策略依赖云厂商、Microsoft、Google、Splunk 和其他第三方工具；这些工具的 API、权限、schema
              和商业激励都可能变化。更大的套件供应商也是战略依赖威胁，因为它们可以降低客户维持外部叠加层的动机。因此，公开风险不是某一个依赖，而是一条链：遥测访问、集成健康度、分析师工作流质量和客户响应授权必须同时稳住，产品才能交付价值。
