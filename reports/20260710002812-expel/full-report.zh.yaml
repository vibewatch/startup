  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格隐含了什么
        blocks:
          - type: paragraph
            body: >-
              最有用的起点，是公司最后一次公开估值锚。Expel 2021 年 Series E 轮公告称业务估值超过
              $1B，之后的官方融资沟通没有披露降价轮或新估值。用公开收入估计来看，这个锚隐含的估值倍数既不明显便宜，也谈不上激进。按 GetLatka 的 2025 年收入估计 $142.2M 计算，约为 7.0x 收入；按
              StartupHub 较低的 $108.6M 估计计算，约为 9.2x。这些数字远低于公开市场给 CrowdStrike、Palo Alto Networks 这类品类龙头的估值水平，但高于 Rapid7
              等增速更慢或更成熟的公开公司，也高于 Secureworks 最后一次公开估值状态。这正是投资判断更像权衡、而非二选一的原因。当前估值不要求 Expel 成为下一个 CrowdStrike；但它确实假设
              Expel 是一个耐久的高增长 MDR 资产，留存、利润率和扩张空间都过得去。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV037
      - number: '8.2'
        title: 公开和战略可比对象框定估值区间
        blocks:
          - type: paragraph
            body: >-
              保留的可比公司组显示，网络安全内部估值跨度极大。CrowdStrike 仍是高端异常值，市值 $202.02B，对应 2026 财年收入 $4.81B 和 ARR $5.25B。SentinelOne 2026
              财年收入突破 $1B 里程碑，ARR $1.119B，市值约 $6.44B，给出的公开市场倍数更贴地。Rapid7 市值 $0.76B，对比约 $832M ARR 和约 $840M
              年化收入，说明当增长和战略热度降温时，市场压缩可以很猛烈。Palo Alto Networks 则说明，一个定义品类的赢家如果有平台广度，能拿到什么估值。Secureworks 被收购前约 $0.75B
              的最后公开市值，是较小或战略差异化不足的 MDR 类资产的有用下行情境；Zscaler 披露的 Red Canary ARR 贡献，则提供了一个私人 MDR
              退出数据点，而不是完整的独立公开市场倍数。实际含义是，Expel 不该只按一个可比对象定价；更合理的定位，是有真实增长的高端专科标的，但披露和规模都明显不及市场领导者。
