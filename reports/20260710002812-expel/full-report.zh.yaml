      - number: '1.3'
        title: 资本基础、规模信号与公开指标不确定性
        blocks:
          - type: paragraph
            body: >-
              融资历史是最清晰的公开规模信号。Expel 2021 年 11 月的 Series E 新闻稿宣布融资 $140.3 million，估值超过 $1B；2022 年 10 月延展轮又增加 $30
              million，使官方累计融资达到 $288.8 million。Tracxn 的轮次历史印证了 6 轮融资，并将累计金额四舍五入为约 $289
              million。公开第三方追踪器随后给出方向性但并不完全一致的运营规模。GetLatka 估算 2025 年收入为 $142.2 million，2024 年为 $85.2 million；StartupHub
              给出较低的 $108.6 million 估算区间，IncFact 只把收入宽泛地列在 $100-500 million。员工数追踪器也分歧明显：Tracxn 在 2024 年实体快照中显示 419
              名员工，在后续公司趋势中显示 479 名员工，而 GetLatka 估算为 508 名员工。最稳妥的解读不是某个数据供应商一定错了，而是 Expel
              规模已经大到会被多家私营公司数据库覆盖，但仍未公开审计级或投资人级运营指标。这个证据足以支撑真实规模故事，却不足以消除围绕精确 ARR、效率和资金需求的尽调缺口。
