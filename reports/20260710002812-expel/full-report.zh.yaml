      - number: '8.4'
        title: 建议、终止触发因素和下一步尽调
        blocks:
          - type: paragraph
            body: >-
              基于公开信息的建议，是谨慎建设性，而不是已经充分承销。Expel
              明显好过投机性的尚未规模化资产：它有多垂直客户证明、可信产品，以及一个相对更广网络安全可比谱系并不明显虚高的估值锚。但公司恰好处在私人尽调最关键的区间。投资能成立，要满足四件事：收入质量确实经常性且在扩张；服务交付毛利特征可接受；客户集中度可控；现有现金和现金消耗水平能支撑增长，不用靠困境融资。若这些条件不成立，同一估值会很快显得偏满。因此，最终尽调问题比更多营销证明更重要。击穿投资论点的不该是抽象恐惧，而应是可量化证据：留存弱、隐藏集中、利润率受压、竞争替换上升，或资金跑道太短。简言之：推进，但必须设置严格尽调闸门；估值立场要奖励上行，也不能假装未知项很小。
