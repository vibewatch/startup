      - number: '2.3'
        title: 买方地图、采用路径与预算逻辑
        blocks:
          - type: paragraph
            body: >-
              MDR 的购买中心通常混合了安全负责人、原本要处理告警队列的运营团队，以及随着价格放大而介入的采购或财务。Gartner 式标准强调 24x7 人员覆盖、即时缓解能力和与业务风险对齐，因此付款方往往是 CISO
              或安全运营预算负责人，即便相邻工具由 IT 负责。Expel 的客户故事把这一点具体化。Qlik 的公开案例把评估框架放在云专业能力、Kubernetes 理解和接入现有技术栈的 API
              契合度上，指向的是技术成熟买家，而不是大宗服务采购方。Dayton Children’s 则把需求归因于精简医疗团队需要全天候覆盖，但不想增加大量内部人手。Expel 自己的客户调查称，很多客户在 30
              天内看到价值；这很重要，因为更短的价值兑现时间会降低外包检测与响应的实施风险感知。不过价格仍然关键。TrustRadius 公布了终端、云和 SaaS 套餐的起价，PeerSpot
              评论则指出，一些买家仍可能偏好带更完整托管 SIEM 组件的供应商。因此，这个品类更吸引已经拥有安全工具、但想加一层服务的云重型组织；对最小买家或寻求单一全栈方案的买家则更难。
