companyProfile:
  summary: >-
    Expel 是一家私营托管检测与响应公司，2016 年成立，总部位于弗吉尼亚州 Herndon。公司销售围绕 Expel Workbench 平台的软件赋能、共管式安全运营服务，广泛集成云、身份、SaaS
    和终端环境。公开证据支持其客户采用已有一定规模、产品契合云优先环境、历史估值超过 $1B，但许多承销关键指标仍未公开。
