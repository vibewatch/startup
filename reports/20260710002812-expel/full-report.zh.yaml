      - number: '1.2'
        title: 领导层、创始人与治理姿态
        blocks:
          - type: paragraph
            body: >-
              领导层披露好于财务披露。Expel 的 About 页面列出 Dave Merkel 为联合创始人兼 CEO，Justin Bajko 为联合创始人兼首席战略官，Yanek Korff
              为联合创始人兼首席运营官；同时列出 Greg Notch 为 CTO，Scott Fuselier 为 CRO，Jessica Dodson 为 CMO，Zach Blaine 为
              CFO。这些履历重要，因为高管团队反复出现 Mandiant、FireEye、AOL、CrowdStrike 和企业安全运营经验。这样的背景支撑了公司的叙事：Expel
              由一批实践者创立，他们不满于嘈杂、不透明的安全服务。治理透明度稍弱。Tracxn 和融资新闻稿指向来自 CapitalG 和 Paladin 相关人士的投资人董事席位，Tracxn 还列出 10 人董事会，但
              Expel 自己的公开页面没有发布权威董事名单或控制权摘要。对尽调的实际含义是：管理团队看起来可信且经验贴合，但董事会构成、投票控制和投资人保护仍需要私人材料确认，不能只靠公开网页。
