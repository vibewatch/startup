  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              MDR 并不等同于整个网络安全市场。公开市场指南和竞品材料都把 MDR 定义为一个由人主导、持续运营的服务层，把客户环境中的监控、检测、调查和响应组合起来。这个边界对 Expel
              很重要，因为这笔支出更接近外包或共管安全运营预算，而不是全部安全软件支出。实际替代方案包括内部 SOC 团队、传统 MSSP、SIEM 加 EDR 加托管 EDR
              等点工具组合，以及把托管响应打包进更大套件的平台供应商。CyberProof 的 2026 年 MDR 市场图谱和 Gartner 导向指南都强调，真正的 MDR
              供应商靠人主导的运营和可执行发现来区分自己，而不是只做工具监控。Expel 自己的材料也符合这个定义，重点强调透明度、集成和由分析师主导的修复。由此形成的市场窄于泛化的“网络安全”，宽于只覆盖终端的托管
              EDR，并正越来越向覆盖云、身份、终端、邮件和网络面的 MXDR 式方案收敛。
            claimRefs:
              - CM001
