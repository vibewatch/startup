      - number: '4.3'
        title: 成本结构、毛利率驱动因素与仍未知的问题
        blocks:
          - type: paragraph
            body: >-
              Expel 的商业模式应当比硬件或基础设施供应商更轻资本，因为服务靠软件、远程集成和分析师运营交付，而不是工厂、库存或现场部署车队。公开材料暗示的主要成本项包括安全分析师、威胁猎手、工程和自动化投入、云 /
              软件基础设施、客户成功，以及不断扩展的集成目录维护。Series E
              评论提到技术合作伙伴翻倍、调查量增加，并通过自动化提升分析师效率，这支持了一个判断：毛利率扩张取决于软件对人力的杠杆。但这不等于披露了毛利率。保留材料中没有任何公开来源提供毛利率、贡献毛利、净留存或单客户支持负担。CrowdStrike
              和 Rapid7 等上市公司可比对象展示了网络安全软件在规模化后可能具备的良好经济性，但它们不能替代 Expel 自己的数据，因为其产品组合和 GTM
              结构更广。财务模型因此仍是局部的：软件服务经济性可能有吸引力，但没有承销级证据证明毛利率轨迹或销售效率。
