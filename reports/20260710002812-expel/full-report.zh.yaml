  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险可管理，但披露不足
        blocks:
          - type: paragraph
            body: >-
              Expel 所处行业的法律和监管风险真实存在，即便公开层面没有明显执法新闻。MDR 供应商会处理敏感遥测、协调调查，并经常代表客户在云、身份、终端和 SaaS
              环境中采取行动。这会持续暴露在隐私、合同授权、证据处理和跨境数据治理问题下。World Economic Forum 和 Thomson Reuters 等公开宏观来源说明了为什么这在 2026
              年重要：网络威胁、欺诈、隐私义务和更广泛合规负担都在上升。Expel 自己的通知和安全合规页面显示，管理层至少在直接处理这类风险：公司称参与 Data Privacy Framework，任命 Data
              Protection Officer，说明 FTC 对 DPF 合规拥有管辖权，发布子处理方名单，并维护包括 ISO 27001、ISO 27701、SOC 2 Type II 和对齐 NIST 800-171
              的控制在内的正式安全与隐私项目。这些是有意义的缓释因素，但不等于看到了真实客户合同、监管函件或泄露处理文件。投资人仍应独立核验。同时，保留公开记录没有浮现明确针对 Expel
              的监管行动、重大诉讼或证券申报披露线索，因为公司是私营企业，而法律数据库需要比表层网页扫描更深入的案件级尽调。这不是一张干净的健康证明。它意味着投资人应把法律 /
              监管风险视为部分不透明，而不是已经被证伪。正确姿态是知道严重性、也尊重证据边界：暴露路径明显，部分缓释因素可见，但公开诉讼或执法可见性不完整。
            claimRefs:
