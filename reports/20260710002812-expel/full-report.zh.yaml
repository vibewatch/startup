  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 官方页面和分析师认可材料显示，公司从创立到平台发布、相邻产品扩张、独角兽融资、地域扩张和伙伴驱动扩张，路径稳步推进。
    data:
      items:
        - date: 2016-05
          label: 创立
          detail: Expel 围绕从业者主导的 MDR 论点启动。
          tone: positive
