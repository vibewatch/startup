  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 谁购买并使用 Expel
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Expel
              的客户基础与其说由公司规模定义，不如说由一个反复出现的运营模式定义：组织有明显的云、身份或混合工具复杂度，但仍想要共管安全伙伴，而不是完整的单一供应商套件。具名参考覆盖金融科技、保险、医疗、非营利组织、制药、数据智能软件和消费者互联网平台。在这些细分中，用户通常是内部安全团队，买方通常是安全负责人或基础设施
              / 安全经理，付款方看起来是安全预算或更广义 IT 预算负责人。多个案例强调，客户希望把小团队从持续告警分诊中释放出来，同时仍获得有深度的检测与响应。这让 Expel
              对精简但成熟的团队尤其相关：这些买家懂得集成、云检测和响应上下文的价值，但不想雇用大型 24x7 SOC。共同用例因此不是泛泛的“安全外包”，而是内部团队在告警太多、专家太少或云复杂度过高时获得运营杠杆。
