      - number: '2.2'
        title: 多视角测算市场空间
        blocks:
          - type: paragraph
            body: >-
              公开市场规模估算方向一致，但数字不完全相同。Mordor Intelligence 估算 MDR 市场 2025 年为 $4.19 billion、2026 年为 $5.09 billion，2031 年达到
              $13.45 billion，对应 21.45% CAGR。MarketsandMarkets 给出的 2026 年起点更高，为 $6.22 billion，2031 年预测为 $17.64 billion，对应
              23.2% CAGR。ResearchAndMarkets 和 CyberProof 都强化了一个事实：品类现在覆盖的不只是传统终端监控，这也解释了为什么不同发布方会得出不同总量。对 Expel
              来说，最有用的视角不是单一 TAM 数字，而是这些估算叠加地理和垂直行业公开证据后形成的区间。Mordor 称北美占 2025 年收入的 45.78%，BFSI 占
              28.74%，医疗也是增长最快的垂直行业之一。把这些市场视角与 GetLatka 对 Expel 2025 年 $142.2 million 收入估计合并来看，Expel 在全球 MDR
              市场只占低个位数份额，即便分母有噪声，也意味着仍有增长空间。同时，公开证据还不够细，无法按细分市场、区域或客户规模拆出 Expel 精确的 SAM 或 SOM。
