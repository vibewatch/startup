              Gartner 材料进一步说明，买家和分析师把 Expel 视为正当的 MDR
              领导者，而不是小众工具供应商。即便如此，公司概览仍有投资人关心的未解缺口：精确客户数未公开，毛利率和烧钱速度未披露，公开员工数追踪器互相矛盾，甚至官方 MTTR
