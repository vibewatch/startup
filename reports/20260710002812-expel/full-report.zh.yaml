  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Expel 的公开变现方式更像经典合同制 MDR 收入，而不是使用量驱动消费或市场抽成。公司在终端、云和 SaaS 场景销售托管安全套餐，TrustRadius
              展示了部分套餐的清单式起价。官方材料进一步说明，Expel
              的变现方式是在客户已有信号之上叠加分析师运营、自动化和集成，这意味着收入更可能是与资产数量或受保护环境绑定的经常性服务收入，而不是一次性部署收入。公开牵引力可见，但仍主要来自第三方估计。GetLatka 报告
              Expel 2024 年收入为 $85.2 million、2025 年为 $142.2 million；StartupHub 估算年收入约 $108.6 million；IncFact 则把公司放在很宽的
              $100–$500 million 区间。来源差异很大，但方向一致：Expel 已不再是早期、尚未规模化的初创公司。经常性合同和嵌入式工作流可能改善收入质量，但公开数据还不足以把类订阅 MDR ARR
              与专业服务、事件响应或相邻产品收入拆开。
