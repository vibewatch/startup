  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: sample
      basis: >-
        Rows cover a mix of public cyber platforms, a last-public-value downside anchor, and Expel’s implied private
        mark to bracket realistic valuation regimes rather than define a single exact peer set.
    columns:
      - 公司
      - 当前估值锚
      - 收入 / ARR 锚
      - 隐含倍数 / 信号
      - 启示
    rows:
      - - CrowdStrike
        - ~$202.02B 市值
        - FY2026 收入 $4.81B；ARR $5.25B
        - ~42.0x 收入
        - 龙头上限倍数远高于 Expel 需要证明合理的水平。
      - - SentinelOne
        - ~$6.44B 市值
        - FY2026 收入 $1.001B；ARR $1.119B
        - ~6.4x 收入
        - 更接近规模尚小但有分量的网络安全公司的上市增长软件基准。
      - - Rapid7
        - ~$0.76B 市值
        - ARR $832M；年化收入约 ~$840M
        - ~0.9x 收入 / 市值信号
        - 增长和市场热度降温后，倍数可能被压得很深。
      - - Palo Alto Networks
        - ~$275.72B 市值
        - Q3 FY2026 收入 $3.0B；NGS ARR $8.1B
        - 极高平台倍数
        - 上限平台赢家基准，不是完全可比的同业。
      - - Secureworks（最后公开状态）
        - ~$0.75B 市值
        - 已被收购 / 退市；最后公开市值信号
        - 下行锚，不是增长倍数可比对象
        - 这提醒我们，规模较小的 MDR 相关资产也可能以温和估值交易。
      - - Expel 隐含
        - ~$1.0B 私募估值锚
        - 2025 年收入估计 $108.6M–$142.2M
        - ~7.0x–9.2x 收入
        - 需要真实质量，但不需要顶级上市龙头经济性。
    notes: 倍数为近似值，并把市值作为务实的公开价值锚；私营公司折价和净现金并非每一行都完全可见。
