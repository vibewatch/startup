      - number: '3.4'
        title: 耐久点与脆弱点
        blocks:
          - type: paragraph
            body: >-
              Expel 的公开护城河看起来真实，但中等强度，并非牢不可破。最清晰的耐久要素是工作流信任、集成覆盖、快速价值兑现，以及围绕 Workbench
              的透明度叙事。这些东西很难立刻复制，因为它们依赖分析师流程、产品设计和累积集成，而不只是销售材料。即便如此，它们并非不可触碰。CrowdStrike、Rapid7 和 Sophos/Secureworks
              可以在更广的软件关系中交叉补贴 MDR。Arctic Wolf 可以依靠规模和礼宾式模式，ReliaQuest 和 Red Canary 也能用类似 Expel
              部分话术的开放平台、分析师主导叙事竞争。同行反馈还暴露出一个尖锐脆弱点：想要托管 SIEM 或捆绑日志存储的买家，可能偏好其他平台或要求合作伙伴叠加。换句话说，买家重视速度、开放性和共管运营时，Expel
              的护城河最强；当 RFP 优先考虑套件广度、捆绑经济性或单一供应商数据平面所有权时，护城河会变弱。
