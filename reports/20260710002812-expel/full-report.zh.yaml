    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              Expel 将自己定位为一家 MDR 供应商，目标是让客户拥有现代化 SOC，而不必替换现有工具。公司首页、About 页面、Workbench 材料和客户案例都反复描述一种共管模式：Expel
              分析师全天候运转，靠 API 和集成接入而不是重型替换式部署，并通过 Expel Workbench 平台暴露工作过程。这个组合很重要，因为它把 Expel 与传统 MSSP
              和完全外包的黑箱服务区分开。公开的公司和市场画像页面也指向稳定的身份事实：Expel 成立于 2016 年，总部位于弗吉尼亚州 Herndon，销售
              MDR、钓鱼响应、云监控和漏洞优先级排序能力。官方材料的主线很清楚：技术带来速度，人提供上下文、判断和面向客户的响应。公开证据足以说明 Expel
              卖什么、希望被如何理解，但对精确当前收入、客户数量和利润率结构等经审计的公司规模披露仍偏薄。
