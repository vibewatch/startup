  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Expel 实际交付什么
        blocks:
          - type: paragraph
            body: >-
              Expel 的产品应理解为 MDR 的操作系统，而不是单一点工具。官方页面显示，公司把终端、云、SaaS、钓鱼攻击和漏洞优先级排序工作流打包成覆盖能力，并全部连接到
              Workbench。服务定义很重要，因为买家购买的不只是软件——他们买的是基于既有遥测的分析师判断、响应运营和自动化。公开产品页面反复强调，Expel
              使用客户已经部署的工具和信号，而不是要求全面替换式部署。因此，交付资产是集成层、工作流 UI、检测内容、调查套路和人工运营模式的组合。这也解释了为什么产品目录看起来比简单 MDR SKU
              清单更宽：每个套餐或附加项都会扩展 Workbench 可监控或可执行动作的表面。技术承销问题因此不是“Expel 有没有代理？”，而是“Workbench 能多有效地在众多环境中归一化、排序、调查并协调行动？”
