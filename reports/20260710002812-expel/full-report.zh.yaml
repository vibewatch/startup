              Expel 的公开时间线展示了从创立到规模化运营平台的连贯搭建。官方里程碑称，公司 2016 年 5 月启动，2017 年 6 月推出 Expel Workbench 并拿下首个客户，2020 年 10
              月推出托管钓鱼响应，2021 年 11 月跻身独角兽，2022 年 10 月扩展到 EMEA，2023 年 9 月重启合作伙伴计划。当前产品和客户材料给出的不只是时间顺序，还有运营证据。首页和 Workbench
