      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 品类增长是结构性的，不只是周期性的
            body: 即使精确市场口径不一致，公开证据在核心点上相互印证：攻击复杂度、云蔓延、人才短缺和合规压力不会消失，组织正在把更多威胁检测与响应工作外包。这个结构性需求背景支撑了市场对 Expel 模式的持久兴趣。
            calloutType: strength
            claimRefs:
