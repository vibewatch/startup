      - - 基准
        - 业务质量不错但并非卓越；留存和利润率可接受，但不到顶级
        - 当前 $1B 估值标记大体公允
        - 指标足以撑住估值，但不足以显著重估。
      - - 悲观
        - 留存、集中度或跑道不及预期；捆绑压力和 SIEM 缺口导致的流失上升
        - 当前标记偏满，可能明显压缩
        - 续约质量偏弱、隐藏集中度或融资需求出现证据。
    notes: 这些情景绑定尽调能实际核验的指标，而不是宽泛的 TAM 叙事。
