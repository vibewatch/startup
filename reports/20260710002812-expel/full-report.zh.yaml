  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 视角
      - 支持证据
      - 可能击穿因素
      - 投资含义
    rows:
      - - 正向论点：具备真实产品市场契合度的高端专精厂商
        - 具名客户、云适配、更快上线、集成深度、可信的收入规模
        - 私有指标显示留存差、交付成本高或集中度高
        - 如果单位经济模型健康，当前 $1B 标记可能仍有上行空间。
      - - 反向论点：好叙事已经计入价格
        - 当前估值已经隐含不低的质量和增长
        - 留存、现金续航期或竞争输单一旦低于预期，倍数会压缩
        - 尽调结果弱时，安全边际不够宽。
      - - 正向论点：可比公司估值正常化带来的专精厂商上行空间
        - 当前隐含倍数远低于顶级上市龙头
        - 公司始终无法证明自己配得上龙头级经济性
        - 仍有上行空间，但前提是 Expel 更像高质量增长型软件，而不是重人力服务。
      - - 反论点：捆绑和 SIEM 预期削弱专精价值
        - 同行评测提到的 SIEM 缺口和平台捆绑风险都是真问题
        - 如果这一缺口造成客户流失或定价压力，专精厂商溢价会削弱
        - 支付增长倍数前，必须紧盯赢单 / 输单原因。
    notes: 这张表有意保持对称：公开记录既支持建设性解读，也支持谨慎解读。
