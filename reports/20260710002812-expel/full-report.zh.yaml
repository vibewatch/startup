            figureRef: FP001
            claimRefs:
              - CP033
      - number: '3.2'
        title: 直接同行与捆绑式既有厂商
        blocks:
          - type: paragraph
            body: >-
              从公开规模看，Expel 远小于最大的几个平台竞争对手。CrowdStrike 在 2026 财年末 ARR 达到 $5.25 billion、收入为 $4.81 billion；Rapid7 报告 ARR 为
              $832 million、季度收入 $210 million，客户超过 11,500 家。Arctic Wolf 对外宣传拥有 10,000 多家全球客户、1,000 多名安全工程师和 200
              多项集成。相比之下，Expel 的公开融资历史和第三方公司画像显示，它是规模小得多但仍有分量的独立玩家，2021–2022 年有独角兽估值标记，2025 年收入估计约 $142
              million。因此，最相关的比较不是绝对体量，而是产品和运营模式。Expel 更接近开放、共管的同行，可以插入现有安全栈，而不是一个完全自足的套件供应商。Sophos 收购 Secureworks
              也很重要，因为它显示品类正在整合：曾经独立的传统供应商越来越多地变成大型平台里的功能或业务线。
