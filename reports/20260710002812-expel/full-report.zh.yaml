      - number: '4.4'
        title: 资本充足性、融资依赖与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              官方融资历史显示，Expel 2021 年底 Series E 融资 $140.3 million，估值超过 $1B，随后在 2022 年延展该轮，使累计融资达到 $288.8 million。GetLatka
              仍报告较低的延展前累计融资 $257.8 million；这个差异有用，因为它凸显了部分第三方追踪器与公司自身更新总额之间的差距。保留材料中没有公开证据显示 2022
              年延展轮之后出现新股权融资，这意味着公司必须依靠既有资本和经营表现来支撑增长，而不是反复融资。这在方向上积极，但现金充足性无法公开证明，因为这家私营公司没有资产负债表或烧钱披露。上市可比公司有助于框定品类资本强度：Rapid7
              和 CrowdStrike 都披露了可观的经常性收入基础和公开市场估值，而 Secureworks 被收购前最后的公开市值只有约 $0.75
              billion，显示结果区间很宽。财务结论因此混合但可推进：收入增长看起来可信，实物资本强度看起来低，历史融资规模也不小；但投资人在自信承销估值或下行保护之前，仍需要烧钱速度、毛利率、NRR、客户集中度和现金跑道的私有数据。
