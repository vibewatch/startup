      - number: '2.4'
        title: 增长驱动、约束及其对 Expel 的含义
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动来自结构性因素，而不是周期。Mordor 和 Thomson Reuters 都指向攻击复杂度上升、合规压力增加，以及熟练防御人才缺口扩大。CyberProof 还指出 MDR 正扩展到
              MXDR、CTEM 和 AI 辅助工作流；Red Canary 的 MDR 解释材料则引用了企业买家的强评估意愿。Expel
              对这些趋势的站位不错，因为其公开材料已经强调云覆盖、自动化和共管运营。约束也同样真实。Mordor 强调中小企业的总拥有成本较高，以及数据主权顾虑可能切碎遥测并推高交付成本。同行评论证据显示，托管 SIEM
              预期等功能缺口在竞争评估中仍会产生影响。上市公司和私营平台竞品的规模跨度也极大，从 CrowdStrike 这样的高增长云领导者，到 Rapid7 和 Sophos/Secureworks
              这类更强调性价比或正在整合的平台。对 Expel 来说，这意味着市场增长本身还不够：公司仍必须在透明度、集成、价值兑现速度和可衡量结果上取胜，同时证明自己能以经济可行的方式跨区域、跨垂直行业扩张。
