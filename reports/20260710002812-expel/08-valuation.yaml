- id: thesis-and-scenarios
  title: Thesis, anti-thesis, and scenario logic
  body: 'The bull case is straightforward. Expel appears to have real customer love, strong cloud and integration fit, meaningful operational differentiation, and a valuation multiple that is not demanding relative to best-in-class cyber growth assets. If private diligence confirms healthy gross margins, strong retention, and enough runway to avoid reactive fundraising, then a $1 billion mark could prove conservative over a multi-year horizon. The anti-thesis is equally clear. If the company’s premium positioning masks weak expansion, higher service-delivery cost, customer concentration, or a meaningful SIEM-related product gap, then the current valuation could already reflect most of the good news. The base case therefore has to be conditional. Expel looks investable at the right terms if the missing private metrics resolve favorably, but the public record alone is not strong enough to support an unconditional conviction call. Scenario analysis is most useful when tied to revenue quality
    rather than heroic TAM assumptions: a bull case needs proof of efficient growth, a bear case needs only modest disappointment on retention, pricing power, or capital adequacy.'
  claimRefs:
  - CV018
  - CV019
  - CV020
  - CV021
  - CV022
