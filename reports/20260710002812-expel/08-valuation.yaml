- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: Rows cover a mix of public cyber platforms, a last-public-value downside anchor, and Expel’s implied private mark to bracket realistic valuation regimes rather than define a single exact peer set.
  columns:
  - company
  - current value anchor
  - revenue / ARR anchor
  - implied multiple / signal
  - implication
  rows:
  - - CrowdStrike
    - ~$202.02B market cap
    - FY2026 revenue $4.81B; ARR $5.25B
    - ~42.0x revenue
    - Upper-bound leader multiple far above what Expel would need to justify.
  - - SentinelOne
    - ~$6.44B market cap
    - FY2026 revenue $1.001B; ARR $1.119B
    - ~6.4x revenue
    - Closer public growth-software benchmark for a sub-scale but meaningful cyber company.
  - - Rapid7
    - ~$0.76B market cap
    - ARR $832M; annualized revenue roughly ~$840M
    - ~0.9x revenue / market cap signal
    - Shows how hard multiples can compress when growth and enthusiasm cool.
  - - Palo Alto Networks
    - ~$275.72B market cap
    - Q3 FY2026 revenue $3.0B; NGS ARR $8.1B
    - Very high platform multiple
    - Upper-bound platform winner benchmark, not a like-for-like peer.
  - - Secureworks (last public state)
    - ~$0.75B market cap
    - Acquired / delisted; last-public market cap signal
    - Downside anchor, not a growth multiple comp
    - Useful reminder that smaller MDR-related assets can trade at modest values.
  - - Expel implied
    - ~$1.0B private valuation anchor
    - 2025 revenue est. $108.6M–$142.2M
    - ~7.0x–9.2x revenue
    - Requires real quality, but not elite public-leader economics.
  notes: Multiples are approximate and use market cap as a practical public-value anchor; private-company discounting and net cash are not fully observable for all rows.
