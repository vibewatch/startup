- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - lens
  - supporting evidence
  - what could break it
  - investment implication
  rows:
  - - 'Thesis: premium specialist with real product-market fit'
    - Named customers, cloud fit, faster onboarding, integration depth, plausible revenue scale
    - Private metrics reveal poor retention, high delivery cost, or concentration
    - Could support upside from current $1B mark if unit economics are healthy.
  - - 'Anti-thesis: good narrative already priced'
    - Current valuation already implies meaningful quality and growth
    - Any disappointment on retention, runway, or competitive losses compresses multiple
    - Margin of safety is not wide enough for weak diligence results.
  - - 'Thesis: specialist upside through comp normalization'
    - Current implied multiple is well below elite public leaders
    - Company never proves it deserves leader-like economics
    - Upside exists, but only if Expel behaves more like high-quality growth software than labor-heavy services.
  - - 'Anti-thesis: bundling and SIEM expectations erode specialist value'
    - Peer-review SIEM gap and platform bundling risk are real
    - If gap drives losses or pricing pressure, specialist premium weakens
    - Must monitor win/loss reasons closely before paying growth multiple.
  notes: 'This table is intentionally symmetrical: the public record supports both a constructive and a cautious reading.'
