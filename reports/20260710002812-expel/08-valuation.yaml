- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation read
  - key trigger
  rows:
  - - Bull
    - Private diligence confirms strong NRR, good margins, manageable concentration, and enough runway
    - Current $1B mark looks conservative and supports upside
    - Healthy retention and margin data plus no financing stress.
  - - Base
    - Business quality is good but not exceptional; retention and margins are acceptable, not elite
    - Current $1B mark is broadly fair
    - Metrics are solid enough to hold the valuation but not re-rate dramatically.
  - - Bear
    - Retention, concentration, or runway disappoint; bundling pressure and SIEM-gap losses rise
    - Current mark looks full and could compress materially
    - Evidence of weak renewal quality, hidden concentration, or financing need.
  notes: Scenarios are tied to metrics that diligence can actually verify rather than broad TAM rhetoric.
