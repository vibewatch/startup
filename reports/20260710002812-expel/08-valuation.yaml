- id: recommendation
  title: Recommendation, kill triggers, and next diligence
  body: 'The public-information recommendation is cautiously constructive rather than fully underwritten. Expel appears meaningfully better than a speculative pre-scale asset: it has multi-vertical customer proof, a credible product, and a valuation anchor that does not look obviously inflated versus the broader cyber comp spectrum. But the company also sits in the exact zone where private diligence matters most. The investment can work if four things are true: revenue quality is genuinely recurring and expanding, service delivery has acceptable gross-margin characteristics, customer concentration is manageable, and current cash plus burn supports growth without distressed financing. If those conditions fail, the same valuation can quickly look full. That is why the final diligence asks matter more than further marketing proof. The thesis should be broken not by abstract fear, but by measurable evidence of weak retention, hidden concentration, margin compression, rising competitive displacement,
    or short runway. In short: proceed, but only with disciplined diligence gates and a valuation stance that rewards the upside without pretending the unknowns are small.'
