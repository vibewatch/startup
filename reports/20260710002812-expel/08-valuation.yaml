company:
  name: Expel
chapter:
  number: 8
  title: Valuation
  summary: At roughly a $1.0 billion valuation against estimated 2025 revenue of about $108.6–$142.2 million, Expel screens at an implied ~7x–9x revenue multiple. That looks materially cheaper than elite public cyber platform leaders and roughly in line with or modestly above mid-tier/public-growth security vendors, which makes the current price plausible rather than obviously stretched—but only if private diligence confirms retention quality, gross margin, concentration, and runway.
sections:
- id: frame
  title: What the current price is implicitly saying
  body: The most useful starting point is the company’s last public valuation anchor. Expel’s 2021 Series E announcement said the business was valued at more than $1 billion, and subsequent official funding communications did not report a down round or new mark. Against public revenue estimates, that anchor implies a valuation multiple that is neither obviously cheap nor obviously aggressive. Using GetLatka’s 2025 revenue estimate of $142.2 million implies about 7.0x revenue; using StartupHub’s lower $108.6 million estimate implies about 9.2x. Those numbers are far below the valuation levels public markets assign to category leaders like CrowdStrike and Palo Alto Networks, but they sit above slower-growth or more mature public names such as Rapid7 and the last public valuation state of Secureworks. That is exactly why the investment case is balanced rather than binary. The current valuation does not require Expel to become the next CrowdStrike, but it also does assume that the company is
    a durable premium-growth MDR asset with respectable retention, margins, and expansion headroom.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  tableRefs: []
  figureRefs:
  - FV002
- id: comp-set
  title: Public and strategic comparables bracket the range
  body: The retained comp set shows a very wide valuation spread inside cybersecurity. CrowdStrike remains the high-end outlier, with $202.02 billion of market cap against $4.81 billion of fiscal 2026 revenue and $5.25 billion of ARR. SentinelOne closed fiscal 2026 above the $1 billion revenue milestone with $1.119 billion of ARR and about $6.44 billion of market value, producing a much more grounded public multiple. Rapid7’s $0.76 billion market value against roughly $832 million of ARR and around $840 million of annualized revenue shows how compressed the market can get when growth and strategic enthusiasm cool. Palo Alto Networks shows what scaled platform breadth can command in a category-defining winner. Secureworks’ last public market-cap level near $0.75 billion before acquisition is a useful downside case for a smaller or less strategically differentiated MDR-related asset, while Zscaler’s disclosed Red Canary ARR contribution gives a private-MDR exit datapoint rather than a full
    standalone public multiple. The practical implication is that Expel should not be valued off one comp; it should be valued as a premium specialist with real growth but materially less disclosure and scale than the market leaders.
  claimRefs:
