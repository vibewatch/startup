- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Retention quality
    - NRR / GRR below underwriteable threshold
    - Meaningful weakness versus premium-software expectations
    - Re-rate to lower multiple and reconsider position.
  - - Customer concentration
    - Top-account or vertical concentration materially higher than expected
    - Single customer or narrow vertical drives outsized ARR
    - Increase downside weighting and renegotiate terms if possible.
  - - Service economics
    - Gross margin materially below healthy software-enabled service levels
    - Limited operating leverage despite growth
    - Treat business as lower-quality services asset rather than premium software-service hybrid.
  - - Competitive pressure
    - Win/loss data shows mounting suite displacement or SIEM-gap losses
    - Recurring displacement by bundled platforms
    - Reduce terminal-multiple assumptions and expansion expectations.
  - - Liquidity
    - Short runway without credible plan
    - Need for reactive financing or unfavorable terms
    - Pause or reset valuation stance.
  notes: Each trigger is meant to be verifiable in diligence rather than inferred from general market sentiment.
  claimRefs:
  - CV030
  - CV031
  - CV032
  - CV033
- id: TV006
  title: Final diligence asks table
  columns:
  - question
  - why it matters
  - decision impact
  rows:
  - - What are current NRR, GRR, and logo churn by cohort?
    - Determines whether current valuation multiple is supported by durable revenue quality
    - High
  - - What is gross margin by core package and how is it trending?
    - Separates software leverage from labor-heavy service economics
    - High
  - - What are current cash, burn, and runway?
    - Determines downside resilience and financing risk
    - High
  - - What is top-10 customer concentration and ARR by segment?
    - Tests whether strong public logos mask concentrated exposure
    - High
  - - How often does Expel lose to bundled platforms or SIEM expectations?
    - Determines durability of the specialist thesis
    - Medium-high
  - - What is attach-rate and expansion performance for cloud, phishing, and adjacencies?
    - Determines whether land-and-expand is real or mostly narrative
    - Medium-high
  notes: If these asks resolve positively, the current valuation can be supported; if they resolve poorly, the same price becomes difficult to defend.
  claimRefs:
  - CV027
  - CV028
  - CV029
  - CV034
  - CV035
