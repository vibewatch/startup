chapter:
  number: 3
  title: Competitors
  summary: Expel competes in a crowded MDR field that includes open-XDR specialists, bundled public-platform vendors, legacy managed-security incumbents, and the do-nothing/internal-build status quo. Its clearest public differentiation is the combination of broad integrations, visible Workbench workflows, and quick onboarding, but larger rivals bring broader suites, larger installed bases, and greater pricing leverage.
sections:
- id: landscape
  title: Competitive landscape and substitute set
  body: 'Expel does not compete only with other venture-backed MDR startups. The practical choice set includes open-XDR or co-managed specialists such as Arctic Wolf, Red Canary, ReliaQuest, and Secureworks; public-platform vendors such as CrowdStrike and Rapid7 that bundle MDR into larger software estates; and the internal-build path for large organizations that already staff a SOC. Red Canary’s MDR explainer explicitly frames the category as an augmentation or replacement layer for existing teams, while Arctic Wolf and CrowdStrike position their services as extensions of a broad security-operations platform. That means Expel is usually judged on a mixed scorecard: service quality, onboarding speed, breadth across third-party tools, ability to operate in cloud-heavy environments, and whether a buyer wants an open overlay or a fuller suite consolidation play. The category is therefore structurally competitive, but the substitute set is fragmented enough that buyers still have meaningful
    reasons to choose a specialist like Expel over a mega-suite or an in-house build.'
  claimRefs:
  - CP001
  - CP006
  - CP014
  - CP018
  - CP021
  - CP022
  tableRefs: []
  figureRefs:
  - FP001
- id: profiles
  title: Direct peers versus bundled incumbents
  body: 'On public scale, Expel sits well below the largest platform competitors. CrowdStrike ended fiscal 2026 with $5.25 billion of ARR and $4.81 billion of revenue, while Rapid7 reported $832 million of ARR, $210 million of quarterly revenue, and more than 11,500 customers. Arctic Wolf markets 10,000-plus global customers, 1,000-plus security engineers, and 200-plus integrations. By contrast, Expel’s public funding history and third-party company profiles point to a much smaller but still meaningful independent player, with a unicorn valuation marker from 2021–2022 and estimated 2025 revenue around $142 million. The most relevant comparison is therefore not raw size but product and operating model. Expel is closer to open and co-managed peers that plug into an existing security stack than to a fully self-contained suite vendor. Sophos’s acquisition of Secureworks also matters because it shows the category is consolidating: legacy providers that once stood alone increasingly become features
    or business lines inside a larger platform.'
  claimRefs:
  - CP003
  - CP004
  - CP005
  - CP007
  - CP008
  - CP020
  - CP023
  tableRefs:
  - TP001
  figureRefs:
