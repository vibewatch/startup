  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: true win-loss dynamics
    missingEvidence: Competitive win rates, competitor-specific displacement data, and renewal outcomes by segment.
    whyItMatters: Public materials reveal positioning but not whether Expel actually converts or retains better against specific rivals.
    diligencePath: Request last-12-month win/loss report by named competitor, segment, and ACV band.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: apples-to-apples pricing
    missingEvidence: Quoted packages and discounting across Expel, Arctic Wolf, CrowdStrike, Rapid7, Red Canary, and Sophos/Secureworks.
    whyItMatters: Pricing opacity prevents a clean underwriting view of competitive intensity and margin pressure.
    diligencePath: Collect recent anonymized proposals or pricing sheets from active evaluations.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: minor
    topic: managed SIEM gap severity
    missingEvidence: Frequency with which managed-SIEM requirements cause RFP losses.
    whyItMatters: The PeerSpot comment is useful but anecdotal; investors need quantified evidence before treating it as a thesis breaker.
    diligencePath: Request loss-reason coding and product-roadmap response for logging and SIEM-adjacent asks.
