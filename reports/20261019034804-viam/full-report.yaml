      - number: '4.2'
        title: Public traction and unit-economics evidence
        blocks:
          - type: paragraph
            body: >-
              The public record is stronger on product scope than on operating performance. Viam's materials show
              multi-vertical positioning across manufacturing, marine, climate, logistics, and entertainment, and the
              Tech Mahindra announcement adds a concrete enterprise-channel signal for industrial deployments. However,
              the evidence set does not disclose revenue, ARR, gross margin, retention, CAC, payback, customer count, or
              customer concentration. The only hard staffing proxy in the assigned pool is TechCrunch's March 2024 note
              that Viam was expanding a 100-person headcount, while the current company page only says the team is
              growing across the US and Europe. That means most classic software and automation unit-economics metrics
              remain diligence asks rather than investment-grade facts.
