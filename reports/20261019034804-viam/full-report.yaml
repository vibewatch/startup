  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public product surfaces consistently frame Viam as a software layer for heterogeneous robotics deployments
              rather than as a hardware OEM. The strongest supported commercial read-through is a control-plane model:
              developers configure machines, deploy modules and models, operate fleets remotely, and can apply staged
              updates across many machines. That operating pattern supports recurring software revenue and usage-linked
              monetization, while the company's public "free account" call to action suggests a self-serve or pilot
              entry point before larger enterprise contracts. What is missing is the actual commercial packaging that
              matters for underwriting: no retained public source here discloses Viam's own list prices, discounting
              behavior, contract minimums, renewal structure, or the split between platform subscriptions, services, and
              any pass-through infrastructure charges.
