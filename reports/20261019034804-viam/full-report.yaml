              coverage repeat the same use cases: industrial deployment, remote fleet management, predictive
              maintenance, and OTA updates. The same announcement adds two useful scale signals—a Hannover Messe
              demonstration shown to 110,000-plus manufacturing leaders and Tech Mahindra's own 1,100-client
              footprint—but those signals indicate route-to-market reach and category relevance, not verified production
