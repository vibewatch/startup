        title: Public scale signals and 2025-2026 refresh milestones
        blocks:
          - type: paragraph
            body: |-
              Public scale evidence is directional rather than investment-grade.
              Dealroom and Oryndex agree that Viam has progressed to Series C and raised
              substantial capital, but they do not converge on a precise current
              headcount and they do not provide an exact reader-usable valuation. The
              most current negative signal in the retained pool is mild rather than
              thesis-breaking: Dealroom reports web traffic down 10.3% over three months
              and one-year team growth at -0.4%, while EquityZen reminds readers that
              private-company secondary access remains speculative and illiquid. Against
              that caution, the refreshed milestone set is active: public references show
              a 2025 Universal Robots partnership and 2026 partnership, education, and
              demo announcements, which indicate continuing go-to-market and product
              activity even though revenue and customer scale remain undisclosed.
