              - CP006
              - CP010
              - CP011
              - CP014
      - number: '3.3'
        title: Durability depends on overcoming pricing and integration friction
        blocks:
          - type: paragraph
            body: >-
              Durability is not only about feature breadth; it is about whether buyers accept the platform's economic
              and workflow tradeoffs. The same independent review that praises Viam's scope also flags three
              moat-limiting issues: usage-based billing can be harder to plan around in data-heavy deployments, users
              must learn Viam-specific configuration concepts, and industrial system integration appears less native
              than the core robotics and machine-learning workflows.


              Those frictions are exactly where substitutes can win. A buyer can keep more control with an internal
              stack, hand deployment risk to an integrator, or buy a narrower turnkey outcome instead of a general
              platform. Public pricing also shows Viam can attack both self-serve developer budgets and
              packaged-solution budgets, but the retained pool does not provide enterprise discounting or
              apples-to-apples peer pricing, so the chapter's underwriting takeaway is positioning strength with
              unresolved price-to-value proof.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP010
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated scope is the main competitive wedge
            body: >-
              The retained evidence repeatedly pairs hardware abstraction, fleet operations, ML deployment, and
              customer-facing tooling, which makes Viam harder to replace with a single point solution.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
          - type: callout
            title: Pricing predictability and integration depth are the easiest attack surfaces
            body: >-
              Independent review highlights usage-based billing, Viam-specific configuration concepts, and weaker native
              industrial integration, so displacement does not require a better full-stack rival; it only requires a
              buyer whose economics or systems constraints favor a narrower alternative.
            calloutType: risk
            claimRefs:
