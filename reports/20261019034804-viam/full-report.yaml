  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform definition and architecture
        blocks:
          - type: paragraph
            body: >-
              Viam's public materials consistently describe the company as a software platform for building, deploying,
              and managing robotics applications rather than as a single fixed robot product. The core abstraction is
              the machine: a combination of compute and attached hardware whose behavior is declared in JSON
              configuration and resolved into resources, components, services, and models. Installing a part sets up
              viam-agent to install and supervise viam-server, which then pulls configuration from Viam's cloud,
              downloads required software, and keeps the stack running. That architecture matters because it turns
              hardware choice into a model selection problem and supports a module registry plus multi-language SDKs
              instead of bespoke per-device SDK work.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
