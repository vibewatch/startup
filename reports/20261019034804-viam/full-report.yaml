      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Public capital evidence supports historical fundraising but not present solvency. TechCrunch reported a
              $45 million Series B in March 2024 and total funding of $87 million at that point, with proceeds aimed at
              R&D and commercial enterprise deployment. The June 2026 Tech Mahindra partnership suggests continued focus
              on scaling into enterprise automation programs, which likely requires ongoing field support, partner
              enablement, and product investment. But the assigned public sources do not disclose current cash, burn,
              debt facilities, working-capital demands, capex, or the operational trigger for the next round. As a
              result, capital adequacy cannot be underwritten from public evidence alone even though strategic momentum
              appears intact.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Viam appears to have the ingredients for a potentially attractive software and services business around
              robotics deployment: an enterprise-grade control plane, technically credible product scope, and
              partner-led expansion paths. The financial problem is disclosure, not narrative. The current evidence
              supports only a directional conclusion that monetization probably combines recurring platform revenue,
              usage-linked billing, and implementation or support work, while margin quality and capital intensity
              remain unproven. A serious underwriting process should therefore treat revenue quality, gross margin
              trajectory, services mix, cash burn, and contract structure as blocking diligence requests rather than
              infer them from product breadth or recent partnership announcements.
            claimRefs:
              - CI003
              - CI005
              - CI010
              - CI011
              - CI013
              - CI015
