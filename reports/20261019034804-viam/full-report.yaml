  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Viam layers customer applications and fleet operations above a shared edge runtime that abstracts heterogeneous
      hardware through standard APIs.
    data:
      layers:
        - label: Customer apps and interfaces
          items:
            - TypeScript SDK web dashboards
            - Flutter / mobile clients
            - AI-agent or remote-operator workflows
          outputs:
