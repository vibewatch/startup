              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Maturity, ecosystem, and technical diligence risks
        blocks:
          - type: paragraph
            body: >-
              Maturity signals exist, but they skew toward company-controlled evidence. GitHub shows an active public
              developer surface across the core RDK, docs, and TypeScript and Python SDK repositories with October 2026
              update stamps, which supports the claim that the stack is maintained for external builders. The June 2026
              Tech Mahindra announcement also frames Viam as a fleet-management and integration partner for large
              industrial clients, and Tracxn lists Viam as a 2020-founded Series C company with 265 employees as of late
              September 2026. Together these points suggest a platform that has progressed beyond demo-only status, but
              enterprise technical diligence still needs security and compliance artifacts, incident history, and
              customer-verified deployment metrics before underwriting production reliability.
            claimRefs:
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buyer jobs
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently position Viam for a wide buyer spectrum rather than a single narrow robotics
              persona. Official sources say the platform is used by engineers, startups, and enterprises, while the
              product materials show workflows that cover hardware setup, remote operation, fleet deployment, and
              branded customer delivery. That suggests at least four practical segment layers: self-serve builders,
              enterprise operations teams running robotic fleets, robotics product companies that need customer-facing
              software, and system-integrator channels that can resell or implement the platform through direct and
              partner-led motions. Third-party directory coverage also points to manufacturing and marine-oriented
              demand, but without naming accounts or clarifying revenue mix by segment.
