              - CU003
              - CU004
              - CU005
          - type: callout
            title: Durability still lacks public proof
            body: >-
              No source in the assigned pool discloses customer counts, retention, renewal rates, or top-customer mix,
              so customer quality remains less proven than product breadth or channel promise.
