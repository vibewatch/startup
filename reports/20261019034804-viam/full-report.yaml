      - number: '6.3'
        title: Durability and concentration remain the key unknowns
        blocks:
          - type: paragraph
            body: >-
              The chapter's main weakness is not absence of segment intent but absence of public durability proof.
              Across the official pages, demo surface, and third-party listings in this pool, there is no disclosed
              customer count, active-machine total, utilization trend, NRR, churn, renewal rate, contract length, or
              top-customer concentration disclosure. Even the chapter's dedicated external customer-proof listing on
              casestudies.com is only a generic company description, not a roster of named deployments or measurable
              outcomes. As a result, the current public record supports marketability and channel expansion potential
              more strongly than it supports customer persistence or concentration resilience.
            claimRefs:
