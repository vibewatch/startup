  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The highest residual risks visible in the assigned source pool are not a public lawsuit or named
              enforcement action; they are architectural and commercial dependencies that can slow enterprise adoption
              or create execution drag. Viam's own documentation says that viam-server pulls machine configuration from
              Viam's cloud, downloads required software, and participates in a fleet stack covering remote connectivity,
              monitoring, and data sync. That architecture is valuable, but it also makes the product more dependent on
              central service reliability, version discipline, and customer trust in remote access patterns. The
              strongest third-party caution is not that the product lacks capability; it is that buyers still need to
              validate hardware compatibility, sim-to-real behavior, safety, and pricing discipline before scaling from
              prototype to production.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Legal, safety, and data-governance exposure
        blocks:
          - type: paragraph
            body: >-
              The current pool does not surface an active court case, regulator order, or named approval blocker, so the
              legal/regulatory conclusion has to stay conservative and scoped to what is visible. The concrete public
              risks are instead around product-safety responsibility, privacy-sensitive capture surfaces, and disclosure
              opacity. RoboFacet explicitly warns that Viam is not a substitute for safety validation on hardware and is
              not a low-maintenance toolchain without version ownership. Viam Labs separately notes that some demos use
              video and audio capture and require browser permissions, which means customer privacy, recording controls,
              and data-handling boundaries remain diligence items even before a deployment reaches production.
              EquityZen's public listing advertises revenue, valuation, and risk factors only behind signup, so public
              readers still lack a current risk-factor style disclosure package.
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR014
      - number: '7.3'
        title: Operational and partner dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Viam is selling a broad robotics control plane rather than a narrow point tool. Its own
              pages emphasize configuration versioning, over-the-air updates, remote connectivity, data pipelines, and a
              module registry spanning hardware drivers and software capabilities. That breadth increases the number of
              things that must work together: cloud availability, registry quality, versioning, hardware support, and
              customer-side networking and IT controls. Viam does describe mitigations, especially local queueing during
              outages and centralized monitoring, but those are resilience features rather than proof that all field
              failure modes are resolved. Execution risk also rises with partner-led expansion. LeadIQ says the company
              has 201-500 employees and highlights a 2026 Tech Mahindra partnership, which can expand distribution but
              also leaves open questions on channel economics, implementation ownership, and whether revenue
              concentration shifts toward a small number of strategic counterparties.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Financial opacity, mitigations, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The assigned public pool is thin on classic financial downside metrics. Viam's own platform overview says
              pricing can include per-machine fees, data transfer costs, compute hours, and API calls, while Robotomated
              says buyers who need transparent pricing to build ROI models should look elsewhere because budget planning
              requires direct engagement. That combination can slow procurement and make margin quality difficult to
              judge until a customer or investor sees actual contract terms. The practical mitigation is a diligence
              plan with explicit kill criteria: require evidence of production-safe deployment responsibility, privacy
              and access controls for media or telemetry capture, stable driver coverage for target hardware, and
              economic transparency on usage-based charges, partner revenue shares, and current revenue or burn. If
              management cannot provide that package, the residual risk remains too high for a conviction underwriting
              case.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial thesis-break trigger
            body: >-
              If customers continue to face opaque pre-sale economics plus non-trivial hardware validation work, Viam's
              broad platform pitch may win pilots but struggle to compound into efficient production rollouts.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR009
          - type: callout
            title: Best visible mitigation in public materials
            body: >-
              The clearest mitigation Viam discloses is operational resilience, not risk elimination: queueing during
              outages, centralized monitoring, and role-based access all help, but they do not remove the need for
              customer-side safety, privacy, and configuration governance.
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and thesis balance
        blocks:
          - type: paragraph
            body: >-
              The retained evidence still supports a live investment thesis around product architecture and
              founder-market fit. Viam's official materials consistently position the platform as a hardware-agnostic
              software layer for building, deploying, and managing robotics applications, while the documentation and
              platform overview show concrete mechanics behind that claim: standard APIs, reusable registry modules,
              remote fleet management, and billing primitives. That is stronger than a concept-only story. The problem
              is not whether Viam has built something real; it is whether the public record shows enough monetization
              and operating proof to price the opportunity. On that question, the answer remains no, so the right
              recommendation is to keep the company on the track list rather than stretch into a conviction buy.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
      - number: '8.2'
        title: Financing context supports relevance, not price certainty
        blocks:
          - type: paragraph
            body: >-
              The financing history is directionally constructive but not sufficient to underwrite entry discipline on
              its own. Multiple independent secondary sources agree that Viam has raised $117 million across four rounds
              and closed a $30 million Series C in March 2025 led by Union Square Ventures. Dealroom publishes specific
              private-market marks for the 2024 and 2025 rounds, but those are still dataset-level reported valuations
              rather than company-filed or investor-published valuation memos. SetterVC adds a direct caution that its
              valuation marks may be incomplete, stale, erroneous, or revised. Taken together, the financing record
              proves sponsor access and continued support, but the valuation record still behaves like a soft external
              signal instead of a hard underwriting anchor.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario framing should stay bounded by public marks
        blocks:
          - type: paragraph
            body: >-
              Because revenue, ARR, gross margin, and retention are absent from the retained public evidence, scenario
              work has to stay bounded by observed secondary valuation anchors instead of fabricated operating models.
              The upside case depends on Viam converting its product-control-plane position into repeatable usage-based
              revenue and broader enterprise adoption without losing pricing power in a crowded robotics software field.
              The base case is more conservative: strategic relevance continues, but commercialization evidence remains
              incomplete, leaving the company trading on sponsor confidence and product promise. The bear case is not
              product failure alone; it is multiple compression toward lower private marks if monetization or customer
              expansion stays opaque.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The diligence path that could change this recommendation is narrow and explicit. Management needs to show
              current revenue or ARR, gross margin, net revenue retention, and enough cohort or customer-level detail to
              explain whether usage, fleet management, and billing primitives are translating into durable software
              economics. Investors also need the cap table, preference stack, dilution math from the 2025 round, and an
              explanation for whether the reported 2024-2025 secondary marks reflect primary pricing, secondary
              transactions, or database estimates. If those materials are weak, or if growth signals deteriorate while
              funding remains the main proof point, the thesis should break toward pass rather than track.
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
