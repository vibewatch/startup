  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Product proof and financing support continued diligence, but missing operating and valuation disclosures keep the
      call at track.
    data:
      nodes:
        - id: product
          label: Product proof
          description: >-
            Hardware-agnostic APIs, registry modules, fleet tooling, and billing primitives point to a real software
            control layer.
          claimRefs:
            - CV003
            - CV004
            - CV005
        - id: traction
          label: Commercial signal
          description: >-
            Secondary sources point to enterprise use cases, subscription monetization, and broad deployment claims, but
            not disclosed software economics.
          claimRefs:
            - CV007
            - CV013
            - CV014
        - id: financing
          label: Financing support
          description: Multiple sources agree on $117M raised and a March 2025 Series C led by Union Square Ventures.
          claimRefs:
            - CV008
        - id: valuation
          label: Public valuation anchor
          description: >-
            Reported private marks exist, but they come from secondary datasets and one source explicitly cautions that
            marks may be incomplete or stale.
          claimRefs:
            - CV009
            - CV010
            - CV011
        - id: downside
          label: Downside signal
          description: >-
            Traffic and team-growth signals are modest, and the chapter contains no disclosed revenue, retention, or
            margin proof to rule out multiple compression.
          claimRefs:
            - CV012
            - CV014
        - id: recommendation
          label: Recommendation
          description: >-
            Track / research more until management provides revenue quality, retention, and round-term evidence that can
            support price discipline.
          claimRefs:
            - CV015
      edges:
        - from: product
          to: traction
          label: capability -> adoption hypothesis
          claimRefs:
            - CV003
            - CV005
            - CV007
        - from: traction
          to: financing
          label: traction supports sponsor interest
          claimRefs:
            - CV007
            - CV008
            - CV013
        - from: financing
          to: valuation
          label: sponsor signal is not valuation proof
          claimRefs:
            - CV008
            - CV009
            - CV010
        - from: valuation
          to: downside
          label: weak anchor elevates downside
          claimRefs:
            - CV009
            - CV010
            - CV012
            - CV014
        - from: downside
          to: recommendation
          label: downside dominates price call
          claimRefs:
            - CV012
            - CV014
            - CV015
    approximationNotes: >-
      This flow is qualitative. It explains how the retained evidence leads to the recommendation; it does not impute
      conversion rates, ownership outcomes, or unsupported financial model outputs.
