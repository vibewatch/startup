chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and commercial model
        blocks:
          - type: paragraph
            body: |-
              Viam presents itself as a software platform for building, deploying, and
              managing robotics applications across heterogeneous hardware, with a cloud
              control plane and an on-device runtime that lets customers prototype and
              then manage larger fleets without a full stack rewrite. Public official
              sources consistently tie the company to Eliot Horowitz's MongoDB background
              and to New York City as the headquarters and robotics-lab base. Commercially,
              the clearest public monetization signal is usage-based platform pricing:
              Viam advertises a free entry point with metered cloud services, while also
              using a startup program with credits and engineering support to lower
              adoption friction for earlier-stage robotics builders. That makes the
              company legible as a horizontal developer-and-operations platform rather
              than a single-purpose robotics integrator.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO015
