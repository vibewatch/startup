  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set is category-shaped, not a clean disclosed peer list
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not disclose a clean named-peer set for Viam; the retained sources instead describe a
              general robotics software layer used by engineers, startups, and enterprises across manufacturing, marine,
              climate, logistics, entertainment, and other verticals. That breadth widens the real alternative set to
              internal build, point tooling, integrator-led deployments, and workflow-specific packaged solutions rather
              than one homogeneous vendor cohort.


              The independent registry snapshot reinforces that view because it records Tech Mahindra using Viam inside
              an enterprise robotics and automation practice. In other words, distribution and solution ownership can
              sit with a channel partner as much as with the software vendor. Viam's own documentation and demo
              materials also show the platform spanning components, services, deployment, and customer-facing apps, so
              buyers are choosing a stack architecture as much as a vendor logo.
            claimRefs:
              - CP005
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.2'
        title: Breadth and developer ergonomics are the main competitive wedge
        blocks:
          - type: paragraph
            body: >-
              Within that architecture choice, Viam's clearest differentiation is breadth with developer-friendly
              abstractions. Official docs and overview pages claim consistent APIs across hardware, built-in motion and
              vision services, a registry for drivers and modules, remote monitoring, fleet deployment, OTA updates, and
              customer-facing authentication and billing primitives. Independent review largely corroborates that
              integrated-stack story by highlighting one codebase across prototypes and fleets plus multi-language SDKs.


              That matters because it compresses several categories of robotics plumbing into one control plane. It also
              means the strongest comparison available from the assigned pool is category-level rather than
              vendor-by-vendor benchmarking: the retained evidence is good enough to score stack scope and deployment
              speed, but not good enough to rank named peers on identical workloads or procurement terms.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP012
              - CP014
