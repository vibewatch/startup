            title: Fresh commercial proof exists, but it is channel-led
            body: >-
              The June 2026 Tech Mahindra partnership is the clearest public evidence that Viam can enter enterprise
              robotics programs, yet it validates route to market more than it validates named production-customer
              depth.
            calloutType: strength
            claimRefs:
              - CU006
              - CU007
              - CU013
              - CU014
          - type: callout
            title: Viam's customer surface is multi-sided
            body: >-
              The platform is not just sold to robotics teams operating fleets; it is also positioned for builders, OEMs
              shipping robots to their own customers, and channel partners who can implement or resell the stack.
            calloutType: insight
            claimRefs:
