      - number: '5.2'
        title: Deployment and operating model
        blocks:
          - type: paragraph
            body: >-
              The deployment and operations surface is one of the better-documented parts of the product. Viam says
              remote connectivity includes built-in NAT traversal, browser teleoperation, live testing against field
              hardware, centralized logs and alerts, and reusable fragments for fleet rollout. The same surface extends
              into data capture and ML: the platform says machines can queue data locally during outages, sync later,
              and pull trained models back to the edge with versioning controls. Viam also markets white-label
              authentication, customer-facing SDKs, and billing, while the viam-labs playground demonstrates a
              cloud-hosted viam-server and TypeScript SDK experience. What is still missing from the assigned pool is
              quantified evidence on uptime, integration effort, or rollout success rates.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
