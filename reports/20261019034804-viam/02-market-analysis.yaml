company:
  name: "Viam"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Public evidence places Viam in the robotics and automation software control plane: the layer that abstracts heterogeneous hardware, deploys software and models, and manages fleets after machines leave prototype. The assigned sources support multi-vertical demand signals and enterprise adoption drivers, but they do not disclose a quantified TAM, SAM, or SOM, so sizing remains qualitative and management diligence still needs bottom-up spend and contract data."
sections:
  - id: "market-boundary"
    title: "Market boundary: control-plane software around machines, not robot hardware"
    body: "The strongest common thread across Viam's own materials and third-party commentary is that Viam is not selling robot hardware as its primary category. Viam describes itself as software for building, deploying, and managing robotics applications; the documentation says users specify hardware and software capabilities while the platform handles drivers, networking, and infrastructure, and the platform overview emphasizes that application code can survive hardware swaps because APIs stay consistent. That framing defines the included spend as software abstraction, remote operations, deployment, data capture, monitoring, and model-management tooling around physical systems. It also defines the main exclusions: robot hardware capex, contract manufacturing, and site-specific integration labor that buyers may still need even when Viam is present. The status-quo substitute is fragmented proprietary SDKs and bespoke fleet scripts rather than another single robot form factor."
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM005", "CM006"]
    tableRefs: ["TM001"]
  - id: "buyers-and-adoption"
    title: "Buyer and adoption path: developer-led entry, enterprise-scale expansion"
    body: "The public evidence supports a buyer journey that begins with developers and robotics teams, then expands toward enterprise operations once fleets or distributed physical assets need governance. Viam's own pages repeatedly target engineers, startups, and enterprises, while the Tech Mahindra partnership describes demand from manufacturing, logistics, and industrial environments that need remote fleet management, predictive and preventive maintenance, over-the-air updates, and integration with existing systems. LeadIQ's company profile also points to manufacturers and marine technology organizations across the United States and Europe, which fits the use-case mix on Viam's own site. Public sources are clearer about users and workflows than about named procurement titles, so the budget-owner field below is evidence-backed where explicit and otherwise marked as workflow-based inference."
    claimRefs: ["CM006", "CM007", "CM008", "CM009", "CM010", "CM011"]
    tableRefs: ["TM003"]
  - id: "sizing-drivers-and-constraints"
    title: "Sizing lenses, drivers, and constraints"
    body: "The assigned pool supports several qualitative sizing lenses but not a publishable revenue market model. Black Scarab frames Viam as infrastructure that matters more as physical AI moves from prototype to fleet operation, and Tech Mahindra frames the software problem as enterprise adoption friction inside fragmented robotics deployments. Those lenses support a thesis of expanding relevance as remote operations, security, data capture, and model iteration become mandatory. But the same sources also surface constraints: complex deployments still require integration effort, Viam's category can be attacked by cloud providers, OEMs, open-source frameworks, and vertical platforms, and public commercial data remains sparse. Even EquityZen's marketplace page advertises valuation, revenue, and business-model fields as gated rather than public. The result is a real market narrative with incomplete public numerics, which should be treated as a diligence gap rather than filled with a generic TAM headline."
    claimRefs: ["CM006", "CM007", "CM009", "CM012", "CM013", "CM014", "CM015", "CM016"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
