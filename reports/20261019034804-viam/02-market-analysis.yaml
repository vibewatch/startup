          displayValue: "Public proof points, not spend figures"
          detail: "The evidence shows where Viam is showing up first, but not the revenue share or total budget in each wedge."
          tone: "neutral"
    approximationNotes: "This is a qualitative narrowing figure because the assigned public evidence does not disclose supportable TAM, SAM, or SOM values."
