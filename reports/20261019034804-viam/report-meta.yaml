  topStrengths:
    - Strong hardware-agnostic product architecture and cloud control plane.
    - Clear usage-based monetization surface and startup onboarding path.
    - Credible partner-led enterprise traction through Tech Mahindra and related product milestones.
  topRisks:
    - Revenue, ARR, gross margin, and customer retention remain undisclosed.
    - Named customer proof is channel-led rather than direct production deployment proof.
    - Valuation, governance, and control terms remain thinly disclosed in public sources.
  unresolvedGaps:
    - Revenue and ARR remain completely undisclosed — obtain this data from management before any investment decision.
