companyProfile:
  summary: >-
    Viam is a 2020-founded, New York-based robotics software platform built to abstract heterogeneous hardware into
    common APIs and cloud-managed fleet workflows. It serves engineers, startups, enterprises, and partner-led
    industrial automation teams across manufacturing, marine, climate, logistics, entertainment, and related use cases,
    with usage-based pricing and partner-led enterprise motions visible in public materials. Public disclosure remains
    incomplete on revenue, valuation, customer counts, and governance, so the public picture is still broader on product
    scope than on operating economics.
