      diligencePath: Retain direct competitor product pages, pricing pages, and independent reviews for at least three named robotics-platform peers in the next refresh.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP001, TP003]
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: Enterprise contract data covering minimum commits, discounts, overage behavior, and packaged-service economics for Viam deployments.
      whyItMatters: Public list pricing does not show the true budget objection or margin structure in competitive enterprise deals.
