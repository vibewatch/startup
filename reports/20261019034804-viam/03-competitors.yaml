      - ["Viam Robotic Surface Finishing", "Contact-priced packaged solution", "Contact us for pricing tailored to your deployment", "Hardware, software, installation, site setup, workflow integration, and ongoing support", "Contract length, services margins, and reuse across other workflows are not public", "Shows Viam can compete as a turnkey solution when buyers prefer outcome delivery."]
      - ["Comparable direct-peer pricing", "Independent peer benchmark", "Not retained in the assigned pool", "N/A", "No apples-to-apples public pricing for named peers was prefetched for this chapter", "Packaging analysis is stronger than absolute price-position analysis."]
    notes: >-
      Public pricing in the retained evidence is Viam-centric; direct-peer comparables remain a
      material diligence gap, so pricing conclusions should be treated as directional.
    claimRefs: [CP007, CP010]
