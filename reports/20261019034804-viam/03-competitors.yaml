callouts:
  - calloutType: strength
    title: Integrated scope is the main competitive wedge
    body: >-
      The retained evidence repeatedly pairs hardware abstraction, fleet operations, ML
      deployment, and customer-facing tooling, which makes Viam harder to replace with a single
      point solution.
    claimRefs: [CP002, CP003, CP004, CP006]
  - calloutType: risk
    title: Pricing predictability and integration depth are the easiest attack surfaces
    body: >-
      Independent review highlights usage-based billing, Viam-specific configuration concepts,
      and weaker native industrial integration, so displacement does not require a better
      full-stack rival; it only requires a buyer whose economics or systems constraints favor a
      narrower alternative.
    claimRefs: [CP007, CP008, CP009, CP014]
