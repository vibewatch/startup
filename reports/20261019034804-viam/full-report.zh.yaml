chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与商业模式
        blocks:
          - type: paragraph
            body: |-
              Viam 将自己定位为一个软件平台，用于在异构硬件上构建、部署和
              管理机器人应用；平台同时提供云端控制平面和设备端运行时，让客户
              先做原型，再管理更大的车队，而无需重写整套技术栈。公开官方
              来源始终把公司与 Eliot Horowitz 的 MongoDB 经历，以及纽约市这一
              总部和机器人实验室所在地联系起来。商业化方面，最清晰的公开变现
              信号是按用量计费的平台模式：Viam 提供免费入口和按量计费的云服务，
              还通过提供额度和工程支持的初创计划，降低早期机器人团队的采用门槛。
              因此，Viam 更像一个横向的开发者与运营平台，而不是单一用途的
              机器人集成商。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO015
