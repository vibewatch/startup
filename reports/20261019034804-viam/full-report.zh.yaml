              或客户层面细节，说明用量、车队管理和计费基础能力是否正转化为持久的软件经济性。投资人还需要股权结构表、优先股堆叠、2025 年轮次的稀释计算，并解释报告中的 2024-2025
              年二级市场估值标记究竟反映一级定价、二级交易，还是数据库估算。如果这些材料很弱，或融资仍是主要证明点的同时增长信号恶化，投资逻辑就应从跟踪转向放弃。
