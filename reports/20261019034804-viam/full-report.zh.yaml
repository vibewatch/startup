  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 产品控制平面的定位转化为持久的软件收入、更广泛的企业采用，以及更透明的变现披露。
        - 如果报告的 2025 年私募估值反映真实运营杠杆，而不只是赞助方势头，$225M-$250M 的公开区间可以维持。
        - 商业化仍可能落后于产品广度；机器人软件竞争拥挤仍是现实。
        - 需要披露收入质量，并证明按使用量计费正在扩大。
      - - 基准
        - 平台相关性保持不变，但公开运营披露仍然有限，投资判断仍取决于私下尽调。
        - $180M-$225M 仍是最有依据的公开区间，因为它受报告的 2024 年和 2025 年二手估值约束。
        - 如果收入质量、留存或客户集中度被证明弱于暗示，估值可能下滑。
        - 与当前证据最匹配：技术证明积极，但变现证明不完整。
      - - 悲观情景
        - 商业牵引力或变现能力弱于赞助方信号所暗示的水平，且私募市场情绪收缩。
        - 如果投资者无法验证收入规模，或下一轮融资低于报告的 2025 年估值，$100M-$180M 会更可信。
        - 不透明的资本结构条款或优先权负担可能让表面估值在经济上产生误导。
        - 公开证据已经缺少排除这条下行路径所需的运营数据。
    notes: 情景区间有意锚定于保留的公开二手估值和已发布公开区间，而不是当前证据无法支持的臆造 DCF 或收入倍数结果。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
