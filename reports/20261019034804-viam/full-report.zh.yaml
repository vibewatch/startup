  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 哪些信息会改变判断
    rows:
      - - 论点：Viam 已搭建出可信的硬件无关控制层，具备可复用 API、注册表模块和远程队列运维能力。
        - 如果管理层能证明这些能力正在带来扩张收入，而不只是增加产品广度，确信度会提高。
      - - 论点：Union Square Ventures、Battery Ventures 及其他投资者持续支持，表明赞助方仍在跟进。
        - 如果 2025 年轮次条款和投后估值计算显示定价克制，而不是内部人支持或结构复杂的条款，确信度会提高。
      - - 反论点：公开估值证据依赖二手数据库，其中一个来源还警告其估值可能不完整或已过时。
        - 如果管理层或投资者提供一手估值依据、股份类别条款和稀释安排，该担忧会下降。
      - - 反论点：保留来源没有披露收入、ARR、毛利率、净留存或公开价目表，因此没有依据按倍数做投资判断。
        - 如果管理层分享当前软件收入、留存分组，以及按机器或使用量区间实现的价格，该担忧会下降。
    notes: 本表有意混合支持性和反证性证据；每行都写明会推动建议变化的事实条件，而不是假装当前公开记录已经完整。
