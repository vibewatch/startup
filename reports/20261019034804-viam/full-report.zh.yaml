  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：围绕机器的控制平面软件，而非机器人硬件
        blocks:
          - type: paragraph
            body: >-
              Viam 自有材料和第三方评论中最一致的主线是：Viam 的主要品类不是机器人硬件。Viam
              将自己描述为用于构建、部署和管理机器人应用的软件；文档称用户指定硬件与软件能力，平台负责驱动、网络和基础设施；平台概览则强调，由于 API
              保持一致，应用代码可以在更换硬件后继续运行。按这一框架，纳入的支出是围绕物理系统的软件抽象、远程运营、部署、数据采集、监控和模型管理工具。主要排除项则包括机器人硬件资本开支、合同制造，以及即使部署 Viam
              仍可能需要的现场集成劳务。现状替代方案是零散的专有 SDK 和定制车队脚本，而不是另一种单一机器人形态。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
              - CM012
      - number: '2.2'
        title: 买方与采用路径：开发者切入，向企业规模扩展
        blocks:
          - type: paragraph
            body: >-
              公开证据支持这样一条买方路径：先从开发者和机器人团队切入，等车队或分布式实体资产需要治理后，再扩展到企业运营。Viam 自有页面反复面向工程师、初创公司和企业；Tech Mahindra
              合作则描述了制造、物流和工业环境对远程车队管理、预测性与预防性维护、OTA 更新以及既有系统集成的需求。LeadIQ 的公司资料还指向美国和欧洲的制造商及海事技术组织，这与 Viam
              自有网站展示的使用场景相吻合。公开来源对用户和工作流的描述比对具体采购职位更清楚，因此下方预算负责人一栏在有明确证据处直接采用来源内容，否则标为基于工作流的推断。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
