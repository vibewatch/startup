  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 产品验证和融资信息支持继续尽调，但运营与估值披露不足，因此当前结论仍是持续跟踪。
    data:
      nodes:
        - id: product
          label: 产品验证
          description: 与硬件无关的 API、注册表模块、设备集群工具和计费基础能力，指向一个真实存在的软件控制层。
          claimRefs:
            - CV003
            - CV004
            - CV005
        - id: traction
          label: 商业信号
          description: 二手来源声称存在企业用例、订阅变现和广泛部署，但没有披露软件业务的经济性。
          claimRefs:
            - CV007
            - CV013
            - CV014
        - id: financing
          label: 融资支持
          description: 多个来源一致显示公司已融资 $117M，并于 2025 年 3 月完成由 Union Square Ventures 领投的 Series C 轮。
          claimRefs:
            - CV008
        - id: valuation
          label: 公开估值锚点
          description: 市场上存在据报道的私人市场估值，但这些数据来自二手数据库，且有一个来源明确提醒估值可能不完整或已经过时。
          claimRefs:
            - CV009
            - CV010
            - CV011
        - id: downside
          label: 下行信号
          description: 流量和团队增长信号都较温和；本章没有披露收入、留存或利润率证据，无法排除估值倍数压缩。
          claimRefs:
            - CV012
            - CV014
        - id: recommendation
          label: 推荐
          description: 在管理层提供收入质量、留存和本轮条款证据、足以支持价格纪律前，继续跟踪并深入研究。
          claimRefs:
            - CV015
      edges:
        - from: product
          to: traction
          label: 能力 -> 采用假设
          claimRefs:
            - CV003
            - CV005
            - CV007
        - from: traction
          to: financing
          label: 牵引力支持出资方兴趣
          claimRefs:
            - CV007
            - CV008
            - CV013
        - from: financing
          to: valuation
          label: 出资方信号不是估值证据
          claimRefs:
            - CV008
            - CV009
            - CV010
        - from: valuation
          to: downside
          label: 薄弱锚点抬高下行风险
          claimRefs:
            - CV009
            - CV010
            - CV012
            - CV014
        - from: downside
          to: recommendation
          label: 下行风险主导价格判断
          claimRefs:
            - CV012
            - CV014
            - CV015
    approximationNotes: 该流程是定性的。它解释保留的证据如何导向推荐结论，不推算转化率、持股结果或缺乏依据的财务模型输出。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
