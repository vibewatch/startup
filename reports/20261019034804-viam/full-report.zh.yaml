      - number: '1.2'
        title: 领导层、治理可见度与资本基础
        blocks:
          - type: paragraph
            body: |-
              保留下来的来源勾勒出一幅范围有限但前后一致的公开领导层图景：
              Horowitz 是创始人，且凭借 MongoDB 经历具备很强的领域迁移可信度；
              Viam 的关于页面则公开将 Union Square Ventures 合伙人 Albert Wenger
              与董事会联系起来。融资信息的可见度高于治理信息。第三方数据集都
              指向一条从 2021 年种子轮到 2025 年 3 月 C 轮的四轮融资路径，累计
              披露资本约为 $117 million；Union Square Ventures 和 Battery Ventures
              反复出现在各轮融资中。对尽调更关键的内容仍然缺失：保留来源没有
              披露确切估值条款、控制权安排、债务敞口，或完整的董事会与高管名单。
