              配置中声明，并解析为资源、组件、服务和模型。安装某个部件后，viam-agent 会安装并监管 viam-server；后者从 Viam
              云端拉取配置、下载所需软件，并让整套系统持续运行。这套架构把硬件选择转化成模型选择问题，同时支持模块注册表和多语言 SDK，而不是为每台设备单独编写 SDK。
