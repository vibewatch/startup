      - number: '2.3'
        title: 规模测算视角、驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              指定来源池支持若干定性规模测算视角，但不足以形成可发布的收入市场模型。Black Scarab 将 Viam 描述为一种基础设施：随着物理 AI 从原型走向车队运营，它的重要性会提升；Tech Mahindra
              则将这一软件问题描述为碎片化机器人部署中的企业采用摩擦。这些视角支持这样的判断：随着远程运营、安全、数据采集和模型迭代变成必需，Viam 的相关性会扩大。但同一批来源也暴露出约束：复杂部署仍需集成工作，Viam
              所在品类会受到云厂商、OEM、开源框架和垂直平台的攻击，公开商业数据也很稀疏。就连 EquityZen
              的市场页面也把估值、收入和商业模式字段设置为注册后可见，而非公开展示。结果是，市场叙事真实存在，但公开数字不完整；这应被视为尽调缺口，而不应拿泛化的 TAM 标题填补。
