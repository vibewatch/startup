  summary: >-
    Viam 成立于 2020 年，总部位于纽约，是一家机器人软件平台，负责把异构硬件抽象成统一
    API，并提供云管理的车队工作流。平台服务于制造、海事、气候、物流、娱乐及相关场景中的工程师、初创公司、企业和合作伙伴主导的工业自动化团队；公开材料显示，其采用按用量计费，并通过合作伙伴推进企业业务。收入、估值、客户数量和治理方面的公开披露仍不完整，因此目前能看清的产品边界远多于运营经济性。
