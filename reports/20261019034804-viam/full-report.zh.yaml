          - type: paragraph
            body: >-
              Viam
              似乎具备围绕机器人部署打造潜在有吸引力的软件与服务业务的要素：企业级控制平面、技术上可信的产品范围，以及合作伙伴驱动的扩张路径。财务问题在于披露，而不是叙事。当前证据只能支持一个方向性结论：变现可能由经常性平台收入、按用量计费以及实施或支持工作共同构成，但利润质量和资本密度仍未经证明。因此，严肃的投资评估应把收入质量、毛利率走势、服务收入占比、现金消耗和合同结构视为阻塞性尽调要求，而不应从产品广度或近期合作公告中推断出来。
