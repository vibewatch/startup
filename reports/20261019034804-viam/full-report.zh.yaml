      - number: '1.3'
        title: 公开规模信号与 2025-2026 年更新里程碑
        blocks:
          - type: paragraph
            body: |-
              公开规模证据只能指向方向，尚达不到投资级别。Dealroom 和 Oryndex
              都认为 Viam 已进入 C 轮并筹得大量资本，但两者没有对当前精确员工
              数达成一致，也没有给出读者可直接使用的确切估值。保留来源池中
              最新的负面信号并不严重到改变投资逻辑：Dealroom 报告三个月网站
              流量下降 10.3%，一年期团队增长为 -0.4%；EquityZen 则提醒读者，
              私营公司的二级交易机会仍具有投机性且流动性不足。与此相对，更新
              后的里程碑仍然活跃：公开引用显示 2025 年与 Universal Robots 的
              合作，以及 2026 年的合作、教育和演示公告。这些都说明公司仍在
              持续推进市场拓展和产品活动，尽管收入和客户规模尚未披露。
