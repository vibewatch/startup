  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合由品类决定，而不是一份清晰披露的同业名单
        blocks:
          - type: paragraph
            body: >-
              公开证据没有披露 Viam
              的清晰具名同业集合；保留来源描述的反而是一层通用机器人软件，服务于制造、海事、气候、物流、娱乐等垂直领域的工程师、初创公司和企业。这样的广度意味着真正的替代集合包括内部自建、单点工具、集成商主导的部署，以及针对特定工作流的打包解决方案，而不是一组同质化厂商。


              独立注册信息快照进一步支持这一判断，因为它记录了 Tech Mahindra 在企业机器人和自动化业务中使用 Viam。             
              换句话说，分销和解决方案所有权可以掌握在渠道合作伙伴手中，而不一定由软件厂商独占。Viam
              自有文档和演示材料还显示，平台覆盖组件、服务、部署和面向客户的应用，因此买方选择的不只是一个厂商标志，也是在选择一套技术栈架构。
            claimRefs:
              - CP005
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.2'
        title: 广度与开发者体验是主要竞争抓手
        blocks:
          - type: paragraph
            body: >-
              在这项架构选择中，Viam 最清晰的差异化是广度加上面向开发者的抽象。官方文档和概览页面声称，平台提供跨硬件的一致 API、内置运动和视觉服务、驱动与模块注册表、远程监控、车队部署、OTA
              更新，以及面向客户的认证和计费基础能力。独立评测大体印证了这一集成技术栈叙事，重点提到原型和车队共用一套代码，以及多语言 SDK。


              这很重要，因为它把多个机器人基础设施类别压缩进一个控制平面。也意味着，指定来源池能提供的最强比较是品类级，而不是逐家厂商基准：现有证据足以评估技术栈范围和部署速度，却不足以在相同负载或采购条款下给具名同业排名。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP012
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP009
              - CP010
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP010
              - CP011
              - CP014
      - number: '3.3'
        title: 持久性取决于能否克服定价与集成摩擦
        blocks:
          - type: paragraph
            body: >-
              持久性不只取决于功能广度，还取决于买方是否接受平台在经济性和工作流上的取舍。同一份称赞 Viam 覆盖范围的独立评测也指出了三个限制护城河的问题：按用量计费在数据密集型部署中更难规划，用户必须学习 Viam
              特有的配置概念，而工业系统集成看起来不如核心机器人和机器学习工作流原生。


              替代方案正可以从这些摩擦点取胜。买方可以通过内部技术栈保留更多控制权，把部署风险交给集成商，或购买更窄的交钥匙结果，而不是通用平台。公开定价也显示 Viam
              可以同时触达自助式开发者预算和打包解决方案预算，但保留来源没有提供企业折扣或可直接对比的同业价格。因此，本章的投资判断是：定位优势明确，但价格与价值之间的证明仍未解决。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP010
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 集成范围是主要竞争抓手
            body: 保留证据反复将硬件抽象、车队运营、ML 部署和面向客户的工具放在一起，这使 Viam 更难被单一单点方案替代。
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
          - type: callout
            title: 定价可预测性与集成深度是最容易被攻击的地方
            body: 独立评测强调按用量计费、Viam 特有的配置概念和较弱的原生工业集成。因此，取代 Viam 不需要出现更强的全栈竞争者，只要买方的经济性或系统约束更偏好更窄的替代方案即可。
            calloutType: risk
            claimRefs:
              - CP007
