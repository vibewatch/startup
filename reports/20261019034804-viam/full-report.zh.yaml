              - CP009
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              公开产品页面始终将 Viam 定位为异构机器人部署的软件层，而不是硬件
              OEM。得到最强支持的商业解读是控制平面模式：开发者配置机器、部署模块和模型、远程运营车队，并可在多台机器上分阶段更新。这种运营方式支持经常性软件收入和与用量挂钩的变现；公司公开的“免费账户”行动号召，则暗示在签订更大企业合约前，客户可以先从自助式或试点入口开始。缺失的是对投资判断真正重要的商业包装：保留来源没有披露
              Viam 自己的目录价、折扣行为、合同最低额、续约结构，或平台订阅、服务与任何代收代付基础设施费用之间的拆分。
