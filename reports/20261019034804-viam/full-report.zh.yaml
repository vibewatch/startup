  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险集中在控制平面依赖、部署验证和商业透明度不足；已披露的缓解措施主要提升韧性，并未消除风险敞口。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解措施成熟度
        - label: 剩余敞口
      rows:
        - label: 云控制平面依赖
          note: 集中式配置、连接和监控是产品价值主张的核心。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 硬件兼容性与版本漂移
          note: 公开评测仍将硬件支持、GPU 适配和版本维护责任视为正在进行的尽调工作。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 低
              tone: low
            - label: 高
              tone: high
        - label: 安全与部署验证负担
          note: 公开材料没有把现场安全验证责任从运营方或集成商身上移开。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: critical
            - label: 低
              tone: low
            - label: 高
              tone: high
        - label: 定价与 ROI 透明度不足
          note: 买方在建立完整 ROI 模型前，就被引导转向直接接洽。
          values:
            - label: 高
