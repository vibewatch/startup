  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-assurance
      missingEvidence: Public or customer-facing proof of security certifications, privacy controls, penetration testing, or formal status-history reporting.
      whyItMatters: Enterprise buyers may treat robotics fleet access, remote operations, and white-label authentication as security-critical capabilities.
      diligencePath: Request the trust center package, security questionnaire responses, status-page history, and any disclosed incident postmortems.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: production-performance
      missingEvidence: Customer-verified deployment metrics such as time-to-integrate, uptime, fleet size, rollback frequency, or support response times.
      whyItMatters: The product story depends on reducing robotics integration and operations complexity, but the assigned pool does not quantify real production outcomes.
      diligencePath: Obtain reference calls, implementation case studies, and service-review metrics from live enterprise deployments.
