schemaVersion: "report-v2"
artifact: company-overview
slug: viam
runDate: 2026-10-19
company:
  name: Viam
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Viam remains a founder-led robotics software platform with a credible funding
    base and a visible 2025-2026 milestone cadence, but public disclosure on
    valuation, revenue, customers, and governance is still materially incomplete.
    The strongest publicly supported facts are identity, product posture, funding
    history, and selected partnership and product milestones rather than audited
    operating metrics.
sections:
  - id: identity-and-product
    title: Identity, positioning, and commercial model
    body: |-
      Viam presents itself as a software platform for building, deploying, and
      managing robotics applications across heterogeneous hardware, with a cloud
      control plane and an on-device runtime that lets customers prototype and
      then manage larger fleets without a full stack rewrite. Public official
      sources consistently tie the company to Eliot Horowitz's MongoDB background
      and to New York City as the headquarters and robotics-lab base. Commercially,
      the clearest public monetization signal is usage-based platform pricing:
      Viam advertises a free entry point with metered cloud services, while also
      using a startup program with credits and engineering support to lower
      adoption friction for earlier-stage robotics builders. That makes the
      company legible as a horizontal developer-and-operations platform rather
      than a single-purpose robotics integrator.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO015]
    tableRefs: [TO001]
  - id: leadership-capital-and-stakeholders
    title: Leadership, governance surface, and capital base
    body: |-
      The retained source set supports a narrow but coherent public leadership
      picture: Horowitz is the founder with strong domain-transfer credibility
      from MongoDB, and Viam's about page publicly associates Union Square
      Ventures partner Albert Wenger with the board. Funding visibility is
      stronger than governance visibility. Third-party datasets align on a four
      round path from a 2021 seed to a March 2025 Series C and on roughly
      $117 million of total disclosed capital, with Union Square Ventures and
      Battery Ventures appearing repeatedly across rounds. What remains missing
      is more consequential for diligence: the retained sources do not disclose
      exact valuation terms, control provisions, debt exposure, or a complete
      board and executive roster.
    claimRefs: [CO001, CO007, CO008, CO009, CO016]
    tableRefs: [TO002, TO003]
  - id: public-scale-and-refresh-milestones
    title: Public scale signals and 2025-2026 refresh milestones
    body: |-
      Public scale evidence is directional rather than investment-grade.
      Dealroom and Oryndex agree that Viam has progressed to Series C and raised
      substantial capital, but they do not converge on a precise current
      headcount and they do not provide an exact reader-usable valuation. The
      most current negative signal in the retained pool is mild rather than
      thesis-breaking: Dealroom reports web traffic down 10.3% over three months
      and one-year team growth at -0.4%, while EquityZen reminds readers that
      private-company secondary access remains speculative and illiquid. Against
      that caution, the refreshed milestone set is active: public references show
      a 2025 Universal Robots partnership and 2026 partnership, education, and
      demo announcements, which indicate continuing go-to-market and product
      activity even though revenue and customer scale remain undisclosed.
    claimRefs: [CO008, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
