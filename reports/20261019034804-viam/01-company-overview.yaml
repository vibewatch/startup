      - ["Union Square Ventures", "Repeat investor / board-linked backer", "Appears from seed through Series C era and is linked to an identified board director.", "Request ownership %, board rights, pro rata rights, and any protective provisions."]
      - ["Battery Ventures", "Repeat investor", "Present in Series A/B/C-era public funding summaries, implying continued economic influence.", "Confirm current ownership, board-observer rights, and any liquidation preferences."]
      - ["Tiger Global Management", "Series A investor", "Named in the Series A investor set and relevant to cap-table signaling.", "Determine whether Tiger remains active, its current stake, and any secondary overhang."]
      - ["Neurone", "Series C investor", "Named in the latest disclosed round and therefore relevant to the current financing stack.", "Clarify check size, governance rights, and whether the round changed control or preference structure."]
    notes: "Partial investor map based on named investors in public funding summaries; it is not a substitute for a cap table, debt schedule, or shareholder-rights package."
    enumerationScope:
      coverage: partial
      basis: "Built from named stakeholders in public funding summaries and the official about page; retained sources do not expose the full cap table, debt holders, or control-rights structure, so the map is intentionally partial."
    claimRefs: [CO007, CO008, CO009, CO012, CO016]
