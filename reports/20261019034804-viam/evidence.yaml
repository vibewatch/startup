evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, executive roster beyond named public individuals, and investor governance rights.
    whyItMatters: Control, oversight quality, and founder concentration cannot be judged from the retained public source set alone.
    diligencePath: >-
      Request the current board list, executive org chart, financing documents, and investor-rights summary from
      management.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact post-money valuation and round terms for the March 2025 Series C.
    whyItMatters: A valuation range is insufficient for underwriting entry price, dilution, or preference-stack risk.
    diligencePath: Obtain the Series C term sheet, cap table, and any board-approved valuation materials.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, ARR, customer count, NRR, and churn.
    whyItMatters: >-
      The company can be staged and described, but it cannot be underwritten on commercial performance without these
      metrics.
    diligencePath: >-
      Request the latest board deck or KPI dashboard with recurring revenue, gross retention, NRR, and active-customer
      definitions.
    relatedQuestionRefs:
      - QO004
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: One reconciled current employee count and location footprint.
    whyItMatters: Current scale is directionally visible but not precise enough for cost-base or execution-capacity analysis.
    diligencePath: >-
      Confirm headcount by function and geography directly from HR or finance, and reconcile against third-party profile
      data.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A quantified TAM, SAM, or SOM with explicit publisher methodology, geography, buyer counts, and spend assumptions
      for the control-plane software layer around robotics and automation.
    whyItMatters: >-
      Without a defensible sizing baseline, valuation and market-share claims can drift into generic robotics-software
      narratives that do not match Viam's actual category.
    diligencePath: >-
      Request management's bottom-up sizing model by segment and geography, then reconcile it against independent
      industry datasets and customer budget ranges.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Named budget owners, procurement path, payback period, and deployment economics by vertical.
    whyItMatters: >-
      The public sources identify users and workflows, but investment quality depends on whether Viam sells into
      developer tools budgets, automation capex, or broader operational software lines.
    diligencePath: >-
      Validate buyer titles and budget ownership in customer calls, partner interviews, and procurement artifacts from
      manufacturing, marine, and logistics deployments.
    relatedQuestionRefs:
      - QM003
      - QM005
  - type: missing-source
    severity: material
    topic: direct-peer-benchmark
    missingEvidence: >-
      Independent public profiles for named direct peers with product scope, target customer, and pricing on the same
      basis as Viam.
    whyItMatters: >-
      Without that peer set, the chapter can compare solution classes credibly but cannot defend a precise named-vendor
      ranking.
    diligencePath: >-
      Retain direct competitor product pages, pricing pages, and independent reviews for at least three named
      robotics-platform peers in the next refresh.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Enterprise contract data covering minimum commits, discounts, overage behavior, and packaged-service economics for
      Viam deployments.
    whyItMatters: Public list pricing does not show the true budget objection or margin structure in competitive enterprise deals.
    diligencePath: >-
      Request current customer contracts or management-prepared pricing schedules segmented by developer platform versus
      turnkey solutions.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Current revenue, ARR, growth, and revenue mix by software, services, and partner-led channels.
    whyItMatters: The chapter cannot underwrite revenue quality or valuation relevance without a scale baseline.
    diligencePath: Request a monthly revenue bridge, ARR schedule, and top-customer concentration pack from management.
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, debt obligations, capex commitments, and board-approved operating plan.
    whyItMatters: >-
      Historical fundraising does not establish runway or whether the company is financing-dependent in the next 12 to
      18 months.
    diligencePath: Obtain the latest board deck, cash forecast, debt schedule, and hiring plan.
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: Actual customer pricing, contract minimums, support-tier charges, and discounting behavior.
    whyItMatters: Public product descriptions show monetization levers but not realized pricing or gross-margin shape.
    diligencePath: Review signed MSAs, order forms, sample invoices, and renewal cohorts.
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, payback, gross margin by revenue stream, NRR, churn, and revenue per employee.
    whyItMatters: >-
      These are the metrics that determine whether Viam is scaling as a software platform or a services-heavy automation
      vendor.
    diligencePath: Request cohort analytics, sales-ops reporting, and finance segment P&Ls.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Public or customer-facing proof of security certifications, privacy controls, penetration testing, or formal
      status-history reporting.
    whyItMatters: >-
      Enterprise buyers may treat robotics fleet access, remote operations, and white-label authentication as
      security-critical capabilities.
    diligencePath: >-
      Request the trust center package, security questionnaire responses, status-page history, and any disclosed
      incident postmortems.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: production-performance
    missingEvidence: >-
      Customer-verified deployment metrics such as time-to-integrate, uptime, fleet size, rollback frequency, or support
      response times.
    whyItMatters: >-
      The product story depends on reducing robotics integration and operations complexity, but the assigned pool does
      not quantify real production outcomes.
    diligencePath: Obtain reference calls, implementation case studies, and service-review metrics from live enterprise deployments.
  - type: missing-source
    severity: material
    topic: adoption-metrics-gap
    missingEvidence: Disclosed customer count, active accounts, active machines, deployment totals, and utilization trend by period.
    whyItMatters: Without direct adoption denominators, the chapter cannot distinguish broad awareness from scaled paying usage.
    diligencePath: >-
      Request monthly customer KPI history from management or board materials, including active machine and paid-account
      trends.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, logo churn, renewal schedule, contract length, and cohort behavior by segment.
    whyItMatters: >-
      Durability is the core missing variable for judging whether Viam's customer base compounds or resets each sales
      cycle.
    diligencePath: Obtain cohort retention tables and top-renewal schedules from finance and customer-success teams.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: >-
      Top-customer and top-partner revenue share, direct versus channel mix, and any minimum-commitment terms with Tech
      Mahindra.
    whyItMatters: Partner dependence and customer concentration could materially change the risk of the current go-to-market model.
    diligencePath: Request current ARR concentration by customer and partner plus channel-contract terms for Tech Mahindra.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: public-proof-gap
    missingEvidence: Three to five named production customers with go-live date, use case, and measurable outcome.
    whyItMatters: >-
      Public customer proof is currently too shallow to validate reference quality or adoption durability across
      segments.
    diligencePath: Ask management for customer references or case studies that can be shared under NDA if not public.
    relatedQuestionRefs:
      - QU003
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: adverse-customer-evidence
    missingEvidence: >-
      Independent customer reviews, failed-pilot reporting, procurement records, complaints, or other genuinely
      skeptical customer-side evidence.
    whyItMatters: >-
      The assigned prefetched pool is promotional or neutral and cannot independently test implementation friction,
      churn, or customer dissatisfaction.
    diligencePath: >-
      In a future authorized discovery pass, prioritize named-user reviews, public procurement records,
      customer-authored deployment reports, and failed or delayed implementation evidence.
    relatedQuestionRefs:
      - QU005
      - QU007
  - type: private-evidence-only
    severity: material
    topic: legal-regulatory-status
    missingEvidence: >-
      Current litigation schedule, regulator correspondence, certifications, privacy documentation, and export-control
      posture.
    whyItMatters: >-
      Public product and marketplace pages do not establish whether hidden legal or compliance issues could block
      enterprise deployment or diligence sign-off.
    diligencePath: >-
      Request counsel-backed legal and compliance schedules plus any customer-facing trust, privacy, and certification
      packets.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, gross margin, burn, runway, valuation, and contract-level pricing structure.
    whyItMatters: >-
      Without those figures, it is hard to judge whether usage-based pricing and partner-led expansion create attractive
      or fragile unit economics.
    diligencePath: Obtain management financials, current financing terms, and representative customer or partner contracts.
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Public evidence on Tech Mahindra economics, exclusivity, implementation ownership, and any revenue concentration
      tied to a small set of partners or customers.
    whyItMatters: Partner-led scale can expand reach while simultaneously weakening margins, accountability, or customer intimacy.
    diligencePath: Request the commercial structure, SLAs, and concentration schedule for major partners and top deployments.
  - type: private-evidence-only
    severity: material
    topic: valuation-support
    missingEvidence: Current revenue or ARR, gross margin, and net revenue retention by major customer cohort.
    whyItMatters: >-
      These metrics determine whether the latest private mark reflects software economics or only strategic narrative
      and sponsor confidence.
    diligencePath: Request management operating KPI pack and board materials covering the latest twelve months and current quarter.
    relatedQuestionRefs:
      - QV005
      - QV008
  - type: private-evidence-only
    severity: material
    topic: valuation-marks
    missingEvidence: >-
      Post-money valuation, share class terms, liquidation preferences, option pool impact, and any insider-led
      structure from the March 2025 round.
    whyItMatters: >-
      Headline secondary marks can overstate common-share economics if the round includes preference overhang or other
      investor protections.
    diligencePath: Obtain the latest financing documents, cap table, and investor rights summary from management or lead counsel.
    relatedQuestionRefs:
      - QV004
      - QV008
  - type: missing-source
    severity: material
    topic: monetization-architecture
    missingEvidence: >-
      Public or private proof of realized pricing, customer expansion, churn, and conversion from product usage to paid
      software revenue.
    whyItMatters: >-
      The product story is credible, but the investment case depends on whether fleet and billing primitives translate
      into durable monetization.
    diligencePath: Review customer contracts, cohort revenue bridge, and pipeline conversion data for paid deployments.
    relatedQuestionRefs:
      - QV006
      - QV007
      - QV008
