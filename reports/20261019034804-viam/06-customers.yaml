schemaVersion: "report-v2"
artifact: customers
slug: viam
runDate: "2026-10-19"
company:
  name: Viam
chapter:
  number: 6
  title: Customers
  summary: >-
    Viam clearly addresses multiple buyer and user segments—from individual
    engineers and startups to enterprise automation teams and channel
    partners—with product surfaces that span prototype, fleet deployment, and
    customer-facing applications. The strongest fresh customer proof in this
    assigned pool is the June 2026 Tech Mahindra partnership and related
    industrial demo activity, but public evidence still stops short of
    disclosing customer counts, retention, or concentration, leaving durability
    under-verified.
sections:
  - id: customer-segments-and-jobs
    title: Customer segments and buyer jobs
    body: >-
      Public materials consistently position Viam for a wide buyer spectrum
      rather than a single narrow robotics persona. Official sources say the
      platform is used by engineers, startups, and enterprises, while the
      product materials show workflows that cover hardware setup, remote
      operation, fleet deployment, and branded customer delivery. That suggests
      at least four practical segment layers: self-serve builders, enterprise
      operations teams running robotic fleets, robotics product companies that
      need customer-facing software, and system-integrator channels that can
      resell or implement the platform through direct and partner-led motions.
      Third-party directory coverage also
      points to manufacturing and marine-oriented demand, but without naming
      accounts or clarifying revenue mix by segment.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU009]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-proof-and-adoption-signals
    title: Named proof and adoption signals
    body: >-
      The most concrete public customer proof in the assigned pool is partner
      rather than end-customer evidence. Viam and Tech Mahindra announced a
      partnership in June 2026 to provide Tech Mahindra's enterprise clients
      access to Viam for fleet-scale robotics management, and both the company
      release and syndicated trade coverage repeat the same use cases:
      industrial deployment, remote fleet management, predictive maintenance,
      and OTA updates. The same announcement adds two useful scale signals—a
      Hannover Messe demonstration shown to 110,000-plus manufacturing leaders
      and Tech Mahindra's own 1,100-client footprint—but those signals indicate
      route-to-market reach and category relevance, not verified production
      deployment by named Viam customers.
    claimRefs: [CU006, CU007, CU008, CU013, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability and concentration remain the key unknowns
    body: >-
      The chapter's main weakness is not absence of segment intent but absence
      of public durability proof. Across the official pages, demo surface, and
      third-party listings in this pool, there is no disclosed customer count,
      active-machine total, utilization trend, NRR, churn, renewal rate,
      contract length, or top-customer concentration disclosure. Even the
      chapter's dedicated external customer-proof listing on casestudies.com is
      only a generic company description, not a roster of named deployments or
      measurable outcomes. As a result, the current public record supports
      marketability and channel expansion potential more strongly than it
      supports customer persistence or concentration resilience.
    claimRefs: [CU010, CU011, CU012, CU015]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Self-serve builders and startup teams
        - Engineers and startups evaluate, configure, and control machines; payer not disclosed
        - Prototype hardware, connect first machine, develop app logic
        - Official materials say Viam serves users from first prototype to global fleet
        - Broadens funnel and can seed later enterprise expansion, but monetization path is undisclosed
        - No public free-to-paid conversion, seat count, or paid account data
      - - Enterprise automation and operations teams
        - Enterprise operations, IT, and robotics teams run fleets; payer likely automation budgets
        - Remote monitoring, diagnostics, OTA updates, and fleet operations
        - Docs and platform materials repeatedly emphasize fleet deployment and remote operations
        - Implies larger contract potential and stickier workflows, but ACV is undisclosed
        - No named production fleet count, deployment volume, or contract size
      - - Robotics product companies serving their own customers
        - Product/OEM teams build customer-facing apps; end customers are downstream users
        - White-label auth, web/mobile apps, billing, and embedded machine operations
        - Platform overview explicitly adds customer-facing SDKs and billing
        - Creates a platform-within-product motion and possible usage-linked monetization
        - No public logos, case studies, or downstream usage metrics
      - - Channel and systems-integrator partners
        - Tech Mahindra and similar partners buy/enable the platform; partner clients are downstream users
        - Partner-led deployment across industrial and manufacturing environments
        - June 2026 partnership plus Tech Mahindra client footprint
        - Can expand reach faster than direct sales and improve enterprise credibility
        - No disclosed contract volume, revenue share, or pipeline conversion
    notes: >-
      Segment boundaries are inferred from official product surfaces and the
      named Tech Mahindra partnership; null or undisclosed items indicate no
      public quantitative disclosure in the assigned pool.
    claimRefs: [CU001, CU002, CU003, CU004, CU006, CU009, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Named channel proof
        - Tech Mahindra partnership announced
        - "2026-06-18 / 2026-06-19"
        - PRNewswire; Robotics Business News
        - Medium
        - Freshest public commercial proof that Viam can enter enterprise robotics programs through a major SI
        - No disclosed end-customer count, contracted ARR, or live deployment total
      - - Market awareness signal
        - 110,000+ manufacturing leaders saw the Hannover Messe teleoperation demo
        - "2026-04 event, disclosed 2026-06-18"
        - PRNewswire
        - Medium
        - Suggests strong industrial-buyer exposure and relevance for physical AI workflows
        - Event audience is not the same as paying customers or qualified pipeline
      - - Partner distribution footprint
        - 147,000+ professionals, 90+ countries, 1,100+ clients at Tech Mahindra
        - "2026-06-18"
        - PRNewswire
        - Medium
        - Large route-to-market channel if Viam is adopted inside Tech Mahindra's practice
        - These are Tech Mahindra metrics, not verified Viam adoption metrics
      - - Trial and onboarding surfaces
        - Free account CTA, demo playground, and first-machine documentation
        - Current as fetched
        - Viam About; Viam Demo; Viam docs
        - Medium
        - Indicates relatively low-friction evaluation for builders, OEM teams, and partner engineers
        - No disclosed activation, conversion, or retention data
    notes: >-
      This table mixes direct commercial proof with top-of-funnel and channel
      signals because the assigned pool does not disclose direct customer-count
      or retention metrics; missing denominator flags the unsupported quantity
      needed for diligence.
    claimRefs: [CU005, CU006, CU007, CU008, CU011, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof quality
      - Limitation
    rows:
      - - Tech Mahindra
        - Global systems integrator / channel partner
        - Direct access to Viam for managing and maintaining robotic fleets at scale
        - Commercial partnership and enablement; production end-customer deployment not disclosed
        - Named partner, current-dated announcement, and syndicated trade republication
        - No live customer names, no revenue share, no go-live count
      - - Tech Mahindra global manufacturing clients
        - Downstream enterprise cohort in industrial automation
        - Planned deployment of automation solutions using Viam across industries
        - Earlier-stage enablement rather than named production references
        - Specific use cases include remote fleet management, predictive maintenance, and OTA updates
        - Cohort is unnamed and outcomes are not quantified
      - - Hannover Messe industrial audience
        - Manufacturing buyer audience
        - Teleoperation demo with Viam-powered robotic arms performing remote pick-and-place tasks
        - Demonstration and demand-generation proof, not deployment proof
        - Fresh event signal aligned to industrial buyer pain points
        - Audience exposure does not establish paid usage or retention
    notes: >-
      Partial enumeration of the named customer-proof surfaces available in the
      assigned pool; rows separate partner proof, downstream cohort language,
      and demo visibility because public production-customer references are not
      disclosed.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly accessible named customer-proof and adjacent buyer-proof
        surfaces in the assigned prefetched pool as of the 2026-10-19 refresh.
    claimRefs: [CU006, CU007, CU008, CU010, CU013, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public materials suggest a journey from builder evaluation to fleet
      operations and partner-enabled expansion, but not a disclosed retention
      loop backed by customer metrics.
    data:
      items:
        - label: Discover Viam
          actor: Engineers, startups, enterprise innovators
          stage: Awareness
          channel: About page and partner announcements
          touchpoints:
            - Free account invitation
            - Company positioning across multiple industries
            - Tech Mahindra partnership announcement
          tone: positive
        - label: Trial a machine workflow
          actor: Developers and robotics engineers
          stage: Evaluation
          channel: Docs and playground demo
          touchpoints:
            - Demo playground in browser
            - Configure hardware and APIs
            - First-machine setup guidance
          tone: positive
        - label: Build the application
          actor: Engineering team
          stage: Implementation
          channel: SDKs, registry, and modules
          touchpoints:
            - Multi-language SDKs
            - Built-in drivers and modules
            - Remote testing against hardware
          tone: positive
        - label: Operate remotely
          actor: Fleet and operations teams
          stage: Production operations
          channel: Web console and cloud controls
          touchpoints:
            - Monitoring and diagnostics
            - Teleoperation
            - OTA updates and alerts
          tone: positive
        - label: Deliver to end customers
          actor: OEM or robotics product company
          stage: Expansion
          channel: Customer-facing app surfaces
          touchpoints:
            - White-label authentication
            - Web/mobile SDKs
            - Built-in billing
          tone: positive
        - label: Expand through partners
          actor: Tech Mahindra and downstream enterprise clients
          stage: Channel scale-up
          channel: Systems integrator enablement
          touchpoints:
            - Partner engineer training
            - Industrial automation use cases
            - Global client access via channel
          tone: warning
    approximationNotes: >-
      Sequence reflects public workflow surfaces and the named channel
      partnership, not measured conversion rates or disclosed retention loops.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008]
callouts:
  - calloutType: strength
    title: Fresh commercial proof exists, but it is channel-led
    body: >-
      The June 2026 Tech Mahindra partnership is the clearest public evidence
      that Viam can enter enterprise robotics programs, yet it validates route
      to market more than it validates named production-customer depth.
    claimRefs: [CU006, CU007, CU013, CU014]
  - calloutType: insight
    title: Viam's customer surface is multi-sided
    body: >-
      The platform is not just sold to robotics teams operating fleets; it is
      also positioned for builders, OEMs shipping robots to their own
      customers, and channel partners who can implement or resell the stack.
    claimRefs: [CU001, CU003, CU004, CU005]
  - calloutType: risk
    title: Durability still lacks public proof
    body: >-
      No source in the assigned pool discloses customer counts, retention,
      renewal rates, or top-customer mix, so customer quality remains less
      proven than product breadth or channel promise.
    claimRefs: [CU010, CU011, CU012, CU015]
