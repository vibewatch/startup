  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-support
      missingEvidence: Current revenue or ARR, gross margin, and net revenue retention by major customer cohort.
      whyItMatters: These metrics determine whether the latest private mark reflects software economics or only strategic narrative and sponsor confidence.
      diligencePath: Request management operating KPI pack and board materials covering the latest twelve months and current quarter.
      relatedQuestionRefs: [QV005, QV008]
    - type: private-evidence-only
      severity: material
      topic: valuation-marks
      missingEvidence: Post-money valuation, share class terms, liquidation preferences, option pool impact, and any insider-led structure from the March 2025 round.
      whyItMatters: Headline secondary marks can overstate common-share economics if the round includes preference overhang or other investor protections.
      diligencePath: Obtain the latest financing documents, cap table, and investor rights summary from management or lead counsel.
      relatedQuestionRefs: [QV004, QV008]
    - type: missing-source
      severity: material
      topic: monetization-architecture
      missingEvidence: Public or private proof of realized pricing, customer expansion, churn, and conversion from product usage to paid software revenue.
      whyItMatters: The product story is credible, but the investment case depends on whether fleet and billing primitives translate into durable monetization.
      diligencePath: Review customer contracts, cohort revenue bridge, and pipeline conversion data for paid deployments.
      relatedQuestionRefs: [QV006, QV007, QV008]
