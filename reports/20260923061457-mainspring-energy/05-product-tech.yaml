    - Lathrop reports 40% lower electricity rates and 95% peak-load coverage; UMPA selected 48 MW local generation
    - No public utility dispatch-time series
  - - Data center unlocks power-constrained site
    - Wait for grid upgrades and rely on diesel backup
    - Factory-built fuel-flexible onsite generation with islanding options
    - Latitude says first greenfield AI site scales in 25-50 MW blocks; official page emphasizes accelerated permitting
    - No public uptime report from a customer-owned data-center dashboard
  - - Enterprise site lowers cost and firms solar
    - Buy all grid power or add diesel for backup
    - Prime power plus solar firming with financing and service options
    - Lineage uses solar plus Mainspring to target 100% onsite annual energy at Colton
    - Public economics are concentrated in a few named case studies
  - - Biogas operator monetizes methane
    - Flare gas or use less flexible generation
    - Low-NOx multi-fuel distributed generation on digester or upgrader sites
    - CalBio expanded from initial sites to a planned 5.3 MW across five locations by end-2026
    - No public IRR or payback disclosures by project cohort
  - - Wastewater campus converts methane into resilient power
    - Flare methane and pay utility bill for treatment operations
    - Six-generator initial build with planned expansion to twelve
    - MBEC expects to offset about one-third of its electric bill and cut routine flaring
    - Project is announced, but public operating results are not yet available
