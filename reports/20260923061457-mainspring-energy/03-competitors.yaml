  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Realized project pricing and discount schedules across competitor set
    missingEvidence: Public sources do not disclose contracted $/kW, service attach rates, or discount ranges for comparable
      Mainspring, Bloom, Capstone, or Cummins deals.
    whyItMatters: Without realized economics, it is hard to determine whether Mainspring wins because of product superiority,
      pricing aggression, or simply category timing.
    diligencePath: Request three recent signed proposals or customer contracts, including equipment price, services, financing
      structure, and expected LCOE versus alternatives.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: Switching-cost proof beyond marketing and partner references
    missingEvidence: The retained source set does not disclose renewal rates, fleet expansion rates by cohort, or win-loss
      data proving durable lock-in after first deployment.
    whyItMatters: Competitive durability depends on whether Mainspring becomes embedded infrastructure rather than an initially
      attractive hardware choice.
    diligencePath: Request cohort retention by installed site, follow-on module purchases, and pipeline conversion data for
      partner-led versus direct deals.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs: []
  - type: missing-source
    severity: minor
    topic: Caterpillar-specific data-center competitive detail
    missingEvidence: Search results surfaced Caterpillar as a relevant incumbent class, but the retained accessible source
      set was stronger on Cummins than on Caterpillar-specific onsite-power buyer proof.
    whyItMatters: A fuller incumbent map would sharpen how much Mainspring faces one dominant incumbent versus a broader pack
      of traditional generator vendors.
    diligencePath: Pull current Caterpillar electric-power and annual-report materials that quantify data-center, gas-generator,
      or microgrid commercial emphasis.
    relatedQuestionRefs:
    - QP003
    relatedTableRefs: []
