  - Limitation
  rows:
  - - Mainspring Energy
    - Direct / modular low-emissions onsite power
    - '>$800M total financing; $258M Series F in 2025; hundreds of MW in field operations and advanced development'
    - Utilities, enterprises, industrials, data centers
    - Fuel-flexible linear generator; 250 kW blocks to 100+ MW; near-zero NOx claim
    - Private pricing and realized margin are undisclosed
  - - Bloom Energy
    - Direct / premium low-emissions onsite power
    - $1.47B 2024 revenue; 27.5% annual gross margin; public company
    - Data centers, commercial & industrial, utilities
    - Large-scale SOFC deployments; Intel and AEP data-center proof
    - Less explicit fuel-switching narrative than Mainspring and likely higher system complexity
  - - Capstone Green Energy
    - Direct-adjacent / microturbines
    - Public microturbine vendor; emerged from Chapter 11 in Dec. 2023
    - Microgrids, CHP, critical power, data centers
    - 65 kW to multi-MW microturbines; service revenue base; broad distributor network
    - Financial fragility and weaker backlog reduce strategic confidence
  - - Cummins
    - Incumbent / engines & backup power
    - $34.1B 2024 revenue; 24.7% gross margin
    - Data centers, distributed generation, industrial backup
    - Massive service network, natural-gas engines, mission-critical credibility
    - Conventional engine portfolio lacks Mainspring's core fuel-flexibility and emissions narrative
  - - Schneider + Mainspring
    - Adjacent channel / microgrid integrator
    - Enterprise microgrid channel rather than generator OEM scale
    - Commercial, industrial, logistics, data centers
    - Makes Mainspring easier to buy in broader microgrid projects
    - Channel partnership does not itself prove long-term product lock-in
  - - Hyliion / Flexnode
    - Likely entrant / emerging substitute
    - Early commercial traction reported by industry media
    - Data complexes and mission-critical sites
    - Similar linear-generator concept with multi-fuel positioning
    - Public deployment depth still limited relative to incumbents and Bloom
  notes: The table mixes direct rivals, incumbents, and enabling channel alternatives because buyers can solve the same onsite-power
    job through different procurement paths.
