  name: Mainspring Energy
chapter:
  number: 8
  title: Valuation
  summary: Mainspring looks strategically important and commercially relevant, but public evidence still supports research-more
    with a high risk rating and unknown valuation stance because revenue and price remain undisclosed.
sections:
- id: S801A
  title: Current entry context
  body: Mainspring’s public narrative supports commercial relevance but not price precision. The company has a recent $258
    million Series F round, says cumulative financing now exceeds $800 million, and continues to add large reference deployments
    and manufacturing capacity. That is enough to conclude the business is neither stalled nor purely conceptual. It is not
    enough to determine whether today’s private valuation is attractive, fair, or stretched because the company does not publicly
    disclose revenue, gross margin, backlog, current post-money valuation, or cap-table terms. In practical terms, investors
    can underwrite strategic momentum and execution risk, but not entry price. That makes valuation work an exercise in anchor
    ranges and diligence priorities rather than in definitive fair-value math. That limitation matters because private-company
    valuation discipline is mainly about entry price and downside structure, not about admiring strategic relevance in the
    abstract.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  tableRefs:
  - TV001
- id: S801B
  title: Comparable anchors and scenario framing
  body: 'The most useful public anchors are industrial and power-equipment peers rather than software businesses. Generac,
    Cummins, and Caterpillar all provide tradable market-cap and revenue reference points, and they also publish risk disclosures
    that fit a manufacturing-led power platform. Using market-cap-to-revenue as a simple public anchor, the observed band
    runs from about 2.7x for Cummins to 6.0x for Caterpillar, with Generac around 3.6x. That range is informative but imperfect.
    Caterpillar embeds a larger, more diversified industrial platform, while Generac and Cummins are more comparable on power-equipment
    execution risk. A clean-tech peer such as Bloom Energy adds another important lesson: strong growth can still coexist
    with warranty reserves, debt, and commercialization noise. The right interpretation is that Mainspring could earn premium
    multiples only if it proves manufacturing scale and service durability, not simply because power demand is hot. In other
    words, the comps are useful for discipline and scenario framing, but they cannot substitute for company-specific financial
    disclosure.'
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  tableRefs:
  - TV002
- id: S801C
  title: Recommendation and diligence gates
  body: 'Given the evidence available on 2026-05-05, the most defensible call is research-more with medium confidence, a high
    risk rating, and an unknown valuation stance. The positive side of the ledger is meaningful: more than 500 MW of late-stage
    development and operation, a large factory grant, utility and municipal projects, a defense pilot, and a board strengthened
    with experienced industrial operators. The negative side is more important for current entry discipline: no public revenue
    or margin disclosure, no disclosed current price, no public cap-table terms, limited reliability visibility, and unclear
    concentration. That means an investor should not confuse company quality with investable price support. Price sensitivity,
    dilution risk, and exit timing all remain too opaque for a buy recommendation today. The asymmetry is therefore favorable
    only if the eventual private price is materially discounted to those uncertainties.'
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  tableRefs:
  - TV003
  figureRefs:
  - FV001
