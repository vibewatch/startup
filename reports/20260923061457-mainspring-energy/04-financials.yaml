- id: FI001
  title: Revenue model bridge
  type: flow
  summary: Mainspring's public monetization path appears to move from customer power need to financed or direct deployments,
    then into service and repeat-site expansion.
  data:
    nodes:
    - id: n1
      label: Power-constrained customer
      detail: Utilities, enterprises, industrial users, data centers, and cold-storage operators are named use cases.
    - id: n2
      label: Direct or financed generator deployment
      detail: Customer can buy directly or use financing-partner monthly payments with no upfront capital.
    - id: n3
      label: Installation + commissioning
      detail: Deployment-led revenue likely includes equipment and project implementation economics.
    - id: n4
      label: Service / maintenance attach
      detail: Official pages market turnkey maintenance and flexible service offerings.
    - id: n5
      label: Repeat site expansion
      detail: Lineage framework-plus-expansion evidence suggests follow-on orders are a key quality signal.
    - id: n6
      label: DOE grant and Pennsylvania plant scale-up
      detail: Public grant and factory expansion support the capital-intensity story but do not disclose realized margins.
    edges:
    - from: n1
      to: n2
      label: Procurement decision
    - from: n2
      to: n3
      label: Deployment revenue
    - from: n3
      to: n4
      label: Operate asset
    - from: n4
      to: n5
      label: Cohort expansion
    - from: n5
      to: n6
      label: Scale-up capital
  approximationNotes: The bridge is qualitative because retained public sources describe monetization structure but not exact
    revenue splits.
