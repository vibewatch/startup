company:
  name: Mainspring Energy
chapter:
  number: 4
  title: Financials
  summary: 'Mainspring''s public financial picture is strongest on capital formation, deployment proof, and monetization structure,
    but weak on realized economics. Official sources support a project-led revenue model built around generator deployments,
    financed onsite-power arrangements, maintenance/service options, and partner-led microgrid projects rather than a transparent
    recurring-software model. The company has also disclosed substantial capital support: a $258 million Series F in April
    2025, more than $800 million of cumulative financing, and an $87 million DOE manufacturing grant tied to a >$175 million
    Pennsylvania plant intended to produce 1,000 generators per year. Those facts suggest a business scaling into a capital-intensive
    market with real customer pull. They do not disclose revenue, ARR, gross margin, cash, burn, runway, or customer concentration.
    The underwriting conclusion is therefore mixed: Mainspring appears to have meaningful demand and multiple monetization
    pathways, but public evidence is still insufficient to judge margin quality, sales efficiency, or near-term capital adequacy
    with confidence.'
sections:
- id: revenue-model-and-monetization
  title: Revenue Model and Monetization
  body: 'The retained public record supports a revenue model centered on selling or financing modular onsite-power systems,
    then layering service, maintenance, and repeat-site expansion rather than on selling a transparent software subscription.
    Mainspring''s enterprise and solutions pages repeatedly frame the product as a turnkey onsite-power offering that can
    be bought with flexible ownership structures, monthly payments, and maintenance options. The product is explicitly designed
    for utilities, enterprises, industrial users, and data centers, which suggests a deployment-led business where monetization
    tracks project scope and site operating economics more than seat-based usage. Customer evidence from Lineage reinforces
    that interpretation: deployments expand across facilities over time, pointing to repeat project revenue and potential
    service or fleet-management economics. The key constraint is that Mainspring does not publish a list price, power-purchase
    rate, ACV range, or disclosed service attach rate. Public evidence therefore supports the structure of the revenue model,
    but not its realized mix or quality.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  tableRefs:
  - TI001
- id: gtm-and-sales-efficiency
  title: GTM Motion and Sales Efficiency Proxies
  body: 'Mainspring''s GTM motion looks consultative and infrastructure-led rather than transactional. The strongest evidence
    comes from the kinds of customers and partnerships it highlights: Schneider-led microgrids, Lineage rollouts, utility
    projects, data-center messaging, and manufacturing expansion sized for rapid capacity deployment. These are not lightweight
    self-serve workflows. They imply long selling cycles, site design work, permitting, installation, and financing coordination.
    PG&E''s February 2025 data-center interconnection release is important because it shows the surrounding market condition
    helping Mainspring: large customers want power faster than utilities can always deliver it, and some are willing to fund
    infrastructure upfront under new tariff mechanisms. That makes Mainspring''s “speed-to-power” pitch economically credible
    even without public CAC or payback metrics. The missing piece is efficiency measurement. No retained source discloses
    sales-cycle duration, pipeline conversion, CAC, customer acquisition headcount, or payback period, so the chapter can
    only infer a high-touch motion with potentially strong average contract value but heavy acquisition and deployment friction.'
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  tableRefs:
  - TI002
- id: cost-structure-and-margin-path
  title: Cost Structure and Margin Path
  body: 'Mainspring appears structurally more capital-intensive than a pure software business. The official pages emphasize
    lower capex, lower maintenance, and higher efficiency relative to alternatives, but those are buyer-facing value claims
    rather than reported margins. The DOE grant and Pennsylvania plant plans imply real manufacturing, tooling, and workforce
    build-out; the CEC report further frames the product as a hardware system whose value rests on efficiency, emissions,
    fuel flexibility, and low costs. That points to a blended cost structure spanning generator manufacturing, field deployment,
    service, and partner support. Public-company comparables suggest the likely range of outcomes. Bloom shows that low-emissions
    onsite-power vendors can reach 27.5% gross margin at scale, while Cummins shows a much larger industrial power business
    at 24.7% gross margin. Capstone is the downside reminder that distributed-generation vendors can still face backlog compression,
    restructuring, and liquidity stress even with a service component. The gap is obvious: Mainspring does not disclose its
    own gross margin, contribution margin by deployment, or service-versus-hardware mix, so investors cannot yet place it
    confidently on that spectrum.'
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  tableRefs:
  - TI003
  figureRefs:
  - FI001
