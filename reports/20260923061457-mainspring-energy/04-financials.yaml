  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Current cash, burn, and runway
    missingEvidence: No retained public source provides Mainspring's current cash balance, monthly cash burn, or runway calculation.
    whyItMatters: Capital adequacy cannot be underwritten from disclosed financing alone when manufacturing scale-up and financed
      deployments may consume cash unevenly.
    diligencePath: Request monthly cash flow statements, current treasury balance, debt schedule, and a base / downside runway
      model.
    relatedQuestionRefs:
    - QI001
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: Gross margin and revenue mix by stream
    missingEvidence: Public materials do not disclose revenue by hardware, service, financing income, or partner channel,
      nor the gross margin attached to each stream.
    whyItMatters: Without mix and margin data, investors cannot tell whether Mainspring is evolving toward attractive recurring
      economics or remaining a low-visibility project business.
    diligencePath: Request a 24-month revenue bridge by stream with gross margin, contribution margin, and backlog conversion
      by cohort.
    relatedQuestionRefs:
    - QI001
    relatedTableRefs: []
  - type: missing-source
    severity: material
    topic: Customer concentration and working-capital profile
    missingEvidence: Retained public sources do not quantify top-customer exposure, deposit structures, DSO, milestone billing,
      or inventory turns.
    whyItMatters: Hardware-heavy growth businesses can look well funded while still facing acute cash pressure from concentration,
      delayed collections, or inventory build.
    diligencePath: Request top-10 customer share, billing milestones, deposit terms, DSO, inventory metrics, and any project-finance
      or guarantee obligations.
    relatedQuestionRefs:
    - QI001
    relatedTableRefs: []
