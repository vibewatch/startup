figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  summary: Approximate nested lens from broad U.S. data-center power demand to the subset likely to seek onsite primary power
    to Mainspring’s currently evidenced deployment wedge.
  data:
    items:
    - label: 'TAM lens: U.S. data-center power demand by 2030'
      detail: McKinsey estimates U.S. data-center demand rising to >80 GW by 2030; other cited estimates span roughly 50-120
        GW.
      value: 80
    - label: 'SAM lens: share of sites likely to use onsite primary power'
      detail: Applying Bloom’s ~30% onsite-primary site share to McKinsey’s 80 GW demand lens implies ~24 GW of demand with
        stronger onsite-power relevance.
      value: 24
    - label: Current evidenced wedge
      detail: Mainspring publicly claims >500 MW in late-stage development and operation across utilities, C&I, data centers,
        and biogas / wastewater use cases.
      value: 0.5
    - label: Data-center operators exploring onsite generation
      detail: Industry survey cited in the chapter says 62% of data centers are exploring onsite generation.
      value: 62
    - label: Utility commitments for large load growth
      detail: Wood Mackenzie lens in the chapter notes 64 GW of utility commitments tied to proposed U.S. data-center growth.
      value: 64
    - label: Proposed U.S. data-center pipeline
      detail: Wood Mackenzie lens in the chapter tracks 134 GW of proposed U.S. data centers.
      value: 134
  approximationNotes: All values are in GW. The middle layer is a derived approximation using a site-share statistic rather
    than a direct market total, and the bottom layer is Mainspring’s company-claimed currently evidenced wedge rather than
    a formal SOM.
