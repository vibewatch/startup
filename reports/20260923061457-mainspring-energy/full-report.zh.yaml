  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局总览
        blocks:
          - type: paragraph
            body: >-
              Mainspring
              的竞争对手远不止某一家清洁能源初创公司。买方实际面临的可替代方案包括：主打低排放的同类现场发电厂商、老牌内燃机及发电机巨头、周边微电网系统集成商，以及维持传统电网供电搭配常规柴油备用机的行业现状。在追求低排放现场供电的数据中心及高可靠性负荷市场，Bloom
              Energy 是最直接的高端对标竞品。Capstone Green Energy 则是主打模块化热电联产（CHP）与微型燃气轮机的替代方案，拥有相当数量的微电网与数据中心落地案例。Cummins
              则代表着传统巨头的存量碾压：其数据中心业务板块、年度财报与业绩说明展现出庞大的装机存量、品类齐全的天然气及备用发电机谱系，并在数据中心发电市场拥有深厚抓手。Mainspring
              自身卡位横跨公用事业、大型企业、工业园区和算力中心，处于关键电力保供、企业脱碳专项预算及电网排队扩容瓶颈的交汇带，而非偏安于单一细分市场。
            claimRefs:
              - CP001
              - CP002
              - CP003
