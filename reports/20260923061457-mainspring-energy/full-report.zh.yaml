      - number: '3.4'
        title: 支撑图表与专题分析
        blocks:
          - type: callout
            title: Mainspring 拥有扎实的环评审批与燃料灵活性突破口
            body: >-
              公开资料持续印证其兼具燃料平滑切换、极低排放与模块化快速部署的差异化故事。这种组合拳远比泛泛的「现场自备电」叙事更具穿透力，也合理解释了为何 Schneider、Lineage
              以及公用事业项目能成为极具战略分量的落地标杆。
            calloutType: strength
            claimRefs:
              - CP001
          - type: callout
            title: 品类崛起反倒可能削弱企业自身护城河
            body: >-
              一旦买方将模块化低排放发电视作一个成熟品类开展标准化集采，体量更庞大的传统巨头与规模化竞品便能凭借方案打包、雄厚资产负债表与更完善的服务网点，迅速抹平 Mainspring
              先发优势。因缺乏公开透明定价数据，外界尚无从证实 Mainspring 是否在实际度电成本或投资回报上拥有绝对胜算，进一步放大了潜在挤压风险。
            calloutType: risk
            claimRefs:
              - CP001
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 商业模式与收入变现路径
        blocks:
          - type: paragraph
            body: >-
              现有公开材料所支撑的盈利模式，本质是销售或按期租赁模块化现场发电硬件，随后叠加运维服务及跨园区复制增购，而非透明的纯软件订阅。Mainspring
              的企业方案与产品页面反复将其表述为交钥匙型现场发电产品，支持灵活的资产所有权安排、月付租赁模式以及全包运维保障。产品专门面向公用事业、大型企业、工业园区和数据中心打造，凸显出以重工程部署为导向的商业特征，其创收规模紧密跟随工程体量和场站运行经济性，而非按软件账号席位计费。Lineage
              的实际客户证据佐证了这一推断：装机在各冷库网点间逐步扩建，带来了持续的项目制复购收入以及潜在的长周期服务或机队管理收益。核心制约在于 Mainspring
              从未对外披露设备公开指导价、度电购电协议（PPA）费率、年度合同额（ACV）区间或售后运维签约渗透率。因此公开证据只能证明该收入模式的顶层框架，无法验证实际的毛利结构与收入质量。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
