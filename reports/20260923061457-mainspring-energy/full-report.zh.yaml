chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Mainspring Energy 将自身定位为区域级、多燃料且低排放的分布式发电设备提供商，而非通用发电机组制造商。官方材料将其核心产品 Mainspring 线性发电机定义为可调度的现场供电系统，既可单机
              250 kW 模块独立运行，也能扩容组装为 100 MW
              以上的大型阵列。该设备支持天然气、丙烷、沼气、氢气和氨气等多种气体燃料。公司以此打出核心卖点：客户先用常规燃料即刻点亮新增负荷，日后无需更换已装机资产即可无缝切入低碳燃料。TechCrunch 在 2021
              年的发布报道以及 Mainspring 官方通稿均将技术渊源追溯至三位创始人于斯坦福大学热力学实验室的早期研发，确立了深厚技术积累与业务场景高度契合的创始人故事。


              Mainspring
              的商业模式以落地部署为主导。公司并未将自己局限于纯粹依赖分销商网络的标准化设备厂商，其官方及合作材料屡屡强调交钥匙或伙伴协同部署、融资配套以及针对特定项目的用电韧性交付。公开资料显示，其客户覆盖公用事业、工商业园区、冷链仓储、污水甲烷、奶牛场沼气、电动汽车充电站及微电网项目。这种多元客户画像表明，Mainspring
              身处重资本的电力基础设施赛道，客户采购不仅看重硬件性能，同样取决于项目开发、环评审批与融资支持等多重落地能力。产品反复强调「快速并网交付（speed-to-power）」、极低 NOx
              排放和多燃料灵活性，本质上是在变现用电可靠性与交付时间窗口价值，而非单纯吃效率溢价。
