      - number: '1.2'
        title: 创始人团队、核心高管与公司治理
        blocks:
          - type: paragraph
            body: >-
              公开资料中记录的创始人阵容高度一致：Shannon Miller、Adam Simpson 与 Matt Svrcek。Shannon Miller
              是最核心的关键人物，在公司官方通告、伙伴联合发布、投资人评述以及行业报道中始终以创始人兼 CEO
              身份出镜，是关于融资、产品性能与市场落地的首要对外发声人。这种高度聚焦带来了实质性的关键人物依赖风险，投资人、合作伙伴及媒体叙事几乎全盘系于 Miller 个人的商业判断与技术架构视角。


              管理团队纵深有所改善，但仍显现出较强的创始人中心色彩。Adam Simpson 虽始终被冠以联合创始人头衔，但其对外公开职务经历了调整：2024 年 7 月的分销商合作通报中其职位为首席产品官（CPO），而到了
              2026 年 2 月和 3 月的客户发布中已变更为首席商务官（CCO）。这种职务变动折射出随着装机规模放量，公司管理重心正加速转向商业化落地。在治理层面，2025 年 4 月随 Series F 轮融资宣布
              Tom Linebarger 和 Bethany Mayer 进入董事会，公司治理结构有所充实。Linebarger 带来了 Cummins 深厚的发电设备运营底蕴，Mayer
              则补齐了硬件与上市公司运作经验。但即便吸收了外部资深董事，公开可见的管理梯队相比其庞大的募资体量依然偏单薄，现有信源尚未披露完整的高管名录、各专业委员会运作机制及董事会投票控制权架构。
            claimRefs:
