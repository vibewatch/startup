      - number: '3.3'
        title: 渠道分销壁垒、客户转换成本与多供应商混用
        blocks:
          - type: paragraph
            body: >-
              Mainspring 当前面临的核心战略难题，并不在于证明产品具备技术新颖性，而在于如何在传统巨头反扑同质化这一赛道前，将技术新颖度转化为标准化分销能力与客户转换壁垒。与 Schneider
              的战略协同正是瞄准此点：通过将线性发电机与 Schneider 的 EcoStruxure 微电网设计集成总包绑定，降低了客户在综合能源韧性项目中采购 Mainspring 的决策摩擦。Lineage
              提供了第二层支点：跨多个站址的连续增购部署，为节约用电成本、平抑光伏波动及可测算的现场供电经济性提供了直接背书。即便如此，客户依旧普遍采取多供应商混用策略。一个用电园区往往会将 Mainspring 或
              Bloom 的发电单元与锂电池、光伏、能源管理系统以及传统柴油发电机搭配使用。UtilityDive
              的调研报道同样指出，数据中心与充电车队客户首要解决的是供电到位速度，而非品牌忠诚度。这意味着一旦电网排队拥堵有所缓解，Mainspring 目前赖以破局的切口优势或将被压缩。因此，Mainspring
              必须让伙伴渠道获客能力、环评落地壁垒以及机队运行数据资产的沉淀速度，跑赢市场对模块化低排放发电设备标准化的演化周期。
            claimRefs:
