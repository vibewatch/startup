    rows:
      - - 乐观情景
        - 工厂按期完成产能爬坡，标杆项目顺利转化商用，且公司开始披露机组可靠性与实际收入规模。
        - 对标可比上市公司上限估值倍数更具说服力；工业稀缺性溢价定位有望获得支撑。
        - 若扩张速度超过质量管控能力，质保或售后维保问题仍会限制上行空间。
        - 依赖多项新增验证支撑，当前概率信号处于低位。
      - - 基准情景
        - 市场需求保持强劲，但信息披露依旧有限，工厂爬坡成效仍为核心卡点变量。
        - 采用可比上市公司中低端倍数作为锚定，并坚持因不透明度扣减估值折扣。
        - 定价过高风险与股权稀释风险依然显著。
        - 最契合当前公开证据的情景。
      - - 悲观情景
        - 工厂投产或项目交付持续拖延，同时底层经济性数据始终成谜。
        - 面临降估值融资或估值倍数大幅压缩风险；核心诉求转向本金保全。
        - 执行进度脱节、客户集中度过高及后续巨额再融资诉求。
        - 若里程碑一再延期且未见新披露，风险评级将迅速恶化。
      - - 融资或披露冲击
        - 在收入与可靠性好转前被迫开展新一轮融资
        - 将严重打压投资入场定价并加剧股权稀释
        - 或促使整个投资逻辑彻底退守至本金保全
        - 密切跟踪下轮融资节点及任何新增信息披露
    notes: 由于当前一级市场估值与营收基数未公开，情景分析逻辑仅具方向性指导意义。
    claimRefs:
      - CV007
      - CV008
      - CV009
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 自创立至 2026 年经过公开交叉验证的里程碑，呈现出从斯坦福技术研发走向渠道拓展与多行业商业化部署的演进路径。
    data:
      items:
        - date: '2010-01-01'
          label: 在门洛帕克创立
          detail: Shannon Miller、Adam Simpson 与 Matt Svrcek 共同创立公司，随后将直线发电机推向商业化。
          tone: positive
        - date: '2020-06-01'
          label: 试点机组启动发货
          detail: 试点机组陆续向财富 500 强客户发货，推动产品从实验室走向现场实际应用。
          tone: positive
        - date: '2021-03-09'
          label: 商业化发布 + 与 NextEra 达成协议
          detail: Mainspring 正式发布直线发电机，并与 NextEra Energy Resources 达成规模 1.5 亿美元的设备采购与项目融资合作。
          tone: positive
        - date: '2022-06-22'
          label: 氢能与氨能里程碑
          detail: 公司称其发电机已顺利完成 100% 纯氢与 100% 纯氨的关键燃料测试。
          tone: positive
        - date: '2024-04-02'
          label: Schneider Electric 微电网合作
          detail: 合作瞄准亟需本地韧性电力的工商业（C&I）及关键供电保障客户。
          tone: positive
        - date: '2024-10-24'
          label: ABM 电动汽车充电合作
          detail: 与 ABM 携手将 Mainspring 的应用版图拓宽至车队充电及交钥匙 EPC 工程部署。
          tone: positive
        - date: '2025-04-14'
          label: F 轮融资 + 董事会扩容
          detail: General Catalyst 领投 2.58 亿美元 F 轮融资；Tom Linebarger 与 Bethany Mayer 入驻董事会。
          tone: positive
        - date: '2026-03-09'
          label: Chattanooga 市政污水处理项目
          detail: Chattanooga 市携手 Mainspring 启动 3 MW 污水处理沼气发电项目。
          tone: positive
    approximationNotes: null
    claimRefs:
      - CO010
      - CO011
      - CO012
  - id: FM001
    title: 市场规模多重视角测算
    type: pyramid
    summary: 采用层层递进的嵌套测算视角：从广义美国数据中心电力需求，收窄至可能寻求分布式现场主力供电的目标客群，再对应至 Mainspring 当前已获验证的实际部署切口。
    data:
      items:
        - label: TAM 视角：2030 年美国数据中心电力需求
          detail: 麦肯锡预计到 2030 年美国数据中心需求将突破 80 GW；引述的其他机构测算大致落在 50-120 GW 区间。
          value: 80
        - label: SAM 视角：可能采用现场主力供电的站点比例
          detail: 将 Bloom 约 30% 现场主力供电站点占比代入麦肯锡 80 GW 需求测算，对应约 24 GW 具备较强现场供电关联性的潜在需求。
          value: 24
        - label: 当前已验证业务切口
          detail: Mainspring 公开宣称在公用事业、工商业、数据中心及沼气/污水处理场景中，处于后期开发与投运阶段的项目规模超过 500 MW。
          value: 0.5
        - label: 探索现场自备发电的数据中心运营商
          detail: 本章引述的行业调研显示，62% 的数据中心正积极探索现场自备发电。
          value: 62
        - label: 公用事业电网应对高负荷增长的接入承诺
          detail: 本章引述 Wood Mackenzie 观点指出，电网针对美国拟建数据中心增长做出的配套接入承诺规模达 64 GW。
          value: 64
        - label: 美国拟建数据中心储备管线
          detail: 本章引述 Wood Mackenzie 观点追踪到美国拟建数据中心储备规模达 134 GW。
          value: 134
    approximationNotes: 所有数值单位均为 GW。中间层系采用站点占比统计数据推导得出的近似值，而非直接市场总额；底层系 Mainspring 官方宣称的当前已验证切口，而非严格统计的 SOM。
    claimRefs:
      - CM010
      - CM011
      - CM012
  - id: FP001
    title: 竞争定位格局图
    type: quadrant
    summary: Mainspring 在燃料灵活性与行政审批便利度上表现优异，但在分销渠道撬动力与存量装机信任度上仍落后于 Bloom，尤其是 Cummins。
    data:
      xAxis:
        label: 分销渠道 / 存量装机杠杆（0-10 序数标度）
      yAxis:
        label: 燃料灵活性 + 审批优势（0-10 序数标度）
      points:
        - label: Mainspring
          x: 6
          'y': 9
          detail: 技术切入点明确，渠道触达能力虽在成长但仍处于构建阶段。
          tone: positive
        - label: Bloom Energy
          x: 8
          'y': 7
          detail: 公开业务规模庞大且数据中心落地验证扎实，对无缝多燃料切换关注度相对较低。
          tone: positive
        - label: Capstone
          x: 5
          'y': 5
          detail: 微电网场景适配性良好，但经历债务重组后战略持续性偏弱。
          tone: warning
        - label: Cummins
          x: 10
          'y': 4
          detail: 具备压倒性的传统龙头渠道触达与维保服务深度，但在排放指标与审批便利度上缺乏差异化优势。
          tone: neutral
        - label: Hyliion / Flexnode
          x: 3
          'y': 7
          detail: 直线发电设备新晋玩家，现场实证记录较少。
          tone: warning
        - label: Schneider Electric 微电网渠道
          x: 7
          'y': 6
          detail: 分销渠道与系统集成优势可将 Mainspring 捆绑导入更广泛的微电网项目。
          tone: neutral
    approximationNotes: 各项得分为基于公开产品页面、商业部署、监管文件及合作伙伴信号给出的实据性序数判断，并非厂商直接披露的指标。
    claimRefs:
      - CP010
      - CP011
      - CP012
  - id: FI001
    title: 商业模式推进路径
    type: flow
    summary: Mainspring 的公开商业化路径清晰：先切入客户用电痛点，完成设备直销或融资租赁部署，再延伸至维保服务并推动跨站点复购扩张。
    data:
      nodes:
        - id: n1
          label: 电力受限客户
          detail: 公用事业机构、大型企业、工业用户、数据中心及冷链仓储运营商均为已披露用例。
        - id: n2
          label: 发电机直销或融资租赁部署
          detail: 客户可直接采购，也可借助融资伙伴按月付费，无需承担前期资本开支。
        - id: n3
          label: 安装与调试交付
          detail: 部署端收入多半涵盖设备交付与工程落地环节的商业收益。
        - id: n4
          label: 维保服务附着
          detail: 官网主推交钥匙维保与灵活服务方案。
        - id: n5
          label: 跨站点复购扩张
          detail: Lineage 框架协议落地及后续扩建表明，追加订单是验证商业质量的关键信号。
        - id: n6
          label: DOE 补贴与宾夕法尼亚工厂扩产
          detail: 政府补贴与工厂扩建支撑了重资产扩张逻辑，但尚未披露实际达成的利润率。
      edges:
        - from: n1
          to: n2
          label: 采购决策
        - from: n2
          to: n3
          label: 部署收入
        - from: n3
          to: n4
          label: 资产运营
        - from: n4
          to: n5
          label: 客户群扩张
        - from: n5
          to: n6
          label: 扩产资金
    approximationNotes: 由于现有公开信息仅披露了商业化架构而未给出具体收入拆分，本路径图为定性梳理。
    claimRefs:
      - CI010
      - CI011
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 展示公开披露的完整产品架构，涵盖燃料处理、发电机物理反应、电力电子及机队级软件管理。
    data:
      layers:
        - label: 燃料供应与现场接口
          modules:
            - 天然气 / RNG / 生物天然气 / 丙烷 / 氢气 / 氨气
            - 场地规划、许可报批与气压调理
        - label: 反应与运动核心
          modules:
            - 低温无燃烧反应区
            - 空气弹簧回弹振子 / 活塞组件
        - label: 电磁转换模块
          modules:
            - 铜线圈内部运动的磁体阵列
            - 直线运动直接转换为电能
        - label: 电力电子与控制系统
          modules:
            - 自适应压力循环控制（Adaptive Pressure Cycle control）
            - 并网运行 / 离网孤岛运行电力电子设备
        - label: 一体化装配资产
          modules:
            - 双核心出厂预制机组
            - UL-2200 发电机与 UL-1741-SA 逆变器合规标准
        - label: 云端至现场运营层
          modules:
            - 遥测数据接入
            - 远程监控与调度控制
            - 预测性维护与机队分析
    approximationNotes: null
    claimRefs:
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 梳理主要客群如何从用电痛点出发，走通首台部署并逐步走向跨站点复购扩张。
    data:
      items:
        - label: Kroger / 零售商超
          detail: 面临高电价痛点 -> 采用第三方融资的分布式方案 -> 门店级发电装机交付 -> 复制推广至更多门店
        - label: Lineage / 冷链物流
          detail: 光伏调峰与高供电可靠性诉求 -> 首个站点验证跑通 -> 制定多站点规划 -> 推动全园区规模化扩建
        - label: 公用事业 / 地方电力公司
          detail: 面临供电容量或电价上调压力 -> 评估可调度的本地分布式机组 -> 获批许可并开工建设 -> 用于高峰削峰与本地保供
        - label: 生物天然气 / 污水处理
          detail: 回收甲烷并减少火炬放散 -> 验证多燃料柔性发电能力 -> 分阶段安装交付 -> 拓展更多站点或启动二期建设
        - label: 数据中心 / 关键负荷
          detail: 并网排队延误威胁交付节点 -> 选用脱离大电网的独立电源 -> 交付交钥匙工程 -> 按 25-50 MW 模块化扩容
        - label: 公用事业 / 地方电网进一步扩张
          detail: 地方公用事业机构与公共电力项目推进，表明市场需求已突破企业独立园区范畴。
    approximationNotes: 本客户旅程图根据已公开的具名客户案例提炼共性路径，并非指代某套统一的内部销售规程。
    claimRefs:
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 项目落地与工厂扩产位列残留风险最高项，主要因为公开披露信息依然缺失设备可靠性与客户集中度数据。
    data:
      columns:
        - 发生概率
        - 影响程度
        - 应对成熟度
        - 残留风险敞口
      rows:
        - label: 工厂扩产
          values:
            - 中
            - 高
            - 早期
            - 高
        - label: 现场可靠性与质保
          values:
            - 中
            - 高
            - 早期
            - 高
        - label: 燃料与政策依赖
          values:
            - 中
            - 中
            - 中期
            - 中
        - label: 项目许可与社区审批周期
          values:
            - 中
            - 高
            - 中期
            - 中高
        - label: 法律与诉讼透明度
          values:
            - Unknown
            - 中
            - 早期
            - 中
        - label: 客户集中度
          values:
            - Unknown
            - 高
            - 早期
            - 高
    approximationNotes: 各序数单元格旨在概括基于公开事实评估的风险严峻度，并非经审计的量化概率分布。
    claimRefs:
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: 投资建议逻辑推导
    type: flow
    summary: 商业拓展势头扎实，但收入规模与当前入场估值仍未公开，估值纪律难以落地，推导结论最终落在「继续研究」。
    data:
      nodes:
        - label: 需求信号持续走强
        - label: 制造端扩产提速
        - label: 大型示范项目充实落地论据
        - label: 收入与估值定价仍未公开
        - label: 风险敞口维持高位
        - label: 综合建议 = 继续研究
    approximationNotes: null
    claimRefs:
      - CV010
      - CV011
      - CV012
