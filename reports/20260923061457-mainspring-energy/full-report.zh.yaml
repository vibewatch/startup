      - number: '1.3'
        title: 融资历程、规模信号与里程碑轨迹
        blocks:
          - type: paragraph
            body: >-
              Mainspring 在 2025 年 4 月跻身成长中后期非上市企业之列，当期由 General Catalyst 领投完成 $258M（2.58 亿美元）Series F 轮融资，跟投方包括 Amazon's
              Climate Pledge Fund、DCVC、Temasek、Marunouchi Innovation Partners、M&G、Pictet、Lightrock、LGT Bank、Khosla
              Ventures 与 Gates Frontier。该轮融资同步引入了新董事，并明确提出了制造扩产与销售放量战略。              不过公开信源在累计融资金额口径上存在出入：Mainspring 官方
              Series F 新闻稿称其已获得逾 $800M 融资，而 Tracxn 2026 年 3 月的档案记录为 5 轮累计募资 $739M。很可能的解释是 Mainspring
              官方所谓的「融资」范畴包含了项目融资或非股权性质资金，而 Tracxn 剔除了这部分，但现有信源并未对统计口径差异给出明细说明。


              业务运营层面，即便没有公开营业收入，其实际业务规模信号依然可观。公司官网宣称处于后期开发与实际运行中的装机容量超过 500 MW；2025 年 Series F 新闻稿及 2026
              年客户发布均披露有数百兆瓦设备处于高级开发或现场运行阶段；生态伙伴及客户公开的案例也印证了在冷链、牧场沼气、污水、车队电动化充电以及公用事业场景均有实体项目运转。Mainspring
              的发展轨迹展现出清晰的技术成熟路径：2021 年完成产品正式商用并与 NextEra 达成 $150M 合作；2022 年实现适配氢气与氨气燃料的里程碑；2024 年拓宽渠道与微电网生态；2025
              年注入巨额资本并充实董事会；2026 年则通过 CalBio 及 Chattanooga 项目进一步扩大实证案例。营业收入、估值总额与客户数在现有公开材料中仍无从获取，因此这些封面核心指标必须保持空缺待核状态。
