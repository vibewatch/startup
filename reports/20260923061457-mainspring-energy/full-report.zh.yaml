      - number: '4.4'
        title: 支撑图表与专题分析
        blocks:
          - type: callout
            title: 融资进展与标杆客户落地验证确凿
            body: >-
              当前最强劲的公开财务信号并非营业收入数据，而是 Mainspring 展现出持续同步撬动大额资本与大客户落地的综合能力。高达 $258M 的融资、$87M 制造资助、Lineage
              跨站点的连续复购，以及数据中心场景的持续渗透，共同表明这是一家切实击中市场卡点、能够规模化交付而非仅停留在做概念验证试验的公司。
            calloutType: strength
            claimRefs:
              - CI001
          - type: callout
            title: 仅凭公开数据无法对资金充裕度完成核保
            body: >-
              现有公开资料并未披露营业收入、毛利率、在手现金、烧钱速度（burn）、现金跑道（runway）、客户集中度或单项目边际贡献率。这意味着眼下的尽调风险绝非单纯的需求侧不确定性，而是无法通过数据穿透验证其工厂扩建与垫资部署所创造的长期企业价值，能否跑赢其现金消耗的速度。
            calloutType: risk
            claimRefs:
              - CI001
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、应用场景与业务流适配
        blocks:
          - type: paragraph
            body: >-
              Mainspring
              将线性发电机定义为就地发电设备，而非应急柴油备用机。梳理其产品页以及面向公用事业、数据中心、企业和工业客户的宣传材料，核心诉求始终如一：需要稳定可靠电力的客户如果不希望承担柴油机组的高污染排放或单一燃料依赖，可直接选用出厂预制的
              250 kW
              标准化机组，并随负荷爬坡模块化叠装。在客户侧用电工作流中，该设备物理卡位介于上游气源、客户现场用电负荷与下游可选电网接入点之间。面对受制于电网并网难的数据中心买方，它提供了从土地获电难走向孤岛现场自备电的路径；面对公用事业客户，它充当本地坚强保供与近负荷侧电网调峰的工具；面对工商业企业，它提供了电价可控的主力电源与光伏波动平抑保障；而对于工业甲烷与沼气运营商，它则成了废气发电创收的变现引擎。官网以过硬的技术参数构筑了核心价值锚点——46%
              交流净发电效率、小于 1.5 ppm 的超低 NOx 排放、全程零耗水以及 0-100% 动态调度响应能力；同时 Energy Intelligence 的高管专访与 Latitude Media
              的行业深度报道，进一步将这套应用工作流拓宽至 EdgeConneX 式数据中心、Amazon 物流基地以及军用基地应急韧性用电等核心场景。公开事实充分证明，Mainspring
              的产品市场匹配（PMF）并非飘在空中的概念包装，而是拥有极具操作性的工程颗粒度。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: 硬件架构、部署模式与工程成熟度
        blocks:
          - type: paragraph
            body: >-
              作为一家处于成长后期的硬科技非上市企业，其对外展示的底层工程细节扎实得异乎寻常。官网与加利福尼亚州能源委员会（CEC）的报告均详细阐述了其非燃烧低温反应原理：通过化学反应推动振子在铜线圈内往复直线运动，依靠精确气压控制循环与电力电子器件彻底取代了传统旋转式发电机的曲柄机械传动链。CEC
              的官方实测报告为这一原理解析提供了极具公信力的第三方佐证：报告详细记录了在加州科尔顿（Colton）一家超市现场开展的 230 kW 示范项目，证实截至 2023 年 7 月机组依然平稳在轨运行，且在长达 9
              个月以上的连续监测中，各项输出功率、排放指标、综合能效与运行时长均达标。该报告进一步披露，整机机组通过了 UL-2200 整机安全认证，并搭载了获得 UL-1741-SA
              认证的并网逆变器，将宽泛的「安全可信」宣传落成了白纸黑字的行业硬核认证闭环。研发端的招聘动向同样耐人寻味：现行招聘岗位明确要求搭建贯通云端到机组现场的工业软件技术栈，覆盖遥测数据采集、高安全远程监控、预测性维护、数据中台、控制仿真、嵌入式固件以及基于
              AI 的机队集群智能调度。CoLab 发布的工程案例研究进一步印证了 Mainspring 面对的硬件工程复杂度非同寻常：整机包含超过 3,000 个定制独立零部件，配备约 30
              名专职机械工程师，形成了跨越硬件、固件、电气控制、系统工程与上游供应链的多学科协作流水线。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: 差异化优势、可信控制机制与遗留技术盲区
        blocks:
          - type: paragraph
            body: >-
              Mainspring 最鲜明的技术差异化主张，在于它将媲美燃料电池的高能效与超低排放，与内燃发电机的高动态调度响应及低机械复杂度融为一体。CEC 官方报告、IEEE Spectrum
              深度技术解读、Schneider 合作宣讲材料以及 Xendee
              行业研讨会，共同锚定了同一套底层架构优势：该设备无需机械硬件改装即可实现多组气体燃料的无缝热切换，启停爬坡迅捷，天然契合微电网集成或新能源波动消纳设计。公开商业运行案例同样在不断拓宽：AEP
              的试点项目将该设备列为替代传统调峰电厂与加速充电网点建设的抓手；Schneider 将其打包整合入 EcoStruxure 微电网解决方案；DCVC 则披露了在 Prologis 重卡充电站的项目中，该方案仅耗时
              9 个月即完成现场点亮通电，远快于电网耗时数年的漫长扩容周期。即便如此，公司在质量信任链条上的披露却并不均衡。虽然尾气排放与电气合规认证无可挑剔，但现有资料中未见公开的安全信任中心（trust
              center）、无公开的 SOC 2 或网络安全合规包、未发布全机队在网可用率（fleet availability）实际统计数据集，也没有面向客户的公开 API/SDK
              开发者文档。这些技术盲区虽未否定其硬件核心价值，但随着 Mainspring
              加速挺进数据中心、公用事业电网、污水处理厂以及军方重点设施等苛求持续可用性的关键场景，软件控制面与运维响应响应速度本身已化作产品不可分割的核心组成部分。在实际尽职调查中，这意味着评估范围必须同时覆盖机电系统可靠性与远程服务中枢的运行成熟度。公开资料有力支撑了其底层硬件架构，却目前尚未展现现场告警如何分级流转、远程运维权限如何审批受控、云端固件升级在推送前如何经历严苛仿真验证。若买方依赖该设备保障关键容量而非偶发应急备用，这类缺失绝非无关痛痒的次要瑕疵。
