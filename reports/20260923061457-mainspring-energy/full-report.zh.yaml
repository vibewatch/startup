        - 累计融资 >$800M；2025 年 Series F 轮 $258M；数百 MW 处于现场运行及后期开发阶段
        - 公用事业、大型企业、工业制造、数据中心
        - 多燃料灵活线性发电机；单机 250 kW 模块可堆叠至 100+ MW；主打近零 NOx 排放声称
        - 一级市场私有定价与实际毛利率未公开披露
      - - Bloom Energy
        - 直接竞争 / 高端低排放现场供电
        - 2024 年收入 $1.47B；全年毛利率 27.5%；上市公司
        - 数据中心、工商业、公用事业
        - 大规模 SOFC 部署；拥有 Intel 与 AEP 数据中心成功案例验证
        - 多燃料即时切换能力不及 Mainspring 明确，系统复杂度大概率更高
      - - Capstone Green Energy
        - 直接相邻 / 微型燃气轮机
        - 上市微型燃气轮机供应商；2023 年 12 月走出破产保护（Chapter 11）
        - 微电网、热电联产（CHP）、关键电力、数据中心
        - 65 kW 至数兆瓦级微型燃气轮机；拥有成熟的服务收入底盘与广泛的分销网络
        - 财务结构脆弱且在手订单偏弱，压低了战略信心
      - - Cummins
        - 传统巨头 / 发动机与备用电源
        - 2024 年收入 $34.1B；毛利率 24.7%
        - 数据中心、分布式发电、工业备用电源
        - 庞大的服务网点、成熟天然气发动机产品线、关键业务领域的深厚信誉
        - 传统发动机产品线缺乏 Mainspring 核心的燃料灵活性与低排放叙事
      - - Schneider + Mainspring
        - 相邻渠道 / 微电网系统集成商
        - 定位为企业微电网落地渠道，而非发电机整机制造规模
        - 商业、工业、物流仓储、数据中心
        - 降低客户在大型微电网项目中采购 Mainspring 的实施门槛
        - 渠道合作本身无法证明长期的产品锁定壁垒
      - - Hyliion / Flexnode
        - 潜在入局者 / 新兴替代方案
        - 行业媒体报道已有早期商业化进展
        - 大型数据园区与关键业务站点
        - 采用相似的线性发电机技术路线，主打多燃料适应能力
        - 相较传统巨头与 Bloom Energy，公开部署规模仍较为有限
    notes: 本表合并对比直接对手、行业巨头与渠道替代方案，因为买方可以通过不同采购路径解决同一个现场供电需求。
