      - number: '6.3'
        title: 客户复购扩容逻辑清晰可见，但集中度、留存率与合同结构仍是公开证据的核心盲区
        blocks:
          - type: paragraph
            body: >-
              最具说服力的客群扩容信号，在于首期场站跑通后客户表现出的持续复购行为。Kroger 明确表示已启动在其他连锁门店的设备引入；Lineage 从早期的单点冷库试运行一路升级至全网战略集采框架，随后更是在得州 5
              处仓储中心一举追加 33 台机组；CalBio 在此前汉福德（Hanford）、巴顿威洛（Buttonwillow）和默塞德（Merced）场站的基础上，又为另外两处集约化牧场增购了 8 台发电机；MBEC
              的一期 6 台机组规划明确衔接了待二期园区电网升级完毕后的后续 6
              台机组扩建。这一系列复购动作极具含金量，表明客户绝非浅尝辄止地做一次性技术尝鲜，而是开始将模块化就地发电深度嵌入其全网级能源架构战略之中。生态伙伴提供的项目融资支持与分销渠道协同进一步强化了这一扩张飞轮：Trellis
              与 Canary 均报道了 NextEra 牵头提供的资产融资架构，消除了前期大额资本沉没门槛；而 Mainspring 正式推出分销商招募计划，更暗示着其正在摆脱单纯依赖直销铁军的单打独斗模式。


              然而，在审视客户生命周期韧性与集中度这一经典维度时，公开记录却显得异常贫乏。现有资料未披露过客户数、净留存率（NRR）、总留存率（GRR）、客户流失率（churn）、合同平均期限、到期续约率以及前几大客户在总营收中的占比。目前所有可见的标杆案例高度收敛于少数几家知名企业，这固然保障了示范样板的成色，却恶化了客户集中度的透明度：投资人固然看到了耀眼的品牌光环，却无从得知整体收入究竟有多大比例仰仗极少数超大型基建客户或单一融资伙伴的承销。客户满意度维度的实证同样存在偏颇：签约通稿与客户高管引语固然赞誉有加，但这与覆盖全量客群的大规模量化回访、独立第三方评价或基于时间序列的留存曲线存在质的差距。因此，在客户维度给出的尽调结论兼具建设性与局限性：Mainspring
              展现出了啃下硬核能源骨头并在标杆跑通后就地扩容的卓越开拓力，但仅凭公开证据，依然无法对整个客户基本盘的长期抗风险韧性与集中度暴雷隐患进行独立闭环交叉验证。
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
