      - number: '6.4'
        title: 支撑图表与专题分析
        blocks:
          - type: callout
            title: 标杆验证覆盖多个高门槛严苛用电行业
            body: >-
              Mainspring
              具名客户画像横跨大型商超、冷链仓储、公用事业、农田灌溉、生物质沼气、市政污水、数据中心、物流车队充电以及国防军工。如此宽广的客群跨度至关重要，它证明该产品绝未被锁死在单一细分门类或偶发性的单点试点叙事之中。
            calloutType: strength
            claimRefs:
              - CU001
          - type: callout
            title: 客户采购的核心切入口往往是并网排期阻力叠加场址专属用电痛点
            body: >-
              最具穿透力的落地案例绝非泛泛的环保品牌光环，而是 Mainspring
              实打实帮客户压缩了并网通电周期、规避了电网排期延误、变现了原本无处消纳的废弃甲烷，或通过融资结构将沉重的前期资本支出转为轻量化运营支出——这也合理解释了为何 NextEra 支持的 PPA
              购电协议与交钥匙部署字眼在公开材料中屡屡被置于核心位置。
            calloutType: insight
            claimRefs:
              - CU001
          - type: callout
            title: 关于客户长期韧性与集中度的公开证据依然单薄
            body: >-
              跨场站复购扩建信号固然令人振奋，但现有公开信源依然对活跃客户数、净留存率（NRR）、总留存率（GRR）、客户流失率、合同期限以及前几大客户集中度避而不谈。公开证据有力证实了客户层面的初步采纳，却尚未完成对整体资产组合长期稳固性的有效验证。
            calloutType: risk
            claimRefs:
              - CU001
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险全景
        blocks:
          - type: paragraph
            body: >-
              从公开记录审视，Mainspring 呈现出偏高但尚属可控的风险特征。公司商业势头确凿无疑：对外宣称处于后期开发及运行阶段的容量逾 500 MW，2025 年宣布斩获 $258M（2.58 亿美元）Series
              F 轮融资，拿下美国能源部（DOE）牵头的 $87M 制造扩产资助，并在 2026
              年接连公布公用事业、市政及国防等重点落地项目。然而，这些明朗利好未能从根本上消除投资核保的核心阻碍。在当前阶段本可大幅压降风险感知的大多数核心运营指标——包括全机队可靠性、历史质保赔付记录、积压订单交付转化率、大客户集中度以及真实的单机经济模型——悉数未予公开。这导致该标的虽已得到下游需求与宏观产业政策的双重验证，外界却依然难以对其遗留的落地执行风险做出精确量化。公开事实亦提醒尽调团队：在轻信当前宏大叙事能无缝转化为持久造血现金流之前，必须将对外宣称的规划装机与补贴额度，与现场真实的并网投运节奏、长周期维保承载力以及客户集中度做审慎的交叉比对。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR002
              - CR003
      - number: '7.2'
        title: 生产运营、对外依赖与制造扩产风险
        blocks:
          - type: paragraph
            body: >-
              运营风险主要集中在将一套初出茅庐的硬科技制造体系，推向体量更大、工期要求更为苛刻的复杂工程之中。公开宣传虽大篇幅标榜快速进场、模块化交付、多燃料兼容与超低排放，但各项商业动向同样表明其正在切入体量更重、容错率更低的大型项目中——诸如
              48 MW 市政公共电力项目、查塔努加市政污水重点工程以及国防试验基地。宾夕法尼亚新厂在战略布局上举足轻重，旨在将年产能拉升至 1,000 台并创造 600
              余个实体就业岗位，但这同步带来了显而易见的产能爬坡风险：产业工人招募培训、上游零部件供货品控、工程安装规范以及从纸面合同到实体并网的转化效率，必须环环相扣协同跃升。多燃料适应性固然抹平了对单一气源的依赖，却丝毫无法消除工厂制造、现场组装施工与长线售后运维的固有风险。投资人理应将每一个新落地的重磅标杆视作双刃剑——它既是技术实力的自证，更是对企业整体抗压能力的极限压力测试，只因更大体量的工程现场将成倍放大工程施工、连续运行、供应商保供以及运维统筹上的潜在摩擦。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: 监管合规、法律披露与透明度盲区
        blocks:
          - type: paragraph
            body: >-
              在监管与行业政策合规上总体态势向好，但风险尚未完全出清。Mainspring 在 2024
              年提交给加州能源委员会（CEC）的文件中主张：该机型在天然气与可再生天然气（RNG）/生物沼气场景下已实现全面商业化，完成了纯氢环境逾 1,000
              小时的连续运行验证，核心燃气应用已完全走出早期试点阶段。这为现阶段规模化商用就绪度提供了有力背书，但氢气的大规模商业化落地目前仍主要依靠单点里程碑牵引，尚未在公开营收数据或规模化商运台账中得到全面印证。在法律合规维度的公开披露同样偏少。官网披露了
              2025 年版隐私政策、2025
              年版服务条款及供应商治理准则，展现出基础的法务规范。然而，现有公开资料中未见有关未决诉讼、网络安全事件、客户集中度或机组长期可靠性指标的详尽披露。这些信息盲区迫使尽职调查必须紧盯下行情景，绝不能因为公关材料中未见事故迹象就盲目推定实际风险偏低。营销宣传渠道中缺乏反向证据，本质上属于信息不对称造成的情报断层，绝非潜在风险可控的充要凭据。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
