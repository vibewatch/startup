      - number: '7.4'
        title: 支撑图表与专题分析
        blocks:
          - type: callout
            title: 最大的遗留风险在于制造交付落地，而非下游市场需求
            body: 下游需求维度的公开信号向好，但最大的未知数依然在于：新厂产能爬坡、现场设备可靠性以及纸面订单交付兑现能力，能否跟上近期宏大业务宣示所蕴含的庞大体量。
            calloutType: risk
            claimRefs:
              - CR001
          - type: callout
            title: 多燃料兼容特性构成了坚实的风险缓冲
            body: Mainspring 的多燃料平滑切换设计大幅降低了对单一气源的依赖，增强了系统供电韧性；但在整体项目交付风险框架内，它充其量是一项有效的风险缓冲对冲手段，远未达到能够彻底消除综合落地风险的地步。
            calloutType: strength
            claimRefs:
              - CR001
          - type: callout
            title: 后续尽职调查应聚焦于未公开的底层运行数据
            body: 在现阶段，最具含金量的尽调切入点在于索取机队可靠性、质保赔付、客户集中度以及工厂扩产爬坡的核心量化指标。相比于在宏观市场规模测算上继续耗费精力，这些内部指标对投资决策具备更高的定夺权重。
            calloutType: recommendation
            claimRefs:
              - CR001
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前入场估值背景
        blocks:
          - type: paragraph
            body: >-
              Mainspring 的公开叙事充分证明了其业务的商业价值，却无法给出精确的估值定价支撑。公司近期完成了 $258M（2.58 亿美元）的 Series F 轮融资，宣称累计融资额突破
              $800M，并持续斩获大型标杆部署与扩充制造产能。这足以得出定性结论：其业务发展既非停滞不前，也绝非空中楼阁。然而，这依然不足以判断其当前一级市场的估值究竟是具备吸引力、处于合理区间还是已然透支偏高，因为公司从未对外披露真实的营业收入、毛利率、订单积压规模、当期投后估值或股权架构优先清偿条款。在实操层面，投资人能够对其战略势能与交付风险进行定性核保，却无法对入场价格展开定量校准。这使得估值分析只能退而求其次，落脚于对标区间匡算与尽调优先序梳理，而非给出确凿公允价值测算。这一局限性至关重要——对未上市企业的估值投资纪律，核心在于把控入场价格与下行清算保护结构，绝非在真空里空泛赞赏其战略卡位的高妙。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.2'
        title: 可比公司锚定与情景推演框架
        blocks:
          - type: paragraph
            body: >-
              最管用的公开锚点是工业和发电设备同业，而非软件公司。Generac、Cummins 与 Caterpillar
              均提供可交易的市值与收入参考，其披露风险也切中重制造发电设备平台。若以市值/收入倍数作为简明公开锚点，样本区间在 Cummins 的约 2.7x 到 Caterpillar 的 6.0x 之间，Generac
              约为 3.6x。这一区间能提供参考，但并不完美：Caterpillar 包含更大、更多元的工业业务底座，Generac 和 Cummins 在发电设备执行风险上可比性更强。清洁能源同业 Bloom Energy
              则提供另一重借鉴：高增长完全可能与质保拨备、负债及商业化杂音并存。合理的理解是：Mainspring
              只有证明自身的制造规模与运维耐用度，才能获得估值溢价，单靠电力需求火热远远不够。换句话说，可比公司能框定估值纪律与情景假设，但替代不了公司自身的财务披露。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: 建议与尽调关口
        blocks:
          - type: paragraph
            body: >-
              基于 2026-05-05 的公开证据，最站得住脚的结论是“继续研究”，置信度中等、高风险评级、估值立场未知。账面利好相当可观：后期开发与运行中项目逾 500
              MW、大额建厂补贴、公用事业与市政项目落地、国防试点，以及引入资深工业运营者的董事会。但从当下的入场纪律来看，反向约束更为关键：无公开收入与毛利率披露、未公开当前价格、无公开股权结构表条款、可靠性可见度有限且集中度不明。因此，投资人切勿将公司质地与可投资的价格支撑混为一谈。价格敏感度、稀释风险与退出时机均过于模糊，目前无法支撑“买入”建议。只有当最终一级市场价格相对上述不确定性给出实质折价，投资赔率才真正成立。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 图表附录
        blocks:
          - type: callout
            title: 公开证据支持跟进，不足以支撑买入建议
            body: Mainspring 展现出战略重要性与商业落地价值，但现有公开记录对价格及商业模型披露不足，尚无法支撑买入建议。
            calloutType: recommendation
            claimRefs:
              - CV001
          - type: callout
            title: 最大下行风险：信息披露改善前触发新一轮融资
            body: 若 Mainspring 在披露收入、可靠性或集中度数据前开启新一轮融资，股权稀释与优先股堆叠风险将压过原本正向的需求信号。
            calloutType: risk
            claimRefs:
              - CV001
          - type: callout
            title: 将可比上市公司作为估值上限与核验关口
            body: 可比上市公司的估值区间有助于树立估值纪律，但在 Mainspring 披露直接估值所需的财务数据之前，应将其视为估值上限与尽调核验清单。
            calloutType: assumption
            claimRefs:
              - CV001
