  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、统计支出范畴与对标标的界定
        blocks:
          - type: paragraph
            body: >-
              Mainspring 切入的目标市场窄于「全部分布式能源」，但宽于「备用发电机」。美国能源信息署（EIA）2024 年分布式发电报告将工商业分布式能源定义为表后就地发电，而 Mainspring
              官方资料将产品定位为覆盖工商业楼宇、公用事业、微电网、数据中心、充电设施、污水沼气等场景。因此，纳入测算的支出范畴涵盖就地发电设备、多燃料发电机组、微电网工程总包集成、现场发电配套的项目融资及部署服务，以及确保系统投运所需的站址辅助设施（balance-of-plant）工程。剔除的支出则包括无法解决用户侧供电韧性或并网等待周期的集中式公用事业级电网资产，以及未与可调度就地发电设备联动的屋顶光伏、纯电池储能等泛分布式品类。


              明确这一市场边界极为关键：Mainspring
              赢单的前提是客户痛点在于「快速获得现场可靠供电并保留未来燃料灵活性」，而非单纯追求每兆瓦时最便宜的电价。这一差异将真正的对标竞品拉向柴油备用机组、燃气发电机组、燃料电池、热电联产（CHP）和微电网系统包，而非纯新能源发电或纯软件方案。这也意味着，数据中心负荷、车队电动化、污水处理以及地方公共电力等细分需求指标，远比泛泛的全球分布式能源总产值预测更有指导意义。买方核心关切是电网排队延迟、可用率指标、环评合规难度与脱碳要求；客户采购
              Mainspring，绝非为了在电价波谷间做纯电能套利。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
