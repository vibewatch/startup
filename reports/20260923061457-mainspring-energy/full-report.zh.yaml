      - number: '3.2'
        title: 核心对标与相邻竞品画像
        blocks:
          - type: paragraph
            body: >-
              Bloom Energy 与 Capstone 构成有力对照，是因为两家都能在避开电网漫长排期的情况下为客户提供可信的现场供电路径。Bloom 的体量显著高于 Mainspring，其 2024 年实现营收
              $1.47B（14.7 亿美元），年度毛利率达到 27.5%，并在 2024 年 11 月与 AEP 锁定高达 1 GW 的燃料电池供应协议，2024 年 5 月还完成了对 Intel
              圣克拉拉高性能计算数据中心的现场扩容。Capstone 虽然技术溢价较低，但在表后及微电网集采中仍占据一席之地，其微型燃气轮机覆盖 65 kW
              至多兆瓦级别，在数据中心拥有标杆案例，且历史上相当一部分收入来自后期运维服务。Mainspring 当前商业化体量虽然偏小，但官方及第三方信源均证实其自 2020
              年起实现商业化发货，目前在现场运行及后期开发阶段储备了数百兆瓦容量，并斩获了 Lineage 等标志性客户及 Schneider Electric 的渠道分销合作。此外，Hyliion
              也极可能是一个可信的入局者，据 Energy Intelligence 报道，该公司正携手 Flexnode 在综合算力机房部署类似的线性发电机概念。
            claimRefs:
