      - number: '2.3'
        title: 买方群体、实际使用者、付费主体与采纳路径
        blocks:
          - type: paragraph
            body: >-
              买方画像横跨多个垂直领域，但决策诉求高度一致。在公用事业与公共电力场景，核心经济决策人是公用事业总经理、发电副总裁或地方电力董事会，他们急需能绕过变电站及输电网冗长改造周期的就地发电设备以缓解负荷压力。在数据中心领域，买方通常是底层基础设施或电力架构团队，将获电周期与供电连续性视为新机房能否如期点亮的核心掣肘。在车队电动化充电场景，买单方通常来自运营、后勤或电动化转型预算，关注核心同样在于供电到位速度，而非批发市场电能套利。而在污水及沼气场景中，买方多为基建运营商或新能源项目开发商，意在变现废弃甲烷资源并冲抵用电账单或达成减排要求。


              各领域的采纳路径同样遵循标准范式。公开资料反复表明客户往往由特定触发事件驱动：电网容量堵塞、并网申请排期过长、用电负荷急剧攀升、供电韧性告急或政策脱碳硬约束。此时买方开始评估就地发电或微电网方案，通常通过
              Schneider、ABM 或 NextEra 等渠道集成商介入，由其承揽融资结构设计、EPC
              工程总包与电网对接等复杂环节。一旦首期示范项目跑通，客户便迅速将方案复制推广至更多场址或加大单体装机规模，CalBio 的多牧场连续复制以及 Mainspring 披露的商超和市政电力项目扩建均体现了这一路径。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
