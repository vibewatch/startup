      - number: '2.2'
        title: 测算视角：需求盘子巨大，但缺乏针对 Mainspring 的独立公开 TAM
        blocks:
          - type: paragraph
            body: >-
              现有公开信源中并无针对 Mainspring 专属细分市场的精确 TAM 测算，必须借助相邻行业的公开数据进行交叉锚定。最强有力的观测视角是美国数据中心的电力缺口，直接折射出 Mainspring
              锚定的「即刻要电」困境。McKinsey 测算，美国数据中心电力需求将从 2024 年的 25 GW 飙升至 2030 年的 80 GW 以上，占全美总电力需求比例从当前的 3-4% 攀升至
              11-12%，带来超过 50 GW 的新增电力缺口。Bloom Energy 在 2025 年报告中给出类似研判，预计未来 5 年内公布的数据中心容量达 35 GW，且到 2030 年约 30%
              的场址将以现场自备电源作为主供电源。Wood Mackenzie 的统计口径更为激进，追踪到全美拟建数据中心规模达 134 GW，而电网公用事业已承诺接入容量仅 64 GW，另有 132 GW
              的重负荷项目积压在申请队列中。


              这些庞大数字并不等同于 Mainspring 的 TAM 直接就是「80 GW」或「134 GW」。它们作为相邻市场的宏观需求风向标，揭示了就地供电方案赖以生存的电力紧缺烈度。Mainspring
              近期可触达的实际 SAM，更可能属于其中重度依赖表后部署、易过环评审批以及多燃料弹性的细分子集：例如 UMPA
              等公共电力实体、关键工商业厂区、车队电动化基础设施、冷链冷库、污水沼气设施以及特定敏捷部署数据中心。由于公开资料未单独披露这一细分领域的审计级支出或装机容量总和，任何 TAM/SAM/SOM
              分层测算均应视为估算区间，而非确定性的硬性市场数据。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
