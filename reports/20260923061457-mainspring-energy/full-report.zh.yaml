      - number: '4.3'
        title: 成本结构与毛利演进路径
        blocks:
          - type: paragraph
            body: >-
              从商业本质看，Mainspring
              较纯软件业务具有更为沉重的重资产与资本密集属性。官网主打相较竞品具备更低资本支出、更少运维频次与更高发电效率，但这属于面向买方的价值主张而非真实的财务利润率。美国能源部（DOE）的扩产资助与宾夕法尼亚州新工厂的筹建规划，预示着巨大的工厂设备摊销、模具投入与产业工人队伍扩张；加州能源委员会（CEC）报告同样将该产品视作一套依靠高效率、低排放、燃料灵活性和低成本确立价值的硬科技硬件。由此推断，其综合成本结构涵盖了发电机整机制造、现场安装部署、长周期售后运维以及渠道伙伴支持等多重环节。公开上市公司对标勾勒出了合理的毛利率坐标区间：Bloom
              印证了低排放就地发电企业在形成规模效应后毛利率可达 27.5%，Cummins 则代表着成熟的超大型传统工业发电设备业务毛利率在 24.7% 左右；而 Capstone
              则是令人警醒的反面教材——即使具备高毛利的后期服务，分布式能源厂商依然可能面临订单积压萎缩、债务重组乃至现金流枯竭。眼下的核心盲区在于：Mainspring
              从未公布过自身毛利率、单场站部署的边际贡献率或软硬件收入拆分比例，投资人尚无法在上述区间内准确定位其真实的盈利水位。
