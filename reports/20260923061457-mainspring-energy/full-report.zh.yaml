      - number: '4.2'
        title: GTM 拓展模式与销售效率代用指标
        blocks:
          - type: paragraph
            body: >-
              Mainspring 的市场拓展（GTM）模式呈现出明显的顾问式咨询与重基建驱动特征，与轻量化标准化交易相去甚远。最具说服力的支撑源于其对外展示的标杆案例与伙伴关系：Schneider
              主导的微电网集成、Lineage
              跨场站铺装、公用事业并网工程、数据中心定制宣传以及为应对急迫供电需求配套的产能扩张规划。这些绝非开箱即用的轻型销售流程，背后牵涉漫长的销售谈判周期、复杂的现场工程设计、环保审批、工程安装施工与项目融资统筹。PG&E
              在 2025 年 2 月发布的数据中心并网通报尤其关键，它揭示了利好 Mainspring 的宏观市场大环境：用电大户亟需以快于电网规划落地的节奏点亮项目，部分客户甚至愿意在新电价机制下自掏腰包垫付基建款项。这让
              Mainspring 打出的「极速点亮」卖点具备了经济学上的可信度，即便缺乏公开的 CAC
              或回本周期指标亦能成立。真正的短板在于缺乏销售效率的量化衡量：没有公开信源披露过销售周期时长、商机转化率、客户获客成本（CAC）、销售人员规模或回本周期（payback），本报告只能推断其属于典型的高介入度、高客单价但同时伴随沉重获客与现场交付阻力的拓展模式。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
