      - number: '5.4'
        title: 支撑图表与专题分析
        blocks:
          - type: callout
            title: 公开技术证据远比一般气候科技初创的公关宣传更扎实
            body: 加州能源委员会（CEC）的官方报告为这家硬科技非上市企业提供了极为罕见的扎实技术背书：详尽剖析了底层物理机制，完整记录了真实场站的示范项目，并公开了电气并网认证历程以及实测的尾气排放与综合发电能效。
            calloutType: strength
            claimRefs:
              - CE001
          - type: callout
            title: 产品内涵加速延伸至软件控制层面，不再局限于纯硬件
            body: >-
              现行招聘岗位表明，Mainspring 正在全力打造连通云端到现场的软件全栈体系，涵盖遥测感知、远程操控、预测性维护、数据平台与 DevSecOps
              安全体系。这意味着尽职调查应将软件运行可靠性与系统安全置于核心投资逻辑中，而非将其视作交付后的边角料。
            calloutType: insight
            claimRefs:
              - CE001
          - type: callout
            title: 安全透明度、开放 API 与机队可用率指标依然缺乏公开披露
            body: >-
              尽管在环保排放与硬件合规上公开证据过硬，但现有信源中仍未见公开的安全信任中心、SOC 审计材料、对外 API
              文档或全机队整体运行可用率统计。考虑到公司眼下全力攻坚公用事业、市政污水、数据中心和国防军工等对停电零容忍的高敏感领域，这些数据缺口显得尤为关键。
            calloutType: risk
            claimRefs:
              - CE001
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群虽横跨诸多重资产行业，但最清晰的交集始终是受困于电力瓶颈的关键负荷
        blocks:
          - type: paragraph
            body: >-
              Mainspring
              的公开客户名单并非杂乱拼凑。纵览其解决方案宣传页与官方项目通报，客户画像清晰聚焦于两类主体：要么用电构成其核心生产经营成本，要么电力短缺成了制约其业务扩张的瓶颈。这包括寻求电价可控性的商超连锁与冷链仓储巨头、急需本地调节容量的公共电力与灌区实体、意图变现废弃甲烷的牧场与市政污水厂、苦于变电站漫长排期的数据中心开发商，以及对用电韧性有极高要求的空军等公共部门。这一鲜明的行业聚集规律至关重要，它证明
              Mainspring 面对的真正买单方绝非采购备用电机的普通物业后勤负责人，而是正遭遇实质性电力紧缺、环评红线或政策脱碳硬指标约束的核心决策层。Schneider
              的合作通告、公用事业客户标杆宣传，以及物流仓储与算力中心的落地案例均指向同一结论：在快速通电并网、模块化即插即用、多燃料兼容切换以及超低 NOx 环保合规能够带来显著财务价值的场景中，Mainspring
              才能真正发挥出胜势，而非充当锦上添花的可选品。


              因此，其目标客群在行业分类上虽显宽泛，在用电特征上却高度收敛。Kroger 与 Lineage 分属迥异的终端赛道，却同样选用 Mainspring 来锁死现场用电成本并筑牢供电韧性；UMPA 与 Lathrop
              灌区（Lathrop Irrigation District）代表了公用事业与地方公共电力端，双方均借助就地可调度发电机组化解了扩容受限与电价上涨的双重压力；CalBio 与查塔努加
              MBEC（Chattanooga MBEC）利用该系统将废弃沼气转化为清洁绿电，虽与零售流通或机房算力的商业变现逻辑大相径庭，却同样高度契合该设备模块化集成、极易通过就地环评审批的特性；而
              EdgeConneX、Prologis 与 Amazon
              则勾勒出另一个鲜明的客群拼图——电网接入延迟本身构成了核心痛点。所有公开证据均强力支撑其客户画像的核心立论：直击那些高能耗、对停电高敏感且面临严峻场址用电瓶颈的重资产运营方，而非大众化的备用应急电源采购客群。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: 具名客户标杆落地扎实且加速步入生产级商用，在节降成本、保供韧性与跨场站复购上证据最为过硬
        blocks:
          - type: paragraph
            body: >-
              Mainspring 在具名客户验证上交出了令人信服的答卷，其公开证据绝非贴牌商标或空洞的公关致谢所能比拟。Kroger 官方客户案例证实该系统锁定了更低且可预测的用能成本，Trellis
              进一步补充了具体的融资模式细节，并援引一线负责人的直接表述，阐释了商超为何青睐这种免前期资本开支、免日常运维负担的合作框架。Lineage 则展现出多层梯次推进的落地成效：除官方企业级联合发声外，双方早在
              2022 年即签署了多达 150 台机组的战略供货协议，并在 2024 年于得克萨斯州 5 处大型仓储网点落子 33 台机组。UMPA 位于犹他州中部的 48 MW 项目在体量上已具备公用事业级的战略意义；而
              Lathrop 灌区项目则是全样本中量化指标最突出的成效标杆，Mainspring 官方称其帮助客户降低了 40% 的度电支出、实现了 95% 峰值负荷自给、环评审批耗时仅 3 个月且全系统交付仅用时 7
              个月。CalBio 与 MBEC 则证明该技术绝非局限于企业标准园区：二者均利用就地生物质沼气或废弃甲烷发电，其中 CalBio 跨 5 处牧场扩建至 5.3 MW 装机，查塔努加项目则分两期规划 3 MW
              容量，旨在冲抵当地污水处理厂三分之一的电力账单。


              各领域沉淀出的核心成效并非软件式的虚拟人效指标，而是真金白银的物理工程交付与能源账本数字。公开资料屡屡提及的成效点包括：用能成本显著节降或锁定长期可预测性、并网速度大幅跑赢传统电网排期、在区域电网崩溃时确保核心负荷不掉线、将废弃沼气转为现金流资产，以及极易通过严苛的环评审批。EdgeConneX
              的项目亮点在于抢夺工期窗口与实时追踪用电负荷的快速调度；Prologis 的突破在于将原本耗时长达 3 年的重卡充电配电工程压缩至 9
              个月内投运；美国空军试点则围绕应急保供与多燃料快速热切换展开严苛压力测试。综合来看，结论客观平衡：Mainspring 在多个技术门槛极高的客户领域积累了扎实的生产级落地案例，且随着 2025 至 2026
              年更大体量项目与跨区域网络化复购浮出水面，标杆时效性仍在持续加强。唯独公开资料中依然缺失更长维度的同客群生命周期表现——现场部署实证固然充沛，但在长期合同续约率、标准化可用率指标以及细分客群的长期留存质量上依旧缺乏透明披露。
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
