chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >-
              Mainspring Energy positions itself as a provider of local, fuel-flexible, low-emissions power generation
              rather than a generic generator vendor. Official materials describe the company’s core product as the
              Mainspring Linear Generator, a dispatchable onsite-power system that scales from a single 250 kW unit to
              arrays above 100 MW. The product runs on multiple gaseous fuels including natural gas, propane, biogas,
              hydrogen, and ammonia, which is central to the company’s pitch that customers can add capacity immediately
              on conventional fuels and later transition toward lower-carbon fuels without replacing the installed
              asset. TechCrunch’s 2021 launch coverage and Mainspring’s own launch release both tie the product’s origin
              to Stanford thermodynamics-lab work by the three founders, giving the company a credible
              founder-market-fit story rooted in deep technical R&D.


              Mainspring’s business model is deployment-led. The company does not present itself as a commodity
              equipment maker selling into a distributor channel alone; instead, official and partner materials
              repeatedly emphasize turnkey or partner-assisted deployments, financing relationships, and
              project-specific resiliency outcomes. Public references show the company selling into utilities,
              commercial and industrial sites, cold storage, wastewater methane, dairy biogas, EV charging, and
              microgrid applications. That mix suggests Mainspring competes in a capital-intensive power-infrastructure
              market where customer adoption depends on project development, permitting, and financing support as much
              as on hardware performance. The product’s repeated positioning around “speed-to-power,” low NOx emissions,
              and fuel optionality indicates that Mainspring is monetizing a reliability and deployment-timing problem
              more than a pure efficiency premium.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The public founder set is consistent across retained sources: Shannon Miller, Adam Simpson, and Matt
              Svrcek. Shannon Miller remains the clearest key person. He appears as founder and CEO in company releases,
              partner announcements, investor commentary, and industry articles, and he is the primary quoted
              spokesperson on financing, product, and market adoption. That concentration creates real key-person
              dependence because investor, partner, and media narratives all anchor on Miller’s judgment and
              technical-commercial framing.


              Leadership breadth is improving but still looks founder-centric. Adam Simpson is consistently identified
              as a co-founder, but his externally visible title has changed over time: a July 2024 reseller announcement
              named him Chief Product Officer, while February and March 2026 customer announcements identified him as
              Chief Commercial Officer. That shift implies an internal leadership evolution toward commercialization as
              deployment scale increases. Public governance was also strengthened in April 2025, when Tom Linebarger and
              Bethany Mayer joined the board as part of the Series F announcement. Linebarger adds deep power-generation
              operating credibility from Cummins, while Mayer adds hardware and public-company operating experience.
              Even with those additions, however, the publicly visible bench remains thinner than the capital raised
              would imply, because reviewed sources do not disclose a full current executive roster, committee
              structure, or detailed control rights.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: Funding history, scale signals, and milestone trajectory
        blocks:
          - type: paragraph
            body: >-
              Mainspring reached late-stage private-company status by April 2025 with a $258 million Series F led by
              General Catalyst and participation from Amazon’s Climate Pledge Fund, DCVC, Temasek, Marunouchi Innovation
              Partners, M&G, Pictet, Lightrock, LGT Bank, Khosla Ventures, and Gates Frontier. That round also coincided
              with new board appointments and an explicit manufacturing-and-sales scaling narrative. Public
              total-funding numbers are not fully aligned, however. Mainspring’s own Series F release says the company
              has secured more than $800 million in financing, while Tracxn’s March 2026 profile lists $739 million
              raised in five rounds. The likely explanation is that Mainspring’s broader “financing” language includes
              project finance or non-round capital that Tracxn excludes, but that is not made explicit in reviewed
              sources.


              Operationally, public scale signals are material even without disclosed revenue. The homepage advertises
              more than 500 MW in late-stage development and operation; the 2025 Series F release and 2026 customer
              announcements describe hundreds of megawatts in advanced development and field operations; and
              partner/customer evidence points to real projects across cold storage, dairy biogas, wastewater, fleet EV
              charging, and utility/public-power use cases. Mainspring’s chronology also shows technical maturation:
              2021 marked product launch and a $150 million NextEra relationship, 2022 brought a hydrogen-and-ammonia
              fuel-flexibility milestone, 2024 expanded channel and microgrid partnerships, 2025 added large-scale
              financing and board depth, and 2026 broadened proof points through CalBio and Chattanooga. Revenue,
              valuation amount, and total customer count remain unavailable in reviewed public materials, so those cover
              metrics must stay explicitly open.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
