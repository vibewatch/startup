  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and the right comparison set
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Mainspring is narrower than “all distributed energy” and broader than “backup
              generators.” EIA’s 2024 distributed-generation report defines DG in commercial and industrial settings as
              onsite, behind-the-meter generation, while Mainspring’s own materials position the product across
              commercial and industrial buildings, utilities, microgrids, data centers, EV charging, wastewater methane,
              and biogas applications. The included spend therefore spans local generation assets, fuel-flexible
              generator packages, microgrid design/build integration, project finance or deployment services tied to
              onsite generation, and the balance-of-plant work required to make these installations usable. The excluded
              spend is bulk utility-scale generation that does not solve customer-sited reliability or interconnection
              timing problems, as well as adjacent DER categories such as rooftop solar or batteries when they are not
              paired with dispatchable local generation.


              This boundary matters because Mainspring wins when the buyer’s job is “get dependable power onsite quickly
              with future fuel optionality,” not when the buyer is simply procuring cheapest megawatt-hours. That pushes
              the comparison set toward diesel backup, gas gensets, fuel cells, CHP, and microgrid packages rather than
              pure renewables or pure software. It also means public data center, fleet EV, wastewater, and public-power
              demand indicators are more decision-useful than generic global DER revenue estimates. Buyers care about
              interconnection delays, uptime, permitting, and decarbonization tradeoffs; they do not buy Mainspring to
              maximize energy-only arbitrage.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 'Sizing lenses: large demand pools, but no clean public Mainspring-specific TAM'
        blocks:
          - type: paragraph
            body: >-
              No single retained source cleanly sizes a Mainspring-specific TAM, so the market must be triangulated
              through adjacent public lenses. The strongest lens is U.S. data-center power demand because it directly
              reflects the “power now” problem Mainspring markets into. McKinsey estimates U.S. data-center demand
              rising from 25 GW in 2024 to more than 80 GW in 2030, with power needs moving from 3-4% of total U.S.
              demand today to 11-12% by 2030 and requiring more than 50 GW of additional capacity. Bloom Energy’s 2025
              report points in the same direction, predicting 35 GW of announced data-center capacity over five years
              and saying about 30% of sites are expected to use onsite power as a primary source by 2030. Wood
              Mackenzie’s even more expansionary lens tracks 134 GW of proposed U.S. data centers, alongside 64 GW of
              committed utility service and another 132 GW in large-load queues.


              Those figures do not mean Mainspring’s TAM is simply “80 GW” or “134 GW.” They are adjacent demand
              indicators showing the scale of power scarcity that creates room for onsite solutions. Mainspring’s
              nearer-term SAM is more likely the subset of those markets where behind-the-meter deployment,
              low-emissions permitting, and multi-fuel flexibility are decisive: public power projects like UMPA,
              critical C&I sites, fleet electrification, cold storage, wastewater methane, and selected data centers.
              Because public sources do not isolate that subset with audited spend or installed-capacity totals, any
              TAM/SAM/SOM stack must be presented as an approximation rather than a hard market fact.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-segment but coherent. In public power and utility contexts, the economic buyer is a
              utility GM, generation VP, or public-power board seeking local capacity that can be permitted and deployed
              faster than substation or transmission upgrades. In data centers, the buyer is typically an infrastructure
              or power-architecture team that treats electricity access and uptime as gating constraints on new site
              launches. In fleet EV charging, the payer can sit with an operations, facilities, or electrification
              program budget that cares about speed-to-power more than wholesale energy optimization. In wastewater and
              biogas settings, the buyer is often an infrastructure operator or project developer monetizing waste
              methane while cutting power bills or emissions.


              The adoption path is also consistent across segments. Public sources repeatedly point to a trigger event:
              grid congestion, long interconnection timelines, growing load, resilience needs, or decarbonization
              mandates. Buyers then evaluate onsite or microgrid-capable solutions, often through a partner such as
              Schneider, ABM, or NextEra, because financing, EPC, and integration complexity are part of the sale. If
              the first deployment succeeds, expansion can follow into additional sites or larger capacity blocks, as
              shown by CalBio’s multi-site scale-up and Mainspring’s references to grocery-store and public-power
              expansion.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM010
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Mainspring is not competing only against one clean-generation startup. The relevant buyer alternatives
              include direct low-emissions onsite-power peers, incumbent engine and generator vendors, adjacent
              microgrid integrators, and the status quo of grid supply with conventional backup. Bloom Energy is the
              most obvious direct premium alternative where a customer wants low-emissions onsite generation for data
              centers and other critical loads. Capstone Green Energy is a modular CHP and microturbine alternative with
              meaningful microgrid and data-center references. Cummins represents the incumbent threat: its data-center
              page, annual report, and results releases show a much larger installed base, broad natural-gas and
              backup-power catalog, and demand strength in power generation markets tied to data centers. Mainspring
              itself is positioning for utilities, enterprises, industrial users, and data centers, which means it sits
              at the intersection of critical-power procurement, decarbonization budgets, and grid-capacity bottlenecks
              rather than in a narrow single-vertical niche.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: Direct and Adjacent Rival Profiles
        blocks:
          - type: paragraph
            body: >-
              Bloom Energy and Capstone matter because they offer customers a credible path to onsite power without
              waiting for utility interconnection cycles. Bloom has materially larger scale than Mainspring, with $1.47
              billion of 2024 revenue, 27.5% annual gross margin, a November 2024 AEP agreement for up to 1 GW of fuel
              cells, and a May 2024 expansion at Intel's Santa Clara high-performance computing data center. Capstone
              sits lower on the technology curve but remains relevant in behind-the-meter and microgrid procurement
              because it markets 65 kW to multi-megawatt microturbines, highlights data-center case studies, and
              historically generates a meaningful share of revenue from service. Mainspring's own traction is still
              smaller, but official and independent sources show commercial shipments since 2020, hundreds of megawatts
              in field operations and advanced development, named Lineage deployments, and an emerging channel strategy
              through Schneider Electric. Hyliion is also a credible likely entrant because Energy Intelligence reported
              it is deploying a similar linear-generator concept through Flexnode at data complexes.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
      - number: '3.3'
        title: Distribution Power, Switching Costs, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Mainspring's strongest strategic problem is not proving that the product is novel; it is turning novelty
              into repeatable distribution and switching costs before incumbents compress the category. The Schneider
              partnership directly addresses this issue by pairing the Linear Generator with Schneider's EcoStruxure
              microgrid design-build offering, making Mainspring easier to buy inside broader resilience projects.
              Lineage provides a second form of leverage: repeat deployments across multiple sites create
              referenceability around cost savings, solar firming, and predictable onsite-power economics. Even so, the
              buyer can often multi-home. A site may mix Mainspring or Bloom generation with batteries, solar, controls,
              and conventional standby engines. UtilityDive's reporting also reinforces that customers pursuing
              data-center and fleet-electrification projects are often solving for speed-to-power, not brand loyalty.
              That matters because if interconnection delays ease, some of Mainspring's current wedge can narrow.
              Mainspring therefore needs partner access, permitting advantage, and fleet-operating data to compound
              faster than the broader market standardizes around any modular low-emissions generation vendor.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Mainspring has a real permitting-and-flexibility wedge
            body: >-
              Public evidence consistently shows a differentiated story around seamless fuel switching, low emissions,
              and modular deployment. That combination is stronger than a generic “onsite power” message and helps
              explain why Schneider, Lineage, and utility-related deployments are strategically important proof points.
            calloutType: strength
            claimRefs:
              - CP001
          - type: callout
            title: Category success could still weaken company-specific moat
            body: >-
              If buyers increasingly procure modular low-emissions generation as a broad category, large incumbents and
              larger direct peers can absorb Mainspring's value proposition into bigger bundles, stronger balance
              sheets, and more mature service footprints. Public pricing opacity increases that risk because outside
              observers cannot yet prove Mainspring wins on realized economics.
            calloutType: risk
            claimRefs:
              - CP001
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              The retained public record supports a revenue model centered on selling or financing modular onsite-power
              systems, then layering service, maintenance, and repeat-site expansion rather than on selling a
              transparent software subscription. Mainspring's enterprise and solutions pages repeatedly frame the
              product as a turnkey onsite-power offering that can be bought with flexible ownership structures, monthly
              payments, and maintenance options. The product is explicitly designed for utilities, enterprises,
              industrial users, and data centers, which suggests a deployment-led business where monetization tracks
              project scope and site operating economics more than seat-based usage. Customer evidence from Lineage
              reinforces that interpretation: deployments expand across facilities over time, pointing to repeat project
              revenue and potential service or fleet-management economics. The key constraint is that Mainspring does
              not publish a list price, power-purchase rate, ACV range, or disclosed service attach rate. Public
              evidence therefore supports the structure of the revenue model, but not its realized mix or quality.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
      - number: '4.2'
        title: GTM Motion and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Mainspring's GTM motion looks consultative and infrastructure-led rather than transactional. The strongest
              evidence comes from the kinds of customers and partnerships it highlights: Schneider-led microgrids,
              Lineage rollouts, utility projects, data-center messaging, and manufacturing expansion sized for rapid
              capacity deployment. These are not lightweight self-serve workflows. They imply long selling cycles, site
              design work, permitting, installation, and financing coordination. PG&E's February 2025 data-center
              interconnection release is important because it shows the surrounding market condition helping Mainspring:
              large customers want power faster than utilities can always deliver it, and some are willing to fund
              infrastructure upfront under new tariff mechanisms. That makes Mainspring's “speed-to-power” pitch
              economically credible even without public CAC or payback metrics. The missing piece is efficiency
              measurement. No retained source discloses sales-cycle duration, pipeline conversion, CAC, customer
              acquisition headcount, or payback period, so the chapter can only infer a high-touch motion with
              potentially strong average contract value but heavy acquisition and deployment friction.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI006
      - number: '4.3'
        title: Cost Structure and Margin Path
        blocks:
          - type: paragraph
            body: >-
              Mainspring appears structurally more capital-intensive than a pure software business. The official pages
              emphasize lower capex, lower maintenance, and higher efficiency relative to alternatives, but those are
              buyer-facing value claims rather than reported margins. The DOE grant and Pennsylvania plant plans imply
              real manufacturing, tooling, and workforce build-out; the CEC report further frames the product as a
              hardware system whose value rests on efficiency, emissions, fuel flexibility, and low costs. That points
              to a blended cost structure spanning generator manufacturing, field deployment, service, and partner
              support. Public-company comparables suggest the likely range of outcomes. Bloom shows that low-emissions
              onsite-power vendors can reach 27.5% gross margin at scale, while Cummins shows a much larger industrial
              power business at 24.7% gross margin. Capstone is the downside reminder that distributed-generation
              vendors can still face backlog compression, restructuring, and liquidity stress even with a service
              component. The gap is obvious: Mainspring does not disclose its own gross margin, contribution margin by
              deployment, or service-versus-hardware mix, so investors cannot yet place it confidently on that spectrum.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital formation and customer proof are clearly real
            body: >-
              The strongest public financial signal is not revenue disclosure; it is that Mainspring keeps attracting
              capital and customer proof at the same time. A $258M round, an $87M manufacturing grant, repeat Lineage
              deployments, and expanding data-center messaging together suggest a company solving a real market
              bottleneck rather than selling only pilots.
            calloutType: strength
            claimRefs:
              - CI001
          - type: callout
            title: Treasury sufficiency remains un-underwritable from public data
            body: >-
              Public sources do not disclose revenue, gross margin, cash, burn, runway, customer concentration, or
              project-level contribution margin. That means the current diligence risk is not demand uncertainty alone;
              it is the inability to test whether manufacturing scale-up and financed deployments are compounding value
              faster than they consume cash.
            calloutType: risk
            claimRefs:
              - CI001
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition, use cases, and workflow fit
        blocks:
          - type: paragraph
            body: >-
              Mainspring sells the Linear Generator as local power rather than as a generic backup set. Across its
              product, utilities, data-center, enterprise, and industrial pages, the recurring pitch is the same:
              customers that need firm power but do not want diesel-style emissions or single-fuel dependence can deploy
              factory-built 250 kW packages and stack them modularly as load grows. In workflow terms, the product sits
              between the fuel supply, the customer’s onsite electrical load, and optional grid interconnection.
              Data-center buyers are shown a path from grid-constrained land to islandable onsite generation; utilities
              are shown local firm capacity and near-load balancing; enterprise customers are shown cost-controlled
              primary power and solar firming; industrial methane and biogas operators are shown waste-to-power
              monetization. The official product page anchors the core value proposition with concrete specs—46% net-AC
              efficiency, less than 1.5 ppm NOx, no water consumption, and 0-100% dispatchability—while the Energy
              Intelligence interview and Latitude Media reporting extend the same workflow into EdgeConneX-style data
              centers, Amazon logistics, and military resilience use cases. The public record therefore supports a
              conclusion that Mainspring’s product-market framing is operationally specific, not just abstract
              clean-energy branding.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: Architecture, deployment model, and engineering maturity
        blocks:
          - type: paragraph
            body: >-
              Public technical detail is unusually strong for a late-stage private hardware company. The official
              product page and the California Energy Commission report both describe a low-temperature, noncombustion
              reaction that pushes oscillators through copper coils, with pressure cycling and power electronics
              replacing the rotating-machine architecture used by conventional generators. The CEC report adds
              independent structure around that explanation: it documents a 230 kW demonstration at a grocery site in
              Colton, states that the unit remained operational as of July 2023, and says performance targets for
              output, emissions, efficiency, and run time were met after more than nine months of monitoring. The same
              report says the packaged product is UL-2200 listed and uses UL-1741-SA-listed grid-tie inverters, which is
              important because it turns vague “safe and reliable” marketing into a real certification trail. Developer
              signal also matters here. Current job postings describe a cloud-to-field software ecosystem with telemetry
              ingestion, secure remote monitoring, predictive maintenance, data platforms, controls simulation, embedded
              software, and AI-assisted fleet optimization. The CoLab case study reinforces that Mainspring is already
              operating at nontrivial hardware complexity, with more than 3,000 unique parts, about 30 mechanical
              engineers, and a multi-discipline workflow spanning hardware, software, controls, systems, and suppliers.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: Differentiation, trust controls, and remaining technical gaps
        blocks:
          - type: paragraph
            body: >-
              Mainspring’s clearest differentiation claim is that it combines fuel-cell-like efficiency and emissions
              with engine-like dispatchability and lower mechanical complexity. The CEC report, IEEE Spectrum explainer,
              Schneider partnership material, and Xendee webinar all support the same architecture-level thesis: the
              product can switch among multiple gaseous fuels without retrofit, ramp quickly, and fit into microgrid or
              renewable-firming designs. Public operating proof is also widening: AEP’s pilot framed the asset as a
              peaker alternative and EV-charging enabler; Schneider packaged it into an EcoStruxure microgrid offer; and
              DCVC described a Prologis truck-charging deployment where onsite power arrived in nine months instead of a
              multi-year utility timeline. Even so, the trust and quality story is uneven. Public emissions and
              electrical-certification evidence is good, but there is no public trust center, no public SOC 2 or cyber
              certification package, no published fleet-availability dataset, and no customer-facing API or SDK
              documentation visible in the retained sources. Those omissions do not invalidate the core hardware thesis,
              but they do matter because Mainspring increasingly sells into uptime-sensitive environments such as data
              centers, utilities, wastewater plants, and defense pilots where the software-control plane and service
              response become part of the product itself. Another practical implication is that product diligence now
              has to cover both electromechanical robustness and the operational maturity of the remote-service layer.
              Public sources support the hardware thesis, but they do not yet show how alarms are triaged, how remote
              actions are permissioned, or how software releases are validated before field rollout. Those are not
              cosmetic omissions when the buyer is relying on the asset for critical capacity rather than occasional
              backup.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public technical evidence is stronger than typical private-climate-tech marketing
            body: >-
              The California Energy Commission report gives Mainspring unusual public technical grounding for a private
              hardware company: it explains the core mechanism, records a real-site demonstration, and documents
              electrical-certification context plus measured emissions and efficiency.
            calloutType: strength
            claimRefs:
              - CE001
          - type: callout
            title: The product increasingly includes a software-control plane, not just hardware
            body: >-
              Current roles show Mainspring building a cloud-to-field stack for telemetry, remote control, predictive
              maintenance, data platforms, and DevSecOps. That means diligence should treat software reliability and
              security as part of the product thesis, not as an implementation afterthought.
            calloutType: insight
            claimRefs:
              - CE001
          - type: callout
            title: Security, API, and fleet-availability transparency remain thin
            body: >-
              Despite strong public emissions and hardware validation, the retained sources do not show a public trust
              center, SOC package, customer API documentation, or fleet-wide availability statistics. Those gaps matter
              because the company now targets uptime-sensitive operators such as utilities, wastewater systems, data
              centers, and defense installations.
            calloutType: risk
            claimRefs:
              - CE001
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: >-
          Customer segmentation is broad across infrastructure-heavy operators, but the clearest fit is
          power-constrained critical loads
        blocks:
          - type: paragraph
            body: >-
              Mainspring’s public customer base is not random. The retained solution pages and project announcements
              consistently cluster around operators for whom electricity is either a core operating input or a
              bottleneck to growth: grocery and cold-storage operators that want predictable energy costs, public-power
              and irrigation entities that need local capacity, dairy and wastewater operators that can monetize
              methane, data-center developers that cannot wait on interconnection, and public-sector resilience buyers
              such as the Air Force. That pattern matters because it means the company’s buyer is usually not a generic
              facilities manager shopping for backup generation; it is a decision-maker facing a specific power
              constraint, permitting problem, or decarbonization mandate. Schneider’s partnership release, the
              utility/customer spotlights, and the logistics/data-center stories all point in the same direction:
              Mainspring wins where speed to power, modular add-ons, fuel flexibility, and low-NOx siting are
              economically meaningful rather than merely nice-to-have.


              The segmentation is therefore broad by vertical but narrow by operating profile. Kroger and Lineage are
              very different end markets, yet both use Mainspring to control onsite energy costs while improving
              resilience. UMPA and Lathrop Irrigation District sit on the utility/public-power side, but both appear in
              the record because local dispatchable generation solves capacity and rate pressure. CalBio and
              Chattanooga’s MBEC use the system to turn waste methane into electricity, which creates a very different
              revenue logic from retail or data centers but the same attraction to modular, easily permitted local
              generation. EdgeConneX, Prologis, and Amazon add another segment where grid delays themselves become the
              wedge. The public evidence therefore supports a customer thesis centered on energy-intensive,
              mission-critical operators with site-specific deployment pain, not mass-market backup buyers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: >-
          Named customer proof is real and increasingly production-grade, with the strongest evidence on cost,
          resilience, and expansion
        blocks:
          - type: paragraph
            body: >-
              Mainspring clears the named-customer-proof bar because the retained evidence goes beyond logos and generic
              testimonials. Kroger’s official customer page says the system provides predictable and lower energy costs,
              and Trellis adds financing detail plus a direct quote explaining why the grocer liked a no-capex,
              no-maintenance structure. Lineage has several layers of proof: official enterprise positioning, the 2022
              up-to-150-generator agreement, and the 2024 Texas expansion for 33 generators across five facilities.
              UMPA’s 48 MW central-Utah project is large enough to matter strategically, while Lathrop Irrigation
              District is one of the clearest outcome stories in the entire public set because Mainspring claims 40%
              lower electricity rates, 95% peak-load coverage, three-month air permits, and seven-month delivery. CalBio
              and MBEC show that the product is not limited to corporate campuses: both use site methane or biogas to
              produce electricity, with CalBio scaling to 5.3 MW across five sites and Chattanooga targeting a one-third
              bill offset and 3 MW over two phases.


              The strongest common outcomes are not software-style productivity metrics; they are physical deployment
              and energy-economics metrics. Public sources repeatedly cite lower or more predictable energy cost, faster
              availability than utility timelines, resilience during grid constraints, methane monetization, and
              lower-emissions permitting. EdgeConneX is framed around time-to-market and load-following dispatchability,
              Prologis around getting truck-charging power in nine months instead of three years, and the Air Force
              around mission resilience plus fuel-flexibility testing. That evidence mix supports a balanced conclusion:
              Mainspring has credible production proof across several demanding customer types, and the proof is getting
              fresher in 2025-2026 as larger projects and multi-site expansions appear. What public sources still do not
              show is broad cohort durability—there is plenty of deployment proof, but little disclosure on renewals,
              standardized uptime, or segment-level retention quality.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: >-
          Expansion logic is visible, but concentration, retention, and contract quality remain the main public blind
          spots
        blocks:
          - type: paragraph
            body: >-
              The best public expansion signal is repeat deployment after an initial site proves out. Kroger says it has
              already begun adopting the technology at other locations. Lineage moved from an early cold-storage
              deployment to a network agreement, later followed by a Texas rollout covering five facilities and 33
              generators. CalBio bought eight additional generators for two more cluster sites after earlier Hanford,
              Buttonwillow, and Merced deployments. MBEC’s first six-generator phase is explicitly paired with a second
              six-generator phase once campus upgrades are complete. These are meaningful because they show customers
              are not only piloting the asset once; they are considering how modular local generation fits into
              network-level energy strategy. Partner-backed financing and channel support reinforce that pattern.
              Trellis and Canary both describe NextEra-backed structures that reduce upfront capital friction, while
              Mainspring’s reseller launch suggests the company is building more than a direct-sales motion.


              But the public record stays stubbornly weak on classic durability and concentration questions. There is no
              retained public disclosure of total active customer count, NRR, GRR, churn, median contract term, renewal
              rates, or top-customer revenue share. Public customer proof is also concentrated in a relatively small set
              of visible names, which is good for proof quality but bad for concentration transparency: investors can
              see several strong logos, yet cannot tell how much of revenue depends on a handful of infrastructure-scale
              accounts or financing partners. Satisfaction proof is similarly uneven. The project announcements and
              customer quotes are positive, but they are not the same thing as broad survey, review, or cohort data. So
              the customer verdict is constructive but incomplete: Mainspring appears able to land in hard energy
              problems and expand where the first deployment works, yet public evidence still cannot validate portfolio
              durability or concentration risk on its own.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named proof spans several demanding customer classes
            body: >-
              Mainspring’s public customer record includes grocery cold storage public power irrigation biogas
              wastewater data centers logistics charging and defense. That breadth matters because it shows the product
              is not pinned to one narrow logo category or one-off pilot narrative.
            calloutType: strength
            claimRefs:
              - CU001
          - type: callout
            title: The customer wedge is usually procurement friction plus site-specific energy pain
            body: >-
              The best stories are not generic green branding wins. They are cases where Mainspring can shorten time to
              power avoid utility delays monetize methane or shift capex into a financed structure which is why
              NextEra-backed PPAs and turnkey deployment language matter so much in the public record.
            calloutType: insight
            claimRefs:
              - CU001
          - type: callout
            title: Public durability and concentration evidence is still thin
            body: >-
              Expansion signals are encouraging but the retained sources still do not disclose active customer count NRR
              GRR churn contract term or top-customer concentration. Public evidence proves adoption; it does not yet
              prove portfolio durability.
            calloutType: risk
            claimRefs:
              - CU001
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top risk picture
        blocks:
          - type: paragraph
            body: >-
              Mainspring’s public record supports a high but still actionable risk profile. The company clearly has
              commercial momentum: it reports more than 500 MW in late-stage development and operation, announced a $258
              million Series F round in 2025, won an $87 million DOE-backed manufacturing award, and publicized utility,
              municipal, and defense projects in 2026. Those positives do not remove the core underwriting problem. Most
              of the critical proof points that would reduce perceived risk at this stage—fleet reliability,
              warranty-loss history, disclosed backlog conversion, customer concentration, and current unit
              economics—remain non-public. The result is a business that appears demand-validated and policy-aligned,
              but still difficult to size on residual execution risk with precision. Public evidence also suggests
              diligence should compare announced capacity and grants against real commissioning cadence, serviceability,
              and customer concentration before assuming the current narrative converts cleanly into durable cash
              generation.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR002
              - CR003
      - number: '7.2'
        title: Operational, dependency, and manufacturing risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk clusters around scaling a hardware platform into larger, more timing-sensitive
              deployments. Public materials emphasize fast deployment, modular availability, multi-fuel flexibility, and
              low emissions, but they also show a business pushing into bigger and more consequential installations such
              as a 48 MW municipal utility project, a Chattanooga wastewater program, and a defense pilot. The
              Pennsylvania plant is strategically important because it is intended to lift output to 1,000 units
              annually and create more than 600 operating jobs, yet it also creates obvious ramp risk: labor, supplier
              quality, commissioning discipline, and project conversion all have to improve together. Multi-fuel
              capability mitigates single-fuel dependence, but it does not erase factory, installation, or field-service
              risk. Investors should treat each new marquee deployment as both validation and stress test, because
              bigger sites amplify installation, uptime, supplier, and service coordination demands.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: Regulatory, legal, and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Regulatory posture is directionally constructive but not fully de-risked. Mainspring’s 2024 California
              Energy Commission filing argues that the platform is fully commercialized on natural gas and RNG/biogas,
              has passed 1,000 hours on 100% hydrogen, and has moved beyond pilot status for core gas applications. That
              supports current deployment readiness, but hydrogen commercialization remains milestone-driven, not
              broadly proven in disclosed revenue or operating data. Legal and compliance disclosure is also thin. The
              website does publish a 2025 privacy policy, 2025 terms of use, and supplier-governance materials, which
              shows baseline legal hygiene. However, public evidence reviewed did not disclose active litigation,
              cybersecurity incidents, customer concentration, or reliability metrics. Those gaps force diligence to
              stay focused on downside scenarios rather than assuming risk is low because incidents are not obvious in
              marketing materials. The absence of adverse evidence in marketing channels should therefore be read as an
              information gap, not as proof that residual risk is low.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest residual risk is still execution, not demand
            body: >-
              Public demand signals are improving, but the most important unknown remains whether factory ramp, field
              reliability, and project conversion can keep up with the scale implied by recent announcements.
            calloutType: risk
            claimRefs:
              - CR001
          - type: callout
            title: Multi-fuel capability is a real mitigant
            body: >-
              Mainspring’s fuel-flexible design meaningfully reduces single-fuel dependence and helps on resilience, but
              it should be treated as a mitigant inside a broader execution-risk frame rather than as a full risk
              eliminator.
            calloutType: strength
            claimRefs:
              - CR001
          - type: callout
            title: Diligence should focus on non-public operating proof
            body: >-
              The highest-value diligence asks are reliability, warranty, customer concentration, and factory-ramp
              metrics. Those items are more decision-critical than additional market-sizing work at this stage.
            calloutType: recommendation
            claimRefs:
              - CR001
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current entry context
        blocks:
          - type: paragraph
            body: >-
              Mainspring’s public narrative supports commercial relevance but not price precision. The company has a
              recent $258 million Series F round, says cumulative financing now exceeds $800 million, and continues to
              add large reference deployments and manufacturing capacity. That is enough to conclude the business is
              neither stalled nor purely conceptual. It is not enough to determine whether today’s private valuation is
              attractive, fair, or stretched because the company does not publicly disclose revenue, gross margin,
              backlog, current post-money valuation, or cap-table terms. In practical terms, investors can underwrite
              strategic momentum and execution risk, but not entry price. That makes valuation work an exercise in
              anchor ranges and diligence priorities rather than in definitive fair-value math. That limitation matters
              because private-company valuation discipline is mainly about entry price and downside structure, not about
              admiring strategic relevance in the abstract.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.2'
        title: Comparable anchors and scenario framing
        blocks:
          - type: paragraph
            body: >-
              The most useful public anchors are industrial and power-equipment peers rather than software businesses.
              Generac, Cummins, and Caterpillar all provide tradable market-cap and revenue reference points, and they
              also publish risk disclosures that fit a manufacturing-led power platform. Using market-cap-to-revenue as
              a simple public anchor, the observed band runs from about 2.7x for Cummins to 6.0x for Caterpillar, with
              Generac around 3.6x. That range is informative but imperfect. Caterpillar embeds a larger, more
              diversified industrial platform, while Generac and Cummins are more comparable on power-equipment
              execution risk. A clean-tech peer such as Bloom Energy adds another important lesson: strong growth can
              still coexist with warranty reserves, debt, and commercialization noise. The right interpretation is that
              Mainspring could earn premium multiples only if it proves manufacturing scale and service durability, not
              simply because power demand is hot. In other words, the comps are useful for discipline and scenario
              framing, but they cannot substitute for company-specific financial disclosure.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: Recommendation and diligence gates
        blocks:
          - type: paragraph
            body: >-
              Given the evidence available on 2026-05-05, the most defensible call is research-more with medium
              confidence, a high risk rating, and an unknown valuation stance. The positive side of the ledger is
              meaningful: more than 500 MW of late-stage development and operation, a large factory grant, utility and
              municipal projects, a defense pilot, and a board strengthened with experienced industrial operators. The
              negative side is more important for current entry discipline: no public revenue or margin disclosure, no
              disclosed current price, no public cap-table terms, limited reliability visibility, and unclear
              concentration. That means an investor should not confuse company quality with investable price support.
              Price sensitivity, dilution risk, and exit timing all remain too opaque for a buy recommendation today.
              The asymmetry is therefore favorable only if the eventual private price is materially discounted to those
              uncertainties.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports interest, not a buy call
            body: >-
              Mainspring appears strategically important and commercially relevant, but the current public record does
              not reveal enough about price or economics to support a buy recommendation.
            calloutType: recommendation
            claimRefs:
              - CV001
          - type: callout
            title: Biggest downside is a financing event before disclosure improves
            body: >-
              If Mainspring needs another round before it reveals revenue, reliability, or concentration data, dilution
              and preference-overhang risk could dominate otherwise positive demand signals.
            calloutType: risk
            claimRefs:
              - CV001
          - type: callout
            title: Use public comps as ceilings and checkpoints
            body: >-
              The public-comp range is useful for framing discipline, but it should be treated as a ceiling and
              diligence checklist until Mainspring discloses the financial inputs needed for direct valuation.
            calloutType: assumption
            claimRefs:
              - CV001
