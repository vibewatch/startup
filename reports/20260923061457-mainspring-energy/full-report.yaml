        - UMPA / Chattanooga
        - Reference deployments and conversion proof
        - Medium
        - Announced projects slip or underperform, weakening credibility
        - High
        - Diversify into utility, municipal, enterprise, and defense use cases
        - Flagship-project timing still matters heavily
      - - Defense and public-sector procurement channels
        - U.S. Air Force / Tradewinds
        - Validation and resilience use case
        - Low to medium
        - Pilot does not translate into repeat procurement
        - Medium
