  - id: TV001
    title: Recommendation summary table
    columns:
      - Recommendation
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - - research-more
        - medium
        - high
        - unknown
        - Do not underwrite entry price until revenue, reliability, and cap-table visibility improve
    notes: >-
      The call is evidence-sensitive and price-sensitive; current public evidence is enough to monitor closely but not
      enough to support a buy rating.
    claimRefs:
      - CV001
      - CV002
      - CV003
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - - >-
          Demand tailwinds are real because utilities, municipalities, defense, and data centers all show interest in
          dispatchable local power.
        - >-
          If announced projects slip repeatedly or fail to convert into operating assets, the demand story weakens
          materially.
      - - Multi-fuel, low-emissions positioning may create scarce optionality in constrained-power markets.
        - >-
          If fuel-flexibility does not translate into lower customer acquisition friction or better economics, scarcity
          premium should shrink.
      - - Manufacturing expansion and board upgrades suggest the company is preparing for industrial scale.
        - >-
          If the Pennsylvania plant ramps slowly or reliability metrics disappoint, scale ambition becomes a liability
          rather than an advantage.
      - - Private-market support from strategic investors can be valuable.
        - >-
          Without public revenue, valuation, or preference terms, financing support alone cannot prove attractive entry
          pricing.
      - - Capital structure overhang
        - No public cap-table terms or liquidation stack
    notes: >-
      The anti-thesis remains stronger than the thesis on price support because the business is private and financially
      opaque.
    claimRefs:
      - CV004
      - CV005
      - CV006
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Factory ramp lands on time, flagship projects convert, and the company begins disclosing reliability plus
          revenue scale.
        - Upper-end public-comp anchors become more credible; premium industrial scarcity framing could be justified.
        - Warranty or service issues still cap upside if scale outruns quality.
        - Requires multiple new proofs, so signal is currently low.
      - - Base
        - Demand remains strong, but disclosure stays limited and factory ramp remains the key gating variable.
        - Use lower-middle public-comp anchors and insist on a valuation discount for opacity.
        - Price risk and dilution risk remain material.
        - Best fit for current public evidence.
      - - Bear
        - Factory or deployment slippage persists while economics remain undisclosed.
        - Down-round or severe multiple compression risk dominates; focus shifts to capital preservation.
        - Execution delays, concentration, and higher financing need.
        - Risk rises quickly if milestones slip without new disclosure.
      - - Financing / disclosure shock
        - Another raise before revenue and reliability improve
        - Would pressure entry price and increase dilution
        - Could reset the thesis to capital preservation
        - Track timing of the next financing and any new disclosures
    notes: Scenario logic is directional because the current private valuation and revenue base are not public.
    claimRefs:
      - CV007
      - CV008
      - CV009
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Publicly corroborated milestones from founding through 2026 show a progression from Stanford-rooted R&D to channel
      expansion and multi-vertical commercial deployments.
    data:
      items:
        - date: '2010-01-01'
          label: Founded in Menlo Park
          detail: >-
            Shannon Miller, Adam Simpson, and Matt Svrcek start the company that later commercializes the linear
            generator.
          tone: positive
        - date: '2020-06-01'
          label: Pilot shipments begin
          detail: Pilot units start shipping to Fortune 500 customers, moving the product from lab to field use.
          tone: positive
        - date: '2021-03-09'
          label: Commercial launch + NextEra agreement
          detail: >-
            Mainspring unveils the Linear Generator and a $150M purchase / project-finance relationship with NextEra
            Energy Resources.
          tone: positive
        - date: '2022-06-22'
          label: Hydrogen + ammonia milestone
          detail: Company says its generator passed key tests on 100% hydrogen and 100% ammonia.
          tone: positive
        - date: '2024-04-02'
          label: Schneider Electric microgrid partnership
          detail: Partnership targets C&I and critical-power customers needing onsite resilient power.
          tone: positive
        - date: '2024-10-24'
          label: ABM EV charging partnership
          detail: ABM collaboration extends Mainspring into fleet EV charging and turnkey EPC deployments.
          tone: positive
        - date: '2025-04-14'
          label: Series F + board expansion
          detail: General Catalyst leads a $258M Series F; Tom Linebarger and Bethany Mayer join the board.
          tone: positive
        - date: '2026-03-09'
          label: Municipal wastewater project in Chattanooga
          detail: City of Chattanooga launches a 3 MW wastewater methane-to-power project with Mainspring.
          tone: positive
    approximationNotes: null
    claimRefs:
      - CO010
      - CO011
      - CO012
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Approximate nested lens from broad U.S. data-center power demand to the subset likely to seek onsite primary power
      to Mainspring’s currently evidenced deployment wedge.
    data:
      items:
        - label: 'TAM lens: U.S. data-center power demand by 2030'
          detail: >-
            McKinsey estimates U.S. data-center demand rising to >80 GW by 2030; other cited estimates span roughly
            50-120 GW.
          value: 80
        - label: 'SAM lens: share of sites likely to use onsite primary power'
          detail: >-
            Applying Bloom’s ~30% onsite-primary site share to McKinsey’s 80 GW demand lens implies ~24 GW of demand
            with stronger onsite-power relevance.
          value: 24
        - label: Current evidenced wedge
          detail: >-
            Mainspring publicly claims >500 MW in late-stage development and operation across utilities, C&I, data
            centers, and biogas / wastewater use cases.
          value: 0.5
        - label: Data-center operators exploring onsite generation
          detail: Industry survey cited in the chapter says 62% of data centers are exploring onsite generation.
          value: 62
        - label: Utility commitments for large load growth
          detail: >-
            Wood Mackenzie lens in the chapter notes 64 GW of utility commitments tied to proposed U.S. data-center
            growth.
          value: 64
        - label: Proposed U.S. data-center pipeline
          detail: Wood Mackenzie lens in the chapter tracks 134 GW of proposed U.S. data centers.
          value: 134
    approximationNotes: >-
      All values are in GW. The middle layer is a derived approximation using a site-share statistic rather than a
      direct market total, and the bottom layer is Mainspring’s company-claimed currently evidenced wedge rather than a
      formal SOM.
    claimRefs:
      - CM010
      - CM011
      - CM012
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Mainspring scores well on fuel flexibility and permitting but remains behind Bloom and especially Cummins on
      distribution leverage and installed-base confidence.
    data:
      xAxis:
        label: Distribution / installed-base leverage (0-10 ordinal)
      yAxis:
        label: Fuel flexibility + permitting edge (0-10 ordinal)
      points:
        - label: Mainspring
          x: 6
          'y': 9
          detail: Strong technical wedge, growing but still-developing channel reach.
          tone: positive
        - label: Bloom Energy
          x: 8
          'y': 7
          detail: Large public scale and strong data-center proof, lower emphasis on seamless fuel switching.
          tone: positive
        - label: Capstone
          x: 5
          'y': 5
          detail: Useful microgrid fit, but weaker strategic durability after restructuring.
          tone: warning
        - label: Cummins
          x: 10
          'y': 4
          detail: Dominant incumbent reach and service depth, but less differentiated emissions/permitting posture.
          tone: neutral
        - label: Hyliion / Flexnode
          x: 3
          'y': 7
          detail: Emerging linear-generation entrant with lower field proof.
          tone: warning
        - label: Schneider Electric microgrid channel
          x: 7
          'y': 6
          detail: Channel and integration leverage can bundle Mainspring into broader microgrid projects.
          tone: neutral
    approximationNotes: >-
      Scores are evidence-backed ordinal judgments built from public product pages, deployments, filings, and partner
      signals rather than directly reported vendor metrics.
    claimRefs:
      - CP010
      - CP011
      - CP012
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Mainspring's public monetization path appears to move from customer power need to financed or direct deployments,
      then into service and repeat-site expansion.
    data:
      nodes:
        - id: n1
          label: Power-constrained customer
          detail: Utilities, enterprises, industrial users, data centers, and cold-storage operators are named use cases.
        - id: n2
          label: Direct or financed generator deployment
          detail: Customer can buy directly or use financing-partner monthly payments with no upfront capital.
        - id: n3
          label: Installation + commissioning
          detail: Deployment-led revenue likely includes equipment and project implementation economics.
        - id: n4
          label: Service / maintenance attach
          detail: Official pages market turnkey maintenance and flexible service offerings.
        - id: n5
          label: Repeat site expansion
          detail: Lineage framework-plus-expansion evidence suggests follow-on orders are a key quality signal.
        - id: n6
          label: DOE grant and Pennsylvania plant scale-up
          detail: Public grant and factory expansion support the capital-intensity story but do not disclose realized margins.
      edges:
        - from: n1
          to: n2
          label: Procurement decision
        - from: n2
          to: n3
          label: Deployment revenue
        - from: n3
          to: n4
          label: Operate asset
        - from: n4
          to: n5
          label: Cohort expansion
        - from: n5
          to: n6
          label: Scale-up capital
    approximationNotes: >-
      The bridge is qualitative because retained public sources describe monetization structure but not exact revenue
      splits.
    claimRefs:
      - CI010
      - CI011
      - CI012
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Shows the retained public architecture from fuel handling through generator physics, power electronics, and fleet
      software.
    data:
      layers:
        - label: Fuel supply and site interface
          modules:
            - Natural gas / RNG / biogas / propane / hydrogen / ammonia
            - Site plan, permitting, and gas-pressure conditioning
        - label: Reaction and motion core
          modules:
            - Low-temperature noncombustion reaction zone
            - Oscillators / pistons with air-spring rebound
        - label: Electromagnetic conversion
          modules:
            - Magnets moving through copper coils
            - Direct conversion of linear motion into electricity
        - label: Power electronics and controls
          modules:
            - Adaptive Pressure Cycle control
            - Grid-parallel / island-capable power electronics
        - label: Packaged deployable asset
          modules:
            - Two-core factory-built package
            - UL-2200 generator + UL-1741-SA inverter context
        - label: Cloud-to-field operations layer
          modules:
            - Telemetry ingestion
            - Remote monitoring and control
            - Predictive maintenance and fleet analytics
    approximationNotes: null
    claimRefs:
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Maps how major customer segments move from a power pain point into deployment and then into repeat-site expansion.
    data:
      items:
        - label: Kroger / retail
          detail: >-
            High electricity-cost pain -> financed onsite option -> deploy store-level generation -> adopt at additional
            locations
        - label: Lineage / cold chain
          detail: Solar-firming and resilient-power need -> first site proof -> multi-site plan -> broader facility expansion
        - label: Public power / utility
          detail: >-
            Capacity or rate pressure -> evaluate dispatchable local generation -> permit and build -> use for peak and
            local capacity
        - label: Biogas / wastewater
          detail: >-
            Monetize methane and cut flaring -> validate fuel-flexible generation -> phased installation -> add more
            sites or second phase
        - label: Data center / critical load
          detail: >-
            Interconnection delay threatens go-live -> choose grid-independent power -> turnkey deployment -> add
            modular 25-50 MW blocks
        - label: Public power / utility expansion
          detail: Utility and public-power projects indicate broader demand beyond corporate campuses.
    approximationNotes: >-
      The journey map synthesizes repeated patterns from named customer stories rather than depicting one universal
      internal sales playbook.
    claimRefs:
      - CU010
      - CU011
      - CU012
