        - label: Permitting / community timing
          values:
            - Medium
            - High
            - Intermediate
            - Medium-High
        - label: Legal / litigation visibility
          values:
            - Unknown
            - Medium
            - Early
            - Medium
        - label: Customer concentration
          values:
            - Unknown
            - High
            - Early
            - High
    approximationNotes: Ordinal cells summarize evidence-backed severity rather than audited probability distributions.
