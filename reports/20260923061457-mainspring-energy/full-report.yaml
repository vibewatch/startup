  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Recommendation flows from real commercial momentum into a hard stop on valuation precision because revenue and
      current price remain undisclosed.
    data:
      nodes:
        - label: Demand signals improving
        - label: Manufacturing scale-up underway
        - label: Large projects increase proof
        - label: Revenue / price still undisclosed
        - label: Risk remains high
