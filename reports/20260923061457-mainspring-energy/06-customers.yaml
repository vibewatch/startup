figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Maps how major customer segments move from a power pain point into deployment and then into repeat-site expansion.
  data:
    items:
    - label: Kroger / retail
      detail: High electricity-cost pain -> financed onsite option -> deploy store-level generation -> adopt at additional
        locations
    - label: Lineage / cold chain
      detail: Solar-firming and resilient-power need -> first site proof -> multi-site plan -> broader facility expansion
    - label: Public power / utility
      detail: Capacity or rate pressure -> evaluate dispatchable local generation -> permit and build -> use for peak and
        local capacity
    - label: Biogas / wastewater
      detail: Monetize methane and cut flaring -> validate fuel-flexible generation -> phased installation -> add more sites
        or second phase
    - label: Data center / critical load
      detail: Interconnection delay threatens go-live -> choose grid-independent power -> turnkey deployment -> add modular
        25-50 MW blocks
    - label: Public power / utility expansion
      detail: Utility and public-power projects indicate broader demand beyond corporate campuses.
  approximationNotes: The journey map synthesizes repeated patterns from named customer stories rather than depicting one
    universal internal sales playbook.
