runDate: "2026-06-21"
company:
  name: Farmers Business Network
chapter:
  number: 8
  title: Valuation
  summary: >
    Public evidence supports FBN as a scaled, multi-product ag marketplace with meaningful financing,
    insurance, AI, and sustainability adjacencies, but it does not support underwriting the legacy
    2021 Series G / vendor-carried 2025 headline valuation of roughly $3.8-4.0B. The July 2025 $50M
    raise was disclosed without a valuation, current revenue remains undisclosed, and public comps
    range from ~0.65x to ~3.11x market cap/revenue while adverse agtech outcomes show how quickly
    digital-ag multiples can reset. The practical recommendation at the headline mark is research-more.
sections:
  - id: financing-context-and-public-marks
    title: Financing Context and Public Valuation Markers
    body: |
      FBN's last clean public valuation marker remains the November 2021 Series G, when AgFunderNews
      and Tracxn both reported a $300 million round at roughly a $4 billion post-money valuation. The
      July 28, 2025 capital raise added $50 million from GV, Temasek, Arteqin, Colle Capital, and T.
      Rowe Price, but the official company release did not disclose a new valuation, revenue figure,
      or cap-table terms. That omission matters because current vendor snapshots still anchor around
      the old mark: Premier Alternatives shows a $3.8 billion valuation as of July 28, 2025, while
      Tracxn shows the 2021 round at $4 billion and lists total lifetime funding at $981 million;
      Premier Alternatives instead shows $1.1 billion, underscoring that even baseline capital history
      now depends on vendor methodology. The rest of the operating context is real but not directly
      price-setting: FBN disclosed nearly $3 billion of financing extended to growers, more than
      117,000 farms representing 187 million acres, and over 7,200 marketplace products in July 2025;
      Business Wire later described 120,000+ members in January 2026. Those scale signals explain why
      investors continue to fund the platform, but they do not solve the core valuation problem:
      public evidence still omits current revenue, ARR, margin, and preference-stack disclosure.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
