  - id: recommendation-diligence-asks-and-kill-triggers
    title: Recommendation, Diligence Asks, and Kill Triggers
    body: |
      The investable conclusion is research-more, not because FBN lacks real operating substance, but
      because price support is too thin for a $3.8-4.0 billion entry. The company clearly has scale,
      product breadth, and credible strategic relationships, and the addressable precision-ag market
      still appears to be growing. But the missing evidence is exactly the evidence that determines
      price: recognized revenue, take rates, gross margin by product line, credit losses or funding
      structure for the finance arm, liquidation preferences, the terms of any short-term convertible
      note, and an independently observed 2026 secondary or primary market mark. Without those inputs,
      the valuation debate collapses into vendor carry-forwards and narrative analogies. The chapter's
      stretch assessment is therefore explicit: public evidence can justify continuing diligence and a
      watch-list posture, but it cannot justify paying the legacy headline mark. The right next step is
      a private data room focused on monetization quality, credit risk, and cap-table economics. A
      priced convert well below the legacy mark, weak unit economics, or evidence that AI and financing
      expansion raises regulatory or credit risk faster than it raises margin would move the stance
      from research-more toward avoid.
    claimRefs:
      - CV041
      - CV046
      - CV047
      - CV048
      - CV049
    tableRefs:
      - TV001
      - TV005
      - TV006
    figureRefs:
      - FV004

