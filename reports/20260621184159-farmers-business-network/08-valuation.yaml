      - - Farmers Edge
        - "Digital-agriculture platform taken private in March 2024"
        - "C$0.35 per share take-private; Economic Times says deal was 98% below IPO price"
        - "Direct cautionary reference for how digital-ag equity can compress when growth and market support fade."
        - "Own execution issues and public-market history make it an outcome comp, not a clean multiple comp."
      - - AppHarvest
        - "Controlled-environment ag company that filed Chapter 11 in July 2023"
        - "12 debtors; ~$30M DIP financing during bankruptcy"
        - "Shows how aggressive agtech narratives can fail when capital intensity outruns economics."
