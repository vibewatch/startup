  - id: TV002
    title: Thesis / Anti-Thesis
    columns:
      - Argument type
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - "FBN has genuine scale: 117,000+ farms, 187 million acres, 7,200+ products, and nearly $3 billion of cumulative financing."
        - "Disclose segment revenue, take rates, and gross margin to prove that scale converts into durable earnings power."
      - - Thesis
        - "FBN has built monetization breadth across marketplace, financing, insurance, AI, and sustainability infrastructure."
        - "Show attach rates and contribution profit by product line, especially finance, insurance, and AI-led workflows."
      - - Thesis
        - "Strategic proof exists through ADM/Gradable and continued investor support in July 2025."
        - "Publish evidence that partnerships create recurring, material revenue rather than narrative optionality."
      - - Anti-Thesis
        - "The July 2025 raise disclosed capital but not valuation, revenue, or cap-table terms, leaving vendor carry-forwards to fill the gap."
        - "A priced round, priced convert, or audited management data room would sharply improve confidence."
      - - Anti-Thesis
        - "Public comps imply the headline valuation needs software-like economics at a scale the public record does not show."
        - "Confirmed revenue above roughly $500M with strong gross margin could narrow the stretch assessment."
      - - Anti-Thesis
        - "Adverse agtech outcomes at Farmers Edge, Indigo Ag, Gro Intelligence, and AppHarvest show that digital-ag narratives can de-rate fast."
        - "Evidence of profitability, low credit losses, and resilient retention through the farm downturn would reduce this concern."
    notes: >
      The anti-thesis is driven mainly by missing pricing evidence, not by a claim that FBN lacks real
      business activity. The underwriting dispute is whether the business quality is worth the legacy
      headline price.
