  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: filing-trail
      missingEvidence: "A successful up-to-run-date EDGAR search or filed S-1 / priced financing document that covers the full period through 2026-06-21."
      whyItMatters: "The chapter can show an older Reuters IPO report and a Form D search through 2026-01-01, but not a complete filing trail through the exact run date."
      diligencePath: "Re-run SEC discovery with working full-text endpoints or counsel-grade EDGAR tools covering S-1, D, and confidential-filing references through 2026-06-21."
      relatedQuestionRefs: [QV005]
    - type: private-evidence-only
      severity: material
      topic: secondary-mark-opacity
      missingEvidence: "A transparent 2026 primary or secondary market mark, mutual-fund NAV mark, or priced convert document with methodology and timing."
      whyItMatters: "Vendor carry-forwards and gated previews are not enough to decide whether the $3.8-4.0B headline mark still clears the market."
      diligencePath: "Request tender history, priced convertible-note documents, investor letters, or mutual-fund marks from management and secondary brokers."
      relatedQuestionRefs: [QV029]
    - type: enumeration-incomplete
      severity: material
      topic: comparable valuation table coverage
      missingEvidence: "More current disclosed private agtech marks and clean software-first agriculture-platform comparables with transparent revenue denominators."
      whyItMatters: "The current comparable set mixes public machinery, industrial software, and distress outcomes because current private agtech marks are rarely public."
      diligencePath: "Add secondary-broker data, fund marks, or management-provided comp sheets for Indigo, Bushel, Farmers Edge legacy valuation history, and other digital-ag platforms."
      relatedQuestionRefs: [QV017, QV029]
      relatedTableRefs: [TV004]
    - type: private-evidence-only
      severity: blocking
      topic: disclosure-gap
      missingEvidence: "Recognized revenue, gross margin, product-line contribution profit, credit-loss metrics, and full cap-table / preference disclosures."
      whyItMatters: "Without these inputs the chapter can only scenario-test valuation; it cannot underwrite the headline price."
      diligencePath: "Obtain a private management data room with monthly financials, segment economics, lending book performance, and legal financing documents."
      relatedQuestionRefs: [QV027, QV028]
