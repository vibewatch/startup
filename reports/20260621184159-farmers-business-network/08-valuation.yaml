        - "Scaled platform proof exists across financing, insurance, marketplace, AI, and sustainability services."
        - "Current revenue, margin, and cap-table terms are not publicly disclosed."
      - - Confidence
        - medium
        - "Multiple independent sources corroborate funding history, platform scale, and public comp ranges."
        - "Key pricing inputs remain private, so the call is evidence-limited rather than thesis-limited."
      - - Risk rating
        - high
        - "Sector valuation resets, layoffs, and convertible-note reporting imply real downside if operating proof lags."
        - "Risk could moderate materially with private disclosure of revenue quality and credit performance."
      - - Valuation stance
        - stretched
        - "Public comp band and undisclosed revenue do not support a flat carry of the $3.8-4.0B headline mark."
        - "A strong bull case can still approach the mark if software-like monetization is proven privately."
      - - Decision implication
        - "Do not underwrite the headline mark from public evidence alone"
        - "A private data room could still justify diligence continuation or a lower-price entry."
        - "Entry discipline, not business dismissal, is the key conclusion."
    notes: >
      This table is a price-sensitive summary rather than a company-quality score. The recommendation
      stays at research-more until FBN discloses revenue quality, credit economics, and preference or
      convert terms that can anchor a real underwriting model.
