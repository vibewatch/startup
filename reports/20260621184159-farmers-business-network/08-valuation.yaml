  - id: business-model-proof-and-adverse-sector-context
    title: Business-Model Proof and Adverse Sector Context
    body: |
      The strongest pro-valuation evidence is breadth rather than financial transparency. FBN has
      extended farm operating lines, launched crop insurance, expanded AI-assisted agronomy support,
      and deepened sustainability monetization through the 50-50 Gradable joint venture with ADM.
      Official and independent sources show real product sprawl: financing surpassed $1 billion in
      operating lines by March 2024 and nearly $3 billion cumulatively by July 2025; CropLife shows
      FBN selling federally subsidized crop insurance with data-backed risk selection; and ADM says
      Gradable already served more than 20,000 farmers across 12 million acres. Those assets create
      optionality, but they also raise the burden of proof because FBN is no longer a narrow software
      story. Marketplace, credit, insurance, and AI businesses each carry different margin, risk, and
      regulatory profiles. The adverse backdrop is important: Economic Times reported in June 2026
      that Indigo Ag's valuation had fallen from nearly $4 billion to about $200 million, Farmers Edge
      was taken private at 98% below its IPO price, Gro Intelligence was shutting down, and FBN itself
      had faced leadership departures, layoffs, and a reportedly unpriced short-term convertible note.
      That sector evidence makes a static 2021-style mark harder to defend without current unit
      economics.
    claimRefs:
