        - "Consistent with sector outcomes where digital-ag platforms lost investor support quickly."
        - "Priced convert, down-round, or poor unit economics in lending and marketplace operations."
    notes: >
      These ranges are illustrative estimates, not reported market marks. They are anchored to public
      comp bands, adverse agtech outcomes, and the specific evidence gap that FBN does not publicly
