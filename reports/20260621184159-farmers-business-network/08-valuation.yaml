      - Operating assumptions
      - Valuation logic
      - Probability signal
      - Key downside or upside trigger
    rows:
      - - Bull
        - "FBN proves $500M+ annual revenue, healthy blended gross margins, low loss rates in finance, and sticky attach across marketplace, insurance, and AI."
        - "$3.0B-$4.0B using roughly 6-8x on software-like, high-growth blended monetization."
        - "Requires private evidence that FBN behaves more like a scaled vertical software marketplace than a cyclical ag distributor."
        - "Audited revenue, segment margins, and a priced primary or secondary mark at or near the legacy valuation."
      - - Base
        - "FBN proves $250M-$400M revenue with mixed marketplace/fintech economics, moderate margins, and continued but slower growth through the farm downturn."
        - "$0.75B-$2.0B using roughly 3-5x on a hybrid marketplace/fintech model."
        - "Best matches the public record today: real scale, real products, but incomplete pricing proof."
        - "Data room confirms monetization quality but not software-like margins."
      - - Bear
        - "Revenue is materially below expected, finance economics weaken, convert pricing resets valuation, or a flat/down round emerges."
