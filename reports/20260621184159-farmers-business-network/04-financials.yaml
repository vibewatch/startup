        - Branded FBN biologics sold through marketplace at undisclosed ASP
        - No wholesale pricing published; sold alongside competing third-party products
        - Specialty biologics gross margin 30–55% for manufacturing-model companies
        - Not disclosed
        - Request ASP, COGS, and gross margin for FBN-branded products
