  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-run-rate
      missingEvidence: >-
        FBN has never disclosed total revenue, segment revenue, ARR, GMV, or any top-line
        financial metric across its marketplace, finance, or data business lines.
      whyItMatters: >-
        Without any revenue figure it is impossible to benchmark margins, assess capital
        efficiency, or underwrite the business model against comparables.
      diligencePath: >-
        Request management accounts or investor letter with trailing-12-month segment revenue;
        alternatively seek secondary market transaction data from PitchBook or Preqin.
      relatedQuestionRefs:
        - QI006
        - QI009

    - type: private-evidence-only
      severity: blocking
      topic: cash-burn-and-runway
      missingEvidence: >-
        Monthly cash burn, cash balance as of the July 2025 $50M raise, and runway
        estimate are entirely absent from public disclosures.
      whyItMatters: >-
        The $50M raise is small relative to the company's historical capital needs; without
        burn data the runway is speculative, and next-round timing cannot be assessed.
      diligencePath: >-
        Request CFO burn schedule, bank statements for recent quarters, and cash balance;
        cross-check with headcount costs and logistics footprint overhead.
      relatedQuestionRefs:
        - QI007

    - type: private-evidence-only
      severity: material
      topic: fbn-finance-credit-performance
      missingEvidence: >-
        Delinquency rates, default rates, and loan loss reserves for FBN Finance's nearly
        $3 billion cumulative loan portfolio have not been disclosed publicly.
      whyItMatters: >-
        Agricultural operating loans carry seasonal and commodity-price credit risk; without
        loss data, FBN Finance's contribution to EBITDA versus credit impairment is unknown.
      diligencePath: >-
        Request vintage loss curves by product type, a current delinquency schedule, and
        warehouse credit facility covenant compliance certificates.
      relatedQuestionRefs:
        - QI016

    - type: private-evidence-only
      severity: material
      topic: 2025-round-valuation
      missingEvidence: >-
        Post-money valuation for the July 2025 $50M Series G extension was not disclosed
        in any company announcement, press release, or investor communication found in the
        research trail.
      whyItMatters: >-
        Without the 2025 valuation, it is impossible to determine whether the round was
        flat, down, or up relative to the 2021 $4 billion benchmark, which materially
        affects dilution, preference stack, and secondary-market pricing.
      diligencePath: >-
        Request capitalization table; consult secondary-market platforms or lead investor
        disclosure; check Delaware Secretary of State filings for authorized share classes.
      relatedQuestionRefs:
        - QI019

    - type: private-evidence-only
      severity: material
      topic: cost-structure-and-unit-economics
      missingEvidence: >-
        Gross margin by business line, CAC, member LTV, and operating cost breakdown across
        logistics, technology, and lending operations are undisclosed.
      whyItMatters: >-
        Unit economics determine whether FBN's blended model is on a path to profitability;
        thin marketplace margins could be offset by finance NIM, but the relative scale is unknown.
      diligencePath: >-
        Request management accounts with segment P&L, CAC by channel, and cost center breakdown
        including logistics, technology, and lending advisory overhead.
      relatedQuestionRefs:
        - QI009

    - type: missing-source
      severity: minor
      topic: sec-form-d-filings
      missingEvidence: >-
        SEC EDGAR full-text search for Form D filings under "Farmers Business Network"
        returned zero results; no private placement exemption filings are accessible
        for verification of individual round terms, share class, or authorized amounts.
      whyItMatters: >-
        Form D filings would confirm per-round amounts, share classes, and exemption types,
        providing an independent verification of total capital raised and preference structure.
      diligencePath: >-
        Search EDGAR under alternate entity names such as "FBN Inc", "Farmers Business
        Network Inc", or the Delaware incorporation name; request cap table directly from
        company counsel.
      relatedQuestionRefs: []

