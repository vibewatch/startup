  - id: restructuring-and-adverse-events
    title: Restructuring, Adverse Events, and Financial Distress Signals
    body: >-
      FBN has exhibited multiple financial stress indicators since 2022. DTN reported in September
      2023 that FBN laid off a portion of its workforce and was planning a new subsidiary
      structure, signaling cost-reduction and strategic refocusing consistent with a company
      under margin pressure. FBN also discontinued its Australian operations, which had been
      initiated through the Farmsave acquisition, implying write-off or stranded-asset costs
      from international expansion. The CEO transition from co-founder Amol Deshpande to
      professional management under Diego Casanello, effective March 2024, represents a
      governance restructuring typically associated with investor-driven performance demands.
      A Reuters investigation found that a Canadian federal court ordered major agriculture
      companies—including Bayer, Corteva, BASF, and Cargill—to hand over records in an
      antitrust probe sparked by allegations those companies tried to block FBN from the
      Canadian market by refusing supply in 2018. Canada's Competition Bureau stated it was
      also investigating potential coordinated behavior against FBN. This episode illustrates
      that incumbent input suppliers viewed FBN's direct-to-farm model as a material threat,
      and that regulatory and competitive friction in distribution markets represents a
      structural risk for FBN's channel economics. The GCS spin-off in October 2025 reduces
      revenue from the largest input category and creates separation risk if the inter-company
      commercial agreement weakens. Headcount has declined from an estimated 1,200-plus
      employees at the 2021 funding peak to approximately 850 as of 2025, reflecting
      restructuring-driven cost reduction. None of these actions were accompanied by public
      financial disclosures quantifying cash impact, severance costs, or resulting margin improvement.
