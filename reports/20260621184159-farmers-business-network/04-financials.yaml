  - id: capital-adequacy-and-funding
    title: Capital Adequacy, Funding History, and Runway
    body: >-
      FBN has raised approximately $981 million in total equity capital across twelve rounds
      spanning 2014 through July 2025. The $110 million Series D in late 2017 was led by T. Rowe
      Price and Temasek, bringing total raised to approximately $200 million at that stage.
      A $175 million Series E in January 2019 was led by Kleiner Perkins. The $250 million
      Series F in August 2020 was led by BlackRock, with Bloomberg reporting a post-money
      valuation of approximately $1.75 billion at closing; new investors included Baron Capital,
      Balyasny, and Lupa Systems alongside returning investors. The $300 million Series G in
      late 2021 was led by Fidelity Investments and included ADM Ventures and new financial
      investors, at a valuation reported just shy of $4 billion—more than double the 2020
      Series F price. Reuters reported in early 2022 that FBN was preparing to confidentially
      register for a U.S. IPO targeting an approximately $8 billion valuation; no IPO
      filing materialized and FBN remains private as of June 2026. The most recent raise was a
      $50 million Series G extension in July 2025 from GV, Temasek, Arteqin, Colle Capital,
      and T. Rowe Price, dedicated to AI platform development and marketplace enhancements.
      The post-money valuation for the 2025 round was not publicly disclosed. Cash on hand,
      monthly burn, runway, and debt or credit facility terms are not publicly known. An SEC
      EDGAR full-text search for Form D filings under "Farmers Business Network" returned
      zero results, suggesting filings were submitted under a different legal entity name or
      an alternative exemption. FBN Finance's lending operation requires warehouse credit
      lines to fund loan originations; those credit facility terms and counterparties are
      not publicly disclosed.
