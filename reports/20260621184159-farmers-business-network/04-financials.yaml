    rows:
      - - Marketplace (crop protection)
        - List price claimed ~20% below traditional retail; take rate undisclosed
        - No long-term supply agreements or exclusive terms publicly disclosed
        - Ag distributor gross margin typically 3–8% on crop-protection inputs
        - Not disclosed (company claim only on savings; no margin published)
