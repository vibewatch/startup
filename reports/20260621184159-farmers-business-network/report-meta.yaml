companyProfile:
  summary: >-
    Farmers Business Network (FBN) is a private agtech company founded in 2014 by
    Amol Deshpande and Charles Baron and publicly headquartered in San Carlos, California.
    The company has evolved from a paid farmer-data network into a broader digital
    platform spanning an ag-input marketplace, farm financing, crop marketing,
    sustainability programs, mobile workflows, and the Norm AI agronomy assistant.
    Public evidence shows real operating scale — 120,000+ member farms, roughly
    16,000 active transacting farms, more than 7,200 marketplace products, and nearly
    $3 billion of cumulative financing — plus approximately $981 million of disclosed
    lifetime funding. The core diligence problem is not market relevance but underwriting
    opacity: the public record still does not disclose current revenue, gross margin,
    credit performance, or the valuation terms of the July 2025 financing.
  foundedDate: '2014-01-01'
  founders:
