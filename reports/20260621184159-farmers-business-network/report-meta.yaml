  headquarters: San Carlos, California, USA
  productSummary: >-
    FBN sells a farmer workflow platform that combines direct-to-farm input purchasing,
    marketplace financing, crop-marketing tools, sustainability-program enrollment,
    mobile farm-management utilities, and an AI-assisted agronomy and crop-marketing
    interface.
  customerFocus: >-
    Independent and family-run farms in the United States and Canada, especially row-crop
    and grain operations that value input-price transparency, financing access, and
    integrated digital workflows.
  businessModel: >-
    Membership is free; FBN monetizes through marketplace transactions, financing spreads,
    crop-marketing and sustainability workflows, and adjacent software- and service-led
    farmer activity on the platform.
  stage: Late-stage private company
  fundingStatus: >-
    Public sources show approximately $981 million of lifetime funding, including a
    $300 million Series G in 2021 at roughly a $4 billion post-money valuation and
    a further $50 million raise in July 2025 with valuation undisclosed.
