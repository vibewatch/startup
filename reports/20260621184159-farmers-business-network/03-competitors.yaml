- id: TP004
  title: Moat durability / competitive risk register
  notes: Severity assessed on public-evidence basis only; high = structural competitive threat with evidence of incumbent response or market dynamics undermining the claim; medium = risk present but not yet manifest at scale.
  columns:
  - Moat claim
  - Threat source
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Price-transparency benchmarking (Kelley Blue Seed model)
    - AgDaily adverse coverage of seed-relabeling controversy undermines farmer-ally brand trust; incumbents invest in loyalty programs that reduce price salience
    - High
    - Verify whether seed-labeling practices have been resolved and confirm repeat-purchase rates among price-transparent buyers vs. control group
  - - Aggregated network data advantage
    - Climate FieldView and Granular accumulate farm data at scale from enrolled acres; over time this data could power competitive intelligence that neutralizes FBN's benchmarking edge
    - Medium
    - Assess data-network size (number of farms, acres, crop decisions) and exclusivity of FBN data vs. competitor datasets; verify network effects are compounding not plateauing
  - - Direct-to-farm delivery and logistics
    - Nutrien and CHS operate physical distribution networks that include local delivery; a large incumbent with logistics infrastructure can match convenience if motivated
    - Medium
    - Confirm last-mile delivery unit economics, geographic coverage, and whether FBN has sustainable logistics cost advantage vs. incumbent spot delivery for comparable inputs
  - - Integrated FBN Finance bundling
    - Farm Credit System holds structural GSE cost-of-funds advantage; any rate competition by FBN Finance against Farm Credit requires either scale-based efficiencies or superior convenience premium
    - High
    - Audit FBN Finance loan loss rates, net interest margin, and cost-of-funds; confirm whether bundling with input purchase creates sufficient margin to compete without GSE funding
  - - Independent brand trust and farmer-ally positioning
    - 2023 layoffs (DTN Progressive Farmer) and seed-relabeling adverse press (AgDaily) damaged trust narrative; execution gaps undermine the farmer-ally brand
    - High
    - Request NPS data, churn rates among transacting members, and evidence of brand recovery since 2023 restructuring
  - - Digital-native platform vs. traditional model
    - Nutrien Ag Solutions, Syngenta, and BASF are investing in digital farming tools (Xarvio, Cropwise); over time incumbent digitization reduces FBN's platform differentiation
    - Medium
    - Track incumbent digital-tool adoption rates and whether agronomist-led or digital-led purchasing is shifting among FBN's target farmer segment
