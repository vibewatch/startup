    severity: material
    topic: Nutrien Ag Solutions retail segment revenue and location count 2026
    missingEvidence: The fetched Nutrien retail and Nutrien Ag Solutions pages describe the business model and product range but do not disclose retail-segment revenue, exact location count, or market share data for the 2026 period; the approximately 2,000 location figure is widely cited but not precisely confirmed on fetched pages.
    whyItMatters: Without exact retail revenue and margin data for Nutrien Ag Solutions, it is impossible to size the direct financial threat to FBN or model FBN's addressable share of the incumbent retailer market.
    diligencePath: Request Nutrien annual-report segment data breaking out Nutrien Ag Solutions retail revenue, gross margin, and location count; cross-reference with Nutrien Ltd investor disclosures.
    relatedQuestionRefs:
    - QP004
  - type: missing-source
    severity: material
    topic: CHS agronomy division revenue and market share 2026
    missingEvidence: The fetched CHS about-us and news pages confirm the cooperative's business divisions but do not disclose agronomy-specific revenue, margin, or farmer count for the agronomy segment in 2026; CHS's cooperative structure further limits public disclosure.
    whyItMatters: CHS's agronomy competitive strength is directionally clear but cannot be sized without segment financials, limiting the precision of any market-share analysis for FBN's target farmer segment.
    diligencePath: Request CHS annual report agronomy segment data or cooperative disclosure documents; may require access to CHS member financial statements or third-party cooperative-sector analysis.
    relatedQuestionRefs:
    - QP005
  - type: missing-source
    severity: material
    topic: Publicly disclosed input pricing for incumbent ag-retail competitors
    missingEvidence: None of the fetched official pages for Nutrien Ag Solutions, CHS, Syngenta, BASF, or Granular disclose list prices, per-unit rates, or price-benchmarking tools for their core input products; pricing is advisor-quoted, distributor-mediated, or simply absent from public-facing web surfaces.
    whyItMatters: Without public input pricing, the precise magnitude of FBN's price advantage cannot be independently verified; it is possible that FBN's Kelley Blue Seed tool shows a cost gap that incumbents have since closed through private discount programs not visible on public pages.
    diligencePath: Obtain primary-market pricing data from farmer surveys, independent ag-retail price databases, or retailer contract disclosures; FBN should provide internal price-comparison data showing realized savings for its member farmers versus locally available alternative prices.
