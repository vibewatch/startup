  - - FBN (reference)
    - Digital ag marketplace + finance + data network
    - 120,000+ member farms; nearly $3B in loans originated; ~$981M raised through Series G 2025
    - Independent row-crop farmers seeking cost reduction and data-driven decision support
    - Price-transparency benchmarking, network data, direct-to-farm delivery, integrated FBN Finance
    - Private; exact revenue undisclosed; 2023 layoffs and seed-relabeling controversy signal execution and trust risks
  - - Nutrien Ag Solutions
    - Large-scale ag-input retailer (incumbent)
    - ~2,000 retail locations; parent Nutrien Ltd listed NYSE/TSX (NTR); multi-billion retail revenues
    - Commercial grain farmers and growers across North America and Australia
    - Physical distribution reach, local agronomists, credit relationships, broad product range
    - No public price-transparency benchmarking; advisor-led model with limited digital self-serve marketplace
  - - CHS Inc.
    - Farmer-owned cooperative incumbent
    - Largest U.S. farmer-owned cooperative by revenue; energy, grains, and agronomy divisions
    - Member-farmer cooperatives and commercial producers in the U.S. grain belt
    - Cooperative ownership economics create loyalty; grain, energy, and agronomy bundling
    - Digital-first marketplace not evident; incumbent focus on member relationships over price benchmarking
  - - Climate FieldView (Bayer)
    - Precision-agriculture data platform
    - Tens of millions enrolled acres; backed by Bayer AG (multi-billion ag portfolio)
    - Farmers wanting digital field management, planting prescriptions, and harvest analytics
    - Large enrolled-acre base; FieldView Drive hardware integration; Bayer agronomic ecosystem
    - Does not offer input marketplace; no price-transparency benchmarking; software-only surface
  - - Granular (Corteva)
    - Farm management software (Corteva digital)
    - "Acquired by Corteva (NYSE: CTVA); integrated into Corteva digital farming portfolio"
    - Farmers using Pioneer/Corteva seeds and agronomic inputs seeking operational efficiency
    - Operational farm-management tools; integration with Corteva seed and agronomy data
    - No open input marketplace; no independent price-transparency tool; Corteva brand lock
  - - Syngenta
    - Global crop-science incumbent
    - Privately held by Syngenta Group / ChemChina; multi-billion global revenues
    - Farmers needing branded seed, crop protection, and agronomic advisory
    - Global seed and crop-protection scale; Cropwise digital advisory; established brand trust
    - Traditional distribution model; no transparent farmer-facing marketplace or benchmarking tool
  - - BASF Agriculture
    - Global crop-protection and seeds incumbent
    - BASF SE division; substantial global crop-protection sales; Xarvio digital tools
    - Farmers and distributors needing herbicides, fungicides, insecticides, and specialty seeds
    - Broad crop-protection portfolio; Xarvio digital farm management; global brand scale
    - Sells through distribution channels; no direct-to-farmer price-transparent marketplace
  - - Farm Credit System
    - GSE agricultural lender (incumbent)
    - ">$380B loan portfolio; borrower-owned network of 70+ institutions; Congressional GSE charter"
    - Farmers, ranchers, and cooperatives needing operating, equipment, and real estate loans
    - GSE cost-of-funds advantage; borrower-owned model; largest agricultural lender in the U.S.
    - Financial services only; no input marketplace, data network, or farm intelligence tools
  - - Farmer Mac
    - Secondary-market agricultural lender (GSE)
    - "NYSE: AGM; federally chartered secondary market for ag and rural utilities loans"
    - Lenders and institutions originating agricultural mortgage and rural utilities loans
    - Secondary-market liquidity function; federal charter provides implicit guarantee
    - Not a direct farmer lender; no input purchasing or farm-intelligence surface
  - - Indigo Ag
    - Digital grain and sustainability platform
    - $1.2B+ raised (estimated); Indigo Market grain platform; carbon-credits program
    - Row-crop farmers seeking grain marketing alternatives and sustainability premiums
    - Grain-market access, carbon-credit revenue, microbial seed treatments
    - No seed or crop-protection price transparency; significant layoffs 2022-2023; limited input marketplace
  - - Bushel
    - Digital grain origination technology
    - Raised ~$45-50M (estimated); elevator and farmer digital grain marketing app
    - Grain elevators and farmers needing digital cash-contract and grain-marketing tools
    - Mobile-first grain origination; real-time basis and cash contracts; elevator network
    - Grain only; no input purchasing marketplace; not a direct FBN competitor in seed/CPP
  - - Local co-ops / status quo
    - Relationship-based local input retailer (status quo)
    - Highly fragmented; thousands of local cooperatives and independent dealers
    - Farmers preferring local relationships, in-season credit, and agronomist advice
    - Local presence, credit relationships, established trust, seasonal logistics support
    - Price benchmarking absent; no digital marketplace; margin opacity that FBN exploits
