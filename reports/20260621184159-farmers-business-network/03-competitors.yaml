- id: TP003
  title: Pricing / packaging comparison
  notes: Publicly disclosed pricing is sparse across all competitors; cells reflect what was verifiable from fetched official pages and known business models; Unknown means no public pricing found.
  columns:
  - Competitor
  - Price model
  - Contract / unit
  - Public pricing disclosed
  - Implication for FBN
  rows:
  - - Nutrien Ag Solutions
    - Advisor-quoted pricing at local retail; volume discounts negotiated locally
    - Per unit (seed bag, gallon, ton); seasonal pre-pay programs
    - Not disclosed on fetched pages; pricing is relationship- and location-specific
    - FBN can potentially undercut on commodity inputs where incumbent margin is visible; relationship moat limits reach
  - - CHS
    - Cooperative member pricing; internal co-op economics
    - Co-op patronage dividend; per-unit commodity pricing
    - Not disclosed publicly; co-op structure obscures external pricing
    - Co-op loyalty reduces price sensitivity among members; FBN appeal limited to cost-conscious independents
  - - Climate FieldView
    - Freemium + paid subscription; hardware add-on for FieldView Drive
    - Per-acre subscription (reported ~$8–15/acre for premium); hardware one-time purchase
    - Limited public pricing; general subscription model described on site
    - Not a direct input pricing competitor; FieldView's farm-data value competes with FBN''s data layer
  - - Granular (Corteva)
    - Subscription farm-management software; bundled with Corteva agronomic services
    - Per-operation subscription; exact pricing not publicly listed
    - Not publicly disclosed on fetched app page
    - Competition in farm-data relationship, not input pricing; Corteva bundling may reduce FBN adoption
  - - Farm Credit System
    - Floating and fixed agricultural loan rates; borrower-owned co-op economics
    - Per-loan rate; operating lines, equipment loans, real estate mortgages
    - Rates published by member institutions but not aggregated publicly
    - Structural GSE cost-of-funds advantage means FBN Finance must compete on convenience and bundling, not pure rate
  - - Indigo Ag
    - Grain market brokerage; carbon credit premium; subscription agronomic services
    - Per-bushel brokerage; carbon credit per-acre payment
    - General descriptions available; exact brokerage fees not disclosed
    - Indigo''s grain and carbon premium model targets farmers FBN also addresses; limited direct input pricing overlap
  - - Bushel
    - SaaS license to grain elevators; farmer-facing mobile access via elevator
    - Per-elevator or per-location license; not disclosed publicly
    - Not publicly disclosed on fetched pages
    - Bushel's elevator partnership model could limit FBN''s grain-commerce reach if elevators prefer Bushel exclusivity
  - - BASF Agriculture
    - Distributor-mediated pricing; Xarvio subscription for digital tools
    - Per-unit crop protection; per-acre Xarvio subscription
    - Distributor pricing not publicly listed; Xarvio pricing available via contact
    - No direct price-transparency competition; BASF sell-through model supports FBN marketplace as a channel
