companyProfile:
  summary: >-
    Farmers Business Network (FBN) 是一家私营农业科技公司，由 Amol Deshpande 和 Charles Baron 于 2014 年创立，公开总部位于加州 San
    Carlos。公司从付费农民数据网络，扩展为覆盖农资市场、农场融资、作物营销、可持续发展项目、移动工作流和 Norm AI 农艺助手的综合数字平台。公开证据显示，FBN 已有真实运营规模：120,000+ 成员农场、约 16,000
    个活跃交易农场、超过 7,200 个市场商品、累计融资近 $3 billion，以及约 $981 million 的已披露累计融资。核心尽调问题不是市场相关性，而是承销不透明：公开记录仍未披露当前收入、毛利率、信贷表现，或 2025
    年 7 月融资的估值条款。
