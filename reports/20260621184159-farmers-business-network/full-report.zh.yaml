  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、定义与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              FBN
              的相关市场，由北美独立商业农场经营者的采购和融资决策界定——这些经营者不在合作社采购安排内，因此要自行承担市场化农资价格。纳入范围的主要产品类别包括作物保护化学品（除草剂、杀菌剂、杀虫剂）、肥料和土壤改良剂、大宗种子（玉米、大豆、小麦、棉花），以及农业金融服务全套产品，包括运营贷款、农作物保险和设备融资。2025
              年，美国农业投入品市场在这些类别上的规模估计约 $140 billion，其中肥料和种子市场构成锚点（仅种子 2026 年约 $18.7 billion），作物保护板块约 $14–$16
              billion，其余来自服务和专用投入品。


              FBN 市场的现状替代方案，是传统农业投入品经销商和农场合作社。这些既有渠道处理了约 70–80% 的美国农场投入品采购，提供批量折扣、农艺服务和信用条款。合作社成员农场拿到的投入品价格通常比独立农民零售价低
              20–30%，这正是 FBN 的核心价值主张：靠透明的批量采购缩小这道价差。与 FBN 相关但目前不在其主要范围内的相邻市场，包括特色园艺、畜牧饲料和大型机械设备；其中大型机械设备在 2025 年 Global
              Crop Solutions (GCS) 剥离后，被排除在 FBN 核心市场之外，因为该剥离收窄了 FBN 的作物保护供给，聚焦大宗投入品。


              农作物保险市场是重要的相邻 SAM。FBN 于 2021 年推出保险代理业务，争夺美国联邦农作物保险年度保费中超过 $10 billion 的一部分。金融服务——包括运营授信和土地贷款——补齐了可服务边界，FBN
              Finance 瞄准的是流出 Farm Credit System 补贴网络之外、规模约 $20–$30 billion 的商业农场借贷板块。
