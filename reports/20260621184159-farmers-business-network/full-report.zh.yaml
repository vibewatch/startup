      - number: '5.2'
        title: 运营架构与依赖模型
        blocks:
          - type: paragraph
            body: >-
              公开材料暗示 FBN 采用分层运营模型。最上层是面向农民的网页和移动客户端。其下是针对商业、作物营销和金融的具体工作流应用。谷物营销部分依赖基于 Gradable
              的买家集成和手机号验证；商业部分依赖卖家入驻、上架、库存、定价和订单处理工具；金融部分则位于同一账户体系内，而不是外置。2025 年 10 月 GCS 剥离显著改变了这一架构：FBN
              选择掌握市场需求、融资和数字工作流的控制平面，GCS 则承担更多作物保护注册和供应链负担。这应当让 FBN 更像软件公司，也降低库存负担。代价是依赖不透明：公开来源没有量化过渡服务、残余运营耦合、API
              深度或平台级可靠性承诺。
