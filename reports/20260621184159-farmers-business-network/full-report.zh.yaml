  - id: TU001
    title: 客户细分表
    columns:
      - 细分
      - 买方 / 用户 / 付款方
      - 主要使用场景
      - 公开规模 / 证明
      - 收入 / 战略价值
      - 缺口
    rows:
      - - 免费会员农场
        - 买方 = 用户 = 付款方通常是农场经营者或家族企业
        - 获取价格透明、基准、社区和购物入口
        - 免费会员；首页披露 120,000+ 会员，2025 年新闻稿披露 117,000+ 农场
        - 建立宽阔漏斗顶端和数据网络，FBN 后续可变现
        - 没有按农场规模、作物组合或参与层级公开拆分
      - - 投入品市场交易用户
        - 买方 = 用户 = 付款方是采购投入品的运营农场
        - 在线订购作物保护、营养、种子、畜牧和用品
        - 2024 年披露约 16,000 名交易农户；2023 年 33,000 次交付；首页显示累计交付 100,000+ 次
        - 核心商务收入层，也是重复季节性支出的最强路径
        - 没有当前 2025/2026 活跃交易数或购买频率同期群
      - - 金融用户
        - 借款方是农场；付款方是收获后的农场
        - 投入品贷款和运营资金匹配季节性现金流
        - 累计融资近 $3 billion，并推出 2026 年投入品融资促销
        - 提高钱包份额，并帮助转化原本可能留在线下的大额订单
        - 没有披露违约、续贷或重复借款人指标
      - - 作物营销用户
        - 农场出售粮食，同时用 FBN 工具监控报价和合同
        - 通过作物营销工具查看报价、管理合同、票据和付款
        - 经纪、粮食买家连接和应用工作流是公开的，但用户数不是
        - 在采购之外增加下游变现
        - 没有披露营销用户的客户数、交易量或留存
      - - 可持续 / Gradable 种植者
        - 农场经营者登记英亩数并分享生产数据；粮食买家为下游需求出资
        - 覆盖作物、较低碳强度和再生实践可赚取溢价
        - 20,000+ 农户用户、12M+ 英亩、200M+ 蒲式耳评分、$30M+ 年度激励
        - 这是 FBN 能把同一农场扩展到溢价项目和买家关联需求的最佳证据
        - 没有披露按地区划分的项目参与度和跨年留存
      - - 加拿大草原地区种植者
        - 同样是农场层面的买方 / 用户 / 付款方模型，但物流和产品宽度因国家而异
        - 投入品、融资和可持续项目按加拿大条件定制
        - Saskatchewan 具名证言，加上 2026 年加拿大产品组合扩展和新配送中心
        - 平台伸出美国中西部，并加深北美覆盖
        - 与核心美国行作物版图相比，公开证明仍轻得多
    notes: 细分按变现层和地理组织，因为 FBN 没有发布按农场规模、收入带或垂直领域划分的清晰客户分类。
