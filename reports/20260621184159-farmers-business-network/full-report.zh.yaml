  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 经营假设
      - 估值逻辑
      - 概率信号
      - 关键下行或上行触发因素
    rows:
      - - 牛市
        - FBN 证明年收入 $500M+、混合毛利率健康、金融业务损失率低，并且市场平台、保险和 AI 之间的 attach 黏性强。
        - 对类似软件、高增长的混合变现按约 6-8x 估值，得到 $3.0B-$4.0B。
        - 需要私有证据证明，FBN 更像规模化垂直软件市场平台，而不是周期性农业分销商。
        - 经审计收入、分部利润率，以及接近或达到历史估值的定价一级或二级市场标记。
      - - 基准
        - FBN 证明收入 $250M-$400M，市场平台 / 金融科技经济性混合，利润率中等，并在农场下行周期中持续但放慢增长。
        - 对混合市场平台 / 金融科技模型按约 3-5x 估值，得到 $0.75B-$2.0B。
        - 最符合今天的公开记录：规模真实、产品真实，但定价证明不完整。
        - 数据室确认变现质量，但没有证明类似软件的利润率。
      - - 熊市
        - 收入明显低于预期，金融经济性走弱，可转债定价重置估值，或出现平轮 / 下轮。
        - 参照受困 agtech 类比，并下调公开可比公司的置信度，得到 $0.2B-$0.8B。
        - 与数字农业平台快速失去投资人支持的板块结局一致。
        - 定价可转债、下轮，或借贷和市场平台运营的单位经济性差。
    notes: |
      这些区间是示意性估算，不是已报告的市场标记。锚点来自公开可比公司区间、不利 agtech 结局，以及 FBN 不公开披露当前收入这一具体证据缺口。
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV042
      - CV046
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标 / 状态
      - 倍数 / 估值
      - 与 FBN 的相关性
      - 局限
    rows:
      - - AGCO
        - 上市农业设备和服务龙头
        - 2026 年 6 月市值 $8.22B；FY2024 收入 $11.662B；市值 / 收入约 0.70x
        - 当经济性偏周期、硬件占比高时，大型农业平台在公开市场的估值水平。
        - 机械业务占比高得多，且上市公司经济性已披露。
      - - CNH Industrial
        - 上市农业和工程设备公司
        - 2026 年 6 月市值 $12.96B；FY2024 收入 $19.836B；市值 / 收入约 0.65x
        - 为广义农业分销和设备敞口提供低倍数公开基准。
        - 不是软件优先的市场平台；资本强度和产品组合不同。
      - - Trimble
        - 有农业敞口的上市垂直软件 / 工业技术公司
        - 2026 年 6 月市值 $11.45B；FY2024 收入 $3.683B；市值 / 收入约 3.11x
        - 更能代表公开市场为数据、工作流和软件赋能工业工具支付的价格。
        - 终端市场更广，披露也优于 FBN。
      - - Farmers Edge
        - 2024 年 3 月私有化的数字农业平台
        - 私有化价格 C$0.35 / 股；Economic Times 称该交易较 IPO 价格低 98%
        - 数字农业股权在增长和市场支持减弱时如何压缩的直接警示参照。
        - 自身执行问题和公开市场历史，使它更像结局可比，而不是干净的倍数可比。
      - - AppHarvest
        - 2023 年 7 月申请 Chapter 11 的受控环境农业公司
        - 12 个债务人；破产期间约 $30M DIP 融资
        - 说明激进 agtech 叙事在资本强度跑赢经济性时会怎样失败。
        - 商业模式不是市场平台或金融平台。
      - - Indigo Ag / Gro 群组
        - 承受融资压力的私有数字农业群组
        - Economic Times 称 Indigo 从接近 $4B 跌至约 $200M，Gro Intelligence 当时正在关闭
        - 表明即使是知名平台，私有 agtech 估值也可能大幅重置。
        - 基于媒体且覆盖不完整，并非公司申报的当前估值标记。
    notes: |
      覆盖范围有意保持不完整：公开可比公司有当前市值，但私有数字农业同行很少披露当前估值。市值 / 收入使用 2026 年 6 月市值和抓取的市场数据来源引用的最新公开年度收入。
    enumerationScope:
      coverage: partial
      basis: >-
        Mixed public and outcome comparable set compiled from June 2026 market-data pages plus 2023-2026 public outcome
        reporting for digital-ag peers.
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
