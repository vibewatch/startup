      - number: '1.2'
        title: 管理层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              FBN 由 Amol Deshpande 和 Charles Baron 于 2014 年联合创立。Deshpande 拥有 Cornell MBA，曾任 Kleiner Perkins 合伙人，自创立起担任
              CEO，直到 2023 年末卸任。Devin Lammers 曾任临时 CEO，随后 Diego Casanello 于 2024 年 3 月 1 日接任正式 CEO。Casanello 拥有 30
              多年农业和管理经验，曾任 Arysta Life Science Inc. CEO、UPL Ltd. COO，并在 BASF 担任高管，还曾是 Vidavo Ventures 管理合伙人。联合创始人
              Charles Baron 继续担任首席产品与营销官。更广泛的领导团队包括 CFO Guillaume Luebke、首席人力资源官 Shawntrell Scales，以及区域副总裁 Candace
              Wilson。CEO 从创始人 Deshpande 交棒给 Casanello 这类职业管理层，是一次重要治理演进，也发生在战略重组期。GV (Google Ventures)、Temasek、T. Rowe
              Price 和 Fidelity 等关键投资人很可能拥有董事会代表席位，但这家私营公司的董事会构成细节未公开披露。
