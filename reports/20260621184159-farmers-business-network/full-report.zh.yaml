      - number: '4.4'
        title: 重组、负面事件与财务压力信号
        blocks:
          - type: paragraph
            body: >-
              2022 年以来，FBN 出现了多个财务压力指标。DTN 2023 年 9 月报道称，FBN 裁撤部分员工并计划新的子公司结构，释放出降本和战略再聚焦信号，与一家承受利润率压力的公司相符。FBN 还停止了通过收购
              Farmsave 启动的澳大利亚业务，意味着国际扩张带来减记或搁浅资产成本。联合创始人 Amol Deshpande 向 Diego Casanello 这类职业管理层交接 CEO 职位，于 2024 年 3
              月生效，代表一次治理重组，通常与投资人驱动的业绩要求有关。Reuters 调查发现，加拿大联邦法院曾命令 Bayer、Corteva、BASF 和 Cargill
              等大型农业公司移交记录；该反垄断调查源于这些公司被指 2018 年试图通过拒绝供货阻止 FBN 进入加拿大市场。加拿大 Competition Bureau 表示，也在调查针对 FBN
              的潜在协同行为。该事件说明，既有投入品供应商把 FBN 的面向农场直送模式视为实质威胁，而分销市场中的监管和竞争摩擦构成 FBN 渠道经济性的结构性风险。2025 年 10 月 GCS
              剥离，减少了来自最大投入品品类的收入；如果公司间商业协议走弱，也会带来分离风险。员工人数从 2021 年融资高峰时估计 1,200+ 人，降至 2025 年约 850
              人，反映重组驱动的降本。上述行动均未伴随公开财务披露，因此无法量化现金影响、遣散成本或由此带来的利润率改善。
            claimRefs:
              - CI023
              - CI024
              - CI025
              - CI026
              - CI027
              - CI028
      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              FBN 的财务画像同时有真实规模信号和根本性不透明，后者阻止了标准承销。已确认的规模信号包括：来自蓝筹机构投资人的 $981 million 股权融资、FBN Finance 近 $3 billion
              累计贷款、覆盖 187 million 英亩的 117,000+ 成员农场，以及通过 Gradable JV 与 ADM 建立的战略合作。这些信号确认，FBN
              已搭起一个可防守的农业平台，具备有意义的网络效应、多元产品组合，以及可与中型专业农业贷款机构相比的放款量。不透明同样真实：FBN 从未披露收入、毛利率、EBITDA、现金烧钱额或资金续航。2025
              年投后估值未宣布，无法判断 $50 million 融资是在 2021 年 $4 billion Series G
              价格之上、持平还是之下——因此可能存在未披露的平轮或降价轮情形。三个结构性财务风险无法用公开证据解决：（1）农业投入品市场转售的低抽佣率经济性，（2）作物保护库存带来的营运资本强度，GCS
              已部分缓解但没有消除，（3）FBN Finance 近 $3 billion 贷款账本中的信贷风险，且没有逾期率或损失率数据。FBN 最可能的财务画像，是一家仍在烧钱、在 FBN Finance
              和自有品牌产品上产生正向利润率、但在大宗投入品转售上利润率很薄甚至为负的公司。这一组合与成长阶段的市场型金融科技公司相符，但没有管理账、审计财务和 FBN Finance 信贷表现数据，就无法承销。
