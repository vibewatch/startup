      - number: '7.4'
        title: 人员、重组与 AI 执行风险
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，这家公司靠反复调整结构来厘清战略。创始人 Amol Deshpande 2023 年离任后，领导层快速更替：John Vaske 年内离开，Devin Lammers 临时接任，之后 Diego
              Casanello 上任，推动纯技术平台和 AI 议程。这些过渡伴随裁员、设施关闭、因成本取消 2023 年 Farmer2Farmer 活动、退出 Australia，以及组合简化，包括 GCS
              分拆和更早的保险业务剥离。Built In 的 2026 年员工向摘要不是经审计的公司披露，但方向上有用，因为它们反复提到沟通缺口、信任问题、优先级摇摆，以及这次再聚焦期间日常稳定性偏低。执行负荷更重，是因为
              FBN 2025 年融资明确绑定了 AI 工具和 Norm 等市场增强功能。如果 AI 推出质量不及预期，或自上而下重置的速度继续快过团队吸收能力，FBN
              可能失去部分服务一致性和信任，而这些正是它把庞大会员基础转成重复高利润活动所需要的。
