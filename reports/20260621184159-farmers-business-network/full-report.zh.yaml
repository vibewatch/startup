chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、商业模式与使命
        blocks:
          - type: paragraph
            body: >-
              Farmers Business Network (FBN) 是一家私营农业科技公司，总部位于加州 San Carlos，主要办公室还设在伊利诺伊州 Chicago。FBN 成立于 2014
              年，定位为农民对农民的数字网络和一体化电商市场平台。公司公开使命是「make family farms more profitable as the farmer's
              copilot」，为农资、融资资本和农场智能服务提供一站式入口，并由面向农场的最后一公里直送支撑。FBN 的商业模式有三根支柱：（1）数字电商市场，提供 7,200+
              个产品，覆盖作物保护、肥料、种子、畜牧用品和设备，目标价格比传统线下零售低 20%；（2）FBN Finance，提供运营贷款、土地贷款和设备融资，累计发放贷款近 $3
              billion；（3）基于成员网络汇总匿名数据和 AI 工具的农场智能，其中包括 Norm——用于农艺和作物营销问答的大语言模型。会员免费；公司约三年前从付费订阅转向免费模式，注册量因此翻倍。在 120,000+
              成员中，约 16,000 个会通过采购、融资或 Gradable 可持续发展平台活跃交易。
