      - number: '5.3'
        title: AI、数据与移动执行
        blocks:
          - type: paragraph
            body: >-
              Norm 和移动 app 是最清晰的证据，说明 FBN 正试图把交易型市场变成农场决策的日常操作系统。Norm 的公开描述值得注意，因为它没有被包装成通用聊天机器人：FBN
              称模型以农艺博客、分析、产品标签、Seed Finder 数据、USDA 信息，以及天气或土壤上下文为基础。这给了助手一个特定领域检索故事，后来又由 2024
              年专利申请加强。在移动端，公开功能集对农资平台来说异常宽：价格查询、直接下单、谷物报价、合同、过磅单、结算、EVI 影像、田间笔记和社区入口都在一个 app 里。Apple 2026 年 5 月发布说明显示
              app 仍在活跃维护，但公开证据对功能宽度的支撑，仍强于对实际产品质量或生产可靠性的支撑。
