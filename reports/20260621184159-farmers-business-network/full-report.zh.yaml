  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业牵引力
        blocks:
          - type: paragraph
            body: >-
              FBN 运营多支柱收入模式，建立在三条主业务线上：（1）FBN Direct，一个面向农场直送的电商市场，提供 7,200+ 个产品，包括作物保护、肥料、种子、设备和畜牧用品，声称价格较传统线下零售约低
              20%；（2）FBN Finance，一个技术赋能贷款部门，为每个农场发放最高 $1 million 的循环运营授信、土地贷款和设备融资；（3）数据和智能服务，如今通过免费会员模式交付，而不是付费订阅。FBN
              从付费订阅转向免费会员——据称这一动作让会员注册量翻倍——用直接订阅收入换取更大的市场交易量。截至 2025 年中，FBN Finance 已突破 $1 billion 的运营授信融资，并向农民累计发放近 $3
              billion 贷款。2023 年，FBN 完成 33,000 次面向农场直送，并通过 Gradable 平台支付 $22 million 溢价；Gradable 是 FBN 与 ADM
              的合资公司，连接谷物买家和再生种植作物。FBN 还推出了 17 个自有品牌生物制品、谷物交易工具，以及面向生物制品的农场端 R&D 网络，为核心市场收入流增加相邻业务。2025 年 10 月剥离 Global
              Crop Solutions (GCS)，把作物保护库存从 FBN 资产负债表中分离出去；GCS 继续根据商业协议通过 FBN 市场销售，既保留农民入口，又降低 FBN 的营运资本强度。按 2025 年 7
              月融资公告，FBN 成员基础超过 117,000 个农场，覆盖 187 million 英亩。
