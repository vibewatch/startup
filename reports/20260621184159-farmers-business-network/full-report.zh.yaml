      - number: '3.2'
        title: 有规模的投入品既有玩家与作物科学巨头
        blocks:
          - type: paragraph
            body: >-
              在实体渠道中，Nutrien Ag Solutions 是最直接的有规模既有竞争者。公司在北美和澳大利亚运营约 2,000
              个零售网点，作为全服务作物投入品零售商，提供种子、作物保护、肥料、营养品和生物制品。其服务包括由本地农艺师提供的农艺建议、精准农业工具和作物保护专业能力——这种模式形成了个人关系和信用安排，FBN
              必须靠价格节省和数字便利性来突破。CHS Inc. 是美国按收入计最大的农民所有合作社，通过农艺部门竞争，同时还有谷物、能源和食品业务；合作社所有权模式给成员农民经济激励，使其把采购集中在
              CHS，其他地方的纯价格节省只能部分抵消这一激励。Syngenta 和 BASF 代表另一条竞争轴：它们通过传统分销链供应种子和作物保护产品，推出 Syngenta 的 Cropwise 平台、BASF 的
              Xarvio 等数字农业工具，但通常不提供 FBN 所营销的那种市场价格透明。上述既有玩家都没有发布公开价格基准，让农民像使用 FBN 曾尝试的 Kelley Blue Seed 式工具那样核验跨市场价格竞争力。
