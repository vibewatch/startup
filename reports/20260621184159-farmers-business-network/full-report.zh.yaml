        - 扩大 FBN 的 NORM 顾问触达和数据货币化潜力；区别于纯电商
        - NORM 的活跃用户基数是多少，转化为付费产品或市场采购的比例是多少？
      - - 农资价格透明需求
        - 驱动因素
        - 持续
        - FBN 的基准定价数据推动全网会员获取和留存
        - FBN 会员中，实际交易者占比多少，仅用平台做价格基准比较者占比多少？
      - - 再生农业和可持续激励
        - 驱动因素
        - 2024–2028
        - 通过与 ADM 的 Gradable 合资公司，为可持续积分和溢价打开新市场
        - Gradable 目前登记英亩数、每英亩溢价和收入运行率是多少？
      - - 作物保护品关税扰动（2026）
        - 驱动因素 / 约束
        - 2026 年近期
        - 短期为 FBN 直销模式创造采购机会；若国内供应受限，长期仍不确定
        - FBN 化学品库存中，国内采购与进口各占多少？
      - - 农场整合减少买家数量
        - 约束
        - 持续
        - 缩小总可触达买家数；采购权转向拥有直接供应商议价能力的大型经营者
        - FBN 目标细分中，商业农场的年流失率是多少？
