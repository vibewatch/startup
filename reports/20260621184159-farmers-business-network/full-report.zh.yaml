        title: 商业模式证明与不利行业背景
        blocks:
          - type: paragraph
            body: >
              支持估值的最强证据是广度，而不是财务透明。FBN 已经发放农场营运额度，推出作物保险，扩展 AI

              辅助农艺支持，并通过与 ADM 的 50-50 Gradable 合资公司加深可持续变现。官方和独立来源都显示产品外延真实：到 2024 年 3 月，营运额度融资超过 $1 billion，到 2025 年 7
              月累计接近 $3 billion；CropLife 显示 FBN 销售有联邦补贴、用数据支持风险选择的作物保险；ADM 称

              Gradable 已服务超过 20,000 名农民、覆盖 12 million 英亩。这些资产创造了选择权，但也抬高了举证门槛，因为 FBN

              已不再是一个狭窄的软件故事。市场、信贷、保险和 AI 业务各自有不同的利润率、风险和监管画像。不利背景很重要：Economic Times 2026 年 6 月报道，Indigo Ag 的估值已从近 $4
              billion 跌至约 $200 million，Farmers Edge 以低于 IPO 价格 98% 的价格私有化，Gro Intelligence 正在关闭，FBN
              自身也经历了领导层离职、裁员，以及据称未定价的短期可转债。行业证据让静态的 2021 式估值标尺更难在没有当前单位经济的情况下自圆其说。
