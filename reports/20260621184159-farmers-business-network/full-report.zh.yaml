        - 需要除草剂、杀菌剂、杀虫剂和特色种子的农民与分销商
        - 作物保护组合广；Xarvio 数字农场管理；全球品牌规模
        - 通过分销渠道销售；没有直面农民、价格透明的市场
      - - Farm Credit System
        - GSE 农业贷款方（既有厂商）
        - '>$380B 贷款组合；借款人所有的 70+ 家机构网络；国会 GSE 特许'
