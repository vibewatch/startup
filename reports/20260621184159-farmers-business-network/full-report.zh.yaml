              detail: 公开记录称复购创下纪录，但没有给出具体比例。
            - label: 中等
              tone: neutral
              detail: 证据来自公司当前发布内容和工作流页面。
            - label: 强
              tone: positive
              detail: 已保存清单、订单历史和配送运营，都指向一个真实运行的生产级交易平台。
            - label: 弱
              tone: warning
              detail: NRR、GRR、流失率和头部客户集中度仍未披露。
