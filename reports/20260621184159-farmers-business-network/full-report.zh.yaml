        - 约束
        - 结构性
        - FCS 受 GSE 式特许支持，资金成本低，补贴性利率从结构上限制 FBN Finance 的价格竞争位置
        - FBN Finance 平均运营贷款利率与 FCS 基准利率相比如何？
      - - 既有供应商渠道控制
        - 约束
        - 结构性
        - Bayer、Corteva、Syngenta 管理经销商关系以限制去中介化；可能约束 FBN 的产品采购
        - FBN 的供应商排他条款是什么，哪些化学品品牌可通过其市场购买？
      - - 小型农场的数字化采用障碍
        - 约束
        - 中期
        - 限制 FBN 平台在最广可触达市场细分中的渗透和货币化
        - FBN 主要农业区域的连接率和智能手机采用率是多少？
    notes: 驱动因素和约束综合自 FBN 公开披露、USDA 监管数据、AgFunder 报道，以及截至 2026 年中期覆盖美国 agtech 和农资市场的 第三方市场分析师来源。时点评估是基于可观察市场信号的定性判断，不是前瞻性预测。
