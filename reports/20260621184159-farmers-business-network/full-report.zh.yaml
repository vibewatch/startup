      - number: '1.4'
        title: 规模、运营与地域布局
        blocks:
          - type: paragraph
            body: >-
              FBN 主要在北美运营，服务美国和加拿大农民。网络覆盖 120,000+ 成员农场，合计约 185+ million 网络英亩。2023 年，FBN 完成 33,000 次农资配送，提供 $1 billion
              融资，并通过 Gradable 可持续发展平台（与 ADM 的合资公司）支付 $22 million 溢价。2023–2025
              年，公司经历了多轮裁员，员工规模明显收缩。作为战略再聚焦的一部分，澳大利亚国际业务已停止。员工人数估计约 850 人，低于此前高点。2025 年 10 月，FBN 将作物保护业务剥离为独立公司 Global
              Crop Solutions (GCS)，以推进轻资产、市场驱动的模式。FBN 仍保留仓储和物流基础设施，支撑其面向农场的直送服务；FBN Canada 还在扩张，计划 2026 年开设两个新配送中心。
