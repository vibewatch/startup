      - number: '3.4'
        title: 农业金融竞争者
        blocks:
          - type: paragraph
            body: >-
              Farm Credit System 是一张由政府支持企业金融机构组成的网络，为农民、牧场主和农业合作社提供信贷和金融服务。Farm Credit 机构由国会设立，借款人所有，并因 GSE
              融资优势而拥有低于私营部门贷款人的资金成本。其贷款组合超过 $380 billion，是美国最大的农业贷款机构，也是 FBN Finance
              在农场运营贷款、设备融资和房地产贷款上最具结构优势的竞争者。在利率敏感环境中，Farm Credit 的竞争优势尤其尖锐，因为 GSE 身份让它能进入任何私营农业金融科技公司都很难复制的融资市场。Farmer
              Mac (Federal Agricultural Mortgage Corporation) 在 NYSE 上市，代码 AGM，是面向农业和农村公用事业贷款的联邦特许二级市场机构。Farmer Mac
              购买并担保农业抵押贷款，为农业信贷市场创造流动性，而不是直接向农民发放贷款；相较 FBN Finance 的发放模式，它更偏互补，而不是直接竞争。USDA Economic Research Service
              数据确认，农场业务费用和收入波动持续推高对可负担融资工具的需求，支撑了一个命题：任何能提供有竞争力利率和便捷入口的贷款人，都有机会从既有银行和合作社手中拿到份额。
