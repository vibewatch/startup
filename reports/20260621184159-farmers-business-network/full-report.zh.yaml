  - id: TV005
    title: 论点破裂与否决触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 收入披露低于隐含门槛
        - 确认收入明显低于 $250M，或贡献利润率太薄、不足以支撑混合平台倍数
        - 连基准情景也会失效，并意味着名义估值主要是历史沿用。
        - 从继续研究转向按历史价格回避。
      - - 定价可转债或新一轮重置价值
        - 可转债定价或新股权融资价格明显低于 $3.8B
        - 确认私募市场不再认可供应商沿用的名义估值。
        - 将估值工作重置到新标记，并重跑情景表。
      - - 金融经济性走弱
        - 信贷损失、资金成本压力或监管约束损害借贷引擎
        - 削弱 FBN 的关键相邻变现之一，并压缩混合利润率。
        - 承销时将金融视为拖累，而不是溢价功能。
      - - 会员增长停滞，同时产品宽度扩张
        - 会员 / 英亩持平，或 AI、保险和市场平台交叉销售采用偏弱
        - 表明产品宽度没有转化为更深变现或护城河。
        - 下调牛市情景信心，并收紧倍数假设。
      - - 合作关系或 AI 风险问题浮现
        - ADM / Gradable 经济性不及预期，或 AI 驱动的工作流给金融运营带来模型、偏见或第三方风险
        - 会同时降低战略上行和融资、顾问产品所需的信任。
        - 提高风险评级，并在任何投资前要求更严格的控制尽调。
    notes: |
      触发阈值是分析框架，不是公司报告的指引。目的在于建立可监控的否决标准，并让它们直接连到估值支撑。
    claimRefs:
      - CV010
      - CV012
      - CV016
      - CV017
      - CV039
      - CV040
      - CV048
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 确认收入、ARR（若适用）、抽成率，以及市场平台、金融、保险和软件 / AI 的分部结构。
        - 这是检验 $3.8-4.0B 名义估值与任何公开可比公司是否匹配所缺失的分母。
        - 管理层数据室，包含历史和当前月度财务数据。
      - - 单位经济性
        - 毛利率、贡献利润率、按产品线拆分的 CAC 或销售效率，以及留存或复购指标。
        - 决定 FBN 应拿类似软件还是类似分销的倍数。
        - 金融、市场平台和运营复盘，配 cohort 表。
      - - 信贷风险和资金结构
        - 净核销、资金伙伴、仓储额度、久期错配，以及对农场下行周期的敏感性。
        - 融资可以增加溢价价值，也可能成为最快的下行通道。
        - 信贷备忘录审阅，以及贷款人或仓储融资额度尽调。
      - - 股权结构和优先权
        - 优先权堆栈、高级权利、清算优先权，以及任何短期可转债的定价条款。
        - 名义企业估值可能大幅高估普通股价值。
        - 律师审阅的股权结构表和最新融资文件。
      - - 二级或一级市场标记
        - 有方法论的独立 2026 年交易、要约、定价可转债或共同基金估值标记。
        - 可以用真实市场出清信号替代过时的供应商沿用估值。
        - 投资者关系请求，加上二级经纪或基金估值标记外联。
      - - AI / 控制环境
        - 模型治理、偏见控制、第三方供应商控制，以及 AI 如何介入融资或保险决策。
        - AI 可以改善变现，也会在借贷工作流中制造安全、合规和信任风险。
        - 与数据科学、风险和合规负责人开展运营尽调。
    notes: |
      这些要求是定价决策的前置条件，不是可有可无的后续问题。没有它们，公开记录无法区分高溢价垂直平台和被过度沿用估值的后期私有标的。
    claimRefs:
      - CV040
      - CV041
      - CV046
      - CV048
      - CV049
