      - number: '5.5'
        title: 信任控制与产品技术风险
        blocks:
          - type: paragraph
            body: >-
              FBN
              最强的公开信任材料是政策披露，而不是独立认证。隐私政策详细而明确：公司不会出售用户数据，用户可以管理共享权限，买方合作伙伴不能看到无关的农民添加账户数据。对一个混合商业、贷款、谷物营销、位置信号和移动使用遥测的平台来说，这些都是有建设性的控制表述。同时，同一政策也明确，FBN
              无法保证完全安全，并会在通知用户未经授权访问前先开展调查。这是正常法律保留，但在这里很重要，因为平台似乎统一了农业、金融和个人数据。公开产品技术尽调还受到几项限制：app 评价深度不足、缺少公开 API
              参考，以及围绕 Norm 和 GCS 后运营模型的公开 uptime、SLA、benchmark 或过渡服务文件缺位。
