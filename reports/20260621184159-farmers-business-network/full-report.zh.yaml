      - number: '8.3'
        title: 可比区间、情景与偏高评估
        blocks:
          - type: paragraph
            body: >
              公开可比公司只能给出粗略区间，但即便这个粗略区间也让头条价格显得不舒服。AGCO 市值约 $8.22 billion，对应 2024 年收入 $11.66 billion；CNH 约 $12.96

              billion，对应 $19.84 billion；Trimble 约 $11.45 billion，对应 $3.68 billion，市值 / 收入约为 0.65x、0.70x 和 3.11x。FBN 比
              AGCO 或 CNH 更偏软件和服务赋能，但也更不透明、结构风险更高，因为当前收入、亏损情况、信贷表现和股权结构都未披露。照公开可比区间直算，$3.8-4.0 billion 估值需要类似 $1.2
              billion 收入且达到 Trimble 式软件质量，或在设备式倍数下超过 $5.5 billion 收入。由于公开证据没有披露收入分母，唯一可辩护的方法是情景分析。多头情景下，如果 FBN
              证明跨市场、融资、服务和软件的耐久混合高利润变现超过 $500M，并适用 6-8x 倍数，估值可达约 $3.0-4.0 billion。基准情景 $0.75-2.0 billion，适合一个混合市场 /
              金融科技画像，收入 $250M-$400M、倍数 3-5x。空头情景 $0.2-0.8 billion，符合下轮降价、可转债重定价或困境 agtech 结果。以今天的公开证据看，头条估值更像被拉伸，而不是被支撑。
