        - GSE 资金成本优势；借款人所有模式；美国最大农业贷款方
        - 仅金融服务；没有农资市场、数据网络或农场智能工具
      - - Farmer Mac
        - 二级市场农业贷款方（GSE）
        - 'NYSE: AGM；联邦特许的农业和农村公用事业贷款二级市场'
