      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，FBN 通过 12 轮融资累计筹集约 $981 million。融资轨迹从 2014–2015 年 Kleiner Perkins、DBL Partners 和 GV
              的早期支持起步，随后通过多轮成长轮放大。2020 年 Series F 融资 $250 million，BlackRock、Temasek、GV 和 Kleiner Perkins 参投。2021 年
              Series G 融资 $300 million，据报道投后估值为 $4 billion，由 Fidelity、ADM、GV、BlackRock、T. Rowe Price、Temasek、DBL
              Partners 和 Baron Capital Group 等机构投资人领投或参投。最近一轮是 FBN 于 2025 年 7 月获得 $50 million，外界描述为 Series G 延展轮，投资人包括
              GV、Temasek、Arteqin、Colle Capital 和 T. Rowe Price。相较 2021 年的 $300 million，2025 年 $50 million
              的规模偏小，可能反映了资本效率优先、更克制的支出环境，也可能反映后期农业科技融资条件更具挑战。2025 年这一轮的投后估值未公开披露，而公司 2021 年估值据报为 $4 billion。
