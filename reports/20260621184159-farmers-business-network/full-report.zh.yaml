      - number: '2.4'
        title: 增长驱动、采用约束与市场展望
        blocks:
          - type: paragraph
            body: >-
              FBN 最持久的增长驱动，是合作社与独立农民投入品成本之间 20–30% 的结构性价格透明缺口。这一缺口长期存在，因为既有经销商和合作社网络靠排他安排和农艺服务捆绑守住利润率。AI
              采用正在成为第二增长驱动：FBN 的 NORM advisor（基于 ChatGPT）以及 2025 年宣布的平台扩张，把 FBN
              放在数字农场智能与实物商业的交汇处——相较纯电商替代方案，这是一套差异化价值主张。2025 年全球农业科技风险投资达到 $26 billion，也反映投资人认可这一命题。


              可持续发展和再生农业构成第三个驱动。FBN 2023 年与 Environmental Defense Fund 合作推出 $25 million 试点基金，2024 年 8 月又与 ADM 成立
              Gradable 合资公司，二者都指向一个需求：与可持续发展挂钩的投入品采购和碳信用框架正在增长。农场经营者越来越多从下游买家获得可持续发展溢价和成本分担，为 FBN 的 Gradable
              这类平台创造了新的变现层。


              主要约束来自整合、既有渠道和结构性竞争。农场整合正在压缩买家数量——2022 Census 记录了三十年来最大农场数量降幅，较 2017 年减少约 142,000
              个农场，采购权转向更大型运营，而这些运营可能绕过平台直接谈判。加拿大反垄断机构 2021
              年曾审查农业投入品领域的定价做法，后来因证据不足放弃调查；这一事件说明，种子和化学品的价格集中担忧是真实存在的，即便未必构成法律上可追责的问题。Bayer、Corteva、Syngenta 和 BASF
              合计控制美国种子和作物保护销售的主导份额，并专门管理经销商关系以限制去中介化。2026 年关税不确定性让作物保护价格企稳变得脆弱——这给 FBN
              直采模式带来短期采购机会，但如果国内化学品供应仍受结构性约束，也会变成规划风险。
