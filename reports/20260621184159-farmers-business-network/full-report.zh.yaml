      - number: '7.5'
        title: 缓释因素、监测指标与否决标准
        blocks:
          - type: paragraph
            body: >-
              缓释因素确实存在。FBN 通过分拆 GCS
              降低了直接库存强度，扩大了市场品类，也能指向真实的放贷规模、会员触达和持续获得增长资本的能力。风险问题不是没有活动，而是新运营模式在压力下是否耐用。因此，最有用的尽调监测项都应可观察：交易会员转化相对头条会员增长的表现；FBN
              Finance 是否披露逾期或核销趋势；GCS 是否仍是健康且合作的市场卖家；监管机构或原告是否提出新的隐私、借贷或竞争投诉；AI
              转向之后，领导层更替是否明显放缓。对投资者而言，打破投资逻辑的事件包括：信用恶化且没有定价权抵消；GCS 关系明显受损；市场扩张期间再次裁员并冲击客户服务；或融资轮持平 / 下调，暴露 AI
              和市场故事没有换来更好经济性。公开证据足以给这些风险排序，但若没有管理层数据，仍不足以承销金融、牌照和估值敞口。
