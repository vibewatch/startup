      - number: '6.4'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              FBN 客户的多头逻辑在于，一个农场关系可以扩展到多个季节性和金融工作流。种植者可以免费加入、比价、订购投入品、使用融资、通过保存清单复购、销售粮食，再把英亩
              纳入可持续项目。这构成了可信的落地后扩张故事，不需要经典 SaaS 的席位增长。Gradable 是最清晰的扩张向量证据：超过 20,000 名农民用户，系统每年流转的激励超过 $30
              million。空头逻辑在于，公开披露仍看不出变现基础到底有多持久、多集中。FBN 不披露
              NRR、GRR、流失、续约率、头部客户敞口，也不披露投入品、金融、作物营销和可持续业务之间的收入组合。公司还在运营上依赖配送物流和服务质量；管理层早前描述配送执行仍处于婴儿期时，自己也承认了这一风险。因此，投资者应把
              FBN 的客户基础看作宽且真实，但公开记录里的商业监测颗粒度不足。
