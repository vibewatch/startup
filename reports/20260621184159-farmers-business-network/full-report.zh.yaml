            body: >-
              2023 年以来可见路线图相当连贯：先推出 Norm，再扩展 Norm；向更多第三方供给开放市场；通过 GCS 分离作物保护运营栈；并持续发布移动端和品类更新。FBN
              自己的招聘页面显示，这不是一个小型试验团队在跑。Engineering、Product 和 Data Science 被作为独立职能配置，公司称其在 40+ 地点拥有超过 1,000 名员工。Built In
              招聘信息在 2026 年 6 月仍显示有活跃的电商软件和采购相关岗位，这是一个不错的开发者信号，说明平台在剥离后仍在演进。更难验证的是输出质量：FBN
              更愿意披露路线图方向和团队结构，而不是模型准确率、事故率或正式集成覆盖等客观指标。
