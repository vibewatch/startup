  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买家替代方案
        blocks:
          - type: paragraph
            body: >-
              FBN 所处的农业投入品、数据和金融市场中，既有玩家拥有根深蒂固的实体分销、深厚农艺师关系，以及能制造强转换成本的合作社所有权模式。竞争集合至少分为四类：Nutrien Ag Solutions 和 CHS
              等大规模实体农资零售商，拥有数千个零售网点；Syngenta 和 BASF 等种子与作物保护科学公司，通过传统分销渠道销售；Climate FieldView 和 Granular
              等精准农业及农场数据平台，争夺农民数据关系；以及 Farm Credit System 和 Farmer Mac 等农业贷款机构，锚定农场金融。Indigo Ag（谷物营销和碳信用）和
              Bushel（数字谷物收购）等相邻玩家占据数据和谷物商业层，而不是广义投入品市场。现状替代方案仍是本地合作社或独立经销商，它们提供基于关系、本地定价、没有数字基准的投入品采购。FBN
              的价格透明定位和面向农场直送，确实击中了痛点；但反向证据——包括农业媒体报道的种子换标争议和公开报道的 2023 年裁员——说明，差异化本身不能保证在资本雄厚的既有玩家面前持续拿到市场份额。
