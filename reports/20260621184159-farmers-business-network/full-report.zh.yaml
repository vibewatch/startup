  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 对 FBN 的影响
      - 尽调问题
    rows:
      - - AI 和数字决策支持工具采用
        - 驱动因素
