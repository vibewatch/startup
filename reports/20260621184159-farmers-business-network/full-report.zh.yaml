      - number: '4.2'
        title: 单位经济、利润率与成本结构
        blocks:
          - type: paragraph
            body: >-
              FBN 未公开披露任何单位经济或利润率指标。市场模式意味着投入品转售毛利偏薄——农业分销的大宗商品毛利率通常为 3–15%——而自有品牌生物制品和品牌种子产品具有更高结构性毛利，但 FBN 未公开量化。FBN
              Finance 运营授信的利率据称可与农场信贷基准竞争，意味着相对公司自身资金成本的净息差在 200–400 个基点区间；实际利差未披露。FBN 对通过其市场购买的部分投入品提供 0%
              融资，意味着金融业务和市场业务之间存在交叉补贴。成本结构包括面向农场直送的物流和仓储基础设施、带有 Norm 等 AI 工具的数字平台（Norm
              是用于农艺和作物营销问答的大语言模型）、获取新农场成员的销售和营销，以及一套把农业贷款顾问分散到乡村社区的贷款运营。客户获取成本和会员生命周期价值未公开披露，因此无法估算回本周期或 LTV:CAC
              比率。免费会员转型砍掉了直接订阅收入，但降低了 CAC 摩擦。营运资本被投入品库存采购周期和 FBN Finance 贷款发放管线占用；GCS
              剥离大幅降低作物保护库存融资需求，这是提升营运资本效率的正向结构变化，但也降低了来自作物保护品类的绝对收入基础。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
