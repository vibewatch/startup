      - number: '4.3'
        title: 资本充足性、融资历史与资金续航
        blocks:
          - type: paragraph
            body: >-
              2014 年至 2025 年 7 月，FBN 通过十二轮股权融资累计筹集约 $981 million。2017 年末 $110 million Series D 由 T. Rowe Price 和 Temasek
              领投，使当时累计融资达到约 $200 million。2019 年 1 月 $175 million Series E 由 Kleiner Perkins 领投。2020 年 8 月 $250 million
              Series F 由 BlackRock 领投；Bloomberg 报道称交割时投后估值约 $1.75 billion，新投资人包括 Baron Capital、Balyasny 和 Lupa
              Systems，也有老股东继续参与。2021 年末 $300 million Series G 由 Fidelity Investments 领投，ADM Ventures 和新金融投资人参投；据报估值略低于
              $4 billion，是 2020 年 Series F 价格的两倍以上。Reuters 2022 年初报道称，FBN 正准备秘密提交美国 IPO 注册，目标估值约 $8 billion；最终没有 IPO
              文件出现，截至 2026 年 6 月 FBN 仍为私营公司。最近一轮融资是 2025 年 7 月来自 GV、Temasek、Arteqin、Colle Capital 和 T. Rowe Price 的 $50
              million Series G 延展轮，资金用于 AI 平台开发和市场增强。2025 年该轮投后估值未公开披露。现金余额、月度烧钱额、资金续航，以及债务或信贷安排条款均不为公众所知。SEC EDGAR 全文检索
              "Farmers Business Network" 的 Form D 备案返回零结果，说明备案可能使用了不同法律实体名称，或采用了替代豁免。FBN Finance
              的贷款业务需要仓储信贷额度来支持贷款发放；这些信贷安排条款和交易对手未公开披露。
