      - number: '3.3'
        title: 精准农业数据平台与相邻数字玩家
        blocks:
          - type: paragraph
            body: >-
              Bayer 运营的数字农业平台 Climate FieldView，与 FBN 竞争农民数据关系。FieldView 纳入数千万英亩，把田间数据采集硬件 FieldView Drive
              连接到云平台，用于田间管理、播种处方和农艺分析。FieldView 不提供一体化投入品市场或面向农场直送，因此占据的是数据层，不是商业层；但其已纳入的英亩基础，让 Bayer 能看见农民采购意图。Granular
              现在属于 Corteva 的数字组合，提供聚焦运营效率的农场管理软件——财务、田间记录、农艺——而不是价格透明基准或投入品商业。Corteva 更广的平台策略把 Granular 与 Pioneer 种子数据和
              Corteva 农艺工具配对，使 Granular 成为 Corteva 农化关系的延伸，而不是独立市场。Indigo Ag 处在不同角落：通过 Indigo Market
              做谷物营销，运营碳信用项目和微生物种子处理；它不提供可与 FBN 相比的种子和投入品价格透明市场。Bushel 是谷物技术平台，聚焦电梯仓和农民的数字谷物收购，包括数字现金合同和移动谷物营销——相较 FBN
              的投入品市场，它更像互补表面而非竞争表面。FBN 的关键竞争张力在于，FieldView 和 Granular 建立的大型数据网络，随着时间推移可能纳入采购意图和竞争情报，把数据邻近性变成商业切入口。
