      - number: '2.2'
        title: 多重口径下的市场规模
        blocks:
          - type: paragraph
            body: >-
              FBN 处在几个不同但彼此重叠的市场规模框架交汇处。最宽口径下，美国农业投入品总市场——覆盖种子、作物化学品、肥料和服务——估计每年约 $140 billion。这个数字综合了 AgriLife
              Extension、Farmers National 和 FBN 自身市场报告的估计；不同分析来源因产品边界定义不同，会有 10–15% 的差异。全球精准农业市场是农业科技的一个子集，2025 年估计为
              $10.5–$15 billion，CAGR 为 12–13%，意味着到 2030 年全球规模可达 $25 billion 或更高。更广义的智慧农业市场包括 IoT 传感器和联网农场硬件，2025 年估计约
              $26 billion；Precedence Research 预计 2026 年将增长到 $30 billion 区间。


              要得到 FBN 的可服务可获得市场（SAM），必须从完整的 $140 billion 中剥离出独立商业农场。2022 年 USDA Census 统计美国农场总数为 3.36 million，其中约
              400,000–500,000 个是商业规模运营，并在合作社网络之外采购——这才是 FBN 的实际买家池。按商业农场在总投入品支出中的占比测算，仅投入品市场 SAM 就约 $35–$50
              billion。再加上同一目标群体的金融服务层——运营贷款、农作物保险和设备融资——合并 SAM 估计为 $50–$80 billion。


              农业贷款市场由 Farm Credit System 主导；截至 2024 年，其贷款和租赁组合约 $320 billion，服务 500,000+ 借款人。FBN Finance 到 2024 年初的 $1
              billion 运营授信只占这一资金池的一小部分，但它显示独立农民借贷板块规模很大，且商业银行替代方案服务不足。2025 年全球农业科技风险投资约 $26 billion，说明即便较 2020–2021
              年高峰期交易部署更挑剔，资本兴趣仍在。不同来源的规模估算差异显著；这里保留的相互冲突估计是真实尽调缺口，不是四舍五入差异。
