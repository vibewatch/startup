        - 合作社会员定价；合作社内部经济结构
        - 合作社惠顾分红；按单位的商品定价
        - 未公开披露；合作社结构遮蔽了外部价格
        - 合作社忠诚度降低会员价格敏感度；FBN 对注重成本的独立农户更有吸引力
      - - Climate FieldView
        - 免费增值 + 付费订阅；FieldView Drive 硬件加购
        - 按英亩订阅（高级版据报约 $8–15/acre）；硬件一次性购买
        - 公开价格有限；官网描述了一般订阅模式
        - 不是直接的农资定价竞争对手；FieldView 的农场数据价值与 FBN 的数据层竞争
      - - Granular (Corteva)
        - 订阅制农场管理软件；与 Corteva 农艺服务捆绑
        - 按经营主体订阅；具体价格未公开列示
        - 抓取的应用页面未公开披露
        - 竞争焦点在农场数据关系，而非农资定价；Corteva 捆绑可能压低 FBN 采用率
      - - Farm Credit System
        - 浮动和固定农业贷款利率；借款人所有的合作社经济结构
        - 按贷款利率；经营授信、设备贷款、房地产抵押贷款
        - 成员机构会发布利率，但未公开汇总
        - GSE 资金成本的结构性优势意味着 FBN Finance 必须靠便利性和捆绑竞争，而不是单纯拼利率
      - - Indigo Ag
        - 粮食市场经纪；碳信用溢价；订阅制农艺服务
        - 按蒲式耳经纪费；按英亩支付碳信用款项
        - 可获得一般描述；具体经纪费未披露
        - Indigo 的粮食和碳溢价模式瞄准的农户也在 FBN 覆盖范围内；与农资定价的直接重叠有限
      - - Bushel
        - 向粮仓销售 SaaS 许可；农户通过粮仓获得移动端访问
        - 按粮仓或地点授权；未公开披露
        - 抓取页面未公开披露
        - 如果粮仓更偏好 Bushel 独家合作，Bushel 的粮仓伙伴模式可能限制 FBN 的粮食商业触达
      - - BASF Agriculture
        - 经销商中介定价；Xarvio 数字工具订阅
        - 作物保护按单位计价；Xarvio 按英亩订阅
        - 经销商价格未公开列示；Xarvio 价格可联系获取
        - 没有直接的价格透明竞争；BASF 的分销销售模式支持 FBN marketplace 成为一个渠道
