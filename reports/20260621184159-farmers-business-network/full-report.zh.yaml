  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与农民工作流
        blocks:
          - type: paragraph
            body: >-
              FBN 当前产品表面更像一套服务在营农场的打包运营栈，而不是单一商业页面。公司通过市场销售投入品，把融资模块嵌入采购旁边，把作物营销动作导入专门的 MARKET
              工作流，并在同一成员关系上叠加基准和农艺数据产品。公开文件现在显示，这套栈已经比最初的直接投入品概念更宽：FBN 称平台承载超过 7,200
              个产品，已向第三方卖家开放，并延伸到谷物买家连接、合同、过磅单和支付。对农民用户而言，工作流被刻意压缩成几类重复动作：浏览带价供给、安排资金、营销谷物，并从手机查看田块级数据。产品层面的主要结论是宽度和便利性；主要尽调提醒是，买方和卖方侧集成细节只被选择性记录。
