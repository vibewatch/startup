      - number: '8.4'
        title: 建议、尽调问题与否决触发器
        blocks:
          - type: paragraph
            body: >
              可投资结论是继续研究，而不是因为 FBN 缺少真实经营内核；问题在于，$3.8-4.0 billion
              入场价的价格支撑太薄。公司显然有规模、产品广度和可信战略关系，可触达的精准农业市场看起来仍在增长。但缺失的证据恰好决定价格：确认收入、抽成率、各产品线毛利、金融部门的信用损失或资金结构、清算优先权、任何短期可转债条款，以及独立观察到的
              2026
              年二级或一级市场价格。没有这些输入，估值讨论会坍缩成供应商旧值延续和叙事类比。因此，本章的偏高评估很明确：公开证据可以支持继续尽调和观察名单姿态，但不能支持按旧头条估值付款。正确下一步，是进入私人数据室，聚焦变现质量、信用风险和股权结构经济性。如果可定价可转债明显低于旧标尺，单位经济疲弱，或有证据显示
              AI 与融资扩张带来的监管或信用风险快过利润率提升，立场就应从继续研究转向回避。
