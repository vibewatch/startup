  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与公开估值标尺
        blocks:
          - type: paragraph
            body: >
              FBN 最后一个清晰的公开估值标尺仍是 2021 年 11 月 Series G，当时 AgFunderNews

              和 Tracxn 都报道该轮融资 $300 million，投后估值约 $4 billion。2025 年 7 月 28 日的融资从 GV、Temasek、Arteqin、Colle Capital 和 T.

              Rowe Price 获得 $50 million，但公司官方公告没有披露新估值、收入数字或股权结构条款。这一缺口很重要，因为当前供应商快照仍锚定旧标尺：Premier Alternatives 显示截至

              2025 年 7 月 28 日估值为 $3.8 billion，而 Tracxn 显示 2021 年轮次为 $4 billion，并列示累计融资总额 $981 million；Premier
              Alternatives 则显示 $1.1 billion，说明连基础资本历史现在也取决于供应商方法论。其余经营背景真实但不能直接定价：FBN

              披露已向种植者提供近 $3 billion 融资，覆盖超过 117,000 个农场、187 million 英亩，并在 2025 年 7 月拥有超过 7,200 个市场产品；Business Wire 后来在
              2026 年 1 月描述其有 120,000+ 名会员。这些规模信号解释了为什么投资者继续给平台投钱，但不能解决核心估值问题：公开证据仍缺少当前收入、ARR、利润率和优先权栈披露。
