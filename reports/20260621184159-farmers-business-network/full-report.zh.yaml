  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与数据治理风险
        blocks:
          - type: paragraph
            body: >-
              2025 年 10 月分拆 Global Crop Solutions 后，FBN 的直接监管负担变窄了，但风险没有消失，只是换了形态。Canadian Competition Bureau 的记录，是 FBN
              模式周围监管摩擦最清晰的公开例子。该局曾调查批发商和制造商是否共同或单独行动，在加拿大西部让 FBN 处于不利地位；案件最终在没有证明存在非法协议的情况下关闭，但该局仍表示，部分沟通试图就 FBN
              影响供应商，并警告行业不要越过法律边界。这很重要，因为 FBN 这个价格透明的市场仍依赖产品供给和既有供应链的公平对待。与此同时，FBN
              自己的隐私政策确认，它在全球服务范围内收集农艺、金融、个人和会员社区数据，并把争议导向有约束力的个人仲裁。FBN Finance 现在营销多种信贷产品——从营运额度到农地资本，以及最高 $15 million
              的信用额度——因此牌照、公平借贷、隐私和服务控制仍然重要。公开材料没有列出完整的州别牌照版图、逾期情况或仓储融资交易对手，残余法律和监管敞口只能部分承销。
