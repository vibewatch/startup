  - id: TM003
    title: 细分 / 买家地图
    columns:
      - 细分
      - 买家 / 用户 / 付款方
      - 工作流
      - 预算负责人
      - 采用触发因素
      - FBN 匹配度
    rows:
      - - 大型商业农场（500+ 英亩，农资支出 >$500K）
        - 农场业主经营者或聘用经理；付款方为农场实体或运营贷款方
        - 年度批量农资采购，配合精准施用和数据管理
        - 业主 / CFO；信贷需贷款方批准
        - 价格节省 + 数据集成 + 融资便利
        - 强 — 采购量和数字化准备度契合 FBN 的市场与金融业务
      - - 中型家庭农场（100–499 英亩，农资支出 $50K–$500K）
        - 农场业主经营者；付款方为农场业主或季节性贷款方
        - 季节性补充农资，并定期做价格基准比较
        - 业主
        - 价格透明、便利性和有竞争力融资的可得性
        - 核心 — FBN 现有会员和交易基础主要就在这里
      - - 小型家庭农场（<100 英亩，农资支出 <$50K）
        - 农场业主经营者；付款方为农场业主
        - 小批量采购；相对交易成本而言价格敏感度高
        - 业主
        - 容易获取基准数据；服务付费意愿较低
        - 中 — 可通过免费网络触达，但货币化经济性吃紧
      - - 合作社成员农场（任意规模）
        - 农场业主经营者；合作社代表成员管理采购
        - 合作社中介的批量采购，带量返利
        - 合作社管理层 + 农场业主（非合作社采购）
        - FBN 可用于价格基准比较；切换动机有限
        - 低至中 — 合作社忠诚度和价格趋同削弱切换意愿
      - - 新入行或转型中的农民
        - 刚开始独立经营的农场业主经营者；付款方为业主或家庭贷款方
        - 发现、教育，以及获得信贷和农资采购渠道
        - 业主
        - 融资可得性、农艺教育和网络支持
        - 中 — 终身价值潜力高的增长细分；近期采购量较低
