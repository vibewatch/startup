        - 这些都是技术尽调的核心议题
        - 需要向管理层或合作伙伴文档直接尽调
    notes: 这张表有意把正向控制和缺失的公开控制放在一起，因为当前证据集中最大的产品技术风险是文档深度，而不是完全没有政策语言。
