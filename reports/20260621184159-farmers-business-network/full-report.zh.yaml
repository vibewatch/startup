  - id: TP004
    title: 护城河耐久性 / 竞争风险登记
    notes: 严重度仅基于公开证据评估；高 = 有证据显示既有企业回应或市场动态削弱该主张，构成结构性竞争威胁；中 = 风险存在，但尚未大规模显现。
    columns:
      - 护城河主张
      - 威胁来源
      - 严重度
      - 缓解措施 / 尽调问题
    rows:
      - - 价格透明基准（Kelley Blue Seed 模式）
        - AgDaily 对种子重新贴标争议的负面报道削弱了“农户盟友”的品牌信任；既有企业投入忠诚度项目，降低价格显著性
        - 高
        - 核实种子标签做法是否已经解决，并确认价格透明买家的重复购买率相对对照组的表现
      - - 聚合网络数据优势
        - Climate FieldView 和 Granular 从已加入的英亩中大规模积累农场数据；时间拉长后，这些数据可能生成竞争情报，抵消 FBN 的基准优势
        - 中
        - 评估数据网络规模（农场数量、英亩数、作物决策）以及 FBN 数据相对竞争对手数据集的排他性；核实网络效应是在复利增长而非见顶
      - - 直达农场配送和物流
        - Nutrien 和 CHS 运营包含本地配送的实体分销网络；拥有物流基础设施的大型既有企业一旦有动力，可以追平便利性
        - 中
        - 确认最后一公里配送的单位经济、地理覆盖，以及与既有企业可比农资的临时配送相比，FBN 是否有可持续的物流成本优势
      - - 集成式 FBN Finance 捆绑
        - Farm Credit System 拥有 GSE 资金成本的结构性优势；FBN Finance 要与 Farm Credit 拼利率，必须靠规模效率或更高便利性溢价
        - 高
        - 审计 FBN Finance 的贷款损失率、净息差和资金成本；确认农资采购捆绑能否创造足够利润，在没有 GSE 资金的情况下竞争
      - - 独立品牌信任和农户盟友定位
        - 2023 年裁员（DTN Progressive Farmer）和种子重新贴标负面报道（AgDaily）损害了信任叙事；执行缺口削弱“农户盟友”品牌
        - 高
        - 索取 NPS 数据、交易会员流失率，以及 2023 年重组以来品牌修复的证据
      - - 数字原生平台 vs. 传统模式
        - Nutrien Ag Solutions、Syngenta 和 BASF 正在投入数字农业工具（Xarvio、Cropwise）；既有企业数字化推进后，会削弱 FBN 的平台差异化
        - 中
        - 跟踪既有企业数字工具采用率，并观察 FBN 目标农户群体的采购是否从农艺师主导转向数字化主导
    claimRefs:
      - CP046
      - CP047
      - CP048
      - CP049
      - CP050
