      - number: '6.2'
        title: 获客渠道与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              FBN 的获客动作明显以数字化优先，但并非纯自助。下单流程包括 24/7 产品搜索、价格比较、购物车结算、融资选择、配送排期、订单追踪和已保存购物清单，意味着会员可以全程在线完成从发现到重复购买。同时，FBN
              又叠加本地农艺师、电话支持、农场拜访、客户代表和社区活动，因此获客栈把软件便利性和农业关系型销售混在一起。公开采用信号有意义，尽管还不是完美的队列 数据集。FBN 称，35%
              的农民在采购投入品时访问该平台，线上投入品购买较 2023 年增长 86%，2025 年回到平台购买投入品的农民数量达到历史最高。较早的 2024 年访谈给出更硬的变现锚点：约 16,000 名交易农民、2023
              年 33,000 次配送，以及 $1 billion 融资。合在一起，这些来源显示 FBN 已跑出真实客户机器，顶部漏斗宽、季节性复购存在；但管理层仍未披露投资者更想看的清晰活跃客户和转化指标。
