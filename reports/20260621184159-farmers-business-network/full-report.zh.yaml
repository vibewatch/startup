  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与变现层次
        blocks:
          - type: paragraph
            body: >-
              与其把 FBN 的公开客户群看成一个同质群体，不如看成一条分层漏斗。最上层是免费会员网络：官网显示已超过 120,000 名农民，2025 年 7 月增长公告显示覆盖 117,000 个农场，让 FBN
              触达大量北美家庭农场决策者。免费层重要，是因为 FBN 只有在农场进入更高价值活动时才变现：购买作物投入品、获得融资、使用作物营销工具，或加入 Gradable
              等可持续项目。买方、用户和付款方通常都是同一个农场经营者或家族企业，这不同于采购和最终使用相分离的企业软件销售。公开证据在美国中西部和加拿大的行栽作物、混合农场流程中最强，包括来自
              Illinois、Indiana、Saskatchewan 和 Minnesota 的具名证言。西部地区和大型具名企业式账户证据较弱，因此最稳妥的分层方式，是按变现层和工作流划分，而不是按经典 B2B
              标识类别划分。
