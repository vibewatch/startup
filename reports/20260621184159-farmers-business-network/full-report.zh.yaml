            title: 公开证据支持尽调，不支持头条价格
            body: >
              FBN 看起来是一家真实的平台公司，而不是幻灯片故事：它有融资量、市场广度、保险分销、AI 工具，以及与 ADM 联动的重要可持续合资公司。问题不在于 FBN 是否有业务；问题在于，今天的公开证据能否支撑按仍锚定
              2021 年 Series G 的旧晚期私募估值付款。在这个更窄也更重要的问题上，答案是否定的。正确动作是保留尽调，但必须有严格入场纪律，并向私人数据室索取收入质量、金融账簿风险和股权结构经济性的硬数据。
