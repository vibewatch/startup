      - number: '7.2'
        title: 商业模式、利润率与农业周期风险
        blocks:
          - type: paragraph
            body: >-
              FBN 的市场已经大到有分量，但结构上仍暴露在转化、利润率和宏观周期风险中。最有信息量的公开数据点来自 FBN 自己的临时 CEO 2024 年初访谈：近 80,000 名会员中，约 16,000
              名正在投入品、融资或 Gradable 上交易，意味着当时只有约五分之一会员转化为变现活动。免费会员让注册翻倍，扩大了触达，但也削弱了会员质量和变现深度信号。同一访谈披露，2023 年有 33,000
              次配送、$1 billion 融资和 $22 million Gradable 溢价，确认吞吐量真实，但不证明盈利持久。FBN
              还称，除草剂市场急转后不得不大幅降价；这提醒投资者，投入品库存会在商品周期反转时毁掉利润率。到 2026 年，USDA、Texas A&M AgriLife 和 Farm Bureau
              来源仍把农业经济描述为利润敏感、风险管理强度高，这一压力会继续叠加。如果种植者收入收紧或投入品预算波动，FBN 会同时承受需求和信用质量两头挤压。
