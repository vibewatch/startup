      - number: '2.3'
        title: 买家分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              FBN 的买家版图可分为五个有商业意义的群体，由农场规模、采购行为和数字化准备度决定。大型商业农场——500 英亩或以上、年度投入品支出 $500,000 或以上——代表最高体量买家，也最适合
              FBN，因为它们数字化准备度更高、有信贷需求，也愿意跨供应商对标投入品价格。中型家族农场（100–499 英亩、年度支出 $50K–$500K）构成 FBN
              目前的核心会员基础；取消付费订阅层后，公司用免费网络模式刻意降低这一群体的进入门槛。100 英亩以下的小型家族农场按数量是最大群体，但只占投入品总支出的少数；它们价格敏感、数字化采用较低，使平台规模化变现更难。


              2022 年美国有 3.36 million 个农场，其中 96% 为家族经营，贡献了农业总产出的 86%。大型商业运营（年销售额超过 $500,000）不到全部农场的 10%，却贡献约 80%
              的产品销售额，形成一种集中度动态：它既驱动 FBN 的体量机会，也把采购权集中到一个可能拥有更强直接供应商议价能力的买家池。2022 Census 识别出约 2.4 million 个年收入低于 $150,000
              的小型家族农场——FBN 可以通过网络触达这一群体，但很难规模化变现。


              FBN
              成员的典型采用路径，从免费注册以查看基准价格数据开始，推进到第一次市场采购（通常是作物保护或肥料），其中一部分再进入金融服务使用（运营授信或农作物保险）。小型和年长农场经营者的数字化采用障碍，包括连接条件限制和经营者年龄结构，会拖慢这一漏斗。Farm
              Credit System 的补贴借贷条款，也给 FBN Finance 产品带来结构性定价挑战，限制 FBN 能以有竞争力利率实际拿下的金融服务 SAM 份额。FBN 120,000+ 成员中约 16,000
              个活跃交易，这一转化率既显示增长空间，也说明把被动查价者转成采购会员并不容易。
