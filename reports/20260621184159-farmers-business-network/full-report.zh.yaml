      - number: '7.3'
        title: 伙伴、渠道与供应链依赖风险
        blocks:
          - type: paragraph
            body: >-
              轻资产逻辑只有在 FBN 能用可靠伙伴产能替代自有能力时，才会提高资本效率。分拆后，GCS 成为独立供应商，仍通过 FBN 市场销售，保留 250
              多项注册组合，并营销监管、采购、代工、重新包装和运输能力。也就是说，受监管作物保护执行中的关键一环，FBN 现在依赖交易对手，而不是内部控制。FBN
              自己的公告还称，市场必须向更多卖家和金融伙伴开放，因此第三方入驻和集中度风险应上升而非下降。渠道冲突风险并非理论：Canadian Competition Bureau 和 Reuters
              记录都显示，部分既有投入品市场参与者愿意就 FBN 向供应商施压。GCS
              自己的网站又加入了地缘政治维度，因为它称中国、印度和墨西哥团队支持采购和监管工作。实际情况是，分拆后的公司库存负担更轻，但更暴露于外部供应商、贷款方、物流商和 AI 赋能伙伴的质量、定价、连续性和战略一致性。
