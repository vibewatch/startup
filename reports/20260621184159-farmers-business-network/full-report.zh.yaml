          values:
            - label: 中等
              tone: positive
              detail: 具名农户谈到独立性、节省成本、透明度和支持。
            - label: 弱
              tone: warning
              detail: 证据由公司筛选，发布在 FBN 自有页面上。
            - label: 强
              tone: positive
              detail: 这些引语被包装成真实生产会员的反馈，而不是试点。
            - label: 弱
              tone: warning
              detail: 推荐语没有附带使用年限、续约或同期群指标。
        - label: Capterra 评价页面
          values:
            - label: 中等
              tone: positive
              detail: 评价具体谈到投标支持、上手流程和客户经理。
            - label: 中等
              tone: neutral
              detail: 来源独立，但可见评价只有一条。
            - label: 中等
              tone: neutral
              detail: 内容像真实使用，而不是演示或新闻稿引语。
            - label: 弱
              tone: warning
              detail: 一条评价样本无法证明满意度能长期维持。
        - label: Gradable 项目证明
          values:
            - label: 高
              tone: positive
              detail: 溢价、英亩、蒲式耳和用户数都已公开量化。
            - label: 中等
              tone: neutral
              detail: 证据覆盖 FBN、ADM 和 Business Wire，不是单一来源。
            - label: 强
              tone: positive
              detail: 项目显然已经上线，并在种植者和粮食买家之间形成规模。
            - label: 弱
              tone: warning
              detail: 未披露重复年度注册情况，也未说明与 FBN Direct 用户的重叠。
        - label: 交易平台复购叙事
          values:
            - label: 低
