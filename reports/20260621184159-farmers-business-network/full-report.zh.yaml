      - number: '1.5'
        title: 里程碑与战略事件
        blocks:
          - type: paragraph
            body: >-
              FBN 的历史先是快速增长，随后进入战略重组。关键里程碑包括：2014 年以农民数据网络概念创立；2017 年推出电商市场 FBN Direct；2021 年以 $4 billion 估值完成 Series
              G，跻身独角兽；2023–2024 年 CEO 从创始人 Amol Deshpande 交接给 Diego Casanello；2025 年 10 月战略剥离 Global Crop Solutions；2025
              年 7 月完成聚焦 AI 和平台扩张的 $50 million
              融资。公司经历了多次战略转向，包括退出国际市场（澳大利亚）、砍掉业务线（种子生产、畜牧、肥料制造），并从垂直一体化模式转向开放市场平台。2025–2026 年阶段显示，FBN 正转向轻资产、AI
              驱动的市场模式，并扩大第三方卖家参与。
