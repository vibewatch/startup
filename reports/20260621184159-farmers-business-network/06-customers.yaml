- id: TU005
  title: Expansion and concentration risk table
  columns:
  - driver / risk
  - public evidence
  - impact
  - confidence
  - diligence path
  rows:
  - - 'Expansion: inputs to finance'
    - Financing is integrated into the order flow and nearly $3B has been financed cumulatively
    - Can raise wallet share and improve input conversion
    - High
    - Request repeat-borrower rates and finance attach rate to marketplace orders
  - - 'Expansion: inputs to sustainability'
    - Gradable has 20,000+ users and $30M+ annual incentives
    - Creates a second monetization and retention loop tied to buyer demand
    - High
    - Request overlap between Gradable users and FBN Direct customers
  - - 'Expansion: broader marketplace breadth'
    - 2025-2026 releases add third-party sellers, seed, livestock, and Canadian distribution expansion
    - Broadens product relevance per farm and may deepen share of wallet
    - Medium
    - Request GMV mix by category and seller type
  - - 'Risk: monetization concentration'
    - Free membership is broad, but only 16,000 transacting farmers were publicly disclosed in 2024
    - Economic value may depend on a much smaller active core than the headline member base
    - Medium
    - Request current active transactors, annual buyers, and spend concentration
  - - 'Risk: disclosure and logistics dependence'
    - FBN does not publish top-customer concentration or revenue mix and has historically flagged delivery execution as a priority area
    - Durability can weaken if fulfillment or service quality slips
    - Medium
    - Request top-customer exposure, on-time delivery, and customer-support SLA metrics
  notes: Expansion rows focus on cross-sell logic, while risk rows isolate where public disclosure is too thin to prove durability.
