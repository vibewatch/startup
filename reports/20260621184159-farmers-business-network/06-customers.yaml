tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - primary use case
  - public scale / proof
  - revenue / strategic value
  - gap
  rows:
  - - Free member farms
    - Buyer=user=payer is usually the farm operator or family business
    - Access price transparency, benchmarking, community, and shopping entry points
    - Free membership; 120,000+ homepage members and 117,000+ farms in 2025 release
    - Creates the broad top-of-funnel and data network FBN can monetize later
    - No public breakdown by farm size, crop mix, or engagement tier
  - - Input marketplace transactors
    - Buyer=user=payer is the operating farm purchasing inputs
    - Crop protection, nutrition, seed, livestock, and supplies ordered online
    - ~16,000 transacting farmers disclosed in 2024; 33,000 deliveries in 2023; 100,000+ cumulative deliveries on homepage
    - Core commerce revenue layer and strongest path to repeat seasonal spend
    - No current 2025/2026 active transacting count or purchase frequency cohort
  - - Finance users
    - Borrower is the farm; payer is the farm after harvest
    - Input loans and operating capital aligned to seasonal cash flow
    - Nearly $3 billion financed cumulatively and promotional 2026 input-financing offers
    - Raises wallet share and helps convert large orders that might otherwise stay offline
    - No default, renewal, or repeat-borrower metrics disclosed
  - - Crop marketing users
    - Farm sells grain while using FBN tools to monitor bids and contracts
    - Review bids, manage contracts, tickets, and payments through crop-marketing tools
    - Brokerage, grain-buyer connectivity, and app workflows are public, but user counts are not
    - Adds downstream monetization beyond procurement
    - No disclosed customer count, transaction volume, or retention by marketing user
  - - Sustainability / Gradable growers
    - Farm operator enrolls acres and shares production data; grain buyer funds downstream demand
    - Earn premiums for cover crops, lower carbon intensity, and regenerative practices
    - 20,000+ farmer users, 12M+ acres, 200M+ bushels scored, and $30M+ annual incentives
    - Best evidence that FBN can expand the same farm into premium programs and buyer-linked demand
    - Program participation by region and repeat-year retention are not disclosed
  - - Canadian and Prairie growers
    - Same farm-level buyer / user / payer model, with country-specific logistics and product breadth
    - Inputs, financing, and sustainability programs tailored to Canadian conditions
    - Named Saskatchewan testimonial plus 2026 Canadian portfolio expansion and new distribution centers
    - Extends the platform beyond the U.S. Midwest and deepens North American coverage
    - Public proof is still much lighter than for the core U.S. row-crop footprint
  notes: Segmentation is organized by monetization layer and geography because FBN does not publish a clean customer taxonomy by farm size, revenue band, or vertical.
