- id: TU006
  title: Customer acquisition channels and conversion frictions table
  columns:
  - channel / friction
  - public evidence
  - why it matters
  - strength / risk
  - gap
  rows:
  - - Online self-serve commerce
    - 24/7 search, pricing, cart, delivery scheduling, and order tracking are public
    - Core acquisition path can scale without local branch footprint
    - Strength
    - No public browse-to-buy conversion disclosed
  - - Field support and account reps
    - Homepage cites local agronomists and Capterra cites onboarding help plus a farm visit
    - Hybrid support can convert larger or less digital-first farms
    - Strength
    - No disclosure of what share of orders involve assisted selling
  - - Community and word-of-mouth
    - 100,000+ member community and Farmer2Farmer recordings create peer proof
    - Important in agriculture where neighbor recommendations shape trust
    - Strength
    - No referral attribution or CAC by channel disclosed
  - - Compliance and underwriting steps
    - APT signature, tax forms, RUP uploads, vet coordination, and credit approval are part of the process
    - These steps can filter serious buyers but can also slow conversion
    - Risk
    - No checkout-abandonment or approval-rate data disclosed
  - - Regional network depth
    - Capterra reviewer says the West still looked thinner than the Midwest
    - Shows why top-of-funnel reach may not convert evenly by geography
    - Risk
    - No state-by-state transacting density or supplier coverage disclosure
  notes: This table separates acquisition surfaces from operational frictions because both affect how free members convert into transacting customers.
