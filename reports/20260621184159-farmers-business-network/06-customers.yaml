  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A broader, independently corroborated roster of named FBN customers across regions and product lines, especially outside the Midwest and Saskatchewan examples.
    whyItMatters: The current named-proof table is useful but heavily company-curated and geographically narrow, so it cannot prove broad cross-segment durability.
    diligencePath: Request customer references by product line and geography, then corroborate them with independent conference talks, procurement records, or partner case studies.
    relatedQuestionRefs:
    - QU009
    - QU019
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, repeat-order cohorts, and renewal metrics for inputs, finance, and sustainability programs.
    whyItMatters: Without retention metrics, the public customer story can show adoption without proving durability or unit-economics quality.
    diligencePath: Ask management for cohort retention and repeat-purchase schedules by product line, including annual buyer retention and financing renewal rates.
    relatedQuestionRefs:
    - QU014
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Current active transacting counts, spend concentration, top-customer exposure, and revenue mix across inputs, finance, crop marketing, and sustainability.
    whyItMatters: Headline member counts can mask a much smaller monetizing core and potentially concentrated economics.
    diligencePath: Request current annual active buyers, top-10 customer share, GMV mix, and cross-sell overlap between FBN Direct, Finance, and Gradable users.
    relatedQuestionRefs:
    - QU006
    - QU021
    - QU025
  - type: stale
    severity: minor
    topic: transacting-freshness
    missingEvidence: A 2025 or 2026 refresh of the exact transacting-farmer count disclosed in the February 2024 interview.
    whyItMatters: The public record mixes a current member count with an older transacting-base count, which weakens any conversion estimate.
    diligencePath: Ask management for current active transacting farmers and annual buyers using the same definition as the 2024 interview.
    relatedQuestionRefs:
    - QU006
    - QU024
  - type: access-blocked
    severity: minor
    topic: complaint-detail
    missingEvidence: A richer independent complaint dataset with complaint counts, resolution quality, and delivery-specific issue patterns.
    whyItMatters: The public adverse signal exists, but it is too thin to distinguish isolated issues from systemic customer-service problems.
    diligencePath: Pull BBB complaint detail, state-specific review sources, and seasonal delivery issue threads to test whether logistics complaints cluster by geography or product type.
    relatedQuestionRefs:
    - QU020
