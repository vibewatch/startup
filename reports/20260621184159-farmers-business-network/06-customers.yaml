- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - signal
  - value / evidence
  - segment
  - confidence
  - implication
  - diligence ask
  rows:
  - - Repeat-order tooling
    - Shopping Lists automatically save prior purchases and Order History is visible on web and mobile
    - Input marketplace users
    - High
    - Product design explicitly supports seasonal reordering
    - Ask for cohort order frequency and reactivation rates
  - - Return-purchase language
    - FBN says more farmers returned to purchase inputs in 2025 than ever before
    - Input marketplace users
    - Medium
    - Directionally positive retention signal
    - Request exact repeat-purchaser count and year-over-year retention rate
  - - Review sentiment
    - Single visible Capterra review praises value, customer support, and bid help
    - Software / platform users
    - Medium
    - Independent proof exists, but only at tiny sample size
    - Request broader review base or NPS by product line
