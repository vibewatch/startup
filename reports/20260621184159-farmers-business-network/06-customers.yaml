    - Newer or larger spend accounts
    - Medium
    - Suggests service depth can improve activation and retention
    - Request segmented renewal rates by assisted versus self-serve accounts
  - - Formal retention metrics
    - No public NRR, GRR, churn, renewal, or contract-length metrics found
    - Whole customer base
    - High
    - Retention cannot be underwritten with public-market rigor
    - Request cohort retention, GMV repeat rate, and product-line renewal data
  notes: The strongest retention evidence is operational and testimonial rather than cohort-based; nulls represent missing public disclosure, not zero retention.
