sections:
  - id: market-boundary-and-definition
    title: Market Boundary, Definitions, and Status-Quo Substitutes
    body: >-
      FBN's relevant market is defined by the purchasing and financing decisions of independent
      commercial farm operators across North America — those who operate outside cooperative
      buying arrangements and therefore bear the full burden of market-rate input prices.
      The primary product categories in scope are crop protection chemicals (herbicides, fungicides,
      insecticides), fertilizers and soil amendments, commodity seed (corn, soybean, wheat, cotton),
      and the full suite of agricultural financial services including operating loans, crop insurance,
      and equipment finance. The U.S. agricultural inputs market across these categories was
      estimated at approximately $140 billion in 2025, anchored by the fertilizer and seed markets
      at roughly $18.7 billion (seed alone in 2026), the crop protection segment at $14–$16 billion,
      and the remainder in services and specialty inputs.


      The status-quo substitutes for FBN's marketplace are traditional agricultural input dealers
      and farm cooperatives. These channel incumbents handle approximately 70–80% of all U.S. farm
      input purchases, offering volume discounts, agronomic services, and credit terms. Cooperative
      member farms receive input pricing 20–30% below what independent farmers typically pay at
      retail, which represents FBN's core value proposition: closing that gap through transparent
      bulk purchasing. Adjacent markets relevant to FBN but currently outside its primary scope
      include specialty horticulture, livestock feed, and large-machinery equipment — the latter
      excluded from FBN's core marketplace after the 2025 spin-off of Global Crop Solutions (GCS),
      which narrowed FBN's crop protection offering to commodity inputs.


      The crop insurance market represents an important adjacent SAM. FBN launched its insurance
      agency in 2021 and competes for a share of the $10 billion-plus in annual U.S. federal crop
      insurance premiums. Financial services — including operating lines and land loans — round out
      the addressable boundary, with FBN Finance targeting the $20–$30 billion segment of commercial
      farm borrowing that flows outside the Farm Credit System's subsidized network.
