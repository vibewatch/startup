  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: crop-protection-market-sizing
      missingEvidence: >-
        Independent analyst estimates for the U.S. crop protection market range from $14 billion
        to $16+ billion annually with inconsistent product boundary definitions; a single
        authoritative estimate reconciling herbicide, fungicide, and insecticide sub-segments
        with clear geography and channel scope is unavailable from public sources.
      whyItMatters: >-
        The spread in crop protection market estimates directly affects FBN's SAM calculation
        for its marketplace vertical and hampers precise quantification of the price transparency
        opportunity in the category most impacted by 2026 tariff dynamics.
      diligencePath: >-
        Commission or license proprietary CropLife America industry shipment data or USDA
        Agricultural Chemical Use Survey to obtain a consistent baseline estimate, and reconcile
        with FBN's own internal sales reporting for category benchmarking.
      relatedQuestionRefs:
        - QM024

    - type: private-evidence-only
      severity: material
      topic: fbn-lending-pricing
      missingEvidence: >-
        FBN Finance's actual interest rates, loan terms, and pricing relative to Farm Credit
        System benchmark rates are not publicly disclosed. No independent source has published
        a side-by-side rate comparison between FBN and FCS for comparable agricultural operating
        loan products.
      whyItMatters: >-
        Without rate parity data, it is impossible to assess the competitive sustainability
        of FBN Finance's lending product or to size the share of the farm credit market
        accessible to FBN on a price-competitive basis versus the FCS's GSE-backed rates.
      diligencePath: >-
        Request FBN Finance's current rate sheets and term structures through the diligence
        process and compare to publicly available FCS benchmark loan rates published by the
        Farm Credit Administration in quarterly reports.
      relatedQuestionRefs:
        - QM025

    - type: missing-source
      severity: material
      topic: regulatory-license-requirements
      missingEvidence: >-
        A comprehensive enumeration of the state-by-state insurance licenses, money-transmitter
        registrations, CFTC registration requirements, and data privacy compliance obligations
        across all 50 U.S. states and Canadian provinces applicable to FBN's multi-product
        platform has not been assembled from public sources.
      whyItMatters: >-
        Regulatory licensing gaps represent both a growth constraint and a legal risk; states
        where FBN lacks insurance or lending licenses are effectively excluded from the SAM,
        and any compliance failures could trigger regulatory action limiting platform operations.
      diligencePath: >-
        Commission a regulatory counsel review of FBN's licensing status across all active
        product lines (marketplace, insurance, lending, sustainability credits) in all states
        where it operates, using NAIC and NMLS databases as the primary enumeration sources.
      relatedQuestionRefs:
        - QM026

    - type: enumeration-incomplete
      severity: minor
      topic: sizing-methodology-transparency
      missingEvidence: >-
        Analyst market sizing reports for precision agriculture and smart agriculture markets
        do not publicly disclose their survey methodology, primary data sources, or model
        assumptions, preventing independent replication or triangulation of the estimates.
      whyItMatters: >-
        Without methodology transparency, the 12–13% CAGR and $10.5–$15 billion size estimates
        cannot be independently validated, which reduces the reliability of FBN's addressable
        market framing when those figures are used to anchor investor presentations.
      diligencePath: >-
        Obtain methodology documentation from Precedence Research and Verified Market Reports
        through direct analyst engagement or licensed report purchase, and cross-check against
        USDA precision agriculture adoption survey data available through NASS.
