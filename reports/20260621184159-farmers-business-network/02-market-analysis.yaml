chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Farmers Business Network operates in a U.S. agricultural inputs and financial services market
    estimated at $140 billion in 2025, targeting a serviceable addressable market of $50–$80 billion
    among independent commercial farms. The precision agriculture segment growing at 12–13% CAGR and
    a $10 billion+ annual crop insurance pool represent the highest-quality growth tailwinds, while
    Farm Credit System competition, farm consolidation, and incumbent supplier channel control
    are the primary structural constraints on FBN's market penetration.
