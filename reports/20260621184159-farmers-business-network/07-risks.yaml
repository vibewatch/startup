    - Re-underwrite supply resilience; consider asset-light thesis impaired
  - - Credit quality opacity
    - Loan performance disclosure
    - Any evidence of rising delinquencies / charge-offs without offsetting yield
    - Pause until loss-rate and warehouse-funding visibility improves
  - - Member conversion weakness
    - Transacting-member growth vs headline members
    - Membership grows materially faster than transacting farmers for 2+ seasons
    - Treat network size as vanity metric; lower revenue-quality assumptions
  - - Privacy / legal exposure
    - Regulatory complaint, class action, or new policy controversy
    - Any privacy, fair-lending, or arbitration-driven dispute with broad customer impact
    - Escalate legal diligence and revise customer-acquisition assumptions
  - - Org instability
    - Further layoffs or top-team turnover during category expansion
    - Another major reorg or executive departure before service metrics improve
    - Assume execution discount and slower product rollout
  - - Valuation uncertainty
    - Next financing or secondary mark
    - Flat/down round, punitive preferences, or materially reduced mark
    - Treat as evidence that AI and marketplace pivot is not compounding economics
  notes: Kill criteria are investor-oriented monitors rather than predictions. They are designed to be observed from diligence materials, market events, or periodic management reporting.
