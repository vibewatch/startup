chapter:
  number: 7
  title: Risks
  summary: FBN’s main risks in 2026 are not existential demand absence but conversion quality, finance opacity, and dependency created by its asset-light pivot. Public evidence shows only about 16,000 of nearly 80,000 members were transacting in early 2024, repeated restructuring and leadership turnover through 2025, and a post-spin reliance on GCS for regulated crop-protection supply. Competition-law history in Canada, a broad privacy-and-finance data surface, and unresolved questions about loan performance, licensing, and valuation leave the business investable only with deeper diligence on the finance book and the durability of the new marketplace model.
sections:
- id: regulatory-legal-and-data-governance
  title: Regulatory, Legal, and Data-Governance Risk
  body: FBN’s direct regulatory burden has narrowed since it spun out Global Crop Solutions in October 2025, but the risk did not disappear; it changed shape. The Canadian Competition Bureau’s record is the clearest public example of regulatory friction around FBN’s model. The Bureau investigated whether wholesalers and manufacturers worked together or individually to disadvantage FBN in western Canada, closed the case without proving an illegal agreement, but still said some communications tried to influence suppliers regarding FBN and warned the sector against conduct that could cross legal lines. That matters because FBN’s price-transparent marketplace still depends on access to products and fair treatment from entrenched supply chains. At the same time, FBN’s own privacy policy confirms it collects agronomic, financial, personal, and member-community data across a global service footprint and routes disputes to binding individual arbitration. FBN Finance now markets multiple credit products—from
    operating lines to farmland capital and a line of credit up to $15 million—so licensing, fair-lending, privacy, and servicing controls remain material. Public materials do not enumerate a complete state-by-state license footprint, delinquency profile, or warehouse-funding counterparties, which keeps residual legal and regulatory exposure only partially underwritten.
