  evidenceGaps:
  - type: missing-source
    severity: material
    topic: loan-performance-disclosure
    missingEvidence: Public or management-provided delinquency, charge-off, non-performing loan, and recovery metrics for FBN Finance.
    whyItMatters: Without credit-performance data, investors cannot tell whether financing scale is a strength or a hidden loss engine that could worsen in a softer farm economy.
    diligencePath: Request static-pool, vintage, and current delinquency data by product plus underwriting policy changes since 2023.
    relatedQuestionRefs:
    - QR016
    - QR024
  - type: missing-source
    severity: material
    topic: funding-counterparties
    missingEvidence: Warehouse-line lenders, borrowing-base terms, covenants, and any dependence on a small number of capital providers.
    whyItMatters: A lending platform can fail through liquidity or covenant stress before headline origination volumes visibly deteriorate.
    diligencePath: Obtain debt schedule, warehouse agreements, renewal dates, and concentration by counterparty.
    relatedQuestionRefs:
    - QR016
    - QR025
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-license-footprint
    missingEvidence: A full state-by-state and province-by-province schedule of lending, servicing, insurance, and broker licenses tied to each FBN legal entity.
    whyItMatters: Public pages confirm regulated products but do not show the complete licensing perimeter, making it hard to test expansion readiness and compliance risk.
    diligencePath: Request legal-entity chart, license roster, regulator exam history, and complaint log; reconcile against current product footprint.
    relatedQuestionRefs:
    - QR016
    - QR026
    relatedTableRefs:
    - TR001
  - type: stale
    severity: minor
    topic: member-conversion-freshness
    missingEvidence: A 2025-2026 update for transacting-member count, repeat purchase rate, and financing penetration within the broader member base.
    whyItMatters: The only clear conversion datapoint is from early 2024, so current monetization quality may have improved or deteriorated materially since the AI and marketplace pivot.
    diligencePath: Request board KPI deck or monthly operating dashboard with transacting members, active buyers, repeat rates, and mix by product.
    relatedQuestionRefs:
    - QR007
