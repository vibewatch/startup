callouts:
- calloutType: risk
  title: Low Conversion Is the Cleanest Public Warning Signal
  body: The clearest public quality signal in FBN’s network is not the 117,000-plus headline farms but the early-2024 disclosure that only about 16,000 of nearly 80,000 members were transacting. Free membership can widen reach, but unless transacting-member growth closes that gap, the network may be much less monetizable than the membership headline implies.
  claimRefs:
  - CR019
  - CR020
- calloutType: risk
  title: GCS Reduced Inventory Intensity but Created a New Single-Node Dependency
  body: The spin-off materially improves the asset-light story, yet it also externalizes a regulated crop-protection capability that still matters to the marketplace. If GCS’s commercial relationship, service quality, or registration-backed supply continuity weakens, FBN loses both assortment support and one of the core proofs behind its efficiency pivot.
  claimRefs:
  - CR010
  - CR011
  - CR043
- calloutType: assumption
  title: Public Finance Opacity Is a Hard Diligence Blocker
  body: FBN has demonstrated lending scale, but public evidence still does not disclose delinquency rates, charge-offs, warehouse-funding counterparties, or a complete lending-license inventory. Any underwriting case that assumes benign credit quality or frictionless funding without management data is making an unverified leap.
  claimRefs:
  - CR008
  - CR009
  - CR040
