- id: partner-and-channel-dependency
  title: Partner, Channel, and Supply-Chain Dependency Risk
  body: 'The asset-light thesis improves capital efficiency only if FBN can replace owned capabilities with reliable partner capacity. After the spin-off, GCS became an independent supplier that still sells through the FBN marketplace, retains a 250-plus registration portfolio, and markets regulatory, sourcing, tolling, repackaging, and transportation expertise. That means FBN now depends on counterparties rather than internal control for a critical portion of regulated crop-protection execution. FBN’s own announcement also says the marketplace must open to more sellers and financial partners, so third-party onboarding and concentration risk should rise rather than fall. The channel-conflict risk is not theoretical: the Canadian Competition Bureau and Reuters record both show that some established input-market participants were willing to pressure suppliers with respect to FBN. GCS’s own website adds a geopolitical dimension because it cites teams in China, India, and Mexico supporting sourcing
    and regulatory work. In practice, the post-spin company is less inventory-heavy but more exposed to the quality, pricing, continuity, and strategic alignment of external suppliers, lenders, logistics providers, and AI-enablement partners.'
