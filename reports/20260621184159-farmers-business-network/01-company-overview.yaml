callouts:
- calloutType: strength
  title: Massive Farmer Network Creates Data Moat
  body: With 120,000+ member farms across 185M+ acres, FBN has assembled one of the largest private agricultural data networks in North America. This data asset powers product recommendations, pricing transparency,
    and AI tools that improve with scale.
  claimRefs:
  - CO001
  - CO003
  - CO006
- calloutType: risk
  title: CEO Transition and Repeated Restructuring
  body: The departure of founder-CEO Amol Deshpande in late 2023, followed by multiple rounds of layoffs, business line eliminations, and geographic exits, signals significant strategic uncertainty. The
    new CEO Diego Casanello must stabilize operations while executing a pivot to an asset-light model.
  claimRefs:
  - CO011
  - CO027
  - CO028
  - CO033
- calloutType: insight
  title: GCS Spin-Off Signals Business Model Evolution
  body: The October 2025 spin-off of Global Crop Solutions from FBN marks a fundamental shift from vertically integrated crop protection manufacturer to open marketplace platform. This reduces asset intensity
    but also surrenders direct control over a core product line.
  claimRefs:
  - CO035
  - CO036
- calloutType: assumption
  title: Valuation Stability Assumption
  body: The 2025 $50M raise did not disclose valuation. We assume the company's valuation is at or modestly below the $4B 2021 mark given the smaller round size, industry headwinds, and restructuring. This
    assumption cannot be verified without private data.
  claimRefs:
  - CO022
  - CO023
