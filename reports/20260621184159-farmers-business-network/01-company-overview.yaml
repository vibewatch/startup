- id: funding-and-valuation
  title: Funding History, Valuation, and Capital Structure
  body: FBN has raised approximately $981 million in total funding across 12 rounds as of mid-2026. The company's funding trajectory includes early-stage backing from Kleiner Perkins, DBL Partners, and
    GV starting in 2014-2015, scaling through multiple growth rounds. The Series F in 2020 raised $250 million with participation from BlackRock, Temasek, GV, and Kleiner Perkins. The Series G in 2021 raised
    $300 million at a reported $4 billion post-money valuation, led by institutional investors including Fidelity, ADM, GV, BlackRock, T. Rowe Price, Temasek, DBL Partners, and Baron Capital Group. Most
    recently, FBN secured $50 million in July 2025 in what is described as a Series G extension, with investors including GV, Temasek, Arteqin, Colle Capital, and T. Rowe Price. The relatively modest 2025
    raise of $50 million — compared to the $300 million raised in 2021 — likely reflects a combination of capital efficiency focus, a more disciplined spending environment, and potentially challenging conditions
    for late-stage agtech fundraising. The post-money valuation for the 2025 round has not been publicly disclosed, though the company's 2021 valuation was reported at $4 billion.
