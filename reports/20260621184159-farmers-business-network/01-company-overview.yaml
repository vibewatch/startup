chapter:
  number: 1
  title: Company Overview
  summary: Farmers Business Network (FBN) is a San Carlos, California-based agtech platform founded in 2014 that has grown to serve 120,000+ member farms across 185+ million acres in North America, offering
    an integrated digital marketplace, financial services, and AI-powered farm intelligence, having raised approximately $981 million in total funding through its July 2025 Series G round.
sections:
- id: identity-and-mission
  title: Identity, Business Model, and Mission
  body: 'Farmers Business Network (FBN) is a privately held agricultural technology company headquartered in San Carlos, California, with principal offices also in Chicago, Illinois. Founded in 2014, FBN
    operates as a farmer-to-farmer digital network and integrated e-commerce marketplace platform. The company''s stated mission is to ''make family farms more profitable as the farmer''s copilot,'' providing
    a one-stop-shop for agricultural inputs, financing capital, and farm intelligence services supported by direct-to-farm last-mile delivery. FBN''s business model encompasses three core pillars: (1) a
    digital e-commerce marketplace offering 7,200+ products including crop protection, fertilizer, seed, livestock supplies, and equipment at prices targeted 20% below traditional brick-and-mortar retail;
    (2) FBN Finance providing operating loans, land loans, and equipment financing with nearly $3 billion in total loans extended; and (3) data-driven farm intelligence powered by aggregated anonymized
    data from its member network and AI tools including Norm, a large language model for agronomy and crop marketing queries. Membership is free, with the company having transitioned from a paid subscription
    model approximately three years ago, which doubled sign-ups. Of its 120,000+ members, approximately 16,000 actively transact through purchases, financing, or the Gradable sustainability platform.'
