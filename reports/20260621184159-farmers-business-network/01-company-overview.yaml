- id: milestones-and-strategic-events
  title: Milestones and Strategic Events
  body: 'FBN''s history is marked by rapid growth followed by strategic restructuring. Key milestones include: founding in 2014 with the farmer data network concept; launch of the e-commerce marketplace
    (FBN Direct) in 2017; achievement of unicorn status with Series G funding in 2021 at $4 billion valuation; the CEO transition from founder Amol Deshpande to Diego Casanello in 2023-2024; the strategic
    spin-off of Global Crop Solutions in October 2025; and the July 2025 $50 million funding round focused on AI and platform expansion. The company has experienced strategic pivots including exiting international
    markets (Australia), eliminating business lines (seed production, livestock, fertilizer manufacturing), and transitioning from a vertically integrated model to an open marketplace platform. The 2025-2026
    period reflects FBN pivoting toward an asset-light, AI-powered marketplace model with expanded third-party seller participation.'
