- id: leadership-and-governance
  title: Leadership, Founders, and Governance
  body: FBN was co-founded by Amol Deshpande and Charles Baron in 2014. Deshpande, who holds a Cornell MBA and was previously a partner at Kleiner Perkins, served as CEO from founding until late 2023 when
    he stepped down. Devin Lammers served as interim CEO before Diego Casanello assumed the permanent CEO role on March 1, 2024. Casanello brings over 30 years of agricultural and management experience,
    having previously served as CEO of Arysta Life Science Inc. and COO of UPL Ltd., with executive positions at BASF and as managing partner of Vidavo Ventures. Charles Baron, co-founder, continues as
    Chief Product and Marketing Officer. The broader leadership team includes Guillaume Luebke as CFO, Shawntrell Scales as Chief Human Resources Officer, and Candace Wilson as Regional Vice President.
    The CEO transition from founder Deshpande to professional management under Casanello represents a significant governance evolution, coming amid a period of strategic restructuring. Key investors with
    likely board representation include GV (Google Ventures), Temasek, T. Rowe Price, and Fidelity, though board composition details are not publicly disclosed for this private company.
  claimRefs:
