summary:
  headline: >-
    FBN has built a credible, scaled ag-commerce and farm-finance platform with genuine product breadth and farmer
    reach, but the public record still supports only a research-more stance because current economics and July 2025
    pricing remain too opaque to justify the legacy headline valuation.
