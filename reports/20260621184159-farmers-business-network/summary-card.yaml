  topStrengths:
    - >-
      FBN has built one of the larger private farm networks in North America, with 120,000+ members and broad workflow
      coverage across inputs, financing, crop marketing, and sustainability.
    - >-
      The platform shows real product breadth and monetization surfaces, including 7,200+ marketplace products and
      nearly $3B of cumulative financing.
    - >-
      Strategic repositioning after the GCS spin-off appears to reduce inventory intensity and sharpen focus on
      asset-light digital commerce, finance, and AI.
    - >-
      Continued backing from blue-chip investors and partnerships such as ADM/Gradable suggest the company remains
      strategically relevant despite sector turbulence.
  topRisks:
    - >-
      Public evidence still omits current revenue, gross margin, credit-loss performance, and cap-table terms, blocking
      a clean underwrite.
    - >-
      The public record does not support carrying the 2021-style ~$4B valuation into 2026 without proof of software-like
      monetization quality.
    - >-
      Conversion from broad membership to active transacting accounts remains relatively low in disclosed data, raising
      durability and monetization questions.
    - >-
      Repeated restructuring, leadership turnover, and dependency on post-spin partners create execution risk while FBN
      expands AI and financing workflows.
  unresolvedGaps:
    - Current recognized revenue, product-line mix, gross margin, and contribution profitability.
    - Credit performance, funding structure, warehouse lines, and regulatory exposure inside FBN Finance.
    - Valuation, preference stack, and any convert or secondary pricing associated with the July 2025 financing.
    - Retention, repeat-purchase, and cohort durability for active transacting farms by product line.
