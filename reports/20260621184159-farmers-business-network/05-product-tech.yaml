- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Pre-FBN Workflow
  - FBN Workflow
  - Publicly Claimed Benefit
  - Current Limitation
  rows:
  - - Source crop inputs
    - Call retailers and compare quotes manually
    - Browse priced products, compare, add to cart, and order direct-to-farm online or in-app
    - Price transparency and fewer intermediary steps
    - Seller onboarding and API depth are not publicly documented
  - - Secure operating capital
    - Work separately with ag lenders and paperwork-heavy processes
    - Use finance modules alongside platform activity and financing pages
    - Integrated financing surface close to procurement decisions
    - No public detail on underwriting workflow or approvals stack
  - - Market grain
    - Track bids in spreadsheets and by phone
    - Use MARKET, favorites, price alerts, and buyer-linked bids
    - Faster visibility into bids and basis history
    - Coverage depends on partner-buyer connectivity and undocumented edge cases
  - - Track contracts and settlements
    - Collect documents from buyers and manage them manually
    - Import or manually enter contracts, then view tickets and settlements in My Sales
    - Single record for actions, deliveries, and signatures
    - Public docs do not explain sync frequency or reconciliation logic
  - - Get agronomy or operational guidance
    - Ask advisor or search multiple sources
    - Use Norm for agronomy and crop-marketing questions
    - Domain-grounded answers available in the broader FBN workflow
    - No public quality benchmark or escalation path for wrong answers
  notes: Benefits are taken from FBN workflow descriptions, while limitations reflect what the fetched
    public source set does not disclose about integrations or quality controls.
