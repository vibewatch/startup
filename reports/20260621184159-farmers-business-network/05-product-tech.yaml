- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control or Disclosure
  - Public Status
  - Scope
  - Why It Matters
  - Gap
  rows:
  - - No sale of user data
    - Explicitly stated
    - Applies across FBN Companies in privacy policy
    - Important because the platform mixes commerce, financial, and agronomic data
    - No independent audit artifact cited in fetched sources
  - - Account-level sharing controls
    - Explicitly stated
    - Users can manage permissions for other members or professionals
    - Supports collaboration without universal data exposure
    - Actual permission model screenshots or docs are not public in fetched set
  - - Buyer-partner data boundary
    - Explicitly stated
    - Buyers see submitted offers, not unrelated farmer-added account data
    - Limits data leakage to grain counterparties
    - No public description of technical enforcement model
  - - Mobile data disclosure
    - Explicitly stated
    - Location, identifiers, usage data, diagnostics, and other data can be linked to identity on iOS
    - Important for a field-operating mobile app
    - No public security whitepaper explaining retention or minimization
  - - Security limitation and breach notice
    - Explicitly stated
    - FBN says complete security cannot be guaranteed and breach notice follows investigation if needed
    - Acknowledges residual cyber risk
    - No public uptime page, incident history, or certification list found
  - - Independent quality evidence
    - Not found in fetched sources
    - Norm accuracy, marketplace uptime, seller API quality, and app reliability
    - These are core technical diligence topics
    - Requires direct diligence from management or partner docs
  notes: This table intentionally mixes positive controls with missing public controls because the strongest
    product-tech risk in the current evidence set is documentation depth, not absence of any policy language.
