callouts:
- calloutType: strength
  title: Integrated workflow is the clearest product differentiator
  body: The most credible moat in the fetched evidence set is not a single algorithm or patent. It is
    the practical integration of marketplace supply, embedded financing, crop-marketing workflows, mobile
    field tools, and a domain-specific AI assistant inside one farmer relationship. That combination lowers
    context switching and helps FBN behave more like an operating system for farm decisions than a narrow
    ecommerce storefront.
  claimRefs:
  - CE001
  - CE010
  - CE016
  - CE019
  - CE035
- calloutType: risk
  title: Technical transparency lags product breadth
  body: FBN discloses enough to show what the platform does, but not enough to fully underwrite how well
    it performs. Public sources did not yield API references, seller integration manuals, uptime evidence,
    Norm quality benchmarks, or quantified post-spin transition dependencies with GCS. That means the
    product story is compelling, while the public engineering proof remains incomplete.
  claimRefs:
  - CE023
  - CE032
  - CE039
  - CE040
