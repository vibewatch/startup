- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module
  - Primary User
  - Public Status / Maturity
  - Public Differentiation
  - Diligence Gap
  rows:
  - - Marketplace commerce
    - Farmer buying inputs or supplies
    - GA; 7,200+ publicly advertised products
    - Direct-to-farm delivery, transparent pricing, now open to third-party sellers
    - No public API or implementation manual for seller-side integration
  - - FBN Finance
    - Farmer borrower / operator
    - Scaled module; nearly $3B financed by 2025
    - Operating lines, land, equipment, and input financing inside the same brand family
    - No public underwriting workflow detail, uptime commitment, or decisioning documentation
  - - Crop Marketing / Gradable-connected workflows
    - Farmer selling grain
    - GA with partner-buyer integrations
    - Bids, contracts, tickets, settlements, filters, task lists, and offer submission from one market
      surface
    - Partner coverage and data-sync behavior are documented only through FAQs
  - - Norm AI advisor
    - Farmer or agronomist asking operational questions
    - Live and still expanding
    - Domain grounding in FBN agronomy content, analytics, labels, USDA, weather, and soil data
    - No public benchmark on answer quality, hallucination rate, or production adoption
  - - Data & analytics layer
    - Farmer making agronomy or purchasing decisions
    - GA
    - Aggregated anonymized benchmarking plus seed, chemistry, and price insights
    - No public disclosure of model logic, refresh cadence, or recommendation evaluation
  - - Mobile app
    - Farmer and farm team in-field
    - Actively maintained; iOS version 26.0.0 public in May 2026
    - Combines ordering, grain marketing, imagery, notes, and community in one client
    - Public review volume is thin relative to platform breadth
  notes: Rows summarize only publicly disclosed modules. Hidden internal tooling, private partner dashboards,
    and undocumented seller integrations may expand the real scope beyond this public matrix.
