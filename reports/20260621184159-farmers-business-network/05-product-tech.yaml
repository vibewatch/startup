  evidenceGaps:
  - type: missing-source
    severity: material
    topic: documentation-gap
    missingEvidence: Public API references, seller integration manuals, or buyer-integration technical
      documentation beyond FAQ-level onboarding steps.
    whyItMatters: Without deeper integration docs, it is hard to assess implementation burden, data-model
      quality, or partner extensibility.
    diligencePath: Request partner technical docs, sandbox screenshots, API schemas, and implementation
      timelines from product or partnerships leadership.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: material
    topic: norm-maturity
    missingEvidence: Any public benchmark, adoption metric, escalation workflow, hallucination-control
      description, or human-review policy for Norm responses.
    whyItMatters: Norm is central to FBN's AI differentiation story, but public evidence still favors
      aspiration and roadmap over measured output quality.
    diligencePath: Ask for monthly active users, prompt volumes, model-evaluation scorecards, answer-accuracy
      studies, and examples of human override in production.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: security-risk
    missingEvidence: A public uptime page, incident-history log, SLA commitments, or independent certification
      summary for the marketplace and mobile stack.
    whyItMatters: The platform blends commerce, finance, and operational data, so availability and security
      evidence matter for product trust and underwriting.
    diligencePath: Request SOC 2 or equivalent materials, uptime reports, incident postmortems, and support
      response SLAs.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: gcs-spin-off
    missingEvidence: Transition-service detail, commercial-dependency metrics, or data-flow disclosures
      showing how much FBN still depends on GCS after the spin-off.
    whyItMatters: The strategic story hinges on becoming a purer platform, but residual operational coupling
      could mute the expected simplification.
    diligencePath: Ask management for post-spin service maps, supply-share data, exclusivity terms, and
      any shared-system separation milestones.
    relatedQuestionRefs:
    - QE025
  - type: missing-source
    severity: minor
    topic: mobile-signal
    missingEvidence: A broader independent practitioner sample on app reliability and feature quality
      beyond the thin public App Store signal.
    whyItMatters: The app is a key delivery layer, but public review count is too small to stand in for
      robust customer validation.
    diligencePath: Request internal DAU/WAU, crash-rate telemetry, support-ticket volume, and segmented
      NPS or app-store review summaries.
    relatedQuestionRefs:
    - QE024
