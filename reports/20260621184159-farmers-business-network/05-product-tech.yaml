- id: architecture-dependencies
  title: Operating Architecture and Dependency Model
  body: 'Public materials imply a layered operating model. At the top sit farmer-facing web and mobile
    clients. Beneath them are specific workflow apps for commerce, crop marketing, and finance. The grain-marketing
    piece depends on Gradable-based buyer integrations and mobile-number verification; the commerce piece
    depends on seller onboarding, listings, inventory, pricing, and order-processing tools; and the finance
    piece sits inside the same account family rather than outside it. The October 2025 GCS spin-off materially
    changes this architecture: FBN is choosing the control plane for marketplace demand, financing, and
    digital workflow, while GCS takes more of the crop-protection registration and supply-chain burden.
    That should make FBN more software-like and less inventory-heavy. The tradeoff is dependency opacity:
    public sources do not quantify transition services, residual operational coupling, API depth, or platform-level
    reliability commitments.'
  claimRefs:
