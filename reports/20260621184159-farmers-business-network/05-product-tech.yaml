- id: ai-data-mobile
  title: AI, Data, and Mobile Execution
  body: 'Norm and the mobile app are the clearest evidence that FBN is trying to turn a transactional
    marketplace into an everyday operating system for farm decisions. Norm''s public description is notable
    because it is not framed as a generic chatbot: FBN says the model is grounded in agronomy blogs, analytics,
    product labels, Seed Finder data, USDA information, and weather or soil context. That gives the assistant
    a domain-specific retrieval story, later reinforced by the 2024 patent filing. On mobile, the documented
    feature set is unusually broad for an ag-input platform: pricing checks, direct ordering, grain bids,
    contracts, scale tickets, settlements, EVI imagery, field notes, and community access all sit in one
    app. Apple''s May 2026 release note shows active maintenance, but public evidence remains stronger
    on feature breadth than on measured product quality or production reliability.'
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
  - CE018
  - CE019
  - CE020
  - CE021
  - CE024
  - CE038
