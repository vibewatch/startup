  - FE004
- id: roadmap-velocity
  title: Roadmap and Development Capacity
  body: 'The visible roadmap since 2023 has been coherent: first launch Norm, then broaden it; open the
    marketplace to more third-party supply; separate the crop-protection operating stack through GCS;
    and keep shipping mobile and category updates. FBN''s own careers page suggests this is not being
    run by a tiny experimentation team. Engineering, Product, and Data Science are staffed as separate
    functions, and the company says it has more than 1,000 employees across 40-plus locations. Built In
    job listings still showed active e-commerce software and sourcing-related hiring in June 2026, which
    is a decent developer-signal that the platform keeps evolving post-spin. What remains harder to validate
    is output quality: FBN discloses roadmap direction and team structure more readily than objective
    norms such as model accuracy, incident rates, or formal integration coverage.'
  claimRefs:
