- id: trust-risks
  title: Trust Controls and Product-Tech Risks
  body: FBN's strongest public trust materials are policy disclosures rather than independent certifications.
    The privacy policy is detailed and explicit that the company will not sell user data, that users can
    manage sharing permissions, and that buyer partners cannot see unrelated farmer-added account data.
    Those are constructive control statements for a platform that mixes commerce, lending, grain marketing,
    location signals, and mobile usage telemetry. At the same time, the same policy makes clear that FBN
    cannot guarantee complete security and would investigate before notifying users of unauthorized access.
    That is a normal legal caveat, but in this case it matters because the platform appears to unify ag,
    financial, and personal data. Public product-tech diligence is also constrained by thin app-review
    depth, missing public API references, and the lack of public uptime, SLA, benchmark, or transition-service
    documentation around Norm and the post-GCS operating model.
  claimRefs:
  - CE016
