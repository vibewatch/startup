      - number: '7.4'
        title: People, Restructuring, and AI-Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a company that has clarified strategy by repeatedly changing structure.
              Leadership turned over quickly after founder Amol Deshpande’s 2023 exit, with John Vaske leaving within
              the year, Devin Lammers stepping in on an interim basis, and Diego Casanello later installed to drive a
              pure-technology-platform and AI agenda. Those transitions coincided with layoffs, facility closures,
              cancellation of the 2023 Farmer2Farmer event for cost reasons, an exit from Australia, and portfolio
              simplification that included the GCS spin-off and prior insurance divestment. Built In’s 2026
              employee-facing summaries are not audited company disclosures, but they are directionally useful because
              they repeatedly highlight communication gaps, trust issues, shifting priorities, and low day-to-day
              stability during this refocus. The execution load is higher because FBN’s 2025 financing was explicitly
              tied to AI tools and marketplace enhancements such as Norm. If AI rollout quality disappoints, or if
              top-down resets continue faster than teams can absorb them, FBN could lose some of the service consistency
              and trust it needs to convert a large membership base into repeat high-margin activity.
            claimRefs:
