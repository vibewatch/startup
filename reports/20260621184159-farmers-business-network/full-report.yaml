      - number: '2.2'
        title: Market Sizing Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              FBN sits at the intersection of several distinct but overlapping market sizing frames. At the broadest
              level, the total U.S. agricultural inputs market — encompassing seeds, crop chemicals, fertilizers, and
              services — is estimated at approximately $140 billion annually. This figure reflects composite estimates
              from AgriLife Extension, Farmers National, and FBN's own market reporting, with individual analyst sources
              varying by 10–15% depending on product boundary definitions. The global precision agriculture market, a
              subset of agtech, was estimated at $10.5–$15 billion in 2025 with a CAGR of 12–13%, implying growth to $25
              billion or more globally by 2030. The broader smart agriculture market, which includes IoT sensors and
              connected farm hardware, was estimated at approximately $26 billion in 2025 with Precedence Research
              projecting growth to the $30 billion range by 2026.


              FBN's serviceable addressable market (SAM) requires isolating independent commercial farms from the full
              $140 billion. The 2022 USDA Census counts 3.36 million total U.S. farms, of which approximately
              400,000–500,000 are commercial-scale operations purchasing outside cooperative networks — FBN's practical
              buyer universe. Applying commercial farm shares of total input spend yields a marketplace SAM of roughly
              $35–$50 billion for inputs alone. Adding the financial services layer — operating loans, crop insurance,
              and equipment finance for the same target segment — produces a combined SAM estimate of $50–$80 billion.


              The agricultural lending market is dominated by the Farm Credit System, which held a total loan and lease
              portfolio of approximately $320 billion as of 2024, serving 500,000+ borrowers. FBN Finance's $1 billion
              in operating lines as of early 2024 represents a fraction of this pool but signals that the independent
              farmer borrowing segment is both large and underserved by commercial bank alternatives. Agtech venture
              investment reached approximately $26 billion globally in 2025, indicating sustained capital appetite
              despite more selective deal deployment compared to 2020–2021 peaks. Sizing estimates across sources show
              material variation, and the conflicting estimates preserved here represent a genuine diligence gap rather
              than a rounding difference.
