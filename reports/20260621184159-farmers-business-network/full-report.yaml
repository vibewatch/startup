      - number: '8.3'
        title: Comparable Band, Scenarios, and Stretch Assessment
        blocks:
          - type: paragraph
            body: |
              Public comps give only a rough band, but even that rough band is uncomfortable for the headline
              price. AGCO trades around $8.22 billion on $11.66 billion of 2024 revenue, CNH around $12.96
              billion on $19.84 billion, and Trimble around $11.45 billion on $3.68 billion, implying roughly
              0.65x, 0.70x, and 3.11x market cap to revenue respectively. FBN is more software- and service-
              enabled than AGCO or CNH, but it is also more opaque and structurally riskier because its current
              revenue, loss profile, credit performance, and cap table are undisclosed. Using the public-comp
              band literally, a $3.8-4.0 billion valuation would require something like $1.2 billion of
              revenue at Trimble-like software quality or more than $5.5 billion at equipment-like multiples.
              Because public evidence does not disclose a revenue denominator, the only defensible approach is
              scenarios. A bull case can reach roughly $3.0-4.0 billion if FBN proves $500M+ of durable,
              blended high-margin monetization across marketplace, financing, services, and software with a
              6-8x multiple. A base case of $0.75-2.0 billion fits a hybrid marketplace/fintech profile with
              $250M-$400M revenue and 3-5x multiples. A bear case of $0.2-0.8 billion fits a down-round,
              repriced convert, or distressed agtech outcome. On today's public evidence, the headline mark is
              stretched rather than supported.
