      - number: '6.4'
        title: Retention, Expansion, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              The bullish case on FBN customers is that one farm relationship can expand across many seasonal and
              financial workflows. A grower can join for free, compare prices, order inputs, use financing, reorder
              through saved lists, market grain, and then enroll acres in sustainability programs. That creates a
              credible land-and-expand story without requiring classical SaaS seat growth. Gradable is the clearest
              proof of that expansion vector, with over 20,000 farmer users and more than $30 million in annual
              incentives moving through the system. The bearish case is that public disclosure still does not show how
              durable or concentrated the monetization base really is. FBN does not publish NRR, GRR, churn, renewal
              rates, top-customer exposure, or revenue mix across inputs, finance, crop marketing, and sustainability.
              The company also remains operationally dependent on delivery logistics and service quality, a risk
              management itself acknowledged earlier when describing delivery execution as still in its infancy.
              Investors should therefore view FBN's customer base as broad and real, but commercially under-instrumented
              in the public record.
