      - number: '3.2'
        title: Scaled Input Incumbents and Crop-Science Majors
        blocks:
          - type: paragraph
            body: >-
              Nutrien Ag Solutions is the most direct scaled-incumbent competitor in the physical channel. The company
              operates approximately 2,000 retail locations across North America and Australia and offers seed, crop
              protection, fertilizers, nutrients, and biological products as a full-service crop-inputs retailer. Its
              services include agronomy advice, precision agriculture tools, and crop-protection expertise delivered
              through local agronomists — a model that creates personal relationships and credit facilities that FBN
              must overcome with price savings and digital convenience. CHS Inc. is the largest U.S. farmer-owned
              cooperative by revenue and competes through its agronomy division alongside its grain, energy, and food
              operations; the cooperative ownership model gives member farmers economic incentives to concentrate
              purchasing with CHS that pure price savings elsewhere can only partially offset. Syngenta and BASF
              represent a different axis of competition: they supply seeds and crop-protection products through
              traditional distribution chains, launch digital-farming tools such as Syngenta's Cropwise platform and
              BASF's Xarvio, and generally do not offer the kind of marketplace price transparency that FBN markets as a
              differentiator. None of these incumbents publish public pricing benchmarks that allow a farmer to verify
              cross-market price competitiveness the way FBN's Kelley Blue Seed-style tool attempted.
