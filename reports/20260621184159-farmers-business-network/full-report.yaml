      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public Evidence Supports Diligence, Not the Headline Price
            body: >
              FBN looks like a real platform company, not a slideware story: it has financing volume, marketplace
              breadth, insurance distribution, AI tooling, and a meaningful ADM-linked sustainability joint venture. The
              issue is not whether FBN has a business; it is whether public evidence today can justify paying a legacy
              late-stage private valuation still anchored to the 2021 Series G. On that narrower and more important
              question, the answer is no. The correct move is to keep diligence alive, but only with hard entry
              discipline and a private data-room request focused on revenue quality, finance-book risk, and cap-table
              economics.
