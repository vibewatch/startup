  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Monetization Layers
        blocks:
          - type: paragraph
            body: >-
              FBN's public customer base is best understood as a layered funnel rather than a single homogeneous cohort.
              At the top is a free member network that now exceeds 120,000 farmers on the homepage and 117,000 farms in
              the July 2025 growth release, giving FBN broad reach into North American family-farm decision makers. That
              free layer matters because FBN monetizes only when farms cross into higher-value activities: buying crop
              inputs, taking financing, using crop-marketing tools, or enrolling in sustainability programs such as
              Gradable. The buyer, user, and payer are usually the same farm operator or family business, which is
              different from an enterprise software sale where procurement and end use are separated. Public proof is
              strongest in row-crop and mixed-farm workflows in the U.S. Midwest and Canada, including named
              testimonials from Illinois, Indiana, Saskatchewan, and Minnesota. It is weaker in western geographies and
              for large named enterprise-style accounts, so the safest segmentation is by monetization layer and
              workflow rather than by classic B2B logo category.
