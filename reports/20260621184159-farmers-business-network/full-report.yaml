          Requires private evidence that FBN behaves more like a scaled vertical software marketplace than a cyclical ag
          distributor.
        - Audited revenue, segment margins, and a priced primary or secondary mark at or near the legacy valuation.
      - - Base
        - >-
          FBN proves $250M-$400M revenue with mixed marketplace/fintech economics, moderate margins, and continued but
          slower growth through the farm downturn.
        - $0.75B-$2.0B using roughly 3-5x on a hybrid marketplace/fintech model.
        - 'Best matches the public record today: real scale, real products, but incomplete pricing proof.'
        - Data room confirms monetization quality but not software-like margins.
      - - Bear
        - >-
          Revenue is materially below expected, finance economics weaken, convert pricing resets valuation, or a
          flat/down round emerges.
        - $0.2B-$0.8B using distressed-agtech analogs and lower public-comp confidence.
        - Consistent with sector outcomes where digital-ag platforms lost investor support quickly.
        - Priced convert, down-round, or poor unit economics in lending and marketplace operations.
    notes: >
      These ranges are illustrative estimates, not reported market marks. They are anchored to public comp bands,
      adverse agtech outcomes, and the specific evidence gap that FBN does not publicly disclose current revenue.
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV042
      - CV046
  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Metric / status
      - Multiple / valuation
      - Relevance to FBN
      - Limitation
    rows:
      - - AGCO
        - Public ag equipment and services incumbent
        - June 2026 market cap $8.22B; FY2024 revenue $11.662B; ~0.70x market cap / revenue
        - >-
          Shows what a large agriculture platform earns in public markets when economics are cyclical and
          hardware-tilted.
        - Much heavier machinery mix and disclosed public-company economics.
      - - CNH Industrial
        - Public agriculture and construction equipment company
        - June 2026 market cap $12.96B; FY2024 revenue $19.836B; ~0.65x market cap / revenue
        - Provides a low-multiple public baseline for broad ag distribution and equipment exposure.
        - Not a software-first marketplace; capital intensity and product mix differ.
      - - Trimble
        - Public vertical software / industrial technology company with agriculture exposure
        - June 2026 market cap $11.45B; FY2024 revenue $3.683B; ~3.11x market cap / revenue
        - Better proxy for what public markets pay for data, workflow, and software-enabled industrial tools.
        - Broader end markets and better disclosure than FBN.
      - - Farmers Edge
        - Digital-agriculture platform taken private in March 2024
        - C$0.35 per share take-private; Economic Times says deal was 98% below IPO price
        - Direct cautionary reference for how digital-ag equity can compress when growth and market support fade.
        - Own execution issues and public-market history make it an outcome comp, not a clean multiple comp.
      - - AppHarvest
        - Controlled-environment ag company that filed Chapter 11 in July 2023
        - 12 debtors; ~$30M DIP financing during bankruptcy
        - Shows how aggressive agtech narratives can fail when capital intensity outruns economics.
        - Business model is not a marketplace or finance platform.
      - - Indigo Ag / Gro cohort
        - Private digital-ag cohort under funding stress
        - Economic Times says Indigo fell from nearly $4B to about $200M and Gro Intelligence was shutting down
        - Signals that private agtech marks can reset sharply even for well-known platforms.
        - Press-based and partial coverage, not a company-filed current valuation mark.
    notes: >
      Coverage is partial by design: public comps have current market caps but private digital-ag peers rarely disclose
      current marks. Market-cap-to-revenue uses June 2026 market caps and the latest publicly available annual revenue
      cited in the fetched market-data sources.
    enumerationScope:
