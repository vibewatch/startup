      - number: '7.5'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              There are real mitigants. FBN has reduced direct inventory intensity by spinning out GCS, broadened its
              marketplace assortment, and can point to legitimate lending scale, member reach, and continued access to
              growth capital. The risk problem is less about absence of activity than about whether the new operating
              model is durable under pressure. The most useful diligence monitors are therefore observable:
              transacting-member conversion versus headline membership growth, any disclosure of delinquency or
              charge-off trends in FBN Finance, whether GCS remains a healthy and cooperative marketplace seller,
              whether regulators or plaintiffs raise new privacy, lending, or competition complaints, and whether
              leadership turnover slows materially after the AI-focused pivot. For an investor, thesis-break events
              would include evidence of credit deterioration without offsetting pricing power, a visibly impaired GCS
              relationship, renewed layoffs that hit customer service during marketplace expansion, or a flat/down
              financing round that reveals the AI and marketplace story is not earning better economics. Public evidence
              is strong enough to rank these risks, but not strong enough to underwrite finance, licensing, and
              valuation exposure without management data.
            claimRefs:
