  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Commercial Traction
        blocks:
          - type: paragraph
            body: >-
              FBN operates a multi-pillar revenue model built on three main business lines: (1) FBN Direct, a
              direct-to-farm e-commerce marketplace offering 7,200-plus products including crop protection, fertilizer,
              seed, equipment, and livestock supplies at prices claimed to be approximately 20% below traditional
              brick-and-mortar retail; (2) FBN Finance, a technology-enabled lending arm originating operating lines of
              up to $1 million revolving credit per farm, land loans, and equipment financing; and (3) data and
              intelligence services, now delivered through a free membership model rather than paid subscription. FBN
              transitioned from a paid subscription model—a move that reportedly doubled member sign-ups—trading direct
              subscription revenue for expanded marketplace transaction volume. As of mid-2025, FBN Finance had
              surpassed $1 billion in operating lines financed and extended nearly $3 billion in total cumulative loans
              to farmers. In 2023, FBN completed 33,000 direct-to-farm deliveries and paid $22 million in premiums
              through the Gradable platform—a joint venture with ADM that connects grain buyers with regeneratively
              farmed crops. FBN has also launched 17 proprietary branded biologics, grain-trading tools, and an on-farm
              R&D network for biologics, adding adjacencies to the core marketplace revenue stream. The October 2025
              spin-off of Global Crop Solutions (GCS) separated crop-protection inventory from FBN's balance sheet; GCS
              continues to sell through FBN's marketplace under a commercial agreement, preserving farmer access while
              reducing FBN's working-capital intensity. FBN's member base stood at more than 117,000 farms covering 187
              million acres as of the July 2025 raise announcement.
