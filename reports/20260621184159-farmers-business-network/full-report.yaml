      - number: '1.4'
        title: Scale, Operations, and Geographic Presence
        blocks:
          - type: paragraph
            body: >-
              FBN operates primarily across North America, serving farmers in the United States and Canada. The network
              encompasses 120,000+ member farms covering approximately 185+ million network acres. In 2023, FBN
              completed 33,000 deliveries of farm inputs, provided $1 billion in financing, and paid $22 million in
              premiums through the Gradable sustainability platform (a joint venture with ADM). The company has
              undergone significant workforce reductions from 2023 through 2025, with multiple rounds of layoffs.
              International operations in Australia were discontinued as part of a strategic refocusing. The workforce
              has been estimated at approximately 850 employees, reduced from higher levels. In October 2025, FBN spun
              off its crop protection business into a standalone company, Global Crop Solutions (GCS), to pursue an
              asset-light, marketplace-driven model. FBN maintains warehouse and logistics infrastructure for its
              direct-to-farm delivery service, with FBN Canada expanding to include two new distribution centers opening
              in 2026.
