            body: >-
              Public materials imply a layered operating model. At the top sit farmer-facing web and mobile clients.
              Beneath them are specific workflow apps for commerce, crop marketing, and finance. The grain-marketing
              piece depends on Gradable-based buyer integrations and mobile-number verification; the commerce piece
              depends on seller onboarding, listings, inventory, pricing, and order-processing tools; and the finance
