      - number: '3.3'
        title: Precision-Agriculture Data Platforms and Adjacent Digital Players
        blocks:
          - type: paragraph
            body: >-
              Climate FieldView, operated by Bayer as its digital-farming platform, competes with FBN for the farmer
              data relationship. FieldView enrolls tens of millions of acres and connects field-data capture hardware
              (FieldView Drive) to a cloud platform for field management, planting prescriptions, and agronomic
              analysis. FieldView does not offer an integrated input marketplace or direct-to-farm delivery, so it
              occupies the data layer rather than the commerce layer, but its enrolled-acre base gives Bayer visibility
              into farmer buying intentions. Granular, now part of Corteva's digital portfolio, offers farm management
              software focused on operational efficiency — financials, field records, agronomy — rather than
              price-transparency benchmarking or input commerce. Corteva's broader platform strategy pairs Granular with
              Pioneer seed data and Corteva agronomic tools, making Granular an extension of the Corteva agrochemical
              relationship rather than an independent marketplace. Indigo Ag operates in a different corner: grain
              marketing through Indigo Market, a carbon-credits program, and microbial seed treatments; it does not
              offer a seed and input price-transparency marketplace comparable to FBN's offering. Bushel is a
              grain-technology platform focused on digital grain origination for elevators and farmers, including
              digital cash contracts and mobile grain marketing — a complementary rather than competing surface relative
              to FBN's input marketplace. The key competitive tension for FBN is that FieldView and Granular build large
              data networks that could, over time, incorporate purchasing intent and competitive intelligence, turning
              data adjacency into a commerce wedge.
