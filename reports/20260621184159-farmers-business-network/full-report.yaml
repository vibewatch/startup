  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue disclosure misses the implied bar
        - Recognized revenue materially below $250M or contribution margins too thin to merit hybrid platform multiples
        - Would invalidate even the base case and imply the headline mark is mostly historical carry.
        - Move from research-more toward avoid at the legacy price.
      - - Priced convert or new round resets value
        - Convertible note pricing or new equity priced materially below $3.8B
        - Confirms that private markets are no longer honoring the vendor-carried headline mark.
        - Reset valuation work to the new mark and re-run scenario table.
      - - Finance economics weaken
        - Credit losses, funding-cost pressure, or regulatory constraints impair the lending engine
        - Undermines one of FBN's key monetization adjacencies and compresses blended margins.
        - Treat finance as a drag rather than a premium feature in underwriting.
      - - Member growth stalls while product breadth expands
        - Flat members/acres or weak adoption of AI, insurance, and marketplace cross-sell
        - Would suggest breadth is not translating into deeper monetization or moat.
        - Reduce confidence in the bull case and tighten multiple assumptions.
      - - Partnership or AI-risk issues emerge
        - >-
          ADM/Gradable economics disappoint, or AI-driven workflows create model, bias, or third-party risk for finance
          operations
        - Would reduce both strategic upside and the trust needed for financing and advisory products.
        - Increase risk rating and demand tighter diligence on controls before any investment.
    notes: >
      Trigger thresholds are analytical rather than reported company guidance. They are intended to create monitorable
      kill criteria that connect directly to valuation support.
    claimRefs:
      - CV010
      - CV012
      - CV016
      - CV017
      - CV039
      - CV040
      - CV048
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue quality
        - >-
          Recognized revenue, ARR if relevant, take rates, and segment mix across marketplace, finance, insurance, and
          software/AI.
        - This is the missing denominator needed to test the $3.8-4.0B headline valuation against any public comp.
        - Management data room with historical and current monthly financials.
      - - Unit economics
        - >-
          Gross margin, contribution margin, CAC or sales-efficiency by product line, and retention or repeat-purchase
          metrics.
        - Determines whether FBN deserves software-like or distribution-like multiples.
        - Finance, marketplace, and operating review with cohort tables.
      - - Credit risk and funding structure
        - Net charge-offs, funding partners, warehouse lines, duration mismatch, and sensitivity to the farm downturn.
        - Financing can add premium value or become the fastest route to downside.
        - Credit memo review and lender or warehouse facility diligence.
      - - Cap table and preferences
        - >-
          Preference stack, senior rights, liquidation preferences, and pricing terms on any short-term convertible
          note.
        - A nominal enterprise headline can overstate common-equity value by a wide margin.
        - Counsel-reviewed cap table and latest financing documents.
      - - Secondary or primary market mark
        - Independent 2026 trade, tender, priced convert, or mutual-fund mark with methodology.
        - Would replace stale vendor carry-forwards with an actual market-clearing signal.
        - Investor-relations request plus secondary-broker or fund-mark outreach.
      - - AI / control environment
        - >-
          Model governance, bias controls, third-party vendor controls, and how AI interacts with financing or insurance
          decisions.
        - AI can improve monetization but also create safety, compliance, and trust risks in lending workflows.
        - Operational diligence with data science, risk, and compliance leaders.
    notes: >
      These asks are blocking for a priced decision, not nice-to-have follow-ups. Without them the public record cannot
      distinguish between a premium vertical platform and an over-carried late- stage private mark.
    claimRefs:
      - CV040
      - CV041
      - CV046
      - CV048
      - CV049
