  - id: TM001
    title: Market definition table
    columns:
      - Segment/Category
      - Included Spend
      - Excluded Spend
      - Buyer/Payer
      - Relevance to FBN
    rows:
      - - Crop Protection (Herbicides, Fungicides, Insecticides)
        - Direct-farm purchases from wholesale and online distributors outside cooperative programs
        - Cooperative-negotiated volumes and private-label co-op products
        - Independent commercial farm operators; crop-scale buyers
        - Core marketplace revenue; price transparency value proposition strongest here
      - - Fertilizer and Soil Amendments
        - Direct-farm nitrogen, phosphorus, potassium, and micronutrient purchases
        - Co-op-negotiated bulk fertilizer contracts and utility-scale ag programs
        - Independent commercial farm operators; high repeat-purchase volume
        - High-volume, high-frequency category with strong FBN margin potential
      - - Seed (Commodity Crops)
        - Commodity corn, soybean, wheat, and major crop seed outside co-op grower programs
        - Seeds sold under proprietary co-op contracts, direct breeder exclusives
        - Independent commercial farm operators; brand-aware buyers
        - Seed market ~$18.7B in 2026; FBN's share constrained by proprietary seed programs
      - - Agricultural Financial Services — Operating Loans
        - Short-term operating credit for input purchases and seasonal farm expenses
        - Farm Credit System loans and commercial bank ag credit issued through branch networks
        - Commercial farms needing $50K–$2M per season; credit-worthy independent operators
        - $20–$30B independent-farm lending SAM; FBN Finance competes outside FCS network
      - - Crop Insurance
        - Federally backed MPCI and revenue coverage plan premiums for independent farm operators
        - Co-op and agency-managed insurance placements and captive insurance programs
        - Independent farm operators with federal crop insurance program eligibility
        - $10B+ annual U.S. premium pool; FBN Insurance licensed and active since 2021
      - - Farm Equipment and Replacement Parts (Adjacency)
        - Small equipment, tools, and replacement parts sourced through FBN marketplace
        - Large machinery (tractors, combines) and OEM-captive dealer service programs
        - Farm operators across all scales; opportunistic purchases
        - Smaller SAM adjacency; not primary commercial focus post-GCS spin-off
    notes: >-
      Segments drawn from USDA 2022 Census product categories, FBN public marketplace disclosures, and FBN Finance
      product pages. Livestock feed and specialty horticulture are adjacent categories not currently in FBN's commercial
      focus. Operating loan SAM estimate is independent-farm subset of $320B Farm Credit System total portfolio.
    enumerationScope:
