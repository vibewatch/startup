      - number: '6.3'
        title: Named Customer Proof and Satisfaction Signals
        blocks:
          - type: paragraph
            body: >-
              FBN has much better named customer proof than many agtech marketplaces, but the proof is mostly
              qualitative farmer testimony rather than independently audited enterprise case studies. The homepage alone
              names Jamie Walter, Eric Wappel, Jennifer Wiebe, and Robert Boeck, with quotes tied to farmer
              independence, price transparency, customer support, and large on-farm savings. Those testimonials map well
              to FBN's core promise: make family farms more profitable by exposing pricing, simplifying ordering, and
              supporting execution. Independent review evidence is thinner. Capterra surfaces only one visible legacy
              review, but that review is directionally useful because it praises bidding support, onboarding help, and
              account-rep involvement while also warning that the producer and supplier network looked thinner in the
              West than in the Midwest. Gradable adds another kind of customer proof because it is not just a story
              surface; it is a monetized program that pays sustainability premiums and connects growers to grain-buyer
              demand. The main diligence caveat is that nearly all of this evidence is company-curated, review-light, or
