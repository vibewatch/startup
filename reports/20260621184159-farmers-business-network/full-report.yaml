      - number: '4.2'
        title: Unit Economics, Margins, and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              FBN has not publicly disclosed any unit-economic or margin metrics. The marketplace model implies thin
              gross margins on input resale—agricultural distribution typically operates at 3–15% gross margin on
              commodity products—while private-label biologics and branded seed products command higher structural
              margins that FBN has not quantified publicly. FBN Finance operating lines reportedly carry rates
              competitive with farm-credit benchmarks, implying a net interest margin in the range of 200–400 basis
              points over the company's own cost of funds; the actual spread is not disclosed. FBN offers 0% financing
              on certain inputs purchased via its marketplace, implying cross-subsidization between the finance and
              marketplace businesses. The cost structure encompasses direct-to-farm logistics and warehouse
              infrastructure, a digital platform with AI tools including Norm (a large language model for agronomy and
              crop marketing queries), sales and marketing to acquire new farm members, and a lending operation with
              agricultural loan advisors dispersed across rural communities. Customer acquisition cost and member
              lifetime value are not publicly disclosed, preventing payback-period or LTV:CAC ratio estimation. The
              free-membership transition eliminates direct subscription revenue but reduces CAC friction. Working
              capital is tied to input-inventory purchase cycles and FBN Finance's loan origination pipeline; the GCS
              spin-off materially reduces crop-protection inventory financing needs, which is a positive structural
              change for working-capital efficiency but also reduces the absolute revenue base derived from the
              crop-protection category.
            claimRefs:
              - CI009
