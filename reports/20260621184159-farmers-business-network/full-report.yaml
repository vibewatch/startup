        title: Product Surface and Farmer Workflow
        blocks:
          - type: paragraph
            body: >-
              FBN's current product surface is best understood as a bundled operating stack for a working farm rather
              than as a single commerce page. The company sells inputs through its marketplace, embeds financing modules
              alongside those purchases, routes crop-marketing actions into a dedicated MARKET workflow, and layers
              benchmarking and agronomic data products across the same member relationship. Public documentation now
              shows that this stack is broader than the original direct-input concept: FBN says the platform carries
              more than 7,200 products, has opened to third-party sellers, and extends into grain-buyer connectivity,
              contracts, scale tickets, and payments. For a farmer user, the workflow is intentionally compressed into a
              few repeat actions: browse priced supply, line up funding, market grain, and check field-level data from a
              phone. The main product takeaway is breadth and convenience; the main diligence caveat is that buyer- and
              seller-side integration detail is documented only selectively.
