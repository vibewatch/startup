  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Data-Governance Risk
        blocks:
          - type: paragraph
            body: >-
              FBN’s direct regulatory burden has narrowed since it spun out Global Crop Solutions in October 2025, but
              the risk did not disappear; it changed shape. The Canadian Competition Bureau’s record is the clearest
              public example of regulatory friction around FBN’s model. The Bureau investigated whether wholesalers and
              manufacturers worked together or individually to disadvantage FBN in western Canada, closed the case
              without proving an illegal agreement, but still said some communications tried to influence suppliers
              regarding FBN and warned the sector against conduct that could cross legal lines. That matters because
              FBN’s price-transparent marketplace still depends on access to products and fair treatment from entrenched
              supply chains. At the same time, FBN’s own privacy policy confirms it collects agronomic, financial,
              personal, and member-community data across a global service footprint and routes disputes to binding
              individual arbitration. FBN Finance now markets multiple credit products—from operating lines to farmland
              capital and a line of credit up to $15 million—so licensing, fair-lending, privacy, and servicing controls
              remain material. Public materials do not enumerate a complete state-by-state license footprint,
              delinquency profile, or warehouse-funding counterparties, which keeps residual legal and regulatory
              exposure only partially underwritten.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR040
