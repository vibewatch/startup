  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer/User/Payer
      - Workflow
      - Budget Owner
      - Adoption Trigger
      - FBN Fit
    rows:
      - - Large commercial farm (500+ acres, >$500K input spend)
        - Farm owner-operator or hired manager; payer is farm entity or operating lender
        - Bulk annual input purchasing with precision application and data management
        - Owner/CFO; lender approval for credit
        - Price margin savings + data integration + financing convenience
        - Strong — volume and digital readiness align with FBN's marketplace and finance
      - - Mid-size family farm (100–499 acres, $50K–$500K input spend)
        - Farm owner-operator; payer is farm owner or seasonal lender
        - Seasonal input replenishment with periodic price benchmarking
        - Owner
        - Price transparency, convenience, and access to competitive financing
        - Core — FBN's primary existing membership and transacting base
      - - Small family farm (<100 acres, <$50K input spend)
        - Farm owner-operator; payer is farm owner
        - Small-lot purchases; price sensitivity high relative to transaction cost
        - Owner
        - Ease of access to benchmark data; lower willingness to pay for services
        - Medium — reachable via free network but monetization economics challenging
      - - Cooperative member farm (any size)
        - Farm owner-operator; co-op manages purchasing on member's behalf
        - Co-op-mediated bulk purchasing with volume rebates
        - Co-op management + farm owner for non-co-op purchases
        - FBN useful for price benchmarking; limited switching incentive
        - Low-to-medium — co-op loyalty and pricing parity reduces switching motivation
      - - Beginning or transitional farmer
        - Farm owner-operator new to independence; payer is owner or family lender
        - Discovery, education, and access to credit and input sourcing
        - Owner
        - Financing access, agronomic education, and network support
        - Medium — growth segment with high lifetime value potential; lower near-term volume
    notes: >-
      Segments derived from USDA 2022 Farm Typology and FBN membership disclosures. Input spend ranges are illustrative
      order-of-magnitude estimates based on Census scale categories and USDA expenditure data. Cooperative member farms
      may overlap with large or mid-size farm categories; the FBN fit assessment applies to their purchasing behavior
      relative to FBN's value proposition.
