        title: Milestones and Strategic Events
        blocks:
          - type: paragraph
            body: >-
              FBN's history is marked by rapid growth followed by strategic restructuring. Key milestones include:
              founding in 2014 with the farmer data network concept; launch of the e-commerce marketplace (FBN Direct)
              in 2017; achievement of unicorn status with Series G funding in 2021 at $4 billion valuation; the CEO
