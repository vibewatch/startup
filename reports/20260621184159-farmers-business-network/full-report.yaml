          logistics infrastructure can match convenience if motivated
        - Medium
        - >-
          Confirm last-mile delivery unit economics, geographic coverage, and whether FBN has sustainable logistics cost
          advantage vs. incumbent spot delivery for comparable inputs
      - - Integrated FBN Finance bundling
        - >-
          Farm Credit System holds structural GSE cost-of-funds advantage; any rate competition by FBN Finance against
