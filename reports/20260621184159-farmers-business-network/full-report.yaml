      - number: '6.2'
        title: Acquisition Channels and Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              FBN's acquisition motion is clearly digital-first, but it is not purely self-serve. The ordering workflow
              shows 24/7 product search, price comparison, cart checkout, financing selection, delivery scheduling,
              order tracking, and saved shopping lists, which means a member can move from discovery to repeat purchase
              entirely online. At the same time, FBN layers in local agronomists, phone support, farm visits, account
              reps, and community events, so the acquisition stack mixes software convenience with agricultural
              relationship selling. Public adoption signals are meaningful even if they do not form a perfect cohort
              dataset. FBN reports 35% of farmers visited the platform when shopping for inputs, says online input
              buying grew 86% versus 2023, and says more farmers returned to purchase inputs in 2025 than ever before.
              The older 2024 interview adds a harder monetization anchor by disclosing about 16,000 transacting farmers,
              33,000 deliveries in 2023, and $1 billion of financing. Together, those sources show a real customer
              machine with broad top-of-funnel reach and repeat seasonal behavior, even though management still
              withholds the clean active-customer and conversion metrics investors would prefer.
