  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              FBN operates in an agricultural inputs, data, and finance market where incumbents have entrenched physical
              distribution, deep agronomist relationships, and cooperative ownership models that create powerful
              switching costs. The competitive set spans at least four distinct buckets: large-scale physical ag-input
              retailers such as Nutrien Ag Solutions and CHS that command thousands of retail locations; seed and
              crop-protection science companies such as Syngenta and BASF that sell through traditional distribution
              channels; precision-agriculture and farm-data platforms such as Climate FieldView and Granular that
              compete for farmer data relationships; and agricultural lenders such as the Farm Credit System and Farmer
              Mac that anchor farm finance. Adjacent players including Indigo Ag (grain marketing and carbon credits)
              and Bushel (digital grain origination) occupy the data and grain-commerce layer rather than the broad
              input marketplace. The status-quo substitute remains the local cooperative or independent dealer offering
              relationship-based, locally priced input purchasing without digital benchmarking. FBN's price-transparency
              positioning and direct-to-farm delivery address a genuine pain point, but the adverse evidence — including
              seed-relabeling controversy covered by agricultural media and publicly reported 2023 layoffs — underscores
              that differentiation alone does not guarantee durable market share gains against well-capitalized
              incumbents.
