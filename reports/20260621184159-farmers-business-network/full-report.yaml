      - number: '7.2'
        title: Business Model, Margin, and Farm-Cycle Risk
        blocks:
          - type: paragraph
            body: >-
              FBN’s marketplace is large enough to matter but still structurally exposed to conversion, margin, and
              macro-cycle risk. The most telling public datapoint came from FBN’s own interim-CEO interview in early
              2024: roughly 16,000 of nearly 80,000 members were transacting across inputs, financing, or Gradable,
              implying only about one in five members had converted into monetized activity at that point. Free
              membership doubled sign-ups, which improves reach, but also weakens the signal on member quality and
              monetization depth. The same interview disclosed 33,000 deliveries, $1 billion in financing, and $22
              million of Gradable premiums in 2023, confirming real throughput but not durable profitability. FBN also
              said it had to slash herbicide prices after a sharp market reversal, a reminder that input inventory can
              destroy margins when commodity cycles turn. That pressure compounds against a 2026 farm economy still
              described by USDA, Texas A&M AgriLife, and Farm Bureau sources as margin-sensitive and risk-management
              intensive. If growers face tighter income or volatile input budgets, FBN can be squeezed on both demand
              and credit quality at the same time.
            claimRefs:
