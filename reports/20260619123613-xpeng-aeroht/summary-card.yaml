  topStrengths:
    - >-
      AeroHT is one of the few eVTOL startups attempting a differentiated consumer-ownership form factor rather than a
      pure air-taxi fleet model.
    - >-
      XPENG parent backing and the Guangzhou factory meaningfully improve AeroHT's odds of reaching scaled manufacturing
      relative to weaker peers.
    - >-
      Public demand signals are stronger than most private peers, with thousands of pre-orders and a 600-unit Middle
      East order package before certification.
  topRisks:
    - >-
      CAAC type and production certification remain the gating milestone; commercial timing still depends on approvals
      that peers have taken years to obtain.
    - >-
      No public revenue, margin, or fresh valuation disclosures exist, so outside investors cannot confidently
      underwrite entry pricing or cash burn.
    - >-
      Sector history is poor: Lilium and Volocopter demonstrate that large raises and strong narratives do not protect
      eVTOL companies from insolvency.
  unresolvedGaps:
    - Updated post-Series-B valuation, cap-table terms, and any IPO timetable or bank mandates beyond press reports.
