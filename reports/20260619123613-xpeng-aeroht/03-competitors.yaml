callouts:
  - calloutType: risk
    title: Capital Exhaustion Is the Sector's Existential Risk
    body: >
      Lilium's 2024 insolvency and Volocopter's December 2024 insolvency filing prove
      that even well-funded eVTOL players can collapse before type certification.
      Lilium raised over $1B and still ran out of runway; Volocopter secured an $850M
      rescue package only after Mudrick Capital restructuring. AeroHT's $250M Series B
      covers near-term factory capex but may be insufficient for a multi-year CAAC
      type certification cycle under adverse capital-market conditions.
    claimRefs:
      - CP023
      - CP024
      - CP031
      - CP032

  - calloutType: insight
    title: EHang's Certification Lead Creates a 2–3 Year Domestic Moat
    body: >
      EHang holds the only CAAC type certificate for a pilotless human-carrying eVTOL
      and is the only company running commercial Air Operator Certificate flights in
      China. AeroHT and AutoFlight are still in certification; this 2–3 year lead gives
      EHang first-mover advantage in Chinese tourism and smart-city contracts that are
      difficult to displace once operator relationships and regulatory precedents are set.
    claimRefs:
      - CP001
      - CP002
      - CP004
      - CP005

  - calloutType: strength
    title: AeroHT's Modular Concept Targets an Underserved Consumer Niche
    body: >
      No competitor addresses the road-and-air integrated consumer lifestyle market
      at scale. Joby, Archer, and BETA target enterprise or operator buyers; EHang
      targets tourism operators. AeroHT's Land Aircraft Carrier—with 5,000 pre-orders
      and a target price under $280K—occupies a distinct niche analogous to premium
      supercars and may encounter less head-on competition than pure air-taxi players
      if the consumer pilot-licence requirement can be progressively relaxed.
    claimRefs:
      - CP036
      - CP037
      - CP038

