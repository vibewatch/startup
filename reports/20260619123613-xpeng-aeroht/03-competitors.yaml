  - id: certification-product-form-autonomy
    title: Certification Status, Product Form, and Autonomy Model
    body: >
      Certification posture is the single greatest differentiator among eVTOL players in
      2026. EHang leads the global pilotless segment: the EH216-S holds CAAC TC, PC, and
      SAC—the world's first—and EHang runs Air Operator Certificates for human-carrying
      commercial service. Its form factor (18-rotor multicopter, 2-seat, ~30km range,
      220kg payload) is suited to fixed-route tourism and short urban shuttles rather than
      flexible intercity travel. Joby's 5-pax + pilot tilt-rotor (200mph, 100mi range,
      45 dBA cruise) is in FAA Phase 4; its SR3 milestone confirmed test data meets FAA
      expectations with the first conforming TIA aircraft already flying. Archer's
      Midnight (4+1 pax, up to ~60mi range, tilt-rotor) closed Phase 3 in April 2026
      and is concurrently driving Phase 4 compliance. Both Joby and Archer require a
      licensed pilot; they are not autonomous. Wisk Gen 6 targets a rare regulatory
      pathway: fully autonomous operations with human supervisory oversight, no onboard
      pilot. This requires a distinct certification process (operation certificate) and
      de-risks long-term unit economics. BETA's ALIA eVTOL (certification target 2028)
      and ALIA CTOL (2027) pursue a stepwise approach: starting with defence and medical
      cargo where passengers are not required and regulatory scrutiny is lower. AutoFlight
      is working toward CAAC certification for Prosperity. Xpeng AeroHT filed a
      production certificate application with CAAC for the Land Aircraft Carrier;
      the CAAC accepted the application for review in 2025. The Land Aircraft Carrier
      requires a pilot licence to operate the flying unit, a significant consumer
      adoption barrier compared to EHang's fully pilotless model. Its tilt-rotor form
      factor (A868: high-speed long-range full tilt-rotor) targets longer range and
      higher speed than EHang's multirotor, but sits below Joby/Archer on range and
      payload due to the flying car's weight constraints.
