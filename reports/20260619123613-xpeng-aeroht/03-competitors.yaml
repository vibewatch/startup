  - id: moat-durability-and-adverse-evidence
    title: Moat Durability, Substitutes, and Adverse Competitor Evidence
    body: >
      The eVTOL sector's moat landscape is in flux. Joby's depth of FAA engagement
      (17+ years of certification work, SR3 audit complete, first conforming TIA aircraft
      airborne) and its $2.5B cash position give it the strongest Western moat: capital
      runway exceeds two years at current burn and the eIPP programme reduces
      go-to-market risk before formal type certification. Archer's $1.8B balance sheet
      and Phase 3 close place it a credible second. EHang's moat is the widest in China:
      it holds the only CAAC-certified pilotless eVTOL and is the only operator running
      commercial service; this regulatory head-start is durable for at least 2–3 years
      as competitors work through CAAC processes. AeroHT's moats are nascent: 12 years
      of R&D and 7 prototype generations provide engineering credibility, and the Xpeng
      parent (XPEV) supplies AI software, supply-chain, and distribution infrastructure.
      However, AeroHT holds no type certificate, its consumer pilot-licence requirement
      limits addressable market, and Western competitors hold structural advantages in
      FAA/EASA certification for the largest premium markets. Substitutes remain potent:
      helicopters serve the same rapid-transport use case with more payload and range,
      though at ~6–7× the operating cost per flight-hour; China's high-speed rail is a
      direct low-cost competitor for intercity routes below ~500km; urban ride-sharing
      (DiDi, taxis) dominates sub-50km trips. The adverse evidence profile is severe:
      Lilium (Germany) filed for insolvency in October 2024 after failing to raise
      €100M in emergency financing despite having raised over $1B via SPAC; its
      subsidiaries filed under German law and operations ceased. Volocopter scrapped
      Paris Olympics 2024 plans due to failed EASA engine certification and filed
      insolvency proceedings in December 2024 before a debt restructuring placed
      Mudrick Capital in majority control. Legal risk is acute: Joby sued Archer in
      November 2025 for corporate espionage; Archer counter-sued Joby alleging hidden
      Chinese ties and fraudulent parts labelling; Archer additionally sued Vertical
      Aerospace for Midnight patent infringement. These proceedings consume management
      attention and capital and signal that IP and certification timelines are contested.
