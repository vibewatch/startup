company:
  name: Xpeng AeroHT
chapter:
  number: 3
  title: Competitors
  summary: >
    Xpeng AeroHT competes in a bifurcated eVTOL landscape: a Chinese pilotless-autonomy
    segment led by EHang (CAAC type-certified, commercially operating) and a Western
    piloted air-taxi segment led by Joby and Archer (deep into FAA Phase 4/3
    with $2–2.5B in cash each). AeroHT's Land Aircraft Carrier modular flying car
    differentiates on consumer lifestyle positioning and road-plus-air utility, but
    faces mounting pressure from EHang's certification lead domestically and from
    well-capitalised Western players in export markets. Adverse evidence—Lilium's
    insolvency, Volocopter's bankruptcy filing, and ongoing Joby–Archer litigation—
    underscores that certification delay and capital exhaustion are existential sector risks.

sections:
  - id: landscape-and-direct-peers
    title: Competitive Landscape and Direct Peers
    body: >
      The global eVTOL competitive landscape divides along two primary axes:
      certification jurisdiction (CAAC vs FAA vs EASA) and autonomy model (pilotless
      vs piloted vs supervised autonomous). Within China, EHang is the dominant direct
      peer, holding the world's first CAAC type certificate, production certificate, and
      standard airworthiness certificate for a pilotless eVTOL and running commercial
      operations in Guangzhou and Hefei. EHang's EH216-S is a two-seat, 30km-range
      multi-rotor designed for tourism and urban-air shuttle; its VT35 targets longer
      intercity routes. AutoFlight (Shanghai) operates a 5-seat tilt-rotor Prosperity
      and completed the world's first cross-sea inter-city eVTOL demonstration
      (50km Pearl River Bay, February 2024), targeting intra-city urban transport at
      estimated fares of ¥200–300 per pax—roughly $28–41 USD. In the West,
      Joby Aviation (NYSE: JOBY) is the best-capitalised competitor with $2.5B in cash
      at Q1 2026 end, 1,700+ engineers, FAA Phase 4 under way, an FAA-conforming
      aircraft in flight testing, and eIPP partnership covering 12 US states for early
      operations in 2026. Archer Aviation (NYSE: ACHR) closed FAA Phase 3 in April 2026
      (first eVTOL to do so) and holds ~$1.8B in cash. Wisk Aero (Boeing-backed)
      pursues a fully-autonomous four-passenger model with 1,750+ safe test flights
      accumulated across five aircraft generations. BETA Technologies targets defence,
      cargo, and medical routes first and was selected for 7 of 8 US eIPP programme
      slots—the most of any company. Volocopter (German) narrowly avoided collapse
      in late 2024, filed insolvency proceedings in December 2024, was restructured
      under Mudrick Capital majority control, and secured up to $850M in April 2026.
      Xpeng AeroHT's Land Aircraft Carrier is positioned differently from all peers:
      a modular consumer flying car (eVTOL flight unit + ground EV carrier) rather
      than a point-to-point air taxi, with ~5,000 pre-orders and mass production
      targeted for late 2026 at under RMB 2M (~$279K).
