  - id: funding-history
    title: Funding History and Capital Structure
    body: >
      Xpeng AeroHT has assembled one of the largest disclosed funding pools in the global flying car
      sector. XPENG Inc. made an initial investment in July 2020, forming the corporate backbone
      for the subsidiary. In October 2021, the company closed a Series A round of over $500 million
      with a pre-money valuation exceeding $1 billion, marking the largest single financing deal in
      Asia's manned low-altitude aviation sector at the time; investors included IDG Capital, 5Y
      Capital, and XPENG itself. Additional funding from Rockets Capital followed in June 2022. After
      a nearly three-year gap, Xpeng AeroHT closed a $150 million Series B1 round on August 5, 2024,
      led by three state-owned investors from Guangzhou, and simultaneously launched a Series B2
      raise. On July 15, 2025, the company confirmed closing $100 million in Series B2, bringing the
      total Series B to $250 million and the cumulative disclosed funding to over $750 million
      (approximately 5.375 billion yuan). The latest capital is earmarked for the development, mass
      production, and commercialization of the Land Aircraft Carrier. Neither a current valuation nor
      an updated post-B2 cap table has been publicly disclosed. Bloomberg reported in May 2025 that
      XPENG was considering an IPO for Xpeng AeroHT and had invited several banks to participate,
      with a listing potentially in Hong Kong or the US. Du Chao's appointment as CFO in mid-2025
      is widely interpreted as a preparatory step for a capital markets event, though no timeline
      has been confirmed and the company has stated that its immediate focus remains on R&D and
      mass production.
