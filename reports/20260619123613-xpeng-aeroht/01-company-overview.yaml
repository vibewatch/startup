  - id: leadership-governance
    title: Leadership and Governance
    body: >
      Xpeng AeroHT's founding team combines aerospace engineering expertise with consumer
      technology experience rooted in the broader XPENG organization. Zhao Deli is the founder
      and president of Xpeng AeroHT, serving as the operational head responsible for R&D direction,
      product launches, and public-facing milestones such as the September 2024 Land Aircraft Carrier
      official launch event. He Xiaopeng, the chairman and CEO of parent XPENG Inc. (NYSE: XPEV,
      HKEX: 9868), also chairs Xpeng AeroHT and has been actively involved in public communications
      around factory milestones and fundraising. Wang Tan is a co-founder and serves as chief
      designer of the product portfolio, and has publicly represented the company's design philosophy
      at international events including Autocar's coverage of the Land Aircraft Carrier. In late
      June/July 2025, Du Chao was appointed as Xpeng AeroHT's first chief financial officer, a
      signal of accelerating IPO preparation. Du spent ten years at Deutsche Bank and led dozens of
      overseas IPO financing and cross-border M&A projects before joining the company. Key-person
      risk is non-trivial: He Xiaopeng's dual role as head of both the listed parent and the
      subsidiary concentrates strategic decision-making, while the CFO hire represents the company's
      first formal capital markets leadership. Board composition and governance documentation are not
      publicly available; the exact ownership split between XPENG Inc. and He Xiaopeng's personal
      stake has not been publicly disclosed. Any leadership change at XPENG Inc. could directly
      affect Xpeng AeroHT's strategic priorities and access to shared R&D resources.
    claimRefs:
