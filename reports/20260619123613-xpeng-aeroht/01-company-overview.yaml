callouts:
  - calloutType: risk
    title: Sector Execution Risk — Peer Insolvencies Signal Capital and Regulatory Hazard
    body: >
      Lilium, once valued at billions, filed for insolvency in October 2024 after failing to
      secure additional funding, illustrating that the eVTOL sector's capital intensity and
      regulatory complexity can overwhelm even well-funded players. Xpeng AeroHT's position is
      structurally stronger given its large disclosed funding base (>$750M) and parent backing,
      but multiple CAAC certification gates (TC, PC, Airworthiness Certificate, and Air Operator
      Certificate) must be passed before commercial revenue-generating operations can begin.
      Any certification delay or cost overrun in 2026 would extend the pre-revenue period and
      increase reliance on continued parent or investor support.
    claimRefs:
      - CO033
      - CO040
      - CO015

  - calloutType: strength
    title: State-Aligned Capital and Government Infrastructure Support Reduce Execution Risk
    body: >
      The Series B1 was led by three Guangzhou state-owned investors, and the company signed an
      investment and cooperation agreement with the Guangzhou Development Zone authorities that
      facilitated the factory's location in Huangpu. This state alignment provides access to
      subsidized land, infrastructure, and regulatory goodwill that peer eVTOL companies outside
      China typically lack, materially reducing factory development and permitting risk.
    claimRefs:
      - CO012
      - CO037

