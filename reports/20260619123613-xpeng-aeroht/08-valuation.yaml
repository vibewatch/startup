  - id: valuation-context
    title: "Valuation Context: Financing History and 2026 Private Mark"
    body: >-
      Xpeng AeroHT completed its Series A in October 2021, raising over $500M
      at a pre-money valuation exceeding $1B, with investors including IDG
      Capital and 5Y Capital. No subsequent round disclosed a post-money
      valuation mark: neither the $150M Series B1 (August 2024) nor the $100M
      Series B2 (July 2025) press releases contained a valuation figure. Total
      disclosed cumulative funding exceeds $900M. In preparation for a
      potential IPO, AeroHT appointed Du Chao—a Deutsche Bank veteran with a
      decade of experience in overseas IPO financings and cross-border M&A—as
      its first CFO in late July 2025. Bloomberg reported in May 2025 that
      Xpeng was considering an IPO for AeroHT and had invited several banks,
      with Hong Kong or the US as listing venues. No formal prospectus or
      exchange registration had been filed as of June 2026. The absence of a
      refreshed valuation mark, combined with a pre-revenue stage and
      certification uncertainty, makes pricing a high-uncertainty exercise.
      Entry discipline requires waiting for a disclosed mark or adjusting to
      the public comparable range with a material certification discount.
