  - id: scenario-analysis
    title: "Scenario Analysis: Bull, Base, and Bear Cases"
    body: >-
      The bull case envisions CAAC type certification awarded in H2 2027, a
      successful Hong Kong IPO at $3–5B on the back of 1,000+ annual deliveries
      at $280K average selling price, and strong Middle Eastern order
      conversion following the Dubai 600-unit purchase agreements signed in
      October 2025. This scenario requires sustained Xpeng parent support,
      no material certification setbacks, and a recovered eVTOL investor
      appetite following the 2024–2026 multiple compression. The base case
      sees certification in 2027–2028 after EHang-like delays, an IPO at
      $1–1.6B on a blend of comparable-adjusted multiples, and 500–800
      deliveries in year one post-certification. The bear case involves
      certification slipping beyond 2028 (or failing special conditions),
      a down-round financing at below the 2021 unicorn threshold, and
      eVTOL sector headwinds persisting through the decade. Sensitivity
      analysis shows that certification timing is the single largest value
      driver, followed by IPO exit multiple and order-to-delivery conversion
      rate. The recommended monitoring threshold for a re-rating to 'buy'
      is receipt of the CAAC type certificate plus a disclosed post-money
      term sheet above $2B.
