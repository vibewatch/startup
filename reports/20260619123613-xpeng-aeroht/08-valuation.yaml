chapter:
  number: 8
  title: Valuation
  summary: >-
    Xpeng AeroHT holds a >$1B unicorn anchor from its October 2021 Series A but
    has not disclosed an updated valuation mark in connection with its 2024–2025
    Series B financing totaling $250M. Public evidence supports a cautious
    'track' stance: the company is pre-revenue, CAAC type certification remains
    in an early compliance phase, comparable eVTOL public listings have declined
    sharply (Archer -33% over 12 months, Beta -50% from IPO, two sector
    bankruptcies), and capital intensity mirrors Archer Aviation at ~$170M+
    per quarter. A $1–1.6B base-case range is defensible on comps and
    stage-discounted multiples, but upside to $3–5B is conditional on
    certification and a successful IPO execution; the bear case includes
    down-round risk given sector multiple compression.

sections:
  - id: thesis-recommendation
    title: Investment Thesis, Anti-Thesis, and Recommendation
    body: >-
      Xpeng AeroHT presents a compelling narrative: Asia's largest flying car
      company by production intent, backed by a publicly listed parent (NYSE:
      XPEV), with the world's first mass-production flying car factory, over
      5,000 intent orders, and a CAAC certification process formally underway.
      The bull thesis rests on a genuine first-mover advantage in a modular
      flying car product category, a supportive Chinese low-altitude economy
      policy environment targeting over RMB 1 trillion ($138B) by 2026, and a
      CAAC certification process anchored by the EHang precedent. However, the
      anti-thesis is equally strong: AeroHT has no confirmed 2026 valuation
      mark, zero disclosed revenues, a certification timeline measured in
      years, and comparable eVTOL companies have experienced severe multiple
      compression or outright insolvency. The 2021 unicorn anchor of >$1B
      pre-money is now five years old and precedes all commercialization
      milestones. On a risk-adjusted basis, insufficient public evidence
      exists to support a buy call; TRACK is the appropriate stance pending
      CAAC type certification, a disclosed post-Series B valuation, or a
      credible IPO term sheet.
