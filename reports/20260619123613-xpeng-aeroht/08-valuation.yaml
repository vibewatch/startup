  - calloutType: assumption
    title: Valuation Assumption — 2021 Anchor and Stage Discount
    body: >-
      In the absence of a disclosed 2026 private mark, all scenario valuations
      are anchored to the 2021 >$1B pre-money figure adjusted by (a) comparable
      public eVTOL market data as of June 2026 and (b) a certification-stage
      discount of 30–50% reflecting AeroHT's earlier CAAC position vs. Joby's
      advanced FAA Phase 4 status. These adjustments are author estimates and
      should not be substituted for an actual disclosed mark.
    claimRefs:
      - CV034
      - CV035

