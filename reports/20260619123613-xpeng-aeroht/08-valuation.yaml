  - id: comparable-analysis
    title: "Public Comparable Analysis"
    body: >-
      The closest public comparables are Joby Aviation, Archer Aviation, and
      EHang. Joby (NYSE: JOBY) traded at approximately $9.94 per share in
      mid-June 2026 with an estimated market cap of approximately $7B+;
      it is the most advanced Western peer, having completed its first FAA
      conforming aircraft TIA flight and been selected across 12 US states
      under the eIPP program. Archer (NYSE: ACHR) reported Q1 2026 net loss
      of $217.7M on revenue of $1.6M, carried $1.78B in cash, and was down
      more than one-third from its 12-month high. EHang (Nasdaq: EH) is the
      only CAAC-certified peer, commercially operating its EH216-S; its
      market cap reflects a different (remotely piloted, lower-margin)
      product type. These comps imply a capital-raised multiple of 1.5–2.5x
      for advanced-stage peers, and a stage-adjusted range of $1–1.6B for
      AeroHT given its pre-certification position. Applying a Joby-equivalent
      multiple directly would overstate AeroHT's mark, as Joby is further
      in FAA certification and has an active US operations launch program.
      Two cautionary data points anchor the floor: Lilium (raised $1B+,
      bankrupt Oct 2024) and Volocopter (bankrupt Dec 2024) demonstrate that
      unicorn status does not insulate from insolvency in this capital-intensive
      sector.
