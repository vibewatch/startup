callouts:
  - calloutType: recommendation
    title: Recommendation — TRACK
    body: >-
      AeroHT earns a TRACK rating with low confidence. The company has
      demonstrated genuine technical and commercial progress but the public
      evidence base is insufficient to support a buy at any valuation. First
      buy signal: CAAC type certificate awarded AND disclosed post-Series B
      post-money mark exceeding $2B from credible institutional sources.
    claimRefs:
      - CV040
      - CV041

  - calloutType: risk
    title: Sector Insolvency Precedent — Adverse Signal
    body: >-
      Lilium (Oct 2024) and Volocopter (Dec 2024) both filed for insolvency
      despite having raised over $1B and $600M respectively, and despite
      active certification programs. These failures demonstrate that eVTOL
      unicorn status and institutional backing do not guarantee survival
      in the face of capital intensity and certification delays. AeroHT's
      pre-revenue position and unconfirmed CAAC timeline warrant explicit
      insolvency risk disclosure in any investor materials.
    claimRefs:
