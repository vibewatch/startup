callouts:
  - calloutType: risk
    title: Pilot-licensing gap blocks near-term individual buyer activation
    body: >-
      China's personal eVTOL pilot qualification rules are not yet published, meaning that UHNW buyers who
      take delivery of a Land Aircraft Carrier in 2026 may be unable to fly independently until CAAC issues
      framework-specific licensing. This is the single most actionable near-term constraint on buyer
      conversion from pre-order to active user, and creates uncertainty for AeroHT's 2026 delivery timeline.
    claimRefs: [CM039, CM038]

  - calloutType: insight
    title: Policy supercycle (2024–2030) is the strongest structural demand driver
    body: >-
      The sequential escalation from Government Work Report inclusion (2024) to NDRC bureau establishment
      (2024) to 15th Five-Year Plan designation (2026) creates a durable multi-year policy tailwind that
      differentiates the China low-altitude economy from prior speculative aviation waves. Investors should
      track the Guangdong provincial implementation plan as the most commercially relevant near-term signal
      for AeroHT's home market.
    claimRefs: [CM029, CM030, CM031]

  - calloutType: strength
    title: EV supply-chain cost advantage is structural, not cyclical
    body: >-
      China's globally dominant electric vehicle supply chain — including CATL-grade energy-dense batteries,
      precision motors, and fly-by-wire electronics — transfers directly to eVTOL construction. AutoFlight's
      preliminary cost modelling suggests operating costs at approximately 15 percent of helicopter equivalents.
      This is a structural advantage that cannot be easily replicated by Western incumbents relying on legacy
      aviation supply chains.
    claimRefs: [CM033, CM035]

