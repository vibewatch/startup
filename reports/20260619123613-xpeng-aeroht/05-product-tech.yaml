sections:
  - id: product-portfolio-evolution
    title: Product Portfolio and Architecture Evolution
    body: >
      Xpeng AeroHT's (rebranded ARIDGE in October 2025) product portfolio spans
      three distinct generations. The X2 eVTOL completed its maiden flight in
      2021 and demonstrated the company's core piloting and control capabilities,
      forming the technology foundation for the production programme. The second
      generation, the Land Aircraft Carrier (production codename X3-F plus Ground
      Mother Ship), was unveiled in October 2023 and completed its first public
      manned flight at the Guangzhou International Auto Show in November 2024.
      The third and most ambitious platform is the A868, a high-speed full
      tilt-rotor flying car with a hybrid-electric powertrain, targeting greater
      than 500 km range, greater than 360 km/h top speed, and six-seat capacity
      for the business travel and urban air mobility market. The company has
      accumulated seven prototype generations since 2018, with in-house R&D
      covering powertrain, composite materials, flight control, navigation, and
      aerial intelligence. As of June 2026, approximately 5,000 pre-orders have
      been received for the Land Aircraft Carrier and the total global pre-order
      count including Middle East orders reached more than 7,000 units by
      October 2025. The consumer price target is below RMB 2 million
      (approximately USD 280,000). The modular architecture—detachable eVTOL
      stored within the ground carrier—constitutes the company's core
      differentiation from all pure-play eVTOL competitors, though it also
      introduces novel certification and airworthiness challenges.
