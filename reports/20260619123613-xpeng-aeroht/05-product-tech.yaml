  - id: FE002
    title: Customer Flight Workflow — Drive, Deploy, Fly, Return
    type: flow
    layout: wide
    summary: >
      End-to-end operational flow for a Land Aircraft Carrier user from road
      transit through air module deployment, flight, autonomous landing, and
      recharge before the next flight. Nodes show user actions and key system
      events; edges show the operational sequence.
    approximationNotes: >
      Workflow derived from product demonstration videos, official product
      descriptions, and evtol.news technical coverage. Exact deploy time
      (described as automatic and fast), charge duration, and route-planning
      interface steps are based on company-reported figures; independent
      verification of these timings has not been published.
    data:
      nodes:
        - id: n1
          label: "Drive (GMS mode)"
          detail: "User drives GMS to departure point; air module stored and charging in rear compartment; >1,000km CLTC road range"
        - id: n2
          label: "Route Planning"
          detail: "Pilot uses smart route planning interface; ATC/UTM clearance assumed; departure point must have adequate landing pad or open area"
        - id: n3
          label: "Auto-Deploy"
          detail: "Single command triggers automatic deployment: GMS lowers, rear doors open, roof retracts, air module slides out on rails, landing struts and booms unfold, propellers arm"
        - id: n4
          label: "Pre-flight Check"
          detail: "System self-check; one-touch takeoff arm; pilot in cockpit with 6-in-1 joystick; autonomous or manual mode selection"
        - id: n5
          label: "VTOL Takeoff"
          detail: "Vertical lift via 6 VTOL propellers; 8-motor DEP redundancy active; altitude and position stabilisation"
        - id: n6
