  - id: manufacturing-readiness
    title: Manufacturing Readiness and Production Scale-Up
    body: >
      The Land Aircraft Carrier manufacturing facility in Huangpu district,
      Guangzhou covers 120,000 square metres and was built to aviation-grade
      quality standards while incorporating automotive-scale production
      efficiency. The factory was designed with a capacity of 10,000 units per
      year, with the initial production target set at approximately 5,000 units
      annually before ramping to full capacity. The production rate target for
      line throughput is one complete vehicle (GMS plus air module) every
      thirty minutes. Factory groundbreaking occurred in October 2024; trial
      production commenced in 2026. The facility integrates both aviation
      (airframe, composites, avionics assembly) and automotive (chassis, powertrain,
      body) production lines under one roof, reflecting the hybrid nature of the
      Land Aircraft Carrier as a regulated aviation product and a consumer
      road vehicle. Full-stack in-house R&D capabilities include powertrain
      development, carbon-fiber composite manufacturing, flight control system
      design, navigation software, and aerial intelligence algorithms—reducing
      external supplier dependency for core performance and safety systems.
      The company has signed more than sixty landing pad sites at general aviation
      airports, scenic destinations, cultural and tourism locations, and urban
      suburban sites, providing a nascent infrastructure network to support
      customer flight operations. Deliveries are scheduled to begin in 2026,
      contingent on receiving the standard airworthiness certificate and any
      required operating approvals from CAAC.
