  - id: competitive-architecture-benchmarking
    title: Competitive Architecture Benchmarking
    body: >
      Xpeng AeroHT's Land Aircraft Carrier occupies a unique but commercially
      constrained niche in the global eVTOL landscape. Its modular road-plus-air
      architecture has no direct equivalent: all major Western competitors (Joby,
      Archer, Wisk, BETA Technologies) are pure eVTOL aircraft without a ground
      carrier component, and EHang's EH216-S is a pilotless urban shuttle
      multirotor rather than a consumer lifestyle vehicle. However, AeroHT's
      pilot-licence requirement for the X3-F represents a significant consumer
      adoption barrier that EHang's fully pilotless model avoids entirely. Joby's
      five-plus-pilot-seat S4 tilt-rotor (200 mph, 100-mile range, 45 dBA cruise)
      is in FAA Phase 4 certification with SR3 complete, a conforming TIA aircraft
      flying, and eIPP early-operations coverage across twelve US states from 2026;
      its $2.5 billion cash position at Q1 2026 gives it the deepest Western runway.
      Archer's Midnight (four plus pilot, approximately 60-mile range) became the
      first eVTOL to close FAA Phase 3 in April 2026, holding approximately
      $1.8 billion in cash. BETA Technologies was selected for seven of eight
      eIPP slots, the highest proportion of any company, and targets a defence-then-
      cargo-then-passenger sequencing strategy. Wisk Aero (Boeing-backed) is the
      only fully-autonomous eVTOL candidate in advanced US testing, differentiating
      on long-run unit economics rather than near-term consumer adoption. AutoFlight
      (Shanghai) completed the world's first cross-sea inter-city eVTOL
      demonstration (50 km, Pearl River Bay) in February 2024 and is pursuing CAAC
      certification for its Prosperity tilt-rotor. The FAA's Advanced Air Mobility
      programme and eIPP infrastructure signal a well-developed US regulatory
      pathway for Western players, whereas the CAAC pathway remains novel and
      slower for flying car categories versus the already-certified pilotless
      multirotor category EHang occupies.
