  - id: certification-regulatory-progress
    title: Certification and Regulatory Progress
    body: >
      Xpeng AeroHT has made measurable but incomplete progress through the CAAC
      certification pathway for the Land Aircraft Carrier. The type certificate
      (TC) application for the X3-F flight body was formally accepted by the
      Civil Aviation Administration of China on March 21, 2024, marking the
      entry of a novel modular flying car into formal Chinese aviation regulatory
      oversight for the first time. The CAAC published special airworthiness
      conditions for the X3-F's novel design—a necessary step before compliance
      verification begins—reflecting the regulatory body's recognition of the
      unique challenge of certifying a vehicle that transitions between road and
      air use. As of mid-2025, the programme entered the compliance confirmation
      phase, where the manufacturer must demonstrate that the design meets each
      special condition through test data, analysis, or inspection. In parallel,
      the production certificate (PC) application for the X3-F airframe was
      accepted by CAAC in May 2025, reflecting sufficient maturity of the
      manufacturing system to enter production-certificate review. Both
      certificates—TC and PC—must be issued before a standard airworthiness
      certificate can be granted to individual aircraft. An air operator
      certificate (AOC) will be additionally required before scheduled commercial
      operations can begin. The company received a special flight permit from the
      UAE's General Civil Aviation Authority (GCAA) for the Dubai manned
      demonstration in October 2025, the first overseas manned flight permit
      granted to a Chinese flying car company. For context, EHang holds the
      world's first CAAC TC, PC, and standard airworthiness certificate for a
      pilotless eVTOL platform and is already running commercial air operator
      services under CAAC oversight, representing approximately a two- to
      three-year head start over AeroHT within the Chinese regulatory framework.
