  evidenceGaps:
    - type: private-evidence-only
      severity: moderate
      topic: DEP failure mode testing and fault-tree data
      missingEvidence: >
        No publicly available test data, fault-tree analysis, or CAAC compliance
        documentation describes the specific DEP failure modes tested for the X3-F
        (e.g., single-motor-out, dual-adjacent-motor-out, propeller detachment) or
        the resulting flight-envelope margins. AeroHT describes DEP as providing
        redundancy but does not publish the specific failure scenarios certified.
      whyItMatters: >
        DEP redundancy is the primary safety argument for the X3-F. Without
        knowing which failure scenarios have been modelled and tested, it is
        impossible to assess whether the claimed safety margins meet CAAC special
        airworthiness conditions and whether the current design will pass
        compliance confirmation without redesign.
      diligencePath: >
        Request X3-F airworthiness compliance data package from AeroHT; review
        CAAC special conditions docket for fault-tolerance requirements; assess
        whether published DEP research from comparable platforms provides reasonable
        analogues.
      relatedQuestionRefs: [QE004]

    - type: private-evidence-only
      severity: material
      topic: X3-F cruise speed and per-flight range
      missingEvidence: >
        The X3-F's maximum cruise speed and per-flight range under standard CAAC
        test conditions have not been publicly disclosed by Xpeng AeroHT or
        independently verified. Only GMS ground range (>1,000km CLTC) and
        number-of-flights-per-charge (5–6) are publicly stated; per-flight
        distance in km is absent from all available sources.
      whyItMatters: >
        Range per flight directly determines use-case viability (commute radius,
        scenic tour length, intercity connectivity) and is essential for comparing
        the X3-F against competing platforms on a like-for-like basis. Without
        this figure, TAM modelling for consumer sales is highly uncertain.
      diligencePath: >
        Request X3-F flight-test data summary from AeroHT investor relations;
        review CAAC compliance evidence submissions if accessible; cross-reference
        any announced flight demonstrations for approximate distance covered.
      relatedQuestionRefs: [QE002, QE006]

    - type: private-evidence-only
      severity: material
      topic: CAAC TC compliance confirmation completion timeline
      missingEvidence: >
        No public target date for completing the compliance confirmation phase of
        the X3-F type certificate has been disclosed. The exact number of compliance
        items outstanding, test rigs required, or expected sign-off quarters are
        unavailable from public sources as of June 2026.
      whyItMatters: >
        The TC issuance date is the single most important gating factor for
        commercial delivery timing. Any slip beyond Q4 2026 puts the 2026
        delivery target at risk and may require a capital raise before revenue.
      diligencePath: >
        Request CAAC compliance schedule and milestone tracker from AeroHT; obtain
        CAAC public docket on the X3-F application for listed compliance items;
        monitor CnEVPost and Electrek for any official CAAC announcement of TC
        issuance.
      relatedQuestionRefs: [QE023, QE030]

    - type: limited-access
      severity: moderate
      topic: Developer / open-source signal for flight software
      missingEvidence: >
        No GitHub repositories, open-source flight control libraries, JIRA/GitLab
        activity, or npm/PyPI packages are publicly attributable to Xpeng AeroHT's
        aerial intelligence or flight control engineering teams. Unlike
        software-native companies, eVTOL manufacturers do not typically publish
        flight-critical software to public repositories.
      whyItMatters: >
        Developer-signal proxies for software maturity (commit cadence, issue
        velocity, contributor count) are unavailable, making it impossible to
        independently assess the maturity of the flight control stack without
        insider access.
      diligencePath: >
        Request source code escrow terms and DO-178C equivalent documentation
        from AeroHT; review CAAC software compliance submissions if available
        under regulatory transparency rules.
      relatedQuestionRefs: [QE019, QE027]

    - type: private-evidence-only
      severity: moderate
      topic: 800V SiC first-in-flying-car claim verification
      missingEvidence: >
        The claim that the GMS features the "world's first 800V SiC range-extended
        hybrid in a flying car" originates from company marketing. No independent
        technical publication, automotive safety standards body, or aviation
        authority has confirmed this classification. Competing platforms or earlier
        EHang/AutoFlight configurations may use high-voltage SiC without publicising it.
      whyItMatters: >
        If the claim is inaccurate or narrowly scoped (e.g., only the specific
        combination of 800V + SiC + range-extender + flying car), it may be
        misleading for investors assessing IP differentiation in the GMS powertrain.
      diligencePath: >
        Review technical papers from SiC inverter suppliers (e.g., CATL, Huawei
        Digital Energy); verify with AeroHT engineering team in diligence session.
      relatedQuestionRefs: [QE024]

    - type: uncertain
      severity: moderate
      topic: A868 technical specifications and certification timeline
      missingEvidence: >
        All A868 specifications (range, speed, seat count, powertrain architecture)
        are company-stated development targets with no prototype demonstrated
        publicly and no CAAC certification application filed as of June 2026.
        Tilt-rotor certification under CAAC has no precedent; timeline to TC
        application is undisclosed.
      whyItMatters: >
        A868 is a key part of AeroHT's long-term revenue diversification and UAM
        market entry. If the A868 programme slips significantly, the company
        remains a single-platform consumer flying car business with a constrained
        TAM.
      diligencePath: >
        Request A868 programme roadmap and current TRL (Technology Readiness Level)
        assessment from AeroHT; verify engineering team headcount dedicated to
        A868 vs LAC programmes.
      relatedQuestionRefs: [QE013, QE022]
