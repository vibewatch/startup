company:
  name: Xpeng AeroHT
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Xpeng AeroHT's (ARIDGE) core product—the Land Aircraft Carrier—is a uniquely
    modular system pairing a six-wheeled hybrid-electric Ground Mother Ship (GMS)
    with the X3-F detachable eVTOL air module. The architecture's defining
    technical choices are DEP redundancy (6 VTOL propellers + 2 ducted fans,
    8 motors), a carbon-fiber airframe, an 800V SiC range-extending powertrain in
    the GMS delivering >1,000 km CLTC range, and single-stick six-in-one joystick
    controls with autonomous landing. As of mid-2026, the CAAC type certificate
    application (accepted March 2024) is in compliance confirmation phase and the
    production certificate application (accepted May 2025) is under review. Trial
    production commenced in 2026 at the 120,000 sqm Guangzhou factory targeting
    10,000 units/yr. A second platform, the A868 full tilt-rotor with >500 km
    range and >360 km/h speed, is in development. Key risks are the novel
    pilot-licence requirement limiting consumer TAM, unverified cruise speed and
    range claims, and no commercial flight authorisation yet. Against global peers,
    AeroHT is unique in its road-plus-air integration but lags EHang on domestic
    CAAC certification and Joby/Archer on international regulatory standing.

