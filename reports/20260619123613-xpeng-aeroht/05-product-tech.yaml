  - id: ground-mother-ship-powertrain
    title: Ground Mother Ship and Powertrain System
    body: >
      The Ground Mother Ship (GMS) is a purpose-designed six-wheeled, three-axle
      all-wheel-drive off-road van measuring approximately 5.5 metres in length
      and 2 metres in width. The chassis incorporates rear-wheel steering for
      improved low-speed manoeuvrability and provides seating for four to five
      occupants. The defining technical innovation in the GMS is the world's
      first 800V silicon carbide (SiC) range-extended hybrid powertrain deployed
      in a flying car application. This system delivers a CLTC range exceeding
      1,000 km on the ground, enabling long-distance road travel between flight
      waypoints, while simultaneously recharging the X3-F air module batteries
      during transit. The GMS roof and rear section open automatically when the
      air module deploys, with two rear doors opening and the rear roof panel
      retracting to allow the module to slide out on its rail system and then
      settle onto the ground for final arm and propeller deployment. A roof-mounted
      luggage rack, folding front grille, and extendable awning are integrated for
      camping and leisure use, consistent with the company's initial target market
      of wealthy lifestyle-oriented consumers. The A868 second-generation
      platform will feature a distinct hybrid-electric tilt-rotor powertrain
      architecture tuned for high-speed intercity flight rather than the
      short-hop multi-rotor profile of the X3-F, representing a separate
      engineering programme with its own certification track.
