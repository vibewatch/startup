slug: xpeng-aeroht
runDate: 2026-06-19
company:
  name: Xpeng AeroHT
chapter:
  number: 4
  title: Financials
  summary: >
    Xpeng AeroHT (rebranded ARIDGE) has raised over $900 million to date—including a
    $250 million Series B—to fund the world's first mass-production flying car factory.
    The Land Aircraft Carrier is priced at ≤ RMB 2 million (~$280,000) with more than 7,000
    global pre-orders, but the company remains pre-revenue with no disclosed burn rate,
    gross margin, or balance sheet. Peer eVTOL data (Archer ~$172M quarterly loss, Joby
    $2.5B cash burn) and Lilium's 2024 insolvency underscore the sector's extreme capital
    intensity; AeroHT's certification-dependent delivery timeline is the principal
    financial risk to underwriting.

sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing
    body: >
      Xpeng AeroHT's primary revenue stream is outright hardware vehicle sales of the Land
      Aircraft Carrier modular flying car system. The product consists of two components: an
      air module (the X3-F eVTOL multicopter, code-named X3-F) and a ground mothership van
      that stores and recharges it. Founder and President Zhao Deli confirmed in September 2024
      that the unit will be priced at no more than RMB 2 million (~$280,000 USD at prevailing
      rates), making it the cheapest announced product at this vehicle class globally. The
      company began accepting pre-orders in Q4 2024. As of October 2025, global pre-orders
      exceeded 7,000 units, including 600 confirmed purchase agreements in the Middle East
      signed with Ali & Sons (UAE), Almana Group (Qatar), and ALSAYER Group (Kuwait) at the
      Dubai showcase event. The 600-unit regional order was reported as the largest bulk
      overseas purchase in the flying-car sector. After-sales revenue streams—maintenance,
      pilot training, and software-as-a-service flight services—have been referenced in
      company marketing under the ARIDGE brand but are not quantified in any public document.
      The company rebranded from XPENG AEROHT to ARIDGE in October 2025 to signal its
      transition from R&D to commercial scale. No commercial deliveries have been confirmed
      as of the run date. Revenue recognition has not yet begun.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001

  - id: capital-structure-and-funding
    title: Capital Structure and Funding History
    body: >
      Xpeng AeroHT has completed four distinct financing events totalling over $900 million
      in disclosed external capital. The Series A round, closed October 2021 at a pre-money
      valuation exceeding $1 billion, raised more than $500 million—the largest single
      financing in Asia's manned low-altitude aviation sector at the time—with investors
      including IDG Capital, 5Y Capital, and Xpeng Motors. A three-year gap preceded the
      Series B1 tranche of $150 million, closed in August 2024 and led by three state-owned
      investors in Guangzhou, followed by the Series B2 tranche of $100 million, completing
      the $250 million Series B in July 2025. Electrek noted total disclosed funding exceeds
      $750 million from Series A+B, with InsideChina Auto and others citing total capital
      including XPEV equity at over $900 million. In June/July 2025, Xpeng AeroHT appointed
      Du Chao—a Deutsche Bank banker with ten years of overseas IPO experience—as its first
      CFO, a widely interpreted signal of IPO preparation. Bloomberg reported in May 2025
      that Xpeng had invited banks to pitch for an AeroHT IPO in Hong Kong or the US;
      management said the IPO timing remained undisclosed with near-term focus on R&D and
      mass production. Post-Series B2 valuation has not been disclosed. The Series A
      pre-money benchmark of $1 billion likely understates the current implied valuation
      given the production facility investment and pre-order backlog.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
