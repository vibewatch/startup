        - Request AeroHT standalone balance sheet as at latest quarter-end
      - - Total capex committed for Guangzhou factory
        - Cannot model invested capital or depreciation; distorts return multiples
        - Request capex schedule, depreciation policy, and milestone-linked disbursements
