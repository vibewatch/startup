  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: burn-rate
      missingEvidence: Monthly or quarterly cash burn statements for Xpeng AeroHT
      whyItMatters: Cannot assess capital adequacy, runway, or bridge-financing risk without burn data; core to financial underwriting
      diligencePath: Request monthly management accounts and cash flow statements from company inception through latest quarter
      relatedQuestionRefs:
        - QI003

    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Bill of materials, gross margin, and COGS for the Land Aircraft Carrier
      whyItMatters: Core profitability metric; without it no unit economics model can be built; the ≤ RMB 2M ASP may not cover aviation-grade production costs
      diligencePath: Request audited BOM, manufacturing cost build-up, and target gross margin from company management; compare to Joby/Archer pre-IPO disclosures
      relatedQuestionRefs:
        - QI004
        - QI017

    - type: private-evidence-only
      severity: blocking
      topic: capex
      missingEvidence: Total capital expenditure committed and incurred for the Guangzhou manufacturing facility
      whyItMatters: Cannot model invested capital, depreciation charge, or IRR without facility capex; also determines cash adequacy
      diligencePath: Request capex schedule, milestone-linked disbursements, and any government grant or subsidy offsets
      relatedQuestionRefs:
        - QI007

    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: Post-Series B2 implied company valuation or latest 409A / fairness opinion
      whyItMatters: Without a valuation anchor, secondary transactions and IPO pricing cannot be assessed; Series A pre-money ($1B) is likely stale
      diligencePath: Request latest 409A valuation or third-party fairness opinion contemporaneous with the B2 close
      relatedQuestionRefs:
        - QI008

    - type: private-evidence-only
      severity: blocking
      topic: disclosure
      missingEvidence: Xpeng AeroHT standalone balance sheet and cash on hand
      whyItMatters: Parent 20-F does not break out AeroHT; cash, debt, and working capital position entirely unknown
      diligencePath: Request AeroHT standalone audited balance sheet; note that pre-IPO companies in China typically provide VIE-level financials upon request
      relatedQuestionRefs:
        - QI025

    - type: private-evidence-only
      severity: material
      topic: pre-orders
      missingEvidence: Pre-order deposit terms, refundability, and legal enforceability of purchase agreements
      whyItMatters: "More than 7,000 units may represent non-binding intent; without binding terms the backlog is a marketing metric rather than a revenue commitment"
      diligencePath: Obtain standard purchase agreement template; confirm deposit amount, refund conditions, and conversion track record from deposits placed
      relatedQuestionRefs:
        - QI013

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Buyer financing model and availability for the ~$280,000 Land Aircraft Carrier
      whyItMatters: At $280K, most individual buyers require financing; without an identified financing partner, pre-orders may not convert
      diligencePath: Clarify whether XPEV's financial services arm or bank partners will offer vehicle financing; check any announced leasing or fleet-purchase programs
      relatedQuestionRefs:
        - QI030

    - type: private-evidence-only
      severity: minor
      topic: revenue-model
      missingEvidence: After-sales, maintenance, training, and software revenue model with pricing and attach-rate assumptions
      whyItMatters: Long-term value of the platform depends heavily on recurring revenue; aspirational references exist but no financial model has been published
      diligencePath: Request 3-year financial model including MRO revenue per unit, pilot training revenue, and SaaS attach rates from company management

