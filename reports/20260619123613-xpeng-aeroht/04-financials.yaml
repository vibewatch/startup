  - id: manufacturing-capex-and-capacity
    title: Manufacturing Capex and Capacity Buildout
    body: >
      Xpeng AeroHT is constructing a dedicated flying car manufacturing base in the
      Guangzhou Development Zone. Construction began October 2024 following a signed
      investment and cooperation agreement with local authorities. The facility is designed
      for an annual production capacity of 10,000 units, applying automotive-scale assembly
      practices to aviation-grade quality requirements. As of May 2025, the factory was 70%
      complete, with the main structure of the final assembly shop, paint shop, joining shop,
      and compounding shop finished. The factory was topped out (structural completion) by
      July 2025 and is expected to reach full operational readiness in Q4 2025. The company
      has not disclosed the total capex commitment for the facility. Benchmarking against
      Joby Aviation, which paid $126 million for Hawthorne Airport and is scaling a 700,000
      sq ft Ohio facility, suggests eVTOL-grade manufacturing requires mid-to-high three-digit
      million USD investments for credible first-generation capacity. Xpeng AeroHT's factory
      targets 10,000 units annually, which at a ≤ RMB 2M ASP implies a theoretical gross
      revenue ceiling of approximately RMB 20 billion (~$2.8 billion) per year at full
      utilization—a figure that hinges entirely on certification, consumer adoption, and
      unverified cost economics. The ground mothership vehicle will also be manufactured at
      or near the same site, adding supply chain complexity.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
    figureRefs:
      - FI004

  - id: unit-economics-and-evidence-gaps
    title: Unit Economics, Burn Rate, and Evidence Gaps
    body: >
      No financial statements, management accounts, or investor update letters for Xpeng
      AeroHT have been made public. The company is a private entity majority-owned by
      Xpeng (NYSE: XPEV); XPEV's 20-F filed April 16, 2026 covers the consolidated parent
      but does not break out AeroHT segment financials separately. As a result, gross margin,
      COGS, quarterly burn rate, and current cash balance are all unknown. The Land Aircraft
      Carrier is an aerospace-class manufactured product requiring carbon-fiber composites,
      eight electric motors, battery packs, and aviation-grade avionics—component categories
      that carry high unit costs with no disclosed supplier pricing. An ASP of ≤ RMB 2 million
      implies the company must achieve manufacturing economics comparable to high-end
      automotive despite the product's aerospace certification requirements. This gap between
      aspirational list price and achievable cost is the most material underwriting unknown.
      Peer data from Joby Aviation (Q1 2026: $2.5 billion cash, ~$175 million quarterly
      operating loss before first commercial revenue) and Archer Aviation (Q1 2026: $172.5
      million quarterly adjusted EBITDA loss, $1.8 billion liquidity, $1.6 million revenue)
      illustrates the sector-wide cash intensity before commercialization. Scaled to
      AeroHT's likely size, a quarterly burn could plausibly fall in the $50–200 million
      range, but this is an industry inference, not a company disclosure. Pre-order
      deposit terms and enforceability are also undisclosed, making the $7,000+ order
      backlog difficult to evaluate as committed revenue.
    claimRefs:
      - CI029
      - CI030
      - CI031
      - CI032
