      - - Pre-order deposit terms and enforceability
        - ">7,000 units may not represent firm revenue commitments; cancellations unquantified"
        - Obtain standard purchase agreement template; confirm refundable vs. non-refundable
      - - XPEV parent subsidy / intercompany transfers
        - AeroHT may receive below-market manufacturing support; inflates standalone economics
        - Require related-party transaction disclosure and arm's-length pricing confirmation
      - - After-sales and software revenue model
        - Key for long-term value; unquantified aspirational references only
        - Request 3-year revenue model for MRO, training, and SaaS attach rates
