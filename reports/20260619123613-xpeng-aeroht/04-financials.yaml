  - id: peer-benchmarking-and-capital-intensity
    title: Peer Benchmarking and Sector Capital Intensity
    body: >
      The eVTOL sector is structurally pre-revenue and capital-intensive. Public comparables
      show that leading Western players reached the market with multi-billion-dollar war
      chests: Joby Aviation held $2.5 billion in cash as of Q1 2026 and Archer Aviation held
      $1.8 billion, both without meaningful commercial revenue. Germany's Lilium, which had
      raised over $1 billion before filing for insolvency in October 2024, illustrates the
      tail risk when certification timelines slip and bridge funding dries up. AeroHT's total
      disclosed capital of $900 million is below the Western leaders' current liquidity
      positions, though AeroHT benefits from: (a) China's state-backed low-altitude economy
      policy, which eases permitting; (b) Xpeng Motors' manufacturing ecosystem and balance
      sheet as a strategic backstop; and (c) a land vehicle component that dilutes pure
      aviation capital requirements. CNBC reported in May 2026 that sector-wide lawsuits,
      certification delays, and declining stock prices (Archer −9%, Vertical Aerospace −50%,
      Beta Technologies −50% from IPO) were souring investor appetite, a risk that could
      affect AeroHT's IPO window and future private round access. China's domestic eVTOL
      market context is somewhat insulated from US/European headwinds but not immune to
      investor sentiment shifts. The 600-unit Middle East order (≈ $168M at list price) is
      notable but its revenue recognition is contingent on CAAC certification and production
      ramp, neither of which is complete as of the run date.
    claimRefs:
      - CI039
      - CI040
      - CI041
      - CI042
      - CI043
      - CI044
      - CI045
    figureRefs:
      - FI003

  - id: financial-verdict
    title: Financial Verdict and Diligence Blockers
    body: >
      Xpeng AeroHT presents a pre-revenue hardware business at the intersection of aerospace
      and automotive manufacturing, financed by over $900 million of disclosed capital and
      backed by a strategic parent (XPEV) with manufacturing and regulatory relationships in
      China. The revenue model is straightforward—unit vehicle sales at a capped list price—
      but the key financial inputs for underwriting are unavailable: gross margin, COGS,
      burn rate, cash on hand, capex committed, and post-Series B2 valuation are not in the
      public domain. The >7,000 pre-order pipeline and 600-unit Middle East agreements imply
      demand signal but cannot be converted to revenue forecasts without production and
      certification confirmation. The company's certification path (TC and PC applications
      both accepted by CAAC, compliance confirmation phase underway) and planned 2026
      delivery suggest the pre-revenue window should be short if timelines hold—but Lilium's
      collapse and Western peers' continued slippage warrant scenario analysis on a
      12–24 month delay. At RMB 2 million per unit and 10,000 units per year, the theoretical
      revenue ceiling (~$2.8B annualized) is large; the key question is what gross margin
      remains after aviation-grade COGS, SG&A, and after-sale support. Any investor or
      acquirer must obtain audited financials, burn rate disclosure, and a capex schedule
      before completing financial due diligence. The IPO path signals eventual transparency,
      but timing is management-dependent.
    claimRefs:
      - CI046
      - CI047
      - CI048
      - CI049
      - CI050

