callouts:
  - calloutType: risk
    title: No Financial Transparency — Core Underwriting Blocker
    body: >
      Xpeng AeroHT has disclosed no audited or management-account financials. Burn rate, gross
      margin, cash balance, and capex committed are all unknown. Any financial model is
      speculative until the company provides the disclosures listed in the Public Financial
      Gaps table. The IPO preparation signal (CFO hire, bank pitches) suggests transparency
      will arrive, but the timing is management-dependent. Investors should treat the current
      financial picture as entirely black-box.
    claimRefs:
      - CI029
      - CI031
      - CI032
      - CI033
      - CI046

  - calloutType: risk
    title: Lilium Capital Risk Analog — Sector-Level Warning
    body: >
      Lilium raised over $1 billion before filing for insolvency in October 2024 when it could
      not raise a $100 million emergency bridge. The parallel risk for AeroHT is a certification
      delay that extends the pre-revenue period and forces a bridge round into a cold IPO
      window. AeroHT's $900M+ in disclosed capital is above Lilium's peak but below Joby's
      or Archer's current liquidity buffers. If CAAC Type Certification slips beyond H2 2026,
      the funding gap risk becomes material.
    claimRefs:
      - CI039
      - CI040
      - CI041
      - CI042
      - CI043
      - CI044

  - calloutType: strength
    title: Pre-Order Backlog Provides Demand Validation
    body: >
      More than 7,000 global pre-orders including a 600-unit Middle East bulk purchase provide
      meaningful demand validation at the $280K list price. At list price and full conversion,
      the backlog represents approximately $1.96 billion in potential revenue. This is not
      revenue until delivered and accepted, but it reduces the commercial risk relative to
      pure technology-development bets in the sector.
    claimRefs:
      - CI005
      - CI006
      - CI007

