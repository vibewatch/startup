callouts:
  - calloutType: risk
    title: Zero Delivered Units — All Customer Proof Is Forward-Looking
    body: >
      As of mid-2026, Xpeng AeroHT has not delivered a single Land Aircraft Carrier to any customer. The entire
      customer evidence base—7,000+ global pre-orders, 600 Middle East purchase agreements, 200+ flight camp
      partnerships—is pre-delivery, forward-looking, and largely unaudited. The absence of delivered units means
      that key diligence variables (product reliability in customer hands, NPS, repeat-purchase intent, churn) cannot
      be assessed. This is the defining limitation of any customer analysis at this stage.
    claimRefs:
      - CU016
      - CU033
      - CU034

  - calloutType: insight
    title: Middle East as First International Consumer Market
    body: >
      The Dubai October 2025 event—yielding 600 purchase agreements and a special flight permit from the UAE's
      GCAA—establishes the Middle East as Xpeng AeroHT / Aridge's most concrete international demand foothold.
      High-net-worth consumer density, government enthusiasm for advanced air mobility, and the UAE's track record
      as an early adopter of novel transport (e.g., Joby's Dubai six-year exclusive partnership) make the Gulf
      a plausible first international commercial market, though all sales remain contingent on local regulatory
      certification by 2027.
    claimRefs:
      - CU019
      - CU021
      - CU022

