  - id: TU004
    title: Expansion and Concentration Risk
    columns:
      - Expansion Driver / Risk Vector
      - Concentration Risk
      - Impact
      - Diligence Path
    rows:
      - - Middle East distributor block (600 vehicles, 3 GCC distributors)
        - "High — single multi-party event; ~8.5% of claimed 7K total; no disclosed deposits"
        - Cancellation would materially reduce reported pipeline and signal weak international demand
        - Obtain contract summaries including deposit amounts, delivery conditions, and penalty clauses from Ali & Sons, Almana, ALSAYER
      - - Domestic HNW individual buyers (~4K+, anonymous)
        - "Medium–high — highly dispersed by count, but no named, auditable commitments; binding status unknown"
        - Mass cancellation or low conversion rate would expose product-market fit gap before launch
        - Conduct customer survey or obtain escrow/deposit evidence to convert "intent" to verified committed orders
      - - Flight camp channel (200+ camps, SME operators)
        - "Medium — high partner count mitigates single-operator concentration, but each camp is a small-ticket counterparty"
        - If early flight experience is disappointing (safety incidents, reliability), word-of-mouth can impair future pre-sales
        - Track camp-level ticket sales, utilization, and operator renewal rates once units are deployed
      - - CAAC type certification dependency
        - "Critical — single regulatory body controls delivery gating; no TC = no delivery = no revenue"
        - If TC is delayed 12–18 months beyond expected 2026, deliveries slip and customer cancellation risk rises sharply
        - Monitor CAAC special conditions publication timeline, EH216-S precedent (>20 months from SCs to TC), and Aeroht certification progress reports
      - - Geographic concentration in China + Middle East
        - "Medium — China domestic and GCC are the only active markets; US/EU excluded by geopolitics and certification gaps"
        - Geopolitical or regulatory disruptions in either region could halt demand without alternative market offset
        - Assess EU/US certification pathway feasibility and timeline; monitor trade-control environment for Chinese aerospace exports
    notes: "Risk assessments are qualitative, based on public announcements and sector comparables. Impact magnitudes are relative to the stage of the business (no delivered vehicles); all estimates are illustrative."
    claimRefs:
      - CU035
      - CU036
      - CU026
      - CU030

  - id: TU005
    title: Retention and Fleet Health Metrics — Availability Status
    columns:
      - Metric
      - Definition
      - Availability for Land Aircraft Carrier
      - Earliest Proxy / Comparable
      - Why It Matters
    rows:
      - - Net Revenue Retention (NRR)
        - Expansion-adjusted revenue from existing customers year-over-year
        - "Not applicable — no delivered fleet; no revenue from product sales"
        - No proxy; flight camp ticket revenue not disclosed
        - Primary measure of whether delivered customers expand usage; absence means demand sustainability is unproven
      - - Gross Revenue Retention (GRR)
        - Revenue from existing customers excluding expansion
        - "Not applicable — same reason as NRR"
        - No proxy
        - Shows baseline stickiness after initial purchase; immeasurable pre-delivery
      - - Churn Rate
        - Rate at which customers cancel or non-renew within a period
        - "Not applicable — no customer cohorts exist"
        - Pre-order cancellation rate could be estimated with deposit/contract data; not disclosed
        - Measures product market fit durability; especially relevant if economic downturn reduces HNW discretionary spending
      - - Cohort Renewal / Repeat Purchase
        - Percentage of customers purchasing a second unit or service renewal
        - "Not applicable — no delivered units"
        - EHang EH216-S repeat orders from tourism operators is nearest public comparable
        - Indicates whether early adopters validate the product; critical signal for institutional fleet buyers
      - - Net Promoter Score (NPS)
        - Customer satisfaction and recommendation likelihood (0–10 scale)
        - "Not available — no post-delivery customer interactions"
        - Flight camp attendee satisfaction surveys not publicly disclosed
        - Would indicate whether experiential model creates loyal advocates ahead of vehicle delivery
    notes: "All metrics are structurally unavailable because no Land Aircraft Carrier production units have been delivered as of 2026-06-19. The earliest that any of these metrics could be observed is after first deliveries commence and customers begin operating the vehicles. This table documents the evidence gap explicitly."
    claimRefs:
      - CU033
      - CU034
      - CU039

