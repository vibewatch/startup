company:
  name: Xpeng AeroHT
chapter:
  number: 6
  title: Customers
  summary: >
    Xpeng AeroHT's customer proof through mid-2026 consists entirely of pre-orders and intent orders—reportedly
    exceeding 7,000 units globally including a 600-vehicle Middle East bulk deal signed in Dubai in October 2025—with
    zero delivered vehicles to date. Domestic channels rely on approximately 200 flight camp partnerships oriented toward
    experience tourism and pilot training, while overseas distribution is anchored by three named Gulf distributor
    groups (Ali & Sons, Almana, ALSAYER). No retention, repeat-purchase, or fleet utilization data exists; a ~$280,000
    price point, incomplete CAAC type certification, and sector-wide timeline slippage represent the dominant adoption
    frictions ahead of planned 2026 mass production deliveries.

sections:
  - id: customer-segments
    title: Customer Segments and Buyer Profiles
    body: >
      Xpeng AeroHT targets three primary buyer segments for the Land Aircraft Carrier: high-net-worth individuals
      (HNW) seeking personal transportation combining driving and short-haul flight; flight camp operators and tourism
      companies acquiring units for passenger experience services and pilot training; and institutional or government
      buyers in emergency services, research, and potentially military use. Overseas, the company is targeting
      international distributors in the Gulf Cooperation Council region and, eventually, other high-GDP markets where
      regulatory frameworks for eVTOL are emerging. The co-founder and chief designer Wang Tan articulated the
      dual-hobbyist archetype at CES 2025: pilots who want to travel with their own eVTOL, and off-road enthusiasts
      who want an additional aerial dimension. The Land Aircraft Carrier's six-wheel all-terrain ground module and
      panoramic two-seat air module are specifically designed to appeal to these buyer profiles. At approximately
      RMB 2 million (~$280,000 USD), the addressable buyer pool is narrowly restricted to affluent individuals and
      well-capitalized institutional operators. No enterprise fleet buyers or government procurement contracts have
      been publicly disclosed as of mid-2026; institutional demand remains aspirational rather than contracted.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: preorder-pipeline
    title: Pre-Order Pipeline and Demand Evidence
    body: >
      Evidence of customer demand is composed almost exclusively of pre-orders and intent orders. In August 2024,
      when Xpeng AeroHT announced its $150M Series B1, the company disclosed that it had signed deals with nearly
      60 flight camps, representing the earliest commercial channel engagement. By November 2024, when the Land
      Aircraft Carrier made its first public crewed flight at the Guangzhou Auto Show, the company cited approximately
      2,000 orders at the RMB 2M price. Autocar reported over 3,000 intent orders around the January 2025 CES debut.
      A major step in international demand came in October 2025 when Xpeng AeroHT (rebranded to Aridge) conducted
      a manned public flight in Dubai and signed purchase agreements with four buyer groups for 600 vehicles—the
      largest single overseas bulk purchase reported in the flying-car sector. Combined with domestic pre-orders, the
      company claimed total global orders exceeding 7,000 units. By mid-2026, Chinese government-sourced press reports
      cited 4,000+ pre-orders domestically with over 200 flight camp partnerships. The key interpretive caveat is
      that none of these figures have been independently audited; publicly available information does not disclose
      deposit amounts, contractual penalty clauses, or financing terms associated with these intent orders, making
      it impossible to distinguish binding committed orders from revocable expressions of interest.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
