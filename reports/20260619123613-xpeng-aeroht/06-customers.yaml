      - FU003

  - id: adoption-frictions
    title: Adoption Frictions and Regulatory Risk
    body: >
      Multiple structural barriers limit Xpeng AeroHT's ability to convert pre-orders into delivered fleet customers
      within its stated 2026 timeline. First, the CAAC's acceptance of the production certificate application in
      May 2025 and the launch of a public consultation on special certification conditions for the X3-F eVTOL
      confirm that type certification remains in progress rather than complete; only EHang's EH216-S has received
      full CAAC type certification for a human-carrying eVTOL. The certification precedent from EHang took over
      20 months from special conditions publication to type certificate. Second, the $280,000 price point makes
      the Land Aircraft Carrier a luxury-tier product with a narrow buyer pool; mass adoption requires a future
      lower-priced vehicle. Third, the broader eVTOL sector has demonstrated a pattern of timeline slippage and
      capital risk. Lilium—once valued above $1 billion—filed for insolvency in October 2024 after failing to
      secure government bridge financing, illustrating that pre-order pipelines and strong brand recognition do
      not protect against capital shortfalls. As of May 2026, sector-wide litigation in the US (Joby vs. Archer,
      Archer vs. Vertical) was cited by experts as further eroding investor confidence and delaying commercial
      certification timelines. Fourth, the Land Aircraft Carrier delivery schedule has already slipped from Q4
      2025 to 2026, consistent with industry norms. Fifth, the absence of pilot licensing infrastructure and
      vertiport/landing pad networks at scale remain system-level barriers for mass customer deployment.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
    tableRefs:
      - TU004

  - id: retention-concentration
    title: Retention, Fleet Proof, and Concentration Gaps
    body: >
      Because the Land Aircraft Carrier has not yet been delivered to any customer, all conventional customer-health
      metrics—net revenue retention, gross revenue retention, churn rate, renewal rate, and cohort retention—are
      necessarily absent. No independent third-party reviews, customer outcome case studies, or satisfaction surveys
      exist for the product. The closest operational analogue is the X1 and X2 eVTOL demonstrators used for flight
      camps and airshow demonstrations, but these preceded the current commercial product and no repeat-purchase or
      lease-renewal data has been disclosed. On concentration risk, the claimed order book carries material
      geographic and distributor concentration: the 600-unit Middle East bulk deal represents approximately 8.5%
      of the claimed 7,000-unit total but is concentrated through a single multi-party event agreement with parties
      whose institutional buying capacity and financing commitment have not been independently verified. Domestic
      concentration is difficult to assess because the ~4,000+ domestic intent-order figure is anonymous and
      aggregated. The flight camp channel mitigates pure HNW individual concentration somewhat, but each flight
      camp is itself an individual SME operator, creating hundreds of small-volume counterparties rather than
      enterprise fleet buyers. Policy support from China's government—including the explicit inclusion of the
      low-altitude economy in the 2025 government work report and a projected RMB 1 trillion+ market by 2026—provides
      a favorable demand backdrop, but macropolicy support does not substitute for individual customer delivery
      proof. Until the factory in Guangzhou completes its first production deliveries and customers begin operating
      the vehicles, all forward retention and expansion metrics remain speculative.
    claimRefs:
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037
      - CU038
      - CU039
