companyProfile:
  summary: >-
    Xpeng AeroHT is XPENG's flying-car subsidiary, commercializing the Land Aircraft Carrier: a six-wheel range-extended
    ground vehicle carrying a detachable two-seat eVTOL module. The company has one of the deepest disclosed capital pools
    in the sector and a dedicated Guangzhou factory, but remains pre-revenue, pre-certification, and difficult to price
    from public evidence alone.
  foundedDate: '2013-01-01'
  founders:
    - name: Zhao Deli
      role: Founder and President
      background: Aerospace entrepreneur and product leader who has led AeroHT's eVTOL and modular flying car development.
      claimRefs: [CO004]
    - name: Wang Tan
      role: Co-founder and Chief Designer
      background: Pilot and designer who shaped the Land Aircraft Carrier industrial design and overall product concept.
      claimRefs: [CO008]
  foundingLocation: Guangzhou, China
  headquarters: Guangzhou, China
  productSummary: >-
    Modular flying vehicles led by the Land Aircraft Carrier, which combines a road-legal six-wheel ground vehicle with a
    detachable eVTOL air module, plus longer-range tiltrotor concepts under the ARIDGE brand.
  customerFocus: >-
    High-net-worth early adopters, recreation/tourism operators, flight-camp partners, and overseas channel buyers seeking
    short-range low-altitude mobility experiences rather than scheduled air-taxi fleet operations.
  businessModel: >-
    Vehicle sales, accessory and training-related revenue, and potentially channel/distribution partnerships once type
    certification and production approvals are secured.
  stage: growth
