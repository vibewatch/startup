callouts:
  - calloutType: risk
    title: "CAAC Certification Is the Single Binding Constraint"
    body: "No commercial delivery, no revenue, and no credible IPO pricing can precede CAAC TC and PC issuance. Every other risk — capital exhaustion, competitive displacement, adoption barriers — is potentially manageable if TC arrives on schedule. Conversely, every other risk compounds if TC is significantly delayed. As of mid-2026, the TC clock has not yet started running; EHang's 20-month post-special-conditions timeline implies AeroHT's earliest TC date is late 2026 under the most optimistic scenario."
    claimRefs: [CR001, CR006, CR050]

  - calloutType: risk
    title: "Sector Analogs Confirm Capital-Runway Risk Is Real and Proximate"
    body: "Lilium (Oct 2024 insolvency) and Volocopter (Dec 2024 insolvency) each raised $800M–$1B+ before capital exhaustion at the certification-to-production gap. AeroHT's cumulative $750M+ raised is parity with failed peers at an earlier milestone, not immunity from the same dynamic. Xpeng parent support is the key differentiator, but it is contingent on Xpeng's own financial health and strategic priorities."
    claimRefs: [CR010, CR011, CR012, CR022, CR024]

  - calloutType: insight
    title: "EHang's Commercial Path Is the Most Actionable Benchmark"
    body: "EHang secured CAAC TC (Oct 2023), then PC, then AOC, then commercial public ticketing in Guangzhou and Hefei by March 2026 — a ~30-month journey from TC issuance to consumer service. For AeroHT, the TC clock has not yet started; under an EHang-analog timeline, scaled commercial operations are realistically 2028–2029 at the earliest, even under an optimistic scenario. Investors should calibrate capital deployment and exit horizon accordingly."
    claimRefs: [CR004, CR033, CR043, CR049]

