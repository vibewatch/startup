  topStrengths:
    - AeroHT 是少数尝试消费者拥有式 eVTOL 形态的初创公司之一，而不是只做纯空中出租车队模式。
    - XPENG 母公司支持和广州工厂，显著提高了 AeroHT 相对弱势同行实现规模化制造的概率。
    - 公开需求信号强于多数私营同行：认证前已有数千台预订，以及 600 台中东订单包。
  topRisks:
    - CAAC 型号和生产认证仍是关键关口；商业化时间仍取决于审批，而同行拿到审批往往花费多年。
    - 没有公开收入、毛利率或最新估值披露，外部投资人无法有把握承销入场价格或现金消耗。
    - 行业历史很差：Lilium 和 Volocopter 说明，即便融资规模大、叙事强，也挡不住 eVTOL 公司走向破产。
  unresolvedGaps:
    - Series B 后最新估值、股权条款，以及新闻报道之外的任何 IPO 时间表或投行委任。
    - 陆地航母项目的收入、毛利率、客户定金转化和完整单位经济模型披露。
    - CAAC 型号认证的具体里程碑、特殊条件，以及走向生产和商业审批的剩余步骤。
    - 治理细节，包括董事会构成、对 XPENG 的关联方依赖，以及任何债务或结构化融资。
