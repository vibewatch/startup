  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT's primary revenue stream is outright hardware vehicle sales of the Land Aircraft Carrier
              modular flying car system. The product consists of two components: an air module (the X3-F eVTOL
              multicopter, code-named X3-F) and a ground mothership van that stores and recharges it. Founder and
              President Zhao Deli confirmed in September 2024 that the unit will be priced at no more than RMB 2 million
              (~$280,000 USD at prevailing rates), making it the cheapest announced product at this vehicle class
              globally. The company began accepting pre-orders in Q4 2024. As of October 2025, global pre-orders
              exceeded 7,000 units, including 600 confirmed purchase agreements in the Middle East signed with Ali &
              Sons (UAE), Almana Group (Qatar), and ALSAYER Group (Kuwait) at the Dubai showcase event. The 600-unit
              regional order was reported as the largest bulk overseas purchase in the flying-car sector. After-sales
              revenue streams—maintenance, pilot training, and software-as-a-service flight services—have been
              referenced in company marketing under the ARIDGE brand but are not quantified in any public document. The
              company rebranded from XPENG AEROHT to ARIDGE in October 2025 to signal its transition from R&D to
              commercial scale. No commercial deliveries have been confirmed as of the run date. Revenue recognition has
              not yet begun.
