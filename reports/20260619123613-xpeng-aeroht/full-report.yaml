      - number: '7.2'
        title: Manufacturing and Capital-Intensity Risk
        blocks:
          - type: paragraph
            body: >-
              AeroHT's manufacturing strategy is capital-intensive by structural necessity. The Guangzhou Huangpu
              district factory spans 120,000 sqm and is designed for 10,000 annual aircraft module units (initial phase:
              5,000 units); trial production began in 2025 with the assembly line targeting one X3-F module every 30
              minutes at full operational capacity. Capital outflows include factory construction, aviation-grade
              carbon-fibre composite tooling, battery cell integration, propulsion system procurement, and the quality
              management systems required for airworthiness. AeroHT raised $250M in Series B (July 2025) and $150M in
              Series B1 (August 2024), bringing total cumulative funding to over $750M. The capital intensity is
              structural: every X3-F module is a manned aviation product subject to airworthiness-level quality control
              — a fundamentally different environment from the EV manufacturing culture Xpeng parent knows. Sector
              precedent is sobering: Lilium raised over $1 billion before filing for insolvency after the German
              government rejected its emergency €50M loan guarantee; Volocopter filed insolvency in December 2024 after
              failing EASA engine certification for the Paris Olympics. AeroHT benefits from Xpeng supply-chain
              relationships and EV manufacturing capabilities as a partial mitigant, but the unique quality requirements
              of an aviation-grade product at scale have not been demonstrated through a sustained commercial batch. The
              combination of high capital requirements, long certification timelines, and limited pre-delivery revenue
              creates a structural funding-window risk between the current cash position and the first delivery revenue
              event.
