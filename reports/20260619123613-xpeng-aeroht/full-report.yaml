      - number: '3.3'
        title: Go-to-Market, Target Buyer, and Manufacturing Readiness
        blocks:
          - type: paragraph
            body: >
              AeroHT's go-to-market is consumer-direct in China through lifestyle flight camps (~60 sites signed as of
              mid-2024) and planned pre-order delivery, with Dubai as the first international market (maiden
              international flight October 2025). The target buyer is a wealthy Chinese consumer or family who wants a
              land-and-air vehicle experience, not an enterprise air-taxi operator. EHang targets tourism operators,
              government smart-city clients, and emergency-response agencies; it distributes through operator partners
              who hold Air Operator Certificates. Joby's primary GTM is its own service platform (direct-to-consumer air
              taxi), supplemented by aircraft sales; strategic partners—Toyota (manufacturing), Delta (airport
              integration), Uber (booking), and Blade (operational base in New York)—give Joby a uniquely broad
              distribution moat. Archer targets a similar service model with the LA28 Olympics as a marquee launch and
              the Hawthorne Airport acquisition as its operational anchor; its eIPP selection in Florida, Texas, and New
              York amplifies near-term route density. BETA's distribution moat is partly built through a charging
              network and motors/parts business that reaches Archer and Eve as customers, creating a hardware lock-in
              that is unusual in the sector. Wisk (Boeing) benefits from Boeing's airline customer relationships and
              manufacturing scale. On manufacturing readiness, Xpeng AeroHT constructed a Guangzhou factory (topped out
              in 2024) targeting 10,000 units per year annual capacity; Joby is scaling from its Marina, CA base plus a
              new Dayton, OH facility (~1.5M sq ft, targeting 4 aircraft/ month in 2027). Archer's manufacturing is
              centred around its San Jose facilities plus the Hawthorne Airport hub. AeroHT's consumer-facing price
              point (~$279K) puts it in the premium EV/supercar tier rather than an enterprise fleet purchase, which
              limits adoption outside affluent Chinese and Gulf markets in the near term.
