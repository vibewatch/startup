      - number: '7.5'
        title: Governance, IPO Readiness, and Geopolitical Risk
        blocks:
          - type: paragraph
            body: >-
              AeroHT is an unlisted subsidiary of Xpeng Inc. (NYSE: XPEV; HKEX: 9868), which imposes US- and HK-listed
              governance standards on the parent but not necessarily on the operating subsidiary. Xpeng's 2025 annual
              report (20-F, filed with the SEC) includes AeroHT-specific risk disclosures but with the limits of
              non-consolidated subsidiary reporting. AeroHT has publicly discussed pursuing an IPO — Electrek and Cabin
              Crew Online reported the company aims to establish itself as a commercial pioneer ahead of a potential
              listing, at a reported pre-revenue valuation of approximately $1 billion. A pre-revenue IPO would require
              investors to price on certification milestones rather than earnings, increasing sensitivity to any
              regulatory setback. Geopolitical risk is structural: AeroHT's technology involves dual-use aviation
              capabilities, its manufacturing is in China, and its parent is NYSE-listed — a combination attracting
              heightened scrutiny in the US-China technology competition environment. The Joby-Archer litigation notably
              included Archer's counter-allegation that Joby hid ties to China and classified Chinese aircraft parts as
              consumer goods, illustrating the regulatory sensitivity around Chinese-linked aviation technology in US
              markets. AeroHT's rebranding to ARIDGE for global operations signals awareness of cross-border perception
              risk, but does not resolve underlying export-control or international regulatory approval risk for
              non-Chinese jurisdictions.
            claimRefs:
              - CR025
              - CR026
              - CR037
              - CR038
              - CR039
              - CR040
