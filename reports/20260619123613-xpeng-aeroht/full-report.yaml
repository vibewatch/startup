  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              The market relevant to Xpeng AeroHT sits within China's officially designated "low-altitude economy,"
              broadly defined as commercial and personal activity in airspace at or below approximately 1,000 metres.
              This macro category spans drone logistics, emergency services, precision agriculture, urban air mobility
              (on-demand air taxi) services, and personal-ownership eVTOL vehicles. Xpeng AeroHT competes exclusively in
              the personal-ownership sub-segment — a vehicle-purchase market, not a per-ride service — through its Land
              Aircraft Carrier (LAC), priced at no more than RMB 2 million (~USD 280,000) per unit. This positioning is
              conceptually distinct from commercial air taxi operators (Joby, Wisk, EHang's tour services) who sell
              rides rather than aircraft, and from industrial drone operators who serve logistics and B2B clients. The
              status-quo substitutes that the LAC must displace or complement are personal helicopters (purchase price
              typically USD 1–3 million plus high operating costs), scenic helicopter tour packages (USD 150–500 per
              person), charter flights, and luxury overland vehicles for the same leisure and inter-resort travel
              occasions. A direct competitor in the consumer segment, GAC Group, launched its GOVY AirCab mass-produced
              flying car in June 2025 at a recommended retail price under RMB 1.68 million, confirming that an
              addressable consumer eVTOL market is forming in China. Drone logistics, emergency services, and commercial
              on-demand air taxi are excluded from AeroHT's current product scope and are treated as adjacent markets
              that may share regulatory frameworks and infrastructure but have fundamentally different buyer journeys,
              price points, and competitive dynamics. China's revised Civil Aviation Law, effective July 2026, for the
              first time codifies a 300-metre- and-below classification regime, creating cleaner regulatory demarcation
              between low-altitude personal eVTOL and higher-altitude commercial aviation.
            claimRefs:
