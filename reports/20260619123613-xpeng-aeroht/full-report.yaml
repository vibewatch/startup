            body: >
              The eVTOL sector is structurally pre-revenue and capital-intensive. Public comparables show that leading
              Western players reached the market with multi-billion-dollar war chests: Joby Aviation held $2.5 billion
              in cash as of Q1 2026 and Archer Aviation held $1.8 billion, both without meaningful commercial revenue.
              Germany's Lilium, which had raised over $1 billion before filing for insolvency in October 2024,
              illustrates the tail risk when certification timelines slip and bridge funding dries up. AeroHT's total
              disclosed capital of $900 million is below the Western leaders' current liquidity positions, though AeroHT
              benefits from: (a) China's state-backed low-altitude economy policy, which eases permitting; (b) Xpeng
              Motors' manufacturing ecosystem and balance sheet as a strategic backstop; and (c) a land vehicle
              component that dilutes pure aviation capital requirements. CNBC reported in May 2026 that sector-wide
              lawsuits, certification delays, and declining stock prices (Archer −9%, Vertical Aerospace −50%, Beta
              Technologies −50% from IPO) were souring investor appetite, a risk that could affect AeroHT's IPO window
              and future private round access. China's domestic eVTOL market context is somewhat insulated from
              US/European headwinds but not immune to investor sentiment shifts. The 600-unit Middle East order (≈ $168M
              at list price) is notable but its revenue recognition is contingent on CAAC certification and production
