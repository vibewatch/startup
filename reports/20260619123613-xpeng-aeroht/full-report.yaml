      - number: '7.3'
        title: Dependency and Partner Risk
        blocks:
          - type: paragraph
            body: >-
              AeroHT operates within a web of concentrated dependencies. The CAAC is the sole gating authority for TC,
              PC, and AOC issuance in China, creating single-regulator concentration risk on a body with very limited
              manned eVTOL precedent. Xpeng Motors is simultaneously majority stakeholder, manufacturing infrastructure
              provider, and EV powertrain supply-chain source — but this means AeroHT's strategic autonomy and CAPEX
              availability are constrained by Xpeng's own EV business dynamics and capital position. Aviation-grade
              battery cell suppliers and carbon-fibre composite manufacturers represent component-level dependencies
              with 12–24 month requalification timelines if disrupted. Geographic concentration of the factory in
              Guangdong creates supply-chain and labor-disruption exposure. On the demand side, approximately 5,000
              intent orders and 600 Middle East orders demonstrate early commercial interest, but these remain mostly
              non-binding commitments. Commercial-scale revenue requires not only TC/PC/AOC issuance but also a
              functional pilot-licensing ecosystem, vertiport infrastructure, and low-altitude airspace management rules
              — all of which are under active but incomplete development by Chinese regulators. EHang's progression from
              TC to public commercial ticketing in Guangzhou and Hefei took approximately 30 months from its TC
              issuance; AeroHT's more complex manned vehicle and absence of a TC start point suggests its full
              commercial-operations timeline is 2028 at the earliest under an optimistic scenario.
