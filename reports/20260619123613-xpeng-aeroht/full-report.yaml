      - number: '1.4'
        title: Milestones and Operational Progress
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT's milestone arc spans more than twelve years of R&D and seven prototype generations leading
              to the Land Aircraft Carrier. The first prototype manned flight occurred in 2018; subsequent iterations
              led to the X2, which completed its debut flight in the Guangzhou central business district and secured a
              special flight permit in January 2023. The Land Aircraft Carrier concept was officially introduced at
              XPENG's October 2023 Tech Day, and the product was formally launched on September 3, 2024, with pricing
              confirmed at no more than RMB 2 million. Factory construction began in Guangzhou's Huangpu District on
              October 27, 2024, and the 120,000-square-meter facility entered trial production by early 2026, initially
              at a capacity of 5,000 units per year with a designed ceiling of 10,000 units per year. On the regulatory
              front, the Type Certificate application for the X3-F was accepted by the CAAC on March 21, 2024, and the
              Production Certificate application was accepted on May 9, 2025; both remain under review. The Land
              Aircraft Carrier made its first public crewed flight at the Zhuhai Airshow in November 2024 and its
              international debut at CES 2025 in Las Vegas. In October 2025, the company completed the first overseas
              public manned flight in Dubai under a UAE GCAA special flight permit, signed 600-vehicle purchase
              agreements with Middle East partners, and announced the ARIDGE rebrand. Total global pre-orders exceed
              7,000 units as of that event. Mass production and customer deliveries are targeted for 2026 pending final
              CAAC certifications. The broader eVTOL sector's track record—including Lilium's October 2024 insolvency
              filing—illustrates the execution risks that remain before commercial operations can begin.
