      - number: '6.3'
        title: Channel and Distribution Structure
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT operates two distinct demand channels: a domestic experiential channel through flight camp
              partnerships, and an international distribution channel via signed regional distributor agreements. The
              domestic flight camp channel serves as a hybrid customer-acquisition and revenue-generating vehicle:
              flight camps pay to host AeroHT aircraft, expose affluent local consumers to the product, and sell
              ticket-based flight experiences. As of mid-2026, the company had partnerships with more than 200 flight
              camps at general aviation airports, scenic spots, cultural and tourism towns, and suburban locations. This
              channel generates early revenue and brand awareness without requiring volume fleet sales. The
              international channel launched formally in October 2025 with the Dubai event, resulting in agreements with
              UAE-based Ali & Sons Group, Qatar's Almana Group, Kuwait's ALSAYER Group, and the Chinese Business Council
              in the UAE. The Middle East is positioned as the company's first international consumer market, with sales
              projected to begin as early as 2027—conditional on delivery of production-certified vehicles. A special
              flight permit from the UAE General Civil Aviation Authority was obtained ahead of the Dubai demonstration,
              demonstrating early regulatory engagement in that market. The company's rebranding to Aridge in October
              2025 is intended to support global commercial identity distinct from the Xpeng Motors brand.
