      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The most powerful demand driver is China's policy supercycle. The low-altitude economy was first written
              into the Government Work Report in 2024, the NDRC established a dedicated Low Altitude Economy Development
              Bureau in late 2024, and the 15th Five-Year Plan (2026–2030) designates it as a national strategic
              emerging industry. Multiple provincial governments — Guangdong, Zhejiang, Fujian, Henan, Jiangsu — have
              incorporated low-altitude economy targets into their own plans, with Shenzhen committing to build over
              1,200 low-altitude landing points by 2026. A second major driver is technology cost reduction through EV
              supply-chain synergies: high-density lithium batteries (CATL, Farasis Energy), high-reliability electric
              motors, and electronic control systems from China's EV industry are directly transferable, slashing eVTOL
              development costs. AutoFlight's preliminary estimates suggest eVTOL operating costs are approximately 15
              percent of helicopter equivalents — a transformational cost advantage. Internationally, the FAA issued a
              final rule in October 2024 establishing powered-lift pilot certification, and the White House-backed eIPP
              program launched in early 2026 to accelerate US deployments, confirming that near-term regulatory
              frameworks are maturing in the world's two largest aviation markets. Key constraints include: (1)
              incomplete personal eVTOL pilot-licensing frameworks in China, which means buyers must wait for licensing
              rules before flying independently; (2) the high acquisition price, which restricts the direct buyer pool
              to UHNW individuals and well-capitalised operators; (3) early-stage infrastructure — while Shenzhen and
              Suzhou are building landing points, the national network remains thin; (4) public acceptance in urban
              environments is unproven, with noise, safety, and visual intrusion concerns not yet studied in Chinese
              urban communities at scale; and (5) expert caution from analysts such as Roland Berger that eVTOLs require
              full verification in sparsely populated or scenic areas before urban deployment, implying a phased
              commercialisation rather than immediate mass adoption.
            claimRefs:
