      - number: '2.5'
        title: Diligence Gaps and Market Outlook
        blocks:
          - type: paragraph
            body: >-
              Several material gaps limit conviction in any precise sizing estimate. First, the personal-ownership eVTOL
              segment (AeroHT's actual addressable market) has not been independently sized and cannot be cleanly
              extracted from broader low-altitude economy totals that include drone logistics, sightseeing services, and
              industrial applications. Second, the pilot-licensing framework for personal eVTOL owners in China is not
              publicly documented, creating uncertainty about how many buyers can legally operate the aircraft after
              purchase. Third, no independent willingness-to-pay survey exists for the Chinese UHNW segment at the ~USD
              280,000 price point; the 4,000+ pre-orders are unverified reservations without disclosed deposit
              structures. Fourth, estimates from CAAC, CCID, Saidi Research, and the China Low Altitude Economy Alliance
              use different scope definitions, making direct comparison misleading. On the positive side, EHang
              Holdings' EH216-S receipt of the world's first production certificate for a passenger-carrying pilotless
              eVTOL from CAAC establishes a regulatory precedent that materially reduces AeroHT's certification risk.
              AeroHT's production certificate application was accepted by the CAAC Central and Southern Regional
              Administration, with type certification expected. Globally, Joby Aviation reported it expects to carry its
              first commercial passengers in Dubai in 2026, marking the first confirmed revenue-generating eVTOL
              deployment worldwide — a proof-of-concept datapoint that will validate demand and regulatory pathways
              applicable to the broader sector. China's market holds structural advantages: concentrated urban clusters
              with severe road congestion, strong government mandate, maturing supply chain, and a large pool of UHNW
              buyers.
            claimRefs:
              - CM041
              - CM042
              - CM043
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Pilot-licensing gap blocks near-term individual buyer activation
            body: >-
              China's personal eVTOL pilot qualification rules are not yet published, meaning that UHNW buyers who take
              delivery of a Land Aircraft Carrier in 2026 may be unable to fly independently until CAAC issues
              framework-specific licensing. This is the single most actionable near-term constraint on buyer conversion
              from pre-order to active user, and creates uncertainty for AeroHT's 2026 delivery timeline.
            calloutType: risk
            claimRefs:
              - CM039
              - CM038
          - type: callout
            title: Policy supercycle (2024–2030) is the strongest structural demand driver
            body: >-
              The sequential escalation from Government Work Report inclusion (2024) to NDRC bureau establishment (2024)
              to 15th Five-Year Plan designation (2026) creates a durable multi-year policy tailwind that differentiates
              the China low-altitude economy from prior speculative aviation waves. Investors should track the Guangdong
              provincial implementation plan as the most commercially relevant near-term signal for AeroHT's home
              market.
            calloutType: insight
            claimRefs:
              - CM029
              - CM030
              - CM031
          - type: callout
            title: EV supply-chain cost advantage is structural, not cyclical
            body: >-
              China's globally dominant electric vehicle supply chain — including CATL-grade energy-dense batteries,
              precision motors, and fly-by-wire electronics — transfers directly to eVTOL construction. AutoFlight's
              preliminary cost modelling suggests operating costs at approximately 15 percent of helicopter equivalents.
              This is a structural advantage that cannot be easily replicated by Western incumbents relying on legacy
              aviation supply chains.
            calloutType: strength
            claimRefs:
              - CM033
              - CM035
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Direct Peers
        blocks:
          - type: paragraph
            body: >
              The global eVTOL competitive landscape divides along two primary axes: certification jurisdiction (CAAC vs
              FAA vs EASA) and autonomy model (pilotless vs piloted vs supervised autonomous). Within China, EHang is
              the dominant direct peer, holding the world's first CAAC type certificate, production certificate, and
              standard airworthiness certificate for a pilotless eVTOL and running commercial operations in Guangzhou
              and Hefei. EHang's EH216-S is a two-seat, 30km-range multi-rotor designed for tourism and urban-air
              shuttle; its VT35 targets longer intercity routes. AutoFlight (Shanghai) operates a 5-seat tilt-rotor
              Prosperity and completed the world's first cross-sea inter-city eVTOL demonstration (50km Pearl River Bay,
              February 2024), targeting intra-city urban transport at estimated fares of ¥200–300 per pax—roughly $28–41
              USD. In the West, Joby Aviation (NYSE: JOBY) is the best-capitalised competitor with $2.5B in cash at Q1
              2026 end, 1,700+ engineers, FAA Phase 4 under way, an FAA-conforming aircraft in flight testing, and eIPP
              partnership covering 12 US states for early operations in 2026. Archer Aviation (NYSE: ACHR) closed FAA
              Phase 3 in April 2026 (first eVTOL to do so) and holds ~$1.8B in cash. Wisk Aero (Boeing-backed) pursues a
              fully-autonomous four-passenger model with 1,750+ safe test flights accumulated across five aircraft
              generations. BETA Technologies targets defence, cargo, and medical routes first and was selected for 7 of
              8 US eIPP programme slots—the most of any company. Volocopter (German) narrowly avoided collapse in late
              2024, filed insolvency proceedings in December 2024, was restructured under Mudrick Capital majority
              control, and secured up to $850M in April 2026. Xpeng AeroHT's Land Aircraft Carrier is positioned
              differently from all peers: a modular consumer flying car (eVTOL flight unit + ground EV carrier) rather
              than a point-to-point air taxi, with ~5,000 pre-orders and mass production targeted for late 2026 at under
              RMB 2M (~$279K).
