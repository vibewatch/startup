      - number: '8.5'
        title: Exit Readiness, Thesis-Break Triggers, and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              Exit readiness for current investors depends on three gating events: CAAC type certification, a disclosed
              IPO prospectus with a valuation mark, and demonstrated delivery ramp. None of these conditions has been
              met as of June 2026. The most accessible exit path is the anticipated Hong Kong or US IPO, with a
              2027–2028 window if certification progresses on schedule. Secondary market liquidity is limited; no public
              listing exists and no secondary fund has been publicly identified as a buyer. Litigation risk in the
              global eVTOL sector—highlighted by the Joby vs. Archer vs. Vertical Aerospace lawsuits as of May
              2026—could suppress investor appetite for new entrants. The preference stack and liquidation waterfall for
              AeroHT are undisclosed, creating a structural risk for common shareholders in a distressed scenario. Key
              thesis-break triggers include a CAAC rejection, a down-round below the 2021 $1B mark, or a factory that
              fails to achieve meaningful production volume by year-end 2026. Roland Berger analyst Yu Zhanfu's
              observation that eVTOL aircraft need full safety verification in low-density scenarios before urban entry
              remains a relevant commercial constraint. Final diligence priorities are an updated cap table with
              post-Series B marks, certified CAAC milestone tracking, and independent order-book quality verification.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV038
