chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Origin
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT originated in 2013 as a technology-focused unit within the XPENG ecosystem and was formally
              incorporated in 2020 as a distinct company majority-owned by XPENG Inc. and XPENG's chairman and CEO He
              Xiaopeng. Headquartered in the Huangpu District of Guangzhou, Guangdong Province, China, the company
              describes its mission as "making flying more accessible" and positions itself as Asia's largest flying car
              company. Its flagship product is the Land Aircraft Carrier (LAC), the world's first modular flying car,
              which combines a six-wheel range-extended ground vehicle with a detachable two-seat eVTOL (electric
              vertical takeoff and landing) aircraft module that can be stored, recharged, and deployed from the
              vehicle's rear compartment. The ground vehicle operates on standard public roads with a C1/C2 driver's
              license, significantly lowering adoption barriers relative to traditional aviation products. The air
              module, code-named X3-F, features a quad-rotor design, one-touch takeoff and landing, and autonomous
              navigation requiring only five minutes of user training for basic operations. In October 2025, coinciding
              with its first international public manned flight in Dubai, the company launched the global brand ARIDGE
              (derived from "Air" and "Bridge"), signaling its transition from a pioneering R&D phase to large-scale
              commercialization and international expansion. The company is also developing the A868, a high-speed
              long-range full tiltrotor flying car targeting business travel and urban air mobility services.
