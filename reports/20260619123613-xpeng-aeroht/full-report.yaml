      - number: '7.4'
        title: Competitive Compression and IP Risk
        blocks:
          - type: paragraph
            body: >-
              Competitive risk is intensifying from multiple directions simultaneously. EHang holds CAAC TC, PC, and AOC
              for the EH216-S — having opened commercial ticketing for sightseeing services in Guangzhou and Hefei in
              early 2026 — giving it a first-mover regulatory advantage that AeroHT has not yet matched. EHang is
              expanding globally: Mexico (May 2026), Thailand government meetings (March 2026), Türk Telekom partnership
              (March 2026), and UAE operations. Within China, GAC Group launched the GOVY AirCab in June 2026 with
              pre-orders at a recommended retail price under 1.68 million yuan — a direct Chinese OEM entry into the
              flying car category. AutoFlight demonstrated the world's first public eVTOL cross-sea inter-city
              demonstration flight between Shenzhen and Zhuhai in February 2024, signalling advanced Chinese startup
              capabilities. Internationally, Joby Aviation progressed through FAA Phase 4 certification and Archer
              Aviation closed FAA Phase 3 in April 2026 — the first eVTOL company to reach that milestone. The eVTOL
              sector is experiencing material IP litigation: Joby sued Archer in November 2025 for corporate espionage;
              Archer counter-alleged Joby concealed ties to China and filed a separate patent-infringement suit against
              Vertical Aerospace. Beta CEO Clark warned this litigation wave could drag certification timelines and
              damage investor confidence broadly. eVTOL sector equities broadly declined 10–58% across 2025–2026 on
              certification delays and lawsuit headlines.
            claimRefs:
              - CR008
              - CR009
