            body: >
              The X3-F air module is a two-seat eVTOL with a carbon fiber composite fuselage, panoramic wraparound
              windows, and quadricycle strut landing gear. The propulsion system uses Distributed Electric Propulsion
              (DEP) consisting of six VTOL propellers and two ducted fans for forward and rearward flight, driven by
              eight independent electric motors. The DEP architecture provides safety through redundancy: if one or more
              propellers or motors fail, the remaining operational units can safely land the aircraft. The control
              interface is a proprietary six-in-one single joystick that merges throttle, pitch, roll, yaw, lateral, and
              vertical controls into a single stick, lowering the pilot learning curve relative to conventional
              helicopter controls. The avionics suite supports autonomous landing, smart route planning, and one-touch
              takeoff and landing, with manual override available at all times. The air module folds automatically into
              a compact rectangular form that fits into the GMS rear compartment, deploying via two rail systems; the
              full deploy cycle unfolds landing gear, mid-fuselage booms, and propeller arms autonomously. The battery
              packs are charged by the GMS range extender, delivering five to six complete flights per full GMS charge
              and an eighteen-minute fast charge (30% to 80% state of charge). The four corner booms are positioned at
              45-degree angles to the fuselage top; two additional mid-booms fold out at approximately 35 degrees
              forward from the fuselage sides, giving the vehicle its distinctive hexagonal propulsor layout combined
              with rear ducted thrust.
