      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation — TRACK
            body: >-
              AeroHT earns a TRACK rating with low confidence. The company has demonstrated genuine technical and
              commercial progress but the public evidence base is insufficient to support a buy at any valuation. First
              buy signal: CAAC type certificate awarded AND disclosed post-Series B post-money mark exceeding $2B from
              credible institutional sources.
            calloutType: recommendation
            claimRefs:
              - CV040
              - CV041
          - type: callout
            title: Sector Insolvency Precedent — Adverse Signal
            body: >-
              Lilium (Oct 2024) and Volocopter (Dec 2024) both filed for insolvency despite having raised over $1B and
              $600M respectively, and despite active certification programs. These failures demonstrate that eVTOL
              unicorn status and institutional backing do not guarantee survival in the face of capital intensity and
              certification delays. AeroHT's pre-revenue position and unconfirmed CAAC timeline warrant explicit
              insolvency risk disclosure in any investor materials.
            calloutType: risk
            claimRefs:
              - CV028
              - CV029
              - CV042
          - type: callout
            title: Valuation Assumption — 2021 Anchor and Stage Discount
            body: >-
              In the absence of a disclosed 2026 private mark, all scenario valuations are anchored to the 2021 >$1B
              pre-money figure adjusted by (a) comparable public eVTOL market data as of June 2026 and (b) a
              certification-stage discount of 30–50% reflecting AeroHT's earlier CAAC position vs. Joby's advanced FAA
              Phase 4 status. These adjustments are author estimates and should not be substituted for an actual
              disclosed mark.
            calloutType: assumption
            claimRefs:
              - CV034
              - CV035
