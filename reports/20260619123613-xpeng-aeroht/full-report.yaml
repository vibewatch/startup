      - number: '6.4'
        title: Adoption Frictions and Regulatory Risk
        blocks:
          - type: paragraph
            body: >
              Multiple structural barriers limit Xpeng AeroHT's ability to convert pre-orders into delivered fleet
              customers within its stated 2026 timeline. First, the CAAC's acceptance of the production certificate
              application in May 2025 and the launch of a public consultation on special certification conditions for
              the X3-F eVTOL confirm that type certification remains in progress rather than complete; only EHang's
              EH216-S has received full CAAC type certification for a human-carrying eVTOL. The certification precedent
              from EHang took over 20 months from special conditions publication to type certificate. Second, the
              $280,000 price point makes the Land Aircraft Carrier a luxury-tier product with a narrow buyer pool; mass
              adoption requires a future lower-priced vehicle. Third, the broader eVTOL sector has demonstrated a
              pattern of timeline slippage and capital risk. Lilium—once valued above $1 billion—filed for insolvency in
              October 2024 after failing to secure government bridge financing, illustrating that pre-order pipelines
              and strong brand recognition do not protect against capital shortfalls. As of May 2026, sector-wide
              litigation in the US (Joby vs. Archer, Archer vs. Vertical) was cited by experts as further eroding
              investor confidence and delaying commercial certification timelines. Fourth, the Land Aircraft Carrier
              delivery schedule has already slipped from Q4 2025 to 2026, consistent with industry norms. Fifth, the
              absence of pilot licensing infrastructure and vertiport/landing pad networks at scale remain system-level
              barriers for mass customer deployment.
