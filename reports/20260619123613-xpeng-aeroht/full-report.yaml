      - number: '6.5'
        title: Retention, Fleet Proof, and Concentration Gaps
        blocks:
          - type: paragraph
            body: >
              Because the Land Aircraft Carrier has not yet been delivered to any customer, all conventional
              customer-health metrics—net revenue retention, gross revenue retention, churn rate, renewal rate, and
              cohort retention—are necessarily absent. No independent third-party reviews, customer outcome case
              studies, or satisfaction surveys exist for the product. The closest operational analogue is the X1 and X2
              eVTOL demonstrators used for flight camps and airshow demonstrations, but these preceded the current
              commercial product and no repeat-purchase or lease-renewal data has been disclosed. On concentration risk,
              the claimed order book carries material geographic and distributor concentration: the 600-unit Middle East
              bulk deal represents approximately 8.5% of the claimed 7,000-unit total but is concentrated through a
              single multi-party event agreement with parties whose institutional buying capacity and financing
              commitment have not been independently verified. Domestic concentration is difficult to assess because the
              ~4,000+ domestic intent-order figure is anonymous and aggregated. The flight camp channel mitigates pure
              HNW individual concentration somewhat, but each flight camp is itself an individual SME operator, creating
              hundreds of small-volume counterparties rather than enterprise fleet buyers. Policy support from China's
              government—including the explicit inclusion of the low-altitude economy in the 2025 government work report
              and a projected RMB 1 trillion+ market by 2026—provides a favorable demand backdrop, but macropolicy
              support does not substitute for individual customer delivery proof. Until the factory in Guangzhou
              completes its first production deliveries and customers begin operating the vehicles, all forward
              retention and expansion metrics remain speculative.
