  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Updated 2026 Valuation Mark
        - Post-Series B2 (Jul 2025) post-money cap table with per-share price
        - Entry price discipline requires a current mark; 2021 anchor is 5 years old and pre-revenue
        - Request from AeroHT CFO/IR; seek pre-IPO investor terms; monitor IPO prospectus when filed
      - - CAAC Certification Milestone Schedule
        - Official CAAC TC schedule, special conditions approval date, and Phase 2+ compliance timeline
        - Certification date is the single largest value driver across all scenarios; no public timeline exists
        - Review CAAC public notices at caac.gov.cn; engage China aviation regulatory counsel; track AeroHT press
      - - Order Book Quality and Deposit Rate
        - Proportion of 5,000+ intent orders with non-refundable deposits vs. soft intent-only
        - Order book quality determines revenue predictability and demand credibility for IPO underwriters
        - Request management disclosure; monitor trade press (AIN, VerticalMag) for order-book updates
      - - AeroHT Standalone Cash and Burn Rate
        - AeroHT audited standalone financial statements or parent AeroHT segment disclosure
        - Determines months of runway and likelihood of a dilutive bridging round before IPO
        - Seek audited financials; review Xpeng 20-F AeroHT segment notes (filed with SEC Apr 2026)
      - - Preference Stack and Liquidation Waterfall
        - Series A and Series B term sheets showing liquidation preferences, anti-dilution provisions, pro-rata rights
        - In a below-bull exit scenario, preference overhang could leave common shareholders with limited returns
        - Request from management; may require due diligence room access; assess if IPO converts to common equity
    notes: >-
      Diligence asks are ranked by value materiality, not ease of acquisition. Items 1–2 are gating for a buy
      recommendation; items 3–5 are required for underwriting or large-position entry. Some items (cap table, terms) may
      only be available in a formal investment process.
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV014
      - CV038
