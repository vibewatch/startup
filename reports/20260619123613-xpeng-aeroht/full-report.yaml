  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Buyer Profiles
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT targets three primary buyer segments for the Land Aircraft Carrier: high-net-worth
              individuals (HNW) seeking personal transportation combining driving and short-haul flight; flight camp
              operators and tourism companies acquiring units for passenger experience services and pilot training; and
              institutional or government buyers in emergency services, research, and potentially military use.
              Overseas, the company is targeting international distributors in the Gulf Cooperation Council region and,
              eventually, other high-GDP markets where regulatory frameworks for eVTOL are emerging. The co-founder and
              chief designer Wang Tan articulated the dual-hobbyist archetype at CES 2025: pilots who want to travel
              with their own eVTOL, and off-road enthusiasts who want an additional aerial dimension. The Land Aircraft
              Carrier's six-wheel all-terrain ground module and panoramic two-seat air module are specifically designed
              to appeal to these buyer profiles. At approximately RMB 2 million (~$280,000 USD), the addressable buyer
              pool is narrowly restricted to affluent individuals and well-capitalized institutional operators. No
              enterprise fleet buyers or government procurement contracts have been publicly disclosed as of mid-2026;
              institutional demand remains aspirational rather than contracted.
