      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: CAAC Certification Is the Single Binding Constraint
            body: >-
              No commercial delivery, no revenue, and no credible IPO pricing can precede CAAC TC and PC issuance. Every
              other risk — capital exhaustion, competitive displacement, adoption barriers — is potentially manageable
              if TC arrives on schedule. Conversely, every other risk compounds if TC is significantly delayed. As of
              mid-2026, the TC clock has not yet started running; EHang's 20-month post-special-conditions timeline
              implies AeroHT's earliest TC date is late 2026 under the most optimistic scenario.
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR050
          - type: callout
            title: Sector Analogs Confirm Capital-Runway Risk Is Real and Proximate
            body: >-
              Lilium (Oct 2024 insolvency) and Volocopter (Dec 2024 insolvency) each raised $800M–$1B+ before capital
              exhaustion at the certification-to-production gap. AeroHT's cumulative $750M+ raised is parity with failed
              peers at an earlier milestone, not immunity from the same dynamic. Xpeng parent support is the key
              differentiator, but it is contingent on Xpeng's own financial health and strategic priorities.
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR022
              - CR024
          - type: callout
            title: EHang's Commercial Path Is the Most Actionable Benchmark
            body: >-
              EHang secured CAAC TC (Oct 2023), then PC, then AOC, then commercial public ticketing in Guangzhou and
              Hefei by March 2026 — a ~30-month journey from TC issuance to consumer service. For AeroHT, the TC clock
              has not yet started; under an EHang-analog timeline, scaled commercial operations are realistically
              2028–2029 at the earliest, even under an optimistic scenario. Investors should calibrate capital
              deployment and exit horizon accordingly.
            calloutType: insight
            claimRefs:
              - CR004
              - CR033
              - CR043
              - CR049
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Xpeng AeroHT presents a compelling narrative: Asia's largest flying car company by production intent,
              backed by a publicly listed parent (NYSE: XPEV), with the world's first mass-production flying car
              factory, over 5,000 intent orders, and a CAAC certification process formally underway. The bull thesis
              rests on a genuine first-mover advantage in a modular flying car product category, a supportive Chinese
              low-altitude economy policy environment targeting over RMB 1 trillion ($138B) by 2026, and a CAAC
              certification process anchored by the EHang precedent. However, the anti-thesis is equally strong: AeroHT
              has no confirmed 2026 valuation mark, zero disclosed revenues, a certification timeline measured in years,
              and comparable eVTOL companies have experienced severe multiple compression or outright insolvency. The
              2021 unicorn anchor of >$1B pre-money is now five years old and precedes all commercialization milestones.
              On a risk-adjusted basis, insufficient public evidence exists to support a buy call; TRACK is the
              appropriate stance pending CAAC type certification, a disclosed post-Series B valuation, or a credible IPO
              term sheet.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV040
