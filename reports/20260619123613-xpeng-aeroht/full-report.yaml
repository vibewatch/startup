      - number: '8.2'
        title: 'Valuation Context: Financing History and 2026 Private Mark'
        blocks:
          - type: paragraph
            body: >-
              Xpeng AeroHT completed its Series A in October 2021, raising over $500M at a pre-money valuation exceeding
              $1B, with investors including IDG Capital and 5Y Capital. No subsequent round disclosed a post-money
              valuation mark: neither the $150M Series B1 (August 2024) nor the $100M Series B2 (July 2025) press
              releases contained a valuation figure. Total disclosed cumulative funding exceeds $900M. In preparation
              for a potential IPO, AeroHT appointed Du Chao—a Deutsche Bank veteran with a decade of experience in
              overseas IPO financings and cross-border M&A—as its first CFO in late July 2025. Bloomberg reported in May
              2025 that Xpeng was considering an IPO for AeroHT and had invited several banks, with Hong Kong or the US
              as listing venues. No formal prospectus or exchange registration had been filed as of June 2026. The
              absence of a refreshed valuation mark, combined with a pre-revenue stage and certification uncertainty,
              makes pricing a high-uncertainty exercise. Entry discipline requires waiting for a disclosed mark or
              adjusting to the public comparable range with a material certification discount.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Public Comparable Analysis
        blocks:
          - type: paragraph
            body: >-
              The closest public comparables are Joby Aviation, Archer Aviation, and EHang. Joby (NYSE: JOBY) traded at
              approximately $9.94 per share in mid-June 2026 with an estimated market cap of approximately $7B+; it is
              the most advanced Western peer, having completed its first FAA conforming aircraft TIA flight and been
              selected across 12 US states under the eIPP program. Archer (NYSE: ACHR) reported Q1 2026 net loss of
              $217.7M on revenue of $1.6M, carried $1.78B in cash, and was down more than one-third from its 12-month
              high. EHang (Nasdaq: EH) is the only CAAC-certified peer, commercially operating its EH216-S; its market
              cap reflects a different (remotely piloted, lower-margin) product type. These comps imply a capital-raised
              multiple of 1.5–2.5x for advanced-stage peers, and a stage-adjusted range of $1–1.6B for AeroHT given its
              pre-certification position. Applying a Joby-equivalent multiple directly would overstate AeroHT's mark, as
              Joby is further in FAA certification and has an active US operations launch program. Two cautionary data
              points anchor the floor: Lilium (raised $1B+, bankrupt Oct 2024) and Volocopter (bankrupt Dec 2024)
              demonstrate that unicorn status does not insulate from insolvency in this capital-intensive sector.
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
