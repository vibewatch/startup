              cited approximately 2,000 orders at the RMB 2M price. Autocar reported over 3,000 intent orders around the
              January 2025 CES debut. A major step in international demand came in October 2025 when Xpeng AeroHT
              (rebranded to Aridge) conducted a manned public flight in Dubai and signed purchase agreements with four
              buyer groups for 600 vehicles—the largest single overseas bulk purchase reported in the flying-car sector.
              Combined with domestic pre-orders, the company claimed total global orders exceeding 7,000 units. By
              mid-2026, Chinese government-sourced press reports cited 4,000+ pre-orders domestically with over 200
