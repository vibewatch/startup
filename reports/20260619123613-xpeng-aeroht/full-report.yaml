  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Certification Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is the dominant near-term kill criterion for Xpeng AeroHT. The X3-F flying body module
              requires both a Type Certificate (TC) and a Production Certificate (PC) from the CAAC before any
              commercial delivery is legally permitted in China. The TC application was accepted by CAAC's Central and
              Southern Regional Administration on March 21, 2024; the PC application was accepted in May 2025; the CAAC
              subsequently published draft special conditions for the X3-F and invited public comment from regional
              civil aviation administrations, manufacturers, and research institutions. As of the run date (2026-06-19),
              neither certificate has been formally issued. The best available analog is EHang's EH216-S, which received
              its CAAC TC in October 2023, approximately 20 months after CAAC published its own Special Conditions. The
              X3-F is a novel modular manned vehicle with no direct CAAC precedent: unlike the EH216-S (a
              remotely-piloted aircraft), the X3-F carries a crew, requiring more extensive compliance evidence on
              flight envelope, failure modes, and passenger safety. Beyond the TC and PC, commercial passenger
              operations require an Air Operator Certificate (AOC); EHang obtained its AOC only after extensive post-TC
              regulatory engagement, adding at least 12 additional months to its commercialization timeline. If AeroHT
              slips its 2026 mass-delivery target by even two quarters, revenue recognition delays compound into
              capital-runway risk. Separately, the FAA issued its October 2024 final powered-lift rule for US
              operations, establishing a distinct certification pathway for any future AeroHT international expansion
              that would require a fresh application rather than bilateral CAAC recognition.
            claimRefs:
