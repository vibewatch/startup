            body: >
              No financial statements, management accounts, or investor update letters for Xpeng AeroHT have been made
              public. The company is a private entity majority-owned by Xpeng (NYSE: XPEV); XPEV's 20-F filed April 16,
              2026 covers the consolidated parent but does not break out AeroHT segment financials separately. As a
              result, gross margin, COGS, quarterly burn rate, and current cash balance are all unknown. The Land
              Aircraft Carrier is an aerospace-class manufactured product requiring carbon-fiber composites, eight
              electric motors, battery packs, and aviation-grade avionics—component categories that carry high unit
              costs with no disclosed supplier pricing. An ASP of ≤ RMB 2 million implies the company must achieve
              manufacturing economics comparable to high-end automotive despite the product's aerospace certification
              requirements. This gap between aspirational list price and achievable cost is the most material
              underwriting unknown. Peer data from Joby Aviation (Q1 2026: $2.5 billion cash, ~$175 million quarterly
              operating loss before first commercial revenue) and Archer Aviation (Q1 2026: $172.5 million quarterly
              adjusted EBITDA loss, $1.8 billion liquidity, $1.6 million revenue) illustrates the sector-wide cash
              intensity before commercialization. Scaled to AeroHT's likely size, a quarterly burn could plausibly fall
              in the $50–200 million range, but this is an industry inference, not a company disclosure. Pre-order
              deposit terms and enforceability are also undisclosed, making the $7,000+ order backlog difficult to
