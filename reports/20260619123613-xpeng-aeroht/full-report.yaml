      - number: '7.6'
        title: Scenario Register and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Five primary risk scenarios dominate AeroHT's investment risk profile. (1) Certification delay: the CAAC
              issues the X3-F TC in 2027 or later — plausible given EHang's 20-month post-special-conditions timeline
              and AeroHT's more complex manned design. Every quarter of delay extends pre-revenue burn and increases the
              risk that Series C must be raised at a distressed valuation. (2) Capital exhaustion: intent orders fail to
              convert to firm orders at sufficient velocity, manufacturing costs exceed plan, and Series C becomes
              unavailable or possible only at severe dilution — the Lilium and Volocopter analog applied to a
              better-capitalised entity still structurally pre-revenue at the critical juncture. (3) Competitive
              displacement: EHang achieves scale in China, and GAC or another Chinese OEM captures the flying car
              segment at lower price points before AeroHT's TC is issued, eroding first-mover advantage. (4) Regulatory
              framework gap: China's pilot-licensing, vertiport, and airspace management buildout lags the production
              schedule, limiting addressable market even after TC and PC issuance. (5) Geopolitical or IPO block:
              US-China tensions intensify; AeroHT's IPO path is obstructed in international markets while domestic
              capital conditions deteriorate, constraining exit liquidity. Each scenario has specific monitoring
              triggers and kill criteria defined in the kill-criteria table.
            claimRefs:
