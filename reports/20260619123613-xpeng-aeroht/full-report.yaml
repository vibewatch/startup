      - number: '4.3'
        title: Manufacturing Capex and Capacity Buildout
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT is constructing a dedicated flying car manufacturing base in the Guangzhou Development Zone.
              Construction began October 2024 following a signed investment and cooperation agreement with local
              authorities. The facility is designed for an annual production capacity of 10,000 units, applying
              automotive-scale assembly practices to aviation-grade quality requirements. As of May 2025, the factory
              was 70% complete, with the main structure of the final assembly shop, paint shop, joining shop, and
              compounding shop finished. The factory was topped out (structural completion) by July 2025 and is expected
              to reach full operational readiness in Q4 2025. The company has not disclosed the total capex commitment
              for the facility. Benchmarking against Joby Aviation, which paid $126 million for Hawthorne Airport and is
              scaling a 700,000 sq ft Ohio facility, suggests eVTOL-grade manufacturing requires mid-to-high three-digit
              million USD investments for credible first-generation capacity. Xpeng AeroHT's factory targets 10,000
              units annually, which at a ≤ RMB 2M ASP implies a theoretical gross revenue ceiling of approximately RMB
              20 billion (~$2.8 billion) per year at full utilization—a figure that hinges entirely on certification,
              consumer adoption, and unverified cost economics. The ground mothership vehicle will also be manufactured
              at or near the same site, adding supply chain complexity.
