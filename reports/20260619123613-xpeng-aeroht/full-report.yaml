      - number: '6.2'
        title: Pre-Order Pipeline and Demand Evidence
        blocks:
          - type: paragraph
            body: >
              Evidence of customer demand is composed almost exclusively of pre-orders and intent orders. In August
              2024, when Xpeng AeroHT announced its $150M Series B1, the company disclosed that it had signed deals with
              nearly 60 flight camps, representing the earliest commercial channel engagement. By November 2024, when
