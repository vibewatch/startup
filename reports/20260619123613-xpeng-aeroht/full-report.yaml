        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT presents a pre-revenue hardware business at the intersection of aerospace and automotive
              manufacturing, financed by over $900 million of disclosed capital and backed by a strategic parent (XPEV)
              with manufacturing and regulatory relationships in China. The revenue model is straightforward—unit
              vehicle sales at a capped list price— but the key financial inputs for underwriting are unavailable: gross
              margin, COGS, burn rate, cash on hand, capex committed, and post-Series B2 valuation are not in the public
              domain. The >7,000 pre-order pipeline and 600-unit Middle East agreements imply demand signal but cannot
              be converted to revenue forecasts without production and certification confirmation. The company's
              certification path (TC and PC applications both accepted by CAAC, compliance confirmation phase underway)
              and planned 2026 delivery suggest the pre-revenue window should be short if timelines hold—but Lilium's
              collapse and Western peers' continued slippage warrant scenario analysis on a 12–24 month delay. At RMB 2
              million per unit and 10,000 units per year, the theoretical revenue ceiling (~$2.8B annualized) is large;
              the key question is what gross margin remains after aviation-grade COGS, SG&A, and after-sale support. Any
              investor or acquirer must obtain audited financials, burn rate disclosure, and a capex schedule before
              completing financial due diligence. The IPO path signals eventual transparency, but timing is
