      - number: '2.2'
        title: Market Size and Growth Forecasts
        blocks:
          - type: paragraph
            body: >-
              The macro context for AeroHT's market is the China low-altitude economy, which reached 505.95 billion yuan
              (approximately USD 70 billion) in 2023, a 33.8 percent increase year-on-year, according to CCID
              Consulting, a think tank under China's Ministry of Industry and Information Technology. CCID projects this
              figure to surpass 1 trillion yuan by 2026; the Saidi Research Institute forecasts 1.06 trillion yuan by
              2026. The Civil Aviation Administration of China (CAAC) has a longer-term target of 3.5 trillion yuan by
              2035. Within this macro figure, the eVTOL sub-sector generated approximately 980 million yuan in 2023
              (+77.3 percent YoY), concentrated in EHang's EH216-S sightseeing operations following its CAAC type and
              production certificates. CCID projects China's eVTOL market to reach 9.5 billion yuan by 2026, contingent
              on multiple players receiving type certificates — making 2026 the industry's "certification and
              mass-production year." The personal-ownership eVTOL segment (AeroHT's TAM) is a sub-slice of the eVTOL
              sector; rough SOM estimation from AeroHT's 10,000-unit annual capacity factory × RMB 2 million average
              price implies an annual revenue ceiling of approximately RMB 20 billion at full utilisation, but initial
              year volumes will be far below capacity. Porsche Consulting estimated in 2023 that China would account for
              25–30 percent of the global eVTOL market by 2030. The China Low Altitude Economy Alliance forecasts the
              Chinese eVTOL fleet to exceed 100,000 units by 2030. Multiple sizing estimates are preserved here because
              they use inconsistent scope definitions (sector-wide vs. eVTOL-only vs. fleet counts vs. revenue), and
              investors should triangulate rather than rely on any single figure.
