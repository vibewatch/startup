      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The personal-ownership eVTOL market at a ~USD 280,000 price point is a premium consumer durable category,
              not a mass-market one. The primary direct buyer and payer is the ultra-high-net-worth (UHNW) individual —
              typically purchasing for personal leisure, scenic adventure travel, or as a status asset — who also serves
              as the pilot/user after obtaining the required low-altitude pilot qualification. The adoption path for
              this segment runs through four gates: pre-order/reservation, factory delivery (planned for 2026), pilot
              training and licensing, and first operational flight. Xpeng AeroHT reported more than 4,000 pre-orders and
              over 200 camp partnerships as of 2025, suggesting a second institutional buyer archetype: camp and resort
              operators who purchase LAC units to offer flight experiences as premium amenities for guests (B2B2C
              model). These operators pay for the unit and operations from their hospitality revenue budgets and bear
              the regulatory compliance burden on behalf of end guests. A third pathway, tourism service providers
              offering scenic sightseeing flights in scenic areas, mirrors EHang's early EH216-S commercial model.
              Corporate buyers using personal eVTOL for executive transport to remote campuses or resorts are a smaller,
              early-stage segment. All segments face a shared constraint: the buyer must either obtain a pilot license
              or operate in areas where autonomous or remotely supervised flight is permitted — a regulatory gap that is
              still being resolved in China's evolving framework. Air taxi services, by contrast, price individual rides
              at an estimated 200–300 yuan per one-way trip for short urban routes, targeting mass-market commuters who
              are explicitly not AeroHT's buyers.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM044
