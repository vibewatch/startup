      - number: '4.2'
        title: Capital Structure and Funding History
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT has completed four distinct financing events totalling over $900 million in disclosed
              external capital. The Series A round, closed October 2021 at a pre-money valuation exceeding $1 billion,
              raised more than $500 million—the largest single financing in Asia's manned low-altitude aviation sector
              at the time—with investors including IDG Capital, 5Y Capital, and Xpeng Motors. A three-year gap preceded
              the Series B1 tranche of $150 million, closed in August 2024 and led by three state-owned investors in
              Guangzhou, followed by the Series B2 tranche of $100 million, completing the $250 million Series B in July
              2025. Electrek noted total disclosed funding exceeds $750 million from Series A+B, with InsideChina Auto
              and others citing total capital including XPEV equity at over $900 million. In June/July 2025, Xpeng
              AeroHT appointed Du Chao—a Deutsche Bank banker with ten years of overseas IPO experience—as its first
              CFO, a widely interpreted signal of IPO preparation. Bloomberg reported in May 2025 that Xpeng had invited
              banks to pitch for an AeroHT IPO in Hong Kong or the US; management said the IPO timing remained
              undisclosed with near-term focus on R&D and mass production. Post-Series B2 valuation has not been
              disclosed. The Series A pre-money benchmark of $1 billion likely understates the current implied valuation
