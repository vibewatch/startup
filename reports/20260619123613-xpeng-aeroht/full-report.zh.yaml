      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 资本耗尽是行业的生死风险
            body: >
              Lilium 2024 年破产和 Volocopter 2024 年 12 月破产申请证明，即使资金充裕的 eVTOL 玩家，也可能在型号认证前倒下。Lilium 融资超过
              $1B，仍然耗尽跑道；Volocopter 只有在 Mudrick Capital 重组后才拿到 $850M 救助包。AeroHT 的 $250M Series B
              覆盖近期工厂资本开支，但在资本市场不利条件下，可能不足以支撑多年 CAAC 型号认证周期。
            calloutType: risk
            claimRefs:
