      - CV008
      - CV014
      - CV038
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: |
      从 Xpeng AeroHT 2013 年创立，到 2025 年 10 月迪拜商业突破，再到 2026 年初工厂试生产的关键日期事件。
    data:
      items:
