  - id: FE002
    title: 客户飞行流程——驾驶、部署、飞行、返航
    type: flow
    layout: wide
    summary: |
      Land Aircraft Carrier 用户从道路行驶，到空中模块部署、飞行、自主着陆，再到下一次飞行前补能的端到端运营流程。节点显示用户动作和关键系统事件；边显示运营顺序。
    approximationNotes: |
      流程来自产品演示视频、官方产品描述和 evtol.news 技术报道。确切部署时间（公司描述为自动且快速）、充电时长和路线规划界面步骤基于公司披露数字；这些时间尚无独立验证。
    data:
      nodes:
        - id: n1
          label: 驾驶（GMS 模式）
          detail: 用户驾驶 GMS 前往出发点；空中模块存放在后舱并充电；CLTC 道路续航 >1,000km
        - id: n2
          label: 路线规划
          detail: 飞行员使用智能路线规划界面；假设已获得 ATC / UTM 放行；出发点必须有足够的降落坪或开放区域
        - id: n3
          label: 自动部署
          detail: 单个指令触发自动部署：GMS 降低，后门打开，车顶回缩，空中模块沿轨道滑出，起落支柱和机臂展开，螺旋桨进入待命
        - id: n4
          label: 飞行前检查
          detail: 系统自检；一键起飞待命；飞行员坐在座舱内使用 6 合 1 操纵杆；选择自主或手动模式
        - id: n5
          label: VTOL 起飞
          detail: 借助 6 个 VTOL 螺旋桨垂直升力起飞；8 电机 DEP 冗余激活；高度和位置稳定
        - id: n6
          label: 巡航飞行
          detail: 2 个涵道风扇提供前向推力；智能路线引导；手动或自主导航；2 座全景座舱
        - id: n7
          label: 自主降落
          detail: 自主降落系统识别着陆区；受控下降；四轮车支柱式起落架触地；飞行员可切换为手动接管
        - id: n8
          label: 自动收回与充电
          detail: 飞行模块折叠并滑回 GMS；GMS 为模块充电；每次 GMS 满电可支持 5–6 次飞行；18 分钟快充 30→80%
