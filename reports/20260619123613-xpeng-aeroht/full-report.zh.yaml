      - number: '3.4'
        title: 护城河耐久性、替代品与负面竞争证据
        blocks:
          - type: paragraph
            body: >
              eVTOL 行业的护城河格局仍在流动。Joby 与 FAA 深度互动（17+ 年认证工作、SR3 审计完成、首架符合构型的 TIA 飞机升空）以及 $2.5B
              现金头寸，构成最强西方护城河：按当前烧钱速度，资本跑道超过两年，eIPP 计划也在正式型号认证前降低上市风险。Archer 的 $1.8B 资产负债表和 Phase 3 完成，使其成为可信第二名。EHang
              在中国护城河最宽：它持有唯一 CAAC 认证的无人驾驶 eVTOL，也是唯一运行商业服务的运营商；这项监管先发优势可持续至少 2–3 年，因为竞争对手仍需走完 CAAC 流程。AeroHT 的护城河仍处早期：12
              年研发和 7 代原型机提供工程可信度，母公司 Xpeng（XPEV）提供 AI 软件、供应链和分销基础设施。但 AeroHT 尚无型号合格证，消费端飞行员执照要求限制可寻址市场，西方竞争对手在最大高端市场的
              FAA / EASA 认证上有结构性优势。替代品仍强：直升机服务同样的快速交通用途，载荷和航程更高，尽管每飞行小时运营成本约为 6–7 倍；中国高铁是约 500km
              以下城际路线的直接低成本竞争者；城市网约车（DiDi、出租车）主导 50km 以下出行。负面证据严重：德国 Lilium 在通过 SPAC 融资超过 $1B 后，仍因未能筹集 €100M 应急融资而于 2024
              年 10 月申请破产；其子公司按德国法律申请，运营停止。Volocopter 因 EASA 发动机认证失败，取消 Paris Olympics 2024 计划，并在 2024 年 12
              月启动破产程序，后经债务重组由 Mudrick Capital 取得多数控制。法律风险尖锐：Joby 于 2025 年 11 月起诉 Archer 涉嫌商业间谍；Archer 反诉
              Joby，指控其隐瞒中国关联并进行零部件欺诈标识；Archer 还起诉 Vertical Aerospace 侵犯 Midnight 专利。这些诉讼消耗管理层注意力和资本，也说明 IP 与认证时间线正在被争夺。
