        - 中国民用航空局
        - 中国 TC、PC 和 AOC 发放的唯一主管机关
        - 极高——100% 依赖单一监管机构，没有替代路径
        - 监管搁置、追加条件，或直接拒绝认证
        - 关键
        - 持续与 CAAC 沟通；EHang 的 TC/PC/AOC 先例表明认证可以跑通；何小鹏在全国人大层面发声
        - 没有替代监管路径；若延迟或拒绝，按当前时间线推进中国商业化会终止
      - - Xpeng Motors 母公司——资本与制造基础设施
        - 'Xpeng Inc.（NYSE: XPEV；HKEX: 9868；母公司）'
        - 多数股东；工厂基础设施；EV 动力总成供应链；资产负债表支持
        - 很高——AeroHT 是 Xpeng 生态中约 6 年投入；CAPEX 可用性取决于母公司财务健康
        - Xpeng EV 业务资本承压，或 AeroHT 在战略上被降级
        - 高
        - Xpeng 已通过多轮融资持续投入 AeroHT，合计超过 $750M；AeroHT 的 IPO 路径会随时间降低对母公司的依赖
        - 若 Xpeng 遭遇 EV 市场下行，AeroHT 的 CAPEX 支持可能被削减，或被迫以较不利条款募集外部资本
      - - 航空级电池电芯与储能供应商
        - 中国电池制造商（市场龙头包括 CATL）
        - 面向 X3-F eVTOL 模块的高密度航空级能源电芯；快充能力是产品差异点
        - 高——全球合格航空级电芯供应商有限；航空资质绑定具体供应商
        - 产能受限；X3-F 所需特定电芯规格的航空资质延期
        - 高
        - Xpeng 的 EV 供应链关系带来优先供应商准入，也让团队熟悉高密度电芯技术
        - 新供应商导入的航空资质需要 12–24 个月；TC 流程启动后切换空间有限
      - - 碳纤维复合材料机体制造商
        - 广东集群内的中国航天航空复合材料供应商
        - X3-F 飞行模块的结构机体；轻量化复合材料对飞行性能至关重要
        - 高——航天航空级复合材料生产在地理上集中；供应商认证周期长
        - 供应中断；质量不符合；专业复合材料存在潜在贸易限制风险
        - 高
        - 广东航天航空产业集群让供应商近在周边；Xpeng 的 EV 供应链经验有帮助
        - 公司未披露替代采购安排；供应中断会让生产停摆，并拖慢认证证据收集
      - - 飞行员执照与垂直起降场基础设施生态
