      - number: '7.3'
        title: 依赖与合作伙伴风险
        blocks:
          - type: paragraph
            body: >-
              AeroHT 处在一张高度集中的依赖网络中。CAAC 是中国 TC、PC 和 AOC 签发的唯一闸门，这让公司面临单一监管机构集中风险，而该机构在载人 eVTOL 上先例非常有限。Xpeng Motors
              同时是大股东、制造基础设施提供方和 EV 动力总成供应链来源——但这也意味着 AeroHT 的战略自主性和 CAPEX 可得性受 Xpeng 自身 EV
              业务动态与资本状况约束。航空级电池供应商和碳纤维复合材料制造商构成零部件层面的依赖，一旦中断，重新认证周期可能长达 12–24 个月。工厂集中在广东，也带来供应链和劳动力中断暴露。需求侧，约 5,000
              份意向订单和 600 台中东订单显示早期商业兴趣，但大多仍是非约束性承诺。商业规模收入不仅需要 TC/PC/AOC
              签发，还需要可运转的飞行员执照生态、垂直起降场基础设施和低空空域管理规则——这些都在中国监管机构积极推进但尚未完成的建设中。EHang 从 TC 签发走到广州、合肥公开商业售票，约用了 30 个月；AeroHT
              的载人车辆更复杂，而且尚无 TC 起点，即便在乐观情景下，完整商业运营最早也指向 2028 年。
