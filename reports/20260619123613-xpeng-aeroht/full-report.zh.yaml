      - 隐含估值区间（USD）
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - CAAC 在 2027 年 H2 发放 TC；2027–28 年成功在香港或美国 IPO；以约 $280K 单价交付 1,000+ 架；中东订单转化；eVTOL 板块向上重估
        - IPO 时 $3B – $5B
        - 认证滑期；IPO 风险偏好弱；Xpeng 缩减资金；中国地缘政治风险
        - 已提交 IPO 招股书 + CAAC 发放 TC + 确认超过 500 个付费定金订单
      - - 基准
        - CAAC 在 2027–28 年发放 TC，但经历类似 EHang 的延迟；IPO 估值较可比公司小幅溢价；成熟期交付 500–800 架；需要额外稀释性融资
        - $1B – $1.6B
        - 可比公司倍数压缩；交付爬坡慢；eVTOL 诉讼风险传导
        - CAAC 特殊条件获批 + CFO 路演确认 + 订单簿质量通过验证
      - - 熊市
        - 认证滑到 2028 年以后，或特殊条件被拒；降估值轮后投后估值低于 $1B；工厂爬坡失败；eVTOL 板块逆风持续
        - $0.5B – $0.9B
        - 资本耗尽；中国科技监管；Xpeng 母公司财务压力；CAAC 不利裁定
        - 未达工厂生产目标 + 新一轮融资价格低于 2021 年估值标记
    notes: 场景由作者基于阶段折价可比公司分析和截至 2026-06-19 的公开板块数据构建。公司没有提供财务模型。隐含估值为高不确定性估算；实际 IPO 定价可能显著偏离。概率信号是可观察领先指标，不代表分配概率权重。
