          - type: callout
            title: 中东是首个国际消费市场
            body: >
              2025 年 10 月迪拜活动带来 600 台采购协议，并获得阿联酋 GCAA 特别飞行许可，由此确立中东为 Xpeng AeroHT / Aridge
              最具体的国际需求落脚点。高净值消费者密度、政府对先进空中交通的热情，以及阿联酋作为新型交通早期采用者的记录（例如 Joby 迪拜六年独家合作），让海湾地区成为一个可信的首个国际商业市场；但所有销售仍取决于
