      - number: '2.2'
        title: 市场规模与增长预测
        blocks:
          - type: paragraph
            body: >-
              AeroHT 所处市场的宏观背景是中国低空经济。根据中国工业和信息化部下属智库 CCID Consulting，2023 年该市场规模达到 5,059.5 亿元人民币（约 USD 70 billion），同比增长
              33.8%。CCID 预计该数字到 2026 年将超过 1 万亿元；Saidi Research Institute 预测 2026 年达到 1.06 万亿元。CAAC 的更长期目标是 2035 年达到 3.5
              万亿元。在这个宏观数字内部，eVTOL 子行业 2023 年创造约 9.8 亿元人民币收入（同比 +77.3%），主要来自 EHang 的 EH216-S 观光运营，该机型已获得 CAAC
              型号合格证和生产许可证。CCID 预计中国 eVTOL 市场到 2026 年达到 95 亿元人民币，前提是多家企业取得型号合格证——也就是行业的「认证与量产年」。个人拥有 eVTOL 细分市场（AeroHT 的
              TAM）只是 eVTOL 行业中的一小块；粗略 SOM 可由 AeroHT 年产 10,000 台工厂 × 人民币 200 万元平均价格推算，满产时年收入上限约人民币 200
              亿元，但首年销量会远低于产能。Porsche Consulting 2023 年估计，到 2030 年中国将占全球 eVTOL 市场的 25–30%。China Low Altitude Economy
              Alliance 预测中国 eVTOL 机队到 2030 年将超过 100,000 架。这里保留多组规模估算，因为它们的范围定义不一致（全行业、仅
              eVTOL、机队数量、收入），投资者应交叉校验，而不是依赖单一数字。
