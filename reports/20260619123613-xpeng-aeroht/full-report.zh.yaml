  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: standard
    summary: 从证据维度（产品验证、认证风险、资本强度、行业环境、估值缺口）推导至 TRACK 建议的逻辑链。
    data:
      nodes:
        - id: n1
          label: 产品与市场验证
          note: 首次载人飞行；5,000+ 订单；工厂投产；中东扩张
        - id: n2
          label: CAAC 认证风险
          note: TC/PC 申请已受理；仅处于符合性阶段；EHang 用时 20+ 个月
        - id: n3
          label: 资本强度
          note: 已融资 >$900M；零收入；Archer 可比公司认证前每年烧钱 $700M+
        - id: n4
          label: 行业倍数压缩
          note: Lilium 破产；Volocopter 破产；Beta 较 IPO 下跌 50%；Archer 下跌 33%
        - id: n5
          label: 估值证据缺口
          note: 最近披露估值 >$1B（2021 年）；无 2026 年更新；Bloomberg IPO 未确认
        - id: n6
          label: TRACK 建议
          note: 首个买入信号：获得 CAAC TC + 披露投后估值 >$2B
      edges:
        - from: n1
          to: n6
          label: 正面信号
        - from: n2
          to: n6
          label: 约束时间线
        - from: n3
          to: n6
          label: 抬高入场门槛
        - from: n4
          to: n6
          label: 行业逆风
        - from: n5
          to: n6
          label: 买入证据不足
    approximationNotes: 逻辑链为基于截至 2026-06-19 已审阅证据的分析判断；各因素权重为定性判断。
    claimRefs:
