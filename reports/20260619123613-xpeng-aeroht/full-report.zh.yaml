      - number: '4.6'
        title: 财务结论与尽调阻断点
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT 是一个处在航空航天与汽车制造交叉点的收入前硬件业务，已获超过 $900M 披露资本，并有战略母公司 XPEV
              支持，后者在中国具备制造和监管关系。收入模型直接——按封顶标价销售整车——但承销所需的关键财务输入不可得：毛利率、COGS、烧钱速度、账面现金、已承诺资本开支和 Series B2
              后估值都不在公开领域。>7,000 台预订单管线和 600 台中东协议释放需求信号，但在生产和认证确认前，不能转化为收入预测。公司的认证路径（TC 和 PC 申请均获 CAAC 受理，合规确认阶段正在推进）和
              2026 年交付计划表明，如果时间线守住，收入前窗口应较短；但 Lilium 倒闭和西方同行持续滑坡，要求对 12–24 个月延误情景进行分析。在人民币 200 万元单价和年产 10,000
              台假设下，理论收入上限（年化约 $2.8B）很大；关键问题是扣除航空级 COGS、SG&A 和售后支持后还剩多少毛利。任何投资者或收购方在完成财务尽调前，都必须拿到审计财务、烧钱速度披露和资本开支计划。IPO
              路径预示最终会提高透明度，但时间由管理层决定。
