      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 建议——TRACK
            body: >-
              AeroHT 获得 TRACK 评级，置信度低。公司已经展现真实的技术和商业进展，但公开证据不足以支持在任何估值下买入。第一个买入信号：CAAC 型号合格证获批，并由可信机构来源披露超过 $2B 的 Series
              B 后投后估值。
            calloutType: recommendation
            claimRefs:
              - CV040
              - CV041
          - type: callout
            title: 行业破产先例——反向信号
            body: >-
              Lilium（2024 年 10 月）和 Volocopter（2024 年 12 月）尽管分别融资超过 $1B 和 $600M，且都有活跃认证项目，仍申请破产。这些失败说明，eVTOL
              独角兽身份和机构背书不能保证企业在资本密集和认证延迟面前活下来。AeroHT 处于收入前阶段，CAAC 时间线尚未确认，任何投资者材料都应明确披露破产风险。
            calloutType: risk
            claimRefs:
              - CV028
              - CV029
              - CV042
          - type: callout
            title: 估值假设——2021 年锚点与阶段折扣
            body: >-
              在缺少已披露 2026 年私募估值的情况下，所有情景估值都以 2021 年超过 $1B 的投前估值为锚，并根据（a）截至 2026 年 6 月的公开 eVTOL 市场数据，以及（b）30–50%
              的认证阶段折扣调整；该折扣反映 AeroHT 的 CAAC 进度早于 Joby 高级 FAA 第 4 阶段。上述调整是作者估算，不能替代实际披露估值。
            calloutType: assumption
            claimRefs:
              - CV034
              - CV035
