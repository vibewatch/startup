  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              与 Xpeng AeroHT 相关的市场位于中国官方定义的「低空经济」之内，通常指约 1,000
              米及以下空域内的商业和个人活动。这个宏观类别覆盖无人机物流、应急服务、精准农业、城市空中交通（按需空中出租车）服务，以及个人拥有的 eVTOL 车辆。Xpeng AeroHT
              只竞争个人拥有细分市场——这是车辆购买市场，不是按次乘坐服务——产品是「陆地航母」（LAC），单价不超过人民币 200 万元（约 USD
              280,000）。这一定位与销售座位而非飞机的商业空中出租车运营商（Joby、Wisk、EHang 的旅游服务）不同，也不同于服务物流和 B2B 客户的工业无人机运营商。LAC
              需要替代或补充的现有方案包括个人直升机（购置价通常 USD 1–3 million，且运营成本高）、观光直升机旅游套餐（每人 USD
              150–500）、包机，以及同样服务休闲和度假区间出行场景的豪华越野车。消费端直接竞争者 GAC Group 于 2025 年 6 月推出量产飞行汽车 GOVY AirCab，建议零售价低于人民币 168
              万元，印证中国可寻址消费级 eVTOL 市场正在形成。无人机物流、应急服务和商业按需空中出租车不在 AeroHT
              当前产品范围内；这些被视为相邻市场，可能共享监管框架和基础设施，但买方旅程、价格点和竞争动态根本不同。中国修订后的《民用航空法》将于 2026 年 7 月生效，首次把 300 米及以下分类制度写入法律，为低空个人
              eVTOL 与更高空商业航空之间划出更清晰的监管边界。
