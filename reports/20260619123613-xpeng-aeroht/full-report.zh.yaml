      - number: '5.4'
        title: 认证与监管进展
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT 在 Land Aircraft Carrier 的 CAAC 认证路径上取得了可衡量但尚未完成的进展。X3-F 飞行体的型号合格证（TC）申请于 2024 年 3 月 21
              日获中国民用航空局正式受理，标志着一种新型模块化飞行汽车首次进入中国航空监管的正式审查。CAAC 随后发布 X3-F
              新颖设计的专用适航条件——这是合规验证启动前的必要步骤——也说明监管机构承认，在道路和空中使用之间切换的车辆带来独特认证挑战。截至 2025
              年中，该项目进入符合性确认阶段，制造商必须通过测试数据、分析或检查证明设计满足每一项专用条件。与此同时，X3-F 机体的生产许可证（PC）申请于 2025 年 5 月获 CAAC
              受理，反映制造体系已成熟到可以进入生产许可证审查。TC 和 PC 两项证书都必须签发后，单架航空器才可获得标准适航证。定期商业运营开始前，还需要额外取得航空运营人合格证（AOC）。公司在 2025 年 10
              月迪拜载人演示前获得阿联酋 General Civil Aviation Authority（GCAA）特别飞行许可，这是中国飞行汽车公司首次获得海外载人飞行许可。作为参照，EHang 已持有全球首个面向无人驾驶
              eVTOL 平台的 CAAC TC、PC 和标准适航证，并已在 CAAC 监管下开展商业航空运营服务；在中国监管框架内，它相对 AeroHT 约领先两到三年。
