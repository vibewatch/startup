  - id: TV005
    title: 论点破裂与止损触发器
    columns:
      - 风险
      - 可监控触发器
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - CAAC 认证失败或无限期延迟
        - CAAC 公开门户或新闻中的 TC 申请状态变化
        - CAAC 正式拒绝通知，或特殊条件草案后沉默超过 24 个月
        - 2027 年 IPO 路径消失；现金消耗需求拉长；牛市情景被摧毁
        - 退出持仓；只有 CAAC 重新受理申请时才重新评估
      - - 降估值轮融资
        - 新一轮股权融资公告并披露投前估值
        - 任何投后条款清单定价低于 $1B，或低于 2021 年 Series A 估值标记
        - 确认机构信心流失；增加优先权悬置；稀释普通股
        - 重新评估论点；若估值更低且条款更好，可能出现入场机会
      - - 工厂产量短缺
        - 月度产量披露或行业媒体工厂探访
        - 尽管声明产能为 10,000 架，到 2026 年底工厂年产仍低于 500 架
        - 收入爬坡延迟；现金消耗期拉长；订单簿面临取消风险
        - 密切跟踪；设定 12 个月复查；若产量无改善则下调评级
      - - Xpeng 母公司财务压力
        - Xpeng Inc. 季度业绩和股价表现
        - Xpeng 股价较 2026 年 6 月水平下跌超过 30%，且披露经营现金流为负
        - 可能削减母公司资本支持；AeroHT IPO 准备可能被降级
        - 要求 AeroHT 独立资产负债表披露；评估独立跑道
      - - IPO 前关键高管离职
        - LinkedIn、Weibo 和新闻监控
        - CEO / 创始人赵德力或 CFO 杜超在 IPO 注册前宣布离职
        - 执行风险升高；IPO 准备受扰；投资者信心受损
        - 调查原因；提高监控频率；考虑下调评级，以避开待澄清期
    notes: 触发器是作者定义的可观察事件；阈值为示意，应按组合风险容忍度校准。止损标准相互独立：任何单个触发器达到阈值，都足以要求立即重估。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV041
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 更新后的 2026 年估值标记
        - Series B2 后（2025 年 7 月）的投后股权结构表和每股价格
        - 入场价格纪律需要当前估值标记；2021 年锚点已有 5 年，且公司仍在收入前
        - 向 AeroHT CFO/IR 索取；寻找 IPO 前投资者条款；招股书提交后监控
      - - CAAC 认证里程碑排期
        - 官方 CAAC TC 排期、特殊条件批准日期，以及第 2 阶段及之后的合规时间线
        - 认证日期是所有场景中最大的单一价值驱动因素；公开时间线不存在
        - 复核 caac.gov.cn 的 CAAC 公告；聘请中国航空监管顾问；跟踪 AeroHT 新闻
      - - 订单簿质量和定金率
        - 5,000+ 意向订单中，不可退定金订单与软性意向订单的比例
        - 订单簿质量决定收入可预测性，也决定 IPO 承销商眼中的需求可信度
        - 要求管理层披露；监控行业媒体（AIN、VerticalMag）的订单簿更新
      - - AeroHT 独立现金和烧钱速度
        - AeroHT 经审计独立财务报表，或母公司 AeroHT 分部披露
        - 决定可运行月份数，以及 IPO 前发生稀释性过桥轮的可能性
        - 获取经审计财务数据；复核 Xpeng 20-F 中的 AeroHT 分部注释（2026 年 4 月向 SEC 提交）
      - - 优先股堆栈和清算瀑布
        - Series A 和 Series B 条款清单，列明清算优先权、反稀释条款、按比例认购权
        - 在低于牛市的退出场景中，优先权悬置可能让普通股股东回报有限
        - 向管理层索取；可能需要进入尽调资料室；评估 IPO 时是否转换为普通股
    notes: 尽调问题按价值重要性排序，而非获取难度。第 1–2 项是买入建议的门槛；第 3–5 项是承销或大额建仓所需。一些项目（股权结构表、条款）可能只有在正式投资流程中才能取得。
    claimRefs:
      - CV005
