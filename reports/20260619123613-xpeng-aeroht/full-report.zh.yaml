      - number: '5.6'
        title: 竞争架构对标
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT 的 Land Aircraft Carrier 在全球 eVTOL
              版图中占据一个独特但商业上受限的细分位。它的公路加空中模块化架构没有直接对应物：所有主要西方竞争对手（Joby、Archer、Wisk、BETA Technologies）都是不带地面母舰组件的纯 eVTOL
              航空器，EHang 的 EH216-S 则是无人驾驶城市接驳多旋翼，而不是面向消费者生活方式的车辆。但 AeroHT 的 X3-F 要求飞行员执照，这构成显著的消费者采用门槛；EHang
              的完全无人驾驶模式则完全绕开了这一点。Joby 的五座加飞行员座 S4 倾转旋翼（200 mph、100 英里续航、45 dBA 巡航噪声）处于 FAA 第 4 阶段认证，SR3 已完成，符合性 TIA
              航空器已飞行，并从 2026 年起通过 eIPP 覆盖美国 12 个州的早期运营；其 2026 年一季度 $2.5 billion 现金头寸给了它西方同业中最深的跑道。Archer 的
              Midnight（四座加飞行员，约 60 英里续航）于 2026 年 4 月成为首个完成 FAA 第 3 阶段的 eVTOL，持有约 $1.8 billion 现金。BETA Technologies 入选八个
              eIPP 名额中的七个，是所有公司中比例最高者，并瞄准先防务、再货运、后客运的推进顺序。Wisk Aero（Boeing 支持）是美国高级测试中唯一的完全自主 eVTOL
              候选者，差异化押注长期单位经济性，而不是短期消费者采用。AutoFlight（上海）于 2024 年 2 月完成全球首次跨海城际 eVTOL 演示（50 km，珠江湾），并正为其 Prosperity
              倾转旋翼推进 CAAC 认证。FAA 的 Advanced Air Mobility 计划和 eIPP 基础设施显示，西方玩家已有相对成熟的美国监管路径；相比之下，飞行汽车类别的 CAAC 路径仍然新颖且更慢，而
              EHang 所在的无人驾驶多旋翼类别已经完成认证。
