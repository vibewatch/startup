          - type: callout
            title: EHang 的认证领先形成 2–3 年国内护城河
            body: >
              EHang 持有唯一一张无人驾驶载人 eVTOL 的 CAAC 型号合格证，也是中国唯一开展商业航空运营人合格证飞行的公司。AeroHT 和 AutoFlight 仍在认证中；这 2–3 年领先让 EHang
              在中国旅游和智慧城市合同中获得先发优势。一旦运营商关系和监管先例成型，后来者很难替换。
