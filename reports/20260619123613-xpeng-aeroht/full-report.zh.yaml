            body: >
              Xpeng AeroHT 已完成四次不同融资事件，已披露外部资本合计超过 $900M。Series A 于 2021 年 10 月完成，投前估值超过 $1B，融资超过
              $500M，是当时亚洲载人低空航空领域单笔最大融资；投资方包括 IDG Capital、5Y Capital 和 Xpeng Motors。三年空窗之后，公司于 2024 年 8 月完成 $150M Series
              B1，由广州三家国资投资机构领投；随后完成 $100M Series B2，并于 2025 年 7 月使 Series B 总额达到 $250M。Electrek 指出 Series A+B 的披露融资总额超过
              $750M；InsideChina Auto 等则引用包含 XPEV 股权在内的总资本超过 $900M。2025 年 6 月 / 7 月，Xpeng AeroHT 任命有 10 年海外 IPO 经验的
              Deutsche Bank 银行家杜超为首任 CFO，被广泛解读为 IPO 准备信号。Bloomberg 2025 年 5 月报道称，Xpeng 已邀请银行竞标 AeroHT 在香港或美国 IPO
              的项目；管理层表示 IPO 时间仍未披露，近期重点在研发和量产。Series B2 后估值未披露。考虑到生产设施投资和预订单积压，2021 年 Series A 的 $1B 投前估值基准很可能低估当前隐含估值。
