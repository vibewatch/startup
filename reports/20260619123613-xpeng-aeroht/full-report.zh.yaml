      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 行业执行风险——同行破产暴露资本与监管危险
            body: >
              Lilium 一度估值数十亿美元，却在 2024 年 10 月因未能获得新增融资而申请破产，说明 eVTOL 行业的资本强度和监管复杂度足以压垮资金充裕的玩家。Xpeng AeroHT
              的结构性位置更强：已披露融资基础较大（>$750M），且有母公司支持；但商业化创收运营开始前，仍必须跨过多个 CAAC 认证关口（TC、PC、适航证和航空运营人合格证）。2026
              年若出现任何认证延误或成本超支，都会拉长收入前周期，并加大对母公司或投资者持续支持的依赖。
            calloutType: risk
            claimRefs:
              - CO033
              - CO040
              - CO015
          - type: callout
            title: 与国家资本同向，并获得政府基础设施支持，降低执行风险
            body: >
              Series B1 由三家广州国资投资机构领投，公司还与广州开发区管委会签署投资合作协议，推动工厂落地黄埔。与政府同向让公司获得补贴土地、基础设施和监管善意；这些通常是中国以外 eVTOL
              同行缺少的资源，也实质性降低了工厂开发和审批风险。
