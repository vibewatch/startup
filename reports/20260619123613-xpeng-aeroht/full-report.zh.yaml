            body: >-
              牛市情景设想 CAAC 在 2027 年下半年授予型号认证，公司凭借年交付 1,000 台以上、平均售价 $280K 的表现，以 $3–5B 估值成功在香港 IPO，并在 2025 年 10 月迪拜签署 600
              台采购协议后实现强劲中东订单转化。这个情景要求 Xpeng 母公司持续支持、认证没有重大挫折，并且 eVTOL 投资者胃口在 2024–2026 年倍数压缩后恢复。基准情景是，在类似 EHang 的延迟后，公司于
              2027–2028 年完成认证，以可比公司调整后倍数的混合结果在 $1–1.6B 估值 IPO，并在认证后第一年交付 500–800 台。熊市情景则是认证滑到 2028 年之后（或未通过专用条件）、以低于
              2021 年独角兽门槛的估值下轮融资，并且 eVTOL 行业逆风持续到本十年后期。敏感性分析显示，认证时间是最大的单一价值驱动因素，其次是 IPO
              退出倍数和订单到交付转化率。把评级上调至「买入」的建议监测阈值，是取得 CAAC 型号合格证，并披露高于 $2B 的投后条款书。
            claimRefs:
