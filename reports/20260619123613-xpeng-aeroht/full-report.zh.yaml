      - number: '7.7'
        title: 图表
        blocks:
          - type: callout
            title: CAAC 认证是唯一有约束力的瓶颈
            body: >-
              CAAC TC 和 PC 签发之前，不会有商业交付、收入，也不会有可信的 IPO 定价。其他风险——资本耗尽、竞争替代、采用障碍——只要 TC 按期到来，都可能被管理。反过来，如果 TC
              明显延迟，其他所有风险都会叠加放大。截至 2026 年中，TC 时钟尚未真正启动；按照 EHang 专用条件后 20 个月的时间线，AeroHT 最乐观的 TC 日期也在 2026 年末。
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR050
          - type: callout
            title: 行业类比确认资本跑道风险真实且迫近
            body: >-
              Lilium（2024 年 10 月破产）和 Volocopter（2024 年 12 月破产）都在认证到量产的缺口中耗尽资本，破产前分别融资 $800M–$1B+。AeroHT 累计融资
              $750M+，只是与失败同业在更早里程碑上相当，并不意味着免疫同一种动态。Xpeng 母公司支持是关键差异点，但该支持取决于 Xpeng 自身财务健康和战略优先级。
