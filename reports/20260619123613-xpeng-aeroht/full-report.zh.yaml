              Xpeng AeroHT 正在广州开发区建设专属飞行汽车制造基地。公司与地方政府签署投资合作协议后，于 2024 年 10 月开工。该设施设计年产能 10,000 台，把汽车规模化装配实践用于航空级质量要求。截至
