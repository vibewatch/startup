      - number: '7.6'
        title: 情景清单与否决标准
        blocks:
          - type: paragraph
            body: >-
              五个主要风险情景主导 AeroHT 的投资风险画像。（1）认证延迟：CAAC 在 2027 年或更晚才签发 X3-F TC——考虑到 EHang 专用条件后 20 个月的时间线，以及 AeroHT
              更复杂的载人设计，这一情景具备合理性。每推迟一个季度，收入前现金消耗都会拉长，并增加 Series C
              必须在压力估值下融资的风险。（2）资本耗尽：意向订单无法以足够速度转为确定订单，制造成本超出计划，Series C 无法获得或只能以严重稀释完成——把 Lilium 和 Volocopter
              的类比套到一家资本更充足但关键节点仍处于收入前的公司，结构性风险仍在。（3）竞争替代：EHang 在中国形成规模，GAC 或另一家中国整车厂在 AeroHT TC
              签发前以更低价切入飞行汽车细分市场，侵蚀先发优势。（4）监管框架缺口：中国飞行员执照、垂直起降场和空域管理建设落后于生产计划，即便 TC 和 PC 签发后，可服务市场仍受限。（5）地缘政治或 IPO
              受阻：中美紧张加剧；AeroHT 的国际 IPO 路径受阻，同时国内资本环境恶化，限制退出流动性。每个情景都有具体监测触发器和否决标准，定义在否决标准表中。
