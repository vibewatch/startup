        - AeroHT 宣布 Series C，或长时间没有公告
        - 全速制造支出已启动，但到 2027 年 Q2 仍未宣布 Series C
        - 复核 Xpeng 20-F 中关于 AeroHT 资本承诺的表述；评估 IPO 时间线作为资本事件的可行性；评估过桥融资风险
