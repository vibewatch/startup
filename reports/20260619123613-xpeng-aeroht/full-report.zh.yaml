      - number: '6.3'
        title: 渠道与分销结构
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT 运营两条不同的需求渠道：国内通过飞行营合作建立体验式渠道，国际则通过已签署的区域经销协议铺设分销渠道。国内飞行营渠道兼具获客和创收功能：飞行营付费承接 AeroHT
              航空器，让本地富裕消费者接触产品，并销售按票计费的飞行体验。截至 2026 年中，公司已与 200
              多个飞行营合作，地点覆盖通用航空机场、景区、文旅小镇和郊区。该渠道不要求大规模车队销售，也能带来早期收入和品牌认知。国际渠道于 2025 年 10 月迪拜活动正式启动，并促成与阿联酋 Ali & Sons
              Group、卡塔尔 Almana Group、科威特 ALSAYER Group 以及阿联酋 Chinese Business Council 的协议。中东被定位为公司的第一个国际消费市场，销售最早预计 2027
              年开始，条件是量产认证车辆完成交付。迪拜演示前，公司已获得阿联酋 General Civil Aviation Authority 特别飞行许可，显示其在该市场的早期监管沟通。公司 2025 年 10 月更名为
              Aridge，意在建立区别于 Xpeng Motors 品牌的全球商业身份。
