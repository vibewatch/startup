        title: 单位经济、烧钱速度与证据缺口
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT 没有公开任何财务报表、管理账或投资者更新信。公司是 Xpeng（NYSE: XPEV）控股的私营实体；XPEV 于 2026 年 4 月 16 日提交的 20-F
              覆盖合并母公司，但没有单独拆出 AeroHT 分部财务。因此，毛利率、COGS、季度烧钱速度和当前现金余额全部未知。「陆地航母」是航空航天级制造产品，需要碳纤维复合材料、8
              台电机、电池包和航空级航电——这些部件类别单位成本高，且没有披露供应商定价。ASP ≤ 人民币 200
              万元，意味着公司必须在航空认证要求下实现接近高端汽车的制造经济。愿望式标价与可实现成本之间的差距，是最重大的承销未知数。同行数据说明商业化前全行业都高度消耗现金：Joby Aviation（2026 年
              Q1：$2.5B 现金、首次商业收入前季度运营亏损约 $175M）和 Archer Aviation（2026 年 Q1：季度调整后 EBITDA 亏损 $172.5M、流动性 $1.8B、收入 $1.6M）。按
              AeroHT 可能规模折算，季度烧钱速度可能落在 $50–200M 区间，但这是行业推断，不是公司披露。预订单押金条款和可执行性也未披露，使 $7,000+ 订单积压很难作为已承诺收入评估。
