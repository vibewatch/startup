          - type: callout
            title: EV 供应链成本优势是结构性的，不是周期性的
            body: >-
              中国全球领先的电动汽车供应链——包括 CATL 级别的高能量密度电池、精密电机和 fly-by-wire 电子系统——可以直接迁移到 eVTOL 制造。AutoFlight
              的初步成本模型显示，运营成本约为直升机同等成本的 15%。这是结构性优势，依赖传统航空供应链的西方既有企业很难复制。
