      - number: '2.5'
        title: 尽调缺口与市场展望
        blocks:
          - type: paragraph
            body: >-
              几个重大缺口限制了对任何精确市场规模估算的信心。第一，个人拥有 eVTOL 细分市场（AeroHT
              的实际可寻址市场）没有独立规模测算，也无法从包含无人机物流、观光服务和工业应用的更宽泛低空经济总量中干净剥离。第二，中国个人 eVTOL
              所有者的飞行员取证框架没有公开文件，导致无法判断购机后有多少买方能合法操作飞行器。第三，针对中国 UHNW 人群在约 USD 280,000 价格点的独立支付意愿调查不存在；4,000+
              预订单是未经验证的预约，押金结构未披露。第四，CAAC、CCID、Saidi Research 和 China Low Altitude Economy Alliance
              的估算采用不同范围定义，直接比较会误导。积极面是，EHang Holdings 的 EH216-S 已从 CAAC 获得全球首张载人无人驾驶 eVTOL 生产许可证，建立了监管先例，实质性降低 AeroHT
              的认证风险。AeroHT 的生产许可证申请已获 CAAC 中南地区管理局受理，型号认证预计推进。全球范围内，Joby Aviation 报告称预计 2026 年在迪拜搭载首批商业乘客，这将成为全球首个已确认的
              eVTOL 创收部署——一个验证需求和监管路径的概念验证数据点，可适用于更广泛行业。中国市场具备结构性优势：高度集中的城市群、严重道路拥堵、强政府指令、成熟中的供应链，以及庞大的 UHNW 买方池。
            claimRefs:
              - CM041
              - CM042
              - CM043
