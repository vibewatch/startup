      - 证据
      - 何种事件会改变判断
    rows:
      - - 正方：在模块化飞行汽车品类中先发，且有真实技术验证
        - 2024 年 11 月全球首次公开载人飞行；5,000+ 意向订单；工厂 2025 年 12 月投产
        - 竞品模块化飞行汽车发布，压缩品类护城河
