      - number: '6.4'
        title: 采用摩擦与监管风险
        blocks:
          - type: paragraph
            body: >
              多个结构性障碍限制 Xpeng AeroHT 在其宣称的 2026 年时间表内，把预订单转化为已交付车队客户。第一，CAAC 于 2025 年 5 月受理生产许可证申请，并就 X3-F eVTOL
              专用认证条件公开征求意见，说明型号认证仍在推进而非已经完成；目前只有 EHang 的 EH216-S 获得了载人 eVTOL 的完整 CAAC 型号认证。EHang
              的认证先例显示，从专用条件发布到取得型号合格证耗时超过 20 个月。第二，$280,000 的价格让 Land Aircraft Carrier
              成为买家池狭窄的豪华级产品；大众采用需要未来更低价车型。第三，更广泛的 eVTOL 行业已经呈现时间表滑坡和资本风险模式。Lilium 曾估值超过 $1 billion，却在未能获得政府过桥融资后于 2024 年
              10 月申请破产，说明预订单管线和强品牌认知并不能抵御资本缺口。截至 2026 年 5 月，专家认为美国行业诉讼（Joby vs. Archer、Archer vs.
              Vertical）进一步削弱投资者信心，并拖慢商业认证时间表。第四，Land Aircraft Carrier 的交付计划已经从 2025 年四季度滑至 2026
              年，符合行业常态。第五，大规模飞行员执照基础设施和垂直起降场 / 起降点网络仍未形成，继续构成大众客户部署的系统级障碍。
