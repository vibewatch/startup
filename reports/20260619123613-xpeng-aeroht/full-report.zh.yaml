      - number: '7.2'
        title: 制造与资本密集度风险
        blocks:
          - type: paragraph
            body: >-
              从结构上看，AeroHT 的制造策略必然资本密集。广州黄埔区工厂占地 120,000 平方米，设计年产 10,000 个航空器模块单元（初期：5,000 个）；试生产于 2025 年开始，装配线满负荷运行时目标每
              30 分钟产出一个 X3-F 模块。资本流出包括工厂建设、航空级碳纤维复合材料工装、电池单元集成、推进系统采购，以及适航所需的质量管理体系。AeroHT 完成了 $250M Series B（2025 年 7
              月）和 $150M Series B1（2024 年 8 月），累计融资超过 $750M。资本密集度是结构性的：每一个 X3-F 模块都是受适航级质量控制约束的载人航空产品——这与 Xpeng 母公司熟悉的 EV
              制造文化根本不同。行业先例令人警醒：Lilium 在申请破产前融资超过 $1 billion，破产前德国政府拒绝了其紧急 €50M 贷款担保；Volocopter 在未能完成巴黎奥运会所需 EASA
              发动机认证后，于 2024 年 12 月申请破产。AeroHT 可部分受益于 Xpeng 的供应链关系和 EV
              制造能力，但航空级产品大规模生产的独特质量要求，尚未通过持续商业批次得到验证。高资本需求、漫长认证周期和交付前收入有限叠在一起，在当前现金头寸和首个交付收入事件之间制造了结构性的融资窗口风险。
