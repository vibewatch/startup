      - number: '5.3'
        title: Ground Mother Ship 与动力系统
        blocks:
          - type: paragraph
            body: >
              Ground Mother Ship（GMS）是一台专门设计的六轮三轴全轮驱动越野厢式车，车长约 5.5 米、宽约 2 米。底盘加入后轮转向，提升低速机动性，并提供四至五个座位。GMS
              最关键的技术创新，是在飞行汽车场景中首次部署 800V 碳化硅（SiC）增程式混合动力系统。该系统在地面 CLTC 续航超过 1,000 km，支持飞行航点之间的长距离公路行驶，同时在途中为 X3-F
              空中模块电池充电。空中模块部署时，GMS
              车顶和后部会自动打开：两扇后门开启，后车顶面板回收，让模块沿导轨滑出，落到地面后再完成机臂和螺旋桨部署。车顶行李架、折叠式前格栅和可伸缩遮阳篷服务于露营和休闲使用，也契合公司最初锁定的富裕生活方式消费者。A868
              第二代平台将采用另一套混合电动倾转旋翼动力架构，针对高速城际飞行调校，而不是 X3-F 的短途多旋翼形态；这意味着它是一个单独的工程项目，也会走自己的认证路径。
