      - number: '3.3'
        title: 上市路径、目标买方与制造准备度
        blocks:
          - type: paragraph
            body: >
              AeroHT 在中国的上市路径是通过生活方式飞行营地（截至 2024 年中约签约 60 个站点）和计划中的预订交付直接面向消费者，迪拜则是首个国际市场（2025 年 10
              月首次国际飞行）。目标买方是希望获得陆空一体车辆体验的富裕中国消费者或家庭，而不是企业空中出租车运营商。EHang
              瞄准旅游运营商、政府智慧城市客户和应急响应机构，并通过持有航空运营人合格证的运营商伙伴分销。Joby 的主要 GTM
              是自有服务平台（直接面向消费者的空中出租车），辅以飞机销售；Toyota（制造）、Delta（机场整合）、Uber（预订）和 Blade（纽约运营基地）等战略伙伴给 Joby
              带来独特而宽的分销护城河。Archer 目标服务模型相近，以 LA28 Olympics 作为标志性首发，并以收购 Hawthorne Airport 作为运营锚点；其在 Florida、Texas 和 New
              York 入选 eIPP，放大近期路线密度。BETA 的分销护城河部分来自充电网络和电机 / 零部件业务，客户覆盖 Archer 和 Eve，形成行业内少见的硬件锁定。Wisk（Boeing）受益于 Boeing
              的航空公司客户关系和制造规模。制造准备度方面，Xpeng AeroHT 已建设广州工厂（2024 年封顶），目标年产能 10,000 台；Joby 正从 California Marina 基地扩张，并建设
              Ohio Dayton 新设施（约 1.5M sq ft，目标 2027 年每月 4 架飞机）。Archer 的制造围绕 San Jose 设施和 Hawthorne Airport 枢纽展开。AeroHT
              面向消费者的价格点（约 $279K）把它放在高端 EV / 超跑层级，而非企业机队采购；这会在近期限制其在富裕中国和海湾市场之外的采用。
