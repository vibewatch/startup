        - 消费者飞行员执照体系；垂直起降场选址；城市低空走廊许可；空域管理规则
        - 高——该生态若不能完整运转，消费者市场无法按计划放量
        - 执照框架延期；垂直起降场建设慢于 AeroHT 生产排期
        - 中高
        - Xpeng CEO 在全国人大积极倡议；广州和北京试点区已设立；超过 57,000 家 LAE 领域企业共同推动政策
        - 面向消费者的发布初期仅限试点区；全国部署需要监管成熟，而这不在 AeroHT 掌控之内
    notes: 集中度评级反映公司对每个具体交易对手的依赖程度。严重性反映在当前缓释措施下，失效场景造成的影响。除顶层交易对手外，AeroHT 未公开确认具体二级供应商名称。
