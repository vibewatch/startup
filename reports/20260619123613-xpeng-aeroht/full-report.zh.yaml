  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与直接同行
        blocks:
          - type: paragraph
            body: >
              全球 eVTOL 竞争格局主要沿两条轴线分化：认证辖区（CAAC、FAA、EASA）和自主模型（无人驾驶、有人驾驶、监督式自主）。在中国，EHang 是最主要的直接同行，持有全球首张无人驾驶 eVTOL 的
              CAAC 型号合格证、生产许可证和标准适航证，并在广州和合肥开展商业运营。EHang 的 EH216-S 是一款双座、30km 航程的多旋翼机型，面向旅游和城市空中接驳；VT35
              则瞄准更长的城际路线。AutoFlight（上海）运营 5 座倾转旋翼 Prosperity，并完成全球首次跨海城际 eVTOL 演示（2024 年 2 月，珠江湾 50km），瞄准城内城市交通，估算票价为每人
              ¥200–300——约 USD $28–41。西方市场中，Joby Aviation（NYSE: JOBY）是资本最充足的竞争者，2026 年 Q1 末持有 $2.5B 现金、1,700+ 名工程师，FAA
              Phase 4 正在推进，符合 FAA 构型的飞机已进入飞行测试，eIPP 合作覆盖 12 个美国州以支持 2026 年早期运营。Archer Aviation（NYSE: ACHR）于 2026 年 4 月完成
              FAA Phase 3（首家做到这一点的 eVTOL 公司），现金约 $1.8B。Boeing 支持的 Wisk Aero 追求完全自主四乘客模型，五代飞机累计完成 1,750+ 次安全试飞。BETA
              Technologies 首先瞄准国防、货运和医疗航线，并入选 8 个美国 eIPP 项目席位中的 7 个，是入选最多的公司。德国 Volocopter 在 2024 年底勉强避免倒闭，2024 年 12
              月启动破产程序，在 Mudrick Capital 取得多数控制权后重组，并于 2026 年 4 月获得最高 $850M 资金。Xpeng AeroHT
              的「陆地航母」与所有同行定位不同：它是模块化消费级飞行汽车（eVTOL 飞行单元 + 地面 EV 载体），而不是点对点空中出租车；已有约 5,000 个预订单，目标在 2026 年底以低于人民币 200 万元（约
              $279K）的价格量产。
