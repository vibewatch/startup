            title: EHang 的商业化路径是最可操作的基准
            body: >-
              EHang 先取得 CAAC TC（2023 年 10 月），再取得 PC、AOC，并到 2026 年 3 月在广州和合肥启动商业公开售票——从 TC 签发到面向消费者服务大约用了 30 个月。AeroHT 的
              TC 时钟尚未启动；按 EHang 类比时间线，即使在乐观情景下，规模化商业运营最早也现实地落在 2028–2029 年。投资者应据此校准资本部署和退出期限。
