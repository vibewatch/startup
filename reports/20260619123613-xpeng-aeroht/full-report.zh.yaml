        - EHang 或中国 OEM 年交付公告
        - EHang 或 GAC GOVY 在 AeroHT 获发 TC 前，在中国实现超过 1,000 架年交付
        - 重新评估 AeroHT 的差异化市场位置和定价权；评估是否需要把产品转向商业或车队客户
      - - 消费者采用壁垒兑现
        - 中国飞行员执照获取情况，以及意向订单转为确定订单的比例
        - 到 2027 年底，意向订单取消率超过 30%，或全国 LAE 飞行器飞行员执照发放量低于 10,000 张 / 年
        - 评估消费者需求论点是否仍成立；考虑转向车队、政府、应急响应或商业运营商销售的商业模式
