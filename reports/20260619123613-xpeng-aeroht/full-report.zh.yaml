      - number: '4.5'
        title: 同行基准与行业资本强度
        blocks:
          - type: paragraph
            body: >
              eVTOL 行业结构性地处于收入前、资本密集阶段。上市可比公司显示，领先西方玩家带着数十亿美元资金包进入市场：截至 2026 年 Q1，Joby Aviation 持有 $2.5B 现金，Archer
              Aviation 持有 $1.8B，二者都没有实质性商业收入。德国 Lilium 在 2024 年 10 月申请破产前已融资超过 $1B，说明认证时间线一旦滑坡、过桥融资枯竭，尾部风险会迅速暴露。AeroHT
              已披露总资本 $900M，低于西方龙头当前流动性水平；但 AeroHT 也受益于：（a）中国国家支持的低空经济政策，降低审批难度；（b）Xpeng Motors
              的制造生态和资产负债表，可作为战略后盾；（c）地面车辆组件分摊纯航空资本需求。CNBC 2026 年 5 月报道称，行业诉讼、认证延误和股价下跌（Archer −9%、Vertical Aerospace
              −50%、Beta Technologies 较 IPO −50%）正在削弱投资者兴趣，这一风险可能影响 AeroHT 的 IPO 窗口和未来私募融资渠道。中国国内 eVTOL
              市场在一定程度上与欧美逆风隔离，但并不免疫于投资者情绪变化。600 台中东订单（按标价约 $168M）值得关注，但收入确认取决于 CAAC 认证和产能爬坡；截至本报告日期，两者均未完成。
