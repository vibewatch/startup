            - 部分——已签署购买协议；条款、定金、条件未披露
            - 交付前——尚未收到车辆；2027 年交付目标
            - 无——无车队运营、无续约、无结果数据
        - label: 国内高净值预订池
          values:
            - 否——汇总匿名数量（国内约 4K+）
            - 未知——未披露定金或违约条款
            - 交付前——尚未收到车辆
            - 无——产品尚未进入现场
        - label: 飞行营地运营方（约 200 个合作）
          values:
            - 部分——200+ 合作伙伴按类别披露；未披露单个名称
            - 部分——已签署营地协议；财务条款未披露
            - 体验式运营（仅演示飞行，不是量产 LAC）
            - 无——未披露复购或 NPS 数据
        - label: 政府 / 机构（愿景）
          values:
            - 否——无具名采购合同
            - 无——未披露采购订单
            - 愿景——无量产合同
            - 无——无产品互动
    claimRefs:
      - CU010
      - CU016
      - CU019
      - CU033
      - CU034
  - id: FU004
    title: 客户里程碑时间线——从工厂到预订
    type: timeline
    layout: wide
    summary: Xpeng AeroHT 面向客户的关键里程碑按时间展开，从 2022 年试制工厂完工到 2026 年目标首批量产交付，展示需求建设节奏与截至 2026 年中零交付状态之间的对比。
    data:
      items:
        - label: 试制工厂完工（2022-07）
          description: AeroHT 在广州番禺区启用 35,000 sqm 试制生产设施；迈出面向客户制造的第一步。
        - label: 签署约 60 个飞行营地协议（2024-08）
          description: AeroHT 在 Series B1（$150M）时披露与约 60 个飞行营地达成协议；车辆交付前，首个商业渠道启动。
        - label: 公布价格与交付窗口（2024-09）
          description: AeroHT 确认 Land Aircraft Carrier 售价低于 $280,000，目标 2026 年交付；首次公开承诺具体交付窗口。
        - label: 广州车展 2,000 个订单（2024-11）
          description: 首次公开载人飞行；按标价披露约 2,000 个订单。首个大规模公开需求验证活动。
        - label: CES 2025 超过 3,000 个意向订单（2025-01）
          description: CES 拉斯维加斯首秀；Autocar 报道意向订单超过 3,000 个；首次获得重要国际需求曝光。
        - label: CAAC 生产许可证申请获受理（2025-05）
          description: CAAC 受理生产许可证申请；量产前置条件获得放行。型号合格证仍在推进。
        - label: 迪拜活动——600 台中东大单（2025-10）
          description: 首次海外载人公开飞行；AeroHT 更名为 Aridge；Ali & Sons、Almana、ALSAYER 签署 600 台车辆购买协议。公司称全球预订总量超过 7,000 个。
        - label: 低空经济政策背书（2026-01）
          description: 中国 2026 年政府工作报告将低空经济列为国家重点；AeroHT 被提及拥有 4,000+ 国内预订和 200+ 营地合作。
        - label: 截至 2026 年中：零交付（2026-06）
          description: Land Aircraft Carrier 尚未向任何客户交付量产车辆。型号合格证仍在推进。首批量产交付仍计划于 2026 年，但尚未确认。
    approximationNotes: 日期来自公开报道的里程碑、新闻报道和公司公告。订单数量为公司披露，未经独立审计。
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
  - id: FR001
    title: AeroHT 风险热力图——影响 vs. 发生可能性
    type: matrix
    layout: standard
    summary: 定性风险矩阵，按发生可能性（列）和业务影响严重度（行）绘制截至 2026 年 6 月 AeroHT 的主要风险领域。
    data:
      columns:
        - 低可能性
        - 低至中等可能性
        - 中等可能性
        - 确定 / 极高
      rows:
        - label: 轻微影响
          values:
            - ''
            - ''
            - AI 飞控网络安全漏洞
            - ''
        - label: 中等影响
          values:
            - IP / 专利交叉暴露于美国 eVTOL 诉讼
            - 消费者采用滞后（飞行员执照门槛）
            - 低空空域监管缺口拖慢规模化
            - ''
        - label: 高影响
          values:
            - 地缘政治 / IPO 市场阻断
            - 资本耗尽 / Series C 失败
            - TC 颁发前被 EHang 或 GAC 竞争性替代
            - ''
        - label: 关键影响
          values:
            - CEO / 创始人级别关键人物离职
            - 载人运营中电池或推进系统安全故障
            - 制造良率不达标（航空级标准）
            - CAAC TC/PC 延迟至 2027 年 Q4 之后
    approximationNotes: 所有位置均为基于截至 2026-06-19 公开证据的定性估算；未审阅 AeroHT 专有风险评估。相邻单元格不应被视为在绝对可能性或影响上严格等同。
