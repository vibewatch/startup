      - number: '1.4'
        title: 里程碑与运营进展
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT 的里程碑横跨 12 年以上研发和 7 代原型机，最终指向「陆地航母」。首架原型机载人飞行发生在 2018 年；后续迭代形成 X2，并在广州中央商务区完成首飞，2023 年 1
              月取得特许飞行许可。「陆地航母」概念在 XPENG 2023 年 10 月科技日正式亮相，并于 2024 年 9 月 3 日正式发布，定价确认不超过人民币 200 万元。广州黄埔区工厂于 2024 年 10 月
              27 日开工；这座 12 万平方米设施到 2026 年初进入试生产，初始产能为每年 5,000 台，设计上限为每年 10,000 台。监管方面，X3-F 的型号合格证申请于 2024 年 3 月 21 日获
              CAAC 受理，生产许可证申请于 2025 年 5 月 9 日获受理；两者仍在审查中。「陆地航母」于 2024 年 11 月在珠海航展完成首次公开载人飞行，并于 2025 年 CES 在 Las Vegas
              国际首秀。2025 年 10 月，公司在 UAE GCAA 特许飞行许可下于迪拜完成首次海外公开载人飞行，与中东伙伴签署 600 台采购协议，并宣布更名为 ARIDGE。至该活动时，全球预订单总量超过 7,000
              台。量产和客户交付目标为 2026 年，前提是最终 CAAC 认证落地。更广泛 eVTOL 行业的记录——包括 Lilium 2024 年 10 月申请破产——说明商业运营启动前仍有执行风险。
