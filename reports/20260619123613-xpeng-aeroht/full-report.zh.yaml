            body: >-
              中国个人 eVTOL 飞行员资质规则尚未发布，这意味着 2026 年接收「陆地航母」的 UHNW 买方，可能在 CAAC 发布针对性取证框架前无法独立飞行。这是预订单买方转化为活跃用户的近期最可操作约束，也给
              AeroHT 2026 年交付时间表带来不确定性。
