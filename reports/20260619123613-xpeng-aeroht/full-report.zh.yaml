    rows:
      - - CAAC 型号合格证——X3-F 飞行体
        - 中国
        - 进行中：申请于 2024 年 3 月 21 日获受理；特殊条件已发布征求意见；截至 2025 年 5 月处于符合性确认阶段
        - 确定——任何商业交付都必须取得
        - 关键
        - 持续与 CAAC 沟通；TC 和 PC 申请同步推进
        - EHang 在特殊条件后约 20 个月取得 TC；X3-F 载人设计没有直接先例，可能耗时更久
        - 确认 CAAC 特殊条件征求意见期结果；要求 AeroHT 提供符合性测试时间表和剩余未结事项
      - - CAAC 生产许可证——X3-F
        - 中国
        - 申请于 2025 年 5 月 9 日获受理；审查进行中；广州工厂处于试生产
        - 确定——商业规模生产必须取得
        - 关键
        - 工厂建设基本完成；QMS 文件编制中；试生产已启动
        - PC 不会早于 TC 发放；顺序认证会叠加延误风险
        - 要求提供当前 CAAC PC 审查阶段和预计发证窗口；确认工厂 QMS 审核状态
      - - CAAC 航空运营人合格证
        - 中国
        - 尚未申请；EHang AOC 在 TC/PC 后耗时超过 12 个月
        - 确定——商业载客运营必须取得
        - 高
        - 将在 TC/PC 发放后推进；EHang AOC 先例可提供流程参照；试点区域批准可能支持有限的 AOC 前试运行
        - TC/PC 发放后，商业时间线还要增加 ≥12 个月；AeroHT 商业运营最早也可能到 2028 年
        - 确认是否已就 AOC 路径与 CAAC 预沟通；判断广州试点区域项目是否提供任何 AOC 捷径
      - - 国际适航认可——FAA/EASA
        - 美国 / 欧盟
        - 尚未启动；Dubai 中东飞行在特别许可下进行
        - 中——仅在公司抢在 CAAC TC 前推进国际市场时适用
        - 高
        - ARIDGE 品牌面向全球市场定位；CAAC-FAA 关于 powered-lift 的双边互认尚未确认
        - FAA 四阶段 powered-lift 认证需要重新提交申请；目前没有可用的双边捷径
        - 确认 CAAC-FAA 航空当局围绕 powered-lift 类别的双边对话状态；跟踪 ICAO 协调进展
      - - eVTOL 行业 IP 诉讼暴露（Joby v Archer；Archer v Vertical）
        - 美国
        - 美国竞争对手之间诉讼进行中；截至 2026 年 6 月，未确认 AeroHT 专属诉讼
        - 低-中——若 AeroHT 推进美国合作或 FAA 认证，风险会出现
        - 中
        - AeroHT 技术开发以中国国内为主；Archer 关于中国关联零部件的反诉增加了中国玩家在美国市场的地缘政治敏感度
        - 行业 IP 诉讼氛围可能拖慢国际认证，并削弱全球投资者信心
        - 审查 AeroHT 专利组合与美国 eVTOL 专利持有者的交叉暴露；跟踪 Joby-Archer 案件结果
      - - 低空空域管理法规
        - 中国
        - 框架仍在制定；CAAC 面向城市载人 eVTOL 的最终运营规则尚未发布；广州和北京试点区域活跃
        - 确定
        - 高
        - Xpeng CEO（全国人大代表）积极推动政策提速；>57,000 家 LAE 企业形成游说规模
        - 初期运营可能仅限指定试点区域；城市空域开放时间线不确定
        - 跟踪 CAAC 低空管理规则进展；确认 AeroHT 参与广州和北京试点区域项目的状态
    notes: 严重性和可能性是定性评估，基于公开监管文件、EHang 先例类比和独立媒体报道。剩余暴露描述既有缓释措施之后仍保留的风险。状态截至 2026-06-19。未审阅专有 CAAC 档案数据。
