      - number: '3.2'
        title: 认证状态、产品形态与自主模型
        blocks:
          - type: paragraph
            body: >
              到 2026 年，认证姿态是 eVTOL 玩家之间最大的单一差异。EHang 领跑全球无人驾驶细分：EH216-S 持有 CAAC TC、PC 和 SAC——均为全球首张——EHang
              也在用航空运营人合格证运营载人商业服务。该机型形态（18 旋翼多旋翼、2 座、约 30km 航程、220kg 载荷）更适合固定路线旅游和短途城市接驳，而非灵活城际出行。Joby 的 5 名乘客 +
              飞行员倾转旋翼机型（200mph、100mi 航程、45 dBA 巡航噪声）处于 FAA Phase 4；SR3 里程碑确认测试数据符合 FAA 预期，首架符合构型的 TIA 飞机已经飞行。Archer 的
              Midnight（4+1 乘员、最高约 60mi 航程、倾转旋翼）于 2026 年 4 月完成 Phase 3，并同步推进 Phase 4 合规。Joby 和 Archer
              都需要持证飞行员；它们不是自主飞行。Wisk Gen 6 瞄准一条少见监管路径：在人工监督下完全自主运营，机上没有飞行员。这需要不同的认证流程（运营证书），并降低长期单位经济风险。BETA 的 ALIA
              eVTOL（认证目标 2028）和 ALIA CTOL（2027）采取分步路径：先从国防和医疗货运切入，因为这些场景不载客，监管审查较低。AutoFlight 正在为 Prosperity 推进 CAAC
              认证。Xpeng AeroHT 已向 CAAC 提交「陆地航母」生产许可证申请；CAAC 于 2025 年受理审查。「陆地航母」的飞行单元需要飞行员执照才能操作，相比 EHang
              完全无人驾驶模型，这是明显的消费采用门槛。其倾转旋翼形态（A868：高速长航程全倾转旋翼）瞄准比 EHang 多旋翼更长航程和更高速度，但受飞行汽车重量约束，航程和载荷低于 Joby / Archer。
