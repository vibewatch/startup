  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正论、反论与建议
        blocks:
          - type: paragraph
            body: >-
              Xpeng AeroHT 的叙事很有吸引力：按量产意图衡量，它是亚洲最大的飞行汽车公司；背靠上市母公司（NYSE: XPEV）；拥有全球首座量产飞行汽车工厂；意向订单超过 5,000 台；CAAC
              认证流程也已正式启动。多头逻辑建立在几个真实支点上：模块化飞行汽车品类的先发优势，中国低空经济政策环境支持且目标到 2026 年超过人民币 1 万亿元（$138B），以及由 EHang 先例锚定的 CAAC
              认证流程。但反论同样强：AeroHT 没有已确认的 2026 年估值标记，披露收入为零，认证时间线以年计，类似 eVTOL 公司已经经历严重倍数压缩甚至直接破产。2021 年超过 $1B
              的投前独角兽锚点已过去五年，而且早于所有商业化里程碑。按风险调整后，公开证据不足以支持买入判断；在 CAAC 型号认证、披露的 Series B 后估值或可信 IPO 条款书出现之前，TRACK 是更合适的立场。
