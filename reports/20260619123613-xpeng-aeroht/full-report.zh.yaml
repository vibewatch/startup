        - 美中贸易政策进展；AeroHT IPO 公告或撤回
        - 美国出口限制瞄准中国 eVTOL 技术，或管理层宣布撤回 AeroHT IPO
        - 评估替代流动性路径：HKEX、A 股上市、由中国国企或主权基金战略收购；重新评估估值基础
      - - 服役安全事故触发监管搁置
        - CAAC 适航指令、召回通知或 eVTOL 事故报告
