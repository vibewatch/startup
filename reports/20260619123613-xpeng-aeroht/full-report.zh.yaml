      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              约 USD 280,000 价格带的个人拥有 eVTOL
              市场属于高端耐用消费品，不是大众市场。最主要的直接买方和付款方是超高净值（UHNW）个人——通常为了个人休闲、观景探险旅行或身份资产而购买；在取得所需低空飞行员资质后，他们也会成为飞行员 /
              用户。该客群的采用路径有四道关：预订 / 预约、工厂交付（计划 2026 年）、飞行员培训与取证、首次运营飞行。Xpeng AeroHT 报告称，截至 2025 年已有超过 4,000 个预订单和 200
              多个营地合作伙伴，指向第二类机构买方：营地和度假村运营商。他们购买 LAC，用飞行体验作为面向客人的高端配套（B2B2C
              模式）。这些运营商用酒店和文旅收入预算支付设备及运营费用，并代表终端客人承担监管合规负担。第三条路径是景区观光飞行服务商，类似 EHang 早期 EH216-S 商业模式。把个人 eVTOL
              用于高管前往远程园区或度假地的企业买方，则是规模更小、仍处早期的细分。所有细分市场都面临同一约束：买方要么取得飞行员执照，要么在允许自主或远程监督飞行的区域运营——这个监管缺口仍在中国演进中的框架内解决。相比之下，空中出租车服务按短途城市线路单程估计
              200–300 元定价，瞄准大众通勤者；这些人明确不是 AeroHT 的买方。
