        - AeroHT 的机构背书不只依赖创始团队；Xpeng 的组织纵深提供接班缓冲；何小鹏的全国人大身份带来更持久的监管准入价值
        - 确认 AeroHT 是否拥有独立于 Xpeng EV 领导层的高管层架构；评估赵德力留任和股权激励结构
      - - 航空制造质量文化与体系
        - Xpeng AeroHT 必须从零搭出航空级质量管理；EV 制造标准是必要起点，但不足以满足 CAAC 生产许可证的适航合规
        - 中
        - 高
        - Xpeng EV 工厂质量基线提供起点；AeroHT 必须在现有实践上叠加航空专属体系（相当于 AS9100）
        - 确认 AeroHT 广州工厂是否在推进或已取得等同航空质量认证；要求第三方审计状态
    notes: 人员风险评估仅基于公开信息；AeroHT 未披露组织架构图或单个高管薪酬。可能性估计为定性判断，仅供参考。
