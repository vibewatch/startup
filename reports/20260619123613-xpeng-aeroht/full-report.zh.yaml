      - number: '5.2'
        title: 空中模块（X3-F）技术架构
        blocks:
          - type: paragraph
            body: >
              X3-F 空中模块是一款双座 eVTOL，采用碳纤维复合材料机身、全景环绕舷窗和四轮式支柱起落架。推进系统采用分布式电推进（DEP）：六个 VTOL
              螺旋桨负责垂直起降，两个涵道风扇负责前后向飞行，并由八台独立电机驱动。DEP
              架构靠冗余提供安全性：一个或多个螺旋桨或电机失效后，其余可工作的单元仍可让航空器安全着陆。控制界面是公司自研的六合一单操纵杆，把油门、俯仰、横滚、偏航、横向和垂直控制合到一根杆上，相比传统直升机控制降低飞行员学习门槛。航电套件支持自主降落、智能航线规划、一键起飞和降落，并始终保留人工接管。空中模块可自动折叠成紧凑矩形，放入
              GMS 后舱，并通过两套导轨部署；完整部署周期会自主展开起落架、机身中段撑杆和螺旋桨臂。电池包由 GMS 增程器充电，GMS 满电可支持五到六次完整飞行，并可在 18 分钟内快充（SOC 从 30% 到
              80%）。四个角部撑杆相对机身顶部呈 45 度布置；另外两个中段撑杆从机身两侧向前约 35 度折出，形成该车标志性的六边形推进器布局，并与尾部涵道推力组合。
