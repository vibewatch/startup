  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分群与买家画像
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT 为 Land Aircraft Carrier
              锁定三类主要买家：追求个人交通、希望把驾驶和短途飞行结合起来的高净值个人（HNW）；采购设备用于乘客体验服务和飞行员培训的飞行营运营商与旅游公司；以及用于应急服务、研究和潜在军事用途的机构或政府买家。海外市场，公司瞄准
              Gulf Cooperation Council 地区的国际经销商，并最终进入其他 eVTOL 监管框架正在成形的高 GDP 市场。联合创始人兼总设计师 Wang Tan 在 CES 2025
              上描述了双重爱好者原型：想带着自己的 eVTOL 出行的飞行员，以及希望多一个空中维度的越野爱好者。Land Aircraft Carrier
              的六轮全地形地面模块和全景双座空中模块，正是围绕这类买家画像设计。约人民币 200 万元（~$280,000 USD）的价格，把可触达买家池窄窄限制在富裕个人和资本实力较强的机构运营商。到 2026
              年中，公司尚未公开披露企业车队买家或政府采购合同；机构需求仍是愿景，而非已签约需求。
