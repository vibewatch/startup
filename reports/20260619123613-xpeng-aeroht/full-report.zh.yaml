  - id: FE001
    title: Land Aircraft Carrier——系统架构层
    type: stack
    layout: standard
    summary: |
      Land Aircraft Carrier 系统的五层架构栈，从地面物理基础设施和道路车辆，经集成和空中模块推进，再到自动化与连接服务。每层都标出关键技术组件及其架构角色。
