  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的 Xpeng AeroHT 七维评分；分数反映截至 2026-06-19 的证据质量和与阶段匹配的权重。
    data:
      items:
        - label: 市场机会
          score: 8
          note: 中国 LAE $70B+（2023 年）；eVTOL 细分市场到 2026 年目标 $1.3B（CCID）；全球顺风
        - label: 产品 / 技术验证
          score: 6
          note: 2024 年 11 月首次公开载人飞行；试制工厂已投产；模块化设计独特；认证尚未获批
        - label: 竞争护城河
          score: 5
          note: 模块化设计区别于 EHang；Xpeng 母公司协同；但 EHang 在认证和中国市场运营上领先
        - label: 单位经济
          score: 3
          note: 无收入；规模化后 $280K ASP 意味着 $2.8B/年总收入潜力，但未披露任何毛利率数据
        - label: 团队与执行
          score: 7
          note: 赵德力（创始人兼发明者）；Xpeng 母公司工程班底；CFO Du Chao 拥有 Deutsche Bank IPO 履历
        - label: 风险画像
          score: 3
          note: 关键风险：CAAC 认证风险；资本强度；行业破产先例；仅限中国运营；未披露优先权结构
        - label: 估值
          score: 3
          note: 2026 年私募估值未知；仅有 2021 年锚点；行业可比倍数下行；IPO 窗口不确定
        - label: 证据质量
          score: 4
          note: 无经审计财务数据；Bloomberg IPO 报道有付费墙；CAAC 里程碑公开但时间线不透明；订单簿质量未核验
    approximationNotes: 分数按 1–10 分（10 = 最佳）。分数反映作者基于截至 2026-06-19 公开可得证据作出的判断。证据质量分数因缺少财务披露和付费墙阻挡而被扣分。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV015
      - CV025
      - CV039
      - CV040
