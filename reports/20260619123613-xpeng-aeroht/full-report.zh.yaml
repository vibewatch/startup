  - id: FM001
    title: 中国低空经济市场结构——TAM / SAM / SOM 层级
    type: pyramid
    layout: standard
    summary: 三层金字塔从中国低空经济总量（TAM），延伸到 eVTOL 子行业（SAM），再到个人拥有型 eVTOL 细分市场（SOM），并给出约 2026 年收入锚点。
    data:
      items:
        - label: TAM——中国低空经济
          value: ~1.0–1.06T CNY by 2026
          note: CCID / 赛迪研究；包括无人机、服务、eVTOL
        - label: SAM——中国 eVTOL 子行业
          value: ~9.5B CNY by 2026
          note: CCID Consulting 2024 年预测；取决于 TC 时间线
        - label: SOM——个人拥有型 eVTOL（消费者 + 营地）
          value: ~2–5B CNY near-term (est.)
          note: AeroHT 10K 台产能 × RMB 2M，按初期交付比例估算；无独立来源
        - label: 数据点：2023 年 eVTOL 基线
          value: 980M CNY (2023 actual)
          note: CCID 实际值；主要为 EHang EH216-S 商业运营
    approximationNotes: SOM 是基于工厂产能 × 单价得出的编辑估算，并非独立分析师来源。所有数字均为名义人民币。
    claimRefs:
      - CM001
      - CM009
      - CM013
      - CM014
