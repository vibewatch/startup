chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与起源
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT 起源于 2013 年，是 XPENG 生态内偏技术研发的单元；2020 年正式注册为独立公司，由 XPENG Inc. 以及 XPENG 董事长兼 CEO
              何小鹏持有多数股权。公司总部位于中国广东省广州市黄埔区，使命表述为「让飞行更自由」，并把自己定位为亚洲最大的飞行汽车公司。旗舰产品是「陆地航母」（LAC），号称全球首款模块化飞行汽车，把一台六轮增程式地面车辆与可拆卸双座
              eVTOL（电动垂直起降）飞行器模块组合起来；飞行模块可收纳在车尾舱内，并完成充电和部署。地面车辆可凭 C1/C2 驾照在普通公共道路行驶，相比传统航空产品显著降低采用门槛。飞行模块代号
              X3-F，采用四旋翼设计，支持一键起降和自主导航；用户只需 5 分钟培训即可完成基础操作。2025 年 10 月，公司在迪拜完成首次国际公开载人飞行，同时推出全球品牌
              ARIDGE（源自「Air」和「Bridge」），意味着公司从早期研发开拓阶段转向规模化商业化和国际扩张。公司也在开发 A868，一款面向商务出行和城市空中交通服务的高速长航程全倾转旋翼飞行汽车。
