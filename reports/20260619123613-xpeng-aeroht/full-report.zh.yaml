  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与架构演进
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT（2025 年 10 月更名为 ARIDGE）的产品组合横跨三个清晰世代。X2 eVTOL 在 2021 年完成首飞，验证了公司的核心驾驶与控制能力，也为量产项目打下技术底座。第二代产品
              Land Aircraft Carrier（量产代号 X3-F 加 Ground Mother Ship）于 2023 年 10 月亮相，并在 2024 年 11
              月广州国际车展完成首次公开载人飞行。第三代、也是野心最大的 A868，是一款高速全倾转旋翼飞行汽车，采用混合电动动力系统，面向商务出行和城市空中交通市场，目标续航超过 500 km、最高时速超过 360
              km/h，并提供六座布局。自 2018 年以来，公司已迭代七代原型机，动力系统、复合材料、飞控、导航和空中智能均由内部研发覆盖。截至 2026 年 6 月，Land Aircraft Carrier 已收到约
              5,000 份预订单；到 2025 年 10 月，叠加中东订单后的全球预订单总量超过 7,000 台。消费端目标售价低于人民币 200 万元（约 280,000 美元）。可拆卸 eVTOL
              收纳在地面母舰内的模块化架构，是公司区别于所有纯 eVTOL 竞争对手的核心差异点；但这种架构也带来新的认证和适航挑战。
