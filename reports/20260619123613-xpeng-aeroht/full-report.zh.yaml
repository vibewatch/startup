        - CAAC 发布 X3-F 的 TC 发证公告
        - 到 2027 年 Q4 仍未发放 TC（距 2024 年 3 月 TC 申请受理已超过 42 个月）
        - 在收入延迟场景下重新评估资本跑道；评估 Series C 可行性；考虑部分退出或下调投资判断
