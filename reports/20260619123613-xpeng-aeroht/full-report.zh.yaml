        - 不可用——尚无交付后客户互动
        - 飞行营地参与者满意度调查未公开披露
        - 可显示体验模式能否在车辆交付前培养忠诚拥护者
    notes: 截至 2026-06-19，Land Aircraft Carrier 量产整机尚未交付，因此所有指标在结构上都不可用。最早也要等首批交付启动、客户开始运营车辆后，才能观察这些指标。本表明确记录该证据缺口。
