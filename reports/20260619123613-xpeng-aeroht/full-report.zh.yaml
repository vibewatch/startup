      - number: '8.5'
        title: 退出准备度、论点破裂触发器与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              现有投资者的退出准备度取决于三个闸门事件：CAAC 型号认证、披露带估值标记的 IPO 招股书，以及可验证的交付爬坡。截至 2026 年 6 月，三项条件均未满足。最可触达的退出路径是预期中的香港或美国
              IPO；如果认证按计划推进，窗口可能在 2027–2028 年。二级市场流动性有限；公司尚未公开上市，也没有公开识别出的二级基金买家。截至 2026 年 5 月，全球 eVTOL 行业诉讼风险——以 Joby
              vs. Archer vs. Vertical Aerospace 诉讼为代表——可能压低投资者对新进入者的兴趣。AeroHT
              的优先权结构和清算瀑布未披露，这给普通股股东在压力情景下制造结构性风险。关键论点破裂触发器包括 CAAC 拒绝、低于 2021 年 $1B 标记的下轮融资，或工厂到 2026
              年底仍无法实现有意义的生产量。Roland Berger 分析师 Yu Zhanfu 关于 eVTOL
              航空器在进入城市前，需要在低密度场景完成充分安全验证的观察，仍是相关商业约束。最终尽调优先事项包括更新后的股权结构和 Series B 后估值标记、经过认证的 CAAC 里程碑跟踪，以及独立订单簿质量验证。
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV038
              - CV039
              - CV043
