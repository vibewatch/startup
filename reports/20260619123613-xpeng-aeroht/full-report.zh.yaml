      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT 的创始团队把航空航天工程能力与 XPENG 体系内的消费科技经验结合起来。赵德力是 Xpeng AeroHT 创始人兼总裁，负责研发方向、产品发布以及 2024 年 9
              月「陆地航母」正式发布会等公开里程碑。母公司 XPENG Inc.（NYSE: XPEV，HKEX: 9868）董事长兼 CEO 何小鹏同时担任 Xpeng AeroHT
              董事长，并积极参与工厂里程碑和融资相关的公开沟通。王谭是联合创始人兼产品组合首席设计师，也曾在 Autocar 对「陆地航母」的报道等国际场合代表公司阐述设计理念。2025 年 6 月底 / 7 月，杜超出任
              Xpeng AeroHT 首任首席财务官，释放出 IPO 准备加速的信号。加入公司前，杜超在 Deutsche Bank 工作 10 年，主导过数十个海外 IPO
              融资和跨境并购项目。关键人风险不低：何小鹏同时掌舵上市母公司和子公司，战略决策集中；CFO 任命则是公司首次正式配置资本市场负责人。董事会构成和治理文件未公开；XPENG Inc.
              与何小鹏个人持股之间的确切股权比例也未披露。XPENG Inc. 若发生领导层变化，可能直接影响 Xpeng AeroHT 的战略优先级和共享研发资源获取。
