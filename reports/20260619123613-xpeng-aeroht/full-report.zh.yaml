      - number: '5.5'
        title: 制造准备度与产能爬坡
        blocks:
          - type: paragraph
            body: >
              Land Aircraft Carrier 位于广州黄埔区的制造基地占地 120,000 平方米，按航空级质量标准建设，同时引入汽车规模化生产效率。工厂设计年产能为 10,000 台，初期年产目标约 5,000
              台，之后再爬坡至满产。产线节拍目标是每 30 分钟下线一台完整车辆（GMS 加空中模块）。工厂于 2024 年 10 月动工，2026
              年开始试生产。该基地把航空生产线（机体、复合材料、航电装配）和汽车生产线（底盘、动力总成、车身）放在同一屋檐下，体现 Land Aircraft Carrier
              既是受监管航空产品、也是消费级道路车辆的混合属性。全栈内部研发能力覆盖动力系统开发、碳纤维复合材料制造、飞控系统设计、导航软件和空中智能算法，降低核心性能和安全系统对外部供应商的依赖。公司已签约 60
              多个起降点，分布在通用航空机场、景区、文旅地点和城市郊区，为客户飞行运营提供一个初生基础设施网络。交付计划于 2026 年启动，前提是取得标准适航证以及 CAAC 要求的任何运营批准。
