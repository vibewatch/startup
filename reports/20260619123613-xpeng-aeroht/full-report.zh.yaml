        - Xpeng EV 竞争恶化，限制母公司支持
      - - 正方：中国低空经济政策顺风，CAAC 认证路径存在
        - CAAC 受理 TC/PC 申请；政府目标是到 2026 年 LAE 市场超过 RMB 1T
        - 政策逆转、预算削减，或 CAAC 人手放缓
      - - 正方：EHang 先例确认中国 eVTOL 可以通过 CAAC 认证
        - EHang 2023 年 10 月获得 TC，2024 年 4 月获得 PC；EH216-S 航班已商业运营
        - EHang 机型差异过大（无人驾驶 vs. 有人驾驶），无法直接外推 AeroHT 时间线
      - - 反方：收入前，且没有披露 2026 年估值标记
        - Series B1 和 B2 新闻稿均未披露投后估值
        - 管理层披露投后条款清单，并带有可信机构估值标记
      - - 反方：CAAC 认证时间线未确认；X3-F 仍处早期合规阶段
        - TC 申请 2024 年 3 月受理；仅 EHang 特殊条件就花了 20 多个月
        - CAAC 公布特殊条件获批和 TC 目标日期
      - - 反方：eVTOL 板块倍数已坍塌；两家西方同行破产
        - Lilium 2024 年 10 月破产；Volocopter 2024 年 12 月破产；Beta 较 2025 年 11 月 IPO 下跌 50%；Archer 12 个月下跌 33%
