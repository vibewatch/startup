      layers:
        - label: 空中智能与连接
          detail: 智能路线规划、一键起降、自主着陆、OTA 更新、Xpeng AI 栈集成、UTM / 空域协调（状态未确认）
        - label: 空中模块飞行系统（X3-F）
          detail: 6 个 VTOL 螺旋桨 + 2 个涵道风扇；8 个独立电机；DEP 冗余；6 合 1 操纵杆；自主着陆；碳纤维复合机身；2 座全景座舱
        - label: 部署 / 集成轨道系统
          detail: 自动折叠部署轨道机构；单指令 45 秒部署序列；机臂和螺旋桨自动展开；反向收回循环；GMS 车顶与空中模块之间的机械接口
        - label: 地面母舰（GMS）动力总成
