          - type: callout
            title: AeroHT 的模块化概念瞄准未被充分服务的消费级利基
            body: >
              没有竞争对手在规模化层面服务陆空一体的消费级生活方式市场。Joby、Archer 和 BETA 瞄准企业或运营商买方；EHang 瞄准旅游运营商。AeroHT 的「陆地航母」已有 5,000
              个预订单，目标价格低于 $280K，占据一个类似高端超跑的独特利基；如果消费端飞行员执照要求能逐步放松，它面对的正面竞争可能少于纯空中出租车玩家。
