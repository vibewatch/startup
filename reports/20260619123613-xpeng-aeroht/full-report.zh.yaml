      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动来自中国政策超级周期。低空经济 2024 年首次写入《政府工作报告》，NDRC 于 2024
              年底设立专门的低空经济发展局，「十五五」规划（2026–2030）则把它列为国家战略性新兴产业。广东、浙江、福建、河南、江苏等多个省级政府已把低空经济目标纳入自身规划，深圳承诺到 2026 年建设超过 1,200
              个低空起降点。第二大驱动是 EV 供应链协同带来的技术降本：中国 EV 行业的高能量密度锂电池（CATL、Farasis Energy）、高可靠电机和电子控制系统可以直接迁移，大幅削减 eVTOL
              开发成本。AutoFlight 的初步估计显示，eVTOL 运营成本约为直升机同等成本的 15%——这是颠覆性的成本优势。国际上，FAA 于 2024 年 10 月发布最终规则，建立 powered-lift
              飞行员认证；White House 支持的 eIPP 计划于 2026 年初启动，以加快美国部署，印证全球两大航空市场的近期监管框架正在成熟。关键约束包括：（1）中国个人 eVTOL
              飞行员取证框架尚不完整，意味着买方必须等取证规则明确后才能独立飞行；（2）购置价格高，把直接买方池限制在 UHNW
              个人和资本实力较强的运营商；（3）基础设施仍在早期——深圳和苏州正在建设起降点，但全国网络仍稀薄；（4）城市环境中的公众接受度未经验证，噪音、安全和视觉侵扰担忧尚未在中国城市社区大规模研究；（5）Roland
              Berger 等分析师提示，eVTOL 在进入城市部署前，需要先在人口稀疏或景区充分验证，这意味着商业化会分阶段推进，而不是立刻大规模普及。
