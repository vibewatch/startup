  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与认证风险
        blocks:
          - type: paragraph
            body: >-
              监管风险是 Xpeng AeroHT 近期最主要的否决项。X3-F 飞行体模块在中国合法商业交付前，必须同时取得 CAAC 的型号合格证（TC）和生产许可证（PC）。TC 申请于 2024 年 3 月 21 日获
              CAAC 中南地区管理局受理；PC 申请于 2025 年 5 月获受理；CAAC 随后发布 X3-F
              专用条件草案，并邀请地区民航管理机构、制造商和研究机构公开评论。截至本次报告日期（2026-06-19），两项证书均未正式签发。最可用的类比是 EHang 的 EH216-S：该机型于 2023 年 10 月取得
              CAAC TC，距 CAAC 发布其专用条件约 20 个月。X3-F 是一种没有直接 CAAC 先例的新型模块化载人车辆：不同于 EH216-S（远程驾驶航空器），X3-F
              搭载机组，需要在飞行包线、失效模式和乘客安全方面提供更充分的合规证据。TC 和 PC 之外，商业载客运营还需要航空运营人合格证（AOC）；EHang 也是在 TC 后经历大量监管沟通才取得
              AOC，至少又给商业化时间表增加 12 个月。如果 AeroHT 的 2026 年批量交付目标哪怕推迟两个季度，收入确认延迟也会叠加成资本跑道风险。另一个维度是，FAA 于 2024 年 10 月发布美国运营最终
              powered-lift 规则，为 AeroHT 未来任何国际扩张建立了单独认证路径；这需要重新申请，而不是依赖 CAAC 双边认可。
