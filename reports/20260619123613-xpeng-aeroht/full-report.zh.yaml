            body: >-
              最接近的公开可比公司是 Joby Aviation、Archer Aviation 和 EHang。Joby（NYSE: JOBY）在 2026 年 6 月中旬股价约 $9.94，估算市值约
              $7B+；它是进展最快的西方同业，已完成首架 FAA 符合性航空器 TIA 飞行，并通过 eIPP 计划入选美国 12 个州。Archer（NYSE: ACHR）报告 2026 年一季度净亏损
              $217.7M、收入 $1.6M，持有 $1.78B 现金，较 12 个月高点下跌超过三分之一。EHang（Nasdaq: EH）是唯一获 CAAC 认证的同业，并已商业运营
              EH216-S；其市值反映的是另一类产品（远程驾驶、利润率更低）。这些可比公司暗示，后期同业的融资额倍数约为 1.5–2.5x；考虑 AeroHT 仍处于认证前阶段，阶段调整后区间约为 $1–1.6B。直接套用
              Joby 等价倍数会高估 AeroHT 的估值，因为 Joby 的 FAA 认证更靠前，并拥有正在启动的美国运营项目。两个警示性数据点锚定底部：Lilium（融资 $1B+，2024 年 10 月破产）和
              Volocopter（2024 年 12 月破产）说明，在这个资本密集行业，独角兽身份不能隔绝破产风险。
