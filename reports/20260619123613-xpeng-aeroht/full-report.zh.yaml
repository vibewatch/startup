      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT 已拼出全球飞行汽车领域规模最大的已披露融资池之一。XPENG Inc. 于 2020 年 7 月进行初始投资，为该子公司搭起公司骨架。2021 年 10 月，公司完成超过 $500M 的
              Series A 融资，投前估值超过 $1B，是当时亚洲载人低空飞行器领域单笔最大融资；投资方包括 IDG Capital、5Y Capital 和 XPENG 本身。2022 年 6 月，Rockets
              Capital 随后追加投资。近三年空窗后，Xpeng AeroHT 于 2024 年 8 月 5 日完成 $150M Series B1，由三家广州国资投资机构领投，并同步启动 Series B2
              融资。2025 年 7 月 15 日，公司确认完成 $100M Series B2，使 Series B 总额达到 $250M，累计披露融资超过 $750M（约 53.75
              亿元人民币）。最新资金将投向「陆地航母」的开发、量产和商业化。公司既未公开当前估值，也未披露 B2 后最新股权结构。Bloomberg 2025 年 5 月报道称，XPENG 正考虑推动 Xpeng AeroHT
              IPO，并已邀请数家银行参与，上市地点可能为香港或美国。杜超在 2025 年中出任 CFO，被广泛解读为资本市场事件的准备动作；但公司未确认时间表，并表示近期重点仍在研发和量产。
