      - number: '6.6'
        title: 图表
        blocks:
          - type: callout
            title: 零已交付车辆——所有客户证据都指向未来
            body: >
              截至 2026 年中，Xpeng AeroHT 尚未向任何客户交付一台 Land Aircraft Carrier。全部客户证据——7,000 多台全球预订单、600 台中东采购协议、200
              多个飞行营合作——都发生在交付前，具有前瞻性，且大多未经审计。没有已交付车辆，关键尽调变量（客户手中的产品可靠性、NPS、复购意向、流失）就无法评估。这是现阶段任何客户分析的核心限制。
