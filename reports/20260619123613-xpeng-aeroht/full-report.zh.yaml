            title: 政策超级周期（2024–2030）是最强结构性需求驱动
            body: >-
              从写入《政府工作报告》（2024），到 NDRC
              设立低空经济发展局（2024），再到「十五五」规划定性（2026），政策层层升级，形成持续多年的政策顺风。它让中国低空经济区别于此前投机性的航空热潮。投资者应跟踪广东省实施方案，这是 AeroHT
              本土市场最具商业相关性的近期信号。
