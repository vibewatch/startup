        - CAAC 2023 年 10 月发放 TC，2024 年 4 月发放 PC；EH216-S 已商业运营；持有航空运营人合格证
        - 直接的 CAAC 认证先例；同一监管机构；确立特殊条件至少 20 个月的下限
