  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价
        blocks:
          - type: paragraph
            body: >
              Xpeng AeroHT 的主要收入流是直接销售「陆地航母」模块化飞行汽车系统硬件。该产品由两部分组成：飞行模块（X3-F eVTOL 多旋翼机，代号 X3-F）和用于收纳、充电的地面母车。创始人兼总裁赵德力在
              2024 年 9 月确认，单价不超过人民币 200 万元（按当时汇率约 USD $280,000），使其成为全球同类车型中已公布价格最低的产品。公司于 2024 年 Q4 开始接受预订。截至 2025 年 10
              月，全球预订单超过 7,000 台，包括在迪拜展示活动上与 Ali & Sons（UAE）、Almana Group（Qatar）和 ALSAYER Group（Kuwait）签署的 600
              台中东确认采购协议。这笔 600 台区域订单被报道为飞行汽车领域最大批量海外采购。售后收入流——维护、飞行员培训和 software-as-a-service 飞行服务——已在公司 ARIDGE
              品牌营销中被提及，但没有任何公开文件量化。公司于 2025 年 10 月从 XPENG AEROHT 更名为 ARIDGE，以强调从研发走向商业规模。截至本报告日期，尚无商业交付确认。收入确认尚未开始。
