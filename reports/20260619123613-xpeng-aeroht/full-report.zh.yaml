      - number: '6.5'
        title: 留存、车队验证与集中度缺口
        blocks:
          - type: paragraph
            body: >
              Land Aircraft Carrier 尚未向任何客户交付，因此所有常规客户健康指标——净收入留存、毛收入留存、流失率、续约率和 cohort
              留存——都必然缺失。该产品没有独立第三方评价、客户效果案例或满意度调查。最接近的运营类比，是用于飞行营和航展演示的 X1、X2 eVTOL
              验证机，但它们早于当前商业产品，公司也未披露复购或租赁续约数据。集中度风险方面，声称的订单簿存在实质性地域和经销商集中：600 台中东批量交易约占其声称 7,000 台总量的
              8.5%，但集中在一次多方活动协议中，参与方的机构购买能力和融资承诺均未获独立验证。国内集中度难以评估，因为约 4,000
              多台国内意向订单是匿名且汇总披露。飞行营渠道在一定程度上缓解了纯高净值个人集中度，但每个飞行营本身都是单个 SME 运营商，形成的是数百个小批量交易对手，而不是企业车队买家。中国政府的政策支持——包括在 2025
              年政府工作报告中明确纳入低空经济，以及到 2026 年市场规模预计超过人民币 1
              万亿元——提供了有利需求背景，但宏观政策支持不能替代单个客户交付验证。广州工厂完成首批量产交付、客户开始运营车辆之前，所有前瞻性留存和扩张指标都仍属推测。
