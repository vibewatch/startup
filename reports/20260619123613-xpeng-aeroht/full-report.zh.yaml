            body: >-
              Xpeng AeroHT 于 2021 年 10 月完成 Series A，融资超过 $500M，投前估值超过 $1B，投资方包括 IDG Capital 和 5Y
              Capital。后续轮次均未披露投后估值标记：无论是 $150M Series B1（2024 年 8 月），还是 $100M Series B2（2025 年 7
              月），新闻稿都没有给出估值数字。累计披露融资超过 $900M。为准备潜在 IPO，AeroHT 于 2025 年 7 月下旬任命 Du Chao 为首任 CFO；他曾任 Deutsche Bank，拥有十年海外
              IPO 融资和跨境 M&A 经验。Bloomberg 于 2025 年 5 月报道称，Xpeng 正考虑让 AeroHT IPO，并已邀请数家银行，上市地点可能是香港或美国。截至 2026 年 6
              月，公司尚未提交正式招股书或交易所注册文件。缺少更新估值标记，再叠加收入前阶段和认证不确定性，使定价高度不确定。入场纪律要求等待披露估值，或按公开可比公司区间并施加实质性认证折扣。
