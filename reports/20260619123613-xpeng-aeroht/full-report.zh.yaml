      - number: '7.5'
        title: 治理、IPO 准备度与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              AeroHT 是 Xpeng Inc.（NYSE: XPEV；HKEX: 9868）的未上市子公司，母公司受美国和香港上市公司治理标准约束，但这些标准未必同等施加于运营子公司。Xpeng 的 2025
              年年报（20-F，向 SEC 提交）包含 AeroHT 相关风险披露，但仍受非合并子公司报告边界限制。AeroHT 曾公开讨论推进 IPO——Electrek 和 Cabin Crew Online
              报道称，公司计划在潜在上市前把自己确立为商业先行者，报道中的收入前估值约为 $1 billion。收入前 IPO
              将要求投资者根据认证里程碑而非盈利定价，因此对任何监管挫折更敏感。地缘政治风险是结构性的：AeroHT 技术涉及两用航空能力，制造在中国，母公司又在 NYSE
              上市——这一组合会在中美科技竞争环境中招致更高审查。Joby-Archer 诉讼中特别包括 Archer 的反诉，称 Joby
              隐瞒与中国的联系，并把中国飞机零部件归类为消费品；这说明与中国相关的航空技术在美国市场具备监管敏感性。AeroHT 面向全球运营更名为
              ARIDGE，显示其意识到跨境观感风险，但并不能解决非中国司法辖区的出口管制或国际监管批准风险。
