      - number: '7.4'
        title: 竞争挤压与 IP 风险
        blocks:
          - type: paragraph
            body: >-
              竞争风险正从多个方向同时加剧。EHang 已持有 EH216-S 的 CAAC TC、PC 和 AOC，并在 2026 年初开放广州、合肥观光服务商业售票，这给了它 AeroHT
              尚未追上的先发监管优势。EHang 也在全球扩张：墨西哥（2026 年 5 月）、泰国政府会议（2026 年 3 月）、Türk Telekom 合作（2026 年 3 月）以及阿联酋运营。在中国，GAC
              Group 于 2026 年 6 月推出 GOVY AirCab，预售价低于 168 万元，标志着中国整车厂直接进入飞行汽车类别。AutoFlight 于 2024 年 2 月完成全球首次公开 eVTOL
              跨海城际演示飞行，航线连接深圳与珠海，显示中国创业公司能力已相当成熟。国际上，Joby Aviation 推进至 FAA 第 4 阶段认证，Archer Aviation 于 2026 年 4 月完成 FAA 第
              3 阶段，成为首家达到该里程碑的 eVTOL 公司。eVTOL 行业正经历实质性 IP 诉讼：Joby 于 2025 年 11 月起诉 Archer 涉嫌商业间谍；Archer 反诉称 Joby
              隐瞒与中国的联系，并另行起诉 Vertical Aerospace 专利侵权。Beta CEO Clark 警告，这一诉讼潮可能拖慢认证时间表，并广泛伤害投资者信心。受认证延迟和诉讼新闻影响，2025–2026
              年 eVTOL 行业股票普遍下跌 10–58%。
