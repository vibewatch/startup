      - number: '6.2'
        title: 预订单管线与需求证据
        blocks:
          - type: paragraph
            body: >
              客户需求证据几乎完全由预订单和意向订单构成。2024 年 8 月，Xpeng AeroHT 宣布 $150M Series B1 时披露，已与近 60 个飞行营签约，这是最早的商业渠道接触。到 2024 年 11
              月 Land Aircraft Carrier 在广州车展完成首次公开载人飞行时，公司称订单约 2,000 台，对应人民币 200 万元价格。Autocar 报道称，2025 年 1 月 CES
              首秀前后，意向订单超过 3,000 台。国际需求的重要一步出现在 2025 年 10 月：Xpeng AeroHT（更名为 Aridge）在迪拜完成公开载人飞行，并与四个买方集团签署 600
              台采购协议，这是飞行汽车领域已报道的最大单笔海外批量采购。叠加国内预订单后，公司声称全球订单总量超过 7,000 台。到 2026 年中，中国政府来源媒体报道国内预订单超过 4,000 台，并有 200
              多个飞行营合作伙伴。关键解读限制在于，这些数字都没有经过独立审计；公开信息没有披露定金金额、合同违约条款或这些意向订单的融资条件，因此无法区分有约束力的承诺订单和可撤销的兴趣表达。
