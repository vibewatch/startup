    {
      "id": "regulatory-and-legal-risk",
      "title": "Regulatory, Legal, and AML/KYC Risk",
      "body": "TymeBank South Africa (operating as GoTyme Bank Limited since the rebrand) is supervised by the South African Reserve Bank's Prudential Authority for banking prudential standards, the Financial Sector Conduct Authority (FSCA) for market conduct under the Financial Sector Regulation Act (No. 9 of 2017), and the National Credit Regulator (NCR) for consumer lending under the National Credit Act. The April 2026 SARB registered-banks list names Cheslyn Jacobs as CEO of GoTyme Bank Limited, confirming ongoing licence validity. In the Philippines, the Bangko Sentral ng Pilipinas (BSP) issued a Certificate of Authority to GoTyme Bank Corporation on 29 July 2022, confirming compliance with the Bank Secrecy Act, Anti-Money Laundering Act, Customer Protection Act, and Data Protection Act, and verified a robust IT Risk Management Framework. South Africa exited the Financial Action Task Force grey list in October 2023 following improvements to its AML/CFT national framework, but the 2021 FATF Mutual Evaluation had assigned South Africa several Partially Compliant ratings — including on customer due diligence and new technologies — which illustrates the systemic risk environment in which TymeBank operates. The acute legal risk is the proposed Home Affairs fee increase from 15 cents to R10 per real-time identity-verification query under FICA. Tyme CEO Coen Jonker described the hike as a 'crippling blow to financial inclusion' and public reporting confirmed TymeBank was considering legal action. If the R10 rate is implemented without relief, TymeBank's KYC acquisition costs would escalate dramatically, disproportionately affecting its branchless, mass-market onboarding model relative to incumbents that rely more on batch overnight verification. The Competition Commission of South Africa and POPIA (Protection of Personal Information Act) obligations add further compliance layers, though no enforcement actions have been identified against TymeBank in public records.",
