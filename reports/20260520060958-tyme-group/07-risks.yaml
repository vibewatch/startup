    "number": 7,
    "title": "Risks",
    "summary": "Tyme Group's material risks cluster around a going-concern capital dependency that expires in October 2026, pending resolution through an NYSE IPO or further equity raise; a compound KYC-cost and legal dispute arising from South Africa's Home Affairs fee hike; credit impairment growth outpacing revenue; and concentration across a single cloud provider, two retail distribution ecosystems, and a 40%-anchor shareholder. GoTyme Philippines holds a valid BSP Certificate of Authority, South Africa exited the FATF grey list in October 2023, and capital adequacy ratios are well above minimums — but the going-concern note, an undisclosed core banking vendor, and limited public credit-quality metrics leave material uncertainty that investors should price before committing capital."
