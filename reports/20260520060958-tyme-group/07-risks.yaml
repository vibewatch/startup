    {
      "id": "governance-and-country-risk",
      "title": "Governance, Country, and Execution Risk",
      "body": "African Rainbow Capital retains approximately 40% of Tyme Group following the December 2024 Series D, making it the dominant shareholder by a substantial margin. While ARC's stake provides funding certainty and alignment with South African market development, it also creates governance concentration: ARC's own financial position affects its capacity and willingness to provide further capital support, and any ARC strategic reorientation could constrain Tyme's options. Nubank holds approximately 10%, providing strategic partnership and brand credibility, but also a second large shareholder with its own Brazil-centric strategic agenda. The full post-Series D cap table has never been published, making governance-rights assessment from public evidence alone impossible. Tyme Group Pte Ltd is incorporated in Singapore, with operating banks in South Africa and the Philippines, a tech entity in Vietnam, and a group CEO based in the Netherlands — a multi-jurisdictional holding structure that adds complexity to cross-entity capital flows, intercompany pricing, and regulatory-reporting obligations. In South Africa, structural economic headwinds include unemployment above 30%, fiscal pressure limiting government support for digital inclusion programmes, and residual electricity infrastructure constraints that intermittently affect kiosk and connectivity uptime. IMF and World Bank country assessments for South Africa highlight sovereign debt trajectory and fiscal consolidation risk as medium-term concerns. In the Philippines, GDP growth remains positive but BSP regulatory evolution — including potential increases in digital bank capital requirements — could require additional capital contributions from JV partners. The going-concern disclosure, combined with the multi-jurisdictional holding structure and limited public cap-table transparency, means that external investors have less line-of-sight than would typically be expected for a company at a $1.5 billion valuation preparing for a major exchange listing.",
