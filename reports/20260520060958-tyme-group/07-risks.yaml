  "callouts": [
    {
      "calloutType": "risk",
      "title": "Going-Concern Capital Window Closes October 2026",
      "body": "The FY2025 AFS going-concern disclosure is the single most material risk for external investors: Tyme Group has confirmed capital support for the SA bank only until 31 October 2026, contingent on completing a NYSE IPO, raising additional equity, or securing continued shareholder support. No public commitment from ARC or other shareholders beyond that date has been made. If the IPO is delayed or withdrawn, emergency bridge funding may be required at adverse terms.",
      "claimRefs": [
        "CR001",
        "CR005",
        "CR006"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Home Affairs Fee Hike is a Compound KYC and Legal Risk",
      "body": "The proposed South African Home Affairs fee increase from 15 cents to R10 per real-time identity-verification query compounds three distinct risk categories: it raises TymeBank's per-customer acquisition cost by an estimated R40+, threatens the FICA compliance model that underpins branchless onboarding, and has triggered a pending legal dispute with regulatory and reputational dimensions. Capitec's public support for the fee hike suggests this may also be a competitive risk vector.",
      "claimRefs": [
        "CR014",
        "CR015",
        "CR016",
        "CR031"
      ]
    }
  ],
