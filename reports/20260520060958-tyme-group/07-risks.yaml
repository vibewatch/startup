    {
      "id": "competitive-and-strategic-risk",
      "title": "Competitive and Strategic Risk",
      "body": "In South Africa, Capitec remains the dominant challenger-bank competitor and has actively positioned itself on the opposite side of the Home Affairs fee dispute, publicly supporting the DHA's planned fee hike. This signals that Capitec views the fee structure as a potential competitive tool against fintechs more reliant on real-time FICA verification. Capitec reported a 23% profit increase in FY2026, widening the unit-economics gap relative to TymeBank which is still reporting net losses. Discovery Bank's growth to one million clients demonstrates that the premium segment is already contested. TymeBank's target of reaching top-3 SA bank status by 2028 requires sustained deposit share gains from a current sub-2% market share, a multi-year journey with meaningful execution risk. In the Philippines, GoTyme faces GCash (Mynt) — which had IPO speculation as recently as 2026 — and Maya Bank, which reported PHP 1.7 billion in net income in 2025. Philippine digital bank deposits reached PHP 139 billion in 2025; GoTyme's PHP 40 billion share is meaningful but leaves significant ground to cover relative to the GCash ecosystem. GoTyme Philippines' Q1 2025 profitability milestone is encouraging, but competitive pressure from well-capitalised rivals means that maintaining customer acquisition momentum requires continued marketing and product investment. The strategic risk at group level is the NYSE IPO execution: a successful IPO at or above the $1.5 billion Series D valuation would validate the thesis, but an adverse market environment or missed financial milestones could force a below-Series-D offering or a delay that strains the October 2026 capital commitment window.",
