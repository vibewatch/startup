summary:
  headline: >-
    Tyme Group 是结构上可信的新兴市场 neobank，南非单体经济性已经得到验证，也拿到 Nubank
    战略背书；但集团合并审计财务缺失、菲律宾盈利未确认、股权结构只披露一部分，公开证据不足以支持高置信买入，应先观察并索取集团财务。
