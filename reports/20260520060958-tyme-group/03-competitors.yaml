      "id": "pricing-capability-and-distribution-comparison",
      "title": "Pricing, Capability, and Distribution Comparison",
      "body": "Tyme's offer is strongest where customers care most about low friction and assisted onboarding. In South Africa, public descriptions position TymeBank as a zero-monthly-fee or very low-fee option, while Discovery's Black account carries a R135 monthly fee and traditional banks often win when clients need lending breadth, trade finance, or relationship coverage. In the Philippines, pricing competition is even more explicit. Fintech News Philippines said GoTyme was using a 5% base deposit rate; FinMerkado's 2026 comparison said Maya led on net yield while GCash won on liquidity; and GuidePH's 2026 comparison found GCash strongest on street-level acceptance but Maya stronger on interest-rate features and app stability. The result is a market where users can easily split behaviors across multiple apps: GCash for payments, Maya for savings and credit, and GoTyme for retailer-linked everyday banking. That makes it harder for any one competitor, including Tyme, to claim a fully exclusive customer relationship.",
