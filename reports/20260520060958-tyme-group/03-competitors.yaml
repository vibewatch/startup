      "id": "competitor-profiles-and-market-positioning",
      "title": "Competitor Profiles and Market Positioning",
      "body": "Capitec is the hardest South African comparator because it pairs a simple value proposition with enormous scale: Reuters reported 25 million active clients in the August 2025 half and more than 26 million by the February 2026 year-end. Discovery is far smaller, but it has already crossed one million clients and over two million active accounts while layering banking into a broader insurance-and-rewards ecosystem. Tyme's public narrative still emphasizes no monthly fees, fast onboarding, and a retail-partner footprint of more than 1,000 kiosks and 15,000 retail points, which is differentiated but narrower in product breadth than the biggest incumbents. In the Philippines, GoTyme's phygital model has scaled quickly, reaching 2.3 million customers in 14 months with roughly 500 kiosks, but it faces much larger consumer platforms. GCash says 94 million Filipinos have used the app, while Maya reported 8.2 million bank customers, 2.1 million borrowers, and P50 billion in deposits by the second quarter of 2025. That means GoTyme is differentiated on acquisition design, not on raw scale.",
