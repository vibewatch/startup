    {
      "id": "switching-costs-multi-homing-and-moat-durability",
      "title": "Switching Costs, Multi-Homing, and Moat Durability",
      "body": "Tyme's moat is real, but narrow. Retail-partner onboarding, kiosk issuance, and shared technology across South Africa and the Philippines can lower acquisition and build costs versus country-specific challengers. Those strengths matter most for underbanked or skeptical users who value in-person trust cues. But the moat weakens as competition shifts from account opening into deposit primacy, rewards depth, and transaction-data underwriting. Discovery can raise switching costs through an integrated insurance and rewards stack; GCash can do so through merchant acceptance and super-app frequency; and Maya is explicitly building a stronger lending and savings loop off payment behavior. Public evidence also shows that both GCash and Maya are exploring IPO paths, which signals continued access to capital and escalating competitive intensity. The biggest unresolved issue is retention: public sources say little about payroll capture, churn, deposit stickiness, or how often Tyme displaces an incumbent as the true primary account.",
