  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "Tyme Group faces a two-front competitive battle. In South Africa, the hardest benchmark is Capitec: a mass-market bank with far greater scale, strong profitability, and a similar value-for-money narrative. Discovery and the traditional majors add trust, rewards, lending breadth, and branch or advisory depth. In the Philippines, GoTyme competes in a wallet-first ecosystem where GCash owns ubiquity, Maya is proving out an all-in-one digital-bank model with fast-growing credit and deposits, and universal banks still matter for trust and payroll relationships. Tyme's main edge is retailer-assisted onboarding and low-cost operating design, but public evidence suggests that payments and deposits are becoming commoditized faster than primary-account retention and credit underwriting."
  },
