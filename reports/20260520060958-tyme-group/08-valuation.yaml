    "number": 8,
    "title": "Valuation",
    "summary": "Tyme Group's December 2024 Series D established a $1.5 billion unicorn valuation backed by Nubank's $150 million strategic anchor. Public evidence — TymeBank regulatory filings, the official Series D press release, and third-party reporting — supports this as a legitimate primary-market price, not a distressed or speculative mark. The base case frames a staged NYSE IPO by 2028 at a 3–5× entry multiple uplift on the bull path, contingent on GoTyme Philippines achieving profitability and the group crossing 25 million customers. The bear case is a flat or down-round exit driven by multiple compression, slower Philippine growth, or regulatory cost shocks. The critical diligence gaps are the undisclosed post-Series D cap table, absence of group-level audited financials beyond TymeBank SA, and unconfirmed GoTyme Philippines cash-flow timeline. Given these gaps, a speculative buy with high risk rating is the most defensible initial stance, pending receipt of the group investor update and a confirmed path to Philippine break-even."
