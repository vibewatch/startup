      "id": "scenario-analysis",
      "title": "Scenario Analysis: Bull, Base, and Bear Cases",
      "body": "Three scenarios span the plausible investment outcomes for a Series D entry at $1.5 billion. In the bull case, Tyme executes its 2028 NYSE IPO on schedule, the group crosses 30 million customers, GoTyme Philippines achieves profitability in 2026 as targeted, and new markets (Vietnam, Indonesia) contribute incremental revenue. At this trajectory, a 5–8× revenue multiple on estimated group revenues of $600–700 million implies an IPO valuation of $3–5.6 billion, yielding a 2–4× return on the Series D price before dilution effects from potential additional funding rounds. The Nubank comparison is directionally supportive: Nubank grew from ~10 million customers at its $25 billion pre-IPO valuation to 110 million at a $60 billion market cap over four years.\n\nThe base case assumes moderate execution: GoTyme Philippines reaches break-even but profitability slips to 2027, new market entry is deferred to 2029, and the group reaches 22–25 million customers by 2028. An IPO at 4–6× revenue on $400–500 million group revenues implies a $1.6–3.0 billion valuation. At the low end of this range, Series D investors are at or near break-even before dilution. The 10% preferred-position pricing by Nubank, if representative of the cap table overall, implies that later equity layers may have limited preference overhang relative to enterprise value — but this cannot be confirmed from public evidence.\n\nThe bear case is driven by multiple compression and execution misses. If global fintech P/S multiples contract from the 2024 peak to 2× revenue by 2028, and group revenues reach only $300 million (growth disappointing due to Philippine regulatory friction or rising competition from GCash and Maya), the implied valuation of $600 million represents a 60 percent loss on the Series D price. The tail risk is a structured IPO deferral beyond 2030, which would extend the holding period and compress annualized returns further. Regulatory risk from Home Affairs identity-verification fee disputes in South Africa adds a further downside scenario that could raise customer acquisition costs by 20–30 percent and compress unit economics.",
