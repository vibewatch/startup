      "id": "valuation-anchors-and-series-d-context",
      "title": "Valuation Anchors and Series D Context",
      "body": "Tyme Group's most recent and authoritative valuation anchor is the December 2024 Series D, which set a post-money valuation of $1.5 billion after a $250 million capital raise. The official Tyme Group press release confirmed the round was led by Nubank with a $150 million investment representing approximately a 10 percent equity stake, implying that Nubank's entry priced the business at $1.5 billion on a post-money basis. TechCrunch independently reported the same terms and noted that total capital raised by Tyme had reached approximately $600 million since inception. The structure of the round adds confidence: a strategic investor of Nubank's calibre — itself a public company with a $60 billion market capitalization on NYSE — conducting independent diligence and pricing at $1.5 billion is a meaningful third-party anchor rather than a sponsor-only mark.\n\nBefore the Series D, earlier rounds establish a clear progression. A pre-Series C raise in May 2023 brought in $77.8 million from Norrsken22 and Blue Earth Capital, with the official Tyme release disclosing a revenue run-rate above $100 million annualized and 300,000 new customers per month. Series B in 2021 raised $180 million including investments from Tencent and CDC (now British International Investment). African Rainbow Capital retained approximately 40 percent ownership post-Series D, meaning a single South African anchor shareholder carries significant governance weight.\n\nThe valuation context has two important caveats. First, TymeBank's statutory filings (AFS 2025, Pillar III 2025) contain South Africa entity data but do not publish consolidated group economics, so the $1.5 billion mark cannot be independently validated against a group P&L. Second, BII's investment page listed the Tyme Bank investment as exited as of December 2025, which reduces the breadth of the development-finance-institution investor base. Despite these limitations, the Series D price is the most defensible public benchmark available for chapter 8 scenario construction.",
      "claimRefs": ["CV001", "CV002", "CV003", "CV004", "CV005", "CV006", "CV019", "CV030", "CV031"],
      "tableRefs": ["TV001"],
      "figureRefs": ["FV004"]
