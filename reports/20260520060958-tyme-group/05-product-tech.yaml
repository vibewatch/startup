      "id": "architecture-and-operating-model",
      "title": "Architecture and Operating Model",
      "body": "The clearest public architecture disclosure comes from TymeX and AWS-backed materials rather than from a deep technical white paper. Tyme says TymeX is the multi-country technology and product-development engine for the group and that it builds reusable proprietary assets that can be localized by country. The TymeX page goes further by explicitly naming the operating patterns: microservice architecture, containerised services, continuous code deployments, automated testing, asynchronous messaging, and fully cloud-hosted infrastructure. Third-party AWS-linked coverage adds more specificity, saying TymeBank migrated most of its infrastructure to AWS at launch and runs mission-critical services on Amazon ECS and Amazon EKS, while TymeX leadership describes the group as a serial bank builder that depends on cloud economics for speed and flexibility. What is technologically distinctive is not merely cloud usage, which is common, but the pairing of a reusable bank platform with physical distribution in retailer ecosystems. What remains undisclosed is the deepest part of the core stack: public sources still do not name the ledger/core-banking vendor layer or publish hard uptime targets for customer-facing services.",
