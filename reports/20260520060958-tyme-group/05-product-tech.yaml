      "id": "deployment-support-and-roadmap",
      "title": "Deployment, Support, and Roadmap Signals",
      "body": "Tyme's deployment posture is visible in the way products are rolled out and supported rather than in formal SLAs. The South African rebrand offers the best recent signal. Moneyweb reports that the new GoTyme app went live on 22 January 2026 under a phased migration plan, and the iOS listing confirms version 1.6.0 added Apple Pay while explicitly noting further phased rollout work for quality, reliability, and security. That supports the view that Tyme is actively modernizing the South African customer layer instead of simply repainting the brand. In the Philippines, the product surface is still broadening: GoTyme's product pages now include crypto, while the BNPL communication page confirms a separate notification stream for Buy Now, Pay Later applications. Tyme's newsroom also shows that public communications are milestone-driven rather than engineering-driven, which is useful for tracing launches but leaves limited public evidence on release cadence, incident history, or customer-level service performance. Support remains part of the deployment model itself, with phone-based human support in South Africa and hotline/chat support plus kiosks in the Philippines.",
