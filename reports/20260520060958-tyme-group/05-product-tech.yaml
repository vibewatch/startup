      "id": "trust-security-and-technology-risks",
      "title": "Trust, Security, Compliance, and Product Risk",
      "body": "Public trust controls are more visible than hard reliability metrics. In South Africa, GoTyme's security page lists biometrics, end-to-end encryption, multi-factor authentication, always-on fraud monitoring, card lock controls, and regular security audits, while the app-store listings emphasize secure onboarding, credential hygiene, and product updates tied to security and stability. In the Philippines, product pages emphasize BSP regulation, PDIC deposit insurance, and additional risk framing for crypto through VASP licensing, closed-loop fund protection, and explicit warnings that crypto is not a deposit product. The adverse side of the trust picture is structural rather than catastrophic. TechCentral's reporting on Home Affairs identity-verification fees shows that Tyme's assisted-onboarding model still depends on external KYC rails staying affordable. Public developer signal is also thin: the TymeBank GitHub organization has no public repositories, and public materials still do not name the core-banking vendor or publish uptime/SLA targets. As a result, the trust posture is adequate for a public diligence draft on controls and licences, but incomplete for deep technical underwriting without management-side disclosure.",
