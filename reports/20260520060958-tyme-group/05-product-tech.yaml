    {
      "id": "product-line-map-and-capability-maturity",
      "title": "Product-Line Map and Capability Maturity",
      "body": "The visible product line already spans more than a simple checking account in both markets. South Africa's consumer menu now includes current-account banking, GoalSave, fixed deposits, personal loans, cards, instant payments, and human support, while the business surface adds working-capital funding, entrepreneur community features, and iKhokha-linked payment acceptance. In the Philippines, the app covers everyday banking, Go Save, multi-currency time deposit, transfers, QRPh payments, Visa card payments, rewards, crypto, and a disclosed Buy Now, Pay Later communication flow. The maturity profile is uneven by design. Core account opening, cards, savings, and transfer features look mature because they are present across both countries and embedded into the onboarding experience. Newer or more localised modules such as crypto, BNPL, and the South African rebrand-era wallet upgrades are clearly earlier-stage and still dependent on local regulatory approvals, partner ecosystems, and phased feature rollouts. The module map therefore supports a view of Tyme as a reusable platform with country-specific wrappers and add-ons, not as a perfectly identical cross-border product.",
