  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Tyme 的公开材料描述的是一套围绕便利、辅助信任和低摩擦开户搭建的银行工作流，而不是以网点为中心的开户流程。在南非，GoTyme 主打免费日常银行、储蓄、卡和支持，客户可通过 app、kiosk
              和客户中心访问。独立报道解释了这在运营上为什么重要：kiosk 用户可以通过基于指纹的身份核验完成验证，当场获批、打印卡片，并在不去网点的情况下开始交易。在菲律宾，GoTyme
              的首页和关于页面描述了类似路径，只是围绕 Gokongwei 零售分销和 Go Rewards 做了本地化。客户可以从 app 或 kiosk 开始，几分钟内拿到 Visa 借记卡，然后立即进入储蓄、转账、QR
              支付和奖励兑换。因此，产品最好理解为一套高科技、高接触的工作流：在线下零售获客，在线上激活，再通过相邻储蓄和支付工具扩大钱包份额。
