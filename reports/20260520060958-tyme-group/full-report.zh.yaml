  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与市场触达
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 目前运营两个已上线银行业务：南非的 GoTyme Bank SA（原 TymeBank，2025–2026 年更名）和 GoTyme Bank Philippines；截至 2025
              年中，公司披露两地合计客户超过 1700 万。南非业务可拆成四个清晰客群：(1) 大众零售消费者，他们看重零月费、可通过 Pick n Pay、Boxer 和 TFG 自助机即时开户，以及 GoalSave
              高收益储蓄；(2) 社会补助领取者，他们使用 Grant Advance 提前、免手续费获得政府拨款；(3) SME 商户，通过 Retail Capital 获得营运资金；(4) 微型商户和 spaza
              店主，通过 TymePOS 收无现金支付。菲律宾的 GoTyme Bank 主客群是嵌在 Gokongwei 零售生态里的大众数字优先消费者——Robinsons 商场及合作零售商的购物者，受益于 Go
              Rewards 忠诚度整合和店内自助机即时开户。TymeBank（现 GoTyme SA）引用的 Kantar 2021 研究确认，客户入行主要因为无银行收费、App 易用、零售网点便利、包容性、Smart
              Shopper 积分，以及高于市场的储蓄利率。南非月收入 R25,000–R40,000 的消费者吸引力上升，说明客群正在从最初的低收入基本盘向上漂移。GoTyme SA 的 Flex for Business
              社群 app 也吸引了 50,000 多名南非创业者，成为核心银行业务之外的品牌延展和留存工具。
