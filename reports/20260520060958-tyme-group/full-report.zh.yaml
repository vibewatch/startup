  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入架构与变现模型
        blocks:
          - type: paragraph
            body: >-
              TymeBank
              的收入模型建立在两条主线之上：由存款融资资产负债表产生的净利息收入（NII），以及日常交易活动带来的净手续费和佣金收入。银行不收月度维护费，而是依靠存款利率（低成本活期账户、GoalSave，以及 11% pa
              定期存款）与 R2.25B 净贷款账簿贷款利率之间的息差，再叠加卡组织交换费、MoreTyme 先买后付（BNPL）发起费和商户服务带来的费用收入。截至 30 June 2025 的年度，NII 合计
              R1.24B（同比 +18%），总手续费收入 R1.55B（同比 +38%）；但 R662M 的手续费支出把净手续费收入压到 R886M。其他经营收益 R45M（外汇和杂项）补足收入顶线。Retail
              Capital 是 TymeBank 的 SME 贷款部门，已发放 R9.5B 商户现金预支，产生额外信用息差。GoTyme Philippines
              贡献集团客户增长，但其单独财务结果未在集团层面公开合并。免手续费获客策略压低了单客手续费收入，却推动存款沉淀，用低成本资金支持产生利息的资产账簿。
