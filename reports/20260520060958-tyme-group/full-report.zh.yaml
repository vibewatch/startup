      - number: '4.5'
        title: SME 贷款与 GoTyme Philippines 财务贡献
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的 SME 部门 Retail Capital（December 2022 收购）已向 50,000 多家南非企业发放 R9.5B 商户现金预支。GoTyme Business Advance
              向南非企业客户提供最高 R5M 的无抵押贷款。SME 贷款垂直是一个更高毛利的信贷品类，补充零售贷款账簿并加深商户关系。国际业务方面，GoTyme Philippines 增长迅速：该银行到 December
              2024 注册客户超过 5.1M，在 October 2022 上线后的前 18 个月签下 3.6M 客户。GoTyme PH 是与 JG Summit Holdings 和 Robinson's Retail
              的合资公司。它的财务结果不会并入 TymeBank SA 的 IFRS 报表；两家实体都汇总到 Tyme Group Pte Ltd（新加坡），而后者的集团层面损益表未公开披露。TechCrunch
              报道称，Series D 时合并集团在两大市场拥有超过 $400M 客户存款和 $600M SME 融资，与南非监管数据一致。GoTyme Philippines 尚未单独披露盈亏平衡情况，其在菲律宾
              的运营成本结构（快速增长带来更高 CAC）也未知。
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI034
