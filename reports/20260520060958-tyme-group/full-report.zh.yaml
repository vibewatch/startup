            body: >-
              Tyme 的公开领导层材料和银行披露显示，公司治理分层覆盖集团控股公司、南非银行、菲律宾银行，以及越南 产品与工程单元。Tyme 官网列明 Coenraad Jonker 为 Tyme
              执行董事长兼联合创始人，David Pfaff 为集团首席执行官 兼董事，Nate Clarke 为 GoTyme Philippines 总裁兼 CEO，Dieter Botha 为 TymeX
              CEO。南非法定文件进一步披露银行实体的领导层更替：Tyme Bank Limited 的 2024 年报记录 Coenraad Jonker 于 30 September 2024 辞任董事，Karl
              Westvig 自 1 October 2024 起获任；South African Reserve Bank 的 April 2026 注册银行名单则将 Cheslyn Jacobs 列为 GoTyme
              Bank Limited
              首席执行官。这一顺序很重要：创始团队上移到集团战略层，运营银行则围绕新的职业经理人梯队专业化。同一组证据也说明，可见度最高的治理披露仍集中在受监管银行层面，而非集团控股公司层面。公开材料能清楚识别创始人与高管，但没有公布完整的集团董事会、委员会图谱或
              Series D 后股权结构治理权利。
