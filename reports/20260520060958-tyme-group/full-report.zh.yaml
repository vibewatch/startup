  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与同业集合
        blocks:
          - type: paragraph
            body: >-
              Tyme 面对的不是一组整齐的同业。在南非，它三线作战：Capitec 是最接近的大众市场数字化基准，Discovery
              是面向更高收入人群、叠加奖励的数字挑战者，大型传统银行则仍主导资产负债表深度、网点、现金基础设施和 SME 融资。PwC 的 March 2026
              主要银行评述清楚表明，南非大型银行资本仍充足，并强力押注数字增长，即便挑战者银行已经开始重塑下一轮周期。在 菲律宾，相关替代方案远不止持牌数字银行。GCash 已经在全国规模上拥有日常支付普及度，Maya
              正把支付转化为高增长的存款与信贷引擎，而传统全能银行仍控制重要的工资、信任和多产品关系。实际含义是：Tyme 争夺的是主账户使用和交易频率，而不只是首次开户。
