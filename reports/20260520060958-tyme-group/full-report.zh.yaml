              million，African Rainbow Capital 仍持有约 40% 股权。配套的合作方来源进一步扩展了投资者名单：British International Investment、Blue
              Earth、Apis、Tencent、Gokongwei Group 和 Norrsken22 都出现在官方或股东沟通中。仍未披露的是 ARC 和 Nubank 数据点之外的 Series D
