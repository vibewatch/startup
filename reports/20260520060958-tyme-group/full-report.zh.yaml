      - number: '8.5'
        title: 投资建议、风险评级与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              综合市场证据、可比集合、情景分析和已识别缺口，结论是有条件建议。Tyme Group 对具备 5–7 年周期、能承受新兴市场执行风险的投资者而言，在 $1.5 billion
              估值上是一个结构上可信的投资。TymeBank SA 已证明盈利能力，Nubank 给出战略背书，2028 IPO
              路径也现实；三者结合，使其相对泛泛的新兴市场金融科技敞口更有差异化。不过，集团合并审计财务缺失、菲律宾盈利时间表未确认、股权结构表披露不完整，造成信息不对称，仅凭公开证据无法给出高置信度买入建议。


              推荐姿态是高风险评级下的投机性买入，前提是取得：(1) 覆盖 FY2025 和 H1-2026 集团层面的集团投资者更新或管理报表，(2) GoTyme Philippines 季度
              P&L，展示可信的盈亏平衡路径，(3) Series D 后完全稀释股权结构表及清算优先权细节，(4) 对 ARC 投票权和治理条款的尽调。


              会触发重新评估为中性或卖出的投资逻辑破裂信号包括：GoTyme Philippines 未能在 2027 年底前达到盈亏平衡（意味着结构性单位经济问题，而不只是时间问题），ARC 或 Nubank 以明显低于
              $1.5 billion 标记的价格出售老股，TymeBank SA 在南非客户数上失去前三位置给成熟挑战者，或 Tyme 在没有战略解释的情况下公开把 IPO 推迟到 2030 年之后。IFC
              的数字金融工作和更广泛的发展金融对该赛道的投资确认了宏观顺风，但不能消除公司特定执行风险。最终投资决定需要尚未公开的数据。
