      - number: '1.4'
        title: 里程碑、品牌更名与外部依赖
        blocks:
          - type: paragraph
            body: >-
              Tyme 的里程碑记录在私营金融科技公司中异常清晰。独立报道将业务追溯到 2012 年 Coenraad Jonker 和 Tjaart van der Walt 创建的移动货币和金融服务项目，随后是
              Commonwealth Bank of Australia 于 2015 年收购技术平台、2017 年完成南非银行牌照流程、African Rainbow Capital 于 2018 年收购
              TymeDigital，以及 TymeBank 在 February 2019 商业化上线。此后，运营模型由实体分销合作定义，尤其是 Pick n Pay、Boxer、TFG 以及更广泛的 Gokongwei
              生态，同时叠加 SME 贷款、先买后付和工资关联信贷等产品。下一个关键里程碑是品牌收敛：南非银行的现网已运行在 gotyme.co.za 上，TechCentral 报道管理层计划在 2026 年上半年完成
              GoTyme 更名。反向一面是，Tyme 仍暴露在会影响低收入客户开户经济性的政策决策之下。June 2025，Tyme 管理层称正考虑就 Home Affairs
              身份验证费用上调提案采取法律行动，理由是费用上调会推高获客成本并削弱金融普惠。这场争议具有战略重要性：Tyme 的无网点大众市场模式依赖低成本
              KYC、零售商辅助开户，以及让服务银行服务不足客户仍具经济性的监管环境。
