  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与 Series D 背景
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 最近且最权威的估值锚点，是 2024 年 12 月 Series D：融资 $250 million 后，投后估值定在 $1.5 billion。Tyme Group 官方新闻稿确认，本轮由
              Nubank 领投，投资 $150 million、取得约 10% 股权，意味着 Nubank 入股时按投后 $1.5 billion 给公司定价。TechCrunch 独立报道了相同条款，并指出 Tyme
              自成立以来累计融资约 $600 million。本轮结构提升了可信度：Nubank 这一等级的战略投资者本身是在 NYSE 上市、市值 $60 billion 的公众公司，它独立尽调后按 $1.5 billion
              定价，这比仅由赞助方打出的估值标记更有第三方锚定意义。


              Series D 之前，早期轮次形成了清晰递进。2023 年 5 月 pre-Series C 从 Norrsken22 和 Blue Earth Capital 融资 $77.8 million；Tyme
              官方披露收入运行率超过 $100 million 年化，每月新增客户 300,000。2021 年 Series B 融资 $180 million，投资方包括 Tencent 和 CDC（现 British
              International Investment）。Series D 后，African Rainbow Capital 仍保留约 40% 所有权，意味着单一南非锚定股东拥有显著治理权重。


              估值背景有两个重要限制。第一，TymeBank 法定文件（AFS 2025、Pillar III 2025）包含南非实体数据，但不发布集团合并经济数据，因此 $1.5 billion 估值无法用集团 P&L
              独立验证。第二，BII 投资页面显示 Tyme Bank 投资截至 2025 年 12 月已退出，这削弱了发展金融机构投资者基础的广度。尽管存在这些限制，Series D 价格仍是第 8
              章情景构建可用的最有防御力公开基准。
