      - number: '4.2'
        title: 财务表现与盈利路径
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的利润表三年来大幅改善。总收入从 FY2022 的 R570M 增至 FY2023 的 R1.41B、FY2024 的 R2.41B，以及 FY2025 的 R3.11B。与此同时，税前亏损从
              R951M（FY2023）收窄至 R330M（FY2024）和 R226M（FY2025），两年下降 76%。成本收入比从 FY2023 的 169% 改善至 FY2024 的 99% 和 FY2025 的
              83%，接近成熟南非银行水平。最大拖累是信用减值费用（贷款损失准备），随着贷款账簿快速扩张，FY2025 上升 51% 至 R534M。FY2025 一次性 R56M
              无形资产核销进一步影响底线，但不具经常性。TymeBank 于 January 2024 宣布在 December 2023 实现首个盈利自然月，成为首家达到月度盈亏平衡的 南非数字银行。不过，FY2024 和
              FY2025 的完整 IFRS 年报仍报告净亏损，反映出快速增长贷款账簿带来的高信用准备要求。趋势明确向好，银行审计师 PricewaterhouseCoopers
              未对账目本身出具保留意见，尽管持续经营披露仍然存在。
