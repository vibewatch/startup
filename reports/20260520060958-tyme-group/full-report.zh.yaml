        title: 单位经济代理指标与成本结构
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 不公开披露 TymeBank SA 或 GoTyme Philippines 的获客成本（CAC）、客户终身价值（LTV）、ARPU
              或净收入留存指标。可以从公开披露推导代理估计。按总注册客户计，年收入约为 R267/年（R3.11B / 11.6M 客户）；按活跃客户计，则为 R838/年（Pillar III 披露 3.7M
              活跃客户）。按总客户计，运营费用约 R155/年（R1.80B opex / 11.6M 客户），意味着信用减值前单客运营贡献为正。如果把 R534M 信用减值费用分摊到 3.7M 活跃客户，约等于
              R144/活跃客户，使全口径运营亏损约为 R59/活跃客户/年 —— 相比 FY2024 估计的 R94/活跃客户亏损已有显著改善。无月费意味着 TymeBank
              有意在获客阶段放弃手续费收入，依赖高毛利产品（定期存款、MoreTyme BNPL、商户现金预支）的交叉销售，随时间改善单位经济。Solidarity research 证实，TymeBank
              交易成本比南非大型银行低 30-50%，支撑价值主张，但压缩每笔交易手续费收入。与 Sanlam Personal Loans 成立合资，围绕 SPL 的 R6B
              账簿发起和管理无抵押贷款，是迈向更高毛利信贷收入的一步。
