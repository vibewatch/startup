      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场驱动因素真实且可衡量。BCG 认为非洲是全球增长最快的金融科技地区，收入到 2030 年可能扩大 13x 至约 $65 billion，并指出超过一半的 非洲金融科技公司经营支付和贷款业务 —— 这正是对
              Tyme 最重要的品类。在菲律宾，监管方已经推动数字零售支付超过路线图目标，为数字银行获客创造了有利的基础设施底座。但结构性摩擦仍然很大。在 南非，GSMA
              指出设备可负担性、电力成本、基础设施犯罪、监管不确定性和数字技能缺口，都是数字采用深化的实际障碍。BIS 和 SARB 也指出，南非仍高度依赖现金；PayShap
              等新支付轨道虽有前景，但尚不能在大众市场规模上完全替代现金。放到更广义的非洲，BCG 认为薄信用文件
              SME、薄弱征信机构、高资本成本和数据碎片化仍限制基于风险定价的贷款深度。在菲律宾，家庭层面的正规账户接入改善，但个人账户拥有率下降，说明账户接入本身不保证深度产品使用。对 Tyme
              的可投资结论是：数字账户和支付增长具备结构性强度，但盈利性市场获取仍要逐国解决信任、KYC、数据和信贷深度瓶颈。
