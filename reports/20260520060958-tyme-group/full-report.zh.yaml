    notes: 关键人物数据来自公司公开页面、SARB 注册银行名单和新闻来源；缺口反映私营公司披露限制。
  - id: TR005
    title: 缓释监控与终止条件
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 持续经营 / 资本
        - 2026 年 10 月前的集团资本公告
        - 截至 2026 年 Q3 未启动 NYSE IPO 路演，也无股权融资承诺
        - 退出持仓；按困境信号处理
      - - 信贷质量
        - 年度减值损失和不良率（NPL）
        - 减值损失 > R800M/年，或 NPL > 贷款账簿 20%
        - 下调至回避；召开信贷风险复盘
      - - 监管 — SARB
        - SARB 审慎监管局执法通知
        - SARB 对 GoTyme Bank Limited 采取任何正式执法
        - 立即标记风险；召开合规复盘
      - - KYC 成本冲击（Home Affairs）
        - 最终法院裁决或收费生效日
        - R10/次查询费落地且无法律救济
        - 重置 CAC 模型；重新评估单位经济性
      - - 竞争 — 南非存款
        - TymeBank 月度存款市场份额数据（来自 SARB 统计）
        - 到 2027 年 12 月，南非存款份额低于 1.5%
        - 重估竞争护城河假设
      - - AWS 集中度
        - 公开报告的 TymeBank / GoTyme 服务中断
        - 中断 > 6 小时并影响客户交易
        - 上调技术风险；要求披露灾备架构
      - - IPO 执行风险
        - NYSE IPO 定价相对 Series D 轮价格
        - IPO 定价低于 $1.5B 估值，或推迟至 2028 年之后
        - 投资者信心负面信号；重估退出时间表
    notes: 终止条件是指示性投资决策触发因素，不是银行运营阈值。阈值只代表方向；需按投资者持有期和风险容忍度校准。
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 支撑证据
      - 置信度
    rows:
      - - 建议
        - 投机性买入，前提是完成集团财务尽调
        - Series D 轮 $1.5B 锚定估值、Nubank 背书、南非盈利能力已验证
        - 中
      - - 风险评级
        - 高 — 执行、监管、倍数压缩和信息缺口风险
        - 缺集团 P&L，菲律宾盈利未确认，股权结构表未披露
        - 高
      - - 估值立场
        - Series D 轮价格可辩护，但取决于乐观情景能否跑通
        - Nubank 入股 10% 说明市场验证；PwC 和 BCG 确认赛道吸引力
        - 中
      - - 回报目标（乐观）
        - 2028 年 NYSE IPO 隐含市值 $3–5.6B，对应 2–4× 回报
        - Nubank 轨迹可比、30M+ 客户情景、5–8× 收入倍数
        - 低-中
    notes: 该建议取决于能否取得集团投资者更新、GoTyme Philippines 盈利确认，以及 Series D 轮后股权结构表。没有这些材料，IC 不应承诺投资。
    claimRefs:
      - CV001
      - CV007
      - CV043
      - CV044
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点类型
      - 论点
      - 关键证据
      - 什么会改变该判断
    rows:
      - - 投资逻辑
        - 可复制的银行搭建模型已在南非规模化验证
        - TymeBank 自 2023 年 12 月起盈利；FY2025 收入 R3.11B；9.6M 客户
        - 南非文件显示单客收入下降，或成本收入比大幅上升
      - - 投资逻辑
        - 与 Nubank 的战略合作压缩菲律宾规模化学习曲线
        - Nubank 以 $1.5B 估值投资 $150M；可借鉴 110M+ 客户增长路径
        - Nubank 退出投入，或自身市场地位显著恶化
      - - 投资逻辑
        - 新兴市场 TAM 大、渗透率低，监管有顺风
        - GSMA 2024：1.75B 注册账户；增长集中在 SA 和 SEA
        - BSP/SARB 施加限制性资本或牌照要求，压低 TAM
      - - 反向逻辑
        - 没有集团合并审计财报；菲律宾盈利未确认
        - 公开文件缺集团 P&L；GoTyme 目标 2026 年达到盈亏平衡
        - 收到经审计集团账目，并确认盈利轨迹
      - - 反向逻辑
        - 倍数压缩风险：2022-23 年金融科技 P/S 倍数收缩 50-70%
        - Revolut $75B 估值反映私募市场偏热；历史上有倍数压缩先例
        - IPO 申报时，上市金融科技可比公司估值上修
      - - 反向逻辑
        - ARC 40% 持股集中带来治理和退出依赖
        - TechCrunch 确认 Series D 轮后 ARC 仍持有约 40%；治理细节未披露
        - ARC 发布治理权利摘要，或正式披露股东协议
    notes: 投资逻辑和反向逻辑权重并不相同。反向逻辑中的材料缺口是近期 IC 准备度的主要担忧。
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 退出时估值 / 逻辑
      - 概率信号
      - 主要风险
    rows:
      - - 乐观（25% 概率）
        - 2028 年 NYSE IPO；30M+ 客户；GoTyme PH 2026 年盈利；越南 / 印尼开始贡献；集团收入 $600-700M； 5-8× 收入倍数
        - IPO 时市值 $3.0–5.6B；摊薄前，相对 $1.5B 入场估值回报 2–4×
        - Nubank 轨迹可比；南非盈利已验证；战略支持已确认
        - 菲律宾利润率不达预期；宏观汇率逆风；IPO 窗口关闭
      - - 基准（50% 概率）
        - 2028-2029 年 IPO；22-25M 客户；GoTyme PH 2027 年盈亏平衡；无新市场；收入 $400-500M；4-6× 倍数
        - $1.6–3.0B；相对入场估值 1–2×；4-5 年年化 IRR 8–15%
        - 管理层 IPO 指引；南非 / 菲律宾增长的合理外推
        - 倍数压缩；菲律宾盈利推迟；新增监管成本
      - - 悲观（25% 概率）
        - IPO 推迟到 2030 年之后；GoTyme PH 到 2027 年仍未盈亏平衡；收入 $200-300M；2-3× 倍数
        - $400M–$900M；相对入场估值 0.3–0.6×；Series D 轮投资者本金受损
        - 倍数压缩先例（2022-23 年）；菲律宾监管摩擦；信息缺口
        - 结构性输给 GCash/Maya；南非监管冲击；需要降价轮融资
    notes: 概率信号是基于新兴市场金融科技可比结果的定性方向估计，不是模型分布。实际概率需要专有财务模型。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 阶段 / 类型
      - 估值 / 市值
      - 关键指标
      - 与 Tyme 的相关性
      - 局限
    rows:
      - - Nu Holdings (Nubank)
        - 上市（NYSE:NU）；成熟数字银行
        - 市值约 $59.75B（2026 年 5 月）；TTM P/E 约 19×
        - 110M 客户；2023 年收入 $8B+；2026 年提交 20-F
        - Series D 轮领投方；新兴市场运营路径直接可比
        - 规模成熟；拉美市场；货币和监管画像与南非 / 菲律宾差异很大
      - - Revolut
        - 私营；后期；泛欧洲 / 全球
        - $75B（2025 年 11 月私募轮）
        - 全球 40M+ 客户；金融科技产品套件广
        - 高端估值基准；显示私募市场对数字银行仍有需求
        - 欧洲监管结构；竞争环境差异很大；仅为 IPO 前参考
      - - Moniepoint
        - 私营；Series C 轮；非洲金融科技
        - 约 $1B（2024 年 10 月 Series C 轮）
        - 以企业支付为主；聚焦尼日利亚
        - 相邻阶段的非洲金融科技直接同业；验证新兴市场独角兽需求
        - 偏支付，而非存款驱动；尼日利亚市场不同于南非；公开财务有限
      - - Maya Bank (Philippines)
        - 私营；数字银行
        - 未公开披露；菲律宾实体已盈利
        - 2025 年净利润 PHP1.7B；PLDT Group 子公司
        - 菲律宾市场直接可比；证明菲律宾数字银行经济模型可跑通
        - PLDT 集团支持；所有权结构不同；单体可比性有限
      - - GoTyme Philippines 同业池（BSP 持牌）
        - 私营；菲律宾数字银行队列
        - BSP：2025 年菲律宾数字银行存款 PHP139B
        - 多家持牌数字银行；BSP 监管
        - 说明 GoTyme 所在市场在增长，但竞争也强
        - 队列汇总数据，非单家公司；GoTyme 份额未公开披露
      - - TymeBank SA 隐含入场估值（Series D 轮）
        - 私营；IPO 前；南非持牌数字银行
        - $1.5B 集团投后估值（2024 年 12 月）
        - 2024 年 6 月约 9.6M 客户；仅 TymeBank；到 2025 年 6 月集团客户基数 17M+
        - 所有情景的自我参照锚点
        - 集团估值包含 GoTyme PH 和 TymeX；单看南非银行会更低
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable set covers the four most relevant public and private digital banking peers identified from SEC
        filings, Wikipedia sources, Yahoo Finance data, Nubank investor materials, GSMA industry report, and Philippine
        BSP deposit statistics as of May 2026. Excludes unlisted SA peers such as Discovery Bank and Bank Zero due to
        limited public comparability data.
    notes: 没有一家上市公司能精确匹配 Tyme 的双地域、新兴市场、零售亭模式。所有可比公司都需要按市场、规模和产品差异做重大调整。
