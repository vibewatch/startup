      - number: '5.5'
        title: 信任、安全、合规与产品风险
        blocks:
          - type: paragraph
            body: >-
              公开可见的信任控制多于硬可靠性指标。在南非，GoTyme 安全页面列出生物识别、端到端加密、多因素认证、全天候欺诈监控、卡锁定控制和定期安全审计；app-store
              列表则强调安全开户、凭证卫生，以及与安全性和稳定性相关的产品更新。在菲律宾，产品页面强调 BSP 监管、PDIC 存款保险，并通过 VASP 牌照、闭环资金保护和明确警示“crypto 不是存款产品”，为
              crypto 提供额外风险框架。信任图景的反向一面不是灾难性问题，而是结构性问题。TechCentral 关于 Home Affairs 身份验证费用的报道显示，Tyme 的辅助开户模型仍依赖外部 KYC
              轨道保持可负担。公开开发者信号也很薄：TymeBank GitHub 组织没有公开仓库，公开材料仍未披露核心银行供应商，也未公布 uptime/SLA
              目标。因此，基于控制和牌照撰写公开尽调草稿时，信任姿态足够；但若要做深度技术承保，仍缺少管理层披露。
