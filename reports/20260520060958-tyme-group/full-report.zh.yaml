            body: >-
              GoTyme SA 每月约 150,000 名新增客户高度依赖 Pick n Pay、Boxer 和 TFG 门店的自助机网络。GoTyme PH 的线上线下融合增长同样嵌在 Gokongwei
              集团零售中。两个业务都缺少大规模纯数字获客的已验证记录，因此伙伴集中就是主要客户增长风险。
