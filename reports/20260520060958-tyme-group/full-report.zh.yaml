      - number: '6.6'
        title: 图表
        blocks:
          - type: callout
            title: 32% 激活率需要解释
            body: >-
              TymeBank/GoTyme SA 的 2025 年 6 月 Pillar III 文件披露注册客户 1160 万，但活跃客户只有 370 万，意味着 68% 注册账户处于不活跃或休眠状态。这个缺口很大：它影响
              ARPU 计算、CAC 回本周期和已披露客户基础质量。管理层尚未公开解释「活跃」定义，也没有给出不活跃池的分客群拆分。
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
          - type: callout
            title: GoTyme PH 成为菲律宾第 1 大 Visa 借记卡发行方
            body: >-
              GoTyme Bank Philippines 被认定为菲律宾按活跃使用量计第 1 大 Visa 借记卡发行方——Visa 官方 2026 年 2 月新闻稿已确认——且拥有超过 800 万 Visa 借记卡用户和
              P43 billion 存款。这是一个经第三方验证的强采用质量与深留存信号，在这一指标上超过菲律宾所有传统银行。
