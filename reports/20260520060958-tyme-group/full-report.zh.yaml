      - number: '2.2'
        title: 国家维度的市场测算框架
        blocks:
          - type: paragraph
            body: >-
              南非和菲律宾需要不同的测算逻辑。在南非，大盘并不是一个“只看未开户人群”的故事：World Bank 证据显示，85% 的成年人已经拥有账户；GSMA 报告的移动互联网使用量相当于成年人口的
              74%。剩余可变现缺口的关键是深度，而不是首次接入 —— 低费率日常银行、数字辅助开户、现金替代，以及面向高度非正规小企业基础的 SME 信贷。同一份 GSMA 报告称，86% 的 MSME 为非正规企业，79%
              的非正规 MSME 从未借款，说明贷款、商户获取和存款主账户地位比单纯计算账户数更重要。菲律宾则更明显仍处在普惠建设阶段：BSP 的 2025 CFIS 显示，只有 50% 成年人拥有正规账户，但 85%
              的家庭至少有一个账户，62% 的家庭已经通过电子设备完成金融交易，智能手机拥有率为 86%，互联网使用率为 89%。与此同时，BSP 的 2024 状态报告显示，数字零售支付占交易量的 57.4%、占交易金额的
              59.0%，说明支付轨道成熟速度快于完整主银行账户拥有率。对 Tyme 而言，这意味着南非的 SAM 来自一个大体已开户人口内部的服务不足经济性，而菲律宾则从更低的账户持有基础出发，同时提供普惠扩张和产品深化。
