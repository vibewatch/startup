        - 日常支付、转账、储蓄和嵌入式金融
        - 普及度和商户受理覆盖
        - 不是纯银行主导模式，因此部分银行产品比较只能间接对照
      - - Maya
        - 菲律宾数字银行 + 支付平台
        - 截至 Q2 2025，8.2M 银行客户、2.1M 借款人、P50B 存款
        - 数字优先消费者和小微企业
        - 支付、存款和信贷一体化，并有较强的替代数据授信能力
        - 高强度促销和奖励竞争会挤压单位经济
