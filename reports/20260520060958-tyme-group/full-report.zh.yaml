  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 信贷、资本与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的 FY2025 Annual Financial Statements 由 PricewaterhouseCoopers 审计，其中持续经营披露写明，Tyme Group 只确认向
              GoTyme Bank Limited 提供资本支持至 2026 年 10 月 31 日；此后是否存在重大不确定性，取决于计划中的 NYSE
              IPO、追加融资或股东继续支持。这是本报告最重要的近期风险。单看资本充足率很稳——CET1 为 21.29%，几乎是 SARB 约 11% 最低要求的两倍——但 CET1
              指标只覆盖南非运营实体，不代表集团合并流动性。2024 年 12 月 Series D 由 Nubank 领投 $150 million，拉长了现金跑道，但 TymeBank 资产负债表上累计亏损已达 R7.72
              billion，反映自 2015 年以来的累计投入。信贷端，FY2025 减值费用增长 51% 至 R534 million，驱动因素是贷款账簿快速扩张，而非账龄质量恶化；但公开披露缺少 NPL
              比率、账龄曲线或拨备覆盖率指标，仅凭公开资料无法独立承销信贷风险。Retail Capital 每年向 SME 客户提供 R9.5 billion 商户现金垫款，又增加了表外信贷集中度。按活跃客户计算，年减值约
              R144，相比同业有利，但随着 Tyme 放贷速度快于账簿成熟速度，单客减值正在上升。金融风险的关键破局信号，是集团管理层能否在 2026 年 10 月前锁定 IPO
              或股权承诺；若失败，公司可能需要以不利条款筹措紧急过桥资金。
