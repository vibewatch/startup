          to: gotyme-sa
          label: SME 信贷产品
        - from: nubank
          to: tyme-group
          label: 战略合作伙伴
    claimRefs:
      - CR021
      - CR024
      - CR025
      - CR037
      - CR043
  - id: FV001
    title: 建议逻辑
    type: flow
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV043
      - CV044
      - CV045
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: 17M+ 客户；南非盈利；GoTyme PH 增长中
        - id: financing
          label: 融资锚点
          detail: Nubank 领投 $1.5B Series D，一级市场价格有支撑
        - id: comps
          label: 可比公司组
          detail: Nubank $60B；Moniepoint $1B；Revolut $75B — 新兴市场金融科技溢价有依据
        - id: risks
          label: 关键风险
          detail: 无集团 P&L；菲律宾盈利未确认；股权结构表不透明
        - id: gaps
          label: 信息缺口
          detail: 缺少集团财务、股权结构表、ARC 治理、BII 退出条款
        - id: recommendation
          label: 投资建议
          detail: 投机性买入，高风险评级，取决于 5 个尽调事项
      edges:
        - from: scale
          to: recommendation
        - from: financing
          to: recommendation
        - from: comps
          to: recommendation
        - from: risks
          to: recommendation
        - from: gaps
          to: recommendation
    approximationNotes: 流程图代表形成建议的逻辑输入，不是量化模型。每个节点都是本章完整小节或表格的摘要。
  - id: FV002
    title: 估值敏感性
    type: bar
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV017
      - CV021
    data:
      items:
        - label: 悲观（2× 收入，$250M 收入）
          value: 500
          unit: USD million
          tone: negative
          detail: $250M 集团收入按 2× 收入估值 = $500M 隐含估值
        - label: 基准低位（4× 收入，$400M 收入）
          value: 1600
          unit: USD million
          tone: neutral
          detail: $400M 按 4× 收入估值 = $1.6B；接近 Series D 入场价
        - label: 基准中位（5× 收入，$450M 收入）
          value: 2250
          unit: USD million
          tone: neutral
          detail: $450M 按 5× 收入估值 = $2.25B；较入场价小幅上行
        - label: 乐观（6× 收入，$600M 收入）
          value: 3600
          unit: USD million
          tone: positive
          detail: $600M 按 6× 收入估值 = $3.6B；较 $1.5B 入场价 2.4×
        - label: 乐观高位（8× 收入，$700M 收入）
          value: 5600
          unit: USD million
          tone: positive
          detail: $700M 按 8× 收入估值 = $5.6B；较 $1.5B 入场价 3.7× — 需要 Nubank 式加速
    approximationNotes: 收入和倍数假设仅作示意。集团合并收入未公开披露；数字由 TymeBank SA（FY2025 R3.11B）加上估计的 GoTyme PH 贡献外推。倍数参考 Nubank P/S 和同业组分析。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
    data:
      items:
        - label: 悲观情景退出估值
          low: 400
          mid: 650
          high: 900
          unit: USD million
          detail: 下轮降价或低迷 IPO；较 $1.5B Series D 入场价 0.3–0.6×
        - label: 基准情景退出估值
          low: 1600
          mid: 2200
          high: 3000
          unit: USD million
          detail: 温和 IPO；较 Series D 入场价 1–2×；取决于 2028 年窗口
        - label: 乐观情景退出估值
          low: 3000
          mid: 4200
          high: 5600
          unit: USD million
          detail: 上行 IPO；较 Series D 入场价 2–4×；需要菲律宾成功和新市场
    approximationNotes: 区间反映情景带，不是建模分布。中点是每个情景下分析师的中枢估计。IPO 前潜在后续融资带来的稀释未建模。
  - id: FV004
    title: 投资 KPI
    type: kpi
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV017
      - CV043
      - CV044
      - CV047
    data:
      items:
        - label: 市场证据质量
          value: Medium
          period: May 2026
          tone: neutral
          detail: Series D 价格由 Nubank 入场锚定；无集团经审计 P&L
        - label: 规模证明
          value: High
          period: Jun 2025
          tone: positive
          detail: 17M+ 客户；南非盈利；GoTyme PH 有 5.1M 客户和存款
        - label: 护城河强度
          value: Medium
          period: May 2026
          tone: neutral
          detail: 零售自助机分销有差异化；既有银行投入资本开支即可复制
        - label: 单位经济质量
          value: Medium-low
          period: FY2025
          tone: neutral
          detail: 按监管文件，南非数据强；菲律宾和集团未确认；仅南非披露收入
        - label: 估值纪律
          value: Medium
          period: Dec 2024
          tone: neutral
          detail: 相比 Nubank 可比公司，$1.5B 有支撑，但要有实质回报，需要跑出乐观情景
        - label: 退出准备度
          value: Medium
          period: 2028 target
          tone: neutral
          detail: 公司指引 2028 年 NYSE IPO；南非盈利已确认；菲律宾和集团盈亏平衡未确认
        - label: 信息完整度
          value: Low-medium
          period: May 2026
          tone: warning
          detail: 5 个阻断性尽调事项；无集团 P&L；股权结构表未披露；BII 退出未验证
    approximationNotes: KPI 评估仅基于公开证据。可提交 IC 的评分仅供参考，不能替代完整尽调。
