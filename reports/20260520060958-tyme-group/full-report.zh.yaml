      - number: '6.5'
        title: 扩张动态与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 扩张策略遵循产品落地后扩张逻辑：先用免费活期账户和银行卡获客，再交叉销售储蓄（GoalSave）、BNPL（MoreTyme）、信贷（个人贷款、Retail Capital
              垫款），并越来越多加入加密服务（GoTyme PH 持有 VASP 牌照）。GoTyme SA Business Advance 产品（最高 R5 million，无需抵押）把 SME 客群从 Retail
              Capital 既有商户现金垫款账簿向外延伸。菲律宾方面，GoTyme PH 推出 MoreTyme、接入 Google Wallet/Google
              Pay、推出加密服务，反映同一条增购路径。集中度风险实质性很强：南非业务低成本、自助机驱动获客依赖 Pick n Pay、Boxer 和 TFG
              分销合作；该网络一旦明显受扰，新增获客成本会提高，现有获客速度也可能被打断。菲律宾方面，GoTyme PH 结构性嵌在 Gokongwei 集团零售生态中，利益更一致，但银行在 Gokongwei
              网络之外的增长还缺乏充分验证。SME 层面，Retail Capital 的 R9.5 billion 组合集中于商户现金垫款，这一产品本身对商户收入波动高度敏感。公司未公开披露最大客户集中度数据。Tyme
              Group 的第三市场策略（越南或印度尼西亚）意在降低国家集中度；但截至 2026 年 5 月本次报告运行日，第三市场尚未披露任何已上线银行客户。
