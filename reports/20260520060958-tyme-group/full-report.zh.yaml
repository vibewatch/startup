      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 的投资逻辑建立在五个相互咬合的判断上。第一，Tyme 已在南非验证可复制的建银行模型——TymeBank 2023 年 12 月实现盈利、FY2025 收入 R3.11
              billion（按期内汇率约 $170 million），说明高科技、高触达的零售分发模式能在规模化后跑出可持续经济性。第二，菲律宾业务阶段更早但路径类似：GoTyme 到 2024 年 12 月已有 510
              万客户和 PHP24 billion 存款，目标 2026 年底前盈利。第三，与 Nubank 的战略伙伴关系同时提供资本和打法；Nubank 曾在拉美把类似模型扩至 1.1 亿客户，可压缩 Tyme
              学习曲线。第四，南非和菲律宾 TAM 结构性很大——GSMA 数据显示，移动货币增长大多集中在 Sub-Saharan Africa 和 Southeast Asia，正是 Tyme 所在区域。第五，可信的
              2028 NYSE IPO 路径为投资者提供了明确流动性事件窗口，TechCentral 和财经媒体均报道过管理层表态。


              反向逻辑同样重要。按 1500 万客户计算，$1.5 billion 估值意味着约 $100/客户；这个溢价要求菲律宾业务和任何新市场（越南、印度尼西亚）在 IPO 窗口内贡献有分量的收入。集团不发布
              TymeBank SA 之外的合并审计财务，无法验证整个集团是否接近盈利，或 GoTyme Philippines、TymeX 的亏损是否正在吃掉南非银行盈余。倍数压缩也是现实风险：如果 2024–2028
              年公开市场金融科技倍数收缩，IPO 时 10× 收入倍数可能缩至 5–7×，显著降低 Series D 投资者的退出价值。最后，监管成本冲击——例如 Tyme 在 2025 年威胁采取法律行动的 Home
              Affairs 身份验证涨费——可能侵蚀支撑商业模式的低成本开户经济性。
