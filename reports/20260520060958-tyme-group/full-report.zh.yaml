            body: >-
              截至 30 June 2025，TymeBank 总资产从 June 2024 的 R6.67B 增至 R11.09B，增长 66%。客户存款达到 R7.66B，提供稳定、低成本的资金来源。净贷款合计
              R2.25B（+17%），金融资产（主要为持有以备流动性的政府债券）为 R5.13B。风险加权资产增长 46% 至 R5.36B，反映贷款账簿快速扩张。即便增长很快，监管资本比率仍显著高于最低要求：CET1 为
              21.29%（监管最低约 11%），总资本充足率 21.73%，杠杆率 11.23%。银行的 Basel Pillar III 披露在权益侧列示累计集团亏损 R7.72B，反映自 2015 年以来的累计投入，并被
              June 2025 的 R2.09B 集团权益部分抵消。FY2025 AFS 的持续经营附注称，Tyme Group 已确认提供资本支持至 31 October
              2026；但该日期之后存在“重大不确定性”，取决于计划中的 NYSE IPO、额外融资或股东持续支持能否完成。Nubank 在 December 2024 投入的 $150M Series D
