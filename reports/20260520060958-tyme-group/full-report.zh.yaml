      - number: '7.4'
        title: 竞争与战略风险
        blocks:
          - type: paragraph
            body: >-
              在南非，Capitec 仍是占主导地位的挑战者银行竞争对手，并在 Home Affairs 收费争议中主动站到另一边，公开支持 DHA 计划涨价。这表明 Capitec 认为收费结构可能成为打击更依赖实时
              FICA 验证的金融科技公司的竞争工具。Capitec FY2026 利润增长 23%，拉大了与仍在报告净亏损的 TymeBank 之间的单位经济差距。Discovery Bank 增长至 100
              万客户，说明高端客群已被争夺。TymeBank 目标到 2028 年进入南非银行前 3，需要从当前低于 2% 的市场份额持续提升存款份额，这是一条多年路径，执行风险不小。菲律宾方面，GoTyme 面临
              GCash（Mynt）和 Maya Bank；GCash 直到 2026 年仍有 IPO 传闻，Maya Bank 2025 年报告净收入 PHP 1.7 billion。菲律宾数字银行存款 2025 年达到
              PHP 139 billion；GoTyme 的 PHP 40 billion 份额已经有分量，但相对 GCash 生态仍有很大追赶空间。GoTyme Philippines 在 2025 年 Q1
              实现盈利的里程碑令人鼓舞，但资本充足的对手持续施压，意味着维持获客势头还需要继续投放营销和产品。集团层面的战略风险是 NYSE IPO 执行：如果能以 $1.5 billion Series D
              估值或更高估值成功 IPO，就能验证投资逻辑；但不利市场环境或未达财务里程碑，可能迫使公司低于 Series D 定价发行，或推迟上市并挤压 2026 年 10 月资本承诺窗口。
            claimRefs:
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
      - number: '7.5'
        title: 治理、国家与执行风险
        blocks:
          - type: paragraph
            body: >-
              2024 年 12 月 Series D 后，African Rainbow Capital 仍持有 Tyme Group 约 40%，以相当大的优势成为主导股东。ARC
              持股带来融资确定性，也与南非市场发展保持一致，但同时造成治理集中：ARC 自身财务状况会影响其继续提供资本支持的能力和意愿，任何 ARC 战略重心调整都可能限制 Tyme 的选择。Nubank 持股约
              10%，提供战略合作和品牌可信度，但它也是另一名大股东，并有以巴西为中心的战略议程。Series D 后完整股权结构表从未公布，仅凭公开证据无法评估治理权利。Tyme Group Pte Ltd
              注册在新加坡，运营银行在南非和菲律宾，技术实体在越南，集团 CEO 驻荷兰；这个跨多司法辖区控股结构让实体间资本流动、内部定价和监管报告义务更复杂。南非的结构性经济逆风包括超过 30%
              的失业率、限制政府支持数字普惠项目的财政压力，以及偶发影响自助机和连接可用性的电力基础设施约束。IMF 和 World Bank 对南非的国家评估把主权债务轨迹和财政整固风险列为中期担忧。菲律宾 GDP
              增长仍为正，但 BSP 监管演进——包括数字银行资本金要求可能提高——可能要求 JV 伙伴追加资本。持续经营披露叠加跨司法辖区控股结构和有限的公开股权结构透明度，意味着外部投资者的能见度低于一家估值 $1.5
              billion、准备主要交易所上市的公司通常应有的水平。
            claimRefs:
