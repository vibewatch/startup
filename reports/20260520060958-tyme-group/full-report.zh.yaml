      - number: '6.2'
        title: 采用轨迹与增长里程碑
        blocks:
          - type: paragraph
            body: >-
              GoTyme Bank SA 自 2019 年 2 月上线后沿陡峭曲线增长，在 2024 年 1 月宣布盈利时达到 850 万客户，并根据 Basel Pillar III 披露，在 2025 年 6 月达到
              1160 万注册客户。2024 年初，银行每月新增约 150,000 名客户；这个速度说明，既有零售网络把边际 CAC 压得很低，支撑了可观的自然增长。不过，Pillar III 文件也显示，1160
              万注册客户中只有 370 万为活跃客户，激活率 32%。这个缺口很大，管理层尚未公开解释，也让人质疑大多数注册用户的参与深度。菲律宾方面，GoTyme Bank Philippines 从 2022 年 10
              月上线扩至 2024 年 12 月的 510 万客户（BusinessWorld 对 CEO 的采访），并在 Visa 官方 2026 年 2 月发布中披露，Visa 借记卡用户超过 800 万、客户存款达到
              P43 billion。Visa 确认 GoTyme PH 是菲律宾活跃 Visa 借记卡发行量第 1 名，且 2025 年支付量同比增长超过 150%，佐证了存款和卡片数据。GoTyme Bank PH CEO
              Nate Clarke 将提速归因于服务不足的年轻市场、线上线下融合自助机模式和 Gokongwei 零售网络。集团层面，Tyme Group 披露 2025 年中两地客户超过 1700 万。
