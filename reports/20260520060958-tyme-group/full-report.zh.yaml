        title: 图表
        blocks:
          - type: callout
            title: 持续经营资本窗口将在 2026 年 10 月关闭
            body: >-
              FY2025 AFS 的持续经营披露，是外部投资者面临的单一最重要风险：Tyme Group 只确认向南非银行提供资本支持至 2026 年 10 月 31 日，前提是完成 NYSE
              IPO、募集更多股权，或获得股东继续支持。ARC 或其他股东尚未公开承诺在该日期后继续支持。如果 IPO 推迟或撤回，公司可能需要以不利条款取得紧急过桥资金。
