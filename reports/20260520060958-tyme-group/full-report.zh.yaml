      - number: '7.3'
        title: 运营、技术与集中度风险
        blocks:
          - type: paragraph
            body: >-
              TymeBank 通过云迁移把关键服务跑在 Amazon Web Services（ECS 和 EKS）上，TymeX 领导层称这对集团连续建银行的模式是基础性动作。这带来单一供应商集中风险：AWS
              在非洲或亚太区域一旦宕机，TymeBank SA 和 GoTyme Philippines 会同时受影响；公司未公开披露
              SLA、恢复时间目标（RTO）或灾备拓扑。集团没有在任何公开披露中点名核心银行供应商或账本技术栈，外部因此难以评估供应商锁定、迁移风险，或交易处理层的单点故障。南非从 TymeBank 更名为
              GoTyme——GoTyme app 自 2026 年 1 月起分阶段迁移上线——带来近期运营风险，包括客户沟通失误、卡片迁移错误和产品功能对齐不足。TymeBank GitHub
              没有公开仓库，意味着外界看不到安全卫生、依赖管理或代码节奏信号。云集中之后最大的运营风险是 KYC 通道：TymeBank 无网点模式依赖对 Home Affairs National Population
              Register 的实时 FICA 身份验证，拟议中的 R10/次查询费预计会让每个自助机新开户客户增加约 R40 成本，明显高于现有成本结构。Retail Capital 的 SME
              商户现金垫款模式还叠加了信贷运营风险，因为 SME 违约周期可能快于年度信贷复核周期。
