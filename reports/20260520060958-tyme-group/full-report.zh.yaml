      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 信息不对称是主导风险
            body: 投资建议面临的最大单一风险，是缺少集团层面合并审计财务。本章所有情景分析都建立在 TymeBank SA 法定文件加管理层表态外推之上。南非实体经济性与集团经济性之间的差距未知，且可能很大。
            calloutType: risk
            claimRefs:
              - CV043
          - type: callout
            title: Nubank 的 $150M 入股是最可信的外部估值信号
            body: Nu Holdings 是一家有自身股东、SEC 文件和声誉约束的公众公司。它在独立尽调后按 $1.5 billion 定价，是公开证据中最有防御力的第三方锚点。战略理由（新兴市场模式迁移）连贯且有文件支持。
            calloutType: strength
            claimRefs:
              - CV002
              - CV019
          - type: callout
            title: 五项尽调材料阻碍任何投资承诺
            body: 集团审计财务、Series D 后股权结构表、GoTyme PH P&L 轨迹、ARC 治理权利以及 BII 退出条款均缺失。任何一项都无法从公开来源推断。在收到并审阅全部五项之前，不应提交最终 IC 建议。
            calloutType: recommendation
            claimRefs:
