            body: >-
              Capitec 是南非最难对标的对象，因为它把简单价值主张和巨大规模结合在一起：Reuters 报道称，其在 August 2025 半年期拥有 25 million 活跃客户，到 February 2026
              年末超过 26 million。Discovery 规模小得多，但已跨过 1 million 客户和超过 2 million 活跃账户，并把银行嵌入更广泛的保险与奖励生态。Tyme
              的公开叙事仍强调无月费、快速开户，以及超过 1,000 个 kiosk 和 15,000 个零售点的零售合作网络；这一点有差异化，但产品广度窄于最大型传统银行。在菲律宾，GoTyme 的线上线下融合
              模型扩张很快，14 个月内达到 2.3 million 客户、约 500 个 kiosk，但它面对的是规模大得多的消费者平台。GCash 称 94 million 菲律宾人使用过该 app；Maya 则报告截至
              2025 年第二季度拥有 8.2 million 银行客户、2.1 million 借款人和 P50 billion 存款。这意味着 GoTyme 的差异化在获客设计，而不在绝对规模。
