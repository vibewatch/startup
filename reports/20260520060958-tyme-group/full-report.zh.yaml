  productSummary: >-
    Tyme Group 的核心产品是一套可复用的银行搭建平台，包含：（1）移动优先银行 app（储蓄、支付、借贷、保险），采用 API 优先架构；（2）自研 kiosk 硬件，放在合作零售门店内即时发行借记卡并开户（Pick n
    Pay、Boxer SA；Robinsons PH）；（3）TymeX —— 位于 越南的共享工程平台，承载核心银行、风控和合规能力；（4）Retail Capital，一个商户现金预支贷款部门（R9.5B 南非 MCA
    组合）。GoTyme PH 提供储蓄账户、Visa 借记卡、QR 支付和小额信贷。
  customerFocus: 南非和菲律宾的大众市场消费者，尤其是通过店内 kiosk 网络开户、银行服务不足或首次开户的人群。次级客群包括 Retail Capital MCA 产品服务的 SME，以及通过合作渠道触达的企业客户。
  businessModel: >-
    零售银行：净利息收入（贷款与储蓄息差）、手续费和佣金收入（交易费、卡组织交换费、保险佣金），以及商户现金预支费用（Retail Capital）。收入在运营银行实体层面报告。公司没有技术授权或 SaaS
    收入流；变现来自受监管银行损益表。
  stage: Series D — pre-IPO, targeting 2028 NYSE or JSE listing
  fundingStatus: >-
