      - number: '8.4'
        title: 情景分析：乐观、基准和悲观
        blocks:
          - type: paragraph
            body: >-
              三种情景覆盖了按 $1.5 billion 进入 Series D 的合理投资结果。乐观情景下，Tyme 按计划完成 2028 NYSE IPO，集团客户超过 3000 万，GoTyme Philippines
              按目标在 2026 年盈利，新市场（越南、印度尼西亚）贡献增量收入。在这条轨迹上，对估计 $600–700 million 集团收入套用 5–8× 收入倍数，意味着 IPO 估值 $3–5.6
              billion；扣除潜在后续融资轮稀释前，对 Series D 价格产生 2–4× 回报。Nubank 对比在方向上支持这一判断：Nubank 从 IPO 前 $25 billion 估值时约 1000
              万客户，四年增长到市值 $60 billion、客户 1.1 亿。


              基准情景假设执行适中：GoTyme Philippines 达到盈亏平衡但盈利推迟到 2027 年，新市场进入延至 2029 年，集团到 2028 年达到 2200–2500 万客户。在 $400–500
              million 集团收入上按 4–6× 收入倍数 IPO，隐含估值 $1.6–3.0 billion。这个区间低端意味着 Series D 投资者在稀释前大致持平。Nubank 10%
              优先股定价如果能代表整体股权结构，说明后续股权层级相对企业价值的优先权悬挂可能有限——但公开证据无法确认。


              悲观情景由倍数压缩和执行落空驱动。如果全球金融科技公司 P/S 倍数从 2024 年峰值收缩至 2028 年的 2× 收入，而集团收入只达到 $300 million（由于菲律宾监管摩擦或 GCash、Maya
              竞争升温，增长不及预期），则 $600 million 隐含估值相当于 Series D 价格损失 60%。尾部风险是 IPO 结构性推迟到 2030 年之后，这会拉长持有期并进一步压缩年化回报。南非 Home
              Affairs 身份验证收费争议带来的监管风险，又增加了一个下行情景：获客成本可能上升 20–30%，并压缩单位经济性。
