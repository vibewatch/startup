              TymeBank 的 FY2025 Annual Financial Statements（October 2025，PwC 审计）包含持续经营披露，称 Tyme Group 只确认提供资本支持至 31
              October 2026。该日期之后，持续运营取决于取得股东支持、追加融资，或完成计划中的 2028 NYSE IPO。任何投资者都必须把这一重大不确定性与 IPO 时间表放在一起评估。
