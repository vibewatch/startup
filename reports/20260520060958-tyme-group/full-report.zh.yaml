companyProfile:
  summary: >-
    Tyme Group 是一家注册于新加坡的数字银行控股公司，用移动优先 app 与零售门店 kiosk 开户相结合的混合模式，在银行服务不足的新兴市场建设和运营数字银行。集团旗下两家运营银行分别是 TymeBank（南非，正更名为
    GoTyme Bank SA）和 GoTyme Bank（菲律宾，与 Gokongwei Group 合资）。第三个品牌 TymeX 依托越南工程中心，为集团提供共享技术平台。TymeBank SA 在 December 2023
    实现首个盈利自然月，FY2025 总收入 R3.11B（同比增长 29%），但实体层面仍未盈利，FY2025 综合亏损总额为 R219M。GoTyme Philippines 于 October 2022 上线，截至 May
    2026 客户数已突破 9 million，并按活跃使用量成为菲律宾 #1 Visa 借记卡发行方。December 2024，Tyme Group 完成 $250 million Series D，估值 $1.5
    billion，由 Nubank 领投（$150M 换取 10%），M&G Catalyst（$50M）和现有股东跟投。African Rainbow Capital 持有集团约 40% 股权。累计融资约 $600
    million。集团在各市场服务 17 million-plus 名客户，全球员工超过 1,500 人。
