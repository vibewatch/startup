            body: >-
              在两个市场，可见产品线都已超过一个简单支票账户。南非的消费者菜单现在包括活期账户银行、GoalSave、定期存款、个人贷款、卡、即时支付和人工支持，企业端则增加营运资金、创业者社区功能，以及与 iKhokha
