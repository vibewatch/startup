      - number: '6.4'
        title: 留存、满意度与耐久性证据
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 公开留存证据有限，未披露净留存率（NRR）、总留存率（GRR）或队列数据。最强的耐久性信号来自三个代理指标：(1) TymeBank 的 NPS；根据 2021 年 Kantar
              研究，在南非低收入和中等收入客群中，它被描述为所有零售银行里最高的一档；(2) 2025 年 6 月 Pillar III 文件显示活跃 / 注册比例
              32%，这是一个需要管理层澄清的警示数字——可能反映早期大规模获客活动留下的休眠账户，也可能是银行低摩擦、低门槛开户模型的产物；(3) GoTyme PH 的存款从 2024 年 12 月 P24 billion
              增至 2026 年 2 月 P43 billion，意味着显著的净留存和余额沉淀，而不只是一次性开户。TymeBank（现 GoTyme SA）的 GoalSave 产品对锁定储蓄提供最高 10%
              年利率，是储蓄客群的粘性机制。MoreTyme BNPL 截至 2024 年 1 月新闻稿已覆盖 5,500+ 线下门店和 1,200+ 电商网站，创造反复交易互动，应该能支撑零售消费者留存。HelloPeter
              是南非主要消费者投诉平台，GoTyme/TymeBank 可被搜索到，但内容需要 JavaScript 渲染，本次审阅无法取得具体评分数据。GoTyme Philippines 未公开披露 NPS 或 CSAT
              指标。
