      - number: '8.3'
        title: 可比公司与倍数基准
        blocks:
          - type: paragraph
            body: >-
              为 Tyme 构建可比集合，需要区分公共市场基准（给出倍数上限和下限）、私募轮次基准（校准相近阶段的同业定价）和新兴市场特定参照（调整地理风险溢价）。最直接的公共可比是 Nu Holdings（NYSE:
              NU），即 Nubank 的母公司。截至 2026 年 5 月，Yahoo Finance 数据显示 Nu Holdings 市值约 $59.75 billion，过去十二个月 P/E 为
              18.9×，在巴西、墨西哥和哥伦比亚服务超过 1.1 亿 客户。Nu 于 2026 年 4 月向 SEC 提交的 20-F 确认 2025 全年盈利且收入继续增长。按 Nubank 规模，其市值隐含的单客价格约为
              $543/客户，显著高于 Tyme 在 Series D 隐含的 $100。


              私募轮次同业中，Revolut 可作为高端参照：Wikipedia 报道 Revolut 2025 年 11 月估值 $75 billion，隐含倍数远高于 Tyme 当前水平。Moniepoint
              是更接近的非洲金融科技同业，2024 年 10 月按 $1.0 billion 估值完成 Series C，拥有强劲的尼日利亚支付基本盘；地理和阶段上是直接可比，产品组合不同。菲律宾方面，Maya Bank（原
              PayMaya）2025 年报告净收入 PHP1.7 billion，而菲律宾数字银行存款池到 2025 年达到 PHP139 billion，说明竞争环境仍然分散且增长充足。GSMA 2024 State of
              the Industry report on mobile money 提供宏观锚点：2023 年全球注册移动货币账户 17.5 亿、交易额 $1.68 trillion，增长最快的是 Sub-Saharan
              Africa 和 Southeast Asia。


              Tyme 估值的实际含义，是一个单客价格倍数收敛故事：如果 Tyme 到 IPO 时能增长到 3500–4000 万 客户，并证明集团盈利，则在 $4–7 billion IPO 市值下，隐含单客价值为
              $100–200，仍低于 Nubank 成熟市场的 $543，但对新兴市场早期溢价而言合理。关键敏感项是增长率，不是当前倍数。
