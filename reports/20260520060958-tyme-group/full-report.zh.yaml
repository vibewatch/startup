      - number: '2.3'
        title: 买方、用户、付费方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              在 Tyme
              的市场里，买方、用户和付费方往往是同一个人，但采用路径仍由生态、雇主、商户和政府支付轨道居中塑造。最重要的客户群包括需要低成本主账户的领薪大众成年人、希望更安全存钱和低摩擦支付的现金依赖家庭、需要营运资金和支付受理能力的微商户与
              MSME，以及提供开户物理触点的生态合作伙伴。在南非，数字接入已经广泛，但可负担性、信任和实体现金行为仍会影响使用，因此零售商辅助开户很重要。在
              菲律宾，账户持有率较低，但智能手机、电子货币和零售支付快速数字化已经让数字熟悉度很高。这意味着产品旅程通常从支付和存款开始，再扩展到储蓄、工资关联或个人信贷，以及商户融资。不同用例的付费逻辑也不同：家庭自费，商户通过费用或融资息差付费，生态合作伙伴则把
              kiosk、卡和奖励嵌入既有客流，实际上补贴了获客。Tyme 的市场进入逻辑因此取决于产品顺序与客户准备度的匹配：先支付和开户，再活跃使用，最后等交易数据和信任累积后再加深贷款。
