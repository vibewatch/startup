  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Tyme 的相关市场比抽象意义上的“银行”更窄。公司争夺的是南非和菲律宾银行服务不足消费者与 SME
              的日常金融生活：交易账户、工资与账单流、储蓄余额、商户和个人信贷，以及相邻的数字支付活动。企业财资、投行业务、财富管理或纯保险支出不在这一范围内，因为它们不属于 Tyme
              零售嵌入式模型的实际采用路径。南非和菲律宾的公共政策文件也强化了这一界定。South African Reserve Bank 的数字支付路线图把竞争、互操作性和普惠直接绑定到低成本交易流；BSP
              的路线图则把支付和交易账户描述为进入正规金融普惠的入口。因此，最强的现状替代方案不是高端全功能银行套餐，而是传统零售银行账户、现金、电子钱包、工资关联借款，以及非正式或半正式 SME
              融资。在两国，大众市场机会不太取决于说服已经富裕、拥有多个银行账户的客户切换，而更取决于把现金依赖高、数字上可触达的成年人和商户，转化为活跃账户、支付和信贷用户。正是这一区分，让 Tyme
              的零售商辅助数字模型即便在正规账户持有率已经相对较高的市场，也仍有经济意义。
