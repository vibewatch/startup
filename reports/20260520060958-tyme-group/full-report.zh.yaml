        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开架构披露来自 TymeX 和 AWS 背书材料，而不是深度技术白皮书。Tyme 称 TymeX 是集团的多国技术和产品开发引擎，建设可按国家本地化的自研复用资产。TymeX
              页面进一步明确列出运营模式：微服务架构、容器化服务、持续代码部署、自动化测试、异步消息和全云托管基础设施。AWS 相关第三方报道提供了更多细节，称 TymeBank 上线时已将大部分基础设施迁移到 AWS，并在
              Amazon ECS 和 Amazon EKS 上运行任务关键服务；TymeX 领导层则把集团描述为连续搭建银行的运营者，依靠云经济性换取速度和灵活性。技术上真正有差异的，不只是云使用本身 —— 这已经很常见
