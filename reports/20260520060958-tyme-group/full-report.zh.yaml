  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 风险 / 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - GoTyme Philippines 未能盈亏平衡
        - GoTyme Philippines 2027 年四个季度均报告 EBITDA 为负
        - 削弱双地域模型投资逻辑和 2028 年 IPO 准备叙事
        - 下调至持有；重估 $1.5B 入场估值；评估战略选项
      - - ARC 或 Nubank 折价老股交易
        - 任一股东以低于 $1.2B 的隐含集团估值做老股交易
        - 一级市场信号：主要投资者不预期估值恢复到 $1.5B+
        - 立即重估；可能按市场价退出；降价轮情景
      - - TymeBank SA 跌出前三
        - SARB 数据显示 Capitec、FNB 或其他挑战者在客户数上超过 TymeBank SA
        - 核心资产恶化；建立在南非锚点上的集团逻辑走弱
        - 要求管理层解释；观察六个月；可能减仓
      - - IPO 推迟至 2030 年之后
        - 管理层公开宣布 IPO 目标推迟至 2030 年后，且没有战略理由
        - 流动性事件周期拉长；回报曲线恶化；Series D 轮后资本锁定 8+ 年
        - 升级至治理复盘；评估二级市场流动性选项
      - - 监管成本冲击导致获客成本增加超过 20%
        - Home Affairs 收费落地，或 BSP 数字银行政策把 KYC 成本推高到模型水平以上
        - 单位经济性恶化；回本周期拉长；获客放缓
        - 重算经济模型；评估缓释措施；向管理层要说法
    notes: 终止触发因素是二元信号。财务和运营投资逻辑假设基准情景下不会出现这些事件；任一事件出现，都需要正式重新复盘。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 集团层面经审计财报
        - FY2025 和 H1-2026 集团合并 P&L、资产负债表和现金流，包含 TymeX 与 GoTyme PH
        - 无法验证集团盈利能力或亏损并表；仅南非银行 P&L 不足以支撑 $1.5B 集团估值
        - 向 Tyme Group CFO 索取投资者更新包或管理账
      - - Series D 轮后股权结构表
        - 完全摊薄股权结构表，包含持股比例、清算优先权、反稀释条款和拖售权
        - 没有股权结构条款，就无法评估优先权包袱、回报分配瀑布和下行保护
        - 向 Tyme CFO 或交易律师索取；审阅认购协议
      - - GoTyme Philippines 盈利时间表
        - GoTyme Bank Philippines 到 2026 年的季度 P&L 轨迹；已确认的盈亏平衡日期和路径
        - 基准情景依赖 2026 年菲律宾盈亏平衡；任何延后都会显著改变估值
        - 向 GoTyme Philippines CEO 索取；审阅 BSP 监管披露
      - - Series D 轮后 ARC 治理权利
        - ARC 在集团控股公司层面的投票权、董事会席位分配、同意权和优先认购权
        - ARC 持股 40% 带来治理风险；没有控股公司条款，无法评估投资者权利
        - 向 ARC 投资者关系或 Tyme Group 法律顾问索取
      - - BII 退出及影响
        - 确认 BII 退出机制、退出价格，以及退出估值是否等于或低于 $1.5B
        - BII 退出说明早期进入的发展金融投资者决定不再跟进
        - 向 Tyme IR 索取；交叉核对 BII 投资页面记录
    notes: 这五项尽调问题是最终 IC 建议前的必要材料。第 1 和第 2 项（集团财务和股权结构表）是任何投资承诺的阻断性尽调事项。
    claimRefs:
      - CV043
      - CV044
      - CV047
      - CV048
