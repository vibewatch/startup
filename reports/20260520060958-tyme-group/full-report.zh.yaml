      - number: '7.2'
        title: 监管、法律与 AML/KYC 风险
        blocks:
          - type: paragraph
            body: >-
              TymeBank South Africa（更名后以 GoTyme Bank Limited 运营）在银行审慎标准上受 South African Reserve Bank 的 Prudential
              Authority 监管，在 Financial Sector Regulation Act（No. 9 of 2017）下的市场行为上受 Financial Sector Conduct
              Authority（FSCA）监管，在 National Credit Act 下的消费者信贷上受 National Credit Regulator（NCR）监管。2026 年 4 月 SARB
              注册银行名单列出 Cheslyn Jacobs 为 GoTyme Bank Limited CEO，确认牌照仍然有效。菲律宾方面，Bangko Sentral ng Pilipinas（BSP）于 2022 年
              7 月 29 日向 GoTyme Bank Corporation 颁发 Certificate of Authority，确认其符合 Bank Secrecy Act、Anti-Money Laundering
              Act、Customer Protection Act 和 Data Protection Act，并验证了稳健的 IT Risk Management Framework。南非在改进 AML/CFT
              国家框架后于 2023 年 10 月退出 Financial Action Task Force 灰名单，但 2021 年 FATF Mutual Evaluation 曾给南非多项 Partially
              Compliant 评级，包括客户尽职调查和新技术，这说明 TymeBank 所处系统性风险环境仍然复杂。最紧迫的法律风险，是拟议中的 Home Affairs 收费上调：FICA 下实时身份验证每次查询费用从
              15 cents 升至 R10。Tyme CEO Coen Jonker 称这次涨价是对金融普惠的「致命打击」，公开报道也确认 TymeBank 正在考虑法律行动。如果 R10
              费率未经缓释直接实施，TymeBank 的 KYC 获客成本会大幅上升；相较更多依赖批量隔夜验证的传统银行，其无网点、大众市场开户模型会受到不成比例的冲击。Competition Commission of
              South Africa 和 POPIA（Protection of Personal Information Act）义务又叠加了合规层，但公开记录中尚未发现针对 TymeBank 的执法行动。
