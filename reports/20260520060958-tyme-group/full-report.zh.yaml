          - type: paragraph
            body: >-
              GoTyme Group 客户基础的生产证据覆盖四类部署形态。第一，南非零售消费者业务已全面上线：2024 年 1 月客户超过 850 万，并在 2023 年 12
              月实现银行层面盈利，成为非洲首家做到这一点的数字银行。第二，SME 和微型商户客群由 Retail Capital 证明：截至 2024 年 1 月新闻稿，其活跃商户借款人超过 50,000，已投放营运资金
              R9.5 billion，组合年增长率约 30%。第三，Visa 对 800 万以上活跃 Visa 借记卡持卡人和 P43 billion 存款的认可，确认了 GoTyme Bank Philippines
              的消费者部署。第四，社会补助客群有公开记录：截至 2024 年 1 月公告，Grant Advance 客户中 78% 为照护者、13% 为老年补助领取者、10%
              为残障补助领取者，显示出有意的金融普惠定位。第五类形态——使用 TymePOS 的 township 微型商户——仍处早期铺开阶段，公开资料只记录了与 Khona La Local Stores
              的试点合作。Forbes 菲律宾最佳数字银行奖（GoTyme PH 连续两年获奖）和 Visa 第 1 借记卡排名，为消费者业务质量提供独立第三方验证；但 Forbes 奖项底层数据未公开披露。Robinsons
              Retail 合作在 GoTyme PH 2022 年 11 月上线时正式确立，把银行嵌入菲律宾主要零售连锁，成为带有 Go Rewards 忠诚度整合的线上线下融合获客渠道。
