            body: >-
              Tyme 的护城河真实存在，但很窄。零售合作开户、kiosk
              发卡，以及横跨南非和菲律宾的共享技术，相比逐国定制的挑战者，能降低获客和建设成本。对银行服务不足或信任度较低、看重线下信任提示的用户来说，这些优势最重要。但当竞争从开户转向存款主账户地位、奖励深度和交易数据授信时，护城河会变弱。Discovery
              可以通过整合保险与奖励体系提高切换成本；GCash 可以靠商户受理和超级 app 高频使用做到这一点；Maya 则明确在支付行为之上构建更强的借贷与储蓄循环。公开证据还显示，GCash 和 Maya 都在探索
              IPO 路径，这意味着资本供给仍会延续，竞争强度会升级。最大的未解问题是留存：公开来源很少说明工资代发获取、流失率、存款黏性，或 Tyme 多常能真正取代传统银行成为主账户。
