chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、架构与运营版图
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 将自己定位为一家聚焦新兴市场的多国数字银行集团，组织形态围绕高科技、高接触的银行模式，并嵌入实体零售生态。目前公开公司官网是 tyme.com，而不是任务简报中给出的停放域名
              tymegroup.com；官网把新加坡定位为集团总部，同时突出南非、菲律宾 和越南技术中心三块主要运营版图。南非方面，TymeBank 于 February 2019 上线；到 May
              2026，面向消费者的网站已跳转至 gotyme.co.za，说明南非业务正处在更广泛的 GoTyme 品牌统一过程中。菲律宾方面，GoTyme 于 October 2022 携手 Gokongwei Group
              上线，通过 kiosk、借记卡和 app 优先开户，沿用零售导流的开户逻辑。集团官网披露客户超过 15 million、员工超过 1,500 人；而 2025 年后期公司沟通口径显示，随着 Tyme
              进入印尼和香港借贷等新市场，客户基数已超过 17 million。因此，Tyme 不是单一国家数字银行，而是一套可复用的银行搭建平台：一个已成熟的南非资产、一个高速扩张的菲律宾 合资银行，以及早期相邻市场扩张。
