        title: 融资、股东与资本形成
        blocks:
          - type: paragraph
            body: >-
              Tyme 的资本历史显示，公司从南非银行搭建者演进为新兴市场独角兽。公司 May 2023 的 pre-Series C 公告称，股东合计投资 $77.8 million，Norrsken22 和 Blue
              Earth Capital 作为新投资方加入，资金用途包括南非和 菲律宾增长、东南亚扩张，以及部分股份回购。同一公告披露收入运行率超过 $100 million、每月开户超过 300,000
              名客户，让投资者在全面盈利前先看到规模叙事。到 December 2024，TechCrunch 报道 Tyme 完成 $250 million Series D，估值 $1.5 billion，由 Nubank
