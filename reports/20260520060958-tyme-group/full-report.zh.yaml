  - id: TU005
    title: 扩张驱动与集中风险表
    columns:
      - 扩张驱动
      - 集中风险
      - 潜在影响
      - 尽调路径
    rows:
      - - 先落地后扩张的产品交叉销售：活期账户 → 储蓄 → BNPL → 信贷 → 加密货币 / 投资
        - 南非单一零售分发网络（Pick n Pay、Boxer、TFG 自助终端）是主要低成本获客引擎
        - 零售合作伙伴协议若丢失或重新谈判，将显著推高 CAC，并拖慢净新增客户
        - 确认核心零售合作伙伴的合同条款、排他安排和收入分成；评估替代获客渠道
      - - 嵌入菲律宾 Gokongwei 生态：Go Rewards 会员体系 + Robinsons 零售网络
        - GoTyme PH 的线上线下一体化增长与 Gokongwei Group 零售版图结构性绑定；网络外获客验证较少
        - Gokongwei 集团业务转向或战略分歧可能减少 kiosk 准入，并拉低获客速度
        - 审阅 JV 协议治理条款；评估 GoTyme PH 来自非 Gokongwei 获客渠道的表现
      - - SME 扩张借力 Retail Capital — GoTyme Business Advance 最高 R5M
        - Retail Capital 商户现金预支组合集中于单一信贷产品；宏观或行业压力会让违约成簇出现
        - R9.5B+ MCA 账簿；若出现 10% 违约周期，将产生约 R950M 损失，仅靠手续费收入无法抵消
        - 索取 Retail Capital 按放款批次拆分的违约曲线、行业拆分和最大单一借款人敞口
      - - 进入第三市场（越南、印度尼西亚）以降低国家集中度
        - 目前收入只在两个市场之间拆分；任何南非监管冲击或盈利反转都会影响集团大部分收入
        - SARB 执法行动或南非资本成本冲击会打击集团最成熟的利润中心
        - 跟踪印度尼西亚 / 越南数字银行牌照监管时间线；评估第三市场何时贡献实质收入
    notes: 扩张驱动和风险分析来自公开商业模式描述与新闻稿推断；没有内部风险披露。Retail Capital 组合规模来自 2024 年 1 月新闻稿，可能已经变化。Retail Capital 的头部客户或头部商户集中度未公开披露。
