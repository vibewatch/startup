      - number: '4.6'
        title: 财务结论与未完成尽调缺口
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的财务轨迹可信且在改善。R3.11B 收入、83% 成本收入比，以及通向全年 IFRS 口径盈亏平衡的路径，使其成为全球少数接近这一里程碑的数字银行之一。December 2024 由
              Nubank 领投、估值 $1.5B 的 $250M Series D 验证了增长故事。不过，几项重大缺口让完整财务评估无法完成。第一，Tyme Group Pte Ltd
              不公布合并利润表，集团层面盈利能力、公司间费用流和集团控股成本分配都不透明。第二，TymeBank FY2025 AFS 中的持续经营保留意见表明，股东支持只确认到 October
              2026；持续运营取决于计划中的 2028 NYSE IPO、进一步融资或股东持续出资。第三，GoTyme Philippines
              财务数据未公开披露，国际扩张带来的资本拖累存在不确定性。第四，按比例看，信用减值成本增长快于收入；随着贷款账簿成熟，需要密切监控。ARC 约 40% 持股和 Nubank
              关系提供了机构背书，但私人市场投资者以及计划中的 IPO 最终会检验估值假设。
