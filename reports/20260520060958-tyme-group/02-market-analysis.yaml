    "title": "Market Analysis",
    "summary": "Tyme Group operates in two structurally attractive but operationally different digital-banking markets: South Africa, where formal account ownership is already high but cash, credit scarcity, and distribution frictions persist; and the Philippines, where digital-payment adoption is accelerating quickly but individual account ownership remains only 50%. Public market evidence supports a TAM framing around everyday transaction accounts, savings, payments, and small-ticket consumer and SME credit rather than the full revenue pool of traditional banking. The strongest tailwinds are smartphone adoption, payment interoperability, and underbanked SME/household demand, while the main constraints are cash preference, trust/fraud risk, thin-file lending, affordability, and regulatory execution."
  },
