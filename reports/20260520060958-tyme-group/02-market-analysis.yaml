      "id": "market-boundary-and-status-quo-substitutes",
      "title": "Market Boundary and Status-Quo Substitutes",
      "body": "Tyme's relevant market is narrower than 'banking' in the abstract. The company is competing for the everyday financial lives of underbanked consumers and SMEs in South Africa and the Philippines: transaction accounts, salary and bill flows, savings balances, merchant and personal credit, and adjacent digital-payment activity. That is different from corporate treasury, investment banking, wealth management, or insurance-only spending, all of which sit outside the practical adoption path for Tyme's retail-embedded model. Public policy documents from South Africa and the Philippines reinforce this framing. The South African Reserve Bank's digital-payments roadmap ties competition, interoperability, and inclusion directly to low-cost transaction flows, while the BSP's roadmap describes payment and transaction accounts as the gateway into formal financial inclusion. The strongest status-quo substitutes are therefore incumbent retail bank accounts, cash, e-wallets, salary-linked borrowing, and informal or semi-formal SME finance rather than premium full-service banking bundles. In both countries, the mass-market opportunity depends less on persuading already affluent multi-bank customers to switch and more on turning cash-heavy, digitally reachable adults and merchants into active account, payment, and credit users. That distinction is what makes Tyme's retailer-assisted digital model economically relevant even where formal account ownership is already comparatively high.",
      "claimRefs": ["CM001", "CM002", "CM011", "CM021", "CM038", "CM039", "CM045"],
      "tableRefs": ["TM001", "TM005"],
      "figureRefs": ["FM001"]
    },
