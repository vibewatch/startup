    title: "Critical Exposure: Cross-Border Employer of Record and Fintech Liabilities"
    body: "Employment Hero's simultaneous pursuit of global Employer of Record services (Global Teams across 180 countries) and consumer fintech infrastructure (Swag wallet, debit cards, and InstaPay earned wage access) dramatically amplifies legal, regulatory, and counterparty risks compared to pure-play B2B SaaS HR software. Operating as an employer of record exposes the company to joint employment claims and labor tribunal disputes, while providing financial services introduces banking partner dependencies and strict AML/KYC enforcement risks."
