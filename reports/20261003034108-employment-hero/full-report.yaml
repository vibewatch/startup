      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Critical Exposure: Cross-Border Employer of Record and Fintech Liabilities'
            body: >-
              Employment Hero's simultaneous pursuit of global Employer of Record services (Global Teams across 180
              countries) and consumer fintech infrastructure (Swag wallet, debit cards, and InstaPay earned wage access)
              dramatically amplifies legal, regulatory, and counterparty risks compared to pure-play B2B SaaS HR
              software. Operating as an employer of record exposes the company to joint employment claims and labor
              tribunal disputes, while providing financial services introduces banking partner dependencies and strict
              AML/KYC enforcement risks.
            calloutType: risk
            claimRefs:
              - CR004
              - CR010
              - CR011
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Core Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Employment Hero presents a compelling investment thesis as an integrated employment operating system
              addressing small and medium enterprises across Australia, the United Kingdom, New Zealand, and Southeast
              Asia. The core bull thesis rests on its mission-critical software combining human resources, payroll,
              compliance, and employee benefits, which creates substantial switching barriers once embedded within small
              business operations. Furthermore, the company has expanded its addressable value pool through its Swag
              superapp and embedded financial offerings, facilitating over $120 billion in annual payroll payments and
              supporting more than 350,000 businesses globally. However, the investment anti-thesis highlights severe
              constraints on underwriting the private equity valuation. In February 2026, cornerstone backer SEEK
              Investments announced a process to divest the SEEK Growth Fund's long-standing stake in the business,
              introducing significant secondary market overhang and potential misalignment among major shareholders.
              Additionally, rapid cross-border expansion into jurisdictions with heightened regulatory and legal
              compliance scrutiny—such as United Kingdom right-to-work enforcement—creates substantial operational and
              execution friction. Without audited financial statements detailing customer acquisition costs, gross
              margin durability, and cohort net revenue retention, the business model carries unhedged operational risk
              at current private multiples.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV011
      - number: '8.2'
        title: Recommendation Framework, Risk Rating, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              We assign Employment Hero a research-more recommendation with a medium confidence rating, high risk
              posture, and stretched valuation stance. The primary historical valuation anchor is the October 2023
              Series F round led by Technology Crossover Ventures, which raised A$263 million at a reported post-money
              valuation of A$2.0 billion to A$2.13 billion (approximately US$1.35 billion to US$1.45 billion). While the
              company subsequently reported passing A$300 million in annual recurring revenue with year-over-year
              top-line growth sustained above 30%, headline ARR figures from company announcements cannot substitute for
              audited GAAP or IFRS gross revenue bridge analysis. The ongoing divestment process initiated by the SEEK
              Growth Fund signals that institutional growth capital is seeking liquidity rather than doubling down at
              current valuation marks. Investors must exercise strict entry discipline: common equity investors face
              structural downside risk if late-stage Series F preferred shares carry liquidation preferences or senior
              return ratchets. Entry should be conditioned upon verified disclosure of cap-table preference stacks,
              audited gross margins across geographic operating entities, and secondary pricing benchmarks established
              by the SEEK stake transaction.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV009
              - CV010
      - number: '8.3'
        title: Scenario Analysis, Downside Triggers, and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Evaluating Employment Hero across macroeconomic environments requires underwriting three distinct
              operating scenarios. In the bull case, Employment Hero successfully executes its agentic artificial
              intelligence roadmap, sustains international growth above 30%, expands gross margins across the UK and
              Canada, and successfully digests the SEEK Growth Fund secondary sale into an initial public offering or
              high-multiple strategic acquisition, commanding an enterprise value exceeding A$3.0 billion. In the base
              case, revenue growth decelerates toward 15% to 20% as core Australian SME market saturation encounters
              competitive resistance from regional payroll and HCM providers, leading to a flat round or minor multiple
              contraction with fair value estimated at A$1.8 billion to A$2.2 billion (roughly 6.0x to 7.0x ARR). In the
              bear case, cross-border compliance overhead escalates, UK employment regulatory shifts increase
              operational liabilities, and the SEEK divestment creates adverse signaling that forces a down-round or
              structured recapitalization below A$1.3 billion. Key downside triggers include any unhedged customer churn
              in the core Australian accounting channel, failure to establish self-sustaining cash flow without external
              equity capital, and protracted secondary discount pressure on employee equity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV012
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Secondary Liquidity Overhang from SEEK Growth Fund Exit
            body: >-
              The announcement in February 2026 by SEEK Investments to divest its stake held by SEEK Growth Fund
              introduces substantial price discovery pressure. Even though SEEK leadership maintained confidence in
              Employment Hero's long-term outlook, a structured secondary sale of this magnitude can flood private
              trading markets with discounted paper, depressing the benchmark valuation below the A$2.0B Series F
              post-money level.
            calloutType: risk
            claimRefs:
              - CV003
              - CV007
              - CV012
          - type: callout
            title: Diligence Conditions Precedent for Future Investment
            body: >-
              Prospective growth equity and secondary investors should withhold binding offers until management provides
              an audited reconciliation bridging self-reported ARR to statutory audited revenue, granular customer churn
              data for post-acquisition KeyPay cohorts, and full disclosure of liquidation preferences across Series A
              through F preferred shares.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV011
