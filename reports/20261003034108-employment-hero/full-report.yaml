chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Operating Scope
        blocks:
          - type: paragraph
            body: >-
              Employment Hero was founded in 2014 and operates from Sydney as a private employment-software company.
              IBISWorld identifies Employment Hero Holdings Pty Ltd as an Australian software-publishing entity
              incorporated on 29 February 2016, while the company's public materials describe a platform spanning HR,
              payroll, recruitment, benefits, employee-facing services, and employer-of-record workflows. That breadth
              matters because the business is not only a payroll processor or HR system: its privacy disclosure covers
              employer administration, jobs, financial features, implementation services, and Global Teams. The company
              also says it has five physical hubs across Australia, New Zealand, Malaysia, Singapore, and the United
              Kingdom. The evidence supports a scaled, multi-product operating footprint, but it does not provide a
              complete legal-entity chart or current country-by-country revenue mix.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is unusually visible. Independent reporting identifies Ben Thompson as co-founder and
              CEO, and Unify's September 2026 profile says he has held the CEO seat since 2014. Employment Hero's
              current about page lists Dave Tong as co-founder and Chief Technology Officer; TechCrunch described him as
              chief product and technology officer in 2023, so the title has evolved while the founder's technical remit
              remains central. This creates credible founder-market fit in employment administration and product
              engineering, but also key-person dependence: public strategy, financing ambition, and product direction
              are repeatedly voiced through Thompson. The assigned evidence does not disclose a reliable current board
              roster, investor voting rights, committees, succession planning, or a verified ownership schedule.
              Governance quality therefore cannot be inferred from executive tenure alone.
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: Financing and Capitalization
        blocks:
          - type: paragraph
            body: >-
              The strongest independently corroborated financing event is the October 2023 Series F. Employment Hero
              announced AUD 263 million led by TCV, and TechCrunch reported AUD 263 million, equivalent to USD 167
              million, at an AUD 2.13 billion valuation, equivalent to USD 1.37 billion. The company and independent
              outlets also reported cumulative capital of more than AUD 650 million and participation by Insight
              Partners, AirTree, Seek, and OneVentures. These figures describe financing raised, not cash still
              available, and the 2023 valuation is not evidence of a current mark. Public sources do not disclose
              liquidation preferences, dilution, secondary transactions, debt or credit facilities, or founder
              ownership. The investor map is therefore a partial map of disclosed participants, not a cap table or
              control analysis.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO008
              - CO009
              - CO016
      - number: '1.4'
        title: Scale, Milestones, and Risk Surface
        blocks:
          - type: paragraph
            body: >-
              Scale disclosures are meaningful but not fully comparable. The current company about page claims more than
              350,000 businesses and 2.5 million active platform users. A company-issued February 2025 release
              distributed through Business Wire claimed more than CAD 200 million of annualized recurring revenue after
              the Humi acquisition, whereas IBISWorld reports approximately 190.2 million of total 2025 revenue without
              stating a currency on the fetched public page. Revenue and ARR cannot be reconciled without an audited
              bridge. Headcount is similarly stale: the company said 900-plus employees in 2023 and TechCrunch reported
              about 925 remote workers across 19 markets. Finally, the archived privacy policy shows that the platform
              may process payroll, banking, government-ID, and special-category data and explicitly disclaims absolute
              security. That is a structural exposure, not evidence that a breach occurred.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
