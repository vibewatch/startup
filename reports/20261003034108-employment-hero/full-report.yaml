      - number: '7.2'
        title: Operational Complexity, AI Reliability, and Platform Scaling Limitations
        blocks:
          - type: paragraph
            body: >-
              The platform's operational architecture combines cloud infrastructure, autonomous algorithmic agents,
              legacy system integrations, and payroll calculation engines. Independent software evaluations indicate
              that smaller enterprises face high initial implementation overhead, with professional onboarding and
              customization services running from $1,000 to over $10,000 depending on enterprise scope [CR006]. Workflow
              and payroll customization options remain constrained, and independent testing observes that automated
              workflows occasionally malfunction, requiring manual administrative intervention [CR007]. Integrating
              generative AI ('Hero AI') and autonomous compliance agents directly into employee-facing portals creates
              systemic operational dependencies: inaccurate rule interpretations or automated screening errors can
              propagate across thousands of SME clients simultaneously [CR008]. Rapid corporate scaling—from under 200
              staff prior to 2020 to over 900 distributed employees across 19 countries—strains internal governance,
              customer support response times, and cross-border engineering quality controls [CR009].
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
