        - ARR surpasses A$400M with >30% growth; EBITDA margins reach 15%; successful global AI deployment
        - A$3.2B - A$3.6B (8.0x - 9.0x ARR)
        - Multiple compression in public software comps and execution stalls in UK/Canada expansion
