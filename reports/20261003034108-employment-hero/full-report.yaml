      - number: '5.2'
        title: Cloud Infrastructure Architecture, Modernization, and Deployment Engineering
        blocks:
          - type: paragraph
            body: >-
              The core technology stack of Employment Hero is deployed entirely on Amazon Web Services (AWS)
              infrastructure, having undergone significant structural modernization through the AWS Application
              Modernization Lab (AWS AML) program. Historically constrained by legacy monolithic dependencies across its
              core codebase, Employment Hero decomposed millions of lines of code into six modular application domains,
              prioritizing the computationally intensive Pay Run calculation engine. Modernization transitioned the
              payroll engine into a cross-platform .NET application running in Linux containers orchestrated via Amazon
              Elastic Container Service (Amazon ECS) and powered by serverless AWS Fargate compute. This containerized
              architecture decoupled payroll calculation from web presentation layers, enabling independent horizontal
              auto-scaling, granular fault isolation, and resilient concurrent pay run processing without platform-wide
              resource contention. Furthermore, migrating to cross-platform .NET and managed container orchestration
              yielded a 41 percent reduction in operational and infrastructure licensing costs while accelerating
              continuous delivery pipelines. Internal deployment velocity expanded five-fold, reducing individual
              developer build times by 85 percent and deployment cycle durations by 83 percent, saving an estimated 340
              collective engineering hours per week across the payroll engineering organization. For external systems
              integration and ecosystem extensibility, Employment Hero maintains public REST APIs for core HR data,
              payroll endpoints, and applicant tracking. Partner integrations authenticate through OAuth 2.0
              multi-tenant flows mandating Proof Key for Code Exchange (PKCE) security controls. However, third-party
              data engineering implementations highlight significant operational overhead caused by short-lived
              15-minute access token expirations, which require robust automated refresh token retry mechanisms to
              prevent pipeline failures during large-scale enterprise data warehouse synchronization.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
