  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Core Modules, and Customer Workflow Automation
        blocks:
          - type: paragraph
            body: >-
              Employment Hero is architected as an integrated cloud employment operating system designed to automate
              administrative and compliance workflows across the entire employee lifecycle for small and medium-sized
              enterprises. At its core, the platform addresses four interconnected operational domains: workforce
              management and HR, native payroll processing, talent acquisition via recruitment modules, and employee
              financial services delivered through the Swag consumer mobile application. The human resources module acts
              as the centralized system of record for employee demographic records, compliance documentation, automated
              onboarding workflows, digital contract signing, and self-service leave management. By digitizing leave
              requests and surfacing projected leave balances directly within the mobile and web interfaces, the
              platform eliminates administrative guesswork for operational managers and prevents payroll discrepancies
              before pay runs are scheduled. Integrated time-and-attendance tracking feeds directly into shift rostering
              dashboards that calculate real-time shift labor costs against live sales data, providing small business
              managers with immediate visibility into labor cost percentages and budget thresholds before shifts
              commence. In parallel, talent acquisition capabilities leverage the integrated SmartMatch recruitment
              engine, which analyzes employer job profiles and candidate attributes across the platform's broader
              ecosystem to generate curated candidate pools without requiring external third-party job board listings.
              The Swag employee application serves as an independent mobile surface through which workers manage
              timesheets, review digital payslips, and access value-added financial tools including InstaPay earned wage
              access and marketplace retail discounts. Despite these broad workflow capabilities, third-party functional
              evaluations consistently observe that the platform's user experience is heavily optimized for routine
              administrative processing rather than deep strategic HR analytics or customizable enterprise reporting.
