  - id: TE003
    title: Employment Hero Technology Architecture and Operating Dependencies
    columns:
      - Architectural Layer / Component
      - Technical Role & Implementation
      - Critical External Dependency
      - Operational & Reliability Risk
      - Institutional Diligence Evaluation
    rows:
      - - Containerized Calculation Engine
        - Modernized cross-platform .NET application executing Pay Run computation logic
        - AWS ECS & AWS Fargate serverless compute infrastructure
        - Regional AWS compute availability outages or throttling during peak end-of-month payroll runs
        - High architectural resilience achieved via independent containerized auto-scaling and fault isolation.
      - - External Partner Integration Layer
        - RESTful API gateway exposing HR, ATS, and payroll data endpoints
        - OAuth 2.0 PKCE authentication services and client redirect endpoints
        - Short 15-minute access token lifespan causing sync failures in unmanaged long-running ETL jobs
        - Requires automated token refresh mechanisms and robust retry middleware in client data pipelines.
      - - Generative AI Workflow Tier
        - Hero AI contextual assistance and automated candidate recruitment agents
        - OpenAI hosted GPT large language model API endpoints
        - Vendor service latency, upstream API degradation, and lack of on-premise model control
        - Reliance on closed third-party foundational models limits custom domain fine-tuning and offline execution.
      - - Data Warehouse Ingestion Pipelines
        - Metadata-driven medallion data architecture (Bronze, Silver, Gold layers)
        - Azure Data Factory, Azure Logic Apps, Azure Key Vault, Azure SQL
        - API rate limiting, pagination schema shifts, and breaking endpoint schema updates
        - Demonstrates enterprise viability but requires significant bespoke data engineering investment.
      - - Identity & Access Governance
        - Centralized workforce and customer authentication, role-based access control
        - Enterprise IAM directory integrations and single sign-on (SSO) providers
        - Ongoing recruitment for senior IAM architecture leadership indicates evolving governance maturity
        - Requires verification of enterprise SOC 2 compliance, fine-grained RBAC, and multi-tenant boundary controls.
    notes: >-
      Technical architecture evaluation derived from AWS modernization case study, official developer documentation, and
      verified third-party data engineering implementations.
