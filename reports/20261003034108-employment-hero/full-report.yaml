      - number: '7.3'
        title: Ecosystem Counterparty Dependencies and Financial Model Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Employment Hero relies heavily on external counterparties, foundational platform partners, and capital
              markets to execute its business model. Its superapp Swag offers consumer financial products, digital
              wallets, debit cards, and earned wage access ('InstaPay'), creating regulatory and counterparty
              dependencies on digital payment networks, sponsor financial institutions, and AML/KYC identity
              verification providers [CR010, CR011]. The core software platform depends on third-party cloud hosting
              providers, accounting software APIs (such as Xero, MYOB, and QuickBooks), and developer integration
              surfaces; any upstream API deprecation or platform service disruption halts client payroll synchronization
              [CR012]. The company's expansion has been fueled by over AUD $650 million in venture capital, including
              its AUD $263 million Series F round led by TCV [CR013]. If growth targets stumble or private technology
              valuations compress, sustained international expansion across the UK, Canada, and Southeast Asia could
              face capital availability friction [CR014]. An adverse assessment of these exposures confirms that
              compounding execution risks require continuous independent diligence [CR015].
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
