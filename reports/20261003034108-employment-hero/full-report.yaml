      - number: '6.3'
        title: Retention Durability, Cross-Sell Expansion, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              Customer retention and account durability at Employment Hero are anchored by high structural switching
              costs inherent to integrated payroll engines, Single Touch Payroll (STP) statutory compliance, and digital
              personnel registries. Once an employer configures complex modern awards, historical pay categories, and
              superannuation workflows, migrating to an alternative HRIS entails painful data extraction and operational
              risk. The company expands net revenue per account by upselling subscription tiers from Lite to Plus and
              Unlimited, alongside high-touch add-ons including Managed Payroll, Employer of Record (EOR) services via
              Global Teams across 180 countries, and specialized HR Advisory consulting. However, customer support
              bottlenecks pose ongoing durability challenges: independent software reviewers note that customer support
              is heavily deflected to self-service knowledge base articles and ticketing forms rather than real-time
              phone assistance, causing variable response times. Furthermore, the company does not disclose net revenue
              retention (NRR), gross revenue retention (GRR), annual customer churn percentages, or cohort net dollar
              expansion. While individual customer concentration is low due to the highly fragmented SMB base,
              international expansion into jurisdictions like the UK exposes the platform to stringent statutory
              compliance obligations, including right-to-work enforcement carrying civil penalties of up to £45,000 per
              worker for first breaches and £60,000 for repeat offenses.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Operational Friction in DIY Payroll and Award Implementations
            body: >-
              Independent implementation consultants report that poorly configured Employment Hero setups cost
              Australian SMBs 15 to 20 hours each month troubleshooting payroll errors and deciphering complex settings.
              The platform's automated award interpretation delivers substantial efficiency only when underlying pay
              categories and leave rules are accurately mapped from inception.
            calloutType: risk
            claimRefs:
              - CU005
          - type: callout
            title: The Swag Super-App as an Asymmetric B2B2C Expansion Loop
            body: >-
              By converting 1.4 million downstream employees into Swag super-app users with digital wallets, cashback
              shopping perks, and InstaPay earned wage access, Employment Hero establishes a consumer network effect
              that transcends traditional HR SaaS, enhancing platform retention and unlocking fintech monetization
              streams.
            calloutType: insight
            claimRefs:
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Multi-Jurisdictional Regulatory and Legal Compliance Exposures
        blocks:
          - type: paragraph
            body: >-
              Employment Hero operates across multiple heavily regulated domains including automated payroll tax
              withholdings, statutory pension contributions, immigration compliance, cross-border Employer of Record
              (EOR) employment liabilities, and regional privacy frameworks. Because the platform executes automated tax
              remittances and statutory deductions for hundreds of thousands of small and medium enterprises across
              Australia, the United Kingdom, New Zealand, Singapore, Malaysia, and Canada, any algorithmic
              miscalculation or outdated regulatory rule introduces immediate direct compliance liabilities for client
              employers [CR001, CR002]. In the United Kingdom, statutory duty extensions under the Border Security,
              Asylum and Immigration Act 2025 mandate digital right-to-work checks across employees, contractors, and
              platform workers with civil penalties reaching £45,000 for a first breach and £60,000 for repeat offenses
              [CR003]. Operating as an Employer of Record through Global Teams across 180 countries exposes Employment
              Hero to co-employment obligations, wrongful termination liabilities, and statutory misclassification risks
              where local courts examine economic reality over contractual labels [CR004]. Furthermore, managing
              sensitive payroll, banking, identity, and special-category data under Canada's PIPEDA and Quebec Law 25
              subjects the company to strict data minimization, retention, and access-governance requirements [CR005].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
