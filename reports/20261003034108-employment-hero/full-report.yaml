      - number: '6.2'
        title: Adoption Trajectory, Enterprise Scale, and Implementation Realities
        blocks:
          - type: paragraph
            body: >-
              Employment Hero's commercial reach has expanded rapidly, growing from supporting 3,500 businesses around
              its Series C funding to surpassing 300,000 businesses globally by 2023 and reaching over 350,000
              businesses and 2 million active employee users following its Series F funding. The platform processes an
              estimated AUD 85 billion in gross wages annually, reflecting substantial platform throughput. In the
              United Kingdom, management reported securing 20,000 SME customers and paying 200,000 employees monthly
              within several years of market entry. Product adoption within customer accounts is driven by dual
              interfaces: administrative portals for payroll officers and the consumer-facing Swag mobile application,
              which counts over 1.4 million users accessing payslips, perks, and early wage access. Internally,
              Employment Hero models sophisticated workforce workflows, migrating its own 1,800+ remote employees from
              spreadsheets to Pigment for real-time headcount planning and partnering with Intellect after observing low
              7% utilization on legacy employee assistance programs. However, for external SMB customers, achieving full
              production deployment requires a structured 6 to 8 week implementation covering discovery, award
              configuration, data migration, and validation. Rushing this lifecycle leads to configuration errors and
              administrative friction.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
