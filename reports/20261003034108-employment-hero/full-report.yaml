  - id: TE002
    title: Employment Hero Customer Workflow and Use Case Transformation
    columns:
      - User Job / Operational Task
      - Traditional SMB Manual Workflow
      - Employment Hero Solution
      - Measurable Operational Benefit
      - Technical & Workflow Limitation
    rows:
      - - Employee Onboarding & Compliance
        - Paper-based forms, manual data entry, scattered compliance checklists
        - Self-service mobile onboarding via Swag app with digital document signing
        - Eliminates administrative re-keying and establishes centralized digital employee records
        - Complex multi-jurisdiction entity onboarding requires custom manual configuration.
      - - Payroll Processing & Calculation
        - Manual spreadsheet calculations, external payroll bureaus, manual award checks
        - Automated .NET Pay Run calculation engine running in containerized cloud infrastructure
        - Reduces calculation errors and enables automated tax and pension lodgements
        - Edge-case award interpretations in legacy industrial awards still require manual payroll overrides.
      - - Shift Rostering & Labor Budgeting
        - Fixed scheduling without visibility into daily sales performance
        - Dynamic shift scheduling integrated with real-time sales revenue dashboards
        - Prevents accidental labor budget overruns by matching roster costs to live sales
        - Requires reliable real-time POS revenue feed integration to provide accurate cost ratios.
      - - Leave Management & Accrual Tracking
        - Paper leave slips, manual accrual balance queries to HR staff
        - Self-service leave requests with single-tap projected future balance calculation
        - Removes manual inquiries and eliminates fake leave requests to test future balances
        - Complex unpaid leave rules and discretionary leave policies require administrative intervention.
      - - Job Candidate Sourcing & Communications
        - Paid postings on external job boards, manual rejection and follow-up emails
        - Pre-matched talent pools via SmartMatch and automated candidate response agents
        - Accelerates time-to-hire and ensures prompt communications without recruiter overhead
        - Candidate pool quality is constrained by geographic penetration of the Swag user base.
    notes: >-
      Workflow transformations reflect primary operational use cases reported by verified platform users and official
      product documentation.
