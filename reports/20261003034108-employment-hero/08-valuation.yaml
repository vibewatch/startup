callouts:
  - calloutType: "risk"
    title: "Secondary Liquidity Overhang from SEEK Growth Fund Exit"
    body: "The announcement in February 2026 by SEEK Investments to divest its stake held by SEEK Growth Fund introduces substantial price discovery pressure. Even though SEEK leadership maintained confidence in Employment Hero's long-term outlook, a structured secondary sale of this magnitude can flood private trading markets with discounted paper, depressing the benchmark valuation below the A$2.0B Series F post-money level."
    claimRefs:
      - "CV003"
      - "CV007"
      - "CV012"
  - calloutType: "recommendation"
    title: "Diligence Conditions Precedent for Future Investment"
    body: "Prospective growth equity and secondary investors should withhold binding offers until management provides an audited reconciliation bridging self-reported ARR to statutory audited revenue, granular customer churn data for post-acquisition KeyPay cohorts, and full disclosure of liquidation preferences across Series A through F preferred shares."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV010"
      - "CV011"
