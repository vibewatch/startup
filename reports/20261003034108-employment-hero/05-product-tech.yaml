callouts:
  - calloutType: "insight"
    title: "Pay Run Modernization Blueprint as an Engine for Engineering Agility"
    body: "The decomposition of Employment Hero's core Pay Run module from a monolithic codebase into containerized cross-platform .NET services on AWS ECS and Fargate represents a major technical achievement. Achieving 41% infrastructure and licensing cost optimization alongside an 85% reduction in build times established an architectural blueprint that Employment Hero is extending across its broader software footprint to support rapid global expansion."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
  - calloutType: "risk"
    title: "API Token Lifecycle and Enterprise Data Synchronization Friction"
    body: "While Employment Hero enforces modern OAuth 2.0 with mandatory PKCE security controls across its public integration gateway, its strict 15-minute access token expiration creates material complexity for enterprise customers. Ingesting large employee datasets into external data warehouses requires specialized metadata-driven orchestration frameworks to prevent job failures, exposing mid-market clients to unexpected data integration costs."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE015"
