evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A verified current board roster, committee structure, succession plan, and founder delegation framework.
    whyItMatters: >-
      Founder continuity is visible, but governance resilience and key-person mitigation cannot be assessed without
      current board and succession evidence.
    diligencePath: >-
      Request the board roster, committee charters, board minutes, delegation policy, and executive succession plan
      under NDA.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      The fully diluted cap table, share classes, liquidation preferences, voting rights, debt facilities, and
      secondary-sale history.
    whyItMatters: >-
      Headline financing and valuation do not reveal common-equity economics, control, dilution, or cash currently
      available.
    diligencePath: Obtain the current cap table, financing documents, debt schedule, and secondary transaction records under NDA.
    relatedQuestionRefs:
      - QO004
      - QO010
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: A financing, tender, secondary, or independent valuation after the October 2023 Series F.
    whyItMatters: >-
      The last supportable private mark is historical and may not represent the current value of preferred or common
      equity.
    diligencePath: >-
      Request the latest 409A-equivalent assessment, board valuation materials, financing term sheets, and secondary
      trades.
    relatedQuestionRefs:
      - QO005
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      An audited bridge among ARR, accounting revenue, paid customers, supported businesses, active users, and current
      headcount.
    whyItMatters: >-
      The public metrics use different currencies, periods, and denominators, preventing a reliable operating-scale or
      revenue-quality comparison.
    diligencePath: >-
      Request audited FY2025 and FY2026 financials plus metric definitions, cohort schedules, payroll-only tenants, and
      a current HR roster.
    relatedQuestionRefs:
      - QO006
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing-boundaries
    missingEvidence: >-
      Independent third-party econometric sizing reports disaggregating core SME HRIS subscription spend from
      pass-through payroll processing and EOR gross billing across Australia, New Zealand, and the UK.
    whyItMatters: >-
      Without independent segmented market sizing, company claims of a multi-billion dollar addressable market rely on
      mixing high-margin software ARR with low-margin payroll and wage volume.
    diligencePath: >-
      Request audited customer cohort revenue splits by product line (HR software vs managed payroll vs EOR) and
      commission country-level market share studies from regional analyst firms.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitive-retention
    missingEvidence: >-
      Audited account-level customer retention, logo churn, and competitive win/loss records comparing Employment Hero
      against Rippling and HiBob in the UK market.
    whyItMatters: >-
      Validates whether Employment Hero can defend its customer base as UK SME clients scale into complex mid-market
      multi-country operations.
    diligencePath: >-
      Request confidential commercial sales pipeline reports and UK client cohort retention schedules in management
      diligence sessions.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: eor-unit-economics
    missingEvidence: >-
      Segmented gross margins and take rates on HeroForce / Global Teams EOR contracts versus core SaaS subscription
      software.
    whyItMatters: >-
      Determines whether international EOR expansion dilutes consolidated software gross margins due to foreign entity
      compliance pass-through costs.
    diligencePath: >-
      Request product-line GAAP revenue and cost of delivery breakdowns distinguishing self-service SaaS from managed
      EOR operations.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: financial-gaps
    missingEvidence: Audited financial statements confirming revenue, ARR, gross profit margins, and net revenue retention (NRR) rates.
    whyItMatters: >-
      Institutional underwriting cannot verify enterprise value multiples or software unit economics without GAAP
      revenue and margin metrics.
    diligencePath: Request confidential virtual data room access for audited financial statements and board-approved revenue bridges.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, net monthly cash burn, and forward operating runway projections.
    whyItMatters: >-
      Determines whether the company requires additional dilutive equity financing or debt facilities to sustain
      international expansion.
    diligencePath: Obtain current management accounts, monthly cash flow statements, and banking facility summaries.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and logo churn percentages segmented by
      customer employee size tiers.
    whyItMatters: >-
      Without audited retention data, underwriters cannot verify whether platform growth is driven by durable SMB
      customer cohorts or masked by top-of-funnel acquisition.
    diligencePath: >-
      Request historical cohort retention curves and annual dollar churn schedules in a confidential management data
      room.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Audited revenue contribution of top 10, 20, and 50 customer accounts and partner channel distribution.
    whyItMatters: >-
      Validates whether revenue is genuinely diversified across hundreds of thousands of micro-businesses or
      concentrated within specialized managed payroll and EOR enterprise clients.
    diligencePath: Inspect audited customer concentration tables and top-payer revenue contribution schedules.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-deployments
    missingEvidence: >-
      Comprehensive roster of verified named production customer case studies across UK and Southeast Asian
      jurisdictions.
    whyItMatters: >-
      Public case study evidence remains heavily anchored in Australian market implementations, leaving international
      referenceability partially verified.
    diligencePath: Conduct reference calls with mid-market enterprise customers in the UK and Singapore markets.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-litigation-and-churn
    missingEvidence: >-
      Comprehensive audit records of historical CRA payroll penalties, Fair Work Ombudsman inquiries, UK immigration
      civil penalties, or client churn rates caused by workflow malfunctions.
    whyItMatters: >-
      Without private regulatory compliance audit logs and customer retention cohorts, investors cannot determine
      whether platform calculation errors create material warranty or indemnification liabilities.
    diligencePath: >-
      Request customer contract indemnification terms, EOR litigation reserves, historical payroll remittance error
      rates, and compliance breach logs during confirmatory legal diligence.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
