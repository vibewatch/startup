callouts:
  - calloutType: "risk"
    title: "Structural Pricing and Support Friction at the Mid-Market Threshold"
    body: "While Employment Hero's 10-seat minimum spend floors protect revenue per account among micro-businesses, user feedback and competitor reviews identify escalating operational friction when companies scale beyond 50 employees. Implementation delays extending up to five months, reporting rigidity across multiple business entities, and customer support ticket backlogs indicate that scaling upmarket requires substantial product and operational investment."
    claimRefs:
      - "CI001"
      - "CI007"
      - "CI008"
      - "CI009"
  - calloutType: "recommendation"
    title: "Mandatory Information Requests for Institutional Financial Underwriting"
    body: "Prospective institutional investors and underwriters must not rely on historical fundraising valuations or high-level wage volume metrics. Underwriting requires access to audited FY24-FY26 income statements, customer cohort retention analyses, gross margin breakdowns by product line (SaaS vs. Managed Payroll vs. EOR), and country-level contribution margins for international operations in the UK and Southeast Asia."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI014"
      - "CI016"
