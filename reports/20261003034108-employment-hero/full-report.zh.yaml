    data:
      layers:
        - label: 客户体验与超级 App 层
          detail: 全渠道展示界面，涵盖 Employment Hero Web 门户、移动 HR 工作 App 以及 Swag 员工金融超级 App
          modules:
            - Web 管理门户
            - 移动端 HR 办公 App
            - Swag 金融超级 App（InstaPay 与 Perks）
        - label: 应用逻辑与 AI 智能层
          detail: 核心业务自动化服务，涵盖 SmartMatch 人才匹配、自动化招聘智能体与 Hero AI 对话式工作流
          modules:
            - SmartMatch 候选人匹配引擎
            - Hero AI 上下文助手（集成 OpenAI LLM）
            - 自动化候选人沟通智能体
            - 实时销售额与班次人工预算对照
        - label: 现代化核心计算引擎
          detail: 依托 AWS AML 现代化蓝图与旧代码库解耦，提供高性能模块化薪酬计算
          modules:
            - 跨平台 .NET 发薪计算核心
            - 模块化假期计提与余额预测引擎
            - 数字合同与入职合规引擎
        - label: 云基础设施与容器编排
          detail: 高韧性托管云环境，支持自动扩缩容与故障隔离，成本优化 41%
          modules:
            - Amazon Elastic Container Service (Amazon ECS)
            - AWS Fargate 无服务器计算
            - Linux 应用容器
        - label: 集成网关与安全控制
          detail: 开放 API 网关与鉴权边界，用于连接外部生态并摄入第三方数据
          modules:
            - OAuth 2.0 PKCE 强制鉴权层
            - RESTful 开放端点（HR、ATS、Payroll API）
            - 15 分钟短效 Token 刷新网关
            - 元数据驱动的 Medallion 数据流水线摄入
        - label: 底层数据持久化与存储层
          detail: 多租户云数据库与存储服务，承载关系型记录、审计日志与合规文档
          modules:
            - 员工与发薪关系型数据库
            - 安全文档存储库
            - 跨区域备份与快照基础设施
    approximationNotes: 逻辑技术栈架构整理自已验证的 AWS 现代化架构披露、开发者指南以及公开发布的第三方数据工程蓝图。
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户生命周期与平台扩张旅程图
    type: journey-map
    summary: 直观呈现客户旅程各阶段：从初期评估，到全平台多模块扩张，再到员工接入超级 App。
    data:
      items:
        - label: 需求发现与评估
          stage: 需求发现与评估
          persona: SMB Owner / HR Manager
          touchpoints:
            - 在线软件评测网站（People Managing People、G2）
            - 免费产品演示 Demo
            - 现代劳资裁决（Modern Award）合规需求评估
          sentiment: Cautious
          painPoints: Fragmented tools, manual payroll errors, compliance fears
        - label: 厂商选型与签约
          stage: 厂商选型与签约
          persona: Finance Director / Operations Head
          touchpoints:
            - 分级版本选型（Lite、Plus 与 Unlimited）
            - 托管薪酬（Managed Payroll）与 HR 咨询增购打包
            - 签署 12 个月商业 SaaS 合同
          sentiment: Committed
          painPoints: Strict 10-user minimum spend floors on micro-business plans
        - label: 系统导入与配置
          stage: 系统导入与配置
          persona: Payroll Admin / Certified Implementation Partner
          touchpoints:
            - 自助式帮助中心文档与配置教学视频
            - 劳资裁决规则解读与薪酬类别映射
            - 由合作伙伴主导、为期 6 至 8 周的分阶段配置
          sentiment: Challenged
          painPoints: Data migration complexity and risk of costly payroll setup errors
        - label: 核心业务正式上线
          stage: 核心业务正式上线
          persona: Operational Managers & Payroll Officers
          touchpoints:
            - Single Touch Payroll（STP）发薪核算处理
            - 员工请假与工资单自助门户
            - 排班轮值与数字化考勤打卡
          sentiment: Satisfied
          painPoints: Support response delays on complex edge cases
        - label: 员工超级 App 深度使用
          stage: 员工超级 App 深度使用
          persona: Frontline Employees & Staff
          touchpoints:
            - 安装 Swag 移动 App 获取福利与折扣
            - 使用 InstaPay 预支薪资（EWA）
            - 数字钱包与商业集市消费立减
          sentiment: Enthusiastic
          painPoints: Transaction fees on early wage access withdrawals
        - label: 平台与全球化扩张
          stage: 平台与全球化扩张
          persona: Chief People Officer & Executives
          touchpoints:
            - 通过 Global Teams 名义雇主（EOR）在 180 个国家开展招聘
            - 挂载 SmartMatch AI 自动化招聘模块
            - 跨职能团队人员编制测算
          sentiment: Engaged
          painPoints: Absence of predictive people analytics and custom enterprise APIs
    approximationNotes: 客户旅程各阶段、触点及情绪倾向，参考 Employment Star 与 People Managing People 评测中记录的实施交付周期特征归纳。
    claimRefs:
      - CU001
      - CU005
      - CU008
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图矩阵
    type: matrix
    summary: 直观评估核心运营、监管、合作伙伴及财务风险，按发生概率与残留影响划分。
    data:
      columns:
        - 极低概率
        - 低概率
        - 中低概率
        - 中等概率
        - 中高概率
        - 高概率
      rows:
        - label: 灾难性影响
          values:
            - label: 系统性银行崩溃
              text: 全球支付发生灾难性冻结
              tone: low
            - label: 东道国禁令
              text: 区域业务即刻关停
              tone: low
            - label: 核心安全被破
              text: 全部员工记录遭灾难性泄露
              tone: low
            - label: EOR 共同雇主冻结
              text: 全球仲裁机构下令关停 EOR 实体运营
              tone: medium
            - label: 多国薪酬监管处罚
              text: 复合连带法定罚款超出公司储备金
              tone: high
            - label: 追究刑事责任
              text: 高管因未依法报备合规事项遭到制裁
              tone: critical
        - label: 严重影响
          values:
            - label: 大客户流失
              text: 大型企业级客户解约
              tone: low
            - label: 风投估值倒挂（Down-Round）
              text: 一级市场估值下调导致资本估值承压
              tone: medium
            - label: 加拿大 CRA 税务审计
              text: 联邦与省层面大额补税及利息罚款
              tone: high
            - label: 英国工作权合规罚款
              text: 内政部按每名用工 £60k 处以民事罚款
              tone: critical
            - label: 反洗钱 / KYC 监管处罚
              text: 金融监管机构暂停用户个人钱包业务
              tone: high
            - label: 法定用工性质误判
              text: 大批外包合同工被溯及既往重新认定为正式员工
              tone: critical
        - label: 实质性影响
          values:
            - label: 次要 API 废弃
              text: 次要集成合作伙伴接口规范调整
              tone: low
            - label: 区域劳资纠纷
              text: 个别不当解雇劳资仲裁审理
              tone: medium
            - label: 财务系统同步中断
              text: Xero 或 MYOB 双向同步服务中断
              tone: medium
            - label: 工作流逻辑异常
              text: 自动化入职规则计算失效
              tone: medium
            - label: 交付成本引发客户流失
              text: 前期专业服务费造成小微企业推行阻力
              tone: high
            - label: 远程技术支持积压
              text: 分布式用工导致客户响应效率下降
              tone: medium
        - label: 中度影响
          values:
            - label: 基础功能反馈
              text: 最终用户对界面布局的自定义需求
              tone: low
            - label: 发薪日细微偏差
              text: 公共节假日银行转账处理延迟
              tone: low
            - label: 自助门户登录延迟
              text: 员工门户凭证临时锁定
              tone: low
            - label: 招聘网站职位同步延迟
              text: SmartMatch 职位发布分发延迟
              tone: low
            - label: 报销审批排队
              text: 员工报销发票处理积压
              tone: low
            - label: 例行合规问询
              text: 涉及多个司法管辖区的常规合规材料问询
              tone: low
    approximationNotes: 发生概率与影响等级综合了法定处罚标准、运营复杂度及供应商依赖程度的定性研判。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR006
      - CR007
      - CR010
      - CR015
  - id: FV001
    title: 投资决策与建议逻辑流
    type: flow
    summary: 从业务规模、老股压制到合规风险，层层递进推导至最终投资建议。
    data:
      nodes:
        - id: scale
          label: 据报道的规模：A$300M ARR 与 350k 家中小企业
        - id: growth
          label: 经营表现：营收持续增长 >30%
        - id: catalyst
          label: 流动性催化剂：SEEK Growth Fund 出售持股
        - id: overhang
          label: 估值阻力：单客经济模型未经审计与老股折价
        - id: governance
          label: 资本结构：普通股相对优先股的清算优先权悬顶尚未核实
        - id: recommendation
          label: 立场：估值偏高，建议：继续研究
    approximationNotes: 该流程展示了得出最终投资建议所依赖的定性分析关系。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV011
