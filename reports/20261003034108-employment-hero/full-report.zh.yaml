      - number: '6.2'
        title: 采纳增长轨迹、企业体量与实施现状
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 的商业版图迅速扩张，服务企业数从 Series C 轮时期的 3,500 家，跃升至 2023 年全球突破 300,000 家，并在 Series F 轮融资后超过 350,000
              家企业与 2 million 活跃员工用户。平台每年处理的税前薪酬总额估计达 AUD 85 billion，凸显了巨大的平台吞吐规模。在英国市场，管理层称进入该国数年内便锁定了 20,000
              家中小企业客户，每月为 200,000 名员工代发薪资。产品在客户内部的落地依托双端交互：面向薪酬专员的后台管理门户，以及面向员工端、拥有超 1.4 million 用户查阅工资单、领取福利及预支已得工资的
              Swag 移动端应用。在公司内部，Employment Hero 展现了成熟的劳动力管理实践：将自身 1,800 多名远程员工从电子表格迁移至 Pigment
              开展实时人头规划，并在发现传统员工心理援助计划（EAP）使用率仅 7% 的低迷现状后与 Intellect 展开合作。然而对外部中小企业客户而言，系统完整上线需经历为期 6 至 8
              周的严密实施期，涵盖业务调研、裁定协议配置、数据迁移与核对校验。若盲目压缩这一周期，往往会导致系统配置错误和严重的后续行政内耗。
