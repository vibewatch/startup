      - number: '4.2'
        title: 市场拓展模式、成本结构与经营效益
        blocks:
          - type: paragraph
            body: >-
              公司市场拓展（GTM）模式结合了两条路线：面向小微企业主打线上数字集客获客，面向澳新、英国及东南亚的扩张期中型企业则部署直销团队。商业高管团队包括常驻澳大利亚的专职首席营收官（CRO）以及负责区域扩张的销售副总裁，尤其在英国，公司在伦敦派驻了专门团队。然而，客户反馈及
              Worknice 等平台的独立竞品分析揭示出销售效率与客户交付层面的明显摩擦。多位评价者一致反映，人事与薪酬绑定的复杂交付周期长达五个月，系统管理上手门槛陡峭，且 12
              个月固定商业合同缺乏中途降配弹性。营业成本结构严重偏向人员开支——涵盖分布在 19 个国家的 900 多名远程办公员工、多法域合规本地化开发、客户支持体系及云托管支出。Trustpilot 与 Capterra
              上的用户评价汇总反映出客服响应瓶颈、过度依赖聊天机器人分流以及问题处理拖沓等现象，表明随着平台规模急剧膨胀，客服与运营成本同步承压。更关键的是，非上市状态掩盖了经审计的营业成本（COGS）、云基础设施托管费、获客成本（CAC）及回本周期，真实的销售效率仍无法证实。
