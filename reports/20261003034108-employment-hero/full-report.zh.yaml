  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群细分、买方画像与业务适配度
        blocks:
          - type: paragraph
            body: >-
              Employment Hero
              聚焦中小型企业（SMB），旨在提供一体化平台以整合分散的人事、薪酬、合规及员工日常管理流程。其客户群覆盖澳大利亚、英国、新西兰、新加坡、马来西亚及加拿大等核心市场的一线实体行业与白领办公行业。在建筑、制造及餐饮住宿等一线运营场景中，企业主和运营主管主要将该系统用于行业劳资协议（award）解读、排班调度及移动端工时表追踪。在专业服务机构与成长型科技公司中，人事主管与招聘团队则借助自动入职任务清单、电子签名及员工自助门户来精简行政负担。相反，独立软件评估表明，对于审批层级复杂、面临高度专业化监管合规框架、需要前瞻性组织分析，或主打开发者导向
              API 优先架构的大型多实体集团，Employment Hero 的业务契合度极差。此外，独立实施顾问的记录显示，在缺乏专业指导的情况下，迁移历史员工档案和配置裁定协议规则极为耗时，每月常需花费企业 15 至
              20 个小时进行排错答疑。
            claimRefs:
              - CU001
