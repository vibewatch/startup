              - CO014
      - number: '1.2'
        title: 领导架构与公司治理
        blocks:
          - type: paragraph
            body: >-
              创始人对公司的持续掌控极为明显。独立报道显示 Ben Thompson 为联合创始人兼 CEO；Unify 2026 年 9 月的人物专访称他自 2014 年起一直执掌 CEO 职位。Employment
              Hero 当前官网介绍页将 Dave Tong 列为联合创始人兼首席技术官（CTO）；TechCrunch 在 2023
              年曾称其为首席产品与技术官，头衔虽有微调，但这位创始人的技术掌舵职责始终居于核心。这在用工管理与产品工程领域建立了扎实的创始人与市场契合度（founder-market
              fit），但也放大了关键人依赖：公司的公开战略、融资意图与产品方向几乎全由 Thompson
              一手对外发声。既有证据未披露可靠的最新董事会名单、投资人投票权、专门委员会、继任计划或经核实的股权明细表。因此，仅凭高管在任时间无法推断公司治理的真实水准。
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: 融资历程与资本结构
        blocks:
          - type: paragraph
            body: >-
              经多方独立核实的重大融资事件为 2023 年 10 月 Series F 轮。Employment Hero 官方宣布该轮融资金额为 AUD 263 million，由 TCV 领投；TechCrunch
              报道称融资金额为 AUD 263 million（折合 USD 167 million），对应估值为 AUD 2.13 billion（折合 USD 1.37 billion）。公司与独立媒体亦报道其累计融资超过
              AUD 650 million，参投方包括 Insight Partners、AirTree、Seek 和 OneVentures。这些数据仅代表历史募资金额，不等于账面可用现金，2023
              年估值更无法作为当前估值依据。公开信息并未披露清算优先权、股权稀释比例、老股交易、债权与授信额度，以及创始人持股比例。因此，现有投资人名单仅能拼凑出公开参投方的局部轮廓，谈不上完整的股权结构表或控制权分析。
