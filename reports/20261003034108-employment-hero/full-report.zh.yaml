      - number: '6.3'
        title: 客户留存韧性、交叉销售扩张与采购阻力
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 的客户留存率与账户生命周期，依托于一体化薪酬引擎、一键式薪酬报告（Single Touch
              Payroll，STP）法定合规要求及数字化人事档案所构筑的高昂结构性切换成本。一旦雇主完成了复杂的行业裁定协议（award）、历史算薪类别与退休公积金（superannuation）流程的配置，更换其他
              HRIS 便意味着极其痛苦的数据抽离与业务中断风险。公司通过引导订阅版本由 Lite 升级至 Plus 和 Unlimited，并搭配高客单价增值模块来推高单客净收入，其中包括托管发薪（Managed
              Payroll）、覆盖 180 国的 Global Teams 名义雇主（EOR）服务，以及专属 HR
              咨询。然而，客服响应瓶颈对长期留存构成了持续挑战：独立软件评测人员指出，客服渠道大量通过自助知识库与工单系统分流，缺乏实时电话支持，导致响应速度参差不齐。此外，公司从未公开披露净收入留存率（NRR）、总收入留存率（GRR）、年度客户流失率或群组净金额扩张率。虽然极度分散的中小企业客群使得单一客户集中度极低，但在英国等新市场的扩张让平台直面严苛的法定合规义务，包括涉及工作权利的严格执法——初次违规罚款高达每名员工
              £45,000，再犯更攀升至 £60,000。
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: 图表展示
        blocks:
          - type: callout
            title: 自行配置薪酬与行业裁定协议的实操阻力
            body: >-
              独立交付咨询顾问指出，配置不当的 Employment Hero 系统常导致澳大利亚中小企业每月耗费 15 至 20
              个小时排查算薪错误并研究繁复设置。平台的自动化裁定协议解读只有在初始阶段就精准映射薪资类别与休假规则的前提下，才能真正发挥提效价值。
            calloutType: risk
            claimRefs:
              - CU005
          - type: callout
            title: Swag 超级应用构建非对称 B2B2C 扩张飞轮
            body: >-
              Employment Hero 将 1.4 million 下游员工转化为拥有数字钱包、购物返现特权及 InstaPay 工资预支功能的 Swag 超级应用用户，借此建立起超越传统 HR SaaS 的 C
              端网络效应，在筑牢平台留存护城河的同时，打开了金融科技变现空间。
            calloutType: insight
            claimRefs:
              - CU008
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 多法域监管与法律合规风险敞口
        blocks:
          - type: paragraph
            body: >-
              Employment Hero
              涉足多个受到严格监管的业务领域，包括自动化薪酬代扣代缴、法定养老金缴纳、移民合规审查、跨国名义雇主（EOR）雇佣连带责任及各地区数据隐私框架。由于平台为澳大利亚、英国、新西兰、新加坡、马来西亚和加拿大等国的数十万家中小企业自动执行税费申报和法定扣缴，任何算法计算失误或过期的法规逻辑都会立即为客户雇主招致直接的合规法律责任
              [CR001, CR002]。在英国，2025 年《边境安全、庇护与移民法案》（Border Security, Asylum and Immigration Act
              2025）延展了法定审查义务，强制要求对全职员工、外包承包商及平台用工人员开展数字化工作权利核查，初次违规罚款高达 £45,000，再犯更升至 £60,000 [CR003]。借助覆盖 180 个国家的
              Global Teams 开展 EOR 业务，亦使 Employment Hero 面临共同雇主责任、不当解雇赔偿以及用工身份定性违规的法定风险——当地法院在审理时往往看重实质经济关系而非合同书面定性
              [CR004]。此外，依据加拿大 PIPEDA 法案与魁北克省第 25 号法案（Quebec Law
              25），管理敏感的薪酬、银行账户、身份证明及特殊类别数据，使公司必须遵守极为严苛的数据最小化、存储时限及访问权限治理要求 [CR005]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
