      - number: '1.4'
        title: 规模体量、关键里程碑与风险暴露面
        blocks:
          - type: paragraph
            body: >-
              公司披露的规模指标具备参考价值，但口径并不完全可比。公司最新官网介绍页宣称服务超过 350,000 家企业与 2.5 million 平台活跃用户。公司在 2025 年 2 月通过 Business Wire
              发布的新闻稿宣称，收购 Humi 后其年经常性收入（ARR）超过 CAD 200 million；然而 IBISWorld 抓取的公开页面显示其 2025 年总收入约 190.2
              million，且未标明计价币种。在缺乏审计调节表的情况下，总收入与 ARR 无法直接勾稽。员工规模数据同样存在滞后：公司在 2023 年称拥有 900 多名员工，TechCrunch 则报道其在 19
              个市场拥有约 925 名远程办公人员。历史归档的隐私政策表明，平台可能会处理薪酬、银行账户、政府身份证件及特殊类别敏感数据，并明确声明无法保证绝对安全。这属于业务结构自带的风险敞口，并不等同于已发生数据泄露。
