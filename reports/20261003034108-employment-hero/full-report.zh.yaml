            body: >-
              2026 年 2 月 SEEK Investments 宣布转让 SEEK Growth Fund 所持股份，为公司带来了沉重的价格发现压力。尽管 SEEK 管理层对 Employment Hero
              的长期前景表示乐观，但这种体量的结构化老股转让极易让一级半市场涌入大量折价筹码，进而将估值基准拉低至 Series F 投后 A$2.0B 以下。
