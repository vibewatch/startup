      - number: '5.2'
        title: 云基础设施架构、现代化改造与工程部署
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 的核心技术栈完全部署在 Amazon Web Services（AWS）基础设施上，并通过参与 AWS 应用程序现代化实验室（AWS
              AML）项目完成了重大的结构性技术演进。此前受限于核心代码库中陈旧的单体架构依赖，Employment Hero 将数百万行代码拆解为六个模块化应用域，优先重构了计算密集型的 Pay Run
              薪酬计算引擎。改造后的薪酬引擎转变为跨平台 .NET 应用，运行在通过 Amazon Elastic Container Service（Amazon ECS）编排的 Linux 容器中，并由无服务器 AWS
              Fargate 算力驱动。这种容器化架构将薪酬计算与前端 Web 展示层解耦，实现了独立的水平弹性伸缩、细粒度故障隔离以及高韧性的并发算薪处理，避免了全平台资源争抢。不仅如此，向跨平台 .NET
              和托管容器编排的迁移，使运维与基础设施软件许可成本降低了 41%，同时加速了持续交付流水线。内部部署速度提升至原先的五倍，单次构建耗时降低 85%，部署周期缩短 83%，薪酬工程团队每周累计节省预估 340
              个工时。在外部系统集成与生态扩展上，Employment Hero 针对核心 HR 数据、薪酬接口与招聘流程对外提供开放 REST API。合作伙伴集成通过强制采用代码交换证明密钥（PKCE）安全机制的
              OAuth 2.0 多租户流程进行鉴权。然而，第三方数据工程团队在落地过程中指出，访问令牌仅有 15
              分钟的极短有效期造成了严重的运维负担，必须设计高度健壮的自动刷新令牌重试机制，以防大规模同步至企业数据仓库时数据管道发生故障。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
