      - number: '8.2'
        title: 建议框架、风险评级与入场纪律
        blocks:
          - type: paragraph
            body: >-
              本报告给予 Employment Hero 继续研究建议，置信度中等，风险评级为高，估值立场偏高。最主要的历史估值锚点是 2023 年 10 月由 Technology Crossover Ventures
              领投的 Series F 轮融资：该轮融得 A$263 million，据报道投后估值为 A$2.0 billion 至 A$2.13 billion（约合 US$1.35 billion 至 US$1.45
              billion）。尽管公司随后公布年经常性收入突破 A$300 million、同比收入增速维持在 30% 以上，但公司公告中的 ARR 概括数字无法替代经审计的 GAAP 或 IFRS 总收入调节分析。SEEK
              Growth Fund 当前推进的剥离流程释放出信号：机构成长期资本正寻求变现退出，而非在现有估值水平上追加下注。投资者必须严守入场纪律：若后期的 Series F
              优先股带有清算优先权或优先回报棘轮条款，普通股投资者将承受结构性下行风险。入场应以核实以下要件为前提：股权结构表优先股堆叠披露、各区域运营实体的经审计毛利率，以及由 SEEK 股权转让交易所确立的老股定价基准。
            claimRefs:
              - CV001
