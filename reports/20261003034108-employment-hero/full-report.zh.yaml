      - number: '5.3'
        title: 技术差异化优势、AI 融合与治理风险
        blocks:
          - type: paragraph
            body: >-
              相较于传统独立的 HR 软件，Employment Hero 的技术架构通过两条核心路径构筑差异化优势：一是薪酬引擎与依托 Swag
              超级应用的员工端金融服务实现原生一体化，二是在日常工作流各个触点积极部署生成式人工智能。通过收购 KeyPay 并全面吸收其本土算薪规则引擎，Employment Hero 摆脱了时常困扰中端竞品的脆弱第三方
              API 同步依赖。在这一核心业务底座之上，公司推出了内置生成式助手 Hero AI——该助手接入 OpenAI 大语言模型（LLM），从企业客户规章制度文档与员工档案中提取上下文，自动化处理 HR
              政策问答与文书起草。在招聘领域，平台利用 SmartMatch
              算法自动匹配候选人技能画像与企业开放岗位，并由自动化候选人沟通智能体负责求职确认与进度通知。然而，机构尽调发现该运营模式隐藏着数项实质性技术风险与工程瓶颈。首先，外部软件评测强调，尽管 Employment
              Hero 对外大力宣传 AI 转型，但其原生 AI 智能体就绪度尚未评级（例如缺乏结构化的模型上下文协议（Model Context
              Protocol）或自主智能体执行环境），未能为第三方自主智能体提供标准化的机器对机器接口。其次，生成式 AI 功能严重受制于外部单一供应商，对 OpenAI API 底层设施的强依赖放大了网络延迟波动、API
              调用频次受限以及受监管法域内数据留存规则未经核实的潜在风险。第三，系统集成的稳定性仍是中端客户面临的运维瓶颈：DATA LEAGUE
              等第三方实施咨询机构指出，若要将庞杂的人事薪酬数据同步至现代云数据仓库，必须搭建复杂的中介软件架构，以专门应对分页查询、频次限制与 15
              分钟令牌刷新的挑战。最后，客户身份与企业访问治理面临全平台系统性风险：公司目前仍在公开招募高管以规范员工与客户的身份与访问管理（IAM）治理及架构，表明标准化的企业身份控制体系仍在研发补课阶段。
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: 图表展示
        blocks:
          - type: callout
            title: 薪酬计算模块现代化重构支撑工程敏捷迭代
            body: >-
              Employment Hero 将核心 Pay Run 模块从庞大的单体代码库中剥离，改造为部署在 AWS ECS 与 Fargate 上的容器化跨平台 .NET
              服务，是一项重大技术突破。在基础设施与授权费用削减 41%、构建耗时缩短 85% 的同时，确立了一套清晰的架构蓝图；目前 Employment Hero 正将这一模式推广至全线软件，以支撑全球业务的快速扩张。
            calloutType: insight
            claimRefs:
              - CE006
              - CE007
              - CE008
          - type: callout
            title: API 令牌生命周期与企业数据同步摩擦
            body: >-
              虽然 Employment Hero 在公开集成网关上严格实行采用 PKCE 安全机制的现代 OAuth 2.0 协议，但访问令牌 15
              分钟失效的严苛限制给企业级客户带来了不小的麻烦。向外部数据仓库同步海量员工数据时，必须部署专门由元数据驱动的编排框架以防作业报错中断，这也让中型客户背负了意料之外的数据集成成本。
            calloutType: risk
