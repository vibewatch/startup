  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、核心模块与客户工作流自动化
        blocks:
          - type: paragraph
            body: >-
              Employment Hero
              架构设计为一体化云端用工操作系统，旨在为中小企业实现全员工生命周期中行政与合规流程的自动化。平台底层打通了四大环环相扣的业务领域：劳动力管理与人事、原生薪酬核算、依托招聘模块的人才获取，以及通过 Swag
              移动端应用交付的员工金融服务。人事模块充当员工档案数据的统一底层记录系统，涵盖合规文档、自动化入职流程、电子合同签署及员工自助请假管理。通过将请假申请全面数字化并在移动端与网页端直接展示预期休假余额，系统消除了业务主管的行政猜测，并在正式算薪排期前防范薪酬误差。内置的考勤追踪直接连通排班看板，结合实时销售数据动态测算当班人工成本，使小企业主管在班次开始前即可对人工成本占比和预算红线一目了然。与此同时，人才招聘依托内置的
              SmartMatch 引擎，利用平台生态内沉淀的雇主岗位画像与求职者画像进行智能撮合，无需在外部第三方招聘网站发布即可生成优质候选人名单。Swag
              员工应用则提供独立的移动端入口，员工可在此管理工时表、查看电子工资单，并使用 InstaPay
              预支已得工资及平台零售折扣等增值金融工具。尽管涵盖了如此宽泛的工作流功能，第三方专业评测普遍指出，该平台的用户体验极度侧重日常事务性行政处理，缺乏深度的战略性 HR 人才分析或高度可配置的企业级报表能力。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
