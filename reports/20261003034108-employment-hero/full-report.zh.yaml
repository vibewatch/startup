    rows:
      - - 容器化计算引擎
        - 现代化的跨平台 .NET 应用，负责执行算薪逻辑
        - AWS ECS 与 AWS Fargate 无服务器计算基础设施
        - 月末发薪高峰期面临 AWS 区域计算可用性故障或限流风险
        - 依托独立的容器化自动扩缩容与故障隔离，架构韧性较高。
      - - 外部合作伙伴集成层
        - 开放 HR、ATS 与薪酬数据接口的 RESTful API 网关
        - OAuth 2.0 PKCE 认证服务与客户端重定向端点
        - 访问令牌有效期仅 15 分钟，导致缺乏管理的长时间 ETL 任务同步失败
        - 要求客户端数据管道具备自动令牌刷新机制与高鲁棒性重试中间件。
      - - 生成式 AI 工作流层
        - Hero AI 上下文助手与候选人自动化招聘智能体
        - OpenAI 托管的 GPT 大语言模型 API 端点
        - 供应商服务延迟、上游 API 性能劣化以及缺乏本地模型控制权
        - 依赖封闭的第三方基础模型，限制了特定领域微调与离线运行能力。
      - - 数据仓库摄取管道
        - 元数据驱动的奖牌式（Medallion）数据架构（铜层、银层、金层）
        - Azure Data Factory、Azure Logic Apps、Azure Key Vault 与 Azure SQL 托管服务
        - API 速率限制、分页结构变化以及破坏性端点架构变更
        - 展现出企业级服务能力，但需要投入大量定制化数据工程研发。
      - - 身份与访问治理
        - 集中式员工与客户认证、基于角色的访问控制（RBAC）
        - 企业级 IAM 目录集成与单点登录（SSO）提供商
        - 持续招聘高级 IAM 架构负责人，表明治理成熟度仍在演进
        - 需验证企业级 SOC 2 合规认证、细粒度 RBAC 与多租户隔离边界。
    notes: 技术架构评估源自 AWS 现代化改造案例研究、官方开发者文档以及经核实的第三方数据工程实践。
