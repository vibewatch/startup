      - number: '7.3'
        title: 生态对手方依赖与财务模型脆弱性
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 商业模式运转高度依赖外部对手方、基础平台合作伙伴及资本市场。其超级应用 Swag 涵盖 C
              端金融产品、数字钱包、借记卡及已得工资预支（“InstaPay”），由此对数字支付网络、合作金融机构及反洗钱 / 身份核验（AML/KYC）服务商形成监管与交易对手依赖 [CR010,
              CR011]。核心软件平台则仰赖第三方云托管服务商、会计软件 API（如 Xero、MYOB 及 QuickBooks）以及开发者集成接口；任何上游接口下线或平台服务中断，都会直接阻断客户的薪酬数据同步
              [CR012]。公司的海外扩张由超过 AUD $650 million 的风险资本所支撑，其中包括 TCV 领投的 AUD $263 million Series F 轮融资
              [CR013]。若增长目标不及预期或一级市场科技估值中枢下移，其在英国、加拿大和东南亚的持续扩张可能遭遇资金链吃紧的阻力 [CR014]。对这些风险敞口的审慎评估表明，交织叠加的执行风险需要持续进行独立尽调跟踪
              [CR015]。
            claimRefs:
