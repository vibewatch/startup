  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类界定与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 将自身市场边界界定为一体化用工操作系统（eOS），主要面向员工规模 10 至 500
              人的中小企业（SME）。公司平台基于统一云架构，集成了核心人力资源信息系统（HRIS）、云端自动化薪酬、员工自助服务、行业劳资裁定协议（award）合规及跨国用工管理。             
              这一界定主动锁定了核心人事与薪酬管理的软件订阅支出，同时排除了笨重的定制化企业资源计划（ERP）套件及高成本的本地定制部署。在澳大利亚和新西兰，其可触达支出范围还通过 Swag
              超级应用延伸至员工金融服务与福利整合。当前该领域的主要替代方案仍是脱节的手工电子表格、本土单一功能发薪机构，以及缺乏法规自动同步与移动端实时访问的传统桌面软件。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM011
              - CM012
      - number: '2.2'
        title: 目标市场规模测算、薪资流转体量与中小企业用工基石
        blocks:
          - type: paragraph
            body: >-
              测算 Employment Hero 市场空间，须厘清狭义 HR 软件订阅收入与底层设施撬动的广义社会薪资流水。在目标 OECD 市场中，中小企业贡献了超过 50% 的 GDP 总量，部分经济体更达
              70%，构筑了体量庞大的用工底盘。联合创始人兼 CEO Ben Thompson 曾透露，平台覆盖约 300,000 家中小企业雇主账户，年处理薪资总额约 AUD 85
              billion。公司公布的全球业务规模包含逾 350,000 家企业与超 2.5 million 活跃员工用户，其中英国作为关键增长跳板，已涵盖 20,000 家中小企业和 200,000
              名发薪员工。但审慎的投资尽调必须划清界限：年度薪资发放总额仅能反映平台交易吞吐量，不能与年经常性软件收入（ARR）混为一谈；将纯 SaaS ARR
              与通道型过桥款项剥离的第三方权威计量测算，仍是不可或缺的尽调前提。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
      - number: '2.3'
        title: 买方画像、采购决策机制与定价体系
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 目标客群采购动态因企业员工规模和管理成熟度而差异显著。在员工少于 50
              人的微型与小型企业中，软件采购决策和预算审批直接由总经理、企业主或财务主管掌控，核心诉求是压缩行政冗余。对于员工 50 至 500 人的中型企业，采购决策权则转移至专职的人事运营（People
              Operations）经理和 HR 总监，重点关注合规自动化、入职流程及人才留存。公司在澳大利亚的商业定价设立了入门级 HR Essentials 版本（每位员工每月 $10）和 HR Engage
              版本（每位员工每月 $14），两档均设定了 10 人最低起订门槛。排班和考勤等高级劳动力管理功能需额外支付每位员工每月 $4，而完整的薪酬功能要么打包进顶配 Unlimited
              方案，要么以模块化插件形式单独出售。各标准订阅档位通常需要通过预约演示（demo）联系销售团队，并未完全开放无摩擦的公开自助购买。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM007
              - CM011
              - CM015
      - number: '2.4'
        title: 采纳驱动因素、监管合规压力与落地阻力
        blocks:
          - type: paragraph
            body: >-
              推动平台采纳的核心动力，在于日益严苛的用工监管复杂性以及跨国远程招聘的普及。在英国，《就业权利法案》（Employment Rights
              Act）的重大修订以及最新的工作权利（right-to-work）执法要求加重了雇主法律责任，初次违规的民事罚款即可高达每名员工 £45,000；受访英国企业中有超过 53%
              明确对无意违规表示担忧。同样，澳大利亚复杂的现代行业裁定协议（modern award）解读对算薪差错施加重罚，倒逼中小企业采用自动化合规引擎。与此同时，跨国用工需求拉动了 Employment Hero 覆盖
              80 多个国家的 Global Teams 名义雇主（EOR）服务，起售价为每位员工每月
              $385，依托亚太自营实体与全球合作网络落地。不过，系统采纳亦受到显著迁移摩擦的制约：中小企业用户反映初始配置门槛高、文档不全，薪酬切换过程阻力重重，与轻量级独立排班工具相比，极易拉低短期客户满意度并拖长销售周期。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 双轮驱动变现：软件订阅对决金融与 EOR 资金流
            body: >-
              Employment Hero 实际潜在变现空间已超越传统按人头计费的 HR SaaS 软件费，延伸至薪酬发放流水和全球用工中介服务费。基础 HR 订阅虽然贡献了高确定性的 ARR，但多币种 Global
              Teams EOR 业务（每位员工每月 $385）及 Swag 金融生态，在中型企业跨国经营中攫取了更高份额的整体客户预算（wallet share）。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM011
          - type: callout
            title: 受监管本土发薪环境下的交付摩擦
            body: >-
              制约软件落地最主要的业务瓶颈，仍是本土薪酬合规与行业裁定协议（award）解读。传统薪酬迁移中的系统搭建复杂度与文档缺失带来了显著的流失风险，迫使中小企业买家在一体化平台的便利性与成熟的老牌专精发薪机构之间艰难权衡。
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接竞品、传统巨头与 EOR 挑战者
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 所处竞争格局跨越了多个截然不同的软件与服务品类：面向中小企业的直接一体化人事薪酬套件、大型企业全球薪酬引擎，以及跨国名义雇主（EOR）平台。公司 2014
              年在澳大利亚起步，主打一体化云端人事薪酬平台，随后逐步将版图拓展至新西兰、英国、新加坡和马来西亚。在澳新本土基本盘，Employment Hero 的主要对手是本地老牌薪酬方案与云会计软件生态，包括
              Xero、MYOB 及 QuickBooks。在海外拓展市场中，尤其是其派驻本地团队并斩获 20,000 家中小企业客户的英国市场，该平台既要正面对抗 Rippling、HiBob 等全球化 HR
              平台，也要迎战专注全球薪酬的垂直服务商。不仅如此，借助 Global Teams 和 HeroForce EOR 业务，Employment Hero 还与 Velocity Global、Deel、Remote
              等专业跨国用工平台正面交锋——这类平台帮助企业免去在海外设立分支机构的繁琐流程即可雇佣跨国员工。专业服务商通常突出其跨国自营实体覆盖或大客户定制集成能力，而 Employment Hero
              则靠中小企业原生薪酬与员工端金融服务捆绑形成差异化防线。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
              - CP009
      - number: '3.2'
        title: 功能实力、地域覆盖与打包策略对比
        blocks:
          - type: paragraph
            body: >-
              竞争差异化关键分水岭，在于自营薪酬算薪覆盖的地理广度，还是外包法定用工的基础设施。直接对标评测数据显示，专业全球薪酬平台的跨国直接发薪覆盖范围远比 Employment Hero
              的自研薪酬引擎更为广泛。例如，One Global Payroll 支持在 163 个国家直接执行薪酬发放，支持 27 种发放币种及周薪、月薪、双周薪、半月薪等多种发薪周期；而 Employment Hero
              的直接算薪能力仅覆盖 12 个核心市场、6 种发放币种，并默认采用双周结算。然而，One Global Payroll 等垂直发薪商并不提供名义雇主服务。相反，Employment Hero 通过
              HeroForce 和 Global Teams 产品，将原生薪酬与 EOR 底层网络打包，覆盖超过 180 个国家，客户无需在当地设立法人实体。Spotsaas 发布的竞品分析指出，Velocity
              Global 等面向大中型企业的 EOR 巨头虽支持在 185 多个国家合规雇佣并实行定制报价，但 Employment Hero 针对成长型团队推出了每位员工每月 $19 起的入门定价及自助试用功能。
            claimRefs:
              - CP006
              - CP007
