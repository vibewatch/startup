      - number: '8.3'
        title: 情景分析、下行触发因素与退出就绪度
        blocks:
          - type: paragraph
            body: >-
              跨宏观周期评估 Employment Hero，需审慎推演三种经营情景。乐观情景下，Employment Hero 顺利落地智能体 AI 路线图，国际业务增速维持在 30%
              以上，英国与加拿大市场的毛利率持续走阔，并成功消化 SEEK Growth Fund 的老股出售，最终迈向 IPO 或高倍数战略收购，企业价值超过 A$3.0
              billion。基准情景下，核心的澳大利亚中小企业市场渐趋饱和，加之区域薪酬与 HCM 厂商竞争阻击，收入增速回落至 15% 至 20%，导致平价轮融资或倍数小幅收缩，公允价值估计为 A$1.8 billion
              至 A$2.2 billion（约合 6.0x 至 7.0x ARR）。悲观情景下，跨境合规开支激增，英国就业监管变动推高运营负债，SEEK 减持带来负面信号，迫使公司以低于 A$1.3 billion
              的估值进行低价轮融资或结构化重组。主要下行触发因素包括：核心澳大利亚会计渠道出现未对冲的客户流失、脱离外部股权融资无法实现造血现金流，以及员工股权长期面临老股折价抛售压力。
