  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与核心反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Employment Hero
              定位为一体化就业操作系统，服务澳大利亚、英国、新西兰和东南亚的中小企业，展现出颇具吸引力的投资逻辑。核心乐观逻辑在于其关键业务软件整合了人力资源、薪酬、合规与员工福利；系统一旦嵌入小企业运营，便会筑起极高的切换壁垒。此外，公司借助
              Swag 超级应用与嵌入式金融产品扩大了可获取价值空间，每年处理超过 $120 billion 薪酬发放，在全球支持超过 350,000 家企业。然而，反向逻辑表明，要支撑当下的私募股权估值面临严重制约。2026
              年 2 月，基石投资方 SEEK Investments 宣布启动剥离流程，出售 SEEK Growth Fund
              长期持有的公司股份，带来显著的老股交易悬顶压力，并可能引发主要股东诉求分歧。同时，快速跨境扩张进入监管与法律合规更严苛的司法辖区（如英国工作权审查执法），造成了实质性的运营与执行阻力。在缺乏经审计财务报表详细披露获客成本、毛利率持续性与分群净留存率的情况下，按照目前的非公开估值倍数，该商业模式承受着未对冲的运营风险。
