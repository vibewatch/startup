            body: >-
              Employment Hero 同时推进全球名义雇主（EOR）服务（覆盖 180 个国家的 Global Teams）与 C 端金融科技基础设施（Swag 钱包、借记卡及 InstaPay 工资预支），相比纯
              B2B SaaS HR 软件，大幅放大了法律、监管和交易对手风险。充当名义雇主使公司面临共同雇佣责任主张与劳动仲裁争议；提供金融服务则带来对银行伙伴的依赖以及严格的 AML/KYC 监管执法风险。
