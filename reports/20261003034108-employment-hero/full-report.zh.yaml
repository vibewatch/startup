  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价架构与商业化变现路径
        blocks:
          - type: paragraph
            body: >-
              Employment Hero
              采用多支柱变现架构，以核心软件订阅为主干，辅以梯度增值服务与嵌入式员工金融服务。其收入模式的基石是按每位员工每月（PEPM）计费的人事与薪酬管理软件订阅。澳大利亚市场公开定价显示，核心版本如 HR
              Essentials 定价为 $10 PEPM，HR Engage 为 $14 PEPM，两档均严格执行 10 人月度最低消费底线，对微型企业构成了结构性定价门槛。包括 HR Elite 和 Employment
              Unlimited 在内的高阶版本则采用定制化企业协议报价。在核心 HR 软件之外，公司叠加了高毛利的增值订阅服务，包括托管代发薪（Managed Payroll，每位员工每月 $20 起，最低消费门槛
              $400）、专项 HR 咨询及专属交付实施包。尤为关键的是，平台通过 Swag 移动端应用将商业化版图拓展至交易型金融科技与平台撮合领域。Swag 充当员工金融超级应用，不仅通过 InstaPay
              提供已得工资预支服务——允许员工在法定发薪日前以固定手续费预支最多 50% 的已赚薪资——还通过商家返利佣金、商业折扣以及 SmartMatch
              等内置求职招聘工具获利。尽管管理层大力描绘人才与资金流融合的愿景，但官方披露的定价仅反映公开目录价，并未公开中型客户实际净每用户平均收入（ARPU）或合同折扣力度。
