      - number: '3.3'
        title: 切换成本、渠道分发与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 结构性防御壁垒，依赖核心薪酬流程自带的客户切换摩擦、与总账会计系统的深度绑定，以及通过 Swag
              超级应用沉淀的员工粘性。迁移一套正在运行的薪酬系统会带来沉重的管理负担、历史数据迁移复杂性以及合规风险，在英国这类严苛监管环境中尤为突出——当地针对初次工作权利违规的法定罚款高达每名员工
              £45,000。Employment Hero 通过与 Xero、QuickBooks 及 MYOB AccountRight 等系统原生同步财务数据，深化了客户锁定效应；而 One Global Payroll
              等竞品则主要对接 Workday、BambooHR 及 HiBob 等企业级 HRIS 平台。此外，Employment Hero 试图借助 Swag 移动端应用构筑 C 端网络效应护城河：平台为超过 1.4
              million 活跃用户提供通过 InstaPay 支取已得工资、商业零售折扣以及基于 AI 的 SmartMatch
              职位匹配。尽管具备这些粘性抓手，公司仍面临被替换风险：急速跨国扩张暴露了自营薪酬覆盖国家的短板，而成长型跨国企业在规模壮大后，往往会抛弃中小企业平台，转投专业全球发薪机构或企业级 EOR 解决方案。
            claimRefs:
