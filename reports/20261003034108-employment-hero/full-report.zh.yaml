            body: >-
              Employment Hero 在完成由成长型股权投资机构 TCV 领投、Insight Partners、AirTree Ventures、Seek 和 OneVentures 跟投的 AUD 263
              million（折合 USD 167 million）Series F 轮融资后，投后估值达到 AUD 2.13 billion（折合 USD 1.37 billion）。公司累计融资金额突破 AUD 650
              million（折合 USD 411 million），为其在英国及东南亚的国际扩张、AI 研发投入以及全球名义雇主基础设施建设提供了充裕的流动性。从运营规模来看，350,000 多家企业与超 2 million
              平台用户年处理预估 AUD 85 billion 薪酬流水。尽管表面规模指标亮眼，公司仍是一家未经审计的非上市实体，存在重大投资评估盲区。公司从未公开披露账面现金、月度烧钱速度、现金跑道、毛利率水平或各国细分
              EBITDA 盈利情况。在英国等海外市场展业，还让平台背负了严苛的监管合规成本——例如针对首次违规处以每名员工最高 £45,000
              民事罚款的强制性工作权利核查，这直接推高了合规维系开支。站在机构尽调视角，该业务在中小企业薪酬领域具备深厚的市场根基与产品粘性，但严重缺乏经审计的财务透明度，难以支撑其数十亿美元估值下的普通股回报预期。
