chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与经营范围
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 成立于 2014 年，总部位于悉尼，是一家未上市的用工软件企业。IBISWorld 记录显示，其运营实体 Employment Hero Holdings Pty Ltd 于
              2016 年 2 月 29 日在澳大利亚注册成立；公司公开材料则将产品定位为贯穿 HR、薪酬、招聘、福利、员工端服务及名义雇主（EOR）工作流的综合平台。这种业务广度不可忽视，说明它绝非单一薪酬代发机构或 HR
              工具：其隐私披露覆盖雇主端行政、招聘岗位、金融功能、交付实施与 Global Teams
              跨国用工。公司自述在澳大利亚、新西兰、马来西亚、新加坡和英国设有五个线下枢纽。现有证据足以证实其多产品、规模化的业务版图，但未能给出完整的法人实体架构或各国最新收入分布。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO007
