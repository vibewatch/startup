callouts:
  - calloutType: "insight"
    title: "Dual-Engine Monetization: Software Subscriptions vs. Financial & EOR Flow"
    body: "Employment Hero's economic addressable market extends beyond standard per-employee HR SaaS fees into wage disbursement flow and global employment intermediary fees. While basic HR subscriptions yield predictable ARR, the multi-currency Global Teams EOR offering ($385/employee/month) and Swag financial ecosystem capture substantially higher gross wallet share across mid-market cross-border operations."
    claimRefs:
      - "CM001"
      - "CM003"
      - "CM011"
  - calloutType: "risk"
    title: "Implementation Friction in Regulated Local Payroll Environments"
    body: "The primary operational bottleneck governing software adoption remains localized payroll compliance and award interpretation. Setup complexity and documentation challenges in legacy payroll migration create substantial churn risk, forcing SMB buyers to weigh integrated platform convenience against established, dedicated single-function payroll processors."
    claimRefs:
      - "CM008"
      - "CM010"
      - "CM013"
