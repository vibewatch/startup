callouts:
  - calloutType: "insight"
    title: "The Trade-off Between Native Payroll Depth and EOR Reach"
    body: "Multi-country employers face a fundamental structural choice: deploying dedicated global payroll engines like One Global Payroll (163 countries) versus unified EOR operating systems like Employment Hero. While Employment Hero supports direct payroll in only 12 countries, its HeroForce EOR infrastructure bridges the gap across 180+ countries, shielding growing SMEs from complex foreign entity setup and local statutory liability."
    claimRefs:
      - "CP006"
      - "CP007"
      - "CP010"
  - calloutType: "risk"
    title: "Displacement Pressure from Enterprise Workforce Platforms"
    body: "As small business customers expand headcounts internationally, Employment Hero faces risk of displacement from well-capitalized enterprise platforms like Rippling (valued at $11.25B) and Velocity Global. While Employment Hero's $19 PEPM entry pricing and Swag consumer perks appeal to early-stage businesses, enterprise competitors possess deeper multi-entity consolidations, wider ERP integrations, and broader in-country legal operations."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP008"
      - "CP012"
