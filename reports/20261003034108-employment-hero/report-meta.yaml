companyProfile:
  summary: >-
    Employment Hero is a Sydney-based private employment operating system for small and mid-sized businesses. The
    platform combines HR, payroll, recruitment, benefits, employee-financial services, and employer-of-record workflows
    into a single product surface, and its disclosed scale now spans hundreds of thousands of businesses and millions of
    employee users. The company remains founder-led, but public disclosure still falls short of a current valuation
    bridge, audited operating economics, or a complete cap table.
