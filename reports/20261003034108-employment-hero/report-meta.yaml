  topStrengths:
    - Broad, integrated SMB employment platform spanning HR, payroll, compliance, benefits, and EOR.
    - Founder-led execution with visible product continuity and repeated scale milestones.
    - Large disclosed customer base and employee-user footprint provide strong distribution evidence.
  topRisks:
    - Current valuation, cap-table economics, and liquidity preferences remain undisclosed.
    - Audited revenue, margin, retention, and runway data are still missing.
    - Regulatory and implementation complexity rise as the platform expands across jurisdictions.
  unresolvedGaps:
    - Cap-table preferences, liquidation terms, and the true common-equity economics of the current mark.
    - Audited revenue bridge from historical ARR claims to current statutory revenue.
    - Gross margin, free-cash-flow, retention, churn, and module-attach data by product family.
    - Cash on hand, burn, runway, and country-level profitability, especially for Canada and EOR.
    - Canonical current headcount and registry-backed legal-entity evidence.
