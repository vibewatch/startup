      - number: '5.2'
        title: 会员流程、护理导航与易用性
        blocks:
          - type: paragraph
            body: >-
              会员体验从数字化入组和参保流程开始，设计目标是推动会员及时完成强制性预防筛查。入组后，会员可进入 Curative 数字门户和移动应用，预约 Baseline
              Visit、选择初级保健医生并查看保障详情。在标准雇主医保中，员工常因不确定免赔额、自付额上限和意外医疗账单，而推迟重要的常规检查和诊断筛查。Curative 的模式通过保证承保服务 $0
              成本分摊，消除了这种财务不确定性；同时，广泛的药品目录以 $0 共付额提供一级首选药，覆盖约 97% 的标准临床病种。对于非首选药品，会员在参与网络内药房支付可预测的固定共付额 $50 或
              $250。为了衡量和优化会员在入组与预约门户中的数字互动，Curative 接入了 Mouseflow 的 HIPAA 合规行为分析平台，跟踪注意力热图、滚动深度和导航瓶颈，以推动门户参与度和转化率的可量化改善。
