      - number: '7.2'
        title: 运营模式与执行风险敞口
        blocks:
          - type: paragraph
            body: >-
              Curative 的会员价值主张取决于参保、网络准入、药房、导航和预防参与度等环节的执行。官网把 $0 网络内共付额和免赔额设为 Baseline Visit 的条件，推广获批医疗服务商和 Cash
              Card，并把最广泛的药品成本承诺限制在首选处方药；非首选处方药有明确共付额。这些限定产生的是可量化的执行问题，而不是逆向选择或过度使用的证据。相关监测项包括 Baseline Visit
              完成率、网络充足性、药品目录例外、投诉、赔付处理时长和队列医疗成本。指定证据中没有出现任何一组结果序列。报告中的 HITRUST r2
              认证是缓解信号，但在没有评估报告、范围、例外事项和续期日期前，不应将其视为没有数据泄露或控制缺陷的证明。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR013
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR013
              - CR016
      - number: '7.3'
        title: 依赖、融资与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              公开记录显示 Curative 通过 Employee Navigator 出现在一个福利市场，但没有量化渠道份额，也无法证明 Employee Navigator 是 Curative
              的主要分销商。同样，公开产品文案要求使用获批或网络内医疗服务商和药房，却没有说明交易对手集中度或业务连续性保护。融资证据也有边界：311 Institute 根据 Form D 文件报告至少 $152.5
              million，并警告这只是最低值；Tracxn 则报告三轮融资共 $162
              million。融资额不等于可用现金、法定盈余或现金跑道。因此，如果直接尽调发现风险资本不足、队列医疗成本持续不经济、重大许可证缺陷、Baseline Visit
              完成率低，或依赖没有经过测试的替代路径的交易对手，投资论点就应失效。
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
