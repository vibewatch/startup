        - id: emp-sales
          label: 雇主签约
          detail: 1,200 个雇主团体在德州、佛罗里达州和佐治亚州签约员工健康保险覆盖
        - id: pepm-inflow
          label: 保费收取
          detail: 固定的月度 PEPM 保费流入推动预计 2026 年 5.7 亿美元收入
        - id: member-onboarding
          label: 会员基线就诊
          detail: 98% 的会员在 120 天内完成预防性检查
        - id: zero-cost-benefit
          label: 0 美元免赔额医疗服务获取
          detail: 常规和慢性病医疗服务以 0 美元共付额和 0 美元免赔额提供
        - id: claims-adjudication
          label: 理赔与医疗服务交付
          detail: 预防性管理旨在减少高成本灾难性保险赔付
        - id: underwriting-margin
          label: 净承保利润率
          detail: 扣除医疗保险赔付和自动化行政成本后的剩余经营利润率
      edges:
        - from: emp-sales
          to: pepm-inflow
          label: 按月计费
        - from: emp-sales
          to: member-onboarding
          label: 登记员工
        - from: member-onboarding
          to: zero-cost-benefit
          label: 98% 完成资格确认
        - from: zero-cost-benefit
          to: claims-adjudication
          label: 使用网络内医疗服务
        - from: pepm-inflow
          to: underwriting-margin
          label: 保费总收入
        - from: claims-adjudication
          to: underwriting-margin
          label: 减：医疗费用
    approximationNotes: 流程代表 Curative 的商业运营结构；量化赔付率和人均医疗费用分配反映前瞻性预测，而非经审计的申报文件。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Curative 雇主健康计划平台及数据基础设施的六层架构模型。
    data:
      layers:
        - label: 会员参与与数字体验
          notes:
            - Curative web portal, responsive enrollment flows, and mobile access
            - HIPAA-compliant behavioral analytics and user journey optimization via Mouseflow
          modules:
            - - Plan Selection
              - Member Dashboard
              - Care Navigator Chat
        - label: 预防性护理与基线导航
          notes:
            - Annual Baseline Visit scheduling and individual health goal tracking
            - Care Navigator assignment facilitating trusted doctor relationships
          modules:
            - - Baseline Visit Engine
              - Care Navigator Workflow
              - Prevention Plan Tracker
        - label: 医疗服务提供者网络与药房清算平台
          notes:
            - Network connectivity spanning over 1 million contracted healthcare providers
            - Tier-1 drug formulary integration covering 97% of standard conditions
          modules:
            - - Provider Directory
              - Tier-1 Formulary Gateway
              - Instant Provider Payment Gateway
        - label: 支付与自付费用获取层
          notes:
            - Curative Cash Card point-of-sale pre-funding for urgent care and therapy
            - Zero-dollar in-network copay and deductible validation rules engine
          modules:
            - - Cash Card Processor
              - $0 Benefit Validator
              - POS Transaction Router
        - label: 保险核心与承保运营
          notes:
            - Licensed health insurance carrier operations with AM Best A- (Excellent) rating
            - Actuarial reserve management, reinsurance, and state statutory compliance
          modules:
            - - Claims Adjudication
              - Statutory Reserve Accounting
              - AM Best Compliance Tracker
        - label: 数据基础设施与 AI 分析
          notes:
            - Cloud data warehouse (AWS/Azure/GCP), Python data pipelines, and SQL models
            - AI-driven revenue cycle management (RCM) and clinical decision support pipelines
          modules:
            - - Data Lake & Warehouse
              - RCM Automation Pipeline
              - HIPAA Data Governance
    approximationNotes: 层级关系和组件映射综合自 Curative 会员披露、技术列表和数据工程规格。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE007
      - CE011
      - CE013
  - id: FU001
    title: 雇主健康计划客户旅程与扩张循环
    type: journey-map
    summary: 公开旅程从经纪人协助选择延伸至年度福利维护和续保，但量化的转化和留存指标不可得。
    data:
      items:
        - label: 经纪人发现
          detail: 福利顾问向符合条件的雇主团体介绍 Curative。
          touchpoints:
            - 经纪人销售页面
            - Curative 专家联系方式
        - label: 雇主选择
          detail: 雇主选择全额保险或水平融资计划设计。
          touchpoints:
            - 资格审查
            - 计划比较
        - label: 会员登记
          detail: 员工成为享有全国网络内服务的承保会员。
          touchpoints:
            - 登记
            - 会员资料
        - label: 基线就诊
          detail: 会员在计划年度开始后的 120 天内完成规定就诊。
          touchpoints:
            - 综合健康就诊
            - 医疗护理导航
        - label: 持续护理
          detail: 会员使用网络内医疗服务并获得全天候会员支持。
          touchpoints:
            - 医疗服务提供者获取
            - 支持服务
        - label: 续保与扩张
          detail: 雇主和经纪人在缺乏公开结果数据的情况下评估续保或新增投放。
          touchpoints:
            - 续保讨论
            - 经纪人交叉销售
    approximationNotes: 这是根据公司当前页面推断出的定性序列；任何阶段均没有可用的转化率、平均持续时间或群组留存价值。
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU015
  - id: FR001
    title: 风险证据热力图
    type: matrix
    summary: 潜在影响和缓解证据的定性图示，对未经支持的可能性不作量化。
    data:
      columns:
        - 可能性证据
        - 潜在影响
        - 缓解证据
        - 剩余证据缺口
      rows:
        - label: 法定资本和准备金
          values:
            - 未公开
            - 若不足则打破投资论点
            - 公司公示 A- 评级
            - 缺乏直接评级和法定文件
        - label: 医疗成本模型
          values:
            - 未公开
            - 若持续不具经济性则打破投资论点
            - 已描述基线就诊和导航
            - 没有经审计的 MLR 或群组结果
        - label: 州许可
          values:
            - 已描述业务版图；未列举许可证
            - 若不足则具有重大影响
            - 已报告多州业务存在
            - 缺乏实体与州的映射
        - label: 网络和药品目录交付
          values:
            - 未公开
            - 若可及性缺口广泛则具有重大影响
            - 已批准服务提供者和分层药品机制
            - 缺乏充分性和例外数据
        - label: 信息安全
          values:
            - 当前事件可能性未知
            - 可能具有重大影响
            - 已报告 HITRUST r2
            - 缺乏范围、例外和事件信息
        - label: 历史诊断业务负债
          values:
            - 历史事件已验证；当前风险敞口未知
            - 除非负债在转型后仍然存在，否则影响较低
            - 原始检测方法已替换
            - 缺乏法律和合同结项证据
    approximationNotes: 不代表任何数值概率或严重性评分；标签区分经验证的历史事实、公开的缓解声明和不可获得的尽调证据。
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR016
  - id: FV001
    title: 建议与承保决策逻辑
    type: flow
    summary: 将会员规模、雇主需求和财务不透明度映射至跟踪立场的连续决策路径。
    data:
      nodes:
        - id: step-1
          label: 预防性健康模型
          description: 以基线就诊为条件的零成本计划推动早期干预和据称的会员参与。
        - id: step-2
          label: 商业牵引力
          description: 165,000 名会员和 1,200 家雇主客户已在初始区域市场建立。
        - id: step-3
          label: 承保与资本负担
          description: 州级法定准备金要求和医疗赔付率仍未通过公开申报文件核实。
        - id: step-4
          label: 流动性与价格核验
          description: 私人平台上的二级市场流动性有限，且没有撮合价格。
        - id: step-5
          label: 估值评估
          description: 在缺乏经审计单位经济数据的情况下，B 轮投后 12.75 亿美元估值代表偏高溢价。
        - id: step-6
          label: 投资建议
          description: 在法定披露以及续保利润率审计核验完成前，给予跟踪建议。
        - id: step-7
          label: 否决标准与触发因素
          description: 若法定 MLR 超过可持续阈值或 AM Best 评级下降，则下调评级或终止覆盖。
      edges:
        - from: step-1
          to: step-2
        - from: step-2
          to: step-3
        - from: step-3
          to: step-4
        - from: step-4
          to: step-5
        - from: step-5
          to: step-6
        - from: step-6
          to: step-7
    approximationNotes: 代表从临床模型验证到资本结构门槛审查的分析综合序列。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV012
