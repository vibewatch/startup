            body: >-
              Curative 的零成本分摊模式虽然提供了强力的营销切口，却也带来需要严格尽调的重大运营和技术依赖。第一，120 天 Baseline Visit
              门槛高度依赖自动通知系统、医疗服务商日历同步和会员合规跟踪；若无法记录就诊完成情况，可能造成会员摩擦或计费争议。第二，Curative Cash Card
              要无缝免除自付额，就必须以低延迟在授权医疗服务商名录中验证现场刷卡交易。第三，尽管 Curative 管理复杂的保险理赔裁定和数字健康流程，公司几乎没有公开开发者界面、开源代码库或经外部审计的 API
              规范。最后，Austin 的 Curative Health Insurance Company 与 Bellevue 的 Curative AI, Inc.
              之间的关系需要验证，以确认健康计划受保护健康信息是否按照 HIPAA 指引，与商业 RCM 算法模型严格隔离。
