      - number: '4.4'
        title: 资本充足性、资产负债表准备金与财务尽调结论
        blocks:
          - type: paragraph
            body: >-
              Curative 为支持受监管的保险业务积累了可观的财务支持；根据 Form D 文件和融资记录，公司累计风险资本至少达到 $152.5 million 至 $162 million。公司 2025
              年末最新一轮股权融资筹得超过 $150 million 的 Series B 资本，估算投后估值为 $1.28 billion，由 Upside Vision Fund 领投，DCVC
              等机构投资者参与。此外，Curative 连续三年维持 AM Best A-（优秀）财务实力评级，表明其为法定保险赔付义务准备了足够的风险调整后资产负债表资本和流动性。从投资尽调角度看，Curative
              展现出令人印象深刻的会员规模、充足的资本和创新运营自动化。但在潜在投资者检查经审计的法定赔付率、州级准备金缓冲和多年雇主续保留存队列，确认零免赔额福利能带来可持续承保利润前，承保审批必须继续设门槛。
            claimRefs:
              - CI012
              - CI013
              - CI014
