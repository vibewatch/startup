figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Curative 从 COVID-19 检测基础设施发展为全服务雇主健康计划保险公司的历程。
    approximationNotes: 里程碑日期反映公开公告、媒体报道和监管评级确认。
    claimRefs:
      - CO002
      - CO005
      - CO006
      - CO007
      - CO010
      - CO011
      - CO014
    data:
      items:
        - date: 2020-01
          label: 公司成立与诊断业务启动
          detail: 由 Fred Turner 和 Isaac Turner 于 2020 年创立；推出快速自采样 COVID-19 检测网络。
          tone: neutral
        - date: 2021-09
          label: A 轮融资
          detail: 获得初始机构风险融资，Refactor Capital 和银团合作伙伴参与其中。
          tone: positive
        - date: 2022-12
          label: 健康保险战略转型
          detail: 宣布战略扩展至雇主资助的健康保险，并围绕零共付额设计。
          tone: neutral
        - date: 2023-01
          label: 商业健康计划启动
          detail: 正式在德州推出雇主健康保险覆盖，并设置基线就诊要求。
          tone: positive
        - date: 2024-03
          label: AM Best 财务实力确认
          detail: 维持 AM Best A-（优秀）财务实力评级，显示资本充足。
          tone: positive
        - date: 2025-07
          label: 第三年 AM Best 评级与卡片推出
          detail: 连续第三次获得 AM Best A- 确认；推出 Curative Cash Card 以实现会员无缝获取服务。
          tone: positive
        - date: 2025-10
          label: B 轮独角兽融资
          detail: 完成超过 1.5 亿美元的 B 轮融资，投后估值 12.8 亿美元，以扩大全国雇主覆盖。
          tone: positive
        - date: 2026-03
          label: 四年期 AM Best 基准再次确认
          detail: AM Best 连续四年重申 A- 评级，验证资产负债表的持续稳定性。
          tone: positive
