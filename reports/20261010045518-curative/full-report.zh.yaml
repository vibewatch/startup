              - CM013
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有来源支持的是运营代理指标，而非传统市场规模测算。第三方资料称 Curative 服务总部位于佐治亚州、佛罗里达州和德州的雇主，并计划将网络准入扩展至全国；公司发布的另一份公告则称，计划自 2023
              年推出后已扩展到多个州的雇主。Revelio Labs 估算 Curative 在 2026 年 3 月约有 1,100 名员工，其中 97.7%
              位于北美；这或许能反映交付能力，但既不是参保人数，也不是收入。Curative 还报告 EPO/PPO 药房网络覆盖 30,000+ 个地点、PPO Max 覆盖 60,000+
              个地点，但药房准入不是承保人数分母。因此，数字化 TAM、SAM 和 SOM 仍是缺口，而非可用于投资的结论。
