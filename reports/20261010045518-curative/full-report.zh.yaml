        blocks:
          - type: paragraph
            body: >-
              Curative 的底层运营基础设施，把传统持牌健康维护组织承保方运营与现代云数据系统结合起来。公司连续三年获得 AM Best
              A-（优秀）财务实力评级，验证了其在德州、佛罗里达州和佐治亚州初始商业市场的资本充足性、资产负债表实力和风险管理能力。在技术上，Curative 依靠云数据存储、Redis
              缓存和持续集成流水线，支持门户及医疗服务商验证流程。与 Austin 的医保计划运营并行，招聘披露和技术候选人评估显示，Curative 还在华盛顿州 Bellevue 设立了关联实体 Curative AI,
              Inc.。该团队专注于收入周期管理（RCM）和临床决策支持的人工智能软件即服务应用。Bellevue 工程团队用 Python、SQL 和公有云基础设施（AWS、Azure 和
              GCP）构建可扩展数据管道，以简化医疗文档并加速保险理赔裁定，并报告已签署合同，预计 2025 年收入超过 $30 million。
