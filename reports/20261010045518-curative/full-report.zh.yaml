      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Curative 通过雇主福利决策销售，而不是面向消费者直接购买。公司称，雇主与 Curative 代表或经纪人合作选择计划结构和出资方式，会员随后在资格窗口内参保。公司提供全额承保和水平出资安排，以及
              EPO、PPO、PPO Max 和 EPO Value 计划设计，让雇主在网络广度与成本纪律之间取舍。产品的采用机制同时也是关键执行约束：成年人必须在 120 天内完成 Baseline
              Visit，才能保留网络内 $0 医疗；否则，年度网络内免赔额将变为个人 $5,000 或家庭 $10,000。Capital Rx 支持药房部分，但公开证据没有披露雇主转化率、留存率或实际节省额。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
