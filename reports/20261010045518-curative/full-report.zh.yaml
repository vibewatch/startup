              - CM016
      - number: '2.4'
        title: 采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              现有证据要求对采用时点和估值都保持谨慎。Curative 的条件式福利设计需要会员持续完成入组流程；扩张还要求每个雇主所在地区具备足够的医疗服务和药房准入。第三方劳动力数据估计 2026 年员工数同比下降
              5.4%，但没有管理层背景，这一观察无法证明需求、效率或经营困境。品类数据同样不可靠：Tracxn 仍主要把 Curative
              描述为新冠检测中心平台，并将检测公司列为可比方，尽管公司当前材料的核心已是雇主医保。决定性尽调输入包括当前州级可用范围、报价保费、承保人数、雇主队列、续保率，以及医疗和药房经济性。在这些分母得到验证前，不能把市场规模直接换算成收入或估值倍数。
            claimRefs:
