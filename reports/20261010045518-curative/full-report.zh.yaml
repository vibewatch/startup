  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              公开描述显示公司运营范围广泛且不断变化，但无法证明当前逐州许可证清单、承担每项保险风险的法律实体或法定资本合规情况。Wikipedia 报道计划扩展至超过 20 个州；LeadIQ
              则列出佐治亚州、佛罗里达州和德州的雇主市场，并描述全国网络目标；这些说法覆盖的范围不同，不能换算成已验证的许可证数量。最明确的不利事件发生在历史上：2021 年 1 月，FDA 安全通信警告 Curative
              早期新冠检测存在假阴性风险。Curative 后来改用 Abbott 检测，并要求撤销原检测授权，因此该事件是遗留的合规和责任尽调事项，并非当前保险违规的证据。报道称公司拥有 HITRUST
              r2，但指定来源没有提供其当前范围和评估期间。
            claimRefs:
