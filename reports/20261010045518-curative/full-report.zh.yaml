      - number: '7.4'
        title: 展示
        blocks:
          - type: callout
            title: 不透明不等于经营困境
            body: 指定证据没有披露经审计的医疗赔付、准备金、再保险、续保或集中度指标。这种缺失妨碍承保风险评估，但不能证明 Curative 准备金不足、亏损或依赖任何具名合作伙伴。
            calloutType: risk
            claimRefs:
              - CR016
          - type: callout
            title: 进一步投资须以一手尽调为门槛
            body: 在依赖公开评级和福利价值主张前，应要求监管机构、精算师、评级机构、安全评估机构、客户队列和交易对手提供直接证据。融资额不应被视为可用现金、现金跑道或法定盈余。
            calloutType: recommendation
            claimRefs:
              - CR012
