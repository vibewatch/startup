  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              雇主医保福利市场高度由 UnitedHealthcare、Anthem Blue Cross Blue Shield、Cigna 和
              Aetna（BUCA）等传统龙头承保方主导，它们通过全国福利经纪人建立了根深蒂固的分销网络。相比之下，Curative 把自己定位为创新型雇主医保竞争者，目标是消除会员的分摊成本摩擦。Curative
              不采用把自付费用转嫁给患者的传统高免赔额计划，而是提供零美元共付额和零美元免赔额的商业计划。有意思的是，Tracxn 等商业情报平台仍保留 Curative 2020
              年作为快速扩张新冠检测服务商的历史分类滞后，把 Aptitude Medical、Rover Diagnostics 等早期分子诊断项目列为直接同行。但 Curative
              转向持牌医保后，已进入完全不同的竞争场景；真正的替代方案是传统商业团体保单、区域性 Blue 计划和新兴水平出资保险科技公司。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
      - number: '3.2'
        title: 功能、能力与参与度差异化
        blocks:
          - type: paragraph
            body: >-
              Curative 与传统团体医保的根本差异，在于把会员财务激励与预防保健参与度对齐。在传统商业 PPO 和 HMO
              产品中，前置免赔额、就诊共付额和机构共同保险等层层分摊成本，经常让会员推迟及时的门诊护理。Curative 通过提供零美元医生就诊和首选处方药，并用 Curative Cash Card
              为获批的急诊护理和治疗机构提供无自付额支付，移除了这些财务障碍。关键是，这一零美元福利层并非无条件享有；会员必须在保障生效日起 120 天内与 Care Navigator 完成一次综合 Baseline
              Visit。健康人口学和经济学研究表明，预防性突破能减少疾病发生，但要维持参与度，仍需克服患者成本障碍。Curative 的临床参与门槛把这一原则落到运营上，而 AM Best A-
              评级则为其相对于成熟承保方的承保能力提供验证。
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP009
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP008
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP009
              - CP011
      - number: '3.3'
        title: 定价结构、产品打包与雇主分销
        blocks:
          - type: paragraph
            body: >-
              为打入佛罗里达州、佐治亚州和德州的雇主账户，Curative 针对雇主规模和风险偏好提供两种不同的商业打包结构。对于拥有 51 名或以上员工、寻求完整风险转移的中型组织，Curative
              提供交钥匙式全额承保模式：雇主支付一笔有竞争力的月度保费，Curative 承担全部承保风险。对于希望获得赔付透明度并分享潜在剩余资金的雇主，Curative 提供水平出资方案；德州起始于 25
              名参保者，佛罗里达州和佐治亚州起始于 50 名。水平出资方案内置止损保险，以封顶灾难性责任；如果实际医疗使用率低于预测门槛，剩余赔付准备金还会返还 50% 现金回扣。两种打包方式让 Curative
              能同时挑战现状的全额承保计划，以及中端市场雇主复杂的自筹资金安排。
            claimRefs:
              - CP002
              - CP007
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
              - CP011
      - number: '3.4'
        title: 转换成本、分销摩擦与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              尽管消除成本的功能很有吸引力，Curative
              仍面临能巩固传统承保方地位的高转换成本和结构性分销摩擦。中端市场和企业账户的福利采购由第三方保险经纪人和顾问主导，他们与传统全国性付款方保持长期佣金结构和行政系统整合。覆盖多个地理辖区的雇主，在迁移出全国网络时会遇到摩擦，因为
              Curative 的商业雇主保障仍集中在德州、佛罗里达州和佐治亚州等南部关键州。此外，Curative
              竞争护城河能否持久，高度取决于非公开的承保表现；公开披露没有显示经审计的医疗赔付率、会员续保流失率或经纪人薪酬对比指标。在多年度队列承保盈利性得到证明前，传统承保方仍拥有广泛网络和防御性定价能力。
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP011
              - CP014
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 预防参与度切口
            body: Curative 的主要差异化，在于把预防保健从可选的健康福利变成强制性的财务门槛：会员只有完成年度 Baseline Visit，才能获得零共付额和免赔额，从而把会员健康激励与承保方降低赔付的目标对齐。
            calloutType: insight
            claimRefs:
              - CP001
              - CP006
              - CP009
          - type: callout
            title: 经纪人惯性与龙头渠道力量
            body: 传统健康保险公司拥有根深蒂固的经纪人关系和跨州医疗服务网络，使考虑迁移医保计划的中型雇主产生显著惯性。
            calloutType: risk
            claimRefs:
              - CP003
              - CP011
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业收入流与变现模式
        blocks:
          - type: paragraph
            body: >-
              Curative 主要是一家雇主医保提供商，靠向企业计划发起方收取具有竞争力的月度人均保费（PEPM）实现计划变现。作为可预测的月度订阅计费的交换，参保员工可在网络内获得初级保健、专科会诊和首选通用药，且享受
              $0 共付额和 $0 免赔额。这一商业方案把财务风险从波动的就诊点成本分摊，转移到精算池化的雇主保费结构中。为维持承保可行性并抑制道德风险，Curative 将零免赔额保障设为会员在入组前 120
              天内完成年度预防基线就诊的条件。错过这次检查的会员会失去零美元保障，触发个人最高 $5,000、家庭最高 $10,000 的后备免赔额。附加收入还包括非首选品牌处方药 $50 或 $250
              的分层共付额，以及零售诊所现金卡项目的转付处理费。
