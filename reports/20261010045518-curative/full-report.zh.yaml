chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与计划架构
        blocks:
          - type: paragraph
            body: >-
              Curative 是一家总部位于德州 Austin、成立于 2020 年的雇主医保公司，提供以创新预防优先成本结构为核心的商业保险
              [CO001]。在该公司的计划模式下，参保员工在网络内医疗预约和首选处方药上均无需支付共付额或免赔额，以单一月度保费取代传统免赔额门槛 [CO001]。要启动并维持这一完整保障层级，会员必须在计划生效日起 120
              天内，向初级保健临床医生完成一次年度综合 Baseline Visit [CO002]。Curative 还配套自有 Curative Cash
              Card，在获批医疗机构促进预付款并减少支付摩擦，希望通过尽早干预降低后续住院成本 [CO014]。
            claimRefs:
              - CO001
              - CO002
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO009
              - CO012
      - number: '1.2'
        title: 执行领导与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              Curative 于 2020 年由 CEO Fred Turner 和 CTO Isaac Turner 共同创立；两人最初搭建诊断自动化平台，之后将公司资产转向商业医保 [CO003]。总裁兼 CFO
              Tami Wilson-Ciranna 负责高管运营和法定保险职能，统筹财务纪律、资产负债表资本化，以及与州保险部门和信用评级机构的持续沟通
              [CO004]。管理团队把技术软件整合与精算风险管理结合起来，但公司在公开代表和战略方向上高度依赖联合创始人 Fred Turner，仍是持续存在的公司治理考量 [CO003]。
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO006
      - number: '1.3'
        title: 资本化、估值与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Curative 通过机构风险融资大幅扩充资本基础，最终完成 Series B，融资超过 $150 million，投后估值约为 $1.28 billion [CO007]。向美国证券交易委员会提交的 Form
              D 文件确认，公司至少筹得 $152.5 million 外部股权资本；Tracxn 的独立跟踪则记录三轮风险融资累计 $162 million [CO008, CO009]。公司股权结构表包括
              DCVC、Refactor Capital 和 Upside Vision Fund 等机构风险投资方，以及创始管理层持股 [CO009]。但具体持股比例、清算优先权和董事会投票控制机制仍属非公开信息
              [CO007]。
            claimRefs:
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO007
              - CO009
      - number: '1.4'
        title: 公司演进与运营风险
        blocks:
          - type: paragraph
            body: >-
              Curative 的运营演进呈现出从高流量新冠检测基础设施，快速转向 2023 年在德州、佛罗里达州和佐治亚州商业推出的雇主医保承保方 [CO005, CO006]。公司已取得 AM Best
              A-（优秀）财务实力评级，并连续四年获重申至 2026 年，巩固了承保可信度 [CO010]。Curative 仍是股权高度集中的私营初创公司，经过验证的 GAAP 收入和承保赔付率并未出现在公开 SEC
              EDGAR 文件中；这使它不同于同名的场外交易实体 Curative Biotechnology（CUBTD），后者于 2025 年末通过 Form RW 撤回注册声明
              [CO011]。当前组织规模估算在第三方跟踪机构之间差异很大，从跟踪到的 1,041 名人员，到模型估算的最多 5,000 名员工不等 [CO012]；法定赔付准备金和会员留存队列因此成为关键的非公开尽调事项
              [CO013]。
