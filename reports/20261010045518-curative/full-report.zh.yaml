  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Curative 所处的相关市场是雇主医保。公司描述的计划强调可负担性、参与度和简洁性，网络内共付额和免赔额为 $0，但前提是完成 Baseline Visit。雇主与 Curative
              或经纪人选择计划和出资结构，参保员工及其家属则是使用者。该边界包括计划打包的保险、就医导航、医疗服务网络和药房福利功能。它排除了两个明显的搜索误命中：一份关于基因、细胞和再生“治愈疗法”的市场报告，以及
              Curative Care Network 的康复服务。现状替代方案是雇主现有的团体计划和经纪流程；分配到的证据无法证明具体承保方份额或更广泛的品类支出总额。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
