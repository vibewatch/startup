      - number: '4.2'
        title: GTM 分销动作与内部运营成本结构
        blocks:
          - type: paragraph
            body: >-
              Curative
              的市场进入动作面向德州、佛罗里达州和佐治亚州的中大型自筹资金及全额承保雇主，借助区域员工福利经纪人和直销企业销售团队。由于切换企业医保计划要经历数月采购周期，经纪人协同和可预测的保费报价是关键分销杠杆。运营费用上，Curative
              把核心软件开发收回内部，大幅重构行政成本结构。公司用 AI 辅助软件生成在两个月内打造内部替代方案后，终止了每年 $600,000 的 Salesforce CRM 合同。此外，Curative 部署了名为
              Gwen 的自动化代理来谈判医生和医疗服务网络合同，将平均行政签约成本从每份 $1,500-$2,000 降至约 $70。不过，管理层承认，这些内部开发举措使 Anthropic
              云计算支出升至每月数百万美元，用持续且可观的基础设施算力支出替代了供应商许可费。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: 公开商业进展与单位经济现实
        blocks:
          - type: paragraph
            body: >-
              公开披露显示商业采用已有一定规模：Curative 报告约 1,200 个雇主团体中有超过 165,000 名活跃承保会员。据估计，公司 2026 日历年收入达到 $570
              million，并预期实现疫情后的首次经营盈利。Curative 模式的关键单位经济驱动因素，是报告中的年度基线预防就诊会员合规率
              98%。高管团队据称，前置初级保健会诊能及早发现糖尿病和高血压等慢性病，在六至十二个月内减少长期灾难性住院保险赔付。然而，独立观察者和竞争方强调，私营承保细节仍受到严密保护。包括净客户获客成本（CAC）、毛医疗赔付率（MLR）、实际平均
              PEPM 收益率和多年雇主留存队列在内的关键单位经济基准，仍是非公开信息，也未经法定审计验证，因此第三方无法最终确认长期承保盈利性。
            claimRefs:
