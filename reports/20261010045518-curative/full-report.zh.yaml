  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与会员护理交付
        blocks:
          - type: paragraph
            body: >-
              Curative 运营一款差异化的雇主医保产品，核心是彻底消除网络内成本分摊。产品保证网络内医疗就诊和符合条件的处方药享受 $0 免赔额和 $0
              共付额，以计划发起方支付的单一月度保费取代传统分层共同保险结构。要解锁并维持这一零自付额福利，会员必须在计划生效日起 120 天内完成年度 Baseline
              Visit。该就诊既是精算门槛，也是预防性临床接诊：它建立个性化护理计划，并在潜在医疗风险升级为高成本急性住院前识别出来。为协助会员走完医疗旅程，Curative 指派专属 Care
              Navigator，负责引导医疗服务商查找、预约和跨网络连续护理；该网络覆盖超过一百万名网络内医疗专业人士。急诊护理和心理健康诊所的现场自付摩擦，则由自有 Curative Cash Card
              处理：资金直接流向获批机构，无需会员先行报销。
