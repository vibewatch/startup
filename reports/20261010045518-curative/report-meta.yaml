  topStrengths:
    - Preventive-care-first employer plan is clearly differentiated and publicly explained.
    - AM Best rating and 2025 Series B financing provide credibility and capital validation.
    - Public member scale and broker adoption signals indicate meaningful traction.
  topRisks:
    - Audited underwriting economics, reserves, and medical-loss data remain private.
    - Renewal durability, customer concentration, and channel dependence are still opaque.
    - The current valuation depends on continued execution and limited secondary liquidity.
  unresolvedGaps:
    - Audited 2025 and year-to-date 2026 revenue, medical loss ratio, reserve, and capital adequacy data are not public.
    - Employer renewal cohorts, member retention, and product-mix economics by state remain undisclosed.
    - >-
      The public record does not show the current board roster, investor rights, or liquidation preferences tied to the
      2025 Series B.
    - >-
      Earlier funding history and total capital raised remain only partially visible through third-party databases
      rather than complete primary documentation.
    - Public sources support only a third-party employee-count estimate rather than an audited headcount disclosure.
