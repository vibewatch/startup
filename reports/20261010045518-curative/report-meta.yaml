companyProfile:
  summary: >-
    Curative is a privately held Austin-based employer health insurance company that built its current business around a
    preventive-care-first plan design, broker-assisted distribution, and a Baseline Visit requirement that unlocks the
    advertised $0 in-network benefit structure. The company pivoted from COVID-era diagnostics into employer-sponsored
    health coverage, raised a large Series B, and now presents as a late-stage private carrier with a public credibility
    signal from AM Best, but its underwriting economics, reserves, and renewal durability remain private.
  headquarters: Austin, Texas, United States
  foundingLocation: Austin, Texas, United States
  productSummary: >-
    Employer-sponsored health insurance plans with $0 in-network copays and deductibles contingent on an annual Baseline
    Visit, plus broker-assisted distribution and pharmacy/member-support features.
  customerFocus: Employers in Texas, Florida, and Georgia, especially small-to-mid-sized employer groups.
  businessModel: Employer premium revenue with ancillary pharmacy and member-access economics.
  stage: Late-stage private (Series B)
  fundingStatus: >-
    Series B completed in late 2025; public reporting places the round at roughly $150 million and the company at
