  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: >-
        Employer renewal cohorts, member retention, NRR, GRR, churn, contract length, and
        satisfaction measures by product and state.
      whyItMatters: >-
        Without cohort retention evidence, positive testimonials cannot establish durable
        employer adoption or recurring premium quality.
      diligencePath: >-
        Request monthly employer and member cohorts by effective date, product, state, broker,
        renewal status, and lost-account reason, reconciled to premium records.
      relatedQuestionRefs: [QU006]
    - type: private-evidence-only
      severity: material
      topic: concentration-gap
      missingEvidence: >-
        Current employer count, enrolled-member count, premium and revenue concentration by top
        customer, state, vertical, product, and broker.
      whyItMatters: >-
        Geographic expansion does not reveal whether the book is diversified or dependent on a
        small number of employers or intermediaries.
      diligencePath: >-
        Obtain an anonymized customer ledger with employer, members, premium, product, geography,
        broker, start date, renewal date, and top-10 concentration.
      relatedQuestionRefs: [QU007]
      relatedTableRefs: [TU001]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        A complete employer roster and independently referenceable production deployments with
        quantified utilization, savings, satisfaction, and renewal outcomes.
      whyItMatters: >-
        One named company-hosted testimonial and one anonymous broker quotation cannot establish
        the breadth or representativeness of customer success.
      diligencePath: >-
        Select at least five reference calls across product, state, group size, tenure, and broker,
        including one churned or non-renewed employer.
      relatedQuestionRefs: [QU005]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: customer-outcomes
      missingEvidence: >-
        Independent evidence linking the Baseline Visit and zero-cost design to utilization,
        claims, employer savings, absenteeism, or health outcomes.
      whyItMatters: >-
        The public mechanism is clear, but its economic and clinical value for employers remains
        a company claim without a comparable control or denominator.
      diligencePath: >-
        Request actuarial studies, claims analyses, and employer-level pre/post comparisons with
        definitions, denominators, confidence intervals, and independent validation.
      relatedQuestionRefs: [QU003, QU004]
