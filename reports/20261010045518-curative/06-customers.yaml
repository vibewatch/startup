schemaVersion: report-v2
artifact: customers
slug: curative
runDate: 2026-10-10
company:
  name: Curative
chapter:
  number: 6
  title: Customers
  summary: >-
    Curative sells employer-sponsored health plans to employers in Texas, Florida, and Georgia,
    with brokers serving as a material distribution channel and employees as the end users.
    Public proof supports product availability and two company-published testimonials, but it
    does not establish customer count, retention, concentration, or measured employer outcomes.
sections:
  - id: customer-segments-and-eligibility
    title: Customer segments and eligibility
    body: >-
      Curative's economic buyer is the employer selecting a group health plan, while benefits
      brokers can influence or place the plan and enrolled employees use the coverage. The current
      official Texas page separates fully insured and level-funded offers: fully insured plans are
      aimed at employers with at least 51 employees, while level-funded eligibility starts at 25
      employees in Texas and requires at least 50 employees and 25 enrolled subscribers in Florida
      and Georgia. This segmentation creates a defined small-to-midsize employer wedge rather than
      evidence of broad enterprise penetration. Although covered employees may access care
      nationwide, the employer-headquarters eligibility remains geographically constrained, so
      nationwide member access should not be read as nationwide employer availability.
    claimRefs: [CU001, CU002, CU003, CU014, CU015]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-customer-proof
    title: Adoption trajectory and customer proof
    body: >-
      The observable adoption trail is directional rather than quantified. A company-issued 2025
      release says the health plan launched in 2023 and expanded to employers in multiple states,
      while current official pages identify eligible employer geographies and group-size
      thresholds. The broker page provides the clearest attributable customer evidence: a named
      ECS Holdings president says the results were phenomenal, and an unnamed leading Texas
      benefits broker describes strong employer and employee acceptance. Both testimonials are
      hosted and selected by Curative, however, and neither supplies enrollment, claims, savings,
      utilization, renewal, or cohort data. They establish referenceability, not independently
      measured customer outcomes or a representative customer sample.
    claimRefs: [CU007, CU008, CU009, CU010, CU013]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Durability, channel leverage, and expansion
    body: >-
      Curative's customer journey is designed around employer purchase, broker placement, employee
      enrollment, a Baseline Visit, ongoing member support, and renewal. Members maintain the
      advertised zero-cost in-network benefit by completing a Baseline Visit within the first 120
      days of each plan year, and Curative says support is available around the clock. That model
      may encourage early engagement, but the retained evidence does not show whether engagement
      improves renewal economics or member retention. The broker page explicitly frames renewal as
      an opportunity for advisors to bring clients additional Curative business, yet it reports no
      renewal rate, expansion rate, contract length, NRR, GRR, or churn. Broker enthusiasm therefore
      remains a channel signal rather than proof of durable land-and-expand behavior.
    claimRefs: [CU004, CU005, CU006, CU011, CU015]
  - id: concentration-and-evidence-risk
    title: Concentration and evidence risk
    body: >-
      Customer concentration cannot be assessed from this public record. None of the retained
      company-relevant pages discloses an employer count, enrolled-member count, revenue by
      customer, top-customer share, vertical mix, or renewal cohort. The independent web profiles
      add little usable customer evidence, and one still characterizes Curative as a COVID-19
      testing-center platform rather than the current health-plan business. Two allocated search
      results were also unusable for customer diligence: one concerns the unrelated curative
      therapeutics market, while the other fetched page contains citation metadata but no customer
      facts. These limitations increase the risk of confusing discoverability with adoption and
      make a management-provided customer and retention data room essential.
    claimRefs: [CU011, CU012, CU014, CU016]
tables:
  - id: TU001
    title: Customer segmentation and eligibility
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale boundary
      - Strategic value
      - Diligence gap
    rows:
      - - Fully insured employers
        - Employer buys and pays; employees use coverage
        - Outsourced group health plan administration
        - 51+ employees; headquarters in 38 Texas counties, Florida, or Georgia
        - Direct premium relationship with Curative
        - No employer count, premium volume, or renewal cohort disclosed
      - - Level-funded Texas employers
        - Employer funds plan; employees use coverage
        - Greater claims transparency and potential rebate
        - 25+ employees headquartered in Texas
        - Lower-size entry point and 50% remaining-claims-fund rebate
        - No take-up, claims-fund, or rebate distribution disclosed
      - - Level-funded Florida and Georgia employers
        - Employer funds plan; employees use coverage
        - Level-funded benefits with stop-loss protection
        - 50+ employees and at least 25 enrolled subscribers
        - Extends the employer wedge beyond Texas
        - No state-level customer, member, or premium mix disclosed
      - - Benefits brokers and advisors
        - Broker influences placement; employer is buyer; employee is user
        - Plan selection, onboarding, and renewal support
        - Available for eligible groups in Texas, Florida, and Georgia
        - Distribution leverage without a direct employer acquisition motion
        - Broker contribution, commissions, and channel concentration undisclosed
    notes: >-
      Eligibility and plan mechanics are company-stated as of 2026-10-10; public pages do not
      disclose segment-level customer counts, revenue, enrollment, or renewal outcomes.
    claimRefs: [CU002, CU003, CU006, CU012, CU015]
  - id: TU002
    title: Public customer growth and adoption trajectory
    columns:
      - Metric
      - Public value
      - Period
      - Source posture
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Health-plan launch
        - Launched in 2023
        - 2023
        - Company-issued release syndicated by Yahoo Finance
        - Medium
        - Establishes operating history for the current insurance product
        - No launch cohort size or enrolled-member baseline
      - - Employer geography
        - Texas, Florida, and Georgia headquarters eligibility; nationwide employee coverage
        - Current page accessed 2026-10-10
        - Official product page
        - Medium
        - Demonstrates multi-state employer availability
        - No employer or member count by state
      - - Financial-strength continuity
        - A- rating affirmed for a third consecutive year
        - 2025
        - Company-issued release describing AM Best action
        - Medium
        - Supports insurer continuity but not customer adoption
        - No relationship to renewals, utilization, or customer growth
    notes: >-
      This is a partial public trajectory, not a growth series: values use different units and
      periods, and no comparable customer-count or enrollment denominator is publicly supplied.
    claimRefs: [CU002, CU009, CU010, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / reference
      - Segment
      - Deployment or use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - ECS Holdings
        - Employer
        - Employee health-plan coverage and network support
        - Appears to describe active use; production status is not explicitly labeled
        - President calls the results phenomenal and praises network and service support
        - Company-hosted testimonial with no enrollment, savings, utilization, or renewal metric
      - - Unnamed large employer group
        - Employer customer represented by a leading Texas benefits broker
        - Group health-plan adoption and employee engagement
        - Described as an adopted group plan; pilot status is not stated
        - Broker says the employer and employees love the plan
        - Employer and broker identities, group size, term, and outcomes are undisclosed
      - - Employers across multiple states
        - Unnamed employer base
        - Curative employer-sponsored health plan
        - Company says reach expanded after the 2023 launch
        - Multi-state reach is asserted
        - No named customers, state mix, count, active-use measure, or retention result
    notes: >-
      Sample of all customer proof identifiable in the assigned prefetched source pool; the
      evidence is company-issued or company-hosted and is not an exhaustive customer roster.
    enumerationScope:
      coverage: sample
      basis: >-
        Customer references and deployment assertions visible in the assigned prefetched sources
        as accessed on 2026-10-10.
    claimRefs: [CU007, CU008, CU009, CU013, CU014]
figures:
  - id: FU001
    title: Employer health-plan customer journey and expansion loop
    type: journey-map
    summary: >-
      The public journey runs from broker-assisted selection through annual benefit maintenance
      and renewal, but quantified conversion and retention measures are unavailable.
    data:
      items:
        - label: Broker discovery
          detail: Benefits advisor introduces Curative to an eligible employer group.
          touchpoints:
            - Broker sales page
            - Curative expert contact
        - label: Employer selection
          detail: Employer chooses fully insured or level-funded plan design.
          touchpoints:
            - Eligibility review
            - Plan comparison
        - label: Member enrollment
          detail: Employees become covered members with nationwide in-network access.
          touchpoints:
            - Enrollment
            - Member materials
        - label: Baseline Visit
          detail: Member completes the required visit within 120 days of the plan year.
          touchpoints:
            - Comprehensive health visit
            - Care navigation
        - label: Ongoing care
          detail: Member uses in-network care and 24/7 member support.
          touchpoints:
            - Provider access
            - Support service
        - label: Renewal and expansion
          detail: Employer and broker assess renewal or additional placements without public outcome data.
          touchpoints:
            - Renewal discussion
            - Broker cross-sell
    approximationNotes: >-
      This is a qualitative sequence inferred from current company pages; no conversion rate,
      average duration, or cohort retention value is available for any stage.
    claimRefs: [CU004, CU005, CU006, CU015]
callouts:
  - calloutType: risk
    title: Public references do not establish retention
    body: >-
      The retained pool offers two positive testimonials and a broad multi-state expansion claim,
      but no customer count, renewal cohort, contract duration, churn, NRR, GRR, or concentration
      metric. Customer durability remains a management-data diligence item.
    claimRefs: [CU011, CU012, CU013]
