artifact: market-analysis
slug: curative
runDate: '2026-10-10'
company:
  name: Curative
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Curative addresses employer-sponsored health plans, not the unrelated
    markets for curative therapies or rehabilitation services that appear in
    name-based searches. The available evidence defines the product, buyer
    path, and a three-state employer footprint, but it does not support a
    defensible numeric TAM, SAM, or SOM because premium volume, covered lives,
    employer counts, renewals, and state-level enrollment remain undisclosed.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Curative's relevant market is employer-sponsored health coverage. The
      company describes a plan built around affordability, engagement, and
      simplicity, with $0 in-network copays and deductibles subject to completion
      of a Baseline Visit. Employers choose the plan and funding structure with
      Curative or a broker, while enrolled employees and dependents are the
      users. That boundary includes the insurance, navigation, provider-network,
      and pharmacy-benefit functions bundled into the plan. It excludes two
      prominent search false positives: a market report about gene, cell, and
      regenerative "curative therapies," and Curative Care Network's
      rehabilitation services. The status-quo substitute is an employer's
      existing group plan and broker process; the assigned evidence does not
      establish named-carrier shares or a broader category spending total.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM011
      - CM012
      - CM013
    tableRefs:
      - TM001
  - id: sizing-without-false-precision
    title: Evidence-constrained sizing
    body: >-
      The source set supports operating proxies rather than a conventional
      market-size calculation. A third-party profile says Curative serves
      employers headquartered in Georgia, Florida, and Texas and intends to
      expand network access nationally; a company-issued release separately
      says the plan had expanded to employers across multiple states after its
      2023 launch. Revelio Labs estimates about 1,100 employees in March 2026,
      with 97.7% in North America, which may indicate delivery capacity but is
      neither enrollment nor revenue. Curative also reports pharmacy networks
      of 30,000-plus locations for EPO/PPO and 60,000-plus for PPO Max, but
      pharmacy access is not a covered-lives denominator. Numeric TAM, SAM, and
      SOM therefore remain gaps rather than investable outputs.
    claimRefs:
      - CM005
      - CM007
      - CM008
      - CM009
      - CM010
      - CM014
      - CM015
      - CM016
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      Curative is sold through an employer-benefits decision rather than a
      direct-to-consumer purchase. The company says an employer works with a
      Curative representative or broker to select plan structure and funding,
      then members enroll during an eligibility window. It offers fully insured
      and level-funded arrangements and EPO, PPO, PPO Max, and EPO Value plan
      designs, allowing employers to trade network breadth against cost
      discipline. The product's adoption mechanism is also its key execution
      constraint: adults must complete a Baseline Visit within 120 days to keep
      $0 in-network care; otherwise the annual in-network deductible becomes
      $5,000 per person or $10,000 per family. Capital Rx supports the pharmacy
      component, but the public evidence does not disclose employer conversion,
      retention, or realized savings.
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM014
      - CM016
    tableRefs:
      - TM003
  - id: constraints-and-diligence
    title: Adoption constraints and valuation relevance
    body: >-
      The evidence argues for caution on both adoption timing and valuation.
      Curative's conditional benefit design requires sustained member onboarding,
      and expansion requires adequate provider and pharmacy access in each
      employer geography. Third-party workforce data estimates a 5.4% year-over-
      year headcount decline in 2026, but that observation cannot establish
      demand, efficiency, or distress without management context. Category data
      are also unreliable: Tracxn still describes Curative primarily as a
      COVID-19 testing-center platform and presents testing companies as peers,
      even though current company materials center on employer health insurance.
      The decisive diligence inputs are current state availability, quoted
      premiums, covered lives, employer cohorts, renewal rates, and medical and
      pharmacy economics. Until those denominators are verified, market scale
      should not be translated into revenue or valuation multiples.
    claimRefs:
      - CM002
      - CM009
      - CM011
      - CM014
      - CM015
      - CM016
tables:
  - id: TM001
    title: Market definition and exclusion boundary
    columns:
      - Segment or category
      - Included spend or activity
      - Excluded spend or activity
      - Buyer or payer
      - Relevance to Curative
    rows:
      - - Employer-sponsored group health plan
        - Employer-selected insurance coverage, member care, navigation, and plan administration
        - Direct-to-consumer coverage and public-program spend are not established by the assigned evidence
        - Employer; specific budget-owner title is undisclosed
        - Core market explicitly identified by Curative
      - - Fully insured and level-funded plan structures
        - EPO, PPO, PPO Max, and EPO Value arrangements offered through an employer
        - Funding structures not described in Curative's materials
        - Employer working with Curative or a broker
        - Product and contracting paths within the core market
      - - Integrated pharmacy benefit
        - Preferred prescriptions, pharmacy fulfillment, and Capital Rx-supported administration
        - Standalone pharmacy-benefit opportunities outside Curative plans are not established
        - Employer plan, used by enrolled members
        - Supporting component of the health-plan offer
      - - Curative therapies
        - None
        - Gene, cell, and regenerative therapies and their clinical spending
        - Hospitals, clinicians, and therapy payers
        - Unrelated category; exclude its market-size estimates
      - - Curative Care Network
        - None
        - Rehabilitation and community-service activities of a separate organization
        - Curative Care Network clients and program funders
        - Unrelated entity; exclude from Curative's market
    notes: >-
      Included items come from Curative product materials; excluded categories
      are retained only to document name-based search contamination. No excluded
      category value is used to size Curative.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM006
      - CM012
      - CM013
