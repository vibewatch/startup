figures:
  - id: FM001
    title: Evidence-constrained addressability funnel
    type: pyramid
    summary: >-
      Six qualification layers narrow the opportunity without assigning an
      unsupported dollar value or conversion rate.
    data:
      items:
        - label: U.S. employer-sponsored health coverage
          value: Boundary only
          detail: The assigned pool does not contain a current numeric market denominator.
        - label: Fully insured and level-funded employer groups
          value: Eligible structures
          detail: Curative states that both funding routes are available.
        - label: Employers in supported geographies
          value: Serviceable scope
          detail: LeadIQ names Georgia, Florida, and Texas; full state availability is unverified.
        - label: Employers accepting Curative's plan and network design
          value: Sales qualification
          detail: EPO, PPO, PPO Max, and EPO Value offer different network trade-offs.
        - label: Enrolled employees and dependents
          value: Adoption cohort
          detail: Current employer and covered-lives counts are not disclosed.
        - label: Renewed, Baseline-compliant members
          value: Realized cohort
          detail: Retention, renewal, and cohort economics remain private.
    approximationNotes: >-
      This is an ordinal qualification hierarchy, not a proportional or numeric
      TAM/SAM/SOM graphic; no layer width, market value, or conversion rate is
      implied.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM008
      - CM016
