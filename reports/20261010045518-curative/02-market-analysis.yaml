  - id: TM003
    title: Segment, buyer, user, payer, and adoption map
    columns:
      - Segment or route
      - Buyer
      - User
      - Payer
      - Workflow and budget owner
      - Adoption trigger
    rows:
      - - Fully insured employer plan
        - Employer, directly or through a broker
        - Enrolled employees and dependents
        - Employer/member split not disclosed
        - Employer selects plan and funding; exact internal title is undisclosed
        - Interest in a $0 in-network benefit design
      - - Level-funded employer plan
        - Employer, directly or through a broker
        - Enrolled employees and dependents
        - Employer/member split not disclosed
        - Employer selects a level-funded structure with Curative or its broker
        - Preference for an alternative funding arrangement
      - - EPO or EPO Value route
        - Employer
        - Members willing to use a curated in-network pathway
        - Employer/member split not disclosed
        - Employer and broker choose the plan; members use provider-search and navigation tools
        - Cost discipline and $0 qualifying in-network care
      - - PPO or PPO Max route
        - Employer
        - Members seeking out-of-network or broader pharmacy access
        - Employer/member split not disclosed
        - Employer and broker choose greater network flexibility
        - PPO Max's broader pharmacy network and out-of-network design
      - - Adult member onboarding
        - Not a separate buyer
        - Adult members and adult dependents
        - Covered under the employer-selected plan
        - Member completes navigator onboarding and clinical check-in within 120 days
        - Retaining the $0 in-network benefit for the plan year
    notes: >-
      Buyer and workflow descriptions follow Curative's own enrollment guidance;
      precise premium contributions, internal budget-owner titles, and conversion
      rates are not publicly disclosed in the assigned evidence.
