              - CM003
              - CM004
              - CM006
              - CM012
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The source set supports operating proxies rather than a conventional market-size calculation. A
              third-party profile says Curative serves employers headquartered in Georgia, Florida, and Texas and
              intends to expand network access nationally; a company-issued release separately says the plan had
              expanded to employers across multiple states after its 2023 launch. Revelio Labs estimates about 1,100
              employees in March 2026, with 97.7% in North America, which may indicate delivery capacity but is neither
              enrollment nor revenue. Curative also reports pharmacy networks of 30,000-plus locations for EPO/PPO and
              60,000-plus for PPO Max, but pharmacy access is not a covered-lives denominator. Numeric TAM, SAM, and SOM
              therefore remain gaps rather than investable outputs.
            claimRefs:
