            - Baseline Visit and navigation described
            - No audited MLR or cohort outcomes
        - label: State licensure
          values:
            - Footprint described; licenses not enumerated
            - Material if deficient
            - Multi-state presence reported
            - Entity-by-state mapping absent
        - label: Network and formulary delivery
          values:
