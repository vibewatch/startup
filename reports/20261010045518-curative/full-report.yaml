  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Curative's relevant market is employer-sponsored health coverage. The company describes a plan built
              around affordability, engagement, and simplicity, with $0 in-network copays and deductibles subject to
              completion of a Baseline Visit. Employers choose the plan and funding structure with Curative or a broker,
              while enrolled employees and dependents are the users. That boundary includes the insurance, navigation,
              provider-network, and pharmacy-benefit functions bundled into the plan. It excludes two prominent search
              false positives: a market report about gene, cell, and regenerative "curative therapies," and Curative
              Care Network's rehabilitation services. The status-quo substitute is an employer's existing group plan and
              broker process; the assigned evidence does not establish named-carrier shares or a broader category
              spending total.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
