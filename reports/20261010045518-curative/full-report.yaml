            - Material if access gaps are broad
            - Approved-provider and tiered-drug mechanisms
            - Adequacy and exception data absent
        - label: Information security
          values:
            - Current incident likelihood unknown
            - Potentially material
            - HITRUST r2 reported
            - Scope, exceptions, and incidents absent
        - label: Legacy diagnostics liabilities
          values:
            - Historical event verified; current exposure unknown
            - Lower unless liabilities survived the pivot
            - Original assay replaced
            - Legal and contract closeout evidence absent
