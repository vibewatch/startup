              - CM004
              - CM008
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Curative is sold through an employer-benefits decision rather than a direct-to-consumer purchase. The
              company says an employer works with a Curative representative or broker to select plan structure and
              funding, then members enroll during an eligibility window. It offers fully insured and level-funded
              arrangements and EPO, PPO, PPO Max, and EPO Value plan designs, allowing employers to trade network
              breadth against cost discipline. The product's adoption mechanism is also its key execution constraint:
              adults must complete a Baseline Visit within 120 days to keep $0 in-network care; otherwise the annual
              in-network deductible becomes $5,000 per person or $10,000 per family. Capital Rx supports the pharmacy
              component, but the public evidence does not disclose employer conversion, retention, or realized savings.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM016
      - number: '2.4'
        title: Adoption constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The evidence argues for caution on both adoption timing and valuation. Curative's conditional benefit
              design requires sustained member onboarding, and expansion requires adequate provider and pharmacy access
              in each employer geography. Third-party workforce data estimates a 5.4% year-over- year headcount decline
              in 2026, but that observation cannot establish demand, efficiency, or distress without management context.
              Category data are also unreliable: Tracxn still describes Curative primarily as a COVID-19 testing-center
              platform and presents testing companies as peers, even though current company materials center on employer
              health insurance. The decisive diligence inputs are current state availability, quoted premiums, covered
              lives, employer cohorts, renewal rates, and medical and pharmacy economics. Until those denominators are
              verified, market scale should not be translated into revenue or valuation multiples.
            claimRefs:
              - CM002
              - CM009
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market size cannot be converted into revenue from this evidence
            body: >-
              The public source set lacks current premiums, employer counts, covered lives, renewal cohorts, and
              state-level enrollment. Workforce and network counts are useful operating proxies but are not revenue or
              market-share denominators.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The employer-sponsored health benefits landscape is heavily dominated by legacy incumbent carriers
              including UnitedHealthcare, Anthem Blue Cross Blue Shield, Cigna, and Aetna (BUCA), which command
              entrenched distribution through nationwide benefits brokers. In contrast, Curative positions itself as an
              innovative employer health plan competitor designed to eliminate member cost-sharing friction. Rather than
              relying on traditional high-deductible plan structures that shift out-of-pocket costs to patients,
              Curative offers zero-dollar copay and zero-dollar deductible commercial plans. Interestingly, commercial
              intelligence platforms such as Tracxn still reflect residual classification lag from Curative's historical
              2020 origins as a rapid-scale COVID-19 testing provider, cataloging early molecular diagnostic ventures
              like Aptitude Medical and Rover Diagnostics as direct peers. However, Curative's operational pivot into
              licensed health insurance creates an entirely distinct competitive arena where its true alternatives are
              incumbent commercial group policies, regional Blues plans, and emerging level-funded insurtechs.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
      - number: '3.2'
        title: Feature, Capability, and Engagement Differentiation
        blocks:
          - type: paragraph
            body: >-
              Curative differentiates fundamentally from legacy group health plans through its structural alignment of
              member financial incentives with preventive health engagement. Under conventional commercial PPO and HMO
              products, members encounter compounding cost-sharing barriers including upfront deductibles, visit
              copayments, and facility coinsurance that frequently deter timely outpatient care. Curative removes these
              financial hurdles by offering zero-dollar doctor visits and preferred prescription drugs, supported by a
              Curative Cash Card for seamless zero out-of-pocket access to approved urgent care and therapy providers.
              Crucially, this zero-dollar benefit tier is not an unrestricted entitlement; members must actively
              complete a comprehensive Baseline Visit with a Care Navigator within 120 days of coverage effective date.
              Health demographic and economic research demonstrates that while preventive breakthroughs reduce disease
              onset, sustaining engagement requires overcoming patient cost barriers. Curative's clinical engagement
              gate operationalizes this principle while its AM Best A- rating provides underwriting validation against
              established carriers.
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP009
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP008
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP009
              - CP011
      - number: '3.3'
        title: Pricing Structures, Packaging, and Employer Distribution
        blocks:
          - type: paragraph
            body: >-
              To penetrate employer accounts across Florida, Georgia, and Texas, Curative provides two distinct
              commercial packaging structures tailored to employer group size and risk appetite. For mid-sized
              organizations with 51 or more employees seeking comprehensive risk transfer, Curative delivers a turnkey
              fully-insured model where the employer pays a single competitive monthly premium and Curative retains full
              underwriting risk. For employers seeking claims transparency and potential surplus savings, Curative
              markets a level-funded option available to groups starting at 25 subscribers in Texas and 50 in Florida
              and Georgia. The level-funded packaging incorporates integrated stop-loss insurance to cap catastrophic
              liability while returning a 50 percent cash rebate on remaining claims reserves if actual medical
              utilization falls below projected thresholds. This dual packaging allows Curative to challenge both
              status-quo fully-insured plans and complex self-funded arrangements across mid-market employers.
            claimRefs:
              - CP002
              - CP007
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
              - CP011
      - number: '3.4'
        title: Switching Costs, Distribution Friction, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Despite compelling cost-elimination features, Curative faces formidable switching costs and structural
              distribution friction that fortify incumbent carriers. Benefits procurement in mid-market and enterprise
              accounts is mediated by third-party insurance brokers and consultants who maintain long-standing
              commission structures and administrative integrations with legacy national payers. Employers operating
              across multiple geographic jurisdictions encounter friction migrating away from national networks, as
              Curative's commercial employer coverage remains focused across key southern states including Texas,
              Florida, and Georgia. Furthermore, the durability of Curative's competitive moat depends heavily on
              private underwriting performance; public disclosures do not reveal audited medical loss ratios, member
              renewal lapse rates, or comparative broker compensation metrics. Until multi-year cohort underwriting
              profitability is proven, legacy carriers retain substantial network breadth and defensive pricing power.
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP011
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Preventive Engagement Wedge
            body: >-
              Curative's primary differentiation lies in converting preventive care from an optional wellness perk into
              a mandatory financial gateway: members secure zero copays and deductibles only by completing an annual
              Baseline Visit, aligning member health incentives with carrier loss mitigation.
            calloutType: insight
            claimRefs:
              - CP001
              - CP006
              - CP009
          - type: callout
            title: Broker Inertia and Incumbent Channel Power
            body: >-
              Incumbent health insurers retain entrenched broker relationships and multi-state provider networks that
              create significant inertia for mid-sized employers contemplating health plan migration.
            calloutType: risk
            claimRefs:
              - CP003
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial Revenue Streams and Monetization Model
        blocks:
          - type: paragraph
            body: >-
              Curative operates primarily as an employer-sponsored health insurance provider, monetizing its plans
              through competitive monthly per-employee-per-month (PEPM) premiums paid by corporate plan sponsors. In
              exchange for predictable monthly subscription billing, enrolled employees gain access to in-network
              primary care, specialist consultations, and preferred generic medications at $0 copays and $0 deductibles.
              This commercial proposition shifts financial risk away from volatile employee point-of-care cost-sharing
              into an actuarially pooled employer premium structure. To preserve underwriting viability and discourage
              moral hazard, Curative conditions its zero-deductible coverage on members completing an annual preventive
              baseline visit within their first 120 days of enrollment. Members who miss this checkup forfeit
              zero-dollar coverage, triggering fallback deductibles of up to $5,000 for individuals and $10,000 for
              family plans. Ancillary revenue streams include tiered copayments of $50 or $250 for non-preferred brand
              prescriptions, as well as pass-through processing fees on retail clinic cash card programs.
            claimRefs:
              - CI001
              - CI002
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
              - CI011
      - number: '4.2'
        title: GTM Distribution Motion and Internal Operating Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Curative's go-to-market motion targets mid-sized and large self-funded and fully insured employers across
              Texas, Florida, and Georgia, leveraging regional employee benefits brokers and direct enterprise sales
              teams. Because switching corporate health plans involves multi-month procurement cycles, broker alignment
              and predictable premium quotes serve as critical distribution levers. On the operating expense side,
              Curative has aggressively restructured its administrative cost profile by internalizing core software
              development. The company terminated a $600,000 annual Salesforce CRM contract after building an internal
              replacement in two months with AI-assisted software generation. Additionally, Curative deployed an
              automated agent named Gwen to negotiate doctor and provider network contracts, driving down average
              administrative contracting costs from $1,500-$2,000 per contract to approximately $70. However, management
              acknowledged that these internal development initiatives have driven Anthropic cloud compute expenses into
              millions of dollars monthly, trading vendor license fees for substantial ongoing infrastructure compute
              spend.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Public Commercial Traction and Unit Economics Realities
        blocks:
          - type: paragraph
            body: >-
              Public disclosures indicate meaningful commercial adoption, with Curative reporting over 165,000 active
              covered members across approximately 1,200 employer groups. The company projected top-line revenue of $570
              million for calendar year 2026, alongside expectations of achieving its first post-pandemic operating
              profitability. A pivotal unit economics driver in Curative's model is its reported 98% member compliance
              rate for annual baseline preventive visits. Executive leadership argues that upfront primary-care
              consultations uncover chronic conditions such as diabetes and hypertension early, reducing long-tail
              catastrophic inpatient claims within six to twelve months. Nonetheless, independent observers and
              competitors emphasize that private underwriting details remain heavily shielded. Crucial unit-economics
              benchmarks—including net customer acquisition cost (CAC), gross medical loss ratio (MLR), average PEPM
              realized yield, and multi-year employer retention cohorts—remain private and unverified by statutory
              audits, preventing definitive third-party confirmation of long-term underwriting profitability.
            claimRefs:
              - CI003
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI008
              - CI010
              - CI011
      - number: '4.4'
        title: Capital Adequacy, Balance Sheet Reserves, and Financial Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Curative has amassed substantial financial backing to support its regulated insurance operations, raising
              at least $152.5 million to $162 million in aggregate venture capital across its Form D filings and funding
              records. The company's latest equity round in late 2025 secured more than $150 million in Series B capital
              at an estimated $1.28 billion post-money valuation, led by Upside Vision Fund with participation from
              institutional investors including DCVC. Furthermore, Curative maintains an A- (Excellent) Financial
              Strength Rating from AM Best for three consecutive years, affirming adequate risk-adjusted balance sheet
              capitalization and liquidity for statutory claims obligations. From an investment diligence standpoint,
              Curative demonstrates impressive member scale, robust capital adequacy, and innovative operational
              automation. However, underwriting approval must remain gated until prospective backers can inspect audited
              statutory loss ratios, state-specific reserve buffers, and multi-year employer renewal retention cohorts
              to confirm that zero-deductible benefits deliver sustainable underwriting margins.
            claimRefs:
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Operating Risk from Escalating AI Infrastructure and Compute Spend
            body: >-
              While Curative successfully eliminated a $600,000 annual Salesforce contract and drastically cut
              contracting expenses, monthly Anthropic AI compute costs expanded sixfold into millions of dollars,
              shifting operational risk into software maintenance and infrastructure compute volatility.
            calloutType: risk
            claimRefs:
              - CI006
              - CI008
              - CI009
          - type: callout
            title: Baseline Preventive Visit Serves as Underwriting Risk Anchor
            body: >-
              Conditioning $0 out-of-pocket benefits on an annual baseline visit achieves a 98% member compliance rate,
              enabling Curative to discover chronic conditions early while maintaining a fallback $5,000 to $10,000
              deductible penalty against non-compliant members.
            calloutType: insight
            claimRefs:
              - CI002
              - CI003
              - CI004
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture & Member Care Delivery
        blocks:
          - type: paragraph
            body: >-
              Curative operates a differentiated employer-sponsored health insurance product built around the complete
              elimination of in-network cost sharing. The core product offering guarantees $0 deductibles and $0
              copayments for in-network medical visits and eligible prescription drugs, replacing traditional tiered
              coinsurance structures with a single monthly premium paid by the sponsoring employer. To unlock and
              maintain this zero-out-of-pocket benefit, members are operationally required to complete an annual
              Baseline Visit within 120 days of their plan effective date. This Baseline Visit functions as both an
              actuarial gating mechanism and a preventive clinical intake, establishing personalized care plans and
              identifying latent medical risks before they escalate into high-cost acute hospitalizations. To assist
              members throughout their healthcare journey, Curative assigns dedicated Care Navigators who guide provider
              discovery, appointment scheduling, and care continuity across an extensive network of over one million
              in-network healthcare professionals. Point-of-sale out-of-pocket friction at urgent care and mental health
              clinics is addressed through the proprietary Curative Cash Card, which routes funds directly to approved
              facilities without requiring member reimbursement claims.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
              - CE011
              - CE013
      - number: '5.2'
        title: Member Workflows, Care Navigation & Usability
        blocks:
          - type: paragraph
            body: >-
              The member experience begins with a digital onboarding and enrollment workflow designed to drive prompt
              completion of the mandatory preventive screening. Upon enrollment, members access the Curative digital
              portal and mobile application to schedule their Baseline Visit, select primary care physicians, and review
              coverage details. Under standard employer health plans, employees frequently postpone vital routine
              checkups and diagnostic screenings due to uncertainty over deductibles, out-of-pocket maximums, and
              unexpected medical bills. Curative's model removes this financial ambiguity by guaranteeing $0 cost
              sharing for covered services, while providing an extensive drug formulary that supplies tier-1 preferred
              medications at $0 copay, covering approximately 97% of standard clinical conditions. For non-preferred
              pharmaceuticals, members incur predictable flat copayments of $50 or $250 at participating in-network
              pharmacies. To measure and optimize member digital interactions across its onboarding and appointment
              portals, Curative integrated Mouseflow's HIPAA-compliant behavioral analytics platform, tracking attention
              heatmaps, scroll depth, and navigation bottlenecks to drive measurable improvements in portal engagement
              and conversion.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE008
              - CE009
      - number: '5.3'
        title: Underwriting Infrastructure, Technology Stack & RCM Expansion
        blocks:
          - type: paragraph
            body: >-
              Curative's underlying operating infrastructure blends traditional licensed health maintenance organization
              carrier operations with modern cloud data systems. The company holds an A- (Excellent) Financial Strength
              Rating from AM Best for three consecutive years, validating its capital adequacy, balance sheet strength,
              and risk management capabilities across its initial commercial markets in Texas, Florida, and Georgia.
              Technically, Curative relies on cloud datastores, Redis caching, and continuous integration pipelines to
              support its portal and provider verification workflows. Parallel to its health insurance plan operations
              in Austin, recruitment disclosures and technical candidate evaluations indicate that Curative has
              established an affiliated entity, Curative AI, Inc., based in Bellevue, Washington. This team focuses on
              artificial intelligence software-as-a-service applications for Revenue Cycle Management (RCM) and clinical
              decision support. The Bellevue engineering group builds scalable data pipelines using Python, SQL, and
              public cloud infrastructure (AWS, Azure, and GCP) to streamline medical documentation and accelerate
              insurance claims adjudication, reporting signed contracts exceeding $30 million in projected 2025 revenue.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Technical Dependencies, Compliance & Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              While Curative's zero-cost-sharing model provides a powerful marketing wedge, it introduces substantial
              operational and technical dependencies that warrant rigorous diligence. First, the 120-day Baseline Visit
              gating mechanism relies heavily on automated notification systems, provider calendar synchronization, and
              member compliance tracking; any failure in tracking visit completions could result in member friction or
              billing disputes. Second, providing seamless out-of-pocket exemptions via the Curative Cash Card demands
              low-latency point-of-sale card transaction verification against authorized provider registries. Third,
              although Curative manages complex claims adjudication and digital health workflows, it maintains virtually
              no public developer surface, open-source repositories, or externally audited API specifications. Finally,
              the relationship between Curative Health Insurance Company in Austin and Curative AI, Inc. in Bellevue
              requires verification to confirm that health plan protected health information is rigorously partitioned
              under HIPAA guidelines from commercial RCM algorithmic models.
            claimRefs:
              - CE002
              - CE004
              - CE006
              - CE010
              - CE012
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Baseline Visit as an Actuarial and Clinical Gating Mechanism
            body: >-
              Curative's product design hinges on an operational tradeoff: members receive complete $0 cost-sharing only
              if they complete an annual Baseline Visit within 120 days of plan activation. This visit enables early
              clinical triage, aligning financial incentives with preventive care, but also imposes a strict operational
              requirement on member engagement.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Technical and Organizational Boundary Risks in RCM Tooling
            body: >-
              While Curative markets employer health insurance from Austin, recruitment and candidate interview profiles
              disclose an affiliated early-stage Curative AI unit in Bellevue developing SaaS RCM automation tools.
              Diligence must establish whether clinical data and technical infrastructure are cleanly isolated under
              HIPAA compliance standards.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and eligibility
        blocks:
          - type: paragraph
            body: >-
              Curative's economic buyer is the employer selecting a group health plan, while benefits brokers can
              influence or place the plan and enrolled employees use the coverage. The current official Texas page
              separates fully insured and level-funded offers: fully insured plans are aimed at employers with at least
              51 employees, while level-funded eligibility starts at 25 employees in Texas and requires at least 50
              employees and 25 enrolled subscribers in Florida and Georgia. This segmentation creates a defined
              small-to-midsize employer wedge rather than evidence of broad enterprise penetration. Although covered
              employees may access care nationwide, the employer-headquarters eligibility remains geographically
              constrained, so nationwide member access should not be read as nationwide employer availability.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU014
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
