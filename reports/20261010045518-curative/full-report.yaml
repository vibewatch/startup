              - CU013
              - CU014
      - number: '6.3'
        title: Durability, channel leverage, and expansion
        blocks:
          - type: paragraph
            body: >-
              Curative's customer journey is designed around employer purchase, broker placement, employee enrollment, a
              Baseline Visit, ongoing member support, and renewal. Members maintain the advertised zero-cost in-network
              benefit by completing a Baseline Visit within the first 120 days of each plan year, and Curative says
              support is available around the clock. That model may encourage early engagement, but the retained
              evidence does not show whether engagement improves renewal economics or member retention. The broker page
              explicitly frames renewal as an opportunity for advisors to bring clients additional Curative business,
              yet it reports no renewal rate, expansion rate, contract length, NRR, GRR, or churn. Broker enthusiasm
              therefore remains a channel signal rather than proof of durable land-and-expand behavior.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU011
              - CU015
      - number: '6.4'
        title: Concentration and evidence risk
        blocks:
          - type: paragraph
            body: >-
              Customer concentration cannot be assessed from this public record. None of the retained company-relevant
              pages discloses an employer count, enrolled-member count, revenue by customer, top-customer share,
              vertical mix, or renewal cohort. The independent web profiles add little usable customer evidence, and one
              still characterizes Curative as a COVID-19 testing-center platform rather than the current health-plan
              business. Two allocated search results were also unusable for customer diligence: one concerns the
              unrelated curative therapeutics market, while the other fetched page contains citation metadata but no
              customer facts. These limitations increase the risk of confusing discoverability with adoption and make a
              management-provided customer and retention data room essential.
            claimRefs:
              - CU011
              - CU012
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public references do not establish retention
            body: >-
              The retained pool offers two positive testimonials and a broad multi-state expansion claim, but no
              customer count, renewal cohort, contract duration, churn, NRR, GRR, or concentration metric. Customer
              durability remains a management-data diligence item.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Public descriptions establish a broad and changing operating footprint, but they do not establish the
              current state-by-state license roster, the legal entity carrying each insurance risk, or statutory capital
              compliance. Wikipedia reports plan expansion to more than 20 states, while LeadIQ names employer markets
              in Georgia, Florida, and Texas and describes nationwide network ambitions; these statements address
              different scopes and cannot be converted into a verified license count. The clearest adverse event is
              historical: a January 2021 FDA safety communication warned of false-negative risk for Curative's former
              COVID-19 test. Curative later moved to an Abbott assay and requested revocation of the original test
              authorization, so the event is a legacy compliance and liability diligence item, not evidence of a current
              insurance violation. HITRUST r2 is reported, but its current scope and assessment period were not
              available in the assigned sources.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
