  - id: FV001
    title: Recommendation and Underwriting Decision Logic
    type: flow
    summary: Sequential decision pathway mapping member scale, employer demand, and financial opacity to a track stance.
    data:
      nodes:
        - id: step-1
          label: Preventive Health Model
          description: Zero-cost plan contingent on Baseline Visit drives early intervention and claimed member engagement.
        - id: step-2
          label: Commercial Traction
          description: 165,000 members and 1,200 employer clients established across initial regional markets.
        - id: step-3
          label: Underwriting & Capital Burden
          description: State-level statutory reserve requirements and medical loss ratios remain unverified by public filings.
        - id: step-4
          label: Liquidity & Price Verification
          description: Secondary market liquidity is limited on private platforms with no matched pricing.
        - id: step-5
          label: Valuation Assessment
          description: Series B post-money valuation of $1.275B represents a stretched premium without audited unit economics.
        - id: step-6
          label: Investment Recommendation
          description: Assign Track recommendation pending statutory disclosure and audit verification of renewal margins.
        - id: step-7
          label: Kill Criteria & Triggers
          description: Downgrade or terminate coverage if statutory MLR exceeds sustainable thresholds or AM Best rating declines.
      edges:
        - from: step-1
          to: step-2
        - from: step-2
          to: step-3
        - from: step-3
          to: step-4
        - from: step-4
          to: step-5
        - from: step-5
          to: step-6
        - from: step-6
          to: step-7
    approximationNotes: Represents the analytical synthesis sequence from clinical model validation to capital structure gating.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
