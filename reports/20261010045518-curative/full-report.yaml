              - CU015
      - number: '6.2'
        title: Adoption trajectory and customer proof
        blocks:
          - type: paragraph
            body: >-
              The observable adoption trail is directional rather than quantified. A company-issued 2025 release says
              the health plan launched in 2023 and expanded to employers in multiple states, while current official
              pages identify eligible employer geographies and group-size thresholds. The broker page provides the
              clearest attributable customer evidence: a named ECS Holdings president says the results were phenomenal,
              and an unnamed leading Texas benefits broker describes strong employer and employee acceptance. Both
              testimonials are hosted and selected by Curative, however, and neither supplies enrollment, claims,
              savings, utilization, renewal, or cohort data. They establish referenceability, not independently measured
              customer outcomes or a representative customer sample.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
