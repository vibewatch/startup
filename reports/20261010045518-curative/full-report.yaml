        title: Exhibits
        blocks:
          - type: callout
            title: Preventive Care Incentive Alignment
            body: >-
              Curative's $0 copay and deductible plan structure fundamentally hinges on members completing an annual
              Baseline Visit within 120 days. This gatekeeper mechanism aims to lower catastrophic claims by mandating
              early engagement.
            calloutType: insight
            claimRefs:
              - CO001
              - CO002
          - type: callout
            title: Solvency and Reporting Transparency
            body: >-
              While Curative holds an AM Best A- rating, audited statutory financials and underwriting loss ratios are
