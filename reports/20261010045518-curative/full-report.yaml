              - CR011
              - CR013
              - CR016
      - number: '7.3'
        title: Dependencies, financing, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The public record identifies one benefits-marketplace presence through Employee Navigator, but it does not
              quantify channel share or prove that Employee Navigator is Curative's primary distributor. Likewise,
              public product copy requires approved or in-network providers and pharmacies without identifying
              counterparty concentration or continuity protections. Financing evidence is also bounded: 311 Institute
              reports at least $152.5 million based on Form D filings and warns that the figure is a minimum, while
              Tracxn reports $162 million across three rounds. Funding raised is not cash available, statutory surplus,
              or runway. The investment thesis should therefore break if direct diligence shows inadequate risk-based
              capital, persistently uneconomic cohort medical costs, material license deficiencies, low Baseline Visit
              completion, or dependence on a counterparty without a tested replacement path.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Opacity is not proof of distress
            body: >-
              The assigned evidence does not disclose audited medical-loss, reserve, reinsurance, renewal, or
              concentration metrics. That absence prevents underwriting the risk; it does not prove that Curative is
              under-reserved, loss-making, or dependent on any named partner.
            calloutType: risk
            claimRefs:
              - CR016
          - type: callout
            title: Gate further investment on primary diligence
            body: >-
              Require direct regulator, actuary, rating-agency, security-assessor, cohort, and counterparty evidence
              before relying on the public rating and benefit proposition. Funding raised should not be treated as cash
              available, runway, or statutory surplus.
            calloutType: recommendation
            claimRefs:
              - CR012
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Strategic Valuation Positioning
        blocks:
          - type: paragraph
            body: >-
              Curative's core investment thesis centers on disrupting employer-sponsored commercial health insurance
              through an innovative zero-out-of-pocket benefit design. By eliminating deductibles, copayments, and
              coinsurance contingent on an annual preventive Baseline Visit, Curative incentivizes early clinical
              engagement and primary care utilization rather than downstream acute intervention. The company reports
              substantial customer traction, claiming over 1,200 employer clients and more than 165,000 enrolled members
              alongside early operating profitability and an AM Best Financial Strength Rating of A- for three
              consecutive years. However, the anti-thesis highlights the severe structural headwinds facing any
              challenger health plan competing against entrenched incumbents. Operating as a full-risk insurer requires
              heavy statutory capital reserves across new jurisdictions, and providing unrestricted zero-cost care
              exposes the business model to medical loss ratio volatility if catastrophic or chronic claims spike before
              preventive measures yield financial savings.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV011
              - CV013
      - number: '8.2'
        title: Financing History, Capital Structure, and Valuation Multiples
        blocks:
          - type: paragraph
            body: >-
              The financing context for Curative is anchored by its major $150 million Series B funding round, which
              officially pushed the company's post-money valuation past $1.27 billion into unicorn status. Led by TED
              Chairman Chris Anderson's Upside Vision Fund and bolstered by a significant $47.5 million personal and
              fund commitment from JAM Fund's Justin Mateen, the round drew notable institutional backers including
              Galaxy Digital, Duquesne Family Office, and DCVC. Total outside equity financing has reached between
              $152.5 million based on SEC Form D filings and $162 million across three rounds tracked by venture
              databases. Nevertheless, Curative's headline $1.275 billion valuation mark appears stretched on public
              fundamentals because underlying audited revenue run rates, medical loss ratios, and gross margins remain
              closely guarded private information. Furthermore, secondary transaction activity on private platforms such
              as Forge Global remains limited with no matched share pricing available, indicating low liquidity and
              limited independent market price discovery.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear Return Outcomes'
        blocks:
          - type: paragraph
            body: >-
              Scenario modeling evaluates Curative across three distinct operational trajectories. In the Bull case,
              Curative successfully scales its nationwide provider access via the Curative Cash Card, accelerates
              expansion beyond Texas, Florida, and Georgia into Mid-Atlantic markets, and proves that early member
              baseline screening sustainably suppresses hospital admissions and pharmacy expenses, yielding top-quartile
              underwriting margins that justify an expansion to a $2.5 billion valuation. In the Base case, Curative
              maintains healthy regional employer enrollment growth but encounters moderate medical loss ratio
              compression as newer membership cohorts utilize high-cost specialty services, keeping the valuation
              relatively flat near its current $1.275 billion mark while consuming additional balance sheet capital
              reserves. In the Bear case, persistent capital intensity, aggressive pricing pressure from entrenched
              legacy BUCA carriers, and potential regulatory capital friction across state insurance departments trigger
              multiple compression, resulting in an unfavorable down-round or distressed consolidation.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV011
              - CV013
      - number: '8.4'
        title: Exit Pathways, Recommendation Logic, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Synthesizing the public evidence produces a definitive Track recommendation with high overall risk and a
              stretched valuation stance. Curative has undeniably carved out an impressive product wedge with compelling
              employer member adoption and recognized creditworthiness from AM Best, demonstrating genuine commercial
              differentiation. However, entry discipline dictates that prospective investors avoid paying a full unicorn
              multiple without verifying audited underwriting economics. Potential liquidity through an initial public
              offering remains distant, as secondary market trackers confirm that Curative has not publicly endorsed IPO
              plans, and private secondary market activity remains limited. Comprehensive diligence prior to direct
              investment requires examining confidential state statutory insurance filings, inspecting cohort-level
              employer retention rates, and evaluating liquidation preference seniority relative to common
              equityholders. Investors should closely monitor thesis-break triggers, including any deterioration in AM
              Best rating, statutory reserve depletion, or medical loss ratio escalation beyond statutory underwriting
              targets.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Track Pending Audited Underwriting Verification'
            body: >-
              While Curative demonstrates impressive member adoption reaching over 165,000 members and holds an AM Best
              A- rating, the $1.275 billion valuation implies significant forward execution success. Investors should
              maintain a Track recommendation until audited statutory financials confirm sustainable medical loss
              ratios.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV007
          - type: callout
            title: 'Valuation Risk: Capital Intensity of National Risk-Bearing Expansion'
            body: >-
              Scaling full-risk health insurance requires substantial statutory capital reserves across new state
              jurisdictions such as Mid-Atlantic markets. Secondary share liquidity remains limited on Forge Global,
              leaving investors exposed to valuation illiquidity if claims costs escalate.
            calloutType: risk
            claimRefs:
              - CV005
              - CV008
              - CV011
