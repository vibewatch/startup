      - number: '7.2'
        title: Operating-model and execution exposure
        blocks:
          - type: paragraph
            body: >-
              Curative's member proposition depends on execution across enrollment, network access, pharmacy,
              navigation, and preventive engagement. The official site conditions the $0 in-network copay and deductible
              proposition on a Baseline Visit, promotes approved providers and a Cash Card, and limits the broadest
              drug-cost promise to preferred prescriptions; non-preferred prescriptions carry stated copays. Those
              qualifications create measurable execution questions rather than proof of adverse selection or excess
              utilization. The relevant monitoring set is Baseline Visit completion, network adequacy, formulary
              exceptions, grievances, claims turnaround, and cohort medical cost. None of those outcome series appears
              in the assigned evidence. A reported HITRUST r2 certification is a mitigation signal, but without the
              assessment report, scope, exceptions, and renewal date it should not be treated as proof that no breach or
              control weakness exists.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR013
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR009
