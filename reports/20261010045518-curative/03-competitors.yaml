  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: underwriting-and-retention-metrics
      missingEvidence: Audited state-by-state medical loss ratios (MLRs), renewal cohort lapse rates, and broker commission schedules comparing Curative against incumbent carriers like UnitedHealthcare and Aetna are unavailable in public disclosures.
      whyItMatters: Without audited loss-ratio and renewal data, investors cannot verify whether Curative's zero-out-of-pocket preventive-first design achieves sustainable underwriting profitability or faces adverse selection from high-utilization member populations.
      diligencePath: Request state insurance department statutory financial filings (NAIC annual statements) and confidential employer retention cohort reports directly from company leadership during confirmatory diligence.
      relatedQuestionRefs:
        - QP009
