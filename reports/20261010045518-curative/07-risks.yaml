        - "Open litigation, indemnity, settlement, and contract-closeout status is not in the pool"
        - "Obtain a litigation schedule, government-contract closeouts, indemnities, and counsel confirmation of surviving liabilities"
    notes: "Rows are ordered by potential investment consequence, not by a quantified probability model; null public evidence is stated as unverified rather than converted into a risk score."
