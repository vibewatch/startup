        - "Thesis-breaker if a material deficiency exists"
        - "Company-issued materials describe an A- financial-strength rating"
        - "No direct rating report, statutory statements, RBC ratio, or reserve schedule in the pool"
        - "Obtain entity-by-state licenses, NAIC statements, RBC filings, reserve opinions, and the current AM Best report"
      - - "Information-security certification and PHI controls"
        - "Reported enterprise certification; exact scope unknown"
        - "Wikipedia reports HITRUST r2 certification"
        - "Current control-failure likelihood cannot be estimated"
        - "Potentially material because member and clinical data are sensitive"
        - "Reported HITRUST r2 certification"
        - "Assessment scope, exceptions, renewal date, incidents, and vendors remain unverified"
        - "Review the certification letter, assessment scope, exceptions, incident log, BAA inventory, and penetration-test summary"
      - - "Legacy COVID-19 test safety and contract exposure"
