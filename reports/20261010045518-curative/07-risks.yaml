        - "Kill criterion: RBC, reserve, liquidity, or reinsurance diligence falls below the investment committee's minimum"
    notes: "Public sources identify mechanisms and selected counterparties but do not quantify concentration; funding raised is not presented as cash available or statutory surplus."
    claimRefs:
