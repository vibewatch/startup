callouts:
  - calloutType: "risk"
    title: "Opacity is not proof of distress"
    body: "The assigned evidence does not disclose audited medical-loss, reserve, reinsurance, renewal, or concentration metrics. That absence prevents underwriting the risk; it does not prove that Curative is under-reserved, loss-making, or dependent on any named partner."
    claimRefs:
      - "CR016"
  - calloutType: "recommendation"
    title: "Gate further investment on primary diligence"
    body: "Require direct regulator, actuary, rating-agency, security-assessor, cohort, and counterparty evidence before relying on the public rating and benefit proposition. Funding raised should not be treated as cash available, runway, or statutory surplus."
    claimRefs:
      - "CR012"
      - "CR014"
      - "CR015"
      - "CR016"
