schemaVersion: "report-v2"
artifact: "risks"
slug: "curative"
runDate: "2026-10-10"
company:
  name: "Curative"
chapter:
  number: 7
  title: "Risks"
  summary: "The principal diligence risk is evidence opacity rather than a verified current failure: the allocated public record does not disclose audited medical-loss, reserve, reinsurance, renewal, or counterparty-concentration metrics. Curative publicly describes an A- rating, a conditional $0 in-network benefit model, and multiple member-support mechanisms, but the rating evidence in this pool is company-issued and the operating model still requires direct regulatory, actuarial, security, and cohort verification."
sections:
  - id: "regulatory-and-legal"
    title: "Regulatory and legal exposure"
    body: "Public descriptions establish a broad and changing operating footprint, but they do not establish the current state-by-state license roster, the legal entity carrying each insurance risk, or statutory capital compliance. Wikipedia reports plan expansion to more than 20 states, while LeadIQ names employer markets in Georgia, Florida, and Texas and describes nationwide network ambitions; these statements address different scopes and cannot be converted into a verified license count. The clearest adverse event is historical: a January 2021 FDA safety communication warned of false-negative risk for Curative's former COVID-19 test. Curative later moved to an Abbott assay and requested revocation of the original test authorization, so the event is a legacy compliance and liability diligence item, not evidence of a current insurance violation. HITRUST r2 is reported, but its current scope and assessment period were not available in the assigned sources."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-and-model"
    title: "Operating-model and execution exposure"
    body: "Curative's member proposition depends on execution across enrollment, network access, pharmacy, navigation, and preventive engagement. The official site conditions the $0 in-network copay and deductible proposition on a Baseline Visit, promotes approved providers and a Cash Card, and limits the broadest drug-cost promise to preferred prescriptions; non-preferred prescriptions carry stated copays. Those qualifications create measurable execution questions rather than proof of adverse selection or excess utilization. The relevant monitoring set is Baseline Visit completion, network adequacy, formulary exceptions, grievances, claims turnaround, and cohort medical cost. None of those outcome series appears in the assigned evidence. A reported HITRUST r2 certification is a mitigation signal, but without the assessment report, scope, exceptions, and renewal date it should not be treated as proof that no breach or control weakness exists."
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR013"
      - "CR016"
    tableRefs:
      - "TR002"
  - id: "dependencies-and-financial-opacity"
    title: "Dependencies, financing, and thesis-break triggers"
    body: "The public record identifies one benefits-marketplace presence through Employee Navigator, but it does not quantify channel share or prove that Employee Navigator is Curative's primary distributor. Likewise, public product copy requires approved or in-network providers and pharmacies without identifying counterparty concentration or continuity protections. Financing evidence is also bounded: 311 Institute reports at least $152.5 million based on Form D filings and warns that the figure is a minimum, while Tracxn reports $162 million across three rounds. Funding raised is not cash available, statutory surplus, or runway. The investment thesis should therefore break if direct diligence shows inadequate risk-based capital, persistently uneconomic cohort medical costs, material license deficiencies, low Baseline Visit completion, or dependence on a counterparty without a tested replacement path."
    claimRefs:
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
