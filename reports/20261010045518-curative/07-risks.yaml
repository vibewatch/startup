        - "The $0 in-network proposition could be uneconomic if engagement does not improve total cost"
        - "Audited MLR, pricing cohorts, claims triangles, reserve development, reinsurance, and renewal economics"
      - - "Members fail to complete or understand the Baseline Visit condition"
        - "Not disclosed"
        - "Material if completion or satisfaction is low"
        - "Care Navigator and 24/7 Member Services are publicly described"
        - "A conditional headline benefit can create friction if qualification is missed"
        - "Completion rate, outreach conversion, complaints, appeals, and retention by completion cohort"
      - - "Network or formulary execution fails to deliver the advertised cost experience"
        - "Not disclosed"
        - "Material if access gaps are broad"
        - "Approved-provider, in-network pharmacy, Cash Card, and tiered formulary mechanisms are described"
        - "Provider availability, exception handling, and non-preferred drug costs can differ from the headline"
        - "Network-adequacy files, provider termination trends, formulary exceptions, grievances, and surprise-bill data"
      - - "Security controls do not cover a material system or vendor"
        - "Not estimable from certification mention alone"
        - "Potentially material"
        - "HITRUST r2 certification is reported"
        - "Certification does not establish incident absence or complete vendor coverage"
        - "Assessment scope, exceptions, SOC reports, vendor inventory, and current incident history"
    notes: "The register separates publicly described mitigations from missing outcome evidence; no likelihood percentage, loss ratio, incident count, or cost estimate is inferred."
