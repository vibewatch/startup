callouts:
  - calloutType: "insight"
    title: "The Baseline Visit as an Actuarial and Clinical Gating Mechanism"
    body: "Curative's product design hinges on an operational tradeoff: members receive complete $0 cost-sharing only if they complete an annual Baseline Visit within 120 days of plan activation. This visit enables early clinical triage, aligning financial incentives with preventive care, but also imposes a strict operational requirement on member engagement."
    claimRefs:
      - "CE001"
      - "CE002"

  - calloutType: "risk"
    title: "Technical and Organizational Boundary Risks in RCM Tooling"
    body: "While Curative markets employer health insurance from Austin, recruitment and candidate interview profiles disclose an affiliated early-stage Curative AI unit in Bellevue developing SaaS RCM automation tools. Diligence must establish whether clinical data and technical infrastructure are cleanly isolated under HIPAA compliance standards."
