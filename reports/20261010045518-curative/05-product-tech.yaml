chapter:
  number: 5
  title: "Product & Technology"
  summary: "Curative delivers an employer-sponsored health plan eliminating in-network out-of-pocket costs and deductibles via an annual Baseline Visit, Care Navigator support, and the Curative Cash Card. The platform combines digital member navigation and provider payment infrastructure with an AM Best A- rated underwriting model, while expanding into AI-driven revenue cycle management and clinical operations."
sections:
  - id: "product-architecture-and-delivery"
    title: "Product Architecture & Member Care Delivery"
    body: "Curative operates a differentiated employer-sponsored health insurance product built around the complete elimination of in-network cost sharing. The core product offering guarantees $0 deductibles and $0 copayments for in-network medical visits and eligible prescription drugs, replacing traditional tiered coinsurance structures with a single monthly premium paid by the sponsoring employer. To unlock and maintain this zero-out-of-pocket benefit, members are operationally required to complete an annual Baseline Visit within 120 days of their plan effective date. This Baseline Visit functions as both an actuarial gating mechanism and a preventive clinical intake, establishing personalized care plans and identifying latent medical risks before they escalate into high-cost acute hospitalizations. To assist members throughout their healthcare journey, Curative assigns dedicated Care Navigators who guide provider discovery, appointment scheduling, and care continuity across an extensive network of over one million in-network healthcare professionals. Point-of-sale out-of-pocket friction at urgent care and mental health clinics is addressed through the proprietary Curative Cash Card, which routes funds directly to approved facilities without requiring member reimbursement claims."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    figureRefs:
      - "FE001"
    tableRefs:
      - "TE001"

  - id: "workflow-and-care-navigation"
    title: "Member Workflows, Care Navigation & Usability"
    body: "The member experience begins with a digital onboarding and enrollment workflow designed to drive prompt completion of the mandatory preventive screening. Upon enrollment, members access the Curative digital portal and mobile application to schedule their Baseline Visit, select primary care physicians, and review coverage details. Under standard employer health plans, employees frequently postpone vital routine checkups and diagnostic screenings due to uncertainty over deductibles, out-of-pocket maximums, and unexpected medical bills. Curative's model removes this financial ambiguity by guaranteeing $0 cost sharing for covered services, while providing an extensive drug formulary that supplies tier-1 preferred medications at $0 copay, covering approximately 97% of standard clinical conditions. For non-preferred pharmaceuticals, members incur predictable flat copayments of $50 or $250 at participating in-network pharmacies. To measure and optimize member digital interactions across its onboarding and appointment portals, Curative integrated Mouseflow's HIPAA-compliant behavioral analytics platform, tracking attention heatmaps, scroll depth, and navigation bottlenecks to drive measurable improvements in portal engagement and conversion."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE002"

  - id: "operating-infrastructure-and-rcm"
    title: "Underwriting Infrastructure, Technology Stack & RCM Expansion"
    body: "Curative's underlying operating infrastructure blends traditional licensed health maintenance organization carrier operations with modern cloud data systems. The company holds an A- (Excellent) Financial Strength Rating from AM Best for three consecutive years, validating its capital adequacy, balance sheet strength, and risk management capabilities across its initial commercial markets in Texas, Florida, and Georgia. Technically, Curative relies on cloud datastores, Redis caching, and continuous integration pipelines to support its portal and provider verification workflows. Parallel to its health insurance plan operations in Austin, recruitment disclosures and technical candidate evaluations indicate that Curative has established an affiliated entity, Curative AI, Inc., based in Bellevue, Washington. This team focuses on artificial intelligence software-as-a-service applications for Revenue Cycle Management (RCM) and clinical decision support. The Bellevue engineering group builds scalable data pipelines using Python, SQL, and public cloud infrastructure (AWS, Azure, and GCP) to streamline medical documentation and accelerate insurance claims adjudication, reporting signed contracts exceeding $30 million in projected 2025 revenue."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"

  - id: "technical-risks-and-compliance"
    title: "Technical Dependencies, Compliance & Diligence Gaps"
    body: "While Curative's zero-cost-sharing model provides a powerful marketing wedge, it introduces substantial operational and technical dependencies that warrant rigorous diligence. First, the 120-day Baseline Visit gating mechanism relies heavily on automated notification systems, provider calendar synchronization, and member compliance tracking; any failure in tracking visit completions could result in member friction or billing disputes. Second, providing seamless out-of-pocket exemptions via the Curative Cash Card demands low-latency point-of-sale card transaction verification against authorized provider registries. Third, although Curative manages complex claims adjudication and digital health workflows, it maintains virtually no public developer surface, open-source repositories, or externally audited API specifications. Finally, the relationship between Curative Health Insurance Company in Austin and Curative AI, Inc. in Bellevue requires verification to confirm that health plan protected health information is rigorously partitioned under HIPAA guidelines from commercial RCM algorithmic models."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE006"
      - "CE010"
      - "CE012"
      - "CE014"

