  title: "Financials"
  summary: "Curative packages employer health insurance as a monthly subscription featuring $0 in-network out-of-pocket costs tied to a mandatory 120-day preventive baseline visit, projecting $570 million in 2026 revenue with near-term profitability ambitions, while internal software automation reduces contracting costs but increases cloud compute expenditure."
sections:
  - id: "commercial-revenue-streams"
    title: "Commercial Revenue Streams and Monetization Model"
    body: "Curative operates primarily as an employer-sponsored health insurance provider, monetizing its plans through competitive monthly per-employee-per-month (PEPM) premiums paid by corporate plan sponsors. In exchange for predictable monthly subscription billing, enrolled employees gain access to in-network primary care, specialist consultations, and preferred generic medications at $0 copays and $0 deductibles. This commercial proposition shifts financial risk away from volatile employee point-of-care cost-sharing into an actuarially pooled employer premium structure. To preserve underwriting viability and discourage moral hazard, Curative conditions its zero-deductible coverage on members completing an annual preventive baseline visit within their first 120 days of enrollment. Members who miss this checkup forfeit zero-dollar coverage, triggering fallback deductibles of up to $5,000 for individuals and $10,000 for family plans. Ancillary revenue streams include tiered copayments of $50 or $250 for non-preferred brand prescriptions, as well as pass-through processing fees on retail clinic cash card programs."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI004"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "gtm-distribution-and-cost-structure"
    title: "GTM Distribution Motion and Internal Operating Cost Structure"
    body: "Curative's go-to-market motion targets mid-sized and large self-funded and fully insured employers across Texas, Florida, and Georgia, leveraging regional employee benefits brokers and direct enterprise sales teams. Because switching corporate health plans involves multi-month procurement cycles, broker alignment and predictable premium quotes serve as critical distribution levers. On the operating expense side, Curative has aggressively restructured its administrative cost profile by internalizing core software development. The company terminated a $600,000 annual Salesforce CRM contract after building an internal replacement in two months with AI-assisted software generation. Additionally, Curative deployed an automated agent named Gwen to negotiate doctor and provider network contracts, driving down average administrative contracting costs from $1,500-$2,000 per contract to approximately $70. However, management acknowledged that these internal development initiatives have driven Anthropic cloud compute expenses into millions of dollars monthly, trading vendor license fees for substantial ongoing infrastructure compute spend."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs: []
    figureRefs: []
  - id: "public-traction-and-unit-economics"
    title: "Public Commercial Traction and Unit Economics Realities"
    body: "Public disclosures indicate meaningful commercial adoption, with Curative reporting over 165,000 active covered members across approximately 1,200 employer groups. The company projected top-line revenue of $570 million for calendar year 2026, alongside expectations of achieving its first post-pandemic operating profitability. A pivotal unit economics driver in Curative's model is its reported 98% member compliance rate for annual baseline preventive visits. Executive leadership argues that upfront primary-care consultations uncover chronic conditions such as diabetes and hypertension early, reducing long-tail catastrophic inpatient claims within six to twelve months. Nonetheless, independent observers and competitors emphasize that private underwriting details remain heavily shielded. Crucial unit-economics benchmarks—including net customer acquisition cost (CAC), gross medical loss ratio (MLR), average PEPM realized yield, and multi-year employer retention cohorts—remain private and unverified by statutory audits, preventing definitive third-party confirmation of long-term underwriting profitability."
    claimRefs:
      - "CI003"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI003"
    figureRefs: []
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy, Balance Sheet Reserves, and Financial Diligence Verdict"
    body: "Curative has amassed substantial financial backing to support its regulated insurance operations, raising at least $152.5 million to $162 million in aggregate venture capital across its Form D filings and funding records. The company's latest equity round in late 2025 secured more than $150 million in Series B capital at an estimated $1.28 billion post-money valuation, led by Upside Vision Fund with participation from institutional investors including DCVC. Furthermore, Curative maintains an A- (Excellent) Financial Strength Rating from AM Best for three consecutive years, affirming adequate risk-adjusted balance sheet capitalization and liquidity for statutory claims obligations. From an investment diligence standpoint, Curative demonstrates impressive member scale, robust capital adequacy, and innovative operational automation. However, underwriting approval must remain gated until prospective backers can inspect audited statutory loss ratios, state-specific reserve buffers, and multi-year employer renewal retention cohorts to confirm that zero-deductible benefits deliver sustainable underwriting margins."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
    tableRefs: []
    figureRefs: []
