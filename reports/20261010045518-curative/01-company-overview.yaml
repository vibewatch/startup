chapter:
  number: 1
  title: "Company Overview"
  summary: "Curative is an Austin-based employer health insurance provider founded in 2020 that eliminates in-network copays and deductibles upon completion of an annual baseline visit. The company achieved a $1.28 billion valuation in Series B financing, maintains four consecutive years of AM Best A- financial strength ratings, and operates as a private carrier requiring primary verification of reserves and underwriting metrics."
sections:
  - id: "identity-and-business-model"
    title: "Company Identity and Plan Architecture"
    body: "Curative is an Austin, Texas-based employer health insurer founded in 2020 that offers commercial coverage built around an innovative preventive-first cost structure [CO001]. Under the company's plan model, enrolled employees experience zero-dollar copayments and zero-dollar deductibles for in-network medical appointments and preferred prescription drugs, replacing traditional deductible thresholds with a single monthly premium [CO001]. To activate and maintain this full coverage tier, members must complete an annual comprehensive Baseline Visit with a primary care clinician within the first 120 days of the plan's effective start date [CO002]. Curative pairs this preventive gate with a proprietary Curative Cash Card to facilitate upfront payments and eliminate friction at approved medical providers, aiming to lower downstream hospitalization costs by driving early clinical intervention [CO014]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership and Key-Person Structure"
    body: "Curative was established in 2020 under the co-founding leadership of Chief Executive Officer Fred Turner and Chief Technology Officer Isaac Turner, who initially built diagnostic automation platforms before redirecting corporate assets toward commercial health insurance [CO003]. Executive operations and statutory insurance functions are led by President and Chief Financial Officer Tami Wilson-Ciranna, who oversees financial discipline, balance sheet capitalization, and ongoing engagements with state insurance departments and credit rating agencies [CO004]. The executive team balances technological software integration with actuarial risk management, although the high degree of key-person reliance on co-founder Fred Turner for public representation and strategic direction represents an ongoing corporate governance consideration [CO003]."
    claimRefs:
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investor-syndicate"
    title: "Capitalization, Valuation, and Stakeholders"
    body: "Curative's capital foundation expanded substantially through institutional venture financing, culminating in a Series B round that secured more than $150 million and established a post-money valuation mark of approximately $1.28 billion [CO007]. Form D filings with the U.S. Securities and Exchange Commission confirm that the company has raised at least $152.5 million in outside equity capital, while independent tracking by Tracxn records total cumulative funding of $162 million across three venture financing rounds [CO008, CO009]. The company's cap table includes institutional venture capital backers such as DCVC, Refactor Capital, and Upside Vision Fund, alongside founding leadership equity [CO009]. However, specific ownership percentages, liquidation preferences, and board voting control mechanisms remain private [CO007]."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO003"
  - id: "corporate-evolution-and-risk-factors"
    title: "Corporate Evolution and Operational Risks"
    body: "Curative's operational evolution demonstrates a rapid pivot from high-volume COVID-19 diagnostic testing infrastructure into an employer health insurance carrier launched commercially in 2023 across Texas, Florida, and Georgia [CO005, CO006]. The company has solidified its underwriting credibility by securing an A- (Excellent) Financial Strength Rating from AM Best reaffirmed across four consecutive years through 2026 [CO010]. Because Curative remains a closely held private startup, verified GAAP revenues and underwriting loss ratios are not disclosed in public SEC EDGAR filings, distinguishing Curative from OTC-quoted namesake entity Curative Biotechnology (CUBTD) which withdrew its registration statement via Form RW in late 2025 [CO011]. Current organizational scale estimates show wide divergence across third-party trackers, ranging from 1,041 tracked personnel to modeled employer tiers of up to 5,000 employees [CO012], leaving statutory loss reserves and member retention cohorts as critical private diligence items [CO013]."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    figureRefs:
      - "FO001"
