evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-board
    missingEvidence: Complete board of directors roster, independent director seats, and voting control distribution post-Series B.
    whyItMatters: >-
      Investor protections, liquidation preferences, and founder control cannot be verified without board and charter
      disclosures.
    diligencePath: >-
      Request verified board minutes, investor rights agreements, and certificate of incorporation during formal
      confirmatory diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: stakeholder-cap-table
    missingEvidence: >-
      Fully diluted capitalization table detailing ownership stakes of DCVC, Refactor Capital, Upside Vision Fund, and
      management options.
    whyItMatters: >-
      Economic ownership dilution, secondary transaction terms, and liquidation waterfall seniority impact valuation
      defensibility.
    diligencePath: Obtain authenticated Carta or cap table export directly from company management.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: underwriting-financials
    missingEvidence: >-
      Audited statutory annual financial statements, medical loss ratio (MLR), premium revenues, and balance sheet
      capital reserves for 2025 and 2026.
    whyItMatters: >-
      Health insurance carriers face strict solvency and capital adequacy mandates that dictate capacity for member
      expansion.
    diligencePath: Request state insurance department filings or audited NAIC statutory financial statements.
  - type: missing-source
    severity: material
    topic: market-denominators
    missingEvidence: >-
      A current government, industry-association, or insurer filing that quantifies the relevant U.S. employer-sponsored
      premium or covered-lives pool using a boundary comparable to Curative's offer.
    whyItMatters: >-
      Without a relevant top-down denominator, a numeric TAM would import an unsupported market definition and create
      false precision.
    diligencePath: >-
      Obtain current federal employer-coverage statistics and state insurance filings, then reconcile their populations
      and spend definitions to Curative's fully insured and level-funded products.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: market-denominators
    missingEvidence: >-
      Current employer accounts, covered lives by state and plan, quoted and realized premiums, broker pipeline
      conversion, Baseline completion, and renewal cohorts.
    whyItMatters: >-
      These inputs are needed to convert geographic availability into a serviceable and obtainable market and to test
      whether adoption is durable.
    diligencePath: >-
      Request a management cohort pack reconciled to statutory filings, including employer wins and losses, member
      census, premium, retention, and medical and pharmacy performance by state and plan.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: minor
    topic: category-conflict
    missingEvidence: >-
      A current independent company classification that separates Curative's employer-health-plan operations from its
      historical COVID-19 testing business.
    whyItMatters: Stale category labels can produce irrelevant peers, market estimates, and valuation benchmarks.
    diligencePath: >-
      Reconcile current state insurance registrations and statutory entity filings with the operating-company and
      product structure presented by management.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: material
    topic: underwriting-and-retention-metrics
    missingEvidence: >-
      Audited state-by-state medical loss ratios (MLRs), renewal cohort lapse rates, and broker commission schedules
      comparing Curative against incumbent carriers like UnitedHealthcare and Aetna are unavailable in public
      disclosures.
    whyItMatters: >-
      Without audited loss-ratio and renewal data, investors cannot verify whether Curative's zero-out-of-pocket
      preventive-first design achieves sustainable underwriting profitability or faces adverse selection from
      high-utilization member populations.
    diligencePath: >-
      Request state insurance department statutory financial filings (NAIC annual statements) and confidential employer
      retention cohort reports directly from company leadership during confirmatory diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: underwriting-reserves
    missingEvidence: >-
      Audited statutory financial statements showing medical loss ratios (MLR), claims reserves, and risk-based capital
      (RBC) surplus by operating entity.
    whyItMatters: >-
      Without audited MLR data, underwriting margins cannot be verified independently against the $0 deductible baseline
      visit thesis.
    diligencePath: >-
      Obtain state insurance department statutory filings (Texas Department of Insurance, Florida OIR) or confidential
      financial audit disclosures from Curative.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: employer-retention
    missingEvidence: Historical employer group renewal cohorts, net revenue retention rates, and churn percentages by plan tier.
    whyItMatters: >-
      Commercial durability depends on whether employers renew multi-year contracts or encounter broker resistance upon
      premium re-rating.
    diligencePath: Request customer cohort retention matrices and broker commission schedules during underwriting diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: entity-architecture-and-data-isolation
    missingEvidence: >-
      Architectural documentation, shared-service agreements, and technical data-isolation safeguards separating
      Curative Health Insurance Company (Austin, TX) and Curative AI, Inc. (Bellevue, WA).
    whyItMatters: >-
      Without public clearinghouse architecture disclosures or technical whitepapers, investors cannot confirm whether
      member PHI and insurance claims data are partitioned from commercial SaaS RCM algorithms under HIPAA rules.
    diligencePath: >-
      Request Curative's System and Organization Controls (SOC 2 Type II) compliance report, HIPAA third-party security
      assessment, and inter-entity technology licensing agreements.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Employer renewal cohorts, member retention, NRR, GRR, churn, contract length, and satisfaction measures by product
      and state.
    whyItMatters: >-
      Without cohort retention evidence, positive testimonials cannot establish durable employer adoption or recurring
      premium quality.
    diligencePath: >-
      Request monthly employer and member cohorts by effective date, product, state, broker, renewal status, and
      lost-account reason, reconciled to premium records.
    relatedQuestionRefs:
      - QU006
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: >-
      Current employer count, enrolled-member count, premium and revenue concentration by top customer, state, vertical,
      product, and broker.
    whyItMatters: >-
      Geographic expansion does not reveal whether the book is diversified or dependent on a small number of employers
      or intermediaries.
    diligencePath: >-
      Obtain an anonymized customer ledger with employer, members, premium, product, geography, broker, start date,
      renewal date, and top-10 concentration.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete employer roster and independently referenceable production deployments with quantified utilization,
      savings, satisfaction, and renewal outcomes.
    whyItMatters: >-
      One named company-hosted testimonial and one anonymous broker quotation cannot establish the breadth or
      representativeness of customer success.
    diligencePath: >-
      Select at least five reference calls across product, state, group size, tenure, and broker, including one churned
      or non-renewed employer.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-outcomes
    missingEvidence: >-
      Independent evidence linking the Baseline Visit and zero-cost design to utilization, claims, employer savings,
      absenteeism, or health outcomes.
    whyItMatters: >-
      The public mechanism is clear, but its economic and clinical value for employers remains a company claim without a
      comparable control or denominator.
    diligencePath: >-
      Request actuarial studies, claims analyses, and employer-level pre/post comparisons with definitions,
      denominators, confidence intervals, and independent validation.
    relatedQuestionRefs:
      - QU003
      - QU004
  - type: private-evidence-only
    severity: material
    topic: licensure-and-solvency
    missingEvidence: >-
      Current entity-by-state insurance and administrator licenses, NAIC statutory statements, risk-based capital
      ratios, actuarial reserve opinions, and the direct AM Best rating report.
    whyItMatters: >-
      These primary records determine whether the underwriting entities are authorized and sufficiently capitalized;
      company-issued rating language cannot replace them.
    diligencePath: >-
      Request the license matrix and primary filings, then verify licenses with each applicable regulator and obtain the
      current AM Best report directly.
    relatedQuestionRefs:
      - QR001
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: insurance-economics
    missingEvidence: >-
      Audited medical-loss ratios, claims triangles, reserve development, reinsurance attachment points and limits,
      pricing cohorts, renewal economics, and statutory liquidity.
    whyItMatters: >-
      Without these records, investors cannot test whether the conditional first-dollar benefit model is sustainable or
      whether reported funding remains available.
    diligencePath: >-
      Commission actuarial and insurance-accounting review of five years of statutory statements, cohort claims, reserve
      development, reinsurance treaties, and liquidity forecasts.
    relatedQuestionRefs:
      - QR002
      - QR007
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: member-outcomes
    missingEvidence: >-
      Baseline Visit completion, utilization, medical-cost trend, grievances, appeals, retention, and satisfaction by
      enrollment cohort.
    whyItMatters: The public product mechanics do not demonstrate that preventive engagement improves outcomes or lowers total cost.
    diligencePath: >-
      Obtain de-identified cohort dashboards and reconcile them to claims and renewal files with an independent
      actuarial reviewer.
    relatedQuestionRefs:
      - QR004
      - QR007
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: counterparty-concentration
    missingEvidence: >-
      Distribution-channel share, provider and pharmacy counterparty concentration, service levels, termination rights,
      pricing protections, and tested replacement plans.
    whyItMatters: >-
      A visible marketplace listing and product mechanisms do not establish diversification or continuity under
      counterparty failure.
    diligencePath: >-
      Build a counterparty register ranked by enrollment, claims, spend, and switching time; review contracts and test
      replacement scenarios.
    relatedQuestionRefs:
      - QR006
      - QR007
      - QR009
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Current HITRUST assessment scope, exceptions, renewal date, security incidents, vendor coverage, SOC reports, and
      penetration-test remediation.
    whyItMatters: >-
      A certification mention does not prove complete system coverage, current control operation, or absence of
      incidents.
    diligencePath: >-
      Have a security specialist review the assessor report, control exceptions, incident register, critical vendors,
      and remediation evidence.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: minor
    topic: legacy-diagnostics-liabilities
    missingEvidence: >-
      Final litigation schedule, government-contract closeouts, indemnities, settlements, and surviving obligations from
      the former COVID-19 testing business.
    whyItMatters: >-
      The historical FDA warning is verified, but the assigned evidence does not establish whether any liabilities
      survived the operational pivot.
    diligencePath: >-
      Obtain outside-counsel confirmation and reconcile open matters to audited contingent-liability and
      contract-closeout schedules.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials-and-reserves
    missingEvidence: >-
      Audited GAAP financial statements, statutory health insurance filings, and state-by-state medical loss ratios
      (MLR) for 2025 and 2026.
    whyItMatters: >-
      Determines whether the reported profitability and $1.275 billion valuation are supported by sound underwriting
      margins or masked by delayed claims processing.
    diligencePath: >-
      Request regulatory statutory annual statements filed with Texas, Florida, and Georgia state insurance departments
      and NAIC capital adequacy reports.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: material
    topic: secondary-market-liquidity
    missingEvidence: Secondary trade transaction prices, transaction volume, and Series B liquidation preference structure.
    whyItMatters: >-
      Clarifies exit liquidity and downside protections for prospective investors given Forge Global indicates limited
      market activity and unavailable pricing.
    diligencePath: >-
      Review the amended certificate of incorporation and investor rights agreements via private secondary broker
