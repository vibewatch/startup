chapter:
  number: 4
  title: "Financials"
  summary: "Socure reports strong recurring-revenue traction, including $340M+ of Q1 2026 ARR and third-party-reported Q2 ARR of $364M, but the assigned public evidence does not provide audited revenue, gross margin, cash burn, or runway. The August 2026 financing adds capital, yet its undisclosed primary-versus-secondary split and conflicting lifetime-funding totals prevent a reliable capital-adequacy conclusion."
sections:
  - id: "revenue-quality-and-traction"
    title: "Revenue quality and reported traction"
    body: >-
      The clearest public description of monetization is Crunchbase News's report that
      Socure combines usage- and transaction-based SaaS. That establishes a volume-linked
      recurring model, but not list prices, realized prices, minimum commitments, contract
      duration, revenue recognition, or product-level mix. Socure's own Q1 headline reported
      more than $340 million of total ARR and 62% year-over-year "profitable growth"; independent
      coverage then reported $364 million of Q2 ARR, up 63% year over year. These are ARR
      disclosures rather than audited accounting revenue. The homepage's claim of more than
      3,000 customers supports commercial breadth, while GlobalData's description of identity,
      fraud, sanctions, and risk-decisioning products suggests several monetizable workflows.
      None of the reviewed sources allocates ARR among those workflows, so mix quality and
      revenue concentration remain unquantified.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI005"
      - "CI013"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "unit-economics-and-delivery-cost"
    title: "Unit economics and delivery-cost visibility"
    body: >-
      FinTech Global reported 133% net dollar retention and 0.01% logo churn for Q2 2026
      across a customer base exceeding 3,000. Those company-originated operating metrics point
      to expansion and low reported attrition, but the evidence does not disclose the
      calculation methodology, cohort boundary, gross retention, or customer concentration.
      More importantly, no assigned source supplies CAC, sales-cycle length, payback, gross
      margin, data-acquisition expense, compute expense, manual-review cost, working capital,
      or capital expenditure. The resulting underwriting problem is not evidence of weak
      economics; it is an inability to bridge activity and ARR into accounting revenue and
      gross profit. StateScoop's account of New York scrutiny also identifies a possible
      compliance and procurement burden, while recording Socure's rebuttal. No public evidence
      reviewed here quantifies that burden or proves a contract loss.
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI014"
      - "CI015"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-verdict"
    title: "Capital adequacy and financial verdict"
    body: >-
      The August 2026 transaction was reported as a $156 million strategic growth investment
      at a $5.2 billion valuation. It included both primary capital and an employee secondary
      tender, but Crunchbase News said the allocation was not disclosed; therefore the headline
      amount cannot be treated as cash added to the balance sheet. Tracxn separately records
      $95 million of conventional debt from March 2023, without evidence here on the current
      balance, covenants, maturity, or availability. Lifetime-funding databases also disagree:
      Crunchbase News reports more than $742 million of disclosed funding, Tracxn reports
      $650 million across 15 rounds, and Multiples reports $803 million across nine rounds.
      Those figures should not be substituted for cash available. The financial verdict is
      consequently positive on reported ARR growth and retention, but unresolved on revenue
      quality, margin conversion, capital intensity, liquidity, and runway until audited
      statements and financing documents are reviewed.
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI015"
      - "CI016"
