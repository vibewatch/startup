    columns:
      - "Alternative"
      - "Public commercial signal"
      - "Included scope signal"
      - "Unknowns"
      - "Diligence implication"
    rows:
      - ["Socure", "No official rate card in assigned evidence; comparison source calls pricing undisclosed", "Broad RiskOS and compliance suite", "Realized unit rates, minimums, implementation fees, discounts and module boundaries", "Request cohort-specific proposal and full three-year TCO"]
      - ["Jumio", "RFP.wiki describes custom per-verification enterprise contracts and says estimates are not official", "IDV plus optional AML, liveness and support modules", "Official rates, annual minimums, overages, services and add-on schedule", "Model volume tiers, retries, unused commitment and implementation"]
      - ["ComplyAdvantage", "FluxForce claims a starter tier around $99 per month and custom enterprise pricing", "Entry screening versus enterprise monitoring scope", "Current official eligibility, usage limits, enterprise rates and add-ons", "Verify directly; do not use competitor copy as a quote"]
      - ["FluxForce", "Its own comparison says pricing is not publicly disclosed", "Deployment scope described as integrated AML and investigation", "Price basis, implementation, data-provider costs and production references", "Require independent references and a line-item quote"]
    notes: >-
      Pricing signals are source-attributed and not normalized because units, contract
      scope and verification volumes differ; no competitor-authored price is treated as an
      independently verified offer.
    claimRefs: ["CP008", "CP012", "CP013"]
figures:
  - id: "FP001"
    title: "Ordinal competitive positioning by workflow breadth and onboarding specialization"
    type: "quadrant"
    summary: >-
      Analyst-coded 1-5 positions place Socure toward the high-breadth, high-onboarding
      corner, with adjacent AML platforms scoring lower on onboarding specialization.
    data:
      points:
        - label: "Socure"
          x: 5
          y: 5
          detail: "Broad identity, fraud, compliance and decisioning surface with a clear onboarding core."
        - label: "Jumio"
          x: 3
          y: 4
          detail: "Strong IDV and document scope in RFP.wiki, with optional adjacent modules."
        - label: "ComplyAdvantage"
          x: 4
          y: 1
          detail: "Broad AML workflow but comparison sources say identity proofing is outside the core."
        - label: "FluxForce"
          x: 4
          y: 1
          detail: "Claims broad AML investigation scope without a document-verification core."
        - label: "Other IDV peers"
          x: 2
          y: 4
          detail: "Krowdbase lists multiple IDV alternatives, but comparative breadth is not established."
        - label: "Multi-vendor stack"
          x: 5
          y: 3
          detail: "Combines specialist tools at the cost of integration and operational coordination."
    approximationNotes: >-
      Ordinal analyst scores, not measured market data: x=workflow breadth and y=onboarding
      identity specialization, each from 1 (low) to 5 (high). Scores synthesize assigned
      official, review and competitor sources; competitor-issued assertions are discounted,
      and no distance should be interpreted as a measured performance difference.
    claimRefs: ["CP005", "CP014", "CP015"]
callouts:
  - calloutType: "risk"
    title: "A platform claim is not a comparative benchmark"
    body: >-
      Socure's breadth and adoption claims are relevant, but investment-grade differentiation
      still requires matched-cohort tests of approval, fraud capture, false positives,
      latency, manual-review rate, and total operating cost against direct and adjacent options.
    claimRefs: ["CP001", "CP002", "CP003", "CP007", "CP009"]
