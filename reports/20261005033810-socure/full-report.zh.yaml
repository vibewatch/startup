  - id: FE001
    title: 证据边界内的产品架构技术栈
    type: stack
    summary: 该技术栈将面向客户的界面、决策产品、实现信号和未解决的控制证据分开，不声称这是经审计的生产拓扑。
    data:
      layers:
        - label: 客户体验
          detail: 当前设计材料提到自助入驻、仪表盘、托管界面、案件管理、使用情况可见性和智能代理体验。
          items:
            - label: 评估与设置
              detail: 探索、账户设置、配置和生产就绪流程。
            - label: 持续运营
              detail: 决策状态、使用情况可见性、案件管理、错误和恢复。
        - label: 集成
          detail: 产品体验将 API 和技术文档与 API 密钥、测试身份及沙盒测试连接起来。
          items:
            - label: 外部接口
              detail: API 和托管界面是已披露的产品界面。
            - label: 后端协议
              detail: 当前工程岗位提到 REST 和 gRPC，但没有公开的端点清单。
        - label: 决策产品
          detail: RiskOS 是覆盖身份、欺诈、商业、合规、年龄和身份认证工作流的共同营销决策层。
          items:
            - label: RiskOS 工作流
              detail: 可组合决策是公司的核心主张。
            - label: 欺诈与身份模块
              detail: GlobalData 列出欺诈、支付风险、交易监控和 KYB 能力。
            - label: 文档验证
              detail: 当前岗位描述了采集、处理、验证和模型集成。
        - label: 服务执行
          detail: 招聘材料指向分布式服务、Go、微服务、REST API 和非功能性工程要求。
          items:
            - label: 分布式后端
              detail: 可扩展性、可用性、性能和安全性被列为工程职责。
            - label: DocV 服务
              detail: 后端 API 将文档工作流连接至 ML 和计算机视觉组件。
        - label: 数据与 ML 管道
          detail: 当前数据岗位描述了批量和流式摄取、ML 特征工程、分析、监控和恢复。
          items:
            - label: 批处理
              detail: Spark 和 AWS 服务被列为期望的实现经验。
            - label: 流处理
              detail: Kafka 或 Kinesis 被列为优先的近实时经验。
        - label: 控制与遥测
          detail: 隐私、安全、人类监督、安全信息处理、测试、监控和事件响应被列为要求，而非已验证结果。
          items:
            - label: 信任控制
              detail: PII 保护和负责任 AI 是明确的岗位要求。
            - label: 未验证证据
              detail: 指定资料池中没有 SLA、认证、事件历史、模型评估和控制测试结果。
    approximationNotes: 这是对已披露产品界面和招聘信号的分析性分层，不是 Socure 发布的生产架构。
    claimRefs:
      - CE003
      - CE005
      - CE007
      - CE008
      - CE012
      - CE016
  - id: FU001
    title: 企业客户生命周期与扩张旅程
    type: journey-map
    summary: 展示企业客户从初始 KYC 合规试点，到自动化 RiskOS 编排，再到入驻后的扩张这一典型生命周期。
    data:
      nodes:
        - label: 阶段 1：探索与高管对齐
          description: 企业买方通过顾问式销售参与；客户经理与首席风险官（CRO）和 CISO 会面，确定 ROI 指标与合规框架。
          touchpoints:
            - Executive discovery with CRO and CISO
            - Stakeholder mapping across fraud and compliance
            - Review of regulatory mandates (FCRA, BSA, PATRIOT Act)
        - label: 阶段 2：审慎试点与基准测试
          description: 在审慎的 POC 中评估 Predictive DocV 和 KYC 准确率，并与传统征信机构匹配率及合成欺诈捕获率比较。
          touchpoints:
            - POC testing on auto-approval and synthetic fraud capture
            - Accuracy benchmarking against legacy credit bureaus
            - Threshold optimization and swap set analysis
        - label: 阶段 3：生产入驻与 API 集成
          description: 部署 Socure Verify 和 Predictive DocV；售后解决方案顾问配置属性、原因代码和 RESTful API 连接。
          touchpoints:
            - RESTful API integration with onboarding flow
            - Attribute threshold configuration and reason-code tuning
            - Achieving sub-2-second automated verification decisions
        - label: 阶段 4：价值管理与运营评审
          description: 资深解决方案顾问开展季度业务评审（QBR），跟踪净收入留存率、收入实现时间和自动审批提升。
          touchpoints:
            - Quarterly Business Reviews (QBRs) tracking ROI
            - Translating model innovation into quantitative lift
            - Reviewing customer feedback on reason codes
        - label: 阶段 5：交叉销售与模块扩张
          description: 客户账户扩展至银行账户验证、Sigma Synthetic Fraud 和 eCBSV，推动金融服务客户的净收入留存率达到 133%。
          touchpoints:
            - Cross-selling Bank Account Verification and eCBSV
            - Integration of consortium signals from Risk Insights Network
            - Expanding into workforce identity and age assurance
        - label: 阶段 6：智能代理编排与全生命周期信任
          description: 企业借助 RiskOS_Agents 扩展至 RiskOS 决策和自动化运营，实现复杂告警调查与观察名单匹配自动化。
          touchpoints:
            - Adoption of automated investigation workflows
            - Payment watchlist screening and ongoing compliance
            - Consolidation of multi-vendor onboarding stacks into RiskOS
    approximationNotes: 客户旅程阶段根据 Socure 销售工程岗位描述、合作伙伴实施公告和企业访谈指南构建。
    claimRefs:
      - CU003
      - CU005
      - CU010
      - CU011
      - CU016
