  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              数字身份与反欺诈市场涵盖身份核验、了解你的客户（KYC）开户、生物识别认证、合成身份检测和反洗钱（AML）合规工作流。在这一市场中，Socure 已通过 RiskOS
              将最初的消费者前端身份验证核心扩展为企业级风险编排层。这类解决方案所对应的运营支出受一项基本取舍支配：企业既要应对激增的 AI
              驱动欺诈攻击，又要维持用户转化并压低人工调查成本。美国企业每年在内部人员和外包托管服务上投入超过 $100B，用于反欺诈、合规和风险运营。但自动化身份验证和欺诈决策平台直接覆盖的软件 TAM
              只是其中的专业子集，行业观察者此前估算约为 $30B。现状替代方案仍主要是传统征信匹配、人工分析队列、分散的点工具和内部启发式规则引擎；它们难以跟上自动化合成身份和身份盗窃。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 可服务市场规模、测算视角与增长空间
        blocks:
          - type: paragraph
            body: >-
              评估数字身份和风险智能机会，需要看多个结构层次，而不是依赖单一自上而下的行业估算。从宏观运营看，金融机构和企业每年投入超过
              $100B，用于处理欺诈复核、合规积压和告警分流。核心身份保证与数字反欺诈软件层的总可用市场（TAM）估计为 $30B，背后是数字账户开立、实时支付和更严格的监管要求加速增长。在这一市场中，自动化、API
              驱动的开户验证、文件认证、观察名单筛查和支付 AML 筛查的可服务市场（SAM）约为 $10.5B，覆盖受监管金融服务、金融科技和公共部门机构。Socure
              的可获取市场（SOM）聚焦于美国高交易量企业银行、头部金融科技公司和联邦/州政府机构，估计为 $1.8B–$2.2B。Socure 已披露的规模——2025 年处理超过 5B 次验证、截至 2026 年中 ARR
              达 $364M——说明它在这一高保证等级市场中已有较大切入。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
