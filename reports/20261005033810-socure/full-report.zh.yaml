chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、业务足迹与商业模式
        blocks:
          - type: paragraph
            body: >-
              Socure 成立于 2012 年，是一家提供信任基础设施的公司，提供实时数字身份验证、反欺诈、合规和风险决策服务。公司最初在纽约运营，但公开申报文件和企业目录将其主要公司地址记录为内华达州 Incline
              Village（885 Tahoe Blvd）；运营管理层和分布式员工仍分散在美国各地。Socure 主要采用按使用量和交易量计费的模式，企业在开户及生命周期工作流中按 API
              调用次数或处理的验证决策付费。Socure 通过统一的 RiskOS 决策引擎整合超过 16,000
              个数据源，并将自研机器学习模型用于身份验证、了解你的客户（KYC）、了解你的企业（KYB）、制裁筛查和交易风险监控。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
