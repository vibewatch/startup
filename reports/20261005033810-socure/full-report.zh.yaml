      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 智能体决策与技术整合债务
            body: >-
              Socure 通过收购（尤其是 Effectiv 和 Fravity）激进扩展技术，加快了自主风险运营愿景，但也带来短期架构和治理风险。将自动化 RiskOS_Agents
              直接整合进企业反欺诈和制裁流程，需要前所未有的模型可解释性。若无法保持自动升级流程的可审计性，可能引发公平放贷和消费者保护法规下的监管审查。
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、立场与推荐依据
        blocks:
          - type: paragraph
            body: >
              Socure 的基础投资逻辑，是其作为 AI 原生信任基础设施平台，在身份验证、合规和欺诈决策领域拥有主导足迹。公司服务超过 3,000 家客户，包括美国前 20 大银行中的 19 家和大型企业平台，依托自研
              Identity Graph 展现出巨大的规模优势。但反向逻辑在于：公开市场倍数压缩时，私营估值标记能否持续；经审计 GAAP 毛利率和底线烧钱情况长期不透明；主要金融机构客户存在集中度。虽然 Socure 在
              2026 年 8 月成功完成 $156M 战略增长轮，投后估值为 $5.2B，建议立场仍是观察。这一对价格敏感的立场，在 63% ARR 增长和 133%
              净留存率等明确运营动能，与潜在估值摩擦及未来上市时的清算优先权压力之间取得平衡。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
