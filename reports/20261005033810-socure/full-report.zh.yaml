        title: 高管团队、关键人物依赖与团队规模
        blocks:
          - type: paragraph
            body: >-
              Socure 由 CEO 兼联合创始人 Johnny Ayers 领导；他自公司成立起掌舵，并担任平台的主要对外代表和战略架构师。核心高管还包括公共部门负责人 Jordan
              Burris，他负责高风险政府验证项目，包括联邦现代化计划和 Socure 为期五年的 Login.gov 分包合作。到 2026 年初，企业员工约 525
              人，员工规模适度扩张，与企业客户覆盖及联邦合规工程需求相匹配。高管结构对 Ayers 存在显著的关键人物依赖；他的持续任职对平台愿景、主要投资者关系和企业客户信任都至关重要。
