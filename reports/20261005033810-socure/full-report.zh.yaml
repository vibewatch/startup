  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、合规与法律风险
        blocks:
          - type: paragraph
            body: >-
              Socure 运营在日益严格的全球监管边界内，受到自动化生物识别处理、消费者金融合规、制裁执行和州级年龄保障要求的约束。公司持续更新 RiskOS
              模块，以处理《银行保密法》和反洗钱交易筛查，以及不断变化的州级年龄验证法规 [CR002,
              CR003]；但州和联邦监管机构的执法态势仍带来持续合规风险。新兴年龄验证法规要求细致的隐私保护设计，限制生物识别数据留存，并强制严格证明算法不存在歧视
              [CR003]。此外，跨境银行账户通道和去中心化支付网络扩大实时制裁筛查后，OFAC 框架下的法律责任也会上升；自动决策错误或漏检可能触发民事罚款和执法行动 [CR001, CR002, CR004]。虽然
              Socure 积极增强生物识别文件验证算法并维护合规控制，公共部门和企业交易对手仍会执行严格审计，可能拖慢采购周期并带来重大赔偿责任 [CR004]。
            claimRefs:
