  - id: FV001
    title: 决策逻辑链
    type: flow
    summary: 将运营指标、估值倍数和治理风险依次连接至跟踪立场的逻辑链。
    data:
      nodes:
        - id: scale
          label: 规模与牵引力（$364M ARR，同比增长 63%，3,000 多家客户）
        - id: moat
          label: AI 平台与护城河（Identity Graph、RiskOS、收购 Fravity）
        - id: valuation-mark
          label: 估值标记（投后 $5.2B，ARR 倍数 14.3 倍）
        - id: multiple-friction
          label: 倍数摩擦（公开可比公司中位数为 6 倍–8 倍，而估值标记为 14.3 倍）
        - id: downside-risks
          label: 下行风险（披露不透明、优先权压力、银行集中度）
        - id: decision
          label: 最终立场：跟踪（等待经审计财务报表与入场估值折价）
      edges:
        - from: scale
          to: moat
        - from: moat
          to: valuation-mark
        - from: valuation-mark
          to: multiple-friction
        - from: multiple-friction
          to: downside-risks
        - from: downside-risks
          to: decision
    approximationNotes: 流程图展示从商业牵引力到估值立场的定性决策综合。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV015
