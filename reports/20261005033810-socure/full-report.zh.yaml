              - CP007
              - CP010
      - number: '3.2'
        title: 广度可见，但相对性能尚未证实
        blocks:
          - type: paragraph
            body: >-
              Socure 的官方定位和 GlobalData 资料支持其产品范围广泛这一结论，但现有证据并未建立跨供应商的独立、受控准确率基准。RFP.wiki 报告了 Socure
              在欺诈检测和身份验证准确率上的积极评价信号，同时也指出配置复杂和实施取舍。FluxForce 的比较页面认为，Socure 的 AML 和案件管理范围比其 IDV
              核心更新，但这些页面由竞争对手发布，因此只是方向性信息，不能视为独立验证。可守住的投资判断是：Socure 能力广泛、公司自报采用率较高，但技术领先的主张仍需针对具体买家做并行测试。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP009
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP014
              - CP015
      - number: '3.3'
        title: 定价不透明，使尽调转向全工作流成本
        blocks:
          - type: paragraph
            body: >-
              现有证据中没有 Socure 官方价目表。一份公司发布的合规产品营销岗位明确涵盖定价、包装、胜负分析和竞争差异化，说明包装是积极的商业杠杆，但并未披露客户实际价格。RFP.wiki 将 Jumio
              描述为定制化、按量计费的企业定价，并提醒公开美元估算并非官方数据。FluxForce 自己的比较页面同样称 Socure 和 FluxForce 的价格未披露，同时为 ComplyAdvantage
              展示低价入门档。由于这些数字尚未在此独立验证，尽调应比较年度承诺、实施、附加模块、复核负担和误报处理，而不只是看单位价格。
            claimRefs:
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP012
              - CP013
      - number: '3.4'
        title: 数据广度和分销能够守住核心，但相邻扩张也有两面性
        blocks:
          - type: paragraph
            body: >-
              Socure 声称拥有超过 3,000 家客户，并与美国前 20 大银行中的 19 家建立关系。这些数字暗示了分销和数据反馈优势，但在本证据集中仍属于公司自报。GlobalData 和 Socure
              招聘用语中都体现出的更广泛合规范围，连接开户、筛查和决策后，可能提高钱包份额并增加切换摩擦。同样的扩张也让 Socure 暴露在成熟 AML 专家和新型一体化平台面前。多平台并用是可能的：FluxForce
              表示许多银行同时使用 Socure 和 ComplyAdvantage，但也认为不同的数据模式和发布周期会增加整合负担。因此，业务持久性取决于独立证明准确率、降低配置负担，并把平台广度转化为更低的总运营成本。
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP010
              - CP011
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 平台主张不等于相对基准
            body: Socure 的业务广度和采用率主张有参考价值，但要达到投资级差异化，仍需把审批率、欺诈捕获率、误报、延迟、人工复核率和总运营成本，与直接及相邻方案做匹配队列测试。
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
