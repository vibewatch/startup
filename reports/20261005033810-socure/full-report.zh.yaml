        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Socure 的商业规模加速增长：第二季度总 ARR 达 $364M，同比增长 63%，净美元留存率为 133%，客户流失率为 0.01%，企业及公共部门客户超过 3,000 家。2026
              年 8 月，公司获得由 Summit Partners 领投、Goldman Sachs Alternatives、Wells Fargo 和 Docusign 参与的 $156M 战略增长投资，企业估值达到
