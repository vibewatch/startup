  - id: FO001
    title: Socure 里程碑与扩张时间线（2012–2026）
    type: timeline
    summary: 记录 Socure 从创立到 2026 年 8 月估值里程碑期间的公司、产品、融资及并购关键节点。
    data:
      items:
        - label: 创立
          date: '2012'
          detail: Socure 成立，利用机器学习进行数字身份验证和欺诈防范。
        - label: Sigma Synthetic Fraud 发布
          date: 2023-11
          detail: 发布 Sigma Synthetic Fraud v4，应对数字银行中的合成身份盗用。
        - label: 收购 Effectiv
          date: 2024-10
          detail: 签署协议，以 $136M 收购交易监控与风险平台 Effectiv。
        - label: Forbes 专访与员工数
          date: 2026-02
          detail: Forbes 介绍 Socure 时提到其拥有 525 名员工、3,000 多家客户，以及 Effectiv 交易监控集成。
        - label: CNBC Disruptor 50
          date: 2026-05
          detail: 入选 2026 年 CNBC Disruptor 50 榜单，理由是其身份信任基础设施和欺诈防范能力。
        - label: Remote Verifier 与 Login.gov
          date: 2026-07
          detail: 推出面向公共部门无障碍访问的 Remote Verifier，并宣布获得为期 5 年、金额 $163M 的 Login.gov 分包合同。
        - label: 2026 年第二季度财务规模
          date: 2026-06
          detail: 2026 年第二季度结束时 ARR 达到 $364M，同比增长 63%，净收入留存率 133%，客户 logo 流失率 0.01%。
        - label: Summit 投资与 Fravity
          date: 2026-08
          detail: 获得由 Summit Partners 领投、估值 $5.2B 的 $156M 投资，并收购智能代理平台 Fravity。
