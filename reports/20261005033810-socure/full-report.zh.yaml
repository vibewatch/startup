      - number: '8.2'
        title: 融资背景、资本结构与估值标记
        blocks:
          - type: paragraph
            body: >
              Socure 的资本化轨迹既体现出机构支持，也体现出大量累计资本投入。二级和一级交易的累计资本数字，来自二级市场的报告区间为 $606M–$744.4M，最多涉及 15
              轮融资，反映不同供应商对传统债务、老股要约和股权轮次的归集方式不同。较早的机构里程碑包括 2017 年 8 月通过 PR Newswire 宣布的 $13.9M B 轮，由 Commerce Ventures
              领投，标志着公司从预测身份验证向广泛金融服务采用扩张。2021 年 11 月的 $450M E 轮建立了 $4.5B 投后估值（每股 $16.07），12.45M 股 E 轮股份享有 1.0x
              不参与型清算优先权和 6.0% 非累积股息率。2026 年 8 月 Summit Partners 以 $5.2B 估值领投增长投资，注入 $156M 混合一级增长资本和员工要约流动性；相对于 2026
              年第二季度 $364M 的年化 ARR，企业 ARR 倍数为 14.3x。虽然这次上调避免了下轮融资，但在公开市场身份与风险可比公司以更紧倍数交易时，入场纪律仍需审视。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 情景分析、退出路径与关键尽调要求
        blocks:
          - type: paragraph
            body: >
              要为 Socure 预测退出画像，需要在基准、乐观和悲观情景下建模增长持续性、净美元留存率，以及公开市场对合规和风险基础设施的需求。在基准情景下，Socure 借助 Fravity
              收购，在银行客户群中交叉销售自动化智能体合规工作流，2027 年 ARR 增长维持在 40%–50%，IPO 估值达到 $5.5B–$6.5B（远期收入 10x–12x）。在乐观情景下，RiskOS
              智能体工作流快速被企业采用、国际用量加速，ARR 超过 $600M，支持以 $8.0B 估值（14x 倍数）IPO 或战略出售。反过来，如果银行 IT 采购放缓、合成欺诈模型受到监管审查，或市场倍数回落至历史
              SaaS 中位数（ARR 的 5x–7x），悲观情景可能把估值压缩至 $2.5B–$3.5B，挑战后期投资者回报。在把立场从观察调整为买入前，必须完成对经审计 GAAP 盈利能力、总留存率和优先股条款的关键尽调。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 推荐判断：观察
            body: >
              我们维持对 Socure 的观察建议，风险评级为高，估值立场为偏高。公司展现出出色的商业规模（$364M ARR、63% 同比增长、133% NRR），但在缺少经审计毛利率和现金烧钱披露的情况下，$5.2B
              投后估值几乎没有安全边际。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV015
          - type: callout
            title: 估值摩擦与清算优先权压力
            body: |
              累计融资超过 $606M–$744M，早期 E 轮和增长轮优先权要求公司退出时实现相当可观的企业价值。若市场倍数压缩至 ARR 的 6x–8x，普通股初级权益和员工普通股将承受下行压力。
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV016
