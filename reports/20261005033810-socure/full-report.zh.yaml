              - CM008
      - number: '2.3'
        title: 买家分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              企业对身份验证和风险决策的需求，分布在采购权限、监管驱动和经济激励各不相同的机构买家之间。在一级商业银行，预算由反欺诈运营团队和首席风险官共同负责，首要目标是在不增加开户摩擦的情况下，提高自动通过率并遏制合成身份欺诈。在高速增长的金融科技、数字钱包和游戏平台，增长负责人、首席产品官与合规负责人协作，优先追求亚秒级延迟（低于
              400 毫秒）和较高的首次文件自动通过率（超过 95%），以减少用户流失。在公共部门，机构 CIO 和项目诚信负责人采购获 FedRAMP 授权、符合 IAL2
              的身份核验，以保护纳税人资金发放，同时确保服务覆盖银行服务不足或信用记录薄弱的人群。采购通常从前端开户验证（KYC/文件检查）开始，按交易 API 计费，随后扩展到持续交易监控、合成欺诈防御和智能体案件处理。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 结构性增长催化剂与采用约束
        blocks:
          - type: paragraph
            body: >-
              AI 原生风险基础设施市场受到三股强劲长期趋势推动：AI
              生成合成身份欺诈爆发、商业和公共部门监管趋严，以及企业供应商整合。复杂的自动化攻击已让静态信用头信息匹配过时，迫使机构采用动态身份图谱，分析数十亿历史交互中的线上和线下行为信号。在公共部门，FedRAMP
              Moderate 和 Kantara IAL2
              合规要求推动联邦及州机构从分散的人工工作流转向统一身份平台。反过来，企业采用也受实质性约束：传统核心银行系统的切换成本仍很高，数据隐私和生物识别法规带来严格合规负担，传统征信机构（LexisNexis、Experian、TransUnion）继续用合同捆绑维护既有关系。此外，当按使用量计费的
              API 用量超过承诺阈值时，中型企业可能面临超额费用摩擦。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从点式验证工具到记录系统级决策引擎
            body: >-
              数字身份供应商的战略扩张，体现为从交易型 KYC API 工具转向企业决策引擎。一旦企业把风险政策、欺诈评分阈值和合规审计历史配置在 RiskOS 这类集中式引擎中，切换壁垒就会显著升高，交易量也会转化为高留存
              ARR。
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
              - CM014
          - type: callout
            title: 征信捆绑与企业合同惯性
            body: >-
              既有征信机构（Experian、TransUnion、Equifax、LexisNexis Risk
              Solutions）与企业银行机构保持根深蒂固的主服务协议。它们把基础身份筛查捆绑进更广泛的征信和合规套餐，能够让采购部门即使面对较低验证准确率，也继续保留传统工作流。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合不限于直接身份验证同行
        blocks:
          - type: paragraph
            body: >-
              Socure 的公开产品范围覆盖身份验证、反欺诈、合规、账户智能以及设备和行为信号，因此相关竞争版图不只是文件验证供应商。GlobalData 将 Accertify、Acuant、iovation 和
              Signifyd 列为对比公司，Krowdbase 还加入 Veriff、Sumsub、Jumio、Trulioo、Alloy 等身份领域替代方案。ComplyAdvantage 和 FluxForce
              属于相邻的 AML 与金融犯罪工作流，并不能与 Socure
              的开户核心完全对应。买家也可以保留一组点解决方案，或在内部自行搭建编排层。这些替代方案之所以重要，是因为采购比较的可能是更广泛的风险栈，而非单纯比较身份准确率。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
