evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headquarters
    missingEvidence: >-
      Formal corporate lease agreements, executive office allocation, and state payroll distribution records confirming
      actual operational headquarters versus legal tax domicile.
    whyItMatters: >-
      Incline Village, Nevada represents a common state corporate tax registration domicile while operational executive
      functions and core engineering remain distributed.
    diligencePath: >-
      Request state employer tax filings, physical facility lease contracts, and primary executive location disclosures
      during confirmatory diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Audited GAAP financial statements bridging $364M ARR to recognized GAAP revenue, gross margin, operating expenses,
      and net cash burn.
    whyItMatters: >-
      ARR is an annualized run-rate metric rather than GAAP revenue, and lack of gross margin disclosure conceals data
      provider licensing costs.
    diligencePath: >-
      Obtain audited 2024–2025 financial statements and quarterly 2026 board review reporting during confidential data
      room review.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Reconciliation of disparate third-party analyst market models bridging high-level $100B operational spend against
      narrow software TAM.
    whyItMatters: >-
      Operational spend includes manual staffing and outsourced BPO labor, making top-line market numbers overly
      optimistic for pure software sizing.
    diligencePath: >-
      Evaluate enterprise software procurement line items and benchmark software licensing as an explicit percentage of
      overall fraud operations budgets.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: pricing-economics
    missingEvidence: >-
      Audited tier-one enterprise bank contract schedules detailing effective price per API verification across volume
      tiers.
    whyItMatters: >-
      Large financial institutions negotiate private enterprise volume tiers well below published self-serve rates
      ($0.80-$1.30 per check).
    diligencePath: Review confidential customer contracts and gross margin per workflow during late-stage data room diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing transparency
    missingEvidence: >-
      Comparable official proposals showing unit definitions, volume tiers, annual minimums, implementation fees,
      add-ons, discounts, overages, and realized three-year cost.
    whyItMatters: Opaque and differently scoped contracts prevent a reliable price or total-cost comparison.
    diligencePath: Run a matched-volume RFP with Socure, two direct IDV peers, one AML adjacent, and the incumbent stack.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparative performance
    missingEvidence: >-
      Independent matched-cohort results for approval rate, fraud capture, false positives, latency, manual-review rate,
      and demographic or geographic performance.
    whyItMatters: Vendor claims and review summaries cannot establish durable technical superiority.
    diligencePath: >-
      Conduct a blind bakeoff on representative historical traffic with pre-agreed labels and cost-adjusted outcome
      metrics.
    relatedQuestionRefs:
      - QP007
      - QP008
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: competitive landscape
    missingEvidence: >-
      Comparable scale, funding, customer concentration, strategic direction, and current product scope for each named
      direct and adjacent competitor.
    whyItMatters: The public source set supports category mapping but not a complete company-by-company strategic profile.
    diligencePath: >-
      Request a management win-loss dataset and competitor cohort, then validate each named vendor against official and
      independent sources.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current rate cards, realized prices, volume commitments, discount schedules, contract duration, and product-level
      revenue mix.
    whyItMatters: Without these inputs, usage growth cannot be converted into a reliable price-volume or revenue-quality assessment.
    diligencePath: Review anonymized customer contracts, invoices, bookings cohorts, discount approvals, and product-level ARR.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited revenue, ARR reconciliation, gross margin, data and compute cost, CAC, sales cycle, payback, working
      capital, and capital expenditure.
    whyItMatters: >-
      The missing inputs prevent testing whether reported ARR growth converts into durable gross profit and efficient
      customer acquisition.
    diligencePath: >-
      Obtain audited financial statements, ARR and billings bridges, product cost schedules, and customer-cohort sales
      efficiency.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      A reconciled capitalization table, primary-versus-secondary allocation for the August 2026 round, current debt
      terms, cash balance, burn, and runway.
    whyItMatters: >-
      Funding raised is not cash available, and conflicting lifetime-funding totals cannot establish present liquidity
      or financing dependency.
    diligencePath: >-
      Reconcile the cap table and sources-and-uses schedule to bank statements, debt documents, and the latest
      board-approved operating plan.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: technical-proof-gaps
    missingEvidence: >-
      Primary service-level reports, status and incident history, certification scope, penetration-test summaries, and
      data-governance control evidence.
    whyItMatters: >-
      Recruiting requirements and product claims do not show that reliability, security, privacy, and model-governance
      controls operate effectively in production.
    diligencePath: >-
      Request the latest SOC 2 report and bridge letter, certification scope, subprocessor and retention schedules,
      twelve months of incident and SLA data, penetration-test executive summary, and model-governance pack.
    relatedQuestionRefs:
      - QE005
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: deployment-workflow
    missingEvidence: >-
      Customer implementation cohorts showing median and tail time-to-live, engineering effort, support tickets, failure
      rates, and post-launch operating burden.
    whyItMatters: >-
      The company claim of going live in days has no denominator, cohort definition, or independent customer validation
      in the assigned evidence.
    diligencePath: >-
      Sample recent deployments by product and customer segment, reconcile contracted versus production dates, and
      review implementation labor and support-ticket distributions.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: model-performance
    missingEvidence: >-
      Current model cards or evaluation packs covering false-positive and false-negative rates, subgroup performance,
      document coverage, drift, override rates, and independent benchmarks.
    whyItMatters: >-
      Product breadth and engineering activity do not establish decision accuracy, fairness, explainability, or
      robustness against changing fraud patterns.
    diligencePath: >-
      Request versioned model evaluations, independent benchmark methodology, drift thresholds, human-review policies,
      adverse-action support, and outcomes by use case and customer cohort.
    relatedQuestionRefs:
      - QE006
      - QE008
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public repository releases, package-download trends, API forum activity, changelog history, or
      practitioner-community discussion tied to Socure integrations.
    whyItMatters: >-
      Job reposts are a weak proxy for developer adoption, integration friction, release cadence, and community
      sentiment.
    diligencePath: >-
      Request private developer-portal usage, SDK version history, API ticket taxonomy, deprecation policy, and
      reference calls with customer integration leads.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Audited account-level customer concentration, top 5 and top 10 customer share of total ARR, and public sector
      revenue contribution.
    whyItMatters: >-
      Heavy reliance on a small number of tier-1 money-center banks or federal subcontract vehicles creates revenue
      vulnerability if a major contract churns.
    diligencePath: >-
      Request customer concentration schedule, top-20 account ARR table, and segment-level revenue contribution during
      confidential sponsor diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory / legal risk register
    missingEvidence: >-
      Comprehensive audit logs and formal agency correspondence regarding state-level biometric data retention or
      enforcement investigations.
    whyItMatters: >-
      Biometric statutory violations under laws like BIPA can impose catastrophic statutory damages per violation,
      directly threatening capital reserves.
    diligencePath: >-
      Request confidential legal disclosure schedules, pending dispute registries, and SOC compliance audit packages
      under NDA.
    relatedQuestionRefs:
      - QR001
      - QR007
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: operational / quality / security risk register
    missingEvidence: >-
      Third-party audited SOC2 Type II examination reports, external penetration testing summaries, and architectural
      failover SLA benchmarks.
    whyItMatters: >-
      Critical infrastructure downtime or core identity database compromise would trigger immediate enterprise breach
      notification liabilities.
    diligencePath: >-
      Obtain independent penetration test results, disaster recovery runbooks, and cloud hosting architecture audits
      during technical diligence.
    relatedQuestionRefs:
      - QR003
      - QR004
    relatedTableRefs:
      - TR002
