company:
  name: "Socure"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Socure presents RiskOS as a single decisioning layer spanning identity, fraud, compliance, age, authentication, and business workflows. Current recruiting material adds useful implementation signals around API-led product surfaces, distributed services, document-verification pipelines, and batch/streaming data work, but it does not establish production topology, measured reliability, security certifications, or independent performance."
sections:
  - id: "product-and-workflow"
    title: "A Broad Decisioning Platform, Not a Single Verification Point"
    body: "Socure's public product surface is organized around a common decisioning layer rather than a single identity check. The company says one API can configure workflows across identity, risk, business onboarding, compliance, age assurance, and authentication, while GlobalData separately lists RiskOS capabilities that include identity fraud detection, payment risk, transaction monitoring, and know-your-business. A current product-design posting names RiskOS, self-serve onboarding, Document Verification, agentic experiences, and customer and developer experiences as active work surfaces. It also maps the user journey from discovery through configuration, integration, decisioning, case management, and ongoing operations. That is credible evidence of product breadth and workflow ambition, but not proof that every named surface has equal adoption, maturity, or production availability."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE014"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-signals"
    title: "Recruiting Signals Point to Distributed Services and Data Pipelines"
    body: "The strongest technical detail in the assigned evidence comes from current job reposts, which should be treated as implementation-direction signals rather than an audited inventory. A backend role describes distributed systems, Go, microservices, REST APIs, and non-functional requirements for scalability, availability, performance, and security. A data-engineering role describes batch and streaming ingestion, machine-learning feature engineering, analytics, AWS, and Spark. A Document Verification role describes backend services and APIs for document capture, processing, and verification, including machine-learning and computer-vision integration; it also seeks gRPC and REST experience. Taken together, these sources support an API-led, data-intensive operating model, but they do not verify the exact production topology, service ownership boundaries, infrastructure versions, throughput, latency, or uptime."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE015"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-and-controls"
    title: "Integration Is a Product Surface; Control Outcomes Remain Unverified"
    body: "The product-design evidence treats APIs, documentation, dashboards, hosted interfaces, API keys, test identities, sandbox testing, usage visibility, case management, and production readiness as parts of one customer experience. This suggests that implementation and ongoing operations are first-class product concerns rather than post-sale services alone. Socure's homepage claims customers can design, test, and deploy workflows and be live in days, but the assigned pool contains no customer-level integration duration, support-effort distribution, or realized time-to-value benchmark. Security and trust are likewise visible as design requirements: the role explicitly calls for privacy, security, transparency, human oversight, and safe handling of customer information in AI-assisted work, while the DocV role calls for secure handling of personally identifiable information. Requirements are not evidence of control effectiveness."
    claimRefs:
      - "CE005"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
  - id: "maturity-and-diligence"
    title: "Maturity Is Visible in Breadth, but Hard Technical Proof Is Thin"
    body: "The evidence supports a current marketed platform, an established RiskOS portfolio, a historical Sigma Synthetic Fraud v4 release, and ongoing hiring for product, backend, data, and Document Verification work. Socure's careers page also says its technology teams anticipate emerging threats, which is directionally consistent with the problem domain but remains recruiting language. The same pool does not provide public service-level performance, incident history, model-evaluation results, certification scope, penetration-test conclusions, data-retention controls, or public developer activity such as repository releases and package downloads. The architecture map therefore distinguishes disclosed product and recruiting signals from analyst synthesis. Technical underwriting should remain conditional on primary control artifacts, production telemetry, model-governance evidence, and implementation cohort data."
    claimRefs:
      - "CE002"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
