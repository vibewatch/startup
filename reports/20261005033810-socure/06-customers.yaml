figures:
  - id: "FU001"
    title: "Enterprise Customer Lifecycle and Expansion Journey"
    type: "journey-map"
    summary: "Illustrates the typical enterprise customer lifecycle from initial KYC compliance pilot through automated RiskOS orchestration and post-onboarding expansion."
    data:
      nodes:
        - label: "Phase 1: Discovery & Executive Alignment"
          description: "Enterprise buyer engages via consultative sales; Account Executives meet with Chief Risk Officers (CROs) and CISOs to establish ROI metrics and compliance frameworks."
          touchpoints:
            - "Executive discovery with CRO and CISO"
            - "Stakeholder mapping across fraud and compliance"
            - "Review of regulatory mandates (FCRA, BSA, PATRIOT Act)"
        - label: "Phase 2: Risk-Averse Pilot & Benchmarking"
          description: "Evaluation of Predictive DocV and KYC accuracy in risk-averse POC against legacy credit bureau match rates and synthetic fraud capture."
          touchpoints:
            - "POC testing on auto-approval and synthetic fraud capture"
            - "Accuracy benchmarking against legacy credit bureaus"
            - "Threshold optimization and swap set analysis"
        - label: "Phase 3: Production Onboarding & API Integration"
          description: "Deployment of Socure Verify and Predictive DocV; post-sales Solution Consultants configure attributes, reason codes, and RESTful API connections."
          touchpoints:
            - "RESTful API integration with onboarding flow"
            - "Attribute threshold configuration and reason-code tuning"
            - "Achieving sub-2-second automated verification decisions"
        - label: "Phase 4: Value Management & Operational Reviews"
          description: "Senior Solution Consultants conduct Quarterly Business Reviews (QBRs) tracking Net Dollar Retention, Time-To-Revenue, and auto-approval lift."
          touchpoints:
            - "Quarterly Business Reviews (QBRs) tracking ROI"
            - "Translating model innovation into quantitative lift"
            - "Reviewing customer feedback on reason codes"
        - label: "Phase 5: Cross-Sell & Module Expansion"
          description: "Account expands into Bank Account Verification, Sigma Synthetic Fraud, and eCBSV, driving net dollar retention across financial services accounts to 133%."
          touchpoints:
            - "Cross-selling Bank Account Verification and eCBSV"
            - "Integration of consortium signals from Risk Insights Network"
            - "Expanding into workforce identity and age assurance"
        - label: "Phase 6: Agentic Orchestration & Full Lifecycle Trust"
          description: "Enterprise scales into RiskOS decisioning and automated operations via RiskOS_Agents, automating complex alert investigations and watchlist matching."
          touchpoints:
            - "Adoption of automated investigation workflows"
            - "Payment watchlist screening and ongoing compliance"
            - "Consolidation of multi-vendor onboarding stacks into RiskOS"
    approximationNotes: "Customer journey stages structured from Socure sales engineering job descriptions, partner implementation announcements, and enterprise interview guides."
    claimRefs:
