chapter:
  number: 6
  title: "Customers"
  summary: "Socure reports serving over 3,000 customers across financial services, government, gaming, and digital commerce, posting $364M in total ARR, 133% net dollar retention, and 0.01% logo churn as of Q2 2026. However, independent and adverse reviews indicate ongoing enterprise pain points around reason-code explainability, complex onboarding attribute configuration, and post-onboarding AML surveillance boundaries."
sections:
  - id: "customer-segmentation-and-profile"
    title: "Customer Segmentation and Regulated Enterprise Footprint"
    body: "Socure categorizes its customer base into high-stakes regulated verticals requiring real-time identity proofing, compliance validation, and fraud decisioning. Its buyer and payer personas are concentrated within enterprise risk, compliance, and product functions—specifically Chief Risk Officers (CROs), Chief Information Security Officers (CISOs), and fraud operations leaders. Commercial enterprise accounts span top-tier commercial banks, digital neobanks, gaming operators, e-commerce marketplaces, and human resources/payroll providers. Beyond private enterprise accounts, Socure has expanded into the public sector, serving state and federal government agencies that require FedRAMP Moderate and IAL-2 certified digital identity infrastructure. Enterprise sales cycles remain consultative and technically demanding, requiring multi-stakeholder approval across security, risk, legal, and engineering teams."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-durability"
    title: "Adoption Trajectory, Retention, and Volume Expansion"
    body: "Socure's commercial momentum demonstrates sustained expansion across its installed customer base. As of Q2 2026, the company reported closing the quarter with $364 million in total ARR, reflecting 63% year-over-year ARR growth and adding 95 new enterprise customers during the period. The enterprise customer base expanded past 3,000 accounts, maintaining an exceptional 133% net dollar retention (NDR) rate and a 0.01% logo churn rate. Operationally, customer verification demand doubled within a 12-month transformation window to over 2.7 billion identity requests, while customer count rose by 42% following platform scalability initiatives. Post-sales solution consulting organizations maintain Extreme Ownership over financial services accounts, aligning quarterly business reviews (QBRs) and proof-of-concept upsells around net dollar retention, auto-approval rate optimization, and new model adoption."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-implementation-friction"
    title: "Named Customer Proof, Strategic Integrations, and Implementation Friction"
    body: "Named customer deployments span tier-one financial institutions, high-growth consumer fintechs, and critical technology partners. Verified production accounts include major institutions such as Capital One, Citi, Chime, SoFi, Green Dot, Varo, Ingo, Robinhood, Gusto, Public, Poshmark, Stash, DraftKings, and PrizePicks, alongside public sector entities like the State of California. In enterprise agreements, Socure integrates directly with strategic platforms including Proof to secure transactions across a $200 trillion market opportunity and DocuSign's Identify platform to deliver automated fraud detection across agreement workflows. Despite high adoption and a 4.5-star G2 rating across 103 verified user reviews, customer feedback highlights operational friction: enterprise teams encounter complexity when analyzing predictive reason codes and face a steep technical learning curve for custom attribute configuration during initial deployment."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
