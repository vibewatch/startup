callouts:
  - calloutType: "strength"
    title: "Category-Leading Retention and Enterprise Lock-In"
    body: "Socure exhibits world-class retention metrics for an enterprise infrastructure software company, highlighted by 133% net dollar retention and an extraordinarily low 0.01% logo churn rate across more than 3,000 customers. Because Socure's identity verification and fraud prevention models sit directly at the point of customer onboarding, displacing the platform introduces severe operational, regulatory, and technical risks for tier-one banks."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
  - calloutType: "risk"
    title: "Deployment Complexity and Customer Operational Overhead"
    body: "Independent practitioner reviews and competitive evaluations reveal that enterprise clients encounter notable complexity during deployment. Users report steep learning curves for custom attribute configuration and operational difficulty interpreting complex reason codes returned by predictive algorithms. Furthermore, because Socure focuses primarily on onboarding identity proofing, customers must integrate secondary vendors like FluxForce for post-onboarding AML surveillance and transaction monitoring."
    claimRefs:
      - "CU015"
      - "CU016"
