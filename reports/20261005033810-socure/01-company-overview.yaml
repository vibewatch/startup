chapter:
  number: 1
  title: "Company Overview"
  summary: "Socure provides AI-native identity verification and risk intelligence infrastructure under its flagship RiskOS platform, scaling to $364M ARR with 63% YoY growth and reaching a $5.2B valuation in August 2026 via a strategic growth round led by Summit Partners alongside its acquisition of agentic operations platform Fravity."
sections:
  - id: "identity-and-business-model"
    title: "Corporate Identity, Footprint, and Business Model"
    body: "Founded in 2012, Socure operates as a trust infrastructure provider delivering real-time digital identity verification, fraud prevention, compliance, and risk decisioning. While the company originally operated out of New York, public filings and corporate directories record its principal corporate address in Incline Village, Nevada (885 Tahoe Blvd), though operational leadership and distributed workforce functions remain geographically decentralized across the United States. Socure monetizes primarily through a usage-based and transaction-oriented pricing model that charges enterprises per API invocation or verification decision processed across onboarding and lifecycle workflows. Through its unified RiskOS decisioning engine, Socure synthesizes over 16,000 data sources and applies proprietary machine learning models across identity verification, Know Your Customer (KYC), Know Your Business (KYB), sanctions screening, and transaction risk monitoring."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Key-Person Dependence, and Team Scale"
    body: "Socure is led by Chief Executive Officer and Co-Founder Johnny Ayers, who has guided the organization since its inception and serves as the principal public face and strategic architect of the platform. Key executive leaders include public sector head Jordan Burris, who leads high-stakes government verification initiatives including federal modernization programs and Socure's five-year Login.gov subcontractor engagement. The enterprise workforce reached approximately 525 employees as of early 2026, reflecting moderate headcount expansion aligned with enterprise account coverage and federal compliance engineering. The executive structure presents notable key-person reliance on Ayers, whose continuity remains pivotal to platform vision, major investor relationships, and enterprise account trust."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization, Scale Metrics, and M&A Integration"
    body: "Socure demonstrated accelerating commercial scale through mid-2026, closing the second quarter with $364 million in total annual recurring revenue (ARR), representing 63% year-over-year ARR growth, a 133% net dollar retention rate, and a 0.01% logo churn rate across more than 3,000 enterprise and public sector customers. In August 2026, the company secured a $156 million strategic growth investment led by Summit Partners with participation from Goldman Sachs Alternatives, Wells Fargo, and Docusign, establishing a $5.2 billion corporate valuation; the transaction comprised both primary balance sheet growth capital and an employee secondary tender offer. In conjunction with the financing, Socure acquired agentic workflow platform Fravity to introduce RiskOS_Agents, augmenting its earlier $136 million acquisition of Effectiv in 2024–2025 and earlier purchase of BNPL credit database Qlarifi."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
    figureRefs:
