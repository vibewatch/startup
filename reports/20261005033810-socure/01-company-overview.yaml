    body: "Socure has achieved rare financial metrics for a late-stage private software business, combining $364 million in ARR with 63% year-over-year expansion and near-zero (0.01%) logo churn. Its ability to command a $5.2 billion valuation from growth equity specialist Summit Partners in a selective late-stage funding environment validates strong customer lock-in and platform retention across top financial institutions."
