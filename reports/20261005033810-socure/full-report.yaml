            figureRef: FP001
            claimRefs:
              - CP005
              - CP014
              - CP015
      - number: '3.3'
        title: Opaque pricing shifts diligence toward total workflow cost
        blocks:
          - type: paragraph
            body: >-
              No official Socure rate card appears in the assigned evidence. A company-issued compliance
              product-marketing role explicitly covers pricing, packaging, win/loss analysis, and competitive
              differentiation, which indicates that packaging is an active commercial lever but does not reveal realized
              customer pricing. RFP.wiki characterizes Jumio as custom, volume-based enterprise pricing and warns that
              public dollar estimates are not official. FluxForce's own comparison similarly describes Socure and
              FluxForce pricing as undisclosed while presenting a low-price entry tier for ComplyAdvantage. Because
              those figures are not independently verified here, diligence should compare annual commitments,
              implementation, add-on modules, review burden, and false-positive handling rather than headline unit price
              alone.
            claimRefs:
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP012
              - CP013
      - number: '3.4'
        title: Data breadth and distribution can defend the core, but adjacency cuts both ways
        blocks:
          - type: paragraph
            body: >-
              Socure claims more than 3,000 customers and relationships with 19 of the top 20 U.S. banks. Those figures
              suggest distribution and data-feedback advantages, although they remain company-reported in this evidence
              set. The broader compliance remit visible in both GlobalData and Socure's hiring language may increase
              wallet share and switching friction by connecting onboarding, screening, and decisioning. The same
              expansion also exposes Socure to established AML specialists and newer integrated platforms. Multi-homing
              is plausible: FluxForce states that many banks use Socure alongside ComplyAdvantage, but also argues that
              separate schemas and release cycles create integration overhead. Durability therefore depends on
              independently proving accuracy, reducing configuration burden, and converting platform breadth into lower
              total operating cost.
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP010
              - CP011
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A platform claim is not a comparative benchmark
            body: >-
              Socure's breadth and adoption claims are relevant, but investment-grade differentiation still requires
              matched-cohort tests of approval, fraud capture, false positives, latency, manual-review rate, and total
              operating cost against direct and adjacent options.
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP009
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue quality and reported traction
        blocks:
          - type: paragraph
            body: >-
              The clearest public description of monetization is Crunchbase News's report that Socure combines usage-
              and transaction-based SaaS. That establishes a volume-linked recurring model, but not list prices,
              realized prices, minimum commitments, contract duration, revenue recognition, or product-level mix.
              Socure's own Q1 headline reported more than $340 million of total ARR and 62% year-over-year "profitable
              growth"; independent coverage then reported $364 million of Q2 ARR, up 63% year over year. These are ARR
              disclosures rather than audited accounting revenue. The homepage's claim of more than 3,000 customers
              supports commercial breadth, while GlobalData's description of identity, fraud, sanctions, and
              risk-decisioning products suggests several monetizable workflows. None of the reviewed sources allocates
              ARR among those workflows, so mix quality and revenue concentration remain unquantified.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI013
