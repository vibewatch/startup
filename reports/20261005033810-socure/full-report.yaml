chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2012, Socure operates as a trust infrastructure provider delivering real-time digital identity
              verification, fraud prevention, compliance, and risk decisioning. While the company originally operated
              out of New York, public filings and corporate directories record its principal corporate address in
              Incline Village, Nevada (885 Tahoe Blvd), though operational leadership and distributed workforce
              functions remain geographically decentralized across the United States. Socure monetizes primarily through
              a usage-based and transaction-oriented pricing model that charges enterprises per API invocation or
              verification decision processed across onboarding and lifecycle workflows. Through its unified RiskOS
              decisioning engine, Socure synthesizes over 16,000 data sources and applies proprietary machine learning
              models across identity verification, Know Your Customer (KYC), Know Your Business (KYB), sanctions
              screening, and transaction risk monitoring.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
