      - number: '5.3'
        title: Integration Is a Product Surface; Control Outcomes Remain Unverified
        blocks:
          - type: paragraph
            body: >-
              The product-design evidence treats APIs, documentation, dashboards, hosted interfaces, API keys, test
              identities, sandbox testing, usage visibility, case management, and production readiness as parts of one
              customer experience. This suggests that implementation and ongoing operations are first-class product
              concerns rather than post-sale services alone. Socure's homepage claims customers can design, test, and
              deploy workflows and be live in days, but the assigned pool contains no customer-level integration
              duration, support-effort distribution, or realized time-to-value benchmark. Security and trust are
              likewise visible as design requirements: the role explicitly calls for privacy, security, transparency,
              human oversight, and safe handling of customer information in AI-assisted work, while the DocV role calls
              for secure handling of personally identifiable information. Requirements are not evidence of control
              effectiveness.
            claimRefs:
              - CE005
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Maturity Is Visible in Breadth, but Hard Technical Proof Is Thin
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a current marketed platform, an established RiskOS portfolio, a historical Sigma
              Synthetic Fraud v4 release, and ongoing hiring for product, backend, data, and Document Verification work.
              Socure's careers page also says its technology teams anticipate emerging threats, which is directionally
              consistent with the problem domain but remains recruiting language. The same pool does not provide public
              service-level performance, incident history, model-evaluation results, certification scope,
              penetration-test conclusions, data-retention controls, or public developer activity such as repository
              releases and package downloads. The architecture map therefore distinguishes disclosed product and
              recruiting signals from analyst synthesis. Technical underwriting should remain conditional on primary
              control artifacts, production telemetry, model-governance evidence, and implementation cohort data.
            claimRefs:
              - CE002
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration appears to be part of the product itself
            body: >-
              The design evidence treats documentation, API keys, sandbox testing, dashboards, production readiness,
              case management, and ongoing operations as one experience. That supports a platform interpretation, while
              leaving realized implementation speed and support burden unverified.
            calloutType: insight
            claimRefs:
              - CE004
              - CE005
              - CE010
              - CE011
          - type: callout
            title: Architecture detail comes mostly from recruiting material
            body: >-
              Job reposts reveal current engineering priorities but cannot establish the deployed topology, control
              effectiveness, service levels, or model performance. Primary architecture diagrams, telemetry, audits, and
              customer implementation cohorts remain diligence requirements.
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Regulated Enterprise Footprint
        blocks:
          - type: paragraph
            body: >-
              Socure categorizes its customer base into high-stakes regulated verticals requiring real-time identity
              proofing, compliance validation, and fraud decisioning. Its buyer and payer personas are concentrated
              within enterprise risk, compliance, and product functions—specifically Chief Risk Officers (CROs), Chief
              Information Security Officers (CISOs), and fraud operations leaders. Commercial enterprise accounts span
              top-tier commercial banks, digital neobanks, gaming operators, e-commerce marketplaces, and human
              resources/payroll providers. Beyond private enterprise accounts, Socure has expanded into the public
              sector, serving state and federal government agencies that require FedRAMP Moderate and IAL-2 certified
              digital identity infrastructure. Enterprise sales cycles remain consultative and technically demanding,
              requiring multi-stakeholder approval across security, risk, legal, and engineering teams.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.2'
        title: Adoption Trajectory, Retention, and Volume Expansion
        blocks:
          - type: paragraph
            body: >-
              Socure's commercial momentum demonstrates sustained expansion across its installed customer base. As of Q2
              2026, the company reported closing the quarter with $364 million in total ARR, reflecting 63%
              year-over-year ARR growth and adding 95 new enterprise customers during the period. The enterprise
              customer base expanded past 3,000 accounts, maintaining an exceptional 133% net dollar retention (NDR)
              rate and a 0.01% logo churn rate. Operationally, customer verification demand doubled within a 12-month
              transformation window to over 2.7 billion identity requests, while customer count rose by 42% following
              platform scalability initiatives. Post-sales solution consulting organizations maintain Extreme Ownership
              over financial services accounts, aligning quarterly business reviews (QBRs) and proof-of-concept upsells
              around net dollar retention, auto-approval rate optimization, and new model adoption.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: figure
