              - CI003
              - CI015
      - number: '4.2'
        title: Unit economics and delivery-cost visibility
        blocks:
          - type: paragraph
            body: >-
              FinTech Global reported 133% net dollar retention and 0.01% logo churn for Q2 2026 across a customer base
              exceeding 3,000. Those company-originated operating metrics point to expansion and low reported attrition,
              but the evidence does not disclose the calculation methodology, cohort boundary, gross retention, or
              customer concentration. More importantly, no assigned source supplies CAC, sales-cycle length, payback,
              gross margin, data-acquisition expense, compute expense, manual-review cost, working capital, or capital
              expenditure. The resulting underwriting problem is not evidence of weak economics; it is an inability to
              bridge activity and ARR into accounting revenue and gross profit. StateScoop's account of New York
              scrutiny also identifies a possible compliance and procurement burden, while recording Socure's rebuttal.
              No public evidence reviewed here quantifies that burden or proves a contract loss.
            claimRefs:
              - CI003
              - CI004
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
