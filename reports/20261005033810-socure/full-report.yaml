            claimRefs:
              - CI001
              - CI003
              - CI015
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The August 2026 transaction was reported as a $156 million strategic growth investment at a $5.2 billion
              valuation. It included both primary capital and an employee secondary tender, but Crunchbase News said the
              allocation was not disclosed; therefore the headline amount cannot be treated as cash added to the balance
              sheet. Tracxn separately records $95 million of conventional debt from March 2023, without evidence here
              on the current balance, covenants, maturity, or availability. Lifetime-funding databases also disagree:
              Crunchbase News reports more than $742 million of disclosed funding, Tracxn reports $650 million across 15
              rounds, and Multiples reports $803 million across nine rounds. Those figures should not be substituted for
              cash available. The financial verdict is consequently positive on reported ARR growth and retention, but
              unresolved on revenue quality, margin conversion, capital intensity, liquidity, and runway until audited
              statements and financing documents are reviewed.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not the same as cash available
            body: >-
              The $156 million transaction included an undisclosed mix of primary capital and employee secondary
              liquidity, so the headline financing amount cannot establish runway.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI015
          - type: callout
            title: Underwrite from audited statements, not ARR headlines
            body: >-
              Require an ARR-to-revenue bridge, product gross margins, cash and burn, debt terms, cohort retention, and
              account concentration before concluding that reported growth converts into durable free cash flow.
            calloutType: recommendation
            claimRefs:
