        - label: Forbes Profile & Headcount
          date: 2026-02
          detail: >-
            Forbes profiles Socure noting 525 employees, 3,000+ customers, and Effectiv transaction monitoring
            integration.
        - label: CNBC Disruptor 50
          date: 2026-05
          detail: Named to the 2026 CNBC Disruptor 50 list for identity trust infrastructure and fraud prevention.
