        title: Recruiting Signals Point to Distributed Services and Data Pipelines
        blocks:
          - type: paragraph
            body: >-
              The strongest technical detail in the assigned evidence comes from current job reposts, which should be
              treated as implementation-direction signals rather than an audited inventory. A backend role describes
              distributed systems, Go, microservices, REST APIs, and non-functional requirements for scalability,
              availability, performance, and security. A data-engineering role describes batch and streaming ingestion,
              machine-learning feature engineering, analytics, AWS, and Spark. A Document Verification role describes
              backend services and APIs for document capture, processing, and verification, including machine-learning
              and computer-vision integration; it also seeks gRPC and REST experience. Taken together, these sources
              support an API-led, data-intensive operating model, but they do not verify the exact production topology,
              service ownership boundaries, infrastructure versions, throughput, latency, or uptime.
            claimRefs:
