  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The digital identity and fraud prevention market spans identity proofing, know-your-customer (KYC)
              onboarding, biometric authentication, synthetic identity detection, and anti-money laundering (AML)
              compliance workflows. Within this landscape, Socure has expanded its initial core from front-door consumer
              identity verification into an enterprise-wide risk orchestration layer through its RiskOS platform. The
              operational spend addressed by these solutions is governed by a fundamental trade-off: organizations must
              counter surging AI-driven fraud attacks while preserving user conversion and minimizing manual
              investigation costs. U.S. organizations allocate upwards of $100 billion annually toward fraud,
              compliance, and risk operations across internal staffing and outsourced managed services. However, the
              software TAM directly addressed by automated identity verification and fraud decisioning platforms
              represents a specialized subset, previously estimated by industry observers at approximately $30 billion.
              Status-quo substitutes remain predominantly legacy credit bureau matching, manual analyst review queues,
              fragmented point tools, and in-house heuristic rule engines, which struggle to keep pace with automated
              synthetic identity schemes and identity theft.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Market Sizing, Sizing Lenses, and Growth Horizons
        blocks:
          - type: paragraph
            body: >-
              Sizing the digital identity and risk intelligence opportunity requires evaluating multiple structural
              layers rather than relying on a single top-down industry estimate. At the macro operational level,
              financial institutions and enterprises deploy over $100 billion each year to manage fraud reviews,
              compliance backlogs, and alert triage. The core addressable identity assurance and digital fraud software
              layer represents an estimated $30 billion total addressable market (TAM), underpinned by accelerating
              digital account creation, real-time payments, and stricter regulatory compliance mandates. Within this
              landscape, the serviceable addressable market (SAM) for automated, API-driven onboarding verification,
              document authentication, watchlist screening, and payment AML screening represents approximately $10.5
              billion across regulated financial services, fintech, and public sector agencies. Socure's serviceable
              obtainable market (SOM), centered on high-volume U.S. enterprise banking, top-tier fintechs, and
              federal/state government agencies, is estimated at $1.8 billion to $2.2 billion. Socure's documented
              scale—processing over 5 billion verifications in 2025 and generating $364 million in ARR as of
              mid-2026—demonstrates substantial capture of this high-assurance tier.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Enterprise demand for identity verification and risk decisioning is segmented across distinct
              institutional buyers with varying procurement authority, regulatory drivers, and economic incentives. In
              tier-one commercial banking, budget ownership is shared between Fraud Operations and Chief Risk Officers,
              where the primary objective is maximizing automated pass rates and halting synthetic identity fraud
              without introducing onboarding friction. In high-growth fintech, digital wallets, and gaming platforms,
              the Head of Growth and Chief Product Officer collaborate with compliance leads, prioritizing sub-second
              latency (under 400 milliseconds) and high first-try document auto-approval (exceeding 95%) to minimize
              user drop-off. In the public sector, agency CIOs and program integrity directors procure
              FedRAMP-authorized and IAL2-compliant identity proofing to safeguard taxpayer disbursements while ensuring
              accessibility for underbanked or thin-file constituents. Procurement typically begins with front-door
              onboarding verification (KYC/document checks) priced on a per-transaction API basis, before expanding into
              continuous transaction monitoring, synthetic fraud defense, and agentic case resolution.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Structural Growth Catalysts and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The market for AI-native risk infrastructure is accelerated by three powerful secular tailwinds: the
              explosion of AI-generated synthetic identity fraud, regulatory tightening across commercial and public
              sector programs, and enterprise vendor consolidation. Sophisticated automated attacks have rendered static
              credit-header matching obsolete, compelling institutions to adopt dynamic identity graphs that analyze
              online and offline behavioural signals across billions of historical interactions. In the public sector,
              mandates for FedRAMP Moderate and Kantara IAL2 compliance are driving federal and state agencies away from
              fragmented manual workflows toward unified identity platforms. Conversely, material constraints govern
              enterprise adoption: legacy core banking switching costs remain elevated, data privacy and biometric
              regulations impose stringent compliance overhead, and legacy credit bureaus (LexisNexis, Experian,
              TransUnion) continue to leverage contract bundling to protect incumbent relationships. Furthermore,
              mid-market organizations face potential overage friction when usage-based API volumes exceed committed
              thresholds.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: From Point Verification Tool to System-of-Record Decision Engine
            body: >-
              The strategic expansion of digital identity vendors is defined by the transition from transactional KYC
              API utilities to enterprise decision engines. Once an enterprise configures its risk policies, fraud
              scoring thresholds, and compliance audit histories inside a centralized engine like RiskOS, switching
              barriers escalate dramatically, transforming transactional volume into high-retention annual recurring
              revenue.
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
              - CM014
          - type: callout
            title: Credit Bureau Bundling and Enterprise Contract Inertia
            body: >-
              Incumbent credit reporting agencies (Experian, TransUnion, Equifax, LexisNexis Risk Solutions) maintain
              entrenched master service agreements with enterprise banking institutions. By bundling basic identity
              screening into broader credit and compliance packages, incumbents can pressure procurement departments to
              preserve legacy workflows despite lower verification accuracy.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set extends beyond direct IDV peers
        blocks:
          - type: paragraph
            body: >-
              Socure's public surface spans identity verification, fraud prevention, compliance, account intelligence,
              and device and behavioral signals, so the relevant landscape is wider than a list of document-verification
              vendors. GlobalData identifies Accertify, Acuant, iovation, and Signifyd as comparison companies, while
              Krowdbase adds Veriff, Sumsub, Jumio, Trulioo, Alloy, and other identity-oriented alternatives.
              ComplyAdvantage and FluxForce sit in adjacent AML and financial-crime workflows rather than cleanly
              matching Socure's onboarding core. Buyers can also retain a bundle of point solutions or build
              orchestration internally. Those substitutes matter because procurement may compare a broader risk stack,
              not just like-for-like identity accuracy.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
