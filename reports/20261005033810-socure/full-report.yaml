              - CP006
              - CP007
              - CP010
      - number: '3.2'
        title: Breadth is visible; comparative performance is not
        blocks:
          - type: paragraph
            body: >-
              Socure's official positioning and GlobalData profile support a broad product-scope conclusion, but the
              assigned evidence does not establish an independent, controlled accuracy benchmark across vendors.
              RFP.wiki reports positive review signals for Socure's fraud detection and identity-verification accuracy
              while also flagging configuration complexity and implementation tradeoffs. FluxForce's comparison pages
              argue that Socure's AML and case-management scope is newer than its IDV core, but those pages are
              competitor-issued and therefore directional rather than independent validation. The defensible
              underwriting view is that Socure has broad capabilities and strong company-reported adoption, while claims
              of technical superiority still require a buyer-specific bakeoff.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
