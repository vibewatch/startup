      - number: '1.2'
        title: Executive Leadership, Key-Person Dependence, and Team Scale
        blocks:
          - type: paragraph
            body: >-
              Socure is led by Chief Executive Officer and Co-Founder Johnny Ayers, who has guided the organization
              since its inception and serves as the principal public face and strategic architect of the platform. Key
              executive leaders include public sector head Jordan Burris, who leads high-stakes government verification
              initiatives including federal modernization programs and Socure's five-year Login.gov subcontractor
              engagement. The enterprise workforce reached approximately 525 employees as of early 2026, reflecting
              moderate headcount expansion aligned with enterprise account coverage and federal compliance engineering.
              The executive structure presents notable key-person reliance on Ayers, whose continuity remains pivotal to
              platform vision, major investor relationships, and enterprise account trust.
            claimRefs:
              - CO007
