      - number: '1.3'
        title: Capitalization, Scale Metrics, and M&A Integration
        blocks:
          - type: paragraph
            body: >-
              Socure demonstrated accelerating commercial scale through mid-2026, closing the second quarter with $364
              million in total annual recurring revenue (ARR), representing 63% year-over-year ARR growth, a 133% net
              dollar retention rate, and a 0.01% logo churn rate across more than 3,000 enterprise and public sector
              customers. In August 2026, the company secured a $156 million strategic growth investment led by Summit
              Partners with participation from Goldman Sachs Alternatives, Wells Fargo, and Docusign, establishing a
              $5.2 billion corporate valuation; the transaction comprised both primary balance sheet growth capital and
              an employee secondary tender offer. In conjunction with the financing, Socure acquired agentic workflow
              platform Fravity to introduce RiskOS_Agents, augmenting its earlier $136 million acquisition of Effectiv
              in 2024–2025 and earlier purchase of BNPL credit database Qlarifi.
