  - id: FE001
    title: Evidence-Bounded Product Architecture Stack
    type: stack
    summary: >-
      The stack separates customer-facing surfaces, decision products, implementation signals, and unresolved control
      evidence without asserting an audited production topology.
    data:
      layers:
        - label: Customer experience
          detail: >-
            Current design material names self-serve onboarding, dashboards, hosted interfaces, case management, usage
            visibility, and agentic experiences.
          items:
            - label: Evaluation and setup
              detail: Discovery, account setup, configuration, and production-readiness flows.
            - label: Ongoing operations
              detail: Decision status, usage visibility, case management, errors, and recovery.
        - label: Integration
          detail: >-
            The product experience joins APIs and technical documentation with API keys, test identities, and sandbox
            testing.
          items:
            - label: External interfaces
              detail: APIs and hosted interfaces are disclosed product surfaces.
            - label: Backend protocols
              detail: Current engineering roles name REST and gRPC, without a public endpoint inventory.
        - label: Decision products
          detail: >-
            RiskOS is the common marketed decisioning layer across identity, fraud, business, compliance, age, and
            authentication workflows.
          items:
            - label: RiskOS workflows
              detail: Composable decisioning is the central company claim.
            - label: Fraud and identity modules
              detail: GlobalData lists fraud, payment risk, transaction monitoring, and KYB capabilities.
            - label: Document Verification
              detail: Current roles describe capture, processing, verification, and model integration.
        - label: Service execution
          detail: >-
            Recruiting material points to distributed services, Go, microservices, REST APIs, and non-functional
            engineering requirements.
          items:
            - label: Distributed backend
              detail: Scalability, availability, performance, and security are stated engineering responsibilities.
            - label: DocV services
              detail: Backend APIs connect document workflows to ML and computer-vision components.
        - label: Data and ML pipelines
          detail: >-
            Current data hiring describes batch and streaming ingestion, ML feature engineering, analytics, monitoring,
            and recovery.
          items:
            - label: Batch processing
              detail: Spark and AWS services are named desired implementation experience.
            - label: Streaming processing
              detail: Kafka or Kinesis appears as preferred near-real-time experience.
        - label: Controls and telemetry
          detail: >-
            Privacy, security, human oversight, safe information handling, testing, monitoring, and incident response
            appear as requirements rather than verified outcomes.
          items:
            - label: Trust controls
              detail: PII protection and responsible AI are explicit role requirements.
            - label: Unverified evidence
              detail: >-
                SLAs, certifications, incident history, model evaluations, and control-test results are not in the
                assigned pool.
    approximationNotes: >-
      This is an analytical layering of disclosed product surfaces and recruiting signals; it is not Socure's published
      production architecture.
