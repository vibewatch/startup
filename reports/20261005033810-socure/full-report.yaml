  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A Broad Decisioning Platform, Not a Single Verification Point
        blocks:
          - type: paragraph
            body: >-
              Socure's public product surface is organized around a common decisioning layer rather than a single
              identity check. The company says one API can configure workflows across identity, risk, business
              onboarding, compliance, age assurance, and authentication, while GlobalData separately lists RiskOS
              capabilities that include identity fraud detection, payment risk, transaction monitoring, and
              know-your-business. A current product-design posting names RiskOS, self-serve onboarding, Document
              Verification, agentic experiences, and customer and developer experiences as active work surfaces. It also
              maps the user journey from discovery through configuration, integration, decisioning, case management, and
              ongoing operations. That is credible evidence of product breadth and workflow ambition, but not proof that
              every named surface has equal adoption, maturity, or production availability.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE014
