chapter:
  number: 2
  title: Market Analysis
  summary: >
    Firmus operates at the intersection of sovereign AI infrastructure, hyperscale GPU colocation, and
    AI-as-a-Service cloud in the Asia-Pacific region. Global AI data center market estimates for 2026
    range from $180 billion (Grand View Research) to $471 billion (MarketsandMarkets), with the
    narrower sovereign AI infrastructure segment estimated at $14–17 billion globally and growing at
    16–18 percent CAGR through 2033. Firmus's contracted customer base (two hyperscale deals totalling
    roughly 55,000 NVIDIA GB300 GPUs) and its A$73.3 billion Project Southgate programme validate real
    demand, but power grid constraints, AEMC regulatory proposals, a Greenpeace moratorium call, and
    Jevons-paradox uncertainty over AI efficiency gains constitute material constraints on the adoption
    timeline.

sections:
  - id: market-boundary
    title: "Market Boundary: AI Cloud, Sovereign AI Infrastructure, and GPU Capacity"
    body: >
      Firmus positions itself at the nexus of three overlapping spend categories. The first is
      hyperscale GPU compute, where global cloud providers pay for contracted, high-density AI factory
      capacity to satisfy demand that outpaces their own build programmes. The second is sovereign AI
      infrastructure, defined as AI compute that must remain under domestic governance, operate on
      local energy supply, and comply with national data-residency requirements. The third is
      enterprise and government AI cloud services, delivered via the Firmus AI Cloud to commercial
      and public-sector customers who require managed access to frontier GPU capacity without building
      their own. General-purpose IaaS and conventional colocation are explicitly excluded: Firmus
      targets only AI-dense, energy-optimised, GPU-native workloads. Status-quo substitutes include
      global hyperscaler clouds (AWS, Azure, GCP), locally built on-premises GPU clusters, and
      traditional colocation operators such as NEXTDC and Equinix, none of which offer sovereign
      on-Australian-soil renewable-powered AI factory economics at scale. Australia, with 145
      operational colocation data centers and a data center market projected to reach USD 9.02 billion
      by 2031, serves as the anchor geography; APAC exports are an explicit ambition. The adjacent
      spend categories—general enterprise cloud, cybersecurity infrastructure, and network carrier
      services—are adjacent but not included in the primary market boundary because Firmus does not
      target them commercially.
