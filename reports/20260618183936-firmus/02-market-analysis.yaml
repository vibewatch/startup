  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-sizing-SOM
      missingEvidence: "Firmus has not disclosed revenue, contracted value, utilisation rates, or signed offtake volumes beyond the two announced hyperscale contracts. An SOM estimate requires knowledge of total contracted GPU-years, average revenue per GPU-year, and the planned enterprise/cloud revenue mix."
      whyItMatters: "Without SOM estimates grounded in revenue data, the market analysis cannot assess whether Firmus's $5.5B valuation is priced on contracted cash flow or speculative future capacity—a critical distinction for assessing price-to-addressable-market multiples at IPO."
      diligencePath: "Review IPO prospectus when filed; request management commentary on contracted pipeline value and revenue per GPU-year during IPO roadshow. Cross-check against publicly disclosed Futurum/Goldman estimates of GPU-hour market pricing."
      relatedQuestionRefs:
        - QM009
        - QM022

    - type: missing-source
      severity: material
      topic: adverse-efficiency
      missingEvidence: "No independent third-party audit or operational performance data for Firmus's claimed PUE of 1.03 and 60% energy reduction versus air-cooled at production scale. Only company press releases and VAST Data partnership communications describe system architecture."
      whyItMatters: "PUE and token-economics claims are central to Firmus's differentiated positioning versus conventional data centres and its justification for premium pricing to hyperscalers. If actual PUE at load is materially higher (e.g., 1.15–1.20), the TCO-per-token advantage narrows significantly, weakening the commercial case and potentially affecting off-take renewals."
      diligencePath: "Request independent PUE audit from Green Grid or NABERS Digital certification programme. Compare against CDC Data Centres' own published near-zero water consumption claims and NVIDIA DSX reference architecture benchmarks."
      relatedQuestionRefs:
        - QM024

    - type: stale
      severity: minor
      topic: demand-uncertainty
      missingEvidence: "No current (2026) independent estimate of whether AI model efficiency gains (Jevons paradox dynamic) are reducing or increasing aggregate GPU-hours demanded per unit of AI output. The 78% Gemini serving-cost reduction (2025) and Anthropic's 9x revenue growth from $1B to $9B ARR illustrate competing dynamics."
      whyItMatters: "If efficiency gains reduce required GPU-hours faster than adoption scale increases them, the infrastructure cycle could peak earlier than consensus hyperscaler capex guidance suggests—compressing returns for Firmus's 2028 buildout."
      diligencePath: "Monitor IEA, Futurum, and Goldman Sachs quarterly infrastructure reports tracking GPU-hours consumed per unit of AI model output. Track OpenAI and Anthropic inference cost disclosures as proxy for efficiency trajectory."
      relatedQuestionRefs:
        - QM016
        - QM020

