  - id: growth-drivers-constraints
    title: "Growth Drivers, Adoption Constraints, and Regulatory Friction"
    body: >
      The primary growth driver is the hyperscaler capex surge: the top five US infrastructure
      companies are deploying USD 660–690 billion in 2026, and all report AI capacity being
      absorbed as fast as it can be built. Microsoft disclosed an USD 80 billion backlog of
      unfulfilled Azure orders gated only by power access, illustrating that the constraint is
      energy connection, not demand. Firmus is positioned to absorb overflow: its Tasmanian site
      achieves a PUE of approximately 1.03, leveraging hydroelectric baseload that is structurally
      cleaner and more price-stable than gas-heavy mainland Australian grids. A second driver is
      geopolitical and sovereign pressure: over 100 countries have enacted data-localisation or
      AI-sovereignty requirements, and Gartner forecasts 20 percent of sovereign cloud IaaS
      workloads will shift from global to local providers by 2028 as geopatriation accelerates.
      Australian data centre spending grew more than 60 percent in the September 2025 quarter,
      reaching A$2.6 billion—up 140 percent year-on-year—with the government fast-tracking 15
      data centre projects in NSW. However, adoption faces three structural constraints. First,
      grid capacity: Transgrid (NSW's transmission operator) told a parliamentary inquiry it lacks
      capacity to power every data centre in the planning pipeline, and AEMO projects data centres
      will consume 12 TWh by FY2030 (six percent of NEM demand), rising potentially to 13 percent
      of all electricity by 2040 under a high-growth scenario. Second, new regulatory obligations:
      the AEMC's March 2026 draft rule raises the definition of "large" inverter-based loads to
      30 MW and requires ride-through compliance to prevent cascading outages, adding engineering
      costs and connection-timeline uncertainty to every facility connecting to the National
      Electricity Market. Third, the Greenpeace moratorium call backed by some state energy
      ministers creates a political risk that could extend planning approvals and introduce
      conditional offset requirements—new facilities may need to fully offset their electricity
      demand with new renewable generation before obtaining approvals. An additional uncertainty
      is whether AI model efficiency gains (analogous to the Jevons paradox already observed in
      cloud unit economics) will reduce per-workload compute intensity faster than adoption scales
      demand, a scenario that could compress the realised market size versus current forecasts.
