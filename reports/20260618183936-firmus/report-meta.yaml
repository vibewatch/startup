companyProfile:
  summary: Firmus is an Australian-founded, Singapore-headquartered AI infrastructure company that pivoted from bitcoin-mining cooling systems into modular, liquid-cooled AI factories and a GPU cloud platform. Public evidence supports live Singapore deployments, a large Australian buildout under Project Southgate, and unusually strong capital access via Nvidia-backed equity rounds and a Blackstone-led debt facility, but it does not yet support a full underwriting case on revenue quality, margins, or customer durability.
  foundedDate: '2019-12-12'
  founders:
    - name: Oliver Curtis
      role: Co-founder and Co-CEO
      background: Former investment banker and crypto investor; central external face of the company and main governance flashpoint.
      claimRefs: [CO005, CO011, CO035]
    - name: Tim Rosenfield
      role: Co-founder and Co-CEO
      background: Former CEO of Simone Perele who now shares executive control of Firmus.
      claimRefs: [CO006, CO010]
    - name: Jonathan Levee
      role: Co-founder and Director of Research and Development
      background: Co-founder leading research and development with a resources-sector operating background.
      claimRefs: [CO007, CO053]
  foundingLocation: Australia
  headquarters: Singapore
  productSummary: Firmus builds and operates liquid-cooled AI factories, grid-integrated high-density compute campuses, and Firmus AI Cloud GPU capacity for training and inference workloads.
  customerFocus: Hyperscalers, government agencies, enterprises, education, and startups seeking sovereign AI compute in APAC.
  businessModel: Capital-intensive infrastructure ownership and operation combined with GPU cloud and contracted AI compute services.
  stage: late-stage private / pre-IPO
  fundingStatus: Raised about USD 1.35 billion of equity across three rounds from September 2025 to April 2026, added a USD 10 billion Blackstone-led debt facility, and is targeting an ASX IPO in mid-2026.
