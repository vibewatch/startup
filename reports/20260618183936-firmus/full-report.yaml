      - number: '5.5'
        title: Product Risks and Technical Risk Register
        blocks:
          - type: paragraph
            body: >
              Five material product and technical risks warrant explicit diligence treatment. First, NVIDIA
              concentration:

              every AI Factory module and AI Cloud instance is a single-vendor GPU environment. If NVIDIA reallocates

              supply toward larger U.S. hyperscalers, delays GB300 delivery, or revises partner programme terms,
              Firmus's

              expansion timeline and unit economics are directly affected. The NVIDIA equity stake binds Firmus's
              capital

              deployment to NVIDIA's own product roadmap cycles.


              Second, unverified PUE efficiency claims: Firmus markets a 1.03 PUE figure in some materials while its

              engineering pages and MLPerf submission cite approximately 1.1. Hyperscale operators with advanced cooling

              typically report 1.1–1.15 annually. Without an independent annual audit, the magnitude of the efficiency

              advantage over competitors cannot be verified by investors or customers.


              Third, immersion cooling operational complexity: direct-to-chip cold-plate cooling is well-established,

              but full immersion at gigawatt scale requires specialised dielectric fluid management, leak detection,
              pump

              maintenance, and a workforce skilled in immersion systems. The available technician pool in Tasmania with

              this expertise at scale is limited.


              Fourth, energy supply regulatory risk: the Aurora Energy contract is a three-year RSA. Firmus's plans for

              400 MW across three Tasmanian sites face growing political opposition, and state-specific AI data centre

              energy regulation is being actively proposed by legislators.


              Fifth, construction and execution risk: the A$73.3 billion national build has no precedent in Australia;

              simultaneous multi-city construction, supply chain dependencies, and regulatory approvals across five

              jurisdictions carry compounding execution risk.
