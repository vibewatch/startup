      - number: '7.3'
        title: Financial, Capital, and Partner Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              The US$10 billion Blackstone-led debt facility is the central financial risk object. The facility is
              structured as senior-secured infrastructure debt with drawdown conditioned on the execution of long-term
              customer contracts with hyperscalers and blue-chip AI customers. This design limits speculative deployment
              but introduces sequencing risk: if contract negotiations stall, drawdown is unavailable and the capital
              programme stalls. Missed build milestones, failure to renew or retain anchor contracts, or material
              deterioration in counterparty creditworthiness could each trigger covenant breach and lender rights —
              including demands for immediate partial repayment or restrictions on further drawdown. Nomura's reported
              difficulty selling down a funded $120M four-year private credit facility for Firmus signals that at least
              one institutional bank-market participant assessed the risk as unattractive at the offered terms, a
              material adverse signal in the context of a $10B facility.

              The total capex programme of A$73.3 billion through 2028 is approximately 55 times the total equity raised
              as of April 2026. This extraordinary leverage ratio means IPO proceeds and continued debt drawdown are not
              optional — they are necessary for the plan to function. If the IPO prices materially below the targeted
              A$8–12 billion range, or encounters booking difficulties, the company's ability to meet the debt contract
              pipeline would be compromised. The targeted pricing itself — 40 to 100 percent above the then-current
              private valuation — represents a valuation step-up with no confirmed comparable in recent Australian
              technology IPO history.

              The Nvidia dependency risk is distinctive. Nvidia is simultaneously Firmus's primary GPU supplier and an
              equity investor. Roger Montgomery's analysis characterised this as a "symbiotic loop": Nvidia's small
              equity investment (undisclosed, possibly less than A$100 million) unlocked A$830 million in equity from
              third parties plus the $10 billion debt facility, the vast majority of which returns to Nvidia as hardware
              revenue. The arrangement gives Nvidia significant indirect influence over Firmus's capital allocation
              while creating Firmus's golden-handcuff dependency on Nvidia's chip delivery schedules. GPU supply for the
              H200, GB300, and forthcoming Vera Rubin platforms is subject to structural global bottlenecks, with chips
              reportedly taking up to twelve months to be delivered. Interest accrues on the debt facility during
              construction delays. Both Project Southgate anchor customers remain unnamed, making counterparty
              creditworthiness and contract enforceability unverifiable from outside the company.
