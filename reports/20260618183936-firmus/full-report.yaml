      - number: '2.3'
        title: Buyer, User, and Payer Landscape
        blocks:
          - type: paragraph
            body: >
              Three buyer archetypes drive Firmus's current and near-term revenue. Hyperscalers are the anchor tenant
              segment: a single hyperscale contract at Southgate Melbourne committed approximately 18,400 NVIDIA GB300
              GPUs under a multi-billion, multi-year agreement with an unnamed leading global technology company,
              representing the first hyperscale AI factory contract in Australia. These buyers procure capacity as
              infrastructure debt—long-term, contracted, often structured similarly to real estate—and budget through
              global capital expenditure programmes rather than operational IT budgets. The user and payer are the same
              entity; procurement is led by infrastructure and cloud investment teams, not enterprise IT. Gartner
              identifies governments as the primary buyers of sovereign cloud IaaS globally, followed by regulated
              industries (financial services, health, defence) and critical infrastructure operators. Government and
              public sector accounted for 33 percent of the global sovereign AI infrastructure market in 2025. This
              segment in Australia is a strategic priority for Firmus: DGX Cloud (NVIDIA's managed cloud platform)
              established a new region at Southgate Melbourne, giving federal and state agencies certified sovereign
              access to frontier GPU compute for the first time. In this segment, the payer is a government IT or
              whole-of-government budget authority; the buyer is a central procurement or technology office; and the
              user is diverse (defence, science agencies, health, immigration). The third segment—enterprise, education,
              research, and AI-native startups—accesses compute through the Firmus AI Cloud as a managed service. These
              buyers are more sensitive to token cost and API availability than to facility sovereignty, and their
              budget ownership sits with CIO or CTO functions. Adoption is triggered by model training cost benchmarks,
              latency requirements, or regulatory data-residency mandates that rule out offshore cloud. Defence and
              intelligence is globally the fastest-growing sovereign AI infrastructure end-user at a 17.6 percent CAGR.
