      - number: '2.2'
        title: 'Sizing the Opportunity: Contradictory Estimates and Working Bounds'
        blocks:
          - type: paragraph
            body: >
              Market sizing for AI infrastructure in 2026 produces an unusually wide spread of estimates depending on
              how researchers define the boundary. Grand View Research pegs the global AI data center market at USD
              180.6 billion in 2026 growing at a 23.9 percent CAGR through 2033, while MarketsandMarkets uses a broader
              definition that yields USD 344 billion for 2025 rising to USD 471 billion in 2026—a discrepancy of more
              than 2.5x attributable to whether the measure includes all hardware and services co-deployed with AI
              workloads or only purpose-built AI compute. Gartner narrows to sovereign cloud IaaS and forecasts USD 80
              billion globally in 2026—a 35.6 percent year-on-year increase—with Mature Asia/Pacific growing 87 percent
              to reach USD 1.59 billion. Research and Markets estimates the total sovereign cloud market (all deployment
              modes) at USD 128.6 billion in 2026, growing at 23.4 percent CAGR to USD 298 billion by 2030. Data Bridge
              Market Research, applying the narrowest definition—sovereign AI infrastructure hardware and systems
              only—values the segment at USD 14.82 billion in 2025, forecasting USD 49.67 billion by 2033 at a 16.3
              percent CAGR, with APAC the fastest-growing region at 17.8 percent. In Australia specifically, the total
              data center market is projected to grow from USD 4.22 billion in 2025 to USD 9.02 billion by 2031 at a
              13.5 percent CAGR. The top five US hyperscalers (Microsoft, Amazon, Alphabet, Meta, Oracle) have
              collectively committed USD 660–690 billion in 2026 capex, nearly doubling 2025 levels, and all four
              largest self-report being supply-constrained rather than demand-constrained. This capex surge creates the
              structural pull that makes Firmus's factory model commercially viable: every GPU cluster Firmus deploys is
              potential overflow capacity for hyperscalers unable to build in their primary markets fast enough. Sizing
              Firmus's own opportunity requires layering three lenses: a TAM anchored on the global market data above; a
              SAM constrained to APAC sovereign AI factory capacity; and an SOM derived from Firmus's contracted
              pipeline and buildout runway to 2028.
