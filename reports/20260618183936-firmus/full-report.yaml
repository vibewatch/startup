            title: Renewable Energy and Sovereign Positioning Is Credible but Faces Fast Followers
            body: >-
              Firmus is one of the few GPU cloud providers globally to combine a 100% renewable energy commitment with
              majority-Australian ownership — a combination that is genuinely differentiated from CoreWeave, Lambda
              Labs, and the hyperscalers as of mid-2026. The CDC partnership and NVIDIA DGX Cloud anchor tenancy are
              real structural assets. However, both NEXTDC (via OpenAI S7 campus) and hyperscalers (via A$20B+
              Australian investment and accelerating IRAP certification) are competing directly on the sovereignty
              dimension. The renewable energy moat depends on actual new renewable generation being catalysed by Project
              Southgate, not merely procured — a higher bar that has already attracted Tasmanian political scrutiny over
              power allocation priorities.
