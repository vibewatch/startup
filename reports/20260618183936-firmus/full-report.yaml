      - number: '8.2'
        title: Financing Context, Entry Discipline, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              Firmus's private valuation trajectory over six months is one of the steepest documented for any Australian
              startup: from USD $1.9 billion (September 2025, AUD $330 million Nvidia-led round) to USD $6 billion
              (November 2025, AUD $500 million round) to USD $5.5 billion post-money (April 2026, USD $505 million
              Coatue-led final pre-IPO round with Nvidia). The apparent step-down from USD $6 billion to USD $5.5
              billion post-money in the April 2026 round reflects currency movement and deal structure rather than a
              flat round: the AUD equivalent was AUD $7.95 billion, slightly ahead of the November 2025 AUD $8 billion
              implied mark. Startup Daily and investor correspondence report the IPO targeting an AUD $8 billion minimum
              with aspirations to AUD $12 billion depending on bookbuild demand — implying a 50–100 percent step-up from
              the last private mark.

              The financing context creates specific entry discipline considerations for public investors. Pre-IPO
              shareholders who backed the September 2025 round at AUD $1.9 billion hold paper gains of approximately
              300–320 percent at the April 2026 mark, rising to 320–530 percent at an AUD $8–12 billion IPO. Under the
              reported no-escrow structure, every one of those holders — including founders, management, and
              institutions — can sell from day one of listing. The IPO raise of AUD $2 billion at an AUD $8 billion
              pre-money valuation represents a 25 percent implied new-share dilution, but the split between primary
              proceeds (to Firmus's balance sheet) and secondary proceeds (to selling shareholders) has not been
              publicly disclosed; if a large component is secondary, the balance sheet benefit is correspondingly
              smaller.

              The Blackstone USD $10 billion facility, structured by Milbank (Firmus), Allens (Blackstone), and Kirkland
              & Ellis, is senior-secured and project-finance-style: drawdown is conditioned on executed long-term
              customer contracts, staged against deployment. The facility is a genuine creditworthiness signal —
              Blackstone's institutional credit process is rigorous — but it also creates a debt-to-equity ratio
              exceeding 7:1 at full drawdown against the equity raised to date. At private infrastructure debt rates of
              7–9 percent, full drawdown implies annual interest of USD $700–900 million, substantially exceeding any
              publicly disclosed revenue level and making GAAP profitability path-dependent on contracted pricing that
              has not been disclosed. CoreWeave's parallel experience is instructive: despite an adjusted EBITDA margin
              of approximately 56 percent in FY2025, CoreWeave reported a GAAP net loss of USD $740 million in Q1 2026
              alone after debt service and GPU depreciation.

              The recommendation is TRACK. The structural case for AI infrastructure investment in sovereign APAC
              markets is evidence-based and credible. The question is price. At AUD $8 billion and no prospectus revenue
              disclosure, Firmus is asking public investors to apply CoreWeave-equivalent multiples (8–10x 2026E
              revenue) to a revenue figure that does not exist in the public record. The entry is stretched on available
              evidence, but not unattractive in concept; the diligence asks in Section 5 define precisely what evidence
              would convert a TRACK to a BUY.
