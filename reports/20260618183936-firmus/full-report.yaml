          - type: callout
            title: GPU Export Controls Create Geopolitical Financing Risk for Singapore Operations
            body: >-
              Nomura's struggle in early 2026 to syndicate a US$120 million credit facility for Firmus Metal Singapore —
              with investor concerns centred on US export restrictions on NVIDIA H100 chips and the risk of
              proximity-to-China re-export enforcement — is an early signal that Firmus's Singapore-origin business
              carries a risk profile that mainstream institutional debt investors are not yet comfortable pricing. The
              Australian sovereign narrative insulates the domestic business but does not eliminate exposure to the
              Singapore and broader Asia-Pacific entity, where the original Hypercube GPU leasing model was developed.
              If US export-control enforcement escalates, the Singapore operating vehicle and regional expansion plans
              face financing constraints independent of the Australian Project Southgate trajectory.
