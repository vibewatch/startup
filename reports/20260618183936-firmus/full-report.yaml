      - number: '1.4'
        title: Milestones, Operational Scale, and Adverse Events
        blocks:
          - type: paragraph
            body: >
              Firmus's operational track record spans Singapore deployments, Tasmania construction, and a rapidly
              expanding national Australian rollout under Project Southgate. The Singapore operation — live since 2024
              Q1 through the STT GDC partnership — provides the only revenue-generating AI Factory the company operated
              at scale prior to 2026. Firmus deployed approximately 4,000 Nvidia GPUs across two STT sites in Singapore,
              with 99 PFLOP/s total compute deployed for the SEA-LION project (AI Singapore's open-source LLMs for
              Southeast Asian languages). The Singapore facility received the DCD Asia-Pacific Data Center Project of
              the Year award in 2024, and SemiAnalysis ranked Firmus among its Top 3 Global GPU Cloud providers
              (ClusterMAX) in both 2024 and 2025.

              Project Southgate, announced alongside the September 2025 equity raise and expanded in October 2025 with
              the CDC Data Centres and Nvidia strategic alliance, is the company's flagship growth vehicle. The initial
              stage is centred on a campus in Launceston, Tasmania — powered by the island state's hydroelectric grid —
              targeting 90 MW of AI compute (44 MW in Stage 1a, 90 MW at Stage 1b). Subsequently the project expanded to
              a national programme with sites in Melbourne, Canberra, Sydney, and Perth, bringing the total planned
              capacity to 1.6 GW by 2028. The programme is built around the Nvidia Vera Rubin DSX reference design and
              is co-developed with CDC Data Centres; the declared total build cost is A$73.3 billion. Firmus's
              spokesperson indicated in November 2025 that the Melbourne and Tasmanian centres were expected to come
              online by April and August 2026 respectively, and that staff would move into the Canberra centre in the
              first half of 2026.

              The company's benchmarked credentials include MLPerf V4.0 Certified Training and Power results and the
              Cleantech Group APAC Top 25 award in 2025. However, Firmus's headline efficiency claim — a Power Usage
              Effectiveness (PUE) of 1.03 — has drawn substantive expert scepticism. A Firmus spokesperson confirmed
              this figure is a "point measurement" taken from a 2021 immersion deployment in Tasmania and cannot be
              independently verified, as no recognised certification body for PUE exists. UNSW senior research associate
              Dr Amr Omar described a PUE of 1.03 as "at the extreme end of what is now possible anywhere in the world,"
              noting that global hyperscalers typically achieve approximately 1.2. Sam Maher (GovTech Australia)
              expressed concern that some investors were being swayed by narrative rather than the underlying
              infrastructure case. Roger Montgomery Investment Management raised additional concerns about Firmus's
              reliance on Nvidia (estimating Nvidia's equity investment at tens of millions, unlocking A$830 million in
              other equity and US$10 billion in debt that would substantially flow back to Nvidia as hardware revenue)
              and the absence of publicly disclosed long-term binding customer contracts.

              On the regulatory side: in March 2026, Firmus signed a multi-billion-dollar deal for a Melbourne AI
              Factory involving 18,400 Nvidia GB300 GPUs; in July 2025 the Tasmanian government established the
              world-first AI Factory Zone in Tasmania; and in July 2025 Firmus signed an MoU with the Singapore Port
              Authority for seawater-cooled AI compute.
