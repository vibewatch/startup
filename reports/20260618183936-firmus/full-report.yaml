      - number: '8.5'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness for Firmus is high on structural process dimensions and low on transparency dimensions.
              Structurally, ASX listing infrastructure is in place: bookrunners (Bank of America, JPMorgan, Morgans
              Financial, and Morgan Stanley) have been appointed; global roadshows were conducted; and ASX Good Fame and
              Character assessment for Oliver Curtis was cleared in March 2026 following the ASX's February 2026
              framework clarification. The Blackstone facility creates institutional credibility. Board composition has
              been strengthened with three new independent non-executive directors appointed in March 2026, including
              Lee Hatton (Audit and Risk Committee Chair) and Christine Bartlett (Remuneration Committee Chair). On
              transparency, no prospectus has been lodged with ASIC as of the run date (June 18, 2026); no revenue,
              gross margin, or burn rate has been publicly disclosed; the identity of both cornerstone hyperscale
              customers remains undisclosed; and no independent audit of operating efficiency claims exists.

              The absence of an IPO lock-up or escrow is the most immediately actionable structural risk. Standard
              practice for a technology listing of this size would include a 90–180 day escrow on founders, management,
              and major pre-IPO institutional shareholders. The reported no-escrow structure exposes incoming IPO
              investors to selling pressure from holders who have already realised 300–530 percent gains on paper. Key
              pre-IPO institutions including Ellerston Capital (approximately 7%), Regal Funds, Wilson Asset Management,
              Paradice, UniSuper, and others could all sell from day one. Oliver Curtis himself holds estimated equity
              worth AUD $1.25 billion at the last mark. Maas Group acquired a AUD $100 million stake in February 2026
              funded by proceeds from selling its building materials division — a position also immediately liquid at
              listing.

              The thesis-break triggers set out in TV005 are designed to be monitored during the bookbuild and
              post-listing. They translate directly to the six final diligence asks in TV006. Two are structural
              blockers — prospectus revenue disclosure and escrow structure — that should be resolved before any
              commitment. The remaining four (contract term disclosure, independent efficiency audit, build-cost
              verification, and debt service coverage ratio) are material but potentially resolvable in the 30 days
              before IPO close.

              The appropriate investor action given current evidence is TRACK: follow the IPO process, review the
              prospectus when lodged, and re-assess the buy/avoid decision once revenue, customer identity, and escrow
              structure are confirmed. An investor seeking AI infrastructure exposure in the interim may find NEXTDC at
              current ASX multiples a lower-risk sovereign APAC proxy. CoreWeave at 8–10x 2026 forward revenue provides
              a liquid public benchmark; at the same multiple, Firmus's prospectus must disclose AUD $800 million to AUD
              $1.5 billion in annual revenue for a BUY to be warranted.
            claimRefs:
