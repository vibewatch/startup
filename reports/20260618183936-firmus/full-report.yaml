      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Firmus's pre-2024 equity history is not publicly disclosed. The earliest identifiable outside investment
              is approximately A$10 million from Regal Funds Management (Phil King), understood to have been invested as
              a convertible note circa 2021 when the company was still primarily a bitcoin-mining cooling business. A
              June 2023 partnership with ST Telemedia Global Data Centres (STT GDC — owned by Singapore sovereign wealth
              fund Temasek Holdings) provided the operational foundation for Firmus's Singapore AI Factory deployments;
              the arrangement saw Firmus own and operate the internal IT network and compute across two STT data-centre
              sites with approximately 4,000 Nvidia GPUs, while STT retained ownership of the physical facilities. The
              Witness attributed a US$100 million strategic investment to STT GDC in 2023; this figure has not been
              independently confirmed in primary sources and is marked as unverified.

              Three equity rounds and one debt facility between September 2025 and April 2026 transformed Firmus into
              one of the most capitalised private technology companies in Australian history:

              — September 16, 2025 (Series B per SVIIC / Private Placement per Caplight): A$330 million at a post-money
              valuation of A$1.85 billion. Cornerstone from Ellerston Capital (investment director David Leslie joined
              the board); strategic participation from Nvidia. Existing investors Regal Funds Management, Archibald
              Capital, and Tectonic Investment Management participated. Alex Waislitz and the Pratt family (Heloise
              Pratt/ Visy) are also shareholders. Ellerston Capital's stake is understood to approach 7 per cent.

              — November 14, 2025: A$500 million at a post-money valuation of approximately A$6 billion — a
              near-threefold uplift in eight weeks. Morgans acted as sole lead manager; Highbury Partnership was
              financial adviser. Additional institutional investors including UniSuper and Wilson Asset Management
              participated alongside existing backers.

              — February 2026: Maas Group Holdings (ASX: MGH) invested A$100 million at the A$6 billion valuation,
              acquiring approximately 1.7% equity. Maas subsidiary JLE will form part of Firmus's sovereign supply chain
              for its AI Factory rollout.

              — February 9, 2026 (debt): US$10 billion debt financing facility led by Blackstone Tactical Opportunities
              and Blackstone Credit & Insurance, supported by Coatue. Described by Firmus as one of the largest private
              debt financings in Australian history; structured as long-dated infrastructure debt.

              — April 6, 2026 (Strategic / Series F): US$505 million at a post-money valuation of US$5.5 billion, led by
              Coatue Management (General Partner Robert Yin quoted) with continued Nvidia participation. Subject to
              certain closing conditions at the time of announcement. Total equity raised in the six-month period
              through April 2026: approximately US$1.35 billion.

              Conflict note: the November 2025 raise was announced by Firmus at an A$6 billion valuation (Australian
              dollars), while the April 2026 announcement cited a US$5.5 billion post-money valuation; the difference is
              substantially explained by USD/AUD exchange rates but creates a surface-level discrepancy in media
              coverage that characterised the company as valued at "US$6 billion" in some outlets.

              As of the chapter run date, Firmus's IPO targeting the ASX is expected in June or July 2026. Reports
              indicate the float will aim to raise A$2–3 billion in new capital, with IPO advisors including Bank of
              America, JPMorgan, Morgans Financial, and Morgan Stanley. A non-deal roadshow was conducted with potential
              investors in April 2026. Investor correspondence circulated to prospective shareholders was reported to
              indicate the IPO is "on track for June or July" and expected to be priced 40–100% above the then-current
              valuation, implying a range of A$8–12 billion. James Packer is reported to have purchased approximately
              A$50 million in shares alongside Nvidia at approximately A$145 per share. Reports indicate no escrow
              period will be enforced for pre-IPO shareholders at listing, which independent fund managers have flagged
              as a significant structural governance concern.
