              Firmus AI Cloud services carry ISO 27001 and SOC-2 compliance claims with encryption in transit and at
              rest.

              No public certificate registry link has been published; scope across AI Factory physical infrastructure

              versus cloud services only is unclear. An FCAS certification from AEMO covers Synert grid participation

              at existing production sites. There is a name-space risk: Firmus Pte Ltd (firmussec.com) is a separate

