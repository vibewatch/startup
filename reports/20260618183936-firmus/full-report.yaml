        title: Differentiation, Trust, and Compliance
        blocks:
          - type: paragraph
            body: >
              Firmus's technology differentiation rests on three pillars: a layered patent portfolio, independently

              benchmarked performance, and cloud security certifications. On IP, patent attorneys FB Rice confirmed that

              Firmus holds granted patents in Australia, the US, and other jurisdictions covering core liquid-cooling

              systems, grid-stabilisation software, and specific innovations in pipework design, temperature control,
              and

              HyperCube software. Divisional filings create a layered "patent thicket" protecting foundational
              technologies

              and incremental improvements, providing leverage in licensing and deterring direct replication.


              On performance benchmarking, Firmus submitted to MLPerf Training V4.0 with power measurements at the

              immersion-rack level reviewed by MLCommons, showing approximately 30% better energy efficiency vs. H100

