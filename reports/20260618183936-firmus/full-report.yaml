      - number: '4.4'
        title: GTM Motion and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Firmus operates a two-track go-to-market model. The cloud channel is direct self-serve with transparent
              CPU and storage pricing accessible from the public pricing page, targeting AI developers, researchers,
              startups, and enterprise teams that need on-demand compute without a long procurement cycle. The
              enterprise and sovereign channel is relationship-driven and contract-first: dedicated AI infrastructure
              capacity is sold through multi-year agreements negotiated directly with hyperscalers, large enterprises,
              education institutions, and government customers. The DGX Cloud regional placement at Southgate Melbourne
              introduces a third distribution layer — Nvidia's managed AI platform reselling access to Firmus
              infrastructure to Nvidia's enterprise customer base, which blurs the boundary between direct and
              platform-mediated sales.

              No traditional sales-efficiency metrics — customer acquisition cost, payback period, net revenue
              retention, or average contract value by segment — are publicly disclosed. The closest available proxy is
              Lennox Capital Partners' October 2025 analyst assessment, which valued the near-term 150 MW pipeline at a
              potential figure over 10x Firmus's then-current valuation, using operating profit multiples benchmarked
              against comparable GPU-cloud operators. The second proxy is the disclosed contract scale: a multi-billion
              dollar, multi-year enterprise contract for 18,400 GPUs implies average contract values in the hundreds of
              millions to low billions of dollars, which are consistent with the hyperscale AI infrastructure market but
              compress CAC into essentially one-of-a-kind deal economics rather than a systematic sales funnel.

              The sovereign and enterprise focus is strategically coherent given Firmus's position as an
              Australian-based operator: government and enterprise customers in the Asia-Pacific who require data
              residency and low-carbon compute cannot easily substitute U.S. hyperscaler capacity. The dual focus on
              Australia and Singapore gives Firmus access to two of the most active sovereign-AI infrastructure markets
              in the region. The absence of disclosed CAC and payback data means it is not possible to assess whether
              the enterprise sales motion is capital-efficient or whether the pipeline is durable beyond the two
              announced contracts.
            claimRefs:
