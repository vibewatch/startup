chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Origins
        blocks:
          - type: paragraph
            body: >
              Firmus Technologies designs, builds, and operates what it calls AI Factories — modular, liquid-cooled,
              high-density compute platforms purpose-built for AI training and inference workloads. The company's
              operational headquarters is in Singapore, with its principal registered entities in Australia: Firmus Grid
              Pty Ltd (incorporated December 2019) and Firmus Technologies Pty Ltd (incorporated November 2021). The
              startup's current registered address in tracxn filings is Saint Leonards, New South Wales; a competing
              article describes it as "Founded in Sydney," while early coverage ties the founding operations to Tasmania
              — a conflict this chapter preserves as an unresolved geographic detail.

              The company was co-founded in 2019 by Oliver Curtis, Tim Rosenfield, and Jonathan Levee. None of the three
              founders had a prior data-centre or engineering background: Rosenfield was previously CEO of lingerie
              company Simone Perele; Levee had middle-management experience in the resources sector; Curtis was an
              investment banker turned cryptocurrency investor after his release from prison. The original business
              purpose was developing liquid-cooling technology for bitcoin-mining rigs, leveraging Tasmania's cool
              climate and hydroelectric energy to lower operating costs. Nick Curtis (Oliver's father and former mining
              executive) served as the inaugural board chair. After bitcoin prices fell, former Telstra executive Ted
              Pretty succeeded Nick Curtis as chair and helped pivot the company toward AI data-centre applications. Ted
              Pretty subsequently stepped down, and in late 2025 the company appointed Grant Dempsey as the incoming
              board chair.

              Firmus describes its AI Factory as a "modular, verticalized system that optimises cost and power at every
              layer of the stack," built around the Firmus Hypercubes (multi-petascale modular compute abstractions),
              Synert (grid-integration software deployed with Eaton in Tasmania), and direct-to-chip liquid cooling. The
              company also operates Firmus AI Cloud — a GPU-powered neocloud (H200, L40S, and GB300 Blackwell instances)
              — making its business model a combination of capital-intensive infrastructure ownership and cloud-services
              revenue. Its flagship external project is Project Southgate: a national network of AI factories across
              Australia targeting 1.6 GW of AI compute by 2028 in partnership with CDC Data Centres and Nvidia.
