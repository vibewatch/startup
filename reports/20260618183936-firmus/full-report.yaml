      - number: '3.2'
        title: Australian Infrastructure Incumbents
        blocks:
          - type: paragraph
            body: >-
              Within Australia, NEXTDC is the most formidable domestic rival. The ASX-listed operator announced a A$2.2
              billion capital raise (A$1.5B equity + A$700M debt) in April 2026 after securing what it described as its
              largest ever customer contract — a 250 MW commitment at its S4 campus, widely attributed to Microsoft.
              NEXTDC's FY26 capex guidance was lifted to A$3 billion, and management targets A$1 billion EBITDA by 2030
              versus current-year guidance of approximately A$235 million. In December 2025 NEXTDC signed an MoU with
              OpenAI to co-develop a A$7 billion, 550–650 MW AI campus at its S7 site in Eastern Creek, Western Sydney —
              positioning it as the sovereign vehicle for OpenAI's Australian compute needs. Critically, NEXTDC CEO
              Craig Scroggie publicly questioned in April 2026 whether Firmus facilities can meet enterprise-grade
              quality, disputing Firmus's claimed build cost of approximately US$6 million per megawatt versus an
              industry standard he cited at approximately US$12.4 million per megawatt. This dispute is unresolved: if
              Firmus's cost structure is substantially accurate it is a durable efficiency moat; if it is not, the
              margin thesis and IPO valuation are materially at risk.

              CDC Data Centres is both Firmus's primary infrastructure partner and a structural competitor. As the
              largest private (unlisted) data-centre operator in Australia, CDC provides the sovereign physical backbone
              for Project Southgate. However, CDC independently serves hyperscalers, government, and enterprise clients;
              its relationship with Firmus creates alignment and dependency simultaneously. A deterioration in the CDC
              partnership — or CDC building its own GPU cloud offering — could disrupt Firmus's supply side.

              Macquarie Data Centres is completing its IC3 Super West facility in Sydney (47 MW, A$350 million Phase 1),
              due to open in Q3 2026 with liquid-cooling density capable of supporting AI workloads at 150 kW+ per rack,
              and a partnership with Dell and NVIDIA to deliver the Dell AI Factory platform on-site. Its sovereign
              Australian ownership and Macquarie Group backing give it credibility in regulated sectors.

              AUCloud (AUCyber Limited, ASX-listed) holds IRAP certifications and focuses on sovereign IaaS, MSSP, and
              managed IT for Australian government and defence. Its revenue is estimated in the low tens of millions
              AUD, with negligible GPU-at-scale capability. It is a market participant in the same sovereignty
              conversation but not a GPU-infrastructure rival at Firmus's planned scale.
