        - Creates overflow demand for contracted AI factory capacity beyond hyperscaler own builds
        - Confirm off-take contract duration and renewal terms
      - - Sovereign AI mandate and data-residency laws (100+ countries)
        - Driver
        - Positive
        - Now and accelerating
        - Firmus's Australian sovereign credentials unlock government procurement that excludes offshore cloud
        - Map which AU government frameworks explicitly require on-shore AI compute
      - - Geopatriation trend (20% workload shift from global to local providers by 2028)
        - Driver
        - Positive
        - 2026–2028
        - Supports sustained long-term demand from regulated industries and public sector
        - Track Gartner update metrics on AU sovereign cloud IaaS growth
      - - APAC AI infrastructure gap (fastest-growing sovereign AI region globally at 17.8% CAGR)
        - Driver
        - Positive
        - Multi-year
        - Australia well-positioned as APAC hub for allied markets; Southeast Asia expansion pathway
        - Monitor ASEAN government AI infrastructure procurement pipelines
      - - Tasmania hydroelectric grid (PUE ~1.03, near-record energy efficiency)
        - Driver
        - Positive
        - Now
        - Structural cost advantage in token economics; ESG credentials for hyperscaler buyers
        - Seek independent PUE verification from third-party auditor
      - - Australian data centre spending surging (+60% Q3 2025, +140% YoY)
        - Driver
        - Positive
        - Now
        - Market receptivity confirmed by spending data; policy tailwinds from NSW government fast-tracking
        - Verify ABS data source and whether Firmus capex is included
      - - 'Grid capacity constraint (Transgrid: pipeline exceeds connection capacity in NSW)'
        - Constraint
        - Negative
        - Now–2027
        - Sydney site faces connection queue and timeline uncertainty; Tasmania and Melbourne sites advantaged
        - Confirm grid connection status for each planned Southgate site
      - - AEMC March 2026 draft grid standards (30 MW threshold, ride-through compliance)
        - Constraint
        - Negative
        - 2026–mid-2026 finalization
        - New engineering compliance costs and connection-agreement requirements for all NEM-connected facilities
        - Assess incremental capex per factory site to meet ride-through requirements
      - - 'Regulatory risk: AEMC/COAG proposal to require full renewable offset for new DCs'
        - Constraint
        - Negative
        - 2026–2027
        - Could extend permitting timelines; Firmus's renewables integration may qualify it for fast-track treatment
        - Monitor AEMC July 2026 report and state minister positions on mandatory offset rule
      - - 'Greenpeace and NGO pressure: moratorium call on new data centre approvals'
        - Constraint
        - Negative
        - Now–ongoing
        - Political and reputational risk; could slow planning approval in mainland sites (Melbourne, Sydney, Perth)
        - Track state planning decisions and community opposition at Kemps Creek and mainland sites
      - - AI model efficiency risk (Jevons paradox uncertainty)
        - Constraint
        - Mixed
