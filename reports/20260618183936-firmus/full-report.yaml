      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Contract-Backed Debt Structure Aligns Capital Deployment With Revenue
            body: >-
              The Blackstone $10 billion facility is structured to be drawn only against executed long-term customer
              contracts with hyperscalers and blue-chip AI customers. This mirrors project-finance structures used in
              contracted energy infrastructure, where revenue coverage provides genuine debt serviceability. The two
              announced multi-billion dollar hyperscale commitments under Project Southgate demonstrate that the
              drawdown mechanism is operational: capital is following signed contracts rather than speculative pipeline,
              meaningfully reducing the lender risk that unconstrained infrastructure debt typically carries.
            calloutType: strength
            claimRefs:
              - CI003
              - CI004
              - CI008
              - CI036
          - type: callout
            title: GPU Depreciation and Debt Service Compress Equity-Level Returns
            body: >-
              CoreWeave's public disclosures provide the clearest available evidence of how AI cloud infrastructure
              economics play out under debt. In FY2025 CoreWeave reported adjusted EBITDA of 56% but a net loss of USD
              $1.17 billion after GPU depreciation and interest on USD $21 billion of debt. Firmus faces structurally
              identical dynamics: headline EBITDA margins will be compressed to near-zero or negative net margins during
              the build-out phase, the GPU generation currently being deployed (GB300 Blackwell) will require a refresh
              cycle within approximately 4-5 years, and the $10 billion debt load creates interest obligations that will
              absorb a material fraction of contracted revenue. Public investors buying the IPO at an AUD $8-12 billion
              implied valuation would be pricing in a successful resolution of these dynamics before a single quarter of
              audited public financials is available.
