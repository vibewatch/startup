      - number: '1.2'
        title: Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >
              Firmus operates under a co-CEO structure: Oliver Curtis and Tim Rosenfield share the top executive role.
              Curtis and Rosenfield are cousins; Jonathan Levee, the third co-founder, is now Director of Research and
              Development and was described in press coverage as a former brother-in-law of Curtis. This concentrated
              familial and personal network at the founding layer creates key-person dependence that diligence must
              specifically address.

              Curtis's 2016 insider-trading conviction is the most material governance risk in the Firmus profile.
              Between May 2007 and June 2008, Curtis conspired with former best friend John Hartman to conduct 45
              profitable CFD trades using Hartman's inside knowledge of employer Orion Asset Management's trading
              intentions, generating a net profit of A$1,432,228.85. Convicted by a Supreme Court jury in June 2016,
              Curtis was sentenced to two years' imprisonment; he served twelve months at Cooma Correctional Centre and
              was released on 23 June 2017. His appeal against conviction was dismissed on 16 December 2016. Curtis has
              since publicly described the offence as "a mistake" made as a young man.

              On 23 February 2026, the ASX Listings Compliance department published a compliance update dedicated to its
              "Good Fame and Character" test — widely understood by market observers to be connected to the forthcoming
              Firmus IPO. The framework weighs factors including the dishonesty of prior conduct, passage of time,
              contrition, and subsequent regulatory acceptance. Curtis was subsequently reported to have been cleared to
              run Firmus as a publicly listed company, with the nine.com.au AFR Rich List profile published on 27 May
              2026 confirming the approval. Curtis debuted on the AFR's The List – Australia's Richest 250 in May 2026
              with an estimated personal fortune of A$1.25 billion.

              Board composition strengthened materially in 2025–2026. Grant Dempsey was appointed incoming chair and
              Kirsty Godfrey-Billy became CFO in late September 2025. David Leslie (Ellerston Capital investment
              director) joined the board following the September 2025 equity raise. Three further non-executive
              directors were appointed effective March 2026: Lee Hatton (Chair of Audit and Risk Committee; former Xero
              board member and Block Inc executive); Christine Bartlett (Chair of Remuneration and Nomination Committee;
              current Chair of NSW Ports and CEDA, former IBM and NAB executive); and Julie Shuttleworth AM (former
              Deputy CEO and CEO of Fortescue Future Industries). Bloomberg and Firmus's own newsroom confirmed these
              appointments on 23 March 2026.

              Independent institutional analysts — including Roger Montgomery Investment Management and the NAOS Asset
              Management investor note published via Livewire Markets — have specifically flagged Curtis's conviction as
              directly relevant to the role of a director or executive at a publicly listed company, and have questioned
              whether Australia's regulatory framework is adequately calibrated for an IPO of this scale.
