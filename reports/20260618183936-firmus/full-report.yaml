  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Governance, Legal, and Regulatory Risks
        blocks:
          - type: paragraph
            body: >-
              The most prominent single governance risk in Firmus's profile is the 2016 insider-trading conviction of
              co-CEO Oliver Curtis. Curtis conspired with a former colleague to execute 45 profitable CFD trades using
              advance knowledge of a fund manager's trading intentions between 2007 and 2008, generating net proceeds of
              A$1,432,228.85. He was convicted by a Supreme Court jury, sentenced to two years' imprisonment, and served
              twelve months. His appeal was dismissed. The ASX subsequently passed Curtis under its Listing Rule 1.1
              Condition 20 Good Fame and Character framework — a test the ASX administers for directors and proposed
              directors of any entity seeking admission to the official list. The ASX can extend checks to senior
              managers and can refuse or revoke listing if standards are not maintained. Independent fund managers,
              including Roger Montgomery and NAOS Asset Management, publicly identified the conviction as directly
              relevant to the exercise of a director role at a publicly listed company of this scale.

              A further structural governance risk is the proposed absence of escrow or share-sale restrictions for
              pre-IPO shareholders at listing. This is atypical for major technology floats in Australia, where a
              lock-up period is standard practice. Independent fund managers have characterised the lack of escrow as
              effectively converting retail IPO buyers into exit liquidity for early backers. The concern is compounded
              by extreme concentration: some boutique VC and PE funds hold Firmus positions representing more than sixty
              percent of total fund value following rapid valuation markups, creating strong incentives to crystallise
              gains immediately at listing.

              On the regulatory side, Firmus's planned data centre operations fall squarely within the scope of
              Australia's Security of Critical Infrastructure Act 2018 (SOCI Act). Data storage and processing assets
              used to provide services to Commonwealth, State, or Territory bodies, or to responsible entities for other
              critical infrastructure assets, qualify as critical data storage or processing assets. Once captured,
              responsible entities must register assets, report cyber incidents, and adopt, maintain, and comply with a
              written Critical Infrastructure Risk Management Program (CIRMP). Proposed 2026 amendments to the SOCI Act
              would impose substantially more prescriptive obligations on high-risk asset classes, including
              requirements for supply chain mapping, vendor FOCI risk assessments, phishing-resistant MFA, network
              segregation capable of three months of independent operation, and AusCheck background checks for critical
              workers. Civil penalties for non-compliance could reach $3.3 million per incident under proposed reforms.
              The ASIC inquiry into ASX governance (Final Report published March 2026) also signals a tightening
              regulatory environment for listed entities and their officers, with transformational change demanded
              across risk management and compliance functions.
