            title: NEXTDC CEO Publicly Disputes Firmus Build Quality and Cost Claims
            body: >-
              In April 2026, NEXTDC CEO Craig Scroggie used the company's analyst call to question whether Firmus
              facilities can be built to enterprise-grade quality. Scroggie cited an industry-standard build cost of
              approximately US$12.4 million per megawatt, contrasting it with Firmus's claimed approximately US$6
              million per megawatt — a near-50% discount that, if inaccurate, would collapse a central pillar of the
              Firmus financial model. This is not a generic competitive jab: it is a senior operator with multi-gigawatt
              delivery experience raising a specific technical and financial claim. Independent engineering verification
              of Firmus's per-MW capex is a prerequisite for any underwriting of the IPO valuation.
