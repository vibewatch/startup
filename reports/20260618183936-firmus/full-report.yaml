      - number: '7.2'
        title: Operational, Technical, and Cybersecurity Risks
        blocks:
          - type: paragraph
            body: >-
              Firmus's competitive moat rests heavily on claimed industry-leading efficiency, most visibly a Power Usage
              Effectiveness (PUE) figure of 1.03. The PUE formula measures total facility power divided by IT equipment
              power — a perfect score is 1.0. Global hyperscalers including Google and Microsoft typically report PUEs
              in the range of 1.09 to 1.2; most Australian data centres operate between 1.4 and 1.7. Firmus has since
              acknowledged that its 1.03 figure was a point measurement taken in 2021, not an independently audited
              annual average. Dr. Amr Omar of the University of New South Wales characterised the claim as sitting at
              the extreme end of global possibility. No third-party verification of the PUE figure has been made
              available to the public. If sustained efficiency materially below 1.03 is eventually documented, the
              economic thesis — which assumes structurally superior power economics underpinning margin — is directly
              weakened.

              The operational model depends on liquid immersion cooling, which introduces a specialised maintenance
              requirement. The global pool of technicians trained and certified in liquid immersion cooling is currently
              very limited. Scaling from a few thousand GPUs to 1.6 GW by 2028 implies rapid headcount growth in a skill
              that is not widely available. Failure to staff this function adequately could manifest as facility
              downtime, voided warranty coverage, or safety incidents.

              The NEXTDC challenge also deserves specific focus as a technical credibility signal. NEXTDC's CEO Craig
              Scroggie publicly disputed Firmus's claimed build cost of approximately US$6 million per megawatt, citing
              an industry standard of approximately US$12.4 million per megawatt. If Scroggie's characterisation is
              accurate and Firmus's cost figures are not verified by prospectus-grade third-party assessment, the entire
              margin and return-on-capital framework underpinning the IPO valuation would be challenged. As of this run
              date, no independent build-cost audit of the AI Factories has entered the public domain.

              From a cybersecurity standpoint, data centres that handle AI workloads for unnamed hyperscale customers
              are by definition high-value targets. SOCI Act obligations mandate cyber incident reporting and CIRMP
              adoption. Proposed 2026 amendments would require Maturity Level 2 under Essential Eight, ISO 27001, NIST
              CSF 2.0, or equivalent frameworks — a significant uplift for an operator that entered the space only in
              2021. The 24-month SOCI grace period for cyber maturity means obligations could come due in mid-2028,
              coinciding with the peak of Project Southgate buildout.
