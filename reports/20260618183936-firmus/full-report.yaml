  - id: TV003
    title: Bull / Base / Bear Scenario Analysis
    columns:
      - Scenario
      - Key Assumptions
      - Valuation Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull
        - >-
          IPO at AUD $10–12B in H2 2026; contract identities disclosed in prospectus; 200MW+ online H2 2026; revenue
          reaches AUD $1.5–3B by 2027–2028; AI demand remains supply-constrained; Blackstone drawdown proceeds smoothly.
        - >-
          10–15x forward revenue on AUD $1.5–3B implies EV of AUD $15–20B by 2028–2029; IPO investors at AUD $10B entry
          achieve 50–100% returns. CoreWeave backlog of $99.4B as a structural comp validates the demand trajectory.
        - >-
          Requires all five conditions simultaneously: IPO pricing at range-top, customer disclosure, operational ramp,
          debt drawdown, sustained demand — low compounding probability.
        - >-
          Low-to-moderate. All individual conditions have moderate-to-high probability but joint probability is lower;
          AI efficiency gains or GPU supply normalisation are the primary downside catalysts.
      - - Base
        - >-
          IPO at AUD $7–9B in H2 2026; partial contract disclosure; revenue ramp to AUD $600M–$1.2B by end 2027;
          multiple compression to 6–8x as growth normalises; debt service absorbs significant FCF.
        - >-
          6–8x revenue on AUD $600M–$1.2B implies EV of AUD $3.6–9.6B by 2027; flat-to-modest returns for IPO investors
          at AUD $8B entry. Net returns compress as interest expense (est. $700–900M/yr at full drawdown) absorbs cash
          flow.
        - >-
          Multiple compression as market matures; governance overhang persisting; delayed customer disclosure;
          slower-than-planned GPU deployment.
        - >-
          Most likely scenario given evidence base; consistent with market precedent for capital-intensive pre-revenue
          infrastructure operators at IPO.
      - - Bear
        - >-
          IPO delayed to Q1 2027+ or priced below AUD $6B; major contract cancelled or renegotiated; AI demand softens;
          build-cost efficiency claims substantiated as overstated; debt service becomes unsustainable pre-revenue.
        - >-
          At 3–5x compressed revenue multiple on AUD $300–$600M actual revenue, EV of AUD $1.5–3B implies 62–81%
          drawdown from AUD $8B IPO entry. Potential covenant stress on Blackstone facility. Down-round risk material.
        - >-
          No escrow creates first-day selling pressure; governance incident could trigger institutional boycott; GPU
          oversupply event; regulatory intervention on Tasmania hydro allocation.
        - >-
          Moderate probability; any single trigger (escrow-free crash, cancelled contract, AI demand softening) is
          individually plausible. The combination of pre-revenue + extreme leverage + no escrow creates compounded
          downside convexity.
    notes: >-
      All scenario valuations are author-derived illustrative ranges based on comparable analysis (CoreWeave, Lambda,
      NEXTDC, AI DC M&A precedents) and disclosed capital structure. They are not financial advice and do not reflect
      any prospectus guidance, which has not been published as of June 18, 2026.
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV009
      - CV007
