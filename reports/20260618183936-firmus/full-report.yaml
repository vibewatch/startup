      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Grid Access and Regulatory Delay Are the Binding Constraints—Not Market Demand
            body: >
              Every major data centre operator in Australia, Firmus included, faces the same demand signal: more
              contracted interest than buildable capacity. The constraint is neither capital nor buyers— it is power
              connection speed. Transgrid disclosed it cannot connect all planned data centres in its pipeline, the AEMC
              has proposed new engineering compliance rules with a July 2026 implementation deadline, and energy
              ministers are debating whether to require full renewable offset as a condition of approval. Firmus's
              Tasmania site sidesteps most of these issues via hydro baseload, but Sydney and Perth sites face the same
              queue as every other operator. The risk is not that the market fails to materialise; it is that regulatory
              and grid delays compress Firmus's 2028 buildout timeline, reducing the contracted GPU count available at
              IPO.
            calloutType: risk
            claimRefs:
              - CM029
              - CM032
              - CM033
              - CM036
              - CM038
          - type: callout
            title: Contradictory Sizing Estimates Reflect Definitional Chaos, Not Uncertainty About AI Demand
            body: >
              Grand View Research's $180 billion and MarketsandMarkets's $472 billion for the same 'AI data center
              market' in 2026 are not competing forecasts of the same thing—they use incompatible boundary definitions.
              GVR counts purpose-built AI compute hardware and colocation revenue; MnM includes the full infrastructure
              stack co-deployed with AI workloads. Neither figure is wrong on its own terms, but neither directly
              measures the sovereign AI infrastructure segment where Firmus is commercially active. The operationally
              relevant market for Firmus is closer to Data Bridge's $14–17 billion sovereign AI infrastructure figure or
              Gartner's $80 billion sovereign cloud IaaS measure, with Australia capturing roughly $1.6 billion of the
              Mature Asia/Pacific sovereign IaaS pool in 2026. Using the large TAM figures in investor materials without
              boundary qualification overstates the directly addressable market.
