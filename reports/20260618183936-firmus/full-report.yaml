  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Signal
      - Transmission to Thesis
      - Action Implication
    rows:
      - - IPO escrow confirmed absent in prospectus
        - >-
          Prospectus lodged with no lock-up or escrow for pre-IPO holders; no commitments from major shareholders to
          retain shares post-listing.
        - >-
          Day-1 selling pressure from holders with 300–530% paper gains; retail investors absorb selling volume; IPO
          price discovery impaired; TRACK degrades to AVOID.
        - >-
          Do not participate in IPO bookbuild; wait for 90-day post-listing price stability before re-evaluating.
          Monitor daily trading volume in first 30 days.
      - - No revenue disclosed in prospectus
        - Prospectus lodged with audited financials showing <AUD $200M trailing revenue or no revenue disclosure.
        - >-
          Cannot validate any revenue multiple; pricing is entirely faith-based; no comparables framework applies;
          recommendation degrades to AVOID at AUD $8B+.
        - >-
          Decline IPO allocation; set price alert at AUD $5B (CoreWeave-equivalent on minimum disclosed contract value
          of $2B+ contracts).
      - - Major contract cancellation or renegotiation
        - >-
          Either Project Southgate hyperscale contract cancelled or materially renegotiated; Blackstone drawdown halted;
          Firmus announces revised revenue or capex guidance post-IPO.
        - >-
          Revenue floor collapses; Blackstone facility covenant triggers; down-round risk becomes acute; bear scenario
          activates.
        - Sell or avoid; monitor ASX disclosure and Blackstone drawdown status quarterly. Flag for impairment review.
      - - AI demand softening / GPU oversupply event
        - >-
          Top-5 hyperscaler 2027 capex guidance cut >20% YoY; GPU spot prices decline >30%; CoreWeave or Lambda guidance
          cuts of >25%.
        - >-
          Multiple compression across entire GPU cloud sector; Firmus loses contract-award tailwind; $10B debt facility
          covenant conditions may tighten.
        - >-
          Reduce position; compare Firmus contracted vs market GPU rates; assess impairment risk on GPU collateral
          backing Blackstone facility.
      - - Build-cost efficiency claims substantiated as materially overstated
        - >-
          Independent audit finds PUE >1.15 or build cost per MW >USD $9M (midpoint of Firmus $6M and NEXTDC CEO-cited
          $12.4M); published by Uptime Institute or equivalent.
        - >-
          Energy cost advantage narrows; per-megawatt capital efficiency margin narrows; EBITDA forecast assumptions
          require downward revision; moat weakens materially.
        - >-
          Reduce target valuation by 15–25%; request revised operating model from management; reclassify from
          infrastructure premium to commodity build.
    notes: >-
      Triggers are defined as observable, public-market-accessible signals. Thresholds are author-derived based on the
      comparable analysis and business model logic. Action implications are illustrative portfolio management guidance,
      not financial advice.
    claimRefs:
      - CV005
