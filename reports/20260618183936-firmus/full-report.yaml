  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Commercial Traction
        blocks:
          - type: paragraph
            body: >-
              Firmus generates revenue by selling AI compute capacity across two primary channels: a public cloud
              platform offering on-demand GPU and CPU instances alongside managed storage, and bespoke long-term
              enterprise contracts for dedicated AI infrastructure. The public pricing page lists CPU instances from USD
              $73/month for the smallest 4-vCPU virtualised instance up to USD $4,672/month for a 256-vCPU bare-metal
              configuration, and WEKA NVMe parallel file storage at USD $0.11/GB/month. All GPU instance tiers — H200,
              H100, L40S, A100, and A40 — are listed by specification but show no rack rates, with "contact for pricing"
              applied to committed and dedicated access. The gap between transparent CPU pricing and opaque GPU pricing
              is commercially deliberate: GPU contracts represent the economically dominant revenue source and are
              individually negotiated.

              The clearest public evidence of commercial traction is two multi-billion dollar hyperscale contracts under
              Project Southgate. The second and most recently disclosed was signed on March 2, 2026, covering
              approximately 18,400 Nvidia GB300 GPUs at the Melbourne facility in a multi-year agreement with an unnamed
              leading global technology company. The customer's identity was not disclosed in the company's
              announcement, Bloomberg coverage, or any other public source reviewed. This makes it impossible to assess
              customer concentration risk, counterparty creditworthiness, or the contract's financial structure.

              Revenue mix between cloud on-demand and enterprise contract channels is not publicly split. The company
              has stated it is generating revenue, and Lennox Capital Partners in October 2025 assessed the near-term
              150 MW pipeline as supporting a run-rate revenue valuation over 10x Firmus's then-current mark. Nvidia's
              DGX Cloud managed AI platform is establishing a dedicated region at Southgate Melbourne in partnership
              with Firmus, which represents an embedded demand channel that mixes enterprise and platform distribution
              without a distinct disclosed revenue-share structure. Revenue quality from long-term hyperscale contracts
              is structurally superior to spot cloud revenue — the contracts represent recurring and committed cash
              flows — but specific pricing mechanics, minimum commitments, and cancellation provisions are not in the
              public record.
