      - number: '7.4'
        title: Execution, People, and Environmental Risks
        blocks:
          - type: paragraph
            body: >-
              Firmus's founding team assembled without prior data-centre or engineering expertise. Oliver Curtis was an
              investment banker and later cryptocurrency investor before founding Firmus; Tim Rosenfield had previously
              served as CEO of lingerie company Simone Perele; Jonathan Levee held middle-management positions in the
              resources sector. The hiring of experienced operators — Ted Pretty, Grant Dempsey, Kirsty Godfrey-Billy as
              CFO (September 2025), and three NEDs appointed in March 2026 — materially strengthens the bench. However,
              CFO Godfrey-Billy will have been in role for less than twelve months before the targeted IPO date, the
              incoming board chair and three new NEDs joined within the last nine months, and none of the board
              appointments can substitute for a decade of operating experience at the company itself. The co-CEOs'
              personal and familial network at the founding layer — Curtis and Rosenfield are cousins; Levee was a
              former brother-in-law of Curtis — concentrates informal influence in a tight circle.

              Execution risk at the programme scale is severe. Project Southgate targets 1.6 GW by 2028 across multiple
              Australian capital cities. No operator has attempted a sovereign AI infrastructure buildout of this
              density and speed in Australia or, to this reviewer's knowledge, globally. Managing grid connection,
              equipment delivery, construction permitting, and customer onboarding simultaneously across four cities,
              with a freshly constituted senior team, is a category-one execution challenge. Job-creation promises of 50
              to 100 full-time staff per 50 MW have been publicly characterised as unrealistic by Professor Toby Walsh
              of UNSW, who noted that modern automated data centres rarely require such levels of labour. If these
              figures are cited in the prospectus without qualification, they could attract ASIC scrutiny for
              forward-looking statements.

              Environmental and energy-regulatory risks are concentrated in Tasmania and emerging nationally. Firmus's
              hydro power arrangement with TasHydro attracted Greens MP Tabatha Badger's public opposition, with the
              argument that legacy industries had previously been told the grid lacked capacity for their own green
              transitions. The ABC's March 2026 reporting raised formal questions about the electricity deal's
              structure. Nationally, the AEMC's proposals for new grid standards on data-centre connections, and
              Greenpeace Australia's call for a moratorium on new AI data-centre approvals pending energy transition
              planning, signal regulatory headwinds that could impose connection queues, grid-access fees, or
              environmental-licence conditions that increase Firmus's costs and delay commissioning timelines.
              Australia's Privacy Act 2026 reform — particularly the mandatory ADM disclosure requirements effective
              December 2026 and substantially higher civil penalties (up to AUD$50M for serious breaches) — adds
              compliance obligations at the top layer of the customer-facing product stack.
