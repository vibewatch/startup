        - label: Capital Structure Risk
          value: High
          note: >-
            $10B Blackstone debt at 7–9% = $700–900M annual interest at full drawdown; debt/equity >7:1; CoreWeave GAAP
            losses illustrate structural pattern.
        - label: IPO Structure Integrity
          value: Red Flag
          note: >-
            No escrow or lock-up for early investors; 300–530% paper gains; boutique VC funds at >60% Firmus
            concentration; institutional selling risk.
        - label: Governance Quality
          value: Mixed
          note: >-
            Curtis insider-trading conviction cleared by ASX Mar 2026; board strengthened; co-CEO/cousin structure;
            Temasek, Blackstone, Coatue backing adds institutional quality.
        - label: Valuation Support
          value: Insufficient Pre-Prospectus
          note: >-
            AUD $8–12B implies $800M–$1.5B revenue at CoreWeave multiples; no public evidence of this level; valuation
            becomes justifiable at AUD $6–8B with prospectus disclosure.
        - label: Exit Pathway Clarity
          value: Advanced / Opaque
          note: >-
            ASX process advanced (bookrunners, roadshows, ASX clearance); but prospectus not yet lodged; primary vs
            secondary split undisclosed.
        - label: Comparable Performance Signal
          value: Positive (CoreWeave)
          note: >-
            CoreWeave Q1 2026 $2.08B revenue (+112% YoY), $99.4B backlog validates AI infra demand structural thesis —
            Firmus needs to demonstrate comparable trajectory.
