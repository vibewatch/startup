      - number: '3.3'
        title: Hyperscalers, Status Quo, and Sovereign Cloud Entrants
        blocks:
          - type: paragraph
            body: >-
              AWS, Microsoft Azure, and Google Cloud collectively dominate global and Australian cloud spending. AWS
              announced a A$20 billion, five-year Australian data-centre investment — framed primarily around general
              cloud and AI capacity — and already provides IRAP-assessed services in Australian regions. Azure and GCP
              maintain Sydney and Melbourne footprints with similar IRAP scope. Hyperscaler on-demand H100 pricing is
              substantially higher than neoclouds: AWS approximately US$6.88/hr, GCP approximately US$10.98/hr, Azure
              approximately US$12.29/hr, compared to Lambda's US$2.49/hr. However, hyperscalers bundle enterprise
              tooling (AWS SageMaker, Azure AI, Vertex AI), compliance certifications, and decades of enterprise
              relationships that pure GPU providers cannot easily replicate.

              The hyperscaler trajectory poses the central long-term commoditisation risk for Firmus: as AWS, Azure, and
              GCP accelerate their Australian sovereign cloud infrastructure, the data-sovereignty argument that
              differentiates Firmus narrows. Both Azure and GCP have advanced sovereign cloud tiers; AWS's IRAP-assessed
              service scope continues to expand. Hyperscaler entry will not eliminate Firmus's energy efficiency claims,
              but it weakens the sovereignty angle over time.

              The status-quo alternative — enterprises running their own on-premises GPU clusters or procuring through
              existing hyperscaler agreements — remains relevant for large government departments and regulated
              enterprises with existing capital and compliance frameworks. These organisations face high switching costs
              in their favour (existing IRAP approvals, established procurement channels) and typically require
              multi-year planning cycles before migrating to a new GPU cloud provider.

              Internal build (on-prem) or co-location with Macquarie or CDC without a managed GPU overlay is also a
              viable substitute for large enterprises, particularly those unwilling to accept a five-year take-or-pay
              commitment without prior operational proof.
