  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Archetypes
        blocks:
          - type: paragraph
            body: >
              Firmus serves customers across five distinct segments that differ significantly in procurement structure,
              deal size, and adoption stage as of June 2026. The first and commercially dominant segment is global
              hyperscale cloud and AI companies, which procure multi-year, take-or-pay AI factory capacity at
              multi-billion-dollar scale. These buyers are motivated by supply-side constraints in their home markets
              and by sovereign or ESG requirements that encourage in-country renewable-powered compute. As of June 2026,
              Firmus has publicly disclosed two signed hyperscale contracts under Project Southgate, both with unnamed
              "leading global technology companies"; this segment is the anchor for the Blackstone debt facility, which
              is conditioned on executed long-term customer contracts with hyperscalers and blue-chip AI customers.

              The second segment is government and public-sector research organisations, exemplified by AI Singapore
              (AISG), a national AI programme backed by Singapore's National Research Foundation. AISG has been Firmus's
              only publicly named significant customer to date, using the Sustainable Metal Cloud (SMC) platform for
              production LLM training since 2023. The third segment is regulated enterprise — banks, insurers, telcos,
              and energy companies seeking sovereign AI compute with data-residency guarantees — which Firmus markets to
              via Firmus AI Cloud but for which no named production customer has been disclosed in Australia. The fourth
              segment is AI-native startups and scaleups accessible through the Firmus AI Cloud on-demand platform and
              the NVIDIA DGX Cloud Lepton marketplace. The fifth segment is academic and research institutions,
              including education sector users explicitly named in Project Southgate collateral, with no specific
              deployment announced beyond AISG.

              The mix reflects Firmus's current stage: hyperscale anchor contracts dominate committed revenue, while
              enterprise, government, and startup segments remain aspirational or pilot-stage in Australia. Sovereign AI
              positioning is a deliberate differentiator, targeting in-country deployments for public-sector and
              regulated workloads where data-residency requirements and government mandates create structural demand
              that offshore hyperscaler clouds cannot satisfy. This segmentation strategy aligns well with Project
              Southgate's national ambition but creates material concentration risk in the near term and raises
              questions about the pace of diversification ahead of the targeted ASX IPO.
