  - id: FI002
    title: Unit Economics Bridge — Known Inputs and Critical Unknowns
    type: flow
    layout: wide
    summary: >-
      Key cost and revenue inputs in the Firmus AI factory unit economics, showing what is publicly known, what is
      estimated from comparables, and what remains unavailable.
    data:
      nodes:
        - id: gpu-capex
          label: GPU Cluster CapEx
          detail: >-
            Dominant cost input. Firmus claims $35–45M/MW all-in vs. $50–55M/MW industry benchmark. Electrical
            infrastructure alone (Maas Group JLE contract) runs ~$2M/MW, suggesting non-electrical capex per MW is the
            primary driver.
        - id: energy-opex
          label: Energy OpEx (Hydro)
          detail: >-
            Estimated USD $0.04–$0.06/kWh for contracted Tasmanian hydroelectric power — among the lowest data center
            power costs globally. A 100MW facility at 90% utilization consumes ~788 GWh/yr, implying annual energy spend
            of ~$31M–$47M at these rates.
        - id: debt-service
          label: Debt Service (Blackstone $10B)
          detail: >-
            Interest and principal repayment on the $10B Blackstone debt facility. Rate and amortisation schedule are
            not publicly disclosed; at typical private infrastructure debt rates of 7–9%, annual interest on fully drawn
            balance would range from $700M–$900M.
        - id: gpu-depreciation
          label: GPU Depreciation
          detail: >-
            Nvidia GB300 GPUs have an expected useful life of approximately 4–5 years for AI training workloads before a
            refresh cycle is required. Depreciation on $35–45M/MW of GPU assets creates a substantial non-cash charge
            that reduces net income below headline EBITDA.
        - id: revenue-unknown
          label: Contract Revenue (Not Disclosed)
          detail: >-
            Per-GPU-hour or per-AI-token pricing is commercially confidential. CoreWeave H100 market rates ran
            approximately $2–$4/GPU-hour in 2025–2026. An 18,400-GPU cluster at $2.50/GPU-hr and 80% utilization implies
            ~$320M annualised revenue — but Firmus's actual contracted rate is unknown.
        - id: net-margin-gap
          label: Net Margin — Unavailable
          detail: >-
            The gap between contracted revenue and the sum of energy opex, debt service, depreciation, and operating
            overhead determines equity-level returns. This figure is not disclosed and cannot be computed from public
            information alone.
      edges:
        - from: gpu-capex
          to: gpu-depreciation
          label: capitalised and depreciated over GPU life
        - from: energy-opex
          to: net-margin-gap
          label: reduces gross margin
        - from: debt-service
          to: net-margin-gap
          label: below-EBITDA cash drain
        - from: gpu-depreciation
          to: net-margin-gap
          label: non-cash income reduction
        - from: revenue-unknown
          to: net-margin-gap
          label: offset to all costs
    approximationNotes: >-
      All figures are estimates derived from company claims, industry benchmarks, and CoreWeave comparables. No
      Firmus-specific gross margin, interest rate, depreciation life, or contracted revenue data has been publicly
      disclosed. The annualised GPU-cluster revenue estimate of ~$320M is illustrative only and based on CoreWeave-era
      H100 market rates that may not apply to GB300 contracts.
    claimRefs:
      - CI040
      - CI041
      - CI042
