      - number: '6.4'
        title: Retention, Contract Durability, and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Firmus has not publicly disclosed any retention metrics. No NRR, GRR, churn rate, cohort analysis, or
              repeat-engagement data is available for either the Firmus AI Cloud public platform or the hyperscale
              anchor contracts. Contract structure is only partially visible: the hyperscale deals are described as
              "multi-year" and "multi-billion-dollar," consistent with contracted infrastructure take-or-pay structures
              common in energy and data centre projects. The Blackstone debt facility's drawdown conditionality on
              executed long-term customer contracts provides lenders with structural protection, but the minimum revenue
              commitments, cancellation provisions, and termination triggers in those contracts are not publicly
              disclosed. VAST Data's selection as the AI Cloud data layer was explicitly framed as supporting
              multi-tenant enterprise and government workloads, suggesting the platform architecture anticipates
              regulated-sector customers requiring isolated environments.

              Customer concentration risk is severe by standard infrastructure underwriting measures. The two anonymous
              hyperscale contracts likely represent the overwhelming majority of Firmus's contracted revenue pipeline as
              of June 2026. If either customer delays its deployment timeline, terminates the contract, or renegotiates
              pricing, the revenue impact would be material to Firmus's ability to service the Blackstone debt. The lack
              of a named customer portfolio prevents investors from assessing counterparty credit quality, strategic
              rationale, or renewal probability independently. Gilbert and Tobin noted that the debt facility was
              designed to scale drawdown against new contract wins, naming Meta and OpenAI as typical users of this
              class of infrastructure — but the actual customers were not named.

              Expansion capacity is structurally embedded in the model: Project Southgate's multi-site ambition
              (Tasmania, Melbourne, and later Sydney, Canberra, Perth, Adelaide) creates a pathway for geographic and
              customer diversification through 2028. However, enterprise and startup segments remain aspirational as of
              this report date. The Tasmanian government established an AI Factory Zone policy framework in July 2025
              that validates sovereign AI demand, but policy support is not equivalent to a customer contract. An
              adverse assessment from Hayden Beamish, CIO of Endeavor Asset Management and an early Firmus investor who
              exited in August 2023, warned in May 2026 that the ASX listing "will likely be priced too expensively" and
              that "the easy money has already been made," describing the pre-pivot Firmus as a bitcoin miner "with no
              legitimate business model." Supply chain partners Benmax and Maas Group are producing AI Factory
              components at industrial scale for the committed hyperscale contracts, signalling that Firmus is
              operationally moving to fulfil existing customer obligations — but the customer pipeline beyond the two
              disclosed hyperscale contracts remains entirely opaque.
