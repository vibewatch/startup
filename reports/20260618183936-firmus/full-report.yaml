      - CV039
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Revenue and financial statements
        - >-
          No audited or management-prepared income statement, gross margin, operating burn rate, or revenue recognition
          policy has been publicly disclosed.
        - >-
          Without revenue, no comparable multiple analysis can be conducted; the entire valuation framework rests on
          proxy evidence. This is the single most important diligence item.
        - >-
          Review IPO prospectus financial statements when lodged with ASIC; benchmark against CoreWeave 56% adj. EBITDA
          and comparable neocloud operators. Owner: ASIC lodgement (public).
      - - IPO lock-up and escrow structure
        - No formal prospectus disclosure of lock-up, escrow, or share-sale restriction terms for pre-IPO shareholders.
        - >-
          Absence of escrow allows 300–530% paper-gain holders to sell from day one, suppressing post-listing price;
          this is a structural risk specific to retail IPO investors.
        - >-
          Review prospectus Section on Share Sale Restrictions and escrow deed (if any). Owner: IPO legal counsel;
          confirmation expected in prospectus.
      - - Hyperscale customer identities and contract terms
        - >-
          Both Project Southgate cornerstone customers are unnamed; contract financial terms, minimum commitments, and
          cancellation provisions are not in the public record.
        - >-
          Without customer identity and creditworthiness, Blackstone facility coverage and revenue durability cannot be
          independently assessed. Customer concentration risk is unknowable.
        - >-
          Request prospectus contract schedules or redacted term sheets; alternatively, identify customers via ASX
          disclosure upon IPO. Owner: Firmus investor relations.
      - - Independent PUE and efficiency audit
        - >-
          No independent, third-party-audited PUE measurement at current facilities under representative load; 2021
          point measurement was retracted as unrepresentative.
        - >-
          If actual operating PUE is 1.15–1.25 rather than 1.03, the energy cost advantage narrows by an estimated
          15–25% at the operating cost line, materially affecting EBITDA forecasts.
        - >-
          Request ASHRAE-compliant PUE audit from Uptime Institute or TÜV Rheinland covering Melbourne AI Factory at
          full load. Owner: Firmus technical team; expected at IPO or post-listing.
      - - Debt service coverage and facility drawdown conditions
        - >-
          Blackstone facility interest rate, amortisation schedule, covenant package, and first-drawdown contracted
          revenue threshold are not publicly disclosed.
        - >-
          At private infra debt rates 7–9% on $10B, annual interest expense of $700–900M could exceed early-year
          operating cash flow; covenant breach scenario is a material downside risk.
        - >-
          Review prospectus Note on Borrowings; request facility summary from bookrunners. Benchmark first-drawdown
          threshold against disclosed contract values.
      - - Primary vs secondary IPO raise split
        - >-
          The AUD $2 billion IPO raise has not been broken down between primary proceeds (to Firmus) and secondary
          proceeds (selling shareholders).
        - >-
          If secondary proceeds are large, the balance sheet benefit is correspondingly smaller; it would also imply
          higher day-1 selling pressure from selling shareholders.
        - Confirm in prospectus Cover Page and Use of Proceeds section. Expect disclosure in ASIC-lodged prospectus.
    notes: >-
      All diligence items are open as of June 18, 2026 (pre-prospectus). Items 1 and 2 are structural blockers — they
      should be resolved before any investment commitment. Items 3–6 are material and expected to be partially resolved
      in the prospectus.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV013
      - CV018
      - CV019
      - CV027
