  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Firmus rests on four structural pillars. First, hyperscale AI compute demand is
              supply-constrained globally and Australia-specifically, creating a contracted revenue floor before the
              IPO; the top-five US hyperscalers committed USD $660–690 billion in 2026 capex, nearly doubling 2025
              levels, and all four largest self-report being supply-constrained rather than demand-constrained. Second,
              sovereign AI infrastructure in the Asia-Pacific carries strategic scarcity value that domestic
              hyperscalers cannot easily replicate; Firmus's renewable-energy positioning and Australian ownership
              profile gives it access to sovereign-compute budgets inaccessible to AWS, Azure, and Google. Third, the
              Blackstone USD $10 billion senior-secured debt facility, conditioned on executed long-term customer
              contracts with hyperscalers, provides project-finance validation that the revenue coverage story has been
              underwritten by a rigorous institutional credit process. Fourth, Nvidia's equity participation across two
              rounds and its DGX Cloud regional deployment at Southgate Melbourne lock in both chip supply priority and
              a demand-side distribution channel no other APAC operator possesses at this scale.

              Each pillar contains a material unverified assumption. The contracted revenue floor rests on two unnamed
              hyperscale customers whose financial terms, minimum commitments, and cancellation provisions are not in
              the public record. The sovereign scarcity argument weakens daily as NEXTDC, Macquarie DC, and CDC Data
              Centres build competing sovereign capacity on similar or stronger governance credentials. The Blackstone
              facility creates a highly leveraged capital structure where interest expense at 7–9 percent annual rates
              on full drawdown would absorb USD $700–900 million annually — more than any currently disclosed revenue
              figure. Nvidia's equity investment, estimated by independent analysts at AUD $30–75 million across both
              rounds, is a vendor-financing instrument: every dollar Nvidia invests returns multiples to its balance
              sheet through GPU hardware revenue, making its "endorsement" structurally circular.

              Three adverse signals dominate the pre-IPO governance picture. The IPO is structured with no escrow or
              share-sale restrictions for early investors who have already realised 300–530 percent paper gains,
              creating an immediate first-day selling risk that retail buyers bear. Roger Montgomery of Montgomery
              Investment Management — himself holding an existing position — explicitly warned that retail IPO buyers
              face the risk of providing "exit liquidity" for well-incentivised insiders. Wilson Asset Management
              similarly identified the absence of lock-up restrictions as a "structural red flag." Firmus's PUE
              efficiency claim of 1.03 was retracted from a current measurement to a "point measurement from 2021" that
              was never independently audited, after UNSW expert Dr Amr Omar described the figure as being at "the
              extreme end of global possibility." Former early investor Hayden Beamish, CIO of Endeavor Asset
              Management, who exited Firmus in August 2023 describing it as "a bitcoin miner with a stretched balance
              sheet and no legitimate business model," now states that "the easy money for Firmus has already been made"
              and will not participate in the IPO.
