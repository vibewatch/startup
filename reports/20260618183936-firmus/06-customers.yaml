  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: hyperscale-customer-identities
      missingEvidence: >
        Names, credit profiles, and confirmed contract commitments (minimum revenue, floor
        capacity, cancellation terms) for both Project Southgate hyperscale anchor customers.
      whyItMatters: >
        Both hyperscale contracts are the primary drivers of Firmus's contracted revenue pipeline
        and the anchor for the Blackstone USD 10 billion debt facility. Without counterparty
        identities, investors cannot assess credit quality, concentration risk, renewal probability,
        or the likelihood of contract cancellation — all material to the IPO underwriting thesis.
      diligencePath: >
        Request named customer disclosure or concentration risk schedule in IPO prospectus; obtain
        top-3 customer revenue percentage, contract minimum commitments, and termination notice
        periods under pre-IPO NDA diligence; cross-check with Blackstone covenants.
      relatedQuestionRefs:
        - QU016
        - QU022
      relatedTableRefs:
        - TU003
        - TU005

    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: >
        NRR, GRR, churn rate, active customer count, cohort retention data, and customer lifetime
        value for Firmus AI Cloud and the SMC platform. No public disclosure mechanism exists.
      whyItMatters: >
        Without retention data, it is impossible to determine whether Firmus's cloud platform
        has a repeatable, growing customer base or whether revenue is dominated entirely by a
        small number of hyperscale contracts. This gap is critical for modelling the enterprise
        and startup segments that Firmus projects will diversify its customer mix by 2028.
      diligencePath: >
        Request management NRR, GRR, and customer-count dashboards in pre-IPO diligence; obtain
        SMC-specific retention and churn data from STT GDC partnership reporting; confirm AISG
        contract renewal status and whether the MoU has converted to a commercial service agreement.
      relatedQuestionRefs:
        - QU013
        - QU024

    - type: enumeration-incomplete
      severity: material
      topic: named-customer-coverage
      missingEvidence: >
        Named production customers using the Firmus AI Cloud platform in Australia — enterprises,
        government agencies, startups — that are currently anonymous or undisclosed. Any named
        enterprise, education, or government customers using the Melbourne or future Sydney/Canberra
        facilities once they go online.
      whyItMatters: >
        The customer proof table (TU003) covers only publicly named relationships. Firmus states
        the Melbourne facility will be available to enterprise, education, government, startup,
        and scaleup customers through Firmus AI Cloud from mid-2026, implying a pipeline that
        is not yet in the public record. Without named customers beyond AISG, the enterprise and
        startup market validation rests entirely on aspirational collateral.
      diligencePath: >
        Request a full customer roster with signed agreements (or heads of agreement) and
        production deployment confirmation for all Firmus AI Cloud users as part of IPO due
        diligence; monitor Project Southgate newsroom for any named customer announcements
        in Australia post-Melbourne go-live.
      relatedQuestionRefs:
        - QU013
      relatedTableRefs:
        - TU003

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >
      TU004 retention table contains no quantitative data because Firmus has not publicly
      disclosed any retention metric; null values represent genuine evidence gaps documented
