        - label: "Commitment"
          description: >
            Multi-year take-or-pay contract signed (hyperscale anchor customers); MoU signature
            formalises research partnership (AISG/government research); reserved GPU instance
            or on-demand subscription (cloud developer); Blackstone debt facility conditioned
            on executed long-term customer contracts links capital to confirmed demand
        - label: "Deployment"
          description: >
            GPU provisioning and AI Factory construction (Tasmania/Melbourne under build);
            integration with VAST AI OS data layer for enterprise and government workloads;
            NVIDIA NCP reference design stack ensures interoperability; Synert grid-integration
            software manages power and energy; Singapore SMC platform live since H2 2023
        - label: "Expansion"
          description: >
            New Project Southgate sites planned (Sydney, Canberra, Perth, Adelaide by 2028);
            new GPU generation upgrades (Vera Rubin roadmap); enterprise and government channel
            growth in Australia (aspirational — no named production customer yet); AISG MoU
            signals continued partnership intent for SEA-LION and future NLP Hub work
    approximationNotes: >
      Journey stages are derived from publicly disclosed milestones and Firmus's stated strategy.
      No customer-journey data (time-to-close, conversion rates, or churn triggers) is in the
      public record; stages reflect inferred customer lifecycle, not observed metrics.
