  - id: adoption-trajectory
    title: Adoption Trajectory, GPU Commitments, and Platform Reach
    body: >
      Firmus's adoption trajectory is best measured in committed GPU-equivalents rather than
      disclosed customer count or revenue. The two Project Southgate hyperscale contracts total
      approximately 55,200 Nvidia GB300 GPUs committed across Tasmania and Melbourne, representing
      an implied multi-billion-dollar capital commitment and expected to generate contracted
      multi-year revenue once operational. The Singapore SMC deployment runs approximately 4,000
      Nvidia GPUs across two STT GDC sites for AISG and other enterprise customers, delivering
      99 PFLOP/s of total compute in production. The AI Cloud public platform is live with H200,
      H100, L40S, A100, and A40 GPU instances, but no active paying customer count, revenue split,
      or adoption rate has been publicly disclosed by Firmus as of June 2026.

      Independent platform validation has been strong. SemiAnalysis named Firmus's Sustainable
      Metal Cloud as one of only three GPU providers globally with correctly implemented InfiniBand
      SHARP in-network reduction — ranking Firmus alongside AWS and above Google Cloud in the
      inaugural ClusterMAX GPU Cloud Ratings. SemiAnalysis's ClusterMAX 2.0 methodology, released
      November 2025, uses a combination of hands-on benchmarking and over 140 customer surveys
      across 84 evaluated providers from a tracked universe of 209 GPU cloud operators. According
      to analysis of the ClusterMAX 2.0 tier structure by Hedgehog Cloud, Gold-tier clouds (the
      tier Firmus targets) can command a 70% pricing premium over commodity Bronze infrastructure,
      illustrating the revenue value of Firmus's performance positioning. Only CoreWeave holds
      Platinum as of the most recent cycle.

      Firmus's inclusion in the NVIDIA DGX Cloud Lepton marketplace — announced at COMPUTEX June
      2025 — positions it as an accessible GPU source for the global NVIDIA developer community.
      The Blackstone debt facility's drawdown conditionality on executed customer contracts directly
      links future infrastructure deployment pace to new customer wins. Firmus states it is
      generating revenue, but no revenue figures, gross margin, burn rate, or runway have been
      publicly disclosed. The committed pipeline of GPU capacity implies significant revenue if
      the contracts deliver as structured, but this depends on construction timelines, customer
      performance obligations, and debt drawdown sequencing.
