callouts:
  - calloutType: strength
    title: AI Singapore Case Study Is Firmus's Most Credible Customer Proof
    body: >
      The AISG–Firmus engagement is the only publicly named, outcome-quantified customer
      relationship in Firmus's history. Deploying 256 H200 GPUs, training a 27B-parameter SEA-LION
      model in 10 days, completing 200+ experiments, achieving NCCL bandwidth of 317 GB/s, and
      formalising the relationship with an MoU provides a credible, independently corroborated
      reference point for Firmus's operational capabilities and service quality. For a company
      at this funding stage with two anonymous anchor customers, a named mission-critical
      government research deployment with measured outcomes is a material differentiator.
    claimRefs:
      - CU005
      - CU007
      - CU008
      - CU020
      - CU023
      - CU024

  - calloutType: risk
    title: Both Hyperscale Anchor Customers Are Unnamed — Concentration Risk Is Unverifiable
    body: >
      The two Project Southgate hyperscale contracts, which likely represent the majority of Firmus's
      contracted revenue pipeline, are with customers whose identities have never been publicly
      disclosed. This prevents independent assessment of counterparty creditworthiness, customer
      concentration, contract cancellation risk, or expansion probability. Ahead of an ASX IPO,
      this opacity is structurally unusual and creates an information asymmetry between management
      and prospective public investors. Gilbert and Tobin's deal note named Meta and OpenAI as
      "typical users" of this class of infrastructure without identifying Firmus's actual customers,
      reinforcing how little can be independently verified. The IPO prospectus will need to resolve
      this either through explicit customer disclosure or a risk-factor framework.
    claimRefs:
      - CU001
      - CU004
      - CU018
      - CU019
      - CU026
      - CU038

  - calloutType: insight
    title: Blackstone Drawdown Structure Links Debt to Customers — But Creates Sequencing Risk
    body: >
      The Blackstone USD 10 billion debt facility's conditioned drawdown on executed long-term
      customer contracts is both a risk mitigant and a deployment constraint. On the positive side,
      it prevents speculative infrastructure spend and aligns capital deployment with confirmed
      demand. On the negative side, if contract negotiations with new hyperscalers slow or a
      customer delays, the pace of infrastructure deployment stalls, compressing the 2028 roadmap
      and potentially reducing the evidence Firmus needs to attract the next wave of customers.
      Supply chain partners Benmax and Maas Group are already in production for committed contracts,
      meaning operational readiness outpaces the financial-close pipeline — a sequencing dynamic
      that deserves monitoring in IPO diligence.
    claimRefs:
      - CU017
      - CU033
      - CU039

