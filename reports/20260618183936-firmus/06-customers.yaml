  - id: named-customer-evidence
    title: Named Customer Proof — Deployments, Outcomes, and Evidence Quality
    body: >
      Firmus's named customer record is thin relative to its fundraising scale, but the depth of
      the AI Singapore engagement provides a genuine reference point for its operational capabilities.
      AI Singapore (AISG), a national AI programme backed by Singapore's National Research
      Foundation, used the Sustainable Metal Cloud (SMC) platform hosted in STT GDC's Singapore
      facilities to develop SEA-LION, the first open-source large language model suite for Southeast
      Asian languages. The AISG engagement is Firmus's best-documented customer relationship:
      256 Nvidia H200 GPUs were deployed across 32 nodes; the team achieved NCCL bandwidth of
      317 GB/s and 387 TFLOP per device per second; more than 200 experiments were completed; a
      27-billion-parameter model was trained in 10 days; supervised fine-tuning runs were completed
      in 4 hours; and checkpoint evaluations were finished in 1.5 hours using 2 nodes. Firmus and
      AISG formalised the collaboration with a Memorandum of Understanding in March 2025. This is
      a production deployment with quantified, publicly confirmed outcomes.

      In contrast, both Project Southgate hyperscale contracts are with anonymous "leading global
      technology companies" that have not disclosed themselves publicly. The second contract,
      announced on March 2, 2026, covers approximately 18,400 Nvidia GB300 GPUs at the Melbourne
      facility in a multi-year, multi-billion-dollar commitment. The first contract covers
      approximately 36,800 Nvidia GB300 GPUs at the Tasmania campus. Neither customer identity is
      in the public record. Industry observers speculate the counterparties may be among Microsoft,
      Google, Meta, or a major Asian hyperscaler, but no confirmation exists. This opacity
      prevents independent verification of creditworthiness, contract terms, cancellation provisions,
      and customer concentration risk.

      NVIDIA's DGX Cloud platform is establishing a dedicated region at Southgate Melbourne, making
      Firmus a member of the NVIDIA Cloud Partners ecosystem alongside CoreWeave, Crusoe, Lambda,
      and SoftBank in the DGX Cloud Lepton marketplace. This represents a distribution channel and
      platform partnership rather than a discrete revenue-generating customer relationship, but it
      validates Firmus's standing within NVIDIA's global ecosystem and provides a route to reach
      developers across Asia-Pacific. The STT GDC Sustainable Metal Cloud partnership, established in
      June 2023 following a significant investment by Temasek-backed STT GDC into a global venture
      with Firmus, is the earliest production-stage deployment and has been live across STT GDC
      locations in Singapore. The Singapore site achieved 99 PFLOP/s total compute for AISG and
      other enterprise and government customers.
