  topStrengths:
    - 在澳大利亚和新加坡布局主权 AI 基础设施，契合当地真实的算力短缺和政策需求。
    - 作为澳大利亚私营初创公司，Firmus 资本获取能力异常强：Nvidia 多次参与融资，Blackstone 还提供了有条件的 USD 10B 融资安排。
