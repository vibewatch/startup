  topRisks:
    - 没有招股书、经审计财报或公开签约收入排期来支撑预期 IPO 估值。
    - Oliver Curtis 的内幕交易定罪和无锁定 IPO 结构都会放大公开市场审视，创始人治理风险仍偏高。
    - 执行取决于超大规模云厂商合同质量、Nvidia 供货、建设成本纪律和债务融资扩张经济性，而这些只披露了一部分。
  unresolvedGaps:
    - 招股书前，经审计财报、收入确认、毛利率、烧钱速度和签约收入排期仍未披露。
    - 两个超大规模云厂商锚定客户的身份、定价、最低承诺和取消条款仍未披露。
    - PUE、每兆瓦建设成本或 GPU 利用率主张尚无独立第三方验证。
