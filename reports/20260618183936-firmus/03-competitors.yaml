company:
  name: Firmus
chapter:
  number: 3
  title: Competitors
  summary: >-
    Firmus competes across three overlapping arenas: global GPU neoclouds (CoreWeave, Lambda Labs) that dwarf it in revenue but lack APAC sovereign credentials; Australian infrastructure incumbents (NEXTDC, CDC, Macquarie DC) that are racing to fill the same demand with enterprise-grade facilities and competing anchor-tenant deals; and hyperscalers (AWS, Azure, GCP) investing A$20B+ locally but constrained by data-sovereignty perceptions. Firmus's principal differentiation claims — renewable-powered sovereign AI factories, proprietary efficiency architecture, and NVIDIA anchor status — face credible fast-follower pressure, an unverified PUE figure, and a disputed per-MW cost claim, leaving the competitive moat partially substantiated but not yet independently validated.

sections:
  - id: direct-neocloud-rivals
    title: Direct GPU Cloud and Neocloud Rivals
    body: >-
      The closest structural analogue to Firmus globally is CoreWeave, which pivoted from crypto mining (as did Firmus) to become the US's leading pure-play GPU cloud. CoreWeave went public in March 2025 at a US$40 IPO price and traded at a roughly US$43 billion market capitalisation by March 2026, having reported FY2025 revenue of US$5.13 billion — a 168% year-on-year increase. Its Q1 2026 revenue of US$2.08 billion confirmed continued hypergrowth, and the company guided full-year 2026 revenue of US$12–13 billion. CoreWeave's revenue backlog reached US$99.4 billion by Q1 2026, underpinned by multi-year take-or-pay contracts with Microsoft, OpenAI, and Meta. Despite the scale, CoreWeave carries approximately US$25 billion in debt, widening GAAP losses (US$1.17B for FY2025), and extreme customer concentration — Microsoft represented 62% of revenue in 2024. CoreWeave has no material APAC presence and serves primarily US-based hyperscale AI labs.

      Lambda Labs is the second significant neocloud rival, with estimated 2025 revenue of approximately US$760 million (79% year-on-year growth) and a US$5.9 billion valuation after a US$1.5 billion Series E in November 2025. Lambda's competitive weapon is aggressive pricing: its NVIDIA H100 instances are available at approximately US$2.49/hr versus CoreWeave's approximately US$4.25/hr, and its developer-oriented product appeals to AI startups and research teams. Lambda filed for an IPO targeting H1 2026, which could extend its capital reach and potentially APAC expansion. Like CoreWeave, Lambda has no established Australian sovereign presence or IRAP-relevant compliance posture.

      Vultr occupies a lower tier, offering GPU instances with transparent public pricing (H100 at ~US$2.60/hr) and 32 global data centres, but targeting small-to-medium businesses rather than hyperscale AI workloads. No other neocloud has demonstrated the infrastructure scale, APAC sovereign angle, or NVIDIA partnership depth that distinguishes Firmus's positioning.
