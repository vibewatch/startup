callouts:
  - calloutType: risk
    title: NEXTDC CEO Publicly Disputes Firmus Build Quality and Cost Claims
    body: >-
      In April 2026, NEXTDC CEO Craig Scroggie used the company's analyst call to question whether Firmus facilities can be built to enterprise-grade quality. Scroggie cited an industry-standard build cost of approximately US$12.4 million per megawatt, contrasting it with Firmus's claimed approximately US$6 million per megawatt — a near-50% discount that, if inaccurate, would collapse a central pillar of the Firmus financial model. This is not a generic competitive jab: it is a senior operator with multi-gigawatt delivery experience raising a specific technical and financial claim. Independent engineering verification of Firmus's per-MW capex is a prerequisite for any underwriting of the IPO valuation.
    claimRefs:
      - CP024
      - CP028
      - CP029

  - calloutType: risk
    title: GPU Export Controls Create Geopolitical Financing Risk for Singapore Operations
    body: >-
      Nomura's struggle in early 2026 to syndicate a US$120 million credit facility for Firmus Metal Singapore — with investor concerns centred on US export restrictions on NVIDIA H100 chips and the risk of proximity-to-China re-export enforcement — is an early signal that Firmus's Singapore-origin business carries a risk profile that mainstream institutional debt investors are not yet comfortable pricing. The Australian sovereign narrative insulates the domestic business but does not eliminate exposure to the Singapore and broader Asia-Pacific entity, where the original Hypercube GPU leasing model was developed. If US export-control enforcement escalates, the Singapore operating vehicle and regional expansion plans face financing constraints independent of the Australian Project Southgate trajectory.
    claimRefs:
      - CP030
      - CP040
      - CP038

  - calloutType: insight
    title: Renewable Energy and Sovereign Positioning Is Credible but Faces Fast Followers
    body: >-
      Firmus is one of the few GPU cloud providers globally to combine a 100% renewable energy commitment with majority-Australian ownership — a combination that is genuinely differentiated from CoreWeave, Lambda Labs, and the hyperscalers as of mid-2026. The CDC partnership and NVIDIA DGX Cloud anchor tenancy are real structural assets. However, both NEXTDC (via OpenAI S7 campus) and hyperscalers (via A$20B+ Australian investment and accelerating IRAP certification) are competing directly on the sovereignty dimension. The renewable energy moat depends on actual new renewable generation being catalysed by Project Southgate, not merely procured — a higher bar that has already attracted Tasmanian political scrutiny over power allocation priorities.
    claimRefs:
      - CP010
      - CP036
      - CP023
      - CP032

