  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: >-
        Firmus does not publish any GPU cloud pricing for H100, GB300, or cluster configurations. No on-demand rates, spot prices, or reserved-instance list prices are publicly available. All enterprise engagements are via custom commercial negotiations.
      whyItMatters: >-
        Without public pricing, independent benchmarking of Firmus's cost-competitiveness claims versus CoreWeave, Lambda Labs, and hyperscalers is impossible. Investors cannot validate the claimed per-token cost advantage or assess realised revenue per GPU hour during diligence.
      diligencePath: >-
        Request Firmus to provide indicative pricing schedules for at least one standard GPU SKU (GB300 per-GPU-hour or per-node-month) as part of IPO prospectus disclosure; cross-validate against comparable CoreWeave and hyperscaler rates.
      relatedQuestionRefs:
        - QP007
      relatedTableRefs:
        - TP003

    - type: private-evidence-only
      severity: material
      topic: customer-contracts
      missingEvidence: >-
        The identity of Firmus's second cornerstone customer (described only as "a leading global technology company" in the March 2026 press release) is not publicly disclosed. Customer concentration, creditworthiness, renewal intent, and contract payment waterfall details are unavailable.
      whyItMatters: >-
        Two cornerstone customers represent essentially all of Firmus's contracted US$8.2 billion backlog. If the second customer is a concentrated single counterparty (speculated to be Meta or similar), the revenue quality parallels the CoreWeave-Microsoft concentration risk that analysts have already flagged as a CoreWeave weakness. Undisclosed identity prevents assessment of default risk, covenant structure, or termination clauses.
      diligencePath: >-
        Require public disclosure of second cornerstone customer identity in the IPO prospectus; request access to executed contract terms (payment waterfall, termination triggers, renegotiation rights) under NDA in due diligence.
      relatedQuestionRefs:
        - QP023

    - type: missing-source
      severity: material
      topic: efficiency-claims
      missingEvidence: >-
        No independent third-party engineering audit of Firmus's Power Usage Effectiveness (PUE 1.03 claim) or per-megawatt capex cost structure exists in the public domain. The only public technical reference is the SemiAnalysis ClusterMAX ranking (which evaluates network performance, not PUE or build economics).
      whyItMatters: >-
        If the PUE 1.03 figure is accurate at production scale, it represents a genuine and durable cost moat over hyperscalers (PUE 1.2+) and standard Australian data centres (PUE 1.4–1.7). If it is not, the financial model projecting superior per-token economics collapses, as does a central pillar of the IPO valuation thesis. The IPO disclosure risk is heightened given Dr. Amr Omar's public scepticism reported in investor commentary.
      diligencePath: >-
        Commission an independent PUE audit from a recognised data centre engineering firm (e.g., Uptime Institute, ASHRAE-accredited) covering at least 30-day continuous measurement at the St Leonards Singapore facility and the Melbourne Southgate site; require the methodology and measurement boundary to be disclosed in the IPO prospectus.
      relatedQuestionRefs:
        - QP008
        - QP027

