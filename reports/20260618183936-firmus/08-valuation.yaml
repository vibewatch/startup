  - id: scenario-analysis
    title: Bull, Base, and Bear Scenario Analysis
    body: >-
      Three scenarios bracket the Firmus investment case across the 2026–2029 horizon.

      The bull scenario requires five sequential events: the ASX IPO prices at AUD $10–12 billion in H2 2026
      and closes oversubscribed; at least one hyperscale customer identity and revenue scale is disclosed in
      the prospectus; GB300 GPU deployments in Melbourne and Tasmania come online H2 2026 as targeted; the
      Blackstone facility begins drawing down against contracted revenue; and AI training and inference demand
      remains supply-constrained through 2027, preventing GPU price normalisation. In this scenario Firmus's
      2027–2028 revenue could reach AUD $1.5–3 billion, and the share price could reflect 10–15x forward
      revenue multiples, implying enterprise values of AUD $15–20 billion by 2028. This scenario has
      low-to-moderate probability: the first three conditions individually are plausible, but all five
      occurring in sequence within the 2026–2027 window is contingent on AI demand continuity,
      contract-disclosure willingness, and flawless operational execution.

      The base scenario assumes the IPO prices at AUD $7–9 billion in H2 2026, partial contract disclosure
      in the prospectus, and revenue ramp to AUD $600 million–$1.2 billion by end 2027. Under base
      assumptions, multiple compression to 6–8x as the post-IPO growth phase matures and debt service
      absorbs significant operating cash flow, a 2028–2029 enterprise value of AUD $7–12 billion implies
      flat-to-modest returns for IPO investors. This is the most likely scenario given the current
      evidence base and reflects market-consistent assumptions for a capital-intensive pre-revenue
      infrastructure operator.

      The bear scenario is triggered by any of: IPO delayed beyond Q1 2027 due to adverse market conditions,
      governance challenge, or ASIC scrutiny; one or both hyperscale customers exercises a cancellation or
      renegotiation clause (terms not public); AI compute demand softens due to efficiency gains, GPU
      oversupply, or hyperscaler capital allocation pullback; the $10 billion Blackstone facility's interest
      burden becomes unsustainable before sufficient revenue is recognised; or the build-cost efficiency
      claims are substantiated as materially overstated by independent audit. In the bear case, Firmus
      equity value could decline to AUD $3–6 billion (25–65 percent drawdown from an AUD $8 billion IPO
      price), with potential debt covenant stress. The bear case is plausible with moderate probability
      given the number of unresolved assumptions.
