  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "financial-performance"
      missingEvidence: "Audited or management-prepared income statement, gross margin, operating burn rate, revenue recognition policy, and contracted revenue schedule; none are publicly available pre-prospectus."
      whyItMatters: "Without a revenue baseline, no comparables multiple analysis or DCF can be conducted; the IPO price is entirely faith-based at pre-prospectus stage. The $5.5B valuation and $8–12B IPO target have no public revenue to anchor them. TV004 comparable valuation table is consequently partial and cannot be completed for Firmus."
      diligencePath: "Review IPO prospectus financial statements when lodged with ASIC (expected within weeks of IPO date). Benchmark against CoreWeave 56% adj. EBITDA and comparable neocloud operators. Owner: ASIC public registry."
      relatedQuestionRefs:
        - QV029
      relatedTableRefs:
        - TV004

    - type: private-evidence-only
      severity: blocking
      topic: "contract-disclosure"
      missingEvidence: "Identity of both Project Southgate hyperscale customers, contracted revenue scale, pricing per GPU-hour or AI token, minimum volume commitments, duration, and cancellation/renegotiation terms."
      whyItMatters: "Without customer identity and creditworthiness, the Blackstone facility's contracted-revenue drawdown condition cannot be independently assessed; the entire financial model rests on unverifiable contract quality. Customer concentration risk is unknowable."
      diligencePath: "Review IPO prospectus contract schedules or redacted material contracts. Alternatively, identify customers via ASX disclosure post-listing. Request contract summaries via IPO due diligence process. Owner: Firmus investor relations / bookrunners."
      relatedQuestionRefs:
        - QV016
        - QV029

    - type: missing-source
      severity: blocking
      topic: "ipo-structure"
      missingEvidence: "Formal prospectus disclosure confirming whether any lock-up, escrow, or share-sale restriction will apply to pre-IPO holders. No announcement has been made about any voluntary lock-up."
      whyItMatters: "If confirmed absent, institutional investors may decline to participate, compressing IPO demand and potentially repricing the float. The no-escrow structure is the most actionable near-term risk identified in this analysis."
      diligencePath: "Review ASX-lodged prospectus Section on Share Sale Restrictions and escrow deed. If no escrow confirmed, re-assess IPO entry pricing — apply 20–30% discount to comparable-derived fair value to compensate for day-1 selling risk."

    - type: private-evidence-only
      severity: material
      topic: "technical-efficiency"
      missingEvidence: "Independent, third-party-audited PUE measurement at current Firmus facilities under full representative AI load; independently verified build cost per megawatt at actual Melbourne facility."
      whyItMatters: "If actual operating PUE is 1.15–1.25 rather than 1.03, the energy cost advantage narrows by 15–25% at the operating cost line, materially affecting the margin thesis and reducing the financial case for premium infrastructure valuation over NEXTDC."
      diligencePath: "Request ASHRAE-compliant PUE audit from Uptime Institute or TÜV Rheinland covering Melbourne AI Factory at full load. Request Maas Group JLE civil/electrical contract cost data for build cost verification. Owner: Firmus technical team; timeline: expected at or before IPO."
      relatedQuestionRefs:
        - QV020
        - QV024

