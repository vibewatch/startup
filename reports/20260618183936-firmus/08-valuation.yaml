  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Dimension
      - Thesis Argument
      - Anti-Thesis Counter
      - Evidence State
      - What Would Change the View
    rows:
      - - AI Demand Pull
        - "Hyperscaler capex $660–690B in 2026; Firmus has two signed multi-billion contracts validating demand floor before IPO."
        - "Contracts are with unnamed counterparties; terms, minimums, and cancellation rights not disclosed; demand could slow if AI efficiency gains (Jevons paradox) accelerate."
        - Partial
        - "Customer identity and contract term disclosure in prospectus; sustained hyperscaler GPU capex through 2027."
      - - Sovereign APAC Moat
        - "Australia's renewable energy, political stability, and proximity to Asia-Pacific creates sovereign compute scarcity value; no hyperscaler owns this asset mix."
        - "NEXTDC (OpenAI campus), Macquarie DC, and CDC are building sovereign capacity on comparable or superior governance credentials; moat is not exclusive."
        - Partial
        - "Sustained IRAP or sovereign-certification differentiation that competitors cannot match; demonstrable customer pipeline that requires Firmus specifically."
      - - Blackstone Credit Validation
        - "$10B senior-secured facility conditioned on contracts gives institutional lender confidence that contracted revenue supports the capital structure."
        - "Full drawdown at 7–9% annual rate implies $700–900M annual interest; GAAP profitability requires revenue substantially above any current public evidence; CoreWeave GAAP losses at $740M/quarter illustrate the pattern."
        - Confirmed (structure); Unresolved (financial impact)
        - "Prospectus-disclosed DSCR (debt service coverage ratio); revenue disclosing at minimum 1.5x annual interest coverage at initial deployment."
      - - Nvidia Endorsement and Supply
        - "Nvidia equity participation and DGX Cloud regional deployment at Southgate Melbourne signals chip supply priority and demand-side distribution no APAC competitor matches."
        - "Nvidia's equity is estimated <AUD $100M across two rounds vs. AUD $1.35B total raised; investment is vendor-financing-shaped: GPU purchase flow returns capital to Nvidia multiple times over; not an independent endorsement."
        - Partial (confirmed small position; vendor dynamic inferred)
        - "Disclosed Nvidia equity percentage in prospectus; evidence of non-GPU-supply commercial relationship; Nvidia DGX Cloud revenue-share disclosure."
      - - IPO Structure Integrity
        - "Global roadshows completed; four tier-1 bookrunners appointed; ASX Good Fame and Character cleared for Curtis; board materially strengthened."
        - "No prospectus lodged; no escrow; Oliver Curtis conviction directly relevant to governance in a securities context; boutique VC funds hold Firmus at >60% of fund value — concentrated selling risk."
        - Partial (process advanced; transparency low)
        - "Prospectus with revenue, lock-up structure, and audited efficiency claims; at least 90-day escrow for founders and pre-IPO holders."
      - - Energy Cost Advantage
        - "Contracted Tasmanian hydroelectric power at an estimated USD $0.04–$0.06/kWh — among the lowest data centre power costs globally — provides durable operating cost advantage."
        - "PUE claim of 1.03 was a 2021 point measurement, not independently audited; actual operating PUE, power contract volume, and pricing are not publicly verified; Tasmania hydro deal drew political friction."
        - Partial (cost range estimated; PUE unverified)
        - "Independent PUE audit at full load; disclosed power contract terms in prospectus; sustained grid access without regulatory disruption."
    notes: "Evidence state (Partial/Confirmed/Unresolved) is author-derived from public source review. 'Partial' means some corroborating evidence exists but key assumptions remain unverified. 'What Would Change the View' describes evidence that would resolve the uncertainty."
