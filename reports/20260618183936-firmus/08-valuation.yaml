  - id: comparable-set
    title: Comparable Set — Public Companies, Private Rounds, and M&A Transactions
    body: >-
      No directly comparable public company trades on the ASX as a pure-play AI factory neocloud. The four
      most relevant reference points are CoreWeave (NASDAQ: CRWV), Lambda Labs (private, IPO planned H2 2026),
      NEXTDC (ASX: NXT), and the AI and hyperscale data center M&A market which has generated record deal
      values in 2025–2026.

      CoreWeave is the primary benchmark. At its March 2025 IPO at USD $40 per share, CoreWeave implied a
      market capitalisation of approximately USD $19–27 billion on annualised Q1 2025 revenue of roughly
      USD $3.9 billion. By May 2026 CoreWeave reported Q1 2026 revenue of USD $2.08 billion, reaffirmed
      full-year 2026 guidance of USD $12–13 billion, secured a new $8.5 billion non-recourse delayed-draw
      term loan alongside a $2 billion Nvidia equity investment, and traded at an implied EV/2026E revenue
      multiple of 8.2x to 10.6x (MarketScreener: 8.26x; Multiples.vc: 10.6x in June 2026). CoreWeave's
      backlog reached USD $99.4 billion at end-Q1 2026 — providing substantial contracted revenue visibility
      that Firmus has not publicly demonstrated. However, CoreWeave also carries approximately USD $25–28
      billion in combined debt and equity-backed facilities, reports widening GAAP losses ($740 million net
      loss in Q1 2026 despite $2.08 billion revenue and $1.16 billion adjusted EBITDA), and still trades at
      a high premium. The CoreWeave model is the most instructive analog for Firmus: it confirms AI cloud
      infrastructure demand is real and capitalisable — but it also demonstrates the structural earnings gap
      between adjusted EBITDA and GAAP net income for highly leveraged GPU-cloud operators.

      Lambda Labs, which hired banks for a US IPO in H2 2026, carries an implied valuation of approximately
      USD $9–9.1 billion as of May 2026 at approximately 12x forward revenue on estimated FY2025 revenue of
      USD $760 million. Lambda's developer-oriented positioning differs from Firmus's factory model, but its
      revenue multiple provides a useful upper bound for pre-IPO private comp analysis.

      NEXTDC (ASX: NXT) trades at an EV/EBITDA multiple of approximately 56–74x trailing as of June 2026,
      with enterprise value AUD $12–14 billion driven by contracted capacity growth of 60 percent to 667 MW
      and an OpenAI campus partnership. NEXTDC's high multiple reflects premium AI infrastructure pricing but
      is anchored in actual EBITDA, not pre-revenue promise — a structurally different valuation basis from
      what Firmus requires at IPO.

      The AI and hyperscale data center M&A market recorded USD $151 billion in aggregate deal value since
      early 2024 with 84 percent funded by private equity. Operational, pre-leased AI-ready assets command
      EV/revenue multiples of 6–10x and EV/EBITDA of 16–20x. Firmus would anchor to the lower end of the
      comparable set given its pre-revenue status; only a prospectus disclosure of contracted revenue would
      lift it into the CoreWeave or Lambda comparable bracket.

      Applying CoreWeave's 8–10x 2026E revenue multiple to Firmus's AUD $8–12 billion IPO target implies
      required revenue of AUD $800 million to AUD $1.5 billion. No public evidence supports this level as
      of the run date. At AUD $6 billion, the valuation would be justifiable if a fraction of the contracted
      GPU pipeline converts to revenue at typical GPU-cloud rates; at AUD $8–12 billion, prospectus proof
      is required.
