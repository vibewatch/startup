        - "Requires all five conditions simultaneously: IPO pricing at range-top, customer disclosure, operational ramp, debt drawdown, sustained demand — low compounding probability."
        - "Low-to-moderate. All individual conditions have moderate-to-high probability but joint probability is lower; AI efficiency gains or GPU supply normalisation are the primary downside catalysts."
      - - "Base"
        - "IPO at AUD $7–9B in H2 2026; partial contract disclosure; revenue ramp to AUD $600M–$1.2B by end 2027; multiple compression to 6–8x as growth normalises; debt service absorbs significant FCF."
