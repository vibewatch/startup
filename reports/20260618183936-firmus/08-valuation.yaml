figures:
  - id: FV001
    title: "Recommendation Logic: From Evidence to TRACK"
    type: flow
    layout: wide
    summary: >-
      Decision chain linking the four structural thesis pillars through their key
      uncertainties to the TRACK recommendation, showing what must clear for a BUY.
    data:
      nodes:
        - id: structural-demand
          label: "Structural AI Infrastructure Demand"
          detail: >-
            Hyperscaler AI capex $660–690B globally in 2026; Firmus has two confirmed multi-billion
            dollar contracts; Blackstone $10B facility conditioned on signed contracts. Demand signal
            is real and institutionally validated.
        - id: contract-evidence
          label: "Contracted Revenue Evidence"
          detail: >-
            Two confirmed hyperscale contracts at Project Southgate. Neither customer identity,
            pricing, minimums, nor cancellation terms are publicly disclosed. Revenue floor is
            asserted but not independently verifiable pre-prospectus.
        - id: leverage-risk
          label: "Extreme Capital Leverage"
          detail: >-
            $10B Blackstone debt at 7–9% annual rate = $700–900M annual interest at full drawdown.
            GPU depreciation (4–5yr life) adds further non-cash drag. Debt/equity >7:1 at full
            drawdown. CoreWeave GAAP net loss $740M/quarter despite 56% adj. EBITDA margin.
        - id: governance-risk
          label: "Governance and Structure Risk"
          detail: >-
            Oliver Curtis insider-trading conviction (cleared by ASX Mar 2026); no IPO escrow for
            early investors (300–530% paper gains); PUE claim retracted to unverified 2021 point
            measurement; NEXTDC CEO disputed build-cost claim.
        - id: missing-evidence
          label: "Critical Missing Evidence"
          detail: >-
            No prospectus filed; no revenue or margin disclosed; both customer identities undisclosed;
            no independent efficiency audit. IPO at AUD $8–12B asks investors to price on faith.
        - id: recommendation
          label: "TRACK: Await Prospectus"
          detail: >-
            Convert to BUY only if prospectus discloses: AUD $800M+ contracted revenue, customer
            identities, ≥90-day escrow, and IPO entry ≤ AUD $8B. AVOID if no escrow and no revenue
            in prospectus.
      edges:
        - source: structural-demand
          target: contract-evidence
          label: "validated by"
        - source: contract-evidence
          target: leverage-risk
          label: "funded by"
        - source: leverage-risk
          target: governance-risk
          label: "compounds"
        - source: governance-risk
          target: missing-evidence
          label: "creates"
        - source: missing-evidence
          target: recommendation
          label: "yields"
    claimRefs:
