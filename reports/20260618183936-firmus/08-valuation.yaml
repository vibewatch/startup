callouts:
  - calloutType: recommendation
    title: "Recommendation: TRACK — Await Prospectus Before Committing"
    body: >-
      Firmus's structural AI infrastructure thesis is evidence-backed: sovereign demand is real, the Blackstone
      facility provides project-finance credibility, and contracted hyperscale revenue creates a visible pipeline.
      But the IPO asks public investors to apply private-market multiples to undisclosed revenue at a pre-prospectus
      stage, without escrow protection against 300–530% paper-gain holders selling from day one. The appropriate
      action is TRACK: review the prospectus when lodged with ASIC; convert to BUY only if revenue of AUD $800M+,
      customer identity, and a ≥90-day lock-up are disclosed at a valuation ≤ AUD $8 billion.
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV013
      - CV028

  - calloutType: risk
    title: "No-Escrow IPO: Structural Red Flag for Incoming Investors"
    body: >-
      The Firmus IPO is reported to include no escrow or share-sale restrictions for pre-IPO shareholders,
      including founders, management, and institutional investors with 300–530% paper gains. Wilson Asset
      Management — itself a Firmus shareholder — identified this as a "structural red flag." Roger Montgomery
      warned retail investors face the risk of providing "exit liquidity" for insiders. Investors evaluating the
      bookbuild should price this structural risk into entry valuation and monitor trading volumes and ownership
      changes in the first 90 days post-listing. Confirmation of any lock-up provisions in the prospectus is a
      binary go/no-go diligence item.
    claimRefs:
      - CV013
      - CV014
      - CV037

  - calloutType: insight
    title: "CoreWeave Precedent: The EBITDA-to-GAAP Gap Is the Critical Risk"
    body: >-
      CoreWeave's Q1 2026 results provide the most instructive precedent for Firmus: $2.08B revenue and 56%
      adjusted EBITDA margin still produced a $740M GAAP net loss after debt service and GPU depreciation.
      For Firmus with a $10B debt facility at 7–9% annual rates, adjusted EBITDA will systematically overstate
      economic profitability. Investors must model GAAP net income paths, not adjusted metrics, when
      evaluating IPO pricing. Ask for the prospectus's GAAP income statement, not just EBITDA.
    claimRefs:
      - CV009
      - CV027
      - CV036

