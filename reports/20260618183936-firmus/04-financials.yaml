figures:
  - id: FI001
    title: Revenue Model Bridge — Customer Activity to Firmus Revenue
    type: flow
    layout: wide
    summary: >-
      How enterprise and cloud customers generate compute demand that flows through GPU clusters and AI factories
      into Firmus contracted revenue.
    data:
      nodes:
        - id: enterprise-customer
          label: Enterprise / Hyperscale Customer
          detail: >-
            AI labs, global technology platforms, government agencies, and enterprise AI teams requiring dedicated
            high-density GPU compute for training and inference at scale.
        - id: cloud-customer
          label: Cloud / On-Demand Customer
          detail: >-
            Developers, researchers, and startups accessing GPU and CPU instances and WEKA NVMe storage through the
            Firmus AI Cloud platform at public list prices.
        - id: compute-request
          label: AI Compute Request (Token / GPU-Hour)
          detail: >-
            Customer workloads are submitted as training runs, inference jobs, or long-running AI experiments
            consuming GPU compute measured in AI tokens or GPU-hours.
        - id: gpu-cluster
          label: Nvidia GPU Cluster (GB300 / H100 / A100)
          detail: >-
            Physical GPU clusters deployed in Firmus AI Factories, procured under Nvidia's DSX reference
            architecture. Currently confirmed deployments include ~18,400 GB300 GPUs at Melbourne and ~36,800
            GB300 GPUs planned at Tasmania.
        - id: ai-factory
          label: Firmus AI Factory
          detail: >-
            Modular, liquid-cooled data center campus co-designed with Nvidia, powered by renewable hydroelectric
            energy. Delivers AI tokens with a claimed energy efficiency of up to 60% better than air-cooled
            alternatives.
        - id: firmus-revenue
          label: Firmus Revenue (Contract or Cloud)
          detail: >-
            Revenue recognised as either recurring monthly contract payments under multi-year enterprise agreements
            or cloud consumption billing; specific recognition method and realized rates are not publicly disclosed.
        - id: nvidia-dgx-cloud
          label: Nvidia DGX Cloud (Regional Partner Channel)
          detail: >-
            Nvidia's managed AI platform establishing a dedicated region at Southgate Melbourne, routing Nvidia
            enterprise customers to Firmus infrastructure through the Nvidia distribution channel.
      edges:
        - from: enterprise-customer
          to: compute-request
          label: multi-year dedicated contract
        - from: cloud-customer
          to: compute-request
          label: on-demand / reserved billing
        - from: nvidia-dgx-cloud
          to: compute-request
          label: platform-mediated demand
        - from: compute-request
          to: gpu-cluster
          label: workload scheduling
        - from: gpu-cluster
          to: ai-factory
          label: housed in and powered by
        - from: ai-factory
          to: firmus-revenue
          label: GPU-hours / AI tokens delivered
    approximationNotes: >-
      Revenue recognition method (percentage-of-completion vs. monthly delivery) and realized per-GPU-hour
      pricing are not publicly known. The flow represents the structural model as inferred from public
      announcements and pricing page evidence, not disclosed financial mechanics.
    claimRefs:
      - CI001
      - CI035
      - CI039

  - id: FI002
    title: Unit Economics Bridge — Known Inputs and Critical Unknowns
    type: flow
    layout: wide
    summary: >-
      Key cost and revenue inputs in the Firmus AI factory unit economics, showing what is publicly known,
      what is estimated from comparables, and what remains unavailable.
    data:
      nodes:
        - id: gpu-capex
          label: GPU Cluster CapEx
          detail: >-
            Dominant cost input. Firmus claims $35–45M/MW all-in vs. $50–55M/MW industry benchmark. Electrical
            infrastructure alone (Maas Group JLE contract) runs ~$2M/MW, suggesting non-electrical capex
            per MW is the primary driver.
        - id: energy-opex
          label: Energy OpEx (Hydro)
          detail: >-
            Estimated USD $0.04–$0.06/kWh for contracted Tasmanian hydroelectric power — among the lowest
            data center power costs globally. A 100MW facility at 90% utilization consumes ~788 GWh/yr,
            implying annual energy spend of ~$31M–$47M at these rates.
        - id: debt-service
          label: Debt Service (Blackstone $10B)
          detail: >-
            Interest and principal repayment on the $10B Blackstone debt facility. Rate and amortisation
            schedule are not publicly disclosed; at typical private infrastructure debt rates of 7–9%,
            annual interest on fully drawn balance would range from $700M–$900M.
        - id: gpu-depreciation
          label: GPU Depreciation
          detail: >-
            Nvidia GB300 GPUs have an expected useful life of approximately 4–5 years for AI training
            workloads before a refresh cycle is required. Depreciation on $35–45M/MW of GPU assets
            creates a substantial non-cash charge that reduces net income below headline EBITDA.
        - id: revenue-unknown
          label: Contract Revenue (Not Disclosed)
          detail: >-
            Per-GPU-hour or per-AI-token pricing is commercially confidential. CoreWeave H100 market
            rates ran approximately $2–$4/GPU-hour in 2025–2026. An 18,400-GPU cluster at $2.50/GPU-hr
            and 80% utilization implies ~$320M annualised revenue — but Firmus's actual contracted rate
            is unknown.
        - id: net-margin-gap
          label: Net Margin — Unavailable
          detail: >-
            The gap between contracted revenue and the sum of energy opex, debt service, depreciation,
            and operating overhead determines equity-level returns. This figure is not disclosed and
            cannot be computed from public information alone.
      edges:
        - from: gpu-capex
