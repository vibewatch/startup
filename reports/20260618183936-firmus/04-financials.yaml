          label: capitalised and depreciated over GPU life
        - from: energy-opex
          to: net-margin-gap
          label: reduces gross margin
        - from: debt-service
          to: net-margin-gap
          label: below-EBITDA cash drain
        - from: gpu-depreciation
          to: net-margin-gap
          label: non-cash income reduction
        - from: revenue-unknown
          to: net-margin-gap
          label: offset to all costs
    approximationNotes: >-
      All figures are estimates derived from company claims, industry benchmarks, and CoreWeave comparables.
      No Firmus-specific gross margin, interest rate, depreciation life, or contracted revenue data has been
      publicly disclosed. The annualised GPU-cluster revenue estimate of ~$320M is illustrative only and
