  - id: cost-structure
    title: Cost Structure, Capital Intensity, and Supply Chain
    body: >-
      The Firmus AI factory model is capital-intensive by design. The company claims capital intensity of
      approximately $35-45 million per MW for new builds, compared to an industry benchmark of $50-55 million per MW
      for comparable facilities; it attributes this advantage to proprietary immersion liquid-cooling technology,
      modular construction, and vertical supply chain integration. Construction cost savings of approximately 50%
      relative to traditional air-cooled data centers are also claimed, derived from the same cooling and modular
      design approach. Neither the per-MW capex claim nor the construction savings figure has been independently
      verified in the reviewed sources.

      The most specific public evidence of cost structure comes from the Maas Group (ASX: MGH) ASX announcement of
      May 18, 2026. The filing discloses that the AUD $200 million contract for the 100 MW Launceston AI Factory
      covers turnkey modular PowerCube solutions and high-voltage electrical infrastructure through the JLE Group,
      implying electrical scope alone runs to AUD $2 million per MW. JLE is established as the exclusive electrical
      delivery partner for the wider 3.3 GW Firmus portfolio, with each additional 100 MW module representing a
      further AUD $200 million in electrical infrastructure revenue — a transparent cost benchmark that anchors one
      component of the per-site cost structure.

      Energy cost is a material operating expense input. Firmus's Tasmanian facility relies on the state's
      predominantly hydroelectric grid, with renewable power supply rates in the range of approximately USD $0.04-0.06
      per kWh — well below the global average for data center power and a genuine structural advantage for operational
      cost. However, the Tasmania grid's capacity has already attracted political friction: local figures have raised
      concerns about grid strain, and legacy industrial customers were historically denied additional capacity. The
      company's PUE efficiency claim of 1.03 has been publicly challenged: UNSW's Dr. Amr Omar described it as being
      at the extreme end of global possibility, and the company subsequently acknowledged it was a point measurement
      from 2021 rather than an ongoing verified operational figure. Leading hyperscale operators Google and Microsoft
      typically report PUE between 1.1 and 1.2. The distinction matters for operating cost modelling: a true PUE of
      1.03 would represent transformational energy efficiency; a realised PUE of 1.15-1.20 would be excellent but
      significantly less differentiated.
