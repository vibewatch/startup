  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin-burn-runway
      missingEvidence: >-
        Audited income statement, gross margin by revenue line, monthly cash burn rate, cash on hand, and
        runway calculation as of the most recent quarter prior to the IPO.
      whyItMatters: >-
        Without gross margin and burn data it is impossible to underwrite the capital efficiency of Firmus's
        build-out or assess whether contracted revenue covers operating costs and debt service obligations.
        These are the most critical inputs for any financial diligence of a pre-IPO infrastructure company.
      diligencePath: >-
        Request management accounts and the most recent 12-month rolling cash-flow statement; obtain audited
        financials once lodged with ASIC in the IPO prospectus; benchmark reported gross margin against
        CoreWeave's 56% adjusted EBITDA and Oracle AI infrastructure margins as comparable reference points.
      relatedQuestionRefs:
        - QI014

    - type: private-evidence-only
      severity: material
      topic: hyperscale-contract-pricing-terms
      missingEvidence: >-
        Pricing per GPU-hour or per AI token, power cost passthrough structure (fixed vs. variable), minimum
        commitment levels, and cancellation and termination rights for both disclosed large-scale contracts.
      whyItMatters: >-
        The USD $10 billion Blackstone debt facility is explicitly conditioned on executed long-term customer
        contracts; if those contracts contain broad cancellation rights or allow repricing, the debt structure's
        revenue backstop is materially weaker than publicly presented.
      diligencePath: >-
        Request counterparty-anonymised contract term sheets from management in due diligence; review material
        contract disclosures in the IPO prospectus; compare with public CoreWeave and Oracle AI infrastructure
        contract mechanics where available.
      relatedQuestionRefs:
        - QI026

    - type: private-evidence-only
      severity: material
      topic: revenue-mix-breakdown
      missingEvidence: >-
        Proportion of revenue from on-demand cloud versus enterprise contract versus storage; geographic split
        between Australia and Singapore; and revenue recognition method applied to long-term construction
        and delivery contracts.
      whyItMatters: >-
        Revenue mix determines quality and predictability. Enterprise and sovereign contracts produce more
        predictable recurring revenue than on-demand cloud; without the split, blended contract risk, churn
        exposure, and revenue recognition timing cannot be assessed.
      diligencePath: >-
        Request revenue breakdown by channel in the IPO prospectus; if unavailable pre-listing, model
        from disclosed contract sizes and public pricing for on-demand and storage products.
      relatedQuestionRefs:
        - QI004

    - type: private-evidence-only
      severity: material
      topic: gpu-depreciation-token-economics
      missingEvidence: >-
        Capitalized cost per GPU, assumed depreciation life, expected GPU utilization rate at steady state,
        and cost per AI token produced at target utilization for the first Melbourne and Tasmania clusters.
      whyItMatters: >-
        Capital intensity only translates into equity returns if depreciation-adjusted net economics are
        positive. GPU refresh cycles and utilization rates determine whether the AI factory model achieves
        returns above cost of debt; neither is disclosed by Firmus.
      diligencePath: >-
        Request GPU procurement cost, depreciation schedule, target utilization assumption, and TCO model
        from management; compare against CoreWeave's public utilization disclosures and data center analyst
        benchmarks for rack-level economics.
