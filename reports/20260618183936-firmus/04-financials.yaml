  - id: capital-structure
    title: Capital Structure, Financing, and IPO Preparation
    body: >-
      Firmus has built a capital structure that is large relative to its current operating stage. In the six months
      to April 2026, the company closed three equity rounds totalling approximately USD $1.35 billion: an initial
      AUD $330 million raise in late 2025 at a USD $1.9 billion valuation with Nvidia as lead strategic investor,
      a AUD $500 million raise in November 2025 at a USD $6 billion valuation, and a USD $505 million raise in
      April 2026 led by Coatue Management with continued Nvidia participation at a USD $5.5 billion post-money
      valuation. The April 2026 round was announced as the final pre-IPO equity raise.

      The more structurally significant component is the USD $10 billion senior-secured debt financing facility
      announced on February 9, 2026, led by funds managed by Blackstone Tactical Opportunities and Blackstone
      Credit & Insurance with participation from Coatue. The transaction is described by advisors Milbank, Allens,
      and Kirkland & Ellis as one of the largest private debt financings in Australian corporate history. The
      facility's key structural feature — drawdown conditioned on executed long-term customer contracts with
      hyperscalers and blue-chip AI customers — limits speculative deployment and mirrors project-finance structures
      common in contracted energy infrastructure. This design provides lenders genuine revenue coverage but means
      the debt cannot be drawn ahead of securing commitments, which introduces sequencing risk if contract
      negotiations slow or are delayed.

      The IPO, expected in June or July 2026 on the ASX, targets a USD approximately $2 billion equity raise.
      Bookrunners are Bank of America, JPMorgan, Morgans Financial, and Morgan Stanley. If completed at the targeted
      scale, the listing would rank among the largest technology offerings in Australian history. Reports from Startup
      Daily indicate investors are modelling an IPO valuation of AUD $8 billion or above, representing a further
      step-up from the AUD $7.95 billion pre-money implied at the April 2026 round. The total capex plan of
      AUD $73.3 billion through 2028 is approximately 55 times the current equity raised, making IPO proceeds and
      continued debt drawdown against new contracts the critical financing path. Monthly burn rate and near-term
      runway have not been publicly disclosed.
