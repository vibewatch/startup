  - id: financial-verdict
    title: Financial Verdict and Diligence Gaps
    body: >-
      The positive financial case for Firmus rests on three observable pillars: a structurally sound debt facility
      conditioned on contracted revenue, evidence of at least two multi-billion dollar hyperscale commitments
      providing a visible revenue base before the IPO, and a renewable-energy cost advantage that — if realised at
      scale — supports materially better operating economics than legacy air-cooled competitors. The Blackstone
      facility's contract-drawdown condition is analogous to project-finance structures that have historically
      attracted investment-grade debt ratings in energy infrastructure, and the Maas Group ASX filing provides
      independent corroboration of actual construction progress at 35% completion against a AUD $200 million
      electrical scope.

      The negative case is equally well-evidenced. Firmus has not disclosed revenue, gross margin, burn rate, or
      runway in any reviewed public source. CoreWeave, the closest comparable public company, reported FY2025
      adjusted EBITDA of 56% but a net loss of USD $1.17 billion after GPU depreciation and interest on its
      approximately USD $21 billion debt load — demonstrating that headline EBITDA margins in AI cloud infrastructure
      are structurally misleading when equipment depreciation and debt service are excluded. Firmus's debt profile
      will impose similar dynamics once deployment begins at scale, and its IPO-implied valuation of AUD $8-12
      billion would ask public investors to pay private-market multiples without the disclosure depth that public
      markets normally require.

      Governance risk is also material. Oliver Curtis's 2016 insider trading conviction is directly relevant to
      ASX listing requirements, and the ASX's February 2026 compliance guidance on the Good Fame and Character
      test was widely interpreted in the financial press as connected to the Firmus listing. Roger Montgomery
      Investment Management has publicly identified the absence of an IPO lock-up or escrow arrangement as a
      structural red flag, noting that early investors who have already realized a 300% valuation markup are
      economically incentivised to exit on the first day of trading. Taken together, the financial verdict is that
      the Firmus thesis is not unreasonable on demand fundamentals and capital structure design, but the combination
      of extreme capital intensity, undisclosed operating economics, concentrated customer exposure, and governance
      overhang means this chapter cannot support a traditional financial underwriting conclusion without access to
      management accounts, IPO prospectus financials, and contract term sheets.
    claimRefs:
