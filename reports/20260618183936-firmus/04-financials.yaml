  - id: TI005
    title: Public Financial Gaps Table
    columns:
      - Missing private metric
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - Revenue (total, by product line, and by geography)
        - Cannot assess revenue scale, growth rate, or quality without disclosed figures; investment case rests entirely on contracted and pipeline data
        - Request from IPO prospectus (lodged with ASIC) once available; alternatively request management accounts in due diligence
      - - Gross margin by revenue stream
        - Without margin data it is impossible to assess whether contracted revenue covers operating costs including energy, staffing, and debt service
        - Review IPO prospectus financial statements; benchmark against CoreWeave (56% adj. EBITDA) and Oracle AI infrastructure margins as reference points
      - - Burn rate and cash runway
        - Cannot assess near-term solvency or IPO timing pressure without understanding monthly cash consumption
        - Request most recent management cash-flow statement and 12-month cash projection; cross-check against headcount and facility operating costs
      - - Hyperscale contract pricing mechanics and cancellation terms
        - The $10 billion debt facility is conditioned on executed customer contracts; if those contracts can be cancelled or repriced, the debt structure unwinds
        - Request anonymised contract term sheets in due diligence; review IPO prospectus material contract disclosures; assess minimum commitment floors and termination rights
      - - GPU depreciation schedule and utilization rate targets
        - AI factory equity economics depend critically on how fast GPUs are depreciated against contracted revenue and at what utilization; neither is disclosed
        - Request capital expenditure schedule, assumed GPU depreciation life, and target utilization rate from management; compare against CoreWeave's public asset-level disclosures
    notes: >-
      All five items are genuinely private metrics for a pre-IPO company. Severity is uniformly material
