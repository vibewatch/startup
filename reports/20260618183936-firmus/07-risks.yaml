callouts:
  - calloutType: risk
    title: "No-Escrow IPO Structure: Retail Investors as Exit Liquidity"
    body: >-
      Firmus's confirmed absence of escrow or share-sale restrictions for pre-IPO shareholders at listing
      is one of the most structurally unusual features of a major Australian technology IPO in recent memory.
      Some boutique VC and PE funds hold Firmus positions representing more than 60 percent of total fund
      value. With near-300% valuation markups achieved in just months, the economic incentive for early
      holders to crystallise gains immediately at listing is strong. Independent fund managers including
      Roger Montgomery and Wilson Asset Management have publicly identified retail IPO buyers as providing
      effective exit liquidity. This risk is not mitigated by the current board composition and is a
      material diligence point for any public-market participant.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR033

  - calloutType: risk
    title: "Nvidia Golden Handcuffs: Symbiotic Financing Loop"
    body: >-
      Nvidia's undisclosed equity investment in Firmus — estimated by independent analysts at potentially
      less than A$100 million — is widely credited with catalysing A$830 million in third-party equity and
      the US$10 billion Blackstone debt facility. The vast majority of that capital flows back to Nvidia
      as hardware revenue through GPU purchases. This creates a structural lock-in: Firmus cannot diversify
      away from Nvidia GPU architectures without destabilising the investor and supplier narrative that
      justifies its valuation. Simultaneously, Nvidia's chip delivery schedules, which industry observers
      note can extend to twelve months, become the critical-path constraint on Firmus's construction
      programme, debt drawdown, and revenue recognition — all while interest accrues.
    claimRefs:
      - CR026
      - CR027
      - CR019
      - CR025

