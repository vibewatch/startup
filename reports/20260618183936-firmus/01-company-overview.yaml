callouts:
  - calloutType: strength
    title: Nvidia Strategic Alignment and Chip Supply Priority
    body: >
      Nvidia's dual role as strategic equity investor and primary GPU supplier — participating in both the September
      2025 and April 2026 equity rounds, and providing the DSX/Vera Rubin reference architecture for Project
      Southgate — gives Firmus a tier-one institutional validator and preferential access to the most constrained
      input in the AI infrastructure market. Australia is one of approximately seven countries outside the US with
      unrestricted access to the most advanced Nvidia chips under current US export-control policy, making Firmus's
      APAC positioning a structural competitive advantage. Blackstone's John Watson described AI infrastructure as
      "one of our highest conviction investment themes" and specifically highlighted Firmus's energy-efficient model.
    claimRefs:
      - CO024
      - CO027
      - CO028

  - calloutType: risk
    title: Key-Person Risk — Oliver Curtis Conviction and Governance Dependency
    body: >
      Co-CEO Oliver Curtis carries a 2016 criminal conviction for conspiracy to commit insider trading — a
      dishonesty offence in a securities context that the ASX explicitly identifies as directly relevant to
      the role of a listed-company director. While Curtis passed the ASX Good Fame and Character test in March
      2026, enabling the planned IPO, the conviction remains a permanent feature of the company's governance
      record. Independent fund managers including Roger Montgomery Investment Management and journalist analysis
      in The Witness have noted that prospectus disclosure requirements will ensure all public investors see
      the full history before buying. The absence of any escrow restrictions for pre-IPO shareholders
      (including founders) compounds key-person risk: if investor confidence in Curtis erodes post-listing,
      founders and early backers can sell at will with no lock-up period.
    claimRefs:
      - CO011
      - CO012
      - CO034
      - CO035
      - CO038
      - CO045

  - calloutType: risk
    title: Unverified Efficiency Claims and Symbiotic Nvidia Loop
    body: >
      Firmus's headline PUE of 1.03 is a 2021 point measurement from a single immersion deployment that
      cannot be independently verified. UNSW expert Dr Amr Omar characterised a sustained 1.03 PUE as "at
      the extreme end of what is now possible anywhere in the world." The company's broader claim of 60%
      energy savings versus competitors has not been tested by an independent third party at operating scale.
      Separately, Roger Montgomery Investment Management argued that Nvidia's relatively small equity investment
      (estimated at A$30–75M) unlocked A$830M in follow-on equity and US$10B in debt, the majority of which
      will flow back to Nvidia as hardware revenue — creating a self-reinforcing loop where Nvidia's halo
      effect crowds out scrutiny of the underlying economics. Customer contract disclosures are also absent
      from all public communications reviewed.
    claimRefs:
      - CO020
      - CO021
      - CO045
      - CO046

