  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-and-financials
      missingEvidence: >
        Revenue, ARR, gross margin, EBITDA, and cash burn are not publicly disclosed. Firmus is a private company with no regulatory filing obligation for financials. The Singapore operations are confirmed to be revenue-generating but no revenue figure has appeared in any source reviewed.
      whyItMatters: >
        Without revenue data, the company's path to profitability, debt serviceability relative to the US$10 billion Blackstone facility, and IPO price-earnings or EV/revenue multiples cannot be assessed. The IPO prospectus will be the first mandatory disclosure event.
      diligencePath: >
        Review IPO prospectus once lodged with ASX; request management accounts as part of any pre-IPO due diligence process; triangulate from customer contract values if disclosed.
      relatedQuestionRefs: [QO013, QO018]

    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: >
        Current Firmus employee headcount is not publicly disclosed. The company has referenced 20,000+ jobs through Project Southgate by 2028, but this is a forward-looking construction/operations estimate across the full buildout, not the current FTE count.
      whyItMatters: >
        Headcount is a proxy for organisational maturity and execution capacity relative to the US$10B debt-funded buildout. Without it, it is impossible to assess whether the company has the operational depth to deploy 1.6 GW of infrastructure by 2028.
      diligencePath: >
        Request management headcount disclosures; review LinkedIn employee count; check ASX prospectus when filed.
      relatedQuestionRefs: [QO014]

    - type: missing-source
      severity: material
      topic: pre-2025-funding-rounds
      missingEvidence: >
        Funding rounds prior to the September 2025 A$330M raise are not publicly documented, including the amounts, valuations, and investors for any Seed, Series A, or Series B rounds that may have preceded the Regal convertible note (~2021) and the STT GDC strategic partnership (2023). The A$81 million 2024 stake valuation for Curtis implies earlier disclosed or undisclosed rounds.
      whyItMatters: >
        Incomplete funding history makes it impossible to calculate true total capital raised, cumulative dilution, or the cap-table dynamics that will affect IPO economics for early investors who face no escrow restrictions.
      diligencePath: >
        Request company-provided cap table and full funding history; review IPO prospectus for historical fundraising disclosure; cross-reference ASIC filings for share issuances.
      relatedQuestionRefs: [QO004, QO007]

    - type: conflicting-data
      severity: minor
      topic: founding-location
      missingEvidence: >
        Multiple sources disagree on Firmus's founding location. Startup Daily's April 2026 article describes it as "Sydney-founded"; Tracxn lists the registered address as Saint Leonards (inner Sydney); Startup Daily and SmartCompany consistently describe early operations as being in Tasmania; and the company's operational centre is now Singapore.
      whyItMatters: >
        The founding location conflict is minor for investment analysis but may surface in IPO documentation; Tasmania's hydroelectric advantage is core to the Project Southgate thesis so the geographic pivot from Tasmania to Singapore also warrants clear disclosure.
      diligencePath: >
        Review ASIC corporate registration records for original registered office; confirm with company communications/press kit.
      relatedQuestionRefs: [QO001]

    - type: missing-source
      severity: minor
      topic: leadership-background
      missingEvidence: >
        The full professional backgrounds of Grant Dempsey (incoming board chair) and Kirsty Godfrey-Billy (CFO),
        both appointed in September 2025, are not available in public sources reviewed for this chapter.
        Additional C-suite hires (Nicole Reid as CPO, Anthony McGough as A/NZ VP Sales) are named but
        only partially profiled in available sources.
      whyItMatters: >
        Board chair and CFO credentials are directly material to the company's IPO readiness, risk oversight
        quality, and investor confidence in the leadership team beyond the three co-founders.
      diligencePath: >
        Review IPO prospectus director profiles; request company bios directly; check LinkedIn and ASIC
        director lookups for Firmus Grid Limited.
      relatedQuestionRefs: [QO015, QO016]
      relatedTableRefs: [TO002]
    - type: missing-source
      severity: minor
      topic: investor-map-completeness
      missingEvidence: >
        The full investor register for Firmus prior to the Sep 2025 A$330M round is not publicly available.
        Individual share percentages for Regal Funds Management, Archibald Capital, Tectonic Fund, and
        other early investors are not disclosed in any source reviewed. James Packer's ~A$50M investment
        (at A$145/share) and the Ellerston ~7% and Tectonic ~7% stakes are reported but unconfirmed
        by official filings.
      whyItMatters: >
        Without a full cap table, the relative economic interests of founders versus institutional
        investors cannot be assessed, and key-person concentration risk for Oliver Curtis and Tim
        Rosenfield cannot be quantified ahead of the IPO.
      diligencePath: >
        Review IPO prospectus cap table disclosures; request pre-IPO shareholder register from
        company; cross-check against Firmus investor-relations materials and ASIC beneficial ownership
        notices once available.
      relatedQuestionRefs: [QO006, QO027]
      relatedTableRefs: [TO003]
    - type: missing-source
      severity: minor
      topic: milestone-completeness
      missingEvidence: >
        Pre-2021 milestones for Firmus are sparsely documented in all reviewed public sources.
        No verified record exists of any financing events between December 2019 (Firmus Grid Pty Ltd
        incorporation) and the c.2021 Regal Funds Management convertible note. Operational details of
        the Tasmania bitcoin-mining phase (2019–2022) are based on brief narrative references in
        investor presentations and media profiles, not primary documentation.
      whyItMatters: >
        Gaps in the early founding timeline make it difficult to assess when the pivot from bitcoin-mining
        cooling to AI data-centre occurred, and whether any undisclosed early investors or partners exist.
      diligencePath: >
        Request management timeline from Firmus IR; review ASIC company extract history; check Tracxn
        and PitchBook for any pre-2021 financing records; obtain IPO prospectus once lodged.
      relatedQuestionRefs: [QO009, QO010]
      relatedTableRefs: [TO004]

