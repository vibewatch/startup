evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-financials
    missingEvidence: >
      Revenue, ARR, gross margin, EBITDA, and cash burn are not publicly disclosed. Firmus is a private company with no
      regulatory filing obligation for financials. The Singapore operations are confirmed to be revenue-generating but
      no revenue figure has appeared in any source reviewed.
    whyItMatters: >
      Without revenue data, the company's path to profitability, debt serviceability relative to the US$10 billion
      Blackstone facility, and IPO price-earnings or EV/revenue multiples cannot be assessed. The IPO prospectus will be
      the first mandatory disclosure event.
    diligencePath: >
      Review IPO prospectus once lodged with ASX; request management accounts as part of any pre-IPO due diligence
      process; triangulate from customer contract values if disclosed.
    relatedQuestionRefs:
      - QO013
      - QO018
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: >
      Current Firmus employee headcount is not publicly disclosed. The company has referenced 20,000+ jobs through
      Project Southgate by 2028, but this is a forward-looking construction/operations estimate across the full
      buildout, not the current FTE count.
    whyItMatters: >
      Headcount is a proxy for organisational maturity and execution capacity relative to the US$10B debt-funded
      buildout. Without it, it is impossible to assess whether the company has the operational depth to deploy 1.6 GW of
      infrastructure by 2028.
    diligencePath: |
      Request management headcount disclosures; review LinkedIn employee count; check ASX prospectus when filed.
    relatedQuestionRefs:
      - QO014
  - type: missing-source
    severity: material
    topic: pre-2025-funding-rounds
    missingEvidence: >
      Funding rounds prior to the September 2025 A$330M raise are not publicly documented, including the amounts,
      valuations, and investors for any Seed, Series A, or Series B rounds that may have preceded the Regal convertible
      note (~2021) and the STT GDC strategic partnership (2023). The A$81 million 2024 stake valuation for Curtis
      implies earlier disclosed or undisclosed rounds.
    whyItMatters: >
      Incomplete funding history makes it impossible to calculate true total capital raised, cumulative dilution, or the
      cap-table dynamics that will affect IPO economics for early investors who face no escrow restrictions.
    diligencePath: >
      Request company-provided cap table and full funding history; review IPO prospectus for historical fundraising
      disclosure; cross-reference ASIC filings for share issuances.
