  topStrengths:
    - >-
      Sovereign AI infrastructure positioning in Australia and Singapore aligns with real regional capacity shortages
      and policy demand.
    - >-
      Capital access is unusually strong for an Australian private startup, with repeated Nvidia participation and a
      conditional USD 10B Blackstone facility.
    - >-
      The company has live Singapore deployments and a large Project Southgate pipeline rather than a purely conceptual
      AI factory story.
  topRisks:
    - >-
      No prospectus, no audited financial statements, and no public contracted-revenue schedule support the expected IPO
      valuation.
    - >-
      Founder-governance risk remains elevated because Oliver Curtis's insider-trading conviction and the no-escrow IPO
      structure both sharpen public-market scrutiny.
    - >-
      Execution depends on hyperscale contract quality, Nvidia supply, build-cost discipline, and debt-funded rollout
      economics that remain only partially disclosed.
  unresolvedGaps:
    - >-
      Audited financial statements, revenue recognition, gross margin, burn, and contracted revenue schedules are still
      undisclosed pre-prospectus.
    - >-
      The identities, pricing, minimum commitments, and cancellation provisions of the two hyperscale anchor customers
      remain undisclosed.
    - >-
      No independent third-party verification has been published for PUE, build cost per megawatt, or GPU utilization
      claims.
