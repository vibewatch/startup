  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 治理、法律与监管风险
        blocks:
          - type: paragraph
            body: >-
              Firmus 画像中最突出的单一治理风险，是 co-CEO Oliver Curtis 2016 年的内幕交易定罪。2007 至 2008 年间，Curtis
              与一名前同事合谋，利用对一名基金经理交易意图的预先知情，执行 45 笔盈利 CFD 交易，净获利 A$1,432,228.85。他被 Supreme Court
              陪审团定罪，判处两年监禁并服刑十二个月。其上诉被驳回。随后 ASX 按 Listing Rule 1.1 Condition 20 Good Fame and Character 框架让 Curtis
              通过审查；这是 ASX 对任何寻求进入官方名单实体的董事和拟任董事执行的测试。ASX 可将检查延伸到高级管理人员，并可在标准未维持时拒绝或撤销上市。包括 Roger Montgomery 和 NAOS Asset
              Management 在内的独立基金经理公开指出，该定罪与在这一规模上市公司担任董事直接相关。

              另一项结构性治理风险，是拟议上市时不对 pre-IPO 股东设置 escrow 或股份出售限制。在澳大利亚大型科技上市中，lock-up period 是标准做法，缺失该安排并不典型。独立基金经理认为，缺少
              escrow 实际上把散户 IPO 买方变成早期支持者的退出流动性。极端集中进一步放大担忧：一些 boutique VC 和 PE 基金持有的 Firmus 仓位，在快速估值上调后占基金总价值超过
              60%，强烈激励它们在上市时立即兑现收益。

              监管方面，Firmus 计划中的数据中心运营正落在 Australia Security of Critical Infrastructure Act 2018（SOCI Act）范围内。用于向
              Commonwealth、State 或 Territory 机构，或向其他关键基础设施资产责任实体提供服务的数据存储和处理资产，会被认定为 critical data storage or processing
              assets。一旦被纳入，责任实体必须登记资产、报告网络事件，并采用、维护和遵守书面 Critical Infrastructure Risk Management Program（CIRMP）。拟议 2026
              年 SOCI Act 修正案将对高风险资产类别施加更具规定性的义务，包括供应链 mapping、供应商 FOCI 风险评估、phishing-resistant
              MFA、可独立运行三个月的网络隔离，以及关键工作人员 AusCheck 背景审查。拟议改革下，违规民事罚款每起事件最高可达 $3.3 million。ASIC 对 ASX 治理的调查（Final Report 于
              2026 年 3 月发布）也表明，上市实体及其高管面临更趋严格的监管环境，风险管理和合规职能被要求进行转型式变革。
