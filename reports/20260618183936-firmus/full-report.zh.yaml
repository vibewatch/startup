      - number: '3.2'
        title: 澳大利亚基础设施既有玩家
        blocks:
          - type: paragraph
            body: >-
              在澳大利亚，NEXTDC 是最强大的本土对手。这家 ASX 上市运营商在 2026 年 4 月宣布 A$2.2 billion 融资（A$1.5B 股权 + A$700M
              债务），此前获得其所称史上最大客户合同——S4 园区 250 MW 承诺，外界普遍认为来自 Microsoft。NEXTDC 将 FY26 capex 指引上调至 A$3 billion，管理层目标到 2030
              年 EBITDA 达 A$1 billion，而本年度指引约 A$235 million。2025 年 12 月，NEXTDC 与 OpenAI 签署 MoU，计划在西悉尼 Eastern Creek 的 S7
              站点共同开发 A$7 billion、550–650 MW AI 园区——把自身定位为 OpenAI 澳大利亚算力需求的主权载体。关键在于，NEXTDC CEO Craig Scroggie 在 2026 年 4
              月公开质疑 Firmus 设施能否达到企业级质量，并反驳 Firmus 声称的建设成本约 US$6 million/MW；他引用的行业标准约为 US$12.4 million/MW。争议尚未解决：如果
              Firmus 成本结构基本准确，它就是持久效率护城河；如果不准确，利润率逻辑和 IPO 估值都会面临实质风险。

              CDC Data Centres 既是 Firmus 的主要基础设施伙伴，也是结构性竞争者。作为澳大利亚最大私营（非上市）数据中心运营商，CDC 为 Project Southgate 提供主权实体骨干。但
              CDC 也独立服务 hyperscaler、政府和企业客户；其与 Firmus 的关系同时带来协同和依赖。如果 CDC 合作恶化——或 CDC 自建 GPU 云产品——Firmus 供给侧可能被扰动。

              Macquarie Data Centres 正在悉尼建设 IC3 Super West 设施（47 MW，A$350 million Phase 1），计划 2026 Q3 开业，具备支持 AI
              负载的液冷密度，可达每机架 150 kW+，并与 Dell 和 NVIDIA 合作在现场交付 Dell AI Factory 平台。其澳大利亚主权所有权和 Macquarie Group
              背书，让它在受监管行业具备可信度。

              AUCloud（AUCyber Limited，ASX 上市）持有 IRAP 认证，专注于面向澳大利亚政府和国防的主权 IaaS、MSSP 和受管 IT。其收入估计为数千万 AUD 低位，规模化 GPU
              能力几乎可以忽略。它参与同一个主权话题，但不是 Firmus 规划规模下的 GPU 基础设施对手。
