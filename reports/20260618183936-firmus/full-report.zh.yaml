        - 全球云 / AI 公司（capex 资金）
        - 核心收入细分；Southgate 墨尔本锚定合同
      - - 主权 AI 基础设施
        - 政府要求的境内 AI 算力、符合数据驻留要求的设施
        - 离岸主权云、非 AI 政府 IT
        - 政府部门和受监管行业（采购预算）
        - 战略差异化；澳大利亚所有权和可再生能源资质
      - - 企业 AI 云（托管）
        - 通过 Firmus AI Cloud 按需使用 GPU、托管推理和训练
        - 原始 IaaS、非 AI 企业 SaaS、传统 ERP
        - 掌握 AI 转型预算的 CIO / CTO
        - 第三个细分；单价收入较低，但客户覆盖更广
      - - 研究与教育 AI 算力
        - 大学和国家研究 GPU 资助、HPC 替代
        - 大学通用 IT 采购、网络服务
        - 研究经费，院系 / IT 联合承担
        - 早期细分；验证业务，也为政府声誉提供锚点
      - - AI 原生初创 / 成长期公司容量
        - 用于模型训练和微调的按需 GPU 容量
        - 非 AI SaaS、支付 / 金融科技基础设施
        - 创始人或 Series A–C capex 预算
        - 利润薄但有量的细分；建设品牌和销售管线
      - - 通用 IaaS / 主机托管（排除）
        - 无——Firmus 不在此竞争
        - 不具备 GPU 密度的传统机架、VM 或算力托管
        - 企业 IT、中端市场
        - 范围外；Firmus 明确只瞄准 AI 优化工作负载
      - - 邻近领域：网络 / CDN / 边缘
        - 上线初期无；未来可能扩张
        - 边缘 CDN、运营商中立互联、WAN
        - 电信、媒体、企业
        - 邻近领域；不在当前产品路线图内
