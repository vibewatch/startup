      - number: '1.4'
        title: 里程碑、运营规模与不利事件
        blocks:
          - type: paragraph
            body: >
              Firmus 的运营记录横跨新加坡部署、塔斯马尼亚建设，以及 Project Southgate 旗下快速扩张的澳大利亚全国 rollout。新加坡业务自 2024 Q1 通过 STT GDC 合作上线，是公司
              2026 年前唯一大规模运营、能产生收入的 AI Factory。Firmus 在新加坡两个 STT 站点部署约 4,000 块 Nvidia GPU，为 SEA-LION 项目（AI Singapore
              面向东南亚语言的开源 LLM）部署总算力 99 PFLOP/s。新加坡设施在 2024 年获得 DCD Asia-Pacific Data Center Project of the Year
              奖，SemiAnalysis 在 2024 年和 2025 年均将 Firmus 列入其全球 Top 3 GPU Cloud providers（ClusterMAX）。

              Project Southgate 是公司的旗舰增长载体，随 2025 年 9 月股权融资一同公布，并在 2025 年 10 月通过 CDC Data Centres 与 Nvidia
              战略联盟扩大。初始阶段集中在塔斯马尼亚 Launceston 园区——由该岛州水电电网供电——目标 90 MW AI 算力（Stage 1a 为 44 MW，Stage 1b 为 90
              MW）。此后项目扩展为全国计划，站点覆盖 Melbourne、Canberra、Sydney 和 Perth，到 2028 年规划总容量达到 1.6 GW。该计划围绕 Nvidia Vera Rubin DSX
              参考设计建设，并与 CDC Data Centres 共同开发；披露总建设成本为 A$73.3 billion。Firmus 发言人在 2025 年 11 月表示，Melbourne 和 Tasmanian
              中心预计分别于 2026 年 4 月和 8 月上线，员工将在 2026 年上半年进驻 Canberra 中心。

              公司可被基准验证的资质包括 MLPerf V4.0 Certified Training and Power 结果，以及 2025 年 Cleantech Group APAC Top 25 奖。但 Firmus
              最突出的效率主张——Power Usage Effectiveness（PUE）为 1.03——已引来实质性专家怀疑。Firmus 发言人确认，该数字是 2021
              年塔斯马尼亚一次浸没式部署的「点测量」，无法独立验证，因为不存在公认的 PUE 认证机构。UNSW 高级研究员 Dr Amr Omar 称 1.03 的
              PUE「已经达到当今全球任何地方可能实现水平的极端边缘」，并指出全球超大规模云厂商通常约为 1.2。Sam Maher（GovTech
              Australia）担心，一些投资者被叙事带动，而不是被底层基础设施逻辑说服。Roger Montgomery Investment Management 还提出额外担忧：Firmus 依赖 Nvidia（估计
              Nvidia 股权投资为数千万，撬动 A$830 million 其他股权和 US$10 billion 债务，其中相当部分会以硬件收入回流 Nvidia），且没有公开披露长期有约束力的客户合同。

              监管侧：2026 年 3 月，Firmus 签署一项涉及 18,400 块 Nvidia GB300 GPU 的 Melbourne AI Factory 数十亿美元协议；2025 年 7
              月，塔斯马尼亚政府设立全球首个 AI Factory Zone；2025 年 7 月，Firmus 与 Singapore Port Authority 签署关于海水冷却 AI 算力的 MoU。
