      - number: '8.2'
        title: 融资背景、入场纪律与估值立场
        blocks:
          - type: paragraph
            body: >-
              Firmus 六个月内的私募估值轨迹，是澳大利亚初创公司中记录最陡峭的之一：从 USD $1.9 billion（2025 年 9 月，Nvidia 牵头的 AUD $330 million 轮）到 USD $6
              billion（2025 年 11 月，AUD $500 million 轮），再到投后 USD $5.5 billion（2026 年 4 月，Coatue 牵头、Nvidia 参与的最后一轮 IPO 前
              USD $505 million 融资）。2026 年 4 月这一轮从 USD $6 billion 到投后 USD $5.5 billion 的表面降估值，反映的是汇率变动和交易结构，而不是平轮：按 AUD
              计为 AUD $7.95 billion，略高于 2025 年 11 月隐含的 AUD $8 billion 标记。Startup Daily 和投资者通信报道称，IPO 目标最低为 AUD $8
              billion，并视簿记需求冲刺 AUD $12 billion——意味着较最后一轮私募估值跃升 50–100%。

              这个融资背景给公开市场投资者提出了明确的入场纪律问题。2025 年 9 月以 AUD $1.9 billion 估值入场的 IPO 前股东，在 2026 年 4 月标记下持有约 300–320% 账面收益；如果
              IPO 估值为 AUD $8–12 billion，账面收益会升至 320–530%。据报道，在无托管结构下，这些持有人——包括创始人、管理层和机构——上市第一天都可以卖出。按 AUD $8 billion
              投前估值募集 AUD $2 billion，意味着新增股份摊薄约 25%，但一级募集资金（进入 Firmus
              资产负债表）与二级出售所得（流向售股股东）的拆分尚未公开披露；如果二级部分很大，资产负债表受益会相应更小。

              Blackstone 的 USD $10 billion 工具由 Milbank（Firmus）、Allens（Blackstone）和 Kirkland & Ellis
              参与设计，是高级担保、项目融资式结构：提款以已执行长期客户合同为条件，并随部署分阶段进行。该工具确实释放信用质量信号——Blackstone
              的机构信贷流程很严格——但也让资本结构在全部提款后，相对于迄今已募集股权的债股比超过 7:1。按 7–9% 的私人基础设施债利率计算，全部提款意味着年度利息 USD $700–900
              million，显著高于任何公开披露的收入水平，并使 GAAP 盈利路径取决于尚未披露的合同定价。CoreWeave 的平行经验很有参考价值：尽管 FY2025 调整后 EBITDA 率约为
              56%，CoreWeave 在扣除债务服务和 GPU 折旧后，仅 2026 年 Q1 就录得 USD $740 million GAAP 净亏损。

              建议为 TRACK。主权 APAC 市场中 AI 基础设施投资的结构性逻辑有证据支撑，也可信。问题在价格。若估值为 AUD $8 billion，且招股书不披露收入，Firmus 等于要求公开市场投资者把
              CoreWeave 等价倍数（8–10x 2026E 收入）套用在一个公开记录中不存在的收入数字上。就现有证据看，入场价格偏高，但概念本身并非没有吸引力；第 5 节列出的尽调问题，精确定义了哪些证据能把
              TRACK 转为 BUY。
