  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与运营模型
        blocks:
          - type: paragraph
            body: >
              Firmus 运营两条相互嵌套的产品线。主产品是 AI Factory——一个模块化、垂直整合的算力园区，以 HyperCube™ 硬件模块为核心。每个 HyperCube 采用液冷高密度配置，容纳 32 个
              NVL72 GPU 机架，专为 AI 训练和推理设计。AI Factory 不是 colocation 服务：每个站点都是垂直工程化资产，算力、冷却、网络和电力基础设施从第一性原理共同设计；关键计算区没有
              retrofit tanks，也不需要 airflow。


              截至 2026 年 6 月，Firmus 在 STT GDC 合作下运营新加坡 AI Factory 站点（约 4,000 块 NVIDIA GPU、99 PFLOP/s，支持 AI Singapore 的
              SEA-LION 项目），并在塔斯马尼亚 Launceston 的 Project Southgate 推进 Phase 1B 部署，目标是 36,800 块 NVIDIA GB300 Grace
              Blackwell GPU。早期边缘产品 Cube300 以 shipping-container 形态提供 300 kW，PUE < 1.05，占地仅为同等风冷容量的十二分之一。


              第二条产品线是 Firmus AI Cloud，这是一个 GPU infrastructure-as-a-service 平台，提供 bare-metal 和 virtual-machine GPU
              实例（H200、H100、A100、L40S）、RDMA 加速 InfiniBand 网络、托管 Slurm 调度以及预配置 CUDA 技术栈（PyTorch、TensorFlow）。AI Cloud 运行在自有
              AI Factory 基础设施上，而非租用第三方数据中心，从而形成垂直整合 GPU 云。Firmus 还运营 Synert，这是一家电网整合子公司，向澳大利亚 National Electricity
              Market 提供 frequency control ancillary services（FCAS），把闲置 UPS 电池容量转化为电网稳定收入，同时将 AI Factory 能源成本降低超过 25%。
