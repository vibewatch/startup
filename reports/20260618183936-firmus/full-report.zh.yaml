      - number: '5.3'
        title: 关键依赖、供应链与连接性
        blocks:
          - type: paragraph
            body: >
              Firmus 的基础设施栈建立在三项底层依赖上，每一项都有实质集中风险。第一，NVIDIA GPU 供应：每个 HyperCube 模块、每个 AI Cloud 实例以及 Project Southgate 所有
              GPU 机架，都只依赖 NVIDIA 硬件。截至 2025 年 Q4，NVIDIA 捕获了 top-5 hyperscaler AI 资本开支约 43.6%，意味着大型 hyperscaler 会与 Firmus
              争夺受限芯片供应。NVIDIA 对 Firmus 的股权投资让激励更一致，但不保证优先于更大的美国客户获得分配。GB300 Blackwell Ultra 的供应链与 TSMC 封装约束，也给 Project
              Southgate 时间表增加交付风险。


              第二，能源供应：Firmus 持有一份三年期 Aurora Energy 零售服务协议，可获得最高 104 MW 的 Hydro Tasmania 可再生电力（2026 年 8 月至 11 月
              ramping）。三个计划中的塔斯马尼亚站点合计约需 400 MW——约为塔斯马尼亚能源需求的 20%——这将使 Firmus 成为该州潜在最大电力用户。政治审视已经加剧：Boyer Paper Mill 追加
              45 MW Hydro 电力的请求被拒，而 Firmus 获得 104 MW 分配；Greens 议员也呼吁专门监管。塔斯马尼亚寒冷气候和水电可靠性是 Firmus 效率说法的核心，短期内该地点不可替代。


              第三，数据连接：塔斯马尼亚隔 Bass Strait 的地理隔离是战略瓶颈。Firmus 2026 年 6 月与 SUBCO 宣布 Bernacchi-1 海底光缆，将通过接入 SUBCO 的 400 Tbps
              SMAP 系统并配置双大陆路径，向塔斯马尼亚提供超过 60 Tbps——超过现有所有 Bass Strait 光缆总和。商业运营目标是 2027 年 Q2；在此之前，Project Southgate 依靠
              legacy fiber capacity 运行。全国层面，Project Southgate 目标到 2028 年在澳大利亚五座城市达到 1.6 GW，宣布建设成本为 A$73.3 billion。
