  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对承销判断的影响
      - 精确尽调路径
    rows:
      - - 收入（总额、按产品线、按地区）
        - 没有披露数字，就无法判断收入规模、增长率或质量；投资逻辑只能完全压在已签合同和销售管线数据上
        - IPO 招股书（提交 ASIC）可得后从中索取；也可在尽调中要求提供管理账
      - - 按收入流拆分的毛利率
        - 没有利润率数据，就无法判断合同收入是否覆盖能源、人力和偿债等运营成本
        - 审阅 IPO 招股书财务报表；以 CoreWeave（调整后 EBITDA 56%）和 Oracle AI 基础设施利润率作参照
      - - 现金消耗和现金续航
        - 不清楚月度现金消耗，就无法评估近期偿付能力或 IPO 时间压力
        - 索取最新管理层现金流量表和 12 个月现金预测；再用员工人数和设施运营成本交叉核对
      - - 超大规模云合同定价机制和取消条款
        - $10 billion 债务额度以已签客户合同为条件；如果合同可取消或重新定价，债务结构就会松脱
        - 尽调中索取匿名化合同条款清单；审阅 IPO 招股书重大合同披露；评估最低承诺下限和终止权
      - - GPU 折旧计划和利用率目标
        - AI 工厂的股权经济性关键取决于 GPU 按多快速度相对合同收入折旧、利用率跑到什么水平；两项都未披露
        - 向管理层索取资本开支计划、GPU 折旧年限假设和目标利用率；对照 CoreWeave 公开的资产层面披露
    notes: >-
      五项都是真正属于 IPO 前公司的私有指标。严重程度一律为重大且会阻断判断，因为它们合在一起，才构成对 Firmus 模型做基础财务承销判断所需的输入。预计在 2026 年 6/7 月上市前提交 ASIC 的 IPO
      招股书，应能回应大部分缺口。
    claimRefs:
      - CI025
      - CI026
      - CI027
      - CI028
      - CI029
