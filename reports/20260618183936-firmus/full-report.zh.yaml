  - id: FV001
    title: 推荐逻辑：从证据到 TRACK
    type: flow
    layout: wide
    summary: 决策链把四个结构性投资论点支柱与其关键不确定性连接到 TRACK 建议，并展示哪些问题清除后才可能转为 BUY。
    data:
      nodes:
        - id: structural-demand
          label: 结构性 AI 基础设施需求
          detail: 2026 年全球超大规模云 AI 资本开支为 $660–690B；Firmus 已有两份确认的数十亿美元合同；Blackstone $10B 融资额度以已签合同为条件。需求信号真实存在，并得到机构验证。
        - id: contract-evidence
          label: 已签约收入证据
          detail: Project Southgate 有两份确认的超大规模合同。客户身份、定价、最低购买量和取消条款均未公开披露。收入底线由公司声称，招股书发布前无法独立验证。
        - id: leverage-risk
          label: 极端资本杠杆
          detail: >-
            $10B Blackstone 债务按 7–9% 年利率计算，全部提款后年利息为 $700–900M。GPU 折旧（4–5 年寿命）进一步增加非现金拖累。全部提款后债务 / 股权 >7:1。CoreWeave
            尽管调整后 EBITDA 利润率为 56%，GAAP 净亏损仍达 $740M/quarter。
        - id: governance-risk
          label: 治理与结构风险
          detail: >-
            Oliver Curtis 有内幕交易定罪（2026 年 3 月获 ASX 放行）；早期投资者 IPO 无锁定期（账面收益 300–530%）；PUE 声明被撤回，改为未经验证的 2021 年单点测量；NEXTDC
            CEO 质疑建设成本声明。
        - id: missing-evidence
          label: 关键缺失证据
          detail: 尚未提交招股书；未披露收入或利润率；两名客户身份均未披露；没有独立效率审计。若 IPO 估值为 AUD $8–12B，就是要求投资者凭信念定价。
        - id: recommendation
          label: 等待招股书后跟踪
          detail: 只有招股书披露 AUD $800M+ 已签约收入、客户身份、≥90 天锁定安排，且 IPO 入场估值 ≤ AUD $8B，才转为买入。若招股书没有锁定安排、也没有收入披露，则回避。
      edges:
        - source: structural-demand
          target: contract-evidence
          label: 由……验证
        - source: contract-evidence
          target: leverage-risk
          label: 由……融资支持
        - source: leverage-risk
          target: governance-risk
          label: 放大
        - source: governance-risk
          target: missing-evidence
          label: 造成
        - source: missing-evidence
          target: recommendation
          label: 带来
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV013
      - CV027
  - id: FV002
    title: 估值敏感性：按收入倍数和情景收入推算的 Firmus EV（AUD B）
    type: bar
    layout: wide
    summary: 按四档 EV / 收入倍数和三组收入情景测算 Firmus 企业价值，显示在 CoreWeave 可比倍数下，AUD $8–12B 的 IPO 目标隐含 AUD $800M–$1.5B 收入。
    data:
      items:
        - label: 4x 收入 / AUD $400M 收入 → $1.6B EV
          value: 1.6
        - label: 6x 收入 / AUD $400M 收入 → $2.4B EV
          value: 2.4
        - label: 8x 收入 / AUD $400M 收入 → $3.2B EV
          value: 3.2
        - label: 10x 收入 / AUD $400M 收入 → $4.0B EV
          value: 4
        - label: 6x 收入 / AUD $800M 收入 → $4.8B EV
          value: 4.8
        - label: 8x 收入 / AUD $800M 收入 → $6.4B EV
          value: 6.4
        - label: 10x 收入 / AUD $800M 收入 → $8.0B EV（IPO 底线）
          value: 8
        - label: 8x 收入 / AUD $1.2B 收入 → $9.6B EV
          value: 9.6
        - label: 10x 收入 / AUD $1.2B 收入 → $12.0B EV（IPO 上限）
          value: 12
        - label: 12x 收入 / AUD $1.5B 收入 → $18.0B EV（牛市）
          value: 18
    approximationNotes: >-
      所有数字仅作示意，由作者测算，并以 AUD 十亿计。收入情景（$400M、$800M、$1.2B、$1.5B）覆盖 18,400–55,000 块 GB300 GPU 在典型 neocloud GPU
      小时费率下可对应的区间。EV / 收入倍数以 CoreWeave（2026E 8–10x）和 Lambda Labs（约 12x）为基准。Firmus 尚未披露任何收入数字。
    claimRefs:
      - CV007
      - CV008
      - CV028
  - id: FV003
    title: 估值 / 回报区间：Firmus 与可比公司的退出价值（低 / 基准 / 高）
    type: range
    layout: wide
    summary: 对 Firmus IPO 和 2028 年退出给出低、基准、高三档估值，并列示可比公司参照点，说明收入披露和市场条件不同会把结果推向多大区间。
