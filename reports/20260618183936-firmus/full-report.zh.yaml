  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与买方原型
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Firmus 服务五个清晰客户分部，采购结构、交易规模和采用阶段差异很大。第一也是商业上占主导的分部，是全球 hyperscale 云和 AI
              公司，它们以数十亿美元规模采购多年、take-or-pay 的 AI factory 容量。这些买方的动机来自本土市场的供给侧约束，也来自主权或 ESG 要求推动的本国可再生能源算力需求。截至 2026 年 6
              月，Firmus 已公开披露 Project Southgate 下两份已签 hyperscale 合同，均来自未具名的 “leading global technology companies”；该分部是
              Blackstone 债务额度的锚点，而该额度以与 hyperscaler 和蓝筹 AI 客户签署长期客户合同为条件。

              第二个分部是政府和公共部门研究机构，代表是 AI Singapore（AISG），这是由 Singapore National Research Foundation 支持的国家 AI 计划。AISG 是迄今
              Firmus 唯一公开具名的重要客户，自 2023 年以来使用 Sustainable Metal Cloud（SMC）平台进行生产级 LLM
              训练。第三个分部是受监管企业——银行、保险公司、电信运营商和能源公司，它们寻求具备数据驻留保证的主权 AI 算力——Firmus 通过 Firmus AI Cloud
              向其营销，但在澳大利亚尚未披露具名生产客户。第四个分部是可通过 Firmus AI Cloud 按需平台和 NVIDIA DGX Cloud Lepton marketplace 触达的 AI-native
              初创公司和 scaleups。第五个分部是学术和研究机构，包括 Project Southgate 材料中明确点名的教育部门用户；除 AISG 外，尚未宣布具体部署。

              这个组合反映了 Firmus 当前阶段：hyperscale 锚定合同主导已承诺收入，而企业、政府和初创分部在澳大利亚仍停留在愿景或 pilot-stage。主权 AI
              定位是有意为之的差异化，瞄准公共部门和受监管工作负载的本国部署；数据驻留要求和政府指令形成结构性需求，离岸 hyperscaler 云无法满足。该分层策略与 Project Southgate
              的全国雄心匹配，但短期内带来重大集中风险，也引发目标 ASX IPO 前多元化速度的问题。
