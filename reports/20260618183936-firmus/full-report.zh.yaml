      - number: '6.2'
        title: 具名客户证据——部署、结果与证据质量
        blocks:
          - type: paragraph
            body: >
              相比融资规模，Firmus 的具名客户记录偏薄；但 AI Singapore 合作深度，为其运营能力提供了真实参照点。AI Singapore（AISG）是由 Singapore National
              Research Foundation 支持的国家 AI 计划，它使用托管在 STT GDC 新加坡设施中的 Sustainable Metal Cloud（SMC）平台，开发
              SEA-LION，即首个面向东南亚语言的开源大语言模型套件。AISG 合作是 Firmus 记录最完整的客户关系：256 块 Nvidia H200 GPU 部署在 32 个节点；团队实现每设备每秒 317
              GB/s NCCL 带宽和 387 TFLOP；完成超过 200 次实验；一个 27-billion-parameter 模型在 10 天内完成训练；监督微调 runs 在 4 小时内完成；checkpoint
              evaluations 使用 2 个节点在 1.5 小时内完成。Firmus 与 AISG 于 2025 年 3 月通过 Memorandum of Understanding
              正式化合作。这是一个生产部署，且结果被量化并公开确认。

              相比之下，两份 Project Southgate hyperscale 合同都来自匿名 “leading global technology companies”，客户自身没有公开披露。第二份合同于 2026
              年 3 月 2 日宣布，覆盖 Melbourne facility 约 18,400 块 Nvidia GB300 GPU，是多年、数十亿美元级承诺。第一份合同覆盖 Tasmania campus 约
              36,800 块 Nvidia GB300 GPU。两者客户身份都不在公开记录中。行业观察者猜测交易对手可能是 Microsoft、Google、Meta 或某个大型亚洲
              hyperscaler，但没有确认。这种不透明阻止了对信用质量、合同条款、取消条款和客户集中风险的独立验证。

              NVIDIA 的 DGX Cloud 平台正在 Southgate Melbourne 建立专用 region，使 Firmus 成为 NVIDIA Cloud Partners 生态成员，与
              CoreWeave、Crusoe、Lambda 和 SoftBank 一同进入 DGX Cloud Lepton marketplace。这代表分发渠道和平台伙伴关系，而非单独产生收入的客户关系；但它验证了
              Firmus 在 NVIDIA 全球生态中的地位，并提供了触达亚太开发者的路径。STT GDC Sustainable Metal Cloud 合作始于 2023 年 6 月，当时 Temasek 支持的 STT
              GDC 对其与 Firmus 的全球合资项目进行重大投资；这是最早进入生产阶段的部署，已在 STT GDC 新加坡地点上线。新加坡站点为 AISG 及其他企业和政府客户实现 99 PFLOP/s 总算力。
