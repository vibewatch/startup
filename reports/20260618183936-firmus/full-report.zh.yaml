      - number: '5.2'
        title: 技术架构与软件栈
        blocks:
          - type: paragraph
            body: >
              核心计算层建立在 NVIDIA GPU 硬件上：当前云部署使用 H200 SXM（每节点 8 × 141 GB HBM3e，NVLink 4.0 + NVSwitch 3.0，每 GPU 双向 900
              GB/s）；Project Southgate 规模化阶段计划采用 NVIDIA GB300 Blackwell Ultra（288 GB HBM3e，最高 8 TB/s 带宽，每 NVL72 机架 TDP
              >120 kW）。节点间网络使用每节点 200–800 Gb/s 双 InfiniBand，支持 RDMA 和 RoCE v2，使多节点 GPU 集群能够进行低延迟分布式训练。


              冷却采用 direct-to-chip liquid cooling（CDU 供液冷板），关键计算区没有 airflow。公司称生产部署 PUE 约 1.1（工程原则页面和 MLPerf
              提交中引用），同时单独营销 1.03 的 headline figure；两项数据都没有发布独立第三方年度审计。经 MLCommons 审阅的 MLPerf Training V4.0 提交显示，在
              immersion-rack 层面，相比 H100 SXM 风冷系统，电力效率约高 30%；但 data-centre-level PUE 不在该轮范围内。


              编排层是 FactoryOS™，Firmus 自研的全栈基础设施智能平台，把冷却、供电、热遥测和 GPU 性能作为单一系统治理。数据层是 VAST Data AI OS，2026 年 2
              月被选中，用于提供统一高吞吐 NVMe 存储，并与 NVIDIA Cloud Partner（NCP）参考设计对齐；WEKA NVMe PFS 保留用于 AI Storage，提供 RDMA
              加速并行文件访问。Model-to-Grid 平台把 FactoryOS 编排延伸到对澳大利亚电网价格和稳定性信号的实时响应，协调 AI 工作负载与 AEMO 及 National Electricity
              Market。Firmus 与 NVIDIA 基于 DSX Blueprint 合作建设这一能力，并已在 Project Southgate 初始部署。
