      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Firmus 2024 年以前的股权历史没有公开披露。可识别的最早外部投资约为 Regal Funds Management（Phil King）的 A$10 million，据理解为约 2021
              年投入的可转债，当时公司仍主要经营比特币挖矿冷却业务。2023 年 6 月与 ST Telemedia Global Data Centres（STT GDC——由新加坡主权财富基金 Temasek
              Holdings 持有）的合作，为 Firmus 的新加坡 AI Factory 部署奠定运营基础；安排中，Firmus 持有并运营两个 STT 数据中心站点内的 IT 网络和算力，约 4,000 块
              Nvidia GPU，而 STT 保留实体设施所有权。The Witness 将 2023 年一笔 US$100 million 战略投资归因于 STT GDC；该数字没有在一手来源中独立确认，标记为未验证。

              2025 年 9 月至 2026 年 4 月的三轮股权融资和一笔债务额度，把 Firmus 推成澳大利亚历史上资本最充足的私营科技公司之一：

              — 2025 年 9 月 16 日（SVIIC 口径为 Series B / Caplight 口径为 Private Placement）：A$330 million，投后估值 A$1.85
              billion。基石投资来自 Ellerston Capital（投资总监 David Leslie 加入董事会）；Nvidia 战略参投。既有投资者 Regal Funds
              Management、Archibald Capital 和 Tectonic Investment Management 参与。Alex Waislitz 与 Pratt 家族（Heloise Pratt/
              Visy）也是股东。据理解，Ellerston Capital 持股接近 7%。

              — 2025 年 11 月 14 日：A$500 million，投后估值约 A$6 billion——八周内接近三倍抬升。Morgans 担任独家牵头经办人；Highbury Partnership
              担任财务顾问。包括 UniSuper 和 Wilson Asset Management 在内的新增机构投资者，与既有支持方共同参与。

              — 2026 年 2 月：Maas Group Holdings（ASX: MGH）按 A$6 billion 估值投资 A$100 million，取得约 1.7% 股权。Maas 子公司 JLE 将成为
              Firmus AI Factory 推广的主权供应链一部分。

              — 2026 年 2 月 9 日（债务）：US$10 billion 债务融资额度，由 Blackstone Tactical Opportunities 和 Blackstone Credit &
              Insurance 牵头，Coatue 支持。Firmus 称其为澳大利亚史上规模最大的私营债务融资之一；结构为长期基础设施债。

              — 2026 年 4 月 6 日（Strategic / Series F）：US$505 million，投后估值 US$5.5 billion，由 Coatue Management 领投（普通合伙人
              Robert Yin 被引用），Nvidia 继续参与。公告时仍受若干交割条件约束。截至 2026 年 4 月，这六个月内累计股权融资约 US$1.35 billion。

              冲突说明：Firmus 公布 2025 年 11 月融资时采用 A$6 billion 估值（澳元），而 2026 年 4 月公告引用的是 US$5.5 billion 投后估值；差异大体可由 USD/AUD
              汇率解释，但媒体报道中有些将公司估值写成「US$6 billion」，造成表层不一致。

              截至本章生成日，Firmus 计划在 2026 年 6 月或 7 月冲刺 ASX IPO。报道称，本次上市拟募资 A$2–3 billion 新资本，IPO 顾问包括 Bank of
              America、JPMorgan、Morgans Financial 和 Morgan Stanley。公司已于 2026 年 4 月面向潜在投资者举行非交易路演。据报道，发给潜在股东的投资者信函显示
              IPO「有望在 6 月或 7 月推进」，定价预期比当时估值高 40–100%，对应区间 A$8–12 billion。据称 James Packer 与 Nvidia 一同按约 A$145 每股买入约 A$50
              million 股票。报道称，上市时不会对 IPO 前股东设置禁售期；独立基金经理已将这一点标记为重大结构性治理顾虑。
