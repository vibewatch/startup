chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与起源
        blocks:
          - type: paragraph
            body: >
              Firmus Technologies 设计、建设并运营其所谓 AI Factories：一种模块化、液冷、高密度算力平台，专为 AI
              训练和推理负载打造。公司运营总部在新加坡，主要注册实体在澳大利亚：Firmus Grid Pty Ltd（2019 年 12 月注册）和 Firmus Technologies Pty Ltd（2021 年 11
              月注册）。tracxn 文件中，这家初创公司的当前注册地址位于新南威尔士州 Saint
              Leonards；另一篇文章称其「创立于悉尼」，早期报道则把创始运营地点指向塔斯马尼亚——本章将这一冲突保留为未解决的地理细节。

              公司由 Oliver Curtis、Tim Rosenfield 和 Jonathan Levee 于 2019 年共同创立。三位创始人此前都没有数据中心或工程背景：Rosenfield 曾任内衣公司
              Simone Perele CEO；Levee 在资源行业有中层管理经历；Curtis
              出狱后从投资银行家转为加密货币投资者。最初业务是为比特币挖矿设备开发液冷技术，借助塔斯马尼亚凉爽气候和水电资源降低运营成本。Nick Curtis（Oliver
              的父亲、前矿业高管）担任首任董事会主席。比特币价格下跌后，Telstra 前高管 Ted Pretty 接替 Nick Curtis 出任主席，并帮助公司转向 AI 数据中心应用。Ted Pretty
              随后离任，2025 年末公司任命 Grant Dempsey 为候任董事会主席。

              Firmus 将其 AI Factory 描述为「一种模块化、垂直化系统，在技术栈每一层优化成本和电力」，核心包括 Firmus Hypercubes（多 petascale 模块化算力抽象）、Synert（与
              Eaton 在塔斯马尼亚部署的电网集成软件）和直达芯片液冷。公司还运营 Firmus AI Cloud——一个 GPU 驱动的 neocloud（H200、L40S 和 GB300 Blackwell
              实例）——因此商业模式同时包括资本密集型基础设施持有和云服务收入。其旗舰外部项目是 Project Southgate：与 CDC Data Centres 和 Nvidia 合作，在澳大利亚建设全国 AI
              工厂网络，目标到 2028 年提供 1.6 GW AI 算力。
