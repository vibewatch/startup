        - 两份已确认的超大规模云合同；Blackstone $10B 融资安排；Nvidia 背书——但没有招股说明书、未披露收入、没有托管。
        - 没有招股说明书，不应参与 IPO 投资。待收入、客户身份和锁定结构确认后再重新评估。
      - - 信心
        - 中
        - 结构性逻辑证据充分；但缺少收入和招股说明书数据，限制了具体价格 / 回报判断。
        - 若招股说明书披露 AUD $800M+ 收入，且估值 ≤ AUD $8B，信心上调至高。
      - - 风险评级
        - 高
        - 无托管；治理悬置问题（Curtis 定罪，已获放行）；效率主张未经验证；杠杆极高；平台尚无收入。
        - 若 IPO 仍无托管，且估值超过 AUD $10B 但没有收入证明，风险降至关键级别。
      - - 估值立场
        - 偏高
        - AUD $8–12B IPO 目标对比 CoreWeave 8–10x 收入倍数，意味着需要 AUD $800M–$1.5B 收入；招股说明书前没有证据支持。
        - 若招股说明书披露合同收入，且费率与 CoreWeave 一致，AUD $6–8B 估值可视为合理。
      - - 投资逻辑中断周期
        - 12–18 个月
        - 乐观情景取决于 GB300 部署在 2026 年 H2 上线，并且合同收入在 2027 年财务数据中兑现。
        - 监测 IPO 后前两次 ASX 业绩发布；将收入爬坡与 AUD $600M–$1.2B 基准情景第一年目标对比。
    notes: 评估截至 2026 年 6 月 18 日，即招股说明书提交前。所有定性判断均由作者基于公开证据得出。估值数字均不基于未披露财务数据。
