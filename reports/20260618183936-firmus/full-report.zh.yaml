  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析
    columns:
      - 情景
      - 关键假设
      - 估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - >-
          2026 年 H2 以 AUD $10–12B 估值 IPO；合同身份在招股说明书中披露；2026 年 H2 有 200MW+ 上线；2027–2028 年收入达到 AUD $1.5–3B；AI
          需求仍受供给约束；Blackstone 提款顺利推进。
        - >-
          AUD $1.5–3B 的远期收入按 10–15x 计算，意味着 2028–2029 年 EV 为 AUD $15–20B；IPO 投资者以 AUD $10B 入场可获得 50–100% 回报。CoreWeave
          $99.4B 积压订单作为结构性可比，验证需求轨迹。
        - 需要五个条件同时成立：IPO 定价在区间高端、客户披露、运营爬坡、债务提款、需求持续——复合概率低。
        - 低到中等。单项条件各自有中到高概率，但联合概率更低；AI 效率提升或 GPU 供应正常化是主要下行催化剂。
      - - 基准
        - 2026 年 H2 以 AUD $7–9B 估值 IPO；合同部分披露；到 2027 年底收入爬升至 AUD $600M–$1.2B；增长正常化后倍数压缩至 6–8x；偿债吃掉大量自由现金流。
        - >-
          AUD $600M–$1.2B 收入按 6–8x 计算，意味着 2027 年 EV 为 AUD $3.6–9.6B；IPO 投资者以 AUD $8B 入场，回报持平到小幅正收益。全额提款后利息费用（估计
          $700–900M/年）吸收现金流，净回报被压缩。
        - 市场成熟后倍数压缩；治理悬置问题延续；客户披露延迟；GPU 部署慢于计划。
        - 以现有证据看，这是最可能情景；也符合资本密集、IPO 时尚无收入的基础设施运营商市场先例。
      - - 悲观
        - IPO 延迟至 2027 年 Q1+，或定价低于 AUD $6B；主要合同取消或重谈；AI 需求走弱；建设成本效率主张被证实夸大；尚无收入时偿债已不可持续。
        - >-
          AUD $300–$600M 实际收入按压缩后的 3–5x 收入倍数计算，EV 为 AUD $1.5–3B，较 AUD $8B IPO 入场估值回撤 62–81%。Blackstone
          融资安排可能承受契约压力。下轮估值下调风险实质存在。
        - 无托管造成首日抛压；治理事件可能触发机构抵制；GPU 过剩事件；监管干预塔斯马尼亚水电分配。
        - 中等概率；任何单一触发因素（无托管暴跌、合同取消、AI 需求走弱）本身都合理可能。尚无收入 + 极高杠杆 + 无托管共同造成复合下行凸性。
    notes: >-
      所有情景估值均为作者基于可比分析（CoreWeave、Lambda、NEXTDC、AI 数据中心 M&A 先例）和已披露资本结构得出的示意区间。它们不是财务建议，也不反映任何招股说明书指引；截至 2026 年 6 月 18
      日，招股说明书尚未发布。
