      - number: '5.4'
        title: 差异化、信任与合规
        blocks:
          - type: paragraph
            body: >
              Firmus 的技术差异化建立在三根支柱上：分层专利组合、独立基准测试表现，以及云安全认证。IP 方面，专利律师事务所 FB Rice 确认，Firmus
              在澳大利亚、美国及其他司法辖区持有已授权专利，覆盖核心液冷系统、电网稳定软件，以及管道设计、温控和 HyperCube 软件中的具体创新。分案申请形成分层 “patent
              thicket”，保护基础技术和渐进改进，在授权许可中提供杠杆，并阻止直接复制。


              性能基准方面，Firmus 向 MLPerf Training V4.0 提交了数据，电力测量在 immersion-rack 层面并经 MLCommons 审阅，显示相较 H100 SXM
              风冷等价系统，能效约高 30%。公司称端到端设施 PUE 估计约 1.1，并指出 data-centre-level PUE 不在该轮 MLCommons 范围内。尚无 Uptime Institute
              或同等第三方年度审计发布。数据中心专家指出，持续低于 1.05 的年度 PUE 在技术上非常罕见，通常只在最佳条件下的单站点测得。


              Firmus AI Cloud 服务声称具备 ISO 27001 和 SOC-2 合规，并提供传输中和静态加密。公司没有发布公开证书注册链接；覆盖范围是 AI Factory
              物理基础设施还是仅限云服务并不清楚。AEMO 的一项 FCAS 认证覆盖 Synert 在现有生产站点参与电网。还存在名称空间风险：Firmus Pte
              Ltd（firmussec.com）是另一家新加坡网络安全公司，持有 CREST 认证——尽调必须确认哪一个实体持有哪些合规凭证。
