      - number: '5.5'
        title: 产品风险与技术风险登记
        blocks:
          - type: paragraph
            body: >
              五项重大产品和技术风险需要明确尽调。第一，NVIDIA 集中：每个 AI Factory 模块和 AI Cloud 实例都是单一供应商 GPU 环境。如果 NVIDIA 将供应重新分配给更大的美国
              hyperscaler、延迟 GB300 交付，或修改合作伙伴计划条款，Firmus 的扩张时间表和单位经济性都会被直接影响。NVIDIA 股权投资把 Firmus 的资本部署绑定到 NVIDIA
              自身产品路线图周期。


              第二，未经验证的 PUE 效率说法：Firmus 在部分材料中营销 1.03 PUE，而工程页面和 MLPerf 提交引用约 1.1。采用先进冷却的 hyperscale 运营商通常年度报告
              1.1–1.15。没有独立年度审计，投资者或客户无法验证其相对竞争者的效率优势幅度。


              第三，浸没冷却运营复杂度：direct-to-chip 冷板冷却已经成熟，但吉瓦级全浸没需要专门的介电液管理、泄漏检测、泵维护，以及熟悉浸没系统的劳动力。塔斯马尼亚可用且具备该规模经验的技术人员池有限。


              第四，能源供应监管风险：Aurora Energy 合同是一份三年期 RSA。Firmus 在三个塔斯马尼亚站点部署 400 MW 的计划面临日益增强的政治反对，议员也在积极提出州级 AI 数据中心能源监管。


              第五，建设与执行风险：A$73.3 billion 全国建设在澳大利亚没有先例；五个司法辖区同时多城市建设、供应链依赖和监管审批，会叠加执行风险。
