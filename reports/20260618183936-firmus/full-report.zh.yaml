  - id: FV004
    title: 投资 KPI 记分卡：八个维度的投委会就绪度评估
    type: kpi
    layout: standard
    summary: 按八个投委会维度结构化打分；加权结果支持继续跟踪，并明确了招股书发布后上调至买入的条件。
    data:
      items:
        - label: 市场机会
          value: Strong
          note: APAC 主权 AI 基础设施；2026 年 hyperscaler 资本开支 $660–690B；两份已签合同和 Blackstone 融资安排验证了结构性需求。
        - label: 合同与收入证明
          value: Partial
          note: 已签两份 hyperscale 合同；客户身份和财务条款未披露；招股书发布前，收入无法用公开材料验证。
        - label: 技术护城河
          value: Disputed
          note: PUE 1.03 已退回为未经验证的 2021 年单点测量；UNSW 专家称其处在「全球可能性的极端边缘」；NEXTDC CEO 质疑其建设成本说法。
        - label: 财务透明度
          value: Weak
          note: 公司未披露收入、利润率或烧钱速度；截至 2026 年 6 月 18 日尚未提交招股书；投资者看不到 GAAP 财务报表。
        - label: 资本结构风险
          value: High
          note: $10B Blackstone 债务按 7–9% 利率、全额提款计算，每年利息 $700–900M；债务 / 股权 >7:1；CoreWeave 的 GAAP 亏损展示了这种结构性模式。
        - label: IPO 结构完整性
          value: Red Flag
          note: 早期投资者没有托管或锁定安排；账面收益达 300–530%；精品 VC 基金对 Firmus 的集中度 >60%；存在机构抛售风险。
        - label: 治理质量
          value: Mixed
          note: ASX 已在 2026 年 3 月清除 Curtis 内幕交易定罪障碍；董事会已补强；仍是 co-CEO / 表亲结构；Temasek、Blackstone、Coatue 背书提升机构质量。
        - label: 估值支撑
          value: Insufficient Pre-Prospectus
          note: 按 CoreWeave 倍数，AUD $8–12B 隐含 $800M–$1.5B 收入；公开证据尚未证明这一水平；若招股书披露支撑材料，AUD $6–8B 估值更容易说得通。
        - label: 退出路径清晰度
          value: Advanced / Opaque
          note: ASX 流程已推进（簿记管理人、路演、ASX 放行）；但招股书尚未提交；一级发行和老股出售拆分未披露。
        - label: 可比公司表现信号
          value: Positive (CoreWeave)
          note: CoreWeave 2026 年 Q1 收入 $2.08B（同比 +112%）、积压订单 $99.4B，验证 AI 基础设施需求的结构性论点——Firmus 需要证明自己也能跑出类似轨迹。
    claimRefs:
      - CV001
      - CV005
      - CV009
      - CV019
      - CV025
      - CV027
