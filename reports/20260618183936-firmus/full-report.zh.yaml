      - number: '6.3'
        title: 采用轨迹、GPU 承诺与平台触达
        blocks:
          - type: paragraph
            body: >
              衡量 Firmus 采用轨迹，最好看已承诺 GPU-equivalents，而不是已披露客户数或收入。两份 Project Southgate hyperscale 合同合计承诺约 55,200 块 Nvidia
              GB300 GPU，分布在塔斯马尼亚和墨尔本，隐含数十亿美元资本承诺，并预计在投运后产生合同化多年收入。新加坡 SMC 部署为 AISG 及其他企业客户，在两个 STT GDC 站点运行约 4,000 块
              Nvidia GPU，生产中提供 99 PFLOP/s 总算力。AI Cloud 公共平台已上线 H200、H100、L40S、A100 和 A40 GPU 实例；但截至 2026 年 6 月，Firmus
              没有公开披露活跃付费客户数、收入拆分或采用率。

              独立平台验证很强。SemiAnalysis 将 Firmus 的 Sustainable Metal Cloud 评为全球仅有三家正确实现 InfiniBand SHARP in-network
              reduction 的 GPU 提供商之一——在首届 ClusterMAX GPU Cloud Ratings 中，Firmus 与 AWS 并列，并高于 Google Cloud。SemiAnalysis
              2025 年 11 月发布的 ClusterMAX 2.0 方法论，结合 hands-on benchmarking 和超过 140 份客户调研，覆盖被评估的 84 家提供商，跟踪全集为 209 家 GPU
              云运营商。根据 Hedgehog Cloud 对 ClusterMAX 2.0 分层结构的分析，Gold-tier 云（Firmus 目标层级）相较 commodity Bronze 基础设施可获得 70%
              定价溢价，说明 Firmus 性能定位具有收入价值。最近一轮中，只有 CoreWeave 持有 Platinum。

              Firmus 被纳入 NVIDIA DGX Cloud Lepton marketplace——2025 年 6 月 COMPUTEX 宣布——使其成为全球 NVIDIA 开发者社区可访问的 GPU
              来源。Blackstone 债务额度以已签客户合同为提款条件，直接把未来基础设施部署速度与新客户 wins 绑定。Firmus 称公司正在产生收入，但没有公开披露收入数字、毛利率、burn rate 或
              runway。已承诺 GPU 容量管线意味着若合同按结构交付，将产生显著收入；但这取决于建设时间表、客户履约义务和债务提款排序。
