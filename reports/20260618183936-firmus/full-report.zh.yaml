      - number: '7.3'
        title: 财务、资本与伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              Blackstone 牵头的 US$10 billion 债务工具，是这里最核心的财务风险。该工具按高级担保基础设施债设计，只有在与超大规模云厂商和蓝筹 AI
              客户签下长期客户合同时才可提款。设计上，它限制了投机性部署，但也引入了顺序风险：合同谈判一旦停滞，公司就拿不到提款，资本计划也会卡住。建设里程碑延误、锚定合同未能续约或留存、交易对手信用质量大幅恶化，都可能触发契约违约和贷款人权利——包括要求立即部分还款，或限制继续提款。Nomura
              据称很难把一笔已出资的 Firmus $120M 四年期私人信贷工具卖下去，说明至少一家机构级银行市场参与者认为，按当时条款看，这个风险并不划算；放在 $10B 工具的语境下，这是一个重要负面信号。

              截至 2028 年，总资本开支计划为 A$73.3 billion，约为截至 2026 年 4 月累计股权融资额的 55 倍。如此高的杠杆比率意味着，IPO
              募资和持续债务提款不是可选项，而是计划能运转的必要条件。如果 IPO 定价显著低于目标 A$8–12 billion 区间，或簿记遇到困难，公司履行债务合同管线的能力会受损。目标定价本身——比当时私募估值高
              40% 到 100%——就是一次估值跃升，且近期澳大利亚科技 IPO 历史中还没有确认可比案例。

              Nvidia 依赖风险很特殊。Nvidia 既是 Firmus 的主要 GPU 供应商，也是股权投资者。Roger Montgomery 的分析把这种关系称作「共生循环」：Nvidia
              的小额股权投资（未披露，可能低于 A$100 million）撬动了第三方 A$830 million 股权融资和 $10 billion 债务工具，而其中绝大多数又会以硬件收入形式流回 Nvidia。这个安排让
              Nvidia 对 Firmus 的资本配置形成显著间接影响，也把 Firmus 锁进对 Nvidia 芯片交付节奏的「金手铐」依赖。H200、GB300 和即将推出的 Vera Rubin 平台的 GPU
              供应都受全球结构性瓶颈约束，据称芯片交付最长可达十二个月。建设延误期间，债务工具仍会计息。Project Southgate 的两个锚定客户仍未具名，外部无法核验交易对手信用质量和合同可执行性。
