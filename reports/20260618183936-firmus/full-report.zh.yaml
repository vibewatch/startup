            title: 合同支撑的债务结构让资本部署与收入对齐
            body: >-
              Blackstone $10 billion 额度设计为只能针对已签署的 hyperscaler 和蓝筹 AI
              客户长期合同提款。这类似合同能源基础设施使用的项目融资结构，收入覆盖提供真实债务偿付能力。Project Southgate 已宣布的两项数十亿美元级 hyperscale
