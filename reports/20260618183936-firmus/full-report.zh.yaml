      - number: '3.4'
        title: 竞争差异化、转换动态与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Firmus 的差异化论点建立在五项主张之上：（1）澳大利亚主权所有权与 100% 可再生能源；（2）同类最佳 AI Factory 效率（专有 FactoryOS、浸没 / 液冷、NVIDIA NCP
              参考架构）；（3）NVIDIA 同时是股权投资者和锚定 DGX Cloud 客户；（4）take-or-pay 长期合同（平均 4.8 年），总签约价值约 US$8.2
              billion；（5）澳大利亚供应链带来比既有玩家更快交付和更低 capex。

              独立验证还不完整。SemiAnalysis 2025 年 ClusterMAX 评级把 Firmus 的 Sustainable Metal Cloud（SMC）列入全球第一梯队——全球仅三家正确实现
              InfiniBand SHARP in-network reduction 的供应商之一——这是可信的第三方技术背书。但 Firmus 标榜的 1.03 PUE 没有独立审计；一份投资者分析指出，这只是 2021
              年的一次点测量，不是持续运营指标；一名 University of NSW 工程师称该数字处在全球可能性的极限边缘。NVIDIA 锚定关系是真实的，但并非排他：NVIDIA 同样是 CoreWeave 和
              Lambda Labs 的股权投资者与技术伙伴，限制了这层护城河价值。

              GPU 云转换成本低于传统企业软件。客户可以在多个供应商间 multi-home（Firmus AI Cloud 支持混合和多云网络），基于行业标准 Kubernetes、SLURM 和 InfiniBand
              栈的负载也相对可迁移。锁定主要来自合同（take-or-pay 条款），不是技术。因此，Firmus 可持续竞争优势取决于其每 MW 成本结构和能源效率能否在生产规模反复证明——而不只是早期部署中成立。

              Nomura 事件（因潜在投资者担心 GPU 出口管制，一笔面向 Firmus Metal Singapore 的 US$120 million 新加坡信贷额度难以分销）表明，Firmus
              源自新加坡的业务存在地缘政治融资风险，澳大利亚主权叙事无法完全隔离。即将到来的 ASX IPO 还要求 Oliver Curtis——一名因 2007–08 年内幕交易被定罪的联合创始人——通过 ASX
              的「良好声誉与品格」测试；ASX 在 2026 年 2 月正式化该测试的指引更新，被广泛解读为直接针对 Firmus 上市。
