      - number: '4.4'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Firmus 采用双轨 go-to-market 模型。云渠道是直接自助式销售，公开价格页可看到透明 CPU 和存储定价，面向需要按需算力、又不想经历漫长采购周期的 AI
              开发者、研究人员、初创公司和企业团队。企业与主权渠道则依赖关系和合同先行：专用 AI 基础设施容量通过多年协议销售，直接与 hyperscaler、大型企业、教育机构和政府客户谈判。Southgate
              Melbourne 的 DGX Cloud 区域部署引入第三层分发——Nvidia 的托管 AI 平台向 Nvidia 企业客户群转售 Firmus 基础设施访问权，从而模糊了直接销售与平台中介销售之间的边界。

              传统销售效率指标——获客成本、回本周期、净收入留存、按分部划分的平均合同价值——都没有公开披露。最接近的代理指标是 Lennox Capital Partners 2025 年 10 月的分析师评估：该评估用可比
              GPU-cloud 运营商的运营利润倍数作为基准，将近期 150 MW 管线估值为 Firmus 当时估值 10 倍以上的潜在规模。第二个代理指标是已披露合同规模：一个数十亿美元、跨多年、覆盖 18,400 块
              GPU 的企业合同，意味着平均合同价值在数亿美元到低数十亿美元之间，符合 hyperscale AI 基础设施市场特征，但 CAC 被压缩成几乎一次性大单经济，而不是系统化销售漏斗。

              考虑到 Firmus 是澳大利亚本土运营商，主权与企业焦点在战略上说得通：亚太地区需要数据驻留和低碳算力的政府与企业客户，无法轻易用美国 hyperscaler 容量替代。澳大利亚和新加坡双焦点，让 Firmus
              进入该地区两个最活跃的主权 AI 基础设施市场。由于没有披露 CAC 和回本数据，外部无法判断企业销售动作是否资本高效，也无法判断除两份已宣布合同外，管线是否耐久。
            claimRefs:
