  - id: FI001
    title: 收入模型桥——客户活动到 Firmus 收入
    type: flow
    layout: wide
    summary: 企业和云客户如何产生计算需求，再经 GPU 集群和 AI 工厂流入 Firmus 的合同收入。
    data:
      nodes:
        - id: enterprise-customer
          label: 企业 / 超大规模客户
          detail: AI 实验室、全球科技平台、政府机构和企业 AI 团队，需要专用高密度 GPU 算力，以规模化跑训练和推理。
        - id: cloud-customer
          label: 云 / 按需客户
          detail: 开发者、研究人员和创业公司通过 Firmus AI Cloud 平台，按公开标价使用 GPU、CPU 实例和 WEKA NVMe 存储。
        - id: compute-request
          label: AI 计算请求（Token / GPU-Hour）
          detail: 客户工作负载以训练任务、推理作业或长周期 AI 实验提交，消耗以 AI tokens 或 GPU-hours 计量的 GPU 算力。
        - id: gpu-cluster
          label: Nvidia GPU 集群（GB300 / H100 / A100）
          detail: >-
            物理 GPU 集群部署在 Firmus AI Factories 内，并按 Nvidia 的 DSX 参考架构采购。目前确认的部署包括 Melbourne 约 18,400 块 GB300 GPU，以及
            Tasmania 计划部署约 36,800 块 GB300 GPU。
        - id: ai-factory
          label: Firmus AI Factory
          detail: 与 Nvidia 共同设计的模块化液冷数据中心园区，由可再生水电供电。公司声称相较风冷替代方案，交付 AI tokens 的能效最高可提升 60%。
        - id: firmus-revenue
          label: Firmus 收入（合同或云）
          detail: 收入来自多年企业协议下的经常性月度合同付款，或云消费计费；具体确认方法和实际费率未公开披露。
        - id: nvidia-dgx-cloud
          label: Nvidia DGX Cloud（区域合作伙伴渠道）
          detail: Nvidia 的托管 AI 平台在 Southgate Melbourne 设立专用区域，通过 Nvidia 分销渠道把 Nvidia 企业客户导向 Firmus 基础设施。
      edges:
        - from: enterprise-customer
          to: compute-request
          label: 多年专用合同
        - from: cloud-customer
          to: compute-request
          label: 按需 / 预留计费
        - from: nvidia-dgx-cloud
          to: compute-request
          label: 平台撮合需求
        - from: compute-request
          to: gpu-cluster
          label: 工作负载调度
        - from: gpu-cluster
          to: ai-factory
          label: 托管于其中并由其供电
        - from: ai-factory
          to: firmus-revenue
          label: 交付 GPU-hours / AI tokens
    approximationNotes: 收入确认方法（完工百分比 vs 月度交付）和实际每 GPU-hour 定价均未公开。该流程代表从公开公告和定价页面证据推断出的结构模型，不是已披露的财务机制。
    claimRefs:
      - CI001
      - CI035
      - CI039
  - id: FI002
    title: 单位经济性桥——已知输入与关键未知
    type: flow
    layout: wide
    summary: Firmus AI factory 单位经济性的关键成本和收入输入，展示公开已知、按可比公司估算以及仍不可得的信息。
    data:
      nodes:
        - id: gpu-capex
          label: GPU 集群资本开支
          detail: >-
            主导成本输入。Firmus 声称全包成本为 $35–45M/MW，行业基准为 $50–55M/MW。单是电气基础设施（Maas Group JLE 合同）约为 $2M/MW，意味着每 MW
            非电气资本开支才是主要驱动。
        - id: energy-opex
          label: 能源运营支出（水电）
          detail: >-
            签约塔斯马尼亚水电估计为 USD $0.04–$0.06/kWh，属于全球最低的数据中心电力成本之一。100MW 设施在 90% 利用率下每年消耗约 788 GWh，按该费率计算，年能源支出约为
            ~$31M–$47M。
        - id: debt-service
          label: 债务服务（Blackstone $10B）
          detail: $10B Blackstone 债务融资的利息和本金偿还。利率和摊还安排未公开披露；按典型私募基础设施债 7–9% 利率，若全额提款，年利息将在 $700M–$900M。
        - id: gpu-depreciation
          label: GPU 折旧
          detail: Nvidia GB300 GPU 用于 AI 训练工作负载的预期使用寿命约为 4–5 年，之后需要更新周期。$35–45M/MW 的 GPU 资产折旧会形成相当大的非现金费用，把净利润压到标题 EBITDA 以下。
        - id: revenue-unknown
          label: 合同收入（未披露）
          detail: >-
            每 GPU-hour 或每 AI-token 定价属于商业机密。CoreWeave H100 市场费率在 2025–2026 年约为 $2–$4/GPU-hour。一个 18,400 块 GPU 集群按
            $2.50/GPU-hr 和 80% 利用率测算，意味着年化收入约 ~$320M——但 Firmus 的实际签约费率未知。
        - id: net-margin-gap
          label: 净利润率——不可得
          detail: 签约收入与能源 opex、债务服务、折旧和运营开销之和之间的差额，决定股权层面回报。该数字未披露，仅靠公开信息无法计算。
      edges:
        - from: gpu-capex
          to: gpu-depreciation
          label: 资本化并按 GPU 寿命折旧
        - from: energy-opex
          to: net-margin-gap
          label: 压低毛利率
        - from: debt-service
          to: net-margin-gap
          label: EBITDA 以下现金流出
        - from: gpu-depreciation
          to: net-margin-gap
          label: 非现金利润压减
        - from: revenue-unknown
          to: net-margin-gap
          label: 抵消所有成本
    approximationNotes: >-
      所有数字均来自公司主张、行业基准和 CoreWeave 可比数据估算。Firmus 未公开披露专属毛利率、利率、折旧年限或签约收入数据。约 ~$320M 的年化 GPU 集群收入估计仅作示意，基于 CoreWeave 时代的
      H100 市场费率，未必适用于 GB300 合同。
    claimRefs:
      - CI040
      - CI041
      - CI042
