      - number: '6.4'
        title: 留存、合同耐久性与集中风险
        blocks:
          - type: paragraph
            body: >
              Firmus 没有公开披露任何留存指标。Firmus AI Cloud 公共平台或 hyperscale 锚定合同都没有可得的 NRR、GRR、churn rate、cohort analysis 或
              repeat-engagement 数据。合同结构只部分可见：hyperscale 交易被描述为 “multi-year” 和
              “multi-billion-dollar”，与能源和数据中心项目常见的合同化基础设施 take-or-pay 结构一致。Blackstone
              债务额度以已签长期客户合同为提款条件，为贷款人提供结构性保护；但这些合同中的最低收入承诺、取消条款和终止触发条件没有公开披露。VAST Data 被选为 AI Cloud
              数据层时，明确被表述为支持多租户企业和政府工作负载，说明平台架构预期会服务需要隔离环境的受监管行业客户。

              按标准基础设施承销尺度看，客户集中风险很严重。截至 2026 年 6 月，两份匿名 hyperscale 合同很可能代表 Firmus
              已合同化收入管线的绝大部分。如果任一客户延迟部署时间表、终止合同或重新谈判价格，收入影响都会对 Firmus 偿付 Blackstone
              债务的能力产生实质影响。缺少具名客户组合，使投资者无法独立评估交易对手信用质量、战略理由或续约概率。Gilbert and Tobin 指出，该债务额度设计为随新合同 wins 扩大提款，并点名 Meta 和
              OpenAI 是这类基础设施的典型用户——但实际客户没有具名。

              扩张能力被结构性嵌入模型：Project Southgate 的多站点雄心（塔斯马尼亚、墨尔本，之后是悉尼、堪培拉、珀斯、阿德莱德）为到 2028
              年实现地域和客户多元化提供路径。但截至本报告日期，企业和初创分部仍属愿景。塔斯马尼亚政府 2025 年 7 月建立 AI Factory Zone 政策框架，验证了主权 AI
              需求；但政策支持不等于客户合同。Endeavor Asset Management CIO、早期 Firmus 投资者 Hayden Beamish 已于 2023 年 8 月退出，他在 2026 年 5
              月发出负面评价，称 ASX 上市 “will likely be priced too expensively”，且 “the easy money has already been made”，并把转型前的
              Firmus 描述为 “with no legitimate business model” 的 bitcoin miner。供应链伙伴 Benmax 和 Maas Group 正为已承诺 hyperscale
              合同进行工业规模 AI Factory 部件生产，表明 Firmus 运营上正在履行现有客户义务——但两份已披露 hyperscale 合同之外的客户管线仍完全不透明。
