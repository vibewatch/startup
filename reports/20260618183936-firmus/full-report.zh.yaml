      - number: '2.2'
        title: 机会规模：相互矛盾的估算与工作边界
        blocks:
          - type: paragraph
            body: >
              2026 年 AI 基础设施市场规模估算因研究者边界定义不同，出现异常宽的区间。Grand View Research 将 2026 年全球 AI 数据中心市场定为 USD 180.6 billion，并预计到
              2033 年 CAGR 为 23.9%；MarketsandMarkets 使用更宽口径，得出 2025 年 USD 344 billion、2026 年升至 USD 471 billion——差距超过
              2.5x，原因在于指标是否纳入与 AI 负载共同部署的全部硬件和服务，还是只统计专用 AI 算力。Gartner 收窄到主权云 IaaS，预测 2026 年全球为 USD 80 billion——同比增长
              35.6%——其中 Mature Asia/Pacific 增长 87%，达到 USD 1.59 billion。Research and Markets 估计，总主权云市场（所有部署模式）2026 年为 USD
              128.6 billion，并以 23.4% CAGR 增至 2030 年 USD 298 billion。Data Bridge Market Research 采用最窄定义——仅主权 AI
              基础设施硬件和系统——将该细分市场 2025 年估值为 USD 14.82 billion，预测到 2033 年达到 USD 49.67 billion，CAGR 为 16.3%，APAC
              是增长最快区域，CAGR 为 17.8%。澳大利亚方面，整个数据中心市场预计从 2025 年 USD 4.22 billion 增至 2031 年 USD 9.02 billion，CAGR 为
              13.5%。美国前五大 hyperscaler（Microsoft、Amazon、Alphabet、Meta、Oracle）合计承诺 2026 年 capex 为 USD 660–690 billion，几乎较
              2025 年翻倍，四家最大公司均自称受供给约束而非需求约束。capex 暴增形成结构性拉力，使 Firmus 工厂模式具备商业可行性：Firmus 部署的每个 GPU 集群，都可能成为 hyperscaler
              在主要市场无法足够快自建时的溢出容量。衡量 Firmus 自身机会，需要叠加三层镜头：以上述全球市场数据锚定的 TAM；受 APAC 主权 AI 工厂容量约束的 SAM；以及由 Firmus 签约管线和到
              2028 年建设余量推导的 SOM。
