  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正方与反方
        blocks:
          - type: paragraph
            body: >-
              Firmus 的投资逻辑建立在四个结构性支柱上。第一，全球范围内，尤其在澳大利亚，超大规模 AI 算力需求受供给约束，IPO 前就形成了合同收入底线；美国前五大超大规模云厂商承诺的 2026 年资本开支为 USD
              $660–690 billion，几乎是 2025 年水平的两倍，四大厂商都自称受供给约束，而不是需求不足。第二，亚太主权 AI 基础设施具有战略稀缺价值，本土超大规模云厂商难以轻易复制；Firmus
              的可再生能源定位和澳大利亚所有权结构，让它能够触达 AWS、Azure 和 Google 无法进入的主权算力预算。第三，Blackstone 的 USD $10 billion
              高级担保债务工具以与超大规模云厂商签署长期客户合同为条件，提供了项目融资层面的验证，说明收入覆盖故事经过了严格机构信贷流程承销。第四，Nvidia 两轮参股及其在 Southgate Melbourne 部署
              DGX Cloud 区域节点，同时锁定了芯片供应优先级和需求侧分销渠道；在 APAC，还没有其他运营商在这个规模上同时具备两者。

              每个支柱都包含重大未核验假设。合同收入底线依赖两个未具名的超大规模客户，其财务条款、最低承诺和取消条款均未出现在公开记录中。随着 NEXTDC、Macquarie DC 和 CDC Data Centres
              以相似或更强的治理资质建设竞争性主权容量，主权稀缺论每天都在走弱。Blackstone 工具制造了高杠杆资本结构：如果全部提款，按 7–9% 年利率计算，利息支出每年会吃掉 USD $700–900
              million，超过目前任何已披露收入数字。Nvidia 的股权投资据独立分析师估计，两轮合计为 AUD $30–75 million，本质上是供应商融资工具：Nvidia 投入的每一美元，都会通过 GPU
              硬件收入以数倍规模回到其资产负债表，因此它的「背书」在结构上是循环的。

              IPO 前治理图景中，三个负面信号最突出。IPO 对已经实现 300–530% 账面收益的早期投资者不设托管或售股限制，上市首日的即时抛售风险由散户买家承担。Montgomery Investment
              Management 的 Roger Montgomery——本人也持有现有头寸——明确警告，散户 IPO 买家面临为激励充足的内部人提供「退出流动性」的风险。Wilson Asset Management
              也把缺乏锁定限制称作「结构性红旗」。Firmus 的 PUE 效率 1.03 主张，已从当前测量值改口为「2021 年的点测量」，且从未经过独立审计；此前 UNSW 专家 Dr Amr Omar
              称该数字处于「全球可能性的极端边缘」。早期前投资者、Endeavor Asset Management CIO Hayden Beamish 于 2023 年 8 月退出
              Firmus，当时称其是「一个资产负债表拉得过长、没有合法商业模式的比特币矿工」；他现在表示「Firmus 容易赚的钱已经赚完了」，并且不会参与 IPO。
