      - number: '8.5'
        title: 退出准备度、论点破裂触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Firmus 在结构性流程维度上的退出准备度较高，在透明度维度上较低。结构上，ASX 上市基础设施已经到位：已任命簿记行（Bank of America、JPMorgan、Morgans Financial 和
              Morgan Stanley）；已开展全球路演；ASX 在 2026 年 2 月澄清框架后，于 2026 年 3 月通过了对 Oliver Curtis 的 Good Fame and Character
              评估。Blackstone 工具提供了机构可信度。董事会构成也有所加强，2026 年 3 月任命了三名新的独立非执行董事，包括 Lee Hatton（审计与风险委员会主席）和 Christine
              Bartlett（薪酬委员会主席）。透明度方面，截至运行日期（2026 年 6 月 18 日），尚无招股书提交
              ASIC；收入、毛利率和现金消耗率均未公开披露；两个基石超大规模客户身份仍未披露；运营效率主张也没有独立审计。

              缺乏 IPO 锁定或托管，是最可立即行动的结构性风险。按这个规模的科技上市惯例，创始人、管理层和主要 IPO 前机构股东通常应有 90–180 天托管。报道称，无托管结构让新进入的 IPO 投资者暴露在已实现
              300–530% 账面收益的持有人抛压之下。Ellerston Capital（约 7%）、Regal Funds、Wilson Asset Management、Paradice、UniSuper 等关键
              IPO 前机构，都可能从上市第一天开始卖出。Oliver Curtis 本人按最后一轮标记估计持有价值 AUD $1.25 billion 的股权。Maas Group 于 2026 年 2 月取得 AUD
              $100 million 股份，资金来自出售其建材部门所得——这笔头寸上市时也可立即变现。

              TV005 中列出的论点破裂触发点，设计上用于在簿记和上市后监测。它们直接对应 TV006
              中的六项最终尽调问题。其中两项是结构性阻断项——招股书收入披露和托管结构——应在任何承诺前解决。其余四项（合同条款披露、独立效率审计、建设成本验证和债务服务覆盖率）也很重要，但有可能在 IPO 结束前 30
              天内解决。

              基于当前证据，合适的投资者动作是 TRACK：跟踪 IPO 进程，招股书提交后审阅，并在收入、客户身份和托管结构得到确认后，重新评估买入 / 回避决策。若投资者短期内需要 AI 基础设施敞口，按当前 ASX
              倍数看，NEXTDC 可能是风险较低的主权 APAC 代理标的。CoreWeave 以 8–10x 2026 年远期收入提供了流动性公开基准；按同样倍数，Firmus 招股书必须披露 AUD $800
              million 到 AUD $1.5 billion 年收入，BUY 才站得住。
