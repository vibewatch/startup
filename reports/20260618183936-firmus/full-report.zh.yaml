      - number: '4.5'
        title: 财务结论与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Firmus 的正面财务案例建立在三个可观察支柱上：一笔以合同收入为提款条件、结构健全的债务额度；至少两项数十亿美元级 hyperscale 承诺，在 IPO
              前提供可见收入基础；以及可再生能源成本优势——若能规模化兑现，运营经济性会显著好于传统风冷竞争者。Blackstone 额度的合同提款条件类似项目融资结构，后者在能源基础设施领域过去能吸引投资级债务评级；Maas
              Group 的 ASX 文件也以 AUD $200 million 电气范围、35% 完工进度，独立佐证了实际建设进展。

              负面案例同样证据充分。已审阅的公开来源中，Firmus 没有披露收入、毛利率、burn rate 或 runway。最接近的上市可比公司 CoreWeave 报告 FY2025 调整后 EBITDA 为
              56%，但在 GPU 折旧及约 USD $21 billion 债务利息后净亏损 USD $1.17 billion——这说明 AI 云基础设施的表观 EBITDA
              利润率在排除设备折旧和债务服务后，结构上会误导判断。Firmus 一旦开始规模化部署，债务结构也会带来类似动态；其 IPO 隐含 AUD $8-12 billion
              估值，等于要求公开市场投资者在缺乏公开市场通常要求的信息披露深度时，支付私募市场倍数。

              治理风险同样重大。Oliver Curtis 2016 年内幕交易定罪与 ASX 上市要求直接相关；ASX 2026 年 2 月关于 Good Fame and Character
              测试的合规指引，也被金融媒体广泛解读为与 Firmus 上市有关。Roger Montgomery Investment Management 已公开指出，IPO 缺少 lock-up 或 escrow
              安排是结构性红旗，并称早期投资者已实现 300% 估值涨幅，经济上有动力在上市首日退出。合并来看，财务结论是：从需求基本面和资本结构设计看，Firmus
              论点并非不合理；但极端资本强度、未披露运营经济性、客户暴露集中以及治理悬而未决叠加在一起，意味着在无法取得管理账、IPO 招股书财务数据和合同条款清单前，本章无法支持传统财务承销结论。
