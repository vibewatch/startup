      - number: '1.2'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >
              Firmus 采用联席 CEO 架构：Oliver Curtis 与 Tim Rosenfield 共同担任最高管理角色。Curtis 和 Rosenfield 是表亲；第三位联合创始人 Jonathan
              Levee 现任研发总监，媒体报道曾称其为 Curtis 的前内兄弟。创始层高度集中的家族与私人关系网络，带来关键人依赖，尽调必须专门处理。

              Curtis 2016 年内幕交易定罪，是 Firmus 档案中最重大的治理风险。2007 年 5 月至 2008 年 6 月，Curtis 与前好友 John Hartman 合谋，利用 Hartman 对雇主
              Orion Asset Management 交易意图的内幕了解，完成 45 笔盈利 CFD 交易，净利润 A$1,432,228.85。2016 年 6 月，最高法院陪审团裁定 Curtis
              有罪，判处两年监禁；他在 Cooma Correctional Centre 服刑十二个月，并于 2017 年 6 月 23 日获释。2016 年 12 月 16 日，他的定罪上诉被驳回。Curtis
              后来公开称该罪行为年轻时犯下的「一个错误」。

              2026 年 2 月 23 日，ASX Listings Compliance 部门发布一份专门说明其「良好声誉与品格」测试的合规更新；市场观察人士普遍认为，这与即将到来的 Firmus IPO
              有关。该框架会权衡过往行为的不诚实程度、时间流逝、悔意和后续监管接纳等因素。随后有报道称 Curtis 已获准以公开上市公司身份运营 Firmus；2026 年 5 月 27 日发布的 nine.com.au
              AFR Rich List 人物报道确认了这一批准。2026 年 5 月，Curtis 首次登上 AFR 的 The List – Australia's Richest 250，估计个人财富 A$1.25
              billion。

              2025–2026 年，董事会构成明显加强。Grant Dempsey 被任命为候任主席，Kirsty Godfrey-Billy 于 2025 年 9 月末出任 CFO。David
              Leslie（Ellerston Capital 投资总监）在 2025 年 9 月股权融资后加入董事会。2026 年 3 月起，三名新的非执行董事生效：Lee Hatton（审计与风险委员会主席；Xero
              前董事会成员、Block Inc 前高管）；Christine Bartlett（薪酬与提名委员会主席；现任 NSW Ports 和 CEDA 主席，曾任 IBM 和 NAB 高管）；Julie
              Shuttleworth AM（Fortescue Future Industries 前副 CEO 和 CEO）。Bloomberg 与 Firmus 自家新闻室均在 2026 年 3 月 23
              日确认这些任命。

              独立机构分析师——包括 Roger Montgomery Investment Management，以及通过 Livewire Markets 发布的 NAOS Asset Management
              投资者笔记——都明确指出，Curtis 的定罪与其担任上市公司董事或高管直接相关，并质疑澳大利亚监管框架是否足以校准如此规模的 IPO。
