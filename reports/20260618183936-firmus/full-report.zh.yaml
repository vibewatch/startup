      - number: '3.3'
        title: Hyperscaler、现状方案与主权云新进入者
        blocks:
          - type: paragraph
            body: >-
              AWS、Microsoft Azure 和 Google Cloud 合计主导全球和澳大利亚云支出。AWS 宣布在澳大利亚进行 A$20 billion、五年数据中心投资——主要围绕通用云和 AI
              容量——并已在澳大利亚区域提供经 IRAP 评估的服务。Azure 和 GCP 在 Sydney 与 Melbourne 也有类似 IRAP 范围的足迹。Hyperscaler 按需 H100 定价明显高于
              neocloud：AWS 约 US$6.88/hr，GCP 约 US$10.98/hr，Azure 约 US$12.29/hr，而 Lambda 为 US$2.49/hr。但 hyperscaler
              把企业工具（AWS SageMaker、Azure AI、Vertex AI）、合规认证和数十年企业关系打包出售，纯 GPU 供应商很难复制。

              Hyperscaler 轨迹构成 Firmus 最核心的长期商品化风险：随着 AWS、Azure 和 GCP 加速澳大利亚主权云基础设施，Firmus 用来区分自己的数据主权论点会变窄。Azure 和 GCP
              均已拥有高级主权云层级；AWS 经 IRAP 评估的服务范围仍在扩张。Hyperscaler 进入不会消灭 Firmus 的能源效率主张，但会随着时间削弱主权角度。

              现状替代方案——企业运行自有 on-premises GPU 集群，或通过既有 hyperscaler
              协议采购——对拥有既有资本和合规框架的大型政府部门及受监管企业仍有意义。这些组织拥有对其有利的高转换成本（既有 IRAP 批准、成熟采购渠道），通常需要多年规划周期，才会迁移到新的 GPU 云供应商。

              内部建设（on-prem）或与 Macquarie、CDC 做 co-location、但不叠加受管 GPU 层，对大型企业同样可行，尤其是那些不愿在缺少前期运营验证时接受五年 take-or-pay
              承诺的客户。
