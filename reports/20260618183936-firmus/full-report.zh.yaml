      - number: '4.3'
        title: 成本结构、资本强度与供应链
        blocks:
          - type: paragraph
            body: >-
              Firmus 的 AI Factory 模型天生资本密集。公司称，新建项目资本强度约为每 MW $35-45 million，低于同类设施每 MW $50-55 million
              的行业基准；它将这一优势归因于自研浸没式液冷技术、模块化建设和垂直供应链整合。公司还声称，相比传统风冷数据中心，建设成本可节省约 50%，同样来自冷却和模块化设计。已审阅资料中，按 MW 计算的 capex
              说法和建设节省比例都没有得到独立验证。

              成本结构最具体的公开证据来自 Maas Group（ASX: MGH）2026 年 5 月 18 日的 ASX 公告。文件披露，100 MW Launceston AI Factory 的 AUD $200
              million 合同覆盖通过 JLE Group 交付的交钥匙模块化 PowerCube 方案和高压电气基础设施，意味着仅电气范围就达到每 MW AUD $2 million。JLE 是 Firmus 更大
              3.3 GW 组合的独家电气交付伙伴，每增加一个 100 MW 模块，就对应额外 AUD $200 million 电气基础设施收入——这是一个透明成本基准，锚定了单站成本结构中的一个组成部分。

              能源成本是重要 operating expense 输入。Firmus 的塔斯马尼亚设施依赖该州以水电为主的电网，可再生电力供应费率约为每 kWh USD
              $0.04-0.06，显著低于全球数据中心电力平均水平，是运营成本上的真实结构性优势。但塔斯马尼亚电网容量已经引发政治摩擦：当地人士担心电网承压，老牌工业客户过去也曾被拒绝追加容量。公司 1.03 的 PUE
              效率说法已遭公开质疑：UNSW 的 Dr. Amr Omar 认为这处在全球可能性的极端边界，随后公司承认这只是 2021 年的单点测量，而非持续且经过验证的运营指标。领先 hyperscaler Google
              和 Microsoft 通常报告 1.1 至 1.2 的 PUE。这个差异对运营成本建模很关键：真实 1.03 PUE 意味着颠覆性的能效；实际 1.15-1.20 PUE 依然优秀，但差异化会明显弱得多。
