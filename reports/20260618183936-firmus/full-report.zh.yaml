            全球前三排名建立品牌认知；Project Southgate 的国家 AI 叙事带来媒体报道；ASX IPO 媒体报道提高投资者和企业认知
        - label: 评估
          description: >
            ClusterMAX 基准测试验证性能（启用 SHARP；全球前三）；主权 AI 合规定位区别于离岸超大规模云；DCD Asia-Pacific Best Infrastructure
            award（2024）提供第三方背书；VAST AI OS 安全多租户证明企业就绪度；按需 AI Cloud 定价支撑 TCO/AI-token 成本比较
        - label: 承诺
          description: >
            签署多年 take-or-pay 合同（超大规模锚定客户）；MoU 签署使研究合作正式化（AISG/政府研究）；预留 GPU 实例或按需订阅（云开发者）；Blackstone
            债务额度以已签长期客户合同为条件，把资本与已确认需求绑定
        - label: 部署
          description: >
            GPU 配置和 AI Factory 建设推进（Tasmania/Melbourne 在建）；与 VAST AI OS 数据层集成，服务企业和政府工作负载；NVIDIA NCP 参考设计栈保证互操作性；Synert
            电网集成软件管理电力和能源；Singapore SMC 平台自 2023 年 H2 起上线
        - label: 扩张
          description: >
            计划新增 Project Southgate 站点（Sydney、Canberra、Perth、Adelaide，至 2028 年）；新一代 GPU 升级（Vera Rubin
            路线图）；澳大利亚企业和政府渠道增长（愿景性质——尚无实名生产客户）；AISG MoU 表明 SEA-LION 和未来 NLP Hub 工作的持续合作意向
    approximationNotes: |
      旅程阶段来自公开披露里程碑和 Firmus 的既定战略。公开记录没有客户旅程数据（成交周期、转化率或流失触发因素）；这些阶段反映推断出的客户生命周期，而非观测指标。
