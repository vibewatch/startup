      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 电网接入和监管延误才是硬约束——不是市场需求
            body: >
              澳大利亚每一家主要数据中心运营商，包括 Firmus，都面对同一个需求信号：签约兴趣超过可建设容量。约束既不是资本，也不是买方——而是电力连接速度。Transgrid
              披露无法接入其管线中的所有规划数据中心，AEMC 已提出新的工程合规规则并设定 2026 年 7 月实施期限，能源部长们也在讨论是否把全额可再生能源 offset 作为审批条件。Firmus
              的塔斯马尼亚站点凭借水电 baseload 绕开大部分问题，但 Sydney 和 Perth 站点会和其他运营商一样排队。风险不是市场无法形成，而是监管和电网延误压缩 Firmus 的 2028
              年建设时间表，减少 IPO 时可用的签约 GPU 数量。
            calloutType: risk
            claimRefs:
              - CM029
              - CM032
              - CM033
              - CM036
              - CM038
          - type: callout
            title: 规模估算互相矛盾，反映的是定义混乱，不是 AI 需求不确定
            body: >
              Grand View Research 对 2026 年同一个「AI 数据中心市场」给出的 $180 billion，以及 MarketsandMarkets 给出的 $472
              billion，不是在预测同一件事——两者市场边界不兼容。GVR 统计专用 AI 算力硬件和 colocation 收入；MnM 纳入与 AI 负载共同部署的完整基础设施栈。各自口径下都不算错，但都不能直接衡量
              Firmus 商业上活跃的主权 AI 基础设施细分。对 Firmus 有运营意义的市场，更接近 Data Bridge 的 $14–17 billion 主权 AI 基础设施数字，或 Gartner 的 $80
              billion 主权云 IaaS 口径；澳大利亚在 2026 年约拿到 Mature Asia/Pacific 主权 IaaS 池中的 $1.6 billion。投资者材料若使用大 TAM
              数字而不说明边界，会夸大可直接触达市场。
