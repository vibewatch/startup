      - number: '7.2'
        title: 运营、技术与网络安全风险
        blocks:
          - type: paragraph
            body: >-
              Firmus 的竞争护城河高度依赖其声称的行业领先效率，最显眼的是 1.03 的 Power Usage Effectiveness（PUE）数字。PUE 公式用总设施电力除以 IT 设备电力——满分是
              1.0。包括 Google 和 Microsoft 在内的全球 hyperscaler 通常报告 1.09 至 1.2 的 PUE；多数澳大利亚数据中心在 1.4 至 1.7 之间。Firmus 后来承认，其
              1.03 数据是 2021 年的一次单点测量，而不是经过独立审计的年度平均值。University of New South Wales 的 Dr. Amr Omar
              认为该说法处在全球可能性的极端边界。公众没有看到任何第三方 PUE 验证。如果未来最终记录的持续能效明显不及 1.03，经济论点——即假设结构性更优的电力经济性支撑利润率——会被直接削弱。

              运营模型依赖液体浸没冷却，这带来专门维护要求。全球受训并获得液体浸没冷却认证的技术人员池目前非常有限。到 2028 年从几千块 GPU 扩展到 1.6
              GW，意味着需要在一个并不普及的技能上快速扩员。若该职能人员配置不足，可能表现为设施停机、保修失效或安全事故。

              NEXTDC 质疑也值得单独关注，它是技术可信度信号。NEXTDC CEO Craig Scroggie 公开质疑 Firmus 声称的每 MW 约 US$6 million 建设成本，并引用每 MW 约
              US$12.4 million 的行业标准。如果 Scroggie 的说法准确，而 Firmus 成本数字又没有得到招股书级别第三方评估验证，那么支撑 IPO
              估值的整个利润率和资本回报框架都会受到挑战。截至本次报告日期，AI Factories 还没有任何独立建设成本审计进入公共领域。

              网络安全角度看，处理匿名 hyperscale 客户 AI 工作负载的数据中心，本质上就是高价值目标。SOCI Act 要求报告网络事件并采用 CIRMP。拟议 2026 年修正案将要求达到 Essential
              Eight、ISO 27001、NIST CSF 2.0 或同等框架下的 Maturity Level 2——对一家 2021 年才进入该领域的运营商而言，这是显著抬升。SOCI 网络成熟度 24
              个月宽限期意味着义务可能在 2028 年中到期，正好与 Project Southgate 建设高峰重合。
