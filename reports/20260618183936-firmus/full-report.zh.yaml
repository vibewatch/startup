  - id: TV005
    title: 投资逻辑中断与否决触发因素
    columns:
      - 触发因素
      - 阈值 / 信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 招股说明书确认无 IPO 托管
        - 招股说明书提交后，对 IPO 前持有人没有锁定或托管；主要股东没有承诺上市后继续持股。
        - 持有 300–530% 账面收益的股东带来首日抛压；散户投资者承接卖盘；IPO 价格发现受损；观察降级为回避。
        - 不参与 IPO 建簿；等待上市后 90 天价格稳定再重新评估。监测前 30 天每日成交量。
      - - 招股说明书未披露收入
        - 招股说明书提交的经审计财务显示追踪收入 <AUD $200M，或没有收入披露。
        - 无法验证任何收入倍数；定价完全依赖信念；可比框架失效；若估值 AUD $8B+，建议降级为回避。
        - 放弃 IPO 配售；在 AUD $5B 设置价格提醒（按 $2B+ 合同最低披露价值对应 CoreWeave 等效水平）。
      - - 重大合同取消或重谈
        - Project Southgate 任一超大规模云合同取消或重大重谈；Blackstone 提款暂停；Firmus 在 IPO 后公布修订收入或资本开支指引。
        - 收入底部坍塌；触发 Blackstone 融资契约；下轮估值下调风险急剧上升；悲观情景启动。
        - 卖出或回避；每季度监测 ASX 披露和 Blackstone 提款状态。标记进入减值复核。
      - - AI 需求走弱 / GPU 过剩事件
        - 前五大超大规模云厂商 2027 年资本开支指引同比下调 >20%；GPU 现货价格下跌 >30%；CoreWeave 或 Lambda 指引下调 >25%。
        - 整个 GPU 云板块倍数压缩；Firmus 失去合同授予顺风；$10B 债务融资安排的契约条件可能收紧。
        - 降低仓位；比较 Firmus 合同费率与市场 GPU 费率；评估支持 Blackstone 融资安排的 GPU 抵押品减值风险。
      - - 建设成本效率主张被证实严重夸大
        - 独立审计发现 PUE >1.15，或每 MW 建设成本 >USD $9M（Firmus $6M 与 NEXTDC CEO 引用 $12.4M 的中点）；由 Uptime Institute 或同等机构发布。
        - 能源成本优势收窄；每兆瓦资本效率边际收窄；EBITDA 预测假设需要下修；护城河实质削弱。
        - 目标估值下调 15–25%；要求管理层提供修订版运营模型；从基础设施溢价重新归类为商品化建设。
    notes: 触发因素定义为可观察、公开市场可获取的信号。阈值由作者基于可比分析和商业模式逻辑得出。行动含义是示意性的组合管理指引，不构成财务建议。
