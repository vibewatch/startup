  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入和财务报表
        - 未公开披露经审计或管理层编制的利润表、毛利率、运营烧钱速度或收入确认政策。
        - 没有收入，就无法做可比倍数分析；整个估值框架都建立在代理证据上。这是最重要的单项尽调事项。
        - IPO 招股说明书提交 ASIC 后，审阅其中的财务报表；对标 CoreWeave 56% 调整后 EBITDA 和可比 neocloud 运营商。负责人：ASIC 提交文件（公开）。
      - - IPO 锁定和托管结构
        - IPO 前股东锁定、托管或股份出售限制条款没有正式招股说明书披露。
        - 没有托管，持有 300–530% 账面收益的股东可从第一天起出售，压制上市后价格；这是散户 IPO 投资者特有的结构性风险。
        - 审阅招股说明书中关于股份出售限制的章节和托管契约（如有）。负责人：IPO 法律顾问；预计在招股说明书中确认。
      - - 超大规模客户身份和合同条款
        - Project Southgate 两个基石客户均未具名；合同财务条款、最低承诺和取消条款未进入公开记录。
        - 缺少客户身份和信用质量，Blackstone 融资覆盖率和收入耐久度无法独立评估。客户集中度风险无从判断。
        - 要求提供招股书合同附表或脱敏条款清单；也可在 IPO 时通过 ASX 披露确认客户身份。负责人：Firmus 投资者关系。
      - - 独立 PUE 和效率审计
        - 现有设施在代表性负载下没有经过独立第三方审计的 PUE 测量；2021 年单点测量已因不具代表性被撤回。
        - 如果实际运营 PUE 是 1.15–1.25 而非 1.03，能源成本优势估计会在运营成本线上收窄 15–25%，并实质影响 EBITDA 预测。
        - >-
          要求 Uptime Institute 或 TÜV Rheinland 对满载 Melbourne AI Factory 出具符合 ASHRAE 的 PUE 审计。负责人：Firmus 技术团队；预计在 IPO
          或上市后提供。
      - - 债务偿付覆盖和融资提款条件
        - Blackstone 融资的利率、摊还安排、契约包以及首次提款对应的已签约收入门槛均未公开披露。
        - 按 7–9% 的私募基础设施债利率测算，$10B 债务每年利息支出可达 $700–900M，可能超过早期运营现金流；触发契约违约是实质下行情景。
        - 审阅招股书借款附注；向簿记行索取融资摘要。将首次提款门槛与已披露合同价值对标。
      - - IPO 融资中新股与老股出售拆分
        - AUD $2 billion IPO 融资尚未拆分为主要募集资金（进入 Firmus）和次级出售资金（出售股东套现）。
        - 如果次级出售占比较大，资产负债表受益会相应变小；也意味着上市首日来自出售股东的抛压更高。
        - 在招股书封面页和募集资金用途章节确认。预计 ASIC 备案招股书会披露。
    notes: 截至 2026 年 6 月 18 日（招股书发布前），所有尽调事项仍未关闭。第 1、2 项是结构性阻断点，任何投资承诺前都应解决。第 3–6 项属于重大事项，预计会在招股书中部分解决。
    claimRefs:
