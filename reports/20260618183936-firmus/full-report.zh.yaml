  - id: FE001
    title: Firmus AI Factory 产品架构栈
    type: stack
    layout: standard
    summary: 七层架构从电网 / 能源一直到云交付，展示 Firmus 垂直整合的「silicon-to-grid」设计原则。
    data:
      layers:
        - label: 电网与能源
          detail: 电力供应与电网互动层
          modules:
            - Hydro Tasmania（100% 有保障可再生能源）
            - Aurora Energy 104 MW RSA（3 年；扩至 400 MW）
            - Synert FCAS——电网友好型 UPS（Eaton EnergyAware）
        - label: 供电与冷却
          detail: 热管理与供电
          modules:
            - CDU 液冷（直达芯片冷板）
            - 无气流区；闭环液体；每年 <350 天免用水
            - PUE ~1.1（生产环境宣称；营销材料称 1.03——未经审计）
        - label: 计算
          detail: GPU 计算硬件与互连
          modules:
            - NVIDIA GB300 NVL72 / H200 SXM GPUs 模块
            - HyperCube™——每个模块 32 个 NVL72 机架
            - NVSwitch 3.0 节点内互连（每 GPU 900 GB/s）
        - label: 网络
          detail: 节点间网络与外部连接
          modules:
            - InfiniBand 200–800 Gb/s 节点间互连
            - RDMA / RoCE v2 支持
            - Bernacchi-1 海底光纤（>60 Tbps；2027 年 Q2）
        - label: 编排
          detail: 全栈基础设施智能与调度
          modules:
            - FactoryOS™（热、电力、GPU 遥测、FCAS）
            - NVIDIA DSX Max-Q / DSX Flex / DSX Exchange 软件模块
            - 托管 Slurm（分布式训练调度器）
        - label: 数据
          detail: 统一的高吞吐 NVMe 数据层
          modules:
            - VAST Data AI OS（统一数据层；符合 NCP）
            - WEKA NVMe PFS（RDMA 加速并行文件系统）
            - GPU-direct RDMA 存储访问
        - label: 云交付
