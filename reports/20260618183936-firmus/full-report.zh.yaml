      - number: '8.4'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              三个情景框定了 2026–2029 年 Firmus 投资案例的区间。

              乐观情景需要五件事按顺序发生：ASX IPO 在 2026 年 H2 以 AUD $10–12 billion 定价并超额认购完成；招股书披露至少一个超大规模客户身份和收入规模；墨尔本和塔斯马尼亚的 GB300
              GPU 部署按目标在 2026 年 H2 上线；Blackstone 工具开始基于合同收入提款；AI 训练和推理需求到 2027 年仍受供给约束，阻止 GPU 价格正常化。在这个情景中，Firmus
              2027–2028 年收入可能达到 AUD $1.5–3 billion，股价可能反映 10–15x 远期收入倍数，意味着到 2028 年企业价值达到 AUD $15–20
              billion。该情景概率低到中等：前三个条件单独看都可行，但五个条件在 2026–2027 年窗口内顺序发生，取决于 AI 需求延续、合同披露意愿和无瑕疵运营执行。

              基准情景假设 IPO 在 2026 年 H2 以 AUD $7–9 billion 定价，招股书部分披露合同，收入到 2027 年底爬坡至 AUD $600 million–$1.2
              billion。在基准假设下，随着 IPO 后增长阶段成熟、债务服务吸收大量经营现金流，倍数压缩至 6–8x；2028–2029 年企业价值 AUD $7–12 billion，意味着 IPO
              投资者回报持平到温和。鉴于当前证据基础，这是最可能的情景，也反映了资本密集型、收入前基础设施运营商的市场一致假设。

              悲观情景由以下任何一项触发：IPO 因市场条件不利、治理挑战或 ASIC 审查推迟至 2027 年 Q1 之后；一个或两个超大规模客户行使取消或重谈条款（条款未公开）；AI 算力需求因效率提升、GPU
              供给过剩或超大规模云厂商资本配置回撤而走弱；Blackstone $10 billion 工具的利息负担在确认足够收入前变得不可持续；或独立审计证实建设成本效率主张被重大夸大。在悲观情景中，Firmus
              股权价值可能降至 AUD $3–6 billion（相对 AUD $8 billion IPO 价格下跌 25–65%），并可能出现债务契约压力。鉴于未解决假设数量很多，悲观情景具备中等概率。
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
