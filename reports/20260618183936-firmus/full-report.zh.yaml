      柱状图比较 Firmus 截至 2026 年 4 月的累计股权融资（约 US$1.35B）、其总资本开支目标（到 2028 年 A$73.3B）、Blackstone 债务额度上限（US$10B）以及当前企业估值（2026 年
      4 月融资轮为 US$5.5B）。图表展示支撑该计划的极高杠杆比率，以及对持续债务提款和 IPO 募资的依赖。
