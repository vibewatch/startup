  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接 GPU 云与 Neocloud 对手
        blocks:
          - type: paragraph
            body: >-
              全球范围内，Firmus 最接近的结构类比是 CoreWeave：它同样从加密挖矿转型，并成为美国领先的纯 GPU 云。CoreWeave 于 2025 年 3 月以 US$40 IPO 价格上市，到 2026
              年 3 月市值约 US$43 billion；FY2025 收入 US$5.13 billion，同比增长 168%。其 2026 Q1 收入 US$2.08 billion，确认超高速增长仍在继续，公司指引
              2026 全年收入 US$12–13 billion。到 2026 Q1，CoreWeave 收入 backlog 达 US$99.4 billion，由与 Microsoft、OpenAI 和 Meta 的多年
              take-or-pay 合同支撑。尽管规模很大，CoreWeave 仍背负约 US$25 billion 债务，GAAP 亏损扩大（FY2025 为 US$1.17B），客户集中度极高——Microsoft 占
              2024 年收入 62%。CoreWeave 在 APAC 没有实质存在，主要服务美国 hyperscale AI labs。

              Lambda Labs 是第二个重要 neocloud 对手，2025 年收入估计约 US$760 million（同比增长 79%），并在 2025 年 11 月完成 US$1.5 billion Series
              E 后估值 US$5.9 billion。Lambda 的竞争武器是激进定价：其 NVIDIA H100 实例约 US$2.49/hr，而 CoreWeave 约 US$4.25/hr；开发者导向产品吸引 AI
              初创公司和研究团队。Lambda 已提交 IPO 文件，目标 2026 H1，这可能扩大其资本半径，并潜在推动 APAC 扩张。与 CoreWeave 一样，Lambda 没有既成的澳大利亚主权存在，也没有
              IRAP 相关合规姿态。

              Vultr 处于较低梯队，提供 GPU 实例和透明公开定价（H100 约 US$2.60/hr），拥有 32 个全球数据中心，但目标是中小企业，而非 hyperscale AI 负载。除它之外，没有其他
              neocloud 展现出 Firmus 定位中的基础设施规模、APAC 主权角度或 NVIDIA 合作深度。
