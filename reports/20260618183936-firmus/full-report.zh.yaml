      - number: '2.4'
        title: 增长驱动、采用约束与监管摩擦
        blocks:
          - type: paragraph
            body: >
              首要增长驱动是 hyperscaler capex 暴增：美国前五大基础设施公司 2026 年部署 USD 660–690 billion，并均称 AI 容量建成多快就被吸收多快。Microsoft 披露未履行
              Azure 订单积压 USD 80 billion，唯一闸口是电力接入，说明约束在能源连接，不在需求。Firmus 的定位是吸收溢出：其塔斯马尼亚站点 PUE 约 1.03，借助水电
              baseload，相比澳大利亚大陆偏重燃气的电网，结构上更清洁、价格也更稳定。第二个驱动是地缘政治和主权压力：已有 100 多个国家出台数据本地化或 AI 主权要求，Gartner 预测，随着
              geopatriation 加速，到 2028 年 20% 主权云 IaaS 负载将从全球供应商转向本地供应商。澳大利亚数据中心支出在 2025 年 9 月季度增长超过 60%，达到 A$2.6
              billion——同比增长 140%——政府则在 NSW 快速推进 15 个数据中心项目。但采用面临三项结构性约束。第一是电网容量：Transgrid（NSW
              输电运营商）告诉议会调查，其没有能力为规划管线中的所有数据中心供电；AEMO 预测，到 FY2030 数据中心将消耗 12 TWh（NEM 需求的 6%），在高增长情境下到 2040 年可能升至总电力的
              13%。第二是新的监管义务：AEMC 2026 年 3 月规则草案把「大型」逆变器型负载定义提高到 30 MW，并要求具备 ride-through 合规以防级联停电，这会给每个接入 National
              Electricity Market 的设施增加工程成本和连接时间不确定性。第三，Greenpeace 提出的暂停令呼吁得到部分州能源部长支持，形成政治风险，可能拉长规划审批，并引入附条件的 offset
              要求——新设施可能需要先用新增可再生发电完全抵消其用电需求，才能获得批准。另一个不确定性是，AI 模型效率提升（类似云单位经济中已观察到的 Jevons
              paradox）是否会让单一负载算力强度下降快于采用扩张需求；若发生，实际市场规模可能低于当前预测。
