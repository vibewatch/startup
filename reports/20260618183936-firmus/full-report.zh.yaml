      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 无托管 IPO 结构：散户投资者成为退出流动性
            body: >-
              Firmus 已确认上市时不会对 IPO 前股东设置托管或售股限制，这是近年澳大利亚大型科技 IPO 中结构上最不寻常的特征之一。一些精品 VC 和 PE 基金持有的 Firmus 头寸，已超过基金总价值的
              60%。短短数月内估值接近上涨 300%，早期持有人在上市后立即兑现收益的经济动机很强。包括 Roger Montgomery 和 Wilson Asset Management
              在内的独立基金经理已公开指出，散户 IPO 买家实际上在提供退出流动性。现有董事会构成无法缓释这个风险；对任何公开市场参与者来说，这都是一个重要尽调点。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR033
          - type: callout
            title: Nvidia 金手铐：共生融资循环
            body: >-
              Nvidia 对 Firmus 的未披露股权投资——独立分析师估计可能低于 A$100 million——被广泛认为催化了 A$830 million 第三方股权融资和 Blackstone US$10
              billion 债务工具。绝大多数资本会通过 GPU 采购，以硬件收入形式回流 Nvidia。这形成了结构性锁定：Firmus 如果要摆脱 Nvidia GPU
              架构，就会动摇支撑其估值的投资者和供应商叙事。与此同时，业内观察人士指出，Nvidia 芯片交付周期可延长至十二个月，于是交付节奏成为 Firmus
              建设计划、债务提款和收入确认的关键路径约束——期间利息仍在累积。
