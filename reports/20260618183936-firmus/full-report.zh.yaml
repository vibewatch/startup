      - number: '7.4'
        title: 执行、团队与环境风险
        blocks:
          - type: paragraph
            body: >-
              Firmus 创始团队组建时，并没有数据中心或工程方面的过往专长。Oliver Curtis 创办 Firmus 之前是投行人士，后来做过加密货币投资；Tim Rosenfield 此前担任内衣公司 Simone
              Perele 的 CEO；Jonathan Levee 曾在资源行业担任中层管理岗位。公司引入了有经验的运营者——Ted Pretty、Grant Dempsey、CFO Kirsty
              Godfrey-Billy（2025 年 9 月）以及 2026 年 3 月任命的三名非执行董事——明显补强了管理层厚度。但 Godfrey-Billy 在目标 IPO 日期前任 CFO
              还不到十二个月，新任董事会主席和三名新非执行董事都是过去九个月内加入；任何董事任命都不能替代公司自身十年的运营经验。创始层的个人和家族网络——Curtis 与 Rosenfield 是表兄弟，Levee 曾是
              Curtis 的前姻亲——把非正式影响力集中在一个小圈子里。

              按计划规模看，执行风险很高。Project Southgate 目标是在 2028 年前，于澳大利亚多个首府城市建设 1.6 GW
              容量。在澳大利亚，乃至据本评审所知在全球范围内，还没有运营商尝试过以这种密度和速度建设主权 AI
              基础设施。一支新近搭建的高管团队，要同时在四个城市管理电网接入、设备交付、建设许可和客户上线，这是一类最高级别的执行挑战。Firmus 承诺每 50 MW 创造 50 到 100 个全职岗位，UNSW 教授
              Toby Walsh 已公开称其不现实，并指出现代自动化数据中心通常不需要这种劳动规模。如果这些数字未经限定就写入招股书，可能因前瞻性陈述招来 ASIC 审查。

              环境和能源监管风险集中在塔斯马尼亚，并在全国层面开始显现。Firmus 与 TasHydro 的水电安排遭到绿党议员 Tabatha Badger
              公开反对，她的理由是，传统行业此前曾被告知电网没有容量支持它们自身的绿色转型。ABC 2026 年 3 月的报道对该电力交易结构提出了正式问题。全国层面，AEMC 关于数据中心接入新电网标准的提案，以及
              Greenpeace Australia 呼吁在能源转型规划完成前暂停批准新的 AI 数据中心，都显示监管逆风可能带来接入排队、电网接入费或环境许可条件，从而抬高 Firmus 成本并推迟投运时间。澳大利亚
              Privacy Act 2026 改革——尤其是 2026 年 12 月生效的强制 ADM 披露要求，以及大幅提高的民事罚款（严重违规最高 AUD$50M）——也会给面向客户的产品栈顶层增加合规义务。
