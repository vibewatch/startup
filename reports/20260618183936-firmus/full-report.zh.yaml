      - number: '2.3'
        title: 买方、用户与付款方格局
        blocks:
          - type: paragraph
            body: >
              三类买方驱动 Firmus 当前和近期收入。Hyperscaler 是锚定租户群体：Southgate Melbourne 一份超大规模合同，在与一家未具名全球领先科技公司的多年、数十亿美元协议下，承诺约
              18,400 块 NVIDIA GB300 GPU，代表澳大利亚首个超大规模 AI 工厂合同。这类买方把容量当作基础设施债采购——长期、签约，结构常类似不动产——预算来自全球资本开支计划，而非运营 IT
              预算。用户与付款方是同一实体；采购由基础设施和云投资团队牵头，不是企业 IT。Gartner 将政府列为全球主权云 IaaS 的主要买方，其后是受监管行业（金融服务、医疗、国防）和关键基础设施运营方。2025
              年，政府与公共部门占全球主权 AI 基础设施市场 33%。该细分在澳大利亚是 Firmus 的战略重点：DGX Cloud（NVIDIA 的受管云平台）在 Southgate Melbourne
              建立新区，让联邦和州机构首次获得认证的主权前沿 GPU 算力。在该细分中，付款方是政府 IT 或 whole-of-government
              预算机构；买方是中央采购或技术办公室；用户分散（国防、科研机构、医疗、移民）。第三类——企业、教育、科研和 AI-native 初创公司——通过 Firmus AI Cloud
              以受管服务获取算力。相比设施主权，这类买方更在意 token 成本和 API 可用性，预算归 CIO 或 CTO
              职能所有。采用触发因素包括模型训练成本基准、延迟要求，或排除离岸云的监管数据驻留要求。全球范围内，国防与情报是增长最快的主权 AI 基础设施终端用户，CAGR 为 17.6%。
