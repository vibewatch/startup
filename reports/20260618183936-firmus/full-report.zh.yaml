  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Six comparables selected from public equities, private pre-IPO marks, and M&A transactions as of June 2026;
        excludes hyperscaler cloud divisions (no segment-level AI infra data) and non-GPU-focused data center operators.
    columns:
      - 可比对象
      - 收入 / EBITDA 指标
      - 倍数 / 估值
      - 状态
      - 与 Firmus 的相关性
      - 局限
    rows:
      - - 'CoreWeave (NASDAQ: CRWV)'
        - FY2026E 收入 $12–13B；Q1 2026 收入 $2.08B；调整后 EBITDA 约 56% 利润率；$99.4B 合同积压订单
        - EV/2026E 收入：8.2x–10.6x；EV 约 USD $95–104B；Q1 2026 净亏损 $740M
        - 公开上市（2025 年 3 月 IPO）
        - 最好的结构性类比：GPU 云 neocloud；AI 工厂模式；Nvidia 合作；高杠杆资本结构
        - 每季度收入超过 $2B；120,000+ 客户合同；相比之下 Firmus 尚无收入；美国 / 欧洲地域；$25–28B 债务
      - - Lambda Labs（私营）
        - 估计 FY2025 收入 $760M；收入同比增长约 79%；IPO 前可转票据融资 $350M，折价 20%
        - EV/收入约 12x，对应 $9–9.1B 隐含估值（二级市场，2026 年 5 月）
        - 后期私营；目标 2026 年 H2 IPO；已聘 Morgan Stanley、JPMorgan、Citi
        - 开发者 GPU 云纯玩家；Nvidia 背书；美国市场；IPO 前轨迹与 Firmus 类似
        - 无 APAC / 主权角度；开发者 vs 企业模式；GPU 集群更小；美国地域收入
      - - 'NEXTDC (ASX: NXT)'
        - TTM EBITDA 约 AUD $222M；签约容量 667MW（2026 年增长 60%）；FY2026 资本开支指引 AUD $3B
        - EV/EBITDA 56–74x（追踪期）；EV AUD $12–14B；市值 AUD $12–14B
        - 公开上市（ASX）；本地市场可比对象
        - 最接近的 ASX 上市基础设施同行；澳大利亚主权 AI 数据中心运营商；OpenAI 园区合作；争夺同一批客户
        - 传统数据中心运营商（并非 GPU 原生云）；AI 爬坡正在推进但商业模式不同；估值锚定 EBITDA，而 Firmus 尚无收入
      - - CoreWeave IPO（2025 年 3 月交易）
        - Q1 2025 收入 $981.6M（年化约 $3.9B）；FY2025 收入 $5.13B（实际）
        - IPO 价格 $40/股 → EV 约 $19–27B；上市时隐含 FY2025E 收入倍数 15–20x
        - M&A / IPO 交易
        - 最近一次 GPU 云 IPO；为 AI 基础设施公开发行设定市场先例；直接类比 Firmus 将在 ASX 面对的环境
        - CoreWeave IPO 时季度收入已超过 $981M，Firmus 尚无收入；美国公开市场 vs ASX；投资者基础和流动性不同
      - - AI / 超大规模数据中心 M&A（2025–2026 年交易）
        - EV/收入 6–10x；EV/EBITDA 16–20x+；自 2024 年 Q1 以来合计交易价值 $151B
        - 创纪录交易背景：Aligned DC $40B 收购；84% 交易价值来自 PE / 基础设施基金；PE 基础设施基金 2025 年募资 $250B+
        - 持续进行的 M&A 市场
        - 退出 / 下行情景参考；为已运营、AI 就绪基础设施资产设定底部倍数
        - 这些是已有收入和 EBITDA 的运营资产；Firmus 尚无收入；M&A 倍数可能没有反映无收入风险溢价
      - - Firmus（IPO 前私募标记）
        - 收入：未披露；Blackstone $10B 融资安排以合同为条件；2 份超大规模云合同已确认
        - 投后估值：USD $5.5B（AUD $7.95B）2026 年 4 月；IPO 目标 AUD $8–12B；隐含 EV/收入：未定义（未披露收入）
        - IPO 前私营公司；目标 2026 年 6–7 月 IPO
        - 标的公司；列示用于与可比组对照
        - 自我参照；尚无收入；无经审计财务；若无招股说明书收入披露，无法计算隐含倍数
    notes: >-
      除另有说明外，收入倍数均按 2026E 口径列示。所有 USD/AUD 数字在适用处按约 0.65 汇率换算。NEXTDC EV/EBITDA 反映追踪期数字，以及截至 2026 年 6 月的 AI
      基础设施需求溢价环境。CoreWeave IPO 倍数基于 IPO 定价，而非当前交易价格。AI / 超大规模数据中心 M&A 区间反映 EV 可估算的交易；并非所有交易都披露财务数据。
