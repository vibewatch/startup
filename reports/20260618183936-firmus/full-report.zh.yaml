  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 维度
      - 投资逻辑论据
      - 反向逻辑反驳
      - 证据状态
      - 什么会改变判断
    rows:
      - - AI 需求拉动
        - 超大规模云厂商 2026 年资本开支 $660–690B；Firmus 已签两份数十亿级合同，在 IPO 前验证需求底部。
        - 合同对手方未具名；条款、最低承诺和取消权未披露；若 AI 效率提升（Jevons 悖论）加速，需求可能放缓。
        - 部分
        - 招股说明书披露客户身份和合同条款；超大规模云厂商 GPU 资本开支持续至 2027 年。
      - - APAC 主权护城河
        - 澳大利亚的可再生能源、政治稳定性和贴近亚太的地理位置，形成主权算力稀缺价值；没有超大规模云厂商拥有这组资产组合。
        - NEXTDC（OpenAI 园区）、Macquarie DC 和 CDC 正在建设主权容量，治理资质相当或更强；护城河并非独占。
        - 部分
        - 持续的 IRAP 或主权认证差异化，且竞争对手无法匹配；可证明的客户管线明确要求使用 Firmus。
      - - Blackstone 信贷验证
        - 以合同为条件的 $10B 高级担保融资安排，说明机构贷款方相信合同收入足以支撑资本结构。
        - 全额提款按 7–9% 年利率计算，意味着 $700–900M 年利息；GAAP 盈利需要收入显著高于当前任何公开证据；CoreWeave 每季度 $740M 的 GAAP 亏损说明了这一模式。
        - 已确认（结构）；未解决（财务影响）
        - 招股说明书披露 DSCR（偿债覆盖率）；收入披露显示初始部署至少达到年利息覆盖 1.5x。
      - - Nvidia 背书与供应
        - Nvidia 参股，并在 Southgate Melbourne 部署区域 DGX Cloud，显示芯片供应优先级和需求侧分销能力，这是 APAC 竞争对手无法匹配的。
        - Nvidia 两轮合计股权估计 <AUD $100M，而总融资为 AUD $1.35B；投资形态更像供应商融资：GPU 采购流会让资金多次回到 Nvidia，并非独立背书。
        - 部分（小额持仓已确认；供应商动态为推断）
        - 招股说明书披露 Nvidia 股权比例；证明存在非 GPU 供应商业关系；披露 Nvidia DGX Cloud 收入分成。
      - - IPO 结构完整性
        - 全球路演已完成；四家一级账簿管理人获任；ASX Good Fame and Character 已为 Curtis 放行；董事会实质性增强。
        - 招股说明书尚未提交；没有托管；Oliver Curtis 定罪与证券语境下的治理直接相关；精品 VC 基金持有的 Firmus 超过基金价值 60%——集中抛售风险高。
        - 部分（流程推进；透明度低）
        - 招股说明书披露收入、锁定结构和经审计的效率主张；创始人和 IPO 前持有人至少 90 天托管。
      - - 能源成本优势
        - 已签约的塔斯马尼亚水电，估计价格为 USD $0.04–$0.06/kWh——处于全球数据中心电力成本最低区间——带来持久运营成本优势。
        - PUE 1.03 的主张是 2021 年一次点测，并非独立审计；实际运营 PUE、电力合同量和定价均未公开验证；塔斯马尼亚水电交易引发政治摩擦。
        - 部分（成本区间为估计；PUE 未验证）
        - 满载独立 PUE 审计；招股说明书披露电力合同条款；电网接入持续且不受监管扰动。
    notes: 证据状态（部分 / 已确认 / 未解决）由作者基于公开来源审阅得出。「部分」表示存在部分佐证证据，但关键假设仍未验证。「什么会改变判断」描述可消除不确定性的证据。
