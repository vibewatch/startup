      - - AEMC 2026 年 3 月电网标准草案（30 MW 门槛、穿越能力合规）
        - 约束
        - 负向
        - 2026 年–2026 年年中定稿
        - 所有接入 NEM 的设施都将新增工程合规成本和接入协议要求
        - 评估每个工厂站点为满足穿越能力要求所需的增量 capex
      - - 监管风险：AEMC / COAG 提议要求新 DC 全额可再生能源抵消
        - 约束
        - 负向
        - 2026–2027
        - 可能拉长许可周期；Firmus 的可再生能源整合可能让其获得快速通道待遇
        - 跟踪 AEMC 2026 年 7 月报告以及州部长对强制抵消规则的立场
      - - Greenpeace 和 NGO 压力：呼吁暂停批准新数据中心
        - 约束
        - 负向
        - 当前–持续
        - 政治和声誉风险；可能放慢大陆站点（墨尔本、悉尼、珀斯）的规划审批
        - 跟踪 Kemps Creek 和大陆站点的州规划决定与社区反对
      - - AI 模型效率风险（Jevons 悖论不确定性）
        - 约束
        - 混合
        - 2026–2030
        - 推理变便宜后，整体算力需求可能上升，也可能下降；2025 年 Gemini 服务成本下降 78%，说明效率迭代速度很快
        - 在财务模型中加入每单位工作负载 GPU-hours 下降 20% 和 50% 的敏感性
    notes: 驱动 / 约束的判断基于截至 2026-06-18 的公开证据。时间估计为定性判断。「尽调问题」列列出可让评估更精确的证据缺口。AEMC 规则截至本报告日期仍是草案；最终规则预计 2026 年年中出台。
