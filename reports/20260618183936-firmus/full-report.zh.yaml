      - number: '4.2'
        title: 资本结构、融资与 IPO 准备
        blocks:
          - type: paragraph
            body: >-
              Firmus 搭起的资本结构，相比当前经营阶段已经偏大。截至 2026 年 4 月的六个月里，公司完成三轮股权融资，合计约 USD $1.35 billion：2025 年末先以 USD $1.9 billion
              估值融资 AUD $330 million，Nvidia 担任领投战略投资方；2025 年 11 月又以 USD $6 billion 估值融资 AUD $500 million；2026 年 4 月，在
              Coatue Management 领投、Nvidia 继续参与下融资 USD $505 million，投后估值 USD $5.5 billion。2026 年 4 月这一轮被宣布为 IPO
              前最后一轮股权融资。

              结构上更关键的是 2026 年 2 月 9 日宣布的 USD $10 billion 优先担保债务融资额度，由 Blackstone Tactical Opportunities 和 Blackstone
              Credit & Insurance 管理的基金领投，Coatue 参与。顾问 Milbank、Allens、Kirkland & Ellis
              将这笔交易描述为澳大利亚企业史上规模最大的私募债融资之一。该额度的核心结构——只有在与 hyperscaler 和蓝筹 AI
              客户签署长期客户合同后才能提款——限制了投机性部署，也类似合同能源基础设施常见的项目融资结构。该设计给贷款人提供了真实的收入覆盖，但也意味着在拿到承诺前无法提款；如果合同谈判放慢或延迟，就会产生排序风险。

              IPO 预计 2026 年 6 月或 7 月在 ASX 进行，目标募资约 USD $2 billion。账簿管理人为 Bank of America、JPMorgan、Morgans Financial 和
              Morgan Stanley。若按目标规模完成，这将跻身澳大利亚史上最大的科技公司发行之一。Startup Daily 报道称，投资者正在按 AUD $8 billion 或更高 IPO 估值建模，较 2026
              年 4 月轮次隐含的 AUD $7.95 billion 投前估值进一步抬升。到 2028 年的总 capex 计划为 AUD $73.3 billion，约为当前已融股本的 55 倍；因此，IPO
              募资以及围绕新合同继续提款，是关键融资路径。月度 burn rate 和近期 runway 尚未公开披露。
