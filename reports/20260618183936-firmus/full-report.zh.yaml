  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：AI 云、主权 AI 基础设施与 GPU 容量
        blocks:
          - type: paragraph
            body: >
              Firmus 把自身放在三个相互重叠的支出类别交汇处。第一类是超大规模 GPU 算力：全球云服务商购买签约、高密度 AI 工厂容量，以满足超过自建速度的需求。第二类是主权 AI 基础设施：AI
              算力必须留在本国治理之下，使用本地能源供给，并符合国家数据驻留要求。第三类是企业和政府 AI 云服务：Firmus AI Cloud 向商业和公共部门客户提供受管的前沿 GPU 容量，而客户无需自建。通用
              IaaS 和传统 colocation 被明确排除：Firmus 只瞄准 AI 高密度、能源优化、GPU 原生负载。现状替代方案包括全球 hyperscaler 云（AWS、Azure、GCP）、本地自建
              on-premises GPU 集群，以及 NEXTDC 和 Equinix 等传统 colocation 运营商；这些方案都无法在澳大利亚本土以规模化方式提供可再生能源供电的主权 AI 工厂经济性。澳大利亚拥有
              145 个运营中的 colocation 数据中心，数据中心市场预计到 2031 年达到 USD 9.02 billion，是锚定地理市场；APAC
              出口是明确目标。相邻支出类别——通用企业云、网络安全基础设施和网络运营商服务——虽相邻，但不纳入主要市场边界，因为 Firmus 商业上并不瞄准这些领域。
