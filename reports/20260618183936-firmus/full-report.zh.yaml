      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Nvidia 战略绑定与芯片供给优先级
            body: >
              Nvidia 同时是战略股权投资者和主要 GPU 供应商——参与 2025 年 9 月和 2026 年 4 月两轮股权融资，并为 Project Southgate 提供 DSX/Vera Rubin
              参考架构——这给 Firmus 带来一线机构背书，也带来 AI 基础设施市场中最紧缺投入品的优先获取权。在当前美国出口管制政策下，澳大利亚是美国以外约七个可不受限制获取最先进 Nvidia 芯片的国家之一，使
              Firmus 的 APAC 定位成为结构性竞争优势。Blackstone 的 John Watson 将 AI 基础设施描述为「我们最高确信度的投资主题之一」，并特别强调 Firmus 的节能模式。
            calloutType: strength
            claimRefs:
              - CO024
              - CO027
              - CO028
          - type: callout
            title: 关键人风险——Oliver Curtis 定罪与治理依赖
            body: >
              联席 CEO Oliver Curtis 背负 2016 年共谋内幕交易刑事定罪——这是证券语境下的不诚实犯罪，ASX 明确认定其与上市公司董事角色直接相关。虽然 Curtis 在 2026 年 3 月通过
              ASX「良好声誉与品格」测试，使计划中的 IPO 得以推进，但这一定罪仍是公司治理记录中的永久事实。包括 Roger Montgomery Investment Management 在内的独立基金经理，以及
              The Witness 的记者分析都指出，招股书披露要求会确保所有公众投资者在买入前看到完整历史。IPO 前股东（包括创始人）没有任何禁售限制，又放大了关键人风险：如果上市后投资者对 Curtis
              的信心下降，创始人与早期支持者可以随时卖出，没有锁定期约束。
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
              - CO034
              - CO035
              - CO038
              - CO045
          - type: callout
            title: 未验证的效率主张与 Nvidia 共生循环
            body: >
              Firmus 标榜的 1.03 PUE，是 2021 年单一浸没式部署的一次点测量，无法独立验证。UNSW 专家 Dr Amr Omar 将持续 1.03 PUE
              描述为「已经达到当今全球任何地方可能实现水平的极端边缘」。公司更广泛的「较竞争对手节能 60%」主张，也没有由独立第三方在运营规模下测试。另一个问题是，Roger Montgomery Investment
              Management 认为 Nvidia 相对较小的股权投资（估计 A$30–75M）撬动了 A$830M 后续股权和 US$10B 债务，其中大部分会作为硬件收入回流
              Nvidia——形成自我强化循环：Nvidia 光环挤掉了对底层经济性的审视。所有已审阅公开材料也都没有客户合同披露。
