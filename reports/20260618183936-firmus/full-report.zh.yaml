    approximationNotes: >-
      Firmus IPO 区间基于投资者往来材料和媒体报道（低位 = 最近一轮私人市场估值；基准 = 目标底线；高位 = 报道中的目标）。Firmus 2028 年退出估值由作者按牛市 / 基准 /
      熊市情景推导，不是招股书指引。CoreWeave EV 来自 MarketScreener 和 Multiples.vc 2026 年 6 月数据。Lambda Labs 估值来自 Forge Global 2026 年 5
      月二级市场数据。NEXTDC 区间来自分析师估计。所有 AUD / USD 换算约按 0.65。
