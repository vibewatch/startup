      - number: '8.3'
        title: 可比公司、私募轮次与并购交易
        blocks:
          - type: paragraph
            body: >-
              ASX 上没有直接可比的纯 AI 工厂型 neocloud 上市公司。最相关的四个参照点是 CoreWeave（NASDAQ: CRWV）、Lambda Labs（私有，计划 2026 年 H2
              IPO）、NEXTDC（ASX: NXT），以及 2025–2026 年创下交易价值纪录的 AI 和超大规模数据中心并购市场。

              CoreWeave 是主要基准。CoreWeave 2025 年 3 月以每股 USD $40 IPO 时，按 2025 年 Q1 年化收入约 USD $3.9 billion 计算，隐含市值约 USD
              $19–27 billion。到 2026 年 5 月，CoreWeave 报告 2026 年 Q1 收入 USD $2.08 billion，重申 2026 全年指引 USD $12–13 billion，在
              $2 billion Nvidia 股权投资之外又获得一笔新的 $8.5 billion 无追索、延迟提款定期贷款，并以 8.2x 到 10.6x 的隐含 EV/2026E
              收入倍数交易（MarketScreener：8.26x；Multiples.vc：2026 年 6 月为 10.6x）。CoreWeave 截至 2026 年 Q1 末积压订单达到 USD $99.4
              billion，提供了 Firmus 尚未公开证明的可观合同收入可见度。但 CoreWeave 同时背负约 USD $25–28 billion 的债务和股权支持工具，GAAP 亏损扩大（2026 年 Q1
              尽管收入 $2.08 billion、调整后 EBITDA $1.16 billion，仍净亏损 $740 million），且交易估值仍处高溢价。CoreWeave 模型是 Firmus
              最有参考意义的类比：它证明 AI 云基础设施需求真实且可资本化，但也展示了高杠杆 GPU 云运营商在调整后 EBITDA 与 GAAP 净利润之间的结构性盈利缺口。

              Lambda Labs 已聘请投行为 2026 年 H2 美国 IPO 做准备。截至 2026 年 5 月，它的隐含估值约 USD $9–9.1 billion，按估计 FY2025 收入 USD $760
              million 计算，约为 12x 远期收入。Lambda 面向开发者的定位不同于 Firmus 的 factory 模型，但它的收入倍数为 IPO 前私募可比分析提供了有用上限。

              NEXTDC（ASX: NXT）截至 2026 年 6 月的追踪 EV/EBITDA 倍数约为 56–74x，企业价值 AUD $12–14 billion，受合同容量增长 60% 至 667 MW 以及
              OpenAI 园区合作推动。NEXTDC 的高倍数反映了 AI 基础设施的溢价定价，但锚定在真实 EBITDA 上，而不是收入前承诺——这与 Firmus IPO 所需的估值基础在结构上不同。

              AI 和超大规模数据中心并购市场自 2024 年初以来累计交易价值达到 USD $151 billion，其中 84% 由私募股权资金支持。已运营、已预租、可用于 AI 的资产可取得 6–10x
              EV/revenue 和 16–20x EV/EBITDA。鉴于 Firmus 仍处收入前状态，它应锚定在可比组低端；只有招股书披露合同收入后，才可能进入 CoreWeave 或 Lambda 的可比区间。

              将 CoreWeave 的 8–10x 2026E 收入倍数套用于 Firmus 的 AUD $8–12 billion IPO 目标，意味着所需收入为 AUD $800 million 到 AUD $1.5
              billion。截至运行日期，没有公开证据支持这一水平。若估值为 AUD $6 billion，只要一部分合同 GPU 管线按典型 GPU 云费率转化为收入，估值即可自洽；若估值为 AUD $8–12
              billion，则必须由招股书给出证明。
