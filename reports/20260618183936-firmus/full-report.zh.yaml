  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与商业牵引
        blocks:
          - type: paragraph
            body: >-
              Firmus 通过两条主要渠道销售 AI 算力容量并产生收入：一是公共云平台，提供按需 GPU 和 CPU 实例及受管存储；二是为专用 AI 基础设施定制的长期企业合同。公开定价页列出 CPU 实例价格：最小
              4-vCPU 虚拟化实例为 USD $73/month，最高到 256-vCPU bare-metal 配置的 USD $4,672/month；WEKA NVMe 并行文件存储为 USD
              $0.11/GB/month。所有 GPU 实例层级——H200、H100、L40S、A100 和 A40——都列出规格但没有机架价，对承诺和专用访问标注「联系询价」。CPU 透明定价与 GPU
              不透明定价之间的差距是商业上有意为之：GPU 合同代表经济上占主导的收入来源，且逐单谈判。

              商业牵引最清晰的公开证据，是 Project Southgate 旗下两份数十亿美元 hyperscale 合同。第二份也是最近披露的一份于 2026 年 3 月 2 日签署，覆盖 Melbourne 设施约
              18,400 块 Nvidia GB300 GPU，合同为与一家未具名全球领先科技公司的多年协议。该客户身份未在公司公告、Bloomberg
              报道或任何已审阅公开来源中披露。因此，外部无法评估客户集中风险、交易对手信用质量或合同财务结构。

              云按需与企业合同渠道之间的收入结构没有公开拆分。公司表示已经产生收入；Lennox Capital Partners 在 2025 年 10 月判断，近期 150 MW 管线支撑的 run-rate
              revenue 估值超过 Firmus 当时估值标记的 10x。Nvidia 的 DGX Cloud 受管 AI 平台正与 Firmus 合作，在 Southgate Melbourne
              建立专用区域；这代表一个嵌入式需求渠道，混合企业与平台分发，但没有披露清晰的收入分成结构。长期 hyperscale
              合同的收入质量在结构上优于现货云收入——合同代表经常性、已承诺现金流——但具体定价机制、最低承诺和取消条款不在公开记录中。
