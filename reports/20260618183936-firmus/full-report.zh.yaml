      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 建议：TRACK——承诺前等待招股书
            body: >-
              Firmus 的结构性 AI 基础设施逻辑有证据支撑：主权需求真实存在，Blackstone 工具提供项目融资可信度，已签约的超大规模收入形成可见管线。但在招股书前阶段，IPO
              要求公开市场投资者把私募市场倍数套用在未披露收入上，同时没有托管保护来抵御已获 300–530% 账面收益的持有人从第一天开始卖出。合适动作是 TRACK：等招股书提交 ASIC 后审阅；只有在收入 AUD
              $800M+、客户身份和 ≥90 天锁定被披露，且估值 ≤ AUD $8 billion 时，才转为 BUY。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV013
              - CV028
          - type: callout
            title: 无托管 IPO：新进投资者的结构性红旗
            body: >-
              据报道，Firmus IPO 不会对 IPO 前股东设置托管或售股限制，范围包括创始人、管理层以及持有 300–530% 账面收益的机构投资者。Firmus 股东 Wilson Asset Management
              将其称为「结构性红旗」。Roger Montgomery 警告，散户投资者面临为内部人提供「退出流动性」的风险。评估簿记时，投资者应把这种结构性风险计入入场估值，并监测上市后前 90
              天的交易量和所有权变化。招股书是否确认任何锁定安排，是一个二元的继续 / 放弃尽调项。
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV037
          - type: callout
            title: CoreWeave 先例：EBITDA 到 GAAP 的缺口是关键风险
            body: >-
              CoreWeave 2026 年 Q1 业绩为 Firmus 提供了最有参考价值的先例：$2.08B 收入和 56% 调整后 EBITDA 率，在扣除债务服务和 GPU 折旧后仍产生 $740M GAAP
              净亏损。对 Firmus 而言，若 $10B 债务工具按 7–9% 年利率计息，调整后 EBITDA 会系统性高估经济盈利能力。投资者评估 IPO 定价时，必须建模 GAAP
              净利润路径，而不是只看调整后指标。应要求查看招股书中的 GAAP 利润表，而不只是 EBITDA。
            calloutType: insight
            claimRefs:
              - CV009
              - CV027
              - CV036
