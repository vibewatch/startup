        - 监测 ASEAN 政府 AI 基础设施采购管线
      - - 塔斯马尼亚水电电网（PUE ~1.03，接近纪录的能效）
        - 驱动因素
        - 正向
        - 当前
        - 在 token 经济性上形成结构性成本优势；也为超大规模云买方提供 ESG 资质
        - 向第三方审计方索取独立 PUE 验证
      - - 澳大利亚数据中心支出激增（2025 年 Q3 +60%，YoY +140%）
        - 驱动因素
