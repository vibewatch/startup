      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: NEXTDC CEO 公开质疑 Firmus 建设质量和成本主张
            body: >-
              2026 年 4 月，NEXTDC CEO Craig Scroggie 在公司分析师电话会上质疑 Firmus 设施能否建成企业级质量。Scroggie 引用约 US$12.4 million/MW
              的行业标准建设成本，与 Firmus 声称的约 US$6 million/MW 对比——接近 50% 的折扣；如果这一折扣不准确，Firmus
              财务模型的核心支柱就会塌掉。这不是泛泛的竞争攻击：提出质疑的是一位拥有多 GW 交付经验的资深运营商，指向具体技术和财务主张。对 Firmus 每 MW capex 做独立工程验证，是承销 IPO
              估值的前置条件。
            calloutType: risk
            claimRefs:
              - CP024
              - CP028
              - CP029
          - type: callout
            title: GPU 出口管制给新加坡业务带来地缘政治融资风险
            body: >-
              2026 年初，Nomura 难以为 Firmus Metal Singapore 分销一笔 US$120 million 信贷额度——投资者担忧集中在美国对 NVIDIA H100
              芯片的出口限制，以及靠近中国带来的再出口执法风险——这是一个早期信号：Firmus 源自新加坡的业务风险，主流机构债务投资者还不愿轻易定价。澳大利亚主权叙事能隔离国内业务，但不能消除新加坡及更广泛
              Asia-Pacific 实体的敞口；最初的 Hypercube GPU 租赁模型正是在那里开发。如果美国出口管制执法升级，新加坡运营实体和区域扩张计划将面临独立于澳大利亚 Project Southgate
              路径的融资约束。
