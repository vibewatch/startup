chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Firmus Technologies delivers two interlocked products — AI Factories (modular liquid-cooled compute campuses
    anchored by the HyperCube™ hardware module and FactoryOS™ orchestration software) and Firmus AI Cloud (a GPU
    IaaS platform with H200/H100/A100/L40S instances). The technology stack is built on NVIDIA DSX Vera Rubin
    reference architecture, VAST Data AI OS storage, Synert grid-integration software, and a patent portfolio
    spanning thermal, orchestration, and power-integration innovations. Key risks include near-total NVIDIA GPU
    supply dependence, an unverified 1.03 PUE headline claim conflicting with verified ~1.1 figures, immersion
    cooling operational complexity at gigawatt scale, and Tasmanian energy supply constraints that could throttle
    the Project Southgate expansion.

sections:
  - id: product-portfolio-and-operating-model
    title: Product Portfolio and Operating Model
    body: |
      Firmus operates two interlocked product lines. The primary product is the AI Factory — a modular, vertically
      integrated compute campus anchored by the HyperCube™ hardware module. Each HyperCube houses 32 NVL72 GPU
      racks in a liquid-cooled, high-density configuration purpose-built for AI training and inference. AI Factories
      are not colocation services: every site is a vertically engineered asset where compute, cooling, networking,
      and power infrastructure are co-designed from first principles, with no retrofit tanks and no airflow required
      in critical compute zones.

      As of June 2026, Firmus operates AI Factory sites in Singapore under the STT GDC partnership (approximately
      4,000 NVIDIA GPUs, 99 PFLOP/s, supporting AI Singapore's SEA-LION project) and is in Phase 1B deployment at
      Project Southgate in Launceston, Tasmania, targeting 36,800 NVIDIA GB300 Grace Blackwell GPUs. An early
      edge product — the Cube300 — offers 300 kW in a shipping-container form factor at PUE < 1.05, one-twelfth
      the footprint of equivalent air-cooled capacity.

      The second product line is Firmus AI Cloud, a GPU infrastructure-as-a-service platform offering bare-metal
      and virtual-machine GPU instances (H200, H100, A100, L40S) with RDMA-accelerated InfiniBand networking,
      managed Slurm scheduling, and pre-configured CUDA stacks (PyTorch, TensorFlow). AI Cloud runs on
      proprietary AI Factory infrastructure rather than leased third-party data centres, creating a vertically
      integrated GPU cloud. Firmus also operates Synert, a grid-integration subsidiary providing frequency control
      ancillary services (FCAS) to Australia's National Electricity Market, converting latent UPS battery
      capacity into grid-stabilisation revenue while reducing AI Factory energy costs by over 25%.
