  - id: dependencies-supply-chain-and-connectivity
    title: Critical Dependencies, Supply Chain, and Connectivity
    body: |
      Firmus's infrastructure stack rests on three foundational dependencies, each with material concentration
      risk. First, NVIDIA GPU supply: every HyperCube module, every AI Cloud instance, and all Project Southgate
      GPU racks rely exclusively on NVIDIA hardware. NVIDIA captures approximately 43.6% of top-5 hyperscaler
      AI capital expenditure as of Q4 2025, meaning large hyperscalers compete with Firmus for constrained chip
      supply. NVIDIA's equity stake in Firmus creates aligned incentives but does not guarantee preferential
      allocation over larger U.S. customers. GB300 Blackwell Ultra supply-chain and TSMC packaging constraints
      add delivery risk to the Project Southgate timeline.

      Second, energy supply: Firmus holds a three-year Aurora Energy retail service agreement for up to 104 MW
      of Hydro Tasmania renewable power (ramping August to November 2026). Three planned Tasmanian sites would
      require approximately 400 MW total — roughly 20% of Tasmania's energy demand — making Firmus the state's
      largest potential power user. Political scrutiny has intensified: the Boyer Paper Mill's request for an
      additional 45 MW of Hydro power was rejected while Firmus received a 104 MW allocation, and Greens
      legislators have called for dedicated regulation. Tasmanian cold climate and hydro reliability are core
      to Firmus's efficiency claims, making the location non-substitutable in the near term.

      Third, data connectivity: Tasmania's Bass Strait isolation is a strategic bottleneck. Firmus announced the
      Bernacchi-1 submarine fiber cable with SUBCO in June 2026, delivering more than 60 Tbps to Tasmania —
      more than all existing Bass Strait cables combined — by branching into SUBCO's 400 Tbps SMAP system with
      dual mainland pathways. Commercial operation is targeted for Q2 2027; until then, Project Southgate
      operates on legacy fiber capacity. Nationally, Project Southgate targets 1.6 GW across five Australian
      cities by 2028 at an announced build cost of A$73.3 billion.
