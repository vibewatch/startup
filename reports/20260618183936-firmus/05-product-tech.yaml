callouts:
  - calloutType: strength
    title: Vertically Integrated Patent-Backed Stack Is a Genuine Moat
    body: >-
      Firmus's combination of proprietary HyperCube hardware, FactoryOS orchestration, Synert grid-integration
      software, and a growing multi-jurisdiction patent portfolio (confirmed by FB Rice patent attorneys) creates
      a genuinely differentiated technology stack. The MLPerf V4.0 benchmark submission — reviewed by MLCommons
      at the node level — provides an independent data point for the efficiency advantage. No direct competitor
      in the Australian/APAC market has demonstrated comparable vertical integration from cooling design to
      grid participation at production scale.
    claimRefs:
      - CE002
      - CE005
      - CE015
      - CE026

  - calloutType: risk
    title: Near-Total NVIDIA Dependency Is the Structural Risk of the Entire Business Model
    body: >-
      Every AI Factory module, every AI Cloud instance, and the entire A$73.3 billion Project Southgate programme
      runs exclusively on NVIDIA hardware. With NVIDIA capturing approximately 43.6% of all top-5 hyperscaler AI
      capital expenditure, supply allocation is competitive and prioritised toward larger customers. The NVIDIA
      equity stake creates alignment but also exposes Firmus's capital deployment to NVIDIA's product roadmap
      cycles — GB300 delivery delays or pricing changes could directly affect Project Southgate milestones and
      unit economics. No credible alternative GPU architecture pathway exists in Firmus's current roadmap.
    claimRefs:
      - CE027
      - CE028
      - CE029
      - CE035

  - calloutType: insight
    title: Bernacchi-1 Signals Firmus Is Positioning as a Full-Stack AI Infrastructure Platform
    body: >-
      The June 2026 announcement of the Bernacchi-1 submarine fiber cable — underwritten by Firmus, delivering
      more than 60 Tbps to Tasmania — demonstrates that Firmus is extending its product strategy beyond compute
      hardware into the connectivity layer required to export AI tokens at national scale. This move mirrors
      hyperscaler infrastructure-stack strategies and, if executed, materially reduces the geographic bottleneck
      risk that has been a structural vulnerability for Tasmania-based compute. However, the Q2 2027 operational
      target and dependence on marine permit finalisation create an 18-month gap during which Project Southgate
      operates on legacy Bass Strait fiber capacity.
    claimRefs:
      - CE024
      - CE025
      - CE040

