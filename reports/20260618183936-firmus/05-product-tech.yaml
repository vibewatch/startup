  - id: technology-architecture-and-software-stack
    title: Technology Architecture and Software Stack
    body: |
      The core computing layer is built on NVIDIA GPU hardware: H200 SXM (8 × 141 GB HBM3e per node, NVLink
      4.0 + NVSwitch 3.0 at 900 GB/s bi-directional per GPU) for current cloud deployments, with NVIDIA GB300
      Blackwell Ultra (288 GB HBM3e, up to 8 TB/s bandwidth, >120 kW per NVL72 rack TDP) slated for Project
      Southgate at scale. Inter-node networking uses dual InfiniBand at 200–800 Gb/s per node with RDMA and
      RoCE v2 support, enabling low-latency distributed training across multi-node GPU clusters.

      Cooling relies on direct-to-chip liquid cooling (CDU-fed cold plates) with no airflow in critical compute
      zones. The company claims a PUE of approximately 1.1 in production deployments (cited on the engineering
      principles page and in MLPerf submissions), while separately marketing a headline figure of 1.03; no
      independent third-party annual audit of either figure has been published. MLPerf Training V4.0 submissions,
      reviewed by MLCommons, showed approximately 30% better power efficiency vs. H100 SXM air-cooled systems
      at the immersion-rack level, though data-centre-level PUE was outside that round's scope.

      The orchestration layer is FactoryOS™, Firmus's proprietary full-stack infrastructure intelligence platform
      governing cooling, power delivery, thermal telemetry, and GPU performance as a single system. The data
      layer is VAST Data AI OS, selected in February 2026 to provide unified high-throughput NVMe storage aligned
      with the NVIDIA Cloud Partner (NCP) reference design; WEKA NVMe PFS is retained for AI Storage with
      RDMA-accelerated parallel file access. The Model-to-Grid platform extends FactoryOS orchestration to
      real-time responsiveness to Australian grid pricing and stability signals, coordinating AI workloads with
      AEMO and the National Electricity Market. Firmus built this capability in collaboration with NVIDIA on the
      DSX Blueprint, with initial deployment at Project Southgate.
