  - id: differentiation-trust-and-compliance
    title: Differentiation, Trust, and Compliance
    body: |
      Firmus's technology differentiation rests on three pillars: a layered patent portfolio, independently
      benchmarked performance, and cloud security certifications. On IP, patent attorneys FB Rice confirmed that
      Firmus holds granted patents in Australia, the US, and other jurisdictions covering core liquid-cooling
      systems, grid-stabilisation software, and specific innovations in pipework design, temperature control, and
      HyperCube software. Divisional filings create a layered "patent thicket" protecting foundational technologies
      and incremental improvements, providing leverage in licensing and deterring direct replication.

      On performance benchmarking, Firmus submitted to MLPerf Training V4.0 with power measurements at the
      immersion-rack level reviewed by MLCommons, showing approximately 30% better energy efficiency vs. H100
      SXM air-cooled equivalents. The company states an end-to-end facility PUE estimate of approximately 1.1,
      noting that data-centre-level PUE was outside MLCommons scope for that round. No Uptime Institute or
      equivalent third-party annual audit has been published. Expert data-centre practitioners note that consistent
      sub-1.05 annual PUE is technically exceptional and typically measured under best-case single-site conditions.

      Firmus AI Cloud services carry ISO 27001 and SOC-2 compliance claims with encryption in transit and at rest.
      No public certificate registry link has been published; scope across AI Factory physical infrastructure
      versus cloud services only is unclear. An FCAS certification from AEMO covers Synert grid participation
      at existing production sites. There is a name-space risk: Firmus Pte Ltd (firmussec.com) is a separate
      Singapore cybersecurity company holding CREST accreditation — diligence must confirm which entity holds
      which compliance credential.
