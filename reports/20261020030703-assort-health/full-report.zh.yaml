  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：行政型患者接入
        blocks:
          - type: paragraph
            body: >-
              有证据支持的市场，是医疗服务提供者与患者之间的行政层：呼入电话、排诊与改期、接诊、转诊、资格核验、触达、支付沟通和日常任务路由。这个边界窄于整个医疗 AI
              市场，却宽于单纯语音接听。它包括附着在患者接入上的工作流编排，但已审阅的产品材料没有证明诊断、治疗交付、付款方承保、理赔裁决或核心 EHR 属于可服务的产品类别。现实替代方案包括前台员工、外包呼叫中心、旧式
              IVR、单点排诊工具和人工跟进。这个定义很重要，因为泛化的“医疗 AI”估算会把 Assort 目前没有证据证明能够销售的支出也算进去。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 不编造 TAM 的市场测算
        blocks:
          - type: paragraph
            body: >-
              现有资料没有披露品类收入、相关医疗服务提供者的软件预算、合同金额，或按方法定义的 TAM、SAM、SOM。因此，用部署和能力作为锚点更稳妥。2026 年 5 月，据报道 Activate 已在超过 1,000
              家医疗服务提供者中使用；而公司联合发布的新闻稿称，更广的平台服务数百个组织、超过 5,000 家医疗服务提供者。当前公司材料称覆盖超过 23 个专科，并接入超过 15 个 EHR
              或诊所管理平台。交互语料的公司口径从 5 月超过 150 million、6 月 190 million，升至当前主页的 300
              million，但这些日期不同的公司口径只能说明能力或数据规模，不能视为经独立测量的市场增长，也不能据此外推市场价值。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
