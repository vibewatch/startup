        - label: 工作流决策路径
          value: 1.6M
          unit: unique decision pathways
          detail: 2026 年 5 月公司表述，由 Fierce Healthcare 和 PR Newswire 报道
        - label: 医疗服务协议
          value: 62,000
          unit: complex care protocols
          detail: 2026 年 5 月至 6 月公司表述
        - label: 更广泛的平台部署
          value: 5,000+
          unit: providers
          detail: 2026 年 5 月公司发布的公告
        - label: Activate 部署
          value: 1,000+
          unit: providers
          detail: 2026 年 5 月上线报道
        - label: 集成触点
          value: 15+
          unit: EHR and PMS platforms
          detail: 当前公司及第三方简介中的表述
    approximationNotes: 各项数值的单位和分母不同，不能相加，也不与价值成比例。该层级是证据地图，不是转化漏斗，也不是 TAM/SAM/SOM 计算。
    claimRefs:
      - CM008
      - CM009
      - CM011
      - CM012
      - CM013
      - CM015
  - id: FP001
    title: 供应商编写的竞争定位图
    type: quadrant
    summary: 对 Assort Health 定性比较的序数化呈现可用于设计测试，但不是独立排名。
    data:
      xAxis:
        label: 专科排班深度
        min: 1
        max: 5
      yAxis:
        label: 行政工作流广度
        min: 1
        max: 5
      points:
        - label: Assort Health
          x: 5
          'y': 5
          note: 根据深度专科和全平台表述推断的供应商自评分
        - label: Hyro
          x: 2
          'y': 3
          note: 供应商比较中的综合医疗系统联络中心定位
        - label: Luma Health
          x: 3
          'y': 4
          note: 供应商比较中，面向广泛患者服务且专科深度中等的套件
        - label: Artera
          x: 2
          'y': 4
          note: 通信广度较高，但其声称的专科深度较低
        - label: Notable Health
          x: 3
          'y': 5
          note: 工作流自动化广度较高，专科实施可配置
        - label: Hello Patient
          x: 2
          'y': 2
          note: 以诊所为重点的排班与通信范围
        - label: Transform9
          x: 2
          'y': 2
          note: 基于规则的语音模块，并声称存在工作流缺口
    approximationNotes: 分数是分析师根据 Assort 编写的一项定性比较创建的序数编码。它们不是实测表现、市场份额或独立验证的能力分数，等距也不代表差异相等。
    claimRefs:
      - CP003
      - CP014
  - id: FI001
    title: 收入到毛利的投资判断桥
    type: flow
    summary: 公开记录支持这一运营链条，但不包含量化毛利所需的合同金额或成本扣除。
    data:
      nodes:
        - id: customer-demand
          label: 患者服务需求
          detail: 呼入、外呼活动、转诊、接诊和支付工作流
        - id: workflow-products
          label: 已连接产品
          detail: Concierge、Activate、Orchestrate 和 Empower
        - id: contract-scope
          label: 合同范围
          detail: 通话量、站点、专科、模块和集成深度
        - id: recurring-revenue
          label: 经常性收入
          detail: 平台和使用量经济模型合理，但未披露
        - id: deployment-revenue
          label: 部署收入
          detail: 实施费用由第三方报道，未经供应商确认
        - id: delivery-cost
          label: 交付成本
          detail: 电话服务、推理、集成、QA 和支持成本未量化
        - id: gross-profit
          label: 毛利
          detail: 无法根据公开证据计算
    approximationNotes: 仅为概念流程；节点顺序不代表已披露的转化率、金额或利润率。
    claimRefs:
      - CI001
      - CI002
      - CI009
      - CI013
  - id: FE001
    title: 公开披露的产品架构栈
    type: stack
    summary: 逻辑架构展示了患者渠道、工作流产品、配置、集成、数据表述和保障依赖如何共同构成已披露的运营模式。
    data:
      layers:
        - label: 患者互动界面
          detail: 语音、SMS/短信、电子邮件、网页、数字表单以及转诊/传真入口。
          items:
            - 语音
            - SMS/短信
            - 电子邮件
            - 网页
            - 数字表单
            - 转诊与传真
        - label: 患者旅程产品
          detail: 命名产品协调呼入、外呼、编排和面向员工的工作。
          items:
            - Concierge
            - Activate
            - Orchestrate
            - Empower
        - label: 工作流模块
          detail: 排班、分诊、接诊、转诊、资格、续方、支付和任务处理。
          items:
            - 排班
            - 分诊
            - 接诊
            - 转诊
            - 资格
            - 续方
            - 支付
            - 任务
        - label: Synapse 配置
          detail: 根据本地规则和数据生成并定制组织专属工作流。
          items:
            - EHR 数据
            - SOP
            - 排班规则
            - 呼叫流程
            - 付款方协议
            - 测试
        - label: 企业集成
          detail: 平台横跨现有系统运行，而不是替换系统记录源。
          items:
            - EHR 与 PMS
            - CRM
            - 电话服务
            - CCaaS
            - 回写
        - label: 信任与运营控制
          detail: 公开表述涵盖 HIPAA 和 SOC 2 Type II；详细保障措施仍需通过 Trust Center 查看。
          items:
            - HIPAA
            - SOC 2 Type II
            - 人工升级
            - Trust Center
            - 监控缺口
    approximationNotes: 逻辑层按可读性排列，不代表物理部署边界、组件所有权、数据流向或经独立验证的控制覆盖。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE007
      - CE011
      - CE012
  - id: FU001
    title: 客户采用与拓展旅程
    type: journey-map
    summary: 公开证据支持从高流量服务问题走向更广泛工作流的路径；人工升级和客户推荐核查是关卡，而不是自动扩张的结果。
    data:
      items:
        - label: 1. 服务压力
          detail: 高呼入量、长时间等待、季节性高峰或转诊积压，触发最初的购买需求。
          touchpoints:
            - 排班队列
            - 非工作时间来电
            - 转诊积压
        - label: 2. 呼入部署
          detail: 组织将排班、付款方、提供方和升级规则映射到生产工作流中。
          touchpoints:
            - EHR 集成
            - 排班
            - 人工交接
        - label: 3. 运营验证
          detail: 买方会评估解决率、等待时长、人员承载能力、预约准确率和患者满意度。
          touchpoints:
            - 工作流仪表盘
            - 工作人员复核
            - 患者反馈
        - label: 4. 外延拓展
          detail: 已验证的接入工作流可以延伸到召回、医疗服务缺口、爽约挽回和付款触达。
          touchpoints:
            - 启动活动
            - 预约安排
            - 付款收取
        - label: 5. 转诊拓展
          detail: 转诊信息接收、资格核验、路由、触达和预约可以新增第二条生产工作流。
          touchpoints:
            - 传真或 EHR 接收
            - 患者触达
            - 转诊转化
        - label: 6. 续约与客户背书关口
          detail: 专科准确率、升级处理质量、价格、续约条款和客户背书核验，共同决定拓展能否持续。
          touchpoints:
            - 实时工作流测试
            - 客户背书
            - 合同续约
    approximationNotes: 这是基于已披露工作流的概念性顺序，不代表转化率或时间安排，也不表示每位客户都会经过每个阶段。
    claimRefs:
      - CU002
      - CU008
      - CU011
      - CU016
  - id: FR001
    title: 残余风险热力图
    type: matrix
    summary: 在纳入当前可见的缓释措施后，对六类重大风险的定性排序。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
        - label: 残余严重性
      rows:
        - label: PHI 与合规保障
          values:
            - 未量化
            - 严重
            - 未经公开验证
            - 高
        - label: 工作流安全与升级处理
          values:
            - 中
            - 严重
            - 公司描述
            - 高
        - label: EHR 交易完整性
          values:
            - 中
            - 严重
            - 可通过试点测试
            - 高
        - label: 集成与协议漂移
          values:
            - 中
            - 高
            - 取决于流程
            - 中高
        - label: 商业范围模糊
          values:
            - 中
            - 高
            - 取决于合同
            - 中高
        - label: 财务与规模化执行
          values:
            - 未量化
            - 高
            - 已获资本支持但不透明
            - 高
    approximationNotes: 仅为分析师的定性判断；来源集合未提供事件发生频率、经审计的控制有效性、错误率分母、烧钱速度、资金续航或客户群经济性。
    claimRefs:
      - CR002
      - CR005
      - CR010
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 只有在运营验证和安全条款经过测试后，融资消息才会导向有条件的推进决策。
    data:
      nodes:
        - id: financing-mark
          label: 据报道，Series C 估值为 $1.2B
          detail: 这是融资定价标记，不是上市公司估值，也不是运营倍数。
        - id: growth-signal
          label: 公司据报快速增长
          detail: 据报道，15 个月内收入增长 20x，但未披露收入基数。
        - id: commercial-signal
          label: 客户与产品规模信号
          detail: 第三方报道提到客户数超过 200 家；产品规模数据仍属于公司口径。
        - id: evidence-gap
          label: 缺少运营分母
          detail: 留存来源未披露 ARR、利润率、留存率、烧钱速度、资金续航和集中度。
        - id: term-gap
          label: 缺少安全条款
          detail: 优先权、老股转让参与、债务和治理条款均未披露。
        - id: decision
          label: 推进 / 继续研究
          detail: 只有财务、客户和资本结构尽调支持价格与回报判断后，才应推进。
      edges:
        - from: financing-mark
          to: growth-signal
          label: 对照测试
        - from: growth-signal
          to: commercial-signal
          label: 结合交叉验证
        - from: commercial-signal
          to: evidence-gap
          label: 据此评估
        - from: evidence-gap
          to: term-gap
          label: 与……结合
        - from: term-gap
          to: decision
          label: 关口
    approximationNotes: 该流程是定性的，不代表数值转换、估值桥接或概率。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV010
      - CV011
      - CV013
      - CV015
      - CV016
