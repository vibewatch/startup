      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号与下行触发条件
    rows:
      - - 牛市
        - 报道的增长转化为可持续 ARR、强劲留存和利润率，并能在大型医疗系统中重复部署
        - 没有公开价值区间可以支持判断；上行空间取决于经核实的经济数据是否足以支撑当前融资估值，以及是否存在可信的退出路径
        - 仅作方向性判断；经审计的队列数据和独立客户结果会增强这一判断
      - - 基准情景
        - 需求真实存在，但扩张成本、集成工作和企业销售会压低运营杠杆
        - 没有公开价值区间可以支持判断；在 ARR 质量、烧钱、现金跑道和条款披露前，暂缓定价判断
        - 仅作方向性判断；下行触发条件是数据室显示留存率、利润率或集中度不佳
      - - 熊市
        - 融资速度和向高端市场拓展的速度超过了独立证明的结果或可持续单位经济
        - 没有公开价值区间可以支持判断；若里程碑落后于 $1.2B 估值，重新定价或稀释风险会上升
        - 仅作方向性判断；触发条件是结果复现失败、部署缓慢或非标准优先权负担
    notes: 这些是条件性证据情景，不是预测；由于公开财务和证券层面的输入不足，刻意省略了数值概率和估值区间。
