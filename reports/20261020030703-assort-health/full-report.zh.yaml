        title: 风险排序与剩余暴露
        blocks:
          - type: paragraph
            body: >-
              最高的剩余风险来自广泛工作流范围与不完整的独立验证叠加。Assort
              推销的平台覆盖排诊、分诊、接诊、转诊、保险与资格核验、支付和员工任务，因此配置或集成错误的影响可能超出电话接听率。公司披露的规模、患者评分和专科覆盖是有用的运营信号，但不能替代经审计的准确率、升级、安全或回写证据。因此，热力图将工作流安全、PHI
              控制和 EHR 交易完整性置于定价不透明或融资风险之上。由于现有资料没有事件分母、错误率序列或经独立测试的失败频率，发生可能性标签刻意不作量化。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR016
