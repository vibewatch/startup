      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月的融资提供了有意义的资本基础：两家医疗行业媒体报道了 $120 million Series C、超过 $222 million 的累计融资和 $1.2 billion
              估值。管理层另称计划投入超过 $70 million 研发，相当于最新一轮名义金额的 58%
              以上。这个比例说明产品建设激进，不代表现金消耗或剩余流动性；已募集资金不等于可用现金。没有当前现金、月度消耗、债务、营运资本需求和招聘计划，就无法估算资金可支撑期限。因此，财务结论是融资渠道强、商业牵引有希望，但收入质量、交付毛利、留存和资本消耗仍高度不透明。
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI015
              - CI016
