              Assort 的配置合规状况仍无法从这里审阅的公开记录中确定。一份关联方评估称医疗语音 AI 涉及真实的合规和患者信任风险；而一份竞争对手发布的评估称，截至 2026 年 9 月未找到公开的 SOC 2 Type
              II 鉴证、HITRUST 认证、信任页面或 BAA
              声明。该报告不证明控制措施或协议不存在，但使底层文件成为尽调要求。工作流安全同样依赖证据：公司自己的买方指南强调专科规则和上下文交接，而独立商业比较提醒，听起来自信的语音回复可能不同于系统实际接受的动作。在受控试点中
              BAA/安全审查失败，或 EHR 交易无法对账，均是打破投资论点的触发条件。
