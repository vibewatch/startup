      - number: '5.2'
        title: 运营架构与部署模式
        blocks:
          - type: paragraph
            body: >-
              已披露的运营模式是在现有系统之上增加配置化编排层，而不是替代记录系统。Assort 称 Synapse 会接收 EHR
              访问权限、测试环境权限、运营流程、排诊规则和付款方协议，再定制组织专属工作流。医疗系统页面列出 EHR、CRM、电话系统和 CCaaS 依赖，NextGen
              则描述了直接集成和基于本地数据生成工作流。这支持“以集成为核心”的可信部署模式，但还不是完整的技术架构说明：已审阅的公开材料没有披露接口方式、数据延迟、模型边界、可观测性、回滚或人工覆盖行为。因此，实施既取决于底层
              AI，也同样取决于客户数据质量和协议归属；宣传的数周周期应视为有范围限定的供应商指导，而非普适基准。
