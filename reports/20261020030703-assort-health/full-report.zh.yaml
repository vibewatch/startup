              - CM013
              - CM015
      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开材料将医疗系统、联邦认证社区卫生中心、基层医疗诊所和专科医疗集团列为买方。前台、联络中心、转诊、排诊和收入周期团队是运营用户，患者则通过语音和其他渠道与 agent
              互动。经济买方没有统一披露；根据组织规模和工作流，可能归运营、患者接入、信息技术或财务部门。采用通常从漏接电话、人工改期、未完成转诊或催收等高频问题切入，接入 EHR
              和诊所管理系统后，再扩展到相邻工作流。已记录的从呼入排诊转向呼出触达，支持这种“落地后扩张”的判断，但合同结构和预算归属仍属私有信息。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
              - CM016
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              需求来自持续的电话量、有限的员工产能、未排期转诊、爽约、医疗缺口触达和支付催收。早期部署报告显示，买方可以用可观察的工作流结果检验价值：预约完成量、转诊转化、改期和支付完成。采用并非没有摩擦。专科排诊需要遵循提供者特定规则、付款方顺序、转诊上下文和升级路径，并可靠地回写现有系统；因此，落地依赖工作流配置和系统集成，而不只是通用语音模型。估值上，部署基础和工作流扩展支持一个较大机会的假设，但缺少价格、预算、留存和独立品类支出证据，无法把该假设转化为可信的美元市场或可获得份额。投资判断最终应以合同收入和队列扩张数据作为通往
              SOM 的桥梁，而不是交互语料。
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 用部署锚点，不用泛化的医疗 AI TAM
            body: 最强的公开测算证据是医疗服务提供者部署量和工作流广度。要估算美元市场，需要价格、符合条件的医疗服务提供者数量、采用率和预算证据，但现有资料池并未提供。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
          - type: callout
            title: 规模口径未经独立审计
            body: 交互、医疗服务提供者和表现数据均由公司发布或提供给记者。投资判断前，应与客户合同、产品遥测和队列层面的结果核对。
            calloutType: risk
            claimRefs:
              - CM009
              - CM012
              - CM013
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Assort Health 自己的比较页面点名的直接竞品包括 Hyro、Luma Health、Artera、Notable Health、Hello Patient 和
              Transform9，但这份名单不是独立的市场普查。它横跨不同产品出身：语音驱动的联络中心自动化、广泛的患者接入与沟通套件、可配置的工作流自动化，以及面向诊所的排诊 agent。Fierce Healthcare
              还描述了 Artera 的持续投入，以及 Hello Patient 等行政 agent
              公司的出现，说明相邻厂商可能进入同一预算池，而不会永远停留在固定品类。买方也可以保留前台员工、使用传统接听或联络中心系统，或围绕现有 EHR
              自建工作流。这些维持现状和内部建设的选择仍是重要替代方案：它们避免引入新供应商，但保留人员、集成和工作流割裂成本。
            claimRefs:
              - CP004
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP011
              - CP012
              - CP014
      - number: '3.2'
        title: 能力定位广泛，但证据不对称
        blocks:
          - type: paragraph
            body: >-
              Assort Health 声称覆盖超过 23 个专科，接入超过 15 个 EHR
              和诊所管理平台，产品覆盖九类行政工作流。其比较页面特别强调专科排诊、温暖交接、转诊、对事先授权的识别和呼出触达，并按这些维度对七家厂商排名。这种框架有利于
              Assort，应视为供应商定位，而非经独立测试的基准。同一页面也认可 Luma、Artera 和 Notable
              在接入、沟通或工作流覆盖上更广，使套件广度成为可信的反向定位。该地图适合用于尽调分流，但每个评分都需要买方侧演示和客户核验，才能支持采购或投资判断。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP014
      - number: '3.3'
        title: 定价不透明与工作流集成塑造竞争
        blocks:
          - type: paragraph
            body: >-
              现有资料没有为这些厂商提供可比的目录价、单价、最低承诺或实际合同金额。Agent Finder 报道称，Assort 采用询价式企业销售，相比单人诊所，更适合医疗系统和多地点专科诊所。该来源还称，由于需要 EHR
              集成和临床工作流映射，实施要花数周。Assort 另称部署周期为 30 至 45 天。综合来看，分销依赖顾问式销售、集成可信度和运营变更管理，而不是自助式获客。部署后，已经映射的协议和 EHR
              连接可能形成切换摩擦，但现有证据没有量化迁移成本、合同锁定、续约行为、多重采购或渠道经济性。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
      - number: '3.4'
        title: 壁垒假设与被替代风险
        blocks:
          - type: paragraph
            body: >-
              壁垒假设建立在专科协议深度、积累的交互数据、部署经验和集成之上。独立报道确认 Assort 已超越排诊，并完成大额融资；Fierce Healthcare 引述的一位客户称，其在评估市场后选择了
              Assort。这些信号支持其商业相关性，但不能单独证明产品优越性：运营指标仍由公司披露，客户证据是精选的推荐，详细竞品矩阵也由 Assort 编写。商品化风险不低：有资金的沟通和工作流厂商可以加入语音
              agent，广泛套件可以捆绑相邻功能，企业买方也可能偏好更少的供应商。在有可核验的赢单/失单数据、续约与扩张队列、专科准确率基准和迁移证据之前，持久差异化仍未得到证明。
            claimRefs:
              - CP009
              - CP010
              - CP013
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把供应商自编排行榜纳入投资判断
            body: 把这份比较当作尽调清单，而不是排名。要求相同工作流演示、可比定价、生产环境准确率与升级数据，以及至少评估过两家点名替代方案的买方推荐。
            calloutType: risk
            claimRefs:
              - CP004
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与变现
        blocks:
          - type: paragraph
            body: >-
              Assort Health 似乎在变现一套互联企业平台，而不是单个语音机器人。Concierge 支持呼入接入，Activate 支持呼出活动，Orchestrate 自动化就诊相关工作流，Empower
              支持员工；排诊、转诊、接诊、资格核验和支付处理，为同一客户提供多个扩张面。公开定价缺失。第三方评测称合同为定制合同，受电话量、地点数、专科配置和实施影响，但其报告的价格点差异很大，且未经供应商确认。因此，在取得实际订单和发票前，最稳妥的投资判断模型是：企业合同加经常性平台或用量收入，再叠加部署经济性。
