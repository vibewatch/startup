            body: >-
              集成广度既是卖点，也是依赖面。Assort 声称接入超过 15 个 EHR 和诊所管理平台，但列出 logo
              不等于买方配置中的每个预期排诊动作、权限、回退机制和回写路径都能正常工作。公开描述还依赖每家诊所提供正确的专科协议、付款方顺序、升级边界和员工归属。尽调应对每个合成场景核对三条记录：来电者听到了什么、目标系统接受了什么、员工队列还剩什么。如果高风险请求在交接时丢失上下文、失败写入不可见且无人负责，或生产级测试无法复现承诺的工作流，应暂停投资。
