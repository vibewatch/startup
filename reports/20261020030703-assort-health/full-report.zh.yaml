chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与业务范围
        blocks:
          - type: paragraph
            body: >-
              Assort Health 于 2023 年 11 月启动，销售面向医疗患者接入的 AI
              agent。公开描述覆盖呼入与呼出沟通、排诊、接诊、转诊、文件处理、药品续方、资格核验、检验请求和支付，显示其定位是企业工作流平台，而非单一用途的接听服务。公司强调按专科落地：2026 年 4
              月的皮肤科公告称已扩展到四家点名的皮肤科集团，之后的公司材料则称覆盖至少 23
              个专科。这些描述能说明产品方向，但不能独立验证部署质量、组织数量或总部地址。因此，现有证据支持公司身份和业务类别，但地理位置及准确客户规模仍未确定。
            claimRefs:
              - CO001
              - CO002
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO010
      - number: '1.2'
        title: 管理层与资本基础
        blocks:
          - type: paragraph
            body: >-
              创始人 Jon Wang 和 Jeffery Liu 被公开列为联合 CEO，创始人连续性清晰，但也形成了对两位创始人的关键人物依赖，需要通过高管梯队和董事会加以检验。Liu 此前曾任 Facebook 和
              Athelas 软件工程师，具备相关技术与医疗运营背景；现有资料池没有 Wang 的同等独立来源履历。融资从 2025 年的 $76 million Series B 加速到 2026 年 6 月 24 日由
              Menlo Ventures 领投的 $120 million Series C。行业报道将 Series C 估值置于 $1.2 billion，已披露融资额为 $222
              million。投资人名单可见，但董事会权利、投票控制、清算优先权、债务、老股转让和准确持股仍需通过私有资料核实。
