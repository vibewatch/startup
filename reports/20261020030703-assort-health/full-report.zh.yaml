  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Assort
              已不再被定位为只做排诊的语音机器人。当前公开产品覆盖呼入接入、呼出触达、旅程编排和面向员工的工具，点名工作流包括排诊、分诊、接诊、非工作时间接听、转诊、续药、支付和任务管理。这种广度使产品同时适用于专科诊所和医疗系统，但也提高了实施负担，因为每个自动化步骤都必须遵守本地协议和升级边界。最强的外部确认来自运营而非技术：NextGen
              列出原生集成，Fierce Healthcare 描述其向相邻工作流扩展，一家竞品承认 Assort
              在医疗语音领域的覆盖，同时质疑其广度。买方应将每个拟议工作流与真实电话组合对照验证，不应假设完整产品目录在每个部署中都达到同等成熟度。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
              - CE015
