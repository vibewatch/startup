      - number: '5.3'
        title: 成熟度、差异化与证明质量
        blocks:
          - type: paragraph
            body: >-
              Assort 的核心差异化主张是积累的医疗工作流数据：主页称覆盖超过 23 个专科、超过 300 million 次交互，NextGen 则称拥有 62,000 个护理协议和 1.6 million
              条决策路径。这些可能是有价值的实施资产，但属于供应商或合作伙伴口径，而非经独立审计的模型质量指标。Fierce Healthcare 还提供了生产环境使用证据，并引述 MDCS Dermatology
              称两年后预约量增加 20%；这是有意义的客户信号，但仍只是没有对照组的单一推荐。分配到的 Google AI Studio
              页面在预取记录中没有实质正文，因此不纳入其规模预测。指定证据中没有找到公开代码库、软件包、API 文档集、从业者论坛或其他开发者信号，因而难以评估工程迭代速度和集成体验。
            claimRefs:
              - CE010
              - CE011
              - CE014
              - CE016
      - number: '5.4'
        title: 信任、可靠性与路线图风险
        blocks:
          - type: paragraph
            body: >-
              公开安全姿态积极但不完整。Assort 的医疗系统页面称其符合 HIPAA 并取得 SOC 2 Type II 认证，引导买方前往 Trust
              Center，但已审阅的公开材料没有披露详细加密、留存、子处理商、恢复或审计证据。独立比较材料还指出缺少公开状态历史、正常运行时间比例或合同
              SLA，因此没有依据推断其无事故运行。产品风险集中在只能通过采购取得的证据和工作流安全上：买方需要抽样通话准确率、升级与覆盖率、专科边界案例测试、灾难恢复承诺和变更控制记录。Fierce Healthcare
              报道计划投入超过 $70 million 研发，但这一意图不能证明路线图交付或质量。分阶段上线服务线并设定明确验收门槛，是更稳妥的路径。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE013
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开保障弱于产品广度
            body: 公司声称符合 HIPAA 并取得 SOC 2 Type II，但公开证据无法证明正常运行时间、恢复能力、详细安全控制或经独立验证的工作流准确率。在扩展到有限服务线之外前，这些事项应作为合同尽调门槛。
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE009
