      - number: '1.3'
        title: 规模信号与披露质量
        blocks:
          - type: paragraph
            body: >-
              最强的增长信号是管理层称收入在 15 个月内增长了二十倍；由于未披露起始值、结束值、ARR 定义或经审计期间，无法将其换算为收入或运行率。公司对底层交互语料的描述也快速变化：4 月超过 125 million
              次交互，5 月超过 150 million，6 月达到 190 million，2026 年 8 月前超过 200
              million。这一序列与部署增长方向一致，但四个数字都由公司发布，统计的是交互次数，而不是客户、收入或活跃用户。外部指南未找到公开价格，只引用了二手价格估算；准确客户数、员工数、地点、利润率、现金消耗和资金可支撑期限仍无证据支持。
            claimRefs:
              - CO010
              - CO011
              - CO014
      - number: '1.4'
        title: 里程碑与尽调框架
        blocks:
          - type: paragraph
            body: >-
              带日期的证据显示，公司运营历史较短，却快速完成资本扩张和产品扩展：2023 年末启动，2025 年完成 Series B，2026 年春季扩展皮肤科并推出 Activate，6 月完成 Series
              C。后续记录主要是披露，并非经独立验证的运营表现。9 月的一份外部评估未找到公开的 SOC 2、HITRUST、信任中心或 BAA 声明，这是可见性缺口，不代表控制措施不存在。10 月的一份竞品比较称
              Assort 覆盖更窄，缺少福利核验和事先授权自动化，与 Assort
              更宽泛的产品主张冲突；由于批评者是竞争对手，该比较应作为负面尽调线索，而非独立基准。要解决范围和控制问题，还需要客户推荐、安全文件和现场工作流测试。
