        - 经审计或董事会批准的队列数据若显示留存率弱、收入质量低或医疗系统拓展停滞
      - - 产品证明
        - 公司称覆盖 23+ 个专科、完成 300M+ 次互动，并提供广泛的患者服务工作流
        - 独立工作流测试无法复现其准确性、问题解决率或客户结果表述
      - - 反论
        - 第三方报道称已宣布的结果未经独立验证，而向高端市场拓展也提高了执行要求
        - 独立的多客户研究和推荐电话，确认医疗系统规模下的结果可持续
      - - 可比证据
        - 现有的七家供应商比较由公司编写且为定性比较，不是独立定价基准
        - 一套按增长、利润率、留存率和商业模式差异进行标准化的交易与上市公司可比样本
