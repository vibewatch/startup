      - number: '4.2'
        title: 商业牵引力与销售效率信号
        blocks:
          - type: paragraph
            body: >-
              最强的公开商业牵引信号是管理层称收入在 15 个月内增长 20 倍，这一说法由 Fierce Healthcare 转述，而非来自披露的财务报表。客户结果口径提供了合理的付费意愿证据：Assort
              提到预约量和员工产能提升，主页则展示工作流层面的收入结果。但这些是客户受益指标，不是 Assort
              收入，也不能替代留存、实际价格或贡献毛利。企业医疗采购可能需要数月，而公司材料称实施只需数周。这个组合可能支撑大额合同，但也意味着销售工程、系统集成和客户成功的投入强度，在假设高效扩张前必须量化。
