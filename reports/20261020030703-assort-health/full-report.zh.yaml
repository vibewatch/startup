      - number: '4.3'
        title: 单位经济性与成本结构
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以完成传统 SaaS 单位经济性计算。ARR、毛利率、CAC、回本期、NRR、实施成本、推理和电话成本以及支持负担均不可得。不过，披露的运营模式指出了可能的成本中心：语音流量、AI
              推理、专科定制、双向 EHR
              工作、质量保证和实施人工。电话量可以带来有吸引力的经常性用量经济性，但客户特定的协议和集成工作可能压低初始毛利或拉长回本期。点名客户的结果强化了价值主张，但没有公开证据把这些结果与实际合同金额或 Assort
              的交付成本连接起来。
