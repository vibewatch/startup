      - number: '7.4'
        title: 财务、商业与执行终止标准
        blocks:
          - type: paragraph
            body: >-
              $120 million Series C 和已报道的 $222 million 累计融资提高了投资能力，但已募集资金不等于可用现金，也没有披露现金消耗、资金可支撑期限、毛利率或单位经济性。Fierce
              Healthcare 还转述创始人称收入在 15 个月内增长 20 倍；在缺少经审计期间定义或留存数据的情况下，这只是执行信号，不是持久经济性的证明。商业不透明进一步放大问题：公开价格和配置边界有限，而竞品来源与
              Assort 对资格核验和事先授权范围的自述不一致。终止标准包括拒绝提供当前财务和安全材料、试点出现重大错误却没有明确负责的修复路径，或合同语言没有定义高风险工作流和集成范围。
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR007
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 首要投资论点打破条件
            body: 在针对具体配置的试点核对高风险场景中的患者对话、EHR 接受的动作、异常队列和人工升级之前，不要把生产规模纳入投资判断。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: 必备交割资料包
            body: 要求提供安全和 BAA 材料、事故与正常运行时间历史、经审计财务数据、工作流层面的准确率与升级指标、客户集中度，以及合同层面的集成范围。
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR011
              - CR014
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资决策与入场纪律
        blocks:
          - type: paragraph
            body: >-
              可观察的定价锚点是 2026 年 6 月 24 日的 Series C：独立报道称融资额为 $120 million、估值 $1.2 billion，累计募资超过 $222
              million。这是融资定价标记，不是企业价值、收入、ARR、可用现金或可实现退出价格的证据。现有资料报道公司自述增长很快，但没有一份提供当前
              ARR、毛利率、留存、现金消耗、资金可支撑期限、客户集中度或经审计财务数据。缺少这些分母，就无法负责任地计算收入倍数和风险调整回报。因此，恰当决策是跟踪并继续尽调，而不是认可标题式估值；任何入场都应以经验证的经济性和完整
              Series C 条款为前提。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV011
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV011
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: 投资论点、反论点与可比证据
        blocks:
          - type: paragraph
            body: >-
              投资论点是：Assort 已将狭窄的患者接入切口扩展成更广的工作流平台，并有商业牵引证据——公司称收入在 15 个月内增长 20 倍，一家独立媒体报道客户超过 200
              家，公司目前还声称拥有覆盖多个专科的大型交互数据集。反论点是证据质量和执行风险。TechShorts
              明确指出，已宣布的结果未经独立验证；从专科诊所进入医疗系统，也会提高集成和销售执行要求。现有竞品比较由公司编写且偏定性，不能作为独立估值基准。因此，公开证据支持继续尽调产品市场牵引力，而不是支持已付价格。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV015
      - number: '8.3'
        title: 乐观、中性与悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景分析必然是有条件的，而非数字化的。乐观情景要求已报道的增长和客户信号转化为持久
              ARR、强留存、有吸引力的毛利率和可重复的医疗系统部署。中性情景假设需求真实存在，但在这些指标得到验证前，对效率和估值保留判断。悲观情景是快速融资和向高端市场扩张超过了经独立证明的结果，导致增长放缓或未来重新定价。由于运营分母和安全条款缺失，现有证据不足以支持没有公开的估值区间或数字概率。因此，表格列出明确证据门槛和下行触发条件，而不是制造虚假的精确度。
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              已报道的机构轮融资和不断扩大的平台，为后续融资或战略兴趣提供了合理路径，但不能证明具备退出准备度。现有资料没有经审计的财务历史、独立形成的交易或上市公司可比数据、Series C
              优先股堆叠披露，或二级流动性证据。投资决策前，应取得月度 ARR
              和确认收入、毛利率、队列留存、订单额、现金消耗、资金可支撑期限、账户集中度、实施经济性、经独立测量的客户结果，以及完整资本表和条款清单。数据室中的留存或利润率门槛未达标、重大客户集中度、非标准优先权悬垂，或客户访谈无法复现公司披露结果，均是打破投资论点的触发条件。
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
