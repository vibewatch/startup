schemaVersion: "report-v2"
artifact: customers
slug: assort-health
runDate: 2026-10-20
company:
  name: Assort Health
chapter:
  number: 6
  title: Customers
  summary: >-
    Assort Health has current, named production evidence across primary care,
    specialty practices, and an emerging health-system motion, including a
    company-reported footprint of more than 1,300 primary-care providers.
    Public proof is strongest for workflow outcomes such as hold time, staff
    capacity, referral conversion, and appointment booking; retention,
    renewals, account concentration, and independently measured accuracy remain
    material diligence gaps.
sections:
  - id: segments-and-buyers
    title: Customer segments and buying centers
    body: >-
      Assort's public customer base spans primary-care groups, multi-location
      specialty practices, and health systems, with operations, patient-access,
      contact-center, and practice leaders acting as likely buyers while
      front-office and clinical staff use the resulting workflows. The clearest
      current scale signal is company-issued: more than 1,300 providers across
      family medicine, internal medicine, and pediatrics were said to be
      supported in September 2026. Specialty-practice proof is broader by named
      account and use case, while MobiHealthNews identifies John Muir Health as
      a health-system partner. Independent reviewers nevertheless position the
      product toward mid-size and large organizations; custom pricing,
      integration work, and workflow mapping make smaller low-volume practices
      a less evident fit.
    claimRefs:
      - CU001
      - CU008
      - CU009
      - CU012
      - CU013
      - CU014
    tableRefs:
      - TU001
  - id: adoption-and-production-proof
    title: Adoption trajectory and named production proof
    body: >-
      The source set establishes real deployments rather than a logo-only
      customer story, but most outcome data are supplied by Assort or repeated
      from its customers in company-controlled materials. Annapolis Internal
      Medicine reported outreach-driven flu-shot bookings, shorter hold times,
      and higher satisfaction; Pediatric Associates of Southwest Missouri
      reported greater staff capacity and time savings; Boston Bone and Joint
      Institute used outbound automation after weather closures; and the Center
      for Sports Medicine & Orthopaedics described an end-to-end referral
      workflow with a reported conversion rate. These examples span inbound
      access, outbound campaigns, payment collection, and referrals. They show
      workflow breadth and production use, but they do not provide a common
      denominator, audited measurement method, or comparable cohort needed to
      aggregate the results.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU009
      - CU010
    tableRefs:
      - TU002
      - TU003
  - id: durability-expansion-and-procurement
    title: Expansion pathways and durability limits
    body: >-
      Assort's expansion thesis is operational: begin with high-volume inbound
      scheduling or overflow, add outbound outreach, connect referral and
      payment workflows, and write completed actions back into the customer's
      EHR or practice-management system. That sequence can deepen workflow
      penetration if production quality remains acceptable, and the company's
      own buyer guidance appropriately recommends specialty-specific reference
      checks and live testing against each practice's rules. Public evidence
      does not show whether this expansion produces durable recurring revenue.
      None of the reviewed sources discloses NRR, GRR, logo churn, renewal
      length, module penetration by cohort, or top-customer revenue
      concentration. These omissions prevent a defensible conclusion about
      retention or account-level concentration despite visible adoption.
    claimRefs:
      - CU002
      - CU008
      - CU014
      - CU015
      - CU016
    figureRefs:
      - FU001
  - id: evidence-quality-and-diligence
    title: Evidence quality and customer diligence priorities
    body: >-
      Independent evidence is directionally supportive but qualifies the
      headline metrics. AI Health Index identified 13 named customer stories and
      a 94.5 KLAS score, while noting early data and varying sample sizes. It
      also found that public outcomes measure operational results rather than
      routing accuracy, are not independently measured, and lack platform-level
      methods. Named proof is concentrated in ambulatory specialties and
      primary care, leaving higher-acuity categories less validated in public.
      Before underwriting customer durability, diligence should obtain
      account-level retention and cohort data, reference calls outside the
      vendor-selected set, contract and renewal terms, implementation timelines,
      and production accuracy and escalation results segmented by specialty.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale or proof
      - Strategic value
      - Evidence gap
    rows:
      - - Primary-care groups
        - Practice executives and patient-access leaders / front-office and clinical staff / provider organization
        - Scheduling, intake, medication requests, care navigation, and outreach
        - Company-reported support for more than 1,300 providers across family medicine, internal medicine, and pediatrics
        - Broadens the addressable base beyond specialty practices
        - Organization count, contract value, active usage, and renewal data are not disclosed
      - - Multi-location specialty practices
        - Practice and contact-center leaders / scheduling and referral teams / specialty group
        - Complex scheduling, referral intake, after-hours coverage, payments, and overflow
        - Multiple named production examples across orthopedics and other ambulatory specialties
        - Strongest public customer-proof segment and a base for module expansion
        - Evidence is concentrated in selected specialties and mostly vendor-reported
      - - Health systems
        - Ambulatory operations and patient-access executives / centralized access teams / health system
        - Enterprise access, multi-channel workflows, and referral coordination
        - John Muir Health is independently reported as a partner; Assort also markets to health systems
        - Larger deployments can expand workflow and integration depth
        - Public sources do not quantify rollout scale, utilization, or health-system outcomes
      - - Small independent practices
        - Practice owner / front desk / practice
        - Basic scheduling and overflow
        - An affiliate reviewer assesses the product as a weaker fit for low-volume practices
        - Potentially limited because enterprise procurement and integration overhead must be justified
        - No public price, minimum contract, or small-practice payback evidence
    notes: >-
      Segments synthesize the reviewed public sources as of 2026-10-20; scale
      figures are company-reported unless the row says independently reported,
      and revenue contribution is not publicly disclosed.
    claimRefs:
      - CU001
      - CU008
      - CU009
      - CU012
      - CU013
      - CU014
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Reported value
      - Date / period
      - Attribution
      - Confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - - Primary-care provider footprint
        - More than 1,300 providers
        - "2026-09-24"
        - Assort Health release syndicated by PR Newswire
        - Medium
        - Indicates current expansion across three primary-care categories
        - Number of customer organizations, contracted providers, and active usage are not disclosed
      - - Eligible interaction resolution
        - 95% of interactions not requiring staff handoff
        - "2026-09-24"
        - Assort Health release syndicated by PR Newswire
        - Medium
        - Suggests automation depth inside the stated primary-care deployments
        - Interaction count, observation window, and independent validation are absent
      - - Activate provider reach
        - More than 1,000 providers
        - "2026-05-10"
        - Healthcare Chief reporting company statements
        - Medium
        - Supports adoption of outbound workflows before the later primary-care expansion
        - Customer count, active campaign volume, and retention are not disclosed
      - - Named patient-feedback scale
        - 4.3/5 across 344,000 patient reviews
        - Accessed 2026-10-20
        - Assort Health homepage
        - Medium
        - Supplies a broad satisfaction signal
        - Collection method, response rate, specialty mix, and independent audit are not disclosed
      - - Health-system motion
        - John Muir Health named as an ambulatory-operations partner
        - "2026-06-25"
        - MobiHealthNews
        - Medium
        - Provides third-party confirmation of movement into health systems
        - Go-live scope, modules, usage, outcomes, and contract size are not disclosed
    notes: >-
      Metrics preserve the source's unit and period; they are not a comparable
      cohort and should not be combined into a funnel or growth rate.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU009
      - CU010
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Status
      - Reported outcome
      - Evidence quality / limitation
    rows:
      - - Annapolis Internal Medicine
        - Primary care
        - Inbound access and proactive flu-shot outreach across three clinics
        - Production, per company-issued release
        - 61% of flu-shot appointments attributed to outreach; hold times down 75%; satisfaction up 23% to 4.3/5
        - Named customer proof, but no baseline volumes, method, or independent measurement
      - - Pediatric Associates of Southwest Missouri
        - Pediatrics / primary care
        - Inbound scheduling and pediatric workflow routing
        - Production, per company-issued release
        - Staff capacity up 68% and average monthly staff time saved of 45 hours
        - Named customer proof, but period, denominator, and external validation are absent
      - - Boston Bone and Joint Institute
        - Orthopedics
        - Outbound rescheduling after snowstorm closures
        - Production, as reported by Healthcare Chief
        - 53% of affected appointments rescheduled through the system
        - Third-party article repeats deployment data attributed to the company
      - - SENTA Partners
        - Specialty network
        - Proactive referral scheduling campaign
        - Production, as reported by Healthcare Chief
        - 64% of referral appointments scheduled through proactive campaigns
        - Campaign population, period, and conversion denominator are not disclosed
      - - Twin Cities Orthopedics
        - Orthopedics
        - Patient payment outreach
        - Production, as reported by Healthcare Chief
        - 89% of patients paid outstanding balances; nearly half paid within seven days
        - Balance size, cohort selection, observation period, and control are not disclosed
      - - Center for Sports Medicine & Orthopaedics
        - Orthopedics
        - Referral processing, verification, outreach, and booking
        - Production, per company-issued customer quotation
        - About 90% of referrals automated end-to-end and a 77% conversion rate
        - Strong named workflow detail, but the company controls publication and no independent audit is provided
      - - John Muir Health
        - Health system
        - Ambulatory operations partnership
        - Partnership announced; production scope not independently confirmed
        - No public customer outcome in the reviewed source
        - Independent reporting confirms the relationship, not utilization or success
    notes: >-
      This is a sample of named public deployments, not an exhaustive customer
      list; outcomes use different populations and periods, and null outcome
      evidence means the reviewed sources did not disclose a metric.
    enumerationScope:
      coverage: sample
      basis: >-
        Named deployments with usable customer evidence in the assigned
        prefetched source pool reviewed on 2026-10-20.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU009
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public evidence supports a sequence from a high-volume access problem to
      broader workflows, with human escalation and reference checks acting as
      gates rather than an automatic expansion outcome.
    data:
      items:
        - label: "1. Access pressure"
          detail: High inbound volume, long holds, seasonal surges, or referral backlog creates the initial buying trigger.
          touchpoints:
            - Scheduling queue
            - After-hours calls
            - Referral backlog
        - label: "2. Inbound deployment"
          detail: The organization maps scheduling, payer, provider, and escalation rules into production workflows.
          touchpoints:
            - EHR integration
            - Scheduling
            - Human handoff
        - label: "3. Operational proof"
          detail: Buyers evaluate resolution, hold time, staff capacity, appointment accuracy, and patient satisfaction.
          touchpoints:
            - Workflow dashboard
            - Staff review
            - Patient feedback
        - label: "4. Outbound expansion"
          detail: Proven access workflows can extend to recalls, care gaps, no-show recovery, and payment outreach.
          touchpoints:
            - Activate campaigns
            - Appointment booking
            - Payment collection
        - label: "5. Referral expansion"
          detail: Referral ingestion, eligibility, routing, outreach, and booking can add a second production workflow.
          touchpoints:
            - Fax or EHR intake
            - Patient outreach
            - Referral conversion
        - label: "6. Renewal and reference gate"
          detail: Specialty-specific accuracy, escalation quality, price, renewal terms, and reference checks determine durable expansion.
          touchpoints:
            - Live workflow test
            - Customer reference
            - Contract renewal
    approximationNotes: >-
      Conceptual sequence based on disclosed workflows; it does not imply
      conversion rates, timing, or that every customer progresses through every
      stage.
    claimRefs:
      - CU002
      - CU008
      - CU011
      - CU016
callouts:
  - calloutType: strength
    title: Production evidence is named and workflow-specific
    body: >-
      Public materials identify customers, workflows, and operating outcomes
      across primary care, orthopedics, referral operations, and outbound
      campaigns; this is stronger than an undifferentiated logo wall.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU010
  - calloutType: risk
    title: Adoption evidence does not establish retention
    body: >-
      The reviewed public record does not disclose NRR, GRR, logo churn,
      renewal length, cohort expansion, or top-customer revenue concentration,
      so customer durability remains unquantified.
    claimRefs:
      - CU015
  - calloutType: recommendation
    title: Underwrite with customer-level cohort and reference evidence
    body: >-
      Require specialty-matched reference calls, a live test against real
      scheduling rules, account-level usage and retention cohorts, renewal
      terms, and concentration data before treating deployment breadth as
      durable recurring revenue.
    claimRefs:
      - CU011
      - CU014
      - CU016
