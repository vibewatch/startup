  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Account-level NRR, GRR, logo churn, renewal length, module penetration cohorts, and top-customer revenue concentration.
      whyItMatters: >-
        Named deployments and workflow outcomes do not establish durable
        recurring revenue, expansion quality, or concentration exposure.
      diligencePath: >-
        Obtain board- or finance-approved customer cohorts by quarter, revenue
        and module, plus renewal records, contract terms, and top-10 customer
        concentration for the last eight quarters.
      relatedQuestionRefs:
        - QU004
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-outcomes
      missingEvidence: A complete customer roster separating contracted, live, pilot, churned, and announced accounts with deployment dates and modules.
      whyItMatters: >-
        The public sample is vendor-selected and cannot establish the production
        share of the customer base or the representativeness of reported
        outcomes.
      diligencePath: >-
        Reconcile the CRM, billing system, and implementation tracker, then
        sample references across specialty, organization size, deployment age,
        and outcome performance.
      relatedTableRefs:
        - TU003
    - type: missing-source
      severity: material
      topic: independent-validation
      missingEvidence: Independent, specialty-segmented measurements of scheduling accuracy, routing safety, escalation quality, and patient outcomes in production.
      whyItMatters: >-
        Operational gains can coexist with clinically important routing or
        booking errors, and current public figures do not measure those risks.
      diligencePath: >-
        Review blinded production QA samples and independent audits by
        specialty, language, workflow, and escalation class, including error
        severity and remediation timelines.
