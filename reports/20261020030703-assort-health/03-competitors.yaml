      - Differentiation in retained evidence
      - Evidence limitation
    rows:
      - [Assort Health, "Direct: specialty patient-access AI", "$222M total funding and $1.2B valuation reported in June 2026", "Health systems and multi-site specialty practices", "Specialty protocols, broad administrative workflow surface, EHR/PMS integrations", "Performance and comparison metrics are largely company-reported"]
      - [Hyro, "Direct: healthcare contact-center AI", "Unknown in assigned pool", "Large health systems and contact centers", "Voice, chat, SMS, routing, and outbound engagement", "Profile comes from Assort-authored comparison; no independent benchmark retained"]
      - [Luma Health, "Adjacent/direct: patient-access suite", "Unknown in assigned pool", "Health systems and specialty groups", "Voice plus scheduling, messaging, intake, waitlist, and referral tools", "Configuration and specialty-depth claims are not independently verified"]
      - [Artera, "Adjacent/incumbent: patient communications", "$65M financing reported by Fierce Healthcare in December; year not stated in article text", "Practices and health systems", "Broad communications channels and outbound engagement", "Voice maturity and specialty-depth claims rely on Assort's comparison"]
      - [Notable Health, "Adjacent: workflow automation", "Unknown in assigned pool", "Large multi-department health systems", "Configurable care coordination and prior-authorization workflows", "Time-to-value and specialty-depth claims rely on Assort's comparison"]
      - [Hello Patient, "Direct: practice-focused AI agent", "Unknown in assigned pool", "Small to mid-size medical practices", "Voice, text, chat, scheduling, and follow-up", "Referral and prior-authorization gaps are asserted by Assort, not independently tested"]
      - [Transform9, "Direct entrant: physician-practice voice AI", "Unknown in assigned pool", "Specialty physician practices", "Modular scheduling, routing, navigation, and outreach agents", "Beta and integration-status claims come from a competitor-authored page"]
      - [Internal staff / incumbent contact center, "Status quo or internal build", "Organization-specific", "Any provider organization", "Direct control and use of existing workflows", "No comparable cost, service-level, or patient-outcome data in assigned pool"]
    notes: >-
      Partial landscape based only on the assigned prefetched pool; unknown means the pool did not
      contain support, not that the metric or capability does not exist. Assort-authored competitor
      descriptions are not independent verification.
    enumerationScope:
      coverage: sample
      basis: >-
        Named vendors and substitute classes found in the assigned competitor evidence as of
        2026-10-20; the set is not an exhaustive market census.
    claimRefs: [CP004, CP005, CP006, CP009, CP011, CP012, CP014]
  - id: TP002
    title: Evidence-constrained capability matrix
    columns:
      - Buying criterion
      - Assort Health
      - Hyro
      - Luma Health
      - Artera
      - Notable Health
    rows:
      - ["Specialty scheduling depth", "Vendor claims deep protocols across 23+ specialties", "Vendor comparison: general healthcare routing", "Vendor comparison: broad access over specialty depth", "Vendor comparison: limited specialty protocol depth", "Vendor comparison: limited specialty protocol depth"]
      - ["Contextual warm handoff", "Vendor claims native contextual handoff", "Vendor comparison: smart routing; context depth varies", "Vendor comparison: staff handoff with context", "Vendor comparison: staff-assisted routing", "Vendor comparison: human-in-the-loop workflows"]
      - ["Channel breadth", "Vendor claims voice, SMS, email, chat, forms, and fax", "Vendor comparison: voice, chat, SMS, mobile", "Vendor comparison: voice, SMS, chat, email", "Vendor comparison: broad voice and messaging set", "Vendor comparison: voice, SMS, and web intake"]
      - ["Outbound engagement", "Vendor claims native inbound and outbound modules", "Vendor comparison: outbound health-system campaigns", "Vendor comparison: reminders, recall, waitlist", "Vendor comparison: communications-led outreach strength", "Vendor comparison: configurable referral and follow-up flows"]
      - ["Referral workflow", "Vendor claims automated intake and closed-loop scheduling", "Vendor comparison says no closed-loop referral intake", "Vendor comparison cites Fax Transform; closure depends on configuration", "Vendor comparison says no referral intake", "Vendor comparison cites referral monitoring"]
      - ["Prior authorization / eligibility", "Vendor claims real-time eligibility and payer rules", "Vendor comparison says unsupported", "Vendor comparison cites eligibility with limited sequencing depth", "Vendor comparison says unsupported", "Vendor comparison cites prior-authorization workflows"]
    notes: >-
      Every competitor cell is a paraphrase of Assort Health's August 2026 comparison and is
      therefore vendor-authored positioning, not an independent feature test. Unsupported claims
      are not converted into a negative score.
    claimRefs: [CP001, CP002, CP003, CP004]
  - id: TP003
    title: Pricing and packaging evidence
    columns:
      - Vendor or alternative
      - Public price
      - Unit / contract model
      - Included capabilities
      - Underwriting implication
    rows:
      - [Assort Health, "Not published", "Enterprise sales-led; exact unit and minimum unknown", "Scheduling, referrals, insurance and other patient-access workflows; packaging unknown", "Obtain volume tiers, implementation fees, minimums, discounts, and renewal terms"]
      - [Hyro, "Unknown in assigned pool", "Unknown", "Multi-channel contact-center functions described; packaging unknown", "Run a like-for-like quote on identical call volumes and workflows"]
      - [Luma Health, "Unknown in assigned pool", "Unknown", "Broad patient-access suite described; module bundling unknown", "Separate voice price from wider access-platform cost"]
      - [Artera, "Unknown in assigned pool", "Unknown", "Communications and outbound tools described; packaging unknown", "Test whether voice is bundled with incumbent communications spend"]
      - [Notable Health, "Unknown in assigned pool", "Unknown", "Workflow modules described; packaging unknown", "Include customer configuration and services cost"]
      - [Hello Patient, "Unknown in assigned pool", "Unknown", "Practice-focused communication and scheduling described", "Compare enterprise overhead against smaller-practice fit"]
      - [Transform9, "Unknown in assigned pool", "Unknown", "Modular voice agents described; packaging unknown", "Price beta or incomplete integrations as execution risk"]
    notes: >-
      Pricing coverage is incomplete. Only Assort's lack of public pricing is supported by a
      retained review; all competitor price, discount, implementation, and realized-contract
      fields remain diligence gaps.
    claimRefs: [CP006, CP007, CP008]
figures:
