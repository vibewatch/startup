    data:
      xAxis:
        label: Specialty scheduling depth
        min: 1
        max: 5
      yAxis:
        label: Administrative workflow breadth
        min: 1
        max: 5
      points:
        - {label: Assort Health, x: 5, y: 5, note: "Vendor self-score implied by deep specialty and full-platform claims"}
        - {label: Hyro, x: 2, y: 3, note: "General health-system contact-center profile in vendor comparison"}
        - {label: Luma Health, x: 3, y: 4, note: "Broad patient-access suite with moderate specialty depth in vendor comparison"}
        - {label: Artera, x: 2, y: 4, note: "Communications breadth with lower claimed specialty depth"}
        - {label: Notable Health, x: 3, y: 5, note: "Broad workflow automation with configurable specialty implementation"}
        - {label: Hello Patient, x: 2, y: 2, note: "Practice-focused scheduling and communications scope"}
        - {label: Transform9, x: 2, y: 2, note: "Rules-based voice modules with claimed workflow gaps"}
    approximationNotes: >-
      Scores are analyst-created ordinal encodings of one Assort-authored qualitative comparison.
      They are not measured performance, market share, or independently verified capability
      scores, and equal spacing does not imply equal differences.
    claimRefs: [CP003, CP014]
