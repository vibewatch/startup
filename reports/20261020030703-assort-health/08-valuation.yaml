schemaVersion: "report-v2"
artifact: "valuation"
slug: "assort-health"
runDate: 2026-10-20
company:
  name: "Assort Health"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Assort Health's June 2026 Series C established a reported $1.2 billion financing
    valuation after rapid company-reported growth, but the retained public evidence
    does not disclose the recurring-revenue, margin, retention, concentration, or
    financing-term inputs needed to underwrite that price. The resulting stance is
    track/research more: operational signals merit diligence, while entry should remain
    conditional on a financial data room, independent outcome validation, and the full
    capitalization and preference stack.
sections:
  - id: "investment-decision"
    title: "Investment decision and entry discipline"
    body: >-
      The observable pricing anchor is the June 24, 2026 Series C: independent coverage
      reports a $120 million round at a $1.2 billion valuation, with total capital raised
      above $222 million. That is a financing mark, not evidence of enterprise value,
      revenue, ARR, cash available, or a realizable exit price. The retained sources
      report rapid company-claimed growth, but none supplies current ARR, gross margin,
      retention, burn, runway, customer concentration, or audited financials. Without
      those denominators, a revenue multiple and risk-adjusted return cannot be
      calculated responsibly. The appropriate decision is therefore to track and
      continue diligence rather than endorse the headline mark; any entry should be
      conditioned on verified economics and complete Series C terms.
    claimRefs: [CV001, CV002, CV003, CV005, CV011, CV013, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: "thesis-and-antithesis"
    title: "Thesis, anti-thesis, and comparable evidence"
    body: >-
      The thesis is that Assort has converted a narrow patient-access wedge into a
      broader workflow platform and has evidence of commercial pull: the company
      reported 20-fold revenue growth over fifteen months, one independent outlet
      reported more than 200 customers, and the company now claims a large interaction
      dataset across many specialties. The anti-thesis is evidence quality and
      execution risk. TechShorts explicitly notes that the announced outcomes were not
      independently validated, while moving from specialty practices into health
      systems raises integration and sales-execution demands. The available competitor
      comparison is company-authored and qualitative, so it cannot serve as an
      independent valuation benchmark. Public evidence therefore supports further
      diligence on product-market pull, not the price paid.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV012, CV015]
    tableRefs: [TV002]
  - id: "scenario-analysis"
    title: "Bull, base, and bear framing"
    body: >-
      Scenario analysis is necessarily conditional rather than numerical. A bull case
      requires the reported growth and customer signals to translate into durable ARR,
      strong retention, attractive gross margin, and repeatable health-system
      deployments. The base case assumes genuine demand but reserves judgment on
      efficiency and valuation until those metrics are verified. The bear case is that
      rapid funding and an upmarket expansion outpace independently demonstrated
      outcomes, causing slower growth or a future repricing. No public valuation range
      or numeric probability is supportable from the retained evidence because the
      operating denominator and security terms are missing. The table therefore states
      explicit evidence thresholds and downside triggers instead of false precision.
    claimRefs: [CV005, CV006, CV009, CV011, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: "exit-readiness-and-diligence"
    title: "Exit readiness and final diligence asks"
    body: >-
      The reported institutional round and expanding platform create a plausible path to
      later-stage financing or strategic interest, but they do not establish exit
      readiness. The retained source set contains no audited financial history,
      independently derived trading or transaction comparables, disclosure of the
      Series C preference stack, or evidence of secondary liquidity. Before an
      investment decision, diligence should obtain monthly ARR and recognized revenue,
      gross margin, cohort retention, bookings, burn, runway, account concentration,
      implementation economics, independently measured customer outcomes, and the full
      capitalization table and term sheet. Thesis-break triggers are failed retention
      or margin thresholds in the data room, material customer concentration,
      non-standard preference overhang, or failure to reproduce company-reported
      outcomes in customer reference calls.
    claimRefs: [CV006, CV011, CV012, CV013, CV015, CV016]
tables:
  - id: "TV001"
    title: "Recommendation summary table"
    columns: ["Decision element", "Current view", "Evidence basis", "Decision implication"]
    rows:
      - ["Recommendation", "Track / research more", "Reported $1.2B financing mark with material operating-data gaps", "Do not underwrite an entry until the data room closes the named gaps"]
      - ["Confidence", "Medium-low", "Round terms and operating denominators are not public", "Treat the view as provisional and evidence-sensitive"]
      - ["Risk rating", "High", "Upmarket execution and independent outcome validation remain open", "Require customer references and health-system deployment evidence"]
      - ["Valuation stance", "Stretched / unsupported by public fundamentals", "No current ARR, margin, retention, or comparable multiple in the retained evidence", "Negotiate from verified economics and security terms, not the headline mark"]
    notes: "Assessment uses the retained public sources as of 2026-10-20; no revenue multiple, return target, or entry range is estimated because the required denominators and financing terms are unavailable."
    claimRefs: [CV001, CV002, CV003, CV006, CV011, CV013, CV016]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns: ["Lens", "Evidence-backed argument", "What would change the view"]
    rows:
      - ["Thesis", "Company-reported 20x revenue growth in 15 months and third-party reporting of 200+ customers indicate commercial pull", "Audited or board-approved cohort data showing weak retention, low-quality revenue, or stalled health-system expansion"]
      - ["Product proof", "Company claims 300M+ interactions across 23+ specialties and a broad patient-access workflow", "Independent workflow testing that fails to reproduce accuracy, resolution, or customer outcome claims"]
      - ["Anti-thesis", "Third-party coverage says announced outcomes were not independently validated, while upmarket expansion raises execution demands", "Independent multi-customer studies and reference calls confirming durable outcomes at health-system scale"]
      - ["Comparable evidence", "The available seven-vendor comparison is company-authored and qualitative, not an independent pricing benchmark", "A transaction and public-company comp set normalized for growth, margin, retention, and business-model differences"]
    notes: "Company-issued product and competitor claims are identified as such and are not treated as independent benchmarks."
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV012, CV015]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Explicit assumptions", "Valuation / return logic", "Probability signal and downside trigger"]
    rows:
      - ["Bull", "Reported growth converts into durable ARR, strong retention and margins, and repeatable large health-system deployments", "No public value range is supportable; upside requires verified economics that justify the current financing mark and a credible exit path", "Directional only; strengthened by audited cohorts and independent customer outcomes"]
      - ["Base", "Demand is real but scaling costs, integration work, and enterprise sales temper operating leverage", "No public value range is supportable; defer pricing judgment until ARR quality, burn, runway, and terms are disclosed", "Directional only; downside trigger is weak retention, margin, or concentration in the data room"]
      - ["Bear", "Funding velocity and upmarket expansion outpace independently demonstrated outcomes or durable unit economics", "No public value range is supportable; repricing or dilution risk rises if milestones lag the $1.2B mark", "Directional only; trigger is failed outcome replication, slow deployments, or non-standard preference overhang"]
    notes: "These are conditional evidence cases, not forecasts; numeric probabilities and valuation ranges are intentionally omitted because public financial and security-level inputs are insufficient."
    claimRefs: [CV002, CV005, CV006, CV009, CV011, CV014, CV015, CV016]
figures:
  - id: "FV001"
    title: "Recommendation logic"
    type: "flow"
    summary: "The financing headline leads to a conditional track decision only after operating proof and security terms are tested."
    data:
      nodes:
        - id: "financing-mark"
          label: "$1.2B reported Series C valuation"
          detail: "A financing mark, not a public-company valuation or operating multiple."
        - id: "growth-signal"
          label: "Rapid company-reported growth"
          detail: "20x revenue growth over 15 months was reported, without a disclosed revenue base."
        - id: "commercial-signal"
          label: "Customer and product-scale signals"
          detail: "Third-party reporting cites 200+ customers; product-scale figures remain company claims."
        - id: "evidence-gap"
          label: "Operating denominator missing"
          detail: "ARR, margin, retention, burn, runway, and concentration are not disclosed in the retained sources."
        - id: "term-gap"
          label: "Security terms missing"
          detail: "Preferences, secondary participation, debt, and governance terms are not disclosed."
        - id: "decision"
          label: "Track / research more"
          detail: "Advance only after financial, customer, and capitalization diligence supports price and return."
      edges:
        - from: "financing-mark"
          to: "growth-signal"
          label: "test against"
        - from: "growth-signal"
          to: "commercial-signal"
          label: "corroborate with"
        - from: "commercial-signal"
          to: "evidence-gap"
          label: "underwrite using"
        - from: "evidence-gap"
          to: "term-gap"
          label: "combine with"
        - from: "term-gap"
          to: "decision"
          label: "gates"
    approximationNotes: "The flow is qualitative and does not imply a numeric conversion, valuation bridge, or probability."
    claimRefs: [CV001, CV005, CV006, CV009, CV010, CV011, CV013, CV015, CV016]
