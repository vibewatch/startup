  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public repository activity, API or SDK documentation, package metrics, practitioner discussion, or another credible developer-signal proxy.
      whyItMatters: Without a developer surface or practitioner proxy, integration ergonomics, release velocity, and implementation maintainability cannot be independently assessed.
      diligencePath: Request API documentation, release notes, integration certification records, and references from customer engineering teams that operate supported EHR and CCaaS connections.
      relatedQuestionRefs: [QE009]
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Historical uptime, incident log, contractual SLA, recovery objectives, escalation rates, and sampled-call workflow-accuracy results.
      whyItMatters: Patient access and triage workflows are operationally sensitive, and the absence of public incident records is not proof that incidents have not occurred.
      diligencePath: Obtain status history, incident postmortems, SLA credit terms, RTO and RPO commitments, sampled-call audits, and specialty-specific escalation metrics under diligence.
      relatedQuestionRefs: [QE010]
    - type: private-evidence-only
      severity: material
      topic: security-compliance
      missingEvidence: Current SOC 2 report, BAA terms, subprocessor list, encryption standards, retention controls, penetration-test summary, and security exception history.
      whyItMatters: Public certification statements do not expose the scope, exceptions, or operating effectiveness of controls applied to protected health information.
      diligencePath: Review the Trust Center under NDA with security and privacy counsel and map every control to the proposed data flows and deployment boundary.
      relatedQuestionRefs: [QE006, QE010]
    - type: missing-source
      severity: minor
      topic: roadmap
      missingEvidence: Dated delivery milestones and customer adoption evidence for the broader patient-journey roadmap associated with the planned R&D investment.
      whyItMatters: An investment intention does not establish that modules will ship, integrate, or achieve production adoption on schedule.
      diligencePath: Request the product roadmap, release history, module-level adoption, slipped milestones, and design-partner references.
      relatedQuestionRefs: [QE004, QE005]
