evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: scale-and-financials
    missingEvidence: >-
      Current absolute revenue, ARR, gross margin, burn, runway, customer count, headcount, headquarters, and
      operating-location data with definitions and dates.
    whyItMatters: >-
      Growth multiples and interaction counts cannot establish revenue scale, capital efficiency, customer
      concentration, or organizational capacity.
    diligencePath: >-
      Request audited financial statements, the current board pack, customer and employee rosters, and legal-entity and
      office records.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance-and-cap-table
    missingEvidence: >-
      A complete executive and board roster, ownership table, voting rights, financing preferences, secondary-sale
      details, debt schedule, and leadership-change history.
    whyItMatters: The public founder and investor lists do not establish governance, control, dilution, or succession risk.
    diligencePath: >-
      Obtain the current cap table, charter, voting agreement, investor-rights agreement, board minutes, executive
      roster, and all Series C closing documents.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: product-scope-and-security
    missingEvidence: >-
      Independent workflow-level tests, customer references, integration documentation, and current security and
      compliance artifacts.
    whyItMatters: >-
      Company descriptions of broad workflow coverage conflict with a competitor's narrower characterization, while
      absence of public control documents does not establish whether controls exist.
    diligencePath: >-
      Run scripted reference calls and a live pilot across scheduling, eligibility, prior authorization, payments, and
      escalation; review SOC 2, HITRUST, BAA, subprocessor, audit-log, and incident-response materials under NDA.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-timeline
    missingEvidence: >-
      A complete dated chronology of incorporation, Series A, partnerships, regulatory milestones, material incidents,
      and leadership changes.
    whyItMatters: >-
      The retained pool supports eight dated financing, product, scale-disclosure, and diligence entries but not a
      complete corporate history.
    diligencePath: >-
      Request the corporate chronology and verify each entry against formation records, financing documents, board
      minutes, partner announcements, and incident logs.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A source-defined market revenue base, eligible-provider denominator, adoption rate, and pricing methodology for a
      dollar TAM, SAM, and SOM.
    whyItMatters: >-
      Without comparable denominators and price evidence, deployment counts cannot be converted into market value or
      obtainable share.
    diligencePath: >-
      Obtain customer contracts and pricing cohorts, define eligible provider organizations by workflow, and reconcile
      the result against an independent provider census.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Contract pricing basis, average contract value, procurement owner, sales-cycle length, retention, and module
      expansion by buyer segment.
    whyItMatters: >-
      These inputs determine budget availability, sales friction, revenue density, and a defensible obtainable-market
      estimate.
    diligencePath: >-
      Review a stratified contract sample, CRM pipeline data, renewal cohorts, and reference calls with operational and
      economic buyers.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent audits of provider counts, interaction-corpus definitions, workflow accuracy, and deployment outcome
      metrics.
    whyItMatters: >-
      Most scale and outcome evidence is company-issued or company-supplied, limiting confidence in adoption and
      performance claims.
    diligencePath: >-
      Reconcile product telemetry to invoices and customer contracts, then verify outcomes with named customer
      references and pre/post extracts.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM007
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: >-
      Independent win-loss records by competitor, buyer segment, specialty, and contract size; renewal, expansion,
      churn, and multi-homing cohorts are unavailable.
    whyItMatters: >-
      Without buyer-level outcomes, vendor positioning and selected testimonials cannot establish durable competitive
      advantage or displacement risk.
    diligencePath: >-
      Review CRM win-loss exports and renewal cohorts, then reference-check at least five won, five lost, and three
      churned accounts against named alternatives.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: competitive-pricing
    missingEvidence: >-
      Comparable list and realized pricing, implementation fees, volume tiers, minimum commitments, discounts, contract
      duration, and renewal escalators for each named vendor.
    whyItMatters: >-
      Pricing opacity prevents assessment of cost advantage, bundling pressure, discounting, and whether switching costs
      translate into pricing power.
    diligencePath: >-
      Run a common RFP using identical call volume, specialty complexity, integrations, and service levels, then
      normalize total three-year cost.
    relatedQuestionRefs:
      - QP004
      - QP008
  - type: missing-source
    severity: material
    topic: capability-benchmark
    missingEvidence: >-
      Independent head-to-head measurements of scheduling accuracy, containment, escalation, latency, patient
      satisfaction, implementation time, and error severity on identical cases.
    whyItMatters: >-
      The retained capability comparison is company-authored and cannot verify relative product quality, safety, or
      specialty depth.
    diligencePath: >-
      Conduct a blinded pilot with the same specialty protocols and scored test set across at least Assort and two
      shortlisted alternatives.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      ARR, GAAP revenue, recurring mix, gross margin by module, inference and telephony costs, implementation hours,
      support burden, CAC, and payback.
    whyItMatters: These inputs determine whether rapid adoption converts into scalable contribution margin and efficient growth.
    diligencePath: >-
      Review audited financials, revenue schedules, cloud and telephony invoices, implementation time sheets, and
      cohort-level contribution margins.
    relatedQuestionRefs:
      - QI005
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: GRR, NRR, logo churn, module attach rates, cohort expansion, discounting, and customer concentration.
    whyItMatters: The connected-platform thesis depends on durable renewals and expansion rather than implementation-led growth.
    diligencePath: >-
