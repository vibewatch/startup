schemaVersion: "report-v2"
artifact: risks
slug: assort-health
runDate: 2026-10-20
company:
  name: Assort Health
chapter:
  number: 7
  title: Risks
  summary: >-
    Assort Health's widening role across scheduling, triage, referrals, eligibility, payments, and
    EHR-connected workflows creates meaningful workflow-safety, privacy, integration, and execution
    exposure. The public evidence supports a structured diligence program, but it does not establish
    audited security controls, incident history, unit economics, or configuration-level reliability.
sections:
  - id: risk-ranking
    title: Risk ranking and residual exposure
    body: >-
      The highest residual risks arise from the combination of broad workflow scope and incomplete
      independent verification. Assort markets a platform spanning scheduling, triage, intake,
      referrals, insurance and eligibility, payments, and staff tasks, so a configuration or
      integration error could affect more than call containment. Company-reported scale, patient
      ratings, and specialty coverage are useful operating signals, but they do not substitute for
      audited accuracy, escalation, security, or write-back evidence. The heatmap therefore rates
      workflow safety, PHI controls, and EHR transaction integrity above pricing opacity or financing
      risk. Likelihood labels are deliberately unquantified because the retained sources contain no
      incident denominator, error-rate series, or independently tested failure frequency.
    claimRefs: [CR001, CR002, CR003, CR005, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, privacy, and workflow-safety exposure
    body: >-
      The public record reviewed here does not resolve Assort's configuration-level compliance
      posture. An affiliate review describes healthcare voice AI as carrying real compliance and
      patient-trust stakes, while a competitor-issued review reports that it could not find a public
      SOC 2 Type II attestation, HITRUST certification, trust page, or BAA statement as of September
      2026. That report is not proof that the controls or agreements are absent; it makes the
      underlying documents a diligence requirement. Workflow safety is similarly evidence-sensitive:
      the company's own buyer guidance emphasizes specialty rules and contextual handoffs, while an
      independent commercial comparison warns that a confident spoken response can differ from the
      accepted system action. A failed BAA/security review or unreconciled EHR transaction in a
      controlled pilot is a thesis-break trigger.
    claimRefs: [CR006, CR008, CR010, CR011, CR013, CR014]
    tableRefs: [TR001]
  - id: operational-dependencies
    title: Operational, quality, and dependency risk
    body: >-
      Integration breadth is both a selling point and a dependency surface. Assort claims integrations
      across more than fifteen EHR and practice-management platforms, but a listed logo does not prove
      that every intended scheduling action, permission, fallback, and write-back path works in the
      buyer's configuration. Public descriptions also depend on each practice supplying correct
      specialty protocols, payer sequencing, escalation boundaries, and staff ownership. Diligence
      should reconcile three records for every synthetic scenario: what the caller heard, what the
      target system accepted, and what remained in the staff queue. Investment should pause if
      high-risk requests lose context during handoff, if failed writes are not visible and owned, or
      if production-like testing cannot reproduce the promised workflow.
    claimRefs: [CR004, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: financial-commercial-kill-criteria
    title: Financial, commercial, and execution kill criteria
    body: >-
      The $120 million Series C and reported $222 million of total funding improve capacity to invest,
      but funding raised is not cash available and does not disclose burn, runway, gross margin, or
      unit economics. Fierce Healthcare also relays a founder-stated 20-fold revenue increase over
      fifteen months; without audited period definitions or retention data, that claim is an execution
      signal rather than proof of durable economics. Commercial opacity compounds the issue because
      public pricing and configuration boundaries are limited, while competitor sources disagree with
      Assort's own presentation of eligibility and prior-authorization scope. Kill criteria are a
      refusal to provide current financials and security artifacts, material pilot error without an
      owned remediation path, or contract language that leaves high-risk workflows and integrations
      undefined.
    claimRefs: [CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk
      - Public evidence status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - PHI governance and BAA coverage
        - Public certifications, trust materials, and BAA terms were not established by the retained evidence
        - Unquantified
        - Critical
        - Unverified
        - High
        - Obtain the BAA, latest risk analysis, SOC 2 report, subprocessor list, and audit-log retention policy
      - - Triage and escalation boundaries
        - Assort markets triage and contextual handoffs, but no independent error-rate evidence was retained
        - Medium
        - Critical
        - Company-described
        - High
        - Run red-flag and ambiguous-intent tests with clinical governance sign-off and traceable escalation ownership
      - - Accepted transaction versus spoken outcome
        - A commercial comparison identifies the risk that a positive response may not match the system action
        - Medium
        - High
        - Buyer-test framework available
        - High
        - Reconcile recordings, EHR audit logs, and staff queues for every pilot scenario
      - - Eligibility and prior-authorization representations
        - Official and competitor-issued descriptions conflict on scope and implementation coverage
        - Medium
        - High
        - Contract-dependent
        - Medium-high
        - Define each included payer, transaction, data source, exception route, and service-level commitment in the order form
    notes: >-
      Partial public-source register as of 2026-10-20; likelihood is qualitative and unquantified,
      and missing public control evidence is not treated as evidence that a control is absent.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly identifiable regulatory, privacy, and workflow-safety issues in the assigned source
        pool; private contracts, audits, regulator records, and incident logs were unavailable.
    claimRefs: [CR006, CR008, CR010, CR011, CR013, CR014]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - EHR write-back differs from the caller-facing outcome
        - Medium
        - Critical
        - Testable but not publicly validated
        - High
        - Configuration-level transaction accuracy and rollback evidence
      - - Urgent or ambiguous request loses context during human handoff
        - Medium
        - Critical
        - Company-described workflow
        - High
        - Escalation recall, routing accuracy, and time-to-owner by specialty
      - - Practice rules or payer sequencing drift after deployment
        - Medium
        - High
        - Protocol-driven implementation
        - Medium-high
        - Change-control ownership, regression-test cadence, and exception monitoring
      - - Broad workflow outage or degraded integration interrupts multiple access tasks
        - Low-medium
        - High
        - Not established in public evidence
        - Medium-high
        - Availability history, disaster recovery tests, manual fallback, and status-notification terms
    notes: >-
      Analyst risk ratings synthesize company product descriptions and external buyer-test guidance;
      no audited incident rate, uptime series, or production error denominator was available.
    claimRefs: [CR001, CR002, CR004, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or owner
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - EHR and practice-management interfaces
        - Assort, EHR vendor, and provider IT
        - Read/write workflow execution
        - Not disclosed
        - Permission, interface, or mapping change blocks or misrecords an action
        - Critical
        - Configuration-specific acceptance tests, audit logs, and rollback
        - High
      - - Specialty protocols and scheduling rules
        - Provider operations and Assort implementation team
        - Define permitted actions and escalation logic
        - Customer-specific dependency
        - Incomplete or stale rules generate incorrect routing or bookings
        - High
        - Named rule owner, versioning, regression suite, and approval gates
        - Medium-high
      - - Eligibility and prior-authorization scope
        - Assort, payer data sources, and provider staff
        - Coverage verification and exception handling
        - Public descriptions conflict
        - Buyer assumes automation that the contracted configuration does not support
        - High
        - Line-item scope, payer coverage matrix, and exception service levels
        - Medium-high
      - - Platform breadth across the patient journey
        - Assort
        - Multiple patient-access and administrative workflows
        - Workflow-level concentration not disclosed
        - One vendor or platform event degrades several access channels at once
        - High
        - Staged rollout, manual fallback, export rights, and tested continuity plan
        - Medium-high
      - - Growth and capital deployment
        - Assort management and investors
        - Fund scaling, implementation, and product expansion
        - Burn, runway, and unit economics not disclosed
        - Rapid expansion outruns controls, support capacity, or sustainable margins
        - High
        - Audited financials, cohort economics, support ratios, and board-approved operating plan
        - High
    notes: >-
      Concentration fields are gaps unless directly disclosed; financing raised is not treated as
      available cash, and competitor scope claims are not treated as independent benchmarks.
    claimRefs: [CR002, CR004, CR007, CR012, CR013, CR014, CR015, CR016]
