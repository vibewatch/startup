callouts:
  - calloutType: risk
    title: Primary thesis-break condition
    body: >-
      Do not underwrite production scale until a configuration-specific pilot reconciles the patient
      conversation, accepted EHR action, exception queue, and human escalation for high-risk scenarios.
    claimRefs: [CR006, CR007, CR008]
  - calloutType: recommendation
    title: Required closing package
    body: >-
      Require security and BAA artifacts, incident and uptime history, audited financials, workflow-level
      accuracy and escalation metrics, customer concentration, and contract-level integration scope.
    claimRefs: [CR010, CR011, CR014, CR016]
