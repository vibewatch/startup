          detail: "Telephony, inference, integration, QA, and support are unquantified"
        - id: gross-profit
          label: Gross profit
          detail: "Cannot be calculated from public evidence"
    approximationNotes: "Conceptual flow only; node order does not imply disclosed conversion rates, amounts, or margins."
    claimRefs: [CI001, CI002, CI009, CI013]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The $120 million round and more than $222 million of cumulative funding demonstrate financing
      access, but neither amount establishes current cash, net burn, debt obligations, or months of
      runway.
    claimRefs: [CI010, CI015]
  - calloutType: recommendation
    title: Underwrite cohort economics, not headline growth
    body: >-
      Require ARR and GAAP revenue bridges, realized pricing, implementation hours, gross margin,
      GRR/NRR, CAC, payback, burn, and cash before assigning a durable revenue multiple.
    claimRefs: [CI013, CI014, CI016]
