    columns: [Stream, Mechanism, Commercial unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Concierge, "Inbound calls, scheduling, triage, and eligibility", "Likely platform and/or usage", "Product publicly described; price undisclosed", "Potential recurring core workflow", "Provide ARR, usage tiers, minimums, and realized price"]
      - [Activate, "Outbound outreach, referrals, care gaps, and payments", "Campaign, volume, or module unknown", "Product publicly described; price undisclosed", "Expansion revenue if adoption persists", "Provide attach rate, module ARR, and campaign gross margin"]
      - [Orchestrate, "Intake, referrals, documents, and EHR writeback", "Module and integration terms unknown", "Product publicly described; price undisclosed", "Potentially sticky but services-intensive", "Separate recurring software from implementation revenue"]
      - [Empower, "Staff copilot, summaries, and handoffs", "Seat, module, or bundle unknown", "Product publicly described; price undisclosed", "Expansion surface; monetization unverified", "Provide paid-seat count, bundle treatment, and renewal data"]
      - [Implementation and integration, "Specialty protocols, EHR/PMS connection, and launch support", "Setup fee reported by one reviewer", "Third-party reported; not vendor-confirmed", "May fund deployment but can mask services cost", "Provide setup fees, deferred revenue, delivery hours, and implementation margin"]
    notes: "Product scope is public; commercial units and revenue recognition are analytical hypotheses until customer order forms and revenue schedules are reviewed."
    claimRefs: [CI001, CI002, CI003]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Evidence, Reported value, Unit or contract basis, Reliability, Interpretation]
    rows:
      - ["Vendor-published list price", null, "No public rate or tier", "Unavailable", "Sales-led pricing prevents realized-price benchmarking"]
      - ["The30Top review range", "$40,000-$300,000 per year plus implementation", "Call volume and site count", "Third-party estimate", "Wide range is consistent with enterprise segmentation"]
      - ["OhMD figure summarized by Macha", "About $1,500 per month for smaller clinics", "Smaller-clinic entry point", "Secondary report", "May not be comparable with health-system deployments"]
      - ["Agentman inquiry summarized by Macha", "$75,000 annual minimum", "One July 2026 inquiry; five-provider floor", "Secondary, deal-specific report", "Suggests a meaningful minimum commitment"]
      - ["Commercial transparency", "Custom / sales-only", "Contract terms depend on deployment", "Consistent across independent reviews", "Use signed orders, invoices, and cohort data for underwriting"]
    notes: "All quoted prices are third-party reports for potentially different buyer profiles; they are directional and must not be treated as a single price curve."
    claimRefs: [CI002, CI003, CI004]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Diligence request]
    rows:
      - [Revenue growth, "20x over 15 months", "Medium; founder-reported", "Signals demand but lacks base revenue and period endpoints", "Provide monthly GAAP revenue and ARR bridge"]
      - [ARR / recurring mix, null, "Unavailable", "Required to distinguish durable recurring revenue from setup and services", "Provide ARR by product, recurring mix, and revenue recognition policy"]
      - [Gross margin, null, "Unavailable", "Voice, model, integration, and service costs determine scalability", "Provide gross margin by module and fully loaded deployment cohort"]
      - [CAC and payback, null, "Unavailable", "Enterprise procurement and sales engineering may be costly", "Provide CAC, sales cycle, win rate, and payback by segment"]
      - [Retention and expansion, null, "Unavailable", "Multi-product thesis depends on durable renewals and module attach", "Provide GRR, NRR, logo churn, and cohort expansion"]
      - [Latest financing, "$120M Series C; more than $222M total funding", "High; corroborated reporting", "Supports continued investment but does not equal cash on hand", "Provide closing statement, cash balance, debt, and financing fees"]
      - [Planned R&D investment, "More than $70M", "Medium; executive statement", "Large commitment may accelerate platform breadth and consume capital", "Provide timing, capitalization policy, hiring plan, and milestone gates"]
      - [Burn and runway, null, "Unavailable", "Determines financing dependency and next-round timing", "Provide monthly net burn, cash balance, runway plan, and downside case"]
    notes: "Null means no usable public disclosure in the assigned evidence; funding raised is shown separately from cash, burn, and runway."
    claimRefs: [CI005, CI007, CI009, CI010, CI011, CI012, CI013, CI014, CI015]
