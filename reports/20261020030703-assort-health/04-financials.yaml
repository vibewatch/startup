schemaVersion: "report-v2"
artifact: financials
slug: assort-health
runDate: 2026-10-20
company:
  name: Assort Health
chapter:
  number: 4
  title: Financials
  summary: >-
    Assort Health has credible evidence of commercial momentum and ample recent financing, but the
    financial case remains underdetermined because pricing, ARR, gross margin, retention, burn, and
    runway are not publicly disclosed. The underwriting focus should be conversion of bespoke,
    integration-heavy deployments into repeatable high-margin revenue rather than the headline
    funding or valuation.
sections:
  - id: revenue-architecture
    title: Revenue architecture and monetization
    body: >-
      Assort Health appears to monetize a connected enterprise platform rather than a single voice
      bot. Concierge supports inbound access, Activate supports outbound campaigns, Orchestrate
      automates visit-adjacent workflows, and Empower supports staff; scheduling, referrals,
      intake, eligibility, and payment resolution create several potential expansion surfaces
      within one customer. Public pricing is absent. Third-party reviews describe custom contracts
      influenced by call volume, site count, specialty configuration, and implementation, but their
      reported price points vary substantially and are not vendor-confirmed. The most defensible
      underwriting model is therefore an enterprise contract with recurring platform or usage
      revenue plus deployment economics, pending actual order forms and invoices.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: commercial-traction
    title: Commercial traction and sales-efficiency signals
    body: >-
      The strongest public traction signal is management's report that revenue grew 20x in 15
      months, carried by Fierce Healthcare rather than disclosed financial statements. Customer
      outcome claims provide plausible willingness-to-pay evidence: Assort cites appointment-volume
      and labor-capacity gains, while its homepage presents workflow-level revenue outcomes.
      However, those are benefit numerators, not Assort revenue, and they are not substitutes for
      retention, realized price, or contribution margin. Enterprise healthcare procurement may
      take months, while company materials describe implementation in weeks. This combination can
      support large contracts but also implies sales-engineering, integration, and customer-success
      intensity that must be measured before assuming efficient scaling.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: unit-economics
    title: Unit economics and cost structure
    body: >-
      Public evidence does not permit a conventional SaaS unit-economics calculation. ARR, gross
      margin, CAC, payback, NRR, implementation cost, inference and telephony cost, and support
      burden remain unavailable. The disclosed operating model nevertheless identifies the likely
      cost centers: voice traffic, AI inference, specialty-specific configuration, bidirectional
      EHR work, quality assurance, and implementation labor. Call volume can create attractive
      recurring usage economics, but customer-specific protocol and integration work can depress
      initial margins or lengthen payback. Named customer outcomes strengthen the value proposition,
      yet no public evidence connects those outcomes to realized contract value or Assort's cost to
      deliver them.
    claimRefs: [CI009, CI013, CI014, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      The June 2026 financing provides a meaningful capital base: two healthcare trade publications
      reported a $120 million Series C, more than $222 million of total funding, and a $1.2 billion
      valuation. Management separately said it planned to invest more than $70 million in R&D,
      equivalent to more than 58% of the latest round's headline amount. That ratio signals an
      aggressive product build, not cash burn or remaining liquidity; funding raised is not cash
      available. Without current cash, monthly burn, debt, working-capital needs, and hiring plans,
      runway cannot be estimated. The financial verdict is therefore strong financing access and
      promising commercial pull, offset by material opacity around revenue quality, delivery margin,
      retention, and capital consumption.
    claimRefs: [CI010, CI011, CI012, CI015, CI016]
