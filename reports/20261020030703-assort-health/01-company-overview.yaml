company:
  name: "Assort Health"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Assort Health is a privately held, Series C healthcare AI company whose patient-access platform expanded from voice scheduling into intake, referrals, outreach, payments, and related workflows. The June 2026 financing established a reported $1.2 billion valuation and $222 million of total disclosed funding, but absolute revenue, ARR, customer count, headcount, headquarters, financing terms, and governance remain unavailable in the assigned public evidence.
sections:
  - id: "identity-and-operating-scope"
    title: "Identity and operating scope"
    body: >-
      Assort Health launched in November 2023 and sells AI agents for healthcare patient access. Public descriptions span inbound and outbound communications, scheduling, intake, referrals, document processing, medication refills, eligibility, lab requests, and payments, indicating an enterprise workflow platform rather than a single-purpose answering service. The company has emphasized specialty-specific implementations: its April 2026 dermatology announcement described expansion across four named dermatology groups, while later company materials described coverage across at least 23 specialties. Those descriptions establish product direction, but they do not independently verify deployment quality, organization count, or a headquarters address. The evidence set therefore supports the company identity and business category while leaving geographic and exact customer-scale fields open.
    claimRefs: [CO001, CO002, CO011, CO012, CO013]
    tableRefs: [TO001]
  - id: "leadership-and-capital"
    title: "Leadership and capital base"
    body: >-
      Founders Jon Wang and Jeffery Liu are publicly identified as co-CEOs, creating clear founder continuity but also a two-founder key-person dependency that should be tested through the executive bench and board. Liu previously worked as a software engineer at Facebook and Athelas, a relevant technical and healthcare operating background; equivalent independently sourced detail for Wang was not available in this pool. Financing accelerated from a $76 million Series B in 2025 to a $120 million Series C led by Menlo Ventures on June 24, 2026. Trade reporting placed the Series C valuation at $1.2 billion and total disclosed funding at $222 million. The investor list is visible, but board rights, voting control, liquidation preferences, debt, secondary sales, and exact ownership remain private-evidence requests.
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: "scale-and-disclosure-quality"
    title: "Scale signals and disclosure quality"
    body: >-
      The strongest growth signal is management's statement that revenue increased 20 times over 15 months; no starting value, ending value, ARR definition, or audited period was disclosed, so it cannot be converted into revenue or run-rate. Company descriptions of the underlying interaction corpus also changed rapidly, from more than 125 million interactions in April to more than 150 million in May, 190 million in June, and more than 200 million by August 2026. That sequence is directionally consistent with deployment growth, but all four measurements are company-issued and use an interaction count rather than customers, revenue, or active users. An external guide found no published price and cited only secondary pricing estimates, while exact customer count, headcount, locations, margin, burn, and runway remain unsupported.
    claimRefs: [CO010, CO011, CO014]
  - id: "milestones-and-diligence-framing"
    title: "Milestones and diligence framing"
    body: >-
      The dated evidence shows a short operating history followed by rapid capital formation and product expansion: launch in late 2023, a 2025 Series B, dermatology expansion and Activate launch in spring 2026, and the Series C in June. The later record is primarily disclosure rather than independently verified operating performance. A September external review could not locate public SOC 2, HITRUST, trust-center, or BAA statements, which is a visibility gap rather than proof that controls are absent. An October competitor comparison characterized Assort as narrower and lacking benefits-verification and prior-authorization automation, conflicting with Assort's broader product claims; because the critic is a competitor, that comparison is an adverse diligence lead, not an independent benchmark. Customer references, security documents, and live workflow tests are needed to resolve the scope and control questions.
    claimRefs: [CO001, CO005, CO006, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
