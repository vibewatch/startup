      topic: "scale-and-financials"
      missingEvidence: "Current absolute revenue, ARR, gross margin, burn, runway, customer count, headcount, headquarters, and operating-location data with definitions and dates."
      whyItMatters: "Growth multiples and interaction counts cannot establish revenue scale, capital efficiency, customer concentration, or organizational capacity."
      diligencePath: "Request audited financial statements, the current board pack, customer and employee rosters, and legal-entity and office records."
