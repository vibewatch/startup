summary:
  headline: >-
    Assort Health shows credible patient-access product breadth and commercial pull, but its reported $1.2 billion
    financing mark remains unsupported by the public operating, safety, and security evidence required for an investment
    decision.
  overallScore: 6.4
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
