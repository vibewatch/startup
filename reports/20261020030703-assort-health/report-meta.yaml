    headcount: null
  topStrengths:
    - Rapid capital formation and company-reported revenue growth indicate meaningful investor and commercial momentum.
    - >-
      The product spans multiple high-friction patient-access workflows and integrates with healthcare systems of
      record.
    - >-
      Named production deployments provide evidence of workflow adoption across primary care, specialty practices, and
      an emerging health-system motion.
  topRisks:
    - >-
      Current ARR, gross margin, retention, burn, runway, customer concentration, and financing terms are undisclosed,
      preventing a defensible operating multiple or return case.
    - >-
      Workflow-safety, EHR write-back, privacy, uptime, escalation, and recovery performance lack sufficient independent
      or public assurance.
    - >-
      Competitive differentiation, realized pricing, win rates, and durable account expansion remain unproven against
      funded patient-access and workflow platforms.
  unresolvedGaps:
    - >-
      Audited or board-approved current revenue, ARR, gross margin, recurring mix, burn, cash, runway, and
      revenue-recognition schedules.
    - GRR, NRR, logo churn, module penetration, implementation economics, and customer-level concentration by cohort.
    - >-
      The executed Series C term sheet, capitalization table, liquidation preferences, secondary participation, debt,
      board rights, and voting-control provisions.
    - >-
      Independent production evidence for workflow accuracy, escalation, EHR write-back, specialty edge cases, uptime,
      incident history, recovery, and security controls.
    - >-
      Comparable pricing, win-loss results, deployment timelines, and reference calls against Hyro, Luma Health, Artera,
      Notable Health, Hello Patient, and incumbent alternatives.
