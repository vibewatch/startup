companyProfile:
  summary: >-
    Assort Health is a privately held healthcare AI company led by founders and co-CEOs Jon Wang and Jeffery Liu. Its
    platform has expanded from voice scheduling into inbound and outbound patient access, intake, referrals,
    eligibility, payment, and staff workflows for health systems, primary-care organizations, and specialty provider
    groups. A $120 million Series C announced in June 2026 established a reported $1.2 billion valuation and brought
    total reported funding above $222 million.
