          detail: "May 2026 launch reporting"
        - label: "Integration surface"
          value: "15+"
          unit: "EHR and PMS platforms"
          detail: "Current company and third-party profile claim"
    approximationNotes: >-
      Values have different units and denominators and are not additive or
      value-proportional. The hierarchy is an evidence map, not a conversion
      funnel or a TAM/SAM/SOM calculation.
    claimRefs: ["CM008", "CM009", "CM011", "CM012", "CM013", "CM015"]
callouts:
  - calloutType: "insight"
    title: "Use deployment anchors, not a generic healthcare-AI TAM"
    body: >-
      The strongest public sizing evidence is provider deployment and workflow
      breadth. A dollar market estimate requires pricing, eligible-provider
      counts, adoption rates, and budget evidence that the assigned source pool
      does not supply.
    claimRefs: ["CM008", "CM009", "CM010", "CM011", "CM014"]
  - calloutType: "risk"
    title: "Scale claims are not independently audited"
    body: >-
      Interaction, provider, and performance figures are company-issued or
      company-supplied to reporters. They should be verified against customer
      contracts, product telemetry, and cohort-level outcomes before underwriting.
    claimRefs: ["CM009", "CM012", "CM013", "CM015"]
