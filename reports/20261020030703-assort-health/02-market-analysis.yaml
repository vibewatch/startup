  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "market-sizing"
      missingEvidence: "A source-defined market revenue base, eligible-provider denominator, adoption rate, and pricing methodology for a dollar TAM, SAM, and SOM."
      whyItMatters: "Without comparable denominators and price evidence, deployment counts cannot be converted into market value or obtainable share."
      diligencePath: "Obtain customer contracts and pricing cohorts, define eligible provider organizations by workflow, and reconcile the result against an independent provider census."
      relatedQuestionRefs: ["QM002"]
      relatedTableRefs: ["TM002"]
    - type: "private-evidence-only"
      severity: "material"
      topic: "pricing-gap"
      missingEvidence: "Contract pricing basis, average contract value, procurement owner, sales-cycle length, retention, and module expansion by buyer segment."
      whyItMatters: "These inputs determine budget availability, sales friction, revenue density, and a defensible obtainable-market estimate."
      diligencePath: "Review a stratified contract sample, CRM pipeline data, renewal cohorts, and reference calls with operational and economic buyers."
      relatedQuestionRefs: ["QM008"]
      relatedTableRefs: ["TM003"]
    - type: "missing-source"
      severity: "material"
      topic: "independent-validation"
      missingEvidence: "Independent audits of provider counts, interaction-corpus definitions, workflow accuracy, and deployment outcome metrics."
      whyItMatters: "Most scale and outcome evidence is company-issued or company-supplied, limiting confidence in adoption and performance claims."
      diligencePath: "Reconcile product telemetry to invoices and customer contracts, then verify outcomes with named customer references and pre/post extracts."
      relatedQuestionRefs: ["QM005", "QM006", "QM007"]
