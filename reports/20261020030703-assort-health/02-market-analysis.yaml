company:
  name: "Assort Health"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Assort Health addresses administrative patient-access workflows rather than a
    source-defined standalone software market. Public evidence supports a broad
    provider buyer set and meaningful deployment anchors, but not a defensible
    dollar TAM, SAM, SOM, pricing schedule, or budget-owner map.
sections:
  - id: "market-boundary"
    title: "Market boundary: administrative patient access"
    body: >-
      The evidenced market is the administrative layer between a care provider
      and a patient: inbound calls, scheduling and rescheduling, intake,
      referrals, eligibility, outreach, payment conversations, and routine task
      routing. That boundary is narrower than the entire healthcare AI market
      and broader than voice answering alone. It includes workflow orchestration
      attached to patient access, but the reviewed product materials do not
      establish diagnosis, treatment delivery, payer underwriting, claims
      adjudication, or the core EHR as part of the addressable product category.
      The practical substitutes are front-office staff, outsourced call centers,
      legacy IVR, point scheduling tools, and manual follow-up. This definition
      matters because a broad "healthcare AI" estimate would include spend that
      Assort does not currently evidence as sellable scope.
    claimRefs: ["CM001", "CM002", "CM003"]
    tableRefs: ["TM001"]
  - id: "evidence-constrained-sizing"
    title: "Sizing without a fabricated TAM"
    body: >-
      The retained sources do not publish category revenue, relevant provider
      software budgets, contract values, or a methodologically defined TAM, SAM,
      or SOM. Deployment and capability anchors are therefore the more defensible
      sizing lens. In May 2026, Activate was reported as in use across more than
      1,000 providers, while the syndicated company release described the wider
      platform as serving more than 5,000 providers across hundreds of
      organizations. Current company materials claim coverage across more than
      23 specialties and integrations with more than 15 EHR or practice-management
      platforms. Interaction-corpus claims rose from more than 150 million in May
      to 190 million in June and 300 million on the current homepage, but those
      differently dated company claims are capability or data-scale indicators,
      not independently measured market growth and not a basis for extrapolating
      market value.
    claimRefs: ["CM008", "CM009", "CM010", "CM011", "CM012", "CM013", "CM014"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-users-and-payers"
    title: "Buyers, users, and adoption path"
    body: >-
      Public materials identify health systems, federally qualified health
      centers, primary-care practices, and specialty provider groups as buyers.
      Front-office, contact-center, referral, scheduling, and revenue-cycle teams
      are the operational users, while patients interact with the agents by
      voice and other channels. The economic buyer is not disclosed consistently;
      it may sit in operations, patient access, information technology, or
      finance depending on organization size and workflow. Adoption begins with
      a high-volume problem such as missed calls, manual rescheduling, open
      referrals, or collections, then expands into adjacent workflows after EHR
      and practice-management integration. That land-and-expand interpretation
      is supported by the documented move from inbound scheduling to outbound
      outreach, but contract structure and budget ownership remain private.
    claimRefs: ["CM004", "CM005", "CM006", "CM008", "CM015", "CM016"]
    tableRefs: ["TM003"]
  - id: "drivers-constraints-and-valuation"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Demand is driven by persistent call volume, limited staff capacity,
      unscheduled referrals, no-shows, care-gap outreach, and payment collection.
      Reported early deployments show that buyers can test value in observable
      workflow outcomes: booked appointments, referral conversion, rescheduling,
      and payment completion. Adoption is not frictionless, however. Specialty
      scheduling requires provider-specific rules, payer sequencing, referral
      context, escalation paths, and reliable write-back into existing systems;
      implementation therefore depends on workflow configuration and integration,
      not a generic voice model alone. For valuation, the deployment base and
      workflow expansion support a large opportunity hypothesis, but the missing
      price, budget, retention, and independent category-spend evidence prevents
      conversion of that hypothesis into a credible dollar market or obtainable
      share. Investment underwriting should use contracted revenue and cohort
      expansion data, not the interaction corpus, as the eventual bridge to SOM.
    claimRefs: ["CM003", "CM006", "CM007", "CM011", "CM014", "CM015", "CM016"]
