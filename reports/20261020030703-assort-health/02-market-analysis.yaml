      - ["Specialty provider groups", "Practice executives and operators", "Schedulers, referral teams, and contact centers", "Practice or provider group", "Complex scheduling, referrals, triage, and eligibility", "Not disclosed", "Specialty rules and missed-call leakage"]
      - ["Multi-site specialty networks", "Central operations leadership", "Shared access and revenue-cycle teams", "Provider network", "Standardized inbound and outbound workflows", "Not disclosed", "Need to scale without proportional headcount"]
    notes: >-
      Segments and workflows are source-backed; payer and budget-owner fields are
      analytical mappings because public contract and procurement evidence is absent.
