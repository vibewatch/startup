  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: administrative patient access'
        blocks:
          - type: paragraph
            body: >-
              The evidenced market is the administrative layer between a care provider and a patient: inbound calls,
              scheduling and rescheduling, intake, referrals, eligibility, outreach, payment conversations, and routine
              task routing. That boundary is narrower than the entire healthcare AI market and broader than voice
              answering alone. It includes workflow orchestration attached to patient access, but the reviewed product
              materials do not establish diagnosis, treatment delivery, payer underwriting, claims adjudication, or the
              core EHR as part of the addressable product category. The practical substitutes are front-office staff,
              outsourced call centers, legacy IVR, point scheduling tools, and manual follow-up. This definition matters
              because a broad "healthcare AI" estimate would include spend that Assort does not currently evidence as
              sellable scope.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: Sizing without a fabricated TAM
        blocks:
          - type: paragraph
            body: >-
              The retained sources do not publish category revenue, relevant provider software budgets, contract values,
              or a methodologically defined TAM, SAM, or SOM. Deployment and capability anchors are therefore the more
              defensible sizing lens. In May 2026, Activate was reported as in use across more than 1,000 providers,
              while the syndicated company release described the wider platform as serving more than 5,000 providers
              across hundreds of organizations. Current company materials claim coverage across more than 23 specialties
              and integrations with more than 15 EHR or practice-management platforms. Interaction-corpus claims rose
              from more than 150 million in May to 190 million in June and 300 million on the current homepage, but
              those differently dated company claims are capability or data-scale indicators, not independently measured
              market growth and not a basis for extrapolating market value.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public materials identify health systems, federally qualified health centers, primary-care practices, and
              specialty provider groups as buyers. Front-office, contact-center, referral, scheduling, and revenue-cycle
              teams are the operational users, while patients interact with the agents by voice and other channels. The
              economic buyer is not disclosed consistently; it may sit in operations, patient access, information
              technology, or finance depending on organization size and workflow. Adoption begins with a high-volume
              problem such as missed calls, manual rescheduling, open referrals, or collections, then expands into
              adjacent workflows after EHR and practice-management integration. That land-and-expand interpretation is
              supported by the documented move from inbound scheduling to outbound outreach, but contract structure and
              budget ownership remain private.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
              - CM016
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is driven by persistent call volume, limited staff capacity, unscheduled referrals, no-shows,
              care-gap outreach, and payment collection. Reported early deployments show that buyers can test value in
              observable workflow outcomes: booked appointments, referral conversion, rescheduling, and payment
              completion. Adoption is not frictionless, however. Specialty scheduling requires provider-specific rules,
              payer sequencing, referral context, escalation paths, and reliable write-back into existing systems;
              implementation therefore depends on workflow configuration and integration, not a generic voice model
              alone. For valuation, the deployment base and workflow expansion support a large opportunity hypothesis,
              but the missing price, budget, retention, and independent category-spend evidence prevents conversion of
              that hypothesis into a credible dollar market or obtainable share. Investment underwriting should use
              contracted revenue and cohort expansion data, not the interaction corpus, as the eventual bridge to SOM.
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Use deployment anchors, not a generic healthcare-AI TAM
            body: >-
              The strongest public sizing evidence is provider deployment and workflow breadth. A dollar market estimate
              requires pricing, eligible-provider counts, adoption rates, and budget evidence that the assigned source
              pool does not supply.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
          - type: callout
            title: Scale claims are not independently audited
            body: >-
              Interaction, provider, and performance figures are company-issued or company-supplied to reporters. They
              should be verified against customer contracts, product telemetry, and cohort-level outcomes before
              underwriting.
            calloutType: risk
            claimRefs:
              - CM009
              - CM012
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The direct set named in Assort Health's own comparison comprises Hyro, Luma Health, Artera, Notable
              Health, Hello Patient, and Transform9, but that list is not an independent market census. It spans
              different product heritages: voice-led contact-center automation, broad patient-access and communications
              suites, configurable workflow automation, and practice-focused scheduling agents. Fierce Healthcare also
              describes continuing investment in Artera and the emergence of Hello Patient and other
              administrative-agent companies, indicating that adjacent vendors can move into the same budget rather than
              remain fixed categories. Buyers can also retain front-office staff, use conventional answering or
              contact-center systems, or build workflows around existing EHR tools. Those status-quo and internal-build
              choices remain important substitutes because they avoid a new vendor but preserve staffing, integration,
              and fragmented-workflow costs.
            claimRefs:
              - CP004
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP011
              - CP012
              - CP014
      - number: '3.2'
        title: Capability positioning is broad but evidence is asymmetric
        blocks:
          - type: paragraph
            body: >-
              Assort Health claims coverage across more than 23 specialties, integrations with more than 15 EHR and
              practice-management platforms, and a product surface spanning nine administrative workflow categories. Its
              comparison page places particular weight on specialty scheduling, warm handoffs, referrals,
              prior-authorization awareness, and outbound engagement, then ranks seven vendors on those dimensions. That
              framing is strategically favorable to Assort and should be treated as vendor positioning, not an
              independently tested benchmark. The same page credits Luma, Artera, and Notable with broader access,
              communications, or workflow surfaces, which makes suite breadth a credible counter-position. The resulting
              map is useful for diligence triage, but every score needs buyer-side demonstrations and reference checks
              before it can support a procurement or underwriting conclusion.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP014
      - number: '3.3'
        title: Pricing opacity and workflow integration shape competition
        blocks:
          - type: paragraph
            body: >-
              No retained source provides comparable list prices, unit prices, minimum commitments, or realized contract
              values for the named vendors. Agent Finder reports that Assort uses contact-for-pricing enterprise sales
              and is better suited to health systems and multi-site specialty practices than solo practices. It also
              describes implementation as taking weeks because EHR integration and clinical workflow mapping are
              required. Assort separately claims a 30-to-45-day deployment range. Together, these points suggest that
              distribution depends on consultative selling, integration credibility, and operational change management
              rather than self-serve acquisition. Once deployed, mapped protocols and EHR connections may create
              switching friction, but the evidence set does not quantify migration cost, contract lock-in, renewal
              behavior, multi-homing, or channel economics.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
      - number: '3.4'
        title: Moat thesis and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat thesis rests on specialty protocol depth, accumulated interaction data, deployment experience,
              and integrations. Independent coverage confirms that Assort has expanded beyond scheduling and reports
              substantial financing, while a customer quoted by Fierce Healthcare says it selected Assort after
              evaluating the market. Those signals support commercial relevance but do not isolate product superiority:
              the operational metrics remain company-reported, the customer evidence is a selected testimonial, and the
              detailed competitor matrix is authored by Assort. Commoditization risk is material because funded
              communications and workflow vendors can add voice agents, broad suites can bundle adjacent functions, and
              enterprise buyers may prefer fewer vendors. Durable differentiation therefore remains unproven until
              referenceable win-loss data, renewal and expansion cohorts, specialty accuracy benchmarks, and migration
              evidence are available.
            claimRefs:
              - CP009
              - CP010
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite the vendor-authored leaderboard
            body: >-
              Use the comparison as a diligence checklist, not a ranking. Require identical workflow demonstrations,
              comparable pricing, production accuracy and escalation data, and references from buyers that evaluated at
              least two named alternatives.
            calloutType: risk
            claimRefs:
              - CP004
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and monetization
        blocks:
          - type: paragraph
            body: >-
              Assort Health appears to monetize a connected enterprise platform rather than a single voice bot.
              Concierge supports inbound access, Activate supports outbound campaigns, Orchestrate automates
              visit-adjacent workflows, and Empower supports staff; scheduling, referrals, intake, eligibility, and
              payment resolution create several potential expansion surfaces within one customer. Public pricing is
              absent. Third-party reviews describe custom contracts influenced by call volume, site count, specialty
              configuration, and implementation, but their reported price points vary substantially and are not
              vendor-confirmed. The most defensible underwriting model is therefore an enterprise contract with
              recurring platform or usage revenue plus deployment economics, pending actual order forms and invoices.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI013
      - number: '4.2'
        title: Commercial traction and sales-efficiency signals
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction signal is management's report that revenue grew 20x in 15 months, carried by
              Fierce Healthcare rather than disclosed financial statements. Customer outcome claims provide plausible
              willingness-to-pay evidence: Assort cites appointment-volume and labor-capacity gains, while its homepage
              presents workflow-level revenue outcomes. However, those are benefit numerators, not Assort revenue, and
              they are not substitutes for retention, realized price, or contribution margin. Enterprise healthcare
              procurement may take months, while company materials describe implementation in weeks. This combination
              can support large contracts but also implies sales-engineering, integration, and customer-success
              intensity that must be measured before assuming efficient scaling.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
      - number: '4.3'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not permit a conventional SaaS unit-economics calculation. ARR, gross margin, CAC,
              payback, NRR, implementation cost, inference and telephony cost, and support burden remain unavailable.
              The disclosed operating model nevertheless identifies the likely cost centers: voice traffic, AI
              inference, specialty-specific configuration, bidirectional EHR work, quality assurance, and implementation
              labor. Call volume can create attractive recurring usage economics, but customer-specific protocol and
              integration work can depress initial margins or lengthen payback. Named customer outcomes strengthen the
              value proposition, yet no public evidence connects those outcomes to realized contract value or Assort's
              cost to deliver them.
            claimRefs:
              - CI009
              - CI013
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI007
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The June 2026 financing provides a meaningful capital base: two healthcare trade publications reported a
              $120 million Series C, more than $222 million of total funding, and a $1.2 billion valuation. Management
              separately said it planned to invest more than $70 million in R&D, equivalent to more than 58% of the
              latest round's headline amount. That ratio signals an aggressive product build, not cash burn or remaining
              liquidity; funding raised is not cash available. Without current cash, monthly burn, debt, working-capital
              needs, and hiring plans, runway cannot be estimated. The financial verdict is therefore strong financing
              access and promising commercial pull, offset by material opacity around revenue quality, delivery margin,
              retention, and capital consumption.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The $120 million round and more than $222 million of cumulative funding demonstrate financing access, but
              neither amount establishes current cash, net burn, debt obligations, or months of runway.
            calloutType: risk
            claimRefs:
              - CI010
              - CI015
          - type: callout
            title: Underwrite cohort economics, not headline growth
            body: >-
              Require ARR and GAAP revenue bridges, realized pricing, implementation hours, gross margin, GRR/NRR, CAC,
              payback, burn, and cash before assigning a durable revenue multiple.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Assort is no longer presented as a scheduling-only voice bot. Its current public surface spans inbound
              access, outbound outreach, journey orchestration, and staff-facing tools, with named workflows covering
              scheduling, triage, intake, after-hours answering, referrals, medication refills, payments, and task
              management. That breadth makes the product relevant to both specialty practices and health systems, but it
              also raises the implementation burden because each automated step must respect local protocols and
              escalation boundaries. The strongest external confirmation is operational rather than technical: NextGen
              lists a native integration, Fierce Healthcare describes expansion into adjacent workflows, and a
              competitor acknowledges Assort's healthcare-specific voice footprint while disputing its breadth. Buyers
              should validate each proposed workflow against real call mixes rather than assuming the full catalog is
              live at equal maturity in every deployment.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE012
              - CE014
              - CE015
      - number: '5.2'
        title: Operating architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating model is a configured orchestration layer over existing systems rather than a
              replacement system of record. Assort says Synapse ingests EHR access, test-environment permissions,
              operating procedures, scheduling rules, and payer protocols, then tailors organization-specific workflows.
              The health-system page lists EHR, CRM, telephony, and CCaaS dependencies, while NextGen describes direct
              integration and workflow generation from local data. This supports a credible integration-led deployment
              model, but not a fully documented technical architecture: interface methods, data latency, model
              boundaries, observability, rollback, and human-override behavior are not exposed in the reviewed public
              material. Implementation therefore depends as much on customer data quality and protocol ownership as on
              the underlying AI, and the advertised weeks-long timeline should be treated as scoped vendor guidance
              rather than a universal benchmark.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE007
              - CE011
              - CE012
      - number: '5.3'
        title: Maturity, differentiation, and proof quality
        blocks:
          - type: paragraph
            body: >-
              Assort's central differentiation claim is accumulated healthcare workflow data: the homepage cites more
              than 300 million interactions across more than 23 specialties, and NextGen cites 62,000 care protocols and
              1.6 million decision pathways. These are potentially valuable implementation assets, but they are vendor
              or partner assertions rather than independently audited measures of model quality. Fierce Healthcare adds
              evidence of production use and quotes MDCS Dermatology reporting a 20% increase in appointment bookings
              after two years, which is a meaningful customer signal but still a single testimonial without a control
              group. The allocated Google AI Studio page yielded no substantive body text in the prefetched record, so
              its projected scale claim is excluded. No public repository, package, API documentation set, practitioner
              forum, or other developer signal was found in the assigned evidence, limiting assessment of engineering
              velocity and integration ergonomics.
            claimRefs:
              - CE010
              - CE011
              - CE014
              - CE016
      - number: '5.4'
        title: Trust, reliability, and roadmap risk
        blocks:
          - type: paragraph
            body: >-
              The public security posture is positive but incomplete. Assort's health-system page states HIPAA
              compliance and SOC 2 Type II certification and directs buyers to a Trust Center, yet the reviewed open
              materials do not disclose detailed encryption, retention, subprocessor, recovery, or audit evidence.
              Independent comparison material also flags the absence of a public status history, uptime percentage, or
              contractual SLA, so there is no basis to infer incident-free operation. Product risk is therefore
              concentrated in procurement-only evidence and workflow safety: buyers need sampled-call accuracy,
              escalation and override rates, specialty edge-case testing, disaster-recovery commitments, and
              change-control records. Fierce Healthcare reports a planned investment of more than $70 million in R&D,
              but that intention does not establish roadmap delivery or quality. A phased service-line rollout with
              explicit acceptance thresholds is the prudent path.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public assurance is thinner than product breadth
            body: >-
              HIPAA and SOC 2 Type II are asserted, but public evidence does not establish uptime, recovery, detailed
              security controls, or independent workflow-accuracy performance. Those items should be contractual
              diligence gates before expansion beyond a bounded service line.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              Assort's public customer base spans primary-care groups, multi-location specialty practices, and health
              systems, with operations, patient-access, contact-center, and practice leaders acting as likely buyers
              while front-office and clinical staff use the resulting workflows. The clearest current scale signal is
              company-issued: more than 1,300 providers across family medicine, internal medicine, and pediatrics were
              said to be supported in September 2026. Specialty-practice proof is broader by named account and use case,
              while MobiHealthNews identifies John Muir Health as a health-system partner. Independent reviewers
              nevertheless position the product toward mid-size and large organizations; custom pricing, integration
              work, and workflow mapping make smaller low-volume practices a less evident fit.
            claimRefs:
              - CU001
              - CU008
              - CU009
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU008
              - CU009
              - CU012
              - CU013
              - CU014
      - number: '6.2'
        title: Adoption trajectory and named production proof
        blocks:
          - type: paragraph
            body: >-
              The source set establishes real deployments rather than a logo-only customer story, but most outcome data
              are supplied by Assort or repeated from its customers in company-controlled materials. Annapolis Internal
              Medicine reported outreach-driven flu-shot bookings, shorter hold times, and higher satisfaction;
              Pediatric Associates of Southwest Missouri reported greater staff capacity and time savings; Boston Bone
              and Joint Institute used outbound automation after weather closures; and the Center for Sports Medicine &
              Orthopaedics described an end-to-end referral workflow with a reported conversion rate. These examples
              span inbound access, outbound campaigns, payment collection, and referrals. They show workflow breadth and
              production use, but they do not provide a common denominator, audited measurement method, or comparable
              cohort needed to aggregate the results.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
      - number: '6.3'
        title: Expansion pathways and durability limits
        blocks:
          - type: paragraph
            body: >-
              Assort's expansion thesis is operational: begin with high-volume inbound scheduling or overflow, add
              outbound outreach, connect referral and payment workflows, and write completed actions back into the
              customer's EHR or practice-management system. That sequence can deepen workflow penetration if production
              quality remains acceptable, and the company's own buyer guidance appropriately recommends
              specialty-specific reference checks and live testing against each practice's rules. Public evidence does
              not show whether this expansion produces durable recurring revenue. None of the reviewed sources discloses
              NRR, GRR, logo churn, renewal length, module penetration by cohort, or top-customer revenue concentration.
              These omissions prevent a defensible conclusion about retention or account-level concentration despite
              visible adoption.
            claimRefs:
              - CU002
              - CU008
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU008
              - CU011
              - CU016
      - number: '6.4'
        title: Evidence quality and customer diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Independent evidence is directionally supportive but qualifies the headline metrics. AI Health Index
              identified 13 named customer stories and a 94.5 KLAS score, while noting early data and varying sample
              sizes. It also found that public outcomes measure operational results rather than routing accuracy, are
              not independently measured, and lack platform-level methods. Named proof is concentrated in ambulatory
              specialties and primary care, leaving higher-acuity categories less validated in public. Before
              underwriting customer durability, diligence should obtain account-level retention and cohort data,
              reference calls outside the vendor-selected set, contract and renewal terms, implementation timelines, and
              production accuracy and escalation results segmented by specialty.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Production evidence is named and workflow-specific
            body: >-
              Public materials identify customers, workflows, and operating outcomes across primary care, orthopedics,
              referral operations, and outbound campaigns; this is stronger than an undifferentiated logo wall.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
          - type: callout
            title: Adoption evidence does not establish retention
            body: >-
              The reviewed public record does not disclose NRR, GRR, logo churn, renewal length, cohort expansion, or
              top-customer revenue concentration, so customer durability remains unquantified.
            calloutType: risk
            claimRefs:
              - CU015
          - type: callout
            title: Underwrite with customer-level cohort and reference evidence
            body: >-
              Require specialty-matched reference calls, a live test against real scheduling rules, account-level usage
              and retention cohorts, renewal terms, and concentration data before treating deployment breadth as durable
              recurring revenue.
            calloutType: recommendation
            claimRefs:
              - CU011
              - CU014
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and residual exposure
        blocks:
          - type: paragraph
            body: >-
              The highest residual risks arise from the combination of broad workflow scope and incomplete independent
              verification. Assort markets a platform spanning scheduling, triage, intake, referrals, insurance and
              eligibility, payments, and staff tasks, so a configuration or integration error could affect more than
              call containment. Company-reported scale, patient ratings, and specialty coverage are useful operating
              signals, but they do not substitute for audited accuracy, escalation, security, or write-back evidence.
              The heatmap therefore rates workflow safety, PHI controls, and EHR transaction integrity above pricing
              opacity or financing risk. Likelihood labels are deliberately unquantified because the retained sources
              contain no incident denominator, error-rate series, or independently tested failure frequency.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR010
              - CR014
              - CR016
      - number: '7.2'
        title: Regulatory, privacy, and workflow-safety exposure
        blocks:
          - type: paragraph
            body: >-
              The public record reviewed here does not resolve Assort's configuration-level compliance posture. An
              affiliate review describes healthcare voice AI as carrying real compliance and patient-trust stakes, while
              a competitor-issued review reports that it could not find a public SOC 2 Type II attestation, HITRUST
              certification, trust page, or BAA statement as of September 2026. That report is not proof that the
              controls or agreements are absent; it makes the underlying documents a diligence requirement. Workflow
              safety is similarly evidence-sensitive: the company's own buyer guidance emphasizes specialty rules and
              contextual handoffs, while an independent commercial comparison warns that a confident spoken response can
              differ from the accepted system action. A failed BAA/security review or unreconciled EHR transaction in a
              controlled pilot is a thesis-break trigger.
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR011
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR011
              - CR013
              - CR014
      - number: '7.3'
        title: Operational, quality, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Integration breadth is both a selling point and a dependency surface. Assort claims integrations across
              more than fifteen EHR and practice-management platforms, but a listed logo does not prove that every
              intended scheduling action, permission, fallback, and write-back path works in the buyer's configuration.
              Public descriptions also depend on each practice supplying correct specialty protocols, payer sequencing,
              escalation boundaries, and staff ownership. Diligence should reconcile three records for every synthetic
              scenario: what the caller heard, what the target system accepted, and what remained in the staff queue.
              Investment should pause if high-risk requests lose context during handoff, if failed writes are not
              visible and owned, or if production-like testing cannot reproduce the promised workflow.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.4'
        title: Financial, commercial, and execution kill criteria
        blocks:
          - type: paragraph
            body: >-
              The $120 million Series C and reported $222 million of total funding improve capacity to invest, but
              funding raised is not cash available and does not disclose burn, runway, gross margin, or unit economics.
              Fierce Healthcare also relays a founder-stated 20-fold revenue increase over fifteen months; without
              audited period definitions or retention data, that claim is an execution signal rather than proof of
              durable economics. Commercial opacity compounds the issue because public pricing and configuration
              boundaries are limited, while competitor sources disagree with Assort's own presentation of eligibility
              and prior-authorization scope. Kill criteria are a refusal to provide current financials and security
              artifacts, material pilot error without an owned remediation path, or contract language that leaves
              high-risk workflows and integrations undefined.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR007
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break condition
            body: >-
              Do not underwrite production scale until a configuration-specific pilot reconciles the patient
              conversation, accepted EHR action, exception queue, and human escalation for high-risk scenarios.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Required closing package
            body: >-
              Require security and BAA artifacts, incident and uptime history, audited financials, workflow-level
              accuracy and escalation metrics, customer concentration, and contract-level integration scope.
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR011
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment decision and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The observable pricing anchor is the June 24, 2026 Series C: independent coverage reports a $120 million
              round at a $1.2 billion valuation, with total capital raised above $222 million. That is a financing mark,
              not evidence of enterprise value, revenue, ARR, cash available, or a realizable exit price. The retained
              sources report rapid company-claimed growth, but none supplies current ARR, gross margin, retention, burn,
              runway, customer concentration, or audited financials. Without those denominators, a revenue multiple and
              risk-adjusted return cannot be calculated responsibly. The appropriate decision is therefore to track and
              continue diligence rather than endorse the headline mark; any entry should be conditioned on verified
              economics and complete Series C terms.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV011
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV011
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Assort has converted a narrow patient-access wedge into a broader workflow platform and
              has evidence of commercial pull: the company reported 20-fold revenue growth over fifteen months, one
              independent outlet reported more than 200 customers, and the company now claims a large interaction
              dataset across many specialties. The anti-thesis is evidence quality and execution risk. TechShorts
              explicitly notes that the announced outcomes were not independently validated, while moving from specialty
              practices into health systems raises integration and sales-execution demands. The available competitor
              comparison is company-authored and qualitative, so it cannot serve as an independent valuation benchmark.
              Public evidence therefore supports further diligence on product-market pull, not the price paid.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV015
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is necessarily conditional rather than numerical. A bull case requires the reported
              growth and customer signals to translate into durable ARR, strong retention, attractive gross margin, and
              repeatable health-system deployments. The base case assumes genuine demand but reserves judgment on
              efficiency and valuation until those metrics are verified. The bear case is that rapid funding and an
              upmarket expansion outpace independently demonstrated outcomes, causing slower growth or a future
              repricing. No public valuation range or numeric probability is supportable from the retained evidence
              because the operating denominator and security terms are missing. The table therefore states explicit
              evidence thresholds and downside triggers instead of false precision.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The reported institutional round and expanding platform create a plausible path to later-stage financing
              or strategic interest, but they do not establish exit readiness. The retained source set contains no
              audited financial history, independently derived trading or transaction comparables, disclosure of the
              Series C preference stack, or evidence of secondary liquidity. Before an investment decision, diligence
              should obtain monthly ARR and recognized revenue, gross margin, cohort retention, bookings, burn, runway,
              account concentration, implementation economics, independently measured customer outcomes, and the full
              capitalization table and term sheet. Thesis-break triggers are failed retention or margin thresholds in
              the data room, material customer concentration, non-standard preference overhang, or failure to reproduce
              company-reported outcomes in customer reference calls.
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
