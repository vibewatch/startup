chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Assort Health launched in November 2023 and sells AI agents for healthcare patient access. Public
              descriptions span inbound and outbound communications, scheduling, intake, referrals, document processing,
              medication refills, eligibility, lab requests, and payments, indicating an enterprise workflow platform
              rather than a single-purpose answering service. The company has emphasized specialty-specific
              implementations: its April 2026 dermatology announcement described expansion across four named dermatology
              groups, while later company materials described coverage across at least 23 specialties. Those
              descriptions establish product direction, but they do not independently verify deployment quality,
              organization count, or a headquarters address. The evidence set therefore supports the company identity
              and business category while leaving geographic and exact customer-scale fields open.
            claimRefs:
              - CO001
              - CO002
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO010
      - number: '1.2'
        title: Leadership and capital base
        blocks:
          - type: paragraph
            body: >-
              Founders Jon Wang and Jeffery Liu are publicly identified as co-CEOs, creating clear founder continuity
              but also a two-founder key-person dependency that should be tested through the executive bench and board.
              Liu previously worked as a software engineer at Facebook and Athelas, a relevant technical and healthcare
              operating background; equivalent independently sourced detail for Wang was not available in this pool.
              Financing accelerated from a $76 million Series B in 2025 to a $120 million Series C led by Menlo Ventures
              on June 24, 2026. Trade reporting placed the Series C valuation at $1.2 billion and total disclosed
              funding at $222 million. The investor list is visible, but board rights, voting control, liquidation
              preferences, debt, secondary sales, and exact ownership remain private-evidence requests.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
