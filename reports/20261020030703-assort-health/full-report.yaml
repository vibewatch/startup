      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          Company-reported 20x revenue growth in 15 months and third-party reporting of 200+ customers indicate
          commercial pull
        - >-
          Audited or board-approved cohort data showing weak retention, low-quality revenue, or stalled health-system
          expansion
      - - Product proof
        - Company claims 300M+ interactions across 23+ specialties and a broad patient-access workflow
        - Independent workflow testing that fails to reproduce accuracy, resolution, or customer outcome claims
      - - Anti-thesis
        - >-
          Third-party coverage says announced outcomes were not independently validated, while upmarket expansion raises
          execution demands
        - Independent multi-customer studies and reference calls confirming durable outcomes at health-system scale
      - - Comparable evidence
        - >-
          The available seven-vendor comparison is company-authored and qualitative, not an independent pricing
          benchmark
        - >-
          A transaction and public-company comp set normalized for growth, margin, retention, and business-model
          differences
    notes: Company-issued product and competitor claims are identified as such and are not treated as independent benchmarks.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV012
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - >-
          Reported growth converts into durable ARR, strong retention and margins, and repeatable large health-system
          deployments
        - >-
          No public value range is supportable; upside requires verified economics that justify the current financing
          mark and a credible exit path
        - Directional only; strengthened by audited cohorts and independent customer outcomes
      - - Base
        - Demand is real but scaling costs, integration work, and enterprise sales temper operating leverage
        - >-
          No public value range is supportable; defer pricing judgment until ARR quality, burn, runway, and terms are
          disclosed
        - Directional only; downside trigger is weak retention, margin, or concentration in the data room
      - - Bear
        - Funding velocity and upmarket expansion outpace independently demonstrated outcomes or durable unit economics
        - No public value range is supportable; repricing or dilution risk rises if milestones lag the $1.2B mark
        - Directional only; trigger is failed outcome replication, slow deployments, or non-standard preference overhang
    notes: >-
      These are conditional evidence cases, not forecasts; numeric probabilities and valuation ranges are intentionally
      omitted because public financial and security-level inputs are insufficient.
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV009
      - CV011
      - CV014
      - CV015
      - CV016
