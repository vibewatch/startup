  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public evidence supports a sequence from a high-volume access problem to broader workflows, with human escalation
      and reference checks acting as gates rather than an automatic expansion outcome.
    data:
      items:
        - label: 1. Access pressure
          detail: High inbound volume, long holds, seasonal surges, or referral backlog creates the initial buying trigger.
          touchpoints:
            - Scheduling queue
            - After-hours calls
            - Referral backlog
        - label: 2. Inbound deployment
          detail: The organization maps scheduling, payer, provider, and escalation rules into production workflows.
          touchpoints:
            - EHR integration
            - Scheduling
            - Human handoff
        - label: 3. Operational proof
          detail: Buyers evaluate resolution, hold time, staff capacity, appointment accuracy, and patient satisfaction.
          touchpoints:
            - Workflow dashboard
            - Staff review
            - Patient feedback
        - label: 4. Outbound expansion
          detail: Proven access workflows can extend to recalls, care gaps, no-show recovery, and payment outreach.
          touchpoints:
            - Activate campaigns
            - Appointment booking
            - Payment collection
        - label: 5. Referral expansion
          detail: Referral ingestion, eligibility, routing, outreach, and booking can add a second production workflow.
          touchpoints:
            - Fax or EHR intake
            - Patient outreach
            - Referral conversion
        - label: 6. Renewal and reference gate
          detail: >-
            Specialty-specific accuracy, escalation quality, price, renewal terms, and reference checks determine
            durable expansion.
          touchpoints:
            - Live workflow test
            - Customer reference
            - Contract renewal
    approximationNotes: >-
      Conceptual sequence based on disclosed workflows; it does not imply conversion rates, timing, or that every
      customer progresses through every stage.
    claimRefs:
      - CU002
      - CU008
      - CU011
      - CU016
