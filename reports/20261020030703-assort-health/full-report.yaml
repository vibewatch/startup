            claimRefs:
              - CO005
              - CO006
              - CO009
      - number: '1.3'
        title: Scale signals and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              The strongest growth signal is management's statement that revenue increased 20 times over 15 months; no
              starting value, ending value, ARR definition, or audited period was disclosed, so it cannot be converted
              into revenue or run-rate. Company descriptions of the underlying interaction corpus also changed rapidly,
              from more than 125 million interactions in April to more than 150 million in May, 190 million in June, and
              more than 200 million by August 2026. That sequence is directionally consistent with deployment growth,
              but all four measurements are company-issued and use an interaction count rather than customers, revenue,
              or active users. An external guide found no published price and cited only secondary pricing estimates,
              while exact customer count, headcount, locations, margin, burn, and runway remain unsupported.
            claimRefs:
              - CO010
              - CO011
              - CO014
      - number: '1.4'
        title: Milestones and diligence framing
        blocks:
          - type: paragraph
            body: >-
              The dated evidence shows a short operating history followed by rapid capital formation and product
              expansion: launch in late 2023, a 2025 Series B, dermatology expansion and Activate launch in spring 2026,
              and the Series C in June. The later record is primarily disclosure rather than independently verified
              operating performance. A September external review could not locate public SOC 2, HITRUST, trust-center,
              or BAA statements, which is a visibility gap rather than proof that controls are absent. An October
              competitor comparison characterized Assort as narrower and lacking benefits-verification and
              prior-authorization automation, conflicting with Assort's broader product claims; because the critic is a
              competitor, that comparison is an adverse diligence lead, not an independent benchmark. Customer
              references, security documents, and live workflow tests are needed to resolve the scope and control
              questions.
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO012
              - CO013
              - CO015
              - CO016
