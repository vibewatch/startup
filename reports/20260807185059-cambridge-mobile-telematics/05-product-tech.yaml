- id: architecture-workflow-and-deployment
  title: Architecture, workflow, and deployment
  body: 'The public technical evidence is strongest at the workflow layer. How-it-works materials and customer-launch pages
    show a repeated pattern: capture driving behavior, convert it into analytics, then push outputs into pricing, coaching,
    crash response, or claims operations. That pattern repeats across personal-auto, fleet, and international partner deployments,
    which is a sign of platform reuse. The evidence is weaker deeper in the stack. Public pages do not disclose low-level
    model architecture, uptime history, certification details, or benchmark comparisons that would let an investor separate
    true technical superiority from good packaging. Still, the workflow evidence is concrete enough to show the platform is
    more than a scorecard; it is designed to connect sensing, analytics, and downstream action inside customer programs. In
    practice, that means technical diligence should focus on repeatability of deployment patterns, model calibration processes,
    and the degree to which customer integrations are configurable instead of custom coded.'
  claimRefs:
  - CE003
  - CE008
  - CE020
  - CE021
  - CE024
  - CE027
  - CE029
  - CE030
  - CE031
  tableRefs:
