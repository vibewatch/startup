chapter:
  number: 5
  title: Product & Technology
  summary: CMT presents a real multi-module telematics platform with verified workflow breadth across pricing, crash, claims,
    fleet, and engagement use cases. Public proof is strongest on packaging, launches, and AI narrative evolution; it is weaker
    on low-level architecture, reliability benchmarks, and formal trust certifications.
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: CMT’s product is best understood as a modular mobility-safety platform instead of a single telematics app. The company’s
    public surfaces consistently present a family of insurer, claims, fleet, and engagement workflows built on a shared driving-data
    foundation. That family structure matters because it implies the product can land inside one buyer workflow and later
    expand into adjacent teams. Risk and score modules support underwriting and pricing use cases, crash and claims modules
    support post-incident workflows, fleet packaging extends the same sensing logic to commercial use cases, and engagement
    tools turn telematics into ongoing behavior change. From a diligence perspective, the important conclusion is not that
    every module has identical maturity, but that CMT has published enough separate surfaces to support a real platform claim
    rather than a marketing abstraction. That breadth also implies a shared product language that sales teams can reuse across
    insurer, fleet, and public-sector narratives instead of pitching disconnected point solutions.
  claimRefs:
  - CE001
  - CE002
  - CE004
  - CE005
  - CE006
