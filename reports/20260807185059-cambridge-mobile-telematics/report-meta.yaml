companyProfile:
  summary: Cambridge Mobile Telematics grew out of MIT-origin mobile sensing work and now sells a multi-module telematics platform spanning risk, score, crash, claims, fleet, and engagement workflows. The company has real strategic and customer validation, but as a private business it discloses far less about revenue quality and capital adequacy than a public comparator would.
