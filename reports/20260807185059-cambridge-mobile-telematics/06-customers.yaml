- id: customer-verdict-and-diligence-blockers
  title: Customer verdict and diligence blockers
  body: 'CMT has enough public customer proof to clear the “real adoption” threshold. The issue is not whether customers exist;
    it is whether those customer relationships are durable, expanding, and economically concentrated in a healthy way. Public
    sources highlight reduced distraction, rewards, digital claims support, and fleet safety as concrete customer-value stories,
    and the pace of 2024–2025 releases suggests active commercialization momentum. Yet the same public record leaves major
    holes on retention, satisfaction, concentration, and post-breach trust effects. The right underwriting stance is therefore
    constructive but incomplete: CMT has a meaningful roster and broad deployment evidence, but customer durability still
    depends on diligence that only management materials, contract summaries, and cohort analyses can provide. The next diligence
    step should focus on cohort behavior by account and module, not on collecting more logos. That is the evidence gap that
    matters most for the investment case.'
