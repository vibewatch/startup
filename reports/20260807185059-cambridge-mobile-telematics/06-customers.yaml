chapter:
  number: 6
  title: Customers
  summary: CMT has abundant named customer and partner proof across insurers, cohorts, and geographies, with especially strong
    evidence of production launches and some land-and-expand motion. Public customer evidence is much weaker on retention,
    concentration, and revenue durability, so adoption looks real but not fully underwritten.
sections:
- id: segment-mix-and-buyer-map
  title: Segment mix and buyer map
  body: 'The visible customer base is dominated by insurers and insurer-adjacent programs rather than by direct consumer adoption.
    That is consistent with CMT’s business model: buyers are carrier product, claims, or safety teams; users are drivers,
    policyholders, and fleet managers; payers are insurers or institutional programs. Public launches show variety within
    that core. CMT supports personal-auto programs, young-driver and educator-focused cohorts, commercial-auto and fleet initiatives,
    claims-oriented services, and awareness or safety campaigns alongside carrier partners. This diversity matters because
    it reduces dependence on a single narrow use case even if it does not fully solve customer concentration risk. The strongest
    supported conclusion is that CMT has many named insurance relationships and some adjacent expansion vectors, with fleets
    and public-safety style programs acting as secondary growth surfaces. It also means buyer diligence should separate logo
    breadth from economic breadth, because a long insurer roster can still map to a concentrated revenue base if a few national
    carriers dominate volume.'
