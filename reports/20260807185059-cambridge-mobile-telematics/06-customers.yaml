- id: retention-expansion-and-concentration
  title: Retention, expansion, and concentration
  body: 'The customer proof is strongest on presence and expansion, and weakest on durability. A few sources show land-and-expand
    behavior: Nationwide moved into fleet, HUK expanded into claims services, and COUNTRY Financial’s DriverIQ upgrade suggests
    continued product development inside an existing account. But these remain anecdotal examples rather than a disclosed
    cohort. No public source in the record provides NRR, GRR, churn, average contract length, or top-customer revenue concentration.
    That means investors can see customer traction but not the resilience of that traction. The visible base also remains
    heavily insurer-centric, which may be strategically attractive but keeps concentration risk unresolved until management
    shows revenue distribution across carriers, geographies, and modules. Public proof of customer presence therefore exceeds
    public proof of customer durability, a gap investors should treat as central rather than cosmetic. Until that data is
    available, any customer-quality score should be capped by uncertainty around renewals, module penetration, and contract
    stickiness.'
  claimRefs:
  - CU008
  - CU014
  - CU018
  - CU020
  - CU021
  - CU022
