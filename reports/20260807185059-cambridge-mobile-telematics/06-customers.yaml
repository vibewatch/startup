  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: Complete customer census distinguishing production, pilot, and inactive accounts.
    whyItMatters: The current named-customer table is representative, not exhaustive.
    diligencePath: Request full active-customer list with status and module set.
    relatedQuestionRefs:
    - QU001
    - QU009
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, renewal rates, contract lengths, and attach-rates by account.
    whyItMatters: Durability cannot be underwritten from named launches alone.
    diligencePath: Request cohort tables and account-level renewal history.
    relatedQuestionRefs:
    - QU010
    - QU018
    - QU025
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue mix and customer contribution by geography and module.
    whyItMatters: A few large carrier accounts could dominate revenue despite a broad public roster.
    diligencePath: Request top-10 customer concentration and segment revenue split.
    relatedQuestionRefs:
    - QU023
    - QU025
  - type: private-evidence-only
    severity: minor
    topic: post-breach-trust
    missingEvidence: Customer communications and win/loss impact related to the 2024 breach.
    whyItMatters: Trust issues can weaken renewals and new-logo conversions.
    diligencePath: Request remediation timeline plus churn or procurement commentary.
    relatedQuestionRefs:
    - QU003
    - QU024
