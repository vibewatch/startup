- id: named-deployment-proof-and-geography
  title: Named deployment proof and geography
  body: Named deployment proof is abundant. Nationwide, HUK-COBURG, Mercury, Erie, COUNTRY Financial, State Auto, Plymouth
    Rock, HDI Seguros, Linear Assicurazioni, Warta, and Aioi all appear in the public record with program-specific language
    rather than generic logo use. Several of those references are strong because they describe the use case, not just the
    relationship. HUK includes both safe-driving insurance and claims services, Nationwide spans distraction reduction and
    fleet telematics, and Aioi shows international partner-led deployment in Japan and Southeast Asia. Geographic coverage
    is also broader than a U.S.-only insurer tool. The named proof reaches Germany, Mexico, Italy, Poland, Japan, and Southeast
    Asia, which supports a repeatable localization and partner-deployment capability even if public evidence still stops short
    of revenue contribution by country. Importantly, several of these pages use launch or upgrade language rather than speculative
    pilot language, which strengthens the inference that the deployments are live enough to matter commercially. The roster
    is plainly global.
