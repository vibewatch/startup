  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: Carrier-level program spend, average contract value, and attach rates needed to convert broad TAM into
      CMT-specific SAM and SOM.
    whyItMatters: Top-down market reports are too broad to price CMT precisely without understanding the company’s actual
      monetization wedge inside telematics programs.
    diligencePath: Request program count by product line, average annual contract value, implementation revenue, and spend
      concentration by insurer or fleet segment.
  - type: conflicting-data
    severity: material
    topic: market-definition
    missingEvidence: A reconciled view of when management uses insurance telematics, connected insurance, and UBI to refer
      to the same or different budgets.
    whyItMatters: Valuation can be overstated if broader market definitions are used without mapping them to the company’s
      specific product and buyer set.
    diligencePath: Ask management to provide a bottom-up SAM model by insurer, fleet, OEM, and public-sector workflow.
  - type: stale
    severity: minor
    topic: europe-adoption
    missingEvidence: A newer third-party Europe adoption dataset than the CMT-authored 2022 report.
    whyItMatters: European adoption could have shifted materially by 2026, affecting how much whitespace remains for CMT and
      its peers.
    diligencePath: Source a 2025-2026 third-party connected-insurance adoption study or insurer-by-insurer rollout tracker.
