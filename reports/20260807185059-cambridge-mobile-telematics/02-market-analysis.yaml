chapter:
  number: 2
  title: Market Analysis
  summary: CMT sits in a fast-growing but loosely bounded market that spans insurance telematics, usage-based insurance, connected
    claims, fleet safety, and public-sector analytics. The category has strong demand drivers, but public TAM figures vary
    widely and must be narrowed to concrete insurer, fleet, OEM, and agency workflows before they become underwriting inputs.
sections:
- id: boundary-and-market-shape
  title: Market boundary and what CMT actually sells into
  body: 'CMT is not selling into a single monolithic telematics budget. The fetched evidence shows at least four adjacent
    spending pools: personal-auto usage-based insurance, connected claims and risk workflows, commercial fleet safety, and
    public-sector road-safety analytics. That matters because broad UBI or “mobility AI” TAM claims often mix together software,
    incentive pools, insurer economics, connected-car data services, and even broader mobility outcomes. For diligence purposes,
    the relevant market boundary for CMT is the software-and-data layer that lets carriers, fleets, and agencies measure behavior,
    price risk, detect crashes, and keep drivers engaged. That narrower boundary is still large and expanding, but it prevents
    the valuation chapter from leaning on inflated full-premium or full-transportation-market analogies that do not map cleanly
    to CMT’s monetization model. Another useful framing point is that many carrier programs mix software with discounts and
    retention tactics; those consumer incentives should be treated as GTM tools, not as proof that the whole premium pool
    is addressable software revenue for CMT.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM001
