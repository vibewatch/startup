- id: sizing-and-adoption
  title: Sizing lenses, adoption evidence, and why estimates diverge
  body: The independent market sources point in the same directional direction—rapid growth—but they do not agree on the exact
    size of the opportunity. GM Insights values insurance telematics at $7.7 billion in 2025, while IMARC sizes the broader
    UBI market at $75 billion in 2025 and Data Bridge publishes a different baseline and forecast altogether. The gap is not
    necessarily a flaw; it reflects differences in market boundary, geography, inclusion of broader insurance economics, and
    how smartphone, embedded, and OEM channels are counted. The cleaner insight for CMT is that buyer interest is now mainstream.
    Large carriers market telematics programs directly to drivers, and CMT’s own Europe report shows that adoption still has
    room to grow materially outside the earliest-mover geographies. The market is large enough to sustain several scaled vendors,
    but not so uniform that a single top-down TAM number should drive underwriting. A disciplined investor should therefore
    translate macro demand into deployable program counts, average contract values, implementation scopes, and renewal mechanics
    instead of assuming all top-down UBI spend is equally reachable by a telematics vendor.
  claimRefs:
