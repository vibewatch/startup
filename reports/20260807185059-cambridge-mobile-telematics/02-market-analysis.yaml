callouts:
- calloutType: insight
  title: Market size is real, but boundary discipline matters
  body: The external TAM numbers are big enough to support a strong category thesis, but they are not interchangeable. Insurance-telematics
    infrastructure and full UBI economics are different revenue pools.
  claimRefs:
  - CM003
  - CM005
  - CM007
  - CM008
- calloutType: risk
  title: Data access and privacy can shut markets as well as open them
  body: Verisk’s telematics exit is a reminder that the category depends on durable access to quality data and on a privacy
    posture that customers and regulators will tolerate.
  claimRefs:
  - CM021
  - CM034
  - CM035
