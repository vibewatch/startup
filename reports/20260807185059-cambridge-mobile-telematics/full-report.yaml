            body: >-
              The public technical evidence is strongest at the workflow layer. How-it-works materials and
              customer-launch pages show a repeated pattern: capture driving behavior, convert it into analytics, then
              push outputs into pricing, coaching, crash response, or claims operations. That pattern repeats across
              personal-auto, fleet, and international partner deployments, which is a sign of platform reuse. The
