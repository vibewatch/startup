      - number: '8.3'
        title: Scenario framework and comparable lens
        blocks:
          - type: paragraph
            body: >-
              Public comparables are helpful precisely because they constrain false precision. CCC, Samsara, and Verisk
              span insurance workflow software, fleet software, and insurance-data incumbency; together they show how
              much multiple outcomes can differ across maturity and growth profiles. Private peers such as Octo and
              Netradyne further show that telematics and fleet safety can attract significant value, but not on a
              uniform formula. CMT seems to sit between these categories: strategically important enough to deserve a
              premium over legacy workflow software if growth and retention are strong, but too opaque to deserve the
              same certainty as a public company with audited metrics. That makes the base case a scenario exercise, not
              a single-number model. That is exactly why scenario ranges matter more than spreadsheet elegance in this
              case. It also means investors should focus on relative ranges and breakpoints: which revenue, retention,
              and risk outcomes would justify moving from a public-comp anchor toward a premium private-software anchor,
              and which outcomes would force a sharper discount. Range discipline wins.
            claimRefs:
              - CV012
