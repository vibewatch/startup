      - number: '3.2'
        title: Peer profiles and what each vendor emphasizes
        blocks:
          - type: paragraph
            body: >-
              The direct peers are differentiated more by emphasis than by whether they claim to process driving data.
              Arity leans into pricing sophistication and insurer profitability, LexisNexis into normalization and
              workflow simplification, Octo into connected-vehicle insurance, Sentiance into on-device privacy-first
              intelligence, IMS into independent ownership and data control, Targa into OEM and fleet adjacency, and The
              Floow into engagement and rewards. Zendrive and Netradyne show that the broader mobility-safety category
              still attracts investors and product attention from adjacent markets. CMT’s main advantage in this field
              is platform breadth. Its public product surface spans risk, score, crash, claims, fleet, engagement, and a
              newer foundation-model layer, which can matter when the buyer wants one vendor to support multiple
              operational teams rather than a point solution. This breadth matters because insurers increasingly want
              fewer vendors in production, especially when telematics touches pricing, claims, and customer
              communication at the same time. A broader stack can therefore be a GTM advantage even when a specialist is
              stronger at one narrow task.
