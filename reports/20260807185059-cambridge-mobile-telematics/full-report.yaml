        - id: a3
          label: Workflow proof
          detail: Distraction reduction, claims, rewards, or fleet safety is specified
        - id: a4
          label: Expansion possibility
          detail: Customer relationship can move into claims, fleets, or new geographies
      edges:
        - from: a1
          to: a2
        - from: a2
          to: a3
        - from: a3
