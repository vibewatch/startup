      - number: '8.4'
        title: Final call and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The final public-data call is research-more with medium confidence. That is not a dismissal; it is an
              evidence-sensitive posture. If private diligence confirms that realized pricing, retention, and capital
              adequacy are closer to the favorable end of the plausible range, the recommendation could move positively
              without needing a radically lower valuation. Conversely, if the breach overhang worsens, a major insurer
              relationship weakens, or primary cash support is thinner than the 2026 headline suggests, the call should
              degrade quickly. The practical takeaway is that the remaining work is narrow and high value: resolve
              economic visibility, concentration, and trust. Until then, a fair-to-stretched stance is more defensible
              than either a hard buy or a hard avoid. The public record gets the committee to the door, but not through
              it. That makes the next diligence hour unusually valuable. That is the central valuation discipline.
            claimRefs:
              - CV003
