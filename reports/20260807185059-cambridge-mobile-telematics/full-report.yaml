        title: Financial-model risk and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Financial risk in CMT is driven less by evidence of weak demand than by lack of visibility. Public sources
              still do not disclose cash, burn, runway, or retention well enough to underwrite resilience. The 2026
              round improved strategic validation, but the reporting that it was all-secondary means investors cannot
              treat the headline amount as a clean proxy for fresh operating cash. Customer concentration is similarly
              unresolved. The prudent conclusion is that residual risk stays medium or higher until private diligence
              closes the loop on capital adequacy, renewal quality, and post-breach customer impact. That also defines
              the kill criteria: a confirmed mishandled breach, major-customer attrition, loss of critical distribution
              channels, or evidence that primary runway is short despite the 2026 transaction should all materially
              weaken the thesis. In practice, the missing numbers and missing control evidence are themselves part of
              the risk profile. A conservative investor should therefore insist on downside modeling built around
              privacy incidents, partner churn, and weaker-than-expected cash extension from the 2026 transaction.
