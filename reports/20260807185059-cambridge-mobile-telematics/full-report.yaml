  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and privacy risk
        blocks:
          - type: paragraph
            body: >-
              The most acute public risk is privacy and cyber exposure. Multiple adverse legal-alert and
              incident-reporting sources describe breach-related scrutiny involving sensitive driver behavior, location
              history, and insurance-related information. Even if liability remains unproven, the risk is inherently
              material because telematics platforms handle the exact categories of data that regulators and plaintiffs
              care about most. CMT’s own privacy policy makes consent and governed data handling explicit, which is
              necessary but not sufficient comfort. FTC and California privacy materials reinforce how strict the
              control expectations can become once precise behavioral and location data are involved. For investors, the
              key point is simple: privacy compliance is not side-car legal work here; it is a core product and
              commercial risk because a failure can hit trust, procurement, and renewals simultaneously. It also means
              ordinary software-style security slippage would have outsized commercial consequences in this category.
              Board-level. Materially so.
