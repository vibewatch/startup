      - number: '8.2'
        title: Entry discipline and valuation context
        blocks:
          - type: paragraph
            body: >-
              Entry discipline hinges on how the 2026 transaction is interpreted. The round is unquestionably a
              validation signal, but the reporting that it was all-secondary and non-dilutive changes its meaning:
              investors cannot simply treat the headline dollars as proof that runway risk disappeared. Valuation
              signals also spread widely. Public market-data sources point to roughly $1.2 billion at the low end and
              around $1.5 billion at the high end, while revenue evidence remains a broad estimate rather than disclosed
              fact. That forces valuation to be framed as a range. On a low revenue base the implied multiple looks
              rich; on a high revenue base it can look tolerable or even reasonable. The investment question is
              therefore less “is CMT good?” and more “where within this wide, uncertain range should disciplined capital
              enter?”. A disciplined investor should resist collapsing that uncertainty into a single tidy multiple
              before private diligence arrives. That uncertainty alone argues against an aggressive entry decision.
              Explicitly.
            claimRefs:
              - CV005
