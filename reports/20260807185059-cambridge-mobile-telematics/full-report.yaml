      - number: '1.3'
        title: Capitalization, scale signals, and operating maturity
        blocks:
          - type: paragraph
            body: >-
              Public funding evidence shows a company that already had one exceptionally large growth round before
              taking another strategic round in 2026. The 2018 SoftBank Vision Fund investment established CMT as a
              late-stage private company, while the March 2026 TPG-Allianz-State Farm transaction positioned the
              business closer to a strategic infrastructure provider for insurers and mobility firms. Scale disclosures
              are directional but meaningful: CMT says it supports 55 million drivers in 25 countries through 140
              programs, and older materials say it powers telematics for 21 of the top 25 North American auto insurers.
              Database sources also suggest a mid-hundreds headcount and ongoing cash generation, which points to a
              company beyond pilot mode even though revenue and margin disclosure remain private. Publicly visible
              valuation sources also do not line up perfectly, which is typical for private companies but still
              relevant: Premier Alternatives points to roughly $1.2 billion while Tracxn shows a higher value. That
              spread does not invalidate the growth story, but it does mean entry pricing cannot be underwritten from
              headlines alone.
