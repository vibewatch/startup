      - number: '5.4'
        title: Trust, privacy, and technical risks
        blocks:
          - type: paragraph
            body: >-
              For a platform that continuously collects and interprets driver behavior, trust controls are inseparable
              from product maturity. The privacy policy makes consent and governed data handling explicit, which is
              helpful, but the breach investigation is a reminder that external stakeholders will judge the product
              partly through the lens of security and enterprise trust. That does not prove a systemic product failure,
              but it does show how quickly a technology narrative can become a diligence question about compliance,
              remediation, and procurement friction. More broadly, the public evidence says much more about what the
              product does than about how resilient it is under load or how thoroughly it has been certified. Investors
              should therefore treat security, privacy, and reliability validation as core technical diligence rather
              than peripheral legal work. The right technical diligence package should therefore include not just a
              demo, but concrete evidence on incident response, access controls, privacy governance, uptime, and error
              handling in live insurer and fleet environments.
