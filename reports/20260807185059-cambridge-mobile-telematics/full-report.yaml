            body: >-
              CMT’s mission alignment with road safety is strategically attractive, but it also raises the burden of
              execution. Distracted-driving injury and fatality statistics remain large, so any claimed improvement must
              hold up under scrutiny. Public proof of mitigation exists through Kiefer Foundation and Travelers
              Institute partnerships, but those are evidence of intent and education, not audited platform reliability.
              Product breadth also widens the operational surface. Claims and fleet workflows are more operationally
              demanding than a scoring-only app, and the company’s global footprint implies coordination risk across
              teams and markets. The public record therefore supports a nuanced read: CMT is not short on mission or
              product ambition, but the exact resilience of its operations, controls, and service delivery remains
              partly opaque. The quality bar should therefore emphasize proof of controls and outcomes, not just mission
              language. That uncertainty should keep residual operational risk from being scored low.
