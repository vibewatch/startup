        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The public-data thesis for CMT is compelling at a strategic level. The company has real distribution
              validation from large insurance and impact-investing partners, broad product proof across pricing, claims,
              fleet, and engagement workflows, and a customer footprint that appears global enough to matter. Those are
              not small positives. The anti-thesis is equally clear: the public record is much better at proving that
              CMT matters than at proving exactly what it earns, retains, or margins. Because the business is private,
              investors have to bridge that gap with judgment. The correct valuation posture therefore starts with
              asymmetry. CMT may be a strong company, but the evidence quality around economics is not yet strong enough
              to justify momentum-style underwriting. In other words, this is a diligence problem more than a sourcing
              problem. Price matters here more than narrative excitement.
            claimRefs:
              - CV001
              - CV002
              - CV020
              - CV021
              - CV022
              - CV030
              - CV036
          - type: table
