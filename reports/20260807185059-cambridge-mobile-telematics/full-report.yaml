  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Material breach / trust event
        - Confirmed incident with poor customer or regulatory handling
        - Reduces confidence in retention and procurement
        - Move toward avoid or demand lower entry price
      - - Weak primary-cash support
        - Private diligence shows limited runway despite 2026 round
        - Undercuts strategic-validation narrative
        - Reprice or require financing plan
      - - Major insurer attrition
        - Top carrier relationship weakens materially
        - Damages customer-proof and revenue durability
        - Reassess thesis urgently
      - - OEM / competitor channel displacement
        - Buyers prefer alternative data channels over smartphone-led workflow
        - Compresses moat and growth assumptions
        - Lower scenario range
      - - Retention below expectation
        - Cohort data shows weak expansion or churn
        - Undermines premium-multiple case
        - Hold or avoid
    notes: Kill triggers are the shortest path from new information to recommendation change.
    claimRefs:
      - CV020
      - CV021
      - CV027
      - CV028
      - CV035
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Realized pricing and ARR
        - Revenue basis by program and module
        - Drives every multiple judgment
        - Request customer-level pricing and ARR bridge
      - - Retention and concentration
        - NRR, GRR, renewals, top-account mix
        - Separates broad roster from durable economics
        - Request cohort and concentration tables
      - - Runway and capital adequacy
        - Cash, burn, runway, next-financing assumptions
        - Converts secondary round narrative into balance-sheet reality
        - Request monthly cash forecast
      - - Breach remediation and trust
        - Incident handling, customer communications, control upgrades
        - Can change downside-case valuation quickly
        - Request incident packet and trust materials
      - - Module attach-rates
        - Cross-sell depth by account
        - Explains whether platform breadth monetizes fully
        - Request attach-rate by top customers
    notes: These five asks are the highest-value blockers between public interest and investable conviction.
    claimRefs:
      - CV002
      - CV024
      - CV026
      - CV029
      - CV039
