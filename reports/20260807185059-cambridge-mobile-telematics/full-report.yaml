      - number: '1.2'
        title: Leadership, research pedigree, and product identity
        blocks:
          - type: paragraph
            body: >-
              The leadership stack is unusually technical for an insurance-adjacent company. Balakrishnan and Madden
              remain visible as co-founders connected to MIT research, while Powers anchors the commercial build-out as
              CEO. The product story also reads as a platform story: DriveWell Fusion is the operating system for risk
              measurement, crash workflows, claims, and coaching, while DriveWell Atlas is the newer foundation-model
              layer meant to generalize across phone, vehicle, and IoT signals. External recognition from TIME and the
              Edison Awards supports that CMT is being noticed outside the insurance trade press, but those awards do
              not substitute for diligence on model accuracy, customer retention, or margins. They do, however, support
              the claim that CMT has built real brand equity around road-safety AI. That technical pedigree also
              explains why the company highlights patents, state-level regulatory approvals for scoring, and proprietary
              multi-modal training data. In diligence terms, the overview evidence points to a company with unusually
              durable R&D depth for a private insurance-technology vendor, but still one that must prove
              commercialization discipline against very large counterparties.
