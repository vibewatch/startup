  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute paths
        blocks:
          - type: paragraph
            body: >-
              CMT does not compete in a tidy vendor box. Buyers can meet the same underlying job through specialist
              telematics vendors, incumbent data providers, fleet platforms, carrier-owned programs, or partial internal
              builds. The fetched landscape sources show that carrier-branded programs such as Snapshot, SmartRide, and
              Drivewise remain powerful substitutes because insurers can keep customer-facing control while deciding how
              much underlying telematics infrastructure to outsource. At the same time, analyst databases and vendor
              sites show a long tail of specialists attacking the category from different angles: connected-car data,
              privacy-first analytics, engagement and rewards, insurer alignment, or fleet and OEM adjacency. For CMT,
              that means winning a “telematics” deal often depends less on category membership than on which slice of
              the workflow the buyer cares about most. The sources also imply that buyers often evaluate telematics
              alongside adjacent data and claims vendors, not in a stand-alone bucket. That raises the effective
              competitive set beyond whichever companies explicitly say the word telematics on their homepage.
            claimRefs:
