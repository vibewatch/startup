        - Strategic strength is real but economics remain under-disclosed
      - - Confidence
        - medium
        - Multiple key valuation inputs are estimated or conflicting
      - - Risk rating
        - high
        - Privacy, retention, and capital visibility remain unresolved
      - - Valuation stance
        - fair
        - Range could be reasonable or rich depending on actual revenue base
      - - Decision implication
        - continue diligence
        - Need private metrics before conviction pricing
    notes: Summary is explicitly evidence-sensitive rather than a generic company-quality score.
    claimRefs:
      - CV003
      - CV004
      - CV025
      - CV040
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Public support
      - What would change the view
    rows:
      - - Strategic insurer validation
        - 2026 round and commercial agreements
        - Need proof that validation translates into durable economics
      - - Broad product and customer proof
        - Multiple module and deployment signals across chapters
        - Need retention and margin to convert breadth into valuation confidence
      - - Opacity anti-thesis
        - Revenue, funding, and runway are imprecise
        - Private management materials could sharply improve confidence
      - - Risk anti-thesis
        - Breach and customer-durability overhang
        - Need remediation and renewal data to reduce discount
    notes: Thesis and anti-thesis are both materially evidence-backed; the recommendation is the output of their balance.
    claimRefs:
      - CV001
      - CV002
      - CV024
      - CV027
      - CV030
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation logic
      - Probability signal
      - Key risk
    rows:
      - - Bull
        - Revenue closer to top of estimate band, strong retention, strategic channels compound
        - Private multiple justified near or above current high-end mark
        - Would require private diligence to confirm economics
        - Overpaying before proof
      - - Base
        - Business is strong but opacity persists, with decent but not proven durability
        - Wide valuation range and research-more stance remain appropriate
        - Most consistent with public evidence today
        - False precision from partial data
      - - Bear
        - Revenue nearer low-end estimate, breach or renewal issues hurt confidence
        - Current implied mark looks stretched and should be discounted
        - Would follow weak private diligence or negative risk events
        - Sharp downside from opacity plus risk
    notes: Scenarios are directional because the public record does not support exact cash-flow modeling.
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV039
  - id: TV004
    title: Comparable valuation table
    columns:
