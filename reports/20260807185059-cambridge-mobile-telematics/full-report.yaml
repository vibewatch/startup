      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-layered. In personal auto, the insurer typically owns the budget, pricing,
              underwriting, or claims leader owns the workflow, and the driver is the end user whose participation
              determines data quality and program ROI. In commercial auto, the buyer can be the insurer, fleet operator,
              or both, with safety and loss-control use cases mixed together. In public sector, the purchasing center
              shifts again toward transportation agencies and civic safety programs. The external carrier pages also
              show that incentives and user experience are not peripheral details—they are the conversion path from
              carrier budget to driver behavior change. Because the same behavioral data can serve pricing, claims,
              safety coaching, and municipal planning, CMT competes in a market where distribution strength and workflow
              integration matter as much as raw detection accuracy. That is why insurer pages, OEM references, and fleet
              product pages are important evidence: they show that adoption does not happen when a carrier merely likes
              the idea of telematics, but when the budget owner can connect pricing, claims, safety, and user experience
              in one operational motion.
