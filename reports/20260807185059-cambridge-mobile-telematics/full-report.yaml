        - 2026 market cap and revenue
        - ~3.7x revenue
        - Insurance workflow software anchor
        - Public company with different growth and margin profile
      - - Samsara
        - 2026 market cap and revenue
        - ~13.8x revenue
        - Fleet / telematics-adjacent high-growth software anchor
        - Broader IoT platform with public-market liquidity
      - - Verisk
        - 2026 market cap and revenue
        - ~8.2x revenue
        - Insurance-data incumbent anchor
        - Mature public incumbent, not direct private-stage peer
      - - Octo Telematics / Netradyne
        - Private revenue or valuation markers
        - €134M revenue (2020) / $1.25B valuation (2025)
        - Category-specific private context
        - Not a clean current multiple pair
    notes: Comparable set is intentionally mixed because no single public company matches CMT exactly.
