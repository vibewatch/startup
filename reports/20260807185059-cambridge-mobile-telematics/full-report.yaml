      - number: '2.4'
        title: Growth drivers, adoption constraints, and competitive context
        blocks:
          - type: paragraph
            body: >-
              The strongest structural tailwinds are easy to identify: insurer pressure to personalize pricing,
              persistent distracted-driving losses, improving mobile and connected-car data, and evidence that good
              program design can reduce claims. But the market also has real friction. Privacy expectations are rising,
              incumbent data feeds can disappear, and carriers can discontinue telematics lines when data quality, media
              scrutiny, or integration burden stops justifying the effort. Competitive differentiation is therefore not
              only about scoring accuracy. LexisNexis, Arity, Sentiance, IMS, Octo, Targa, and The Floow all emphasize
              different combinations of normalization, pricing, privacy, engagement, independence, OEM data, and claims
              support. For CMT, this means the addressable market is large, but winning it requires distribution, trust,
              and operational resilience—not merely belonging to a hot category. The public evidence also suggests that
              category winners need to manage channel conflict across insurers, automakers, fleets, and public agencies.
              The more workflows CMT touches, the bigger the opportunity becomes—but so do integration, consent, and
              data-governance expectations.
