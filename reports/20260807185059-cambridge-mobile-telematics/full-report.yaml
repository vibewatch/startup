      - number: '7.3'
        title: Partner dependency and competitive risk
        blocks:
          - type: paragraph
            body: >-
              The company’s distribution advantages are also sources of fragility. Strategic investors such as Allianz
              and State Farm can accelerate market access, but they also concentrate influence among very large
              counterparties. Public carrier pages show that insurers frequently own the customer-facing telematics
              brand, which can make an underlying vendor commercially important yet easy to swap or hard to verify
              through consumer loyalty. On top of that, competitor evidence around OEM and connected-car data
              integrations shows that access points can shift. If buyers increasingly prefer upstream data channels or
              in-house carrier programs, CMT could face margin or displacement pressure even without a technical
              failure. The right dependency read is therefore two-sided: large partners de-risk distribution today while
              preserving bargaining-power and substitution risks tomorrow. Investors should treat this as a structural
              feature of insurance-distribution markets, not a temporary inconvenience. The channel benefit is real, but
              so is the strategic fragility.
