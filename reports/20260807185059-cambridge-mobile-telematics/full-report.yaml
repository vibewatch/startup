  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what CMT actually sells into
        blocks:
          - type: paragraph
            body: >-
              CMT is not selling into a single monolithic telematics budget. The fetched evidence shows at least four
              adjacent spending pools: personal-auto usage-based insurance, connected claims and risk workflows,
              commercial fleet safety, and public-sector road-safety analytics. That matters because broad UBI or
              “mobility AI” TAM claims often mix together software, incentive pools, insurer economics, connected-car
              data services, and even broader mobility outcomes. For diligence purposes, the relevant market boundary
              for CMT is the software-and-data layer that lets carriers, fleets, and agencies measure behavior, price
              risk, detect crashes, and keep drivers engaged. That narrower boundary is still large and expanding, but
              it prevents the valuation chapter from leaning on inflated full-premium or full-transportation-market
              analogies that do not map cleanly to CMT’s monetization model. Another useful framing point is that many
              carrier programs mix software with discounts and retention tactics; those consumer incentives should be
              treated as GTM tools, not as proof that the whole premium pool is addressable software revenue for CMT.
            claimRefs:
              - CM001
