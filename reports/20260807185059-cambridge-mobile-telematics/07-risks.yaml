  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: incident-response
    missingEvidence: Board-level breach chronology, remediation details, affected-customer communications, and notification
      status.
    whyItMatters: Without incident detail, privacy and trust risk cannot be sized.
    diligencePath: Request incident packet, outside-counsel memo, and remediation plan.
    relatedQuestionRefs:
    - QR002
    - QR013
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-resilience
    missingEvidence: Cash balance, runway, burn, and customer-renewal sensitivity to any breach or partner shock.
    whyItMatters: Strategic validation does not substitute for solvency visibility.
    diligencePath: Request cash-forecast model and downside case.
    relatedQuestionRefs:
    - QR005
    - QR019
    - QR029
  - type: private-evidence-only
    severity: material
    topic: dependency
    missingEvidence: Top-customer concentration, partner economics, OEM-data competitive exposure, and churn by channel.
    whyItMatters: Distribution and moat risk sit in external relationships.
    diligencePath: Request top-account concentration and win/loss analysis.
    relatedQuestionRefs:
    - QR004
    - QR014
    - QR015
    - QR023
  - type: private-evidence-only
    severity: minor
    topic: controls
    missingEvidence: Security certifications, uptime/incident metrics, implementation SLAs, and governance routines.
    whyItMatters: Operational and privacy mitigation maturity remains hard to score from the public record.
    diligencePath: Request trust-center artifacts, SLA metrics, and security governance overview.
