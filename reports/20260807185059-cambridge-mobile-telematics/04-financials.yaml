- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Primary buyer
  - Product evidence
  - How revenue likely occurs
  - Quality of proof
  - Diligence ask
  rows:
  - - Personal auto insurer programs
    - Carrier product/risk owner
    - Safe Driving Technology; DriveWell Risk; DriveWell Score
    - Enterprise program fees tied to enrolled policies, drivers, or activated modules
    - Strong module evidence; pricing opaque
    - Need contracted pricing basis and attach-rate by module
  - - Claims workflow
    - Carrier claims team
    - DriveWell Claims
    - Software or workflow fees tied to crash detection and claims handling
    - Clear product evidence; no pricing
    - Need claims-savings case studies and implementation burden
  - - Commercial fleets
    - Fleet safety or insurance owner
    - DriveWell Fleet
    - Fleet telematics subscriptions or program fees
    - Direct product evidence
    - Need ARPU, seat basis, and hardware dependency detail
  - - Public sector
    - Transport agencies / safety groups
    - Public Sector page
    - Program or analytics fees tied to road-safety deployments
    - Surface-level official evidence only
    - Need contract examples and procurement cycle detail
  - - Strategic European programs
    - Allianz entities / OEM / mobility partners
    - 2026 round announcements
    - Commercial agreements and integrated insurance/service offerings
    - Corroborated by company and partners
    - Need booked revenue timing and exclusivity terms
  notes: Rows summarize visible revenue surfaces from official pages and 2026 transaction disclosures; realized pricing and
    contract mechanics remain undisclosed.
