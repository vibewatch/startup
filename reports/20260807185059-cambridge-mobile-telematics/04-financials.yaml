- id: capital-adequacy-and-strategic-financing
  title: Capital adequacy and strategic financing
  body: 'The funding history is unusually important because it may say more about CMT’s financial position than any disclosed
    P&L metric. The company previously announced a $500 million SoftBank Vision Fund round in 2018, then a $350 million strategic
    transaction in March 2026 led by TPG and Allianz X with State Farm participation. Multiple independent sources corroborate
    the existence and strategic framing of the 2026 deal, including the attached commercial agreements with Allianz entities.
    At the same time, the Fortune-republished reporting that the transaction was all-secondary and non-dilutive changes the
    interpretation: it is strong market validation, but not automatically equivalent to fresh balance-sheet cash. The right
    financial read is therefore two-part. CMT appears able to attract sophisticated capital and distribution partners, yet
    the public record does not cleanly answer cash-on-hand, runway, or next-round timing because even total funding tallies
    diverge across databases.'
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
