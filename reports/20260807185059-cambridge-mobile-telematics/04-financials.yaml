company:
  name: Cambridge Mobile Telematics
chapter:
  number: 4
  title: Financials
  summary: CMT appears to monetize a broad enterprise telematics platform with multiple module-based revenue surfaces, but
    public evidence is materially stronger on strategic scale and financing quality than on precise unit economics. The 2026
    TPG/Allianz/State Farm transaction validates commercial relevance, yet opacity around pricing, margins, retention, and
    cash adequacy keeps the financial verdict only partially underwritten.
sections:
- id: revenue-model-and-monetization-surface
  title: Revenue model and monetization surface
  body: 'CMT’s public surface supports a multi-module enterprise software model rather than a single-score product. The core
    monetization clue is breadth: the company markets insurer-facing risk and score products, claims automation, fleet telematics,
    and public-sector safety workflows. That matters financially because each module can map to a different internal budget
    owner while still sharing a common telematics data layer. The absence of list pricing is also informative. Nothing on
    the public product pages suggests self-serve transactions; instead the language points to insurer programs, fleet deployments,
    and workflow integration. That implies CMT likely sells programmatic contracts whose realized pricing depends on segment,
    deployment size, and the number of activated modules. For underwriting purposes, the strongest supported conclusion is
    not a precise price point but that CMT has several plausible recurring-revenue surfaces and cross-sell paths built on
    the same driving-data infrastructure. That pattern usually supports renewals, bundled upsells, and account expansion if
    results land.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
