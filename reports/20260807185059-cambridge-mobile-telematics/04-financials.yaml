- id: traction-proxies-and-disclosure-limits
  title: Traction proxies and disclosure limits
  body: 'The public traction case is reasonably strong even though the private metrics are not. Company and partner announcements
    around the 2026 financing repeat scale markers such as 55 million protected drivers, 25 countries, and 140 programs, while
    Dealroom and market-data services suggest a substantial employee and R&D footprint. Those datapoints imply real commercial
    deployment and continuing platform investment. But they do not close the key underwriting questions. Publicly accessible
    sources still leave realized pricing, ARR, gross margin, support intensity, net retention, and monthly burn largely undisclosed.
    Even the revenue estimates that exist are broad statistical ranges rather than management guidance. This creates an unusual
    split: the business looks commercially important enough to attract blue-chip strategic capital, yet the evidence remains
    too opaque to assign a confident revenue-quality score without management materials or customer cohort data.'
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI024
