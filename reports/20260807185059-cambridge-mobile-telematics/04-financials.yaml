- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - What public sources say
  - Impact on verdict
  - Exact diligence path
  rows:
  - - Realized pricing / contract basis
    - Needed to model revenue quality and expansion
    - No public list or realized pricing found
    - High
    - Request top-20 customer pricing and discount schedules
  - - ARR / revenue cadence
    - Needed for growth and multiple analysis
    - Only broad statistical or database placeholders visible
    - High
    - Request 24-month monthly ARR or revenue bridge
  - - Gross margin by module
    - Needed to test software leverage
    - No public margin disclosure found
    - High
    - Request module-level COGS and services burden
  - - Retention / renewal / churn
    - Needed to judge durability
    - No public NRR/GRR or renewal statistics found
    - High
    - Request cohort data by insurer and fleet segment
  - - Customer concentration
    - Needed to assess downside risk
    - Public sources name logos but not revenue mix
    - High
    - Request top-10 customer concentration and contract terms
  notes: Gap table captures the exact private metrics that block a hard underwriting view even though strategic scale evidence
    is strong.
