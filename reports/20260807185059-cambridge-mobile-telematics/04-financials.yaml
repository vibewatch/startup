- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The evidence supports a constructive but incomplete financial verdict. CMT looks like a capital-light software platform
    with enough scale, product breadth, and strategic sponsorship to justify serious diligence, and the 2026 transaction materially
    improves confidence that sophisticated counterparties believe the platform can continue expanding. However, the public
    evidence does not let an investor underwrite revenue quality with precision. The main blockers are straightforward: no
    reliable public realized-pricing data, no disclosed ARR or margin bridge, no cohort-style retention disclosure, no concentration
    disclosure, and no quantified post-breach commercial impact. That means the company may still be attractive, but the attractive
    part is the strategic position and likely platform leverage, not verified near-term economics. Any investment committee
    memo should treat revenue, valuation, and funding metrics as bounded ranges and require management data-room evidence
    before translating strategic strength into a hard underwriting number. It should also force explicit reconciliation of
    how much of the 2026 transaction was primary capital, how fast the Allianz commercial agreements can convert into recognized
    revenue, and whether support-intensive customer deployments dilute otherwise attractive software economics.'
