evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: ARR, gross margin, burn, cash balance, and customer concentration by account or program.
    whyItMatters: >-
      The company is clearly scaled, but public evidence still does not reveal the quality of the underlying economics
      or renewal base.
    diligencePath: >-
      Request board materials or management KPI pack covering revenue mix, gross margin, churn, NRR, and cash
      generation.
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Cap-table-backed latest valuation and round mechanics reconciling the $1.2B and $1.53B public database signals.
    whyItMatters: >-
      Entry discipline and ownership dilution depend on whether 2026 price discovery reset valuation or simply provided
      partial liquidity at a prior reference point.
    diligencePath: Obtain the 2026 transaction term sheet, seller list, and updated cap table from management or counsel.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: security-incident-status
    missingEvidence: >-
      Company-confirmed incident chronology, affected records, notifications, and remediation status for the 2026
      alleged breach.
    whyItMatters: >-
      Security trust is directly tied to insurer, public-sector, and mobility relationships that depend on sensitive
      location and crash data.
    diligencePath: Request incident-response brief, outside-counsel memo, insurance coverage position, and customer-notification log.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Carrier-level program spend, average contract value, and attach rates needed to convert broad TAM into
      CMT-specific SAM and SOM.
    whyItMatters: >-
      Top-down market reports are too broad to price CMT precisely without understanding the company’s actual
      monetization wedge inside telematics programs.
    diligencePath: >-
      Request program count by product line, average annual contract value, implementation revenue, and spend
      concentration by insurer or fleet segment.
  - type: conflicting-data
    severity: material
    topic: market-definition
    missingEvidence: >-
      A reconciled view of when management uses insurance telematics, connected insurance, and UBI to refer to the same
      or different budgets.
    whyItMatters: >-
      Valuation can be overstated if broader market definitions are used without mapping them to the company’s specific
      product and buyer set.
    diligencePath: Ask management to provide a bottom-up SAM model by insurer, fleet, OEM, and public-sector workflow.
  - type: stale
    severity: minor
    topic: europe-adoption
    missingEvidence: A newer third-party Europe adoption dataset than the CMT-authored 2022 report.
    whyItMatters: >-
      European adoption could have shifted materially by 2026, affecting how much whitespace remains for CMT and its
      peers.
    diligencePath: Source a 2025-2026 third-party connected-insurance adoption study or insurer-by-insurer rollout tracker.
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Contract pricing, implementation fees, and renewal terms across CMT and the peer set.
    whyItMatters: Public websites show positioning but not the economic basis on which competitors really win or lose deals.
    diligencePath: Collect win/loss files, RFP responses, and redlined contracts from recent competitive processes.
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Actual churn, module attach rates, and migration friction for customers considering specialist or internal
      alternatives.
    whyItMatters: The moat thesis depends on whether breadth really creates stickiness or just adds sales complexity.
    diligencePath: Request cohort-level retention and module-usage data plus reference calls from multi-product customers.
  - type: conflicting-data
    severity: minor
    topic: landscape-boundary
    missingEvidence: >-
      A management-defined primary competitor list split by personal auto, commercial auto, OEM, and public-sector
      workflows.
    whyItMatters: >-
      Different chapters can overgeneralize competition if all telematics vendors are treated as direct substitutes in
      every deal.
    diligencePath: Ask management for the top five competitors by segment, region, and product line with recent win/loss examples.
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Contracted pricing basis, discounts, and attach-rate by module for top programs.
    whyItMatters: Without realized pricing, revenue quality and expansion economics cannot be modeled.
    diligencePath: Request top-customer pricing schedules and module attach-rate summary from management.
    relatedQuestionRefs:
      - QI008
      - QI011
      - QI025
  - type: private-evidence-only
    severity: material
    topic: margin-and-burn
    missingEvidence: Gross margin, services burden, cash balance, monthly burn, and runway disclosure.
    whyItMatters: Capital adequacy cannot be underwritten from strategic funding announcements alone.
    diligencePath: Request board-ready monthly financial package and 18-month forecast.
    relatedQuestionRefs:
      - QI010
      - QI018
      - QI025
  - type: conflicting-data
    severity: material
    topic: funding-totals
    missingEvidence: >-
      Reconciled cap table and financing history explaining why vendors show ~USD 502.5M versus ~USD 852.5M lifetime
      funding.
    whyItMatters: Conflicting funding totals affect dilution, preference overhang, and valuation context.
    diligencePath: Request official cap table, financing chronology, and primary vs secondary split by round.
    relatedQuestionRefs:
      - QI012
      - QI017
  - type: private-evidence-only
    severity: minor
    topic: retention-and-concentration
    missingEvidence: NRR/GRR, renewal, churn, and top-customer revenue concentration by segment.
    whyItMatters: Durability and downside sensitivity are central to valuing a telematics platform.
    diligencePath: Request cohort retention, renewal schedule, and top-10 customer concentration table.
    relatedQuestionRefs:
      - QI020
      - QI021
      - QI025
  - type: private-evidence-only
    severity: material
    topic: model-performance
    missingEvidence: >-
      Measured accuracy lift, false-positive/false-negative rates, and benchmark comparisons for scoring and crash
      modules.
    whyItMatters: Platform breadth alone does not prove technical superiority or reliability.
    diligencePath: Request model-performance dashboard and customer benchmark studies.
    relatedQuestionRefs:
      - QE009
      - QE012
      - QE019
      - QE025
