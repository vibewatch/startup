- id: milestones-and-adverse-context
  title: Milestones, acquisitions, and adverse context
  body: 'The chronology matters because CMT has moved through multiple strategic phases: academic roots, mobile-first insurance
    telematics, large-scale growth funding, adjacent acquisitions, and now an AI-plus-distribution strategy with strategic
    insurers. Tracxn’s acquisition records for TrueMotion and Amodo show that management has used M&A to add assets and distribution.
    At the same time, the company is not free of diligence overhangs. Public legal and cybersecurity sources in mid-2026 describe
    investigations tied to an alleged data breach and ransomware claim involving driver and insurance data. Those reports
    do not negate the company’s scale or product leadership, but they do create a material trust question that should be carried
    into the risks and valuation chapters rather than ignored in a celebratory overview. That adverse context is especially
    important because CMT handles location, motion, and insurance-program data at global scale. Even if the legal notices
    ultimately prove narrower than first reported, the mere presence of breach allegations changes how a buyer should evaluate
    customer concentration, renewal sensitivity, and regulatory exposure.'
