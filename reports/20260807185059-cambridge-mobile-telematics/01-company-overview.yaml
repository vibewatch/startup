chapter:
  number: 1
  title: Company Overview
  summary: Cambridge Mobile Telematics is a late-stage private telematics and mobility-safety platform built out of MIT research
    and now backed by a strategic insurer-investor syndicate. Public evidence supports meaningful product and customer scale,
    but also surfaces valuation dispersion and a live 2026 trust-and-security overhang.
sections:
- id: identity-and-roots
  title: Identity, roots, and operating footprint
  body: 'Cambridge Mobile Telematics should be treated as a mature private telematics platform rather than as an early-stage
    app vendor. The strongest identity evidence comes from CMT’s own company and leadership pages, which tie the business
    back to MIT’s CarTel research and show a 2010 company formation around Hari Balakrishnan, Sam Madden, and Bill Powers.
    The current operating footprint is global rather than regional: the March and April 2026 official releases cite headquarters
    in Cambridge, Massachusetts and offices spanning Budapest, Chennai, Seattle, Tokyo, and Zagreb. That matters for later
    diligence because the company is selling into multinational insurers, public-sector buyers, and mobility partners that
    need localization, regulatory adaptation, and long-lived customer support rather than a single-country experiment. The
    fetched headcount sources also show the limits of public-company intelligence: Unify describes a distributed, multi-location
    workforce and Tracxn reports a mid-hundreds employee base, but neither gives the audited operating metrics that would
    let an investor translate headcount into efficiency or margin confidence.'
  claimRefs:
