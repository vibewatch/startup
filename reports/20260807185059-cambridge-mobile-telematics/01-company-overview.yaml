  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: ARR, gross margin, burn, cash balance, and customer concentration by account or program.
    whyItMatters: The company is clearly scaled, but public evidence still does not reveal the quality of the underlying economics
      or renewal base.
    diligencePath: Request board materials or management KPI pack covering revenue mix, gross margin, churn, NRR, and cash
      generation.
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Cap-table-backed latest valuation and round mechanics reconciling the $1.2B and $1.53B public database
      signals.
    whyItMatters: Entry discipline and ownership dilution depend on whether 2026 price discovery reset valuation or simply
      provided partial liquidity at a prior reference point.
    diligencePath: Obtain the 2026 transaction term sheet, seller list, and updated cap table from management or counsel.
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: security-incident-status
    missingEvidence: Company-confirmed incident chronology, affected records, notifications, and remediation status for the
      2026 alleged breach.
    whyItMatters: Security trust is directly tied to insurer, public-sector, and mobility relationships that depend on sensitive
      location and crash data.
    diligencePath: Request incident-response brief, outside-counsel memo, insurance coverage position, and customer-notification
      log.
    relatedTableRefs:
    - TO004
