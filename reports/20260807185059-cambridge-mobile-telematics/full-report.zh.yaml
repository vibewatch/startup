          - type: paragraph
            body: >-
              入场纪律取决于如何解读 2026 年交易。这一轮毫无疑问是验证信号，但其全部为老股转让、非稀释性的报道改变了含义：投资人不能简单把标题金额当成资金续航风险消失的证明。估值信号也分散很大。公开市场数据来源显示低端约
              $1.2B，高端约 $1.5B，而收入证据仍是宽泛估算，不是已披露事实。这迫使估值以区间方式呈现。在低收入基数上，隐含倍数显得偏贵；在高收入基数上，它可能可以接受，甚至合理。因此，投资问题不是“CMT
              好不好？”，而是“在这个宽且不确定的区间里，纪律性资本应该在哪里入场？”在私下尽调到来之前，严谨投资人不应把这种不确定性压缩成单一整洁倍数。单是这种不确定性，就反对激进入场。明确如此。
            claimRefs:
