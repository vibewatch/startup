              CMT 很可能销售项目制合同，实际定价取决于细分市场、部署规模和启用模块数量。对投资测算而言，最有支撑的结论不是某个精确价格点，而是 CMT
              在同一套驾驶数据基础设施上拥有多个可信的经常性收入界面和交叉销售路径。如果结果兑现，这种模式通常支持续约、打包加购和账户扩张。
