  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客群组合与买方地图
        blocks:
          - type: paragraph
            body: >-
              可见客户基础由保险公司和保险相邻项目主导，而不是直接消费者采用。这与 CMT
              的商业模式一致：买方是保险公司产品、理赔或安全团队；用户是驾驶员、保单持有人和车队经理；付款方是保险公司或机构项目。公开上线案例显示，核心市场内部也有多样性。CMT
              支持个人汽车保险项目、聚焦年轻驾驶员和教育者的客群、商用车险和车队计划、理赔导向服务，以及与保险公司伙伴共同推进的认知或安全活动。这种多样性重要，因为它降低了对单一窄用例的依赖，尽管并不能完全解决客户集中度风险。最有支撑的结论是，CMT
              拥有许多有名有姓的保险关系，也有若干相邻扩张向量，车队和公共安全类项目作为次级增长界面。它也意味着买方尽调需要区分客户名单宽度和经济宽度，因为长长的保险公司名单仍可能对应集中的收入基础，如果少数全国性保险公司主导了体量。
