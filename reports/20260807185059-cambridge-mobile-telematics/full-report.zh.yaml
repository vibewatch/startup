      - number: '5.4'
        title: 信任、隐私与技术风险
        blocks:
          - type: paragraph
            body: >-
              对一个持续收集并解读驾驶员行为的平台来说，信任控制与产品成熟度不可分割。隐私政策明确写出同意授权和受治理的数据处理，这有帮助，但泄露调查提醒我们，外部利益相关方会透过安全和企业信任来评价产品。这不能证明存在系统性产品失败，但它说明技术叙事可以多快变成合规、补救和采购摩擦的尽调问题。更宽地看，公开证据更多说明产品做什么，而不是它在负载下有多稳、认证有多充分。因此，投资人应把安全、隐私和可靠性验证视为核心技术尽调，而不是边缘法律工作。合适的技术尽调包不应只有演示，还要有线上保险公司和车队环境中的事件响应、访问控制、隐私治理、可用性和错误处理的具体证据。
            claimRefs:
              - CE016
              - CE017
              - CE026
              - CE033
              - CE034
              - CE036
