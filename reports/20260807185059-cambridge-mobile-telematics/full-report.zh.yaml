  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 CMT 真正卖向哪里
        blocks:
          - type: paragraph
            body: >-
              CMT 并不是在卖进一个单一、完整的车联网预算池。抓取到的证据显示，至少有四个相邻支出池：个人汽车 UBI、联网理赔和风险流程、商用车队安全，以及公共部门道路安全分析。这一点很关键，因为宽泛的 UBI 或“出行
              AI”TAM 说法，经常把软件、激励池、保险公司经济性、联网汽车数据服务，甚至更宽的出行结果混在一起。为了尽调，CMT
              的市场边界应是软件和数据层：它让保险公司、车队和机构测量行为、定价风险、检测碰撞并保持驾驶员参与。这个更窄的边界仍然很大且在扩张，但能避免估值章节依赖夸大的全保费或全交通市场类比，因为那些类比无法干净映射到
              CMT 的变现模式。另一个有用框架是，许多保险公司项目会把软件与折扣和留存策略混合；这些消费者激励应被视为 GTM 工具，而不是证明整个保费池都能变成 CMT 可获取的软件收入。
