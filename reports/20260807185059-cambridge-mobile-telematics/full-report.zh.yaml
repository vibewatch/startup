      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图是多层的。在个人汽车保险中，保险公司通常掌握预算，定价、核保或理赔负责人掌握流程，驾驶员则是最终用户，其参与程度决定数据质量和项目
              ROI。在商用车险中，买方可能是保险公司、车队运营方，或两者兼有，并混合安全和减损用例。在公共部门，采购中心又转向交通机构和城市安全项目。外部保险公司页面也显示，激励和用户体验不是边缘细节，而是把保险公司预算转化为驾驶员行为改变的路径。由于同一套行为数据可以服务定价、理赔、安全辅导和市政规划，CMT
              所处的市场里，分销强度和流程集成与原始检测准确率同等重要。这也是为什么保险公司页面、OEM
              引用和车队产品页面都是重要证据：采用并不会在保险公司“喜欢车联网概念”时发生，而是在预算负责人能把定价、理赔、安全和用户体验接成一套运营动作时发生。
