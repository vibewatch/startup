      - number: '2.2'
        title: 规模测算视角、采用证据与估算分歧
        blocks:
          - type: paragraph
            body: >-
              独立市场来源指向同一个方向——快速增长——但它们并不同意机会到底有多大。GM Insights 将 2025 年保险车联网市场估为 $7.7B，IMARC 将更宽的 UBI 市场估为 $75B，Data
              Bridge 又给出另一套基线和预测。这种差距未必是缺陷；它反映的是市场边界、地理范围、是否纳入更宽保险经济性，以及智能手机、嵌入式和 OEM 渠道口径的差异。对 CMT
              更清晰的结论是，买方兴趣已经进入主流。大型保险公司直接向驾驶员营销车联网项目，CMT 自己的欧洲报告也显示，最早采用地区之外仍有很大提升空间。市场足够大，可以容纳多个规模化供应商，但它并不均质，不能让单一自上而下
              TAM 数字主导投资测算。因此，严谨投资人应把宏观需求转化为可部署项目数量、平均合同价值、实施范围和续约机制，而不是假设所有自上而下的 UBI 支出都同样能被车联网供应商拿到。
