            body: >-
              证据支持一个积极但不完整的财务结论。CMT 看起来像一家轻资本软件平台，规模、产品宽度和战略背书足以支撑严肃尽调；2026
              年交易也显著提高了对成熟交易对手相信平台能继续扩张的信心。不过，公开证据无法让投资人精确测算收入质量。主要卡点很直接：没有可靠的公开实际定价数据，没有已披露 ARR
              或利润率桥，没有按客户分组披露的留存，没有客户集中度披露，也没有量化的泄露后商业影响。这意味着公司仍可能有吸引力，但吸引力来自战略位置和可能的平台杠杆，而不是已经验证的近期经济性。任何投委会备忘录都应把收入、估值和融资指标视为有边界的区间，并要求管理层数据室证据，才能把战略强度转化为硬投资测算数字。备忘录还应强制厘清
              2026 年交易中有多少是新发资本，Allianz 商业协议能多快转化为确认收入，以及支持密集型客户部署是否会稀释原本有吸引力的软件经济性。
