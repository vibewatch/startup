  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              从公开数据看，CMT
              的战略层面论点很有吸引力。公司拿到了大型保险和影响力投资伙伴的真实分销验证，产品证据横跨定价、理赔、车队和用户运营流程，客户版图也看起来足够全球化、有分量。这些都不是小优点。反向论点同样清楚：公开记录更擅长证明
              CMT 重要，而不是精确证明它赚多少、留住多少、利润率多少。由于业务是私营的，投资人必须用判断填补这个缺口。因此，正确估值姿态要从不对称性出发。CMT
              可能是一家强公司，但围绕经济性的证据质量还不够强，不能支撑动量式投资测算。换句话说，这更是尽调问题，而不是找项目问题。这里价格比叙事兴奋更重要。
