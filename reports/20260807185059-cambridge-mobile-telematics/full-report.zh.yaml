  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代路径
        blocks:
          - type: paragraph
            body: >-
              CMT
              并不处在一个整齐的供应商框里。买方可以通过专业车联网供应商、既有数据提供商、车队平台、保险公司自有项目，或部分内部自研，完成同一项底层工作。抓取到的格局来源显示，Snapshot、SmartRide、Drivewise
              等保险公司品牌项目仍是强替代方案，因为保险公司可以保留面向客户的控制权，同时决定底层车联网基础设施外包多少。与此同时，分析师数据库和供应商网站显示，大量专业公司正从不同角度进攻这个品类：联网汽车数据、隐私优先分析、用户运营和奖励、保险公司协同，或车队和
              OEM 邻接。对 CMT
              来说，赢下一单“车联网”交易，往往更取决于买方最关心哪一段流程，而不是它是否属于这个品类。来源也暗示，买方评估车联网时常会把相邻数据和理赔供应商一起看，而不是放在独立桶里。这会把有效竞争集扩大到那些首页未必写着
              telematics 的公司之外。
