      - number: '1.4'
        title: 里程碑、收购与负面背景
        blocks:
          - type: paragraph
            body: >-
              时间线很重要，因为 CMT 已经经历了多个战略阶段：学术根基、移动优先的保险车联网、大规模成长融资、相邻收购，以及现在与战略保险公司绑定的 AI 加分销策略。Tracxn 关于 TrueMotion 和
              Amodo 的收购记录显示，管理层用 M&A 增补资产和分销。与此同时，公司并非没有尽调阴影。2026
              年中，公开法律和网络安全来源描述了围绕一起被指控数据泄露和勒索软件索赔的调查，涉及驾驶员和保险数据。这些报道不否定公司的规模或产品领导力，但会带来一个重大的信任问题，风险和估值章节必须承接，不能在庆祝式概览里略过。负面背景尤其重要，因为
              CMT 在全球规模上处理位置、运动和保险项目数据。即便法律通知最终证明比最初报道更窄，仅仅出现泄露指控，就会改变买方评估客户集中度、续约敏感度和监管暴露的方式。
