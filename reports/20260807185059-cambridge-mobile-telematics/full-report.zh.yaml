      - number: '3.2'
        title: 同业画像与各供应商强调点
        blocks:
          - type: paragraph
            body: >-
              直接同业之间的差异，更多来自强调点，而不是它们是否声称处理驾驶数据。Arity 侧重定价精细化和保险公司盈利能力，LexisNexis 侧重标准化和流程简化，Octo 侧重联网车辆保险，Sentiance
              侧重设备端、隐私优先的智能，IMS 侧重独立所有权和数据控制，Targa 侧重 OEM 和车队邻接，The Floow 则侧重用户运营和奖励。Zendrive 和 Netradyne
              显示，更宽的出行安全品类仍能从相邻市场吸引投资人和产品关注。CMT
              在这个领域的主要优势是平台宽度。它的公开产品界面覆盖风险、评分、碰撞、理赔、车队、用户运营，以及更新的基础模型层；当买方希望一个供应商支持多个运营团队而不是一个点状方案时，这一点会很重要。平台宽度重要，是因为保险公司越来越希望生产环境里的供应商更少，尤其当车联网同时触及定价、理赔和客户沟通时。因此，即便专业供应商在某个窄任务上更强，更宽的技术栈仍可能成为
              GTM 优势。
