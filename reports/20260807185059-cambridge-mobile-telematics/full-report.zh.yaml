      - number: '7.4'
        title: 财务模型风险与否决条件
        blocks:
          - type: paragraph
            body: >-
              CMT 的财务风险更多来自可见度不足，而不是需求疲弱的证据。公开来源仍未充分披露现金、烧钱、资金续航或留存，无法测算韧性。2026
              年融资提高了战略验证，但关于其全部为老股转让的报道意味着，投资人不能把标题金额当作新增运营现金的干净代理。客户集中度同样未解决。审慎结论是，在私下尽调闭合资本充足性、续约质量和泄露后客户影响之前，剩余风险应保持中等或更高。这也定义了否决条件：如果确认公司处置泄露不当、主要客户流失、关键分销渠道丢失，或出现证据表明即便有
              2026 年交易，实际资金续航仍很短，都应实质性削弱投资论点。实际操作中，缺失数字和缺失控制证据本身就是风险画像的一部分。保守投资人因此应坚持做下行情景建模，把隐私事件、伙伴流失和 2026
              年交易带来的现金延展低于预期纳入模型。
