      - number: '8.3'
        title: 情景框架与可比视角
        blocks:
          - type: paragraph
            body: >-
              公开可比公司有用，正因为它们能压住虚假的精确感。CCC、Samsara 和 Verisk
              分别覆盖保险工作流软件、车队软件和保险数据既有优势；三家公司合在一起，说明成熟度和增长曲线不同，估值倍数结果会被拉开多大。Octo、Netradyne
              等私有可比公司也说明，车联网和车队安全能拿到可观价值，但没有统一公式。CMT
              似乎卡在这些类别中间：若增长和留存足够强，战略价值足以让它相对传统工作流软件享有溢价；但披露太不透明，不能像一家有审计指标的上市公司那样给确定性。因此，基准情形应该是一组场景，不是一格数字模型。本案里，场景区间比表格做得漂亮更重要。投资者也应盯住相对区间和断点：收入、留存和风险结果到什么程度，才足以把锚点从公开可比公司推向高溢价的非上市软件公司；哪些结果又会迫使估值打更狠的折扣。区间纪律胜出。
