      - number: '8.4'
        title: 最终判断与尽调问题
        blocks:
          - type: paragraph
            body: >-
              基于公开数据的最终判断是继续研究，置信度中等。不是否定，而是一种对证据敏感的姿态。如果私下尽调确认实际定价、留存和资本充足度更接近合理区间的有利端，建议无需大幅压低估值就可能转向正面。反过来，如果数据泄露阴影恶化、某个大型保险客户关系削弱，或一手现金支持比
              2026
              年标题暗示的更薄，判断应迅速下调。实际结论是，剩下的工作范围窄、价值高：厘清经济性可见度、集中度和信任问题。在此之前，“合理到偏贵”的立场，比坚定买入或坚决回避都更站得住脚。公开记录能把投资委员会带到门口，但还不足以推门进去。因此，下一小时尽调的价值异常高。估值纪律的核心就在这里。
