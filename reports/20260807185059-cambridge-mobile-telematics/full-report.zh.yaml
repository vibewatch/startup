  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与隐私风险
        blocks:
          - type: paragraph
            body: >-
              最尖锐的公开风险是隐私和网络暴露。多个负面法律提示和事件报告来源描述了泄露相关审视，涉及敏感的驾驶行为、位置历史和保险相关信息。即便责任尚未被证明，这类风险天然重大，因为车联网平台处理的正是监管者和原告最关心的数据类别。CMT
              自己的隐私政策明确写出同意授权和受治理的数据处理，这是必要但不充分的安慰。FTC 和 California
              隐私材料也强化了，一旦涉及精确行为和位置数据，控制预期会变得多严格。对投资人来说，关键点很简单：隐私合规在这里不是附带法律工作；它是核心产品和商业风险，因为一次失败可以同时冲击信任、采购和续约。这也意味着，普通软件式安全滑坡会在这个品类里产生超大商业后果。董事会级别，而且非常重大。
