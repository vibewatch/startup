        - 跨国家分布式执行
        - 中
        - 中
        - 全球布局和伙伴基础
        - 索取地区级运营指标
      - - 实施 / 服务
        - 需要支持理赔和车队上线
        - 中
        - 中
        - 模块复用可能降低负担
        - 索取服务毛利和 SLA 数据
      - - 安全 / 隐私负责人
        - 数据泄露受到审视后，信任基础高度依赖该职能
        - 中
        - 高
        - 公开信息未知
        - 索取组织架构图和事件治理模型
    notes: 执行风险值得关注：平台同时横跨技术、运营和监管三类能力。
    claimRefs:
