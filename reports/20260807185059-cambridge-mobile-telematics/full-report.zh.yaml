              融资历史异常重要，因为它可能比任何已披露 P&L 指标更能说明 CMT 的财务位置。公司此前在 2018 年宣布获得 SoftBank Vision Fund $500M 融资，随后在 2026 年 3 月完成由
              TPG 和 Allianz X 领投、State Farm 参与的 $350M 战略交易。多个独立来源确认了 2026 年交易的存在及其战略定位，包括与 Allianz
              实体绑定的商业协议。与此同时，Fortune 转载报道称该交易全部为老股转让、非稀释性，这改变了解读：它是强市场验证，但不能自动等同于新注入资产负债表的现金。因此，正确的财务读法应分成两层。CMT
              看起来能够吸引成熟资本和分销伙伴；但公开记录没有清楚回答账上现金、资金续航或下一轮融资时间，因为即使总融资额统计，各数据库之间也存在分歧。
