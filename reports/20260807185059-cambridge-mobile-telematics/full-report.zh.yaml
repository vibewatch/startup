            body: >-
              公开证据支持一个更细的护城河判断。CMT 有真实的规模信号和模块宽度，TrueMotion、Amodo
              等收购也说明管理层已经像整合者一样行动。但这个市场不是赢家通吃。专业供应商在窄品类里已经足够好，数据访问可能转移，保险公司自有项目也会降低对单一软件供应商的依赖。Verisk
              进入又退出的例子尤其有启发：即使大型既有玩家，也可能在上游数据访问变化时受挫。因此，CMT
              的护城河更像运营型，而不是绝对型。当保险公司买方想一次性找一个可信伙伴，覆盖定价、用户运营、理赔和车队邻接时，它最强；当客户把技术栈拆成组件，或把隐私、OEM
