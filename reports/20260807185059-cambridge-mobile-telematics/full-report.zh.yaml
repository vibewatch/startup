    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、根基与运营版图
        blocks:
          - type: paragraph
            body: >-
              Cambridge Mobile Telematics 应被视为成熟的私营车联网平台，而不是早期应用供应商。最强的身份线索来自 CMT 自己的公司和领导层页面：业务可追溯到 MIT 的 CarTel
              研究，并显示公司在 2010 年围绕 Hari Balakrishnan、Sam Madden 和 Bill Powers 成立。当前运营版图不是区域性的，而是全球性的：2026 年 3 月和 4
              月的官方新闻稿称，公司总部在 Massachusetts 的 Cambridge，并在 Budapest、Chennai、Seattle、Tokyo 和 Zagreb
              设有办公室。这一点会影响后续尽调，因为公司面对的是跨国保险公司、公共部门买方和出行合作伙伴，他们需要本地化、监管适配和长期客户支持，而不是单一国家试验。抓取到的人数来源也暴露了私营公司情报的边界：Unify
              描述的是分布式、多地点团队，Tracxn 报告员工规模在数百人中段，但两者都没有给出经审计的运营指标，无法让投资人把人数转化为效率或利润率信心。
