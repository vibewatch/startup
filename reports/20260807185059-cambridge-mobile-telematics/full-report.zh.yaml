      - number: '1.2'
        title: 领导层、研究基因与产品身份
        blocks:
          - type: paragraph
            body: >-
              这家贴近保险行业的公司，领导层技术含量异常高。Balakrishnan 和 Madden 仍以联合创始人身份活跃在公开叙事中，并与 MIT 研究相连；Powers 则以 CEO
              身份撑起商业化建设。产品叙事也更像平台叙事：DriveWell Fusion 是风险测量、碰撞流程、理赔和驾驶辅导的操作系统，DriveWell Atlas 则是更新的基础模型层，意在打通手机、车辆和 IoT
              信号。TIME 和 Edison Awards 的外部认可说明 CMT 已经被保险行业媒体之外的人注意到，但这些奖项不能替代对模型准确性、客户留存或利润率的尽调。不过，它们确实支撑了 CMT 围绕道路安全 AI
              建起真实品牌资产的说法。技术基因也解释了为什么公司强调专利、评分的州级监管批准，以及专有的多模态训练数据。以尽调语言看，概览证据指向一家在私营保险科技供应商中研发纵深罕见持久的公司，但它仍需要在面对超大型交易对手时证明商业化纪律。
