      - CR022
      - CR023
      - CR031
  - id: TR005
    title: 缓释措施与叫停标准表
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 数据泄露 / 隐私风险
        - 确认发生重大泄露，或通知处理不当
        - 主要客户或监管方提出担忧
        - 暂停或重估投资假设
      - - 客户耐久性风险
        - 大型保险公司流失或不续约
        - 头部项目退出或明显缩小
        - 重新评估收入耐久性
      - - 依赖风险
        - OEM / 保险公司数据渠道替代
        - 买方转离智能手机主导的工作流
        - 重新评估护城河和增长
      - - 财务风险
        - 2026 年交易后，资金续航仍显不足
        - 私下尽调显示新增一级资金对 runway 拉长有限
        - 要求新的资本计划或更低价格
      - - 执行风险
        - 反复出现实施或可靠性问题
        - 大型项目服务故障升级
        - 降低确信度，或要求运营整改
    notes: 叫停标准设计成投后可监控，而不是泛泛的红旗。
    claimRefs:
      - CR028
      - CR029
      - CR030
      - CR039
  - id: TV001
    title: 建议摘要表
    columns:
      - 指标
      - 判断
      - 原因
    rows:
      - - 建议
        - 继续研究
        - 战略实力真实，但经济性披露仍不足
      - - 置信度
        - 中
        - 多个关键估值输入来自估算或相互冲突
      - - 风险评级
        - 高
        - 隐私、留存和资本可见度仍未解决
      - - 估值立场
        - 公允
        - 区间可能合理，也可能偏贵，取决于实际收入基数
      - - 决策含义
        - 继续尽调
        - 定价要有确信度，先拿到私密指标
    notes: 摘要明确随证据变化，不是泛泛的公司质量评分。
    claimRefs:
      - CV003
      - CV004
      - CV025
      - CV040
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 公开证据
      - 改变判断的条件
    rows:
      - - 保险公司战略验证
        - 2026 年融资轮和商业协议
        - 需要证明验证能转化为持久经济性
      - - 产品和客户验证面广
        - 各章节都能看到多模块与落地信号
        - 还需要留存和利润率数据，才能把广度转成估值信心
      - - 不透明度的反方论点
        - 收入、融资和现金跑道都不精确
        - 非公开管理层材料可能大幅提升信心
      - - 风险端的反方论点
        - 数据泄露与客户持续性压力
        - 需要整改和续约数据来降低折价
    notes: 正方和反方论点都有实质证据支撑；建议来自两者的权衡结果。
    claimRefs:
      - CV001
      - CV002
      - CV024
      - CV027
      - CV030
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 收入更接近估算区间上沿，留存强，战略渠道持续复利
        - 私募市场倍数接近或高于当前高端估值仍有依据
        - 需要非公开尽调确认经营经济性
        - 证据落地前出价过高
      - - 基准
        - 业务强，但不透明度仍在；持续性看起来不错，还没被证明
        - 宽估值区间和继续研究建议仍合适
        - 最符合当前公开证据
        - 局部数据造成伪精确
      - - 悲观
        - 收入更接近估算下沿，数据泄露或续约问题削弱信心
        - 当前隐含估值偏高，应打折
        - 若非公开尽调疲弱或出现负面风险事件，就会走向该情景
        - 不透明叠加风险，带来陡峭下行
    notes: 情景是方向性的，因为公开记录不足以支持精确现金流建模。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV039
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 匹配点
      - 局限
    rows:
      - - CCC Intelligent Solutions
        - 2026 年市值和收入
        - 约 3.7x 收入
        - 保险工作流软件锚点
        - 上市公司，增长和利润率画像不同
      - - Samsara
        - 2026 年市值和收入
        - 约 13.8x 收入
        - 车队 / 车联网相邻的高增长软件锚点
        - 更宽的 IoT 平台，且有公开市场流动性
      - - Verisk
        - 2026 年市值和收入
        - 约 8.2x 收入
        - 保险数据老牌公司锚点
        - 成熟上市老牌公司，不是直接的私募阶段可比对象
      - - Octo Telematics / Netradyne
        - 私营公司的收入或估值标记
        - 2020 年收入 €134M / 2025 年估值 $1.25B
        - 品类特定的私募市场背景
        - 不是干净的当前倍数组合
    notes: 可比组有意混合，因为没有一家上市公司与 CMT 完全匹配。
    enumerationScope:
      coverage: partial
      basis: >-
        Representative comp set spanning insurance workflow, insurance data, fleet software, and private telematics
        peers; not exhaustive.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV031
      - CV033
      - CV034
  - id: TV005
    title: 推翻论点和否决触发表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 重大数据泄露 / 信任事件
        - 事件坐实，且客户或监管处理不佳
        - 削弱对留存和采购的信心
        - 转向回避，或要求更低入场价
      - - 一级现金支撑薄弱
        - 非公开尽调显示，即便有 2026 年融资，现金跑道仍有限
        - 削弱战略验证叙事
        - 重定价，或要求融资计划
      - - 主要保险公司流失
        - 头部险企关系明显走弱
        - 损害客户验证和收入持续性
        - 立即重估论点
      - - OEM / 竞争对手渠道替代
        - 买方更偏好替代数据渠道，而不是智能手机主导的工作流
        - 压缩护城河和增长假设
        - 下调情景区间
      - - 留存低于预期
        - 同期群数据显示扩张弱或流失高
        - 削弱溢价倍数依据
        - 持有或回避
    notes: 否决触发因素是新信息改变建议的最短路径。
    claimRefs:
      - CV020
      - CV021
      - CV027
      - CV028
      - CV035
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 已实现定价和 ARR
        - 按项目和模块拆分的收入基础
        - 决定所有倍数判断
        - 索取客户级定价和 ARR 桥接
      - - 留存和集中度
        - NRR、GRR、续约、头部账户结构
        - 区分广泛客户名单与可持续经济性
        - 索取同期群和集中度表
      - - 现金跑道和资本充足性
        - 现金、烧钱速度、现金跑道、下一轮融资假设
        - 把二级轮叙事转成资产负债表现实
        - 索取月度现金预测
      - - 数据泄露整改和信任
        - 事件处理、客户沟通、控制升级
        - 可能快速改变下行情景估值
        - 索取事件资料包和信任材料
      - - 模块附加率
        - 按账户拆分的交叉销售深度
        - 解释平台广度是否充分变现
        - 索取头部客户模块附加率
    notes: 这五项是从公开兴趣走向可投资信念之间价值最高的卡点。
    claimRefs:
      - CV002
      - CV024
      - CV026
      - CV029
      - CV039
