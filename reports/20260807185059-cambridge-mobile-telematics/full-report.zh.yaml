      - number: '3.3'
        title: 定价、分销与转换成本动态
        blocks:
          - type: paragraph
            body: >-
              整个品类的公开定价透明度都很低，这本身就有信息量。多数供应商采用企业销售和定制项目设计，所以分销能力、既有关系和 ROI
              证明比公开标价更重要。这种动态有利于保险公司自有项目和大型数据既有玩家，因为它们已经控制客户关系，或已经嵌在相邻保险流程里。它也带来转换成本问题：如果保险公司只购买技术栈的一个组件，专业供应商可能很难被替换；如果保险公司想要更宽的运营平台，多模块供应商就有优势。CMT
              看起来在第二种场景最强。但同样的平台宽度也可能反噬它，若买方越来越倾向于从不同供应商拼装最佳单项评分、用户运营、OEM 数据和理赔组件。公开定价不透明进一步强化了这一点：竞争大概率是在
              RFP、数据室演示和实施规划中决出，而不是在公开功能表上决出。分销和信任可能比边际评分提升更重要，因为买方未必能把后者落到运营里。
