      - number: '1.3'
        title: 资本结构、规模信号与运营成熟度
        blocks:
          - type: paragraph
            body: >-
              公开融资证据显示，公司在 2026 年接受另一轮战略融资之前，已经完成过一轮异常庞大的成长轮。2018 年 SoftBank Vision Fund 投资把 CMT 推成后期私营公司；2026 年 3 月
              TPG、Allianz、State Farm 交易则把业务更接近地定位成保险公司和出行企业的战略基础设施提供商。规模披露虽是方向性信息，但有分量：CMT 称通过 140 个项目在 25 个国家支持 5500
              万名驾驶员，较早材料还称它为北美前 25 大汽车保险公司中的 21
              家提供车联网能力。数据库来源也指向数百人中段的员工规模和持续现金生成，说明公司已经走出试点阶段，尽管收入和利润率披露仍然保持私有。公开可见的估值来源也并不完全一致，这对私营公司很常见，但仍值得注意：Premier
              Alternatives 指向约 $1.2B，Tracxn 则给出更高数值。这个区间并不会推翻增长故事，但意味着入场定价不能只靠标题来测算。
