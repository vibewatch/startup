              NRR、GRR、流失率、平均合同期限或头部客户收入集中度。这意味着投资人能看到客户牵引力，却看不到这种牵引力的韧性。可见基础仍然高度以保险公司为中心，这在战略上可能有吸引力，但在管理层展示按保险公司、地理和模块划分的收入分布前，集中度风险仍未解决。因此，公开客户存在证据强于公开客户持久性证据，这个缺口投资人应视为核心问题，而不是外观瑕疵。在数据可得之前，任何客户质量评分都应受到续约、模块渗透和合同粘性不确定性的限制。
