- id: pricing-distribution-and-lock-in
  title: Pricing, distribution, and switching-cost dynamics
  body: 'Public pricing transparency is low across the category, which is itself informative. Most vendors use enterprise
    sales and custom program design, so distribution power, incumbent relationships, and proof of ROI matter more than visible
    list prices. That dynamic helps carrier-owned programs and large-data incumbents because they already control customer
    relationships or sit inside adjacent insurance workflows. It also raises switching-cost questions: if a carrier buys only
    one component of the stack, specialists can be hard to displace; if a carrier wants a broader operating platform, the
    multi-module vendor has an advantage. CMT appears strongest in the second case. But the same breadth can work against
    it if buyers increasingly assemble best-of-breed scoring, engagement, OEM data, and claims components from different suppliers.
    Public pricing opacity reinforces this point: the competitive contest is probably decided in RFPs, data-room demos, and
    implementation planning rather than on public feature grids. Distribution and trust can matter more than a marginal scoring
    improvement that a buyer cannot operationalize.'
  claimRefs:
  - CP023
  - CP024
  - CP025
  - CP026
  - CP027
  - CP028
