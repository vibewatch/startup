  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Contract pricing, implementation fees, and renewal terms across CMT and the peer set.
    whyItMatters: Public websites show positioning but not the economic basis on which competitors really win or lose deals.
    diligencePath: Collect win/loss files, RFP responses, and redlined contracts from recent competitive processes.
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Actual churn, module attach rates, and migration friction for customers considering specialist or internal
      alternatives.
    whyItMatters: The moat thesis depends on whether breadth really creates stickiness or just adds sales complexity.
    diligencePath: Request cohort-level retention and module-usage data plus reference calls from multi-product customers.
  - type: conflicting-data
    severity: minor
    topic: landscape-boundary
    missingEvidence: A management-defined primary competitor list split by personal auto, commercial auto, OEM, and public-sector
      workflows.
    whyItMatters: Different chapters can overgeneralize competition if all telematics vendors are treated as direct substitutes
      in every deal.
    diligencePath: Ask management for the top five competitors by segment, region, and product line with recent win/loss examples.
