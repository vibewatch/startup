- id: moat-durability-and-commoditization-risk
  title: Moat durability and commoditization risk
  body: 'The public evidence supports a nuanced view of moat. CMT has real scale signals and module breadth, and acquisitions
    such as TrueMotion and Amodo suggest management has already acted like a consolidator. But the market is not winner-take-all.
    Specialists are good enough in narrow categories, data access can shift, and carrier-owned programs reduce dependence
    on any one software supplier. Verisk’s entry-and-exit example is especially revealing: even large incumbents can struggle
    when upstream data access changes. CMT’s moat therefore looks more operational than absolute. It is strongest when insurer
    buyers want one trusted partner for pricing, engagement, claims, and fleet adjacency at once; it is weakest when customers
    decompose the stack into components or privilege privacy, OEM distribution, or incumbent account control over platform
    breadth. The chapter therefore treats competition as durable but not fatal. CMT does not need to beat every specialist
    on its own preferred axis; it needs to remain the highest-confidence integrated choice for the buyer profiles that value
    breadth and deployment speed.'
