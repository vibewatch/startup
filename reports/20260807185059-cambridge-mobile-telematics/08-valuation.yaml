company:
  name: Cambridge Mobile Telematics
chapter:
  number: 8
  title: Valuation
  summary: The public record supports a wide, risk-adjusted valuation range rather than a precise point estimate for CMT.
    Strategic validation and platform breadth justify continued diligence, but economic opacity and risk overhang support
    a research-more recommendation with medium confidence rather than a conviction buy.
sections:
- id: thesis-vs-anti-thesis
  title: Thesis versus anti-thesis
  body: 'The public-data thesis for CMT is compelling at a strategic level. The company has real distribution validation from
    large insurance and impact-investing partners, broad product proof across pricing, claims, fleet, and engagement workflows,
    and a customer footprint that appears global enough to matter. Those are not small positives. The anti-thesis is equally
    clear: the public record is much better at proving that CMT matters than at proving exactly what it earns, retains, or
    margins. Because the business is private, investors have to bridge that gap with judgment. The correct valuation posture
    therefore starts with asymmetry. CMT may be a strong company, but the evidence quality around economics is not yet strong
    enough to justify momentum-style underwriting. In other words, this is a diligence problem more than a sourcing problem.
    Price matters here more than narrative excitement.'
  claimRefs:
  - CV001
  - CV002
  - CV020
  - CV021
  - CV022
  - CV030
  - CV036
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
- id: entry-discipline-and-valuation-context
  title: Entry discipline and valuation context
  body: 'Entry discipline hinges on how the 2026 transaction is interpreted. The round is unquestionably a validation signal,
    but the reporting that it was all-secondary and non-dilutive changes its meaning: investors cannot simply treat the headline
    dollars as proof that runway risk disappeared. Valuation signals also spread widely. Public market-data sources point
    to roughly $1.2 billion at the low end and around $1.5 billion at the high end, while revenue evidence remains a broad
    estimate rather than disclosed fact. That forces valuation to be framed as a range. On a low revenue base the implied
    multiple looks rich; on a high revenue base it can look tolerable or even reasonable. The investment question is therefore
    less “is CMT good?” and more “where within this wide, uncertain range should disciplined capital enter?”. A disciplined
    investor should resist collapsing that uncertainty into a single tidy multiple before private diligence arrives. That
    uncertainty alone argues against an aggressive entry decision. Explicitly.'
  claimRefs:
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  - CV011
  - CV017
  - CV018
