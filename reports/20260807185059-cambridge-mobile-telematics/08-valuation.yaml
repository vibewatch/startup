  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Public support
  - What would change the view
  rows:
  - - Strategic insurer validation
    - 2026 round and commercial agreements
    - Need proof that validation translates into durable economics
  - - Broad product and customer proof
    - Multiple module and deployment signals across chapters
    - Need retention and margin to convert breadth into valuation confidence
  - - Opacity anti-thesis
    - Revenue, funding, and runway are imprecise
    - Private management materials could sharply improve confidence
  - - Risk anti-thesis
    - Breach and customer-durability overhang
    - Need remediation and renewal data to reduce discount
  notes: Thesis and anti-thesis are both materially evidence-backed; the recommendation is the output of their balance.
