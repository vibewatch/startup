- id: scenario-framework-and-comparable-lens
  title: Scenario framework and comparable lens
  body: 'Public comparables are helpful precisely because they constrain false precision. CCC, Samsara, and Verisk span insurance
    workflow software, fleet software, and insurance-data incumbency; together they show how much multiple outcomes can differ
    across maturity and growth profiles. Private peers such as Octo and Netradyne further show that telematics and fleet safety
    can attract significant value, but not on a uniform formula. CMT seems to sit between these categories: strategically
    important enough to deserve a premium over legacy workflow software if growth and retention are strong, but too opaque
    to deserve the same certainty as a public company with audited metrics. That makes the base case a scenario exercise,
    not a single-number model. That is exactly why scenario ranges matter more than spreadsheet elegance in this case. It
    also means investors should focus on relative ranges and breakpoints: which revenue, retention, and risk outcomes would
    justify moving from a public-comp anchor toward a premium private-software anchor, and which outcomes would force a sharper
    discount. Range discipline wins.'
  claimRefs:
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV023
  - CV031
  - CV033
  - CV034
  tableRefs:
  - TV004
  figureRefs:
  - FV004
- id: final-call-and-diligence-asks
  title: Final call and diligence asks
  body: 'The final public-data call is research-more with medium confidence. That is not a dismissal; it is an evidence-sensitive
    posture. If private diligence confirms that realized pricing, retention, and capital adequacy are closer to the favorable
    end of the plausible range, the recommendation could move positively without needing a radically lower valuation. Conversely,
    if the breach overhang worsens, a major insurer relationship weakens, or primary cash support is thinner than the 2026
    headline suggests, the call should degrade quickly. The practical takeaway is that the remaining work is narrow and high
    value: resolve economic visibility, concentration, and trust. Until then, a fair-to-stretched stance is more defensible
    than either a hard buy or a hard avoid. The public record gets the committee to the door, but not through it. That makes
    the next diligence hour unusually valuable. That is the central valuation discipline.'
