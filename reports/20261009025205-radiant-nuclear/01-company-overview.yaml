chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2020 by former SpaceX engineers, Radiant Nuclear is developing Kaleidos, a factory-built 1 MW transportable microreactor aimed at replacing diesel generation for defense, remote power, and data centers. The company has raised over $500 million in private capital, reached a $1.8 billion valuation in December 2025, and secured a $750 million US Army Janus contract in August 2026, though commercial revenues remain undisclosed."
sections:
  - id: "identity-and-mission"
    title: "Company Identity, Origins, and Core Mission"
    body: "Radiant Nuclear (Radiant Industries, Inc.) is an El Segundo, California-based nuclear technology company founded in 2020 to build mass-produced, transportable nuclear microreactors. The startup's flagship product is Kaleidos, a factory-manufactured 1 megawatt electric (1 MWe) failsafe microreactor engineered to be transported via land, sea, or air inside standard shipping containers and deployed directly to operating customer sites. Radiant was established by former SpaceX engineers who sought to apply aerospace manufacturing methodologies, modern software integration, and rapid hardware iteration to nuclear power generation. The primary commercial and military mission of Kaleidos is displacing diesel generators at remote military installations, critical civil infrastructure, hospitals, and high-density computing facilities, delivering continuous carbon-free electricity without refueling for up to five years."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Risk"
    body: "Radiant's operational and technical leadership structure reflects an engineering culture derived from aerospace and rapid hardware development. The executive bench is led by President and Chief Operating Officer Tori Shivanandan alongside Chief Commercial Officer Mike Starrett, Ph.D., who oversee manufacturing systems scaling, facility buildout, and commercial deployment pathways. The company operates from its main headquarters and manufacturing facility in El Segundo, California, while establishing burgeoning satellite offices in Oak Ridge, Tennessee, and Washington, D.C., to maintain active proximity to national laboratories and federal regulators. Because Radiant relies heavily on high-velocity hardware iteration and proprietary manufacturing tooling, key-person dependencies remain concentrated in core mechanical, nuclear systems, and manufacturing engineering leadership. The governance architecture balances private venture capital board representation with strategic aerospace and defense stakeholders."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-defense-contracts"
    title: "Capitalization History, Valuation, and Defense Backing"
    body: "Radiant has raised substantial private equity funding alongside major non-dilutive federal defense awards. In December 2025, the company announced an oversubscribed funding round raising more than $300 million led by Draper Associates and Boost VC, with participation from Founders Fund, Ark Venture Fund, Chevron Technology Ventures, and Friends & Family Capital, which established a post-money valuation exceeding $1.8 billion. This followed an earlier $165 million capital raise completed six months prior. In February 2026, Radiant expanded its strategic coalition by adding defense prime Lockheed Martin as a strategic investor to the round. Crucially, in August 2026, Radiant secured a landmark $750 million contract from the US Army under the Janus Program to manufacture and deliver a fleet of 15 transportable microreactors. Despite these headline funding and contract milestones, Radiant discloses no recurring commercial revenue or power-purchase cash generation, and financial analysts have raised concerns regarding a frothy nuclear market bubble and manufacturing replication hurdles."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
