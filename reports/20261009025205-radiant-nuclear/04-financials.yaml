chapter:
  number: 4
  title: "Financials"
  summary: "Radiant Nuclear has capitalized its pre-criticality development through substantial equity financing, including a Series D raise exceeding $300 million at a valuation above $1.8 billion, yet remains pre-revenue with unquantified operational burn and commercial revenue conversion dependent on future multi-year demonstration and factory milestones."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Streams and Monetization Architecture"
    body: "Radiant Nuclear is developing its 1 MW Kaleidos microreactor as a transportable, factory-built energy alternative designed to displace industrial diesel generation across military, remote community, and commercial facilities. The company’s commercialization model encompasses dual transactional mechanisms: direct capital equipment sales and long-term recurring power-purchase agreements (PPAs), supported by comprehensive end-of-life de-fueling and unit haul-away services over a 20-year reactor design lifetime. Public disclosures confirm major customer engagements, led by a $750 million contract framework from the U.S. Army to supply energy resilience across military installations and an agreement targeting deployment at Buckley Space Force Base by 2028. However, recognized revenue remains at zero, as commercial deliveries and billable power generation are structurally gated behind first-of-a-kind reactor criticality and safety authorizations."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure, Manufacturing Scale, and Unit Economics"
    body: "The operating cost structure of Radiant Nuclear is primarily concentrated in advanced research, prototype fabrication, regulatory licensing, and manufacturing plant capitalization. The company’s planned mass-production facility, designated the R-50 plant located in Oak Ridge, Tennessee, represents a $280 million capital build-out intended to support 175 specialized personnel and scale production output to 50 factory-built microreactors per year—equivalent to approximately one Kaleidos unit per week. Each reactor utilizes a high-temperature helium gas-cooled configuration powered by TRISO fuel designed for five years of continuous operation between refueling cycles. While the capital investment model targets compelling long-term levelized costs against remote diesel generators, near-term gross margins and manufacturing unit economics remain entirely speculative prior to active factory tooling and component cost verification."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital Adequacy, Burn Exposure, and Underwriting Verdict"
    body: "Radiant has established substantial capital access within the private advanced nuclear sector, completing a Series D round exceeding $300 million in late 2025 led by Draper Associates and Boost VC that brought valuation above $1.8 billion, following a $165 million Series C closed earlier in 2025. Although cumulative equity financing surpasses $500 million, the company faces significant build-before-proof trade-offs, funding extensive site construction and federal project commitments in advance of fueled critical testing. Milestone execution is rigidly bound to the planned 2026 fueled demonstration of the Kaleidos Development Unit inside Idaho National Laboratory's DOME testbed, spanning five testing phases and 150 hours of autonomous full-power operation, alongside persistent High-Assay Low-Enriched Uranium (HALEU) supply chain allocations and Department of Energy authorization reviews. These capital-intensive dependencies and opaque ongoing cash burn metrics constitute primary underwriting blockers."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
callouts:
  - calloutType: "risk"
    title: "Pre-Criticality Capital Exposure"
    body: "Radiant is deploying extensive capital toward factory build-out and multi-hundred-million-dollar defense frameworks while core fueled reactor safety, 150-hour autonomous endurance, and sustained commercial HALEU fuel availability remain unresolved technical hurdles."
    claimRefs:
      - "CI013"
      - "CI014"
      - "CI016"
  - calloutType: "insight"
    title: "Commercial Contracting vs Revenue Conversion"
    body: "While customer pipeline validation is demonstrated by a $750 million U.S. Army Janus contract and Space Force base selection, these agreements represent procurement vehicles and milestone allocations rather than immediate recognized commercial revenues."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
