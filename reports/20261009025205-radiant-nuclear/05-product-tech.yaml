chapter:
  number: 5
  title: "Product & Technology"
  summary: "Radiant Nuclear is developing Kaleidos, a factory-manufactured, 1 MWe / 3 MWth transportable high-temperature gas-cooled microreactor housed in a standard ISO shipping container and fueled by meltdown-resistant TRISO particles. The system is designed to provide five years of continuous power without refueling, primarily targeting diesel displacement across military installations and commercial data centers. While pre-application engagement with the NRC is active under Docket 99902106 and demonstration testing at Idaho National Laboratory is targeted ahead of 2028 commercial deliveries, critical diligence blockers remain around first-criticality validation, NRC Part 50/52 licensing, factory manufacturing replication, and high-assay low-enriched uranium (HALEU) supply durability."
sections:
  - id: "product-definition-and-operating-mechanism"
    title: "Product Definition, Operating Mechanism, and Core Architecture"
    body: "Radiant Nuclear's primary product is Kaleidos, a transportable, factory-built advanced nuclear microreactor designed to generate 3 MW of thermal power (3 MWth) and approximately 1 MW of net electricity (1 MWe). Designed as a compact, self-contained energy system that fits inside a single standard commercial shipping container, Kaleidos is engineered for rapid intermodal transport via semi-truck trailer, rail, cargo aircraft, or cargo vessel directly to end-user installation pads. The primary operational objective of Kaleidos is displacing conventional 1 MW diesel generator sets at remote defense installations, hospital campuses, isolated industrial facilities, and data centers. Operating without refueling for up to five full years, the reactor eliminates the severe logistical and security vulnerabilities associated with continuous fossil fuel convoys. Technically, Kaleidos is classified by the US Nuclear Regulatory Commission as a high-temperature gas-cooled reactor (HTGR) utilizing prismatic graphite moderator blocks and cooled by pressurized helium gas. The core is fueled by high-assay low-enriched uranium (HALEU) formed into tristructural-isotropic (TRISO) fuel particles—microscopic uranium and graphite kernels coated in multi-layered refractory carbon and silicon carbide ceramic shells engineered to withstand temperatures exceeding 1,600°C without melting or releasing fission products."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "deployment-integration-and-software-stack"
    title: "Deployment Logistics, Facility Integration, and Software Engineering Stack"
    body: "The deployment architecture of Kaleidos is structured around factory pre-fabrication, sealed fueling, and rapid site integration. Unlike conventional light water reactors that require extensive civil construction and on-site reactor pressure vessel assembly, Kaleidos units are designed to be completely assembled, fueled, and tested within a centralized manufacturing plant prior to shipment. Upon arrival at a prepared customer site, the microreactor unit connects directly into local electrical distribution microgrids, providing resilient baseload electricity or dedicated co-located compute power. Commercial off-take terms are structured either as direct unit capital asset purchases or long-term power-purchase agreement (PPA) subscriptions. At the conclusion of the reactor's projected 20-year operational design life, Radiant is contractually structured to haul the decommissioned unit away, avoiding stranded on-site radioactive decommissioning liabilities for host site operators. To orchestrate reactor modeling, real-time telemetry, and manufacturing automation, Radiant utilizes modern software engineering practices, deploying an engineering technology stack that incorporates AWS cloud infrastructure, C#, C++, Docker containers, Kubernetes orchestration, PostgreSQL databases, Python analytical pipelines, and engineering toolsets including Ansys, SolidWorks, and Altium."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
  - id: "regulatory-licensing-testing-roadmap-and-risks"
    title: "Regulatory Licensing Pathway, Testing Milestones, and Technical Diligence Gaps"
    body: "Radiant's technical development roadmap is subject to sequential federal regulatory gates and physical testing milestones. Formal pre-application regulatory engagement with the US Nuclear Regulatory Commission commenced in October 2022 under NRC Docket 99902106. Radiant has submitted white papers addressing regulatory gap analyses across 10 CFR Part 50 and 52 for design certification and licensing, 10 CFR Part 70 for Special Nuclear Material possession, 10 CFR Part 100 for reactor siting, and 10 CFR Part 55 for fleet operator training. The NRC issued a formal letter accepting Radiant's R-50 Special Nuclear Material license application with observations under reference ML26112A019. Operationally, Radiant is building a full-scale demonstration test reactor slated for hot testing at the Idaho National Laboratory (INL) under federal advanced reactor initiatives, targeting initial customer commercial deliveries beginning in 2028. However, technical and financial diligence highlights acute systemic risks: independent financial and energy analysts have cautioned that the broader nuclear startup sector exhibits valuation froth and bubble dynamics. While first-of-a-kind microreactors can be hand-assembled in specialized facilities, commercial viability hinges entirely on whether Radiant can achieve true mass-manufacturing replication and cost-competitiveness without experiencing severe schedule slippage, HALEU fuel enrichment bottlenecks, or safety qualification delays."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE003"
