callouts:
  - calloutType: "strength"
    title: "Passive Safety Physics and Intermodal Transportability"
    body: "Kaleidos combines meltdown-resistant TRISO fuel with helium cooling to achieve passive safety, ensuring the core cannot melt down even during complete loss-of-coolant accidents. Packaging the entire 1 MWe power station into a standard shipping container provides unparalleled mobility compared to traditional civil nuclear construction."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE005"
  - calloutType: "risk"
    title: "First-of-a-Kind Manufacturing and Fuel Supply Bottlenecks"
    body: "Moving from laboratory development to commercial delivery requires overcoming two massive hurdles: establishing high-throughput factory manufacturing lines without cost escalation, and securing a reliable commercial supply of HALEU fuel, which remains severely constrained in Western markets."
    claimRefs:
      - "CE014"
      - "CE015"
      - "CE016"
