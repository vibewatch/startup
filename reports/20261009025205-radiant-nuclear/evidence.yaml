evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-revenue
    missingEvidence: >-
      Audited financial statements or management disclosure detailing commercial revenue, ARR, power-purchase agreement
      cash flows, and monthly burn rate.
    whyItMatters: >-
      Without verified commercial revenue metrics or cash generation, the $1.8B+ valuation relies entirely on projected
      forward unit economics and defense procurement milestone timing.
    diligencePath: >-
      Request confidential disclosure schedules, customer deposit agreements, and management revenue recognition models
      during formal diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - id: gap-board-governance
    type: private-evidence-only
    severity: minor
    topic: board-governance
    missingEvidence: >-
      Complete listing of Radiant Nuclear's board of directors, committee charters, and voting control distribution
      across founder and venture investor shares.
    whyItMatters: >-
      Understanding board composition clarifies governance oversight, protective provisions, and major shareholder
      alignment for future capital raises.
    diligencePath: Examine Delaware corporate filings, investor voting agreements, and capitalization table share registers.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: commercial-haleu-availability
    missingEvidence: >-
      Comprehensive timeline and volume capacity for commercial-scale domestic HALEU enrichment beyond pilot government
      allocations.
    whyItMatters: >-
      Without domestic commercial HALEU availability, serial factory deployment of Kaleidos reactors beyond early
      military demonstrators cannot proceed at scale.
    diligencePath: >-
      Track Department of Energy commercial enrichment awards and monitor Urenco contract execution milestones for
      2027-2028 deliveries.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: commercial-packaging
    missingEvidence: >-
      Comparable delivered prices, contract terms, discounts, availability guarantees, and realized customer economics
      for Radiant and named peers.
    whyItMatters: >-
      Without matched commercial terms, the analysis cannot establish price leadership, switching economics, or
      procurement value.
    diligencePath: >-
      Request executed customer contracts, bid sheets, pricing schedules, service agreements, and matched site-level
      total-cost models.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-capabilities
    missingEvidence: >-
      Primary specifications, licensing status, deployment schedule, customer segment, and commercial packaging for each
      named direct and adjacent competitor.
    whyItMatters: The current pool supports category and funding comparisons but not a full technical or commercial ranking.
    diligencePath: >-
      Collect current official technical documents, regulator records, procurement filings, and customer contracts for
      each shortlisted competitor.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: fuel-supply-access
    missingEvidence: >-
      Supplier volumes, prices, delivery priority, exclusivity, remedies, and contingency supply for TRISO and HALEU
      agreements.
    whyItMatters: Public agreement descriptions do not prove that supply is sufficient, economic, or protected against delay.
    diligencePath: >-
      Review executed Centrus and Standard Nuclear agreements, allocation schedules, qualification evidence, and
      alternate-supplier plans.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: blocking
    topic: monthly-burn-and-cash-runway
    missingEvidence: >-
      Audited financial statements detailing monthly operational cash burn, net liquid cash reserves, and runway
      duration.
    whyItMatters: >-
      Without cash burn and liquid balance visibility, capital adequacy across the 2026 INL testing and 2028 factory
      scale-up cannot be quantitatively underwritten.
    diligencePath: Obtain quarterly unaudited financial packages, cash-flow statements, and board-level budget forecasts under NDA.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: contract-payment-milestones
    missingEvidence: >-
      Contract documentation detailing payment milestones and task order commitments for the $750 million U.S. Army
      Janus award.
    whyItMatters: >-
      Procurement ceilings do not guarantee cash intake; timing depends on delivery tranches, co-funding requirements,
      and federal appropriations.
    diligencePath: >-
      Request copy of the Army Janus prime contract award documentation, CLIN schedule, and expected disbursement
      timeline.
    relatedQuestionRefs:
      - QI002
  - type: missing-source
    severity: material
    topic: unit-manufacturing-cost-model
    missingEvidence: Bill of materials and target levelized cost of energy (LCOE) models per manufactured 1 MW Kaleidos microreactor.
    whyItMatters: >-
      Gross margin trajectory depends on achieving factory series production economies of scale to overcome high
      prototype capital costs.
    diligencePath: >-
      Review internal engineering unit economics models, TRISO procurement contracts, and balance-of-plant vendor
      pricing quotes.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: criticality-validation
    missingEvidence: >-
      Empirical physical criticality test data, transient thermal-hydraulic telemetry, and verified helium loop pressure
      decay test results from Idaho National Laboratory testing.
    whyItMatters: >-
      Until the full-scale demonstration unit operates at INL, core physics simulations and passive shutdown models
      remain uncorroborated by physical hardware operating under active nuclear fission conditions.
    diligencePath: >-
      Review future INL joint test reports, NRC inspection findings on the development unit, and public technical papers
      presented at American Nuclear Society conferences.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
  - type: access-blocked
    severity: material
    topic: haleu-supply-chain
    missingEvidence: >-
      Confirmed binding commercial supply contracts for high-assay low-enriched uranium (HALEU) fuel and qualified TRISO
      particle fabrication capacity.
    whyItMatters: >-
      Domestic US HALEU enrichment capacity is highly constrained, creating an industry-wide supply bottleneck that
      could delay multi-unit commercial fleet production regardless of NRC reactor design approvals.
    diligencePath: >-
      Request DOE HALEU consortium allocation records, Centrus Energy commercial off-take agreements, and TRISO fuel
      supplier qualification audits during formal technical diligence.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE003
