companyProfile:
  summary: >-
    Radiant Nuclear is an El Segundo-based private nuclear hardware company founded in 2020 to commercialize the
    Kaleidos transportable microreactor platform. The company is positioning a factory-built 1 MW unit for defense, data
    center, and remote resilient-power sites, with commercialization framed around direct sales, power-purchase
    agreements, and lifecycle service. Public evidence shows a large defense-backed backlog, but the business remains
    pre-revenue and still depends on successful DOME testing, licensing, and factory-scale execution.
