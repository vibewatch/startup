company:
  name: "Radiant Nuclear"
chapter:
  number: 6
  title: "Customers"
  summary: "Radiant Nuclear targets mission-critical power replacements across military installations, commercial data centers, and remote industrial communities. While Radiant has captured substantial strategic commercial commitments—highlighted by an announced deal with Equinix for 20 Kaleidos reactors and a $750M contract from the US Army for transportable military base power—commercial deployments remain pre-operational pending 2026 DOME test reactor criticality and commercial delivery schedules slated for 2028."
sections:
  - id: "customer-base-segmentation"
    title: "Target Customer Segmentation & Value Proposition"
    body: "Radiant Nuclear segments its prospective buyer base across three primary operational sectors: defense and military installations, hyperscale and colocation commercial data centers, and remote resilient-power operators [CU001, CU002]. Across these operational domains, the primary economic and operational driver is the displacement of expensive, logistics-intensive, and emissions-heavy diesel generator capacity with clean, continuous baseload power [CU003, CU011]. In defense applications, tactical power reliability and independence from vulnerable fuel resupply convoys represent the core procurement criteria, prompting federal research initiatives and defense procurement awards [CU002, CU010]. In commercial data center environments, escalating artificial intelligence computational workloads have created acute interconnection queues and localized power generation deficits, making factory-manufactured 1 MW portable units an attractive alternative or supplement to utility grid expansion [CU008, CU009]. However, commercial delivery timelines are fundamentally constrained by reactor qualification milestones, with factory deliveries projected for 2028 following regulatory and prototype testing [CU001, CU011]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-pipeline"
    title: "Deployment Pipeline, Pre-Commercial Bookings & Milestones"
    body: "Because Radiant Nuclear's Kaleidos reactor is an advanced nuclear technology in active prototype fabrication and regulatory testing, customer adoption is measured through contractual reservations, defense program selections, and site preparation agreements rather than deployed operational units [CU001, CU004]. Radiant's adoption trajectory is anchored to its scheduled testing of its first full-scale reactor at the Idaho National Laboratory (INL) DOME testing facility in 2026, marking a critical prerequisite for commercial customer deliveries planned to commence in 2028 [CU001, CU006, CU011]. Commercialization progress is demonstrated through key account engagements, including an agreement with digital infrastructure provider Equinix for up to 20 Kaleidos units, as well as a $750M contract award from the US Army to support energy independence across military installations [CU004, CU010]. To transition these reservations into physical deployments, Radiant is constructing its R-50 manufacturing factory in Oak Ridge, Tennessee, designed to achieve an annual production throughput of up to 50 reactors by 2028 [CU001, CU006]."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU006"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "customer-proof-and-commitments"
    title: "Customer Proof, Contract Structures & Concentration Profile"
    body: "Publicly verifiable customer commitments for Radiant Nuclear center on major institutional and enterprise counterparties seeking alternatives to diesel-fueled backup and off-grid power [CU002, CU004]. Digital infrastructure provider Equinix signed a multi-unit agreement covering 20 Kaleidos microreactors to evaluate dedicated baseload power for critical computing infrastructure [CU004]. Concurrently, the US Army selected Radiant for a $750M contract to deliver transportable, resilient microreactors for military installations [CU010]. In the public sector, Radiant was selected for the Department of Energy Nuclear Reactor Pilot Program and secured a contract for high-assay low-enriched uranium (HALEU) fuel allocation [CU005, CU007]. Despite these landmark customer-proof signals, customer concentration is elevated: early production capacity from the planned Oak Ridge R-50 facility will be predominantly dedicated to early defense orders and initial enterprise off-takers [CU001, CU004, CU010]. Furthermore, public disclosures do not provide visibility into contract cancellation clauses, deposit structures, or power-purchase pricing terms, leaving long-term cash conversion and commercial retention mechanisms unverified [CU012, CU013]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU007"
      - "CU010"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
callouts:
  - calloutType: "insight"
    title: "Commercialization Linked Directly to Defense & Colocation Milestones"
    body: "Radiant's customer adoption pipeline reflects an dual-track commercial strategy: anchoring initial multi-hundred-million-dollar demand through federal defense procurement (US Army $750M contract) while establishing strategic reservations with power-constrained commercial colocation providers (Equinix 20-unit deal). However, physical customer deployment remains contingent upon achieving self-sustained criticality at INL DOME in 2026 and scaling factory manufacturing in Oak Ridge by 2028."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU006"
      - "CU010"
  - calloutType: "risk"
    title: "Capital Bubble Dynamics & Unverified Contractual Conversion Terms"
    body: "While investor sentiment and customer announcements have surged alongside broader artificial intelligence power demand, independent financial analysis cautions that the sector faces potential froth and bubble risks if first-of-a-kind reactor developers experience deployment slippage or stumble when replicating factory assembly. Moreover, with binding commercial deposit terms and power-purchase pricing undisclosed, customer commitments cannot yet be audited for firm revenue durability."
    claimRefs:
      - "CU008"
      - "CU012"
      - "CU013"
