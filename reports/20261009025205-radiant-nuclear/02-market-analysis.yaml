callouts:
  - calloutType: "insight"
    title: "Defense Offtake as Commercial Derisking Anchor"
    body: "The U.S. Department of Defense's procurement strategy acts as a critical non-dilutive catalyst for private microreactor developers. By assuming first-of-a-kind technology deployment risks through long-term Power Purchase Agreements across domestic military bases, defense agencies establish bankable offtake that private financial markets require to underwrite serial factory production."
    claimRefs:
      - "CM005"
      - "CM008"
      - "CM011"
  - calloutType: "risk"
    title: "HALEU Supply Chain Vulnerability and Regulatory Hurdles"
    body: "Commercialization timelines remain vulnerable to upstream nuclear fuel shortages. Microreactors like Kaleidos require High-Assay Low-Enriched Uranium (HALEU), which currently suffers from constrained domestic enrichment capacity. While initial government allocations support early testing, commercial fleet operations in the late 2020s require rapid expansion of domestic commercial enrichment infrastructure."
    claimRefs:
      - "CM001"
      - "CM011"
      - "CM013"
