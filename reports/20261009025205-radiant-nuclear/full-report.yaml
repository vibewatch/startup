    columns:
      - Scenario
      - Assumptions
      - Valuation / Return Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Successful 2026 DOME criticality at INL; R-50 factory operational by 2028 reaching 50 units/yr; 20 Equinix
          reactors deployed under lucrative PPAs; Army contract executes smoothly.
        - >-
          Implied enterprise value expands to $4.0B–$6.0B via public listing or strategic energy acquisition; >2.5x
          return on Series D entry.
        - Supply chain bottlenecks for TRISO fuel and regulatory inspection delays.
        - Medium (30%)
      - - Base Case
        - >-
          Criticality achieved with minor delays; initial commercial deployments slip to 2029–2030; partial fulfillment
          of Army and commercial data center demand; factory capex higher than expected.
        - >-
          Valuation flatlines at $1.5B–$2.0B; growth requires dilutive follow-on equity rounds; modest 1.0x–1.3x capital
          recovery.
        - Moderate dilution overhang; customer timeline pushouts due to utility interconnect and site licensing.
