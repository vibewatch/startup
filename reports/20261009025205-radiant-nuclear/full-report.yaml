      - number: '7.2'
        title: Criticality Demonstration, Manufacturing Scaling, and Operational Execution
        blocks:
          - type: paragraph
            body: >-
              Radiant's core engineering thesis requires proving that a compact 1 MWe high-temperature gas-cooled
              reactor using TRISO fuel and helium coolant can operate reliably and be manufactured repeatedly at
              automotive-style volumes. While the full-scale Kaleidos Development Unit article was shipped from
              Radiant's El Segundo headquarters to Idaho National Laboratory's DOME test bed in mid-August 2026, the
              targeted third-quarter 2026 window for fueled criticality closed without a public confirmation of
              zero-power criticality, 1 MW thermal operation, or the planned 150-hour unattended full-power run.
              Achieving full-power operation and validating air cooling without on-site water are critical technical
              gates; any core physics discrepancy, coolant flow anomaly, or fuel qualification failure at DOME would
              disrupt subsequent commercial timelines. Furthermore, industry observers note that while first-of-a-kind
              advanced reactors can be assembled by hand, nuclear startups frequently encounter severe replication
              hurdles when attempting to scale factory mass production. Radiant has begun construction on a
              300,000-square-foot production campus in Oak Ridge aiming for up to 50 reactors per year after 2028, but
              commissioning remains contingent on licensing and extensive manufacturing engineering recruitment to
              transition precision mechanical assembly into a standardized production line.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Fuel Supply Chains, Defense Contract Contingencies, and Capital Market Exposure
        blocks:
          - type: paragraph
            body: >-
              Radiant's operational model incorporates severe counterparty, supply chain, and financial dependencies
              that elevate downside risk. The Kaleidos core requires High-Assay Low-Enriched Uranium (HALEU) enriched
              between 5% and 20% U-235, a fuel category with minimal domestic commercial enrichment infrastructure.
              Although Radiant secured a second conditional allocation of HALEU from the U.S. Department of Energy in
              July 2026, long-term commercial fleet deployment remains heavily dependent on federal enrichment
              allocations, Centrus Energy commercialization, and standard nuclear fuel supply chains. On the customer
              side, Radiant's signature commercial achievement is a $750 million Janus agreement with the U.S. Army and
              Defense Innovation Unit for up to 15 transportable units through 2030, including a 3-unit site pairing at
              Fort Benning. However, these defense contracts are structured with performance-contingent development and
              deployment milestones rather than guaranteed upfront revenue, and individual installation pads remain
              under evaluation. Financially, Radiant has raised more than $500 million, including a Series D valuation
              exceeding $1.8 billion in December 2025. With zero recognized commercial reactor sales revenue and heavy
              capital burn dedicated to facility construction and test campaigns, Radiant remains vulnerable to broader
              capital market contractions or valuation multiple compression if deployment milestones slip past 2028.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Siting and Waste Storage Vulnerability: Wyoming as a Cautionary Precedent'
            body: >-
              Radiant's experience in Bar Nunn, Wyoming, where municipal outrage over nuclear waste storage 2,100 feet
              from residential homes halted planned factory development, proves that public perception and state
              spent-fuel laws are existential risks. Even if Kaleidos is technically failsafe, customer host communities
              may reject on-site reactor placement without airtight federal waste disposal guarantees.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: 'The Unclosed Criticality Gate: DOME Testing Remains the Decisive Milestone'
            body: >-
              Although Radiant successfully delivered the Kaleidos Development Unit to Idaho National Laboratory in
              August 2026, the targeted third-quarter testing window closed without public criticality confirmation.
              Until zero-power criticality and the full 150-hour power run are demonstrated, Radiant's commercial
              delivery commitments and factory expansion plans remain exposed to developmental revision.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Radiant Nuclear is developing the Kaleidos microreactor, a factory-built, 1 MW electric (1.9 MW thermal)
              high-temperature gas-cooled portable reactor designed to fit inside a standard shipping container and
              operate for up to five years without refueling. The company has captured substantial market attention
              against a backdrop of escalating power requirements for artificial intelligence compute and remote defense
              infrastructure. In December 2025, Radiant announced a $300 million Series D financing round valuing the
              business at more than $1.8 billion, coming less than six months after its $165 million Series C. The
              financing syndicate was led by Draper Associates and Boost VC, with participation from Founders Fund,
              Chevron Technology Ventures, ARK Venture Fund, and Friends & Family Capital. The investment surge reflects
              an aggressive transition from laboratory research to industrial factory deployment, primarily targeting
              the groundbreaking of Radiant's planned R-50 manufacturing facility in Oak Ridge, Tennessee, intended to
              reach a run-rate capacity of 50 reactors annually. However, because Radiant remains a pre-commercial
              entity without audited recurring operating revenue or public unit gross margins, this $1.8 billion mark
              prices in rapid multi-year execution across reactor construction, regulatory clearance, and mass
              manufacturing without near-term cash flow support.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.2'
        title: Market Comparables and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              The broader advanced nuclear and small modular reactor market experienced massive capital inflows
              throughout late 2025 and 2026, highlighted by X-energy's $700 million round, Aalo Atomics raising $100
              million, and Last Energy raising $100 million. Market commentators and sector analysts have raised
              concerns regarding frothy valuations and speculative bubble dynamics across advanced fission developers,
              where valuations have scaled ahead of physical testing and revenue generation. Radiant's commercial
              prospects are anchored by customer commitments including an agreement with global data center operator
              Equinix to supply 20 microreactors and a $750 million contract from the U.S. Army to supply transportable
              reactors for military installations. The crucial milestone governing Radiant's medium-term commercial
              viability is its scheduled demonstration unit test at Idaho National Laboratory's Demonstration of
              Microreactor Experiments (DOME) facility, part of the U.S. Department of Energy Reactor Pilot Program
              aiming for criticality. In a bull case, successful criticality and rapid regulatory validation allow
              Radiant to scale its R-50 manufacturing plant toward 50 units per year, justifying entry valuations
              through power purchase agreements and government fleet procurements. In contrast, bear and adverse
              scenarios demonstrate severe multiple compression if demonstration testing slips, factory construction
              costs escalate, or hand-built prototypes encounter replication friction during mass production.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Exit Readiness and Diligence Recommendations
        blocks:
          - type: paragraph
            body: >-
              Radiant's dual business model offers flexible monetization through outright unit sales or long-term Power
              Purchase Agreements (PPAs), bundled with a complete 20-year end-of-life haul-away service that eliminates
              customer waste management obligations. While this model lowers adoption friction for commercial data
              centers and military bases, significant diligence gaps persist. Current recognized revenue, ARR, gross
              margin, monthly cash burn, and runway remain entirely undisclosed in public materials. Furthermore, the
              commercial contracts with Equinix and the U.S. Army involve multi-year phased milestones whose exact
              progress payments, cancellation penalties, and unit delivery pricing terms have not been publicly audited.
              Given these evidentiary constraints and the speculative premium implied by the $1.8 billion valuation, an
              investment recommendation of research-more is warranted. Full capital commitment should remain contingent
              on verified DOME criticality at Idaho National Laboratory, audited unit economics from initial commercial
              builds, and visibility into board governance and liquidation preferences.
            claimRefs:
              - CV003
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Stance: Maintain Research-More Prior to Criticality'
            body: >-
              Radiant's technological design and federal momentum make it a premier private microreactor contender.
              However, paying an enterprise valuation above $1.8B ahead of a first-of-a-kind criticality demonstration
              and factory groundbreaking exposes investors to severe uncompensated execution risk. Maintain a
              research-more stance until physical testing at INL DOME proves reactor operability.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV013
          - type: callout
            title: The Industrial Replication Chasm
            body: >-
              As noted in independent market commentary, nuclear startups frequently succeed at constructing bespoke
              hand-built prototypes but encounter fatal capital constraints when transitioning to factory mass
              production. Radiant's ambitious R-50 Oak Ridge facility requires multi-hundred-million-dollar capital
              investments that could face sharp multiple contraction if macro market enthusiasm cools.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV012
