  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Operating Mechanism, and Core Architecture
        blocks:
          - type: paragraph
            body: >-
              Radiant Nuclear's primary product is Kaleidos, a transportable, factory-built advanced nuclear
              microreactor designed to generate 3 MW of thermal power (3 MWth) and approximately 1 MW of net electricity
              (1 MWe). Designed as a compact, self-contained energy system that fits inside a single standard commercial
              shipping container, Kaleidos is engineered for rapid intermodal transport via semi-truck trailer, rail,
              cargo aircraft, or cargo vessel directly to end-user installation pads. The primary operational objective
              of Kaleidos is displacing conventional 1 MW diesel generator sets at remote defense installations,
              hospital campuses, isolated industrial facilities, and data centers. Operating without refueling for up to
              five full years, the reactor eliminates the severe logistical and security vulnerabilities associated with
              continuous fossil fuel convoys. Technically, Kaleidos is classified by the US Nuclear Regulatory
              Commission as a high-temperature gas-cooled reactor (HTGR) utilizing prismatic graphite moderator blocks
              and cooled by pressurized helium gas. The core is fueled by high-assay low-enriched uranium (HALEU) formed
              into tristructural-isotropic (TRISO) fuel particles—microscopic uranium and graphite kernels coated in
              multi-layered refractory carbon and silicon carbide ceramic shells engineered to withstand temperatures
              exceeding 1,600°C without melting or releasing fission products.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
