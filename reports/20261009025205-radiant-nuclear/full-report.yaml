  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Integrated technological and operational architecture of the Kaleidos 1 MWe transportable microreactor system
      across six specialized functional layers.
    data:
      layers:
        - label: 'Layer 1: Nuclear Core & Fuel Physics'
          detail: >-
            3 MWth high-temperature gas-cooled reactor core utilizing TRISO fuel particles embedded in prismatic
            graphite moderator blocks
          items:
            - label: TRISO Fuel Particles
              detail: Ceramic-coated uranium/carbon kernels designed to resist meltdowns up to 1,600°C
            - label: Prismatic Graphite Core
              detail: Neutron moderator providing passive thermal stability and negative temperature coefficient
            - label: 5-Year Core Life
              detail: Full operational life between factory refueling cycles
        - label: 'Layer 2: Primary Thermal Hydraulics & Cooling'
          detail: Single-phase inert helium gas coolant loop driving closed-loop power conversion
          items:
            - label: Pressurized Helium Coolant
              detail: Chemically inert single-phase gas circulating through core channels
            - label: Closed-Loop Heat Exchangers
              detail: Extracts thermal energy for electrical generation
            - label: Passive Decay Heat Removal
              detail: Natural circulation and conduction cooling under total power loss
        - label: 'Layer 3: Power Conversion & Electrical Generation'
          detail: Closed-loop micro-turbine generating 1 MWe clean electrical output
          items:
            - label: 1 MWe Electrical Turbomachinery
              detail: Brayton-cycle or specialized closed-loop micro-turbine power conversion
            - label: Microgrid Electrical Switchgear
              detail: Direct electrical coupling to customer distribution buses
        - label: 'Layer 4: Intermodal Transport & Physical Containment'
          detail: Standard ISO shipping container serving as structural protective boundary
          items:
            - label: Single Shipping Container Enclosure
              detail: Complete microreactor system housed within a single commercial container
            - label: Multi-modal Transportability
              detail: Deployable via semi-truck trailer, rail, cargo aircraft, or ship
            - label: 20-Year Lifetime & Haul-Away
              detail: Full asset removal at end of 20-year design life
        - label: 'Layer 5: Digital Control & Autonomous Safety Instrumentation'
          detail: Fail-safe shutdown automation requiring zero external power
          items:
            - label: Autonomous Safety Logic
              detail: Gravity-driven and passive reactivity control mechanisms
            - label: Digital Twin & Sensor Telemetry
              detail: Real-time core diagnostics and thermal gradient monitoring
        - label: 'Layer 6: Software Engineering & Modeling Infrastructure'
          detail: Modern software stack for reactor simulation and fleet telemetry
          items:
            - label: Cloud & Container Orchestration
              detail: AWS, Docker containerization, Kubernetes cluster orchestration
            - label: Core Engineering Languages & CAD
              detail: C++, Python, PostgreSQL, Ansys, Altium, SolidWorks
    approximationNotes: >-
      Architecture layers synthesized from NRC pre-application filings and published technical disclosures. Power
      conversion details are high-level.
