      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercialization Linked Directly to Defense & Colocation Milestones
            body: >-
              Radiant's customer adoption pipeline reflects an dual-track commercial strategy: anchoring initial
              multi-hundred-million-dollar demand through federal defense procurement (US Army $750M contract) while
              establishing strategic reservations with power-constrained commercial colocation providers (Equinix
              20-unit deal). However, physical customer deployment remains contingent upon achieving self-sustained
              criticality at INL DOME in 2026 and scaling factory manufacturing in Oak Ridge by 2028.
            calloutType: insight
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU010
          - type: callout
            title: Capital Bubble Dynamics & Unverified Contractual Conversion Terms
            body: >-
              While investor sentiment and customer announcements have surged alongside broader artificial intelligence
              power demand, independent financial analysis cautions that the sector faces potential froth and bubble
              risks if first-of-a-kind reactor developers experience deployment slippage or stumble when replicating
              factory assembly. Moreover, with binding commercial deposit terms and power-purchase pricing undisclosed,
              customer commitments cannot yet be audited for firm revenue durability.
            calloutType: risk
            claimRefs:
              - CU008
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Nuclear Licensing, Siting Precedents, and Public Opposition
        blocks:
          - type: paragraph
            body: >-
              Radiant operates in an intensely regulated nuclear operating environment where commercial deployment
              hinges on unprecedented licensing pathways and local community acceptance. For commercial and non-defense
              civilian applications, the Kaleidos microreactor design remains in pre-application engagement with the
              U.S. Nuclear Regulatory Commission under docket 99902106 since October 2022. As of autumn 2026, the NRC
              pre-application docket shows that the Kaleidos Development Unit commissioning plan remains under active
              regulatory review, and no formal 10 CFR Part 50 or Part 52 commercial operating-license application has
              been docketed. Concurrently, Radiant's commercial manufacturing campus in Oak Ridge, Tennessee, requires a
              10 CFR Part 70 license for special nuclear material possession and fueling operations, which also remains
              under review. Beyond federal regulatory approvals, Radiant faces substantial local siting and spent-fuel
              political resistance. In Wyoming, intense municipal opposition and state legal restrictions on spent
              nuclear fuel storage forced Radiant to abandon its proposed Bar Nunn microreactor manufacturing and fuel
              storage facility after public outrage over waste storage 2,100 feet from residential neighborhoods.
              Although Radiant subsequently pivoted its factory to Oak Ridge, Tennessee, the Wyoming precedent
              demonstrates that local community opposition, waste handling perceptions, and municipal zoning friction
              represent immediate operational barriers for factory siting and future customer deployment pads.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
