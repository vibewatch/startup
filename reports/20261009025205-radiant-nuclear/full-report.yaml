      - number: '6.3'
        title: Customer Proof, Contract Structures & Concentration Profile
        blocks:
          - type: paragraph
            body: >-
              Publicly verifiable customer commitments for Radiant Nuclear center on major institutional and enterprise
              counterparties seeking alternatives to diesel-fueled backup and off-grid power [CU002, CU004]. Digital
              infrastructure provider Equinix signed a multi-unit agreement covering 20 Kaleidos microreactors to
              evaluate dedicated baseload power for critical computing infrastructure [CU004]. Concurrently, the US Army
              selected Radiant for a $750M contract to deliver transportable, resilient microreactors for military
              installations [CU010]. In the public sector, Radiant was selected for the Department of Energy Nuclear
              Reactor Pilot Program and secured a contract for high-assay low-enriched uranium (HALEU) fuel allocation
              [CU005, CU007]. Despite these landmark customer-proof signals, customer concentration is elevated: early
              production capacity from the planned Oak Ridge R-50 facility will be predominantly dedicated to early
              defense orders and initial enterprise off-takers [CU001, CU004, CU010]. Furthermore, public disclosures do
              not provide visibility into contract cancellation clauses, deposit structures, or power-purchase pricing
              terms, leaving long-term cash conversion and commercial retention mechanisms unverified [CU012, CU013].
            claimRefs:
              - CU001
