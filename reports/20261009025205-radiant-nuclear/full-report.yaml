        title: Executive Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Radiant's operational and technical leadership structure reflects an engineering culture derived from
              aerospace and rapid hardware development. The executive bench is led by President and Chief Operating
              Officer Tori Shivanandan alongside Chief Commercial Officer Mike Starrett, Ph.D., who oversee
              manufacturing systems scaling, facility buildout, and commercial deployment pathways. The company operates
              from its main headquarters and manufacturing facility in El Segundo, California, while establishing
              burgeoning satellite offices in Oak Ridge, Tennessee, and Washington, D.C., to maintain active proximity
              to national laboratories and federal regulators. Because Radiant relies heavily on high-velocity hardware
              iteration and proprietary manufacturing tooling, key-person dependencies remain concentrated in core
              mechanical, nuclear systems, and manufacturing engineering leadership. The governance architecture
              balances private venture capital board representation with strategic aerospace and defense stakeholders.
