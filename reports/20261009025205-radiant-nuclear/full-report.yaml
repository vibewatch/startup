  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Type
      - Core Premise
      - What Would Change The View
    rows:
      - - Baseload Clean Power Demand
        - Thesis
        - >-
          AI data center electricity constraints and military resilience requirements create urgent demand for portable,
          waterless 1 MW microreactors.
        - >-
          Persistent regulatory gridlock, unexpected battery storage breakthroughs, or cancellation of commercial data
          center pilot agreements.
      - - Defense Validation
        - Thesis
        - >-
          The $750M U.S. Army contract provides substantial non-dilutive backlog and operational validation for tactical
          energy independence.
        - >-
          Government budget reallocations, failure to pass defense qualification gates, or prototype field testing
          cancellations.
      - - Mass Manufacturing Scale
        - Thesis
        - >-
          The R-50 facility in Oak Ridge targets 50 reactors per year to drive microreactor unit costs down to
          diesel-parity via assembly line methods.
        - >-
          Execution failure transitioning from hand-built demonstration units to factory mass production, or excessive
          site licensing delays.
      - - Valuation Prematurity
        - Anti-Thesis
        - >-
          A >$1.8B valuation in Series D with zero disclosed revenue, ARR, or cash burn metrics exposes late-stage
          investors to steep down-round risk.
        - >-
          Disclosure of verified high-margin commercial recurring revenue, profitable PPA cash flows, or firm
          non-refundable customer deposits.
      - - Technology and Criticality Risk
        - Anti-Thesis
        - >-
          Achieving self-sustaining nuclear fission at INL DOME requires stringent safety approvals and flawless
          high-temperature helium cooling execution.
        - >-
          Successful, publicly verified criticality demonstration at INL DOME in compliance with Department of Energy
          reactor pilot schedules.
