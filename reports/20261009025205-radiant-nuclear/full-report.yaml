      - number: '5.2'
        title: Deployment Logistics, Facility Integration, and Software Engineering Stack
        blocks:
          - type: paragraph
            body: >-
              The deployment architecture of Kaleidos is structured around factory pre-fabrication, sealed fueling, and
              rapid site integration. Unlike conventional light water reactors that require extensive civil construction
              and on-site reactor pressure vessel assembly, Kaleidos units are designed to be completely assembled,
              fueled, and tested within a centralized manufacturing plant prior to shipment. Upon arrival at a prepared
              customer site, the microreactor unit connects directly into local electrical distribution microgrids,
              providing resilient baseload electricity or dedicated co-located compute power. Commercial off-take terms
              are structured either as direct unit capital asset purchases or long-term power-purchase agreement (PPA)
              subscriptions. At the conclusion of the reactor's projected 20-year operational design life, Radiant is
              contractually structured to haul the decommissioned unit away, avoiding stranded on-site radioactive
              decommissioning liabilities for host site operators. To orchestrate reactor modeling, real-time telemetry,
              and manufacturing automation, Radiant utilizes modern software engineering practices, deploying an
              engineering technology stack that incorporates AWS cloud infrastructure, C#, C++, Docker containers,
              Kubernetes orchestration, PostgreSQL databases, Python analytical pipelines, and engineering toolsets
              including Ansys, SolidWorks, and Altium.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE007
              - CE008
      - number: '5.3'
        title: Regulatory Licensing Pathway, Testing Milestones, and Technical Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Radiant's technical development roadmap is subject to sequential federal regulatory gates and physical
              testing milestones. Formal pre-application regulatory engagement with the US Nuclear Regulatory Commission
              commenced in October 2022 under NRC Docket 99902106. Radiant has submitted white papers addressing
              regulatory gap analyses across 10 CFR Part 50 and 52 for design certification and licensing, 10 CFR Part
              70 for Special Nuclear Material possession, 10 CFR Part 100 for reactor siting, and 10 CFR Part 55 for
              fleet operator training. The NRC issued a formal letter accepting Radiant's R-50 Special Nuclear Material
              license application with observations under reference ML26112A019. Operationally, Radiant is building a
              full-scale demonstration test reactor slated for hot testing at the Idaho National Laboratory (INL) under
              federal advanced reactor initiatives, targeting initial customer commercial deliveries beginning in 2028.
              However, technical and financial diligence highlights acute systemic risks: independent financial and
              energy analysts have cautioned that the broader nuclear startup sector exhibits valuation froth and bubble
              dynamics. While first-of-a-kind microreactors can be hand-assembled in specialized facilities, commercial
              viability hinges entirely on whether Radiant can achieve true mass-manufacturing replication and
              cost-competitiveness without experiencing severe schedule slippage, HALEU fuel enrichment bottlenecks, or
              safety qualification delays.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Passive Safety Physics and Intermodal Transportability
            body: >-
              Kaleidos combines meltdown-resistant TRISO fuel with helium cooling to achieve passive safety, ensuring
              the core cannot melt down even during complete loss-of-coolant accidents. Packaging the entire 1 MWe power
              station into a standard shipping container provides unparalleled mobility compared to traditional civil
              nuclear construction.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
          - type: callout
            title: First-of-a-Kind Manufacturing and Fuel Supply Bottlenecks
            body: >-
              Moving from laboratory development to commercial delivery requires overcoming two massive hurdles:
              establishing high-throughput factory manufacturing lines without cost escalation, and securing a reliable
              commercial supply of HALEU fuel, which remains severely constrained in Western markets.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target Customer Segmentation & Value Proposition
        blocks:
          - type: paragraph
            body: >-
              Radiant Nuclear segments its prospective buyer base across three primary operational sectors: defense and
              military installations, hyperscale and colocation commercial data centers, and remote resilient-power
              operators [CU001, CU002]. Across these operational domains, the primary economic and operational driver is
              the displacement of expensive, logistics-intensive, and emissions-heavy diesel generator capacity with
              clean, continuous baseload power [CU003, CU011]. In defense applications, tactical power reliability and
              independence from vulnerable fuel resupply convoys represent the core procurement criteria, prompting
              federal research initiatives and defense procurement awards [CU002, CU010]. In commercial data center
              environments, escalating artificial intelligence computational workloads have created acute
              interconnection queues and localized power generation deficits, making factory-manufactured 1 MW portable
              units an attractive alternative or supplement to utility grid expansion [CU008, CU009]. However,
              commercial delivery timelines are fundamentally constrained by reactor qualification milestones, with
              factory deliveries projected for 2028 following regulatory and prototype testing [CU001, CU011].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU009
              - CU010
              - CU011
