  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Defining the addressable market for portable nuclear microreactors requires isolating distinct operational
              parameters from the broader civil nuclear and multi-hundred-megawatt Small Modular Reactor (SMR) domains.
              Radiant Nuclear's flagship product, Kaleidos, is engineered as a 1 MWe factory-assembled, transportable
              helium-cooled microreactor designed to fit within standard shipping envelopes and operate for up to five
              years without refueling (CM001, CM006). The core addressable market targets localized, high-reliability
              primary and backup power applications currently dependent on diesel generators, remote microgrids,
              expeditionary military installations, and high-density computing infrastructure (CM002, CM007). In
              contrast to utility-scale grid additions or large-footprint light water SMRs designed for centralized
              baseload delivery, microreactor spend is allocated toward resilient, decentralized power generation where
              civil grid interconnection is either technically unfeasible, economically prohibitive, or vulnerable to
              physical and cyber disruption (CM001, CM008). The status-quo substitute across primary target segments
              remains heavy industrial diesel generation, which imposes persistent operational vulnerabilities, high
              fuel supply-chain logistical overhead, and substantial carbon emissions (CM002, CM007). However,
              microreactor adoption does not compete on simple upfront nameplate capital cost; instead, adoption
              economics depend on mitigating long-term logistics burdens and securing predictable levelized electricity
              costs over multi-decade operational horizons (CM005, CM008).
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM010
      - number: '2.2'
        title: Market Sizing Lenses and Segmented Forecast Divergence
        blocks:
          - type: paragraph
            body: >-
              Independent market projections demonstrate significant divergence between general modular nuclear
              expansion and dedicated microreactor deployment. Broad multi-segment forecasts from Grand View Research
              estimated the global Small Modular Reactor market at $6.54B in 2025, expanding to $10.69B by 2033 at a
              compound annual growth rate of 6.8% (CM003). In contrast, specialized microreactor research published via
              PRNewswire/Cision projects a much steeper trajectory for compact microreactors, rising from $0.85B in 2025
              to $6.8B by 2034, reflecting an implied 26.0% CAGR (CM004). This growth acceleration is almost entirely
              underwritten by programmatic defense procurement and escalating commercial power requirements for
              artificial intelligence infrastructure (CM004, CM009). The Department of Defense has established firm
              deployment milestones through Project Janus and the Advanced Nuclear Power for Installations (ANPI)
              program, validating long-term Power Purchase Agreement (PPA) offtake structures (CM008, CM011). Under this
              framework, levelized cost of electricity (LCOE) is projected to decrease from first-of-a-kind (FOAK)
              baselines of approximately $150/MWh toward an nth-of-a-kind (NOAK) target of roughly $60/MWh as serial
              factory manufacturing scales (CM005). Commercial hyperscalers and digital infrastructure operators have
              emerged as parallel demand drivers, evidenced by commercial commitments such as Equinix's reservation of
              20 Kaleidos units with cash deposits (CM010). Nevertheless, total addressable conversion remains
              constrained by the unproven economics of early unit deployments and broad valuation multiples in the
              private nuclear technology landscape (CM009, CM012).
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
