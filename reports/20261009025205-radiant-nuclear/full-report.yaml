      - - Bear / Adverse Case
        - >-
          Criticality demonstration fails or is aborted; technical hiccups replicating hand-built prototypes in mass
          factory setting; bubble burst across advanced nuclear sector.
        - >-
          Severe valuation down-round to <$600M or distressed IP sale; significant capital loss for late-stage
          investors.
        - Complete commercialization stall; inability to raise follow-on capital in a tightening venture environment.
