chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Origins, and Core Mission
        blocks:
          - type: paragraph
            body: >-
              Radiant Nuclear (Radiant Industries, Inc.) is an El Segundo, California-based nuclear technology company
              founded in 2020 to build mass-produced, transportable nuclear microreactors. The startup's flagship
              product is Kaleidos, a factory-manufactured 1 megawatt electric (1 MWe) failsafe microreactor engineered
              to be transported via land, sea, or air inside standard shipping containers and deployed directly to
              operating customer sites. Radiant was established by former SpaceX engineers who sought to apply aerospace
              manufacturing methodologies, modern software integration, and rapid hardware iteration to nuclear power
              generation. The primary commercial and military mission of Kaleidos is displacing diesel generators at
              remote military installations, critical civil infrastructure, hospitals, and high-density computing
              facilities, delivering continuous carbon-free electricity without refueling for up to five years.
