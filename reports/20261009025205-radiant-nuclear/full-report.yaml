      - number: '1.3'
        title: Capitalization History, Valuation, and Defense Backing
        blocks:
          - type: paragraph
            body: >-
              Radiant has raised substantial private equity funding alongside major non-dilutive federal defense awards.
              In December 2025, the company announced an oversubscribed funding round raising more than $300 million led
              by Draper Associates and Boost VC, with participation from Founders Fund, Ark Venture Fund, Chevron
              Technology Ventures, and Friends & Family Capital, which established a post-money valuation exceeding $1.8
              billion. This followed an earlier $165 million capital raise completed six months prior. In February 2026,
              Radiant expanded its strategic coalition by adding defense prime Lockheed Martin as a strategic investor
              to the round. Crucially, in August 2026, Radiant secured a landmark $750 million contract from the US Army
              under the Janus Program to manufacture and deliver a fleet of 15 transportable microreactors. Despite
              these headline funding and contract milestones, Radiant discloses no recurring commercial revenue or
              power-purchase cash generation, and financial analysts have raised concerns regarding a frothy nuclear
              market bubble and manufacturing replication hurdles.
