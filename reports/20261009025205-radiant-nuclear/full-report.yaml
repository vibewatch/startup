              - CM010
      - number: '2.3'
        title: Buyer Segmentation, Procurement Paths, and Structural Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption pathways for transportable microreactors are characterized by institutional bifurcation between
              defense agencies and private digital infrastructure developers. The primary near-term buyer is the U.S.
              Department of Defense, executing acquisitions through contractor-owned, contractor-operated (COCO)
              frameworks that transfer construction and technology risk to commercial vendors (CM008, CM011). In this
              defense segment, the procurement path is anchored in national security energy resilience mandates, with
              operational readiness driving adoption rather than short-term commercial returns (CM008). In the
              commercial sector, data center operators and hyperscalers represent the secondary growth segment, where
              grid interconnection delays exceeding four to seven years create an urgent need for behind-the-meter
              dispatchable generation (CM007, CM010). Commercial buyers evaluate microreactors through dual procurement
              models: outright equipment purchase or long-term power purchase agreements accompanied by decommissioning
              and haul-away provisions (CM002). Despite expanding demand signals, market penetration faces severe
              structural constraints: High-Assay Low-Enriched Uranium (HALEU) enrichment availability remains
              bottlenecked across Western supply chains, specialized high-temperature manufacturing infrastructure
              requires extensive capital outlays, and civilian commercial siting necessitates Nuclear Regulatory
              Commission or Department of Energy safety approvals (CM011, CM013). Factory scaling programs, such as
              Radiant's planned R-50 facility in Oak Ridge, Tennessee, targeting 50 units annually, remain dependent on
              successful demonstration testing at Idaho National Laboratory (CM011, CM014).
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM010
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Defense Offtake as Commercial Derisking Anchor
            body: >-
              The U.S. Department of Defense's procurement strategy acts as a critical non-dilutive catalyst for private
              microreactor developers. By assuming first-of-a-kind technology deployment risks through long-term Power
              Purchase Agreements across domestic military bases, defense agencies establish bankable offtake that
              private financial markets require to underwrite serial factory production.
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
              - CM011
          - type: callout
            title: HALEU Supply Chain Vulnerability and Regulatory Hurdles
            body: >-
              Commercialization timelines remain vulnerable to upstream nuclear fuel shortages. Microreactors like
              Kaleidos require High-Assay Low-Enriched Uranium (HALEU), which currently suffers from constrained
              domestic enrichment capacity. While initial government allocations support early testing, commercial fleet
              operations in the late 2020s require rapid expansion of domestic commercial enrichment infrastructure.
            calloutType: risk
            claimRefs:
              - CM001
              - CM011
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: peers, incumbents, and the status quo'
        blocks:
          - type: paragraph
            body: >
              The assigned evidence supports a broad competitive set, not a clean list of interchangeable products.
              Tracxn places Radiant fourth among 110 active competitors and names Newcleo, NuScale Power, and X Energy
              as its top three peers, but its list mixes portable microreactors, utility-oriented small modular
              reactors, industrial-heat systems, and established nuclear vendors. That classification is useful for
              capital and attention benchmarking, not proof that every listed company bids for the same project.
              Westinghouse represents an incumbent nuclear route, while X Energy, Newcleo, NuScale, TerraPower, and
              Kairos represent adjacent reactor programs with differing designs and deployment assumptions.


              The buyer's alternatives extend beyond nuclear developers. Radiant is explicitly positioned against diesel
              generators at remote, military, hospital, and commercial sites. Grid extension, continued diesel use, and
              an internally assembled portfolio of conventional generation and storage remain practical status-quo or
              internal-build choices, although the assigned pool does not quantify their cost or performance. Those
              alternatives can win without matching Kaleidos technically because they avoid first-of-a-kind reactor
              execution. Emerging developers such as Aalo Atomics and Last Energy also compete for investor attention
              and future customer budgets, but the pool provides funding headlines rather than comparable
              specifications.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
              - CP010
      - number: '3.2'
        title: Capability differentiation and trust posture
        blocks:
          - type: paragraph
            body: >
              Radiant's evidence-backed wedge is portability. The pool describes Kaleidos as a 1 MWe reactor intended to
              replace diesel generation, while independent summary evidence says Radiant targets minimal on-site
              construction, dry air cooling, factory fabrication, and return-to-factory refueling. These attributes
              matter where fuel logistics, water availability, construction time, or temporary deployment constrain
              conventional infrastructure. They do not establish lower lifetime cost, higher reliability, or easier
              licensing than every peer; those comparisons are absent from the assigned evidence and are marked unknown
              in the matrix.


              Trust and regulatory posture are also use-case specific rather than universal. The development unit is
              described as DOE-authorized, the Buckley commercial project as requiring an NRC commercial license, and
              Janus deployments as proceeding under Army regulatory authorities. This creates multiple routes to
              deployment, but each route has its own approval and performance gates. The official $750 million Army
              headline is a meaningful company-issued demand signal, yet the pool does not provide contract text,
              payment milestones, termination rights, or evidence that the headline amount is recognized revenue.
              Competitor authorization status is likewise incomplete, so regulatory superiority cannot be inferred.
            claimRefs:
              - CP004
              - CP005
              - CP011
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP011
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.3'
        title: Commercial model, switching costs, and supply access
        blocks:
          - type: paragraph
            body: >
              The only explicit packaging evidence in the pool says customers may buy a Kaleidos unit outright or use a
              power-purchase agreement. No dollar price, energy tariff, escalation clause, availability guarantee,
              discount schedule, or peer-equivalent quote is disclosed. The correct competitive conclusion is therefore
              about contract form, not price leadership. A purchase transfers more asset exposure to the buyer, while a
              power-purchase agreement can shift some financing and operating responsibility to the provider; the
              assigned evidence does not disclose the actual allocation of those risks.


              Radiant's return-to-factory model creates a service relationship after deployment: units are described as
              operating for five years between refueling and returning to a central facility for refurbishment or
              redeployment. That can simplify on-site nuclear handling, but it may also create switching friction around
              logistics, fuel, service continuity, and replacement power. Supply access is a potential advantage and
              dependency at once. Independent summary evidence reports TRISO fabrication arrangements with Standard
              Nuclear through the early 2030s and a multi-year Centrus HALEU agreement, but volumes, prices, priority
              rights, remedies, and exclusivity are not available in the pool.
            claimRefs:
              - CP005
              - CP008
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP008
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >
              Radiant has attracted capital and public-sector attention, but neither is a durable moat by itself. Tracxn
              reports $518 million of total funding for Radiant, below $1.53 billion for X Energy and $1.52 billion for
              TerraPower, while Newcleo is reported at $843 million. Those figures are cumulative funding, not cash
              available, and they do not measure technical readiness. Radiant's official funding headline says more than
              $300 million was raised to mass-produce transportable reactors; the hiring surface for a principal
              turbomachinery engineer further indicates continuing internal engineering work, not completed commercial
              validation.


              The strongest adverse evidence is industry-wide. Independent reporting warns that a first-of-a-kind
              reactor can be built by hand even when repeatable, cost-competitive manufacturing later fails, and
              suggests the field may narrow if startups miss promised reactor milestones. Radiant's portability and
              factory-return model may be differentiated, but their durability depends on repeat production, fuel
              availability, authorization, and service execution. Incumbents can respond with balance sheets and
              licensing experience, emerging developers can compete for the same capital and customers, and diesel
              remains immediately available. Without comparable delivered-energy pricing, reliability data, or signed
              contract economics, Radiant's moat should be treated as promising but unproven.
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP012
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Portability is the defensible comparison
            body: >-
              The evidence distinguishes Radiant most clearly on a portable 1 MWe form factor and factory-return
              operating model; it does not establish universal cost or performance leadership.
            calloutType: insight
            claimRefs:
              - CP004
              - CP005
              - CP016
          - type: callout
            title: Criticality is not repeatability
            body: >-
              Independent reporting separates first-of-a-kind reactor success from cost-competitive replication, making
              manufacturing yield, cycle time, and service economics core diligence items.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
