        title: Cost Structure, Manufacturing Scale, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The operating cost structure of Radiant Nuclear is primarily concentrated in advanced research, prototype
              fabrication, regulatory licensing, and manufacturing plant capitalization. The company’s planned
              mass-production facility, designated the R-50 plant located in Oak Ridge, Tennessee, represents a $280
              million capital build-out intended to support 175 specialized personnel and scale production output to 50
              factory-built microreactors per year—equivalent to approximately one Kaleidos unit per week. Each reactor
