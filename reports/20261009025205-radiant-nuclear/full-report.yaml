      - number: '6.2'
        title: Deployment Pipeline, Pre-Commercial Bookings & Milestones
        blocks:
          - type: paragraph
            body: >-
              Because Radiant Nuclear's Kaleidos reactor is an advanced nuclear technology in active prototype
              fabrication and regulatory testing, customer adoption is measured through contractual reservations,
              defense program selections, and site preparation agreements rather than deployed operational units [CU001,
              CU004]. Radiant's adoption trajectory is anchored to its scheduled testing of its first full-scale reactor
              at the Idaho National Laboratory (INL) DOME testing facility in 2026, marking a critical prerequisite for
              commercial customer deliveries planned to commence in 2028 [CU001, CU006, CU011]. Commercialization
              progress is demonstrated through key account engagements, including an agreement with digital
              infrastructure provider Equinix for up to 20 Kaleidos units, as well as a $750M contract award from the US
              Army to support energy independence across military installations [CU004, CU010]. To transition these
              reservations into physical deployments, Radiant is constructing its R-50 manufacturing factory in Oak
              Ridge, Tennessee, designed to achieve an annual production throughput of up to 50 reactors by 2028 [CU001,
              CU006].
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU010
