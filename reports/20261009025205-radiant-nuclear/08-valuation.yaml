company:
  name: "Radiant Nuclear"
chapter:
  number: 8
  title: "Valuation"
  summary: "Radiant Nuclear closed a $300M Series D funding round at a post-money valuation exceeding $1.8B to commercialize its 1 MW Kaleidos microreactor and break ground on its R-50 factory. While defense traction via a $750M Army Janus contract and commercial interest from Equinix validate high baseload power demand, zero commercial operating revenue, pending 2026 DOME criticality testing, and reactor replication hurdles leave current private valuations stretched and support a research-more stance."
sections:
  - id: "investment-thesis-and-valuation-context"
    title: "Investment Thesis and Valuation Context"
    body: "Radiant Nuclear is developing the Kaleidos microreactor, a factory-built, 1 MW electric (1.9 MW thermal) high-temperature gas-cooled portable reactor designed to fit inside a standard shipping container and operate for up to five years without refueling. The company has captured substantial market attention against a backdrop of escalating power requirements for artificial intelligence compute and remote defense infrastructure. In December 2025, Radiant announced a $300 million Series D financing round valuing the business at more than $1.8 billion, coming less than six months after its $165 million Series C. The financing syndicate was led by Draper Associates and Boost VC, with participation from Founders Fund, Chevron Technology Ventures, ARK Venture Fund, and Friends & Family Capital. The investment surge reflects an aggressive transition from laboratory research to industrial factory deployment, primarily targeting the groundbreaking of Radiant's planned R-50 manufacturing facility in Oak Ridge, Tennessee, intended to reach a run-rate capacity of 50 reactors annually. However, because Radiant remains a pre-commercial entity without audited recurring operating revenue or public unit gross margins, this $1.8 billion mark prices in rapid multi-year execution across reactor construction, regulatory clearance, and mass manufacturing without near-term cash flow support."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "comparable-dynamics-and-scenario-analysis"
    title: "Market Comparables and Scenario Analysis"
    body: "The broader advanced nuclear and small modular reactor market experienced massive capital inflows throughout late 2025 and 2026, highlighted by X-energy's $700 million round, Aalo Atomics raising $100 million, and Last Energy raising $100 million. Market commentators and sector analysts have raised concerns regarding frothy valuations and speculative bubble dynamics across advanced fission developers, where valuations have scaled ahead of physical testing and revenue generation. Radiant's commercial prospects are anchored by customer commitments including an agreement with global data center operator Equinix to supply 20 microreactors and a $750 million contract from the U.S. Army to supply transportable reactors for military installations. The crucial milestone governing Radiant's medium-term commercial viability is its scheduled demonstration unit test at Idaho National Laboratory's Demonstration of Microreactor Experiments (DOME) facility, part of the U.S. Department of Energy Reactor Pilot Program aiming for criticality. In a bull case, successful criticality and rapid regulatory validation allow Radiant to scale its R-50 manufacturing plant toward 50 units per year, justifying entry valuations through power purchase agreements and government fleet procurements. In contrast, bear and adverse scenarios demonstrate severe multiple compression if demonstration testing slips, factory construction costs escalate, or hand-built prototypes encounter replication friction during mass production."
    claimRefs:
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV002"
      - "TV003"
  - id: "exit-readiness-and-diligence-recommendations"
    title: "Exit Readiness and Diligence Recommendations"
    body: "Radiant's dual business model offers flexible monetization through outright unit sales or long-term Power Purchase Agreements (PPAs), bundled with a complete 20-year end-of-life haul-away service that eliminates customer waste management obligations. While this model lowers adoption friction for commercial data centers and military bases, significant diligence gaps persist. Current recognized revenue, ARR, gross margin, monthly cash burn, and runway remain entirely undisclosed in public materials. Furthermore, the commercial contracts with Equinix and the U.S. Army involve multi-year phased milestones whose exact progress payments, cancellation penalties, and unit delivery pricing terms have not been publicly audited. Given these evidentiary constraints and the speculative premium implied by the $1.8 billion valuation, an investment recommendation of research-more is warranted. Full capital commitment should remain contingent on verified DOME criticality at Idaho National Laboratory, audited unit economics from initial commercial builds, and visibility into board governance and liquidation preferences."
    claimRefs:
      - "CV003"
      - "CV014"
      - "CV015"
      - "CV016"
