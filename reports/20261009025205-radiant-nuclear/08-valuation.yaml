callouts:
  - calloutType: "recommendation"
    title: "Diligence Stance: Maintain Research-More Prior to Criticality"
    body: "Radiant's technological design and federal momentum make it a premier private microreactor contender. However, paying an enterprise valuation above $1.8B ahead of a first-of-a-kind criticality demonstration and factory groundbreaking exposes investors to severe uncompensated execution risk. Maintain a research-more stance until physical testing at INL DOME proves reactor operability."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV012"
      - "CV013"
  - calloutType: "risk"
    title: "The Industrial Replication Chasm"
    body: "As noted in independent market commentary, nuclear startups frequently succeed at constructing bespoke hand-built prototypes but encounter fatal capital constraints when transitioning to factory mass production. Radiant's ambitious R-50 Oak Ridge facility requires multi-hundred-million-dollar capital investments that could face sharp multiple contraction if macro market enthusiasm cools."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV010"
      - "CV012"
