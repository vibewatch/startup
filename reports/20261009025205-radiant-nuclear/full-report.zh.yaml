      - number: '1.3'
        title: 资本化历史、估值与国防支持
        blocks:
          - type: paragraph
            body: >-
              Radiant 在获得大量非稀释性联邦国防奖励的同时，也筹集了可观的私募股权资金。2025 年 12 月，公司宣布由 Draper Associates 和 Boost VC 领投、超过 $300 million
              的超额认购融资，Founders Fund、Ark Venture Fund、Chevron Technology Ventures 以及 Friends & Family Capital 参与，投后估值超过
              $1.8 billion。此前六个月，公司完成了 $165 million 融资。2026 年 2 月，Radiant 把国防主承包商 Lockheed Martin
              纳入该轮融资的战略投资者阵营。更关键的是，2026 年 8 月，Radiant 通过 Janus Program 获得美国陆军 $750 million 合同，制造并交付 15
              台可运输微型反应堆。尽管融资和合同里程碑醒目，Radiant 没有披露经常性商业收入或购电现金流，金融分析师也对核能市场泡沫和制造复制难题提出担忧。
