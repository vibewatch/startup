      - number: '8.3'
        title: 退出准备度与尽调建议
        blocks:
          - type: paragraph
            body: >-
              Radiant 的双重商业模式既可通过直接出售设备，也可通过长期购电协议（PPA）灵活变现，并捆绑完整的 20
              年期末运走服务，从而免除客户的废弃物管理义务。该模式降低了商业数据中心和军事基地的采用门槛，但尽调缺口仍然明显。目前确认的收入、ARR、毛利率、月度现金消耗和现金跑道在公开材料中均完全未披露。此外，Radiant
              与 Equinix 及美国陆军签订的商业合同包含多年分阶段里程碑；其中确切的进度付款、取消罚金和设备交付定价条款尚未经过公开审计。鉴于证据限制，以及 $1.8B
              估值所隐含的投机溢价，建议继续研究后再下结论。全面投入资本仍应以以下条件为前提：爱达荷国家实验室 DOME 的关键性经验证实、首批商业化建造的设备经济性通过审计，以及能够看清董事会治理和清算优先权。
            claimRefs:
              - CV003
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 尽调立场：在关键性验证前继续研究
            body: >-
              Radiant 的技术设计和联邦层面的推进势头，使其成为最具竞争力的私营微型反应堆候选者之一。然而，在首次关键性演示和工厂破土动工之前，就按超过 $1.8B
              的企业估值买入，会让投资者承担严重且没有补偿的执行风险。在 INL DOME 的物理测试证明反应堆可以运行之前，应维持继续研究的立场。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV013
          - type: callout
            title: 工业复制鸿沟
            body: >-
              独立市场评论指出，核能初创公司往往能成功建造定制化手工原型，但转向工厂批量生产时会遭遇致命的资本约束。Radiant 雄心勃勃的 R-50 Oak Ridge
              工厂需要数亿美元级资本投入；如果宏观市场热情降温，其估值倍数可能大幅收缩。
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV012
