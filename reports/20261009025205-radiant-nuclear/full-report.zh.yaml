      - number: '7.2'
        title: 临界演示、制造扩张与运营执行
        blocks:
          - type: paragraph
            body: >-
              Radiant 的核心工程论点，要求证明一台使用 TRISO 燃料和氦冷却剂的紧凑型 1 MWe 高温气冷堆，既能可靠运行，也能以汽车工业式规模重复制造。2026 年 8 月中旬，全尺寸 Kaleidos
              Development Unit 部件已从 Radiant 的 El Segundo 总部运往 Idaho National Laboratory 的 DOME 测试台，但目标为 2026
              年第三季度的带燃料临界窗口结束时，仍没有公开确认零功率临界、1 MW 热运行或计划中的 150 小时无人满功率运行。实现满功率运行并验证无需现场水源的空气冷却，是关键技术门槛；DOME
              上任何堆芯物理偏差、冷却剂流量异常或燃料资质失败，都可能打乱后续商业时间表。此外，行业观察人士指出，虽然首堆先进反应堆可以手工组装，核能初创公司在扩大工厂量产时往往会遇到严重复制障碍。Radiant 已开始在
              Oak Ridge 建设 300,000 平方英尺的生产园区，目标是在 2028 年后每年生产最多 50 台，但投产仍取决于许可和大规模制造工程招聘，以便把精密机械装配转为标准化生产线。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
