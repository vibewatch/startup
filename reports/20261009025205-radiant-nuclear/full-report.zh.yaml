      - number: '7.3'
        title: 燃料供应链、国防合同或有条件性与资本市场敞口
        blocks:
          - type: paragraph
            body: >-
              Radiant 的运营模式包含严重的对手方、供应链和财务依赖，放大了下行风险。Kaleidos 堆芯需要浓缩至 5% 至 20% U-235 的 HALEU，而这一燃料类别在美国国内商业浓缩基础设施极少。虽然
              Radiant 于 2026 年 7 月从美国能源部获得了第二份有条件 HALEU 配额，长期商业机群部署仍高度依赖联邦浓缩配额、Centrus Energy 商业化和标准核燃料供应链。在客户侧，Radiant
              的标志性商业成果是与美国陆军和国防创新部门签署的 $750 million Janus 协议，计划到 2030 年交付最多 15 台可运输机组，其中包括 Fort Benning 的 3
              台机组场地配对。但这些国防合同采用与绩效挂钩的开发和部署里程碑，而非保证的前期收入，单个安装场地也仍在评估。财务上，Radiant 已筹集超过 $500 million，其中包括 2025 年 12 月超过
              $1.8 billion 的 Series D 估值。商业反应堆销售确认收入为零，同时大量现金用于设施建设和测试活动；如果部署里程碑拖过 2028 年，Radiant 仍容易受到资本市场收缩或估值倍数压缩的冲击。
            claimRefs:
