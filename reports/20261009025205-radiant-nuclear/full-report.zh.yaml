  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、运行机制与核心架构
        blocks:
          - type: paragraph
            body: >-
              Radiant Nuclear 的主要产品是 Kaleidos，一款可运输、工厂制造的先进核微型反应堆，设计热功率为 3 MW（3 MWth），净发电功率约为 1 MW（1 MWe）。Kaleidos
              是紧凑、自成一体的能源系统，可装入一个标准商业集装箱，并可通过半挂卡车、铁路、货机或货船快速联运到终端用户安装基座。其主要运营目标，是替代偏远国防基地、医院园区、孤立工业设施和数据中心的传统 1 MW
              柴油机组。反应堆无需换料即可运行最长五年，从而消除持续化石燃料车队带来的严重物流和安全漏洞。技术上，Kaleidos
              被美国核管会归类为高温气冷堆（HTGR），采用棱柱形石墨慢化块并以加压氦气冷却。堆芯使用高丰度低浓铀（HALEU），制成 TRISO
              燃料颗粒；这些颗粒由微小铀和石墨内核组成，外覆多层耐火碳和碳化硅陶瓷壳，可承受超过 1,600°C 的温度而不熔化或释放裂变产物。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
