  - id: FE001
    title: 产品架构图
    type: stack
    summary: 综合展示 Kaleidos 1 MWe 可运输微型反应堆系统的技术与运营架构，共分六个专门功能层。
    data:
      layers:
        - label: 层 1：堆芯与燃料物理
          detail: 采用嵌入棱柱形石墨慢化块的 TRISO 燃料颗粒、3 MWth 高温气冷反应堆堆芯
          items:
            - label: TRISO 燃料颗粒
              detail: 采用陶瓷包覆的铀/碳燃料核，设计上可抵抗最高 1,600°C 的熔毁
            - label: 棱柱形石墨堆芯
              detail: 提供被动热稳定性和负温度系数的中子慢化剂
            - label: 5 年堆芯寿命
              detail: 两次工厂换料周期之间的完整运行寿命
        - label: 层 2：一回路热工水力与冷却
          detail: 驱动闭环功率转换的单相惰性氦气冷却剂回路
          items:
            - label: 加压氦气冷却剂
              detail: 在堆芯通道内循环的化学惰性单相气体
            - label: 闭式回路换热器
              detail: 提取热能用于发电
            - label: 被动衰变热排出
              detail: 全部失电时依靠自然循环和传导冷却
        - label: 层 3：功率转换与发电
          detail: 生成 1 MWe 清洁电力输出的闭环微型涡轮机
          items:
            - label: 1 MWe 电力涡轮机械
              detail: 布雷顿循环或专用闭环微型涡轮机功率转换
            - label: 微电网电气开关设备
              detail: 直接接入客户配电母线
        - label: 层 4：多式联运与物理包容
          detail: 作为结构防护边界的标准 ISO 运输集装箱
          items:
            - label: 单个运输集装箱外壳
              detail: 完整微型反应堆系统容纳在单个商业集装箱内
            - label: 多式联运能力
              detail: 可通过半挂卡车、铁路、货运飞机或船舶部署
            - label: 20 年寿命与运走
              detail: 20 年设计寿命结束时移除全部资产
        - label: 层 5：数字控制与自主安全仪表
          detail: 无需外部电力的故障安全停堆自动化
          items:
            - label: 自主安全逻辑
              detail: 重力驱动和被动反应性控制机制
            - label: 数字孪生与传感器遥测
              detail: 实时堆芯诊断和热梯度监测
        - label: 层 6：软件工程与建模基础设施
          detail: 用于反应堆仿真和机队遥测的现代软件栈
          items:
            - label: 云与容器编排
              detail: AWS、Docker 容器化和 Kubernetes 集群编排
            - label: 核心工程语言与 CAD
              detail: C++、Python、PostgreSQL、Ansys、Altium、SolidWorks
    approximationNotes: 架构层综合自 NRC 预申请文件和已发布的技术披露。功率转换细节仅为高层描述。
