  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可服务支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              要界定便携式核微型反应堆的可服务市场，必须把其独特的运营参数与更广泛的民用核能和数百兆瓦级小型模块化反应堆（SMR）领域区分开。Radiant Nuclear 的旗舰产品 Kaleidos 是一款 1
              MWe、工厂组装、可运输的氦冷微型反应堆，可装入标准运输范围，并在无需换料的情况下运行最长五年（CM001、CM006）。核心市场面向目前依赖柴油发电机的本地化高可靠主电源和备用电源、偏远微电网、远征军事设施及高密度计算基础设施（CM002、CM007）。与集中式基荷供电的公用事业级电网增容或大型轻水
              SMR
              不同，微型反应堆支出服务于韧性、分散式发电，适用于民用电网并网在技术上不可行、经济上过于昂贵，或容易遭受物理与网络攻击的场景（CM001、CM008）。主要目标细分市场的现状替代方案仍是重型工业柴油发电，它带来持续的运营脆弱性、高昂的燃料供应链物流负担和大量碳排放（CM002、CM007）。不过，微型反应堆并非单纯比拼铭牌容量的前期资本成本；其采用经济性取决于降低长期物流负担，并在数十年运营周期内锁定可预测的平准化电力成本（CM005、CM008）。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM010
      - number: '2.2'
        title: 市场规模口径与分部预测分歧
        blocks:
          - type: paragraph
            body: >-
              独立市场预测显示，广义模块化核能扩张与专用微型反应堆部署之间存在显著分歧。Grand View Research 的多分部预测估计，全球 SMR 市场 2025 年为 $6.54B，2033 年增至
              $10.69B，复合年增长率为 6.8%（CM003）。相比之下，PRNewswire/Cision 发布的专门微型反应堆研究预计，紧凑型微型反应堆将从 2025 年的 $0.85B 增至 2034 年的
              $6.8B，隐含 CAGR 为 26.0%（CM004）。这轮增长加速几乎完全由国防计划采购和人工智能基础设施不断上升的商业电力需求支撑（CM004、CM009）。国防部通过 Project Janus 和
              Advanced Nuclear Power for
              Installations（ANPI）计划设定了明确部署里程碑，也验证了长期购电协议（PPA）承购结构（CM008、CM011）。在这一框架下，随着工厂连续制造扩大，平准化电力成本（LCOE）预计将从首堆（FOAK）约
              $150/MWh 降至批量堆（NOAK）约 $60/MWh（CM005）。商业超大规模云服务商和数字基础设施运营商也成为并行需求驱动者，例如 Equinix 已支付现金订金预订 20 台
              Kaleidos（CM010）。但早期机组部署的经济性尚未验证，加之私营核技术市场估值倍数普遍偏高，可服务市场的转化仍受约束（CM009、CM012）。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM010
      - number: '2.3'
        title: 买方分层、采购路径与结构性约束
        blocks:
          - type: paragraph
            body: >-
              可运输微型反应堆的采用路径在国防机构和私营数字基础设施开发商之间存在明显分化。近期首要买方是美国国防部，其通过承包商所有、承包商运营（COCO）框架采购，把建设和技术风险转移给商业供应商（CM008、CM011）。在国防领域，采购由国家安全能源韧性要求驱动，运营准备度比短期商业回报更重要（CM008）。在商业领域，数据中心运营商和超大规模云服务商是第二增长板块；并网延迟超过四至七年，迫使其急需表后可调度发电（CM007、CM010）。商业买方会在两种采购模式中选择：一次性购买设备，或签订长期购电协议并配套退役和拖运条款（CM002）。尽管需求信号增强，市场渗透仍受多重结构性约束：高丰度低浓铀（HALEU）在西方供应链中的浓缩能力仍是瓶颈；专用高温制造基础设施需要大量资本投入；民用商业选址还需获得核管会或能源部的安全批准（CM011、CM013）。Radiant
              计划在田纳西州 Oak Ridge 建设 R-50 工厂，目标年产 50 台，但该计划仍取决于 Idaho National Laboratory 的成功示范测试（CM011、CM014）。
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM010
      - number: '2.4'
        title: 展品
        blocks:
          - type: callout
            title: 国防承购是商业去风险锚点
            body: 美国国防部的采购策略是私营微型反应堆开发商的重要非稀释性催化剂。国防机构通过国内军事基地的长期购电协议，承担首堆技术部署风险，从而建立私营金融市场在评估连续工厂生产时所需要的可融资承购。
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
              - CM011
          - type: callout
            title: HALEU 供应链脆弱性与监管障碍
            body: >-
              商业化时间表仍容易受到上游核燃料短缺影响。Kaleidos 等微型反应堆需要 HALEU，而美国国内浓缩能力目前受限。虽然初期政府配额支持早期测试，但 2020
              年代后期的商业机群运营需要迅速扩大国内商业浓缩基础设施。
            calloutType: risk
            claimRefs:
              - CM001
              - CM011
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：同行、在位者与现状方案
        blocks:
          - type: paragraph
            body: >
              现有证据支持一个广泛的竞争集合，而不是一份可直接互换产品的清单。Tracxn 在 110 家活跃竞争者中将 Radiant 排名第四，并把 Newcleo、NuScale Power 和 X Energy
              列为前三大同行，但其清单混合了便携式微型反应堆、公用事业导向的 SMR、工业热系统和成熟核能供应商。这一分类适合做资本和关注度基准，不代表每家公司都在竞标同一项目。Westinghouse 代表在位核能路线；X
              Energy、Newcleo、NuScale、TerraPower 和 Kairos 则代表设计和部署假设各不相同的相邻反应堆项目。

              买方的替代选择并不局限于核能开发商。Radiant
              明确以偏远、军事、医院和商业场所的柴油发电机为竞争对象。电网延伸、继续使用柴油，以及内部组合传统发电和储能，仍是可行的现状或自建选择，但现有证据池没有量化其成本或性能。这些替代方案无需在技术上匹配
              Kaleidos，也可能赢得项目，因为它们避开了首堆反应堆的执行风险。Aalo Atomics 和 Last Energy
              等新兴开发商也在争夺投资者关注和未来客户预算，但现有证据池提供的是融资新闻，而非可比规格。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
              - CP010
      - number: '3.2'
        title: 能力差异化与信任姿态
        blocks:
          - type: paragraph
            body: >
              Radiant 有证据支持的切入点是便携性。证据池将 Kaleidos 描述为一台用于替代柴油发电的 1 MWe 反应堆，独立摘要证据则称 Radiant
              追求尽量减少现场施工、干式空气冷却、工厂制造和返厂换料。这些特征适用于燃料物流、供水、施工时间或临时部署限制传统基础设施的场景。但它们并不能证明其全生命周期成本更低、可靠性更高，或许可比所有同行更容易；这些对比在现有证据中缺失，矩阵中标为未知。

              信任和监管姿态同样取决于使用场景，而非普遍成立。开发机组被描述为获得能源部授权，Buckley 商业项目需要 NRC 商业许可证，Janus
              部署则依据陆军监管权限推进。这形成了多条部署路径，但每条路径都有自己的审批和性能门槛。官方 $750 million
              陆军新闻是有意义的公司发布需求信号，但证据池没有合同文本、付款里程碑、终止权，或该金额已经确认为收入的证据。竞争者的授权状态也不完整，不能据此推断监管优势。
            claimRefs:
              - CP004
              - CP005
              - CP011
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP011
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.3'
        title: 商业模式、转换成本与供应获取
        blocks:
          - type: paragraph
            body: >
              证据池唯一明确的包装方式是：客户可以直接购买
              Kaleidos，也可以采用购电协议。没有披露美元价格、电价、调价条款、可用性保证、折扣表或同行可比报价。因此，正确的竞争结论应聚焦合同形式，而不是价格领先。购买会让买方承担更多资产风险；购电协议则可能把部分融资和运营责任转给供应商，但现有证据没有披露这些风险实际如何分配。

              Radiant
              的返厂模式会在部署后形成服务关系：机组据称可在两次换料之间运行五年，随后返回中央设施翻修或重新部署。这可以简化现场核处理，但物流、燃料、服务连续性和替代电力也可能因此成为转换摩擦。供应获取既可能是优势，也可能是依赖。独立摘要证据称，Radiant
              与 Standard Nuclear 的 TRISO 制造安排可持续到 2030 年代初，并与 Centrus 签有多年 HALEU 协议，但数量、价格、优先权、救济措施和排他性均未见于证据池。
            claimRefs:
              - CP005
              - CP008
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP008
      - number: '3.4'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >
              Radiant 获得了资本和公共部门关注，但二者单独都不是持久护城河。Tracxn 报告 Radiant 累计融资 $518 million，低于 X Energy 的 $1.53 billion 和
              TerraPower 的 $1.52 billion；Newcleo 据报为 $843 million。这些是累计融资，不是可用现金，也不衡量技术准备度。Radiant 官方融资新闻称，公司筹得超过 $300
              million 用于批量生产可运输反应堆；招聘信息中出现首席涡轮机械工程师岗位，也说明内部工程工作仍在继续，而非商业验证已经完成。

              最强的反向证据来自整个行业。独立报道警告，即使首堆反应堆可以手工制造，后续可重复且具成本竞争力的制造也可能失败；如果初创公司错过承诺的反应堆里程碑，行业格局可能收缩。Radiant
              的便携性和返厂模式或许具有差异化，但其耐久性取决于重复生产、燃料可得性、授权和服务执行。在位者可凭资产负债表和许可经验反击，新兴开发商会争夺同一批资本和客户，柴油也随时可用。在缺少可比的交付电价、可靠性数据或已签合同经济条款的情况下，Radiant
              的护城河应被视为有潜力但尚未验证。
            claimRefs:
