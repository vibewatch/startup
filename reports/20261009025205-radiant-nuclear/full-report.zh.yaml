      - number: '7.4'
        title: 展品
        blocks:
          - type: callout
            title: 选址与废物存储脆弱性：怀俄明州的警示先例
            body: >-
              Radiant 在怀俄明州 Bar Nunn 的经历表明，公众观感和州乏燃料法律是生死攸关的风险：市政方面因反对把核废物存储在距住宅 2,100 英尺处而叫停了计划中的工厂开发。即使 Kaleidos
              在技术上具备本质安全性，主办社区也可能在没有严密联邦废物处置保障的情况下拒绝现场安置反应堆。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: 尚未关闭的临界门槛：DOME 测试仍是决定性里程碑
            body: >-
              尽管 Radiant 于 2026 年 8 月成功将 Kaleidos Development Unit 运抵 Idaho National
              Laboratory，目标为第三季度的测试窗口结束时仍没有公开临界确认。在证明零功率临界和完整 150 小时功率运行之前，Radiant 的商业交付承诺和工厂扩张计划仍可能被开发进展迫使调整。
            calloutType: risk
            claimRefs:
              - CR006
