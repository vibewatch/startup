      - number: '8.2'
        title: 市场可比公司与情景分析
        blocks:
          - type: paragraph
            body: >-
              先进核能和 SMR 市场在 2025 年末和 2026 年持续吸收巨额资本，代表性事件包括 X-energy 融资 $700 million、Aalo Atomics 筹资 $100 million、Last
              Energy 筹资 $100 million。市场评论人士和行业分析师担心，先进裂变开发商的估值可能出现泡沫和投机性动态，估值增长已领先于实体测试和收入生成。Radiant
              的商业前景由客户承诺支撑，包括与全球数据中心运营商 Equinix 达成供应 20 台微型反应堆的协议，以及美国陆军供应可运输军事反应堆的 $750 million 合同。决定 Radiant
              中期商业可行性的关键里程碑，是其计划在 Idaho National Laboratory 的 Demonstration of Microreactor
              Experiments（DOME）设施测试演示机组；该设施属于美国能源部反应堆试点计划，目标是实现临界。在乐观情景下，成功临界和快速监管验证将使 Radiant 把 R-50 工厂扩张至每年 50
              台，并通过购电协议和政府机群采购支撑当前入门估值。相反，在悲观和不利情景下，如果演示测试延期、工厂建设成本上升，或手工原型在量产时遭遇复制摩擦，估值倍数将大幅压缩。
