      - number: '5.2'
        title: 部署物流、设施集成与软件工程栈
        blocks:
          - type: paragraph
            body: >-
              Kaleidos 的部署架构以工厂预制、密封装料和快速现场集成为核心。不同于需要大量土建和现场组装反应堆压力容器的传统轻水堆，Kaleidos
              机组计划在集中式制造工厂完成组装、装料和测试后再发运。抵达准备好的客户场地后，微型反应堆直接接入当地配电微电网，提供韧性基荷电力或专用的同址计算电力。商业承购条款采用直接购买机组资本资产或长期购电协议（PPA）订阅两种形式。反应堆预计
              20 年运营寿命结束时，Radiant 按合同拖走退役机组，避免场地方承担现场放射性退役责任。为协调反应堆建模、实时遥测和制造自动化，Radiant 采用现代软件工程方法，技术栈包括 AWS
              云基础设施、C#、C++、Docker 容器、Kubernetes 编排、PostgreSQL 数据库、Python 分析管线，以及 Ansys、SolidWorks 和 Altium 工程工具。
