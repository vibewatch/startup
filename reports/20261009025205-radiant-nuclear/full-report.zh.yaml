        title: 管理层、治理与关键人员风险
        blocks:
          - type: paragraph
            body: >-
              Radiant 的运营和技术领导团队带着航空航天与快速硬件开发的工程文化。总裁兼首席运营官 Tori Shivanandan 与首席商务官 Mike Starrett, Ph.D.
              共同带队，负责制造系统扩张、设施建设和商业部署路径。公司以加州 El Segundo 的总部及制造工厂为基地，同时在田纳西州 Oak Ridge
              和华盛顿特区设立新兴卫星办公室，以便贴近国家实验室和联邦监管机构。Radiant
              高度依赖快速硬件迭代和专有制造工具，因此关键人员依赖集中在机械、核系统和制造工程核心领导层。治理架构在私募风投董事会席位与航空航天、国防战略利益相关者之间寻求平衡。
