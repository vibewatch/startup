  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与估值背景
        blocks:
          - type: paragraph
            body: >-
              Radiant Nuclear 正在开发 Kaleidos 微型反应堆：一款工厂制造、1 MW 电力（1.9 MW
              热功率）的高温气冷便携式反应堆，可装入标准集装箱并在无需换料的情况下运行最长五年。在人工智能计算和偏远国防基础设施电力需求不断上升的背景下，公司获得了大量市场关注。2025 年 12 月，Radiant 宣布
              $300 million 的 D 轮融资，企业估值超过 $1.8 billion；不到六个月前，公司刚完成 $165 million 的 C 轮融资。该融资由 Draper Associates 和 Boost
              VC 领投，Founders Fund、Chevron Technology Ventures、ARK Venture Fund 以及 Friends & Family Capital
              参与。资本涌入反映出公司正从实验室研究激进转向工业化工厂部署，主要目标是启动田纳西州 Oak Ridge 的 R-50 制造设施，并达到每年 50 台的运行率产能。然而，Radiant
              仍处于商业化前阶段，没有经审计的经常性经营收入或公开的单位毛利，因此这 $1.8 billion 估值已经计入反应堆建设、监管许可和批量制造的多年快速执行，却没有近期现金流支撑。
