    notes: 建议和决策参数依据快速研究档案制定。估值立场偏高，反映无收入运营与推算的 >$1.8B 投后估值之间的差距。
    claimRefs:
      - CV003
      - CV004
      - CV013
      - CV014
  - id: TV002
    title: 正/反论点表
    columns:
      - 论点
      - 类型
      - 核心前提
      - 哪些变化会改变判断
    rows:
      - - 基荷清洁电力需求
        - 正论点
        - AI 数据中心电力约束和军用韧性要求催生了对便携式、无水冷 1 MW 微型反应堆的迫切需求。
        - 持续的监管僵局、意外的电池储能突破，或商业数据中心试点协议取消。
      - - 国防验证
        - 正论点
        - $750M 美国陆军合同为战术能源独立提供了大量非稀释性订单储备和运营验证。
        - 政府预算重新分配、未通过国防资格门槛，或原型现场测试取消。
      - - 大规模制造规模化
        - 正论点
        - Oak Ridge 的 R-50 设施目标是每年生产 50 台反应堆，通过装配线方法将微型反应堆单位成本降至 柴油发电同等水平。
        - 从手工制造演示机转向工厂量产时执行失败，或场址许可严重延误。
      - - 估值过早
        - 反论点
        - D 轮 >$1.8B 估值下，收入、ARR 或现金消耗指标均未披露，使后期投资者暴露于大幅下轮融资风险。
        - 披露经验证的高毛利商业经常性收入、盈利性 PPA 现金流，或确定的不可退款客户定金。
      - - 技术与临界风险
        - 反论点
        - 在 INL DOME 实现自持核裂变，需要严格的安全审批以及无瑕疵的高温氦冷却执行。
        - 在符合能源部反应堆试点计划的前提下，于 INL DOME 成功完成并公开验证临界演示。
    notes: 基于据报道的技术能力、融资披露和不利行业评论，对核心投资论点及反论点进行综合。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV009
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: 乐观/基准/悲观情景表
    columns:
      - 情景
      - 假设
      - 估值/回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观情景
        - 2026 年在 INL 成功完成 DOME 临界；R-50 工厂在 2028 年投运并达到每年 50 台；20 台 Equinix 反应堆通过高收益 PPA 部署；陆军合同顺利执行。
        - 隐含企业价值通过上市或战略能源收购扩大至 $4.0B–$6.0B；Series D 入场回报 >2.5x。
        - TRISO 燃料供应链瓶颈和监管检查延误
        - 中（30%）
      - - 基准情景
        - 临界实现但有轻微延迟；首批商业部署推迟至 2029–2030 年；部分满足陆军和商业数据中心需求； 工厂资本开支高于预期。
        - 估值停留在 $1.5B–$2.0B；增长需要稀释性后续股权轮；资本温和回收 1.0x–1.3x。
        - 稀释压力中等；公用事业并网和场址许可导致客户时间表推迟
        - 高（50%）
      - - 悲观/不利情景
        - 临界演示失败或中止；在量产工厂环境复制手工原型时出现技术故障；先进核能行业泡沫破裂。
        - 估值大幅下轮融资至 <$600M 或困境 IP 出售；后期投资者遭受重大资本损失。
        - 商业化完全停滞；在收紧的风险投资环境中无法筹集后续资本
        - 低至中（20%）
    notes: 情景分析将技术和制造里程碑映射至隐含估值轨迹及下行触发因素。
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV010
      - CV012
      - CV013
