  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、起源与核心使命
        blocks:
          - type: paragraph
            body: >-
              Radiant Nuclear（Radiant Industries, Inc.）是一家总部位于加州 El Segundo 的核技术公司，成立于 2020
              年，目标是制造大批量、可运输的核微型反应堆。公司的旗舰产品 Kaleidos 是一台工厂制造的 1 兆瓦电力（1
              MWe）本质安全微型反应堆，可装入标准集装箱，通过陆路、海路或航空运输，并直接部署到客户运营现场。Radiant 由前 SpaceX
              工程师创立，试图把航空航天制造方法、现代软件集成和快速硬件迭代用于核能发电。Kaleidos
              的商业与军事首要任务，是在偏远军事基地、关键民用基础设施、医院和高密度计算设施中替代柴油发电机，在无需换料的情况下连续提供最长五年的无碳电力。
