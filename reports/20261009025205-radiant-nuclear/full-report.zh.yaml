  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核能许可、选址先例与公众反对
        blocks:
          - type: paragraph
            body: >-
              Radiant 所处的是监管极严的核能运营环境，商业部署取决于前所未有的许可路径和当地社区接受度。对于商业及非国防民用应用，Kaleidos 设计自 2022 年 10 月起一直在美国核管会 99902106
              案号下进行预申请沟通。截至 2026 年秋季，NRC 预申请案卷显示，Kaleidos Development Unit 的调试计划仍在积极审查，尚未提交正式的 10 CFR Part 50 或 Part 52
              商业运营许可证申请。与此同时，Radiant 在田纳西州 Oak Ridge 的商业制造园区需要 10 CFR Part 70 特殊核材料持有和装料运营许可证，该申请也仍在审查。除了联邦监管批准，Radiant
              还面临当地选址和乏燃料政治阻力。在怀俄明州，强烈的市政反对和州法律对乏核燃料存储的限制，迫使 Radiant 放弃拟议的 Bar Nunn 微型反应堆制造及燃料存储设施；此前公众曾强烈反对将废物存储在距住宅区
              2,100 英尺处。尽管 Radiant 随后把工厂转向田纳西州 Oak Ridge，怀俄明先例仍说明，当地社区反对、对废物处理的看法和市政分区摩擦，会立即阻碍工厂选址和未来客户部署场地。
