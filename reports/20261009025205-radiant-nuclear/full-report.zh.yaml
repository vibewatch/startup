      - number: '5.3'
        title: 监管许可路径、测试里程碑与技术尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Radiant 的技术开发路线受联邦监管门槛和实体测试里程碑的顺序约束。公司于 2022 年 10 月在 NRC Docket 99902106 下启动与美国核管会的正式预申请监管沟通，并提交白皮书，分析 10
              CFR Part 50 和 52 的设计认证与许可、10 CFR Part 70 的特殊核材料持有、10 CFR Part 100 的反应堆选址，以及 10 CFR Part 55
              的机组操作员培训监管缺口。核管会已正式致函接受 Radiant 的 R-50 特殊核材料许可证申请，并在 ML26112A019 参考文件下提出意见。运营上，Radiant
              正在建造全尺寸演示测试反应堆，计划在联邦先进反应堆计划下于 Idaho National Laboratory（INL）进行热态测试，目标是从 2028
              年开始向首批客户商业交付。然而，技术和财务尽调揭示了明显的系统性风险：独立金融和能源分析师警告，更广泛的核能初创行业存在估值泡沫。首堆微型反应堆可以在专门设施中手工组装，但商业可行性完全取决于 Radiant
              能否实现真正的大规模制造复制和成本竞争力，同时避免严重延期、HALEU 燃料浓缩瓶颈或安全资质延误。
