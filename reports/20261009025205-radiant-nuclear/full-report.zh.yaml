  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将技术验证、商业进展、行业估值泡沫与“继续研究”建议串联起来的决策框架。
    data:
      nodes:
        - id: tech-milestone
          label: Kaleidos 1MW 微型反应堆
          detail: 示范机组计划于 2026 年夏季在 Idaho National Laboratory（INL）DOME 设施实现临界
          tone: neutral
        - id: commercial-traction
          label: 商业与国防积压订单
          detail: Equinix 20 台反应堆协议，以及 $750M 美国陆军可运输反应堆合同
          tone: positive
        - id: factory-scale
          label: 田纳西州 R-50 工厂
          detail: 计划在 Oak Ridge 奠基，目标是每年批量制造 50 台
          tone: neutral
        - id: market-risks
          label: 火热赛道与泡沫担忧
          detail: 数据中心焦虑与高风险融资浪潮推动估值超过 $1.8B
          tone: adverse
        - id: pre-revenue-reality
          label: 零公开经营收入
          detail: 完全没有经审计收入、ARR、毛利率和客户单价数据
          tone: negative
        - id: stance-recommendation
          label: 立场：估值偏高 / 继续研究
          detail: 在投入成长股权前，先跟踪 DOME 临界状态和单位经济性
          tone: warning
      edges:
        - from: tech-milestone
          to: commercial-traction
          label: 证明其可行性
        - from: commercial-traction
          to: factory-scale
          label: 推动其需求
        - from: factory-scale
          to: market-risks
          label: 在……之际获得资本支持
        - from: market-risks
          to: pre-revenue-reality
          label: 与……形成鲜明对比
        - from: pre-revenue-reality
          to: stance-recommendation
          label: 要求
