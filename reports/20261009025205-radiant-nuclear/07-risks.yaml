company:
  name: "Radiant Nuclear"
chapter:
  number: 7
  title: "Risks"
  summary: "Radiant Nuclear's commercialization faces complex technical, regulatory, and siting headwinds across its transportable Kaleidos microreactor program. Critical risks include untested fueled criticality at Idaho National Laboratory (INL), unresolved commercial operating licensing and special nuclear material approvals from the Nuclear Regulatory Commission (NRC), localized siting pushback over nuclear waste and spent-fuel storage as demonstrated in Wyoming, tight federal HALEU enrichment dependencies, and execution hurdles in scaling from hand-built prototypes to factory mass manufacturing."
sections:
  - id: "regulatory-licensing-and-siting-risks"
    title: "Nuclear Licensing, Siting Precedents, and Public Opposition"
    body: "Radiant operates in an intensely regulated nuclear operating environment where commercial deployment hinges on unprecedented licensing pathways and local community acceptance. For commercial and non-defense civilian applications, the Kaleidos microreactor design remains in pre-application engagement with the U.S. Nuclear Regulatory Commission under docket 99902106 since October 2022. As of autumn 2026, the NRC pre-application docket shows that the Kaleidos Development Unit commissioning plan remains under active regulatory review, and no formal 10 CFR Part 50 or Part 52 commercial operating-license application has been docketed. Concurrently, Radiant's commercial manufacturing campus in Oak Ridge, Tennessee, requires a 10 CFR Part 70 license for special nuclear material possession and fueling operations, which also remains under review. Beyond federal regulatory approvals, Radiant faces substantial local siting and spent-fuel political resistance. In Wyoming, intense municipal opposition and state legal restrictions on spent nuclear fuel storage forced Radiant to abandon its proposed Bar Nunn microreactor manufacturing and fuel storage facility after public outrage over waste storage 2,100 feet from residential neighborhoods. Although Radiant subsequently pivoted its factory to Oak Ridge, Tennessee, the Wyoming precedent demonstrates that local community opposition, waste handling perceptions, and municipal zoning friction represent immediate operational barriers for factory siting and future customer deployment pads."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "technical-testing-and-operational-execution-risks"
    title: "Criticality Demonstration, Manufacturing Scaling, and Operational Execution"
    body: "Radiant's core engineering thesis requires proving that a compact 1 MWe high-temperature gas-cooled reactor using TRISO fuel and helium coolant can operate reliably and be manufactured repeatedly at automotive-style volumes. While the full-scale Kaleidos Development Unit article was shipped from Radiant's El Segundo headquarters to Idaho National Laboratory's DOME test bed in mid-August 2026, the targeted third-quarter 2026 window for fueled criticality closed without a public confirmation of zero-power criticality, 1 MW thermal operation, or the planned 150-hour unattended full-power run. Achieving full-power operation and validating air cooling without on-site water are critical technical gates; any core physics discrepancy, coolant flow anomaly, or fuel qualification failure at DOME would disrupt subsequent commercial timelines. Furthermore, industry observers note that while first-of-a-kind advanced reactors can be assembled by hand, nuclear startups frequently encounter severe replication hurdles when attempting to scale factory mass production. Radiant has begun construction on a 300,000-square-foot production campus in Oak Ridge aiming for up to 50 reactors per year after 2028, but commissioning remains contingent on licensing and extensive manufacturing engineering recruitment to transition precision mechanical assembly into a standardized production line."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
    tableRefs:
      - "TR002"
  - id: "supply-chain-partner-and-capital-dependencies"
    title: "Fuel Supply Chains, Defense Contract Contingencies, and Capital Market Exposure"
    body: "Radiant's operational model incorporates severe counterparty, supply chain, and financial dependencies that elevate downside risk. The Kaleidos core requires High-Assay Low-Enriched Uranium (HALEU) enriched between 5% and 20% U-235, a fuel category with minimal domestic commercial enrichment infrastructure. Although Radiant secured a second conditional allocation of HALEU from the U.S. Department of Energy in July 2026, long-term commercial fleet deployment remains heavily dependent on federal enrichment allocations, Centrus Energy commercialization, and standard nuclear fuel supply chains. On the customer side, Radiant's signature commercial achievement is a $750 million Janus agreement with the U.S. Army and Defense Innovation Unit for up to 15 transportable units through 2030, including a 3-unit site pairing at Fort Benning. However, these defense contracts are structured with performance-contingent development and deployment milestones rather than guaranteed upfront revenue, and individual installation pads remain under evaluation. Financially, Radiant has raised more than $500 million, including a Series D valuation exceeding $1.8 billion in December 2025. With zero recognized commercial reactor sales revenue and heavy capital burn dedicated to facility construction and test campaigns, Radiant remains vulnerable to broader capital market contractions or valuation multiple compression if deployment milestones slip past 2028."
    claimRefs:
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
