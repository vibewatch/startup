callouts:
  - calloutType: "risk"
    title: "The Siting and Waste Storage Vulnerability: Wyoming as a Cautionary Precedent"
    body: "Radiant's experience in Bar Nunn, Wyoming, where municipal outrage over nuclear waste storage 2,100 feet from residential homes halted planned factory development, proves that public perception and state spent-fuel laws are existential risks. Even if Kaleidos is technically failsafe, customer host communities may reject on-site reactor placement without airtight federal waste disposal guarantees."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
  - calloutType: "risk"
    title: "The Unclosed Criticality Gate: DOME Testing Remains the Decisive Milestone"
    body: "Although Radiant successfully delivered the Kaleidos Development Unit to Idaho National Laboratory in August 2026, the targeted third-quarter testing window closed without public criticality confirmation. Until zero-power criticality and the full 150-hour power run are demonstrated, Radiant's commercial delivery commitments and factory expansion plans remain exposed to developmental revision."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
