evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics-disclosure
    missingEvidence: Exact Series C proceeds, cumulative capital raised, audited revenue, service mix, and customer-count disclosures.
    whyItMatters: >-
      These are the numbers needed to judge whether a RMB 32 billion private valuation is supported by operating
      performance rather than only strategic narrative.
    diligencePath: >-
      Request the board deck or audited KPI pack covering 2024-2026 revenue, customer count, backlog, gross margin, and
      a round-by-round financing schedule.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: founding-and-entity-scope
    missingEvidence: >-
      A formal legal-entity history that reconciles the official April 2018 founding claim with the June 27, 2019
      formation date cited in IPO-related coverage.
    whyItMatters: >-
      Entity-scope ambiguity can distort historical headcount, financing, and operating-metric comparisons if
      group-level and main-entity claims are blended.
    diligencePath: >-
      Obtain the full corporate-structure chart, incorporation documents, and any predecessor-entity history used in
      investor materials.
    relatedQuestionRefs:
      - QO002
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table-coverage
    missingEvidence: A complete officer and board roster with biographies and committee responsibilities.
    whyItMatters: >-
      The assigned public sources name only the founder and one technical leader, which is insufficient to assess bench
      depth or governance independence.
    diligencePath: Request the latest org chart, board composition, and executive-biography packet used for IPO counseling.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map-coverage
    missingEvidence: A full cap table, round history, investor rights summary, and any debt or quasi-equity instruments.
    whyItMatters: >-
      Publicly named investors and state-linked capital indicate financing breadth, but not liquidation preferences,
      dilution, or governance control.
    diligencePath: >-
      Request the cap table, financing documents, side letters, and a summary of any special voting or preference
      structures.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      GalaxySpace-specific signed contract values, customer-count segmentation, service ARPU, terminal ASP, and backlog
      by sovereign versus commercial program.
    whyItMatters: >-
      Without disclosed contract economics, the chapter can bound infrastructure activity but cannot convert that
      activity into a defensible GalaxySpace SAM or SOM.
    diligencePath: >-
      Request investor materials or IPO draft disclosure showing customer mix, backlog, service pricing, and revenue
      split across satellite manufacturing versus service operations.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: capacity-reconciliation
    missingEvidence: >-
      A dated operating disclosure reconciling the 2020 300-500-satellite factory ambition with the later
      100-150-satellite annual-capacity statements.
    whyItMatters: >-
      Supplier-throughput assumptions feed both market-share and commercialization timing, and overstating current
      capacity would overstate reachable near-term market share.
    diligencePath: >-
      Ask management for current installed capacity, utilization, output yield, and planned expansion milestones at the
      Nantong site.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public service pricing, terminal pricing, contract duration, and discounting for GalaxySpace and direct Chinese
      substitutes.
    whyItMatters: >-
      Without real price and contract data, the chapter can compare packaging posture but cannot underwrite switching
      cost or gross-margin durability.
    diligencePath: >-
      Obtain carrier partnership contracts, reseller sheets, procurement notices, or customer case studies with contract
      economics.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: commercial-backlog
    missingEvidence: >-
      Signed customer counts, backlog, renewal behavior, and revenue split between connectivity services and
      spacecraft-delivery projects.
    whyItMatters: Pilots and MoUs do not show whether GalaxySpace can convert technical proof into repeatable commercial demand.
    diligencePath: Request customer contracts, pipeline conversion data, and audited segment revenue by service versus hardware.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: state-backed-constellation-disclosure
    missingEvidence: >-
      Current public counts, pricing, and customer targeting for Guowang and other domestic state-backed rivals beyond
      the sparse retained-source references.
    whyItMatters: >-
      The direct-landscape comparison is directionally clear, but sparse public disclosure limits precision on how
      quickly those rivals can close GalaxySpace's positioning gap.
    diligencePath: >-
      Collect regulator filings, state-media program updates, and operator procurement records tied to Guowang and other
      Chinese constellations.
    relatedQuestionRefs:
      - QP001
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited 2024-2026 revenue, revenue mix by hardware versus services, backlog, and revenue-recognition policy.
    whyItMatters: >-
      Without realized revenue and mix, investors cannot test whether capacity and partnership claims convert into
      durable, high-quality sales.
    diligencePath: >-
      Request audited financial statements, customer-level revenue bridge, backlog schedule, and revenue-recognition
      memo from management.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: >-
      Cash on hand, monthly burn, debt or project-finance obligations, covenant profile, and use of proceeds from the
      February 2026 financing.
    whyItMatters: Capital adequacy cannot be underwritten from valuation and IPO-process headlines alone.
    diligencePath: >-
      Request cash waterfall, debt schedule, board-approved budget, and 18-24 month financing plan including downside
      case.
    relatedQuestionRefs:
      - QI007
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Realized ASP by satellite class, gross margin by hardware and services, CAC, payback, and sales-cycle metrics.
    whyItMatters: >-
      The central margin-path question is whether batch production and services expansion create operating leverage
      rather than just larger fixed costs.
    diligencePath: >-
      Request cohort-style unit-economics pack with order values, fulfillment cost, launch pass-through treatment, and
      customer-acquisition metrics.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Named top customers, concentration by constellation or government-linked program, contract duration, renewal
      terms, and cancellation rights.
    whyItMatters: >-
      SpaceBandits' state-order-book warning could materially affect revenue durability if one or two programs dominate
      demand.
    diligencePath: >-
      Request top-customer schedule, program pipeline, and concentration sensitivity under delayed or reduced
      constellation procurement.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: trust and assurance controls
    missingEvidence: >-
      Official security architecture, privacy controls, uptime/SLA metrics, certifications, incident history, and
      quality-system documentation for terminals and network operations.
    whyItMatters: >-
      Without assurance artifacts, it is hard to underwrite deployment readiness for regulated or mission-critical
      connectivity use cases.
    diligencePath: >-
      Request current security/compliance materials, quality manuals, certification registers, and service reliability
      dashboards directly from management.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: commercial readiness
    missingEvidence: >-
      Awarded constellation share, production backlog, terminal pricing, deployment count, and named production
      customers for direct-to-phone or broadband services.
    whyItMatters: >-
      Demo success does not prove that GalaxySpace has translated technical capability into contracted repeatable
      revenue-generating deployments.
    diligencePath: >-
