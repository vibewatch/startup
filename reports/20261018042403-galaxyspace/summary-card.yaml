  topStrengths:
    - >-
      Real industrial scale-up: repeated launches and a reported smart-factory capacity of 100-150 medium satellites per
      year.
    - >-
      Capital-markets momentum: a February 2026 financing round and March 2026 A-share IPO counseling show continued
      investor access.
    - >-
      Product breadth: the company spans broadband satellites, payloads, and core satellite components rather than a
      single narrow program.
  topRisks:
