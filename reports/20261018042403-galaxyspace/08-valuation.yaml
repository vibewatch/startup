chapter:
  number: 8
  title: Valuation
  summary: "Public evidence supports a cautious, price-sensitive view on GalaxySpace rather than a conviction buy. The company now has a disclosed February 2026 Series C post-money valuation of about RMB 32 billion and has entered A-share IPO counseling, but public reporting still does not disclose audited revenue, margins, backlog, or financing terms needed to underwrite that mark with confidence."
sections:
  - id: recommendation-entry-discipline
    title: Recommendation and entry discipline
    body: "GalaxySpace now has enough public evidence to support a live financing and IPO-context discussion, but not enough to support a strong underwriting call. Independent reporting says the company completed a February 2026 Series C round at an approximately RMB 32 billion post-money valuation and then entered A-share IPO counseling with Huatai United Securities in March 2026, which confirms that the company remains financeable and is trying to convert private-market momentum into a public-market process. At the same time, Xinhua states that the company has not disclosed specific revenue data, while Caixin reports a special-voting-rights structure that leaves founder Xu Min with 72.87% voting control. That combination supports a research-more recommendation and a stretched valuation stance: there is enough industrial proof and capital-market traction to keep the company investable, but not enough public financial disclosure or term transparency to justify paying through the latest disclosed mark."
    claimRefs: [CV001, CV002, CV003, CV006, CV013, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: valuation-context-and-comparables
    title: Valuation context and comparable framing
    body: "The strongest positive public evidence is operational scale, not economic disclosure. Xinhua says GalaxySpace had launched more than 40 self-developed satellites by January 2026 and had formed annual low-cost capacity for 100 satellites, while the Nantong development-zone report says the smart factory maintains annual production of 100 to 150 medium-sized satellites with a development cycle 80% shorter than traditional methods. Those facts support a real industrialization story and make the February 2026 valuation mark more credible than a concept-only space startup. However, the public-comp read-through still argues for discipline rather than enthusiasm. MarketBeat shows AST SpaceMobile at a $15.82 billion market capitalization on October 16, 2026, but still carrying a Hold consensus rating, 21.06% float short interest, and negative profitability. Stock Analysis shows the same company at just $611.94 million market cap on May 15, 2024, highlighting how violently direct-to-device satellite valuations can rerate as expectations change. Yahoo Finance adds an ISS Governance QualityScore of 10 for AST as of October 1, 2026, which is a reminder that governance and execution discount rates remain material even after a company reaches public-market scale."
    claimRefs: [CV004, CV005, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios-and-diligence-asks
    title: Scenarios, downside triggers, and final diligence asks
    body: "A precise intrinsic valuation is not supportable from public evidence today, so the defensible framework is scenario analysis around the disclosed February 2026 post-money mark rather than a model-driven target. The base case is only around that latest private mark and only if IPO preparation converts into prospectus-grade disclosure on revenue, margins, backlog, and financing terms. The bull case requires evidence that the manufacturing footprint and satellite launches are translating into repeatable commercial revenue and not only into strategic or pilot programs. The bear case becomes more likely if commercialization evidence stays thin, if capital-market access weakens, or if sector execution proves slower than filing rhetoric suggests. SatNews' description of China's large ITU filing footprint versus a much smaller deployed base underscores why investors should not pay simply for constellation ambition. The last diligence mile is therefore straightforward: obtain audited financials, backlog and contract-quality evidence, detailed C-round proceeds and preference terms, and IPO-filing disclosures before treating the latest private mark as investable."
    claimRefs: [CV002, CV004, CV006, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
