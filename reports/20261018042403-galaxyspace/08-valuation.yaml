callouts:
  - calloutType: recommendation
    title: "Bottom line"
    body: "GalaxySpace looks financeable and operationally credible, but the public evidence still supports research-more rather than buy because current valuation support relies on a disclosed private mark and industrial milestones without matching public economics."
    claimRefs: [CV001, CV002, CV004, CV006, CV013, CV014]
  - calloutType: risk
    title: "What would invalidate the current base case"
    body: "A weak or delayed IPO process, investor-unfriendly financing terms, or prospectus-grade disclosures that reveal poor commercial conversion would likely push the supportable valuation below the latest disclosed private mark."
    claimRefs: [CV001, CV003, CV006, CV011, CV012, CV015]
