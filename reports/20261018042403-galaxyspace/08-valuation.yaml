    columns:
      - Lens
      - Current evidence
      - What would change the view
    rows:
      - ["Industrial proof", "More than 40 self-developed satellites launched by January 2026; Nantong factory reported at 100-150 satellites annual production.", "Audited conversion of production scale into recognized revenue, backlog, and service gross margin would strengthen the thesis."]
      - ["Capital-markets momentum", "February 2026 Series C post-money valuation reported at ~RMB 32 billion; March 2026 A-share IPO counseling is underway.", "A filed prospectus or equivalent IPO disclosure with use of proceeds, capitalization, and customer concentration would improve underwriteability."]
      - ["Comparable read-through", "AST SpaceMobile shows that public markets can reward direct-to-device satellite narratives, but the comp still carries Hold consensus, heavy short interest, and negative profitability.", "A better view of GalaxySpace revenue quality and a cleaner peer set would reduce dependence on volatile narrative comps."]
      - ["Governance / structure", "Caixin reports founder Xu Min controls 72.87% of voting rights through special voting rights.", "Detailed shareholder agreements, preference stack, and minority protections could narrow governance discount rates."]
    notes: "Rows mix positive operating signals with unresolved diligence items; comparable-company evidence is illustrative rather than a direct valuation multiple bridge."
    claimRefs: [CV001, CV002, CV003, CV004, CV007, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation supportable today
      - Probability signal
      - Downside / upside trigger
    rows:
      - ["Bull", "IPO preparation yields audited financials, disclosed backlog, and evidence that manufacturing scale is converting into repeatable commercial revenue.", "Premium to the disclosed ~RMB 32 billion February 2026 post-money mark only after new disclosure appears.", "Not yet visible in public evidence; this is a contingent upside case.", "Prospectus-grade disclosure, contract-value proof, and better financing-term transparency."]
      - ["Base", "GalaxySpace keeps financing access and listing optionality, but public disclosure remains incomplete on economics and cap-table terms.", "Around the disclosed latest private mark, with no basis for aggressive upside.", "Most consistent with current evidence: real scale plus incomplete economic proof.", "Continuation of IPO process without major negative surprises."]
      - ["Bear", "Commercial conversion remains under-disclosed, financing terms prove investor-unfriendly, or sector deployment lags constellation rhetoric.", "Discount to the disclosed latest private mark.", "Meaningful because current evidence still relies more on capability proof than on disclosed financial outcomes.", "IPO delay, weak disclosed economics, down-round signals, or sector execution disappointment."]
    notes: "Scenario ranges are expressed relative to the disclosed February 2026 post-money mark because public evidence does not support a precise revenue, EBITDA, or DCF valuation model."
    claimRefs: [CV001, CV002, CV004, CV006, CV011, CV012, CV013, CV014, CV015]
