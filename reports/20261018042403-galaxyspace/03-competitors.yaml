callouts:
  - calloutType: "strength"
    title: "Integration is the clearest strategic wedge"
    body: >-
      GalaxySpace looks strongest when the buyer wants a Chinese-built package of satellites, payloads, terminals,
      and ground-side delivery rather than a single connectivity SKU.
    claimRefs: [CP001, CP003, CP008]
  - calloutType: "risk"
    title: "Commercial proof still trails industrial readiness"
    body: >-
      The public record still looks like pilots, MoUs, and industrial preparation. Without disclosed pricing,
      contract values, customer renewals, or a domestically proven low-cost launch base, incumbents and
      state-backed constellations can narrow differentiation quickly.
    claimRefs: [CP004, CP012, CP013, CP015]
