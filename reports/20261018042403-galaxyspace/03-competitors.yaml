company:
  name: "GalaxySpace (银河航天)"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    GalaxySpace's strongest competitive angle is not raw constellation scale but an integrated Chinese stack
    spanning satellite manufacturing, payloads, terminals, and ground-side services. The evidence still shows
    a pilot-stage commercial posture, while state-backed constellations and a crowded reusable-launch field can
    narrow any future cost advantage before GalaxySpace proves repeatable service economics.
sections:
  - id: "landscape-and-substitutes"
    title: "The competitive job is bigger than one broadband pilot"
    body: >-
      GalaxySpace is competing for more than a single retail broadband use case. Public reporting describes an
      integrated stack spanning satellite manufacturing, communication payloads, core modules, terminals, ground
      stations, and data services, which makes it closer to a sovereign-or-carrier infrastructure vendor than a
      simple connectivity reseller. That breadth matters because its clearest overseas proof points are still
      partnership and pilot signals rather than a disclosed scaled service business: Xinhua reported a
      mobile-to-satellite demonstration and a Thailand MoU with True Corporation, while EqualOcean said the
      September 2026 Laos trial was a technical demonstration with no disclosed commercial service launch,
      customer contract, or rollout timetable. In practice, the direct alternatives are state-backed Chinese
      constellations, the incumbent benchmark is Starlink's already scaled network, and the substitute path for
      many sovereign buyers is still a project-style combination of local telco integration, spacecraft delivery,
      and training instead of an always-on commercial broadband subscription.
    claimRefs: [CP001, CP002, CP003, CP004, CP011]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: "scale-and-enablers"
    title: "Scale today is mixed: credible manufacturing, modest disclosed constellation depth"
    body: >-
      On disclosed scale, GalaxySpace sits between concept and global incumbency. EqualOcean said the company
      had launched 49 satellites of its own development across communications, remote sensing, and other
      applications by late August 2026, but Jonathan McDowell's Yinhe statistics page showed only 8 launched and
      7 working for the named Yinhe broadband constellation as of October 15, 2026, implying that the
      communications-internet asset base is materially smaller than the total company satellite count. Public
      reporting also shows the company industrializing around that smaller base: Nantong says its smart factory
      can produce 100-150 medium satellites annually and more than 30 simultaneously, and PDNews said
      GalaxySpace launched more than 20 self-developed satellites since 2025. That profile makes GalaxySpace more
      vertically integrated than a pure reseller, but still far behind Starlink's disclosed orbital scale and
      still exposed to how quickly China's launch ecosystem can support repeated deployment.
    claimRefs: [CP005, CP006, CP007, CP008, CP011, CP016]
    tableRefs: [TP002]
  - id: "durability-and-compression-risk"
    title: "Durability depends on contracts before adjacent players compress the cost curve"
    body: >-
      GalaxySpace's moat still looks more industrial than commercial. Series C financing and IPO counseling show
      that it can stay in the race, but those capital signals do not substitute for disclosed pricing, customer
      backlog, or renewal evidence. NewSpaceEconomy argued that Guowang and Qianfan need repeated launches into
      planned orbital shells and that launch providers become part of the communications supply chain; the same
      article also said no Chinese operator had yet demonstrated routine orbital booster reuse as of June 1, 2026
      even though multiple programs were already flying or testing. That means GalaxySpace does not yet benefit
      from a domestically proven low-cost launch moat, while state-backed constellations can still compete on
      policy backing and launch priority. For now, the most defensible wedge is sovereign-friendly integration
      and manufacturing readiness, not proven service economics or network-scale lock-in.
    claimRefs: [CP004, CP009, CP010, CP012, CP013, CP014, CP015]
    tableRefs: [TP003]
