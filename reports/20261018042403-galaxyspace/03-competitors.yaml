      - ["GalaxySpace-True Thailand MoU", "No public price; memorandum rather than binding service contract", "Low-orbit communications, integrated space-ground network, and direct satellite-to-mobile collaboration", "No commercialization timeline, volume, or exclusivity disclosed", "Best visible distribution route is partner-led, not direct end-user sales"]
      - ["Thailand CubeSat / training package", "Project-style package; price not disclosed", "Spacecraft, ground systems, and personnel training", "Remote-sensing and capability-building package, not a broadband subscription", "Shows an adjacent systems-integration revenue path"]
      - ["Chinese reusable-launch competition", "Per-launch pricing not disclosed; value proposition is future lower cost and higher cadence", "Recovery systems, launch pads, engines, and supporting infrastructure", "No routine orbital booster reuse yet", "Launch-cost advantage remains prospective, so GalaxySpace cannot assume durable deployment arbitrage"]
    notes: >-
      Public pricing is mostly absent in the assigned pool, so this table compares packaging and disclosure posture
