chapter:
  number: 6
  title: "Customers"
  summary: "Public evidence points to three customer surfaces for GalaxySpace: state-backed constellation manufacturing, telecom/operator distribution, and still-emerging satellite service lines. The strongest named proof is GalaxySpace's reported work on a Guowang batch and its PCCW Global verification in Hong Kong, but the public record still lacks contract values, renewal metrics, and top-customer concentration data."
sections:
  - id: "customer-surfaces"
    title: "Disclosed customer surfaces skew institutional and channel-led"
    body: |
      The retained evidence suggests GalaxySpace is selling into a mix of institutional programs and channel-mediated connectivity opportunities rather than disclosing a broad base of named enterprise customers. Caixin's IPO-counseling coverage says the company's business scope includes satellite communication services, microsatellite manufacturing, ground-station construction and operation, and satellite data services, which points to multiple buyer and payer types instead of a single hardware SKU. MERICS adds the clearest named institutional proof: it says Guowang's latest batch was designed and built by GalaxySpace, indicating that a state-backed constellation program is one of the most concrete public counterparties tied to current production work.

      The only clearly disclosed commercial route-to-market evidence in this pool is the PCCW Global relationship. Mobile World Live says PCCW installed GalaxySpace's first testing gateway station in Hong Kong and that the two parties agreed in September 2024 to deliver high-speed LEO connectivity services to customers in Hong Kong and other international markets. That matters because it shows GalaxySpace's most visible expansion path is operator-led distribution rather than direct disclosure of many named end customers. Across this source set, GalaxySpace looks more like an infrastructure supplier and telecom-enablement partner than a company already publishing a diversified roster of recurring end-user accounts.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU006"
      - "CU014"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-and-trajectory"
    title: "Adoption proof is real but still infrastructure-first"
    body: |
      The chapter's adoption evidence is stronger on deployment activity and technical verification than on disclosed customer economics. Mobile World Live reports that the PCCW/GalaxySpace tests reached 100Mb/s and supported uninterrupted satellite internet video calls, which is meaningful technical proof but still a verification milestone rather than renewal evidence. Global Times separately reports that GalaxySpace launched more than 20 self-developed satellites since 2025, while NETDA says the Nantong smart factory can produce 100-150 medium-sized satellites annually and has already put more than 20 locally manufactured satellites into stable orbit. Together, those sources show operating cadence and delivery capacity, but they do not convert directly into active-customer, utilization, or contract-value metrics.

      Independent context from MERICS, NewSpace Index, and China Economic Net/Xinhua reinforces that the broader Chinese satellite-internet market is still building out usage and service readiness. MERICS says China had three million satellite-communication users across all offerings in 2024 and is targeting ten million by 2030, while NewSpace Index shows the adjacent Qianfan/Thousand Sails constellation still framing adoption in terms of satellites launched and initial commercial-service capability. China Economic Net/Xinhua's June 2026 coverage of Spacesail's direct-to-cell trial similarly centers on a technical milestone and a 200-satellite constellation count. The pattern is consistent: public proof in this market remains infrastructure-led and pilot-heavy, so GalaxySpace's adoption trajectory is visible, but not yet legible through mature customer KPI disclosure.
    claimRefs:
      - "CU005"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-and-concentration"
    title: "Durability, expansion economics, and concentration remain under-disclosed"
    body: |
      The weakest part of the public customer story is durability. None of the retained sources discloses NRR, GRR, churn, contract duration, renewal rates, backlog conversion, or contract values for GalaxySpace's reported counterparties. That absence is especially important because the available proof clusters around a state-backed constellation batch, a telecom partner verification, and broad business-scope language rather than a long list of production deployments. In practical diligence terms, the evidence demonstrates that GalaxySpace is in commercially relevant workflows, but not that it has durable recurring customer economics across a diversified base.

      Adverse and cautionary sources also suggest concentration and scaling risk. MERICS says SpaceSail and Guowang remain far from their constellation targets and notes that many private ventures are still in early stages with intended use cases that are not always clear. SatNews goes further by arguing that China's current commercial launch infrastructure can support only a tiny fraction of the orbital paper fleet it has reserved. Even if those sources are sector-wide rather than GalaxySpace-specific, they matter because GalaxySpace's most visible counterparties and expansion paths are tied to the same ecosystem. Until the company discloses named production customers, contract economics, and concentration data, public evidence supports a view of credible demand access but weak durability underwriting.
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
