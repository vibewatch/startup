      - number: '1.2'
        title: 领导权集中与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开报道呈现出一家由创始人主导、控制权高度集中的 GalaxySpace。Caixin 和 The Paper 称 Xu Min 是创始人、董事长兼 CEO；特殊表决安排使其在直接和间接持股 22.04%
              的情况下，仍拥有 72.87% 的投票权 [CO004]。创始人之外的技术管理层披露较少：The Paper 引述型号总师 Hu Zhao 介绍智能工厂生产效率，但现有资料 未提供完整的高管团队或董事会名单
              [CO005]。因此，公司至少有一位可见的技术负责人，但治理尽调仍需回答董事会构成、继任梯队，以及在 GalaxySpace 走向公开市场时， 控制权是否会实质限制外部投资者等问题 [CO004][CO005]。
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: 融资、估值与披露质量
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 于 2026 年 2 月完成新一轮融资，随后在 2026 年 3 月 30 日由 Huatai United Securities 开展 A 股 IPO 辅导，2026
              年因此成为公司从私募融资转向资本市场准备的明确过渡年 [CO011][CO012]。People's Daily 将该 Series C 轮投后估值报为约 RMB 32
              billion，但本资料池的公开记录仍未足够精确地披露本轮融资所得、累计融资额、收入、收入运行率、 ARR 或客户数，无法支撑可用于投资判断的 KPI 视图 [CO014][CO015]。Baiguan
              提供了有价值的反向视角：其认为 2026 年是中国商业航天 IPO 前变现的高峰年，投机热情已经跑在执行证据前面 [CO016]。这并不否定 GalaxySpace
              的融资势头，但意味着披露质量是核心尽调风险，而不是行政性的后续事项 [CO011][CO012][CO014][CO015][CO016]。
