      - number: '4.2'
        title: 成本结构与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开单位经济性证据来自运营而非财务。Nantong NETDA 称，智能工厂可并行生产超过 30 颗卫星，大约每 5 天生产 2 颗，年产 100-150 颗中型卫星；Xinhua 独立报道称， 生产节奏为
              3 天，2 颗卫星的组装和测试需 5 天，年产能为 150 颗中型卫星，2025 年已交付 22 颗中型卫星。这些都是有意义的效率代理指标，因为它们显示 GalaxySpace 正试图在批量生产基础上摊薄
              工装、人工和鉴定成本，而不是定制一次性航天器。New Space Economy 的行业背景是，现代 LEO 制造经济性偏好规模生产、自动化测试流程和商业化零部件采购，这与 GalaxySpace
              的公开制造叙事方向一致。 但现有记录仍未公开实际 ASP、毛利率、服务毛利率、发射成本转嫁政策、获客成本或回本周期。结论不是单位经济性差，而是外部投资者目前只能看到吞吐量主张，看不到吞吐量如何转化为贡献利润。
            claimRefs:
              - CI004
