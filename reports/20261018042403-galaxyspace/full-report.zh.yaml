  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据显示，一条以硬件为先的链条从卫星设计和批量生产延伸到星座订单与服务线，但确认收入和毛利仍未披露。
    data:
      nodes:
        - id: design
          label: 卫星与载荷研发
          note: 宽带与星座平台开发
        - id: factory
          label: 批量生产
          value: 100-150 medium satellites annually
          note: 公开产能口径
        - id: validation
          label: 发射与在轨验证
          value: 22 medium satellites shipped in 2025
          note: 公开实际产出的代理指标
        - id: orders
          label: 星座与合作伙伴订单
          note: 核心订单已有口径；合同金额未披露
        - id: services
          label: 通信、地面站和数据服务
          note: 服务收入线已披露；定价未披露
        - id: revenue
          label: 确认收入
          note: 结构、确认时点和经常性收入占比均不可得
        - id: gross-profit
          label: 毛利与再投资能力
          note: 取决于产能利用率、定价和服务毛利
