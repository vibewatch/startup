  - id: FE001
    title: GalaxySpace 公开产品架构
    type: stack
    summary: 公开证据支持一条从应用和终端向下连接到空间硬件与制造的纵向链条，但软件、控制层和可靠性遥测的披露仍然稀薄。
    data:
      layers:
        - label: 应用与服务使用场景
          detail: 已公开演示的工作流，将星座转化为面向用户的连接产品。
          items:
            - label: 应急响应无人机控制
              detail: 远程消防无人机测试通过 GalaxySpace 的 LEO 网络，将成都现场作业与北京操作员连接起来。
            - label: 运动中连接
              detail: 车辆测试通过 Little Spider Web 实验星座传输视频并下载大文件。
            - label: 直连智能手机路径
              detail: 2025 年卫星测试的目标是为智能手机提供卫星直连宽带，并实现天地一体化。
          outputs:
            - label: Demonstrated field use cases
              detail: >-
                The retained public evidence is strongest on drone, vehicle, and handset-adjacent demonstrations rather
                than disclosed contracted service deployments.
        - label: 终端与地面接口
          modules:
            - label: 相控阵用户终端
              detail: 公司和媒体材料曾公开描述，并用于无人机和车辆演示。
            - label: 地面站与数据服务
              detail: 财新称，登记经营范围已经包括地面站建设和卫星数据服务。
        - label: 网络运营层
          detail: 公开证据指向一个支撑服务的网络层，但其软件和控制平面细节尚未披露。
          items:
            - label: 天地一体化测试
              detail: 《环球时报》称，2025 年具备直连智能手机能力的卫星已经用于天地网络一体化验证。
            - label: 地面站与数据运营
              detail: 财新将地面站建设、运营和卫星数据服务列入公开经营范围。
        - label: 空间段
          items:
            - label: 七星实验星座
              detail: IAF 称，GalaxySpace 已建立一个由七颗卫星组成的 LEO 宽带通信星座。
            - label: Yinhe-1 Q/V 频段演示器
              detail: NewSpace Market 称，Yinhe-1 验证了 Q/V 频段宽带链路，并在测试中实现超过 10 Gbps 的下行速率。
          outputs:
            - label: Q/V feeder links and Ka user links
              detail: Public product descriptions cite Q/V feeder frequencies and Ka-band user terminals.
        - label: 工业化层
          detail: 制造规模和供应商覆盖面是公司产品交付逻辑的核心部分。
          items:
            - label: 南通智能工厂
              detail: 公开来源称，该工厂可同时运行 30 多颗卫星，年产 100-150 颗中型卫星。
            - label: 供应链生态
              detail: 《环球时报》称，GalaxySpace 的供应链合作伙伴数量从约 100 家增至超过 1,000 家。
          modules:
            - label: 数字化生产排程与自动化测试
              detail: 南通政府报道显示，数字化排程、自动化测试和空间环境模拟器构成该工厂的控制系统。
        - label: 供应链降本层
          detail: 公开报道将零部件工业化与相控阵天线成本下降及供应商参与扩大联系起来。
          items:
            - label: 天线降本
              detail: 《环球时报》称，星载毫米波相控阵天线价格仅为十年前的十分之一。
            - label: 超过 1,000 家供应链合作伙伴
              detail: 《环球时报》称，GalaxySpace 的供应商网络从成立时约 100 家扩展至超过 1,000 家。
    approximationNotes: 这是一张基于公开证据的架构图，而非已披露的系统图；软件、控制和保障层未披露，因此未纳入。
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: GalaxySpace 的可见路径从机构项目中标和电信整合，走向尚未验证的经常性客户经济模型。
    data:
      items:
        - label: 进入机构项目
          actor: 国家支持的星座运营商
          stage: 项目选择
          touchpoints:
            - 据报道，Guowang 最新一批卫星由 GalaxySpace 设计和制造
            - 现有证据最扎实的是基础设施项目
        - label: 运营商整合
          actor: PCCW Global
          stage: 网关搭建
          channel: 电信合作伙伴
          touchpoints:
            - 首个测试网关站建于香港
            - 接入 GalaxySpace 的八星实验星座
        - label: 技术验证
          actor: GalaxySpace + PCCW
          stage: 试点
          touchpoints:
            - 100Mb/s 双向测试
            - 卫星互联网视频通话不中断
        - label: 市场覆盖扩张
          actor: 未披露的终端客户
          stage: 商业意向
          channel: 香港和国际市场
          touchpoints:
            - 计划通过运营商主导的市场路径提供服务
            - 公开来源没有识别下游客户账户
        - label: 服务线扩展
          actor: 潜在的地面站和数据服务买方
          stage: 增购 / 邻近收入
          touchpoints:
            - 公开备案列出地面站建设、运营和卫星数据服务
            - 未披露具名客户或合同指标
        - label: 持久性验证缺口
          actor: 投资人 / 尽调团队
          stage: 投资判断
          touchpoints:
            - NRR、GRR、流失率、续约率和头部客户集中度均未披露
            - 公开证据更多支持需求触达，而非经常性经济模型
    approximationNotes: 该顺序反映公开披露所暗示的先后关系，不是经过测量的转化漏斗。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU014
  - id: FR001
    title: 风险热力图
