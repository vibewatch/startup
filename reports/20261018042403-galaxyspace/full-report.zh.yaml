          - type: paragraph
            body: >-
              目前可见的公开缓释措施主要是产业流程控制：自动化、数字化排程、测试基础设施和工厂内部的防护措施。这些措施有用，但无法单独消除最重要的剩余风险，后者集中在发射获取、许可与频谱协调、
              客户经济性和融资条款上。对投资者而言，最清晰的逻辑失效触发器是可量化的：IPO 路径错过或明显延迟、发射稀缺拉长星座时间表、频谱或干扰规则限制服务部署，或无法把工业产出转化为合同化经常性需求。
              若这些情况在经审计经济数据出现前发生，当前估值支撑将明显减弱。
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 目前已有足够公开证据支持讨论融资和 IPO 背景，但不足以形成强有力的投资判断。独立报道称，公司于 2026 年 2 月完成 Series C 轮融资，投后估值约为 RMB 32
              billion，随后于 2026 年 3 月 在 Huatai United Securities 辅导下进入 A 股 IPO
              辅导，这确认公司仍具备融资条件，并试图将私募市场势头转化为公开市场流程。与此同时，Xinhua 称公司未披露具体收入数据；Caixin 报道的特殊表决权结构 使创始人 Xu Min 拥有 72.87%
              的投票控制权。这一组合支持“继续研究”的建议和偏高的估值立场：产业证据与资本市场进展足以让公司保持可投资性，但公开财务披露和条款透明度不足， 不足以支持投资者按最新披露估值加价买入。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: 估值背景与可比公司框架
        blocks:
          - type: paragraph
            body: >-
              最强的正面公开证据是运营规模，而非经济数据披露。Xinhua 称，截至 2026 年 1 月，GalaxySpace 已发射超过 40 颗自研卫星，并形成 100 颗卫星的年化低成本产能；南通开发区报告称，
              智能工厂年产 100 至 150 颗中型卫星，研发周期比传统方法缩短 80%。这些事实支撑真实的产业化故事，也使 2026 年 2 月的估值相较纯概念航天初创公司更可信。
              但公开可比公司信息仍要求保持纪律而非热情。MarketBeat 显示，AST SpaceMobile 于 2026 年 10 月 16 日市值为 $15.82 billion，但共识评级仍为
              Hold，流通股空头利息为 21.06%，盈利能力为负。 Stock Analysis 显示，该公司 2024 年 5 月 15 日市值仅为 $611.94
              million，说明随着预期变化，直连设备卫星估值可能剧烈重估。Yahoo Finance 还显示，截至 2026 年 10 月 1 日，AST 的 ISS Governance QualityScore 为
              10，提醒投资者即使公司达到公开市场规模，治理和执行折现率仍然重要。
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 情景、下行触发器与最后的尽调要求
        blocks:
          - type: paragraph
            body: >-
              仅凭当前公开证据无法支撑精确的内在估值，因此更稳妥的框架是围绕 2026 年 2 月披露的投后估值做情景分析，而不是给出模型驱动的目标价。基准情景只能围绕最新私募估值成立， 且前提是 IPO
              准备转化为招股书级别的收入、利润率、积压订单和融资条款披露。乐观情景需要证据证明制造布局和卫星发射正在转化为可重复的商业收入，而不只是战略项目或试点项目。
              如果商业化证据仍然稀薄、资本市场准入转弱，或行业执行速度慢于申报叙事，悲观情景就更可能发生。SatNews 对中国庞大 ITU 申报规模与更小实际部署量之间差距的描述，说明投资者不应仅为星座野心付费。
              因此，最后一公里尽调很明确：在把最新私募估值视为可投资估值前，取得经审计财务报表、积压订单和合同质量证据、详细的 C 轮融资所得及优先权条款，以及 IPO 申报披露。
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 结论
            body: GalaxySpace 看起来具备融资条件，运营上也可信；但公开证据仍支持“继续研究”而非“买入”，因为当前估值支撑依赖已披露的私募估值和产业里程碑，却没有相匹配的公开经济数据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV013
              - CV014
          - type: callout
            title: 什么会使当前基准情景失效
            body: IPO 流程疲弱或延迟、对投资者不友好的融资条款，或招股书级别披露显示商业转化不佳，都可能把可支撑的估值推低到最新披露私募估值以下。
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV011
              - CV012
              - CV015
