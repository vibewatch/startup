      - number: '1.4'
        title: 里程碑与当前经营阶段
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司正从技术演示走向产业化，而不是已经用商业指标证明自身。GalaxySpace 称其于 2020 年 1 月发射首颗卫星，2022 年 3 月发射 6 颗量产 LEO 宽带卫星， 并于 2023
              年 7 月发射 Lingxi-03 可堆叠平板卫星 [CO008][CO009][CO010]。到 2026 年，叙事转向规模化生产、新融资和持续技术开发：公开来源提到 2 月融资、3 月 IPO 辅导、
              南通工厂年产 100-150 颗中型卫星，以及 2026 年 9 月 PEGA-SUS1 演示发射 [CO006][CO011][CO012][CO013]。因此，当前经营阶段更适合描述为后期私营企业 /
              成长期产业化： 技术里程碑和制造野心真实存在，但商业进展和财务韧性仍大幅披露不足 [CO006][CO008][CO009][CO010][CO011][CO012][CO013][CO015]。
