      - number: '6.3'
        title: 业务韧性、扩张经济性和客户集中度仍披露不足
        blocks:
          - type: paragraph
            body: >
              公开客户故事最薄弱的部分是业务韧性。现有来源均未披露 GalaxySpace 所报道交易对手的
              NRR、GRR、流失率、合同期限、续约率、积压订单转化率或合同金额。这个缺口尤其重要，因为现有证据集中在一批国家支持的星座卫星、 电信伙伴验证和宽泛业务范围表述上，而不是一长串生产部署。从实际尽调角度看，证据证明
              GalaxySpace 已进入具有商业意义的流程，但不能证明其在多元化客户基础上拥有持久的经常性客户经济性。

              反向和谨慎来源还提示了集中度与规模化风险。MERICS 称，SpaceSail 和 Guowang 距离星座目标仍很远，并指出许多私营项目仍处早期阶段，预定用途也并不总是清晰。SatNews
              更进一步认为，中国当前的商业发射基础设施只能支持其预留轨道纸面舰队中的极小一部分。 即使这些来源针对的是整个行业而非 GalaxySpace，它们仍然重要，因为 GalaxySpace
              最可见的交易对手和扩张路径都与同一生态绑定。在公司披露具名生产客户、合同经济性和集中度数据之前，公开证据支持“需求入口可信、但业务韧性难以评估”的判断。
            claimRefs:
