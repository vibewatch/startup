chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、布局与报告边界
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 将自己定位为中国领先的卫星互联网解决方案提供商和卫星制造商，产品覆盖连接解决方案、载荷、平台及卫星部件 [CO001][CO007]。Reuters
              将其描述为总部位于北京；官方及地方政府材料则显示，公司在北京、西安、成都和南通具备运营与制造能力 [CO003][CO006]。需要留意的是法律实体边界：GalaxySpace 英文网站称公司成立于 2018 年
              4 月，但 IPO 辅导报道显示，当前北京法律实体成立于 2019 年 6 月 27 日，注册资本为 RMB 44.381908 million [CO002][CO003]。尽调时，最稳妥的理解是：业务叙事始于
              2018 年，而当前披露的报告边界对应 2019 年法律实体；历史、所有权记录及集团层面运营指标仍需对齐 [CO002][CO003]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO007
