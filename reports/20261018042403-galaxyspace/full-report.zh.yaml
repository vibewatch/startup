      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              2026 年的融资和上市信号意味着 GalaxySpace 仍需要外部资本扩张，但没有说明现有资金能支撑多久。People's Daily 称，公司于 2026 年 2 月完成 Series C
              轮融资，投后估值约为 RMB32 billion； People's Daily 和 Caixin 均报道，公司于 2026 年 3 月进入 A 股 IPO 辅导，辅导机构为 Huatai United
              Securities。这一组合符合资本密集型工业公司准备更广泛融资路径的特征，而不是已经明确实现现金流自给。 资料池中的 SpaceBandits 给出了最直接的反向判断：GalaxySpace
              目前正在向国家分配的星座订单供货，其 headline 独角兽估值源于更早的融资批次，且仍没有公开财务报表。 由于公开来源未披露现金余额、烧钱速度、债务额度、项目融资义务或 2
              月融资所得用途，现有证据只能将融资依赖视为尽调问题，不能据此算出确定的现金跑道。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI013
      - number: '4.4'
        title: 财务判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，GalaxySpace 更像一个对规模敏感的产业平台，而不是软件式经常性收入故事。公开证据支持其具备明显的制造野心、更宽的产品到服务覆盖面，以及获得新股权融资和推进 IPO 的能力，
              但不足以提供在当前估值下评估收入质量或利润率路径所需的核心数据。最站得住脚的正面判断是：GalaxySpace 似乎已经建成真实的生产基础设施，并拥有足够的需求势头来支撑继续融资。
              最重要的负面判断是：公开披露仍未达到经审计收入、毛利率、实际定价、客户集中度、积压订单转化率和现金跑道的程度。在公司提供这些数据前，投资逻辑更多依赖战略叙事和产业定位， 而不是经过验证的财务表现。
            claimRefs:
              - CI002
