      - number: '3.3'
        title: 在相邻玩家压低成本曲线前，业务韧性取决于合同
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 的护城河看起来仍偏产业化，而非商业化。Series C 融资和 IPO 辅导说明它有能力继续留在牌桌上，但这些资本信号不能替代已披露的定价、客户积压或续约证据。
              NewSpaceEconomy 认为，Guowang 和 Qianfan 需要反复发射以填充规划中的轨道壳层，发射服务商也因此成为通信供应链的一部分；该文还称，截至 2026 年 6 月 1 日，
              尽管多个项目已在飞行或测试，中国运营商仍未证明能常态化复用轨道助推器。因此，GalaxySpace 尚未享受国内已验证的低成本发射护城河，而国家支持的星座仍可凭政策支持和发射优先级竞争。
              目前最站得住脚的切口是面向主权客户的集成能力和制造准备度，而不是已验证的服务经济性或网络规模锁定。
