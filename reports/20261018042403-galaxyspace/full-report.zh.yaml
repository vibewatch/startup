  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 先界定市场边界，再谈 TAM
        blocks:
          - type: paragraph
            body: >-
              对 GalaxySpace 而言，可被证据支撑的市场边界窄于“全部商业航天”，但宽于单一零售宽带服务。公开证据指向 LEO 宽带星座、部署星座所需的卫星和终端，以及它们在偏远地区、
              应急响应、交通、海事场景和手机直连中承载的通信工作负载。政策表述同样重要：中国已明确将卫星互联网纳入国家基础设施规划，这也解释了为什么国家支持的星座项目和标准制定， 如今与短期消费者需求一样塑造着机会集合。就
              GalaxySpace 而言，现有证据更清楚地将其定位为这一生态中的卫星互联网解决方案提供商和制造供应商，而不是一家已充分披露单位经济性的 规模化终端服务运营商。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
              - CM011
      - number: '2.2'
        title: 用部署规模和产能视角衡量市场更可靠
        blocks:
          - type: paragraph
            body: >-
              当前资料池不足以支撑传统的收入 TAM/SAM/SOM 叠加框架，更稳妥的做法是保留多个运营规模视角。在最上层，中国预留的频谱和轨道位置容量远超实际部署量，说明监管层面的野心目前超过了真实吞吐能力。
              再往下一层，中国两大宽带星座合计计划部署超过 28,000 颗卫星，但目前入轨的只是一小部分；即便是 Qianfan 已披露的一期目标，也只是中间步骤，并非完整市场终局。GalaxySpace
              自身的产业布局进一步印证了这一谨慎判断：当前官方工厂披露支持年产 100-150 颗中型卫星，而管理层早先提出的年产 300-500 颗，如今更像历史愿景，而非当前可清算市场的产能数字。
              资本市场的兴趣真实存在，但公开变现证据仍落后于公开部署叙事。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM012
              - CM016
      - number: '2.3'
        title: 买方分层清晰，但采用节奏仍受约束
        blocks:
          - type: paragraph
            body: >-
              买方图谱至少分成两条不同路径：以 Guowang 为核心、由国家支持的主权连接；以及以 Qianfan 和合作国渠道为核心、商业导向的宽带与 IoT 扩张。这一区分很重要，因为政府、运营商、
              应急响应和出口流程的预算负责人、采购逻辑与时点差异很大。政策支持、标准化工作以及建设主权通信基础设施的战略诉求，为增长逻辑加分；但约束同样明显：频谱协调、碎片与轨道冲突管理、
              发射节奏、供应链强度，以及对本地合作伙伴或主权替代方案的现实需求，都可能拖慢市场开放。在许多地区，地面光纤和 5G 仍是现状替代方案，因此公开证据仍不足以单独识别 GalaxySpace 特有的
              SAM/SOM，或足够精确地证明合同支持的客户预算捕获，从而无法按收入口径评估市场。
            claimRefs:
              - CM006
              - CM011
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM014
      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 基础设施建设比需求变现更容易找到证据
            body: 政策支持、轨道预留、星座规划和工厂产能披露，让中国卫星互联网建设清晰可见；但公开证据仍未达到展示 GalaxySpace 特有合同积压、ARPU 或客户经济性的程度。
            calloutType: insight
            claimRefs:
              - CM002
              - CM012
              - CM015
          - type: callout
            title: 部署野心仍超过实际部署能力
            body: 机会在战略上可能很大，但商业化速度仍可能慢于星座计划标题所暗示的水平，因为发射节奏、标准、频谱协调、轨道安全和本地采购要求，都横亘在已申报的野心与实际收入之间。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争任务不止一个宽带试点
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 争夺的不只是一个零售宽带场景。公开报道描述了一套覆盖卫星制造、通信载荷、核心模块、终端、地面站和数据服务的一体化体系，使其更像主权或运营商基础设施供应商，
              而不是简单的连接转售商。这种广度很重要，因为其最清晰的海外证据仍是合作和试点信号，而非已披露的规模化服务业务：Xinhua 报道了手机直连卫星演示，以及与 True Corporation 签署的泰国
              MoU；EqualOcean 则称 2026 年 9 月的老挝试验只是技术演示，未披露商业服务上线、客户合同或推广时间表。实际上，直接替代方案是国家支持的中国星座；现有标杆是已经规模化 的 Starlink
              网络；对许多主权买方而言，替代路径仍是本地电信集成、航天器交付和培训组成的项目制方案，而非持续在线的商业宽带订阅。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP011
