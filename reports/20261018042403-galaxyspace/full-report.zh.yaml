      - number: '3.2'
        title: 当前规模喜忧参半：制造能力可信，但已披露的星座规模有限
        blocks:
          - type: paragraph
            body: >-
              按已披露规模看，GalaxySpace 介于概念阶段和全球既有巨头之间。EqualOcean 称，截至 2026 年 8 月下旬，公司已在通信、遥感及其他应用领域发射 49 颗自主研发卫星； 但 Jonathan
              McDowell 的 Yinhe 统计页面显示，截至 2026 年 10 月 15 日，名为 Yinhe 的宽带星座仅发射 8 颗、其中 7 颗在工作。因此，通信互联网资产基础明显小于公司卫星总数。
              公开报道还显示，公司正围绕这一较小基础推进产业化：南通称其智能工厂年产 100-150 颗中型卫星、可同时生产超过 30 颗；PDNews 称 GalaxySpace 自 2025 年以来发射了超过 20
              颗自研卫星。 这一画像使 GalaxySpace 比纯转售商更垂直整合，但仍远落后于 Starlink 已披露的轨道规模，也受制于中国发射生态支持重复部署的速度。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP011
