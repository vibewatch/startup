      - number: '6.2'
        title: 采用证据真实存在，但仍以基础设施为先
        blocks:
          - type: paragraph
            body: >
              本章的采用证据更多体现为部署活动和技术验证，而非已披露的客户经济性。Mobile World Live 报道，PCCW/GalaxySpace 测试达到
              100Mb/s，并支持不中断的卫星互联网视频通话；这是有意义的技术证据，但仍是验证里程碑，而非续约证据。 Global Times 另报道称，GalaxySpace 自 2025 年以来发射了超过 20
              颗自研卫星；NETDA 称南通智能工厂年产能为 100-150 颗中型卫星，且已将超过 20 颗本地制造卫星送入稳定轨道。 这些来源证明了运营节奏和交付能力，但不能直接转化为活跃客户数、利用率或合同金额指标。

              MERICS、NewSpace Index 和 China Economic Net/Xinhua 提供的独立背景进一步说明，中国更广泛的卫星互联网市场仍在建设使用规模和服务准备度。MERICS 称，2024
              年中国各类卫星通信服务用户合计 300 万，目标到 2030 年达到 1,000 万； NewSpace Index 显示，相邻的 Qianfan/Thousand Sails
              星座仍以发射卫星数量和初步商业服务能力衡量采用情况。China Economic Net/Xinhua 关于 Spacesail 2026 年 6 月直连手机试验的报道，同样聚焦于技术里程碑和 200
              颗卫星的星座数量。 整体模式是一致的：该市场的公开证据仍由基础设施和试点驱动，因此 GalaxySpace 的采用轨迹可见，但成熟的客户 KPI 披露仍不足以让人看清这条轨迹。
