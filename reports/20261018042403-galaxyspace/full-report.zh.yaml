  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开估值能否获得支撑，取决于工业化进展能否转化为已披露的经济数据和可融资的市场结构。
    data:
      nodes:
        - id: scale
          label: 工业化规模
          detail: 截至 2026 年 1 月已发射 40+ 颗卫星；据报道，南通智能工厂年产 100-150 颗卫星。
        - id: financing
          label: 融资信号
          detail: 据报道，Series C 于 2026 年 2 月完成，融资后估值约为 RMB 32b。
        - id: ipo
          label: IPO 路径
          detail: 2026 年 3 月开始接受华泰联合的 A 股辅导。
        - id: comp
          label: 公开可比公司映射
          detail: AST SpaceMobile 已达到一定规模交易，但 Hold 共识、空头持仓高且盈利为负。
        - id: opacity
          label: 披露不透明
          detail: 没有具体的公开收入披露；融资所得和优先权条款仍未公开。
        - id: market-risk
          label: 行业执行风险
          detail: 中国 LEO 申报目标仍超过已部署基础设施。
        - id: recommendation
          label: 建议：research-more / stretched
          detail: 在没有 IPO 级经济数据和条款前，不要支付高于最新披露估值的价格。
      edges:
        - from: scale
          to: financing
          label: 支撑可信度
        - from: financing
          to: ipo
          label: 保持路径开放
        - from: comp
          to: recommendation
          label: 增加估值波动
        - from: opacity
          to: recommendation
          label: 阻碍形成确定判断
        - from: market-risk
          to: recommendation
          label: 抬高下行风险
        - from: ipo
          to: recommendation
          label: 需要更完整披露
    approximationNotes: 该流程图为定性分析，并刻意不采用数字，因为公开证据不足以支持精确的内在价值估计。
    claimRefs:
