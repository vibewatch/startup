            body: >-
              现有公开证据将 GalaxySpace 描述为卫星制造商和卫星互联网运营商，业务范围从通信载荷、核心模块延伸到用户终端、地面站建设和卫星数据服务。
              尽调因此应从单一卫星平台或载荷供应商，转向更完整的系统方案：LEO 宽带网络、终端层和支撑运营栈。公开产品描述部分来自公司自身，因此最可靠的结论不是商业服务已完全验证，
              而是公司已形成一个连通星座硬件、用户终端和支撑服务的地面 / 数据能力的完整产品面。
