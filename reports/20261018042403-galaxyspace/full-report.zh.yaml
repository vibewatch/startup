  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 已披露客户面以机构和渠道为主
        blocks:
          - type: paragraph
            body: >
              现有证据表明，GalaxySpace 面向机构项目和渠道主导的连接机会销售，而非披露一批广泛的具名企业客户。Caixin 的 IPO
              辅导报道称，公司业务范围包括卫星通信服务、微型卫星制造、地面站建设与运营以及卫星数据服务， 说明买方和付款方不止一种，而非单一硬件 SKU。MERICS 提供了最清晰的具名机构证据：其称 Guowang
              最新一批卫星由 GalaxySpace 设计和制造，由此可见，国家支持的星座项目是当前生产工作中最具体的公开交易对手之一。

              资料池中唯一清晰披露的商业进入市场证据，是与 PCCW Global 的关系。Mobile World Live 称，PCCW 在香港安装了 GalaxySpace 的首个测试网关站，双方于 2024 年 9
              月同意向香港及其他国际市场的客户提供高速 LEO 连接服务。 这显示 GalaxySpace 最可见的扩张路径是由运营商主导分销，而不是直接披露大量具名终端客户。在这组来源中，GalaxySpace
              更像基础设施供应商和电信赋能伙伴，而不是已经公布多元化经常性终端客户名单的公司。
