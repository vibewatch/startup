  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与已披露进展
        blocks:
          - type: paragraph
            body: >-
              现有来源支持一种硬件加服务的混合收入模式，而非单一的纯制造业务。Caixin 的 IPO 辅导报道称，GalaxySpace 的业务范围包括卫星移动通信终端制造、卫星通信服务、微型卫星生产，
              以及新近开展的地面站建设、运营和卫星数据服务。China Daily 另将公司描述为卫星互联网解决方案提供商和卫星制造商；SpaceBandits 则将其定位为宽带卫星量产商，并称公司已转向为国家星座供货。
              这种组合在财务上很关键，因为它至少意味着两条不同的收入确认路径：卫星生产按硬件里程碑或交付确认收入；通信、地面基础设施或数据产品则按服务确认收入。
              目前缺失的是各业务线的实际收入构成。现有来源均未披露分业务收入、合同积压规模、已确认收入主要来自一次性硬件交付还是经常性服务，也未说明出口合作是否已从试点和备忘录进入可开票项目。
              因此，公开进展主要通过运营里程碑和合作活动体现，而非通过已披露的商业产出体现。
