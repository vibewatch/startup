              GalaxySpace 当前的风险堆栈主要由资本市场执行、发射与部署瓶颈、频谱与轨道协调风险主导，而不只是技术是否存在的风险。公开来源已足以证明，公司不再停留在 PPT 阶段：IPO 辅导正在进行，
