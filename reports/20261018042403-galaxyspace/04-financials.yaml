  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-quality
      missingEvidence: Audited 2024-2026 revenue, revenue mix by hardware versus services, backlog, and revenue-recognition policy.
      whyItMatters: Without realized revenue and mix, investors cannot test whether capacity and partnership claims convert into durable, high-quality sales.
      diligencePath: Request audited financial statements, customer-level revenue bridge, backlog schedule, and revenue-recognition memo from management.
      relatedQuestionRefs: [QI001, QI002, QI005, QI008]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: blocking
      topic: runway
      missingEvidence: Cash on hand, monthly burn, debt or project-finance obligations, covenant profile, and use of proceeds from the February 2026 financing.
      whyItMatters: Capital adequacy cannot be underwritten from valuation and IPO-process headlines alone.
      diligencePath: Request cash waterfall, debt schedule, board-approved budget, and 18-24 month financing plan including downside case.
      relatedQuestionRefs: [QI007, QI009]
      relatedTableRefs: [TI003]
