company:
  name: GalaxySpace (银河航天)
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a hardware-led, manufacturing-heavy revenue model that is
    now expanding into services, but it still does not expose audited revenue, gross
    margin, or cash runway. The clearest disclosed financial signals are production-scale
    claims, a February 2026 Series C round at roughly RMB32 billion post-money
    valuation, and a March 2026 A-share IPO counseling filing, which together suggest
    sizable capital needs but not yet underwritable unit economics.
sections:
  - id: revenue-model
    title: Revenue model and disclosed traction
    body: >-
      The retained sources support a mixed hardware-plus-services revenue model rather
      than a single pure-manufacturing business. Caixin's IPO-counseling coverage says
      GalaxySpace's business scope includes satellite mobile communication terminal
      manufacturing, satellite communication services, microsatellite production, and
      newer ground-station construction, operations, and satellite data services.
      China Daily separately describes the company as both a satellite internet solution
      provider and a satellite manufacturer, while SpaceBandits frames the company as a
      mass producer of broadband satellites that has shifted toward supplying state
      constellations. That mix matters financially because it implies at least two
      different revenue-recognition paths: hardware-style milestone or delivery revenue
      on satellite production, and service-style revenue on communications, ground
      infrastructure, or data products. What remains missing is the actual mix across
      those lines. None of the retained sources disclose current revenue by stream, the
      size of any contracted backlog, whether recognized revenue is mostly one-time
      hardware delivery or recurring service, or whether export partnerships have moved
      beyond pilots and memoranda into billable programs. Public traction is therefore
      visible mainly through operating milestones and partnership activity, not through
      disclosed commercial yield.
    claimRefs: [CI001, CI002, CI003, CI007, CI008, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure
    title: Cost structure and unit-economics proxies
    body: >-
      The strongest public unit-economics evidence is operational rather than financial.
      Nantong NETDA says the smart factory can run more than 30 satellites in parallel,
      produce roughly two satellites every five days, and sustain annual output of
      100-150 medium satellites, while Xinhua independently reports a three-day
      production cadence, five days for two satellites' assembly and test, 150-satellite
      annual medium-class capacity, and 22 medium satellites shipped in 2025. Those are
      meaningful efficiency proxies because they show GalaxySpace is trying to amortize
      tooling, labor, and qualification overhead across a batch-production base instead
      of bespoke one-off spacecraft. The industry context from New Space Economy is that
      modern LEO manufacturing economics favor volume production, automated test flows,
      and commercial component sourcing, which is directionally consistent with
      GalaxySpace's public manufacturing story. At the same time, the retained record
      still provides no public realized ASP, gross margin, service gross margin, launch
      pass-through policy, customer-acquisition cost, or payback period. The conclusion
      is not that unit economics are bad; it is that outside investors can currently see
      throughput claims but not the conversion from throughput into contribution margin.
    claimRefs: [CI004, CI005, CI006, CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: capital-needs
    title: Capital needs and financing dependency
    body: >-
      The 2026 financing and listing signals imply that GalaxySpace still needs external
      capital to scale, but they do not show how far existing capital goes. People's
      Daily says GalaxySpace completed a February 2026 Series C financing round at
      approximately RMB32 billion post-money valuation, and both People's Daily and
      Caixin report that the company entered A-share IPO counseling in March 2026 with
      Huatai United Securities as counseling institution. That combination is consistent
      with a capital-intensive industrial company preparing for a broader financing path
      rather than operating from clearly disclosed cash-generation self-sufficiency.
      SpaceBandits adds the most direct adverse framing in the retained pool: GalaxySpace
      is now supplying into a state-allocated constellation order book, its headline
      unicorn valuation dates from earlier funding vintages, and there are still no
      public financial statements. Because public sources do not disclose cash on hand,
      burn, debt facilities, project-finance obligations, or use of proceeds from the
      February round, the current evidence supports financing dependency as a diligence
      question, not as a closed-form runway calculation.
    claimRefs: [CI009, CI010, CI011, CI013]
  - id: verdict
    title: Financial verdict and diligence blockers
    body: >-
      Financially, GalaxySpace looks more like a scale-sensitive industrial platform than
      a software-style recurring-revenue story. Public evidence supports meaningful
      manufacturing ambition, a widening product-to-services surface, and access to fresh
      equity plus an IPO process, but not the core underwriting inputs needed to defend
      revenue quality or margin path at valuation. The most supportable positive read is
      that GalaxySpace appears to have built real production infrastructure and enough
      demand momentum to justify continued financing. The most important negative read is
      that public disclosure still stops short of audited revenue, gross margin, pricing
      realization, customer concentration, backlog conversion, and cash runway. Until the
      company provides those data, the investment case depends more on strategic narrative
      and industrial positioning than on verified financial performance.
    claimRefs: [CI002, CI006, CI011, CI012, CI013, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Current public status / value
      - Revenue quality
      - Diligence ask
    rows:
      - ["Satellite manufacturing", "Batch-produced broadband / SAR / constellation spacecraft", "Active; production capacity and deliveries discussed publicly, but no revenue amount disclosed", "Likely milestone or delivery based; mix of pilot and scaled orders unclear", "Provide 2024-2026 revenue by spacecraft program, backlog, acceptance milestones, and cancellations"]
      - ["Satellite communication services", "Connectivity solutions / satellite communication services", "Business scope disclosed; no public service revenue or pricing disclosed", "Potentially recurring, but no customer count, ARPU, or renewal data", "Provide paying customers, contract terms, usage basis, and recurring vs one-time revenue split"]
      - ["Ground-station construction and operations", "Build / operate customer ground infrastructure", "Business scope disclosed; no public contract values disclosed", "Could be project based; margin profile unknown", "Provide signed contracts, build-versus-operate mix, and gross margin by project"]
      - ["Satellite data services", "Remote sensing or related downstream data products", "Business scope disclosed; no public revenue or pricing disclosed", "Potential software-like or service-like revenue, but evidence is insufficient", "Provide revenue contribution, pricing basis, and repeat-purchase behavior"]
    notes: >-
      Public sources establish the presence of these lines but not current revenue mix,
      pricing realization, or recognition timing; null-style uncertainty is expressed in
      the text cells instead of numeric blanks because no authoritative amounts were
      retained in the assigned pool.
    claimRefs: [CI001, CI002, CI003]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / revenue line
      - Public price / unit / contract model
      - List vs realized
      - Discounts / unknowns
      - Source
    rows:
      - ["Broadband or constellation satellite supply", "Per-satellite economics undisclosed; public record shows batch-production narrative and state-constellation supply", "Realized pricing unavailable", "No ASP, warranty, launch pass-through, or payment-timing disclosure", "SpaceBandits; Xinhua; NETDA"]
      - ["International partnership / deployment programs", "MOUs and trial activity disclosed; no contract value or committed volume disclosed", "Realized pricing unavailable", "Unknown whether partnerships have converted into paid production or service revenue", "China Daily; Xinhua"]
      - ["Satellite communication services", "Service line disclosed, but tariff / subscription / usage basis not public", "List pricing unavailable", "No public customer count, ARPU, or churn / renewal data", "Caixin; China Daily"]
      - ["Ground-station and data services", "Project or service basis implied by business scope; no public price sheet", "Realized pricing unavailable", "No public margin, implementation-cost, or contract-length data", "Caixin"]
    notes: >-
      This table distinguishes disclosed monetization routes from undisclosed price points.
      The retained sources do not provide list prices, realized ASPs, discounts, or
      revenue-recognition policy.
    claimRefs: [CI001, CI002, CI007, CI008, CI013, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Satellites producible simultaneously", "More than 30 satellites", "High", "Proxy for factory throughput and working-capital intensity", "Verify whether this is installed capacity, staffed capacity, or current utilized capacity"]
      - ["Assembly cadence", "Average of two satellites every five days", "High", "Proxy for labor productivity and production-line utilization", "Provide actual monthly throughput by line for the last 12 months"]
      - ["Annual medium-satellite capacity", "100-150 satellites annually", "High", "Upper bound for revenue scale if orders and realization support it", "Provide committed orders and expected utilization by customer program"]
      - ["2025 factory output", "22 medium satellites shipped in 2025", "High", "Helps distinguish capacity claims from realized output", "Provide shipments, recognized revenue, and gross profit tied to those deliveries"]
      - ["Development cycle improvement", "80% shorter than traditional methods", "High", "Suggests faster asset turns if demand is real", "Show baseline definition, measurement window, and the impact on unit cost"]
      - ["Post-money valuation", "Approximately RMB32 billion after February 2026 Series C", "Medium", "Shows fresh external financing benchmark versus absent operating disclosure", "Provide round size, cash proceeds net of expenses, and investor rights"]
      - ["Realized satellite ASP", null, "Low", "Needed to translate capacity into revenue", "Provide average selling price by satellite class and by contract type"]
      - ["Gross margin", null, "Low", "Central to underwriting manufacturing quality and scale benefits", "Provide blended and segment gross margin with launch or service pass-through treatment"]
      - ["CAC / payback / sales cycle", null, "Low", "Determines whether service expansion can fund itself", "Provide customer-acquisition channel mix, cycle length, and payback by product line"]
      - ["Cash runway / debt obligations", null, "Low", "Determines financing dependency and next-round trigger", "Provide cash balance, monthly burn, debt / project-finance obligations, and covenant profile"]
    notes: >-
      Public evidence is strongest on capacity proxies and weakest on monetization and cash.
      Null values here mean the assigned retained sources do not disclose the metric.
    claimRefs: [CI004, CI005, CI009, CI010, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a hardware-first bridge from satellite design and batch
      production into constellation orders and service lines, but recognized revenue and
      gross profit remain undisclosed.
    data:
      nodes:
        - id: design
          label: Satellite and payload R&D
          note: Broadband and constellation platform development
        - id: factory
          label: Batch production
          value: 100-150 medium satellites annually
          note: Public capacity claim
        - id: validation
          label: Launch and in-orbit validation
          value: 22 medium satellites shipped in 2025
          note: Public realized-output proxy
        - id: orders
          label: Constellation and partner orders
          note: Core orders claimed; contract values undisclosed
        - id: services
          label: Communications, ground-station, and data services
          note: Revenue lines disclosed; pricing undisclosed
        - id: revenue
          label: Recognized revenue
          note: Mix, timing, and recurring share unavailable
        - id: gross-profit
          label: Gross profit and reinvestment capacity
          note: Depends on utilization, pricing, and service margin
      edges:
        - from: design
          to: factory
        - from: factory
          to: validation
        - from: validation
          to: orders
        - from: orders
          to: revenue
        - from: factory
          to: services
        - from: services
          to: revenue
        - from: revenue
          to: gross-profit
    approximationNotes: >-
      This is a conceptual evidence-backed flow rather than a numeric waterfall because
      the retained sources do not disclose realized pricing, backlog conversion, or gross
      margin.
    claimRefs: [CI001, CI004, CI005, CI007, CI013]
