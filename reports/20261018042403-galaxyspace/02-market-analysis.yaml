company:
  name: "GalaxySpace (银河航天)"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    GalaxySpace is operating into a Chinese satellite-internet buildout that is strategically important and visibly scaling, but the cleanest public evidence still measures deployment ambition, factory throughput, and policy support more clearly than contract-backed service demand. The market is therefore best bounded as sovereign and commercial LEO connectivity infrastructure rather than as a single generic broadband TAM, with adoption gated by regulation, launch cadence, spectrum coordination, and proof that constellation capacity converts into durable budgets.
sections:
  - id: "market-boundary"
    title: "Market boundary comes before any TAM claim"
    body: >-
      The supportable market boundary for GalaxySpace is narrower than "all commercial space" and broader than one retail broadband service. Public evidence points to LEO broadband constellations, the satellites and terminals needed to deploy them, and the communications workloads they support in remote regions, emergency response, transport, marine use cases, and direct mobile connectivity. Policy language also matters because China has explicitly elevated satellite internet into national infrastructure planning, which helps explain why state-backed constellation programs and standard-setting now shape the opportunity set as much as near-term consumer demand does. For GalaxySpace specifically, the accessible evidence still positions the company more clearly as a satellite internet solutions provider and manufacturing supplier into this ecosystem than as a fully disclosed scaled end-service operator with public unit economics.
    claimRefs: ["CM001", "CM002", "CM003", "CM007", "CM011"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses"
    title: "Sizing is better expressed through deployment and capacity lenses"
    body: >-
      A conventional revenue TAM/SAM/SOM stack is not well supported by the current source pool, so the cleaner approach is to preserve multiple operational sizing lenses. At the top end, China has reserved far more spectrum and orbital position capacity than it has physically deployed, which shows that regulatory ambition currently exceeds actual throughput. At the next layer down, the two main Chinese broadband constellations together represent more than 28,000 planned satellites, but only a small fraction is on orbit today, and even Qianfan's disclosed phase-one target remains an intermediate step rather than a full-market end state. GalaxySpace's own industrial footprint reinforces this caution: current official factory disclosure supports 100-150 medium satellites of annual output, while an earlier management ambition of 300-500 satellites a year reads today as a historical aspiration rather than a current market-clearing capacity number. Capital-market appetite is real, but public monetization evidence still trails public deployment rhetoric.
    claimRefs: ["CM003", "CM004", "CM005", "CM008", "CM009", "CM010", "CM012", "CM016"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-drivers-constraints"
    title: "Buyer segmentation is clear, but adoption timing is still constrained"
    body: >-
      The buyer map splits into at least two distinct tracks: state-backed sovereign connectivity anchored by Guowang, and commercially oriented broadband and IoT expansion anchored by Qianfan and partner-country channels. That distinction matters because budget owners, procurement logic, and timing differ sharply across government, carrier, emergency-response, and export workflows. The growth case is helped by policy support, standardization work, and the strategic desire for sovereign communications infrastructure, but the constraints are equally material: spectrum coordination, debris and orbital-conflict management, launch cadence, supply-chain intensity, and the practical need for local partners or sovereign alternatives can all slow market opening. Terrestrial fiber and 5G remain status-quo substitutes in many geographies, so public evidence still does not isolate a GalaxySpace-specific SAM/SOM or contract-backed customer budget capture with enough precision to underwrite the market on a revenue basis.
    claimRefs: ["CM006", "CM011", "CM013", "CM014", "CM015"]
    tableRefs: ["TM003"]
