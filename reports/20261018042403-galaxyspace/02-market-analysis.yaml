callouts:
  - calloutType: "insight"
    title: "Infrastructure buildout is easier to evidence than demand monetization"
    body: >-
      Policy support, orbital reservations, constellation plans, and factory-capacity disclosures make the Chinese satellite-internet buildout visible, but public evidence still stops short of showing GalaxySpace-specific contract backlog, ARPU, or customer economics.
    claimRefs: ["CM002", "CM012", "CM015"]
  - calloutType: "risk"
    title: "Deployment ambition still outruns deployed capacity"
    body: >-
      The opportunity can be strategically large while still being commercially slower than headline constellation plans imply, because launch cadence, standards, spectrum coordination, orbital safety, and local-procurement requirements all stand between filed ambition and realized revenue.
    claimRefs: ["CM011", "CM012", "CM013", "CM014"]
