    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and reporting perimeter
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace positions itself as a leading Chinese provider of satellite Internet solutions and a satellite
              manufacturer, with products spanning connectivity solutions, payloads, platforms, and satellite components
              [CO001][CO007]. Reuters describes the company as Beijing-based, while official and local-government
              materials point to operating and manufacturing capabilities in Beijing, Xi'an, Chengdu, and Nantong
              [CO003][CO006]. The one caution is legal-entity clarity: GalaxySpace's English site says the company was
              founded in April 2018, but IPO-counseling coverage identifies the current Beijing legal entity as founded
              on June 27, 2019 with RMB 44.381908 million of registered capital [CO002][CO003]. For diligence, the
              safest read is that the business narrative begins in 2018 while the currently disclosed reporting
              perimeter is the 2019 legal entity, which still needs reconciliation across history, ownership records,
              and any group-level operating metrics [CO002][CO003].
            claimRefs:
