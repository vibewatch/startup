      - number: '1.4'
        title: Milestones and current operating stage
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company moving from technical demonstration toward industrialization rather
              than one already proven on commercial metrics. GalaxySpace says it launched its first satellite in January
              2020, six mass-produced LEO broadband satellites in March 2022, and the Lingxi-03 stackable flat-panel
              satellite in July 2023 [CO008][CO009][CO010]. By 2026, the story had shifted toward scaled production,
              fresh funding, and continued technology development: public sources cite the February financing, March IPO
              counseling, Nantong factory output of 100-150 medium-sized satellites per year, and the September 2026
              PEGA-SUS1 demonstration launch [CO006][CO011][CO012][CO013]. The operating stage is therefore best
              described as late private / growth industrialization: technical milestones and manufacturing ambition are
              real, but commercial traction and financial durability are still substantially underdisclosed
              [CO006][CO008][CO009][CO010][CO011][CO012][CO013][CO015].
