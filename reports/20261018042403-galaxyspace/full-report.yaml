              - CE009
          - type: callout
            title: Public proof still skews toward demos, not operating metrics
            body: >-
              The evidence set shows meaningful technical demonstrations and factory capacity claims, but it still lacks
              independent uptime, security, deployment-depth, and contract-readiness evidence needed to underwrite
              scaled commercial service.
            calloutType: risk
            claimRefs:
              - CE006
              - CE007
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Disclosed customer surfaces skew institutional and channel-led
        blocks:
          - type: paragraph
            body: >
              The retained evidence suggests GalaxySpace is selling into a mix of institutional programs and
              channel-mediated connectivity opportunities rather than disclosing a broad base of named enterprise
              customers. Caixin's IPO-counseling coverage says the company's business scope includes satellite
              communication services, microsatellite manufacturing, ground-station construction and operation, and
              satellite data services, which points to multiple buyer and payer types instead of a single hardware SKU.
              MERICS adds the clearest named institutional proof: it says Guowang's latest batch was designed and built
              by GalaxySpace, indicating that a state-backed constellation program is one of the most concrete public
              counterparties tied to current production work.


              The only clearly disclosed commercial route-to-market evidence in this pool is the PCCW Global
              relationship. Mobile World Live says PCCW installed GalaxySpace's first testing gateway station in Hong
              Kong and that the two parties agreed in September 2024 to deliver high-speed LEO connectivity services to
              customers in Hong Kong and other international markets. That matters because it shows GalaxySpace's most
              visible expansion path is operator-led distribution rather than direct disclosure of many named end
              customers. Across this source set, GalaxySpace looks more like an infrastructure supplier and
              telecom-enablement partner than a company already publishing a diversified roster of recurring end-user
              accounts.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU014
      - number: '6.2'
        title: Adoption proof is real but still infrastructure-first
        blocks:
          - type: paragraph
            body: >
              The chapter's adoption evidence is stronger on deployment activity and technical verification than on
              disclosed customer economics. Mobile World Live reports that the PCCW/GalaxySpace tests reached 100Mb/s
              and supported uninterrupted satellite internet video calls, which is meaningful technical proof but still
              a verification milestone rather than renewal evidence. Global Times separately reports that GalaxySpace
              launched more than 20 self-developed satellites since 2025, while NETDA says the Nantong smart factory can
              produce 100-150 medium-sized satellites annually and has already put more than 20 locally manufactured
              satellites into stable orbit. Together, those sources show operating cadence and delivery capacity, but
              they do not convert directly into active-customer, utilization, or contract-value metrics.


              Independent context from MERICS, NewSpace Index, and China Economic Net/Xinhua reinforces that the broader
              Chinese satellite-internet market is still building out usage and service readiness. MERICS says China had
              three million satellite-communication users across all offerings in 2024 and is targeting ten million by
              2030, while NewSpace Index shows the adjacent Qianfan/Thousand Sails constellation still framing adoption
              in terms of satellites launched and initial commercial-service capability. China Economic Net/Xinhua's
              June 2026 coverage of Spacesail's direct-to-cell trial similarly centers on a technical milestone and a
              200-satellite constellation count. The pattern is consistent: public proof in this market remains
              infrastructure-led and pilot-heavy, so GalaxySpace's adoption trajectory is visible, but not yet legible
              through mature customer KPI disclosure.
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU006
              - CU014
      - number: '6.3'
        title: Durability, expansion economics, and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >
              The weakest part of the public customer story is durability. None of the retained sources discloses NRR,
              GRR, churn, contract duration, renewal rates, backlog conversion, or contract values for GalaxySpace's
              reported counterparties. That absence is especially important because the available proof clusters around
              a state-backed constellation batch, a telecom partner verification, and broad business-scope language
              rather than a long list of production deployments. In practical diligence terms, the evidence demonstrates
              that GalaxySpace is in commercially relevant workflows, but not that it has durable recurring customer
              economics across a diversified base.


              Adverse and cautionary sources also suggest concentration and scaling risk. MERICS says SpaceSail and
              Guowang remain far from their constellation targets and notes that many private ventures are still in
              early stages with intended use cases that are not always clear. SatNews goes further by arguing that
              China's current commercial launch infrastructure can support only a tiny fraction of the orbital paper
              fleet it has reserved. Even if those sources are sector-wide rather than GalaxySpace-specific, they matter
              because GalaxySpace's most visible counterparties and expansion paths are tied to the same ecosystem.
              Until the company discloses named production customers, contract economics, and concentration data, public
              evidence supports a view of credible demand access but weak durability underwriting.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace's current risk stack is led by capital-markets execution, launch and deployment bottlenecks,
              and spectrum-orbit coordination risk rather than by technology existence risk alone. Public sources are
              strong enough to show that the company is no longer at the slideware stage: IPO counseling is live, the
              Nantong plant is described as a high-volume manufacturing site, and recent launch activity is materially
              above the prior period. What remains unproven in public, however, is the translation from manufacturing
              progress into financeable, licensable, and repeatable commercial service. That asymmetry keeps residual
              exposure high even before asking whether the current valuation can absorb schedule slips or policy
              friction.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR009
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR009
              - CR011
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory, disclosure, and governance risk
        blocks:
          - type: paragraph
            body: >-
              The most underwritten public milestone is the A-share IPO counseling process, not a prospectus. Caixin and
              Global Times both point to the March 30 counseling filing and Huatai United's role, while GalaxySpace's
              disclosed February Series C valuation of roughly CNY 32 billion raises the bar for proving durable
              economics. At the same time, Caixin reports that Xu Min still controls 72.87% of voting rights after
              accounting for special voting arrangements, which makes founder alignment a strength only if minority
              protections, related-party boundaries, and board controls hold up in formal listing documents. Until
              audited revenue, margin, proceeds, and use-of-cash disclosures appear, regulatory progress and financing
              progress should not be treated as equivalent to underwritten business quality.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR011
              - CR012
      - number: '7.3'
        title: Operational, launch, and ecosystem dependency risk
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace's disclosed operating strength is its factory system, not its control over the launch and
              orbital environment that must carry a broadband constellation at scale. The Nantong facility is described
              as annual 100-150 satellite capacity and as having more than 20 spacecraft already launched, but Satellite
              Today still describes manifests as "really, really busy" and "a situation of scarcity" for years to come.
              Orbital Radar separately says both Guowang and Qianfan depend on Chinese launch capacity scaling
              several-fold, while New Space Economy stresses that schedule delay is normal in reusable launch
              development because each testing stage reveals new failure modes. In other words, GalaxySpace can
              manufacture faster than the broader system may currently absorb, and state-backed demand can crowd out the
              flexibility available to a private operator.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Residual exposure, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The public mitigations visible today are mostly industrial-process controls: automation, digital
              scheduling, testing infrastructure, and protective measures inside the factory. Those are useful, but they
              do not by themselves close the most important residual risks, which sit in launch access, licensing and
              spectrum coordination, customer economics, and financing terms. For an investor, the cleanest thesis-break
              triggers are measurable: a missed or materially delayed IPO path, proof that launch scarcity is stretching
              constellation timelines, evidence that spectrum or interference rules can constrain service deployment, or
              failure to convert industrial output into contracted recurring demand. If those conditions emerge before
              audited economics do, the current valuation support becomes materially weaker.
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace now has enough public evidence to support a live financing and IPO-context discussion, but not
              enough to support a strong underwriting call. Independent reporting says the company completed a February
              2026 Series C round at an approximately RMB 32 billion post-money valuation and then entered A-share IPO
              counseling with Huatai United Securities in March 2026, which confirms that the company remains
              financeable and is trying to convert private-market momentum into a public-market process. At the same
              time, Xinhua states that the company has not disclosed specific revenue data, while Caixin reports a
              special-voting-rights structure that leaves founder Xu Min with 72.87% voting control. That combination
              supports a research-more recommendation and a stretched valuation stance: there is enough industrial proof
              and capital-market traction to keep the company investable, but not enough public financial disclosure or
              term transparency to justify paying through the latest disclosed mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Valuation context and comparable framing
        blocks:
          - type: paragraph
            body: >-
              The strongest positive public evidence is operational scale, not economic disclosure. Xinhua says
              GalaxySpace had launched more than 40 self-developed satellites by January 2026 and had formed annual
              low-cost capacity for 100 satellites, while the Nantong development-zone report says the smart factory
              maintains annual production of 100 to 150 medium-sized satellites with a development cycle 80% shorter
              than traditional methods. Those facts support a real industrialization story and make the February 2026
              valuation mark more credible than a concept-only space startup. However, the public-comp read-through
              still argues for discipline rather than enthusiasm. MarketBeat shows AST SpaceMobile at a $15.82 billion
              market capitalization on October 16, 2026, but still carrying a Hold consensus rating, 21.06% float short
              interest, and negative profitability. Stock Analysis shows the same company at just $611.94 million market
              cap on May 15, 2024, highlighting how violently direct-to-device satellite valuations can rerate as
              expectations change. Yahoo Finance adds an ISS Governance QualityScore of 10 for AST as of October 1,
              2026, which is a reminder that governance and execution discount rates remain material even after a
              company reaches public-market scale.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios, downside triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              A precise intrinsic valuation is not supportable from public evidence today, so the defensible framework
              is scenario analysis around the disclosed February 2026 post-money mark rather than a model-driven target.
              The base case is only around that latest private mark and only if IPO preparation converts into
              prospectus-grade disclosure on revenue, margins, backlog, and financing terms. The bull case requires
              evidence that the manufacturing footprint and satellite launches are translating into repeatable
              commercial revenue and not only into strategic or pilot programs. The bear case becomes more likely if
              commercialization evidence stays thin, if capital-market access weakens, or if sector execution proves
              slower than filing rhetoric suggests. SatNews' description of China's large ITU filing footprint versus a
              much smaller deployed base underscores why investors should not pay simply for constellation ambition. The
              last diligence mile is therefore straightforward: obtain audited financials, backlog and contract-quality
              evidence, detailed C-round proceeds and preference terms, and IPO-filing disclosures before treating the
              latest private mark as investable.
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Bottom line
            body: >-
              GalaxySpace looks financeable and operationally credible, but the public evidence still supports
              research-more rather than buy because current valuation support relies on a disclosed private mark and
              industrial milestones without matching public economics.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV013
              - CV014
          - type: callout
            title: What would invalidate the current base case
            body: >-
              A weak or delayed IPO process, investor-unfriendly financing terms, or prospectus-grade disclosures that
              reveal poor commercial conversion would likely push the supportable valuation below the latest disclosed
              private mark.
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV011
              - CV012
              - CV015
