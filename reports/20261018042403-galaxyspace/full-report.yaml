      - number: '1.3'
        title: Funding, valuation, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace completed a new financing round in February 2026 and then entered A-share IPO counseling on
              March 30, 2026 with Huatai United Securities, making 2026 a clear transition year from private financing
              to capital-markets preparation [CO011][CO012]. People's Daily puts the post-money valuation from that
              Series C round at roughly RMB 32 billion, but the public record in this worker pool still does not
              disclose exact round proceeds, cumulative capital raised, revenue, run-rate, ARR, or customer count with
              enough precision to support an underwritten KPI view [CO014][CO015]. Baiguan adds a useful counterweight:
              it argues 2026 is a peak year for pre-IPO monetization in China's commercial-space sector and that
              speculative enthusiasm is already outpacing proof of execution [CO016]. That backdrop does not invalidate
              GalaxySpace's financing momentum, but it does make disclosure quality a central diligence risk rather than
              an administrative follow-up [CO011][CO012][CO014][CO015][CO016].
