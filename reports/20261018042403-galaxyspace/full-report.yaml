          - type: callout
            title: Deployment ambition still outruns deployed capacity
            body: >-
              The opportunity can be strategically large while still being commercially slower than headline
              constellation plans imply, because launch cadence, standards, spectrum coordination, orbital safety, and
              local-procurement requirements all stand between filed ambition and realized revenue.
