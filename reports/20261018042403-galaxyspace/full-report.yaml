      - number: '5.3'
        title: Technical maturity has advanced, but service readiness still looks early
        blocks:
          - type: paragraph
            body: >-
              The 2025-2026 evidence set is stronger than a pure concept-stage story: public reporting says GalaxySpace
              has launched more than 20 self-developed satellites since 2025, has run vehicle-connectivity and
              drone-control demonstrations over its LEO network, and has already put a direct-to-smartphone-capable
              satellite into technical verification. Those are meaningful maturity signals. But they do not yet amount
              to proof of scaled, reliable commercial service. The broader Chinese LEO ecosystem is still early relative
              to its published ambition: Orbital Radar tracks only a small fraction of the satellites planned for
              Qianfan and Guowang, while sector reporting highlights launch-capacity and execution constraints. For
              GalaxySpace, that means product underwriting still depends on evidence that is not public here: awarded
              constellation share, terminal economics, uptime/SLA disclosure, customer deployment depth, and
              trust/security controls.
