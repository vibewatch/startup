  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public valuation support depends on whether industrial progress can be converted into disclosed economics and
      financeable market structure.
    data:
      nodes:
        - id: scale
          label: Industrial scale
          detail: 40+ satellites launched by Jan-2026; Nantong smart factory reported at 100-150 satellites annual production.
        - id: financing
          label: Financing signal
          detail: Series C reportedly closed in Feb-2026 at ~RMB 32b post-money.
        - id: ipo
          label: IPO path
          detail: A-share counseling with Huatai United began in Mar-2026.
        - id: comp
          label: Public-comp read-through
          detail: AST SpaceMobile trades at scale, but with Hold consensus, high short interest, and negative profitability.
        - id: opacity
          label: Disclosure opacity
          detail: No specific public revenue disclosure; financing proceeds and preference terms are still not public.
        - id: market-risk
          label: Sector execution risk
          detail: Chinese LEO filing ambition still exceeds deployed infrastructure.
        - id: recommendation
          label: 'Recommendation: research-more / stretched'
          detail: Do not pay above the latest disclosed mark without IPO-grade economics and terms.
      edges:
        - from: scale
          to: financing
          label: supports credibility
        - from: financing
          to: ipo
          label: keeps path open
        - from: comp
          to: recommendation
          label: adds valuation volatility
        - from: opacity
          to: recommendation
          label: blocks conviction
        - from: market-risk
          to: recommendation
          label: raises downside risk
        - from: ipo
          to: recommendation
          label: needs fuller disclosure
    approximationNotes: >-
      Flow is qualitative and intentionally non-numeric because public evidence does not support a precise intrinsic
      valuation.
