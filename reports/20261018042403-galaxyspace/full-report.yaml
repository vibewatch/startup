      - number: '5.2'
        title: Architecture and industrialization are the core differentiation claims
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace's public technical story centers on millimeter-wave broadband links, phased-array terminals,
              and manufacturing scale. Company-derived materials describe Q/V-band feeder links, Ka-band user terminals,
              and a Q/V-band demonstrator satellite, while independent and quasi-independent reporting adds evidence of
              a seven-satellite experimental constellation, direct-to-smartphone testing, and a Nantong factory designed
              for repeatable production rather than artisanal one-off builds. The most credible differentiation signal
              is therefore not a single benchmark number but the combination of payload design, terminal work, digital
              factory tooling, and a growing supplier base. Even so, public evidence does not expose software control
              layers, detailed interface documentation, or independent reliability data for these systems, so the
              architecture should be treated as partially verified rather than fully documented.
