            title: Commercial proof still trails industrial readiness
            body: >-
              The public record still looks like pilots, MoUs, and industrial preparation. Without disclosed pricing,
              contract values, customer renewals, or a domestically proven low-cost launch base, incumbents and
              state-backed constellations can narrow differentiation quickly.
