  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed traction
        blocks:
          - type: paragraph
            body: >-
              The retained sources support a mixed hardware-plus-services revenue model rather than a single
              pure-manufacturing business. Caixin's IPO-counseling coverage says GalaxySpace's business scope includes
              satellite mobile communication terminal manufacturing, satellite communication services, microsatellite
              production, and newer ground-station construction, operations, and satellite data services. China Daily
              separately describes the company as both a satellite internet solution provider and a satellite
              manufacturer, while SpaceBandits frames the company as a mass producer of broadband satellites that has
              shifted toward supplying state constellations. That mix matters financially because it implies at least
              two different revenue-recognition paths: hardware-style milestone or delivery revenue on satellite
              production, and service-style revenue on communications, ground infrastructure, or data products. What
              remains missing is the actual mix across those lines. None of the retained sources disclose current
              revenue by stream, the size of any contracted backlog, whether recognized revenue is mostly one-time
              hardware delivery or recurring service, or whether export partnerships have moved beyond pilots and
              memoranda into billable programs. Public traction is therefore visible mainly through operating milestones
              and partnership activity, not through disclosed commercial yield.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
              - CI008
              - CI015
