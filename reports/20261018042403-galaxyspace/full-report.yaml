  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary comes before any TAM claim
        blocks:
          - type: paragraph
            body: >-
              The supportable market boundary for GalaxySpace is narrower than "all commercial space" and broader than
              one retail broadband service. Public evidence points to LEO broadband constellations, the satellites and
              terminals needed to deploy them, and the communications workloads they support in remote regions,
              emergency response, transport, marine use cases, and direct mobile connectivity. Policy language also
              matters because China has explicitly elevated satellite internet into national infrastructure planning,
              which helps explain why state-backed constellation programs and standard-setting now shape the opportunity
              set as much as near-term consumer demand does. For GalaxySpace specifically, the accessible evidence still
              positions the company more clearly as a satellite internet solutions provider and manufacturing supplier
              into this ecosystem than as a fully disclosed scaled end-service operator with public unit economics.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
              - CM011
      - number: '2.2'
        title: Sizing is better expressed through deployment and capacity lenses
        blocks:
          - type: paragraph
            body: >-
              A conventional revenue TAM/SAM/SOM stack is not well supported by the current source pool, so the cleaner
              approach is to preserve multiple operational sizing lenses. At the top end, China has reserved far more
              spectrum and orbital position capacity than it has physically deployed, which shows that regulatory
              ambition currently exceeds actual throughput. At the next layer down, the two main Chinese broadband
              constellations together represent more than 28,000 planned satellites, but only a small fraction is on
              orbit today, and even Qianfan's disclosed phase-one target remains an intermediate step rather than a
              full-market end state. GalaxySpace's own industrial footprint reinforces this caution: current official
              factory disclosure supports 100-150 medium satellites of annual output, while an earlier management
              ambition of 300-500 satellites a year reads today as a historical aspiration rather than a current
              market-clearing capacity number. Capital-market appetite is real, but public monetization evidence still
              trails public deployment rhetoric.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
              - CM016
          - type: figure
