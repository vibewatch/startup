        title: Leadership concentration and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public reporting paints GalaxySpace as founder-led and tightly controlled. Caixin and The Paper say Xu Min
              is the founder, chairman, and CEO, and that special voting arrangements leave him with 72.87% of voting
              power despite 22.04% direct and indirect share ownership [CO004]. Named technical leadership beyond the
              founder is thinner: The Paper cites model chief designer Hu Zhao on smart-factory productivity, but the
              assigned pool does not provide a full executive-bench or board roster [CO005]. That means the company has
              at least one visible technical operator, yet governance diligence still has to answer board composition,
              succession depth, and whether control rights meaningfully constrain outside investors as GalaxySpace
              approaches the public market [CO004][CO005].
