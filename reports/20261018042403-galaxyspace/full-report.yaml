        title: Exhibits
        blocks:
          - type: callout
            title: Integration is the clearest strategic wedge
            body: >-
              GalaxySpace looks strongest when the buyer wants a Chinese-built package of satellites, payloads,
              terminals, and ground-side delivery rather than a single connectivity SKU.
            calloutType: strength
            claimRefs:
