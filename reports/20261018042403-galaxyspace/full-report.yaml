  - id: FE001
    title: GalaxySpace public product architecture
    type: stack
    summary: >-
      Public evidence supports a vertically linked stack from applications and terminals down to space hardware and
      manufacturing, but software/control layers and reliability telemetry remain thinly disclosed.
    data:
      layers:
        - label: Applications and service use cases
          detail: Publicly demonstrated workflows that turn the constellation into a user-facing connectivity product.
          items:
            - label: Emergency-response drone control
              detail: >-
                Remote firefighting-drone test linking Chengdu field operations with Beijing operators over
                GalaxySpace's LEO network.
            - label: In-motion connectivity
              detail: >-
                Vehicle tests transmitted video and downloaded large files over the Little Spider Web experimental
                constellation.
            - label: Direct-to-smartphone path
              detail: >-
                2025 satellite tests targeted direct satellite broadband connectivity for smartphones and space-ground
                integration.
          outputs:
            - label: Demonstrated field use cases
              detail: >-
                The retained public evidence is strongest on drone, vehicle, and handset-adjacent demonstrations rather
                than disclosed contracted service deployments.
        - label: Terminals and ground interface
          modules:
            - label: Phased-array user terminal
              detail: Publicly described in company and media materials and used in drone and vehicle demonstrations.
            - label: Ground station and data services
              detail: >-
                Caixin says the registered business scope already includes ground-station construction and satellite
                data services.
        - label: Network operations layer
          detail: >-
            Public evidence points to a service-enabling layer even though its software and control-plane details are
            undisclosed.
          items:
            - label: Space-ground integration tests
              detail: >-
                Global Times says the 2025 direct-to-smartphone-capable satellite has already been used for space-ground
                network integration verification.
            - label: Ground-station and data operations
              detail: >-
                Caixin lists ground-station construction, operation, and satellite data services within the public
                business scope.
        - label: Space segment
          items:
            - label: Seven-satellite experimental constellation
              detail: IAF says GalaxySpace has a self-established seven-satellite LEO broadband communication constellation.
            - label: Yinhe-1 Q/V-band demonstrator
              detail: >-
                NewSpace Market says Yinhe-1 validated Q/V-band broadband links and achieved over 10 Gbps downlink in
                tests.
          outputs:
            - label: Q/V feeder links and Ka user links
              detail: Public product descriptions cite Q/V feeder frequencies and Ka-band user terminals.
        - label: Industrialization layer
          detail: Manufacturing scale and supplier breadth are core parts of the company's product-delivery thesis.
          items:
            - label: Nantong smart factory
              detail: >-
                Public sources say the site can run 30-plus satellites simultaneously and 100-150 medium satellites
                annually.
            - label: Supply-chain ecosystem
              detail: Global Times says GalaxySpace's supply-chain partner count grew from about 100 to more than 1,000.
          modules:
            - label: Digital production scheduling and automated testing
              detail: >-
                Nantong government reporting points to digital scheduling, automated testing, and space-environment
                simulators as the factory control system.
        - label: Supply-chain cost-down layer
          detail: >-
            Public reporting ties component industrialization to lower phased-array antenna cost and broader supplier
            participation.
          items:
            - label: Antenna cost reduction
              detail: >-
                Global Times says the price of spaceborne millimeter-wave phased-array antennas is only one-tenth of a
                decade ago.
            - label: More than 1,000 supply-chain partners
              detail: >-
                Global Times says GalaxySpace's supplier network expanded from about 100 partners at founding to more
                than 1,000.
    approximationNotes: >-
      This is a public-evidence architecture map rather than a disclosed system diagram; it omits undisclosed software,
      control, and assurance layers.
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      GalaxySpace's visible path moves from institutional program wins and telecom integration to still-unproven
      recurring customer economics.
    data:
      items:
        - label: Institutional program entry
          actor: State-backed constellation operators
          stage: Program selection
          touchpoints:
            - Guowang latest batch reportedly designed and built by GalaxySpace
            - Proof is strongest at infrastructure-program level
        - label: Operator integration
          actor: PCCW Global
          stage: Gateway setup
          channel: Telecom partner
          touchpoints:
            - First testing gateway station installed in Hong Kong
            - Connected to GalaxySpace's experimental eight-satellite constellation
        - label: Technical verification
          actor: GalaxySpace + PCCW
          stage: Pilot
          touchpoints:
            - 100Mb/s bidirectional test
            - Uninterrupted satellite internet video calls
        - label: Market access expansion
          actor: Undisclosed end customers
          stage: Commercial intent
          channel: Hong Kong and international markets
          touchpoints:
            - Services planned via operator-led route to market
            - Public sources do not identify downstream accounts
        - label: Service-line broadening
          actor: Potential ground-station and data-service buyers
          stage: Upsell / adjacent revenue
          touchpoints:
            - Public filing lists ground-station construction, operation, and satellite data services
            - No named customers or contract metrics disclosed
        - label: Durability proof gap
          actor: Investors / diligence team
          stage: Underwriting
          touchpoints:
            - NRR, GRR, churn, renewal, and top-customer concentration are undisclosed
            - Public evidence supports demand access more than recurring economics
    approximationNotes: Sequence reflects the order implied by public disclosures, not a measured conversion funnel.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU014
