      - number: '2.3'
        title: Buyer segmentation is clear, but adoption timing is still constrained
        blocks:
          - type: paragraph
            body: >-
              The buyer map splits into at least two distinct tracks: state-backed sovereign connectivity anchored by
              Guowang, and commercially oriented broadband and IoT expansion anchored by Qianfan and partner-country
              channels. That distinction matters because budget owners, procurement logic, and timing differ sharply
              across government, carrier, emergency-response, and export workflows. The growth case is helped by policy
              support, standardization work, and the strategic desire for sovereign communications infrastructure, but
              the constraints are equally material: spectrum coordination, debris and orbital-conflict management,
              launch cadence, supply-chain intensity, and the practical need for local partners or sovereign
              alternatives can all slow market opening. Terrestrial fiber and 5G remain status-quo substitutes in many
              geographies, so public evidence still does not isolate a GalaxySpace-specific SAM/SOM or contract-backed
              customer budget capture with enough precision to underwrite the market on a revenue basis.
            claimRefs:
              - CM006
              - CM011
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Infrastructure buildout is easier to evidence than demand monetization
            body: >-
              Policy support, orbital reservations, constellation plans, and factory-capacity disclosures make the
              Chinese satellite-internet buildout visible, but public evidence still stops short of showing
              GalaxySpace-specific contract backlog, ARPU, or customer economics.
            calloutType: insight
            claimRefs:
