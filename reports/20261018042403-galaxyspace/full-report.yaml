        - Not yet visible in public evidence; this is a contingent upside case.
        - Prospectus-grade disclosure, contract-value proof, and better financing-term transparency.
      - - Base
        - >-
          GalaxySpace keeps financing access and listing optionality, but public disclosure remains incomplete on
          economics and cap-table terms.
        - Around the disclosed latest private mark, with no basis for aggressive upside.
        - 'Most consistent with current evidence: real scale plus incomplete economic proof.'
        - Continuation of IPO process without major negative surprises.
      - - Bear
        - >-
          Commercial conversion remains under-disclosed, financing terms prove investor-unfriendly, or sector deployment
          lags constellation rhetoric.
        - Discount to the disclosed latest private mark.
        - >-
          Meaningful because current evidence still relies more on capability proof than on disclosed financial
          outcomes.
        - IPO delay, weak disclosed economics, down-round signals, or sector execution disappointment.
    notes: >-
      Scenario ranges are expressed relative to the disclosed February 2026 post-money mark because public evidence does
      not support a precise revenue, EBITDA, or DCF valuation model.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV011
