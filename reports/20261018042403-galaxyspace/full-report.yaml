      - number: '4.2'
        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public unit-economics evidence is operational rather than financial. Nantong NETDA says the
              smart factory can run more than 30 satellites in parallel, produce roughly two satellites every five days,
              and sustain annual output of 100-150 medium satellites, while Xinhua independently reports a three-day
              production cadence, five days for two satellites' assembly and test, 150-satellite annual medium-class
              capacity, and 22 medium satellites shipped in 2025. Those are meaningful efficiency proxies because they
              show GalaxySpace is trying to amortize tooling, labor, and qualification overhead across a
              batch-production base instead of bespoke one-off spacecraft. The industry context from New Space Economy
              is that modern LEO manufacturing economics favor volume production, automated test flows, and commercial
              component sourcing, which is directionally consistent with GalaxySpace's public manufacturing story. At
              the same time, the retained record still provides no public realized ASP, gross margin, service gross
              margin, launch pass-through policy, customer-acquisition cost, or payback period. The conclusion is not
              that unit economics are bad; it is that outside investors can currently see throughput claims but not the
              conversion from throughput into contribution margin.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI010
              - CI013
      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The 2026 financing and listing signals imply that GalaxySpace still needs external capital to scale, but
              they do not show how far existing capital goes. People's Daily says GalaxySpace completed a February 2026
              Series C financing round at approximately RMB32 billion post-money valuation, and both People's Daily and
              Caixin report that the company entered A-share IPO counseling in March 2026 with Huatai United Securities
              as counseling institution. That combination is consistent with a capital-intensive industrial company
              preparing for a broader financing path rather than operating from clearly disclosed cash-generation
              self-sufficiency. SpaceBandits adds the most direct adverse framing in the retained pool: GalaxySpace is
              now supplying into a state-allocated constellation order book, its headline unicorn valuation dates from
              earlier funding vintages, and there are still no public financial statements. Because public sources do
              not disclose cash on hand, burn, debt facilities, project-finance obligations, or use of proceeds from the
              February round, the current evidence supports financing dependency as a diligence question, not as a
              closed-form runway calculation.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, GalaxySpace looks more like a scale-sensitive industrial platform than a software-style
              recurring-revenue story. Public evidence supports meaningful manufacturing ambition, a widening
              product-to-services surface, and access to fresh equity plus an IPO process, but not the core underwriting
              inputs needed to defend revenue quality or margin path at valuation. The most supportable positive read is
              that GalaxySpace appears to have built real production infrastructure and enough demand momentum to
              justify continued financing. The most important negative read is that public disclosure still stops short
              of audited revenue, gross margin, pricing realization, customer concentration, backlog conversion, and
              cash runway. Until the company provides those data, the investment case depends more on strategic
              narrative and industrial positioning than on verified financial performance.
            claimRefs:
              - CI002
              - CI006
              - CI011
              - CI012
              - CI013
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What GalaxySpace appears to deliver
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence frames GalaxySpace as both a satellite manufacturer and a satellite-internet
              operator, with a scope that runs from communication payloads and core modules through user terminals,
              ground-station construction, and satellite data services. That matters because it shifts the diligence
              lens away from a single satellite bus or payload vendor and toward a fuller system proposition: a LEO
              broadband network, terminal layer, and supporting operations stack. Public product descriptions remain
              partly company-derived, so the strongest verified takeaway is not a fully proven commercial service but a
              coherent product surface that links constellation hardware, user terminals, and service-enabling
              ground/data capabilities.
            claimRefs:
