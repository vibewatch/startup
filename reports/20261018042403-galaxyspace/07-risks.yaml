      - [Capital providers and public markets, "Lead investors, IPO counselor, and A-share market window", "Fund constellation build-out and working capital", High, "Listing timing moves, proceeds disappoint, or new capital becomes more expensive", High, "Preserve financing flexibility and prove contracted demand before large capex ramps", High]
    notes: >-
      Dependency register highlights where GalaxySpace's economics still rely on external
      launch, policy, or financing counterparties rather than on wholly internal controls.
    claimRefs: [CR006, CR007, CR012, CR013, CR014]
