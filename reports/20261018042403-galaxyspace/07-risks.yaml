    rows:
      - [Launch-cadence and payload-processing bottlenecks, "Sector sources describe packed manifests and scarcity while Chinese mega-constellations need materially higher cadence", High, High, Low, High, "GalaxySpace does not publicly control the launch queue or disclose reserved launch rights."]
      - [Reusable-launch execution slippage in the domestic ecosystem, "Reusable launch schedules are still moving and first launches continue to surface new failure modes", Medium, High, Low, High, "No retained source shows GalaxySpace has insulated itself from domestic launcher delays."]
      - ["On-orbit reliability, debris, and spectrum-coordination risk", "Qianfan pauses and higher-altitude constellation crowding show real operational fragility in the wider LEO system", Medium, High, Medium, Medium-High, "No retained source discloses GalaxySpace-specific in-orbit failure rate or debris-mitigation economics."]
      - [Manufacturing quality at scaled throughput, "Nantong factory discloses automation and testing, but not audited yield, return, or field-failure statistics", Medium, Medium-High, Medium, Medium, "Factory controls are visible; production yield, rework, and warranty data are not public."]
    notes: >-
      Source-backed register focused on bottlenecks that could delay deployment or weaken
      service reliability; mitigation maturity reflects disclosed controls, not an audit.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR010, CR014, CR015]
