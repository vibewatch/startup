slug: galaxyspace
runDate: 2026-10-18
company:
  name: GalaxySpace (银河航天)
chapter:
  number: 7
  title: Risks
  summary: >-
    Public evidence confirms that GalaxySpace has real industrial momentum — an active IPO
    counseling process, recent financing at roughly CNY 32 billion post-money, and a
    Nantong factory described as roughly hundred-plus-satellite annual capacity. The
    residual risk is still high because those milestones arrive before prospectus-level
    financial disclosure, contract backlog visibility, or clear public evidence on launch,
    spectrum, and compliance constraints that could govern commercial scale-up.
sections:
  - id: risk-picture
    title: Severity-ranked risk picture
    body: >-
      GalaxySpace's current risk stack is led by capital-markets execution, launch and
      deployment bottlenecks, and spectrum-orbit coordination risk rather than by
      technology existence risk alone. Public sources are strong enough to show that the
      company is no longer at the slideware stage: IPO counseling is live, the Nantong
      plant is described as a high-volume manufacturing site, and recent launch activity is
      materially above the prior period. What remains unproven in public, however, is the
      translation from manufacturing progress into financeable, licensable, and repeatable
      commercial service. That asymmetry keeps residual exposure high even before asking
      whether the current valuation can absorb schedule slips or policy friction.
    claimRefs: [CR001, CR004, CR005, CR006, CR009, CR011]
    figureRefs: [FR001]
  - id: regulatory-and-capital-markets
    title: Regulatory, disclosure, and governance risk
    body: >-
      The most underwritten public milestone is the A-share IPO counseling process, not a
      prospectus. Caixin and Global Times both point to the March 30 counseling filing and
      Huatai United's role, while GalaxySpace's disclosed February Series C valuation of
      roughly CNY 32 billion raises the bar for proving durable economics. At the same
      time, Caixin reports that Xu Min still controls 72.87% of voting rights after
      accounting for special voting arrangements, which makes founder alignment a strength
      only if minority protections, related-party boundaries, and board controls hold up in
      formal listing documents. Until audited revenue, margin, proceeds, and use-of-cash
      disclosures appear, regulatory progress and financing progress should not be treated
      as equivalent to underwritten business quality.
    claimRefs: [CR001, CR002, CR003, CR011, CR012]
    tableRefs: [TR001]
  - id: operational-and-partner-dependencies
    title: Operational, launch, and ecosystem dependency risk
    body: >-
      GalaxySpace's disclosed operating strength is its factory system, not its control
      over the launch and orbital environment that must carry a broadband constellation at
      scale. The Nantong facility is described as annual 100-150 satellite capacity and as
      having more than 20 spacecraft already launched, but Satellite Today still describes
      manifests as "really, really busy" and "a situation of scarcity" for years to come.
      Orbital Radar separately says both Guowang and Qianfan depend on Chinese launch
      capacity scaling several-fold, while New Space Economy stresses that schedule delay
      is normal in reusable launch development because each testing stage reveals new
      failure modes. In other words, GalaxySpace can manufacture faster than the broader
      system may currently absorb, and state-backed demand can crowd out the flexibility
      available to a private operator.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR013, CR014, CR015]
    tableRefs: [TR002, TR003]
  - id: residual-exposure-and-kill-criteria
    title: Residual exposure, mitigations, and thesis-break triggers
    body: >-
      The public mitigations visible today are mostly industrial-process controls:
      automation, digital scheduling, testing infrastructure, and protective measures
      inside the factory. Those are useful, but they do not by themselves close the most
      important residual risks, which sit in launch access, licensing and spectrum
      coordination, customer economics, and financing terms. For an investor, the cleanest
      thesis-break triggers are measurable: a missed or materially delayed IPO path, proof
      that launch scarcity is stretching constellation timelines, evidence that spectrum or
      interference rules can constrain service deployment, or failure to convert industrial
      output into contracted recurring demand. If those conditions emerge before audited
      economics do, the current valuation support becomes materially weaker.
    claimRefs: [CR006, CR009, CR010, CR011, CR012, CR015]
