  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-compliance
      missingEvidence: Current privacy terms, DPA terms, security certifications, incident disclosures, and any public enforcement or litigation record.
      whyItMatters: Without primary compliance evidence, legal and security risk can only be bounded as unresolved rather than low.
      diligencePath: Request a trust-center package, compliance certificates, DPA, incident-history representation, and a counsel-led regulatory/litigation search in China and export markets.
      relatedQuestionRefs: [QR009]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: financing-risk
      missingEvidence: Draft prospectus, audited 2025-2026 revenue and margin data, Series C proceeds, use of proceeds, backlog, and launch reservation commitments.
      whyItMatters: IPO counseling and headline valuation do not show whether constellation expansion is financeable without expensive or dilutive capital.
      diligencePath: Obtain the counseling package or prospectus draft, management forecast, cap-table and preference schedule, and customer backlog by program.
      relatedQuestionRefs: [QR001, QR002, QR010]
    - type: missing-source
      severity: material
      topic: licenses-spectrum
      missingEvidence: Domestic and international frequency filings, service licenses, and documented coordination rights for the markets GalaxySpace intends to serve.
      whyItMatters: Commercial deployment can be blocked by licensing or spectrum coordination even if manufacturing and launch execution improve.
      diligencePath: Request ITU filing references, MIIT or equivalent authorizations, export-market approvals, and external counsel's spectrum-risk memo.
      relatedQuestionRefs: [QR006, QR007]
    - type: missing-source
      severity: minor
      topic: customer-economics
      missingEvidence: Named paid contracts, renewal terms, uptime commitments, and service-level penalties tied to broadband or direct-to-cell deployments.
      whyItMatters: Industrial throughput matters less if customers, renewals, and contracted demand lag behind the manufacturing ramp.
      diligencePath: Review top customer contracts, deployment schedules, renewal data, and service-credit obligations for current pilots or production accounts.
