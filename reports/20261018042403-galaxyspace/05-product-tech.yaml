  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust and assurance controls
      missingEvidence: Official security architecture, privacy controls, uptime/SLA metrics, certifications, incident history, and quality-system documentation for terminals and network operations.
      whyItMatters: Without assurance artifacts, it is hard to underwrite deployment readiness for regulated or mission-critical connectivity use cases.
      diligencePath: Request current security/compliance materials, quality manuals, certification registers, and service reliability dashboards directly from management.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: commercial readiness
      missingEvidence: Awarded constellation share, production backlog, terminal pricing, deployment count, and named production customers for direct-to-phone or broadband services.
      whyItMatters: Demo success does not prove that GalaxySpace has translated technical capability into contracted repeatable revenue-generating deployments.
      diligencePath: Obtain customer pipeline, booked orders, terminal BOM/ASP ranges, and current production-vs-pilot deployment split by program.
      relatedQuestionRefs: [QE001, QE004, QE007]
    - type: missing-source
      severity: material
      topic: software and control-layer disclosure
      missingEvidence: Public interface control documents, network-management architecture, and independent performance benchmarking for handoff, latency, and availability.
      whyItMatters: The visible stack is hardware-forward; without control-layer detail, architecture diligence cannot verify how well the system scales beyond demonstrations.
      diligencePath: Request network architecture diagrams, test reports, ICDs, and third-party validation for terminal performance and service continuity.
      relatedQuestionRefs: [QE003, QE005, QE008]
