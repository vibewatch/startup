    rows:
      - [LEO broadband constellation, Government and enterprise connectivity buyers plus future direct-to-cell users, Experimental constellation with ongoing launches and demos; no public commercial SLA disclosed, Integrates owned constellation ambitions with terminal and manufacturing capabilities, No public coverage map service-level terms or realized pricing]
      - [Yinhe-1 Q/V-band demonstrator, Internal network engineering and future service operations, In-orbit demo completed; not evidence of scaled service availability, Positioned as China's first commercial Q/V-band low-orbit broadband satellite with >10 Gbps test throughput, No independent benchmark methodology or sustained throughput disclosure]
      - [Phased-array user terminals, Drone operators vehicle users and future field deployments, Publicly demonstrated in drone and vehicle tests, Terminal layer is described alongside payload and constellation development rather than outsourced-only hardware, No public datasheet certifications install-base data or terminal cost]
      - [Direct-to-smartphone satellite program, Handset ecosystem partners and eventual end users, Technical verification underway since April 2025; commercial status undisclosed, Wing-array / large phased-array design is aimed at improving direct-to-phone link budget, No carrier partnerships spectrum framework or public service launch schedule]
      - [Ground station and satellite data services, Constellation operations teams and external service customers, Registered business scope is public; monetization remains unclear, Extends product surface beyond satellite manufacturing into operating infrastructure, No segment revenue contracted customer list or service attach-rate disclosure]
    notes: >-
      Mixes company-derived product descriptions with media and registry evidence; maturity labels
      reflect public verification depth, not internal launch readiness.
    claimRefs: [CE001, CE002, CE003, CE004, CE007]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - GalaxySpace solution
      - Measurable benefit
      - Limitation
    rows:
      - [Remote emergency response, Operators in disconnected areas struggle to maintain broadband control links, LEO link plus phased-array terminal supported a firefighting-drone test, Global Times says operators in Beijing controlled a Chengdu drone with stable two-way transmission, Demonstration only with no public production customer or SLA evidence]
      - [Connectivity on the move, Vehicles usually fall back to terrestrial coverage and local storage, Vehicle-mounted terminal connects to the Little Spider Web experimental constellation, Public test reportedly reached 200 megabits per second and handled real-time video plus large-file downloads, No public latency distribution hardware cost or deployment-count disclosure]
      - [Direct-to-phone broadband, Smartphones normally need terrestrial coverage or purpose-built satcom hardware, 2025 satellite tests direct satellite broadband connectivity and space-ground integration for phones, Shows a technical path toward handset access without waiting for a full finished consumer network, No disclosed operator partner device compatibility matrix or commercial launch date]
      - [High-volume constellation delivery, Constellation operators need repeatable low-cost spacecraft output, Nantong factory combines digital scheduling automated testing and human-machine production, Public sources say 30+ satellites can be built simultaneously and 100-150 medium satellites annually, GalaxySpace's awarded share of national constellation demand is not public]
    notes: >-
      Benefits are sourced from demonstrations and reported factory metrics; they should not be read
      as audited commercial performance or contracted customer outcomes.
    claimRefs: [CE005, CE006, CE007]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Payload and spectrum design, Q/V feeder links plus Ka-band user terminals aim to raise broadband throughput per satellite, Depends on millimeter-wave payload execution spectrum coordination and network economics, Public performance figures are mostly company-derived and not independently benchmarked]
      - [Satellite bus and antenna integration, Wing-array integrated phased-array concept is the direct-to-smartphone path described in public reporting, Depends on large deployable structures power management and RF integration, Public sources describe tests but not failure rates lifetime or field reliability]
      - [Terminal layer, Phased-array user terminals enable drone and vehicle access to the LEO network, Depends on terminal miniaturization installation complexity and customer hardware economics, No public datasheet certifications or installed-base disclosure in the retained evidence]
      - [Manufacturing system, Nantong factory uses digital scheduling automated testing and space-environment simulators to industrialize output, Depends on yield process discipline and supplier quality through ramp, No public yield scrap rework or on-time-delivery metrics]
      - [Supply chain and programme context, Large partner network and national constellation demand are the scale thesis behind production capacity, Depends on launch cadence procurement wins and sector reliability, Qianfan failures and China's filing-versus-deployment gap show broader ecosystem execution risk]
    notes: >-
      This table mixes directly reported components with inferred operating dependencies; unsupported
      reliability and quality metrics remain open diligence items.
    claimRefs: [CE002, CE004, CE005, CE007, CE008, CE009, CE011, CE012]
figures:
  - id: FE001
    title: GalaxySpace public product architecture
    type: stack
    summary: >-
      Public evidence supports a vertically linked stack from applications and terminals down to
      space hardware and manufacturing, but software/control layers and reliability telemetry remain
      thinly disclosed.
    data:
      layers:
        - label: Applications and service use cases
          detail: Publicly demonstrated workflows that turn the constellation into a user-facing connectivity product.
          items:
            - label: Emergency-response drone control
              detail: Remote firefighting-drone test linking Chengdu field operations with Beijing operators over GalaxySpace's LEO network.
            - label: In-motion connectivity
              detail: Vehicle tests transmitted video and downloaded large files over the Little Spider Web experimental constellation.
            - label: Direct-to-smartphone path
              detail: 2025 satellite tests targeted direct satellite broadband connectivity for smartphones and space-ground integration.
          outputs:
            - label: Demonstrated field use cases
              detail: The retained public evidence is strongest on drone, vehicle, and handset-adjacent demonstrations rather than disclosed contracted service deployments.
        - label: Terminals and ground interface
          modules:
            - label: Phased-array user terminal
              detail: Publicly described in company and media materials and used in drone and vehicle demonstrations.
            - label: Ground station and data services
              detail: Caixin says the registered business scope already includes ground-station construction and satellite data services.
        - label: Network operations layer
          detail: Public evidence points to a service-enabling layer even though its software and control-plane details are undisclosed.
          items:
            - label: Space-ground integration tests
              detail: Global Times says the 2025 direct-to-smartphone-capable satellite has already been used for space-ground network integration verification.
            - label: Ground-station and data operations
              detail: Caixin lists ground-station construction, operation, and satellite data services within the public business scope.
        - label: Space segment
          items:
            - label: Seven-satellite experimental constellation
              detail: IAF says GalaxySpace has a self-established seven-satellite LEO broadband communication constellation.
            - label: Yinhe-1 Q/V-band demonstrator
              detail: NewSpace Market says Yinhe-1 validated Q/V-band broadband links and achieved over 10 Gbps downlink in tests.
          outputs:
            - label: Q/V feeder links and Ka user links
              detail: Public product descriptions cite Q/V feeder frequencies and Ka-band user terminals.
        - label: Industrialization layer
          detail: Manufacturing scale and supplier breadth are core parts of the company's product-delivery thesis.
          items:
            - label: Nantong smart factory
              detail: Public sources say the site can run 30-plus satellites simultaneously and 100-150 medium satellites annually.
            - label: Supply-chain ecosystem
              detail: Global Times says GalaxySpace's supply-chain partner count grew from about 100 to more than 1,000.
          modules:
            - label: Digital production scheduling and automated testing
              detail: Nantong government reporting points to digital scheduling, automated testing, and space-environment simulators as the factory control system.
        - label: Supply-chain cost-down layer
          detail: Public reporting ties component industrialization to lower phased-array antenna cost and broader supplier participation.
          items:
            - label: Antenna cost reduction
              detail: Global Times says the price of spaceborne millimeter-wave phased-array antennas is only one-tenth of a decade ago.
            - label: More than 1,000 supply-chain partners
              detail: Global Times says GalaxySpace's supplier network expanded from about 100 partners at founding to more than 1,000.
    approximationNotes: >-
      This is a public-evidence architecture map rather than a disclosed system diagram; it omits
      undisclosed software, control, and assurance layers.
    claimRefs: [CE002, CE004, CE005, CE006, CE007, CE008, CE009]
callouts:
  - calloutType: strength
    title: Integrated product thesis
    body: >-
      The strongest product signal is GalaxySpace's attempt to connect payloads, terminals,
      manufacturing, and service-enabling ground/data work into one stack rather than selling a
      single isolated spacecraft component.
    claimRefs: [CE001, CE002, CE004, CE009]
  - calloutType: risk
    title: Public proof still skews toward demos, not operating metrics
    body: >-
      The evidence set shows meaningful technical demonstrations and factory capacity claims, but it
      still lacks independent uptime, security, deployment-depth, and contract-readiness evidence
      needed to underwrite scaled commercial service.
    claimRefs: [CE006, CE007, CE011, CE012]
