company:
  name: GalaxySpace (银河航天)
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Public evidence supports GalaxySpace as a vertically integrated LEO broadband player spanning
    satellite payloads, terminals, factory-scale manufacturing, and emerging direct-to-smartphone
    tests rather than a single-component supplier. The technical story is directionally credible,
    but much of the architecture and performance evidence is still company-derived or demo-stage,
    leaving commercial readiness, security controls, and reliability disclosure under-documented.
sections:
  - id: product-scope
    title: What GalaxySpace appears to deliver
    body: >-
      The retained public evidence frames GalaxySpace as both a satellite manufacturer and a
      satellite-internet operator, with a scope that runs from communication payloads and core
      modules through user terminals, ground-station construction, and satellite data services.
      That matters because it shifts the diligence lens away from a single satellite bus or payload
      vendor and toward a fuller system proposition: a LEO broadband network, terminal layer, and
      supporting operations stack. Public product descriptions remain partly company-derived, so the
      strongest verified takeaway is not a fully proven commercial service but a coherent product
      surface that links constellation hardware, user terminals, and service-enabling ground/data
      capabilities.
    claimRefs: [CE001, CE002, CE004]
    tableRefs: [TE001]
  - id: architecture-industrialization
    title: Architecture and industrialization are the core differentiation claims
    body: >-
      GalaxySpace's public technical story centers on millimeter-wave broadband links, phased-array
      terminals, and manufacturing scale. Company-derived materials describe Q/V-band feeder links,
      Ka-band user terminals, and a Q/V-band demonstrator satellite, while independent and
      quasi-independent reporting adds evidence of a seven-satellite experimental constellation,
      direct-to-smartphone testing, and a Nantong factory designed for repeatable production rather
      than artisanal one-off builds. The most credible differentiation signal is therefore not a
      single benchmark number but the combination of payload design, terminal work, digital factory
      tooling, and a growing supplier base. Even so, public evidence does not expose software
      control layers, detailed interface documentation, or independent reliability data for these
      systems, so the architecture should be treated as partially verified rather than fully
      documented.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-risks
    title: Technical maturity has advanced, but service readiness still looks early
    body: >-
      The 2025-2026 evidence set is stronger than a pure concept-stage story: public reporting says
      GalaxySpace has launched more than 20 self-developed satellites since 2025, has run
      vehicle-connectivity and drone-control demonstrations over its LEO network, and has already
      put a direct-to-smartphone-capable satellite into technical verification. Those are meaningful
      maturity signals. But they do not yet amount to proof of scaled, reliable commercial service.
      The broader Chinese LEO ecosystem is still early relative to its published ambition: Orbital
      Radar tracks only a small fraction of the satellites planned for Qianfan and Guowang, while
      sector reporting highlights launch-capacity and execution constraints. For GalaxySpace, that
      means product underwriting still depends on evidence that is not public here: awarded
      constellation share, terminal economics, uptime/SLA disclosure, customer deployment depth, and
      trust/security controls.
    claimRefs: [CE005, CE006, CE007, CE010, CE011, CE012]
    tableRefs: [TE002]
