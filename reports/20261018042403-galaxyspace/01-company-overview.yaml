  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "GalaxySpace is a Beijing-based private satellite manufacturer and satellite-internet platform that is now trying to translate years of technical validation into industrial scale and public-market readiness. The strongest current public facts are the March 2026 IPO-counseling filing, the February 2026 Series C financing, and repeated claims of 100-plus-satellite annual factory capacity, while revenue, customer, and lifetime-funding disclosures remain materially incomplete."
  },
  "sections": [
    {
      "id": "identity-and-scope",
      "title": "Identity, footprint, and reporting perimeter",
      "body": "GalaxySpace positions itself as a leading Chinese provider of satellite Internet solutions and a satellite manufacturer, with products spanning connectivity solutions, payloads, platforms, and satellite components [CO001][CO007]. Reuters describes the company as Beijing-based, while official and local-government materials point to operating and manufacturing capabilities in Beijing, Xi'an, Chengdu, and Nantong [CO003][CO006]. The one caution is legal-entity clarity: GalaxySpace's English site says the company was founded in April 2018, but IPO-counseling coverage identifies the current Beijing legal entity as founded on June 27, 2019 with RMB 44.381908 million of registered capital [CO002][CO003]. For diligence, the safest read is that the business narrative begins in 2018 while the currently disclosed reporting perimeter is the 2019 legal entity, which still needs reconciliation across history, ownership records, and any group-level operating metrics [CO002][CO003].",
      "claimRefs": [
        "CO001",
        "CO002",
        "CO003",
        "CO006",
        "CO007"
      ],
      "tableRefs": [
        "TO001"
      ]
    },
    {
      "id": "leadership-and-control",
      "title": "Leadership concentration and governance visibility",
      "body": "Public reporting paints GalaxySpace as founder-led and tightly controlled. Caixin and The Paper say Xu Min is the founder, chairman, and CEO, and that special voting arrangements leave him with 72.87% of voting power despite 22.04% direct and indirect share ownership [CO004]. Named technical leadership beyond the founder is thinner: The Paper cites model chief designer Hu Zhao on smart-factory productivity, but the assigned pool does not provide a full executive-bench or board roster [CO005]. That means the company has at least one visible technical operator, yet governance diligence still has to answer board composition, succession depth, and whether control rights meaningfully constrain outside investors as GalaxySpace approaches the public market [CO004][CO005].",
      "claimRefs": [
        "CO004",
        "CO005"
      ],
      "tableRefs": [
        "TO002"
      ]
    },
    {
      "id": "funding-and-disclosure",
      "title": "Funding, valuation, and disclosure quality",
      "body": "GalaxySpace completed a new financing round in February 2026 and then entered A-share IPO counseling on March 30, 2026 with Huatai United Securities, making 2026 a clear transition year from private financing to capital-markets preparation [CO011][CO012]. People's Daily puts the post-money valuation from that Series C round at roughly RMB 32 billion, but the public record in this worker pool still does not disclose exact round proceeds, cumulative capital raised, revenue, run-rate, ARR, or customer count with enough precision to support an underwritten KPI view [CO014][CO015]. Baiguan adds a useful counterweight: it argues 2026 is a peak year for pre-IPO monetization in China's commercial-space sector and that speculative enthusiasm is already outpacing proof of execution [CO016]. That backdrop does not invalidate GalaxySpace's financing momentum, but it does make disclosure quality a central diligence risk rather than an administrative follow-up [CO011][CO012][CO014][CO015][CO016].",
      "claimRefs": [
        "CO011",
        "CO012",
        "CO014",
        "CO015",
        "CO016"
      ],
      "tableRefs": [
        "TO003"
      ]
    },
    {
      "id": "milestones-and-stage",
      "title": "Milestones and current operating stage",
      "body": "The milestone record shows a company moving from technical demonstration toward industrialization rather than one already proven on commercial metrics. GalaxySpace says it launched its first satellite in January 2020, six mass-produced LEO broadband satellites in March 2022, and the Lingxi-03 stackable flat-panel satellite in July 2023 [CO008][CO009][CO010]. By 2026, the story had shifted toward scaled production, fresh funding, and continued technology development: public sources cite the February financing, March IPO counseling, Nantong factory output of 100-150 medium-sized satellites per year, and the September 2026 PEGA-SUS1 demonstration launch [CO006][CO011][CO012][CO013]. The operating stage is therefore best described as late private / growth industrialization: technical milestones and manufacturing ambition are real, but commercial traction and financial durability are still substantially underdisclosed [CO006][CO008][CO009][CO010][CO011][CO012][CO013][CO015].",
      "claimRefs": [
        "CO006",
