    {
      "id": "trust-breach-and-reputation",
      "title": "Trust, Breach, and Reputation Risk",
      "body": "Karrot’s domestic leadership has been built on a simple user belief: dealing with nearby verified neighbors is safer than posting into an anonymous nationwide bazaar. That belief remains directionally true, but it does not eliminate scams, impersonation, hacked accounts, or disputes that migrate off platform. The more Karrot advertises safety, the more trust incidents become brand-level events rather than background marketplace noise. Korean enforcement around the SK Telecom breach shows how quickly a consumer-data failure can escalate into record fines and national media scrutiny. Even though Karrot is a different business model, the institutional lesson is relevant: once a consumer internet company is seen as careless with data protection or user safety, the problem is no longer confined to the security team. It becomes a board, regulator, PR, and revenue issue at once. For a company monetizing local attention, that reputational compounding is one of the most dangerous downside paths.",
      "claimRefs": [
        "CR021",
