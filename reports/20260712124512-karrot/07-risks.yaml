    "claims": [
      {
        "id": "CR001",
        "statement": "South Korea’s Personal Information Protection Act is the core privacy framework that applies across both public and private sectors.",
        "type": "third-party-reported",
        "topic": "privacy regime scope",
        "sourceRefs": [
          "SR001"
        ],
        "confidence": "medium",
        "freshness": "current"
      },
      {
        "id": "CR002",
        "statement": "KoreanLII describes PIPA as prevailing among Korean data-protection laws unless another act specifically provides otherwise.",
        "type": "third-party-reported",
        "topic": "privacy regime hierarchy",
        "sourceRefs": [
          "SR001"
        ],
        "confidence": "medium",
        "freshness": "current"
      },
      {
        "id": "CR003",
        "statement": "Kim & Chang reported that the National Assembly passed 2026 PIPA amendments that explicitly designate the business owner or representative as the ultimate person responsible for personal-information protection.",
        "type": "third-party-reported",
        "topic": "ceo accountability",
        "sourceRefs": [
          "SR002",
          "SR003",
          "SR006"
        ],
        "confidence": "high",
        "freshness": "current"
      },
      {
        "id": "CR004",
        "statement": "The 2026 PIPA amendments can raise the maximum administrative penalty ceiling to 10% of total revenue in severe repeat or large-scale cases.",
        "type": "third-party-reported",
        "topic": "privacy penalties",
        "sourceRefs": [
          "SR002",
          "SR003",
          "SR006"
        ],
        "confidence": "high",
        "freshness": "current"
      },
      {
        "id": "CR005",
        "statement": "The amended PIPA broadens a reportable breach beyond loss, theft, or leakage to include forgery, alteration, or damage of personal information.",
        "type": "third-party-reported",
        "topic": "breach definition",
        "sourceRefs": [
          "SR002"
        ],
        "confidence": "medium",
        "freshness": "current"
      },
      {
        "id": "CR006",
        "statement": "The amended PIPA requires notification when a company becomes aware of a possibility of a breach, not only after confirming one has occurred.",
        "type": "third-party-reported",
        "topic": "breach notification timing",
        "sourceRefs": [
          "SR002"
        ],
        "confidence": "medium",
        "freshness": "current"
      },
      {
        "id": "CR007",
        "statement": "The law also creates an incentive for preventive investment because privacy-protection spending can help reduce penalties.",
        "type": "third-party-reported",
        "topic": "privacy mitigation incentive",
        "sourceRefs": [
          "SR002"
        ],
        "confidence": "medium",
        "freshness": "current"
      },
      {
        "id": "CR008",
        "statement": "For Karrot, a consumer platform built on location, identity, and transaction data, South Korea’s privacy regime is not a back-office issue but a product-critical control system.",
        "type": "inferred",
        "topic": "privacy product risk",
        "sourceRefs": [
          "SR001",
          "SR004",
          "SR007"
        ],
        "confidence": "high",
        "freshness": "current"
      },
      {
        "id": "CR009",
        "statement": "Independent legal and compliance commentary in 2026 consistently frames Korean privacy law as moving toward stronger executive accountability and higher fines.",
        "type": "third-party-reported",
        "topic": "privacy enforcement trend",
        "sourceRefs": [
          "SR003",
          "SR005",
          "SR006"
        ],
        "confidence": "high",
        "freshness": "current"
      },
      {
        "id": "CR010",
        "statement": "That direction raises Karrot’s downside if user trust, data retention, or breach-response processes fail during continued international growth.",
        "type": "inferred",
        "topic": "privacy downside",
        "sourceRefs": [
          "SR002",
          "SR003",
          "SR018"
        ],
        "confidence": "medium",
        "freshness": "current"
      },
      {
        "id": "CR011",
        "statement": "The KFTC said open-market operators have a duty to securely collect and store users’ personal information gathered during transactions.",
        "type": "third-party-reported",
        "topic": "platform data duty",
        "sourceRefs": [
          "SR008"
        ],
        "confidence": "medium",
        "freshness": "current"
      },
      {
        "id": "CR012",
        "statement": "The same KFTC action said operators brokering transactions between sellers and consumers have a manager’s duty to help ensure transactions are safe and smooth.",
        "type": "third-party-reported",
        "topic": "intermediary duty",
        "sourceRefs": [
          "SR008"
        ],
        "confidence": "medium",
        "freshness": "current"
      },
      {
        "id": "CR013",
        "statement": "KFTC reviewers also targeted terms that broadly waived intermediary responsibility simply because the platform was not a direct contract party.",
        "type": "third-party-reported",
        "topic": "liability waivers",
        "sourceRefs": [
          "SR008"
        ],
        "confidence": "medium",
        "freshness": "current"
      },
      {
        "id": "CR014",
        "statement": "The Online Platform Fairness Bill would create a platform-specific regulatory framework with written-contract, notice, payment, fund-management, recordkeeping, grievance-handling, and investigative compliance obligations.",
        "type": "third-party-reported",
        "topic": "platform bill obligations",
        "sourceRefs": [
          "SR010",
          "SR009"
        ],
        "confidence": "high",
        "freshness": "current"
      },
      {
        "id": "CR015",
        "statement": "CCIA’s analysis says the proposed bill can apply if a platform exceeded ₩10 billion of domestic revenue from covered intermediary services in the prior fiscal year.",
        "type": "third-party-reported",
        "topic": "bill revenue threshold",
        "sourceRefs": [
          "SR010"
        ],
        "confidence": "medium",
        "freshness": "current"
      },
      {
