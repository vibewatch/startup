    {
      "id": "leadership-and-governance",
      "title": "Leadership bench and operating footprint",
      "body": "Leadership evidence is stronger on operating roles than on deep governance detail. Daangn’s Korean footer names Kim Yong-hyun and Hwang Do-yeon as current representative executives, while international reporting still strongly associates co-founder Gary Kim with global expansion efforts. North America is the clearest visible international management build-out. BusinessKorea and BetaKit both describe Robert Kim as the executive leading localization and growth in the region, and Karrot’s Canada careers page plus independent hiring coverage point to Toronto as an engineering hub for mobile and AI talent. That supports the view that international expansion is not a loose licensing effort but a company-controlled operating priority. Still, public sources remain light on board composition, internal decision rights, and the precise day-to-day roles of each founder in 2026. That disclosure gap does not negate the operating story, but it does matter for diligence because Karrot is trying to scale a community product across very different markets while remaining private and relatively opaque.",
