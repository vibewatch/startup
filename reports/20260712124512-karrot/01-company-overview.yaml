  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Karrot, the international brand for Danggeun Market, is now a scaled Korean local-community platform rather than only a secondhand resale app. Public evidence supports a 2015 founding, a $162 million Series D at a $2.7 billion valuation in 2021, first annual profit in 2023, and continued 2025 revenue growth driven primarily by advertising and local services. The open diligence questions are no longer about whether the company has real scale; they are about how much of the international thesis and private-market valuation can be sustained without fuller financial and governance disclosure."
  },
  "sections": [
    {
      "id": "identity-and-product",
      "title": "Identity, founding, and product scope",
      "body": "Karrot should be understood as both a Korean neighborhood platform and an international brand translation of Danggeun Market. The Korean corporate surfaces emphasize Daangn’s Seoul base and local-community mission, while the English site presents Karrot as a verified-neighbor marketplace for free local buying and selling. The historical record is consistent on one core point: the company was founded in 2015 around hyperlocal secondhand trading rather than nationwide anonymous listings. That local-first design still matters because it underpins the company’s trust model, ad targeting, and community expansion. What changed over time is scope. Karrot is no longer only a resale app. Public company pages and independent reporting now describe a local super-app stack that includes community groups, jobs, small-business ads, real estate, automotive listings, and payment-related services. That breadth gives Karrot multiple monetization surfaces without forcing transaction fees into the core C2C experience.",
