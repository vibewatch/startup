    {
      "id": "performance-and-expansion",
      "title": "Profitability milestone, super-app metrics, and expansion tension",
      "body": "Karrot’s biggest credibility upgrade is that it is no longer a purely growth-at-all-costs story. BusinessKorea reported KRW 127.6 billion of 2023 revenue with KRW 17.3 billion of operating profit, establishing the first annual profit milestone. Public 2026 coverage suggests the top line kept scaling, with KMJ reporting KRW 270.7 billion of consolidated 2025 revenue and Nate highlighting the extreme concentration of revenue in advertising. Operationally, the app also looks deeper than a simple classifieds product: Karrot Alba allegedly processed more than 50 million applications in 2025, community memberships expanded rapidly, and advertiser counts kept climbing. User-scale signals remain large even if the exact figure depends on the date and metric chosen, ranging from 36 million cumulative subscribers in 2024 to more than 43 million registered users by 2026. The tension is geographic. Canada and North America show real traction, but Karrot is still funding overseas growth with meaningful losses at the subsidiary level. That makes the company overview attractive but not risk-free: the domestic machine appears proven, while the international chapter still requires capital and execution discipline.",
