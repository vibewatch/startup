    {
      "id": "drivers-and-constraints",
      "title": "Growth drivers and adoption constraints",
      "body": "Korea offers unusually favorable conditions for a hyperlocal marketplace. Smartphone penetration is extremely high, digital payments are normal, and dense cities make neighborhood pickup far easier than in many Western markets. Inflation, thrift behavior, and sustainability norms have also pushed resale from fringe behavior into the mainstream. Those are genuine demand drivers. But hyperlocal marketplaces still carry hard constraints. Trust and fraud controls matter more than they do for a simple directory because users are meeting strangers and often transacting without platform escrow. The model is also density-dependent: it works best where there are enough nearby buyers, sellers, and merchants for repeat activity to feel natural. Finally, as Karrot’s user base gets very large domestically, future growth becomes less about first-time acquisition and more about deeper monetization and adjacent service adoption. That raises the strategic bar. The company has to keep community activity high and advertiser ROI strong, not just keep adding sign-ups.",
      "claimRefs": [
        "CM016",
        "CM017",
        "CM018",
        "CM019",
        "CM020",
        "CM021",
        "CM031",
        "CM034"
      ],
      "tableRefs": [
        "TM004"
      ],
      "figureRefs": [
        "FM003"
      ]
    },
    {
      "id": "substitutes-and-structure",
      "title": "Substitutes, adjacencies, and structural verdict",
      "body": "Karrot’s market structure is competitive but differentiated. In Korea, Joongna, Bunjang, and Naver-linked formats prove that secondhand demand can be served through several architectures: old-school communities, portal ecosystems, and branded marketplaces. Internationally, Facebook Marketplace, OfferUp, Craigslist, Gumtree, and Mercari show that local resale can scale through very different trust models and shipping assumptions. The most interesting adjacency is community attention. Nextdoor and Korean community apps such as Townhall are not direct resale clones, but they compete for the same local time and neighborhood identity that Karrot wants to own. That means Karrot’s later valuation should not be judged only against goods marketplaces; it also belongs in the conversation about local media and community platforms. The structural verdict is favorable but disciplined: Karrot has real market whitespace because it connects trust, local discovery, and merchant monetization better than many substitutes, but the monetizable slice of its surrounding TAM is narrower than the broad consumer-internet labels imply.",
