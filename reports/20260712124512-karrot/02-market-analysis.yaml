  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Karrot sits inside a large Korean reuse economy and an even larger mobile-ad ecosystem, but its true addressable market is the narrower local layer where trust, repeat engagement, and merchant demand intersect. Public evidence supports a sizable backdrop in recommerce, classifieds, and digital advertising, while also showing why generic TAM numbers overstate what a hyperlocal platform can realistically monetize."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary: Karrot sits across several local digital markets",
      "body": "Karrot does not fit cleanly into one textbook market bucket. The company started inside Korean recommerce, but its current operating story clearly spans multiple local digital markets: secondhand goods, neighborhood community attention, local classifieds, local jobs, and targeted SMB advertising. That matters because TAM discussions can become misleading if they jump straight from a huge national e-commerce number to Karrot’s realistic monetizable opportunity. The better framing is layered. The broadest layer is Korea’s resale and recommerce economy, where secondhand demand has gone mainstream. A narrower layer is digital classifieds and local discovery. Narrower still is the monetizable slice tied to neighborhood trust, frequent local engagement, and merchant demand inside served communities. Karrot’s opportunity is attractive because the company can reuse the same local graph across several categories. But it is also narrower than generic consumer-internet TAM slides suggest, because much of the value still depends on dense neighborhoods, repeated usage, and trust-sensitive local transactions.",
      "claimRefs": [
        "CM001",
        "CM002",
