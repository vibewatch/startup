  topStrengths:
    - Dominant Korean hyperlocal network with genuine community utility beyond simple listings.
    - First annual operating profit and continued 2025 growth support that the domestic core is economically real.
    - >-
      Trusted local identity, community participation, jobs, and SMB ads create richer monetization optionality than a
      plain classifieds app.
    - A lower reported 2025 private mark offers a more rational entry frame than the 2021 peak unicorn price.
  topRisks:
    - Advertising concentration remains extreme, making value sensitive to SMB demand and ad-product quality.
    - >-
      International expansion still appears loss-making, limiting how much global option value should be priced in
      today.
    - Private-company disclosure is too thin for high-confidence point valuation relative to public comps.
    - >-
      Korean privacy and platform-liability rules are tightening around exactly the trust and identity systems Karrot
      relies on.
  unresolvedGaps:
    - Standardized 2024-2026 financial disclosure, including revenue bridges, margins, and cash generation.
    - Country-level unit economics for Canada and any other meaningful non-Korean markets.
    - Exact pricing and structure of the 2025 secondary transaction and any preference-stack implications.
    - Management-quality evidence on how fast ads can scale without degrading community trust and engagement.
