      ]
    },
    {
      "id": "reported-performance",
      "title": "Reported performance: 2023 profit milestone and 2025 acceleration",
      "body": "Public evidence suggests Karrot has crossed the most important threshold for a consumer internet startup: real profitability in its home market. BusinessKorea reported KRW 127.6 billion of 2023 revenue and KRW 17.3 billion of operating profit on a non-consolidated basis, marking the first annual operating profit in the public record. Later 2026 coverage indicates that the company kept scaling, with KMJ and TopDaily both reporting about KRW 270.7 billion of 2025 consolidated revenue and KRW 14.6 billion of operating profit. Those later figures also show that the business is not growing from resale volume alone. Jobs, community engagement, and merchant profiles are all feeding the ad engine. The caution is comparability. The 2023 and 2025 numbers are not perfectly apples-to-apples because the basis appears to shift from non-consolidated to consolidated reporting. Even so, the directional picture is clear: Karrot is no longer just a user-growth story; it now has credible operating leverage and visible monetization depth.",
