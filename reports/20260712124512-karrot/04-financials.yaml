    {
      "id": "capital-allocation",
      "title": "Capital allocation: reinvestment, overseas losses, and ongoing R&D intensity",
      "body": "Karrot’s financial story becomes more nuanced once the analysis moves below the headline profit line. Nate’s March 2026 report shows that the company is still willing to spend aggressively on expansion and product development. It reportedly injected KRW 20.2 billion into its Canadian subsidiary after that unit posted a KRW 37.5 billion loss, and it also continued investing in Karrot Pay and related services. R&D intensity stayed high as well, with reported 2025 spending of KRW 55.2 billion and a standout ratio versus Korean internet peers. This matters because it clarifies management’s posture: domestic profitability is not being treated as an endpoint. It is being used to finance international user acquisition, AI and product investment, and adjacent services. That can create long-term value, but it also means near-term consolidated margins may remain lower than the domestic business alone would suggest. For investors, the right reading is not “profitable, therefore derisked”; it is “profitable enough to self-fund the next growth push, but still capital hungry abroad.”",
