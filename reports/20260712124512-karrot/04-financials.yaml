    {
      "id": "disclosure-and-verdict",
      "title": "Disclosure benchmark and overall financial verdict",
      "body": "Karrot’s biggest financial weakness today is not growth or monetization proof. It is disclosure depth. Private-company profile pages summarize funding, valuation, and sometimes employee estimates, but they do not expose gross margin, cash flow, balance-sheet strength, customer concentration, or the exact terms of any later secondary transactions. The DART and KOBDi surfaces show where a diligent analyst would search for Korean statutory data, but the accessible public record still falls short of the kind of issuer-grade package visible in Nextdoor’s SEC filings or Mercari’s public IR materials. That gap matters because valuation sensitivity is high: even rapid revenue growth still sits against a 2021 peak valuation that looks aggressive relative to reported revenue. The overall financial verdict is therefore balanced. Karrot appears operationally real, ad-monetized, and domestically profitable, but still under-disclosed enough that investors should demand a meaningful private-company transparency discount until fuller financial statements are available.",
