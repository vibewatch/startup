        title: 披露表现：2023 年盈利里程碑与 2025 年加速
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Karrot 已经跨过消费互联网创业公司最重要的门槛：本土市场真正盈利。BusinessKorea 报道，2023 年非合并口径收入 KRW 127.6 billion、营业利润 KRW 17.3
              billion，标志着公开记录中首个年度营业利润。之后的 2026 年报道显示公司继续扩张，KMJ 和 TopDaily 均报道 2025 年合并收入约 KRW 270.7 billion、营业利润 KRW
              14.6 billion。这些后续数字也说明，业务并非只靠二手量增长。招聘、社区参与和商户主页都在给广告引擎供料。需要注意的是可比性。2023 年和 2025
              年数字不是完全可比，因为口径似乎从非合并转为合并。即便如此，方向性画面很清楚：Karrot 不再只是用户增长故事；它现在具备可信的经营杠杆和可见的变现深度。
