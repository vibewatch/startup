            body: >-
              Karrot 的客户故事从一个难以忽视的规模开始。到 2024 年，公开报道已引用韩国约 36 million 累计订阅者、接近 19 million 月活用户；后续资料又把订阅者或注册用户基数推到 40
              million 以上，甚至因指标和时间不同超过 43 million。这些数字单独看并非虚荣指标。BetaKit 补充了一个重要参与信号：韩国家庭平均每天使用 Karrot 20 到 25
              分钟，这更接近社交或社区习惯，而不是偶尔打开的分类信息工具。这有助于解释为什么广告主、雇主和本地小组都能搭在同一张图谱上。也就是说，评判 Karrot
              的客户质量，不能只看原始下载总量，而要看重复本地使用和信任。规模数据给出的总体客户结论很直接：Karrot 在韩国已经从小众应用跨入主流本地平台。
