  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型：广告驱动的本地平台，而非抽佣型市场
        blocks:
          - type: paragraph
            body: >-
              Karrot 财务模型最有意思的地方，是它没有做什么。公司似乎并不在核心二手市场向用户收取标准交易费。相反，公开报道几乎都指向广告及本地商户服务，认为它们是主要变现引擎。这很重要，因为 Karrot
              不应按经典抽佣市场估值；后者收入与 GMV 直接成比例扩张。Karrot
              的收入更依赖本地注意力、商户需求和重复参与。好处是，核心二手产品对消费者保持免费、摩擦较低，有助于放大使用和信任。代价是集中度。当广告几乎成为全部收入基础时，财务故事就更像本地媒体和商户意图平台，而不是交易型商业运营商。因此，投资人既要理解本地广告需求质量，也要理解让这些广告变得有价值的社区行为有多粘。
