      - number: '3.2'
        title: 全球市场类比：规模、履约与信任取舍
        blocks:
          - type: paragraph
            body: >-
              韩国之外，Karrot 最有用的类比对象是 Facebook Marketplace、Craigslist、OfferUp、Gumtree 和 Mercari。每一个都突出一种不同的竞争取舍。Facebook
              Marketplace 展示了原始分发和低发布摩擦。Craigslist 说明简单分类信息可以存续很久。OfferUp 是北美最清晰的本地市场类比，Mercari
              则是最重要的日本对照，因为它同时有二手规模和公开市场披露。Gumtree 对英国重要，因为它显示本地分类信息可以保持广泛、工具化，而不必社区优先。Karrot
              的独特角度在于，它试图比这些替代品更深地整合本地信任和社区使用。这也解释了为什么全球类比有参考价值但不完美。许多平台可以在库存宽度、物流灵活性或社交网络规模上打过 Karrot。能匹配 Karrot
              正试图构建的邻里身份、本地商户变现和日常使用邻接场景的组合者要少得多。
