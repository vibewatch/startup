      - number: '1.4'
        title: 盈利里程碑、超级应用指标与扩张张力
        blocks:
          - type: paragraph
            body: >-
              Karrot 最大的可信度升级在于，它不再是纯粹不计成本追增长的故事。BusinessKorea 报道，2023 年收入 KRW 127.6 billion，营业利润 KRW 17.3
              billion，确立了首个年度盈利里程碑。2026 年公开报道显示收入仍在扩张：KMJ 报道 2025 年合并收入 KRW 270.7 billion，Nate
              则强调收入极度集中在广告上。从运营看，这个应用也比简单分类信息产品更深：据称 Karrot Alba 在 2025 年处理了超过 50 million
              份申请，社区会员快速增长，广告主数量继续攀升。用户规模信号仍然很大，即便具体数字取决于日期和指标，从 2024 年 36 million 累计订阅者，到 2026 年超过 43 million
              注册用户不等。张力在地理扩张。加拿大和北美确有牵引力，但 Karrot 仍在用显著子公司层面亏损资助海外增长。因此，公司概览很有吸引力，却不是无风险：韩国本土机器看起来已经跑通，国际篇章仍需要资本和执行纪律。
