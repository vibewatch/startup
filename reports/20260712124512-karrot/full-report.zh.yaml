  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品触点：二手、信任与日常本地工具
        blocks:
          - type: paragraph
            body: >-
              Karrot 的产品身份仍从超本地二手开始，但当前产品栈显然已超出一个分类信息入口。官方国际网站和应用商店页面继续把 Karrot
              描述为面向认证邻居的免费本地市场。安全和服务页面也说明，信任是产品功能，而不只是合规层：认证资料、安全消息、社区举报和快速诈骗响应，都是用户承诺的一部分。这很重要，因为 Karrot
              的护城河取决于用户是否愿意反复本地互动。产品现在也不止二手。公开材料和近期报道显示，招聘、社区小组、商户主页和本地服务已经进入同一产品栈。结果是一条更宽的日常使用循环。Karrot
              并不只是想最大化发布量。它想让本地意图、信任和邻里注意力在多个入口反复使用，同时不丢掉最初让二手应用跑通的简单性。
