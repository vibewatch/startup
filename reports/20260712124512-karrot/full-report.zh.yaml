        blocks:
          - type: paragraph
            body: >-
              产品判断偏正面。Karrot 现在看起来像一家真正的本地平台技术公司；对一家私有消费者业务来说，它的外部工程证据少见地可见。公司有连贯的信任层、强移动端入口、可见的 AI
              功能上线，以及为广告、招聘和社区工具跨场景实验而搭建的架构。这是真资产。但执行负担也很高。Karrot
              的优势取决于邻里信任、审核、本地化和商户匹配度是否能同时运转。这比发布单一市场功能或全国性信息流产品更难。北美扩张尤其说明这一点：本地化不只是翻译，反欺诈设置、用户教育和商户采用都必须按市场调校。因此，投资人应把
