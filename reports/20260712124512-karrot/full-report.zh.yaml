            body: >-
              韩国平台政策正远离一种舒服的虚构：只要买卖双方彼此交易，中介平台就几乎不承担责任。KFTC 2026
              年针对开放市场条款的行动显示，监管者期待平台保护个人数据，避免过宽的责任豁免，并帮助交易安全顺畅。拟议中的平台公平法还会进一步明确受覆盖服务在合同、支付、记录保存、申诉和执法配合方面的义务。Karrot
              已经不是单纯的信息发布板；它混合了市场交易、本地商户发现、社区发帖和招聘。这种宽度在战略上有力，但也放大了可能引来审查的交易和审核节点。韩国二手平台欺诈在上升，而 Karrot
              的信任优先品牌意味着，即便是受控事件，也可能损伤其最重要的无形资产。实践中，这条风险向量既关乎监管边界扩张，也关乎单纯诈骗频率。
