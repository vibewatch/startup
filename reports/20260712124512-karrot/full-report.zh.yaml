          - type: paragraph
            body: >-
              用情景法最能把 Karrot 强劲的本土基本盘和仍不完整的披露接起来。按公司披露的 2023 年收入约 $95M 计算，2021 年 $2.7B 估值对应极高的二十多倍收入倍数；即便后来的 $1.7B
              私募估值，放在这条较旧收入基线上仍显得昂贵。2025 年之后的增长会缓和这个结论，但不能消除它。因此，真正的问题不是 Karrot
              是否值得溢价，而是本地品类领导力、社区习惯和早期盈利能力能支撑多少高于公开市场可比公司的溢价。答案大概率有意义，但不会没有上限。广告集中度、海外亏损和私募市场不透明，都应该打折。乐观情景存在，但公司目前给外部投资人的证据还不够。这也是下面情景区间采用估值带，而不是单一目标价的原因。
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV004
            claimRefs:
              - CV031
              - CV032
              - CV033
          - type: table
            tableRef: TV005
            claimRefs:
              - CV024
              - CV025
