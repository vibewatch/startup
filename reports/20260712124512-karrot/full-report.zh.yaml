            body: >-
              要做现实校验，公开市场可比公司比风投旧价记忆更有参考价值。Nextdoor 值得参照，因为它靠本地社区图谱和本地广告变现；Mercari 也值得参照，因为它把大规模二手流通和相邻服务做成收入。截至 2026 年
              7 月，CompaniesMarketCap 和 Stock Analysis 给 Nextdoor 的市值约 $0.9B，对应过去 12 个月收入约 $0.25B；Mercari 的市值约 ¥790B，对应过去
              12 个月收入约 ¥216B。两家公司大体都落在中个位数销售额倍数区间，而不是 Karrot 2021 年估值暗含的双位数溢价。Karrot
              不必完全按其中任何一家公司交易；韩国本土密度、参与度和盈利能力可能支撑溢价。但公开市场可比公司给这份溢价划出了硬上限：一旦越过这个上限，估值故事就更多靠乐观外推，而不是已验证的经济性。公开市场标价不能终结争论，但会大幅收窄可信区间。
