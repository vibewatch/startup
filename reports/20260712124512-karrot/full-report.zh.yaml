  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私与监管暴露
        blocks:
          - type: paragraph
            body: >-
              Karrot 处在一个尴尬的监管中间地带：它不是银行或电信公司，却处理的正是身份、位置、消息和交易周边数据，而这些会让韩国隐私法在运营上很有分量。PIPA 已广泛适用于私营企业，2026
              年修订又显著收紧制度：提高高管问责，扩大可报告泄露定义，并在严重情形下抬高潜在处罚上限。对一家产品承诺依赖邻里信任和认证本地身份的公司来说，隐私合规因此和产品质量不可分割。真正的风险不只是一次性罚款。控制失效可能在同一周期里触发监管行动、强制披露、用户不信任和变现放缓。Karrot
              同时扩展产品触点并走向国际，弱治理、投资不足或事件响应缓慢的余地，比单看收入增长所暗示的更窄。
