              越强调安全，信任事件就越容易从背景市场噪音变成品牌级事件。韩国围绕 SK Telecom 泄露的执法显示，消费者数据失败可以多快升级为创纪录罚款和全国媒体审视。即便 Karrot
              商业模式不同，制度教训仍有用：外界一旦认为消费者互联网公司在数据保护或用户安全上粗心，问题就不再局限于安全团队。它会同时变成董事会、监管者、公关和收入问题。对一家变现本地注意力的公司来说，这种声誉复合效应是最危险的下行情景之一。
