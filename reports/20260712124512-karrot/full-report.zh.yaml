        title: 融资历史、投资人质量与私募市场信号
        blocks:
          - type: paragraph
            body: >-
              Karrot 的资本故事在标题层面很清楚，尽管后期所有权细节仍属私有。TechCrunch 和 KoreaTechDesk 都报道了 2021 年 8 月 Series D 轮：融资 $162
              million，估值 $2.7 billion；多方资料也一致列出强投资人阵容，包括 DST Global、Goodwater Capital、Altos Ventures、SoftBank Ventures
              Asia 和 Aspex Management。公开公司数据库到 2026 年仍把 Karrot 归为私有、VC 支持公司，说明它尚未进入公开市场流动性阶段。争议在于今天的清算价格。Premier
              Alternatives 显示 2026 年私募市场估值约 $1.7 billion，明显低于 2021 年一级市场高点。这不能证明整张股权结构表已经被全面重估，但它释放了一个信号：私募二级估值不再自动跟随
              Karrot 早期独角兽溢价。投资人因此看到的是混合画面：历史投资人质量高，经营确有进展；但当前二级价格、稀释和治理权与 2021 年头部估值相比究竟如何，透明度只有一部分。
