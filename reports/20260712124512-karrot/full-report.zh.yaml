      - number: '3.4'
        title: 竞争判断：护城河很宽，战线也很宽
        blocks:
          - type: paragraph
            body: >-
              竞争判断偏有利，但不能简单化。Karrot 在韩国似乎拥有真实优势，因为它结合了规模、邻里信任，以及比多数同行更宽的一组本地使用场景。这让它比单一用途二手应用更难被替代。与此同时，战线很宽。Joongna 和
              Bunjang 挤压二手行为，Naver 挤压商户分发，Facebook Marketplace 和 OfferUp 提供替代本地发布入口，Nextdoor
              式社区产品争夺邻里注意力。对后续估值最有用的教训是，Karrot 不应只对标一种原型。最接近的上市可比公司，是代表社区驱动本地注意力的 Nextdoor，以及代表二手市场变现的 Mercari；OfferUp
              则是最清晰的私有本地市场同行。当投资人相信信任层能让 Karrot 比替代品更高效地连接所有这些本地行为时，它的溢价最站得住。因此，投资人应该把 Karrot 放进一篮子公司里对标，而不是只拿一个对手比较。
