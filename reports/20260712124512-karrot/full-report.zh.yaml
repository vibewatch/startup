              领导层证据在运营角色上更强，在深层治理细节上较弱。Daangn 的韩文页脚列出 Kim Yong-hyun 和 Hwang Do-yeon 为当前代表执行官，国际报道仍把联合创始人 Gary Kim
              与全球扩张紧密联系在一起。北美是最清晰可见的国际管理搭建。BusinessKorea 和 BetaKit 都称 Robert Kim 负责该地区本地化与增长，Karrot
              加拿大招聘页面和独立招聘报道也指向多伦多，说明那里是移动和 AI 人才的工程枢纽。这支持一个判断：国际扩张不是松散授权，而是公司自控的运营优先级。不过，公开资料对董事会构成、内部决策权，以及每位创始人在 2026
              年的精确日常角色仍披露有限。这个披露缺口并不推翻运营故事，但对尽调很重要，因为 Karrot 正试图把一个社区产品扩展到差异很大的市场，同时仍保持私有、相对不透明。
