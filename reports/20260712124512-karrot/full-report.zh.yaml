      - number: '2.2'
        title: 规模测算视角与真正付费者
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据支撑一个相当大的可服务背景，但不同变现路径需要不同视角。二手再流通估算把韩国二手经济放在数十万亿韩元量级，分类信息研究则勾勒出另一个包含招聘和信息发布的数十亿美元门户市场。Karrot
              并不直接变现其中大部分支出。它最显性的付费群体，是购买邻里曝光的本地商家和服务商。这让 Karrot
              更贴近韩国庞大且仍在增长的数字广告市场，尤其是移动占比很高的本地发现子板块。消费者端依然不可或缺，因为用户注意力和信任创造了广告主愿意付费购买的库存。招聘通过 Karrot Alba 增加了另一组付费者 /
              用户配对；社区使用也很重要，因为它能在非交易场景下维持高参与。市场结论是，Karrot 最好的付费机会不只是二手 GMV，而是本地受众密度和本地商户需求的结合，且这种结合可以反复变现。
