              Gemini Flash Lite 大约两周内上线了应用内翻译功能，并报道了可衡量的使用量和聊天转化提升。这很重要，因为它说明团队在产品边缘用 AI 降低本地化摩擦，而不只是把 AI 用在后台工具。InfoQ
              又增加了一层可信度：它描述了 AWS 上可扩展的功能平台，包括分布式和事件驱动架构、特征库，以及据报 70 percent 的转化提升。合在一起，这些信号显示，Karrot
              的平台为迭代式本地产品实验而优化。Karrot 不是在添加孤立功能，而是在建设能支撑跨市场推荐、广告、招聘和未来个性化的基础设施。这套架构也解释了为什么公司有资格追逐超级应用叙事，而不是停留在静态市场设计。
