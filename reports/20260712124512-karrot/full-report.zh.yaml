      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              韩国为超本地市场提供了少见的有利条件。智能手机渗透率极高，数字支付已经常态化，密集城市让邻里自提比许多西方市场容易得多。通胀、节俭行为和可持续消费规范也把二手交易从边缘行为推入主流。这些都是真实需求驱动。但超本地市场仍有硬约束。信任和反欺诈控制比简单目录产品更重要，因为用户会见陌生人，而且经常在没有平台托管的情况下交易。这个模型也依赖密度：附近买家、卖家和商户足够多，重复活动才会显得自然。最后，Karrot
              在韩国本土用户基数已经很大，未来增长不再主要靠首次获客，而是靠更深变现和相邻服务采用。这抬高了战略门槛。公司不能只是继续增加注册量，还必须保持社区活跃和广告主 ROI。
