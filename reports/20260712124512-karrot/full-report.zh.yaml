companyProfile:
  summary: >-
    Karrot（Danggeun Market / Daangn）是韩国占主导地位的邻里社区交易平台，创立于 2015 年，围绕可信邻里身份、本地二手交易、社区小组、招聘和本地商户广告搭建。公开证据显示，Karrot
    在韩国已有真实规模、早期盈利能力和有意义的产品宽度；但围绕估值争议看，披露深度仍偏私营公司水准。
