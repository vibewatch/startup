        title: 历史估值锚点
        blocks:
          - type: paragraph
            body: >-
              Karrot 的估值争论始于标题历史价格与私营公司有限披露精度之间的错位。最清晰的峰值锚点仍是 2021 年 8 月 Series D 轮，当时 TechCrunch 报道融资 $162 million，估值
              $2.7 billion。这个价格捕捉的是一个时点：韩国超本地市场领导者看起来像能定义品类的消费者平台，还有空间扩进广告、社区、招聘和国际市场。较新的锚点更弱，但仍有用：私募市场跟踪平台 Premier
              Alternatives 列出了与 2025 年 11 月二级交易有关的 $1.7 billion 估值。两个标记之间的缺口很重要，因为它显示业务继续增长，但市场愿意支付巅峰独角兽价格的程度已经回落。Karrot
              仍是私有公司，所以两组数字都不能当成内在真相。它们只是路标。正确的分析姿态，是把它们当作上下界，再用已披露收入、盈利能力和上市可比公司来压力测试。
