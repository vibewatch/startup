  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 韩国二手竞争者：Joongna、Bunjang 与 Naver 系形态
        blocks:
          - type: paragraph
            body: >-
              Karrot 在韩国本土的竞争是分层的，而不是二元的。Joongna 重要，因为它仍是韩国最知名的二手商品目的地之一，也保留着与 Karrot 起源故事重叠的社区底色。Bunjang
              重要，因为它代表了更明确由市场驱动、变现意识更强的二手模式。Naver 重要则是另一个原因：它控制着强大的分发和商户生态，即便不复制 Karrot 的具体产品流程，也能吸收本地商业和社区行为。这意味着
              Karrot 防守的不止一侧。它既面临品类专家的直接二手压力，也面临门户生态凭更大商户网络带来的间接分发压力。对 Karrot
              有利的是，公司看起来比这些替代方案更有规模化邻里身份和信任。坏消息是，韩国竞争对手不必复制 Karrot 产品的每一部分，也能挤压它的使用时长、发布量或广告主价值主张。
