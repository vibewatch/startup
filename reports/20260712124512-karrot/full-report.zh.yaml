        title: 资本配置：再投资、海外亏损与持续 R&D 强度
        blocks:
          - type: paragraph
            body: >-
              分析一旦下探到标题利润线以下，Karrot 的财务故事就更复杂。Nate 2026 年 3 月报道显示，公司仍愿意在扩张和产品开发上激进投入。据报，在加拿大子公司出现 KRW 37.5 billion
              亏损后，Karrot 向该子公司注入 KRW 20.2 billion；公司也继续投资 Karrot Pay 及配套服务。R&D 强度同样维持高位，2025 年据报支出 KRW 55.2
              billion，相对韩国互联网同行的比率突出。这很重要，因为它说明管理层的姿态：本土盈利不是终点，而是用来资助国际获客、AI
              与产品投入，以及相邻服务。这样做可能创造长期价值，但也意味着近期合并利润率可能低于单看韩国本土业务所暗示的水平。投资人正确的读法不是“已经盈利，所以风险解除”，而是“盈利足以自筹下一轮增长冲刺，但海外仍然吃资本”。
