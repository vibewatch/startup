  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Karrot 横跨多个本地数字市场
        blocks:
          - type: paragraph
            body: >-
              Karrot 很难干净放进某个教科书式市场框。公司起步于韩国二手再流通，但今天的运营故事明显横跨多个本地数字市场：二手商品、邻里社区注意力、本地分类信息、本地招聘，以及面向 SMB 的定向广告。这很重要，因为
              TAM 讨论如果直接从庞大的全国电商数字跳到 Karrot
              可实际变现的机会，很容易误导。更好的框架是分层。最宽的一层，是韩国转售和二手再流通经济，二手需求已经进入主流。更窄的一层，是数字分类信息和本地发现。再窄一层，是由邻里信任、高频本地参与和已服务社区内商户需求支撑的可变现切片。Karrot
              的机会有吸引力，因为公司能把同一张本地关系图谱复用到多个品类。但它也比泛消费互联网 TAM 幻灯片暗示的更窄，因为大量价值仍取决于高密度街区、重复使用和对信任敏感的本地交易。
