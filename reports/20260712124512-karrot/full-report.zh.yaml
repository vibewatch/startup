              - CV034
      - number: '8.4'
        title: 流动性路径与建议
        blocks:
          - type: paragraph
            body: >-
              Karrot 看起来没有被迫马上做流动性事件。业务已经走出纯烧钱阶段，韩国本土核心仍能为战略试验供血。因此，较晚的老股交易或最终 IPO，比仓促退出更现实。但通向高质量 IPO
              的路径很清楚：披露要更标准化，国际业务单位经济要更清楚，还要反复证明变现扩张不会伤害社区信任。战略收购不能排除，但 Karrot
              的价值不仅在挂牌量，也在邻里图谱质量，所以它不像纯分类信息资产那样逻辑直接。总体看，2021 年峰值估值最难支撑投资判断；2025
              年私募标记更容易解释；相对于公开市场基准，仍谈不上明显便宜。合适立场是合理到偏高，置信度中等，前提是财务透明度还要改善。更多披露会实质性帮助判断。
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: Karrot 可以支撑溢价，但不是任意溢价
            body: 韩国基本盘是真实的：品类领导力、社区密度和早期盈利能力都是有分量的优势。估值问题在于，这些优势相对公开市场可比公司应拿到多少溢价，而不是是否应有溢价。
            calloutType: strength
            claimRefs:
              - CV024
              - CV029
              - CV030
          - type: callout
            title: 峰值独角兽旧价记忆是主要估值陷阱
            body: 在 2021 年峰值，Karrot 的估值显著高于公开市场如今愿意给可比社区平台和二手流通平台支付的水平。没有更干净的披露和更强的国际化证据，投资人容易锚定旧价格，而不是今天的经济性。
            calloutType: risk
            claimRefs:
              - CV021
              - CV023
              - CV034
              - CV040
