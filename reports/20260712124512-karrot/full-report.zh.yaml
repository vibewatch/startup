      - number: '3.3'
        title: 社区相邻产品争夺注意力，不只争夺发布量
        blocks:
          - type: paragraph
            body: >-
              如果只按商业交易比较，会低估 Karrot 的真实竞争环境。Nextdoor 和 Townhall 等韩国社区应用说明，本地数字注意力可以围绕邻里身份、安全和参与来组织，而不必以商品转售开场。这很重要，因为
              Karrot 自身策略越来越依赖社区活动、招聘和商户发现，而不只是发布量。换句话说，本地注意力本身就是竞争奖品的一部分。如果用户把本地时间花在别处，即使 Karrot 的二手流动性还不错，商户变现也会变弱。这正是
              Karrot 一体化设计的优势。应用可以把用户在同一信任层内，从交易场景带到社区场景。但同样的宽度也提高了门槛：Karrot
              现在不仅要跑赢二手市场，还要跑赢邻里媒体和公民参与工具。投资人若想理解上行空间和执行负担，这个更宽的框架是必要的。
