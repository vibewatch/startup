      - number: '2.4'
        title: 替代品、相邻领域与结构性判断
        blocks:
          - type: paragraph
            body: >-
              Karrot 所处市场竞争激烈，但差异化清晰。在韩国，Joongna、Bunjang 和 Naver 系形态证明，二手需求可以由多种架构服务：老派社区、门户生态和品牌化市场。国际上，Facebook
              Marketplace、OfferUp、Craigslist、Gumtree 和 Mercari 说明，本地二手可以在完全不同的信任模型和物流假设下做大。最有意思的相邻领域是社区注意力。Nextdoor 和
              Townhall 等韩国社区应用并不是直接的二手转售克隆，但它们争夺的是同一份本地时间和邻里身份，而 Karrot 也想拥有这两样东西。这意味着，Karrot
              之后的估值不应只拿商品交易平台来评判；它也属于本地媒体和社区平台的讨论范围。结构性判断有利，但必须克制：Karrot 确实有市场空白，因为它比许多替代品更能连接信任、本地发现和商户变现；但其周边 TAM
              中真正可变现的部分，比宽泛消费互联网标签暗示的更窄。
