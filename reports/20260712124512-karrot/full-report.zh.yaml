            body: >-
              Karrot 今天最大的财务弱点，不是增长或变现证明，而是披露深度。私营公司资料页会概述融资、估值，有时还有员工估算，但不会展开毛利率、现金流、资产负债表强度、客户集中度，或任何后续二级交易的精确条款。DART
              和 KOBDi 页面展示了勤勉分析师会去哪里寻找韩国法定数据，但可访问公开记录仍达不到 Nextdoor SEC 文件或 Mercari 公开 IR
              材料那种发行人级资料包。这个缺口很重要，因为估值敏感度很高：即使收入快速增长，面对 2021 年峰值估值时仍显得偏激进，尤其相对已报道收入而言。因此，整体财务判断是平衡的。Karrot
              看起来运营真实、靠广告变现，并在韩国本土盈利；但披露仍不足，投资人应要求显著的私营公司透明度折价，直到更完整财务报表可得。
