chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与产品范围
        blocks:
          - type: paragraph
            body: >-
              理解 Karrot，要同时看它作为韩国邻里平台的本体，以及 Danggeun Market 的国际品牌翻译。韩国公司页面强调 Daangn 的首尔总部和本地社区使命，英文网站则把 Karrot
              定位为面向认证邻居、可免费本地买卖的市场。历史记录在一个核心点上保持一致：公司 2015
              年创立时，抓的是超本地二手交易，而不是全国匿名发布。这个本地优先设计今天仍然关键，因为它支撑了公司的信任模型、广告定向和社区扩张。变化来自范围。Karrot
              已经不只是一个二手应用。公开公司页面和独立报道现在描述的是一套本地超级应用栈，覆盖社区小组、招聘、小商户广告、房地产、汽车信息和支付等服务。这种宽度给了 Karrot 多个变现入口，也不必在核心 C2C
              体验里强推交易费。
