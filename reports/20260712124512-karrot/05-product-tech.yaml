    {
      "id": "ai-and-architecture",
      "title": "AI features and architecture: translation, recommendations, and the feature platform",
      "body": "Karrot’s technology evidence is stronger than many private-marketplace peers because independent developer-facing sources describe concrete implementation details. Google’s Android Developers Blog says Karrot used Firebase AI Logic and Gemini Flash Lite to launch an in-app translation feature in roughly two weeks, and it also reports measurable usage and chat-conversion uplift. That matters because it shows the team is using AI to reduce localization friction at the product edge, not only in back-office tooling. InfoQ adds a second layer of credibility by describing a scalable feature platform on AWS, including distributed and event-driven architecture, a feature store, and a reported 70 percent conversion improvement. Taken together, these signals suggest a platform optimized for iterative local-product experiments. Karrot is not just adding isolated features; it is building infrastructure that can support recommendations, ads, jobs, and future personalization across markets. That architecture helps explain why the company can credibly chase a super-app narrative rather than a static marketplace design.",
      "claimRefs": [
        "CE010",
