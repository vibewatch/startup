  topStrengths:
    - 韩国超本地网络占据主导，社区价值不止于简单信息发布。
    - 首次实现全年经营利润，2025 年继续增长，证明韩国本土核心盘经济性真实存在。
    - 可信本地身份、社区参与、招聘和 SMB 广告，比普通分类信息应用带来更丰富的变现选择。
    - 传闻中的 2025 年私募估值低于 2021 年独角兽峰值价，入场框架更理性。
  topRisks:
    - 广告集中度仍极高，估值对 SMB 需求和广告产品质量很敏感。
    - 国际扩张看起来仍在亏损，限制了今天能计入估值的全球选择权。
    - 私营公司披露太薄，相对上市可比公司给出高置信度点估值仍很难。
    - 韩国隐私和平台责任规则正在收紧，压力正落在 Karrot 依赖的信任与身份系统上。
  unresolvedGaps:
    - 标准化 2024-2026 年财务披露，包括收入桥接、利润率和现金生成。
    - 加拿大及其他重要韩国以外市场的国家级单位经济模型。
    - 2025 年二级交易的准确定价、结构及其对优先权堆栈的影响。
    - 管理层层面的证据：广告能多快扩张，同时不损害社区信任和参与度。
