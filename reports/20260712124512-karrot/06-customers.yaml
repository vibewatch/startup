    {
      "id": "customer-verdict",
      "title": "Customer verdict: strong trust-and-engagement engine, with execution still required abroad",
      "body": "The customer verdict is positive. Karrot has credible evidence of scale, engagement, merchant adoption, job-market use, and international customer traction. Very few local-commerce startups can show all of those at once. The strongest part of the story is the shared local graph: consumers, merchants, and employers all benefit from repeated neighborhood use. The biggest customer risk is not lack of demand. It is execution quality. Review complaints, international localization needs, and anti-fraud burden all suggest that Karrot must keep product quality high as it expands. That is especially important abroad, where cultural norms, trust formation, and merchant behavior differ from Korea. Investors should therefore view Karrot’s customer base as a real strength with genuine network effects, while still expecting customer-support and localization quality to remain a live diligence area for future growth rounds. Customer breadth is already obvious; consistency is the next proving ground.",
      "claimRefs": [
