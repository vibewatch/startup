  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Karrot’s customer evidence is strong because it spans both scale and variety: very large Korean user reach, visible merchant and employer adoption, and credible early traction in North America. The main open risk is not whether customers exist, but whether support, trust, and localization quality can stay strong as the platform broadens internationally."
  },
  "sections": [
    {
      "id": "scale-and-engagement",
      "title": "User scale and engagement are already too large to dismiss",
      "body": "Karrot’s customer story begins with scale that is hard to ignore. By 2024 public reporting was already citing around 36 million cumulative subscribers and nearly 19 million monthly active users in Korea, and later sources pushed the subscriber or registered-user base above 40 million and even above 43 million depending on metric and timing. These are not vanity figures in isolation. BetaKit adds an important engagement signal by reporting that the average Korean household uses Karrot for 20 to 25 minutes a day, which is much closer to a social or community habit than to an occasional classifieds utility. That helps explain why advertisers, employers, and local groups can all sit on top of the same graph. It also means Karrot’s customer quality should be judged by repeat local use and trust, not only by raw download totals. The broad customer conclusion from scale data is straightforward: Karrot has already crossed from niche app to mainstream local platform in Korea.",
      "claimRefs": [
        "CU001",
        "CU002",
        "CU003",
        "CU004",
        "CU029"
      ],
      "tableRefs": [
        "TU001",
        "TU002"
      ],
      "figureRefs": [
        "FU001"
      ]
    },
    {
      "id": "consumer-proof",
      "title": "Customer-proof surfaces show clear love, but not a flawless product",
      "body": "Public customer-proof surfaces paint a strong but realistic picture. Karrot’s own service page and Daangn’s story pages show customers describing easier selling, more trustworthy buyers, and meaningful local utility. Third-party review surfaces broadly support that positive signal. JustUseApp’s synthesized review analysis highlights ease of use and quality inventory, while app-store pages reinforce that Karrot has enough international traction to warrant multiple storefronts. But the picture is not uniformly glowing. Review sources also mention account blocks, lowball offers, location friction, bugs, and uneven seller responsiveness. That combination is actually useful for diligence. It suggests Karrot has real consumer product-market fit, yet remains exposed to the operational rough edges common in fast-scaling peer-to-peer products. In other words, the customer evidence supports adoption and utility, but it does not suggest the company has solved every marketplace-quality problem. That mix is typical of a real, scaled peer-to-peer network rather than a hollow download story.",
      "claimRefs": [
        "CU005",
        "CU006",
        "CU007",
        "CU008",
        "CU009",
        "CU026",
        "CU027",
        "CU031"
