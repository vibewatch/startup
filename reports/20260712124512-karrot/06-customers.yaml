      ]
    },
    {
      "id": "merchant-employer-and-international",
      "title": "Merchants, employers, and international users make the customer base multi-sided",
      "body": "Karrot is no longer serving just one customer type. Merchant evidence is visible in business-profile counts and advertiser growth, employer evidence is visible in Karrot Alba application volume, and international consumer evidence is visible in Canada and North America. This matters because it means Karrot’s customer graph is multi-sided in a commercially meaningful way. BetaKit reported one million Canadian users by mid-2024, Asiae pushed cumulative Canadian subscribers above two million by early 2025, and TikTok’s case study says the brand passed one million active users in North America. The product is also being adapted for those customers rather than merely translated. Google’s Android post notes that about 30 percent of North American users have non-English device settings, which is why AI translation mattered. Combined with Toronto-based hiring and localized acquisition campaigns, that makes international traction look like a real operating bet rather than a passive download spillover.",
