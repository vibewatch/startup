evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: secondary transaction pricing
    missingEvidence: Exact share price, share count, and security terms for the reported 2025 secondary transactions.
    whyItMatters: >-
      Without transaction terms, investors cannot tell whether later private-market marks represent a broad repricing or
      a narrow block trade.
    diligencePath: Request the 2025 secondary cap-table update and board approvals from management.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: material
    topic: cap table and governance
    missingEvidence: >-
      Current cap table, preference stack, board seats, and investor protective provisions after the 2021 Series D and
      later secondaries.
    whyItMatters: >-
      Headline funding history alone is not enough to judge dilution, control, or true entry economics in a private
      company.
    diligencePath: Request a current cap table, charter summary, and shareholder rights schedule.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: audited financial statements
    missingEvidence: A publicly accessible audited 2025 annual report or equivalent financial statement package for Karrot.
    whyItMatters: >-
      Press summaries provide only selected revenue and profit numbers and do not reconcile standalone, consolidated,
      cash-flow, or balance-sheet detail.
    diligencePath: Request audited statutory financials and management discussion for FY2024 and FY2025.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: minor
    topic: regional traction by market
    missingEvidence: Comparable public KPIs for the UK, US, Japan, and Canada by region or country after 2025.
    whyItMatters: >-
      The international thesis depends on whether traction is concentrated in Canada or shared across multiple
