      ]
    },
    {
      "id": "competitive-verdict",
      "title": "Competitive verdict: broad moat, broad battlefront",
      "body": "The competitive verdict is favorable but not simplistic. Karrot appears to hold a real advantage in Korea because it combines scale, neighborhood trust, and a broader set of local use cases than most peers. That makes it harder to dislodge than a single-purpose resale app. At the same time, the battlefront is broad. Joongna and Bunjang pressure resale behavior, Naver pressures merchant distribution, Facebook Marketplace and OfferUp provide alternative local listing surfaces, and Nextdoor-style community products compete for neighborhood attention. The most useful lesson for later valuation is that Karrot should not be benchmarked against only one archetype. The closest public comparators are Nextdoor for community-led local attention and Mercari for resale-marketplace monetization, while OfferUp is the clearest private local-marketplace peer. Karrot’s premium is most defensible when investors believe the trust layer lets it connect all of these local behaviors more efficiently than its substitutes can. Investors should therefore benchmark Karrot against a basket, not a single rival.",
