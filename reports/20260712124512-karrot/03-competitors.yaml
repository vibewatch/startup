    {
      "id": "community-attention",
      "title": "Community adjacencies compete for attention as much as for listings",
      "body": "A purely commerce-only comparison understates Karrot’s real competitive environment. Nextdoor and Korean community apps such as Townhall show that local digital attention can be organized around neighborhood identity, safety, and participation without leading with goods resale. That matters because Karrot’s own strategy increasingly depends on community activity, jobs, and business discovery, not just on listing volume. In other words, local attention is part of the competitive prize. If users spend their local time elsewhere, Karrot’s merchant monetization gets weaker even if its resale liquidity remains decent. This is where Karrot’s integrated design helps. The app can move users between commerce and community use cases inside one trust layer. But the same breadth also raises the bar: Karrot now has to outperform not only resale marketplaces but also neighborhood media and civic-participation tools. That broader framing is essential for investors who want to understand both the upside and the execution burden.",
      "claimRefs": [
        "CP013",
        "CP014",
        "CP015",
        "CP022",
        "CP023",
        "CP024",
        "CP025"
      ],
      "tableRefs": [
