      - number: '2.4'
        title: Substitutes, adjacencies, and structural verdict
        blocks:
          - type: paragraph
            body: >-
              Karrot’s market structure is competitive but differentiated. In Korea, Joongna, Bunjang, and Naver-linked
              formats prove that secondhand demand can be served through several architectures: old-school communities,
              portal ecosystems, and branded marketplaces. Internationally, Facebook Marketplace, OfferUp, Craigslist,
              Gumtree, and Mercari show that local resale can scale through very different trust models and shipping
              assumptions. The most interesting adjacency is community attention. Nextdoor and Korean community apps
              such as Townhall are not direct resale clones, but they compete for the same local time and neighborhood
              identity that Karrot wants to own. That means Karrot’s later valuation should not be judged only against
              goods marketplaces; it also belongs in the conversation about local media and community platforms. The
              structural verdict is favorable but disciplined: Karrot has real market whitespace because it connects
              trust, local discovery, and merchant monetization better than many substitutes, but the monetizable slice
              of its surrounding TAM is narrower than the broad consumer-internet labels imply.
            claimRefs:
