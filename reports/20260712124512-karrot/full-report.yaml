  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Privacy and Regulatory Exposure
        blocks:
          - type: paragraph
            body: >-
              Karrot sits in an awkward regulatory sweet spot: it is not a bank or telecom, but it handles exactly the
              kind of identity, location, messaging, and transaction-adjacent data that makes Korean privacy law
              operationally consequential. PIPA already applies broadly across private businesses, and the 2026
              amendments materially harden the regime by elevating executive accountability, widening the definition of
              reportable breaches, and lifting the potential penalty ceiling in severe cases. For a company whose
              product promise depends on neighborhood trust and verified local identity, privacy compliance is therefore
              inseparable from product quality. The relevant risk is not simply a one-off fine. A control failure can
              trigger regulatory action, mandatory disclosure, user distrust, and slower monetization in the same cycle.
              Because Karrot is simultaneously scaling product surfaces and expanding internationally, the margin for
              weak governance, underinvestment, or slow incident response is narrower than raw revenue growth might
              imply.
