      - number: '1.3'
        title: Funding history, investor quality, and private-market signals
        blocks:
          - type: paragraph
            body: >-
              Karrot’s capital story is clear at the headline level even though later-stage ownership detail is still
              private. TechCrunch and KoreaTechDesk both reported the August 2021 Series D at $162 million and a $2.7
              billion valuation, and multiple sources consistently name a strong roster of investors including DST
              Global, Goodwater Capital, Altos Ventures, SoftBank Ventures Asia, and Aspex Management. Public profile
              databases continue to classify Karrot as private and venture-backed in 2026, confirming that the company
              has not yet moved to public-market liquidity. What is less settled is today’s clearing price. Premier
              Alternatives shows a 2026 private-market valuation around $1.7 billion, materially below the 2021
              primary-round peak. That does not prove a broad-based repricing of the whole cap table, but it does signal
              that private secondary marks are no longer automatically tracking Karrot’s earlier unicorn premium.
              Investors therefore get a mixed picture: high-quality historical backers and real operating progress, but
              only partial transparency on how current secondary prices, dilution, and governance rights compare with
              the 2021 headline valuation.
