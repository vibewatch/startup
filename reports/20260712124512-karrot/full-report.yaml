  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Korean resale rivals: Joongna, Bunjang, and Naver-linked formats'
        blocks:
          - type: paragraph
            body: >-
              Karrot’s domestic competition is layered rather than binary. Joongna matters because it is still one of
              the best-known Korean used-goods destinations and preserves a community heritage that overlaps with
              Karrot’s origin story. Bunjang matters because it represents a more explicitly marketplace-led and
              monetization-conscious resale model. Naver matters for a different reason: it controls a powerful
              distribution and merchant ecosystem that can absorb local commerce and community behaviors even without
              copying Karrot’s exact product flow. This means Karrot is not defending only one flank. It faces direct
              resale pressure from category specialists and indirect distribution pressure from portal ecosystems with
              larger merchant networks. The good news for Karrot is that the company appears to have stronger
              neighborhood identity and trust at scale than these alternatives. The bad news is that Korean competitors
              do not have to copy every part of Karrot’s product to pressure its time-spent, listings, or advertiser
              value proposition.
