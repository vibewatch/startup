      - number: '7.2'
        title: Platform Liability and Fraud Risk
        blocks:
          - type: paragraph
            body: >-
              Korean platform policy is moving away from the comfortable fiction that intermediaries bear little
              responsibility if buyers and sellers transact with one another. The KFTC’s 2026 action on open-market
              terms shows that regulators expect platforms to protect personal data, avoid overbroad liability waivers,
              and help ensure transactions are safe and smooth. Proposed platform-fairness legislation would go even
              further by specifying contractual, payment, recordkeeping, grievance, and enforcement obligations for
              covered services. Karrot is not a plain listings board anymore; it blends marketplace trading, local
              business discovery, community posting, and jobs. That breadth is strategically powerful, but it also
              multiplies the number of transaction and moderation moments that can attract scrutiny. Fraud on secondhand
              platforms is rising in Korea, and Karrot’s trust-first brand means that even a contained incident can
              damage its most important intangible asset. In practice, this risk vector is about regulatory perimeter
              expansion as much as pure scam frequency.
