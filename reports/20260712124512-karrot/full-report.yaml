    title: Selected public comp market values
    type: bar
    layout: standard
    summary: >-
      Public markets value local-community and recommerce leaders at levels that offer a hard check on Karrot’s private
      premium.
    data:
      items:
        - label: Karrot 2021 anchor
          value: 2.7
        - label: Karrot 2025 private mark
          value: 1.7
        - label: Nextdoor market cap
          value: 0.91
        - label: Mercari market cap (USD bn eq., directional)
          value: 5.5
    claimRefs:
