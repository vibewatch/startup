chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and product scope
        blocks:
          - type: paragraph
            body: >-
              Karrot should be understood as both a Korean neighborhood platform and an international brand translation
              of Danggeun Market. The Korean corporate surfaces emphasize Daangn’s Seoul base and local-community
              mission, while the English site presents Karrot as a verified-neighbor marketplace for free local buying
              and selling. The historical record is consistent on one core point: the company was founded in 2015 around
              hyperlocal secondhand trading rather than nationwide anonymous listings. That local-first design still
              matters because it underpins the company’s trust model, ad targeting, and community expansion. What
              changed over time is scope. Karrot is no longer only a resale app. Public company pages and independent
              reporting now describe a local super-app stack that includes community groups, jobs, small-business ads,
              real estate, automotive listings, and payment-related services. That breadth gives Karrot multiple
              monetization surfaces without forcing transaction fees into the core C2C experience.
