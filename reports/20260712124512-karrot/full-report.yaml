  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model: an ad-led local platform, not a take-rate marketplace'
        blocks:
          - type: paragraph
            body: >-
              Karrot’s financial model is most interesting for what it does not do. The company does not appear to
              charge users a standard transaction fee on its core secondhand marketplace. Instead, public reporting
              points overwhelmingly to advertising and related local business services as the primary monetization
              engine. That matters because Karrot should not be valued like a classic take-rate marketplace whose
              revenue scales in direct proportion to GMV. Its revenue depends more on local attention, merchant demand,
              and repeat engagement. The upside is that this keeps the core resale product free and relatively
              low-friction for consumers, which can help scale usage and trust. The trade-off is concentration. When
              advertising becomes almost the entire revenue base, the financial story starts to look more like a local
              media and merchant-intent platform than a transactional commerce operator. Investors therefore need to
              understand both the quality of local ad demand and the stickiness of the community behaviors that make
              those ads valuable.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI031
