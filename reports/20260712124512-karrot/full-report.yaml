      - number: '3.2'
        title: 'Global marketplace analogues: scale, shipping, and trust trade-offs'
        blocks:
          - type: paragraph
            body: >-
              Outside Korea, Karrot’s most useful analogues are Facebook Marketplace, Craigslist, OfferUp, Gumtree, and
              Mercari. Each highlights a different competitive trade-off. Facebook Marketplace demonstrates raw
              distribution and low listing friction. Craigslist shows how long simple classifieds can persist. OfferUp
              is the cleanest local-marketplace analogue in North America, while Mercari is the most important Japanese
              comparator because it pairs resale scale with public-market disclosure. Gumtree matters for the UK because
              it shows how local classifieds can stay broad and utilitarian rather than community-first. Karrot’s
              distinctive angle is that it tries to integrate local trust and community usage more deeply than these
              substitutes do. That helps explain why global analogues are informative but imperfect. Many can beat
              Karrot on inventory breadth, shipping flexibility, or social-network scale. Fewer can match the
              combination of neighborhood identity, local merchant monetization, and daily-use adjacency that Karrot is
              trying to build.
