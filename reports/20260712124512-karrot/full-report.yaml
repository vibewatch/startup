      - number: '2.2'
        title: Sizing lenses and who actually pays
        blocks:
          - type: paragraph
            body: >-
              The public market-sizing evidence supports a substantial addressable backdrop, but different lenses matter
              for different monetization paths. Recommerce estimates put the Korean secondhand economy at tens of
              trillions of won, while classifieds research frames a separate multi-billion-dollar portals market that
              includes jobs and listings. Karrot does not monetize most of that spend directly. Instead, the company’s
              most visible payer segment is local merchants and service businesses buying neighborhood visibility. That
              ties Karrot more closely to South Korea’s large and still-growing digital ad market, especially its
              mobile-heavy local discovery subsegment. The consumer side remains essential because user attention and
              trust create the inventory that advertisers are paying for. Jobs add another payer/user pairing through
              Karrot Alba, and community usage matters because it can keep engagement high even outside commerce
              sessions. The market takeaway is that Karrot’s best payer opportunity is not just resale GMV; it is the
              combination of local audience density and local business demand that can be monetized repeatedly.
