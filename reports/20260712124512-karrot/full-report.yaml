  - id: FV003
    title: Valuation checkpoint KPIs
    type: kpi
    layout: standard
    summary: Four datapoints capture why Karrot can still command a premium yet remains hard to underwrite.
    data:
      items:
        - label: 2021 peak valuation
          value: $2.7B
        - label: 2025 private mark
          value: $1.7B
        - label: Nextdoor market cap
          value: $0.91B
        - label: Karrot 2023 public revenue base
          value: ~$95M
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV006
