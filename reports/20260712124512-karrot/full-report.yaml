            body: >-
              Karrot’s core business is no longer proving product-market fit; it is proving that a trusted hyperlocal
              network can compound into a diversified, durable earnings engine. The near-term risk is that monetization
              becomes less diversified than usage suggests. Public reporting indicates revenue still depends
              overwhelmingly on advertising, while overseas operations remain loss-making and R&D intensity remains
              elevated. That combination is manageable if local ad demand stays healthy and international traction
              improves, but it becomes uncomfortable if ad budgets soften, user experience deteriorates under
              monetization load, or overseas markets fail to clear fixed costs. Competition intensifies this problem
              because larger ecosystems can subsidize local-commerce experiments longer than Karrot can. Private-company
              disclosure adds another layer of risk: outside investors see selected metrics and occasional transactions
              rather than the quarterly transparency they would get from a listed peer. The result is a strong franchise
              carrying a risk stack that deserves continuous monitoring rather than complacency. It still compounds
