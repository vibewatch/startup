      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Korea offers unusually favorable conditions for a hyperlocal marketplace. Smartphone penetration is
              extremely high, digital payments are normal, and dense cities make neighborhood pickup far easier than in
              many Western markets. Inflation, thrift behavior, and sustainability norms have also pushed resale from
              fringe behavior into the mainstream. Those are genuine demand drivers. But hyperlocal marketplaces still
              carry hard constraints. Trust and fraud controls matter more than they do for a simple directory because
              users are meeting strangers and often transacting without platform escrow. The model is also
              density-dependent: it works best where there are enough nearby buyers, sellers, and merchants for repeat
              activity to feel natural. Finally, as Karrot’s user base gets very large domestically, future growth
              becomes less about first-time acquisition and more about deeper monetization and adjacent service
              adoption. That raises the strategic bar. The company has to keep community activity high and advertiser
              ROI strong, not just keep adding sign-ups.
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
              - CM031
              - CM034
