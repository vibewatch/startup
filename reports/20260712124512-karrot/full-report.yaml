            title: The biggest near-term risk is trust-system failure under a harsher regulatory regime
            body: >-
              Karrot’s brand and monetization both depend on user confidence in safe, neighborhood-scale interactions.
              Korean privacy and platform policy are both moving toward stronger corporate accountability, so a single
              major incident could hit product trust, regulation, and economics together.
            calloutType: risk
            claimRefs:
              - CR004
              - CR012
              - CR024
              - CR029
          - type: callout
            title: Domestic franchise strength buys time, but not immunity
            body: >-
              Karrot’s scale and community habit give it room to invest in controls and iterate on monetization. The
              report’s central caution is not that the business is weak, but that its strongest differentiator—trusted
              local identity—also creates the most fragile failure mode.
            calloutType: strength
            claimRefs:
              - CR022
              - CR031
              - CR040
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Historical Valuation Anchors
        blocks:
          - type: paragraph
            body: >-
              Karrot’s valuation debate starts with a mismatch between headline historical prices and the limited
              precision of private-company disclosure. The clearest peak anchor remains the August 2021 Series D, when
              TechCrunch reported a $162 million round at a $2.7 billion valuation. That price captured a moment when
              Korea’s hyperlocal marketplace leader looked like a category-defining consumer platform with room to
              expand into advertising, community, jobs, and international markets. The more recent anchor is weaker but
              still useful: private-market tracker Premier Alternatives lists a $1.7 billion valuation tied to a
              November 2025 secondary transaction. The gap between those two marks matters because it suggests the
              business continued growing while the market’s willingness to pay peak-unicorn prices moderated. Since
              Karrot is still private, neither figure should be treated as intrinsic truth. They are waypoints. The
              right analytical posture is to use them as bookends and then pressure-test them against disclosed revenue,
              profitability, and public comparables.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
      - number: '8.2'
        title: Public Comparable Sanity Check
        blocks:
          - type: paragraph
            body: >-
              For a reality check, public-market comparables are more informative than venture nostalgia. Nextdoor is
              relevant because it monetizes a local-community graph and local advertising; Mercari is relevant because
              it monetizes large-scale recommerce and adjacent services. As of July 2026, CompaniesMarketCap and Stock
              Analysis place Nextdoor around $0.9 billion of market value on roughly $0.25 billion of trailing revenue,
              while Mercari trades around ¥790 billion of market value on roughly ¥216 billion of trailing revenue. Both
              end up in broadly mid-single-digit sales-multiple territory rather than the kind of double-digit premium
              implied by Karrot’s 2021 mark. That does not mean Karrot should trade exactly like either business.
              Karrot’s Korean density, engagement, and profitability profile may justify a premium. But public comps
              provide a hard ceiling on how much of that premium is reasonable before the valuation story becomes
              dependent on optimistic extrapolation rather than demonstrated economics. Public marks do not settle the
              debate, but they sharply narrow the credible range.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
          - type: table
            tableRef: TV002
            claimRefs:
              - CV011
              - CV015
              - CV020
              - CV023
          - type: table
            tableRef: TV003
            claimRefs:
              - CV021
              - CV022
              - CV014
              - CV018
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV015
      - number: '8.3'
        title: Scenario Framework
        blocks:
          - type: paragraph
            body: >-
              A scenario approach is the cleanest way to bridge Karrot’s strong domestic franchise and its
              still-incomplete disclosure. Using the company’s roughly $95 million disclosed 2023 revenue, the 2021 $2.7
              billion valuation reads as an extremely rich high-twenties revenue multiple. Even the later $1.7 billion
              private mark still looks expensive on that older revenue base. More recent 2025 growth softens that
              conclusion, but does not eliminate it. The right question is therefore not whether Karrot deserves a
              premium, but how much premium to public comps is justified by local category leadership, community habit,
              and early profitability. The answer is probably meaningful but not unlimited. Ad concentration, overseas
              losses, and private-market opacity all deserve discounts. A bull case exists, but it requires more proof
              than the company currently gives outsiders. That is why the scenario ranges below lean on valuation bands
              rather than one exact target.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV004
            claimRefs:
              - CV031
              - CV032
              - CV033
          - type: table
            tableRef: TV005
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV006
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV026
              - CV027
              - CV032
              - CV033
              - CV034
      - number: '8.4'
        title: Liquidity Path and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Karrot does not appear forced into an immediate liquidity event. The business has moved beyond pure
              burn-stage startup economics, and the domestic core can still fund strategic experimentation. That makes a
              later secondary or eventual IPO more realistic than a rushed exit. But the path to a high-quality IPO is
              obvious: better standardized disclosure, clearer international unit economics, and repeated proof that
              monetization expands without degrading community trust. Strategic acquisition cannot be ruled out, yet the
              logic is less straightforward than for a pure classifieds asset because Karrot’s value lies in
              neighborhood graph quality as much as listings volume. On balance, the company looks hardest to underwrite
              at the 2021 peak valuation, easier to justify around the 2025 private mark, and still not plainly cheap
              relative to public benchmarks. The right stance is fair-to-stretched with medium confidence, pending
              cleaner financial transparency. More disclosure would help materially.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Karrot can justify a premium, just not any premium
            body: >-
              The Korean franchise is real: category leadership, community density, and early profitability are
              meaningful advantages. The valuation question is about how much premium those advantages deserve over
              public comps, not whether they deserve one at all.
            calloutType: strength
            claimRefs:
              - CV024
              - CV029
              - CV030
          - type: callout
            title: Peak-unicorn nostalgia is the main valuation trap
            body: >-
              At the 2021 peak, Karrot looked dramatically richer than what public markets currently pay for comparable
              community and recommerce platforms. Without cleaner disclosure and stronger international proof, investors
              risk anchoring to an old price rather than today’s economics.
            calloutType: risk
            claimRefs:
              - CV021
              - CV023
              - CV034
              - CV040
