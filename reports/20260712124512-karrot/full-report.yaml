  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk vector
      - Why it matters
      - Current signal
      - Near-term monitor
    rows:
      - - Privacy enforcement
        - Karrot handles identity, location, messaging, and transaction data
        - 2026 PIPA amendments raise accountability and penalties
        - Board-approved privacy controls and incident drills
      - - Intermediary liability
        - Regulators expect safer transactions and fairer terms
        - KFTC corrected broad waivers at major platforms
        - Changes in Karrot terms, refunds, and dispute handling
      - - Fraud and scams
        - Trust incidents directly impair brand promise
        - Secondhand-platform damages reportedly surged
        - Complaint rates, verified-user abuse, off-platform scams
      - - Cybersecurity breach
        - Large consumer breach can trigger fines and churn
        - SK Telecom received record sanction after breach
        - Detection speed, notification readiness, postmortem quality
      - - Ad concentration
        - Revenue mix may be narrower than usage mix
        - Nate said 99% of 2025 revenue came from ads
        - SMB advertiser retention and ad load
      - - International execution
        - Overseas growth still consumes capital
        - 2025 overseas subsidiaries remained loss-making
        - Country-level unit economics and retention
      - - Competitive pressure
        - Bigger ecosystems can subsidize local commerce
        - Korean ecommerce remains contested
        - Merchant multihoming and pricing pressure
      - - Disclosure/liquidity
        - Private status limits outside visibility
        - Sparse public reporting between transactions
        - Secondary pricing, fundraising, or IPO signals
