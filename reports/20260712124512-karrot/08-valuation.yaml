    {
      "id": "public-comp-sanity-check",
      "title": "Public Comparable Sanity Check",
      "body": "For a reality check, public-market comparables are more informative than venture nostalgia. Nextdoor is relevant because it monetizes a local-community graph and local advertising; Mercari is relevant because it monetizes large-scale recommerce and adjacent services. As of July 2026, CompaniesMarketCap and Stock Analysis place Nextdoor around $0.9 billion of market value on roughly $0.25 billion of trailing revenue, while Mercari trades around ¥790 billion of market value on roughly ¥216 billion of trailing revenue. Both end up in broadly mid-single-digit sales-multiple territory rather than the kind of double-digit premium implied by Karrot’s 2021 mark. That does not mean Karrot should trade exactly like either business. Karrot’s Korean density, engagement, and profitability profile may justify a premium. But public comps provide a hard ceiling on how much of that premium is reasonable before the valuation story becomes dependent on optimistic extrapolation rather than demonstrated economics. Public marks do not settle the debate, but they sharply narrow the credible range.",
