    "number": 8,
    "title": "Valuation",
    "summary": "Karrot’s 2021 $2.7 billion peak price looks difficult to justify against current public comparables, but the later ~$1.7 billion private-market mark is more defensible if investors grant a real premium for Korea-scale local network density and early profitability. The company is not obviously cheap, yet it is no longer priced like an untouchable consumer-internet outlier either."
  },
  "sections": [
    {
      "id": "historical-anchors",
      "title": "Historical Valuation Anchors",
      "body": "Karrot’s valuation debate starts with a mismatch between headline historical prices and the limited precision of private-company disclosure. The clearest peak anchor remains the August 2021 Series D, when TechCrunch reported a $162 million round at a $2.7 billion valuation. That price captured a moment when Korea’s hyperlocal marketplace leader looked like a category-defining consumer platform with room to expand into advertising, community, jobs, and international markets. The more recent anchor is weaker but still useful: private-market tracker Premier Alternatives lists a $1.7 billion valuation tied to a November 2025 secondary transaction. The gap between those two marks matters because it suggests the business continued growing while the market’s willingness to pay peak-unicorn prices moderated. Since Karrot is still private, neither figure should be treated as intrinsic truth. They are waypoints. The right analytical posture is to use them as bookends and then pressure-test them against disclosed revenue, profitability, and public comparables.",
      "claimRefs": [
