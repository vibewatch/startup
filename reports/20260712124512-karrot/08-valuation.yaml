    {
      "id": "scenario-framework",
      "title": "Scenario Framework",
      "body": "A scenario approach is the cleanest way to bridge Karrot’s strong domestic franchise and its still-incomplete disclosure. Using the company’s roughly $95 million disclosed 2023 revenue, the 2021 $2.7 billion valuation reads as an extremely rich high-twenties revenue multiple. Even the later $1.7 billion private mark still looks expensive on that older revenue base. More recent 2025 growth softens that conclusion, but does not eliminate it. The right question is therefore not whether Karrot deserves a premium, but how much premium to public comps is justified by local category leadership, community habit, and early profitability. The answer is probably meaningful but not unlimited. Ad concentration, overseas losses, and private-market opacity all deserve discounts. A bull case exists, but it requires more proof than the company currently gives outsiders. That is why the scenario ranges below lean on valuation bands rather than one exact target.",
      "claimRefs": [
