      - ["Named customer reference", "STF Consulting quotation on SOC trust", "Published 2026-07-08", "Customer-quoted company release", "medium", "Provides qualitative reference evidence", "Deployment duration, contract status, and measurable outcome are absent"]
    notes: "Values retain the source's qualifiers and periods. No row is a comparable cohort series; null denominator means the public source does not define the population or measurement method."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: "Publicly named references and partner material found in the assigned 2025-2026 source pool; this is not a complete customer enumeration."
