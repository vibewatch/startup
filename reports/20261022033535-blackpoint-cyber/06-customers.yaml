    rows:
      - [FutureSafe, MSP partner, "MDR, proactive SOC monitoring, white-glove support, and SMB client delivery", "Partnership described since January 2024; production status not independently verified", "Simplified operations, scalable delivery, and enterprise-level protection are described", "Partner-authored benefits; no customer count, renewal, or measured security outcome"]
      - [STF Consulting, Customer / consulting partner, "Blackpoint AI SOC Agent for identity threat detection and response", "Named quotation; deployment scope not stated", "Says Blackpoint's SOC was a trusted extension of the team and that AI plus analysts provides confidence", "Company press release; no incident, baseline, or independently audited result"]
      - [Liberty Technology, MSP / vCISO reference, "Real-time response and partner security operations", "Named testimonial on company MDR page; deployment scope not stated", "Says Blackpoint responded in real time and acted as a true partner", "Company-hosted testimonial; no duration, contract, or quantified outcome"]
    notes: "Partial enumeration of named references in the assigned pool. Production status, paid status, deployment scale, and outcomes are not established unless explicitly stated; company-hosted and partner-issued references are not independent retention evidence."
    claimRefs: [CU007, CU008, CU009, CU014]
