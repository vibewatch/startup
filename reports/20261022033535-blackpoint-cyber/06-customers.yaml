artifact: customers
slug: blackpoint-cyber
runDate: 2026-10-22
company:
  name: Blackpoint Cyber
chapter:
  number: 6
  title: Customers
  summary: Blackpoint Cyber's public customer motion is clearly MSP-first, with partner-facing proof of deployment and a platform pitch aimed at consolidating security operations. The evidence supports channel adoption and workflow fit, but does not disclose a customer denominator, renewal data, cohort retention, or independently verified outcomes.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      The consistent commercial pattern is channel-led rather than direct-to-business. Blackpoint's MDR page says the service is purpose-built for MSPs, while the FutureSafe partnership describes MSPs using Blackpoint to deliver enterprise-level protection to SMB clients without an in-house security team. This creates at least two customer layers: the MSP or MSSP that buys, packages, and operates the relationship, and the SMB or mid-market end customer whose endpoints, cloud environments, and identities are protected. ToolsInfo similarly describes Blackpoint as an outsourced SOC for MSP clients and lists multi-tenant operation, integrations, and support features. That structure can support efficient partner distribution, but public sources do not quantify partner concentration, end-customer concentration, average contract value, or attach rates.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption trajectory and proof quality
    body: >-
      Public adoption evidence is strongest at the channel and service-design level. The company states that more than 1,800 MSPs worldwide have transformed their security operations with its unified approach, and that it processes tens of millions of security events daily; both are company-reported metrics without a disclosed denominator, time series, or independent audit. FutureSafe provides a partner-side account of working with Blackpoint since January 2024 and describes integration, 24/7 monitoring, and white-glove support. Blackpoint's 2026 ITDR announcement adds a named customer quotation from STF Consulting, while the company site quotes Liberty Technology's vCISO on real-time response. These references demonstrate named partner or customer advocacy, but they do not establish production scope, paid-seat count, renewal, or outcome attribution.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: retention-expansion-risk
    title: Durability, expansion, and concentration risks
    body: >-
      The product and channel design offers a plausible expansion loop: an MSP can start with managed detection and response, add endpoint and cloud coverage, and extend into identity threat detection and response. The MDR page describes incident insights feeding future security improvements across a client base, while the 2026 announcement says the AI SOC Agent is included with all ITDR service tiers. However, this is a product packaging and workflow hypothesis, not measured land-and-expand performance. No assigned source reports NRR, GRR, churn, renewal rates, cohort behavior, contract length, satisfaction scores, or the share of revenue from the largest partners. A comparison article also says Blackpoint does not publish pricing and sells through MSPs/MSSPs, so procurement friction and partner dependence remain material diligence items.
    claimRefs: [CU010, CU011, CU012, CU013, CU016]
callouts:
  - calloutType: strength
    title: Channel fit is unusually explicit
    body: Blackpoint's public materials repeatedly connect the buyer, delivery model, and operating workflow to MSPs, including multi-tenant operation, partner packaging, and outsourced SOC coverage for SMB clients.
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: Adoption is not the same as retention
    body: The public record contains partner testimonials and a large company-reported MSP count, but no denominator, cohort table, renewal metric, or independently verified customer outcome. Treat customer durability and concentration as open underwriting questions.
    claimRefs: [CU005, CU008, CU012, CU013, CU016]
  - calloutType: recommendation
    title: Request cohort and concentration evidence
    body: Before underwriting expansion, request monthly active MSP and end-customer counts, logo and revenue concentration, gross and net retention by cohort, renewal and churn definitions, contract terms, and production-versus-pilot status for named references.
    claimRefs: [CU012, CU013, CU014]
