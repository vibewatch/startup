company:
  name: Blackpoint Cyber
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a strategically differentiated, MSP-first MDR thesis, but it does not support a precise current valuation or return model. The appropriate stance is track/research-more until management provides current revenue quality, retention, margin, cap-table, and financing-term evidence.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: Blackpoint's investment case is a channel-specific operating model rather than a disclosed financial-growth story. Independent directories describe a 24/7 human-led MDR service for MSPs and their SMB and mid-market customers, while the company describes an AI-plus-human identity response capability. The evidence suggests differentiated response authority and bundled platform scope, but most performance claims remain company- or directory-reported. The anti-thesis is that channel concentration, opaque pricing, absent retention and margin data, and unverified customer economics can make strategic differentiation difficult to translate into an underwritten return. A track recommendation therefore reflects quality of the product thesis without assuming that the financing price is attractive.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: price-discipline
    title: Price discipline and financing context
    body: >
      The public financing record is incomplete and internally inconsistent across third-party sources. StartupHub records $197 million of total funding and a $190 million Series C on June 8, 2023; Growth Engineer reports $214 million total raised while also listing an unknown Series D. Neither source establishes post-money valuation, share price, liquidation preferences, debt, dilution, or the current capital structure. Pricing is similarly opaque: a competitor comparison says Blackpoint uses custom partner quotes and does not publish pricing, while another directory reports an $8–15 per-endpoint range without an independently verified contract sample. These gaps preclude a defensible revenue multiple, DCF, or target return today.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV003]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence gates
    body: A bull case requires evidence that MSP distribution converts into durable, expanding recurring revenue with acceptable gross margins and low concentration, while the AI and human SOC model improves response economics without increasing liability or false-positive costs. The base case is a differentiated but privately opaque growth company that merits monitoring rather than immediate underwriting. The bear case combines undisclosed terms with pricing pressure, partner or customer concentration, slower commercialization, or a down-round after growth expectations reset. The current record does not support probability-weighted dollar valuations, so the scenarios use decision gates and valuation discipline instead of false precision. A financing decision should wait for a current cap table, cohort metrics, audited or management financials, and customer concentration data.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: []
    figureRefs: []
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current view, Decision implication]
    rows:
      - [Recommendation, Track / research-more, Do not underwrite an entry price yet]
      - [Confidence, "Medium on strategic thesis; low on price", "Separate business-quality confidence from valuation confidence"]
      - [Risk rating, Medium-high, "Require financing, concentration, and margin diligence"]
      - [Valuation stance, Unknown, No public post-money valuation or terms located]
    notes: Public evidence is directional and mixes company claims with third-party directory and comparison pages; null or unknown valuation inputs are not estimates.
    claimRefs: [CV001, CV006, CV010, CV015]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - [MSP-first distribution can be differentiated, "MDR is described as built specifically for MSPs and their customers", "Cohort retention and partner productivity by vintage"]
      - [Response authority may improve product value, "Comparison describes autonomous response on high-confidence threats", "Independent incident outcomes and false-positive data"]
      - [Platform bundling may support wallet share, "Comparison lists MDR, ITDR, cloud posture, application control, vulnerability management, and SIEM", "Attach rates, gross margin by module, and churn by bundle"]
      - [Opaque economics undermine entry discipline, "Post-money valuation and terms are not disclosed in retained sources", "Current cap table, preferences, debt, and round price"]
    notes: The evidence signals are not independent performance benchmarks; the final column identifies measurable diligence that could move the recommendation.
    claimRefs: [CV001, CV003, CV004, CV010, CV012]
  - id: TV003
    title: Bull / base / bear scenario gates
    columns: [Scenario, Operating assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Retention, expansion, margins, and partner concentration clear diligence thresholds", "A verified current round price is below a supported forward recurring-revenue multiple", "Conditional; no public operating dataset", "Churn or concentration misses the agreed threshold"]
      - [Base, "Strategic differentiation persists but financial disclosure remains limited", "Track and seek a price/terms reset before committing capital", "Most supportable on current evidence", "Management cannot provide auditable metrics or terms"]
      - [Bear, "Growth decelerates, pricing compresses, or commercialization and liability costs rise", "Avoid or wait for recapitalization and preference clarity", "Material risk; no probability assigned", "Down round, adverse preference stack, or customer/partner loss"]
      - [Research-more, "Management supplies metrics but they remain unverified", "Do not convert directional evidence into a dollar target", "Required before valuation decision", "Evidence remains private-only or conflicting"]
    notes: Scenarios are decision gates, not dollar forecasts; no probability-weighted valuation is asserted because current ARR, growth, margin, retention, cap table, and post-money valuation are unavailable.
    claimRefs: [CV010, CV011, CV012, CV013, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strategic differentiation supports monitoring, while missing price and operating evidence blocks an immediate investment call.
    data:
      nodes:
        - id: scale-proof
          label: MSP channel and 24/7 MDR
        - id: product-proof
          label: Human SOC plus AI identity response
        - id: economics-gap
          label: ARR, retention, margin and concentration unavailable
        - id: price-gap
          label: Post-money valuation and terms unavailable
        - id: decision
          label: Track / research-more
        - id: gate
          label: Reassess after cap table and cohort diligence
      edges:
        - [scale-proof, product-proof]
        - [product-proof, economics-gap]
        - [economics-gap, price-gap]
        - [price-gap, decision]
        - [decision, gate]
    approximationNotes: This is an authored decision path, not a quantified valuation bridge.
    claimRefs: [CV001, CV003, CV010, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: The product and channel thesis is credible enough to monitor, but public evidence does not establish that the current financing price offers an adequate risk-adjusted return.
    claimRefs: [CV001, CV010, CV015]
  - calloutType: risk
    title: Price is the unresolved gating variable
    body: Obtain the current post-money valuation, cap table, liquidation preferences, debt, and round terms before translating operating evidence into an entry price.
    claimRefs: [CV010, CV014, CV016]
