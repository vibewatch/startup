company:
  name: "Blackpoint Cyber"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Blackpoint addresses the MSP-mediated managed detection and response market rather than the
    entire cybersecurity market. The available evidence supports an attractive need for outsourced,
    always-on endpoint, identity, and cloud response, but it does not support a defensible dollar
    TAM, SAM, or SOM without private partner, endpoint, pricing, and attach-rate data.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The investable boundary is channel-delivered managed detection and response for managed
      service providers and their small and midsize business clients, with endpoint MDR as the
      entry product and identity, cloud, logging, posture, and application-control capabilities as
      adjacencies. This boundary excludes direct enterprise MDR demand that bypasses an MSP,
      self-managed antivirus or EDR sold without a managed response layer, and broad cybersecurity
      spending unrelated to continuous detection and containment. The principal status-quo
      substitute is an MSP building its own round-the-clock SOC, which requires analysts, shift
      coverage, and tooling. Point solutions and alert-only services are additional substitutes,
      but they leave investigation and response labor with the MSP.
    claimRefs: ["CM001", "CM002", "CM003", "CM004"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses"
    title: "Evidence-constrained sizing"
    body: >-
      The assigned evidence supports a layered opportunity, not a dollar market estimate. The
      broadest relevant pool is MSP-served organizations that need outsourced security operations;
      Blackpoint's reachable core narrows to MSPs willing to standardize on a channel-only,
      contain-first MDR vendor. Monetization then depends on protected endpoints and identities,
      while expansion depends on attach rates for cloud, logging, posture, and related modules.
      Public third-party sources describe indicative per-endpoint pricing, but Blackpoint does not
      publish a list price or minimum, and the evidence set contains no independent count of
      eligible MSPs, managed endpoints, identity seats, or module adoption. A numeric TAM, SAM, or
      SOM would therefore create false precision.
    claimRefs: ["CM005", "CM006", "CM014", "CM015", "CM016"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-adoption"
    title: "Buyer, user, payer, and adoption path"
    body: >-
      The economic buyer is normally the MSP owner, security practice leader, or service-delivery
      executive; SOC and technical teams evaluate integrations, response authority, and operating
      visibility; and the MSP pays the vendor before packaging the service for end customers.
      Small and midsize businesses are the protected users and ultimate economic beneficiaries but
      generally access Blackpoint through the partner. Adoption is triggered when an MSP cannot
      economically staff continuous response, wants to reduce alert-handling work, or wants to
      consolidate endpoint, identity, cloud, and logging coverage. The channel-only model can lower
      Blackpoint's direct selling burden, but it also makes partner enablement, packaging, and
      incumbent stack replacement central to conversion.
    claimRefs: ["CM001", "CM002", "CM003", "CM009", "CM013"]
    tableRefs: ["TM003"]
  - id: "drivers-constraints-and-valuation"
    title: "Growth drivers, constraints, and valuation relevance"
    body: >-
      Demand is supported by identity attacks, out-of-hours response requirements, limited MSP
      staffing, and pressure to consolidate overlapping security tools. Blackpoint's July 2026
      launch extends autonomous response to Microsoft 365 and Google Workspace, which can broaden
      identity attach opportunities, but its speed and telemetry claims are company-issued rather
      than independent benchmarks. Adoption can be slowed by quote-only pricing, separate add-ons,
      absent public response SLAs, limited buyer control over autonomous actions, operating-system
      coverage gaps reported by third parties, and the switching work required to displace an
      incumbent stack. Valuation should therefore be tied to verified partner growth, protected
      endpoints and identities, gross retention, module attach, and realized pricing—not a generic
      cybersecurity TAM.
    claimRefs: ["CM007", "CM008", "CM009", "CM010", "CM011", "CM012", "CM016"]
