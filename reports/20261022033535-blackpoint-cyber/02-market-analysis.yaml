callouts:
  - calloutType: "risk"
    title: "Do not capitalize a generic cybersecurity TAM"
    body: >-
      Underwriting should wait for a partner cohort, protected endpoint and identity counts,
      realized pricing, retention, and module attach data. The assigned public evidence supports
      the market mechanism but not a precise dollar opportunity.
    claimRefs: ["CM015", "CM016"]
