  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: private-metrics
      missingEvidence: Monthly revenue or ARR by product, gross margin, net retention, churn, CAC, payback, and realized price per endpoint or identity.
      whyItMatters: Without these measures, recurring revenue quality and operating leverage cannot be tested.
      diligencePath: Request a monthly KPI pack with cohort definitions, reconciliations to management accounts, and product-level revenue and cost attribution.
      relatedQuestionRefs: [QI005, QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash, monthly burn, runway, debt or credit facilities, covenants, and next-round trigger.
      whyItMatters: Historical funding does not establish current liquidity or financing dependency.
      diligencePath: Request the latest balance sheet, 24-month cash forecast, debt schedule, and board-approved financing plan.
      relatedQuestionRefs: [QI007, QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: partner-economics
