chapter:
  number: 4
  title: Financials
  summary: Blackpoint has a channel-led, recurring managed-security model with tiered platform packaging, but public evidence does not disclose realized revenue, gross margin, burn, cash, or customer-level economics. The disclosed $190 million Series C funds product and partner expansion, while underwriting remains dependent on a current partner quote and private financial diligence.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: Blackpoint sells through MSPs and MSSPs rather than a direct-to-business checkout, so the economic unit is a partner deployment and its enabled endpoints, identities, logs, and services. Public descriptions identify 24/7 MDR and ITDR as core offerings, with CompassOne tiering Essentials, Core, and Standard. The official platform page says Standard adds SIEM with 365 days of log storage, while some integrations have additional terms and fees. This supports a recurring subscription and expansion model, but it does not establish realized revenue, ARR, renewal rates, discounting, or revenue recognition. The company describes more than 1,800 MSPs protected and tens of millions of security events ingested daily; those are company-claimed operating indicators rather than audited customer or revenue figures.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The delivery model is service-intensive: Blackpoint combines software, telemetry, autonomous response, and a human SOC. The official platform describes a shared security platform and tiered packaging, while a current IT operations posting describes support for approximately 230 team members and a distributed workforce. These inputs suggest operating leverage may depend on telemetry scale, analyst productivity, infrastructure, and support costs, but no public source supplies gross margin, SOC cost per protected account, CAC, payback, churn, or partner take rate. Pricing evidence is especially limited: a competitor comparison states that Blackpoint pricing is custom and not publicly listed, and labels third-party ranges as directional. Underwriting therefore needs contract-level realized price, endpoint and identity volumes, implementation cost, and service-level obligations.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and underwriting verdict
    body: Blackpoint announced a $190 million growth investment in June 2023, led by Bain Capital Tech Opportunities with participation from Accel and existing investors. The company said the proceeds would fund further security-technology development and enable MSP partners to address a changing threat landscape. FundedIQ independently records one Series C of $190 million and a 101–250 employee band, while a current job posting describes approximately 230 team members; the differing granularity is a reminder that headcount is not a cash-flow proxy. No assigned source reports cash on hand, current burn, runway, debt, project-finance obligations, or a next-round trigger. The financial verdict is therefore positive on disclosed capital access and product breadth, but low-confidence on valuation, margin path, and capital adequacy until management provides a current model and financing terms.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
callouts:
  - calloutType: strength
    title: Recurring platform expansion is plausible
    body: Tiered MDR, ITDR, posture, application-control, vulnerability, and SIEM capabilities create identifiable expansion surfaces, but public evidence does not quantify attach rates or realized pricing.
    claimRefs: [CI002, CI003, CI006]
  - calloutType: risk
    title: Private-company underwriting gap
    body: Cash, burn, runway, revenue, gross margin, retention, discounts, partner economics, and debt obligations remain undisclosed in the assigned evidence.
    claimRefs: [CI009, CI014, CI016]
  - calloutType: recommendation
    title: Request a cohort-level financial pack
    body: Before underwriting, obtain monthly recurring revenue by product, gross margin by service tier, churn and expansion, partner take rates, CAC and payback, cash and burn, debt schedule, and the use-of-funds plan.
    claimRefs: [CI009, CI014, CI016]
