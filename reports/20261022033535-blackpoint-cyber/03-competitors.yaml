callouts:
  - calloutType: strength
    title: "Positioning strength"
    body: "Blackpoint's documented differentiation is the combination of MSP-channel distribution, 24/7 human SOC oversight, and contain-first response rather than alert-only handoff."
    claimRefs: [CP005, CP006, CP010]
  - calloutType: risk
    title: "Competitive risk"
    body: "The same response and platform features are being packaged across MSP-focused alternatives, while Blackpoint's public pricing, independent performance benchmarks, and partner concentration remain unverified."
    claimRefs: [CP014, CP015, CP016]
