company:
  name: Blackpoint Cyber
chapter:
  number: 3
  title: Competitors
  summary: Blackpoint Cyber competes in a crowded MSP-oriented MDR market where response authority, operating-system coverage, packaging, and channel access are material buying criteria. The available evidence supports a differentiated contain-first, channel-exclusive position, but public pricing and independently comparable performance data remain limited.
sections:
  - id: landscape
    title: Competitive landscape and buyer choice
    body: >-
      The relevant competitive set is broader than named MDR vendors. Blackpoint's
      direct peer set includes Huntress and other MSP-channel MDR providers; incumbents
      include endpoint and security platforms that add managed services; adjacent
      alternatives include Guardz's unified MSP security stack and provider-led offerings
      such as Sophos MDR, while substitutes include an MSP's own SOC, alert-only tools,
      traditional antivirus, and internal security operations. The independent Netalith
      comparison describes Blackpoint and Huntress as two different response-model bets:
      Blackpoint acts on high-confidence threats first, whereas Huntress reviews alerts
      before they reach the customer. Guardz's competitor-authored alternatives guide
      broadens the shortlist to thirteen providers and explicitly frames response authority,
      coverage, SLA visibility, and price visibility as selection dimensions. These are
      buying criteria, not independent proof that any provider is superior.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: profiles
    title: Competitor profiles and capability trade-offs
    body: >-
      Blackpoint's strongest defensible positioning in the assigned evidence is a
      channel-first operating model with a 24/7 SOC and active containment. Its own
      materials claim endpoint, cloud, and on-premises coverage and describe a SOC that
      acts rather than only alerts; the company also announced an AI SOC Agent for
      Microsoft 365 and Google Workspace identity threats in July 2026. Huntress is the
      closest directly documented peer: the Netalith comparison describes a channel
      model, human-reviewed alerts, published direct pricing, and Linux coverage, while
      Blackpoint pricing is quote-only in that comparison. Guardz presents an adjacent
      alternative with endpoint, email, identity, and MDR in one MSP console and
      configurable approval controls. The evidence does not establish independently
      comparable detection rates, retention, customer scale, or contract economics.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: switching
    title: Switching costs, distribution, and moat durability
    body: >-
      Distribution is a central competitive variable because Blackpoint sells through
      MSPs and MSSPs rather than through a direct-to-business path, according to the
      Netalith comparison. That channel focus can improve partner workflow fit and
      resale packaging, but it also narrows the addressable buying motion and makes
      partner relationships a dependency. Technical switching costs are likely to arise
      from agent deployment, integrations, identity and endpoint policy, response
      runbooks, and the trust placed in autonomous containment; the available sources
      document integrations and response actions, but do not quantify migration time,
      churn, multi-homing, or partner concentration. Huntress's broader OS coverage and
      approval-oriented response model can appeal to buyers prioritizing control or Linux,
      while Blackpoint's contain-first model can appeal to buyers prioritizing speed.
      These trade-offs suggest a moat based on workflow and trust, not an independently
      proven technology monopoly.
    claimRefs: [CP010, CP011, CP012, CP013]
  - id: durability
    title: Displacement risk and diligence judgment
    body: >-
      The market is moving toward platform consolidation and AI-assisted response, which
      raises both opportunity and commoditization risk. Blackpoint's July 2026 release
      claims identity containment in less than two minutes on average and as little as
      21 seconds, supported by a human-oversight model; those figures are company claims,
      not an independent benchmark. Guardz's alternatives guide reports vendor-stated
      response and coverage comparisons across a larger field, but it is published by a
      competitor and includes Guardz, so it should be treated as a directional buying
      guide rather than independent validation. The assigned evidence contains no public
      Blackpoint price sheet, audited detection benchmark, customer retention series, or
      quantified partner concentration. A buyer should therefore test response authority,
      Linux and cloud coverage, integrations, realized pricing, contract terms, and
      outcome evidence in a pilot before concluding that Blackpoint's speed translates
      into durable pricing power.
    claimRefs: [CP014, CP015, CP016]
    tableRefs: [TP003]
