  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is channel-delivered managed detection and response for managed service providers
              and their small and midsize business clients, with endpoint MDR as the entry product and identity, cloud,
              logging, posture, and application-control capabilities as adjacencies. This boundary excludes direct
              enterprise MDR demand that bypasses an MSP, self-managed antivirus or EDR sold without a managed response
              layer, and broad cybersecurity spending unrelated to continuous detection and containment. The principal
              status-quo substitute is an MSP building its own round-the-clock SOC, which requires analysts, shift
              coverage, and tooling. Point solutions and alert-only services are additional substitutes, but they leave
              investigation and response labor with the MSP.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a layered opportunity, not a dollar market estimate. The broadest relevant
              pool is MSP-served organizations that need outsourced security operations; Blackpoint's reachable core
              narrows to MSPs willing to standardize on a channel-only, contain-first MDR vendor. Monetization then
              depends on protected endpoints and identities, while expansion depends on attach rates for cloud, logging,
              posture, and related modules. Public third-party sources describe indicative per-endpoint pricing, but
              Blackpoint does not publish a list price or minimum, and the evidence set contains no independent count of
              eligible MSPs, managed endpoints, identity seats, or module adoption. A numeric TAM, SAM, or SOM would
              therefore create false precision.
            claimRefs:
              - CM005
              - CM006
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
