chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Blackpoint Cyber is described across its public materials as a cybersecurity provider built for managed
              service providers and small and medium-sized businesses. Its offer combines managed detection and
              response, identity threat detection and response, a 24/7/365 human-staffed security operations center, and
              the CompassOne platform. The company’s own description emphasizes investigation, containment, and
              remediation rather than alert forwarding. Independent comparison material also characterizes Blackpoint as
              channel-exclusive, with no direct-to-business purchase path, while noting that its pricing is custom
              quoted. The available evidence does not establish a founding date, headquarters, legal domicile, or
              current corporate stage with sufficient precision.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
