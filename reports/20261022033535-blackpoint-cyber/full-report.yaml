      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Blackpoint announced a $190 million growth investment in June 2023, led by Bain Capital Tech Opportunities
              with participation from Accel and existing investors. The company said the proceeds would fund further
              security-technology development and enable MSP partners to address a changing threat landscape. FundedIQ
              independently records one Series C of $190 million and a 101–250 employee band, while a current job
