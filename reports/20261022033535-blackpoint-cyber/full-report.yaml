        title: Financing, scale, and evidence limits
        blocks:
          - type: paragraph
            body: >-
              One employer-distributed job listing says Blackpoint is in hyper-growth mode and refers to a recent $190
              million Series C round, but the assigned evidence does not independently identify the round date, lead
              investors, post-money valuation, debt, or proceeds available to the business. Company pages make scale
              claims such as more than 1,800 MSP partners and telemetry from nearly a million accounts or endpoints;
              these are company-reported marketing metrics and are not equivalent to audited customer count, ARR,
              revenue, or retention. The public materials also do not disclose current valuation, revenue run-rate,
