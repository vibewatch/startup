      - number: '1.4'
        title: Milestones and current direction
        blocks:
          - type: paragraph
            body: >-
              The evidence trail shows a company moving from a human-led MDR identity toward an AI-accelerated operating
              model. Company materials describe more than a decade of SOC intelligence and current CompassOne
              integration, while a July 8, 2026 release announces a generally available AI SOC Agent for identity
              threats in Microsoft 365 and Google Workspace. The release claims average containment in under two minutes
              and as little as 21 seconds, but those are company-reported performance claims rather than an independent
              benchmark. A separate comparison identifies a Linux-agent gap as of 2026, making platform coverage a
              concrete diligence question for MSPs with mixed operating systems. The timeline therefore combines dated
              evidence and explicitly labels undated historical gaps.
