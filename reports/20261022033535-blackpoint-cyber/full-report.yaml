              - CP006
              - CP007
              - CP008
              - CP015
      - number: '3.3'
        title: Switching costs, distribution, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Distribution is a central competitive variable because Blackpoint sells through MSPs and MSSPs rather than
              through a direct-to-business path, according to the Netalith comparison. That channel focus can improve
              partner workflow fit and resale packaging, but it also narrows the addressable buying motion and makes
              partner relationships a dependency. Technical switching costs are likely to arise from agent deployment,
              integrations, identity and endpoint policy, response runbooks, and the trust placed in autonomous
              containment; the available sources document integrations and response actions, but do not quantify
              migration time, churn, multi-homing, or partner concentration. Huntress's broader OS coverage and
              approval-oriented response model can appeal to buyers prioritizing control or Linux, while Blackpoint's
              contain-first model can appeal to buyers prioritizing speed. These trade-offs suggest a moat based on
              workflow and trust, not an independently proven technology monopoly.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Displacement risk and diligence judgment
        blocks:
          - type: paragraph
            body: >-
              The market is moving toward platform consolidation and AI-assisted response, which raises both opportunity
              and commoditization risk. Blackpoint's July 2026 release claims identity containment in less than two
              minutes on average and as little as 21 seconds, supported by a human-oversight model; those figures are
              company claims, not an independent benchmark. Guardz's alternatives guide reports vendor-stated response
              and coverage comparisons across a larger field, but it is published by a competitor and includes Guardz,
              so it should be treated as a directional buying guide rather than independent validation. The assigned
              evidence contains no public Blackpoint price sheet, audited detection benchmark, customer retention
              series, or quantified partner concentration. A buyer should therefore test response authority, Linux and
              cloud coverage, integrations, realized pricing, contract terms, and outcome evidence in a pilot before
              concluding that Blackpoint's speed translates into durable pricing power.
            claimRefs:
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Positioning strength
            body: >-
              Blackpoint's documented differentiation is the combination of MSP-channel distribution, 24/7 human SOC
              oversight, and contain-first response rather than alert-only handoff.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP010
          - type: callout
            title: Competitive risk
            body: >-
              The same response and platform features are being packaged across MSP-focused alternatives, while
              Blackpoint's public pricing, independent performance benchmarks, and partner concentration remain
