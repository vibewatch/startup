              - CM015
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is normally the MSP owner, security practice leader, or service-delivery executive; SOC
              and technical teams evaluate integrations, response authority, and operating visibility; and the MSP pays
              the vendor before packaging the service for end customers. Small and midsize businesses are the protected
              users and ultimate economic beneficiaries but generally access Blackpoint through the partner. Adoption is
              triggered when an MSP cannot economically staff continuous response, wants to reduce alert-handling work,
              or wants to consolidate endpoint, identity, cloud, and logging coverage. The channel-only model can lower
              Blackpoint's direct selling burden, but it also makes partner enablement, packaging, and incumbent stack
              replacement central to conversion.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM009
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by identity attacks, out-of-hours response requirements, limited MSP staffing, and
              pressure to consolidate overlapping security tools. Blackpoint's July 2026 launch extends autonomous
              response to Microsoft 365 and Google Workspace, which can broaden identity attach opportunities, but its
              speed and telemetry claims are company-issued rather than independent benchmarks. Adoption can be slowed
              by quote-only pricing, separate add-ons, absent public response SLAs, limited buyer control over
              autonomous actions, operating-system coverage gaps reported by third parties, and the switching work
              required to displace an incumbent stack. Valuation should therefore be tied to verified partner growth,
              protected endpoints and identities, gross retention, module attach, and realized pricing—not a generic
              cybersecurity TAM.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not capitalize a generic cybersecurity TAM
            body: >-
              Underwriting should wait for a partner cohort, protected endpoint and identity counts, realized pricing,
              retention, and module attach data. The assigned public evidence supports the market mechanism but not a
              precise dollar opportunity.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer choice
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than named MDR vendors. Blackpoint's direct peer set includes
              Huntress and other MSP-channel MDR providers; incumbents include endpoint and security platforms that add
              managed services; adjacent alternatives include Guardz's unified MSP security stack and provider-led
              offerings such as Sophos MDR, while substitutes include an MSP's own SOC, alert-only tools, traditional
              antivirus, and internal security operations. The independent Netalith comparison describes Blackpoint and
              Huntress as two different response-model bets: Blackpoint acts on high-confidence threats first, whereas
              Huntress reviews alerts before they reach the customer. Guardz's competitor-authored alternatives guide
              broadens the shortlist to thirteen providers and explicitly frames response authority, coverage, SLA
              visibility, and price visibility as selection dimensions. These are buying criteria, not independent proof
              that any provider is superior.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
