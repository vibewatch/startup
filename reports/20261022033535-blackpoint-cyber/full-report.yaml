              - CP002
              - CP003
              - CP004
              - CP010
      - number: '3.2'
        title: Competitor profiles and capability trade-offs
        blocks:
          - type: paragraph
            body: >-
              Blackpoint's strongest defensible positioning in the assigned evidence is a channel-first operating model
              with a 24/7 SOC and active containment. Its own materials claim endpoint, cloud, and on-premises coverage
              and describe a SOC that acts rather than only alerts; the company also announced an AI SOC Agent for
              Microsoft 365 and Google Workspace identity threats in July 2026. Huntress is the closest directly
              documented peer: the Netalith comparison describes a channel model, human-reviewed alerts, published
              direct pricing, and Linux coverage, while Blackpoint pricing is quote-only in that comparison. Guardz
              presents an adjacent alternative with endpoint, email, identity, and MDR in one MSP console and
              configurable approval controls. The evidence does not establish independently comparable detection rates,
              retention, customer scale, or contract economics.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
