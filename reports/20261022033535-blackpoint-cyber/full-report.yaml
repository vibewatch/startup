  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and delivered service
        blocks:
          - type: paragraph
            body: >-
              Blackpoint's product is not only an alert feed. Its public product material describes a managed workflow
              in which endpoint, identity, and email signals are monitored by a 24/7 SOC, investigated, and converted
              into response actions. The customer-facing outcome is containment and an incident record rather than a
              queue of alerts for an MSP to triage. The Brivy description gives concrete examples: endpoint signals from
              SentinelOne, identity signals through Microsoft Entra and Petra, and email-compromise indicators are
              watched; response can isolate endpoints, disable accounts, revoke sessions, and open a timeline. It also
              says investigations are documented in ConnectWise, which is useful for insurer or auditor evidence but is
              not itself proof of incident outcomes. Cyber Buyer describes SNAP-Defense as the proprietary
              security-operations and incident-response platform, while a current third-party directory lists cloud
              response, logging with context, ransomware response, and multi-tenant operation. These sources establish
              the operating model, not a quantified detection rate or contractual response SLA.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE010
              - CE016
      - number: '5.2'
        title: Modules, integrations, and architecture
        blocks:
          - type: paragraph
            body: >-
              The public product map has several layers: a core MDR/SOC service; endpoint and network telemetry;
              identity and cloud response; logging and compliance context; and the MSP control plane. Cyber Buyer
              identifies SNAP-Defense and a separate LogIC logging-with-integrated-compliance service, including a
              self-service web application for event and log collection. A third-party directory lists integrations with
              NinjaOne, ConnectWise, Datto, Kaseya, Pax8, Microsoft 365, and Google Workspace, but the listing is not an
              implementation specification and should not be treated as evidence that every integration has identical
              response depth. A Blackpoint job posting provides additional operational evidence for the company's own
              environment: Entra ID, Intune, Jamf, Auth0, SCIM, Datto RMM, and deployment of the Blackpoint agent
              through Datto RMM. That posting is a company job repost and therefore company-issued evidence, not
              independent product validation. The architecture is best understood as a managed, multi-tenant service
              with integration-dependent telemetry and actions rather than a fully documented public API stack.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
