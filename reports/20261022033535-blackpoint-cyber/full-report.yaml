        title: Leadership, workforce, and governance signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence identifies Gagan Singh as CEO and names Wil Santiago as SVP of Security Operations and
              Mike Estep as Chief Client Officer in company materials. A current IT Operations Lead posting describes a
              player-coach role supporting approximately 230 team members across a distributed workforce, which is an
              operational workforce signal rather than a verified company-wide headcount. The same posting describes
              identity, endpoint, compliance, and vendor responsibilities, suggesting that security operations and
              corporate controls require specialized internal ownership. No assigned source provides a complete
              executive roster, board composition, founder names, or a verified record of leadership changes, so
