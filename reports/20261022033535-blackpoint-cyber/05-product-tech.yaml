chapter:
  number: 5
  title: Product & Technology
  summary: Blackpoint Cyber delivers an MSP-oriented managed detection and response service that combines a 24/7 SOC, proprietary detection technology, endpoint and identity response, and a multi-tenant operating model. Public evidence supports a differentiated contain-first workflow and a newly launched identity AI capability, but independent proof of performance, Linux coverage, reliability, and security controls remains limited.
sections:
  - id: product-workflow
    title: Customer workflow and delivered service
    body: >-
      Blackpoint's product is not only an alert feed. Its public product material describes a managed
      workflow in which endpoint, identity, and email signals are monitored by a 24/7 SOC, investigated,
      and converted into response actions. The customer-facing outcome is containment and an incident
      record rather than a queue of alerts for an MSP to triage. The Brivy description gives concrete
      examples: endpoint signals from SentinelOne, identity signals through Microsoft Entra and Petra,
      and email-compromise indicators are watched; response can isolate endpoints, disable accounts,
      revoke sessions, and open a timeline. It also says investigations are documented in ConnectWise,
      which is useful for insurer or auditor evidence but is not itself proof of incident outcomes.
      Cyber Buyer describes SNAP-Defense as the proprietary security-operations and incident-response
      platform, while a current third-party directory lists cloud response, logging with context,
      ransomware response, and multi-tenant operation. These sources establish the operating model,
      not a quantified detection rate or contractual response SLA.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: product-map
    title: Modules, integrations, and architecture
    body: >-
      The public product map has several layers: a core MDR/SOC service; endpoint and network
      telemetry; identity and cloud response; logging and compliance context; and the MSP control
      plane. Cyber Buyer identifies SNAP-Defense and a separate LogIC logging-with-integrated-compliance
      service, including a self-service web application for event and log collection. A third-party
      directory lists integrations with NinjaOne, ConnectWise, Datto, Kaseya, Pax8, Microsoft 365,
      and Google Workspace, but the listing is not an implementation specification and should not be
      treated as evidence that every integration has identical response depth. A Blackpoint job
      posting provides additional operational evidence for the company's own environment: Entra ID,
      Intune, Jamf, Auth0, SCIM, Datto RMM, and deployment of the Blackpoint agent through Datto RMM.
      That posting is a company job repost and therefore company-issued evidence, not independent
      product validation. The architecture is best understood as a managed, multi-tenant service
      with integration-dependent telemetry and actions rather than a fully documented public API stack.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: maturity-and-roadmap
    title: Maturity, deployment, and roadmap
    body: >-
      Blackpoint's 2022 SOC slick sheet says the managed detection and response service can be
      installed and protecting a business within a matter of days, and describes a centralized SOC
      that monitors endpoints, networks, assets, and locations. Those are vendor claims about
      onboarding and operating scope, so diligence should test time-to-value across representative
      MSP estates, not assume the claim is a service-level commitment. The July 2026 launch adds a
      generally available AI SOC Agent for identity threat detection and response. Blackpoint says
      the agent covers Microsoft 365 and Google Workspace, acts on high-confidence threats, and
      retains human SOC oversight and escalation. It reports an average containment time of less
      than two minutes and as little as 21 seconds, but these figures are company-reported and the
      reviewed source does not provide a denominator, test protocol, or independent benchmark.
      The roadmap therefore shows meaningful expansion from endpoint MDR toward identity and cloud
      context, while public evidence does not establish production reliability, rollback behavior,
      service availability, or change-control performance.
    claimRefs: [CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
  - id: controls-and-gaps
    title: Trust, safety, and technical diligence
    body: >-
      The product's main technical advantage is operational authority: its SOC can act on selected
      high-confidence threats instead of waiting for an MSP to approve every containment step. That
      design may reduce dwell time, but it makes false-positive controls, auditability, reversibility,
      escalation, and customer-specific policy boundaries central diligence questions. Blackpoint's
      launch material says the AI agent was trained using analyst decisions, breach forensics, and
      telemetry from nearly a million accounts, and that it was validated before deployment; those
      are company claims rather than an independently reproducible safety evaluation. The reviewed
      evidence also does not disclose public uptime targets, incident-history statistics, penetration
      testing, certification scope, data-retention rules, tenant-isolation architecture, or a complete
      API and export specification. A buyer should require those artifacts, test identity and endpoint
      containment in a controlled pilot, confirm supported operating systems and cloud tenants, and
      obtain written responsibility boundaries for remediation and recovery. The assigned pool's
      critical product evidence consists of an independent comparison and a competitor-authored
      alternatives page, neither of which is an independent technical benchmark. The principal
      product risk is therefore an evidence gap, not a finding that the controls are absent.
    claimRefs: [CE013, CE014, CE015, CE016]
    callouts:
      - calloutType: risk
        title: Autonomous response requires proof of guardrails
        body: >-
          The contain-first model is strategically differentiated, but public sources do not
          independently verify error rates, rollback, uptime, or tenant-specific approval controls.
        claimRefs: [CE012, CE014, CE015, CE016]
