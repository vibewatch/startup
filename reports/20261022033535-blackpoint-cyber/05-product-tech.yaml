  evidenceGaps:
    - type: missing-source
      severity: material
      topic: performance
      missingEvidence: Independent response-time, false-positive, containment-success, and rollback measurements for endpoint and identity actions.
      whyItMatters: Autonomous containment is the product's central technical promise, so unverified performance and error rates directly affect safety and customer value.
      diligencePath: Request a methodology-backed performance pack and run a controlled pilot with representative Microsoft 365, Google Workspace, endpoint, and MSP tenant scenarios.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: controls
      missingEvidence: Current uptime target, tenant-isolation design, penetration-test summary, certifications, data-retention policy, and API/export documentation.
      whyItMatters: MSPs must evidence security, availability, and customer separation while operating a privileged response service across multiple tenants.
      diligencePath: Obtain the current trust package, architecture and subprocessors documentation, audit reports, and contractual service-level terms.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: minor
      topic: operating-system-coverage
      missingEvidence: A current authoritative support matrix for endpoint operating systems, cloud tenants, integrations, and response actions.
      whyItMatters: Coverage gaps can force MSPs to operate parallel tools and change the economics and risk of deployment.
      diligencePath: Require a versioned support matrix and validate the highest-risk customer environments in a pre-production pilot.
      relatedQuestionRefs: [QE004, QE008]
