      - ["Operations", "24/7 human SOC and MSP multi-tenancy", "Staffing, escalation, and tenant isolation", "Obtain uptime, staffing, segregation, and incident-history evidence"]
      - ["Evidence and compliance", "ConnectWise investigation timeline and LogIC context", "Storage, retention, exports, and audit controls", "Confirm retention, portability, certifications, and report completeness"]
    notes: Architecture layers are an analytical organization of capabilities described in public sources, not a disclosed reference architecture.
    claimRefs: [CE003, CE005, CE009, CE013, CE015, CE016]
