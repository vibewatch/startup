evidenceGaps:
  - type: missing-source
    severity: material
    topic: identity-gap
    missingEvidence: >-
      A primary corporate record or authoritative company profile confirming founding date, headquarters, legal entity,
      founders, and current stage.
    whyItMatters: Without these identity anchors, later comparisons may conflate company age, legal scope, and operating maturity.
    diligencePath: >-
      Request the latest company fact sheet, incorporation record, or investor diligence package and reconcile it to the
      website.
    relatedQuestionRefs:
      - QO003
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      Financing documents, cap table, post-money valuation, current ARR or revenue, gross margin, net retention, and
      debt schedule.
    whyItMatters: >-
      A company overview cannot support investment sizing or valuation judgment from a job-posting financing reference
      and marketing metrics alone.
    diligencePath: >-
      Obtain the latest investor data room or management KPI package, then reconcile financing proceeds to cash and
      ownership.
    relatedQuestionRefs:
      - QO004
      - QO005
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete executive, founder, board, and material leadership-change history.
    whyItMatters: >-
      Security operations and partner distribution appear leadership-sensitive, but current evidence shows only a
      partial named roster.
    diligencePath: >-
      Request an organization chart, board roster, biographies, and leadership-change log covering the current and prior
      24 months.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: stale
    severity: material
    topic: milestones
    missingEvidence: Dated primary records for founding, financing, product releases, major partnerships, and adverse events.
    whyItMatters: >-
      The current timeline is evidence-constrained and mixes company-stated periods with comparator references; it
      should not be read as a complete corporate history.
    diligencePath: >-
      Request a dated corporate chronology and verify each event against press releases, financing announcements, and
      legal records.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-size-gap
    missingEvidence: >-
      Eligible MSP count, protected endpoint and identity counts, realized pricing, geographic mix, and paid module
      attach rates.
    whyItMatters: Without these denominators, TAM, SAM, SOM, and revenue-pool calculations would be speculative.
    diligencePath: >-
      Request a partner-level operating dataset and cohort model, then reconcile it to billing records and contracted
      pricing.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: market-size-gap
    missingEvidence: Independent MDR and MSP-market sizing with a transparent definition, geography, base year, and methodology.
    whyItMatters: >-
      An independent benchmark is needed to test management's market boundary and avoid using a generic cybersecurity
      TAM.
    diligencePath: Obtain licensed analyst research or government and industry datasets that isolate channel-delivered MDR.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: >-
      Executed partner contracts showing endpoint, identity, cloud, and logging prices, discounts, minimums, and term
      lengths.
    whyItMatters: Third-party indicative prices and quote-only positioning cannot establish realized revenue per protected asset.
    diligencePath: Sample signed partner agreements and invoices across endpoint bands and geographies.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: benchmarking
    missingEvidence: >-
      An independent, like-for-like MDR benchmark covering detection quality, containment time, false positives, and
      remediation outcomes.
    whyItMatters: >-
      The central speed and response differentiation cannot be converted into relative performance or pricing power
      without comparable evidence.
    diligencePath: >-
      Request customer references, pilot telemetry, and an independent benchmark with matched populations and
      definitions.
    relatedQuestionRefs:
      - QP004
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Comparable Blackpoint, Huntress, and Guardz partner quotes with modules, minimums, discounts, and contract terms.
    whyItMatters: >-
      Quote-only packaging can change total cost of ownership and the apparent advantage of bundled versus modular
      products.
    diligencePath: Obtain written partner quotes for the same endpoint, identity, cloud, and SIEM scope.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Measured implementation time, migration failure rates, partner churn, multi-homing, and customer concentration by
      channel.
    whyItMatters: The durability of a workflow and distribution moat cannot be underwritten from product descriptions alone.
    diligencePath: Interview MSP partners and request cohort, churn, implementation, and concentration disclosures under NDA.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: private-metrics
    missingEvidence: >-
      Monthly revenue or ARR by product, gross margin, net retention, churn, CAC, payback, and realized price per
      endpoint or identity.
    whyItMatters: Without these measures, recurring revenue quality and operating leverage cannot be tested.
    diligencePath: >-
      Request a monthly KPI pack with cohort definitions, reconciliations to management accounts, and product-level
      revenue and cost attribution.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, monthly burn, runway, debt or credit facilities, covenants, and next-round trigger.
    whyItMatters: Historical funding does not establish current liquidity or financing dependency.
    diligencePath: Request the latest balance sheet, 24-month cash forecast, debt schedule, and board-approved financing plan.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: partner-economics
    missingEvidence: MSP contract terms, discounts, take rates, renewal, concentration, and support obligations.
    whyItMatters: Channel economics determine realized price, gross margin, and customer concentration risk.
    diligencePath: >-
      Sample anonymized partner contracts and a cohort report segmented by endpoints, products, geography, and renewal
      status.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: performance
    missingEvidence: >-
      Independent response-time, false-positive, containment-success, and rollback measurements for endpoint and
      identity actions.
    whyItMatters: >-
      Autonomous containment is the product's central technical promise, so unverified performance and error rates
      directly affect safety and customer value.
    diligencePath: >-
      Request a methodology-backed performance pack and run a controlled pilot with representative Microsoft 365, Google
      Workspace, endpoint, and MSP tenant scenarios.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: controls
    missingEvidence: >-
      Current uptime target, tenant-isolation design, penetration-test summary, certifications, data-retention policy,
      and API/export documentation.
    whyItMatters: >-
      MSPs must evidence security, availability, and customer separation while operating a privileged response service
      across multiple tenants.
    diligencePath: >-
      Obtain the current trust package, architecture and subprocessors documentation, audit reports, and contractual
      service-level terms.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: minor
    topic: operating-system-coverage
    missingEvidence: >-
      A current authoritative support matrix for endpoint operating systems, cloud tenants, integrations, and response
      actions.
    whyItMatters: Coverage gaps can force MSPs to operate parallel tools and change the economics and risk of deployment.
    diligencePath: Require a versioned support matrix and validate the highest-risk customer environments in a pre-production pilot.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: >-
      Cohort-level gross retention, net retention, renewal, churn, and contract-length data segmented by MSP and end
      customer.
    whyItMatters: Channel reach and testimonials do not show whether revenue and deployments persist or expand.
    diligencePath: >-
      Request monthly cohort schedules, renewal definitions, churn bridges, and signed-contract duration from
      management.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-proof
    missingEvidence: >-
      A complete customer-reference list with paid production status, deployment scale, use case, duration, and outcome
      metrics.
    whyItMatters: The three named references are partial and largely company- or partner-issued, limiting reference quality.
    diligencePath: >-
      Obtain permissioned reference calls and a customer-by-customer deployment schedule covering production and pilot
      populations.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-10 partner and end-customer revenue, seats, and gross-margin concentration plus module attach rates.
    whyItMatters: An MSP-first model can create channel dependence even when the aggregate partner count is large.
    diligencePath: Request a redacted concentration table and attach-rate analysis for MDR, endpoint, cloud, and ITDR modules.
    relatedQuestionRefs:
      - QU006
      - QU007
  - type: missing-source
    severity: minor
    topic: satisfaction
    missingEvidence: Independent customer satisfaction, complaint, and service-quality evidence with a defined population.
    whyItMatters: Testimonials are directional and do not establish broad customer satisfaction or service durability.
    diligencePath: Collect anonymized NPS/CSAT distributions, complaint logs, escalation rates, and third-party review trends.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: blocking
    topic: assurance
    missingEvidence: Independent detection precision, false-positive, rollback, and customer-harm statistics.
    whyItMatters: Autonomous response is a core differentiator and can create material liability when wrong.
    diligencePath: Request independently sampled incident outcomes, QA methodology, rollback logs, and customer references.
    relatedQuestionRefs:
      - QR003
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-resilience
    missingEvidence: Current revenue, margin, burn, runway, retention, and partner concentration.
    whyItMatters: >-
      Security operations require sustained staffing and infrastructure investment, but downside cannot be modeled
      without these inputs.
    diligencePath: Obtain monthly financials, cohort retention, partner mix, cash forecast, and board-approved plan.
    relatedQuestionRefs:
      - QR005
      - QR007
  - type: missing-source
    severity: material
    topic: legal-status
    missingEvidence: Current litigation, regulatory, breach, insurance, indemnity, and customer-notification record.
    whyItMatters: A security provider's liability and disclosure obligations can materially change loss severity.
    diligencePath: Conduct counsel-led diligence and review the MSA, DPA, SLA, claims history, and insurance tower.
    relatedQuestionRefs:
      - QR001
  - type: enumeration-incomplete
    severity: material
    topic: integrations
    missingEvidence: Complete supported-platform matrix and concentration by identity, endpoint, cloud, and RMM provider.
    whyItMatters: Unsupported or bespoke integrations can constrain deployment and increase operational cost.
    diligencePath: Run a technical pilot against representative Windows, Linux, M365, Google Workspace, and RMM estates.
    relatedQuestionRefs:
      - QR004
      - QR006
  - type: private-evidence-only
    severity: blocking
    topic: valuation
    missingEvidence: Current post-money valuation, share price, cap table, liquidation preferences, debt, and financing terms.
    whyItMatters: Without price and preference information, a return or dilution calculation would be false precision.
    diligencePath: >-
      Request the latest financing documents, fully diluted cap table, debt schedule, and investor rights summary under
      NDA.
    relatedQuestionRefs:
      - QV004
      - QV009
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Current ARR, revenue growth, gross margin, net retention, churn, and cohort expansion.
    whyItMatters: These metrics determine whether funding and channel positioning translate into durable enterprise value.
    diligencePath: >-
      Obtain monthly recurring-revenue bridges, cohort tables, audited financials, and gross-margin detail for the
      latest eight quarters.
    relatedQuestionRefs:
      - QV006
  - type: enumeration-incomplete
    severity: material
    topic: competition
    missingEvidence: Comparable transaction and public-company set with consistent MDR revenue and margin definitions.
    whyItMatters: The retained comparison is directional and competitor-authored, not a verified valuation benchmark.
    diligencePath: >-
      Build a dated peer set from filings and disclosed transactions using consistent recurring-revenue and margin
      definitions.
    relatedQuestionRefs:
      - QV008
