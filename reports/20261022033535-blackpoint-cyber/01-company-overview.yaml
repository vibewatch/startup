company:
  name: Blackpoint Cyber
chapter:
  number: 1
  title: Company Overview
  summary: Blackpoint Cyber presents itself as an MSP-focused managed detection and response provider combining a 24/7 human SOC with proprietary, increasingly autonomous response. Current public evidence supports its product positioning, partner-channel strategy, AI/ITDR launch, and a roughly 230-person internal workforce signal, but does not establish a current valuation, revenue, ARR, total capital raised, or complete historical leadership and financing record.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: Blackpoint Cyber is described across its public materials as a cybersecurity provider built for managed service providers and small and medium-sized businesses. Its offer combines managed detection and response, identity threat detection and response, a 24/7/365 human-staffed security operations center, and the CompassOne platform. The company’s own description emphasizes investigation, containment, and remediation rather than alert forwarding. Independent comparison material also characterizes Blackpoint as channel-exclusive, with no direct-to-business purchase path, while noting that its pricing is custom quoted. The available evidence does not establish a founding date, headquarters, legal domicile, or current corporate stage with sufficient precision.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-scale
    title: Leadership, workforce, and governance signals
    body: Public evidence identifies Gagan Singh as CEO and names Wil Santiago as SVP of Security Operations and Mike Estep as Chief Client Officer in company materials. A current IT Operations Lead posting describes a player-coach role supporting approximately 230 team members across a distributed workforce, which is an operational workforce signal rather than a verified company-wide headcount. The same posting describes identity, endpoint, compliance, and vendor responsibilities, suggesting that security operations and corporate controls require specialized internal ownership. No assigned source provides a complete executive roster, board composition, founder names, or a verified record of leadership changes, so key-person dependence and governance depth remain open diligence items.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-evidence-gaps
    title: Financing, scale, and evidence limits
    body: One employer-distributed job listing says Blackpoint is in hyper-growth mode and refers to a recent $190 million Series C round, but the assigned evidence does not independently identify the round date, lead investors, post-money valuation, debt, or proceeds available to the business. Company pages make scale claims such as more than 1,800 MSP partners and telemetry from nearly a million accounts or endpoints; these are company-reported marketing metrics and are not equivalent to audited customer count, ARR, revenue, or retention. The public materials also do not disclose current valuation, revenue run-rate, gross margin, net retention, or total raised on a basis that can be verified here.
    claimRefs: [CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-current-direction
    title: Milestones and current direction
    body: The evidence trail shows a company moving from a human-led MDR identity toward an AI-accelerated operating model. Company materials describe more than a decade of SOC intelligence and current CompassOne integration, while a July 8, 2026 release announces a generally available AI SOC Agent for identity threats in Microsoft 365 and Google Workspace. The release claims average containment in under two minutes and as little as 21 seconds, but those are company-reported performance claims rather than an independent benchmark. A separate comparison identifies a Linux-agent gap as of 2026, making platform coverage a concrete diligence question for MSPs with mixed operating systems. The timeline therefore combines dated evidence and explicitly labels undated historical gaps.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Channel-native operating model
    body: Blackpoint’s strongest publicly evidenced identity is a channel-exclusive, human-led MDR model with direct response ownership rather than an alert-only workflow.
    claimRefs: [CO001, CO002, CO003]
  - calloutType: risk
    title: Private-company disclosure gap
    body: The assigned evidence does not support a current valuation, revenue, ARR, profitability, capital-structure, or complete governance view; financing and scale claims require primary-document confirmation.
    claimRefs: [CO009, CO010, CO011, CO012]
  - calloutType: insight
    title: AI expands the operating claim
    body: The July 2026 AI SOC Agent launch is strategically important, but the reported response times and training-set scale remain company claims pending independent validation.
    claimRefs: [CO013, CO014]
