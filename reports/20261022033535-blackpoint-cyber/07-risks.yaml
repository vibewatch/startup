    approximationNotes: "Placement is an analytical risk assessment from the cited public evidence and identified gaps, not a statistically calibrated probability."
    claimRefs: [CR004, CR008, CR011, CR014]
callouts:
  - calloutType: risk
    title: Speed is valuable only if authority is safe
    body: Blackpoint's differentiation depends on acting before partner approval, but the public evidence does not independently establish the error rate, rollback performance, or contractual allocation of harm when an automated action is wrong.
    claimRefs: [CR002, CR009, CR010]
  - calloutType: assumption
    title: Financial resilience is a material unknown
    body: Current revenue, margin, burn, runway, and concentration are not disclosed in the assigned evidence, so downside analysis should use diligence milestones rather than a fabricated loss or runway estimate.
    claimRefs: [CR013, CR014, CR015]
