  - id: section-metrics
    title: Scale, Cover Metrics, and Financial Trajectory
    body: >-
      SendCutSend crossed $100 million in annual revenue in October 2025, per Northern Nevada Business Weekly
      reporting based on an interview with Belosic. The company reported $200 million in annual revenue at the
      time of the May 2026 funding announcement—an approximate doubling in roughly seven months, consistent with
      a reported year-over-year growth rate of approximately 80 percent as of January 2026. The company has
      publicly characterized itself as profitable throughout this period; no audited financials have been disclosed,
      and these figures are company-claimed or third-party-reported from CEO interviews rather than independently
      verified.


      Customer and parts metrics are well corroborated across multiple independent and official sources. The
      company has served more than 300,000 customers as of its May 2026 press release, with the commercial page
      now showing 50M+ parts made to date—a higher figure than the 30M+ stated in the funding press release,
      suggesting the commercial page is more recently updated. More than 59.8% of companies in the Fortune 500
      are identified as customers; this specific figure appears in company-authored sources and has not been
      independently audited. SendCutSend has been ranked on the Inc. 5000 list of fastest-growing private U.S.
      companies for three consecutive years, reaching #511 in 2025.


      Headcount as of January 2026 stood at 410 employees operating approximately 250,000 square feet of
      manufacturing and office space across five facilities in three states, including 130,000 square feet across
      three buildings in Reno. The company's post-funding hiring plan (200 to 300 additional people) means that
      May 2026 headcount is materially higher than the 410 figure but has not been independently confirmed.
      Revenue concentration is notably low: the highest-revenue customer accounts for just 0.59% of total income,
      suggesting strong diversification and limited single-customer dependency risk. The company's equipment fleet
      includes 13 to 14 fiber laser cutters and multiple robotic CNC milling machines, with approximately 15%
      of aluminum sourced from offshore suppliers.
