  - id: section-funding
    title: Funding History and Investor Landscape
    body: >-
      SendCutSend was bootstrapped for seven years before accepting institutional capital. The sole pre-2026 outside
      funding was a $6 million friends-and-family round, with participation from Sandy Kory and Mark Sugarman, which
      gave Belosic early confidence to accelerate equipment purchasing. Beyond that seed, the company relied on
      credit cards, savings, a PayPal loan, and equipment financing through JPMorgan Chase—Belosic's stated banking
      partner for machine purchases. Fiber laser cutters at approximately $1.3 million each are financed as
      collateralized debt against the machines themselves, keeping major capex off any equity investor's balance sheet.


      On May 19, 2026, SendCutSend announced a $110 million Series A funding round, its first institutional raise,
      giving the company a post-money valuation of $1.01 billion. The round was co-led by Sequoia Capital—through
      partners Andrew Reed and Shaun Maguire—and Paradigm—through Matt Wong—with personal participation from
      Patrick Collison and John Collison, co-founders of Stripe. The Collison relationship originated on X (formerly
      Twitter), where Patrick Collison reached out to Belosic directly after following the company, then connected
      him to both Sequoia and Paradigm. Belosic has stated that a Sequoia partner's in-person visit to the Reno
      factory was a decisive factor in the deal.


      The $110M is being deployed into three categories that cannot be collateralized and therefore cannot be
      financed through traditional lending: tripling the software engineering team, hiring 200 to 300 additional
      production employees, and covering facility deposits on large buildings (Belosic notes first-and-last deposits
      on large facilities run approximately $600,000). Additional capital beyond the $110M—specifically, more than
      $250M—has been earmarked for expanding existing facilities and establishing new manufacturing hubs nationwide.
      The company has also announced a five-year commitment to invest $1 billion in U.S. manufacturing jobs and
      domestically produced materials. A fourth facility is in negotiation, with Pennsylvania and Ohio in
      consideration; Indiana, Las Vegas, and Atlanta have been named as subsequent targets.
