callouts:
  - calloutType: strength
    title: Bootstrapped to $200M before institutional capital
    body: >-
      SendCutSend's ability to grow to $200M in annual revenue and 300,000+ customers over eight years without
      institutional equity is a rare proof of business model durability. Organic profitability means the $110M
      raise is additive fuel rather than a lifeline, de-risking the company's dependence on continued funding.
    claimRefs:
      - CO021
      - CO028
      - CO029
      - CO030

  - calloutType: risk
    title: Key-person concentration and undisclosed post-Series-A governance
    body: >-
      Jim Belosic retains operational control by his own account. The board composition post-Series A has not been
      disclosed. CTO Jake Graham co-owns the core nesting IP. Departure of either Belosic or Graham would create
      material execution risk. Additionally, Belosic's prior public criticism of VCs as "grifters" creates a
      latent governance tension that investors should probe directly during diligence.
    claimRefs:
      - CO013
      - CO014
      - CO016
      - CO022
      - CO044

  - calloutType: insight
    title: Paradigm's participation signals manufacturing as the next infrastructure frontier
    body: >-
      Paradigm is primarily known as a crypto-native venture fund. Its co-lead role in SendCutSend's Series A
      is a meaningful signal that sophisticated capital is repositioning manufacturing infrastructure as a
      foundational layer of the AI and physical economy—analogous to blockchain infrastructure in the prior cycle.
    claimRefs:
      - CO018
      - CO019
      - CO045

