company:
  name: SendCutSend
chapter:
  number: 1
  title: Company Overview
  summary: >-
    SendCutSend is a Reno, Nevada-based on-demand custom manufacturer founded in 2018 by Jim Belosic that replaced the
    legacy quote-and-wait model of industrial fabrication with a software-driven instant-buy platform. Bootstrapped to
    $200M in annual revenue before accepting outside capital, the company closed a $110M Series A at a $1.01B valuation
    in May 2026 co-led by Sequoia, Paradigm, and the Collison brothers. With 300,000+ customers, 50M+ parts shipped,
    and operations across five facilities in three states, SendCutSend enters its institutional phase from a position
    of demonstrated profitability and high growth.

sections:
  - id: section-identity
    title: Identity, Headquarters, and Operating Model
    body: >-
      SendCutSend is a rapid on-demand custom manufacturer incorporated as Send Cut Send Inc., headquartered at
      4855 Longley Lane, Reno, NV 89502, and established in 2018. The company's core product is an instant-quote,
      buy-now fabrication platform: customers upload CAD files (DXF, DWG, AI, EPS, STP, STEP), receive real-time
      pricing, and place production orders with no minimum quantities. Parts are manufactured and shipped within
      two to four business days on standard orders, with an expedited service enabling delivery in as little as
      48 hours. Every incoming file passes through an automated design-for-manufacturability (DFM) engine before
      entering the production queue.


      The company markets itself as "America's anything factory," a phrase it operationalizes through a catalogue of
      more than 170 materials—spanning aluminum alloys, mild and stainless steels, titanium, copper, brass, carbon
      fiber, polycarbonate, acrylic, MDF, plywood, and rubber/gasket materials—processed via laser cutting, waterjet
      cutting, CNC routing, CNC machining, bending and forming, tumbling, deburring, hardware insertion, tapping,
      countersinking, dimple forming, powder coating, anodizing, and zinc or nickel plating. This breadth of
      in-house capability allows a single customer to procure a finished, surface-treated, hardware-populated part
      from one supplier on a single order.


      The operating model is explicitly software-first. A proprietary nesting algorithm bundles orders from multiple
      customers onto a single sheet of raw material, enabling efficient utilization and low per-unit cost even on
      single-piece orders—a structural advantage over traditional job shops that must treat each customer's sheet
      as a discrete setup. The business model is direct-to-customer transactional manufacturing with volume discounts
      scaling automatically at checkout. Enterprise customers access net-30 payment terms, multi-user organization
      accounts, blanket purchase orders, and dedicated account representatives. All production is domestic;
      SendCutSend sources material from U.S. mills and operates exclusively from U.S.-based facilities.
    claimRefs:
