  - id: FE002
    title: Customer Workflow — Upload to Delivery
    type: flow
    layout: standard
    summary: >-
      End-to-end customer journey from design file to delivered part, illustrating the key
      software touchpoints that differentiate SendCutSend from a traditional job shop.
    data:
      nodes:
        - id: design-cad
          label: Create or obtain CAD file
          detail: >-
            Customer creates a 2D or 3D design file in any of 20+ supported formats. Free
            stencil and laser-cutting templates are available for download.
        - id: upload-platform
          label: Upload to sendcutsend.com
          detail: >-
            Customer selects material, thickness, quantity, and desired secondary operations
            (bending, hardware, finishing) at upload. No account required to price.
        - id: dfm-check
          label: DFM engine validates design
          detail: >-
            Proprietary DFM engine auto-checks hole sizes, kerf, bend radii, and feature
            detail. Issues flagged with actionable feedback before pricing is displayed.
        - id: instant-price
          label: Instant price generated
          detail: >-
            Nesting algorithm calculates optimal sheet utilisation across concurrent customer
            orders. Price reflects material cost, cutting time, secondary ops, and volume tier.
        - id: checkout
          label: Customer places buy-now order
          detail: >-
            Selects standard (2–3 day) or expedited lead time. Enterprise customers may apply
            net-30 or blanket PO. Blind invoicing option available at checkout.
        - id: facility-routing
          label: Order routed to optimal facility
          detail: >-
            Production planning system schedules order to best-available facility in NV, KY,
