  - id: manufacturing-process-breadth
    title: Manufacturing Process Breadth
    body: >-
      SendCutSend operates three primary 2D cutting technologies—fiber laser, waterjet, and CNC
      routing—plus CNC machining for 3D billet work, and a suite of secondary operations. The
      platform automatically assigns the optimal cutting process to each material; customers choose
      materials, not machines.


      Laser cutting is the fastest and most economical process, using high-powered fiber lasers
      ranging from 4 kW to 12 kW plus a fleet of CO2 lasers. Cutting speeds reach 2,500 inches per
      minute for simple geometries. Fibre laser tolerances are ±0.005 inches. Holes and cutouts must
      be at least 30 percent of the material thickness. A heat-affected zone (HAZ) can occur on
      thicker stock but is minimised by beam diameter and cutting speed; the company includes
      deburring for applicable materials at no extra charge.


      Waterjet cutting uses high-pressure water mixed with garnet abrasive, producing no HAZ—the
      primary reason composite materials like carbon fiber, G10, and LE phenolic are exclusively
      waterjet-cut. Waterjet tolerance is ±0.009 inches. Interior corners require a minimum radius
      of 0.032 inches and holes a minimum diameter of 0.070 inches due to the jet stream width.
      Edge finish is superior with no dross, but cutting is significantly slower than laser.


      CNC routing delivers ±0.005 inch tolerance using a 1/8-inch carbide bit. It excels at
      plastics, woods, and composites but cannot perform threading, countersinks, 3D contour, or
      V-grooves; all interior corners must have a ≥0.063-inch radius. Parts with more than 50
      percent material removal (grilles, grates) carry a rejection risk and are better suited to
      laser cutting. CNC machining in billet stock handles 3D features not achievable in 2D
      sheet-cutting processes.


      Secondary operations—bending, hardware insertion, and finishing—are available as add-ons in
      the same order checkout. Bending is available for eight metals up to 0.250-inch stock and
      44 × 30-inch flat size, achieving within one degree of accuracy. Hardware insertion covers
      tapping, countersinking, dimple forming, and PEM nut insertion. Finishing options include
      Class II anodizing (five colors), zinc and nickel plating, powder coating (eleven colors),
      tumbling, and deburring.
