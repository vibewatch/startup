  - id: TE003
    title: Technology and Operating Architecture
    columns:
      - Layer / Process
      - Role
      - Dependency
      - Risk
    rows:
      - - Web Upload Interface
        - CAD file intake; supports 20+ file formats
        - Browser-based; internet connectivity required
        - Client-side validation limited; no desktop or ERP plug-in integration disclosed
      - - DFM Engine
        - Auto-validates designs for manufacturability before pricing
        - Proprietary software; no public API or third-party access
        - Black-box output; errors may not expose root cause to experienced users
      - - Nesting Algorithm
        - Multi-customer sheet packing; drives material utilisation and per-part cost
        - Co-authored by CTO Jake Graham; fully proprietary
        - Key-person concentration risk; no public patent or secondary authorship disclosed
      - - Instant Pricing Engine
        - Generates real-time price from geometry, material, process, and quantity
        - Real-time material pricing; sheet utilisation model
        - Price accuracy depends on algorithm freshness vs. raw material market moves
      - - Production Planning System
        - Routes orders to optimal facility (NV, KY, TX) by capacity and material availability
        - Operations team + scheduling software (ERP vendor undisclosed)
        - Facility-specific capacity limits; expedited subject to availability gating
      - - CNC Machine Fleet
        - Executes laser cutting, waterjet, CNC routing, bending, hardware insertion
        - Machine OEMs; garnet abrasive supply chain for waterjet operations
        - Supply chain dependency on garnet availability and machine maintenance cycles
      - - Finishing Lines (Anodizing, Plating, Powder Coat)
        - Applies surface treatments per customer selection
        - Chemical supply chain; environmental compliance (undisclosed certifications)
        - Part eligibility constraints; limited to SendCutSend's catalog of finishing options
      - - Shipping Integration
        - Connects production output to major US carriers; updates order tracking
        - UPS, FedEx, and other major US carriers; overnight for Fastest option
        - Holiday and weather disruptions; service delay events publicly acknowledged
    notes: >-
