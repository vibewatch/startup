  - id: constraints-and-limitations
    title: Capability Constraints and Adverse Signals
    body: >-
      SendCutSend's platform has explicit and documented capability limits that define where it is
      not an appropriate manufacturing source. Bending is restricted to eight metals; it does not
      support acute angles greater than 130 degrees, curl, bump, roll forming, coining, or hemming.
      CNC routing interior corners cannot be sharper than 0.063 inches. Laser cutting does not
      process materials that produce hazardous gases when burned (e.g., PVC) or highly flammable
      thick materials. Waterjet is not practical for very large parts that exceed the machine bed.
      Three-dimensional CNC machining capability scope (beyond 2D sheet plus billet machining) is
      not fully detailed in public documentation.


      From an independent practitioner perspective, Hackaday's engineering community documented in
      December 2021 that laser-cut metal parts from SendCutSend "arrive by default with a
      characteristic rough edge" requiring hand-finishing. The same community confirmed that hole
      precision is sufficient for M3×0.5 hand tapping and that the platform applies automatic kerf
      compensation—confirming both a limitation (raw edge finish) and a strength (dimensional
      accuracy).


      On the security and compliance side, the DFARS 252.204-7012 and NIST SP 800-171 compliance
      claims are self-attested and not independently audited in any public disclosure. OSH Cut holds
      ISO 9001:2015 certification; SendCutSend does not publicly claim an equivalent. For customers
      with formal quality-system requirements (AS9100D, ISO 9001, ITAR registration), the absence
      of certifications is a procurement barrier.


      Production reliability risk is real but modest: the company publicly posts service delays
      for carrier holidays and facility maintenance, acknowledging that the 24/7 production model
      has scheduled interruptions. No independent data on machine uptime, scrap rates, or first-pass
      yield is publicly available.
