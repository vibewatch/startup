  - id: TE002
    title: Workflow and Use-Case Table
    columns:
      - User Job
      - Traditional Workflow Pain
      - SendCutSend Solution
      - Measurable Benefit
      - Limitation
    rows:
      - - Prototype one-off part
        - Quote request 1–5 business days; manual DFM; minimum order charges
        - Upload CAD → DFM check → instant price → buy now
        - Zero minimum quantity; same-day quoting; 2–3 day delivery
        - No on-site engineering support; DFM feedback is algorithmic only
      - - Small production run (10–500 parts)
        - Setup fees; minimum charges; rework risk from late-stage DFM
        - Volume discount auto-applied at checkout; DFM pre-checks design
        - Up to 70% volume discount; consistent pricing transparency
        - No contractual production SLA; expedited subject to availability
      - - Enterprise production replenishment
        - Complex procurement, manual POs, multiple vendor management
        - Org accounts, net-30 terms, blanket POs, dedicated rep, shared carts
        - Reduced procurement friction; consolidated supplier footprint
        - On-demand only; no VMI, no inventory held at SendCutSend
      - - Design iteration cycle
        - Waiting for quote and DFM turnaround from shop before next iteration
        - DFM flags errors instantly; re-upload revised file with new instant price
        - Faster iteration; reduced rework cost at prototype stage
        - DFM is not an engineering certification; complex tolerance stacks need manual review
      - - Multi-operation part (cut + bend + finish)
        - Multiple vendors for each operation; logistics management burden
        - Single order covers all secondary operations at checkout
        - Reduced vendor count; single tracking number; unified quality accountability
        - Operations limited to SCS catalogue; no post-delivery assembly or kitting
      - - Supply chain component sourcing
        - Long-lead vendors; high minimum order quantities; setup delay
        - 2–3 day lead time; no minimums; on-demand fabrication as needed
        - Eliminates buffer inventory; faster time-to-market
        - No consigned stock, no blanket-order inventory reservation
    notes: >-
      Benefit figures (70% discount) are list-pricing based; actual realised discounts depend
      on part geometry, material, and order mix. No independent verification of discount depth
