chapter:
  number: 5
  title: Product & Technology
  summary: >-
    SendCutSend's platform combines a proprietary DFM engine, multi-customer nesting algorithm, and
    a catalogue of 170+ materials processed across five domestic facilities to deliver instant-priced,
    buy-now custom fabrication with 2–3 day standard lead times. The software-first architecture—where
    every uploaded file is auto-checked, priced, and routed to production without human quoting—is the
    company's primary competitive moat; its chief vulnerability is concentration of the nesting IP in
    co-founder CTO Jake Graham and the absence of publicly verifiable quality certifications such as
    ISO 9001.

sections:
  - id: product-architecture-workflow
    title: Product Architecture and Customer Workflow
    body: >-
      SendCutSend's core product is a browser-based instant fabrication platform that replaces the
      traditional quote-and-wait cycle. Customers upload a CAD file in any of more than 20 supported
      formats—DXF, DWG, AI, EPS, STP, STEP, SLDPRT, CATPART, IPT, IGS, PAR, IGES, NX, SolidEdge,
      JT, 3DM, x_t, SAT, and SAB—select material, thickness, quantity, and desired secondary
      operations, and receive an instant price. No phone call, no email, no sales cycle.


      The platform's two proprietary software engines are the sources of differentiation. The
      design-for-manufacturability (DFM) engine validates every uploaded file before pricing: it
      flags minimum hole sizes, bridging, bend radii, and feature detail issues that would otherwise
      cause a rejected production run, returning actionable feedback immediately. Every order placed
      also passes through the nesting algorithm co-authored by CTO Jake Graham, which packs shapes
      from multiple simultaneous customer orders onto a shared sheet of raw material, maximising
      sheet utilisation. This multi-customer nesting is the mechanism that enables SendCutSend to
      offer no-minimum-quantity pricing without the per-setup costs that force traditional job shops
      to charge order minimums.


      Checkout includes lead-time selection: standard 2–3 business days or an Expedited Service
      (Fast: rush production; Fastest: rush production plus overnight shipping). Enterprise customers
      additionally access a Saved Carts feature for quote sharing, blanket purchase orders, and
      net-30 terms. The CEO has stated that 91 percent of orders ship within five business days on
      the standard service, and that some expedited orders move from upload to production in under
      30 minutes.
