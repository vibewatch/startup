  - id: operational-model-quality
    title: Operational Model and Quality Systems
    body: >-
      SendCutSend operates five production facilities across three U.S. states: Reno, Nevada (HQ
      and primary production); Paris, Kentucky; and Arlington, Texas. The geographic distribution
      enables the expedited service to deliver anywhere in the contiguous United States within 48
      hours when rush production plus overnight shipping is selected. Production runs 24 hours a day,
      seven days a week, with more than 300 staff across the facility network as of 2025.


      Material is sourced from U.S. mills, and all production is domestic. Orders ship via major U.S.
      carriers; shipping is free on orders over $39. Standard delivery is two to four business days.
      Canada shipping is available with 2–4 day production and 2–4 day transit time to major Canadian
      cities (Montreal, Vancouver, Calgary, Toronto), with taxes and duties collected at checkout.


      Quality at the part level is controlled through process calibration: laser kerf compensation
      is applied automatically by software so that customers can submit nominal-dimension files
      without manual offset. CNC routing tabs are placed and removed to prevent part movement during
      cutting, leaving a minor residual that may require hand finishing. Waterjet delivers a superior
      edge finish with no dross or burr. Deburring is included for applicable laser-cut materials at
      no charge.


      The company discloses that production facilities may be idled for maintenance or holidays, and
      shipping carrier holidays create shipping gaps. These disclosures are posted publicly on the
      service-delays page. There is no published SLA or uptime guarantee for the production schedule.
      Expedited service availability depends on order weight, material availability, and complexity,
      creating a variable ceiling on rush-service coverage that customers cannot pre-verify at
      design time.
