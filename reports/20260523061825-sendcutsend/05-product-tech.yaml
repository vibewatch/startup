  - id: materials-and-specifications
    title: Materials Catalogue and Specifications
    body: >-
      The materials catalogue spans more than 170 distinct SKUs across metals, plastics, composites,
      wood, and rubber. In metals, the company stocks aluminum alloys (5052, 6061, 7075, 2024 T3),
      mild steels (A36, G90), stainless steels (304, 316), chromoly steel (4130), specialty alloys
      (AR500, 1075 blue temper), copper, brass, and titanium. Plastic offerings include
      polycarbonate, acrylic, HDPE, ABS, Delrin, UHMW, and others. Composite and specialty materials
      include carbon fiber, G10, LE phenolic, ACM (aluminum composite material), and rubber or
      gasket sheet.


      Standard instant-quote part sizes run up to 44 × 30 inches (1,117.6 × 762 mm); custom-quote
      parts can reach 56 × 30 inches (1,422.4 × 762 mm). Material-specific minimum sizes and
      thickness ranges are published in a publicly accessible min/max chart. Thicknesses begin as
      low as 0.015 inches (1075 Blue Temper Steel) and extend beyond 0.500 inches for some
      materials. Each material page publishes the applicable cutting process, tolerance, kerf
      estimates, and secondary-operation eligibility.


      The material selection guide aids customers in matching material properties to application
      requirements—strength, outdoor suitability, signage, electrical conductivity, and thermal
      performance. A material properties cheat sheet publishes key engineering values (tensile
      strength, hardness, elongation, thermal conductivity) for all plastic materials to allow
      direct comparison. This depth of published technical data reduces customer support burden and
      shortens the design-iteration cycle by letting engineers make substitution decisions without
      requesting quotes for multiple materials.
    claimRefs:
      - CE022
      - CE023
      - CE024
