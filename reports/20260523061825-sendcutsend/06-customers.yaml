  - id: section-named-proof
    title: Named Customer Proof and Use Cases
    body: >-
      The most detailed customer evidence available is drawn from SendCutSend's own blog case studies and from third-party review platforms. These sources document a wide range of use cases but share the limitation of being either company-curated or small-scale individual testimonials rather than audited enterprise deployments. The company's blog has profiled customers including: Cap for Kids (nonprofit using SCS for Captain America cosplay shield brackets and shoulder hardware), NiteOwl Tattoo Furniture (small-batch tattoo-furniture manufacturer sourcing laser-cut steel brackets), Tyler Bell (Boeing engineer who runs a hobby fabrication studio and sources all custom metalwork from SCS), Logan Teale (a knife and tool maker who reported selling 2,000+ tools in 18 months with SCS as sole production source), and Team Witch Doctor (a BattleBots team sponsored by SCS using titanium and steel laser-cut frames and housings). Multiple fabrication-shop owners and custom automotive builders are quoted in the testimonials section, with several citing multi-year, high-frequency ordering patterns.


      The enterprise-proof dimension is substantially thinner. No Fortune 500 company has been named as a customer in any third-party reporting. The NNBW article confirms that "some well-known business names" appeared in the order queue within six months of launch but does not name them. The Inc. profile states that big transportation and defense companies are now customers but names none specifically. The official anything-factory press release names sector verticals—"Fortune 500 companies operating across aerospace, defense, space flight, data centers, robotics, automation, transportation"—but again provides no named accounts. This absence of named enterprise references is a material diligence gap: it prevents independent assessment of production scale, contract terms, compliance requirements, or renewal risk within the enterprise segment.


      Review-platform data from Trustindex (aggregating Google reviews) shows a consistent pattern of 5-star ratings from individual customers in May 2026, citing fast turnaround, accurate parts, and responsive customer service. Multiple reviewers mention repeat orders and multi-year relationships. One reviewer (Mike Hansen, Trustindex, May 2026) explicitly stated "50+ orders from them over the years" with consistent quality. These are independent signals, though they represent individual buyers rather than enterprise accounts and are likely skewed toward satisfied repeat customers who chose to leave reviews.
