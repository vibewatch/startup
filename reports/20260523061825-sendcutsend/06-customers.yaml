callouts:
  - calloutType: strength
    title: Extreme Customer Diversification Limits Concentration Risk
    body: >-
      With the highest-revenue customer at only 0.59% of income and more than 300,000 total accounts
      across 11+ verticals and both consumer and enterprise segments, SendCutSend carries minimal
      single-customer or single-vertical concentration risk. Revenue resilience across macro cycles
      is structurally embedded in this breadth.
    claimRefs:
      - CU029
      - CU030
      - CU001

  - calloutType: risk
    title: Enterprise Retention Evidence Is Thin and Unaudited
    body: >-
      No NRR, GRR, cohort retention data, or named Fortune 500 customer references have been publicly disclosed.
      The Fortune 500 penetration claim (>50%) is unaudited and likely includes single-prototype orders with no
      production commitment. Investors cannot assess churn risk, same-customer revenue expansion, or enterprise
      account durability without audited retention data.
    claimRefs:
      - CU031
      - CU037
      - CU038

  - calloutType: risk
    title: Enterprise Compliance Certifications Not Confirmed
    body: >-
      No ITAR registration, ISO 9001, AS9100, or equivalent enterprise-compliance certification has been
      publicly confirmed. For the defense, aerospace, and space customers that SendCutSend claims to serve,
      these certifications are often procurement prerequisites. Absence of confirmed certifications
      creates a cap on the addressable enterprise market until resolved.
    claimRefs:
      - CU039
      - CU005

