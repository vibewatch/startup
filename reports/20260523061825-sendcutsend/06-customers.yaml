    title: AI / Data-Center Demand Is the Key 2026 Demand Catalyst
    body: >-
      Sequoia, Paradigm, and Belosic himself have explicitly identified AI infrastructure buildout—data-center
      racks, robotics, EV components—as the primary driver of accelerated enterprise demand in 2026. This vertical
      is capital-intensive and fast-moving, suggesting strong near-term demand; the risk is cyclicality if AI capex
      cools.
    claimRefs:
