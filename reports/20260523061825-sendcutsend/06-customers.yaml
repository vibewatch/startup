  - id: TU005
    title: Expansion Drivers and Concentration Risk
    columns:
      - Dimension
      - Signal / Evidence
      - Impact on Risk
      - Diligence Path
    rows:
      - - Top-customer revenue share
        - "0.59% of total income (Belosic / NNBW Jan 2026)"
        - Very low single-customer dependency; structurally positive
        - Verify with audited revenue disaggregation; confirm denominator is gross revenue
      - - Customer diversification
        - "300k+ customers across 11+ verticals; 70k+ businesses; CEO: 'very, very diverse'"
        - Low concentration by account; high breadth
        - Segment-level revenue attribution; hobbyist vs. SMB vs. enterprise share
      - - Fortune 500 depth
        - ">50% of Fortune 500 claimed as customers; no named accounts"
        - High breadth claimed but depth unverified; revenue per Fortune 500 account unknown
        - Audited customer list with contract value ranges; minimum spend per Fortune 500 account
      - - Vertical concentration
        - AI / data-center demand cited as primary 2026 growth driver
        - Positive short-term; creates cyclical risk if AI capex pulls back
        - Revenue attribution by vertical; share of 2026 incremental revenue from data-center/AI
      - - Geographic concentration
        - "US-centric; Canada added; no other international geographies"
        - Moderate risk; single-country currency/demand exposure
        - Revenue by geography; Canada contribution; planned international expansion timeline
      - - Channel dependence
        - "100% direct-to-customer; no resellers, distributors, or VAR channel"
        - Low channel risk; high platform dependence (proprietary website and app)
        - Platform uptime and outage history; contingency for extended platform downtime
      - - Enterprise certification gaps
        - No ITAR, ISO 9001, AS9100 certification publicly confirmed
        - High risk for defense/aerospace accounts requiring compliance certification
        - Confirm certification status directly with SCS; assess % of revenue from regulated buyers
    notes: >-
      Concentration metrics are based on CEO statements; no audited revenue breakdown by segment or customer has been published.
