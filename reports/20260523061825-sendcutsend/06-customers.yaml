  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-data
      missingEvidence: >-
        Audited NRR, GRR, and customer cohort retention curves disaggregated by segment (hobbyist, SMB, enterprise).
      whyItMatters: >-
        Without cohort data, it is impossible to distinguish new-customer growth from same-customer expansion,
        assess churn risk, or validate the implied durability of the enterprise revenue base.
      diligencePath: >-
        Request audited cohort retention schedules from management; ask for 12-month and 24-month customer retention
        rates broken out by segment and first-order date vintage.
      relatedQuestionRefs:
        - QU025
        - QU018

    - type: private-evidence-only
      severity: material
      topic: adverse-Fortune-500
      missingEvidence: >-
        Named Fortune 500 customer references with confirmed production-scale contracts, spend levels, and renewal history.
      whyItMatters: >-
        The current Fortune 500 penetration claim is unaudited and could reflect minimal one-off prototype purchases;
        without named references, the enterprise revenue quality cannot be assessed.
      diligencePath: >-
        Request at least three named Fortune 500 customer references with willingness to speak; obtain revenue attribution
        by segment (Fortune 500 vs. SMB vs. hobbyist) as a minimum disclosure.
      relatedQuestionRefs:
        - QU007
        - QU012
        - QU015
        - QU017
      relatedTableRefs:
        - TU003

    - type: private-evidence-only
      severity: material
      topic: adverse-certifications
      missingEvidence: >-
        Confirmation of ITAR registration, ISO 9001, AS9100, CMMC, or other enterprise/defense compliance
        certifications required by regulated procurement programs.
      whyItMatters: >-
        Defense, aerospace, and government-adjacent procurement typically requires documented compliance certifications
        as a condition of supplier qualification; absence would cap the addressable market in those verticals.
      diligencePath: >-
        Request certification documentation directly from SendCutSend; cross-check against the ITAR registrant database
        and ISO certification bodies.
      relatedQuestionRefs:
        - QU011

    - type: missing-source
      severity: minor
      topic: adverse-testimonials
      missingEvidence: >-
        Independent survey or third-party Net Promoter Score (NPS) data capturing the full distribution of
        customer satisfaction, including dissatisfied customers who did not leave reviews.
      whyItMatters: >-
        Review platforms are biased toward satisfied customers who voluntarily engage; the absence of systematic
        satisfaction data means the 5-star rating could mask a minority of high-severity dissatisfaction cases.
      diligencePath: >-
        Request management's NPS or CSAT data; search consumer complaint databases (BBB, Trustpilot, Reddit) for
        unresolved complaints or quality-failure patterns.
      relatedQuestionRefs:
        - QU010
        - QU013

