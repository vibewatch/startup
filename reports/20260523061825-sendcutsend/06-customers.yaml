  - id: section-adoption
    title: Adoption Trajectory and Scale Metrics
    body: >-
      SendCutSend's published adoption metrics show strong absolute scale and rapid growth trajectory, though they remain self-reported and unaudited. The company shipped 50 million parts to more than 300,000 customers as of the May 2026 funding round. The Northern Nevada Business Weekly reporting from January 2026 documented "more than 30 million custom parts by the end of 2025 for more than 300,000 customers," consistent with a rapid acceleration in the first five months of 2026. The reported 80% year-over-year revenue growth rate, if sustained, implies a near-doubling of the parts-shipped figure over the subsequent 12–15 months. Earlier milestones corroborate the growth arc: the first Inc. 5000 listing cited 1,600% revenue growth over three years, and the company cut more than 2 million parts in its first full year of public-facing operations.


      Volume discounts scale automatically at checkout from the first identical duplicate, reaching up to 70% at production quantities—a pricing structure that creates natural economic incentives for customers to consolidate multiple SKUs with a single supplier. The expedited service, launched in 2025, added urgency-driven pull: 91% of orders ship in five days or less under standard service, while the Fast and Fastest tiers inject orders into the production queue and combine rush production with overnight shipping, enabling some orders to go from upload to delivery in 48 hours. Canada expansion extended the customer geography beyond the US, with flat-rate $19 Priority International shipping and 2–4 day production-plus-transit times to major Canadian cities.


      The 1,000+ daily projects claimed on the commercial landing page and the "5.0 star Google rating" provide additional order-of-magnitude framing for daily throughput, though neither figure comes with auditable third-party verification. The three consecutive Inc. 5000 rankings (#339 in 2022 or early cycle, then #511 in 2025 for the third year) provide an independent signal of sustained revenue growth even if the exact growth rates underlying each ranking are not disclosed by Inc.
