company:
  name: SendCutSend
chapter:
  number: 6
  title: Customers
  summary: >-
    SendCutSend serves more than 300,000 customers ranging from individual hobbyists and makers through SMBs, engineering teams, and procurement organizations at large enterprises including, by company claim, more than half of the Fortune 500. The customer base spans aerospace, defense, robotics, data centers, transportation, and a broad long-tail of hobby and custom-fabrication use cases. Revenue is highly diversified—the top customer represents only 0.59% of income—but critical retention metrics (NRR, GRR, cohort data) have not been publicly disclosed, and the Fortune 500 penetration figure remains an unaudited marketing claim with no named enterprise references.

sections:
  - id: section-segmentation
    title: Customer Segmentation and Buyer Profiles
    body: >-
      SendCutSend's customer base is explicitly multi-segment, spanning individual hobbyists and makers at one end of the spectrum and Fortune 500 procurement organizations at the other. The company's foundational promise—no minimum order quantities, instant pricing, and domestic shipping in days—was designed to serve hobbyists and small-scale fabricators who had been shut out of traditional job shops requiring minimum runs of hundreds of units. As of the May 2026 funding announcement, the company works with "more than 70,000 businesses across the US" alongside the broader 300,000+ total customer count, suggesting a substantial long-tail of individual/hobby buyers and a meaningful but minority share of business accounts.


      The enterprise segment has grown organically and now spans a wide range of industry verticals. The company's official press release from May 2026 names aerospace, defense, space flight, data centers, robotics, automation, transportation, marine, agriculture, distribution, and general manufacturing as verticals served. The Inc. magazine profile published in May 2026 further specifies that transportation and defense companies were among the earliest enterprise adopters, attracted by SCS's speed and operational simplicity: "Turns out, they just needed stuff really, really fast, and they needed it really easy," Belosic told the Wall Street Journal. The AI infrastructure build-out brought a new wave of data-center-rack and robotics customers. The company claims 59.8% Fortune 500 penetration, though no list of named customers or independent verification of this figure has been published.


      Buyer profiles within the business segment are further differentiated by function: engineering teams use SCS for rapid prototyping and design iteration; purchasing/procurement departments leverage blanket purchase orders and net-30 terms for repeat production runs; and operations teams use scheduled repeat orders to maintain predictable supply-chain throughput. The drone-manufacturing guide published on the SCS blog provides a detailed breakdown of four customer sub-types within a single vertical: personal/hobbyist, small-business/startup, industrial/commercial, and military/aerospace defense contractors—a taxonomy that illustrates the breadth of the platform's addressable use cases within a single end-market.
    claimRefs:
