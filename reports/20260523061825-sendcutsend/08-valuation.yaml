- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status / metric date
  - Revenue or scale marker
  - Observed multiple / valuation
  - Relevance
  - Limitation
  rows:
  - - Xometry (XMTR)
    - Public, May 22 2026
    - TTM revenue ~$740.8M; Q1 revenue $205.1M
    - EV/revenue ~6.49x; P/S ~6.16x
    - Shows market appetite for software-enabled manufacturing growth
    - Marketplace model with higher liquidity and less owned-capacity risk
  - - Proto Labs (PRLB)
    - Public, May 22 2026
    - TTM revenue ~$546.3M; FY2025 revenue $533.1M
    - EV/revenue ~2.86x; P/S ~3.16x
    - Useful owned-capacity benchmark for mature digital manufacturing
    - Slower growth and more mature profile than SendCutSend
  - - Materialise (MTLS)
    - Public, May 22 2026
    - TTM revenue ~$267.5M; Q1 revenue ~$66.3M
    - EV/revenue ~0.84x; P/S ~1.12x
    - Shows lower-growth manufacturing software / hardware trading range
    - 3D-printing software mix not directly comparable
  - - Fictiv / MISUMI
    - Private strategic sale, 2025
    - Revenue undisclosed; digital-manufacturing platform
    - ~$350M acquisition value disclosed publicly
    - Relevant private strategic exit marker
    - Revenue undisclosed, global network model differs
  - - Fast Radius / SyBridge
    - Distress sale, 2022-2025 context
    - Digital-manufacturing SPAC that failed
    - Section 363 asset sale after bankruptcy
    - Important downside and financing-discipline cautionary comparable
    - Distress case, not a healthy going-concern comp
  notes: Comparable set blends public markets and private strategic transactions because no single peer matches SendCutSend exactly.
  enumerationScope:
    coverage: partial
    basis: The set covers the most decision-relevant public and transaction references available in public sources, but it cannot exhaustively cover private secondary marks, undisclosed cap tables, or every niche fabrication platform with limited disclosure.
