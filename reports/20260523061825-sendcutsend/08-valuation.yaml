- id: section-scenarios
  title: Bull, base, and bear outcomes
  body: 'Scenario analysis is the right tool here because the public data is too thin for false precision. In the bull case, SendCutSend compounds into roughly $500M revenue by 2028, keeps growth premium support, and exits around 5x to 6x revenue. That can produce a roughly $2.5B to $3.0B outcome, which is attractive but still far from venture-style infinite upside. In the base case, the company keeps growing but re-rates toward mature-manufacturing multiples, producing something close to a $1.05B to $1.2B value by 2028. That is only modestly above the current price. In the bear case, growth cools toward 30%, public sentiment weakens, and multiples compress toward 2.5x to 3.0x, putting value in the roughly $600M to $750M range. The message is straightforward: today''s round still offers upside, but the upside is not large enough relative to the unresolved diligence stack to justify a buy-like stance.'
  claimRefs:
  - CV021
  - CV022
  - CV023
  - CV024
  - CV039
  - CV040
  - CV041
  tableRefs:
  - TV003
  figureRefs:
