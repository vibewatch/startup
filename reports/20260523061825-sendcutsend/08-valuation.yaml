  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: comparable-set-coverage
    missingEvidence: A complete private-market transaction set with disclosed revenue, margin, and preference-stack detail for on-demand fabrication businesses comparable to SendCutSend.
    whyItMatters: Public comps and strategic transactions are directionally useful, but they cannot fully capture how private investors are pricing owned-capacity digital manufacturers with limited disclosure.
    diligencePath: Request banker / investor comp sheet under NDA and compare to the public benchmark set used here.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Audited financial statements, gross margin by service line, and a bridge reconciling the October 2025 $100M milestone to the May 2026 ~$200M annual revenue claim.
    whyItMatters: Without audited numbers, the current price cannot be stress-tested on first principles; all scenario math rests on management- or investor-supplied revenue claims.
    diligencePath: Request audited financials or at minimum lender-grade management accounts and service-line margin disclosure.
    relatedQuestionRefs:
    - QV016
    - QV020
    - QV029
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Series A liquidation preferences, anti-dilution mechanics, option pool, board rights, and any senior lender constraints that affect common-equity outcomes.
    whyItMatters: Gross company-value scenarios do not automatically translate into investor returns; the waterfall can materially compress upside for late investors.
    diligencePath: Request a fully diluted cap table and financing summary from counsel or the CFO.
    relatedQuestionRefs:
    - QV015
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: regulated-enterprise-proof
    missingEvidence: Named enterprise references, certification packets, and cyber-audit evidence that support the higher-value regulated-customer narrative.
    whyItMatters: A meaningful share of the premium valuation appears to assume durable enterprise penetration beyond hobby or SMB work; public proof is still thin.
    diligencePath: Request enterprise-reference calls, customer cohort data, and regulated-customer qualification documents.
    relatedQuestionRefs:
    - QV020
    - QV021
    relatedTableRefs:
    - TV005
    - TV006
