- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - Software-enabled manufacturing moat
    - Instant quoting, owned capacity, broad materials/services, strong growth narrative
    - Verified uptime, gross margin, and repeat-order economics
  - - Domestic scale and enterprise relevance
    - Five facilities, 24/7 operations, Fortune-500 / defense-adjacent demand claims
    - Named enterprise references and regulated-customer proof
  - - Growth premium is deserved
    - 100M milestone in Oct 2025 and ~200M annual revenue by May 2026
    - Audited financial bridge from 100M to 200M plus margin disclosure
  - - Price is too high for an industrial model
    - 5.05x implied revenue multiple on a non-recurring, capex-heavy business
    - Better entry price or proof of sustained premium public-comp support
  - - Disclosure opacity is manageable
    - High-profile investors participated, but public detail remains thin
    - Cap table, lender terms, board rights, and audits provided in diligence
  notes: Bull and bear arguments are both evidence-backed; the decision turns on missing diligence and entry discipline rather than on company quality alone.
