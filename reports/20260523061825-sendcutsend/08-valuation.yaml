- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Growth slows sharply without margin proof
    - Annual growth falls near 30% while gross margin remains undisclosed
    - Premium multiple support breaks
    - Move from track to avoid at current price
  - - Service-quality moat degrades
    - Persistent late-ship or remake metrics signal the speed proposition is slipping
    - Bull thesis on software-enabled reliability weakens
    - Cut upside scenario and rebase comp set lower
  - - Financing friction emerges
    - Lender terms tighten or new capacity requires unexpectedly dilutive equity
    - Return profile compresses through dilution and slower expansion
    - Treat base case as downside case
  - - Regulated-enterprise upside fails to materialize
    - Key defense / aerospace accounts stall on certification or compliance gaps
    - Enterprise growth narrative weakens materially
    - Reduce TAM and exit-multiple assumptions
  - - Governance / disclosure resistance persists
    - Management refuses audited diligence package at a stretched price
    - Price cannot be underwritten responsibly
    - Do not invest
  notes: Kill triggers are defined for a new-money investor evaluating participation at the 2026 round price.
