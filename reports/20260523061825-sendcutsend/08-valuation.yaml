- id: section-exit-diligence
  title: Exit readiness, diligence asks, and thesis-break triggers
  body: 'SendCutSend is not obviously IPO-ready on the basis of public evidence alone. The business may eventually earn that option, but today it still looks more like an M&A or later-stage crossover candidate than a near-term public company. Strategic buyers can value plant utilization, software workflow, customer lists, and domestic footprint in ways that are hard to express cleanly through public-market comp tables without full disclosure. That is why final diligence asks matter so much. Investors need audited financials, gross-margin detail, lender terms, cap-table mechanics, and evidence that enterprise and regulated-customer upside is real. Without those items, the thesis can break in several ways: growth can slow without proof of margin durability; service quality can slip; financing can become tighter; or enterprise expansion can prove shallower than the current narrative implies. None of those outcomes is the base case, but all of them are plausible enough that they should govern
    the investment process today.'
