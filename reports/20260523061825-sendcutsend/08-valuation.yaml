  - CV028
  - CV031
  - CV032
  - CV033
  - CV036
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / path
  rows:
  - - Audited financials
    - Income statement, balance sheet, cash flow, revenue bridge
    - Validates the core revenue and profitability narrative
    - Management / auditor data room
  - - Gross margin by service line
    - Laser, CNC, finishing, expedited mix economics
    - Determines whether premium valuation is supported by unit economics
    - Finance team
  - - JPMorgan debt package
    - Outstanding balances, covenants, maturities, collateral
    - Critical for dilution and expansion-risk modeling
    - CFO / lender summary
  - - Cap table and preferences
    - Series A terms, liquidation stack, anti-dilution, board rights
    - Return modeling is incomplete without it
    - Legal / finance
  - - Enterprise compliance pack
    - DFARS scope, ITAR status, certifications, cyber audits
    - Needed to underwrite regulated-customer upside
    - Security / legal / sales
  - - Facility KPI pack
    - Uptime, scrap, remake, late-ship, labor turnover
    - Tests whether the service moat is real and scalable
    - Operations
  notes: Without these items the recommendation should remain track or research-more rather than invest.
