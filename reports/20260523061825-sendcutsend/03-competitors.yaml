callouts:
  - calloutType: strength
    title: Owned Capacity Is the Moat Foundation
    body: >-
      SendCutSend's fully owned US production capacity enables deterministic quality control, predictable
      lead times, and structural cost advantages via nesting economics — none of which marketplace
      intermediaries can replicate without owning assets. This model also eliminates supplier-failure
      risk and aligns with enterprise quality standards for non-regulated buyers. The 300,000-customer
      installed base reflects years of loyal repeat behavior that marketplace models (which do not own
      the customer relationship at the transaction level) struggle to replicate.
    claimRefs:
      - CP026
      - CP027
      - CP028

  - calloutType: risk
    title: Xometry's Enterprise Penetration Compresses SendCutSend's Lead
    body: >-
      Xometry's 40% marketplace revenue growth, 1,864 enterprise accounts spending $50K+ annually (up 21%
      YoY), and the Siemens Xcelerator integration represent a structural escalation of competitive
      pressure on SendCutSend's enterprise opportunity. If Siemens' 1M+ industrial software users are
      routed through Xometry's quoting interface as a default, SendCutSend faces a channel disadvantage
      in enterprise RFQ workflows without a comparable platform-embedded integration strategy.
    claimRefs:
      - CP003
      - CP005
      - CP007
      - CP039

  - calloutType: risk
    title: Certification Gap Structurally Excludes Regulated Markets
    body: >-
      SendCutSend does not have publicly confirmed AS9100D, ITAR, or ISO 13485 certifications. These
      certifications are contractually required for aerospace prime contractors, US defense programs,
      and medical device manufacturers — segments that pay premium pricing and exhibit high supplier
      retention. Xometry holds all three, enabling it to address regulated procurement that SCS currently
      cannot serve. This is a revenue ceiling, not merely a reputational gap.
    claimRefs:
      - CP006
      - CP026

  - calloutType: insight
    title: Fast Radius as Cautionary Comparable
    body: >-
      Fast Radius raised only $106M of an anticipated $300–445M via a SPAC that suffered 91% stockholder
      redemption, then filed for bankruptcy in 2022 despite producing 15M+ parts and 150,000+ designs.
      The failure demonstrates that digital manufacturing capital intensity scales faster than revenue when
      certifications, supplier management, and enterprise sales cycles absorb cash. SendCutSend's
      bootstrapped profitability before its May 2026 institutional raise distinguishes it from this failure
      mode — but the lesson is that capital adequacy is the primary survival variable in this category.
    claimRefs:
      - CP022
      - CP023
      - CP024
      - CP025

