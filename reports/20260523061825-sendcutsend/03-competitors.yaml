  - id: substitutes-status-quo
    title: Substitutes, Status Quo, and Lessons from Failed Comparables
    body: >-
      Beyond direct digital platform competitors, SendCutSend competes against three substitute categories:
      (1) regional job shops as the status-quo default; (2) in-house captive fabrication by engineering-centric
      buyers; and (3) offshore sourcing via contract manufacturers or trading companies, particularly for
      buyers with longer planning horizons and cost-sensitive production volumes.

      Regional job shops dominate local industrial procurement but are structurally disadvantaged on
      speed (2–6 week lead times versus 2–4 days), digital accessibility (no instant pricing), and minimum
      order size (typically 25–500 pieces minimum). SendCutSend converts job-shop customers by eliminating
      the minimum and compressing turnaround. The switching decision is driven by urgency and design iteration
      speed rather than price alone; once engineers experience instant pricing and 2-day delivery, returning
      to a 3-week RFQ process is a high-friction reversal.

      In-house captive fabrication is the highest-switching-cost substitute. Companies that have invested
      in laser cutters, press brakes, or machining centers have sunk capital into equipment ownership. The
      conversion argument is that outsourcing eliminates setup time, material inventory management, and
      machine maintenance — relevant for companies whose fabrication needs are periodic rather than continuous.
      SendCutSend's unlimited-design, no-minimum model targets exactly this use case.

      Fast Radius is the most instructive cautionary comparable in the digital manufacturing category.
      Founded in 2017 with a mission comparable to Xometry's and SendCutSend's (software-enabled
      manufacturing access), Fast Radius completed a SPAC merger in February 2022 via ECP Environmental
      Growth Opportunities Corp. but suffered 91% stockholder redemption, netting only $106 million instead
      of the anticipated $300–445 million. Unable to fund its growth capital requirements, Fast Radius filed
      Chapter 11 bankruptcy in late 2022 and sold its assets to SyBridge Technologies — a Crestview
      Partners-backed PE rollup with 14 acquisitions — through a bankruptcy court-approved Section 363
      sale. Fast Radius had produced over 15 million parts across 150,000+ designs at the time of failure.
      The lesson is that digital manufacturing platforms with insufficient capital are structurally
      vulnerable: their cost structure (sales, certifications, supplier management, software) scales ahead
      of revenue, making capital adequacy the primary survival variable. SendCutSend's bootstrapped
      profitability before its $110M raise and its owned-capacity model with deterministic cost structure
      differentiates it from the Fast Radius failure mode.
