        - Lowest-friction path to order for engineers; DFM catches errors before production
        - All major competitors now offer instant quote + DFM; table-stakes feature in 2026
        - Medium
        - Differentiate on DFM quality, not just presence; identify proprietary DFM rules count vs. competitors
      - - Certification gap (risk, not moat)
        - SCS lacks confirmed AS9100D, ITAR, ISO 13485 certifications
        - "Structurally excluded from aerospace, defense, medical procurement requiring these certifications"
        - High (adverse)
        - Confirm SCS certification roadmap; assess whether $110M Series A capital includes cert investment
    notes: >-
