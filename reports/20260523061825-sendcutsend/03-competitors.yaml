  - id: pricing-capability-comparison
    title: Pricing, Packaging, and Capability Comparison
    body: >-
      Pricing transparency is a core differentiator in digital fabrication. SendCutSend publishes
      instant pricing at upload, with volume discounts applied automatically at checkout and no minimum
      order quantity. Enterprise customers access net-30 payment terms and blanket purchase orders.
      Free US shipping applies on orders over $39.

      Xometry also offers instant pricing for sheet cutting, laser cutting, waterjet cutting, and CNC
      machining. Its standard sheet cutting lead time is 3 business days, with 1-day enterprise lead
      times launched in Q1 2026. Xometry's dynamic pricing uses a conversion-rate model analyzing
      geometric features, quote configurations, and customer-historical data. While list pricing is
      displayed, Xometry's supplier network introduces more pricing variability than SendCutSend's
      owned-capacity model.

      Protolabs Network (Hubs) generates instant quotes via machine-learning comparison of uploaded CAD
      files to millions of previously manufactured parts, updating in real time as the user changes
      materials, lead times, or specifications. CNC machining lead times start at 5 business days.
      Protolabs handles customs clearance and import duties on orders shipped to the EU, UK, and US,
      reflecting its international scope.

      OSH Cut offers instant nested pricing for laser-cut and bent metal parts. Its pricing engine
      automatically applies volume discounts as order size increases. OSH Cut explicitly positions itself
      as a direct manufacturer with no fabrication brokers or third-party service providers — echoing
      SendCutSend's owned-capacity value proposition but at smaller scale and with narrower material
      and finishing options.

      On surface finishing, SendCutSend offers the broadest domestic in-house catalog: powder coating,
      anodizing, zinc and nickel plating, tumbling, deburring — all performed in-house on the same order.
      Xometry offers finishing through its supplier network (wider process range, but coordinated rather
      than in-house). Hubs explicitly excludes many post-processing steps from its instant-quote workflow.
      OSH Cut offers deburring and linear grain finishing but lacks plating and anodizing in-house.

      Certification gaps create enterprise procurement risk for SendCutSend. Xometry holds AS9100D
      (aerospace), ISO 13485 (medical), IATF 16949 (automotive), ITAR, and CMMC Level 2 certifications —
      enabling sales to regulated prime contractors and defense programs where sourcing from non-certified
      vendors is contractually prohibited. SendCutSend's publicly documented certifications are limited
      relative to this portfolio, representing an adverse buying criterion for regulated-industry procurement.
