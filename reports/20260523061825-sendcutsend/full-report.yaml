      - number: '8.3'
        title: Financing context and comparable valuation framing
        blocks:
          - type: paragraph
            body: >-
              The financing context cuts both ways. On one hand, the cap table has attracted high-signal investors and
              the company reached unicorn pricing without years of public-market conditioning, which is a credit to
              execution. On the other hand, the public-comparable set shows how much narrative work investors are doing.
              Xometry currently trades at a rich public multiple, which proves that digital-manufacturing stories can
              earn premium valuations in favorable markets. Proto Labs and Materialise trade materially lower, which
              proves the market does not automatically grant software-like multiples to all digitally enabled
              manufacturing names. For SendCutSend, the correct framing is neither to ignore Xometry nor to treat it as
              the sole anchor. Xometry sets the upside bound for what investors might be willing to pay for growth and
              software leverage; Proto Labs and Materialise define where mature owned-capacity and
              manufacturing-software hybrids tend to settle; Fictiv and Fast Radius show what strategic exits and
              downside cases can look like when capital intensity or market timing turns against the model. The result
              is a mixed comparable set that supports discipline rather than exuberance.
            claimRefs:
