      - number: '6.5'
        title: Concentration Risk, Trust Signals, and Adverse Context
        blocks:
          - type: paragraph
            body: >-
              SendCutSend's published customer-concentration figure is unusually low for a growth-stage business: the
              highest-revenue single customer represents only 0.59% of total income, as confirmed by CEO Belosic in the
              NNBW interview. At roughly $200M in annual revenue, this implies the largest customer accounts for
              approximately $1.18M annually—indicating a long-tail revenue structure with minimal single-customer
              dependency. This is a structural positive for investor risk, consistent with Belosic's stated "very, very
              diverse" characterization of the base. The presence of Fortune 500 companies across multiple sectors
              provides further diversification; no single industry vertical appears to dominate.


              Trust signals from independent sources are generally positive. ScamAdviser rates the site as "very likely
              not a scam but legit and reliable," citing domain age of 11 years, high Tranco ranking (top 20), and
              positive reviews. Trustindex aggregates Google reviews at near-5.0 with consistent themes around speed,
              quality, and service responsiveness. However, two adverse dimensions merit noting. First, all customer
              testimonials on the SCS website are company-curated and self-selected; the platform publishes only
              positive stories. The overall satisfaction rate, complaint frequency, or order-dispute rate is not
              disclosed. Second, for enterprise customers in regulated industries—aerospace, defense, space—compliance
              certifications are a common procurement gate. No ITAR registration, ISO 9001, or AS9100 certification has
              been confirmed publicly for SendCutSend. If a significant portion of the claimed defense/aerospace
              customers require these certifications, that creates a diligence gap that could limit enterprise
              expansion.


              A third adverse dimension concerns the nature of the Fortune 500 claim: "more than half" (or 59.8% in some
              sources) of Fortune 500 companies are claimed as customers. Even a single low-value order from a Fortune
              500 entity would qualify a company as a "customer" under most definitions. The claim therefore conflates
              full production accounts with one-off prototype purchasers and does not convey the depth, contract value,
              or strategic importance of those relationships. Diligence should request actual revenue attribution by
              segment (Fortune 500 vs. SMB vs. hobbyist) to assess revenue quality.
            claimRefs:
