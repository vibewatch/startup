  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for SendCutSend is unusually simple and unusually attractive on the merits: it
              appears to have built a software-enabled, self-serve manufacturing platform that solves real pain for
              customers who need custom fabricated parts quickly and without RFQ friction. Growth from $100M annual
              revenue in October 2025 to roughly $200M by May 2026, if accurate, is exceptional for a domestic
              industrial company. The domestic footprint, broad service catalog, and long-tail customer base mean the
              company is not a fragile single-vertical story. The anti-thesis is equally clear. Investors are still
              underwriting an asset-heavy, non-recurring manufacturer with limited public disclosure, no audited
              financials, unclear lender covenants, and no public preference stack. The 2026 price therefore assumes
              that software-driven throughput and growth will continue to earn premium public-comp multiples even though
              the business still carries meaningful industrial execution and financing risk. This is a strong
              company-quality story, but not yet a low-risk entry point.
            claimRefs:
              - CV006
              - CV007
              - CV025
              - CV036
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV025
              - CV028
              - CV038
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV029
              - CV034
              - CV035
      - number: '8.2'
        title: Recommendation, confidence, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              At the current round, the best recommendation is track. That is not a bearish verdict on the business. It
              is a statement that price discipline matters more than admiration. SendCutSend could still become a very
              large manufacturing platform if growth persists and regulated-enterprise penetration deepens. But the
              current valuation leaves too little room for error relative to the missing disclosure on margins, debt,
              preferences, and quality-control metrics. Confidence is medium because the public evidence consistently
              supports quality and growth, yet it does not clear the core diligence questions that distinguish a good
              company from a good investment. Risk rating is high, and valuation stance is stretched. Put differently:
              existing insiders may still feel well positioned, but new investors should want either a stronger
              diligence package or a more attractive entry price before moving from monitoring to commitment.
            claimRefs:
              - CV028
              - CV029
