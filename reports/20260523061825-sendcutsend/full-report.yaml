      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: DFM Engine + Nesting Algorithm Create a Compounding Cost Moat
            body: >-
              Every file upload triggers an automatic DFM check before pricing, eliminating the manual quoting labour
              that traditional job shops embed in their overheads. The nesting algorithm then amortises raw-material
              cost across simultaneous customer orders, enabling economically viable single-piece pricing. Together
              these two proprietary tools produce a unit-cost floor that competitors running manual quoting or
              per-customer sheet allocation cannot match without equivalent software investment. As order volume grows,
              nesting efficiency improves, creating a compounding cost advantage that widens with scale.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
              - CE003
              - CE009
          - type: callout
            title: Nesting IP Concentrated in Single CTO; No ISO Quality Certification
            body: >-
              The nesting and pricing algorithm was co-authored by CTO Jake Graham and is fully proprietary with no
              public patent filings or architectural documentation. A departure or incapacity of Graham could expose the
              pricing engine to a rebuild risk on the order of months, with no competitor able to step in on the same
              timeline. Separately, the absence of ISO 9001:2015 or AS9100D certification—held by competitors OSH Cut
              and Xometry suppliers respectively—creates a procurement barrier for quality-gated enterprise and
              government-adjacent buyers. Neither risk is currently priced visibly into the business, but both are
              material diligence items for institutional investors.
            calloutType: risk
            claimRefs:
              - CE005
              - CE046
              - CE047
          - type: callout
            title: 170+ Material Catalogue and Domestic 24/7 Production Enable a Single-Vendor Supply Chain
            body: >-
              The combination of materials breadth, in-house finishing, and domestic 24/7 production positions
              SendCutSend as a single-vendor replacement for what would otherwise require three to five suppliers: a
              laser shop, a waterjet shop, a bending vendor, a plating vendor, and a shipping broker. For engineering
              teams managing complex assemblies, this supply-chain consolidation has quantifiable value in vendor
              management overhead and logistics coordination. The 50M+ parts shipped to 300,000+ customers at the volume
              claimed suggests the market has validated this value proposition at scale.
