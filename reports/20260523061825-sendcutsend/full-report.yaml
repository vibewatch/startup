      - number: '7.2'
        title: Regulatory, legal, and product-liability exposure
        blocks:
          - type: paragraph
            body: >-
              The public record shows that SendCutSend has taken at least the first step toward defense-grade file
              handling: it explicitly states DFARS 252.204-7012 and NIST SP 800-171 compliance on its
              information-security page. That matters because defense and aerospace customers are named parts of the
              commercial narrative. But the gap between DFARS/NIST handling and full regulated-supplier qualification
              remains material. No public ITAR registration proof was identified, and the company does not publicly show
              AS9100, ISO 9001, or similar certificates that large aerospace or defense buyers often request. The legal
              stack around design-file uploads is also meaningful. The terms and privacy documents make clear that
              customers are responsible for having the rights to uploaded designs; SendCutSend reserves the right to
              cancel copyrighted or illegal submissions, and it limits warranties for downstream use. That lowers
              platform abuse risk, but it does not eliminate product-liability exposure when fabricated parts are used
              in robotics, transportation, aerospace, or other sensitive environments. Public sources reviewed did not
              show a confirmed enforcement action, lawsuit, or recall, but the searchable surface is incomplete enough
              that investors should treat litigation absence as a diligence item rather than a clean bill of health.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR027
              - CR029
      - number: '7.3'
        title: Operational, quality, logistics, and security risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, SendCutSend is a promise business. Customers buy instant quoting, no-minimum ordering, and
              parts that usually ship within days. That makes uptime, queue discipline, and quality-control economics
              unusually important. NNBW describes a production system built around thirteen fiber lasers, multiple
              robotic CNC machines, a 24/7 operating rhythm, and a Reno-heavy footprint that still anchors the wider
              five-facility network. This delivers scale but also concentrates execution risk: an outage in equipment,
              finishing, utilities, labor, or software can hit customer experience quickly because the entire revenue
              model turns over order by order. The company's expansion into anodizing and powder coating broadens
              service depth and wallet share but also introduces more EHS, process-control, and rework risk than
              straight cutting. Cybersecurity sits inside this same operational bucket because the quoting platform and
              uploaded design-file library are part of the production system itself. SendCutSend's public compliance
              claims are directionally positive, yet no public third-party cyber audit, incident report, uptime history,
              scrap-rate disclosure, or remake-rate disclosure was identified. Investors therefore need to treat
              operating-quality risk as an underwriting gap, not just a routine manufacturing issue.
            claimRefs:
