  - id: FE001
    title: SendCutSend Product Architecture — Four-Layer Stack
    type: stack
    layout: wide
    summary: >-
      Platform architecture from customer-facing tools down to domestic manufacturing execution, illustrating four
      interlocking capability layers.
    data:
      layers:
        - label: Customer Platform Layer
          detail: >-
            Browser-based instant quote and buy-now interface supporting 20+ CAD formats. Includes saved carts, quote
            sharing, part preview tools, template library, and material selection guide.
          items:
            - Instant quote engine (DXF, DWG, AI, EPS, STP, STEP, SLDPRT, CATPART, and 12+ others)
            - Part preview + measurement tools
            - Saved Carts (shareable multi-part carts)
            - Template library (free stencil/positive font packages)
            - Material selection guide + properties cheat sheet
        - label: Order Intelligence Layer
          detail: >-
            Proprietary DFM engine and multi-customer nesting algorithm that validate designs, generate accurate instant
            pricing, and optimise sheet utilisation across simultaneous customer orders. Enterprise features live at
            this layer.
          items:
            - DFM engine — pre-production design validation (hole size, kerf, bend radii)
            - Nesting algorithm — multi-customer sheet packing for material efficiency
            - Pricing engine — real-time price from geometry × material × quantity
            - Enterprise org management (net-30, blanket PO, MFA enforcement, blind invoicing)
            - NDA / DFARS / NIST SP 800-171 compliance layer
        - label: Manufacturing Execution Layer
          detail: >-
            Five domestic production facilities (NV, KY, TX) operating 24/7 with a multi-process fleet covering cutting,
            forming, hardware, and finishing across 170+ materials.
          items:
            - Fiber laser cutting (4–12 kW fleet; ±0.005″; up to 2,500 ipm)
            - Waterjet cutting (garnet abrasive; ±0.009″; no HAZ)
            - CNC routing (±0.005″; 1/8″ bit; 2D only)
            - CNC machining (3D billet; multi-axis)
            - Bending / forming (8 metals; ±1°; up to 44 × 30″)
            - Hardware insertion (tapping, countersink, PEM, dimple)
            - Finishing (anodizing, plating, powder coat, tumbling, deburring)
        - label: Supply and Logistics Layer
          detail: >-
            US mill-sourced raw material supply, domestic production, and carrier-integrated shipping. Security and data
            protection policies anchor the data flow.
          items:
            - US mill raw material sourcing (170+ material SKUs)
            - Multi-carrier shipping integration (free US shipping ≥$39; Canada shipping available)
            - 'IP protection: customer retains 100% design IP; no third-party sharing'
            - Service-delay transparency (posted maintenance and holiday disruptions)
    approximationNotes: >-
      Layer names are inferred from public product and security documentation. Internal ERP, cloud provider, and
      software infrastructure are not publicly disclosed.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE011
      - CE022
      - CE033
      - CE037
  - id: FE002
    title: Customer Workflow — Upload to Delivery
    type: flow
    layout: standard
    summary: >-
      End-to-end customer journey from design file to delivered part, illustrating the key software touchpoints that
      differentiate SendCutSend from a traditional job shop.
    data:
      nodes:
        - id: design-cad
          label: Create or obtain CAD file
          detail: >-
            Customer creates a 2D or 3D design file in any of 20+ supported formats. Free stencil and laser-cutting
            templates are available for download.
        - id: upload-platform
          label: Upload to sendcutsend.com
          detail: >-
            Customer selects material, thickness, quantity, and desired secondary operations (bending, hardware,
            finishing) at upload. No account required to price.
        - id: dfm-check
          label: DFM engine validates design
          detail: >-
            Proprietary DFM engine auto-checks hole sizes, kerf, bend radii, and feature detail. Issues flagged with
            actionable feedback before pricing is displayed.
        - id: instant-price
          label: Instant price generated
          detail: >-
            Nesting algorithm calculates optimal sheet utilisation across concurrent customer orders. Price reflects
            material cost, cutting time, secondary ops, and volume tier.
        - id: checkout
          label: Customer places buy-now order
          detail: >-
            Selects standard (2–3 day) or expedited lead time. Enterprise customers may apply net-30 or blanket PO.
            Blind invoicing option available at checkout.
        - id: facility-routing
          label: Order routed to optimal facility
          detail: >-
            Production planning system schedules order to best-available facility in NV, KY, or TX based on material
            availability, machine capacity, and lead-time commitment.
        - id: manufacturing
          label: Cutting + secondary operations
          detail: >-
            Laser, waterjet, or CNC cutting executed; bending, hardware insertion, and finishing performed in sequence.
            24/7 production with 300+ staff.
        - id: qc-pack-ship
          label: QC, packing, and carrier pickup
          detail: >-
            Parts inspected, packed, and handed to carrier. 91% of orders ship within 5 business days on standard
            service; expedited can exit production in < 30 min.
        - id: delivery
          label: Parts delivered
          detail: >-
            US delivery in 2–4 business days; Canada 4–8 days (taxes/duties pre-paid at checkout). Free US shipping on
            orders over $39.
      edges:
        - from: design-cad
          to: upload-platform
          label: file upload
        - from: upload-platform
          to: dfm-check
          label: auto-validation
        - from: dfm-check
          to: instant-price
          label: if valid
        - from: dfm-check
          to: upload-platform
          label: if errors flagged → revise
        - from: instant-price
          to: checkout
          label: customer accepts price
        - from: checkout
          to: facility-routing
          label: order confirmed
        - from: facility-routing
          to: manufacturing
          label: production scheduled
        - from: manufacturing
          to: qc-pack-ship
          label: parts complete
        - from: qc-pack-ship
          to: delivery
          label: carrier pickup
