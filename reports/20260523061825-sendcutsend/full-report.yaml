            Lower bound: typical owned-capacity fabrication with high labor + facility overhead. Upper bound: nesting
            efficiency at full utilization approaching marketplace economics. Protolabs Adj EBITDA 14.7% implies gross
            margin above 30%; Xometry marketplace gross margin 38.3% provides ceiling reference for efficient digital
            model.
