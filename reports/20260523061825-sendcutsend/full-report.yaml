    title: Key Financial Metric Ranges — Source-Backed Bounds
    type: range
    layout: standard
    summary: >-
      Revenue, valuation, growth, and margin estimates with lower and upper bounds derived from stated facts,
      public-company benchmarks, and analytical estimates. Ranges reflect uncertainty in unverified private company
      metrics.
