      - number: '2.4'
        title: Growth Drivers and Market Tailwinds
        blocks:
          - type: paragraph
            body: >-
              Three macro forces converge to drive demand for domestic on-demand custom fabrication at an inflection
              point in 2026: reshoring/reindustrialization, AI and data-center infrastructure build-out, and the
              digitization of industrial procurement.

              Reshoring acceleration is the most structurally important driver. The Reshoring Initiative tracked 244,000
              manufacturing jobs created from reshoring and foreign direct investment in 2024, with high- and
              medium-high-technology sectors accounting for 88% of job creation. Industrial Sage's investment tracker
              aggregates more than $1.667 trillion in committed U.S. manufacturing investment from 137 companies across
              35 states as of early 2026. BDO's 2026 Manufacturing Outlook specifically identifies the acceleration of
              domestic supply chains in mission-critical sectors — defense, electrical transmission, data centers, and
              building materials — as a top growth vector, noting that manufacturers are moving from sprawling global
              networks toward smaller, more controllable supplier pools. Each new domestic plant in ramp-up mode
              generates prototype and pre-production custom parts demand that is ideally suited to on-demand digital
              fabrication.

              The AI and data-center hardware wave creates a fast-growing buyer segment for custom sheet metal. BDO
              notes more than 47,000 megawatts of new data center capacity under construction worldwide, generating
              demand for server racks, chassis, cooling manifolds, cable trays, and custom mounting hardware — all
              products that on-demand sheet metal platforms can supply faster than traditional fabricators.
              SendCutSend's press release explicitly cites data center, AI, and robotics sectors among its Fortune 500
              customer base, and Sequoia partner Andrew Reed's investment rationale emphasizes that a hardware ecosystem
              around reindustrialization requires a platform at the center.

              The digitization of industrial procurement is the third driver. Fictiv's 2026 State of Manufacturing
              survey of 321 director-level and above manufacturing and supply chain leaders found that 97% report AI is
              already embedded in core workflows and digital manufacturing platforms have shifted from "helpful" to
              "non-negotiable" for competitive supply chains. A total of 98% of leaders say materials volatility is
              rewriting sourcing strategy, and 81% say supplier sourcing and management is too time-consuming and costly
              — up from 73% the year prior. Deloitte identifies the adoption of agentic AI in supply chain orchestration
              as a near-term catalyst that will further accelerate digital procurement platform adoption as buyers seek
              to automate vendor selection and order placement workflows.
