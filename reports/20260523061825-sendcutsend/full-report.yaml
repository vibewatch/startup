      - number: '5.3'
        title: Materials Catalogue and Specifications
        blocks:
          - type: paragraph
            body: >-
              The materials catalogue spans more than 170 distinct SKUs across metals, plastics, composites, wood, and
              rubber. In metals, the company stocks aluminum alloys (5052, 6061, 7075, 2024 T3), mild steels (A36, G90),
              stainless steels (304, 316), chromoly steel (4130), specialty alloys (AR500, 1075 blue temper), copper,
              brass, and titanium. Plastic offerings include polycarbonate, acrylic, HDPE, ABS, Delrin, UHMW, and
              others. Composite and specialty materials include carbon fiber, G10, LE phenolic, ACM (aluminum composite
              material), and rubber or gasket sheet.


              Standard instant-quote part sizes run up to 44 × 30 inches (1,117.6 × 762 mm); custom-quote parts can
              reach 56 × 30 inches (1,422.4 × 762 mm). Material-specific minimum sizes and thickness ranges are
              published in a publicly accessible min/max chart. Thicknesses begin as low as 0.015 inches (1075 Blue
              Temper Steel) and extend beyond 0.500 inches for some materials. Each material page publishes the
              applicable cutting process, tolerance, kerf estimates, and secondary-operation eligibility.


              The material selection guide aids customers in matching material properties to application
              requirements—strength, outdoor suitability, signage, electrical conductivity, and thermal performance. A
              material properties cheat sheet publishes key engineering values (tensile strength, hardness, elongation,
              thermal conductivity) for all plastic materials to allow direct comparison. This depth of published
              technical data reduces customer support burden and shortens the design-iteration cycle by letting
              engineers make substitution decisions without requesting quotes for multiple materials.
            claimRefs:
              - CE022
              - CE023
              - CE024
              - CE032
      - number: '5.4'
        title: Technology Moat and Differentiation
        blocks:
          - type: paragraph
            body: >-
              SendCutSend's durable competitive advantage rests on three interlocking software capabilities: the DFM
              engine, the nesting algorithm, and the enterprise platform layer. Together they create a workflow that
              traditional job shops cannot replicate without equivalent software investment.


              The DFM engine fires automatically on every file upload, before pricing, and before any human reviews the
              job. It checks hole sizes against material thickness minimums, bridging, bend-radius constraints, and
              feature detail that would be lost in the kerf. The result is that manufacturing errors—which in
              traditional shops create costly rework and delay—are caught in the customer's browser. The CEO has noted
              that this auto-check is a primary driver of the throughput efficiency that enables the company's lead
              times.


              The nesting algorithm is the unit-economic engine: by packing multiple customers' shapes onto a single
              material sheet, it amortises the fixed cost of raw material across orders simultaneously, making a
              single-piece order financially viable. This is structurally different from a traditional job shop, where
              each customer's sheet is a discrete setup. The algorithm was co-authored by CTO Jake Graham and remains
              proprietary, representing a key-person concentration risk alongside a genuine technology moat.


              The enterprise platform layer adds multi-user organization accounts, domain-based employee
              auto-invitation, org-level MFA enforcement, session timeouts, password complexity policies, private status
              with NDA compliance, net-30 payment terms, blanket purchase orders, and dedicated account representatives.
              DFARS 252.204-7012 and NIST SP 800-171 compliance are publicly claimed, enabling government-adjacent and
              defense-contractor customers. Individual NDA compliance is available on request, and customer-retained IP
              is protected under the platform's Terms of Service. These enterprise features have seen record adoption as
              of August 2025 and contributed to the company's third consecutive Inc. 5000 ranking.


              From a competitor-differentiation standpoint, OSH Cut holds ISO 9001:2015 certification which SendCutSend
              does not publicly claim. Xometry routes jobs through a supplier network rather than self-owned production,
              and Protolabs offers instant quoting with a narrower material catalogue and no nesting. SendCutSend's
              owned-production plus software-nesting plus 170+ materials is a combination that no direct peer currently
              replicates at the same price point and lead time.
