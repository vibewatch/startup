      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Jim Belosic, 45 at the time of the 2026 funding announcement, is the founder and CEO of SendCutSend and
              serves as the company's primary public face, chief decision-maker, and product visionary. His
              entrepreneurial background spans 25 of the last 30 years of self-employment, including a graphic design
              and marketing practice, a career in software development, and the 2010 co-founding of ShortStack—a digital
              marketing and social media automation platform he later sold his interest in to capitalize the early
              stages of SendCutSend. The decision to exit ShortStack and invest in industrial fabrication reflected
              Belosic's recognition that the custom-parts market was deeply underserved for small-batch and prototype
              orders, a pain point he first experienced while restoring cars and motorcycles as a personal hobby.


              Erin Belosic serves as company President and is Jim Belosic's spouse. Her role encompasses organizational
              management and strategic operational oversight; she is identified by NNBW as a key partner in the
              company's long-term plans for geographic expansion. Jacob (Jake) Graham is co-founder and Chief Technology
              Officer. Graham co-authored the nesting software that is foundational to the company's cost structure and
              joined Belosic at the company's inception when they together built the upload-to-order workflow that
              defines the platform's user experience.


              Key-person dependency is the single most important governance risk at this stage. Jim Belosic controls
              strategy, investor relationships, and product direction. In his post-funding communications he explicitly
              stated "I'm still in control, I get to keep making big bets, I still set direction and vision"—confirming
              retained operational authority post-investment. The funding round was structured on founder-friendly terms
              at Belosic's request. No formal board composition has been disclosed post-funding, creating a diligence
              gap on governance rights, investor board seats, and succession planning. The company's history of
              resisting outside oversight until the May 2026 round adds to the governance uncertainty for institutional
              investors.
