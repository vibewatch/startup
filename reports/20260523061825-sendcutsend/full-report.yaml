  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitoring indicator
      - Threshold / event
      - Action implication
    rows:
      - - Cyber / DFARS compliance
        - Security incident count; audit status; defense-customer requirements
        - Material design-file breach, CUI handling failure, or loss of compliance posture
        - Freeze defense-upside underwriting; require incident review and remediation evidence
      - - Equipment financing dependency
        - JPMorgan capacity, covenant headroom, refinancing terms
        - Meaningful tightening or inability to finance new machines
        - Rebase growth model and haircut valuation for slower capacity additions
      - - Service reliability
        - Five-day ship rate; remake/refund rate; expedited backlog
        - Sustained on-time ship rate below 85% or rising remake volume
        - Treat speed moat as broken until corrected
      - - Regulated-customer qualification
        - ITAR / ISO / AS9100 evidence requests
        - Key enterprise/defense deals stall on missing certifications
        - Reduce enterprise expansion assumptions and delay investment decision
      - - Leadership concentration
        - Founder/CTO retention and delegated management depth
        - Founder or core software leader departure without credible successor inside 30 days
        - Escalate to thesis review; pause new capital commitment
      - - Margin / working-capital visibility
        - Gross margin, burn, debt terms, facility economics
        - Management unwilling to provide audited or lender-grade metrics in diligence
        - Move from track to avoid at current price because underwriting remains impossible
    notes: >-
      These kill criteria are designed for investors evaluating new-money exposure at the 2026 price, not for passive
      historical review.
