      - number: '2.2'
        title: Market Sizing and Comparable Evidence
        blocks:
          - type: paragraph
            body: >-
              No independently published analyst TAM estimate isolates the U.S. on-demand custom sheet metal fabrication
              sub-segment specifically. Estimates for broader custom metal fabrication or custom parts manufacturing in
              the U.S. range from roughly $20B to $50B annually across industry reports (BDO, Deloitte, Kearney), but
              these figures encompass job shops, contract manufacturers, in-house captive shops, and offshore suppliers
              — not the digital platform slice alone. The absence of a precise sub-segment TAM is an acknowledged
              evidence gap that requires primary industry research or proprietary analyst sourcing.

              The most actionable proxies come from public digital manufacturing comparable companies. Xometry (NASDAQ:
              XMTR), the largest publicly traded digital manufacturing marketplace, reported Q1 2026 total revenue of
              $205 million — a 36% year-over-year increase — and marketplace revenue of $191 million, up 40%
              year-over-year. Xometry's marketplace had 85,581 active buyers as of Q1 2026 (up 20% from 71,454 a year
              earlier), with 1,864 accounts spending at least $50,000 in the prior twelve months. Annualizing Xometry's
              Q1 run rate implies a $780–820M revenue scale for a single digital marketplace competitor. Protolabs
              (NYSE: PRLB), positioning itself as the "world's leading digital manufacturing service," reported FY2025
              revenue of $533.1 million (+6.4% YoY), including Q4 2025 revenue of $136.5M (+12.1% YoY) — demonstrating
              that the broader market can sustain multiple scaled players but also that not every platform is growing at
              the same rate.

              A bottom-up sizing lens: SendCutSend's publicly claimed 300,000 customers and approximately $200M in
              annual revenue implies an average annual revenue per customer of roughly $667. If the total addressable
              pool of U.S. businesses that would procure custom metal parts on-demand is estimated at 1–3M companies
              (engineering-intensive SMBs, mid-market manufacturers, and enterprise divisions), the platform-addressable
              revenue opportunity at the same ARPU would range from $670M to $2B — a SAM estimate consistent with the
              combined observable platform revenues today and with significant headroom if penetration of the
              addressable pool grows from low single digits. The SOM available to a single domestic-only platform is
              narrower still; SendCutSend's $200M at 300K customers implies roughly 10–15% penetration of the
              digital-platform-accessible customer base as currently estimated, with the balance addressable by
              continued investment in capacity, capabilities, and geographic reach.

              Contradictory evidence and estimation conflicts: Xometry's 40% marketplace growth rate suggests strong
              market expansion, yet Protolabs' 6.4% full-year growth signals market maturity or competitive pressure at
              the incumbent end. Both cannot simultaneously reflect the same market dynamics, suggesting buyer
              segmentation (prototypers vs. enterprise production) or capability differentiation (machining vs. sheet
              metal) drives divergent platform trajectories.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
