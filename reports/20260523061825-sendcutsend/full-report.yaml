      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Reshoring and AI Hardware Are Structural, Not Cyclical, Tailwinds
            body: >-
              The $1.667 trillion in committed U.S. manufacturing investment and the 47,000 MW of new data center
              capacity under construction represent multi-year, capital-committed demand curves — not cyclical inventory
              restocking. Each new domestic plant that reaches production ramp generates prototype and low-volume custom
              parts demand that domestic on-demand platforms are uniquely positioned to fulfill faster than offshore
              alternatives. For SendCutSend, the AI hardware buildout in particular creates a recurring, high-value
              revenue stream from data center customers who need custom chassis and cooling hardware on fast cycles as
              rack designs evolve with each AI accelerator generation.
            calloutType: insight
            claimRefs:
              - CM020
              - CM023
              - CM026
          - type: callout
            title: No Independent Sub-Segment TAM Creates Valuation Uncertainty
            body: >-
              The absence of a published third-party TAM isolating the U.S. on-demand digital custom sheet metal
              sub-segment forces investors to rely on company claims and competitor proxies for market sizing. This
              creates a valuation risk: the $1.01B SendCutSend valuation is implicitly priced on a large and
              fast-growing market, but that market's size and growth rate are not verifiable from public analyst data.
              Contradictory signals from Protolabs (+6.4% revenue growth) vs. Xometry (+40%) suggest the market is not
              uniformly high-growth and that platform differentiation — not just market expansion — drives divergent
              outcomes.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM035
          - type: callout
            title: Customer Count Breadth Does Not Equal Revenue Concentration Transparency
            body: >-
              SendCutSend's 300,000 customers and Fortune 500 penetration claims suggest breadth, but without disclosure
              of customer revenue concentration, repeat-order rate, or enterprise revenue share, the quality of the
              customer base is opaque. If top-100 enterprise accounts represent a majority of revenue, the business
              model carries concentration risk not apparent from the headline customer count. If revenue is evenly
              distributed across 300,000 accounts, churn at the long-tail end is the primary risk. Primary diligence on
              cohort analysis is required before the customer base quality can be assessed.
