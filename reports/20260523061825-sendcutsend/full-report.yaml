          detail: >-
            Engineer contacts 2-4 regional job shops via phone or email; waits 2-5 days for quotes; selects vendor;
            places order; waits 2-6 weeks for delivery
        - id: traditional-friction
          label: Status-quo friction — lead time, MOQ, opacity
          detail: >-
            Average 2-6 week lead times, minimum order quantities of 25-500 pieces, no instant pricing, manual file
            communication, reliance on personal shop relationships
        - id: digital-path
          label: Digital platform path — instant quote workflow
          detail: >-
            Engineer uploads CAD file; DFM check runs automatically; instant price generated; order placed with credit
            card or PO; part manufactured and shipped within 2-4 days
        - id: digital-advantage
          label: Platform advantages — speed, transparency, no MOQ
