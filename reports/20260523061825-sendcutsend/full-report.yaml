      - number: '3.2'
        title: Business Model Archetypes — Owned Capacity, Marketplace, and Hybrid
        blocks:
          - type: paragraph
            body: >-
              The three dominant business model archetypes in digital fabrication differ materially in how they control
              quality, price risk, and capacity — with significant implications for unit economics, customer experience,
              and competitive moat durability.

              SendCutSend operates a fully owned-capacity model. All five production facilities are company-owned and
              located in the United States (Nevada, Kentucky, and Texas). Raw material is sourced exclusively from
              domestic US mills. This creates deterministic quality control — every part passes through a single DFM
              engine and production management system — and eliminates supplier-network management overhead. The
              proprietary nesting algorithm bundles orders from multiple customers onto single sheets, enabling low
              per-unit costs even on single-piece orders. The tradeoff is capital intensity: capacity expansion requires
              physical facility investment and equipment procurement. SendCutSend deployed $110 million in May 2026
              Series A capital partly to fund facility expansion across the US, with a committed $1 billion five-year
              investment plan in US manufacturing.

              Xometry's marketplace model connects buyers with a global network of vetted supplier facilities. Xometry
              does not own the production assets; instead, it routes orders to network suppliers based on AI-powered
              matching, pricing, and lead-time optimization. This model allows Xometry to offer a broader range of
              manufacturing processes (CNC machining, injection molding, 3D printing, sheet metal, and more) without the
              capital cost of owning specialized equipment for each process. The tradeoff: quality consistency depends
              on supplier certification (Xometry certifies its network to ISO, AS9100D, ITAR, and CMMC standards) rather
              than in-house control. Xometry's marketplace grows without proportional capex, explaining why its 40%
              marketplace revenue growth translates directly to expanding Adjusted EBITDA margins; the company targets
              $1 billion in annualized revenue with 20% annual incremental Adjusted EBITDA margins.

              Protolabs occupies a hybrid position. Its owned factories handle injection molding, CNC machining, and
              sheet metal with the scale and repeatability of an industrial manufacturer. Protolabs Network (formerly
              Hubs) captures demand that exceeds factory capacity, requires specialized capabilities, or benefits from
              volume pricing, routing those orders to a vetted global network. FY2025 factory revenue was $416.9 million
              (78% of total); network revenue was $116.2 million (22%) and grew 15.7% year-over-year — faster than
              factory (4.1%), suggesting the network model is increasingly important to Protolabs' growth thesis. This
              hybrid approach offers breadth and geographic reach but introduces the coordination complexity of managing
              two fulfillment systems.

              The Fictiv/MISUMI model is a pure outsourced-network design: Fictiv manages supplier relationships,
              quality assurance, and digital workflow across four global manufacturing centers, while MISUMI's physical
              infrastructure (22 manufacturing sites, 20 logistics hubs) provides scale. This allows Fictiv to address
              complex, multi-process parts across geographies — but with lead times that are longer than SendCutSend's
              2–4 day domestic standard. The combination creates an enterprise supply chain management offer rather than
              a buy-now direct fabrication platform.

              Fast Radius attempted a software-enabled digital manufacturing platform that raised capital via a SPAC in
              February 2022. The SPAC suffered 91% stockholder redemption, leaving the company with only $106 million
              instead of the projected $300–445 million; it filed for Chapter 11 bankruptcy in the same year and its
              assets were subsequently acquired by SyBridge Technologies through a Section 363 sale. The collapse
              illustrates that platform model economics alone do not guarantee capital adequacy: a lean capital base
              cannot sustain the sales cycle, certifications, and supplier-network overhead required to compete at
              enterprise scale in digital manufacturing.
