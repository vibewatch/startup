chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              SendCutSend is a rapid on-demand custom manufacturer incorporated as Send Cut Send Inc., headquartered at
              4855 Longley Lane, Reno, NV 89502, and established in 2018. The company's core product is an
              instant-quote, buy-now fabrication platform: customers upload CAD files (DXF, DWG, AI, EPS, STP, STEP),
              receive real-time pricing, and place production orders with no minimum quantities. Parts are manufactured
              and shipped within two to four business days on standard orders, with an expedited service enabling
              delivery in as little as 48 hours. Every incoming file passes through an automated
              design-for-manufacturability (DFM) engine before entering the production queue.


              The company markets itself as "America's anything factory," a phrase it operationalizes through a
              catalogue of more than 170 materials—spanning aluminum alloys, mild and stainless steels, titanium,
              copper, brass, carbon fiber, polycarbonate, acrylic, MDF, plywood, and rubber/gasket materials—processed
              via laser cutting, waterjet cutting, CNC routing, CNC machining, bending and forming, tumbling, deburring,
              hardware insertion, tapping, countersinking, dimple forming, powder coating, anodizing, and zinc or nickel
              plating. This breadth of in-house capability allows a single customer to procure a finished,
              surface-treated, hardware-populated part from one supplier on a single order.


              The operating model is explicitly software-first. A proprietary nesting algorithm bundles orders from
              multiple customers onto a single sheet of raw material, enabling efficient utilization and low per-unit
              cost even on single-piece orders—a structural advantage over traditional job shops that must treat each
              customer's sheet as a discrete setup. The business model is direct-to-customer transactional manufacturing
              with volume discounts scaling automatically at checkout. Enterprise customers access net-30 payment terms,
              multi-user organization accounts, blanket purchase orders, and dedicated account representatives. All
              production is domestic; SendCutSend sources material from U.S. mills and operates exclusively from
              U.S.-based facilities.
