  - id: FM003
    title: Digital Procurement Journey — Traditional RFQ vs. On-Demand Platform Workflow
    type: flow
    layout: wide
    summary: >-
      Comparison flow showing how a buyer transitions from a traditional job shop RFQ process to an on-demand digital
      fabrication platform, highlighting the friction eliminated and the mechanism that drives adoption.
    data:
      nodes:
        - id: need
          label: Engineering need identified (custom part required)
          detail: Design engineer or product team identifies need for custom fabricated part
        - id: traditional-rfq
