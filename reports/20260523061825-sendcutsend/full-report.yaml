  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              SendCutSend's core product is a browser-based instant fabrication platform that replaces the traditional
              quote-and-wait cycle. Customers upload a CAD file in any of more than 20 supported formats—DXF, DWG, AI,
              EPS, STP, STEP, SLDPRT, CATPART, IPT, IGS, PAR, IGES, NX, SolidEdge, JT, 3DM, x_t, SAT, and SAB—select
              material, thickness, quantity, and desired secondary operations, and receive an instant price. No phone
              call, no email, no sales cycle.


              The platform's two proprietary software engines are the sources of differentiation. The
              design-for-manufacturability (DFM) engine validates every uploaded file before pricing: it flags minimum
              hole sizes, bridging, bend radii, and feature detail issues that would otherwise cause a rejected
              production run, returning actionable feedback immediately. Every order placed also passes through the
              nesting algorithm co-authored by CTO Jake Graham, which packs shapes from multiple simultaneous customer
              orders onto a shared sheet of raw material, maximising sheet utilisation. This multi-customer nesting is
              the mechanism that enables SendCutSend to offer no-minimum-quantity pricing without the per-setup costs
              that force traditional job shops to charge order minimums.


              Checkout includes lead-time selection: standard 2–3 business days or an Expedited Service (Fast: rush
              production; Fastest: rush production plus overnight shipping). Enterprise customers additionally access a
              Saved Carts feature for quote sharing, blanket purchase orders, and net-30 terms. The CEO has stated that
              91 percent of orders ship within five business days on the standard service, and that some expedited
              orders move from upload to production in under 30 minutes.
