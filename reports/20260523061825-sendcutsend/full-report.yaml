      - number: '7.4'
        title: Partner, financing, and people dependency risk
        blocks:
          - type: paragraph
            body: >-
              SendCutSend does not have classic distributor or channel concentration risk; instead, its dependency map
              runs through capital, logistics, compliance, and leadership. JPMorgan-backed equipment finance is the
              clearest single dependency because it funds the expensive machine base that drives speed and capacity. If
              debt terms tighten, growth slows even if demand stays strong. Parcel carriers are another important
              partner risk because last-mile delivery is part of the company's brand promise even though it sits outside
              factory control. On the people side, the public narrative still centers founder-CEO Jim Belosic, his
              long-range manufacturing vision, and a small set of technical and operating leaders. That is
              understandable for a formerly bootstrapped company, but it raises scale questions at a billion-dollar
              valuation: can the business ramp hundreds of operators, materially grow the software team, and maintain
              quote-to-ship reliability without over-relying on founder attention? High-profile investors help, but
              public governance detail remains thin. Until investors see succession planning, delegated-management
              depth, and lender terms, partner and execution risks should be viewed as live rather than merely
              theoretical.
