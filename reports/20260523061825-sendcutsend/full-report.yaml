      - number: '1.5'
        title: Milestone Chronology and Adverse Checks
        blocks:
          - type: paragraph
            body: >-
              SendCutSend's milestones run from Jim Belosic's foundational hobby tinkering through a period of rapid
              organic scaling to the 2026 institutional inflection point. The company's earliest equipment was a
              handheld plasma cutter, followed by a Torchmate 2×2 Growth Series CNC plasma table used for community
              fabrication projects, and then a full industrial fiber laser cutter financed at approximately $700,000 at
              launch. November 1, 2018, marked the platform's first online order—a Pennsylvania customer purchasing
              pickleball-paddle-shaped keychains—signaling immediate national reach from day one. By 2021, the company
              had expanded to a Paris, Kentucky facility and launched Canadian shipping. An Arlington, Texas location
              followed, completing the current three-state, 24/7 manufacturing network.


              Product milestones include the March 2025 launch of Expedited Service—compressing standard
              two-to-three-day production into sub-48-hour delivery—and the August 2025 disclosure of enterprise
              features including organization accounts, net-30 terms, and DFM automation. October 2025 saw the $100M
              annual revenue milestone. The May 2026 funding round and unicorn valuation represent the company's most
              significant financing and governance milestone to date.


              On adverse checks: no lawsuits, regulatory actions, DFARS enforcement proceedings, sanctions, or material
              public complaints against SendCutSend have been identified in any source reviewed for this chapter. The
              company holds DFARS 252.204-7012 and NIST SP 800-171 compliance credentials, suggesting it has cleared
              basic federal supply-chain security standards. The most material adversarial note in the public record is
              historical: Jim Belosic was openly critical of venture capital prior to this round, reportedly calling VCs
              "grifters" in earlier interviews, and a 2023 podcast appearance framed his view that "VC doesn't belong in
              manufacturing." This creates a credibility and governance question for investors about founder-investor
              alignment at the board level, even though Belosic has publicly acknowledged the change in stance and
              framed the decision to raise as a strategic evolution.
