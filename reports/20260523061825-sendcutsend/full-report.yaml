      - number: '7.5'
        title: Financial-model risk, mitigations, and investment implications
        blocks:
          - type: paragraph
            body: >-
              The financial-model risk is straightforward: SendCutSend is a transactional, non-subscription manufacturer
              using owned capacity and financed machines. That combination can be excellent when utilization is rising,
              but it becomes punishing if volumes wobble because there is less recurring-revenue protection and more
              fixed-cost leverage than in software or marketplace models. The company appears to have strong demand and
              low customer concentration, which helps. What remains missing is lender-grade visibility into margin, cash
              conversion, covenant headroom, and unit economics by site or service line. Public materials do, however,
              show some mitigation logic. The company can pass through some commodity movements, it has broad domestic
              demand, and it has structured expansion spending so machines can be financed while equity funds
              non-collateralizable items. For investors, the right stance is not to treat these mitigations as proof
              that the risks are solved. They are reasons the risk package is manageable if management can furnish the
              missing data. At the 2026 valuation, the risk framework argues for diligence-led selectivity: track
              operating and compliance indicators closely, require direct evidence on financing and quality controls,
              and avoid underwriting aggressive regulated-customer or margin expansion until those gaps are closed.
            claimRefs:
              - CR020
              - CR021
              - CR023
