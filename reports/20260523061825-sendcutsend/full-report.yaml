      - number: '4.4'
        title: Comparable Company Financial Context
        blocks:
          - type: paragraph
            body: >-
              Three public-market or recently transacted companies provide calibration for SendCutSend's financial
              profile, though all have structural differences that limit direct comparability.

              Xometry (NASDAQ: XMTR) is the most financially scale-comparable. In Q1 2026, Xometry posted $205M in total
              revenue (+36% YoY), $191M in marketplace revenue (+40% YoY), and $78.5M in gross profit (38.3% gross
              margin, +3 percentage points YoY). Xometry's Adjusted EBITDA was $10.5M in Q1 2026 versus −$0.4M in Q1
              2025, a $10.4M YoY improvement. On a trailing-twelve- month basis this implies approximately $820M+ in
              annualized revenue, and management guided 27–28% full-year 2026 revenue growth targeting $1B annual
              revenue. Xometry's model is fundamentally different: it earns a take-rate spread as a marketplace
              intermediary with no owned manufacturing assets, meaning its gross margin reflects intermediation
              economics, not fabrication economics. SendCutSend's fully-owned model should theoretically have lower
              gross margin per revenue dollar (since it bears the direct cost of ownership) but potentially higher
              EBITDA margin once capex is fully depreciated and utilization is high.

              Protolabs (NYSE: PRLB) is a hybrid model with owned factory revenue ($416.9M, +4.1% YoY) and network
              revenue ($116.2M, +15.7% YoY) totaling $533.1M in FY2025 (+6.4% YoY). Protolabs generated $78.1M in
              Adjusted EBITDA (14.7% margin) and $74.5M in operating cash flow, with $142.4M in cash and investments as
              of December 31, 2025. Protolabs' slower growth rate (6.4% vs SendCutSend's claimed 80%) suggests a mature,
              lower-growth business with substantially better profitability visibility but lower TAM expansion
              trajectory. Protolabs' profitability at 14.7% Adj EBITDA margin provides a plausible floor reference for
              what an owned-capacity digital manufacturer can achieve at scale.

              Fictiv was acquired by MISUMI Group for $350M all-cash in April 2025 (closed June 2025). Fictiv had
              produced 35M+ parts for 2026 at time of acquisition; revenue was not publicly disclosed. The $350M
              acquisition price implies a significant discount to SendCutSend's $1.01B valuation despite similar part
              volumes, possibly reflecting Fictiv's global (offshore-dependent) network model versus SendCutSend's
              domestic-owned-capacity model, or simply different growth trajectories. The Fictiv acquisition validates
              M&A interest in the digital fabrication sector but also establishes a concrete comparable transaction for
              valuation referencing.

              SendCutSend's 5.05x trailing revenue multiple ($1.01B / $200M) compares favorably to Protolabs' historical
              trading multiples (typically 2–4x revenue) but is below peak growth-stage SaaS multiples. For a
              manufacturing company claiming 80% growth and profitability, the multiple appears reasonable if the
              revenue and profitability claims are accurate — but it is elevated relative to the broader industrial
              manufacturing sector (typically 1–2x revenue) and must be stress-tested against independently verified
              financials. Fast Radius, the cautionary comparable that pursued a SPAC with an anticipated $300–445M raise
              but recovered only $106M due to 91% stockholder redemption, filed for bankruptcy in 2022 — a reminder that
              capital-intensive digital manufacturing models require patient, specific capital, not generalized SPAC
              equity.
            claimRefs:
