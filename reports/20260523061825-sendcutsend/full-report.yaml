      - number: '6.4'
        title: Customer Workflow, Retention, and Expansion Signals
        blocks:
          - type: paragraph
            body: >-
              The platform's design embeds several structural stickiness mechanisms. The instant-quote, upload-to-order
              flow removes friction for both first-time and repeat buyers—no account setup, RFQ, or human quoting
              interaction is required for standard orders. The DFM engine checks every uploaded file, catching design
              errors before production and creating a quality guardrail that reduces rework cycles and builds trust over
              successive orders. For enterprise accounts, the multi-user organization account feature allows a single
              company to manage multiple engineers or buyers under one account with centralized order history—an
              integration point that raises switching costs once procurement workflows are standardized around SCS's
              interface.


              Blanket purchase orders and scheduled repeat production runs are available for commercial accounts,
              enabling supply-chain teams to plan capacity without order-by-order re-quoting. Net-30 payment terms
              unlock SCS for procurement teams at larger companies that operate on standard accounts-payable cycles.
              Dedicated account managers serve high-volume commercial customers, providing a relationship layer that
              reinforces retention beyond the self-serve platform. The quote-sharing feature (1-click) enables
              engineering teams to circulate quotes internally for approval, inserting SCS into the procurement workflow
              at the engineering-to-approval stage rather than requiring a procurement officer to originate the order.


              No publicly available NRR, GRR, or cohort retention data has been disclosed. The closest proxy for
              repeat-purchase signal is the blog testimonials and reviews, several of which describe multi-year ordering
              relationships and high order frequency. One reviewer (Trustindex, 2026) explicitly reported 50+ orders
              over multiple years with no service failures. However, these represent self-selected satisfied customers;
              no systematic churn data is available. The company's rapid revenue growth (80% YoY) suggests net revenue
              expansion broadly, but without cohort data it is impossible to disaggregate new-customer acquisition from
              same-customer expansion or to compute a formal NRR.
