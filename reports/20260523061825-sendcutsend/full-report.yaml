  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Direct Platform Peers
        blocks:
          - type: paragraph
            body: >-
              SendCutSend's primary competitive context spans five categories: (1) global AI-native marketplace
              platforms led by Xometry; (2) hybrid owned-factory-plus-network services led by Protolabs; (3) global
              outsourced network providers including Fictiv (now part of MISUMI); (4) domestic direct digital
              competitors such as OSH Cut; and (5) the legacy status quo of regional job shops that still represent the
              default procurement path for a large share of industrial buyers.

              Xometry (NASDAQ: XMTR) is the most financially significant direct competitor. Its AI-native global
              marketplace connects buyers with a certified supplier network rather than owning production assets. In Q1
              2026, Xometry reported total revenue of $205 million — a 36% year-over-year increase — with marketplace
              revenue reaching $191 million, growing 40% year-over-year. The platform had 85,581 marketplace active
              buyers as of March 31, 2026, up 20% from 71,454 a year earlier, and accounts spending at least $50,000 in
              the prior twelve months rose 21% year-over-year to 1,864. Xometry holds an extensive certification
              portfolio including ISO 9001:2015, ISO 13485:2016, AS9100D, IATF 16949:2016, ITAR registration, and CMMC
              Level 2 — qualifications that unlock regulated aerospace, defense, and medical procurement categories
              where SendCutSend has limited documented certification coverage. In Q1 2026, Xometry announced a strategic
              partnership with Siemens, under which Siemens acquired approximately $50 million of Xometry Class A common
              stock and will embed Xometry's pricing and manufacturability intelligence within the Siemens Xcelerator
              platform.

              Protolabs (NYSE: PRLB) is a public hybrid platform that pairs owned factories with the Protolabs Network
              (formerly Hubs) for sourced orders. FY2025 revenue was $533.1 million (up 6.4% year-over-year), split
              between factory revenue of $416.9 million and network revenue of $116.2 million. Adjusted EBITDA was $78.1
              million (14.7% margin) — demonstrating unit economics achievable at scale, though Protolabs' slower growth
              rate versus Xometry signals a maturing installed base or competitive pressure. Protolabs guided for 6–8%
              revenue growth in fiscal 2026.

              Protolabs Network (formerly Hubs, at www.hubs.com) serves orders that require more complex geometries or
              tighter tolerances than the factory can efficiently fulfill. It uses machine-learning algorithms that
              compare uploaded CAD files to millions of previously manufactured parts to generate instant quotes. CNC
              machining lead times from Hubs start at 5 business days — longer than SendCutSend's 2–4 day standard — and
              the service does not match SendCutSend's breadth of surface finishing options in-house.

              Fictiv, acquired by Japanese manufacturer MISUMI Group for $350 million (announced April 2025, closed June
              2025), operates a global manufacturing network spanning four regions: India, Mexico, China, and the United
              States. Fictiv has produced over 35 million custom and prototype parts. MISUMI itself supplies components
              to more than 323,000 companies worldwide via 22 manufacturing sites and 20 logistics hubs. The combined
              Fictiv/MISUMI platform creates a unified sourcing surface for both custom manufactured parts and standard
              mechanical components — a competitive adjacency that SendCutSend does not serve today.

              OSH Cut (oshcut.com) is the closest structural analog to SendCutSend: an ISO 9001:2015-certified direct
              laser cutting service offering instant pricing, automated DFM feedback, nested pricing, and volume
              discounts applied automatically at checkout. OSH Cut's standard lead time is 2 business days, with
              same-day and next-day options for qualifying jobs. However, OSH Cut ships only to the US and Canada, does
              not offer the breadth of surface finishing or machining services that SendCutSend provides, and remains
              sub-scale relative to SendCutSend's 300,000-customer installed base and five production facilities.

              The legacy status quo — regional job shops — remains the dominant procurement channel in many US
              industrial markets. These operators accept custom orders via email RFQ, phone-based quoting, and manual
              scheduling, with lead times typically running 2–6 weeks versus SendCutSend's 2–4 day standard. Switching
              costs from job shops to digital platforms are relatively low for new orders but elevated for established
              supplier relationships in regulated industries.
