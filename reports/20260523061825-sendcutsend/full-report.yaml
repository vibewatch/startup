            91%+ of orders ship in 5 days or less; 48-hour expedited service available; instant pricing; no minimums;
            real-time DFM feedback; enterprise PO and net-30 available
        - id: enterprise-adoption
          label: Enterprise conversion — AVL approval, blanket PO, repeat production
          detail: >-
            Enterprise account activated with multi-user org account; blanket purchase orders; net-30 terms; dedicated
            account rep; scheduled repeat runs
        - id: platform-lock
          label: Platform retention — switching costs build in reverse
          detail: >-
            Quality history, approved vendor file status, and design file library create retention; competitor
