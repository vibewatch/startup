  - id: FE003
    title: Critical Dependency Map — Operational Vulnerabilities
    type: dag
    layout: wide
    summary: >-
      Key supplier, infrastructure, and platform dependencies for SendCutSend's production operations, highlighting
      where a disruption propagates to order completion.
    data:
      nodes:
        - id: d1
          label: US Mill Raw Material Supply
          detail: >-
            170+ material SKUs sourced from US mills. Tariff changes, mill capacity, or material shortages directly
            constrain production capability.
        - id: d2
          label: Machine OEM Fleet
          detail: >-
            Fiber laser (4–12 kW), waterjet, CNC router, and bending equipment from third-party OEMs. Machine downtime
            for maintenance or parts availability reduces capacity.
        - id: d3
          label: Garnet Abrasive Supply
          detail: >-
            Waterjet operations depend on continuous supply of crushed garnet abrasive. Supply disruption prevents
            waterjet-only materials (carbon fiber, G10) from being cut.
        - id: d4
          label: CTO Nesting Software (Jake Graham)
          detail: >-
            Proprietary nesting and pricing algorithm co-authored by CTO. Key-person dependency; no public
            documentation, patent, or secondary authorship is disclosed.
        - id: d5
          label: Five-Facility Production Network (NV, KY, TX)
          detail: >-
            24/7 production distributed across five domestic sites. Regional weather, power, or maintenance events can
            disrupt capacity at any individual site.
        - id: d6
          label: Major US Carriers (UPS, FedEx, etc.)
          detail: >-
            Shipping integration with major carriers for domestic and international delivery. Holiday schedules, weather
            events, and carrier strikes create disclosed delays.
        - id: d7
          label: Order Completion and Revenue
          detail: Customer receives parts; SendCutSend recognises revenue. End state of all dependencies.
      edges:
        - from: d1
          to: d5
          label: raw materials to facilities
        - from: d2
          to: d5
          label: equipment enables cutting
        - from: d3
          to: d2
          label: garnet feeds waterjet machines
        - from: d4
          to: d5
          label: nesting software drives production efficiency and pricing
        - from: d5
          to: d7
          label: manufactured parts to carrier
        - from: d6
          to: d7
          label: carrier delivers to customer
