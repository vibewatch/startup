  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              SendCutSend's risk profile is strongest where customers, demand breadth, and operating momentum are
              strongest: the company has low single-customer concentration, strong public growth signals, and a clear
              service promise. The main investment concern is not whether demand exists; it is whether a capex-heavy,
              speed-dependent manufacturing platform can continue scaling without a hidden failure in financing, uptime,
              compliance, or leadership depth. Residual risk is highest in four places: first, cybersecurity and
              regulated-customer qualification for sensitive design files; second, equipment and facility reliability
              inside an owned-capacity model; third, financing dependency on lender-backed machine growth; and fourth,
              founder and software-lead concentration. These risks are not thesis-breaking today, but they do mean the
              2026 price should be underwritten more like an industrial platform with meaningful operating leverage than
              like a low-capex SaaS business.
            claimRefs:
