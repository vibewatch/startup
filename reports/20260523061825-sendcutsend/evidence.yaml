evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: governance
    missingEvidence: >-
      Post-Series A board composition, shareholder agreement terms, governance rights, board seat allocation, and cap
      table have not been publicly disclosed.
    whyItMatters: >-
      Board governance and investor control rights are essential for assessing alignment risk between Sequoia/Paradigm
      and the founder-controlled operating model; cannot be assessed without direct disclosure.
    diligencePath: >-
      Request board composition schedule, shareholder agreement, and cap table from company during formal due diligence;
      review Series A term sheet for protective provisions and board seat allocations.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: missing-source
    severity: material
    topic: adverse-checks
    missingEvidence: >-
      No regulatory actions, lawsuits, or formal complaints have been identified; but a comprehensive legal and
      regulatory search (PACER, state court filings, OSHA, EPA, DFARS enforcement) has not been conducted.
    whyItMatters: >-
      Manufacturing operations carry potential liability for workplace safety, environmental compliance, and federal
      procurement rules; unidentified adverse records could materially affect diligence outcome.
    diligencePath: >-
      Run PACER search for Send Cut Send Inc., check Nevada and Kentucky OSHA records, search SEC EDGAR for any
      related-party filings, and verify DFARS compliance audit history directly with company.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: quality
    missingEvidence: >-
      No independent aggregated customer complaint data, third-party quality audits, or negative review patterns have
      been identified; positive testimonials dominate publicly available sources.
    whyItMatters: >-
      At 300,000+ customers and 50M+ parts, even a small defect rate could represent significant rework/warranty
      exposure; quality failure patterns at scale are not visible in current public record.
    diligencePath: >-
      Review BBB complaints, Trustpilot, Yelp, and Google reviews systematically; request quality KPIs (defect rate,
      rework rate, customer return rate) directly from company.
    relatedQuestionRefs:
      - QO013
  - type: missing-source
    severity: material
    topic: adverse-checks
    missingEvidence: >-
      No formal short reports, skeptical analyst coverage, or journalistic investigations critical of SendCutSend's
      business model, margin structure, or growth sustainability have been located.
    whyItMatters: >-
      The absence of critical coverage may reflect genuine company quality, or it may reflect limited analyst attention
      on a private company. Investors should not mistake absence of criticism for absence of risk.
    diligencePath: >-
      Search Alphaville, Pitchbook commentary, LinkedIn industry commentary, and specialized fabrication industry forums
      for critical assessments; request independent unit-economics verification from company.
    relatedQuestionRefs:
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: >-
      Full executive org chart below CEO/President/CTO level has not been publicly disclosed; VP-level and department
      head roster is unknown.
    whyItMatters: >-
      Leadership depth below the C-suite affects succession planning and scalability; unknown whether company has built
      functional depth in operations, finance, legal, and people functions.
    diligencePath: >-
      Review LinkedIn company page for functional leaders; request org chart and management team roster from company
      during diligence.
    relatedTableRefs:
      - TO002
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Full capitalization table, investor economics, secondary provision details, and equipment financing credit
      facility terms are not publicly available.
    whyItMatters: >-
      Without the cap table, it is not possible to assess investor dilution, liquidation waterfall, or the relative
      economic interests of founders, F&F investors, and Series A investors.
    diligencePath: >-
      Request capitalization table, JPMorgan credit agreement summary, and Series A term sheet during formal due
      diligence engagement.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO008
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: >-
      The most recent confirmed headcount (410, January 2026) is from before the $110M raise; Belosic announced 200-300
      hires as part of the funding deployment, but no post-funding headcount has been confirmed.
    whyItMatters: >-
      Hiring velocity and success in adding software engineers and production staff are key operational metrics
      post-funding; stale headcount limits ability to assess execution on capital deployment plan.
    diligencePath: >-
      Monitor LinkedIn headcount tracker, company careers page job postings, and request updated headcount at quarterly
      check-in or investor update cadence.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: competitive-comparison
    missingEvidence: >-
      No independent comparative analysis between SendCutSend's model and traditional job-shop fabrication on cost, lead
      time, and quality metrics has been located in reviewed sources.
    whyItMatters: >-
      Without comparative benchmarking, the claim that SendCutSend outcompetes traditional job-shops on price and speed
      cannot be independently validated; market positioning depends on this advantage.
    diligencePath: >-
      Search trade publications (Fabricating & Metalworking, The Fabricator) for comparative coverage; request sample
      customer cost benchmarks or case studies from company.
    relatedQuestionRefs:
      - QO019
  - type: missing-source
    severity: blocking
    topic: market-sizing
    missingEvidence: >-
      An independent third-party analyst report (e.g., IBISWorld, MarketsandMarkets, Grand View Research) isolating the
      U.S. on-demand custom digital sheet metal fabrication sub-segment with a granular TAM, SAM, and 5-year CAGR.
    whyItMatters: >-
      Without a sub-segment TAM, the $1.01B SendCutSend valuation cannot be anchored to a market-share framing;
      investors must rely on competitor proxy math that has wide uncertainty bands.
    diligencePath: >-
      Commission or license a custom analyst report from IBISWorld or Grand View Research scoped to "digital/on-demand
      custom fabrication platforms, U.S., 2023–2028." Alternatively, consult Xometry's investor relations disclosures
      for any market sizing they cite.
    relatedQuestionRefs:
      - QM006
