      - number: '1.4'
        title: 规模、封面指标与财务轨迹
        blocks:
          - type: paragraph
            body: >-
              Northern Nevada Business Weekly 根据对 Belosic 的采访报道称，SendCutSend 在 2025 年 10 月年收入突破 $100M。公司在 2026 年 5
              月融资公告时披露年收入为 $200M——约七个月内接近翻倍，与 2026 年 1 月约 80% 的同比增长率相符。公司公开称自己在此期间持续盈利；但未披露经审计财务，这些数字来自公司声称或第三方对 CEO
              采访的报道，并未经过独立核验。


              客户和零件指标得到多方独立及官方来源印证。公司在 2026 年 5 月新闻稿中称已服务超过 300,000 名客户，商业页面目前显示迄今已制造 50M+ 个零件——高于融资新闻稿中的
              30M+，说明商业页面更新时间更近。公司称超过 59.8% 的 Fortune 500 公司是其客户；这个具体数字出现在公司自有来源中，尚未经过独立审计。SendCutSend 已连续三年入选 Inc. 5000
              美国增长最快私营公司榜单，2025 年排名 #511。


              截至 2026 年 1 月，公司有 410 名员工，在三个州的五处设施运营约 250,000 平方英尺制造和办公空间，其中 Reno 三栋楼合计 130,000 平方英尺。公司融资后的招聘计划（新增 200 到
              300 人）意味着 2026 年 5 月员工数明显高于 410 人，但尚未得到独立确认。收入集中度显著偏低：收入最高客户只贡献总收入的 0.59%，说明客户分散度强，单一客户依赖风险有限。公司设备阵容包括 13
              到 14 台光纤激光切割机，以及多台机器人 CNC 铣床；约 15% 铝材来自海外供应商。
