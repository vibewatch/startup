      - number: '4.4'
        title: 可比公司的财务参照
        blocks:
          - type: paragraph
            body: >-
              三家上市或近期交易公司可为 SendCutSend 的财务画像提供校准，但它们都有结构性差异，直接可比性有限。

              Xometry（NASDAQ: XMTR）是财务规模最接近的参照。Q1 2026，Xometry 总收入为 $205M（YoY +36%），平台收入为 $191M（YoY +40%），毛利润为
              $78.5M（毛利率 38.3%，YoY +3 percentage points）。Xometry Adjusted EBITDA 为 $10.5M，而 Q1 2025 为 −$0.4M，YoY 改善
              $10.4M。按过去 12 个月口径，这意味着年化收入约 $820M+；管理层指引 2026 全年收入增长 27–28%，目标是年收入 $1B。Xometry
              的模式根本不同：它作为平台中介赚取抽成价差，没有自有制造资产，因此毛利率反映的是中介经济性，而不是制造经济性。理论上，SendCutSend
              的全自有模式每美元收入毛利率应更低（因为它承担所有权直接成本），但一旦资本开支完全折旧且利用率高，EBITDA margin 可能更高。

              Protolabs（NYSE: PRLB）是混合模式，拥有自有工厂收入（$416.9M，YoY +4.1%）和网络收入（$116.2M，YoY +15.7%），FY2025 合计 $533.1M（YoY
              +6.4%）。Protolabs 产生 $78.1M Adjusted EBITDA（14.7% margin）和 $74.5M 经营现金流，截至 December 31, 2025 持有 $142.4M
              现金和投资。Protolabs 较慢的增长率（6.4% vs SendCutSend 声称的 80%）说明它是更成熟、低增长的业务，盈利可见性明显更好，但 TAM 扩张轨迹更低。Protolabs 的 14.7%
              Adj EBITDA margin 为自有产能数字制造商在规模化后能达到的水平提供了一个合理下限参照。

              Fictiv 在 April 2025 被 MISUMI Group 以 $350M 全现金收购（June 2025 交割）。收购时，Fictiv 已为 2026 生产 35M+
              零件；收入未公开披露。尽管零件量相近，$350M 收购价相对 SendCutSend 的 $1.01B 估值有明显折价，可能反映 Fictiv 的全球（依赖离岸）网络模式与 SendCutSend
              的美国本土自有产能模式不同，也可能只是增长轨迹不同。Fictiv 收购验证了数字制造领域的 M&A 兴趣，同时也为估值参照建立了一个具体可比交易。

              SendCutSend 的 5.05x 过去十二个月收入倍数（$1.01B / $200M）优于 Protolabs 历史交易倍数（通常 2–4x 收入），但低于成长高峰期 SaaS 倍数。对一家声称增长 80%
              且盈利的制造公司来说，如果收入和盈利说法准确，这个倍数是合理的——但相对更广泛的工业制造板块（通常 1–2x 收入）仍然偏高，必须用独立验证财务做压力测试。Fast Radius 是警示性可比案例：它原计划通过
              SPAC 融资 $300–445M，却因 91% 股东赎回只收回 $106M，并在 2022 破产——提醒投资人，资本密集型数字制造模式需要耐心且专门的资本，而不是泛化 SPAC 股权。
