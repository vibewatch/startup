      - 公开可比参考点
      - 具体尽调路径
    rows:
      - - 经审计收入（$200M 声称）
        - 无法支撑估值判断；所有下游比率都取决于该数字
        - Protolabs FY2025 经审计收入 $533M；Xometry 2026 Q1 经审计收入 $205M
        - 索取过去 2–3 年经审计财务报表，或经外部审阅的管理账
      - - 毛利率
        - 无法评估单位经济模型、定价权或成本敏感度
        - Protolabs FY2025 non-GAAP 毛利率未单独披露；Xometry Q1 为 38.3%
        - 索取按服务线划分的 P&L；对齐所用毛利率定义
      - - EBITDA 利润率和经营现金流
        - 无法评估自筹资金能力；盈利说法无法验证
        - Protolabs FY2025 调整后 EBITDA 14.7%；Xometry Q1 调整后 EBITDA 利润率 ~5.1%
        - 索取过去 12 个月 EBITDA 桥表；拆分经常性与一次性项目
      - - 设备债务偿还表
        - 无法评估总杠杆；债务契约可能限制股权交易
        - 私营公司无可比公开披露
        - 索取完整 JPMorgan 信贷协议；未偿本金和契约摘要
      - - 股权结构表
        - 无法评估投资者稀释、清算优先权或老股条款
        - 私营公司无可比公开披露
        - 索取 Series A 后股权结构表；董事会组成；治理权利清单
      - - 客户队列数据（LTV、复购率、流失）
        - 无法评估收入质量；最大客户仅占 0.59% 是正面信号，但信息不完整
        - Xometry 披露活跃买家（85,581）和 LTM $50K+ 账户（1,864）
        - 索取按客户队列划分的 12 个月复购率；按分群划分的年度流失率
      - - 月度烧钱速度和现金跑道
        - 无法判断 $110M 是否足够；下一轮融资时间未知
