      - number: '4.3'
        title: 资本充足度与融资结构
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的资本结构反映出八年来“设备优先融资”的理念：可抵押资产（激光切割机、CNC 机器）通过 JPMorgan Chase
              以有担保债务融资，把主要资本开支留在任何股权投资者资产负债表之外。2026 前的股权融资仅限于 Sandy Kory 和 Mark Sugarman 参与的 $6 million
              亲友轮，其余增长由经营现金流、信用卡、储蓄和设备债务支持。这种方式要求纪律，但也让公司进入机构轮时已经展示出盈利能力和有机增长。

              May 2026 的 $110M Series A 是公司第一次机构融资，由 Sequoia Capital（合伙人 Andrew Reed 和 Shaun Maguire）与 Paradigm（Matt
              Wong）共同领投，Stripe 的 Patrick 和 John Collison 以个人身份参与。投后估值为 $1.01 billion，按 $200M 收入说法计算，隐含约 5.05x
              过去十二个月收入倍数。Belosic 以对创始人友好的条款安排交易，保留运营控制权和董事会治理权；董事会组成未披露。Collison 关系起源于 X（Twitter），Patrick Collison 主动联系
              Belosic，随后把他介绍给 Sequoia 和 Paradigm。

              $110M 的用途被刻意与设备区分开：全部股权资本投向无法抵押融资的支出类别。也就是把软件工程团队扩大到三倍（包括计算几何工程师）、招聘 200–300 名生产员工，并支付新建筑场地押金（约 $600K /
              处）。新地点的设备会继续由 JPMorgan 融资。Belosic 明确表示，除 $110M 外，已有超过 $250M 被指定用于扩建现有设施和建立新制造枢纽；这额外 $250M
              的融资机制没有说明，但设备部分预计会沿用既有债务融资模式。

              公司还承诺在五年内向美国制造业岗位和本土生产材料投资 $1 billion——这是一项政治和声誉承诺，其融资路径远超当前轮次。隐含资本需求显著大于
              $110M，也引出几个问题：下一轮股权融资的轨迹、未来设备采购的债务容量，以及公司盈利能否自筹扩张中的非设备部分。$110M 带来的烧钱速度和现金跑道未披露。现金转换周期、营运资本需求和授信条款完全是私有信息。
