            - 中高——最受欢迎附加项；#SendBendSend
            - 高——8 种金属；厚度范围广；需求高
            - 低——不支持压印 / 卷边是已记录限制，不是风险
        - label: 表面处理（阳极 / 电镀 / 粉末）
          values:
            - 中高——官方规格 + 适用规则
            - 中——一个订单内可选多种表面处理
            - 中——附加项出货量未披露
            - 低——化学品供应和适用约束已有记录
        - label: 企业平台（组织、Net-30、DFM）
