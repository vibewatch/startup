      - number: '8.3'
        title: 融资背景与可比估值框架
        blocks:
          - type: paragraph
            body: >-
              融资背景有双刃剑。一方面，股权结构表吸引了高信号投资者，公司没有经过多年公开市场预热就拿到独角兽定价，执行力值得认可。另一方面，上市可比公司组显示投资者正在为叙事承担多少工作。Xometry
              目前以很高的公开市场倍数交易，证明在有利市场里，数字化制造故事可以拿到溢价估值。Proto Labs 和 Materialise 的交易倍数明显更低，说明市场不会自动把类似软件的倍数给所有数字化赋能制造公司。对
              SendCutSend 来说，正确框架既不是忽略 Xometry，也不是把它当作唯一锚点。Xometry 设定了投资者愿意为增长和软件杠杆支付的上行边界；Proto Labs 和 Materialise
              定义了成熟自有产能与制造软件混合体通常落到的位置；Fictiv 和 Fast Radius 展示了资本强度或市场时点转向不利时，战略退出和下行情景可能长什么样。结果是一组混合可比公司，支持纪律，而不是亢奋。
