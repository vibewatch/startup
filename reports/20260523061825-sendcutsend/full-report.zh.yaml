      - CE037
  - id: FE002
    title: 客户工作流——从上传到交付
    type: flow
    layout: standard
    summary: 从设计文件到零件交付的端到端客户旅程，展示 SendCutSend 区别于传统加工车间的关键软件触点。
    data:
      nodes:
        - id: design-cad
          label: 创建或获取 CAD 文件
          detail: 客户用 20+ 支持格式中的任意一种创建 2D 或 3D 设计文件。免费镂空模板和激光切割模板可下载。
        - id: upload-platform
          label: 上传到 sendcutsend.com
          detail: 上传时，客户选择材料、厚度、数量和所需二次工序（折弯、五金、表面处理）。定价无需账户。
        - id: dfm-check
          label: DFM 引擎校验设计
          detail: 自研 DFM 引擎自动检查孔径、切缝、折弯半径和特征细节。定价显示前，问题会附带可执行反馈。
        - id: instant-price
          label: 生成即时报价
          detail: 套料算法计算并发客户订单之间的最优板材利用率。价格反映材料成本、切割时间、二次工序和批量档位。
        - id: checkout
          label: 客户下即时购买订单
          detail: 选择标准（2–3 天）或加急交期。企业客户可使用 net-30 或总括 PO。结账时可选择盲发票。
        - id: facility-routing
          label: 订单路由到最优设施
          detail: 生产计划系统根据材料可得性、机器产能和交期承诺，把订单排到 NV、KY 或 TX 中最合适的设施。
        - id: manufacturing
          label: 切割 + 二次工序
          detail: 执行激光、水刀或 CNC 切割；随后依次完成折弯、五金压装和表面处理。300+ 员工支撑 24/7 生产。
        - id: qc-pack-ship
          label: 质检、包装和承运商取件
          detail: 零件检验、包装后交给承运商。标准服务下，91% 订单在 5 个工作日内发货；加急件可在 < 30 分钟内出产。
        - id: delivery
          label: 零件交付
          detail: 美国 2–4 个工作日送达；加拿大 4–8 天（税费 / 关税在结账时预付）。美国订单满 $39 免运费。
      edges:
        - from: design-cad
          to: upload-platform
          label: 文件上传
        - from: upload-platform
          to: dfm-check
          label: 自动校验
        - from: dfm-check
          to: instant-price
          label: 如果有效
        - from: dfm-check
          to: upload-platform
          label: 若标记错误 → 修改
        - from: instant-price
          to: checkout
          label: 客户接受价格
        - from: checkout
          to: facility-routing
          label: 订单确认
        - from: facility-routing
          to: manufacturing
          label: 生产排期
        - from: manufacturing
          to: qc-pack-ship
          label: 零件完工
        - from: qc-pack-ship
          to: delivery
          label: 承运商取件
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE007
      - CE008
      - CE009
      - CE040
      - CE041
  - id: FE003
    title: 关键依赖地图——运营脆弱点
    type: dag
    layout: wide
    summary: SendCutSend 生产运营中的关键供应商、基础设施和平台依赖，突出一次扰动会在哪里传导到订单完成。
    data:
      nodes:
        - id: d1
          label: 美国轧厂原材料供应
          detail: 170+ 材料 SKU 来自美国轧厂。关税变化、轧厂产能或材料短缺会直接约束生产能力。
        - id: d2
          label: OEM 设备群
          detail: 光纤激光（4–12 kW）、水刀、CNC 雕刻机和折弯设备来自第三方 OEM。维护或零件可得性导致的机器停机会压低产能。
        - id: d3
          label: 石榴石磨料供应
          detail: 水刀作业依赖碎石榴石磨料的连续供应。供应中断会让只能用水刀切割的材料（碳纤维、G10）无法加工。
        - id: d4
          label: CTO 套料软件（Jake Graham）
          detail: 自研套料和定价算法由 CTO 参与共同开发。存在关键人依赖；未披露公开文档、专利或第二作者。
        - id: d5
          label: 五设施生产网络（NV、KY、TX）
          detail: 24/7 生产分布在五个国内站点。区域天气、电力或维护事件可能扰动任一单站点产能。
        - id: d6
          label: 美国主要承运商（UPS、FedEx 等）
          detail: 与主要承运商集成，支持国内和国际配送。假日排期、天气事件和承运商罢工会造成已披露延迟。
        - id: d7
          label: 订单完成与收入
          detail: 客户收到零件；SendCutSend 确认收入。所有依赖的终点状态。
      edges:
        - from: d1
          to: d5
          label: 原材料送至设施
        - from: d2
          to: d5
          label: 设备支撑切割
        - from: d3
          to: d2
          label: 石榴石供给水刀机器
        - from: d4
          to: d5
          label: 套料软件驱动生产效率和定价
        - from: d5
          to: d7
          label: 制成零件交给承运商
        - from: d6
          to: d7
          label: 承运商交付给客户
    claimRefs:
      - CE005
      - CE040
      - CE053
      - CE055
