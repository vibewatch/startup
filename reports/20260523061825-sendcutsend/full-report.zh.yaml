      - number: '3.5'
        title: 替代品、现状路径与失败可比案例的教训
        blocks:
          - type: paragraph
            body: >-
              除了直接的数字平台竞争对手，SendCutSend
              还面对三类替代品：（1）作为默认现状的区域加工厂；（2）工程导向买家的内部自有制造；（3）通过合同制造商或贸易公司离岸采购，尤其适用于规划周期更长、产量对成本敏感的买家。

              区域加工厂主导本地工业采购，但在速度（2–6 week 交期 vs 2–4 days）、数字可达性（没有即时报价）和最低订单量（通常最低 25–500 件）上有结构性短板。SendCutSend
              靠取消最低订单量并压缩周转时间来转化加工厂客户。切换决策更多由紧迫性和设计迭代速度驱动，而不只是价格；工程师一旦体验过即时报价和 2-day 交付，再回到 3-week RFQ 流程，摩擦会很高。

              内部自有制造是切换成本最高的替代品。已经购买激光切割机、折弯机或加工中心的公司，资本已经沉没在设备所有权里。转化逻辑在于外包能去掉设置时间、材料库存管理和机器维护——对制造需求周期性而非连续性的公司尤其相关。SendCutSend
              的无限设计、无最低订单量模式正好瞄准这个用例。

              Fast Radius 是数字制造类别里最有参考价值的警示案例。Fast Radius 成立于 2017，使命与 Xometry 和 SendCutSend 类似（软件赋能制造准入）。公司在 February
              2022 通过 ECP Environmental Growth Opportunities Corp. 完成 SPAC 合并，但股东赎回率达到 91%，只拿到 $106 million，而不是原本预期的
              $300–445 million。由于无法满足增长资本需求，Fast Radius 在 late 2022 申请 Chapter 11 破产，并通过破产法院批准的 Section 363 出售，把资产卖给
              SyBridge Technologies——一家由 Crestview Partners 支持、完成 14 起收购的 PE 整合平台。失败时，Fast Radius 已经覆盖 150,000+ 设计、生产超过
              15 million 个零件。教训是：资本不足的数字制造平台在结构上很脆弱；其成本结构（销售、认证、供应商管理、软件）会先于收入扩张，资本充足度才是首要生存变量。SendCutSend 在 $110M
              融资前已经靠自力更生实现盈利，自有产能模式也带来更确定的成本结构，这使它不同于 Fast Radius 的失败模式。
            claimRefs:
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
              - CP034
      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: 自有产能是护城河基础
            body: >-
              SendCutSend
              全部自有的美国生产能力带来确定性质量控制、可预测交期，以及由套料经济性带来的结构性成本优势——这些都不是平台中介不持有资产就能复制的。该模式还消除了供应商失败风险，并符合非监管买家的企业质量标准。300,000
              客户存量反映出多年忠诚复购行为；交易层面不拥有客户关系的平台模式很难复制这一点。
            calloutType: strength
