      - number: '1.3'
        title: 融资历史与投资人格局
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 在接受机构资金前自筹发展了七年。2026 年前唯一外部融资是一笔 $6M 亲友轮，Sandy Kory 和 Mark Sugarman 参与其中；这笔钱让 Belosic
              更有信心加速采购设备。除这笔种子资金外，公司依靠信用卡、储蓄、PayPal 贷款，以及通过 JPMorgan Chase 做设备融资——Belosic 称该行是其购买机器的银行伙伴。单台价格约 $1.3M
              的光纤激光切割机，以机器本身作为抵押进行债务融资，从而不把主要资本开支压到任何股权投资人的资产负债表上。


              2026 年 5 月 19 日，SendCutSend 宣布完成 $110M A 轮融资，这是公司的首次机构融资，投后估值 $1.01B。该轮由 Sequoia Capital 与 Paradigm
              共同领投：Sequoia 方面是 Andrew Reed 和 Shaun Maguire，Paradigm 方面是 Matt Wong；Stripe 联合创始人 Patrick Collison 和 John
              Collison 也以个人身份参与。Collison 关系起源于 X（原 Twitter）：Patrick Collison 关注公司后直接联系 Belosic，随后把他介绍给 Sequoia 和
              Paradigm。Belosic 表示，Sequoia 合伙人亲自到 Reno 工厂参观，是促成交易的决定性因素。


              $110M 将投向三类无法抵押、因此无法通过传统贷款融资的事项：把软件工程团队扩大到三倍，新增 200 到 300 名生产员工，以及支付大型厂房押金（Belosic 提到大型设施的首末月押金约
              $600,000）。$110M 之外的额外资本——具体说超过 $250M——已指定用于扩建现有设施并在全美建立新的制造枢纽。公司还宣布五年内投入
              $1B，用于美国制造业岗位和本土生产材料。第四处设施正在谈判中，Pennsylvania 和 Ohio 都在考虑范围内；Indiana、Las Vegas 和 Atlanta 被列为后续目标。
