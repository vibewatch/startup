      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Jim Belosic 在 2026 年融资公告时 45 岁，是 SendCutSend 的创始人兼 CEO，也是公司的主要公开面孔、核心决策者和产品愿景负责人。他过去 30 年中有 25
              年处于自雇和创业状态，经历包括平面设计与营销业务、软件开发职业，以及 2010 年联合创办 ShortStack——一家数字营销和社交媒体自动化平台；他后来出售自己在 ShortStack 的权益，用所得资金支持
              SendCutSend 早期发展。退出 ShortStack 并押注工业加工，源于 Belosic 认识到小批量和原型零件订单在定制零件市场中长期供给不足；这个痛点来自他个人修复汽车和摩托车的经历。


              Erin Belosic 担任公司总裁，也是 Jim Belosic 的配偶。她负责组织管理和战略运营监督；NNBW 将她列为公司长期地理扩张计划中的关键伙伴。Jacob（Jake）Graham
              是联合创始人兼首席技术官。Graham 共同编写了公司成本结构所依赖的套料软件，并在公司创立时加入 Belosic，一起搭建了定义平台用户体验的“上传到下单”工作流。


              关键人依赖是现阶段最重要的单一治理风险。Jim Belosic
              掌控战略、投资人关系和产品方向。他在融资后的沟通中明确表示：“我仍然掌控公司，可以继续下大注，方向和愿景仍由我来定”——这确认了投资后他仍保留运营权威。融资轮按 Belosic
              要求设计成创始人友好条款。公司尚未披露融资后的正式董事会构成，治理权、投资人董事席位和继任计划仍是尽调缺口。公司直到 2026 年 5 月融资前都抗拒外部监督，这进一步增加了机构投资人的治理不确定性。
