      - number: '6.2'
        title: 采用轨迹与规模指标
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 公开披露的采用数据体现出很大的绝对规模和很快的增长轨迹，但这些数据仍由公司自报，未经审计。到 2026 年 5 月融资时，公司已向 300,000 多名客户发出 50 million
              个零件。Northern Nevada Business Weekly 2026 年 1 月报道称，公司「到 2025 年底已为 300,000 多名客户生产 30 million 多个定制零件」，这与 2026
              年前五个月的快速提速一致。据披露，收入同比增长 80%；若能维持，未来 12–15 个月发货零件数将接近翻倍。更早的里程碑也印证增长弧线：首次 Inc. 5000 上榜引用了三年收入增长
              1,600%，公司在面向公众运营的第一个完整年度切割了 2 million 多个零件。


              批量折扣从第一个完全相同的复制件起在结账时自动递增，生产批量最高可到 70%；这种定价结构天然鼓励客户把多个 SKU 集中到同一家供应商。2025 年上线的加急服务增加了紧急需求拉力：标准服务下 91%
              的订单在五天或更短时间内发货，Fast 和 Fastest 档会把订单插入生产队列，并把加急生产与隔夜配送组合起来，让部分订单从上传到交付压缩到 48 小时。加拿大扩张把客户地域从美国向外延伸，Priority
              International 统一运费 $19，到加拿大主要城市的生产加运输时间为 2–4 天。


              商业落地页声称的每日 1,000+ 个项目和「5.0 星 Google 评分」，为日吞吐量提供了额外量级参照，不过两个数字都没有可审计的第三方验证。连续三年 Inc. 5000 排名（2022 年或早期周期
              #339，2025 年第三年 #511）给出了收入持续增长的独立信号，即便 Inc. 没有披露每次排名背后的具体增长率。
