  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与客户工作流
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的核心产品是基于浏览器的即时制造平台，用来替代传统“报价—等待”周期。客户上传 CAD 文件，支持格式超过 20
              种——DXF、DWG、AI、EPS、STP、STEP、SLDPRT、CATPART、IPT、IGS、PAR、IGES、NX、SolidEdge、JT、3DM、x_t、SAT 和
              SAB——然后选择材料、厚度、数量和所需二次加工，并立即获得价格。不用打电话，不用发邮件，也没有销售周期。


              平台的两套自研软件引擎是差异化来源。可制造性设计（DFM）引擎在定价前验证每个上传文件：它会标记最小孔径、桥接、折弯半径以及可能导致生产批次被拒的细节特征，并立即返回可执行反馈。每个已下单订单还会经过 CTO
              Jake Graham 共同编写的套料算法，该算法把多个同步客户订单的形状排到共享原材料板材上，最大化板材利用率。多客户套料机制让 SendCutSend
              能提供无最低数量定价，而不必承担迫使传统加工厂收取最低订单费用的单次设置成本。


              结账流程包含交期选择：标准 2–3 business days，或 Expedited Service（Fast：加急生产；Fastest：加急生产加隔夜配送）。企业客户还可以使用 Saved Carts
              功能来共享报价、设置框架采购订单和使用 net-30 账期。CEO 表示，标准服务下 91 percent 的订单会在 five business days 内发货，部分加急订单从上传到进入生产用时不到 30
              minutes。
