  - id: FM001
    title: 按需定制制造市场边界 —— 规模分层
    type: pyramid
    layout: standard
    summary: 美国按需定制金属制造的 TAM/SAM/SOM 分层，展示从广义美国定制零件市场，到数字化可触达平台切片，再到 SendCutSend 可观察位置的递进。
    data:
      nodes:
        - id: TAM
          label: 美国定制零件制造 TAM
          value: $20–50B (estimated; analyst range)
          detail: 美国定制工程零件总市场，覆盖所有生产方式，包括加工厂、自有车间、合同制造商和数字平台。没有单一权威数字；由 BDO/Deloitte 制造业板块规模推导。
        - id: SAM
          label: 按需数字平台 SAM
          value: $1.5–4B (inferred from public comparables)
          detail: >-
            可通过即时报价数字平台触达的子细分：原型 + 预生产 + 中小批量生产订单，且订单经数字渠道下达。下限以 Xometry（$760M+）+ Protolabs（$533M）+ SendCutSend（约
            $200M）三者可观察收入合计 $1.5B+ 为锚。
        - id: SOM
          label: SendCutSend 仅美国本土 SOM
          value: ~$200M current; $1B+ target
          detail: SendCutSend 当前年收入约 $200M，为单一仅美国本土平台的可观察 SOM 提供锚点。公司 $1B 承诺投资轨迹意味着，管理层目标是在未来五年拿下 SAM 中大得多的份额。
    approximationNotes: >-
