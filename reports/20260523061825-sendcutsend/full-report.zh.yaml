      - CV020
  - id: TV005
    title: 投资论点失效与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 增长大幅放慢且缺乏利润率证明
        - 年增长降至约 30%，毛利率仍未披露
        - 溢价倍数支撑失效
        - 当前价格下从跟踪转为回避
      - - 服务质量护城河退化
        - 持续延期发货或返工指标显示速度卖点在滑坡
        - 软件赋能可靠性的乐观论点走弱
        - 下调上行情景，并将可比公司基准下移
      - - 出现融资摩擦
        - 贷款方条款收紧，或新增产能意外需要高稀释性股权融资
        - 稀释和扩张放慢压缩回报
        - 将基准情形按下行情形处理
      - - 受监管企业客户上行未兑现
        - 关键防务 / 航空航天客户因认证或合规缺口停滞
        - 企业客户增长叙事明显走弱
        - 下调 TAM 和退出倍数假设
      - - 治理 / 披露阻力持续
        - 管理层在高企价格下拒绝提供经审计尽调包
        - 无法负责任地支撑该价格
        - 不投资
    notes: 否决触发项是为评估是否按 2026 年轮次价格参与的新资金投资人设定。
    claimRefs:
