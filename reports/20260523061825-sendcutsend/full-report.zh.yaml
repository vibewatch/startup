chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 是一家快速按需定制制造商，注册主体为 Send Cut Send Inc.，总部位于 4855 Longley Lane, Reno, NV 89502，成立于 2018
              年。公司的核心产品是一套“即时报价、立即购买”的加工平台：客户上传 CAD 文件（DXF、DWG、AI、EPS、STP、STEP），实时获得价格，并在没有最低起订量的情况下提交生产订单。标准订单的零件会在 2 到
              4 个工作日内制造并发货；加急服务可把交付压到最短 48 小时。每个传入文件进入生产队列前，都会先通过自动化面向可制造性设计（DFM）引擎。


              公司把自己称为“美国万物工厂”，并用运营能力兑现这句口号：目录里有 170 多种材料，覆盖铝合金、低碳钢和不锈钢、钛、铜、黄铜、碳纤维、聚碳酸酯、亚克力、MDF、胶合板、橡胶 /
              垫片材料；工艺包括激光切割、水刀切割、CNC 铣削、CNC
              机加工、折弯成形、滚抛、去毛刺、五金嵌件、攻牙、沉孔、压窝成形、粉末喷涂、阳极氧化，以及镀锌或镀镍。这种内部能力宽度让单个客户可以在一个供应商、一个订单里买到已经完成表面处理并装好五金件的成品零件。


              运营模式明确以软件为先。自研套料算法把多个客户的订单拼到同一张原材料板上，即使是单件订单也能提升材料利用率、压低单位成本；相比之下，传统加工厂必须把每个客户的板材视为一次独立设定。商业模式是直接面向客户的交易型制造，结账时按数量自动给出阶梯折扣。企业客户可使用
              net-30 付款账期、多用户组织账户、总括采购订单和专属客户经理。所有生产均在美国本土完成；SendCutSend 从美国材料厂采购材料，并且只在美国境内设施运营。
