      - number: '7.4'
        title: 合作伙伴、融资与人员依赖风险
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 没有典型的分销商或渠道集中风险；它的依赖图谱穿过资本、物流、合规和领导力。JPMorgan
              支持的设备融资是最清晰的单一依赖，因为它为驱动速度和产能的昂贵机器底座提供资金。如果债务条款收紧，即便需求保持强劲，增长也会放慢。包裹承运商是另一项重要伙伴风险，因为最后一公里交付属于公司品牌承诺的一部分，却在工厂控制之外。人员侧，公开叙事仍围绕创始人兼
              CEO Jim
              Belosic、他的长期制造愿景，以及一小组技术和运营负责人展开。对一家曾经自力启动的公司来说，这可以理解，但在十亿美元估值下会提出规模问题：业务能否快速增加数百名操作员、实质扩充软件团队，并在不过度依赖创始人注意力的情况下维持从报价到发货的可靠性？高知名度投资者有帮助，但公开治理细节仍薄。投资者看到继任计划、授权管理深度和贷款人条款之前，伙伴和执行风险都应被视为现实存在，而不只是理论风险。
