  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买家画像
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的客户基础明确横跨多个细分市场，一端是个人爱好者和创客，另一端是 Fortune 500
              采购组织。公司的基础承诺——无最低订单量、即时报价、数日内美国本土发货——原本就是为爱好者和小规模制造者设计的，因为他们此前被要求数百件起订的传统加工厂挡在门外。截至 May 2026
              融资公告，公司称其服务“美国超过 70,000 家企业”，同时总客户数超过 300,000，说明个人 / 爱好买家形成了庞大长尾，企业账户占比有意义但仍是少数。


              企业细分市场自然增长，如今覆盖广泛行业垂直。公司 May 2026 官方新闻稿列出航空航天、国防、太空飞行、数据中心、机器人、自动化、交通、海事、农业、分销和一般制造等服务垂直。Inc. 杂志 May 2026
              文章进一步指出，交通和国防公司是最早采用的企业客户之一，被 SCS 的速度和运营简单性吸引：“结果是，他们只是需要东西非常非常快，也需要流程非常简单，”Belosic 告诉 Wall Street
              Journal。AI 基础设施建设带来了新一波数据中心机架和机器人客户。公司声称 Fortune 500 渗透率为 59.8%，但尚未发布具名客户名单或对该数字的独立验证。


              企业客户内部还可按职能继续区分：工程团队用 SCS 做快速原型和设计迭代；采购部门利用框架采购订单和 net-30 账期执行重复生产；运营团队使用计划性重复订单来维持可预测的供应链吞吐。SCS
              博客发布的无人机制造指南，对单一垂直中的四类客户做了细分：个人 / 爱好者、小企业 / 初创公司、工业 / 商业，以及军事 / 航空航天国防承包商；这个分类展示出平台在单一终端市场中的可服务用例广度。
