      - number: '1.5'
        title: 里程碑时间线与负面核查
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的里程碑从 Jim Belosic 早年的个人爱好折腾开始，经过一段快速有机扩张，走到 2026 年的机构资金拐点。公司最早的设备是一把手持等离子切割机，之后是用于社区加工项目的
              Torchmate 2×2 Growth Series CNC plasma table，再之后才是启动时以约 $700,000 融资购入的完整工业光纤激光切割机。2018 年 11 月 1
              日，平台拿到第一笔线上订单——一位 Pennsylvania 客户购买匹克球拍形钥匙扣——这说明公司上线第一天就具备全国触达能力。到 2021 年，公司扩张到 Paris, Kentucky
              的设施，并开通加拿大配送。随后 Arlington, Texas 网点落地，形成目前三州、24/7 运转的制造网络。


              产品里程碑包括 2025 年 3 月推出 Expedited Service，把标准 2 到 3 天生产压缩到 48 小时内交付；以及 2025 年 8 月披露企业功能，包括组织账户、net-30 账期和 DFM
              自动化。2025 年 10 月，公司达到 $100M 年收入里程碑。2026 年 5 月的融资轮和独角兽估值，是公司迄今最重要的融资与治理里程碑。


              负面核查方面：本章审阅的任何来源中，都未发现针对 SendCutSend 的诉讼、监管行动、DFARS 执法程序、制裁或重大公开投诉。公司持有 DFARS 252.204-7012 和 NIST SP
              800-171 合规资质，说明它已通过基本的联邦供应链安全标准。公开记录中最重要的负面注记是历史性的：Jim Belosic 在本轮融资前公开批评过风险投资，据报道曾在早期采访中称 VC 是“骗子”，并在
              2023 年一期播客中表达过“VC 不该进入制造业”的观点。即便 Belosic 已公开承认立场变化，并把融资决定解释为战略演进，这仍给投资人留下一个关于董事会层面创始人与投资人是否一致的可信度和治理问题。
