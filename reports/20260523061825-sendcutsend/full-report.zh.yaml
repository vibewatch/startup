  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态 / 指标日期
      - 收入或规模标尺
      - 观测倍数 / 估值
      - 参照价值
      - 局限
    rows:
      - - Xometry (XMTR)
        - 上市公司，2026 年 5 月 22 日
        - TTM 收入约 $740.8M；Q1 收入 $205.1M
        - EV/收入约 6.49x；P/S 约 6.16x
        - 显示市场愿意为软件赋能制造增长买单
        - 市场平台模式，流动性更高，自有产能风险更低
      - - Proto Labs (PRLB)
        - 上市公司，2026 年 5 月 22 日
        - TTM 收入约 $546.3M；FY2025 收入 $533.1M
        - EV/收入约 2.86x；P/S 约 3.16x
        - 成熟数字制造中有用的自有产能基准
        - 增长更慢，成熟度高于 SendCutSend
      - - Materialise (MTLS)
        - 上市公司，2026 年 5 月 22 日
        - TTM 收入约 $267.5M；Q1 收入约 $66.3M
        - EV/收入约 0.84x；P/S 约 1.12x
        - 显示低增长制造软件 / 硬件的交易区间
        - 3D 打印软件收入结构不完全可比
      - - Fictiv / MISUMI
        - 私营公司战略出售，2025 年
        - 收入未披露；数字制造平台
        - 公开披露收购价值约 $350M
        - 私营战略退出的参照标尺
        - 收入未披露，全球网络模式不同
      - - Fast Radius / SyBridge
        - 困境出售，2022–2025 年背景
        - 失败的数字制造 SPAC
        - 破产后按 Section 363 出售资产
        - 重要的下行和融资纪律警示可比对象
        - 困境案例，不是健康的持续经营可比对象
    notes: 可比集合混合公开市场和私营战略交易，因为没有任何单一同行与 SendCutSend 完全匹配。
    enumerationScope:
      coverage: partial
      basis: >-
        The set covers the most decision-relevant public and transaction references available in public sources, but it
        cannot exhaustively cover private secondary marks, undisclosed cap tables, or every niche fabrication platform
        with limited disclosure.
