  - id: TE002
    title: 工作流与用例表
    columns:
      - 用户任务
      - 传统工作流痛点
      - SendCutSend 方案
      - 可量化收益
      - 限制
    rows:
      - - 制作一次性原型零件
        - 报价请求需 1–5 个工作日；人工 DFM；最低订单收费
        - 上传 CAD → DFM 检查 → 即时报价 → 立即购买
        - 零最低起订量；当日报价；2–3 天交付
        - 无现场工程支持；DFM 反馈只来自算法
      - - 小批量生产（10–500 件）
        - 开机费；最低收费；后期 DFM 带来返工风险
        - 结账时自动套用批量折扣；DFM 预先检查设计
        - 批量折扣最高 70%；定价透明且一致
        - 没有合同化生产 SLA；加急取决于产能可用性
      - - 企业生产补货
        - 采购复杂、人工 PO、要管理多家供应商
        - 组织账户、net-30 账期、总括 PO、专属代表、共享购物车
        - 降低采购摩擦；供应商版图收敛
        - 仅按需生产；无 VMI，SendCutSend 不持有库存
      - - 设计迭代周期
        - 等车间完成报价和 DFM 后，才能进入下一轮迭代
        - DFM 立即标出错误；重新上传修订文件即可获得新的即时报价
        - 迭代更快；原型阶段返工成本更低
        - DFM 不是工程认证；复杂公差叠加仍需人工审核
      - - 多工序零件（切割 + 折弯 + 表面处理）
        - 每道工序对应不同供应商；物流管理负担高
        - 一张订单在结账时覆盖所有二次加工
        - 供应商数量减少；一个追踪号；质量责任统一
        - 工序限于 SCS 目录；交付后不做装配或配套成套
      - - 供应链零部件采购
        - 供应商交期长；MOQ 高；准备延迟
        - 2–3 天交期；无最低起订量；按需加工
        - 免去缓冲库存；推向市场更快
        - 无寄售库存，也无总括订单库存预留
    notes: 收益数字（70% 折扣）基于标价；实际实现的折扣取决于零件几何形状、材料和订单组合。目前没有独立验证折扣深度或迭代周期缩短幅度。
