    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: SendCutSend 的公开记录横跨八年：从车库规模的等离子切割创业公司，成长为估值 $1B 的按需制造平台；在机构资本进入前已靠有机增长实现盈利。
    data:
      items:
        - date: 2018-01
          label: SendCutSend 创立
          detail: Jim Belosic 和 Jake Graham 在内华达州 Reno 推出上传即下单的制造平台，通过赊购融资买下第一台工业光纤激光设备。
          tone: positive
        - date: '2018-11-01'
          label: 首笔在线订单
          detail: 一位宾夕法尼亚客户订购匹克球拍钥匙扣，验证了运营第一天就存在的即时全国需求。
          tone: positive
        - date: '2019'
          label: 扩产开始
          detail: 上线六个月内，早期 Fortune 500 名称出现在客户队列中；需求持续跑在产能前面。
          tone: positive
        - date: '2021'
          label: 加拿大配送与 Kentucky 工厂
          detail: Kentucky 州 Paris 工厂开业；加拿大配送上线，关税由 SendCutSend 处理。
          tone: positive
        - date: '2022'
          label: Arlington, TX 工厂开业
          detail: 第三座美国生产枢纽落地 Texas；24/7 跨三州制造网络成型。
          tone: positive
        - date: 2025-03
          label: 加急服务上线
          detail: 新的加急生产层级把周转压到 48 小时以内；91% 订单在 5 天内发货。
          tone: positive
        - date: 2025-08
          label: Inc 5000
          detail: 连续第三年跻身美国增长最快私营公司之列；累计发货 50M+ 个零件。
          tone: positive
        - date: 2025-10
          label: $100M 收入里程碑
          detail: 年收入突破 $100M，完全靠自举增长跨过该门槛；盈利性延续。
          tone: positive
        - date: '2026-05-19'
          label: $110M Series A，估值 $1.01B
          detail: 首轮机构融资由 Sequoia、Paradigm 和 Collisons 共同领投；公司在盈利状态下获得独角兽估值。
          tone: positive
        - date: '2026-05-19'
          label: $1B 美国制造承诺
          detail: 融资同时宣布再工业化承诺；$250M+ 将投向全美新工厂。
          tone: positive
    approximationNotes: Kentucky（约 2020-2021）和 Texas（约 2022-2023）工厂开业日期为近似值；已审阅来源未确认精确日期。
