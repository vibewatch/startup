              - CE004
              - CE005
              - CE003
              - CE009
          - type: callout
            title: 套料 IP 集中在单一 CTO；没有 ISO 质量认证
            body: >-
              套料和定价算法由 CTO Jake Graham 共同编写，完全属于自研专有技术，没有公开专利申请或架构文档。如果 Graham
              离职或无法履职，定价引擎可能面临按月计算的重建风险，而且没有竞争对手能在同一时间线上接手。另一个风险是，公司缺少 ISO 9001:2015 或 AS9100D 认证——竞争对手 OSH Cut 和
              Xometry 供应商分别持有这些认证——这会为受质量门槛约束的企业和政府相关买家制造采购障碍。两项风险目前都没有在业务中被明显定价，但对机构投资人而言都是重大尽调事项。
            calloutType: risk
