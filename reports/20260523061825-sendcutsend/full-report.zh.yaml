      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的客户群覆盖多种组织类型和采购场景，但平台设计选择——无最低起订量、即时定价、文件上传流程——显示其主要面向工程和产品开发买方。主要入口画像是产品公司里的个人设计工程师或 CAD
              操作员：他上传设计文件，获得即时价格，不用等待供应商报价周期就能下单。小额交易中，这个用户通常既是使用者也是付款方；当金额门槛触发采购审批时，较大或重复订单会转入采购流程。

              在企业层，组织买方拆成两类：工程师仍是技术规格定义者和平台用户，而采购经理与供应链总监负责供应商准入、net-30 付款管理和总括采购订单管理。企业功能——多用户组织账户、专属客户经理、DFM 检查自动化、总括
              PO 支持——就是为了贴合中大型制造商的采购工作流。SendCutSend 的商业页面明确面向从原型（1–500 件）到预生产（25–250
              件）再到全量生产（排期重复订单）的企业，这表明公司有意采用“先落地、再扩张”的客户旅程：原型订单先建立信任和质量记录，采购再承诺生产批量。

              企业客户队列——来自 Fortune 500 航空航天、国防、数据中心、机器人、航天、交通运输、海事和农业领域的公司——代表收入集中度最高的客群。SendCutSend 声称超过一半（59%）的 Fortune
              500 公司是其客户；该说法由公司提出，尚未经过独立审计验证。创业公司、创客和独立发明者构成按客户数量计算的长尾，但收入占比可能不成比例地低。OEM 生产部门把 SendCutSend
              用作峰值产能或过渡供应商，处理主力合同制造商产能之外的零件；这个用例要求的是交付可靠性和一致质量，而不是最低单位成本。
