      - number: '6.3'
        title: 具名客户证据与使用场景
        blocks:
          - type: paragraph
            body: >-
              目前最详细的客户证据来自 SendCutSend
              自有博客案例和第三方评论平台。这些来源覆盖了很宽的使用场景，但共同局限也很清楚：要么由公司筛选，要么是小规模个人证言，而不是经审计的企业部署。公司博客画像过的客户包括：Cap for Kids（非营利组织，使用
              SCS 制作 Captain America 角色扮演盾牌支架和肩部五金件）、NiteOwl Tattoo Furniture（小批量纹身家具制造商，采购激光切割钢支架）、Tyler Bell（Boeing
              工程师，经营一个业余制造工作室，所有定制金属件都来自 SCS）、Logan Teale（刀具和工具制造者，称 18 个月卖出 2,000+ 件工具，SCS 是唯一生产来源），以及 Team Witch
              Doctor（由 SCS 赞助的 BattleBots 团队，使用钛和钢激光切割框架与外壳）。推荐语部分还引用了多位制造车间老板和定制汽车制造商，其中数人提到多年、高频下单模式。


              企业级证明明显更薄。没有任何第三方报道点名某家 Fortune 500 公司为客户。NNBW 文章确认上线六个月内订单队列里出现了「一些知名企业名称」，但没有列名。Inc.
              画像称大型交通和国防公司现在是客户，却没有给出具体名称。官方 anything-factory 新闻稿列出行业垂直领域——「横跨航空航天、国防、太空飞行、数据中心、机器人、自动化、交通运输的 Fortune
              500 公司」——但同样没有具名账户。缺少具名企业引用是实质尽调缺口：投资者无法独立评估企业板块内的生产规模、合同条款、合规要求或续约风险。


              Trustindex（聚合 Google 评论）的评论平台数据显示，2026 年 5 月个人客户 5
              星评分呈现一致模式，理由集中在周转快、零件准确、客服响应及时。多名评论者提到复购和多年关系。一位评论者（Mike Hansen，Trustindex，2026 年 5 月）明确称「多年下来向他们下了 50+
              个订单」，质量稳定。这些是独立信号，但代表的是个人买家而非企业账户，也很可能偏向愿意留下评价的满意复购客户。
