          - type: callout
            title: 认证缺口把受监管市场结构性挡在门外
            body: >-
              SendCutSend 没有公开确认的 AS9100D、ITAR 或 ISO 13485
              认证。这些认证是航空航天主承包商、美国国防项目和医疗器械制造商的合同要求——这些细分市场价格溢价高，供应商留存也高。Xometry 拥有三项认证，因此可以服务 SCS
              目前无法覆盖的受监管采购。这里不是声誉缺口，而是收入天花板。
            calloutType: risk
