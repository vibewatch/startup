      - number: '3.3'
        title: 定价、产品打包与能力对比
        blocks:
          - type: paragraph
            body: >-
              定价透明度是数字加工的核心差异点。SendCutSend 在上传时发布即时价格，结账时自动应用批量折扣，并且没有最低起订量。企业客户可使用 net-30 付款账期和总括采购订单。美国境内订单超过 $39 免运费。

              Xometry 也为板材切割、激光切割、水刀切割和 CNC 机加工提供即时定价。其标准板材切割交期为 3 个工作日，并在 2026 年 Q1 推出 1 天企业交期。Xometry
              的动态定价采用转化率模型，分析几何特征、报价配置和客户历史数据。虽然平台显示标价，但 Xometry 的供应商网络会带来比 SendCutSend 自有产能模式更大的价格波动。

              Protolabs Network（Hubs）通过机器学习，把上传的 CAD 文件与数百万个既往制造零件进行比较来生成即时报价，并在用户改变材料、交期或规格时实时更新。CNC 机加工交期从 5
              个工作日开始。Protolabs 处理发往 EU、UK 和 US 订单的清关和进口关税，体现其国际覆盖范围。

              OSH Cut 为激光切割和折弯金属零件提供即时套料报价。订单规模提高时，其定价引擎会自动应用批量折扣。OSH Cut 明确把自己定位为直接制造商，不使用加工经纪或第三方服务商——这呼应了 SendCutSend
              的自有产能价值主张，但规模更小，材料和表面处理选项也更窄。

              在表面处理上，SendCutSend 拥有最宽的美国本土内部目录：粉末喷涂、阳极氧化、镀锌和镀镍、滚抛、去毛刺——全部在同一订单内由内部完成。Xometry
              通过供应商网络提供表面处理（工艺范围更广，但需要协调而不是内部完成）。Hubs 明确把许多后处理步骤排除在即时报价工作流之外。OSH Cut 提供去毛刺和直纹表面处理，但内部没有镀层和阳极氧化。

              认证缺口给 SendCutSend 带来企业采购风险。Xometry 持有 AS9100D（航空航天）、ISO 13485（医疗）、IATF 16949（汽车）、ITAR 和 CMMC Level 2
              认证——这些资质让它能够向受监管主承包商和国防项目销售，而这些场景中，从非认证供应商采购常被合同禁止。相较这一组合，SendCutSend 公开记录中的认证有限，是受监管行业采购的一项反向购买标准。
