      - number: '3.4'
        title: 护城河耐久性、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              SendCutSend
              的竞争护城河建立在五个结构性优势上：（1）自研套料算法把多位客户的板材需求合并排样，即便单件订单也能压低单位成本；（2）自有、位于美国的产能带来可预测的质量，并消除供应商风险；（3）300,000
              客户存量已经体现出复购行为；（4）软件优先的即时报价界面能转化传统加工厂客户，而不是正面争夺企业 RFQ；（5）本土供应和美国钢厂采购契合制造业回流政策顺风，也受益于关税推动的本土内采激励。

              护城河的耐久性风险已经很实质，而且在上升。Xometry 的平台收入以 40% 增长、季度规模达到 $191 million，说明资金充足的竞争者正在数字采购层更快扩张。Siemens/Xometry 合作把
              Xometry 的报价智能直接嵌入 Siemens Xcelerator——这是大型制造商使用的企业产品生命周期管理平台，而这些制造商正是 SendCutSend
              未来想扩张的客群。如果合作继续加深，Xometry 会借助软件锁定效应形成分销护城河；一家自有产能的本土运营商很难复制这种结构。

              认证缺口是不对称风险：SendCutSend 目前无法服务受监管的航空航天、国防或医疗采购，因为这些场景在合同中要求 AS9100D、ITAR 或 ISO
              13485。这些细分市场价格溢价高、留存也高。若不投入认证，SendCutSend 会被结构性排除在一部分高价值企业账户之外，而竞争对手（Xometry、Protolabs）可以拿下这些账户。

              Fictiv/MISUMI 的组合带来相邻威胁：一个统一的物料清单平台，同时覆盖定制制造零件（通过 Fictiv 的网络）和标准机械部件（通过 MISUMI
              目录）。企业采购团队整合供应商关系时，定制加标准的一站式供应商在首选供应商选择中有结构性优势；纯定制平台若不扩展产品线，很难匹配。

              简单原型订单的多平台下单风险较低——工程师投入 30-minute 上传时间，就能把一个订单交给 SendCutSend、OSH Cut 或 Xometry——但企业账户的风险会上升，因为 ERP 集成、框架
              PO 和专属客户关系会产生粘性。SendCutSend 的企业功能（net-30 账期、多用户组织账户、框架 PO、专属代表）在账户层面降低多供应商并用风险，但无法形成 Siemens/Xometry
              合作试图建立的 ERP 级软件锁定效应。95% 的制造业领导者认为 AI 是未来成功的必备条件，说明供应商选择会越来越取决于平台智能，而不只是速度或价格；缺乏深度 AI
              投入的自有产能平台，相比能从多元供应商高订单量中积累网络效应数据的平台模式，会处于劣势。
