      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 制造业回流和 AI 硬件是结构性顺风，不是周期性顺风
            body: >-
              已承诺的 $1.667T 美国制造业投资，以及全球在建 47,000 MW
              新数据中心容量，代表的是多年期、资本已承诺的需求曲线，而不是周期性库存补货。每座进入生产爬坡的新本土工厂都会产生原型和低批量定制零件需求；美国本土按需平台比离岸替代方案更有条件快速满足。对 SendCutSend
              来说，AI 硬件建设尤其会带来来自数据中心客户的高价值经常性收入流：随着每一代 AI 加速器推动机架设计演进，客户需要快速周期内的定制机箱和冷却硬件。
            calloutType: insight
            claimRefs:
              - CM020
              - CM023
              - CM026
          - type: callout
            title: 没有独立子细分 TAM，造成估值不确定性
            body: >-
              缺少一份已发布的第三方 TAM 来单独界定美国按需数字定制钣金子细分，迫使投资人依赖公司说法和竞争对手代理指标来做市场规模判断。这带来估值风险：SendCutSend 的 $1.01B
              估值隐含地按一个巨大且快速增长的市场定价，但公开分析师数据无法验证这个市场的规模和增长率。Protolabs（收入增长 +6.4%）与
              Xometry（+40%）给出相互矛盾的信号，说明市场并非整体高增长；驱动分化结果的也不只是市场扩张，还有平台差异化。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM035
          - type: callout
            title: 客户数量广度不等于收入集中度透明
            body: >-
              SendCutSend 的 300,000 客户和 Fortune 500 渗透说法显示了覆盖广度，但如果没有客户收入集中度、重复订单率或企业收入占比披露，客户基础质量仍不透明。如果前 100
              个企业账户贡献了大部分收入，商业模式就有头部集中风险，而这个风险不会从表面客户数中显现。如果收入均匀分布在 300,000 个账户上，长尾端流失才是主要风险。评估客户基础质量前，必须对队列分析做一手尽调。
            calloutType: assumption
