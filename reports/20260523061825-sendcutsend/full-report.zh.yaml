      - number: '5.3'
        title: 材料目录与规格
        blocks:
          - type: paragraph
            body: >-
              材料目录覆盖金属、塑料、复合材料、木材和橡胶，SKU 超过 170 个。金属方面，公司备有铝合金（5052、6061、7075、2024
              T3）、低碳钢（A36、G90）、不锈钢（304、316）、铬钼钢（4130）、特种合金（AR500、1075 blue
              temper）、铜、黄铜和钛。塑料包括聚碳酸酯、亚克力、HDPE、ABS、Delrin、UHMW 等。复合材料和特种材料包括碳纤维、G10、LE phenolic、ACM（铝复合材料）以及橡胶或垫片板材。


              标准即时报价零件尺寸最高 44 × 30 inches（1,117.6 × 762 mm）；定制报价零件可达 56 × 30 inches（1,422.4 × 762
              mm）。材料特定的最小尺寸和厚度范围发布在公开可访问的最小 / 最大尺寸表中。厚度最低从 0.015 inches（1075 Blue Temper Steel）起，部分材料超过 0.500
              inches。每个材料页面都会发布适用切割工艺、公差、切缝估算和二次加工资格。


              材料选择指南帮助客户把材料属性匹配到应用需求——强度、户外适用性、标牌、电导率和热性能。材料属性速查表发布所有塑料材料的关键工程值（拉伸强度、硬度、伸长率、热导率），便于直接比较。如此深度的公开技术数据降低了客户支持负担，也缩短了设计迭代周期，因为工程师不用为多种材料请求报价，就能决定替代材料。
            claimRefs:
              - CE022
              - CE023
              - CE024
              - CE032
      - number: '5.4'
        title: 技术护城河与差异化
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的持久竞争优势建立在三项相互咬合的软件能力上：DFM 引擎、套料算法和企业平台层。三者共同创造出一个传统加工厂若无同等软件投入就无法复制的工作流。


              DFM
              引擎会在每次文件上传时自动触发，早于定价，也早于任何人工审查。它会根据材料厚度下限检查孔径、桥接、折弯半径约束，以及可能在切缝中丢失的细节特征。结果是，传统工厂里会造成昂贵返工和延误的制造错误，在客户浏览器里就被抓出来。CEO
              曾指出，这种自动检查是公司交期效率的主要驱动因素。


              套料算法是单位经济引擎：它把多个客户的形状排到一张材料板上，同时把原材料固定成本分摊到多个订单，使单件订单在经济上可行。这与传统加工厂结构性不同，后者为每位客户单独设置一张板材。该算法由 CTO Jake
              Graham 共同编写，仍属自研专有技术；它既是真正的技术护城河，也带来关键人物集中风险。


              企业平台层增加了多用户组织账户、基于域名的员工自动邀请、组织级 MFA 强制执行、会话超时、密码复杂度政策、符合 NDA 的私密状态、net-30 账期、框架采购订单和专属客户代表。公司公开声称符合 DFARS
              252.204-7012 和 NIST SP 800-171，使其能够服务政府相关和国防承包商客户。个人 NDA 合规可按需提供，客户保留的 IP 受平台 Terms of Service 保护。截至
              August 2025，这些企业功能采用创纪录，也推动公司连续第三年入选 Inc. 5000。


              从竞争差异化看，OSH Cut 拥有 SendCutSend 未公开声称的 ISO 9001:2015 认证。Xometry 通过供应商网络派单，而不是自有生产；Protolabs
              提供即时报价，但材料目录更窄，也没有套料。SendCutSend 的自有生产、软件套料和 170+ 材料组合，目前没有直接同行能在同等价格点和交期下复制。
