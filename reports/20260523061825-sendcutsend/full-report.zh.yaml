      - number: '7.5'
        title: 财务模型风险、缓释因素与投资含义
        blocks:
          - type: paragraph
            body: >-
              财务模型风险很直接：SendCutSend 是一家交易型、非订阅制造商，使用自有产能和融资购置机器。产能利用率上升时，这个组合可以很好；但只要产量摇摆，它就会变得惩罚性很强，因为相比软件或平台撮合模式，
              经常性收入保护更少，固定成本杠杆更高。公司看起来需求强、客户集中度低，这是加分项。仍缺的是达到贷款人级别的可见度：利润率、现金转化、契约余量，以及按站点或服务线拆分的单位经济性。公开材料确实显示出一些缓释逻辑。公司可以转嫁部分大宗商品价格波动，拥有广泛的美国国内需求，并且把扩张支出设计成机器可融资、股权资金覆盖无法抵押项目的结构。对投资者来说，正确姿态不是把这些缓释因素当作风险已解决的证据。它们只是说明，只要管理层能补齐缺失数据，这组风险就可管理。在
              2026 年估值下，风险框架指向由尽调主导的选择性：密切跟踪运营和合规指标，要求融资与质量控制的直接证据，并在缺口关闭前，避免把激进的受监管客户扩张或利润率扩张写进投资模型。
