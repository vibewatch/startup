      - number: '2.5'
        title: 市场约束、风险与证据缺口
        blocks:
          - type: paragraph
            body: >-
              尽管宏观顺风强劲，按需本土加工市场仍面临结构性约束；这些约束会压低增长斜率，也给平台玩家带来执行风险。

              资本密集度是首要运营约束。工业激光切割机（光纤和 CO2）单台成本为 $300,000 到 $1M+；CNC 机加工中心每台再增加
              $100,000–$500,000；粉末喷涂房和阳极氧化线需要数百万美元设施投资。为了匹配需求而扩张产能，需要股权或债务融资，而融资成本与整体利率水平相关。SendCutSend 的 $110M A
              轮部分就是这项约束的资本解法，另有 $250M 承诺用于新设施扩张——但竞争对手同样可以获得增长资本。

              钢、铝及其他进口原材料的关税波动，会给即时报价平台带来结构性的投入成本不确定性。客户在下单时拿到锁定价格后，如果订单到生产之间材料成本上涨，而平台无法传导，利润率就会被挤压。Deloitte
              明确把关税驱动的供应链扰动列为美国本土制造商的一项关键风险。Fictiv 2026 调查显示，98% 的领导者正在主动抵消关税影响——这确认关税风险已是日常运营问题，而不是尾部风险。

              质量保证信任缺口限制企业买方转化。国防和航空航天主承包商在批准供应商进入生产零件之前，通常要求首件检验（FAI）、材料测试报告（MTR）、可追溯文件，以及 AS9100D 或 ITAR 合规。虽然
              SendCutSend 面向这些行业的 Fortune 500
              客户营销，但它的自助式数字工作流为速度而设计，不一定匹配大型主承包商要求的正式准入流程。企业账户从原型批准到生产准入之间的缺口，限制了最高价值买方细分中收入复合增长的速度。

              切换成本在两个方向上都制造惯性。现有区域加工厂关系带有合格供应商档案、NDA、质量协议和历史审计记录，这些都是采购团队已经投入的沉没成本。即使成本和交期优势明确，这些切换成本也会放慢迁移到数字平台的速度。不过，一旦买方把
              SendCutSend 纳入其 AVL，同样的切换成本会反向发挥作用，为平台创造留存。

              两个关键证据缺口削弱了独立市场规模判断。第一，没有第三方研究把按需数字本土钣金加工子细分从更广义定制加工中单独切出，导致 SAM 和 SOM 估算高度不确定。第二，SendCutSend 未披露按订单类型（原型
              vs. 生产）、客户集中度或重复订单率划分的收入结构；没有一手尽调，关键单位经济性无法验证。
            claimRefs:
