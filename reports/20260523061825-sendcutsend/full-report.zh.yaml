          - type: callout
            title: Xometry 的企业渗透压缩 SendCutSend 的领先空间
            body: >-
              Xometry 平台收入增长 40%，拥有 1,864 个年支出 $50K+ 的企业账户（YoY 增长 21%），并集成 Siemens Xcelerator；这些都代表 SendCutSend
              的企业机会面临结构性竞争升级。如果 Siemens 的 1M+ 工业软件用户默认流向 Xometry 报价界面，而 SendCutSend 没有可比的平台嵌入式集成策略，它会在企业 RFQ 工作流里处于渠道劣势。
            calloutType: risk
