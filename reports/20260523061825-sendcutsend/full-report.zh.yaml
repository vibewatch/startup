  - id: FE001
    title: SendCutSend 产品架构——四层堆栈
    type: stack
    layout: wide
    summary: 从面向客户的工具到底层国内制造执行的平台架构，展示四个互相咬合的能力层。
    data:
      layers:
        - label: 客户平台层
          detail: 基于浏览器的即时报价和即时购买界面，支持 20+ CAD 格式。包括保存购物车、报价分享、零件预览工具、模板库和材料选择指南。
          items:
            - 即时报价引擎（DXF、DWG、AI、EPS、STP、STEP、SLDPRT、CATPART 及另外 12+ 格式）
            - 零件预览 + 测量工具
            - Saved Carts（可分享多零件购物车）
            - 模板库（免费镂空 / 阳文字体包）
            - 材料选择指南 + 属性速查表
        - label: 订单智能层
          detail: 自研 DFM 引擎和多客户套料算法负责校验设计、生成准确即时报价，并在同时处理的客户订单之间优化板材利用率。企业功能位于这一层。
          items:
            - DFM 引擎——投产前设计校验（孔径、切缝、折弯半径）
            - 套料算法——多客户板材排样，提高材料效率
            - 定价引擎——按几何 × 材料 × 数量实时出价
            - 企业组织管理（net-30、总括 PO、MFA 强制、盲发票）
            - NDA / DFARS / NIST SP 800-171 合规层
        - label: 制造执行层
          detail: 五个国内生产设施（NV、KY、TX）24/7 运转，多工艺设备群覆盖 170+ 材料的切割、成形、五金和表面处理。
          items:
            - 光纤激光切割（4–12 kW 机队；±0.005″；最高 2,500 ipm）
            - 水刀切割（石榴石磨料；±0.009″；无热影响区）
            - CNC 雕刻（±0.005″；1/8″ 刀头；仅 2D）
            - CNC 加工（3D 整料；多轴）
            - 折弯 / 成形（8 种金属；±1°；最高 44 × 30″）
            - 五金压装（攻牙、沉头孔、PEM、压窝）
            - 表面处理（阳极、电镀、粉末喷涂、滚磨、去毛刺）
        - label: 供应与物流层
          detail: 美国轧厂来源原材料、国内生产和承运商集成配送。安全和数据保护政策锚定数据流。
          items:
            - 美国轧厂原材料采购（170+ 材料 SKU）
            - 多承运商配送集成（美国订单满 $39 免运费；支持加拿大配送）
            - IP 保护：客户保留 100% 设计 IP；不与第三方分享
            - 服务延误透明化（公布维护和假日扰动）
    approximationNotes: 层级名称由公开产品和安全文档推断。内部 ERP、云服务商和软件基础设施未公开披露。
    claimRefs:
