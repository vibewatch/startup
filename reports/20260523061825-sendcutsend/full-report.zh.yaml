        - 明显收紧，或无法为新设备融资
        - 重设增长模型；因产能扩张放慢下调估值
      - - 服务可靠性
        - 五天发货率；重做 / 退款率；加急积压
        - 准时发货率持续低于 85%，或重做量上升
        - 在修复前，把速度护城河视为失效
      - - 受监管客户资质
        - ITAR / ISO / AS9100 证据请求
        - 关键企业 / 国防交易因缺少认证而停滞
        - 下调企业扩张假设，并推迟投资决策
      - - 领导层集中
        - 创始人 / CTO 留任和授权管理深度
        - 创始人或核心软件负责人离职，且 30 天内没有可信继任者
        - 升级到投资逻辑复盘；暂停新增资本承诺
      - - 利润率 / 营运资本可见度
        - 毛利率、烧钱速度、债务条款、设施经济性
        - 管理层在尽调中不愿提供经审计或银行级指标
        - 在当前价格下从观察转为回避，因为仍无法完成投资测算
    notes: 这些否决条件面向评估 2026 年价格下新资金敞口的投资人，不适用于被动历史复盘。
    claimRefs:
      - CR020
      - CR021
      - CR025
      - CR039
      - CR040
      - CR042
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 含义
    rows:
      - - 建议
        - 观察
        - 不要按当前价格追投新资金；更深入尽调或更好入场点出现后再重启
      - - 置信度
        - 中
        - 公开证据支撑业务；投资测算所需的关键财务细节仍未公开
      - - 风险评级
        - 高
        - 资本开支、合规、融资和披露缺口都很重大
      - - 估值立场
        - 偏高
        - 当前价格要求投资人在审计证明和股权结构清晰前先支付溢价
      - - 最可能退出路径
        - 战略并购比近期 IPO 更可能
        - 工业买家比公开市场更能消化协同效应和尽调不透明
    notes: 建议明确受价格约束，不是笼统的质量判断。
    claimRefs:
