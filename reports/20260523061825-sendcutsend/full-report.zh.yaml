  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险图谱
        blocks:
          - type: paragraph
            body: >-
              SendCutSend
              最稳的地方，正是客户、需求广度和经营动能最强的地方：单一客户集中度低，公开增长信号强，服务承诺清晰。核心投资担忧不是有没有需求，而是一个资本开支重、依赖速度的制造平台，能否继续扩张且不在融资、正常运行时间、合规或领导层深度上暴露隐藏断点。剩余风险最高的四处是：第一，敏感设计文件的网络安全和受监管客户资质；第二，自有产能模式下设备和设施可靠性；第三，机器增长依赖贷款人支持的融资；第四，创始人与软件负责人集中。这些风险今天还没有推翻投资逻辑，但意味着
              2026 年价格应更像一个具备显著经营杠杆的工业平台来承销，而不是按低资本开支 SaaS 来承销。
