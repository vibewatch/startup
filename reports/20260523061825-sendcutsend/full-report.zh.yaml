      - CV036
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 路径
    rows:
      - - 经审计财务
        - 损益表、资产负债表、现金流量表、收入桥接
        - 验证核心收入和盈利叙事
        - 管理层 / 审计师数据室
      - - 按服务线拆分毛利率
        - 激光、CNC、表面处理、加急服务组合经济性
        - 判断单位经济性能否支撑溢价估值
        - 财务团队
      - - JPMorgan 债务包
        - 未偿余额、契约、到期日、抵押品
        - 稀释和扩张风险建模的关键输入
        - CFO / 贷款方摘要
      - - 股权结构和优先权
        - Series A 条款、清算顺位、反稀释、董事会权利
        - 没有它，回报建模不完整
        - 法务 / 财务
      - - 企业合规包
        - DFARS 范围、ITAR 状态、认证、网络安全审计
        - 承销受监管客户上行需要该材料
        - 安全 / 法务 / 销售
      - - 工厂 KPI 包
        - 开工率、报废、返工、延期发货、劳动力流失
        - 检验服务护城河是否真实且可扩展
        - 运营
    notes: 缺少这些项目时，建议应停留在跟踪或继续研究，而不是投资。
