      - number: '4.2'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的单位经济由套料算法定义：公司把多个客户订单聚合到同一张原材料板材上，每个生产批次几乎能充分利用材料，相比单客户加工厂压低了单位设置成本和材料浪费。这就是其声称价格优势的结构性来源。

              设备是最主要的资本成本。公司运营 13 台光纤激光切割机，每台约 $1.3 million（激光设备资本合计约 $16.9M），另有多台 CNC 铣床，每台约 $1 million，全部通过 JPMorgan
              Chase 以抵押设备贷款融资。这意味着主要资本开支不在股权资产负债表上——并不来自 $110M 机构轮。人工成本围绕通用型一线工人组织：操作员起薪 $26–$30 /
              hour，并被要求在同一班次覆盖多个角色（激光操作员、叉车司机、CAD 程序员）。公司在全部五处设施实行四班倒、全天候运转。管理层估计，截至 January 2026 员工数为 410；$110M
              融资计划包括再招聘 200–300 名生产员工，并把软件工程团队扩大到三倍。

              毛利率没有公开披露。公司声称八年运营历史中一直盈利，但没有发布经审计的 P&L。硬件密集型数字制造行业基准可作参照：Protolabs FY2025 收入 $533M，Adj EBITDA margin 为
              14.7%；Xometry 平台业务在 Q1 2026 达到 38.3% 毛利率（不过 Xometry 是平台中介，不是制造商）。完全自有制造业务扣除间接费用前的毛利率可能在 35–50% 区间（仅材料 +
              直接人工），一旦计入场地成本、自有设备折旧（若有未租赁设备）和一般及行政费用（G&A），EBITDA margin 会被压低。

              场地成本很高：SendCutSend 在五个地点运营近 250,000 square feet，其中 Reno 一地就有 130,000 sq ft。新大型建筑的场地押金约 $600,000 /
              处（首月和末月合计）。地理扩张计划——下一站 Pennsylvania 或 Ohio，随后 Indiana、Las Vegas 和
              Atlanta——需要大量额外场地押金和装修成本，而这些都无法作为抵押设备债务融资。

              客户集中度极低。收入最高的客户只占总收入 0.59%，意味着在 $200M 收入基数下，最大客户年收入约 $1.18M。这是非常突出的分散化画像，几乎完全消除了单一客户收入集中风险。
