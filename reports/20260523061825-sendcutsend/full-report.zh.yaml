        - label: 多年下单证据
          values:
            - 高 — Timwelds（Aug 2020）、Mike Hansen（50+ 笔订单）
            - 中 — NiteOwl、Teale（18 个月记录）
            - 低 — 提到组织账户；没有留存年限数据
            - 无 — 未发布具名企业客户留存年限数据
        - label: 复购机制
          values:
            - 中 — 易于再次下单；摩擦低；无需设置账户
            - 中 — 批量折扣激励规模化复购
            - 高 — 可用总括 PO、排期生产、组织账户
            - 高 — 专属销售；net-30；总括 PO；排期生产
        - label: 切换成本 / 锁定效应
          values:
            - 低 — 不依赖账户；文件可迁移
            - 低-中 — 订单历史；设计文件库
            - 中 — 组织账户接入工作流；多用户历史
            - 中 — 嵌入采购工作流；PO 到发票周期
        - label: 净留存率（NRR）/ 总留存率（GRR）
          values:
            - 未披露
            - 未披露
            - 未披露
            - 未披露
        - label: 客户满意度信号
          values:
            - 高 — Trustindex 接近 5.0；速度和质量主题一致
            - 中 — 有客户证言；大多由公司筛选
            - 低 — 没有系统数据；从企业博客推断
            - 无 — 没有具名客户访谈或 NPS 数据
    approximationNotes: 所有信号都是定性代理指标；公司未披露经审计的 NRR、GRR 或队列留存数据。评级（无 / 低 / 中 / 高）反映证据的具体程度、独立性和时效性。
