      - number: '6.4'
        title: 客户工作流、留存与扩张信号
        blocks:
          - type: paragraph
            body: >-
              平台设计里嵌入了几类结构性粘性机制。即时报价、上传即下单流程同时降低新买家和复购买家的摩擦——标准订单不需要建账户、RFQ 或人工报价沟通。DFM
              引擎检查每个上传文件，在投产前抓出设计错误，形成质量护栏，减少返工周期，也在连续下单中累积信任。企业账户侧，多用户组织账户让同一家公司把多名工程师或采购员纳入一个账户，并集中管理订单历史；一旦采购流程围绕 SCS
              界面标准化，这个集成点就会抬高切换成本。


              商业账户可以使用总括采购订单和排期复产批次，供应链团队不用逐单重新报价，也能规划产能。Net-30 账期让按标准应付账款周期运作的大公司采购团队能够使用
              SCS。专属客户经理服务高量商业客户，在自助平台之外增加一层关系，强化留存。一键报价分享功能让工程团队可以在内部流转报价并拿到审批，把 SCS 嵌入从工程到审批的采购工作流，而不是要求采购官从头发起订单。


              公司没有披露公开可得的 NRR、GRR 或队列留存数据。最接近复购信号的代理指标是博客推荐语和评论，其中数条描述了多年下单关系和高下单频率。一位评论者（Trustindex，2026 年）明确表示多年下了 50+
              个订单，没有服务失败。不过，这些样本来自自我选择的满意客户；系统性流失数据不可得。公司收入快速增长（同比 80%）大体指向净收入扩张，但没有队列数据，就无法拆分新客获取和同客扩张，也无法计算正式 NRR。
