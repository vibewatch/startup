          - type: callout
            title: Fast Radius 是警示性可比案例
            body: >-
              Fast Radius 原计划通过 SPAC 融资 $300–445M，但股东赎回率达到 91%，最终只拿到 $106M；尽管已经生产 15M+ 零件、覆盖 150,000+ 设计，公司仍在 2022
              破产。失败说明，当认证、供应商管理和企业销售周期消耗现金时，数字制造的资本强度会比收入扩张更快。SendCutSend 在 May 2026
              机构融资前已经自力更生实现盈利，因此不同于这一失败模式——但教训仍然是，资本充足度是该类别的首要生存变量。
