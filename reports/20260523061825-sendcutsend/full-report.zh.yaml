      - number: '4.6'
        title: 图表
        blocks:
          - type: callout
            title: 极低客户集中度消除集中风险
            body: >-
              在 $200M 收入基数下，收入最高客户仅占总收入 0.59%，意味着没有任何客户年收入超过约 $1.2M。对一家 $200M 收入公司来说，这是异常低的集中度画像，并显著降低单一客户收入风险。300,000+
              客户基础也为需求预测、定价优化和生产计划提供大量数据——规模越大，信息优势越会复利。
            calloutType: strength
            claimRefs:
              - CI037
              - CI038
          - type: callout
            title: $200M 收入下近零营销支出是结构性护城河信号
            body: >-
              Google Ads 月支出约 $1,500，却产生 $200M
              年收入，意味着有机需求拉动效率极高。这符合一个平台成为特定任务（即时定制制造）默认解决方案后的表现，也说明口碑、搜索意图捕获和复购经济性都很强。近零 CAC 是硬件制造中最可辩护的营销护城河。
            calloutType: strength
            claimRefs:
              - CI008
              - CI002
          - type: callout
            title: 地理扩张会让资本强度非线性上升
            body: >-
              每个新制造地点都需要场地押金（约 $600K）、装修、设备（单独融资但会增加总债务服务）以及 40–80+ 名新员工，并在 six to twelve months 内爬坡到目标利用率。$250M+
              设施计划意味着可能新增 four to ten 个大型设施。若增长项目延迟，或需求无法立即吸收新增产能，固定成本吸收对利润率的拖累可能很大。Fast Radius 破产为资产重数字制造具体展示了这种风险。
            calloutType: risk
            claimRefs:
              - CI026
              - CI028
              - CI041
              - CI042
          - type: callout
            title: 收入、增长和盈利说法没有独立验证
            body: >-
              所有财务说法——$200M 收入、80% YoY 增长和盈利——都来自公司自身声明或投资人沟通。没有审计，没有 SEC 文件，也没有第三方验证。对承销 $1.01B
              估值的机构投资人来说，这是首要尽调缺口。考虑到可见牵引（300K 客户、50M+ 零件、7-year 运营），这些说法有合理性，但合理不等于已验证。
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
              - CI043
              - CI005
          - type: callout
            title: 首要尽调事项：经审计财务和设备债务明细
            body: >-
              在任何资本承诺前，应要求：（1）最近 three fiscal years 经审计或审阅的财务报表，或至少由 CPA 签署的管理账；（2）完整 JPMorgan 授信协议，包括 covenant
              条款包和全部未偿设备债务明细；（3）Series A 后股权结构表，包含清算优先权和治理权；（4）按服务线拆分的 trailing 12-month P&L；（5）显示复购率和 12-month
              留存的客户队列数据。缺少这五项，$1.01B 估值无法被独立压力测试。
