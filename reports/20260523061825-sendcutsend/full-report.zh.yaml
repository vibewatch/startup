  - id: FM003
    title: 数字采购旅程 —— 传统 RFQ 与按需平台工作流
    type: flow
    layout: wide
    summary: 对比流程展示买家如何从传统加工厂 RFQ 流程转向按需数字制造平台，突出被消除的摩擦以及驱动采用的机制。
    data:
      nodes:
        - id: need
          label: 工程需求识别（需要定制零件）
          detail: 设计工程师或产品团队识别出定制加工零件需求
        - id: traditional-rfq
          label: 传统路径 —— 加工厂 RFQ
          detail: 工程师通过电话或邮件联系 2-4 家区域加工厂；等待 2-5 天拿报价；选择供应商；下单；等待 2-6 周交付
        - id: traditional-friction
          label: 现状摩擦 —— 交期、MOQ、不透明
          detail: 平均交期 2-6 周，最低订单量 25-500 件，不能即时报价，文件沟通靠人工，依赖个人工厂关系
        - id: digital-path
          label: 数字平台路径 —— 即时报价工作流
          detail: 工程师上传 CAD 文件；DFM 校验自动运行；生成即时报价；用信用卡或 PO 下单；零件在 2-4 天内制造并发货
        - id: digital-advantage
          label: 平台优势 —— 速度、透明、无 MOQ
          detail: 91%+ 订单在 5 天或更短时间内发货；提供 48 小时加急服务；即时报价；无最低订单量；实时 DFM 反馈；支持企业 PO 和 net-30
        - id: enterprise-adoption
          label: 企业转化 —— AVL 批准、总括 PO、重复生产
          detail: 企业账户通过多用户组织账户激活；总括采购订单；net-30 条款；专属客户代表；计划性重复生产
        - id: platform-lock
          label: 平台留存 —— 反向累积切换成本
          detail: 质量历史、获批供应商档案状态和设计文件库形成留存；竞争对手替换需要买方采购重新认证
