  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与服务范围定义
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 竞争的是美国按需定制加工市场。本文将其定义为：采购定制工程化金属和非金属零件，批量从 1 件到数万件，通过软件驱动的即时报价与立即购买流程，在美国本土 2 到 5
              个工作日内交付。这个市场位于传统作坊式加工和数字制造撮合平台的交界处：前者依靠人工 RFQ、2–6 周交期和最低起订量，后者通常依赖全球供应网络和更长物流链。SendCutSend
              通过服务目录界定其服务范围：激光切割、水刀切割、CNC 铣削、CNC 机加工、激光管切割、折弯成形，以及粉末喷涂、阳极氧化、镀层等表面处理——全部基于来自美国材料厂的 170 多种金属和非金属材料执行。

              服务市场包含的支出包括定制工程化钣金部件、机加工结构件、原型和预生产批次，以及成品加工五金件的重复生产订单。排除的支出包括大批量冲压和级进模生产（>100,000
              件且使用专用模具）、铝挤压和辊压成形、注塑塑料部件、增材制造（3D 打印）零件、PCB 与 PCBA，以及大型结构焊件（工字梁、结构柱）。这些排除项既反映 SendCutSend
              的产品目录边界，也反映这些类别完全不同的生产经济性。

              主要现状替代方案是区域加工厂——通过电子邮件 RFQ、电话报价和人工排程处理定制订单的 SMB 加工商。区域加工厂主导本地工业生态，但在交期（2–6 周对 2–4
              天）、数字可访问性（没有即时定价）和最低起订量（通常 25–500
              件）上处于结构性劣势。次级替代方案是内部自有加工：以工程为核心的公司自有激光切割机、折弯机或机加工中心，并在内部生产零件。按需数字平台通过消除资本开支和设定复杂度，把这两类替代需求转到平台上。SendCutSend
              尚未覆盖的相邻市场包括增材制造撮合（Fictiv、Xometry）、注塑平台，以及标准机械部件目录（MISUMI、McMaster-Carr）。Fictiv/MISUMI
              的组合尤其说明，竞争对手正在搭建横跨定制件和标准件的统一平台——这会对 SendCutSend 未来范围形成潜在相邻压力。
