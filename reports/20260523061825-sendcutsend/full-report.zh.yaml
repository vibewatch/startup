      - number: '8.5'
        title: 退出准备、尽调要求与推翻投资逻辑触发点
        blocks:
          - type: paragraph
            body: >-
              单看公开证据，SendCutSend 还不明显具备 IPO 准备度。业务最终可能赢得这个选项，但今天看起来更像并购或后期跨界投资
              候选，而不是近期上市公司。战略买家可以为工厂利用率、软件工作流、客户名单和美国国内足迹定价；在没有完整披露时，这些价值很难通过公开市场可比公司表干净表达。因此，最终尽调要求非常重要。投资者需要经审计财务、毛利率细节、贷款人条款、股权结构机制，以及企业与受监管客户上行确实存在的证据。没有这些材料，投资逻辑可以从几处断裂：增长可能放慢而没有利润率耐久性证明；服务质量可能下滑；融资可能收紧；企业扩张也可能比当前叙事暗示的更浅。这些都不是基准情景，但都足够可能，今天就应约束投资流程。
