      - number: '5.5'
        title: 运营模式与质量体系
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 在美国三个州运营五处生产设施：Nevada 州 Reno（总部和主要生产）；Kentucky 州 Paris；以及 Texas 州
              Arlington。地理分布让加急服务在选择加急生产加隔夜配送时，可在 48 hours 内送达美国本土任意地点。截至 2025，设施网络拥有 300 多名员工，生产 24 hours a day、seven
              days a week 运转。


              材料来自美国钢厂，全部生产在美国本土完成。订单通过美国主要承运商发货；超过 $39 的订单免运费。标准交付为 two to four business days。公司提供加拿大运输，生产 2–4
              day，发往加拿大主要城市（Montreal、Vancouver、Calgary、Toronto）的运输时间 2–4 day，税费和关税在结账时收取。


              零件层面的质量通过工艺校准控制：软件会自动应用激光切缝补偿，因此客户可以提交标称尺寸文件，无需手动偏置。CNC 路由会放置并移除连接
              tabs，以防零件在切割中移动，但会留下可能需要手工处理的轻微残留。水刀能提供更好的边缘效果，没有熔渣或毛刺。适用的激光切割材料免费包含去毛刺。


              公司披露，生产设施可能因维护或假日停机，承运商假日也会造成运输空档。这些披露公开发布在服务延误页面上。生产排程没有公开 SLA
              或正常运行时间保证。加急服务可用性取决于订单重量、材料可用性和复杂度，因此加急服务覆盖存在可变上限，客户在设计时无法预先验证。
