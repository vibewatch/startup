        - 材料去除率不能超过 50%；仅限 2D
      - - CNC 加工（坯料）
        - 精密 3D 零件买家
        - GA——公开规格有限
        - 可做出钣金切割无法实现的 3D 特征
        - 服务能力范围未完整记录
      - - 折弯 / 成形
        - 钣金产品设计师
