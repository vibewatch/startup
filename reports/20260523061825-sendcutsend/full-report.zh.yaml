            - 高——集成 DFM + 报价 + 组织管理
            - 高——2025 年 8 月企业采用创纪录；渗透 Fortune 500
            - 低——多年部署；功能成熟
        - label: DFM + 套料软件核心
          values:
            - 中高——多处官方提及；没有代码或架构披露
            - 高——自研；同行未在相同广度复制
            - 高——驱动全部 50M+ 零件；核心生产效率
            - 中——关键人风险（CTO）；黑箱；未确认专利保护
    approximationNotes: >-
      成熟度评级是作者基于截至 2026 年 5 月公开证据作出的定性评估。高 / 中 / 低评级相对于 SendCutSend 产品组合，而不是绝对行业基准。单个服务线的出货量未公开披露；规模评级从公司整体指标（50M+
