  - id: FI001
    title: 收入模型桥接——从客户动作到收入确认
    type: flow
    layout: standard
    summary: SendCutSend 的客户动作如何转化为已确认收入，展示模型的算法化、自助式本质，以及套料引擎在哪里创造单位经济优势。
    data:
      nodes:
        - id: customer-upload
          label: 客户上传 CAD 文件
          detail: 通过网页平台提交 DXF、DWG、AI、EPS、STP 或 STEP 文件。客户指定材料、厚度、数量和后处理选项。
        - id: dfm-engine
          label: DFM 引擎校验文件
          detail: 自动化可制造性设计引擎在定价前标记潜在问题（如最小折弯半径、特征尺寸），降低返工和支持成本。
        - id: nesting-quote
          label: 套料算法给订单定价
          detail: 自研套料算法把客户形状与其他客户订单一起排到共享板材上，计算最优材料利用率。价格来自材料成本、切割时间、二次工序和数量折扣。
        - id: buy-now
          label: 客户下即时购买订单
          detail: 客户选择标准（2–4 天）或加急（< 48 小时）交付。企业客户可使用 net-30 账期或总括 PO。没有最低起订量。
        - id: production-queue
          label: 订单进入生产队列
          detail: 订单排入下一轮可用生产。多客户套料让板材利用率接近满载，把材料成本分摊到多个客户。
        - id: manufacturing
          label: 制造与二次工序
          detail: 执行激光切割 / 水刀 / CNC 加工。适用订单叠加二次工序（折弯、五金压装、表面处理）。24/7 四班制运营。
        - id: qc-ship
          label: 质检、包装并发货
          detail: 零件检验、包装后交承运商。标准服务下，91% 订单在下单后 5 天内发货。
        - id: revenue
          label: 发货时确认收入
          detail: 收入在发货时点确认。无递延收入、无订阅、无最低合同。纯交易模式；公司称年收入约 $200M。
    approximationNotes: 流程代表基于已观察平台行为和公司表述梳理出的逻辑顺序。时间间隔（如 DFM 响应时间、队列等待）未公开披露。
    claimRefs:
      - CI004
      - CI006
      - CI009
      - CI002
  - id: FI002
    title: 单位经济桥接——订单价值拆解（估算）
    type: flow
    layout: standard
    summary: 将一个代表性订单价值拆成估算成本项，展示套料算法在哪里创造结构性利润率优势。所有成本拆分都是基于上市公司基准推导的分析估算；没有可用的公司实际数据。
    data:
      nodes:
        - id: order-value
          label: 客户订单价值（100%）
          detail: 标价由套料算法设定；结账时应用批量折扣。平均订单价值未披露；从单件原型到数千件量产批次的组合，让分布很宽。
        - id: raw-material
          label: 原材料成本（估算 20–35%）
          detail: 由材料类型、厚度和套料效率驱动。套料算法跨多个客户订单最大化板材利用率，降低单件材料浪费。15% 铝材来自离岸采购；据 Belosic 称，15–20% 大宗商品价格波动会带来约 3–4% 客户价格影响。
        - id: direct-labor
          label: 直接人工成本（估算 15–25%）
          detail: 一线操作员时薪 $26–$30，采用通才模型，覆盖切割、折弯和表面处理。四班 24/7 运转；可能产生加班。2026 年 1 月员工 410 人；计划新增 200–300 人。
        - id: facility-equipment
          label: 厂房与设备成本（估算 10–20%）
          detail: 5 处设施合计近 250,000 平方英尺。设备通过 JPMorgan Chase 融资（债务服务，不是自有资产折旧）。厂房租赁成本未列明。能源成本（激光切割机耗电高）未披露。
        - id: gross-profit
          label: 估算毛利（估算 30–50%）
          detail: 公司称整个运营历史均实现盈利，但未披露毛利率。区间来自 Protolabs（14.7% 调整后 EBITDA）和典型制造业利润率。相较传统加工车间，套料效率应把利润率推向区间上沿。
    approximationNotes: 所有百分比都是基于可比上市公司（Protolabs、Xometry）、制造业基准和公司访谈中披露的成本数据点做出的分析估算。没有任何实际 SendCutSend 成本数据经过独立核验。缺少公司直接披露前，不应把这些估算用于承销。
    claimRefs:
      - CI011
      - CI014
      - CI018
      - CI019
      - CI020
      - CI034
  - id: FI003
    title: 关键财务指标区间——有来源支撑的边界
    type: range
    layout: standard
    summary: 收入、估值、增长和利润率估算给出上下限，依据公司已陈述事实、上市公司基准和分析估算推导。区间反映未核验私营公司指标的不确定性。
    data:
      items:
        - label: 年化收入（2026 年口径）
          low: 180
          high: 220
          unit: USD M
          detail: 公司在 Series A 公告（2026 年 5 月）中称为 $200M；下限反映可能夸大或收入确认时点不确定；上限反映若 80% 同比增长轨迹从 2025 年 10 月 $100M 里程碑继续，实际数字可能更高。
        - label: 隐含收入倍数（EV / Revenue）
          low: 4.6
          high: 5.6
          unit: x
          detail: 基于 $1.01B 投后估值除以 $180M–$220M 收入区间。Xometry 作为市场平台（不是制造资产所有者）交易倍数更低；Protolabs 因增速较慢倍数更低。SendCutSend 倍数体现增长溢价。
        - label: 毛利率（估算）
          low: 30
          high: 50
          unit: pct
          detail: >-
            下限：自有产能加工通常有较高人工和厂房开销。上限：满载利用时，套料效率接近市场平台经济性。Protolabs 调整后 EBITDA 14.7% 暗示毛利率高于 30%；Xometry 市场平台毛利率 38.3%
            为高效数字化模型提供上限参照。
        - label: 调整后 EBITDA 利润率（估算）
          low: 8
          high: 18
          unit: pct
          detail: >-
            下限：Xometry 2026 年 Q1 约 5.1% 调整后 EBITDA 利润率（但 Xometry 仍在扩张）。上限：Protolabs FY2025 成熟混合模式下的
            14.7%。公司称已盈利；考虑低营销投入和高收入增长，利润率可能超过 Protolabs 水平。
        - label: 未偿设备债务总额（估算）
          low: 18
          high: 35
          unit: USD M
          detail: 下限：约 13 台激光切割机 × 每台 $1.3M = 约 $16.9M，假设设备较新且偿还很少。上限：包括 CNC 铣床和早期设备滚续融资。所有设备均通过 JPMorgan Chase 设备贷款融资。
    approximationNotes: 收入和利润率区间为作者基于已陈述数据点和上市公司基准做出的估算。设备债务区间由单价和机器数量估算。这些数字均未经过独立审计，也未由公司披露。
    claimRefs:
