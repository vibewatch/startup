      - number: '7.2'
        title: 监管、法律与产品责任敞口
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，SendCutSend 至少已经迈出国防级文件处理的第一步：其信息安全页面明确声明符合 DFARS 252.204-7012 和 NIST SP
              800-171。国防和航空航天客户是商业叙事中被点名的部分，因此这一点重要。但 DFARS / NIST 文件处理与完整受监管供应商资质之间仍有实质距离。未找到公开 ITAR 注册证明，公司也未公开展示
              AS9100、ISO 9001 或大型航空航天 / 国防买家常要求的类似证书。围绕设计文件上传的法律安排同样关键。条款和隐私文件明确，客户需对上传设计拥有权利；SendCutSend
              保留取消侵犯版权或非法提交内容的权利，并限制下游使用担保。这降低了平台滥用风险，但当制造零件用于机器人、交通运输、航空航天或其他敏感环境时，产品责任敞口并未消失。已审阅公开来源未显示已确认的执法行动、诉讼或召回，但可搜索信息面不够完整，投资者应把没有诉讼记录当作尽调项，而不是健康证明。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR027
              - CR029
      - number: '7.3'
        title: 运营、质量、物流与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营上，SendCutSend 卖的是承诺。客户买的是即时报价、无最低起订量，以及通常几天内发货的零件。因此，正常运行时间、队列纪律和质控经济性异常重要。NNBW 描述的生产系统围绕十三台光纤激光机、多台机器人
              CNC 机器、24/7 运营节奏，以及仍以 Reno
              为重心、支撑更广泛五设施网络的足迹搭建。它带来规模，也集中执行风险：设备、表面处理、公用设施、劳动力或软件任何环节宕机，都可能迅速打到客户体验，因为整个收入模型按订单一单单周转。公司扩展到阳极氧化和粉末喷涂，增加服务深度和钱包份额，但也比单纯切割引入更多环境、健康与安全（EHS）、流程控制和返工风险。网络安全也落在同一运营桶里，因为报价平台和上传设计文件库本身就是生产系统的一部分。SendCutSend
              公开合规说法方向上为正，但未找到公开第三方网络安全审计、事件报告、正常运行时间历史、报废率披露或重制率披露。因此，投资者需要把运营质量风险视为承销缺口，而不只是常规制造问题。
