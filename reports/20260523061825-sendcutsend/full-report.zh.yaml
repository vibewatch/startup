  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与直接平台同业
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的主要竞争环境分为五类：（1）以 Xometry 为代表的全球 AI 原生市场平台；（2）以 Protolabs 为代表的自有工厂加网络混合服务；（3）包括 Fictiv（现为
              MISUMI 旗下）在内的全球外包网络供应商；（4）OSH Cut 等美国本土直接数字竞争者；以及（5）区域加工厂这个传统现状路径，它仍是大量工业买方的默认采购方式。

              Xometry（NASDAQ: XMTR）是财务规模最重要的直接竞争对手。它的 AI 原生全球市场平台把买方与认证供应商网络连接起来，而不是自持生产资产。2026 年 Q1，Xometry 报告总收入
              $205M，同比增长 36%；市场平台收入达到 $191M，同比增长 40%。截至 2026 年 3 月 31 日，平台有 85,581 名市场活跃买家，较一年前的 71,454 增长
              20%；过去十二个月消费至少 $50,000 的账户同比增长 21%，达到 1,864 个。Xometry 拥有广泛认证组合，包括 ISO 9001:2015、ISO
              13485:2016、AS9100D、IATF 16949:2016、ITAR 注册和 CMMC Level 2——这些资质打开了受监管的航空航天、国防和医疗采购类别，而 SendCutSend
              在这些领域的认证覆盖记录有限。2026 年 Q1，Xometry 宣布与 Siemens 建立战略合作；Siemens 购买约 $50M 的 Xometry A 类普通股，并将 Xometry
              的定价和可制造性智能嵌入 Siemens Xcelerator 平台。

              Protolabs（NYSE: PRLB）是一家上市混合平台，把自有工厂与 Protolabs Network（原 Hubs）结合，用网络完成外采订单。2025 财年收入为 $533.1M（同比增长
              6.4%），其中工厂收入 $416.9M，网络收入 $116.2M。调整后 EBITDA 为 $78.1M（利润率 14.7%）——这展示了规模化后可达到的单位经济性；不过 Protolabs 相比
              Xometry 增速更慢，也说明装机基础趋于成熟或竞争压力正在上升。Protolabs 对 2026 财年给出的收入增长指引为 6–8%。

              Protolabs Network（原 Hubs，www.hubs.com）服务那些几何形状更复杂或公差更严格、工厂难以高效承接的订单。它用机器学习算法，把上传的 CAD
              文件与数百万个既往制造零件进行比较，从而生成即时报价。Hubs 的 CNC 机加工交期从 5 个工作日开始——长于 SendCutSend 标准的 2–4 天——且该服务无法匹配 SendCutSend
              内部表面处理选项的宽度。

              Fictiv 被日本制造商 MISUMI Group 以 $350M 收购（2025 年 4 月宣布，2025 年 6 月完成），运营一个横跨四个区域的全球制造网络：印度、墨西哥、中国和美国。Fictiv
              已生产超过 35M 个定制和原型零件。MISUMI 本身通过 22 个制造基地和 20 个物流枢纽，向全球超过 323,000 家公司供应部件。Fictiv/MISUMI
              合并后的平台，为定制制造零件和标准机械部件提供统一寻源入口——这是 SendCutSend 今天尚未服务的竞争相邻面。

              OSH Cut（oshcut.com）是与 SendCutSend 结构最接近的类比对象：它是一家通过 ISO 9001:2015 认证的直接激光切割服务商，提供即时定价、自动化 DFM
              反馈、套料报价，以及结账时自动应用的批量折扣。OSH Cut 标准交期为 2 个工作日，符合条件的作业可选择当天或次日交付。不过 OSH Cut 只发往美国和加拿大，表面处理或机加工服务宽度不及
              SendCutSend，相比 SendCutSend 的 300,000 客户装机基础和五处生产设施也仍处于较小规模。

              传统现状路径——区域加工厂——在许多美国工业市场仍是主导采购渠道。这些运营商通过电子邮件 RFQ、电话报价和人工排程接受定制订单，交期通常为 2–6 周，而 SendCutSend 标准为 2–4
              天。新订单从区域加工厂切换到数字平台的成本相对较低，但在受监管行业里，既有供应商关系的切换成本更高。
