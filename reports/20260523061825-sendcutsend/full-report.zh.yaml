      - number: '8.4'
        title: 乐观、基准与悲观结果
        blocks:
          - type: paragraph
            body: >-
              这里适合用情景分析，因为公开数据太薄，不足以支撑伪精确。乐观情景下，SendCutSend 到 2028 年复合增长至约 $500M 收入，保住增长溢价支撑，并以约 5x 至 6x 收入退出。结果约为 $2.5B
              至 $3.0B，有吸引力，但仍远不是风投式无限上行。基准情景下，公司继续增长，但估值重定到成熟制造业倍数，到 2028 年价值接近 $1.05B 至 $1.2B，只比当前价格略高。悲观情景下，增长降温至约
              30%，公开市场情绪转弱，倍数压缩到 2.5x 至 3.0x，价值落在约 $600M 至 $750M 区间。信息很直接：今天这一轮仍有上行，但相对未解决的尽调堆栈，上行不够大，难以支持买入式立场。
            claimRefs:
