    rows:
      - - 光纤激光切割
        - 工程师、加工商、产品设计师
        - GA——核心服务；量最大
        - 4–12 kW 机队；2,500 ipm；±0.005″ 公差；自动割缝补偿
        - 专有设备组合和板材利用率无法审计
      - - 水刀切割
        - 航空航天、复合材料、热敏材料用户
        - GA——在复合材料上形成差异
        - 无 HAZ；边缘光洁度更高；可切割碳纤维、G10、酚醛材料
