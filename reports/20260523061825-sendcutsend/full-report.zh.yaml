  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与收入来源
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 采用纯交易型收入模式：客户上传 CAD 文件，获得算法即时报价，然后直接下单购买。没有订阅，没有经常性 SaaS
              费用，也没有最低订单量。收入确认很直接——制造零件发货即确认销售收入——不存在递延收入或多要素安排的复杂性。该模式与 Xometry 这类平台中介（赚取买家价格与供应商成本之间的抽成价差）不同，也不同于
              Protolabs（自有工厂制造和网络转售模式混合）。

              公司通过八个主要服务类别变现：激光切割、水刀切割、CNC 路由、CNC
              加工（铣削）、激光管切割、折弯与成形、五金嵌件与二次加工，以及表面处理（粉末涂层、阳极氧化、镀锌和镀镍）。每个订单由套料算法根据材料类型、几何形状、切割时间、表面处理规格和数量定价。数量折扣会在结账时自动递增。符合条件的订单可以加价使用加急生产，48
              hours 内交付，并分为两个服务层级（Fast 和 Fastest）。

              企业层级提供 net-30 账期、多用户组织账户、框架采购订单和专属客户管理。企业采用率一直在增长：SendCutSend 连续三年入选 Inc. 5000，2025 排名 #511，并服务超过半数
              Fortune 500，客户覆盖航空航天、国防、数据中心基础设施、机器人和航天。尽管企业端已有牵引，平台从未需要传统外呼销售团队；在 January 2026 NNBW 采访时，公司报告 Google Ads
              月营销支出约 $1,500，高于创立时的约 $100 / 月。这是非常强的营销效率信号：以几乎可以忽略的付费获客成本做到约 $200M 年收入。

              所有收入都来自美国本土。SendCutSend 约 85% 的铝材来自美国钢厂（15%
              来自海外），全部生产也在美国完成——这在当前制造业回流环境下是结构性优势，也让成品层面免受跨境运输和关税不确定性影响。主要关税敞口是原铝；公司估计，商品价格 15–20% 的波动只会传导为客户价格 3–4%
              的影响，因为原材料只占最终订单价值的一小部分。
