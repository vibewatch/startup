      - number: '5.2'
        title: 制造工艺广度
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 运营三种主要 2D 切割技术——光纤激光、水刀和 CNC 路由——另有用于 3D 坯料加工的 CNC
              加工，以及一整套二次加工。平台会为每种材料自动分配最优切割工艺；客户选择材料，而不是机器。


              激光切割是最快、最经济的工艺，使用 4 kW 到 12 kW 的高功率光纤激光器，并配有一组 CO2 激光器。简单几何形状的切割速度可达 2,500 inches per minute。光纤激光公差为
              ±0.005 inches。孔和切口至少要达到材料厚度的 30 percent。较厚材料上可能出现热影响区（HAZ），但光束直径和切割速度会降低这一影响；公司对适用材料免费包含去毛刺。


              水刀切割使用高压水混合石榴石磨料，不产生 HAZ——这也是碳纤维、G10、LE phenolic 等复合材料只能用水刀切割的主要原因。水刀公差为 ±0.009 inches。受射流宽度影响，内角需要最小半径
              0.032 inches，孔需要最小直径 0.070 inches。边缘效果更好，没有熔渣，但切割速度显著慢于激光。


              CNC 路由用 1/8-inch 硬质合金刀头达到 ±0.005 inch 公差。它擅长加工塑料、木材和复合材料，但不能做螺纹、沉孔、3D 轮廓或 V 形槽；所有内角半径必须 ≥0.063-inch。材料去除超过
              50 percent 的零件（格栅、栅板）存在被拒风险，更适合激光切割。坯料 CNC 加工可处理 2D 板材切割工艺无法完成的 3D 特征。


              二次加工——折弯、五金嵌件和表面处理——可在同一订单结账中作为附加项选择。折弯支持八种金属，最高 0.250-inch 厚、44 × 30-inch 平面尺寸，精度可控制在 one degree
              以内。五金嵌件涵盖攻牙、沉孔、凹坑成形和 PEM 螺母压装。表面处理选项包括 Class II 阳极氧化（五种颜色）、镀锌和镀镍、粉末涂层（十一种颜色）、滚筒抛光和去毛刺。
