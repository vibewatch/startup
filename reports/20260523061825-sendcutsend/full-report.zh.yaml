      - number: '6.5'
        title: 集中度风险、信任信号与反向背景
        blocks:
          - type: paragraph
            body: >-
              对一家成长期公司来说，SendCutSend 披露的客户集中度异常低：CEO Belosic 在 NNBW 访谈中确认，收入最高的单一客户只占总收入 0.59%。按年收入约 $200M 计算，最大客户每年贡献约
              $1.18M，显示收入结构长尾，几乎没有单一客户依赖。这对投资者风险是结构性利好，也符合 Belosic 对客户基础「非常、非常多元」的描述。Fortune 500
              公司分布在多个行业，也进一步分散风险；没有单一行业垂直领域看起来占据主导。


              独立来源给出的信任信号总体为正。ScamAdviser 将该网站评为「极可能不是诈骗，而是合法可靠」，理由包括域名已有 11 年、高 Tranco 排名（前 20）和正面评论。Trustindex 聚合的
              Google 评论接近 5.0，主题稳定围绕速度、质量和服务响应。不过，两个反向维度值得注意。第一，SCS
              网站上的所有客户推荐语都由公司筛选，且样本自选；平台只发布正面故事。总体满意率、投诉频率或订单争议率没有披露。第二，对航空航天、国防、太空等受监管行业的企业客户来说，合规认证往往是采购门槛。SendCutSend
              尚未公开确认 ITAR 注册、ISO 9001 或 AS9100 认证。如果其声称服务的国防 / 航空航天客户中有相当部分需要这些认证，就形成了可能限制企业扩张的尽调缺口。


              第三个反向维度在于 Fortune 500 说法本身：公司声称 Fortune 500 企业中「超过一半」（部分来源为 59.8%）是客户。按多数定义，Fortune 500
              实体哪怕只下过一笔低价值订单，也足以被算作「客户」。因此，这一说法把完整生产账户和一次性原型买家混在一起，没有说明关系深度、合同价值或战略重要性。尽调应要求公司按板块（Fortune
              500、SMB、爱好者）提供实际收入归属，用来判断收入质量。
