      - number: '5.7'
        title: 图表
        blocks:
          - type: callout
            title: DFM 引擎 + 套料算法形成复利式成本护城河
            body: >-
              每次文件上传都会在定价前触发自动 DFM
              检查，去掉传统加工厂计入间接费用的人工报价劳动。套料算法随后把原材料成本摊到同时进行的客户订单上，让单件定价在经济上可行。两个自研工具叠加后形成单位成本底线；依赖人工报价或按客户单独分配板材的竞争对手，若无同等软件投入，无法匹配。订单量增长后，套料效率会提升，成本优势随规模扩大而复利。
            calloutType: strength
