        - 按客户选择做表面处理
        - 化学品供应链；环保合规（认证未披露）
        - 零件适用性有限；只覆盖 SendCutSend 目录里的表面处理选项
      - - 物流集成
        - 将生产出货接入美国主要承运商；更新订单追踪
        - UPS、FedEx 及其他美国主要承运商；Fastest 选项隔夜送达
        - 节假日和天气扰动；公司公开承认过服务延误事件
