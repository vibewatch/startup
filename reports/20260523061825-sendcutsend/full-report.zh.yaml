      - number: '2.2'
        title: 市场规模与可比证据
        blocks:
          - type: paragraph
            body: >-
              目前没有独立发布的分析师 TAM 估计，专门切出美国按需定制钣金加工这个子细分市场。行业报告（BDO、Deloitte、Kearney）对美国更广义的定制金属加工或定制零件制造估计，大致在每年 $20B 到
              $50B；但这些数字包含区域加工厂、合同制造商、企业内部自有车间和离岸供应商，并不只代表数字平台这一片。缺少精确子细分 TAM 是一个明确证据缺口，需要一手行业研究或专有分析师来源补足。

              最可操作的代理指标来自公开上市的数字制造可比公司。Xometry（NASDAQ: XMTR）是规模最大的上市数字制造市场平台，2026 年 Q1 总收入 $205M，同比增长 36%；其中市场平台收入
              $191M，同比增长 40%。截至 2026 年 Q1，Xometry 市场平台有 85,581 名活跃买家，较一年前的 71,454 增长 20%；过去十二个月消费至少 $50,000 的账户达到 1,864
              个。把 Xometry Q1 运行率年化，意味着单一数字市场竞争者的收入规模约 $780–820M。Protolabs（NYSE: PRLB）把自己定位为“全球领先的数字制造服务”，2025 财年收入
              $533.1M（同比 +6.4%），其中 2025 年 Q4 收入 $136.5M（同比 +12.1%）——这说明更广义市场可以容纳多个规模化玩家，但也说明并非每个平台都以同样速度增长。

              自下而上的规模测算视角：SendCutSend 公开声称拥有 300,000 名客户和约 $200M 年收入，意味着单客年收入约 $667。如果美国按需采购定制金属零件的企业总可触达池估计为 1–3M
              家公司（工程密集型 SMB、中端制造商和企业部门），在相同 ARPU 下，平台可触达收入机会约为 $670M 到 $2B——这个 SAM
              估计与今天可观察的平台收入合计相符；如果可触达池渗透率从低个位数继续提升，仍有明显上行空间。单一本土平台能拿到的 SOM 更窄；按 SendCutSend 的 $200M 收入和 300K
              客户估算，其对当前估计的数字平台可触达客户群渗透率约为 10–15%，剩余市场要靠持续投入产能、能力和地理覆盖来获取。

              反向证据和估算冲突：Xometry 40% 的市场平台增长率指向强劲市场扩张，但 Protolabs 6.4%
              的全年增长又显示现有玩家端可能已经成熟或承受竞争压力。二者不可能同时代表同一市场动态，说明买方分层（原型客户 vs. 企业生产）或能力差异（机加工 vs. 钣金）正在推动平台轨迹分化。
