      - CV030
      - CV031
      - CV034
      - CV035
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 证据
      - 何种证据会改变判断
    rows:
      - - 软件赋能的制造护城河
        - 即时报价、自有产能、材料 / 服务覆盖广、强增长叙事
        - 经验证的开工率、毛利率和复购经济性
      - - 本土规模与企业客户价值
        - 五座工厂、24/7 运转、Fortune 500 / 防务相关需求主张
        - 具名企业客户背书和受监管客户证据
      - - 增长溢价站得住
        - 2025 年 10 月达到 100M 里程碑，2026 年 5 月年收入约 200M
        - 100M 到 200M 的经审计财务桥接，加上利润率披露
      - - 工业模式下价格过高
        - 非经常性、重资本开支业务隐含 5.05x 收入倍数
        - 更有吸引力的进入价，或持续溢价上市可比公司支撑的证据
      - - 披露不透明可控
        - 知名投资人参与，但公开细节仍少
        - 尽调中提供股权结构、贷款方条款、董事会权利和审计报告
    notes: 多空论点都有证据支撑；决策取决于缺失的尽调和进入价格纪律，而不只是公司质量。
