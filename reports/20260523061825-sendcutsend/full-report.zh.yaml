  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 2028 年收入假设
      - 退出倍数
      - 隐含价值
      - 概率信号
      - 投资含义
    rows:
      - - 乐观
        - $500M
        - 5.0x-6.0x
        - $2.5B-$3.0B
        - 需要增长持续、质量控制强、上市可比公司溢价支撑
        - 上行空间有吸引力，但执行负担重
      - - 基准
        - $300M
        - 3.5x-4.0x
        - $1.05B-$1.2B
        - 假设继续增长，但按更正常的工业企业估值重评
        - 较当前价格仅有有限升值
      - - 悲观
        - $230M-$250M
        - 2.5x-3.0x
        - $600M-$750M
        - 假设增长放慢、情绪走弱、资本开支拖累
        - 新投资人面临明显下行
      - - 深度悲观
        - $200M 或以下
        - 困境 / 战略资产价值
        - $350M-$600M
        - 需要融资承压且经营不达预期
        - Fast Radius 式警示，但不是基准情形
    notes: 区间刻意保持简单且价格敏感；由于公开数据不足以支持精确测算，它们不是 DCF 输出。
