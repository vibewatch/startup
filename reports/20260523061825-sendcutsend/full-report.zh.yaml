      - number: '5.6'
        title: 能力限制与反向信号
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 平台有明确且有文档记录的能力边界，界定了哪些场景不适合把它作为制造来源。折弯仅限八种金属；不支持大于 130 degrees 的锐角、curl、bump、roll
              forming、coining 或 hemming。CNC 路由内角不能锐于 0.063 inches。激光切割不处理燃烧时产生危险气体的材料（如
              PVC）或高度易燃的厚材料。水刀不适合超过机器床身的大型零件。三维 CNC 加工能力范围（超出 2D 板材加坯料加工的部分）在公开文档中并未完整说明。


              从独立实践者视角看，Hackaday 工程社区在 December 2021 记录，SendCutSend 的激光切割金属零件“默认带有典型粗糙边缘”，需要手工收尾。同一社区也确认，孔精度足以支持 M3×0.5
              手工攻牙，平台会自动应用切缝补偿——这同时验证了一个限制（原始边缘效果）和一个优势（尺寸精度）。


              安全与合规方面，DFARS 252.204-7012 和 NIST SP 800-171 合规声明均为自我证明，公开披露中没有独立审计。OSH Cut 拥有 ISO 9001:2015
              认证；SendCutSend 未公开声称拥有同等认证。对有正式质量体系要求（AS9100D、ISO 9001、ITAR 注册）的客户来说，认证缺失是采购障碍。


              生产可靠性风险真实存在但不算大：公司公开发布承运商假日和设施维护造成的服务延误，承认 24/7 生产模式存在计划中断。关于机器正常运行时间、报废率或一次通过率，没有独立数据公开。
