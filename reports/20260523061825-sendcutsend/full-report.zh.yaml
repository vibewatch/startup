  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的投资逻辑罕见地简单，也罕见地有吸引力：公司似乎搭出了一个软件驱动、自助式制造平台，解决了客户快速获得定制制造零件、且不想被 RFQ 摩擦拖慢的真实痛点。如果数据准确，年收入从 2025
              年 10 月 $100M 增至 2026 年 5 月约
              $200M，对一家美国国内工业公司来说非常突出。美国国内足迹、宽服务目录和长尾客户基础意味着，公司不是一个脆弱的单一垂直故事。反向逻辑同样清楚。投资者仍在承销一家资产重、非经常性制造商，而公开披露有限，没有经审计财务，贷款人契约不清，也没有公开优先权堆叠。因此，2026
              年价格假设软件驱动的吞吐和增长会继续拿到上市可比公司的溢价倍数，即便业务仍承担实质工业执行和融资风险。公司质地叙事很强，但还不是低风险入场点。
            claimRefs:
              - CV006
              - CV007
              - CV025
              - CV036
