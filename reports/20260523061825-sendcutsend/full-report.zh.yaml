      - number: '3.2'
        title: 商业模式原型——自有产能、市场平台与混合模式
        blocks:
          - type: paragraph
            body: >-
              数字加工中的三种主导商业模式原型，在质量、价格风险和产能控制方式上差异很大；这些差异会显著影响单位经济性、客户体验和竞争护城河耐久性。

              SendCutSend 采用完全自有产能模式。全部五处生产设施均为公司自有，并位于美国（Nevada、Kentucky 和
              Texas）。原材料只从美国本土材料厂采购。这带来可确定的质量控制——每个零件都通过同一个 DFM
              引擎和生产管理系统——也消除了供应商网络管理开销。自研套料算法把多个客户订单拼到单张板材上，即使单件订单也能实现低单位成本。代价是资本密集：产能扩张需要实体设施投资和设备采购。SendCutSend 在 2026
              年 5 月把 $110M A 轮资金部分用于美国各地设施扩张，并承诺五年内投入 $1B 于美国制造。

              Xometry 的市场平台模式把买方连接到经过审核的全球供应商设施网络。Xometry 不持有生产资产，而是基于 AI 驱动的匹配、定价和交期优化，把订单路由给网络供应商。这种模式让 Xometry
              无需为每种工艺自有专用设备，就能提供更广的制造流程（CNC 机加工、注塑、3D 打印、钣金等）。代价是质量一致性依赖供应商认证（Xometry 将其网络认证到 ISO、AS9100D、ITAR 和 CMMC
              标准），而不是内部控制。Xometry 市场平台增长不需要成比例增加资本开支，这解释了为什么其 40% 的市场平台收入增长可以直接转化为扩大的调整后 EBITDA 利润率；公司目标是年化收入达到 $1B，并实现
              20% 的年度增量调整后 EBITDA 利润率。

              Protolabs 处在混合位置。它的自有工厂以工业制造商的规模和重复性处理注塑、CNC 机加工和钣金。Protolabs Network（原
              Hubs）承接超过工厂产能、需要特殊能力或受益于批量定价的需求，并把这些订单路由到经过审核的全球网络。2025 财年，工厂收入为 $416.9M（占总收入 78%）；网络收入 $116.2M（占
              22%），同比增长 15.7%——快于工厂业务的 4.1%，说明网络模式对 Protolabs 增长逻辑越来越重要。这种混合方法提供了能力宽度和地理覆盖，但也引入了管理两套交付系统的协调复杂度。

              Fictiv/MISUMI 模式是纯外包网络设计：Fictiv 管理四个全球制造中心的供应商关系、质量保证和数字工作流，而 MISUMI 的实体基础设施（22 个制造基地、20 个物流枢纽）提供规模。这让
              Fictiv 能够跨地域处理复杂、多工艺零件——但交期长于 SendCutSend 2–4 天的美国本土标准。该组合提供的是企业供应链管理方案，而不是立即购买式直接加工平台。

              Fast Radius 曾尝试打造软件驱动的数字制造平台，并在 2022 年 2 月通过 SPAC 融资。该 SPAC 遭遇 91% 股东赎回，公司最终只拿到 $106M，而非预计的
              $300–445M；同年公司申请 Chapter 11 破产，其资产随后通过 Section 363 出售给 SyBridge
              Technologies。这个崩盘案例说明，平台模式经济性本身并不能保证资本充足：轻资本底盘无法支撑数字制造在企业级竞争中所需的销售周期、认证和供应商网络开销。
