      - - 五金件嵌入（攻丝、沉头、PEM、压窝）
        - 机械设计工程师
        - GA——结账时附加
        - 单个订单完成整件集成；无需单独供应商
        - 限于目录五金件；无定制紧固件项目
      - - 阳极氧化（Class II）
        - 需要表面耐久性的铝零件买家
        - GA——要求 ≥0.063″ 挂孔
        - 提供 5 种颜色；增强耐腐蚀和耐磨性能
        - 不适用于非铝材料
      - - 粉末涂装
