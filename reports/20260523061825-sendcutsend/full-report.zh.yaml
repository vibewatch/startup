  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 在考虑当前可见缓释措施后，按发生可能性和影响程度展示 SendCutSend 的主要风险。
    data:
      columns:
        - id: impact-medium
          label: 中等影响
        - id: impact-high
          label: 高影响
        - id: impact-critical
          label: 严重影响
      rows:
        - id: likelihood-high
          label: 高可能性
          values:
            - colId: impact-medium
              value: Material price / supply volatility
            - colId: impact-high
              value: Shipping-partner disruption against speed promise
            - colId: impact-critical
              value: Transactional-demand slowdown hitting utilization
        - id: likelihood-medium
          label: 中等可能性
          values:
            - colId: impact-medium
              value: Hiring shortfall in production labor
            - colId: impact-high
              value: Equipment-financing tightening by JPMorgan
            - colId: impact-critical
              value: Quality drift or downtime across owned-capacity sites
        - id: likelihood-low
          label: 低可能性
          values:
            - colId: impact-medium
              value: Refund-policy abuse or fraud
            - colId: impact-high
              value: OSHA / EPA incident at a finishing site
            - colId: impact-critical
              value: Cyber or defense-data handling breach
        - id: likelihood-very-low
          label: 极低可能性
          values:
            - colId: impact-medium
              value: Minor IP dispute over uploaded artwork
            - colId: impact-high
              value: Confirmed ITAR qualification gap blocks a major defense program
            - colId: impact-critical
              value: Founder / core software leadership loss without succession
