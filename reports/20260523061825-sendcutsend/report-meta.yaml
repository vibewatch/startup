companyProfile:
  summary: 'SendCutSend is a Reno-based on-demand custom manufacturer founded in 2018 that replaced the legacy quote-and-wait workflow with a software-driven instant-buy platform for fabricated parts. Customers upload CAD files, receive immediate pricing, and order domestically manufactured parts across a broad service catalog that now spans laser cutting, waterjet cutting, CNC routing/machining, bending, finishing, and a large materials library. The company scaled from bootstrapped origins to roughly $200M claimed annual revenue and 300,000+ customers before taking its first institutional capital in May 2026: a $110M Series A at a $1.01B post-money valuation led by Sequoia and Paradigm. Public disclosures support strong customer breadth and operating ambition, but the company still provides limited lender-grade financial detail.'
