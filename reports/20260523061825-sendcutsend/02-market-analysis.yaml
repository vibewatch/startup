  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: market-sizing
      missingEvidence: >-
        An independent third-party analyst report (e.g., IBISWorld, MarketsandMarkets, Grand View Research)
        isolating the U.S. on-demand custom digital sheet metal fabrication sub-segment with a granular TAM,
        SAM, and 5-year CAGR.
      whyItMatters: >-
        Without a sub-segment TAM, the $1.01B SendCutSend valuation cannot be anchored to a market-share
        framing; investors must rely on competitor proxy math that has wide uncertainty bands.
      diligencePath: >-
        Commission or license a custom analyst report from IBISWorld or Grand View Research scoped to
        "digital/on-demand custom fabrication platforms, U.S., 2023–2028." Alternatively, consult Xometry's
        investor relations disclosures for any market sizing they cite.
      relatedQuestionRefs:
        - QM006

    - type: private-evidence-only
      severity: material
      topic: buyer-segments
      missingEvidence: >-
        Verified revenue composition by buyer segment (prototype vs. production vs. enterprise), customer
        revenue concentration (top-10, top-100 customers as % of revenue), and repeat-order cohort
        analysis showing LTV and churn rates by segment.
      whyItMatters: >-
        Customer breadth (300K accounts) does not reveal revenue quality. If top enterprise accounts
        represent >50% of revenue, the business carries concentration risk inconsistent with the
        platform narrative. Primary access to cohort data is required for accurate valuation.
      diligencePath: >-
        Request customer cohort waterfall data in due diligence: revenue by order type, customer quintile
        revenue distribution, and quarter-over-quarter cohort retention for FY2022–FY2025.
      relatedQuestionRefs:
        - QM008

    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: >-
        Reconciliation of Xometry's 40% marketplace revenue growth against Protolabs' 6.4% growth and
        the ISM Manufacturing PMI contraction of 49.1% — three simultaneously valid market signals
        that are difficult to reconcile without granular customer segment data.
      whyItMatters: >-
        If the market is in mild aggregate contraction (PMI <50) but some platforms grow at 40% and
        others at 6%, the underlying driver is market-share capture rather than market expansion —
        a significantly different valuation thesis with different growth ceiling and competitive
        displacement risk.
      diligencePath: >-
        Analyze Xometry quarterly buyer cohort disclosure for mix shift (new buyers vs. existing);
        request SendCutSend new-vs-existing customer revenue split for FY2023–FY2025 to distinguish
        market-share capture from new-market creation.
      relatedQuestionRefs:
        - QM018

