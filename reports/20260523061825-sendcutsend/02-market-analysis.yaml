  - id: buyer-segments
    title: Buyer, User, and Payer Segmentation
    body: >-
      SendCutSend's customer base spans a wide range of organizational types and procurement contexts, but
      the platform's design choices — no minimums, instant pricing, file-upload workflow — reveal a primary
      orientation toward engineering and product-development buyers. The principal entry persona is the
      individual design engineer or CAD operator at a product company who uploads a design file, receives
      instant pricing, and places an order without waiting for a vendor quote cycle. This user often acts as
      both user and payer for small transactions but routes larger or recurring orders through procurement
      when dollar thresholds trigger purchase approval.

      At the enterprise tier, the organizational buyer splits: engineers remain the technical specifier
      and platform user, while procurement managers and supply chain directors own supplier qualification,
      net-30 payment administration, and blanket purchase order management. The enterprise features — multi-user
      organization accounts, dedicated account representatives, DFM-check automation, and blanket PO support —
      are designed to align with the procurement workflow of mid-to-large manufacturers. SendCutSend's
      commercial page explicitly markets to businesses progressing from prototype (1–500 parts) to
      pre-production (25–250 parts) to full production (scheduled repeat orders), indicating a deliberate
      land-and-expand customer journey model where prototype orders generate trust and quality history
      before procurement commits to production volumes.

      The enterprise customer cohort — companies from Fortune 500 aerospace, defense, data center, robotics,
      space flight, transportation, marine, and agriculture sectors — represents the highest revenue concentration
      segment. SendCutSend claims more than half (59%) of Fortune 500 companies as customers; this claim is
      company-asserted and unverified by independent audit. The startup/maker/independent inventor segment
      represents the long tail by customer count but likely a disproportionately small share of revenue.
      OEM production departments use SendCutSend as a surge or bridge supplier for components that fall
      outside primary contract manufacturer capacity, a use case that requires delivery reliability and
      consistent quality rather than the lowest possible unit cost.
