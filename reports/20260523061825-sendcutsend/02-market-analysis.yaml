chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The U.S. on-demand custom metal fabrication market sits at a structural inflection point driven by reshoring
    acceleration, AI/data-center hardware demand, and the digitization of industrial procurement. Observable
    platform revenue from public comparables Xometry ($820M+ annualized) and Protolabs ($533M) establishes a
    conservative lower bound for the digitally addressable sub-segment, while the broader U.S. custom fabrication
    market is estimated at $20–50B with no independently sourced granular TAM for the on-demand digital slice.
    SendCutSend's $200M revenue and 300,000-customer base position it as a scaled domestic platform serving
    engineering teams, procurement departments, and enterprise OEMs, with growth driven by reshoring
    ($1.667T committed manufacturing investment), AI infrastructure build-out (47,000 MW data center capacity
    under construction), and the secular shift from manual RFQ procurement to instant-quote digital ordering.
    Constraints include capital intensity, tariff-driven material volatility, quality trust gaps, and intensifying
    competition from Xometry's 40% marketplace revenue growth.

sections:
  - id: market-boundary
    title: Market Boundary and Served Definition
    body: >-
      SendCutSend competes in the U.S. on-demand custom fabrication market, defined here as the procurement of
      custom-engineered metal and non-metal parts in lot sizes from one to tens of thousands, fulfilled domestically
      within two to five business days via a software-driven instant-quote and buy-now workflow. This market sits
      at the intersection of traditional job-shop fabrication (characterized by manual RFQ, 2–6 week lead times,
      and minimum order quantities) and digital manufacturing brokerage (typified by global supply networks and
      longer logistics chains). SendCutSend defines its served scope through its service catalog: laser cutting,
      waterjet cutting, CNC routing, CNC machining, laser tube cutting, bending and forming, plus surface finishes
      including powder coating, anodizing, and plating — all executed on more than 170 metals and non-metals sourced
      from U.S. mills.

      Spend included in the served market encompasses custom-engineered sheet metal components, machined
      structural parts, prototype and pre-production runs, and repeat production orders of finished fabricated
      hardware. Excluded spend includes high-volume stamping and progressive die production (>100,000-unit runs
      with dedicated tooling), aluminum extrusion and roll-forming, injection-molded plastic components, additive
      manufactured (3D-printed) parts, PCB and PCBA, and large structural weldments (I-beams, structural columns).
      These exclusions reflect both SendCutSend's product catalog boundaries and the fundamentally different
      production economics of those categories.

      The primary status-quo substitute is the regional job shop — an SMB fabricator that handles custom orders via
      email RFQ, phone-based quoting, and manual scheduling. Job shops dominate local industrial ecosystems
      but are structurally disadvantaged on lead time (2–6 weeks vs. 2–4 days), digital accessibility (no
      instant pricing), and minimum order requirements (typically 25–500 pieces). A secondary substitute is
      in-house captive fabrication: engineering-centric companies that own their own laser cutters, press brakes,
      or machining centers and produce parts internally. The on-demand digital platform converts both substitutes
      by eliminating capital expenditure and setup complexity. Adjacent markets that SendCutSend is not yet
      capturing include additive manufacturing brokerage (Fictiv, Xometry), injection molding platforms,
      and standard mechanical components catalogues (MISUMI, McMaster-Carr). The Fictiv/MISUMI combination
      specifically signals that competitors are building unified platforms spanning both custom and standard
      components — a potential adjacency pressure on SendCutSend's future scope.
