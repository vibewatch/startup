  - id: constraints-gaps
    title: Market Constraints, Risks, and Evidence Gaps
    body: >-
      Despite strong macro tailwinds, the on-demand domestic fabrication market faces structural constraints
      that moderate the growth trajectory and introduce execution risk for platform players.

      Capital intensity is the primary operational constraint. Industrial laser cutters (fiber and CO2) cost
      $300,000 to $1M+ per unit; CNC machining centers add $100,000–$500,000 each; powder coating booths
      and anodizing lines require millions in facility investment. Scaling capacity to match demand requires
      either equity or debt financing at rates correlated with general interest rate levels. SendCutSend's
      $110M Series A is partly a capital solution to this constraint, with $250M committed to new facility
      expansion — but competitors can similarly access growth capital.

      Tariff volatility on steel, aluminum, and other raw material imports creates input cost uncertainty
      that is structurally challenging for instant-quote platforms. When a customer receives a locked price
      at order time, material cost increases between order and production compress margins if not passed
      through. Deloitte specifically highlights tariff-driven supply chain disruption as a key risk for
      domestic manufacturers. Fictiv's 2026 survey found 98% of leaders are taking active steps to
      offset tariff impacts — confirming that tariff risk is now a routine operational concern, not a
      tail risk.

      Quality assurance trust gaps constrain enterprise buyer conversion. Defense and aerospace primes
      typically require first-article inspection (FAI), material test reports (MTRs), traceability
      documentation, and AS9100D or ITAR compliance before approving a supplier for production parts.
      While SendCutSend markets to Fortune 500 customers across these sectors, its self-serve digital
      workflow is built for speed, not necessarily the formal qualification process that large primes require.
      The gap between prototype approvals and production qualification at enterprise accounts limits
      how quickly revenue can compound in the highest-value buyer segment.

      Switching costs create inertia in both directions. Existing regional job shop relationships carry
      approved vendor file status, NDAs, quality agreements, and historical audit records that represent
      sunk investment by procurement teams. These switching costs slow migration to digital platforms
      even when cost and lead-time advantages are clear. However, once a buyer approves SendCutSend in
      their AVL, the same switching costs apply in reverse — creating retention for the platform.

      Two critical evidence gaps undermine independent market sizing. First, no third-party research
      isolates the on-demand digital domestic sheet metal fabrication sub-segment from broader custom
      fabrication, making SAM and SOM sizing estimates highly uncertain. Second, SendCutSend does not
      disclose revenue composition by order type (prototype vs. production), customer concentration, or
      repeat-order rate — leaving key unit economics unverifiable without primary diligence.
    claimRefs:
