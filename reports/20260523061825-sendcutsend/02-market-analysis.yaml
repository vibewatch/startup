figures:
  - id: FM001
    title: On-Demand Custom Fabrication Market Boundary — Sizing Layers
    type: pyramid
    layout: standard
    summary: >-
      TAM/SAM/SOM layers for U.S. on-demand custom metal fabrication, showing the progression from the broad
      U.S. custom parts market to the digitally addressable platform slice and SendCutSend's observable position.
    data:
      nodes:
        - id: TAM
          label: U.S. Custom Parts Manufacturing TAM
          value: "$20–50B (estimated; analyst range)"
          detail: >-
            Total U.S. market for custom-engineered parts across all production methods including job shops,
            captive shops, contract manufacturers, and digital platforms. No single authoritative figure;
            derived from BDO/Deloitte manufacturing sector sizing.
        - id: SAM
          label: On-Demand Digital Platform SAM
          value: "$1.5–4B (inferred from public comparables)"
          detail: >-
            Sub-segment addressable via instant-quote digital platforms: prototyping + pre-production +
            small-to-mid batch production orders placed through digital channels. Lower bound anchored by
            combined Xometry ($760M+) + Protolabs ($533M) + SendCutSend (~$200M) observable revenue of $1.5B+.
        - id: SOM
          label: SendCutSend Domestic-Only SOM
          value: "~$200M current; $1B+ target"
          detail: >-
            SendCutSend's current annual revenue of ~$200M anchors the observable SOM for a single U.S.-only
            domestic platform. The company's $1B committed investment trajectory implies management targets
            a much larger share of the SAM over the next five years.
    approximationNotes: >-
      All layer values are estimates with high uncertainty. TAM is analyst-reported for broader custom manufacturing;
      no granular digital sub-segment TAM exists from a third-party source. SAM lower bound derived from public
      filing revenues of three platforms; true SAM may be 2–3x higher if job-shop-to-digital migration
      accelerates. SOM reflects 2026 company-reported figures.
