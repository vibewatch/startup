  - id: unit-economics-cost-structure
    title: Unit Economics and Cost Structure
    body: >-
      SendCutSend's unit economics are defined by the nesting algorithm: by aggregating multiple
      customers' orders onto a single sheet of raw material, the company achieves near-full material
      utilization per production run, compressing per-unit setup costs and material waste relative to
      single-customer job shops. This is the structural source of its claimed price advantage.

      Equipment is the dominant capital cost. The company operates 13 fiber laser cutters at
      approximately $1.3 million each (total ~$16.9M in laser capital), plus multiple CNC milling
      machines at approximately $1 million each, all financed through JPMorgan Chase as
      collateralized equipment loans. This means major capex is off the equity balance sheet —
      it does not come from the $110M institutional round. Labor costs are structured around a
      generalist floor worker model: operators start at $26–$30 per hour and are expected to cover
      multiple roles (laser operator, forklift driver, CAD programmer) on a given shift. The
      company runs four-shift, around-the-clock operations at all five facilities. Management
      estimated headcount at 410 employees as of January 2026; the $110M funding plan includes
      hiring 200–300 additional production employees and tripling the software engineering team.

      Gross margin is not publicly disclosed. The company claims profitability throughout its
      eight-year operating history, but no audited P&L has been published. Industry benchmarks
      for hardware-intensive digital manufacturing provide a reference point: Protolabs reported
      14.7% Adj EBITDA margin on $533M FY2025 revenue; Xometry's marketplace reached 38.3%
      gross margin in Q1 2026 (though Xometry is a marketplace intermediary, not a manufacturer).
      For a fully-owned manufacturing operation, gross margins are likely in the 35–50% range
      pre-overhead (material + direct labor only), compressing to lower EBITDA margins once
      facility costs, depreciation on owned equipment (if any not leased), and G&A are included.

      Facility costs are significant: SendCutSend operates nearly 250,000 square feet across
      five locations, including 130,000 sq ft in Reno alone. Facility deposits on new large
      buildings run approximately $600,000 each (first and last combined). The geographic
      expansion plan — Pennsylvania or Ohio next, then Indiana, Las Vegas, and Atlanta — will
      require substantial additional facility deposits and fit-out costs, none of which can be
      financed as collateralized equipment debt.

      Customer concentration is extremely low. The highest-revenue customer represents 0.59%
      of total income, which implies the top customer generates approximately $1.18M annually
      at the $200M revenue base. This is a remarkable diversification profile and eliminates
      single-customer revenue concentration risk almost entirely.
