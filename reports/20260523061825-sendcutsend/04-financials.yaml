callouts:
  - calloutType: strength
    title: Extreme Customer Diversification Eliminates Concentration Risk
    body: >-
      The highest-revenue customer accounting for only 0.59% of total income at the $200M revenue base
      implies no customer generates more than ~$1.2M annually. This is an exceptionally low concentration
      profile for a $200M revenue company and significantly reduces single-customer revenue risk.
      The 300,000+ customer base also provides substantial data for demand forecasting, pricing optimization,
      and production planning — a compounding informational advantage as scale grows.
    claimRefs:
      - CI037
      - CI038

  - calloutType: strength
    title: Near-Zero Marketing Spend at $200M Revenue Is a Structural Moat Signal
    body: >-
      Operating at approximately $1,500 per month in Google Ads while generating $200M in annual
      revenue implies an organic demand pull of extraordinary efficiency. This is consistent with
      a platform that has become the default solution for a specific job (instant custom fabrication)
      and suggests high word-of-mouth, search-intent capture, and repeat-customer economics.
      CAC near zero is the most defensible marketing moat in hardware manufacturing.
    claimRefs:
      - CI008
      - CI002

  - calloutType: risk
    title: Capital Intensity Scales Non-Linearly with Geographic Expansion
    body: >-
      Each new manufacturing location requires facility deposits (~$600K), fit-out, equipment
      (financed separately but adding to total debt service), and 40–80+ new employees ramping over
      six to twelve months before reaching target utilization. The $250M+ facility plan implies
      potential for four to ten new large facilities. If growth projects are delayed or demand doesn't
      absorb new capacity immediately, fixed cost absorption drag on margins could be significant.
      Fast Radius's bankruptcy demonstrates this risk concretely for asset-heavy digital fabrication.
    claimRefs:
      - CI026
      - CI028
      - CI041
      - CI042

  - calloutType: risk
    title: Zero Independent Verification of Revenue, Growth, and Profitability Claims
    body: >-
      Every financial claim — $200M revenue, 80% YoY growth, and profitability — originates from
      the company's own statements or investor communications. No audit, no SEC filing, no
      third-party verification exists. For institutional investors underwriting a $1.01B valuation,
      this is the primary diligence gap. The claims are plausible given the observable traction
      (300K customers, 50M+ parts, 7-year operation), but plausibility is not verification.
    claimRefs:
      - CI002
      - CI003
      - CI043
      - CI005

  - calloutType: recommendation
    title: "First Diligence Priority: Audited Financials and Equipment Debt Schedule"
    body: >-
      Before any capital commitment, require: (1) last three fiscal years of audited or reviewed
      financial statements, or at minimum management accounts with CPA sign-off; (2) full JPMorgan
      credit agreement including covenant package and total outstanding equipment debt schedule;
      (3) post-Series A cap table with liquidation preferences and governance rights; (4) trailing
      12-month P&L by service line; and (5) customer cohort data showing repeat order rate and
      12-month retention. Without these five items, the $1.01B valuation cannot be independently
      stress-tested.
    claimRefs:
      - CI043
      - CI045
      - CI022
      - CI013

