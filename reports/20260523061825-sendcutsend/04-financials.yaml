figures:
  - id: FI001
    title: Revenue Model Bridge — Customer Action to Revenue Recognition
    type: flow
    layout: standard
    summary: >-
      How a SendCutSend customer action converts into recognized revenue, illustrating the algorithmic,
      self-serve nature of the model and where the nesting engine creates the unit-economic advantage.
    data:
      nodes:
        - id: customer-upload
          label: Customer Uploads CAD File
          detail: >-
            DXF, DWG, AI, EPS, STP, or STEP file submitted via web platform. Customer specifies
            material, thickness, quantity, and finishing options.
        - id: dfm-engine
          label: DFM Engine Validates File
          detail: >-
            Automated design-for-manufacturability engine flags potential issues (e.g., minimum
            bend radius, feature size) before pricing. Reduces rework and support costs.
        - id: nesting-quote
          label: Nesting Algorithm Prices the Order
          detail: >-
            Proprietary nesting algorithm packs the customer's shapes alongside other customers'
            orders onto a shared sheet, computing optimal material utilization. Price is derived
            from material cost, cutting time, secondary operations, and quantity discount.
        - id: buy-now
          label: Customer Places Buy-Now Order
          detail: >-
            Customer selects standard (2–4 day) or expedited (< 48 hr) delivery. Enterprise
            customers may apply net-30 terms or blanket PO. No minimum order quantity.
        - id: production-queue
          label: Order Enters Production Queue
          detail: >-
            Order is scheduled onto the next available production run. Multi-customer nesting
            achieves near-full sheet utilization, distributing material cost across customers.
        - id: manufacturing
          label: Manufacturing and Secondary Operations
          detail: >-
            Laser cutting / waterjet / CNC machining executed. Secondary ops (bending, hardware
            insertion, finishing) added for applicable orders. 24/7 four-shift operations.
        - id: qc-ship
          label: QC, Pack, and Ship
          detail: >-
            Parts inspected, packed, and shipped via carrier. 91% of orders ship within 5 days
            of order placement on standard service.
        - id: revenue
          label: Revenue Recognized on Shipment
          detail: >-
            Revenue recognized at point of shipment. No deferred revenue, no subscription,
            no minimum contract. Purely transactional; ~$200M annual revenue claimed.
    approximationNotes: >-
      Flow represents the logical process sequence based on observed platform behavior and company
      statements. Timing intervals (e.g., DFM response time, queue wait) are not publicly disclosed.
    claimRefs:
      - CI004
      - CI006
      - CI009
      - CI002

  - id: FI002
    title: Unit Economics Bridge — Order Value Decomposition (Estimated)
    type: flow
    layout: standard
    summary: >-
      Illustrative decomposition of a representative order value into estimated cost components,
      highlighting where the nesting algorithm creates structural margin advantage. All cost splits
      are analytical estimates derived from public-company benchmarks; no actual company data available.
    data:
      nodes:
        - id: order-value
          label: Customer Order Value (100%)
          detail: >-
            List price set by nesting algorithm; volume discount applied at checkout.
            Average order value not disclosed; mix of 1-piece prototype to multi-thousand-piece
            production runs creates wide distribution.
        - id: raw-material
          label: Raw Material Cost (Est. 20–35%)
          detail: >-
            Driven by material type, thickness, and nesting efficiency. Nesting algorithm
            maximizes sheet utilization across multiple customer orders, reducing per-unit
            material waste. 15% of aluminum is offshore-sourced; 15–20% commodity move →
            ~3–4% customer price impact per Belosic.
        - id: direct-labor
          label: Direct Labor Cost (Est. 15–25%)
          detail: >-
            Floor operators at $26–$30/hr in generalist model covering cutting, bending,
            and finishing. Four-shift 24/7 operation; overtime may apply. 410 employees
            as of Jan 2026; 200–300 additional hires planned.
        - id: facility-equipment
          label: Facility and Equipment Cost (Est. 10–20%)
          detail: >-
            Nearly 250,000 sq ft across 5 facilities. Equipment financed via JPMorgan Chase
            (debt service, not depreciation on owned assets). Facility lease costs unspecified.
            Energy costs (laser cutters are power-intensive) not disclosed.
        - id: gross-profit
          label: Estimated Gross Profit (Est. 30–50%)
          detail: >-
            Company claims profitability throughout operating history but has not disclosed
            gross margin. Range derived from Protolabs (14.7% Adj EBITDA) and typical
            manufacturing margins. Nesting efficiency should push margin toward upper bound
            relative to traditional job shops.
    approximationNotes: >-
      All percentages are analytical estimates derived from comparable public companies (Protolabs,
      Xometry), manufacturing industry benchmarks, and stated cost data points from company interviews.
      No actual SendCutSend cost data has been independently verified. These estimates should not be
      used for underwriting without direct company disclosure.
    claimRefs:
      - CI011
      - CI014
      - CI018
      - CI019
      - CI020
      - CI034

  - id: FI003
    title: Key Financial Metric Ranges — Source-Backed Bounds
    type: range
    layout: standard
    summary: >-
      Revenue, valuation, growth, and margin estimates with lower and upper bounds derived from
      stated facts, public-company benchmarks, and analytical estimates. Ranges reflect uncertainty
      in unverified private company metrics.
    data:
      items:
        - label: Annual Revenue (2026 run rate)
          low: 180
          high: 220
          unit: USD M
          detail: >-
            Company-stated $200M at Series A announcement (May 2026); lower bound reflects potential
            overstatement or revenue timing uncertainty; upper bound reflects possible understatement
            given 80% YoY growth trajectory continuing from the $100M October 2025 milestone.
        - label: Implied Revenue Multiple (EV / Revenue)
          low: 4.6
          high: 5.6
          unit: x
          detail: >-
            Based on $1.01B post-money valuation divided by $180M–$220M revenue range. Xometry
            trades at lower multiples as a marketplace (not manufacturing-asset-owner); Protolabs
            at lower multiples due to slower growth. SendCutSend multiple reflects growth premium.
        - label: Gross Margin (Estimated)
          low: 30
          high: 50
          unit: pct
          detail: >-
            Lower bound: typical owned-capacity fabrication with high labor + facility overhead.
            Upper bound: nesting efficiency at full utilization approaching marketplace economics.
            Protolabs Adj EBITDA 14.7% implies gross margin above 30%; Xometry marketplace gross
            margin 38.3% provides ceiling reference for efficient digital model.
        - label: Adjusted EBITDA Margin (Estimated)
          low: 8
          high: 18
          unit: pct
          detail: >-
            Lower bound: Xometry's Q1 2026 ~5.1% Adj EBITDA margin (but Xometry is still scaling).
            Upper bound: Protolabs FY2025 14.7% for mature hybrid model. Company claims profitability;
            given low marketing spend and high revenue growth, margin could exceed Protolabs' level.
        - label: Total Equipment Debt Outstanding (Estimated)
          low: 18
          high: 35
          unit: USD M
          detail: >-
            Lower bound: ~13 laser cutters × $1.3M each = ~$16.9M, assuming near-new with minimal
            paydown. Upper bound: includes CNC milling machines and earlier equipment with rollover
            financing. All equipment financed via JPMorgan Chase equipment loans.
    approximationNotes: >-
      Revenue and margin ranges are author estimates based on stated data points and public-company
      benchmarks. Equipment debt range is estimated from unit cost and machine count. None of these
      figures have been independently audited or disclosed by the company.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI011
      - CI013
      - CI020
      - CI030
      - CI031
      - CI034

