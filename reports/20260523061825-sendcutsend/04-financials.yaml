  - id: capital-structure
    title: Capital Adequacy and Funding Structure
    body: >-
      SendCutSend's capital structure reflects an eight-year philosophy of equipment-first financing:
      collateralizable assets (laser cutters, CNC machines) are financed as secured debt through
      JPMorgan Chase, keeping major capex off any equity investor's balance sheet. Pre-2026 equity
      was limited to a $6 million friends-and-family round from Sandy Kory and Mark Sugarman, with
      the remainder of growth funded through operating cash flow, credit cards, savings, and
      equipment debt. This approach required discipline but resulted in the company entering its
      institutional round from a position of demonstrated profitability and organic growth.

      The May 2026 $110M Series A — the company's first institutional raise — was co-led by Sequoia
      Capital (partners Andrew Reed and Shaun Maguire) and Paradigm (Matt Wong), with personal
      participation from Patrick and John Collison of Stripe. The post-money valuation was $1.01
      billion, implying a ~5.05x trailing revenue multiple on the $200M claim. Belosic structured
      the deal on founder-friendly terms, retaining operational control and board governance; no
      board composition has been disclosed. The Collison relationship originated on X (Twitter),
      where Patrick Collison reached out and subsequently connected Belosic to both Sequoia and
      Paradigm.

      Use of $110M is deliberately bifurcated from equipment: all of the equity capital is directed
      to spending categories that cannot be collateralized. That means tripling the software
      engineering team (including computational geometry engineers), hiring 200–300 production
      employees, and covering facility deposits on new buildings (~$600K per facility). Equipment
      for new locations will continue to be JPMorgan-financed. Belosic has explicitly stated that
      beyond the $110M, more than $250M has been earmarked for expanding existing facilities and
      establishing new manufacturing hubs; the funding mechanism for this additional $250M is not
      specified, but the equipment portion is expected to follow the established debt-financing
      model.

      The company has also committed to a five-year $1 billion investment in U.S. manufacturing
      jobs and domestically produced materials — a political and reputational commitment whose
      financing path extends well beyond the current round. The implied capital requirement is
      substantially larger than $110M, raising questions about the trajectory to the next equity
      raise, the debt capacity of future equipment purchases, and whether the company's profitability
      can self-fund the non-equipment components of the expansion. Burn rate and runway from the
      $110M are not disclosed. Cash conversion cycle, working capital requirements, and credit
      facility terms are entirely private.
