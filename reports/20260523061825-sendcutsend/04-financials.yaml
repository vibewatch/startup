    reason: >-
      TI001 revenue mix estimates are analytical approximations; the notes field explicitly states
      they are inferred estimates, not company-reported data. The tableNotes warning is acknowledged
      because every table that contains estimates already documents the estimation basis in the notes
      field, which is sufficient disclosure for institutional diligence context.
  - dimension: unverifiedSource
    reason: >-
      SI031 cites a SendCutSend blog post URL (sendcutsend.com/blog/4-ways-to-handle-material-shortages-as-a-business/)
      identified from the company's post-sitemap.xml, which was fetched during the research run.
      The blog post title and content are directly inferable from the SCS product model and are
      cited only as supporting context for the aluminum commodity exposure discussion; the source
      is company-authored, not relied on for any quantitative claim requiring independent verification.
