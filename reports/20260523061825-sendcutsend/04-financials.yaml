  - id: TI005
    title: Public Financial Gaps — Missing Private Metrics and Diligence Paths
    columns:
      - Missing Metric
      - Impact on Analysis
      - Public Comp Reference Point
      - Exact Diligence Path
    rows:
      - - Audited revenue ($200M claim)
        - Cannot underwrite valuation; all downstream ratios depend on this figure
        - Protolabs FY2025 audited revenue $533M; Xometry Q1 2026 audited $205M
        - Request last 2–3 years audited financials or management accounts with external review
      - - Gross margin
        - Cannot assess unit economics, pricing power, or cost sensitivity
        - Protolabs FY2025 non-GAAP gross margin not separately disclosed; Xometry Q1 38.3%
        - Request P&L by service line; reconcile to gross margin definition used
      - - EBITDA margin and operating cash flow
        - Cannot assess self-funding capacity; profitability claim cannot be verified
        - Protolabs FY2025 Adj EBITDA 14.7%; Xometry Q1 Adj EBITDA margin ~5.1%
        - Request trailing 12-month EBITDA bridge; separate recurring vs one-time items
      - - Equipment debt schedule
        - Cannot assess total leverage; debt covenants may restrict equity transactions
        - No comparable public disclosure available for private co
        - Request full JPMorgan credit agreement; outstanding principal and covenant summary
      - - Capitalization table
        - Cannot assess investor dilution, liquidation preference, or secondary provisions
        - No comparable public disclosure available for private co
        - Request post-Series A cap table; board composition; governance rights schedule
      - - Customer cohort data (LTV, repeat rate, churn)
        - Cannot assess revenue quality; top customer at 0.59% is positive but incomplete
        - Xometry discloses active buyers (85,581) and LTM $50K+ accounts (1,864)
        - Request 12-month repeat order rate by customer cohort; annual churn by segment
