  - id: TI003
    title: Unit Economics — Available Data, Benchmarks, and Diligence Gaps
    columns:
      - Metric
      - Value / Status
      - Confidence
      - Why It Matters
      - Diligence Ask
    rows:
      - - Annual Revenue
        - "~$200M (company-claimed, May 2026)"
        - Low
        - Primary financial signal; all valuation math depends on accuracy of this figure
        - Audited revenue or management accounts with external sign-off
      - - Revenue YoY Growth
        - "~80% YoY (company-claimed, Jan 2026)"
        - Low
        - Drives forward valuation and expansion rationale; unverified
        - Monthly revenue cohort data or quarterly management accounts; independent confirmation
      - - Gross Margin
        - Not disclosed; estimated 35–50% (pre-overhead) based on comp benchmarking
        - Very Low (estimate)
        - Determines unit-level profitability and sensitivity to material/labor cost increases
        - Audited gross margin; gross profit by service line; material cost as % of revenue
      - - Adjusted EBITDA Margin
        - Not disclosed; Protolabs comp = 14.7%; company claims profitability
        - Very Low (estimate)
        - Determines cash generation capacity and ability to self-fund expansion
        - Management accounts showing EBITDA; normalize for equipment depreciation vs lease
      - - Marketing Spend / CAC
        - "~$1,500/month Google Ads; no outbound sales = negligible traditional CAC"
        - Medium
        - Extreme marketing efficiency is a competitive moat signal if genuine
        - Full-loaded CAC including customer support, onboarding, DFM review hours, churn handling
      - - Average Order Value
        - Not disclosed; no public data point
        - None
        - Determines contribution margin per transaction and sizing of B2B vs B2C mix
        - Transaction-level data; average order value by customer segment (hobbyist vs enterprise)
      - - Customer Concentration (Top Customer)
        - "Top customer = 0.59% of total revenue (~$1.18M/year at $200M base)"
        - Medium (company-stated)
        - Eliminates single-customer concentration risk; highly diversified revenue base
        - Top-10 and top-25 customer revenue share; repeat order rate by customer cohort
      - - Equipment Payback (Laser Cutters)
        - "$1.3M per laser cutter; financed via JPMorgan; 13 cutters in service"
        - Medium
        - Determines operating leverage trajectory; high utilization = faster payback
        - Machine-level utilization rate; average monthly revenue per laser; lease vs own economics
      - - Labor Cost as % of Revenue
        - Not disclosed; floor staff at $26–$30/hr; 4-shift operation; 410 employees (Jan 2026)
        - Low (estimate)
        - Second-largest variable cost after material; labor inflation risk in tight Nevada/TX/KY markets
        - Headcount by function; fully-loaded labor cost per part; overtime/shift premium rate
    notes: >-
      Confidence ratings reflect independent verification status, not magnitude. Very Low = no independent
      verification; Medium = company-stated but plausible given observable facts; Low = company-stated,
      unverified. Gross margin and EBITDA estimates are derived from public-company comps (Protolabs,
      Xometry) and are analytical approximations only.
