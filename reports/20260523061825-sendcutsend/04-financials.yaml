  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure
      missingEvidence: >-
        Audited or independently reviewed financial statements for any fiscal year; no P&L,
        balance sheet, or cash flow statement has been publicly released.
      whyItMatters: >-
        The $1.01B valuation and all downstream financial ratios depend on the accuracy of the
        company-claimed $200M revenue figure. Without audited data, institutional underwriting
        is not possible on first principles.
      diligencePath: >-
        Request last three fiscal years of audited financials or management accounts with CPA review;
        require reconciliation of $100M October 2025 milestone to $200M May 2026 claim.
      relatedQuestionRefs:
        - QI006
        - QI007
        - QI027
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >-
        Gross margin, operating margin, or EBITDA margin for any period; company claims profitability
        but has not disclosed any profitability metric.
      whyItMatters: >-
        Gross margin determines unit economics, pricing power, and sensitivity to material and labor
        cost increases. Without it, the $110M deployment plan cannot be assessed for adequacy or
        margin sustainability.
      diligencePath: >-
        Request gross profit by service line and trailing-twelve-month P&L; reconcile to gross margin
        definition; request EBITDA bridge for the most recent 12 months.
      relatedQuestionRefs:
        - QI001
        - QI002
        - QI013
      relatedTableRefs:
        - TI003
        - TI005

    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: >-
        Full JPMorgan equipment credit agreement including outstanding balance, interest rate, covenant
        package, and cross-default provisions; full post-Series A capitalization table.
      whyItMatters: >-
        Equipment debt covenants could restrict equity transactions, dividends, or future borrowing.
        The cap table is required to assess liquidation preferences and investor governance rights.
      diligencePath: >-
        Request JPMorgan credit facility summary and any intercreditor agreements; require post-Series
        A cap table including board composition and governance rights schedule.
      relatedQuestionRefs:
        - QI008
        - QI010
        - QI016
      relatedTableRefs:
        - TI004

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Customer cohort data including 12-month repeat order rate, annual revenue retention, and
        average order value by segment (hobbyist vs. enterprise).
      whyItMatters: >-
        Without cohort data, revenue quality cannot be assessed. The top-customer concentration
        figure (0.59%) is favorable but does not indicate whether customers are one-time buyers
        or long-term recurring purchasers.
      diligencePath: >-
        Request 12-month repeat order rate and trailing revenue by customer vintage cohort; request
        average order value by customer segment; request annual churn rate by segment.
      relatedQuestionRefs:
        - QI003
        - QI017
        - QI023
        - QI025
      relatedTableRefs:
        - TI003

    - type: conflicting-data
      severity: minor
      topic: customers
      missingEvidence: >-
        Consistent part count data: the company's own August 2025 press release stated 50M+ parts
        while third-party sources citing January 2026 interviews report 30M+ parts; the discrepancy
        is unresolved.
      whyItMatters: >-
        If the 50M figure includes rework, reorders, or individual components of multi-piece assemblies
        while the 30M figure counts discrete customer orders, both could be accurate but the metric
        definitions matter for comparisons with Fictiv (35M+) and Xometry.
      diligencePath: >-
        Request company definition of "parts shipped" and the audit trail behind both figures; confirm
        whether the count includes or excludes rework, reorders, and individual assembly components.
      relatedQuestionRefs:
        - QI018

    - type: missing-source
      severity: minor
      topic: adverse
      missingEvidence: >-
        No formal short-seller analysis, skeptical analyst coverage, or investigative journalism
        has been located for SendCutSend; absence of critical coverage may reflect limited analyst
        attention on a private company rather than absence of risk.
      whyItMatters: >-
        Investors should not treat the absence of adverse coverage as an adverse-risk absence.
        The valuation gap, undisclosed financials, and capital-intensity risks have not been
        stress-tested by independent external analysis.
      diligencePath: >-
        Search for Pitchbook commentary, LinkedIn industry commentary from fabrication insiders,
        and specialized metalworking forums; request reference checks with 5–10 enterprise customers.
      relatedQuestionRefs:
        - QI011
        - QI024

acknowledgedWarnings:
