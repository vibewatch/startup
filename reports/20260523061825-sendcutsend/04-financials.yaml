company:
  name: SendCutSend
chapter:
  number: 4
  title: Financials
  summary: >-
    SendCutSend's financial profile is defined by a bootstrapped path to ~$200M in company-claimed annual
    revenue, an $110M Series A at a $1.01B valuation (5.05x implied revenue multiple), and a capital
    structure that separates collateralizable equipment debt from equity-funded non-collateral spending.
    The company claims profitability, 80% YoY revenue growth, and extreme customer diversification
    (top customer = 0.59% of revenue). None of these figures have been independently audited or verified;
    all key unit-economics metrics — gross margin, CAC, LTV, burn rate, and working capital — are
    undisclosed private data. Public comparables Xometry (38.3% gross margin, $10.5M Q1 Adj EBITDA)
    and Protolabs (14.7% Adj EBITDA margin) provide benchmarks for the digitally-enabled fabrication
    segment, but their asset-light or hybrid models differ structurally from SendCutSend's fully-owned
    capacity. The primary financial risks are capital intensity, facility-build execution, equipment
    financing terms, and the gap between public investor enthusiasm and the unavailability of audited
    financial data for underwriting.

sections:
  - id: revenue-model
    title: Revenue Model and Revenue Streams
    body: >-
      SendCutSend operates a purely transactional revenue model: customers upload CAD files, receive
      instant algorithmic quotes, and place buy-now orders. There are no subscriptions, no recurring
      SaaS fees, and no minimum order quantities. Revenue recognition is straightforward — sale of
      manufactured parts upon shipment — with no deferred revenue or multi-element arrangement
      complexity. This model is structurally different from marketplace intermediaries like Xometry
      (which earns a take-rate spread between buyer price and supplier cost) and from Protolabs
      (which blends owned-factory manufacturing with a network resale model).

      The company monetizes eight primary service categories: laser cutting, waterjet cutting, CNC
      routing, CNC machining (milling), laser tube cutting, bending and forming, hardware insertion
      and secondary operations, and surface finishing (powder coating, anodizing, zinc and nickel
      plating). Each order is priced by the nesting algorithm based on material type, geometry,
      cutting time, finishing specifications, and quantity. Volume discounts scale automatically at
      checkout. Expedited production — delivered in under 48 hours for qualifying orders — is
      available at a premium price through two service tiers (Fast and Fastest).

      An enterprise tier provides net-30 payment terms, multi-user organization accounts, blanket
      purchase orders, and dedicated account management. Enterprise adoption has been growing:
      SendCutSend has been listed on the Inc. 5000 for three consecutive years, landing at #511 in
      2025, and serves more than half the Fortune 500, with customers spanning aerospace, defense,
      data center infrastructure, robotics, and space. Despite enterprise traction, the platform has
      never required a traditional outbound sales force; marketing spend was reported at approximately
      $1,500 per month on Google Ads at the time of the January 2026 NNBW interview, up from ~$100
      per month at founding. This represents a profound marketing-efficiency signal: ~$200M in annual
      revenue with negligible paid customer acquisition cost.

      All revenue is domestic. SendCutSend sources ~85% of its aluminum from U.S. mills (15% offshore),
      and all production occurs in the U.S. — a structural advantage in the current reshoring environment
      that also insulates it from cross-border shipping and tariff uncertainty at the finished-goods level.
      The primary tariff exposure is raw aluminum; the company estimates that a 15–20% commodity price
      move translates to only a 3–4% impact on customer pricing because raw material is a small fraction
      of final order value.
