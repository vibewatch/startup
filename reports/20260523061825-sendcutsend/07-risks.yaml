  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-register-coverage
    missingEvidence: A facility-by-facility permit, insurance, incident, and claims register covering OSHA logs, EPA permits, customer-specific contract terms, and any litigation or recall history.
    whyItMatters: The public record is strong enough to identify the major legal and regulatory vectors but too thin to fully enumerate the company's actual permit stack, incident record, or insurance-backed liability posture.
    diligencePath: Request legal and EHS summary by facility, insurance schedule, open claims register, and any defense-customer compliance matrix.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: regulated-customer-qualification
    missingEvidence: Proof of ITAR registration (or explicit legal basis for exemption), any AS9100 / ISO 9001 certificates, and any third-party cyber/compliance audit supporting defense or aerospace supplier qualification.
    whyItMatters: The investment case leans on enterprise and defense upside; without regulated-supplier proof, that upside cannot be underwritten beyond DFARS/NIST marketing language.
    diligencePath: Request certification packets, ITAR/DDTC status, SSP/POAM materials, and a list of programs where DFARS handling is already in production.
    relatedQuestionRefs:
    - QR002
    - QR010
    - QR011
    relatedTableRefs:
    - TR001
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: jpmorgan-credit-documents
    missingEvidence: Outstanding equipment debt balances, lender covenants, collateral schedules, maturities, and any cross-default or minimum-liquidity requirements tied to JPMorgan financing.
    whyItMatters: Equipment finance is central to SendCutSend's expansion model; without the covenant package, the company's true financial flexibility and downside resilience cannot be assessed.
    diligencePath: Request lender summary, borrowing-base details, asset age schedule, and management's capacity plan under tighter credit assumptions.
    relatedQuestionRefs:
    - QR019
    - QR020
    - QR023
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: operations-quality-metrics
    missingEvidence: Facility-level uptime, scrap, remake, refund, customer-complaint, and on-time-ship metrics by service line and site.
    whyItMatters: SendCutSend sells reliability and speed, but public evidence offers only headline promises rather than actual operating-control data.
    diligencePath: Request last twelve months of uptime, scrap, remake, and late-ship data, plus root-cause analysis for major incidents.
    relatedQuestionRefs:
    - QR015
    - QR016
    - QR017
    - QR018
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: governance-succession
    missingEvidence: Board composition, delegated-operating model, retention plans for founder and core software leadership, and a documented succession plan.
    whyItMatters: The current public record still revolves around Jim Belosic and a small technical leadership group; investors need to know whether the management bench is scaled for a billion-dollar manufacturing platform.
    diligencePath: Request org chart, board list, succession memo, and retention package summary for critical leaders.
    relatedQuestionRefs:
    - QR024
    - QR025
    - QR026
    relatedTableRefs:
    - TR004
