companyProfile:
  summary: >-
    Reka AI is a Sunnyvale-based private multimodal AI company that combines research, cloud inference, video
    infrastructure, and data infrastructure. Public sources show a founder-led technical team, a July 2025 financing
    backed by NVIDIA and Snowflake, and a product stack that spans APIs, hosted models, and research releases, but they
    do not disclose the operating metrics or control terms needed to underwrite the business with high confidence.
