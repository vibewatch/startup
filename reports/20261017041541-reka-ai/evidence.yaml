evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, voting rights, liquidation preferences, and any debt or credit facilities.
    whyItMatters: Governance and downside economics cannot be inferred from founder names and investor logos alone.
    diligencePath: Request the current cap table, board observer list, financing docs, and any debt agreements in the data room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited 2025-2026 revenue, ARR, gross margin, burn, and runway figures.
    whyItMatters: Public valuation signals cannot be tied to verified software economics without direct financial disclosure.
    diligencePath: >-
      Request monthly management accounts, customer billings by product, and board materials covering forecast versus
      actual performance.
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: >-
      A company-approved financing chronology showing exact round labels, dates, investors, and cumulative capital
      raised.
    whyItMatters: Secondary disagreement on early-round history weakens the reliability of ownership and valuation bridge analysis.
    diligencePath: Reconcile the cap table, signed closing memos, and investor update history against public database entries.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: >-
      Total customer count, concentration, contract sizes, renewals, and the split between direct and partner-mediated
      revenue.
    whyItMatters: Named logos do not show whether commercialization is broad, repeatable, or concentrated in a few relationships.
    diligencePath: >-
      Request a customer cohort export, top-20 revenue list, renewal dashboard, and pipeline-to-bookings bridge by
      product.
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent TAM, SAM, SOM, CAGR, or buyer-spend estimates for enterprise multimodal, video-intelligence, or
      physical-AI workloads relevant to Reka.
    whyItMatters: >-
      Without a real market-size benchmark, market language can overstate the scale and timing implied by current
      product proof points.
    diligencePath: >-
      Obtain third-party market studies or customer-budget data that isolate multimodal enterprise AI,
      video-intelligence, and edge or physical-AI spend.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Public procurement evidence naming the actual buyer, payer, and budget owner for Reka's current enterprise
      segments.
    whyItMatters: >-
      Adoption timing, sales-cycle length, and expansion potential depend on who controls budget and whether spend sits
      in central AI, line-of-business, or infrastructure envelopes.
    diligencePath: >-
      Request customer case studies, procurement artifacts, or pipeline segmentation that names budget owners and
      purchase motions by segment.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: enterprise-pricing-detail
    missingEvidence: >-
      Current exact price cards, discount bands, SLA terms, and private-capacity contract details for Reka and named
      competitor alternatives.
    whyItMatters: >-
      Without comparable commercial terms, the chapter can compare packaging mechanics but not normalized cost-to-serve
      or procurement friction.
    diligencePath: >-
      Collect current pricing pages, enterprise order forms, and customer-facing SLA exhibits from Reka plus named
      alternatives before underwriting unit economics or switching cost.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmark-refresh
    missingEvidence: >-
      Independent 2026 benchmark or customer evaluation data that compares Reka Edge or the current gateway catalog
      against named frontier and open-weight alternatives.
    whyItMatters: >-
      Current differentiation is supported mainly by company claims and secondary comparisons, so durability against
      fast-moving rivals remains only partially resolved.
    diligencePath: >-
      Run current benchmark and customer-task bakeoffs, or retain independent lab evaluations that include Reka Edge and
      named alternatives on the same workload set.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure-gap
    missingEvidence: >-
      Audited revenue, ARR definition and reconciliation, revenue mix, gross margin, retention, and customer
      concentration.
    whyItMatters: Billing mechanics do not establish revenue scale, quality, durability, or software-like margin.
    diligencePath: >-
      Request monthly financial statements and cohort schedules split by serverless, on-demand, fine-tuning, and
      dedicated-capacity revenue.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Numeric rate cards, discounts, minimum commitments, and realized contract pricing for each deployment mode.
    whyItMatters: Public billing units cannot show competitive pricing pressure or net revenue per workload.
    diligencePath: Review current price cards and a representative sample of executed customer agreements and amendments.
    relatedQuestionRefs:
      - QI002
      - QI005
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Compute cost per workload, utilization, implementation labor, support burden, CAC, sales cycle, and payback.
    whyItMatters: The mix of metered and dedicated infrastructure can produce materially different contribution margins.
    diligencePath: Obtain workload-level cost allocation and customer-cohort contribution-margin schedules by deployment type.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Pipeline conversion, channel economics, sales-cycle duration, implementation time, and renewal behavior.
    whyItMatters: Dedicated capacity and enterprise-gated features imply sales work that cannot be assessed from API documentation.
    diligencePath: Review CRM cohorts, partner agreements, implementation records, and renewal outcomes by customer segment.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy-gap
    missingEvidence: Current cash, monthly burn, debt or credit facilities, committed compute spend, and operating-plan runway.
    whyItMatters: Historical funding raised does not establish present liquidity or the timing of a next financing.
    diligencePath: >-
      Obtain recent balance sheets, cash-flow statements, debt schedules, compute commitments, and board-approved
      forecasts.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Concrete public evidence for security, privacy, compliance, and operating controls such as certifications,
      data-retention terms, uptime/SLA commitments, and incident history.
    whyItMatters: >-
      Multimodal enterprise workloads often include sensitive documents, images, audio, or video, so underwriting
      product risk requires more than navigation links to trust content.
    diligencePath: >-
      Request current trust-center exports, DPA/security addenda, certification letters, uptime commitments, and the
      last 12 months of incident or status reporting.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: benchmark-risk
    missingEvidence: >-
      Independent performance and latency evaluations for the 2026 Edge and current Flash releases on representative
      multimodal workloads.
    whyItMatters: >-
      Reka's clearest differentiation claims are performance and deployment efficiency claims, and those claims remain
      mostly vendor-authored in the assigned pool.
    diligencePath: >-
      Run side-by-side evaluations against peer multimodal models on buyer-specific datasets or request third-party
      benchmark packs with methodology and workload definitions.
    relatedQuestionRefs:
      - QE005
      - QE007
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: developer-ecosystem
    missingEvidence: >-
      Public developer-signal evidence such as repository activity, SDK/package adoption, forum traffic, or production
      reference implementations for the hosted Reka surfaces.
    whyItMatters: >-
      Familiar API ergonomics reduce switching cost, but ecosystem depth still affects integration speed, support
      burden, and implementation risk.
    diligencePath: >-
      Gather GitHub, package-registry, Discord/community, and customer implementation metrics for the current product
      surfaces rather than relying on older research artifacts.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: stale
    severity: minor
    topic: architecture-docs
    missingEvidence: >-
      A newer end-to-end technical explainer that reconciles the 2024 model-family report with the 2026 labs and catalog
      surfaces.
    whyItMatters: >-
      The public roadmap has shifted toward Edge and world-model work, so buyers need to understand what architectural
      continuity remains across current commercial offerings.
    diligencePath: >-
      Request current architecture briefs, model cards, and deployment diagrams that map present SKUs to the historical
      technical-report stack.
    relatedQuestionRefs:
      - QE003
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: 2026 NRR, GRR, churn, renewal-rate, and contract-length data by customer type.
    whyItMatters: >-
      Without retention and renewal data, public evidence cannot distinguish repeatable enterprise usage from one-off
      pilots or partner-led launches.
    diligencePath: >-
      Request cohort, renewal, and contract-duration data in the data room and reconcile it to active paying-account
      counts.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer revenue share, sovereign-program concentration, and the split between direct sales and
      partner-mediated usage.
    whyItMatters: >-
      Concentration can materially change downside risk if a few lighthouse accounts or sovereign programs drive most of
      the visible traction.
    diligencePath: >-
      Ask management for top-10 customer concentration, reseller or partner mix, and any minimum-spend commitments tied
      to strategic accounts.
    relatedQuestionRefs:
      - QU010
  - type: missing-source
    severity: material
    topic: named-customer-depth
    missingEvidence: >-
      Independent case studies or customer references that confirm production scope, measurable outcomes, and deployment
      breadth for named accounts.
    whyItMatters: >-
      The current public proof is enough to show relevance, but not enough to verify depth, expansion, or ROI for the
      named organizations.
    diligencePath: >-
      Obtain customer reference calls, procurement records, or independently published deployment writeups for AI
      Singapore, Shutterstock, and Indonesian sovereign programs.
    relatedQuestionRefs:
      - QU003
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: enterprise-compliance-pack
    missingEvidence: Current SOC 2, HIPAA, data-retention, DPA, SLA, and security-operations materials for the enterprise product path.
    whyItMatters: >-
      Public reviews explicitly say these assurances need contractual confirmation, so public evidence alone cannot
      clear enterprise diligence risk.
    diligencePath: >-
      Request the current enterprise security/compliance packet, DPA, incident-response commitments, and uptime/SLA
      language from Reka.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: business-terms-and-capacity-commitments
    missingEvidence: >-
      Signed Business Terms or order-form language covering dedicated compute, liability caps, termination, and
      committed capacity.
    whyItMatters: >-
      Enterprise conversion and downside protection depend on the commercial terms, not just product capability or demo
      quality.
    diligencePath: >-
      Obtain the current Business Terms and any standard dedicated-capacity paper, then compare liability, availability,
