    whyItMatters: >-
      Entry price alone does not show expected outcomes if insiders have materially different economics from new
      investors.
    diligencePath: >-
      Obtain the financing documents, cap table, and side-letter summary before underwriting any primary or secondary
      purchase.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Independent evidence on paid customer count, concentration, retention, direct-versus-channel revenue mix, and
      production usage depth.
    whyItMatters: >-
      Named users and partners signal relevance, but they do not prove repeatable revenue quality at the current
