    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
      - TR003
  - type: missing-source
    severity: material
    topic: incident-history-and-customer-concentration
    missingEvidence: >-
      Independent uptime history, security incident/postmortem disclosure, and revenue concentration data for major
      customers or channels.
    whyItMatters: >-
      The retained source set is rich on product and contract language but thin on empirical operating history, so
