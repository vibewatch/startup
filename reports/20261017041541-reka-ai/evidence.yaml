    relatedQuestionRefs:
      - QR003
      - QR004
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: Audited 2025-2026 revenue, ARR mix, gross margin, burn, runway, and compute-cost disclosures.
    whyItMatters: >-
      Without operating economics, the last private mark cannot be tested against recurring-software or
      infrastructure-style valuation logic.
    diligencePath: >-
      Request board-level financials plus product-line gross-margin bridges and compute-cost breakdowns in the data
      room.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV003
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: >-
      Exact post-money cap table, investor rights, liquidation preferences, debt or project-finance claims, and any
