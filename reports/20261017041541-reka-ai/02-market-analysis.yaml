company:
  name: Reka AI
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Public evidence supports a narrower market story for Reka than a generic
    "frontier model" TAM: the clearest current wedge is enterprise multimodal
    infrastructure for API-led deployments, video-heavy workflows, and emerging
    edge or physical-AI use cases. The assigned pool does not provide an
    independent TAM/SAM/SOM benchmark or named buyer budgets, so the chapter
    preserves the reachable-workload logic and the sizing gaps rather than
    overstating market size.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The strongest evidence does not support treating Reka as a generic
      all-purpose software vendor or a consumer chatbot company. Independent
      profiles and Reka's own properties consistently frame the company around
      multimodal reasoning across text, images, audio, and video, with current
      product surfaces spanning research, cloud deployment, video
      infrastructure, and training-data infrastructure. That defines the market
      boundary around enterprise multimodal infrastructure and adjacent physical
      AI workflows rather than broad "AI spend" as a whole. The same evidence
      also narrows the substitute set: buyers can compare Reka against text-only
      copilots, video analytics point solutions, or internal model-routing
      stacks, but those are substitutes because they solve part of the job, not
      because they share the same multimodal-native stack.
    claimRefs: [CM001, CM002, CM003, CM015]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      The public evidence is strongest on user and workflow segmentation, and
      weaker on named procurement owners. Reka is marketed to enterprises,
      developers, and organizations deploying multimodal workflows, with API
      usage as the lowest-friction entry point and training, dedicated
      deployments, or private environments as expansion paths. Video-heavy
      workflows are the most concrete current beachhead because multiple official
      surfaces repeat search, clipping, and reasoning over large video
      libraries, and the July 2025 funding release names current Vision users.
      A second adjacency is edge or physical-AI deployment, where the company is
      explicitly targeting robotics, vehicles, wearables, and drones. Budget
      ownership is therefore best read as segment-specific and still partly
      inferred from workflow and deployment mode rather than publicly disclosed
      procurement evidence.
    claimRefs: [CM004, CM005, CM006, CM007, CM010, CM013]
    tableRefs: [TM003]
  - id: sizing-drivers-and-constraints
    title: Sizing lenses, growth drivers, and adoption constraints
    body: >-
      The chapter can define the reachable workload layers more confidently than
      it can assign a market-size number to them. The assigned source pool does
      not contain an independent TAM, SAM, SOM, CAGR, or named buyer-budget
      series for Reka's category, so the valid sizing output is an
      evidence-constrained lens table rather than a single market estimate.
      Within that boundary, the growth logic is clear: Reka is selling
      efficiency, multimodal unification, and deployment flexibility, including
      serverless inference, on-demand GPU capacity, and edge deployment. The
      main constraints are equally clear: public market-size methodology is
      missing, buyer budget ownership is not directly disclosed, and an
      independent review still flags ecosystem scale, paid-only access, and
      enterprise-gated features as adoption friction. The market story is
      therefore directional and plausible, but not yet quantified tightly enough
      to support a valuation shortcut from TAM rhetoric alone.
    claimRefs: [CM008, CM009, CM011, CM012, CM014]
    tableRefs: [TM002]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment/category
      - Included spend
      - Excluded spend
      - Buyer/payer
      - Relevance
    rows:
      - - Multimodal model API and inference
        - Text, image, audio, and video inference; model hosting; fine-tuning; dedicated deployments
        - Generic text-only copilots or single-modality tooling
        - Application teams, ML platform teams, and centralized AI budgets
        - Core commercial entry point across the official API, docs, and company profiles
      - - Video reasoning infrastructure
        - Search, tagging, clipping, and reasoning across large video libraries
        - Non-AI media asset tooling or simple still-image classification
        - Media operations, security analytics, or content workflow owners
        - Most concrete current wedge repeated across official product and release materials
      - - Physical-AI data infrastructure
        - Egocentric video, robotics trajectories, world-model footage, and expert human judgment at scale
        - General enterprise SaaS spend unrelated to embodied or video-rich AI workflows
        - Applied research, robotics, autonomy, and data-ops programs
        - Extends the market into physical-AI workflows beyond general cloud inference
      - - Edge multimodal deployment
        - On-device visual-language inference for robots, vehicles, wearables, and drones
        - Cloud-only inference spend with no offline or latency constraint
        - Product teams funding embedded or offline AI experiences
        - Supports a differentiated low-latency wedge when cloud roundtrips are unacceptable
    notes: >-
      Boundary and excluded-spend rows synthesize company architecture with
      independent profile language; the table defines reachable workflow layers,
      not a quantified TAM.
    claimRefs: [CM001, CM002, CM003, CM006, CM007, CM015]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - AI Market Watch
        - "2026"
        - Global enterprise AI applications
        - Not disclosed
        - Not disclosed
        - Qualitative startup profile covering target customer, industries served, and differentiation
        - Medium
        - Useful for boundary framing, not TAM or SAM measurement
      - - BenchGecko
        - "2026"
        - U.S.-based company profile
        - Not disclosed
        - Not disclosed
        - Company profile describing the provider and listing company-level metrics
        - Low
        - Company metrics are not market-size methodology and do not isolate reachable spend
      - - WhatIf AI
        - "2026"
        - Enterprise and regulated-industry use cases
        - Not disclosed
        - Not disclosed
        - Use-case review covering deployment options, vertical workflows, and drawbacks
        - Medium
        - Maps adoption paths but not buyer budgets, CAGR, or market totals
      - - Reka official properties
        - 2025-2026
        - Global enterprise and edge / physical AI
        - Not disclosed
        - Not disclosed
        - Product-stack, deployment, and customer-proof pages identify reachable workloads
        - Medium
        - Primary evidence shows category shape and traction signals, not independent sizing
    notes: >-
      "Not disclosed" means the assigned pool did not provide a usable
      independent TAM, SAM, SOM, CAGR, or public buyer-budget series; the
      correct output is an evidence-constrained lens, not a broad estimate.
    claimRefs: [CM012, CM013, CM014]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Developer-led API adoption
        - Platform or product engineering lead
        - Application developers and data scientists
        - Same engineering org or centralized AI budget
        - Prototype and production multimodal inference through one OpenAI-compatible endpoint
        - Not publicly disclosed; likely product engineering or AI-platform budget
        - Need one endpoint for text, image, audio, and video inference
      - - Video intelligence workflows
        - Media-ops, content-ops, or security-analytics sponsor
        - Analysts, moderators, investigators, or operators
        - Business-unit operating budget
        - Tag, search, reason over, and clip large video volumes
        - Not publicly disclosed; likely line-of-business ops plus data infrastructure
        - Manual review becomes too slow, expensive, or latency-sensitive
      - - Regulated or private deployments
        - IT, security, or data-governance sponsor
        - Internal domain experts in finance, healthcare, or government
        - Enterprise software or infrastructure budget
        - VPC, on-premise, or dedicated-capacity deployment with fine-tuning
        - Not publicly disclosed; likely central IT or risk-approved AI budget
        - Need privacy, residency, predictable performance, or SLA-backed capacity
      - - Edge or physical-AI programs
        - Applied AI, robotics, or embedded-systems lead
        - Robots, vehicle systems, frontline workers, or field operators
        - Product, autonomy, or innovation budget
        - Offline multimodal reasoning on robots, vehicles, wearables, or drones
        - Not publicly disclosed; likely product or autonomy-program budget
        - Cloud roundtrip, thermals, or connectivity make edge inference mandatory
    notes: >-
      Buyer and workflow rows are source-backed; named budget-owner fields are
      still inferential because public materials describe deployment motions but
      do not disclose actual procurement owners or spend envelopes.
    claimRefs: [CM004, CM005, CM006, CM007, CM010, CM011]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The reachable market narrows from broad enterprise multimodal AI toward a
      more concrete wedge in API-led, video-heavy, and edge or physical-AI
      workflows.
    data:
      items:
        - label: Broad enterprise multimodal AI
          detail: Third-party profiles frame Reka as deployable multimodal AI for enterprise workflows.
          note: This is the broadest public category, not a quantified TAM.
          claimRefs: [CM001, CM004]
        - label: API and hosted inference
          detail: OpenAI-compatible API, serverless inference, and on-demand GPU capacity are explicit entry points.
          note: Official docs make this the most direct adoption path.
          claimRefs: [CM005, CM010, CM015]
        - label: Video intelligence workflows
          detail: Search, tag, clip, and reason across large video libraries.
          note: This is the clearest current wedge repeated across official surfaces.
          claimRefs: [CM006, CM013]
        - label: Private or regulated deployments
          detail: VPC or on-prem patterns appear in review evidence, but public buyer budgets are not named.
          note: Reachable spend depends on compliance-led procurement that is still undisclosed.
          claimRefs: [CM011, CM012]
        - label: Edge and physical AI
          detail: Robotics, vehicle, wearable, and drone workflows extend the wedge beyond cloud-only AI.
          note: 2026 Labs materials emphasize this adjacency more strongly than earlier broad market framing.
          claimRefs: [CM007, CM009, CM014]
        - label: Current proved wedge
          detail: Enterprise multimodal plus video-heavy workloads have real proof points, but no independent TAM or SAM benchmark.
          note: This final layer is evidentially strongest and numerically weakest.
          claimRefs: [CM012, CM013, CM014]
    approximationNotes: >-
      Layer order reflects narrowing market focus rather than quantitative
      proportions because the assigned pool discloses no independent TAM, SAM,
      SOM, CAGR, or buyer-budget series for Reka's addressable segment.
    claimRefs: [CM001, CM005, CM006, CM007, CM012, CM014]
