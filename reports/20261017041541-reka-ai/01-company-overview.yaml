company:
  name: Reka AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Reka AI is a Sunnyvale-based private multimodal AI company that now combines research,
    cloud inference, and video/data infrastructure, with a July 2025 financing backed by
    NVIDIA and Snowflake as its clearest public commercial validation. The public record is
    still thin on audited operating metrics and formal governance, and secondary trackers
    disagree on early-round history and total capital raised, so later diligence should treat
    the identity and financing story as stronger than the disclosed unit-economics record.
sections:
  - id: identity-and-positioning
    title: Identity, product scope, and current positioning
    body: >-
      The strongest ground-truth identity signal is Reka's own July 2025 announcement, which
      calls the company a global AI research and product company headquartered in Sunnyvale,
      California, and ties the business to multimodal AI platforms rather than to a single
      research model. The live site expands that into a four-part stack spanning research,
      Reka Cloud, video infrastructure, and data infrastructure, while the developer surface
      shows a concrete commercial model: OpenAI-compatible API access, token-priced
      serverless inference, GPU-priced on-demand deployments, and first-party plus open-model
      hosting. That combination makes Reka look less like a pure foundation-model lab and
      more like a private multimodal platform vendor with a research engine attached.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership visibility, founder pedigree, and governance opacity
    body: >-
      Publicly retained sources identify Dani Yogatama as CEO and place the company's
      founding in 2022, while Sterling attributes the broader founding team to Yi Tay, Dani
      Yogatama, Qi Liu, and Che Zheng with DeepMind/Google Brain pedigrees. That is enough
      to support a founder-led narrative and clear technical credibility, but not enough to
      underwrite governance confidence: the retained corpus does not publish a board roster,
      formal control rights, debt terms, or liquidation preferences. The result is a
      meaningful key-person and governance diligence gap, because external investors can see
      who founded and runs the company, but not how decision-making authority and downside
      protections are actually structured.
    claimRefs: [CO008, CO009, CO013]
    tableRefs: [TO002]
  - id: funding-scale-and-stakeholders
    title: Funding signals, scale disclosures, and stakeholder map
    body: >-
      The cleanest financing fact is the July 22, 2025 announcement that Reka secured a
      $110 million investment backed by NVIDIA and Snowflake, which secondary databases also
      treat as the step-up round that moved the company into the roughly $1 billion valuation
      band. Beyond that, the public picture gets less crisp: Latka says revenue is not
      published and cites a $10.9 million annual estimate, headcount is only observable as a
      LinkedIn-derived roughly 60-person snapshot, and secondary trackers disagree on whether
      the earlier institutional round was a 2022 seed or a 2023 Series A and whether total
      capital raised is closer to $168 million or $170 million. That means Reka has clear
      financing credibility and named blue-chip backers, but still lacks the operating
      disclosure that would let an investor connect valuation to verified revenue scale.
    claimRefs: [CO004, CO006, CO007, CO010, CO014, CO015]
    tableRefs: [TO003]
  - id: milestone-arc-and-current-signals
    title: Milestone arc and strategic drift signals
    body: >-
      The milestone record shows two stories running in parallel. In 2025, Reka emphasized
      enterprise platformization, with Reka Vision and Reka Research reaching general
      availability and customer references such as Shutterstock and Turing Video appearing in
      the financing announcement. By late 2026, however, the Labs surface is dominated by
      physical-AI and world-model releases such as PhysicalRealismBench-U, EdgeQ, Inverse
      Dynamics, and Rho-1, while an external review flags an enterprise caveat on the
      downloadable Edge license for organizations above $1 million in annual revenue. The
      implication is not that the company abandoned enterprise multimodal APIs, but that its
      public innovation narrative has shifted toward edge, video, and physical-AI
      differentiation rather than a generic frontier-chat positioning.
    claimRefs: [CO005, CO011, CO012]
    figureRefs: [FO001]
