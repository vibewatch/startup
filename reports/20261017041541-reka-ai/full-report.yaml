  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Reka's official developer surfaces support a multi-part revenue model rather than a single software
              subscription. The hosted platform combines Reka models with selected open models behind one
              OpenAI-compatible API, charges serverless workloads according to tokens used at each model's rate, and
              bills on-demand deployments by GPU time. The documentation also advertises fine-tuning and dedicated
              capacity, which adds negotiated enterprise monetization alongside metered self-service usage. Multiples
              independently classifies the business model as usage-based. However, these sources explain billing units,
              not actual price levels, discounts, minimum commitments, or the split between proprietary-model and
              third-party-model revenue. Two independent reviews add caution: one describes a paid-only product with
              enterprise-gated features, while another says Reka Edge's commercial-use license is capped at
              organizations below $1 million in annual revenue. Consequently, the public surface establishes ways Reka
              can charge but not realized revenue quality.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
