  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The reachable market narrows from broad enterprise multimodal AI toward a more concrete wedge in API-led,
      video-heavy, and edge or physical-AI workflows.
    data:
      items:
        - label: Broad enterprise multimodal AI
          detail: Third-party profiles frame Reka as deployable multimodal AI for enterprise workflows.
          note: This is the broadest public category, not a quantified TAM.
          claimRefs:
            - CM001
            - CM004
        - label: API and hosted inference
          detail: OpenAI-compatible API, serverless inference, and on-demand GPU capacity are explicit entry points.
          note: Official docs make this the most direct adoption path.
          claimRefs:
            - CM005
            - CM010
            - CM015
        - label: Video intelligence workflows
          detail: Search, tag, clip, and reason across large video libraries.
          note: This is the clearest current wedge repeated across official surfaces.
          claimRefs:
            - CM006
            - CM013
        - label: Private or regulated deployments
          detail: VPC or on-prem patterns appear in review evidence, but public buyer budgets are not named.
          note: Reachable spend depends on compliance-led procurement that is still undisclosed.
          claimRefs:
            - CM011
            - CM012
        - label: Edge and physical AI
          detail: Robotics, vehicle, wearable, and drone workflows extend the wedge beyond cloud-only AI.
          note: 2026 Labs materials emphasize this adjacency more strongly than earlier broad market framing.
          claimRefs:
            - CM007
            - CM009
            - CM014
        - label: Current proved wedge
          detail: >-
            Enterprise multimodal plus video-heavy workloads have real proof points, but no independent TAM or SAM
            benchmark.
          note: This final layer is evidentially strongest and numerically weakest.
          claimRefs:
            - CM012
            - CM013
            - CM014
    approximationNotes: >-
      Layer order reflects narrowing market focus rather than quantitative proportions because the assigned pool
      discloses no independent TAM, SAM, SOM, CAGR, or buyer-budget series for Reka's addressable segment.
    claimRefs:
