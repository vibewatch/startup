        - label: Serverless path
          detail: Requests are billed according to tokens used at each model's rate.
        - label: On-demand path
          detail: Dedicated deployments are billed by GPU time.
        - label: Customization path
          detail: Fine-tuning and dedicated capacity create additional enterprise offers.
        - label: Revenue
          detail: Metered usage and negotiated capacity can produce different revenue mixes.
        - label: Gross profit
          detail: Realized price, utilization, compute cost, and support burden remain unavailable.
