  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence does not support treating Reka as a generic all-purpose software vendor or a
              consumer chatbot company. Independent profiles and Reka's own properties consistently frame the company
              around multimodal reasoning across text, images, audio, and video, with current product surfaces spanning
              research, cloud deployment, video infrastructure, and training-data infrastructure. That defines the
              market boundary around enterprise multimodal infrastructure and adjacent physical AI workflows rather than
              broad "AI spend" as a whole. The same evidence also narrows the substitute set: buyers can compare Reka
              against text-only copilots, video analytics point solutions, or internal model-routing stacks, but those
              are substitutes because they solve part of the job, not because they share the same multimodal-native
              stack.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM012
              - CM014
      - number: '2.2'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The public evidence is strongest on user and workflow segmentation, and weaker on named procurement
              owners. Reka is marketed to enterprises, developers, and organizations deploying multimodal workflows,
              with API usage as the lowest-friction entry point and training, dedicated deployments, or private
              environments as expansion paths. Video-heavy workflows are the most concrete current beachhead because
              multiple official surfaces repeat search, clipping, and reasoning over large video libraries, and the July
              2025 funding release names current Vision users. A second adjacency is edge or physical-AI deployment,
              where the company is explicitly targeting robotics, vehicles, wearables, and drones. Budget ownership is
              therefore best read as segment-specific and still partly inferred from workflow and deployment mode rather
              than publicly disclosed procurement evidence.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
      - number: '2.3'
        title: Sizing lenses, growth drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The chapter can define the reachable workload layers more confidently than it can assign a market-size
              number to them. The assigned source pool does not contain an independent TAM, SAM, SOM, CAGR, or named
              buyer-budget series for Reka's category, so the valid sizing output is an evidence-constrained lens table
              rather than a single market estimate. Within that boundary, the growth logic is clear: Reka is selling
              efficiency, multimodal unification, and deployment flexibility, including serverless inference, on-demand
              GPU capacity, and edge deployment. The main constraints are equally clear: public market-size methodology
              is missing, buyer budget ownership is not directly disclosed, and an independent review still flags
              ecosystem scale, paid-only access, and enterprise-gated features as adoption friction. The market story is
              therefore directional and plausible, but not yet quantified tightly enough to support a valuation shortcut
              from TAM rhetoric alone.
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM012
              - CM014
