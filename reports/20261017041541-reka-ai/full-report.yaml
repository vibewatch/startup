  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Two-track customer motion
        blocks:
          - type: paragraph
            body: >-
              Reka's public commercial surface is legible even though its scale is not. The retained sources show a
              self-serve path for developers through pay-as-you-go chat, research, and vision APIs, plus a separate
              enterprise path for businesses that need monthly invoicing, volume discounts, VPC eligibility, dedicated
              support, or committed infrastructure. Official terms also split individual and enterprise usage
              explicitly, with dedicated compute and certain public-safety, security, defense, and government
              deployments handled under business terms or another written agreement. That combination suggests the
              company is trying to convert developer experimentation into higher-commitment enterprise or sovereign
              deployments rather than relying on a broad consumer base.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
