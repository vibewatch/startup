      - number: '3.3'
        title: Where incumbents and substitutes still pressure Reka
        blocks:
          - type: paragraph
            body: >
              The same pool also shows why Reka is not insulated from displacement. WhatIf AI explicitly lists a smaller
              developer ecosystem and lower brand awareness than established providers as drawbacks, which is consistent
              with Startuply's portrayal of the closed-model leaders as the benchmark-first comparison set. AI-solutions
              adds another pressure point: if a buyer's main requirement is open weights or unrestricted self-hosting,
              Mistral- and DeepSeek-style alternatives can be more straightforward than Reka's mix of hosted access and
              selective downloadable models. Even Reka's own downloadable Edge story is constrained by the custom
              license described by AI-solutions, which caps commercial use to organizations under $1 million in annual
              revenue. That turns a nominal control advantage into a segment-limited one for enterprise procurement.
            claimRefs:
              - CP005
              - CP008
              - CP010
              - CP011
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP010
              - CP011
              - CP015
      - number: '3.4'
        title: Durability, switching cost, and competitive risk
        blocks:
          - type: paragraph
            body: >
              Reka's moat looks more tactical than structural in the assigned evidence. The durable part is that the
              company can address regulated and latency-sensitive workloads with API, on-prem, and on-device options
              while routing both proprietary and open models through one gateway. The less durable part is that
              ecosystem breadth, benchmark leadership, and channel power still sit with larger incumbents or open-weight
              communities, not with Reka. The Labs page also suggests that 2026 product energy is tilting toward edge,
              robotics, video, and world-model research; that can sharpen differentiation, but it can also narrow the
              addressable comparison set if buyers want a broad enterprise standard rather than a specialized multimodal
              partner. Buyers should therefore treat switching cost as moderate, not prohibitive: Reka reduces stack
              sprawl, but AI Understanding still recommends fallback planning because policy or pricing changes can
              break assumptions overnight.
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Best wedge: deployability plus native multimodality'
            body: >-
              The strongest evidence-backed reason to choose Reka over a generic frontier API is that it combines
              multimodal scope with API, on-premise, and on-device delivery, then layers curated open models behind the
              same gateway.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP015
          - type: callout
            title: 'Largest pressure point: ecosystem breadth still belongs to others'
            body: >-
              The assigned pool repeatedly points to thinner ecosystem depth and narrower benchmark freshness than the
              largest incumbents, while open-weight alternatives remain appealing for control-oriented buyers.
            calloutType: risk
            claimRefs:
              - CP008
