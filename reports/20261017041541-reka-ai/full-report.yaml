      - number: '5.4'
        title: Public proof lags the product ambition on controls, ecosystem depth, and independent validation
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a positive view of Reka's technical ambition, but not a fully underwritten view
              of product maturity. The official surfaces expose responsible-AI, trust-center, privacy, and security
              navigation, yet the prefetched pages do not provide concrete control evidence such as certifications,
              data-retention commitments, uptime history, or incident reporting. The same gap appears on ecosystem and
              benchmarking. Reka offers familiar developer ergonomics and a browser playground, but the independent
              sources still describe a smaller ecosystem and thinner third-party proof than incumbent frontier
              platforms. As a result, the main product-technology risk is not that Reka lacks a coherent architecture;
              it is that the public diligence trail for current operating quality, governance, and real-world production
              referenceability remains incomplete.
