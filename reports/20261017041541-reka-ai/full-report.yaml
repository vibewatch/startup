  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacents, and the status quo'
        blocks:
          - type: paragraph
            body: >
              The assigned pool points to five real ways a buyer can solve the same multimodal-enterprise job. First are
              direct frontier-model incumbents: Startuply frames OpenAI and Anthropic as the benchmark-led API
              comparison set, and Reka's own Core launch page adds Google to the reference class for capability
              comparisons. Second are open-weight substitutes such as Mistral and DeepSeek, which the independent
              AI-solutions comparison treats as stronger fits when the buyer wants self-hosted or open-weight
              flexibility. Third is the hyperscaler-native route, where Amazon Nova represents a cloud-bundled
              alternative for teams already standardized on AWS. Fourth is the internal stitched stack: AI Understanding
              repeatedly describes the common fallback of combining multiple services for transcription, captioning, and
              reasoning rather than buying one native multimodal vendor. Reka therefore faces competition both from
              named model vendors and from the buyer's existing stack design choices.
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP014
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP010
              - CP014
              - CP016
      - number: '3.2'
        title: Where Reka is differentiated
        blocks:
          - type: paragraph
            body: >
              Reka's strongest competitive wedge in the assigned evidence is deployment flexibility tied to native
              multimodality. The official Core announcement says Core is available by API, on-premises, or on-device,
              while the current Labs page and AI Understanding both emphasize Edge- and video-oriented multimodal use
              cases that incumbents often treat as adjacent rather than central. The commercial surface reinforces that
              positioning: the platform page says Reka serves its own models alongside curated open models, and the API
              docs show the gateway is OpenAI-compatible rather than a proprietary integration pattern. That matters
              competitively because Reka can pitch itself both as a model vendor and as a control plane for multimodal
              workloads, which is narrower than an ecosystem moat but broader than a single-model SKU.
            claimRefs:
              - CP001
              - CP002
