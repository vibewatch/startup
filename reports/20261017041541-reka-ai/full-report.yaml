  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface has shifted from frontier-model branding to a multimodal deployment stack
        blocks:
          - type: paragraph
            body: >-
              Reka is currently easiest to understand as a multimodal model-and-platform supplier. The official docs say
              the API serves Reka models and selected third-party open models through one OpenAI-compatible endpoint,
              while the platform page shows both shared serverless inference and dedicated on-demand deployments. That
              makes the product surface broader than a single foundation model SKU: buyers can consume hosted inference,
              ask for dedicated capacity, or evaluate edge deployment where the model and license permit it. The current
              hosted catalog also suggests the commercial front door is now a gateway plus first-party models, not just
              a research showcase. External commentary reinforces that interpretation, describing Reka as powerful raw
              model infrastructure rather than a fully packaged workflow product for nontechnical teams.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE009
              - CE013
              - CE014
          - type: table
