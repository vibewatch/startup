      - number: '5.2'
        title: Core technical architecture remains credible, but the public details are anchored in older disclosures
        blocks:
          - type: paragraph
            body: >-
              The most substantive public technical disclosure in the assigned pool is still Reka's 2024 report. That
              report describes a modular encoder-decoder multimodal stack that accepts text, image, video, and audio
              inputs, supports tool-use patterns such as web search and code execution, and runs on custom serving
              infrastructure backed by Kubernetes and GPU fleets. The same report also establishes the historical
              model-family logic: Edge and Flash were trained as dense multimodal models with materially different size
              and context tradeoffs. Current official surfaces still point to that same general architecture, but the
              newer labs page spends more visible space on research previews and edge deployments than on a refreshed
              frontier general model. Technically, that implies continuity of the multimodal core while the public
              roadmap emphasis has moved toward world-model and physical-AI use cases.
            claimRefs:
              - CE002
              - CE005
              - CE007
              - CE008
