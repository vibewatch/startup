      - number: '5.3'
        title: Deployment flexibility is the clearest product wedge, especially for edge and regulated workloads
        blocks:
          - type: paragraph
            body: >-
              Reka's most defensible differentiation in the assigned evidence is deployment flexibility around
              multimodal workloads. Official pages market a hosted API, dedicated capacity, and local or device-side
              execution for Edge, while external profiles emphasize that on-premises and on-device options matter when
              video or audio cannot leave a controlled environment. Edge is the clearest expression of that strategy:
              the labs page presents it as a 7B vision-language model optimized for deployment, with packaging that can
              run through Hugging Face and vLLM and specific positioning for robotics, automotive, wearables, and
              real-time media. That is a useful wedge versus API-only vendors, but the evidence base is still mostly
              vendor-authored, so buyers should treat performance and usability claims as promising rather than
              independently verified.
            claimRefs:
