      - number: '4.2'
        title: Unit economics, cost drivers, and traction limits
        blocks:
          - type: paragraph
            body: >-
              The revenue mechanics imply materially different cost profiles. Serverless token billing exposes gross
              profit to model mix, inference efficiency, and utilization across shared infrastructure; GPU-time
              deployments add capacity reservation and idle-resource risk; and fine-tuning or dedicated capacity can
              introduce implementation and support labor. None of the assigned evidence supplies audited revenue, ARR,
              gross margin, customer acquisition cost, payback, retention, or customer concentration. The official news
              index does show continuing research and product activity through October 2026, including model, edge,
              world-model, and dataset work, but release cadence is a spending and product-activity signal rather than
              proof of commercial traction. Without workload-level utilization, compute cost, support burden, and
              contract data, neither a SaaS-style margin assumption nor a services-heavy margin assumption is
              supportable. The unit-economics verdict is therefore a documented gap, not a precise estimate.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Public sources consistently identify a $110 million Series B in July 2025, and the company's news index
              independently lists the $110 million announcement. Independent trackers also anchor the financing
              valuation at $1 billion, but disagree slightly on cumulative funding: QuantLogix reports $168 million
              while Multiples reports $170 million. That difference should be reconciled rather than compressed into a
              false point estimate. More importantly, capital raised is not cash available. The assigned evidence does
              not disclose current cash, monthly burn, debt or credit obligations, committed compute spend, or runway,
              so it cannot support a conclusion about financing sufficiency or a next-round trigger. Reka has a credible
              menu of billable products and continued technical output, but the public record remains insufficient to
              underwrite revenue durability, margin expansion, or capital adequacy. Investment diligence should require
              a financial package that separates metered inference, dedicated infrastructure, and services-like work
              before assigning a revenue multiple.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The $110 million 2025 round establishes historical financing, but current cash, burn, debt, compute
              commitments, and runway remain unavailable.
            calloutType: risk
            claimRefs:
              - CI009
              - CI016
          - type: callout
            title: Underwrite by deployment mode
            body: >-
              Require separate revenue and gross-margin bridges for serverless inference, GPU-time deployments,
              fine-tuning, and dedicated capacity before applying a blended software multiple.
            calloutType: recommendation
            claimRefs:
              - CI002
