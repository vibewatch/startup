              - CU008
              - CU009
              - CU012
              - CU013
      - number: '6.2'
        title: Public adoption proof is real but still narrow
        blocks:
          - type: paragraph
            body: >-
              The strongest named proof in the retained pool comes from a small number of secondary sources rather than
              a large case-study library. Nextomoro says Reka has reported partnerships with AI Singapore, Shutterstock,
              and other enterprise customers, while Sterling charts one sovereign deployment through the
              Indonesian-language Reka Yasa program. Independent review coverage also points to repeated target segments
              - media, financial services, healthcare research, defense, and AI product teams - which is directionally
              useful for segmentation. What is missing is breadth: the public evidence shows that Reka has enough
              customer proof to establish relevance across enterprise and sovereign workflows, but not enough to infer
              broad deployment depth, repeatability, or account scale with confidence.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU009
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU009
      - number: '6.3'
        title: Durability and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The visible frictions are easier to document than the renewal curve. Independent reviews flag a smaller
              developer ecosystem than incumbent model vendors, some features gated to enterprise agreements, and a
              local-deployment story that is strongest for the smaller Edge footprint rather than the full frontier
              stack. Just as important, none of the retained public sources discloses customer count, NRR or GRR, churn,
              contract duration, or top-customer concentration. For diligence, that means the commercial motion is
              credible, but durability still depends on management evidence rather than desk research.
            claimRefs:
              - CU010
              - CU011
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial path is visible even without scale metrics
            body: >-
              Reka's public materials are unusually clear about how an account should move from self-serve API usage to
              higher-commitment enterprise or sovereign deployment.
