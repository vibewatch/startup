  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest-residual risks sit at the intersection of contract gating, delivery dependence, and incomplete public
      enterprise assurance.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Kill criterion
      rows:
        - label: Enterprise contracting boundary
          note: >-
            Commercial use, dedicated compute, and sensitive deployments all require terms beyond the self-serve public
            path.
          values:
            - label: High
              tone: high
              note: Triggered immediately for enterprise and regulated buyers.
            - label: High
              tone: critical
              note: Can block production use even after a successful proof of concept.
            - label: Medium
              tone: medium
              note: Mitigation exists through Business Terms, but public evidence does not show the current package.
            - label: No signed enterprise paper
              tone: high
              note: Treat missing Business Terms, DPA, and SLA as a stop signal.
        - label: Capacity and availability dependence
          note: Public terms disclaim guaranteed model, GPU, region, and capacity availability.
          values:
            - label: High
              tone: high
              note: The risk is explicitly acknowledged in the published terms.
            - label: High
              tone: high
              note: Missed availability undermines enterprise trust and economics.
            - label: Low-medium
              tone: medium
              note: Mitigation depends on dedicated capacity and workload-specific testing, not public commitments.
            - label: No capacity proof
              tone: high
              note: Require committed-capacity language or live-load test evidence.
        - label: Roadmap and product-focus drift
          note: 2026 public materials emphasize research previews, world models, and edge/physical AI.
          values:
            - label: Medium
              tone: medium
              note: >-
                The signal is visible in current public releases but not yet disproven by fresh general-purpose
                launches.
            - label: High
              tone: high
              note: A mismatch between marketed roadmap and monetized product can compress sales efficiency.
            - label: Low-medium
              tone: medium
              note: Mitigation needs roadmap transparency and support-horizon proof by model family.
            - label: Unsupported commercial roadmap
              tone: high
              note: Stop if management cannot show current Core/Flash support and enterprise demand.
        - label: Downloaded-weight licensing mismatch
          note: The public Edge license described by one independent source is not enterprise-ready for most buyers.
          values:
            - label: Medium
              tone: medium
              note: The issue matters only when local/downloaded deployment is part of the go-to-market or product plan.
            - label: High
              tone: high
              note: If local-edge deployment is core to the thesis, the published cap can block production use.
            - label: Low-medium
              tone: medium
              note: >-
                Mitigation exists through a hosted or bespoke enterprise path, but public override terms are not
                retained.
            - label: Revenue-capped local rights
              tone: high
              note: >-
                Stop if the deployment thesis depends on downloaded Edge rights that remain capped below enterprise
                scale.
        - label: Compliance and ecosystem proof gap
          note: Independent reviews flag thinner compliance packaging and a smaller developer ecosystem.
          values:
            - label: Medium-high
              tone: high
              note: Enterprise diligence commonly asks for these materials.
            - label: High
              tone: high
              note: Missing assurances can lengthen or kill regulated deals.
            - label: Low
              tone: medium
              note: Public mitigation is limited; most remediation happens privately in diligence.
            - label: No current audit pack
              tone: high
              note: Treat absence of current security/compliance artifacts as a material unresolved risk.
        - label: Regional and ecosystem adoption friction
          note: Independent reviews highlight thinner integrations, no permanent free tier, and unclear mainland routing.
          values:
            - label: Medium
              tone: medium
              note: More likely to slow early adoption than to shut down an existing signed enterprise account.
            - label: Medium
              tone: medium
              note: This primarily affects developer trial velocity and partner-led expansion.
            - label: Low
              tone: medium
              note: Mitigation depends on sales support, references, and packaging rather than a public self-serve funnel.
            - label: Weak proof-of-value motion
              tone: medium
              note: Stop if trial friction and ecosystem gaps materially raise customer-acquisition cost versus incumbents.
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public evidence supports strategic interest, but not clean price validation.
    data:
      nodes:
        - label: Product proof
          value: GA platforms plus multimodal deployment
          note: Vision and Research are in GA and the docs show API plus dedicated deployment paths.
        - label: Strategic validation
          value: NVIDIA and Snowflake backing
          note: The 2025 financing anchors the last external valuation context.
        - label: Current focus
          value: Physical AI and edge research
          note: 2026 labs activity centers on Rho-1, inverse dynamics, and EdgeQ.
        - label: Structural downside
          value: Capital-intensity and license friction
          note: Bigger labs outspend Reka and the Edge weight license is enterprise-constraining.
        - label: Underwriting gap
          value: No public ARR, margin, burn, or preference stack
          note: Public sources leave valuation support largely narrative-driven.
        - label: Recommendation
          value: research-more / stretched / high risk
          note: Upgrade only after harder economics or better entry terms are available.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
