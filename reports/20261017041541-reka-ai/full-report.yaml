  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk overview
        blocks:
          - type: paragraph
            body: >-
              The public-evidence risk picture is led by commercial gating and delivery dependence, not by a named
              lawsuit or regulator action in the retained source set. Reka's own terms push enterprise and commercial
              use into Business Terms, carve out dedicated compute and public-safety/security deployments into separate
              agreements, and disclaim guaranteed model or region availability. Independent reviews add the second-order
              risk that enterprise compliance material remains thin in public and that some capabilities are gated to
              enterprise agreements, which increases the chance that diligence fails only after technical evaluation is
              already underway. A third residual risk is strategy and roadmap drift: Reka's 2026 public surface leans
              heavily toward research previews, world models, and edge deployment, while one independent profile notes
              no 2026 refresh for the broader Flash/Core family and a revenue cap on downloaded Reka Edge commercial
              use. For an investor, the practical implication is that contract review, capacity commitments, and
              product-roadmap validation are kill-criteria items rather than clean-up work after pricing is discussed.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Legal, regulatory, and licensing risk is more about scope control than disclosed enforcement
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence does not show an active enforcement action or headline litigation event, so
              the current legal risk case is driven by contract scope, licensing boundaries, and use restrictions.
              Reka's published individual terms make the API non-commercial under that agreement, route enterprise users
              to Business Terms, and reserve dedicated compute and public-safety/security/government uses for separate
              contractual paths. The same terms treat research previews as beta-only and prohibit their use where
              failure could cause harm, which matters because the labs page prominently features a 2026 research preview
              and edge/physical-AI positioning. Independent analysis adds a sharper licensing risk for downloaded Edge
              deployments by saying the published license permits commercial use only for organizations below $1M in
              annual revenue. That does not block hosted or bespoke enterprise deployments, but it does mean an investor
              should not underwrite the local/open-weight deployment story until the exact production license, liability
              allocation, and safety-use approvals are documented.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR011
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
      - number: '7.3'
        title: Operational risk clusters around availability, third-party dependence, and thin public assurance
        blocks:
          - type: paragraph
            body: >-
              Operationally, Reka's own terms are explicit that availability is not guaranteed at the model, GPU,
              region, or capacity level, and that customization jobs may fail or be interrupted. The delivery stack is
              also partner-dependent even when Reka is the commercial face: the docs say Reka runs requests on
              infrastructure it operates from the API to the GPUs, while the terms say that cloud services are hosted on
              third-party cloud and data-center providers and may expose third-party models whose separate terms still
              apply. That creates a layered failure mode in which platform incidents, supplier constraints, changing
              model listings, or license conflicts can all hit enterprise deployments. Independent sources sharpen the
              concern rather than resolving it: APIRank says public enterprise compliance documentation is less
              extensive and should be confirmed contractually, while WhatIf AI says some features are gated to
              enterprise agreements and the developer ecosystem is smaller than incumbent providers. The mitigation is
              straightforward but non-optional: obtain current SLA/DPA/security paperwork, validate uptime and queue
              behavior on the intended workload, and confirm which capabilities survive outside sales-led enterprise
              packaging.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.4'
        title: Financial and thesis-break triggers hinge on enterprise conversion and roadmap coherence
        blocks:
          - type: paragraph
            body: >-
              The public record does not yet support a clean underwriting case that Reka's technical breadth converts
              into enterprise-grade, repeatable economics without bespoke contracting. The platform and LLMIndex
              materials still position Reka as an enterprise-facing multimodal model provider, but independent reviews
              also point to a smaller ecosystem, gated enterprise-only features, and a lack of a permanent free tier,
              which raises customer-acquisition and proof-of-value friction versus better-known incumbents. More
              importantly, the 2026 public narrative is concentrated on research previews, edge, and physical AI; if the
              commercial revenue story still depends on Core/Flash-style general multimodal deployments, the burden is
              on management to show that those products remain roadmapped, supported, and contractible at scale.
              Investment-discipline kill criteria should therefore be measurable: failure to produce signed enterprise
              terms with acceptable liability and availability language, inability to show current compliance artifacts,
              or confirmation that meaningful enterprise deployment requires non-transferable bespoke economics would
              all weaken the case materially.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR009
              - CR010
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence still supports a research-more posture with medium confidence, high risk,
              and a stretched valuation stance. Reka did close a $110 million financing backed by NVIDIA and Snowflake,
              and independent trackers still anchor the last private mark around $1 billion, so the company is clearly
              relevant to serious strategic buyers and investors. The problem is not a lack of narrative momentum; it is
              that public materials still do not disclose the operating evidence needed to test whether that narrative
              can compound into venture-style returns from this price. Without audited revenue quality, gross margin,
              burn, runway, or downside-protection terms, the prudent entry discipline is milestone- based rather than
              price-chasing.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is real: public sources show a company that can sell a hosted multimodal API, supports
              dedicated deployment paths, and has enough product substance for Reka Vision and Reka Research to reach
              general availability. The anti-thesis is also real and more valuation-sensitive. Independent reviews say
              the freshest visible product momentum sits in Edge and physical-AI research rather than in a newly
              refreshed flagship general model, while capital intensity still favors far larger labs. That combination
              makes the asset strategically interesting but fragile if the next round or exit is priced on commercial
              durability rather than on team quality and multimodal scarcity alone.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
      - number: '8.3'
        title: Scenarios and comparable frame
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports wide valuation bands and scenario logic, not false-precision multiples.
              Independent sources compare Reka with frontier private AI labs and open-weight or infrastructure-heavy
              alternatives such as OpenAI, Anthropic, Mistral, DeepSeek, Cohere, and Amazon Nova, but the same public
              pool does not disclose clean ARR, margin, or retention data that would justify a public-SaaS-style
              underwriting shortcut. That means the relevant comparable frame is strategic positioning and
              commercialization proof, not a spreadsheet multiple pulled from incomplete economics. In the base case,
              the last mark can hold only if commercialization catches up to the company’s technical story before
              broader AI multiple compression does.
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence step is not another product demo; it is underwriting evidence. Investors should require
              audited or board-level 2025-2026 revenue, gross margin, compute cost, burn, runway, customer
              concentration, renewal behavior, and the exact post-money preference stack behind the 2025 round. The
              thesis should weaken sharply if management cannot show repeatable enterprise revenue beyond partner
              signaling, if self-hosted or sovereign deployment is narrower than public materials imply, or if a fresh
              flagship model roadmap cannot counter the risk that Reka becomes an interesting research shop priced like
              a scaled software platform.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-evidence call
            body: >-
              Treat Reka as a strategically interesting company that still needs economics and cap-table proof before a
              $1B entry can be underwritten.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
          - type: callout
            title: Most important kill criteria
            body: >-
              A flat or down round before hard commercial disclosure, or a failure to refresh the flagship product story
              beyond Edge and research releases, would materially weaken the investment case.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
