  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence traces several billable paths from workload to revenue, but the conversion from revenue to gross
      profit is not quantified.
    data:
      nodes:
        - label: Customer workload
          detail: Multimodal or model-hosting demand enters the platform.
        - label: OpenAI-compatible gateway
