  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险最高的部分，集中在合同门槛、交付依赖和不完整的公开企业保障之间。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 止损标准
      rows:
        - label: 企业签约边界
          note: 商业使用、专用算力和敏感部署都需要超出公开自助路径的条款。
          values:
            - label: 高
              tone: high
              note: 企业和受监管买方会立即触发。
            - label: 高
              tone: critical
              note: 即使概念验证（PoC）成功，也可能阻断生产使用。
            - label: 中
              tone: medium
              note: 可通过 Business Terms 缓释，但公开证据没有展示当前方案。
            - label: 没有签署的企业文件
              tone: high
              note: 将缺少 Business Terms、DPA 和 SLA 视为停止信号。
        - label: 容量与可用性依赖
          note: 公开条款不保证模型、GPU、区域和容量可用。
          values:
            - label: 高
              tone: high
              note: 已发布条款明确承认该风险。
            - label: 高
              tone: high
              note: 可用性落空会动摇企业信任和经济性。
            - label: 低—中
              tone: medium
              note: 缓释依赖专用容量和针对工作负载的测试，而非公开承诺。
            - label: 没有容量证明
              tone: high
              note: 要求提供承诺容量措辞或真实负载测试证据。
        - label: 路线图与产品重点漂移
          note: 2026 年公开材料强调研究预览、世界模型以及边缘 / 物理 AI。
          values:
            - label: 中
              tone: medium
              note: 当前公开发布中已能看到这一信号，但新的通用型发布尚未证明它不成立。
            - label: 高
              tone: high
              note: 营销路线图与可变现产品不匹配，可能压缩销售效率。
            - label: 低—中
              tone: medium
              note: 缓释需要路线图透明度，以及按模型家族提供支持周期证明。
            - label: 未经支持的商业路线图
              tone: high
              note: 如果管理层无法展示当前 Core / Flash 支持和企业需求，就停止。
        - label: 下载权重的许可证不匹配
          note: 一家独立来源描述的公开 Edge 许可证，对大多数买方而言还不适合企业使用。
          values:
            - label: 中
              tone: medium
              note: 只有当本地 / 下载部署属于上市或产品计划时，这个问题才重要。
            - label: 高
              tone: high
              note: 如果本地边缘部署是投资逻辑的核心，已发布的上限可能阻断生产使用。
            - label: 低—中
              tone: medium
              note: 可通过托管或定制企业路径缓释，但公开覆盖条款未被留存。
            - label: 收入上限约束的本地权利
              tone: high
              note: 如果部署逻辑依赖仍被限制在企业规模以下的下载 Edge 权利，就停止。
        - label: 合规与生态证明缺口
          note: 独立评测指出合规材料较薄弱、开发者生态较小。
          values:
            - label: 中—高
              tone: high
              note: 企业尽调通常会要求这些材料。
            - label: 高
              tone: high
              note: 缺少保障可能拉长或终结受监管交易。
            - label: 低
              tone: medium
              note: 公开缓释有限；大多数补救发生在私下尽调中。
            - label: 没有当前审计材料包
              tone: high
              note: 将缺少当前安全 / 合规材料视为重大未解决风险。
        - label: 区域与生态采用摩擦
          note: 独立评测强调集成较少、没有永久免费层，且中国大陆路由不清晰。
          values:
            - label: 中
              tone: medium
              note: 更可能拖慢早期采用，而不是关闭已有签约企业账户。
            - label: 中
              tone: medium
              note: 这主要影响开发者试用速度和合作伙伴主导的扩张。
            - label: 低
              tone: medium
              note: 缓释依赖销售支持、客户背书和产品封装，而不是公开自助漏斗。
            - label: 价值验证动作偏弱
              tone: medium
              note: 如果试用摩擦和生态缺口相较 现有巨头 显著推高获客成本，就停止。
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证据支持战略关注，但不足以干净地验证价格。
    data:
      nodes:
        - label: 产品证明
          value: GA platforms plus multimodal deployment
          note: Vision 和 Research 已进入 GA，文档展示了 API 加专用部署路径。
        - label: 战略验证
          value: NVIDIA and Snowflake backing
          note: 2025 年融资锚定了最近一次外部估值背景。
        - label: 当前重点
          value: Physical AI and edge research
          note: 2026 年 Labs 活动围绕 Rho-1、逆向动力学 和 EdgeQ 展开。
        - label: 结构性下行
          value: Capital-intensity and license friction
          note: 更大的实验室在支出上超过 Reka，Edge 权重许可证也约束企业使用。
        - label: 投资判断缺口
          value: No public ARR, margin, burn, or preference stack
          note: 公开来源对估值的支撑主要停留在叙事上。
        - label: 建议
          value: research-more / stretched / high risk
          note: 只有在获得更硬的经济数据或更好的进入条款后才升级。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
