  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与定价透明度
        blocks:
          - type: paragraph
            body: >-
              Reka 的官方开发者页面支持多段式收入模式，而非单一软件订阅。托管平台把 Reka 模型和精选开放模型放在同一个兼容 OpenAI 的 API 后，按各模型的 token 费率对无服务器工作负载计费，按 GPU
              使用时长对按需部署计费。文档还宣传微调和专属容量，因此在计量式自助使用之外，还存在协商式企业变现。Multiples
              将商业模式独立归类为按用量计费。但这些来源解释的是计费单位，而不是实际价格、折扣、最低承诺，或自有模型与第三方模型收入的分拆。两篇独立评测进一步提醒：其一称产品仅付费可用且部分功能需企业权限；其二称 Reka
              Edge 的商业使用许可仅覆盖年收入低于 100 万美元的组织。因此，公开页面说明了 Reka 可以如何收费，却没有证明已实现的收入质量。
