          - type: paragraph
            body: >-
              投资逻辑确实存在：公开来源显示，公司能销售托管多模态 API，支持专属部署路径，且 Reka Vision 和 Reka Research
              已有足够产品实质进入正式可用阶段。反方逻辑同样真实，且对估值更敏感。独立评测称，最新可见的产品动能在 Edge 和物理 AI
              研究，而不是新近更新的旗舰通用模型；与此同时，资本密集度仍更有利于规模大得多的实验室。这使资产在战略上有吸引力，但如果下一轮或退出定价依赖商业持续性，而非团队质量和多模态稀缺性，投资逻辑就会很脆弱。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
      - number: '8.3'
        title: 情景与可比框架
        blocks:
          - type: paragraph
            body: >-
              公开证据支持宽估值区间和情景逻辑，不支持虚假的精确倍数。独立来源将 Reka 与 OpenAI、Anthropic、Mistral、DeepSeek、Cohere 和 Amazon Nova 等前沿私有 AI
              实验室及开放权重 / 重基础设施替代品比较，但同一公开来源池没有披露足够干净的 ARR、利润率或留存数据，无法支持公共 SaaS
              式估值捷径。因此，合适的可比框架是战略定位和商业化证明，而不是从不完整经济性中抽出一个表格倍数。基准情景下，只有在更广泛的 AI 倍数压缩之前，商业化追上公司的技术故事，上一轮估值才可能站得住。
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 最终尽调要求与投资逻辑破坏触发点
        blocks:
          - type: paragraph
            body: >-
              下一步尽调不是再做一次产品演示，而是取得承保证据。投资者应要求 2025—2026 年经审计或董事会级别的收入、毛利率、算力成本、烧钱、现金跑道、客户集中度、续约行为，以及 2025
              年融资背后的确切投后优先股堆叠。如果管理层无法展示超越合作伙伴背书的可重复企业收入，自托管或主权部署窄于公开材料所暗示的范围，或无法用新旗舰模型路线图抵消 Reka
              变成一家按规模化软件平台定价的“有趣研究机构”的风险，投资逻辑就应明显减弱。
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 公开证据结论
            body: 可以把 Reka 视为一家具有战略吸引力的公司，但在能够评估 10 亿美元入场估值前，仍需取得经济性和股权结构表证明。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
          - type: callout
            title: 最重要的否决标准
            body: 如果在实质性商业披露前出现平轮或下轮融资，或旗舰产品故事未能超越 Edge 和研究发布得到更新，投资逻辑将明显削弱。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
