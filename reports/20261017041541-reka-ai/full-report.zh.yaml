      - number: '3.3'
        title: 老牌厂商和替代品仍施压 Reka 的领域
        blocks:
          - type: paragraph
            body: >-
              同一证据池也说明 Reka 并未免受替代压力。WhatIf AI 将较成熟供应商更小的开发者生态和更低的品牌认知列为缺点，这与 Startuply
              将闭源模型领导者描绘成基准优先的比较对象相一致。AI-solutions 又指出，如果买方核心需求是开放权重或不受限制的自托管，Mistral 和 DeepSeek 式方案可能比 Reka
              的托管访问加选择性可下载模型更直接。甚至 Reka 自己的可下载 Edge 方案也受 AI-solutions 所述定制许可约束：商业使用仅限年收入低于 100
              万美元的组织。这使原本的控制权优势在企业采购中变成受细分市场限制的优势。
            claimRefs:
              - CP005
              - CP008
              - CP010
              - CP011
              - CP016
