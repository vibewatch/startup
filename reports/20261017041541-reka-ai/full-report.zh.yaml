    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与当前定位
        blocks:
          - type: paragraph
            body: >-
              最扎实的身份信号来自 Reka 自己 2025 年 7 月的公告：公告称公司是总部位于加州桑尼维尔的全球 AI 研究和产品公司，并将业务与多模态 AI 平台绑定，而非单一研究模型。官网进一步展示了由研究、Reka
              Cloud、视频基础设施和数据基础设施组成的四部分技术栈；开发者页面则呈现了具体商业模式：兼容 OpenAI 的 API、按 token 计价的无服务器推理、按 GPU
              计价的按需部署，以及自有模型和开放模型托管。综合来看，Reka 更像一家挂着研究引擎的私营多模态平台供应商，而不是纯粹的基础模型实验室。
