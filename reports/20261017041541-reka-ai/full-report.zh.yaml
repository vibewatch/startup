        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据对用户和工作流分层的支持最强，对具体采购负责人则较弱。Reka 面向企业、开发者以及部署多模态工作流的组织；API
              使用是阻力最低的入口，训练、专属部署或私有环境则是扩展路径。视频密集型工作流是目前最具体的切入口，因为多个官方页面都反复强调对大型视频库进行搜索、剪辑和推理，2025 年 7 月融资公告也点名了 Vision
              用户。另一个相邻方向是边缘或物理 AI 部署，公司明确面向机器人、车辆、可穿戴设备和无人机。因此，预算归属最好按细分市场理解，部分仍是根据工作流和部署方式推断，而非公开采购证据。
