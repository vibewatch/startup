  - id: TV002
    title: 正论 / 反论表
    columns:
      - 立场
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 正论
        - 多模态部署弹性和上线中的 API 入口构成真正的企业切入口。
        - 有独立证据证明付费使用已扩大，将显著增强信心。
      - - 正论
        - NVIDIA 和 Snowflake 的支持，加上 GA 产品主张，显示出战略验证。
        - 更直接的客户、收入和留存披露会把信号转化为投资判断证据。
      - - 反论
        - 公开产品更新似乎集中在 Edge 和实体 AI 研究，而不是焕新的旗舰通用模型。
        - 有独立采用证据支持的焕新旗舰模型，会降低护城河被侵蚀的担忧。
      - - 反论
        - 许可限制、资本密集度和单薄的经济性披露，使得按软件型倍数解释 $1B 入场价十分困难。
        - 更低的入场价格，或对 ARR、利润率和优先权的硬披露，会改变判断。
    notes: 论点综合自公开来源；变化触发条件描述哪些证据会推动建议改变，而不是管理层意图。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - Bull
        - Vision 和 Research 将战略支持转化为广泛的企业采用，同时实体 AI 路线图打开差异化的边缘细分市场。
        - 只有收入增长和利润结构出现足以支撑前沿稀缺性定价的拐点，$1B 以上估值才可能成立。
        - 需要真实的经常性收入广度和焕新的旗舰护城河。
        - 需要独立的商业化证据，不能只看公司释放的信号。
      - - 基准情景
        - Reka 仍具战略相关性，但商业披露有限，且部分业务计算密集。
        - 在经济性或退出选择权变得更清晰前，公允价值仍接近上次私募估值。
        - 资本更充足的竞争对手和开放权重替代方案带来估值压缩。
        - 与当前公开证据集最为匹配。
      - - 悲观情景
        - 产品迭代新鲜度落后于前沿厂商，Edge 许可证压缩自托管 TAM；在收入证据出现前，投资者可能先行重估。
        - 如果买方基于有限数据、按宽泛下行空间评估，这轮融资平价甚至下调都变得可能。
        - 高资本强度叠加低透明度，可能压过战略故事。
        - 缺少收入披露、竞争规模存在差距，为此提供支撑。
    notes: 情景逻辑是定性的，因为公开证据没有披露精确建模回报区间所需的 ARR、毛利率、现金消耗或清算优先权。
    claimRefs:
      - CV002
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
