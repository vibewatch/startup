  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              最有力的证据不支持把 Reka 视为通用软件供应商或消费级聊天机器人公司。独立资料和 Reka
              自有页面都将其定位于文本、图像、音频和视频的多模态推理，当前产品覆盖研究、云部署、视频基础设施和训练数据基础设施。因此，市场边界应落在企业多模态基础设施及相邻物理 AI 工作流，而不是笼统的“AI
              支出”。替代品范围也随之收窄：买方可以在纯文本副驾驶、视频分析单点方案或内部模型路由栈之间比较，但它们只解决部分工作，并不具备同一套原生多模态栈。
