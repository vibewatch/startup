      - number: '3.2'
        title: Reka 的差异化所在
        blocks:
          - type: paragraph
            body: >-
              Reka 在指定证据中最强的竞争切口，是与原生多模态结合的部署灵活性。官方 Core 公告称其可通过 API、本地部署或设备端运行；当前 Labs 页面和 AI Understanding 也都强调 Edge
              与视频导向的多模态场景，而传统厂商往往只把这些视为相邻领域。商业产品面进一步强化了这一定位：平台页称 Reka 同时提供自有模型和精选开放模型，API 文档显示其网关兼容
              OpenAI，而不是要求专有集成。组合能力让 Reka 既可以把自己包装成模型供应商，也可以成为多模态工作负载的控制平面；其生态护城河较窄，却比单一模型 SKU 更宽。
