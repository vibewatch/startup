            - 机器人、汽车、可穿戴设备和视频工作负载
        - label: 核心系统层
          detail: 支撑该技术栈的历史多模态模型和服务基础。
          modules:
            - 模块化编码器—解码器多模态架构
            - 结合网页搜索和代码执行的工具调用
            - Kubernetes 加定制 A10、A100 推理技术栈
    approximationNotes: 该技术栈将当前官方商业界面与历史技术报告披露结合起来，因为指定资料池没有更新的端到端架构说明。
    claimRefs:
      - CE004
      - CE005
      - CE007
      - CE008
      - CE009
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开旅程从开发者试用走向企业签约，再进入部署架构选择，以及少数已点名的主权或合作伙伴主导落地。
    data:
      items:
        - label: 发现与测试
          actor: 开发者或 AI 团队
          channel: 文档、Playground 和 API 密钥
          touchpoints:
            - 快速入门和 API 参考
            - 按用量付费定价
          tone: neutral
        - label: 首个多模态工作负载
          actor: 产品或 ML 工程师
          channel: 无服务器 API
          touchpoints:
            - 聊天、研究或视觉任务
            - 按 token 用量计费
          tone: neutral
        - label: 安全与采购评审
          actor: 平台买方或安全评审者
          channel: 商业条款
          touchpoints:
            - 企业协议
            - 专属支持
            - VPC 资格
          tone: neutral
        - label: 架构决策
          actor: 受监管或主权客户
          channel: 部署规划
          touchpoints:
            - 无服务器
            - 按需
            - 本地或端侧
          tone: neutral
        - label: 生产落地
          actor: 已点名的公开客户
          channel: 合作伙伴或主权部署
          touchpoints:
            - AI Singapore 或 Shutterstock 提及
            - 印度尼西亚政府 Yasa 部署
          tone: positive
        - label: 扩张或承诺容量
          actor: 更大型企业或政府项目
          channel: 商业扩张
          touchpoints:
