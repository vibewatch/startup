        title: 领导层透明度、创始人履历与治理不透明
        blocks:
          - type: paragraph
            body: >-
              保留的公开来源将 Dani Yogatama 列为 CEO，并将公司成立时间置于 2022 年；Sterling 则将更广泛的创始团队归为 Yi Tay、Dani Yogatama、Qi Liu 和 Che
              Zheng，且成员拥有 DeepMind / Google Brain
              背景。这足以支撑创始人主导和技术可信度的判断，但不足以建立治理信心：保留语料未公开董事会名单、正式控制权、债务条款或清算优先权。也就是说，关键人物和治理尽调仍有明显缺口——外部投资者知道谁创办并管理公司，却看不清决策权和下行保护如何安排。
