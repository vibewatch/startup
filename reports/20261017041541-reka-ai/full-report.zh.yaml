      - number: '4.2'
        title: 单位经济性、成本驱动与牵引力上限
        blocks:
          - type: paragraph
            body: >-
              收入机制意味着成本结构差异很大。无服务器 token 计费使毛利受到模型组合、推理效率和共享基础设施利用率影响；GPU
              时长部署增加容量预留和闲置资源风险；微调或专属容量还可能带来实施与支持人力。指定证据没有提供经审计收入、ARR、毛利率、获客成本、回本期、留存率或客户集中度。官方新闻索引显示截至 2026 年 10
              月仍持续发布模型、边缘、世界模型和数据集相关研究与产品，但发布节奏是支出和产品活动信号，不是商业牵引力证明。没有工作负载级利用率、算力成本、支持负担和合同数据，既无法支持 SaaS
              式利润率假设，也无法支持服务型利润率假设。因此，单位经济性结论应是已记录的缺口，而不是精确估算。
