      - number: '4.3'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              公开来源一致确认 2025 年 7 月的 $110m B 轮，公司新闻索引也独立列出这笔 $110m 融资公告。独立追踪数据库还将融资估值锚定在 $1b，但对累计融资略有分歧：QuantLogix 报告
              $168m，Multiples 报告 $170m。
              应先调和这一差异，而不是压缩成虚假的精确点估计。更重要的是，融资额不等于可用现金。指定证据没有披露当前现金、月度烧钱、债务或信贷义务、已承诺算力支出或现金跑道，因此不能据此判断融资充足性或下一轮触发条件。Reka
              有可信的可计费产品组合和持续技术产出，但公开记录仍不足以评估收入持续性、利润率扩张或资本充足性。在赋予收入倍数前，投资尽调应要求一套能拆分计量式推理、专属基础设施和类服务业务的财务包。
            claimRefs:
