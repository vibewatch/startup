      - number: '3.4'
        title: 持久性、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              在指定证据中，Reka 的护城河更偏战术而非结构性。可持续部分在于，公司能用
              API、本地和设备端选项服务受监管且对时延敏感的工作负载，并通过一个网关路由专有模型和开放模型。不够稳固的部分在于，生态广度、基准领先和渠道力量仍掌握在大型厂商或开放权重社区手中。Labs 页面还显示，2026
              年产品精力正转向边缘、机器人、视频和世界模型研究；这能强化差异化，但如果买方要的是广泛的企业标准，而非专门的多模态伙伴，也会缩小可比范围。因此，买方应将切换成本视为中等而非不可逾越：Reka 能减少技术栈蔓延，但
              AI Understanding 仍建议准备备选方案，因为政策或价格变化可能一夜之间打破原有假设。
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP013
              - CP015
              - CP016
