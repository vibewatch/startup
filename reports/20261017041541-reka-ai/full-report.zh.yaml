        blocks:
          - type: paragraph
            body: >-
              最清晰的融资事实是：2025 年 7 月 22 日公告显示，Reka 获得 NVIDIA 和 Snowflake 支持的 $110m 投资；二手数据库也将其视为公司进入约 $1b
              估值区间的升级轮次。除此之外，公开信息就不那么明确：Latka 称收入未公开，同时引用 $10.9m 年收入估算；员工数只能从 LinkedIn 推断，约为 60 人；二手追踪数据库还未能确定早期机构轮次究竟是
              2022 年种子轮还是 2023 年 A 轮，累计融资究竟更接近 $168m 还是 $170m。因此，Reka 有清晰的融资可信度和知名蓝筹支持者，但仍缺少把估值连接到已验证收入规模的运营披露。
