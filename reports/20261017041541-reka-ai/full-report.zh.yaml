  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：直接同业、相邻方案与现状
        blocks:
          - type: paragraph
            body: >-
              指定来源池显示，买方有五种真正可行的方式来解决同一多模态企业工作。第一类是直接的前沿模型老牌厂商：Startuply 将 OpenAI 和 Anthropic 作为以基准为核心的 API 比较对象，Reka
              自己的 Core 发布页又把 Google 加入能力比较参考。第二类是 Mistral、DeepSeek 等开放权重替代品；独立的 AI-solutions
              比较认为，当买方需要自托管或开放权重灵活性时，它们更合适。第三类是云厂商原生路线，Amazon Nova 为已标准化使用 AWS 的团队提供云捆绑替代方案。第四类是内部拼装技术栈：AI Understanding
              多次描述一种常见做法，即组合多个服务来完成转录、字幕和推理，而不是购买一个原生多模态供应商。于是，Reka 既面对具名模型厂商，也面对买方现有技术栈的设计选择。
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP014
              - CP016
