company:
  name: Reka AI
chapter:
  number: 4
  title: Financials
  summary: >-
    Reka exposes several monetization mechanisms - per-token serverless inference,
    GPU-time deployments, fine-tuning, and dedicated capacity - but the assigned
    public evidence does not establish realized revenue, gross margin, burn, or
    runway. A $110 million July 2025 financing provides capital-history context,
    not evidence of current cash availability or sustainable unit economics.
sections:
  - id: revenue-architecture
    title: Revenue architecture and pricing visibility
    body: >-
      Reka's official developer surfaces support a multi-part revenue model rather
      than a single software subscription. The hosted platform combines Reka
      models with selected open models behind one OpenAI-compatible API, charges
      serverless workloads according to tokens used at each model's rate, and
      bills on-demand deployments by GPU time. The documentation also advertises
      fine-tuning and dedicated capacity, which adds negotiated enterprise
      monetization alongside metered self-service usage. Multiples independently
      classifies the business model as usage-based. However, these sources explain
      billing units, not actual price levels, discounts, minimum commitments, or
      the split between proprietary-model and third-party-model revenue. Two
      independent reviews add caution: one describes a paid-only product with
      enterprise-gated features, while another says Reka Edge's commercial-use
      license is capped at organizations below $1 million in annual revenue.
      Consequently, the public surface establishes ways Reka can charge but not
      realized revenue quality.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-traction
    title: Unit economics, cost drivers, and traction limits
    body: >-
      The revenue mechanics imply materially different cost profiles. Serverless
      token billing exposes gross profit to model mix, inference efficiency, and
      utilization across shared infrastructure; GPU-time deployments add capacity
      reservation and idle-resource risk; and fine-tuning or dedicated capacity
      can introduce implementation and support labor. None of the assigned
      evidence supplies audited revenue, ARR, gross margin, customer acquisition
      cost, payback, retention, or customer concentration. The official news index
      does show continuing research and product activity through October 2026,
      including model, edge, world-model, and dataset work, but release cadence is
      a spending and product-activity signal rather than proof of commercial
      traction. Without workload-level utilization, compute cost, support burden,
      and contract data, neither a SaaS-style margin assumption nor a
      services-heavy margin assumption is supportable. The unit-economics verdict
      is therefore a documented gap, not a precise estimate.
    claimRefs: [CI002, CI003, CI004, CI005, CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Public sources consistently identify a $110 million Series B in July 2025,
      and the company's news index independently lists the $110 million
      announcement. Independent trackers also anchor the financing valuation at
      $1 billion, but disagree slightly on cumulative funding: QuantLogix reports
      $168 million while Multiples reports $170 million. That difference should be
      reconciled rather than compressed into a false point estimate. More
      importantly, capital raised is not cash available. The assigned evidence
      does not disclose current cash, monthly burn, debt or credit obligations,
      committed compute spend, or runway, so it cannot support a conclusion about
      financing sufficiency or a next-round trigger. Reka has a credible menu of
      billable products and continued technical output, but the public record
      remains insufficient to underwrite revenue durability, margin expansion, or
      capital adequacy. Investment diligence should require a financial package
      that separates metered inference, dedicated infrastructure, and
      services-like work before assigning a revenue multiple.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
