  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Audited revenue or ARR, null, Unavailable, Establishes scale and recurring mix, Provide monthly GAAP revenue and ARR definition with reconciliation]
      - [Gross margin, null, Unavailable, Tests compute and support intensity, Provide gross margin by serverless dedicated and services categories]
      - [Compute cost per workload, null, Unavailable, Determines contribution margin under token and GPU billing, Provide inference cost per token and GPU-hour economics]
      - [CAC and payback, null, Unavailable, Measures enterprise GTM efficiency, Provide fully loaded CAC sales cycle and cohort payback]
      - [Retention and concentration, null, Unavailable, Tests durability and customer risk, Provide GRR NRR logo retention and top-ten revenue share]
      - [Latest disclosed financing, "$110M Series B in July 2025", High, Establishes historical external capital input, Reconcile primary financing proceeds with fees and any secondary component]
      - [Cumulative funding, "$168M reported by QuantLogix; $170M reported by Multiples", Medium, Frames dilution but not liquidity, Reconcile the two-source difference to the cap table and cash ledger]
      - [Cash burn and runway, null, Unavailable, Determines financing dependency and next-round timing, Provide current cash monthly burn debt commitments and base-case runway]
    notes: >-
      Null means the metric was not available in the assigned public evidence, not
      that its value is zero; financing totals are third-party-reported and differ.
    claimRefs: [CI009, CI010, CI011, CI012, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence traces several billable paths from workload to revenue, but
      the conversion from revenue to gross profit is not quantified.
    data:
      nodes:
        - label: Customer workload
          detail: Multimodal or model-hosting demand enters the platform.
        - label: OpenAI-compatible gateway
          detail: One endpoint exposes Reka models and selected open models.
        - label: Serverless path
          detail: Requests are billed according to tokens used at each model's rate.
        - label: On-demand path
          detail: Dedicated deployments are billed by GPU time.
        - label: Customization path
          detail: Fine-tuning and dedicated capacity create additional enterprise offers.
        - label: Revenue
          detail: Metered usage and negotiated capacity can produce different revenue mixes.
        - label: Gross profit
          detail: Realized price, utilization, compute cost, and support burden remain unavailable.
    approximationNotes: >-
      This is a qualitative sequence, not a quantified waterfall; it does not
      estimate conversion, revenue, cost, or gross profit.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI014]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The $110 million 2025 round establishes historical financing, but current
      cash, burn, debt, compute commitments, and runway remain unavailable.
    claimRefs: [CI009, CI016]
  - calloutType: recommendation
    title: Underwrite by deployment mode
    body: >-
      Require separate revenue and gross-margin bridges for serverless inference,
      GPU-time deployments, fine-tuning, and dedicated capacity before applying a
      blended software multiple.
    claimRefs: [CI002, CI003, CI004, CI005, CI014, CI015]
