    columns:
      - Metric
      - Assessment
      - Decision implication
    rows:
      - ["Recommendation", "research-more", "Do not underwrite a primary or secondary entry until operating economics and preferred terms are disclosed."]
      - ["Confidence", "medium", "Public evidence is strong enough to reject false precision but not strong enough to issue a buy or avoid call on hard numbers alone."]
      - ["Risk rating", "high", "Model-freshness risk, capital intensity, and disclosure gaps keep downside wide."]
      - ["Valuation stance", "stretched", "The $1B anchor is easier to explain strategically than on disclosed financial evidence."]
      - ["Entry discipline", "milestone-based", "Revisit after audited revenue quality, margin, burn, and cap-table terms are shared."]
    notes: Public-evidence-only decision grid; it does not use management-only financials or unpublished cap-table detail.
    claimRefs: [CV001, CV002, CV011, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - ["Thesis", "Multimodal deployment flexibility and a live API surface create a real enterprise wedge.", "Independent proof of scaled paid usage would strengthen conviction materially."]
      - ["Thesis", "NVIDIA and Snowflake backing plus GA product claims show strategic validation.", "More direct customer, revenue, and retention disclosure would convert signal into underwriting evidence."]
      - ["Anti-thesis", "Public product freshness appears concentrated in Edge and physical-AI research rather than a refreshed flagship general model.", "A clearly refreshed flagship model with independent adoption proof would reduce moat-erosion concern."]
      - ["Anti-thesis", "License limits, capital intensity, and thin economics disclosure make a $1B entry hard to justify on software-style multiples.", "Lower entry price or hard disclosure on ARR, margin, and preferences would change the call."]
    notes: Arguments are synthesized from public sources; change triggers describe what evidence would move the recommendation rather than management intentions.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Vision and Research convert strategic backing into broad enterprise adoption while the physical-AI roadmap opens a differentiated edge niche.", "A $1B-plus mark can work only if revenue growth and margin structure inflect enough to justify frontier scarcity pricing.", "Requires real recurring revenue breadth and a refreshed flagship moat.", "Needs independent commercial proof rather than company signaling alone."]
      - ["Base", "Reka remains strategically relevant but commercially disclosure-light and partly compute-intensive.", "Fair value stays near the last private mark until economics or exit optionality sharpen.", "Compression from better-capitalized rivals and open-weight alternatives.", "Best fit with the current public evidence set."]
      - ["Bear", "Product freshness lags frontier leaders, the Edge license narrows self-hosted TAM, and investors rerate before revenue proof arrives.", "A flat or down round becomes plausible if buyers underwrite on limited data and wide downside.", "Capital intensity plus thin visibility can overwhelm strategic story.", "Supported by missing revenue disclosure and competitive scale gaps."]
    notes: Scenario logic is qualitative because public evidence does not disclose ARR, gross margin, burn, or liquidation preferences needed for a precise modeled return range.
    claimRefs: [CV002, CV007, CV008, CV009, CV010, CV011, CV012, CV013]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public evidence supports strategic interest, but not clean price validation.
    data:
      nodes:
        - label: Product proof
          value: GA platforms plus multimodal deployment
          note: Vision and Research are in GA and the docs show API plus dedicated deployment paths.
        - label: Strategic validation
          value: NVIDIA and Snowflake backing
          note: The 2025 financing anchors the last external valuation context.
        - label: Current focus
          value: Physical AI and edge research
          note: 2026 labs activity centers on Rho-1, inverse dynamics, and EdgeQ.
        - label: Structural downside
          value: Capital-intensity and license friction
          note: Bigger labs outspend Reka and the Edge weight license is enterprise-constraining.
        - label: Underwriting gap
          value: No public ARR, margin, burn, or preference stack
          note: Public sources leave valuation support largely narrative-driven.
        - label: Recommendation
          value: research-more / stretched / high risk
          note: Upgrade only after harder economics or better entry terms are available.
    claimRefs: [CV001, CV004, CV006, CV008, CV009, CV011, CV012]
callouts:
  - calloutType: recommendation
    title: Public-evidence call
    body: >-
      Treat Reka as a strategically interesting company that still needs
      economics and cap-table proof before a $1B entry can be underwritten.
    claimRefs: [CV001, CV002, CV011, CV012]
  - calloutType: risk
    title: Most important kill criteria
    body: >-
      A flat or down round before hard commercial disclosure, or a failure to
      refresh the flagship product story beyond Edge and research releases,
      would materially weaken the investment case.
    claimRefs: [CV007, CV008, CV009, CV012]
