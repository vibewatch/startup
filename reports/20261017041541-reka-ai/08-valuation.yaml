  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-economics
      missingEvidence: Audited 2025-2026 revenue, ARR mix, gross margin, burn, runway, and compute-cost disclosures.
      whyItMatters: Without operating economics, the last private mark cannot be tested against recurring-software or infrastructure-style valuation logic.
      diligencePath: Request board-level financials plus product-line gross-margin bridges and compute-cost breakdowns in the data room.
      relatedQuestionRefs: [QV008]
      relatedTableRefs: [TV003]
    - type: private-evidence-only
      severity: material
      topic: preference-stack
      missingEvidence: Exact post-money cap table, investor rights, liquidation preferences, debt or project-finance claims, and any structured downside protection from the 2025 round.
      whyItMatters: Entry price alone does not show expected outcomes if insiders have materially different economics from new investors.
      diligencePath: Obtain the financing documents, cap table, and side-letter summary before underwriting any primary or secondary purchase.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: commercial-proof
      missingEvidence: Independent evidence on paid customer count, concentration, retention, direct-versus-channel revenue mix, and production usage depth.
      whyItMatters: Named users and partners signal relevance, but they do not prove repeatable revenue quality at the current valuation anchor.
      diligencePath: Ask for cohort retention, ACV distribution, top-customer share, and reference calls with customers not introduced solely by the company.
