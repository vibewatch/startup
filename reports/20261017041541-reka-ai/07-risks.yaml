chapter:
  number: 7
  title: "Risks"
  summary: >-
    The highest residual risks are contractual and platform-delivery risks rather than a single disclosed
    legal event: enterprise use, dedicated capacity, and some sensitive deployments depend on Business Terms
    or bespoke agreements, while public materials also disclaim availability, preview stability, and full
    enterprise compliance packaging. Public evidence still supports a credible multimodal platform, but the
    combination of roadmap shift toward physical AI, revenue-capped downloaded weights, and thin public
    compliance evidence means the investment case stays diligence-heavy until Reka produces signed enterprise
    paper, operational commitments, and current security/compliance proof.
sections:
  - id: "ranked-risk-overview"
    title: "Ranked residual risk overview"
    body: >-
      The public-evidence risk picture is led by commercial gating and delivery dependence, not by a named
      lawsuit or regulator action in the retained source set. Reka's own terms push enterprise and
      commercial use into Business Terms, carve out dedicated compute and public-safety/security deployments
      into separate agreements, and disclaim guaranteed model or region availability. Independent reviews add
      the second-order risk that enterprise compliance material remains thin in public and that some
      capabilities are gated to enterprise agreements, which increases the chance that diligence fails only
      after technical evaluation is already underway. A third residual risk is strategy and roadmap drift:
      Reka's 2026 public surface leans heavily toward research previews, world models, and edge deployment,
      while one independent profile notes no 2026 refresh for the broader Flash/Core family and a revenue cap
      on downloaded Reka Edge commercial use. For an investor, the practical implication is that contract
      review, capacity commitments, and product-roadmap validation are kill-criteria items rather than
      clean-up work after pricing is discussed.
    claimRefs: ["CR001", "CR002", "CR004", "CR006", "CR011", "CR012", "CR013", "CR014", "CR015"]
    figureRefs: ["FR001"]
  - id: "legal-regulatory-and-licensing"
    title: "Legal, regulatory, and licensing risk is more about scope control than disclosed enforcement"
    body: >-
      The retained public evidence does not show an active enforcement action or headline litigation event,
      so the current legal risk case is driven by contract scope, licensing boundaries, and use restrictions.
      Reka's published individual terms make the API non-commercial under that agreement, route enterprise
      users to Business Terms, and reserve dedicated compute and public-safety/security/government uses for
      separate contractual paths. The same terms treat research previews as beta-only and prohibit their use
      where failure could cause harm, which matters because the labs page prominently features a 2026 research
      preview and edge/physical-AI positioning. Independent analysis adds a sharper licensing risk for
      downloaded Edge deployments by saying the published license permits commercial use only for
      organizations below $1M in annual revenue. That does not block hosted or bespoke enterprise
      deployments, but it does mean an investor should not underwrite the local/open-weight deployment story
      until the exact production license, liability allocation, and safety-use approvals are documented.
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR005", "CR011", "CR013"]
    tableRefs: ["TR001"]
  - id: "operational-platform-and-security"
    title: "Operational risk clusters around availability, third-party dependence, and thin public assurance"
    body: >-
      Operationally, Reka's own terms are explicit that availability is not guaranteed at the model, GPU,
      region, or capacity level, and that customization jobs may fail or be interrupted. The delivery stack
      is also partner-dependent even when Reka is the commercial face: the docs say Reka runs requests on
      infrastructure it operates from the API to the GPUs, while the terms say that cloud services are hosted
      on third-party cloud and data-center providers and may expose third-party models whose separate terms
      still apply. That creates a layered failure mode in which platform incidents, supplier constraints,
      changing model listings, or license conflicts can all hit enterprise deployments. Independent sources
      sharpen the concern rather than resolving it: APIRank says public enterprise compliance documentation is
      less extensive and should be confirmed contractually, while WhatIf AI says some features are gated to
      enterprise agreements and the developer ecosystem is smaller than incumbent providers. The mitigation is
      straightforward but non-optional: obtain current SLA/DPA/security paperwork, validate uptime and queue
      behavior on the intended workload, and confirm which capabilities survive outside sales-led enterprise
      packaging.
    claimRefs: ["CR006", "CR007", "CR008", "CR009", "CR010", "CR014", "CR015"]
    tableRefs: ["TR002"]
  - id: "financial-and-thesis-break-triggers"
    title: "Financial and thesis-break triggers hinge on enterprise conversion and roadmap coherence"
    body: >-
      The public record does not yet support a clean underwriting case that Reka's technical breadth converts
      into enterprise-grade, repeatable economics without bespoke contracting. The platform and LLMIndex
      materials still position Reka as an enterprise-facing multimodal model provider, but independent reviews
      also point to a smaller ecosystem, gated enterprise-only features, and a lack of a permanent free tier,
      which raises customer-acquisition and proof-of-value friction versus better-known incumbents. More
      importantly, the 2026 public narrative is concentrated on research previews, edge, and physical AI;
      if the commercial revenue story still depends on Core/Flash-style general multimodal deployments, the
      burden is on management to show that those products remain roadmapped, supported, and contractible at
      scale. Investment-discipline kill criteria should therefore be measurable: failure to produce signed
      enterprise terms with acceptable liability and availability language, inability to show current
      compliance artifacts, or confirmation that meaningful enterprise deployment requires non-transferable
      bespoke economics would all weaken the case materially.
    claimRefs: ["CR010", "CR011", "CR012", "CR014", "CR015", "CR016"]
    tableRefs: ["TR003"]
