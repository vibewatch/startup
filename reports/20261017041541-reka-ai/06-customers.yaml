company:
  name: Reka AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows a clear two-track customer motion for Reka: prepaid developer access on one side and enterprise or government contracts with VPC, dedicated support, and multiple deployment paths on the other. Named proof exists, but it is still shallow - the public record points to AI Singapore, Shutterstock, and an Indonesian sovereign deployment while leaving customer count, renewals, and concentration undisclosed.
sections:
  - id: customer-motion
    title: Two-track customer motion
    body: >-
      Reka's public commercial surface is legible even though its scale is not. The retained sources show a self-serve path for developers through pay-as-you-go chat, research, and vision APIs, plus a separate enterprise path for businesses that need monthly invoicing, volume discounts, VPC eligibility, dedicated support, or committed infrastructure. Official terms also split individual and enterprise usage explicitly, with dedicated compute and certain public-safety, security, defense, and government deployments handled under business terms or another written agreement. That combination suggests the company is trying to convert developer experimentation into higher-commitment enterprise or sovereign deployments rather than relying on a broad consumer base.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: public-adoption-proof
    title: Public adoption proof is real but still narrow
    body: >-
      The strongest named proof in the retained pool comes from a small number of secondary sources rather than a large case-study library. Nextomoro says Reka has reported partnerships with AI Singapore, Shutterstock, and other enterprise customers, while Sterling charts one sovereign deployment through the Indonesian-language Reka Yasa program. Independent review coverage also points to repeated target segments - media, financial services, healthcare research, defense, and AI product teams - which is directionally useful for segmentation. What is missing is breadth: the public evidence shows that Reka has enough customer proof to establish relevance across enterprise and sovereign workflows, but not enough to infer broad deployment depth, repeatability, or account scale with confidence.
    claimRefs: [CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability and concentration remain under-disclosed
    body: >-
      The visible frictions are easier to document than the renewal curve. Independent reviews flag a smaller developer ecosystem than incumbent model vendors, some features gated to enterprise agreements, and a local-deployment story that is strongest for the smaller Edge footprint rather than the full frontier stack. Just as important, none of the retained public sources discloses customer count, NRR or GRR, churn, contract duration, or top-customer concentration. For diligence, that means the commercial motion is credible, but durability still depends on management evidence rather than desk research.
    claimRefs: [CU010, CU011, CU014, CU015]
