callouts:
  - calloutType: strength
    title: Commercial path is visible even without scale metrics
    body: >-
      Reka's public materials are unusually clear about how an account should move from self-serve API usage to higher-commitment enterprise or sovereign deployment.
    claimRefs: [CU001, CU003, CU004, CU005, CU013]
  - calloutType: risk
    title: Public proof is concentrated in a few named references
    body: >-
      The retained evidence establishes some real adoption, but it is concentrated in a handful of named relationships while independent reviews still flag ecosystem and packaging frictions.
    claimRefs: [CU006, CU009, CU010, CU011]
