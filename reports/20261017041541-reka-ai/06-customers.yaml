  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-durability
      missingEvidence: 2026 NRR, GRR, churn, renewal-rate, and contract-length data by customer type.
      whyItMatters: Without retention and renewal data, public evidence cannot distinguish repeatable enterprise usage from one-off pilots or partner-led launches.
      diligencePath: Request cohort, renewal, and contract-duration data in the data room and reconcile it to active paying-account counts.
      relatedQuestionRefs: [QU008]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer revenue share, sovereign-program concentration, and the split between direct sales and partner-mediated usage.
      whyItMatters: Concentration can materially change downside risk if a few lighthouse accounts or sovereign programs drive most of the visible traction.
      diligencePath: Ask management for top-10 customer concentration, reseller or partner mix, and any minimum-spend commitments tied to strategic accounts.
      relatedQuestionRefs: [QU010]
    - type: missing-source
      severity: material
      topic: named-customer-depth
      missingEvidence: Independent case studies or customer references that confirm production scope, measurable outcomes, and deployment breadth for named accounts.
      whyItMatters: The current public proof is enough to show relevance, but not enough to verify depth, expansion, or ROI for the named organizations.
      diligencePath: Obtain customer reference calls, procurement records, or independently published deployment writeups for AI Singapore, Shutterstock, and Indonesian sovereign programs.
      relatedQuestionRefs: [QU003, QU009]
      relatedTableRefs: [TU003]
