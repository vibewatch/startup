      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - [Ship multimodal chat or document workflows, Point an OpenAI client at api.reka.ai and select a hosted model, Hosted OpenAI-compatible API with first-party and third-party model options, Low integration friction for teams already standardized on OpenAI-style tooling, No assigned independent evidence on latency consistency or production uptime]
      - [Run perception or reasoning at the edge, Keep inference close to robot vehicle or device data, Reka Edge with local packaging and edge-focused positioning, Lower round-trip dependence and deployment flexibility for privacy-sensitive workloads, Weight license economics constrain many enterprise download scenarios]
      - [Customize model behavior on proprietary data, Move beyond prompt-only usage into tuned or dedicated capacity, Fine-tuning plus on-demand deployment, Better fit for domain-specific multimodal workloads than a pure shared endpoint, No prefetched trust or model-governance detail for fine-tuning controls]
      - [Operationalize video-heavy applications, Use one vendor for video understanding and downstream inference, Video-oriented multimodal models and edge media positioning, "Avoid stitching separate captioning, transcription, and reasoning systems", Current benefits are supported mainly by vendor-authored or low-reputation third-party descriptions]
    notes: >-
      Benefits summarize the assigned evidence only; where the pool lacks
      independent proof or control detail, the limitation column records the
      resulting diligence constraint.
    claimRefs: [CE001, CE003, CE006, CE009, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Multimodal encoder-decoder model stack, Processes text image video and audio while returning text output, Reka training stack and model-family maintenance, Current official product pages rely on older deep technical disclosure rather than fresh architecture docs]
      - [Tool-use and function-calling layer, Connects model reasoning to web search and code execution patterns, Reliable orchestration and guardrails around external tools, Assigned pool does not show safety controls or production governance for tool use]
      - [Serving plane, Exposes hosted inference through an OpenAI-compatible API and dedicated deployments, GPU scheduling billing and tenant-isolation machinery, No prefetched SLA observability or incident evidence]
      - [Training and infrastructure layer, Supplies model training and inference compute across H100 A100 and A10 fleets, Access to vendor clusters Kubernetes and storage orchestration, Hardware and provider variability were explicitly disclosed in the 2024 report]
    notes: >-
      Architecture rows blend historical technical-report disclosures with
      current commercial surfaces; null trust details are treated as diligence
      gaps rather than assumed controls.
    claimRefs: [CE002, CE007, CE008, CE009, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Reka's current architecture layers developer access and deployment
      choices above a model family whose public emphasis has shifted toward
      Edge and labs research.
    data:
      layers:
        - label: Workload layer
          detail: Enterprise multimodal applications and physical-AI inference demand.
          modules:
            - Enterprise multimodal apps
            - Physical AI and edge workloads
        - label: Developer access layer
          detail: Familiar OpenAI-style entry points for integration and testing.
          modules:
            - Hosted OpenAI-compatible API
            - Quickstart, playground, API reference, and Discord
        - label: Shared inference layer
          detail: Serverless hosted catalog that mixes Reka and third-party models.
          outputs:
            - Reka Flash 3
            - Reka Edge 2603
            - Selected open-model endpoints
        - label: Dedicated deployment layer
          detail: Custom capacity and tuning paths for enterprise buyers.
          modules:
            - Fine-tuning
            - On-demand deployments billed by GPU time
        - label: Edge execution layer
          detail: Device-side or local deployment where Edge packaging and license fit.
          modules:
            - HF + vLLM packaging
            - Robotics, automotive, wearables, and video workloads
        - label: Core systems layer
          detail: Historical multimodal model and serving primitives behind the stack.
          modules:
            - Modular encoder-decoder multimodal architecture
            - Tool use with web search and code execution
            - Kubernetes plus custom A10 and A100 inference stack
    approximationNotes: >-
      The stack combines current official commercial surfaces with historical
      technical-report disclosures because the assigned pool does not include a
      newer end-to-end architecture explainer.
    claimRefs: [CE004, CE005, CE007, CE008, CE009, CE013]
callouts:
  - calloutType: strength
    title: Deployment flexibility is the clearest product wedge
    body: >-
      Reka has a more differentiated story when the buyer cares about
      multimodal workloads that may need hosted inference, dedicated capacity,
      and edge or local execution from the same vendor family.
    claimRefs: [CE003, CE006, CE009, CE010]
  - calloutType: risk
    title: Public proof trails the marketing surface
    body: >-
      Current product claims outrun the independently corroborated diligence
      trail on benchmarks, controls, ecosystem depth, and operating-quality
      evidence.
    claimRefs: [CE011, CE012, CE013, CE014]
