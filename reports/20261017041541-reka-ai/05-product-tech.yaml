company:
  name: Reka AI
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Reka's current product surface is a multimodal delivery stack rather than a
    single flagship model story: a hosted OpenAI-compatible gateway, a
    still-commercial Flash line, a newly emphasized 7B edge model, and a labs
    organization now centered on world-model and physical-AI research. The
    technical posture is credible because Reka publicly described true
    multimodal training, custom serving infrastructure, and multiple deployment
    paths, but current public proof remains thin on independent benchmarking,
    security/compliance detail, and ecosystem depth.
sections:
  - id: product-surface
    title: Product surface has shifted from frontier-model branding to a multimodal deployment stack
    body: >-
      Reka is currently easiest to understand as a multimodal
      model-and-platform supplier. The official docs say the API serves Reka
      models and selected third-party open models through one OpenAI-compatible
      endpoint, while the platform page shows both shared serverless inference
      and dedicated on-demand deployments. That makes the product surface
      broader than a single foundation model SKU: buyers can consume hosted
      inference, ask for dedicated capacity, or evaluate edge deployment where
      the model and license permit it. The current hosted catalog also suggests
      the commercial front door is now a gateway plus first-party models, not
      just a research showcase. External commentary reinforces that
      interpretation, describing Reka as powerful raw model infrastructure
      rather than a fully packaged workflow product for nontechnical teams.
    claimRefs: [CE001, CE003, CE004, CE009, CE013, CE014]
    tableRefs: [TE001]
  - id: architecture-and-systems
    title: Core technical architecture remains credible, but the public details are anchored in older disclosures
    body: >-
      The most substantive public technical disclosure in the assigned pool is
      still Reka's 2024 report. That report describes a modular
      encoder-decoder multimodal stack that accepts text, image, video, and
      audio inputs, supports tool-use patterns such as web search and code
      execution, and runs on custom serving infrastructure backed by Kubernetes
      and GPU fleets. The same report also establishes the historical
      model-family logic: Edge and Flash were trained as dense multimodal
      models with materially different size and context tradeoffs. Current
      official surfaces still point to that same general architecture, but the
      newer labs page spends more visible space on research previews and edge
      deployments than on a refreshed frontier general model. Technically, that
      implies continuity of the multimodal core while the public roadmap
      emphasis has moved toward world-model and physical-AI use cases.
    claimRefs: [CE002, CE005, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-and-differentiation
    title: Deployment flexibility is the clearest product wedge, especially for edge and regulated workloads
    body: >-
      Reka's most defensible differentiation in the assigned evidence is
      deployment flexibility around multimodal workloads. Official pages market
      a hosted API, dedicated capacity, and local or device-side execution for
      Edge, while external profiles emphasize that on-premises and on-device
      options matter when video or audio cannot leave a controlled environment.
      Edge is the clearest expression of that strategy: the labs page presents
      it as a 7B vision-language model optimized for deployment, with packaging
      that can run through Hugging Face and vLLM and specific positioning for
      robotics, automotive, wearables, and real-time media. That is a useful
      wedge versus API-only vendors, but the evidence base is still mostly
      vendor-authored, so buyers should treat performance and usability claims
      as promising rather than independently verified.
    claimRefs: [CE006, CE009, CE010, CE011]
    tableRefs: [TE002]
  - id: maturity-controls-and-risks
    title: Public proof lags the product ambition on controls, ecosystem depth, and independent validation
    body: >-
      The assigned pool supports a positive view of Reka's technical ambition,
      but not a fully underwritten view of product maturity. The official
      surfaces expose responsible-AI, trust-center, privacy, and security
      navigation, yet the prefetched pages do not provide concrete control
      evidence such as certifications, data-retention commitments, uptime
      history, or incident reporting. The same gap appears on ecosystem and
      benchmarking. Reka offers familiar developer ergonomics and a browser
      playground, but the independent sources still describe a smaller
      ecosystem and thinner third-party proof than incumbent frontier
      platforms. As a result, the main product-technology risk is not that Reka
      lacks a coherent architecture; it is that the public diligence trail for
      current operating quality, governance, and real-world production
      referenceability remains incomplete.
    claimRefs: [CE011, CE012, CE013, CE014]
