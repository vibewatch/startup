      - [Rho-1 research preview, Advanced design partners and researchers, Research preview rather than GA commercial SKU, Signals roadmap toward omni reasoning and world-language-action systems, No public pricing packaging or deployment evidence in assigned pool]
      - [Reka Gateway / developer platform, API developers and procurement owners, Current commercial entry point, OpenAI-compatible API plus serverless and on-demand deployment choices, "Assigned pool does not show SLA, observability, or isolation specifics"]
    notes: >-
      Product status is based on current official pages and the assigned
      external profiles; row-level maturity reflects what is publicly
      evidenced, not an inferred internal roadmap.
    claimRefs: [CE003, CE004, CE005, CE006, CE013, CE014]
