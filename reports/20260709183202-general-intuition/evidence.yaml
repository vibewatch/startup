evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Public board roster, committee structure, investor control rights, and independent-director disclosures.
    whyItMatters: >-
      Without the governance map, investors cannot judge founder control, board independence, or downside protection on
      a multibillion-dollar entry price.
    diligencePath: >-
      Request the board list, charter package, current cap table, and major financing documents directly from the
      company or lead investors.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Named customers, API contract terms, usage metrics, and any revenue or ARR data tied to the selective partner
      program.
    whyItMatters: >-
      The public story is still thesis-heavy; without customer and monetization evidence the underwriting case remains
      mostly on data moat and talent.
    diligencePath: >-
      Ask management for pilot contracts, customer references, API usage logs, and an internal commercialization roadmap
      with revenue assumptions.
    relatedQuestionRefs:
      - QO020
      - QO025
    relatedTableRefs:
      - TO001
      - TO004
  - type: conflicting-data
    severity: minor
    topic: data-scale
    missingEvidence: A current company-certified Medal monthly active user figure and methodology for clip-volume reporting.
    whyItMatters: >-
      The size and freshness of the proprietary dataset is central to the investment thesis, so conflicting MAU numbers
      weaken precision on the moat narrative.
    diligencePath: >-
      Request the latest internal KPI deck or auditable platform analytics showing MAU, uploads, retention, and usable
      training volume.
    relatedQuestionRefs:
      - QO013
      - QO023
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: thesis-risk
    missingEvidence: >-
      Independent benchmark or customer evidence showing gameplay-first pretraining improves real-world robotics or
      embodied-agent performance at production scale.
    whyItMatters: >-
      This is the core transfer claim behind the company’s valuation; without outside proof the thesis remains promising
      but unproven.
    diligencePath: >-
      Request benchmark notebooks, customer evaluation data, and side-by-side ablation studies comparing
      gameplay-pretrained models with conventional robotics baselines.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: sam-som-estimation
    missingEvidence: >-
      A third-party market report that isolates gameplay-first world-model or agent-training software as a standalone
      category with defensible SAM/SOM numbers.
    whyItMatters: >-
      Current GI-specific SAM and SOM are editorial estimates derived from overlapping markets, which is directionally
      useful but too soft for valuation underwriting on its own.
    diligencePath: >-
      Ask investors or management for internal market maps, pipeline data, or customer-budget bottoms-up models that
      reconcile target verticals, ACVs, and timing assumptions.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: roi-benchmarks
    missingEvidence: >-
      Named customer pilots, conversion rates, and ROI benchmarks showing General Intuition improves outcomes versus
      open-source simulation or in-house baselines.
    whyItMatters: Without measured ROI, market demand can be real in theory while monetization remains speculative in practice.
    diligencePath: >-
      Request pilot scorecards, benchmark notebooks, and customer interviews that compare GI-enabled workflows with
      status-quo tooling.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
      - TM004
  - type: stale
    severity: minor
    topic: deployment-mix
    missingEvidence: More recent 2026 customer disclosure on whether GI buyers prefer cloud, on-premise, or hybrid deployment modes.
    whyItMatters: Deployment architecture influences gross margin, sales friction, and which customer segments are reachable first.
    diligencePath: >-
      Ask management for the current deployment mix by segment and whether regulated buyers require private or
      on-premise inference.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: material
    topic: competitive-set
    missingEvidence: >-
      Public documentation for stealth, region-specific, or enterprise-only world-model entrants beyond the visible
      English-language set reviewed here.
    whyItMatters: >-
      The competitor table is representative, but a thinner-than-observed public footprint can hide credible rivals or
      substitutes in applied robotics and simulation markets.
    diligencePath: >-
      Run a broader multilingual competitor sweep using venture databases, regional startup press, and conference
      exhibitor lists.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP001
