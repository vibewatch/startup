chapter:
  number: 4
  title: Financials
  summary: 'General Intuition’s public financial record is dominated by financing, not operations: the company disclosed a $320M Series A at a $2.3B valuation in June 2026, but it has not publicly disclosed revenue, pricing, gross margin, burn, or runway. The combination of premium talent hiring, frontier-model compute costs, and a selective API go-to-market suggests a capital-intensive early software business whose underwriting still depends on private evidence rather than public metrics.'
sections:
- id: revenue-model
  title: Revenue model, monetization surfaces, and current disclosure level
  body: 'General Intuition’s public commercialization story is still thin, but it is not invisible. The company’s homepage says it has onboarded first partners across games, simulation, and robotics to a commercial API. That matters because it points to a negotiated enterprise or partner-led revenue motion rather than a broad self-serve developer platform. TechCrunch’s June 25 coverage reinforces that interpretation: the company still needs to get its API into more customers’ hands to test use cases. In other words, the company appears commercially active, but early.


    What is missing is the pricing layer that would let an investor judge revenue quality. No public rate card, usage metric, or minimum commitment was found. That leaves four plausible monetization surfaces: selective API contracts, paid pilots, custom integration or fine-tuning work, and eventual recurring platform licensing once broader release arrives. All are credible for a frontier AI lab, but they have very different gross-margin and predictability implications. The financial read-through is that General Intuition has a visible path to revenue, but not yet a public path to predictable software revenue.'
