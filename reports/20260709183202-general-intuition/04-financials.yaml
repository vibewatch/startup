- id: capital-adequacy
  title: Capital adequacy, burn scenarios, and likely use of funds
  body: 'Because the company discloses financing but not cash burn, capital adequacy has to be bounded with scenarios. A low-case annual burn of roughly $60 million would imply about 64 months of runway from a standalone $320 million round; a mid-case $120 million annual burn would imply roughly 32 months; and a high-case $180 million burn would imply roughly 21 months. Those are not company disclosures, and they ignore prior cash balances, transaction costs, and strategic reserves. But they are useful bounds because the jobs data and public GPU pricing both indicate that a frontier-model company can scale expenses quickly.


    The most likely use-of-funds pattern is also fairly clear even without internal accounts: training and serving models, hiring expensive talent, strengthening data/security/compliance infrastructure, and converting selective technical partnerships into production revenue. Public evidence does not show debt, inventory finance, or plant buildout. So the core financial question is not whether the company is asset-heavy; it is whether its operating cash burn will stay within the window that $320 million buys before commercial conversion becomes visible enough to support a later round or internal sustainability.'
