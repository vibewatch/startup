- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: 'The public evidence supports a simple but important conclusion. General Intuition looks well financed, technically ambitious, and organizationally expensive. It does not look publicly underwritable on conventional software metrics yet. There is no visible revenue base, no ACV, no gross-margin disclosure, no burn, no contracted backlog, and no customer concentration data. Even the legal and entity picture is more complex than the user prompt implies, with Dutch reporting pointing to a Naarden-held IP structure and multinational operating footprint.


    That does not make the company financially weak. It makes it financially opaque. The positive case is that $320 million of fresh capital at a $2.3 billion valuation gives the company time to prove a narrow beachhead. The risk case is that compute intensity, premium talent cost, and enterprise adoption friction could outrun commercialization if the selective API motion does not turn into sticky production revenue fast enough. The minimum next diligence step is private evidence: management accounts, pricing decks, contract cohorts, and board runway materials.'
