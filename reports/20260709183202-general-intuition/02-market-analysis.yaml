  summary: General Intuition’s relevant opportunity narrows sharply from broad physical-AI adjacencies to the smaller overlap market that matches its current product posture.
  data:
    items:
    - label: Broad adjacencies (2026)
      value: $20B–$34B+
      description: AI in robotics (~$20.4B 2025 at 32% CAGR) and broad digital twin ($33.97B in 2026) show how large the parent categories are, but they include substantial non-addressable spend.
    - label: Core software proxies (2026)
      value: $2.5B–$7.6B
      description: AI world models (~$2.5B estimated from Kaiso 2025 base), AI-powered simulation & digital twins ($6.89B), and robotics simulation ($7.58B) better match the software layer GI is trying to sell.
