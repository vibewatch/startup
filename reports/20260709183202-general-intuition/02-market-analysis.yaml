  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-som-estimation
    missingEvidence: A third-party market report that isolates gameplay-first world-model or agent-training software as a standalone category with defensible SAM/SOM numbers.
    whyItMatters: Current GI-specific SAM and SOM are editorial estimates derived from overlapping markets, which is directionally useful but too soft for valuation underwriting on its own.
    diligencePath: Ask investors or management for internal market maps, pipeline data, or customer-budget bottoms-up models that reconcile target verticals, ACVs, and timing assumptions.
    relatedQuestionRefs:
    - QM007
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: roi-benchmarks
    missingEvidence: Named customer pilots, conversion rates, and ROI benchmarks showing General Intuition improves outcomes versus open-source simulation or in-house baselines.
    whyItMatters: Without measured ROI, market demand can be real in theory while monetization remains speculative in practice.
    diligencePath: Request pilot scorecards, benchmark notebooks, and customer interviews that compare GI-enabled workflows with status-quo tooling.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
    - TM004
  - type: stale
    severity: minor
    topic: deployment-mix
    missingEvidence: More recent 2026 customer disclosure on whether GI buyers prefer cloud, on-premise, or hybrid deployment modes.
    whyItMatters: Deployment architecture influences gross margin, sales friction, and which customer segments are reachable first.
    diligencePath: Ask management for the current deployment mix by segment and whether regulated buyers require private or on-premise inference.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
