company:
  name: General Intuition
chapter:
  number: 2
  title: Market Analysis
  summary: 'General Intuition sits at the overlap of several fast-growing but differently scoped markets: AI world models, AI-powered simulation and digital twins, AI in robotics, and AI in/for games. The broad adjacencies are large, but the company’s actual near-term serviceable market is much narrower—best understood as low-single-digit-billions software spend for agent-training, simulation, and embodied-AI infrastructure rather than the full tens-of-billions parent markets cited by broad digital-twin or robotics reports.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and status-quo substitutes
  body: 'General Intuition is easy to misclassify because its narrative touches gaming, robotics, synthetic data, and world-model research at the same time. The company’s own materials frame it as a lab building systems that act across space and time, with first partners across games, simulation, and robotics. That means its true category is not “AI in games” alone and not “robotics software” alone. The most accurate boundary is a software layer spanning world-model training platforms, synthetic-data and simulation infrastructure, and agent APIs for systems that must perceive, predict, and act. Kaiso’s market definition for AI world models is the closest direct category because it explicitly includes foundation world models, simulation engines, synthetic-data platforms, and development frameworks for robotics, autonomous vehicles, industrial automation, and digital twins.


    Included spend therefore covers world-model APIs, embodied-agent training platforms, synthetic-data tooling, and simulation infrastructure that can teach or evaluate agents. Excluded spend is just as important. General-purpose LLM subscriptions, pure robot hardware, and traditional creative or game-engine tooling do not belong in the same market unless they are directly providing the agent-training or world-model layer. MuJoCo, robosuite, Isaac Sim, and Infinigen are especially important as status-quo substitutes because they already solve pieces of the job with open or low-cost toolchains. Those existing tools mean General Intuition must show that a gameplay-trained world-model stack adds something buyers cannot cheaply recreate with existing simulation software and internal engineering effort.'
