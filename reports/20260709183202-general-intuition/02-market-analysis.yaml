- id: TM004
  title: Growth drivers and constraints table
  columns:
  - factor
  - type
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Training-environment scarcity for embodied agents
    - driver
    - positive
    - 2026–2028
    - DeepMind and NVIDIA both validate demand for more simulation-rich agent training environments
    - How much of GI’s roadmap directly improves training-environment quality versus only world-model demos?
  - - Digital-twin and simulation software expansion
    - driver
    - positive
    - 2026–2030
    - Industrial software budgets are increasingly willing to pay for scenario testing, optimization, and predictive systems
    - Which existing digital-twin or industrial vendors are the most realistic channel partners?
  - - Gaming AI commercialization
    - driver
    - positive
    - 2026–2030
    - Gaming provides a nearer-term segment where GI’s data origin is easiest to explain to buyers
    - Can GI land named game-studio or tooling customers before broader robotics adoption matures?
  - - Automation and AI-in-robotics growth
    - driver
    - positive
    - 2026–2033
    - Broader embodied-AI capital formation increases willingness to test new training and policy infrastructure
    - How tightly is GI aligned with high-spend robotics segments such as logistics, manufacturing, or autonomy?
  - - Sim-to-real gap
    - constraint
    - negative
    - 2026–2029
    - The market will punish visually impressive systems that cannot improve real-world outcomes
    - What benchmark or customer evidence proves gameplay pretraining transfers to robots or autonomy stacks?
  - - Open-source and incumbent simulation competition
    - constraint
    - negative
    - current
    - Free tools keep willingness to pay under pressure for many research and early engineering use cases
    - What proprietary layer is strong enough to displace MuJoCo, Isaac Sim, or internal toolchains?
  - - Integration, safety, and compliance burdens
    - constraint
    - negative
    - current
    - Enterprise adoption slows when workflows touch safety-critical or regulated operations
    - What governance, security, and deployment controls does GI offer for industrial or mobility customers?
  - - Compute intensity and data scarcity
    - constraint
    - negative
    - current
    - World-model and embodied-AI platforms favor labs with significant GPU budgets and proprietary data
    - How much structural leverage does Medal’s dataset provide relative to the capital required to exploit it?
  notes: Timing is directional rather than numerical; the table emphasizes which forces are likely to matter most to GI’s next two years of adoption and valuation support.
