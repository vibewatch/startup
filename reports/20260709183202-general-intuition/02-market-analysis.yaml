- id: drivers-and-constraints
  title: Growth drivers, constraints, and what could slow adoption
  body: 'Several 2026 forces clearly support demand. DeepMind explicitly says the supply of rich training environments has been a bottleneck for embodied agents, while NVIDIA markets Cosmos as infrastructure for robot learning, world simulation, and synthetic data generation. Market reports on AI-powered simulation, digital twins, robotics, and gaming AI all point in the same direction: buyers want more automation, more simulated scenarios, and more software-defined workflows. 360iResearch’s robotics simulation outlook is especially useful because it shows the category moving from offline engineering tools toward integrated digital-engineering ecosystems tied to digital twins, AI validation, and virtual commissioning. In that world, a differentiated data source such as Medal’s gameplay corpus can matter if it genuinely lowers the cost of building robust agent behaviors.


    The brakes are just as real. The arXiv survey on 3D generation for embodied AI says physically grounded, interaction-ready content is still hard to produce, and the sim-to-real divide remains unresolved. MIT Technology Review’s skeptical survey of world models makes the same broader point: the field is promising but still unreliable in real-world settings. Deloitte adds the enterprise adoption perspective—legacy integration, safety, compliance, infrastructure readiness, workforce skills, and ROI uncertainty all slow deployment. Fortune’s digital twin market report adds security and interoperability concerns. Put together, the constraint set means General Intuition’s market can grow quickly without converting into equally quick revenue recognition. The company is operating in a market that is real, strategic, and expanding, but still early enough that buyer education and proof-of-value are likely to be as important as raw model capability.'
