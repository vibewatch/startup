callouts:
- calloutType: strength
  title: The market is real, but the relevant part is narrower than the pitch deck ceiling
  body: The evidence clearly supports a real and expanding market for world models, simulation, and embodied-AI infrastructure. The analytical mistake would be underwriting General Intuition against the broadest digital-twin or AI-robotics TAMs rather than the smaller slice that matches its current selective API and partner-led posture.
  claimRefs:
  - CM006
  - CM007
  - CM011
  - CM014
- calloutType: risk
  title: Adoption hinges on proof of transfer, not just proof of intrigue
  body: Nearly every source agrees that world models and synthetic data matter. The missing proof is whether General Intuition’s gameplay-first approach improves real robotics, industrial, or autonomy outcomes enough to displace existing simulation stacks and justify enterprise budgets.
  claimRefs:
  - CM020
  - CM021
  - CM034
  - CM040
