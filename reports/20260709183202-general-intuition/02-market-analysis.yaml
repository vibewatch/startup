- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer / payer
  - relevance to General Intuition
  rows:
  - - AI world models
    - Foundation world models, simulation engines, synthetic-data platforms, development frameworks
    - Commodity LLM subscriptions; generic cloud compute sold without model layer
    - AI labs, robotics developers, AV teams, industrial software vendors
    - Closest direct category because it explicitly includes world-model software and platform layers
  - - AI-powered simulation and digital twins
    - Digital twin platforms, simulation software, AI operational optimization, 3D modeling tools
    - Most hardware, IoT devices, and non-AI enterprise systems
    - Manufacturing, logistics, asset-intensive industrial operators
    - Useful functional proxy for GI’s simulation value proposition, but broader than GI’s current software scope
  - - AI in robotics / physical AI
    - Perception, planning, control, fleet and policy software for AI-enabled robots
    - Robot hardware, sensors, actuators, non-AI mechanical automation
    - Robot OEMs, warehouse operators, healthcare and manufacturing users
    - Large adjacency for embodied-agent demand, but much broader than GI’s current selective API posture
  - - Generative AI in gaming / AI in games
    - NPC intelligence, scenario generation, level creation, creator tooling, game AI systems
    - Traditional game engines, static asset pipelines, non-AI content tools
    - Game studios, developers, designers, creators
    - Relevant because GI’s data origin and early product story are gaming-linked, but this is not the whole destination market
  - - Status-quo simulation toolchains
    - Open or low-cost tools such as MuJoCo, robosuite, Isaac Sim, Infinigen and internal workflows
    - Full proprietary agent platforms beyond point-tool use
    - Researchers and engineering teams already running simulation pipelines
    - These substitutes define the incumbent baseline General Intuition must beat on fidelity, speed, or data leverage
  notes: The company’s true category is the overlap across these segments rather than any single market report bucket.
