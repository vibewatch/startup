- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - user
  - payer / budget owner
  - adoption trigger
  - what General Intuition must prove
  rows:
  - - Game studios and AI-native tooling teams
    - Game studio leadership, AI tools vendors, technical art organizations
    - Gameplay AI engineers, technical artists, content teams
    - Development tools, platform, or content budgets
    - Need faster scenario generation, NPC behavior, or interactive sandboxing
    - That action-labeled gameplay data makes agents or tools better than existing game-AI workflows
  - - Robotics startups and OEMs
    - CTO, VP Research, robotics platform leads
    - Policy-learning, simulation, and autonomy engineers
    - R&D, platform, or venture-funded engineering budgets
    - Need cheaper, broader training environments and rare edge-case data
    - That GI’s pretraining transfers to robotics with better cost-fidelity trade-offs than existing synthetic-data pipelines
  - - Industrial digital twin and simulation vendors
    - Product leaders, industrial software teams, digital transformation groups
    - Simulation, operations, and analytics engineers
    - Transformation, operations, or software platform budgets
    - Need simulation, prediction, and scenario testing tied to real operations
    - That GI can integrate into industrial workflows with acceptable security, latency, and reliability
  - - Autonomy / mobility developers
    - Autonomy platform heads, AV/AMR software leaders
    - Perception, planning, and validation teams
    - Autonomy program and safety-validation budgets
    - Need synthetic edge cases and controllable environment testing
    - That GI’s models are useful beyond games and can support real validation regimes
  - - Selective API developers
    - Developers building apps or research tools on top of GI models
    - Product and research engineers
    - Engineering and experimentation budgets
    - Need programmable world-model or action-model access before full internal model build-out
    - That documentation, latency, and packaging are good enough for third-party integration
  notes: Segment economics vary materially; gaming buyers can trial faster, while robotics and industrial buyers usually need deeper fidelity and integration proof.
