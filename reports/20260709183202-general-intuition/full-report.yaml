      - number: '2.2'
        title: Evidence-constrained TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >-
              Public market data does not offer one clean analyst bucket for “gameplay-first agent infrastructure,” so
              the chapter has to build a sizing view from multiple lenses. The most directly relevant direct category is
              AI world models, which Kaiso values at $1.8 billion in 2025 growing to $52.7 billion by 2035 at a 40.2%
              CAGR. A second lens is AI-powered simulation and digital twins: The Business Research Company sizes that
              market at $6.89 billion in 2026, while Fortune Business Insights uses a much broader definition and
              arrives at $33.97 billion for digital twins in 2026. A third lens is AI in robotics, where Grand View
              estimates a $20.4 billion market in 2025 growing at 32% CAGR, implying a much larger adjacency than
              General Intuition can serve today. Finally, gaming-specific markets are materially smaller: The Business
              Research Company places generative AI in gaming at $2.21 billion in 2026 and AI in games broadly at $3.4
              billion.


              The key diligence point is that the biggest numbers are not the most relevant numbers. General Intuition
              is not selling the entire digital twin stack, all robot hardware, or the whole AI-in-games software
              universe. Its current product posture is selective API access and partner-led experimentation. That
              constrains the realistic current SAM to the overlap of world-model software, synthetic-data
              infrastructure, and embodied-agent training budgets—likely low single-digit billions rather than tens of
              billions. Near-term SOM is smaller again because enterprise adoption in robotics and industrial software
              remains slow, highly technical, and budget-owner specific. The market is unquestionably large enough to
              matter, but valuation underwriting should be anchored to the narrow overlap market, not the broadest
              parent category slides.
