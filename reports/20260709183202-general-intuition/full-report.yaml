      - number: '1.3'
        title: Funding, investor map, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The clearest hard datapoint in the public record is the June 2026 financing disclosure. TechCrunch, The
              SaaS News, DutchNews, The Robot Report, AI Insider, and TechFundingNews all converge on a $320 million
              Series A at a $2.3 billion valuation, bringing disclosed funding to about $454 million after the prior
              launch round in October 2025. Khosla Ventures is consistently named as the lead, while General Catalyst,
              Jeff Bezos, Eric Schmidt or Hillspire, and Nico Rosberg appear across the syndicate disclosures. Public
              investor pages add indirect corroboration: General Catalyst lists General Intuition as a portfolio company
              and Backed VC shows the business as seed-backed in 2025.


              What the public package does not fully reconcile is timing and geography. DutchNews says the Series A
              closed in January 2026 and was only publicized in June; TechCrunch's June 18 pre-announcement article said
              the company was then raising about $300 million at just over a $2 billion valuation. That sequence is
              compatible with a round that moved from in-market to closed to public announcement, but it also warns
              against over-reading single-timestamp articles. Location disclosure is equally mixed: TechCrunch and
              TechFundingNews repeatedly describe General Intuition as New York-based or centered on a New York lab,
              while DutchNews emphasizes that the company and IP remain Dutch and that offices also exist in Geneva,
              London, and Paris. The safest reading is that General Intuition is operationally centered in New York but
              legally anchored in the Netherlands, with a distributed research footprint.
