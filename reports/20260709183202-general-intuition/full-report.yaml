      - number: '6.3'
        title: Durability, expansion, and concentration are mostly public unknowns
        blocks:
          - type: paragraph
            body: >-
              Public retention quality is the weakest part of the chapter. No source reviewed discloses NRR, GRR, churn,
              renewal timing, contract length, or customer satisfaction. No third-party review surface like G2 or
              Gartner Peer Insights was found. The company may have excellent private retention, but public evidence
              does not show it. That forces the customer-quality analysis back onto structure. If the firm truly has
              only a handful of customers today, concentration risk is probably high and expansion likely depends on
              whether those early projects turn into repeatable workflows. Medal’s community and content network may
              help feed the top of the funnel over time, and Nerve-like data collection may create additional ecosystem
              lock-in, but those are future possibilities rather than current proof of recurring software revenue. For
              now, the customer base should be treated as promising but fragile: selective, technically demanding, and
              too lightly disclosed to underwrite durability.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU028
