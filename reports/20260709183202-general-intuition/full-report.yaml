              conventional software metrics yet. There is no visible revenue base, no ACV, no gross-margin disclosure,
              no burn, no contracted backlog, and no customer concentration data. Even the legal and entity picture is
              more complex than the user prompt implies, with Dutch reporting pointing to a Naarden-held IP structure
