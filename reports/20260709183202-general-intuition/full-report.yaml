      - number: '8.3'
        title: Bull, base, and bear scenario valuation ranges
        blocks:
          - type: paragraph
            body: >-
              Because there is no reliable public revenue denominator, scenario work should be milestone-based. A bear
              case around $0.6 billion to $1.2 billion assumes broader API rollout slips, customer proof stays thin, and
              the next financing occurs under tougher public-comp discipline. A base case around $1.4 billion to $2.2
              billion assumes the technical thesis remains credible and partner activity continues, but still discounts
              for missing economics, governance opacity, and regulatory risk. A bull case around $3.0 billion to $5.0
              billion assumes broader release, named production customers, clearer moat evidence from Medal-derived
              data, and enough differentiation against World Labs, DeepMind, OpenAI, NVIDIA, and Physical Intelligence
              to deserve a top-tier frontier premium. Under that framing, the current $2.3 billion round is not absurd,
              but it sits above the base-case midpoint and therefore asks investors to underwrite a meaningfully
              optimistic path before public evidence fully earns it.
