  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              General Intuition is easy to misclassify because its narrative touches gaming, robotics, synthetic data,
              and world-model research at the same time. The company’s own materials frame it as a lab building systems
              that act across space and time, with first partners across games, simulation, and robotics. That means its
              true category is not “AI in games” alone and not “robotics software” alone. The most accurate boundary is
              a software layer spanning world-model training platforms, synthetic-data and simulation infrastructure,
              and agent APIs for systems that must perceive, predict, and act. Kaiso’s market definition for AI world
              models is the closest direct category because it explicitly includes foundation world models, simulation
              engines, synthetic-data platforms, and development frameworks for robotics, autonomous vehicles,
              industrial automation, and digital twins.


              Included spend therefore covers world-model APIs, embodied-agent training platforms, synthetic-data
              tooling, and simulation infrastructure that can teach or evaluate agents. Excluded spend is just as
              important. General-purpose LLM subscriptions, pure robot hardware, and traditional creative or game-engine
              tooling do not belong in the same market unless they are directly providing the agent-training or
              world-model layer. MuJoCo, robosuite, Isaac Sim, and Infinigen are especially important as status-quo
              substitutes because they already solve pieces of the job with open or low-cost toolchains. Those existing
              tools mean General Intuition must show that a gameplay-trained world-model stack adds something buyers
              cannot cheaply recreate with existing simulation software and internal engineering effort.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM025
              - CM033
              - CM035
