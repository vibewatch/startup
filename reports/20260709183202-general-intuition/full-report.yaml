      - number: '1.4'
        title: Milestones, early commercialization, and open risks
        blocks:
          - type: paragraph
            body: >-
              The company's short public history is unusually compressed. Medal was founded in 2015, OpenAI reportedly
              tried to buy that dataset in late 2024, General Intuition spun out in October 2025, and by June 2026 it
              had already announced a $2.3 billion valuation and public research output via MIRA. TechCrunch's
              post-funding profile adds operational color: the same model family was shown powering a game-playing agent
              and a quadruped robot, and management said only a few minutes of real-world data were needed for
              fine-tuning. The company also launched Nerve, a marketplace for collecting gameplay, labeling, and
              teleoperation data, and said broader API availability was targeted for the end of summer 2026.


              None of that eliminates the central diligence risk. Public sources prove that General Intuition has a
              differentiated data source and a fast-moving research organization, but they do not yet prove large-scale
              transfer from gameplay pretraining into robust real-world robotics or sustained commercial demand. MIT
              Technology Review's April 2026 world-model overview is the most useful skeptical counterweight: it argues
              that current AI still struggles in the physical world and that the world-model thesis remains more promise
              than settled capability. Public reporting also conflicts on Medal's current monthly active user base,
              citing both roughly 10 million and roughly 17 million users. Combined with the absence of disclosed
              revenue, board composition, customer names, or exact legal structure, that means the company overview
              should be treated as a high-conviction thesis with real evidence of momentum, not a fully de-risked
              operating story.
