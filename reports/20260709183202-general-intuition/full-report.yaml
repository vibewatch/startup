      - CE018
      - CE029
      - CE034
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: Public evidence is strongest on research capability and weakest on enterprise-hardening details.
    data:
      columns:
        - Public proof
        - Why confidence is that level
        - Main remaining gap
      rows:
        - label: Research lineage
          values:
            - High
            - Open papers, repos, and named prior projects are visible
            - Need direct benchmark translation into commercial outcomes
        - label: Interactive world-model demo
          values:
            - High
            - MIRA demo, paper, and repo are public
            - Demo is narrow and not a general platform proof
        - label: Commercial API existence
          values:
            - Medium
            - Homepage and coverage say partners are onboarded
            - No public docs, pricing, or endpoints
        - label: Enterprise trust / compliance
          values:
            - Low
            - Privacy and terms exist
            - No public security certifications or trust center
        - label: Broad deployment maturity
          values:
            - Low
            - Broader release is described as upcoming
            - No named production customers or SLA evidence
    approximationNotes: Maturity levels summarize public evidence rather than internal readiness metrics.
    claimRefs:
      - CE005
      - CE017
      - CE031
      - CE036
      - CE039
      - CE040
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      The visible journey moves from targeted partner outreach to embedded experimentation and, if successful, a broader
      rollout later in 2026.
    data:
      items:
        - label: Identify technical partner
          detail: Company screens for high-value game, simulation, or robotics teams
        - label: Selective API access
          detail: Only a small set of external teams receives early model access
        - label: Embedded iteration
          detail: GI learns from customer workflow and data while refining the model
        - label: Proof of deployment
          detail: Successful pilots would need to become repeatable references
        - label: Broader release
          detail: Management aims to widen access once the platform hardens
    approximationNotes: >-
      Stages are inferred from public partner language and roadmap statements rather than from a disclosed sales
      playbook.
    claimRefs:
      - CU002
      - CU003
      - CU006
      - CU026
      - CU035
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Public evidence shows strong top-of-funnel interest but limited public proof at the named production-customer
      stage.
    data:
      nodes:
        - id: a1
          label: Market interest
          detail: Investors, collaborators, and partners engage with the thesis
        - id: a2
          label: Selective partner intake
          detail: Partner form and direct outreach qualify candidate teams
        - id: a3
          label: Pilot or early deployment
          detail: A handful of customers or partners get API access
        - id: a4
          label: Named production proof
          detail: No public named paying customer proof yet
      edges:
        - - a1
          - a2
        - - a2
          - a3
        - - a3
          - a4
    approximationNotes: The final node marks a public-evidence gap rather than a known zero in private operations.
    claimRefs:
      - CU004
      - CU006
      - CU028
      - CU037
      - CU038
