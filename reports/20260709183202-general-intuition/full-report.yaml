      - number: '7.3'
        title: Dependencies on Medal, CoreWeave, and the founding team can transmit quickly into financing risk
        blocks:
          - type: paragraph
            body: >-
              The third risk cluster is dependency concentration. Public evidence ties General Intuition to three
              especially important external pillars: Medal as the visible data flywheel, CoreWeave as the named compute
              partner, and a founding team that still appears to carry most of the commercial and technical narrative.
              None of those dependencies is automatically bad. In fact, each is part of the bull case. The problem is
              that they reduce slack. A change in Medal access, a spike in compute cost, a delay in infrastructure
              availability, or a founder-level disruption could all hit product progress before the company has a broad
              public customer base to absorb the shock. Because broader release is still pending and customer disclosure
              is sparse, any execution slip is more likely to show up first as higher burn and weaker proof rather than
              as a temporary annoyance. For an investor, that makes organizational depth, compute economics, and
              data-control durability critical diligence items rather than secondary questions.
