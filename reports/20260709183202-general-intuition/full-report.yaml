              - CU038
      - number: '6.4'
        title: Customer verdict
        blocks:
          - type: paragraph
            body: >-
              The customer read on General Intuition is therefore asymmetric. It is better than a pure stealth story
              because multiple independent publications corroborate live selective partner activity across games,
              simulation, and robotics. It is worse than a conventional enterprise software story because those same
              publications stop short of naming customers, proving production use, or publishing retention metrics. The
              company’s strongest asset for customer development is not a reference roster but a supply-side ecosystem:
              Medal’s gameplay community, a differentiating training corpus, and collaborators willing to work on
              frontier demos. That may be enough to open doors with sophisticated technical buyers. It is not enough yet
              to conclude that General Intuition has de-risked customer quality or product-market fit. A realistic
              underwriting stance is therefore to treat customer development as a live experiment with encouraging
              inbound interest, not as a validated recurring-revenue engine. The next material diligence step is simple
              but private: logo list, deployment stage, contract structure, and reference calls. Public evidence remains
              thin.
            claimRefs:
              - CU001
              - CU004
              - CU007
              - CU022
              - CU031
