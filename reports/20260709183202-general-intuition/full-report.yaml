  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Broader release does not arrive
        - Selective access persists through the next planned expansion window
        - Bull case weakens and base case compresses
        - Move from active diligence to watchlist
      - - Named production customers do not emerge
        - Still no public or diligenced reference set after additional product cycles
        - Commercial proof remains too thin for premium pricing
        - Demand sharper price discount or step back
      - - Compute economics remain opaque or unattractive
        - Management cannot show plausible cost curve and margin path
        - Current price loses support because burn dominates value capture
        - Apply major valuation haircut
      - - Regulatory friction materially slows deployment
        - Export controls, AI Act mapping, or rights issues block key workflows or geographies
        - Scenario upside narrows and timelines extend
        - Re-underwrite TAM and timeline
      - - Next round resets price or structure
        - Flat/down/structured round signals weaker market support
        - Current mark no longer credible as anchor
        - Pause unless downside-adjusted terms improve materially
    notes: >-
      Triggers are designed to be monitorable over the next 6-18 months and to translate directly into investment action
      rather than vague concern.
    claimRefs:
      - CV022
      - CV033
      - CV041
      - CV043
      - CV044
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Customer proof
        - Named production customers, contract size, renewal behavior
        - Determines whether current price reflects real adoption or only narrative
        - Management, customer references, and pipeline review
      - - Compute economics
        - Training cost, inference cost, margin path, CoreWeave commitments
        - Capital intensity is central to whether upside accrues to equity
        - Finance lead, infrastructure lead, and vendor contracts
      - - Data rights
        - Full rights chain from Medal clips and metadata into model training and commercialization
        - Could be the highest hidden source of legal and moat risk
        - Legal diligence, DPA review, and intercompany agreements
      - - Capital structure
        - Share count, liquidation preferences, investor protections, and any side letters
        - Determines whether headline valuation translates into common-equity value
        - CFO or counsel and full cap-table review
      - - Regulatory map
        - Export-control assumptions, AI Act classification, privacy governance by use case
        - Necessary to underwrite timeline and international deployment risk
        - Policy counsel, product owners, and compliance workstream
    notes: >-
      These asks are intentionally mechanical. Without them, the debate over recommendation and valuation stance cannot
      move far beyond informed narrative judgment.
    claimRefs:
      - CV029
      - CV043
      - CV045
      - CV046
