      - number: '4.2'
        title: Organization buildout and likely cost structure
        blocks:
          - type: paragraph
            body: >-
              The best public cost clues come from the jobs pages. General Intuition and Medal are hiring across
              finance, infrastructure, security, data platform, game integrations, and senior technical staff.
              Base-salary bands cluster around $180,000 to $300,000 for many roles, while the Member of Technical Staff
              role ranges from $250,000 to $450,000 plus equity across multiple cities. Those numbers do not reveal
              headcount, but they strongly suggest a premium research-and-infrastructure payroll profile rather than a
              lightweight application start-up cost base.


              Compute is the other major cost center. World-model and embodied-AI systems are expensive to train and
              serve, and public infrastructure pricing supports that intuition. CoreWeave lists HGX H100 on-demand
              pricing at $49.24 per hour, while AWS’s P5 family is built around clusters of H100 or H200 GPUs and
              ultra-high networking. These benchmarks are not company-specific invoices, but they show why payroll plus
              cloud compute is likely the dominant expense pair. The upside is that General Intuition looks more
              opex-heavy than capex-heavy: no public evidence suggests manufacturing inventory or heavy fixed-asset
              requirements.
