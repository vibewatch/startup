      - number: '4.3'
        title: Financing facts, filing context, and what the official record actually proves
        blocks:
          - type: paragraph
            body: >-
              The most concrete public financial facts are about fundraising rather than operating performance.
              TechCrunch’s June 18 story reported General Intuition in talks to raise $300 million at around a $2
              billion valuation. By June 25, DutchNews and other outlets reported a disclosed $320 million round at a
              $2.3 billion valuation, with investors including Jeff Bezos, Eric Schmidt, Khosla Ventures, and General
              Catalyst. DutchNews also reported total funding of $454 million since October 2025. That is enough to
              establish major investor commitment and a fast-rising valuation, even though it says almost nothing about
              revenue quality.


              The official filing evidence is narrower than the press coverage. The directly fetched SEC Form D is for
              AVSF - General Intuition 2026, LLC, a Delaware pooled investment fund vehicle, with a $4.497 million
              offering sold to 93 investors. That is financially relevant because it shows a financing-adjacent vehicle
              tied to the round, but it is not an operating-company disclosure. It does not reveal General Intuition
              revenue, cash, burn, or contract quality. The chapter therefore uses the filing as corroboration of
              financing machinery, not as proof of company operating metrics.
