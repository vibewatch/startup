  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: Product delays and weak proof translate quickly into higher burn, financing need, and valuation pressure.
    data:
      nodes:
        - id: r1
          label: Model underperforms
          detail: Benchmarks or pilots fail to prove differentiation
        - id: r2
          label: Broader release slips
          detail: Selective access lasts longer than planned
        - id: r3
          label: Customer proof remains thin
          detail: Few logos, weak outcomes, high concentration
        - id: r4
          label: Compute burn stays high
          detail: Training and serving costs continue before scale revenue
        - id: r5
          label: Financing / valuation pressure
          detail: More capital needed at weaker proof point
      edges:
        - - r1
          - r2
        - - r2
          - r3
        - - r2
          - r4
        - - r3
          - r5
        - - r4
