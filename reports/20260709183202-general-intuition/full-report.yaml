  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation framework
        blocks:
          - type: paragraph
            body: >-
              General Intuition looks like a price-sensitive diligence story rather than a clean Buy on public evidence
              alone. The company is operating in a category that 2026 capital markets clearly reward: Stanford’s AI
              Index shows enormous private-AI funding, and comparable frontier labs like World Labs and Physical
              Intelligence have attracted multibillion-dollar marks. But the public record on General Intuition itself
              remains thin where valuation discipline matters most. Coverage still describes only a handful of
              customers, selective API access, and a heavy spend pattern centered on compute. There is no public revenue
              base, gross-margin profile, cap-table structure, or customer-retention data that would justify precision
              multiple work. That pushes the right framework away from simple narrative enthusiasm and toward scenario
              underwriting. On that basis, the current $2.3 billion post-money looks possible, but not comfortably
              supported. The most supportable call is Research-More / Track: keep the company in the funnel, but do not
              pay as though commercial proof and capital efficiency are already settled.
            claimRefs:
