  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Decision flow from category tailwind and technical promise to price discipline and recommendation.
    data:
      nodes:
        - id: tailwind
          label: Strong 2026 AI funding backdrop
          type: start
        - id: proof
          label: Is customer and economics proof already broad and public?
          type: decision
        - id: price
          label: Does $2.3B sit inside a comfortable base-case range?
          type: decision
        - id: buy
          label: Potential Buy
          type: end
        - id: track
          label: Research-More / Track
          type: end
        - id: avoid
          label: Avoid at current price
          type: end
      edges:
        - from: tailwind
          to: proof
          label: Category appetite is real
        - from: proof
          to: price
          label: Yes — if proof arrives
        - from: proof
          to: track
          label: No — current evidence is still thin
        - from: price
          to: buy
          label: Yes — if price or evidence improves
        - from: price
          to: avoid
          label: No — if premium persists without proof
    approximationNotes: >-
      The flow reduces a nuanced diligence process to the two gating questions that dominate this chapter: proof quality
      and price support.
    claimRefs:
      - CV011
      - CV012
      - CV035
      - CV036
      - CV039
      - CV050
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Current-value sensitivity to milestone attainment rather than to a public revenue multiple that is not actually
      known.
    data:
      items:
        - label: Severe reset
          value: 800
          detail: Rollout slips, proof remains thin, financing terms worsen
        - label: Bear midpoint
          value: 900
          detail: Low end of current underwriting if proof and economics disappoint
        - label: Base midpoint
          value: 1800
          detail: Technically credible but still under-disclosed company
        - label: Current round
          value: 2300
          detail: Market-clearing price in June 2026
        - label: Bull midpoint
          value: 4000
          detail: Broader release, named production customers, clearer moat
        - label: Top-end bull
          value: 5000
          detail: Frontier-AI premium approaching stronger private peer context
    approximationNotes: >-
      Values are USD millions and are milestone-adjusted analytical estimates, not management guidance or a
      revenue-multiple model.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV041
      - CV042
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Bear, base, and bull current-value bands supported by today's public evidence.
    data:
      items:
        - label: Bear
          low: 600
          mid: 900
          high: 1200
          detail: Financing reset or failed commercialization path
        - label: Base
          low: 1400
          mid: 1800
          high: 2200
          detail: Credible technical story, but incomplete operating proof
        - label: Bull
          low: 3000
          mid: 4000
          high: 5000
          detail: Named production proof and durable moat evidence arrive quickly
    approximationNotes: >-
      Values are USD millions and represent current-value bands rather than future exits, because dilution and structure
      are not public.
    claimRefs:
      - CV041
      - CV042
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scorecard across market, proof, moat, economics visibility, risk, and valuation support.
    data:
      items:
        - label: Market tailwind
          value: 9/10
          detail: 2026 AI funding environment remains unusually strong
        - label: Technical intrigue
          value: 8/10
          detail: World-model thesis is credible and strategically important
        - label: Customer proof
          value: 4/10
          detail: Selective partners are real, but named production proof is missing
        - label: Moat visibility
          value: 6/10
          detail: Medal linkage could be special, but rights and transfer are under-disclosed
        - label: Economics visibility
          value: 2/10
          detail: No public revenue, margin, or compute-cost curve
        - label: Evidence quality
          value: 4/10
          detail: Round price is clear; most underwriting drivers are not
        - label: Risk load
          value: 3/10
          detail: Competition, regulation, and capital intensity remain heavy
        - label: Valuation support
          value: 3/10
          detail: Current mark looks expensive relative to public-evidence base case
    approximationNotes: >-
      Scores are analytical judgments for investment-committee framing rather than standardized external ratings. Higher
      is better.
    claimRefs:
      - CV006
      - CV011
      - CV023
      - CV027
      - CV028
      - CV037
      - CV038
      - CV039
