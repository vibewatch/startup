        title: Exhibits
        blocks:
          - type: callout
            title: The strongest asset is not the demo, but the proprietary action-labeled dataset
            body: >-
              General Intuition's most defensible public edge is not yet a shipped mass-market product; it is the
              combination of Medal's first-person gameplay corpus and the action labels that tell the model what humans
              actually did. That data position is why investors backed a company with little public revenue disclosure
              at a multibillion-dollar valuation.
