              That does not make the company financially weak. It makes it financially opaque. The positive case is that
              $320 million of fresh capital at a $2.3 billion valuation gives the company time to prove a narrow
              beachhead. The risk case is that compute intensity, premium talent cost, and enterprise adoption friction
