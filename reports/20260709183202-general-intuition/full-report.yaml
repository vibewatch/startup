      - number: '3.4'
        title: 'Adverse evidence: commoditization, incumbent response, and category volatility'
        blocks:
          - type: paragraph
            body: >-
              The strongest disconfirming evidence is structural. MIT Technology Review argues that world models remain
              unreliable, which matters because category excitement can outrun enterprise value creation. Open tools
              such as MuJoCo, Habitat, ML-Agents, and ManiSkill keep improving; NVIDIA is open-sourcing large parts of
              the physical-AI stack; and frontier labs like DeepMind and OpenAI can move adjacent research into product
              with far more compute and distribution. That means General Intuition is simultaneously squeezed from above
              by giant labs and from below by commoditizing developer tooling.


              There is also real category volatility. OpenAI’s world-simulator framing validates the strategic
              importance of the area, but product packaging around video-generated worlds has already changed quickly,
              and creative-AI buyers can often solve immediate needs with simpler tools such as Luma or Rosebud instead
              of underwriting a deeper world-model platform. The adverse competitive case is therefore straightforward:
              General Intuition may be directionally right about the category and still lose economic power if the
              market standardizes around open infrastructure, if incumbents absorb the best features into broader
              ecosystems, or if customers decide the gameplay-first thesis is intriguing but not mission-critical.
            claimRefs:
