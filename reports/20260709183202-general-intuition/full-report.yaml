      - number: '3.2'
        title: Capability, packaging, and where each class of rival is strongest
        blocks:
          - type: paragraph
            body: >-
              The public product surfaces suggest a split market rather than one winner-take-all race. World Labs
              emphasizes spatial consistency, persistence, editable 3D worlds, and exportable outputs; Luma emphasizes
              fast creative execution across video, image, audio, and brand-aware content; NVIDIA emphasizes physical
              AI, synthetic data, and simulation infrastructure; DeepMind emphasizes research-grade world generation and
              agents rather than broad commercial packaging. General Intuition’s own public posture is narrower: a
              selectively released commercial API, early partners across games, simulation, and robotics, and a product
              story centered on action models grounded in gameplay data. That story is differentiated, but it is less
              packaged in public than World Labs’ Marble workflows or NVIDIA’s developer ecosystem.


              Pricing transparency is weak across the field. General Intuition does not publish rate cards, and neither
              do most direct world-model rivals. That reduces direct price comparison and shifts diligence toward
              packaging posture: open-source ecosystems reduce entry cost, selective APIs signal scarcity and
              experimentation, and creator tools can win adoption even without deeper model novelty if they make a
              workflow easier today. The competitive implication is that General Intuition is probably strongest when a
              buyer values the specific gameplay-to-action-data thesis, but weaker where the buyer mainly wants a
