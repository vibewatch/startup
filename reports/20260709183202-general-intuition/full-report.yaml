      - number: '8.4'
        title: Final diligence asks, thesis-break triggers, and exit posture
        blocks:
          - type: paragraph
            body: >-
              What moves this recommendation is straightforward. If private diligence can show a real customer roster,
              contract durability, a believable compute-cost curve, a clean training-data rights chain, and a cap table
              without punitive preference overhang, the valuation debate becomes much more favorable. If those answers
              do not appear, the company remains more compelling as a tracked frontier asset than as an immediate
              high-conviction entry. The thesis breaks on concrete events rather than abstract discomfort: missed
              broader release windows, continued absence of named production users, material export-control or AI-Act
              friction, or a financing reset that signals weaker internal confidence. Exit readiness is low because the
              public record still looks nothing like public-market disclosure norms. For now, the right stance is to
              stay engaged, but keep price discipline and diligence discipline tightly linked. Until then, underwriting
              should favor optionality over forced conviction. Price discipline remains essential.
            claimRefs:
