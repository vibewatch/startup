            title: The market is real, but the relevant part is narrower than the pitch deck ceiling
            body: >-
              The evidence clearly supports a real and expanding market for world models, simulation, and embodied-AI
              infrastructure. The analytical mistake would be underwriting General Intuition against the broadest
              digital-twin or AI-robotics TAMs rather than the smaller slice that matches its current selective API and
              partner-led posture.
            calloutType: strength
