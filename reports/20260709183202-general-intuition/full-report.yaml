          - type: callout
            title: Sparse customer disclosure makes concentration risk impossible to size precisely
            body: >-
              If the company truly serves only a handful of customers, any stalled pilot or delayed deployment could
              materially change early revenue quality. Public materials do not provide the cohort data needed to judge
              that risk.
