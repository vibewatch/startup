      - number: '8.2'
        title: Financing context, private references, and public-market brackets
        blocks:
          - type: paragraph
            body: >-
              The strongest thing one can say about price support is contextual rather than company-specific: frontier
              AI capital has remained abundant. Stanford documents a record funding backdrop, while World Labs and
              Physical Intelligence both show that private investors are still willing to assign multibillion-dollar
              values to world-model and embodied-AI stories before broad commercialization. That helps explain why
              General Intuition could command $2.3 billion. It does not prove the round is cheap. World Labs appears
              closer to visible productization through Marble and Autodesk, while Physical Intelligence has already
              raised more capital and is aiming at a much larger number. Public comps are also cautionary rather than
              comforting. C3.ai sits below General Intuition’s mark in public market cap terms, while Unity sits well
              above it—but both companies come with 10-K-level disclosure that lets investors judge reality rather than
              underwriting mostly from narrative. The comparison set therefore widens the plausible band without
              removing the need for entry discipline.
