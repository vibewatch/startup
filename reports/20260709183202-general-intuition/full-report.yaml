      - number: '1.2'
        title: Founders, research credibility, and governance opacity
        blocks:
          - type: paragraph
            body: >-
              Public reporting is consistent that General Intuition was founded by Pim de Witte together with Eloi
              Alonso, Adam Jelley, and Vincent Micheli. De Witte is the operating center of gravity: media coverage,
              investor profile pages, and conference biographies all identify him as founder and CEO of General
              Intuition as well as the founder or former CEO of Medal. His background combines gaming entrepreneurship
              with time spent in humanitarian work, a combination he uses to articulate both ambition and limits around
              the company's use of force. Eloi Alonso's personal site adds direct founder-market-fit evidence on the
              research side, describing him as a co-founder at General Intuition after PhD work in reinforcement
              learning and world models at the University of Geneva.


              The strongest independent proof that the founding team can publish frontier technical work is the 2026
              MIRA project, where Adam Jelley, Eloi Alonso, Vincent Micheli, and Pim de Witte all appear on the author
              list for a multiplayer world-model paper and open-source release produced with Kyutai and Epic Games. That
              helps validate that the company is more than a data-holding shell. Even so, governance disclosure is thin.
              Public pages list founders and investors, but not a formal board roster, independent directors,
              reserved-matter rights, or cap-table control terms. TechFundingNews says the company operates as a
              public-benefit corporation legally registered in the Netherlands, while DutchNews says its data and IP sit
              in a Dutch company in Naarden; those facts are directionally compatible but still leave the exact
              parent-subsidiary map and board structure underexplained.
