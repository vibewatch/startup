      - number: '3.3'
        title: Moat durability, switching cost, and multi-homing risk
        blocks:
          - type: paragraph
            body: >-
              General Intuition’s most credible public moat claim is not current distribution scale but input-data
              uniqueness. The company says it is training on billions of gameplay clips from Medal and turning that
              action-rich corpus into models that can perceive, predict, and act across virtual and physical settings.
              If that data really produces better action priors or planning behavior, it could matter. But the public
              evidence still stops short of showing hard lock-in. The company has not disclosed named production
              customers, benchmark deltas versus open or incumbent stacks, or workflow dependencies that would make
              switching painful. In contrast, NVIDIA already sits inside robotics developer workflows through Isaac Sim
              and related tooling, while World Labs has made its product surface more legible to creative and simulation
              users.


              That creates a high multi-homing environment. Developers can evaluate General Intuition for one use case,
              World Labs for another, and keep open-source simulators for the baseline workflow. Even inside a single
              organization, world generation, agent training, and production deployment may be sourced from different
              vendors. In that context, selective API access can help preserve scarcity and support careful onboarding,
              but it does not itself create switching cost. Durable advantage would require evidence that General
              Intuition’s data, tooling, or integration layer produces outcomes that are materially better than what
              buyers can obtain from open-source stacks or incumbent platforms.
