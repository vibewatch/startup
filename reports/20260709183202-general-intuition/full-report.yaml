        title: Exhibits
        blocks:
          - type: callout
            title: The commercial story is real but still low-resolution
            body: >-
              Independent coverage repeatedly confirms live selective partner activity. The problem is not total absence
              of customer motion; it is the absence of named, production-grade proof.
            calloutType: insight
            claimRefs:
