      - number: '5.4'
        title: Differentiation versus the category and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              General Intuition’s most defensible technical differentiator is not that it alone believes in world
              models, but that it combines world-model research with action-labeled gameplay data at scale. That puts it
              in a different place from DeepMind’s prompt-driven Genie 2 environments, Physical Intelligence’s
              robot-first π0 stack, Wayve’s structured driving simulation, World Labs’ spatial-intelligence
              productization, and NVIDIA’s broad physical-AI platform. The company’s advantage is that Medal data
              contains both observation and intent: video plus the exact player inputs that caused what happened next.
              If large action models become the key control layer for agents, that could matter a great deal. Still, the
              public evidence stops short of proving durable superiority. MIRA is impressive but narrow, and its own
              authors acknowledge replay failures, hidden-state problems, and open uncertainty around how far
              sim-to-real transfer will scale. Meanwhile, better-capitalized rivals already expose more public product
              detail, broader ecosystems, or clearer end-user workflows. So the product-tech read is favorable on talent
              and research execution, but cautious on broad product maturity and defensible deployment advantage.
