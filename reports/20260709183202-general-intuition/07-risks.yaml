- id: data-and-regulatory
  title: Data rights and regulation are manageable only with private controls that are not yet public
  body: 'The second risk cluster is legal and regulatory. General Intuition’s own privacy notice is unusually explicit that Medal data used for research and model development is governed by Medal’s policy and separate intercompany arrangements. That is helpful, but it also means the rights chain that matters most to the training corpus is not publicly transparent. Medal’s terms emphasize compliance with law and third-party rights, yet they do not by themselves answer whether every downstream training or commercialization use is contractually protected. At the same time, policy pressure is moving in multiple directions: export-control rules for advanced AI chips continue to change; the EU AI Act remains implementation-heavy even as rules are being simplified; and U.S. copyright and biometric regimes continue to evolve around AI training and sensitive data. None of these issues proves a near-term break. Together, however, they create a compliance stack that is much more demanding than the
    current public trust surface suggests. That makes regulatory readiness a dependency for sales, not a back-office cleanup task.'
  claimRefs:
