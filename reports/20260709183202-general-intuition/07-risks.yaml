- id: risk-verdict
  title: Risk verdict
  body: General Intuition does not look reckless so much as unfinished. The company has money, research credibility, and visible partner momentum. What it does not yet have in public is enough proof that its training-data rights, safety controls, security posture, customer durability, and post-demo product economics are all ready for scale. That gap matters more here than in a normal software startup because each missing control layer can interact with the others. A single missed milestone can become a product problem, a burn problem, and then a valuation problem. The investment case therefore depends on whether private diligence closes the gap between technical promise and operating proof fast enough to outrun the category’s competitive and regulatory drift. In practice, this is a diligence-heavy story, not a public-materials-only conviction story.
  claimRefs:
  - CR030
  - CR031
  - CR037
  - CR038
  - CR040
  - CR041
  - CR042
