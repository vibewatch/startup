- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Product differentiation
    - No named production customer or externally credible benchmark win
    - Still absent after the next major rollout window
    - Move from active underwriting to watchlist
  - - Training-data rights
    - Company cannot evidence a clean rights chain for training and commercialization
    - Missing licenses, provenance controls, or opt-out path
    - Pause diligence or require strong indemnity discount
  - - Compute economics
    - No credible path to acceptable unit economics
    - Training / inference costs remain opaque or structurally uneconomic
    - Apply steep valuation haircut
  - - Customer concentration
    - Too much proof rests on too few pilots
    - One partner dominates reference value or pilot revenue
    - Treat revenue quality as fragile and non-repeatable
  - - Leadership concentration
    - Founder or core research leader departs before platform maturity
    - Unexpected departure or role disruption
    - Re-underwrite the thesis from scratch
  - - Regulatory blockage
    - Export-control or AI Act changes materially constrain target deployment
    - Key geography or workflow becomes operationally blocked
    - Reduce TAM and timeline assumptions materially
  notes: These triggers are designed to be monitorable in diligence and over the next 12 months, not as abstract long-run warnings.
