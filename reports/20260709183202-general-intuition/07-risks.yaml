chapter:
  number: 7
  title: Risks
  summary: General Intuition’s largest risks come from the interaction of frontier-technology uncertainty, reliance on external data and compute, and a still-forming regulatory perimeter. The company has credible technical momentum and capital, but public mitigations remain materially thinner than the scale of the commercial and legal bet.
sections:
- id: competition-and-timeline
  title: The core thesis is crowded, capital-intensive, and still early
  body: 'The first risk is that General Intuition is trying to win in a category that is already validated by much larger or better-capitalized actors. DeepMind, OpenAI, NVIDIA, Physical Intelligence, and World Labs all publish adjacent narratives around world models, embodied control, or physical-AI infrastructure. That validates demand for the category, but it also compresses the window in which a new entrant can turn technical novelty into durable pricing power. General Intuition’s public release posture still looks selective: only a few partners, a staged API rollout, and no broad public proof of production usage. That means the company must solve two hard problems at once—prove its models generalize beyond a narrow demo surface, and do so before competitors or platforms make comparable functionality easier to buy. The resulting timeline risk is not just technical. If rollout slips, commercialization and financing risk compounds quickly because the company is already committed to compute-heavy
    scaling.'
  claimRefs:
