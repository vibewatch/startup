    diligencePath: Request sandbox access, docs, changelog history, and integration guides used by current partners.
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: A benchmark comparing General Intuition models against alternative world-model or policy stacks on the same tasks.
    whyItMatters: Differentiation claims are plausible, but buyers need evidence that the Medal-derived approach materially outperforms rivals or open baselines.
    diligencePath: Request benchmark notebooks, offline evaluations, and partner A/B results versus baseline world models.
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: Public or private evidence of security certifications, trust documentation, or enterprise control testing for the API.
    whyItMatters: Enterprise adoption in robotics and simulation often depends on security assurance as much as model quality.
    diligencePath: Request SOC 2 or equivalent roadmap, access-control design, audit logging model, and incident response processes.
  - type: private-evidence-only
    severity: material
    topic: compute-economics
    missingEvidence: Training and inference cost curves, latency targets, GPU utilization, and economics by model class.
    whyItMatters: Compute dependence is central to both roadmap timing and gross-margin potential.
    diligencePath: Request internal cost dashboards, reserved-capacity contracts, and model-serving benchmarks under partner workloads.
  - type: stale
    severity: minor
    topic: public-packaging
    missingEvidence: Updated public docs or release notes once broader API access launches.
    whyItMatters: A company this early can materially change product packaging within a quarter.
    diligencePath: Refresh diligence after the promised broader 2026 rollout and compare docs against current selective-partner posture.
