- id: architecture-and-lineage
  title: Architecture, training data, and why the technical lineage matters
  body: 'The clearest public window into General Intuition’s stack is MIRA, the Rocket League world-model release built with Kyutai and Epic Games. MIRA matters because it turns the company’s thesis into something inspectable: a 5B diffusion transformer, a 600M video codec, synchronized multi-player action streams, public code, and a technical report that explains both strengths and limitations. The model runs at 20 frames per second, works from pixels plus actions rather than privileged state, and logs physics only for evaluation. That is strong evidence that the team can build controllable, interactive simulators rather than only publish vague frontier-lab copy. Just as important, the repo and adjacent projects show where the team came from. IRIS, Δ-IRIS, and DIAMOND illustrate a progression from tokenized world models toward diffusion-based, more visually faithful, interactive systems. Together they make the company’s architecture story legible: General Intuition is not inventing its
    stack from zero; it is productizing a research family that already explored discrete-token, diffusion, and control-conditioned world modeling.'
  claimRefs:
