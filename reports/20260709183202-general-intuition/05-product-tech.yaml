- id: deployment-and-controls
  title: 'Deployment reality: visible dependencies, thin trust surface, and staged rollout'
  body: 'Public deployment evidence is mixed. On the positive side, the company has enough technical depth on the public internet to clear a basic credibility bar: open MIRA code, a public paper, explicit compute dependencies, and evidence of collaboration with Kyutai and Epic Games. The roadmap also has some real specificity. Multiple sources say most new capital will go toward compute, with CoreWeave as a named infrastructure dependency, and that broader API access is targeted for the end of summer 2026. On the negative side, there is very little public operational detail behind those statements. No public API documentation, public uptime data, model card, security certification, or trust center was found. The privacy notice and terms are better than nothing: they show a Delaware corporation, New York office, EU/UK representatives, Standard Contractual Clauses for transfers, and an explicit split between website data and Medal-governed gameplay data. But those are governance basics, not
    proof that the commercial API is hardened for enterprise deployment. The result is a company whose technical core looks more mature than its public reliability and compliance surface.'
  claimRefs:
  - CE009
  - CE010
  - CE017
  - CE018
  - CE031
  - CE034
  - CE036
  - CE039
  - CE040
