company:
  name: General Intuition
chapter:
  number: 5
  title: Product & Technology
  summary: 'General Intuition has stronger public technical proof than public product proof: MIRA, its open repo, and the team’s prior world-model work show genuine architecture depth, but the commercial surface still looks like a selective partner program rather than a broadly productized developer platform. The company’s differentiated bet is action-labeled gameplay data from Medal, yet public evidence still leaves enterprise hardening, benchmark superiority, and sim-to-real transfer largely unproven.'
sections:
- id: product-definition
  title: 'What the product is today: selective API plus research-backed assets'
  body: General Intuition’s public product surface is narrower than its ambition. The company homepage describes action models that decide what to do next and world models that predict the outcomes of actions, then ties both to a selective commercial API for partners across games, simulation, and robotics. That is important because it means the company is not only pitching abstract research; it is already presenting a commercial entry point. But the surrounding evidence still suggests a high-touch, early-stage enterprise motion rather than a packaged developer product. The partner portal is a form asking what another company is building and what should be built together, not a docs-first workflow with public keys, SDK downloads, usage examples, or pricing. Even the website terms explicitly say the site is informational only and may change without notice, which is a reminder that marketing language should not be mistaken for committed roadmap. In practical customer-workflow terms, the product
    today appears to be proprietary model access, collaborative partner intake, and a growing data engine rooted in Medal and Nerve.
  claimRefs:
