- id: proof-quality
  title: What counts as customer proof today and why it is still weak
  body: The strongest public evidence today is that there are real external engagements, not that there are named production deployments. TechCrunch says the startup has a handful of customers in gaming, simulation, and robotics. GamesBeat and Coalition describe first partners across the same segments. InvestGame says a commercial API has launched. Taken together, those are meaningful signals that the company is doing more than internal R&D. But none of the reviewed sources names a paying game studio, simulation company, or robotics operator. The named external entities that do appear—CoreWeave, Kyutai, and Epic Games—are ecosystem or collaboration proofs rather than customer proofs in the conventional SaaS sense. That distinction matters. Partner and collaborator visibility can confirm market interest, but it does not tell an investor whether deployments are in production, whether contracts renew, or whether users get measurable outcomes. The result is a real but low-resolution proof set.
