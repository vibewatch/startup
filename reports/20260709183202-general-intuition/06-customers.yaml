chapter:
  number: 6
  title: Customers
  summary: General Intuition appears to have real early customer motion—multiple sources independently corroborate selective partner activity across games, simulation, and robotics—but public evidence stops short of naming paying customers, proving production deployment, or showing retention. The current commercial surface looks enterprise-led and collaborative, with ecosystem proof stronger than customer-proof.
sections:
- id: segment-and-motion
  title: Who the product appears to serve and how the motion works
  body: 'General Intuition’s public customer story is defined more by segment labels than by named logos. Across the homepage, GamesBeat, Coalition, InvestGame, and TechCrunch, the same three target groups recur: games, simulation, and robotics. That consistency matters because it suggests the company is not still searching for a market narrative. But it also reveals how early the go-to-market still is. Instead of public docs, pricing, and self-serve onboarding, the company offers a partner portal asking what another company is building and what the future should be built together. That is a classic high-touch, enterprise-led intake pattern. Public evidence also implies that the company wants customers who can contribute useful embodiment data and work closely with General Intuition’s researchers. In other words, today’s buyer is probably not a casual developer; it is a technically capable partner willing to co-develop use cases in exchange for early access to the model stack.'
