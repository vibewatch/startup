  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-customers
    missingEvidence: Named customer list with contract stage, segment, and deployment status.
    whyItMatters: Without named logos, reference calls and deployment validation are impossible.
    diligencePath: Request active-account roster split into paying customers, pilots, and strategic collaborators.
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Renewal, churn, NRR, GRR, contract length, and satisfaction metrics.
    whyItMatters: Durability is the core unanswered question in the customer story.
    diligencePath: Request cohort tables by segment and quarter, including expansions and failed pilots.
  - type: private-evidence-only
    severity: material
    topic: pricing-and-acv
    missingEvidence: Pricing model, ACV ranges, and services-versus-software revenue mix.
    whyItMatters: Early customer quality cannot be judged without knowing whether current engagements are repeatable software contracts or labor-intensive bespoke work.
    diligencePath: Request pricing decks, recent MSAs/SOWs, and realized ACV by segment.
  - type: missing-source
    severity: material
    topic: channel-partnerships
    missingEvidence: Named engine, platform, or distribution partnerships with Unity, Unreal, or major publishers.
    whyItMatters: Distribution leverage could materially reduce customer-acquisition friction.
    diligencePath: Ask management for platform agreements, co-sell channels, and SDK integration plans.
  - type: missing-source
    severity: minor
    topic: public-reviews
    missingEvidence: Any external review, testimonial, or conference talk by a named end-user.
    whyItMatters: Third-party voice would upgrade proof quality even before metrics are disclosed.
    diligencePath: Search for future conference appearances or request customer references during diligence.
