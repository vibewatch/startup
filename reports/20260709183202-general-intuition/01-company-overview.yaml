company:
  name: General Intuition
chapter:
  number: 1
  title: Company Overview
  summary: General Intuition is a frontier AI lab spun out of Medal that argues action-labeled gameplay is a scalable pretraining substrate for agents that must act across space and time. Public sources support a rapid jump from a roughly $134M launch round in October 2025 to a $320M Series A announced in June 2026 at a $2.3B valuation, but governance, precise legal structure, board composition, and commercial traction remain only partially disclosed.
sections:
- id: identity-and-product
  title: Identity, thesis, and product posture
  body: 'General Intuition publicly positions itself as a frontier lab for acting in space and time rather than as another text- or image-generation startup. The company''s own homepage frames the core technical stack as two linked systems: action models that decide what to do next and world models that predict the outcomes of those actions. The official message is that language pretraining is insufficient for embodied or agentic intelligence because real-world competence depends on sequences of intent, action, and consequence. In that framing, gameplay is not a consumer side show; it is the data engine. General Intuition says it builds on Medal, the gaming clip platform founded by Pim de Witte, where users upload billions of gameplay clips every year and where those clips can be paired with precise action labels rather than only raw video.


    The product posture is also unusually specific for such an early company. TechCrunch, TNW, and the company website all describe General Intuition as using world models primarily as training environments while treating the agents themselves as the eventual product. That distinction matters commercially because it implies revenue should come from deployed decision systems or APIs rather than from simulation software alone. The homepage says the company has already onboarded first partners across games, simulation, and robotics to a selective commercial API, but public materials still stop short of naming those partners or quantifying usage. The result is a company with a clear strategic narrative and a selective partner program, yet still only limited public disclosure on product maturity and monetization.'
