callouts:
- calloutType: strength
  title: The strongest asset is not the demo, but the proprietary action-labeled dataset
  body: General Intuition's most defensible public edge is not yet a shipped mass-market product; it is the combination of Medal's first-person gameplay corpus and the action labels that tell the model what humans actually did. That data position is why investors backed a company with little public revenue disclosure at a multibillion-dollar valuation.
  claimRefs:
  - CO003
  - CO017
  - CO028
  - CO032
- calloutType: risk
  title: Governance and transfer-to-reality remain underdisclosed
  body: Public sources support the financing, the founder set, and the technical ambition, but they do not yet show a public board roster, customer list, revenue base, or definitive proof that gameplay pretraining transfers at scale into robust robotics outcomes. That leaves a meaningful gap between thesis quality and operating proof.
  claimRefs:
  - CO034
  - CO039
  - CO040
