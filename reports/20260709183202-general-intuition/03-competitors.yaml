callouts:
- calloutType: strength
  title: General Intuition is not just another 3D generator
  body: The strongest strategic difference is that the company pitches a gameplay-derived action-intelligence stack for agents and embodied systems, not only a prettier world-building interface. That gives it a sharper thesis than many creative-AI adjacencies if the transfer story proves real.
  claimRefs:
  - CP014
  - CP015
  - CP027
- calloutType: risk
  title: The easiest competitive trap is being squeezed from both directions
  body: General Intuition can lose from above if DeepMind, NVIDIA, or OpenAI absorb the category into broader ecosystems, and from below if open-source tools are good enough for customer experimentation. That is a hard market structure for a startup without visible lock-in.
  claimRefs:
  - CP030
  - CP031
  - CP032
  - CP035
  - CP036
- calloutType: insight
  title: Multi-homing is likely the default customer behavior
  body: Most sophisticated buyers will probably not choose one vendor for world generation, agent training, simulation, and deployment. They will mix proprietary models with open tools, which makes proof of measurable advantage more important than narrative novelty.
