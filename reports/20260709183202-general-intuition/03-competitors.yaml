company:
  name: General Intuition
chapter:
  number: 3
  title: Competitors
  summary: 'General Intuition competes against three very different classes of alternatives: world-model startups such as World Labs, frontier-lab research programs such as Google DeepMind and OpenAI, and open or low-cost simulation stacks such as Isaac Sim, MuJoCo, Habitat, and Unity ML-Agents. Its gameplay-first data moat is directionally differentiated, but public evidence still favors better-capitalized rivals on distribution, open-source ecosystem depth, and visible product maturity.'
sections:
- id: competitive-landscape
  title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
  body: 'General Intuition is not competing in a single clean product bucket. At the direct-peer layer, World Labs is the clearest startup analogue because it markets a world-model product, Marble, that can generate persistent 3D worlds from text, images, video, and layouts. At the incumbent frontier-lab layer, Google DeepMind’s Genie 2, Genie 3, and SIMA represent a better-capitalized research path toward controllable 3D environments and agents that can act inside them. NVIDIA competes one layer lower but with enormous leverage: Cosmos and Isaac Sim combine world-model tooling, synthetic-data infrastructure, and an existing robotics distribution surface. OpenAI’s explicit framing of video models as world simulators matters because it shows the biggest foundation-model labs view simulation-like generative systems as strategically important, even when the commercial packaging is still fluid.


    The substitute set is just as important as the named startup set. Luma and Rosebud attack adjacent creator and interactive-world workflows from a more accessible creative-tool angle, while Unity ML-Agents, MuJoCo, robosuite, Habitat, ManiSkill, and Infinigen give sophisticated teams open or low-cost ways to assemble much of the stack themselves. For buyers in robotics or simulation, the real alternative is often not another flashy startup but a toolchain assembled from existing simulators, open environments, and internal engineering. That means General Intuition must win not only on model novelty but on cost, integration, controllability, and proof that gameplay-trained action priors transfer into customer workflows better than open baselines.'
