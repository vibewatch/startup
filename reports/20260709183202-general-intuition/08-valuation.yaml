- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - Broader release slips, customer proof remains sparse, and funding terms worsen under public-comp discipline
    - Roughly $0.6B-$1.2B current value; downside dominated by proof and financing reset risk
    - Down-round, compute burn, regulatory drag, weak adoption
    - Material risk tail that cannot be ignored at current price
  - - Base
    - Technical progress continues and partner activity remains real, but economics and moat proof stay incomplete
    - Roughly $1.4B-$2.2B current value; premium to generic AI software, discount to stronger proof stories
    - Missing revenue visibility, no named customer set, competitive compression
    - Most supportable zone on current public evidence
  - - Bull
    - Broader release succeeds, named production customers emerge, and GI proves an unusually defensible gameplay-to-embodiment moat
    - Roughly $3.0B-$5.0B current value; supports meaningful upside from current round
    - Execution slip could collapse the premium quickly
    - Possible, but dependent on several milestones landing together
  notes: Ranges are analytical current-value estimates rather than management guidance or exit forecasts. They are intentionally wide because the evidence gaps are wide.
