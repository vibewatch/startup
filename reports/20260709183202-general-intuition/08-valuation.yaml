- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Customer proof
    - Named production customers, contract size, renewal behavior
    - Determines whether current price reflects real adoption or only narrative
    - Management, customer references, and pipeline review
  - - Compute economics
    - Training cost, inference cost, margin path, CoreWeave commitments
    - Capital intensity is central to whether upside accrues to equity
    - Finance lead, infrastructure lead, and vendor contracts
  - - Data rights
    - Full rights chain from Medal clips and metadata into model training and commercialization
    - Could be the highest hidden source of legal and moat risk
    - Legal diligence, DPA review, and intercompany agreements
  - - Capital structure
    - Share count, liquidation preferences, investor protections, and any side letters
    - Determines whether headline valuation translates into common-equity value
    - CFO or counsel and full cap-table review
  - - Regulatory map
    - Export-control assumptions, AI Act classification, privacy governance by use case
    - Necessary to underwrite timeline and international deployment risk
    - Policy counsel, product owners, and compliance workstream
  notes: These asks are intentionally mechanical. Without them, the debate over recommendation and valuation stance cannot move far beyond informed narrative judgment.
