- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Broader release does not arrive
    - Selective access persists through the next planned expansion window
    - Bull case weakens and base case compresses
    - Move from active diligence to watchlist
  - - Named production customers do not emerge
    - Still no public or diligenced reference set after additional product cycles
    - Commercial proof remains too thin for premium pricing
    - Demand sharper price discount or step back
  - - Compute economics remain opaque or unattractive
    - Management cannot show plausible cost curve and margin path
    - Current price loses support because burn dominates value capture
    - Apply major valuation haircut
  - - Regulatory friction materially slows deployment
    - Export controls, AI Act mapping, or rights issues block key workflows or geographies
    - Scenario upside narrows and timelines extend
    - Re-underwrite TAM and timeline
  - - Next round resets price or structure
    - Flat/down/structured round signals weaker market support
    - Current mark no longer credible as anchor
    - Pause unless downside-adjusted terms improve materially
  notes: Triggers are designed to be monitorable over the next 6-18 months and to translate directly into investment action rather than vague concern.
