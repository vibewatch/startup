- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Category tailwind
    - 2026 AI capital markets still reward frontier labs aggressively
    - Hot funding markets do not guarantee this specific entry price is attractive
    - Evidence that GI is converting the category tailwind into durable customer proof
  - - Technical narrative
    - World-model and action-model story is strategically important
    - Large incumbents and better-funded peers are pursuing adjacent stacks
    - Benchmark wins or production deployments that show durable differentiation
  - - Data moat
    - Medal linkage could be unusually valuable if it compounds into training advantage
    - Rights chain, transferability, and long-term exclusivity remain opaque publicly
    - Clean data-rights diligence and proof that data advantage improves outcomes
  - - Commercialization
    - Selective partners suggest real demand and careful rollout
    - Selective access also means revenue proof is still thin
    - Named customers, public docs, and evidence of repeatable deployments
  - - Valuation
    - Private-market context makes a multibillion mark plausible
    - Base-case public evidence does not make $2.3B look cheap
    - Lower entry price or materially better disclosure
  notes: The thesis is real; the anti-thesis is mostly about price, disclosure, and proof timing. Those are precisely the issues that separate an interesting company from an investable round.
