  productSummary: >-
    Action-model and world-model stack built from Medal gameplay clips and action labels, with a selective commercial API for games, simulation, and robotics plus visible technical proof through MIRA and the Nerve data-collection surface.
  customerFocus: >-
    Technically sophisticated partners in games, simulation, and robotics that can co-develop use cases and eventually convert selective deployments into broader production usage.
  businessModel: >-
    High-touch partner-led commercialization: selective API access, bespoke integration and co-development, and expanding data-collection / labeling surfaces rather than a broad self-serve SaaS motion today.
