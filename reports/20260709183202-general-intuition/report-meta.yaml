companyProfile:
  summary: >-
    General Intuition is a frontier AI lab spun out of Medal, the gaming-clip platform founded by Pim de Witte. Public reporting ties the company to a New York operating hub, a Dutch legal and IP structure, and a rapid financing jump from a 2025 launch round to a $320M Series A announced in June 2026 at a $2.3B valuation. The product thesis is to train action models and world models on gameplay video plus action labels, then commercialize those models through a selective partner-led API for games, simulation, and robotics. Public technical proof is unusually strong for a young company because MIRA and related research artifacts are visible, but customer proof, revenue quality, and economic disclosure remain thin.
