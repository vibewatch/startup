  topStrengths:
    - Differentiated Medal-linked training corpus and action-labeled gameplay thesis for agentic AI.
    - Strong investor syndicate and enough capital to pursue compute-intensive research and commercialization.
    - Public technical proof is stronger than normal for a young lab because MIRA and related research artifacts are visible.
  topRisks:
    - No public revenue, margin, retention, or named production-customer proof at a $2.3B valuation.
    - Capital intensity and reliance on Medal data plus CoreWeave-backed compute make execution sensitive to partner and infrastructure risk.
    - Competition from DeepMind, OpenAI, NVIDIA, World Labs, and Physical Intelligence can compress differentiation before broad release.
  unresolvedGaps:
    - Cap table, liquidation preferences, and any next-round structural protections are undisclosed.
    - Compute-cost curve, gross-margin path, and burn / runway remain unknown.
    - Named customer list, contract structure, and renewal evidence are not public.
    - Training-data rights chain and regulatory mapping by use case still require private diligence.
