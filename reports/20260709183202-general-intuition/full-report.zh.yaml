      - number: '7.2'
        title: 数据权利与监管风险能否可控，取决于尚未公开的私下控制
        blocks:
          - type: paragraph
            body: >-
              第二组风险是法律和监管。General Intuition 自己的隐私声明罕见地明确：用于研究和模型开发的 Medal 数据由 Medal 政策和单独的公司间安排约束。
              这有帮助，但也意味着，对训练语料最关键的权利链并不公开透明。Medal 的条款强调遵守法律和第三方权利，却不能单独回答每一种下游训练或商业化用途是否都有合同保护。 与此同时，政策压力正从多个方向推进：先进 AI
              芯片的出口管制规则持续变化；欧盟 AI Act 即使在简化规则，落地仍然很重；美国围绕 AI 训练和敏感数据的版权、
              生物识别制度也在继续演化。没有哪一项能证明短期会断裂。合在一起，它们构成的合规栈远比当前公开信任材料显示的更重。因此，监管准备度是销售前置条件， 不是后台清理任务。
