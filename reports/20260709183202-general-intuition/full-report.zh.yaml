      - number: '3.2'
        title: 能力、包装，以及各类对手最强的位置
        blocks:
          - type: paragraph
            body: >-
              公开产品呈现显示，这是一个分裂市场，而不是赢家通吃赛道。World Labs 强调空间一致性、持久性、可编辑 3D 世界和可导出结果；Luma 强调视频、图像、音频和品牌感知内容上的快速创意执行； NVIDIA
              强调物理 AI、合成数据和仿真基础设施；DeepMind 强调研究级世界生成和智能体，而不是广泛商业包装。General Intuition 自己的公开姿态更窄：选择性发布的商业 API、
              覆盖游戏、仿真和机器人的早期合作伙伴，以及一个围绕游戏玩法数据落地行动模型的产品故事。这个故事有差异化，但公开包装程度不如 World Labs 的 Marble 工作流或 NVIDIA 的开发者生态。


              整个领域价格透明度都弱。General Intuition 不公布价目表，大多数直接世界模型对手也不公布。这会削弱直接价格比较，把尽调重点转向包装姿态：开源生态降低进入成本，选择性 API
              释放稀缺和实验信号，创作者工具即便模型新颖性不深，只要今天能让工作流更容易，也能赢得采用。竞争含义是，买方重视具体的“从游戏玩法到行动数据”论点时，General Intuition
              可能最强；但如果买方主要想要成熟顺手的创意世界构建工具、完全开放的仿真栈，或巨头生态带来的采购安全感，它就较弱。
