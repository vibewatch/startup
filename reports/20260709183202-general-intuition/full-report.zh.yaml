      - number: '3.3'
        title: 护城河耐久性、切换成本和多供应商并用风险
        blocks:
          - type: paragraph
            body: >-
              General Intuition 最可信的公开护城河主张，不是当前分发规模，而是输入数据的独特性。公司称，它正在用 Medal 的数十亿条游戏片段训练模型，并把这个动作密集语料转成可以跨虚拟和物理环境感知、
              预测和行动的模型。如果这些数据真的能产生更好的行动先验或规划行为，就可能很重要。但公开证据还没有显示硬性锁定。公司没有披露具名生产客户、相对开放或巨头栈的基准差异，也没有披露足以让切换变痛的工作流依赖。
              相比之下，NVIDIA 已经通过 Isaac Sim 和配套工具嵌入机器人开发者工作流，World Labs 也让自己的产品界面对创意和仿真用户更清楚。


              这会形成高度多供应商并用的环境。开发者可以为一个用例评估 General Intuition，为另一个用例评估 World
              Labs，同时保留开源仿真器作为基线工作流。即便在同一组织里，世界生成、智能体训练和生产部署也可能来自不同供应商。 在这种背景下，选择性 API
              访问可以保留稀缺性并支持谨慎导入，但它本身不创造切换成本。持久优势需要证据证明，General Intuition 的数据、工具或集成层能产出明显优于买方从开源栈或巨头平台获得的结果。
