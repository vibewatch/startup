      - number: '2.2'
        title: 证据约束下的 TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >-
              公开市场数据没有给“游戏玩法优先的智能体基础设施”提供一个干净的分析师分类，所以本章必须从多个视角拼出规模判断。最直接贴近的品类是 AI 世界模型，Kaiso 估计 2025 年为 $1.8 billion，到
              2035 年增至 $52.7 billion，CAGR 为 40.2%。第二个视角是 AI 驱动的仿真和数字孪生：The Business Research Company 估计该市场 2026 年为 $6.89
              billion，Fortune Business Insights 使用更宽定义，给出 2026 年数字孪生 $33.97 billion。第三个视角是机器人 AI，Grand View 估计 2025 年市场为
              $20.4 billion，CAGR 32%，这意味着一个比 General Intuition 当前可服务范围大得多的邻近市场。最后，游戏专属市场明显更小：The Business Research
              Company 将 2026 年生成式 AI 游戏市场定为 $2.21 billion，广义游戏 AI 为 $3.4 billion。


              关键尽调点在于，最大的数字不等于最贴合的数字。General Intuition 并不出售整个数字孪生栈、全部机器人硬件或完整的游戏 AI 软件宇宙。它当前的产品姿态是选择性 API 访问和合作伙伴主导的实验。
              这把现实的当前 SAM 限制在世界模型软件、合成数据基础设施和具身智能体训练预算的交集——更可能是低个位数十亿美元，而不是数百亿美元。近期 SOM 更小，因为机器人和工业软件的企业采用仍然慢、
              技术门槛高，并且高度依赖具体预算负责人。市场无疑大到值得重视，但估值承销应锚定狭窄交集市场，而不是最宽的母品类幻灯片。
