              million。这足以确认主要投资方承诺和估值快速上升，但几乎不说明收入质量。


              官方备案证据比媒体报道窄。直接获取的 SEC Form D 属于 AVSF - General Intuition 2026, LLC，这是一个 Delaware 集合投资基金载体，向 93 名投资者售出
              $4.497 million 的发行额。它对财务分析有用，因为它显示了与本轮融资相邻的载体，但不是运营公司披露。它不揭示 General Intuition 的收入、现金、烧钱速度或合同质量。因此，
              本章把该备案用作融资机制的佐证，而不是公司经营指标证明。
