      - number: '6.4'
        title: 客户结论
        blocks:
          - type: paragraph
            body: >-
              因此，General Intuition 的客户判断呈现不对称。它比纯隐身故事更好，因为多家独立媒体相互印证：公司已经在游戏、仿真和机器人领域推进筛选式伙伴合作。
              它又弱于常规企业软件故事，因为同样的报道没有点名客户、没有证明生产使用，也没有披露留存指标。公司做客户开发最强的资产不是客户名单，而是供给侧生态： Medal
              的游戏社区、差异化训练语料，以及愿意共创前沿演示的合作者。这些可能足以敲开成熟技术买家的门。但还不足以断定 General Intuition 已经降低客户质量或产品市场匹配风险。
              现实的承销姿态是：把客户开发视为一个带有鼓励性主动需求的实时实验，而不是已经验证的经常性收入引擎。下一步实质尽调很简单，但只能私下拿： 客户 logo 清单、部署阶段、合同结构和客户访谈。公开证据仍然很薄。
