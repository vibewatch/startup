        title: 当前产品形态：选择性 API 加研究资产背书
        blocks:
          - type: paragraph
            body: >-
              General Intuition 的公开产品呈现窄于它的野心。公司官网描述的行动模型决定下一步做什么，世界模型预测行动结果，并把两者连接到面向游戏、仿真和机器人合作伙伴的选择性商业 API。
              这一点重要，因为公司不只是在推抽象研究；它已经呈现一个商业入口。但周边证据仍显示，这更像高触达、早期企业销售动作，而不是包装好的开发者产品。合作伙伴门户是一个表单，询问另一家公司正在构建什么、
              应该共同构建什么，而不是以文档为先的工作流；没有公开密钥、SDK 下载、使用示例或定价。连网站条款都明确说网站仅供信息参考，且可能随时更改，提醒投资人不要把营销语言误认为承诺路线图。
              从实际客户工作流看，今天的产品似乎是专有模型访问、协作式合作伙伴导入，以及扎根 Medal 和 Nerve 的增长数据引擎。
