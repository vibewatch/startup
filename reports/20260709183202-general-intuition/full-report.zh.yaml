  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值框架
        blocks:
          - type: paragraph
            body: >-
              General Intuition 更像一个价格敏感的尽调故事，而不是仅凭公开证据就能干净给出买入的标的。公司所处品类显然受到 2026 年资本市场奖励： Stanford AI Index 显示私人 AI
              融资规模巨大，World Labs、Physical Intelligence 等可比前沿实验室也拿到了数十亿美元级估值。但 General Intuition
              自身公开记录在估值纪律最关键的地方仍很薄。报道仍只描述少数客户、筛选式 API 访问，以及围绕算力的重投入模式。没有公开收入基数、毛利率画像、
              股权结构表或客户留存数据，足以支撑精确倍数测算。因此，正确框架应从简单叙事热情转向情景承销。在这个基础上，当前 $2.3 billion 投后估值可以成立， 但支撑并不宽裕。最能站得住的判断是继续研究 /
              跟踪：把公司留在漏斗里，但不要按商业证明和资本效率已经解决的价格来付钱。
