      - number: '7.4'
        title: 风险结论
        blocks:
          - type: paragraph
            body: >-
              General Intuition 看起来不是鲁莽，而是尚未完成。公司有钱、有研究可信度，也有可见的伙伴势头。公开层面缺的是足够证据，证明训练数据权利、
              安全控制、安全态势、客户耐久性和演示后的产品经济性都能支撑规模化。在普通软件初创公司里，这个缺口没那么致命；在这里更重要，因为每一层缺失的控制都会和其他层相互作用。
              一个里程碑错过，就可能先变成产品问题，再变成烧钱问题，最后变成估值问题。因此，投资案取决于私下尽调能否足够快地补上技术承诺与运营证明之间的缺口，
              跑赢这个品类的竞争和监管漂移。实务上，这是一家公司必须重尽调的故事，不是只靠公开材料就能形成确信的故事。
