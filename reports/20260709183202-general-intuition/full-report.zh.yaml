  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心论点拥挤、烧钱，且仍处早期
        blocks:
          - type: paragraph
            body: >-
              第一重风险在于，General Intuition 想赢的赛道已经被规模大得多或资本更厚的玩家验证。DeepMind、OpenAI、NVIDIA、Physical Intelligence 和 World
              Labs 都在围绕世界模型、具身控制或物理 AI 基础设施发布相邻叙事。这验证了品类需求，也压缩了新进入者把技术新意转化为持久定价权的窗口。 General Intuition
              的公开发布姿态仍显筛选式：少数伙伴、分阶段 API 推出，没有广泛的生产使用公开证明。也就是说，公司必须同时解决两个硬问题——
              证明模型能超出狭窄演示场景泛化，并赶在竞争对手或平台把类似功能做得更容易采购之前完成。由此带来的时间线风险不只是技术问题。一旦发布延误， 商业化和融资风险会迅速叠加，因为公司已经走上重算力扩展路线。
