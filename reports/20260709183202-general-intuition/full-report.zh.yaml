      - number: '8.2'
        title: 融资背景、私下参照与公开市场区间
        blocks:
          - type: paragraph
            body: >-
              关于价格支撑，最强论点来自背景，而不是公司本身：前沿 AI 资本依然充裕。Stanford 记录了创纪录的融资背景，World Labs 和 Physical Intelligence
              也表明，在广泛商业化之前，私人投资人仍愿意给世界模型和具身 AI 故事打出数十亿美元估值。这解释了 General Intuition 为什么能拿到 $2.3 billion， 却不能证明这轮便宜。World
              Labs 通过 Marble 和 Autodesk 看起来更接近可见产品化；Physical Intelligence 已经融到更多资金，并瞄准更大的数字。
              公开可比公司同样更多是警示，不是安慰。按公开市值看，C3.ai 低于 General Intuition 的估值标记，Unity 远高于它——但两家公司都有 10-K 级披露，
              能让投资人判断现实，而不是主要靠叙事承销。因此，可比集合拉宽了合理区间，却没有取消入场纪律。
