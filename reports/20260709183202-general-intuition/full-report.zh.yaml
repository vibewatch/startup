        title: 财务判断和尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个简单但重要的结论。General Intuition 资金充足、技术野心大、组织成本高。它还不能按传统软件指标公开承销。没有可见收入基础，没有 ACV，没有毛利率披露，
              没有烧钱速度，没有签约待交付订单，也没有客户集中度数据。就连法律和实体图景也比用户提示更复杂，荷兰报道指向 Naarden 持有的 IP 架构和跨国运营足迹。


              这并不意味着公司财务弱，而是财务不透明。正向案例是，$320 million 新资本和 $2.3 billion 估值给了公司时间去证明一个狭窄滩头阵地。风险案例是，如果选择性 API
              路线不能足够快转成粘性的生产收入，算力强度、高端人才成本和企业采用摩擦可能跑赢商业化。下一步尽调的最低要求是私有证据：管理账、定价材料、合同分组和董事会续航期材料。
