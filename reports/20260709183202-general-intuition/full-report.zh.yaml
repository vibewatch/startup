companyProfile:
  summary: >-
    General Intuition 是从 Medal 拆分出的前沿 AI 实验室，Medal 是 Pim de Witte 创办的游戏片段平台。公开报道把公司同时指向纽约运营中心、荷兰法律和 IP 架构，以及 从 2025
    年启动轮到 2026 年 6 月宣布 $320M Series A、估值 $2.3B 的快速融资跃迁。产品论点是用游戏视频和动作标签训练行动模型和世界模型，再通过面向游戏、仿真和机器人方向的选择性合作伙伴 API 商业化。MIRA
    及配套研究资产已经公开，对一家年轻公司而言，公开技术验证异常强；但客户验证、收入质量和经济性披露仍很薄。
