      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱拆成四个实际集群。第一类是游戏开发商和 AI 原生游戏工具团队，任务是比传统流程更快生成场景、NPC 行为、关卡内容或沙盒环境。在这个细分里，用户通常是玩法、技术美术或 AI
              系统团队，付款方是开发工具或平台预算。第二类是机器人和具身 AI 团队，包括创业公司、OEM 和研究实验室。他们的任务是用合成训练环境、策略学习基础设施或世界模型生成的边缘案例，
              降低对稀缺真实世界数据的依赖。第三类是数字孪生和工业软件厂商，它们的价值主张是预测性维护、虚拟调试或设施优化，而不是类似游戏的智能体。第四类是自动驾驶和出行开发者，稀有场景生成和环境仿真比创意工具更重要。


              这些细分共享技术底层，但预算、销售周期和证明要求不同。游戏买方可以快速试用，只要输出有用，就能容忍创意上的不完美；机器人和工业买方更看重保真度、安全性和工作流集成。 General Intuition
              当前证据显示，公司在机器人和工业采用旅程中的进度，仍落后于叙事搭建的成熟度。公开材料称游戏、仿真和机器人领域已有合作伙伴，但公司没有公布客户名称或 ROI
              基准。因此，采用路径大概率从研究和原型预算开始；只有公司能在每个垂直领域证明迁移、延迟、成本和运行可靠性后，才会进入更深的平台嵌入。
