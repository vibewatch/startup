      - number: '5.2'
        title: 架构、训练数据，以及技术谱系为什么重要
        blocks:
          - type: paragraph
            body: >-
              观察 General Intuition 技术栈的最清晰公开窗口是 MIRA，这是与 Kyutai 和 Epic Games 共建的 Rocket League 世界模型发布。MIRA
              重要，因为它把公司论点变成可检查的东西： 5B 扩散 Transformer、600M 视频编解码器、同步多人动作流、公开代码，以及解释优势和限制的技术报告。模型以每秒 20
              帧运行，从像素加动作而非特权状态出发，并且只在评估中记录物理信息。
              这是强证据，说明团队能构建可控、交互式模拟器，而不只是发布模糊的前沿实验室文案。同样重要的是，代码库和邻近项目显示了团队来处。IRIS、Δ-IRIS 和 DIAMOND 展示了一条从 token
              化世界模型，走向基于扩散、更高视觉保真、可交互系统的演进。合在一起，公司架构故事变得清楚：General Intuition 不是从零发明技术栈， 而是在产品化一个已经探索过离散
              token、扩散和控制条件世界建模的研究家族。
