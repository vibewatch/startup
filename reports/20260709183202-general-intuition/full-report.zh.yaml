      - number: '1.4'
        title: 里程碑、早期商业化和未解风险
        blocks:
          - type: paragraph
            body: >-
              公司的公开历史被压缩得异常紧。Medal 2015 年成立；据报道 OpenAI 在 2024 年底曾尝试收购其数据集；General Intuition 于 2025 年 10 月拆分成立；到 2026 年 6
              月， 公司已经宣布 $2.3 billion 估值，并通过 MIRA 拿出公开研究产出。TechCrunch
              融资后画像补充了运营细节：同一模型家族被展示用于驱动游戏智能体和四足机器人，管理层称只需要几分钟真实世界数据即可微调。 公司还推出 Nerve，这是一个用于收集游戏玩法、标注和遥操作数据的市场，并称更广泛 API
              可用性目标是 2026 年夏末。


              这些进展并没有消除核心尽调风险。公开来源证明 General Intuition 拥有差异化数据源和快速推进的研究组织，但尚未证明游戏玩法预训练能够大规模迁移到稳健的真实世界机器人，也没有证明持续商业需求。
              MIT Technology Review 2026 年 4 月的世界模型综述提供了最有用的怀疑侧对照：文章认为当前 AI 在物理世界中仍然吃力，世界模型论点还更像承诺，而不是已经坐实的能力。公开报道也在
              Medal 当前月活用户数上互相冲突，分别引用了约 1000 万和约 1700
              万用户。再叠加收入、董事会构成、客户名称和精确法律结构均未披露，公司概览应被视为一个有真实动能证据的高信念论点，而不是已经充分去风险的运营故事。
