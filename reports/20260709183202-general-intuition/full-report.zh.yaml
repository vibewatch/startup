        title: 乐观、基准、悲观情景估值区间
        blocks:
          - type: paragraph
            body: >-
              由于没有可靠公开收入分母，情景测算应基于里程碑。悲观情景 $0.6 billion 至 $1.2 billion，假设更广泛 API 推出延误、客户证明仍薄， 下一轮融资受更严的公开可比纪律约束。基准情景
              $1.4 billion 至 $2.2 billion，假设技术论点仍可信、伙伴活动继续，但仍要折价处理经济性缺失、 治理不透明和监管风险。乐观情景 $3.0 billion 至 $5.0
              billion，假设更广泛发布、具名生产客户、来自 Medal 衍生数据的护城河证据更清晰， 并且相对 World Labs、DeepMind、OpenAI、NVIDIA 和 Physical
              Intelligence 有足够差异化，值得拿顶级前沿溢价。在这个框架下，当前 $2.3 billion 轮并不荒唐，但它高于基准情景中点，因此要求投资人在公开证据完全支撑之前，就承销一条明显偏乐观的路径。
