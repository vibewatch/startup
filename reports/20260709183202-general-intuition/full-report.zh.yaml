      - number: '2.4'
        title: 增长驱动、约束和可能放慢采用的因素
        blocks:
          - type: paragraph
            body: >-
              几股 2026 年力量明确支撑需求。DeepMind 明确说，丰富训练环境供应一直是具身智能体的瓶颈；NVIDIA 则把 Cosmos 定位为机器人学习、世界仿真和合成数据生成的基础设施。 AI
              驱动仿真、数字孪生、机器人和游戏 AI 的市场报告都指向同一方向：买方想要更多自动化、更多模拟场景和更多软件定义工作流。360iResearch 的机器人仿真展望尤其有用，
              因为它显示该品类正从离线工程工具，走向与数字孪生、AI 验证和虚拟调试绑定的一体化数字工程生态。在这个世界里，如果 Medal 的游戏玩法语料确实能降低构建稳健智能体行为的成本，差异化数据源就会有价值。


              刹车也同样真实。关于具身 AI 的 3D 生成 arXiv 综述称，具备物理基础、可交互的内容仍难以生产，sim-to-real 鸿沟还没有解决。MIT Technology Review
              对世界模型的怀疑性综述给出同样的大方向： 这个领域有前景，但在真实世界环境中仍不可靠。Deloitte 补上企业采用视角——遗留系统集成、安全、合规、基础设施准备度、员工技能和 ROI
              不确定性都会拖慢部署。Fortune 的数字孪生市场报告还加入了安全和互操作性担忧。合在一起，这组约束意味着 General Intuition
              所在市场可以快速增长，却不一定同样快速转化为收入确认。公司所在市场真实、战略重要且在扩张， 但仍足够早，买方教育和价值证明可能与原始模型能力同样重要。
