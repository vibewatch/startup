      - number: '4.4'
        title: 资本充足性、烧钱情景和可能资金用途
        blocks:
          - type: paragraph
            body: >-
              公司披露融资但不披露现金消耗，因此资本充足性必须用情景框住。低情景年度烧钱约 $60 million，意味着单独 $320 million 融资可支撑约 64 个月；中情景年度烧钱 $120 million，约
              32 个月；高情景年度烧钱 $180 million，约 21 个月。这些不是公司披露，也没有计入此前现金余额、交易成本和战略储备。但它们是有用边界， 因为招聘数据和公开 GPU
              定价都显示，前沿模型公司可能很快放大费用。


              即便没有内部账目，最可能的资金用途也相当清楚：训练和服务模型、招聘昂贵人才、强化数据 / 安全 / 合规基础设施，并把选择性技术合作转成生产收入。公开证据没有显示债务、库存融资或工厂建设。
              因此，核心财务问题不是公司是否资产沉重；而是其经营现金消耗能否保持在 $320 million 购买的窗口内，直到商业转化足够可见，支撑下一轮融资或内部可持续。
