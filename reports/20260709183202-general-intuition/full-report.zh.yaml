  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和现状替代品
        blocks:
          - type: paragraph
            body: >-
              General Intuition 容易被误分，因为它的叙事同时触及游戏、机器人、合成数据和世界模型研究。公司材料把它定义为构建跨空间和时间行动系统的实验室，并称首批合作伙伴覆盖游戏、
              仿真和机器人。这意味着真实品类既不是单纯的“游戏里的 AI”，也不是单纯的“机器人软件”。更准确的边界，是一个横跨世界模型训练平台、合成数据与仿真基础设施，以及面向必须感知、 预测和行动的系统的智能体 API
              的软件层。Kaiso 对 AI 世界模型的市场定义最接近这一直接品类，因为它明确纳入基础世界模型、仿真引擎、合成数据平台，以及用于机器人、自动驾驶、工业自动化和数字孪生的开发框架。


              纳入支出因此包括世界模型 API、具身智能体训练平台、合成数据工具和可用于训练或评估智能体的仿真基础设施。排除支出同样重要。通用 LLM 订阅、纯机器人硬件、传统创意或游戏引擎工具，
              不属于同一市场，除非它们直接提供智能体训练或世界模型层。MuJoCo、robosuite、Isaac Sim 和 Infinigen 是尤其关键的现状替代品，因为它们已经用开放或低成本工具链解决了部分任务。
              现有工具意味着，General Intuition 必须证明游戏玩法训练出的世界模型栈能带来买方无法用现有仿真软件和内部工程低成本复刻的东西。
