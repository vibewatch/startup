      - number: '3.4'
        title: 反向证据：商品化、巨头反击和品类波动
        blocks:
          - type: paragraph
            body: >-
              最强的反证是结构性的。MIT Technology Review 认为世界模型仍不可靠，这一点重要，因为品类热度可能跑在企业价值创造前面。MuJoCo、Habitat、ML-Agents 和 ManiSkill
              等开放工具持续改进；NVIDIA 正在开源物理 AI 栈的大部分；DeepMind 和 OpenAI 这类前沿实验室能用更强算力和分发，把邻近研究推入产品。这意味着 General Intuition
              同时被上方巨型实验室和下方商品化开发者工具挤压。


              品类本身也很波动。OpenAI 的世界模拟器叙事验证了这个方向的战略重要性，但围绕视频生成世界的产品包装已经快速变化；创意 AI 买方也常常可以用 Luma 或 Rosebud 等更简单工具解决即时需求，
              而不必押注更深的世界模型平台。因此，反向竞争案例很直接：General Intuition 可能在品类方向上判断正确，但如果市场标准化在开放基础设施上、如果巨头把最佳功能吸收到更大生态里，
              或如果客户认为游戏玩法优先论点有意思但并非任务关键，它仍可能丧失经济权力。
