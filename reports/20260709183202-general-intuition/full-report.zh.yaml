      - number: '1.2'
        title: 创始人、研究可信度与治理不透明
        blocks:
          - type: paragraph
            body: >-
              公开报道一致认为，General Intuition 由 Pim de Witte 与 Eloi Alonso、Adam Jelley、Vincent Micheli 共同创办。De Witte
              是运营重心：媒体报道、投资方资料页和会议简介都把他列为 General Intuition 创始人兼 CEO，也列为 Medal 创始人或前
              CEO。他的经历结合了游戏创业和人道主义工作；他也借此阐述公司围绕武力使用的野心和边界。Eloi Alonso 的个人网站提供了研究侧 创始人-市场匹配的直接证据：他在日内瓦大学完成强化学习和世界模型方向 PhD
              工作后，成为 General Intuition 联合创始人。


              创始团队能发表前沿技术工作的最强独立证据，是 2026 年 MIRA 项目。Adam Jelley、Eloi Alonso、Vincent Micheli 和 Pim de Witte
              都出现在这篇多人世界模型论文及开源发布的作者名单中，项目由 Kyutai 和 Epic Games
              共同参与。这帮助验证，公司不只是一个持有数据的壳。即便如此，治理披露仍薄。公开页面列出创始人和投资方，却没有正式董事会名单、独立董事、保留事项权利或股权结构控制条款。 TechFundingNews
              称，公司以在荷兰合法注册的公益公司形式运营；DutchNews 则称数据和 IP 放在 Naarden 的一家荷兰公司里。这些事实方向上可以并存，但母子公司图谱和董事会结构仍解释不足。
