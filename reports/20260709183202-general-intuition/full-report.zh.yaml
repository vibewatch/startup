      - number: '5.4'
        title: 相对品类的差异化，以及仍未证明的部分
        blocks:
          - type: paragraph
            body: >-
              General Intuition 最可防守的技术差异化，并不是只有它相信世界模型，而是它把世界模型研究与大规模动作标注游戏玩法数据结合在一起。这让它不同于 DeepMind 的提示驱动 Genie 2
              环境、Physical Intelligence 的机器人优先 π0 栈、Wayve 的结构化驾驶仿真、World Labs 的空间智能产品化，以及 NVIDIA 的广义物理 AI 平台。公司优势在于 Medal
              数据同时包含观察和意图：视频，加上导致下一步结果的准确玩家输入。如果大型行动模型成为智能体的关键控制层，这可能非常重要。即便如此，公开证据还没有证明持久优越性。MIRA 很亮眼但范围很窄，
              其作者也承认回放失败、隐藏状态问题，以及 sim-to-real 迁移到底能扩展多远仍不确定。与此同时，资本更充足的对手已经露出更多公开产品细节、更广生态或更清晰的终端用户工作流。因此，
              产品技术读数对人才和研究执行有利，但对广泛产品成熟度和可防守部署优势保持谨慎。
