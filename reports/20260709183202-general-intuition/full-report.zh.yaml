  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、巨头、邻近玩家和替代品
        blocks:
          - type: paragraph
            body: >-
              General Intuition 并不在一个干净的单一产品桶里竞争。在直接同行层，World Labs 是最清晰的创业公司类比，因为它推广的世界模型产品 Marble，可以从文本、图像、视频和布局生成持久 3D
              世界。在前沿实验室巨头层，Google DeepMind 的 Genie 2、Genie 3 和 SIMA 代表一条资本更充足的研究路径，目标是可控 3D 环境以及能在其中行动的智能体。NVIDIA
              低一层竞争，但杠杆极大：Cosmos 和 Isaac Sim 把世界模型工具、合成数据基础设施和现有机器人分发界面组合在一起。OpenAI 明确把视频模型框定为世界模拟器，这一点重要，
              因为它表明最大的基础模型实验室把类似仿真的生成系统视为战略要地，即便商业包装仍在流动。


              替代品集合和具名创业公司集合同样重要。Luma 和 Rosebud 从更易上手的创意工具角度，切入邻近的创作者和交互式世界工作流；Unity ML-Agents、MuJoCo、robosuite、Habitat、
              ManiSkill 和 Infinigen
              则让技术成熟团队能用开放或低成本方式自行拼出大部分栈。对机器人或仿真买方来说，真正替代方案往往不是另一家炫目的创业公司，而是由现有仿真器、开放环境和内部工程拼出的工具链。 这意味着 General
              Intuition 不仅要赢在模型新颖性上，还要在成本、集成、可控性，以及游戏玩法训练出的行动先验能否比开放基线更好迁移到客户工作流上赢。
