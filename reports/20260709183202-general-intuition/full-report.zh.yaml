    summary: 当前使用路径似乎是从合作伙伴资格筛选走向选择性技术集成，而不是自助注册漏斗。
    data:
      nodes:
        - id: n1
          label: 合作伙伴资格筛选
          detail: GI 通过合作伙伴表单收集公司背景和未来构建意图
        - id: n2
          label: 精选模型访问
          detail: 少数合作伙伴获得覆盖游戏、仿真和机器人的 API 访问
        - id: n3
          label: 嵌入式迭代
          detail: GI 优先服务敏捷内部团队，并获取有用的真实世界数据
        - id: n4
          label: 更广泛发布
          detail: 管理层计划在当前选择性阶段后扩大可用范围
      edges:
        - - n1
          - n2
        - - n2
          - n3
        - - n3
          - n4
    approximationNotes: 该流程抽象自管理层关于客户筛选和公开入口机制的表述。
    claimRefs:
      - CE005
      - CE006
      - CE030
      - CE031
      - CE036
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 当前技术栈依赖专有数据、外部算力、协作者和第三方模型组件。
    data:
      nodes:
        - id: d1
          label: Medal 剪辑平台
          detail: 行动标注游戏数据的核心来源
        - id: d2
          label: CoreWeave 算力
          detail: 用于训练和推出的具名扩展合作伙伴
        - id: d3
          label: Meta DINOv3 权重
          detail: 最高质量编解码器训练依赖的受限编码器
        - id: d4
          label: Kyutai / Epic 合作
          detail: MIRA 发布的外部协作者
        - id: d5
          label: 商业 API 层
          detail: 面向合作伙伴的交付界面
      edges:
        - - d1
          - d5
        - - d2
          - d5
        - - d3
          - d5
        - - d4
          - d5
    approximationNotes: 依赖项仅限公开来源明确可见的部分。
    claimRefs:
      - CE004
      - CE018
      - CE029
      - CE034
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: 公开证据在研究能力上最强，在企业级加固细节上最弱。
    data:
      columns:
        - 公开证明
        - 置信度为何如此
        - 主要剩余缺口
      rows:
        - label: 研究脉络
          values:
            - 高
            - 论文、代码库和具名过往项目可见
            - 需要看到基准表现直接转成商业结果
        - label: 交互式世界模型演示
          values:
            - 高
            - MIRA 演示、论文和代码库已公开
            - 演示范围窄，还不能证明通用平台能力
        - label: 商业 API 存在
          values:
            - 中
            - 官网和报道称已接入合作伙伴
            - 没有公开文档、定价或端点
        - label: 企业信任 / 合规
          values:
            - 低
            - 隐私政策和条款存在
            - 没有公开安全认证或信任中心
        - label: 广泛部署成熟度
          values:
            - 低
            - 更广泛发布被描述为即将到来
            - 没有具名生产客户或 SLA 证据
    approximationNotes: 成熟度等级总结的是公开证据，不是内部就绪度指标。
    claimRefs:
      - CE005
      - CE017
      - CE031
      - CE036
      - CE039
      - CE040
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 可见旅程从定向合作伙伴触达，走向嵌入式实验；若成功，则在 2026 年晚些时候扩大推出。
    data:
      items:
        - label: 识别技术合作伙伴
          detail: 公司筛选高价值游戏、仿真或机器人团队
        - label: 精选 API 访问
          detail: 只有少数外部团队获得早期模型访问
        - label: 嵌入式迭代
          detail: GI 在打磨模型的同时，从客户工作流和数据中学习
        - label: 部署证明
          detail: 成功试点需要变成可重复引用的案例
        - label: 更广泛发布
          detail: 管理层目标是在平台加固后扩大访问
    approximationNotes: 阶段是从公开合作伙伴措辞和路线图表述推断出来的，不是披露的销售打法。
    claimRefs:
      - CU002
      - CU003
      - CU006
      - CU026
      - CU035
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开证据显示漏斗顶部兴趣很强，但到具名生产客户阶段，公开证明有限。
    data:
      nodes:
        - id: a1
          label: 市场兴趣
          detail: 投资人、协作者和合作伙伴都在参与这个论点
        - id: a2
          label: 精选合作伙伴入口
          detail: 合作伙伴表单和直接触达筛选候选团队
        - id: a3
          label: 试点或早期部署
          detail: 少数客户或合作伙伴获得 API 访问
        - id: a4
          label: 具名生产证明
          detail: 目前还没有公开的具名付费客户证明
      edges:
        - - a1
          - a2
        - - a2
          - a3
        - - a3
          - a4
    approximationNotes: 最后一个节点标记的是公开证据缺口，不是已知的私下运营为零。
    claimRefs:
      - CU004
      - CU006
      - CU028
      - CU037
      - CU038
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 外部证明质量在生态合作上最高，在客户具体成果或留存上最低。
    data:
      columns:
        - 具名？
        - 显示付款方？
        - 显示生产使用？
        - 显示成果？
      rows:
        - label: CoreWeave
          values:
            - 是
            - 否
            - 基础设施：是
            - 否
        - label: Kyutai / Epic / MIRA
          values:
            - 是
            - 否
            - 合作确认
            - 否
        - label: 未具名游戏合作伙伴
          values:
            - 否
            - Unknown
            - 可能
            - 否
        - label: 未具名机器人合作伙伴
          values:
            - 否
            - Unknown
            - 可能
            - 否
        - label: 公开留存证据
          values:
            - 否
            - 否
            - 否
            - 否
    approximationNotes: 矩阵把关系存在的证据，与变现或续约证据分开。
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU031
      - CU032
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 残余风险最高的部分集中在差异化、数据权利、算力强度和早期客户集中度。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余严重度
      rows:
        - label: 竞争挤压
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 训练数据权利
          values:
            - 中
            - 高
            - 低-中
            - 高
        - label: 算力 / 现金消耗
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 客户集中度
          values:
            - 高
            - 高
            - 低-中
            - 高
        - label: 安全 / 信任态势
          values:
            - 中
            - 中-高
            - 低
            - 中-高
        - label: 监管变化
          values:
            - 中
            - 中-高
            - 中
            - 中-高
    approximationNotes: 评级概括的是公开证据，而非公司私下可能已有的内部控制。
    claimRefs:
      - CR003
      - CR015
      - CR023
      - CR026
      - CR031
      - CR033
      - CR037
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 产品延迟、证据薄弱会很快传导到更高消耗、融资需求和估值压力。
    data:
      nodes:
        - id: r1
          label: 模型表现不及预期
          detail: 基准测试或试点没能证明差异化
        - id: r2
          label: 更大范围发布延期
          detail: 选择性开放持续时间超出计划
        - id: r3
          label: 客户证明仍薄弱
          detail: 客户 Logo 少、成效弱、集中度高
        - id: r4
          label: 算力消耗居高不下
          detail: 规模收入出现前，训练和服务成本继续消耗资金
        - id: r5
          label: 融资 / 估值压力
          detail: 证据仍弱，却需要更多资本
      edges:
        - - r1
          - r2
        - - r2
          - r3
        - - r2
          - r4
        - - r3
          - r5
        - - r4
          - r5
    approximationNotes: 该图抽象出公开证据可见的主要因果链，不覆盖每一种缓释手段。
    claimRefs:
      - CR005
      - CR015
      - CR032
      - CR033
      - CR037
      - CR038
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: General Intuition 目前公开可见的技术栈要靠 Medal 数据、外部算力、选择性合作伙伴和监管放行，才能扩大规模。
    data:
      nodes:
        - id: d1
          label: Medal 平台
          detail: 游戏片段、元数据和用户生态
        - id: d2
          label: CoreWeave 算力
          detail: 已具名的规模化基础设施合作伙伴
        - id: d3
          label: 选择性合作伙伴
          detail: 早期客户证明和设计反馈
        - id: d4
          label: 监管 / 法律合规
          detail: 隐私、知识产权、AI Act 和出口管制
        - id: d5
          label: 商业 API 扩张
          detail: 投资人最终要看到的成果
      edges:
        - - d1
          - d5
        - - d2
          - d5
        - - d3
          - d5
        - - d4
          - d5
    approximationNotes: 这里只展示公开材料中明确可见的依赖项。
    claimRefs:
      - CR007
      - CR014
      - CR023
      - CR026
      - CR034
      - CR035
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从品类顺风、技术潜力，到价格纪律和投资建议的决策流。
    data:
      nodes:
        - id: tailwind
          label: 2026 年 AI 融资背景强劲
          type: start
        - id: proof
          label: 客户和经济性证明是否已经广泛且公开？
          type: decision
        - id: price
          label: $2.3B 是否落在可接受的基准情景区间内？
          type: decision
        - id: buy
          label: 潜在买入
          type: end
        - id: track
          label: 继续研究 / 跟踪
          type: end
        - id: avoid
          label: 按当前价格回避
          type: end
      edges:
        - from: tailwind
          to: proof
          label: 品类热度真实存在
        - from: proof
          to: price
          label: 是——若证据到位
        - from: proof
          to: track
          label: 否——当前证据仍薄弱
        - from: price
          to: buy
          label: 是——若价格或证据改善
        - from: price
          to: avoid
          label: 否——若缺少证据但溢价持续
    approximationNotes: 该流程把细致的尽调简化为本章最关键的两个闸门问题：证据质量和价格支撑。
    claimRefs:
      - CV011
      - CV012
      - CV035
      - CV036
      - CV039
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 当前价值的敏感性取决于里程碑兑现，不取决于一个事实上未知的公开收入倍数。
    data:
      items:
        - label: 严重重置
          value: 800
          detail: 发布延期、证明仍薄弱、融资条款恶化
        - label: 悲观中点
          value: 900
          detail: 若证据和经济性令人失望，落在当前测算低端
        - label: 基准中点
          value: 1800
          detail: 技术故事可信，但公司披露仍不足
        - label: 当前轮次
          value: 2300
          detail: 2026 年 6 月的市场出清价格
        - label: 乐观中点
          value: 4000
          detail: 更大范围发布、具名生产客户、护城河更清晰
        - label: 乐观上沿
          value: 5000
          detail: 前沿 AI 溢价接近更强私有市场同行的参照区间
    approximationNotes: 数值单位为百万美元，是按里程碑调整的分析估计，不是管理层指引，也不是收入倍数模型。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV041
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 由当前公开证据支撑的悲观、基准和乐观当前价值区间。
    data:
      items:
        - label: 悲观
          low: 600
          mid: 900
          high: 1200
          detail: 融资重置或商业化路径失败
        - label: 基准
          low: 1400
          mid: 1800
          high: 2200
          detail: 技术故事可信，但经营证明不完整
        - label: 乐观
          low: 3000
          mid: 4000
          high: 5000
          detail: 具名生产证明和持久护城河证据迅速出现
    approximationNotes: 数值单位为百万美元，代表当前价值区间而非未来退出价值，因为稀释和结构并未公开。
    claimRefs:
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向投委会的评分卡，覆盖市场、证明、护城河、经济性可见度、风险和估值支撑。
    data:
      items:
        - label: 市场顺风
          value: 9/10
          detail: 2026 年 AI 融资环境仍异常强劲
        - label: 技术看点
          value: 8/10
          detail: 世界模型命题可信，且具备战略重要性
        - label: 客户证明
          value: 4/10
          detail: 选择性合作伙伴确实存在，但缺少具名生产证明
        - label: 护城河可见度
          value: 6/10
          detail: 与 Medal 的关联可能很特别，但权利和迁移披露不足
        - label: 经济性可见度
          value: 2/10
          detail: 没有公开收入、利润率或算力成本曲线
        - label: 证据质量
          value: 4/10
          detail: 轮次价格清楚；多数投资测算驱动因素不清楚
        - label: 风险压力
          value: 3/10
          detail: 竞争、监管和资本强度仍然沉重
        - label: 估值支撑
          value: 3/10
          detail: 相对于公开证据下的基准情景，当前估值显得偏贵
    approximationNotes: 分数是为投委会框架作出的分析判断，不是标准化外部评级。分数越高越好。
    claimRefs:
      - CV006
      - CV011
      - CV023
      - CV027
      - CV028
      - CV037
      - CV038
      - CV039
