              公开部署证据是混合的。正面看，公司在公开互联网上有足够技术深度，可以越过基本可信度门槛：开放的 MIRA 代码、公开论文、明确算力依赖，以及与 Kyutai 和 Epic Games 合作的证据。
              路线图也有一些真实具体性。多方消息称，大部分新资本将用于算力，CoreWeave 是具名基础设施依赖；更广泛 API 访问目标是 2026 年夏末。负面看，这些说法背后的公开运营细节很少。 没有找到公开 API
              文档、公开可用性数据、模型卡、安全认证或信任中心。隐私声明和条款聊胜于无：它们展示了 Delaware 公司、纽约办公室、EU/UK 代表、 传输用标准合同条款，以及网站数据和 Medal
              治理的游戏玩法数据之间的明确切分。但这些是治理基础，不是商业 API 已经为企业部署加固的证明。结果是， 公司技术核心看起来比公开可靠性和合规界面更成熟。
