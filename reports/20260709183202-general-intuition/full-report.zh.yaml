      - number: '1.3'
        title: 融资、投资方图谱和运营足迹
        blocks:
          - type: paragraph
            body: >-
              公开记录里最清晰的硬数据，是 2026 年 6 月的融资披露。TechCrunch、The SaaS News、DutchNews、The Robot Report、AI Insider 和
              TechFundingNews 都指向同一组数字： $320 million Series A、估值 $2.3 billion；叠加 2025 年 10 月此前启动轮后，已披露融资约 $454
              million。Khosla Ventures 被一致列为领投方，General Catalyst、Jeff Bezos、 Eric Schmidt 或 Hillspire、Nico Rosberg
              则出现在不同辛迪加披露中。公开投资方页面提供了间接佐证：General Catalyst 将 General Intuition 列为投资组合公司，Backed VC 则显示该公司在 2025 年获得种子轮支持。


              这套公开材料没有完全对齐的是时间和地理。DutchNews 称 Series A 在 2026 年 1 月完成，只是在 6 月对外公布；TechCrunch 6 月 18 日预告文章则说公司当时正在以略高于 $2
              billion 的估值融资约 $300 million。这个顺序可以解释为一轮融资从市场沟通到交割、再到官宣的过程，但也提醒投资人不要过度解读单个时间戳文章。地点披露同样混杂：TechCrunch 和
              TechFundingNews 多次把 General Intuition 描述为总部在纽约或围绕纽约实验室运转，DutchNews 则强调公司和 IP
              仍属荷兰，同时在日内瓦、伦敦和巴黎也有办公室。最稳妥的读法是：General Intuition 运营重心在纽约，法律锚点在荷兰，并拥有分布式研究足迹。
