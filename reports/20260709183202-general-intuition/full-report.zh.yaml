        title: 最终尽调问题、论点破裂触发器与退出姿态
        blocks:
          - type: paragraph
            body: >-
              能改变这项建议的因素很直接。如果私下尽调能证明真实客户名单、合同耐久性、可信的算力成本曲线、干净的训练数据权利链，以及没有惩罚性优先权尾巴的
              股权结构表，估值讨论会有利得多。如果这些答案拿不出来，公司更适合作为跟踪中的前沿资产，而不是立即高确信度入场。论点破裂来自具体事件， 而不是抽象不适：错过更广泛发布窗口、继续没有具名生产用户、重大出口管制或 AI
              Act 摩擦，或融资重置释放内部信心变弱的信号。退出准备度低，
