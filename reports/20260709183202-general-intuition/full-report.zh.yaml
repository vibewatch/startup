      - number: '7.3'
        title: 对 Medal、CoreWeave 和创始团队的依赖会很快传导为融资风险
        blocks:
          - type: paragraph
            body: >-
              第三组风险是依赖集中。公开证据把 General Intuition 与三根尤其重要的外部支柱绑在一起：Medal 是可见的数据飞轮，CoreWeave 是具名算力伙伴，
              创始团队看起来仍承担大部分商业和技术叙事。这些依赖没有哪一项天然糟糕。事实上，每一项都是多头论点的一部分。问题在于，它们压缩了缓冲。 Medal
              访问权限变化、算力成本飙升、基础设施可用性延迟，或创始人层面扰动，都可能在公司拥有广泛公开客户基础来吸收冲击之前打到产品进展。
              由于更广泛发布仍未到来、客户披露稀疏，任何执行滑坡更可能先表现为烧钱加重和证明力变弱，而不是短暂小麻烦。投资人需要把组织厚度、算力经济性和数据控制耐久性列为关键尽调项， 不应当成次要问题。
