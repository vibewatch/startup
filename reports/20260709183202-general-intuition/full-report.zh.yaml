chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、论点和产品姿态
        blocks:
          - type: paragraph
            body: >-
              General Intuition 公开把自己定位成一个让系统在空间和时间中行动的前沿实验室，而不是又一家文本或图像生成创业公司。公司官网把核心技术栈拆成两个相连系统：行动模型决定下一步做什么，
              世界模型预测行动后的结果。官方叙事认为，单靠语言预训练不足以形成具身或智能体能力，因为真实世界能力依赖意图、动作和后果的连续序列。在这个框架里，游戏玩法不是面向消费者的副业， 而是数据引擎。General
              Intuition 称，自己的底座来自 Pim de Witte 创办的游戏片段平台 Medal；用户每年上传数十亿条游戏片段，这些片段可以配上精确动作标签，而不只是原始视频。


              产品姿态对一家这么早期的公司来说也很具体。TechCrunch、TNW 和公司网站都说，General Intuition 主要把世界模型用作训练环境，智能体本身才是最终产品。这个区分有商业意义：
              收入应来自已部署的决策系统或 API，而不只是仿真软件。官网称，公司已经让游戏、仿真和机器人领域的首批合作伙伴接入选择性商业 API；但公开材料仍没有给出伙伴名称或使用量。
              结果是一家公司拥有清晰战略叙事和选择性合作伙伴计划，但在产品成熟度和变现上公开披露仍有限。
