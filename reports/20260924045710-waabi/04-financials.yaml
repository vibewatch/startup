    "title": "Financials",
    "summary": "Waabi is still pre-scale on the revenue side, but its January 2026 financing and partner mix give it meaningful runway. Valuation is now in the high-$3B range by private-market sources, making execution speed the key underwriting variable."
  },
  "sections": [
    {
      "id": "revenue-model",
      "title": "Revenue model and monetization path",
      "body": "Waabi's monetization story is still emerging. Public sources do not show a clean ARR or revenue run-rate, which is normal for a company still scaling safety-critical autonomy. The best-supported interpretation is that Waabi will monetize through OEM-integrated software, platform licensing, and strategic deployment agreements before robotaxi economics become meaningful. That means the company is still closer to a commercialization platform than a recurring-revenue software business. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CI001",
        "CI002",
        "CI009"
      ],
      "tableRefs": [
        "TI001"
      ]
    },
    {
      "id": "capital-structure",
      "title": "Capital structure and runway",
      "body": "The financing package is large enough to keep the company moving but not so large that it removes the need for careful capital allocation. Roughly $1.28 billion of total announced funding gives Waabi room to validate, expand pilots, and build OEM relationships. The presence of Uber, Volvo, NVIDIA, and several financial investors is useful because it broadens the capital base. Still, the company remains capital intensive: if autonomy scaling takes longer than expected, more rounds or a public listing may still be needed. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CI003",
        "CI004",
        "CI005",
        "CI011"
      ],
      "tableRefs": [
        "TI002"
      ],
      "figureRefs": [
        "FI001"
      ]
    },
    {
      "id": "valuation-and-underwriting",
      "title": "Valuation and underwriting frame",
      "body": "Private-market data now points to a valuation in the high-$3 billion range, while the company still does not publicly disclose a precise mark. Those numbers matter less as precise marks than as a signal that Waabi is being priced for future optionality rather than current cash flow. That makes the investment case very sensitive to whether the company can convert technical progress into durable commercial deployment. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CI006",
        "CI007",
        "CI012"
      ],
      "tableRefs": [
        "TI003"
      ],
      "figureRefs": []
    }
