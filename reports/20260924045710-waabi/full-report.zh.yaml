  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与买方群体
        blocks:
          - type: paragraph
            body: >-
              Waabi 瞄准的不是泛化的自动驾驶市场，而是先做长途货运，再用同一套核心 AI 技术栈拓展 robotaxi。买方虽多，需求却各有边界：车队和托运方看重线路经济性与车辆利用率，OEM
              看重集成和安全验证，网约车平台需要能规模部署的运力。Waabi 面对的市场，正是货运经济性、OEM 集成和平台分发三者的交汇。规模、可复制性和客户广度仍待更多公开证据；本章判断以公开材料为限，不把愿景当事实。
