  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Driver 自动驾驶系统与仿真器技术栈
        blocks:
          - type: paragraph
            body: >-
              Waabi 的产品由两部分组成：Waabi Driver 和 Waabi World。Driver 负责做驾驶决策；Waabi World
              是闭环仿真器，先训练、验证这些决策，再让系统上路。两者合起来就是公司的“仿真优先”自动驾驶路线。这并非只靠品牌包装：公开材料反复把商业进展与仿真器能力、以及 Driver
              在不同车型平台间的迁移表现联系起来。规模、可复制性和客户广度仍待更多公开证据；本章判断以公开材料为限，不把愿景当事实。
