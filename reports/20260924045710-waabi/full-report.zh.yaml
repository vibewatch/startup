          detail: 核心平台最可能跑通的首条变现路径。
          tone: neutral
        - label: 直客货运服务
          detail: 若特定货运走廊落地顺利，有望进一步改善经济模型。
          tone: neutral
        - label: Robotaxi 上行空间
          detail: 最大的业务期权价值在于平台级规模化部署。
          tone: positive
