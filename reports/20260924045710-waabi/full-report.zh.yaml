        title: 收入模式与商业化路径
        blocks:
          - type: paragraph
            body: >-
              Waabi 的变现路径仍在形成。公开资料没有清晰的 ARR 或收入运行率数据；Waabi 仍在推进安全关键型自动驾驶的规模化，这种情况并不罕见。现有证据最支持的判断是：Robotaxi
              经济效益尚未显现前，Waabi 主要靠 OEM
              集成软件、平台授权和战略部署协议变现。因此，它目前更像一家推动商业落地的平台公司，而非已有稳定经常性收入的软件企业。规模、可复制性和客户广度还需更多公开证据；本章判断以公开材料为限，不把愿景当事实。
