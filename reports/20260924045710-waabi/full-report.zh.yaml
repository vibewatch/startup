      - number: '3.3'
        title: 为何竞争依然残酷
        blocks:
          - type: paragraph
            body: >-
              Waabi 虽有进展，竞争仍很残酷。规模更大的自动驾驶公司通常积累了更多公开道路里程、部署范围更广，或拥有更成熟的伙伴生态。货运领域里，Waabi 得与资金更充足、运营经验更久的团队争胜；robotaxi
              领域里，则要面对已有消费需求的平台玩家。融资缓解了资金压力，却改变不了现实：Waabi
              同时要赢得技术信任、完成工程部署，并证明安全规模化。规模、可复制性和客户广度仍待更多公开证据；本章结论以公开材料为限，不把愿景当事实。
            claimRefs:
              - CP006
