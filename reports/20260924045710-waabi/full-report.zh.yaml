      - number: '3.2'
        title: 技术差异化与产品架构
        blocks:
          - type: paragraph
            body: >-
              Waabi 与合作伙伴介绍的架构，是其差异化最有力的证据：端到端 AI 技术栈由 Waabi World 闭环仿真器支撑，模型先在仿真中学习和验证，再上真实道路。相比依赖大量手写管线的模块化 AV 1.0
              系统，这确有不同。产品团队还盯着 ODD 覆盖度、路线可行性和系统就绪度，目标是把研发技术栈变成可部署产品。规模、可复制性和客户广度仍待更多公开证据；本章判断以公开材料为限，不把愿景当事实。
