        title: 直接与相邻竞争版图
        blocks:
          - type: paragraph
            body: >-
              Waabi 的竞品范围，超出卡车业务背景给人的印象。货运领域最直接的对标仍是 Aurora 和 Kodiak；robotaxi 领域还包括 Waymo、Tesla、Wayve、Nuro
              等平台支持的自动驾驶公司。关注这片更大的竞争版图，是因为 Waabi
              不再只提供卡车方案，还要证明同一套技术栈无需每次重做业务架构，就能迁移到不同用例。规模、可复制性和客户广度仍待更多公开证据；本章判断以公开材料为限，不把愿景当事实。
