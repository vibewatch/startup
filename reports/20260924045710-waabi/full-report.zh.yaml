        title: 市场规模测算视角与落地阻力
        blocks:
          - type: paragraph
            body: >-
              货运市场是目前最合适的参照。Waabi 及其支持者称，北美货运市场规模约 $1 trillion；这不是 Waabi
              能直接拿下的收入，而是说明它切入的业务盘子很大，车辆利用率、燃油、司机短缺和安全都牵动整体经济性。机会越大，落地往往越慢：监管、OEM
              集成、安全验证和部署准备度都限制渗透速度。规模、可复制性和客户广度仍需更多公开证据；本章判断以公开材料为限，不把愿景当事实。
