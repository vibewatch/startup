      - number: '6.3'
        title: 实现客户规模化可持续增长的前提
        blocks:
          - type: paragraph
            body: >-
              关键不在客户有没有兴趣——兴趣显然存在——而在采用能否超越少数战略伙伴。Waabi 提到的直客模式，意在减少对中转枢纽的依赖、降低落地摩擦；与 Uber 合作则为 robotaxi
              引入平台分发。要形成可持续规模，公司需要在多条货运线路上复制运营，确保 OEM
              集成能适配不同车型，也要证明商业模式能从试点走向量产。规模、可复制性和客户广度仍需更多公开证据；本章结论以公开材料为限，不把愿景当事实。
            claimRefs:
              - CU006
              - CU008
              - CU009
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >-
              Waabi 面临的最大风险在安全、监管和公开道路验证。市场规则尚未定型，Waabi
              却在推动一套备受关注的自动驾驶技术栈商业化；一旦发生安全事故或验证失误，监管和声誉问题会很快浮现。现有证据没有显示产品本身出了问题，但部署范围仍窄，一次差错就可能造成重大影响。规模、可复制性和客户广度仍待更多公开证据；本章判断以公开材料为限，不把愿景当事实。
            claimRefs:
              - CR001
              - CR002
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
      - number: '7.2'
        title: 运营、生态依赖与网络安全风险
        blocks:
          - type: paragraph
            body: >-
              第二类风险是对外部环节的依赖。Waabi 仰赖少数战略伙伴、复杂的仿真技术栈，以及必须经得住高负载的基础设施。由此带来另一种脆弱性：即便核心 AI 模型够强，若 OEM
              集成停滞，或遥测和事故治理不到位，产品仍可能在生产环境中失效。网络安全和数据治理不是枝节，而是安全论证的一部分。规模、可复制性和客户广度还需更多公开证据；本章判断以公开材料为限，不把愿景当事实。
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR009
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR010
      - number: '7.3'
        title: 商业、竞争与财务风险
        blocks:
          - type: paragraph
            body: >-
              Waabi 仍在与资金更充足、运营更成熟的自动驾驶公司竞速，部署时点因此格外关键：若商业化延期，公司就得在收入尚未放量前继续承担高额研发支出。证据库中最审慎的外部评估来自 RFP.wiki 的评审：买方应要求
              Waabi 拿出已具备量产条件的证据，不能假定试点成功就能复制到全面推广。这也是当前尽调应有的审慎态度。规模、可复制性和客户广度仍需更多公开证据；本章判断以公开材料为限，不把愿景当事实。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR009
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议逻辑
        blocks:
          - type: paragraph
            body: >-
              Waabi 已展现出可信的自动驾驶平台公司特征，伙伴实力强，也有真实部署进展；但公开财务证据还不足以支撑高确信度的投资判断。当前最站得住脚的建议是密切跟踪。这样既保留卡车与 robotaxi
              共用技术栈的上行空间，也承认商业化仍处早期。Waabi 的投资逻辑有吸引力，但最终仍取决于未来能否兑现。规模、可复制性和客户广度仍待更多公开证据；本章判断以公开材料为限，不把愿景当事实。
            claimRefs:
              - CV001
              - CV005
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
      - number: '8.2'
        title: 估值立场与市场定价隐含预期
        blocks:
          - type: paragraph
            body: >-
              将 Waabi 估值评为偏高是合理的。相较于公司有限的披露，一级市场信源给出的估值溢价明显；Waabi 自身并未公开估值。这不等于定价不理性，而是投资人在押注未来选择权：先做卡车业务，再拓展
              robotaxi，并期待同一套技术栈能跨场景复用。只有部署真正上规模，这些选择权才有价值。规模、可复制性和客户广度仍需更多公开证据；本章判断以公开材料为限，不把愿景当事实。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 乐观与悲观情景推演
        blocks:
          - type: paragraph
            body: >-
              乐观情景是：更多 OEM 完成集成、干线运营指标改善，Uber 合作也成功推动 robotaxi 落地，Waabi 因而有望成为 AV 2.0
              的品类领军者。悲观情景同样清楚：若上线延期或出现安全问题，公司仍未产生收入，维持运营也要耗费大量资金。估值之所以对未来几个里程碑如此敏感，而非由当前财务指标主导，正是因为这种上下行不对称。规模、可复制性和客户广度仍需更多公开证据；本章判断以公开材料为限，不把愿景当事实。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
