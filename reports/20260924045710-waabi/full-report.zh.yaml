        - label: 一级市场定价
          detail: 一级市场交易指向高额溢价，但 Waabi 自身并未公开官方估值。
          tone: neutral
        - label: 战略资本加持
          detail: Uber 与 OEM 投资方为估值溢价提供支撑。
          tone: positive
        - label: 执行依赖极高
          detail: 每个业务里程碑都得靠实际执行兑现。
          tone: risk
        - label: 乐观情景
          detail: 卡车与 Robotaxi 的逻辑若跑通，公司估值有望重估上行。
          tone: positive
        - label: 悲观情景
          detail: 落地延期或安全问题会直接压缩估值倍数。
          tone: risk
        - label: 建议结论：观察
