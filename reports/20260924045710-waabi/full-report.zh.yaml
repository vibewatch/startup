      - number: '1.2'
        title: 资本结构、投资方与商业合作伙伴
        blocks:
          - type: paragraph
            body: >-
              融资是 Waabi 最鲜明的信号之一。2026 年 1 月，公司公布 $750 million Series C，并宣布 Uber 另有最高 $250 million、与里程碑挂钩的注资承诺；累计公布融资约
              $1.28 billion。 Waabi 成立时间不长，投资人阵容却格外强：既有风投，也有来自卡车运输、汽车制造、云和 AI 基础设施的战略方。要把安全关键系统推向规模化，Waabi
              需要主机厂配合、平台信誉和足够资金持续迭代，这样的股东组合与业务需求相符。规模、可复制性和客户广度仍待更多公开证据；本章判断以公开材料为限，不把愿景当事实。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 印证脱离纯研发阶段的关键里程碑
        blocks:
          - type: paragraph
            body: >-
              Waabi 近期最有力的证据不是某次产品发布，而是一连串执行动作：卡车平台迁移、公开道路试点、融资落地，商业叙事也在拓宽。公司已谈到直客货运流程和 robotaxi
              扩张；这比仍处实验室阶段的初创公司通常会宣称的更进取。与传统巨头相比，Waabi 员工规模仍不大，但业务布局和伙伴阵容显示它正进入扩张阶段，而不只是做愿景
              demo。规模、可复制性和客户广度还需要更多公开证据；本章仍以已披露材料为依据，不把愿景当事实。
