        blocks:
          - type: paragraph
            body: >-
              自动驾驶市场仍早，但并非空谈：Waabi 登上 CNBC 榜单、与 AWS 保持长期基础设施合作，也已在 Texas
              公开试点，这些都说明公司身处真实商业环境。行业竞争激烈、资本消耗大，因此仿真优先和直客模式的叙事更能引起共鸣。投资方与合作伙伴似乎认为市场足以容纳多家赢家；但市场仍早，执行风险不能忽视。规模、可复制性和客户广度还需更多公开证据；本章判断仍以公开材料为限，不把愿景当事实。
