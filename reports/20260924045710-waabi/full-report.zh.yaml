chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、创始人与业务版图
        blocks:
          - type: paragraph
            body: >-
              Waabi 的业务定位不难说清，投资判断却仍难有十足把握。Raquel Urtasun 于 2021 年在 Toronto 创立这家自动驾驶公司；公开材料将其定位为 Physical AI
              企业，而非只做卡车这一赛道的研发实验室。公司的核心设想，是让一套可验证模型同时服务于自动驾驶卡车和 robotaxi。办公室与招聘活动覆盖 Toronto
              及美国多个科技、物流枢纽，既显露业务野心，也说明运营布局不止一地。规模、可复制性和客户广度仍待更多公开证据，下一轮更新再补；本章判断以公开材料为限，不把愿景当事实。
