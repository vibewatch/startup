      - number: '6.2'
        title: Evidence of adoption and movement beyond pilots
        blocks:
          - type: paragraph
            body: >-
              There is enough evidence to say Waabi is beyond a demo. Public reports describe commercial pilots in
              Texas, integration into Volvo's truck platform, and a robotaxi partnership with Uber that could reach at
              least 25,000 vehicles over time. G2 Venture Partners also says the company already runs commercial
              operations with fleets, retailers, and shippers. Taken together, that is stronger than slideware, but
              still short of a fully diversified customer base. This chapter still leaves room for broader public proof
              on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in
              public evidence rather than aspiration alone.
