chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founders, and footprint
        blocks:
          - type: paragraph
            body: >-
              Waabi is now easy to classify but still not fully easy to underwrite. The company is a Toronto-based
              autonomous vehicle startup founded in 2021 by Raquel Urtasun, and its public materials position it as a
              Physical AI company rather than a one-vertical trucking lab. The core story is that a single verifiable
              model can move between autonomous trucks and robotaxis, with offices and hiring activity that span Toronto
              plus several U.S. tech and logistics hubs. That combination matters because it signals both ambition and a
              broad operational footprint. This chapter still leaves room for broader public proof on scale,
              repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public
              evidence rather than aspiration alone.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
