              for careful capital allocation. Roughly $1.28 billion of total announced funding gives Waabi room to
              validate, expand pilots, and build OEM relationships. The presence of Uber, Volvo, NVIDIA, and several
              financial investors is useful because it broadens the capital base. Still, the company remains capital
              intensive: if autonomy scaling takes longer than expected, more rounds or a public listing may still be
