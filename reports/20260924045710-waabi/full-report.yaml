  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and safety risks
        blocks:
          - type: paragraph
            body: >-
              Waabi's biggest risks cluster around safety, regulation, and public-road validation. The company is trying
              to commercialize a highly visible autonomy stack before the market is fully settled, which means any
              safety incident or validation miss would quickly become a regulatory and reputational problem. The
              evidence does not suggest a broken product; it suggests a product whose deployment regime is still narrow
              enough that a mistake could matter a lot. This chapter still leaves room for broader public proof on
              scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public
              evidence rather than aspiration alone.
            claimRefs:
              - CR001
              - CR002
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
      - number: '7.2'
        title: Operational, dependency, and cybersecurity risks
        blocks:
          - type: paragraph
            body: >-
              The second major bucket is dependency risk. Waabi depends on a small number of strategic partners, a
              complex simulation stack, and infrastructure that must keep working under heavy load. That creates a
              different kind of fragility: if OEM integration stalls, or if telemetry and incident governance are weak,
              the product can fail in production even if the core AI model is strong. Cybersecurity and data governance
              are therefore not side issues; they are part of the safety case. This chapter still leaves room for
              broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the
              chapter grounded in public evidence rather than aspiration alone.
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
