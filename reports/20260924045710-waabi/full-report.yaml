              which is normal for a company still scaling safety-critical autonomy. The best-supported interpretation is
              that Waabi will monetize through OEM-integrated software, platform licensing, and strategic deployment
              agreements before robotaxi economics become meaningful. That means the company is still closer to a
              commercialization platform than a recurring-revenue software business. This chapter still leaves room for
              broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the
