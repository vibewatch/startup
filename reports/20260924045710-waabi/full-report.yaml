              - CO006
              - CO007
      - number: '1.3'
        title: Milestones that show a company beyond pure R&D
        blocks:
          - type: paragraph
            body: >-
              Waabi's strongest recent evidence is not a single product launch but a pattern of execution:
              truck-platform transfer, public-road pilots, a major funding event, and a broadening commercial narrative.
              The company is already talking about direct-to-customer freight workflows and robotaxi expansion, which is
              more aggressive than a purely lab-stage startup would usually claim. Headcount remains modest compared
              with legacy incumbents, but the company's footprint and partner set indicate a scaling phase rather than a
              moonshot demo phase. This chapter still leaves room for broader public proof on scale, repeatability, and
              customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than
              aspiration alone.
