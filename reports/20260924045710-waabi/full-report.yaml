      - number: '5.3'
        title: Maturity and scale implications
        blocks:
          - type: paragraph
            body: >-
              Waabi still depends heavily on self-reported technical claims, but the evidence stack is getting thicker.
              NVIDIA, AWS, and multiple job postings all point in the same direction: a simulator-backed, end-to-end AI
              system that is moving from research into commercialization. The question is no longer whether the company
              has a sophisticated architecture. The question is whether that architecture keeps translating into safe
              public-road deployment and repeatable product delivery. This chapter still leaves room for broader public
              proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded
              in public evidence rather than aspiration alone.
