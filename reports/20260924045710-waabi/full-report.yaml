              - CV011
      - number: '8.2'
        title: Valuation stance and what the market is pricing in
        blocks:
          - type: paragraph
            body: >-
              A stretched valuation stance is fair. Private-market sources point to a premium mark relative to the
              company's current disclosure level, and Waabi has not disclosed a public valuation itself. That does not
              mean the price is irrational — it means investors are paying for optionality: trucks first, robotaxis
              second, and a single stack that might generalize across both. The problem is that optionality only works
              if deployment actually scales. This chapter still leaves room for broader public proof on scale,
              repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public
              evidence rather than aspiration alone.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Upside and downside scenarios
        blocks:
          - type: paragraph
            body: >-
              The upside case is straightforward: more OEM integrations, better corridor performance, and a successful
              robotaxi rollout through Uber could turn Waabi into a category leader in AV 2.0. The downside case is just
              as clear: if launch timing slips or safety issues appear, the company would still be pre-revenue and
              expensive to carry. That asymmetry is why valuation remains sensitive to the next few milestones rather
              than to current financial metrics. This chapter still leaves room for broader public proof on scale,
              repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public
              evidence rather than aspiration alone.
