  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition and buyer groups
        blocks:
          - type: paragraph
            body: >-
              Waabi is not trying to win a generic autonomy market. It is aiming at a specific wedge: long-haul trucking
              first, then robotaxis through the same core AI stack. That matters because the buyer set is broad but not
              undefined. Fleets and shippers care about lane economics and utilization, OEMs care about integration and
              validation, and ride-hailing platforms care about deployable capacity at scale. The relevant market is
              therefore a mix of freight economics, OEM integration, and platform distribution. This chapter still
              leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh.
              That keeps the chapter grounded in public evidence rather than aspiration alone.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
      - number: '2.2'
        title: Sizing lens and adoption friction
        blocks:
          - type: paragraph
            body: >-
              The best available proxy is the freight market itself, which Waabi and its supporters describe as roughly
              a $1 trillion North American opportunity. That does not mean Waabi can capture that figure directly; it
              means the company is attacking a very large workflow where utilization, fuel, driver shortage, and safety
              all matter. The hard part is that the same forces that make the opportunity large also make it slow:
              regulation, OEM integration, safety validation, and deployment readiness all constrain the pace of
              capture. This chapter still leaves room for broader public proof on scale, repeatability, and customer
              breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration
              alone.
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM007
