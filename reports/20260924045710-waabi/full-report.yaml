  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The driver and simulator stack
        blocks:
          - type: paragraph
            body: >-
              Waabi's product is easiest to understand as a pair: the Waabi Driver and Waabi World. The Driver is the
              model that makes driving decisions, while Waabi World is the simulator that trains and validates those
              decisions before they are exposed to the road. Together, they define the company's simulation-first
              autonomy thesis. This is a genuine product architecture, not just a branding exercise, because the public
              evidence repeatedly ties commercial progress to the simulator and to the Driver's transfer between vehicle
              platforms. This chapter still leaves room for broader public proof on scale, repeatability, and customer
              breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration
              alone.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE012
