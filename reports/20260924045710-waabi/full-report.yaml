              - CR003
              - CR004
              - CR010
      - number: '7.3'
        title: Commercial, competitive, and financial risk
        blocks:
          - type: paragraph
            body: >-
              Commercially, Waabi is still in a race against better-capitalized and more operationally mature AV peers.
              That makes timing risk very real: if deployment slips, the company must continue funding expensive
              development before revenue scales. The most cautious external assessment in the evidence set is the
              RFP.wiki review, which essentially says the buyer should demand proof of production readiness instead of
              assuming pilot success will generalize. That is the right diligence posture here. This chapter still
              leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh.
              That keeps the chapter grounded in public evidence rather than aspiration alone.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR012
