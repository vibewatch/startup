      - number: '1.2'
        title: Capital, investors, and commercial partners
        blocks:
          - type: paragraph
            body: >-
              The financing picture is one of Waabi's clearest signals. The January 2026 Series C was announced as a
              $750 million round with an additional milestone-based Uber commitment of up to $250 million, taking
              announced funding to roughly $1.28 billion. The investor roster is unusually stacked for a company this
              young: venture investors are joined by strategic names from trucking, automotive, cloud, and AI
              infrastructure. That mix is consistent with a business that needs OEM alignment, platform credibility, and
              enough capital to keep iterating on a safety-critical system before scaling. This chapter still leaves
              room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That
              keeps the chapter grounded in public evidence rather than aspiration alone.
            claimRefs:
              - CO005
