  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation logic
        blocks:
          - type: paragraph
            body: >-
              Waabi looks like a credible autonomy platform company with strong partners and real deployment momentum,
              but not one with enough public financial proof to justify aggressive conviction. The most defensible
              recommendation is to track the company closely. That stance reflects both the upside of a shared
              truck-and-robotaxi stack and the reality that commercialization is still early. In other words, Waabi has
              a strong thesis, but the underwriting story still leans on future execution. This chapter still leaves
              room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That
              keeps the chapter grounded in public evidence rather than aspiration alone.
            claimRefs:
              - CV001
              - CV005
