      - number: '6.3'
        title: What durable customer scale would require
        blocks:
          - type: paragraph
            body: >-
              The main customer question is not whether there is interest — there clearly is — but whether adoption can
              scale beyond a handful of strategic names. Waabi's direct-to-customer language suggests it wants to reduce
              friction by eliminating some hub dependencies, while the Uber partnership suggests it wants platform
              distribution for robotaxis. Durable adoption will depend on repeatable corridors, OEM integration that
              does not break with each vehicle platform, and a customer story that survives the move from pilot to
              production. This chapter still leaves room for broader public proof on scale, repeatability, and customer
              breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration
              alone.
