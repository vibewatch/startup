        title: Current customer base and partner set
        blocks:
          - type: paragraph
            body: >-
              Waabi's customer picture is concentrated rather than broad. The public evidence points to a small set of
              strategic partners: Uber Freight on the trucking side, Volvo as the OEM integration anchor, and Uber on
              the robotaxi side. That is not a problem by itself; in autonomy, strategic partners matter more than a
              long list of logo customers. But it does mean the company is still proving whether a few important
              relationships can convert into durable commercial demand. This chapter still leaves room for broader
              public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter
              grounded in public evidence rather than aspiration alone.
