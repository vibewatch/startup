            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
      - number: '2.3'
        title: Signals that the market is real rather than hypothetical
        blocks:
          - type: paragraph
            body: >-
              This is still an early market, but it is not imaginary. CNBC's ranking, AWS's long-running infrastructure
              partnership, and the company's public pilots in Texas all show that Waabi is operating in a live
              commercial environment. The market is competitive and capital-intensive, yet that is precisely why the
              company's simulation-first and direct-to-customer story resonates. Investors and partners appear to view
              the market as big enough to support several winners, but still too early to ignore execution risk. This
              chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the
              next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.
            claimRefs:
              - CM008
