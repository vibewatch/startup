      - number: '5.2'
        title: Validation, mixed reality, and operating model
        blocks:
          - type: paragraph
            body: >-
              Mixed Reality Testing is the best evidence that Waabi is trying to change the economics of validation, not
              just the code. The company is clearly investing in a workflow where simulation and real-world testing
              reinforce each other. That matters because safety-critical autonomy is won or lost on the ability to prove
              behavior across edge cases. The public job postings also imply a mature engineering organization with
              autonomy, simulation, and tooling specialists rather than a single research team. This chapter still
              leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh.
              That keeps the chapter grounded in public evidence rather than aspiration alone.
