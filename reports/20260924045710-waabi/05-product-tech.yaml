    "summary": "Waabi's core product is a simulator-backed end-to-end autonomy stack: Waabi Driver plus Waabi World. The evidence points to a technically sophisticated system that is still proving itself in commercial deployment."
  },
  "sections": [
    {
      "id": "driver-and-simulator",
      "title": "The driver and simulator stack",
      "body": "Waabi's product is easiest to understand as a pair: the Waabi Driver and Waabi World. The Driver is the model that makes driving decisions, while Waabi World is the simulator that trains and validates those decisions before they are exposed to the road. Together, they define the company's simulation-first autonomy thesis. This is a genuine product architecture, not just a branding exercise, because the public evidence repeatedly ties commercial progress to the simulator and to the Driver's transfer between vehicle platforms. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CE001",
        "CE002",
        "CE005",
        "CE012"
      ],
      "tableRefs": [
        "TE001"
      ],
      "figureRefs": [
        "FE001"
      ]
    },
    {
      "id": "validation-and-operating-model",
      "title": "Validation, mixed reality, and operating model",
      "body": "Mixed Reality Testing is the best evidence that Waabi is trying to change the economics of validation, not just the code. The company is clearly investing in a workflow where simulation and real-world testing reinforce each other. That matters because safety-critical autonomy is won or lost on the ability to prove behavior across edge cases. The public job postings also imply a mature engineering organization with autonomy, simulation, and tooling specialists rather than a single research team. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CE003",
        "CE004",
        "CE006",
        "CE008"
      ],
      "tableRefs": [
        "TE002"
      ]
    },
    {
      "id": "maturity-and-scale",
      "title": "Maturity and scale implications",
      "body": "Waabi still depends heavily on self-reported technical claims, but the evidence stack is getting thicker. NVIDIA, AWS, and multiple job postings all point in the same direction: a simulator-backed, end-to-end AI system that is moving from research into commercialization. The question is no longer whether the company has a sophisticated architecture. The question is whether that architecture keeps translating into safe public-road deployment and repeatable product delivery. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CE007",
        "CE009",
        "CE010",
        "CE011"
      ],
      "tableRefs": [
        "TE003"
      ],
      "figureRefs": []
    }
  ],
