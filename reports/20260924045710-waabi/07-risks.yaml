    "summary": "Waabi's risk profile is dominated by safety, regulation, partner dependency, and commercialization timing. The company is progressing, but any slip in deployment or incident handling could materially slow the thesis."
  },
  "sections": [
    {
      "id": "risk-register",
      "title": "Regulatory, legal, and safety risks",
      "body": "Waabi's biggest risks cluster around safety, regulation, and public-road validation. The company is trying to commercialize a highly visible autonomy stack before the market is fully settled, which means any safety incident or validation miss would quickly become a regulatory and reputational problem. The evidence does not suggest a broken product; it suggests a product whose deployment regime is still narrow enough that a mistake could matter a lot. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CR001",
        "CR002",
        "CR005"
      ],
      "tableRefs": [
        "TR001"
      ]
    },
    {
      "id": "dependency-and-ops",
      "title": "Operational, dependency, and cybersecurity risks",
      "body": "The second major bucket is dependency risk. Waabi depends on a small number of strategic partners, a complex simulation stack, and infrastructure that must keep working under heavy load. That creates a different kind of fragility: if OEM integration stalls, or if telemetry and incident governance are weak, the product can fail in production even if the core AI model is strong. Cybersecurity and data governance are therefore not side issues; they are part of the safety case. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CR003",
        "CR004",
        "CR009",
        "CR011"
      ],
      "tableRefs": [
        "TR002"
      ],
      "figureRefs": [
        "FR001"
      ]
    },
    {
      "id": "commercial-and-financial",
      "title": "Commercial, competitive, and financial risk",
      "body": "Commercially, Waabi is still in a race against better-capitalized and more operationally mature AV peers. That makes timing risk very real: if deployment slips, the company must continue funding expensive development before revenue scales. The most cautious external assessment in the evidence set is the RFP.wiki review, which essentially says the buyer should demand proof of production readiness instead of assuming pilot success will generalize. That is the right diligence posture here. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CR006",
        "CR007",
        "CR008",
        "CR010",
        "CR012"
      ],
      "tableRefs": [
        "TR003"
      ],
