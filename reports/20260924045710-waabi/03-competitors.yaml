  "sections": [
    {
      "id": "competitor-landscape",
      "title": "Direct and adjacent competitor landscape",
      "body": "Waabi's competitive set is wider than its trucking heritage would suggest. On the freight side, Aurora and Kodiak remain the clearest direct comparables. On the robotaxi side, the relevant universe expands to Waymo, Tesla, Wayve, Nuro, and other platform-backed AV efforts. That broader set matters because Waabi is no longer selling only a trucking answer; it is trying to prove that the same stack can move across use cases without re-architecting the business every time. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CP001",
        "CP003",
        "CP008"
      ],
      "tableRefs": [
        "TP001"
      ],
      "figureRefs": []
    },
    {
      "id": "technical-differentiation",
      "title": "Technical differentiation and product architecture",
      "body": "The strongest evidence for differentiation is architectural. Waabi and its partners describe a verifiable end-to-end AI stack backed by Waabi World, a simulator that helps the model learn and validate before it touches the road. That is a real distinction versus modular AV 1.0 systems, which depend more heavily on hand-coded pipelines. The product team's KPIs — ODD coverage, route viability, and system readiness — reinforce that the company is trying to turn a research stack into a deployable product. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CP002",
        "CP004",
        "CP005",
        "CP012"
      ],
      "tableRefs": [
        "TP002"
      ],
      "figureRefs": [
        "FP001"
      ]
    },
    {
      "id": "why-the-race-is-hard",
      "title": "Why the competitive race is still hard",
      "body": "Waabi does have momentum, but the competitive problem is still brutal. Larger AV players often have more public-road miles, broader deployment footprints, or more mature partner ecosystems. In trucking, that means Waabi has to beat or outlast teams with more capital and more operational history. In robotaxi, it has to compete with platform players that already have consumer demand. The capital raise helps, but it does not erase the fact that the company is now in a multi-front race for credibility, deployment, and safe scale. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CP006",
        "CP007",
        "CP010",
        "CP011"
      ],
      "tableRefs": [
        "TP003"
      ],
      "figureRefs": []
