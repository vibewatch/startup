    "number": 2,
    "title": "Market Analysis",
    "summary": "Waabi is playing a two-stage market: freight autonomy first, then robotaxis using the same AI stack. The opportunity is large, but adoption is constrained by regulation, OEM integration, and safety validation."
  },
  "sections": [
    {
      "id": "market-definition",
      "title": "Market definition and buyer groups",
      "body": "Waabi is not trying to win a generic autonomy market. It is aiming at a specific wedge: long-haul trucking first, then robotaxis through the same core AI stack. That matters because the buyer set is broad but not undefined. Fleets and shippers care about lane economics and utilization, OEMs care about integration and validation, and ride-hailing platforms care about deployable capacity at scale. The relevant market is therefore a mix of freight economics, OEM integration, and platform distribution. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CM001",
        "CM002",
        "CM005",
        "CM006"
      ],
      "tableRefs": [
        "TM001"
      ]
    },
    {
      "id": "sizing-and-friction",
      "title": "Sizing lens and adoption friction",
      "body": "The best available proxy is the freight market itself, which Waabi and its supporters describe as roughly a $1 trillion North American opportunity. That does not mean Waabi can capture that figure directly; it means the company is attacking a very large workflow where utilization, fuel, driver shortage, and safety all matter. The hard part is that the same forces that make the opportunity large also make it slow: regulation, OEM integration, safety validation, and deployment readiness all constrain the pace of capture. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CM003",
        "CM004",
        "CM007",
        "CM011"
      ],
      "tableRefs": [
        "TM002"
      ],
      "figureRefs": [
        "FM001"
      ]
    },
    {
      "id": "signals-of-progress",
      "title": "Signals that the market is real rather than hypothetical",
      "body": "This is still an early market, but it is not imaginary. CNBC's ranking, AWS's long-running infrastructure partnership, and the company's public pilots in Texas all show that Waabi is operating in a live commercial environment. The market is competitive and capital-intensive, yet that is precisely why the company's simulation-first and direct-to-customer story resonates. Investors and partners appear to view the market as big enough to support several winners, but still too early to ignore execution risk. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CM008",
        "CM009",
        "CM010",
        "CM012"
      ],
      "tableRefs": [
        "TM003"
      ],
