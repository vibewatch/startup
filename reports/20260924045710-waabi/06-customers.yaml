    "number": 6,
    "title": "Customers",
    "summary": "Waabi's customer story is concentrated but credible: truck pilots in Texas, Volvo as the OEM anchor, and Uber as the platform route for robotaxis. The question is whether those strategic relationships can turn into durable, repeatable adoption."
  },
  "sections": [
    {
      "id": "customer-base",
      "title": "Current customer base and partner set",
      "body": "Waabi's customer picture is concentrated rather than broad. The public evidence points to a small set of strategic partners: Uber Freight on the trucking side, Volvo as the OEM integration anchor, and Uber on the robotaxi side. That is not a problem by itself; in autonomy, strategic partners matter more than a long list of logo customers. But it does mean the company is still proving whether a few important relationships can convert into durable commercial demand. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CU001",
        "CU002",
        "CU003",
        "CU004"
      ],
      "tableRefs": [
        "TU001"
      ]
    },
    {
      "id": "adoption-evidence",
      "title": "Evidence of adoption and movement beyond pilots",
      "body": "There is enough evidence to say Waabi is beyond a demo. Public reports describe commercial pilots in Texas, integration into Volvo's truck platform, and a robotaxi partnership with Uber that could reach at least 25,000 vehicles over time. G2 Venture Partners also says the company already runs commercial operations with fleets, retailers, and shippers. Taken together, that is stronger than slideware, but still short of a fully diversified customer base. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CU005",
        "CU007",
        "CU011"
      ],
      "tableRefs": [
        "TU002"
      ],
      "figureRefs": [
        "FU001"
      ]
    },
    {
      "id": "retention-and-scale",
      "title": "What durable customer scale would require",
      "body": "The main customer question is not whether there is interest — there clearly is — but whether adoption can scale beyond a handful of strategic names. Waabi's direct-to-customer language suggests it wants to reduce friction by eliminating some hub dependencies, while the Uber partnership suggests it wants platform distribution for robotaxis. Durable adoption will depend on repeatable corridors, OEM integration that does not break with each vehicle platform, and a customer story that survives the move from pilot to production. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CU006",
        "CU008",
        "CU009",
        "CU010",
        "CU012"
      ],
      "tableRefs": [
        "TU003"
      ],
