    "number": 1,
    "title": "Company Overview",
    "summary": "Waabi is a Toronto-based Physical AI company founded in 2021 by Raquel Urtasun. It has raised roughly $1.28B, sits at the center of a large strategic investor stack, and is actively commercializing autonomous trucking while expanding into robotaxis."
  },
  "sections": [
    {
      "id": "identity-footprint",
      "title": "Identity, founders, and footprint",
      "body": "Waabi is now easy to classify but still not fully easy to underwrite. The company is a Toronto-based autonomous vehicle startup founded in 2021 by Raquel Urtasun, and its public materials position it as a Physical AI company rather than a one-vertical trucking lab. The core story is that a single verifiable model can move between autonomous trucks and robotaxis, with offices and hiring activity that span Toronto plus several U.S. tech and logistics hubs. That combination matters because it signals both ambition and a broad operational footprint. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CO001",
        "CO002",
        "CO003",
        "CO004"
      ],
      "tableRefs": [
        "TO001"
      ],
      "figureRefs": [
        "FO001"
      ]
    },
    {
      "id": "capital-and-partners",
      "title": "Capital, investors, and commercial partners",
      "body": "The financing picture is one of Waabi's clearest signals. The January 2026 Series C was announced as a $750 million round with an additional milestone-based Uber commitment of up to $250 million, taking announced funding to roughly $1.28 billion. The investor roster is unusually stacked for a company this young: venture investors are joined by strategic names from trucking, automotive, cloud, and AI infrastructure. That mix is consistent with a business that needs OEM alignment, platform credibility, and enough capital to keep iterating on a safety-critical system before scaling. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CO005",
        "CO006",
        "CO007",
        "CO010"
      ],
      "tableRefs": [
        "TO003"
      ]
    },
    {
      "id": "milestones-and-scale",
      "title": "Milestones that show a company beyond pure R&D",
      "body": "Waabi's strongest recent evidence is not a single product launch but a pattern of execution: truck-platform transfer, public-road pilots, a major funding event, and a broadening commercial narrative. The company is already talking about direct-to-customer freight workflows and robotaxi expansion, which is more aggressive than a purely lab-stage startup would usually claim. Headcount remains modest compared with legacy incumbents, but the company's footprint and partner set indicate a scaling phase rather than a moonshot demo phase. This chapter still leaves room for broader public proof on scale, repeatability, and customer breadth in the next refresh. That keeps the chapter grounded in public evidence rather than aspiration alone.",
      "claimRefs": [
        "CO008",
        "CO009",
        "CO010",
        "CO011",
        "CO012"
      ],
      "tableRefs": [
        "TO002"
      ],
