    body: The June 2026 financing demonstrates access to capital, but the public record does not disclose cash available, burn, debt, working-capital needs, or runway. Apex's ahead-of-need manufacturing, facility expansion, workforce growth, and privately financed Project Shadow increase the importance of those missing inputs.
