      nodes:
        - id: customer-demand
          label: Customer demand
          detail: Via Satellite reported that more than two-thirds of the business was in national security and defense; customer-level concentration is undisclosed.
        - id: platform-selection
          label: Standard platform selection
          detail: Apex markets configurable Aries, Nova, and Comet platforms; Via Satellite reports that the company does not change platforms for individual missions.
        - id: ahead-of-need-production
          label: Ahead-of-need production
          detail: New financing is intended in part to fund productized platforms before need, creating inventory and working-capital exposure.
        - id: delivery-and-services
          label: Delivery and mission services
          detail: Delivery volume, acceptance milestones, service attach rates, and contract terms are not disclosed.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Revenue, ARR, realized pricing, backlog conversion, and recognition timing are not disclosed.
        - id: gross-profit-and-cash
          label: Gross profit and cash conversion
          detail: Gross margin, working capital, cash burn, debt, and runway are not disclosed.
      edges:
        - from: customer-demand
          to: platform-selection
        - from: platform-selection
          to: ahead-of-need-production
        - from: ahead-of-need-production
          to: delivery-and-services
        - from: delivery-and-services
          to: recognized-revenue
        - from: recognized-revenue
          to: gross-profit-and-cash
    approximationNotes: The sequence is an analytical bridge, not a quantified forecast; missing values remain explicitly undisclosed and no conversion rate is inferred.
