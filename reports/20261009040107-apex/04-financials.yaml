company:
  name: Apex
chapter:
  number: 4
  title: Financials
  summary: Apex disclosed more than $200 million of new capital at a $2.3 billion valuation in June 2026 and is directing the financing toward manufacturing expansion, vertical integration, and ahead-of-need production. Public evidence supports a high-capital-intensity scale-up thesis, but it does not disclose revenue, realized pricing, backlog, gross margin, cash, burn, runway, or debt, so funding raised cannot be treated as cash available or proof of viable unit economics.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model is product-led, but pricing and recognition remain private
    body: |-
      Apex describes a productized spacecraft model centered on standardized, configurable satellite buses rather than a fully bespoke design process. Its live company materials emphasize short lead times and constellation-scale production, while Via Satellite reported that the company does not change its platforms for individual customer missions and intends to add mission services and payload-accommodation support. Those statements identify plausible monetization mechanisms: platform sales and associated mission services. They do not establish realized prices, contract values, shipment revenue, recurring revenue, or gross profit.

      Public sources also distinguish production strategy from revenue. Building platforms ahead of need may shorten delivery times, but inventory is not recognized revenue, and Factory One's stated peak capacity is not evidence of utilization or sales. Project Shadow is likewise described by Apex as a privately financed demonstration rather than a disclosed customer-funded program. Underwriting therefore requires executed contracts, billing milestones, acceptance terms, cancellation rights, and revenue-recognition policies before assigning value to the model.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI011
      - CI012
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: scale-costs-and-unit-economics
    title: Manufacturing scale is visible; cost absorption is not
    body: |-
      Apex says Factory One can produce more than 200 satellites per year at peak production and that its workforce exceeded 350 employees after more than doubling in the prior year. It also disclosed an additional 30,000 square feet for the campus. Via Satellite separately reported the approximately 200-platform design capacity and quoted management estimates of roughly 30% vertical integration for Aries and more than 70% for Nova, with a long-term ambition to approach full vertical integration as volume grows.

      These operating indicators are inputs, not unit economics. Capacity does not reveal throughput or utilization, headcount does not disclose labor cost per completed spacecraft, and vertical integration can move supplier spending into payroll, tooling, inventory, and yield risk. The retained source set provides no bill of materials, direct labor hours, warranty reserve, capex, lease obligation, contribution margin, or gross margin. Apex's careers page adds evidence of recurring employee-benefit commitments, but no public dollar amount from which to calculate service-delivery cost or cash burn.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI006
      - CI010
      - CI013
    tableRefs:
      - TI002
      - TI003
  - id: capital-adequacy-and-financing-dependency
    title: New financing supports expansion but does not establish runway
    body: |-
      Apex announced more than $200 million in new growth funding at a $2.3 billion valuation on June 5, 2026; Via Satellite independently reported the same headline amount and valuation. The company identified manufacturing-campus expansion, subsystem vertical integration, and ahead-of-need production as intended uses. This is evidence of capital access and planned investment, not evidence of how much cash remained at closing or on the report date. The sources do not provide cash balances, debt facilities, restricted cash, monthly burn, working-capital commitments, or runway.

      Financing dependency is material because Apex is simultaneously adding factory space and staff, carrying ahead-of-need manufacturing exposure, and funding Project Shadow with private capital rather than a disclosed government grant or contract. Via Satellite also reported that more than two-thirds of the business was in national security and defense. That mix may support demand, but without customer-level backlog, milestone-payment terms, or concentration data it also creates procurement-timing and working-capital uncertainty. The next financing trigger cannot be estimated responsibly from the available record.
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI009
      - CI013
      - CI014
      - CI015
  - id: financial-verdict-and-diligence-blockers
    title: "Financial verdict: credible capital access, unproven revenue quality"
    body: |-
      The defensible conclusion is narrower than a revenue forecast. Apex has attracted substantial growth capital, has a productized manufacturing thesis, and has disclosed physical capacity and workforce growth. None of those facts resolves whether orders convert to recognized revenue at attractive margins or whether the capital base is adequate for the planned production ramp. Revenue is not ARR, peak capacity is not shipped volume, and financing proceeds are not current liquidity.

      The assigned pool also illustrates a discovery limitation: three independent-domain results concern an unrelated defense event, an unrelated financial-services company called Apex Group, and a Goldman Sachs family-office event called Apex. They were retained for provenance but provide no Apex Space financial metrics and are excluded from the operating conclusions. No genuinely adverse Apex-specific financial source was available in the assigned pool. Investment underwriting should remain blocked on audited statements, backlog quality, realized pricing, unit costs, working capital, cash burn, runway, debt, and customer concentration.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream or activity
      - Evidenced mechanism
      - Unit
      - Current value or status
      - Revenue quality
      - Diligence ask
    rows:
      - - Productized satellite platforms
        - Sale of standardized, configurable Aries, Nova, and Comet spacecraft platforms
        - Per spacecraft or customer contract
        - Platform families and productized model are public; realized price is undisclosed
        - Revenue, delivery acceptance, and cancellation terms are unknown
        - Provide executed contracts, average selling price by platform, acceptance criteria, and revenue-recognition policy
      - - Mission services and payload accommodation
        - Additional support around customer payloads and missions
        - Per mission, service package, or milestone
        - Via Satellite reported an intention to add more mission services; current revenue contribution is undisclosed
        - Planned expansion is not proof of current revenue
        - Separate contracted service revenue, attach rate, direct labor, and service gross margin
      - - Project Shadow and Orbital Magazine development
        - Demonstration of a privately financed space-based-interceptor host platform
        - Demonstration or future program contract
        - Apex says the demonstration is funded with private capital, not a disclosed government grant or contract
        - Current activity is R&D expenditure unless a customer contract establishes otherwise
        - Provide total program spend, committed external funding, follow-on award criteria, and IP ownership
      - - Ahead-of-need manufacturing
        - Prebuilding productized platforms to reduce delivery lead time
        - Inventory unit
        - Stated use of new financing; inventory value and turnover are undisclosed
        - Inventory and factory capacity are not recognized revenue
        - Provide work-in-process, finished-goods aging, deposits, cancellation rights, and inventory write-down policy
    notes: Public sources establish product and production mechanisms but disclose no realized pricing, revenue mix, contract values, or recognition policy; unknown fields are diligence gaps rather than estimates.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI011
      - CI012
  - id: TI002
    title: Pricing and monetization table
    columns:
      - Offer or channel
      - Price, unit, or contract basis
      - List versus realized pricing
      - Public evidence
      - Underwriting implication
    rows:
      - - Aries, Nova, and Comet platforms
        - Likely customer contract per spacecraft or deployment, but contract basis is not disclosed
        - No public list price or realized average selling price
        - Apex identifies the product families; Via Satellite reports a fixed-platform approach
        - Revenue cannot be modeled from platform count without price and delivery data
      - - National security and defense business
        - Government, allied, or prime-contractor arrangements; specific structure is undisclosed
        - No disclosed contract value, fee schedule, or customer-level mix
        - Via Satellite reported more than two-thirds of business in national security and defense
        - Demand exposure is visible, but concentration and procurement timing remain unknown
      - - Mission services
        - Potential service or milestone fees
        - No public list or realized pricing
        - Via Satellite reports an intention to add mission services and payload support
        - Do not include service revenue in a base case until contracts and attach rates are supplied
      - - Factory One capacity
        - More than 200 satellites per year at stated peak production
        - Capacity is not a price and current utilization is undisclosed
        - Company release and Via Satellite report the approximate design capacity
        - A revenue ceiling cannot be calculated without utilization, mix, and realized price
    notes: This table separates disclosed operating mechanisms from unavailable price and contract data; it does not infer pricing from funding, valuation, or factory capacity.
    claimRefs:
      - CI003
      - CI005
      - CI007
      - CI008
      - CI012
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - New growth funding
        - More than $200M announced in June 2026
        - High for amount raised; low for current cash available
        - Funds the scale-up but does not reveal liquidity or runway
        - Reconcile gross proceeds to net cash, restricted cash, and post-close uses
      - - Latest disclosed valuation
        - $2.3B in the June 2026 financing announcement
        - High for the announced financing valuation
        - Sets the entry-price reference but says nothing about operating returns
        - Provide cap table, security terms, preference stack, and fully diluted ownership
      - - Factory One peak capacity
        - More than 200 satellites per year at peak production
        - High for stated design capacity; unknown for achieved output
        - Fixed-cost absorption depends on actual throughput and utilization
        - Provide monthly completed units, utilization, cycle time, scrap, rework, and on-time delivery
      - - Workforce
        - More than 350 employees; company said headcount more than doubled in the prior year
        - Medium; company disclosed
        - Payroll and benefits are material recurring costs in a manufacturing ramp
        - Provide headcount by function, loaded labor cost, hiring plan, and attrition
      - - Vertical integration
        - Via Satellite reported about 30% for Aries and more than 70% for Nova
        - Medium; management estimates reported by an independent trade publication
        - Integration can improve supply control but adds tooling, labor, inventory, and yield exposure
        - Define the denominator and provide make-versus-buy savings, capex, yields, and supplier commitments
      - - Revenue and ARR
        - Not disclosed in the retained source set
        - High for the disclosure gap; no conclusion on actual performance
        - Prevents growth, mix, and revenue-quality analysis; revenue must not be substituted with ARR
        - Provide audited revenue by product, service, customer, and recognition period; provide ARR only if contractually meaningful
      - - Gross margin and contribution margin
        - Not disclosed in the retained source set
        - High for the disclosure gap; no margin estimate is supportable
        - Determines whether scale and vertical integration create economic value
        - Provide gross margin bridge by platform and contribution margin after mission-specific support
      - - Cash, burn, runway, debt, and working capital
        - Not disclosed in the retained source set
        - High for the disclosure gap; funding raised is not cash available
        - Determines financing dependency and the next-round trigger
        - Provide monthly cash flow, liquidity, debt and lease schedules, inventory aging, deposits, and downside runway
    notes: Values are limited to disclosed financing and operating indicators; null or unavailable economics are not estimated and each has a specific diligence request.
