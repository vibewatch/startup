  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-disclosure-gap
      missingEvidence: Audited revenue by product and service, realized pricing, contracted backlog, delivery and acceptance history, and the revenue-recognition policy.
      whyItMatters: These inputs determine whether capacity and demand convert into durable recognized revenue rather than inventory or unexercised opportunity.
      diligencePath: Obtain audited statements, the contract and backlog schedule, invoice and acceptance samples, and revenue-recognition memoranda from the data room.
      relatedQuestionRefs:
        - QI001
        - QI002
        - QI004
        - QI006
      relatedTableRefs:
        - TI001
        - TI002
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics-gap
      missingEvidence: Bill of materials, direct labor, utilization, yield, scrap, warranty, service cost, gross margin, contribution margin, and capex by platform.
      whyItMatters: Without these inputs, the economic effect of scale and vertical integration cannot be distinguished from higher fixed costs and inventory exposure.
      diligencePath: Review platform-level cost ledgers, factory KPIs, make-versus-buy studies, warranty data, and monthly margin bridges.
      relatedQuestionRefs:
        - QI003
        - QI006
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Cash and restricted cash, monthly burn, inventory and working capital, debt and lease obligations, committed program spend, downside runway, and next-round trigger.
      whyItMatters: Financing raised is not cash available, and the production ramp cannot be underwritten without a liquidity bridge and obligation schedule.
      diligencePath: Obtain the latest balance sheet, monthly cash flow, debt and lease schedules, inventory aging, board-approved budget, and downside liquidity model.
      relatedQuestionRefs:
        - QI005
        - QI007
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: material
      topic: customer-mix
      missingEvidence: Customer-level backlog, prime versus direct contracting mix, milestone payments, cancellation rights, concentration, and procurement timing.
      whyItMatters: More than two-thirds defense exposure may support demand but can also concentrate collections around appropriations, awards, and acceptance milestones.
      diligencePath: Review the customer and backlog schedule, top-ten concentration, funded versus unfunded awards, payment milestones, and renewal or follow-on probabilities.
      relatedQuestionRefs:
        - QI002
        - QI004
        - QI007
      relatedTableRefs:
        - TI001
        - TI002
    - type: missing-source
      severity: material
      topic: adverse-financial-evidence
      missingEvidence: A genuinely adverse, independent Apex-specific source addressing contract execution, production delays, margin pressure, liquidity, defaults, inventory, or customer concentration.
      whyItMatters: The assigned pool contains no skeptical Apex-specific financial witness, limiting external challenge to company-issued scale and financing claims.
      diligencePath: Seek customer and supplier references, procurement records, lien and litigation searches, credit evidence, and independent reporting during controlled diligence.
      relatedQuestionRefs:
        - QI006
        - QI007
