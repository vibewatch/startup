figures:
- id: FU001
  title: Customer journey map and constellation procurement lifecycle
  type: journey-map
  summary: Illustrates the commercial and defense customer progression from payload specification through bus manufacturing, on-orbit deployment, and constellation expansion.
  data:
    items:
    - id: stage-1
      label: Mission Definition & Payload Spec
      detail: Commercial or defense customer defines sensor, RF communications, or interceptor payload parameters within Aries, Nova, or Comet envelope (up to 3,000 kg).
      touchpoints:
      - Requirements review
      - Mechanical and electrical interface definition
      tone: neutral
    - id: stage-2
      label: Configurable Bus Selection
      detail: Customer selects productized off-the-shelf satellite platform built ahead of need, avoiding bespoke clean-sheet engineering lead times.
      touchpoints:
      - Platform catalog configuration
      - Subsystem selection
      tone: positive
    - id: stage-3
      label: Factory One High-Rate Assembly
      detail: Spacecraft bus manufactured at Factory One in Los Angeles within a scalable facility capable of producing over 200 satellites per year.
      touchpoints:
      - Hardware-in-the-loop testing
      - Subsystem integration
      tone: positive
    - id: stage-4
      label: Launch Integration & Deployment
      detail: Customer payload mated with bus and launched via commercial rideshare or dedicated launch vehicle into LEO or GEO orbits.
      touchpoints:
      - Launch vehicle dispenser integration
      - Mission operations commissioning
      tone: neutral
    - id: stage-5
      label: On-Orbit Validation & Mission Operations
      detail: Spacecraft bus undergoes on-orbit commissioning, telemetry verification, and operational payload testing in target orbit (demonstrated by Aries 2-year on-orbit milestone).
      touchpoints:
      - Flight heritage validation
      - Ground station link calibration
      tone: positive
    - id: stage-6
      label: Constellation Scale & Fleet Replenishment
      detail: Transition from initial demonstration spacecraft (e.g. Project Shadow) to multi-satellite constellation replenishment; currently unverified by public retention KPIs.
      touchpoints:
      - Follow-on batch procurement
      - Mission replenishment
      tone: warning
  approximationNotes: Synthesized from Apex product platform architectures, Factory One manufacturing disclosures, and aerospace procurement lifecycles; Apex does not publish proprietary customer journey funnels.
