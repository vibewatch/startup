  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与卫星平台
        blocks:
          - type: paragraph
            body: >-
              Apex 的核心产品是标准化、可配置的商用现成卫星平台，目标是消除传统航天器制造瓶颈 [CE001]。公司不把每颗卫星当作多年定制工程项目，而是围绕 Aries、Nova 和 Comet 三个主要平台系列提前生产
              [CE002, CE003]。这些产品覆盖低地球轨道（LEO）和地球静止轨道（GEO），支持商业遥感、通信、太空发电以及国家防务星座等任务 [CE003]。公司扩展了产品组合的载荷能力范围，近期宣布 Comet
              的 Mini 配置可支持最高 3,000 kg 载荷 [CE004]。Aries 首次建立飞行记录，在低地球轨道连续执行客户任务并达到两年运营里程碑
              [CE005]。不过，各配置的机械载荷空间限制、指向精度、下行带宽和在轨寿命等技术规格仍属机密，非标准载荷因此存在投资判断缺口。
            claimRefs:
