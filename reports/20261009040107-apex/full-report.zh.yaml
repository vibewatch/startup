      - number: '7.4'
        title: 资本强度、垂直整合消耗与估值压力
        blocks:
          - type: paragraph
            body: >-
              Apex 于 2026 年 6 月宣布，在 Glade Brook Capital Partners 和 Washington Harbour Partners 领投下获得超过 $200M 增长资金，投后估值达到
              $2.3B。此前的 $200M C 轮融资最初将公司估值推高至超过 $1B。虽然资金流入增强了现金储备，但公司提前生产产品化卫星平台、用公司资金推进 Project Shadow
              等内部技术项目，且没有专门的政府采购合同，会造成大量现金消耗。员工人数扩大到 350 人以上、Factory One 扩建 30,000
              平方英尺，以及在客户承诺前采购航天库存，都需要持续营运资金。如果客户星座部署落后或宏观环境收紧，Apex 可能在实现经营盈利前遭遇大幅下轮融资风险或流动性收缩。
            claimRefs:
              - CR013
