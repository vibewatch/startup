      - number: '8.2'
        title: 估值背景、资本结构与可比基准
        blocks:
          - type: paragraph
            body: >-
              Apex 的融资历史显示，连续机构轮次推动估值快速上调。公司于 2024 年 6 月完成 $95M B 轮；2025 年 4 月由 8VC 和 Point72 Ventures 领投 $200M C 轮；2025
              年 9 月由 Interlagos Capital 领投 $200M D 轮，投后估值 $1.0B；2026 年 6 月由 Glade Brook Capital Partners 和 Washington
              Harbour Partners 领投超过 $200M，投后估值 $2.3B。Forge Global 私人二级市场追踪记录显示，2026 年 6 月 E 轮估值为 $2.29B，每股 $20.06，对应
              8,866,244 股；条款含 1.0x 非参与型清算优先权，与较早的 D 轮（每股 $11.45）及 C 轮优先股同顺位（优先级 1）。

              公开市场可比分析显示，航空航天倍数和商业模式耐久性差异显著。纯太空基础设施同业估值分散很大：Rocket Lab
              受发射节奏和航天器系统订单支持，交易倍数较高；传统平台和子系统供应商则因低利润转化和合同交付延误，通常以个位数倍数交易。2024 年 Lockheed Martin 以约 $450M 企业价值收购 Terran
              Orbital，是一项关键先例，说明当制造爬坡遭遇负毛利率或债务压力时，卫星平台制造商可能遭遇严重的下行重估。

              对 Apex 而言，私人市场按历史估计年化收入 55.6x 定价，反映市场对防务星座获胜和收入快速加速的高预期。但由于公开文件没有披露 Apex 的确定合同订单、收入确认日程或现金消耗，对 $2.3B
              估值进行投资判断，需要对公司在未来美国太空军及商业超大星座授标中取得市场份额作出激进假设。
