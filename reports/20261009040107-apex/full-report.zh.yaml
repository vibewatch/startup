      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 防务项目依赖与提前生产库存敞口
            body: >-
              Apex 的商业模式依赖提前生产标准化卫星平台，以大幅压缩交付周期。但由于超过三分之二的需求与国家安全和防务项目相关，美国防务拨款变化或主要主承包商合同重新竞标，都可能让 Factory One
              的高资本强度库存被困住。
