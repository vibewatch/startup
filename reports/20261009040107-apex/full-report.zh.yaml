  - id: FI001
    title: 收入模型桥接与缺失的转化证据
    type: flow
    summary: Apex 的公开模型将客户需求连接到标准化生产，但证据链在实现收入、毛利和现金转化之前中断。
    data:
      nodes:
        - id: customer-demand
          label: 客户需求
          detail: Via Satellite 报道称，超过三分之二的业务来自国土安全和防务；客户层面的集中度未披露。
        - id: platform-selection
          label: 标准平台选择
          detail: Apex 推销可配置的 Aries、Nova 和 Comet 平台；Via Satellite 报道称，公司不会为单个任务更换平台。
        - id: ahead-of-need-production
          label: 提前生产
          detail: 新融资部分用于在需求出现前为产品化平台提供资金，由此产生库存和营运资金暴露。
        - id: delivery-and-services
          label: 交付与任务服务
          detail: 交付量、验收里程碑、服务附加率和合同条款均未披露。
        - id: recognized-revenue
          label: 已确认收入
          detail: 收入、ARR、实际定价、积压订单转化和确认时点均未披露。
        - id: gross-profit-and-cash
          label: 毛利与现金转化
          detail: 毛利率、营运资金、现金消耗、债务和现金跑道均未披露。
      edges:
        - from: customer-demand
          to: platform-selection
        - from: platform-selection
          to: ahead-of-need-production
        - from: ahead-of-need-production
          to: delivery-and-services
        - from: delivery-and-services
          to: recognized-revenue
        - from: recognized-revenue
          to: gross-profit-and-cash
    approximationNotes: 该序列是分析桥接而非量化预测；缺失值仍明确未披露，不推断任何转化率。
    claimRefs:
      - CI005
      - CI007
      - CI008
      - CI012
      - CI013
      - CI015
  - id: FE001
    title: Apex 航天器平台与技术架构栈
    type: stack
    summary: 覆盖实体制造、任务执行及防务交联的六层结构与运营架构。
    data:
      layers:
        - label: 任务应用层
          detail: 在商业遥感星座及 Project Shadow 太空防务演示中执行运营载荷。
          modules:
            - Project Shadow 轨道拦截器
            - 商业遥感
            - 太空发电
        - label: 通信与交联层
          detail: 用于遥测、火力控制和星间协调的射频通信基础设施。
          modules:
            - Link-182 波形架构
            - 软件定义无线电套件
            - 太空交联收发器
        - label: 飞行软件与航空电子层
          detail: 机载制导、导航、姿态控制及自主飞行运营软件。
          modules:
            - 内部模块化飞行软件
            - 硬件在环仿真
            - 航天器测试台仿真器
        - label: 核心航天器子系统层
          detail: 维持航天器及载荷在轨运行的集成物理与电气支持模块。
          modules:
            - 发电与配电
            - 主动热调节
            - 专有子系统组件
        - label: 可配置航天器结构层
          detail: 跨不同轨道质量和能力层级扩展的产品化机械平台。
          modules:
            - Aries（LEO 星座）
            - Nova（军民两用 LEO 与 GEO）
            - Comet（最高 3,000 kg 的 Mini）
        - label: 工业制造基础层
          detail: 支持批量航天器产出的高产能地面装配基础设施。
          modules:
            - Factory One 装配设施
            - 30,000 平方英尺园区扩建
            - 年峰值产能 200+ 颗卫星
    approximationNotes: 各层级综合了已披露的实体制造、平台产品、软件航空电子设备及轨道任务应用。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE007
      - CE010
      - CE012
      - CE013
      - CE015
      - CE016
  - id: FU001
    title: 客户旅程图与星座采购生命周期
    type: journey-map
    summary: 展示商业及防务客户从载荷规格确定，到航天器制造、在轨部署及星座扩张的流程。
    data:
      items:
        - id: stage-1
          label: 任务定义与载荷规格
          detail: 商业或防务客户在 Aries、Nova 或 Comet 的范围内定义传感器、射频通信或拦截器载荷参数（最高 3,000 kg）。
          touchpoints:
            - 需求审查
            - 机械及电气接口定义
          tone: neutral
        - id: stage-2
          label: 可配置航天器选择
          detail: 客户选择提前生产的产品化现货卫星平台，避开定制化从零工程的交付周期。
          touchpoints:
            - 平台目录配置
            - 子系统选择
          tone: positive
        - id: stage-3
          label: Factory One 高产能装配
          detail: 航天器在洛杉矶 Factory One 制造，该可扩展设施年产能超过 200 颗卫星。
          touchpoints:
            - 硬件在环测试
            - 子系统集成
          tone: positive
        - id: stage-4
          label: 发射集成与部署
          detail: 客户载荷与航天器对接后，通过商业拼车或专用运载火箭发射至 LEO 或 GEO 轨道。
          touchpoints:
            - 运载火箭分配器集成
            - 任务运营调试
          tone: neutral
        - id: stage-5
          label: 在轨验证与任务运营
          detail: 航天器在目标轨道完成在轨调试、遥测验证及运营载荷测试（Aries 已展示 2 年在轨里程碑）。
          touchpoints:
            - 飞行记录验证
            - 地面站链路校准
          tone: positive
        - id: stage-6
          label: 星座规模化与舰队补充
          detail: 从初始演示航天器（如 Project Shadow）转向多卫星星座补充；目前尚未通过公开留存 KPI 验证。
          touchpoints:
            - 后续批次采购
            - 任务补充
          tone: warning
    approximationNotes: 综合 Apex 产品平台架构、Factory One 制造披露及航空航天采购生命周期；Apex 未公开专有客户旅程漏斗。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU010
      - CU015
