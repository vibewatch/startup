chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与管理层
        blocks:
          - type: paragraph
            body: >-
              Apex 由首席执行官 Ian Cinnamon 和首席技术官 Max Benassi 于 2022 年创立，官方运营主体为 Apex
              Space，总部位于加利福尼亚州洛杉矶。公司要解决的是商业及盟友防务卫星星座长期面临的核心瓶颈：航天器平台制造历来高度定制、速度慢且产能受限。Apex
              将高节拍陆地制造技术和产品化模块架构引入航天器组装，力求大幅压缩交付周期，提供标准化、可配置的卫星平台。2026 年中，公司任命 Axon 前财务副总裁 Michael Kopet
              为首席财务官，负责制造财务、利润率提升和供应链扩张，以支持产量加速。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
      - number: '1.2'
        title: 资本结构、估值与运营规模
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月，Apex 完成一轮超过 $200M 的增长融资，企业估值接近翻倍至 $2.3B；此前公司在年初已突破 $1.0B 估值门槛。本轮融资由 Glade Brook Capital
              Partners 领投，国家安全科技投资机构 Washington Harbour Partners 联合领投，既有风险投资人跟投。资金将用于提前备货、子系统垂直整合，以及把洛杉矶 Factory One
              园区扩建 30,000 平方英尺。该工厂峰值设计产能超过每年 200 个卫星平台；员工人数在过去一年翻倍，超过 350
              名全职员工。年化收入、已确认订单和客户单机价格等关键规模指标仍未披露，二级交易平台也无法独立核实。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO012
              - CO013
              - CO014
      - number: '1.3'
        title: 运营里程碑与防务任务路线图
        blocks:
          - type: paragraph
            body: >-
              Apex 的技术演进覆盖 Aries、Nova 和 Comet 三个标准化平台系列，任务载荷从小型星座到 Comet Mini 配置的 3,000 kg 不等。公司在 2024 年初发射首个 Aries
              航天器进入低地球轨道，建立了在轨飞行记录；该航天器已连续运行超过两年。2025 年末，Apex 宣布 Project Shadow：在配置为 Orbital Magazine 的 Nova
              平台上，进行由私人资金支持的在轨太空拦截器技术演示。2026 年 6 月，Apex 与 Northrop Grumman 合作，为美国太空军 Golden Dome for America
              计划推进导弹防御能力，进一步加深其国家安全角色。同时，商业尽调必须把航天器制造商 Apex 与 Apex Treasury Corp、Apex Leadership 等无关公司文件及注册同名实体区分开。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO013
              - CO014
