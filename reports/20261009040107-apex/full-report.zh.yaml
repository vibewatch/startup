        - Project Shadow 在轨演示，以及政府加速采购商用现货航天器
        - 美国防务支出从分布式 LEO 架构转向定制化涉密平台
      - - 关键反论点
        - 未经核实的收入规模对应极端估值倍数
        - Multiples.vc 报告 Series D 时收入为 $18M（估值 $1B）；2026 年估值 $2.3B 在没有审计指标的情况下将价格翻倍
        - 独立审计证明年度 GAAP 收入超过 $100M，且航天器层面的毛利率为正
      - - 关键反论点
        - 高资本密集度及垂直整合执行风险
        - 14 个月内完成第三轮 $200M 融资、自筹 Project Shadow 研发资金，以及整合 Phase Four 推进系统收购
        - 证明所有航天器产品线都具备自我维持的运营现金流和正单位毛利率
    notes: 基于公开融资披露，对比结构性增长催化剂与资产负债表及执行风险。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率
      - 关键运营假设
      - 2028 年财务轨迹
      - 隐含估值区间
      - 下行触发因素 / 风险
    rows:
      - - 乐观情景
        - 25%
        - Factory One 全面爬坡至每年 >150 架航天器；获得 Golden Dome 防务主承包商订单；商业星座转化率高
        - 收入 >$250M，毛利率 >40%，运营利润率约 25%
        - $4.5B - $6.0B (18x-24x EV/Rev)
        - 运载火箭供应瓶颈；国际出口管制摩擦
      - - 基准情景
        - 50%
        - 航天器产量稳定在每年 50–80 架；Project Shadow 演示成功；商业遥感与 DoD 探路项目并行
        - 收入 $100M–$150M，毛利率 25–30%，接近盈亏平衡
        - $2.0B - $2.8B (14x-18x EV/Rev)
        - 零部件供应延误及防务合同价格上限挤压利润率
      - - 悲观情景
        - 25%
        - Factory One 生产延误；Project Shadow 任务异常；防务支出重新分配；商业星座失效
        - 收入 <$50M，持续现金消耗 >$100M/年，需要进行稀释性融资
        - $600M - $1.0B（困境并购 / 下轮融资）
        - 流动性耗尽，导致按低于 Series D 清算优先权的价格重组资本
    notes: 情景预测基于 Factory One 产能里程碑、小型卫星行业可比倍数及资本消耗率建模。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
