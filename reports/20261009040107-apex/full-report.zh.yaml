            title: 估值纪律要求暂缓直接股权投资判断
            body: >-
              虽然相较早期航天硬件同行，Apex 已展现出更快的运营推进速度，但其 2026 年 6 月 $2.3 billion
              的估值，已经把星座制造完美落地的预期计入价格，而单位毛利和已实现收入仍没有公开验证。投资者应持续跟踪尽调进展，同时要求私下披露已签约订单储备的转化率和客户流失指标。
            calloutType: recommendation
            claimRefs:
