              Apex 于 2026 年 6 月 5 日宣布以 $2.3B 估值获得超过 $200M 的新增增长资金；Via Satellite
              独立报道了同样的金额和估值。公司把制造园区扩建、子系统垂直整合和提前生产列为资金用途。这证明了融资能力和计划投资，却不能证明交割时或报告日还剩多少现金。来源没有提供现金余额、债务工具、受限现金、月度消耗、营运资金承诺或现金跑道。

