  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反方逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Apex 在商业航天与防务生态中呈现出有吸引力但要求很高的投资画像。核心逻辑是航天器制造存在结构性瓶颈：可重复使用发射能力迅速增长，但平台生产历来定制化、缓慢且昂贵。Apex
              提前批量生产可配置的产品化平台（Aries、Nova 和 Comet），针对的是扩展型低地球轨道（LEO）星座不断增长的需求。客户与合作伙伴验证包括：与 Northrop Grumman 合作开发 Golden
              Dome 太空拦截器能力；Factory One 扩建至峰值每年超过 200 颗卫星；以及 Glade Brook Capital Partners 和 Washington Harbour Partners
              等顶级增长投资者的支持。

              反方逻辑在于，估值在经审计收入和现金流指标出现前已经极度扩张。2026 年 6 月，Apex 以 $2.3B 投后估值融资超过 $200M；这是公司 14 个月内第三次筹集 $200M
              资本，并使公开追踪平台记录的累计融资达到 $603M 至 $926M。商业收入披露仍不透明且彼此冲突。Multiples tracker 记录称，2025 年 9 月 D 轮时估计年化收入仅为 $18M，对应
              55.6x 收入倍数；Silicon Valley Investment Club 则引用差异极大的估计，从 Contrary Research 的 2025 年 $60M 到 PrivCo 的 2024 年
              $380M 不等。此外，自筹资金的 Project Shadow 演示和雄心勃勃的工厂垂直整合都可能带来大量运营现金消耗。

              在强劲运营扩张和防务合作与高估值倍数、未经验证的单位经济性之间权衡后，合理结论是继续研究，信心中等。公开估值判断为偏高，风险评级为高。投资者应持续跟踪，但在可审计毛利率、明确订单转化和清算优先权悬置得到独立核实前，不应投入成长股权资本。
