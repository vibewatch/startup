            title: 收入倍数的极端分化让后期资本暴露于下行风险
            body: >-
              第三方私募市场数据估算，按预计 $18 million 的收入运行率，Apex Series D 轮隐含的收入倍数为 55.6x；而外部追踪机构对 2024-2025 年收入的估算在 $60 million 至
              $380 million 之间剧烈摆动。如此严重的信息不对称，会在执行失误时提高倍数压缩的概率。
