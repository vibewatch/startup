      - number: '7.3'
        title: 客户集中、防务主承包商合作与发射依赖
        blocks:
          - type: paragraph
            body: >-
              Apex 存在严重的客户和渠道集中度。CEO Ian Cinnamon 披露，公司超过三分之二的业务来自国家安全和防务项目。Apex
              虽称几乎每一家主要防务主承包商都是客户，但收入轨迹高度依赖波动的美国政府预算周期和防务主承包商组队安排，例如与 Northrop Grumman 合作开发 Golden Dome 拦截器能力。此外，Apex
              完全依赖外部商业发射服务商，把 Aries、Nova 和 Comet 平台送入低地球轨道及地球静止轨道。发射计划滑延、助推器测试失败或运载火箭短缺，会在 Apex
              直接运营控制之外造成次级进度风险。类似的企业规划模型（如 o9 的 APEX 框架）和网络防御范式（如 Cribl 的 APEX 模型）说明，如果不持续治理，多层供应链依赖和外部冲击可能沿执行周期扩散。
