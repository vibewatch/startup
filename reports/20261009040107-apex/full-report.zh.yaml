              Apex 表示 Factory One 峰值每年可生产超过 200 颗卫星，员工人数在前一年翻倍以上后超过 350 人；公司还披露园区新增 30,000 平方英尺。Via Satellite 另报导约 200
              个平台的设计产能，并引用管理层估计：Aries 垂直整合约 30%，Nova 超过 70%；长期目标是随产量增长接近完全垂直整合。

              这些运营指标只是投入，不是单位经济性。产能无法说明吞吐量或利用率，员工人数无法说明每个完工航天器的人工成本，垂直整合还可能把供应商支出转为工资、工装、库存和良率风险。现有来源没有物料清单、直接工时、保修准备金、资本开支、租赁义务、贡献毛利或毛利率。Apex
