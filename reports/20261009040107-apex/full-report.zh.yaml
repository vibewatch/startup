  - id: FM001
    title: 按航天器能力层级划分的市场规模视角
    type: pyramid
    summary: 从整体太空架构支出，到商用卫星航天器制造和 Apex 产能的分层市场规模。
    data:
      items:
        - label: 整体太空经济与架构支出
          value: Global Macro Layer
          detail: 包括发射、地面基础设施、政府防务拨款及商业服务在内的全球太空市场支出。
        - label: 分布式星座硬件采购
          value: Constellation Infrastructure
          detail: 需要数百个在轨节点的防务及商业卫星星座的硬件总支出。
        - label: 航天器制造支出
          value: Merchant & In-House Bus TAM
          detail: 包括 LEO、MEO 和 GEO 中卫星结构、电源系统、ADCS、航空电子设备及集成的支出。
        - label: 商用标准化航天器平台 SAM
          value: Serviceable Available Market
          detail: 面向商业外包、现货产品化航天器平台的受限市场，平台可交付最高 3,000 kg 的载荷。
        - label: Factory One 工业生产能力
          value: 200+ Units/Year Output
          detail: Apex 洛杉矶园区的最大年吞吐能力，目标是快速交付客户星座。
        - label: 已核实的商业合同积压
          value: Diligence Unresolved Target
          detail: 当前商业合同规模及交付里程碑转化情况；这是关键的尽调核验层。
    approximationNotes: 各层体现从全球太空支出到商用航天器产能的结构性市场分层；外包商用航天器 TAM 的金额仍属非公开且未经核实。
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM006
      - CM008
      - CM014
