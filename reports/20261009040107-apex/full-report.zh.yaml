      - number: '5.2'
        title: 防务架构与 Project Shadow Orbital Magazine
        blocks:
          - type: paragraph
            body: >-
              除基础商业卫星平台外，Apex 正借助 Project Shadow 进入扩展型国家安全防务架构。该项目由私人资本支持，计划于 2026 年 6 月搭载 Nova 1 平台发射进入轨道 [CE006,
              CE007, CE008]。Project Shadow 是 Orbital Magazine 的运营测试平台；这是一种专用航天器平台，设计用于搭载、提供环境支持并快速部署太空拦截器（SBI）[CE006,
              CE009]。任务期间，Orbital Magazine 将为两枚搭载的拦截器原型提供热控、电力和环境维持支持，发出同步火控指令，部署两枚拦截器，并借助 Software Defined Radio 使用
              Link-182 消息维持主动交叉链路，在部署后更新飞行中的目标信息 [CE007, CE009, CE010]。每枚拦截器原型均配备高推力固体火箭发动机和动能杀伤机构，意图靠直接物理碰撞摧毁来袭导弹威胁
              [CE007, CE009]。Apex 将这一能力与可规模化太空防御计划相连，包括与 Northrop Grumman 的公开合作，为美国太空军和 Golden Dome for America
              框架提供太空拦截器能力 [CE011]。商业联合发行渠道虽把它宣传为商业突破，但长期 DoD 资金承诺、正式项目转化和完整武器化监管批准仍未得到验证。
            claimRefs:
              - CE006
              - CE007
