      - number: '8.3'
        title: 情景分析、回报门槛与尽调请求
        blocks:
          - type: paragraph
            body: >-
              为刻画当前 $2.3 billion 估值下经风险调整的回报画像，我们评估截至 2028 年的乐观、基准和悲观经营情景。在乐观情景中（概率 25%），Apex 顺利完成批量星座交付，将 Factory One
              的产能爬坡至每年约 200 颗卫星，拿下 Golden Dome 和 SDA Tranche 项目的一级供应商生产分包，并将年收入做大到 $250 million 以上、经营利润率达到
              25%。通过公开上市或战略国防收购，该情景对应的终值估值为 $4.5 billion 至 $6.0 billion。


              在基准情景中（概率 50%），Apex 持续向商业客户和国防客户稳定交付卫星平台，到 2028 年实现 $100 million 至 $150 million
              的年收入。但零部件集成复杂度和竞争性竞标会压缩毛利率，最终退出估值落在 $2.0 billion 至 $2.8 billion；按 2026 年 6 月投后价格入场的后期投资者只能获得温和回报。在悲观情景中（概率
              25%），发射计划延期、客户取消任务以及高额固定工厂间接成本耗尽现金储备，公司只能以 $600 million 至 $1.0 billion 的估值进行低价轮重组，或陷入困境整合，类似历史上的小卫星平台制造商。


              新增资本投入前，潜在投资者必须补齐关键尽调缺口：（1）取得经审计的 GAAP 财务报表，拆解已实现收入、按卫星平台型号计的毛利率和月度经营现金消耗；（2）审计已签约订单储备的排期以及客户取消权；（3）检查从
              Series Seed 到 Series E 各轮的股权结构表、清算优先权和瀑布分配门槛；（4）核实 Phase Four 推进系统集成时间表及专有子系统性能指标。
