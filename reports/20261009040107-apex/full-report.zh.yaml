      - number: '5.3'
        title: 制造系统、工程栈与尽调验证
        blocks:
          - type: paragraph
            body: >-
              Apex 采用高节拍陆地制造模式，把最终组装、载具集成和子系统测试集中在洛杉矶 Factory One [CE001, CE012]。Factory One 的工程铭牌产能在峰值吞吐时超过每年 200
              个卫星平台；园区正在扩建 30,000 平方英尺，用于硬件集成设施、测试单元和超过 350 人的工程团队 [CE012,
              CE013]。工程执行依赖内部硬件在环（HITL）仿真、专用制导导航与控制（GNC）测试台、载具模拟器及由内部工程负责人维护的定制飞行软件 [CE014]。为抵御部件供应瓶颈，Apex
              把增长资本投入专有子系统的垂直整合，减少关键飞行模块对外部供应商的采购 [CE015]。但外部商业航天的第三方技术文档显示，Oracle APEX、Apex Project Eye
              等企业软件平台存在严重的同名风险，也凸显 Apex Space 完全没有公开的开源开发者仓库、API 或遥测模式 [CE016]。技术投资判断需要访问私人工厂测试良率数据、单点故障权衡研究和供应链 BOM 审计。
