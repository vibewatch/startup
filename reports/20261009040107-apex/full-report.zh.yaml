  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、出口管制与防务合规敞口
        blocks:
          - type: paragraph
            body: >-
              Apex 在低地球轨道（LEO）和地球静止轨道（GEO）运营，卫星平台搭载商业及国家安全载荷。公司拓展防务项目，特别是 Project Shadow 太空拦截器演示及与 Northrop Grumman
              为美国太空军开展的合作，使运营直接处于严格的联邦监管之下。尽管 Apex Group 等无关全球基金管理实体也处于复杂的国际监管环境中，Apex Space
              必须严格遵守美国《国际武器贸易条例》（ITAR）、《出口管理条例》（EAR）、国防贸易管制局（DDTC）注册及联邦通信委员会（FCC）频谱许可要求。若无法取得或维持出口授权或防务安全许可，卫星平台交付和已规划的在轨飞行演示都将直接停摆。
