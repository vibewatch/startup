chapter:
  number: 1
  title: "Company Overview"
  summary: "Apex is a Los Angeles-based commercial spacecraft manufacturer founded in 2022 that mass-produces configurable satellite bus platforms. In June 2026, the company raised over $200 million in growth funding at a $2.3 billion valuation to expand its Factory One production campus and support high-rate bus deliveries for commercial and national security constellations."
sections:
  - id: "corporate-identity-and-leadership"
    title: "Corporate Identity and Executive Leadership"
    body: "Founded in 2022 by Chief Executive Officer Ian Cinnamon and Chief Technology Officer Max Benassi, Apex (officially operating as Apex Space) is a commercial aerospace manufacturer headquartered in Los Angeles, California. The company was founded to solve a central bottleneck facing commercial and allied defense satellite constellations: the historically bespoke, slow, and capacity-constrained nature of spacecraft bus manufacturing. By adapting high-rate terrestrial manufacturing techniques and productized modular architectures to spacecraft assembly, Apex aims to deliver standardized, configurable satellite bus platforms with drastically compressed lead times. In mid-2026, the company strengthened its executive bench by appointing Michael Kopet, former Vice President of Finance at Axon, as Chief Financial Officer to oversee manufacturing finance, margin expansion, and supply chain scaling as production throughput accelerates."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO002"
  - id: "capital-structure-and-scale-metrics"
    title: "Capital Structure, Valuation, and Operating Scale"
    body: "In June 2026, Apex closed an over $200 million growth financing round that nearly doubled its corporate valuation to $2.3 billion, following its crossing of the $1.0 billion valuation threshold earlier in the year. The financing was led by Glade Brook Capital Partners and co-led by national security technology investor Washington Harbour Partners, alongside existing venture backers. Capital proceeds are targeted toward ahead-of-need procurement, vertical integration of subsystems, and expansion of the Factory One campus in Los Angeles by 30,000 square feet. The manufacturing facility is designed to produce over 200 satellite platforms annually at peak capacity, supported by a workforce that has doubled over the trailing year to more than 350 full-time employees. Crucial financial scale metrics, including annual run-rate revenue, recognized backlog, and customer unit pricing, remain undisclosed private metrics that secondary transaction platforms cannot independently verify."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO012"
    tableRefs:
      - "TO001"
      - "TO003"
  - id: "operational-milestones-and-mission-roadmap"
    title: "Operational Milestones and Defense Mission Roadmap"
    body: "Apex's technological progression spans three standardized platform families—Aries, Nova, and Comet—accommodating mission payloads ranging from small constellations up to 3,000 kg on the Comet Mini configuration. The company established operational flight heritage in early 2024 with the launch of its initial Aries spacecraft into low Earth orbit, which has logged more than two years of continuous on-orbit mission performance. Building upon this foundation, Apex announced Project Shadow in late 2025 as a privately funded demonstration of on-orbit space-based interceptor technologies hosted aboard a Nova bus configured as an Orbital Magazine. In June 2026, Apex deepened its national security role by collaborating with Northrop Grumman on missile defense capabilities for the U.S. Space Force's Golden Dome for America initiative. In parallel, commercial diligence requires distinguishing spacecraft manufacturer Apex from unrelated corporate filings and registry homonyms such as Apex Treasury Corp and Apex Leadership."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"
