      - number: '7.2'
        title: Operational Throughput, Factory Scaling, and Subsystem Integration
        blocks:
          - type: paragraph
            body: >-
              Apex is ramping production at Factory One, its Los Angeles spacecraft production complex, designed for a
              peak throughput of over 200 satellites per year. Scaling high-rate spacecraft manufacturing introduces
              severe operational failure modes, including cleanroom assembly bottlenecks, environmental testing delays,
              and flight component defects. Apex has reported that its Aries production line is approximately 30%
              vertically integrated while the larger Nova bus line exceeds 70% vertical integration. This aggressive
              drive toward full vertical integration introduces execution risks where in-house manufacturing defects or
              delays in developing proprietary subsystems could stall assembly lines. In space systems engineering,
              systemic dependency mapping frameworks emphasize that unmanaged component and cross-project dependencies
              represent major operational failure risks. Furthermore, space hardware operations require complete
              reliability, as on-orbit deployment anomalies cannot be repaired once launched.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
