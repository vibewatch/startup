  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Constellation Markets
        blocks:
          - type: paragraph
            body: >-
              Apex segments its market between national security architectures and commercial constellation operators
              seeking standardized, productized satellite bus platforms to bypass custom spacecraft lead times. In the
              government and defense segment, Apex targets proliferated low Earth orbit (pLEO) and national defense
              initiatives, confirmed by its collaboration with Northrop Grumman to develop scalable space-based
              interceptor capabilities for the U.S. Space Force under the broader Golden Dome for America initiative. In
              the commercial segment, Apex targets operators across communications, remote sensing, and in-space power
              generation using its Aries, Nova, and Comet platforms carrying payloads up to 3,000 kg. However,
              commercial customer adoption details remain largely confidential, with broad constellation market
              narratives contrasting with limited named commercial deployment disclosures. Furthermore, secondary
              enterprise search results frequently conflate Apex Space with unrelated entities—such as Oracle APEX
              low-code development consulting ecosystems, Apex Service Partners HVAC consolidations, and Apex Tool Group
              industrial manufacturing—underscoring the importance of filtering out extraneous commercial references to
              evaluate the true aerospace bus customer base.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
