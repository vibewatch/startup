      - number: '7.3'
        title: Customer Concentration, Defense Prime Alignment, and Launch Dependencies
        blocks:
          - type: paragraph
            body: >-
              Apex exhibits severe customer and channel concentration, with CEO Ian Cinnamon disclosing that more than
              two-thirds of the company's business originates from national security and defense programs. While Apex
              claims nearly every major defense prime is a customer, its revenue trajectory depends heavily on volatile
              U.S. government budget cycles and defense prime teaming arrangements, such as its partnership with
              Northrop Grumman on Golden Dome interceptor capabilities. In addition, Apex relies entirely on external
              commercial launch providers to place its Aries, Nova, and Comet platforms into low Earth orbit and
              geostationary orbit. Launch manifest slippage, booster test failures, or launch vehicle shortages create
              secondary schedule risks outside Apex's direct operational control. Analogous enterprise planning models
              (such as o9's APEX framework) and cyber defense paradigms (such as Cribl's APEX model) highlight how
              multi-tier supply chain dependencies and external shocks can propagate across execution cycles if not
              continuously governed.
