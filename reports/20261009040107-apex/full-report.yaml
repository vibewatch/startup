      - number: '8.3'
        title: Scenario Analysis, Return Hurdles, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              To frame the risk-adjusted return profile at the current $2.3 billion valuation, we evaluate bull, base,
              and bear operating scenarios through 2028. In the bull case (25% probability), Apex successfully executes
              serial constellation deliveries, ramps Factory One toward 200 satellites per year, secures prime-tier
              production subcontracts for Golden Dome and SDA Tranche programs, and scales annual revenue beyond $250
              million with 25% operating margins. This scenario supports a terminal valuation of $4.5 billion to $6.0
              billion via public listing or strategic defense acquisition.


              In the base case (50% probability), Apex maintains steady bus deliveries across commercial and defense
              customers, generating $100 million to $150 million in annual revenue by 2028. However, component
              integration complexities and competitive bidding compress gross margins, resulting in an exit valuation
              between $2.0 billion and $2.8 billion, yielding modest returns for late-stage investors entering at the
              June 2026 post-money price. In the bear case (25% probability), launch schedule slips, customer mission
              cancellations, and high fixed factory overhead deplete cash reserves, necessitating down-round
              recapitalization or a distressed consolidation at $600 million to $1.0 billion, similar to historic
              smallsat bus manufacturers.


              Before committing new capital, prospective investors must resolve critical diligence gaps: (1) obtain
              audited GAAP financial statements detailing realized revenue, gross margin per bus model, and monthly
              operational burn; (2) audit the contracted backlog schedule and customer cancellation rights; (3) inspect
              cap table liquidation preferences and waterfall thresholds across Series Seed through Series E; and (4)
              verify Phase Four propulsion integration timelines and proprietary subsystem performance metrics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
