        title: Adoption Trajectory, Retention Metrics, and Procurement Concentration
        blocks:
          - type: paragraph
            body: >-
              Apex’s manufacturing and deployment trajectory is anchored by its Factory One facility in Los Angeles,
              which is engineered for peak production exceeding 200 satellites annually, supported by an expanding
              campus and a workforce growing past 350 employees. Flight heritage is anchored by its initial Aries
              satellite, which reached its two-year operational milestone in low Earth orbit, with additional customer
              and demonstration buses slated for flight in late 2026. Despite expanding manufacturing capacity, Apex
              discloses zero quantitative customer retention KPIs: Net Revenue Retention (NRR), Gross Revenue Retention
              (GRR), annual churn rates, repeat customer counts, and exact order backlog figures remain entirely
              undisclosed. This total absence of retention metrics creates material diligence risks regarding customer
              concentration, program dependence, and commercial procurement velocity, leaving investors dependent on
              private customer audits to verify true backlog conversion and customer lifetime value.
