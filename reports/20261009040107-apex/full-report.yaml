      - number: '8.2'
        title: Valuation Context, Capital Structure, and Comparable Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Apex's financing history demonstrates rapid valuation markup across consecutive institutional rounds. The
              company raised a $95 million Series B in June 2024, followed by a $200 million Series C in April 2025 led
              by 8VC and Point72 Ventures, a $200 million Series D in September 2025 led by Interlagos Capital at a $1.0
              billion post-money valuation, and over $200 million in June 2026 led by Glade Brook Capital Partners and
              Washington Harbour Partners at a $2.3 billion post-money valuation. Forge Global private secondary market
              tracking records a June 2026 Series E valuation of $2.29 billion at $20.06 per share across 8,866,244
              shares, featuring 1.0x non-participating liquidation preference, ranking pari passu (seniority order 1)
              alongside earlier Series D ($11.45 per share) and Series C preferred stock.


              Public market comparable analysis highlights significant divergence in aerospace multiples and business
              model durability. Pure-play space infrastructure peers demonstrate wide valuation dispersion: Rocket Lab
              trades at elevated multiples supported by launch cadence and spacecraft systems backlog, while legacy bus
              and subsystem providers trade at conservative single-digit multiples reflecting low margin conversion and
              contract delivery delays. The acquisition of Terran Orbital by Lockheed Martin at an enterprise value of
              approximately $450 million in 2024 stands as a critical precedent showing that satellite bus manufacturers
              face severe downside re-ratings when manufacturing ramps suffer from negative gross margins or debt
              strain.


              For Apex, private market pricing at 55.6x historical estimated run-rate revenue reflects high expectations
              of defense constellation wins and rapid revenue acceleration. However, because public filings do not
              disclose Apex's firm contract backlog, revenue recognition schedule, or cash burn, underwriting a $2.3
              billion valuation requires aggressive assumptions regarding market share capture in upcoming U.S. Space
              Force and commercial mega-constellation awards.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
