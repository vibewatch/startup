      - number: '6.2'
        title: Named Counterparties, Defense Collaborations, and Demonstration Missions
        blocks:
          - type: paragraph
            body: >-
              Concrete public proof of customer adoption is centered on defense prime collaborations and internally
              funded technology demonstration platforms. Apex has formally announced a collaboration with defense prime
              contractor Northrop Grumman to advance scalable space-based interceptor capabilities for the U.S. Space
              Force, representing its most prominent defense alignment. In parallel, Apex is advancing Project Shadow,
              an internally funded on-orbit mission scheduled to launch aboard a Nova 1 bus in summer 2026 to
              demonstrate an Orbital Magazine hosting space-based interceptors. While Project Shadow proves technical
              bus integration and responsive defense capabilities, CEO Ian Cinnamon confirmed that it is financed
              entirely with private growth capital rather than procured under an awarded government grant or customer
              contract. Unrelated case studies retrieved during broad commercial discovery—such as BlueVolt LMS training
              implementations for Apex Tool Group and o9 Solutions APEX AI supply-chain planning models—represent
              distinct industrial tool and enterprise software products rather than spacecraft bus buyers, highlighting
              that verified named spacecraft buyers remain tightly held.
