      - number: '7.4'
        title: Capital Intensity, Vertical Integration Burn, and Valuation Pressure
        blocks:
          - type: paragraph
            body: >-
              Apex announced in June 2026 that it raised over $200 million in growth funding led by Glade Brook Capital
              Partners and Washington Harbour Partners, reaching a $2.3 billion post-money valuation. This followed a
              $200 million Series C round that initially valued the company at over $1 billion. While this capital
              influx bolsters cash reserves, the company's commitment to building productized satellite platforms ahead
              of demand and funding internal tech initiatives—such as developing Project Shadow on company capital
              without dedicated government procurement contracts—creates substantial cash burn. Scaling headcount past
              350 employees, expanding Factory One by 30,000 square feet, and purchasing aerospace inventory ahead of
              customer commitments requires sustained working capital. If customer constellation deployments lag or
              macroeconomic conditions tighten, Apex could face steep down-round risks or liquidity compression before
              reaching operating profitability.
