              Apex's business model relies on building standardized satellite bus platforms ahead of demand to
              dramatically compress delivery timelines. However, with over two-thirds of demand tied to national
              security and defense programs, any shift in U.S. defense appropriations or major prime contract
              re-competitions could strand capital-intensive inventory in Factory One.
