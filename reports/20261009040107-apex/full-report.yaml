              - CO014
      - number: '1.3'
        title: Operational Milestones and Defense Mission Roadmap
        blocks:
          - type: paragraph
            body: >-
              Apex's technological progression spans three standardized platform families—Aries, Nova, and
              Comet—accommodating mission payloads ranging from small constellations up to 3,000 kg on the Comet Mini
              configuration. The company established operational flight heritage in early 2024 with the launch of its
              initial Aries spacecraft into low Earth orbit, which has logged more than two years of continuous on-orbit
              mission performance. Building upon this foundation, Apex announced Project Shadow in late 2025 as a
              privately funded demonstration of on-orbit space-based interceptor technologies hosted aboard a Nova bus
              configured as an Orbital Magazine. In June 2026, Apex deepened its national security role by collaborating
              with Northrop Grumman on missile defense capabilities for the U.S. Space Force's Golden Dome for America
              initiative. In parallel, commercial diligence requires distinguishing spacecraft manufacturer Apex from
              unrelated corporate filings and registry homonyms such as Apex Treasury Corp and Apex Leadership.
            claimRefs:
