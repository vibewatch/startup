  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Export Control, and Defense Compliance Exposure
        blocks:
          - type: paragraph
            body: >-
              Apex operates in low Earth orbit (LEO) and geostationary orbit (GEO) with satellite bus platforms carrying
              commercial and national security payloads. The company's expansion into defense programs—specifically the
              Project Shadow space-based interceptor demonstration and collaboration with Northrop Grumman for the U.S.
              Space Force—places its operations directly under stringent federal oversight. Although unrelated
              commercial entities such as global fund administrator Apex Group operate under complex international
              regulatory regimes, Apex Space must maintain rigorous compliance with U.S. International Traffic in Arms
              Regulations (ITAR), Export Administration Regulations (EAR), Directorate of Defense Trade Controls (DDTC)
              registrations, and Federal Communications Commission (FCC) spectrum licenses. Failure to obtain or sustain
              export authorizations or defense security clearances would directly halt satellite bus deliveries and
              ground planned on-orbit flight demonstrations.
            claimRefs:
              - CR001
