chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Executive Leadership
        blocks:
          - type: paragraph
            body: >-
              Founded in 2022 by Chief Executive Officer Ian Cinnamon and Chief Technology Officer Max Benassi, Apex
              (officially operating as Apex Space) is a commercial aerospace manufacturer headquartered in Los Angeles,
              California. The company was founded to solve a central bottleneck facing commercial and allied defense
              satellite constellations: the historically bespoke, slow, and capacity-constrained nature of spacecraft
              bus manufacturing. By adapting high-rate terrestrial manufacturing techniques and productized modular
              architectures to spacecraft assembly, Apex aims to deliver standardized, configurable satellite bus
              platforms with drastically compressed lead times. In mid-2026, the company strengthened its executive
              bench by appointing Michael Kopet, former Vice President of Finance at Axon, as Chief Financial Officer to
              oversee manufacturing finance, margin expansion, and supply chain scaling as production throughput
              accelerates.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
      - number: '1.2'
        title: Capital Structure, Valuation, and Operating Scale
        blocks:
          - type: paragraph
            body: >-
              In June 2026, Apex closed an over $200 million growth financing round that nearly doubled its corporate
              valuation to $2.3 billion, following its crossing of the $1.0 billion valuation threshold earlier in the
              year. The financing was led by Glade Brook Capital Partners and co-led by national security technology
              investor Washington Harbour Partners, alongside existing venture backers. Capital proceeds are targeted
              toward ahead-of-need procurement, vertical integration of subsystems, and expansion of the Factory One
              campus in Los Angeles by 30,000 square feet. The manufacturing facility is designed to produce over 200
              satellite platforms annually at peak capacity, supported by a workforce that has doubled over the trailing
              year to more than 350 full-time employees. Crucial financial scale metrics, including annual run-rate
              revenue, recognized backlog, and customer unit pricing, remain undisclosed private metrics that secondary
              transaction platforms cannot independently verify.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
