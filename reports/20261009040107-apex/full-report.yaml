      - number: '5.3'
        title: Manufacturing Systems, Engineering Stack, and Diligence Verification
        blocks:
          - type: paragraph
            body: >-
              Apex executes an industrial operating model modeled after high-rate terrestrial manufacturing,
              centralizing final assembly, vehicle integration, and subsystem testing at its Factory One facility in Los
              Angeles [CE001, CE012]. Factory One has an engineered nameplate capacity exceeding 200 satellite buses
              annually at peak throughput, supported by an ongoing 30,000-square-foot campus expansion to house hardware
              integration facilities, testing cells, and an engineering team exceeding 350 personnel [CE012, CE013].
              Engineering execution relies on internal hardware-in-the-loop (HITL) simulation, dedicated guidance,
              navigation, and control (GNC) test rigs, vehicle emulators, and custom flight software maintained by
              internal engineering leads [CE014]. To protect production cadence against component supply bottlenecks,
              Apex directs growth capital toward vertical integration of proprietary subsystems, shifting away from
              external vendor procurement for critical flight modules [CE015]. However, third-party technical
              documentation from outside commercial spaces reveals significant name-collision risks with enterprise
              software platforms like Oracle APEX and Apex Project Eye, underscoring the total absence of public
              open-source developer repositories, APIs, or published telemetry schemas for Apex Space [CE016]. Technical
              underwriting requires access to private factory test yield data, single-point failure trade studies, and
              supply chain BOM audits.
            claimRefs:
              - CE001
