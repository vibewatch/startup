- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Perspective
  - Core Argument
  - Underlying Evidence & Drivers
  - Thesis-Break Triggers / Invalidation Criteria
  rows:
  - - Core Investment Thesis
    - Industrialized bus platform solves space supply bottleneck
    - Factory One campus expansion to 200+ buses/year, flight heritage on Aries, and Northrop Grumman Golden Dome collaboration
    - Multi-satellite on-orbit bus failures, cancellation of key constellation partnerships, or chronic production delays
  - - Core Investment Thesis
    - Dual-use defense and commercial constellation market expansion
    - Project Shadow on-orbit demo and accelerating government procurement of commercial off-the-shelf spacecraft
    - U.S. defense reallocation away from proliferated LEO architectures toward bespoke classified platforms
  - - Critical Anti-Thesis
    - Extreme valuation multiple on unverified revenue scale
    - Multiples.vc reports $18M revenue at Series D ($1B valuation); 2026 valuation of $2.3B doubles price without audited metrics
    - Independent audit proving annual GAAP revenue exceeds $100M with positive bus-level gross margins
  - - Critical Anti-Thesis
    - High capital intensity and vertical integration execution risk
    - Third $200M round in 14 months, self-funded Project Shadow R&D, and Phase Four propulsion acquisition integration
    - Demonstration of self-sustaining operational cash flow and positive unit gross margins across all bus lines
  notes: Comparison of structural growth catalysts against balance sheet and execution risks based on public financing disclosures.
