    - Revenue >$250M, Gross Margin >40%, Operating Margin ~25%
    - $4.5B - $6.0B (18x-24x EV/Rev)
    - Launch vehicle supply bottlenecks; international export control friction
  - - Base Case
    - 50%
    - Steady bus production of 50-80 units/yr; successful Project Shadow demo; mixed commercial remote sensing and DoD pathfinders
    - Revenue $100M - $150M, Gross Margin 25-30%, Near breakeven
    - $2.0B - $2.8B (14x-18x EV/Rev)
    - Margin compression from component supply delays and defense contract pricing caps
  - - Bear Case
    - 25%
    - Production delays at Factory One; Project Shadow mission anomalies; defense spending reallocation; commercial constellation failures
    - Revenue <$50M, Ongoing cash burn >$100M/yr, Dilution round required
    - $600M - $1.0B (distressed M&A / down-round)
    - Liquidity exhaustion leading to recapitalization below Series D liquidation preference
  notes: Scenario projections modeled on Factory One capacity milestones, smallsat industry comparable multiples, and capital consumption rates.
