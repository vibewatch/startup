    - June 2026 valuation of $2.3B implies elevated revenue multiple (55.6x on recorded Series D run-rate)
    - Late-stage pricing leaves minimal margin of safety without multi-hundred-million-dollar revenue scale
  - - Capital Discipline
    - neutral
    - Raising unsolicited capital provides balance sheet buffer but accelerates cumulative liquidation preferences
    - Dilution is manageable (~9% in Series E) but preference stack creates return hurdles for common equity
