chapter:
  number: 8
  title: Valuation
  summary: Apex closed an unlabelled Series E/growth financing round of over $200 million in June 2026 at a $2.3 billion post-money valuation, more than doubling its $1.0 billion Series D mark from September 2025. While customer momentum across proliferated defense and commercial bus programs remains substantial, third-party revenue tracking indicates extreme multiples (such as 55.6x on estimated $18 million Series D run-rate revenue) and wide discrepancies in historical revenue figures, justifying a disciplined research-more recommendation with a stretched valuation stance.
sections:
- id: SV001
  title: Investment Thesis, Anti-Thesis, and Recommendation
  body: |-
    Apex presents a compelling yet demanding investment profile within the commercial aerospace and defense ecosystem. The core thesis rests on the structural bottleneck in spacecraft manufacturing: while reusable launch capacity has grown rapidly, bus production has historically remained bespoke, slow, and expensive. Apex's strategy of mass-manufacturing configurable, productized buses (Aries, Nova, and Comet) ahead of need addresses expanding demand for proliferated low-Earth orbit (LEO) constellations. Customer and partner validation includes collaboration with Northrop Grumman on space-based interceptor capabilities for Golden Dome, high-rate manufacturing expansion at Factory One to a peak capacity of over 200 satellites annually, and backing from premier growth investors including Glade Brook Capital Partners and Washington Harbour Partners.

    The anti-thesis centers on extreme valuation expansion ahead of audited revenue and cash flow metrics. In June 2026, Apex raised over $200 million at a $2.3 billion post-money valuation, representing its third $200 million capital raise within 14 months and bringing cumulative capital raised to between $603 million and $926 million across public trackers. However, commercial revenue disclosures remain opaque and conflicting. Multiples tracker records report an estimated run-rate revenue of only $18 million at the September 2025 Series D round, implying a 55.6x revenue multiple, while Silicon Valley Investment Club cites wildly divergent revenue estimates ranging from $60 million in 2025 (Contrary Research) to $380 million in 2024 (PrivCo). Furthermore, capital-intensive programs such as the self-funded Project Shadow demonstration and ambitious factory vertical integration introduce substantial operational cash burn.

    Balancing strong operational scaling and defense alignment against elevated valuation multiples and unverified unit economics, the appropriate stance is research-more with medium confidence. The public valuation stance is rated stretched, with risk rated high. Investors should maintain active tracking but withhold growth-equity capital deployment until auditable gross margins, firm backlog conversion, and liquidation preference overhang can be independently verified.
