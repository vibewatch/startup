evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Secondary Market Pricing and Cap Table Detail
    missingEvidence: >-
      Audited secondary market transaction records, share-class liquidation preferences, and historical pricing
      schedules.
    whyItMatters: Prevents independent verification of whether secondary transactions support the headline $2.3B valuation.
    diligencePath: Request confidential cap table and share-class waterfall disclosures from company management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: Stakeholder and Institutional Cap Table Map
    missingEvidence: Complete schedule of minority institutional investors and non-lead venture syndicates from prior rounds.
    whyItMatters: Omits minor equity holders and debt providers who could influence future capitalization choices.
    diligencePath: Obtain full cap table during formal legal and financial diligence.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-diligence
    missingEvidence: Independent audited contract value data and third-party commercial satellite bus backlog conversion metrics.
    whyItMatters: >-
      While Apex discloses a 200+ satellite annual factory build capacity and a $2.3B valuation, addressable commercial
      merchant TAM cannot be verified without independent customer contract and delivery data.
    diligencePath: >-
      Obtain customer bus purchase orders, programmatic payment milestone schedules, and unredacted prime contract
      values during access-phase diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: realized-competitor-pricing
    missingEvidence: >-
      Audited realized pricing per bus, customer volume discount tiers, and unit gross margins for merchant competitors
      and Apex platforms.
    whyItMatters: >-
      Without realized pricing data, competitive comparison is restricted to list positioning rather than true
      cost-competitiveness.
    diligencePath: >-
      Review customer contract schedules, commercial procurement bids, or government contract award line-item
      disclosures.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure-gap
    missingEvidence: >-
      Audited revenue by product and service, realized pricing, contracted backlog, delivery and acceptance history, and
      the revenue-recognition policy.
    whyItMatters: >-
      These inputs determine whether capacity and demand convert into durable recognized revenue rather than inventory
      or unexercised opportunity.
    diligencePath: >-
      Obtain audited statements, the contract and backlog schedule, invoice and acceptance samples, and
      revenue-recognition memoranda from the data room.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI004
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-gap
    missingEvidence: >-
      Bill of materials, direct labor, utilization, yield, scrap, warranty, service cost, gross margin, contribution
      margin, and capex by platform.
    whyItMatters: >-
      Without these inputs, the economic effect of scale and vertical integration cannot be distinguished from higher
      fixed costs and inventory exposure.
    diligencePath: >-
      Review platform-level cost ledgers, factory KPIs, make-versus-buy studies, warranty data, and monthly margin
      bridges.
    relatedQuestionRefs:
      - QI003
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Cash and restricted cash, monthly burn, inventory and working capital, debt and lease obligations, committed
      program spend, downside runway, and next-round trigger.
    whyItMatters: >-
      Financing raised is not cash available, and the production ramp cannot be underwritten without a liquidity bridge
      and obligation schedule.
    diligencePath: >-
      Obtain the latest balance sheet, monthly cash flow, debt and lease schedules, inventory aging, board-approved
      budget, and downside liquidity model.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-mix
    missingEvidence: >-
      Customer-level backlog, prime versus direct contracting mix, milestone payments, cancellation rights,
      concentration, and procurement timing.
    whyItMatters: >-
      More than two-thirds defense exposure may support demand but can also concentrate collections around
      appropriations, awards, and acceptance milestones.
    diligencePath: >-
      Review the customer and backlog schedule, top-ten concentration, funded versus unfunded awards, payment
      milestones, and renewal or follow-on probabilities.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: adverse-financial-evidence
    missingEvidence: >-
      A genuinely adverse, independent Apex-specific source addressing contract execution, production delays, margin
      pressure, liquidity, defaults, inventory, or customer concentration.
    whyItMatters: >-
      The assigned pool contains no skeptical Apex-specific financial witness, limiting external challenge to
      company-issued scale and financing claims.
    diligencePath: >-
      Seek customer and supplier references, procurement records, lien and litigation searches, credit evidence, and
      independent reporting during controlled diligence.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer SDK, REST API specification, or payload mechanical/electrical ICDs for third-party constellation
      integration.
    whyItMatters: >-
      Without public interface control documents or developer tooling, software and hardware payload integration
      maturity cannot be evaluated independently from marketing materials.
    diligencePath: >-
      Request standard customer Interface Control Documents (ICDs), bus electrical harness schematics, and simulator SDK
      documentation during private technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: customer-retention-and-nrr
    missingEvidence: >-
      Audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), annual customer churn, and repeat contract
      expansion data across commercial and defense accounts.
    whyItMatters: >-
      Prevents validation of bus platform stickiness, customer lifetime value, and whether initial satellite bus
      deliveries translate into multi-vehicle constellation repeat orders.
    diligencePath: >-
      Request cohort retention metrics, renewal histories, and master service agreement expansion schedules during
      private management diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-backlog
    missingEvidence: >-
      Customer-by-customer breakdown of firm order backlog, delivery milestone schedules, and revenue concentration
      percentages.
    whyItMatters: >-
      High dependence on single defense programs (e.g. U.S. Space Force / Northrop Grumman) poses acute revenue
      concentration risk if government procurement schedules slip.
    diligencePath: >-
      Review confidential customer contract ledgers, contracted bus delivery schedules, and customer concentration
      tables under NDA.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU001
      - TU002
  - type: private-evidence-only
    severity: material
    topic: regulatory-defense-clearances
    missingEvidence: Public disclosure of Apex's formal ITAR DDTC audit records and DCSA classified facility clearance status.
    whyItMatters: >-
      Directly determines whether Apex can build and host highly classified national security payloads at Factory One
      without intermediary primes.
    diligencePath: >-
      Request facility clearance documentation and export compliance audit reports directly from Apex management under
      NDA.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition-and-margins
    missingEvidence: >-
      Certified GAAP financial statements detailing realized revenue, bus-level gross margins, cost of goods sold, and
      monthly operating cash burn.
    whyItMatters: >-
      Public trackers disagree widely on historical revenue ($18M vs. $60M vs. $380M), making precise valuation multiple
      underwriting impossible without company financial records.
    diligencePath: >-
      Request audited income statements, revenue recognition policy by contract milestone, and unit margin reports
      during confidential diligence.
    relatedQuestionRefs:
      - QV006
      - QV007
  - type: missing-source
    severity: material
    topic: contracted-backlog
    missingEvidence: >-
      Firm legally binding backlog schedule disaggregated by customer, pricing per bus model, scheduled delivery year,
      and cancellation penalty clauses.
    whyItMatters: >-
      Multi-billion-dollar valuation depends on high-rate delivery conversion rather than announced non-binding letters
      of intent or memoranda of understanding.
    diligencePath: Review master purchase agreements and signed task orders under nondisclosure agreement.
    relatedQuestionRefs:
      - QV005
      - QV008
  - type: private-evidence-only
    severity: minor
    topic: cap-table-waterfall
    missingEvidence: >-
      Complete shareholder capitalization table showing exact senior liquidation preference overhang, conversion terms,
      and warrant allocations.
    whyItMatters: >-
      Consecutive $200 million funding rounds create substantial preferred liquidation stacks that must clear before
      common shareholders participate in liquidity proceeds.
    diligencePath: Inspect corporate charter, certificate of incorporation amendments, and investor rights agreements.
    relatedQuestionRefs:
      - QV003
      - QV008
