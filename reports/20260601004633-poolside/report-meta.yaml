companyProfile:
  summary: >-
    Poolside is an AI company founded in San Francisco in April 2023 by former GitHub CTO Jason Warner
    and Eiso Kant that targets high-consequence software engineering environments. Its public materials
    emphasize sovereign deployment, full model-weight delivery, agent orchestration, and forward-deployed
    implementation teams for enterprises and public-sector buyers that cannot rely on cloud-only copilots.
    The company raised a $500 million Series B at roughly a $3 billion valuation in October 2024 and later
    expanded its narrative into infrastructure and public-sector channels via AWS, CoreWeave, Project Horizon,
    and Poolside Federal.
  foundedDate: '2023-04-01'
  founders:
    - name: Jason Warner
      role: Co-Founder & CEO
      background: Former GitHub CTO; also led engineering organizations at Canonical and Heroku.
      claimRefs: []
    - name: Eiso Kant
      role: Co-Founder & co-CEO
      background: Developer-tools founder/operator with prior engineering analytics and software startup experience.
      claimRefs: []
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: >-
    Poolside sells an enterprise coding stack that includes proprietary foundation models, agent orchestration,
    developer surfaces across CLI/IDE/web/headless modes, and a console for governance, permissions,
    traces, and auditability. The product is designed to run in customer VPCs, on-premises, air-gapped,
    or classified environments.
  customerFocus: >-
    Global 2000 enterprises, regulated industries, public-sector agencies, defense-adjacent programs,
    and organizations that need software-engineering AI inside strict security boundaries rather than
    through public cloud-only endpoints.
  businessModel: >-
    Enterprise software plus deployment and integration services. Poolside monetizes access to models,
    agents, and control-plane tooling while using forward-deployed research engineers and partner channels
    to land and expand inside large, security-sensitive accounts.
  stage: Series B / growth-stage private
  fundingStatus: >-
