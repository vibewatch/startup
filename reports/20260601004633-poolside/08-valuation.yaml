- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current ARR / revenue run rate
    - Latest booked revenue, ARR, growth, and quarterly trajectory
    - Core input to any private valuation case
    - Management finance team / dataroom request
  - - Gross margin and burn
    - Software-only, blended, and fully loaded gross margin plus monthly burn and runway
    - Determines whether valuation maps to software economics or capital intensity
    - Finance diligence / internal KPI deck
  - - Customer quality
    - Direct customer list, production deployments, renewals, churn, and expansion by cohort
    - Separates lighthouse proof from durable franchise quality
    - Revenue ops / customer success interviews
  - - Compute and infrastructure roadmap
    - Current partner status, obligations, and financing needs after Horizon issues
    - Determines dilution and execution overhang
    - Infra leadership / board materials
  - - Win-loss and competitive positioning
    - Evidence of wins versus incumbents and agentic challengers
    - Tests whether the sovereign wedge is real in procurement
    - Sales leadership / deal review
  - - Cap table and preference overhang
    - Exact securities, liquidation stack, and follow-on rights from past rounds
    - Required to translate valuation into actual return potential
    - Legal / financing counsel
  notes: These are the minimum diligence asks required before treating Poolside as a priced opportunity rather than a narrative-rich watchlist name.
