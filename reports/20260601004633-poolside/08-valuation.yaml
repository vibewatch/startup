- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Direct customer proof broadens, sovereign wedge holds, margins become software-like, infrastructure roadmap stabilizes
    - $8B-$12B valuation range becomes defensible, roughly matching or approaching the upper reported private-markets narrative
    - Execution and concentration still matter, but upside comes from category leadership in secure coding AI
    - Requires strong private KPIs and post-2026 delivery stability
  - - Base
    - Technology remains strong, but disclosure improves only partially and customer proof grows steadily rather than explosively
    - $3B-$5.5B range, centered around the 2024 closed anchor and a modest premium for technical differentiation
    - Valuation remains limited by missing metrics and high execution burden
    - Most consistent with current public evidence
  - - Bear
    - Infrastructure uncertainty deepens, direct proof stays partner-led, or incumbents narrow the governance gap
    - $1.5B-$3B range, implying downside to flat from the 2024 mark
    - Dilution, execution drag, and weak proof compress investor willingness to pay
    - Material if the next refresh still lacks revenue and retention clarity
  notes: Scenario ranges are explicit estimates, not market prices; they are anchored to public comps, the last closed round, and disclosed risk state.
