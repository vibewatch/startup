- id: TV005
  title: Thesis-break trigger table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Infrastructure instability persists
    - No credible replacement or stable compute plan after the 2026 CoreWeave/Horizon issues
    - Turns capital intensity from manageable risk into chronic overhang
    - Move from research-more to avoidance until fixed
  - - Customer proof remains narrow
    - Next refresh still lacks broad direct-customer and retention evidence
    - Undermines the premium-wedge thesis
    - Apply concentration discount and lower valuation range
  - - Economics stay opaque
    - Still no ARR, gross margin, or burn disclosure when financing expectations rise
    - Makes later valuation step-ups speculative rather than earned
    - Refuse to underwrite markup without private data
  - - Incumbents close governance gap
    - Win-loss evidence shows customers prefer bundled alternatives despite Poolside sovereignty pitch
    - Shrinks moat and pricing power
    - Lower multiple assumption and revisit category position
  - - Regulatory or legal diligence becomes recurring blocker
    - Multiple deals slow or fail on AI governance, licensing, or trust questions
    - Turns compliance into a growth tax
    - Increase risk rating and delay investment decision
  notes: These triggers are designed to be monitorable and investment-relevant rather than generic operating metrics.
