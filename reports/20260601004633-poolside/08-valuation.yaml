- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Sovereign deployment plus coding-specific RL can support premium enterprise contracts in the hardest environments.
    - Show direct customer wins, retention, and software-heavy margins that prove this wedge pays
  - - AWS and public-sector alignment can shorten procurement and lift ACV.
    - Disclose actual pipeline and close-rate conversion through these channels
  - - Model Factory ownership gives Poolside a technical edge that wrappers and hosted copilots may struggle to copy.
    - Translate architecture into repeatable commercial outcomes rather than just technical narrative
  - - Closed 2024 financing demonstrates investor confidence.
    - Verify whether later fundraises actually closed and on what terms
  - - 'Anti-thesis: opaque economics make every bullish scenario fragile.'
    - Provide ARR, gross margin, burn, runway, and customer concentration
  - - 'Anti-thesis: infrastructure ambition may be outrunning core software proof.'
    - Show a stable compute roadmap that does not require heroic financing assumptions
  - - 'Anti-thesis: incumbents and hypergrowth challengers may compress the wedge.'
    - Produce win-loss data showing Poolside wins where governance and sovereignty matter most
  notes: Each row pairs a thesis statement with the exact evidence needed to treat it as underwritten rather than aspirational.
