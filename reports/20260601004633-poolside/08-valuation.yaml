- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Poolside
    - Last closed private round
    - ~$3B valuation (October 2024 closed); later $12B target reported, not confirmed closed
    - Only hard Poolside valuation anchor
    - No public revenue or retention metrics against the valuation
  - - GitLab
    - Public devtools company
    - ~$5.24B market cap in June 2026 on $759.2M revenue and 89% gross margin
    - Public benchmark for disclosed developer-software economics
    - Different maturity, public-company discount, and far higher disclosure quality
  - - Cursor
    - Hypergrowth private coding platform
    - In talks to raise $2B+ at $50B valuation; Sacra estimates $3B annualized revenue
    - Best private-market coding-agent growth comp
    - Scale and revenue visibility far exceed Poolside's public disclosure
  - - Replit
    - Developer platform / app-building comp
    - $3B valuation on $150M annualized revenue in 2025
    - Useful lower-end private comp for developer tooling and AI app creation
    - Different user mix and much more consumer / no-code orientation
  - - Cognition
    - AI coding-agent comp
    - $10.2B valuation on $73M ARR in 2025
    - Agent-first comp with disclosed ARR and burn commentary
    - Different product, culture, and customer mix
  - - Anthropic
    - Frontier model leader
    - $183B valuation and $5B ARR in 2025
    - Upper-bound context for frontier AI willingness to pay
    - Far broader platform, capital base, and customer scale than Poolside
  notes: This is a partial comp set chosen for relevance to coding AI, developer software, and frontier-model narratives; it is not an exhaustive private-markets screen.
