          - type: paragraph
            body: >-
              最深的技术故事藏在用户界面之下。Poolside 的模型页和公开发布文章描述了两个 Laguna 模型：Laguna M.1 是总参数 225B、活跃参数 23B 的专家混合模型；Laguna XS.2 是总参数
              33B、活跃参数 3B 的 MoE，并以 Apache 2.0 许可开放权重。长上下文更新又把两者扩展到 256K 上下文，并报告处理超过一万亿 tokens、XS.2 在 Hugging Face 下载超过
              50,000 次。围绕这些模型的是 Model Factory：一个分层系统，覆盖摄取、数据清洗、混合、预训练、后训练、评估和强化学习。Poolside 自己的技术文章描述了数据管线：在基线算力上每天可摄取约
              20 trillion tokens；PB 级或更大的数据系统；名为 Titan 的分布式训练代码库；以及索引超过 800,000 个代码仓库、并通过 RLCEF
              支持代码学习工作负载的代码执行环境。这套架构很重要，因为 Poolside 不是简单包装第三方 API。它的论点是，产品质量来自拥有从原材料到后训练智能体行为的完整闭环。
