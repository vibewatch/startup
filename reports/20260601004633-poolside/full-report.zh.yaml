      - number: '8.2'
        title: 可比公司集合与情景区间
        blocks:
          - type: paragraph
            body: >-
              公开和私有可比公司说明，没有直接财务披露时，Poolside 很难估值。GitLab 提供了公开软件基准：约 $759 million 收入、89% 毛利率，以及 2026 年 6 月约 $5.24
              billion 的公开市值。Replit 提供了价格更低、复杂度更低的编程平台可比样本，年化收入 $150 million、估值 $3 billion。Cognition 展示了更智能体化的企业编程路径：ARR
              $73 million、估值 $10.2 billion，不过产品故事和运营文化差别很大。Cursor 则说明，只要收入可见性异常强，超高速增长能拿到什么价格：Sacra 估计其年化收入 $3
              billion，2026 年曾讨论 $50 billion 融资。Anthropic
              提醒投资人，前沿模型领导者可以达到极端估值，但它规模和范围都大太多，只能当背景锚，不能直接当可比公司。在这个背景下，仅看市场叙事，Poolside 已关闭的 $3 billion
              估值不再荒唐，但证据仍不够。问题不是这个品类能不能支撑大估值；显然能。问题是 Poolside 自身披露是否足以支撑按已验证赢家的价格买入。
