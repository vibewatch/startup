  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Poolside 实际卖进哪里
        blocks:
          - type: paragraph
            body: >-
              Poolside 的可服务市场最好界定为卖给重视开发者生产力、代码质量、治理和数据控制的组织的 AI 软件工程系统。这个范围窄于通用生成式 AI，也窄于全部 AI 开发工具。Poolside
              自己的企业页和政府页强调全栈模型部署、智能体编排、审计轨迹，以及在客户边界内运行。这些属性让它更接近企业编码平台、开发者安全工作流和任务关键型软件自动化，而不是消费级聊天机器人或宽泛办公助手。市场研究机构对品类范围也没有一致口径：有的只统计代码工具，有的统计更宽的编码助手或服务，还有的把相邻基础设施、咨询或非工程
              AI 开发软件打包进去。尽调时，纳入的支出应覆盖席位订阅、API 使用、编排 / 控制层，以及直接绑定软件工程结果的实施服务。排除的支出应包括原始 GPU 基础设施、通用 LLM 聊天、工程工作流之外的低代码 /
              无代码工具，以及不解决安全软件交付问题的横向生产力助手。
