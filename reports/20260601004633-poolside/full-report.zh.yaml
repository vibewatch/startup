        title: 版图与品类结构
        blocks:
          - type: paragraph
            body: >-
              Poolside 面对的不是一组干净的单一同行。竞争版图至少拆成五类：已经掌握开发者工作流和身份的打包型既有厂商、动作很快的独立智能体厂商、企业治理专家、开放且可配置的智能体框架，以及让非专业人士无需传统安全
              SDLC 也能构建软件的替代产品。GitHub Copilot、Amazon Q Developer、Gemini Code Assist 和 GitLab Duo
              都受益于现有平台分发，能借工程团队已在使用的工具落地。Cursor 和 Windsurf 代表现代智能体优先挑战者：它们的价值主张是速度、广泛模型访问和云智能体，而不是主权控制。Sourcegraph 和
              Tabnine 在企业代码库上下文和治理上竞争。Continue 从开放和源代码受控的一侧压迫市场。Replit Agent
              不是严格同类的受监管企业对手，但作为部分新建工作流自动化的替代品仍然重要。因此，Poolside 竞争的核心不在原始代码生成新颖性，而在企业是否相信主权、可追踪性和边界内部署值得付费，也值得改变流程。
