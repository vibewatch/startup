      - number: '5.3'
        title: 部署、集成、信任与控制
        blocks:
          - type: paragraph
            body: >-
              部署和控制位于 Poolside 产品论点的中心。企业和平台材料强调，客户可以在自己的基础设施中运行系统，包括 VPC、本地和隔离环境，并拿到完整模型权重，而不是只有托管 API
              访问。平台页补充了实操中重要的运营细节：容器化执行环境、密钥管理、网络策略控制、显式权限、记录下来的运行轨迹和集中策略执行。AWS 合作展示了这套架构如何触达定制程度较低的买方：Poolside 也可以作为
              AWS 第一方供给出现，部署在客户 VPC，并使用 Trainium 或 NVIDIA 芯片。Redpanda 合作又增加一层集成，让智能体以最小权限控制和事件检查访问 300
              多个企业数据源。相较竞争产品，技术差异不在于只有 Poolside 有终端智能体、聊天或企业管理功能。GitHub Copilot、Claude Code、Amazon Q、Gemini Code
              Assist、GitLab Duo、Sourcegraph Cody、Continue 和 Tabnine 都在销售大量工作流和治理功能。Poolside
              的独特主张是，这些控制嵌在一套主权栈里，客户可以同时拥有模型层、部署边界和审计轨迹。
