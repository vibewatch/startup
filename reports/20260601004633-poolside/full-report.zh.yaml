      - number: '5.4'
        title: 差异化、成熟度与路线图
        blocks:
          - type: paragraph
            body: >-
              Poolside
              的差异化故事有三块强项和一个重要弱点。第一，公司围绕面向编码的专用模型建立了连贯技术信念，并用代码执行反馈做强化学习训练，这比通用助手话术更具体。第二，公开细节显示其运营架构罕见地完整：数据摄取、数据集清洗、Titan、代码执行、后训练、评估和智能体部署都被描述为互通系统，而不是孤立团队。第三，相比托管编码助手，它的部署姿态很少见：完整权重、隔离运行、策略执行、可导出的运行轨迹和客户控制基础设施。弱点是成熟度。Laguna
              系列、`pool` 和 Shimmer 到 2026 年才公开发布；公开信任界面仍缺少独立可靠性统计、SLA
              或完整认证披露。因此，产品看起来技术野心大、整合度高，但公开成熟度仍早。投资人应把它看作一个可信架构，外部证明正在出现，而不是一个已充分去风险的企业平台。
