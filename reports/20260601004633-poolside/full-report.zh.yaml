      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动同时出现在调查数据和厂商话术里：开发者报告生产力提升、更快上手陌生代码、更好的测试生成，以及一定代码质量改善；厂商也越来越多销售智能体工作流、代码审查和集成 SDLC
              辅助，而不只是自动补全。市场研究摘要还给出第二个驱动：软件复杂度持续上升，使得加速调试、测试和交付的 AI 工具更容易被证明合理。Poolside 尤其受益于想要本地或隔离运行的买方子集，因为 Grand
              View 和 Poolside 都指向受监管行业对本地控制的需求。但同一组证据也解释了为什么市场并非无摩擦。Stack Overflow 发现，开发者对 AI 准确性的怀疑多于信任，对智能体的安全 /
              隐私担忧很强，也不太愿意把部署 / 监控或项目规划交出去。GitHub 自己的调查显示，公司层面的批准仍落后于个人使用。对 Poolside
              来说，这些约束比对便宜的自助助手更重要，因为它的销售动作假设最难的环境会最先购买。这意味着信任、安全审查和 ROI 证明不是边缘约束，而是市场边界本身。
