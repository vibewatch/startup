      - number: '1.4'
        title: 商业证明、合作伙伴、收购与不利事件
        blocks:
          - type: paragraph
            body: >-
              Poolside 的公开证明集最强的是部署就绪度，最弱的是已披露商业规模。官方材料展示了一套连贯的企业动作：上线 AWS、借 Poolside Federal LLC 做公共部门包装、获得
              Vibrint、Sterling Computers 和 Hunted Labs 证言，并围绕前置部署研究工程师搭建运营模式。2025 年 11 月，公司收购 Fern Labs，进一步扩张这套打法；Fern
              Labs 的 Bridge 编排层和 Palantir 训练出来的部署团队，被明确定位为高风险多智能体上线工具。与此同时，Poolside
              的战略变得更吃资本，也更暴露在执行风险下。DatacenterDynamics 和 Yahoo Finance 2026 年 4 月报道称 CoreWeave/Horizon 安排已经破裂，Poolside
              正在寻找替代伙伴，也让其垂直整合基础设施论点的可行性出现新疑问。这些报道并不推翻 2025 年的公告，但会实质改变投资人该如何解读它们：Horizon 现在应被视为执行赌注，而不是锁定的战略资产。Poolside
              仍未披露 ARR、客户数量、董事会和现金余额，意味着公司概览中的若干 KPI 仍是缺口，不是已验证业绩证据。
