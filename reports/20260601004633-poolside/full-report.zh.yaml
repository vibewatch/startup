      - number: '1.3'
        title: 融资历史、投资人和基础设施野心
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开融资事件是 Poolside 2024 年 10 月的 Series B：TechCrunch、Crunchbase News、Tech Funding News 和 Sacra 都指向一轮 $500
              million 融资，估值约 $3 billion，使已披露融资总额达到约 $626 million。多家独立来源都认定 Bain Capital Ventures 为领投方，参投名单也稳定包含
              Nvidia、DST Global、StepStone Group、Citi Ventures、Felicis、Redpoint 等。公司官方说法没有发布完整轮次备忘录，但 Poolside 自己 2024 年
              10 月的文章把新资金直接连到训练集群扩容和商业化。到 2025 年 10 月，公司已把资本叙事和更激进的基础设施叙事绑在一起：Project Horizon 是西得克萨斯规划中的 2GW AI 园区；与
              CoreWeave 的算力合作则包含超过 40,000 块 NVIDIA GB300 NVL72 GPU、250MW 一期，以及 500MW 预留扩容选项。Sacra 还报道 Poolside 在 2025
              年末寻求规模更大的融资，但该轮状态没有在已抓取的一手来源中得到印证，因此更高估值应视为未关闭融资报道，而不是已落定的股权结构事实。
