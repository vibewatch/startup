  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与当前融资背景
        blocks:
          - type: paragraph
            body: >-
              支持 Poolside
              的投资逻辑很直接：公司在为高影响环境打造差异化主权编程技术栈，已经证明自己能拿到资金，并处在一个从试验走向企业预算科目的品类里。如果主权部署、可审计性和嵌入式实施成为持久购买标准，Poolside
              有机会在公共部门、国防和受监管企业账户中拿到很大的合同。反向逻辑同样清楚。公开证据仍没有显示 ARR、毛利率、现金跑道、客户数、NRR 或广泛的直接客户证明。最近的硬估值事实，是 2024 年以约 $3
              billion 估值完成的融资。Sacra 后来报道的 2025 年 $12 billion 目标可能说明投资人有兴趣，但只要融资未关闭，它就不是稳固估值锚。2026 年 CoreWeave/Horizon
              的复杂情况让局面更微妙，因为投资人更可能在软件经济性可见之前，就为执行和基础设施雄心买单。这种组合不会杀死故事，但让入场价格纪律变得关键。
