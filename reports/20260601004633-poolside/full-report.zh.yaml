      - number: '6.3'
        title: 留存、扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              公开留存证据几乎是空白，而不是证明。没有披露
              NRR、GRR、流失、合同期限、续约率、客户分组行为或客户满意度数据。这不意味着客户质量弱，但意味着市场还无法区分持久平台采用和早期灯塔部署。最有证据支持的扩张逻辑是定性的。Poolside
              政府和平台材料暗示先落地再扩张的动作：从一个安全软件工程用例切入，嵌入 FDRE 和解决方案架构师，再扩展到更多代码仓库、团队、连上数据的智能体工作流，并可能借 Redpanda
              扩展到更广的知识工作自动化。AWS 采购也能降低后续企业客户摩擦，让买方通过既有供应商关系采购
              Poolside。反面是集中风险。公开证明集较薄，意味着少数重要引用可能承担了过多公司叙事。伙伴依赖也重要。如果相当一部分部署或客户触达依赖
              AWS、公共部门集成商或狭窄的安全环境生态，即便没有单一终端客户被点名为主导客户，集中度仍然存在。
