      - number: '8.3'
        title: 建议、敏感性与下行触发点
        blocks:
          - type: paragraph
            body: >-
              仅凭公开数据，建议是继续研究，而不是买入或回避。上行空间有意义：如果 Poolside 能把安全环境切入点转化成可引用的直接客户，在服务和算力负担下仍展示软件为主的利润率，并在 CoreWeave/Horizon
              波动后稳定基础设施路线图，公司就可能证明，估值显著高于 2024 年标记也合理。下行同样有意义：如果直接证明仍由伙伴主导、既有厂商补上治理缺口，或资本强度持续跑在已披露软件经济性前面，那么即使 2024
              年价格也会显得偏高。因此敏感性最高的四个变量是：经验证收入或
              ARR、客户留存和直接证明的持久性、算力和基础设施的真实资本负担，以及主权性究竟是结构性稀缺，还是只是锦上添花。由于这些变量在公开层面仍未解决，投资人应把估值视为期权式估值。等待证据也有上行，因为剩余不确定性主要不是
              TAM，而是公司能否把技术转化为可融资经济性。
