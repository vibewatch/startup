      - CV034
      - CV035
      - CV036
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前 ARR / 收入运行率
        - 最新入账收入、ARR、增长和季度轨迹
        - 任何私募估值情景的核心输入
        - 管理层财务团队 / 数据室请求
      - - 毛利率和烧钱
        - 纯软件、混合口径和全成本口径毛利率，加上月度烧钱和现金续航期
        - 决定估值对应软件经济性，还是资本强度
        - 财务尽调 / 内部 KPI 材料
      - - 客户质量
        - 直接客户名单、生产部署、续约、流失，以及按同期群划分的扩张
        - 区分灯塔案例和可持续业务质量
        - 收入运营 / 客户成功访谈
      - - 算力和基础设施路线图
        - Horizon 问题后的当前合作伙伴状态、义务和融资需求
        - 决定稀释和执行压力
        - 基础设施负责人 / 董事会材料
      - - 赢单 / 输单和竞争定位
        - 相对既有厂商和智能体挑战者的赢单证据
        - 检验主权楔子在采购中是否真实
        - 销售负责人 / 交易复盘
      - - 股权结构和优先权压力
        - 过往轮次的具体证券、清算顺位和跟投权
        - 要把估值转换成真实回报潜力，这些信息必不可少
        - 法务 / 融资顾问
    notes: 这些是最低限度的尽调问题；回答之前，只能把 Poolside 当成叙事丰富的观察名单公司，而不是可定价机会。
    claimRefs:
