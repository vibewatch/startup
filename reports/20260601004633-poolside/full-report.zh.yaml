          detail: vLLM、PyTorch、MCP 服务器、智能体工具、外部库
          tone: neutral
      edges:
        - from: p2
          to: p1
        - from: p3
          to: p1
        - from: p4
          to: p1
        - from: p5
          to: p1
        - from: p6
          to: p1
    approximationNotes: null
    claimRefs:
      - CR019
      - CR020
      - CR025
      - CR027
      - CR028
      - CR029
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议维持「继续研究」：估值不透明和执行风险抵消了技术潜力和品类强度。
    data:
      nodes:
        - id: r1
          label: 有吸引力的技术切入点
          detail: 主权部署和面向编码的 RL 带来真实上行潜力
          tone: positive
        - id: r2
          label: 大品类机会
          detail: 编码 AI 对标公司表明，只要证据足够强，极高估值有可能成立
          tone: positive
        - id: r3
          label: 经济性和客户质量不透明
          detail: ARR、利润率、留存和广泛直接证据仍未披露
          tone: warning
        - id: r4
          label: 执行和资本压力
          detail: CoreWeave/Horizon 不确定性抬高下行和稀释风险
          tone: negative
        - id: r5
          label: 建议：继续研究
          detail: 保持跟踪 Poolside，但在支付溢价前要求更深尽调
          tone: neutral
      edges:
        - from: r1
          to: r5
        - from: r2
          to: r5
        - from: r3
          to: r5
        - from: r4
          to: r5
    approximationNotes: null
    claimRefs:
      - CV005
      - CV006
      - CV022
      - CV023
      - CV024
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值最敏感的是直接经济性和执行证据，而不是品类需求是否存在。
    data:
      items:
        - label: 已验证 ARR / 收入
          value: 5
          detail: 最大的单一上行或下行摆动因素
          tone: positive
        - label: 留存和直接客户证据
          value: 5
          detail: 把叙事变成可定价的质量
          tone: positive
        - label: 基础设施稳定性
          value: 4
          detail: 需要它来防止资本折价占据主导
          tone: warning
        - label: 毛利率证据
          value: 4
          detail: 决定这个故事更像软件，还是资本密集型服务
          tone: warning
        - label: 竞争护城河持久性
          value: 3
          detail: 重要，但没有经济性证据那么决定性
          tone: neutral
        - label: 品类 TAM 支撑
          value: 2
          detail: 市场和可比公司证据已经基本建立
          tone: neutral
    approximationNotes: 数值是 1-5 的序数敏感度评分，不是统计回归输出。
    claimRefs:
      - CV011
      - CV022
      - CV026
      - CV027
      - CV031
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间围绕 2024 年已完成融资锚点聚集；只有私下证据补上披露缺口，才有上行空间。
    data:
      items:
        - label: 悲观情景估值
          low: 1.5
          mid: 2.2
          high: 3
          displayValue: $1.5B-$3.0B
          detail: 如果合作伙伴主导的证据持续存在、基础设施风险加深，或切入点被压缩，则适用。
          tone: negative
        - label: 基准情景估值
          low: 3
          mid: 4.2
          high: 5.5
          displayValue: $3.0B-$5.5B
          detail: 以最近完成的 $3B 估值为锚；如果证据略有改善，再为技术差异化加入适度溢价。
          tone: neutral
        - label: 乐观情景估值
          low: 8
          mid: 10
          high: 12
          displayValue: $8.0B-$12.0B
          detail: 需要直接经济性和客户证据足够强，才能接近私募市场叙事中报道的上沿。
          tone: positive
    approximationNotes: 这些区间是基于公开可比公司、最近一轮已完成融资和当前风险状态搭建的显式投资估计；不是市场报价。
    claimRefs:
      - CV002
      - CV003
      - CV012
      - CV013
      - CV016
      - CV022
      - CV023
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Poolside 在产品野心上得分最高，在证据完整性上最低。
    data:
      items:
        - label: 市场机会
          value: 4
          max: 5
          unit: /5
          detail: 品类强度可信，证据支撑充分
          tone: positive
        - label: 产品 / 护城河质量
          value: 4
          max: 5
          unit: /5
          detail: 主权部署和 RL 编码堆栈仍有差异化
          tone: positive
        - label: 客户证据
          value: 2
          max: 5
          unit: /5
          detail: 公开证据真实，但狭窄且由合作伙伴主导
          tone: warning
        - label: 经济性可见度
          value: 1
          max: 5
          unit: /5
          detail: ARR、利润率和现金跑道均未公开披露
          tone: negative
        - label: 执行风险
          value: 2
          max: 5
          unit: /5
          detail: 基础设施与合作伙伴不稳定，抬高风险权重
          tone: negative
        - label: 证据完整性
          value: 1
          max: 5
          unit: /5
          detail: 太多核心投资判断事实仍未公开
          tone: negative
    approximationNotes: 评分是 IC 基于 1-5 分量表作出的启发式判断，并非经审计指标。
    claimRefs:
      - CV005
      - CV006
      - CV023
      - CV024
      - CV031
      - CV040
