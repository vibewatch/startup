      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              这个市场现在横跨多种购买动作。大众市场编码助手中，用户和买方都可能是个人开发者。到了 GitHub Copilot、Cursor、Claude Code、Amazon Q Developer、Gemini
              Code Assist 和 GitLab Duo 这类工具，一旦使用走出试验阶段，买方就扩展到工程经理、平台团队或中央 IT。Poolside
              把这套逻辑进一步推向自上而下的企业采购：终端用户仍是开发者，但经济买方往往是 CTO、平台工程负责人、CISO
              或公共部门项目负责人，因为部署架构、模型权重和治理本身就是产品的一部分。调查证据支持这种分层。开发者愿意使用 AI 工具，但组织批准、政策和采购仍会制约规模化上线。因此，Poolside 的 SAM
              与其说取决于原始开发者人数，不如说取决于有足够工程规模、又有足够安全敏感度的组织数量；这些组织才会为定制部署、FDRE
              支持和已预算的基础设施买单。采用路径大致是：先验证试点工作流，再做安全和架构审查，随后进入采购和嵌入式部署，最后扩展到更广的软件交付流程。
