  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业化经济性
        blocks:
          - type: paragraph
            body: >-
              Poolside 的公开材料指向企业合同生意，而不是大众自助 SaaS 动作。公司把模型、智能体和治理工具卖给重视安全的企业和公共部门环境，再用部署支持包住这套软件栈。AWS 合作在财务上很重要，因为它把
              Poolside 变成 AWS 第一方供给，让客户可以用 AWS 条款签约、消耗既有云支出承诺，而不是开启全新的供应商路径。Sacra 的公司档案和 Poolside
              自己的定位都暗示，收入模式不止软件访问：前置部署研究工程师、客户微调、部署工作和支持看起来都是商业包的一部分。这能推高平均合同额，尤其是在受监管客户中；但公开记录没有拆分经常性软件收入和实施较重的服务，也让收入质量更难看清。结果是，一个高
              ACV 企业模式具备可信度，渠道杠杆强于纯直销创业公司，但披露远弱于投资人通常对一家声称拥有前沿规模经济公司的要求。
