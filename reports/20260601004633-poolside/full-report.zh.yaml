  - id: TV005
    title: 打破投资论点的触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 基础设施不稳定持续
        - 2026 年 CoreWeave / Horizon 问题后，没有可信替代方案或稳定算力计划
        - 资本强度从可管理风险变成长期压制因素
        - 在修复前，从继续研究转为回避
      - - 客户证据仍然狭窄
        - 下一次更新仍缺少广泛的直接客户和留存证据
        - 削弱溢价楔子的投资论点
        - 套用集中度折价，并下调估值区间
      - - 经济性仍不透明
        - 融资预期上升时，仍没有 ARR、毛利率或烧钱披露
        - 后续估值上调更像投机，而不是业绩挣来的
        - 没有非公开数据就不为估值上调背书
      - - 既有厂商缩小治理差距
        - 赢单 / 输单证据显示，尽管 Poolside 主打主权部署，客户仍偏好捆绑替代方案
        - 护城河和定价权收缩
        - 下调倍数假设，并重新评估品类位置
      - - 监管或法律尽调反复成为阻碍
        - 多笔交易因 AI 治理、授权许可或信任问题放缓或失败
        - 合规变成增长税
        - 上调风险评级，并推迟投资决策
    notes: 这些触发器设计成可监控且和投资相关，而不是泛泛的经营指标。
