              不公开发布标价；公司卖的是专家带队的企业部署和定制基础设施配置。安全敏感客户中，这可以支撑更高合同额，但相对已经能嵌入现有平台合同落地的既有厂商，也带来分发劣势。切换成本同样不对称。已经标准化使用
              GitHub、GitLab、AWS、Google Cloud 或企业 IDE 的团队，最简单路径是在代码所在处加 AI。另一侧，开放标准和框架降低锁定：Continue 强调源代码受控检查和 BYOK
              弹性，Poolside 自己也推广 ACP 兼容与 OpenAI 兼容 API。由此形成的市场结构鼓励多宿主和试验，削弱任何纯功能型护城河的持久性。
