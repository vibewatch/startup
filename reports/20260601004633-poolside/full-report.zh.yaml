      - number: '7.3'
        title: 合作伙伴、资本与执行风险
        blocks:
          - type: paragraph
            body: >-
              最大的投资风险不在于 Poolside 有没有有趣技术，而在于公司能否执行一个极其雄心勃勃的运营模型，同时不把自己拉得过长。这个风险在算力和基础设施叙事里最清楚。Poolside 将 Horizon 园区逻辑与
              CoreWeave、超过 40,000 块 GPU、250MW 首期，以及预留扩建能力绑定。DatacenterDynamics 和 Yahoo Finance 后来报道称交易已破裂，Poolside
              正在寻找新伙伴，风险画像因此从激进但线性变成激进且不确定。即便没有 Horizon，业务仍依赖 AWS 的采购和部署杠杆、Redpanda
              提供更广企业数据连接，以及少数安全环境伙伴贡献可引用质量。品类压力让问题更重。GitHub、Claude Code、Amazon Q、Gemini Code Assist、GitLab Duo 和
              Sourcegraph Cody 都在快速迭代，其中一些已经嵌在客户信任的平台里。这让 Poolside 陷入双重约束：既要按前沿速度执行，又要证明差异化部署模型能扛住捆绑竞争。若执行滑坡，即使客户私下更喜欢
              Poolside 的主权叙事，也可能默认选择更安全的既有厂商。
