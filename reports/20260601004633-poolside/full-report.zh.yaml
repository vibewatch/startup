      - number: '8.4'
        title: 最终尽调问题与投资逻辑击穿标准
        blocks:
          - type: paragraph
            body: >-
              最终尽调清单异常集中，因为估值问题很大程度上收缩到少数缺失事实。第一，投资人需要当前 ARR
              或已确认收入、毛利率，以及烧钱速度或现金跑道。第二，需要超越伙伴引述和生态验证的直接客户与留存证据。第三，需要弄清基础设施雄心现在是否需要超过核心软件故事所能承载的资金。第四，需要知道公司能否在盈利前提下，对抗已披露经济性更多的既有厂商和高速增长智能体初创公司。若出现三件事之一，投资逻辑就被击穿：基础设施执行风险加深；客户质量仍窄且未经证明；或证据显示治理和主权部署已不再带来更高支付意愿。在这些问题回答之前，理性的立场是把公司留在可投资范围内，但对每一个乐观假设都明码标价。
