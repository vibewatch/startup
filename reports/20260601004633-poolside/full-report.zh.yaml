  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与信任风险
        blocks:
          - type: paragraph
            body: >-
              Poolside 的目标客户把公司推到了市场里合规最敏感的地带。政府和企业页面承诺：为高影响场景提供可信、主权 AI。这既是商业优势，也是会招来审视的承诺。外部治理信号现在指向同一件事：可信 AI
              需要明确的风险管理、安全部署，以及谨慎的对外表述。欧盟委员会关于 AI 的材料把 AI Act 描述为基于风险的框架，并为开发者和部署方提供落地支持。NIST 的 AI 风险管理框架和生成式 AI
              概要要求组织把可信性嵌入设计、部署和评估。CISA 指引明确要求谨慎采用智能体 AI 服务，安全部署外部开发的 AI 系统，并共享 AI 相关网络安全问题信息。法律风险与监管风险并列存在。关于 GitHub
              Copilot 诉讼的公开法律分析说明，AI 编程供应商仍会暴露在代码所有权、许可、署名和开源合规争议之下。Poolside
              使用编程模型、智能体工作流、开放权重版本，以及企业软件产出，因此不能把这些问题当成别人的麻烦。即便法律风险先落到另一家供应商身上，买方也会要求 Poolside 证明自身治理和许可立场。
