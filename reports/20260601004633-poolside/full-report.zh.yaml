            body: >-
              支持 Poolside
              的最强论点，是主权部署与托管编码助手在结构上确实不同。如果客户真正要求没有第三方依赖、拥有完整模型权重、隔离执行、审计轨迹和前置部署工程师，那么对手集合会显著收窄。但竞争风险在于，市场其他玩家正以低得多的采用成本，逼近“足够治理、足够智能体控制、足够企业管理”。打包型厂商已经控制身份、源代码、CI、云账单或生产力入口；日常采购中，这种分发权比基准分数差异更重要。调查也说明市场为什么容易商品化：采用率高、信任较低，开发者会在方便的地方使用
