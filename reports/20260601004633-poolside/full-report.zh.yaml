        title: 成本结构与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据中，成本栈比收入栈更容易看见。Poolside 反复描述前沿训练运营：大规模 GPU 使用、PB 级数据系统、数百万合成任务，以及用于训练、评估和代码执行的专用基础设施。AWS 合作提到从寻找 1,000
              块 GPU 进展到运营 10,000 块 GPU 集群；Titan 和 Model Factory 文章讨论 10K H200 集群、自动化实验和数千个 GPU 工作负载；多个工程岗位提到万亿级
              tokens、数百 TB 到多 PB 数据系统，以及对预训练、后训练、评估和客户运营的专门支持。这些信号意味着，与纯按席位收费的开发者工具相比，Poolside
              的收入成本和运营费用基数显著更高。与此同时，FDRE 和支持岗位的存在说明服务交付成本可能压低近期毛利率，同时改善复杂客户中的采用。换句话说，Poolside
              未来或许能赚到软件式利润率，但今天的公开证据指向的是一种混合模式，仍背着显著算力、支持和实施负载。
