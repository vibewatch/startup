            body: >-
              正确的财务结论是好坏参半。正面看，Poolside 似乎能把高价值产品卖给能够承受长周期、并愿意为安全、主权和实施付费的客户。AWS 渠道可能缩短采购，公共部门和 FDRE
              动作也支持大合同而非低价席位的想法。但这家公司还不能像成熟软件公司一样承销。公开材料没有 ARR、收入运行率、毛利率、现金余额、现金消耗、NRR 或客户集中度披露。GitLab
              这样的公开可比公司能在年报里展示收入、毛利率、净留存和客户分组；Poolside 不能。这个披露缺口尤其重要，因为考虑到模型训练、推理、支持和基础设施野心，Poolside
              的成本基数几乎肯定高于传统开发者软件厂商。因此，投资人需要拆开两个问题：第一，公司能否持续融资；第二，公司能否在下一次重大融资变得必要之前，跑出软件式单位经济性。证据清楚支持第一个问题，尚不支持第二个。
