      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              融资记录说明 Poolside 能拿到资本，但尚不能证明自给自足。官方和独立来源一致指向 2024 年 10 月 $500 million Series B，估值约 $3 billion，已披露融资总额约
              $626 million。之后 Poolside 放大了野心：AWS 既成为渠道又成为算力伙伴；Phil Drury 加入担任首席投资官；Project Horizon 提出西得克萨斯 2GW
              园区论点；CoreWeave 合作加入超过 40,000 块 GPU、250MW 一期和 500MW 预留扩容选项。这些公告给出一个明显解读：管理层正在为远超普通软件创业公司的融资画像做准备。Sacra 报道
              2025 年之后一轮目标为 $2 billion、估值 $12 billion 的融资，这符合资本密集叙事，但不构成已关闭轮次。DatacenterDynamics 和 Yahoo Finance 2026
              年春季的不利报道很重要，因为它削弱了资本故事最顺滑的版本。如果 Horizon 或 CoreWeave 安排滑坡，Poolside
              可能仍需要同等规模资本，却少了伙伴确定性，多了执行风险。公开材料没有披露账上现金、月度现金消耗、可支撑期限、债务或有约束力的项目融资义务，因此关键承销问题仍未解决。
