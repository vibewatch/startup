chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与部署模式
        blocks:
          - type: paragraph
            body: >-
              Poolside 把自己定位为一家前沿 AI
              实验室，构建从软件工程切入、再延展到更广泛运营智能的基础模型、智能体和企业系统。公司当前网站强调全栈供给：自研模型、CLI/IDE/web/无头模式下的开发者界面、管理控制台，以及覆盖
              VPC、本地、隔离和涉密环境的部署选择。这个定位很关键，因为 Poolside
              没有走大宗编码助手常用的大众市场、浏览器优先路线。公开材料反复把主权部署、策略治理下的智能体、可追踪性和嵌入式前置部署工程师描述为商业切入点。TechCrunch 2024 年 10
              月的报道也强化了同样的市场选择：客户主要是 Global 2000 企业和公共部门机构，而不是自助式开发者。GitHub 材料还显示，Poolside 现在借开源 `pool`
              编码智能体公开了部分产品栈，说明它的交付模式越来越混合：一边是封闭企业部署，一边是面向开发者的工具和生态接口。
