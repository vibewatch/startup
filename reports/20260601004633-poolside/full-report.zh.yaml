      - number: '7.2'
        title: 运营、安全与质量风险
        blocks:
          - type: paragraph
            body: >-
              运营风险写在 Poolside 架构里。公司交付的不是静态编程插件，而是能运行工具、编辑文件、访问数据，并在敏感企业或任务环境中工作的智能体系统。Poolside
              自身材料强调容器化沙箱、显式权限、轨迹日志、密钥管理、网络控制和集中化策略执行等缓释措施，这说明管理层理解问题所在。但正因为需要这些控制，风险信号也更清楚。OWASP 的 GenAI
              安全指引把提示注入、不安全输出处理、训练数据投毒、模型拒绝服务、供应链漏洞和敏感信息泄露列为 LLM 应用的核心失效模式。CISA 的 AI 指引同样强调安全采用和部署智能体系统。Poolside 的支持工程和
              FDRE 岗位显示，真实部署横跨 API 集成、系统配置、性能问题、本地安装和安全运营。数据平台和 Model Factory
              文章又加了一层风险：大规模训练、评估和代码执行系统，即使客户还没接触，也可能先在运营上失效。简言之，Poolside 按安全和可靠性做了设计，但它也正把产品卖进任何质量故障都会被放大的环境。
