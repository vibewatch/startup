            body: >-
              最强具名证明集由伙伴牵引。Poolside 政府页直接引用 Vibrint、Sterling Computers 和 Hunted Labs，它们都把 Poolside
              描述为适合高安全或公共部门用例。这些引用比匿名客户标识更有意义，因为它们说清了客户或伙伴看重什么：安全敏感部署、隔离运行，以及任务或一线作战人员支持。伙伴网站进一步证明这些组织与国家安全、联邦或软件供应链工作一致，引用因此显得连贯，而非随机。但证明集仍有限。这些并未清楚披露为大规模生产中的终端客户标识，也没有量化
              ROI；公开材料没有说明实际部署 Poolside 的组织数量、试点和生产各有多少、初始上线之后续约了多少。品类背景有利——调查显示 AI
