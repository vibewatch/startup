      - number: '1.2'
        title: 创始人、领导层、业务足迹与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Poolside 由 Jason Warner 和 Eiso Kant 在 2023 年创立。两位创始人此前都深度参与过开发者工具，经历并不常见。Warner 曾任 GitHub CTO，也在 Canonical
              和 Heroku 领导过工程组织；TechCrunch 和 Tech Funding News 都把这段背景放在 Poolside 论点的核心，因为 Warner 离开前曾帮助孵化 GitHub
              Copilot，之后出来打造一个垂直整合替代方案。Kant 过去做过开发者分析和软件工程创业，支撑了公司的产品和数据取向。领导层已不止两位创始人：2025 年 7 月，Poolside 聘请前 Citigroup
              全球科技投行业务负责人 Phil Drury
              担任首任首席投资官，说明融资和基础设施结构设计已从后台事务升为战略职能。公开治理可见度仍然很薄。公司披露了高管、招聘领域和公共部门运营结构，但公开材料没有披露董事会构成、投票控制或详细投资人权利。招聘信息提供了一个有用的地理线索：Poolside
              称公司创立于美国，“家”也在美国，并在欧洲和北美运营分布式团队，定期在巴黎会面。
