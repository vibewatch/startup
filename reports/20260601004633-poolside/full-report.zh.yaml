      - number: '2.2'
        title: 规模视角：大品类增长与 Poolside 对口支出
        blocks:
          - type: paragraph
            body: >-
              公开规模数据支持一个有利品类，但无法给出单一清晰 TAM。Grand View Research 估算，AI 代码工具市场 2023 年为 $4.86 billion，到 2030 年达 $26.03
              billion。Polaris 给出相近的工具层口径：2024 年 $4.91 billion，2032 年 $27.17 billion。MarketsandMarkets 发布的工具市场更保守，2023 年
              $4.3 billion，2028 年增至 $12.6 billion。在更宽口径上，Polaris 和 MarketsandMarkets 都发布了更大的编码助手品类，到 2032 年约 $127-138
              billion。正确结论不是把这些数字盲目平均，而是把它们当成一组嵌套视角：狭义代码工具、更宽的编码助手，以及 Poolside 明确瞄准、更窄的主权企业切片。需求侧证据也说明用户基数足够大：BLS 统计
              2024 年美国软件开发者、QA 和测试岗位为 1.9 million，十年增速为 15%；Stack Overflow 和 GitHub 调查则显示，开发者试用 AI 编码工具已经进入主流。Poolside
              可变现机会落在这些采用趋势与严格安全、治理要求的交集。
