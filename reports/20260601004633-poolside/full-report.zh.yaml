      - number: '7.4'
        title: 缓释、监控与投资逻辑击穿触发点
        blocks:
          - type: paragraph
            body: >-
              Poolside 并未无视这些风险。它自己的产品和技术材料展示的是一家在建设明确缓释措施的公司：沙箱、权限、轨迹、不拿客户数据训练的定位、边界内部署、Redpanda
              最小权限控制，以及深度嵌入的部署团队。这些措施能降低部分风险，但不能替代验证。最关键的问题是，缓释措施扩展速度是否快过风险面扩张。若主权部署仍然困难，而既有厂商仍以托管优先，Poolside
              的控制能力可能成为真正护城河。反过来，若既有厂商补上足够好的治理和私有部署选项，而 Poolside
              在合作伙伴或基础设施执行上吃力，同一套控制就会从优势变成标配。投资人应盯住一小组击穿标准：算力或数据中心计划再次不稳；出现可信的安全或智能体质量事故；无法把伙伴主导的参考案例转化为更广泛的直接客户证明；或者监管和法律尽调反复卡住采购。只有技术和运营纪律随产品能力一起复利，风险叙事才可管理。
