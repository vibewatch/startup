companyProfile:
  summary: >-
    Poolside 是一家 AI 公司，Jason Warner 和 Eiso Kant 于 2023 年 4
    月在旧金山创立，瞄准失误代价很高的软件工程环境。公开材料反复强调主权部署、完整模型权重交付、智能体编排，以及面向企业和公共部门买家的前置部署实施团队；这些客户不能只依赖云端编码助手。公司 2024 年 10 月完成 $500
    million Series B，估值约 $3 billion，之后又借 AWS、CoreWeave、Project Horizon 和 Poolside Federal，把叙事延伸到基础设施和公共部门渠道。
