- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Infrastructure execution risk
    - Compute-partner instability persists
    - Further public evidence of major partner unwind or delayed replacement plan
    - Re-underwrite delivery timelines and capital needs
  - - Security / agent quality risk
    - Serious customer-facing incident or public vulnerability disclosure
    - Any credible incident affecting sensitive environments
    - Pause bullish assumptions on trust moat until mitigations are verified
  - - Regulatory / legal friction
    - Procurement repeatedly stalls on compliance or licensing questions
    - Multiple lost deals or delayed deals due to AI Act, IP, or attribution concerns
    - Treat compliance as growth limiter rather than manageable checkbox
  - - Partner-led proof concentration
    - No broadening of reference set
    - Public proof remains limited to the same few partners over next refresh cycle
    - Increase concentration discount in valuation and customer-quality underwriting
  - - Bundled incumbent displacement
    - Customers accept good-enough governance from incumbents
    - Win-loss data shifts against Poolside in regulated or security-sensitive accounts
    - Reduce moat assumptions and revisit product differentiation thesis
  - - Human-heavy deployment burden
    - FDRE and support load scales faster than accounts
    - Growing services burden without commensurate product leverage
    - Lower margin assumptions and increase execution risk weighting
  notes: Kill criteria focus on monitorable signals that would change the investment thesis rather than generic operational noise.
