  figureRefs:
  - FR002
- id: partner-capital-and-execution-risk
  title: Partner, capital, and execution risk
  body: |-
    The biggest investment risk is not whether Poolside has interesting technology; it is whether the company can execute a very ambitious operating model without overextending itself. That risk shows up most clearly in the compute and infrastructure story. Poolside linked its Horizon campus thesis to CoreWeave, more than 40,000 GPUs, a 250MW first phase, and reserved expansion capacity. DatacenterDynamics and Yahoo Finance later reported that the deal had fallen apart and Poolside was seeking new partners, changing the risk profile from aggressive-but-linear to aggressive-and-uncertain. Even without Horizon, the business still depends on AWS for procurement and deployment leverage, on Redpanda for broader enterprise data connectivity, and on a small set of secure-environment partners for reference quality. Category pressure compounds the problem. GitHub, Claude Code, Amazon Q, Gemini Code Assist, GitLab Duo, and Sourcegraph Cody all continue to evolve rapidly, and some sit inside platforms customers already trust. That means Poolside faces a double bind: it needs to execute at frontier speed while also proving that its differentiated deployment model can outlast bundled competition. If execution slips, customers may default to safer incumbents even if they privately prefer Poolside's sovereignty story.
  claimRefs:
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
