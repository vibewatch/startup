company:
  name: Poolside
chapter:
  number: 7
  title: Risks
  summary: |-
    Poolside's biggest risks cluster around execution, dependence, and governance rather than a single existential flaw. The company is building a sovereign, agentic coding platform for the hardest environments, which raises the bar on security, reliability, regulatory readiness, and delivery discipline while also creating dependence on scarce talent, compute partners, and careful claims management. The most material single risk remains execution around infrastructure and partner dependence after the 2026 reporting that the CoreWeave/Horizon relationship had broken down. Around that sit second-order risks: legal uncertainty around AI-generated code and licensing, agentic security vulnerabilities, public-sector procurement friction, and the possibility that bundled incumbents make governance features good enough before Poolside's sovereign wedge scales.
sections:
- id: regulatory-legal-and-trust-risk
  title: Regulatory, legal, and trust risk
  body: |-
    Poolside's target customers push it into the most compliance-sensitive parts of the market. The government and enterprise pages promise trustworthy, sovereign AI for high-consequence work, which is a commercial advantage but also a promise that attracts scrutiny. External governance signals now point in one direction: trustworthy AI needs explicit risk management, secure deployment, and careful claims discipline. The European Commission's AI materials describe the AI Act as a risk-based framework with implementation support for developers and deployers. NIST's AI Risk Management Framework and generative-AI profile push organizations to incorporate trustworthiness into design, deployment, and evaluation. CISA guidance explicitly calls for careful adoption of agentic AI services, secure deployment of externally developed AI systems, and information-sharing on AI-related cybersecurity issues. Legal risk sits beside regulatory risk. Accessible legal analysis of the GitHub Copilot litigation shows why AI coding vendors remain exposed to code-ownership, licensing, attribution, and open-source-compliance arguments. Poolside's use of coding models, agentic workflows, open-weight releases, and enterprise software outputs means it cannot treat these questions as someone else's problem. Even if legal exposure lands first on another vendor, buyers will ask Poolside to prove its governance and licensing posture.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-security-and-quality-risk
  title: Operational, security, and quality risk
  body: |-
    Operational risk is inherent to Poolside's architecture. The company is not shipping a static coding plugin; it is shipping agentic systems that can run tools, edit files, access data, and operate in sensitive enterprise or mission environments. Poolside's own materials emphasize mitigations such as containerized sandboxes, explicit permissions, trajectory logging, secret management, network controls, and centralized policy enforcement, which is good evidence that management understands the problem. But the need for these controls is itself the risk signal. OWASP's GenAI security guidance highlights prompt injection, insecure output handling, training-data poisoning, model denial of service, supply-chain vulnerabilities, and sensitive-information disclosure as core failure modes for LLM applications. CISA's AI guidance similarly stresses secure adoption and deployment of agentic systems. Poolside's support-engineering and FDRE roles show that real deployments span API integration, system configuration, performance issues, on-prem installs, and secure operations. The data-platform and Model Factory posts add another layer: high-scale training, evaluation, and code execution systems can fail operationally even before a customer ever touches them. In short, Poolside has designed for security and reliability, but it is also selling into the exact environments where any quality failure is magnified.
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
