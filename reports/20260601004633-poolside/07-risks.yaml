- id: mitigations-and-thesis-breakers
  title: Mitigations, monitoring, and thesis-break triggers
  body: |-
    Poolside is not blind to these risks. Its own product and technical materials show a company building explicit mitigations: sandboxes, permissions, trajectories, no-customer-data-training positioning, inside-boundary deployment, Redpanda least-privilege controls, and deeply integrated deployment teams. Those mitigations reduce some risks, but they do not eliminate the need for verification. The most important question is whether the mitigations scale faster than the risk surface. If sovereign deployment remains hard and incumbents remain hosted-first, Poolside's controls may become a true moat. If, instead, incumbents add good-enough governance and private-deployment options while Poolside struggles with partner or infrastructure execution, then the same controls become table stakes rather than advantage. Investors should therefore watch a small set of kill criteria: renewed instability in compute or data-center plans, credible security or agent-quality incidents, failure to convert partner-led references into broader direct customer proof, or evidence that regulatory and legal diligence becomes a recurring blocker in procurement. The risk story is manageable only if technical and operational discipline continue to compound alongside product capability.
  claimRefs:
  - CR034
  - CR035
  - CR036
  - CR037
