- id: customer-verdict-and-blockers
  title: Customer verdict and diligence blockers
  body: |-
    The customer verdict is directionally positive but still incomplete. Poolside has credible references in exactly the environments where its product should work best: secure compute, public-sector missions, and organizations that care deeply about deployment control. Those references are not generic name-drops; they talk about air-gapped development, warfighter readiness, secure software supply chains, and mission reliability. That fit strengthens the case that Poolside can win high-consequence accounts. But investors should be careful not to overread the proof. The named references appear to be partners, integrators, or ecosystem participants rather than a broad roster of direct commercial production customers. Public materials do not resolve deployment count, revenue concentration, renewal durability, or whether customer satisfaction survives once the novelty of the product wears off. The adverse Horizon/CoreWeave reporting adds another subtle customer risk: infrastructure uncertainty can weaken confidence in long-term delivery promises, especially for buyers evaluating sovereign or high-scale deployments. The next diligence step is therefore straightforward - replace partner-led validation with direct customer and retention evidence.
  claimRefs:
  - CU031
  - CU032
  - CU033
  - CU034
