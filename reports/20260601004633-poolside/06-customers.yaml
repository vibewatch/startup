- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / strategic value
  - Gap
  rows:
  - - Public sector / defense
    - Buyer = program owner / security lead; user = engineers; payer = mission or procurement budget
    - Classified, disconnected, sovereign software development
    - Best-fit segment with strongest public proof
    - No aggregate contract count or agency list disclosed
  - - Regulated enterprises
    - Buyer = CTO/CISO/platform; user = developers; payer = central engineering or infrastructure budget
    - Secure coding AI inside customer boundary
    - Strategically important but not heavily logo-disclosed
    - No named commercial bank or healthcare production logos in fetched sources
  - - Global 2000 engineering organizations
    - Buyer = platform / CTO; user = engineering teams; payer = enterprise software or cloud budget
    - Large-scale software-engineering productivity and governance
    - Large ACV potential, especially via AWS route
    - No disclosed deployment count or expansion math
  - - Channel / integrator ecosystem
    - Buyer = partner leadership; user = partner teams and joint end-customers; payer = partner or combined procurement path
    - Public-sector delivery, solution bundling, secure environments
    - Important route to market and proof generation
    - Can blur direct-customer versus partner dependence
  - - Developer user layer
    - Buyer differs from user; users remain engineers in IDE/CLI/workflow
    - Coding assistance, agentic pipelines, secure software delivery
    - Critical for adoption and expansion inside accounts
    - Public developer-seat or daily-usage counts are absent
  notes: Segmentation is organized around buying motion and security posture rather than raw employee count because that is how Poolside appears to go to market.
