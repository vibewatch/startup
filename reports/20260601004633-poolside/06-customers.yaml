- id: retention-expansion-and-concentration
  title: Retention, expansion, and concentration risk
  body: |-
    Public evidence on retention is mostly absence, not proof. There is no disclosed NRR, GRR, churn, contract length, renewal rate, cohort behavior, or customer satisfaction dataset. That does not mean customer quality is weak, but it does mean the market cannot yet distinguish durable platform adoption from early lighthouse deployments. The best-supported expansion logic is qualitative. Poolside's government and platform materials suggest a land-and-expand motion: start with a secure software-engineering use case, embed FDREs and solution architects, then broaden into additional repositories, teams, data-connected agent workflows, and potentially broader knowledge-work automation via Redpanda. AWS procurement can also lower friction for later enterprise accounts by letting buyers consume Poolside through an existing vendor relationship. The flip side is concentration risk. A thin public proof set implies that a small number of important references may be carrying a disproportionate amount of the company narrative. Partner dependence also matters. If a meaningful share of deployment or customer access depends on AWS, public-sector integrators, or a narrow secure-environment ecosystem, then concentration exists even if no single end customer is named as dominant.
  claimRefs:
  - CU021
  - CU022
  - CU023
