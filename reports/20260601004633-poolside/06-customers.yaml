- id: named-proof-and-adoption-trajectory
  title: Named proof and adoption trajectory
  body: |-
    The strongest named proof set is partner-led. Poolside's government page quotes Vibrint, Sterling Computers, and Hunted Labs directly, each describing Poolside as viable for highly secure or public-sector use cases. Those quotes are more meaningful than anonymous logos because they specify what customers or partners value: security-sensitive deployment, air-gapped operation, and mission or warfighter support. The partner websites reinforce that these organizations are aligned with national security, federal, or software-supply-chain work, which makes the references coherent rather than random. But the proof set still has limitations. These are not clearly disclosed as large production end-customer logos with measured ROI, and the public materials do not state how many organizations have actually deployed Poolside, how many are pilots versus production, or how many renewed after initial rollout. The category backdrop is favorable - surveys show AI coding-tool usage is already mainstream among developers - yet those same surveys show trust and agent adoption lag behind experimentation. That gap matters because Poolside's product is aimed at the hardest environments, where moving from curiosity to production requires more than developer enthusiasm.
