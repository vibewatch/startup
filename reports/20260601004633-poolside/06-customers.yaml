- id: TU006
  title: Procurement friction and evidence-gap table
  columns:
  - Topic
  - Current evidence
  - Why it matters
  - Next diligence step
  rows:
  - - Security review burden
    - Poolside materials emphasize boundary control, auditability, and air-gap support
    - Likely extends sales cycle but also creates moat in qualified accounts
    - Request average security-review cycle time by segment
  - - Pilot-to-production conversion
    - No public conversion statistics
    - Determines whether strong demos become durable accounts
    - Request conversion funnel and time-to-production
  - - Infrastructure confidence after Horizon uncertainty
    - Adverse 2026 reports create delivery doubt for some large accounts
    - Could slow customer trust in long-term scale commitments
    - Request current infrastructure roadmap and account communications
  - - Direct customer versus partner revenue mix
    - Named proof is partner-led
    - Important for margin quality and concentration analysis
    - Request revenue split by direct, channel, and services-led accounts
  - - Retention proof
    - No public renewal or cohort data
    - Without it, customer durability is conjecture
    - Request renewals, expansions, and churn data
  - - Named commercial logos outside secure/public-sector ecosystem
    - Very limited in fetched sources
    - Needed to prove broader market repeatability
    - Request commercial reference calls and deployment examples
  notes: This table is the operational checklist for turning partner-led proof into a true customer-quality underwriting file.
