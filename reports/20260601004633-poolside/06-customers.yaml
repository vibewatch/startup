company:
  name: Poolside
chapter:
  number: 6
  title: Customers
  summary: |-
    Poolside's public customer evidence is strongest in secure and public-sector-adjacent environments and weakest on aggregate commercial scale. The most concrete proof is a partner-led trio of testimonials from Vibrint, Sterling Computers, and Hunted Labs, all centered on secure compute, federal missions, or software-supply-chain contexts, plus an AWS channel path that can lower procurement friction for large enterprises. What remains absent are the metrics investors usually want most: customer count, deployment count, renewal and churn data, NRR/GRR, contract duration, and direct end-customer logos outside the partner ecosystem. The result is a plausible high-value wedge in security-sensitive accounts, but a customer-quality story that still depends more on partner references and workflow fit than on disclosed retention evidence.
sections:
- id: segments-and-buyers
  title: Customer segmentation by buyer, user, and environment
  body: |-
    Poolside's customer story is segmented more by security posture and buying structure than by generic company size. The user is still the software engineer or technical operator, but the buyer and payer often move upward to platform engineering, the CTO, the CISO, a public-sector program owner, or a cloud procurement function. Poolside's government page is explicit that the company is purpose-built for classified, disconnected, and sovereign environments, while the enterprise and platform materials frame the product as a controlled AI stack for organizations that cannot accept hosted-only copilots. Sacra adds an outside interpretation that Poolside focuses on large organizations such as major banks, defense contractors, and companies with thousands of developers. The AWS partnership matters here because it creates an alternate payer path: enterprises can contract through AWS terms and use committed cloud budgets. In customer terms, Poolside is not solving for the broadest developer population. It is solving for accounts where security requirements and internal governance are so important that a central buyer is willing to sponsor a more complex deployment motion.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
