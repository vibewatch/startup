- id: buyers-and-adoption-path
  title: Buyer, user, and payer segmentation
  body: 'The market now spans multiple buying motions. For mass-market copilots, the user and buyer can both be an individual developer. For tools like GitHub Copilot, Cursor, Claude Code, Amazon Q Developer, Gemini Code Assist, and GitLab Duo, the buyer expands to engineering managers, platform teams, or central IT once usage moves beyond experimentation. Poolside pushes that logic further toward top-down enterprise buying: the end user is still the developer, but the economic buyer is often a CTO, platform engineering leader, CISO, or public-sector program owner because deployment architecture, model weights, and governance are part of the product. Survey evidence supports this segmentation. Developers are eager to use AI tools, but organizational approval, policy, and procurement still mediate scaled rollout. Poolside''s SAM therefore depends less on the raw number of developers than on the count of organizations with enough engineering scale and enough security sensitivity to justify
    custom deployment, FDRE support, and budgeted infrastructure. The adoption path looks like pilot workflow proof, then security and architecture review, then procurement and embedded deployment, and finally expansion into broader software-delivery processes.'
