chapter:
  number: 2
  title: Market Analysis
  summary: Poolside is not chasing the full generative-AI market; it is pursuing the narrower but higher-value slice where software engineering AI must satisfy governance, security, and sovereign deployment requirements. Public market estimates for AI coding range from roughly $4-5 billion current revenue pools to $127-138 billion long-term assistant categories depending on definition, while developer surveys already show near-ubiquitous experimentation and much weaker trust, governance, and deployment readiness. That combination supports a strong market backdrop but argues for a disciplined definition of Poolside's monetizable SAM.
sections:
- id: market-boundary
  title: 'Market boundary: what Poolside is actually selling into'
  body: 'Poolside''s relevant market is best defined as AI software engineering systems sold into organizations that care about developer productivity, code quality, governance, and data control. That is narrower than generic generative AI or all AI development tools. Poolside''s own enterprise and government pages emphasize full-stack model deployment, agent orchestration, audit trails, and operation inside customer boundaries. Those attributes place it closer to enterprise coding platforms, developer-security workflows, and mission-critical software automation than to consumer chatbots or broad office copilots. Market-research vendors also disagree on category scope: some count code tools only, others count much broader coding assistants or services, and others bundle adjacent infrastructure, consulting, or non-engineering AI-development software. For diligence, the included spend should cover seat subscriptions, API usage, orchestration/control layers, and implementation services tied
    directly to software engineering outcomes. Excluded spend should cover raw GPU infrastructure, generic LLM chat, low-code/no-code tools outside engineering workflows, and horizontal productivity copilots that do not solve secure software-delivery problems.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM022
  - CM023
  - CM026
  - CM039
  - CM040
  tableRefs:
