callouts:
- calloutType: insight
  title: Poolside wins or loses on market definition
  body: If the investment committee benchmarks Poolside against the full $100B+ coding-assistant narrative, the opportunity looks enormous but too abstract. If it benchmarks Poolside against the narrower sovereign-enterprise slice, the market is smaller but better aligned with the company's differentiated deployment model.
  claimRefs:
  - CM009
  - CM022
  - CM023
  - CM039
  - CM040
- calloutType: risk
  title: Adoption is not the same as trust
  body: Developer usage is already mainstream, but Stack Overflow and GitHub both show that sanctioning, trust, and governance still lag. Poolside's go-to-market assumes buyers with the most trust friction will buy first.
  claimRefs:
  - CM012
  - CM013
  - CM015
  - CM016
  - CM021
  - CM035
- calloutType: strength
  title: Regulated demand favors sovereign deployment vendors
  body: Where air-gap, on-prem, and data-boundary requirements matter, buyers cannot simply choose the cheapest cloud copilot. That creates a structurally better niche for Poolside than the raw seat-pricing race suggests.
  claimRefs:
  - CM023
  - CM024
  - CM026
  - CM036
  - CM039
