  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-definition-conflict TM002
    missingEvidence: A standardized market map separating code tools, coding assistants, services, and sovereign enterprise AI software spend.
    whyItMatters: Valuation sensitivity changes dramatically depending on whether Poolside is benchmarked against tools-only or broader assistant categories.
    diligencePath: Request third-party expert calls plus management's internal TAM build with customer-count and ACV assumptions.
    relatedQuestionRefs:
    - QM006
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: poolside-sam TM003
    missingEvidence: A public or private estimate for the number of regulated enterprises, agencies, and public-sector teams willing to buy sovereign coding AI at Poolside's likely ACV.
    whyItMatters: Poolside's opportunity is defined by a narrower slice than the generic market reports quantify.
    diligencePath: Build a bottoms-up SAM from target-account counts, developer-seat density, and conversion assumptions.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: pilot-conversion
    missingEvidence: Actual conversion rates from developer experimentation or small pilots into production, budgeted enterprise contracts.
    whyItMatters: The market appears large at the top of funnel, but valuation depends on how often experimentation becomes durable spend.
    diligencePath: 'Request funnel metrics: evals, pilots, conversions, average deployment time, and expansion rates.'
    relatedQuestionRefs:
    - QM025
  - type: stale
    severity: minor
    topic: survey-vintage
    missingEvidence: A 2026 cross-market survey directly measuring enterprise buying behavior for AI coding agents rather than only usage sentiment.
    whyItMatters: The current public survey base is strong on developer behavior but weaker on hard procurement and budget formation.
    diligencePath: Supplement with 2026 CIO / platform-engineering buyer interviews or proprietary survey work.
    relatedQuestionRefs:
    - QM009
    - QM025
