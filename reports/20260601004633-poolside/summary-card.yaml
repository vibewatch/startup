  headline: >-
    Poolside has a credible sovereign-enterprise product thesis and meaningful upside if secure coding AI becomes a
    durable high-ACV category, but public evidence is still too thin on revenue quality, customer proof, and
    infrastructure execution to support an aggressive buy recommendation.
