company:
  name: Poolside
chapter:
  number: 1
  title: Company Overview
  summary: |-
    Poolside is a 2023-founded AI software engineering company led by former GitHub CTO Jason Warner and Eiso Kant, selling sovereign, enterprise-first coding models, agents, and deployment infrastructure. Public evidence supports a $500 million Series B at a roughly $3 billion valuation in October 2024 and a later 2025 push into vertically integrated infrastructure via Project Horizon, CoreWeave, and public-sector go-to-market. As of 2026-06-01, the strongest open questions are commercial scale, current valuation beyond 2024, and whether the 2025 Horizon expansion remained intact after April 2026 reports that the CoreWeave deal had fallen apart.
sections:
- id: identity-business-model
  title: Identity, positioning, and deployment model
  body: |-
    Poolside presents itself as a frontier AI lab building foundation models, agents, and enterprise systems that start with software engineering and then extend to broader operational intelligence. The company’s current website emphasizes a full-stack offer: proprietary models, developer surfaces in the CLI/IDE/web/headless modes, an administrative console, and deployment choices spanning VPC, on-prem, air-gapped, and classified environments. That positioning matters because Poolside is not pursuing the mass-market, browser-first path used by commodity coding copilots. Instead, the public materials repeatedly describe sovereign deployment, policy-governed agents, traceability, and embedded forward-deployed engineers as the commercial wedge. TechCrunch’s October 2024 reporting reinforces the same market choice by describing customers primarily as Global 2000 enterprises and public-sector agencies rather than self-serve developers. GitHub materials also show that Poolside now exposes part of its product stack publicly through the open-source `pool` coding agent, suggesting that its delivery model increasingly mixes closed enterprise deployments with developer-facing tooling and ecosystem hooks.
