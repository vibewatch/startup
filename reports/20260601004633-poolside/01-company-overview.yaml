- id: funding-investors-infrastructure
  title: Funding history, investors, and infrastructure ambition
  body: |-
    The clearest public funding event is Poolside’s October 2024 Series B: TechCrunch, Crunchbase News, Tech Funding News, and Sacra all point to a $500 million round at roughly a $3 billion valuation, bringing disclosed funding to about $626 million. Multiple independent sources identify Bain Capital Ventures as lead investor, while participant lists consistently include Nvidia, DST Global, StepStone Group, Citi Ventures, Felicis, and Redpoint among others. Official company language does not publish a full round memorandum, but Poolside’s own October 2024 post links the new capital directly to scaling its training cluster and go-to-market effort. By October 2025, the company had paired that capital story with a much more aggressive infrastructure story: Project Horizon, a planned 2GW AI campus in West Texas, and a compute partnership with CoreWeave for more than 40,000 NVIDIA GB300 NVL72 GPUs plus a 250MW first phase and 500MW reserved expansion option. Sacra also reported that Poolside was seeking a much larger financing round in late 2025, but the status of that round is not corroborated in fetched primary sources, so the higher valuation should be treated as an unclosed fundraising report rather than settled cap-table fact.
  claimRefs:
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
