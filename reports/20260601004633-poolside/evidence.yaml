evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance TO002 TO003
    missingEvidence: >-
      Board composition, voting control, liquidation preferences, and any special investor rights tied to the 2024
      Series B or later fundraising.
    whyItMatters: >-
      Poolside now pairs enterprise software with infrastructure financing; governance and downside protection matter
      much more than for a simple SaaS round.
    diligencePath: >-
      Request the current board deck, cap table, investor rights agreement, and any side letters tied to strategic
      investors.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: ARR, revenue mix, customer count, net retention, burn, and cash-on-hand.
    whyItMatters: >-
      Without operating metrics, the company overview cannot test whether Poolside’s late-stage narrative is supported
      by commercial scale.
    diligencePath: >-
      Request monthly KPI reporting, board materials, and audited or management financial statements for the last 12-18
      months.
    relatedQuestionRefs:
      - QO022
  - type: conflicting-data
    severity: material
    topic: current-valuation-status TO003
    missingEvidence: >-
      A primary-source confirmation of any post-2024 financing, valuation reset, or canceled round after the closed $3B
      Series B.
    whyItMatters: Late-stage entry discipline depends on distinguishing closed financing from press or analyst fundraising chatter.
    diligencePath: Obtain signed financing documents, investor allocation schedule, and a board-approved financing status memo.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: project-horizon-obligations TO004
    missingEvidence: >-
      Executed contract status, termination mechanics, and remaining obligations tied to CoreWeave, land, turbines, or
      power reservations.
    whyItMatters: >-
      If Horizon has slipped or been restructured, the company’s capital needs and strategic moat could change
      substantially.
    diligencePath: >-
      Request the signed CoreWeave agreement, land/power commitments, and any amendment or termination notices after
      April 2026.
    relatedQuestionRefs:
      - QO021
      - QO025
    relatedTableRefs:
      - TO004
