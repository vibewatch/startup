      Valuation sensitivity changes dramatically depending on whether Poolside is benchmarked against tools-only or
      broader assistant categories.
    diligencePath: Request third-party expert calls plus management's internal TAM build with customer-count and ACV assumptions.
    relatedQuestionRefs:
