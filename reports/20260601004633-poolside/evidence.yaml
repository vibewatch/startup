      buy sovereign coding AI at Poolside's likely ACV.
    whyItMatters: Poolside's opportunity is defined by a narrower slice than the generic market reports quantify.
    diligencePath: Build a bottoms-up SAM from target-account counts, developer-seat density, and conversion assumptions.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pilot-conversion
    missingEvidence: >-
      Actual conversion rates from developer experimentation or small pilots into production, budgeted enterprise
