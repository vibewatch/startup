company:
  name: Poolside
chapter:
  number: 5
  title: Product & Tech
  summary: |-
    Poolside's product stack is now much more concrete than it was at launch: proprietary coding models, a terminal and editor agent, a governance console, deployment options inside customer boundaries, and an internal training-and-orchestration system the company calls the Model Factory. The technical differentiation claim rests on three linked ideas: purpose-built coding models trained with reinforcement learning from code execution feedback, sovereign deployment with full model weights and auditability, and an operating architecture that spans data pipelines, distributed training, code execution, post-training, and enterprise control surfaces. The main caveat is maturity: the first public model-and-product release only arrived in 2026, so the architecture is richly described but still early in public market proof.
sections:
- id: product-surfaces-and-user-jobs
  title: Product surfaces and user workflow
  body: |-
    Poolside now sells a complete software-engineering workflow rather than a single model endpoint. The products page shows four usage surfaces - CLI, IDE, web, and headless automation - while the public `pool` agent adds concrete implementation detail: interactive terminal use, ACP server and client modes, non-interactive execution, slash commands, file search, shell mode, permissions modes, and support for AGENTS.md, skills, MCP, and ACP. The enterprise and platform pages extend that developer surface into an admin and governance layer. Poolside positions the console as the operating plane where administrators define policies, control tool access, review trajectories, and export records. In customer-workflow terms, the product is not just code generation. It is a governed agent runtime designed to sit where developers already work while letting central teams inspect and constrain what the agent does. That is why the real buyer is often the platform, security, or CTO function even though the end user is still an engineer. The public preview release of `pool` and Shimmer in 2026 finally turned this architecture from mostly narrative into something users can see and install.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  tableRefs:
