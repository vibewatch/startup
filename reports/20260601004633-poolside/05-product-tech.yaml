- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Data ingestion and curation
    - Pulls, filters, OCRs, and structures training inputs
    - Dagster, Spark, Iceberg, metadata pipelines
    - Data-quality errors or licensing mistakes degrade downstream models
  - - Data blending and streaming
    - Supplies datasets to training and fine-tuning workloads
    - Blender / data lake orchestration
    - Poor blending can distort model behavior
  - - Titan training stack
    - Distributed pre-training and training backbone
    - TorchTitan, PyTorch, Kubernetes, H200 clusters
    - Training-scale costs and complexity remain high
  - - Code execution environment
    - Runs repositories in secure, reproducible execution contexts for RLCEF
    - Saucer, OCI registry, containerization, task engine
    - Repository-build failure and infra reliability directly affect learning loops
  - - Evaluations system
    - Benchmarks base and instruction-following models on real software tasks
    - Automated evals and metrics dashboards
    - Benchmark drift or reward hacking can overstate progress
  - - Post-training workloads
    - SFT and RL specialization for coding agents
    - Model Factory orchestration and inference services
    - Capability improvements may be expensive to maintain
  - - Developer surfaces
    - CLI, IDE, web, and headless agent interfaces
    - pool, ACP, MCP, editor integrations
    - UI polish and workflow reliability must keep pace with model ambition
  - - Enterprise control plane
    - Policies, permissions, traces, auditability, and exportability
    - Console, sandboxing, secret management, network controls
    - Control claims need more external operational proof
  notes: The architecture table combines public product claims with internal systems described in Poolside's technical posts.
