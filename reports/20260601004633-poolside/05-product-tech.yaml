    - Need external longitudinal proof that RLCEF yields sustained customer advantage
  - - Enterprise data-connected agents
    - Teams struggle to connect agents safely to proprietary systems
    - Redpanda integration offers controlled access to 300+ data sources with observability
    - Potentially expands product from coding into broader enterprise work
