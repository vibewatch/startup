  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      The highest-severity cluster combines infrastructure execution, agentic security, and legal/compliance
      uncertainty.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Infrastructure / partner execution
          values:
            - label: high
              tone: warning
              detail: Adverse 2026 reporting already surfaced partner instability
            - label: critical
              tone: negative
              detail: Can affect delivery, capital, and customer confidence simultaneously
            - label: medium
              tone: neutral
              detail: Alternate paths may exist but are not yet proven
            - label: very high
              tone: negative
              detail: Still the single biggest residual risk
        - label: Agentic security / quality
          values:
            - label: high
              tone: warning
              detail: Agentic systems materially expand attack and failure surface
            - label: high
              tone: negative
              detail: Any serious incident in sensitive environments would be damaging
            - label: medium-high
              tone: positive
              detail: Poolside has meaningful built-in controls
            - label: high
              tone: warning
              detail: Controls reduce but do not remove exposure
        - label: Regulatory / legal
          values:
            - label: medium
              tone: neutral
              detail: Rules and litigation remain live but not catastrophic by default
            - label: high
              tone: warning
              detail: Can slow enterprise adoption and create contractual burden
            - label: medium
              tone: neutral
              detail: Frameworks and internal controls exist, external proof is thinner
            - label: medium-high
              tone: warning
              detail: Residual exposure persists until precedents and controls mature
        - label: Customer-proof concentration
          values:
            - label: medium-high
              tone: warning
              detail: Public proof remains narrow and partner-led
            - label: medium-high
              tone: warning
              detail: Can distort underwriting and slow broad-market trust
            - label: medium
              tone: neutral
              detail: Can improve if direct reference set broadens
            - label: medium-high
              tone: warning
              detail: Important but solvable with better disclosure
    approximationNotes: The heatmap is qualitative and prioritizes investment relevance, not actuarial probability.
    claimRefs:
      - CR006
      - CR012
      - CR023
      - CR024
      - CR030
      - CR039
