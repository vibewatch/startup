              Public evidence on retention is mostly absence, not proof. There is no disclosed NRR, GRR, churn, contract
              length, renewal rate, cohort behavior, or customer satisfaction dataset. That does not mean customer
              quality is weak, but it does mean the market cannot yet distinguish durable platform adoption from early
              lighthouse deployments. The best-supported expansion logic is qualitative. Poolside's government and
              platform materials suggest a land-and-expand motion: start with a secure software-engineering use case,
              embed FDREs and solution architects, then broaden into additional repositories, teams, data-connected
              agent workflows, and potentially broader knowledge-work automation via Redpanda. AWS procurement can also
