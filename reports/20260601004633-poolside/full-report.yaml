      - CV006
      - CV022
      - CV023
      - CV024
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Valuation is most sensitive to direct economics and execution proof, not to the existence of category demand
      alone.
    data:
      items:
        - label: Verified ARR / revenue
          value: 5
          detail: Single biggest upside or downside swing factor
          tone: positive
        - label: Retention and direct customer proof
          value: 5
          detail: Transforms narrative into underwritable quality
          tone: positive
        - label: Infrastructure stability
          value: 4
          detail: Needed to prevent capital discount from dominating
          tone: warning
        - label: Gross-margin evidence
          value: 4
          detail: Determines whether the story resembles software or capital-heavy services
          tone: warning
        - label: Competitive moat durability
          value: 3
          detail: Important, but less decisive than proof of economics
          tone: neutral
        - label: Category TAM support
          value: 2
          detail: Already broadly established by market and comp evidence
          tone: neutral
    approximationNotes: Values are ordinal sensitivity scores from 1-5, not statistical regression outputs.
    claimRefs:
      - CV011
      - CV022
      - CV026
      - CV027
      - CV031
      - CV032
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Scenario ranges cluster around the 2024 closed anchor, with upside available only if private proof closes the
      disclosure gap.
    data:
      items:
        - label: Bear case valuation
          low: 1.5
          mid: 2.2
          high: 3
          displayValue: $1.5B-$3.0B
          detail: Applies if partner-led proof persists, infrastructure risk deepens, or the wedge compresses.
          tone: negative
        - label: Base case valuation
          low: 3
          mid: 4.2
          high: 5.5
          displayValue: $3.0B-$5.5B
          detail: >-
            Anchored around the last closed $3B valuation plus modest premium for technical differentiation if proof
            improves somewhat.
          tone: neutral
        - label: Bull case valuation
          low: 8
          mid: 10
          high: 12
          displayValue: $8.0B-$12.0B
          detail: >-
            Requires direct economics and customer proof strong enough to approach the upper reported private-markets
            narrative.
          tone: positive
    approximationNotes: >-
      The ranges are explicit investment estimates built from public comps, the last closed round, and current risk
      state; they are not quoted market prices.
    claimRefs:
      - CV002
      - CV003
      - CV012
      - CV013
      - CV016
      - CV022
      - CV023
  - id: FV004
    title: Investment KPIs
