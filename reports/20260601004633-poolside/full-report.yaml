        title: Customer segmentation by buyer, user, and environment
        blocks:
          - type: paragraph
            body: >-
              Poolside's customer story is segmented more by security posture and buying structure than by generic
              company size. The user is still the software engineer or technical operator, but the buyer and payer often
              move upward to platform engineering, the CTO, the CISO, a public-sector program owner, or a cloud
              procurement function. Poolside's government page is explicit that the company is purpose-built for
              classified, disconnected, and sovereign environments, while the enterprise and platform materials frame
              the product as a controlled AI stack for organizations that cannot accept hosted-only copilots. Sacra adds
              an outside interpretation that Poolside focuses on large organizations such as major banks, defense
              contractors, and companies with thousands of developers. The AWS partnership matters here because it
              creates an alternate payer path: enterprises can contract through AWS terms and use committed cloud
              budgets. In customer terms, Poolside is not solving for the broadest developer population. It is solving
              for accounts where security requirements and internal governance are so important that a central buyer is
              willing to sponsor a more complex deployment motion.
