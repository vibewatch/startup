      - number: '7.2'
        title: Operational, security, and quality risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is inherent to Poolside's architecture. The company is not shipping a static coding
              plugin; it is shipping agentic systems that can run tools, edit files, access data, and operate in
              sensitive enterprise or mission environments. Poolside's own materials emphasize mitigations such as
              containerized sandboxes, explicit permissions, trajectory logging, secret management, network controls,
              and centralized policy enforcement, which is good evidence that management understands the problem. But
              the need for these controls is itself the risk signal. OWASP's GenAI security guidance highlights prompt
              injection, insecure output handling, training-data poisoning, model denial of service, supply-chain
              vulnerabilities, and sensitive-information disclosure as core failure modes for LLM applications. CISA's
              AI guidance similarly stresses secure adoption and deployment of agentic systems. Poolside's
              support-engineering and FDRE roles show that real deployments span API integration, system configuration,
              performance issues, on-prem installs, and secure operations. The data-platform and Model Factory posts add
              another layer: high-scale training, evaluation, and code execution systems can fail operationally even
              before a customer ever touches them. In short, Poolside has designed for security and reliability, but it
              is also selling into the exact environments where any quality failure is magnified.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
