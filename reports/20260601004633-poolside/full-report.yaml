      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are visible in both survey data and vendor messaging: developers report
              productivity benefits, faster onboarding to unfamiliar code, better test generation, and some code-quality
              improvement; vendors increasingly sell agent workflows, code review, and integrated SDLC assistance rather
              than autocomplete alone. Market-research summaries add a second driver: software complexity keeps rising,
              making it easier to justify AI tooling that accelerates debugging, testing, and delivery. Poolside
              benefits especially from the subset of buyers who want on-prem or air-gapped operation, because Grand View
              and Poolside both point to regulated-industry demand for local control. But the same evidence base also
              shows why the market is not frictionless. Stack Overflow found more distrust than trust in AI accuracy,
              strong security/privacy concerns around agents, and limited appetite for handing over
              deployment/monitoring or project planning. GitHub's own survey shows company sanctioning still trails
              individual use. Those constraints matter more for Poolside than for a cheap self-serve assistant because
              its sales motion assumes the hardest environments will buy first. That means trust, security review, and
              proof of ROI are not side constraints - they are the market boundary itself.
