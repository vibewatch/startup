  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Poolside looks strongest on sovereignty and architectural depth, and weakest on public maturity and external
      operating proof.
    data:
      columns:
        - Architectural depth
        - Deployment control
        - Developer-surface completeness
        - Public maturity / proof
      rows:
