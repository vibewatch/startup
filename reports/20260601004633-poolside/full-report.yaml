  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and trust risk
        blocks:
          - type: paragraph
            body: >-
              Poolside's target customers push it into the most compliance-sensitive parts of the market. The government
              and enterprise pages promise trustworthy, sovereign AI for high-consequence work, which is a commercial
              advantage but also a promise that attracts scrutiny. External governance signals now point in one
              direction: trustworthy AI needs explicit risk management, secure deployment, and careful claims
              discipline. The European Commission's AI materials describe the AI Act as a risk-based framework with
              implementation support for developers and deployers. NIST's AI Risk Management Framework and generative-AI
              profile push organizations to incorporate trustworthiness into design, deployment, and evaluation. CISA
              guidance explicitly calls for careful adoption of agentic AI services, secure deployment of externally
              developed AI systems, and information-sharing on AI-related cybersecurity issues. Legal risk sits beside
              regulatory risk. Accessible legal analysis of the GitHub Copilot litigation shows why AI coding vendors
              remain exposed to code-ownership, licensing, attribution, and open-source-compliance arguments. Poolside's
              use of coding models, agentic workflows, open-weight releases, and enterprise software outputs means it
              cannot treat these questions as someone else's problem. Even if legal exposure lands first on another
              vendor, buyers will ask Poolside to prove its governance and licensing posture.
            claimRefs:
              - CR001
              - CR002
