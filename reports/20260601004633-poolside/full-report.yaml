      - number: '8.3'
        title: Recommendation, sensitivity, and downside triggers
        blocks:
          - type: paragraph
            body: >-
              The recommendation from public data alone is research-more rather than buy or avoid. The upside is
              meaningful: if Poolside can convert its secure-environment wedge into referenceable direct customers, show
              software-heavy margins despite services and compute burden, and stabilize the infrastructure roadmap after
              the CoreWeave/Horizon wobble, the company could justify a valuation materially above the 2024 mark. The
              downside is also meaningful: if direct proof remains partner-led, incumbents close the governance gap, or
              capital intensity keeps outrunning disclosed software economics, then even the 2024 price can look
              stretched. Sensitivity is therefore highest on four variables: verified revenue or ARR, durability of
              customer retention and direct proof, the real capital burden of compute and infrastructure, and whether
              sovereignty remains structurally scarce instead of merely nice to have. Because those variables remain
              unresolved publicly, investors should treat the valuation as option-like. There is upside to waiting for
              proof because the remaining uncertainty is not mostly about TAM - it is about company-specific conversion
              of technology into financeable economics.
            claimRefs:
              - CV022
