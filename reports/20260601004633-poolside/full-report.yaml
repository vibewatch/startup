    summary: Poolside carries software upside, but the visible operating model still looks capital- and service-heavy.
    data:
      columns:
        - Fixed-cost intensity
        - Variable-cost intensity
        - Service burden
        - External financing dependency
      rows:
        - label: Model training and experimentation
          values:
            - label: very high
              tone: warning
              detail: Clusters, orchestration, and evaluation tooling are expensive regardless of short-term revenue
            - label: high
              tone: warning
              detail: Utilization and experiment volume drive incremental spend
            - label: low
              tone: neutral
              detail: Not customer-facing, but still staffing-intensive
            - label: high
              tone: warning
              detail: Scale ambitions imply repeated financing or partner reliance
        - label: Inference and deployment
          values:
            - label: medium-high
              tone: warning
              detail: Depends on deployment mode and hardware commitments
            - label: high
              tone: warning
              detail: Usage and workload intensity matter
            - label: medium
              tone: neutral
              detail: On-prem and VPC support create operational overhead
            - label: medium-high
              tone: warning
              detail: May require partner or customer hardware support
        - label: FDRE / implementation
          values:
            - label: medium
              tone: neutral
              detail: Core team cost is fixed once hired
            - label: medium
              tone: warning
              detail: Travel and deployment scale with accounts
            - label: very high
              tone: warning
              detail: Human-heavy delivery can compress software economics
            - label: low
              tone: neutral
              detail: More operating-expense than financing risk
        - label: Horizon / large infrastructure thesis
          values:
            - label: very high
              tone: negative
              detail: Campus and energy commitments would create a different financial profile from SaaS
            - label: medium
              tone: warning
              detail: Utilization matters after buildout
            - label: low-medium
              tone: neutral
              detail: Less about services, more about asset intensity
            - label: very high
              tone: negative
              detail: Would likely require dedicated financing structures and partner certainty
    approximationNotes: The matrix is ordinal and based on operating-model evidence rather than disclosed line-item accounts.
    claimRefs:
      - CI016
      - CI017
      - CI018
      - CI019
