      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The financing record shows access to capital, but not self-sufficiency. Official and independent sources
              align on a $500 million Series B in October 2024 at roughly a $3 billion valuation and about $626 million
              of total disclosed funding. Poolside then expanded the scale of its ambitions: AWS became both channel and
              compute partner; Phil Drury joined as chief investment officer; Project Horizon introduced a 2GW West
              Texas campus thesis; and the CoreWeave partnership added more than 40,000 GPUs, a 250MW first phase, and a
              500MW reserved expansion option. Those announcements create an obvious interpretation: management was
              preparing for a financing profile much larger than a normal software startup. Sacra reported a later 2025
              $2 billion raise target at a $12 billion valuation, which fits that capital-intensity narrative but does
              not constitute a closed round. The adverse spring 2026 reporting from DatacenterDynamics and Yahoo Finance
              matters because it undermines the neatest version of the capital story. If Horizon or the CoreWeave
              arrangement slipped, then Poolside may still need the same scale of capital but with less partner
              certainty and more execution risk. Public materials do not disclose cash on hand, monthly burn, runway,
              debt, or binding project-finance obligations, so the key underwriting question remains unresolved.
