      - number: '3.3'
        title: Pricing, distribution, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Public list pricing makes one competitive fact obvious: much of the market is training buyers to expect
              low-friction, seat-based adoption with a free tier or a transparent starting price. GitHub, Cursor,
              Anthropic, Continue, Tabnine, and Windsurf all publish self-serve or entry pricing, while Amazon Q
              publishes free-tier and code-transformation allowances inside AWS. Poolside does not publicly publish list
              pricing; instead, the company sells expert-led enterprise deployment and custom infrastructure
              configurations. That can support higher contract values in security-sensitive accounts, but it also
              creates a distribution disadvantage against incumbents that can land inside an existing platform contract.
              Switching costs are similarly asymmetric. For teams already standardized on GitHub, GitLab, AWS, Google
              Cloud, or enterprise IDEs, the easiest path is to add AI where the code already lives. Open standards and
              frameworks lower lock-in on the other side: Continue emphasizes source-controlled checks and BYOK-style
              flexibility, while Poolside itself promotes ACP compatibility and OpenAI-compatible APIs. The resulting
              market structure encourages multi-homing and experimentation, which weakens the durability of any purely
              feature-based moat.
