  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation stays in research-more because technical promise and category strength are offset by valuation
      opacity and execution risk.
    data:
      nodes:
        - id: r1
          label: Compelling technical wedge
          detail: Sovereign deployment and coding-specific RL create real upside potential
          tone: positive
        - id: r2
          label: Large category opportunity
          detail: Coding AI comps show that very large values are possible when proof is strong
          tone: positive
        - id: r3
          label: Opaque economics and customer quality
          detail: ARR, margins, retention, and broad direct proof remain undisclosed
          tone: warning
        - id: r4
          label: Execution and capital overhang
          detail: CoreWeave/Horizon uncertainty raises downside and dilution risk
          tone: negative
        - id: r5
          label: 'Recommendation: research-more'
          detail: Keep Poolside live, but require deeper diligence before paying a premium
          tone: neutral
      edges:
        - from: r1
          to: r5
        - from: r2
          to: r5
        - from: r3
          to: r5
        - from: r4
          to: r5
    approximationNotes: null
    claimRefs:
