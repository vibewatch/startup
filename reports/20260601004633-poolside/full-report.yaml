      - CI027
      - CI028
      - CI031
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Poolside presents one layered system: models at the core, agent runtimes around them, then enterprise control and
      deployment surfaces above.
    data:
      layers:
        - label: Deployment boundary
          detail: VPC, on-prem, air-gapped, cloud, and classified environments
          tone: positive
        - label: Enterprise control plane
          detail: Policies, permissions, traces, auditability, secret handling, exportability
          tone: positive
        - label: Developer surfaces
          detail: CLI, IDE, web, headless, pool, and Shimmer experiences
          tone: neutral
        - label: Agent runtime
          detail: Sandboxed execution, MCP integrations, ACP support, tool use, non-interactive automation
          tone: positive
        - label: Foundation models
          detail: Laguna M.1 and Laguna XS.2 with coding-focused post-training and RLCEF
          tone: positive
        - label: Model Factory
          detail: Data, training, code execution, evaluation, and post-training systems
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CE001
      - CE003
      - CE010
      - CE013
      - CE022
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: The product aims to move from developer intent to governed agent execution and auditable enterprise output.
    data:
      nodes:
        - id: w1
          label: Developer or operator request
          detail: A coding, debugging, testing, or workflow task starts in CLI, IDE, web, or automation
          tone: neutral
        - id: w2
          label: Agent runs within policy boundary
          detail: Permissions, tools, and MCP access are constrained by enterprise controls
          tone: positive
        - id: w3
          label: Sandboxed execution and tool use
          detail: Agent edits files, runs commands, and interacts with services in a controlled environment
          tone: positive
        - id: w4
          label: Trace and review
          detail: Trajectories, actions, and outputs are recorded for inspection and export
          tone: positive
        - id: w5
          label: Production output or automation
          detail: Approved work lands in codebase, CI, or downstream enterprise systems
          tone: neutral
