      - number: '8.2'
        title: Comparable set and scenario ranges
        blocks:
          - type: paragraph
            body: >-
              Public and private comparables show how hard it is to value Poolside without direct financial disclosure.
              GitLab provides a public software baseline: about $759 million of revenue, 89% gross margin, and a roughly
              $5.24 billion public market capitalization in June 2026. Replit provides a lower-price, lower-complexity
              coding-platform comp at a $3 billion valuation on $150 million annualized revenue. Cognition shows a more
              agentic, enterprise-coding path at a $10.2 billion valuation on $73 million ARR, albeit with a very
              different product story and operating culture. Cursor shows what hypergrowth can command when revenue
              visibility is extraordinary: Sacra estimates $3 billion in annualized revenue and a $50 billion financing
              discussion in 2026. Anthropic is a reminder that frontier-model leaders can achieve extreme valuations,
              but it is so much larger and broader that it is a context anchor, not a directly usable comp. Against that
              backdrop, Poolside's closed $3 billion valuation no longer looks absurd on market narrative alone, but it
              does look under-documented. The question is not whether the category can support large values; it clearly
              can. The question is whether Poolside itself has disclosed enough to justify paying as though it were
              already a proven winner.
            claimRefs:
              - CV011
