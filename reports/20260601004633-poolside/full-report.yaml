      - number: '5.2'
        title: Models and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The deepest technical story lives underneath the user surfaces. Poolside's models page and public release
              post describe two Laguna models: Laguna M.1, a 225B total parameter mixture-of-experts model with 23B
              active parameters, and Laguna XS.2, a 33B total parameter MoE with 3B active parameters released as open
              weights under Apache 2.0. The long-context update then extends both to 256K context and reports more than
              one trillion tokens processed plus more than 50,000 Hugging Face downloads for XS.2. Around those models
              sits the Model Factory: a layered system for ingestion, data curation, blending, pre-training,
              post-training, evaluation, and reinforcement learning. Poolside's own technical posts describe data
              pipelines capable of ingesting roughly 20 trillion tokens per day on baseline compute, petabyte-scale or
              larger data systems, a distributed training codebase called Titan, and a code execution environment that
              indexes more than 800,000 repositories and supports code-learning workloads via RLCEF. The architecture
              matters because Poolside is not merely wrapping third-party APIs. It is arguing that product quality comes
              from owning the whole loop from raw materials to post-trained agent behavior.
