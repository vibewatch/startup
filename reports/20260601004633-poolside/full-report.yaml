  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and user workflow
        blocks:
          - type: paragraph
            body: >-
              Poolside now sells a complete software-engineering workflow rather than a single model endpoint. The
              products page shows four usage surfaces - CLI, IDE, web, and headless automation - while the public `pool`
              agent adds concrete implementation detail: interactive terminal use, ACP server and client modes,
              non-interactive execution, slash commands, file search, shell mode, permissions modes, and support for
              AGENTS.md, skills, MCP, and ACP. The enterprise and platform pages extend that developer surface into an
              admin and governance layer. Poolside positions the console as the operating plane where administrators
              define policies, control tool access, review trajectories, and export records. In customer-workflow terms,
              the product is not just code generation. It is a governed agent runtime designed to sit where developers
              already work while letting central teams inspect and constrain what the agent does. That is why the real
              buyer is often the platform, security, or CTO function even though the end user is still an engineer. The
              public preview release of `pool` and Shimmer in 2026 finally turned this architecture from mostly
              narrative into something users can see and install.
