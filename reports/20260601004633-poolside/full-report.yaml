  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and deployment model
        blocks:
          - type: paragraph
            body: >-
              Poolside presents itself as a frontier AI lab building foundation models, agents, and enterprise systems
              that start with software engineering and then extend to broader operational intelligence. The company’s
              current website emphasizes a full-stack offer: proprietary models, developer surfaces in the
              CLI/IDE/web/headless modes, an administrative console, and deployment choices spanning VPC, on-prem,
              air-gapped, and classified environments. That positioning matters because Poolside is not pursuing the
              mass-market, browser-first path used by commodity coding copilots. Instead, the public materials
              repeatedly describe sovereign deployment, policy-governed agents, traceability, and embedded
              forward-deployed engineers as the commercial wedge. TechCrunch’s October 2024 reporting reinforces the
              same market choice by describing customers primarily as Global 2000 enterprises and public-sector agencies
              rather than self-serve developers. GitHub materials also show that Poolside now exposes part of its
              product stack publicly through the open-source `pool` coding agent, suggesting that its delivery model
              increasingly mixes closed enterprise deployments with developer-facing tooling and ecosystem hooks.
