      - number: '1.2'
        title: Founders, leadership, footprint, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Poolside was founded in 2023 by Jason Warner and Eiso Kant, two operators with unusually strong prior
              exposure to developer tooling. Warner previously served as GitHub CTO and also led engineering
              organizations at Canonical and Heroku; TechCrunch and Tech Funding News both frame that background as
              central to Poolside’s thesis because Warner helped incubate GitHub Copilot before leaving to build a
              vertically integrated alternative. Kant’s prior work in developer analytics and software engineering
              startups underpins the company’s product and data orientation. Leadership has expanded beyond the two
              founders: in July 2025, Poolside hired former Citigroup global technology banking chief Phil Drury as its
              first chief investment officer, a signal that capital formation and infrastructure structuring became
              strategic functions rather than back-office tasks. Public governance visibility remains thin. The company
              discloses executives, hiring areas, and public-sector operating structure, but open materials do not
              disclose board composition, voting control, or detailed investor rights. Job postings add one useful
              geographic clue: Poolside says it was founded in the US, has its “home” there, and operates a distributed
              team across Europe and North America with regular Paris meetups.
