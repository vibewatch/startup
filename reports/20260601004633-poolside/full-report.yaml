              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The right public-data answer is research-more, not no
            body: Poolside is too interesting to dismiss and too opaque to price aggressively on narrative alone.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV009
          - type: callout
            title: Later headline valuations are not the same as closed anchors
            body: >-
              The $12B 2025 number belongs in scenario context, not in the cap-table column, unless a closed financing
              is verified.
            calloutType: risk
            claimRefs:
