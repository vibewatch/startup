      - number: '2.2'
        title: 'Sizing lenses: broad category growth versus Poolside-relevant spend'
        blocks:
          - type: paragraph
            body: >-
              Public sizing data supports a favorable category but not a single crisp TAM. Grand View Research sized AI
              code tools at $4.86 billion in 2023 and $26.03 billion by 2030. Polaris produced a similar tools-level
              view: $4.91 billion in 2024 and $27.17 billion by 2032. MarketsandMarkets published a more conservative
              tools market of $4.3 billion in 2023 growing to $12.6 billion in 2028. At the broader end, Polaris and
              MarketsandMarkets both publish much larger coding-assistant categories that reach roughly $127-138 billion
              by 2032. The right conclusion is not to average them blindly. Instead, these reports create a set of
              nested lenses: narrow code tools, broader coding assistants, and an even narrower sovereign-enterprise
              slice that Poolside specifically targets. Demand-side evidence reinforces that the user base is large
              enough to matter: BLS counted 1.9 million US software-developer, QA, and tester jobs in 2024 with 15%
              ten-year growth, while Stack Overflow and GitHub survey data show that experimentation with AI coding
              tools is already mainstream among developers. Poolside's monetizable opportunity sits where those adoption
              trends overlap with strict security and governance requirements.
