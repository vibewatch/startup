      - number: '4.2'
        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Public evidence makes the cost stack far easier to see than the revenue stack. Poolside repeatedly
              describes a frontier training operation with large-scale GPU use, petabyte-class data systems, millions of
              synthetic tasks, and dedicated infrastructure for training, evaluation, and code execution. The AWS
              partnership references a progression from looking for 1,000 GPUs to operating a 10,000 GPU cluster; the
              Titan and Model Factory posts discuss a 10K H200 cluster, automated experimentation, and thousands of GPU
              workloads; multiple engineering roles mention trillions of tokens, hundreds of terabytes to multi-petabyte
              data systems, and dedicated support for pretraining, post-training, evaluations, and customer operations.
              Those signals imply a materially higher cost of revenue and operating expense base than a pure seat-based
              developer tool. At the same time, the presence of FDRE and support roles indicates service-delivery cost
              that likely depresses near-term gross margin while improving adoption in complex accounts. In other words,
              Poolside may someday earn software-like margins, but the public evidence today points to a hybrid model
              that still carries significant compute, support, and implementation load.
