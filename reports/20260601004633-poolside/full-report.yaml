companyProfile:
  summary: >-
    Poolside is an AI company founded in San Francisco in April 2023 by former GitHub CTO Jason Warner and Eiso Kant
    that targets high-consequence software engineering environments. Its public materials emphasize sovereign
    deployment, full model-weight delivery, agent orchestration, and forward-deployed implementation teams for
    enterprises and public-sector buyers that cannot rely on cloud-only copilots. The company raised a $500 million
    Series B at roughly a $3 billion valuation in October 2024 and later expanded its narrative into infrastructure and
    public-sector channels via AWS, CoreWeave, Project Horizon, and Poolside Federal.
