    layout: wide
    summary: Poolside scores highest on product ambition and lowest on evidence completeness.
    data:
      items:
        - label: Market opportunity
          value: 4
          max: 5
          unit: /5
          detail: Category strength is credible and well-supported
          tone: positive
        - label: Product / moat quality
          value: 4
          max: 5
          unit: /5
          detail: Sovereign deployment and RL coding stack remain differentiated
          tone: positive
        - label: Customer proof
          value: 2
          max: 5
          unit: /5
          detail: Public proof is real but narrow and partner-led
          tone: warning
        - label: Economics visibility
          value: 1
          max: 5
          unit: /5
          detail: ARR, margin, and runway are not publicly disclosed
          tone: negative
        - label: Execution risk
          value: 2
          max: 5
          unit: /5
          detail: Infrastructure and partner instability increase risk weighting
          tone: negative
        - label: Evidence completeness
          value: 1
          max: 5
          unit: /5
          detail: Too many core underwriting facts remain private
          tone: negative
    approximationNotes: Scores are IC heuristics on a 1-5 scale, not audited metrics.
    claimRefs:
      - CV005
      - CV006
      - CV023
      - CV024
      - CV031
      - CV040
