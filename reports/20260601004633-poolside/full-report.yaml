  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and go-to-market economics
        blocks:
          - type: paragraph
            body: >-
              Poolside's public materials point to an enterprise-contract business, not a mass self-serve SaaS motion.
              The company sells models, agents, and governance tooling into security-conscious enterprises and
              public-sector environments, then wraps that software stack with deployment support. The AWS partnership is
              financially important because it turns Poolside into a first-party AWS offering, allowing customers to
              contract through AWS terms and burn down existing spend commitments instead of opening a brand-new vendor
              path. Sacra's company profile and Poolside's own positioning both suggest the revenue model includes more
              than software access alone: forward-deployed research engineers, customer fine-tuning, deployment work,
              and support appear to be part of the commercial package. That can raise average contract value, especially
              in regulated accounts, but it also makes revenue quality less legible because the public record does not
              separate recurring software revenue from implementation-heavy services. The result is a plausible high-ACV
              enterprise model with stronger channel leverage than a direct-only startup, but much weaker disclosure
              than investors would normally want for a company claiming frontier-scale economics.
