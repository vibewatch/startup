  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Poolside adoption appears to begin with a security-sensitive need, move through solutioning and review, then
      expand only after embedded deployment succeeds.
    data:
      nodes:
        - label: Sensitive use case appears
          detail: A public-sector, defense, or regulated team needs coding AI without cloud compromise
          tone: neutral
        - label: Partner or direct engagement
          detail: Poolside, AWS, or an integrator frames the deployment path and solution fit
          tone: neutral
        - label: Security and architecture review
          detail: Boundary control, auditability, and deployment model are evaluated
          tone: warning
        - label: Embedded deployment
          detail: FDREs or solution architects help configure and operationalize the system
          tone: positive
        - label: Expansion to broader workflows
