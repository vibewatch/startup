      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest pro-Poolside argument is that sovereign deployment remains structurally different from a
              hosted copilot. If a customer truly requires no third-party dependency, full model-weight ownership,
              air-gapped execution, audit trails, and forward-deployed engineers, then the relevant rival set narrows
              dramatically. But the competitive risk is that the rest of the market is moving toward enough governance,
              enough agent control, and enough enterprise administration at far lower adoption cost. Bundled vendors
              already control identity, source code, CI, cloud billing, or productivity surfaces; that distribution
              power matters more than benchmark deltas in everyday procurement. Surveys also show why the market is
