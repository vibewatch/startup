  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis, and current financing context
        blocks:
          - type: paragraph
            body: >-
              The pro-Poolside investment case is straightforward: the company is building a differentiated sovereign
              coding stack for high-consequence environments, has already demonstrated fundraising access, and sits in a
              category where AI-assisted software development is moving from experimentation to enterprise budget line.
              If sovereign deployment, auditability, and embedded implementation become durable buying criteria,
              Poolside could earn very large contracts in public-sector, defense, and regulated-enterprise accounts. The
              anti-thesis is just as clear. Public evidence still does not show ARR, gross margin, cash runway, customer
              count, NRR, or broad direct-customer proof. The most recent hard valuation fact is the 2024 closed round
              at roughly $3 billion. The later Sacra-reported 2025 $12 billion target may indicate investor appetite,
              but without a closed round it is not a firm valuation anchor. The 2026 CoreWeave/Horizon complications
              make the situation more delicate because they increase the chance that investors are underwriting
              execution and infrastructure ambition before the software economics are visible. That combination does not
              kill the story, but it makes entry discipline essential.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
