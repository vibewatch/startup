      - number: '5.3'
        title: Deployment, integration, trust, and control
        blocks:
          - type: paragraph
            body: >-
              Deployment and control are central to Poolside's product thesis. The enterprise and platform materials
              stress that customers can run the system inside their own infrastructure, including VPC, on-prem, and
              air-gapped environments, with full model weights rather than only hosted API access. The platform page
              adds operational details that matter in practice: containerized execution environments, secret management,
              network policy controls, explicit permissions, recorded trajectories, and centralized policy enforcement.
              The AWS partnership shows how this architecture reaches less bespoke buyers: Poolside can also appear as a
              first-party AWS offering, deploy in a customer VPC, and use Trainium or NVIDIA chips. The Redpanda
              partnership adds another integration layer by giving agents access to 300-plus enterprise data sources
              with least-privilege controls and event inspection. Compared with rival products, the technical difference
              is not that only Poolside has terminal agents, chat, or enterprise admin features. GitHub Copilot, Claude
              Code, Amazon Q, Gemini Code Assist, GitLab Duo, Sourcegraph Cody, Continue, and Tabnine all market
              substantial workflow and governance features. Poolside's distinct claim is that these controls are
              embedded in a sovereign stack where the customer can own the model layer, deployment boundary, and audit
              trail together.
