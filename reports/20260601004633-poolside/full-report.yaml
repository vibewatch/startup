      - number: '8.4'
        title: Final diligence asks and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              The final diligence list is unusually concentrated because so much of the valuation question collapses
              into a handful of missing facts. First, investors need current ARR or recognized revenue, gross margin,
              and burn or runway. Second, they need direct customer and retention evidence that goes beyond partner
              quotes and ecosystem validation. Third, they need clarity on whether infrastructure ambition now requires
              more capital than the core software story can carry. Fourth, they need to know whether the company can
              compete profitably against incumbents and fast-growing agent startups that already disclose more economics
              than Poolside does. The thesis breaks if one of three things happens: infrastructure execution risk
              deepens, customer quality remains narrow and unproven, or evidence emerges that governance and sovereign
              deployment no longer command premium willingness to pay. Until those questions are answered, the sensible
              stance is to keep the company in the investable universe but price every optimistic assumption explicitly.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
