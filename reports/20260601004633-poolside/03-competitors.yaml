- id: capabilities-and-buyer-fit
  title: Capability breadth and buyer fit
  body: |-
    Capability breadth is no longer the differentiator it was in early coding copilots. GitHub, Anthropic, AWS, Google, GitLab, Cursor, Windsurf, Sourcegraph, Continue, and Tabnine all now market some combination of code generation, editing, chat, agent workflows, terminal usage, or enterprise controls. What separates them is where each vendor is strongest in the buying process. GitHub and GitLab inherit repository, CI, and policy context. AWS and Google can bundle coding help into broader cloud and platform relationships. Cursor and Windsurf appeal to developers who want frontier-model access and fast agent loops with minimal procurement overhead. Sourcegraph and Tabnine sell context, governance, and enterprise integration. Poolside sits at the opposite end of the convenience spectrum: it is strongest when the customer requires full model weights, VPC or on-prem deployment, traceability, and support for sensitive or classified environments. That makes the company a poor fit for lightweight self-serve adoption, but a stronger fit when the CTO, CISO, or mission owner is the real buyer rather than the individual developer.
