company:
  name: Poolside
chapter:
  number: 3
  title: Competitors
  summary: |-
    Poolside competes in one of the most crowded segments of enterprise AI: coding assistants, agents, and software-development automation. The broadest threat comes from incumbents such as GitHub, AWS, Google, and GitLab that already own developer workflow, identity, and budget, while challengers such as Cursor, Windsurf, Sourcegraph, Continue, and Tabnine compress pricing and normalize agentic workflows. Poolside's clearest relative advantage is sovereign deployment - full model weights, air-gapped operation, and forward-deployed implementation - but the same choice also raises adoption friction and makes the company vulnerable if bundled incumbents make governance and self-hosting good enough.
sections:
- id: landscape-and-categories
  title: Landscape and category structure
  body: |-
    Poolside does not face a single clean peer set. The competitive landscape breaks into at least five buckets: bundled incumbents that already own developer workflow and identity, fast-moving standalone agent vendors, enterprise-governance specialists, open and configurable agent frameworks, and substitute products that let non-specialists build software without a traditional secure SDLC. GitHub Copilot, Amazon Q Developer, Gemini Code Assist, and GitLab Duo all benefit from existing platform distribution, which means they can land through tools engineering teams already use. Cursor and Windsurf represent the modern agent-first challengers: their value proposition is speed, broad model access, and cloud agents rather than sovereign control. Sourcegraph and Tabnine compete on enterprise codebase context and governance. Continue pressures the market from the open and source-controlled side. Replit Agent is not a like-for-like regulated-enterprise rival, but it matters as a substitute for some greenfield workflow automation. Poolside therefore competes less on raw code generation novelty than on whether enterprises believe sovereignty, traceability, and inside-the-boundary deployment are worth paying and changing process for.
