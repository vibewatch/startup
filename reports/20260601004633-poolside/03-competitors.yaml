- id: moat-durability-and-displacement-risk
  title: Moat durability and displacement risk
  body: |-
    The strongest pro-Poolside argument is that sovereign deployment remains structurally different from a hosted copilot. If a customer truly requires no third-party dependency, full model-weight ownership, air-gapped execution, audit trails, and forward-deployed engineers, then the relevant rival set narrows dramatically. But the competitive risk is that the rest of the market is moving toward enough governance, enough agent control, and enough enterprise administration at far lower adoption cost. Bundled vendors already control identity, source code, CI, cloud billing, or productivity surfaces; that distribution power matters more than benchmark deltas in everyday procurement. Surveys also show why the market is vulnerable to commoditization: adoption is high, trust is lower, and developers use AI where it is convenient rather than where a single vendor is uniquely indispensable. Poolside's moat is therefore conditional rather than automatic. It can be durable in regulated and mission-critical accounts, but only if those customers keep valuing sovereignty and implementation support more than bundled platform convenience, transparent pricing, and incumbent workflow reach.
  claimRefs:
  - CP036
  - CP037
  - CP038
  - CP039
  - CP040
