- id: TP004
  title: Switching cost, lock-in, and distribution power table
  columns:
  - Force
  - Who benefits
  - Evidence
  - Why it matters
  - Implication for Poolside
  rows:
  - - Repository and workflow ownership
    - GitHub and GitLab
    - AI features sit inside source control, review, and CI surfaces
    - Existing auth, repos, and approvals lower rollout friction
    - Poolside must displace existing workflow anchors, not just add features
  - - Cloud procurement and budget ownership
    - AWS and Google
    - Coding AI is sold next to cloud, IAM, observability, and platform services
    - Central IT can buy inside existing vendor relationship
    - Poolside needs stronger ROI proof when not attached to existing platform spend
  - - Developer-led IDE habit
    - Cursor and Windsurf
    - Self-serve and agent-first products are easy to trial
    - Bottom-up adoption can happen before security review
    - Poolside risks being evaluated only after a lighter tool already lands
  - - Enterprise context and governance
    - Sourcegraph and Tabnine
    - These vendors market codebase context, policy, and private deployment
    - Context and governance are not unique to Poolside
    - Poolside must prove sovereignty matters beyond standard governance features
  - - Open and configurable framework layer
    - Continue and similar tooling
    - Source-controlled checks and BYOK reduce dependence on closed assistants
    - Open orchestration encourages multi-homing
    - Feature-level moat is weaker when customers can swap models and agents underneath
  - - API compatibility and standards
    - Both Poolside and challengers
    - OpenAI-compatible APIs and ACP lower integration friction
    - Standards help adoption but also reduce lock-in
    - Poolside gains interoperability but loses some proprietary stickiness
