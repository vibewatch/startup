- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Publicly supported value / status
  - Why it matters
  - Financing implication
  - Diligence ask
  rows:
  - - Best-supported closed round
    - $500M Series B at roughly $3B valuation in October 2024
    - Shows clear external financing access
    - Provides the last closed valuation anchor
    - Confirm exact security, liquidation preference, and board terms
  - - Total disclosed funding
    - About $626M
    - Sets lower bound on capital absorbed so far
    - Implies substantial historic cash burn and cluster investment
    - Reconcile cap table and timing of cash receipts
  - - AWS go-to-market and compute support
    - First-party AWS offering and AWS-linked 10,000 GPU scale-up story
    - Reduces procurement friction and can offset some infrastructure burden
    - Could delay or reduce direct enterprise-sales cash needs
    - Quantify revenue sourced through AWS and economics of the channel
  - - Project Horizon ambition
    - 2GW campus thesis with first 250MW phase and 500MW reserved expansion
    - Would move Poolside toward infrastructure-scale capital planning
    - Likely requires financing beyond normal software fundraising
    - Clarify whether obligations are binding, optional, or cancelled
  - - CoreWeave compute agreement
    - 40,000+ GPUs announced plus first-phase campus tenancy
    - Suggests near-term compute access but also dependency concentration
    - Could have locked in large commitments if active
    - Request contract status, termination rights, and prepayment obligations
  - - Capital-markets capability
    - Phil Drury hired as chief investment officer
    - Signals financing complexity and project-capital needs
    - Supports the idea that future raises may be bespoke and infrastructure-linked
    - What financing sources or structures were actually opened by this hire
  - - Later fundraising signal
    - Sacra reported a 2025 effort to raise $2B at $12B valuation, not confirmed as closed
    - Shows ambition and investor appetite, but not settled capital
    - Cannot be treated as funded runway
    - Verify current fundraise status and any committed capital
  - - Cash, burn, runway, debt
    - Publicly undisclosed
    - Core question for survival and dilution risk
    - Makes financial adequacy impossible to underwrite from public evidence alone
    - Request cash balance, monthly burn, runway, debt, and covenants
  notes: The table distinguishes closed capital from announced capacity and reported fundraising context; unconfirmed targets are not counted as funded cash.
