- id: financial-verdict-and-gaps
  title: Financial verdict and diligence blockers
  body: |-
    The right financial verdict is mixed. On the positive side, Poolside appears capable of selling a high-value product into customers that can tolerate long cycles and pay for security, sovereignty, and implementation. The AWS channel could shorten procurement, and the public-sector and FDRE motions support the idea of large contracts rather than low-cost seats. But the business cannot yet be underwritten like a mature software company. There is no public ARR, revenue run rate, gross margin, cash-balance, burn, NRR, or customer concentration disclosure. A public comparable such as GitLab can show revenue, gross margin, net retention, and customer cohorts in its annual report; Poolside cannot. That disclosure gap is especially important because Poolside's cost base almost certainly exceeds that of a conventional developer-software vendor given model training, inference, support, and infrastructure ambitions. Investors therefore need to separate two questions: first, whether the company can keep raising capital; second, whether the company can earn software-like unit economics before another major financing event becomes necessary. The evidence clearly supports the first and does not yet support the second.
