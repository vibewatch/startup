- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on analysis
  - Why it matters
  - Exact diligence path
  rows:
  - - ARR / revenue run rate
    - Prevents valuation and runway underwriting
    - Need to compare cash burn with recurring revenue base
    - Request current ARR, booked revenue, and growth by quarter
  - - Blended and software-only gross margin
    - Obscures whether business can become software-like
    - Compute and services can materially compress margin
    - Request COGS split across training, inference, support, and services
  - - Cash on hand and monthly burn
    - Blocks capital-adequacy analysis
    - Funding raised alone does not reveal runway
    - Request latest balance sheet and 6-12 month burn trend
  - - Debt or project-finance obligations
    - Unknown downside if Horizon or compute commitments were financed
    - Could create hidden fixed obligations
    - Review financing agreements, leases, and guarantees
  - - Customer concentration and contract duration
    - Revenue quality cannot be assessed
    - A few lighthouse accounts can overstate stability
    - Request top-customer share, term length, and renewal schedule
  - - CAC / payback / sales cycle
    - GTM efficiency is opaque
    - Enterprise sovereign selling may be expensive and slow
    - Request funnel conversion and payback by segment
  - - Services mix and support burden
    - Hard to tell whether adoption is repeatable or bespoke
    - Heavy implementation can hide weak product-led economics
    - Break out implementation, support, and recurring platform revenue
  - - Run-rate effect of adverse Horizon developments
    - Potentially changes future capital need dramatically
    - Failed partner plans can invalidate prior cost assumptions
    - Update compute roadmap and capex expectations post-2026 reporting
  notes: Every row names a disclosure gap that materially changes underwriting; this chapter intentionally does not guess around these omissions.
