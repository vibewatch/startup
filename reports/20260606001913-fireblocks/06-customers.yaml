- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome
  - Limitation
  rows:
  - - ABN AMRO
    - Bank / tokenization
    - Digital-asset custody integrated into traditional systems; tokenized bonds for clients
    - Production with client deals
    - First Dutch bank to issue digital bonds; plans to extend toward atomic settlement
    - No disclosed contract value or transaction volume
  - - Worldpay
    - Payments / PSP
    - Stablecoin merchant settlement and treasury orchestration
    - Production
    - Built stablecoin settlement in weeks; T+0 settlement; 50% faster processing
    - No disclosed revenue captured by Fireblocks or merchant retention data
  - - Banking Circle
    - Bank / stablecoin issuer
    - MiCA-regulated EURI minting, burning, and token operations
    - Production launch
    - Automated mint/burn when fiat hits accounts; bank-issued stablecoin workflow
    - No published volume or customer uptake
  - - Wenia / Bancolombia Group
    - Bank-led retail fintech
    - Retail custody, staking, automation, and COPW issuance
    - Production launch
    - 16k+ verified users, $65M+ volume, 64% MoM growth as of Aug 2025
    - Early-stage metrics; long-term retention still unproven publicly
  - - Deribit
    - Crypto-native exchange
    - Wallet management across all assets plus Off Exchange
    - Production and expanded
    - Months of onboarding time saved; hundreds of operational hours saved
    - Self-reported outcomes from vendor case study
  - - Sygnum
    - Regulated digital-asset bank
    - Sygnum Protect off-exchange custody and collateral workflows
    - Production and expanded
    - Nearly four years of use; more capital allocated and more trading activity
    - No disclosed customer counts or revenue impact
  - - Bridge
    - Stablecoin payments infrastructure
    - Custody, transfers, token issuance, and programmable settlements
    - Production and expanding
    - Bulk settlements cut from 12+ hours to under 90 minutes
    - Specific major-customer volume not disclosed
  - - ANZ / BNY Mellon
    - Named bank references
    - A$DC stablecoin pilot for ANZ; digital custody infrastructure with BNY Mellon
    - Production reference, but thin scope detail
    - Shows Fireblocks can win major-bank logos and at least some live flows
    - Public detail is thinner than on Fireblocks’ full case studies
  notes: Enumeration is intentionally partial and focuses on customer proofs with enough deployment detail to evaluate production maturity.
  enumerationScope:
    coverage: partial
    basis: Sample of publicly retained named deployments spanning banks, payments, and crypto-native customers; not an exhaustive list of all 2,400 organizations.
