- id: named-customer-proof
  title: Named production proofs across banks, payments, and crypto-native customers
  body: 'The strongest evidence in Fireblocks’ customer chapter is not the topline count; it is the range of named production stories with measurable workflow outcomes. Bank-led proofs include ABN AMRO’s tokenized bonds and digital-asset custody, Banking Circle’s MiCA-regulated EURI issuance and automated mint-burn flow, Wenia and Bancolombia’s retail-facing crypto stack and peso-backed stablecoin, Boerse Stuttgart Digital’s MiCAR-compliant institutional custody rollout, and public ANZ and BNY references even where Fireblocks has not published a full case study. On the payments side, Worldpay and Bridge both cite concrete settlement-speed improvements, while Yellow Card shows corridor expansion. Crypto-native proof is also high quality: Deribit, Sygnum, Gemini, Bitso, and Bakkt describe durable, production-grade use of custody, off-exchange collateral, treasury automation, or proof-of-reserves. The quality difference is that some case studies are fresh and quantified while several bank references
    remain named but thin on contract scope or independent corroboration.'
