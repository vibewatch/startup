- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Custody to tokenization and stablecoin lifecycle
    - Bank logos may still be pilot or low-volume
    - Could overstate monetized bank penetration
    - Request ARR by product module and by bank customer stage
  - - Custody to off-exchange collateral and exchange connectivity
    - Crypto-native customers remain cyclical and can fail even if Fireblocks performs technically
    - Revenue could remain exposed to market stress and bankruptcies
    - Request current segment mix and top-20 revenue exposure
  - - Payments settlement and treasury orchestration
    - Payment vertical may depend on a few large anchor partners or corridors
    - High strategic value but uncertain concentration
    - Request top payment customers, corridor volumes, and renewal terms
  - - Retail-adjacent bank channels and app integrations
    - End-user adoption may sit with customer brand, not Fireblocks contract holder
    - Weak visibility into consumer retention and take rate
    - Request end-customer activity, contract structure, and reseller economics
  - - Review-driven reputation and security moat
    - Price and workflow complexity complaints can limit SMB or mid-market expansion
    - Could slow new-logo conversion outside large institutions
    - Request win/loss data by deal size and reason for loss
  - - Historical crypto-native exposure
    - Public sources show client exposure to Celsius, 3AC, Voyager, and broader contagion
    - Strong custody does not remove customer credit or business-model risk
    - Request current revenue split by crypto-native vs. banks / payments and top-customer loss history
  notes: Risk rows distinguish Fireblocks’ technical role from the operating and credit risk of the customers built on top of it.
  claimRefs:
