  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-disclosure
    missingEvidence: Segmented NRR, GRR, logo churn, contract length, and renewal-rate data for banks, payments, and crypto-native cohorts.
    whyItMatters: Without cohort or renewal data, public customer proof cannot be translated into durability, lifetime value, or true switching-cost confidence.
    diligencePath: Request board metrics or customer-ops dashboards showing renewals, expansion ARR, gross churn, and contract duration by segment.
    relatedQuestionRefs:
    - QU015
    - QU026
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Current revenue mix by crypto-native, banks, payments, and top-10 or top-20 customer exposure.
    whyItMatters: Historical sources show meaningful exposure to crypto-native customer risk, but retained public sources do not quantify how much of that concentration still exists.
    diligencePath: Request current ARR or revenue bridge by segment, largest customers, and loss history through the 2022-2025 crypto cycle.
    relatedQuestionRefs:
    - QU016
    - QU026
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: Broader dated and independently corroborated coverage of Fireblocks’ 2,400 organizations and 80+/95+ bank claims.
    whyItMatters: The named-customer proof table is intentionally selective; a wider and fresher proof set would reduce the chance of over-weighting a few strong vendor case studies.
    diligencePath: Expand the sample with additional retained current customer pages and independent corroboration for bank references before any full refresh.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: bank-scope-detail
    missingEvidence: Current deployment scope, contract economics, and product penetration for ANZ, BNY Mellon, and other named bank references without full case studies.
    whyItMatters: Major-bank logos materially improve perceived customer quality, but thin scope detail makes it hard to judge whether those logos are pilots, modules, or scaled programs.
    diligencePath: Request customer lists by bank, product module, go-live date, and current annualized revenue, plus any bank reference calls.
    relatedQuestionRefs:
    - QU004
    - QU024
    relatedTableRefs:
    - TU003
    - TU005
  - type: missing-source
    severity: minor
    topic: review-corpus-depth
    missingEvidence: Accessible third-party sources with cohort-level satisfaction, support SLAs, and renewal behavior beyond public review snapshots.
    whyItMatters: Current review data is useful for directional sentiment, but it does not show whether positive user experience translates into durable renewals across enterprise segments.
    diligencePath: Collect direct reference calls, CSAT or NPS data by segment, and customer-success SLA metrics during management diligence.
    relatedQuestionRefs:
    - QU013
    - QU015
    - QU027
    relatedTableRefs:
    - TU004
