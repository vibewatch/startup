    - label: Expansion or renewal checkpoint
      stage: Expand
      actors:
      - Leadership
      - Procurement
      - Finance
      touchpoints:
      - New modules
      - New corridors
      - Renewal terms
      emotion: Expansion is plausible, but public renewal economics remain the least visible step.
