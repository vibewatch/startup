    - label: Architecture selection
      stage: Evaluate
      actors:
      - Risk
      - Compliance
      - Security
      touchpoints:
      - MPC
      - Policy Engine
      - HSM or cloud model
      emotion: Procurement favors providers that fit existing controls and bank-grade governance.
    - label: Initial deployment
      stage: Launch
      actors:
      - Engineering
      - Ops
      - Front office
      touchpoints:
      - API integration
      - Wallet setup
      - Mint-burn or payout flows
