chapter:
  number: 6
  title: Customers
  summary: Fireblocks shows broad public customer breadth across banks, payments, and crypto-native digital-asset operators, with disclosed customer counts rising from 800 in early 2022 to 2,400 organizations on the current customer page. Named production proofs such as ABN AMRO, Worldpay, Banking Circle, Wenia, Deribit, and Sygnum are materially stronger than logo-only references, but public retention and concentration data remain thin and historical failures like Celsius and BlockFi show the platform does not eliminate customer business-model risk.
sections:
- id: segmentation-adoption
  title: Customer segmentation and adoption trajectory
  body: Fireblocks’ customer base is broader today than the company’s early narrative as a crypto-custody infrastructure provider. The current customer library spans bank-led tokenization and custody programs, payment-service and fintech settlement flows, crypto-native exchanges and off-exchange custody users, and retail-adjacent deployments that sit inside larger bank or exchange brands. The public adoption trajectory is also directionally strong. Calcalistech reported 800 customers in January 2022, Fireblocks’ own 2022 ARR press release said more than 1,500 organizations deployed the technology, and the current customer page now claims 2,400 organizations. Segment growth is not just a logo increase. Fireblocks’ public materials now also point to a larger bank footprint, from 50 banks previously brought into digital assets to 80+ banks on the banking page and 95+ banks in the 2026 Financial Grid blog. The caveat is that production depth lags budget commitment in bank-led segments, so bank
    count should be read as deployment funnel evidence rather than booked-revenue proof.
