- id: TU006
  title: Public customer-proof freshness and reference quality table
  columns:
  - Reference set
  - Latest public proof in retained corpus
  - Evidence quality
  - What it proves
  - What it still does not prove
  rows:
  - - ABN AMRO / Banking Circle / Boerse Stuttgart
    - Current Fireblocks customer stories
    - High for production use case; medium for economics
    - Bank-led tokenization and custody are live or near-live use cases
    - Revenue scale, contract size, and multi-year renewal quality
  - - Worldpay / Bridge / Yellow Card
    - Current Fireblocks customer stories
    - High for workflow outcomes
    - Stablecoin settlement and cross-border payments have measurable operational value
    - How much of customer payment volume actually runs through Fireblocks over time
  - - Wenia / Bancolombia Group
    - Current Fireblocks customer stories
    - High for freshness and launch metrics
    - Bank-led retail and stablecoin launches can reach end users
    - Long-term retention, monetization, and user-activity cohorts
  - - Deribit / Sygnum / Gemini / Bitso / Bakkt
    - Current Fireblocks customer stories
    - Medium to high for operational depth
    - Crypto-native and regulated-custody users employ Fireblocks in production
    - Net revenue retention and segment profitability
  - - ANZ / BNY Mellon
    - Older partner/news references
    - Medium for existence; low for current scope detail
    - Fireblocks can win top-tier bank logos and at least some live flows
    - Current deployment breadth, contract terms, and expansion status
  - - Review corpus (G2, PeerSpot, AWS, FeaturedCustomers)
    - 2025-2026 accessible review snapshots
    - Medium for sentiment, low for audited retention
    - Users value security, support, and governance; price and complexity are real objections
    - Whether positive review sentiment translates into strong renewals or low churn
  notes: This table scores reference quality and freshness, not customer value; it is the substitute exhibit for the planned cohort figure because no public cohort percentages were retained.
