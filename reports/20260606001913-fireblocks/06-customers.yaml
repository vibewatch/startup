- id: durability-retention
  title: Durability and public retention signals
  body: 'Public retention evidence exists, but it is much weaker than Fireblocks’ adoption and customer-proof evidence. The review corpus is directionally positive: G2 shows 4.7/5 across 51 reviews, PeerSpot shows 8.6/10, FeaturedCustomers lists a large reference base, and an AWS Marketplace review from Chiliz describes three years of use. Named customers also point to relationship durability: Sygnum cites nearly four years, Deribit says its deployment began in 2021 and expanded over time, and one G2 user describes nearly five years on the platform. Those are useful proxies for repeat usage and ongoing value, but they are not substitutes for NRR, GRR, churn, contract length, or renewal rates. Fireblocks’ public materials do not disclose those metrics. Review sources also surface real friction: price is a recurring complaint, some workflows are complex to configure, and certain enterprise environments want more flexibility. Investors should therefore treat public durability as positive-but-incomplete
    rather than proven at SaaS-quality precision.'
  claimRefs:
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
  - CU037
  tableRefs:
  - TU004
- id: expansion-concentration-risk
  title: Expansion logic, concentration, and adverse customer-quality caveats
  body: 'Fireblocks’ expansion logic is clear in public evidence: customers often start with custody or wallet management, then add tokenization, payments, off-exchange collateral, governance automation, or compliance tooling. That is strategically attractive because it deepens switching costs and moves Fireblocks into higher-value operational workflows. But public concentration data remains thin. Historical reporting shows Fireblocks reached substantial scale within the crypto cycle, and 2022 interviews still tied the company to a client base materially exposed to crypto-native market stress. The Celsius and BlockFi episodes are especially important. They do not show Fireblocks failing as a custody layer; they show that strong wallet security does not immunize customers from insolvency, leverage, bad underwriting, or ecosystem contagion. That distinction matters for underwriting Fireblocks’ customer quality. The company appears to be diversifying toward banks and payments, but without public
    top-customer, segment-mix, or renewal data, investors cannot yet fully separate healthy land-and-expand from cyclical crypto concentration.'
