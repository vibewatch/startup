- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Bank-led institutions
    - Digital-asset product, treasury, operations, risk / front-to-back control teams / bank budget
    - Custody, tokenization, stablecoins, settlement
    - 50 previously brought live; 80+ banks on page; 95+ banks in 2026 blog
    - Strategic wedge into regulated digital-asset rails and balance-sheet products
    - Public bank count exceeds public production-detail count
  - - Payments / PSP / fintech
    - Payments product, treasury, settlement ops / operations teams / payments P&L
    - Stablecoin settlement, merchant payouts, cross-border payments
    - 100+ payment companies; Worldpay, Bridge, Yellow Card
    - High throughput and strong expansion path from custody into payments orchestration
    - Public revenue contribution by payments segment is undisclosed
  - - Crypto-native exchanges / brokers / trading venues
    - Operations, treasury, exchange engineering / trading ops / exchange P&L
    - Wallet management, off-exchange collateral, treasury, proof-of-reserves
    - Deribit, Gemini, Bitso, Bakkt, Sygnum as production proofs
    - Historically core segment and still valuable for liquidity connectivity
    - Most cyclical customer segment; insolvency risk sits outside custody layer
  - - Retail-adjacent bank or app channels
    - Digital-asset product and compliance / end-user app teams / consumer-finance or banking P&L
    - Retail custody, trading, stablecoins, withdrawals
    - Wenia/Bancolombia, Revolut, Bitso
    - Shows Fireblocks can reach end users indirectly through regulated brands
    - Public end-user monetization and retention by channel remain opaque
  - - Tokenization / RWA issuers
    - Capital-markets or treasury innovation teams / issuers and servicing teams / issuer economics
    - Tokenized bonds, stablecoins, digital securities lifecycle
    - ABN AMRO, Banking Circle, Boerse Stuttgart, Wenia
    - Strategic proof that Fireblocks is not just exchange infrastructure
    - Many tokenization references are still pilot-scale or lightly quantified
  notes: Segments are grouped by buyer logic and operating model rather than by raw logo count.
