  topStrengths:
    - >-
      Real institutional scale: 2,400+ organizations including BNY Mellon, BNP Paribas, and Revolut; $10T+ in digital
      assets secured; 550M+ wallets managed.
    - >-
      Deep MPC-plus-SGX technical moat: patent-pending chip isolation differentiates from pure-software custody rivals;
      no major breach to date.
    - >-
      First-mover network effects among institutional custodians, exchanges, and payment providers create switching
      costs via integrated workflows and the Fireblocks Network.
    - >-
      Experienced cybersecurity-pedigreed founders with strong institutional market fit and a broad senior leadership
      team including ex-NY Fed CLO.
    - >-
      Favorable regulatory tailwinds: SEC Crypto Task Force, MiCA, and OCC digital-asset frameworks create demand for
      compliant institutional custody infrastructure.
  topRisks:
    - >-
      The $8B Series E mark implies 64x+ FY2024 revenue; secondary market at $5.43–$6.18/share signals material
      compression; no fresh primary round to validate the mark.
    - >-
      StakeHound lawsuit (2021, ~$75M ETH at issue) and Celsius bankruptcy dispute (March 2026, negligent key
      destruction alleged) represent unresolved litigation tail risk.
    - No disclosed ARR, gross margin, NRR, burn rate, runway, or audited financials since the 2022 fundraising cycle.
    - >-
      Regulatory risk: SEC SAB 121, OCC digital-asset custody rule, MiCA/DORA, and FATF travel-rule compliance create
      ongoing licensing and operational cost uncertainty.
    - >-
      Founder key-person risk: Michael Shaulov is the primary public face and strategic spokesperson; no succession plan
      is publicly documented.
  unresolvedGaps:
    - Management-certified FY2025 and FY2026 ARR, gross margin, operating margin, cash position, burn rate, and runway.
    - Cap table, liquidation preference stack, pro-rata rights, and any anti-dilution provisions from the Series E.
    - >-
      Current NRR, churn, and top-customer concentration; revenue mix across SaaS vs. volume-based vs. AUC-based revenue
      streams.
    - StakeHound litigation status, settlement probability, and Celsius bankruptcy claim resolution timeline.
    - >-
      IPO or exit preparation status: board discussions, banker engagement, auditor readiness, and Regulation S-K
      compliance gap assessment.
