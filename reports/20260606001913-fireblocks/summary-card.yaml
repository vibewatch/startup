summary:
  headline: >-
    Fireblocks is a real institutional digital asset infrastructure leader with verifiable enterprise scale, but the
    unchanged $8B Series E mark is indefensible at current 4–6x EV/revenue multiples implied by BitGo's IPO and
    Anchorage's financing, and the company's continued opacity on margins, NRR, and litigation resolution makes a
    research-more call the only defensible position.
