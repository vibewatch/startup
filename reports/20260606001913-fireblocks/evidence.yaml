evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Fireblocks' audited or management-reported revenue, gross margin, and ARR figures; the current $193 M estimate is
      an unverified third-party aggregate.
    whyItMatters: >-
      Revenue clarity is required to assess valuation multiples, growth rate, and the reasonableness of the $8 B
      primary-round valuation; without it, investors cannot determine whether the company is under- or over-valued.
    diligencePath: >-
      Request revenue, ARR, gross margin, and net revenue retention figures in management diligence; ask auditors for
      the most recent audited financial statements.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Full capitalization table showing all shareholder ownership percentages, preference stack, liquidation waterfall,
      anti-dilution provisions, and board seat allocation.
    whyItMatters: >-
      Governance and control risk cannot be quantified without knowing preference terms, blocking rights, and board
      composition.
    diligencePath: Request cap-table, shareholder agreement, and board minutes covering any material resolutions from 2022 to date.
    relatedQuestionRefs:
      - QO005
      - QO022
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: lawsuit-celsius
    missingEvidence: >-
      Court filings, complaint details, and damages quantification from the Celsius bankruptcy administrator's action
      against Fireblocks filed in New York bankruptcy court (March 2026).
    whyItMatters: >-
      Unquantified legal exposure is a contingent liability that could materially affect Fireblocks' balance sheet,
      insurance coverage, and institutional-client trust.
    diligencePath: >-
      Monitor PACER for the Celsius bankruptcy docket; request Fireblocks' counsel memo on the dispute and any
      indemnification or insurance coverage.
    relatedQuestionRefs:
      - QO017
