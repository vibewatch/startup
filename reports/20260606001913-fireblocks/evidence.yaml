      settled, been dismissed, or reached judgment since 2021.
    whyItMatters: >-
      A judgment against Fireblocks would crystallise damages and set a precedent for future key-management liability
      claims.
    diligencePath: >-
      Request current status from Israeli litigation counsel; ask Fireblocks management for the latest update and any
      reserve amounts recorded on the balance sheet.
    relatedQuestionRefs:
      - QO016
