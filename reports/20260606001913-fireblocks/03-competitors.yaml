- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor / path
  - Observed pricing or contract cue
  - Included capabilities
  - Disclosure opacity or caveat
  - Implication for Fireblocks
  rows:
  - - Fireblocks
    - Talk to sales; no public custody fee schedule
    - Wallets, payments, compliance, tokenization, off-exchange operations
    - Public site shows enterprise pricing motion, not list economics
    - Strong breadth, but buyers cannot benchmark price without a live process
  - - BitGo
    - Sales-led; no live public custody price card
    - Qualified custody, insurance, settlement, stablecoins, prime
    - Official pages emphasize contact motion and value props rather than rates
    - Wins on trust stack, but public pricing is not more transparent than Fireblocks
  - - Anchorage Digital
    - Sales-led; no public list pricing
    - Custody, trading, financing, settlement, staking, stablecoins
    - Charter and platform breadth are public, but pricing is not
    - Trust wrapper is strong, but price discovery still requires a sales cycle
  - - Copper
    - Sales-led; no public list pricing
    - MPC custody, ClearLoop, staking, treasury, derivatives, lending
    - Product value is clear, contract economics are not
    - ClearLoop is differentiated, but Fireblocks does not concede transparency here
  - - Coinbase Custody
    - $0-$10,000 implementation fee; 50 bps annual fee; $500,000 minimum balance
    - Segregated cold storage, regulated custody, insurance, audited statements, staking
    - Public schedule is still high level and use-case dependent
    - Coinbase gives procurement teams a cleaner price anchor than Fireblocks
  - - Gemini Custody
    - No set minimum balance; $30 per-asset monthly minimum; tailored plans by volume and holdings
    - Qualified custody, direct trading from cold storage, insurance, segregated addresses
    - No public percentage schedule on fetched pages
    - Gemini is more transparent than Fireblocks on minimum-fee posture, but not fully list priced
  - - Safe / self-custody
    - 0 AUM fees on the fetched comparison surface
    - Multisig treasury, roles, spending limits, portable accounts
    - Organization still absorbs signer, ops and compliance burden
    - Safe is the clearest low-fee substitute for technically capable teams
  notes: Public price disclosure is rare in this category. This table therefore mixes explicit price points, minimums, and contract-model cues rather than pretending every competitor exposes the same level of economic detail.
