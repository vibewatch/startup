callouts:
- calloutType: insight
  title: Fireblocks wins on breadth, not on charter optics
  body: Fireblocks’ public edge is the breadth of workflows it automates in one stack. The trust edge, however, sits more clearly with Anchorage, Coinbase, Fidelity, and bank-backed entrants that can present chartered or bank-grade wrappers to cautious institutions.
  claimRefs:
  - CP001
  - CP003
  - CP011
  - CP027
  - CP033
  - CP038
  - CP046
- calloutType: risk
  title: Multi-custodian norms weaken absolute lock-in
  body: Zodia’s own 2026 outlook says institutions are increasingly deciding how many custodians they need. That matters because Fireblocks’ switching costs are operationally real, but they can coexist with multi-homing, self-custody, and bank-wrapper combinations.
  claimRefs:
  - CP023
  - CP024
  - CP036
  - CP044
- calloutType: risk
  title: Public pricing is clearer for only a few rivals
  body: Coinbase Custody, Gemini, and Safe provide cleaner public fee anchors than most infrastructure-first peers. That does not prove they are cheaper in negotiated enterprise contracts, but it does give buyers leverage when they benchmark opaque vendor quotes.
  claimRefs:
  - CP028
  - CP030
  - CP036
  - CP043
