  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-discounts
    missingEvidence: Realized contract prices, implementation waivers, volume discounts, and renewal uplifts for Fireblocks, BitGo, Anchorage, Copper, and Zodia.
    whyItMatters: Public list pricing exists for only a subset of competitors, so pricing power and procurement risk cannot be underwritten from list pages alone.
    diligencePath: Request recent executed order forms or anonymized pricing schedules by segment and deployment size from management and compare them with current Coinbase and Gemini public anchors.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-and-migration-data
    missingEvidence: Published win-loss, migration, renewal, or churn data showing how often institutions move between Fireblocks and key alternatives.
    whyItMatters: Workflow lock-in and moat durability are hard to quantify without evidence on renewal behavior, lost deals, and multi-homing by customer type.
    diligencePath: Ask management for the last 12 months of competitive win-loss data, churn reasons, and named examples of customers that added or replaced another custodian.
    relatedQuestionRefs:
    - QP027
  - type: missing-source
    severity: material
    topic: multi-custodian-adoption-share
    missingEvidence: Quantified market share or buyer-share data showing what percentage of institutions now require multi-custodian or bank-led setups.
    whyItMatters: The qualitative evidence for multi-custodian adoption is strong, but the size and speed of that shift determine how quickly Fireblocks’ lock-in could weaken.
    diligencePath: Look for custody RFP data, consultant surveys, prime-broker or allocator surveys, or management telemetry on how many active customers use a second custodian or self-custody tool.
    relatedQuestionRefs:
    - QP028
