  title: Competitor profile table
  columns:
  - Competitor / path
  - Category
  - Scale / regulatory signal
  - Target segment
  - Differentiation
  - Key limitation for Fireblocks comparison
  rows:
  - - Fireblocks
    - Subject / crypto-native infrastructure
    - 2,400 enterprises; $10T transactions; 550M wallets secured
    - Banks, fintechs, exchanges, trading firms, financial institutions
    - Broadest public workflow stack across wallets, payments, compliance, tokenization and operations
    - No public list pricing and no public bank-charter wrapper on fetched surfaces
  - - BitGo
    - Direct peer / qualified custodian
    - OCC-chartered BitGo Bank & Trust; $250M insurance; operating since 2013
    - Institutions needing qualified custody, wallets, settlement and prime services
    - Qualified custody, cold storage, insurance and broad infrastructure menu
    - Public pricing remains sales-led rather than published
  - - Anchorage Digital
    - Direct peer / federally chartered bank
    - First federally chartered crypto bank in the U.S.; qualified custodian
    - Institutions prioritizing regulatory wrapper, custody, staking and settlement
    - Bank charter and trust posture
    - 2022 OCC consent order shows regulated status does not eliminate operational risk
  - - Copper
    - Direct peer / trading-led custody infrastructure
    - Institutional-only positioning; ClearLoop MPC custody and off-exchange settlement
    - Hedge funds, trading firms, exchanges, ETP providers, miners
    - ClearLoop off-exchange settlement and exchange connectivity
    - Public pricing is opaque and trust posture is less explicit than bank-chartered rivals
  - - Ledger Enterprise
    - Direct peer / hardware-rooted platform
    - 100+ institutions; 20% of world crypto; 30% of global stablecoin value secured
    - Institutions wanting hardware-enforced controls, tokenization and off-exchange trading
    - Hardware-enforced security plus tokenization and on-premise deployment
    - Less explicit public custody-pricing disclosure and bank-wrapper positioning than trust-company rivals
  - - Hex Trust
    - Direct peer / institutional custody and staking
    - $5bn AUC; 450+ clients; $500m+ monthly volume; up to $50M+ insurance
    - Institutional investors, banks and blockchain foundations
    - Regulated custody plus staking, payments and institutional wealth adjacencies
    - Public footprint is smaller than Coinbase, Fidelity or Fireblocks on disclosed scale breadth
  - - Zodia Custody
    - Direct peer / bank-backed custodian
    - Backed by Standard Chartered, SBI, Northern Trust and NAB; 75+ assets; 15+ jurisdictions
    - Financial institutions, asset managers, enterprises and governments
    - Bank-backed trust posture and white-label infrastructure for institutions
    - Public pricing is opaque and product breadth is more institution-specific than Fireblocks’ general workflow stack
  - - Coinbase Prime / Custody
    - Adjacent incumbent / prime brokerage plus custody
    - 12% of global crypto market cap under custody; 275+ tradeable assets; 240+ bank and broker partners
    - Institutions wanting one platform for custody, execution, financing and staking
    - Strong breadth plus unusual public price disclosure and partner distribution
    - More exchange and market-structure centric than pure wallet-operations stacks
  - - Gemini Custody
    - Adjacent regulated custodian
    - New York qualified custodian; $100M cold storage insurance; no set minimum balance; $30 per-asset monthly minimum
    - Institutions prioritizing regulated cold storage and direct trading from cold storage
    - Segregated verifiable custody with public fee-floor disclosure
    - Narrower workflow breadth than Fireblocks, Coinbase or BitGo
  - - Fidelity Digital Assets
    - Incumbent bank-grade custodian
    - OCC national trust bank charter in 2025; annual SOC 1/SOC 2 audits; 75+ years finance heritage
    - RIAs, family offices, treasurers, hedge funds, banks and broker dealers
    - Traditional-finance brand, integrated custody/trading and bank trust wrapper
    - Product menu is institutionally focused and less developer-forward than Fireblocks
  - - Kraken Custody
    - Adjacent exchange-linked alternative
    - 14+ years of operations; 99.9% uptime; 550+ assets on platform; 200+ in custody
    - Institutions wanting custody integrated with trading, financing and staking
    - Exchange-linked liquidity and trade-from-custody workflow
    - Public regulatory posture is weaker than federally chartered or bank-backed competitors
  - - Safe / self-custody multisig
    - Status quo substitute / self-custody
    - $1T+ processed; 57M+ wallets deployed; $60B+ secured; 0 AUM fees
    - Onchain treasuries, DAOs and technically capable organizations
    - Open-source, portable, no-vendor-lock-in multisig and treasury controls
    - No managed qualified-custodian wrapper or outsourced operational support
  - - Bank internal build / G-SIB entrant path
    - Likely entrant / build alternative
    - BNY says it is first G-SIB in regulated digital asset custody; Citi markets CIDAP custody and tokenization; State Street planned 2026 entry
    - Banks, broker dealers and large institutions wanting embedded digital asset infrastructure
    - Distribution power, regulatory trust and ability to embed custody inside broader banking stack
    - Longer delivery cycles and more internal program complexity than buying Fireblocks directly
  notes: >-
    This table is exhaustive for the material alternatives explicitly assessed for
    Fireblocks’ institutional custody and wallet-infrastructure job: direct
    crypto-native peers, regulated incumbents, self-custody substitutes, and
    bank-led entrant paths.
  enumerationScope:
    coverage: exhaustive
    basis: Exhaustive for the material alternatives explicitly assessed in this chapter for institutional digital asset custody, wallet infrastructure, self-custody substitutes, and bank-led entrant paths named in the brief.
