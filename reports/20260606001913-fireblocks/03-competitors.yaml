- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat or adverse evidence
  - Severity
  - Evidence-backed implication
  - Diligence ask
  rows:
  - - Workflow breadth across custody, payments, compliance and operations
    - Chartered or bank-backed rivals can neutralize trust objections while matching more of the workflow stack over time
    - High
    - Fireblocks is broad, but regulatory-wrapper strength is stronger at Anchorage, Coinbase, Fidelity, BNY and bank entrants
    - Ask for recent win-loss data segmented by charter-sensitive buyers and banks
  - - Operational lock-in through policy engine, APIs and connected workflows
    - Multi-custodian policies and self-custody options mean workflow friction does not equal monopoly control
    - High
    - Zodia expects multi-custodian norms and Safe offers portable self-custody without AUM fees
    - Measure how many customers already run Fireblocks alongside another custodian or self-custody stack
  - - Compliance and controls as a differentiation layer
    - Zodia argues real-time reconciliation, proof-of-reserves and embedded compliance are becoming baseline expectations
    - High
    - Compliance-by-design is drifting toward table stakes rather than a unique premium layer
    - Test whether Fireblocks still wins when every finalist offers baseline compliance, reporting and audit evidence
  - - Crypto-native lead versus banks
    - BNY, Citi and State Street show that large institutions are willing to build or launch their own digital asset infrastructure
    - High
    - Bank entrants can use existing distribution, trust and capital-markets relationships to compress standalone vendor share
    - Quantify pipeline exposure to banks, broker dealers and other regulated institutions considering internal build
  - - Trust posture relative to peers
    - OCC’s 2022 consent order against Anchorage proves regulated wrappers can still stumble operationally
    - Medium
    - Trust is not binary; both crypto-native and chartered platforms must keep proving controls and supervision quality
    - Review Fireblocks’ own control evidence against bank-grade diligence checklists, not marketing labels
  - - Pricing power
    - Coinbase, Gemini and Safe provide clearer public pricing anchors than most crypto-native platforms
    - Medium
    - Opaque enterprise pricing creates benchmark risk when buyers pressure vendors for concessions
    - Request current quote ranges, realized discounts and renewal uplifts by segment
  notes: Severity is an underwriting view. High means the threat can narrow Fireblocks’ differentiation without requiring Fireblocks to fail operationally; Medium means the threat matters but still depends on buyer type and execution.
