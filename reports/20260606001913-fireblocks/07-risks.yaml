- id: TR007
  title: Regulatory horizon
  columns:
  - Regime
  - Status
  - What changes for Fireblocks or customers
  - Residual risk
  - Monitoring trigger
  rows:
  - - SEC / state-trust custody pathway
    - No-action clarity plus dissent
    - May support adviser and fund use of state trust custodians while still inviting extra legal diligence
    - Interpretive basis could narrow or be challenged
    - SEC speeches, rulemaking, or court action
  - - MiCA
    - Active EU framework
    - Raises authorization, disclosure, governance, and supervision expectations for crypto-asset services
    - Can slow EU expansion if permissions or partners lag
    - ESMA guidance and partner authorization status
  - - DORA
    - In force
    - Adds ICT resilience, incident-reporting, testing, and outsourcing expectations across financial institutions
    - Operational-resilience burden may rise for vendors and buyers
    - Customer due-diligence questionnaires and contract addenda
  - - FATF Travel Rule / AML
    - Global guidance remains active
    - Expands cross-border data-sharing, sanctions, and monitoring duties
    - Payment scaling can raise compliance cost
    - Travel Rule tooling, VASP screening, corridor restrictions
  - - APAC local licensing
    - Fragmented
    - Requires jurisdiction-by-jurisdiction entity and control design
    - Delays rollout in some markets
    - MAS, SFC, and local policy updates
  notes: The horizon table focuses on regimes likely to alter sales cycles, compliance cost, or qualified-custody comfort over the next 12-24 months.
