- id: governance-valuation-and-kill-criteria
  title: Governance, valuation, liquidity, and kill criteria
  body: Governance risk is moderate, not fatal. Fireblocks shows a broad executive bench, but the company remains founder-led and legal/regulatory narratives still name senior founders or executives as relevant knowledge holders. The sharper investor risk is valuation and liquidity. Forbes' $124 million 2024 revenue and unprofitability, the legacy $8 billion mark, and private secondary indications without public share-price discovery all make downside repricing plausible even if product strategy works. The risk register therefore needs explicit kill criteria. Thesis-break triggers include loss of qualified-custody status, regulator action against custody controls, a new Fireblocks-caused key-loss event, unresolved production outage affecting asset access, undisclosed legal reserve exposure, or secondary-market evidence that materially contradicts the last round. Absent those events, the right mitigant is not complacency; it is data-room verification before pricing residual risk.
