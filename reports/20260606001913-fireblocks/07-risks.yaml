    - U.S. / NYDFS / SEC
    - NYDFS-listed trust company plus SEC no-action pathway
    - Medium
    - High
    - Maintain trust-company controls, segregation, audited custody evidence
    - SEC dissent and rule changes could narrow reliance
    - Review trust charter, regulator correspondence, SOC 1/SOC 2, and custody agreements
  - - State-trust custody challenge
    - U.S. SEC
    - Commissioner dissent says no-action relief weakens protections
    - Medium
    - High
    - Document bank-equivalent controls and client asset segregation
    - Investor advisers may require extra legal opinions
    - Obtain counsel memo on adviser/fund custody acceptability
  - - MiCA / EU CASP compliance
    - EU
    - MiCA framework active through ESMA implementation
    - Medium
    - Medium-high
    - Use regulated local partners and auditable compliance workflows
    - Customer or partner authorization failures could slow EU growth
    - Map EU entity, CASP permissions, DORA and outsourcing controls
  - - StakeHound litigation
    - Israel
    - StakeHound alleged $75M / 38,178 ETH loss; Fireblocks denied wrongdoing
    - Low-medium
    - High
    - Separate non-production BLS issue from core MPC platform, preserve legal defense
    - Adverse ruling would damage custody trust
    - Request docket status, reserves, insurance notice, settlement discussions
  - - Celsius discovery request
    - U.S. bankruptcy
    - 2026 reporting says administrator sought discovery over alleged 25,000 ETH keys
    - Medium
    - Medium-high
    - Produce discovery or narrow scope; document chronology
    - May create legal cost, deposition, and reputational overhang
    - Review court filings, subpoenas, response deadlines, and indemnity exposure
  - - NYDFS custody/in-solvency obligations
    - New York
    - NYDFS guidance stresses customer protection by VCE custodians
    - Medium
    - High
    - Client segregation, books/records, estate-remoteness controls
    - Regulator scrutiny if client assets are commingled or unclear
    - Test account segregation, insolvency legal opinions, customer disclosures
  - - SEC custody-policy evolution
    - U.S. federal
    - Crypto Task Force continues custody-policy work
    - Medium
    - Medium
    - Engage regulators and standard-setters
    - Future rules could require incremental controls or disclosures
    - Track SEC agenda, comment letters, and task-force outputs
  - - Privacy/data handling
    - Global
    - Fireblocks docs discourage PII transmission
    - Low-medium
    - Medium
    - UUID-only implementation and client-side mapping
    - Client misuse can create privacy incident despite platform policy
    - Audit API payloads and data-processing agreement
