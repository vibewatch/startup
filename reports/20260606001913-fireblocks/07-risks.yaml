- id: TR005
  title: Mitigation and kill criteria
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Qualified-custody impairment
    - Regulator or legal opinion changes
    - NYDFS status impaired, SEC no-action reliance narrowed, or adviser counsel rejects custody path
    - Re-rate regulatory risk to critical and pause investment
  - - Key-management incident
    - Confirmed Fireblocks-caused key loss or failed recovery drill
    - Any unrecoverable customer asset event tied to production controls
    - Thesis break unless fully remediated with third-party audit
  - - Litigation overhang
    - StakeHound or Celsius discovery worsens
    - Adverse ruling, material settlement, or executive deposition revealing control weakness
    - Require legal reserve and discount valuation
  - - Outage reliability
    - Status incidents escalate
    - Customer asset access impaired for a material period or repeated unresolved chain delays
    - Require SLA/postmortem package and downgrade operational score
  - - Market cyclicality
    - Customer health / volume stress
    - Major exchange/lender customer failures or sharp transaction-volume contraction
    - Stress revenue assumptions and retention quality
  - - Competitive disintermediation
    - Bank or custodian competitors win regulated mandates
    - Loss of flagship bank/payment customers or price pressure below enterprise plan economics
    - Lower moat and pricing-power score
  - - Valuation/liquidity
    - Secondary and financing evidence weakens
    - Secondary marks materially below last round with no ARR bridge or IPO path
    - Do not underwrite old $8B anchor
  - - Governance/key person
    - Founder or senior legal/security leadership disruption
    - CEO/CPO/CISO/CLO departure amid litigation or regulator scrutiny
    - Require succession plan and customer-reference checks
  notes: Kill criteria are evidence-linked triggers for investor action; thresholds should be refined in management diligence.
