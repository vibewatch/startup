chapter:
  number: 7
  title: Risks
  summary: Fireblocks’ top residual risks are regulatory/legal exposure, disputed key-management litigation, valuation/liquidity overhang, and market/counterparty cyclicality. NYDFS trust status, SEC no-action clarity, security certifications, and off-exchange settlement are meaningful mitigants, but adverse legal and regulatory sources keep the risk rating high until management diligence verifies controls, insurance, incident history, and current valuation support.
sections:
- id: ranked-risk-register
  title: Severity-ranked risk posture
  body: Fireblocks' risk profile is not a generic SaaS list; it is a custody-infrastructure risk stack where legal trust, operational key control, regulator confidence, customer counterparty health, and valuation discipline all interact. The highest residual risks are regulatory/legal, operational key-management, and valuation/liquidity. NYDFS status, the Fireblocks Trust qualified-custody narrative, SOC certifications, and SEC engagement are meaningful mitigants, but they do not eliminate the downside exposed by StakeHound, the Celsius discovery request, SEC dissent over state-trust custody, and thin public monetization proof. The investment implication is therefore risk-gated rather than binary. Fireblocks can be a strategically important winner while still requiring hard diligence on legal reserves, custody segregation, insurance, incident history, and current financial marks before risk is priced as manageable.
