- id: TR008
  title: Downside scenario analysis
  columns:
  - Scenario
  - Trigger
  - First-order impact
  - Second-order impact
  - Mitigation
  - Investment implication
  rows:
  - - Adverse legal ruling or damaging discovery
    - StakeHound/Celsius record worsens materially
    - Custody trust and enterprise sales slow
    - Higher reserves, insurance scrutiny, and customer diligence burden
    - Use counsel, reserves, insurance, and transparent remediation
    - Reprice risk rating upward and defer investment
  - - Regulatory narrowing of custody pathway
    - Loss of NYDFS/SEC reliance or tougher guidance
    - Some institutional mandates pause
    - EU/U.S. compliance costs rise and sales cycles stretch
    - Legal opinions, control enhancements, partner structuring
    - Demand lower entry price or wait
  - - Operational control failure
    - New unrecoverable asset-loss or severe production incident
    - Customer confidence shock
    - Competitive displacement and litigation tail
    - Independent incident review and control rebuild
    - Treat as thesis break until resolved
  - - Bank internal-build acceleration
    - Large banks scale proprietary rails like Kinexys
    - Neutral platform share narrows in top-tier accounts
    - Margins compress even if category grows
    - Differentiate on multi-network interoperability and ecosystem reach
    - Model lower upside and slower share gain
  - - Execution drag from acquisitions
    - Dynamic/TRES integration slips or support burden rises
    - Operating complexity and roadmap slippage
    - Lower product focus and higher cost base
    - Integration PMO, platform rationalization, customer communication
    - Increase execution discount in valuation work
  notes: Scenarios are qualitative stress cases tied to monitorable events rather than to a probabilistic VaR model.
