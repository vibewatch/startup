  - id: cost-structure-and-profitability
    title: Cost structure, gross margin path, and profitability signals
    body: >
      Fireblocks described FY2024 revenue of $124M to Forbes but remained unprofitable. This is
      consistent with a scaling infrastructure company that has invested heavily in sales, engineering,
      and now M&A. The cost base has three likely components: (1) R&D and engineering for platform and
      product expansions across 120+ blockchains, the Policy Engine, DeFi integrations, and now TRES
      and Dynamic integrations; (2) commercial and sales headcount across 8 global offices to support
      the 2,400-client enterprise base; (3) regulatory and compliance overhead from the NYDFS Trust
      Company charter, SEC engagement, and multi-jurisdictional compliance infrastructure.

      No gross margin figure has been disclosed. For a SaaS infrastructure business without significant
      COGS other than cloud hosting and support, gross margins at this scale typically run 60–75% for
      pure software segments. The AUC and transaction-volume fee components add service delivery cost
      (custody operations, insurance, key management). The Trust Company custody segment likely has
      lower margins than pure SaaS. The 16-month ROI payback cited in G2 reviews implies reasonable
      unit economics for buyers, but that is not the same as Fireblocks' own margin. Two consecutive
      acquisitions and an expanded Trust Company operation suggest operating losses will persist through
      at least 2026 while integration costs are absorbed.
    claimRefs:
      - CI002
      - CI003
      - CI009
      - CI010
      - CI029
      - CI031
      - CI037
      - CI038
      - CI042

  - id: evidence-gaps-and-financial-verdict
    title: Evidence gaps and financial verdict
    body: >
      The public record supports a strong revenue engine — $124M FY2024 revenue at 2,200+ enterprise
      institutions, with a hybrid subscription + volume + AUC fee model that grows with client
      onboarding and digital asset transaction flow. The business is capital-efficient in its GTM (no
      disclosed CAC crisis, recurring revenue, enterprise stickiness) but is deliberately pre-profitable,
      investing through product, M&A, and regulatory infrastructure buildout. The risk to underwriters
      is not revenue quality but capital adequacy visibility: with $1B raised, $130M spent on TRES, and
      an unknown Dynamic price, cash runway is partially consumed and unknowable without management
      disclosure. The NYDFS Trust Company charter imposes minimum capital requirements that are publicly
      opaque. No debt is confirmed, but absence of evidence is not evidence of absence.

      Revenue quality is strong: enterprise contracts are multi-year, sticky, and linked to growing
      digital asset volumes. Price risk exists — G2 and PeerSpot reviewers flag cost as a barrier for
      smaller clients, suggesting a natural size floor and potential mid-market competitive vulnerability.
      Gross margin is unverified; the blended SaaS+custody model likely runs below pure-SaaS benchmarks.
      The $8B valuation anchor (January 2022) has not been re-priced publicly; in a market where crypto
      infrastructure multiples compressed substantially in 2022–2023, the 2022 mark likely overstates
      current fair value absent a new primary round. Overall: a financially maturing, strategically
      expanding, pre-profitable infrastructure company with strong top-line signals but material private
      gaps that block full underwriting confidence.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI032
      - CI034
      - CI039
      - CI040
    tableRefs:
      - TI005

