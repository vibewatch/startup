      - TI003
    figureRefs:
      - FI002

  - id: capital-structure-and-acquisitions
    title: Capital structure, funding history, and M&A spend
    body: >
      Fireblocks has raised approximately $1B in total venture funding across five disclosed rounds:
      Series A ($16M, Cyberstarts/Tenaya/Eight Roads/Swisscom, 2019), Series B ($30M), Series C (~$133M
      at $1B valuation), Series D ($310M), and Series E ($550M at $8B valuation led by D1 Capital
      Partners, January 2022). The $8B valuation has not been refreshed in public sources since 2022;
      secondary market activity is confirmed by a Form D filed in May 2023 by Leyden Opportunities Fund
      for a series named "Fireblocks Feb 23," implying continued investor interest but no new primary
      round. No IPO filing or explicit path to liquidity has been announced as of June 2026.

      Capital deployment has accelerated via acquisitions. TRES Finance was acquired for $130M in
      January 2026, adding crypto accounting and reconciliation capabilities. Dynamic was acquired in
      late 2025 for an undisclosed amount, adding consumer-facing embedded wallet technology. Combined,
      the two acquisitions represent at minimum $130M+ in near-term capital deployment, likely from the
      $1B war chest. No credit facility, project-finance arrangement, or debt structure has been
      publicly disclosed. Runway and cash-on-hand remain private. The Trust Company charter imposes
      capital adequacy requirements under NYDFS bank-equivalent supervision, creating an ongoing
      regulatory capital obligation that is separate from operating burn.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI017
      - CI018
      - CI025
      - CI033
      - CI035
