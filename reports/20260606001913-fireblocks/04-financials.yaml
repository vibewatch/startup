callouts:
  - calloutType: risk
    title: Unprofitable at $124M revenue — capital dependency unresolved
    body: >
      Forbes reported that Fireblocks booked $124M in revenue in FY2024 but remained unprofitable.
      With $130M+ deployed on the TRES acquisition and an unknown Dynamic price, the funding buffer
      from the 2022 Series E is meaningfully reduced. Without a new primary round or path to
      profitability, financing dependency is the dominant financial risk for underwriters.
    claimRefs:
      - CI002
      - CI003
      - CI017

  - calloutType: strength
    title: Enterprise SaaS + AUC fee model provides strong recurring revenue quality
    body: >
      The combination of annual subscription contracts, volume overage fees, and KeyLink AUC fees (3–30
      bps) creates a revenue base that grows organically with both the number of institutional clients
      and the value of digital assets those clients move and custody. The Enigma Securities 267x
      volume-growth case study illustrates the compounding nature of the variable fee layer.
    claimRefs:
      - CI014
      - CI015
      - CI019
      - CI031

  - calloutType: risk
    title: Pricing creates natural SMB exclusion — competitive vulnerability below enterprise threshold
    body: >
      G2 and PeerSpot reviewers consistently flag Fireblocks' annual licensing fees as a barrier to
      smaller institutions. This creates a de-facto size floor and may leave mid-market and lower-tier
      exchange segments available to lower-cost competitors such as BitGo or Anchorage Digital, even
      if Fireblocks retains top-tier accounts.
    claimRefs:
      - CI022
      - CI023

  - calloutType: insight
    title: Trust Company charter introduces regulatory capital obligation and competitive duality
    body: >
      By obtaining an NYDFS limited-purpose trust charter, Fireblocks now both provides custody
      technology and competes as a custodian, putting it in partial competition with early backers
      and anchor clients like BNY Mellon. The capital reserve requirement of the charter imposes an
      ongoing balance sheet cost that is opaque to outside investors.
    claimRefs:
      - CI025
      - CI026
      - CI034

