slug: fireblocks
runDate: '2026-06-06'
company:
  name: Fireblocks
chapter:
  number: 4
  title: Financials
  summary: >
    Fireblocks generated $124M in revenue in FY2024 but remained unprofitable, signalling continued
    investment-phase spending. Its hybrid SaaS + volume/AUC fee model is clearly articulated on the
    official pricing page, and $1B in cumulative funding at an $8B valuation (Jan 2022) provides a
    meaningful capital buffer. Two acquisitions in late 2025–early 2026 (Dynamic, TRES at $130M) add
    near-term cost pressure. Revenue quality is strong — recurring, diversified, enterprise-anchored —
    but gross margin, cash position, burn rate, and NRR remain undisclosed, blocking full underwriting.

sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing visibility
    body: >
      Fireblocks operates a hybrid software and infrastructure monetisation model combining three
      disclosed fee structures. First, a subscription platform fee tied to annual plans, with a base
      outbound volume threshold of $1M; volumes above that threshold incur a 0.20% overage rate. Second,
      the KeyLink collateral management product charges 3–30 basis points on assets under custody (AUC),
      introducing a recurring AUC-linked revenue stream that scales with institutional balance sheet
      deployment. Third, the Embedded Wallets tier charges per-wallet at scale, with the base plan
      including 1,000 Embedded Wallets; enterprise plans and custom pricing are available for larger
      deployments. The company described itself to the SEC as "a technology company that licenses a
      proprietary software-as-a-service (SaaS) platform to institutions," confirming the subscription
      origin of most revenue. In practice, the business straddles SaaS and infrastructure pricing:
      subscription platform access with volume and AUC components layered on top.

      What is not publicly disclosed: realised average contract value (ACV), take rates on transaction
      volume, commission economics with liquidity provider partners, accounting treatment for gross vs.
      net presentation of customer asset flows, and revenue mix across the three fee types. The official
      pricing page lists the outbound volume model explicitly, but the list price is not the realised
      price for large institutional clients, which negotiate bespoke agreements. Revenue recognition for
      the Trust Company custody business may differ from software licensing revenue.
    claimRefs:
      - CI001
      - CI014
      - CI015
      - CI016
      - CI028
      - CI031
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001

  - id: traction-and-gtm-efficiency
    title: Customer traction and GTM efficiency proxies
    body: >
      Fireblocks serves 2,200–2,400 institutional organisations across exchanges, banks, fintechs,
      payment providers, and stablecoin issuers. The customer base includes Worldpay, BNY Mellon, BNP
      Paribas, Galaxy, and Revolut. Over $10 trillion in digital assets has been secured across 100+
      blockchains, and 550+ million wallets are managed on the platform. On the payments side, 100+
      payment companies use Fireblocks to settle approximately 1.5 million transactions worth over $10B
      per month. The Enigma Securities case study illustrates the platform's upsell potential: a single
      broker-dealer grew quarterly transaction volume from $30M to $8B after onboarding — a 267x
      increase that also expands the variable fee component.

      GTM is enterprise sales-led with a developer and partner layer. Fireblocks sells direct to
      financial institutions and fintechs, with professional services and a partner ecosystem (40+
      stablecoin providers, on/off-ramp networks, liquidity providers) creating network-effect lock-in.
      No public CAC, payback period, or NRR data is available. G2 and PeerSpot reviews indicate an ROI
      payback estimate of 16 months from implementation to positive return, suggesting capital-efficient
      sales motion for buyers — but high list prices create a size threshold below which the product is
      prohibitive. PeerSpot user feedback cites annual licensing fees as "quite high for institutions"
      and a "massive line item in operational budget," which constrains the SMB and lower-tier-exchange
      segment.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
      - CI036
      - CI041
