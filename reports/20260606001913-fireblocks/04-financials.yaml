  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: Segment gross margin (SaaS vs. custody vs. volume fee), blended gross margin percentage, and COGS breakdown for any fiscal year
      whyItMatters: Without gross margin, it is impossible to assess unit economics, margin trajectory, or path to profitability; the hybrid SaaS+custody model may depress blended margins well below pure-SaaS benchmarks
      diligencePath: Request audited P&L with gross margin line by segment from management; benchmark against BitGo, Anchorage Digital comparables where available
      relatedQuestionRefs:
        - QI009
        - QI021

    - type: private-evidence-only
      severity: blocking
      topic: cash-burn
      missingEvidence: Monthly net cash burn, total cash and equivalents on balance sheet, and runway calculation as of most recent quarter
      whyItMatters: With $130M+ deployed on acquisitions and an unknown Dynamic price, the capital buffer from the 2022 Series E is partially consumed; without cash and burn, financing dependency cannot be assessed
      diligencePath: Request balance sheet and cash flow statement from management; verify absence of credit facility; confirm use of funds from Series E
      relatedQuestionRefs:
        - QI015

    - type: private-evidence-only
      severity: material
      topic: recurring-revenue-quality
      missingEvidence: ARR, NRR, and logo churn for any fiscal year
      whyItMatters: Revenue quality and growth durability depend heavily on retention; for an enterprise SaaS platform, NRR below 100% would signal churn risk at scale despite impressive headline revenue
      diligencePath: Request ARR cohort waterfall, logo and dollar churn rates, and net expansion revenue from management
      relatedQuestionRefs:
        - QI013
        - QI023

    - type: missing-source
      severity: material
      topic: dynamic-acquisition-price
      missingEvidence: Purchase price, consideration mix (cash/stock), and earnout provisions for the Dynamic acquisition
      whyItMatters: Together with TRES ($130M), total M&A spend determines how much of the 2022 war chest remains; unknown Dynamic price creates material capital adequacy uncertainty
      diligencePath: Request purchase price allocation from management; check any acquisition press release for deal terms; review any SEC beneficial-ownership or filing disclosures
      relatedQuestionRefs:
        - QI011

    - type: private-evidence-only
      severity: material
      topic: trust-company-capital
      missingEvidence: NYDFS minimum capital requirement for the trust charter and current equity capitalisation of Fireblocks Trust Company, LLC
      whyItMatters: State trust charters impose ongoing capital adequacy standards; this creates a balance-sheet obligation that is opaque from external sources and reduces available operating capital
      diligencePath: Request NYDFS approval letter and minimum capital schedule; obtain most recent audited financials for Fireblocks Trust Company, LLC as a regulated entity
      relatedQuestionRefs:
        - QI016

    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: Revenue split between subscription, volume-overage, AUC/KeyLink, and custody service fees
      whyItMatters: Recurring subscription revenue has higher quality (predictable, sticky) than volume-based fees (cyclical, crypto-market-correlated); without mix, revenue defensibility is unverifiable
      diligencePath: Request revenue segmentation by fee type from management; ask separately for recurring vs. variable revenue share
      relatedQuestionRefs:
        - QI008

    - type: private-evidence-only
      severity: material
      topic: fy2025-revenue
      missingEvidence: FY2025 revenue, operating loss, and any disclosed growth rate over FY2024
      whyItMatters: FY2024 is the last public data point; trend is critical to assess whether the company is on a credible path to profitability or is burning through capital at an increasing rate
      diligencePath: Request FY2025 management accounts or audited financials; ask for management guidance on FY2026 run rate
      relatedQuestionRefs:
        - QI023

