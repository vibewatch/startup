runDate: '2026-06-06'
company:
  name: Fireblocks
chapter:
  number: 8
  title: Valuation
  summary: Fireblocks is a real institutional crypto-infrastructure leader, but the unchanged $8 billion Series E mark is difficult to defend on current public evidence. Secondary-market indications in the mid-$5 to low-$6 per share range, Forbes’ $124 million 2024 revenue figure, and public/private comp discipline from Coinbase, BitGo, Anchorage, and Circle all point to substantial multiple compression from the 2021-2022 peak. The correct call is research-more with medium confidence, high risk, and a stretched valuation stance until management discloses current ARR, margins, cap-table terms, and a credible exit-preparation path.
sections:
- id: series-e-financing-context
  title: Series E financing context
  body: 'Fireblocks still enters valuation work through a January 2022 lens. The verified primary anchor is the $550 million Series E at an $8 billion valuation co-led by D1 Capital Partners and Spark Capital. Forbes’ current company profile still repeats that $8 billion mark and also says Fireblocks generated $124 million of revenue in 2024 while remaining unprofitable. That combination matters because it turns the historical round from a prestige fact into a valuation problem: on the last public revenue denominator, the old mark implies roughly 64.5x revenue, and even a more generous working 2026 ARR assumption of about $156 million still implies roughly 51x ARR. Current secondary pages do not confirm a fresh up-round. Nasdaq Private Market showed $6.18 per share in late May 2026 and Hiive showed about $5.43 per share with live orders in early June. Those pages are not full valuation proofs because share count and preference terms remain private, but they do show liquidity discovery happening
    below the confidence level that usually accompanies a clean new primary round or IPO process.'
  claimRefs:
