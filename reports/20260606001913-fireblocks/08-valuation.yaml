- id: comparable-company-valuation-analysis
  title: Comparable company valuation analysis
  body: 'The comparable set is directionally clear even if no perfect public analogue exists. Coinbase is the most visible public crypto platform with institutional custody exposure, and its June 2026 snapshot is instructive: about $40.15 billion of market cap against $6.56 billion of trailing revenue and $7.18 billion of FY2025 revenue, or roughly 5.6x to 6.1x sales. Coinbase Prime also explicitly markets qualified-custodian infrastructure, which makes it broader than Fireblocks but still relevant. BitGo is the closer business-model comp because its official positioning spans custody, wallets, financing, stablecoins, and settlement, and its January 2026 IPO created real public price discovery. By June 2026, multiples.vc showed BitGo at about $957 million EV, $209 million LTM revenue, and 4.6x EV/revenue. Anchorage is a valuable private comp because the February 2026 Tether investment valued it at $4.2 billion while the OCC charter carries enforceable capital and liquidity requirements.
    Circle is not a custody peer, but its filed quarterly results show the disclosure and profitability bar public investors can underwrite in crypto infrastructure. Against that set, Fireblocks looks strategically important but still dramatically over-anchored to the 2022 private-market environment.'
