  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue-bridge
    missingEvidence: Current ARR or revenue run-rate by quarter from FY2024 through the latest 2026 period.
    whyItMatters: The core valuation dispute is denominator uncertainty; without a current revenue bridge the scenario table remains a judgment band rather than an underwritten model.
    diligencePath: Request CFO finance pack, latest board deck, and a monthly revenue bridge by product line.
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Fully diluted share count, share classes, liquidation preferences, and any side-letter protections tied to recent financings or secondary programs.
    whyItMatters: Secondary per-share indications cannot be translated into enterprise or common-equity value without the denominator and preference stack.
    diligencePath: Request cap-table export, charter summary, and counsel memo on liquidation waterfalls.
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: margin-and-burn
    missingEvidence: Gross margin by product family, EBITDA or operating loss, current cash balance, and burn rate.
    whyItMatters: Public markets can support crypto infrastructure, but they reward high-quality revenue and improving profitability rather than scale alone.
    diligencePath: Request management accounts, latest balance sheet, and bridge from gross profit to EBITDA.
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Top-customer concentration, NRR, churn, and cohort expansion by segment.
    whyItMatters: A 2,400-customer headline supports the thesis only if revenue is diversified and cohorts expand without heavy discounting.
    diligencePath: Request revenue-ops cohort tables, top-20 customer schedule, and segment-level retention metrics.
    relatedTableRefs:
    - TV002
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation table coverage
    missingEvidence: More disclosed revenue and profitability data for direct private custody peers beyond the retained BitGo, Anchorage, and Circle anchors.
    whyItMatters: The comparable valuation table is intentionally partial because most direct private peers do not publish enough economics for clean like-for-like multiple work.
    diligencePath: Pull management-side comp deck or banker comparable analysis and reconcile it against retained public references.
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: exit-readiness-workstream
    missingEvidence: Auditor status, banker engagement, IPO-readiness milestones, and strategic-process evidence.
    whyItMatters: BitGo and Circle prove an exit window can exist, but Fireblocks still needs evidence that it is prepared to use it on acceptable terms.
    diligencePath: Request board materials on financing and exit planning plus investor relations or finance transformation roadmap.
    relatedTableRefs:
    - TV005
    - TV006
