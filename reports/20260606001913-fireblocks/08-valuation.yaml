- id: TV006
  title: Final diligence information requests
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current ARR / revenue bridge
    - Monthly or quarterly revenue run-rate from FY2024 through the latest 2026 period, with segment detail
    - Without a current denominator the public valuation screen remains too stale to support conviction
    - Request finance pack and board materials from CFO / FP&A
  - - Gross margin and burn
    - Gross-margin waterfall by custody, payments, tokenization, and wallet products plus cash burn and runway
    - Valuation depends on quality of revenue, not only on topline scale
    - Request management accounts and current cash-flow view
  - - Cap table and share count
    - Fully diluted share count, share classes, liquidation preferences, and any side-letter protections
    - Secondary per-share pages are almost useless without the denominator and preference stack
    - Request legal summary, cap-table export, and charter documents
  - - Customer quality
    - Top-20 customer concentration, NRR, logo churn, and cohort expansion by segment
    - A 2,400-customer headline is much stronger if revenue is diversified and cohorts expand cleanly
    - Request sales-ops / revenue-ops cohort tables
  - - Segment monetization
    - Revenue mix across custody, payments, stablecoin workflows, tokenization, and embedded-wallet products
    - Premium-multiple arguments are strongest if newer workflow products are monetizing, not only broadening the story
    - Request product P&L bridge and GMV / take-rate data where relevant
  - - Exit readiness
    - Auditor status, banker engagement, board discussion of IPO versus strategic paths, and public-company controls roadmap
    - BitGo and Circle show the window can open, but Fireblocks must still prove it is prepared to use it
    - Request CEO/board materials and investor relations roadmap
  notes: Every request is tied to a decision variable that can materially move fair value or investment structure.
