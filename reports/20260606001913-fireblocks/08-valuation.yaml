tables:
- id: TV001
  title: Investment recommendation summary
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  rows:
  - - Recommendation
    - RESEARCH-MORE
    - Public evidence proves scale and relevance, but not enough current monetization to underwrite the unchanged $8B anchor.
  - - Confidence
    - Medium
    - The 2022 round, 2024 revenue print, and current secondary pages are real; current ARR, margins, and preferences are still private.
  - - Risk rating
    - High
    - Stale pricing anchor, historical operational litigation, and meaningful multiple-compression risk all remain live.
  - - Valuation stance
    - Stretched
    - The 2022 mark implies roughly 51x on a working $156M ARR assumption and 64.5x on the last public revenue print.
  - - Decision implication
    - Proceed only after management data room review
    - Current ARR/revenue, gross margin, burn, share count, and liquidation preferences could all move fair value materially.
  notes: This summary is intentionally price-sensitive. It does not question Fireblocks’ strategic relevance; it questions whether current public evidence can support the unchanged 2022 valuation.
