- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-useful retained public and private crypto-infrastructure references available in reviewed sources; rows mix public comps, private rounds, and the company-underwrite object because no single perfect listed Fireblocks analogue exists.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Fireblocks
    - $8.0B last primary valuation; roughly $5.4-$6.2 per-share secondary indications; $124M FY2024 revenue
    - ~64.5x on FY2024 revenue; ~51x on a $156M working ARR assumption
    - Direct underwriting object with stronger customer scale than most peers
    - Current ARR, share count, and preference stack remain private; secondary pages are indicative only
  - - Coinbase
    - $40.15B market cap; $6.56B TTM revenue; $7.18B FY2025 revenue
    - ~5.6x FY2025 sales; ~6.1x TTM sales
    - Largest public crypto platform with explicit institutional custody and qualified-custodian positioning
    - Broader brokerage/trading mix and retail exposure make it less pure than Fireblocks
  - - BitGo
    - Jan 2026 IPO priced at $18/share; June 2026 EV $957M; LTM revenue $209M
    - 4.6x EV/revenue on multiples.vc after public-market price discovery
    - Closest custody and digital-asset-infrastructure public analogue in the retained source set
    - Post-IPO volatility and different capital structure can distort a straight apples-to-apples comparison
  - - Anchorage Digital
    - $100M Tether investment at $4.2B valuation in Feb 2026
    - Private valuation only; no retained public revenue denominator
    - Useful charter-premium private comp for regulated institutional crypto infrastructure
    - No current revenue or margin disclosure in retained sources
  - - Circle
    - $740M Q3 2025 revenue and $214M net income in SEC-filed results
    - Disclosure and profitability benchmark rather than a direct custody multiple
    - Shows the scale and reporting quality public investors will underwrite in crypto infrastructure
    - Stablecoin economics differ materially from custody SaaS and payments-infrastructure monetization
  notes: 'Each row is backed by at least two retained sources where available: Fireblocks by Forbes plus secondary venues, Coinbase by CompaniesMarketCap market-cap and revenue pages, BitGo by IPO release plus multiples.vc, Anchorage by Anchorage plus Tether, and Circle by its SEC-filed results with partner context.'
