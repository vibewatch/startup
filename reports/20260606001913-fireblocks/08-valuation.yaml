- id: TV003
  title: Bull/base/bear scenario analysis
  columns:
  - Scenario
  - Core assumptions
  - Multiple logic
  - Indicative value range
  - Probability signal
  - Implication vs. $8B anchor
  rows:
  - - Bear
    - $140M-$180M revenue with modest monetization from the existing customer base and no premium disclosure rerating
    - 4x-6x revenue, closer to pressured crypto-infrastructure comps
    - $0.56B-$1.08B
    - ~35% because current public evidence is still sparse and pricing risk is high
    - Would imply a severe markdown from the last primary round
  - - Base
    - $175M-$250M revenue with continued enterprise growth but still-private margins and ordinary multiple compression
    - 8x-12x revenue, above Coinbase/BitGo but below 2021-2022 peak exuberance
    - $1.40B-$3.00B
    - ~45% because scale is real but current monetization proof is incomplete
    - Still materially below the stale 2022 anchor
  - - Bull
    - $250M-$350M revenue with strong payments/stablecoin monetization and credible public-market preparation
    - 14x-18x revenue, requiring a scarcity premium and cleaner disclosure
    - $3.50B-$6.30B
    - ~20% because it needs both execution and a friendlier crypto-equity window
    - Approaches but does not clearly clear the legacy $8B mark
  notes: Ranges are scenario bands, not management forecasts. They are intentionally anchored on retained public facts and on comp discipline rather than on an unsupported DCF.
