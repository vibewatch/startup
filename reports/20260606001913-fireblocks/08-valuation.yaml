- id: exit-readiness-and-ipo-path
  title: Exit readiness and IPO path
  body: 'There is now enough external evidence to say the crypto-infrastructure exit window is open in principle. BitGo completed an IPO in January 2026, and Circle’s SEC-filed results show that public investors will support a crypto-infrastructure issuer that can disclose scale, margin structure, and profitability with conventional reporting discipline. Fireblocks, however, is not there yet on public evidence. The reviewed SEC traces for Fireblocks show a Form D and related exempt-offering history rather than any S-1 or recurring public-reporting footprint. Nasdaq Private Market and Hiive show secondary liquidity, but those pages are closer to private share discovery than to IPO preparation. That distinction is critical. Public markets may be available by the time Fireblocks wants them, but they are unlikely to reward a company that still withholds current ARR, gross margin, burn, and preference structure. The practical IPO-path view is therefore conditional: the exit route is plausible,
    especially if stablecoin payments keep scaling, but it requires a much sharper disclosure upgrade before investors should underwrite it as a core part of present value.'
  claimRefs:
  - CV008
