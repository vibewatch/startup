- id: TV005
  title: Thesis-break triggers
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Current revenue bridge disappoints
    - 2026 annualized revenue is not materially above the $124M FY2024 public print
    - The scale narrative would no longer justify paying a premium to current public comps
    - Reset valuation to bear-case levels and stop using the $8B anchor as an underwriting reference
  - - Preference stack is investor-unfriendly
    - Management reveals participating preferred, heavy ratchets, or a share count that makes secondary prices misleading
    - Headline post-money valuation would overstate common-equity value
    - Recut the deal from common-equity economics or walk away
  - - Pricing pressure erodes customer quality
    - Enterprise cohorts show churn, discounting, or support burden that weakens net expansion
    - The thesis shifts from sticky infrastructure to expensive but more contestable software
    - Downgrade confidence and demand proof of retention resilience before proceeding
  - - Exit prep remains absent
    - No audit readiness, banker workstream, or strategic-process evidence emerges despite a more open crypto-equity window
    - Return underwriting remains dependent on another private round rather than disciplined liquidity options
    - Keep Fireblocks on track status rather than advancing to approval
  - - A new operational or regulatory shock hits trust
    - A material security, litigation, or charter-related event harms the company’s credibility with institutions
    - The premium for being trusted infrastructure collapses quickly when trust is impaired
    - Treat the thesis as broken until independent remediation is proven
  notes: These triggers are intentionally concrete. They are the fastest ways the current already-stretched valuation case can fail.
