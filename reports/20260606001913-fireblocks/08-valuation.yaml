- id: final-diligence-gaps-and-recommendation
  title: Final diligence gaps and recommendation
  body: 'The right posture is not to dismiss Fireblocks as an overhyped crypto relic, because the company clearly has real customer scale, institutional relevance, and product breadth. It is also not to accept the old $8 billion mark at face value. Public evidence is too thin for that. The best retained current numbers say 2024 revenue was $124 million and unprofitable, while current secondary pages only show mid-single-digit per-share indications and no clear path to a fresh premium primary round. Public comps such as Coinbase and BitGo, and private comps such as Anchorage, all suggest multiple compression relative to 2021-2022 crypto peak pricing. That is why the chapter lands on research-more rather than buy or avoid. The upside is real enough to keep Fireblocks in the investable set, but underwriting discipline now depends on private diligence closing a short list of critical gaps: current ARR and revenue bridge, gross margin and burn, customer retention quality, exact share count and
    preference stack, and credible exit preparation. Without those files, the valuation remains stretched on public evidence.'
  claimRefs:
