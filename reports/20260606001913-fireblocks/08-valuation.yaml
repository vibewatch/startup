- id: TV002
  title: Thesis vs. anti-thesis
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Fireblocks has real institutional scale'
    - Public sources show customer count moving from 150 in 2021 to 800 in January 2022, 1,500 deployments in 2022, and 2,400 organizations on the current customer page.
    - Upgrade if management shows that scale also converted into strong current revenue retention and not just broad logos.
  - - 'THESIS: Product breadth supports a premium'
    - SEC and partner materials frame Fireblocks as SaaS infrastructure spanning custody, payments, and stablecoin workflows rather than only cold storage.
    - Upgrade if segment revenue shows payments and network products are becoming meaningful monetization engines.
  - - 'THESIS: Institutional proof is unusually strong'
    - The SEC memo cites sophisticated institutions such as BNY Mellon and BNP Paribas, and Fifth Third named Fireblocks in stablecoin-payment expansion.
    - Upgrade if customer concentration is low and enterprise cohorts are expanding rather than just renewing.
  - - 'ANTI-THESIS: Public monetization proof is thin'
    - The best retained current financial print is $124M of 2024 revenue and unprofitability; current ARR and margin remain undisclosed.
    - This concern falls sharply if management provides a current revenue bridge and gross-margin waterfall.
  - - 'ANTI-THESIS: Multiple compression is severe across the comp set'
    - Coinbase screens near 5.6x-6.1x sales and BitGo near 4.6x EV/revenue, far below Fireblocks’ stale 2022 implied multiple.
    - This concern eases only if Fireblocks can prove revenue scale well above the public denominator or public-market scarcity premium returns.
  - - 'ANTI-THESIS: Historical and review-led risks are non-zero'
    - StakeHound litigation and enterprise-pricing complaints show operational and affordability risk are not imaginary.
    - The concern eases if diligence confirms strong customer satisfaction, low churn, and no recurring operational-control issues.
  notes: This table separates company quality from price discipline. Fireblocks can be a strong company and still be an overextended valuation on current public evidence.
