  - id: scale-and-traction
    title: Scale, Traction, and Operational Metrics
    body: >-
      Fireblocks publicly reports that more than 2,400 institutions across 100+ countries trust its
      platform, including anchor clients BNY Mellon, Worldpay, Revolut, Galaxy, and BNP Paribas
      (confirmed directly in the company's February 2025 SEC engagement letter).  As of May 2026,
      LinkedIn reports approximately 965 employees; Tracxn independently estimates 966; Revelio Labs
      estimated 1,150 employees at year-end 2025, reflecting approximately 25% year-over-year growth
      during 2025.  The gap between sources likely reflects reporting-date differences and contractor
      counting conventions; no headcount figure should be treated as verified without DD confirmation.
      The platform secures more than $10 trillion in cumulative digital asset transactions across
      more than 120 blockchains, processes approximately 15% of global stablecoin volume (Coinlaw,
      2025 data), and handles $200 billion or more in monthly stablecoin payments.  Fireblocks
      Trust Company, a NYDFS-chartered qualified custodian, serves institutional clients including
      Bakkt, Galaxy, and FalconX.  The platform holds SOC 2 Type 2, ISO 27001/27017/27018, and CCSS
      Level 3 certifications, and achieves a NIST CSF 2.0 maturity score of 4.4 versus an industry
      benchmark of 3.5.  G2 customer reviews award a 4.8 rating based on more than 550 reviews.
      Revenue information is not publicly disclosed; third-party aggregators cite approximately
      $193 million in annual revenue, though the basis of this estimate is unclear.
    claimRefs:
