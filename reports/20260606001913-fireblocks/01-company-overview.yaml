company:
  name: Fireblocks

chapter:
  number: 1
  title: Company Overview
  summary: >-
    Fireblocks is a New York-headquartered digital asset infrastructure unicorn founded in 2018 by three
    Check Point cybersecurity alumni who investigated the 2017 Lazarus Group exchange hacks and saw the
    gap in institutional-grade custody. The company has raised $1.04 billion across six rounds
    (last: Series E, $550 M, $8 B valuation, January 2022), serves 2,400+ institutions including
    BNY Mellon, Revolut, and Worldpay, and has made three acquisitions since 2023 to extend its
    platform from custody into payments, wallet-as-a-service, and financial reporting.
    Key adverse markers include the unresolved StakeHound private-key lawsuit (filed 2021) and an
    emerging Celsius bankruptcy dispute (March 2026) alleging negligent key destruction.

sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: >-
      Fireblocks Inc. (legal entity Fireblocks, Inc., incorporated in Delaware, May 2022; trading entity
      Fireblocks LLC formed April 2023) is a private SaaS company headquartered at 441 9th Avenue,
      New York, NY 10001.  The company sells a cloud-delivered digital asset infrastructure platform
      that enables financial institutions, fintechs, crypto-native firms, and Web3 companies to
      create, move, secure, and manage digital assets at institutional scale.  Its core technology
      combines Multi-Party Computation (MPC) wallets with patent-pending chip isolation to protect
      private keys, eliminating single points of failure in custody and transfer workflows.
      The platform covers four product clusters: (1) Wallets and custody (treasury management,
      wallet-as-a-service, embedded wallets, Fireblocks Trust Company); (2) Payments (Network for
      Payments covering 100+ countries and 60+ currencies, Agentic Payments, and the Flow product
      for stablecoin rails); (3) Operations (automation, AI suite, Policy Engine, DeFi security);
      and (4) Financial applications (tokenization, staking, earn, reconciliation, and compliance
      integrations).  Fireblocks earns revenue through SaaS licensing fees and, increasingly,
      transaction-based fees on its payments network.  Third-party estimates place annual revenue
      at approximately $193 million, though Fireblocks has not disclosed official figures.
      As of June 2026 the company operates globally with offices in the United States, United Kingdom,
      Israel, Hong Kong, Singapore, Germany, France, and Switzerland.
    claimRefs:
      - CO001
      - CO002
