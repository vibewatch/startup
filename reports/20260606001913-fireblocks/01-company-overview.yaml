  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >-
        Fireblocks' audited or management-reported revenue, gross margin, and ARR figures; the
        current $193 M estimate is an unverified third-party aggregate.
      whyItMatters: >-
        Revenue clarity is required to assess valuation multiples, growth rate, and the
        reasonableness of the $8 B primary-round valuation; without it, investors cannot
        determine whether the company is under- or over-valued.
      diligencePath: >-
        Request revenue, ARR, gross margin, and net revenue retention figures in management
        diligence; ask auditors for the most recent audited financial statements.
      relatedQuestionRefs: [QO012]

    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Full capitalization table showing all shareholder ownership percentages, preference stack,
        liquidation waterfall, anti-dilution provisions, and board seat allocation.
      whyItMatters: >-
        Governance and control risk cannot be quantified without knowing preference terms,
        blocking rights, and board composition.
      diligencePath: >-
        Request cap-table, shareholder agreement, and board minutes covering any material
        resolutions from 2022 to date.
      relatedQuestionRefs: [QO005, QO022]
      relatedTableRefs: [TO003]

    - type: private-evidence-only
      severity: material
      topic: lawsuit-celsius
      missingEvidence: >-
        Court filings, complaint details, and damages quantification from the Celsius bankruptcy
        administrator's action against Fireblocks filed in New York bankruptcy court (March 2026).
      whyItMatters: >-
        Unquantified legal exposure is a contingent liability that could materially affect
        Fireblocks' balance sheet, insurance coverage, and institutional-client trust.
      diligencePath: >-
        Monitor PACER for the Celsius bankruptcy docket; request Fireblocks' counsel memo on
        the dispute and any indemnification or insurance coverage.
      relatedQuestionRefs: [QO017]

    - type: private-evidence-only
      severity: minor
      topic: lawsuit-stakehound
      missingEvidence: >-
        Current status of the Tel Aviv District Court proceedings between StakeHound and Fireblocks;
        whether the case has settled, been dismissed, or reached judgment since 2021.
      whyItMatters: >-
        A judgment against Fireblocks would crystallise damages and set a precedent for future
        key-management liability claims.
      diligencePath: >-
        Request current status from Israeli litigation counsel; ask Fireblocks management for the
        latest update and any reserve amounts recorded on the balance sheet.
      relatedQuestionRefs: [QO016]

    - type: missing-source
      severity: minor
      topic: headcount
      missingEvidence: >-
        Authoritative headcount figure directly from Fireblocks' HR or finance team; all available
        estimates diverge by up to 20% across LinkedIn, Tracxn, and Revelio Labs.
      whyItMatters: >-
        Headcount drives cost structure estimates, burn rate projections, and assessment of
        post-acquisition integration capacity.
      diligencePath: >-
        Ask management to provide a current full-time-equivalent headcount figure broken down by
        function and geography as part of data-room diligence.
      relatedQuestionRefs: [QO011]

    - type: missing-source
      severity: minor
      topic: leadership
      missingEvidence: >-
        Complete board composition with meeting frequency, committee structure, and any independent
        director appointments; partial board list inferred from press releases.
      whyItMatters: >-
        Full board data is required to assess governance quality, independent oversight, and
        investor consent rights.
      diligencePath: >-
        Review corporate charter, board resolutions, and shareholder agreements; confirm whether
        any independent board members were added post-Series E.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO002]

    - type: missing-source
      severity: minor
      topic: partnerships
      missingEvidence: >-
        Comprehensive partnership agreement details for strategic integrations with BNY Mellon,
        Worldpay, Chainalysis, and Elliptic including any exclusivity clauses or minimum revenue
        commitments.
      whyItMatters: >-
        Strategic partnership terms can materially affect competitive moat and revenue concentration
        risk; exclusivity or switching costs with anchor customers affects churn risk analysis.
      diligencePath: >-
        Request material contracts schedule from management and review partnership agreements for
        exclusivity, term, and renewal provisions.
      relatedQuestionRefs: [QO020]

    - type: enumeration-incomplete
      severity: minor
      topic: milestone-coverage
      missingEvidence: >-
        Complete list of private regulatory inquiries, undisclosed partnership terms, exact Agentic
        Payments Suite launch date, and internal governance events not yet reported in public sources
        as of June 2026.
      whyItMatters: >-
        Gaps in the milestone record may leave investors without context on product development pace,
        regulatory interactions, or partnership dynamics that are material to diligence.
      diligencePath: >-
        Review board minutes, regulatory correspondence, and internal product roadmap with management
        during due diligence to complete the milestone timeline.
      relatedQuestionRefs: [QO019]
      relatedTableRefs: [TO004]

    - type: private-evidence-only
      severity: minor
      topic: leadership-completeness
      missingEvidence: >-
        Confirmed full executive leadership list with exact titles, join dates, and any recent
        departures; the fireblocks.com/team page rendered partial content and secondary sources
        may reflect outdated roles.
      whyItMatters: >-
        Incomplete leadership data creates gaps in assessing functional coverage, key-person
        dependencies, and succession planning at the C-suite level.
      diligencePath: >-
        Request full current organizational chart from management as part of diligence; verify
        all direct CEO reports and their tenures.
      relatedQuestionRefs: [QO004]

    - type: private-evidence-only
      severity: minor
      topic: key-person-dependency
      missingEvidence: >-
        Formal succession plan for Michael Shaulov as CEO; assessment of whether key investor,
        partnership, and regulatory relationships are institutionalised or personally dependent
        on Shaulov; any key-man insurance or founder lock-up provisions.
      whyItMatters: >-
        If Shaulov's departure would trigger investor concern or customer churn, the key-person
        dependency is a material governance risk, particularly at the $8B valuation level and in
        ongoing regulatory-engagement activities.
      diligencePath: >-
        Interview board members and senior leadership to assess succession readiness; review
        investor agreements for key-man provisions and founder vesting schedules.
      relatedQuestionRefs: [QO024]

