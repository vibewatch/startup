  - id: founders-and-leadership
    title: Founders, Leadership, and Governance
    body: >-
      Fireblocks was co-founded in 2018 by Michael Shaulov (CEO), Pavel Berengoltz (CTO), and
      Idan Ofrat (CPO).  All three spent the preceding decade at Check Point Software Technologies,
      Israel's leading cybersecurity firm, where they worked on the task force that investigated the
      2017 Lazarus Group theft of $200 million in Bitcoin from four South Korean exchanges.  That
      investigation revealed both the scale of criminal interest in digital assets and the absence of
      enterprise-grade custody solutions, which motivated the founding.  Prior to Check Point,
      Michael Shaulov founded Lacoon Mobile Security, which Check Point acquired for approximately
      $100 million in 2015.  The three founders retain operational control and are widely regarded
      as having strong founder-market fit given their cybersecurity and institutional finance
      backgrounds.  The broader executive team includes Oded Blatman (CIO and CISO), Michal Ferguson
      (CMO), Madan Gadde (Chief Customer Officer), Stephen Richardson (Chief Strategy Officer and
      Head of Banking), Ran Goldi (SVP Payments and Network), Adam Levine (CEO of Fireblocks
      Financial Services), Michael Levine (CFO), Jason Allegrante (Chief Legal and Compliance
      Officer, formerly Federal Reserve Bank of New York), Matt Maloney (SVP Global Sales), Stuart
      Thompson (Chief People Officer), and Scott Harvey (Chief Revenue Officer).  The board of
      directors includes Fred Ehrsam (Paradigm co-founder, joined 2020), Gili Raanan (Founder and
      GP at Cyberstarts, early backer), Tom Banahan, Ken Fox, and Gil Mandelzis.  No material
      disclosed leadership changes have been reported since 2024.  Key-person dependence on
      Michael Shaulov as public face, strategic spokesman, and primary product visionary is an
      acknowledged governance risk, though the breadth of the senior team mitigates single-point
      failure.
    claimRefs:
