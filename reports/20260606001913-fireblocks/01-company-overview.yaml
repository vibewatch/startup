  - calloutType: strength
    title: Founder-Market Fit and Institutional Credibility
    body: >-
      All three co-founders spent two decades in enterprise cybersecurity at Check Point and
      investigated the theft that exposed the market gap they fill. The platform is trusted by
      BNY Mellon, BNP Paribas, and 2,400+ institutions, with SOC 2 / ISO 27001 / CCSS Level 3
      certification and a NIST CSF 2.0 maturity score significantly above industry benchmark.
    claimRefs:
      - CO002
      - CO022
      - CO038
  - calloutType: risk
    title: Recurring Key-Management Litigation Exposure
    body: >-
      Fireblocks faces two separate key-management disputes — the unresolved StakeHound lawsuit
      (2021, $75 M ETH) and the emerging Celsius bankruptcy allegation (2026, undisclosed amount) —
      that create a repeating reputational narrative around custody negligence at the precise
      moment the company seeks to expand qualified custody and regulated-entity relationships.
    claimRefs:
      - CO024
      - CO033
  - calloutType: insight
    title: Secondary Market Signals Modest Upside vs. $8 B Primary
    body: >-
      Nasdaq Private Market data (May 2026) shows a 14.42% increase in indicative share price
      relative to a prior reference, with $160 million in 90-day secondary volume. This suggests
      continued investor demand but does not represent a new primary round; the last primary
      valuation remains $8 B (January 2022). No IPO has been announced.
    claimRefs:
      - CO030
      - CO031
      - CO032

