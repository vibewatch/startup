      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory story is a strength and a residual risk at the same time. Fireblocks Trust gives the
              company a New York-supervised qualified-custody surface, and SEC staff no-action relief improves the
              pathway for advisers and funds to use certain state trust companies for crypto custody. But the adverse
              record matters: Commissioner Crenshaw's dissent explicitly argues the relief weakens core protections, and
              MiCA adds a separate EU authorization and operational-resilience regime that customers and partners must
              satisfy. Legal risk is also live. StakeHound alleged loss of 38,178 ETH, Fireblocks disputed the premise
              and said the keys sat outside the production MPC structure, and 2026 Celsius bankruptcy reporting revived
              discovery around alleged destroyed keys. The residual risk is not that every allegation is proven; it is
              that custody trust can be damaged by a single disputed key-control narrative. Additional regime pressure
              sits outside the U.S./Israel dispute record: DORA raises ICT and outsourcing expectations in Europe, FATF
              Travel Rule guidance keeps data-sharing and sanctions workflows expensive, and APAC rollout remains gated
              by local licensing rather than one harmonized passport. These rules do not make Fireblocks uninvestable,
              but they do mean geographic expansion always comes with control-build cost.
