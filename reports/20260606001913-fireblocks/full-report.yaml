      - number: '8.4'
        title: Bull/base/bear scenario modeling
        blocks:
          - type: paragraph
            body: >-
              The scenario work should be explicit about what is assumption and what is evidence. Evidence gives three
              hard anchors: the last public revenue print is $124 million in 2024, public comps sit mostly in the
              mid-single-digit to low-double-digit revenue-multiple range, and Fireblocks has not yet produced the
              disclosure quality that would justify a public-market scarcity premium. The bear case therefore assumes
              revenue only moves to roughly $140 million to $180 million and the market treats Fireblocks closer to a
              pressured custody or infrastructure name at 4x to 6x revenue, producing roughly $0.56 billion to $1.08
              billion of value. The base case assumes public evidence is understated but not wildly wrong, with revenue
              moving into a $175 million to $250 million band and multiples of 8x to 12x, producing about $1.4 billion
              to $3.0 billion. The bull case assumes payment-network expansion, stablecoin infrastructure, and customer
              monetization all work well enough to support $250 million to $350 million of revenue and 14x to 18x
              multiples, or $3.5 billion to $6.3 billion. Even that bull case still does not obviously clear the stale
              $8 billion round mark.
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV038
              - CV039
              - CV040
