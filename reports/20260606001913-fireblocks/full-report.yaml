      - number: '7.4'
        title: Market cyclicality, counterparty/default exposure, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Fireblocks benefits from the post-FTX move away from exchange wallets, but the same history proves how
              quickly customer demand, volumes, and credit quality can turn. Bankruptcy-cluster evidence across Celsius,
              FTX, BlockFi, Voyager, and Genesis shows that crypto-native customers can fail because of leverage, fraud,
              or asset-price cyclicality. That creates a paradox: exchange hacks and insolvencies strengthen the case
              for off-exchange settlement, while customer defaults and volume drawdowns can still hurt Fireblocks'
              revenue and reputation. Partner and dependency risk is broad: regulators determine qualified-custody
              acceptability, exchanges and liquidity venues drive off-exchange workflows, blockchains create uptime and
              finality dependencies, and custody competitors can pressure pricing. Bank disintermediation is also
              two-sided because Fireblocks can replace exchange/bank workflows while banks and OCC-chartered providers
              internalize the same capabilities. Execution risk is also raised by independent bank build programs and by
              Fireblocks' own acquisition cadence. Kinexys is evidence that large banks are still building internal
              rails, while Dynamic and TRES integrations expand what Fireblocks has to support and harmonize at once.
            claimRefs:
