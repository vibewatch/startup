      - number: '1.5'
        title: Milestones, Partnerships, and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Fireblocks' milestone timeline spans founding (2018) through its current product expansion (2026).  The
              company launched its production infrastructure in June 2019 alongside the Series A and reported securing
              $150 billion in digital assets and serving 120+ commercial clients by November 2020 (Series B).  Its
              acquisition strategy began in September 2023 with the purchase of BlockFold (Australia), a blockchain
              professional services firm, and accelerated in October 2025 with the acquisition of Dynamic (wallet and
              onboarding infrastructure, ~$90 million, unofficial figure) and in January 2026 with the acquisition of
              TRES Finance ($130 million, cash and equity), a crypto accounting and financial reporting platform serving
              200+ clients. Partnership milestones include BNY Mellon (Series D co-investor and anchor customer),
              Chainalysis and Elliptic (compliance integrations), and a 2025 SEC Crypto Task Force engagement in which
              Fireblocks presented technical custody standards to the Commission. The principal adverse events are: (1)
              The StakeHound lawsuit filed at Tel Aviv District Court in June 2021, claiming Fireblocks employee
              negligence caused the irrecoverable loss of 38,178 ETH (approximately $75 million at filing date) through
              failure to back up BLS key shares associated with an ETH 2.0 staking project.  Fireblocks denies
              responsibility, asserting the keys were generated by StakeHound and stored outside its platform.  The case
              was unresolved as of the latest public reporting.  (2) In March 2026, the Celsius bankruptcy administrator
              accused Fireblocks of "staggering negligence" and alleged Fireblocks destroyed cryptographic keys
              controlling a substantial amount of Celsius's Ethereum tokens, filing for discovery in the New York
              bankruptcy court.  These two incidents, while involving different facts, present a recurring
              key-management risk narrative that counterparties and regulators will scrutinise.
