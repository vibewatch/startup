      - number: '3.2'
        title: Capability breadth, pricing disclosure, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Capability overlap is high, but the center of gravity still differs. Fireblocks bundles compliance
              tooling, policy-driven controls, APIs, off-exchange operations, and stablecoin-oriented payments inside
              one platform. BitGo, Anchorage, Coinbase, Kraken, and Fidelity all let institutions do more than simply
              store assets: they connect custody to trading, staking, financing, or settlement. Copper’s key
              differentiation is ClearLoop, which lets institutions keep assets in MPC custody while trading on
              centralized venues. Ledger Enterprise is more hardware-rooted and explicitly extends into tokenization,
              multisig, and on-premise deployment. Zodia Solutions is distinctive not because it is cheaper or broader
              than Fireblocks on every workflow, but because it is built as bank-grade white-label infrastructure that
              institutions can deploy inside their own governance and data-sovereignty perimeter.


              Pricing transparency, however, is not evenly distributed. Fireblocks, BitGo, Anchorage, Copper, Ledger
              Enterprise, and Zodia all use sales-led motions on the fetched official surfaces. Coinbase Custody is the
              clearest exception: it publishes an implementation-fee range, a 50 bps annualized custody fee, and a
              $500,000 minimum balance. Gemini is less explicit on percentage pricing but still discloses that there is
              no set minimum balance and that accounts carry a $30-per-asset monthly minimum fee. Safe is the outlier on
              the self-custody side, explicitly marketing 0 AUM fees and portable accounts. The strategic implication is
              that Fireblocks competes from a strong breadth position, but in price-sensitive or procurement-heavy
              evaluations, public pricing opacity remains a disadvantage against the few alternatives that give buyers
              clearer benchmarks.
