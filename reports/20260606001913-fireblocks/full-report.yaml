      - number: '2.5'
        title: Limitations and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The chapter's strongest conclusion is directional rather than numerically exact: Fireblocks sits at the
              intersection of custody, wallet governance, stablecoin settlement, treasury automation, and tokenization
              infrastructure, all of which have credible adoption drivers. The weakest conclusion is exact serviceable
              obtainable market. Public sources do not disclose Fireblocks' segment ARR, ACV, customer concentration,
              churn, payments take rate, stablecoin volume by client type, or conversion from funded pilots to
              production. Vendor-authored buyer guides and partner announcements are useful for workflow mapping but
              biased as demand evidence. The next diligence phase should request segment revenue, contracted backlog,
              net retention, pipeline by bank/fintech/payment/tokenization segment, deployment conversion, and
              compliance cost by region. Until then, market sizing should preserve contradictory estimates and state
              clearly which numbers are asset value, revenue, software spend, or long-term tokenization adjacency.
            claimRefs:
