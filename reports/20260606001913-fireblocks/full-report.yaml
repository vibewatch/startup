    title: Valuation sensitivity analysis
    type: bar
    layout: standard
    summary: >-
      Fireblocks only reaches the stale $8B anchor under revenue and multiple combinations far above current public
      evidence.
    data:
      items:
        - label: $124M revenue @ 6x
          value: 744
          unit: USDm
          note: Near current public-comp discipline
        - label: $156M ARR @ 8x
          value: 1248
          unit: USDm
          note: Working 2026 ARR placeholder still far below $8B
        - label: $250M revenue @ 10x
          value: 2500
          unit: USDm
          note: Healthy software multiple, not enough to defend legacy mark
        - label: $350M revenue @ 14x
          value: 4900
          unit: USDm
          note: Aggressive bull case still below $8B
        - label: $667M revenue @ 12x
          value: 8004
          unit: USDm
          note: One path to justify the old primary mark
        - label: $800M revenue @ 10x
          value: 8000
          unit: USDm
          note: Another path to justify the old primary mark
    approximationNotes: >-
      Bars are analytical combinations of retained public numbers and underwriting assumptions. They illustrate
      valuation sensitivity, not reported company outcomes.
