      - number: '3.4'
        title: Moat durability and adverse competitor evidence
        blocks:
          - type: paragraph
            body: >-
              Fireblocks’ public moat still looks meaningful, but not invulnerable. The strongest evidence in its favor
              is workflow breadth: few competitors publicly span wallets, payments, off-exchange operations,
              tokenization, compliance, and API automation in one package. That is a real differentiator versus point
              solutions or narrower custodians. The weakness is that the category is bifurcating. Trust-sensitive buyers
              can increasingly choose chartered or trust-company wrappers such as Anchorage, Coinbase, and Fidelity, or
              bank-affiliated platforms such as Zodia and BNY. Price-sensitive buyers can benchmark against Coinbase
              Custody, Gemini, or Safe more easily than against Fireblocks. Technically mature teams can also combine
              self-custody with managed services rather than pick a single all-in-one vendor.


              The adverse evidence also points to commoditization risk. OCC enforcement against Anchorage shows that
              regulated wrappers are not automatically operationally superior, yet it also proves that the category is
              being forced into bank-grade supervision. Ledger Insights reports that State Street planned a 2026 launch
              and that U.S. banking regulators have lowered practical barriers for bank participation after SAB 121 was
              rescinded. Zodia’s 2026 outlook says multi-custodian structures and embedded compliance are becoming
              standard expectations. In other words, custody, reconciliation, and compliance are drifting toward
              baseline market infrastructure rather than a unique premium layer. Fireblocks can still win when
              institutions prioritize orchestration, automation, and crypto-native workflow breadth, but it should be
              underwritten as a strong platform in a market that is becoming more regulated, more bank-contested, and
              more multi-vendor by default.
