      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is not hard to articulate. Fireblocks has real institutional scale, not speculative demo
              traction. Public company and company-controlled surfaces show a customer path from 150 in 2021 to 800 in
              January 2022, 1,500 deployments in 2022, and 2,400 organizations on the current customer page. LinkedIn
              says the platform secures more than $10 trillion in digital asset transactions, and current materials cite
              hundreds of millions of wallets. The SEC’s Crypto Task Force memo also frames Fireblocks as a SaaS
              platform used by sophisticated institutions including BNY Mellon and BNP Paribas, while Fifth Third’s
              filed presentation shows the company participating in stablecoin payment infrastructure rather than only
              cold storage. The anti-thesis is equally real. G2 and PeerSpot both say pricing is steep, which means
              breadth does not guarantee mass-market affordability. Historical litigation such as the StakeHound dispute
              is a reminder that custody infrastructure can still carry operational tail risk. Most importantly, scale
              proof is much better than monetization proof: the company has not publicly updated current ARR, margin,
              burn, or cap-table terms since the 2022 fundraising cycle.
