      - number: '2.2'
        title: 'Sizing Lenses: Broad TAM, Narrow SAM, and Unusable Precision'
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence supports a large and growing category, but it does not support a single precise
              Fireblocks TAM. The Business Research Company estimates digital asset custody at $834.29 billion in 2026
              and $1.594 trillion in 2030, while institutional custody and crypto asset management reports use much
              smaller revenue or service-spend frames. The useful conclusion is not that the market is exactly any one
              number; it is that Fireblocks participates in several overlapping pools. Broad custody estimates show the
              asset base and strategic relevance, institutional custody estimates approximate the revenue pool for
              qualified custody and wallet infrastructure, and tokenization reports show a long-term adjacency that will
              only monetize when issuers, distribution, and secondary liquidity are ready. Fireblocks' serviceable
              market should therefore be narrated as evidence-constrained SAM rather than a generic trillion-dollar TAM.
