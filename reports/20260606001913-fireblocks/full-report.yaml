          - type: callout
            title: The valuation anchor is far ahead of current public monetization evidence
            body: >-
              The old $8 billion mark only works if current revenue is dramatically above the last public print or if
              the market again pays peak-cycle multiples. Public comparables and current secondary pages do not support
              that view today.
            calloutType: risk
            claimRefs:
