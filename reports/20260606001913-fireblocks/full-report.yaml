              - CV038
              - CV039
              - CV040
              - CV041
      - number: '8.5'
        title: Exit readiness and IPO path
        blocks:
          - type: paragraph
            body: >-
              There is now enough external evidence to say the crypto-infrastructure exit window is open in principle.
              BitGo completed an IPO in January 2026, and Circle’s SEC-filed results show that public investors will
              support a crypto-infrastructure issuer that can disclose scale, margin structure, and profitability with
              conventional reporting discipline. Fireblocks, however, is not there yet on public evidence. The reviewed
              SEC traces for Fireblocks show a Form D and related exempt-offering history rather than any S-1 or
              recurring public-reporting footprint. Nasdaq Private Market and Hiive show secondary liquidity, but those
              pages are closer to private share discovery than to IPO preparation. That distinction is critical. Public
              markets may be available by the time Fireblocks wants them, but they are unlikely to reward a company that
              still withholds current ARR, gross margin, burn, and preference structure. The practical IPO-path view is
              therefore conditional: the exit route is plausible, especially if stablecoin payments keep scaling, but it
              requires a much sharper disclosure upgrade before investors should underwrite it as a core part of present
              value.
            claimRefs:
              - CV008
              - CV009
              - CV034
              - CV035
              - CV042
              - CV043
          - type: table
            tableRef: TV005
            claimRefs:
              - CV018
              - CV019
              - CV042
              - CV043
              - CV044
              - CV045
              - CV046
      - number: '8.6'
        title: Final diligence gaps and recommendation
        blocks:
          - type: paragraph
            body: >-
              The right posture is not to dismiss Fireblocks as an overhyped crypto relic, because the company clearly
              has real customer scale, institutional relevance, and product breadth. It is also not to accept the old $8
              billion mark at face value. Public evidence is too thin for that. The best retained current numbers say
              2024 revenue was $124 million and unprofitable, while current secondary pages only show mid-single-digit
              per-share indications and no clear path to a fresh premium primary round. Public comps such as Coinbase
              and BitGo, and private comps such as Anchorage, all suggest multiple compression relative to 2021-2022
              crypto peak pricing. That is why the chapter lands on research-more rather than buy or avoid. The upside
              is real enough to keep Fireblocks in the investable set, but underwriting discipline now depends on
              private diligence closing a short list of critical gaps: current ARR and revenue bridge, gross margin and
              burn, customer retention quality, exact share count and preference stack, and credible exit preparation.
              Without those files, the valuation remains stretched on public evidence.
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
              - CV046
