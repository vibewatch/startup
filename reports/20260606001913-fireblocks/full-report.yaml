      - number: '5.2'
        title: Architecture and policy controls
        blocks:
          - type: paragraph
            body: >-
              The defensible technical claim is that Fireblocks layers MPC-CMP key management, enclave or
              hardware-isolated execution, policy enforcement, authenticated transfer workflows, and developer APIs.
              Official security copy and independent technical summaries align on the core model: private keys should
              not be assembled in one location, transaction authorization is governed through rules, and the Fireblocks
              Network reduces address-substitution risk by making transfers counterparty-aware. That is a strong
              architectural story for active institutions that cannot rely only on cold storage. It is not a complete
              security proof. The materials available for this chapter do not include cryptographic audit reports, full
              SOC report text, customer-side co-signer configurations, key-share backup procedures, or disaster-recovery
              test evidence, so the policy engine and MPC claims remain verification priorities in confirmatory
              diligence. Compared with pure HSM or cold-wallet designs, Fireblocks is explicitly optimizing for active,
              policy-governed operations, which helps explain why MPC-CMP, secure enclaves, and API orchestration sit at
              the center of the architecture. The same design creates dependence on cloud, enclave, and
              workflow-governance layers that do not exist in a purely offline vault model.
