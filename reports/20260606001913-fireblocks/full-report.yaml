  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Institutional Control Layer, Not All Crypto'
        blocks:
          - type: paragraph
            body: >-
              Fireblocks' investable market should be bounded around institutional digital asset infrastructure rather
              than the entire crypto economy. The included jobs are custody and wallet governance, client and treasury
              wallet operations, stablecoin payment and settlement connectivity, token issuance and lifecycle tooling,
              compliance controls, and integration into exchanges, liquidity venues, blockchains, and back-office
              systems. That boundary includes both technology sold to banks and fintechs and custody workflows that sit
              inside a regulated operating model. It excludes speculative token trading, consumer self-custody wallets,
              mining, NFT marketplaces, exchange trading fees, and general blockchain developer tooling unless those
              activities require institutional key control and transaction policy. This distinction matters because most
              public market reports quote asset value or AUC-like categories, while Fireblocks monetizes software,
              custody, services, and network workflows tied to production digital asset operations.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM038
