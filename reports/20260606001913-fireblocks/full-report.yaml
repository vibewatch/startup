      - - Customer quality
        - Top-20 customer concentration, NRR, logo churn, and cohort expansion by segment
        - A 2,400-customer headline is much stronger if revenue is diversified and cohorts expand cleanly
        - Request sales-ops / revenue-ops cohort tables
      - - Segment monetization
        - Revenue mix across custody, payments, stablecoin workflows, tokenization, and embedded-wallet products
        - >-
          Premium-multiple arguments are strongest if newer workflow products are monetizing, not only broadening the
          story
        - Request product P&L bridge and GMV / take-rate data where relevant
      - - Exit readiness
        - >-
          Auditor status, banker engagement, board discussion of IPO versus strategic paths, and public-company controls
          roadmap
        - BitGo and Circle show the window can open, but Fireblocks must still prove it is prepared to use it
        - Request CEO/board materials and investor relations roadmap
    notes: Every request is tied to a decision variable that can materially move fair value or investment structure.
    claimRefs:
      - CV008
      - CV009
      - CV042
      - CV043
      - CV044
      - CV047
