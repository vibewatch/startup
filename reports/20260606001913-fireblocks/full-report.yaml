      - number: '7.3'
        title: Technology, security, outage, and contract risk
        blocks:
          - type: paragraph
            body: >-
              Public security evidence is materially positive but incomplete for underwriting. Fireblocks discloses SOC
              2 Type II, ISO 27001, C4 CCSS, penetration testing, privacy-by-design guidance, and a master service
              agreement that maps client obligations and liability allocation. Those are real mitigants; they also
              define diligence paths rather than close the file. The status record near run date showed no broad outage
              at access, yet it also listed repeated intermittent transaction, balance, and console-delay incidents. In
              a custody platform, small delays matter because stressed markets compress response windows. The disputed
              StakeHound and Celsius narratives make key-management process evidence more important than certifications
              alone. A clean underwriting file needs current SOC reports, disaster-recovery test results, insurance
              terms, incident postmortems, and confirmation that client backup obligations are actually operationalized.
              Technical downside also includes cloud concentration, enclave continuity, and long-term cryptographic
              migration. Public evidence now links Fireblocks to AWS-based distribution and SGX-style hardware defenses,
              while NIST's post-quantum push is a reminder that today's signature assumptions do not last forever.
