  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow and product scope
        blocks:
          - type: paragraph
            body: >-
              Fireblocks should be underwritten as a broad digital-asset operating system, not a point custody wallet.
              Public product evidence shows a customer workflow that starts with wallet creation and asset segregation,
              runs through policy-controlled approvals and MPC signing, and then extends into settlement, tokenization,
              DeFi, staking, compliance hooks, webhooks, and reporting. The strongest proof is breadth: Fireblocks
              describes treasury, Wallets-as-a-Service, Embedded Wallets, Network, tokenization, DeFi, and developer
              surfaces, while its status page exposes many live components that a customer depends on. The limitation is
              equally important. The public record verifies product categories and control concepts, but it does not
              disclose customer-specific SLA terms, API rate limits, throughput, recovery objectives, or implementation
              failure rates, so diligence should treat Fireblocks as mature infrastructure with private operating-limit
              evidence still required. This remains material.
