  productSummary: |
    Fireblocks delivers a cloud-based digital asset infrastructure platform combining MPC-CMP
    custody with Intel SGX hardware isolation, a cross-institutional payments network, a policy
    engine for transaction automation, and API connectivity across 100+ blockchains. The platform
    covers wallets and custody (treasury management, embedded wallets, Fireblocks Trust Company),
    payments (stablecoin rails, agentic payments, cross-border), operations (compliance, DeFi,
    AI suite), and financial applications (tokenization, staking, earn, reconciliation).
