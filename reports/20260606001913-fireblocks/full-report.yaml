      - number: '4.5'
        title: Evidence gaps and financial verdict
        blocks:
          - type: paragraph
            body: >
              The public record supports a strong revenue engine — $124M FY2024 revenue at 2,200+ enterprise
              institutions, with a hybrid subscription + volume + AUC fee model that grows with client onboarding and
              digital asset transaction flow. The business is capital-efficient in its GTM (no disclosed CAC crisis,
              recurring revenue, enterprise stickiness) but is deliberately pre-profitable, investing through product,
              M&A, and regulatory infrastructure buildout. The risk to underwriters is not revenue quality but capital
              adequacy visibility: with $1B raised, $130M spent on TRES, and an unknown Dynamic price, cash runway is
              partially consumed and unknowable without management disclosure. The NYDFS Trust Company charter imposes
              minimum capital requirements that are publicly opaque. No debt is confirmed, but absence of evidence is
              not evidence of absence.

              Revenue quality is strong: enterprise contracts are multi-year, sticky, and linked to growing digital
              asset volumes. Price risk exists — G2 and PeerSpot reviewers flag cost as a barrier for smaller clients,
              suggesting a natural size floor and potential mid-market competitive vulnerability. Gross margin is
              unverified; the blended SaaS+custody model likely runs below pure-SaaS benchmarks. The $8B valuation
              anchor (January 2022) has not been re-priced publicly; in a market where crypto infrastructure multiples
              compressed substantially in 2022–2023, the 2022 mark likely overstates current fair value absent a new
              primary round. Overall: a financially maturing, strategically expanding, pre-profitable infrastructure
              company with strong top-line signals but material private gaps that block full underwriting confidence.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI032
