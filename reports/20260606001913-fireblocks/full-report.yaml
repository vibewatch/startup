        title: Competitive landscape and material alternatives
        blocks:
          - type: paragraph
            body: >-
              Fireblocks is not competing against one custody vendor. The relevant set spans crypto-native
              infrastructure peers, chartered or regulated trust-style custodians, exchange-linked stacks, self-custody
              substitutes, and large banks building digital asset infrastructure internally. On its own public surfaces,
              Fireblocks presents the broadest crypto-native workflow stack in this set: wallets, payments,
              tokenization, off-exchange operations, staking, compliance, and network connectivity for banks, fintechs,
              trading firms, and other financial institutions. The homepage also discloses meaningful scale
              markers—2,400 enterprises, $10T of transactions, and 550M wallets secured—which is large enough to make
              Fireblocks a genuine category reference point rather than a niche tooling vendor.


              But competitors anchor on different wedges. BitGo emphasizes qualified custody, 100% cold storage, and
              insurance. Anchorage centers a federally chartered crypto bank wrapper. Coinbase Prime combines custody
              with financing, execution, and an unusually explicit bank-and-broker distribution story. Fidelity brings
              an OCC-chartered trust bank plus legacy finance credibility. Zodia and BNY explicitly package bank-grade
              infrastructure for institutions that want a regulated operating model, while Citi is building tokenization
              and custody rails inside its own CIDAP stack. At the opposite end of the spectrum, Safe offers a
              transparent self-custody alternative for onchain treasuries. That means Fireblocks is best understood as
              the workflow-breadth leader inside a market where trust wrappers, distribution power, and build-versus-buy
              paths are increasingly diverse.
