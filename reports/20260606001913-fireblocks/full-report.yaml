      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Fireblocks has raised $1.04 billion across six disclosed rounds with no public debt or credit facility on
              record.  The fundraising trajectory is steeply accelerating: Series A in June 2019 ($16 million) was
              followed by Series B in November 2020 ($30 million, led by Paradigm, bringing Paradigm co-founder Fred
              Ehrsam onto the board), then three rounds in 2021 compressed the scale from $133 million (Series C, March)
              to $310 million (Series D, July, $2 billion post-money valuation) to $550 million (Series E, January 2022,
              $8 billion post-money valuation). The Series E was co-led by Spark Capital and D1 Capital Partners and
              drew ten institutional investors, including General Atlantic, Index Ventures, CapitalG (Alphabet), Canapi
              Ventures, Altimeter Capital, ParaFi Capital, and Iconiq Capital.  No new primary equity round has been
              announced as of June 2026, placing the last primary-market valuation at $8 billion (January 2022). 
              Secondary-market data from Nasdaq Private Market as of May 22, 2026 prices Fireblocks shares at $6.18 per
              share, a 14.42% increase over the prior reference price; 90-day secondary volume stood at approximately
              $160 million.  A web-search composite from mid-2026 suggests implied secondary pricing represents a 43.87%
              premium to March 2025 significant transactions, though these signals carry wide uncertainty.  No IPO
              filing or S-1 registration has been announced as of the run date.
