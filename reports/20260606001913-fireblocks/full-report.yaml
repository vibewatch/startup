  - id: TM008
    title: Competitive dynamics and build-vs-buy pressure
    columns:
      - Option
      - Why buyers choose it
      - Strength
      - Limitation versus Fireblocks
      - Market implication
    rows:
      - - Fireblocks-style platform
        - One control plane for custody, payments, tokenization, and policy
        - Workflow breadth and switching cost once live
        - Needs proof that breadth monetizes efficiently
        - Supports premium narrative if attach rates are real
      - - Point custody / wallet vendors
        - Narrower deployment and sometimes lower complexity
        - Focused controls for a subset of use cases
        - Less breadth across payments, tokenization, and treasury
        - Can pressure pricing in single-job mandates
      - - Bank internal build
        - Keeps infrastructure inside the regulated institution
        - Regulatory comfort and tighter control over data and processes
        - Longer build cycles and weaker ecosystem connectivity
        - Validates category but narrows external-vendor share
      - - Payment-network incumbents
        - Leverages existing merchant and bank relationships
        - Distribution and settlement expertise
        - May not offer neutral multi-asset control layer
        - Stablecoin growth can attract well-capitalized adjacent entrants
      - - Exchange-native or omnibus wallets
        - Fastest path for trading-focused firms
        - Immediate liquidity access
        - Weakest bankruptcy-remoteness and governance story
        - Fireblocks benefits when buyers migrate away from this status quo
