          - type: callout
            title: The fastest upgrade path is a data room, not a story upgrade
            body: >-
              If management can prove materially higher current revenue, attractive gross margin, clean preference
              terms, and credible exit preparation, the recommendation can move quickly. Without those documents, it
              should not.
