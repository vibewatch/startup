      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is real, which is why Fireblocks still belongs in the investable set
            body: >-
              The company is not a narrative-only crypto startup. Public sources support real customer, wallet,
              transaction, and institutional scale, and they show Fireblocks participating in higher-value workflows
              such as stablecoin payments and institutional SaaS operations.
            calloutType: strength
            claimRefs:
              - CV013
              - CV014
              - CV015
