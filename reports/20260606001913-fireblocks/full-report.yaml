companyProfile:
  summary: |
    Fireblocks is a New York-headquartered digital asset infrastructure company founded in 2018 by
    three Check Point Software cybersecurity alumni — Michael Shaulov (CEO), Pavel Berengoltz
    (CTO), and Idan Ofrat (CPO) — who investigated the 2017 Lazarus Group exchange hacks and
    identified the absence of institutional-grade custody. The company has raised $1.04 billion
    across six equity rounds, most recently a $550 million Series E at an $8 billion valuation
    co-led by D1 Capital Partners and Spark Capital in January 2022. Fireblocks serves 2,400+
    institutional organizations including BNY Mellon, BNP Paribas, Revolut, and Worldpay. Its
    core technology combines Multi-Party Computation wallets with patent-pending Intel SGX chip
    isolation to protect private keys. The platform covers four clusters: wallets and custody,
    payments (100+ countries), operations (policy engine, DeFi, AI), and financial applications
    (tokenization, staking, compliance). Third-party estimates place FY2024 revenue at approximately
    $124 million. No official audited financials, gross margin, NRR, or cap-table terms are
    publicly available.
