  - id: FV001
    title: Investment decision logic
    type: flow
    layout: standard
    summary: >-
      Scale and product breadth are real, but public monetization opacity and comp compression drive a research-more
      decision.
    data:
      nodes:
        - id: n1
          label: Customer and transaction scale
          type: input
          note: 150 → 800 → 1,500+ → 2,400 organizations; $10T+ scale
        - id: n2
          label: Institutional and payment proof
          type: input
          note: SEC memo plus Fifth Third stablecoin-network partnership
        - id: n3
          label: Current public monetization proof
          type: process
          note: $124M 2024 revenue; unprofitable; no current ARR disclosure
        - id: n4
          label: Public and private comp discipline
          type: process
          note: Coinbase ~5.6x-6.1x; BitGo ~4.6x; Anchorage $4.2B private mark
        - id: n5
          label: Secondary market reality
          type: process
          note: NPM at $6.18/share and Hiive at ~$5.43/share
        - id: n6
          label: Key missing diligence
          type: input
          note: ARR, margins, cap table, burn, retention, exit prep
        - id: n7
          label: 'Recommendation: research-more'
          type: output
      edges:
        - from: n1
          to: n3
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n7
        - from: n5
          to: n7
        - from: n6
          to: n7
    approximationNotes: >-
      This is a decision-logic map, not a weighted scoring model. It shows which evidence pushes the chapter toward
      caution at the current price.
