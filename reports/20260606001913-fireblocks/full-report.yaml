      - number: '3.3'
        title: Switching costs, multi-homing, distribution power, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Switching costs in institutional custody are real, but they are rarely absolute. The friction lives in
              operational configuration: vault hierarchies, policy engines, approval chains, APIs, onchain wallets,
              exchange connectivity, staking processes, reporting workflows, and off-exchange settlement patterns.
              Fireblocks benefits when a buyer wants all of those layers governed in one place, because every additional
              workflow connected to the platform makes removal harder. Coinbase, Kraken, and Fidelity similarly reduce
              switching by tying custody to execution or financing. Copper raises switching costs differently through
              exchange connectivity and ClearLoop. Zodia and Citi show a separate route: institutions can embed
              infrastructure into their own operating model rather than accept a purely external vendor boundary.


              The important disconfirming fact is that multi-homing is clearly becoming more legitimate. Zodia’s own
              2026 outlook says institutions are increasingly deciding how many custodians they need, not whether they
              need one. Safe gives technically capable teams an open-source self-custody route with no AUM fee, portable
              accounts, and role-based controls. BNY and Citi demonstrate that large financial institutions can position
              custody as just one component inside a broader banking, payments, collateral, and tokenization stack. So
              Fireblocks does have lock-in, but it is better described as workflow lock-in than structural monopoly
              power. The more buyers insist on multiple custodians, bank wrappers, or self-custody plus managed custody
              combinations, the harder it becomes for any single crypto-native platform to own the full relationship.
