  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >
              Fireblocks operates a hybrid software and infrastructure monetisation model combining three disclosed fee
              structures. First, a subscription platform fee tied to annual plans, with a base outbound volume threshold
              of $1M; volumes above that threshold incur a 0.20% overage rate. Second, the KeyLink collateral management
              product charges 3–30 basis points on assets under custody (AUC), introducing a recurring AUC-linked
              revenue stream that scales with institutional balance sheet deployment. Third, the Embedded Wallets tier
              charges per-wallet at scale, with the base plan including 1,000 Embedded Wallets; enterprise plans and
              custom pricing are available for larger deployments. The company described itself to the SEC as "a
              technology company that licenses a proprietary software-as-a-service (SaaS) platform to institutions,"
              confirming the subscription origin of most revenue. In practice, the business straddles SaaS and
              infrastructure pricing: subscription platform access with volume and AUC components layered on top.

              What is not publicly disclosed: realised average contract value (ACV), take rates on transaction volume,
              commission economics with liquidity provider partners, accounting treatment for gross vs. net presentation
              of customer asset flows, and revenue mix across the three fee types. The official pricing page lists the
              outbound volume model explicitly, but the list price is not the realised price for large institutional
              clients, which negotiate bespoke agreements. Revenue recognition for the Trust Company custody business
              may differ from software licensing revenue.
            claimRefs:
              - CI001
              - CI014
              - CI015
              - CI016
              - CI028
