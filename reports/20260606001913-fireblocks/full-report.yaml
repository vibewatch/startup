      - number: '5.3'
        title: Network, tokenization, and DeFi modules
        blocks:
          - type: paragraph
            body: >-
              Beyond custody, Fireblocks is trying to own the transaction surfaces around institutional digital assets.
              The Network is the connective layer for stablecoin payments, exchange settlement, and counterparty
              workflows; tokenization adds smart-contract templates, issuance, lifecycle governance, and audit-ready
              reports; DeFi adds WalletConnect, API, browser-extension, and MetaMask Institutional paths with risk
              controls before signing. The June 2026 Canton support announcement is a useful freshness marker because it
