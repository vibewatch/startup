      - number: '4.4'
        title: Cost structure, gross margin path, and profitability signals
        blocks:
          - type: paragraph
            body: >
              Fireblocks described FY2024 revenue of $124M to Forbes but remained unprofitable. This is consistent with
              a scaling infrastructure company that has invested heavily in sales, engineering, and now M&A. The cost
              base has three likely components: (1) R&D and engineering for platform and product expansions across 120+
              blockchains, the Policy Engine, DeFi integrations, and now TRES and Dynamic integrations; (2) commercial
              and sales headcount across 8 global offices to support the 2,400-client enterprise base; (3) regulatory
              and compliance overhead from the NYDFS Trust Company charter, SEC engagement, and multi-jurisdictional
              compliance infrastructure.

              No gross margin figure has been disclosed. For a SaaS infrastructure business without significant COGS
              other than cloud hosting and support, gross margins at this scale typically run 60–75% for pure software
              segments. The AUC and transaction-volume fee components add service delivery cost (custody operations,
              insurance, key management). The Trust Company custody segment likely has lower margins than pure SaaS. The
              16-month ROI payback cited in G2 reviews implies reasonable unit economics for buyers, but that is not the
              same as Fireblocks' own margin. Two consecutive acquisitions and an expanded Trust Company operation
              suggest operating losses will persist through at least 2026 while integration costs are absorbed.
            claimRefs:
              - CI002
