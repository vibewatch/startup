  - id: TE006
    title: MPC vs HSM / cold-wallet comparison and IP summary
    columns:
      - Approach or dependency
      - Key protection model
      - Operational fit
      - Advantage / IP angle
      - Residual risk
    rows:
      - - Pure cold storage
        - Offline keys, strong static isolation
        - Best for infrequent transfers and reserve storage
        - Maximizes air-gap discipline
        - Weak fit for always-on treasury, network settlement, and DeFi workflows
      - - HSM-centric online custody
        - Hardware-rooted signing and key protection
        - Good for regulated signing environments and bank-style controls
        - Mature security hardware lineage
        - More rigid for multi-party approval logic and cross-platform automation
      - - MPC-CMP + Policy Engine (Fireblocks core)
        - Distributed key shares plus programmable approval controls
        - Built for active treasury, settlement, tokenization, and API-led operations
        - Differentiates on workflow flexibility and policy granularity
        - More online workflow complexity and stronger dependence on operational controls
      - - Secure-enclave / SGX layer
        - Hardware-isolated execution around sensitive operations
        - Adds protection for runtime and signing processes
        - Supports proprietary chip-isolation narrative
        - TEE continuity, side-channel, and vendor-dependency risk remain
      - - Open-source mpc-lib signal
        - Public C++ cryptography library for CMP/EdDSA
        - Useful as developer and implementation evidence
        - Shows Fireblocks has in-house cryptographic implementation depth
        - Open-source visibility is not the same as third-party assurance of the production stack
      - - AWS-linked cloud distribution
        - SaaS delivery through partner and marketplace channels
        - Supports scale and ecosystem reach
        - Expands distribution and operating leverage
        - Adds cloud concentration and shared-responsibility exposure
    notes: >-
      This comparison is architectural and workflow-oriented rather than a formal benchmark. Fireblocks does not publish
      a full public patent schedule or production fallback architecture.
    claimRefs:
      - CE041
      - CE042
      - CE045
      - CE046
      - CE047
      - CE049
