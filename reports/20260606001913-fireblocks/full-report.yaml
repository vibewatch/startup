      - number: '4.2'
        title: Customer traction and GTM efficiency proxies
        blocks:
          - type: paragraph
            body: >
              Fireblocks serves 2,200–2,400 institutional organisations across exchanges, banks, fintechs, payment
              providers, and stablecoin issuers. The customer base includes Worldpay, BNY Mellon, BNP Paribas, Galaxy,
              and Revolut. Over $10 trillion in digital assets has been secured across 100+ blockchains, and 550+
              million wallets are managed on the platform. On the payments side, 100+ payment companies use Fireblocks
              to settle approximately 1.5 million transactions worth over $10B per month. The Enigma Securities case
              study illustrates the platform's upsell potential: a single broker-dealer grew quarterly transaction
              volume from $30M to $8B after onboarding — a 267x increase that also expands the variable fee component.

              GTM is enterprise sales-led with a developer and partner layer. Fireblocks sells direct to financial
              institutions and fintechs, with professional services and a partner ecosystem (40+ stablecoin providers,
              on/off-ramp networks, liquidity providers) creating network-effect lock-in. No public CAC, payback period,
              or NRR data is available. G2 and PeerSpot reviews indicate an ROI payback estimate of 16 months from
              implementation to positive return, suggesting capital-efficient sales motion for buyers — but high list
              prices create a size threshold below which the product is prohibitive. PeerSpot user feedback cites annual
              licensing fees as "quite high for institutions" and a "massive line item in operational budget," which
              constrains the SMB and lower-tier-exchange segment.
