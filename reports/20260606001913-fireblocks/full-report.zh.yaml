      - CV045
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析
    columns:
      - 情景
      - 核心假设
      - 倍数逻辑
      - 指示性价值区间
      - 概率信号
      - 相对 $8B 锚的含义
    rows:
      - - 悲观
        - $140M-$180M 收入，现有客户群变现温和，且没有溢价披露带来的重估
        - 4x-6x 收入，更接近承压的加密基础设施同业
        - $0.56B-$1.08B
        - ~35%，因为当前公开证据仍然稀疏，定价风险高
        - 相对上一轮新股融资意味着严重减记
      - - 基准
        - $175M-$250M 收入，企业增长延续，但利润率仍未公开，普通倍数压缩继续
        - 8x-12x 收入，高于 Coinbase / BitGo，但低于 2021-2022 年高峰亢奋
        - $1.40B-$3.00B
        - ~45%，因为规模真实，但当前变现证据不完整
        - 仍显著低于过时的 2022 年锚
      - - 乐观
        - $250M-$350M 收入，支付 / 稳定币变现强，且公开市场准备可信
        - 14x-18x 收入，需要稀缺性溢价和更干净的披露
        - $3.50B-$6.30B
        - ~20%，因为它同时需要执行兑现和更友好的加密股权窗口
        - 接近但没有明确超过历史 $8B 标记
    notes: 区间是情景带，不是管理层预测。它们刻意锚定保留下来的公开事实和可比公司纪律，而不是没有支撑的 DCF。
    claimRefs:
