      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景建模
        blocks:
          - type: paragraph
            body: >-
              情景工作必须明确区分哪些是估计、哪些是证据。证据给出三个硬锚：最后一次公开收入数字是 2024 年 $124 million，公开可比公司的收入倍数大多落在中个位数到低双位数区间，Fireblocks
              还没有给出足以支撑公开市场稀缺性溢价的披露质量。因此，悲观情景假设收入只升至约 $140 million 到 $180 million，市场把 Fireblocks 更接近承压托管或基础设施公司处理，给 4x 到
              6x 收入倍数，对应价值约 $0.56 billion 到 $1.08 billion。基准情景假设公开证据低估了公司，但没有离谱错误，收入进入 $175 million 到 $250 million
              区间，倍数为 8x 到 12x，对应约 $1.4 billion 到 $3.0 billion。乐观情景假设支付网络扩张、稳定币基础设施和客户货币化都跑得足够好，可支撑 $250 million 到 $350
              million 收入，以及 14x 到 18x 倍数，即 $3.5 billion 到 $6.3 billion。即便如此，乐观情景也并不明显超过已经陈旧的 $8 billion 轮次标记。
