      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管故事同时是优势和剩余风险。Fireblocks Trust 给了公司一个受纽约监管的合格托管界面，SEC
              工作人员的不采取行动救济也改善了顾问和基金使用某些州信托公司做加密托管的路径。但反向记录不能忽略：Crenshaw 委员的异议明确主张，该救济削弱了核心保护；MiCA
              又增加了一套独立的欧盟授权和运营韧性制度，客户和合作伙伴都必须满足。法律风险也仍在场。StakeHound 指控丢失 38,178 ETH，Fireblocks 否认前提并称密钥位于生产 MPC
              结构之外；2026 年 Celsius 破产报道又重启了围绕所谓被销毁密钥的证据开示。剩余风险不是每项指控都会被证明，而是托管信任可能被单一、有争议的密钥控制叙事击伤。美国 /
              以色列争议记录之外，还有更多制度压力：DORA 在欧洲抬高 ICT 和外包预期，FATF Travel Rule 指引让数据共享和制裁工作流继续昂贵，APAC
              推进仍受本地牌照约束，而不是一张统一护照。这些规则不会让 Fireblocks 失去可投资性，但意味着地理扩张始终伴随控制建设成本。
