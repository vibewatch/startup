      - number: '1.5'
        title: 里程碑、合作伙伴与负面事件
        blocks:
          - type: paragraph
            body: >-
              Fireblocks 的里程碑从 2018 年创立延伸到 2026 年当前产品扩张。公司在 2019 年 6 月随 Series A 推出生产基础设施，并在 2020 年 11 月（Series B）报告已保护
              $150B 数字资产、服务 120+ 商业客户。收购战略始于 2023 年 9 月收购澳大利亚区块链专业服务公司 BlockFold，并在 2025 年 10 月收购
              Dynamic（钱包与入驻基础设施，非官方数字约 $90M）、2026 年 1 月收购 TRES Finance（$130M，现金加股权）后提速；TRES 是一家加密会计和财务报告平台，服务 200+
              客户。合作里程碑包括 BNY Mellon（Series D 共同投资者和锚定客户）、Chainalysis 与 Elliptic（合规集成），以及 2025 年 SEC Crypto Task Force
              沟通，Fireblocks 向委员会展示了技术托管标准。主要负面事件有：(1) StakeHound 于 2021 年 6 月向 Tel Aviv District Court 提起诉讼，称 Fireblocks
              员工疏忽，未备份与 ETH 2.0 质押项目相关的 BLS 密钥份额，导致 38,178 ETH（起诉日约 $75M）永久丢失。Fireblocks 否认责任，称密钥由 StakeHound
              生成并存放在其平台之外。最新公开报道显示，该案仍未解决。(2) 2026 年 3 月，Celsius 破产管理人指控 Fireblocks 存在「惊人疏忽」，并称 Fireblocks 销毁了控制大量
              Celsius Ethereum 代币的加密密钥，已在纽约破产法院申请证据开示。两起事件事实不同，却共同形成反复出现的密钥管理风险叙事，交易对手和监管机构会仔细审视。
