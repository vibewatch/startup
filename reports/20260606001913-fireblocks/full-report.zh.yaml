      - number: '8.6'
        title: 最终尽调缺口与建议
        blocks:
          - type: paragraph
            body: >-
              正确姿态不是把 Fireblocks 视为被过度炒作的加密遗物，因为公司显然拥有真实客户规模、机构相关性和产品宽度；也不是照单全收旧的 $8 billion
              标记。公开证据太薄，无法支持后者。保留下来的最佳当前数字显示，2024 年收入为 $124 million
              且未盈利，而当前老股页面只显示中个位数每股报价，也没有通向新一轮高溢价一级融资的清晰路径。Coinbase 和 BitGo 等公开可比、Anchorage 等私有可比，都提示相对于 2021–2022
              年加密高峰定价，倍数已经压缩。因此，本章落在继续研究，而不是买入或回避。上行真实到足以让 Fireblocks 留在可投资集合里，但现在的承保纪律取决于私有尽调能否关闭一小组关键缺口：当前 ARR
              与收入桥、毛利率与烧钱速度、客户留存质量、精确股份数与优先股堆叠，以及可信的退出准备。没有这些文件，按公开证据看估值仍然偏高。
            claimRefs:
