chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Fireblocks Inc.（法律实体 Fireblocks, Inc.，2022 年 5 月在 Delaware 注册；经营实体 Fireblocks LLC 2023 年 4 月成立）是一家私营 SaaS
              公司，总部位于 441 9th Avenue, New York, NY 10001。公司销售云端交付的数字资产基础设施平台，帮助金融机构、金融科技公司、加密原生公司和 Web3
              公司以机构规模创建、转移、保护和管理数字资产。核心技术把多方计算（MPC）钱包与申请中专利的芯片隔离结合起来保护私钥，消除托管与转账流程中的单点故障。平台覆盖四个产品板块： (1)
              钱包与托管（财资管理、钱包即服务、嵌入式钱包、Fireblocks Trust Company）；(2) 支付（覆盖 100+ 个国家和 60+ 种货币的 Network for Payments、Agentic
              Payments，以及面向稳定币轨道的 Flow 产品）； (3) 运营（自动化、AI 套件、Policy Engine、DeFi 安全）；(4)
              金融应用（代币化、质押、收益、对账和合规集成）。Fireblocks 通过 SaaS 许可费赚钱，并越来越多地从支付网络交易费中获收。第三方估计年收入约 $193M，但 Fireblocks 未披露官方数字。截至
              2026 年 6 月，公司在全球运营，办公室位于美国、英国、以色列、香港、新加坡、德国、法国和瑞士。
