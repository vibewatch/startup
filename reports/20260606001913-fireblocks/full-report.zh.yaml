      - number: '7.4'
        title: 市场周期性、对手方 / 违约暴露与依赖
        blocks:
          - type: paragraph
            body: >-
              后 FTX 时代远离交易所钱包的迁移利好 Fireblocks，但同一段历史也证明，客户需求、交易量和信用质量可以转向得很快。Celsius、FTX、BlockFi、Voyager 和 Genesis
              这组破产集群证据显示，加密原生客户可能因杠杆、欺诈或资产价格周期而失败。这制造了一个悖论：交易所黑客攻击和资不抵债强化了场外结算逻辑，但客户违约和交易量下滑仍会伤害 Fireblocks
              的收入和声誉。合作伙伴和依赖风险很宽：监管者决定合格托管可接受性，交易所和流动性场所驱动场外工作流，区块链制造正常运行时间和最终性依赖，托管竞争者也会压价。银行去中介化也是双向的，因为 Fireblocks
              可以替代交易所 / 银行工作流，而银行和 OCC 特许供应商也会把同样能力内化。独立银行自建项目和 Fireblocks 自身收购节奏也抬高执行风险。Kinexys 证明大型银行仍在建设内部轨道；Dynamic
              和 TRES 集成则扩大了 Fireblocks 必须同时支持和统一的范围。
