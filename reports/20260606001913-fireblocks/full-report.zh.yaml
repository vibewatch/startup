      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Fireblocks 由 Michael Shaulov（CEO）、Pavel Berengoltz（CTO）和 Idan Ofrat（CPO）于 2018 年共同创立。三人此前十年都在以色列头部网络安全公司
              Check Point Software Technologies 工作，并参与调查 2017 年 Lazarus Group 从四家韩国交易所盗取 $200M Bitcoin
              的专项小组。调查同时暴露了犯罪组织对数字资产的兴趣规模，以及企业级托管方案缺位，这直接推动了公司创立。加入 Check Point 之前，Michael Shaulov 曾创立 Lacoon Mobile
              Security，Check Point 于 2015 年以约 $100M 收购该公司。三位创始人仍掌握运营控制权；凭借网络安全和机构金融背景，市场普遍认为他们具备强创始人-市场匹配。更广的高管团队包括 Oded
              Blatman（CIO 和 CISO）、Michal Ferguson（CMO）、Madan Gadde（Chief Customer Officer）、Stephen Richardson（Chief
              Strategy Officer and Head of Banking）、Ran Goldi（SVP Payments and Network）、Adam Levine（Fireblocks Financial
              Services CEO）、Michael Levine（CFO）、Jason Allegrante（Chief Legal and Compliance Officer，前 Federal Reserve
              Bank of New York）、Matt Maloney（SVP Global Sales）、Stuart Thompson（Chief People Officer）和 Scott Harvey（Chief
              Revenue Officer）。董事会包括 Fred Ehrsam（Paradigm 联合创始人，2020 年加入）、Gili Raanan（Cyberstarts 创始人兼 GP，早期支持者）、Tom
              Banahan、Ken Fox 和 Gil Mandelzis。自 2024 年以来未见重大已披露领导层变动。Michael Shaulov
              身兼公众面孔、战略发言人和主要产品愿景人物，对他的关键人依赖是已知治理风险；不过，高管团队宽度降低了单点失效风险。
