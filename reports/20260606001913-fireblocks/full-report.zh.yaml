  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：机构控制层，而不是整个加密市场
        blocks:
          - type: paragraph
            body: >-
              Fireblocks
              的可投资市场应围绕机构数字资产基础设施划边界，而不是整个加密经济。纳入边界的任务包括托管和钱包治理、客户与财资钱包运营、稳定币支付与结算连接、代币发行和生命周期工具、合规控制，以及接入交易所、流动性场所、区块链和后台系统。这一边界既包括卖给银行和金融科技公司的技术，也包括嵌入受监管经营模型中的托管工作流。除非活动需要机构级密钥控制和交易策略，否则应排除投机性代币交易、消费者自托管钱包、挖矿、NFT
              市场、交易所交易费和通用区块链开发者工具。这个区分很关键：多数公开市场报告引用资产价值或类似 AUC 的口径，而 Fireblocks 通过软件、托管、服务和网络工作流变现，这些收入绑定生产级数字资产运营。
