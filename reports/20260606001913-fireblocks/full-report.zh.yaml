    title: 估值
    sections:
      - number: '8.1'
        title: Series E 融资背景
        blocks:
          - type: paragraph
            body: >-
              Fireblocks 的估值工作仍要从 2022 年 1 月的镜头切入。经验证的一级锚点是 $550 million Series E 融资，估值 $8 billion，由 D1 Capital Partners
              和 Spark Capital 共同领投。Forbes 当前公司档案仍重复这个 $8 billion 标记，并称 Fireblocks 2024 年收入为 $124
              million、仍未盈利。这个组合很关键，因为它把历史融资从声望事实变成估值问题：按最后一个公开收入分母，旧估值约等于 64.5x 收入；即便采用更宽松的 2026 年工作 ARR 假设，约 $156
              million，仍约等于 51x ARR。当前老股页面没有确认新的上轮融资。Nasdaq Private Market 在 2026 年 5 月下旬显示每股 $6.18，Hiive 在 6 月上旬显示每股约
              $5.43 且有实时订单。这些页面不是完整估值证明，因为股份数和优先权条款仍是私有信息，但它们确实显示，流动性发现发生在通常伴随干净新一级融资或 IPO 进程的信心水平之下。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV020
              - CV021
      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑不难讲。Fireblocks 有真实机构规模，不是投机性演示带来的牵引。公司公开资料和自有页面显示，客户路径从 2021 年 150 家，到 2022 年 1 月 800 家、2022 年 1,500
              个部署，再到当前客户页面的 2,400 家组织。LinkedIn 称平台保护了超过 $10 trillion 的数字资产交易，当前材料还提到数亿个钱包。SEC Crypto Task Force 备忘录也把
              Fireblocks 描述为由 BNY Mellon 和 BNP Paribas 等成熟机构使用的 SaaS 平台，而 Fifth Third
              提交的演示材料显示，公司参与的是稳定币支付基础设施，不只是冷存储。反向逻辑同样真实。G2 和 PeerSpot 都说定价陡峭，这意味着产品宽度不保证大众市场可负担。StakeHound
              争议等历史诉讼提醒市场，托管基础设施仍可能承载运营尾部风险。最重要的是，规模证明远好于货币化证明：自 2022 年融资周期以来，公司没有公开更新当前 ARR、毛利率、烧钱速度或股权结构条款。
