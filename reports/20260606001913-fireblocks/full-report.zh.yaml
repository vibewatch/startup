  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >
              Fireblocks 采用混合软件与基础设施变现模型，结合了三类已披露收费结构。第一，绑定年度计划的订阅平台费，基础外发交易量门槛为 $1M；超过门槛的交易量收取 0.20% 超额费率。第二，KeyLink
              抵押品管理产品按托管资产（AUC）收取 3–30 bps，引入与 AUC 挂钩的经常性收入流，随机构资产负债表部署扩大而增长。第三，Embedded Wallets 层级按钱包规模收费，基础计划包含 1,000
              个 Embedded Wallets；更大部署可使用企业计划和自定义定价。公司向 SEC 称自己是「一家向机构许可专有软件即服务（SaaS）平台的技术公司」，确认大部分收入起源于订阅。实际业务横跨 SaaS
              和基础设施定价：订阅平台访问是底座，上面叠加交易量和 AUC 组件。

              未公开的信息包括：实际平均合同价值（ACV）、交易量抽成率、与流动性提供商伙伴的佣金经济、客户资产流按总额法还是净额法列报的会计处理，以及三类收费的收入结构。官方定价页明确列出外发交易量模型，但标价不是大型机构客户的实际成交价，后者会谈判定制协议。Trust
              Company 托管业务的收入确认可能不同于软件许可收入。
