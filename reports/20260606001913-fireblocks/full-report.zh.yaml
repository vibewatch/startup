      - number: '8.3'
        title: 可比公司估值分析
        blocks:
          - type: paragraph
            body: >-
              可比集方向上清楚，即便没有完美的上市类比。Coinbase 是最显眼的上市加密平台，带有机构托管暴露；其 2026 年 6 月快照很有参考价值：市值约 $40.15 billion，对应 $6.56
              billion 追踪收入和 $7.18 billion FY2025 收入，销售倍数约 5.6x 至 6.1x。Coinbase Prime 也明确营销合格托管基础设施，使其比 Fireblocks
              更宽，但仍相关。BitGo 是商业模式更接近的可比对象，因为其官方定位横跨托管、钱包、融资、稳定币和结算，且 2026 年 1 月 IPO 带来了真实公开价格发现。到 2026 年 6
              月，multiples.vc 显示 BitGo EV 约 $957 million、LTM 收入 $209 million、EV / 收入 4.6x。Anchorage 是有价值的私有可比，因为 2026 年 2
              月 Tether 投资把其估值定在 $4.2 billion，而 OCC 特许带有可执行的资本和流动性要求。Circle
              不是托管同业，但其提交的季度业绩展示了公开投资者可承保的加密基础设施披露与盈利能力门槛。放在这组可比之下，Fireblocks 看起来具有战略重要性，但仍严重锚定在 2022 年私募市场环境。
