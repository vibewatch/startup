      - number: '4.5'
        title: 证据缺口与财务结论
        blocks:
          - type: paragraph
            body: >
              公开记录支持一个强收入引擎：FY2024 收入 $124M、2,200+ 家企业机构客户，混合订阅 + 交易量 + AUC 收费模型会随客户接入和数字资产交易流增长。GTM 具备资本效率（未披露 CAC
              危机、经常性收入、企业粘性），但公司有意保持盈利前状态，继续投入产品、M&A 和监管基础设施。承销方的风险不是收入质量，而是资本充足可见度：已募 $1B、TRES 花费 $130M、Dynamic
              价格未知，现金缓冲已被部分消耗，若管理层不披露就无法判断。NYDFS Trust Company 牌照带来最低资本要求，公开上不透明。没有确认债务，但没有证据不等于证明没有债务。

              收入质量强：企业合同多年期、粘性高，并与增长中的数字资产交易量绑定。价格风险存在——G2 和 PeerSpot 评论者指出成本阻碍较小客户，说明存在天然规模下限和潜在中端市场竞争脆弱性。毛利率未验证；混合
              SaaS+托管模型可能低于纯 SaaS 基准。$8B 估值锚（2022 年 1 月）未被公开重估；加密基础设施倍数在 2022–2023 大幅压缩，在没有新股融资轮的情况下，2022
              年估值很可能高估当前公允价值。总体看，Fireblocks 是一家财务上正在成熟、战略上正在扩张、仍处盈利前阶段的基础设施公司，收入端信号强，但私营信息缺口重大，阻断完整承销信心。
