      - - '2023-06-09'
        - 欧盟
        - MiCA 作为全欧加密资产框架获采纳
        - 为托管、代币和电子货币式产品建立可通行的规则手册
        - 授权和合规落地仍然繁重
      - - 2025-2026
        - 美国
        - 政策基调转向支持银行和机构参与数字资产
        - 提升买方为生产级基础设施拨款的意愿
