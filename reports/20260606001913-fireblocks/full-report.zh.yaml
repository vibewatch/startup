      - number: '4.2'
        title: 客户牵引力与 GTM 效率代理指标
        blocks:
          - type: paragraph
            body: >
              Fireblocks 服务 2,200–2,400 家机构，覆盖交易所、银行、金融科技公司、支付提供商和稳定币发行方。客户包括 Worldpay、BNY Mellon、BNP Paribas、Galaxy 和
              Revolut。平台已在 100+ 条区块链上保护超过 $10T 数字资产，并管理 550M+ 个钱包。支付侧，100+ 家支付公司使用 Fireblocks，每月结算约 1.5M 笔交易，价值超过
              $10B。Enigma Securities 案例研究体现平台的增购潜力：一家经纪交易商接入后，季度交易量从 $30M 增至 $8B，增长 267x，也扩大了可变费用组件。

              GTM 由企业销售主导，并带有开发者和合作伙伴层。Fireblocks 直接销售给金融机构和金融科技公司，专业服务和合作生态（40+ 家稳定币提供商、出入金网络、流动性提供商）共同形成网络效应锁定。公开资料没有
              CAC、回本周期或 NRR 数据。G2 和 PeerSpot 评论显示，从实施到正回报的 ROI 回本估计为 16 个月，说明买方采用后的资本效率尚可；但高标价形成规模门槛，门槛以下产品过于昂贵。PeerSpot
              用户反馈称年度许可费「对机构相当高」，也是运营预算中的「巨大项目」，这会限制 SMB 和低层级交易所细分市场。
