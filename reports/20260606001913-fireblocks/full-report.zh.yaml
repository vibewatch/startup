      - number: '3.3'
        title: 切换成本、多供应商并用、分销能力与替代品
        blocks:
          - type: paragraph
            body: >-
              机构托管的切换成本真实存在，但很少是绝对的。摩擦来自运营配置：金库层级、策略引擎、审批链、API、链上钱包、交易所连接、质押流程、报告工作流和场外结算模式。当买方希望把这些层统一放在一处治理时，Fireblocks
              受益，因为每多接入一个工作流，移除平台就更难。Coinbase、Kraken 和 Fidelity 也通过把托管绑定执行或融资来降低切换。Copper 则通过交易所连接和 ClearLoop
              以不同方式抬高切换成本。Zodia 和 Citi 展示了另一条路径：机构可以把基础设施嵌入自身运营模型，而不是接受纯外部供应商边界。


              重要的反证是，多供应商并用明显变得更正当。Zodia 自己的 2026 展望称，机构越来越多是在决定需要多少家托管方，而不是是否需要托管方。Safe 给技术成熟团队一条开源自托管路径，不收 AUM
              费，账户可迁移，并提供基于角色的控制。BNY 和 Citi 证明，大型金融机构可以把托管定位为更广的银行、支付、抵押品和代币化栈中的一个组件。因此，Fireblocks
              确实有锁定效应，但更准确地说是工作流锁定，而不是结构性垄断力量。买方越坚持多托管方、银行外壳，或自托管加托管服务组合，任何单一加密原生平台就越难拥有完整关系。
