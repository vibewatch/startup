      - number: '4.4'
        title: 成本结构、毛利路径与盈利信号
        blocks:
          - type: paragraph
            body: >
              Fireblocks 向 Forbes 描述 FY2024 收入为 $124M，但仍未盈利。这与一家扩张中的基础设施公司相符：它重投销售、工程，现在又重投 M&A。成本基础大概有三块：(1)
              平台和产品扩展的研发与工程，覆盖 120+ 条区块链、Policy Engine、DeFi 集成，以及当前 TRES 和 Dynamic 集成；(2) 8 个全球办公室的商业和销售人员，用来支持 2,400
              家客户的企业基础；(3) 来自 NYDFS Trust Company 牌照、SEC 沟通和多司法辖区合规基础设施的监管与合规开销。

              公司未披露毛利率。对一家除云托管和支持外没有显著 COGS 的 SaaS 基础设施业务而言，这一规模下纯软件板块毛利率通常为 60–75%。AUC
              和交易量费用组件增加了服务交付成本（托管运营、保险、密钥管理）。Trust Company 托管板块的毛利率可能低于纯 SaaS。G2 评论引用的 16 个月 ROI 回本说明买方单位经济性合理，但这不等于
              Fireblocks 自身利润率。连续两笔收购和扩张后的 Trust Company 运营意味着，至少到 2026 年，整合成本被吸收前运营亏损仍会持续。
