      - number: '2.5'
        title: 限制与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              本章最强的结论是方向性，而不是数字精确：Fireblocks 位于托管、钱包治理、稳定币结算、财资自动化和代币化基础设施的交叉点，这些领域都有可信的采用驱动。最弱的结论是精确的可获取市场。公开来源未披露
              Fireblocks 的细分
              ARR、ACV、客户集中度、流失率、支付抽成率、按客户类型划分的稳定币交易量，或从已获预算试点转为生产的转化率。供应商撰写的买方指南和合作公告有助于梳理工作流，但作为需求证据存在偏向。下一阶段尽调应要求披露细分收入、已签约积压订单、净留存、按银行
              / 金融科技 / 支付 / 代币化细分的销售管线、部署转化率，以及按区域划分的合规成本。在此之前，市场规模测算应保留相互矛盾的估计，并明确每个数字到底是资产价值、收入、软件支出，还是长期代币化邻近市场。
