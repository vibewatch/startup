  - id: TE006
    title: MPC 与 HSM / 冷钱包对比与知识产权摘要
    columns:
      - 路线或依赖
      - 密钥保护模型
      - 运营适配度
      - 优势 / 知识产权角度
      - 剩余风险
    rows:
      - - 纯冷存储
        - 密钥离线，静态隔离强
        - 最适合低频转账和储备存储
        - 把物理隔离纪律做到最强
        - 对常在线资金管理、网络结算和 DeFi 工作流适配弱
      - - HSM 为核心的在线托管
        - 签名和密钥保护扎根硬件
        - 适合受监管签名环境和银行式控制
        - 安全硬件脉络成熟
        - 面对多方审批逻辑和跨平台自动化，更僵硬
      - - MPC-CMP + Policy Engine（Fireblocks 核心）
        - 分布式密钥分片，加可编程审批控制
        - 面向活跃资金管理、结算、代币化和 API 驱动运营
        - 工作流灵活度和策略颗粒度拉开差异
        - 在线工作流更复杂，也更依赖运营控制
      - - 安全飞地 / SGX 层
        - 敏感操作在硬件隔离环境中执行
        - 为运行时和签名流程加一层保护
        - 支撑自研芯片隔离叙事
        - TEE 连续性、侧信道和供应商依赖风险仍在
      - - 开源 mpc-lib 信号
        - 面向 CMP/EdDSA 的公开 C++ 密码学库
        - 可作为开发者和实现层证据
        - 显示 Fireblocks 具备内部密码学实现深度
        - 开源可见度不等于生产栈通过第三方保证
      - - AWS 相关云分发
        - 通过合作伙伴和应用市场渠道交付 SaaS
        - 支撑规模和生态触达
        - 放大分发和运营杠杆
        - 增加云集中度和共同责任敞口
    notes: 本对比聚焦架构和工作流，不是正式基准测试。Fireblocks 未公开完整专利清单或生产备用架构。
    claimRefs:
      - CE041
      - CE042
      - CE045
      - CE046
      - CE047
      - CE049
