      - number: '2.4'
        title: 增长驱动、约束、信任与切换成本
        blocks:
          - type: paragraph
            body: >-
              最清晰的需求驱动来自银行预算形成、稳定币支付、代币化证券和存款、财资自动化，以及从试点进入生产的需求。Fireblocks 2026 年调查显示，预算不再是唯一瓶颈：88% 的金融机构已经或将投入预算，只有
              16% 进入生产，只有 15% 认为托管和钱包治理已完全达到生产就绪。生产缺口利好基础设施供应商，但约束仍然实质。稳定币和托管规则增加了牌照、资产隔离、赎回、报告、制裁和旅行规则义务；BIS
              风险分析提醒，不能假定加密基础设施具备传统金融稳定性特征；Visa
              等既有巨头也在围绕稳定币建设。因此，信任既是买方触发点，也是锁定机制：一旦策略规则、API、恢复流程和审计轨迹嵌入系统，切换就变成受监管迁移项目，而不是简单更换供应商。区域上，美国仍是近期最深的买方池；欧洲在
              MiCA 和 ECB 主导的市场轨道工作下，是政策驱动最快的加速器；APAC 通过本地牌照路径增长，而不是一个协调一致的制度。竞争压力也从加密原生托管方扩展到支付巨头和银行自建。
