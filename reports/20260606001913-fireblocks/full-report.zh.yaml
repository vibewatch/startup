      - number: '8.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 规模真实，这就是 Fireblocks 仍属于可投资集合的原因
            body: 公司不是只有叙事的加密创业公司。公开来源支持真实的客户、钱包、交易和机构规模，也显示 Fireblocks 正参与稳定币支付和机构 SaaS 运营等更高价值工作流。
            calloutType: strength
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
          - type: callout
            title: 估值锚点远超当前公开货币化证据
            body: 只有当前收入大幅高于最后公开数字，或市场重新支付周期峰值倍数，旧的 $8 billion 标记才成立。公开可比公司和当前老股页面今天都不支持这个判断。
            calloutType: risk
            claimRefs:
              - CV020
              - CV021
              - CV023
              - CV026
              - CV030
          - type: callout
            title: 最快的上修路径是数据室，不是叙事升级
            body: 如果管理层能证明当前收入明显更高、毛利率有吸引力、优先权条款干净，并且退出准备可信，建议可以很快上调。没有这些文件，就不应该上调。
            calloutType: recommendation
            claimRefs:
