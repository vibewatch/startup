        - label: $800M 收入 @ 10x
          value: 8000
          unit: USDm
          note: 支撑旧新股估值的另一条路径
    approximationNotes: 条形展示的是保留公开数字和承销假设的分析组合。它们说明估值敏感性，不是公司报告的结果。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV026
      - CV030
  - id: FV003
    title: 估值和回报区间
    type: range
    layout: standard
    summary: 即使在强乐观情景下，公开证据支持的估值区间也集中在过时的 2022 年新股锚点之下。
    data:
      items:
        - label: 悲观
          low: 560
          mid: 820
          high: 1080
          unit: USDm
          detail: 可比倍数压缩，收入进展也只是温和。
        - label: 基准
          low: 1400
          mid: 2200
          high: 3000
          unit: USDm
          detail: 规模明显改善，但倍数按常规压缩。
        - label: 乐观
          low: 3500
          mid: 4900
          high: 6300
          unit: USDm
          detail: 支付和稳定币货币化强劲，披露也更好。
        - label: 2022 年新股锚点
          low: 8000
          mid: 8000
          high: 8000
          unit: USDm
          detail: 沿用 Series E 估值作参照，不当作公允价值。
    approximationNotes: 区间是以百万美元计的承销区间，由可比倍数纪律和公开证据推导，不是管理层预测。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Fireblocks 在规模和产品宽度上得分高，但估值吸引力和披露完整度得分低。
    data:
      items:
        - label: 客户规模
          value: 9
          note: 2,400 家组织，以及多年增长轨迹
        - label: 产品宽度
          value: 8
          note: 托管、支付、稳定币、代币化、钱包基础设施
        - label: 机构证明
          value: 8
          note: SEC 备忘录，以及银行 / 支付合作伙伴证据
        - label: 货币化透明度
          value: 3
          note: 当前 ARR、利润率和烧钱速度仍未公开
        - label: 当前估值吸引力
          value: 2
          note: 上市可比公司和情景测算都远低于过时的 2022 年锚点
        - label: 退出准备度
          value: 4
          note: 窗口存在，但 Fireblocks 缺少上市公司级披露
        - label: 证据质量
          value: 5
          note: 足以判断估值偏高，不足以给出买入结论
    approximationNotes: 分数是 0-10 的序数型尽调判断，综合保留证据得出，不是公司报告指标。
    claimRefs:
      - CV013
      - CV016
      - CV018
      - CV019
      - CV042
      - CV047
