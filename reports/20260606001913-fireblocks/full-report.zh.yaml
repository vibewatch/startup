      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Fireblocks 已完成六轮公开披露融资，累计募得 $1.04B，公开记录中没有债务或信贷安排。融资曲线陡峭加速：2019 年 6 月 Series A（$16M）之后，2020 年 11 月完成
              Series B（$30M，Paradigm 领投，Paradigm 联合创始人 Fred Ehrsam 入董事会），随后 2021 年三轮融资把规模从 $133M（Series C，3 月）压缩式抬升至
              $310M（Series D，7 月，投后估值 $2B），再到 $550M（Series E，2022 年 1 月，投后估值 $8B）。Series E 由 Spark Capital 和 D1 Capital
              Partners 共同领投，并吸引十家机构投资者，包括 General Atlantic、Index Ventures、CapitalG（Alphabet）、Canapi Ventures、Altimeter
              Capital、ParaFi Capital 和 Iconiq Capital。截至 2026 年 6 月，公司未宣布新的新股融资轮，最后一次新股市场估值仍是 $8B（2022 年 1 月）。Nasdaq
              Private Market 截至 2026 年 5 月 22 日的老股市场数据显示，Fireblocks 股票价格为每股 $6.18，较前一参考价上涨 14.42%；90 天老股交易量约 $160M。2026
              年中网络搜索综合信号显示，隐含老股定价较 2025 年 3 月重大交易溢价 43.87%，但这些信号不确定性很高。截至报告日，公司尚未宣布 IPO 申请或 S-1 注册。
