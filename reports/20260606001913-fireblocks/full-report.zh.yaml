  - id: TP003
    title: 定价 / 打包方式对比
    columns:
      - 竞品 / 路径
      - 观察到的定价或合同信号
      - 包含能力
      - 披露不透明性或注意事项
      - 对 Fireblocks 的含义
    rows:
      - - Fireblocks
        - 联系销售；无公开托管费率表
        - 钱包、支付、合规、代币化、交易所外运营
        - 官网显示走企业销售定价流程，不披露标价经济性
        - 能力覆盖强，但买家不进入销售流程就无法对标价格
      - - BitGo
        - 销售主导；无实时公开托管价格卡
        - 合格托管、保险、结算、稳定币、主经纪
        - 官方页面强调联系销售和价值主张，而非费率
        - 信任栈占优，但公开定价并不比 Fireblocks 更透明
      - - Anchorage Digital
        - 销售主导；无公开标价
        - 托管、交易、融资、结算、质押、稳定币
        - 牌照和平台广度公开，但定价不公开
        - 信托外壳强，但价格发现仍需销售周期
      - - Copper
        - 销售主导；无公开标价
        - MPC 托管、ClearLoop、质押、财资、衍生品、借贷
        - 产品价值清楚，合同经济性不清楚
        - ClearLoop 有差异化，但 Fireblocks 在透明度上并不让步
      - - Coinbase Custody
        - $0-$10,000 实施费；50 bps 年费；$500,000 最低余额
        - 隔离冷存储、受监管托管、保险、经审计报表、质押
        - 公开价目表仍然粗略，且依赖使用场景
        - Coinbase 给采购团队的价格锚点比 Fireblocks 更清楚
      - - Gemini Custody
        - 无固定最低余额；每项资产月最低 $30；按交易量和持仓定制方案
        - 合格托管、从冷存储直接交易、保险、隔离地址
        - 抓取页面无公开百分比费率表
        - Gemini 在最低费用定位上比 Fireblocks 更透明，但没有完整公开标价
      - - Safe / 自托管
        - 抓取到的对比页面显示 0 AUM 费用
        - 多签财资、角色、支出限额、可迁移账户
        - 组织仍需自己承担签名人、运营和合规负担
        - 对技术能力强的团队，Safe 是低费用替代中最清晰的一类
    notes: 该品类很少披露公开价格。因此，本表混合列出明确价格点、最低费用和合同模式信号，而不是假装每家竞品都披露同等程度的经济细节。
