  productSummary: |
    Fireblocks 提供云端数字资产基础设施平台，把 MPC-CMP 托管、Intel SGX 硬件隔离、跨机构支付网络、交易自动化策略引擎，
    以及覆盖 100+ 条区块链的 API 连接整合在一起。平台覆盖钱包与托管（财资管理、嵌入式钱包、Fireblocks Trust Company）、
    支付（稳定币轨道、智能体支付、跨境）、运营（合规、DeFi、AI 套件）和金融应用（代币化、质押、收益、对账）。
  customerFocus: |
    目标客户是金融机构、金融科技公司、加密原生交易所、支付处理商、Web3 公司和受监管托管方，它们需要机构级数字资产基础设施。
    已点名的锚定客户包括 BNY Mellon、BNP Paribas、Revolut、Worldpay 和 Fifth Third Bank。
  businessModel: |
    混合 SaaS 与基础设施模式：年度订阅平台费（基础外发交易量门槛 $1M；超额部分 0.20%）、与 AUC 挂钩的托管费
