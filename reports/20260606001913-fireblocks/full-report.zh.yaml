      - number: '2.2'
        title: 规模口径：宽 TAM、窄 SAM 与不可用的精确数
        blocks:
          - type: paragraph
            body: >-
              公开规模证据支持一个大且增长中的品类，但无法支撑单一精确的 Fireblocks TAM。The Business Research Company 估计，数字资产托管规模 2026 年为
              $834.29B，2030 年为 $1.594T；而机构托管和加密资产管理报告采用小得多的收入或服务支出口径。有用结论不是市场恰好等于某个数字，而是 Fireblocks
              参与了几个重叠资金池。宽口径托管估计体现资产基础和战略相关性，机构托管估计近似合格托管和钱包基础设施的收入池，代币化报告则指向长期邻近市场，但只有发行方、分销和二级流动性准备好后才会变现。因此，Fireblocks
              的可服务市场应被表述为受证据约束的 SAM，而不是泛泛的万亿美元 TAM。
