      - number: '7.3'
        title: 技术、安全、宕机与合同风险
        blocks:
          - type: paragraph
            body: >-
              公开安全证据实质上偏正面，但对承保而言仍不完整。Fireblocks 披露 SOC 2 Type II、ISO 27001、C4
              CCSS、渗透测试、隐私内建指引，以及一份映射客户义务和责任分配的主服务协议。这些是真实缓释因素；它们也定义了尽调路径，而不是关上档案。运行日前后的状态记录显示，访问时没有大范围宕机，但也列出多次间歇性交易、余额和控制台延迟事故。在托管平台里，小延迟也重要，因为市场承压时，响应窗口会被压缩。StakeHound
              与 Celsius 的争议叙事，使密钥管理流程证据比单靠认证更重要。干净的承保档案需要当前 SOC
              报告、灾难恢复测试结果、保险条款、事故复盘，并确认客户备份义务已经真正运营化。技术下行还包括云集中、enclave 连续性和长期加密迁移。公开证据现在把 Fireblocks 同 AWS 分发和 SGX
              式硬件防御联系起来；同时，NIST 推进后量子也提醒市场，今天的签名假设不会永远成立。
