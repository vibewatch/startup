  - id: TV005
    title: 投资逻辑破裂触发器
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 当前收入桥接不及预期
        - 2026 年年化收入未显著高于 FY2024 公开的 $124M
        - 规模叙事将不再足以支撑相对当前公开可比对象的溢价
        - 将估值重置到悲观情景水平，并停止把 $8B 锚作为承销参考
      - - 优先股堆叠对投资者不友好
        - 管理层披露参与型优先股、重型反稀释条款，或会让老股价格误导判断的股数
        - 头部投后估值会高估普通股价值
        - 按普通股经济性重切交易，或直接退出
      - - 定价压力侵蚀客户质量
        - 企业队列出现流失、折扣或支持负担，削弱净扩张
        - 投资逻辑从黏性基础设施转向昂贵但更易被竞争的软件
        - 下调置信度，并在推进前要求证明留存韧性
      - - 退出准备仍然缺位
        - 尽管加密股权窗口更开放，却没有出现审计准备、投行工作流或战略进程证据
        - 回报承销仍依赖另一轮私募，而不是有纪律的流动性选项
        - 让 Fireblocks 维持观察状态，而不是推进到批准
      - - 新的运营或监管冲击打击信任
        - 重大安全、诉讼或特许相关事件损害公司在机构客户中的可信度
        - 可信基础设施的溢价会在信任受损时迅速坍塌
        - 在独立整改得到证明前，将投资逻辑视为破裂
    notes: 这些触发器刻意保持具体。它们是当前已经偏高的估值案例最快失效的路径。
    claimRefs:
      - CV018
      - CV019
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调信息请求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前 ARR / 收入桥接
        - 从 FY2024 到 2026 年最新期间的月度或季度收入运行率，并附分部明细
        - 如果没有当前分母，公开估值筛选就过于陈旧，无法支撑信念
        - 向 CFO / FP&A 索取财务包和董事会材料
      - - 毛利率和烧钱速度
        - 按托管、支付、代币化和钱包产品拆分的毛利率瀑布，以及现金消耗和现金跑道
        - 估值取决于收入质量，而不只是收入规模
        - 索取管理账和当前现金流视图
      - - 股权结构表和股数
        - 完全摊薄股数、股份类别、清算优先权和任何附函保护
        - 没有分母和优先股堆叠，老股每股价格页面几乎没有用
        - 索取法律摘要、股权结构表导出和章程文件
      - - 客户质量
        - Top-20 客户集中度、NRR、客户流失和按分部拆分的队列扩张
        - 如果收入分散且队列健康扩张，2,400 个客户这个数字才更有含金量
        - 索取销售运营 / 收入运营队列表
      - - 分部变现
        - 托管、支付、稳定币工作流、代币化和嵌入式钱包产品的收入组合
        - 如果较新的工作流产品已经变现，而不只是拓宽叙事，高溢价倍数的论点才最强
        - 在相关处索取产品 P&L 桥接和 GMV / 抽佣率数据
      - - 退出准备
        - 审计师状态、投行参与、董事会对 IPO 与战略路径的讨论，以及上市公司控制路线图
        - BitGo 和 Circle 显示窗口可能打开，但 Fireblocks 仍必须证明自己准备好使用窗口
        - 索取 CEO / 董事会材料和投资者关系路线图
    notes: 每项请求都绑定一个决策变量，可能显著改变公允价值或投资结构。
    claimRefs:
      - CV008
      - CV009
      - CV042
      - CV043
      - CV044
      - CV047
