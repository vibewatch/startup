  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险姿态
        blocks:
          - type: paragraph
            body: >-
              Fireblocks 的风险画像不是一张通用 SaaS 清单，而是一套托管基础设施风险堆栈：法律信任、运营密钥控制、监管信心、客户对手方健康和估值纪律相互作用。最高的剩余风险是监管 /
              法律、运营密钥管理，以及估值 / 流动性。NYDFS 身份、Fireblocks Trust 的合格托管叙事、SOC 认证和 SEC 沟通都是有意义的缓释因素，但不能消除 StakeHound、Celsius
              证据开示请求、SEC 对州信托托管的异议，以及公开货币化证明偏薄所暴露的下行。投资含义因此不是非黑即白，而是受风险闸门约束。Fireblocks
              可以是一个有战略重要性的赢家，但在把风险定价为可管理之前，仍需要对法律准备金、托管隔离、保险、事故历史和当前财务标记做硬尽调。
