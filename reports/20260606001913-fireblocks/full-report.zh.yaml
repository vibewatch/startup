  - id: TP004
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁或反向证据
      - 严重度
      - 证据支持的含义
      - 尽调追问
    rows:
      - - 跨托管、支付、合规和运营的工作流广度
        - 获特许或银行支持的对手可以消解信任异议，并随时间补齐更多工作流栈
        - 高
        - Fireblocks 覆盖面广，但 Anchorage、Coinbase、Fidelity、BNY 和银行进入者的监管外壳更强
        - 要求按牌照敏感型买家和银行切分的近期输赢单数据
      - - 靠策略引擎、API 和互联工作流形成运营锁定
        - 多托管人策略和自托管选项意味着工作流摩擦不等于垄断控制
        - 高
        - Zodia 预期多托管人会成为常态，Safe 提供无 AUM 费用的可迁移自托管
        - 衡量已有多少客户同时使用 Fireblocks 与另一托管人或自托管栈
      - - 以合规和控制作为差异化层
        - Zodia 认为实时对账、储备证明和嵌入式合规正在成为基本预期
        - 高
        - 合规内建正滑向准入门槛，而不是独特溢价层
        - 测试当每个入围者都提供基础合规、报告和审计证据时，Fireblocks 是否仍能胜出
      - - 相对银行的加密原生领先
        - BNY、Citi 和 State Street 显示，大型机构愿意自建或推出自己的数字资产基础设施
        - 高
        - 银行进入者可以用既有分发、信任和资本市场关系压缩独立供应商份额
        - 量化管线中有多少银行、券商和其他受监管机构正在考虑内部自建
      - - 相对同业的信任姿态
        - OCC 2022 年针对 Anchorage 的同意令证明，受监管外壳仍可能在运营上失足
        - 中
        - 信任不是二元变量；加密原生平台和持牌平台都必须持续证明控制与监管质量
        - 用银行级尽调清单审视 Fireblocks 自身控制证据，而不是营销标签
      - - 定价权
        - Coinbase、Gemini 和 Safe 提供的公开价格锚点比大多数加密原生平台更清楚
        - 中
        - 企业定价不透明，买家压价时会带来基准风险
        - 要求提供当前报价区间、实际折扣和按客群切分的续约涨价幅度
    notes: 严重度是承销判断。高表示该威胁即使不要求 Fireblocks 运营失败，也可能压窄其差异化；中表示威胁重要，但仍取决于买家类型和执行。
