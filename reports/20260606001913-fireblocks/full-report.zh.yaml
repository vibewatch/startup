  - id: FP001
    title: 竞争定位图
    type: quadrant
    layout: wide
    summary: 序位 1-10 分：x 轴衡量监管包装成熟度，y 轴衡量工作流广度和自动化水平。
    approximationNotes: 分数是有证据支撑的分析定位，不是供应商披露的指数。x 值越高，说明托管包装越接近持牌或强监管标准；y 值越高， 说明托管、交易、支付、合规、代币化或自动化等工作流打包得更广。
    data:
      xAxis: 监管包装成熟度（1=自托管或无明确包装，10=银行或信托银行标准）
      yAxis: 工作流广度和自动化（1=仅窄口径存储，10=宽口径多工作流操作系统）
      points:
        - label: Fireblocks
          x: 7
          'y': 10
          detail: 公开可见的加密原生工作流栈最宽，但抓取到的页面没有显示公开银行牌照包装。
        - label: BitGo
          x: 9
          'y': 8
          detail: 合格托管和保险，加上较宽的基础设施菜单。
        - label: Anchorage
          x: 10
          'y': 8
          detail: 联邦特许 crypto 银行，覆盖托管、交易、结算和质押。
        - label: Copper
          x: 6
          'y': 8
          detail: 围绕 ClearLoop，交易和场外结算导向很强。
        - label: Ledger Enterprise
          x: 7
          'y': 8
          detail: 硬件扎根的平台，横跨代币化、交易和本地部署控制。
        - label: Hex Trust
          x: 7
          'y': 7
          detail: 受监管托管，披露了质押、支付和机构规模。
        - label: Zodia Custody
          x: 9
          'y': 8
          detail: 银行背书的托管方，并为机构提供白标基础设施。
        - label: Coinbase Prime
          x: 9
          'y': 9
          detail: 主经纪业务覆盖面宽，并有 NYDFS 信托结构和广泛合作伙伴分发。
        - label: Fidelity DA
          x: 10
          'y': 7
          detail: 银行级包装强，托管 / 交易一体化，但开发者驱动的广度较弱。
        - label: Kraken
          x: 7
          'y': 7
          detail: 交易所联动托管，整合流动性和融资。
        - label: Safe
          x: 2
          'y': 5
          detail: 自托管和资金工具很强，但没有托管式信托包装。
        - label: 银行内部自建
          x: 9
          'y': 6
