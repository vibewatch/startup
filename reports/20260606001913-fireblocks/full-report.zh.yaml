  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful retained public and private crypto-infrastructure references available in
        reviewed sources; rows mix public comps, private rounds, and the company-underwrite object because no single
        perfect listed Fireblocks analogue exists.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Fireblocks
        - $8.0B 最近一轮新股估值；每股约 $5.4-$6.2 的老股指示价；$124M FY2024 收入
        - 按 FY2024 收入约 64.5x；按 $156M ARR 工作假设约 51x
        - 直接承销对象，客户规模强于多数同业
        - 当前 ARR、股数和优先股堆叠仍未公开；老股页面仅具指示性
      - - Coinbase
        - $40.15B 市值；$6.56B TTM 收入；$7.18B FY2025 收入
        - ~5.6x FY2025 销售额；~6.1x TTM 销售额
        - 最大的公开加密平台，明确具备机构托管和合格托管人定位
        - 经纪 / 交易业务更广且有零售敞口，因此不如 Fireblocks 纯粹
      - - BitGo
        - 2026 年 1 月 IPO 定价 $18/share；2026 年 6 月 EV $957M；LTM 收入 $209M
        - 公开市场价格发现后，multiples.vc 显示为 4.6x EV/revenue
        - 保留来源集中最接近的托管与数字资产基础设施公开可比对象
        - IPO 后波动和不同资本结构会扭曲直接同口径比较
      - - Anchorage Digital
        - Tether 2026 年 2 月投资 $100M，对应 $4.2B 估值
        - 仅有私有估值；保留公开来源没有收入分母
        - 可作为受监管机构加密基础设施的特许溢价私有可比对象
        - 保留来源没有当前收入或利润率披露
      - - Circle
        - SEC 备案结果显示，2025 年 Q3 收入 $740M，净利润 $214M
        - 披露和盈利能力基准，而不是直接托管倍数
        - 展示公开投资者愿意承销的加密基础设施规模和报告质量
        - 稳定币经济模型与托管 SaaS 和支付基础设施变现差异很大
    notes: >-
      在可得时，每行至少由两个保留来源支持：Fireblocks 来自 Forbes 加老股交易平台；Coinbase 来自 CompaniesMarketCap 市值和收入页面；BitGo 来自 IPO 发布加
      multiples.vc；Anchorage 来自 Anchorage 和 Tether；Circle 来自其 SEC 备案结果及合作伙伴背景。
    claimRefs:
