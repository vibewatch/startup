        - 法律意见、控制强化、合作伙伴架构
        - 要求更低进入价格或等待
      - - 运营控制失效
        - 出现新的不可追回资产损失或严重生产事故
        - 客户信心受冲击
        - 竞争替代和诉讼长尾
        - 独立事故复盘并重建控制
        - 解决前视为投资逻辑破裂
      - - 银行自建加速
        - 大型银行扩大 Kinexys 等自有基础设施
        - 顶级账户中，中立平台份额收窄
        - 即使品类增长，利润率也会被压缩
        - 靠多网络互操作性和生态覆盖做差异化
        - 模型下调上行空间和份额增速
      - - 收购带来执行拖累
        - Dynamic / TRES 整合延迟，或支持负担上升
        - 运营复杂度上升，路线图延后
        - 产品聚焦下降，成本基数上升
        - 整合 PMO、平台理顺、客户沟通
        - 在估值工作中提高执行折扣
    notes: 这些情景是绑定可监测事件的定性压力案例，而不是概率 VaR 模型。
    claimRefs:
      - CR037
      - CR045
      - CR046
      - CR047
      - CR048
      - CR057
      - CR058
  - id: TV001
    title: 投资建议摘要
    columns:
      - 维度
      - 评估
      - 证据依据
    rows:
      - - 推荐意见
        - 继续研究
        - 公开证据证明 Fireblocks 有规模和战略相关性，但还不足以为不变的 $8B 锚定估值提供当前变现支撑。
      - - 置信度
        - 中
        - 2022 年融资、2024 年收入数据和当前老股页面都是真实证据；当前 ARR、利润率和优先权仍未公开。
      - - 风险评级
        - 高
        - 过时的定价锚、历史运营诉讼和显著的倍数压缩风险都仍然存在。
      - - 估值立场
        - 偏高
        - 2022 年估值按 $156M ARR 工作假设约为 51x，按最后一次公开收入数据约为 64.5x。
      - - 决策含义
        - 仅在审阅管理层数据室后推进
        - 当前 ARR / 收入、毛利率、烧钱速度、股数和清算优先权都可能显著改变公允价值。
    notes: 该摘要刻意对价格敏感。它不质疑 Fireblocks 的战略相关性；它质疑当前公开证据能否支撑不变的 2022 年估值。
    claimRefs:
      - CV020
      - CV021
      - CV023
      - CV041
      - CV042
      - CV047
  - id: TV002
    title: 投资逻辑 vs. 反向逻辑
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 投资逻辑：Fireblocks 拥有真实机构规模
        - 公开来源显示，客户数从 2021 年 150 家增至 2022 年 1 月 800 家，2022 年部署数达 1,500 个，当前客户页面列出 2,400 家组织。
        - 如果管理层证明规模也转化为强劲的当前收入留存，而不只是签下大量客户，则上调判断。
      - - 投资逻辑：产品宽度支撑溢价
        - SEC 和合作伙伴材料把 Fireblocks 定位为覆盖托管、支付和稳定币工作流的 SaaS 基础设施，而不只是冷存储。
        - 如果分部收入显示支付和网络产品正成为有意义的变现引擎，则上调判断。
      - - 投资逻辑：机构背书异常强
        - SEC 备忘录列举 BNY Mellon、BNP Paribas 等成熟机构，Fifth Third 在稳定币支付扩张中点名 Fireblocks。
        - 如果客户集中度低且企业队列在扩张，而不只是续约，则上调判断。
      - - 反向逻辑：公开变现证据偏薄
        - 当前保留下来的最佳财务数据是 2024 年收入 $124M 且未盈利；当前 ARR 和利润率仍未披露。
        - 如果管理层提供当前收入桥接和毛利率瀑布，该担忧会大幅下降。
      - - 反向逻辑：同业倍数压缩严重
        - Coinbase 筛选约为 5.6x-6.1x 销售额，BitGo 约为 4.6x EV/revenue，远低于 Fireblocks 过时的 2022 年隐含倍数。
        - 只有 Fireblocks 证明收入规模远高于公开分母，或公开市场稀缺性溢价回归，该担忧才会缓和。
      - - 反向逻辑：历史风险和评论驱动风险并非为零
        - StakeHound 诉讼和企业定价投诉显示，运营风险和可负担性风险并非想象。
        - 如果尽调确认客户满意度强、流失率低且没有反复出现的运营控制问题，该担忧会缓和。
    notes: 该表把公司质量和价格纪律分开。Fireblocks 可以是强公司，但按当前公开证据，估值仍可能过度拉伸。
    claimRefs:
