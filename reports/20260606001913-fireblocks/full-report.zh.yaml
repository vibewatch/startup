      - number: '8.5'
        title: 退出准备度与 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              外部证据现在足以说明，加密基础设施退出窗口原则上已经打开。BitGo 于 2026 年 1 月完成 IPO，Circle 向 SEC
              提交的业绩也显示，只要发行人能用常规报告纪律披露规模、毛利结构和盈利能力，公开投资者会支持加密基础设施公司。但从公开证据看，Fireblocks 还没到这一步。已审阅的 Fireblocks SEC 痕迹显示的是
              Form D 和相关豁免发行历史，而不是任何 S-1 或持续公开报告足迹。Nasdaq Private Market 和 Hiive 显示有老股流动性，但这些页面更接近私有股份发现，而不是 IPO
              准备。这个区别很关键。等 Fireblocks 想上市时，公开市场也许可用，但市场不太可能奖励一家仍不披露当前 ARR、毛利率、烧钱速度和优先权结构的公司。务实的 IPO
              路径判断因此是有条件的：退出路线可行，尤其是如果稳定币支付继续扩张；但在投资者把它作为当前价值核心部分承保之前，公司需要大幅升级披露。
            claimRefs:
              - CV008
              - CV009
              - CV034
              - CV035
              - CV042
              - CV043
