        title: 架构与策略控制
        blocks:
          - type: paragraph
            body: >-
              可防守的技术主张是，Fireblocks 叠加了 MPC-CMP 密钥管理、飞地或硬件隔离执行、策略执行、认证转账工作流和开发者
              API。官方安全文案和独立技术摘要在核心模型上相互一致：私钥不应在单一地点组装，交易授权由规则治理，Fireblocks Network
              让转账具备交易对手感知，从而降低地址替换风险。对于不能只依赖冷存储的活跃机构，这是一个强架构叙事。但这不是完整安全证明。本章可用材料不包括密码学审计报告、完整 SOC 报告文本、客户侧 co-signer
              配置、密钥份额备份程序或灾难恢复测试证据，因此 Policy Engine 和 MPC 主张仍是确认性尽调的验证优先项。相比纯 HSM 或冷钱包设计，Fireblocks
              明确在优化活跃、由策略治理的运营；这解释了为什么 MPC-CMP、安全飞地和 API 编排位于架构中心。同一设计也带来对云、飞地和工作流治理层的依赖，而纯离线金库模型不存在这些依赖。
