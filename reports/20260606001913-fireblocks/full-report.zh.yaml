companyProfile:
  summary: |
    Fireblocks 是一家总部位于纽约的数字资产基础设施公司，2018 年由三位 Check Point Software
    网络安全背景的创始人创立：Michael Shaulov（CEO）、Pavel Berengoltz（CTO）和 Idan Ofrat
    （CPO）。他们曾调查 2017 年 Lazarus Group 交易所黑客事件，并看到市场缺少机构级托管。公司已通过六轮股权融资募得
    $1.04B，最近一轮为 2022 年 1 月由 D1 Capital Partners 和 Spark Capital 共同领投的 $550M
    Series E，估值 $8B。Fireblocks 服务 2,400+ 家机构，包括 BNY Mellon、BNP Paribas、Revolut
    和 Worldpay。核心技术把多方计算（MPC）钱包与申请中专利的 Intel SGX 芯片隔离结合起来，保护私钥。平台覆盖四个板块：
    钱包与托管、支付（100+ 个国家）、运营（策略引擎、DeFi、AI）和金融应用（代币化、质押、合规）。第三方估计 FY2024
    收入约为 $124M。官方审计财务数据、毛利率、NRR 和股权结构表条款均未公开。
