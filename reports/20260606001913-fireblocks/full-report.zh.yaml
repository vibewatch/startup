    type: flow
    layout: standard
    summary: Fireblocks 在客户价值链的三个节点收费：平台访问、交易量、托管资产，由此叠出经常性收入和可变收入。
    data:
      nodes:
        - id: n1
          label: 客户上线（年度合同）
          type: input
        - id: n2
          label: 年度订阅 / 平台费
          type: process
          note: 经常性；基础层
        - id: n3
          label: 交易在链上执行
          type: process
        - id: n4
          label: 交易量超额费（$1M 以上 0.20%）
          type: process
          note: 可变；随活动扩张
        - id: n5
          label: 资产通过 KeyLink 或 Trust Co. 托管
          type: process
        - id: n6
          label: AUC 费（3–30 bps）或托管服务费
          type: process
          note: 经常性；与 AUM 挂钩
        - id: n7
          label: Fireblocks 确认总收入
          type: output
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n7
        - from: n3
          to: n4
        - from: n4
          to: n7
        - from: n5
          to: n6
        - from: n6
          to: n7
