      - number: '7.5'
        title: 治理、估值、流动性与否决条件
        blocks:
          - type: paragraph
            body: >-
              治理风险中等，不致命。Fireblocks 展示出较宽的高管梯队，但公司仍由创始人领导，法律 / 监管叙事仍把高级创始人或高管列为相关知情人。更尖锐的投资者风险是估值和流动性。Forbes 所称 2024 年
              $124 million 收入且未盈利、历史 $8 billion
              标记，以及没有公开股价发现的私募老股交易迹象，都让下行重定价变得合理，即使产品战略奏效。风险登记表因此需要明确否决条件。打破投资逻辑的触发器包括：丧失合格托管身份、监管者对托管控制采取行动、新的
              Fireblocks 造成的密钥丢失事件、影响资产访问且未解决的生产宕机、未披露的法律准备金暴露，或二级市场证据实质性背离上一轮估值。若没有这些事件，正确的缓释方式不是自满，而是在定价剩余风险之前做数据室验证。
