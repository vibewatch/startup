  - id: TM008
    title: 竞争动态与自建 / 购买压力
    columns:
      - 选项
      - 买方选择原因
      - 优势
      - 相比 Fireblocks 的局限
      - 市场含义
    rows:
      - - Fireblocks 式平台
        - 用一个控制平面覆盖托管、支付、代币化和策略
        - 工作流宽度和上线后的切换成本
        - 需要证明宽度能高效变现
        - 若附加率真实，支撑溢价叙事
      - - 点状托管 / 钱包供应商
        - 部署更窄，有时复杂度更低
        - 聚焦部分用例的控制
        - 对支付、代币化和财资的覆盖较窄
        - 在单一任务采购中可能压低定价
      - - 银行内部自建
        - 将基础设施留在受监管机构内部
        - 监管舒适度更高，对数据和流程控制更紧
        - 建设周期更长，生态连接更弱
        - 验证品类，但压缩外部供应商份额
      - - 既有支付网络
        - 借助既有商户和银行关系
        - 分销和结算专长
        - 未必提供中立的多资产控制层
        - 稳定币增长会吸引资本充足的相邻玩家
      - - 交易所原生或综合账户钱包
        - 面向交易公司的最快路径
        - 即时流动性接入
        - 破产隔离和治理叙事最弱
        - 买方迁离这一现状时，Fireblocks 受益
    notes: 本表比较运营选择，不只比较具名公开竞争对手；重点是市场权力会在哪里转移。
    claimRefs:
      - CM004
      - CM021
      - CM026
      - CM027
      - CM044
  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 路径
      - 类别
      - 规模 / 监管信号
      - 目标客群
      - 差异化
      - 与 Fireblocks 比较时的关键局限
    rows:
      - - Fireblocks
        - 标的 / 加密原生基础设施
        - 服务 2,400 家企业；$10T 交易；保护 550M 个钱包
        - 银行、金融科技公司、交易所、交易公司、金融机构
        - 公开信息中最宽的工作流栈，覆盖钱包、支付、合规、代币化和运营
        - 抓取页面未见公开标价，也未见公开银行牌照壳层
      - - BitGo
        - 直接同业 / 合格托管机构
        - OCC 特许 BitGo Bank & Trust；$250M 保险；2013 年以来运营
        - 需要合格托管、钱包、结算和主经纪服务的机构
        - 合格托管、冷存储、保险和宽基础设施菜单
        - 公开定价仍由销售主导，而非直接发布
      - - Anchorage Digital
        - 直接同业 / 联邦特许银行
        - 美国首家联邦特许加密银行；合格托管机构
        - 优先看重监管包装、托管、质押和结算的机构
        - 银行牌照和信托背书
        - 2022 年 OCC 同意令显示，受监管身份并不能消除运营风险
      - - Copper
        - 直接同业 / 交易主导的托管基础设施
        - 仅面向机构定位；ClearLoop MPC 托管和场外结算
        - 对冲基金、交易公司、交易所、ETP 提供商、矿工
        - ClearLoop 场外结算和交易所连接
        - 公开定价不透明，信任背书不如持银行牌照的对手明确
      - - Ledger Enterprise
        - 直接同业 / 硬件根信任平台
        - 100+ 家机构；保护全球加密资产的 20%、全球稳定币价值的 30%
        - 需要硬件强制控制、代币化和交易所外交易的机构
        - 硬件强制安全，加上代币化和本地部署
        - 公开托管定价披露和银行外壳定位都不如信托公司型对手明确
      - - Hex Trust
        - 直接同业 / 机构托管与质押
        - $5bn AUC；450+ 家客户；月交易量 $500m+；最高 $50M+ 保险
        - 机构投资者、银行和区块链基金会
        - 受监管托管，加上质押、支付和机构财富业务延伸
        - 从已披露规模广度看，公开业务规模小于 Coinbase、Fidelity 或 Fireblocks
      - - Zodia Custody
        - 直接同业 / 银行支持的托管机构
        - 由 Standard Chartered、SBI、Northern Trust 和 NAB 支持；75+ 种资产；15+ 个司法辖区
        - 金融机构、资产管理机构、企业和政府
        - 银行背书的信任姿态，以及面向机构的白标基础设施
        - 公开定价不透明，产品广度比 Fireblocks 的通用工作流栈更偏机构定制
      - - Coinbase Prime / Custody
        - 相邻既有玩家 / 主经纪业务加托管
        - 托管全球加密资产市值的 12%；275+ 种可交易资产；240+ 家银行和券商合作伙伴
        - 希望用一个平台覆盖托管、执行、融资和质押的机构
        - 覆盖面强，公开价格披露和伙伴分发也少见
        - 比纯钱包运营栈更偏交易所和市场结构
      - - Gemini Custody
        - 相邻受监管托管机构
        - 纽约合格托管人；$100M 冷存储保险；无固定最低余额；每项资产月最低 $30
        - 优先看重受监管冷存储和从冷存储直接交易的机构
        - 隔离、可验证托管，并公开最低费用
        - 工作流广度窄于 Fireblocks、Coinbase 或 BitGo
      - - Fidelity Digital Assets
        - 既有银行级托管机构
        - 2025 年获 OCC 全国信托银行牌照；年度 SOC 1/SOC 2 审计；75+ 年金融行业积累
        - RIA、家族办公室、企业财资、对冲基金、银行和券商
        - 传统金融品牌、集成托管 / 交易和银行信托外壳
        - 产品菜单偏机构，开发者取向弱于 Fireblocks
      - - Kraken Custody
        - 相邻交易所关联替代方案
        - 运营 14+ 年；99.9% 正常运行时间；平台支持 550+ 种资产；托管支持 200+ 种
        - 希望托管与交易、融资、质押集成的机构
        - 交易所关联流动性，以及从托管账户直接交易的工作流
        - 公开监管姿态弱于联邦特许或银行支持竞品
      - - Safe / 自托管多签
        - 现状替代 / 自托管
        - 处理 $1T+；部署 57M+ 个钱包；保护 $60B+；0 AUM 费用
        - 链上财资、DAO 和技术能力强的组织
        - 开源、可迁移、无供应商锁定的多签和财资控制
        - 没有托管式合格托管人外壳，也没有外包运营支持
      - - 银行内部自建 / G-SIB 进入路径
        - 潜在进入者 / 自建替代
        - BNY 称其是首家提供受监管数字资产托管的 G-SIB；Citi 推出 CIDAP 托管和代币化；State Street 计划 2026 年进入
        - 希望嵌入数字资产基础设施的银行、券商和大型机构
        - 分发能力、监管信任，以及把托管嵌入更广泛银行业务栈的能力
        - 交付周期更长，内部项目复杂度高于直接采购 Fireblocks
    notes: 本表覆盖 Fireblocks 机构托管和钱包基础设施任务中明确评估的全部重要替代方案：直接加密原生同业、受监管既有玩家、自托管替代方案，以及银行主导的进入路径。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive for the material alternatives explicitly assessed in this chapter for institutional digital asset
        custody, wallet infrastructure, self-custody substitutes, and bank-led entrant paths named in the brief.
