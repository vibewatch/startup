            body: >-
              承销 Fireblocks 时，应把它看成宽口径数字资产操作系统，而不是单点托管钱包。公开产品证据显示，客户工作流从钱包创建和资产隔离开始，经过策略控制审批和 MPC
              签名，再延伸到结算、代币化、DeFi、质押、合规挂钩、webhook 和报告。最强证据是广度：Fireblocks 描述了财资、Wallets-as-a-Service、Embedded
              Wallets、Network、代币化、DeFi 和开发者界面，而状态页暴露了许多客户依赖的线上组件。限制同样重要。公开记录验证了产品类别和控制概念，但未披露客户特定 SLA 条款、API
              速率限制、吞吐量、恢复目标或实施失败率。因此，尽调应把 Fireblocks 视为成熟基础设施，同时要求补充私有的运营边界证据。这仍然重要。
