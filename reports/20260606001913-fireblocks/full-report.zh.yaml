        - 美国
        - OCC 确认银行可提供加密资产托管服务
        - 使银行参与数字资产托管工作流更具合法性
        - 未消除后续 SEC / 投顾资产保护争议
      - - '2023-07-13'
        - 全球
        - FSB 最终稳定币监督建议
        - 提高稳定币支付基础设施的治理和监督预期
