      - number: '3.2'
        title: 能力宽度、定价披露与信任姿态
        blocks:
          - type: paragraph
            body: >-
              能力重叠度很高，但重心仍不同。Fireblocks 把合规工具、策略驱动控制、API、场外交易运营和面向稳定币的支付打包进一个平台。BitGo、Anchorage、Coinbase、Kraken 和
              Fidelity 都让机构不只是存储资产：它们把托管连接到交易、质押、融资或结算。Copper 的关键差异化是 ClearLoop，让机构在集中化场所交易时仍把资产留在 MPC 托管中。Ledger
              Enterprise 更扎根硬件，并明确扩展到代币化、多签和本地部署。Zodia Solutions 的独特之处不在于每个工作流都比 Fireblocks
              更便宜或更宽，而在于它被设计成银行级白标基础设施，机构可以把它部署在自身治理和数据主权边界之内。


              但定价透明度并不均衡。Fireblocks、BitGo、Anchorage、Copper、Ledger Enterprise 和 Zodia 在抓取到的官方页面上都采用销售主导打法。Coinbase
              Custody 是最清晰的例外：它公布实施费区间、50 bps 年化托管费和 $500,000 最低余额。Gemini 在百分比定价上不那么明确，但仍披露没有固定最低余额，账户每项资产每月最低收费
              $30。Safe 是自托管侧的异类，明确营销 0 AUM 费用和可迁移账户。战略含义是，Fireblocks
              以强广度参与竞争，但在价格敏感或采购流程重的评估中，公开定价不透明仍会输给少数能给买方更清晰基准的替代方案。
