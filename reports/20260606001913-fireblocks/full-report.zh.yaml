      - number: '2.3'
        title: 买方、用户与付款方地图
        blocks:
          - type: paragraph
            body: >-
              经济买方随细分市场变化。在银行，付款方通常来自数字资产、交易银行、证券服务或创新预算，但安全、合规、风险、财资和运营都是强否决方，因为钱包架构决定审批流程、审计证据、密钥恢复和监管姿态。在金融科技公司、交易所和交易公司，产品和工程团队追求速度、资产覆盖和嵌入式钱包能力，运营和合规则要求控制能力能扛住真实交易或支付量。支付公司和汇款服务商购买稳定币流动性、财资自动化、跨境结算和合规；代币化发行方购买智能合约部署、资产服务、托管和分销连接。这张地图意味着销售周期长，但一旦技术栈进入生产，切换成本很高。
