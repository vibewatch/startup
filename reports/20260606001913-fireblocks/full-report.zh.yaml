      - number: '1.4'
        title: 规模、牵引力与运营指标
        blocks:
          - type: paragraph
            body: >-
              Fireblocks 公开称，100+ 个国家的 2,400 多家机构信任其平台，锚定客户包括 BNY Mellon、Worldpay、Revolut、Galaxy 和 BNP Paribas（在公司 2025
              年 2 月 SEC 沟通信中得到直接确认）。截至 2026 年 5 月，LinkedIn 显示员工约 965 人；Tracxn 独立估计 966 人；Revelio Labs 估计 2025 年底员工数为
              1,150 人，反映 2025 年约 25% 同比增长。来源差异可能来自报告日期不同和承包商统计口径不同；没有尽调确认前，任何员工数都不应视为已验证。平台已在 120 多条区块链上保护超过 $10T
              的累计数字资产交易，处理约 15% 的全球稳定币交易量（Coinlaw，2025 数据），每月处理 $200B 或更多稳定币支付。Fireblocks Trust Company 是 NYDFS
              特许的合格托管方，服务 Bakkt、Galaxy 和 FalconX 等机构客户。平台持有 SOC 2 Type 2、ISO 27001/27017/27018 和 CCSS Level 3 认证，NIST
              CSF 2.0 成熟度得分 4.4，高于行业基准 3.5。G2 客户评论基于 550 多条评论给出 4.8 评分。收入信息未公开；第三方聚合方引用约 $193M 年收入，但估计依据不明。
