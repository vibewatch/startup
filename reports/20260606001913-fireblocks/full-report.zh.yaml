  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与实质性替代方案
        blocks:
          - type: paragraph
            body: >-
              Fireblocks
              不是只在和一家托管供应商竞争。相关集合横跨加密原生基础设施同业、持牌或受监管的信托式托管方、交易所绑定技术栈、自托管替代品，以及内部建设数字资产基础设施的大型银行。从其公开页面看，Fireblocks
              在这一集合中展示出最宽的加密原生工作流栈：面向银行、金融科技公司、交易公司和其他金融机构的钱包、支付、代币化、场外交易运营、质押、合规和网络连接。官网也披露了有意义的规模标记——2,400 家企业、$10T
              交易额和 550M 个受保护钱包——规模足以让 Fireblocks 成为真正的品类参照点，而不是小众工具供应商。


              但竞争对手各自锚定不同切入口。BitGo 强调合格托管、100% 冷存储和保险。Anchorage 以联邦特许加密银行外壳为中心。Coinbase Prime 把托管与融资、执行和异常明确的银行 /
              券商分销叙事结合起来。Fidelity 带来 OCC 特许信托银行和传统金融可信度。Zodia 和 BNY 明确把银行级基础设施打包给需要受监管运营模型的机构，而 Citi 正在自有 CIDAP
              栈内建设代币化和托管轨道。另一端，Safe 为链上财资提供透明的自托管替代方案。因此，最适合把 Fireblocks
              理解为一个市场中的工作流广度领导者；在这个市场里，信任背书、分销能力和自建还是购买的路径正变得越来越多元。
