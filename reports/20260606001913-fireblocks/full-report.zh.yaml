      - number: '4.3'
        title: 资本结构、融资历史与 M&A 支出
        blocks:
          - type: paragraph
            body: >
              Fireblocks 已通过五轮公开披露融资募得约 $1B 风险资本：Series A（$16M，Cyberstarts/Tenaya/Eight Roads/Swisscom，2019）、Series
              B（$30M）、Series C（约 $133M，估值 $1B）、Series D（$310M）和 Series E（$550M，估值 $8B，由 D1 Capital Partners 领投，2022 年 1
              月）。自 2022 年以来，$8B 估值未被公开来源刷新；Leyden Opportunities Fund 2023 年 5 月为名为「Fireblocks Feb 23」的系列提交 Form
              D，确认有老股市场活动，暗示投资者兴趣仍在，但没有新的新股融资轮。截至 2026 年 6 月，公司未宣布 IPO 申请或明确流动性路径。

              公司通过收购加快资本部署。2026 年 1 月以 $130M 收购 TRES Finance，补齐加密会计和对账能力。2025 年底收购
              Dynamic，金额未披露，获得面向消费者的嵌入式钱包技术。两笔收购合计至少代表近期 $130M+ 资本部署，很可能来自 $1B
              弹药。公开资料未披露信贷额度、项目融资安排或债务结构。现金跑道和账上现金仍属私密。Trust Company 牌照使公司承担 NYDFS 类银行监管下的资本充足要求，形成一项独立于运营烧钱的持续监管资本义务。
