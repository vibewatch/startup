  rows:
  - - Treasury management
    - Corporate treasury, trading desks, exchanges
    - Current product page; hot/warm/cold MPC-CMP wallet configurations and automation claims
    - MPC-CMP custody plus policy controls and ecosystem connectivity
    - Request SLA, throughput, co-signer, and recovery evidence for target use case
  - - Wallets-as-a-Service
    - Exchanges, payment platforms, institutional services
    - Current product page; high-volume wallet creation and client fund segregation claims
    - Segregated wallet structures with policy-based controls
    - Verify custody model, account segregation, and liability allocation
  - - Embedded Wallets
    - Fintechs and consumer apps
    - Current product page; Dynamic-powered non-custodial wallet experiences
    - Seedless UX, social authentication, gas sponsorship, batch transactions
    - Verify SDK maturity, chain coverage by wallet type, and end-user recovery model
  - - Fireblocks Network
    - Banks, PSPs, liquidity providers, exchanges
    - Current product page; 40+ providers, 60+ currencies, 100+ countries claimed
    - Verified-counterparty workflow and one-API network access
    - Confirm counterparty coverage in customer geographies and sanctions/Travel Rule workflow
  - - Tokenization
    - Banks, asset managers, issuers
    - Current product page; pre-built contracts and 35+ blockchain claim
    - Token lifecycle management with smart-contract templates and audit-ready reports
    - Review contract audits, issuer controls, and upgrade governance
  - - DeFi access
    - Funds, trading desks, Web3 operators
    - Current product page; dApps across 100+ blockchains claimed
    - MPC custody plus dApp protection, transaction simulation, and policy gating
    - Validate allowed dApps, simulation coverage, and emergency revoke/freeze procedures
  notes: Rows are product-line evidence from public product pages; maturity is public-claim maturity, not verified production depth.
