  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-limits
    missingEvidence: Customer-specific API rate limits, throughput, SLA, RTO/RPO, queue behavior, and support tier terms.
    whyItMatters: Fireblocks can become mission-critical transaction infrastructure, so undocumented limits can create operational or liquidity risk.
    diligencePath: Request customer contract exhibits, SLA documents, rate-limit schedules, architecture diagrams, and incident postmortems under NDA.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE002
    - TE005
  - type: private-evidence-only
    severity: material
    topic: security-audits
    missingEvidence: Current SOC report text, ISO certificates with scope, CCSS certificate, penetration-test summaries, NCC audit report, and cryptographic audit artifacts.
    whyItMatters: Public assurance labels do not prove scope, exception profile, or applicability to the exact products underwritten.
    diligencePath: Obtain Trust Center documents and map each control report to custody, API, embedded-wallet, tokenization, and DeFi modules.
    relatedQuestionRefs:
    - QE013
    - QE014
    - QE026
    relatedTableRefs:
    - TE004
  - type: conflicting-data
    severity: material
    topic: key-loss-litigation
    missingEvidence: Current procedural status, pleadings, Fireblocks defenses, settlements, insurance coverage, and remediation evidence for StakeHound/Celsius-related allegations.
    whyItMatters: The allegations directly test backup, key-share lifecycle, and liability allocation for custody workflows.
    diligencePath: Review court records and counsel memos; require management representation on process changes since 2021.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: developer-adoption
    missingEvidence: Reliable public counts for active developers, SDK downloads over time, production integrations, GitHub release cadence, and support-ticket resolution quality.
    whyItMatters: Developer-surface presence is positive but not the same as broad adoption or low integration friction.
    diligencePath: Ask Fireblocks for developer KPIs and reference calls with engineering teams that integrated API, webhooks, and co-signers.
    relatedQuestionRefs:
    - QE020
