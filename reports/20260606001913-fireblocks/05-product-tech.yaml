company:
  name: Fireblocks
chapter:
  number: 5
  title: Product & Technology
  summary: Fireblocks offers a broad digital-asset infrastructure platform whose core is MPC custody, policy-controlled transaction governance, and API-enabled wallet operations, extended into Network settlement, tokenization, DeFi, and embedded wallets. Public evidence supports a mature developer and control-plane surface, but operating limits, customer-specific SLAs, full assurance reports, and key-backup/disaster-recovery evidence remain private diligence requirements.
sections:
- id: workflow-and-product-scope
  title: Workflow and product scope
  body: 'Fireblocks should be underwritten as a broad digital-asset operating system, not a point custody wallet. Public product evidence shows a customer workflow that starts with wallet creation and asset segregation, runs through policy-controlled approvals and MPC signing, and then extends into settlement, tokenization, DeFi, staking, compliance hooks, webhooks, and reporting. The strongest proof is breadth: Fireblocks describes treasury, Wallets-as-a-Service, Embedded Wallets, Network, tokenization, DeFi, and developer surfaces, while its status page exposes many live components that a customer depends on. The limitation is equally important. The public record verifies product categories and control concepts, but it does not disclose customer-specific SLA terms, API rate limits, throughput, recovery objectives, or implementation failure rates, so diligence should treat Fireblocks as mature infrastructure with private operating-limit evidence still required. This remains material.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE040
  tableRefs:
  - TE001
  figureRefs:
  - FE002
- id: architecture-and-policy-controls
  title: Architecture and policy controls
  body: 'The defensible technical claim is that Fireblocks layers MPC-CMP key management, enclave or hardware-isolated execution, policy enforcement, authenticated transfer workflows, and developer APIs. Official security copy and independent technical summaries align on the core model: private keys should not be assembled in one location, transaction authorization is governed through rules, and the Fireblocks Network reduces address-substitution risk by making transfers counterparty-aware. That is a strong architectural story for active institutions that cannot rely only on cold storage. It is not a complete security proof. The materials available for this chapter do not include cryptographic audit reports, full SOC report text, customer-side co-signer configurations, key-share backup procedures, or disaster-recovery test evidence, so the policy engine and MPC claims remain verification priorities in confirmatory diligence. Compared with pure HSM or cold-wallet designs, Fireblocks is explicitly
    optimizing for active, policy-governed operations, which helps explain why MPC-CMP, secure enclaves, and API orchestration sit at the center of the architecture. The same design creates dependence on cloud, enclave, and workflow-governance layers that do not exist in a purely offline vault model.'
  claimRefs:
  - CE019
  - CE020
  - CE031
