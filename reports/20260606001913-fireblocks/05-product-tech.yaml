- id: security-assurance-and-operating-limits
  title: Security assurance, incidents, and operating limits
  body: 'Fireblocks presents a strong assurance posture: official security materials cite defense-in-depth controls, 24/7 monitoring, independent auditors, SOC 2 Type 2, ISO certifications, CCSS, penetration testing, and NCC-audited cryptographic libraries, while the Trust Center lists specific security and privacy certifications. Reliability evidence is mixed but concrete. The official status surface monitors transaction engines, APIs, webhooks, co-signers, wallets, Web3, staking, and blockchain nodes, and third-party Statusfield listed Fireblocks as operational on the run date while showing recent chain, console, transaction, and webhook incidents. The most important adverse diligence thread is not a routine outage but the StakeHound key-loss litigation and the 2026 Celsius discovery dispute, both of which make backup, key-share custody, customer-side responsibilities, and disaster recovery central diligence asks.'
