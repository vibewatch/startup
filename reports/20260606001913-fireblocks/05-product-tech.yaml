- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Fireblocks solution
  - Measurable or stated benefit
  - Evidence-backed limitation
  rows:
  - - Move assets among exchanges and counterparties
    - Manual address copying, test transfers, and fragmented liquidity routes
    - Fireblocks Network verified counterparties and one-API ecosystem access
    - Company claims reduced settlement risk and access to thousands of tokens
    - Provider and counterparty coverage must be checked per market
  - - Issue and administer tokenized assets
    - Smart-contract deployment, mint/burn approvals, and reporting are fragmented
    - Tokenization platform with templates, contract operations, and audit-ready reporting
    - Company claims faster deployment across 35+ blockchains
    - No retained source includes contract audit reports or issuer-specific throughput
  - - Access DeFi from institutional custody
    - Browser wallets and unknown dApps create signing and approval risk
    - DeFi API, WalletConnect, browser extension, dApp Protection, transaction simulation
    - Company claims pre-sign visibility and real-time threat detection
    - Coverage of non-EVM apps and false-negative rates is not public
  - - Embed wallets into an app
    - Seed phrases, chain switching, gas, and recovery burden adoption
    - Dynamic-powered Embedded Wallets with social login and seedless backup
    - Company claims integration in minutes and launch in days
    - Implementation complexity and end-user recovery guarantees need testing
  - - Automate treasury operations
    - Manual approvals, sweeping, staking, and reconciliation slow operations
    - Automation, Policy Engine, APIs, webhooks, and console workflows
    - Official docs support API and webhook-driven integration
    - Rate limits, queueing behavior, and RTO/RPO are not disclosed
  notes: Benefits are stated by Fireblocks unless independently indicated; limitations convert missing operating evidence into diligence tasks.
