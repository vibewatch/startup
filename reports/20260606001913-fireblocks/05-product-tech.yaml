- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer or component
  - Role
  - Dependency
  - Risk or limitation
  rows:
  - - MPC-CMP key management
    - Avoid assembling private keys in one place and support active signing
    - Fireblocks cryptographic implementation, customer co-signer setup, and key-share backup design
    - Public sources do not disclose customer-specific share topology or recovery tests
  - - Secure enclaves / hardware isolation
    - Protect signing code, key shares, and policy logic from host compromise
    - Enclave/HSM configuration and third-party cryptographic audits
    - Marketing and secondary analysis cite SGX/enclaves, but audit artifacts are not public
  - - Policy Engine / TAP-style controls
    - Constrain who can move assets, where, when, and with which approvals
    - Accurate role model, limits, whitelists, and admin quorum governance
    - Incorrect rules can block operations or allow undesired transactions
  - - Fireblocks Network
    - Authenticate counterparties and streamline settlement/payment routing
    - Network membership, provider integrations, AML/KYC/Travel Rule configuration
    - Coverage and compliance workflow must match target geographies
  - - REST API, SDKs, webhooks
    - Embed Fireblocks in products and internal operations
    - API keys, SDK maintenance, webhook reliability, and support processes
    - Rate limits, SLA, and production error rates are not public
  - - Blockchain nodes and chain integrations
    - Provide asset, transaction, DeFi, and tokenization support
    - Node providers, chain-specific finality, chain upgrades, and monitoring
    - Recent incidents show chain-specific delays can affect operations
  - - Cloud infrastructure (AWS-linked distribution)
    - Support SaaS delivery, partner distribution, and scalable secure operations
    - AWS-validated architecture and AWS Marketplace presence
    - Cloud-provider outage, shared-responsibility, and concentration risk remain outside purely cryptographic controls
  notes: Architecture is reconstructed from official product/security/docs plus secondary technical analysis; missing implementation details are listed as risks.
