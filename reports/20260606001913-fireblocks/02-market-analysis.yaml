- id: TM005
  title: Contradictory estimates and limitations
  columns:
  - Issue
  - Evidence
  - Why it conflicts
  - How to use it
  rows:
  - - AUC / market-value vs revenue
    - $834.29B broad custody estimate vs $1.83B institutional custody estimate
    - 'Different numerator: assets/value facilitated vs provider revenue/services'
    - Present as separate lenses
  - - Software/services vs custody market
    - $2.20B crypto asset management estimate with custody-solution share
    - Includes asset management and custody solutions, not all digital asset custody
    - Use for narrower SAM sanity check
  - - Vendor survey bias
    - 88% budgeted / 16% production from Fireblocks survey
    - Useful but company-authored and not contract value
    - Use as adoption signal, not market size
  - - Tokenization timing
    - BCG and McKinsey support long-run tokenization potential
    - Large future asset pools may not translate into near-term wallet revenue
    - Treat as option value and require issuer traction
  - - Geographic adoption mismatch
    - Chainalysis adoption index is broad retail/institutional usage
    - Fireblocks sells to regulated institutions, not all users
    - Use only for regional demand context
  notes: This table preserves contradictory evidence to prevent false precision in TAM/SAM/SOM presentation.
  claimRefs:
