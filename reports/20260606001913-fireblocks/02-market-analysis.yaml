  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Fireblocks segment ARR, ACV, win rate, churn, payments take rate, stablecoin volume by segment, and deployment conversion from pilot to production.
    whyItMatters: Without these private metrics, public TAM/SAM/SOM cannot be converted into a Fireblocks-specific SOM or valuation-quality growth model.
    diligencePath: Request management KPI pack and board pipeline materials segmented by banks, fintech/exchange, payments, treasury, and tokenization.
    relatedQuestionRefs:
    - QM021
    - QM022
  - type: conflicting-data
    severity: material
    topic: sizing-estimate
    missingEvidence: Comparable methodologies for custody AUC, custody provider revenue, crypto asset management software, and institutional wallet infrastructure spend.
    whyItMatters: Published estimates differ by orders of magnitude and can mislead if treated as one homogeneous market.
    diligencePath: Normalize each report into numerator, geography, asset scope, customer scope, and revenue-vs-AUC definitions before using it in valuation.
    relatedQuestionRefs:
    - QM004
    - QM008
    - QM027
    relatedTableRefs:
    - TM002
    - TM005
  - type: missing-source
    severity: minor
    topic: geography
    missingEvidence: Fireblocks revenue or customer count by geography and regulated-entity type.
    whyItMatters: Geographic crypto adoption does not necessarily map to regulated institutional wallet spend.
    diligencePath: Ask for customer/revenue split by North America, Europe, APAC, LatAm, and Middle East, plus regulated bank vs fintech mix.
    relatedQuestionRefs:
    - QM023
