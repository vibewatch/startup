- id: drivers-and-constraints
  title: Growth Drivers, Constraints, Trust, and Switching Costs
  body: 'The clearest demand drivers are bank budget formation, stablecoin payments, tokenized securities and deposits, treasury automation, and the need to move from pilots into production. Fireblocks'' 2026 survey suggests budget is no longer the only bottleneck: 88% of financial institutions have or will commit budget, only 16% are in production, and only 15% describe custody and wallet governance as fully production-ready. That production gap favors infrastructure vendors, but constraints remain material. Stablecoin and custody rules add licensing, safeguarding, redemption, reporting, sanctions, and travel-rule obligations; BIS risk analysis cautions against assuming crypto infrastructure has traditional financial stability characteristics; and incumbents such as Visa are building around stablecoins too. Trust is therefore both a buyer trigger and a lock-in mechanism: once policy rules, APIs, recovery procedures, and audit trails are embedded, switching becomes a regulated migration
    project, not a simple vendor swap. Regionally, the U.S. remains the deepest near-term buyer pool, Europe is the fastest policy-driven accelerator under MiCA and ECB-led market-rail work, and APAC is growing through local licensing paths rather than one harmonized regime. Competitive pressure is also widening from crypto-native custodians to payment incumbents and bank-led internal builds.'
