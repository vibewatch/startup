chapter:
  number: 2
  title: Market Analysis
  summary: Fireblocks' market is best defined as institutional digital asset control infrastructure spanning custody, wallet governance, treasury, stablecoin payments, tokenization, and settlement—not the whole crypto economy. Public estimates support a large and growing category, but contradictory market-size lenses require explicit scope discipline and private Fireblocks metrics before any precise SAM/SOM claim.
sections:
- id: market-boundary
  title: 'Market Boundary: Institutional Control Layer, Not All Crypto'
  body: Fireblocks' investable market should be bounded around institutional digital asset infrastructure rather than the entire crypto economy. The included jobs are custody and wallet governance, client and treasury wallet operations, stablecoin payment and settlement connectivity, token issuance and lifecycle tooling, compliance controls, and integration into exchanges, liquidity venues, blockchains, and back-office systems. That boundary includes both technology sold to banks and fintechs and custody workflows that sit inside a regulated operating model. It excludes speculative token trading, consumer self-custody wallets, mining, NFT marketplaces, exchange trading fees, and general blockchain developer tooling unless those activities require institutional key control and transaction policy. This distinction matters because most public market reports quote asset value or AUC-like categories, while Fireblocks monetizes software, custody, services, and network workflows tied to production
    digital asset operations.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM038
  tableRefs:
  - TM001
  figureRefs: []
- id: multiple-sizing-lenses
  title: 'Sizing Lenses: Broad TAM, Narrow SAM, and Unusable Precision'
  body: Public sizing evidence supports a large and growing category, but it does not support a single precise Fireblocks TAM. The Business Research Company estimates digital asset custody at $834.29 billion in 2026 and $1.594 trillion in 2030, while institutional custody and crypto asset management reports use much smaller revenue or service-spend frames. The useful conclusion is not that the market is exactly any one number; it is that Fireblocks participates in several overlapping pools. Broad custody estimates show the asset base and strategic relevance, institutional custody estimates approximate the revenue pool for qualified custody and wallet infrastructure, and tokenization reports show a long-term adjacency that will only monetize when issuers, distribution, and secondary liquidity are ready. Fireblocks' serviceable market should therefore be narrated as evidence-constrained SAM rather than a generic trillion-dollar TAM.
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
