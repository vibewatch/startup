- id: buyer-user-payer
  title: Buyer, User, and Payer Map
  body: The economic buyer changes by segment. In banks, the payer is often a digital-assets, transaction-banking, securities-services, or innovation budget, but security, compliance, risk, treasury, and operations are hard veto holders because wallet architecture determines approval workflows, audit evidence, key recovery, and regulatory posture. In fintechs, exchanges, and trading firms, product and engineering teams push for speed, asset coverage, and embedded-wallet capabilities, while operations and compliance require controls that can scale under live trading or payment volume. Payment companies and remittance providers buy for stablecoin liquidity, treasury automation, cross-border settlement, and compliance; tokenization issuers buy for smart-contract deployment, asset servicing, custody, and distribution connectivity. This map implies long sales cycles but high switching costs once the stack reaches production.
