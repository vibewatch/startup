- id: TM007
  title: Regulatory milestone timeline
  columns:
  - Date
  - Jurisdiction
  - Milestone
  - Relevance to Fireblocks market
  - Remaining constraint
  rows:
  - - '2020-07-22'
    - United States
    - OCC confirms banks may provide crypto custody services
    - Legitimizes bank participation in digital-asset custody workflows
    - Does not remove later SEC/adviser safeguarding debates
  - - '2023-07-13'
    - Global
    - FSB final stablecoin oversight recommendations
    - Raises governance and supervision expectations for stablecoin payment infrastructure
    - Execution burden remains on operators and partners
  - - '2023-06-09'
    - European Union
    - MiCA adopted as continent-wide crypto-asset framework
    - Creates passportable rulebook for custody, tokens, and e-money style products
    - Authorization and compliance implementation still heavy
  - - 2025-2026
    - United States
    - Policy tone shifts toward enabling bank and institutional digital-asset participation
    - Improves buyer willingness to fund production infrastructure
    - Political and supervisory reversals remain possible
  - - '2026-03-23'
    - Europe
    - ECB says tokenised financial markets are moving from exploration toward production
    - Supports Europe as the fastest policy-led acceleration region
    - Scale still depends on interoperable cash and market infrastructure
  notes: Timeline mixes legal enactment, supervisory guidance, and market-infrastructure signals because all three affect adoption timing.
  claimRefs:
  - CM023
  - CM024
  - CM042
  - CM045
- id: TM008
  title: Competitive dynamics and build-vs-buy pressure
  columns:
  - Option
  - Why buyers choose it
  - Strength
  - Limitation versus Fireblocks
  - Market implication
  rows:
  - - Fireblocks-style platform
    - One control plane for custody, payments, tokenization, and policy
    - Workflow breadth and switching cost once live
    - Needs proof that breadth monetizes efficiently
    - Supports premium narrative if attach rates are real
  - - Point custody / wallet vendors
    - Narrower deployment and sometimes lower complexity
    - Focused controls for a subset of use cases
    - Less breadth across payments, tokenization, and treasury
    - Can pressure pricing in single-job mandates
  - - Bank internal build
    - Keeps infrastructure inside the regulated institution
    - Regulatory comfort and tighter control over data and processes
    - Longer build cycles and weaker ecosystem connectivity
    - Validates category but narrows external-vendor share
  - - Payment-network incumbents
    - Leverages existing merchant and bank relationships
    - Distribution and settlement expertise
    - May not offer neutral multi-asset control layer
    - Stablecoin growth can attract well-capitalized adjacent entrants
  - - Exchange-native or omnibus wallets
    - Fastest path for trading-focused firms
    - Immediate liquidity access
    - Weakest bankruptcy-remoteness and governance story
    - Fireblocks benefits when buyers migrate away from this status quo
  notes: This table compares operating choices rather than named public competitors only; the point is where market power can shift.
  claimRefs:
  - CM004
  - CM021
  - CM026
  - CM027
  - CM044
