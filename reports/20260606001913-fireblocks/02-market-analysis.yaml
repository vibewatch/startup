tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Fireblocks
  rows:
  - - Institutional custody and wallet governance
    - MPC/HSM key management, policy engine, approval workflows, qualified or hybrid custody controls
    - Retail wallets and speculative trading fees
    - Banks, exchanges, asset managers, treasury teams
    - Core control layer for most Fireblocks use cases
  - - Treasury and settlement operations
    - Treasury automation, counterparty connectivity, reconciliation, asset transfers, liquidity routing
    - Traditional ERP without digital asset movement
    - Corporate treasury, trading operations, bank operations
    - Adjacency that turns custody into daily workflow
  - - Stablecoin payments
    - Stablecoin payment rails, compliance, liquidity access, cross-border settlement operations
    - Card interchange and fiat-only correspondent fees
    - Payment providers, remitters, banks, fintech product teams
    - High-growth payments use case but regulated and competitive
  - - Tokenization infrastructure
    - Smart-contract deployment, mint/burn controls, token lifecycle reporting, custody of tokenized assets
    - Tokenized asset valuation or fund-management economics
    - Issuers, asset managers, banks, market infrastructures
    - Long-term adjacency; near-term adoption gated by issuance and liquidity
  - - Compliance and reporting layer
    - AML, sanctions, Travel Rule, audit logs, regulatory reporting exports
    - General enterprise GRC not tied to transactions
    - Risk, compliance, security and vendor-risk teams
    - Influences procurement and switching cost
  - - Status quo substitutes
    - Internal builds, exchange wallets, cold-storage providers, manual whitelisting, bank rails
    - Not a spend pool, but replacement baseline
    - CIO, ops, product, security
    - Defines ROI hurdle and migration friction
  notes: 'Boundary is evidence-constrained: rows include spend tied to institutional digital asset operations and exclude asset-value, speculation, and consumer-only activity.'
