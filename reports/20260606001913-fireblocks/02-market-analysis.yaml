  - CM030
  - CM031
  - CM033
  - CM039
  - CM040
- id: TM006
  title: Regional breakdown and regulatory readiness
  columns:
  - Region
  - Demand signal
  - Regulatory catalyst
  - Why it matters for Fireblocks
  - Main friction
  rows:
  - - United States
    - Largest concentration of banks, ETF-linked attention, stablecoin and custody buyers
    - OCC custody clarity plus active SEC custody dialogue
    - Most immediate enterprise budget pool and partner density
    - Rule interpretation can still shift and qualified-custody evidence must be strong
  - - Europe
    - Tokenised bond and DLT issuance moving from pilots toward production
    - MiCA plus ECB and DLT Pilot Regime work
    - Creates regulated expansion path for custody, payments, and tokenization workflows
    - Entity structuring, compliance documentation, and operational-resilience overhead
  - - APAC
    - Growing institutional experimentation in payments, exchanges, and banks
    - Local licensing and supervisory regimes rather than one passport
    - Important growth corridor for cross-border payments and exchange liquidity
    - Fragmented rulebooks require local partnerships and tailored compliance
  - - LatAm / MEA corridors
    - Strong cross-border and treasury interest around stablecoins
    - Less harmonized than U.S./EU; often corridor-specific
    - Useful for payment-volume growth and emerging-market treasury use cases
    - Higher counterparty, compliance, and corridor-liquidity variance
  notes: Regional ranking is directional and tied to institutional-readiness signals rather than to a fully measured revenue split.
  claimRefs:
