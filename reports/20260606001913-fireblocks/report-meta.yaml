companyProfile:
  summary: |
    Fireblocks is a New York-headquartered digital asset infrastructure company founded in 2018 by
    three Check Point Software cybersecurity alumni — Michael Shaulov (CEO), Pavel Berengoltz
    (CTO), and Idan Ofrat (CPO) — who investigated the 2017 Lazarus Group exchange hacks and
    identified the absence of institutional-grade custody. The company has raised $1.04 billion
    across six equity rounds, most recently a $550 million Series E at an $8 billion valuation
    co-led by D1 Capital Partners and Spark Capital in January 2022. Fireblocks serves 2,400+
    institutional organizations including BNY Mellon, BNP Paribas, Revolut, and Worldpay. Its
    core technology combines Multi-Party Computation wallets with patent-pending Intel SGX chip
    isolation to protect private keys. The platform covers four clusters: wallets and custody,
    payments (100+ countries), operations (policy engine, DeFi, AI), and financial applications
    (tokenization, staking, compliance). Third-party estimates place FY2024 revenue at approximately
    $124 million. No official audited financials, gross margin, NRR, or cap-table terms are
    publicly available.
  foundedDate: "2018-01-01"
  founders:
    - name: Michael Shaulov
      role: "CEO, Co-founder"
      background: "Previously founded Lacoon Mobile Security (acquired by Check Point ~$100M, 2015); led Check Point's Lazarus Group investigation team."
      claimRefs: [CO007, CO008]
    - name: Pavel Berengoltz
      role: "CTO, Co-founder"
      background: "Check Point Software cybersecurity engineer; worked on the 2017 Lazarus Group hack investigation."
      claimRefs: [CO007]
    - name: Idan Ofrat
      role: "CPO, Co-founder"
      background: "Check Point Software product engineer; key architect of the Fireblocks MPC platform."
      claimRefs: [CO007]
  foundingLocation: "Tel Aviv, Israel / New York, NY"
  headquarters: "New York, NY (441 9th Avenue)"
  productSummary: |
    Fireblocks delivers a cloud-based digital asset infrastructure platform combining MPC-CMP
    custody with Intel SGX hardware isolation, a cross-institutional payments network, a policy
    engine for transaction automation, and API connectivity across 100+ blockchains. The platform
    covers wallets and custody (treasury management, embedded wallets, Fireblocks Trust Company),
    payments (stablecoin rails, agentic payments, cross-border), operations (compliance, DeFi,
    AI suite), and financial applications (tokenization, staking, earn, reconciliation).
  customerFocus: |
    Financial institutions, fintechs, crypto-native exchanges, payment processors, Web3 companies,
    and regulated custodians seeking institutional-grade digital asset infrastructure. Named anchor
    clients include BNY Mellon, BNP Paribas, Revolut, Worldpay, and Fifth Third Bank.
  businessModel: |
    Hybrid SaaS and infrastructure model: annual subscription platform fee (base outbound volume
    threshold $1M; 0.20% overage), AUC-linked custody fees (3–30 bps on assets under custody via
    KeyLink), and per-wallet fees for Embedded Wallets. Transaction-based revenue from the
    Fireblocks Network and payments products is growing as a share of the mix.
  stage: "Series E-backed private company, no publicly disclosed round since January 2022"
  fundingStatus: "$1.04B raised across six rounds (2019–2022); last primary round was a $550M Series E at $8B valuation (January 2022); secondary market indications in mid-$5 to low-$6/share range as of June 2026."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO007, CO016, CO017, CI001, CI002, CV001, CV005, CV006]

summary:
  headline: "Fireblocks is a real institutional digital asset infrastructure leader with verifiable enterprise scale, but the unchanged $8B Series E mark is indefensible at current 4–6x EV/revenue multiples implied by BitGo's IPO and Anchorage's financing, and the company's continued opacity on margins, NRR, and litigation resolution makes a research-more call the only defensible position."
