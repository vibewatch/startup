coverageNotes: |
  This report was produced on 2026-06-06 using publicly available sources only. Fireblocks is a
  private company that has not disclosed official audited financials since its Series E in January
  2022. Revenue figures cited are third-party estimates (Forbes: $124M FY2024; alternative estimates
  reach ~$193M). Gross margin, burn rate, cash position, NRR, and cap-table terms remain undisclosed.
  The $8B valuation is the last confirmed primary-round mark; secondary-market indications on Nasdaq
  Private Market ($6.18/share, May 2026) and Hiive ($5.43/share, June 2026) suggest the clearing
  price has compressed materially below the 2022 reference. Two active litigation matters
  (StakeHound, 2021; Celsius bankruptcy dispute, March 2026) represent unresolved tail risk.

