  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资启示
        blocks:
          - type: paragraph
            body: >-
              公司最大的潜在风险敞口在于业务落地执行，而非已证实的法律诉讼风险。ElevateBio 兼顾自研疗法推进与外部客户服务，官方网站宣称覆盖从早期发现到商业化 cGMP
              生产的全流程。这一业务广度使得单一运营模式必须同时承载高度关联的科研、质量、排期、客户维护及资本投入压力。独立媒体报道证实其历史融资规模庞大，且明确将细胞与基因治疗定性为资本密集型行业；然而，累计融资额并不等同于当前可用现金，且现有证据未披露烧钱速度、现金跑道、待交付订单、产能利用率或利润率。因此，投资研判应当以客户真实支撑的产能需求、充足的流动性以及新工厂的顺利交付为前提，不可单纯基于累计融资额盲目乐观。后续需重点监控已签约待交付订单、复购签单、批次放行表现、现金跑道以及
              Pittsburgh 基地的调试投产情况。投资逻辑证伪的触发因素包括：不利的监管检查结论、重大质量或数据安全事故、新厂房投产屡次延期，或在损害平台股权控制权的严苛条款下进行融资。
            claimRefs:
              - CR001
