    rows:
      - - 阶段 1：启动与规划
        - 商业合同、工艺流程图、物料清单（BOM）界定、启动会治理架构
        - 主服务协议（MSA）、工作说明书（SOW）、客户技术规范
        - 范围界定不一致、知识产权边界模糊及可比性标准缺失
      - - 阶段 2：知识转移与差距分析
        - 厂房适应性与差距评估、设备 / 物料采购、方法转移方案
        - 设备安装与运行确认（IOQ）、原材料质量确认（人血白蛋白、人血清白蛋白、细胞因子）、SOP 协同对齐
        - 一次性耗材采购交付周期过长及供体原料获取延误
      - - 阶段 3：洁净室生产执行
        - 可行性批次、人员培训批次、工程批次及无菌工艺模拟（APS）
        - cGMP 洁净室套间就绪度、经培训的生产技术人员、无菌培养基灌装
        - 污染事件、工艺参数漂移及复苏后细胞活性偏低
      - - 阶段 4：工艺固化与收尾
        - 主批生产记录（MBR）审批、分析方法验证、放行就绪度、技术转移报告
        - 分析方法确认（已确认对比已验证）、质量协议签署
        - 转出方与接收方分析检测结果不一致导致 IND 申报延误
      - - 数字化与排期治理
        - 企业级 SAP ERP 排程管理、S&OP 供需产能规划、档期锁定
        - 主计划员统筹协调供应链、质量与技术运营团队
        - 自研疗法与高优先级外部伙伴之间的洁净室档期争夺
      - - 法规合规与质量控制
        - 涵盖 FDA CBER 与欧盟法规的 Dark Horse Consulting ICMC 9 体系合规框架
        - 全面质量管理体系（QMS）、数据完整性、环境监测
        - 监管机构现场检查缺陷项（audit observations）或 BLA 化学与生产评审暂停（review holds）
