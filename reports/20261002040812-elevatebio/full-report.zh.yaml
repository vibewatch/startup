  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 贯穿客户研发工作流的产品与服务定义
        blocks:
          - type: paragraph
            body: >-
              ElevateBio 提供一体化前沿疗法平台，旨在为生物医药创新企业提供从早期发现到商业化落地的全生命周期支持 [CE001, CE003,
              CE007]。细胞与基因治疗（CGT）的传统开发路径存在严重的碎片化问题，迫使疗法申办方在早期发现实验室、分析检测中心、学术研究型载体机构以及独立的委托生产工厂之间频繁转手交接 [CE001, CE002,
              CE007]。ElevateBio 在单一体系内打通统一的工作流程，涵盖靶点识别、基因编辑候选分子优化、工艺开发、分析方法验证、临床供应以及商业化规模 cGMP 生产，消除了不同环节之间的交接摩擦 [CE001,
              CE003, CE007]。生物制药申办方在不同的关键节点切入 ElevateBio 平台：早期创新企业借助新型 CRISPR 与碱基编辑系统设计并验证先导候选分子，而临床期申办方则依托 BaseCamp
              的工艺确认、洁净室产线排期和批次放行检验，推进项目完成临床研究用新药（IND）及生物制品许可申请（BLA）申报 [CE001, CE003, CE005, CE007]。
