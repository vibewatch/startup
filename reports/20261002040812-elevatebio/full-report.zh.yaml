  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              ElevateBio 搭建了重资本的混合业务模式，横跨旗下 Life Edit 自研基因编辑知识产权、诱导多能干细胞，以及位于 Waltham 和 Pittsburgh 的 BaseCamp 基地端到端 cGMP
              生产线 [CV001, CV003, CV008]。核心投资逻辑立足于专业细胞与基因治疗合同研发生产（CDMO）的结构性需求，并得到 Novo Nordisk 与 Moderna 等药企巨头多管线合作的背书
              [CV001, CV004]。其中，Novo Nordisk 在认购股权的同时签订了覆盖 7 个碱基编辑管线的研发协议，单管线潜在开发、监管与商业化里程碑付款达 $250M 至 $335M [CV001,
              CV004]。此外，BaseCamp Waltham 基地在病毒载体、非病毒载体和细胞治疗条线均获得 Dark Horse Consulting 评估的第三方 ICMC 认证，确立了技术与合规门槛
              [CV008]。相对地，核心反向逻辑指向沉重的执行与资金包袱。建设并运营洁净室基础设施需要持续的高资本开支，而前沿基因药物的商业化周期依然漫长 [CV003, CV008]。UpMarket
              等平台的老股市场评估表明，未上市股权交易存在大幅流动性折价、固定交易摩擦以及本金全损的投机风险 [CV002, CV007]。随着管理权移交至首席执行官 Chris Murphy、联合创始人 David
              Hallal 转任执行董事长，公司必须在脱离一级市场融资窗口的前提下，全力兑现收入里程碑 [CV005, CV006]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
