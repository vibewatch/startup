  - id: FE001
    title: ElevateBio 基因药物一体化平台技术架构全景图
    type: stack
    summary: 展现 ElevateBio 一体化技术架构的系统图景，从底层企业基础设施、工艺开发、赋能平台及递送模式逐级向上，最终直达治疗性产品产出。
    data:
      layers:
        - label: 治疗模态与产品管线
          detail: 面向生物制药合作伙伴与自主研发管线的临床级及商业化产出
          modules:
            - 体内基因编辑疗法
            - 自体与异体细胞疗法
            - 病毒载体供应（慢病毒与 AAV）
            - mRNA 疫苗与基因递送
        - label: 赋能技术与工程化平台
          detail: 驱动遗传重编程的专有分子工具与生物底盘
          modules:
            - Life Edit 新型 RNA 导向核酸酶
            - 高精度碱基编辑与逆转录编辑系统
            - 诱导多能干细胞（iPSC）
            - 病毒、RNA、蛋白质与细胞工程
        - label: 转化分析与快速放行套间
          detail: 加速质量表征与 BLA 申报的一体化检测基础设施
          modules:
            - 二代测序技术（NGS）
            - 批次快速放行数字化检测
            - 定制化生物活性与鉴别分析
            - 工艺表征分析
        - label: BaseCamp 工艺开发与 cGMP 生产
          detail: 将实验室分子构型转化为获批合规药品的端到端转化基础设施
          modules:
            - LentiPeak 悬浮慢病毒生产
            - 全血 PBMC 分离纯化过滤
            - 非病毒递送系统（电转与 LNP）
            - ICH Q10 四阶段技术转移流程
        - label: 企业质量、数字化与法规遵从基座
          detail: 保障合规、数据完整性与排产履约的机构级运营架构
          modules:
            - Dark Horse Consulting ICMC 9 大系统认证
            - FDA CBER 第 45 章与欧盟 2003/94/EC 合规
            - SAP ERP 主生产排程与产销协同（S&OP）
            - BaseCamp Waltham 与 BaseCamp Pittsburgh（2027）
        - label: 实体设施与一次性使用基础设施
          detail: 专用于污染控制与多模态隔离的受控洁净室环境
          modules:
            - 模块化 cGMP 洁净室生产套间
            - 一次性生物反应器与层析生产线
            - 受控物料仓储与深低温储存
            - 集中式洁净室环境监测
    approximationNotes: 平台架构层级依据 ElevateBio 公司披露、BaseCamp 服务规范及 ASGCT 技术报告绘制。
    claimRefs:
