            body: >-
              ElevateBio 历经 4 轮重大融资构建起雄厚资金实力，累计募资规模在 $1.27B 至 $1.3B 之间。公司于 2019 年 5 月启动运营，由 MPM Capital 管理的 UBS Oncology
              Impact Fund 与 F2 Ventures 联合领投 $150M Series A 轮融资，EcoR1 Capital、Redmile Group 与 Samsara BioCapital
              跟投。随后公司持续扩充资本，完成 $170M Series B 轮，并在 2021 年 3 月敲定由 Matrix Capital Management 领投、规模达 $525M 的巨额 Series C
              轮融资，SoftBank Vision Fund 2 与 Fidelity Management & Research Company 参投。2023 年 5 月，ElevateBio 完成由 Matrix
              Capital Management 旗下 AyurMaya Capital Management Fund 领投的 $401M Series D 轮融资，同时引入战略锚定合作方 Novo
              Nordisk，并达成总额达 $1.9B 的多靶点 CRISPR 合作开发协议。尽管早期融资在 2022 年将公司估值推升至约 $2.25B 的非公开投后峰值，但在宏观生物科技估值倍数承压背景下，Series D
