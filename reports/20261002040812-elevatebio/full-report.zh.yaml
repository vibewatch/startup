      - 目标客群
      - 核心差异化特征
      - 主要局限 / 权衡取舍
    rows:
      - - 一体化技术型 CDMO
        - ElevateBio BaseCamp
        - 私有公司（累计融资超 $1.25B；在马萨诸塞州 Waltham 与 Pittsburgh 设有 cGMP 基地）
        - 细胞与基因治疗 Biotech、制药创新企业（如 Kyverna、Novo Nordisk）
        - 整合 Life Edit 基因编辑、4 个月快速技术转移、ICMC 多模态质量认证
        - 披露口径不公开；高资本开支，执行层面受组织架构调整影响敏感
      - - 全球传统生物医药 CDMO 巨头
        - Lonza, Catalent, Thermo Fisher Scientific
        - 跨国上市企业规模（市值超 $10B；全球化生产网络）
        - 大型药企与后期商业化生物治疗产品
        - 庞大的商业化产能、成熟的监管往绩、遍布全球的厂房冗余备份
        - 传统标准化技术转移流程，早期阶段响应偏慢，缺乏自研基因编辑工具
      - - CGT 专科外包服务商
        - WuXi Advanced Therapies, Charles River CGT
        - 成熟的合同检测体系，设有专门的病毒载体/细胞治疗业务单元
        - 从临床前阶段 Biotech 到临床期 CGT 创新企业
        - 专用的病毒载体与细胞库基础设施、完善的分析检测服务目录
        - 项目制单点合作模式、依赖第三方检测方法、面临地缘政治或监管审查
      - - 药企自建生产设施
        - 申办方自有厂房（如 Novartis、大型商业化 CGT Biotech）
        - 申办方自主控股的专属厂房（建厂资本投资达 $100M+ 至 $300M+）
        - 自有专有管线候选分子与重磅临床项目
        - 对生产排期、批次优先级和专有 IP 拥有绝对战略控制权
        - 资本密集度极高，一旦管线临床失败将承担产能闲置成本，厂房建设周期漫长
      - - 科研院校与精品孵化器
        - 高校细胞治疗中心、医学院病毒载体核心实验室
        - 依托高校的研究级洁净室与中试生产套间
        - 早期高校衍生项目与 Phase 1 概念验证（PoC）研究
        - 直连基础生物学科研成果，初期研发启动门槛低
