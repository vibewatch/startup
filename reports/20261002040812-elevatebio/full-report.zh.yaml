      - number: '5.2'
        title: 平台模块、技术组合与管线架构
        blocks:
          - type: paragraph
            body: >-
              ElevateBio 的核心技术架构分为两大基础运营部门：负责基因编辑与研发技术的 Life Edit Therapeutics，以及负责工艺开发与 cGMP 生产制造的 BaseCamp [CE001,
              CE004, CE005, CE006, CE007]。Life Edit 拥有规模庞大的新型 RNA 引导核酸酶（RGN）、碱基编辑器和逆转录编辑器工具库，均源自 AgBiome
              丰富的非致病性环境微生物菌种库，在人类全基因组范围内提供灵活的编辑模态与广泛的原间区相邻基序（PAM）位点识别能力 [CE004, CE005]。这些编辑技术同 ElevateBio
              的自研诱导多能干细胞（iPSC）平台相结合，能够工程化构建避免宿主免疫排斥的通用型或低免疫原性细胞系，并配备病毒载体与 RNA 工程化工具箱 [CE001, CE003, CE004,
              CE007]。BaseCamp 运营专用洁净室，提供可扩展的悬浮慢病毒载体生产（LentiPeak）、腺相关病毒（AAV）制造，以及涵盖脂质纳米颗粒（LNP）与电穿孔技术的非病毒递送模态 [CE001,
              CE002, CE005, CE007]。除合作伙伴申办项目外，Life Edit 还选择性推进自研临床前资产，包括利用 AAV5
              递送、用于治疗亨廷顿病且已在非人灵长类动物实验中得到验证的等位基因选择性基因编辑候选药物 LETI-101 [CE005]。
