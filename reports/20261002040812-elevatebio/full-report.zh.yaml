              后续报道则指出，其业务兼顾内部自研疗法以及同学术机构、生物技术公司的长期合作。对外部申办方而言，合作介入点可始于早期发现、工艺开发、技术转移、临床供应或后期商业化生产，公司自述合作架构依具体项目、时间表和开发阶段定制。现有资料未披露实际付款方、签约实体及预算决策人，因此首席科学官（CSO）或
