  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              ElevateBio 对应的目标市场并非细胞与基因治疗领域的全部支出，其实际覆盖面要窄得多。公司官方服务范围从基因编辑发现与候选分子优化，一直延伸至工艺开发、技术转移、分析检测、临床供应、商业化 cGMP
              生产及法规支持。同时公司还自研内部疗法，因此内部管线投入与第三方 CDMO 收入相邻，但二者不可等同。BaseCamp
              官方披露的疗法覆盖范围包括自体、异体及再生细胞产品，外加病毒载体制造。因此，实际的市场边界仅包含公司有能力承接的外包前沿疗法研发与生产任务，排除了临床试验运营、患者护理、医保支付、传统小分子药物制造，以及申办方留在自家体系内未交给
              ElevateBio 的内部支出。当前的行业现状依然由分散的细分外包商或药企自建产能主导，并非整块疗法市场价值都能自然转化为公司的有效目标市场。
