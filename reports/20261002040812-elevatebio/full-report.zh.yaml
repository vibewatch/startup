      - number: '7.2'
        title: 监管、法律与数据风险敞口
        blocks:
          - type: paragraph
            body: >-
              BaseCamp Waltham 公布的 ICMC 认证是目前最清晰的公开风控凭证。ElevateBio 称该项评估涵盖病毒递送、非病毒递送和细胞治疗生产，运用了 9
              套系统，并包含现场实地核查与数百份文件的审阅。这属于重要的尽调证据，但该公告由公司单方面发布，且该认证并未被表述为 FDA
              或欧盟监管机构的官方行政审批。数据风险同样重大：隐私政策覆盖旗下子公司，涉及临床试验、科研、基因疗法与免疫疗法中使用的健康、医疗及遗传信息。该政策同时声明无法保证互联网绝对安全。因此，公开展示的合规举措能够缓解但无法消除隐私、网络安全、质量、监管链条（chain-of-custody）以及合规风险。当前资料库未核实诉讼、行政执法、Form
              483 检查记录历史、产品召回、数据泄露、专利纠纷或合同层面的知识产权归属；这些仍属于重点核查的专项尽调事项，尚不能得出风险出清的定论。
