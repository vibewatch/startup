      - number: '7.3'
        title: 运营、合作伙伴与管理层风险
        blocks:
          - type: paragraph
            body: >-
              该运营模式将基础科研、工艺开发、生产制造与质量把控集中整合于同一屋檐下，力求消除中间交接环节。这种设计虽能强化问责机制，但也使得多个环节之间的交付表现相互牵制。ElevateBio 在 2025
              年认证公告中表示，BaseCamp Pittsburgh 处于建设中并预计于 2027 年投产。在投产调试证据披露前，工期排程、验证、人员配置与产能利用率都属于需要持续跟踪的风险。当前团队页面将 Chris
              Murphy 列为首席执行官，并公布了首席运营官以及 Waltham 和 Pittsburgh
              基地负责人，这些安排能缓解治理风险，但不能证明交付结果已经兑现。合作伙伴风险也有结构性一面：独立媒体报道提及公司与学术机构及生物科技企业的长期合作，公司则宣传在整个研发旅程中配备专项团队。在把一体化模式视为风险已出清之前，投资者应要求查阅客户集中度、解约权条款、预留产能义务、服务等级协议（SLA）履约表现、供应商冗余储备以及业务连续性测试结果。
