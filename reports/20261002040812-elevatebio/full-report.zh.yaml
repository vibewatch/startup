    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位与混合运营模式
        blocks:
          - type: paragraph
            body: >-
              ElevateBio 于 2019 年在马萨诸塞州 Cambridge 成立，总部及大规模 cGMP 生产基地位于马萨诸塞州
              Waltham。公司打通学术与临床发现到工业化生物制造的通道，直击先进基因药物领域的结构性瓶颈。ElevateBio 没有走传统合同研发生产组织（CDMO）或纯自研疗法 Biotech
              的单一路径，而是采用一体化混合模式。该架构依托 Life Edit 业务单元输出自研基因编辑技术，同时借助子公司 BaseCamp
              集中建设工艺开发和动态药品生产管理规范（cGMP）基础设施。这种双轮驱动架构既支持 ElevateBio 协同推进内部自研疗法管线，也能为战略药企合作伙伴及孵化企业提供覆盖细胞疗法、病毒载体和 mRNA
              药物的全链条“从实验室到临床”（bench-to-bedside）服务。
