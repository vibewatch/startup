  - id: TE002
    title: 治疗工作流与用例映射表
    columns:
      - 用户工作任务 / 流程阶段
      - 行业当前工作流与痛点
      - ElevateBio 解决方案与运营模式
      - 可量化的技术收益
      - 当前技术局限
    rows:
      - - 靶点识别与基因编辑设计
        - 知识产权许可碎片化；传统 Cas9 的 PAM 识别靶向范围受限；脱靶编辑风险
        - Life Edit 专有 RGN、碱基编辑器与逆转录编辑器套件
        - 借助多样化新型 PAM 序列实现无受限基因组靶向灵活性
        - 临床试验中的长期体内耐用性与脱靶 RNA 编辑表征
      - - 用于 CAR-T 的原代 T 细胞分离
        - 开放式单采血成分处理与人工 Ficoll 密度梯度离心导致细胞损失
        - 采用全血直接封闭式细胞分选过滤系统（5–9 µm 孔径滤器）
        - CD3+ T 细胞回收率高达 80%（较 Ficoll 提升 2 倍）并实现血小板清除
        - 滤器截留效率对供体全血流变学特性与红细胞压积较为敏感
      - - 原代细胞的非病毒转染
        - 电穿孔过程细胞死亡率高，或早期 LNP 递送效率低下
        - 针对定制电穿孔方案与工程化 LNP 进行对比优化
        - 兼顾高编辑效率与卓越细胞活性及扩增能力的平衡工艺方案
        - 商业化患者规模下定制 GMP 脂质配方试剂成本高昂
      - - 病毒载体放大与生产
        - 滴度偏低、贴壁培养体系难以线性放大且批次失败频发
        - LentiPeak 可放大悬浮慢病毒载体平台，配有经验证的缩小模型
        - 单批次临床产能高，放大参数具可预测性，满足 BLA 就绪要求
        - 对 GMP 级质粒与转染试剂等关键原材料的供应链依赖
      - - 分析表征与批次放行
        - 外部合同检测实验室放行周期过长（6–8 周）
        - BaseCamp 厂区内部整合 NGS、快速分析及定制效力检测套件
        - 加快批次放行检测，消除跨机构转运与质保排期延误
        - 跨合作伙伴的多样化构建体均需单独进行产品专属方法确认
