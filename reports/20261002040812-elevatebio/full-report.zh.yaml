figures:
  - id: FO001
    title: ElevateBio 发展演进、融资历程与运营里程碑
    type: timeline
    summary: 梳理 ElevateBio 自 2019 年孵化创立并完成 $150M A 轮融资，历经多轮资本募集、设施扩张、战略合作至管理层交接的时间线里程碑。
    data:
      items:
        - date: '2019-05-13'
          label: 创立启动与 $150M A 轮融资
          detail: ElevateBio 正式启动，由 MPM Capital 与 F2 Ventures 联合领投 $150M A 轮融资，构建先进细胞与基因治疗控股孵化模式。
        - date: '2020-04-15'
          label: B 轮融资与 BaseCamp 建设
          detail: 完成 $170M B 轮融资，加速管线公司孵化，并在马萨诸塞州沃尔瑟姆投产运营 BaseCamp 生物制造基地。
        - date: '2021-03-15'
          label: $525M C 轮融资
          detail: 完成由 Matrix Capital Management 领投、SoftBank Vision Fund 2 与 Fidelity 参投的 $525M C 轮融资，扩充病毒载体与细胞工程产能。
        - date: '2022-07-12'
          label: 数字化生物制造与 Life Edit 平台
          detail: 整合 Life Edit Therapeutics 专有基因组编辑工具包，并在 BaseCamp 各洁净车间推广数字化生物制造工作流。
        - date: '2023-03-07'
          label: 扩充监管事务管理团队
          detail: 任命生物制药资深专家 Heidi L. Wagner（法学博士）担任全球政府事务负责人，统筹国家及国际层面的监管沟通对接。
        - date: '2023-05-24'
          label: $401M D 轮融资与 Novo Nordisk 战略联盟
          detail: 完成由 AyurMaya（Matrix）领投的 $401M D 轮融资，并与 Novo Nordisk 建立总额达 $1.9B 的多靶点 CRISPR 合作开发联盟。
        - date: '2024-05-14'
          label: 荣登 CNBC Disruptor 50 榜单
          detail: 位列 CNBC Disruptor 50 榜单第 8 位，突出展现了其可扩展的 CRISPR 工具、匹兹堡大学生物制造基地扩建以及与大型药企的深度合作。
        - date: '2025-05-17'
          label: ASGCT 第 28 届年会公布科研成果
          detail: 公布候选药物 LETI-101 的非人灵长类亨廷顿病试验数据，并详细推介 LentiPeak 商业化慢病毒载体生物制造平台。
        - date: '2026-01-15'
          label: CEO 交接与聚焦商业化拓展
          detail: Chris Murphy 出任首席执行官（CEO），David Hallal 转任执行董事长，全面聚焦 CDMO 商业化业务拓展与执行。
    approximationNotes: 里程碑日期来源于经核实的新闻稿及媒体报道；管理层变动日期对应官方宣布的组织架构演进时间。
    claimRefs:
      - CO001
      - CO006
      - CO007
      - CO010
      - CO012
      - CO013
      - CO014
      - CO015
