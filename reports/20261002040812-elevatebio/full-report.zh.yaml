      - number: '2.4'
        title: 增长驱动力、约束条件与估值映射
        blocks:
          - type: paragraph
            body: >
              需求驱动因素清晰可见，但尚不足以确立市场捕获能力。据 CNBC 报道，管线中约 500 种在研疗法催生了大量潜在开发项目，而据报道 ElevateBio 与超过 20
              家生物医药企业建立的合作关系也表明其已拥有多客户渠道。资本注入历程同样凸显该赛道的高资源壁垒：据 BioSpace 报道，公司 2019 年完成了 $150M 启动融资；TechCrunch 亦报道称其 2021
              年完成的 $525M Series C
              轮融资旨在扩充研发与产能，同时支持更多合作公司与伙伴关系。与此同时，制约瓶颈同样不可忽视：资本密集特性可能推迟申办方履约承诺；技术转移、质量把控、数据隔离与商业化就绪度尽调推高了切换成本；管线研发损耗也使名义疗法价值与实际可生产需求产生脱节。ElevateBio
              2025 年官方公布覆盖 3 个递送或疗法类别、评估 9 大系统的认证属于采购维度的参考依据，但这并非监管审批、产能利用率指标、财务收入数字或独立的市场份额证明。
