      - number: '3.4'
        title: 图表与附录
        blocks:
          - type: callout
            title: 技术转移速度优势
            body: >
              相较于传统 CDMO 龙头，ElevateBio 最核心的运营差异化优势在于技术转移速度。复杂细胞疗法的行业常规技术转移通常平均需要 12 至 18 个月，而 ElevateBio 在 Kyverna 的
              miv-cel 自体 CAR-T 项目中，从项目启动到首批 GMP 可比性试生产仅用时 4 个月。大幅压缩技术转移周期，帮助生物制药申办方在竞争激烈的 IND 和 BLA 申报窗口期牢牢把握临床推进节奏。
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: 运营排期与产能摩擦
            body: >
              跨细胞治疗和病毒载体运营多租户、多模态的 cGMP 设施带来了极高的操作复杂度。在人员编制精简及近期组织架构重组的背景下，ElevateBio 的产能调度高度依赖 SAP 内的主生产计划与 S&OP
              协同。任何产线档期冲突或批次周转延误，都会直接威胁申办方的临床时间表，并使公司在其重资产设施中承受巨大的固定管理成本拖累。
