      - number: '6.3'
        title: 标杆客户佐证、战略联盟与临床进展
        blocks:
          - type: paragraph
            body: >
              ElevateBio 的商业可行性主要由一系列备受瞩目的大型企业合作及临床期协同项目所支撑。其与 Novo Nordisk 达成的总额 $1.9B 合作与利润分成协议是目前公开披露的最大规模企业级项目，重点依托
              Life Edit 的碱基编辑平台纠正致病突变。此外，Moderna 为体内 mRNA 基因编辑项目的临床前研究与临床先导分子优化提供资助，并在技术里程碑达成时支付研发款项与特许权使用费分成。


              在临床细胞治疗领域，ElevateBio 为 Kyverna Therapeutics 等上市新锐提供支持，负责工艺工程与生产执行。早期的战略合作项目还包括围绕 Baylor College of
              Medicine 授权的异体 T 细胞疗法设立的 AlloVir，以及同 Fred Hutchinson Cancer Center 联合开发的肿瘤学项目。


              然而，细胞与基因治疗领域的客户采纳仍受制于更广泛的生物医药市场波动。在资金供给收紧的融资环境下，同行初创企业普遍削减外部研发支出并压缩临床管线。ElevateBio
              的收入高度集中于少数头部战略药企伙伴；一旦核心先导临床候选分子遭遇研发受阻或合作伙伴战略优先级调整，公司将面临显著的战略风险敞口。
