      - number: '8.3'
        title: 乐观、基准与悲观情景预测
        blocks:
          - type: paragraph
            body: >-
              评估 ElevateBio 的风险收益特征，需要权衡已签约的 biobucks 里程碑潜力、运营固定成本以及一级市场流动性格局 [CV001, CV004, CV007]。在乐观情景中（预估概率
              25%），ElevateBio 兑现 Novo Nordisk 旗下 7 个管线及 Moderna 合作项目的多项临床研发里程碑，同时 BaseCamp
              拓展外部客户产能利用率，在有利的宏观市场环境下支撑公司完成首次公开募股（IPO）[CV001, CV004, CV008]。在基准情景中（概率 55%），公司在首席执行官 Chris Murphy
              领导下保持稳健的合同研发收入与技术进展，但商业化爆发点推迟至 2027 年 BaseCamp Pittsburgh 竣工之后，导致 Pre-IPO 股权承受流动性折价，估值标记在 $1.8B 至 $2.2B
              间徘徊 [CV005, CV007, CV008]。在悲观情景中（概率 20%），高昂的厂房固定开支叠加合作 Biotech
              客户的项目管线流失挤压营业利润率，迫使公司开展结构化降估值融资或背负沉重的清算优先权堆叠，从而稀释普通股与早期老股股东权益 [CV002,
              CV007]。因此，投资评估框架给出保持纪律的「观察」评级与「高」风险评级，建议机构资产配置方在出手注资前，密切跟踪经核实的客户收入在手订单与里程碑现金转化情况 [CV001, CV002, CV007]。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
      - number: '8.4'
        title: 核心展项
        blocks:
          - type: callout
            title: 投资立场：估值审慎前提下的观察评级
            body: >-
              建议对 ElevateBio 维持「观察」立场。尽管公司将 Life Edit 基因编辑与获认证的 BaseCamp
              生产线进行差异化整合，构成了业内领先的基因药物基础设施，但因缺乏公开审计财务报表、厂房运营烧钱严重，加上一级市场老股存在流动性折价，按历史标杆估值买入老股并无吸引力。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
          - type: callout
            title: 二级市场流动性与信息摩擦
            body: UpMarket 和 EquityZen 等平台上针对合资格投资者的项目表明，Pre-IPO 投资流动性极度匮乏，起投门槛达 $50,000，且受制于公司优先购买权限制并面临本金全损的投机风险。
            calloutType: risk
            claimRefs:
              - CV002
              - CV007
