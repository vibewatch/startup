      - number: '8.2'
        title: 资本结构、融资历程与估值标记
        blocks:
          - type: paragraph
            body: >-
              自 2017 年成立以来，ElevateBio 历经 5 轮机构融资，累计吸纳约 $1.27B 股权与风险投资资金 [CV003, CV006]。融资进程在 2021 年显著提速：公司先是完成了由 Matrix
              Capital Management 与 SoftBank Vision Fund 2 联合领投的 $525M Series C 轮，随后于 2023 年 5 月敲定由 AyurMaya Capital
              Management Fund 领投的 $401M Series D 轮，Woodline、Lee Family Office 以及战略伙伴 Novo Nordisk 跟投 [CV001, CV003,
              CV004]。ElevateBio 在完成 Series D 轮时未公开披露投后股权估值，但市场参照系及前期交易推算其非公开估值标记超过 $2B [CV003, CV007]。UpMarket 与
              EquityZen 等合资格 Pre-IPO 老股交易平台为寻求流动性的早期员工等既有股东居间撮合交易，但两处渠道均执行严格的转让限制、公司优先购买权以及 $50,000 的最低认购门槛 [CV002,
              CV007]。UpMarket 等平台的模型整合了多方数据与第三方估算——指出其测算的 2026 年收入运行率约为 $105.7M——同时扣除了流动性折价与显著的一级市场信息不对称折价 [CV007]。鉴于
              ElevateBio 属于无需向 SEC 申报的私有公司，包括 CDMO 客户数、产能利用率以及管线毛利率在内的核心单元指标，均未经外部公开审计验证 [CV002, CV006, CV007]。
