evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Audited financial statements detailing post-Series-D equity valuation, annual biomanufacturing service revenue,
      contracted CDMO backlog, and net operational cash burn.
    whyItMatters: >-
      Without verifiable revenue figures or post-Series-D valuation disclosures, financial sustainability and operating
      efficiency cannot be quantitatively modeled.
    diligencePath: >-
      Review confidential private placement memorandums, secondary transaction pricing sheets, or request audited
      financial statements during formal management diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: executive-leadership
    missingEvidence: >-
      Detailed operational restructuring disclosures following the 2026 CEO transition from David Hallal to Chris
      Murphy.
    whyItMatters: >-
      Understanding executive reporting lines and operational reallocations is essential to assessing commercial
      execution risk at BaseCamp.
    diligencePath: Conduct executive reference calls and request organizational chart updates during commercial diligence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current, methodology-transparent estimate for outsourced advanced-therapy development and manufacturing spend,
      plus ElevateBio's eligible modalities, geographies, pricing, and facility-capacity constraints.
    whyItMatters: >-
      Without a bounded service-market denominator, the nearly $50 billion therapeutic-market forecast cannot establish
      ElevateBio's SAM or support valuation based on market share.
    diligencePath: >-
      Obtain an independent 2026 market study and reconcile its category definitions with management's service mix,
      pricing, geographic reach, and modality-level capacity.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: obtainable-market
    missingEvidence: >-
      Facility utilization, batch throughput, active backlog, contract values, win rates, renewal rates, and service
      revenue by modality and development stage.
    whyItMatters: >-
      Partner count alone does not reveal active demand, contracted economics, available capacity, or a defensible
      obtainable-market share.
    diligencePath: >-
      Review the customer-level backlog, capacity plan, historical proposals, executed contracts, revenue bridge, and
      renewal cohort in the management data room.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: stale
    severity: material
