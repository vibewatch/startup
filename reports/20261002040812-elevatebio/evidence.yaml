      near-term manufacturing demand.
    diligencePath: >-
      Obtain a current FDA primary-source dataset or publication using explicit product definitions and reconcile actual
      2025-2026 approvals with the prior forecast.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
