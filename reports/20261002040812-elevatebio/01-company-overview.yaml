callouts:
  - calloutType: "insight"
    title: "Hybrid Dual-Engine Architecture as a Competitive Moat"
    body: "By pairing an internal gene editing discovery technology suite (Life Edit) with dedicated commercial-scale viral vector and cell biomanufacturing facilities (BaseCamp), ElevateBio avoids the severe third-party manufacturing bottlenecks that routinely compromise clinical-stage cell and gene therapy developers."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
  - calloutType: "risk"
    title: "Capital Intensity, Valuation Oopacity, and Private Cash Runway"
    body: "Operating over 100,000 square feet of cGMP cleanrooms and advanced protein engineering suites requires massive continuous capital expenditure. Because ElevateBio remains privately held and has not released post-Series-D audited revenue run rates or valuation marks, assessing its financial runway and CDMO margin profile presents an ongoing diligence constraint."
    claimRefs:
      - "CO005"
      - "CO012"
      - "CO016"
