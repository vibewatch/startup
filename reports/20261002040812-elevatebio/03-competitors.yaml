callouts:
  - calloutType: "insight"
    title: "The Tech-Transfer Velocity Advantage"
    body: |
      ElevateBio's primary operational differentiator against traditional CDMO incumbents is technology transfer velocity. While industry-standard tech transfer for complex cell therapies typically averages 12 to 18 months, ElevateBio demonstrated four-month execution from kickoff to first GMP comparability runs for Kyverna's miv-cel autologous CAR-T program. Compressing tech transfer preserves clinical momentum for biopharma sponsors navigating competitive IND and BLA filing windows.
    claimRefs:
      - "CP002"
      - "CP003"
  - calloutType: "risk"
    title: "Operational Scheduling and Capacity Friction"
    body: |
      Operating a multi-tenant, multi-modality cGMP facility across cell therapy and viral vectors creates extreme operational complexity. With lean staffing and recent organizational restructuring, ElevateBio's capacity scheduling relies heavily on master production scheduling and S&OP coordination in SAP. Any slot scheduling conflict or batch turnaround delay directly threatens sponsor clinical timelines and exposes the company to fixed overhead drag across its capital-intensive facilities.
    claimRefs:
      - "CP010"
      - "CP011"
      - "CP014"
