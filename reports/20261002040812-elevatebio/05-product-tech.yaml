callouts:
  - calloutType: "strength"
    title: "Integrated Dual-Engine Architecture Eliminates Critical Industry Handoff Friction"
    body: "By housing proprietary Life Edit gene editing discovery alongside commercial-grade BaseCamp cGMP biomanufacturing under one corporate umbrella, ElevateBio solves the chronic fragmentation that delays advanced genetic therapies. Therapeutic programs transition seamlessly from candidate engineering to cGMP lot release without transferring programs between disjointed CROs and CDMOs [CE001, CE003, CE007]."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE007"
  - calloutType: "insight"
    title: "Comprehensive ICMC 9-System Certification Mitigates Client Regulatory Adoption Risk"
    body: "Achieving third-party ICMC certification administered by Dark Horse Consulting across viral, non-viral, and cell therapy modalities provides biopharma sponsors with independent verification of commercial readiness. The audit establishes that BaseCamp Waltham adheres to FDA CBER Chapter 45 and EU Directive standards, serving as a critical differentiator against uncertified regional CDMOs [CE006]."
    claimRefs:
      - "CE006"
  - calloutType: "risk"
    title: "Cleanroom Capacity Constraints and S&OP Scheduling Complexity"
    body: "Managing multi-modality cleanroom suites across viral vectors, non-viral LNPs, and autologous cell therapies requires rigorous SAP ERP scheduling and S&OP alignment. As strategic alliances with Novo Nordisk and Moderna expand alongside external CDMO clients, slot contention and technical transfer bottlenecks represent ongoing operational vulnerabilities prior to the 2027 launch of BaseCamp Pittsburgh [CE002, CE006, CE008]."
    claimRefs:
      - "CE002"
      - "CE006"
      - "CE008"
