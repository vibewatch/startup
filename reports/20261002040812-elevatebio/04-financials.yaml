      whyItMatters: Operating-quality metrics cannot be converted into gross-profit or sales-efficiency conclusions without these denominators.
      diligencePath: Obtain program and site P&Ls, batch-cost waterfalls, utilization reports, pipeline conversion, and customer acquisition spend.
