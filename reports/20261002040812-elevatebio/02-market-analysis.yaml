  - calloutType: risk
    title: Public Metrics Are Not a Revenue Funnel
    body: The nearly $50 billion forecast, pipeline count, approval count, annual approval expectation, and partner count use different units, periods, and denominators; none directly measures ElevateBio revenue, backlog, capacity, or obtainable share.
    claimRefs:
