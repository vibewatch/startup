    title: The Opportunity Is a Bottleneck-Capture Thesis
    body: ElevateBio can enter programs across discovery, process development, and manufacturing, but the available evidence supports workflow breadth and partner reach rather than a quantified share of therapeutic market value.
    claimRefs:
