  - id: TM003
    title: Segment and Buyer Map
    columns:
      - Segment
      - Buyer or user
      - Payer or budget evidence
      - Workflow
      - Adoption trigger
      - Evidence limitation
    rows:
      - - Independent therapeutic innovator
        - Sponsor developing a cell or gene therapy
        - Sponsor pays; specific function and budget line are not disclosed
        - Discovery through process development, clinical supply, and commercial manufacturing
        - Need to move a candidate into a scalable regulated process
        - No public pricing, sales-cycle, conversion, or retention evidence
      - - Academic or research-originated program
        - Scientific institution or team seeking commercialization support
        - Long-term partnership structure is reported, but payer allocation is not
        - Bridge academic R&D to commercialization and production-scale manufacturing
        - Program requires company formation, development, or manufacturing infrastructure
        - Assigned sources do not quantify current academic-program volume
      - - Portfolio startup
        - Founder-led company using centralized bench-to-bedside capabilities
        - Portfolio financing supports the company; service transfer pricing is not disclosed
        - Shared scientific, development, manufacturing, and commercialization support
        - Avoid duplicating specialized infrastructure at formation
        - Launch-era model is historical and current portfolio economics are unavailable
      - - Strategic biopharma partner
        - Established biopharma company collaborating on research or development
        - Partnership economics and budget ownership are not disclosed
        - Multi-program research, preclinical work, or manufacturing partnership
        - Access to integrated gene-editing and manufacturing capabilities
        - Partnership count is not equivalent to active customers or contracted backlog
      - - Internal ElevateBio pipeline
        - ElevateBio scientists and development teams
        - Company-funded rather than third-party customer spend
        - Use the same discovery, data, process, and manufacturing platform for owned programs
        - Internal portfolio prioritization
        - Must be excluded from third-party service TAM unless transfer economics are disclosed
    notes: "Buyer and payer fields distinguish reported organizational segments from unverified job-title assumptions; no public pricing, contract-size, procurement-cycle, or budget-owner data were available in the assigned pool."
