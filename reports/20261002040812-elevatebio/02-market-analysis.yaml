      - CM007
      - CM008
      - CM009
      - CM010
tables:
  - id: TM001
    title: ElevateBio Market Definition
    columns:
      - Segment or category
      - Included spend
      - Excluded spend or substitute
      - Buyer or payer evidence
      - Relevance
    rows:
      - - Gene-editing discovery and optimization
        - Target identification, candidate engineering, proof of concept, and clinical-lead optimization
        - Unrelated discovery platforms and downstream clinical operations
        - Therapeutic innovators; named payer and budget owner are not disclosed
        - Earliest supported point of entry into a partner program
      - - Process and analytical development
        - Process development, optimization, characterization, verification, assays, and rapid analytics
        - General-purpose research services outside advanced therapies
        - External program sponsor; contracting unit is not disclosed
        - Converts a candidate into a process intended for clinical and commercial scale
      - - Technology transfer and clinical supply
        - Program transfer, preclinical and Phase 1 manufacturing, lot release, and program-stage support
        - Patient recruitment, trial-site operations, and bedside administration
        - Cell or gene therapy sponsor; internal-build and separate-vendor models are substitutes
        - Connects development work to regulated manufacturing execution
      - - Late-stage and commercial manufacturing
        - Pivotal and commercial-scale manufacturing, PPQ, inspection readiness, and BLA support
        - Product reimbursement, distribution, and non-advanced-therapy manufacturing
        - Sponsor organization; exact procurement and budget authority are not public
        - Highest-complexity portion of the stated end-to-end service scope
      - - Internal therapeutic development
        - ElevateBio-funded development of its own cellular and genetic medicines
        - Third-party service revenue and addressable customer spend
        - ElevateBio is the capital provider rather than an external buyer
        - Adjacent activity that can reuse the platform but should not be counted as CDMO TAM
    notes: "Scope is derived from company service descriptions and third-party descriptions of the dual internal/partner model; exclusions and buyer limitations prevent all therapeutic value from being counted as addressable service spend."
