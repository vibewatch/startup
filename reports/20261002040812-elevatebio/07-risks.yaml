callouts:
  - calloutType: "risk"
    title: "Do not confuse financing history with liquidity"
    body: "The assigned evidence reports substantial capital raised, but it does not disclose current cash, burn, debt, committed capex, backlog, or runway. Financing risk therefore remains high until management provides a current liquidity bridge and downside plan."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
  - calloutType: "insight"
    title: "Certification is a mitigation, not a clean bill of health"
    body: "The announced ICMC assessment is meaningful evidence of manufacturing-system review, including on-site work, but it should be tested against regulator inspection records, deviations, lot-release results, recalls, and partner audits."
    claimRefs:
