  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "legal and regulatory status"
      missingEvidence: "Official regulator, court, patent-office, and inspection records covering licenses, Form 483 observations, enforcement, litigation, recalls, and material IP disputes."
      whyItMatters: "The company-issued policy and certification announcement cannot establish the absence of legal, regulatory, inspection, or IP events."
      diligencePath: "Obtain jurisdiction and legal-entity lists, search official regulator and court systems, and review inspection correspondence, litigation schedules, and freedom-to-operate opinions."
      relatedQuestionRefs:
        - "QR001"
      relatedTableRefs:
        - "TR001"
    - type: "private-evidence-only"
      severity: "material"
      topic: "operational performance"
      missingEvidence: "Facility-level deviations, contamination and batch-failure rates, recalls, yields, on-time release, utilization, outages, security incidents, and recovery tests."
      whyItMatters: "Control descriptions and certification scope do not quantify realized quality, reliability, or security outcomes."
      diligencePath: "Request three years of quality, reliability, security, and business-continuity KPIs reconciled to partner audits and management review records."
      relatedTableRefs:
        - "TR002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "liquidity"
      missingEvidence: "Current cash, restricted cash, debt, monthly burn, committed capex, revenue, gross margin, backlog, and downside runway."
      whyItMatters: "Historical funding raised cannot establish current liquidity or the ability to finance facility and platform execution."
      diligencePath: "Review audited statements, latest management accounts, 24-month cash bridge, debt documents, capex commitments, and downside financing scenarios."
      relatedTableRefs:
        - "TR003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "partner concentration"
      missingEvidence: "Revenue and backlog by customer, renewal and termination terms, reserved-capacity commitments, supplier concentration, and program-level attrition."
      whyItMatters: "The public business-model evidence establishes partner dependence but provides no denominator for concentration or durability."
      diligencePath: "Review top-customer and supplier schedules, executed contracts, renewal cohorts, cancellation history, and capacity reservations."
      relatedTableRefs:
        - "TR003"
