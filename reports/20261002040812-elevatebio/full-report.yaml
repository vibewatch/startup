              - CU009
          - type: callout
            title: Client Concentration and Private Disclosure Opacity
            body: >-
              ElevateBio maintains significant revenue exposure to a handful of marquee partners. The lack of public
              reporting on active client accounts, Net Revenue Retention (NRR), and CDMO backlog makes customer
              retention durability difficult to verify independently.
            calloutType: risk
