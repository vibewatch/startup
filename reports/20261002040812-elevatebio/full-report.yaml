  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and Service Definition Across Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              ElevateBio delivers an integrated advanced therapy platform designed to support biopharmaceutical
              innovators across the complete therapeutic development lifecycle from discovery through commercialization
              [CE001, CE003, CE007]. Traditional development pathways in cell and gene therapy (CGT) suffer from severe
              fragmentation, forcing therapeutic sponsors to navigate multiple hand-offs between discovery boutiques,
              analytical testing labs, academic research vectors, and separate contract manufacturing facilities [CE001,
              CE002, CE007]. ElevateBio eliminates these hand-off frictions by providing a unified workflow encompassing
              target identification, gene editing candidate optimization, process development, analytical assay
              validation, clinical supply, and commercial-scale cGMP manufacturing under a single institutional roof
              [CE001, CE003, CE007]. Biopharma sponsors engage ElevateBio's platform at distinct inflection points:
              early-stage innovators access novel CRISPR and base editing systems to design and validate lead
              candidates, while clinical sponsors utilize BaseCamp's process verification, cleanroom slot allocations,
              and lot release testing to advance programs through Investigational New Drug (IND) and Biologics License
              Application (BLA) filings [CE001, CE003, CE005, CE007].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
