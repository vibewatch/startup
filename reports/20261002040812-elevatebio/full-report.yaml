      - Current Technical Limitation
    rows:
      - - Target Identification & Gene Editing Design
        - Fragmented IP licensing; constrained PAM targeting using legacy Cas9; off-target edits
        - Life Edit proprietary RGN, base editor, and reverse transcriptase editor suite
        - Unrestricted genomic targeting flexibility via diverse novel PAM sequences
        - Long-term in vivo durability and off-target RNA edit characterization in clinical trials
      - - Primary T-Cell Isolation for CAR-T
        - Open leukapheresis processing and manual Ficoll gradient separation causing cell loss
        - Closed-system cell fractionation filtration (5–9 µm pore filters) from whole blood
        - Up to 80% CD3+ T-cell recovery (2-fold improvement over Ficoll) and platelet depletion
        - Sensitivity of filter capture efficiency to donor whole blood rheology and hematocrit
      - - Non-Viral Transfection of Primary Cells
        - High cell mortality during electroporation or poor delivery efficiency using early LNPs
        - Comparative optimization of tailored electroporation protocols and engineered LNPs
        - Balanced protocol delivering high editing rates with superior viability and expansion
        - High reagent costs for custom GMP lipid formulations at commercial patient scale
      - - Viral Vector Scale-Up & Production
        - Low titers and unscalable adherent culture systems with frequent batch failures
        - LentiPeak scalable suspension lentiviral vector platform with verified scale-down models
        - High clinical capacity per batch with predictable scale-up parameters for BLA readiness
        - Raw material supply chain dependencies for GMP-grade plasmids and transfection reagents
      - - Analytical Characterization & Lot Release
        - Protracted release timelines (6–8 weeks) at external contract testing laboratories
        - Integrated in-house NGS, rapid analytics, and custom potency assay suites at BaseCamp
        - Accelerated lot release testing eliminating inter-organization shipping and QA delays
        - Requirement for product-specific assay qualification across diverse partner constructs
