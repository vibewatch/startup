      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Evolution
        blocks:
          - type: paragraph
            body: >-
              ElevateBio was co-founded by biopharma executives David Hallal, Mitchell Finer, Ph.D., and Vikas Sinha,
              following incubation within life-sciences investment firm MPM Capital. The founding leadership team drew
              on decades of prior executive experience building commercial biopharmaceutical entities, including Alexion
              Pharmaceuticals and bluebird bio. Governance oversight was initially established with MPM Capital
              co-founder Ansbert Gadicke and F2 Ventures managing partner Morana Jovan-Embiricos on the Board of
              Directors, accompanied by EcoR1 Capital founder Oleg Nodelman as a board observer. Executive leadership
              has since evolved to meet industrial biomanufacturing demands: Chris Murphy serves as Chief Executive
              Officer and board member, bringing over 35 years of biopharmaceutical operations and commercial
              experience, while co-founder David Hallal transitioned to Executive Chairman. The company also expanded
              its regulatory and operational bench by appointing Heidi L. Wagner, J.D., as Global Head of Government
              Affairs and adding Khalil Barrage of The Invus Group to the board.
