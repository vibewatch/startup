  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Ranking and Investment Implication
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is execution rather than a verified legal incident. ElevateBio combines
              internal therapy development with services for external partners, while its public site describes coverage
              from discovery through commercial cGMP manufacturing. That breadth creates correlated scientific, quality,
              scheduling, customer, and capital demands across one operating model. Independent reporting confirms
              substantial historical financing and describes cell and gene therapy as capital intensive, but funding
              raised is not cash available and the assigned evidence does not disclose burn, runway, backlog,
              utilization, or margins. The investment case should therefore remain conditional on customer-backed
              capacity demand, adequate liquidity, and successful facility delivery rather than on cumulative financing
              alone. Monitor signed backlog, repeat bookings, lot-release performance, cash runway, and Pittsburgh
              commissioning. Thesis-break triggers are an adverse regulatory inspection, a material quality or data
              incident, repeated facility delay, or financing on terms that impair platform ownership.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
