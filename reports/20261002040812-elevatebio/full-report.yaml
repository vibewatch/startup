      - number: '2.2'
        title: Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >
              The assigned evidence provides one broad value forecast: CNBC reported in 2024 that the FDA predicted the
              gene therapy market would reach nearly $50 billion by 2027. The same article reported only 36 FDA-approved
              therapies for public use out of about 500 in the pipeline and relayed an FDA expectation of 10 to 20
              approvals per year by 2025. These are different measures with different denominators and cannot be
              combined into a conversion funnel. The 2025 approval forecast is also past its stated horizon as of this
              report's 2026 run date and needs an updated regulatory source before it can anchor a current forecast. No
              assigned source isolates outsourced advanced-therapy CDMO spend, ElevateBio-eligible spend, facility
              capacity, backlog, revenue, or attainable share. Accordingly, this chapter treats TAM/SAM/SOM as an open
              diligence problem rather than deriving false precision from the broad market number.
