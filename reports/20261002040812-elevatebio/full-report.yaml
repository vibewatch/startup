chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Hybrid Operating Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2019 in Cambridge, Massachusetts, ElevateBio operates from headquarters and extensive cGMP
              manufacturing facilities located in Waltham, Massachusetts. The company addresses the structural
              bottleneck in advanced genomic medicine by bridging academic and clinical discovery with industrial-scale
              biomanufacturing. Rather than operating purely as a traditional contract development and manufacturing
              organization (CDMO) or strictly as a standalone therapeutics biotech, ElevateBio deploys an integrated
              hybrid model. This structure unites proprietary gene editing technologies through its Life Edit business
              unit with centralized process development and current Good Manufacturing Practice (cGMP) infrastructure
              through its BaseCamp subsidiary. The dual-engine architecture allows ElevateBio to co-develop internal
              therapeutic pipelines while providing strategic biopharma partners and spin-outs with complete
              bench-to-bedside capabilities across cell therapies, viral vectors, and mRNA medicines.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
