        title: Exhibits
        blocks:
          - type: callout
            title: Tier-One Pharma Validation and Multi-Modality Manufacturing Certification
            body: >-
              Multi-billion-dollar R&D alliances with Novo Nordisk and Moderna validate Life Edit's gene editing
              precision, while Dark Horse Consulting's ICMC certification confirms BaseCamp Waltham's readiness for
              commercial-grade advanced therapy manufacturing.
            calloutType: strength
            claimRefs:
              - CU002
