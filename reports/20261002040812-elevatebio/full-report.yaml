      - number: '1.3'
        title: Capitalization Trajectory, Valuation Stance, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              ElevateBio has amassed substantial capitalization across four major funding rounds, totaling between $1.27
              billion and $1.3 billion in cumulative capital raised. The company launched operations in May 2019 with a
              $150 million Series A financing co-led by the UBS Oncology Impact Fund (managed by MPM Capital) and F2
              Ventures, joined by EcoR1 Capital, Redmile Group, and Samsara BioCapital. Subsequent capital expansions
              included a $170 million Series B and a massive $525 million Series C round closed in March 2021 led by
              Matrix Capital Management, with participation from SoftBank Vision Fund 2 and Fidelity Management &
              Research Company. In May 2023, ElevateBio secured a $401 million Series D financing led by the AyurMaya
              Capital Management Fund (Matrix Capital Management), which integrated Novo Nordisk as an anchor strategic
              partner alongside a $1.9 billion multi-target CRISPR development pact. While earlier funding cycles
              supported a private peak post-money valuation benchmark around $2.25 billion in 2022, post-Series-D
              private valuations have remained undisclosed amidst macroeconomic biotech multiples compression, leaving
              precise current valuation and ongoing commercial burn rates as open diligence gaps.
