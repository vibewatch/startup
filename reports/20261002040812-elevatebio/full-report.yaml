  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >
              ElevateBio's relevant market is narrower than all cell and gene therapy spending. Its official service
              surface runs from gene-editing discovery and candidate optimization through process development,
              technology transfer, analytics, clinical supply, commercial cGMP manufacturing, and regulatory support.
              The company also develops internal therapies, so internal portfolio investment is adjacent to, but not the
              same as, third-party CDMO revenue. BaseCamp's stated modality coverage includes autologous, allogeneic,
              and regenerative cell products plus viral-vector manufacturing. The practical market boundary therefore
              includes outsourced advanced-therapy development and manufacturing work that the company can perform,
              while excluding clinical trial operations, patient care, reimbursement, conventional small-molecule
              manufacturing, and sponsor spending retained inside facilities that do not use ElevateBio. The status quo
              is fragmented specialist vendors or an internal build, not an automatically addressable pool of all
              therapeutic value.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
