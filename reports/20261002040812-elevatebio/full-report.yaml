      - number: '6.3'
        title: Named Customer Proof, Strategic Alliances, and Clinical Outcomes
        blocks:
          - type: paragraph
            body: >
              ElevateBio's commercial viability is heavily substantiated by high-profile corporate partnerships and
              clinical-stage collaborations. Its $1.9 billion partnership and profit-sharing pact with Novo Nordisk
              represents its largest disclosed enterprise deployment, focusing on Life Edit's base editing platforms to
              correct disease mutations. In addition, Moderna funds preclinical research and clinical lead optimization
              for in vivo mRNA gene editing programs, providing research payments and royalty streams upon technical
              milestone attainment.


              In the clinical cell therapy sector, ElevateBio has supported publicly traded newcomers like Kyverna
              Therapeutics, providing process engineering and manufacturing execution. Earlier strategic ventures
              include AlloVir, launched around allogeneic T-cell therapies licensed from Baylor College of Medicine, and
              oncology programs developed with Fred Hutchinson Cancer Center.


              However, customer adoption in cell and gene therapy remains exposed to broader biopharma market
              volatility. In financing environments where capital availability tightens, peer startups have curtailed
              external R&D expenditures and trimmed clinical pipelines. For ElevateBio, high revenue concentration in a
              small cadre of headline pharmaceutical partners poses strategic exposure should lead clinical candidates
              encounter development halts or partner reprioritization.
            claimRefs:
              - CU002
              - CU003
              - CU011
              - CU012
              - CU013
              - CU014
