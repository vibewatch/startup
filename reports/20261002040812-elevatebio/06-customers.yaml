chapter:
  number: 6
  title: "Customers"
  summary: "ElevateBio powers cell and gene therapy developers through an integrated CDMO and genetic medicine platform combining proprietary Life Edit CRISPR discovery with BaseCamp cGMP process development and biomanufacturing. Its customer base spans mega-cap pharmaceutical collaborators such as Novo Nordisk, commercial-stage mRNA leaders like Moderna, clinical biopharmas including Kyverna, and academic medical institutions. While customer concentration in multi-year strategic alliances provides substantial capital and pipeline validation, lack of disclosed customer counts, ARR, and net retention introduces durability risks in a cautious biotech funding environment."
sections:
  - id: "customer-segmentation-and-commercial-model"
    title: "Customer Segmentation and Commercial Operating Model"
    body: |
      ElevateBio's customer architecture bridges academic discovery, emerging biotech commercialization, and global biopharma pipeline scaling. The company delivers end-to-end genetic medicine capabilities through its BaseCamp cGMP manufacturing facilities in Waltham and Pittsburgh alongside Life Edit gene editing technologies. Rather than operating purely as a fee-for-service contract manufacturer or an isolated therapeutic developer, ElevateBio deploys a hybrid commercial model serving distinct client archetypes.

      The primary tier comprises global pharmaceutical enterprises seeking validated gene editing engines and scalable viral and non-viral delivery platforms. Strategic partners such as Novo Nordisk engage ElevateBio's Life Edit subsidiary to develop base editing therapies across cardiometabolic and rare disease targets, pairing upfront research funding with long-term commercialization milestones and profit-sharing rights. Similarly, mRNA pioneer Moderna utilizes Life Edit's novel RNA-guided nucleases for in vivo gene editing programs.

      The secondary segment consists of clinical-stage biopharmaceutical innovators and portfolio spin-outs, including Kyverna Therapeutics and AlloVir. These entities rely on ElevateBio BaseCamp for end-to-end viral vector design, analytical development, and clinical batch manufacturing. Academic medical centers like Massachusetts General Hospital and Baylor College of Medicine form a specialized discovery tier, licensing academic IP into ElevateBio's infrastructure to advance novel cell therapies toward investigational new drug applications.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-manufacturing-throughput"
    title: "Adoption Trajectory, Throughput Metrics, and Infrastructure Utilization"
    body: |
      Evaluating ElevateBio's customer traction requires analyzing operating throughput, facility scalability, and partner program expansion. ElevateBio reports serving over 20 biopharmaceutical company partnerships, though individual client account identities, recurring service billings, and annual contract values remain closely held private disclosures. Available production data demonstrates substantial capacity scaling across its core analytic and digital validation infrastructure.

      Within its Waltham BaseCamp facility, ElevateBio integrated Benchling enterprise lab informatics and automated sequencing instruments, enabling its next-generation sequencing core to increase throughput from hundreds of samples per week to a peak operational capacity of 7,000 samples weekly. To support multi-client biomanufacturing onboarding, ElevateBio implemented Kneat paperless validation software, reducing protocol review cycle times by 50% and streamlining client qualification workflows into rapid 15-minute setup configurations.

      Quality and regulatory readiness serve as critical adoption catalysts for advanced therapy developers. In August 2025, BaseCamp Waltham achieved comprehensive ICMC commercial-level certification across viral gene delivery, non-viral delivery, and cell therapy modalities following independent audit by Dark Horse Consulting. This commercial certification across nine operational systems reduces technical risk for therapeutic sponsors progressing toward Biologics License Applications.
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "customer-proof-and-enterprise-partnerships"
    title: "Named Customer Proof, Strategic Alliances, and Clinical Outcomes"
    body: |
      ElevateBio's commercial viability is heavily substantiated by high-profile corporate partnerships and clinical-stage collaborations. Its $1.9 billion partnership and profit-sharing pact with Novo Nordisk represents its largest disclosed enterprise deployment, focusing on Life Edit's base editing platforms to correct disease mutations. In addition, Moderna funds preclinical research and clinical lead optimization for in vivo mRNA gene editing programs, providing research payments and royalty streams upon technical milestone attainment.

      In the clinical cell therapy sector, ElevateBio has supported publicly traded newcomers like Kyverna Therapeutics, providing process engineering and manufacturing execution. Earlier strategic ventures include AlloVir, launched around allogeneic T-cell therapies licensed from Baylor College of Medicine, and oncology programs developed with Fred Hutchinson Cancer Center.

      However, customer adoption in cell and gene therapy remains exposed to broader biopharma market volatility. In financing environments where capital availability tightens, peer startups have curtailed external R&D expenditures and trimmed clinical pipelines. For ElevateBio, high revenue concentration in a small cadre of headline pharmaceutical partners poses strategic exposure should lead clinical candidates encounter development halts or partner reprioritization.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU003"
