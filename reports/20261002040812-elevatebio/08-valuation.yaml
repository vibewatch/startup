callouts:
  - calloutType: "recommendation"
    title: "Investment Stance: Track with Valuation Discipline"
    body: "We recommend maintaining a 'track' stance on ElevateBio. While the company's differentiated technology integration across Life Edit gene editing and certified BaseCamp manufacturing represents best-in-class genetic medicine infrastructure, the lack of publicly audited financial statements, substantial facility operating burn, and private secondary liquidity discounts make secondary share accumulation at historical headline marks unattractive."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV007"
      - "CV008"
  - calloutType: "risk"
    title: "Secondary Market Liquidity and Information Friction"
    body: "Accredited investor offerings on platforms like UpMarket and EquityZen illustrate that pre-IPO investments remain highly illiquid, carry $50,000 minimum commitments, and are subject to company right-of-first-refusal restrictions and speculative risk of total loss."
    claimRefs:
      - "CV002"
      - "CV007"
