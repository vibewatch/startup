            - Direct mutual fund investments
            - Exchange-traded funds (ETFs) and IPO subscriptions
          friction: Competing offerings from established wealth managers
        - label: Protection & Insurance Adoption
          stage: Protection & Insurance Adoption
          persona: Urban Household Head
          touchpoints:
            - GIBL direct consumer portal
            - Hybrid advisory-assisted distribution
          friction: Historical mis-selling stigma and complex policy terms
    approximationNotes: >-
