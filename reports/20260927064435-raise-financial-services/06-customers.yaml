callouts:
  - calloutType: insight
    title: Strategic Positioning of Dhan Among Active Urban Traders
    body: >-
      Raise Financial Services deliberately bypassed mass-market, capital-intensive financial inclusion initiatives to
      focus exclusively on tech-literate retail traders in India’s top metropolitan and Tier 1/2 centers. By catering to
      high-frequency options and equity traders who value speed and reliability over basic access, Dhan achieved rapid
      commercial scale, growing to nearly 950,000 active users by late 2025.
    claimRefs:
      - CU001
      - CU002
      - CU006
  - calloutType: risk
    title: Derivatives Concentration and Regulatory Vulnerability
    body: >-
      While focusing on active options and futures traders powers robust brokerage monetization, it creates significant
      customer concentration risk. As SEBI tightens retail derivatives trading guidelines and margin norms, Dhan faces
      the dual challenge of diversifying active accounts into long-term wealth products and insurance while managing
      cohort durability in an evolving regulatory climate.
    claimRefs:
      - CU012
      - CU014
      - CU015
