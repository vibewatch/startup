          stage: 认知探索与投教启蒙
          persona: Aspiring Urban Investor
          touchpoints:
            - Upsurge 金融投教课程
            - Filter Coffee 每日市场资讯早报
          friction: Initial skepticism of retail market volatility
        - label: 低摩擦开户
          stage: 低摩擦开户
          persona: Mobile-First Trader
          touchpoints:
