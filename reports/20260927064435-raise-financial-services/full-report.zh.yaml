  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与印度零售经纪行业格局
        blocks:
          - type: paragraph
            body: >-
              印度零售金融服务正从传统股票现货经纪，扩展到高频衍生品交易、杠杆融资和财富科技等相邻领域。主流折扣券商虽免收现货股票佣金以吸引客户，收入仍主要依赖活跃的股指期货与期权（F&O）交易，以及融资利息。Raise
              Financial Services 于 2021 年进入这一市场，收购孟买券商 Moneylicious Securities，绕过长达 18 个月的牌照审批，取得 BSE、NSE 和 MCX
              多家交易所的交易会员资格。Raise 没有大规模铺开大众共同基金分销，而是先聚焦活跃散户交易者；每笔衍生品和日内交易收取 ₹20 固定佣金，并提供保证金交易融资（MTF）。此后，公司收购 GreenLife
              Insurance Broking（GIBL）进入数字保险分销，扩大了金融产品范围。
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM010
              - CM013
              - CM014
      - number: '2.2'
        title: 目标市场规模测算：TAM、SAM 与 SOM 视角
        blocks:
          - type: paragraph
            body: >-
              评估 Raise Financial 的增长潜力，不能只看零售经纪业的总体规模，还要单独看高价值衍生品利润池。行业风投研报预计，随着数字化普及、Demat
              账户渗透率提高，印度零售股票经纪市场的年度毛佣金收入（TAM）约为 $4.5B，年增速约 20% 。其中，活跃衍生品交易者和保证金交易融资（MTF）用户对应的可服务市场（SAM）为
              $1.2B。这个细分市场的收入贡献极不均衡：活跃零售期权期货（F&O）交易者只占印度注册 Demat 账户的 5% 至 8%，却贡献全行业 80%
              以上的经纪收入。假设能持续从量化和程序化零售交易者中争取份额，Dhan 未来 5 年的可获取市场（SOM）预计为 $250M。放眼更广阔的生态，印度财富管理平台技术市场规模预计将从 2021 年的 $3.67B
              增至 2027 年的 $8.15B，复合年增长率为 14.56%，为 Raise 拓展相邻资产类别提供了充足的增长空间。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
      - number: '2.3'
        title: 买方画像分层与工作流驱动的采用
        blocks:
          - type: paragraph
            body: >-
              印度零售投资者在交易行为、客户终身价值和留存表现上差异明显。传统互联网券商通常优先服务新手散户和定投（SIP）共同基金买家，因此单用户平均收入（ARPU）偏低，也容易受市场周期影响。Raise Financial
              则聚焦经验丰富的活跃交易者、程序化期权交易员和量化交易者。这些用户在传统券商常遇到明显摩擦：市场剧烈波动时系统宕机、API 限流、下单卡顿和滑点。估计传统平台因此每年给散户造成的损失合计超过 ₹500
              crore。Dhan 针对这些痛点，支持直接在 TradingView 图表下单，提供期权链收益分析，并免费开放 Webhook 自动化提醒。Raise 目前服务近 950,000
              名活跃用户。深度嵌入专业交易流程也提高了迁移成本：量化交易者换平台时，往往要重新调试并改写自动交易策略。
            claimRefs:
              - CM007
              - CM009
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: 增长催化剂、底层壁垒与监管逆风
        blocks:
          - type: paragraph
            body: >-
              Dhan 的扩张既受益于结构性机会，也受监管约束。Raise 在 AWS 上自研 DEXT（Dhan Exchange Trading System）；95% 的订单处理时间低于 20 至 25
              毫秒，相比行业常见的 120 毫秒延迟，约快六倍。这一性能有助于留住活跃交易者；Raise 完成 $120M B 轮融资后，早期投资机构 3one4 Capital 也部分退出，IRR 达 65%
              。与此同时，MTF
              业务扩大可带来资本效率较高的浮存金收入，缓冲经纪业务的周期波动。监管压力则在加大：印度证券交易委员会（SEBI）逐步提高股指期权保证金门槛，并限制散户投机。衍生品交易贡献了绝大部分经纪佣金，因此，限制合约交易量是
              Dhan 收入增长面临的首要宏观风险。
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: 印度零售经纪市场的利润池不对称性
            body: >-
              在印度零售金融市场，单看用户数容易被误导：活跃期权期货交易者占零售 Demat 账户不足 8%，却贡献了 80% 以上的经纪毛收入。Raise Financial
              聚焦高频衍生品交易者，瞄准这一赛道的核心利润池，也避开了大众共同基金平台获客成本高、变现能力弱的模式。
            calloutType: insight
            claimRefs:
              - CM003
              - CM007
              - CM010
          - type: callout
            title: SEBI 收紧衍生品监管政策带来的逆风
            body: >-
              Dhan 核心市场面临的首要结构性制约是 SEBI 监管干预。多轮旨在遏制散户衍生品投机的收紧措施，包括提高保证金要求、限制合约灵活度，都会直接影响交易频次。Raise Financial
              转向保证金交易融资（MTF）和保险科技分销，有助于降低对衍生品交易量的单一依赖。
            calloutType: risk
            claimRefs:
              - CM004
              - CM010
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同行对标
        blocks:
          - type: paragraph
            body: >-
              印度数字证券经纪与财富管理行业呈现高度集中态势，Zerodha、Groww 和 Upstox 等头部互联网券商牢固把持市场。Raise Financial Services 于 2021 年推出 Dhan
              切入该赛道，明确锁定成熟零售投资者与高频交易群体，而非一味争夺大众被动储蓄客群。根据商业模式契合度与受众重叠度，Caplight 的私募市场对标数据将 INDmoney、Upstox 与 Groww
              列为其最接近的对标同行。Raise 完成 1.2 亿美元 B 轮融资并取得 12 亿美元估值里程碑，印证了投资机构对其差异化产品定位的认可。早期业务进展显示，Dhan 上线数月内便直接吸引了超 100,000
              名从传统券商及互联网同行迁移而来的用户，展现出活跃交易者可观的跨平台意愿。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 底层交易设施与工具链差异化
        blocks:
          - type: paragraph
            body: >-
              在零售交易赛道，竞争差异主要体现在订单执行可靠性、低延迟能力和专业图表工具上。Raise Financial Services 不再单靠标准第三方交易所网关中间件，而是在 AWS 云基础设施上自研了专属撮合引擎
              DEXT，旨在实现 95% 的订单在 25 毫秒以内完成处理。这种对执行速度的专注，切中高频衍生品交易者在行情高峰期遭遇滑点与系统卡顿的核心痛点。此外，Dhan 于 2021 年 8 月战略收购在 SEBI
              注册的券商 Moneylicious Securities，一举打通合规准入并锁定 BSE、NSE 及 MCX 的全牌照交易会员资格。为强化自研撮合引擎，Dhan 与 TradingView
              达成合作，支持股票、期货与外汇期权在图表界面直接下单，在交互体验上与基础大众券商拉开了明显差距。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP011
      - number: '3.3'
        title: 定价模型、成本结构与券商单客经济效益
        blocks:
          - type: paragraph
            body: >-
              印度互联网证券经纪普遍采取低价策略：股票现货交割免佣或收取极低费用，而股票日内交易与期权期货交易每笔执行订单收取上限为 ₹20 的固定佣金。Raise Financial Services 旗下 Dhan
              沿用了这一行业通用费率，同时通过 Upsurge 财商教育订阅、自研投研工具及企业级 API 接口拓展多元变现。集团合并报表口径 FY25 营收规模达 ₹900 crore，且在 FY24 即已实现盈利；然而
