        - 经审计财报追溯重述，或新收费规则下经营现金流承压收缩
      - - 监管面反论
        - SEBI 全面收紧衍生品与期权交易规则，直接冲击支撑券商变现的高频散户交易量
        - 监管强制要求提高保证金比例并限制投机性交易产品
        - 顺畅拓展至收费型财富管理、公募基金及直销保险分销业务
      - - 估值与治理反论
        - $1.2B 独角兽估值缺乏公开市场价格发现机制，且早期投资者已借老股转让部分套现
        - Beenext、3one4 Capital 与 Mirae Asset 在 Series B 轮中出让部分股权
        - 内部人仅以增量新股形式大额追加投资，或获批披露的 DRHP 显示出强劲的机构基石认购需求
    notes: 评估 Raise Financial Services 的核心多头驱动力，对比结构性监管风险与估值风险。
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV009
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 前提假设
      - 估值与回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观情景
        - 合并报表确认 ₹900 Cr 营收；Dhan 跻身券商前三；保险与财富管理交叉销售提速；按 15x 估值倍数成功 IPO
        - $2.5B - $3.0B 企业价值（较 Series B 轮估值获得 2.0x - 2.5x 回报）
        - 监管阴霾压制衍生品交易量增长；金融科技行业获客成本走高
        - 25%（需要近乎完美的执行力与友善的监管环境）
      - - 基准情景
        - 营收同比稳健增长 25-30%；衍生品交易量在 SEBI 新规下回归常态；财富产品贡献适度佣金；按 8-10x 估值倍数通过本土 IPO 或战略并购退出
        - $1.2B - $1.5B 企业价值（1.0x - 1.25x 回报，偏重资本保全）
        - 未上市金融科技老股转让倍数承压回落；公开上市等待期拉长
        - 50%（兼顾当前交易规模与监管调整冲击）
      - - 悲观情景
        - SEBI 衍生品限制侵蚀大交易量客户的利润空间；法定报表营收体现较低基数；早期投资者持续抛售老股；面临降估值融资或平价延期
        - $600M - $800M 企业价值（较 Series B 轮估值出现 33% 至 50% 的下行折价）
        - 经营现金流转负；零佣金老牌券商发起激烈价格战
        - 25%（活跃交易者流失率激增或合规成本飙升时触发）
    notes: 情景分析模型基于 2025 年 10 月 Series B 轮基准，设定 3 年持有期。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV010
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Raise Financial Services 在 2021 至 2026 年间经历的关键战略、融资、产品与监管里程碑。
    approximationNotes: 里程碑日期根据官方公告与媒体报道梳理；早期产品上线时间精确至月份。
    data:
      items:
        - date: 2021-01
          label: 公司创立
          detail: Pravin Jadhav 在孟买创立 Raise Financial Services，旨在搭建数字财富管理基础设施。
          tone: neutral
        - date: 2021-02
          label: 种子轮融资
          detail: 完成由 Mirae Asset Venture Investments 领投、多位知名创始人跟投的未披露金额种子轮融资。
          tone: positive
        - date: 2021-08
          label: 收购 Moneylicious
          detail: 收购在 SEBI 注册的证券经纪商 Moneylicious Securities，获取 BSE、NSE 及 MCX 交易牌照。
          tone: positive
        - date: 2021-11
          label: 旗舰产品 Dhan 上线
          detail: 推出股票交易平台 Dhan，聚焦高频交易者与资深个人投资者。
          tone: positive
        - date: 2022-01
          label: Series A 轮融资
          detail: 完成由 BEENEXT 和 Mirae Asset 领投的 $22M Series A 轮融资，其中 $15M 专项用于 Dhan 的业务扩张。
          tone: positive
        - date: 2025-10
          label: Series B 轮独角兽融资
          detail: 完成由 Hornbill Capital 与 MUFG 领投的 $120M Series B 轮融资，投后估值达 $1.2B。
          tone: positive
        - date: 2026-05
          label: 收购保险经纪 GIBL
          detail: 收购 GreenLife Insurance Broking (GIBL)，并制定 $15M 投资规划进军直销保险业务。
          tone: positive
        - date: 2026-06
          label: '''millions'' App 上线'
          detail: 面向 Z 世代与初次入市散户推出独立投资应用。
          tone: neutral
