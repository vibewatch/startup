        - label: 高 LTV 程序化与专业交易者客群 ($500M)
          description: 核心高频量化交易者及复杂的组合期权交易专家。
        - label: 未来 5 年切实可获取 SOM ($250M)
          description: Dhan 凭借产品力驱动市场份额扩张预计可捕获的年度营收规模。
