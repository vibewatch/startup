      - number: '1.4'
        title: 战略里程碑、执行表现与经营风险
        blocks:
          - type: paragraph
            body: >-
              Raise Financial Services 通过快速并购和持续迭代产品，绕过传统金融牌照漫长的申请周期。公司于 2021 年初成立，同年 8 月收购在 SEBI 注册的券商 Moneylicious
              Securities，迅速取得同年晚些时候推出 Dhan 所需的交易所会员资格与清算牌照。2026 年 5 月，Raise 完成第二起重大并购，以未披露金额收购 GreenLife Insurance
              Broking Private Limited（GIBL），并承诺追加 $15m 后续投资，着手搭建直面消费者的数字保险分销网络。2026 年 6 月，公司面向零售投资新手推出
              millions，进一步推进产品多元化。尽管扩张迅猛，公司仍面临结构性监管风险：印度证券交易委员会（SEBI）持续收紧合规要求、保证金规则与衍生品交易限额，旨在遏制散户期权投机，而衍生品交易恰恰是 Dhan
              这类主打活跃交易券商的核心收入引擎。
            claimRefs:
