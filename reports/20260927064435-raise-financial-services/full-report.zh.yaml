        - label: 交易所直连与清算
          detail: 借助 Moneylicious 席位直连 NSE、BSE 及 MCX 的网关通道
        - label: 合规与监管基础设施
          detail: 实时 SEBI 保证金合规监控、KYC/PMLA 反洗钱核查与 IRDAI 保险业务合规框架
