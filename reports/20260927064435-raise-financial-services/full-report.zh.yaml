    title: 印度零售投资与活跃交易竞争格局定位
    type: quadrant
    summary: 印度零售券商战略定位图，横向映射交易执行速度与工具深度，纵向覆盖从大众散户到活跃衍生品交易者的客群画像。
    approximationNotes: 定位坐标基于已披露的产品功能、订单执行基础设施与目标客群细分作出的定序评估。
    data:
