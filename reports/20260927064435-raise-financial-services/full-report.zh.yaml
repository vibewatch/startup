      - CO013
  - id: FM001
    title: 印度散户证券经纪潜在市场分层
    type: pyramid
    summary: 从印度宏观财富科技机遇逐层拆解至 Dhan 实际可获取市场份额的规模层级。
    approximationNotes: 市场规模数据来源于 Value For Startups 分析师预估及 Inc42 行业报道；各项数值代表可触达的年度收入池。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM006
    data:
      items:
        - label: 印度宏观金融科技市场机遇 ($1,300B)
          description: 涵盖支付、信贷及财富科技的 2025 年印度金融科技整体生态预测。
        - label: 财富管理平台市场 ($8.15B)
          description: 预计以 14.56% 复合年均增长率扩张的 2027 年印度财富管理平台市场。
        - label: 印度散户经纪市场 TAM ($4.5B)
          description: 印度散户佣金与交易年收入池总量预计每年同比增长 20%。
        - label: 活跃 F&O 与 MTF 衍生品 SAM ($1.2B)
