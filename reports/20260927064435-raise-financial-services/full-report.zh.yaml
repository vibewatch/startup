            - 即时开立 Demat 证券账户
          friction: Regulatory documentation and compliance checks
        - label: 核心交易执行
          stage: 核心交易执行
          persona: Active Equity & F&O Trader
          touchpoints:
            - Dhan 移动端与 Web 端交易软件
            - TradingView 图表直连下单
