  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 横向映射发生概率、纵向映射影响严重程度，矩阵化评估运营、监管、合作伙伴及估值风险。
    claimRefs:
      - CR001
      - CR005
      - CR009
    data:
      columns:
        - 低发生概率
        - 中发生概率
        - 高发生概率
      rows:
        - label: SEBI 收紧 F&O 衍生品监管
          values:
            - 自愿性交易熔断暂停
            - 调整合约规模
            - 严格限制杠杆与保证金
        - label: AWS 云基础设施故障中断
          values:
            - 秒内完成数据包重试
            - 单一可用区访问延迟
            - 区域级网络直连完全阻断
        - label: 国家级交易所底层通道故障
          values:
            - 券商端订单堆积排队
            - 清算结算流程冻结
            - 交易所全市场撮合停摆
        - label: TradingView API 链路断连
          values:
            - 行情图表数据临时延迟
            - 切换至备用静态图表
            - 图表直连交易界面失效
        - label: 保险分销业务落地推迟
          values:
            - 合作伙伴服务协议微小摩擦
            - IRDAI 产品备案审批积压
            - 个人端产品平台延期上线
        - label: 折扣佣金费率承压收窄
          values:
            - 部分交易品种定向降费
            - 竞争对手推行零佣金策略
            - 全平台佣金利润率遭受挤压
    approximationNotes: 风险定级综合自监管申报文件、底层架构技术披露及行业竞争格局的定性尽调梳理。
  - id: FV001
    title: 投资建议推演逻辑
    type: flow
    summary: 从市场体量与技术验证出发，层层推演至估值立场与最终投资建议的分析链条。
    data:
      nodes:
        - id: N1
          label: 运营规模与基础设施
          description: 自研 DEXT 引擎在 25ms 内处理 95% 的订单，支撑 Dhan 的活跃散户交易者扩张至近 950,000 名。
        - id: N2
          label: 自述财务表现
          description: 据报道，其营收在 FY25 增至 ₹900 Cr，并在 FY24 录得 ₹155 Cr 净利润，显现出较强的经营杠杆。
        - id: N3
          label: 融资与估值基准
          description: 2025 年 10 月由 Hornbill Capital 与 MUFG 领投的 $120M Series B 轮融资对该业务估值为 $1.2B。
        - id: N4
          label: 监管与信息披露阻力
          description: SEBI 全面收紧期权交易规范，加之与法定数据库中单体营收（₹43.2 Cr）存在显著口径偏差，带来实质性投资风险。
        - id: N5
          label: 老股退出信号
          description: 核心早期风险投资机构（Beenext、3one4 Capital、Mirae Asset）在 Series B 轮期间完成了部分老股减持。
        - id: N6
          label: 投资决策：跟踪观察
          description: 维持“跟踪观察”立场；待经审计合并财务报表发布且监管政策实际影响明朗后，再考虑出资决策。
    approximationNotes: 推演链路综合自可验证的运营里程碑与投资风险研判框架。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV009
      - CV014
