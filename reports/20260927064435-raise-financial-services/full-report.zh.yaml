chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位与核心商业模式
        blocks:
          - type: paragraph
            body: >-
              Raise Financial Services 的法定注册主体是 Raise Fintech Ventures Private Limited，公司于 2021 年 1 月
              成立，总部位于马哈拉施特拉邦孟买。它是一家科技驱动的金融控股公司，为印度零售消费者搭建投资、交易、财富管理、保险和融资基础设施。Raise 没有走单一折扣券商路线，而是以证券经纪品牌 Dhan
              为核心发展多款产品。平台收入主要来自交易执行费、清算费、高阶分析订阅和保证金融资；面向 Z 世代的投资应用 millions、分析工具 ScanX
              和财经内容网络则拓展了业务触达范围。法定申报与风投披露的平台业绩差距显著：企业信息聚合平台援引申报账目称 FY25 营收为 ₹43.2 Cr+；风投披露则称，合并运营生态 FY25 年化营业额达 ₹900
              crore，并据报道录得 ₹155 crore 净利润。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO011
