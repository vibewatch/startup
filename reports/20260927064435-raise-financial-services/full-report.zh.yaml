  - id: FE001
    title: Dhan 技术栈与系统架构图
    type: stack
    summary: Raise Financial Services 与 Dhan 涵盖客户端交互、交易引擎与监管网关的多层技术架构。
    data:
      layers:
        - label: 客户端展示层
          detail: Dhan 移动端 App（iOS/Android）、Dhan Web 端以及 TradingView 图表终端
        - label: API 与集成网关
          detail: RESTful 交易 API、WebSockets 行情推送流与开发者沙箱
