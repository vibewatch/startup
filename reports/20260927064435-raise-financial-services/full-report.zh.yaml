      - number: '1.3'
        title: 资本化历程、估值与股东阵营
        blocks:
          - type: paragraph
            body: >-
              Raise Financial Services 共完成三轮主要机构融资，实缴股权资本约 1.42 亿美元。公司于 2021 年 2 月启动融资，Mirae Asset Venture Investments
              联合印度知名科技创业者领投了金额未披露的种子轮。2022 年 1 月，Raise 完成 2200 万美元 A 轮融资，由 BEENEXT 和 Mirae Asset Venture Investments
              联合领投，3one4 Capital 与 Rocketship.vc 参投；大部分资金用于建设 Dhan 的技术和运营基础设施。2025 年 10 月，公司完成 Hornbill Capital 领投的 1.2
              亿美元 B 轮融资，跻身独角兽行列；日本金融集团 Mitsubishi UFJ Financial Group（MUFG）、BEENEXT、DSP Family Office 和 JM Financial
              Family Office 也参与投资。该轮交易对应约 12 亿美元的预估投后估值。不过，老股流动性仍有限。Caplight
              报告称，非上市公司老股交易量及可核实的股权结构表信息都未公开；经审计的股东持股比例也尚未对外披露。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO012
