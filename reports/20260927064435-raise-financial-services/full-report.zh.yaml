              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: 管理层、公司治理与关键人物架构
        blocks:
          - type: paragraph
            body: >-
              Raise Financial Services 的创始人与高管熟悉印度资本市场、数字证券经纪产品和监管合规。创始人兼 CEO Pravin Jadhav 曾任 Paytm Money 的创始
              CEO，主导搭建了印度规模领先的低成本共同基金和零售股票投资平台之一。联合创始人兼 CTO Alok Pandey 负责工程团队，并主导开发了 DEXT（Dhan Exchange Trading
              System）自有交易路由引擎，目标是将订单处理时间压至 25 毫秒以内。联合创始人兼 COO Jay Prakash Gupta 在 Raise 于 2021 年 8 月战略收购 Moneylicious
              Securities 后加入公司，在 NSE、BSE 和 MCX 的交易所合规与券商会员运营方面经验丰富。联合创始人兼董事 Raunak Rathi
              也参与管理。核心决策权集中在一线高管手中：资本筹集和战略方向高度依赖 Jadhav，技术架构和监管事务则明显依赖 Pandey 与 Gupta。
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
