company:
  name: "Raise Financial Services"
chapter:
  number: 8
  title: "Valuation"
  summary: "Raise Financial Services reached a $1.2 billion valuation following its October 2025 Series B led by Hornbill Capital and MUFG Bank, propelled by strong execution in its flagship Dhan platform. However, substantial divergence between investor-communicated revenue figures and statutory database records, combined with SEBI regulatory headwinds in retail options trading and early venture secondary share sales, warrants a disciplined Track recommendation."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "The core bull thesis for Raise Financial Services centers on Dhan's high-performance technological moat and rapid market share gains within India's active retail trading demographic. Operating its proprietary DEXT trading engine, the company has scaled active users to nearly 950,000 across equities, derivatives, ETFs, and mutual funds, reporting FY25 revenue expansion to ₹900 crore alongside historical profitability. Conversely, the investment anti-thesis highlights structural vulnerability to regulatory tightening by SEBI targeting retail options trading, which represents the primary profit engine for Indian discount brokers. Furthermore, public company databases record standalone FY25 revenues of just ₹43.2 crore, signaling a sharp discrepancy against consolidated claims that necessitates audited verification."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV005"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV002"
  - id: "valuation-context-and-pricing-discipline"
    title: "Valuation Context and Pricing Discipline"
    body: "Raise Financial Services secured its unicorn valuation of $1.2 billion in October 2025 through a $120 million Series B financing round co-led by Hornbill Capital and MUFG Bank, alongside participation from Beenext, DSP Family Office, and JM Financial. This transaction marked a tenfold step-up from its 2022 Series A valuation of $125 million, which had raised $22 million with $15 million committed to building Dhan. However, market intelligence from Caplight underscores that Raise remains a closely held private company with no public stock price discovery and absent secondary trading volume. Notably, the Series B funding incorporated a secondary stock purchase where foundational venture backers Beenext, 3one4 Capital, and Mirae Asset partially liquidated their holdings, signaling early liquidity extraction rather than full capital rollover."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV006"
      - "CV007"
      - "CV008"
    figureRefs:
      - "FV001"
  - id: "comparable-benchmarks-and-capital-allocation"
    title: "Comparable Valuation Benchmarks and Capital Allocation"
    body: "Valuation multiples across the Indian wealthtech landscape are heavily influenced by market incumbents Zerodha and Groww, alongside private neobrokers such as Upstox and INDMoney. At a $1.2 billion post-money mark, Raise is priced at approximately 11x its claimed ₹900 crore FY25 revenue, which appears demanding given emerging regulatory curbs on options turnover. Raise has attempted to justify this multiple by allocating capital toward non-broking ecosystem expansion, acquiring EdTech upskilling platform Valuationary in 2022 and insurance broker GreenLife Insurance Broking (GIBL) in May 2026 for a planned $15 million investment. While these acquisitions aim to build a diversified financial super-app, broking commissions continue to drive the underlying unit economics, leaving valuation multiples sensitive to regulatory shifts."
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV013"
  - id: "scenario-analysis-and-return-profiles"
    title: "Scenario Analysis and Downside Protection"
    body: "Our scenario framework models prospective three-year return trajectories across bull, base, and bear operating cases from the Series B benchmark. In the bull case (25% probability), Dhan achieves full validation of its ₹900 crore revenue trajectory, successfully cross-sells insurance and wealth solutions, and executes a domestic IPO at a $2.5 billion to $3.0 billion valuation. The base case (50% probability) anticipates revenue growth decelerating to 25% annually under SEBI compliance constraints, yielding an exit valuation of $1.2 billion to $1.5 billion that prioritizes capital preservation over multiple expansion. In the bear scenario (25% probability), aggressive SEBI options curbs compress transaction fee revenues toward the standalone statutory run-rate, while venture overhang accelerates down-round pressure, dropping enterprise value to between $600 million and $800 million."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV003"
  - id: "recommendation-and-diligence-roadmap"
    title: "Recommendation, Risk Rating, and Diligence Roadmap"
    body: "We assign Raise Financial Services a definitive recommendation of Track, supported by Medium confidence, a High risk rating, and a Fair to Stretched valuation stance. While the platform's proprietary trading speed and demonstrated customer acquisition momentum represent genuine competitive assets, entering at a $1.2 billion valuation exposes investors to asymmetric downside risk without audited visibility into consolidated financials. Prior to committing growth equity, diligence must rigorously review audited statutory balance sheets and P&L schedules to reconcile the reported ₹900 crore FY25 top-line against the ₹43.2 crore standalone database record. Investors should also establish clear kill criteria around retail derivatives churn, platform stability during peak volatility, and margin compression stemming from SEBI mandate compliance."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV006"
      - "CV011"
      - "CV014"
    tableRefs:
      - "TV001"
