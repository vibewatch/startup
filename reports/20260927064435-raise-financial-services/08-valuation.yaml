callouts:
  - calloutType: recommendation
    title: "Recommendation Stance: Track Pending Financial and Regulatory Clarity"
    body: "While Raise Financial Services has demonstrated remarkable execution velocity and infrastructure excellence through Dhan, the $1.2 billion valuation prices in sustained hyper-growth in a retail options market facing imminent regulatory tightening from SEBI. Investors should maintain a Track recommendation, requiring full audit verification of the ₹900 crore FY25 revenue claim and clarity on unit economic resilience before acquiring equity."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV008"
      - "CV014"
  - calloutType: risk
    title: "Secondary Liquidity and Cap Table Overhang"
    body: "The October 2025 Series B included a significant secondary stock purchase facilitating partial exits for early backers including Beenext, 3one4 Capital, and Mirae Asset. Coupled with the lack of secondary market pricing transparency reported by Caplight, this secondary selling suggests early investors sought liquidity rather than rolling over full exposure, warranting conservative valuation discipline."
