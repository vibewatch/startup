  topStrengths:
    - Proprietary low-latency DEXT execution infrastructure and Dhan trading workflow support differentiated trader experience.
    - Dhan has shown substantial retail user adoption momentum, reaching nearly 950,000 active users by late 2025.
    - The company has expanded beyond core broking into adjacent insurance distribution, broadening the product surface area.
  topRisks:
    - SEBI tightening on retail derivatives trading could reduce activity and compress economics.
    - Reported revenue and profit claims diverge from statutory filing data, limiting visibility into true consolidated performance.
    - DEXT runs on AWS and creates a single-cloud infrastructure dependency during volatile trading periods.
    - Secondary selling and cap-table opacity suggest early investor liquidity pressure and valuation discipline risk.
  unresolvedGaps:
    - Audited FY25 consolidated financial statements that reconcile reported ₹900 crore revenue with statutory filing data.
    - Cohort retention, ARPU, and net revenue retention metrics for the Dhan trader base.
    - Sensitivity of profitability to changes in SEBI rules and retail options trading volumes.
    - Full post-Series B cap-table and secondary liquidity terms.
