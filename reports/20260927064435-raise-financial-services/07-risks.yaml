callouts:
- calloutType: risk
  title: Regulatory Headwinds in Retail Derivatives
  body: SEBI's ongoing tightening of retail equity derivative regulations represents the most material systemic threat to Raise Financial Services. Given that retail F&O trading provides the bulk of trading volumes and revenue for modern discount brokerages, severe regulatory interventions on index option lot sizes or margin rules could sharply depress platform transaction income.
  claimRefs:
  - CR001
- calloutType: insight
  title: Cloud Infrastructure vs Exchange Colocation Trade-off
  body: While Dhan's proprietary DEXT engine achieves sub-25 millisecond execution speeds, operating core matching infrastructure entirely within AWS rather than traditional on-premises exchange colocation creates an architectural trade-off between rapid software iteration and exposure to public cloud network transit disruptions.
  claimRefs:
  - CR005
  - CR006
