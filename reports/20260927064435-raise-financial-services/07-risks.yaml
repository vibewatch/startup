chapter:
  number: 7
  title: Risks
  summary: Raise Financial Services faces key risks centered on intensifying SEBI regulatory scrutiny over retail derivatives trading, high dependency on single-region AWS cloud infrastructure for its proprietary DEXT matching engine, and market cyclicality in discount equity brokerage.
sections:
- id: regulatory-and-compliance-risks
  title: Regulatory and Compliance Risks
  body: Raise Financial Services operates in India's highly regulated financial market, where regulatory compliance forms both a barrier to entry and a source of material operating friction. The Securities and Exchange Board of India (SEBI) has progressively tightened regulatory mandates governing discount retail stockbrokers, specifically targeting retail participation in equity futures and options (F&O) contracts. Because active retail trader participation drives a significant portion of transactional turnover across modern discount brokerages, any structural restrictions on derivative contract sizes, algorithmic execution interfaces, or margin leverage directly threaten platform transaction volumes and brokerage monetization. Raise entered the regulated retail trading arena through its August 2021 corporate acquisition of Mumbai-based stockbroking firm Moneylicious Securities, which provided the requisite SEBI registrations and exchange memberships across BSE, NSE, and MCX for equities,
    derivatives, commodities, and currencies. Furthermore, the company expanded its compliance perimeter in May 2026 by acquiring GreenLife Insurance Broking (GIBL) to build a direct-to-consumer insurance distribution platform. Holding multi-segment brokerage and insurance distribution licenses exposes Raise to heightened examination, audit scrutiny, and risk of severe monetary penalties or administrative sanctions if supervision or investor protection standards fall short.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  tableRefs:
  - TR001
- id: operational-infrastructure-risks
  title: Operational and Infrastructure Reliability
  body: Operational durability and execution integrity represent critical survival factors for technology-led retail brokerages. Raise Financial's core trading platform, Dhan, relies upon DEXT (Dhan Exchange Trading System), an in-house proprietary order, risk, and execution management engine. Although DEXT is engineered to process 95% of orders in under 25 milliseconds—delivering high-speed execution during high-volatility market sessions—the entire system is deployed on Amazon Web Services (AWS). This architecture creates a concentrated infrastructure dependency on AWS availability zones, cloud routing policies, and connectivity pipes into exchange gateways. An unplanned cloud outage, latency degradation, or data center disconnection during peak trading hours can halt order flow, trigger execution discrepancies, cause slippage for active traders, and lead to regulatory scrutiny from exchange surveillance teams. In addition, supporting an ambitious multi-product footprint—spanning Dhan,
    ScanX analytics, Upsurge financial education, and Fuzz AI—demands substantial engineering headcount and operational maintenance from its Mumbai technical office, creating vulnerability to technical talent attrition and system configuration errors.
  claimRefs:
  - CR005
  - CR006
  - CR011
  tableRefs:
  - TR002
  figureRefs:
  - FR001
- id: counterparty-and-partner-dependencies
  title: Counterparty and Partner Dependencies
  body: Beyond internal systems and regulatory authorities, Raise Financial Services maintains critical operational dependencies on market infrastructure institutions, technology partners, and capital providers. To provide advanced technical charting and technical analysis tools to retail traders, Dhan integrated deeply with US-based charting provider TradingView in December 2021. Any disruption to third-party charting APIs or licensing terms directly impairs trader user experience on web and mobile interfaces. Furthermore, clearing and settlement workflows require flawless coordination with clearing corporations (such as NCL and ICCL), custodian counterparties, and depository participants (CDSL and NSDL). In the competitive landscape, Dhan contends with well-capitalized digital incumbents including Zerodha, Groww, and Upstox, which possess extensive balance sheets and entrenched brand equity. Maintaining market share gains without escalating customer acquisition costs or engaging in destructive
    commission price wars represents an ongoing strategic and competitive challenge.
  claimRefs:
  - CR007
  - CR010
  - CR013
  tableRefs:
  - TR003
- id: financial-and-business-model-risks
  title: Financial and Business Model Risks
  body: 'Raise Financial Services has attained unicorn status with an estimated $1.2 billion private market valuation following its Series B funding round, raising over $142 million in total financing. However, its high valuation benchmark creates substantial valuation multiple overhang if platform expansion moderates or retail investor trading activity contracts during cyclical equity bear markets. Public filings and commercial databases reveal discrepancies between statutory entity revenues and platform-level performance figures: Inc42 Datalabs recorded FY25 revenue of ₹43.2 crore for Raise Fintech Ventures Private Limited, whereas investor disclosures from 3one4 Capital report platform revenues scaling to ₹900 crore with ₹155 crore net profit. This structural opacity regarding revenue recognition across operating subsidiaries highlights the risk of earnings volatility. Additionally, capital allocation initiatives—such as pledging $500,000 checks into early-stage investech startups or
    committing $15 million to build an insurance platform—could dilute management focus away from defending Dhan''s core trading franchise during periods of market stress.'
  claimRefs:
  - CR008
  - CR009
  - CR012
  - CR014
