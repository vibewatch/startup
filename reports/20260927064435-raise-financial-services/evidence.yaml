    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: secondary-valuation
    missingEvidence: >-
      Audited cap table showing shareholding percentages, ESOP pool allocations, liquidation preferences, and primary
      vs. secondary transaction breakdown for the $120M round.
    whyItMatters: >-
      Without verified cap table allocations, true founder control, investor governance rights, and liquidation
      seniority remain unverified.
    diligencePath: >-
      Request confidential data room access including latest MCA shareholder return filing (PAS-3) and definitive
      investor rights agreements.
