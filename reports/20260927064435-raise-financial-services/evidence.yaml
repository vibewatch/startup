evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Reconciliation between statutory standalone filing revenue (₹43.2 Cr+ for FY25) reported by corporate registry
      aggregators and promotional platform gross revenue (₹900 Cr for FY25) reported by venture investors.
    whyItMatters: >-
      Gross turnover or GMV may be conflated with net broker commission revenue, distorting actual corporate operating
      scale and unit economics.
    diligencePath: >-
      Obtain audited Ministry of Corporate Affairs (MCA) Form MGT-7 and AOC-4 annual financial filings for Raise Fintech
      Ventures Private Limited for FY24 and FY25.
    relatedQuestionRefs:
