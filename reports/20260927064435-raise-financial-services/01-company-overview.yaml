company:
  name: "Raise Financial Services"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Raise Financial Services is an Indian fintech holding company established in 2021 by former Paytm Money CEO Pravin Jadhav that achieved unicorn status in late 2025 at a $1.2B valuation, operating flagship trading broker Dhan alongside wealth and insurance distribution subsidiaries."

sections:
  - id: "corporate-identity-and-business-model"
    title: "Corporate Identity and Core Business Model"
    body: "Raise Financial Services, legally incorporated as Raise Fintech Ventures Private Limited, was founded in January 2021 and maintains its headquarters in Mumbai, Maharashtra. The company was conceived as a technology-led holding company dedicated to building financial infrastructure across investing, trading, wealth management, insurance, and financing for Indian retail consumers. Rather than operating as a monolithic discount brokerage, Raise deploys a multi-product architecture centered around its flagship stockbroking brand, Dhan. The platform monetizes primarily through transaction execution fees, clearing charges, premium analytics subscriptions, and margin facilities, while expanding its addressable market through dedicated consumer vertical products such as the Gen Z investing application 'millions', analytical tools including ScanX, and financial content networks. Disclosed financial performance presents a sharp contrast between statutory registry disclosures and venture-reported platform metrics: while statutory aggregator reports cite FY25 revenue of ₹43.2 Cr+ based on filed entity accounts, venture capital disclosures highlight ₹900 crore in annualized FY25 turnover with ₹155 crore in reported net profit across its consolidated operating ecosystem."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO011"
    tableRefs:
      - "TO001"

  - id: "leadership-and-governance"
    title: "Leadership, Governance, and Key-Person Structure"
    body: "The founding and executive leadership team at Raise Financial Services reflects deep domain expertise in Indian capital markets, digital brokerage product design, and regulatory compliance. Founder and Chief Executive Officer Pravin Jadhav previously served as the founding CEO of Paytm Money, where he architected one of India's largest low-cost mutual fund and retail equity platforms. Co-founder and Chief Technology Officer Alok Pandey directs the engineering organization and spearheaded the proprietary development of DEXT (Dhan Exchange Trading System), an in-house transaction routing engine optimized for sub-25 millisecond order processing. Co-founder and Chief Operating Officer Jay Prakash Gupta joined the firm following Raise's strategic acquisition of Moneylicious Securities in August 2021, bringing extensive operational background in exchange compliance and broking memberships across the NSE, BSE, and MCX. Supported by co-founder and director Raunak Rathi, the executive team concentrates substantial authority within its core operational leadership, establishing high key-person dependency on Jadhav for capital formation and strategic vision, and on Pandey and Gupta for technical infrastructure and regulatory navigation."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO010"
    tableRefs:
      - "TO002"

  - id: "capitalization-and-stakeholder-syndicate"
    title: "Capitalization, Valuation, and Stakeholder Syndicate"
    body: "Raise Financial Services has completed three primary institutional financing rounds, accumulating approximately $142 million in total paid-in equity capital. The company initiated fundraising in February 2021 with an undisclosed Seed round led by Mirae Asset Venture Investments alongside prominent Indian tech founders. In January 2022, Raise closed a $22 million Series A round co-led by BEENEXT and Mirae Asset Venture Investments, with participation from 3one4 Capital and Rocketship.vc, allocating the majority of proceeds toward building Dhan's technical and operational infrastructure. In October 2025, the firm achieved unicorn status following a $120 million Series B round led by Hornbill Capital, with participation from Japanese banking giant Mitsubishi UFJ Financial Group (MUFG), BEENEXT, DSP Family Office, and JM Financial Family Office. The transaction established an estimated post-money valuation of $1.2 billion. However, secondary trading liquidity remains restricted; Caplight reports that private secondary share trading volumes and verifiable cap table returns remain closely held, with audited shareholder allocations undisclosed to the public."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO012"
    tableRefs:
      - "TO003"

  - id: "strategic-milestones-and-operating-risks"
    title: "Strategic Milestones, Execution Track Record, and Operating Risks"
    body: "The operating history of Raise Financial Services is defined by rapid corporate acquisitions and iterative product rollouts designed to bypass traditional financial licensing barriers. Following its founding in early 2021, the company acquired SEBI-registered broker Moneylicious Securities in August 2021, immediately securing exchange memberships and clearing licenses necessary to launch Dhan later that year. In May 2026, Raise executed a second major acquisition by purchasing GreenLife Insurance Broking Private Limited (GIBL) for an undisclosed consideration, pledging a $15 million follow-on investment to build a direct-to-consumer digital insurance distribution network. Product diversification continued in June 2026 with the release of 'millions', targeted at novice retail investors. Despite rapid expansion, the company faces structural regulatory exposure: the Securities and Exchange Board of India (SEBI) has instituted increasingly strict compliance mandates, margin requirements, and derivative volume restrictions aimed at curbing retail options trading, which represents a critical revenue driver for active brokerage platforms like Dhan."
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO010"
      - "CO011"
      - "CO013"
    figureRefs:
      - "FO001"

