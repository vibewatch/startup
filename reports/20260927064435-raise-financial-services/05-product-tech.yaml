callouts:
  - calloutType: strength
    title: Proprietary DEXT Engine and Low-Latency Execution Advantage
    body: >-
      Raise Financial's in-house DEXT trading engine unifies order, risk, and execution management on AWS, processing
      95% of orders in under 25 milliseconds. This delivers a 5-6x speed advantage over conventional third-party
      brokerage stacks, anchoring Dhan's adoption among high-frequency intraday traders.
    claimRefs:
      - CE002
      - CE003
  - calloutType: risk
    title: Regulatory Friction and Cloud-Hosted Execution Bottlenecks
    body: >-
      As SEBI tightens margin norms and algorithmic controls across retail equity derivatives, Dhan's reliance on AWS
      virtualized infrastructure and public internet routing exposes the platform to gateway throttling, exchange
      compliance updates, and sudden market open volatility risks.
    claimRefs:
      - CE013
      - CE014
  - calloutType: insight
    title: Multi-Product Architecture Across Wealth, Analytics, and Insurance
    body: >-
      Unlike single-purpose discount brokers, Raise Financial is executing a horizontal ecosystem strategy. By acquiring
      GIBL for insurance distribution and integrating real-time analytics via ScanX and TradingView, Raise builds
      defensible customer engagement loops beyond commoditized equity trading.
    claimRefs:
      - CE005
      - CE006
      - CE008
