  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Workflow
      - Company Solution
      - Measurable Benefit
      - Limitation
    rows:
      - - Active F&O & intraday trading
        - Switching between third-party charting and broker order windows
        - Native TradingView charting integration directly linked to DEXT order routing
        - Eliminates window-switching friction; execution within charts
        - Execution speed still dependent on local internet latency and exchange connectivity
      - - Algorithmic / API-driven trading
        - Complex institutional API onboarding with rigid minimum trade volume thresholds
        - Developer-friendly open API infrastructure for custom trading strategies
        - Self-service API onboarding and flexible execution endpoints
        - Rate limits during market open volatility remain undocumented
      - - Multi-asset portfolio management
        - Fragmented applications for equities, mutual funds, and insurance policies
        - Unified account architecture spanning capital markets and insurance distribution
        - Single KYC and integrated margin tracking across diversified holdings
        - Cross-margin utilization across insurance and securities is legally restricted by SEBI/IRDAI
      - - Pre-trade market scanning
        - Delayed external screener tools requiring manual ticket entry
        - Integrated ScanX real-time screener with instant order ticket population
        - Reduces pre-trade analysis latency from minutes to seconds
        - Historical depth and custom formula flexibility unverified vs institutional terminals
    notes: >-
      Workflow mappings compare Dhan user workflows against conventional Indian discount brokerage practices based on
      public product feature disclosures.
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE006
      - CE009
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Component
      - Role
      - Technical Dependency
      - Key Operational Risk
    rows:
      - - Client Interface Layer
        - Mobile application (iOS/Android) and Dhan Web trading terminal
        - WebSockets, secure HTTPS, mobile OS push notification services
        - Client-side rendering latency and connection drops during mobile handoffs
      - - Execution Engine (DEXT)
        - Unified order placement, risk checks, and trade confirmation routing
        - Amazon Web Services (AWS) virtualized compute clusters
        - Cloud outage or routing bottleneck during peak NSE/BSE opening market surges
      - - Exchange Connectivity Gateway
        - Direct protocol connection to NSE, BSE, and MCX matching engines
        - Leased line exchange access and Moneylicious broker clearing memberships
        - Exchange gateway throttling, regulatory tick-by-tick rule updates, or clearing house delays
      - - External Analytics Integration
        - Interactive charting and technical analysis overlay
        - TradingView charting libraries and third-party Webhook endpoints
        - API version deprecation, third-party library outages, or charting lag
      - - Compliance & Risk Engine
        - Real-time pre-trade margin verification and SEBI compliance enforcement
        - In-house risk management software and depository participant (DP) databases
        - Algorithmic compliance misconfiguration under dynamic SEBI margin requirement shifts
    notes: >-
      Architecture components inferred from investor disclosures, cloud partnership releases, and regulatory filings;
      internal AWS topology remains private.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE013
      - CE014
