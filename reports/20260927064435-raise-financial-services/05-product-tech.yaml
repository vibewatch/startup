company:
  name: Raise Financial Services
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Raise Financial Services delivers a multi-product investech ecosystem anchored by its flagship Dhan trading platform
    and proprietary AWS-hosted DEXT execution engine. By unifying order, risk, and execution management to achieve
    sub-25 millisecond latency and expanding into direct insurance through GIBL, Raise balances high-performance retail
    trading with multi-asset expansion amid tightening SEBI regulatory oversight.
sections:
  - id: product-definition-and-workflows
    title: Product Definition and Trading Workflows
    body: >-
      Raise Financial Services operates as a technology-led financial services and investech company developing consumer
      products and infrastructure for investing, trading, and wealth management in India. Its flagship product is Dhan,
      an integrated investment and trading platform designed specifically for active retail traders, super traders, and
      long-term investors across equities, exchange-traded funds, mutual funds, and equity derivatives. Rather than
      adopting the generic consumer-retail onboarding common among early discount brokers, Dhan tailors user journeys to
      complex intraday and derivatives workflows. A central technological integration is Dhan's direct partnership with
      US-based charting provider TradingView, established in December 2021, which enables active market participants to
      execute trades directly from interactive charts across equities, currency, commodities, and futures without
      toggling between separate terminal windows. Dhan serves approximately 950,000 active users, combining
      multi-channel web and mobile accessibility with deep order placement customizability.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE010
      - CE011
    tableRefs:
      - TE002
  - id: product-line-and-ecosystem
    title: Product Line and Multi-Asset Ecosystem
    body: >-
      Beyond its primary brokerage platform, Raise Financial Services has systematically assembled a horizontal digital
      finance ecosystem targeting distinct investor profiles. The company's portfolio includes ScanX, a real-time
      markets research and technical analytics platform providing automated screeners and charting intelligence. For
      financial literacy and investor onboarding, Raise operates Upsurge, an educational hub featuring more than 250
      structured finance courses, alongside Filter Coffee, a bite-sized content channel delivering daily financial
      commentary for millennial and Gen Z demographics. To incorporate artificial intelligence into market intelligence,
      Raise developed Fuzz, an AI model trained on financial datasets to offer contextual market insights. In May 2026,
      Raise further diversified its operating footprint by announcing the acquisition of GreenLife Insurance Broking
      (GIBL) and allocating 15 million USD to construct a direct consumer insurance distribution platform, allowing
      Indian consumers to purchase and manage insurance policies within its digital ecosystem.
    claimRefs:
      - CE006
      - CE007
      - CE008
    tableRefs:
      - TE001
  - id: architecture-and-operating-model
    title: Technology Architecture and Execution Infrastructure
    body: >-
      At the core of Dhan's high-throughput brokerage infrastructure is DEXT (Dhan Exchange Trading System), a
      proprietary in-house execution engine hosted on Amazon Web Services (AWS) virtualized infrastructure. DEXT unifies
      order routing, real-time risk checks, and execution management into a single integrated software architecture. By
      processing 95% of incoming orders in under 25 milliseconds, DEXT operates five to six times faster than
      traditional Indian brokerage systems, providing the computational throughput required to manage severe order
      volatility during morning market opens and weekly derivative expiry windows. Dhan leverages virtualization
      paradigms and containerized microservices to run concurrent computational instances across shared physical cloud
      hardware, enabling high availability, horizontal scalability, and cost optimization. In addition, Raise provides
      developer-focused API infrastructure and custom technology tooling, empowering algorithmic trading startups and
      quantitative traders to interface directly with Dhan's execution and risk layers.
    claimRefs:
      - CE002
      - CE003
      - CE009
      - CE012
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: differentiation-security-and-compliance
    title: Technical Differentiation, Reliability, and Regulatory Controls
    body: >-
      Dhan differentiates its technology stack through end-to-end proprietary ownership of execution and risk software,
      in contrast to legacy brokerage institutions throttled by fragmented third-party vendor platforms and brittle
      legacy architectures. Raise gained direct market access by acquiring SEBI-registered broker Moneylicious
      Securities in August 2021, securing exchange memberships across the National Stock Exchange (NSE), Bombay Stock
      Exchange (BSE), and Multi Commodity Exchange (MCX). Operating in one of India's most strictly supervised sectors
      requires continuous adherence to tightening SEBI regulatory directives, including real-time upfront client margin
      verification, algorithmic trade surveillance, and derivative trading guardrails. While cloud-native hosting on AWS
      enables rapid release cycles and high responsiveness, it introduces operational dependencies on cloud
      connectivity, exchange gateway throughput, and internet stability. Furthermore, independent third-party
      performance benchmarks and detailed service-level agreements for DEXT remain private, requiring institutional
      diligence.
    claimRefs:
      - CE004
      - CE013
      - CE014
      - CE015
