            body: >-
              Regulatory interventions by SEBI targeting retail derivatives participation introduce volume volatility
              and margin headwinds for active-trader focused brokerages like Dhan.
            calloutType: risk
            claimRefs:
              - CP007
          - type: callout
            title: Execution Speed as a Customer Retention Differentiator
            body: >-
              Proprietary order routing via DEXT with sub-25 millisecond execution creates competitive defensibility
              among high-turnover traders sensitive to slippage during market opening volatility.
            calloutType: insight
            claimRefs:
