      - number: '5.2'
        title: Product Line and Multi-Asset Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Beyond its primary brokerage platform, Raise Financial Services has systematically assembled a horizontal
              digital finance ecosystem targeting distinct investor profiles. The company's portfolio includes ScanX, a
              real-time markets research and technical analytics platform providing automated screeners and charting
              intelligence. For financial literacy and investor onboarding, Raise operates Upsurge, an educational hub
              featuring more than 250 structured finance courses, alongside Filter Coffee, a bite-sized content channel
              delivering daily financial commentary for millennial and Gen Z demographics. To incorporate artificial
              intelligence into market intelligence, Raise developed Fuzz, an AI model trained on financial datasets to
              offer contextual market insights. In May 2026, Raise further diversified its operating footprint by
              announcing the acquisition of GreenLife Insurance Broking (GIBL) and allocating 15 million USD to
              construct a direct consumer insurance distribution platform, allowing Indian consumers to purchase and
              manage insurance policies within its digital ecosystem.
            claimRefs:
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
