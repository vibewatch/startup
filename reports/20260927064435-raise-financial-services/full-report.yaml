      - - Valuation Stance
        - Fair to Stretched
        - Valuation of $1.2B implies ~11x revenue on claimed ₹900 Cr or ~230x on standalone ₹43.2 Cr
        - Resist valuation expansion without validated consolidated unit economics and margin durability
    notes: >-
      Recommendation and risk ratings reflect synthesis of Series B financing terms, claimed FY25 performance, and SEBI
      regulatory tightening.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Argument
      - Supporting Evidence
      - What Would Change the View
    rows:
      - - Core Investment Thesis
        - >-
          Proprietary DEXT trading infrastructure and high-velocity product execution enable sustained market share
          capture in active trader segments
        - Sub-25ms order execution speeds, 950K active users, and consecutive quarterly share gains
        - Platform reliability outages during peak market volatility or sharp deceleration in active trader additions
      - - Financial Scaling Thesis
        - >-
          Achieved cash-flow positivity across three years and scaled claimed revenue to ₹900 Cr in FY25 with ₹155 Cr
          net profit in FY24
        - Confirmed participation of tier-one institutional investors (MUFG, Hornbill) in $120M Series B
        - Audited financial restatements or compression of operating cash flows under revised tariff structures
      - - Regulatory Anti-Thesis
        - >-
          SEBI tightening of derivatives and options trading norms directly threatens high-frequency retail volumes that
          drive brokerage monetization
        - Regulatory mandates increasing margin requirements and restricting speculative trading products
        - Successful diversification into fee-based wealth management, mutual funds, and direct insurance distribution
      - - Valuation & Governance Anti-Thesis
        - >-
          Unicorn valuation of $1.2B lacks public price discovery and saw early investors partially cash out secondary
          shares
        - Partial stake sales by Beenext, 3one4 Capital, and Mirae Asset during Series B
        - >-
          Substantial primary-only insider re-investment or filing of an approved DRHP showing strong institutional
          anchor demand
    notes: Evaluation of core bull drivers versus structural regulatory and valuation risks for Raise Financial Services.
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV009
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / Return Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Consolidated ₹900 Cr revenue confirmed; Dhan captures top-3 broker rank; insurance and wealth cross-selling
          accelerates; successful IPO at 15x multiple
        - $2.5B - $3.0B enterprise value (2.0x - 2.5x return on Series B valuation)
        - Regulatory overhang suppresses derivatives volume growth; heightened fintech CAC
        - 25% (Requires pristine execution and benign regulatory environment)
      - - Base Case
        - >-
          Revenue grows at moderate 25-30% YoY; derivatives volumes normalize under SEBI rules; wealth products
          contribute modest fees; exit via domestic IPO or strategic M&A at 8-10x
        - $1.2B - $1.5B enterprise value (1.0x - 1.25x return, capital preservation focus)
        - Multiple compression in private fintech secondaries; prolonged public listing window
        - 50% (Reflects current trading scale balanced against regulatory adjustments)
      - - Bear Case
        - >-
          SEBI derivatives curbs erode high-volume trader margins; statutory revenues reflect lower base; early
          investors continue secondary liquidations; down-round or flat extension
        - $600M - $800M enterprise value (33% to 50% downside haircut on Series B valuation)
        - Operating cash flow turn negative; aggressive price war from zero-brokerage incumbents
        - 25% (Triggered if active trader churn spikes or compliance costs escalate)
    notes: Scenario analysis model based on 3-year holding period from October 2025 Series B benchmark.
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV010
      - CV013
