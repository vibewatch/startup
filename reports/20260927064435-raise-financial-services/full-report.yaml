  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Trading Workflows
        blocks:
          - type: paragraph
            body: >-
              Raise Financial Services operates as a technology-led financial services and investech company developing
              consumer products and infrastructure for investing, trading, and wealth management in India. Its flagship
              product is Dhan, an integrated investment and trading platform designed specifically for active retail
              traders, super traders, and long-term investors across equities, exchange-traded funds, mutual funds, and
              equity derivatives. Rather than adopting the generic consumer-retail onboarding common among early
              discount brokers, Dhan tailors user journeys to complex intraday and derivatives workflows. A central
              technological integration is Dhan's direct partnership with US-based charting provider TradingView,
              established in December 2021, which enables active market participants to execute trades directly from
              interactive charts across equities, currency, commodities, and futures without toggling between separate
              terminal windows. Dhan serves approximately 950,000 active users, combining multi-channel web and mobile
              accessibility with deep order placement customizability.
            claimRefs:
              - CE001
              - CE004
              - CE005
