            body: >-
              Raise Financial Services has built a multi-product fintech ecosystem centered around its flagship trading
              platform, Dhan. The company monetizes customer activity primarily through high-frequency equity and
              derivatives brokerage, payment processing charges, and ancillary subscription products. While discount
              equity delivery trading serves as a low-friction customer acquisition funnel, the core transactional
