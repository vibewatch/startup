              - CO010
      - number: '1.3'
        title: Capitalization, Valuation, and Stakeholder Syndicate
        blocks:
          - type: paragraph
            body: >-
              Raise Financial Services has completed three primary institutional financing rounds, accumulating
              approximately $142 million in total paid-in equity capital. The company initiated fundraising in February
              2021 with an undisclosed Seed round led by Mirae Asset Venture Investments alongside prominent Indian tech
              founders. In January 2022, Raise closed a $22 million Series A round co-led by BEENEXT and Mirae Asset
              Venture Investments, with participation from 3one4 Capital and Rocketship.vc, allocating the majority of
              proceeds toward building Dhan's technical and operational infrastructure. In October 2025, the firm
              achieved unicorn status following a $120 million Series B round led by Hornbill Capital, with
              participation from Japanese banking giant Mitsubishi UFJ Financial Group (MUFG), BEENEXT, DSP Family
              Office, and JM Financial Family Office. The transaction established an estimated post-money valuation of
              $1.2 billion. However, secondary trading liquidity remains restricted; Caplight reports that private
              secondary share trading volumes and verifiable cap table returns remain closely held, with audited
              shareholder allocations undisclosed to the public.
