      - number: '5.3'
        title: Technology Architecture and Execution Infrastructure
        blocks:
          - type: paragraph
            body: >-
              At the core of Dhan's high-throughput brokerage infrastructure is DEXT (Dhan Exchange Trading System), a
              proprietary in-house execution engine hosted on Amazon Web Services (AWS) virtualized infrastructure. DEXT
              unifies order routing, real-time risk checks, and execution management into a single integrated software
              architecture. By processing 95% of incoming orders in under 25 milliseconds, DEXT operates five to six
              times faster than traditional Indian brokerage systems, providing the computational throughput required to
              manage severe order volatility during morning market opens and weekly derivative expiry windows. Dhan
              leverages virtualization paradigms and containerized microservices to run concurrent computational
              instances across shared physical cloud hardware, enabling high availability, horizontal scalability, and
              cost optimization. In addition, Raise provides developer-focused API infrastructure and custom technology
              tooling, empowering algorithmic trading startups and quantitative traders to interface directly with
              Dhan's execution and risk layers.
            claimRefs:
              - CE002
              - CE003
              - CE009
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
