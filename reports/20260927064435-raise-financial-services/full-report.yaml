      - number: '3.3'
        title: Pricing Models, Cost Structures, and Brokerage Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Digital stockbroking in India operates primarily on a discount pricing structure where equity delivery
              trades are offered free or at minimal fees, while intraday equity and futures and options transactions
              carry a flat charge capped at ₹20 per executed order. Raise Financial Services adheres to this competitive
              market convention on Dhan while diversifying monetization across educational subscriptions on Upsurge,
              proprietary research tools, and enterprise API capabilities. Consolidated parent performance scaled to
              ₹900 crore in FY25 revenue with profitable operations achieved in FY24, although standalone filing records
              such as Raise Fintech Ventures show ₹43.2 crore, underscoring entity-level reporting divergence. However,
              heightened regulatory scrutiny from SEBI regarding retail derivatives participation, margin requirements,
              and contract lot sizes creates potential fee compression risks that threaten transaction volume stability
              across all active-trader focused brokerages.
            claimRefs:
              - CP007
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP007
              - CP010
      - number: '3.4'
        title: Moat Durability, Platform Multi-Homing, and Regulatory Pressure
        blocks:
          - type: paragraph
            body: >-
              Incumbent platforms such as Zerodha and Groww maintain immense structural distribution advantages through
              multi-million registered client bases and established organic brand recall. To counteract customer
              acquisition cost pressures and build durable retention barriers, Raise Financial Services is executing a
              multi-brand ecosystem strategy. This includes Dhan for core trading, Millions App targeting first-time
              millennial and Gen Z investors, and the acquisition of GreenLife Insurance Broking to deploy direct
              consumer insurance distribution by late 2026. Despite these ecosystem expansions, moat durability remains
              vulnerable to active trader multi-homing, as retail market participants routinely maintain active accounts
              across several discount brokerages to capitalize on execution speed differentials or uptime redundancy
              during market volatility.
            claimRefs:
              - CP008
              - CP011
              - CP014
