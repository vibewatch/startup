      - number: '3.2'
        title: Execution Infrastructure and Tooling Differentiation
        blocks:
          - type: paragraph
            body: >-
              In the retail trading segment, competitive differentiation centers on order execution reliability, latency
              guarantees, and sophisticated technical charting. Rather than relying entirely on standard third-party
              exchange gateway wrappers, Raise Financial Services built a proprietary in-house trading engine titled
              DEXT on Amazon Web Services infrastructure, engineered to process 95% of orders in under 25 milliseconds.
              This focus on execution velocity directly addresses active derivatives trader pain points concerning
              peak-market slippage and system unresponsiveness. Furthermore, Dhan secured regulatory market access and
              full exchange memberships across BSE, NSE, and MCX through the strategic acquisition of SEBI-registered
              stockbroker Moneylicious Securities in August 2021. To complement its proprietary execution engine, Dhan
              partnered with TradingView to enable direct-from-chart trade placement across equity, futures, and
              currency options, differentiating its interface from basic retail neobroker workflows.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
