        title: Pricing Dynamics, Fee Structures, and Realized Unit Economics
        blocks:
          - type: paragraph
            body: >-
              In line with modern discount broking models in India, Dhan maintains competitive list pricing against
              incumbents such as Groww and Zerodha, providing zero-fee equity delivery while charging flat fees on
              derivative contracts. Because high-frequency traders account for a disproportionate share of transaction
              volume, platform stickiness is driven by execution speed rather than predatory price discounting. The
              proprietary DEXT trading engine processes ninety-five percent of orders in under twenty-five milliseconds,
              defending fee realization among professional super-traders while production engineering teams maintain
              operational uptime from Mumbai. Meanwhile, secondary platforms like EquityZen track restricted private
              share liquidity. However, lack of disclosure regarding negotiated volume rebates, TradingView licensing
              overhead, and user acquisition costs creates underwriting uncertainty regarding net customer unit
              contribution and lifetime value.
