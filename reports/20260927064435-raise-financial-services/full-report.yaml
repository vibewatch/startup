chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Core Business Model
        blocks:
          - type: paragraph
            body: >-
              Raise Financial Services, legally incorporated as Raise Fintech Ventures Private Limited, was founded in
              January 2021 and maintains its headquarters in Mumbai, Maharashtra. The company was conceived as a
              technology-led holding company dedicated to building financial infrastructure across investing, trading,
              wealth management, insurance, and financing for Indian retail consumers. Rather than operating as a
              monolithic discount brokerage, Raise deploys a multi-product architecture centered around its flagship
              stockbroking brand, Dhan. The platform monetizes primarily through transaction execution fees, clearing
              charges, premium analytics subscriptions, and margin facilities, while expanding its addressable market
              through dedicated consumer vertical products such as the Gen Z investing application 'millions',
              analytical tools including ScanX, and financial content networks. Disclosed financial performance presents
              a sharp contrast between statutory registry disclosures and venture-reported platform metrics: while
              statutory aggregator reports cite FY25 revenue of ₹43.2 Cr+ based on filed entity accounts, venture
              capital disclosures highlight ₹900 crore in annualized FY25 turnover with ₹155 crore in reported net
              profit across its consolidated operating ecosystem.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: Leadership, Governance, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              The founding and executive leadership team at Raise Financial Services reflects deep domain expertise in
              Indian capital markets, digital brokerage product design, and regulatory compliance. Founder and Chief
              Executive Officer Pravin Jadhav previously served as the founding CEO of Paytm Money, where he architected
              one of India's largest low-cost mutual fund and retail equity platforms. Co-founder and Chief Technology
              Officer Alok Pandey directs the engineering organization and spearheaded the proprietary development of
              DEXT (Dhan Exchange Trading System), an in-house transaction routing engine optimized for sub-25
              millisecond order processing. Co-founder and Chief Operating Officer Jay Prakash Gupta joined the firm
              following Raise's strategic acquisition of Moneylicious Securities in August 2021, bringing extensive
              operational background in exchange compliance and broking memberships across the NSE, BSE, and MCX.
              Supported by co-founder and director Raunak Rathi, the executive team concentrates substantial authority
              within its core operational leadership, establishing high key-person dependency on Jadhav for capital
              formation and strategic vision, and on Pandey and Gupta for technical infrastructure and regulatory
              navigation.
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO010
