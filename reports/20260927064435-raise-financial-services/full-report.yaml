      - number: '1.4'
        title: Strategic Milestones, Execution Track Record, and Operating Risks
        blocks:
          - type: paragraph
            body: >-
              The operating history of Raise Financial Services is defined by rapid corporate acquisitions and iterative
              product rollouts designed to bypass traditional financial licensing barriers. Following its founding in
              early 2021, the company acquired SEBI-registered broker Moneylicious Securities in August 2021,
              immediately securing exchange memberships and clearing licenses necessary to launch Dhan later that year.
              In May 2026, Raise executed a second major acquisition by purchasing GreenLife Insurance Broking Private
              Limited (GIBL) for an undisclosed consideration, pledging a $15 million follow-on investment to build a
              direct-to-consumer digital insurance distribution network. Product diversification continued in June 2026
              with the release of 'millions', targeted at novice retail investors. Despite rapid expansion, the company
              faces structural regulatory exposure: the Securities and Exchange Board of India (SEBI) has instituted
              increasingly strict compliance mandates, margin requirements, and derivative volume restrictions aimed at
              curbing retail options trading, which represents a critical revenue driver for active brokerage platforms
              like Dhan.
