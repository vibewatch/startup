              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Positioning of Dhan Among Active Urban Traders
            body: >-
              Raise Financial Services deliberately bypassed mass-market, capital-intensive financial inclusion
              initiatives to focus exclusively on tech-literate retail traders in India’s top metropolitan and Tier 1/2
              centers. By catering to high-frequency options and equity traders who value speed and reliability over
              basic access, Dhan achieved rapid commercial scale, growing to nearly 950,000 active users by late 2025.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU006
          - type: callout
            title: Derivatives Concentration and Regulatory Vulnerability
            body: >-
              While focusing on active options and futures traders powers robust brokerage monetization, it creates
              significant customer concentration risk. As SEBI tightens retail derivatives trading guidelines and margin
              norms, Dhan faces the dual challenge of diversifying active accounts into long-term wealth products and
              insurance while managing cohort durability in an evolving regulatory climate.
            calloutType: risk
            claimRefs:
              - CU012
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              Raise Financial Services operates in India's highly regulated financial market, where regulatory
              compliance forms both a barrier to entry and a source of material operating friction. The Securities and
              Exchange Board of India (SEBI) has progressively tightened regulatory mandates governing discount retail
              stockbrokers, specifically targeting retail participation in equity futures and options (F&O) contracts.
              Because active retail trader participation drives a significant portion of transactional turnover across
              modern discount brokerages, any structural restrictions on derivative contract sizes, algorithmic
              execution interfaces, or margin leverage directly threaten platform transaction volumes and brokerage
              monetization. Raise entered the regulated retail trading arena through its August 2021 corporate
              acquisition of Mumbai-based stockbroking firm Moneylicious Securities, which provided the requisite SEBI
              registrations and exchange memberships across BSE, NSE, and MCX for equities, derivatives, commodities,
              and currencies. Furthermore, the company expanded its compliance perimeter in May 2026 by acquiring
              GreenLife Insurance Broking (GIBL) to build a direct-to-consumer insurance distribution platform. Holding
              multi-segment brokerage and insurance distribution licenses exposes Raise to heightened examination, audit
              scrutiny, and risk of severe monetary penalties or administrative sanctions if supervision or investor
              protection standards fall short.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational and Infrastructure Reliability
        blocks:
          - type: paragraph
            body: >-
              Operational durability and execution integrity represent critical survival factors for technology-led
              retail brokerages. Raise Financial's core trading platform, Dhan, relies upon DEXT (Dhan Exchange Trading
              System), an in-house proprietary order, risk, and execution management engine. Although DEXT is engineered
              to process 95% of orders in under 25 milliseconds—delivering high-speed execution during high-volatility
              market sessions—the entire system is deployed on Amazon Web Services (AWS). This architecture creates a
              concentrated infrastructure dependency on AWS availability zones, cloud routing policies, and connectivity
              pipes into exchange gateways. An unplanned cloud outage, latency degradation, or data center disconnection
              during peak trading hours can halt order flow, trigger execution discrepancies, cause slippage for active
              traders, and lead to regulatory scrutiny from exchange surveillance teams. In addition, supporting an
              ambitious multi-product footprint—spanning Dhan, ScanX analytics, Upsurge financial education, and Fuzz
              AI—demands substantial engineering headcount and operational maintenance from its Mumbai technical office,
              creating vulnerability to technical talent attrition and system configuration errors.
            claimRefs:
              - CR005
              - CR006
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
      - number: '7.3'
        title: Counterparty and Partner Dependencies
        blocks:
          - type: paragraph
            body: >-
              Beyond internal systems and regulatory authorities, Raise Financial Services maintains critical
              operational dependencies on market infrastructure institutions, technology partners, and capital
              providers. To provide advanced technical charting and technical analysis tools to retail traders, Dhan
              integrated deeply with US-based charting provider TradingView in December 2021. Any disruption to
              third-party charting APIs or licensing terms directly impairs trader user experience on web and mobile
              interfaces. Furthermore, clearing and settlement workflows require flawless coordination with clearing
              corporations (such as NCL and ICCL), custodian counterparties, and depository participants (CDSL and
              NSDL). In the competitive landscape, Dhan contends with well-capitalized digital incumbents including
              Zerodha, Groww, and Upstox, which possess extensive balance sheets and entrenched brand equity.
              Maintaining market share gains without escalating customer acquisition costs or engaging in destructive
              commission price wars represents an ongoing strategic and competitive challenge.
            claimRefs:
              - CR007
              - CR010
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR010
              - CR013
      - number: '7.4'
        title: Financial and Business Model Risks
        blocks:
          - type: paragraph
            body: >-
              Raise Financial Services has attained unicorn status with an estimated $1.2 billion private market
              valuation following its Series B funding round, raising over $142 million in total financing. However, its
              high valuation benchmark creates substantial valuation multiple overhang if platform expansion moderates
              or retail investor trading activity contracts during cyclical equity bear markets. Public filings and
              commercial databases reveal discrepancies between statutory entity revenues and platform-level performance
              figures: Inc42 Datalabs recorded FY25 revenue of ₹43.2 crore for Raise Fintech Ventures Private Limited,
              whereas investor disclosures from 3one4 Capital report platform revenues scaling to ₹900 crore with ₹155
              crore net profit. This structural opacity regarding revenue recognition across operating subsidiaries
              highlights the risk of earnings volatility. Additionally, capital allocation initiatives—such as pledging
              $500,000 checks into early-stage investech startups or committing $15 million to build an insurance
              platform—could dilute management focus away from defending Dhan's core trading franchise during periods of
              market stress.
            claimRefs:
              - CR008
              - CR009
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Headwinds in Retail Derivatives
            body: >-
              SEBI's ongoing tightening of retail equity derivative regulations represents the most material systemic
              threat to Raise Financial Services. Given that retail F&O trading provides the bulk of trading volumes and
              revenue for modern discount brokerages, severe regulatory interventions on index option lot sizes or
              margin rules could sharply depress platform transaction income.
            calloutType: risk
            claimRefs:
              - CR001
          - type: callout
            title: Cloud Infrastructure vs Exchange Colocation Trade-off
            body: >-
              While Dhan's proprietary DEXT engine achieves sub-25 millisecond execution speeds, operating core matching
              infrastructure entirely within AWS rather than traditional on-premises exchange colocation creates an
              architectural trade-off between rapid software iteration and exposure to public cloud network transit
              disruptions.
            calloutType: insight
            claimRefs:
              - CR005
              - CR006
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core bull thesis for Raise Financial Services centers on Dhan's high-performance technological moat
              and rapid market share gains within India's active retail trading demographic. Operating its proprietary
              DEXT trading engine, the company has scaled active users to nearly 950,000 across equities, derivatives,
              ETFs, and mutual funds, reporting FY25 revenue expansion to ₹900 crore alongside historical profitability.
              Conversely, the investment anti-thesis highlights structural vulnerability to regulatory tightening by
              SEBI targeting retail options trading, which represents the primary profit engine for Indian discount
              brokers. Furthermore, public company databases record standalone FY25 revenues of just ₹43.2 crore,
              signaling a sharp discrepancy against consolidated claims that necessitates audited verification.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV009
              - CV011
      - number: '8.2'
        title: Valuation Context and Pricing Discipline
        blocks:
          - type: paragraph
            body: >-
              Raise Financial Services secured its unicorn valuation of $1.2 billion in October 2025 through a $120
              million Series B financing round co-led by Hornbill Capital and MUFG Bank, alongside participation from
              Beenext, DSP Family Office, and JM Financial. This transaction marked a tenfold step-up from its 2022
              Series A valuation of $125 million, which had raised $22 million with $15 million committed to building
              Dhan. However, market intelligence from Caplight underscores that Raise remains a closely held private
              company with no public stock price discovery and absent secondary trading volume. Notably, the Series B
              funding incorporated a secondary stock purchase where foundational venture backers Beenext, 3one4 Capital,
              and Mirae Asset partially liquidated their holdings, signaling early liquidity extraction rather than full
              capital rollover.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV009
              - CV014
      - number: '8.3'
        title: Comparable Valuation Benchmarks and Capital Allocation
        blocks:
          - type: paragraph
            body: >-
              Valuation multiples across the Indian wealthtech landscape are heavily influenced by market incumbents
              Zerodha and Groww, alongside private neobrokers such as Upstox and INDMoney. At a $1.2 billion post-money
              mark, Raise is priced at approximately 11x its claimed ₹900 crore FY25 revenue, which appears demanding
              given emerging regulatory curbs on options turnover. Raise has attempted to justify this multiple by
              allocating capital toward non-broking ecosystem expansion, acquiring EdTech upskilling platform
              Valuationary in 2022 and insurance broker GreenLife Insurance Broking (GIBL) in May 2026 for a planned $15
              million investment. While these acquisitions aim to build a diversified financial super-app, broking
              commissions continue to drive the underlying unit economics, leaving valuation multiples sensitive to
              regulatory shifts.
            claimRefs:
              - CV009
              - CV010
              - CV013
      - number: '8.4'
        title: Scenario Analysis and Downside Protection
        blocks:
          - type: paragraph
            body: >-
              Our scenario framework models prospective three-year return trajectories across bull, base, and bear
              operating cases from the Series B benchmark. In the bull case (25% probability), Dhan achieves full
              validation of its ₹900 crore revenue trajectory, successfully cross-sells insurance and wealth solutions,
              and executes a domestic IPO at a $2.5 billion to $3.0 billion valuation. The base case (50% probability)
              anticipates revenue growth decelerating to 25% annually under SEBI compliance constraints, yielding an
              exit valuation of $1.2 billion to $1.5 billion that prioritizes capital preservation over multiple
              expansion. In the bear scenario (25% probability), aggressive SEBI options curbs compress transaction fee
              revenues toward the standalone statutory run-rate, while venture overhang accelerates down-round pressure,
              dropping enterprise value to between $600 million and $800 million.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV010
              - CV013
      - number: '8.5'
        title: Recommendation, Risk Rating, and Diligence Roadmap
        blocks:
          - type: paragraph
            body: >-
              We assign Raise Financial Services a definitive recommendation of Track, supported by Medium confidence, a
              High risk rating, and a Fair to Stretched valuation stance. While the platform's proprietary trading speed
              and demonstrated customer acquisition momentum represent genuine competitive assets, entering at a $1.2
              billion valuation exposes investors to asymmetric downside risk without audited visibility into
              consolidated financials. Prior to committing growth equity, diligence must rigorously review audited
              statutory balance sheets and P&L schedules to reconcile the reported ₹900 crore FY25 top-line against the
              ₹43.2 crore standalone database record. Investors should also establish clear kill criteria around retail
              derivatives churn, platform stability during peak volatility, and margin compression stemming from SEBI
              mandate compliance.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Stance: Track Pending Financial and Regulatory Clarity'
            body: >-
              While Raise Financial Services has demonstrated remarkable execution velocity and infrastructure
              excellence through Dhan, the $1.2 billion valuation prices in sustained hyper-growth in a retail options
              market facing imminent regulatory tightening from SEBI. Investors should maintain a Track recommendation,
              requiring full audit verification of the ₹900 crore FY25 revenue claim and clarity on unit economic
              resilience before acquiring equity.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV014
          - type: callout
            title: Secondary Liquidity and Cap Table Overhang
            body: >-
              The October 2025 Series B included a significant secondary stock purchase facilitating partial exits for
              early backers including Beenext, 3one4 Capital, and Mirae Asset. Coupled with the lack of secondary market
              pricing transparency reported by Caplight, this secondary selling suggests early investors sought
              liquidity rather than rolling over full exposure, warranting conservative valuation discipline.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV007
