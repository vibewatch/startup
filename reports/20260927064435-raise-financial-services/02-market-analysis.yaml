callouts:
  - calloutType: "insight"
    title: "The Profit Pool Asymmetry in Indian Retail Broking"
    body: "In Indian retail financial markets, user count is a deceptive vanity metric. While active futures and options traders comprise less than 8% of retail demat account holders, their trading frequency drives over 80% of gross broking revenue. Raise Financial's strategic focus on high-frequency derivative traders isolates the category's primary profit pool while avoiding the high acquisition costs and low monetization typical of mass-market mutual fund platforms."
    claimRefs:
      - "CM003"
      - "CM007"
      - "CM010"
  - calloutType: "risk"
    title: "Regulatory Headwinds from SEBI Derivatives Policy Tightening"
    body: "The primary structural constraint facing Dhan's core market is regulatory intervention by SEBI. Successive rounds of regulatory tightening aimed at curbing retail derivatives speculation—including stricter margin requirements and reduced contract flexibility—directly threaten trade frequency. Raise Financial's strategic pivot into Margin Trading Facility (MTF) financing and insurtech distribution represents a critical hedge to diversify revenue away from purely transactional derivatives volume."
    claimRefs:
      - "CM004"
      - "CM010"
      - "CM014"
