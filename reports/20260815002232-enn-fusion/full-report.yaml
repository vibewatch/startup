        title: Pricing model, GTM motion, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >
              ENN Fusion has not disclosed list pricing, realized pricing, or any commercial contract terms. That is
              normal for a pre-commercial fusion company, but it means the pricing discussion must be framed as absence
              rather than evidence. The future GTM motion is most likely direct enterprise and utility-style selling,
              not channel distribution. ENN Energy's existing integrated-energy business suggests a credible corporate
              path to large industrial buyers, energy parks, and local governments; however, there is no public proof
              that those channels have been activated for fusion specifically.


              Sales efficiency is therefore impossible to quantify conventionally. There is no CAC, payback period,
              conversion funnel, or pipeline disclosure. The only meaningful proxy is that hyperscalers and strategic
              industrials have already validated the category with Helion and CFS agreements, while China's policy
              blueprint and industrial-capital interest show there could be domestic buyer demand if ENN reaches
              technical credibility. But because ENN has not yet named a customer, any GTM model remains conjectural.
              The appropriate diligence stance is that ENN may benefit from its parent's buyer network, yet current
