      - number: '7.2'
        title: Operational, Physics, and Technology Risks
        blocks:
          - type: paragraph
            body: >-
              ENN's biggest technical risk remains unchanged: proton-boron fusion is attractive on paper because of its
              aneutronic upside, but it is one of the hardest commercialization pathways in fusion. ENN's own roadmap
              and machine pages show a real experimental program, yet the adverse literature still emphasizes
              bremsstrahlung losses, very high ion-temperature requirements, and the engineering challenge of turning
              plasma success into repeatable power production. For outside investors, the real issue is not whether ENN
              is doing science; it is whether the public record contains enough reactor-grade evidence to separate
              promising experiments from an investable path to net-energy or useful-electricity output. It does not.


              Operationally, that leaves several stack-on-stack risks. EHL-2 is the next tangible program gate, so
              construction delay or underpowered results would immediately transmit into financing pressure. Diagnostic
              uncertainty, subsystem integration, heat exhaust, materials durability, and cyber/control weaknesses can
              also invalidate a seemingly good plasma story. Because ENN has not disclosed public duty-cycle,
              availability, cost, or conversion-efficiency metrics, the right risk posture is to treat technology and
              operational readiness as inseparable until EHL-2 demonstrates not just performance headlines but bankable
              engineering discipline.
