  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              The legal challenge for ENN Fusion is not that regulators have already rejected commercial fusion; it is
              that ENN has not publicly shown a China-specific path from experimental machines to a licensed,
              financeable plant. Its compact-fusion pages describe devices, milestones, and roadmap intent, but they do
              not disclose a plant-grade approval map covering radiation safety, environmental review, waste
              characterization, emergency planning, or the document trail needed for a future commercial machine. That
              gap matters more now that U.S. and international fusion discussions are becoming more explicit about what
              developers must document before commercialization. A company can make physics progress and still lose
              years if legal preparation lags the machine roadmap.


              Geopolitics compounds that uncertainty. ENN is a China-based developer that wants access to specialized
              hardware, software, and international expertise at a time when export controls, restricted-party
              screening, and rare-earth controls are all tightening. Those rules do not make ENN non-viable, but they do
              make supplier diligence, IP assignment, and collaboration governance central underwriting questions. The
              public record also leaves the EERI-to-ENN IP chain under-documented, so investors should treat ownership,
              licensing, and cross-border collaboration terms as first-pass diligence asks rather than as back-office
              detail.
