  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and streams
        blocks:
          - type: paragraph
            body: >
              ENN Fusion does not appear to have commercial revenue today. Public materials frame the business as a
              proton-boron fusion device developer inside the ENN ecosystem, not as a currently selling energy provider.
              The likely future revenue model is the sale of firm electricity or integrated energy capacity once a
              commercial machine exists, potentially bundled through ENN Energy's broader enterprise-energy
              relationships. That is a plausible strategic pathway because ENN Energy already serves millions of
              residential users and hundreds of thousands of industrial and commercial clients in China, but the fusion
              subsidiary has not yet disclosed any pilot tariff, development fee, milestone-payment structure, or
              non-power revenue line that would let an investor build a real near-term forecast.


              The only clearly public financing event at ENN Fusion level is the July 2026 external round that
              reportedly valued the company at about CNY10.6 billion. That round does not prove revenue quality; it
              proves investor willingness to fund a differentiated future-energy story. Management messaging indicates
              the proceeds are earmarked for Helong-2 / EHL-2 device construction and commissioning rather than for
              scaling an already proven commercial engine. In other words, ENN's near-term cash inflow is financing, not
              customer cash. Unless ENN develops paid engineering services, government grants, or strategic development
              contracts that have not been disclosed, revenue recognition remains a future-state issue tied to whether
              fusion output can become a product rather than a laboratory milestone.
