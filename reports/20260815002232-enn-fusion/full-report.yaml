chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Corporate Footprint
        blocks:
          - type: paragraph
            body: >-
              ENN Fusion Technology was formally incorporated in 2025 as Beijing ENN Fusion Energy Technology Co., Ltd.,
              the commercial vehicle for fusion R&D that ENN Group had been funding inside its ENN Energy Research
              Institute (EERI) since 2017. Corporate filings place the registered address in Tongzhou District, Beijing;
              the experimental-device facilities are in Langfang, Hebei, where the parent conglomerate's research campus
              is located.


              ENN Group (romanized also as Xinao Group) was founded in 1989 by Dr. Wang Yusuo in Langfang, Hebei,
              beginning as a city-gas distributor before expanding into the full natural-gas value chain and broader
              clean energy. By 2025 the group's consolidated revenues exceeded ¥150 billion (~US$21 billion), it
              employed more than 40,000 people, and its city-gas subsidiary ENN Energy Holdings (2688.HK) served 32.8
              million households and 316,000 commercial clients across 22 Chinese provinces. Other listed entities
              include ENN Natural Gas (600803.SH) and ENC Digital Technology (603869.SH). ENN Fusion is wholly owned by
              EERI, which is in turn controlled by ENN Group; no minority equity holders at the EERI or ENN Fusion
              levels have been disclosed publicly prior to the Pre-A round.


              The company's mission is to be the first entity globally to achieve commercial proton-boron fusion power.
              The p-11B reaction produces three alpha particles (helium nuclei) per fusion event rather than the fast
              neutron and helium nucleus produced by D-T fusion. Theoretically this means no radioactive material
              activation, no tritium breeding, and no neutron-induced damage to reactor structures—advantages ENN
              emphasizes will drive far lower lifetime costs and superior safety profiles relative to D-T plants. The
              scientific viability of p-11B net energy gain remains the central diligence question (addressed in the
              Risks chapter).
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
