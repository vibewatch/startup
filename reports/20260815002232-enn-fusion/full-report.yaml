              but the public record does not tell us their renewal behavior or profitability. Likewise, Microsoft's and
              Google's category-leading fusion agreements show willingness to commit early, not proof of renewal
              outcomes. For ENN specifically, durability remains unproven until the company discloses at least one pilot
