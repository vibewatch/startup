  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Headline Valuation View
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to read ENN Fusion's current price is as a long-dated option on milestone conversion. The
              July 2026 Pre-A round reportedly valued the company at about ¥10.6 billion, or roughly $1.6 billion
              post-money. That is far too high to justify with current operating data because ENN has no disclosed
              revenue, no named customer, and no public plant-economics package. It is also too structured a round to
              dismiss as pure hype, because the syndicate, parent backing, and real machine roadmap signal that
              sophisticated capital is willing to pay for the possibility that ENN becomes one of the few serious p-11B
              fusion contenders.


              The implication is that ENN is priced as scientific and strategic optionality, not as an energy business
              with underwritten cash flows. If EHL-2 converts roadmap language into credible proof and ENN shows a
              cleaner licensing, IP, and customer-formation path, today's mark can look merely early. If proof stalls,
              the same mark can compress sharply because there is little revenue or customer protection underneath it.
              That makes the current valuation intelligible, but still stretched relative to public evidence.
            claimRefs:
