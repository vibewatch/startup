      - number: '2.4'
        title: Growth drivers, constraints, and unresolved market gaps
        blocks:
          - type: paragraph
            body: >
              Demand conditions are favorable, but adoption constraints are still severe. On the positive side,
              data-center power growth, industrial decarbonization, and state support for fusion all expand the
              addressable need for clean firm electricity. FIA's 2026 materials also show that investors and suppliers
              are spending more on fusion capacity. On the negative side, power-market demand does not erase technology
              readiness, supply-chain, financing, and regulatory bottlenecks. FIA's supply-chain report says 69% of
              suppliers still lack long-term visibility and flags fuel-cycle systems, heat management, and first-wall
              materials as future constraints. NRC's fusion framework is becoming clearer in the United States, but
              site-specific safety and environmental work still matters, while China is only beginning to formalize a
              commercial fusion policy stack. For ENN, the biggest market evidence gap is that no public source
              discloses product pricing, target offtake structure, buyer pipeline, or willingness-to-pay data for a
              proton-boron plant. The market thesis is therefore plausible and strategically attractive, but still
              proxy-driven.
