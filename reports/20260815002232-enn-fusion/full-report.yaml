        - Industrial adjacency, talent pool, and policy prestige can accelerate execution
        - Licensing path and IP chain remain under-disclosed
        - Domestic context helps narrative more than proof
      - - Market potential
        - Clean firm power and industrial decarbonization make fusion optionality valuable
        - Commercial cash flows are likely 7-10+ years away
        - Time value and dilution can absorb much of the upside
      - - Team quality
        - Peng, Yuan, Liu, and Wang provide real scientific and institutional weight
        - Key-person concentration is unusually material
        - Successor depth is not yet visible publicly
      - - Relative pricing
        - ENN is cheaper than top-tier global leaders
        - It is not cheap relative to same-stage proof quality
        - Valuation discount may be smaller than the proof discount
