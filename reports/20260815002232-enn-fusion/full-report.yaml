      - number: '2.2'
        title: Sizing lenses and evidence-constrained SAM logic
        blocks:
          - type: paragraph
            body: >
              Public TAM/SAM/SOM math for fusion needs discipline because many published numbers are not
              electricity-market numbers at all. The most conservative way to size ENN's opportunity is to start with
              observed growth drivers. EIA says U.S. electricity consumption is back to growth after a long flat period
              and explicitly flags data-center server energy use as a major factor. JLL projects the global data-center
              sector to add roughly 97 GW between 2026 and 2030 and potentially require as much as $3 trillion of
              capital to support nearly 100 GW of new capacity. Colliers adds that power scarcity, utility deposits, and
              infrastructure-scale execution are now the core determinants of data-center valuation and absorption.
              Those are not direct revenue numbers for ENN, but they do show why buyers are searching for clean firm
              power. The samestudy logic extends to industrial electrification and resource adequacy. ENN's own SOM
              remains effectively zero in public evidence because the company has no disclosed offtake contracts or
              pilot buyers. The nearest credible SOM proxies are peer PPAs and China's state-backed push to move fusion
              from science into engineering.
