      - number: '7.4'
        title: People, Execution, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              People risk is unusually important here because ENN is trying to turn a research-heavy fusion institute
              into a capital-efficient commercialization program. The public team pages make clear that ENN has serious
              named scientists and engineers, but they also suggest concentration around a few visible leaders rather
              than a transparently deep commercial bench. That makes succession, systems engineering, quality
              management, and governance depth material even before the company has to prove a first commercial machine.
              If Dr. Y.K. Martin Peng or other named principals were to leave before EHL-2 demonstrates a credible
              next-step path, investor confidence would likely reset immediately.


              The right response is to impose explicit kill criteria. Investors should require an EHL-2 schedule and
              physics dashboard, parent funding commitments, an IP ownership map, and evidence that customer formation
              is moving from adjacency to named counterparties. If EHL-2 misses its next major gate, if ENN Group
              narrows support, if Peng departs without visible succession, or if licensing and cyber controls remain
              opaque, the valuation case should be re-underwritten rather than rolled forward on hope. In a program this
              long-duration, disciplined stopping rules are as important as upside imagination.
            claimRefs:
