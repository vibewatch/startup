        title: Public financial gaps and verdict
        blocks:
          - type: paragraph
            body: >
              The main financial diligence blocker is not that ENN's numbers look weak; it is that most of the numbers
              do not exist publicly in underwriting form. Investors do not know ENN Fusion's cash on hand, burn, capex
              budget for EHL-2, implied runway from the latest round, customer pipeline, grant inflows, pricing thesis,
              or first-plant economics. Even the attractive headline valuation is easier to read as strategic
              optionality pricing than as evidence of de-risked economics. The scientific literature and MIT economic
              framework cited in this chapter strengthen the cautionary view: fusion needs not only plasma success but
              economic Q greater than one, which depends on capital efficiency, plant durability, and market revenue.


              Financially, ENN should therefore be treated as a high-optionality, high-capital-intensity venture with
              unusual parent support. That combination justifies continued diligence, but not conventional growth-equity
              comfort. The forward underwriting questions are narrow and concrete: how much cash was raised, how long
              does it last, what fraction is committed to EHL-2, what customer-development work is underway, and under
              what conditions would the parent or strategic investors provide the next tranche? Until those answers
