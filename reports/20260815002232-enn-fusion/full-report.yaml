      - number: '5.4'
        title: Bottlenecks, validation, IP posture, and technology verdict
        blocks:
          - type: paragraph
            body: >
              The core technology verdict on ENN is nuanced. On the positive side, ENN has a coherent route, public
              machine specs, named technical leadership, peer-reviewed or preprint-adjacent disclosure, and a concrete
              next-device design. Few private fusion programs disclose this much. On the adverse side, independent
              technical literature still warns that proton-boron fusion is only attractive if bremsstrahlung losses,
              confinement thresholds, alpha handling, and component durability can all be managed together. FIA
              supply-chain evidence adds a second layer of risk: even if the plasma route is sound, heat management,
              power systems, materials, and fuel-system industrialization remain bottlenecks.


              ENN's validation posture is stronger than a black-box startup's but weaker than a fully peer-reviewed
              public-lab program. ITPEA participation and the PST publication package help, yet the company still
              controls most of the information that matters for reactor-level judgment. The appropriate technology
              verdict is therefore "credible but early." ENN has shown enough to justify continued diligence and
              technical respect, but not enough to conclude that ST proton-boron has crossed from elegant science into
              bankable product engineering.
