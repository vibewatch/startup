      - number: '8.2'
        title: Comparable Valuation Framework
        blocks:
          - type: paragraph
            body: >-
              Comparables matter here, but only if they are used with a transferability discount. ENN is valued below
              the most obvious U.S. leaders, especially Helion and Commonwealth Fusion Systems, yet those peers also
              carry stronger public proof stacks: bigger capital bases, clearer customer or offtake evidence, and more
              legible commercialization sequences. TAE is the most analytically relevant same-fuel peer because it also
              sells a proton-boron narrative, which makes ENN's premium over historical TAE-style benchmarks difficult
              to justify without more public physics disclosure. Proxima, Tokamak Energy, and Energy Singularity help
              frame what the market is willing to pay for other private fusion stories, but they also remind investors
              that geography, modality, customer proof, and plant architecture all change valuation transferability.


              The right comp conclusion is therefore directional, not formulaic. ENN is not priced like a bargain
              relative to same-stage frontier science risk. It is priced above most early or regionally scaled fusion
              peers because it combines ENN Group sponsorship, China industrial adjacency, and a bold p-11B vision. It
              is still priced below the top-tier global leaders because those peers have spent more capital, shown more
              commercialization proof, or both. That makes ENN a premium pre-proof asset rather than a cheap shadow of
              Helion or CFS.
