  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct fusion peer landscape
        blocks:
          - type: paragraph
            body: >
              The practical peer set for ENN is smaller than the total number of private fusion companies. The relevant
              direct competitors are the firms that either compete for the same future firm-power buyers or prove
              alternative technical routes to the same market. Commonwealth Fusion Systems (CFS) is the best-funded
              private fusion company and the clearest commercial-scale tokamak competitor. Helion is the most
              commercially visible FRC competitor because of its Microsoft contract and $15.5 billion valuation. TAE is
              the nearest fuel-route cousin because it also frames hydrogen-boron fusion as a cleaner long-run
              destination, although its machine design is a beam-driven FRC rather than a spherical torus. Proxima
              Fusion represents the strongest European stellarator entrant. Pacific Fusion and Focused Energy matter as
              well because they show how quickly fresh capital can back radically different inertial or pulsed
              approaches. ENN therefore operates in a field where no single architecture has won, but where visible
              buyer proof and funding depth already create a tiering of perceived credibility.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
