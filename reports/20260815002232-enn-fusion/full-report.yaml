      - number: '3.4'
        title: Substitutes, adverse competitor evidence, and likely entrants
        blocks:
          - type: paragraph
            body: >
              The competitive threat to ENN is not only other fusion startups. Advanced fission, gas-backed firm power,
              and energy-infrastructure strategies built around power certainty can capture the same procurement budgets
              before ENN reaches product readiness. Even within fusion, adverse evidence matters. TechCrunch's April
              2026 reporting highlights growing concern that some fusion companies are racing capital formation ahead of
              proof. FIA's supply-chain data show that the whole sector still lacks long-term visibility and key
              industrial bottlenecks remain unresolved. Those warnings apply to ENN too, especially because its route is
              physically more demanding than mainstream D-T programs. Likely entrants will keep appearing because buyers
              care about clean firm power, not brand loyalty to one machine class. That means ENN must treat early
              customer proof and ecosystem leverage as strategic priorities rather than assuming that technical novelty
              alone will create a lasting moat.
