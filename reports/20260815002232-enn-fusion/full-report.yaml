      - number: '5.3'
        title: Roadmap, scaling logic, and platformization
        blocks:
          - type: paragraph
            body: >
              EHL-2 is the key bridge between ENN's current science program and any future product. ENN's own
              description gives concrete target parameters: roughly 1.05 m major radius, 3 T central field, 3 MA plasma
              current, 17 MW NBI heating, and 6 MW ECRH. The stated mission is not yet to sell electricity but to solve
              the core scientific and technological challenges of ST proton-boron fusion, verify feasibility, and
              provide a foundation for larger follow-on platforms. That is the right sequencing for a serious fusion
              program: EHL-2 is positioned as a high-value proving platform, not an over-marketed commercial reactor.


              The roadmap also benefits from China's wider fusion ecosystem. CAS and SCIO materials show a national
              environment that is advancing tokamak science, density-limit work, and commercialization ambitions. ENN
              can therefore build on a stronger domestic fusion stack than its subsidiary status alone would imply.
              Still, roadmap credibility depends on execution cadence. Mid-2027 construction completion for EHL-2 is
              ambitious, and any slippage would ripple into every commercial timetable. The roadmap is plausible as a
              research plan, but productization remains at least one major platform beyond EHL-2.
