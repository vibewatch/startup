            body: >
              ENN's current experimental platform is EXL-50U, the upgraded successor to EXL-50. Official pages state
              that EXL-50U achieved first plasma in January 2024 and then reached a one-megaampere hydrogen-boron
              plasma-current milestone in April 2025, with 1.2 tesla magnetic field performance and stated fulfillment
