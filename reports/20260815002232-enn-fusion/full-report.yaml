              ENN's expansion logic is intuitive: use parent relationships, start with large energy-intensive or
              politically strategic buyers, prove one deployment, and then expand through reference value. But the
              concentration risk is equally intuitive. The first real customer would likely dominate the commercial
              narrative, and potentially the first several years of revenue, because fusion deployments will be bespoke
