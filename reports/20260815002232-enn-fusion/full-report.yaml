      - number: '8.4'
        title: Investment Decision and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              At the current price, ENN is difficult to underwrite as a lead investment unless an investor has unusually
              strong technical conviction in the proton-boron path and privileged access to non-public diligence. The
              price is not absurd: ENN has a real parent, a real machine roadmap, a real scientific identity, and a real
              place inside the global fusion conversation. But it is stretched relative to public proof because the
              legal chain, cap-table terms, customer timeline, and EHL-2 economics are all still too opaque. That argues
              for a track or research-more stance rather than a buy-at-any-price posture.


              The diligence agenda is therefore unusually concrete. Investors need the EHL-2 schedule and budget, the IP
              chain from EERI into ENN Fusion, retention and succession terms for Dr. Peng and the engineering bench,
              parent funding commitment letters, and a live view of customer-formation progress. If those artifacts are
              strong, the price can become defensible. If they are weak, the company still may be scientifically
              interesting, but the valuation should be treated as headline momentum rather than investable proof.
