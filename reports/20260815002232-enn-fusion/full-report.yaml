subtitle: China's Highest-Valued Private Fusion Startup — Ambitious Proton-Boron Moonshot at a ~$1.6B Seed Mark
coverageNotes: >
  ENN Fusion is a private, pre-revenue fusion company whose public disclosure is materially thinner than that of many
  Western peers. Public evidence strongly supports the company’s existence as a 2025-incorporated subsidiary of ENN
  Energy Research Institute, its proton-boron / compact-fusion technical orientation, and a July 2026 external financing
  that reportedly valued the company at roughly $1.6 billion. Public evidence does NOT disclose ENN Fusion standalone
  financial statements, burn, cap table, financing terms, named customers, plant economics, or a commercial licensing
  path. Parent ENN entities disclose substantial scale and resources, but those parent metrics are not a substitute for
  subsidiary fundamentals. All valuation views in this report are therefore scenario-based option-value judgments rather
  than earnings-based underwriting.
