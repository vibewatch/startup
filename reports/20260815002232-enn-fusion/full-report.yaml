            body: >
              There is no public ENN Fusion retention data because there is no disclosed customer cohort yet. No NRR,
              GRR, churn, contract duration, satisfaction metric, or repeat-purchase evidence exists. That means any
              retention discussion must be framed as a proxy. The useful proxy is structural: if a future fusion plant
              is deployed into a customer's physical energy system, switching costs should become high because
              replacement would involve infrastructure, permitting, engineering redesign, and business-continuity risk.
              This logic is consistent with the long-lived nature of energy infrastructure and with ENN Energy's broader
              integrated-energy delivery model.


