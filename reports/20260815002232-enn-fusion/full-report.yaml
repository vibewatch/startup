      - number: '1.4'
        title: Milestones, Devices, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              ENN Fusion's development arc is characterized by a decade of internally funded scientific and engineering
              work followed by a 2025 spinout and 2026 external financing.


              The program has built three generations of experimental device. Xuanlong-50 (EXL-50) was the first
              spherical torus constructed by ENN, achieving first plasma in 2018. EXL-50U (Xuanlong-50U) is the upgraded
              second-generation device, featuring a major radius of 0.6–0.8 m, minor radius 0.32–0.5 m, and target
              plasma current up to 1.5 MA; it entered full operations in 2024. In April 2025, EXL-50U achieved a
              world-first in spherical-torus physics: a plasma current of 1 million amperes (1 MA) using hydrogen-boron
              fuel, with stable 1.2 T toroidal field and TF coils operating at 150 kA. ENN describes this as
              establishing the key experimental prerequisites for p-11B fusion.


              Helong-2 (EHL-2) is the third-generation device, now under construction. Completion is targeted for Q4
              2027. It is designed to test the plasma conditions necessary to approach energy gain (Q>1). If successful,
              the roadmap calls for plasma ignition ~2030 ("lighting the world's first lamp via p-11B fusion") and a
              commercial demonstration reactor ~2035.


              In 2026, ENN Fusion became the first private Chinese company—and only the second private entity
              globally—to join the International Tokamak Physics and Engineering Activities (ITPEA), a ITER-associated
              body, providing formal international peer-review channels.
