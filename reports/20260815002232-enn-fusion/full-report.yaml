      - number: '4.4'
        title: Capital adequacy, runway, and financing dependency
        blocks:
          - type: paragraph
            body: >
              ENN's financing position must be read through both the subsidiary and parent lenses. At the subsidiary
              level, the disclosed signal is a first outside financing round in July 2026 at roughly CNY10.6 billion
              post-money, reportedly to fund Helong-2 construction and commissioning. That is a powerful vote of
              confidence, but it is not evidence that ENN has enough capital to reach commercial readiness. The exact
              round size, current cash balance, monthly burn, hiring plan, and device budget remain undisclosed. Given
              the sector's capital intensity and the fact that much better-known peers continue to raise very large
              rounds, ENN should be assumed to need repeated financing before any bankable fusion plant exists.


              At the parent level, ENN benefits from a much more substantial platform than a typical seed-stage hardware
              startup. ENN Energy's annual-results materials and business profile show a scaled listed enterprise with
              millions of customers, a large project base, and an integrated-energy strategy. That does not mean the
              parent will fund fusion indefinitely, but it materially improves ENN's credibility with investors,
              suppliers, and local stakeholders. The practical conclusion is that ENN's near-term solvency risk is
              probably lower than that of a standalone startup at the same technical stage, while its long-term
              project-finance risk remains very high because no public evidence yet supports debt-style underwriting of
