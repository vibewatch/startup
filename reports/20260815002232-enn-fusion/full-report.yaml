      - number: '1.2'
        title: Funding History, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >-
              ENN Fusion entered 2026 with no external equity on its balance sheet. From 2017 to 2025, ENN Group
              channeled more than ¥4 billion (~US$590 million) into fusion R&D through EERI—a level of internal
              commitment that makes ENN Group arguably the largest private single-entity fusion investor globally by
              cumulative pre-external-capital spend.


              In July 2026 the company completed its first external round, a Pre-A, at a post-money valuation of ¥10.6
              billion (~US$1.6 billion). The total capital raised was not disclosed. Loongson Venture Capital (Longxin
              Private Equity Venture Capital Fund Management) led, with CAS Star (Chinese Academy of Sciences commercial
              arm) and Matrix Partners China as co-leads. Participating investors included CDH Investments, Cathay
              Capital, SAIC Hengxu Capital (SAIC Motor Group's venture arm), Legend Star, China Merchants Zhiyuan, and
              E-Town Capital (Beijing government-affiliated). The investor cohort spans state-aligned entities (CAS
              Star, E-Town Capital), industrial strategics (SAIC Hengxu), and mainstream tech-sector VC (Matrix Partners
              China, CDH, Cathay).


              Disclosed use of proceeds: Helong-2 (EHL-2) construction and commissioning, technology capability
              upgrades, and expansion of the senior R&D team. No revenue guidance was published. No secondary
              transactions or debt financing have been disclosed to date.
