  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Route selection and design basis
        blocks:
          - type: paragraph
            body: >
              ENN's product-technology thesis starts with a non-mainstream but coherent design choice: spherical-torus
              proton-boron fusion (STPBF). Official ENN materials frame proton-boron as attractive because it uses
              abundant fuel, minimizes neutron radiation, and may enable direct energy conversion. That story is
              directionally consistent with broader p-11B literature, which also highlights lower neutron burden and
              attractive byproducts. But the same literature emphasizes why this route remains hard: higher Coulomb
              barrier, demanding temperature windows, and potentially severe bremsstrahlung-loss constraints if plasma
              conditions are not managed carefully.


              ENN's choice of spherical torus rather than a conventional large tokamak or FRC matters commercially and
              technically. A spherical torus promises compactness and strong confinement potential, which can support a
              distributed or modular commercial narrative if the physics scales. It also creates a differentiated lane
              versus Helion's FRC, CFS's compact tokamak, and Proxima's stellarator. The design basis therefore makes
              strategic sense: ENN is not trying to win the same exact race as U.S. tokamak or FRC peers. However, it
              also means ENN bears proof burden on two fronts at once — the proton-boron fuel route and the specific
              machine geometry / scaling path chosen to make it practical.
