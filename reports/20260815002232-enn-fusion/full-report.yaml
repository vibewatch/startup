  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments, users, and payers
        blocks:
          - type: paragraph
            body: >
              ENN Fusion is not building a consumer product. The probable buyer set is enterprise and grid-facing:
              hyperscalers and large data-center operators seeking clean firm power, industrial companies with very
              large continuous electricity or heat demand, local governments or industrial parks trying to anchor
              future-energy infrastructure, and utility-style entities that can contract long-duration generation. The
              likely users are operations teams, power planners, and energy managers; the likely payers are corporate
              procurement, infrastructure, utility, or municipal budget owners.


              The strongest public commercial adjacency is not at ENN Fusion itself but at ENN Energy. ENN Energy's
              official materials show a very large enterprise and household footprint, plus an integrated-energy
              business built around tailored energy-carbon solutions. That matters because it implies ENN does not need
              to invent a China enterprise-energy distribution network from scratch. However, it would be a mistake to
              treat the parent customer base as automatic fusion demand. A city-gas or integrated-energy relationship
              can open doors, but a first-of-a-kind fusion contract would still face long diligence cycles, siting
              questions, and extreme technology risk.
