  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >
              ENN Fusion sits inside a market that is best defined by buyer pain rather than by reactor labels. The
              broadest outer boundary is the electricity market, but that ceiling is too blunt for diligence. The more
              decision-useful boundary is the firm, dispatchable, carbon-free power segment that can solve for
              reliability, permitting pressure, and decarbonization at the same time. This excludes pure intermittent
              generation sold without a firming layer and it differs from the broader "fusion industry" statistics that
              mix R&D, equipment, infrastructure, and services. For ENN specifically, the closest demand wedge is
              large-load power where power certainty matters: hyperscale data centers, industrial users with
              round-the-clock electricity needs, and grid operators facing rising demand plus decarbonization targets.
              Status-quo substitutes include advanced fission, gas plus CCS, geothermal, long-duration storage paired
              with renewables, and continued grid purchases. ENN's proton-boron strategy only matters commercially if it
              can beat or complement those options on siting flexibility, cost, and firm-power quality rather than
              merely on scientific novelty.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM012
              - CM015
              - CM022
              - CM031
