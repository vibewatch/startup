      - number: '4.3'
        title: Cost structure, gross-margin drivers, and unit economics
        blocks:
          - type: paragraph
            body: >
              ENN's cost structure is dominated by research personnel, specialized experimental infrastructure, power
              systems, diagnostics, vacuum and materials systems, and the capex required to build the next machine.
              Public scientific and industry sources make clear that proton-boron fusion is economically attractive only
              if very demanding physics and engineering thresholds are met. That means ENN's cost base is not just
              "deep-tech R&D" in the generic sense; it includes a fuel route that may require more temperature, tighter
              control of radiation losses, and more demanding component performance than mainstream deuterium-tritium
              programs. Fusion-wide supply-chain data reinforce this concern: the sector is increasing spend rapidly,
              yet fuel systems, extreme-condition materials, heat management, and power components remain bottlenecks.


              Unit economics are therefore mostly unobservable. There is no public cost-per-MW, no plant capex estimate,
              no maintenance curve, no yield assumption, no capacity-factor disclosure, and no conversion-efficiency
              disclosure that is sufficient for underwriting. The best public analytical stance is to separate
              theoretical attractiveness from current calculability. Proton-boron could eventually reduce
              neutron-related shielding, waste, and decommissioning burdens; but if bremsstrahlung losses, ash handling,
              or device complexity keep plant economics unattractive, that theoretical advantage will not matter. ENN's
              margin path is thus undefined rather than merely negative.
