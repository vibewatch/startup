summary:
  headline: >
    ENN Fusion is a credible, parent-backed Chinese fusion moonshot with a real proton-boron technical program and a
    reported ~$1.6B July 2026 valuation, but the public evidence still looks like option value rather than investable
    fundamentals: no revenue, no named customers, no plant economics, and no clear licensing path. The right call is to
    track it closely or invest only with strong structure and milestone discipline.
  overallScore: 5.6
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
