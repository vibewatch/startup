      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              ENN 可能的早期买方，可以按对技术新颖性的容忍度和用电需求紧迫度分层。超大规模数据中心运营商是最清晰的领先客群，因为它们已经签长期清洁电力协议，
              而且越来越重视电力确定性，地理位置反而退居其次。Commonwealth Fusion Systems 与 Google 的 200 MW 协议，以及 Helion 与 Microsoft 的 PPA
              重要之处在于：如果战略叙事足够强，成熟买方会在商业运行前就为聚变签约。重工业是第二类客群：电炉钢、化工、氢能和高耗能制造，都需要与生产周期匹配的清洁电力，
              而不只是年度证书。公用事业和电网运营商是第三类客群；它们天然是规模买方，但通常需要更长的审批和证据周期。在中国本土语境下，ENN 母公司的企业能源版图，
              给公司提供了触达工业客户的关系邻近性；但公开证据还没有显示这些客户已经转化为聚变买方。因此，采用路径会从同行市场的战略验证客户，走向工业试点，再更晚走向更广泛的电网部署。
