      - number: '5.2'
        title: 当前装置状态与里程碑质量
        blocks:
          - type: paragraph
            body: >
              ENN 当前实验平台是 EXL-50U，也就是 EXL-50 的升级后继装置。官方页面称，EXL-50U 于 2024 年 1 月实现首次等离子体，并在 2025 年 4
              月达到一兆安氢-硼等离子体电流里程碑，同时实现 1.2 tesla 磁场性能并完成既定工程目标。这些披露有意义，因为它们给出机器参数，而不只是营销语言。 ENN 加入 ITPEA，以及发布大体量 EHL-2
              论文包，也通过显示与更广泛聚变共同体的外部整合，增强了可信度。


              话虽如此，里程碑质量必须谨慎解读。1 MA p-B11 等离子体里程碑重要，但不等于展示了产电条件或商业相关的能量平衡。公开来源没有显示电站级输出、净电力或已验证成本路径。 正确解读是，ENN
              已经从概念阶段叙事走向真实造机和物理生成，但仍处于实验状态，而不是产品状态。
