chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与公司布局
        blocks:
          - type: paragraph
            body: >-
              ENN Fusion Technology 于 2025 年以 Beijing ENN Fusion Energy Technology Co., Ltd. 的形式正式注册，是 ENN Group 自 2017
              年起在 ENN Energy Research Institute（EERI）内部资助聚变 R&D 后设立的商业化载体。工商文件显示，注册地址在北京市通州区；
              实验装置设施位于河北廊坊，也就是母公司集团研究园区所在地。


              ENN Group（也罗马化写作 Xinao Group）由 Wang Yusuo 博士于 1989 年在河北廊坊创立，最早是一家城市燃气分销商，后来扩展到完整天然气价值链和更广泛的清洁能源。 到 2025
              年，集团合并收入超过 ¥150 billion（约 US$21 billion），员工超过 40,000 人；旗下城市燃气子公司 ENN Energy Holdings（2688.HK）在中国 22 个省份服务
              32.8 million 户家庭和 316,000 家商业客户。其他上市实体包括 ENN Natural Gas（600803.SH）和 ENC Digital Technology（603869.SH）。ENN
              Fusion 由 EERI 全资持有，EERI 则受 ENN Group 控制； Pre-A 轮之前，EERI 或 ENN Fusion 层面没有公开披露少数股东。


              公司的使命是成为全球第一个实现质子-硼聚变发电商业化的主体。p-11B 反应每次聚变产生三个 α 粒子（氦核），而不是 D-T 聚变产生的快中子和氦核。
              理论上，这意味着没有放射性材料活化、无需氚增殖，也没有中子诱发的反应堆结构损伤——ENN 强调，这些优势相对 D-T 电站会带来低得多的全生命周期成本和更优的安全性。 p-11B
              净能量增益能否科学上跑通，仍是本次尽调的核心问题（风险章节会展开）。
