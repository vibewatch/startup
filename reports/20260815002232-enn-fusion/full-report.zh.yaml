      - number: '4.4'
        title: 资本充足性、现金跑道与融资依赖
        blocks:
          - type: paragraph
            body: >
              ENN 的融资位置必须同时从子公司和母公司两层读。子公司层面，已披露信号是 2026 年 7 月首轮外部融资，投后估值约 CNY10.6 billion，据报道用于 Helong-2
              建设和调试。这是有力的信心票，但不能证明 ENN 有足够资本走到商业就绪。确切轮次规模、当前现金余额、月度烧钱速度、招聘计划和装置预算都未披露。
              考虑到行业资本强度，以及知名度高得多的同行还在持续募集大额轮次，应该假设 ENN 在任何可被银行融资的聚变电站出现前，还需要反复融资。


              母公司层面，ENN 拥有的平台比典型种子期硬件创业公司厚实得多。ENN Energy 的年度业绩材料和业务画像显示，它是一家规模化上市企业，拥有数百万客户、
              大型项目基础和一体化能源战略。这不意味着母公司会无限期资助聚变，但确实显著提升 ENN 在投资者、供应商和地方利益相关方眼中的可信度。 实际结论是，与同一技术阶段的独立创业公司相比，ENN
              近期偿付风险大概更低；但长期项目融资风险仍然很高，因为公开证据还没有支持一座质子-硼电站的债务式承销。
