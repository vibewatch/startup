      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              公开证据只能诚实地支持情景分析。乐观情景假设 ENN 将 EHL-2 转化为真正的验证台阶，厘清从实验到电站的路径，并保持足够资本和科学连续性，使 2030
              点火叙事不断档。到那时，今天的价格可能显得早，因为市场会开始给无中子聚变的稀缺价值定价，而不只是给实验室进展定价。基准情景没那么戏剧化：EHL-2 有帮助，但时间表滑坡，客户开发滞后，ENN
              在像商业能源公司之前，还需要多年时间出清技术和法律风险。


              悲观情景不是温和下行，而是最需要警惕的情形。如果制动辐射、约束、子系统集成或排期滑坡，让 ENN 无法证明通往 Q>1
              或具备经济意义性能的可信路径，估值可能回落到战略资产价值，甚至接近归零的期权价值。因此，即便上行空间仍然很大，下行概率也必须保持高位。分布很宽，因为聚变可选性真实存在，但证据仍然稀缺。
