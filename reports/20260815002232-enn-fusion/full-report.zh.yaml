      - number: '7.4'
        title: 人才、执行与止损标准
        blocks:
          - type: paragraph
            body: >-
              这里的人才风险格外重要，因为 ENN 要把研究导向的聚变研究院，改造成资本效率更高的商业化项目。公开团队页面显示，ENN
              有严肃的具名科学家和工程师，但也显示可见领导层集中在少数人身上，商业化梯队的厚度并不透明。因此，在公司还没证明首台商业化机器之前，接班安排、系统工程、质量管理和治理深度就已经是实质问题。如果 Dr. Y.K.
              Martin Peng 或其他具名核心人物在 EHL-2 证明可信的下一步路径前离开，投资人信心很可能立刻重置。


              正确做法是设置明确的止损标准。投资人应要求 EHL-2 时间表和物理指标看板、母公司资金承诺、IP 归属图谱，以及客户开发正从相邻业务走向具名交易对手的证据。如果 EHL-2 错过下一个重大关口、ENN
              Group 收窄支持、Peng 离职且看不到接班人，或授权许可和网络安全控制仍不透明，估值逻辑就应重新核算，而不是靠希望顺延。项目周期这么长，纪律化的停止规则和上行想象一样重要。
            claimRefs:
              - CR029
              - CR030
              - CR031
