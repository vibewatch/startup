      - number: '3.3'
        title: 切换成本、分发能力与护城河韧性
        blocks:
          - type: paragraph
            body: >
              聚变的切换成本仍大多处于商业化前阶段，所以护城河分析不应主要看装机基础锁定，而要看谁先拿到稀缺外部验证。今天客户侧的切换成本主要是声誉和合同成本：
              一旦超大规模云厂商或工业锚定客户把工程时间、输电规划或公开承诺分配给某一家聚变供应商，这个承诺就会变成真实优势。Helion 和 CFS 已经受益于这种效应。ENN 还没有。
              供应侧切换成本更微妙。聚变项目依赖诊断、电力电子、控制、材料和专门物理人才的稀缺组合。ENN 的母公司平台和廊坊研究基地大概有助于国内招聘和基础设施， 但公开记录没有显示足以让 ENN
              结构性难以被替代的供应商或客户锁定。因此，护城河判断是中等，而不是强：如果 ENN 达到可信的 EHL-2 里程碑，
              它的中国位置和质子-硼细分可能变得鲜明；如果它延误，而同行继续拿客户或资本，差异化可能很快被挤压。
