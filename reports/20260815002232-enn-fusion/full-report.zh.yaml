companyProfile:
  summary: >
    ENN Fusion 是 ENN Group 研发机构 ENN Energy Research Institute 孵化出的聚变能源商业化主体。公开资料显示，公司于 2025 年正式注册，是一家总部位于北京的子公司，同时技术工作横跨
    ENN 位于河北廊坊的研究园区。核心投资逻辑是紧凑型质子-硼（p-11B）聚变： 如果无中子路线跑通，就能避开氘-氚聚变的许多中子管理负担。公司的差异化是真的，难度也是真的。约 2017 年起，ENN 在母公司体系内持续重投聚变
    R&D，搭起 EXL / EHL 实验装置谱系，并在 2026 年 7 月以据报道约 $1.6 billion 的估值拿到首轮已披露外部融资。公司仍未产生收入，没有公开具名客户， 没有披露商业电站经济性，也没有公开讲清商业授权路径。
