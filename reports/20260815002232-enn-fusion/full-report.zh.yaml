      - number: '1.3'
        title: 创始团队与科研负责人
        blocks:
          - type: paragraph
            body: >-
              ENN Group 创始人兼董事长 Wang Yusuo，是战略创始人和主要资本支持方。作为清洁能源领域的亿万富豪，他自约 2017 年起持续投入 ENN 资源做聚变，
              扮演长期耐心资本锚点。他并不担任正式的等离子体物理岗位。


              Minsheng Liu 博士是 EERI 院长、聚变技术 R&D 中心主任。他拥有清华大学化学工程博士学位，带领 ENN 扩展 R&D 版图，涵盖生物能源和聚变。
              他连接母公司集团的治理结构和聚变项目的运营需求。


              Y.K.（Martin）Peng 博士是首席科学家，也是该项目的智力核心。Peng 博士是斯坦福 PhD 物理学家，20 世纪 80 年代发明球形托卡马克（ST）概念， 并共同创立 Princeton
              Plasma Physics Laboratory（PPPL）的 National Spherical Torus Experiment（NSTX），担任首席研究员之一。 他从美国国家实验室体系加入
              ENN，在全球聚变圈被广泛视为 ENN 认真投入的信号。


              Baoshan Yuan 担任总工程师。他此前曾任成都 Southwestern Institute of Physics（SWIP）副所长；该所运营中国 HL-2A 托卡马克，是中国西南地区主要国家聚变装置。
              他的工程背景把政府项目经验和民营公司走向商业规模的需求接了起来。


              其他资深研究人员包括 Kaiming Feng 教授（反应堆理论）、Hua-sheng Xie 博士（等离子体理论与模拟）、Bihe Deng 博士（诊断）和 Bing Liu
              博士（实验物理）。2024–2026 年， 团队围绕 EXL-50/50U 结果，在 Nuclear Fusion（IOP）和 Physics of Plasmas（AIP）发表了十多篇同行评审论文。Yicai
              Global 报道称， 2026 年中员工总数约 300 人。
