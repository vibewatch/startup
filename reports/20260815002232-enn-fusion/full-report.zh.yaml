      - number: '8.4'
        title: 投资决策与尽调要求
        blocks:
          - type: paragraph
            body: >-
              按当前价格，ENN 很难作为主导投资来承销，除非投资人对 proton-boron 路线有格外强的技术确信，并能拿到非公开尽调材料。这个价格并非荒唐：ENN
              有真实母公司、真实机器路线图、真实科学身份，也真实进入了全球聚变讨论。但相对公开证据仍然偏高，因为法律链条、股权结构表条款、客户时间表和 EHL-2
              经济性都仍过于不透明。因此，更适合观察或继续研究，而不是不计价格买入。


              尽调清单因此格外具体。投资人需要 EHL-2 时间表和预算、从 EERI 到 ENN Fusion 的 IP 链条、Dr. Peng
              和工程梯队的留任与接班条款、母公司资金承诺函，以及客户开发进展的实时视图。如果这些材料扎实，价格才站得住；如果它们很弱，公司可能仍有科学价值，但估值应按头条动量看，而不是可投资证据。
