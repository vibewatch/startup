        - 跟踪团队页面、论文和管理层公告
      - - ENN Group 撤回资金支持
        - 母公司收窄未来资本支持，或为支持附加条件
        - 任何时候
        - 终止：流动性和议价能力迅速压缩
        - 跟踪母公司声明、年度业绩和融资轮投资方广度
      - - 出口管制或合作限制认定
        - 硬件、软件或顾问限制显著压缩 ENN 的选择空间
        - 2026-2028
        - 投资逻辑削弱：执行成本上升，学习循环放慢
        - 跟踪 BIS / 贸易指引和合作变化
      - - 下一次大额融资前仍无具名试点或购电协议
