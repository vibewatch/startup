  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方分层、使用者与付款方
        blocks:
          - type: paragraph
            body: >
              ENN Fusion 做的不是消费产品。可能的买方集合面向企业和电网：寻找清洁稳定电力的超大规模云厂商和大型数据中心运营商、有极大连续电力或热需求的工业公司、
              想锚定未来能源基础设施的地方政府或产业园区，以及能够签长期发电合同的公用事业型主体。可能的使用者是运营团队、电力规划人员和能源经理；可能的付款方是企业采购、 基础设施、公用事业或市政预算负责人。


              最强的公开商业邻近性不在 ENN Fusion 自身，而在 ENN Energy。ENN Energy 官方材料显示，它拥有非常大的企业和家庭客户覆盖，以及围绕定制化能源-碳解决方案搭建的一体化能源业务。
              这很重要，因为它意味着 ENN 不必从零发明一张中国企业能源分发网络。但把母公司客户基础当成自动的聚变需求会是误判。城市燃气或一体化能源关系能开门， 但首创型聚变合同仍会面对漫长尽调周期、选址问题和极端技术风险。
