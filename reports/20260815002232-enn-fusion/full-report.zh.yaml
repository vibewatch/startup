      - number: '1.4'
        title: 里程碑、装置与路线图
        blocks:
          - type: paragraph
            body: >-
              ENN Fusion 的发展轨迹，是十年内部资助的科学与工程积累，接上 2025 年剥离和 2026 年外部融资。


              该项目已经建成三代实验装置。Xuanlong-50（EXL-50）是 ENN 建造的第一台球形环装置，2018 年实现首次等离子体。EXL-50U（Xuanlong-50U）是升级后的第二代装置， 主半径
              0.6–0.8 m，小半径 0.32–0.5 m，目标等离子体电流最高 1.5 MA；2024 年进入全面运行。2025 年 4 月，EXL-50U 在球形环物理上实现世界首创： 使用氢-硼燃料达到 1
              million 安培（1 MA）等离子体电流，稳定环向场 1.2 T，TF 线圈以 150 kA 运行。ENN 称，这为 p-11B 聚变建立了关键实验前提。


              Helong-2（EHL-2）是第三代装置，目前正在建设。目标是在 2027 年 Q4 完成。它的设计任务是测试接近能量增益（Q>1）所需的等离子体条件。如果成功， 路线图指向约 2030
              年实现等离子体点火（“用 p-11B 聚变点亮世界第一盏灯”），并在约 2035 年建成商业示范堆。


              2026 年，ENN Fusion 成为第一家加入 International Tokamak Physics and Engineering
              Activities（ITPEA）的中国民营公司，也是全球第二家加入的民营主体。 ITPEA 与 ITER 有关联，为公司提供了正式的国际同行评审渠道。
