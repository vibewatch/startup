      - number: '6.2'
        title: 当前采用轨迹与验证质量
        blocks:
          - type: paragraph
            body: >
              ENN Fusion 的直接采用轨迹很简单：公开层面仍没有客户部署。公司没有宣布具名试点、PPA、LOI 或电站业主。这一缺失就是本章的核心商业事实。 已经存在的是间接、品类层面的验证。母公司层面，ENN
              Energy 报告了大型企业触达、超过 6,000 个一体化能源客户，以及数百个运营项目。 更广泛的聚变品类层面，Microsoft 与 Helion 签约，Google 与 CFS 签约，Eni 也签下 CFS
              输出。这些交易不能证明 ENN 会被采用， 但证明成熟买方愿意在交付前多年就承销聚变期权。


              因此，正确解读是非对称的。ENN 没有直接客户验证，这会削弱任何近期商业信心评分。但这个品类已经不再是买方意愿为零：全球锚定客户已经开始下注， 尤其在 AI 和工业脱碳带来清洁稳定电力压力的场景里。如果 ENN
              能把母公司网络和中国工业存在感转化为哪怕一个可信试点或锚定购电方，验证缺口可能很快缩小。
