      - number: '8.2'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >-
              可比公司有用，但前提是给可迁移性打折。ENN 的估值低于最显眼的美国龙头，尤其是 Helion 和 Commonwealth Fusion
              Systems；但这些同行也有更强的公开证据组合：资本基础更大，客户或承购证据更清晰，商业化节奏更容易读懂。TAE 是分析上最相关的同燃料同行，因为它同样讲 proton-boron 叙事；这让 ENN 相比历史
              TAE 式基准的溢价，在缺少更多公开物理披露时难以站住。Proxima、Tokamak Energy 和 Energy Singularity
              能帮助框定市场愿意为其他私营聚变故事支付什么价格，但它们也提醒投资人，地域、技术形态、客户验证和电站架构都会改变估值可迁移性。


              因此，正确的可比结论应是方向性的，不是公式化的。相对同阶段前沿科学风险，ENN 不是便宜货。它的估值高于多数早期或区域化聚变同行，因为它把 ENN Group 赞助、中国工业相邻场景和大胆的 p-11B
              愿景组合在一起。它仍低于全球第一梯队龙头，因为那些同行投入资本更多，商业化证据更多，或两者兼有。因此，ENN 是一个溢价的验证前资产，而不是 Helion 或 CFS 的廉价影子。
