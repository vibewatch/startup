      - number: '6.4'
        title: 扩张路径、集中度与商业判断
        blocks:
          - type: paragraph
            body: >
              ENN 的扩张逻辑直观：借助母公司关系，从大型高耗能或政治上具战略性的买方开始，证明一次部署，再靠标杆价值扩张。但集中度风险也同样直观。
              第一个真正客户很可能主导商业叙事，甚至主导最初数年的收入，因为聚变部署会是定制化且资本密集的。单个试点失败或交付日期延误，可能同时伤害融资和客户开发。


              商业判断是，ENN 的客户故事理论上可信，直接证据偏弱。公司受益于母公司庞大的企业触达和一体化能源运营，也处在一个超大规模云厂商和工业客户已经表示愿意与同行签早期聚变交易的市场。 但这些都不能替代 ENN
              自身的验证。在 ENN 披露具名试点、客群转化数据，甚至非约束性锚定合作之前，客户案例应被评为渠道邻近，而不是客户已验证。
