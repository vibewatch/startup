  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值主线判断
        blocks:
          - type: paragraph
            body: >-
              解读 ENN Fusion 当前价格，最干净的方式是把它看成押注里程碑兑现的长期期权。2026 年 7 月 Pre-A 轮据报道给公司的投后估值约 ¥10.6B，约合
              $1.6B。这个价格太高，无法由当前经营数据支撑，因为 ENN 没披露收入、没有具名客户，也没有公开的电站经济性材料。它也不是纯粹炒作，因为投资方组合、母公司背书和真实机器路线图都表明，有经验的资本愿意为 ENN
              成为少数严肃 p-11B 聚变竞争者的可能性付费。


              因此，ENN 的定价对应的是科学和战略可选性，不是现金流已经能承销的能源业务。如果 EHL-2 把路线图语言变成可信证据，并且 ENN 交出更清晰的授权许可、IP
              和客户开发路径，今天这个估值只是显得早；如果验证卡住，同一估值可能快速压缩，因为底下几乎没有收入或客户保护垫。因此当前估值可以理解，但相对公开证据仍然偏高。
