      - number: '4.3'
        title: 成本结构、毛利驱动与单位经济
        blocks:
          - type: paragraph
            body: >
              ENN 的成本结构主要由科研人员、专门实验基础设施、电力系统、诊断、真空与材料系统，以及建造下一台机器所需资本开支驱动。公开科学和行业资料清楚显示，
              只有达到非常苛刻的物理和工程门槛，质子-硼聚变才具备经济吸引力。这意味着 ENN 的成本基础不只是泛泛的“深科技 R&D”；它还包含一条燃料路线，
              可能比主流氘-氚项目需要更高温度、更严格控制辐射损失，以及更苛刻的部件性能。整个聚变行业的供应链数据也强化了这一担忧：行业支出正在快速增加， 但燃料系统、极端条件材料、热管理和电力部件仍是瓶颈。


              因此，单位经济基本不可观察。公开资料没有足以支持承销的每 MW 成本、电站资本开支估计、维护曲线、产出假设、容量因子披露或转换效率披露。
              最好的公开分析立场，是把理论吸引力和当前可计算性分开。质子-硼最终可能降低中子相关屏蔽、废物和退役负担；但如果轫致辐射损失、聚变灰处理或装置复杂度让电站经济性失去吸引力， 这点理论优势就不会起作用。因此，ENN
              的毛利路径不是单纯为负，而是尚未定义。
