      - number: '7.3'
        title: 合作伙伴、依赖与资本风险
        blocks:
          - type: paragraph
            body: >-
              按今天的估值看，ENN 更像一个依赖很重的长期期权，而不是已经能自我运转的平台。2026 年 7 月这一轮融资证明，严肃资本愿意进场，也证明 ENN Group
              能托起一个大型前沿科学项目；但它还不能证明，公司脱离母公司持续支持后仍能融到后续资金。核聚变融资仍然看里程碑，ENN
              也还没有公开客户验证、试点主体或承购协议，足以把投资逻辑从科学可选性拓宽到商业化。因此，比起账面投后估值，赞助方宽度、后续投资团质量和母公司承诺更关键。


              依赖图谱不止资金。ENN 还依赖专用材料和硬件、ITPEA 相关参与所代表的政策和声望生态，以及最终能否把 ENN Energy
              的相邻业务变成真实试点或交易对手。每项依赖都撑住今天的故事，也都可能带来不对称失效：供应商掉链子会拉长排期，政策环境转弱会冷却投资人胃口，没有具名试点则意味着下一轮融资仍靠叙事而非收入。因此，ENN
              Group、投资人、交易对手和生态准入上的依赖，必须作为核心风险打分，而不是写成附注。
