coverageNotes: >
  ENN Fusion 是一家民营、尚未产生收入的聚变公司，公开披露明显少于许多西方同行。公开证据有力支持几件事：公司确实存在，是 ENN Energy Research Institute 于 2025
  年设立的子公司；技术方向聚焦质子-硼 / 紧凑型聚变；2026 年 7 月完成外部融资，据报道估值约 $1.6 billion。公开证据没有披露 ENN Fusion
  的独立财报、烧钱速度、股权结构表、融资条款、具名客户、电站经济性或商业授权路径。 母公司 ENN 实体披露了可观规模和资源，但母公司指标不能替代子公司基本面。因此，本报告所有估值观点都是基于情景的期权价值判断，而不是基于盈利的承销判断。
