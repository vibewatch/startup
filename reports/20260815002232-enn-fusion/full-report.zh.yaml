  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接聚变同行格局
        blocks:
          - type: paragraph
            body: >
              ENN 的实用同行集合，比私营聚变公司总数小得多。真正直接的竞争者，是那些要争夺同一批未来稳定电力买方，或用替代技术路线证明同一市场可行性的公司。 Commonwealth Fusion
              Systems（CFS）是融资最多的私营聚变公司，也是最清晰的商业规模托卡马克竞争者。Helion 是商业可见度最高的 FRC 竞争者， 原因是它有 Microsoft 合同和 $15.5 billion
              估值。TAE 是燃料路线最接近的表亲，因为它也把氢-硼聚变包装成更清洁的长期终点，尽管其机器设计是束驱动 FRC， 不是球形环。Proxima Fusion 代表欧洲最强的仿星器新进入者。Pacific
              Fusion 和 Focused Energy 也值得关注，因为它们显示新资本可以多快押注完全不同的惯性或脉冲路线。 因此，ENN 所处赛场还没有任何单一架构胜出，但可见买方验证和融资深度已经开始拉开可信度层级。
