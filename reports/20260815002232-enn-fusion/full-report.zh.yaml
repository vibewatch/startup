  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 技术路线选择与设计依据
        blocks:
          - type: paragraph
            body: >
              ENN 的产品技术逻辑始于一个非主流但自洽的设计选择：球形环质子-硼聚变（STPBF）。ENN 官方材料把质子-硼说成有吸引力，是因为燃料充足、中子辐射最小化， 并可能支持直接能量转换。这个叙事和更广泛的
              p-11B 文献方向一致；后者同样强调更低的中子负担和有吸引力的副产物。但同一批文献也说明这条路线为什么仍然难： 库仑势垒更高、温度窗口苛刻，而且如果等离子体条件管理不好，轫致辐射损失可能很严重。


              ENN 选择球形环，而不是传统大型托卡马克或 FRC，在商业和技术上都重要。球形环承诺更紧凑，并有较强约束潜力；如果物理能放大，就能支撑分布式或模块化商业叙事。 它也让 ENN 与 Helion 的
              FRC、CFS 的紧凑型托卡马克和 Proxima 的仿星器拉开路线。因此，设计依据有战略合理性：ENN 不是在和美国托卡马克或 FRC 同行跑完全相同的一场赛。 但这也意味着 ENN
              必须同时背负两条证明责任——质子-硼燃料路线，以及让它变得可行的具体机器几何和放大路径。
