      - number: '5.4'
        title: 瓶颈、验证、知识产权状态与技术判断
        blocks:
          - type: paragraph
            body: >
              对 ENN 的核心技术判断需要分层。积极的一面是，ENN 有自洽路线、公开机器参数、具名技术领导、同行评审或接近预印本的披露，以及具体下一代装置设计。
              很少有私营聚变项目披露到这个程度。反向的一面是，独立技术文献仍警告：质子-硼聚变只有在轫致辐射损失、约束门槛、α 粒子处理和部件耐久性同时被管住时， 才有吸引力。FIA
              供应链证据又加了一层风险：即使等离子体路线成立，热管理、电力系统、材料和燃料系统工业化仍是瓶颈。


              ENN 的验证状态强于黑箱式创业公司，但弱于完全经同行评审的公共实验室项目。ITPEA 参与和 PST 论文包有帮助，但公司仍控制着大多数决定反应堆级判断的信息。 因此，合适的技术判断是“可信但早期”。ENN
              展示的内容足以支持继续尽调和技术尊重，但还不足以断定 ST 质子-硼已经从优雅科学跨入可被银行融资的产品工程。
