      - number: '2.2'
        title: 规模测算口径与受证据约束的 SAM 逻辑
        blocks:
          - type: paragraph
            body: >
              聚变的公开 TAM/SAM/SOM 测算必须克制，因为很多公开数字根本不是电力市场数字。测算 ENN 机会的最保守方法，是从已经观察到的增长驱动入手。EIA 称，
              美国用电量在长期持平后重新增长，并明确指出数据中心服务器能耗是主要因素。JLL 预计，2026–2030 年全球数据中心行业将新增约 97 GW，并可能需要最高 $3 trillion 资本来支撑近 100 GW
              新增容量。Colliers 还指出，电力稀缺、公用事业押金和基础设施级执行，已经成为数据中心估值和吸纳的核心决定因素。 这些不是 ENN
              的直接收入数字，但说明买方为什么在寻找清洁稳定电力。同一套测算逻辑也延伸到工业电气化和资源充裕性。公开证据中，ENN 自身 SOM 实际上仍为零， 因为公司没有披露购电合约或试点买方。最近的可信 SOM
              代理指标，是同行 PPA，以及中国推动聚变从科学走向工程的国家支持。
