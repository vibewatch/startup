      - number: '3.2'
        title: ENN 在路线、客户验证与地域上的相对位置
        blocks:
          - type: paragraph
            body: >
              ENN 的竞争身份很少见，因为它把两个通常分开的比较集合合在一起。按机器几何看，它最接近 Tokamak Energy 等球形托卡马克项目，以及那些追求更小电站占地的紧凑磁体项目。 按燃料野心看，它更靠近 TAE
              和 HB11 Energy，因为它追求质子-硼结果，而不是更常见的氘-氚路线。如果做成，这个组合有战略吸引力：紧凑机器、无中子叙事， 加上中国本土供应和人才生态。但同一个组合也意味着 ENN
              不能向其他类别借用商业验证。Helion 和 CFS 已经通过 Microsoft 和 Google 拿到最可见的客户验证， Proxima 则抓住了欧洲仿星器融资叙事。因此，ENN
              的公开数据支撑的是差异化技术故事，还不是差异化商业故事。它最强的相对优势，是母公司支持、拥有托卡马克和诊断深度的公开团队， 以及全球同行难以复制的中国生态位置。
