      - number: '4.5'
        title: 公开财务缺口与判断
        blocks:
          - type: paragraph
            body: >
              主要财务尽调障碍，不是 ENN 的数字看起来弱，而是大多数数字并没有以可承销形式公开存在。投资者不知道 ENN Fusion 手头现金、烧钱速度、EHL-2 资本开支预算、
              最新轮次隐含现金跑道、客户管线、补助流入、定价逻辑或首座电站经济性。即便亮眼的估值标题，更容易被解读为战略期权定价，而不是经济性已降险的证据。 本章引用的科学文献和 MIT
              经济框架强化了谨慎判断：聚变不仅需要等离子体成功，还需要经济 Q 大于 1；后者取决于资本效率、电站耐久性和市场收入。


              财务上，ENN 因此应被视为一家高期权性、高资本强度、又有特殊母公司支持的公司。这个组合足以支撑继续尽调，但不足以带来传统成长股权式舒适感。 前瞻承销问题很窄、也很具体：到底融了多少钱，能撑多久，多少比例已承诺给
              EHL-2，客户开发在做什么，以及母公司或战略投资者会在什么条件下提供下一笔资金？ 在这些答案出现前，ENN 的财务故事作为叙事可信，作为模型仍偏投机。
