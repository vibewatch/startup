        - 削弱 ENN 当前 GTM 可信度
        - 关注 LOI、PPA 或公开工业试点
      - - 质子-硼差异化
        - 优势 / 风险
        - 若可行，清洁叙事更强；若不可行，物理难度更硬
        - 可能做成高溢价细分市场，也可能变成昂贵死胡同
        - 跟踪 EHL-2 里程碑质量和外部验证
      - - 同行融资军备竞赛
        - 风险
        - CFS、Helion、Proxima、Pacific 继续融资大额轮次
        - 加剧人才和供应商竞争
        - 跟踪后续融资轮和招聘攻势
      - - 替代技术
        - 风险
        - ENN 准备好之前，稳定电力预算可能先被非聚变方案拿走
        - 压缩 ENN 的时间窗口
        - 跟踪先进核能和买方电力确定性交易
    notes: 这份清单强调护城河耐久性和被替代风险，而不是泛泛的市场风险；核心问题是谁先赢得稀缺的买方和供应商注意力。
