      - number: '3.4'
        title: 替代方案、反向竞争证据与潜在进入者
        blocks:
          - type: paragraph
            body: >
              对 ENN 的竞争威胁不只来自其他聚变创业公司。先进裂变、以天然气支撑的稳定电力，以及围绕电力确定性搭建的能源基础设施策略，都可能在 ENN 达到产品就绪前，
              先拿走同一批采购预算。即便在聚变内部，反向证据也重要。TechCrunch 2026 年 4 月报道提示，市场越来越担心部分聚变公司在验证之前先冲融资。 FIA
              供应链数据显示，整个行业仍缺少长期可见性，关键工业瓶颈尚未解决。这些警告同样适用于 ENN，尤其因为它的路线在物理上比主流 D-T 项目更难。
              潜在进入者还会不断出现，因为买方关心的是清洁稳定电力，不是对某一类机器的品牌忠诚。这意味着 ENN 必须把早期客户验证和生态杠杆当作战略优先级， 而不是假设技术新颖性本身会造出持久护城河。
