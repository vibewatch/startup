      - number: '1.2'
        title: 融资历程、估值与投资方
        blocks:
          - type: paragraph
            body: >-
              进入 2026 年时，ENN Fusion 的资产负债表上还没有外部股权资本。2017 年至 2025 年，ENN Group 通过 EERI 向聚变 R&D 投入超过 ¥4 billion（约 US$590
              million）；按外部资本进入前的累计投入看，ENN Group 可以说是全球最大的单一民营聚变投资主体之一。


              2026 年 7 月，公司完成首轮外部融资 Pre-A，投后估值 ¥10.6 billion（约 US$1.6 billion）。总融资额未披露。Loongson Venture Capital（Longxin
              Private Equity Venture Capital Fund Management）领投，CAS Star（Chinese Academy of Sciences 商业化平台）和 Matrix
              Partners China 联合领投。参投方包括 CDH Investments、Cathay Capital、SAIC Hengxu Capital（SAIC Motor Group
              旗下创投平台）、Legend Star、China Merchants Zhiyuan 和 E-Town Capital（北京政府背景）。 这组投资人横跨国家队色彩主体（CAS Star、E-Town
              Capital）、产业战略方（SAIC Hengxu）和主流科技 VC（Matrix Partners China、CDH、Cathay）。


              已披露资金用途：Helong-2（EHL-2）建设与调试、技术能力升级，以及高级 R&D 团队扩张。公司没有发布收入指引。到目前为止，也没有披露老股交易或债务融资。
