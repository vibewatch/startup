      - number: '6.3'
        title: 留存韧性、满意度与切换成本
        blocks:
          - type: paragraph
            body: >
              ENN Fusion 没有公开留存数据，因为公司还没有披露客户队列。没有 NRR、GRR、流失、合同期限、满意度指标或复购证据。因此，任何留存讨论都只能用代理指标。
              有用的代理指标是结构性的：如果未来聚变电站被部署进客户的实体能源系统，切换成本应该会变高，因为替换会牵涉基础设施、审批、工程重设计和业务连续性风险。 这个逻辑与能源基础设施的长寿命特征一致，也与 ENN
              Energy 更广泛的一体化能源交付模式一致。


              不过，结构逻辑不是证据。母公司一体化能源项目可能有持久关系，但公开记录没有告诉我们续约行为或盈利能力。同样，Microsoft 和 Google 在聚变品类里的领先协议， 展示的是早期承诺意愿，不是续约结果。对
              ENN 自身来说，直到公司披露至少一个带里程碑、期限和交易对手承诺的试点或合同，留存韧性仍未被证明。
