  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现有替代方案
        blocks:
          - type: paragraph
            body: >
              ENN Fusion 所处市场，最好按买方痛点定义，而不是按反应堆标签定义。最宽的外边界是电力市场，但这个天花板对尽调太粗。更有决策价值的边界，是能同时解决可靠性、
              审批压力和脱碳需求的稳定、可调度、无碳电力细分市场。这个边界排除了不带稳定化层的纯间歇式发电，也不同于更宽泛的“聚变行业”统计——后者把 R&D、设备、基础设施和服务混在一起。 对 ENN
              来说，最接近的需求楔子是强调电力确定性的大负荷用电：超大规模数据中心、需要全天候电力的工业用户，以及面对需求上升和脱碳目标的电网运营商。现有替代方案包括先进裂变、天然气 + CCS、
              地热、可再生能源搭配长时储能，以及继续从电网购电。ENN 的质子-硼策略只有在选址灵活性、成本和稳定电力质量上打赢或补足这些方案时，才有商业意义；仅有科学新颖性不够。
