  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              ENN Fusion 面临的法律挑战，不是监管者已经拒绝商业聚变；而是 ENN 还没有公开展示一条中国特定路径，能把实验机器带到获许可、可融资的电站。
              它的紧凑型聚变页面描述了装置、里程碑和路线图意图，但没有披露电站级审批地图，覆盖辐射安全、环境评估、废物特征识别、应急规划，或未来商业机器所需文件链。
              随着美国和国际聚变讨论越来越明确开发商商业化前必须提交什么文件，这个缺口更关键。公司可以在物理上取得进展，却因为法律准备落后于机器路线图而损失数年。


              地缘政治进一步放大不确定性。ENN 是中国开发商，却希望在出口管制、受限方筛查和稀土管制都收紧的时期，获得专门硬件、软件和国际专业能力。这些规则不会让 ENN 不可行， 但会把供应商尽调、IP
              归属和合作治理变成核心承销问题。公开记录也没有充分记录 EERI 到 ENN 的 IP 链条，所以投资者应把所有权、授权和跨境合作条款当作首轮尽调问题， 而不是后台细节。
