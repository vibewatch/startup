      - number: '4.2'
        title: 定价模式、GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              ENN Fusion 没有披露标价、实际成交价或任何商业合同条款。对一家商业化前聚变公司来说，这很正常，但也意味着定价讨论必须以缺失为框架，而不是以证据为框架。 未来 GTM
              动作最可能是直接面向企业和公用事业式销售，而不是渠道分销。ENN Energy 现有一体化能源业务，说明公司有可信的集团路径触达大型工业买方、 能源园区和地方政府；但没有公开证据显示这些渠道已经专门为聚变启动。


              因此，传统意义上的销售效率无法量化。没有 CAC、回本周期、转化漏斗或管线披露。唯一有意义的代理指标是，超大规模云厂商和战略工业客户已经用 Helion 与 CFS 协议验证了品类；
              同时，中国政策蓝图和产业资本兴趣表明，如果 ENN 达到技术可信度，国内买方需求可能存在。但因为 ENN 尚未点名客户，任何 GTM 模型仍属推测。 合适的尽调立场是：ENN
              可能受益于母公司买方网络，但当前公开证据只支持渠道邻近性，不支持一个已经运转的聚变销售引擎。
