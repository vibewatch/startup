      - number: '2.4'
        title: 增长驱动、约束与未解的市场缺口
        blocks:
          - type: paragraph
            body: >
              需求条件有利，但采用约束仍然很重。积极的一面是，数据中心用电增长、工业脱碳和国家对聚变的支持，都在扩大清洁稳定电力的可寻址需求。FIA 2026 年材料也显示，
              投资者和供应商正在加大对聚变产能的投入。消极的一面是，电力市场需求不能抹掉技术成熟度、供应链、融资和监管瓶颈。FIA 供应链报告称，69% 的供应商仍缺少长期可见性，
              并提示燃料循环系统、热管理和第一壁材料会成为未来约束。NRC 的聚变框架在美国正变得更清晰，但具体场址的安全和环境工作仍然关键；中国也才刚开始形成商业聚变政策栈。 对 ENN
              来说，最大的市场证据缺口是：没有公开来源披露质子-硼电站的产品定价、目标购电结构、买方管线或支付意愿数据。因此，市场逻辑可信、战略吸引力也强，但仍由代理证据驱动。
