      - number: '5.3'
        title: 路线图、放大逻辑与平台化
        blocks:
          - type: paragraph
            body: >
              EHL-2 是 ENN 当前科学项目和任何未来产品之间的关键桥梁。ENN 自身描述给出了具体目标参数：约 1.05 m 主半径、3 T 中心场、3 MA 等离子体电流、 17 MW NBI 加热和 6 MW
              ECRH。其既定任务还不是卖电，而是解决 ST 质子-硼聚变的核心科学与技术挑战，验证可行性，并为更大的后续平台打基础。 对一个严肃聚变项目来说，这个排序是对的：EHL-2
              被定位为高价值验证平台，而不是被过度营销的商业反应堆。


              路线图也受益于中国更广泛的聚变生态。CAS 和 SCIO 材料显示，中国国家环境正在推进托卡马克科学、密度极限工作和商业化雄心。因此，ENN 能依托的国内聚变栈，
              比“子公司”身份本身暗示的更强。不过，路线图可信度取决于执行节奏。EHL-2 在 2027 年中完成建设很有野心，任何延误都会传导到所有商业时间表。 作为研究计划，路线图可信；但产品化至少还隔着 EHL-2
              之后的一个重大平台。
