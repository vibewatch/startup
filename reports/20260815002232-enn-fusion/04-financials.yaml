- id: pricing-and-gtm
  title: Pricing model, GTM motion, and sales-efficiency proxies
  body: 'ENN Fusion has not disclosed list pricing, realized pricing, or any commercial contract terms. That is normal for a pre-commercial fusion company, but it means the pricing discussion must be framed as absence rather than evidence. The future GTM motion is most likely direct enterprise and utility-style selling, not channel distribution. ENN Energy''s existing integrated-energy business suggests a credible corporate path to large industrial buyers, energy parks, and local governments; however, there is no public proof that those channels have been activated for fusion specifically.


    Sales efficiency is therefore impossible to quantify conventionally. There is no CAC, payback period, conversion funnel, or pipeline disclosure. The only meaningful proxy is that hyperscalers and strategic industrials have already validated the category with Helion and CFS agreements, while China''s policy blueprint and industrial-capital interest show there could be domestic buyer demand if ENN reaches technical credibility. But because ENN has not yet named a customer, any GTM model remains conjectural. The appropriate diligence stance is that ENN may benefit from its parent''s buyer network, yet current public evidence supports only channel adjacency, not a functioning fusion-sales engine.

    '
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  tableRefs:
  - TI002
  figureRefs:
  - FI002
- id: cost-structure-and-unit-economics
  title: Cost structure, gross-margin drivers, and unit economics
  body: 'ENN''s cost structure is dominated by research personnel, specialized experimental infrastructure, power systems, diagnostics, vacuum and materials systems, and the capex required to build the next machine. Public scientific and industry sources make clear that proton-boron fusion is economically attractive only if very demanding physics and engineering thresholds are met. That means ENN''s cost base is not just "deep-tech R&D" in the generic sense; it includes a fuel route that may require more temperature, tighter control of radiation losses, and more demanding component performance than mainstream deuterium-tritium programs. Fusion-wide supply-chain data reinforce this concern: the sector is increasing spend rapidly, yet fuel systems, extreme-condition materials, heat management, and power components remain bottlenecks.


    Unit economics are therefore mostly unobservable. There is no public cost-per-MW, no plant capex estimate, no maintenance curve, no yield assumption, no capacity-factor disclosure, and no conversion-efficiency disclosure that is sufficient for underwriting. The best public analytical stance is to separate theoretical attractiveness from current calculability. Proton-boron could eventually reduce neutron-related shielding, waste, and decommissioning burdens; but if bremsstrahlung losses, ash handling, or device complexity keep plant economics unattractive, that theoretical advantage will not matter. ENN''s margin path is thus undefined rather than merely negative.

    '
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
