  topStrengths:
    - 母公司背书很重：ENN Group 和 ENN Energy Research Institute 在首轮外部融资前已投入多年聚变研发，让 ENN 获得比许多早期深科技公司更深的产业支撑
    - 技术身份清楚：ENN 不是泛泛讲聚变故事，而是明确押注紧凑型质子-硼 / 非中子聚变，并已发布路线图和经同行评议的技术论文
    - 能源场景相邻：若 ENN 能把产业相邻性转成试点，ENN Energy 的企业能源和综合能源客户基础可能成为未来商业化通道
    - 大额外部融资能力已被验证：尽管公司仍处早期，2026 年 7 月融资和投资人名单显示市场兴趣不弱
    - 契合中国聚变叙事：ENN 所在市场正越来越看重稳定低碳电力、工业能源安全和前沿能源战略地位
  topRisks:
    - 技术风险：质子-硼聚变仍是商业聚变里最难的路线之一，负面文献仍反复强调轫致辐射和点火难题
    - 商业证据缺口：ENN 没有公开具名客户、试点业主、LOI 或 PPA，估值尚未得到直接买方证据支撑
    - 披露风险：没有公开子公司财务、烧钱速度、股权结构细节、里程碑预算或电站经济性模型，常规承销缺少抓手
    - 监管和许可不透明：ENN 尚未披露未来电站的商业许可、安全、废弃物或环评路线图
    - 资本强度和稀释：商业化前大概率还要多轮融资，即便技术继续推进，普通股回报也可能被稀释吃掉
    - 地缘和供应链暴露：出口管制、稀土 / 磁体瓶颈和跨境敏感性，都可能拖慢这个重硬件聚变项目
  unresolvedGaps:
    - 未公开 ENN Fusion 股权结构、融资条款、清算优先权或投资人权利安排
    - 未公开月度烧钱速度、现金跑道或逐里程碑资本计划
    - 未公开客户管线、试点名单或母公司客户向聚变业务转化的漏斗
    - 未公开发电成本、电站 capex、可用率或商业供电假设
    - 未公开中国语境下的许可路径、安全论证、环评路线图或废弃物处理方案
    - 未公开独立的反应堆级基准，无法判断 ENN 距离商业相关性能还有多远
