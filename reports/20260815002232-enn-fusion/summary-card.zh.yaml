summary:
  headline: >
    ENN Fusion 是一家可信度较高、由母公司托底的中国聚变登月项目，质子-硼技术路线真实，2026 年 7 月披露估值约
    $1.6B；但公开证据仍更像期权价值，不足以支撑可投资基本面：没有收入、没有具名客户、没有电站经济性，也没有清晰许可路径。更合适的动作是密切跟踪；若投资，也必须用强结构和里程碑约束锁住下行。
  overallScore: 5.6
  recommendation: track
