  topStrengths:
    - Chando 已是规模化本土美妆平台，2025 年收入 RMB 5.318 billion、毛利率 70.6%，上市前流动性也在改善。
    - 公司全渠道触达清晰：线下网点规模很大，销售结构到 2025 年已转向 69.5% 来自线上。
    - 公开材料显示它不只是品牌叙事，也有产品和研发支撑：五品牌架构、20 个实验室、可观专利活动，以及 L'Oréal 战略投资。
  topRisks:
    - 收入集中度极高：旗舰 CHANDO 品牌仍贡献约 95.3% 的 2025 年销售额，组合韧性受限。
    - 损益表仍偏重营销：每个披露年份的销售及分销费用都超过收入 54%，研发费用率则维持在约 2%。
    - 治理仍由郑氏家族紧密控制，IPO 审查已触及信托结构、估值公平性，以及更广泛的少数股东保护。
    - 公开披露仍未回答 CAC、复购行为、贡献利润率和详细上市条款等核心核价问题。
  unresolvedGaps:
    - 最终 IPO 价格区间、募资用途、稀释机制，以及与 pre-IPO 融资相关的任何优先权或转换条款。
    - 促销后的单位经济性，包括 CAC、复购行为、贡献利润率和渠道层面的回本周期。
    - 非旗舰品牌能显著增厚利润、降低集团对 CHANDO 依赖的证据。
    - 除高层级质量体系和数字化技术栈描述外，更清晰的供应商、制造和合规细节披露。
