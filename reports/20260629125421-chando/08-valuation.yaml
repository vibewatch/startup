company:
  name: Chando
chapter:
  number: 8
  title: Valuation
  summary: 'Public evidence supports Chando’s RMB7.14 billion pre-IPO anchor as a fair reference point, not an obvious bargain.
    The round implies about 1.34x trailing 2025 sales, below Proya and Botanee but above Yatsen’s distressed-like public multiple,
    so the call is Track with medium confidence: underwrite only if the IPO stays near the round and management closes unit-economics
    and dilution gaps.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation stays Track because the round looks fair, not cheap
  body: 'The cleanest valuation anchor is still Chando’s own 2024–2025 financing and the 2026 Hong Kong filing. Public sources
    show more than RMB700 million of outside capital from L’Oréal-linked and Jiahua/Himalaya-linked investors at a RMB7.14
    billion post-money valuation, while the filing showed RMB5.318 billion of 2025 revenue, 70.6% gross margin, 57.2% selling-and-distribution
    intensity, 69.5% online revenue mix, and 95.3% dependence on the flagship Chando brand. That math puts the round at roughly
    1.34x trailing sales. This is not obviously mispriced on the cheap side: it already assumes public investors will pay
    more than Yatsen’s sub-1x sales multiple for a larger, profitable, still-growing beauty platform. But it is also not obviously
    expensive if the listing comes close to the round, because Proya and Botanee trade materially higher. The issue is not
    whether Chando is a real business; it is whether investors should pay a step-up before seeing the IPO price range, proceeds
    bridge, cap-table preference terms, and post-promotion unit economics. On the retained evidence set, that argues for price
    discipline rather than enthusiasm: Track near the round, avoid a clear premium to the round until disclosure improves.'
