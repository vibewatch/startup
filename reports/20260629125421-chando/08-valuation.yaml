- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - what supports it
  - what would change the view
  rows:
  - - Scale is real
    - RMB5.318bn 2025 revenue, 70.6% gross margin, live 2026 HK IPO process, and outside capital from L’Oréal-linked and Jiahua/Himalaya-linked
      investors.
    - Would weaken if IPO proceeds or post-listing updates reveal weaker quality-of-revenue than the filing suggests.
  - - Funding risk is lower than for a typical private beauty issuer
    - More than RMB700m of outside capital has already entered the cap table and the company has a live listing path.
    - Would weaken if preference or conversion terms prove highly dilutive to new public shareholders.
  - - Brand concentration deserves a discount
    - 95.3% of 2025 sales still came from the flagship Chando label.
    - Would improve if a second brand becomes meaningfully accretive or if concentration trends down after listing.
  - - Marketing intensity limits immediate premium-multiple expansion
    - Selling and distribution expense was 57.2% of 2025 revenue and adverse commentary still frames Chando as an offline-heavier,
      traffic-dependent model.
    - Would improve if management publishes CAC, repeat, contribution margin, and shows better operating leverage.
  - - Public comps support a middle-band multiple
    - Chando’s 1.34x round multiple is above Yatsen but below Proya and Botanee.
    - Would worsen if the IPO is marketed at Proya/Botanee-like levels without commensurate disclosure or execution proof.
  - - Governance and IPO optics are still a live overhang
    - Adverse reporting highlights family control, R&D-vs-marketing skepticism, and spokesperson controversies during the
      IPO cycle.
    - Would improve if governance commitments, use-of-proceeds discipline, and disclosure quality strengthen at listing.
  notes: Rows summarize the underwriting debate rather than restate every chapter claim; each row compresses multiple retained
    sources into a single decision lens.
