- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - IPO pricing step-up
    - Deal marketed materially above ~1.5x sales before new disclosure
    - Eliminates the small upside cushion left in the public comp band.
    - Move from Track to Avoid unless new proof closes the gap.
  - - Marketing burden stays structurally heavy
    - No credible path below current elevated post-promo spend intensity
    - Suggests gross margin is being recycled into traffic rather than compounding into economics.
    - Keep or downgrade recommendation; do not pay premium multiple.
  - - Flagship concentration does not improve
    - Flagship stays around the mid-90% share of revenue
    - Maintains single-brand fragility and justifies a diversification discount.
    - Treat Proya/Botanee multiples as unavailable to Chando.
  - - Governance / disclosure slippage
    - IPO documents do not clarify dilution, preferences, or use-of-proceeds discipline
    - Raises the chance that the listed equity is not capturing the same economics implied by the round headline.
    - Pause underwriting and require clarified documents.
  - - Post-listing execution miss
    - Channel mix or growth weakens without offsetting margin leverage
    - Breaks the case that Chando deserves to rerate toward stronger domestic peers.
    - Rebase valuation toward the bear band.
  notes: Triggers are intended to be monitorable and price-linked, not generic business risks already covered in the risks
    chapter.
  claimRefs:
