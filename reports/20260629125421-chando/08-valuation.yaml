    - Private adjacent premium C-beauty brand
    - No retained public revenue figure
    - No supportable public multiple retained
    - Useful for positioning and premium C-beauty adjacency.
    - Not usable as a direct revenue-multiple anchor because valuation and revenue remain private in retained evidence.
  notes: Comparable rows mix directly quoted public multiples with simple implied multiples where market cap and revenue are
