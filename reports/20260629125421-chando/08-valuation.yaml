  evidenceGaps:
  - type: missing-source
    severity: material
    topic: ipo-price-range
    missingEvidence: The formal IPO price range, final proceeds amount, and any cornerstone demand disclosure.
    whyItMatters: Without price, valuation stance cannot move beyond a price-sensitive track stance.
    diligencePath: Read the next HKEX prospectus update or pricing supplement and capture the marketing range.
    relatedQuestionRefs:
    - QV015
    - QV025
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Public CAC, repeat rate, order frequency, and contribution margin by major online channel.
    whyItMatters: These variables determine whether Chando deserves to rerate toward Proya/Botanee or remain discounted.
    diligencePath: Request roadshow or management-bridge disclosure that links online growth to contribution economics.
    relatedQuestionRefs:
    - QV024
    - QV029
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: pre-ipo-round-terms
    missingEvidence: Detailed preference, conversion, and dilution economics of the latest private round.
    whyItMatters: Public shareholders may be underwriting a different economic stack than the headline post-money valuation
      suggests.
    diligencePath: Review the final cap-table footnotes and legal summary in the definitive listing document.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: minor
    topic: florasis-private-valuation
    missingEvidence: A supportable public revenue or valuation data point for Florasis.
    whyItMatters: Florasis is useful for positioning adjacency but cannot be used as a direct pricing comp without public
      numbers.
    diligencePath: Look for audited financial disclosure or a credible financing event before using Florasis as a multiple
      reference.
    relatedQuestionRefs:
    - QV022
    relatedTableRefs:
    - TV004
