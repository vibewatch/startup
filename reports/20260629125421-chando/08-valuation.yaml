    - No public IPO price range yet; preference and proceeds details remain incomplete.
  - - Proya
    - RMB22.45bn market cap on 2026-06-29
    - RMB10.54bn revenue (ttm)
    - 2.12x sales on Yahoo Finance
    - Best domestic public execution benchmark at larger scale and better margin/disclosure.
    - Multiple already reflects public-market volatility and a 52-week-low print.
  - - Botanee
    - RMB12.78bn market cap on 2026-06-29
    - RMB5.359bn 2025 revenue
    - Estimated ~2.38x sales
    - Useful premium-skincare / dermocosmetics comparator with stronger specialization.
    - Less like-for-like than Proya because its clinical positioning is more specialized than Chando’s mass-premium model.
  - - Yatsen
    - US$300m market cap range in late June 2026
    - 0.45x sales on Yahoo Finance; 4.49B revenue (ttm) shown in Yahoo data
    - Discount public comp / downside floor
    - Shows how sharply beauty multiples compress when marketing intensity and financing needs stay elevated.
    - ADR structure and portfolio mix differ materially from Chando’s domestic offline heritage.
