- id: scenario-ranges
  title: Scenario analysis says upside exists, but not enough for a buy without cleaner proof
  body: Scenario analysis is straightforward because the current public anchor is already known. In a bear case, beauty IPO
    appetite remains weak, marketing-heavy customer acquisition does not improve, and public investors decide Chando deserves
    only about 0.8x to 1.0x sales, implying roughly RMB4.3 billion to RMB5.3 billion of equity value on the 2025 revenue base.
    In a base case, Chando lists close to the last round and trades around 1.3x to 1.6x sales, implying about RMB6.9 billion
    to RMB8.5 billion. In a bull case, the market starts to believe Chando can narrow the gap with Proya or Botanee on digital
    efficiency, portfolio breadth, and capital-markets credibility, allowing about 2.0x to 2.2x sales and roughly RMB10.6
    billion to RMB11.7 billion of value. The problem is not that the bull case is impossible; it is that the upside from the
    last round to that bull band is respectable but not overwhelming relative to the disclosure risk still left unresolved.
    That makes the stock interesting, but not yet an IC-level buy on current public evidence alone.
  claimRefs:
