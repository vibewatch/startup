- id: repeat-review-pricing
  title: Repeat proxies, brand recognition, and pricing are visible; true retention remains mostly undisclosed
  body: 'Public repeat-purchase evidence exists, but it is uneven and often indirect. Chando’s IPO-linked coverage claims the brand ranked first among surveyed mass domestic beauty brands in consumer recognition, purchase frequency, and repeat-purchase willingness, which is directionally important even if the underlying survey instrument is not fully disclosed in the fetched set. Official brand pages add more localized repeat signals: Spring Summer says its sunscreen has sold more than 410,000 units with a high repurchase rate, and the U.S. DTC site merchandises a four-product best-seller set with steep but coherent sale pricing. Product pages also reveal the brand’s intended demographic fit. Chando is clearly targeting adult women in anti-aging and repair, while also offering sensitive-skin, oil-control, and acne-oriented lines; the cited efficacy panels cluster in female cohorts aged roughly 20 to 54. Review sentiment is modest but real on directly fetchable overseas marketplaces: two
    Amazon pages both showed 4.5-star ratings with dozens of global ratings on the run date. What remains missing is the hard investor-grade retention layer—cohorts, reorder cadence, membership conversion, churn, and net revenue retention by channel are not publicly disclosed.'
