company:
  name: Chando
chapter:
  number: 6
  title: Customers
  summary: 'Chando’s public customer proof is strongest where consumer-facing reach can be observed directly: a 60,000-plus domestic outlet footprint, a rapidly online-shifting sales mix, visible JD/livestream acquisition loops, and expanding overseas marketplace presence led by Lazada Malaysia and a fast Vietnam rollout. Repeat quality is only partially visible through third-party survey claims, Amazon review signals, and selected brand pages; public evidence still leaves durability under-disclosed, while adverse coverage points to high online acquisition cost, single-brand dependence, and a premiumization story that may still lean on price-sensitive cohorts.'
sections:
- id: segment-fit
  title: Consumer segments are broad, but the paying logic is still mass-premium beauty rather than enterprise contracts
  body: 'Chando’s customer base is best understood as a layered consumer portfolio rather than a single monolithic “Chinese skincare buyer.” The flagship Chando brand still dominates economics and is positioned as a mass-premium domestic cosmetics brand with broad adult skincare demand, but the public product set shows more granular sub-segmentation: anti-aging buyers, sensitive-skin users, oily and acne-prone younger consumers, men reached through sports and outdoor activation, and parents buying infant/child-care products through the imine line. Official English-language product pages make that segmentation visible through problem-based merchandising rather than corporate account lists, while the group profile extends the picture with a specialized child-skin line that already reaches hospitals and child health centers. The practical buyer/user/payer pattern is therefore mostly self-pay consumer skincare, supplemented by retailer, distributor, and marketplace intermediaries that stand
    between the group and the final shopper. Public evidence supports broad demographic fit and category coverage, but not a disclosed breakdown by cohort revenue, reorder rate, or customer lifetime value.'
