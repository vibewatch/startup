  rows:
  - - Offline-to-online integration
    - Cloud Store and omni-channel inventory connect membership, live streaming, and store fulfillment
    - Can raise conversion efficiency and repeat behavior if the private-traffic loop is real
    - Request member counts, points redemption, and repeat by store cohort
  - - Southeast Asia expansion
    - Lazada leadership in Malaysia and 150+ Vietnam stores show real international reach
    - Could diversify growth beyond China if unit economics hold
    - Request country-level sales, CAC, and payback
  - - Low direct account concentration
    - Top five customers were 17.4% of revenue and the largest was 6.9% in 2025 H1
    - Reduces dependence on any single distributor or retailer account
    - Validate against the final prospectus and list the actual top accounts
  - - Single-brand dependence
    - The Chando brand still contributed 95.3% of 2025 revenue
    - Brand fatigue or reputation damage would hit most of the revenue base
    - Request sub-brand cohort economics and brand-by-brand repeat data
  - - High online customer-acquisition cost
    - Adverse coverage says livestream commissions and platform fees rose while marketing stayed above 50% of revenue
    - Can destroy contribution margin even when gross margin looks strong
    - Request channel CAC, payback period, and net realized margin after KOL and platform tolls
  - - Premiumization execution risk
    - Adverse coverage says recent growth still leans on price-sensitive channels and lower-priced hero SKUs
    - Could limit ARPU expansion and reduce resilience against discounting
    - Request Tmall / JD premium-SKU sell-through and gross margin by product line
