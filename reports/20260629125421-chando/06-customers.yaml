- id: channels-acquisition
  title: 'Acquisition is visibly omnichannel: offline counters still matter, but digital traffic increasingly allocates demand'
  body: 'The strongest public proof around Chando customers is not a published account roster; it is the visible acquisition machinery linking brand reach to commerce. Official materials show more than 60,000 domestic retail outlets, dedicated key-account and counter-sales functions, and a digital stack explicitly designed to convert public traffic into private retention. The group’s digital-transformation page is unusually explicit: Cloud Store and omni-channel inventory management connect online sales, membership binding, points systems, live streaming, and store operations. The 2026 trail-race activation shows how this works in practice. Chando used a sports-community event, influencer participation, Codoon community runs, JD.com experiential zones, sampling, and Beauty Super Brand Day traffic during JD 618 to turn offline attention into platform conversion. Independent and filing-linked sources reinforce the same direction of travel: online share rose sharply through 2025, while overseas
    expansion was driven through cross-border e-commerce before physical-store rollout in Southeast Asia. For customer diligence, the implication is clear: Chando’s reach is real, but a rising share of it flows through marketplaces, KOLs, and event-led performance marketing that can be expensive to sustain.'
