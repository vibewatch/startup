- id: durability-risks
  title: Durability is constrained less by named-customer concentration than by single-brand dependence and customer-acquisition economics
  body: 'The main adverse signals in Chando’s customer story sit above the individual-shopper level. Public customer concentration looks relatively low on a direct-account basis—Sina’s filing summary says distributors, retailers, and individual customers are all meaningful, with the top five customers contributing 17.4% of revenue and the largest customer 6.9% in 2025 H1. But that does not mean the customer base is low-risk. The much bigger concentration problem is brand-level: Chando itself contributed 95.3% of 2025 revenue, and adverse commentary repeatedly argues that sub-brands have not yet created a true second growth curve. Independent commentary also points to declining skincare share from 2018 to 2023, rising online acquisition costs, and heavier platform/KOL economics. Tencent’s adverse profile goes further, arguing that recent growth still leans on price-sensitive channels and that premiumization remains unproven. The result is a customer chapter with genuine reach and breadth,
    but still incomplete proof on whether the group can convert awareness and event-driven traffic into durable, expanding, high-quality demand at acceptable acquisition cost.'
