callouts:
- calloutType: strength
  title: Reach is visibly real across offline, digital, and overseas surfaces
  body: 'Few consumer brands disclose a perfect retention stack, but Chando does show tangible reach: a 60,000-plus domestic outlet network, explicit omni-channel systems, visible JD 618/community activations, Lazada leadership in Malaysia, and a rapid Vietnam retail build-out. That is enough to conclude the brand is commercially real rather than purely aspirational.'
  claimRefs:
  - CU001
  - CU003
  - CU006
  - CU007
  - CU028
  - CU029
- calloutType: risk
  title: The real concentration problem is the flagship brand, not a single distributor account
  body: 'Public summaries imply direct account concentration is manageable, but brand concentration is not: the Chando flagship still drives 95.3% of revenue. If consumer tastes shift, if premiumization fails, or if acquisition costs keep rising faster than repeat quality improves, the breadth of channels will not fully offset the economic dependence on one brand.'
  claimRefs:
  - CU014
  - CU041
  - CU042
  - CU043
- calloutType: insight
  title: Public retention proof stops well short of investor-grade cohort data
  body: The chapter can verify consumer recognition, review sentiment, best-seller pricing, and a few repeat proxies such as Spring Summer’s repurchase claim. It cannot verify channel-level CAC, member retention, reorder frequency, refund rates, or net revenue retention. That missing layer is the main blocker between “popular brand” and “durable customer economics.”
  claimRefs:
  - CU015
  - CU026
  - CU034
  - CU036
  - CU038
