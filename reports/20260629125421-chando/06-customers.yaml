  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: repeat-cohorts
    missingEvidence: Channel-level repeat-purchase cohorts, NRR/GRR, and membership retention data.
    whyItMatters: Without cohort retention, brand popularity cannot be translated into durable customer economics or reliable lifetime value.
    diligencePath: Request monthly repeat-purchase cohorts by channel, membership-tier retention, and reorder frequency for hero SKUs.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: acquisition-efficiency
    missingEvidence: Platform-by-platform CAC, payback period, refund rate, and contribution margin after KOL and marketplace fees.
    whyItMatters: Public sources show a large digital sales mix and rising acquisition-cost pressure, but not whether those customers are profitable after traffic costs.
    diligencePath: Request CAC and payback by JD, Tmall, Douyin, Amazon, Lazada, and offline counters, plus return-rate and subsidy-waterfall detail.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: named-channel-roster
    missingEvidence: A reconciled public roster of top distributors, key retailers, or marketplace-specific top accounts.
    whyItMatters: Consumer brands can still hide fragility inside distributor and platform concentration even when direct end-customer concentration looks low.
    diligencePath: Request the top-10 customer list, distributor roster, platform GMV mix, and any major retailer or marketplace contract terms from the final prospectus or diligence room.
    relatedQuestionRefs:
    - QU028
    relatedTableRefs:
    - TU003
    - TU005
