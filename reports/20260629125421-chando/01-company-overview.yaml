  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: headcount-disclosure
      missingEvidence: A current employee headcount by function and geography.
      whyItMatters: Headcount is one of the chapter's requested cover metrics and is a proxy for operating scale cost structure and IPO readiness.
      diligencePath: Request the latest HR org chart or payroll summary during management diligence.
      relatedQuestionRefs: [QO025]
      relatedTableRefs: [TO001, TO002]
    - type: private-evidence-only
      severity: material
      topic: capital-disclosure
      missingEvidence: A complete cap table and round history covering founder-era funding any internal restructurings and the 2024-2025 outside round.
      whyItMatters: The public record supports the pre-IPO outside round but not a precise lifetime capital-raised figure.
      diligencePath: Request cap-table history subscription agreements and any shareholder-loan schedule.
      relatedQuestionRefs: [QO026]
      relatedTableRefs: [TO001, TO003]
    - type: missing-source
      severity: material
      topic: regulatory-status
      missingEvidence: A public or provided update on CSRC supplemental-question closure and current HKEX hearing status after the April 2026 refiling.
      whyItMatters: IPO timing valuation and governance-risk assessment all depend on whether the company cleared the issues flagged in the first filing cycle.
      diligencePath: Request the latest sponsor update CSRC correspondence and hearing calendar status from management or deal counsel.
      relatedQuestionRefs: [QO027]
      relatedTableRefs: [TO004]
    - type: stale
      severity: minor
      topic: valuation
      missingEvidence: A refreshed valuation mark after the April 2026 refiling.
      whyItMatters: The last clearly disclosed valuation anchor is the 2025 pre-IPO round which may not equal current investor expectations.
      diligencePath: Request current pre-marketing valuation guidance or secondary transaction references.
      relatedQuestionRefs: [QO013]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: minor
      topic: web-identity
      missingEvidence: A clear corporate explanation of how chando.com.cn relates to the listed issuer and the chandogroup or chando-himalaya sites.
      whyItMatters: Public web identity fragmentation can create diligence noise for customers investors and international partners.
      diligencePath: Ask management for the current domain map and which sites are issuer-level brand-level or legacy properties.
