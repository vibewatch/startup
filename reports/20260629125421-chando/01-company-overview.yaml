company:
  name: Chando
  website: https://www.chando.com.cn
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Chando (自然堂) is a Shanghai-founded, family-controlled Chinese cosmetics group built around its
    flagship CHANDO skincare brand and four secondary labels. Public filings and reporting show a
    scaled but concentrated business: 2025 revenue reached RMB 5.318 billion, yet more than 95% still
    came from the main brand and more than half of revenue went to sales and marketing. The company
    entered its first known outside-financing round only in 2024-2025, raising more than RMB 700
    million from L'Oréal and Jiahua Capital ahead of a Hong Kong IPO refiling in April 2026.
sections:
  - id: identity-platform-and-public-web-presence
    title: Identity, product platform, and public web presence
    body: >-
      Chando's Hong Kong listing vehicle is CHANDO GLOBAL HOLDING LIMITED, while the operating story
      presented to the market is that of a Shanghai-founded multi-brand cosmetics group built around the
      flagship CHANDO brand. The reviewed public materials consistently describe a strategic multi-brand
      enterprise with five main labels — CHANDO, MAYSU, Biorrier/Pufayan, SPRING SUMMER/Chunxia, and
      imine/Jichu — spanning skincare, make-up, personal care, and mother-and-baby categories. As of 31
      December 2025, the group disclosed 554 SKUs, which is enough breadth to support a portfolio story,
      even though the financial disclosures show the main brand still dominates the economics.

      The public web footprint is broader than one domain. The most coherent current corporate surfaces
      are chandogroup.com and en.chandogroup.com, where the group describes itself as a technology-driven
      cosmetics company and publishes its innovation and sustainability narrative. Product-facing sites
      also exist at chando-himalaya.com and chando-himalaya.us, reinforcing the brand's Himalaya
      positioning. By contrast, the supplied website in the runtime context, chando.com.cn, currently
      resolves to a separate page labelled 香度, so later chapters should treat chandogroup.com and the
      prospectus as the cleaner identity anchors for issuer-level facts.

      On technology positioning, the company is not just telling a marketing story. Its English
      innovation page says the R&D center had 20 laboratories, 590 patent applications with 275
      authorized, 49 standards participations, and more than 220 scientific and technical articles,
      including 92 international publications, all as of May 2026. The same materials describe three
      scientific systems — skin science, raw material science, and product science — and four technical
      platforms covering raw materials, formulation, packaging, and evaluation. This gives Chando a
      tangible science stack for a domestic beauty company, even though public financial coverage still
      portrays its cost structure as more marketing-heavy than R&D-heavy.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]
  - id: leadership-governance-and-control
    title: Leadership, governance, and control
    body: >-
      Founder Zheng Chunying remains the central decision-maker. Reviewed 2026 reporting and the
      prospectus-linked coverage identify him as chairman and chief executive officer, with the company
      still effectively run as a Zheng family enterprise more than two decades after founding. The
      pre-IPO ownership disclosures show Zheng Chunying together with Zheng Chunbin, Zheng Chunwei, and
      Zheng Xiaodan controlling about 87.82% of voting rights through a multilayer BVI and family-trust
      structure. That concentration gives the family exceptional strategic control, but it is also one of
      the first governance issues surfaced by skeptical coverage and regulator questions.

      Public reporting provides more leadership detail than many Chinese consumer IPO candidates. A 2026
      Sina Finance summary of the prospectus says the board has nine directors: four executive, two
      non-executive, and three independent. The named executive directors include Zheng Chunying, Zheng
      Chunbin, Zheng Chunwei, and Du Shenglin; the named non-executives include Zheng Xiaodan and Jiahua
      Capital compliance head Zhu Xuejing; and the executive bench also includes CFO Li Zhuoguang and
      vice presidents Li Min and Zou Yue. Official corporate news adds Chen Juanling, general manager of
      public affairs, as a visible external spokesperson for the group's technology and sustainability
      narrative.

      The governance picture therefore has two layers. On one hand, Chando can show a fuller public
      bench than many founder-led consumer brands. On the other hand, the concentration of family
      control, the trust structure, and the late arrival of external capital all suggest that
      minority-investor protections and independent oversight deserve close follow-up in any investment
      case. The board exists, but the public evidence still points to a company whose identity is
      inseparable from its founder family.
    claimRefs: [CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024]
    tableRefs: [TO002, TO003]
  - id: funding-performance-and-ipo-path
    title: Funding, operating profile, and IPO path
    body: >-
      Chando's capital story changed sharply in 2024-2025. Multiple sources describe the L'Oréal and
      Jiahua Capital transactions as the first known outside financing since founding. The
      prospectus-related coverage shows Meiting, a wholly owned L'Oréal vehicle, subscribed for 7,026,459
      shares for about RMB 409.2 million and later bought another 531,023 shares for about RMB 33.45
      million, bringing L'Oréal's total investment to roughly RMB 442.7 million. Himalaya International,
      backed by Jiahua Capital, subscribed for 4,761,905 shares for RMB 300 million. Together these
      transactions exceeded RMB 700 million and implied a post-money valuation of about RMB 7.14 billion,
      enough for Chando to be described as a domestic beauty unicorn before listing.

      The operating profile is scaled, but the quality of growth is debated. Prospectus-linked reporting
      gives revenue of RMB 4.442 billion in 2023, RMB 4.601 billion in 2024, and RMB 5.318 billion in
      2025, with corresponding net profit of RMB 302 million, RMB 190 million, and RMB 351 million.
      Gross margin reached 70.6% in 2025, but sales and marketing consumed 54.2%, 59.0%, and 57.2% of
      revenue in 2023-2025, while R&D hovered near 2% of revenue. Online sales mix rose from 61.9% to
      69.5% over the same period, but the flagship CHANDO brand still contributed 95.3% of 2025 revenue
      and offline retail points remained numerous at 64,800.

      The IPO path reflects both ambition and friction. Chando first filed in Hong Kong on 29 September
      2025, let that application lapse on 29 March 2026, then refiled on 2 April 2026. Company-friendly
      sources framed the lapse as procedural. Adverse and skeptical coverage adds a harder
      interpretation: investors and regulators remain concerned about brand concentration, low relative
      R&D intensity, pricing fairness in the pre-IPO round, and the family-trust structure behind
      control. Those concerns do not invalidate the business, but they explain why the company overview
      has to carry both scale and concentration in the same paragraph.
    claimRefs: [CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035, CO036, CO037, CO038, CO039, CO040, CO041, CO042, CO043, CO044, CO045]
  - id: milestones-innovation-and-adverse-signals
    title: Milestones, innovation narrative, and adverse signals
    body: >-
      Chando's public chronology combines a long domestic-brand build with a more recent effort to
      present itself as a science-led, globally credible beauty platform. The most notable technical
      milestones disclosed on company pages include a 2013 space-breeding collaboration with the Chinese
      Academy of Sciences, the launch of HiMurchaSin after roughly a decade of self-directed fermentation
      research, a 2020 digital-transformation program that official materials say eventually deployed 105
      systems, and the 2026 CBE China Beauty Expo showcase where five brands were presented alongside new
      claims around fatigue-induced aging, pigment management, and space skincare. This gives later
      chapters a coherent sequence for product, channel, and brand-building milestones.

      The sustainability and social-license story is also developed enough to matter. Official 2026
      materials say the company launched a 2030 sustainability strategy in 2024 and has tied its ESG
      message to Himalayan ecology, green packaging, and circularity. The company says it has worked with
      the China Environmental Protection Foundation since 2016, donated RMB 29.2 million by 2025,
      planted 6.66 million square meters of green barley grass in Tibet, and upgraded that program into a
      2025-2030 biodiversity project. These are useful diligence inputs because they show management is
      trying to widen the group narrative beyond cosmetics and channels into stewardship and brand
      purpose.

      Still, the adverse record cannot be ignored. Public critical coverage in 2026 repeatedly returned
      to four issues: the IPO filing lapse, heavy dependence on one brand, unusually high marketing
      intensity relative to R&D, and CSRC questions about family trusts and pre-IPO investor pricing.
      Even the domestic product site carries an NMPA warning that cosmetics cannot claim medical effects,
      a reminder that efficacy-led messaging in this category is tightly bounded. The overall takeaway is
      not that Chando lacks milestones — it has many — but that the next leg of credibility depends on
      proving the science and governance story can catch up with the brand's scale.
    claimRefs: [CO012, CO013, CO038, CO039, CO040, CO041, CO042, CO043, CO044, CO045, CO046, CO047, CO048, CO049, CO050, CO051, CO052, CO053, CO057]
    tableRefs: [TO004]
    figureRefs: [FO001]
