callouts:
  - calloutType: insight
    title: Outside capital is new not routine
    body: The 2024-2025 L'Oréal and Jiahua/Himalaya transactions appear to be the company's first known outside financing after more than two decades of founder-family control.
    claimRefs: [CO024, CO025, CO026, CO027]
  - calloutType: risk
    title: Scale and concentration coexist
    body: Chando is large enough to file for Hong Kong IPO with RMB 5.318 billion of 2025 revenue, but the same filing shows 95.3% revenue dependence on the flagship brand and marketing costs above half of revenue.
    claimRefs: [CO035, CO037, CO039, CO040]
  - calloutType: risk
    title: Governance diligence should focus on trust structure and pricing fairness
    body: >-
      The public adverse record is not a product scandal but a governance and disclosure one:
      family control trust layering and fairness of the late pre-IPO investor pricing were all
      flagged in 2026 skeptical coverage.
    claimRefs: [CO017, CO018, CO051, CO052, CO053]
