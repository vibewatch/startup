  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, growth, and margin quality
        blocks:
          - type: paragraph
            body: >-
              Chando remains a straightforward branded-consumer-products story: it sells mass-market cosmetics, largely
              below RMB300 per item, through a five-brand portfolio led overwhelmingly by the flagship Chando brand. The
              filing reported revenue of RMB4.44 billion in 2023, RMB4.60 billion in 2024, and RMB5.32 billion in 2025,
              implying modest 2024 growth followed by a sharper 2025 rebound. Gross margin improved each year to 70.6%
              in 2025, which is unusually high for a mass-market beauty business and suggests meaningful brand equity,
              favorable mix, and/or channel economics. But revenue quality is less diversified than the headline margin
              suggests: independent coverage says the namesake Chando brand still generated roughly 95.3% of 2025 sales.
              That concentration means the group is still underwriting a single hero brand rather than a truly balanced
              multi-brand platform, and any brand-relevance wobble would flow directly into revenue and inventory risk.
