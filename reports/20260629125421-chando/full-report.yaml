      - number: '4.4'
        title: Cash, leverage, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The balance-sheet picture improved meaningfully in 2025, but it is not yet strong enough to remove
              financing dependence. Chando moved from net current liabilities of RMB247.3 million at the end of 2024 to
              net current assets of RMB320.7 million by year-end 2025, helped by stronger profits and a large pre-IPO
              financing. Reported year-end cash also rose from RMB575.2 million in 2023 to RMB948.9 million in 2025,
              while operating cash flow rebounded to RMB491.3 million in 2025 after a soft 2024. Ratio disclosures point
              in the same direction: current ratio recovered to 1.2x in 2025, quick ratio to 0.9x, and the filing’s
              debt-ratio line fell to nil. Still, this improvement was not purely organic. L’Oréal-backed Meiting and
              Jiahua-backed Himalaya supplied RMB742 million of pre-IPO capital at a roughly RMB7.14 billion valuation.
              That round materially de-risked liquidity, but it also signals that the IPO story is being presented after
              an external-capital top-up rather than from a position of abundant organic cash generation.
