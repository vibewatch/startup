      - number: '8.2'
        title: The thesis is real scale plus strategic backing; the anti-thesis is concentration plus incomplete proof
        blocks:
          - type: paragraph
            body: >-
              The positive case starts with scale. Chando is already a multi-billion-renminbi domestic beauty platform
              with strong gross margin, a large retail footprint, live IPO intent, and backing from L’Oréal. Those facts
              matter because they reduce the probability that the business is merely narrative. Against that, the
              anti-thesis is unusually clear. The same filing that proves scale also proves concentration: 95.3% of
              sales still come from the flagship brand, and the same P&L that supports premium gross margin also shows a
              marketing-heavy structure that consumed 57.2% of revenue in selling and distribution expense. Independent
              adverse commentary pushes in the same direction, arguing that Chando is less diversified than leading
              public peers and that family control, low R&D intensity versus marketing, and spokesperson controversies
              may weigh on IPO demand. The net result is a company that deserves to trade above troubled or turnaround
              beauty names, but that has not yet earned a premium-execution multiple on par with the cleanest domestic
              public comps. The recommendation therefore stays price-sensitive: buy only if valuation leaves room for
              execution risk, not simply because the brand is large and familiar.
