  - id: TP001
    title: Competitor profile table
    enumerationScope:
      coverage: partial
      basis: >-
        Profiles the most relevant direct, incumbent, adjacent, and substitute competitors surfaced by Chando, Proya,
        Botanee, Yatsen, Florasis, and incumbent disclosures as of the 2026 run date; exact private brand profitability
        and all hero-SKU pricing are not fully public.
    columns:
      - competitor
      - category
      - scale / funding
      - target segment
      - differentiation
      - limitation
    rows:
      - - Chando
        - Mass-premium domestic multi-brand skincare group
        - RMB5.318bn 2025 revenue; 7.14bn post-money valuation; 64,800 retail sales points
        - Mass domestic skincare and personal-care buyers with offline trial habits
        - Flagship awareness, offline estate, natural-science narrative, 20 labs / 590 patents
        - 95.3% of 2025 sales still came from the flagship brand; online mix trails best digital peers.
      - - Proya
        - Direct public domestic benchmark
        - RMB5.362bn H1 2025 revenue; 95.39% primary revenue online
        - Mass-premium skincare plus makeup, scalp care, and Gen-Z brands
        - Digital-first distribution, broader brand ladder, clear price segmentation
        - Still heavily dependent on online platforms and Douyin/Tmall traffic economics.
      - - Botanee / Winona
        - Dermocosmetics substitute and public peer
        - RMB5.359bn 2025 revenue; Winona held about 19.4% domestic dermocosmetics share
        - Sensitive-skin, pharmacy, OMO, and efficacy-led buyers
        - Dermatology-led trust, pharmacy reach, OMO loop, 400+ R&D staff
        - More clinically framed than Chando; less of a mass-aesthetic brand story.
      - - Yatsen / Perfect Diary group
        - Social-commerce challenger rebuilding around skincare
        - RMB1.02bn Q1 2026 revenue; skincare brands were 56.2% of mix
        - Mass color cosmetics, prestige skincare, and younger online shoppers
        - Portfolio from Perfect Diary to Galénic/DR.WU/Eve Lom; fast portfolio repositioning
        - Marketing spend was 72.2% of Q1 2026 revenue and losses widened.
      - - Florasis
        - Adjacent premium-artistry C-beauty brand
        - Founded 2017; 5 R&D centers and 170+ patents disclosed
        - Premium makeup, gifting, culture-led beauty shoppers
        - Chinese-aesthetics positioning, craftsmanship, premium design language
        - More adjacent to makeup/premium gifting than to Chando’s core skincare basket.
      - - L’Oréal
        - Global incumbent
        - Minority investor in Chando; official annual report highlights 4,000 scientists
        - Prestige and mass global beauty buyers
        - Deep science stack, brand breadth, global scale
        - Typically competes above Chando’s mass price point in China.
      - - Shiseido
        - Global prestige incumbent
        - No. 8 global beauty company; 62% prestige sales ratio; 35% EC sales ratio
        - Premium skin beauty and prestige channel buyers
        - Prestige portfolio, 5 R&D bases, ~1,100 researchers
        - 2025 report says China & Travel Retail needed restructuring after 2024 weakness.
      - - Estée Lauder Companies
        - Global prestige incumbent
        - Latest toolkit exposes 10-K, 10-Q, factsheet, and earnings archive
        - Prestige skincare/makeup and department-store beauty buyers
        - Formal disclosure rhythm and prestige portfolio depth
        - Retained official surface did not expose China-specific product or channel detail.
    notes: >-
