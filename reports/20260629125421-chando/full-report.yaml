chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product platform, and public web presence
        blocks:
          - type: paragraph
            body: >-
              Chando's Hong Kong listing vehicle is CHANDO GLOBAL HOLDING LIMITED, while the operating story presented
              to the market is that of a Shanghai-founded multi-brand cosmetics group built around the flagship CHANDO
              brand. The reviewed public materials consistently describe a strategic multi-brand enterprise with five
              main labels — CHANDO, MAYSU, Biorrier/Pufayan, SPRING SUMMER/Chunxia, and imine/Jichu — spanning skincare,
              make-up, personal care, and mother-and-baby categories. As of 31 December 2025, the group disclosed 554
              SKUs, which is enough breadth to support a portfolio story, even though the financial disclosures show the
              main brand still dominates the economics.

              The public web footprint is broader than one domain. The most coherent current corporate surfaces are
              chandogroup.com and en.chandogroup.com, where the group describes itself as a technology-driven cosmetics
              company and publishes its innovation and sustainability narrative. Product-facing sites also exist at
              chando-himalaya.com and chando-himalaya.us, reinforcing the brand's Himalaya positioning. By contrast, the
              supplied website in the runtime context, chando.com.cn, currently resolves to a separate page labelled 香度,
              so later chapters should treat chandogroup.com and the prospectus as the cleaner identity anchors for
              issuer-level facts.

              On technology positioning, the company is not just telling a marketing story. Its English innovation page
              says the R&D center had 20 laboratories, 590 patent applications with 275 authorized, 49 standards
              participations, and more than 220 scientific and technical articles, including 92 international
              publications, all as of May 2026. The same materials describe three scientific systems — skin science, raw
              material science, and product science — and four technical platforms covering raw materials, formulation,
              packaging, and evaluation. This gives Chando a tangible science stack for a domestic beauty company, even
              though public financial coverage still portrays its cost structure as more marketing-heavy than R&D-heavy.
