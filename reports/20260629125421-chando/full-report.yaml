  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              The risk stack is concentrated rather than diversified. At the top sits governance concentration: the
              Zheng family still controls roughly 87.82% of voting rights even after bringing in L’Oréal and
              Jiahua-backed capital, so outside money validates the story without materially changing control. The
              second thesis-level risk is dependence on the flagship Chando brand, which still contributes 95.3% of
              revenue. The third is the business model itself: sales and marketing consumed 54.2% of revenue in 2023,
              59.0% in 2024, and 57.2% in 2025, while public coverage still places R&D near 2% of revenue. Those three
              risks reinforce each other—heavy marketing props up a single brand in a market where regulation is
              tightening and domestic peers are proving more diversified and more science-forward. The result is a
              company that can still grow, but whose downside is abrupt if one key pillar breaks. The heatmap in FR001
              places governance concentration, brand concentration, and marketing dependence in the highest-risk cells
              because each one can transmit quickly into margin, valuation, and listing outcomes.
