        title: Brand architecture, hero lines, and the customer-facing product surface
        blocks:
          - type: paragraph
            body: >-
              Chando is not selling a single abstract “natural beauty” concept. The current public surface shows a
              five-brand architecture with distinct jobs-to-be-done: CHANDO remains the mass-premium Himalaya flagship;
              MAYSU carries the high-end anti-aging and space-technology story; Biorrier carries barrier repair; imine
              carries infant-and-child skin management; and Spring Summer carries botanical sunscreen and
              anti-photoaging. The 2026 CBE showcase turned that architecture into visible market evidence by putting
              the Little Purple Bottle 7th Generation, MAYSU Space Cream, Biorrier 728 Repair Cream, imine AD Intensive
              Care Cream, imine Baby Physical Sunscreen, and the CHUNXIA 509 sunscreen family on one stage. The
              cross-border CHANDO Himalaya storefront adds another useful lens: it groups current consumer demand around
              repairing, anti-aging, lifting, purifying, healthy aging, and moisturizing collections, showing how the
              brand tries to convert its Himalaya origin story into understandable benefit-led navigation. The practical
              weakness is that portfolio breadth still overstates economic breadth: the filing shows the flagship Chando
              brand still dominates revenue, so the group has a larger product map than it has a truly balanced product
              engine.
