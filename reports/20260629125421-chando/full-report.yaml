      - number: '8.5'
        title: What would change the call is mostly diligence, not storytelling
        blocks:
          - type: paragraph
            body: >-
              The remaining gating items are concrete. First, investors still need the actual IPO price range and
              proceeds plan; without those, the recommendation cannot move above Track because the deal may yet ask for
              a step-up that eliminates the entire risk-adjusted upside. Second, investors need post-promotion unit
              economics: CAC, repeat behavior, contribution margin, and a bridge from online mix growth to real cash
              generation. Third, they need clearer dilution and preference disclosure around the pre-IPO financing and
              any listing-linked conversion terms. Finally, they need evidence that the flagship brand concentration
              will ease rather than harden. The thesis breaks if Chando asks for a premium multiple despite these gaps,
              or if post-listing evidence shows that online growth still requires structurally high traffic buying. The
              thesis upgrades only if price stays near or below the round and new disclosure shows that the company can
              convert gross margin and brand reach into a more repeatable, lower-friction growth model.
