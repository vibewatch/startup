  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What Chando Is Actually Competing In
        blocks:
          - type: paragraph
            body: >-
              China beauty market sizing only becomes decision-useful once the boundary is declared up front. The
              broadest lens is beauty and personal care, which Euromonitor treats as the umbrella category covering skin
              care, colour cosmetics, hair care, fragrance, and adjacent personal-care spend. Chando is not trying to
              win that full stack in equal measure. Its relevant field is narrower: mass-premium skin care inside China
              cosmetics, with adjacent opportunity in dermocosmetics, efficacy-led facial care, and the digitally
              mediated conversion channels that increasingly decide share shifts.


              That distinction matters because public sources mix at least four non-equivalent denominators: skin care
              category revenue, cosmetics category revenue, broad beauty and personal care value, and all-channel
              transaction value or GMV. Official retail statistics sit below GMV-style measures because they capture
              booked retail revenue rather than platform transaction value, presale distortion, or full omnichannel
              throughput. Using the wrong denominator makes the market look either artificially small or artificially
              enormous.


              For Chando, the working market boundary should therefore include skin care spending, the
              premium-versus-mass shift within that category, digital traffic and conversion layers, and a narrower set
              of trust- and efficacy-led adjacent products. It should exclude unrelated fragrance-only spend, generic
              personal care categories that do not share the same buyer logic, and any assumption that all beauty GMV is
              equally contestable by a skin-care-led brand.
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM045
              - CM046
              - CM047
