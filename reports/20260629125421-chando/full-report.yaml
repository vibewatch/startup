              The 2025 rebound in net current assets and cash is real, yet it coincided with a RMB742 million round from
              L’Oréal and Jiahua/Himalaya. The IPO therefore arrives after a private-market de-risking step, which is
              helpful for runway but should temper any claim that the business self-funded its stronger liquidity
