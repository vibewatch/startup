      - number: '1.2'
        title: Leadership, governance, and control
        blocks:
          - type: paragraph
            body: >-
              Founder Zheng Chunying remains the central decision-maker. Reviewed 2026 reporting and the
              prospectus-linked coverage identify him as chairman and chief executive officer, with the company still
              effectively run as a Zheng family enterprise more than two decades after founding. The pre-IPO ownership
              disclosures show Zheng Chunying together with Zheng Chunbin, Zheng Chunwei, and Zheng Xiaodan controlling
              about 87.82% of voting rights through a multilayer BVI and family-trust structure. That concentration
              gives the family exceptional strategic control, but it is also one of the first governance issues surfaced
              by skeptical coverage and regulator questions.

              Public reporting provides more leadership detail than many Chinese consumer IPO candidates. A 2026 Sina
              Finance summary of the prospectus says the board has nine directors: four executive, two non-executive,
              and three independent. The named executive directors include Zheng Chunying, Zheng Chunbin, Zheng Chunwei,
              and Du Shenglin; the named non-executives include Zheng Xiaodan and Jiahua Capital compliance head Zhu
              Xuejing; and the executive bench also includes CFO Li Zhuoguang and vice presidents Li Min and Zou Yue.
              Official corporate news adds Chen Juanling, general manager of public affairs, as a visible external
              spokesperson for the group's technology and sustainability narrative.

              The governance picture therefore has two layers. On one hand, Chando can show a fuller public bench than
              many founder-led consumer brands. On the other hand, the concentration of family control, the trust
              structure, and the late arrival of external capital all suggest that minority-investor protections and
              independent oversight deserve close follow-up in any investment case. The board exists, but the public
              evidence still points to a company whose identity is inseparable from its founder family.
