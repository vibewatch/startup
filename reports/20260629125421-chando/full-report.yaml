  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - case
      - assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bull
        - >-
          Online efficiency improves, concentration eases, and investors start to see Chando as a scaled domestic beauty
          platform closer to Proya/Botanee than to weaker social-commerce peers.
        - 2.0x-2.2x sales on 2025 revenue implies ~RMB10.6bn-RMB11.7bn equity value.
        - Needs disclosure of CAC, repeat, multi-brand traction, and no premium-valuation surprise.
        - Possible, but public evidence is not yet strong enough to underwrite as the central case.
      - - Base
        - >-
          IPO prices close to the last round, growth holds, and public investors reward the scale but still discount
          concentration and disclosure gaps.
        - 1.3x-1.6x sales implies ~RMB6.9bn-RMB8.5bn, roughly bracketing the RMB7.14bn round.
        - Upside is modest if the deal already asks for a premium to the round.
        - Most supportable scenario on current evidence.
      - - Bear
        - >-
          Beauty IPO appetite softens, customer-acquisition economics stay heavy, and public investors value Chando more
          like a lower-trust or lower-diversification peer.
        - 0.8x-1.0x sales implies ~RMB4.3bn-RMB5.3bn equity value.
        - Step-up pricing, weak post-listing updates, or governance overhangs would drive this outcome.
        - Downside is very plausible if the listing comes rich relative to disclosure quality.
    notes: >-
      Scenario values use simple revenue-multiple discipline on the disclosed 2025 sales base rather than a
      false-precision DCF, because public inputs still omit several operating drivers.
    claimRefs:
      - CV009
      - CV039
      - CV040
