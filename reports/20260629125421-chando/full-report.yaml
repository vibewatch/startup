      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The round is the right anchor, not the reason to rush
            body: >-
              Chando’s latest financing provides a real valuation floor, but the public evidence does not yet justify
              paying a large premium above that floor before IPO pricing and unit economics are visible.
