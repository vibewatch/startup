      - number: '3.2'
        title: Incumbents, adjacent players, and substitutes change the job-to-be-done comparison
        blocks:
          - type: paragraph
            body: >-
              A buyer choosing against Chando is not only comparing domestic skincare brands. Botanee’s Winona offers a
              dermocosmetics and pharmacy-led substitute when the purchase trigger is sensitive-skin efficacy or
              doctor-adjacent trust; its 2025 filing shows a 19.4% share in China dermocosmetics, top-tier high-end
              skincare placement, and widening OTC/OMO reach. Florasis is a different adjacent threat: it positions
              itself around premium Chinese aesthetics, makeup-plus-skincare storytelling, five R&D centers, and
              giftable artistry rather than Chando’s mass skincare core, so it competes more for culture-led
              self-gifting and premium cosmetics baskets than for basic hydration or repair. Above both sits the global
              incumbent ceiling. Chando’s own coverage notes that L’Oréal, P&G, Estée Lauder, Shiseido, and LVMH still
              dominate the top-five overall market ranks, while official L’Oréal and Shiseido surfaces show why—deep
              research systems, prestige brand portfolios, and listed-company operating discipline. The real substitute
              set is therefore a repertoire: domestic mass skincare, dermocosmetics, premium Japanese and French beauty,
              and adjacent makeup-led premiumization, not a single like-for-like shelf match.
