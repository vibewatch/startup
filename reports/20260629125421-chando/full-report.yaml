              Chando’s gross margin profile looks strong enough to support a premium growth narrative, but more than
              half of revenue is still being recycled into selling and distribution. That makes the underwriting
              question less about product margin and more about whether paid traffic, KOL relationships, and event-led
              brand spend are earning acceptable lifetime value.
