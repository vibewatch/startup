      - number: '4.3'
        title: Marketing intensity versus R&D depth
        blocks:
          - type: paragraph
            body: >-
              Chando’s financial tension is not gross margin but spend allocation. Selling and distribution expense
              consumed more than half of revenue in all three disclosed years, peaking at 59.0% in 2024 and remaining
              57.2% in 2025. Independent reporting says advertising alone was about RMB1.66 billion in 2025, and Bamboo
              Works tied the model explicitly to large KOL usage and rising platform tolls. The filing and external
              reporting also indicate internal KOLs rose from 52 to 98 between 2023 and 2025, while external KOL
              relationships ended 2025 at 13,611. Against that, reported R&D spending stayed near 2% of revenue, despite
              company materials touting 20 laboratories, 590 patents, and a large publication base. The issue is not
              that Chando lacks technical assets; it is that public financials still show a business where brand and
              traffic buying dominate the P&L, while R&D intensity remains too low to clearly support sustained
              premiumization or defensible efficacy-led pricing power.
