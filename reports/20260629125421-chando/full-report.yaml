        - Sales and marketing ratio versus R&D ratio
        - If sales and marketing remains >55% while R&D stays near or below 2.5% for another reporting cycle
        - Treat the story as traffic-dependent rather than innovation-led and apply valuation discount
      - - Flagship-brand dependence
        - Flagship revenue share
        - If the flagship still contributes >90% of revenue after new-capital deployment
        - Assume diversification has failed and keep single-brand downside in base case
      - - Governance concentration
        - Board independence and committee powers
        - If post-IPO materials do not materially improve minority safeguards beyond current family control
        - Escalate governance risk rating and demand stronger covenants or lower entry price
      - - Regulatory / quality risk
        - Official notice naming the company or major SKU for sampling, claims, or adverse reactions
        - Any confirmed NMPA or provincial enforcement event touching flagship SKUs
        - Pause underwriting or reassess thesis until root cause and remediation are clear
      - - Channel dependency
        - Online mix plus Douyin/Tmall ROI trend
        - If online dependence stays near 70% while merchant-led operations fail to lower CAC or improve repeat purchase
        - Assume platform power is capturing economics that the brand cannot retain
      - - IPO / valuation risk
        - Listing progress and pricing relative to the last private mark
        - If the IPO lapses again or clears only with a steep discount to the 2025 private valuation
        - Read the discount as a market verdict on governance and profit quality, not just timing noise
    notes: >-
      Triggers are external investor watch items rather than management KPIs; each is designed to tell you whether the
      mitigant is becoming real or staying narrative.
    claimRefs:
