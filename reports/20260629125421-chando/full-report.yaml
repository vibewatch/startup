        title: Ingredient engine, R&D systems, and how the science story is structured
        blocks:
          - type: paragraph
            body: >-
              The strongest part of Chando’s public product-tech case is not a single SKU but the way it organizes
              research. Official pages consistently describe three scientific systems — skin science, raw-material
              science, and product science — plus four technology platforms spanning raw materials, formulation,
              packaging, and evaluation. The R&D center claims 20 laboratories, 590 patent applications, 275
              authorizations, 49 standard-setting participations, and more than 220 technical articles including 92
              international publications as of May 2026. Within that stack, HiMurchaSin is the core ingredient
              narrative: Chando says the work began in 2013, involved Himalayan strain isolation, fermentation-process
              iteration, downstream processing improvements, and multiple academic collaborations before reaching
              commercial use. The 2026 launch cycle extends that logic into HiMurchaS Super Anti-Aging Peptide and the
              7th-generation Little Purple Bottle, while the IMCAS 2026 presentation gives Chando a higher-grade proof
              point for 577 brightening and microRNA-based pigment management. The caveat is that most efficacy and
              mechanism detail still lives on company or PR surfaces, not in a public dossier that fully exposes
              methods, controls, or peer review.
