            body: >-
              The strongest structural change in the filing is channel migration. Online channels rose from 61.9% of
              revenue in 2023 to 69.5% in 2025, while offline contribution fell to 30.2%. That mix shift matters because
              the same filing shows online gross margin running materially above offline gross margin: 75.6% versus
              59.6% in 2025. Chando therefore appears to be leaning into a channel mix that is margin-accretive before
              marketing spend. Management also claims it has spent years building the digital plumbing behind that push,
              including 105 digital systems, omni-channel inventory management, and a cloud-store architecture meant to
              connect offline stores with internet traffic. The catch is that public disclosure still stops at channel
              mix and channel gross margin. It does not disclose realized CAC, payback, reorder rates, or DTC
              contribution margin after traffic and KOL expense, so investors can see the top of the funnel, but not the
              true efficiency of the funnel.
