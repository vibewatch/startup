  - id: TI006
    title: Public Financial Gaps
    columns:
      - Missing Metric
      - Impact
      - Why It Matters
      - Exact Diligence Path
    rows:
      - - Realized ASP by SKU and channel
        - Cannot judge whether gross-margin expansion came from price, mix, or promotion timing
        - List pricing below RMB300 does not explain realized net revenue quality
        - Request SKU-level ASP, discount, and return data for top 20 SKUs by channel
      - - CAC, payback, retention, and repeat rate
        - No direct read on DTC efficiency or marketing ROI
        - A 57% S&M ratio can only be justified if payback and retention are strong
        - Request monthly cohort tables by platform, channel CAC, and payback by campaign
      - - Distributor rebates, receivables aging, and return rights
        - Offline revenue quality remains under-explained
        - Distributor economics can flatter revenue while hiding channel stuffing or rebate dependency
        - Request aged receivables, rebate waterfalls, and sell-in versus sell-through data
      - - Inventory aging and obsolescence by brand / SKU
        - Hard to test whether one-brand concentration is creating hidden markdown risk
        - Beauty businesses can carry gross margin on paper while building stale inventory
        - Request aging buckets, write-down policy, and post-promotion inventory burn-down
      - - Customer concentration and top-platform exposure
        - Cannot tell whether a few channels dominate conversion risk
        - Heavy JD / live-stream / KOL reliance could concentrate bargaining power outside the company
        - Request top 10 platform / customer contribution and contract terms
      - - Exact IPO proceeds split and post-IPO capex plan
        - Capital-adequacy math is directionally positive but not fully underwritten
        - Application-proof redactions hide how aggressively management will keep spending
        - Refresh on final prospectus and reconcile uses-of-proceeds to 2026 operating plan
    notes: >-
      These are not generic asks; each gap is directly linked to Chando’s unusually high gross margin paired with
      persistently high sales and marketing intensity.
