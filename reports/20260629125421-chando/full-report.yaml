            body: >-
              The comparable set gives a usable but not simplistic valuation band. Proya is the strongest direct public
              benchmark because it combines domestic beauty positioning, larger scale, and public-market disclosure.
              Yahoo Finance and Google Finance showed Proya at about RMB22.45 billion market cap and roughly 2.12x sales
              on the 2026 run date, with about RMB10.54 billion of trailing revenue and a mid-teens operating margin.
              Botanee is the most relevant premium-skincare substitute: its Google Finance market cap was about RMB12.78
              billion against RMB5.359 billion of 2025 revenue, implying roughly 2.38x sales. Yatsen is the downside
              public marker: Google and Yahoo put its market cap near US$300 million and Yahoo listed just 0.45x sales,
              while its own Q1 2026 release showed skincare growth but also 72.2% selling-and-marketing intensity and
              fresh external financing. Chando’s 1.34x round multiple therefore sits in the middle of the band: above
              Yatsen because Chando has better scale and margin proof, below Proya and Botanee because it still carries
              heavier concentration and weaker disclosed efficiency. That relative placement makes sense. What would not
              make sense is paying Proya-like or Botanee-like multiples before Chando proves it deserves them.
