              the stack is fully transparent. The same prospectus extract also repeatedly references OEM and ODM, yet
              the public record reviewed here does not disclose a plant-by-plant map or the split between in-house and
              outsourced categories. Digital technology partly compensates for that opacity at the commercial layer.
