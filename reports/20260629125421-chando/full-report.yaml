      - number: '1.3'
        title: Funding, operating profile, and IPO path
        blocks:
          - type: paragraph
            body: >-
              Chando's capital story changed sharply in 2024-2025. Multiple sources describe the L'Oréal and Jiahua
              Capital transactions as the first known outside financing since founding. The prospectus-related coverage
              shows Meiting, a wholly owned L'Oréal vehicle, subscribed for 7,026,459 shares for about RMB 409.2 million
              and later bought another 531,023 shares for about RMB 33.45 million, bringing L'Oréal's total investment
              to roughly RMB 442.7 million. Himalaya International, backed by Jiahua Capital, subscribed for 4,761,905
              shares for RMB 300 million. Together these transactions exceeded RMB 700 million and implied a post-money
              valuation of about RMB 7.14 billion, enough for Chando to be described as a domestic beauty unicorn before
              listing.

              The operating profile is scaled, but the quality of growth is debated. Prospectus-linked reporting gives
              revenue of RMB 4.442 billion in 2023, RMB 4.601 billion in 2024, and RMB 5.318 billion in 2025, with
              corresponding net profit of RMB 302 million, RMB 190 million, and RMB 351 million. Gross margin reached
              70.6% in 2025, but sales and marketing consumed 54.2%, 59.0%, and 57.2% of revenue in 2023-2025, while R&D
              hovered near 2% of revenue. Online sales mix rose from 61.9% to 69.5% over the same period, but the
              flagship CHANDO brand still contributed 95.3% of 2025 revenue and offline retail points remained numerous
              at 64,800.

              The IPO path reflects both ambition and friction. Chando first filed in Hong Kong on 29 September 2025,
              let that application lapse on 29 March 2026, then refiled on 2 April 2026. Company-friendly sources framed
              the lapse as procedural. Adverse and skeptical coverage adds a harder interpretation: investors and
              regulators remain concerned about brand concentration, low relative R&D intensity, pricing fairness in the
              pre-IPO round, and the family-trust structure behind control. Those concerns do not invalidate the
              business, but they explain why the company overview has to carry both scale and concentration in the same
              paragraph.
