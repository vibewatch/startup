      - number: '1.4'
        title: Milestones, innovation narrative, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Chando's public chronology combines a long domestic-brand build with a more recent effort to present
              itself as a science-led, globally credible beauty platform. The most notable technical milestones
              disclosed on company pages include a 2013 space-breeding collaboration with the Chinese Academy of
              Sciences, the launch of HiMurchaSin after roughly a decade of self-directed fermentation research, a 2020
              digital-transformation program that official materials say eventually deployed 105 systems, and the 2026
              CBE China Beauty Expo showcase where five brands were presented alongside new claims around
              fatigue-induced aging, pigment management, and space skincare. This gives later chapters a coherent
              sequence for product, channel, and brand-building milestones.

              The sustainability and social-license story is also developed enough to matter. Official 2026 materials
              say the company launched a 2030 sustainability strategy in 2024 and has tied its ESG message to Himalayan
              ecology, green packaging, and circularity. The company says it has worked with the China Environmental
              Protection Foundation since 2016, donated RMB 29.2 million by 2025, planted 6.66 million square meters of
              green barley grass in Tibet, and upgraded that program into a 2025-2030 biodiversity project. These are
              useful diligence inputs because they show management is trying to widen the group narrative beyond
              cosmetics and channels into stewardship and brand purpose.

              Still, the adverse record cannot be ignored. Public critical coverage in 2026 repeatedly returned to four
              issues: the IPO filing lapse, heavy dependence on one brand, unusually high marketing intensity relative
              to R&D, and CSRC questions about family trusts and pre-IPO investor pricing. Even the domestic product
              site carries an NMPA warning that cosmetics cannot claim medical effects, a reminder that efficacy-led
              messaging in this category is tightly bounded. The overall takeaway is not that Chando lacks milestones —
              it has many — but that the next leg of credibility depends on proving the science and governance story can
              catch up with the brand's scale.
