  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - IPO price range and gross proceeds
        - Formal range, cornerstone demand, and precise primary/secondary split
        - Without price, valuation stance cannot move beyond a price-sensitive track stance.
        - Read the next HKEX filing / pricing supplement and syndicate marketing materials.
      - - Preference and dilution terms
        - Conversion mechanics, liquidation preference economics, and any ratchet-style protection in the pre-IPO round
        - >-
          Public equity can look cheaper than it really is if round economics are more senior than the headline
          suggests.
        - Review final prospectus cap-table notes and counsel summary.
      - - Unit economics
        - CAC, repeat rate, order frequency, and contribution margin by major online channel
        - These numbers determine whether Chando deserves to rerate toward Proya/Botanee or remain discounted.
        - Request management bridge or investor presentation with channel economics.
      - - Multi-brand diversification
        - Revenue share and growth profile of non-flagship brands
        - A falling concentration ratio is one of the few credible paths to a premium multiple.
        - Ask for brand-level revenue disclosure or sell-through trends in roadshow Q&A.
      - - Post-listing governance commitments
        - Board independence, related-party safeguards, and spokesperson / controversy controls
        - Needed to assess whether governance overhangs are temporary optics or structural.
        - Review governance section of final prospectus and post-listing board committee setup.
    notes: >-
      Each diligence ask is directly tied to a recommendation-moving variable rather than a generic housekeeping
      request.
    claimRefs:
      - CV005
      - CV037
