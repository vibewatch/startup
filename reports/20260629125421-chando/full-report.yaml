      - number: '7.5'
        title: Mitigants, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The chapter is not a zero-mitigation story. Chando has real scientific and operating assets: the company
              says it has 20 laboratories, hundreds of patent applications, 105 digital systems deployed since 2020, a
              large retail footprint, and a 2030 sustainability framework with explicit ESG targets. Strategic investors
              also bring some external validation. But these mitigants should be discounted until they show up in better
              outcomes: lower marketing intensity, higher R&D productivity, stronger non-flagship revenue, cleaner
              working-capital metrics, and more transparent governance safeguards. The most important watch items are
              therefore measurable. If marketing stays above the mid-50s as a percentage of revenue while R&D remains
              around 2%, the “traffic treadmill” is intact. If the flagship stays above 90% of revenue, diversification
              has not happened. If adverse-reaction notices, sampling failures, or claim-substantiation disputes touch
              the brand, the flagship concentration risk immediately becomes a reputation-and-revenue risk. And if the
              IPO cannot clear the public market at a reasonable level after the lapse and the fairness questions, the
              private mark itself becomes a risk signal rather than a support floor.
