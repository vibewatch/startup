companyProfile:
  summary: >-
    Chando is a Shanghai-founded Chinese cosmetics group built around its flagship CHANDO brand and a smaller set of
    secondary labels including MAYSU, Biorrier, Spring Summer, and imine. Public filings and company materials position
    it as a scaled multi-brand beauty platform spanning skincare, makeup, personal care, and mother-and-baby products,
    but the economics remain highly concentrated: 2025 revenue reached RMB 5.318 billion while the flagship brand still
    generated about 95.3% of sales. Governance is similarly concentrated. Founder Zheng Chunying remains chairman and
    chief executive officer, and the Zheng family continues to control the business through a multilayer trust and
    holding structure even after bringing in outside capital. The result is a real, sizable domestic beauty company with
    an active Hong Kong IPO path, but one whose underwriting still hinges on whether family control, marketing
    intensity, and brand concentration can be discounted enough at listing.
