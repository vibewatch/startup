company:
  name: Chando
chapter:
  number: 4
  title: Financials
  summary: Chando entered its 2026 HK IPO process with real scale — RMB5.32 billion of 2025 revenue, 70.6% gross margin, and
    improving liquidity — but the financial story is still dominated by a marketing-heavy P&L and a one-brand revenue base.
    Selling and distribution expense stayed above 54% of revenue for three straight years, while R&D remained near 2%, leaving
    underwriting blocked by missing unit-economics disclosure even after a RMB742 million pre-IPO round from L’Oréal and Jiahua/Himalaya
    improved cash and working capital.
sections:
- id: revenue-quality
  title: Revenue model, growth, and margin quality
  body: 'Chando remains a straightforward branded-consumer-products story: it sells mass-market cosmetics, largely below RMB300
    per item, through a five-brand portfolio led overwhelmingly by the flagship Chando brand. The filing reported revenue
    of RMB4.44 billion in 2023, RMB4.60 billion in 2024, and RMB5.32 billion in 2025, implying modest 2024 growth followed
    by a sharper 2025 rebound. Gross margin improved each year to 70.6% in 2025, which is unusually high for a mass-market
    beauty business and suggests meaningful brand equity, favorable mix, and/or channel economics. But revenue quality is
    less diversified than the headline margin suggests: independent coverage says the namesake Chando brand still generated
    roughly 95.3% of 2025 sales. That concentration means the group is still underwriting a single hero brand rather than
    a truly balanced multi-brand platform, and any brand-relevance wobble would flow directly into revenue and inventory risk.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI016
  - CI042
  - CI044
  tableRefs:
  - TI001
  - TI002
