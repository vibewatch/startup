callouts:
- calloutType: risk
  title: Marketing intensity is the core earnings risk
  body: Chando’s gross margin profile looks strong enough to support a premium growth narrative, but more than half of revenue
    is still being recycled into selling and distribution. That makes the underwriting question less about product margin
    and more about whether paid traffic, KOL relationships, and event-led brand spend are earning acceptable lifetime value.
  claimRefs:
  - CI004
  - CI007
  - CI008
  - CI034
  - CI041
- calloutType: risk
  title: Liquidity improved, but only after a meaningful pre-IPO funding round
  body: The 2025 rebound in net current assets and cash is real, yet it coincided with a RMB742 million round from L’Oréal
    and Jiahua/Himalaya. The IPO therefore arrives after a private-market de-risking step, which is helpful for runway but
    should temper any claim that the business self-funded its stronger liquidity position.
  claimRefs:
  - CI022
  - CI023
  - CI027
  - CI031
  - CI032
- calloutType: recommendation
  title: Demand final-prospectus unit economics before underwriting valuation
  body: Investors can already see scale, margin, and capital support, but not realized ASP, CAC, payback, retention, or distributor-rebate
    economics. Those missing pieces decide whether Chando’s high gross margin represents durable pricing power or simply a
    gross-profit pool that is being spent away to keep traffic moving.
  claimRefs:
  - CI046
  - CI047
  - CI048
