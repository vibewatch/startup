    - HKEX filing
  - - Flagship Chando brand
    - Mass-market positioning with premiumized hero SKUs layered in
    - Realized ASP by flagship SKU is not public
    - The brand is still the economic engine of the group at ~95.3% of 2025 sales
    - HKEX filing; Bamboo Works; Jianshiapp
