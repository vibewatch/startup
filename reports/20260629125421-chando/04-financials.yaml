  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASP, discount ladders, and rebate schedules by channel and major SKU.
    whyItMatters: Without realized pricing, underwriters cannot separate genuine pricing power from promotion-heavy sell-through.
    diligencePath: Request SKU-level ASP and discount waterfalls by platform, distributor, and offline counter.
    relatedQuestionRefs:
    - QI022
  - type: private-evidence-only
    severity: material
    topic: channel-cac
    missingEvidence: CAC, payback, retention, and repeat-purchase cohort data by channel.
    whyItMatters: A business spending 57.2% of revenue on selling and distribution can only be underwritten if payback and
      retention are visible.
    diligencePath: Request monthly cohort tables, CAC by platform, repeat rates, and contribution margin after marketing.
    relatedQuestionRefs:
    - QI023
  - type: missing-source
    severity: material
    topic: working-capital-detail
    missingEvidence: Inventory-aging, bad-debt, receivables-aging, return-rate, and rebate disclosures detailed enough for
      channel-quality underwriting.
    whyItMatters: Revenue quality in legacy beauty distribution depends on whether sell-in becomes clean sell-through without
      excess rebates or stale inventory.
    diligencePath: Request aged receivables and inventory reports, sell-in vs. sell-through dashboards, and brand-level markdown
      history.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI006
  - type: stale
    severity: material
    topic: ipo-proceeds
    missingEvidence: Final prospectus uses-of-proceeds split and any updated listing-range disclosures after application-proof
      redactions clear.
    whyItMatters: Exact post-IPO capital deployment determines whether spending will lean toward DTC growth, R&D, overseas
      expansion, or balance-sheet reinforcement.
    diligencePath: Refresh the final HKEX prospectus and reconcile the use-of-proceeds section to the 2026 operating plan.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI005
