- id: underwriting-gaps
  title: Underwriting blockers and disclosure gaps
  body: 'The filing is informative enough to describe Chando’s trend line, but not enough to underwrite the business with
    conviction. It is still an application proof, so exact IPO proceeds and some listing-related disclosures are redacted
    or subject to change. More importantly, public materials do not provide realized ASP by SKU or channel, channel-level
    discount ladders, customer acquisition cost, payback, repeat rates, distributor rebates, inventory aging, bad-debt detail,
    or a customer-concentration view. Those omissions are particularly material because Chando’s reported gross margin is
    high while sales and marketing intensity is also extremely high; without post-promotion unit economics, investors cannot
    tell whether the company is buying growth at acceptable returns or merely recycling gross profit into traffic and celebrity
    exposure. The financial verdict is therefore mixed: real scale, strong gross margin, and improving liquidity, but with
    underwriting still blocked by revenue-quality opacity and a structurally marketing-heavy model.'
  claimRefs:
