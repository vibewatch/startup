  - - Offline gross margin
    - 58.6% (2023); 60.4% (2024); 59.6% (2025)
    - high
    - Sets the cost of keeping a legacy physical network relevant
    - Disclose counter-level economics and distributor support cost
  - - Sales and marketing ratio
    - 54.2% (2023); 59.0% (2024); 57.2% (2025)
