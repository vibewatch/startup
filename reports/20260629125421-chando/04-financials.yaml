tables:
- id: TI001
  title: Revenue Streams
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current Value / Status
  - Revenue Quality
  - Diligence Ask
  rows:
  - - Online direct product sales
    - Sell skincare, makeup, personal care, and adjacent products through owned stores and e-commerce touchpoints
    - RMB per SKU / basket
    - Online channels were 69.5% of 2025 revenue; one online subchannel accounted for 56.5% of revenue in the filing channel
      table
    - Highest-quality disclosed stream because it is direct and margin-rich, but realized CAC and discounting are still opaque
    - Disclose platform-by-platform CAC, repeat rate, and contribution margin after traffic and KOL costs
  - - Online distributor / reseller sales
    - Sell into online distributors or marketplace resellers
    - RMB per shipment / reseller order
    - The filing channel table shows a second online subchannel at 13.0% of 2025 revenue
    - Useful for scale, but channel rebates, returns, and reseller pricing are undisclosed
    - Disclose reseller terms, return rights, and realized net revenue after rebates
  - - Offline distributor sales
    - Sell through legacy offline distributors and counters
    - RMB per distributor order
    - Offline channels were 30.2% of 2025 revenue; one offline subchannel contributed 16.4%
    - Lower quality than direct DTC because working-capital and rebate economics are not public
    - Provide distributor concentration, receivable aging, and rebate / return policy disclosure
  - - Offline direct retail / counters
    - Brand-controlled offline retail, counters, and experiential spaces
    - RMB per store / counter sale
    - A second offline subchannel represented 13.5% of 2025 revenue, supported by 60,000+ outlets and current experiential
      marketing
    - Potentially strategic for sampling and brand presence, but store-level productivity is undisclosed
    - Share same-store sales, four-wall contribution, and counter closure/opening data
  - - Ancillary or other sales
    - Small residual channel/product revenue lines
    - RMB per transaction
    - Residual contribution in the filing was about 0.3% of 2025 revenue
    - Immaterial to thesis, but not clearly broken out in public materials
    - Clarify what sits in other and whether it includes cross-border or non-core products
  notes: Channel labels for minor subchannels are inferred from English extracts of the Chinese filing; use the original PDF
    for precise Chinese captions before underwriting channel rebates.
