evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount-disclosure
    missingEvidence: A current employee headcount by function and geography.
    whyItMatters: >-
      Headcount is one of the chapter's requested cover metrics and is a proxy for operating scale cost structure and
      IPO readiness.
    diligencePath: Request the latest HR org chart or payroll summary during management diligence.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-disclosure
    missingEvidence: >-
      A complete cap table and round history covering founder-era funding any internal restructurings and the 2024-2025
      outside round.
    whyItMatters: The public record supports the pre-IPO outside round but not a precise lifetime capital-raised figure.
    diligencePath: Request cap-table history subscription agreements and any shareholder-loan schedule.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: regulatory-status
    missingEvidence: >-
      A public or provided update on CSRC supplemental-question closure and current HKEX hearing status after the April
      2026 refiling.
    whyItMatters: >-
      IPO timing valuation and governance-risk assessment all depend on whether the company cleared the issues flagged
      in the first filing cycle.
    diligencePath: Request the latest sponsor update CSRC correspondence and hearing calendar status from management or deal counsel.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO004
  - type: stale
    severity: minor
    topic: valuation
    missingEvidence: A refreshed valuation mark after the April 2026 refiling.
    whyItMatters: >-
      The last clearly disclosed valuation anchor is the 2025 pre-IPO round which may not equal current investor
      expectations.
    diligencePath: Request current pre-marketing valuation guidance or secondary transaction references.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: web-identity
    missingEvidence: >-
      A clear corporate explanation of how chando.com.cn relates to the listed issuer and the chandogroup or
      chando-himalaya sites.
    whyItMatters: Public web identity fragmentation can create diligence noise for customers investors and international partners.
    diligencePath: Ask management for the current domain map and which sites are issuer-level brand-level or legacy properties.
  - type: private-evidence-only
    severity: material
    topic: chando-sam
    missingEvidence: >-
      A disclosed category and channel revenue split for Chando, including the share from skin care versus other beauty
      categories.
    whyItMatters: >-
      Without company-specific mix, public market size can only frame directionally attractive demand and cannot support
      a precise Chando SAM or SOM.
    diligencePath: >-
      Request management-level sell-through by category, channel, and price band for the last three years, plus forecast
      assumptions for new launches.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: offline-subchannel-mix
    missingEvidence: >-
      A credible public breakdown of skincare sales across department stores, specialty beauty chains, pharmacies,
      supermarkets, and other offline routes.
    whyItMatters: >-
      Offline still matters, but public sources only provide the broad offline-versus-online split, which limits
      channel-priority precision.
    diligencePath: >-
      Collect NielsenIQ, Kantar, or retailer-sourced sell-out data, and ask Chando for offline channel sell-through by
      subchannel and city tier.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: Quantified spend concentration by age cohort, city tier, and regimen complexity inside China skincare.
    whyItMatters: >-
      Buyer, user, and payer are usually the same person, but valuation-relevant customer concentration depends on who
      actually controls the deepest budgets.
    diligencePath: >-
      Request customer-cohort analysis from Chando and supplement it with panel or payment-card data by demographic
      segment.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-size-scope
    missingEvidence: >-
      A reconciled bridge between official retail sales, analyst category revenue, and all-channel transaction value for
      the same year.
    whyItMatters: >-
      The public market can still be analyzed, but any valuation model that mixes those denominators without
      reconciliation will overstate or understate addressable revenue.
    diligencePath: >-
      Build a denominator bridge using official retail sales, platform GMV, and audited channel sell-through from major
      brands or listed peers.
    relatedQuestionRefs:
      - QM004
      - QM020
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: exact-cross-brand-pricing
    missingEvidence: >-
      A clean same-day capture of hero-SKU list price and promo price across Chando, Winona, Perfect Diary, Florasis,
      and global incumbents in China channels.
    whyItMatters: >-
      Without synchronized SKU-level pricing, the pricing table can show band and positioning logic but cannot prove
      exact price elasticity or promo intensity at the shelf level.
    diligencePath: >-
      Pull same-day Tmall/JD/Douyin/pharmacy screenshots for a fixed hero-SKU basket and normalize list price, promo
      price, size, and bundle mechanics.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: proya-offline-door-count
    missingEvidence: A retained official Proya source that cleanly states current offline door, counter, or store count.
    whyItMatters: >-
      Offline reach is part of the Chando-vs-Proya comparison, and the retained Proya filing detail is much stronger on
      channel mix than on physical-door disclosure.
    diligencePath: >-
      Capture Proya's current financial-reports or announcements page sections that disclose offline doors, or use an
      official annual report page where the metric is stated explicitly.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: yatsen-full-year-brand-split
    missingEvidence: >-
      A retained official Yatsen source that breaks full-year 2025 revenue between Perfect Diary and the skincare brand
      portfolio.
