- id: SM-03
  title: 'Channels and Buyer Structure: Offline Still Leads, but Digital Sets the Tempo'
  body: >-
    China skin care is not yet an online-only market, but the digital layer increasingly controls discovery, event timing, and conversion quality. IMARC says offline still held 58.6% of skincare distribution in 2025, which means beauty counters, specialty retail, and other physical channels still matter. Yet the same source says online is the fastest-growing route, and Daxue argues online already represents 65.36% of all-channel cosmetics transaction value — vastly above the national online share for physical-goods retail. The takeaway is not that one source must be wrong; it is that skin care and cosmetics channel metrics are being measured at different levels and with different definitions.


    Platform-level evidence shows how concentrated the digital battleground already is. ChemLinked says 2024 cosmetics GMV across Taotian, Douyin, JD, and Kuaishou reached nearly 540 billion yuan, with Taotian still largest, Douyin catching up fastest, and JD growing steadily from a smaller base. Event data from Alibaba and JD reinforces that promotions, livestream rooms, and loyalty cohorts act as quasi-budget allocators in a category where the buyer, user, and payer are usually the same person.


    For Chando, that means channel strategy is less about choosing online or offline in the abstract and more about orchestrating prestige counters, broad offline presence, flagship-store loyalty, livestream conversion, and event windows as one system. Offline still validates trust; digital increasingly determines velocity.
