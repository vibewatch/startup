- id: SM-05
  title: Constraints, Regulation, and Diligence Implications for Chando
  body: >-
    The market is attractive, but it is not easy. Two constraints dominate. First, demand quality is softer than top-line GMV headlines imply. ChemLinked’s 2024 market review shows cosmetics growth clustering around major festival windows and then dropping hard after promotions, including a 26.4% November decline once Double 11 presales had already been pulled forward. Store closures, layoffs, and widespread competition in 2025 reinforce the idea that not all nominal market growth is high-quality growth.


    Second, the regulatory stack is deep and still moving. NMPA’s English cosmetics portal highlights electronic labels and filing rules; the December 2025 Opinions and interpretation stress both tougher safety governance and continued industry upgrading; and ChemLinked reports that March 2026 brought another draft to streamline registration and notification. That means speed-to-market is shaped not just by brand creativity but by registration capability, ingredient readiness, label compliance, and post-market governance.


    For Chando, this combination argues for disciplined expectations. Public evidence supports a large skin-care market and strong digital conversion infrastructure, but not a clean public SAM by channel and category. The next diligence step is to get Chando’s own sell-through, category mix, channel mix, and repeat-purchase data so the public market lens can be translated into company-specific share capture rather than broad beauty optimism.
