- id: SM-02
  title: 'Sizing Lenses: Large Market, Real Contradictions, and a Narrower Chando Slice'
  body: >-
    Public market sizes point in the same directional conclusion — China skin care is large and still expected to expand — but they disagree materially on present size and long-run slope. Fortune Business Insights places China skin care at USD 59.08 billion in 2024 and USD 64.23 billion in 2025, compounding at 10.43% through 2032. IMARC gives a lower 2025 base of USD 54.23 billion and a slower 7.72% CAGR through 2034. Fortune’s China cosmetics market figure is smaller again at USD 38.90 billion in 2024 because it excludes the broader beauty and personal-care perimeter.


    At the macro layer, Euromonitor says China beauty and personal care declined 2.2% in constant value terms to USD 75 billion in 2024, while NBS-linked retail statistics cited by ChemLinked show cosmetics retail sales of 435.7 billion yuan and a 1.1% year-on-year decline. NMPA’s own 2025 interpretation adds a still-broader lens, stating that transaction value exceeded 1 trillion yuan in 2024. Those figures should not be averaged together. They are contradictory if treated as one number, but informative if preserved as separate views of category revenue, official retail bookings, and all-channel transaction flow.


    The practical implication is that Chando should anchor on the skin-care-specific range and use the broader figures only as context for channel scale and sector relevance. A realistic public SAM framing is the China skin-care slice plus adjacent dermocosmetics and digitally mediated premium-mass demand, not the full trillion-yuan beauty economy.
