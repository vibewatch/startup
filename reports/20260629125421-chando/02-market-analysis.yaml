chapter:
  number: 2
  title: Market Analysis
  summary: 'China beauty remains a large market, but public size estimates diverge materially by scope: official 2024 cosmetics retail sales were RMB435.7 billion and down 1.1% YoY, while NMPA-cited transaction value exceeded RMB1 trillion and analyst skin-care estimates range from USD54.23 billion to USD64.23 billion for 2025. The practical Chando lens is narrower than broad beauty TAMs: skincare, dermocosmetics, and digitally mediated mass-premium demand where local brands, AI-enabled targeting, loyalty cohorts, and event-led conversion shape share capture. Macro softness, promotion dependence, and an evolving CSAR-era regulatory stack constrain that opportunity.'
chapterKey: market-analysis
order: 2
sections:
- id: SM-01
  title: Market Boundary and What Chando Is Actually Competing In
  body: >-
    China beauty market sizing only becomes decision-useful once the boundary is declared up front. The broadest lens is beauty and personal care, which Euromonitor treats as the umbrella category covering skin care, colour cosmetics, hair care, fragrance, and adjacent personal-care spend. Chando is not trying to win that full stack in equal measure. Its relevant field is narrower: mass-premium skin care inside China cosmetics, with adjacent opportunity in dermocosmetics, efficacy-led facial care, and the digitally mediated conversion channels that increasingly decide share shifts.


    That distinction matters because public sources mix at least four non-equivalent denominators: skin care category revenue, cosmetics category revenue, broad beauty and personal care value, and all-channel transaction value or GMV. Official retail statistics sit below GMV-style measures because they capture booked retail revenue rather than platform transaction value, presale distortion, or full omnichannel throughput. Using the wrong denominator makes the market look either artificially small or artificially enormous.


    For Chando, the working market boundary should therefore include skin care spending, the premium-versus-mass shift within that category, digital traffic and conversion layers, and a narrower set of trust- and efficacy-led adjacent products. It should exclude unrelated fragrance-only spend, generic personal care categories that do not share the same buyer logic, and any assumption that all beauty GMV is equally contestable by a skin-care-led brand.
