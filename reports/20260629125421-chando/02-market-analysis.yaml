- id: TM004
  title: Growth Drivers and Constraints for China Skin Care and Cosmetics
  columns:
  - Factor
  - Type
  - Timing
  - Evidence
  - Implication for Chando
  - Diligence Ask
  rows:
  - - Dermocosmetics resilience
    - Driver
    - Current
    - Euromonitor says dermocosmetics grew 3.1% in 2024
    - Supports efficacy-led and trust-led positioning
    - What share of Chando sales comes from sensitive-skin or efficacy-led lines?
  - - Premium innovation rebound
    - Driver
    - Current
    - Euromonitor says premium brands regained momentum
    - Creates room for margin-supportive products if science claims are credible
    - Which SKUs sustain premium ASP without overreliance on discounting?
  - - Local-brand resonance
    - Driver
    - Structural
    - Euromonitor and Fortune both note local brands gaining share
    - Domestic storytelling and local relevance remain strategic advantages
    - How durable is Chando’s brand equity versus faster-moving local peers?
  - - AI-enabled targeting and diagnostics
    - Driver
    - Current
    - Daxue and Jing Daily describe AI skin diagnosis and precision targeting
    - Improves ROAS, conversion, and personalization if executed well
    - How much of Chando media and CRM stack is AI-enabled today?
  - - High digital penetration
    - Driver
    - Structural
    - Daxue says cosmetics online transaction share reached 65.36%
    - Channel scale supports rapid campaign amplification
    - What share of Chando GMV is platform-native versus owned-channel?
  - - Festival conversion infrastructure
    - Driver
    - Current
    - Alibaba and JD show high livestream and loyalty conversion during 11.11 and 618
    - Big events remain efficient demand harvest points
    - What is Chando’s gross-margin tradeoff during major festivals?
  - - Macro softness / recession glam
    - Constraint
    - Current
    - Euromonitor says beauty and personal care declined 2.2% in 2024
    - Consumers are selective and may trade down unless value is obvious
    - How elastic is Chando demand by price band?
  - - Promotion dependence
    - Constraint
    - Current
    - ChemLinked shows post-festival demand cliffs and a 26.4% November drop
    - Pull-forward risk complicates forecasting and working capital planning
    - What share of annual sell-through lands in 3.8, 618, and Double 11?
  - - Regulatory burden under CSAR
    - Constraint
    - Structural
    - NMPA still foregrounds filing, labels, and safety governance
    - Compliance capability is a moat but also a cost center
    - How fast can Chando move from concept to registered launch?
  - - Saturation, closures, and layoffs
    - Constraint
    - Current
    - ChemLinked says 2025 featured saturation, closures, and layoffs
    - Category scale does not guarantee easy profit pools
    - Where is Chando still gaining share without subsidy-heavy traffic buying?
  notes: The market is still attractive, but growth quality depends on efficacy, channel control, and compliance execution. This table mixes structural drivers with near-term constraints because both matter for valuation and forecasting.
