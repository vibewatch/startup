  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: chando-sam
    missingEvidence: A disclosed category and channel revenue split for Chando, including the share from skin care versus other beauty categories.
    whyItMatters: Without company-specific mix, public market size can only frame directionally attractive demand and cannot support a precise Chando SAM or SOM.
    diligencePath: Request management-level sell-through by category, channel, and price band for the last three years, plus forecast assumptions for new launches.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: offline-subchannel-mix
    missingEvidence: A credible public breakdown of skincare sales across department stores, specialty beauty chains, pharmacies, supermarkets, and other offline routes.
    whyItMatters: Offline still matters, but public sources only provide the broad offline-versus-online split, which limits channel-priority precision.
    diligencePath: Collect NielsenIQ, Kantar, or retailer-sourced sell-out data, and ask Chando for offline channel sell-through by subchannel and city tier.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: Quantified spend concentration by age cohort, city tier, and regimen complexity inside China skincare.
    whyItMatters: Buyer, user, and payer are usually the same person, but valuation-relevant customer concentration depends on who actually controls the deepest budgets.
    diligencePath: Request customer-cohort analysis from Chando and supplement it with panel or payment-card data by demographic segment.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: minor
    topic: market-size-scope
    missingEvidence: A reconciled bridge between official retail sales, analyst category revenue, and all-channel transaction value for the same year.
    whyItMatters: The public market can still be analyzed, but any valuation model that mixes those denominators without reconciliation will overstate or understate addressable revenue.
    diligencePath: Build a denominator bridge using official retail sales, platform GMV, and audited channel sell-through from major brands or listed peers.
    relatedQuestionRefs:
    - QM004
    - QM020
    relatedTableRefs:
    - TM002
