- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Chando retail scale and familiarity
    - Offline estate becomes a cost drag versus online-first peers
    - high
    - Track whether store productivity offsets platform CAC and offline media cost.
  - - Chando flagship brand equity
    - 95.3% flagship concentration leaves the group exposed to one proposition
    - high
    - Test whether newer brands can become independently material in revenue and repeat purchase.
  - - Chando science story
    - Peers and incumbents publish more segmented science and clinical evidence
    - medium-high
    - Ask for comparable hero-product efficacy proof and brand-level R&D allocation.
  - - Proya multi-brand ladder
    - Still heavily dependent on marketplace traffic and social-commerce economics
    - medium
    - Monitor how much margin survives after Douyin and paid-traffic intensity.
  - - Botanee sensitive-skin authority
    - If mass skincare buyers do not need dermocosmetic trust, growth can cap
    - medium
    - Watch whether Winona keeps converting beyond the efficacy-led niche.
  - - Yatsen portfolio agility
    - Recovery can be overwhelmed by traffic costs and weak profit conversion
    - high
    - Follow Q2–Q4 2026 marketing ratio and loss trajectory, not just top-line growth.
  - - Florasis premium artistry
    - Could stay adjacent if skincare authority remains secondary
    - medium
    - Check whether Florasis meaningfully expands into repeat-use skincare rather than gifting makeup.
  - - Global incumbent prestige ceiling
    - Prestige brands can reset consumer expectations on proof and trust
    - medium-high
    - Benchmark hero-SKU claims, science proof, and premium trade-up conversion in China.
  notes: Severity is scored against Chando’s competitive position, not against each peer’s standalone survival risk.
