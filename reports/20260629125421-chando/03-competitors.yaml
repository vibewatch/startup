- id: SP-channel-pricing-and-switching
  title: Channel structure and price architecture matter more than raw product breadth
  body: 'The cleanest strategic comparison is not feature count but route-to-buyer. Proya’s retained 2025 disclosures show a business that is 95.39% online at the primary-revenue line, with direct sales across Tmall, Douyin, JD, Kwai, and Pinduoduo, while still carrying differentiated brand ladders from RMB50–200 Gen-Z skincare to RMB260–600 professional skincare. Botanee also operates online first, but its OMO and pharmacy channels make the business feel less like a pure marketplace seller and more like a skin-health network. Yatsen’s quarter shows the opposite tension: scale can return quickly in social commerce, but traffic acquisition costs on Douyin can absorb the recovery. Chando has moved online, yet remains structurally more offline-heavy than Proya and more brand-concentrated than either Proya or Botanee. That can support discovery and sampling, but it also raises execution cost and slows assortment rotation. Switching costs are therefore only moderate. Consumers can multi-home
    across Douyin, Tmall, pharmacy, department-store, and prestige routines, so the winner is the brand whose channel design reduces search friction while preserving enough trust to justify repeat purchase.'
