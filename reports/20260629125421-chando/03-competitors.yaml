- id: TP003
  title: Pricing / positioning comparison
  columns:
  - brand / line
  - price or positioning anchor
  - channel anchor
  - included capability / promise
  - unknowns
  - implication
  rows:
  - - Chando flagship skincare
    - Mostly below RMB300 per product in independent retained coverage
    - Large offline estate plus rising online mix
    - Mass-premium hydration, whitening, repair, anti-aging, sensitive-skin, personal care
    - Exact current hero-SKU China pricing was not cleanly retained from official pages
    - Chando competes as affordable scale skincare, not as explicit prestige science.
  - - Proya flagship
    - RMB200–500
    - Online plus offline
    - Technology skincare for young white-collar women
    - No full retained offline door count
    - Closest direct benchmark on mass-premium skincare execution.
  - - TIMAGE
    - RMB150–300
    - Mainly online
    - Professional Chinese-style makeup
    - Makeup economics not isolated here
    - Shows Proya can ladder across categories without leaving premium-adjacent price bands.
  - - HAPSODE
    - RMB50–200
    - Mainly online
    - Gen-Z efficacy skincare
    - Brand still small in mix
    - Competes below Chando’s usual price architecture for younger shoppers.
  - - CORRECTORS
    - RMB260–600
    - Online
    - Laboratory/professional skincare
    - Exact hero-SKU assortment not retained
    - Pushes Proya upward into more specialist pricing territory.
  - - Winona / Botanee
    - Clinical / efficacy-led rather than clearly retained broad price band
    - Online, OMO, OTC pharmacy, KA
    - Sensitive-skin and dermocosmetic trust
    - Retained set did not expose a clean company-wide price ladder
    - Substitute when trust and skin condition outweigh brand storytelling.
  - - Yatsen portfolio
    - Mass color through prestige and clinical skincare
    - Social commerce and online
    - Multi-brand, multi-price architecture
    - Full-year 2025 brand revenue split not retained
    - Keeps Yatsen relevant across multiple price points despite weaker profit quality.
  - - Florasis
    - Premium artistry and gifting rather than retained mass price band
    - Brand site / collection-led online discovery
    - Makeup plus skincare-inspired cultural premiumization
    - Exact collection pricing not retained in accessible text pages
    - Adjacent premium beauty threat rather than direct mass-skincare match.
  - - L’Oréal / Shiseido / Estée
    - Generally above Chando mass-market price points in independent coverage
    - Prestige / department-store / global branded routes
    - Science, prestige, and trust ceiling
    - China-specific normalized SKU pricing not retained
    - Incumbents frame the upper reference point, not the daily mass-price fight.
  notes: This table intentionally mixes exact retained price bands with clearly labeled positioning anchors because official China-wide list prices are highly dynamic across e-commerce, pharmacy, and concession channels.
