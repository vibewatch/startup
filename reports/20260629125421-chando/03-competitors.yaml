- id: SP-moat-durability
  title: Chando’s moat is real but less diversified than the strongest public peers
  body: The evidence supports a real but conditional moat for Chando. The brand still benefits from high consumer awareness, a broad retail footprint, a five-brand group structure, 20 laboratories, 590 patents, and a minority investment from L’Oréal that validates the platform. But the moat is not yet as diversified as the best comparables. Proya’s mix shows lower dependence on the flagship label, faster online merchandising loops, and multiple adjacent profit pools. Botanee combines sensitive-skin authority, more than 400 R&D staff, medical/pharmacy channel trust, and newer growth engines such as Winona Baby and Aoxmed. Yatsen is economically noisier, yet it proves that a challenger can pivot portfolio mix quickly when it finds demand. Meanwhile, Shiseido and L’Oréal continue to spend at a scale that keeps the upper-end science and prestige reference point far above most domestic peers. The most likely displacement risks for Chando are therefore not that the brand disappears, but that dermocosmetics
    capture efficacy-led shoppers, online-first peers keep compressing traffic economics, and Chando’s flagship concentration leaves the group exposed if one core proposition softens.
