chapter:
  number: 3
  title: Competitors
  summary: Chando now competes in a layered Chinese beauty field where Proya is the clearest direct execution benchmark, Botanee/Winona is the strongest dermocosmetics substitute, Yatsen remains a social-commerce challenger despite weaker economics, Florasis plays an adjacent premium-artistry role, and global incumbents such as L’Oréal, Estée Lauder, and Shiseido still define the category’s science and prestige ceiling. Chando’s unusual combination is mass-premium branding plus a very large offline estate, but that same estate and its 95%-plus reliance on the flagship brand make its moat less diversified than the best direct peers. The durable competitive question is therefore not whether Chando is relevant, but whether it can convert science, retail reach, and brand familiarity into a broader, lower-friction system before online-first and dermocosmetic rivals keep widening the gap.
sections:
- id: SP-domestic-peer-ladder
  title: Direct domestic peer ladder now runs through Proya, Botanee, and Yatsen
  body: Chando’s 2026 IPO record makes the domestic ladder much clearer than the brand’s earlier private-company positioning. The filing and Ryanben/Sina summary both place the flagship Chando brand as China’s No. 2 domestic cosmetics brand by 2024 retail sales and the group as the No. 3 domestic cosmetics group, while Bamboo Works shows that the next scale benchmark is Proya rather than a small startup peer. That matters because Proya already pairs similar mass-premium positioning with a broader multi-brand ladder and much heavier online penetration, while Botanee brings a clinically anchored substitute through Winona and Yatsen is trying to rebuild around skincare after years of color-cosmetics leadership. Chando still has meaningful scale—RMB5.318 billion of 2025 revenue, 554 SKU, and 64,800 retail sales points—but its flagship still contributes 95.3% of sales, making it strategically narrower than Proya’s or Botanee’s portfolio structures. The direct set is therefore no longer “other
    C-beauty upstarts”; it is public-company peers that already disclose the channel, brand, and operating trade-offs Chando must now prove it can match.
