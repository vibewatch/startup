- id: TP004
  title: Distribution / substitute map
  columns:
  - buyer need state
  - most likely competitor class
  - proof in retained sources
  - why it can displace Chando
  - constraint / limitation
  rows:
  - - Mass skincare with store trial
    - Chando, Proya, global mass incumbents
    - Chando retail points; Proya online/offline flagship; incumbent category presence
    - Trial plus familiar skincare claims still matter in China beauty
    - Offline-heavy routes are costlier and slower than pure digital loops.
  - - Sensitive-skin flare or efficacy trust
    - Botanee / Winona dermocosmetics
    - 19.4% dermocosmetics share; pharmacy and OMO reach
    - Clinical framing can outrank brand storytelling
    - Less directly centered on Chando-style mass brand narrative.
  - - Douyin-led discovery and trend cosmetics
    - Yatsen, Proya sub-brands, Florasis
    - Yatsen traffic acquisition comments; Proya Douyin ranking; Florasis collections
    - Fast trend capture and creator-led conversion
    - Traffic acquisition costs can erode economics quickly.
  - - Giftable premium Chinese aesthetics
    - Florasis
    - About-us page and best-sellers/collections pages
    - Artistry and culture can capture premium self-gifting baskets
    - Less direct on everyday skincare replacement.
  - - Prestige anti-aging / science ceiling
    - L’Oréal, Shiseido, Estée Lauder
    - L’Oréal scientists; Shiseido prestige and R&D metrics; EL reporting archive
    - Prestige trust and global science remain upper-end reference points
    - Usually above Chando’s everyday mass price position.
  - - Acne / clinic / device-adjacent regimen
    - Botanee adjacencies and TriPollar/Beforteen
    - Botanee filing on acne, institutions, and devices
    - Moves the routine closer to medicalized skin management
    - Not a one-click substitute for mainstream moisturizers and masks.
  notes: 'The substitute map is job-to-be-done oriented rather than brand-only: many Chinese beauty shoppers multi-home across categories, channels, and benefit states instead of picking one permanent winner.'
