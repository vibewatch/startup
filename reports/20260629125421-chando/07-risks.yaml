- id: channel-marketing-and-competition-risks
  title: Channel, marketing, and competition risks
  body: 'Chando’s commercial model has two contradictory features: it is already highly online, but it still carries a large offline inheritance. Online revenue reached 69.5% of 2025 sales, yet the group still operates more than 60,000 outlets and historically around 64,800 retail sales points. That gives it reach, but also adds cost and organizational complexity relative to digital-first rivals. At the same time, the online playbook itself is getting harder. Douyin and similar platforms increasingly reward merchant-led livestream operations rather than pure celebrity bursts, which reduces reliance on superstar endorsers but raises the need for in-house content, paid traffic, logistics, and data discipline. Chando’s own KOL footprint expanded materially between 2023 and 2025, underscoring that traffic remains bought rather than structurally owned. The company also faces tougher domestic competition: Proya and Chicmax have stronger online execution benchmarks, and peers increasingly pair
    growth with either better R&D economics or more diversified brand ecosystems. That mix creates three linked risks for Chando: customer-acquisition costs can stay high, the flagship can tire before the portfolio diversifies, and market share can erode even if revenue still inches upward.'
