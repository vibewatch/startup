  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public litigation record
    missingEvidence: A direct court docket, judgment, or disclosed lawsuit record involving Chando/JALA that can confirm whether litigation risk is de minimis or understated.
    whyItMatters: The chapter can rank governance and regulatory risk, but the absence of an accessible docket leaves legal exposure less precise than investors would prefer.
    diligencePath: Search PRC court and enforcement databases with the latest legal-entity names and obtain counsel confirmation under NDA.
    relatedQuestionRefs:
    - QR010
    relatedTableRefs:
    - TR001
  - type: access-blocked
    severity: material
    topic: consumer complaints
    missingEvidence: A clean, reviewable export of Black Cat, 12315, or other complaint-platform records tied specifically to Chando products or official stores.
    whyItMatters: Media commentary points to reputation and price-complaint risk, but complaint-platform access limits prevent a stronger count-based view of adverse customer signals.
    diligencePath: Pull authenticated complaint-platform screenshots or structured exports from management or a local research partner.
    relatedQuestionRefs:
    - QR014
  - type: private-evidence-only
    severity: material
    topic: supplier and manufacturer concentration
    missingEvidence: Named top suppliers, OEM/ODM exposure, and manufacturing concentration data by facility or raw-material category.
    whyItMatters: Platform and brand risks are visible, but supplier concentration could materially change the operational register if one plant or ingredient source dominates.
    diligencePath: Request supplier concentration, plant redundancy, and recall-response material in diligence.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: channel efficiency economics
    missingEvidence: CAC, contribution margin, repeat-purchase rate, and merchant-led livestream ROI by channel.
    whyItMatters: Public data proves marketing intensity but not whether new in-house livestream operations are structurally improving unit economics.
    diligencePath: Request channel P&Ls and cohort repeat-purchase data for Douyin, Tmall, and offline DTC.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: post-IPO governance commitments
    missingEvidence: A board charter, committee mandate, or listing-roadshow statement on post-IPO independent governance, capital allocation rules, and related-party protections.
    whyItMatters: The current evidence shows control concentration and some governance upgrades, but not yet the safeguards that would actually narrow minority-investor risk.
    diligencePath: Ask for draft governance charters, committee composition, and post-listing KPI-linked incentive design.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR004
    - TR005
