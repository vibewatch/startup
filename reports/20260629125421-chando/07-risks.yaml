- id: regulatory-quality-and-compliance-risks
  title: Regulatory, quality, and compliance risks
  body: 'China’s cosmetics regulatory environment is getting more exacting just as Chando is trying to defend a scale-first narrative. The NMPA’s 2025 reform Opinions explicitly strengthen online-distribution supervision, adverse-reaction monitoring, and e-commerce-platform accountability; they also push electronic labeling and more structured safety assessment. That matters because Chando is both omnichannel and heavily traffic-dependent. Technical requirements are also tightening. The STSC 2015 update adds stricter bacterial and residue thresholds, ingredient bans, and lower concentration caps with 2027 and 2028 deadlines, while April 2026 guidelines sharpen expectations for sunscreen, hair-dye, perming, whitening, and anti-hair-loss claims. Enforcement is not hypothetical: January 2026 summaries collected dozens of non-compliant batches and multiple enterprise inspection findings across national and provincial notices. Chando is not named in the reviewed notices, but a large beauty brand
    with broad online reach and efficacy-led marketing must absorb the full cost of keeping formulas, labels, and claims aligned with a moving rulebook. That makes compliance a recurring operating risk, not a one-time filing task.'
