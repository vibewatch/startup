- id: governance-brand-and-ipo-structure-risks
  title: Governance, brand concentration, and IPO structure risks
  body: 'Chando’s governance story remains a family-enterprise story with public-capital aspirations layered on top. The controlling siblings still hold overwhelming voting power, while the new strategic investors together own only about a tenth of the company. That means minority-investor protection depends less on ownership balance and more on post-listing governance rules that are not yet clearly public. The refiled IPO also carries revision and valuation risk. The first filing lapsed, the second filing arrived only after last-round investors established a roughly RMB 7.14 billion private mark, and public reporting says the CSRC asked questions about share-pricing fairness and multi-layer family-trust arrangements. Operationally, the same section of the story is weakened by flagship dependence: Chando contributes over 95% of revenue, while other brands remain too small to absorb a major reputation or execution shock. Adverse commentary on ESG-report lag, last-minute CFO reinforcement,
    and investor-linked board appointments reinforces the point that governance modernization is still in progress rather than complete.'
  claimRefs:
