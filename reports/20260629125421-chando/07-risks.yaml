callouts:
- calloutType: risk
  title: Control and concentration reinforce each other
  body: Family control would be less threatening if portfolio diversification were stronger, and single-brand dependence would be less threatening if governance were more open. Chando has neither buffer today.
  claimRefs:
  - CR001
  - CR006
  - CR049
- calloutType: insight
  title: Compliance reform rewards science more than pure traffic
  body: The 2025-2026 rulebook moves the market toward documented efficacy, traceability, and post-market monitoring. That directionally favors brands whose R&D and quality systems can outrun their marketing reflexes.
  claimRefs:
