  productSummary: >-
    Chando sells branded cosmetics and skincare through a five-brand portfolio led by CHANDO, with products spanning anti-aging, hydration, repair, sunscreen, barrier care, makeup, personal care, and infant/child skin management.
  customerFocus: >-
    Mass-premium Chinese beauty consumers reached through omnichannel retail and digital commerce, with the core demand centered on adult skincare and adjacent cohorts such as sensitive-skin users, younger oil-control buyers, and parent-led child-skin purchases.
  businessModel: >-
    The group monetizes by selling branded cosmetics through online direct channels, online and offline distributors, retail counters, and broader offline sales points, using heavy marketing and digital traffic acquisition to support flagship-brand conversion.
  stage: Pre-IPO / Hong Kong listing applicant
  fundingStatus: >-
    Chando appears to have taken its first known external financing in 2024-2025, raising about RMB 742.7 million from Meiting/L'Oréal and Himalaya International/Jiahua Capital at an implied post-money valuation of roughly RMB 7.14 billion, with the Hong Kong IPO process still live after an April 2026 refiling.
