  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 消费者分层很宽，但付费逻辑仍是大众高端美妆，而不是企业合同
        blocks:
          - type: paragraph
            body: >-
              Chando 的客户基础最好理解为分层消费者组合，而不是单一、铁板一块的「中国护肤买家」。旗舰 Chando
              品牌仍主导经济性，并定位为拥有广泛成人护肤需求的大众高端本土化妆品品牌；但公开产品集显示出更细的子分层：抗衰买家、敏感肌用户、年轻油皮和痘肌消费者、通过运动和户外活动触达的男性，以及通过 imine 线购买婴幼儿
              / 儿童护理产品的父母。官方英文产品页面通过问题导向的货品陈列，而不是企业客户名单，让这种分层可见；集团资料还用一条已经触达医院和儿童保健中心的专业儿童肌肤线扩展了图景。因此，实际买方 / 用户 /
              付款人模式主要是自费消费者护肤，并由零售商、经销商和平台中介站在集团与最终购物者之间。公开证据支持广泛的人口匹配和品类覆盖，但没有披露按客群拆分的收入、复购率或客户生命周期价值。
