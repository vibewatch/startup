  - id: TV005
    title: 投资逻辑失效与放弃触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - IPO 定价上台阶
        - 交易在新披露前按明显高于约 1.5x 销售额营销
        - 抹掉公开可比区间里仅剩的小幅上行垫。
        - 除非新证据补上差距，否则从跟踪转为回避。
      - - 营销负担维持结构性沉重
        - 没有可信路径把当前高企的促销后投放强度降下来
        - 说明毛利率被回收进流量，而不是沉淀为经济性。
        - 维持或下调建议；不要支付溢价倍数。
      - - 旗舰集中度没有改善
        - 旗舰品牌收入占比仍在 90% 中段附近
        - 维持单一品牌脆弱性，并证明多元化折价合理。
        - 把 Proya / Botanee 倍数视为 Chando 拿不到。
      - - 治理 / 披露滑坡
        - IPO 文件未说明稀释、优先权或募资用途纪律
        - 提高上市股权无法拿到轮次标题暗示经济性的概率。
        - 暂停承销，并要求文件说清楚。
      - - 上市后执行落空
        - 渠道结构或增长转弱，且没有利润率杠杆抵消
        - 打破 Chando 应向更强国内同行重估的逻辑。
        - 将估值重置到熊市区间。
    notes: 触发项设计成可监测且与价格挂钩，而不是风险章节已经覆盖的泛泛业务风险。
    claimRefs:
      - CV003
      - CV005
      - CV037
      - CV042
      - CV045
      - CV051
      - CV052
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - IPO 价格区间和总募资额
        - 正式区间、基石需求，以及新股 / 老股的精确拆分
        - 没有价格，估值立场就只能停留在价格敏感的跟踪状态。
        - 阅读下一版 HKEX 申报文件 / 定价补充文件和承销团营销材料。
      - - 优先权和稀释条款
        - 转换机制、清算优先权经济性，以及 IPO 前轮次中任何类似反稀释调整的保护
        - 如果轮次经济性比标题暗示的更优先，公众股权可能看起来比实际更便宜。
        - 审阅最终招股书股权结构附注和律师摘要。
      - - 单位经济性
        - CAC、复购率、下单频次，以及主要线上渠道的贡献利润率
        - 这些数字决定 Chando 是否值得向 Proya / Botanee 重估，还是继续打折。
        - 要求管理层提供渠道经济性桥表或投资者演示材料。
      - - 多品牌多元化
        - 非旗舰品牌的收入占比和增长画像
        - 集中度下降是少数几条可信的溢价倍数路径之一。
        - 在路演问答中要求披露品牌级收入或终端销售趋势。
      - - 上市后治理承诺
        - 董事会独立性、关联方保护，以及代言人 / 争议控制
        - 需要判断治理压制只是暂时观感，还是结构性问题。
        - 审阅最终招股书治理章节和上市后董事会委员会设置。
    notes: 每一项尽调问题都直接绑定一个会改变建议的变量，而不是泛泛的例行事项。
    claimRefs:
      - CV005
      - CV037
      - CV042
      - CV045
      - CV049
      - CV051
