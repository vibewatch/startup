      - number: '8.4'
        title: 情景分析显示有上行，但没有干净证据前不足以买入
        blocks:
          - type: paragraph
            body: >-
              情景分析很直接，因为当前公开锚已经明确。熊市情景下，美妆 IPO 胃口仍弱，重营销获客没有改善，公开市场投资者只愿给 Chando 约 0.8x 至 1.0x 销售额，对应 2025 年收入基础上约 RMB4.3
              billion 至 RMB5.3 billion 股权价值。基准情景下，Chando 接近上一轮估值上市，并以约 1.3x 至 1.6x 销售额交易，对应约 RMB6.9 billion 至 RMB8.5
              billion。牛市情景下，市场开始相信 Chando 能在数字效率、品牌组合广度和资本市场可信度上缩小与 Proya 或 Botanee 的差距，于是允许约 2.0x 至 2.2x 销售额，对应约
              RMB10.6 billion 至 RMB11.7 billion
              价值。问题不在于牛市情景不可能，而在于从上一轮到牛市区间的上行可观但不压倒，和仍未解决的披露风险相比并不够厚。因此，该股票值得关注，但仅凭当前公开证据，还不是 IC 级买入。
