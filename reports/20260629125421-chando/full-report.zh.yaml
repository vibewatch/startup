      - number: '2.5'
        title: 约束、监管，以及对 Chando 尽调的含义
        blocks:
          - type: paragraph
            body: >-
              市场有吸引力，但并不容易。两项约束最重要。第一，需求质量比头部 GMV 标题暗示的更软。ChemLinked 的 2024 年市场回顾显示，化妆品增长集中在大型节日窗口，促销后又快速下滑，包括 Double 11
              预售已前置后，11 月仍下降 26.4%。2025 年门店关闭、裁员和广泛竞争，进一步说明并非所有名义市场增长都是高质量增长。

              第二，监管栈很深，而且仍在变化。NMPA 英文化妆品门户强调电子标签和备案规则；2025 年 12 月《意见》及解读同时强调更严格的安全治理和持续产业升级；ChemLinked 报道称，2026 年 3
              月又出现一份旨在简化注册和备案的草案。这意味着上市速度不只由品牌创意决定，还受注册能力、成分准备、标签合规和上市后治理塑造。

              对 Chando 而言，这组因素要求预期要克制。公开证据支持护肤市场很大，也支持强大的数字转化基础设施，但无法给出按渠道和品类拆分的干净公开 SAM。下一步尽调应拿到 Chando
              自身的终端销售、品类结构、渠道结构和复购数据，这样才能把公开市场视角转成公司特定的份额获取，而不是宽泛的美妆乐观主义。
