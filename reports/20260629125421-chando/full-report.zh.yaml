            body: >-
              Chando 的产品交付模式依赖的不只是配方科学。官方材料称，每款产品都经过「六感六性」体系和至少 60 项安全及功效评估；申报文件摘录还露出 SAP、ERP、MES、WMS 等运营标记，以及
              ISO9001、ISO22716、GMPC、HACCP、BRC 等认证标签。这足以说明公司在公开层面呈现了一个受质量管理、数字化仪表化的运营栈，但不足以说明这套栈完全透明。同一份招股书摘录也反复提到 OEM 和
              ODM，但本报告审阅的公开记录没有披露逐厂地图，也没有披露自有生产和外包品类之间的拆分。数字技术在商业层面部分补偿了这种不透明。Chando 称，自 2020 年以来已实施 105
