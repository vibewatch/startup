companyProfile:
  summary: >-
    Chando 是一家上海起家的中国化妆品集团，围绕旗舰品牌 CHANDO 搭建，并拥有 MAYSU、Biorrier、Spring Summer、imine
    等较小的副品牌。公开申报文件和公司材料把它定位为一个有规模的多品牌美妆平台，覆盖护肤、彩妆、个人护理和母婴产品，但经济性仍高度集中：2025 年收入达到 RMB 5.318 billion，旗舰品牌仍贡献约 95.3%
    销售额。治理同样集中。创始人郑春影仍任董事长兼首席执行官；即便引入外部资本后，郑氏家族仍通过多层信托和持股架构控制公司。因此，Chando 是一家真实且规模不小的本土美妆公司，也在推进港股
    IPO，但承销判断仍取决于上市时能否充分折价家族控制、营销强度和品牌集中度。
