  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及 Chando 真正在竞争的赛道
        blocks:
          - type: paragraph
            body: >-
              中国美妆市场规模只有先划清边界，才对决策有用。最宽的视角是美妆与个人护理；Euromonitor 把它作为伞状品类，覆盖护肤、彩妆、护发、香氛和相邻个人护理支出。Chando
              并不是要均衡拿下整个栈。它真正相关的场域更窄：位于中国化妆品里的大众高端护肤，旁边还有皮肤学级护肤、功效驱动面部护理，以及越来越决定份额迁移的数字化转化渠道。

              这个区分很重要，因为公开来源混用了至少四个不可等同的分母：护肤品类收入、化妆品品类收入、广义美妆与个人护理价值，以及全渠道交易额或 GMV。官方零售统计低于 GMV
              式口径，因为它记录的是入账零售收入，而不是平台交易额、预售扭曲或完整全渠道吞吐。分母用错，会把市场看得不是人为偏小，就是人为巨大。

              因此，对 Chando
              而言，工作市场边界应包括护肤支出、该品类内高端与大众的迁移、数字流量和转化层，以及一组更窄的信任与功效驱动相邻产品。它应排除无关的纯香氛支出、与护肤购买逻辑不同的泛个人护理品类，也不应假设所有美妆 GMV
              都能被一个护肤主导品牌同等争夺。
