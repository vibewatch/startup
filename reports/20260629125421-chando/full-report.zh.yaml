      - number: '1.2'
        title: 领导层、治理和控制权
        blocks:
          - type: paragraph
            body: >-
              创始人郑春影仍是核心决策者。已审阅的 2026 年报道和招股书相关信息把他列为董事长兼首席执行官；公司创办二十多年后，实质上仍更像一家郑氏家族企业。IPO 前持股披露显示，郑春影与郑春斌、郑春蔚、郑小丹通过多层
              BVI 和家族信托架构控制约 87.82% 投票权。该集中度给了家族极强的战略控制力，但也是质疑性报道和监管问询首先指出的治理问题之一。

              公开报道披露的领导层细节，比许多中国消费品 IPO 候选公司更充分。2026
              年新浪财经对招股书的摘要称，董事会共有九名董事：四名执行董事、两名非执行董事和三名独立董事。具名执行董事包括郑春影、郑春斌、郑春蔚和杜胜林；具名非执行董事包括郑小丹和嘉华资本合规负责人朱雪靖；高管梯队还包括
              CFO 李卓光、副总裁李敏和邹岳。官方企业新闻还把公共事务总经理陈娟玲推到台前，作为集团技术和可持续叙事的外部发言人。

              因此，治理图景有两层。一方面，Chando
              能展示出比许多创始人主导消费品牌更完整的公开管理梯队。另一方面，家族控制集中、信托结构复杂、外部资本进入较晚，都说明任何投资判断都需要进一步追问少数股东保护和独立监督。董事会存在，但公开证据仍指向一家身份与创始家族无法切开的公司。
