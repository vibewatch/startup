      - - 监管 / 质量风险
        - 官方通知点名公司或主要 SKU，涉及抽检、宣称或不良反应
        - 任何已确认、触及旗舰 SKU 的 NMPA 或省级执法事件
        - 暂停承销或重估投资逻辑，直到根因和整改措施清楚
      - - 渠道依赖
        - 线上占比加 Douyin / Tmall ROI 趋势
        - 如果线上依赖仍接近 70%，而商家自运营未能降低 CAC 或改善复购
        - 假设平台权力正在拿走品牌留不住的经济性
      - - IPO / 估值风险
        - 上市进展，以及定价相对上一轮私募估值的水平
        - 如果 IPO 再次失效，或只能以大幅低于 2025 年私募估值的折价通过
        - 把折价解读为市场对治理和利润质量的判断，而不只是时间噪音
    notes: 触发项是外部投资者的观察点，而不是管理层 KPI；每一项都用来判断缓释措施是在落地，还是停留在叙事里。
