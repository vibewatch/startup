  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 影响—可能性矩阵，把 Chando 的家族控制、旗舰店依赖、营销强度、监管收紧和估值重置风险放进投资人最需要关注的格子。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 极高可能性
          values:
            - ''
            - 商户主导直播的运营负担
            - 营销强度 >50% 收入
            - 旗舰品牌集中度 >95%
        - label: 高可能性
          values:
            - 线下网点复杂度
            - 同业份额压力
            - 监管合规负担
            - 家族投票权控制
        - label: 中等可能性
          values:
            - 披露滞后
            - 高端化延伸失手
            - IPO 估值折价
            - 执法事件冲击旗舰 SKU
    approximationNotes: 位置基于公开证据作出分析师判断。矩阵强调可见缓释因素之后仍留下的风险暴露，而非理论上的最大下行。
    claimRefs:
      - CR001
      - CR006
      - CR009
      - CR023
      - CR044
      - CR046
  - id: FR002
    title: 风险传导图
    type: dag
    summary: 因果链展示治理集中、营销依赖和监管收紧如何传导为利润率压力、估值压缩和上市风险。
    data:
      nodes:
        - id: r1
          label: 家族控制
          description: 创始兄妹仍控制约 87.82% 投票权。
        - id: r2
          label: 旗舰集中
          description: Chando 主品牌贡献 95.3% 收入。
        - id: r3
          label: 重营销经济性
          description: 销售和营销仍超过收入一半，研发占比维持在约 2%。
        - id: r4
          label: 监管收紧
          description: NMPA 改革强化线上监管、功效宣称审查和上市后监测。
        - id: r5
          label: 利润率波动
          description: 流量成本上升或合规成本增加时，净利润会随之摆动。
        - id: r6
          label: 估值折价
          description: 投资者给出的倍数或 IPO 定价低于私募估值所隐含水平。
        - id: r7
          label: 上市执行风险
          description: 重新递表、延迟或折价 IPO 会加深外部质疑。
      edges:
        - from: r1
          to: r6
          label: 压低治理溢价
        - from: r2
          to: r5
          label: 放大任何旗舰冲击
        - from: r3
          to: r5
          label: 让利润转化不稳
        - from: r4
          to: r5
          label: 推高合规和整改成本
        - from: r5
          to: r6
          label: 削弱盈利质量
        - from: r6
          to: r7
          label: 增加顺利 IPO 难度
        - from: r2
          to: r6
          label: 限制多元化叙事
    approximationNotes: 图谱只表示方向，不作量化。它抓住了把经营选择与融资结果连接起来的主要公开风险路径。
    claimRefs:
      - CR001
      - CR006
      - CR009
      - CR011
      - CR023
      - CR042
      - CR046
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: 图谱梳理支撑 Chando 当前增长模型的关键内外部依赖，也解释渠道或声誉冲击为何会快速传导。
    data:
      nodes:
        - id: d1
          label: 旗舰品牌
          description: 集团收入重心。
        - id: d2
          label: Douyin / Tmall 流量
          description: 主要线上需求引擎，也是费率制定方。
        - id: d3
          label: KOL 与明星层
          description: 外部声量引擎，同时带来声誉外溢风险。
        - id: d4
          label: 商户主导内容运营
          description: 内部直播、广告和履约能力。
        - id: d5
          label: 线下网点网络
          description: 传统触达和试用阵地，但背着成本包袱。
        - id: d6
          label: 研发与合规系统
          description: 实验室、专利、配方和监管纪律。
        - id: d7
          label: 公开市场买方
          description: 这类投资者会检验治理和盈利质量。
      edges:
        - from: d2
          to: d1
          label: 驱动大部分增量需求
        - from: d3
          to: d1
          label: 放大认知度和反噬
        - from: d4
          to: d2
          label: 守住渠道 ROI 所必需
        - from: d5
          to: d1
          label: 扩大触达但增加复杂度
        - from: d6
          to: d1
          label: 支撑功效和信任
        - from: d6
          to: d7
          label: 帮助论证治理和质量主张
        - from: d1
          to: d7
          label: 单品牌依赖塑造估值
    approximationNotes: 图谱强调公开证据可见的业务依赖；未披露的供应商集中度仍是尽调缺口。
    claimRefs:
      - CR007
      - CR008
      - CR013
      - CR014
      - CR015
      - CR016
      - CR030
      - CR031
      - CR045
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 当前判断来自两股力量的抵消：一边是真实融资轮锚点和真实规模，另一边是集中度、营销强度以及缺失的定价细节。
    data:
      nodes:
        - id: n1
          label: 真实规模
          detail: RMB5.318bn 收入，毛利率 70.6%
        - id: n2
          label: 战略背书
          detail: RMB700m+ 融资轮，L’Oréal 关联资本参与
        - id: n3
          label: 集中风险
          detail: 旗舰品牌收入占比 95.3%
        - id: n4
          label: 重营销模型
          detail: 销售及分销费用率 57.2%
        - id: n5
          label: 已知轮次锚点
          detail: 投后 RMB7.14bn，约 1.34x 销售额
        - id: n6
          label: IPO 细节缺失
          detail: 未公开区间、募资用途桥接或完整单位经济性
        - id: n7
          label: 当前判断：跟踪
          detail: 合理，但只在接近上一轮价格时成立
        - id: n8
          label: 只有拿出证据才上调
          detail: 需要更好披露，或更低入场价格
      edges:
        - from: n1
          to: n5
          label: 支撑锚点
        - from: n2
          to: n5
          label: 验证底部
        - from: n3
          to: n7
          label: 迫使折价
        - from: n4
          to: n7
          label: 限制重估
        - from: n5
          to: n7
          label: 合理但不便宜
        - from: n6
          to: n7
          label: 阻挡买入
        - from: n7
          to: n8
          label: 盯价格 + 证据
    approximationNotes: 流程是分析映射，并非字面操作链；它展示当前证据如何转化为推荐纪律。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV007
      - CV008
      - CV009
      - CV042
      - CV045
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 以披露的 2025 年收入基数为锚，展示不同销售额倍数下 Chando 隐含股权价值（十亿元人民币）。
    data:
      items:
        - label: 0.8x 销售额
          value: 4.25
          detail: 悲观情绪 / 大幅折价
        - label: 1.0x 销售额
          value: 5.32
          detail: 公开市场低端接受度
        - label: 1.34x 销售额
          value: 7.14
          detail: 最新轮次锚点
        - label: 1.6x 销售额
          value: 8.51
          detail: 基准情形上沿
        - label: 2.12x 销售额
          value: 11.28
          detail: Proya 参考倍数
        - label: 2.38x 销售额
          value: 12.66
          detail: Botanee 隐含参考倍数
    approximationNotes: 敏感性分析把简单销售额倍数套用到已披露 2025 年收入上；由于公开可比分析围绕股权价值展开，因此忽略净债务。
