  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 投委会式评分卡说明，Chando 值得跟踪，但还不是高确信度买入。
    data:
      items:
        - label: 规模证明
          value: 7
          detail: 数十亿元人民币收入，IPO 流程仍在推进
        - label: 利润率证明
          value: 7
