      - number: '7.3'
        title: 渠道、营销和竞争风险
        blocks:
          - type: paragraph
            body: >-
              Chando 的商业模式有两个相互矛盾的特征：它已经高度线上化，但仍背着庞大的线下遗产。2025 年线上收入达到销售额的 69.5%，但集团仍运营超过 60,000 个网点，历史上约有 64,800
              个零售销售点。这带来触达，也相对数字优先的竞争者增加了成本和组织复杂度。同时，线上打法本身正在变难。Douyin
              等平台越来越奖励商家自播运营，而不是单纯明星爆发；这会降低对超级代言人的依赖，却提高了对内部内容、付费流量、物流和数据纪律的要求。2023 至 2025 年，Chando 自身 KOL
              足迹大幅扩大，说明流量仍是买来的，而不是结构性自有的。公司还面对更强的国内竞争：Proya 和 Chicmax 的线上执行标杆更强，同行也越来越能把增长同更好的研发经济性或更分散的品牌生态绑定。这个组合给
              Chando 造成三项相连风险：获客成本可能维持高位，旗舰品牌可能在组合多元化前先疲劳，即便收入仍小幅上行，市场份额也可能被侵蚀。
