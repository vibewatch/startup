      - number: '6.4'
        title: 耐久性受限，更多来自单一品牌依赖和获客经济性，而不是具名客户集中
        blocks:
          - type: paragraph
            body: >-
              Chando 客户故事里的主要反向信号，不在单个消费者层面，而在更高一层。按直接账户看，公开客户集中度似乎相对不高——Sina 对申报材料的摘要称，经销商、零售商和个人客户都有意义，2025
              年上半年前五大客户贡献 17.4% 收入，最大客户贡献 6.9%。但这不等于客户基础低风险。更大的集中问题在品牌层面：Chando 主品牌贡献了 2025 年 95.3%
              收入，负面评论反复指出，子品牌还没有形成真正的第二增长曲线。独立评论还提到，2018 至 2023 年护肤份额下滑、线上获客成本上升、平台 / KOL 经济性变重。Tencent
              的负面画像走得更远，认为近期增长仍依赖价格敏感渠道，高端化尚未被证明。结果是，客户章节能看到真实触达和广度，但仍缺少完整证据，证明集团能在可接受获客成本下，把认知和事件驱动流量转成持久、扩张且高质量的需求。
