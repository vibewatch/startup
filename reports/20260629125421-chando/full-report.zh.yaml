            body: >-
              资产负债表在 2025 年显著改善，但还没有强到足以消除融资依赖。Chando 从 2024 年末净流动负债 RMB247.3 million，转为 2025 年末净流动资产 RMB320.7
              million，受益于利润增强和一轮大额 IPO 前融资。报告期末现金也从 2023 年的 RMB575.2 million 升至 2025 年的 RMB948.9 million，经营现金流在疲软的 2024
              年后，于 2025 年反弹至 RMB491.3 million。比率披露指向同一方向：2025 年流动比率恢复至 1.2x，速动比率至 0.9x，申报文件中的债务比率降至
              nil。不过，这一改善并非纯靠内生增长。L'Oréal 支持的美婷和嘉华支持的 Himalaya 以约 RMB7.14 billion 估值提供 RMB742 million 的 IPO
              前资本。该轮融资实质性降低了流动性风险，但也说明，IPO 故事是在外部资本补血后呈现，而不是建立在充裕内生现金生成之上。
