      - number: '7.2'
        title: 治理、品牌集中和 IPO 结构风险
        blocks:
          - type: paragraph
            body: >-
              Chando
              的治理故事，本质上仍是家族企业叠加公开资本诉求。控股兄妹仍握有压倒性投票权，新战略投资者合计只拥有约一成股权。也就是说，少数股东保护不太取决于股权制衡，而更取决于上市后治理规则；这些规则目前还没有清楚公开。重新递交的
              IPO 也带来修订和估值风险。第一次申报失效后，第二次申报才出现；此前最后一轮投资者确立了约 RMB 7.14 billion 的私募估值。公开报道称，CSRC
              曾询问股份定价公平性和多层家族信托安排。从经营角度看，同一段故事又被旗舰依赖削弱：Chando 贡献超过 95% 收入，其他品牌太小，无法吸收重大声誉或执行冲击。围绕 ESG 报告滞后、临门补强
              CFO、投资者关联董事任命的负面评论，也强化了同一点：治理现代化仍在进行，并未完成。
