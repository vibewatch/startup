      - number: '8.5'
        title: 能改变判断的主要是尽调，而不是讲故事
        blocks:
          - type: paragraph
            body: >-
              剩余门槛很具体。第一，投资者仍需要实际 IPO 价格区间和募资用途计划；没有这些，建议不能升到 Track
              以上，因为交易可能要求一个抹掉全部风险调整后上行的估值上跳。第二，投资者需要促销后的单位经济性：CAC、复购行为、贡献利润率，以及从线上占比增长到真实现金生成的桥。第三，需要更清楚披露 IPO
              前融资的稀释、优先权，以及任何与上市挂钩的转换条款。最后，需要证据证明旗舰品牌集中度会缓解，而不是固化。若 Chando
              在这些缺口仍存在时要求溢价倍数，论文就会破；若上市后证据显示线上增长仍需要结构性高流量购买，论文也会破。只有价格保持在本轮附近或以下，且新披露显示公司能把毛利率和品牌触达转成更可复用、摩擦更低的增长模型，论文才会上调。
