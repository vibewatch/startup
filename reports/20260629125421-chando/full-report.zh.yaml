  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public or quasi-public beauty references retained for the 2026 valuation pass:
        Chando, Proya, Botanee, Yatsen, plus Florasis as a private adjacency with no supportable public multiple.
    columns:
      - 可比对象
      - 当前参考
      - 收入基数
      - 倍数 / 估值状态
      - 相关性
      - 局限
    rows:
      - - Chando
        - IPO 前轮次投后估值 RMB7.14bn
        - 2025 年收入 RMB5.318bn
        - 估计约 1.34x 销售额
        - 入场纪律的直接锚点。
        - 尚无公开 IPO 价格区间；优先权和募资细节仍不完整。
      - - Proya
        - 2026-06-29 市值 RMB22.45bn
        - 收入 RMB10.54bn（ttm）
        - Yahoo Finance 显示 2.12x 销售额
        - 规模更大、利润率和披露更好的国内上市执行标杆。
        - 倍数已反映公开市场波动和 52 周低点报价。
      - - Botanee
        - 2026-06-29 市值 RMB12.78bn
        - 2025 年收入 RMB5.359bn
        - 估计约 2.38x 销售额
        - 有用的高端护肤 / 功效护肤可比对象，专业化更强。
        - 与 Proya 相比可比性较弱，因为其临床定位比 Chando 的大众高端模式更专业。
      - - Yatsen
        - 2026 年 6 月下旬市值区间 US$300m
        - Yahoo Finance 显示 0.45x 销售额；Yahoo 数据显示收入 4.49B（ttm）
        - 折价上市可比 / 下行底
        - 说明当营销强度和融资需求维持高位时，美妆倍数会被压得多狠。
        - ADR 架构和组合结构与 Chando 的国内线下根基差异很大。
      - - Florasis
        - 相邻的未上市高端国货美妆品牌
        - 未保留公开收入数字
        - 未保留可支撑的公开倍数
        - 对定位和高端国货美妆相邻性有用。
        - 不能作为直接收入倍数锚点，因为保留证据中估值和收入仍是私有信息。
    notes: 可比行混合了直接引用的公开倍数，以及在市值和收入都被保留时推算出的简单倍数。Florasis 只保留为定性相邻对象。
