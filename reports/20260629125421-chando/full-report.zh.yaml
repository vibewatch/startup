      - number: '1.4'
        title: 里程碑、创新叙事和负面信号
        blocks:
          - type: paragraph
            body: >-
              Chando 的公开时间线把长期本土品牌建设，与近年将自身塑造成科学驱动、具全球可信度美妆平台的努力放在一起。公司页面披露的最重要技术里程碑包括：2013
              年与中国科学院开展太空育种合作；经过约十年自主发酵研究后推出 HiMurchaSin；2020 年启动数字化转型项目，官方材料称最终部署 105 个系统；以及在 2026 CBE
              中国美容博览会上，五个品牌同台展示，并围绕疲劳诱导衰老、色素管理和太空护肤提出新主张。这给后续章节提供了一条相对连贯的产品、渠道和品牌建设时间线。

              可持续和社会许可叙事也已经发展到值得纳入分析。官方 2026 年材料称，公司于 2024 年启动 2030 可持续发展战略，并把 ESG 信息与喜马拉雅生态、绿色包装和循环利用绑定。公司称，2016
              年以来与中国环境保护基金会合作，到 2025 年累计捐赠 RMB 29.2 million，在西藏种植 6.66 million 平方米青稞草，并将该项目升级为 2025-2030
              年生物多样性项目。这些是有用的尽调输入，因为它们显示管理层正试图把集团叙事从化妆品和渠道，扩展到生态守护和品牌使命。

              但负面记录不能忽视。2026 年公开批评报道反复回到四个问题：IPO 递表失效、对单一品牌高度依赖、营销强度相对研发异常偏高，以及 CSRC 对家族信托和 IPO 前投资者定价的问询。即使国内产品网站也载有
              NMPA 警示，提醒化妆品不能宣称医疗效果；这说明该品类里以功效为核心的信息表达受到严格边界约束。总体结论不是 Chando 缺少里程碑——它有很多——而是下一阶段可信度取决于科学和治理故事能否追上品牌规模。
