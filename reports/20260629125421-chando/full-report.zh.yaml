  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 支撑依据
      - 哪些情况会改变判断
    rows:
      - - 规模真实
        - 2025 年收入 RMB5.318bn，毛利率 70.6%，2026 年香港 IPO 流程仍在推进，并获得来自 L’Oréal 关联方和 Jiahua/Himalaya 关联方的外部资本。
        - 如果 IPO 募资或上市后更新显示收入质量弱于申报文件暗示，这一论点会削弱。
      - - 融资风险低于典型未上市美妆发行人
        - 超过 RMB700m 外部资本已经进入股权结构，公司也有正在推进的上市路径。
        - 如果优先权或转换条款对新公众股东高度稀释，这一论点会削弱。
      - - 品牌集中应当折价
        - 2025 年销售额仍有 95.3% 来自旗舰 Chando 品牌。
        - 如果第二品牌开始显著增厚业绩，或上市后集中度下降，判断会改善。
      - - 营销强度限制短期估值倍数上行
        - 销售及分销费用占 2025 年收入的 57.2%，负面评论仍把 Chando 描述为更偏线下、依赖流量的模式。
        - 如果管理层披露 CAC、复购、贡献利润率，并证明经营杠杆改善，判断会改善。
      - - 上市可比公司支持中档倍数
        - Chando 1.34x 的轮次倍数高于 Yatsen，但低于 Proya 和 Botanee。
        - 如果 IPO 在缺少相称披露或执行证明的情况下按 Proya / Botanee 类水平营销，判断会恶化。
      - - 治理和 IPO 观感仍是现实压制
        - 负面报道在 IPO 周期中强调家族控制、研发相对营销的质疑，以及代言人争议。
        - 如果治理承诺、募资用途纪律和披露质量在上市时增强，判断会改善。
    notes: 各行概括承销争论，而不是重复每一章主张；每一行都把多条保留来源压缩成一个决策视角。
