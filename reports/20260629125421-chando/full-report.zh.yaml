  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 线上效率改善，集中度下降，投资者开始把 Chando 看作更接近 Proya / Botanee、而非较弱社交电商同行的规模化国产美妆平台。
        - 按 2025 年收入给 2.0x-2.2x 销售额，意味着约 RMB10.6bn-RMB11.7bn 股权价值。
        - 需要披露 CAC、复购、多品牌牵引，并且不能出现溢价估值意外。
        - 有可能，但公开证据还不足以把它作为中心情形承销。
      - - 基准
        - IPO 定价贴近上一轮，增长守住，公众投资者认可规模，但仍对集中度和披露缺口打折。
        - 1.3x-1.6x 销售额意味着约 RMB6.9bn-RMB8.5bn，大致覆盖 RMB7.14bn 轮次估值。
        - 如果交易已经相对本轮估值要求溢价，上行空间有限。
        - 以现有证据看，这是最能支撑的情景。
      - - 熊市
        - 美妆 IPO 偏好转弱，获客经济性仍然沉重，公众投资者把 Chando 定价为更低信任度或更低多元化的同行。
        - 0.8x-1.0x 销售额意味着约 RMB4.3bn-RMB5.3bn 股权价值。
        - 提价发行、上市后更新偏弱，或治理压制都会推动这一结果。
        - 如果上市定价相对披露质量偏贵，下行非常现实。
    notes: 情景估值在已披露的 2025 年销售基数上使用简单收入倍数纪律，而不是假装精确的 DCF，因为公开输入仍缺少多个经营驱动因素。
    claimRefs:
      - CV009
      - CV039
      - CV040
      - CV041
      - CV042
