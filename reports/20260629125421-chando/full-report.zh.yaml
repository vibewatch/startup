        title: 复购代理指标、品牌认知和定价可见；真实留存大多仍未披露
        blocks:
          - type: paragraph
            body: >-
              公开复购证据存在，但不均衡，也常常是间接信号。与 Chando IPO
              相关的报道称，在受访大众国产美妆品牌中，该品牌在消费者认知、购买频次和复购意愿上排名第一；即便本次抓取材料未完整披露调查工具，这一方向仍有意义。官方品牌页还给出更多本地化复购信号：Spring Summer
              称其防晒产品销量超过 410,000 件且复购率较高；美国 DTC 网站则以大幅但自洽的折扣销售四件畅销套装。产品页也透露了品牌想匹配的人群。Chando
              明确瞄准成年女性的抗老和修护需求，同时提供敏感肌、控油和祛痘线；被引用的功效面板集中在约 20 至 54 岁女性人群。可直接抓取的海外平台上，评论情绪不算强但真实存在：运行日看到的两个 Amazon 页面均为
