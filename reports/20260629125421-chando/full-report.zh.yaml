chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品平台和公开网站足迹
        blocks:
          - type: paragraph
            body: >-
              Chando 的港股上市主体是 CHANDO GLOBAL HOLDING LIMITED，而它向市场讲述的经营故事，是一家上海起家的多品牌化妆品集团，核心围绕旗舰品牌
              CHANDO。已审阅的公开材料一致把公司描述为一家战略性多品牌企业，拥有五个主要品牌——CHANDO、MAYSU、Biorrier / 珀芙研、SPRING SUMMER / 春夏、imine /
              己出——覆盖护肤、彩妆、个人护理和母婴品类。截至 2025 年 12 月 31 日，集团披露有 554 个 SKU，宽度足以支撑组合叙事；不过财务披露显示，主品牌仍主导经济性。

              公开网站足迹不止一个域名。当前最连贯的企业页面是 chandogroup.com 和
              en.chandogroup.com，集团在这些页面上把自己描述为一家科技驱动的化妆品公司，并发布创新和可持续叙事。面向产品的网站还包括 chando-himalaya.com 和
              chando-himalaya.us，进一步强化品牌的喜马拉雅定位。相比之下，运行上下文中提供的网站 chando.com.cn 目前指向一个标注为「香度」的独立页面，因此后续章节应把
              chandogroup.com 和招股书作为发行人层面事实的更干净身份锚点。

              在技术定位上，公司讲的不只是营销故事。其英文创新页面称，截至 2026 年 5 月，研发中心拥有 20 个实验室、590 件专利申请，其中 275 件已获授权，参与 49 项标准，并发表 220
              多篇科学和技术文章，其中包括 92 篇国际出版物。同一组材料还描述了三大科学体系——皮肤科学、原料科学和产品科学——以及覆盖原料、配方、包装和评价的四大技术平台。对一家本土美妆公司而言，这给了 Chando
              一套可触摸的科学栈；不过公开财务报道仍显示，其成本结构更偏营销，而不是研发。
