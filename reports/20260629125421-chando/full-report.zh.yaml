      - number: '5.4'
        title: 产品故事最强在哪里，以及哪里仍过于宣传化
        blocks:
          - type: paragraph
            body: >-
              公开记录支持 Chando 拥有真实的产品与技术平台，但也显示尽调应把力气用在哪里。第一，公司的外部科学叙事跑在独立证据前面：第三方和行业报道反复指出，研发支出仅约为收入 2%；Bamboo Works
              也明确认为，年轻消费者现在想要产品真的有效的证明。第二，宣称治理值得审视。跨境店铺使用 acne treatment 等更强表述，而国内网站突出 NMPA
              关于化妆品不能宣称医疗效果的警示；这种错配不能证明不合规，但确实提出清晰的佐证问题。第三，Chando 的公开品牌和文化页面——从 Snow Mountain Guardians IP 到 Future
              Beauty City，再到 Glacier Oil-Control 越野赛项目——显示出成熟的场景营销和体验式零售设计，但它们不能替代供应商透明度、研究级临床证据，或逐专利防御力地图。结论是，Chando
              的可见架构足以值得严肃尽调，但外部证据还不足以让投资者按表面接受科学故事。
