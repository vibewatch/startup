            - label: 中
              tone: warning
              detail: IMCAS 提及提供帮助，但证据包仍不完整。
            - label: 低
              tone: warning
              detail: 白皮书主张未被独立重构。
            - label: 低
              tone: warning
              detail: 临床主张深度未公开。
            - label: 中
              tone: warning
              detail: 36Kr 佐证了转型，但 KPI 深度有限。
        - label: 合规清晰度
          values:
            - label: 中
              tone: warning
              detail: 国内网站警示清楚；跨境措辞让图景复杂化。
            - label: 中
              tone: warning
              detail: 太空主张可见，但公开挑战测试不充分。
            - label: 中
              tone: warning
              detail: 活性成分和光老化主张具体，需要严格的背书纪律。
            - label: 中
              tone: warning
              detail: 屏障和诊所邻近语言需要谨慎的主张治理。
            - label: 低
              tone: warning
              detail: 婴幼儿 / 皮炎邻近主张敏感度最高。
            - label: 中
              tone: warning
              detail: 系统控制公开；运行有效性未在此处接受外部审计。
    approximationNotes: 评级只概括已审阅的公开记录。它们不是投资评分，应按证据成熟度而非产品质量来读。
    claimRefs:
      - CE012
      - CE025
      - CE028
      - CE033
      - CE034
      - CE044
      - CE049
      - CE050
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 典型消费者路径从品牌发现走向 DTC 购买、私域留存，并可能延伸到海外扩张。
    approximationNotes: 阶段来自官方数字运营页面、活动页面和已审阅的市场页面推断。它们说明可见动作，不代表实测的全公司转化。
    data:
      nodes:
        - id: awareness
          label: 品牌认知
          detail: 大众本土品牌定位、文化 / IP 活动、KOL 和体验式活动制造第一次触达需求。
        - id: sampling
          label: 试用或社会证明
          detail: 购买前，消费者会接触产品试用、活动展台、创作者内容或电商评价页。
        - id: purchase
          label: 结账场景
          detail: 购买发生在旗舰 DTC 页面、市场平台、线下柜台或海外门店。
        - id: membership
          label: 私域留存
          detail: 云店会员绑定、积分、BA 积分和直播联动门店运营，目标是把客户留在网络内。
        - id: repeat
          label: 复购或习惯养成
          detail: 明星 SKU、畅销页面和按品类设计的护理方案，旨在把试用转为日常使用。
        - id: expansion
          label: 跨境或高端加购
          detail: 满意客户可以进入海外渠道、更完整护理方案或更高价抗老线；公开转化证据仍有限。
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU008
      - CU017
      - CU028
      - CU046
  - id: FU002
    title: 从认知触点到耐久证据的采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开证据在漏斗顶部很宽，但问题转向复购经济性和渠道回本时迅速变窄。
    approximationNotes: 数值按证据加权，不是运营指标。100 代表留存来源集中可观察到的最宽认知层；更低阶段反映逐步收紧的证明标准。
    data:
      items:
        - label: 品牌认知 / 社群触达
          value: 100
        - label: 具名转化场景（JD、Amazon、Lazada、越南门店）
          value: 78
        - label: 可见定价和产品匹配披露
          value: 64
        - label: 公开评价或满意度信号
          value: 38
        - label: 已披露复购、队列或留存经济性
          value: 8
    claimRefs:
      - CU006
      - CU007
      - CU009
      - CU015
      - CU028
      - CU034
      - CU036
      - CU038
  - id: FU003
    title: 客户证据质量矩阵
    type: matrix
    layout: wide
    summary: 触达、产品匹配和海外渠道可见度的证据最强；留存和高端售罄证明最弱。
    approximationNotes: 评级来自留存来源集的定性判断，而不是公司评分卡。
    data:
