  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接本土同业梯队现在绕不开 Proya、Botanee 和 Yatsen
        blocks:
          - type: paragraph
            body: >-
              Chando 的 2026 年 IPO 记录，让本土梯队比品牌早年的私营公司定位清晰得多。申报文件和 Ryanben / 新浪摘要都把旗舰 Chando 品牌列为按 2024 年零售额计的中国本土化妆品品牌第 2
              名，把集团列为本土化妆品集团第 3 名；Bamboo Works 显示，下一个规模基准是 Proya，而不是小型初创同业。这很重要，因为 Proya
              已经在相近的大众高端定位上，配出更宽的多品牌阶梯和更高的线上渗透；Botanee 则通过 Winona 提供一个以临床为锚的替代品；Yatsen 在多年彩妆领先后，正试图围绕护肤重建。Chando
              仍有实质规模——2025 年收入 RMB5.318 billion、554 个 SKU、64,800 个零售销售点——但旗舰品牌仍贡献 95.3% 销售额，使其战略宽度窄于 Proya 或 Botanee
              的组合结构。因此，直接竞争集不再是「其他国货美妆新锐」，而是已经披露渠道、品牌和经营权衡的上市公司同业；Chando 现在必须证明自己能匹配它们。
