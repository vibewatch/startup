        - label: 估值支撑
          value: 6
          detail: 1.34x 轮次倍数落在可比区间内
        - label: 证据完整性
          value: 4
          detail: IPO 区间、募资用途和单位经济性仍不完整
        - label: 当前推荐强度
          value: 5
          detail: 跟踪，而非买入或回避
    approximationNotes: 分数是有留存证据支撑的分析判断，供委员会讨论使用，不是机械因子输出。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
