      - number: '4.5'
        title: 承销阻碍和披露缺口
        blocks:
          - type: paragraph
            body: >-
              申报文件足以描述 Chando 的趋势线，但还不足以让人有把握地承销业务。它仍是一份申请证明，因此确切 IPO 募资额和部分上市相关披露被删节或可能变化。更重要的是，公开材料没有给出按 SKU 或渠道拆分的实际
              ASP、渠道折扣阶梯、获客成本、回本期、复购率、经销商返利、库存库龄、坏账细节，或客户集中度视角。这些遗漏尤其关键，因为 Chando
              报告毛利率很高，而销售和营销强度也极高；如果没有促销后的单元经济，投资者无法判断公司是在用可接受回报买增长，还是只是把毛利润循环投入流量和明星曝光。财务结论因此是混合的：规模真实、毛利率强、流动性改善，但承销仍被收入质量不透明和结构性重营销模式卡住。
