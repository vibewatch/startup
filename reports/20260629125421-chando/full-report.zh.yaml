              Chando 仍是一个直接的品牌消费品故事：它销售大众市场化妆品，单品大多低于 RMB300，并由旗舰 Chando 品牌压倒性主导五品牌组合。申报文件披露，2023 年收入 RMB4.44
              billion、2024 年 RMB4.60 billion、2025 年 RMB5.32 billion，意味着 2024 年增长温和，随后 2025 年反弹更明显。毛利率逐年提升，2025 年达到
