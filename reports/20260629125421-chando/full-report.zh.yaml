      - number: '2.2'
        title: 规模口径：大市场、真实矛盾，以及更窄的 Chando 切片
        blocks:
          - type: paragraph
            body: >-
              公开市场规模指向同一个方向性结论——中国护肤市场很大，且预期仍会扩张——但它们对当前规模和长期斜率的判断差异很大。Fortune Business Insights 估算中国护肤市场 2024 年为 USD
              59.08 billion，2025 年为 USD 64.23 billion，到 2032 年复合增长率为 10.43%。IMARC 给出的 2025 年基数更低，为 USD 54.23 billion，到
              2034 年 CAGR 也更慢，为 7.72%。Fortune 的中国化妆品市场数字又更小，2024 年为 USD 38.90 billion，因为它排除了更宽的美妆与个人护理边界。

              在宏观层面，Euromonitor 称中国美妆与个人护理 2024 年按不变价值计算下降 2.2%，至 USD 75 billion；ChemLinked 引用的 NBS 相关零售统计显示，化妆品零售额为
              435.7 billion yuan，同比下降 1.1%。NMPA 自身 2025 年解读又加入更宽口径，称 2024 年交易额超过 1 trillion
              yuan。这些数字不应被平均。若把它们当成一个数字，会相互矛盾；若分别保留，它们分别回答品类收入、官方零售入账和全渠道交易流三个问题。

              实务含义是，Chando 应锚定护肤专属区间，把更宽数字仅用作渠道规模和行业相关性的背景。更现实的公开 SAM 表述，是中国护肤切片，加上相邻皮肤学级护肤和由数字渠道中介的大众高端需求，而不是整个万亿元美妆经济。
