      - number: '8.3'
        title: 可比分析把 Chando 放在 Yatsen 折价和 Proya / Botanee 溢价区间之间
        blocks:
          - type: paragraph
            body: >-
              可比组给出了可用但不应机械套用的估值区间。Proya 是最强的直接上市标杆，因为它结合了国内美妆定位、更大规模和公开市场披露。Yahoo Finance 和 Google Finance 在 2026
              年运行日显示，Proya 市值约 RMB22.45 billion，销售额倍数约 2.12x，往绩收入约 RMB10.54 billion，经营利润率在十几个百分点中段。Botanee
              是最相关的高端护肤替代标的：Google Finance 显示其市值约 RMB12.78 billion，对应 2025 年收入 RMB5.359 billion，意味着约 2.38x 销售额。Yatsen
              是下行情境的公开标尺：Google 和 Yahoo 给出的市值接近 US$300 million，Yahoo 列示销售额倍数仅 0.45x；其 2026 年一季度公告显示护肤增长，但销售及营销强度也达到
              72.2%，并有新外部融资。因此，Chando 本轮 1.34x 倍数位于区间中部：高于 Yatsen，因为 Chando 有更好的规模和利润率证明；低于 Proya 和
              Botanee，因为它仍背负更重集中度和更弱披露效率。这个相对位置说得通。说不通的是，在 Chando 证明自己配得上之前，支付 Proya 式或 Botanee 式倍数。
