  - id: TI006
    title: 公开财务缺口
    columns:
      - 缺失指标
      - 影响
      - 重要性
      - 精确尽调路径
    rows:
      - - 按 SKU 和渠道划分的实际 ASP
        - 无法判断毛利率扩张来自价格、组合还是促销时点
        - 低于 RMB300 的标价无法解释实际净收入质量
        - 要求提供前 20 个 SKU 按渠道划分的 SKU 级 ASP、折扣和退货数据
      - - CAC、回本周期、留存和复购率
        - 无法直接判断 DTC 效率或营销 ROI
        - 57% 的销售及营销比率只有在回本和留存强劲时才说得通
        - 要求提供按平台划分的月度 cohort 表、渠道 CAC，以及按活动划分的回本周期
      - - 经销商返利、应收账款账龄和退货权
        - 线下收入质量解释不足
        - 经销商经济性可能美化收入，同时隐藏渠道压货或返利依赖
        - 要求提供账龄应收账款、返利瀑布，以及 sell-in 与 sell-through 数据
      - - 按品牌 / SKU 拆分的库存账龄与滞销
        - 很难判断单一品牌集中度是否埋下隐藏降价风险
        - 美妆业务可能账面毛利率很高，却同时堆出陈旧库存
        - 要求提供账龄分桶、减值政策，以及促销后的库存消化情况
      - - 客户集中度与头部平台敞口
        - 无法判断少数渠道是否主导转化风险
        - 过度依赖 JD / 直播 / KOL，可能把议价权集中到公司外部
        - 要求提供前 10 大平台 / 客户贡献及合同条款
      - - IPO 募资用途精确拆分与 IPO 后资本开支计划
