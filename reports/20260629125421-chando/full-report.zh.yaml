  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              风险栈不是分散的，而是集中叠加的。最上层是治理集中：即便引入 L’Oréal 和 Jiahua 背景资本后，Zheng 家族仍控制约 87.82%
              投票权，外部资金验证了故事，却没有实质改变控制权。第二个论文级风险是对 Chando 旗舰品牌的依赖，该品牌仍贡献 95.3% 收入。第三个风险是商业模式本身：2023 年销售和营销吃掉收入的
              54.2%，2024 年为 59.0%，2025 年为 57.2%，而公开报道仍把研发放在接近收入 2%
              的位置。这三项风险互相强化——高营销投入托举单一品牌，而市场监管正在收紧，国内同行也在证明自己更加多元、更偏科学驱动。结果是，公司仍可增长，但一旦关键支柱断裂，下行会很突然。FR001
              的热力图把治理集中、品牌集中和营销依赖放在最高风险格子，因为每一项都能快速传导到利润率、估值和上市结果。
