  - id: TM004
    title: 中国护肤与化妆品增长驱动因素及约束
    columns:
      - 因素
      - 类型
      - 时点
      - 证据
      - 对 Chando 的影响
      - 尽调追问
    rows:
      - - 功效护肤韧性
        - 驱动因素
        - 当前
        - Euromonitor 称功效护肤 2024 年增长 3.1%
        - 支撑以功效和信任为核心的定位
        - Chando 销售中有多少来自敏感肌或功效导向产品线？
      - - 高端创新反弹
        - 驱动因素
        - 当前
        - Euromonitor 称高端品牌重新获得动能
        - 如果科学宣称可信，就给支撑利润率的产品留下空间
        - 哪些 SKU 能在不过度依赖折扣的情况下维持高端 ASP？
      - - 本土品牌共鸣
        - 驱动因素
        - 结构性
        - Euromonitor 和 Fortune 均指出本土品牌份额提升
        - 国产叙事和本土相关性仍是战略优势
        - 与动作更快的本土同行相比，Chando 的品牌资产有多耐久？
      - - AI 驱动的定向投放和诊断
        - 驱动因素
        - 当前
        - Daxue 和 Jing Daily 描述了 AI 皮肤诊断和精准定向
        - 如果执行到位，可提升 ROAS、转化率和个性化
        - Chando 目前有多少媒体投放和 CRM 栈已启用 AI？
      - - 高数字化渗透
        - 驱动因素
        - 结构性
        - Daxue 称化妆品线上交易份额达到 65.36%
        - 渠道规模支撑营销活动快速放大
        - Chando GMV 中平台原生渠道与自有渠道各占多少？
      - - 大促转化基础设施
        - 驱动因素
        - 当前
        - Alibaba 和 JD 显示 11.11 与 618 期间直播和会员转化率较高
        - 大型活动仍是高效收割需求的节点
        - Chando 在主要大促中的毛利率取舍是什么？
      - - 宏观疲软 / 衰退口红效应
        - 约束
        - 当前
        - Euromonitor 称美妆与个护 2024 年下降 2.2%
        - 消费者更挑剔；除非价值足够明确，否则可能转向低价
        - Chando 需求按价格带看有多大弹性？
      - - 促销依赖
        - 约束
        - 当前
        - ChemLinked 显示大促后需求断崖，11 月下滑 26.4%
        - 需求前置风险让预测和营运资本规划更复杂
        - 年度 sell-through 中有多少落在 3.8、618 和双 11？
      - - CSAR 下的监管负担
        - 约束
        - 结构性
        - NMPA 仍强调备案、标签和安全治理
        - 合规能力是护城河，也是成本中心
        - Chando 从概念到注册上市能走多快？
      - - 饱和、闭店和裁员
        - 约束
        - 当前
        - ChemLinked 称 2025 年出现饱和、闭店和裁员
        - 品类规模并不保证利润池容易吃到
        - Chando 在哪里仍能不靠高补贴流量采购获得份额？
    notes: 市场仍有吸引力，但增长质量取决于功效、渠道控制和合规执行。本表同时放入结构性驱动因素和短期约束，因为两者都会影响估值和预测。
