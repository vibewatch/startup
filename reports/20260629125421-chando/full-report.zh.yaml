      - number: '3.3'
        title: 渠道结构和价格架构比单纯产品宽度更重要
        blocks:
          - type: paragraph
            body: >-
              最干净的战略比较不是功能数量，而是触达买方的路径。Proya 保留的 2025 年披露显示，其主营收入线上占比达 95.39%，并通过 Tmall、Douyin、JD、Kwai 和 Pinduoduo
              做直营；同时，它还保留从 RMB50–200 Gen-Z 护肤到 RMB260–600 专业护肤的差异化品牌阶梯。Botanee 也以线上为先，但 OMO
              和药房渠道让业务更像一个皮肤健康网络，而不只是纯平台卖家。Yatsen 的季度表现显示另一种张力：社交电商能快速带回规模，但 Douyin 的流量获取成本也会吞掉复苏。Chando 已转向线上，却在结构上仍比
              Proya 更偏线下，也比 Proya 或 Botanee 更集中于单一品牌。这能支持发现和试用，但也抬高执行成本，并拖慢货盘轮转。转换成本因此只有中等。消费者可以在
              Douyin、Tmall、药房、百货和高端护肤流程之间多栖，赢家是渠道设计能降低搜索摩擦、同时保住足够信任以支撑复购的品牌。
