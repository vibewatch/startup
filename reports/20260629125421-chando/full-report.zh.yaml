      - number: '1.3'
        title: 融资、经营画像和 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              Chando 的资本故事在 2024-2025 年明显转向。多个来源把 L'Oréal 和嘉华资本交易描述为公司创办以来已知的首轮外部融资。招股书相关报道显示，L'Oréal 全资载体美婷以约 RMB 409.2
              million 认购 7,026,459 股，之后又以约 RMB 33.45 million 购买 531,023 股，使 L'Oréal 总投资额达到约 RMB 442.7 million。嘉华资本支持的
              Himalaya International 以 RMB 300 million 认购 4,761,905 股。两笔交易合计超过 RMB 700 million，隐含投后估值约 RMB 7.14
              billion，足以让 Chando 在上市前被称作本土美妆独角兽。

              经营体量已经成型，但增长质量仍有争议。招股书相关报道给出的收入为：2023 年 RMB 4.442 billion、2024 年 RMB 4.601 billion、2025 年 RMB 5.318
              billion；对应净利润分别为 RMB 302 million、RMB 190 million 和 RMB 351 million。2025 年毛利率达到 70.6%，但 2023-2025
              年销售和营销费用分别吃掉收入的 54.2%、59.0% 和 57.2%，研发则徘徊在收入约 2% 附近。同期线上销售占比从 61.9% 升至 69.5%，但旗舰 CHANDO 品牌仍贡献 2025 年收入的
              95.3%，线下零售点仍多达 64,800 个。

              IPO 路径同时反映野心和摩擦。Chando 于 2025 年 9 月 29 日首次在香港递表，申请于 2026 年 3 月 29 日失效，随后在 2026 年 4 月 2
              日重新递表。亲公司口径把失效解释为程序性事项。负面和质疑性报道给出更硬的解读：投资者和监管机构仍担心品牌集中度、相对偏低的研发强度、IPO
              前一轮定价公允性，以及控制权背后的家族信托结构。这些担忧并不否定业务本身，但解释了为什么公司概览必须在同一段里同时写出规模和集中度。
