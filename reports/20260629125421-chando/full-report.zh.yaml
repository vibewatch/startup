      - number: '2.3'
        title: 渠道和买方结构：线下仍领先，但数字层决定节奏
        blocks:
          - type: paragraph
            body: >-
              中国护肤还不是纯线上市场，但数字层越来越控制发现、活动节奏和转化质量。IMARC 称 2025 年线下仍占护肤分销的
              58.6%，这意味着美妆专柜、专营零售和其他实体渠道仍然重要。但同一来源称线上是增长最快的路径；Daxue 则认为线上已代表全渠道化妆品交易额的
              65.36%，远高于全国实物商品零售的线上占比。结论不是必有一个来源错了，而是护肤和化妆品渠道指标正在不同层级、不同定义下被测量。

              平台层证据显示，数字战场已经高度集中。ChemLinked 称，2024 年淘天、Douyin、JD 和 Kuaishou 的化妆品 GMV 接近 540 billion yuan，其中淘天仍最大，Douyin
              追赶最快，JD 从较小基数稳步增长。Alibaba 和 JD 的大促数据进一步说明，在一个买方、用户和付款人通常是同一个人的品类里，促销、直播间和会员群体就像准预算分配器。

              对 Chando 而言，渠道战略的核心不是抽象地选线上或线下，而是把高端专柜、广泛线下存在、旗舰店会员、直播转化和大促窗口编排成一个系统。线下仍验证信任；数字越来越决定速度。
