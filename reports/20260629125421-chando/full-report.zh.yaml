  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议维持 Track，因为本轮估值看起来合理，不算便宜
        blocks:
          - type: paragraph
            body: >-
              最干净的估值锚仍是 Chando 自身 2024–2025 年融资和 2026 年香港申报。公开来源显示，L’Oréal 关联和 Jiahua / Himalaya 关联投资者投入超过 RMB700
              million 外部资本，投后估值 RMB7.14 billion；申报材料显示 2025 年收入 RMB5.318 billion、毛利率 70.6%、销售及分销费用强度 57.2%、线上收入占比
              69.5%，并且 95.3% 依赖 Chando 旗舰品牌。按这个算，本轮约为 1.34x 往绩销售额。它并没有明显被低估：估值已经假设，公开市场投资者会为一家规模更大、盈利且仍在增长的美妆平台，支付高于
              Yatsen 不到 1x 销售额的倍数。但如果上市价格接近本轮，它也不明显昂贵，因为 Proya 和 Botanee 的交易倍数明显更高。问题不在于 Chando 是否是真实业务，而在于投资者是否应在看见 IPO
              价格区间、募资用途桥、资本表优先权条款和促销后单位经济性之前先付溢价。基于保留证据集，结论应是价格纪律，而不是热情：接近本轮估值时维持 Track，在披露改善前避免相对本轮支付明显溢价。
