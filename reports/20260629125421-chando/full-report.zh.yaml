      - number: '3.4'
        title: Chando 的护城河真实存在，但分散度不如最强上市同业
        blocks:
          - type: paragraph
            body: >-
              证据支持 Chando 拥有真实但有条件的护城河。品牌仍受益于高消费者认知、广泛零售足迹、五品牌集团结构、20 个实验室、590 件专利，以及 L'Oréal
              的少数股权投资对平台的验证。但这条护城河还没有最优秀可比公司那样分散。Proya 的组合显示，它对旗舰标签依赖更低，线上货品循环更快，并拥有多个相邻利润池。Botanee 结合了敏感肌权威、400
              多名研发人员、医疗 / 药房渠道信任，以及 Winona Baby、Aoxmed 等新增长引擎。Yatsen 经济性更嘈杂，但证明了挑战者一旦找到需求，可以快速调整组合。与此同时，Shiseido 和
              L'Oréal 继续以规模化投入，把高端科学和高端品牌参照点维持在多数本土同业之上。因此，Chando
              最可能面临的替代风险不是品牌消失，而是皮肤学级护肤拿走功效导向买家，线上优先同业持续压缩流量经济性，而旗舰品牌集中让集团在一个核心主张变软时暴露出来。
