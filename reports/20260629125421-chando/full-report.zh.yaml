      - number: '5.2'
        title: 成分引擎、研发体系，以及科学故事的组织方式
        blocks:
          - type: paragraph
            body: >-
              Chando 公开产品技术论证里最强的不是单一 SKU，而是它组织研究的方式。官方页面持续描述三大科学体系——皮肤科学、原料科学和产品科学——以及覆盖原料、配方、包装和评价的四大技术平台。研发中心宣称，截至
              2026 年 5 月拥有 20 个实验室、590 件专利申请、275 件授权、49 项标准制定参与，以及 220 多篇技术文章，其中包括 92 篇国际出版物。在这套栈里，HiMurchaSin
              是核心成分叙事：Chando 称研究始于 2013 年，涉及喜马拉雅菌株分离、发酵工艺迭代、下游处理改进和多项学术合作，之后进入商业应用。2026 年上新周期把这一逻辑延伸到 HiMurchaS Super
              Anti-Aging Peptide 和第 7 代小紫瓶；IMCAS 2026 展示又给 Chando 在 577 提亮和基于 microRNA
              的色素管理上提供更高级别的证明点。限制在于，多数功效和机制细节仍停留在公司或 PR 页面，而不是充分公开方法、对照和同行评议的公共档案。
