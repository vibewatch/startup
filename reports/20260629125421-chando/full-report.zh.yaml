      - number: '3.2'
        title: 既有巨头、相邻玩家和替代品改变了待办任务比较
        blocks:
          - type: paragraph
            body: >-
              买方如果不选 Chando，并不只是在比较本土护肤品牌。当购买触发点是敏感肌功效或接近医生的信任时，Botanee 的 Winona 提供皮肤学级护肤和药房主导的替代品；其 2025
              年申报显示，它在中国皮肤学级护肤中占 19.4% 份额，进入高端护肤头部位置，并扩大 OTC / OMO 覆盖。Florasis
              是另一类相邻威胁：它围绕高端中国审美、彩妆加护肤叙事、五个研发中心和可赠礼艺术感定位，而不是 Chando
              的大众护肤核心，因此它争夺的是文化驱动的自我赠礼和高端化妆品篮子，多于基础补水或修护。两者之上还有全球既有巨头的天花板。Chando 自身覆盖材料指出，L'Oréal、P&G、Estée
              Lauder、Shiseido 和 LVMH 仍主导整体市场前五名；L'Oréal 和 Shiseido
              的官方页面则说明原因——深厚研究体系、高端品牌组合和上市公司运营纪律。因此，真实替代集合是一组曲目：本土大众护肤、皮肤学级护肤、高端日法美妆，以及相邻的彩妆主导高端化，而不是单一同货架匹配。
