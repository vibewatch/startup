      - number: '4.3'
        title: 营销强度与研发深度
        blocks:
          - type: paragraph
            body: >-
              Chando 的财务张力不在毛利率，而在支出分配。三个披露年度里，销售及分销费用都吃掉超过一半收入，2024 年峰值为 59.0%，2025 年仍为 57.2%。独立报道称，2025 年单广告支出约
              RMB1.66 billion；Bamboo Works 也把该模式明确连接到大量使用 KOL 和平台通行费上升。申报文件和外部报道还显示，内部 KOL 从 2023 年的 52 名增至 2025 年的 98
              名，外部 KOL 关系到 2025 年末达到 13,611 个。与之相对，报告研发支出仍接近收入 2%，尽管公司材料宣称拥有 20 个实验室、590 件专利和大量发表成果。问题不是 Chando
              没有技术资产，而是公开财务仍显示，这是一门由品牌和流量购买主导 P&L 的生意；研发强度仍过低，无法清楚支撑持续高端化或可防守的功效定价权。
