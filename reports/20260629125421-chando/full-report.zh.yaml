  - id: TP001
    title: 竞争对手画像表
    enumerationScope:
      coverage: partial
      basis: >-
        Profiles the most relevant direct, incumbent, adjacent, and substitute competitors surfaced by Chando, Proya,
        Botanee, Yatsen, Florasis, and incumbent disclosures as of the 2026 run date; exact private brand profitability
        and all hero-SKU pricing are not fully public.
    columns:
      - 竞争对手
      - 品类
      - 规模 / 融资
      - 目标客群
      - 差异化
      - 局限
    rows:
      - - Chando
        - 大众高端国产多品牌护肤集团
        - 2025 年收入 RMB5.318bn；投后估值 7.14bn；64,800 个零售销售点
        - 有线下试用习惯的大众国产护肤和个护买家
        - 旗舰品牌认知、线下网点、自然科学叙事、20 个实验室 / 590 项专利
        - 2025 年销售中 95.3% 仍来自旗舰品牌；线上占比落后于最佳数字化同行。
      - - Proya
        - 直接可比的上市国产标杆
        - 2025 年上半年收入 RMB5.362bn；主营收入 95.39% 来自线上
        - 大众高端护肤，以及彩妆、头皮护理和 Gen-Z 品牌
        - 数字优先分销、更宽的品牌梯队、清晰的价格分层
        - 仍高度依赖线上平台以及 Douyin / Tmall 流量经济。
      - - Botanee / Winona
        - 功效护肤替代品和上市同行
        - 2025 年收入 RMB5.359bn；Winona 持有约 19.4% 国内功效护肤份额
        - 敏感肌、药房、OMO 和功效导向买家
        - 皮肤科背书的信任、药房触达、OMO 闭环、400+ 名研发人员
        - 比 Chando 更偏临床表达；较少讲大众审美品牌故事。
      - - Yatsen / Perfect Diary group 集团
        - 围绕护肤重建的社交电商挑战者
        - 2026 年一季度收入 RMB1.02bn；护肤品牌占组合 56.2%
        - 大众彩妆、高端护肤和更年轻的线上购物者
        - 组合覆盖 Perfect Diary 到 Galénic / DR.WU / Eve Lom；组合重定位速度快
        - 营销开支占 2026 年一季度收入的 72.2%，亏损扩大。
      - - Florasis
        - 相邻的高端艺术国货美妆品牌
        - 成立于 2017 年；披露 5 个研发中心和 170+ 项专利
        - 高端彩妆、送礼和文化驱动美妆买家
        - 中国美学定位、工艺感、高端设计语言
        - 相比 Chando 核心护肤篮子，更接近彩妆 / 高端送礼。
      - - L’Oréal 全球集团
        - 全球既有巨头
        - Chando 少数股权投资者；官方年报突出 4,000 名科学家
        - 高端和大众全球美妆买家
        - 深厚科学栈、品牌宽度、全球规模
        - 在中国通常竞争于 Chando 大众价格点之上。
      - - Shiseido
        - 全球高端既有巨头
        - 全球第 8 大美妆公司；高端销售占比 62%；EC 销售占比 35%
        - 高端皮肤美容和高端渠道买家
        - 高端组合、5 个研发基地、约 1,100 名研究人员
        - 2025 年报告称，中国与 Travel Retail 在 2024 年疲软后需要重组。
      - - Estée Lauder Companies 全球集团
        - 全球高端既有巨头
        - 最新工具包提供 10-K、10-Q、factsheet 和业绩档案
        - 高端护肤 / 彩妆和百货美妆买家
        - 正式披露节奏和高端组合深度
        - 保留下来的官方页面没有呈现中国特定产品或渠道细节。
    notes: 规模字段混合了最新全年、中期或季度披露，因为同行发布周期不同；本表用于比较姿态，不用于标准化估值或利润率对齐。
