            body: >-
              正面逻辑从规模开始。Chando 已是一家数十亿人民币级国内美妆平台，毛利率强、零售触点大、IPO 意图明确，并有 L’Oréal
              背书。这些事实重要，因为它们降低了业务只是叙事的概率。反过来，反方逻辑也异常清晰。同一份证明规模的申报材料，也证明了集中：95.3% 销售仍来自旗舰品牌；同一张支撑高端毛利率的
              P&L，也显示销售及分销费用吃掉收入 57.2%，结构重营销。独立负面评论也推向同一方向，认为 Chando 相比领先上市同行多元化不足，家族控制、研发强度低于营销，以及代言人争议可能压制 IPO
              需求。净结果是，公司应高于困境或转型美妆标的交易，但还没有赢得与最干净国内上市可比公司相当的高执行倍数。因此，建议仍对价格敏感：只有估值给执行风险留出空间时才买，而不是因为品牌大且熟悉就买。
