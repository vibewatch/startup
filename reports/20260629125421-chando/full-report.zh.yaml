      - number: '7.4'
        title: 监管、质量和合规风险
        blocks:
          - type: paragraph
            body: >-
              中国化妆品监管环境正变得更严格，而 Chando 此时正试图守住规模优先叙事。NMPA 2025 年改革意见明确加强线上经营监管、不良反应监测和电商平台责任；同时推动电子标签和更结构化的安全评估。Chando
              既是全渠道品牌，又高度依赖流量，这一点就很关键。技术要求也在收紧。STSC 2015 更新加入更严格的细菌和残留阈值、成分禁用和更低浓度上限，并设有 2027、2028 年期限；2026 年 4
              月指南则进一步明确防晒、染发、烫发、美白和防脱功效声称的预期。执法不是假设：2026 年 1 月汇总收录了全国和省级通告中的数十批不合格产品及多项企业检查发现。本次审阅通告没有点名
              Chando，但一家线上触达广、营销以功效为主的大型美妆品牌，必须承担让配方、标签和声称持续跟上变化中规则书的全部成本。因此，合规是反复出现的经营风险，不是一次性申报任务。
