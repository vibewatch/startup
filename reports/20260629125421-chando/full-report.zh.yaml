      - number: '7.5'
        title: 缓释因素、监控项和否决标准
        blocks:
          - type: paragraph
            body: >-
              本章并非没有缓释因素。Chando 拥有真实的科学和运营资产：公司称其有 20 个实验室、数百项专利申请、2020 年以来部署 105 套数字系统、庞大零售触点，以及包含明确 ESG 目标的 2030
              可持续发展框架。战略投资者也带来一定外部验证。但这些缓释因素要打折，直到它们体现在更好的结果里：更低营销强度、更高研发产出、更强非旗舰收入、更干净的营运资本指标，以及更透明的治理保障。因此，最重要的观察项都可量化。若营销费用率维持在收入中
              50% 以上，而研发仍在约 2%，「流量跑步机」仍未停。若旗舰品牌仍高于收入 90%，多元化就没有发生。若不良反应通告、抽检失败或功效声称争议触及品牌，旗舰集中风险会立刻变成声誉和收入风险。若 IPO
              在申报失效和公平性问题之后仍无法以合理水平通过公开市场，私募估值本身就会从支撑底变成风险信号。
