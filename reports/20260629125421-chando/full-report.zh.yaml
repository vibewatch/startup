  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 在证据约束下，悲观、基准、轮次锚点和乐观估值区间，以十亿元人民币计。
    data:
      items:
        - label: 悲观
          low: 4.3
          mid: 4.8
          high: 5.3
          detail: IPO 情绪疲弱，或缺少经营杠杆证据
        - label: 基准
          low: 6.9
          mid: 7.7
          high: 8.5
          detail: 上市价格接近上一轮，重估有限
        - label: 轮次锚点
          low: 7.14
          mid: 7.14
          high: 7.14
          detail: 最新公开融资参考
        - label: 乐观
          low: 10.6
          mid: 11.1
          high: 11.7
          detail: 需要更干净的多品牌和渠道效率证据
    approximationNotes: 区间用于决策，不是 DCF 输出。中点只是简单分析锚点，并非另行发布的数值。
    claimRefs:
      - CV008
      - CV009
      - CV039
      - CV040
