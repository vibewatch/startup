  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 跟踪
        - 中
        - 高
        - 接近本轮估值时合理；高于约 1.5x 销售额则偏贵
        - 只有 IPO 定价贴近 RMB7.14bn 轮次锚点，且管理层补上单位经济性和稀释缺口，才进入承销。
    notes: 这一判断明确受价格约束：同一家公司在本轮估值附近可以合理，但若 IPO 在新证据出现前要求明显上台阶，就会变贵。
