        title: 渠道结构、GTM 动作和销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              申报文件中最强的结构性变化是渠道迁移。线上渠道收入占比从 2023 年的 61.9% 升至 2025 年的 69.5%，线下贡献降至
              30.2%。这一结构变化重要，因为同一份申报文件显示，线上毛利率显著高于线下：2025 年为 75.6% 对 59.6%。因此，Chando
              似乎正在加码一个在营销支出前就能增厚利润率的渠道组合。管理层还称，多年来一直在搭建支撑这一推进的数字管线，包括 105
              个数字系统、全渠道库存管理，以及旨在连接线下门店和互联网流量的云店架构。问题在于，公开披露仍止步于渠道结构和渠道毛利率。它没有披露实际 CAC、回本期、复购率，或扣除流量和 KOL 费用后的 DTC
              贡献利润率，因此投资者看得到漏斗顶部，却看不到漏斗真实效率。
