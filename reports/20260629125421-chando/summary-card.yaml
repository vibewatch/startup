  topStrengths:
    - >-
      Chando is already a scaled domestic beauty platform with RMB 5.318 billion of 2025 revenue, a 70.6% gross margin,
      and improving liquidity ahead of listing.
    - >-
      The company has visible omnichannel reach, including a very large offline footprint and a sales mix that shifted
      to 69.5% online by 2025.
    - >-
      Public materials support a real product and R&D narrative rather than pure branding alone, with a five-brand
      architecture, 20 laboratories, significant patent activity, and strategic investment from L'Oréal.
  topRisks:
    - >-
      Revenue concentration is extreme: the flagship CHANDO brand still contributed about 95.3% of 2025 sales, limiting
      portfolio resilience.
    - >-
      The P&L remains marketing-heavy, with selling and distribution expense above 54% of revenue in each disclosed year
      while R&D stayed near 2%.
    - >-
      Governance remains tightly controlled by the Zheng family, and IPO scrutiny has already touched trust structure,
      valuation fairness, and broader minority-investor protections.
    - >-
      Public disclosure still does not close core underwriting questions on CAC, repeat behavior, contribution margin,
      and detailed listing terms.
  unresolvedGaps:
    - >-
      Final IPO price range, proceeds plan, dilution mechanics, and any preference or conversion terms tied to the
      pre-IPO financing.
    - >-
      Post-promotion unit economics, including CAC, repeat-purchase behavior, contribution margin, and channel-level
      payback.
    - Evidence that non-flagship brands can become meaningfully accretive and reduce the group's dependence on CHANDO.
    - >-
      Clearer supplier, manufacturing, and compliance-detail disclosure beyond high-level quality-system and
      digital-stack descriptions.
