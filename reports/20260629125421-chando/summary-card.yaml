summary:
  headline: >-
    Chando has real beauty-market scale, strategic outside backing, and a live HK IPO path, but the current evidence
    still supports only a track stance because brand concentration, family control, and marketing-heavy economics keep
    the valuation fair near the last round rather than clearly attractive.
