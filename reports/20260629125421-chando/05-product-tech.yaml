- id: quality-manufacturing-and-digital-operations
  title: Quality controls, manufacturing visibility, and the digital operating stack
  body: Chando’s product delivery model depends on much more than formulation science. Official materials say every product runs through a “Six-Sense & Six-Quality” system with at least 60 safety and efficacy assessments, while the filing extract surfaces operational markers such as SAP, ERP, MES, and WMS plus certification labels including ISO9001, ISO22716, GMPC, HACCP, and BRC. That is enough to say the company publicly presents a quality-managed and digitally instrumented operating stack. It is not enough to say the stack is fully transparent. The same prospectus extract also repeatedly references OEM and ODM, yet the public record reviewed here does not disclose a plant-by-plant map or the split between in-house and outsourced categories. Digital technology partly compensates for that opacity at the commercial layer. Since 2020, Chando says it has implemented 105 digital systems, built omni-channel inventory management, and rolled out a cloud-store program that links online sales, membership,
    drop shipping, live streaming, and store management. External reporting from 36Kr backs the existence of a real transformation effort, not just a slogan, but public sources still stop short of revealing batch-level traceability, supplier concentration, or defect and recall history.
