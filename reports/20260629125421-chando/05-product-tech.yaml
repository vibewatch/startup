- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - company solution
  - measurable benefit
  - limitation
  rows:
  - - Daily anti-aging maintenance
    - User wants one hero serum with easy routine fit
    - Little Purple Bottle family framed around fatigue-induced aging
    - Company claims 7 million yeast extracts per drop plus firming, anti-wrinkle, brightening, and repair in one routine
    - Evidence is mainly company or PR based rather than openly published study packs
  - - Pigment management for Asian skin
    - User wants brightening with lower irritation risk
    - 577-based brightening mechanism translated into Snow Skin / Cellcrystal line
    - Company and trade sources cite melanin reduction and brightness improvement in a 32-person test
    - Public evidence does not expose full protocol or long-term tolerability data
  - - Sensitive-skin barrier restoration
    - User wants barrier care with science framing
    - Biorrier barrier products plus target-mining and white-paper narrative
    - Company claims seven barrier-related targets and product awards
    - Hospital/doctor penetration claims are not independently reconstructed
  - - Infant and child skin management
    - Parent wants safe non-pharmacological support products
    - imine AD cream and baby sunscreen with Fudan-linked clinical messaging
    - Company claims 28-day recurrence reduction of more than three times
    - Public materials do not disclose comparator design or full clinical protocol
  - - Outdoor male oil-control use case
    - User wants oil-control products embedded in sports or outdoor routines
    - Chando Men Glacier Oil-Control line paired with Codoon, JD, and trail-race activations
    - Shows ability to wrap product use into scenario-based marketing and conversion loops
    - This proves merchandising sophistication more than product efficacy
  - - Omnichannel replenishment and store-led conversion
    - User wants unified access across online and offline touchpoints
    - Cloud Store plus omni-channel inventory and digital membership functions
    - Ten cloud-store functions and integrated inventory are publicly described
    - Public record does not quantify error rates, service levels, or return performance
  notes: “Measurable benefit” includes company-claimed or test-linked benefits where those are the only public metrics available; it is not a statement of independently verified clinical superiority.
