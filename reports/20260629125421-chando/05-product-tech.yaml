callouts:
- calloutType: strength
  title: Chando’s public science stack is unusually explicit for a mass-market domestic beauty brand
  body: The company does more than wave vaguely at “natural ingredients.” It names laboratories, technology platforms, ingredient pipelines, conference presentations, and digital operating systems. That does not prove all claims, but it does mean there is a real architecture to diligence rather than a pure celebrity-marketing shell.
  claimRefs:
  - CE012
  - CE013
  - CE014
  - CE025
  - CE034
- calloutType: risk
  title: The evidence burden is still heavier than the public proof pack
  body: Most effect-size, mechanism, and tolerability claims still come from Chando-owned or Chando-amplified surfaces. Independent conference attention helps, but without study reports, patent reconstruction, and supplier transparency, the public proof pack remains weaker than the ambition of the product story.
  claimRefs:
  - CE020
  - CE023
  - CE025
  - CE044
  - CE050
- calloutType: risk
  title: Cross-border claim language deserves legal and scientific diligence
  body: A domestic warning that cosmetics cannot claim medical effects sits uncomfortably beside cross-border storefront language that promises acne treatment and other stronger outcomes. That mismatch may reflect market-by-market legal tailoring, but it is important enough to require a formal claims-substantiation review before leaning on international DTC growth assumptions.
  claimRefs:
  - CE011
  - CE013
  - CE049
