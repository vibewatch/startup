- id: limitations-compliance-and-evidence-gaps
  title: Where the product story is strongest — and where it is still too promotional
  body: 'The public record supports a real product-and-technology platform, but it also shows where diligence should push hardest. First, the company’s external science narrative outruns independent proof: third-party and trade coverage repeatedly note that R&D spend is only about 2% of revenue, and Bamboo Works explicitly argues that younger consumers now want proof that products do what they claim. Second, claim governance deserves scrutiny. The cross-border storefront uses stronger language such as acne treatment, while the domestic site foregrounds an NMPA warning that cosmetics cannot claim medical effects; that mismatch does not prove non-compliance, but it does create a clear substantiation question. Third, Chando’s public brand and culture surfaces — from the Snow Mountain Guardians IP to Future Beauty City and the Glacier Oil-Control trail-race program — show sophisticated scenario marketing and experiential retail design, yet they do not substitute for supplier transparency, study-level
    clinical evidence, or a patent-by-patent defensibility map. The takeaway is that Chando has enough visible architecture to merit serious diligence, but not enough external proof to let investors underwrite the science story at face value.'
