  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: manufacturing-footprint-opacity
    missingEvidence: Plant-by-plant production footprint, named OEM/ODM partners, supplier concentration, and exact in-house versus outsourced split by category.
    whyItMatters: A beauty group can look science-heavy in marketing while remaining operationally dependent on external manufacturing; without supplier and site visibility it is hard to judge quality control, margin durability, and scale risk.
    diligencePath: Request factory list, OEM/ODM contract map, top-supplier concentration, audit schedules, and batch-release governance by category.
    relatedQuestionRefs:
    - QE014
    - QE025
    - QE027
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: clinical-substantiation-depth
    missingEvidence: Protocols, endpoints, sample construction, statistical analysis, and peer-reviewed publication status for HiMurchaSin, 577, and imine efficacy studies.
    whyItMatters: Most headline efficacy claims in the public record come from company or PR surfaces; without underlying study design, effect sizes and tolerability claims cannot be fully underwritten.
    diligencePath: Request full study reports, IRB or ethics details where relevant, third-party lab summaries, and any peer-reviewed papers linked to marketed claims.
    relatedQuestionRefs:
    - QE020
    - QE021
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: patent-register-reconstruction
    missingEvidence: An externally reconstructed patent ledger linking the disclosed aggregate counts to specific applications, assignees, jurisdictions, and status changes.
    whyItMatters: The company discloses large aggregate patent counts, but investors still need to know whether those filings cluster in packaging, ingredients, process, or marketing-adjacent categories and how many remain defensible.
    diligencePath: Run a CNIPA or commercial patent-database reconstruction by assignee and inventor name, then map patents to hero ingredients and branded product lines.
    relatedQuestionRefs:
    - QE006
    relatedTableRefs:
    - TE003
  - type: conflicting-data
    severity: material
    topic: cross-border-efficacy-compliance
    missingEvidence: A formal claim-substantiation matrix reconciling U.S./cross-border storefront wording with domestic NMPA-compliant wording and underlying evidence packs.
    whyItMatters: The public storefront language is materially stronger than the domestic warning surface, creating legal, reputational, and channel-compliance risk if substantiation standards differ by market.
    diligencePath: Obtain market-by-market claims playbook, legal-review standards, ingredient dossiers, and a sample of approved substantiation files for the Himalaya collections.
    relatedQuestionRefs:
    - QE019
    - QE027
    relatedTableRefs:
    - TE004
  - type: access-blocked
    severity: minor
    topic: technical-org-signal-depth
    missingEvidence: Structured public detail on open technical roles, R&D headcount by function, and engineering or formulation leadership bios below the top scientist layer.
    whyItMatters: The product story relies heavily on an internal science and digital machine, but the public recruiting surface alone was not rich enough to size that machine or evaluate hiring priorities.
    diligencePath: Request an R&D org chart, open-role list, formulation-science headcount, and key-lab leader bios; supplement with Chinese-language recruiting exports if available.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
