company:
  name: Atom Computing
chapter:
  number: 2
  title: Market Analysis
  summary: Atom Computing operates in an early-commercial quantum-computing market where public and private buyers are funding capability development before broad economic advantage is proven. Multiple sizing lenses show substantial long-term value, but the near-term serviceable market is constrained by logical-qubit readiness, integration requirements, and dependence on government and research budgets.
sections:
  - id: market-boundary
    title: Market boundary and economic scope
    body: |
      Atom's addressable market is the purchase and operation of fault-tolerant, gate-based quantum-computing systems and the associated software, integration, and support needed to run them. That boundary includes on-premises processors, hybrid quantum-classical infrastructure, control and error-correction software, application development, and services for enterprise, government, and research users. It excludes adjacent quantum sensing, timing, communications, generic classical high-performance computing, and broad downstream economic benefits that are not processor revenue. This distinction matters because published market estimates mix hardware, software, services, and sometimes the value created by applications. Atom's own whitepaper states that economically valuable applications require logical qubits and that early applications are estimated to require approximately 100 logical qubits; the QuNorth deployment illustrates a buyer purchasing a complete stack rather than only a chip. The resulting market is better viewed as a staged infrastructure market than as a mature software subscription category.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and what they do not prove
    body: |
      The evidence supports a range of market lenses rather than a single defensible TAM. Quantum Technology Monitor 2026 reports more than $1 billion of quantum-computing revenue in 2025 and a forecast of $3.2 billion to $4.4 billion in 2028, while another 2026 forecast describes a $1.4 billion 2025 market growing at about 30% annually to more than $3 billion by 2028. These estimates are directionally consistent but differ in methodology and scope, so they should not be combined arithmetically. A separate UK government strategy frames quantum computing through potential benefits, estimating $5-10 billion of global benefits over the next three to five years and $450-850 billion over the next fifteen to thirty years; those are economic-benefit estimates, not vendor revenue. McKinsey's 2035 value-at-stake lens of $1.3-2.7 trillion likewise describes industry value, not Atom's serviceable sales. The practical implication is that Atom's SAM depends on which customers can fund on-premises systems or hybrid access and whether logical-qubit performance reaches production workloads.
    claimRefs: [CM004, CM005, CM006, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: |
      The most visible buyer groups are governments, research institutions, and large enterprises with a strategic application budget. The buyer and payer are not always the end user: a public fund or ministry can finance a national capability, while researchers and industrial application teams consume access. QuNorth's €80 million capitalization is a concrete example of a public-interest vehicle acquiring and operating a system for Nordic researchers and industry; its stated use cases include quantum chemistry, drug development, route optimization, and supply-chain planning. Government procurement can also act as an early-adopter mechanism: the UK strategy explicitly links procurement and feasibility studies to useful public-sector applications. Enterprise adoption is likely to proceed through hybrid environments and application experiments before repeatable production workloads; a Data Center Knowledge report on OQC, JPMorgan Chase, and AMD describes colocated quantum, AI, and classical infrastructure for finance research and notes that practical value remains uncertain. Atom therefore sells into a multi-stakeholder adoption path in which technical access, application validation, data sovereignty, and internal quantum skills precede scaled budget ownership.
    claimRefs: [CM009, CM010, CM011, CM012]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Growth drivers, constraints, and valuation relevance
    body: |
      Public-sector funding, error-correction progress, and customer-specific application development are the strongest observable demand drivers. DARPA's Stage C program is designed to independently assess whether Atom's proposed utility-scale machine can be built and operated as designed, with potential funding of up to $300 million; this is an important validation and demand signal, but it is not booked revenue. The UK strategy's £2.5 billion ten-year commitment and its emphasis on procurement, skills, and commercialization show how national programs can create ecosystems around early vendors. Conversely, the market remains exposed to long technical timelines, integration latency, scarce specialist talent, and uncertain willingness to pay. A 2026 forecast reports that 54% of respondents see some probability of a quantum winter by 2031, defined there as a sustained decline in quantum R&D investment exceeding 25%, while also reporting that on-premises systems may become the largest segment by 2028. These mixed signals support a staged adoption thesis, not a straight-line revenue forecast. Atom's valuation relevance is therefore tied to evidence of repeatable deployments, funded applications, and conversion from publicly supported demonstrations to customer-owned workloads.
    claimRefs: [CM013, CM014, CM015, CM016]
