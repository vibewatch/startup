  evidenceGaps:
    - type: missing-source
      severity: material
      topic: atom-serviceable-market
      missingEvidence: Public evidence isolating Atom's obtainable system, software, and services market by geography, customer segment, and deployment model.
      whyItMatters: Global quantum-market totals include categories and downstream benefits that may not convert into Atom revenue.
      diligencePath: Request a bottoms-up pipeline and segmentation schedule showing qualified accounts, deployment assumptions, contract values, and conversion timing.
      relatedQuestionRefs: [QM009]
    - type: private-evidence-only
      severity: material
      topic: willingness-to-pay
      missingEvidence: Customer-level pricing, annual support economics, backlog, and repeat-purchase evidence for Atom systems.
      whyItMatters: Public announcements establish capability and ecosystem interest but do not establish recurring revenue, gross margin, or durable willingness to pay.
      diligencePath: Obtain executed customer contracts, pricing schedules, backlog aging, renewal terms, and revenue-recognition policy under confidentiality.
      relatedQuestionRefs: [QM009]
    - type: conflicting-data
      severity: minor
      topic: market-size-estimates
      missingEvidence: Comparable definitions and methodology bridges for the 2025 and 2028 global quantum-computing market estimates.
      whyItMatters: The published estimates are directionally similar but cannot be safely averaged or used as one TAM.
      diligencePath: Reconcile included components, geographies, currencies, and forecast bases with each publisher before using a single planning case.
      relatedQuestionRefs: [QM010]
