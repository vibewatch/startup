company:
  name: Atom Computing
chapter:
  number: 6
  title: Customers
  summary: Atom has credible evidence of an initial commercial customer path through QuNorth and Microsoft, plus government and research demand signals, but public evidence still describes a concentrated, project-based customer base rather than proven repeatable retention or expansion.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: |
      Atom's customer model is centered on organizations that can fund, host, and operate specialized quantum hardware rather than on a broad self-serve software audience. The company's own materials describe on-premises deployment and collaboration with application developers, while third-party coverage identifies government R&D, research institutions, enterprise application partners, and sovereign quantum programs as the relevant demand pools. The buyer, user, and payer are not necessarily the same: a government or research sponsor can fund a system, a technical team can operate it, and application teams can consume logical-qubit capability. That distinction matters because a named relationship or partnership does not by itself establish recurring revenue, production utilization, or a high-volume commercial funnel.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption and named deployments
    body: |
      The strongest public adoption evidence is a first commercial on-premises system sale to QuNorth, with Microsoft supplying a software and error-correction layer in the Magne project. The assigned sources also describe installation activity, DARPA benchmarking, and a Department of Commerce letter of intent, but those signals have different commercial meanings. A government program or LOI is demand validation and potential funding, not the same as a paid customer contract; a partner collaboration is not the same as independent product adoption. Atom's own customer-facing materials say AC1000 is commercially available for on-premises deployment, while independent coverage frames current revenue as largely project-based and highlights the lack of a second on-premises sale as a concentration issue.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion
    title: Retention, expansion, and concentration
    body: |
      Public evidence does not establish NRR, GRR, churn, renewal rates, contract length, cohort retention, or customer satisfaction. The available commercial evidence instead points to milestone-based system economics: engineering, acceptance, installation, commissioning, maintenance, and software support are separate potential revenue surfaces, and the timing of those milestones can make reported revenue lumpy. Microsoft may widen distribution and provide cloud and application access, but the revenue split and customer ownership are undisclosed. The key durability test is whether Magne commissions successfully and whether Atom converts that reference into additional paid deployments with recurring support or upgrade revenue. Until that is demonstrated, customer concentration and procurement friction remain material gaps rather than claims that can be scored from logos or partnership announcements.
    claimRefs: [CU010, CU011, CU012, CU013]
  - id: diligence-gaps
    title: Customer diligence priorities
    body: |
      The customer thesis is investable only if Atom can show that the QuNorth deployment is a repeatable commercial template rather than a one-off flagship project. The next evidence package should separate signed orders from letters of intent, paid production use from installation or pilot status, and Atom revenue from total program funding. It should also provide customer-level concentration, backlog, acceptance milestones, support and maintenance attach rates, renewal or expansion history, and outcome metrics for named applications. Independent sector analysis further warns that broad quantum budgets and collaborations do not yet establish production ROI because many applications remain experimental or hybrid. Because the assigned evidence is mostly company-issued or ecosystem reporting, independent customer attestations and procurement records would materially improve confidence. The absence of public churn or complaints is not proof of retention; it is an evidence gap that should remain explicit.
    claimRefs: [CU014, CU015, CU016]
    callouts: []
