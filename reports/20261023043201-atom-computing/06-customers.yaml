      - ["Microsoft", "Cloud and application partner", "Logical-qubit software, error correction, and Azure ecosystem integration", "Strategic co-development and deployment partner", "Extends software and enterprise reach", "Revenue split and end-customer ownership are undisclosed"]
      - ["DARPA", "Government program sponsor", "Quantum Benchmarking Initiative utility-scale assessment", "Program selection and staged evaluation", "External validation channel and potential government demand", "Program awards are not equivalent to recurring commercial revenue"]
      - ["U.S. Department of Commerce", "Government funding counterparty", "CHIPS R&D support for scaling neutral-atom systems", "Non-binding LOI rather than completed contract", "Potential capital and manufacturing support", "Definitive agreement, timing, and customer purchase terms are not public"]
    notes: Named proof is partial and includes partners and public-sector counterparties because Atom does not publish a complete customer roster; each row therefore separates deployment status from outcome evidence.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
figures:
  - id: FU001
    title: Customer journey from technical access to expansion
    type: journey-map
    summary: Atom's public customer path progresses from ecosystem access and government validation to an on-premises reference deployment, then to repeat sales and recurring support that remain unproven.
    data:
      nodes:
        - id: ecosystem
          label: Ecosystem access
          title: Partner and developer access
          detail: Partner program and application collaborations provide early access, technical feedback, and application exploration.
          touchpoints: [Partner program, application development, technical collaboration]
        - id: validation
          label: External validation
          title: Government and research programs
          detail: DARPA QBI and research relationships create technical validation and potential procurement channels.
          touchpoints: [DARPA benchmarking, research programs, public-sector demand]
        - id: deployment
          label: Reference deployment
          title: QuNorth / Magne
          detail: The first named commercial on-premises system is the clearest public proof of a buyer moving beyond experimentation.
          touchpoints: [On-premises installation, logical-qubit target, commissioning]
        - id: application
          label: Application use
          title: Enterprise and scientific workloads
          detail: Microsoft and application partners can connect hardware to chemistry, materials, drug discovery, and hybrid workflows.
          touchpoints: [Azure integration, algorithms, domain applications]
        - id: expansion
          label: Repeat and recurring
          title: Expansion loop
          detail: Additional paid systems, support, upgrades, and renewals would validate durability; public evidence does not yet show them.
          touchpoints: [Second deployment, maintenance, upgrades, renewal]
        - id: support
          label: Service layer
          title: Support and upgrades
          detail: Maintenance, calibration, software updates, training, and upgrades could create recurring value after installation, but attach rates are not public.
          touchpoints: [Maintenance, calibration, software updates, training]
    claimRefs: [CU001, CU005, CU006, CU010, CU012, CU016]
callouts:
  - calloutType: strength
    title: A credible first reference customer
    body: QuNorth is described as Atom's first commercial on-premises system sale, giving the company a concrete reference beyond logos or laboratory demonstrations.
    claimRefs: [CU005]
  - calloutType: risk
    title: Durability is not yet evidenced
    body: Public sources do not disclose retention, renewal, customer concentration, or a second paid deployment, so the commercial model remains exposed to first-installation execution and project timing.
    claimRefs: [CU010, CU013]
