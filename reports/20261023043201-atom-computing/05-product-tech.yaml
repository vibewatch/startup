          modules: [Chemistry and materials research, Algorithm development, Government and enterprise workloads]
        - label: Full-stack software
          modules: [Hardware control, Real-time conditional logic, Microsoft/Azure integration]
        - label: Logical-qubit operations
          modules: [Mid-circuit measurement, Error detection, Error correction, Qubit reset and reuse]
