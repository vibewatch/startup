  evidenceGaps:
    - type: missing-source
      severity: material
      topic: maturity
      missingEvidence: Independent system-level benchmarks showing fidelity, uptime, logical error rates, and repeatability on delivered hardware.
      whyItMatters: Physical-qubit counts and demonstrations do not establish reliable, economically useful customer workloads.
      diligencePath: Request acceptance-test reports, benchmark traces, uptime history, and independent replication rights for each delivered system.
      relatedQuestionRefs: [QE004, QE008]
    - type: private-evidence-only
      severity: material
      topic: commercialization
      missingEvidence: Executed Magne and QuNorth commercial terms, delivery acceptance criteria, pricing, utilization, and customer outcome data.
      whyItMatters: A planned or installed machine is not proof of recurring revenue, production use, or customer ROI.
      diligencePath: Obtain the signed contract, milestone schedule, usage reports, service levels, and first-user references under NDA.
      relatedQuestionRefs: [QE001, QE005]
    - type: missing-source
      severity: material
      topic: trust
      missingEvidence: Public security, privacy, safety, compliance, and incident-control documentation for on-premises deployments.
      whyItMatters: Government and enterprise deployment depends on operational controls beyond qubit performance.
      diligencePath: Request security architecture, incident history, certifications, vulnerability process, and site acceptance checklist.
      relatedQuestionRefs: [QE007]
    - type: stale
      severity: minor
      topic: developer-signal
      missingEvidence: A current public developer surface such as API documentation, release history, package activity, or user forum evidence.
      whyItMatters: Technical maturity is easier to underwrite when external developers can observe and reproduce the software interface.
      diligencePath: Request current API, SDK, release, support, and developer-adoption metrics, or document why they cannot be disclosed.
      relatedQuestionRefs: [QE001, QE004]
