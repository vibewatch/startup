callouts:
  - calloutType: insight
    title: Product judgment
    body: Atom's product is technically differentiated and increasingly deployable, but its commercial maturity is best described as early productionization rather than proven scaled utility.
    claimRefs: [CE005, CE009, CE014, CE016]
