    claimRefs: [CE002, CE004, CE007, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Atom preparation and optical tweezers, Trap and arrange neutral atoms, "Lasers, optics, vacuum", Alignment and scaling complexity]
      - [Nuclear-spin qubits, Store quantum information, Atomic species and control fields, "Decoherence and calibration"]
      - [Gate and measurement control, Execute operations and read qubits, Imaging and control electronics, "Fidelity and clock-speed trade-offs"]
      - [Error detection and correction, Convert physical operations toward logical qubits, Mid-circuit measurement and classical decoding, "Error propagation and code overhead"]
      - [Software and integration, Expose hardware to users and coordinate workflows, Microsoft/Azure and internal control software, "Vendor and integration dependency"]
    notes: The architecture is assembled from disclosed company and partner descriptions; the table is not a complete bill of materials or production-readiness certification.
    claimRefs: [CE005, CE006, CE009, CE013]
