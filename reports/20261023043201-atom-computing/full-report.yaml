              - CU016
      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >
              Public evidence does not establish NRR, GRR, churn, renewal rates, contract length, cohort retention, or
              customer satisfaction. The available commercial evidence instead points to milestone-based system
              economics: engineering, acceptance, installation, commissioning, maintenance, and software support are
              separate potential revenue surfaces, and the timing of those milestones can make reported revenue lumpy.
              Microsoft may widen distribution and provide cloud and application access, but the revenue split and
              customer ownership are undisclosed. The key durability test is whether Magne commissions successfully and
              whether Atom converts that reference into additional paid deployments with recurring support or upgrade
              revenue. Until that is demonstrated, customer concentration and procurement friction remain material gaps
              rather than claims that can be scored from logos or partnership announcements.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Customer diligence priorities
        blocks:
          - type: paragraph
            body: >
              The customer thesis is investable only if Atom can show that the QuNorth deployment is a repeatable
              commercial template rather than a one-off flagship project. The next evidence package should separate
              signed orders from letters of intent, paid production use from installation or pilot status, and Atom
              revenue from total program funding. It should also provide customer-level concentration, backlog,
              acceptance milestones, support and maintenance attach rates, renewal or expansion history, and outcome
              metrics for named applications. Independent sector analysis further warns that broad quantum budgets and
              collaborations do not yet establish production ROI because many applications remain experimental or
              hybrid. Because the assigned evidence is mostly company-issued or ecosystem reporting, independent
              customer attestations and procurement records would materially improve confidence. The absence of public
              churn or complaints is not proof of retention; it is an evidence gap that should remain explicit.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A credible first reference customer
            body: >-
              QuNorth is described as Atom's first commercial on-premises system sale, giving the company a concrete
              reference beyond logos or laboratory demonstrations.
            calloutType: strength
            claimRefs:
              - CU005
          - type: callout
            title: Durability is not yet evidenced
            body: >-
              Public sources do not disclose retention, renewal, customer concentration, or a second paid deployment, so
              the commercial model remains exposed to first-installation execution and project timing.
            calloutType: risk
            claimRefs:
              - CU010
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Atom Computing’s principal risk is execution against a technically ambitious and capital-intensive
              roadmap, not a confirmed adverse event in the assigned record. The company and third-party sources
              describe systems above 1,000 qubits, fault-tolerant objectives, and government-program progress, but those
              milestones remain the bridge between research capability and durable commercial economics. The highest
              residual exposure is therefore failure to convert physical-qubit progress into independently verifiable
              logical-qubit performance, accepted customer systems, and repeatable revenue. A thesis break should be
              triggered by missed benchmark or commissioning milestones, material slippage in the Magne program, or a
              financing need before contracted commercial cash is visible. These triggers are monitorable, unlike a
              generic concern that quantum computing is difficult.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
