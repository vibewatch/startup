      - number: '7.3'
        title: Operational, partner, and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              The operating model has three linked dependencies: neutral-atom engineering must scale reliably;
              partner-linked programs must reach acceptance; and government and private capital must fund the interval
              before recurring commercial economics are demonstrated. Public materials identify Microsoft and QuNorth in
              connection with Magne and describe on-premises systems, but the assigned evidence does not disclose
              contract value, revenue-recognition timing, revenue sharing, backlog, gross margin, cash burn, or
              recurring revenue. That creates a high residual exposure to schedule, working-capital, and concentration
              risk. Mitigation maturity should be upgraded only after management provides system acceptance criteria,
              independent performance results, a customer deployment list separating pilots from paid production, and
              audited cash and revenue schedules.
            claimRefs:
              - CR007
              - CR008
