  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and economic scope
        blocks:
          - type: paragraph
            body: >
              Atom's addressable market is the purchase and operation of fault-tolerant, gate-based quantum-computing
              systems and the associated software, integration, and support needed to run them. That boundary includes
              on-premises processors, hybrid quantum-classical infrastructure, control and error-correction software,
              application development, and services for enterprise, government, and research users. It excludes adjacent
              quantum sensing, timing, communications, generic classical high-performance computing, and broad
              downstream economic benefits that are not processor revenue. This distinction matters because published
              market estimates mix hardware, software, services, and sometimes the value created by applications. Atom's
              own whitepaper states that economically valuable applications require logical qubits and that early
              applications are estimated to require approximately 100 logical qubits; the QuNorth deployment illustrates
              a buyer purchasing a complete stack rather than only a chip. The resulting market is better viewed as a
              staged infrastructure market than as a mature software subscription category.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >
              The evidence supports a range of market lenses rather than a single defensible TAM. Quantum Technology
              Monitor 2026 reports more than $1 billion of quantum-computing revenue in 2025 and a forecast of $3.2
              billion to $4.4 billion in 2028, while another 2026 forecast describes a $1.4 billion 2025 market growing
              at about 30% annually to more than $3 billion by 2028. These estimates are directionally consistent but
              differ in methodology and scope, so they should not be combined arithmetically. A separate UK government
              strategy frames quantum computing through potential benefits, estimating $5-10 billion of global benefits
              over the next three to five years and $450-850 billion over the next fifteen to thirty years; those are
              economic-benefit estimates, not vendor revenue. McKinsey's 2035 value-at-stake lens of $1.3-2.7 trillion
              likewise describes industry value, not Atom's serviceable sales. The practical implication is that Atom's
              SAM depends on which customers can fund on-premises systems or hybrid access and whether logical-qubit
              performance reaches production workloads.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >
              The most visible buyer groups are governments, research institutions, and large enterprises with a
              strategic application budget. The buyer and payer are not always the end user: a public fund or ministry
              can finance a national capability, while researchers and industrial application teams consume access.
              QuNorth's €80 million capitalization is a concrete example of a public-interest vehicle acquiring and
              operating a system for Nordic researchers and industry; its stated use cases include quantum chemistry,
              drug development, route optimization, and supply-chain planning. Government procurement can also act as an
              early-adopter mechanism: the UK strategy explicitly links procurement and feasibility studies to useful
              public-sector applications. Enterprise adoption is likely to proceed through hybrid environments and
              application experiments before repeatable production workloads; a Data Center Knowledge report on OQC,
              JPMorgan Chase, and AMD describes colocated quantum, AI, and classical infrastructure for finance research
              and notes that practical value remains uncertain. Atom therefore sells into a multi-stakeholder adoption
              path in which technical access, application validation, data sovereignty, and internal quantum skills
              precede scaled budget ownership.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >
              Public-sector funding, error-correction progress, and customer-specific application development are the
              strongest observable demand drivers. DARPA's Stage C program is designed to independently assess whether
              Atom's proposed utility-scale machine can be built and operated as designed, with potential funding of up
              to $300 million; this is an important validation and demand signal, but it is not booked revenue. The UK
              strategy's £2.5 billion ten-year commitment and its emphasis on procurement, skills, and commercialization
              show how national programs can create ecosystems around early vendors. Conversely, the market remains
              exposed to long technical timelines, integration latency, scarce specialist talent, and uncertain
              willingness to pay. A 2026 forecast reports that 54% of respondents see some probability of a quantum
              winter by 2031, defined there as a sustained decline in quantum R&D investment exceeding 25%, while also
              reporting that on-premises systems may become the largest segment by 2028. These mixed signals support a
              staged adoption thesis, not a straight-line revenue forecast. Atom's valuation relevance is therefore tied
              to evidence of repeatable deployments, funded applications, and conversion from publicly supported
              demonstrations to customer-owned workloads.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The near-term market is infrastructure-led
            body: >-
              The most concrete demand evidence is a funded system acquisition and public programs that validate or
              procure capability; broad application value remains a future-oriented lens.
            calloutType: insight
            claimRefs:
              - CM009
              - CM011
              - CM013
          - type: callout
            title: TAM is not the same as obtainable revenue
            body: >-
              Published market figures vary in scope, and public-benefit estimates are not sales. Atom still needs
              pricing, backlog, repeat deployment, and workload-level ROI evidence before a company-specific SAM or SOM
              can be underwritten.
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The relevant competitive set is broader than neutral atoms
        blocks:
          - type: paragraph
            body: >-
              Atom competes first with other builders of fault-tolerant quantum processors, but a buyer can also choose
              a different modality, a hybrid software and control layer, simulation on classical accelerators, an
              internal research program, or continued deferral. The assigned evidence identifies Taiyi as a new
              neutral-atom entrant, Pasqal as an analog-first neutral-atom vendor, and PsiQuantum as a photonic
              architecture pursuing manufacturable scale. NVIDIA occupies a different layer: NVQLink and CUDA-Q connect
              or program multiple QPU modalities rather than replace one with a proprietary quantum processor. Forge's
              COI-based $2.06 billion post-money estimate indicates substantial private-market expectations but is not a
              product benchmark. Modality share, developer access, systems integration, and control-plane ownership are
              therefore separate competitive contests.
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
      - number: '3.2'
        title: Atom's differentiation is architectural and deployment-led
        blocks:
          - type: paragraph
            body: >-
              Atom's case rests on scale, long-lived nuclear-spin qubits, mid-circuit measurement, integrated controls,
              and a roadmap toward fault-tolerant logical computation. Its company materials describe more than 1,200
              physical qubits and a first commercial on-premises sale to QuNorth, while the latest company-issued DARPA
              release says an independent government team will test whether the utility-scale concept can be built and
              operated as intended. Those are meaningful proof points, but they do not produce a comparable, independent
              score against photonic or other modalities. Physical-qubit count, component fidelity, logical-qubit
              demonstrations, and time-to-solution are different denominators and should not be collapsed into one
              ranking.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP012
              - CP013
              - CP015
              - CP016
      - number: '3.3'
        title: Commercial packaging remains opaque
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports an on-premises systems motion and a partner-assisted stack, not a transparent
              price book. Atom's QuNorth sale is a concrete commercialization marker, yet the assigned sources do not
              disclose the system price, service burden, support term, utilization economics, or revenue-sharing with
              Microsoft. Comparable pricing for Taiyi, PsiQuantum, and NVIDIA's quantum stack is also absent from this
              pool. The correct comparison is therefore contract structure and deployment model rather than invented
              dollar figures. Procurement diligence should test whether customers buy hardware, milestones, access,
              integration services, or a bundled long-duration program, because each model creates different switching
              costs and margin exposure.
            claimRefs:
              - CP005
              - CP010
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP009
              - CP011
              - CP012
              - CP014
              - CP015
      - number: '3.4'
        title: The moat depends on proving system-level utility before the stack standardizes
        blocks:
          - type: paragraph
            body: >-
              Atom's strongest potential moat is the combination of neutral-atom hardware, error-correction progress,
              proprietary controls, on-premises deployment experience, and access to government and strategic partners.
              Its vulnerability is that adjacent suppliers can capture value around the processor: NVIDIA is promoting a
              modality-agnostic control and programming architecture, while photonic competitors emphasize semiconductor
              manufacturing and networking. A new neutral-atom entrant also shows that the modality itself is not
              exclusive. Durable differentiation therefore requires repeatable customer deployment, independent workload
              benchmarks, and commercially credible time-to-solution—not only qubit scale or capital raised. Until those
              data exist, platform dependence and modality substitution remain material displacement risks.
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial and government proof points
            body: >-
              A first on-premises sale and Stage C government verification activity move Atom beyond a laboratory-only
              narrative, although neither proves repeatable unit economics.
            calloutType: strength
            claimRefs:
              - CP004
              - CP005
          - type: callout
            title: Control-plane commoditization
            body: >-
              Hardware-agnostic orchestration can broaden Atom's reach while shifting developer access and bargaining
              power to the classical-compute platform.
            calloutType: risk
            claimRefs:
              - CP009
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and commercial conversion
        blocks:
          - type: paragraph
            body: >-
              Atom's public materials describe an on-premises hardware business whose economic conversion runs from
              scientific and engineering work to installed quantum systems. The first named commercial sale was to
              QuNorth in 2025, while public descriptions also place Microsoft in the software and error-correction
              layer. This supports a system-sale and integration model rather than a demonstrated subscription model.
              The available evidence does not disclose Atom's contract value, payment schedule, revenue share with
              Microsoft, acceptance terms, or realized gross margin, so the commercial milestone should not be treated
              as recurring revenue or ARR. Sacra's independent estimate is useful as a scenario input, not audited fact:
              it places 2025 revenue at $8.8M and says recognition for Magne is milestone-based, with most hardware
              construction and integration revenue expected in 2026.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI013
      - number: '4.2'
        title: Pricing, cost structure, and unit economics
        blocks:
          - type: paragraph
            body: >-
              No public list price for AC1000 or realized QuNorth pricing was found in the assigned evidence. The
              available business-model description indicates that payments can be tied to order signing, engineering,
              factory acceptance, delivery, installation, and system acceptance, with maintenance, support, upgrades,
              and training as possible additional streams. That structure creates a long working-capital cycle and makes
              revenue timing sensitive to engineering completion and customer acceptance. Costs are structurally
              demanding: precision lasers and optics, ultra-high-vacuum equipment, custom electronics, prototype
              systems, highly specialized talent, and field installation all precede volume economics. The evidence
              supports a capital- and talent-intensive model, but not a reliable CAC, payback, gross-margin,
              utilization, or recurring-support estimate.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI014
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Atom has public financing momentum but not public liquidity visibility. The assigned evidence reports a
              $100M Series C and a separate $100M Department of Commerce letter of intent, taking announced cumulative
              financing above $300M; the letter of intent is not the same as cash received. The company also has a
              potential government-funded demand channel through DARPA's QBI, but the cited Stage C release describes
              potential funding of up to $300M rather than a guaranteed award or unrestricted corporate cash. Neither
              cash on hand, burn rate, debt, covenant package, nor runway is disclosed. Accordingly, the underwriting
              question is not whether Atom has raised capital, but how much of the announced capital is contracted,
              available, restricted, or already committed to deployment.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI006
              - CI009
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financial quality is improving from laboratory work toward commercial systems, but disclosure remains
              insufficient for a conventional growth-company underwriting. The positive case is a credible first system
              sale, government and research demand, a large financing base, and a potential installed-base revenue
              stream. The negative case is concentration in an early flagship deployment, milestone-based recognition,
              unproven manufacturing and service margins, dependence on additional financing for multiple hardware
              generations, and no public evidence of cash runway or debt obligations. Sacra's estimate of approximately
              $27M FY2026 revenue and ARR below $3M is explicitly an estimate, not company-reported guidance; it should
              be stress-tested against the contract, acceptance schedule, and customer concentration. A financing
              decision should remain conditional on audited statements, a current cap table and preference stack, signed
              contract economics, backlog, and system-level cost data.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI004
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercialization has crossed a meaningful threshold
            body: >-
              Atom has a named first commercial on-premises sale and a financing base large enough to support continued
              system development, although neither establishes repeatable economics.
            calloutType: strength
            claimRefs:
              - CI001
              - CI009
          - type: callout
            title: Liquidity cannot be underwritten from announced commitments
            body: >-
              The public record does not show cash on hand, burn, debt, or the conditions attached to the Department of
              Commerce LOI and DARPA opportunity.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI015
          - type: callout
            title: Require contract-level economics before pricing the business
            body: >-
              The next diligence step is a financial package tying signed orders to recognition, backlog, gross margin,
              working capital, and runway rather than relying on headline funding totals.
            calloutType: recommendation
            claimRefs:
              - CI004
              - CI007
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and user workflow
        blocks:
          - type: paragraph
            body: >-
              Atom sells access to a gate-based quantum-computing platform rather than a conventional software license.
              Its public materials describe on-premises systems built from optically trapped neutral-atom arrays, with
              researchers, companies, and government users developing applications as hardware improves. The customer
              workflow therefore starts with a domain problem, moves through algorithm development and hardware
              execution, and depends on Atom's control stack, error-correction capabilities, and specialist support. The
              public record supports a product direction, but it does not disclose a complete catalog of SKUs,
              service-level commitments, utilization, or realized customer economics. QuNorth is the clearest named
              deployment: Atom supplies the hardware while Microsoft supplies the software layer for a Nordic initiative
              intended to serve academic and commercial users.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE009
      - number: '5.2'
        title: Architecture and technical maturity
        blocks:
          - type: paragraph
            body: >-
              The architecture combines optical-tweezer arrays, neutral atoms encoded in nuclear-spin states, lasers and
              imaging, control electronics, and a hardware-control software stack. Atom's 2025 whitepaper claims more
              than 1,200 qubits in its second-generation system, long coherence, mid-circuit measurement, real-time
              error correction, and a 64-logical-qubit architecture; those are company claims and should not be treated
              as an independently reproduced benchmark. A separate technical profile reports the 1,180-qubit
              announcement and describes the 24-logical-qubit entanglement result, but also highlights the field's
              continuing fidelity and control challenges. The mature part of the proposition is the integrated
              experimental platform; the less mature part is repeatable, economically useful, fault-tolerant production
              operation.
            claimRefs:
