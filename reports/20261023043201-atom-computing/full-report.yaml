      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              Treat failure to achieve independently verifiable technical milestones or to convert government and
              partner programs into contracted, repeatable commercial revenue as a thesis-break event.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
          - type: callout
            title: Evidence limitation
            body: No confirmed incident in the assigned pool is an evidence gap, not proof that no incident has occurred.
            calloutType: assumption
            claimRefs:
