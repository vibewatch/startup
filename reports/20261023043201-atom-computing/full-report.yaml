      - number: '1.3'
        title: Capital, milestones, and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              The financing record requires instrument-level qualification. Atom's archive records a $15 million Series
              A in July 2021 and a $60 million Series B in January 2022. A later independent briefing says cumulative
              capital surpassed $300 million, anchored by a $100 million Series C and a $100 million U.S. Department of
              Commerce letter of intent; another independent profile reports only $200 million-plus of disclosed funding
              and calls the federal LOI non-binding. These totals are not directly comparable, and neither establishes
              cash available, definitive equity terms, or current valuation. Commercially, Atom reports a first
              on-premises sale to QuNorth in 2025, a June 2026 Nu Quantum memorandum of understanding, and October 2026
              advancement to DARPA QBI Stage C, whose potential funding is not an awarded cash balance. IEEE
              independently describes Magne as a planned 50-logical-qubit system but also reports that neutral-atom
              operations are materially slower than superconducting operations. The milestone sequence is credible
              evidence of progress, not a substitute for audited revenue, backlog, margins, customer count, headcount,
              or delivery acceptance.
