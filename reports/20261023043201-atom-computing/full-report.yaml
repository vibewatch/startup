              - CR014
      - number: '7.2'
        title: Legal, regulatory, and government-program exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not establish a current lawsuit, enforcement action, license failure, privacy
              incident, safety event, or security breach involving Atom Computing. That absence is not evidence of
              absence: the pool is dominated by company materials and short source previews, so legal and compliance
              diligence remains open. Government-program dependence is more observable. Atom’s disclosures describe
              DARPA progression and a potential final-stage opportunity of up to $300 million, while funding coverage
              describes a planned or letter-of-intent Commerce Department amount. Those instruments should not be
              treated as received cash. Investors should obtain executed awards, performance conditions, matching
              obligations, clawbacks, export-control constraints, and termination rights before assigning value to them.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
