        - Market research still identifies coherence, gate-speed, atom-loss, and measurement challenges.
        - Independent evidence that these constraints are cleared at useful workload scale.
      - - Valuation risk
        - No current Atom price, revenue, margin, cap table, or preference stack is public in the pool.
        - Executed financing terms and an audited operating model.
    notes: >-
      Company-issued milestones are labeled as such; independent sources provide sector and execution context but do not
      independently verify every Atom claim.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Public programs execute, independent validation is positive, and customer deployments become repeatable.
        - >-
          A premium may be defensible, but no numeric range is supportable without price, revenue, dilution, and
          preferences.
        - Positive milestone path; probability not estimable from public evidence.
        - Failure to demonstrate customer acceptance or workload-level performance.
      - - Base
        - Technical progress continues while commercial economics and financing terms remain private.
        - Maintain research-more and wait for an underwritable entry package.
        - Best aligned with the current mixture of progress and missing economics.
        - Additional capital is required before repeatable revenue and margins are visible.
      - - Bear
        - Technical timelines slip, deployments remain bespoke, or sector multiples compress.
        - Downside is potentially amplified by dilution and preferences, but cannot be sized publicly.
        - Material adverse path given sector cost, complexity, and adoption uncertainty.
        - Missed program milestones, weak uptime, poor utilization, or an unfavorable financing.
    notes: >-
      Scenarios are directional and intentionally omit invented equity values, probabilities, and returns; public peers
      are context rather than directly comparable valuation anchors.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
