      - number: '5.3'
        title: Deployments, roadmap, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Evidence now extends beyond laboratory demonstrations. DARPA describes Stage C as a government
              verification and validation phase for whether a utility-scale concept can be constructed and operated as
              intended, while a current company-issued release says Atom advanced to that final stage with Microsoft
              algorithmic and error-correction support. Accura's case page says Magne construction was expected to begin
              in autumn 2025, with initial operations projected for late 2026 or early 2027. These milestones create a
              credible deployment pathway but also expose dependencies: Microsoft software, optical and vacuum
              engineering, government validation, site readiness, and the ability to turn a planned system into stable
              user throughput. The roadmap's ambitious order-of-magnitude scaling is a company projection, not a
              verified delivery schedule.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE013
      - number: '5.4'
        title: Differentiation, trust, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              Neutral atoms offer a differentiated route to large arrays, connectivity, and long-lived quantum states,
              but differentiation is not the same as commercial defensibility. The company points to optical
              engineering, control electronics, software, and error correction as an integrated system advantage.
              Independent analysis is more cautious: BCG says quantum computing has not yet shown tangible advantage
              over classical computing in commercial or scientific applications, and ORF emphasizes that practical
              applicability and error correction remain major obstacles. DARPA's own framing is similarly
              non-promotional: it states that multiple, one, or no participants may ultimately demonstrate utility-scale
              operation by 2033. Atom therefore has unusually strong technical and institutional validation, but the
              investment case still requires evidence on repeatability, fidelity at system scale, security controls,
              support burden, and useful workloads.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product judgment
            body: >-
              Atom's product is technically differentiated and increasingly deployable, but its commercial maturity is
              best described as early productionization rather than proven scaled utility.
            calloutType: insight
            claimRefs:
              - CE005
              - CE009
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >
              Atom's customer model is centered on organizations that can fund, host, and operate specialized quantum
              hardware rather than on a broad self-serve software audience. The company's own materials describe
              on-premises deployment and collaboration with application developers, while third-party coverage
              identifies government R&D, research institutions, enterprise application partners, and sovereign quantum
              programs as the relevant demand pools. The buyer, user, and payer are not necessarily the same: a
              government or research sponsor can fund a system, a technical team can operate it, and application teams
              can consume logical-qubit capability. That distinction matters because a named relationship or partnership
              does not by itself establish recurring revenue, production utilization, or a high-volume commercial
              funnel.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
      - number: '6.2'
        title: Adoption and named deployments
        blocks:
          - type: paragraph
            body: >
              The strongest public adoption evidence is a first commercial on-premises system sale to QuNorth, with
              Microsoft supplying a software and error-correction layer in the Magne project. The assigned sources also
              describe installation activity, DARPA benchmarking, and a Department of Commerce letter of intent, but
              those signals have different commercial meanings. A government program or LOI is demand validation and
              potential funding, not the same as a paid customer contract; a partner collaboration is not the same as
              independent product adoption. Atom's own customer-facing materials say AC1000 is commercially available
              for on-premises deployment, while independent coverage frames current revenue as largely project-based and
              highlights the lack of a second on-premises sale as a concentration issue.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
