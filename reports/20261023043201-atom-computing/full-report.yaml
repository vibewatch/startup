  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate decision is research-more, with medium confidence in that decision, a high risk rating,
              and an unknown valuation stance. Atom-issued material says the company has secured more than $300 million
              in total funding, including a $100 million Series C and a $100 million Commerce letter of intent; an
              independent recap reports the same components (CV001). The government source is narrower: it describes
              Atom's $100 million as planned funding and says the government will receive a minority, non-controlling
              equity stake, so the amount is neither proof of cash received nor a conventional valuation mark (CV002).
              Atom also reports advancement to DARPA QBI Stage C, where an independent verification team is to test
              whether the utility-scale concept can be built and operated as designed (CV003). These signals improve
              financing access and technical credibility, but they do not supply the current price, fully diluted
              capitalization, revenue, margin, backlog, cash runway, or preference stack needed to calculate an entry
              return (CV013). Entry discipline should therefore be conditional: obtain executed terms and operating
              evidence before assigning a numeric value or target return (CV014, CV016).
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on a credible sequence from technical scale to external evaluation and a first deployment
              path. Atom's whitepaper describes a second-generation system with more than 1,200 physical qubits and
              logical-qubit demonstrations, while the company says it made a first commercial logical-qubit system sale
              to QuNorth and works with Microsoft on software and error-correction support (CV004, CV005). The
              anti-thesis is that public proof remains milestone-led rather than economics-led. An independent review
              calls Magne an important commercial proof point but not full commercial proof, highlighting absent uptime,
              calibration, usage, and repeatability metrics (CV007). ResearchAndMarkets also identifies coherence, gate
              speed, atom loss, and quantum non-demolition measurement as unresolved neutral-atom challenges (CV006).
              The investable question is thus no longer only whether the science can progress; it is whether Atom can
              ship, operate, and repeat deployments with measurable customer value and margins. Verified workload
              performance, contract economics, and deployment reliability would strengthen the thesis; delays,
              services-heavy delivery, or weak utilization would strengthen the anti-thesis.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              Public quantum markets show strong demand but do not create a clean valuation bridge to Atom. Crunchbase
              reported $1.2 billion of 2026 startup funding through its measurement date versus $4.1 billion in 2025,
              while four prominent public pure plays were collectively worth about $36 billion despite limited profits
              (CV008, CV009). Quantinuum then raised $1.68 billion in its IPO, and Reuters separately reported that its
              upsized offering had targeted a valuation of up to $14.3 billion (CV010, CV011). These are sector
              sentiment and price-discovery signals, not interchangeable Atom comparables: Quantinuum has a different
              modality, operating history, disclosure level, ownership structure, and commercial scale. S&P Global's
              cited 2025 revenue figures for IonQ, D-Wave, and Rigetti further show that public peer values sit against
              small but disclosed revenue bases, whereas Atom's assigned evidence supplies no comparable denominator
              (CV012, CV013). Bull, base, and bear cases can therefore be framed as milestone paths, but a numeric
              equity range or probability-weighted return would be false precision (CV015).
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              The sector has a live IPO window and strategic acquisition activity, but Atom's own exit readiness cannot
              be inferred from sector liquidity alone. A credible hold and exit plan requires an executed capitalization
              table, investor rights, audited financials, customer contracts, revenue-recognition policy, deployment
              acceptance criteria, and a forecast tied to workload-level product metrics (CV010, CV011, CV013, CV016).
              The immediate thesis-break triggers are failure to convert planned public support into executed funding,
              material slippage in verified utility-scale milestones, inability to demonstrate repeatable customer
              operation, or a financing whose preferences and dilution overwhelm common-equity returns. Conversely,
              signed customer acceptance, externally validated performance, a second repeatable deployment, and a
              gross-margin bridge would move the view toward an underwritable opportunity. Until then, neither a target
              multiple nor a target holding period is supportable from the assigned public evidence.
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Atom may be a credible technical option, but no entry is underwritable until current price,
              capitalization, preferences, and operating economics are verified.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
              - CV016
          - type: callout
            title: Funding is not liquidity
            body: >-
              Cumulative funding, a letter of intent, planned government support, and current cash available are
              different quantities and must be reconciled.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
