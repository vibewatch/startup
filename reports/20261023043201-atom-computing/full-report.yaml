chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Atom Computing describes its business as building highly scalable, gate-based quantum computers from
              arrays of optically trapped neutral atoms. Its company materials position these as on-premises systems for
              companies and researchers, combining lasers, optical systems, control electronics, and proprietary
              software in pursuit of fault tolerance. A 2025 company whitepaper and an independent profile both identify
              2018 as the founding year and Ben Bloom and Jonathan King as co-founders. The assigned sources place the
              company in Berkeley, California, and Boulder, Colorado, but do not resolve a single formal current
              headquarters: the whitepaper prints a Berkeley address, independent profiles describe both locations, and
              current press releases use a Boulder dateline. The operating footprint should therefore be recorded as
              Berkeley and Boulder pending corporate-record confirmation rather than reduced to an unsupported
              single-city answer.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO009
              - CO010
              - CO011
              - CO012
              - CO016
      - number: '1.2'
        title: Leadership, governance, and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              The current company leadership page identifies Ben Bloom as founder and CEO and Jonathan King as chief
              scientist and co-founder. It also lists product, programs, finance, optical-engineering, and
              software/control executives, while the board shown publicly comprises Bloom, Innovation Endeavors managing
              partner Dror Berman, Third Point Ventures partner Curtis McKee, and former U.S. Navy Secretary Ken
              Braithwaite. Kevin Messerle's August 31, 2026 appointment as CFO adds scaling and public-market
              preparation experience, but no assigned source discloses voting control, board committee structure,
              founder ownership, succession plans, or retention arrangements. The concentration of the founding and
              technical narrative around Bloom and King creates a material key-person diligence question even though the
              visible executive roster spans the main functional disciplines.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
