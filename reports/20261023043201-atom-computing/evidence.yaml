evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Executed Series C and Commerce Department documents, including ownership, preference, closing, and disbursement
      terms.
    whyItMatters: Equity raised, a non-binding LOI, potential program funding, and cash available are different measures.
    diligencePath: Obtain the cap table, definitive agreements, closing notices, and bank evidence under NDA.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: Audited revenue, ARR, gross margin, backlog, cash burn, customer count, headcount, and current valuation.
    whyItMatters: >-
      Technical and funding milestones do not establish commercial quality, operating scale, runway, or valuation
      support.
    diligencePath: >-
      Request audited financial statements, payroll data, bookings, backlog aging, customer contracts, and the latest
      priced-round documents.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: locations
    missingEvidence: A corporate record identifying Atom Computing's formal current headquarters.
    whyItMatters: Assigned sources support Berkeley and Boulder operations but use inconsistent headquarters language.
    diligencePath: Confirm headquarters and legal domicile from current corporate filings.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Voting control, board rights, committees, founder ownership, retention, and succession arrangements.
    whyItMatters: >-
      The visible leadership roster cannot establish decision rights or mitigate founder and technical key-person
      dependence.
    diligencePath: >-
      Review the charter, bylaws, voting agreements, board minutes, option plan, employment agreements, and succession
      plan under NDA.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: commercialization
    missingEvidence: Independent QuNorth acceptance evidence, purchase economics, uptime, and a second named paid deployment.
    whyItMatters: A sale announcement does not prove delivered performance, recognized revenue, or repeatable demand.
    diligencePath: >-
      Review the purchase order, acceptance certificate, deployment status, service obligations, and customer reference
      rights.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: atom-serviceable-market
    missingEvidence: >-
      Public evidence isolating Atom's obtainable system, software, and services market by geography, customer segment,
      and deployment model.
    whyItMatters: Global quantum-market totals include categories and downstream benefits that may not convert into Atom revenue.
    diligencePath: >-
      Request a bottoms-up pipeline and segmentation schedule showing qualified accounts, deployment assumptions,
      contract values, and conversion timing.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: willingness-to-pay
    missingEvidence: Customer-level pricing, annual support economics, backlog, and repeat-purchase evidence for Atom systems.
    whyItMatters: >-
      Public announcements establish capability and ecosystem interest but do not establish recurring revenue, gross
      margin, or durable willingness to pay.
    diligencePath: >-
      Obtain executed customer contracts, pricing schedules, backlog aging, renewal terms, and revenue-recognition
      policy under confidentiality.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: minor
    topic: market-size-estimates
    missingEvidence: Comparable definitions and methodology bridges for the 2025 and 2028 global quantum-computing market estimates.
    whyItMatters: The published estimates are directionally similar but cannot be safely averaged or used as one TAM.
    diligencePath: >-
      Reconcile included components, geographies, currencies, and forecast bases with each publisher before using a
      single planning case.
    relatedQuestionRefs:
      - QM010
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Executed customer contracts, order forms, pricing schedules, support obligations, discounts, and partner
      revenue-sharing terms.
    whyItMatters: Without contract economics, competitive pricing, switching cost, and margin durability cannot be underwritten.
    diligencePath: >-
      Request the QuNorth contract, Microsoft commercial agreement, deployment acceptance milestones, and two comparable
      customer proposals.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: >-
      Independent workload-level benchmarks with common error, runtime, availability, and cost denominators across
      modalities.
    whyItMatters: Headline qubit and component metrics do not establish buyer-relevant performance or a durable technical lead.
    diligencePath: >-
      Obtain DARPA validation outputs and reproducible third-party benchmark results using the same workloads and
      denominators.
    relatedQuestionRefs:
      - QP003
      - QP007
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: landscape-coverage
    missingEvidence: Primary profiles for other major neutral-atom, ion-trap, superconducting, and photonic vendors.
    whyItMatters: The allocated pool supports representative modalities but not an exhaustive competitor census.
    diligencePath: Run a dedicated peer-by-peer source pass in a future report allocation and preserve each vendor's metric basis.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: pricing
    missingEvidence: >-
      Signed QuNorth and other customer contracts with price, milestones, acceptance, and revenue-share terms are
      unavailable.
    whyItMatters: >-
      Without contract economics, reported financing and deployment milestones cannot be converted into realized revenue
      or margin.
    diligencePath: Request executed contracts, order forms, acceptance schedules, and Microsoft commercial terms.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Cash, burn, debt, runway, and restrictions on announced financing are unavailable.
    whyItMatters: >-
      Funding raised and conditional commitments do not show whether the company can finance planned hardware
      generations.
    diligencePath: Request audited statements, latest balance sheet, monthly cash forecast, debt schedule, and financing conditions.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
      - TI004
  - type: enumeration-incomplete
    severity: material
    topic: recurring-revenue
    missingEvidence: >-
      Backlog, installed-base count, maintenance attach rate, renewals, and recurring revenue mix are not publicly
      enumerated.
    whyItMatters: The transition from project sales to durable recurring revenue is central to valuation and capital planning.
    diligencePath: Request backlog aging, customer cohort data, support contracts, renewal history, and ARR reconciliation.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: gross-margin
    missingEvidence: >-
      No public system-level BOM, labor, warranty, utilization, or gross-margin history was retained in the assigned
      pool.
    whyItMatters: Quantum hardware and field service can remain cash intensive even after a commercial sale.
    diligencePath: Obtain product-cost history, manufacturing yield, installation hours, warranty reserves, and gross-margin bridge.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI002
      - TI004
  - type: missing-source
    severity: material
    topic: maturity
    missingEvidence: >-
      Independent system-level benchmarks showing fidelity, uptime, logical error rates, and repeatability on delivered
      hardware.
    whyItMatters: Physical-qubit counts and demonstrations do not establish reliable, economically useful customer workloads.
    diligencePath: >-
      Request acceptance-test reports, benchmark traces, uptime history, and independent replication rights for each
      delivered system.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Executed Magne and QuNorth commercial terms, delivery acceptance criteria, pricing, utilization, and customer
      outcome data.
    whyItMatters: A planned or installed machine is not proof of recurring revenue, production use, or customer ROI.
    diligencePath: >-
      Obtain the signed contract, milestone schedule, usage reports, service levels, and first-user references under
      NDA.
    relatedQuestionRefs:
      - QE001
      - QE005
  - type: missing-source
    severity: material
    topic: trust
    missingEvidence: Public security, privacy, safety, compliance, and incident-control documentation for on-premises deployments.
    whyItMatters: Government and enterprise deployment depends on operational controls beyond qubit performance.
    diligencePath: >-
      Request security architecture, incident history, certifications, vulnerability process, and site acceptance
      checklist.
    relatedQuestionRefs:
      - QE007
  - type: stale
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A current public developer surface such as API documentation, release history, package activity, or user forum
      evidence.
    whyItMatters: >-
      Technical maturity is easier to underwrite when external developers can observe and reproduce the software
      interface.
    diligencePath: >-
      Request current API, SDK, release, support, and developer-adoption metrics, or document why they cannot be
      disclosed.
    relatedQuestionRefs:
      - QE001
      - QE004
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, renewal, cohort, contract-length, and satisfaction data by customer segment.
    whyItMatters: >-
      Without retention and renewal evidence, the public record cannot distinguish a durable installed-base business
      from one-off project revenue.
    diligencePath: >-
      Request a customer cohort schedule, renewal history, support attach rates, and anonymized contract terms from
      management.
    relatedQuestionRefs:
      - QU006
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Customer-level revenue, backlog, order status, and the share attributable to QuNorth, Microsoft, DARPA, and other
      counterparties.
    whyItMatters: A first named sale and government programs can mask concentration and procurement dependence.
    diligencePath: Obtain an anonymized top-customer and backlog report reconciled to signed orders and recognized revenue.
    relatedQuestionRefs:
      - QU007
      - QU010
  - type: enumeration-incomplete
    severity: material
    topic: named-deployment
    missingEvidence: A complete list of paid systems, pilots, installations, and active application customers.
    whyItMatters: The named proof table is partial and cannot establish the breadth of adoption from public sources alone.
    diligencePath: >-
      Request a customer reference list with production/pilot status, deployment date, use case, and reference
      permission.
    relatedQuestionRefs:
      - QU002
      - QU004
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: minor
    topic: adoption-trajectory
    missingEvidence: Reconciled customer and deployment dates across company releases, partner announcements, and independent coverage.
    whyItMatters: >-
      Installation, commercial sale, and commissioning are different milestones and should not be treated as one
      adoption event.
    diligencePath: >-
      Reconcile purchase order, factory acceptance, delivery, installation, and commissioning dates for each named
      system.
    relatedQuestionRefs:
      - QU003
      - QU005
  - type: missing-source
    severity: material
    topic: partner dependency
    missingEvidence: >-
      Executed Microsoft and QuNorth agreements, contract value, revenue-recognition timing, and termination or
      acceptance terms.
    whyItMatters: Partner-linked delivery and economics are central to assessing concentration, cash conversion, and schedule risk.
    diligencePath: Request signed contracts, milestone schedules, customer acceptance criteria, and revenue-recognition memos.
    relatedQuestionRefs:
      - QR004
      - QR007
  - type: missing-source
    severity: material
    topic: commercial execution
    missingEvidence: A complete list of paid deployments, backlog, gross margin, cash burn, and recurring-revenue mix.
