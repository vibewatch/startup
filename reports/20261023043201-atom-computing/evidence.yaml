    diligencePath: Commission counsel and security review with incident registers, certifications, and insurance claims history.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: valuation
    missingEvidence: >-
      Executed latest-round documents, fully diluted capitalization, investor rights, liquidation preferences, and
      current cash balance.
    whyItMatters: >-
      Without price, ownership, and preference data, neither a current equity value nor common-equity downside can be
      calculated.
    diligencePath: >-
      Review the signed financing package and capitalization table under NDA, then model dilution, preferences, and cash
      runway.
    relatedQuestionRefs:
      - QV001
      - QV008
      - QV009
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Customer contracts, revenue-recognition schedules, system acceptance, uptime, utilization, backlog, services
      burden, and gross margin.
    whyItMatters: >-
      Named deployments do not by themselves establish repeatable revenue, customer value, or scalable delivery
      economics.
    diligencePath: >-
      Obtain QuNorth and other contract extracts, deployment logs, acceptance records, backlog detail, and a
      unit-economics bridge.
    relatedQuestionRefs:
      - QV005
      - QV006
      - QV009
  - type: missing-source
    severity: material
    topic: technical-validation
    missingEvidence: >-
      Independent workload-level benchmarks covering logical error rates, time to solution, repeatability, and operating
      burden.
    whyItMatters: >-
      Company-reported qubit and error-correction milestones cannot alone establish a durable premium to other
      modalities.
    diligencePath: >-
      Commission independent technical review of raw benchmark data and observe a customer workload on an installed
      system.
    relatedQuestionRefs:
      - QV003
      - QV005
      - QV007
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciliation of cumulative equity funding, planned government incentives, award conditions, recognized
      proceeds, and cash available.
    whyItMatters: Funding raised, planned support, and liquidity are different quantities with different valuation implications.
    diligencePath: >-
      Tie every announced amount to executed documents, milestone conditions, accounting treatment, and bank-confirmed
      cash.
    relatedQuestionRefs:
      - QV002
      - QV010
