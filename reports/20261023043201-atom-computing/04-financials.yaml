company:
  name: Atom Computing
chapter:
  number: 4
  title: Financials
  summary: Atom Computing has moved from grant- and R&D-led work toward milestone-based quantum-system sales, but public evidence remains too thin to underwrite recurring revenue, margins, cash runway, or realized contract economics. The strongest current signal is commercial traction through QuNorth and substantial financing commitments; the central blocker is the absence of audited financial disclosure and contract-level economics.
sections:
  - id: revenue-model
    title: Revenue model and commercial conversion
    body: >-
      Atom's public materials describe an on-premises hardware business whose economic conversion runs from scientific and engineering work to installed quantum systems. The first named commercial sale was to QuNorth in 2025, while public descriptions also place Microsoft in the software and error-correction layer. This supports a system-sale and integration model rather than a demonstrated subscription model. The available evidence does not disclose Atom's contract value, payment schedule, revenue share with Microsoft, acceptance terms, or realized gross margin, so the commercial milestone should not be treated as recurring revenue or ARR. Sacra's independent estimate is useful as a scenario input, not audited fact: it places 2025 revenue at $8.8M and says recognition for Magne is milestone-based, with most hardware construction and integration revenue expected in 2026.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: pricing-and-unit-economics
    title: Pricing, cost structure, and unit economics
    body: >-
      No public list price for AC1000 or realized QuNorth pricing was found in the assigned evidence. The available business-model description indicates that payments can be tied to order signing, engineering, factory acceptance, delivery, installation, and system acceptance, with maintenance, support, upgrades, and training as possible additional streams. That structure creates a long working-capital cycle and makes revenue timing sensitive to engineering completion and customer acceptance. Costs are structurally demanding: precision lasers and optics, ultra-high-vacuum equipment, custom electronics, prototype systems, highly specialized talent, and field installation all precede volume economics. The evidence supports a capital- and talent-intensive model, but not a reliable CAC, payback, gross-margin, utilization, or recurring-support estimate.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      Atom has public financing momentum but not public liquidity visibility. The assigned evidence reports a $100M Series C and a separate $100M Department of Commerce letter of intent, taking announced cumulative financing above $300M; the letter of intent is not the same as cash received. The company also has a potential government-funded demand channel through DARPA's QBI, but the cited Stage C release describes potential funding of up to $300M rather than a guaranteed award or unrestricted corporate cash. Neither cash on hand, burn rate, debt, covenant package, nor runway is disclosed. Accordingly, the underwriting question is not whether Atom has raised capital, but how much of the announced capital is contracted, available, restricted, or already committed to deployment.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      Financial quality is improving from laboratory work toward commercial systems, but disclosure remains insufficient for a conventional growth-company underwriting. The positive case is a credible first system sale, government and research demand, a large financing base, and a potential installed-base revenue stream. The negative case is concentration in an early flagship deployment, milestone-based recognition, unproven manufacturing and service margins, dependence on additional financing for multiple hardware generations, and no public evidence of cash runway or debt obligations. Sacra's estimate of approximately $27M FY2026 revenue and ARR below $3M is explicitly an estimate, not company-reported guidance; it should be stress-tested against the contract, acceptance schedule, and customer concentration. A financing decision should remain conditional on audited statements, a current cap table and preference stack, signed contract economics, backlog, and system-level cost data.
    claimRefs: [CI013, CI014, CI015, CI016]
    tableRefs: [TI004]
