      - [Hardware upgrades, "Expansion or next-generation system work", "Possible future stream", "Roadmap opportunity rather than current disclosed revenue", "Obtain upgrade backlog and customer budget evidence"]
    notes: "Sources combine official company descriptions and Sacra's independent estimates; null or undisclosed values are not zero and do not establish ARR."
    claimRefs: [CI001, CI002, CI003, CI004, CI013]
  - id: TI002
    title: Pricing and unit-economics evidence
    columns: [Metric, Value or status, Confidence, Why it matters, Diligence ask]
    rows:
      - [AC1000 list price, null, low, "No public price supports realized-revenue inference", "Obtain price book and recent quoted prices"]
      - [QuNorth contract value, null, low, "Headline QuNorth funding is not Atom revenue", "Obtain Atom purchase order and payment schedule"]
      - [Revenue recognition, "Milestone-based estimate for Magne", medium, "Timing affects reported revenue and working capital", "Review accounting memo and acceptance triggers"]
      - [Gross margin, null, low, "Manufacturing and field-service economics are unproven", "Obtain system-level BOM, labor, warranty, and service costs"]
      - [CAC and payback, null, low, "Long enterprise and government cycles may consume cash", "Provide funnel, sales expense, cycle length, and cohort data"]
      - [Recurring revenue mix, "Not disclosed; Sacra estimates ARR below $3M", medium, "Separates instrument sales from durable software/support revenue", "Reconcile contracts, renewals, and support invoices"]
      - [Customer concentration, "QuNorth is the first named commercial sale", medium, "A single flagship deployment increases execution sensitivity", "Provide backlog and second-customer evidence"]
      - [Working-capital cycle, "Order, engineering, acceptance, delivery, and installation stages", medium, "Milestones may require cash before final collection", "Provide deposits, payment terms, and receivables aging"]
    notes: "Public sources do not provide a complete unit-economics dataset; unavailable metrics remain null pending company diligence."
    claimRefs: [CI005, CI006, CI007, CI008, CI014]
  - id: TI003
    title: Capital adequacy signals
    columns: [Signal, Amount or status, Classification, Underwriting implication, Diligence ask]
    rows:
      - [Series C, "$100M", "Company/industry-reported financing", "Adds development capacity but does not disclose remaining cash", "Obtain closing documents and use-of-proceeds schedule"]
      - [Department of Commerce LOI, "$100M", "Letter of intent, not cash available", "Potential funding is conditional", "Confirm definitive award and draw conditions"]
      - [Cumulative announced financing, "More than $300M", "Includes the LOI according to sources", "Funding raised is not the same as cash available", "Reconcile historical proceeds, dilution, and restricted funds"]
      - [DARPA QBI Stage C potential, "Up to $300M", "Potential program funding", "Demand and funding opportunity, not guaranteed liquidity", "Obtain award scope, cost share, and payment schedule"]
      - [Cash on hand, null, "Not publicly disclosed", "Cannot calculate runway", "Request latest balance sheet and cash forecast"]
      - [Burn rate, null, "Not publicly disclosed", "Cannot assess financing dependency", "Request monthly operating and capex burn"]
      - [Debt and project finance, null, "Not publicly disclosed", "Unknown fixed claims and covenants", "Request debt schedule, liens, guarantees, and covenants"]
      - [Next-round trigger, null, "Not publicly disclosed", "Unknown financing timing risk", "Request base/downside financing plan tied to milestones"]
    notes: "Financing amounts preserve source qualifications: the Department of Commerce item is an LOI and DARPA language is potential funding; neither is treated as unrestricted cash."
    claimRefs: [CI009, CI010, CI011, CI012, CI015]
  - id: TI004
    title: Financial verdict and required underwriting package
    columns: [Area, Positive evidence, Limitation, Decision implication, Required evidence]
    rows:
      - [Commercial traction, "First named QuNorth on-premises sale", "Single named deployment and undisclosed economics", "Promising but not diversified", "Signed contract and second-customer pipeline"]
      - [Revenue scale, "Sacra estimates $8.8M in 2025 and about $27M in FY2026", "Independent estimates, not audited results", "Use as scenario inputs only", "Audited statements and revenue bridge"]
      - [Revenue quality, "Potential maintenance and support stream", "Nearly all current revenue estimated as project-based", "ARR thesis remains unproven", "Recurring contract and renewal data"]
      - [Margin path, "Atom argues neutral atoms can be capital-efficient", "Commercial manufacturing economics unproven", "Do not underwrite target margins", "BOM, labor, warranty, and service-cost history"]
      - [Capital access, "Series C and announced public-sector commitments", "Cash availability and conditions unknown", "Positive financing signal with liquidity gap", "Cap table, closing proof, restrictions, and cash forecast"]
      - [Execution risk, "Magne has a target early-2027 commissioning", "Delay or underperformance could impair follow-on sales", "Model milestone and concentration downside", "Acceptance plan, uptime targets, and delay remedies"]
      - [Disclosure, "Public product and financing announcements exist", "No audited financials or full operating KPIs in pool", "Confidence remains medium", "Management financial package and audit status"]
      - [Financing dependency, "Multiple generations and deployments are planned", "Runway and next-round trigger unavailable", "Potential future dilution or liquidity risk", "18-24 month base/downside financing plan"]
    notes: "This table is an analytical synthesis of disclosed facts and explicit gaps; it does not convert estimates into company-reported figures."
    claimRefs: [CI013, CI014, CI015, CI016]
figures:
  - id: FI001
    title: From financing commitments to commercial revenue
    type: flow
    summary: Public evidence supports a staged path from financing and government programs through system construction to potential installed-base revenue, but several economic links remain unquantified.
    data:
      nodes:
        - id: financing
          label: "Equity and public-sector commitments"
          detail: "$100M Series C plus $100M Commerce LOI; cumulative announced financing above $300M"
        - id: development
          label: "Quantum-system development"
          detail: "Engineering, error correction, hardware, and specialized talent"
        - id: delivery
          label: "Milestone-based system delivery"
          detail: "QuNorth/Magne first named commercial deployment; value and acceptance terms undisclosed"
        - id: installed-base
          label: "Potential support and upgrade revenue"
          detail: "Maintenance, upgrades, training, and software support are possible but unverified"
        - id: cash-visibility
          label: "Cash availability"
          detail: "Cash on hand, burn, debt, and runway are not disclosed"
        - id: underwriting
          label: "Underwriting decision"
          detail: "Requires audited statements and contract-level economics"
      edges:
        - from: financing
          to: development
        - from: development
          to: delivery
        - from: delivery
          to: installed-base
        - from: installed-base
          to: cash-visibility
        - from: cash-visibility
          to: underwriting
    claimRefs: [CI001, CI006, CI009, CI013]
callouts:
  - calloutType: strength
    title: Commercialization has crossed a meaningful threshold
    body: Atom has a named first commercial on-premises sale and a financing base large enough to support continued system development, although neither establishes repeatable economics.
    claimRefs: [CI001, CI009]
  - calloutType: risk
    title: Liquidity cannot be underwritten from announced commitments
    body: The public record does not show cash on hand, burn, debt, or the conditions attached to the Department of Commerce LOI and DARPA opportunity.
    claimRefs: [CI010, CI011, CI015]
  - calloutType: recommendation
    title: Require contract-level economics before pricing the business
    body: The next diligence step is a financial package tying signed orders to recognition, backlog, gross margin, working capital, and runway rather than relying on headline funding totals.
    claimRefs: [CI004, CI007, CI016]
acknowledgedWarnings:
  - dimension: tablesMax
    reason: "Four planned financial exhibits are intentionally retained because each covers a distinct underwriting surface: revenue, unit economics, capital adequacy, and the final verdict."
