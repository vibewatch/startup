companyProfile:
  summary: >-
    Atom Computing is a private neutral-atom quantum-computing company founded in 2018. Its public record combines more
    than 1,200 physical-qubit scale, logical-qubit and error-correction work, a first named commercial on-premises sale
    to QuNorth, Microsoft support, and staged government validation. The platform is technically differentiated, but
    public evidence does not establish current valuation, revenue quality, customer breadth, or repeatable production
    economics.
