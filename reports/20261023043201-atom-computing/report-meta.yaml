  topStrengths:
    - Neutral-atom scale and logical-qubit work provide a credible technical foundation.
    - The QuNorth sale is named commercial evidence beyond laboratory research.
    - Microsoft collaboration and DARPA Stage C provide external validation pathways.
  topRisks:
    - Current valuation, revenue, margin, backlog, cash runway, and financing preferences are not disclosed.
    - Commercial proof remains concentrated in one named deployment, with no verified second paid deployment.
    - Optical-control complexity, fidelity, delivery timing, and useful workload performance remain execution risks.
    - Government and strategic funding signals do not by themselves establish repeatable customer economics.
  unresolvedGaps:
    - Executed financing terms, investor roster, capitalization, and liquidation preferences.
    - QuNorth contract value, revenue recognition, and Microsoft revenue-sharing terms.
    - Evidence of a second named paid deployment and customer-level operating metrics.
    - Audited financials, backlog, gross margin, services burden, and recurring-revenue mix.
disclaimer: >-
  This report reflects public evidence reviewed through 2026-10-23. Atom remains private, so the recommendation is
