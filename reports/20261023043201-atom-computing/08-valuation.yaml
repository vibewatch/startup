        - id: economics
          label: "Revenue and margin evidence missing"
        - id: price
          label: "Current price and terms missing"
        - id: decision
          label: "Research-more"
    approximationNotes: "This is a qualitative decision sequence, not a conversion funnel, probability model, or valuation calculation."
    claimRefs: [CV002, CV003, CV005, CV007, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: "Atom may be a credible technical option, but no entry is underwritable until current price, capitalization, preferences, and operating economics are verified."
    claimRefs: [CV013, CV014, CV016]
  - calloutType: risk
    title: Funding is not liquidity
    body: "Cumulative funding, a letter of intent, planned government support, and current cash available are different quantities and must be reconciled."
    claimRefs: [CV001, CV002]
