company:
  name: Atom Computing
chapter:
  number: 7
  title: Risks
  summary: >-
    Atom Computing faces high residual execution and dependency risk: public evidence shows technical and government-program momentum, but planned funding, partner economics,
    commercial diversification, and incident coverage remain incomplete.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis-break conditions
    body: >-
      Atom Computing’s principal risk is execution against a technically ambitious and capital-intensive roadmap, not a confirmed adverse event in the assigned record. The company
      and third-party sources describe systems above 1,000 qubits, fault-tolerant objectives, and government-program progress, but those milestones remain the bridge between
      research capability and durable commercial economics. The highest residual exposure is therefore failure to convert physical-qubit progress into independently verifiable
      logical-qubit performance, accepted customer systems, and repeatable revenue. A thesis break should be triggered by missed benchmark or commissioning milestones, material
      slippage in the Magne program, or a financing need before contracted commercial cash is visible. These triggers are monitorable, unlike a generic concern that quantum
      computing is difficult.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR006
      - CR013
      - CR014
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: legal-regulatory
    title: Legal, regulatory, and government-program exposure
    body: >-
      The assigned evidence does not establish a current lawsuit, enforcement action, license failure, privacy incident, safety event, or security breach involving Atom Computing.
      That absence is not evidence of absence: the pool is dominated by company materials and short source previews, so legal and compliance diligence remains open.
      Government-program dependence is more observable. Atom’s disclosures describe DARPA progression and a potential final-stage opportunity of up to $300 million, while funding
      coverage describes a planned or letter-of-intent Commerce Department amount. Those instruments should not be treated as received cash. Investors should obtain executed
      awards, performance conditions, matching obligations, clawbacks, export-control constraints, and termination rights before assigning value to them.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR011
      - CR012
    tableRefs:
      - TR001
  - id: operational-partner-financial
    title: Operational, partner, and financial-model risks
    body: >-
      The operating model has three linked dependencies: neutral-atom engineering must scale reliably; partner-linked programs must reach acceptance; and government and private
      capital must fund the interval before recurring commercial economics are demonstrated. Public materials identify Microsoft and QuNorth in connection with Magne and describe
      on-premises systems, but the assigned evidence does not disclose contract value, revenue-recognition timing, revenue sharing, backlog, gross margin, cash burn, or recurring
      revenue. That creates a high residual exposure to schedule, working-capital, and concentration risk. Mitigation maturity should be upgraded only after management provides
      system acceptance criteria, independent performance results, a customer deployment list separating pilots from paid production, and audited cash and revenue schedules.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
      - CR013
      - CR014
    tableRefs:
      - TR003
