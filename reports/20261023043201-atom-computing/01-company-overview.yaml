          tone: positive
          claimRefs: [CO004]
        - date: "2024"
          label: Logical-qubit demonstration
          details: Independent and company sources distinguish a 24-logical-qubit demonstration from later system targets.
          tone: positive
          claimRefs: [CO011]
        - date: "2025"
          label: First commercial sale
          details: Atom states that it sold an on-premises quantum computer to QuNorth.
          tone: positive
          claimRefs: [CO012]
        - date: "2026-05-21"
          label: Department of Commerce LOI
          details: Atom announced a $100 million letter of intent; an independent profile describes it as non-binding.
          tone: neutral
          claimRefs: [CO010]
        - date: "2026-08-31"
          label: CFO appointed
          details: Atom announced Kevin Messerle as chief financial officer.
          tone: positive
          claimRefs: [CO008]
        - date: "2026-10-07"
          label: DARPA Stage C selection
          details: Atom announced selection for the final stage of DARPA's Quantum Benchmarking Initiative, with potential funding up to $300 million.
          tone: positive
          claimRefs: [CO014]
    approximationNotes: >-
      Year-only dates are used where the assigned evidence does not support a precise
      day; potential program funding is not shown as cash received.
    claimRefs: [CO002, CO004, CO008, CO010, CO011, CO012, CO014]
callouts:
  - calloutType: strength
    title: Technical-commercial bridge
    body: >-
      A 1,200-plus-physical-qubit platform, logical-qubit demonstrations, a named
      commercial customer, and government-program participation together form a
      stronger record than a laboratory-only narrative.
    claimRefs: [CO001, CO011, CO012, CO014]
  - calloutType: risk
    title: Private-company opacity
    body: >-
      The assigned evidence does not establish current valuation, audited revenue,
      cash received from announced commitments, backlog, margin, customer count,
      headcount, or definitive financing terms.
    claimRefs: [CO009, CO010, CO016]
  - calloutType: recommendation
    title: Diligence posture
    body: >-
      Treat Atom as technically credible but economically under-disclosed until
      financing documents, customer economics, delivery evidence, and independently
      tested performance are available.
    claimRefs: [CO012, CO015, CO016]
