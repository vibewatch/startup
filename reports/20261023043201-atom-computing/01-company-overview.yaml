company:
  name: Atom Computing
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Atom Computing is a private neutral-atom quantum-hardware company developing
    gate-based systems for on-premises deployment. The assigned evidence supports
    meaningful technical and government-program milestones, while current valuation,
    audited economics, customer count, headcount, financing terms, and cash
    availability remain unverified.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Atom Computing describes its business as building highly scalable, gate-based
      quantum computers from arrays of optically trapped neutral atoms. Its company
      materials position these as on-premises systems for companies and researchers,
      combining lasers, optical systems, control electronics, and proprietary
      software in pursuit of fault tolerance. A 2025 company whitepaper and an
      independent profile both identify 2018 as the founding year and Ben Bloom and
      Jonathan King as co-founders. The assigned sources place the company in
      Berkeley, California, and Boulder, Colorado, but do not resolve a single formal
      current headquarters: the whitepaper prints a Berkeley address, independent
      profiles describe both locations, and current press releases use a Boulder
      dateline. The operating footprint should therefore be recorded as Berkeley and
      Boulder pending corporate-record confirmation rather than reduced to an
      unsupported single-city answer.
    claimRefs: [CO001, CO002, CO003, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      The current company leadership page identifies Ben Bloom as founder and CEO and
      Jonathan King as chief scientist and co-founder. It also lists product,
      programs, finance, optical-engineering, and software/control executives, while
      the board shown publicly comprises Bloom, Innovation Endeavors managing partner
      Dror Berman, Third Point Ventures partner Curtis McKee, and former U.S. Navy
      Secretary Ken Braithwaite. Kevin Messerle's August 31, 2026 appointment as CFO
      adds scaling and public-market preparation experience, but no assigned source
      discloses voting control, board committee structure, founder ownership,
      succession plans, or retention arrangements. The concentration of the founding
      and technical narrative around Bloom and King creates a material key-person
      diligence question even though the visible executive roster spans the main
      functional disciplines.
    claimRefs: [CO005, CO006, CO007, CO008, CO016]
    tableRefs: [TO002]
  - id: capital-milestones-and-disclosure
    title: Capital, milestones, and disclosure limits
    body: >-
      The financing record requires instrument-level qualification. Atom's archive
      records a $15 million Series A in July 2021 and a $60 million Series B in January
      2022. A later independent briefing says cumulative capital surpassed $300
      million, anchored by a $100 million Series C and a $100 million U.S. Department
      of Commerce letter of intent; another independent profile reports only $200
      million-plus of disclosed funding and calls the federal LOI non-binding. These
      totals are not directly comparable, and neither establishes cash available,
      definitive equity terms, or current valuation. Commercially, Atom reports a
      first on-premises sale to QuNorth in 2025, a June 2026 Nu Quantum memorandum of
      understanding, and October 2026 advancement to DARPA QBI Stage C, whose
      potential funding is not an awarded cash balance. IEEE independently describes
      Magne as a planned 50-logical-qubit system but also reports that neutral-atom
      operations are materially slower than superconducting operations. The milestone
      sequence is credible evidence of progress, not a substitute for audited revenue,
      backlog, margins, customer count, headcount, or delivery acceptance.
    claimRefs:
      [CO004, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
