  evidenceGaps:
  - type: missing-source
    severity: material
    topic: tr001-regulatory-register-coverage
    missingEvidence: No retained public source provides a complete project-by-project permit and power-allocation register across every DayOne campus for TR001.
    whyItMatters: The legal register can identify the main gating regimes, but it cannot confirm exact status of every permit, allocation, and condition precedent.
    diligencePath: Request site-by-site approval trackers, power-allocation letters, environmental permits, and key conditions precedent for Singapore, Malaysia, Thailand, and Finland.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR011
    - QR030
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: customer-concentration-disclosure
    missingEvidence: No retained public source discloses DayOne’s top-customer share of revenue, booked MW, or billable MW.
    whyItMatters: A hyperscale-led model can look strong in aggregate while still being economically fragile if one or two tenants dominate the backlog.
    diligencePath: Request top-10 customer exposure by booked MW, billable MW, revenue, and campus concentration, plus cancellation or downsizing rights.
    relatedQuestionRefs:
    - QR015
    - QR026
    - QR030
  - type: missing-source
    severity: material
    topic: project-level-debt-covenants
    missingEvidence: Public sources do not provide DayOne’s full debt-maturity ladder, asset-level covenants, or refinancing triggers outside the headlines disclosed for Finland.
    whyItMatters: As net debt scales, covenant and maturity structure become as important as the headline financing amount.
    diligencePath: Request debt schedule, covenant package, permitted baskets, collateral map, and downside liquidity plan.
    relatedQuestionRefs:
    - QR016
    - QR017
    - QR023
    - QR030
  - type: missing-source
    severity: important
    topic: audited-platform-sustainability-metrics
    missingEvidence: The public file contains sustainability ambition and project examples but not platform-wide audited PUE, WUE, emissions, or supplier-audit outcomes.
    whyItMatters: Without measured outcomes, investors cannot tell whether DayOne’s sustainability positioning will be sufficient for regulators and anchor customers over time.
    diligencePath: Request the inaugural sustainability-report draft, site-level baseline metrics, assurance scope, and year-over-year target bridge.
    relatedQuestionRefs:
    - QR020
    - QR021
    - QR028
    - QR029
  - type: missing-source
    severity: important
    topic: incident-and-outage-history
    missingEvidence: No retained public source gives a consolidated outage, incident, SLA, or safety-performance history for DayOne’s operating campuses.
    whyItMatters: Operational resilience cannot be fully underwritten from campus announcements and financing releases alone.
    diligencePath: Request outage log, SLA attainment, material incident history, and post-mortem governance for each operating campus.
    relatedQuestionRefs:
    - QR008
    - QR022
    - QR030
