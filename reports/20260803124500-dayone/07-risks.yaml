- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Singapore capacity gate
    - 21 Jalan Buroh power / approval milestones
    - Meaningful schedule slippage or loss of planned first-phase readiness beyond 2027
    - Re-underwrite Singapore contribution and SIJORI premium-capacity thesis.
  - - Malaysia utility dependence
    - TNB / CRESS execution and energization milestones
    - Power, tariff, or renewable-delivery setbacks that impair Johor ramp or customer commitments
    - Pause aggressive growth assumptions; raise execution discount and capex contingency.
  - - Thailand selectivity
    - BOI, water, and community approvals
    - Material approval delay or inability to satisfy efficiency / water conditions
    - Treat Thailand as optional rather than underwritten near-term capacity.
  - - Booked-to-billable conversion
    - Committed MW versus billable MW progression each quarter
    - Gap widens materially for multiple quarters without matching site explanations
    - Cut conversion assumptions and lower near-term revenue confidence.
  - - Net debt and financing headroom
    - Net debt, facility availability, and new financing conditions
    - Funding becomes materially more expensive or unavailable before backlog converts
    - Shift view from growth-financeable to capital-constrained.
  - - Customer concentration
    - Top-tenant exposure and move-in schedule once disclosed
    - One tenant or one corridor dominates revenue without hard contractual protection
    - Require concentration discount and stronger contractual diligence before investment.
  - - AI-chip policy shock
    - BIS or allied rule changes affecting overseas AI-chip deployment
    - Replacement rules or enforcement make customer deployment materially harder in core markets
    - Stress-test demand timing and cloud-tenant move-in assumptions.
  notes: These triggers define the conditions under which the DayOne thesis changes from a scale story with execution risk to a capacity story constrained by regulation, utilities, or capital.
