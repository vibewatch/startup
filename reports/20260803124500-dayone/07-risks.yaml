company:
  name: DayOne Data Centers
chapter:
  number: 7
  title: Risks
  summary: DayOne’s risk profile is dominated by capacity gating, utility dependence, and conversion risk rather than by weak demand. Singapore remains scarce and sustainability-regulated, Malaysia concentrates operational scale around TNB-backed power execution, Thailand adds a more selective permitting model, and Finland extends both financing and pre-lease risk. The customer thesis is credible, but it is mediated by hyperscaler capex cycles and still lacks concentration disclosure. Financially, the key watchpoint is whether committed MW converts into billable MW fast enough to justify rising leverage and continued capital-market dependence.
sections:
- id: regulatory-legal-risk
  title: Regulatory and legal gating is the most structural near-term risk
  body: >-
    The most important DayOne risk is not ordinary demand softness; it is whether premium-capacity markets stay available on acceptable regulatory terms. Singapore remains the anchor geography for the whole SIJORI thesis, but the public record shows that new supply there is still rationed. The 2023 pilot Data Centre-Call for Application awarded only about 80 MW across four operators, and the published criteria emphasized energy efficiency, decarbonisation, connectivity, and AI/HPC compute. DayOne’s own 21 Jalan Buroh acquisition explicitly says the project follows this award. That means one of DayOne’s most strategic sites is already inseparable from a government-managed capacity-allocation regime.


    Thailand adds a different form of policy risk. DayOne’s Chonburi project benefits from official support, but the latest legal commentary shows that Thai authorities are no longer treating data centers as simple tax-incentive projects. BOI-linked requirements now fold in PUE, redundancy, security, water planning, clean-energy logic, and workforce commitments. This makes compliance and permitting part of the capital plan, not a box-tick after site acquisition. Finland is less politically constrained than Singapore or Thailand, but it still introduces cross-border permitting, utility coordination, and tenant-timing risk while capital is already being committed.


    A final legal overlay comes from AI-chip export controls. DayOne is not itself a chip designer, yet its target tenants are precisely the hyperscalers and AI workloads most exposed to controlled semiconductors and compliance obligations. BIS rule volatility therefore matters indirectly but materially: if customers cannot procure or deploy the right chips, DayOne’s demand conversion can slow even when campuses are physically ready.
