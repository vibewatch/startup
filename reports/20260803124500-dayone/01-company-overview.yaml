company:
  name: DayOne Data Centers
chapter:
  number: 1
  title: Company Overview
  summary: 'DayOne Data Centers is a Singapore-headquartered hyperscale digital infrastructure platform that emerged from GDS International and now spans the SIJORI corridor plus Thailand, Japan, Hong Kong, and Finland. The strongest public evidence is around capital formation and physical expansion: official disclosures support a 2022 inception, 2025 deconsolidation from GDS, more than US$4.5 billion of Series C equity financing, and a footprint extending from Singapore and Johor to Finland. The key underwriting tension is that scale, funding, and market access are visible, while named customers, revenue, EBITDA, and definitive IPO documentation remain undisclosed.'
sections:
- id: identity-and-platform
  title: Identity, Platform, and Core Operating Logic
  body: 'DayOne presents itself as a Singapore-headquartered global digital infrastructure platform built for hyperscalers and large enterprises that need fast deployment, high-density capacity, and access to constrained or newly opened markets. Across its about, solutions, and markets pages, the company consistently frames its value proposition around speed, modular delivery, AI-ready technical design, and cross-border market creation rather than simple colocation resale. The core strategic frame is SIJORI: Singapore, Johor, and Batam are marketed as a coordinated hub-and-spoke corridor where Singapore contributes connectivity and ecosystem depth, Johor contributes power-and-land scale, and Batam contributes special-zone economics and expansion headroom.


    That framing matters because DayOne is not pitching itself as a single-country landlord. Its public materials describe a multi-market platform spanning Singapore, Johor, Batam, Greater Bangkok, Hong Kong, Tokyo, and Finland, with Spain added to the forward-looking market list in the June 2026 financing announcement. The official story is therefore one of deliberate market creation: use Singapore as the anchor gateway, expand into lower-cost adjacent capacity zones, and then export the model into other under-supplied geographies. External media coverage broadly corroborates the same footprint and the same thesis that DayOne is trying to win cloud and AI workloads by assembling regional campuses before demand fully arrives.


    The strongest identity facts are well supported. Official disclosures place headquarters in Singapore, describe DayOne as established in 2022, and repeatedly define the company as a next-generation hyperscale platform rather than a retail colocation provider. GDS adds an important historical bridge: its March 2025 results say DayOne was previously known as GDS International or GDSI and was deconsolidated after the Series B round closed in December 2024. That combination makes the chapter-one ground truth reasonably clear: DayOne is a post-spinout, Singapore-led hyperscale platform pursuing AI and cloud capacity growth through capital-intensive, multi-country campus development.'
