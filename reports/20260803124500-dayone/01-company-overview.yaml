  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, EBITDA, capex, and cash burn at the DayOne platform level remain undisclosed in public sources.
    whyItMatters: Valuation and financing resilience cannot be underwritten responsibly without seeing monetization, margins, and cash conversion.
    diligencePath: Request management financial statements, lender materials, and a project-by-project capex and returns schedule for 2024-2026.
    relatedQuestionRefs:
    - QO024
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named customers, tenant concentration, term lengths, and utilization by campus are not publicly disclosed.
    whyItMatters: Booked demand only supports valuation if it converts into durable, diversified revenue with acceptable counterparty concentration.
    diligencePath: Obtain the top-customer list, signed contract summary table, occupancy by campus, and any hyperscaler framework agreements.
    relatedQuestionRefs:
    - QO019
    - QO024
  - type: conflicting-data
    severity: material
    topic: valuation-range
    missingEvidence: A reconciled valuation bridge from the 2024-2026 private rounds to any planned IPO valuation is not public.
    whyItMatters: Public reporting moved from a US$4-5 billion fundraising mark to a US$20 billion IPO target in less than two years, creating headline-mark risk.
    diligencePath: Request cap table history, term sheets, dilution waterfalls, and any banker or board materials supporting the current valuation range.
    relatedQuestionRefs:
    - QO023
    - QO025
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: governance-pack
    missingEvidence: A full board roster, committee structure, and senior executive list are not available in the reviewed public materials.
    whyItMatters: Leadership concentration and governance quality matter when the company is scaling multiple gigawatt-class markets simultaneously.
    diligencePath: Request an organization chart, board list, committee charters, and biographies for finance, operations, legal, and technology leads.
    relatedQuestionRefs:
    - QO008
  - type: stale
    severity: minor
    topic: capacity-reconciliation
    missingEvidence: Public disclosures do not provide one audited bridge tying live MW, under-construction MW, booked MW, committed MW, and future-development MW together.
    whyItMatters: Without a unified bridge, investors can overcount pipeline scale or misunderstand what portion of demand is monetized versus merely reserved.
    diligencePath: Request a dated capacity waterfall by campus and development stage, signed off by finance and development teams.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO004
