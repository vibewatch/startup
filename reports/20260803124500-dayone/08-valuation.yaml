- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Dimension
  - Investment Thesis
  - Anti-Thesis
  - Evidence That Would Change the View
  rows:
  - - Demand backdrop
    - AI and cloud demand, plus Singapore scarcity, create real premium infrastructure value in Southeast Asia
    - A hot AI market can still overpay for assets whose monetization and disclosure lag the narrative
    - Show sustained revenue conversion and customer-quality disclosure that prove demand is monetizing, not just reserving MW
  - - Commercial proof
    - DayOne has real revenue, EBITDA, bookings, and multi-market development momentum
    - Committed MW still far exceeds billable MW, so investors are paying for future conversion more than current earnings
    - Show two to three quarters of strong billable growth and site-level move-in evidence
  - - Capital access
    - $4.5B final Series C close and layered financing show investors want exposure
    - Repeated fundraising and asset-level borrowing also signal ongoing external-capital dependence
    - Show a cleaner leverage path and clearer self-funding profile from operating cash flow
  - - Public comp premium
    - A premium to GDS/NEXTDC is defensible because DayOne has higher AI corridor exposure
    - A premium cannot be unlimited when public comps already provide disclosure, scale, and repeatable cash generation
    - Show enough standalone quality to justify moving closer to mature public-infra standards
  - - IPO timing
    - Dual-listing and bank-hiring are plausible signs of listing momentum
    - IPO-readiness remains mostly narrative until investors see standalone public-company materials
    - Show filed listing docs, audited statements, and governance package
  - - Exit upside
    - Bull case can still justify a mark near or above $20B if revenue scale steps up materially
    - If the story stays opaque, public buyers may insist on a much lower clearing price
    - Show near-$1B forward revenue path plus reduced key-risk intensity
  notes: The anti-thesis is not that DayOne lacks demand. It is that investors may be asked to pay public-market premium multiples before public-market proof is available.
