- id: public-comp-anchors-and-scenario-ranges
  title: Public comps justify a premium, but not necessarily the full indicated mark
  body: >-
    Public comp anchors matter because DayOne is marketing toward a public listing rather than another quiet private round. On equity value alone, DayOne at $20 billion would already stand at roughly 3.1x GDS and 2.8x NEXTDC, while still sitting well below Digital Realty and Equinix. That is not inherently absurd: DayOne is growing faster than mature REITs and is more exposed to AI and power-constrained Southeast Asian demand. But it is a reminder that the company would already be priced as a very substantial public platform despite a much shorter standalone track record.


    The macro backdrop is supportive. CBRE describes a record $11.6 billion of APAC data-centre investment in 2025 and says entity-level transactions reached $8.3 billion, while the IEA highlights an explosion in big-tech capex and electricity demand. Those forces justify a premium narrative. They do not, by themselves, eliminate the need for proof on customer quality, conversion, and financing discipline.


    My scenario ranges therefore split cleanly. The bear case clusters around $7–10 billion if investors decide DayOne is still more promise than listed-grade proof. The base case sits around $12–15 billion if conversion and corridor demand continue to validate the story. The bull case reaches roughly $18–22 billion, but only if DayOne closes the disclosure gap and shows revenue scale nearer $1 billion than today’s reported run rate.
