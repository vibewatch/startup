- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission to Thesis
  - Action Implication
  rows:
  - - Singapore timeline slips materially
    - Core Singapore project or capacity plan moves meaningfully right
    - Premium-market scarcity no longer converts into near-term monetization
    - Cut valuation range and raise execution discount
  - - Malaysia power or renewable setbacks
    - TNB, tariff, or energization issues impair Johor ramp
    - Largest growth engine becomes constrained, hitting conversion and sentiment
    - Re-underwrite to base/bear range immediately
  - - Booked-to-billable conversion weakens
    - Billable power fails to track commitments over multiple quarters
    - Revenue bridge from backlog to earnings breaks
    - Treat current IPO valuation as unsupported
  - - Customer concentration surprises
    - Top-tenant exposure is higher than public investors expect
    - Revenue durability and bargaining power worsen
    - Apply concentration discount or pass
  - - Funding window tightens
    - IPO or follow-on financing market closes or reprices infra risk
    - Capital-intensive growth model loses its easiest path to scale
    - Shift to downside protection and lower target entry
  - - IPO timetable drifts beyond 2027
    - Listing stays exploratory without audited public-company package
    - Narrative premium decays while risks remain open
    - Avoid underwriting the headline mark
  notes: These are the triggers most likely to move the investment call quickly from watchlist-worthy to avoid-at-price.
  claimRefs:
  - CV037
  - CV040
  - CV041
  - CV045
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Standalone audited statements
    - No public standalone DayOne income statement, balance sheet, or cash-flow package
    - Public-market pricing cannot rest comfortably on segment summaries alone
    - Request audited standalone statements for FY2024, FY2025, and the latest interim period
  - - Customer concentration schedule
    - No public top-customer share of revenue, booked MW, or billable MW
    - Hyperscale concentration can turn a premium story into a fragile one
    - Request top-10 customer exposure by site, revenue, booked MW, and billable MW
  - - Debt stack and covenants
    - Asset-level and platform-level covenant structure is not public
    - Equity value is highly sensitive to leverage and refinancing mechanics
    - Request debt maturity ladder, collateral map, and covenant package
  - - Cap table / preference stack
    - No public view of preferences, participating rights, or IPO overhang
    - Preference structure changes common-equity upside and downside materially
    - Request full cap table and liquidation-preference summary
  - - Power allocation and permitting milestones
    - No public site-level tracker for Singapore, Johor, Thailand, and Finland
    - Valuation depends on turning strategic land and commitments into live capacity
    - Request project-control dashboard with power, permit, and RFS milestones
  - - IPO-readiness package
    - No public filing, governance package, or board-readiness evidence in the reviewed materials
    - Without public-company readiness, the premium can fade before the listing clears
    - Request draft listing workstreams, governance materials, and reporting calendar
  notes: These asks are ordered by how directly they would change the valuation call at the current indicated price.
