- id: architecture-operating-model-and-dependencies
  title: Architecture, operating model, and critical dependencies
  body: 'Public DayOne materials reveal more engineering specificity than is typical for a private platform, even if many details remain undisclosed. The architecture begins with site and grid strategy. Finland is explicitly sold on renewable power, robust grid infrastructure, cool climate, waste-heat recovery, and zero-freshwater cooling. Tokyo is framed around power, land, and low-latency access to the Tokyo core. Hong Kong is described as a carrier-neutral, multi-cloud exchange hub. Thailand is designed around 180 MW of grid capacity, phased delivery, and advanced liquid cooling. Malaysia adds a separate layer of energy architecture through DayOne’s CRESS term sheet and broader TNB partnership, which tie renewable-energy contracting, grid planning, and fiber or green-lane processes directly into how campuses are built and operated.


    The company’s own messaging suggests a layered operating model: acquire or partner into strategic sites, secure utility access, deploy high-density cooling and power infrastructure, connect to regional cloud and carrier ecosystems, and then scale across adjacent markets through a hub-and-spoke approach. The PTC’25 interview is useful as a practitioner-community proxy because it makes the internal logic explicit: speed to market, customer-centric deployment, SIJORI market creation, and supply-chain optimization are part of the operating system. The stated 9-month book-to-build timeline in Malaysia is especially important because it turns a vague execution-advantage claim into a concrete speed signal.


    Dependencies are equally clear. DayOne relies on utilities such as TNB, regulators such as IMDA and industrial-estate or investment authorities, local partners such as Hyperco in Finland, and the existence of large cloud-region ecosystems documented by AWS, Google Cloud, Azure, and Oracle. DayOne’s service is therefore not just a building. It is an orchestration layer across energy, land, network, compliance, and customer deployment sequencing.'
