- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer/process/component
  - role
  - dependency
  - risk
  rows:
  - - Site and utility acquisition
    - Determine whether campuses can be built at viable scale
    - Grid access, land rights, industrial estates, regulators
    - Permitting or utility delays can prevent monetization.
  - - Power and energy architecture
    - Supply high-density compute reliably and sustainably
    - Utilities, renewable PPAs, CRESS or equivalent frameworks
    - Energy availability and pricing are core operating risks.
  - - Cooling and mechanical design
    - Support AI and cloud density while controlling water and energy use
    - Liquid cooling, climate conditions, brownfield retrofit feasibility
    - Public fleet-wide PUE and WUE performance is not disclosed.
  - - Network and cloud adjacency
    - Keep campuses relevant to hyperscaler and enterprise deployment patterns
    - Carrier ecosystems, subsea or cross-border routes, cloud regions
    - Thin interconnection in any site reduces attractiveness.
  - - Construction and prefabrication workflow
    - Convert bookings to live billable capacity quickly
    - Supply chain, contractors, engineering partners
    - Schedule slippage erodes competitive advantage.
  - - Sustainability and compliance overlay
    - Maintain eligibility in constrained markets and improve customer fit
    - LEED, ISO, SOC2 controls, renewable access, policy cooperation
    - Controls are public but incomplete at fleet level.
  notes: 'DayOne’s architecture is operational and infrastructural: engineering choices are inseparable from commercial viability.'
