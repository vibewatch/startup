- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - company solution
  - measurable benefit
  - limitation
  rows:
  - - Secure premium Singapore adjacency
    - Buy scarce Singapore or nearby corridor capacity
    - Singapore plus Johor/Batam corridor design
    - Combines premium market access with scalable adjacent capacity
    - Exact latency and cross-connect economics are not disclosed publicly.
  - - Launch high-density AI capacity quickly
    - Wait for local supply or build in-house
    - DayOne campuses with liquid cooling and fast-execution claims
    - Potentially faster deployment than customer self-build
    - 9-month speed claim is not independently audited across all projects.
  - - Meet European sustainability requirements
    - Search for cooler-climate renewable-powered campuses
    - Finland platform with renewable power and heat-reuse angle
    - Improves sustainability posture and energy economics
    - Need proof of actual operational performance after ramp.
  - - Extend multi-cloud regional architectures
    - Connect workloads to major cloud regions across markets
    - Carrier-neutral and multi-cloud hub sites plus corridor logic
    - Supports cloud-adjacent deployment patterns
    - Public interconnection maps remain thin for several campuses.
  - - Enter new Southeast Asian growth markets
    - Rely on a single-country build strategy
    - Multi-market platform spanning SIJORI, Hong Kong, Tokyo, Thailand, and Finland
    - Gives customers several location options under one operator
    - Cross-market service consistency and SLA uniformity are not publicly documented.
  notes: Benefits are directional and workflow-based because DayOne does not publish standardized performance or savings benchmarks across its full fleet.
