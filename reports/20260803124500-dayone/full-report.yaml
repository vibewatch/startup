      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and What They Mean for DayOne
        blocks:
          - type: paragraph
            body: >-
              The main drivers are clear and mutually reinforcing. AI and cloud capex are accelerating, APAC’s pipeline
              is expanding rapidly, and power-secure secondary markets are drawing disproportionate investor attention.
              Cushman measured the APAC development pipeline at 26,455 MW in H1 2026 with vacancy still edging down to
              10.3%, while CBRE said aggregate hyperscaler capex in 2026 should exceed US$400 billion globally. That
              backdrop helps explain why Johor, Batam, and Bangkok are being pulled into the next build cycle despite
              lacking Singapore’s incumbency. It also explains why DayOne is leaning into campuses that can offer
              high-density, AI-ready expansion rather than generic capacity.


              The constraints are equally important. Power availability is now the primary bottleneck in nearly every
              major market lens. Water intensity and cooling design are becoming more visible gating issues, especially
              in Singapore and Johor. Construction costs remain high or are rising, with Malaysia around US$8-10 million
              per MW and Indonesia around US$8-9 million per MW in Arizton’s 2026 market work. Malaysia’s July 2025
              tariff changes add another economic sensitivity for campuses above 100 MW, while CNA and MIDA both point
              to the need for stronger water and grid infrastructure in Johor if the state wants to absorb
              multi-gigawatt growth sustainably.


              For DayOne, the implication is strategic but disciplined expansion. The company is in the right corridor:
              the market is moving toward Singapore-adjacent, power-advantaged, AI-ready campuses. But it is also a
              market where valuation should reward execution against power, water, and permitting constraints rather
              than just headline demand. A developer that can secure power, move quickly under evolving policy, and keep
              customers close to cloud and subsea hubs can win large workloads. A developer that merely announces
              capacity in constrained or politically sensitive locations may not. Later chapters should therefore test
              DayOne’s customer proof, cost of power, contracted delivery schedules, and actual position within the
              corridor’s supply stack.
