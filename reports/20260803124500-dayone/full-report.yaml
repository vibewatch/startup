      - number: '7.4'
        title: Financial risk is mainly conversion, leverage, and continued capital dependence
        blocks:
          - type: paragraph
            body: >-
              DayOne’s financial risk profile is typical of a hyperscale buildout but already large enough to matter.
              The company has raised substantial equity and asset-level financing, yet the business still appears to be
              funding growth ahead of full revenue harvest. GDS’s DayOne disclosures show net debt climbing from US$63.1
              million in FY2024 to US$1.33 billion in FY2025 and US$1.41 billion in 1Q2026. At the same time, committed
              IT power rose from 430 MW to 1,526 MW while billable power rose from 121 MW to 474 MW. The gap is not
              necessarily a problem—build-to-demand platforms should have future committed load—but it does make
              energization and customer move-in the central bridge between growth narrative and realized economics.


              The public file also shows continuing dependence on financing markets. PR Newswire says DayOne may pursue
              further public or private market financing options even after the Series C close, while the Finland
              mezzanine demonstrates willingness to layer structured capital at the asset level. That is rational for a
              fast-scaling platform, but it means valuation and strategy remain exposed to funding conditions, not just
              to operating performance.


              For investors, the key discipline is monitoring rather than storytelling. The thesis can absorb noisy
              quarterly construction updates. It should not absorb Singapore slippage, Malaysian power setbacks, weak
              booked-to-billable conversion, or a closing of financing windows without a significant re-underwrite.
            claimRefs:
