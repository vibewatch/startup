      - number: '2.3'
        title: Buyers, Budget Owners, and the Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is broader than just cloud providers, but hyperscalers still set the tempo. CBRE and Cushman
              both describe hyperscaler and AI demand as the dominant force behind new APAC capacity, while CBRE’s 2026
              press release identifies neoclouds as a meaningful new segment that competes for the same power-secure
              campuses. On the customer side, DayOne’s own language centers on hyperscalers and large enterprises that
              care about latency, scale, and deployment speed. Taken together, that implies a buyer stack led by cloud
              platforms, AI infrastructure providers, sovereign or regulated-cloud programs, domestic digital platforms,
              and large multinational enterprises outsourcing regional compute-heavy workloads.


              Budget ownership also varies by segment. Hyperscaler and neocloud demand is typically driven by
              cloud-infrastructure and platform teams optimizing capacity deployment, energy access, and network reach.
              Enterprise demand more often sits with CIO, infrastructure, and digital-transformation budgets, especially
              where sovereign cloud, GPU workloads, or latency-sensitive regional applications are involved. Public
              cloud-region materials from Google Cloud and Microsoft reinforce this logic: buyers value region density,
              paired-region resilience, data residency, and low-latency access to nearby markets, all of which support
              the case for Singapore-adjacent capacity rather than remote builds elsewhere in APAC.


              The adoption path therefore resembles a corridor, not a funnel to one city. Workloads first cluster where
              regulation, talent, and connectivity are strongest—usually Singapore—then expand into Johor or Batam when
              power, land, or cost constraints make single-market scaling impractical. That is why wholesale colocation
              has become so important in Singapore and why AI-ready projects in Johor are being marketed so
              aggressively. The market does not reward the cheapest site in isolation; it rewards the site that can
              combine cloud adjacency, cross-border operability, sustainable power, and fast delivery.
