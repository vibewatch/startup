        - $18–22B
        - $12–15B
        - $7–10B
      - - Probability signal
        - Requires strong IPO window and clear public-company readiness
        - Most balanced outcome if conversion continues but disclosure remains imperfect
        - Becomes likely if public investors punish opacity or conversion risk
      - - Key supporting condition
        - Near-$1B revenue visibility, stable power execution, and strong backlog monetization
        - Healthy billable growth plus no major regulatory or power setback
        - Weak committed-to-billable conversion or financing-market deterioration
      - - Recommendation implication
        - Can support selective participation
        - Supports watchlist / monitor stance with price discipline
        - Supports pass or major price reset
    notes: >-
      This framework uses revenue-multiple ranges rather than precise DCF outputs because DayOne’s standalone free cash
      flow, preference stack, and final public listing package remain undisclosed in public.
