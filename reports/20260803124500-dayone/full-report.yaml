  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: monitor the company, not the indicated IPO price'
        blocks:
          - type: paragraph
            body: >-
              DayOne has a real investment thesis. The company sits in one of the strongest infrastructure demand
              corridors in Asia, has raised unusual amounts of capital for a private operator, and is benefiting from
              exactly the mix of AI, cloud, and Singapore-overflow demand that public market investors currently reward.
              Johor’s growth, Malaysia’s power-secure expansion, and Singapore’s scarcity all argue that DayOne deserves
              some premium to a generic colocation landlord.


              The problem is not whether DayOne is interesting. The problem is whether the current indicated price
              already capitalizes too much of the upside. A reported $20 billion IPO target would come before investors
              have standalone audited statements, customer concentration disclosure, a clean public cap-table view, or
              proof that committed megawatts convert into monetized load quickly enough to support a public-market
              premium. The company is clearly financing growth successfully, but price discipline matters more than
              company quality in the valuation chapter.


              My recommendation is therefore MONITOR rather than buy-through on the headline price. The business can
              still be a high-quality watchlist name, and the mark could become defensible if revenue scale, conversion,
              and listing readiness improve. At the indicated price today, however, the valuation asks investors to pay
              for a public-quality outcome before the public-quality disclosure set exists.
            claimRefs:
              - CV001
              - CV005
              - CV027
              - CV028
              - CV029
              - CV038
