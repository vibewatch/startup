      - number: '8.4'
        title: What changes the call is disclosure, not another headline funding round
        blocks:
          - type: paragraph
            body: >-
              The final investment question is not whether DayOne can keep raising money; it almost certainly can. The
              question is what evidence would move the recommendation from monitor to buy. The answer is mostly
              disclosure-led. Investors need standalone audited statements, a clear concentration schedule, a cap-table
              and preference-stack view, debt-covenant transparency, and site-level clarity on power and permitting for
              the most strategic campuses. Without those pieces, the IPO case remains more narrative-driven than
              underwritten.


              Exit readiness is similarly incomplete in public. The dual-listing idea is credible, but the available
              record still looks like bank-hiring, valuation testing, and strategic positioning rather than a fully
              de-risked public-company package. That is not a red flag by itself. It simply means investors should
              demand either a lower entry price or a meaningfully better diligence set.


              Put differently: another financing headline would not change the call very much. Stronger audited revenue,
              better committed-to-billable conversion, clearer customer-quality disclosure, and visible IPO readiness
              would. Until then, the correct stance is to treat DayOne as a strong company with an aggressive valuation
              ask.
            claimRefs:
