        - Repeated fundraising and asset-level borrowing also signal ongoing external-capital dependence
        - Show a cleaner leverage path and clearer self-funding profile from operating cash flow
      - - Public comp premium
        - A premium to GDS/NEXTDC is defensible because DayOne has higher AI corridor exposure
        - >-
