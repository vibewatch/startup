      - number: '4.3'
        title: 'Capital structure and capital intensity: equity, mezzanine, and sponsor monetization'
        blocks:
          - type: paragraph
            body: >-
              Capital formation is the clearest part of DayOne’s financial story. Official DayOne materials and GDS
              filings show a platform that has stacked several layers of financing in quick succession. DayOne raised
              US$672 million of Series A in 2024, then US$1.2 billion of Series B in late 2024, secured a €500 million
              mezzanine facility expandable to €1 billion in December 2025, announced an initial Series C larger than
              US$2.0 billion in January 2026, and then reached a final Series C close of US$4.5 billion in June 2026.
              GDS’s own filings further show that it monetized part of its DayOne stake, raising US$385 million from the
              sell-down of shares in 1Q26, while also raising US$300 million from a convertible preferred share issue.


              That capital stack is not cosmetic; it is a response to genuine infrastructure intensity. GDS’s DayOne
              disclosures show net debt rising from US$63.1 million at FY2024 to US$1.33 billion at FY2025 and US$1.41
              billion by 1Q26. Market sources reinforce why this should not be surprising: analyst work on Malaysia and
              Indonesia still points to very high capital costs per MW, and DayOne’s own renewable-energy and Finland
              releases suggest significant up-front infrastructure commitments before cash flows are fully harvested.
              The financing mix therefore looks rational for the business model, but it also means capital adequacy
              cannot be judged on equity headlines alone.


              The sharpest caution is that public DayOne corporate cash, interest burden, debt maturity profile, and
              project-level debt-service terms remain undisclosed. GDS also warns that it remains exposed to guarantees
              and undertakings previously provided for DayOne facilities. Underwriters therefore have a good view of
              DayOne’s funding momentum, but not yet a complete view of whether that funding is sufficient for the next
              wave of contracted growth without further dilution or refinancing.
