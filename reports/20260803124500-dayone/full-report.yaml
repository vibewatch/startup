      - number: '1.4'
        title: Funding Stack, Ownership Evolution, and the Main Underwriting Gaps
        blocks:
          - type: paragraph
            body: >-
              Public capital-formation evidence is the clearest reason DayOne matters. The official journey page says
              the company raised roughly US$587 million in Series A and US$1.2 billion in Series B before layering on up
              to €1 billion of mezzanine financing in December 2025. The January 2026 Series C announcement then
              disclosed more than US$2.0 billion of fresh equity at a 100% premium to the prior round, while the June
              2026 final close took Series C gross proceeds to US$4.5 billion and elevated Coatue and Hillhouse into the
              two largest shareholders. Those same releases also identify INA and Achi Capital as notable participants,
              with prior coverage mentioning investors such as SoftBank Vision Fund, Ken Griffin, and Baupost.


              GDS’s filing is the other crucial capital source because it shows the spinout mechanics. After Series B
              closed on December 31, 2024, GDS says its stake in DayOne fell from 52.7% to 35.6% and DayOne was
              deconsolidated, with RMB9.93 billion of cash and RMB10.42 billion of gross debt at the point of
              deconsolidation. That implies DayOne entered 2025 with meaningful liquidity but also meaningful leverage,
              consistent with the capital intensity of campus development. It also means DayOne’s public narrative of
              independence is real in accounting terms, even if GDS remained a significant minority holder as of later
              media reporting.


              The adverse or cautionary signals all cluster around valuation, monetization, and disclosure gaps.
              Reuters-linked and Bloomberg-linked trade coverage said DayOne was seeking funding at roughly US$4-5
              billion in late 2024, was worth about US$10 billion around the January 2026 Series C announcement, and was
              targeting a US$20 billion IPO valuation by June 2026, with a possible dual US-Singapore listing and even
              MGX takeover interest. Those marks may all be explainable by rapid financing cadence and AI-infrastructure
              scarcity, but they underline how quickly headline valuation has moved relative to the public evidence
              base. Named customers, revenue, EBITDA, utilization by campus, and definitive IPO documents remain absent
              from public sources. The result is a company with unusually visible capital access and unusually opaque
              unit economics.
