      - number: '7.3'
        title: Dependency risk is ecosystem-level, not supplier-level
        blocks:
          - type: paragraph
            body: >-
              DayOne’s demand story is strongest where hyperscalers and AI workloads need regional capacity, but that
              also means the company depends on external actors whose investment cycles it does not control. Microsoft’s
              Malaysia and Johor expansion, Google’s regional plans, and AWS’s Malaysia region launch all support the
              logic of DayOne’s corridor bets. They also show that demand timing is partly shaped by hyperscaler
              decisions outside DayOne’s direct control. A slowdown, redesign, or geography shift by those platforms
              would not make DayOne irrelevant, but it could materially change how fast booked capacity converts into
              live load.


              Counterparty dependence also extends beyond customers. Utilities, regulators, industrial-estate
              authorities, and financiers all matter. The public record for Thailand highlights BOI, IEAT, and Amata.
              Singapore capacity depends on EDB and IMDA allocation logic. Malaysia depends heavily on TNB and
              renewable-energy execution. Finland now adds Brookfield-backed platform borrowing. These are not
              easy-to-replace vendors; they are strategic counterparties with leverage over timing, economics, or both.


              Concentration is the least transparent part of the chapter. Public sources show >1.5 GW of bookings and ~1
              GW of secured customer commitments, but they do not disclose how much of that belongs to a handful of
              logos or to one site. In a hyperscale-led model, that missing disclosure is itself a risk signal, because
              very strong growth can still hide a fragile dependence on a few tenants or partner-shaped channels.
