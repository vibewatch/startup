  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model and public traction: visible ramp, incomplete mix disclosure'
        blocks:
          - type: paragraph
            body: >-
              DayOne’s public revenue model is far closer to infrastructure leasing than to software subscription
              economics. Official DayOne materials emphasize hyperscale and large-enterprise capacity, while GDS filings
              and DayOne-specific disclosures use committed and billable IT power as the main operational lens. That is
              a strong clue about how revenue is created: customers first sign for power and capacity, projects become
              live and billable over time, and revenue then follows the ramp of occupied or activated space rather than
              instant software activation.


              The best public traction evidence comes from GDS’s DayOne disclosures in its 2025 annual report and 1Q26
              earnings presentation. Those materials show DayOne revenue rising from US$178.1 million in FY2024 to
              US$484.3 million in FY2025 and reaching US$220.5 million in 1Q26, while adjusted EBITDA rose from US$56.2
              million to US$180.7 million and then US$89.7 million in 1Q26. The same disclosures show committed IT power
              jumping from 430 MW at FY2024 year-end to 1,250 MW at FY2025 and 1,526 MW by 1Q26. That pattern implies a
              company still in heavy build-and-ramp mode: capacity commitments are running well ahead of live billable
              power, which is exactly what an expanding hyperscale platform should look like before full monetization.


              The problem is that public revenue quality remains only partly visible. Neither DayOne nor GDS discloses a
              clean mix by geography, customer, contract duration, or realized price per MW. There is enough evidence to
              say DayOne is scaling rapidly, but not enough to say whether that growth is being bought with aggressive
              concessions, unusually tenant-concentrated contracts, or early-stage underpricing designed to fill
              campuses quickly.
