      - number: '3.4'
        title: Moat durability, commoditization risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is not that DayOne is in the wrong market; it is that the right market is already
              full of credible, capitalized operators with overlapping narratives. Equinix markets AI-ready performance,
              compliance, and cross-border enterprise flows. Digital Realty markets interconnection, Data Gravity, and
              private-AI architecture. AirTrunk and PDG market very large AI-ready campuses with sustainability and
              cloud-customer momentum. Bridge markets advanced cooling and Johor proximity. Keppel and STT GDC market
              sustainability and broad operating depth, while Nxera benefits from local telecom linkage and policy
              support. In other words, DayOne does not own the AI-ready or sustainability message by default.


              The strongest public evidence of competitive pressure comes from capital intensity and precommitment.
              AirTrunk’s green-financed Johor expansion, PDG’s 500 MW Malaysia pipeline, and the presence of listed
              operators such as Equinix and Digital Realty show that capital access is an active competitive weapon.
              Buyers choosing among these platforms are unlikely to reward the weakest balance sheet or the slowest
              delivery path. At the same time, transparent pricing remains scarce: reviewed public materials
              overwhelmingly point to custom contracts, negotiated lease structures, and opaque realized pricing. That
              makes it difficult to judge whether DayOne is winning on economics, sustainability, service, or simply
              because a rival market is temporarily constrained.


              Moat durability therefore depends on execution rather than on category uniqueness. If DayOne can secure
              power and water, deliver AI-ready campuses on time, and keep customers close to Singapore’s cloud and
              cable gravity without paying the highest Singapore cost base, it can be highly competitive. If not, the
              corridor offers enough rival operators that customer demand can reroute quickly. The next diligence step
              is to obtain real win-loss histories, customer overlap data, term sheets, and evidence of whether DayOne’s
              corridor proposition is displacing Equinix, Digital Realty, AirTrunk, PDG, Bridge, or Singapore-rooted
              incumbents in actual deals.
