          - type: callout
            title: Backlog conversion is the valuation fulcrum
            body: >-
              Committed megawatts and funding headlines create upside, but the valuation still depends on how quickly
              committed capacity becomes billable and revenue-generating.
            calloutType: risk
            claimRefs:
              - CV010
