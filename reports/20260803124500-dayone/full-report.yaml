      - number: '1.3'
        title: Physical Footprint, Capacity Buildout, and Market Entry Milestones
        blocks:
          - type: paragraph
            body: >-
              The footprint evidence is unusually strong for a private infrastructure company. Singapore is anchored by
              the 2023 pilot DC-CFA award and the 21 Jalan Buroh site acquisition, which the company says gives it
              approximately 20 MW of awarded capacity and a first phase targeted for service around Q4 2026. Johor is
              the largest currently disclosed operating base: DayOne says it operates across Nusajaya Tech Park and
              Kempas Tech Park with over 478 MW of operational capacity, a claim reinforced by its renewable-energy
              announcement that labels Malaysia the company’s largest global operating footprint. Batam is framed as the
              Indonesia leg of SIJORI, centered on Nongsa Digital Park in partnership with INA within a Special Economic
              Zone.


              Beyond SIJORI, DayOne has clearly moved from regional experiment to broader platform expansion. The
              company officially announced a US$1 billion Thailand commitment with a Chonburi campus designed around 180
              MW of grid capacity and 122,000 square meters of space. In Finland, DayOne publicly disclosed a €1.2
              billion Lahti investment plus a Kouvola project with local partner Hyperco, and its Finland market page
              now presents the combined platform at 281 MW. External trade coverage then extended the Europe story
              further by describing a 560 MW Nurmijärvi project north of Helsinki. Even if not all of these plans are
              equally mature, the directional expansion story is well supported by official, trade, and financing
              sources.


              Capacity reconciliation remains imperfect, however. DayOne’s official pages provide market-specific
              figures such as 478 MW in Johor, 281 MW in Finland, 34 MW delivered in Nongsa Digital Park, and 180 MW
              planned in Chonburi, while financing releases also cite approximately 1 GW of secured customer commitments
              and more than 1.5 GW of total bookings. External media simplify the picture into more than 500 MW in
              service and under construction plus another 500 MW for future development. Those numbers can coexist, but
              they are not presented in one audited waterfall. That is a classic diligence issue for a private
              hyperscale developer: the expansion claims look real, but the exact live-versus-contracted-versus-planned
              capacity ledger still needs reconciliation.
