  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              DayOne does not sell a generic retail colocation product. Its official materials consistently describe the
              company as a provider of next-generation digital infrastructure for hyperscalers and large enterprises
              that need rapid deployment, scale, connectivity, and sustainability. In customer workflow terms, the
              product begins before any server is turned on: DayOne identifies scarce markets, secures power and land,
              designs a campus for high-density compute, integrates connectivity and cloud adjacency, and then operates
              the asset as a long-duration digital utility for the customer.


              The public asset map supports that interpretation. DayOne now lists active markets across Singapore,
              Johor, Batam, Greater Bangkok, Hong Kong, Tokyo, and Finland. Those assets are not uniform. Hong Kong is
              presented as a carrier-neutral, multi-cloud urban hub with named certifications. Tokyo is a lower-latency
              expansion site with 80 MW of planned IT capacity. Finland is a renewable-powered hyperscale platform tied
              to waste-heat recovery and zero-freshwater cooling. Thailand is a 180 MW two-phase development that
              explicitly highlights liquid cooling. Singapore remains a smaller but strategically important premium node
              shaped by the DC-CFA process. The product is therefore a portfolio of workload-specific delivery models
              under one operating philosophy rather than a single physical template repeated everywhere.


              That portfolio framing matters for diligence. A buyer choosing DayOne in Hong Kong or Singapore is likely
              optimizing for connectivity, certifications, and premium proximity. A buyer choosing Finland or Johor is
              optimizing for power scale, energy economics, and expansion runway. A buyer choosing Thailand or Tokyo is
              buying future capacity in a strategically important market. The right way to evaluate DayOne’s product is
              therefore as a family of infrastructure delivery patterns, not as one static data-center SKU.
