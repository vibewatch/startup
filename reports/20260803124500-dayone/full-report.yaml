      - number: '1.2'
        title: Leadership, Governance Signals, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is meaningful but narrow. The official site highlights chairman Lim Ah Doo
              and CEO Jamie Khoo most prominently, while recurring project announcements also surface Jimmy Yu in
              strategy and business development roles. Lim brings senior board-level credibility from Olam, STT GDC, EDB
              Investments, and banking roles, while Jamie Khoo is the operational face of the company and appears across
              Singapore, Thailand, energy, and financing announcements. Third-party event and speaker materials support
              the official biography that she has over two decades of leadership experience and prior ST Telemedia
              experience, and DayOne’s own materials date her CEO appointment to March 2024.


              The governance signal is therefore mixed. On the positive side, DayOne is not an anonymous shell: it shows
              named board and executive leadership, government-facing spokespersons, and repeated co-appearance with
              major investors, utilities, and regulators. On the weaker side, the public bench appears thin relative to
              the amount of capital and infrastructure under discussion. The official site does not provide a full
              venture-style board roster, committee structure, or shareholder-rights summary, and it does not name a CFO
              or broader senior operating bench despite the scale of projects underway. That makes key-person
              dependence—especially on Jamie Khoo for capital markets, customer signaling, and government
              relationships—an underwriting issue rather than a footnote.


              Leadership messaging is also tightly coupled to a platform narrative. DayOne repeatedly claims its team
              has over two decades of industry experience and a track record of building Asia’s largest data center
              business. The claim is directionally plausible given the GDS lineage and the profiles of Lim and Khoo, but
              investors should treat it as strategic signaling until a fuller management roster, compensation framework,
              and governance pack is available in a data room or filing. Public evidence is enough to establish
              credible, experienced top leadership; it is not yet enough to eliminate execution concentration risk.
            claimRefs:
