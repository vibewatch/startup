      - number: '5.3'
        title: Deployment, roadmap, trust controls, and differentiation
        blocks:
          - type: paragraph
            body: >-
              DayOne’s public roadmap is asset-based and staged rather than software-like. The 21 Jalan Buroh site in
              Singapore remains tied to a first phase targeted for service around Q4 2026. Tokyo is still in
              development. Thailand is under phased buildout. Finland pairs Lahti with Kouvola as a broader renewable
              platform. Hong Kong appears more mature as an interconnection-heavy urban hub. The roadmap picture is
              therefore credible but heterogeneous: some DayOne assets are operational, some are under construction, and
              some remain mainly defined by future delivery promises.


              Trust and compliance disclosure is partial but not absent. Hong Kong public materials list ISO 9001, ISO
              27001, and SOC2. DayOne’s sustainability page documents a LEED Platinum award for one Johor site, a
              21-year renewable-energy VPPA, multiple long-term renewable-energy PPAs, a 2026 target to publish the
              inaugural sustainability report, and a 2030 target for 100% renewable energy. Singapore deployment is also
              inherently gated by the DC-CFA regime and its sustainability conditions. These are meaningful controls,
              but they are not a substitute for a full trust portal, fleet-wide PUE or WUE disclosure, incident history,
              or detailed customer SLAs.


              That gap shapes the differentiation story. The strongest public differentiation signals are operational
              rather than proprietary: SIJORI corridor know-how, speed to market, brownfield and greenfield flexibility,
              high-density cooling, renewable-energy integration, and the ability to tailor the same platform logic
              across different geographies. Rival operators such as Equinix, PDG, Bridge, and Singapore-rooted
              incumbents can all claim AI-readiness or sustainability, so DayOne’s edge likely rests in integrated
              execution rather than in a unique isolated technology asset. The product story is strong enough to matter,
              but not yet transparent enough to eliminate diligence on reliability, controls, and site-by-site delivery.
