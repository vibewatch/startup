  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and corridor substitutes'
        blocks:
          - type: paragraph
            body: >-
              DayOne does not compete against one monolithic “data center market.” It competes inside a corridor where
              buyers can choose among several distinct operating models. Interconnection-heavy incumbents such as
              Equinix and Digital Realty win when customers value established cloud and carrier ecosystems, compliance
              depth, and cross-market connectivity. Hyperscale-focused developers such as AirTrunk, Princeton Digital
              Group, and Bridge Data Centres compete more directly with DayOne on large campus delivery, AI-ready
              density, and ability to convert land and power into committed megawatts quickly. Diversified colocation
              platforms such as NTT, STT GDC, and Keppel add another class of competition: they can pair regional
              operating history and enterprise relationships with broad product catalogs and, in some cases, local
              policy relationships.


              Public market evidence shows why the field is crowded. Arizton counts 149 operators and 479 existing or
              upcoming facilities across Southeast Asia, while CBRE and Cushman both describe a region where hyperscaler
              and AI demand remain strong but where buyers still have multiple site and operator choices. In the
              Singapore-Johor corridor specifically, MIDA and Invest Johor materials point to a cluster that already
              includes Equinix, Nxera/TM, AirTrunk, and other large projects. DayOne’s existence in the right geography
              therefore does not itself confer scarcity; the real question is which operators can combine ecosystem
              access, power certainty, sustainable design, and sponsor-backed expansion fastest.


              The substitute set also matters. Some workloads will stay with enterprise private AI deployments attached
              to multi-cloud providers instead of moving to a single hyperscale campus operator. Digital Realty’s
              Cyberjaya launch materials make that explicit by targeting private-AI and multi-cloud inference customers,
              while Equinix and NTT continue to market carrier-neutral interconnection and hybrid-cloud density rather
              than only raw land bank. That means DayOne must compete not only on campus scale, but also on what type of
              workload and buyer behavior it can capture better than interconnection-heavy or enterprise-centric rivals.
