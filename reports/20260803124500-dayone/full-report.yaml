      - number: '4.4'
        title: 'Financial verdict: growth proof is real, but underwriting still needs private data'
        blocks:
          - type: paragraph
            body: >-
              The positive financial case is straightforward. DayOne has a rapidly growing disclosed revenue base,
              improving adjusted EBITDA, a very large committed-power pipeline, and access to one of the strongest
              private capital stacks visible in the sector. It has already demonstrated repeat access to Series A, B,
              and C equity, mezzanine capital, sponsor liquidity events, and renewable-energy contracting that can
              support long-duration campus economics. For a private infrastructure platform, that is unusually strong
              proof of commercial and financing momentum.


              The negative case is that too many core underwriting metrics remain missing. Public evidence does not
              disclose DayOne cash on hand, monthly burn, working capital needs, debt-service coverage, weighted average
              customer term, realized pricing by market, maintenance capex, project-level returns, or customer
              concentration. Even the disclosed GDS materials, while valuable, are still a shareholder’s lens rather
              than a full standalone DayOne financial package. They show enough to say the company is scaling and
              heavily financed; they do not show enough to confirm the exact quality and durability of that growth.


              The practical conclusion is mixed but favorable. DayOne’s financial story is strong enough to support a
              credible growth and scale narrative, and strong enough to justify further diligence on an IPO path. It is
              not yet complete enough to support a clean, conventional underwriting memo without direct management
              disclosures on cash, debt, contract economics, and campus-by-campus ramp assumptions.
