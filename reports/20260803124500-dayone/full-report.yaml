          - type: callout
            title: Public-market comps reward proof, not just scarcity
            body: >-
              Equinix and Digital Realty earn premium public values because they pair attractive markets with repeatable
              disclosure and monetization. DayOne has some of the former and not yet enough of the latter.
            calloutType: insight
