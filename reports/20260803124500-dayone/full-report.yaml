          reserving MW
      - - Commercial proof
        - DayOne has real revenue, EBITDA, bookings, and multi-market development momentum
        - >-
          Committed MW still far exceeds billable MW, so investors are paying for future conversion more than current
          earnings
        - Show two to three quarters of strong billable growth and site-level move-in evidence
