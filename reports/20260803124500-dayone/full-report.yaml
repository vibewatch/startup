      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price, not just company quality, drives the call
            body: >-
              DayOne can be a strong infrastructure company and still be overpriced at a $20B IPO indication. The
              recommendation is about entry discipline, not about denying demand quality.
            calloutType: recommendation
            claimRefs:
