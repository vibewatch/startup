      - number: '8.2'
        title: Current valuation math is aggressive versus disclosed monetization
        blocks:
          - type: paragraph
            body: >-
              The key bridge from company story to valuation is simple arithmetic. GDS’s segment disclosures show DayOne
              reaching $484.3 million of FY2025 revenue and $180.7 million of FY2025 EBITDA, then $220.5 million of 1Q26
              revenue and $89.7 million of 1Q26 EBITDA. On those numbers, a $20 billion equity value implies roughly 41x
              trailing revenue, 111x trailing EBITDA, 23x annualized 1Q26 revenue, and 56x annualized 1Q26 EBITDA. Those
              are not impossible ratios for a scarce AI infrastructure platform, but they are undeniably demanding.


              The second math issue is conversion. DayOne reported 1,526 MW of committed IT power but only 474 MW of
              billable power in 1Q26. That is a healthy backlog signal, yet it also means public investors would be
              paying for future monetization more than present monetization. In private markets, that can be tolerated
              when investors trust sponsor judgment and cap-structure protections. In an IPO process, the same gap
              usually demands either a lower multiple, cleaner disclosure, or both.


              That is why a revenue-multiple framework is more useful than false DCF precision. Until DayOne publishes
              standalone audited statements and a fuller capital-structure picture, valuation should be framed as a
              range around what investors are willing to pay for run-rate revenue, corridor scarcity, and execution
              credibility.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
