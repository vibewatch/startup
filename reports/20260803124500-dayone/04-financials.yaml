  evidenceGaps:
  - type: missing-source
    severity: material
    topic: standalone-liquidity
    missingEvidence: No retained public source discloses DayOne standalone unrestricted cash, restricted cash, or monthly burn.
    whyItMatters: Without cash and burn, runway and financing sufficiency cannot be underwritten responsibly.
    diligencePath: Request latest DayOne balance sheet, liquidity schedule, and monthly cash bridge by campus and corporate entity.
    relatedQuestionRefs:
    - QI016
    - QI022
  - type: missing-source
    severity: material
    topic: realized-contract-economics
    missingEvidence: Public sources do not disclose realized price per MW, escalators, concessions, contract life, or tenant-improvement obligations.
    whyItMatters: Revenue growth can be visible while value capture remains poor if contracts are heavily discounted or back-loaded.
    diligencePath: Request anonymized contract book and recent term sheets with price, term, escalators, and ramp profile.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI021
  - type: missing-source
    severity: material
    topic: debt-service-and-covenants
    missingEvidence: Net debt is disclosed, but debt maturities, interest burden, recourse structure, and covenant headroom are not.
    whyItMatters: Capital-intensive infrastructure businesses can look strong on EBITDA while still being fragile on debt service.
    diligencePath: Request debt stack, maturity ladder, project-level financing terms, hedges, and covenant calculations.
    relatedQuestionRefs:
    - QI012
    - QI017
    - QI022
  - type: missing-source
    severity: minor
    topic: project-level-returns
    missingEvidence: Public evidence does not show campus-by-campus capex per MW, target IRR, or maintenance capex requirements.
    whyItMatters: Geographic growth may destroy value if later campuses are structurally less profitable than headline bookings suggest.
    diligencePath: Request campus model pack with capex, opex, power cost, ramp timing, and target return assumptions.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI025
