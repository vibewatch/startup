  title: Public financial gaps table
  columns:
  - missing private metrics
  - impact
  - exact diligence path
  rows:
  - - Standalone cash and restricted cash
    - Cannot measure runway or funding sufficiency
    - Request latest balance sheet, cash waterfall, and debt-availability schedule.
  - - Realized pricing by market / customer
    - Cannot assess revenue quality or pricing power
    - Request anonymized contract book with MW, price-per-kW, escalators, and incentives.
  - - Contract duration, ramp profile, and customer concentration
    - Cannot assess durability of bookings or tenant risk
    - Request top-10 customer exposures, WALE, ramp schedule, and termination rights.
  - - Project-level capex and returns
    - Cannot evaluate marginal economics by geography
    - Request capex/MW, power cost, PUE/WUE assumptions, and target IRRs by campus.
  - - Debt maturity profile and covenants
    - Cannot stress test refinancing risk
    - Request debt stack, recourse terms, hedging, and covenant headroom.
  - - Working capital and maintenance capex
    - Cannot connect EBITDA to free cash flow
    - Request cash-conversion bridge and annual sustaining capex budget.
  notes: These gaps prevent a conventional credit-style or project-finance-style underwriting conclusion from public sources alone.
