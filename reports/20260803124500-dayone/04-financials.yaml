- id: pricing-gtm-and-unit-economics
  title: Pricing, GTM motion, and unit-economics visibility
  body: 'The reviewed public record points to negotiated infrastructure contracts rather than transparent list pricing. DayOne’s own materials market capacity, geography, and sustainability, but they do not publish price cards for reserved MW, shell-and-core delivery, interconnection bundles, or liquid-cooled deployments. That is normal for hyperscale infrastructure, but it sharply limits external underwriting. Without price-per-kW benchmarks tied to actual contract structures, even a strong revenue ramp cannot be converted confidently into margin durability or customer-quality assessments.


    Public operating data nonetheless suggest the economic mechanism. Committed MW and billable MW are disclosed separately, which implies a revenue bridge from signed commitments to activated capacity to recognized revenue. The disclosed step-up from 121 MW billable at FY2024 year-end to 444 MW at FY2025 and 474 MW at 1Q26 indicates DayOne converted a large portion of its commercial pipeline into live monetization, while still keeping a much larger committed backlog for future ramp. On a simple indicative basis, the 1Q26 revenue and EBITDA numbers imply an annualized run-rate around US$882 million of revenue and roughly US$359 million of adjusted EBITDA, though management and investors should treat that only as a directional snapshot because seasonality, one-time items, and project timing are not fully disclosed.


    The largest missing unit-economics fields are still private: realized pricing, tenant-improvement obligations, customer concentration, prepayment terms, maintenance capex, sales cycle length, net retention, churn, and weighted average contract life. This chapter can therefore identify the economic engine, but not yet close the loop on whether growth is highly profitable growth.'
