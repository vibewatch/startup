      - number: '8.2'
        title: 当前估值数学相对已披露变现偏激进
        blocks:
          - type: paragraph
            body: >-
              从公司故事走到估值，关键桥梁就是简单算术。GDS 的分部披露显示，DayOne FY2025 收入达到 $484.3 million、FY2025 EBITDA 达到 $180.7 million；随后 1Q26
              收入 $220.5 million、EBITDA $89.7 million。按这些数字，$20 billion 股权价值约等于 41x 往绩收入、111x 往绩 EBITDA、23x 年化 1Q26
              收入、56x 年化 1Q26 EBITDA。对于稀缺 AI 基础设施平台，这些比例不是完全不可能，但无疑要求很高。


              第二个数学问题是转化。DayOne 在 1Q26 报告 1,526 MW 已承诺 IT 电力，但可计费电力只有 474
              MW。这是健康的积压订单信号，却也意味着公开市场投资者买的更多是未来变现，而不是当下变现。在私募市场，只要投资者信任发起方判断和资本结构保护，这可以被容忍。放到 IPO
              流程里，同样的缺口通常需要更低倍数、更清晰披露，或二者兼有。


              因此，收入倍数框架比伪精确 DCF 更有用。DayOne 发布独立审计报表和更完整资本结构图之前，估值应围绕投资者愿意为收入运行率、走廊稀缺性和执行可信度支付多少来给出区间。
