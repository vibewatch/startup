      - number: '2.3'
        title: 买家、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              买家图谱不止云厂商，但超大规模云厂商仍决定节奏。CBRE 和 Cushman 都把超大规模与 AI 需求描述为 APAC 新增容量背后的主导力量；CBRE 的 2026
              年新闻稿还把新型云厂商识别为一个有分量的新细分市场，争夺同样具备电力确定性的园区。客户侧，DayOne 自身语言集中在重视延迟、规模和部署速度的超大规模云厂商与大企业。合在一起看，买家栈由云平台、AI
              基础设施提供商、主权或受监管云项目、本土数字平台，以及把区域重计算工作负载外包的大型跨国企业领头。


              预算归属也随细分市场变化。超大规模云厂商和新型云厂商需求通常由云基础设施与平台团队驱动，他们要优化容量部署、能源接入和网络覆盖。企业需求更多落在 CIO、基础设施和数字化转型预算里，尤其涉及主权云、GPU
              工作负载或延迟敏感的区域应用时。Google Cloud 和 Microsoft 的公开云区域材料强化了这一逻辑：买家看重区域密度、配对区域韧性、数据驻留和低延迟进入邻近市场；这些都支持靠近新加坡的容量，而不是
              APAC 其他远端建设。


              因此，采用路径更像一条走廊，而不是通往单一城市的漏斗。工作负载先在监管、人才和连接性最强的地方聚集——通常是新加坡；当电力、土地或成本约束让单一市场扩张不现实，再向柔佛或巴淡延展。这解释了批发托管为何在新加坡变得如此重要，也解释了柔佛
              AI 就绪项目为何被如此激进地营销。市场奖励的不是孤立的最低成本场地，而是能把云邻近性、跨境可运营性、可持续电力和快速交付结合起来的场地。
