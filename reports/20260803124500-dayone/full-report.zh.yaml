  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从市场顺风和公司证据，穿过估值数学与开放风险，最终落到继续跟踪建议。
    data:
      nodes:
        - id: market
          label: AI + 亚太需求顺风
          detail: 区域投资创纪录、超大规模云厂商资本开支上升、新加坡关联稀缺性共同支撑高端需求。
          type: input
          tone: positive
        - id: proof
          label: 真实运营证据
          detail: DayOne 已有真实收入、EBITDA、已预订容量和大额资金支持。
          type: process
          tone: positive
        - id: price
          label: 激进指示价格
          detail: 约 $20B 意味着以已披露数字计算，收入和 EBITDA 倍数都非常苛刻。
          type: process
          tone: warning
        - id: gaps
          label: 未关闭的披露缺口
          detail: 独立审计、客户集中度、契约条款和股权结构细节公开信息仍不完整。
          type: process
          tone: risk
        - id: decision
          label: 建议：继续跟踪
          detail: 公司很强；在承销完整 IPO 指示价格前，等待更好披露或更好价格。
          type: output
          tone: neutral
    claimRefs:
