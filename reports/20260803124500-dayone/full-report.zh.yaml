  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调追问
    rows:
      - - 超大规模云厂商和 AI 资本开支加速
        - 上行
        - 当前至 2028 年
        - 支撑亚太新增容量快速消化，也利好电力有保障的超大型园区。
        - 要求 DayOne 拆分已签约超大规模云厂商需求、AI 需求和企业需求。
      - - Neocloud 崛起
        - 上行
        - 当前
        - 为可承载 AI 的空间带来增量需求，但信用质量可能弱于头部超大规模云厂商。
        - 要求提供非超大规模云厂商 AI 买方的交易对手质量筛查和保证金条款。
      - - 新加坡土地和电力约束
        - 下行
        - 当前
        - 托住新加坡溢价，同时把更大规模需求推向柔佛、巴淡等周边枢纽。
        - 要求 DayOne 证明以新加坡为锚的客户需求外溢。
      - - 柔佛电力和土地可得性
        - 上行
        - 当前至 2030 年
        - 让柔佛成为马来西亚主要超大规模扩张市场，也是 DayOne 廊道的核心节点。
        - 按园区要求变电站、签约电力排期和公用事业里程碑。
      - - 用水强度和冷却复杂度
        - 下行
        - 当前且上升
        - 抬高新加坡和柔佛的许可与可持续性门槛。
        - 按站点要求用水效率、回收设计和应急预案。
      - - 建设成本通胀
        - 下行
        - 12-24 个月
        - 需求强也可能被吃掉回报，AI 级园区尤其如此。
        - 要求每 MW 资本开支假设和采购锁价安排。
      - - 马来西亚电价和政策变化
        - 混合
        - 当前
        - 可能拖慢边际项目，但会奖励拥有强可再生能源或公用事业伙伴的运营商。
        - 要求 DayOne 提供 2025 年后电价情景的敏感性分析。
      - - JS-SEZ 与 SG+ 跨境政策
        - 上行
        - 当前至中期
        - 把新加坡总部功能与柔佛或巴淡扩张区配在一起，廊道逻辑更成立。
        - 要求提供采用该模式的真实客户架构或管线案例。
      - - 海底光缆与云区域密度
        - 上行
        - 当前
        - 需求更偏向贴近新加坡和雅加达的市场，而非孤立内陆站点。
        - 要求 DayOne 园区的登陆站、电信运营商和云接入点地图。
      - - 5G 和更广泛数字就绪度缺口
        - 下行
        - 中期
        - 即便批发容量到位，也可能压住本地 AI 采用上限。
        - 要求拆分客户组合：面向输出的区域工作负载与本土数字经济需求。
    notes: 核心市场问题不是有没有需求，而是运营商能否在电力、水、电价和政策约束下，把 AI 与云需求转成可交付 MW。
