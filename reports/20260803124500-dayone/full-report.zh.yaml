      - number: '6.3'
        title: 耐久性信号存在，但只能替代留存披露，不能等同于留存披露
        blocks:
          - type: paragraph
            body: >-
              DayOne 这样的数据中心平台，耐久性理想上应靠租户集中度、租期、续约时间表、按客户名称划分的已预订与已计费容量，以及首次迁入后的队列行为来承销。今天这些都不公开。已审阅来源没有给出
              NRR、GRR、流失率、客户名称留存、标准租期或客户满意度基准。公开证据给出的只是耐久性替代指标：Johor 自 2023 年起运营，DayOne
              快速做出大型已预订容量基础，马来西亚正扩成公司的最大足迹，大型可再生能源协议也显示管理层在预期粘性客户需求下作出长期承诺。


              这些代理指标重要，但不是续约证明。一个平台可以有强劲预订，同时仍面临租户高度集中、迁入缓慢，或第一代合同续约乏力。芬兰最清楚地提醒了这种区别。DayOne 的 Lahti
              公告称，与潜在租户的谈判正在推进，公告时尚未最终敲定任何协议。这是健康披露，因为它把市场进入和真正签约需求分开；但它也说明，不能只靠扩张头条就夸大耐久性。


              因此，最好的尽调姿态，是把 DayOne 的客户耐久性视为可信但披露不足。市场契合看起来强，公司也确实围绕可复制的超大规模云和 AI
              需求建设。但公开来源仍停在投资者把预订和走廊动能转成硬性经常性收入信心所需的信息之前。
