        title: 依赖风险在生态层面，不在单一供应商层面
        blocks:
          - type: paragraph
            body: >-
              DayOne 的需求故事在超大规模云厂商和 AI 工作负载需要区域容量时最强，但这也意味着公司依赖外部行为方，而它无法控制对方的投资周期。Microsoft 的马来西亚和 Johor 扩张、Google
              的区域计划、AWS 的马来西亚区域上线，都支撑 DayOne 走廊押注的逻辑。它们也说明，需求时点部分由 DayOne 无法直接控制的超大规模云厂商决策塑造。这些平台放慢、重设架构或迁移地理重心，不会让
              DayOne 失去意义，但可能实质改变已预订容量转成上线负载的速度。


              对手方依赖还延伸到客户之外。公用事业方、监管机构、工业园区主管部门和融资方都关键。泰国公开记录突出 BOI、IEAT 和 Amata；新加坡容量取决于 EDB 和 IMDA 的分配逻辑；马来西亚高度依赖 TNB
              和可再生能源执行；芬兰现在又加入 Brookfield 支持的平台借款。这些不是容易替换的供应商，而是在时点、经济性或二者上都握有杠杆的战略对手方。


              集中度是本章最不透明的部分。公开来源显示 >1.5 GW 预订和约 1 GW
              已锁定客户承诺，但没有披露其中多少属于少数客户名称或某一个站点。在超大规模云厂商牵引的模型里，这项缺失本身就是风险信号，因为非常强的增长仍可能掩盖对少数租户或伙伴塑造渠道的脆弱依赖。
