  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律闸门是近期最结构性的风险
        blocks:
          - type: paragraph
            body: >-
              DayOne 最重要的风险不是普通需求疲软，而是高端容量市场能否在可接受监管条件下保持开放。新加坡仍是整个 SIJORI 逻辑的锚点，但公开记录显示，那里的新增供给仍受配给。2023 年试点 Data
              Centre-Call for Application 只向四家运营商授予约 80 MW，已发布标准强调能源效率、脱碳、连接性和 AI/HPC 算力。DayOne 自己的 21 Jalan Buroh
              收购稿明确称，该项目遵循这一授予。这意味着 DayOne 最战略性的站点之一，已经与政府管理的容量分配制度不可分割。


              泰国增加了另一类政策风险。DayOne 的 Chonburi 项目受益于官方支持，但最新法律评论显示，泰国当局不再把数据中心视为简单税收激励项目。BOI 相关要求现在纳入
              PUE、冗余、安全、水资源规划、清洁能源逻辑和劳动力承诺。这让合规和许可成为资本计划的一部分，而不是拿地后的打勾事项。芬兰的政治约束小于新加坡或泰国，但在资本已经投入时，它仍带来跨境许可、公用事业协调和租户时点风险。


              最后一层法律覆盖来自 AI 芯片出口管制。DayOne 自己不是芯片设计商，但目标租户正是最暴露于受控半导体和合规义务的超大规模云厂商与 AI 工作负载。因此，BIS 规则波动会间接但实质地影响
              DayOne：如果客户无法采购或部署合适芯片，即便园区实体已经就绪，需求转化也可能放慢。
