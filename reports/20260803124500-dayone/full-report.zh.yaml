  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 有向图显示 DayOne 的根风险如何流向收入转化、融资需求和估值压力。电力和政策问题最关键，因为它们会在需求消失前先延迟通电。
    data:
      nodes:
        - id: N01
          label: 新加坡容量 / 审批滑坡
          tone: critical
        - id: N02
          label: 马来西亚电力 / 可再生能源延迟
          tone: critical
        - id: N03
          label: 泰国许可摩擦
