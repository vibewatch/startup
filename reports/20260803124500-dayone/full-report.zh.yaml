      - number: '6.4'
        title: 集中度和渠道依赖仍是客户承销的主要盲点
        blocks:
          - type: paragraph
            body: >-
              即便 DayOne 表现良好，其扩张逻辑也可能带来集中度风险。超大规模园区通常靠少数超大客户赢单，而不是靠宽泛的长尾账户。公开证据强烈暗示 DayOne
              的经济性由这种大租户结构驱动：公司强调超大规模云厂商和大型企业，引用预订和承诺容量而不是客户数，并保持客户级披露稀少。这符合商业模式，但也意味着公开市场投资者还看不到多少收入依赖少数客户名称，或某个单一租户是否主导某个园区。


              渠道依赖是第二个主要盲点。DayOne 最强市场周边的具名需求证据，很大程度来自云平台扩张、政府推动的数字基础设施政策和区域生态建设。Microsoft、AWS、Google、Oracle 和 MIDA
              都帮助解释 Johor、Batam 与新加坡相关容量为什么有价值。但 DayOne
              没有披露需求中有多少是直接获取，多少是由云渠道、战略伙伴或政策驱动的生态形成间接塑造。这一点重要，因为伙伴塑造的需求仍可能在经济上很优秀，但它会改变定价权、续约归属和客户亲密度。


              从实际尽调看，本章结论是双面的。DayOne
              有足够公开证据支撑真实客户逻辑：大型超大规模云需求、清晰走廊契合、已预订容量动能和可信的多市场扩张。它还没有的是一套足以有信心承销集中度、续约质量和直销与渠道归属的披露。这些是应向管理层提出的核心问题，也解释了为什么客户章节在商业故事看似强劲的同时，透明度仍低于公开市场标准。
