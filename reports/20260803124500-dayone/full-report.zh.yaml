      - number: '6.2'
        title: 采用度更多体现在 MW、预订和具名云需求代理，而不是直接租户名单
        blocks:
          - type: paragraph
            body: >-
              公开记录确实显示了真实采用，但主要通过基础设施指标，而不是透明的客户数量披露。PRNewswire 称 DayOne 自成立以来已锁定超过 1.5 GW 的总预订；Data Center Magazine
              称公司支撑约 1 GW 的已锁定客户承诺。DatacenterDynamics 另称，组合中已有超过 500 MW 投运和在建，另有超过 500 MW 留作未来开发。仅 Johor 现在就被表述为超过 478
              MW 的运营容量。这些指标不能告诉投资者哪些客户名称贡献了需求，但足以说明 DayOne 讲的不是一个收入前或纯投机的客户故事。


              具名证明间接强于直接。DayOne 核心走廊里最清晰的具名对手方，并不是已披露的 DayOne 租户，而是在同一批市场扩张区域足迹的超大规模云厂商和云平台。Microsoft 称 Malaysia West 已于
              2025 年上线，第二个马来西亚区域 Southeast Asia 3（Johor Bahru）正为区域先进工作负载建设。Google 宣布即将到来的马来西亚云区域，并引用 Capital A、Media
              Prima 等马来西亚相关客户对低时延和本地基础设施的需求。AWS 称其马来西亚区域已上线，设有三个可用区，并点名 PayNet、Pos Malaysia 等本地客户。Oracle 把 Singapore
              West 和 Indonesia North（Batam）列入其公有云区域。这个组合不能证明这些公司都是 DayOne 租户，但能证明具名超大规模云需求正在 DayOne 扩张的精确地理位置聚集。


              诚实的综合判断是，DayOne
              的具名客户证明，最好描述为需求代理证据加上选择性的直接平台证据。公司愿意说自己受领先全球超大规模云厂商和企业信任，规模指标也支撑真实商业牵引。但公开材料仍没有发布清晰租户名单、租赁规模、上线状态或合同条款。因此，客户故事在市场契合上有说服力，在客户名称级承销上较弱。
