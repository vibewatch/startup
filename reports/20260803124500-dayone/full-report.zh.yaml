  - id: TV002
    title: 投资论点 / 反方论点表
    columns:
      - 维度
      - 投资论点
      - 反方论点
      - 会改变判断的证据
    rows:
      - - 需求背景
        - AI 与云需求叠加新加坡稀缺性，在东南亚创造真实的高端基础设施价值
        - AI 市场火热，仍可能为变现和披露落后于叙事的资产支付过高价格
        - 展示持续收入转化和客户质量披露，证明需求正在变现，而不只是预订 MW
      - - 商业证明
        - DayOne 已有真实收入、EBITDA、预订和多市场开发动能
        - 承诺 MW 仍远高于可计费 MW，因此投资者更多是在为未来转化付款，而非当前利润
        - 展示两到三个季度的强劲可计费增长和站点级入驻证据
      - - 资本获取
        - $4.5B 最终 Series C 轮交割和分层融资表明投资者想要敞口
        - 反复融资和资产级借款也显示仍依赖外部资本
        - 展示更清晰的杠杆路径，以及经营现金流带来的自我融资轮廓
      - - 上市可比公司溢价
        - 相对 GDS/NEXTDC 的溢价可以辩护，因为 DayOne 对 AI 走廊敞口更高
        - 当上市可比公司已提供披露、规模和可重复现金生成时，溢价不能无限扩大
        - 展示足够的独立质量，证明其能更接近成熟公开基础设施标准
      - - IPO 时点
        - 双重上市和聘请投行是上市动能的合理信号
        - 在投资者看到独立上市公司材料前，IPO 准备度主要还是叙事
        - 展示已提交的上市文件、经审计报表和治理包
      - - 退出上行
        - 如果收入规模大幅上台阶，乐观情景仍可支撑接近或高于 $20B 的标记
        - 如果故事继续不透明，公开市场买家可能坚持低得多的出清价格
        - 展示接近 $1B 的前瞻收入路径，并降低关键风险强度
    notes: 反方论点不是 DayOne 缺需求，而是投资者可能在公开市场证据出现前，就被要求支付公开市场溢价倍数。
    claimRefs:
      - CV005
      - CV010
      - CV022
      - CV027
      - CV028
      - CV029
      - CV030
      - CV036
      - CV037
      - CV048
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 指标
      - 乐观情景
      - 基准情景
      - 悲观情景
    rows:
      - - 2026 年收入运行率视角
        - ~$1.0B+ 前瞻收入路径变得可信
        - 在持续转化下，按现有披露推得 ~$0.85–0.95B 运行率
        - 当前运行率停在已披露水平附近，或低于预期
      - - 收入倍数假设
        - 18–22x
        - 13–17x
        - 8–11x
      - - 隐含估值区间
        - $18–22B
        - $12–15B
        - $7–10B
      - - 概率信号
        - 需要 IPO 窗口强劲，且上市公司准备度清晰
        - 若转化持续但披露仍不充分，这是最均衡的结果
        - 如果公开市场投资者惩罚不透明或转化风险，该情形会更可能
      - - 关键支撑条件
        - 收入可见度接近 $1B、供电执行稳定，且积压订单变现强劲
        - 可计费容量健康增长，且监管或供电没有重大挫折
        - 承诺容量转为可计费容量偏弱，或融资市场恶化
      - - 建议含义
        - 可支持选择性参与
        - 支持列入观察名单 / 维持跟踪，并严格价格纪律
        - 支持放弃或大幅重设价格
    notes: 该框架采用收入倍数区间，而不是精确 DCF 输出，因为 DayOne 独立自由现金流、优先权结构和最终上市材料仍未公开披露。
