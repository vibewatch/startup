      - number: '8.3'
        title: 公开可比公司支持溢价，但未必支持完整指示估值
        blocks:
          - type: paragraph
            body: >-
              公开可比锚点重要，因为 DayOne 正面向公开上市营销，而不是又一轮安静私募。仅看股权价值，$20 billion 的 DayOne 已经大约是 GDS 的 3.1x、NEXTDC 的 2.8x，同时仍明显低于
              Digital Realty 和 Equinix。这不是天然荒谬：DayOne 比成熟 REIT 增长更快，也更暴露于 AI
              和东南亚电力受限需求。但它提醒我们，尽管独立运营记录短得多，公司已经会被定价成一个相当大的公开平台。


              宏观背景有支撑。CBRE 称 2025 年 APAC 数据中心投资达到创纪录的 $11.6 billion，并称实体层交易达到 $8.3 billion；IEA
              则强调大型科技公司资本开支和电力需求爆发。这些力量足以支撑溢价叙事，但本身不能消除对客户质量、转化和融资纪律的证明需求。


              因此，我的情景区间切得很清楚。悲观情景在 $7–10 billion，如果投资者认为 DayOne 仍是承诺多于上市级证明。基准情景在 $12–15 billion，如果转化和走廊需求继续验证故事。乐观情景可到约
              $18–22 billion，但前提是 DayOne 补上披露缺口，并显示收入规模比今天报告的运行率更接近 $1 billion。
