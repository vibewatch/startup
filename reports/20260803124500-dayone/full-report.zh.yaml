      - number: '4.2'
        title: 定价、GTM 动作与单位经济可见度
        blocks:
          - type: paragraph
            body: >-
              所审阅的公开记录指向谈判型基础设施合同，而不是透明标价。DayOne 自身材料营销容量、地理和可持续性，但不公布预留
              MW、壳体与核心交付、互联打包或液冷部署的价目表。这对超大规模基础设施来说正常，却大幅限制了外部承销。没有绑定真实合同结构的每 kW 价格基准，即便收入爬坡强劲，也很难有把握地转化为利润率耐久性或客户质量判断。


              不过，公开运营数据仍提示了经济机制。已承诺 MW 和可计费 MW 分开披露，说明收入桥梁是从已签承诺到已激活容量，再到确认收入。可计费容量从 FY2024 年末 121 MW 升至 FY2025 的 444
              MW，并在 1Q26 达到 474 MW，显示 DayOne 已把商业管线中很大一部分转成实时变现，同时保留了更大的已承诺积压，供未来爬坡。按简单指示性口径，1Q26 收入和 EBITDA
              数字意味着年化收入运行率约 US$882 million、调整后 EBITDA 约 US$359 million；但管理层和投资人只能把它当作方向性快照，因为季节性、一次性项目和项目时点没有完全披露。


              最大的单位经济缺口仍在私域：实现价格、租户改造义务、客户集中度、预付款条款、维护性资本开支、销售周期长度、净留存、流失率和加权平均合同期。因此，本章可以识别经济引擎，但还无法闭环判断增长是否是高盈利增长。
