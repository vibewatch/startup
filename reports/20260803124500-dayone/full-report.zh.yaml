  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层由超大规模云厂商牵引，重视走廊位置，也受采购逻辑驱动
        blocks:
          - type: paragraph
            body: >-
              DayOne 并不把自己营销成服务数千小客户的零售托管房东。公开材料始终把它描述为面向超大规模云厂商、云平台、AI 工作负载，以及需要战略容量的大型企业的供应商，而不是提供按机柜灵活租用的零售空间。这让买方 /
              使用方 / 付款方图谱与 SaaS 或重互联零售托管很不一样。可能的买方是基础设施、云或区域扩张团队；使用方是在园区里运行的工作负载；付款方则是绑定电力、土地和部署时间的多年期基础设施或采购预算。


              最强的公开分层证据在马来西亚和新加坡相邻走廊。DayOne 的 Johor 页面称，公司在 Nusajaya Tech Park 和 Kempas Tech Park 运营，直连新加坡，运营容量超过 478
              MW。Batam 页面把 Nongsa Digital Park 描述为面向高性能计算和超大规模云部署的可扩展、多阶段平台。新加坡收购稿则把 21 Jalan Buroh 定位在高性能计算、云和 AI
              服务需求上。合起来看，这些来源支撑的客户图谱，核心是受限高端市场，尤其是新加坡的外溢和扩张需求，而不是泛泛的本土企业托管。


              外部需求记录强化了这一判断。MIDA 的 Johor 文章称，新加坡电力和土地限制正把数据中心开发商推向 Johor 和 Batam；DayOne
              自己的马来西亚能源公告也称，该国正成为其全球最大运营足迹。因此，公开证据指向的客户基础，不是按行业客户名称组织，而是按部署问题组织：超大规模云厂商需要规模，AI
              和云平台需要有能源支撑的扩张，大企业则需要区域低时延或接近主权需求的容量，同时不必等待受限内城供给。
