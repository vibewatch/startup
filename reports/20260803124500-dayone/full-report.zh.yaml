              detail: 很重要，但 DayOne 新阶段仍在爬坡。
        - label: 柔佛 / 巴淡走廊
          values:
            - label: 高
              tone: positive
              detail: 大型部署的主要扩展走廊。
            - label: 高
              tone: positive
              detail: 围绕服务新加坡关联工作负载而建。
            - label: 高
              tone: positive
              detail: 可再生能源和效率项目在这里推进更深。
            - label: 高
              tone: positive
              detail: DayOne 公开披露中推进最充分的执行区域。
        - label: 芬兰
          values:
            - label: 高
              tone: positive
              detail: 281 MW 可再生能源供电平台。
            - label: 中
              tone: neutral
              detail: 云邻近性偏欧洲，而不是亚洲。
            - label: 高
              tone: positive
              detail: 明确采用废热回收和零淡水冷却。
            - label: 中
              tone: neutral
              detail: 扩张平台，还不是完全成熟的资产组合。
        - label: 东京 / 香港 / 泰国
          values:
            - label: 中高
              tone: positive
              detail: 战略潜力强，但各市场成熟度不一。
            - label: 高
              tone: positive
              detail: 对外卖点都是连接能力和区域需求。
            - label: 中高
              tone: positive
              detail: 冷却和站点特定效率很重要，但披露不均衡。
            - label: 中
              tone: neutral
              detail: 路线图覆盖面强，但执行还要证明。
    approximationNotes: 序数评分是基于公开站点描述的有证据判断，不是经审计的业绩排名。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE023
      - CE024
      - CE030
      - CE031
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: DayOne 客户采用通常始于一个市场约束问题，随后进入走廊选择、容量预订、通电，以及向相邻市场扩张。
    data:
      nodes:
        - id: constraint
          label: 约束出现
          detail: 客户需要靠近新加坡，或处在 AI / 云高速增长市场且高端供给稀缺的容量。
          tone: warning
        - id: select
          label: 选择走廊
          detail: 客户根据电力、延迟和政策匹配，选择柔佛、巴淡、新加坡或其他 DayOne 市场。
          tone: positive
        - id: book
          label: 预订容量
          detail: 客户签下多阶段容量，而不是购买按机柜零售的空间。
          tone: positive
        - id: movein
          label: 入驻并爬坡
          detail: 园区投入运营后，已承诺容量逐步转成上线工作负载。
          tone: neutral
        - id: expand
          label: 扩大足迹
          detail: 随着工作负载和区域需求增长，客户延伸到相邻 DayOne 市场或后续阶段。
          tone: positive
    approximationNotes: null
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU007
      - CU027
      - CU028
      - CU029
      - CU030
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开证据支持一条漏斗：区域云和 AI 需求流向选址、已预订容量、上线园区和多市场扩张。
    data:
      nodes:
        - id: demand
          label: 区域需求
          detail: 超大规模云厂商和企业需要在东南亚或新区域获得云、AI 和低延迟容量。
          tone: positive
        - id: location
          label: 选址短名单
          detail: 供给受限的新加坡，以及政策支持的柔佛 / 巴淡走廊，会排到短名单前列。
          tone: positive
        - id: commit
          label: 容量承诺
          detail: 预订和已锁定客户承诺会在所有站点完全上线前，先预留未来 MW。
          tone: positive
        - id: operate
          label: 运营爬坡
          detail: 柔佛和其他园区从建设转入上线运营容量和可计费用途。
          tone: neutral
        - id: expand
          label: 扩张 / 集中度
          detail: 成功客户会扩到更多 MW 或更多市场，但集中度和渠道依赖在公开资料里更难看清。
          tone: warning
      edges:
        - from: demand
          to: location
        - from: location
          to: commit
        - from: commit
          to: operate
        - from: operate
          to: expand
    approximationNotes: null
    claimRefs:
      - CU011
      - CU012
      - CU016
      - CU021
      - CU024
      - CU025
      - CU029
      - CU035
      - CU036
      - CU037
  - id: FU003
    title: 客户证据质量矩阵
    type: matrix
    layout: wide
    summary: 公开客户文件在需求可见性上最强，在直接租户命名、留存数据和集中度透明度上最弱。
    data:
      columns:
        - 部署成熟度
        - 直接租户证据
        - 结果具体度
        - 留存可见性
      rows:
        - label: DayOne 直接预订证据
          values:
            - label: 高
              tone: positive
              detail: '>1.5 GW 预订和约 1 GW 承诺显示出有分量的商业牵引。'
            - label: 低
              tone: warning
              detail: 未披露租户名称和逐站点租赁规模。
            - label: 中
              tone: neutral
              detail: MW 和预订清楚，但收入转化细节稀少。
            - label: 低
              tone: warning
              detail: NRR、GRR、流失率或续约分群均未公开。
        - label: Microsoft 马来西亚 / 柔佛
          values:
            - label: 高
              tone: positive
              detail: 马来西亚区域已上线，柔佛扩张已有计划。
            - label: 低
              tone: warning
              detail: 没有公开文件点名 Microsoft 是 DayOne 租户。
            - label: 高
              tone: positive
              detail: 已具名客户和先进工作负载表述让需求更具体。
            - label: 低
              tone: warning
              detail: 区域使用情况不披露 DayOne 特定续约行为。
        - label: AWS 马来西亚
          values:
            - label: 高
              tone: positive
              detail: 包含三个 AZ 的正式可用区域。
            - label: 低
              tone: warning
              detail: 公开资料没有把房东关系连到 DayOne。
            - label: 高
              tone: positive
              detail: 点名若干马来西亚客户和活动水平。
            - label: 低
              tone: warning
              detail: 没有 DayOne 特定租赁或留存细节。
        - label: Google / Oracle 邻近性
          values:
            - label: 中
              tone: neutral
              detail: 官方区域计划和已上线区域支撑该走廊的云邻近性。
            - label: 低
              tone: warning
              detail: 证据停留在生态层面，不到租赁层面。
            - label: 中
              tone: neutral
              detail: 对需求背景有用，但对直接商业承销支撑较弱。
            - label: 低
              tone: warning
              detail: 没有 DayOne 特定客户持续期数据。
    approximationNotes: 矩阵评分衡量证据质量，而不是客户价值；它把已具名生态需求与 DayOne 直接租户透明度分开。
    claimRefs:
      - CU014
      - CU015
      - CU016
      - CU018
      - CU020
      - CU021
      - CU023
      - CU032
      - CU035
      - CU038
      - CU039
      - CU040
  - id: FR001
    title: 风险热图
    type: matrix
    layout: standard
    summary: 矩阵按可能性和影响映射 DayOne 主要风险。新加坡监管门槛和马来西亚电力依赖位于最高优先级单元，因为二者都可能打断增长和转化。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
        - 已确认 / 进行中
      rows:
