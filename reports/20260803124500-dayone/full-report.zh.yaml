  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算框架
        blocks:
          - type: paragraph
            body: >-
              DayOne 的正确边界不是“所有数据中心”，更不是全部数字基础设施。公开分析师报告把市场拆成 IT
              基础设施、电力基础设施、机械基础设施、冷却系统和一般建设服务等层，但这些宽口径投资池仍混杂了企业自建机房、批发托管、超大规模园区和配套建设。DayOne
              自身定位更窄：它面向重视位置、延迟、规模、速度和可持续性的超大规模云厂商与大企业。也就是说，实用的市场视角应是云相邻枢纽及其周边的批发和超大规模容量，而不是零售机柜需求或泛化的服务器机房开支。


              测算机会规模时，与其强行给出一个英雄式 TAM，不如叠三层视角。第一，东南亚作为区域组合，当前有 479
              个现有和即将上线的设施，横跨九个国家，显示供给基础的深度，以及争夺土地、电力和融资的运营商数量。第二，DayOne 最相关的三个国家——新加坡、马来西亚和印度尼西亚——已经承载了其中大部分活动；按 Arizton
              统计，三地合计有 265 个现有或即将上线的设施。第三，可投资机会增长最快的地方，是大型园区真正能落地的市场：马来西亚和印度尼西亚的扩张速度高过新加坡，尽管新加坡仍是价值最高的枢纽。


              这种分层方法很重要，因为国家视角不能直接互换。新加坡市场标题规模较小，但密度更高、价格更贵、供给更受限。马来西亚是更大的建设故事，由柔佛的土地和电力可得性驱动。印尼，尤其是雅加达和巴淡，把本土数字需求增长与新加坡跨境外溢结合在一起。后文做估值时，最干净的结论是：DayOne
              的 SAM 最适合被视为新加坡、柔佛、巴淡及邻近东南亚都市圈内的跨境超大规模与批发需求，而不是整个亚洲基础设施资本开支。
