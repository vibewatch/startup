      - number: '1.4'
        title: 融资栈、所有权演变与主要承销缺口
        blocks:
          - type: paragraph
            body: >-
              公开资本形成证据，是 DayOne 值得关注的最清晰理由。官方历程页面称，公司先后完成约 US$587 million A 轮和 US$1.2 billion B 轮融资，随后在 2025 年 12 月叠加最高
              €1 billion 的夹层融资。2026 年 1 月 C 轮公告又披露超过 US$2.0 billion 新股权融资，估值较上一轮溢价 100%；2026 年 6 月最终交割把 C 轮总募资推至 US$4.5
              billion，并让 Coatue 和 Hillhouse 成为两大股东。同一批公告还点名 INA 和 Achi Capital 为重要参与方；早前报道提到的投资人还包括 SoftBank Vision
              Fund、Ken Griffin 和 Baupost。


              GDS 的申报文件是另一条关键资本线索，因为它揭示了剥离机制。B 轮在 2024 年 12 月 31 日交割后，GDS 称其 DayOne 持股从 52.7% 降至 35.6%，DayOne
              出表；出表时，公司持有 RMB9.93 billion 现金和 RMB10.42 billion 总债务。这意味着 DayOne 进入 2025
              年时有可观流动性，也背着可观杠杆，符合园区开发的资本密集特征。它也说明，DayOne 关于独立性的公开叙事在会计意义上成立，即便后续媒体报道显示 GDS 仍是重要少数股东。


              负面或谨慎信号集中在估值、变现和披露缺口上。与 Reuters 和 Bloomberg 相关的行业报道称，DayOne 在 2024 年底寻求融资时估值约 US$4-5 billion，2026 年 1 月 C
              轮前后价值约 US$10 billion，并在 2026 年 6 月瞄准 US$20 billion IPO 估值；潜在路径包括美国—新加坡双地上市，甚至出现 MGX
              收购兴趣。这些估值标记也许都能由快速融资节奏和 AI 基础设施稀缺解释，但它们凸显标题估值相对公开证据基础跑得多快。具名客户、收入、EBITDA、各园区利用率和正式 IPO
              文件都还没有出现在公开来源中。结果是一家公司拥有异常可见的资本通道，却有异常不透明的单位经济。
