  - id: TV005
    title: 破坏投资假设与放弃触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资假设的传导
      - 行动含义
    rows:
      - - 新加坡时间表明显滑后
        - 核心新加坡项目或容量计划明显后移
        - 高端市场稀缺性不再转化为近期变现
        - 下调估值区间，并提高执行折价
      - - 马来西亚电力或可再生能源受挫
        - TNB、电价或送电问题拖累 Johor 爬坡
        - 最大增长引擎受限，打击转化和市场情绪
        - 立即按基准 / 悲观区间重新承销
      - - 已预订向可计费转化走弱
        - 多个季度内，可计费电力未能跟上承诺
        - 积压订单通向盈利的收入桥断裂
        - 将当前 IPO 估值视为缺乏支撑
      - - 客户集中度意外偏高
        - 头部租户敞口高于公开市场投资者预期
        - 收入韧性和议价能力恶化
        - 应用集中度折价或放弃
      - - 融资窗口收紧
        - IPO 或后续融资市场关闭，或重估基础设施风险
        - 重资本增长模式失去最容易的规模化路径
        - 转向下行保护，并下调目标入场价
      - - IPO 时间表推迟到 2027 年以后
        - 上市仍停留在探索阶段，缺少经审计的上市公司材料
        - 风险仍未关闭，叙事溢价衰减
        - 避免按头部标价承销
    notes: 这些触发因素最可能让投资判断迅速从“值得观察”转为“按当前价格应避开”。
    claimRefs:
      - CV037
      - CV040
      - CV041
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 独立经审计报表
        - 公开材料中没有 DayOne 独立损益表、资产负债表或现金流包
        - 公开市场定价不能只靠分部摘要稳稳站住
        - 索取 FY2024、FY2025 及最新中期的独立经审计报表
      - - 客户集中度明细
        - 未公开头部客户在收入、已预订 MW 或可计费 MW 中的占比
        - 超大规模客户集中会把高溢价故事变脆弱
        - 按站点、收入、已预订 MW 和可计费 MW 索取前 10 大客户敞口
      - - 债务结构与契约
        - 资产层面和平台层面的契约结构未公开
        - 股权价值对杠杆和再融资机制高度敏感
        - 索取债务到期阶梯、抵押品地图和契约包
      - - 股权结构 / 优先权结构
        - 未公开优先权、参与权或 IPO 悬置压力
        - 优先权结构会显著改变普通股的上行和下行
        - 索取完整股权结构表和清算优先权摘要
      - - 电力分配与许可里程碑
        - 未公开新加坡、Johor、泰国和芬兰的站点级跟踪表
        - 估值取决于能否把战略土地和承诺转成投运容量
        - 索取包含电力、许可和 RFS 里程碑的项目控制看板
      - - IPO 准备材料包
        - 已审材料中没有公开申报、治理材料包或董事会就绪证据
        - 如果上市公司准备度不足，上市落地前溢价就可能消退
        - 索取上市工作流草案、治理材料和报告日历
    notes: 这些尽调问题按其对当前指示性价格下估值判断的直接影响排序。
    claimRefs:
      - CV029
      - CV031
      - CV038
      - CV039
      - CV045
      - CV046
