      - number: '1.3'
        title: 物理版图、容量建设与市场进入里程碑
        blocks:
          - type: paragraph
            body: >-
              对一家私有基础设施公司而言，DayOne 的版图证据异常扎实。新加坡的锚点来自 2023 年试点 DC-CFA 配额和 21 Jalan Buroh 场地收购；公司称这些带来约 20 MW
              已获批容量，第一阶段目标在 2026 年 Q4 左右投入服务。柔佛是当前披露的最大运营基地：DayOne 称其在 Nusajaya Tech Park 和 Kempas Tech Park 的运营容量超过 478
              MW；其可再生能源公告也把马来西亚称为公司全球最大运营版图。巴淡则是 SIJORI 的印尼一侧，以 Nongsa Digital Park 为中心，并在特殊经济区内与 INA 合作。


              SIJORI 之外，DayOne 已明显从区域试验走向更广的平台扩张。公司正式宣布在泰国投入 US$1 billion，春武里园区规划 180 MW 电网容量和 122,000 平方米空间。芬兰方面，DayOne
              公开披露了 €1.2 billion 的 Lahti 投资，以及与本地伙伴 Hyperco 合作的 Kouvola 项目；其芬兰市场页面目前把合并平台写成 281
              MW。外部行业报道又把欧洲故事向前推进，描述了赫尔辛基以北 560 MW 的 Nurmijärvi 项目。即便这些计划成熟度并不完全一致，官方、行业和融资来源共同支撑了方向性的扩张叙事。


              不过，容量口径仍未完全打通。DayOne 官方页面给出市场层面的数字，比如柔佛 478 MW、芬兰 281 MW、Nongsa Digital Park 已交付 34 MW、春武里规划 180
              MW；融资稿又引用约 1 GW 已锁定客户承诺和超过 1.5 GW 总预订。外部媒体则把图景简化为超过 500 MW 已投运和在建容量，再加 500 MW
              未来开发容量。这些数字可以并存，但没有放进一张经审计的瀑布表里。对私有超大规模开发商来说，这就是典型尽调问题：扩张主张看起来真实，但实时、已签约和规划容量的精确台账仍需对齐。
