      - number: '4.3'
        title: 资本结构与资本强度：股权、夹层与赞助方变现
        blocks:
          - type: paragraph
            body: >-
              资本形成是 DayOne 财务故事中最清晰的部分。DayOne 官方材料和 GDS 申报文件显示，这个平台在短时间内叠了多层融资。DayOne 在 2024 年完成 US$672 million A 轮，随后在
              2024 年末完成 US$1.2 billion B 轮；2025 年 12 月拿到 €500 million、可扩至 €1 billion 的夹层融资；2026 年 1 月宣布首批超过 US$2.0
              billion 的 C 轮；到 2026 年 6 月，C 轮最终交割达到 US$4.5 billion。GDS 自身申报文件还显示，它在 1Q26 减持 DayOne 股份套现 US$385
              million，同时通过可转换优先股发行募集 US$300 million。


              这套资本栈不是装饰，而是对真实基础设施强度的回应。GDS 对 DayOne 的披露显示，净债务从 FY2024 的 US$63.1 million 升至 FY2025 的 US$1.33 billion，并在
              1Q26 达到 US$1.41 billion。市场来源也解释了为什么这并不意外：针对马来西亚和印尼的分析师工作仍指向很高的每 MW 资本成本；DayOne
              自身的可再生能源和芬兰发布也显示，在现金流完全收割前需要大量前期基础设施承诺。因此，这种融资组合与商业模式匹配，但也意味着不能只看股权标题就判断资本充足。


              最尖锐的谨慎点是，DayOne 公司层面的公开现金、利息负担、债务到期结构和项目层面偿债条款仍未披露。GDS 也提醒，其仍暴露于此前为 DayOne 融资提供的担保和承诺。承销人因此能较好看见 DayOne
              的融资动能，但还无法完整判断这笔资金是否足以支持下一波已签约增长，而无需进一步稀释或再融资。
