      - number: '7.2'
        title: 电力、水和多国交付构成主要运营风险簇
        blocks:
          - type: paragraph
            body: >-
              DayOne 的运营模型本质上是一台资源转化机器：把土地、电网接入、可再生能源合同、冷却设计和施工执行，转化为可计费兆瓦。公开证据显示，马来西亚现在是这个模型最重要的体现。DayOne 与 TNB 的合作覆盖约
              1.5 GWp 太阳能容量和 2.2 GWh 储能；管理层称 DayOne 是 TNB 最大客户，同时把马来西亚扩成公司最大运营足迹。这是竞争强项，但也形成了一个重要到不能忽视的单一公用事业对手方依赖。


              水和冷却强度与电力一样关键。新加坡数据中心市场公开被描述为土地、电力和水都受限；DayOne 自己的可持续叙事也反复强调水效率和替代冷却方案。在 Johor，规模已经可观：DayOne 称其在 Nusajaya
              Tech Park 和 Kempas Tech Park 运营超过 478 MW。如果这条走廊出现电网延迟、费率变化、环保收紧或施工瓶颈，冲击会直接落在组合中已经最大的部分。


              更大的执行问题是同步性。DayOne
              同时在新加坡、马来西亚、泰国和芬兰扩张。即便每个项目单独看都合理，公司仍必须在多个司法辖区同时排齐设备、审批、电力、租户和融资。一个本地问题拖慢整体积压订单变现的概率因此上升。
