  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：观察公司，而不是盯着指示 IPO 价格
        blocks:
          - type: paragraph
            body: >-
              DayOne 有真实投资逻辑。公司身处亚洲最强基础设施需求走廊之一，作为私营运营商已筹到非同寻常的大额资本，并正受益于 AI、云和新加坡外溢需求的组合——这正是当前公开市场投资者愿意奖励的东西。Johor
              增长、马来西亚有电力保障的扩张，以及新加坡稀缺性，都说明 DayOne 应该相对普通托管房东享有一定溢价。


              问题不在 DayOne 是否有意思。问题是当前指示价格是否已经把太多上行资本化。据报道的 $20 billion IPO
              目标，会早于投资者拿到独立审计报表、客户集中度披露、清晰公开股权结构视图，或承诺兆瓦能足够快转成已变现负载以支撑公开市场溢价的证明。公司显然能成功为增长融资，但在估值章节，价格纪律比公司质量更重要。


              因此，我的建议是观察，而不是按头条价格追买。业务仍可以是高质量观察名单标的；如果收入规模、转化和上市准备度改善，这个估值标记也可能变得可辩护。但按今天的指示价格，估值要求投资者在公开市场级披露出现之前，先为公开市场级结果付费。
