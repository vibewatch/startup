        - 升级前要求经审计报表和集中度披露
      - - 风险评级
        - 高——估值取决于转化、电力执行和融资条件
        - 中高
        - 任何承诺前，先压力测试基准和悲观情景
      - - 估值立场
        - 激进——溢价有部分合理性，但全额估值标记尚无支撑
        - 中
        - 以低于指示估值的基准情景价值区间为锚
      - - 入场纪律
        - 倾向于较指示价格 25%+ 折扣，或显著更好的披露
        - 中
        - 没有新的投资测算证据，不追 IPO 热点
    notes: 建议明确对价格敏感。这里不是否定公司；而是等待当前指示估值和披露包。
