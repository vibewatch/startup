      - number: '3.2'
        title: 按竞争者类别画像：各类对手最锋利的地方
        blocks:
          - type: paragraph
            body: >-
              Equinix 仍是这条走廊里最强的生态在位者。其亚太平台横跨九个国家，拥有 63 个数据中心和互联设施；材料明确把 AI 就绪托管、生态密度和 xScale 式大容量连接在一起。Digital Realty
              的竞争方式不同：其新加坡版图强调密集客户和网络生态；更广的亚太平台声称拥有 20+ 个数据中心、230+ 个连接客户、150+ 个服务提供商和 30+ 个云提供商。合在一起，Equinix 和 Digital
              Realty 是最可能在买家价值由云邻近性、交叉连接深度和区域架构灵活性定义，而非单一最大园区定义时胜出的对手。


              AirTrunk、PDG 和 Bridge 更像直接的超大规模对手。AirTrunk 把自己营销为亚太和中东的超大规模伙伴；近期新闻显示，其柔佛版图在马来西亚扩大到 700 MW
              以上，并有大型绿色融资包支持，早期园区几乎已全部签约。PDG 的马来西亚材料展示出明确的新加坡—柔佛—巴淡姿态：JH1 为 200 MW，JH2 规划 300 MW；Bridge
              则强调柔佛邻近新加坡、先进冷却、模块化交付，并声称拥有区域内最大超大规模园区之一。这些玩家与 DayOne 最贴身竞争的问题是：谁能在同一走廊里规模化交付 AI 就绪 MW。


              NTT、STT GDC、Keppel 和 Nxera 带来的是不同强项。NTT 强调全球覆盖、150+ 个设施、2,000MW+ 关键 IT 负载和大范围网络覆盖。STT GDC
              强调跨成熟与新兴市场的高能效、多站点平台。Keppel 把批发、定制建设和超大规模资质，与面向新加坡式资源约束的基础设施创新混在一起。与此同时，Nxera 和 TM 展示了本地在位者如何借伙伴关系进入走廊：一个
              64 MW AI 就绪柔佛项目与 JS-SEZ 叙事挂钩。对 DayOne 来说，后果是没有哪一类对手在所有维度都弱；竞争是多维的，买家会按工作负载在生态、MW 规模、可持续性或资产负债表信心之间优化。
