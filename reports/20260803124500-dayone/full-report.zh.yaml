      - number: '1.2'
        title: 领导层、治理信号与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开的领导层披露有内容，但口径很窄。官网最突出的是董事长 Lim Ah Doo 和 CEO Jamie Khoo，反复出现的项目公告也把 Jimmy Yu 放在战略和业务开发角色里。Lim 带来 Olam、STT
              GDC、EDB Investments 和银行任职积累的高级董事会信誉；Jamie Khoo
              则是公司的运营面孔，出现在新加坡、泰国、能源和融资公告中。第三方活动和演讲材料支持官方履历：她拥有二十多年领导经验，此前在 ST Telemedia 任职；DayOne 自身材料把她的 CEO 任命时间写到
              2024 年 3 月。


              因此，治理信号是利弊并存。正面看，DayOne
              不是匿名壳公司：它披露了具名董事会和高管领导、面向政府的发言人，并反复与主要投资人、公用事业公司和监管方同框。弱项在于，相比正在讨论的资本和基础设施规模，公开台面上的团队显得偏薄。官网没有给出 VC
              式完整董事会名单、委员会架构或股东权利摘要；在项目规模已经很大的情况下，也没有点名 CFO 或更广的高级运营班底。这让关键人物依赖——尤其是 Jamie Khoo
              在资本市场、客户信号和政府关系上的作用——成为承销问题，而不是脚注。


              领导层信息也与平台叙事紧紧绑在一起。DayOne 反复称团队拥有二十多年行业经验，并有建设亚洲最大数据中心业务之一的记录。考虑到 GDS 血统以及 Lim 和 Khoo
              的履历，这一说法方向上可信；但在更完整的管理层名单、薪酬框架和治理包进入数据室或申报文件之前，投资人仍应把它视为战略信号。公开证据足以证明顶层领导可信且有经验；还不足以消除执行集中风险。
