      - number: '4.4'
        title: 财务结论：增长证据真实，但承销仍需要私有数据
        blocks:
          - type: paragraph
            body: >-
              正面的财务案例很直接。DayOne 披露的收入基数增长很快，调整后 EBITDA 在改善，已承诺电力管线很大，并能进入该领域最强的私募资本栈之一。它已经证明自己能反复获得 A、B、C
              轮股权、夹层资本、赞助方流动性事件，以及支持长期园区经济性的可再生能源合同。对私有基础设施平台来说，这是异常强的商业和融资动能证据。


              负面案例是，太多核心承销指标仍缺失。公开证据没有披露 DayOne 手头现金、月度消耗、营运资金需求、偿债覆盖、加权平均客户期限、各市场实现价格、维护性资本开支、项目层面回报或客户集中度。即便 GDS
              披露很有价值，它仍是股东视角，而不是完整的 DayOne 独立财务包。它们足以说明公司正在扩张且融资充足；却不足以确认增长的确切质量和耐久性。


              实务结论是好坏参半但偏正面。DayOne 的财务故事足以支撑可信的增长和规模叙事，也足以支撑进一步尽调 IPO
              路径。若没有管理层直接披露现金、债务、合同经济性和逐园区爬坡假设，它还不足以支撑一份干净、传统的承销备忘录。
