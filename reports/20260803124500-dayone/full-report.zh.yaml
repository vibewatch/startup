      - number: '2.4'
        title: 增长驱动、采用约束及其对 DayOne 的含义
        blocks:
          - type: paragraph
            body: >-
              主要驱动因素很清楚，而且彼此强化。AI 和云资本开支在加速，APAC 管线快速扩张，具备电力确定性的二线市场吸引了不成比例的投资人关注。Cushman 测得 2026 年上半年 APAC 开发管线为 26,455
              MW，空置率仍小幅降至 10.3%；CBRE 则称 2026 年全球超大规模云厂商资本开支合计应超过 US$400
              billion。这个背景解释了为什么柔佛、巴淡和曼谷即便没有新加坡的存量地位，也被拉进下一轮建设周期。它也解释了 DayOne 为何押注能提供高密度、AI 就绪扩张的园区，而不是泛化容量。


              约束同样重要。几乎每一个主要市场视角里，电力可得性现在都是首要瓶颈。用水强度和冷却设计正在成为更显性的准入问题，尤其在新加坡和柔佛。建设成本仍高或还在上升；Arizton 的 2026
              年市场工作显示，马来西亚约为每 MW US$8-10 million，印尼约为每 MW US$8-9 million。马来西亚 2025 年 7 月电价调整给 100 MW 以上园区增加了另一层经济敏感性；CNA
              和 MIDA 也都指出，如果柔佛要可持续地吸收数 GW 增长，就需要更强的水务和电网基础设施。


              对 DayOne 来说，结论是战略上扩张，但必须守纪律。公司站在正确走廊里：市场正在转向新加坡邻近、具电力优势、AI
              就绪的园区。但这个市场里，估值应奖励对电力、水和许可约束的执行，而不只是标题需求。开发商若能锁定电力、在政策演化中快速推进，并让客户贴近云和海底光缆枢纽，就能拿下大型工作负载。开发商若只是宣布在受限或政治敏感地区增加容量，未必能赢。后续章节因此应检验
              DayOne 的客户证据、电力成本、已签约交付排期，以及它在这条走廊供给栈中的真实位置。
