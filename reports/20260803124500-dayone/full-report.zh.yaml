          values:
            - label: ''
              tone: neutral
            - label: AI 芯片政策冲击
              tone: warning
            - label: 马来西亚公用事业 / 电力中断；新加坡容量门槛
              tone: critical
            - label: ''
              tone: neutral
        - label: 高影响
          values:
            - label: ''
              tone: neutral
            - label: 泰国审批选择性；芬兰预租扩张
              tone: warning
            - label: 从预订到可计费的转化滞后；客户集中度不透明
              tone: warning
            - label: 私营公司披露缺口
              tone: warning
        - label: 中等影响
          values:
