  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、在位者、相邻玩家与走廊替代方案
        blocks:
          - type: paragraph
            body: >-
              DayOne 面对的不是一个单体的“数据中心市场”。它竞争的是一条走廊，买家可以在几种不同运营模式之间选择。Equinix 和 Digital Realty
              这类互联密集型在位者，会在客户重视成熟云和运营商生态、合规深度、跨市场连接性时胜出。AirTrunk、Princeton Digital Group 和 Bridge Data Centres
              这类聚焦超大规模的开发商，在大型园区交付、AI 就绪密度，以及快速把土地和电力转成已承诺 MW 的能力上与 DayOne 更直接竞争。NTT、STT GDC 和 Keppel
              等多元化托管平台又构成另一类竞争：它们能把区域运营历史和企业关系，与更广的产品目录以及某些情况下的本地政策关系配在一起。


              公开市场证据显示，这个赛道为什么拥挤。Arizton 统计东南亚有 149 家运营商、479 个现有或即将上线设施；CBRE 和 Cushman 都描述了一个超大规模与 AI
              需求仍强、但买家仍有多个场地和运营商选择的区域。具体到新加坡—柔佛走廊，MIDA 和 Invest Johor 材料指向一个已经包括 Equinix、Nxera/TM、AirTrunk
              和其他大型项目的集群。因此，DayOne 位于正确地理位置本身并不能带来稀缺性；真正的问题是，哪些运营商能最快把生态接入、电力确定性、可持续设计和赞助方支持的扩张组合起来。


              替代集合也重要。一些工作负载会留在连接多云提供商的企业私有 AI 部署里，而不是转向单一超大规模园区运营商。Digital Realty 的 Cyberjaya 发布材料明示了这一点：它瞄准私有 AI
              和多云推理客户；Equinix 和 NTT 也继续营销运营商中立互联和混合云密度，而不是只卖原始土地储备。这意味着 DayOne
              不仅要在园区规模上竞争，还要证明自己能比互联密集型或企业中心型对手更好捕获哪些工作负载和买家行为。
