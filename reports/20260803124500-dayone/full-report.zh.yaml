  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 超大规模与批发托管
        - 园区壳体、供电系统、冷却、机架、网络邻近性、跨境容量
        - 按单机架销售的零售托管机柜、通用企业机房
        - 超大规模云厂商、新型云服务商、大型企业、主权买方
        - DayOne 核心市场，因为公司销售高容量园区和区域规模。
      - - 面向 AI 的区域扩张
        - 可支持液冷的机厅、高密度电力、GPU 导向建设、快速交付园区
        - 没有 AI 或云邻近性的传统低密度企业机房
        - 云平台、AI 基础设施团队、大模型用户
        - 据 CBRE 和 Cushman，这是 APAC 对估值最敏感的增长口袋。
      - - 新加坡锚点市场
        - 高端批发容量、光缆密集登陆点、主权与区域总部工作负载
        - 不具备新加坡连接优势的低成本同质化土地项目
        - 区域总部、受监管买方、高端超大规模需求
        - 即便增量供给转向别处，它仍是重要控制点。
      - - 柔佛 / 巴淡外溢市场
        - 土地充足、电力有优势，并承接新加坡工作负载的园区
        - 没有跨境延迟优势的纯本土机房
        - 延展新加坡中心架构的超大规模云厂商和企业
        - DayOne 在东南亚最相关的扩张区。
      - - 本土数字平台和主权云
        - 国别云、政府和数字经济项目
        - 不会转化为数据中心需求的硬件制造或芯片制造支出
        - 政府、受监管企业、国家级数字平台
        - 间接需求渠道，印度尼西亚和马来西亚尤其明显。
      - - 广义数字基础设施邻近领域
        - 支撑数据中心的海底光缆、能源基础设施和生态服务
        - 无法直接通过数据中心变现的无关电信或硬件类别
        - 公用事业、政府、基础设施基金
        - 重要背景层，但口径太宽，不能当作 DayOne 的直接 SAM。
    notes: 本章把超大规模容量的直接变现面，与战略上重要但不能一一映射到 DayOne 收入的广义基础设施邻近领域分开。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM017
      - CM038
      - CM039
