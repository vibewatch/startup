  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与公开牵引：增长可见，组合披露不完整
        blocks:
          - type: paragraph
            body: >-
              DayOne 的公开收入模型更接近基础设施租赁，而不是软件订阅经济。DayOne 官方材料强调超大规模和大企业容量；GDS 申报文件和 DayOne 相关披露则把已承诺和可计费 IT
              电力作为主要运营视角。这强烈提示了收入如何形成：客户先签下电力和容量，项目随时间进入投运和可计费状态，收入再跟随已占用或已激活空间的爬坡释放，而不是像软件那样即时激活。


              最好的公开牵引证据来自 GDS 在 2025 年年报和 1Q26 业绩演示中对 DayOne 的披露。这些材料显示，DayOne 收入从 FY2024 的 US$178.1 million 升至 FY2025 的
              US$484.3 million，并在 1Q26 达到 US$220.5 million；调整后 EBITDA 从 US$56.2 million 升至 US$180.7 million，再到 1Q26 的
              US$89.7 million。同一批披露还显示，已承诺 IT 电力从 FY2024 年末的 430 MW 跳至 FY2025 的 1,250 MW，并在 1Q26 达到 1,526
              MW。这个模式意味着公司仍处在重建设、重爬坡阶段：容量承诺大幅领先于实时可计费电力，这正是扩张中的超大规模平台在完全变现前应有的样子。


              问题在于，公开收入质量仍只露出一部分。DayOne 和 GDS 都没有按地理、客户、合同期限或每 MW 实现价格给出清晰组合。证据足以说明 DayOne
              在快速扩张，但不足以判断这种增长是否靠激进让利、异常集中的租户合同，或为快速填满园区而设计的早期低价换来的。
