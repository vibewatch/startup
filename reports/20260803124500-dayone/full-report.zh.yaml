      - number: '7.4'
        title: 财务风险主要是转化、杠杆和持续资本依赖
        blocks:
          - type: paragraph
            body: >-
              DayOne 的财务风险画像是典型的超大规模建设扩张，但规模已经大到必须重视。公司已获得大量股权和资产层融资，但业务看起来仍在完整收入收割之前为增长投入资金。GDS 的 DayOne 披露显示，净债务从
              FY2024 的 US$63.1 million 上升到 FY2025 的 US$1.33 billion，并在 1Q2026 达到 US$1.41 billion。同期，已承诺 IT 电力从 430 MW 增至
              1,526 MW，可计费电力从 121 MW 增至 474 MW。这个缺口不一定是问题——按需求建设的平台本就应有未来承诺负载——但它让通电和客户迁入成为增长叙事与已实现经济性之间的核心桥梁。


              公开文件也显示公司继续依赖融资市场。PR Newswire 称，即使 Series C 完成后，DayOne
              仍可能寻求更多公开或私募市场融资选择；芬兰夹层融资则显示，公司愿意在资产层叠加结构化资本。对快速扩张平台来说这很理性，但意味着估值和战略仍暴露于融资条件，而不只是运营表现。


              对投资者来说，关键纪律是监控，而不是讲故事。投资逻辑可以承受嘈杂的季度建设更新；但如果出现新加坡进度延误、马来西亚电力受挫、预订到可计费转化乏力，或融资窗口关闭，就不应在没有重大重估的情况下消化。
