  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户工作流视角下的产品形态
        blocks:
          - type: paragraph
            body: >-
              DayOne
              卖的不是泛化零售托管产品。其官方材料始终把公司描述为下一代数字基础设施提供商，服务需要快速部署、规模、连接性和可持续性的超大规模云厂商与大企业。按客户工作流看，产品在任何服务器开机前就开始了：DayOne
              识别稀缺市场，锁定电力和土地，为高密度计算设计园区，整合连接性和云邻近性，再把资产作为客户的长期数字公用事业来运营。


              公开资产地图支持这一解读。DayOne 现在列出的活跃市场覆盖新加坡、柔佛、巴淡、大曼谷、香港、东京和芬兰。这些资产并不统一。香港被呈现为具备具名认证的运营商中立、多云城市枢纽。东京是一个低延迟扩张站点，规划
              IT 容量 80 MW。芬兰是由可再生能源驱动的超大规模平台，绑定余热回收和零淡水冷却。泰国是 180 MW 两阶段开发项目，明确强调液冷。新加坡仍是较小但具战略意义的溢价节点，受 DC-CFA
              流程塑形。因此，这个产品不是到处复制的单一物理模板，而是在同一运营理念下形成的一组面向工作负载的交付模式。


              这种组合视角对尽调很重要。买家选择 DayOne
              的香港或新加坡资产，可能是在优化连接性、认证和溢价邻近性。买家选择芬兰或柔佛，是在优化电力规模、能源经济性和扩张跑道。买家选择泰国或东京，则是在战略重要市场购买未来容量。因此，评估 DayOne
              产品的正确方式，是把它看成一组基础设施交付模式，而不是一个静态数据中心 SKU。
