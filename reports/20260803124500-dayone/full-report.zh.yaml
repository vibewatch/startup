      - number: '2.2'
        title: 地理市场结构：新加坡为锚，柔佛和巴淡承接外溢
        blocks:
          - type: paragraph
            body: >-
              需求地理是 DayOne 市场最关键的结构性特征。新加坡仍是溢价锚点，因为它拥有海底光缆连接、成熟监管机构和云区域密度。Arizton 仍把它列为东南亚具有战略重要性的枢纽之一，拥有 44 个运营中的托管设施、6
              个即将上线的设施，以及很高的批发托管渗透率。但土地稀缺、电力限制、可持续性要求，以及 2019-2022 年暂停审批留下的监管记忆，都限制了扩张路径。政府的 DC-CFA
              流程以校准方式重新放开供给；但现在，溢价经济性与有限绿地容量、严格可持续性筛选并存。


              柔佛是最清晰的外溢受益者。CNA、MIDA、CBRE 和 Arizton 从不同角度描述了同一模式：运营商想要新加坡的客户基础和光缆邻近性，但柔佛提供土地、更低能源成本、更快建设潜力，以及容纳超大型 AI
              就绪园区的空间。到 2025 年底，Arizton 将柔佛即将上线的电力管线放在约 4.0 GW；MIDA 和 Invest Johor 则强调，该州正在吸收马来西亚多数在役 IT 容量和投资批准。JS-SEZ
              叙事进一步加深了这一定位：它把跨境经济一体化制度化，而不是把柔佛视为机会主义的溢出区。


              巴淡在印尼一侧扮演类似角色，但阶段更早。Arizton 的印尼市场报告明确把巴淡定位为新加坡的互补延伸，因为它距离新加坡约 20 公里，可以提供低延迟离岸容量。DayOne 自己的市场页面，以及 MIDA 材料中
              MDEC 背书的评论，也讲的是同一件事。由此形成的市场结构是：新加坡是溢价控制点，柔佛是扩张最快的超大规模腹地，巴淡是同一走廊的印尼战略支点。对 DayOne
              来说，这种跨境几何比任何单一国家市场规模数字都更重要。
