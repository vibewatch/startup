      - number: '5.2'
        title: 架构、运营模式与关键依赖
        blocks:
          - type: paragraph
            body: >-
              DayOne
              的公开材料给出的工程颗粒度，高于私有平台常见水平，尽管不少细节仍未披露。架构先从站点和电网策略搭起。芬兰项目卖点很明确：可再生电力、稳健电网、冷凉气候、余热回收和零淡水冷却。东京围绕电力、土地和通往东京核心区的低时延接入展开。香港被描述为运营商中立、多云交换枢纽。泰国按
              180 MW 电网容量、分阶段交付和先进液冷来设计。马来西亚通过 DayOne 的 CRESS 条款清单和更大的 TNB
              合作，把能源架构单独铺了一层：可再生能源签约、电网规划、光纤或绿色通道流程，直接嵌进园区的建设和运营。


              公司自己的话术指向一套分层运营模型：通过收购或合作拿下战略站点，锁定公用事业接入，部署高密度冷却和供电基础设施，接入区域云与运营商生态，再用枢纽—辐射模式扩到邻近市场。PTC’25
              访谈可作为从业者社区代理，因为它把内部逻辑讲得很明白：推向市场速度、以客户为中心的部署、SIJORI 市场打造和供应链优化，都是操作系统的一部分。马来西亚明确称 9
              个月从签约到建成，这一点尤其关键，因为它把模糊的执行优势，落成了一个具体速度信号。


              依赖也同样清楚。DayOne 靠 TNB 等公用事业方、IMDA 等监管机构、工业园区或投资主管部门、芬兰 Hyperco 等本地伙伴，以及 AWS、Google Cloud、Azure 和 Oracle
              记录下的大型云区域生态。因而 DayOne 的服务不只是一栋楼，而是在能源、土地、网络、合规和客户部署节奏之间做编排的一层。
