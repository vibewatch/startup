      - number: '3.4'
        title: 护城河耐久性、商品化风险与负面证据
        blocks:
          - type: paragraph
            body: >-
              负面证据不是 DayOne 选错市场，而是正确市场已经挤满了可信、资本充足且叙事重叠的运营商。Equinix 营销 AI 就绪性能、合规和跨境企业流量。Digital Realty 营销互联、Data
              Gravity 和私有 AI 架构。AirTrunk 和 PDG 营销超大型 AI 就绪园区，叠加可持续性和云客户动能。Bridge 营销先进冷却和柔佛邻近性。Keppel 和 STT GDC
              营销可持续性和广泛运营深度，Nxera 则受益于本地电信连接和政策支持。换句话说，DayOne 并不天然拥有 AI 就绪或可持续性的叙事。


              最强的公开竞争压力证据来自资本密度和预先承诺。AirTrunk 的绿色融资柔佛扩张、PDG 的 500 MW 马来西亚管线，以及 Equinix、Digital Realty
              等上市运营商的存在，都说明资本通道本身就是活跃的竞争武器。在这些平台之间选择的买家，不太可能奖励资产负债表最弱或交付路径最慢的一方。同时，透明定价仍很稀缺：所审阅的公开材料几乎都指向定制合同、谈判租赁结构和不透明的实际价格。这让外部很难判断
              DayOne 到底靠经济性、可持续性、服务赢单，还是只是因为某个对手市场暂时受限。


              因此，护城河耐久性取决于执行，而不是品类独特性。如果 DayOne 能锁住电力和水，按时交付 AI
              就绪园区，并让客户贴近新加坡云和光缆重力，同时不用支付最高的新加坡成本基底，它可以非常有竞争力。否则，这条走廊有足够多的对手运营商，客户需求可以快速改道。下一步尽调应拿到真实赢单 /
              输单历史、客户重叠数据、条款清单，以及 DayOne 的走廊主张是否在实际交易中替代了 Equinix、Digital Realty、AirTrunk、PDG、Bridge 或新加坡根基的在位者。
            claimRefs:
