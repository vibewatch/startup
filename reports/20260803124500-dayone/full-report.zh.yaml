      - number: '3.3'
        title: 切换成本、锁定、多归属与分销权力
        blocks:
          - type: paragraph
            body: >-
              这个市场的切换成本有分量，但并非绝对。买家一旦承诺某个园区、电力块和互联架构，迁移就昂贵且耗时。但在承诺之前，这条走廊仍提供相当多的运营商选择。Cushman 庞大的 APAC 管线和 Arizton
              的运营商数量说明，市场并非没有容量；CBRE 的新加坡价格和低空置率则说明，溢价节点仍保有稀缺价值。实际操作中，买家仍可多归属：区域架构可以把某些推理或企业工作负载放在 Digital Realty 或
              Equinix，把超大训练或批发块预留给 AirTrunk、PDG 或 Bridge，并在监管或关系重要的地方使用 Keppel、NTT 或 Nxera 等与新加坡相连的在位者。


              因此，分销权力很关键。Equinix 和 Digital Realty 在运营商、云和客户生态方面拥有最强公开信号。NTT 是所审视集合中全球企业版图最广的公司。Keppel 和 STT GDC
              带来区域运营信誉和扎根新加坡的机构资源。AirTrunk 和 PDG 这类超大规模专家，则用另一套锁定逻辑反击：如果它们早早预租大电力块，并成为 AI
              就绪部署的最快路径，即使生态密度较轻，也能赢。AirTrunk 现有柔佛园区接近满签约尤其重要，因为它展示了云需求能在后来者抵达市场前多快被拿走。


              对 DayOne
              来说，护城河不能只靠位置匹配。公司要么在走廊设计和客户服务上击败互联在位者，要么在电力、速度和可持续性上击败超大规模专家。多归属也限制了终局锁定：客户可以把工作负载分散在新加坡、Cyberjaya、柔佛、巴淡和雅加达。这意味着承销人应寻找真实的赢单
              / 输单证据、预租时间点、合同期限和客户扩张行为，而不是假设基础设施粘性会自动带来竞争安全。
