chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台与核心运营逻辑
        blocks:
          - type: paragraph
            body: >-
              DayOne
              将自己定位为总部位于新加坡的全球数字基础设施平台，面向需要快速部署、高密度容量，以及进入受限或新开放市场的超大规模云厂商和大企业。公司在“关于”、“解决方案”和“市场”页面反复强调的价值主张，不是简单转售托管空间，而是速度、模块化交付、AI
              就绪技术设计和跨境市场创造。核心战略框架是 SIJORI：新加坡、柔佛和巴淡被包装成一条协同的枢纽—辐射走廊，新加坡提供连接性和生态深度，柔佛提供电力与土地规模，巴淡提供特殊经济区成本结构和扩张余量。


              这个叙事很关键，因为 DayOne 不是把自己推成单一国家的机房房东。公开材料描述的是一个多市场平台，覆盖新加坡、柔佛、巴淡、大曼谷、香港、东京和芬兰；2026 年 6
              月融资公告还把西班牙加入前瞻市场清单。因此，官方故事的主轴是有意创造市场：以新加坡作为锚点门户，向成本更低的邻近容量区扩张，再把模式复制到其他供给不足的地区。外部媒体报道大体印证了同样的版图，也印证了同一条论点：DayOne
              想在需求完全到来之前先拼出区域园区，从而拿下云和 AI 工作负载。


              最强的身份事实支撑充分。官方披露把总部放在新加坡，称 DayOne 成立于 2022 年，并反复把公司定义为下一代超大规模平台，而非零售托管商。GDS 补上了重要的历史桥梁：其 2025 年 3
              月业绩称，DayOne 此前名为 GDS International 或 GDSI，并在 2024 年 12 月 B 轮交割后出表。合在一起看，第一章的底层事实相当清楚：DayOne
              是一家剥离后的、新加坡主导的超大规模平台，靠资本密集型、多国家园区开发追逐 AI 与云容量增长。
