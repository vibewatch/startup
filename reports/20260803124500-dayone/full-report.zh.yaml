  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 依赖图显示哪些外部节点对 DayOne 增长和变现影响最大。公用事业、监管方、金融资本和超大规模云厂商需求平台都靠近模型中心。
    data:
