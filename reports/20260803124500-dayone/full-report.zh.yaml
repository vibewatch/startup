        - 托管、互联和大规模容量均为议价；留存来源未看到公开超大规模价目表
        - 运营商中立生态、AI 就绪站点、合规能力、云接入
        - 留存来源未公开标准化实际价格、批量折扣和 xScale 经济性
        - 买方愿为生态密度或低延迟企业触达支付溢价时，Equinix 更容易赢。
      - - Digital Realty
        - 定制批发 / 混合架构模式；留存来源未看到公开标准化租赁价目表
        - PlatformDIGITAL、ServiceFabric、多云连接、AI 解决方案
        - 马来西亚实际价格和折扣结构公开信息仍不透明
        - 客户需要互联和私有 AI 架构，而不只是原始 MW 时，竞争力更强。
      - - AirTrunk
        - 长期超大规模园区承诺按议价签约
        - 超大电力块、AI 就绪设计、可持续融资
        - 价格、扩张选项和续约经济性公开透明度很低
        - 只要电力和交付锁定，就可能在后来者入场前拿下大型锚定客户。
      - - PDG
        - 定制批发和运营商中立园区协议
        - 柔佛大规模 MW、SG-Johor-Batam 走廊逻辑、AI 就绪设计
        - 客户结构、利用率和定价细节公开披露有限
        - 很可能与 DayOne 正面争夺类似走廊级云和 AI 负载。
      - - Bridge / Nxera / Keppel / NTT 集群
        - 多为议价批发、托管或定制建设模式
        - 不同平台侧重企业服务、电信连接或区域定制建设选项
        - 留存来源普遍看不到透明标价
        - 竞争可能从单纯价格转向打包质量、服务范围和政策确定性。
    notes: 这一组公开材料几乎都强调议价合同和打包方案，而不是公布实际成交价。
