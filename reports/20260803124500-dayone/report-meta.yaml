  topStrengths:
    - Scarcity-driven SIJORI positioning and Johor scale give DayOne real exposure to one of Asia’s strongest hyperscale and AI demand corridors.
    - GDS disclosures show fast revenue, EBITDA, and committed-capacity growth rather than a purely speculative buildout story.
    - Capital access has been exceptional, culminating in a US$4.5 billion Series C final close and continued financing flexibility.
  topRisks:
    - The reported US$20 billion IPO target implies demanding revenue and EBITDA multiples on currently disclosed figures.
    - Public evidence still lacks standalone audited financials, top-customer concentration disclosure, and full covenant/preference visibility.
    - Valuation remains highly sensitive to Singapore capacity timing, Malaysian power execution, and booked-to-billable conversion.
  unresolvedGaps:
    - Standalone audited DayOne financial statements suitable for IPO-grade underwriting are not public.
    - Top-customer revenue and MW concentration remain undisclosed.
    - Debt stack, covenants, collateral map, and preference structure remain opaque.
    - Site-level power allocation, permitting, and RFS milestone tracking across key campuses is not public.
