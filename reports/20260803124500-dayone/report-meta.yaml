companyProfile:
  summary: DayOne is a Singapore-headquartered digital infrastructure platform focused on building and operating hyperscale, AI-ready campuses in power-advantaged markets. Its strongest corridor is SIJORI — Singapore, Johor, and Batam — with additional development in Thailand, Hong Kong, Tokyo, and Finland. The business is built around hyperscalers and large enterprises that need strategic capacity, power-secure expansion, and regional low-latency access rather than retail colocation.
  foundedDate: '2022-01-01'
  founders: []
  foundingLocation: Singapore
  headquarters: Singapore
  productSummary: DayOne combines site control, power procurement, renewable-energy integration, cooling design, and campus delivery to create hyperscale AI and cloud capacity in constrained or fast-growing markets.
  customerFocus: Hyperscalers, cloud platforms, AI workloads, and large enterprises needing long-duration regional capacity.
  businessModel: Build-operate hyperscale data-center campuses with long-duration customer commitments and significant dependence on power access, utility partnerships, and capital markets.
  stage: late-stage private
  fundingStatus: DayOne completed a US$4.5 billion Series C final close in July 2026 after earlier Series A/B fundraising and is reportedly planning a dual U.S./Singapore IPO process.
  claimRefs: [CO001, CO002, CO004, CO005, CO020, CE020, CU001, CU010, CV001, CV005]
summary:
