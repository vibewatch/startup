  topStrengths:
    - 稀缺驱动的 SIJORI 定位叠加 Johor 规模，让 DayOne 真实吃到亚洲最强 hyperscale 和 AI 需求走廊之一。
    - GDS 披露显示，收入、EBITDA 和已承诺容量都在快速增长，不只是投机式建设故事。
    - 融资通道极强，最终完成 US$4.5 billion Series C 终关，也保留了继续融资的灵活性。
  topRisks:
    - 据报道 US$20 billion IPO 目标，按当前披露数据看，对收入和 EBITDA 倍数要求很高。
    - 公开证据仍缺少独立审计财务、头部客户集中度披露，以及完整的债务契约 / 优先权能见度。
    - 估值对 Singapore 容量释放节奏、Malaysia 电力落地，以及 booked-to-billable 转化高度敏感。
  unresolvedGaps:
    - 适合 IPO 级承销的 DayOne 独立审计财务报表不公开。
    - 头部客户收入和 MW 集中度仍未披露。
    - 债务堆叠、契约、抵押物地图和优先权结构仍不透明。
    - 关键园区按站点拆分的电力分配、许可和 RFS 里程碑跟踪不公开。
