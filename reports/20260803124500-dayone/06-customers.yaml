- id: TU003
  title: Named customer proof table
  columns:
  - customer
  - segment
  - deployment / use case
  - production vs pilot
  - outcome
  - limitation
  rows:
  - - Microsoft / Azure
    - Hyperscale cloud platform
    - Malaysia West live region plus planned Southeast Asia 3 in Johor to support advanced regional workloads
    - Production plus expansion
    - Official Microsoft sources show launched Malaysia and Indonesia regions, named Malaysia-region customers, and direct Johor expansion plans
    - This is strong named demand proof in DayOne’s corridor, but not public proof that Microsoft is a DayOne tenant at a specific site.
  - - AWS
    - Hyperscale cloud platform
    - General-availability Malaysia region with three Availability Zones serving local and regional workloads
    - Production
    - AWS says the region is live, serves hundreds of thousands of active customers monthly, and names local customers such as PayNet and Pos Malaysia
    - Confirms demand for in-country cloud infrastructure, but does not identify DayOne as the landlord behind any AWS capacity.
  - - Google Cloud
    - Hyperscale cloud platform
    - Planned Malaysia cloud region aimed at lower-latency in-country services for Malaysia-linked customers
    - Committed / planned
    - Google’s APAC region announcement quotes Capital A and Media Prima on the value of a Malaysia region and ties the buildout to enterprise and public-sector demand
    - Demonstrates named ecosystem demand, not executed DayOne tenancy.
  - - Oracle Cloud Infrastructure
    - Regional cloud platform / multicloud adjacency
    - Singapore West and Indonesia North (Batam) public cloud regions providing multi-region regional cloud presence
    - Production
    - Oracle’s public regions pages confirm that named cloud infrastructure exists in the same corridor DayOne is selling into
    - Useful adjacency proof for multicloud demand, but weaker than Microsoft or AWS on named Malaysia customer stories.
  - - Unnamed DayOne hyperscaler / enterprise cohort
    - Direct DayOne customer base
    - Long-duration capacity bookings across Asia Pacific and Europe
    - Mixed production and committed backlog
    - DayOne says it is trusted by leading global hyperscalers and enterprises and reports >1.5 GW of total bookings
    - Most economically relevant row, but the public record still withholds tenant names, site-level lease sizes, and concentration.
  notes: This table intentionally distinguishes named demand-proxy evidence from direct DayOne tenant disclosure. The named rows are honest ecosystem proofs, while the final row captures direct-but-unnamed DayOne commercial evidence.
