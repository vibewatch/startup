- id: concentration-channel-dependence-and-blind-spots
  title: Concentration and channel dependence remain the main customer-underwriting blind spots
  body: >-
    DayOne’s expansion logic makes concentration risk possible even if the company is performing well. Hyperscale campuses are usually won through a relatively small number of very large customers rather than through a broad long-tail account base. Public evidence strongly suggests that DayOne’s economics are driven by that kind of large-tenant structure: the company emphasizes hyperscalers and large enterprises, cites bookings and committed capacity rather than customer counts, and keeps customer-specific disclosure sparse. That is consistent with the business model, but it also means public investors cannot yet see how much revenue depends on a handful of logos or whether one tenant dominates any individual campus.


    Channel dependence is the second major blind spot. The named demand evidence around DayOne’s strongest markets comes heavily from cloud-platform expansion, government-facilitated digital infrastructure policy, and regional ecosystem buildouts. Microsoft, AWS, Google, Oracle, and MIDA all help explain why Johor, Batam, and Singapore-linked capacity are valuable. But DayOne does not disclose what share of demand is directly originated versus indirectly shaped by cloud channels, strategic partners, or policy-driven ecosystem formation. That matters because partner-shaped demand can still be economically excellent, but it changes pricing power, renewal ownership, and customer intimacy.


    In practical diligence terms, the chapter’s conclusion is two-sided. DayOne has enough public evidence to support a real customer thesis: large hyperscaler demand, clear corridor fit, booked-capacity momentum, and credible multi-market expansion. What it does not yet have is the disclosure set required to underwrite concentration, renewal quality, and direct-versus-channel ownership with confidence. Those are the core asks for management and the core reasons the customer chapter remains below public-market-grade transparency even though the commercial story itself appears strong.
