- id: adoption-trajectory-and-named-customer-proof
  title: Adoption is visible through MW, bookings, and named cloud-demand proxies more than direct tenant rosters
  body: >-
    The public record does show real adoption, but mostly through infrastructure metrics rather than through transparent customer-count disclosure. PRNewswire says DayOne has secured more than 1.5 GW of total bookings since inception, while Data Center Magazine says the company is supporting secured customer commitments of roughly 1 GW. DatacenterDynamics separately describes a portfolio with more than 500 MW in service and under construction plus more than 500 MW held for future development. Johor alone is now presented as more than 478 MW of operational capacity. Those metrics do not tell an investor which logos account for the demand, but they do show that DayOne is not pitching a pre-revenue or purely speculative customer story.


    Named proof is stronger indirectly than directly. The clearest named counterparties in DayOne’s core corridor are not disclosed DayOne tenants; they are hyperscalers and cloud platforms building regional footprints around the same markets. Microsoft says Malaysia West launched in 2025 and that a second Malaysia region, Southeast Asia 3 in Johor Bahru, is being built for advanced workloads across the region. Google announced a coming Malaysia cloud region and quoted Malaysia-linked customers such as Capital A and Media Prima on low-latency and in-country infrastructure needs. AWS says its Malaysia region is live with three availability zones and names local customers including PayNet and Pos Malaysia. Oracle lists Singapore West and Indonesia North (Batam) among its public cloud regions. That combination does not prove those companies are all DayOne tenants, but it does prove that named hyperscaler demand is clustering in the exact geographies DayOne is scaling.


    The honest synthesis is that DayOne’s named-customer proof is best described as demand-proxy evidence plus selective direct platform evidence. The company is comfortable saying it is trusted by leading global hyperscalers and enterprises, and the scale metrics support real commercial traction. But public materials still do not publish a clean tenant roster with lease sizes, go-live status, or contract terms. That means the customer story is convincing on market fit and weaker on logo-level underwriting.
