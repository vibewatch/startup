  evidenceGaps:
  - type: missing-source
    severity: material
    topic: top-customer-concentration
    missingEvidence: No retained public source discloses DayOne’s top-customer share of booked MW, billable MW, or revenue by logo.
    whyItMatters: Without concentration data, strong hyperscaler traction could still mask dependence on a handful of very large tenants.
    diligencePath: Request top-10 customer exposure by booked MW, billable MW, revenue, and campus concentration.
    relatedQuestionRefs:
    - QU020
    - QU024
  - type: missing-source
    severity: material
    topic: lease-tenor-and-renewal
    missingEvidence: No retained public source provides standard lease term, renewal rights, churn, NRR, or GRR for DayOne customers.
    whyItMatters: Bookings and campus growth do not prove durable recurring economics unless lease length and renewal behavior are known.
    diligencePath: Request sample lease structures, weighted-average remaining lease term, renewal schedules, and customer retention cohorts.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU024
  - type: missing-source
    severity: important
    topic: booked-vs-billed-conversion
    missingEvidence: Public sources do not show how DayOne converts booked capacity into billable or revenue-generating capacity by customer and by site.
    whyItMatters: A fast-growing backlog can still underperform financially if energization or move-ins lag.
    diligencePath: Request booked, pre-committed, billable, and utilized MW by campus and major tenant, with ramp timing.
    relatedQuestionRefs:
    - QU005
    - QU014
    - QU024
  - type: missing-source
    severity: important
    topic: direct-vs-channel-origination
    missingEvidence: No retained public source splits direct customer origination from demand shaped by cloud ecosystems, partners, or policy-led market formation.
    whyItMatters: Channel dependence changes pricing power, customer intimacy, and renewal ownership even when top-line demand looks strong.
    diligencePath: Request pipeline and revenue split by direct, partner-influenced, and hyperscaler ecosystem-sourced opportunities.
    relatedQuestionRefs:
    - QU021
    - QU024
  - type: missing-source
    severity: material
    topic: tu003-named-customer-proof-coverage
    missingEvidence: No retained public source provides a complete direct tenant roster with named DayOne customers, site-level lease sizes, and production status for TU003.
    whyItMatters: The named-customer proof table can show ecosystem demand and direct-but-unnamed bookings, but it cannot fully prove customer quality until management discloses which logos actually anchor each campus.
    diligencePath: Request a campus-by-campus tenant roster, signed reference permissions, booked MW by named customer, and production versus pre-commit status.
    relatedQuestionRefs:
    - QU006
    - QU016
    - QU025
    relatedTableRefs:
    - TU003
