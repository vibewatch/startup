tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - primary use case
  - evidence-backed scale
  - revenue / strategic value
  - gap
  rows:
  - - Global hyperscalers / public cloud operators
    - 'Buyer: cloud infrastructure or region-expansion team; user: hyperscale workloads; payer: multi-year infrastructure budget'
    - Secure low-latency regional capacity with room to scale
    - '>1.5 GW total bookings since inception; named Microsoft, AWS, Google, and Oracle regional buildouts cluster around DayOne geographies'
    - Core strategic segment because these customers can anchor whole campuses and drive follow-on phases
    - Public DayOne materials do not disclose which hyperscaler logos map to which sites or what booked MW each represents.
  - - AI and high-performance computing tenants
    - 'Buyer: platform or compute-capacity team; user: training and inference clusters; payer: capex / opex infrastructure budget'
    - High-density power and AI-ready capacity in Johor, Singapore, and Thailand
    - Johor page cites >478 MW operational capacity; Singapore and Thailand releases explicitly reference AI and high-performance computing demand
    - Important growth segment because it rewards speed, power access, and sustainability-backed scale
    - No public split between AI-native tenants and conventional cloud tenants.
  - - Singapore-overflow / corridor customers
    - 'Buyer: regional capacity-planning team; user: Singapore-linked production workloads; payer: regional procurement'
    - Extend Singapore adjacency through Johor and Batam
    - MIDA describes Johor and Batam as preferred alternatives to constrained Singapore; DayOne markets both around cross-border connectivity
    - Strategically valuable because it monetizes Singapore scarcity while keeping low latency
    - No public latency, price, or contract-premium disclosure versus in-Singapore alternatives.
  - - Large enterprises with regional platforms
    - 'Buyer: CIO, infra, or digital-transformation leadership; user: enterprise apps and regulated data workloads; payer: enterprise IT budget'
    - Regional cloud-adjacent capacity, disaster recovery, or sovereign-adjacent deployment
    - DayOne says it serves large enterprises; Microsoft, AWS, and Google region pages show strong enterprise demand in Malaysia and across Southeast Asia
    - Useful diversification beyond pure hyperscaler exposure if meaningful
    - Public sources do not show enterprise revenue mix or vertical concentration inside DayOne.
  - - New-market European hyperscale demand
    - 'Buyer: EMEA cloud or infra team; user: sustainability-sensitive large workloads; payer: long-duration expansion budget'
    - Renewable-backed capacity in Finland
    - Lahti announcement positions a 128 MW first site in a 281 MW platform but says tenant negotiations were still in progress
    - Potentially important for geographic diversification and ESG-oriented buyers
    - No finalized customer agreements were public at launch, so demand conversion remains unproven.
  notes: The segmentation is based on workload and buying behavior rather than on disclosed logo counts because DayOne does not publish a customer roster or customer-count schedule.
