- id: durability-retention-and-expansion-signals
  title: Durability signals exist, but they are substitutes for retention disclosure, not equivalents
  body: >-
    For a data-center platform like DayOne, durability should ideally be underwritten with tenant concentration, lease tenor, renewal schedules, booked-versus-billed capacity by logo, and cohort behavior after initial move-in. None of that is public today. No reviewed source provides NRR, GRR, churn, logo retention, standard lease length, or customer satisfaction benchmarks. Public evidence instead provides durability substitutes: Johor has been operational since 2023, DayOne has built a large booked-capacity base quickly, Malaysia is being scaled into the company’s largest footprint, and large renewable-energy agreements suggest management is making long-duration commitments in anticipation of sticky customer demand.


    Those proxies matter, but they are not the same as renewal proof. A platform can show strong bookings and still have concentrated tenant exposure, slow move-ins, or weak renewals on first-generation contracts. Finland is the clearest reminder of that distinction. DayOne’s Lahti announcement says negotiations with potential tenants are in progress and that no agreements were finalized at the time of announcement. That is a healthy disclosure because it separates market entry from actual signed demand, but it also shows why the chapter cannot overstate durability from expansion headlines alone.


    The best diligence posture is therefore to treat DayOne’s customer durability as plausible but under-disclosed. Market fit appears strong, and the company is clearly building around repeatable hyperscaler and AI demand. Yet public sources still stop before the information an investor would need to convert bookings and corridor momentum into hard recurring-revenue confidence.
