  title: Customers
  summary: DayOne’s customer story is commercially credible but publicly under-disclosed. The strongest evidence comes from booked-capacity growth, Johor scale, and named hyperscaler demand clustering around Malaysia, Singapore, and Batam. What remains weak is direct tenant naming, retention disclosure, and concentration transparency, so the chapter supports strong market fit more than durable revenue underwriting.
sections:
- id: customer-base-segmentation-and-buyer-map
  title: Customer base segmentation is hyperscaler-led, corridor-aware, and procurement-driven
  body: >-
    DayOne is not marketed as a retail colocation landlord serving thousands of small accounts. Its public materials consistently describe a provider built for hyperscalers, cloud platforms, AI workloads, and large enterprises that need strategic capacity rather than flexible-by-the-cabinet retail space. That makes the buyer/user/payer map very different from SaaS or interconnection-heavy retail colocation. The likely buyer is an infrastructure, cloud, or regional expansion team; the user is the workload running on the campus; and the payer is a multi-year infrastructure or procurement budget tied to power, land, and deployment timing.


    The strongest public segmentation evidence sits in Malaysia and the Singapore-adjacent corridor. DayOne’s Johor page says the company operates across Nusajaya Tech Park and Kempas Tech Park with direct connectivity to Singapore and more than 478 MW of operational capacity. Its Batam page frames Nongsa Digital Park as a scalable, multi-phase platform for high-performance computing and hyperscale cloud deployments. The Singapore acquisition release positions 21 Jalan Buroh around demand for high-performance computing, cloud, and AI services. Together those sources support a customer map centered on overflow and expansion demand from constrained premium markets, especially Singapore, rather than on generic domestic enterprise hosting.


    The external demand record reinforces that interpretation. MIDA’s Johor articles describe Singapore’s power and land constraints pushing data-center developers toward Johor and Batam, while DayOne’s own Malaysia energy announcement says the country is becoming its largest global operational footprint. Public evidence therefore points to a customer base organized less by industry logos than by deployment problem: hyperscalers needing scale, AI and cloud platforms needing energy-backed expansion, and large enterprises needing regional low-latency or sovereign-adjacent capacity without waiting for constrained inner-city supply.
