- id: TU006
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Singapore overflow into Johor and Batam
    - A small number of hyperscalers could account for a large share of corridor economics
    - high
    - Request top-customer MW, campus-level tenant mix, and cross-border latency-sensitive use cases by logo.
  - - Malaysia as DayOne’s largest footprint
    - Rapid buildout can outrun signed demand or create heavy exposure to one country and a few buyers
    - high
    - Request booked, billable, and vacant capacity by campus plus customer pipeline conversion by quarter.
  - - Multi-market expansion into Thailand, Tokyo, Finland, and Spain
    - New markets can consume capital before tenant diversification is proven
    - medium
    - Request anchor-tenant status, RFS timing, and hurdle rates for each new market.
  - - Cloud-platform ecosystem leverage
    - Demand shaped by Microsoft, AWS, Google, and Oracle ecosystems may reduce direct customer ownership visibility
    - high
    - Request direct versus partner-influenced pipeline, lease origination path, and account-ownership model.
  - - Long-duration capacity-booking model
    - Large booked MW can still conceal concentration if a few logos dominate backlog
    - high
    - Request top-10 booked MW, top-10 revenue share, and cancellation / downsizing rights.
  - - Sparse public retention disclosure
    - Strong market-fit headlines can overstate durability if renewals, churn, and satisfaction are not measured transparently
    - high
    - Request NRR, GRR, churn, SLA attainment, and customer references from mature campuses.
  notes: The public expansion case is credible, but the concentration case remains under-disclosed. This table mixes the main growth levers with the precise missing disclosures needed to underwrite durability.
