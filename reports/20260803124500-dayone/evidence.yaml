evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, EBITDA, capex, and cash burn at the DayOne platform level remain undisclosed in public sources.
    whyItMatters: >-
      Valuation and financing resilience cannot be underwritten responsibly without seeing monetization, margins, and
      cash conversion.
    diligencePath: >-
      Request management financial statements, lender materials, and a project-by-project capex and returns schedule for
      2024-2026.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named customers, tenant concentration, term lengths, and utilization by campus are not publicly disclosed.
    whyItMatters: >-
      Booked demand only supports valuation if it converts into durable, diversified revenue with acceptable
      counterparty concentration.
    diligencePath: >-
      Obtain the top-customer list, signed contract summary table, occupancy by campus, and any hyperscaler framework
      agreements.
    relatedQuestionRefs:
      - QO019
      - QO024
  - type: conflicting-data
    severity: material
    topic: valuation-range
    missingEvidence: A reconciled valuation bridge from the 2024-2026 private rounds to any planned IPO valuation is not public.
    whyItMatters: >-
      Public reporting moved from a US$4-5 billion fundraising mark to a US$20 billion IPO target in less than two
      years, creating headline-mark risk.
    diligencePath: >-
      Request cap table history, term sheets, dilution waterfalls, and any banker or board materials supporting the
      current valuation range.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: governance-pack
    missingEvidence: >-
      A full board roster, committee structure, and senior executive list are not available in the reviewed public
      materials.
    whyItMatters: >-
      Leadership concentration and governance quality matter when the company is scaling multiple gigawatt-class markets
      simultaneously.
    diligencePath: >-
      Request an organization chart, board list, committee charters, and biographies for finance, operations, legal, and
      technology leads.
    relatedQuestionRefs:
      - QO008
  - type: stale
    severity: minor
    topic: capacity-reconciliation
    missingEvidence: >-
      Public disclosures do not provide one audited bridge tying live MW, under-construction MW, booked MW, committed
      MW, and future-development MW together.
    whyItMatters: >-
      Without a unified bridge, investors can overcount pipeline scale or misunderstand what portion of demand is
      monetized versus merely reserved.
    diligencePath: Request a dated capacity waterfall by campus and development stage, signed off by finance and development teams.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: dayone-market-share
    missingEvidence: >-
      No public source quantifies DayOne’s likely share of Singapore-Johor-Batam hyperscale demand or its booked share
      versus peers.
    whyItMatters: >-
      A company-specific market-share view is required to turn regional growth into a defensible revenue and valuation
      model.
    diligencePath: Request DayOne pipeline by customer type, signed MW by market, and management’s internal SAM assumptions.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: batam-pricing-and-live-capacity
    missingEvidence: >-
      Public third-party pricing and live-capacity benchmarks for Batam remain thinner than equivalent Johor and
      Singapore data.
    whyItMatters: >-
      Batam is strategically important to the corridor thesis, but weak third-party benchmarks make utilization and
      pricing assumptions less reliable.
    diligencePath: >-
      Collect broker quotes, operator data sheets, and local utility or regulator disclosures for Batam-specific pricing
      and live MW.
    relatedQuestionRefs:
      - QM016
      - QM022
  - type: conflicting-data
    severity: material
    topic: non-comparable-sizing-lenses
    missingEvidence: >-
      Public sources mix facility counts, investment forecasts, pipeline MW, pricing, and live capacity rather than one
      harmonized market-size framework.
    whyItMatters: >-
      Collapsing those measures into a single TAM number would create false precision and could materially distort
      valuation assumptions.
    diligencePath: >-
      Build a normalized internal market model separating existing MW, upcoming MW, annual capex, and recurring
      colocation revenue by geography.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: stale
    severity: minor
    topic: policy-and-tariff-sensitivity
    missingEvidence: >-
      The full long-term impact of Malaysia’s post-2025 tariff changes and future WUE/PUE guidance on campus economics
      is not yet settled publicly.
    whyItMatters: >-
      Tariff and sustainability rules can materially change which large campuses remain economically attractive over
      time.
    diligencePath: >-
      Request updated utility contracts, sensitivity tables, and any customer pass-through language in DayOne’s
      long-term agreements.
    relatedQuestionRefs:
      - QM019
      - QM022
  - type: missing-source
    severity: material
    topic: dayone-win-loss-data
    missingEvidence: No reviewed public source discloses DayOne’s actual win rate or loss rate versus named corridor competitors.
    whyItMatters: Competitive claims are materially weaker without direct evidence of who wins live deals and why.
    diligencePath: Request DayOne win-loss logs, top competitor overlap by market, and customer decision criteria for recent bids.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Public sources do not provide standardized realized pricing, concession levels, or renewal economics for large
      Johor and Singapore AI-ready capacity.
    whyItMatters: >-
      Without pricing comparables, it is hard to know whether DayOne is competing on margin, sustainability, service, or
      temporary scarcity.
    diligencePath: Request recent term sheets, price-per-kW benchmarks, ramp schedules, and discount policies across key competitors.
    relatedQuestionRefs:
      - QP012
      - QP015
      - QP024
  - type: missing-source
    severity: material
    topic: utilization-and-prelease
    missingEvidence: Outside selected AirTrunk disclosure, public utilization and pre-lease rates across corridor peers remain sparse.
    whyItMatters: >-
      Pre-lease momentum is a major competitive signal in hyperscale infrastructure and directly affects underwriting
      confidence.
    diligencePath: >-
      Request pre-lease percentages, anchor-customer concentration, and signed-but-not-live MW by campus for DayOne and
      major peers.
    relatedQuestionRefs:
      - QP019
      - QP023
  - type: missing-source
    severity: minor
    topic: competitor-service-scope
    missingEvidence: >-
      Public service descriptions are uneven across peers, especially for support services, managed layers, and contract
      flex terms.
    whyItMatters: >-
      Some enterprise or regulated buyers may choose on service model rather than pure MW scale, which could shift
      competitor ranking.
    diligencePath: >-
      Collect product sheets, SLA terms, and implementation scope documents for DayOne, NTT, STT GDC, Keppel, and
      Digital Realty.
    relatedQuestionRefs:
      - QP009
      - QP014
  - type: missing-source
    severity: material
    topic: standalone-liquidity
    missingEvidence: No retained public source discloses DayOne standalone unrestricted cash, restricted cash, or monthly burn.
    whyItMatters: Without cash and burn, runway and financing sufficiency cannot be underwritten responsibly.
    diligencePath: Request latest DayOne balance sheet, liquidity schedule, and monthly cash bridge by campus and corporate entity.
    relatedQuestionRefs:
      - QI016
      - QI022
  - type: missing-source
    severity: material
    topic: realized-contract-economics
    missingEvidence: >-
      Public sources do not disclose realized price per MW, escalators, concessions, contract life, or
      tenant-improvement obligations.
    whyItMatters: Revenue growth can be visible while value capture remains poor if contracts are heavily discounted or back-loaded.
    diligencePath: Request anonymized contract book and recent term sheets with price, term, escalators, and ramp profile.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI021
  - type: missing-source
    severity: material
    topic: debt-service-and-covenants
    missingEvidence: Net debt is disclosed, but debt maturities, interest burden, recourse structure, and covenant headroom are not.
    whyItMatters: Capital-intensive infrastructure businesses can look strong on EBITDA while still being fragile on debt service.
    diligencePath: Request debt stack, maturity ladder, project-level financing terms, hedges, and covenant calculations.
    relatedQuestionRefs:
      - QI012
      - QI017
      - QI022
  - type: missing-source
