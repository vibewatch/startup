    - Subsea cables, energy infrastructure, and ecosystem services that enable data centers
    - Unrelated telecom or hardware categories without direct data-center monetization
    - Utilities, governments, infrastructure funds
    - Important contextual layer but too broad to treat as DayOne's direct SAM.
