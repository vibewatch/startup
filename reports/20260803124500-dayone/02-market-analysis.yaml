company:
  name: DayOne Data Centers
chapter:
  number: 2
  title: Market Analysis
  summary: 'DayOne operates in a Southeast Asian hyperscale market where Singapore remains the premium connectivity anchor but much of the incremental AI and cloud buildout is spilling into power-advantaged neighboring markets such as Johor and Batam. Public market lenses agree on the direction: demand is being pulled by hyperscalers, neoclouds, and enterprise cloud adoption, while power access, water, regulatory certainty, and construction cost inflation determine where supply can actually land. The most relevant addressable market for DayOne is therefore not all digital infrastructure spend, but cross-border wholesale and hyperscale capacity serving Singapore-anchored regional workloads.'
sections:
- id: market-boundary-and-sizing-framework
  title: Market Boundary and Sizing Framework
  body: 'The right boundary for DayOne is not “all data centers” and certainly not all digital infrastructure. Public analyst reports break the market into layers that include IT infrastructure, electrical infrastructure, mechanical infrastructure, cooling systems, and general construction services, but those broad investment pools still cover a mix of enterprise facilities, wholesale colocation, hyperscale campuses, and ancillary buildout. DayOne’s own positioning is narrower: it speaks to hyperscalers and large enterprises that prioritize location, latency, scale, speed, and sustainability. That means the practical market lens is wholesale and hyperscale capacity in and around cloud-adjacent hubs, not retail rack demand or generic server-room spend.


    A useful way to size the opportunity is to stack three lenses rather than force one heroic TAM. First, Southeast Asia as a regional portfolio now spans 479 existing and upcoming facilities across nine countries, showing the depth of the supply base and the number of operators competing for land, power, and financing. Second, DayOne’s three most relevant countries—Singapore, Malaysia, and Indonesia—already account for the majority of that activity, with 265 existing or upcoming facilities across the three markets by Arizton’s counts. Third, the investable opportunity is growing fastest where large-scale campuses can actually be delivered: Malaysia and Indonesia are outgrowing Singapore in expansion velocity even though Singapore remains the highest-value hub.


    This layered approach matters because the country lenses are not directly interchangeable. Singapore’s market is smaller in headline size but denser, pricier, and more supply constrained. Malaysia is a larger buildout story shaped by Johor’s land and power availability. Indonesia, especially Jakarta and Batam, combines domestic digital-demand growth with cross-border spillover from Singapore. For valuation work later in the report, the cleanest takeaway is that DayOne’s SAM is best treated as cross-border hyperscale and wholesale demand within Singapore, Johor, Batam, and adjacent Southeast Asian metros—not the entirety of Asia’s infrastructure capex.'
