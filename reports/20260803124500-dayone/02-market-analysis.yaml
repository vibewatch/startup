- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Hyperscaler and AI capex acceleration
    - up
    - current to 2028
    - Supports rapid absorption of new APAC capacity and favors very large power-secure campuses.
    - Request DayOne split between signed hyperscaler demand, AI demand, and enterprise demand.
  - - Neocloud emergence
    - up
    - current
    - Adds incremental demand for AI-ready space but with potentially weaker credit quality than top hyperscalers.
    - Request counterparty-quality screen and deposit terms for non-hyperscaler AI buyers.
  - - Singapore land and power constraints
    - down
    - current
    - Keeps Singapore premium but pushes larger requirements to Johor, Batam, and other nearby hubs.
    - Request DayOne evidence for demand spillover from Singapore-anchored customers.
  - - Johor power and land availability
    - up
    - current to 2030
    - Makes Johor the main hyperscale expansion market in Malaysia and a primary DayOne corridor node.
    - Request substations, contracted power schedule, and utility milestones by campus.
  - - Water intensity and cooling complexity
    - down
    - current and rising
    - Raises permitting and sustainability hurdles in both Singapore and Johor.
    - Request water-usage effectiveness, recycling design, and contingency plans by site.
  - - Construction cost inflation
    - down
    - 12-24 months
    - Can erode returns even when demand is strong, especially for AI-grade campuses.
    - Request capex per MW assumptions and procurement lock-ins.
  - - Malaysia tariff and policy changes
    - mixed
    - current
    - Can slow marginal projects while rewarding operators with strong renewable or utility partnerships.
    - Request DayOne sensitivity analysis for post-2025 tariff scenarios.
  - - JS-SEZ and SG+ cross-border policies
    - up
    - current to medium term
    - Improves the corridor case by matching Singapore HQ functions with Johor or Batam expansion zones.
    - Request actual customer architectures or pipeline examples using this model.
  - - Subsea cable and cloud-region density
    - up
    - current
    - Strengthens demand for markets close to Singapore and Jakarta rather than isolated inland sites.
    - Request landing-station, carrier, and cloud-onramp map for DayOne campuses.
  - - 5G and broader digital-readiness gaps
    - down
    - medium term
    - Can cap local AI adoption even if wholesale capacity is available.
    - Request customer mix between export-oriented regional workloads and domestic digital-economy demand.
  notes: The core market question is not whether demand exists, but whether operators can convert AI and cloud demand into delivered MW under power, water, tariff, and policy constraints.
