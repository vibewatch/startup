- id: geographic-market-structure
  title: 'Geographic Market Structure: Singapore as Anchor, Johor and Batam as Spillover'
  body: 'The geography of demand is the key structural feature of DayOne’s market. Singapore remains the premium anchor because of subsea connectivity, established regulatory institutions, and cloud-region density. Arizton still ranks it as one of the strategically important hubs in Southeast Asia, with 44 operational colocation facilities, six upcoming facilities, and very high wholesale colocation penetration. But its expansion path is constrained by land scarcity, power limits, sustainability requirements, and a regulatory memory shaped by the 2019-2022 moratorium. The government’s DC-CFA process has reopened supply in a calibrated way, but premium economics now coexist with limited greenfield capacity and strict sustainability screens.


    Johor is the clearest spillover beneficiary. CNA, MIDA, CBRE, and Arizton all describe the same pattern from different angles: operators want Singapore’s customer base and cable adjacency, but Johor offers land, lower energy costs, faster buildout potential, and room for very large AI-ready campuses. By late 2025 Arizton placed Johor’s upcoming power pipeline around 4.0 GW, while MIDA and Invest Johor emphasized that the state was absorbing the majority of Malaysia’s live IT capacity and investment approvals. The JS-SEZ narrative deepens that positioning by formalizing cross-border economic integration rather than treating Johor as an opportunistic overflow zone.


    Batam plays a similar but somewhat earlier-stage role on the Indonesia side. Arizton’s Indonesia market report explicitly frames Batam as a complementary extension of Singapore because it sits roughly 20 kilometers away and can provide low-latency offshore capacity. DayOne’s own market page and MDEC-backed comments in MIDA materials tell the same story. The result is a market structure where Singapore is the premium control point, Johor is the fastest-scaling hyperscale hinterland, and Batam is the strategic Indonesia leg of the same corridor. That cross-border geometry is more important for DayOne than any single national market-size figure.'
