  evidenceGaps:
  - type: missing-source
    severity: material
    topic: dayone-market-share
    missingEvidence: No public source quantifies DayOne’s likely share of Singapore-Johor-Batam hyperscale demand or its booked share versus peers.
    whyItMatters: A company-specific market-share view is required to turn regional growth into a defensible revenue and valuation model.
    diligencePath: Request DayOne pipeline by customer type, signed MW by market, and management’s internal SAM assumptions.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: batam-pricing-and-live-capacity
    missingEvidence: Public third-party pricing and live-capacity benchmarks for Batam remain thinner than equivalent Johor and Singapore data.
    whyItMatters: Batam is strategically important to the corridor thesis, but weak third-party benchmarks make utilization and pricing assumptions less reliable.
    diligencePath: Collect broker quotes, operator data sheets, and local utility or regulator disclosures for Batam-specific pricing and live MW.
    relatedQuestionRefs:
    - QM016
    - QM022
  - type: conflicting-data
    severity: material
    topic: non-comparable-sizing-lenses
    missingEvidence: Public sources mix facility counts, investment forecasts, pipeline MW, pricing, and live capacity rather than one harmonized market-size framework.
    whyItMatters: Collapsing those measures into a single TAM number would create false precision and could materially distort valuation assumptions.
    diligencePath: Build a normalized internal market model separating existing MW, upcoming MW, annual capex, and recurring colocation revenue by geography.
    relatedQuestionRefs:
    - QM023
    - QM025
  - type: stale
    severity: minor
    topic: policy-and-tariff-sensitivity
    missingEvidence: The full long-term impact of Malaysia’s post-2025 tariff changes and future WUE/PUE guidance on campus economics is not yet settled publicly.
    whyItMatters: Tariff and sustainability rules can materially change which large campuses remain economically attractive over time.
    diligencePath: Request updated utility contracts, sensitivity tables, and any customer pass-through language in DayOne’s long-term agreements.
    relatedQuestionRefs:
    - QM019
    - QM022
