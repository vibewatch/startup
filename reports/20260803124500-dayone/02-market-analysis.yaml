  - - Johor/Batam spillover markets
    - Land-rich, power-advantaged campuses linked to Singapore workloads
    - Domestic-only server rooms without cross-border latency advantage
    - Hyperscalers and enterprises extending Singapore-centric architectures
    - Most relevant expansion zone for DayOne in Southeast Asia.
  - - Domestic digital platforms and sovereign cloud
    - Country-specific cloud, government, and digital economy projects
    - Hardware manufacturing or chip fabrication spend that never becomes data center demand
    - Government, regulated enterprises, national digital platforms
    - Relevant indirect demand channel, especially in Indonesia and Malaysia.
