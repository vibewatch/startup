  rows:
  - - Equinix
    - Negotiated colocation, interconnection, and large-scale capacity; no reviewed public hyperscale price card
    - Carrier-neutral ecosystems, AI-ready sites, compliance, cloud access
    - Realized pricing, volume discounts, and xScale economics not publicly standardized in retained sources
    - Wins when buyers pay a premium for ecosystem density or low-latency enterprise reach.
  - - Digital Realty
    - Custom wholesale / hybrid architecture model; no reviewed public standardized lease card
