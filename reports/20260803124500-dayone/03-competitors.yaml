- id: switching-cost-lock-in-and-distribution-power
  title: Switching cost, lock-in, multi-homing, and distribution power
  body: 'The switching-cost profile in this market is meaningful but not absolute. Once a buyer has committed to a campus, power block, and interconnection architecture, moving is expensive and time-consuming. But prior to commitment, the corridor still allows substantial operator choice. Cushman’s large APAC pipeline and Arizton’s operator count show that the market is not capacity-free, while CBRE’s Singapore pricing and low vacancy show that premium nodes retain scarcity value. In practice, buyers can still multi-home: a regional architecture might place certain inference or enterprise workloads with Digital Realty or Equinix, reserve very large training or wholesale blocks for AirTrunk, PDG, or Bridge, and use Singapore-linked incumbents such as Keppel, NTT, or Nxera where regulation or relationships matter.


    That makes distribution power central. Equinix and Digital Realty have the strongest public signals on carrier, cloud, and customer ecosystems. NTT has the broadest global enterprise footprint of the set reviewed. Keppel and STT GDC bring regional operating credibility and Singapore-rooted institutions. Hyperscale specialists such as AirTrunk and PDG counter with a different lock-in logic: if they pre-lease large power blocks early and become the fastest path to AI-ready deployment, they can win despite having lighter ecosystem density. AirTrunk’s near-full contracting of its existing Johor campuses is especially important here, because it shows how quickly cloud demand can be captured before a later entrant reaches market.


    For DayOne, the implication is that moat cannot rely on simple location matching. The company must either beat interconnection incumbents on corridor design and customer service, or beat hyperscale specialists on power, speed, and sustainability. Multi-homing also limits terminal lock-in: customers can distribute workloads across Singapore, Cyberjaya, Johor, Batam, and Jakarta. That means underwriters should look for actual win-loss evidence, pre-lease timing, contract duration, and customer expansion behavior rather than assuming infrastructure stickiness automatically creates competitive safety.'
