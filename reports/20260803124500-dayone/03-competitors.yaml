  evidenceGaps:
  - type: missing-source
    severity: material
    topic: dayone-win-loss-data
    missingEvidence: No reviewed public source discloses DayOne’s actual win rate or loss rate versus named corridor competitors.
    whyItMatters: Competitive claims are materially weaker without direct evidence of who wins live deals and why.
    diligencePath: Request DayOne win-loss logs, top competitor overlap by market, and customer decision criteria for recent bids.
    relatedQuestionRefs:
    - QP024
    - QP025
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Public sources do not provide standardized realized pricing, concession levels, or renewal economics for large Johor and Singapore AI-ready capacity.
    whyItMatters: Without pricing comparables, it is hard to know whether DayOne is competing on margin, sustainability, service, or temporary scarcity.
    diligencePath: Request recent term sheets, price-per-kW benchmarks, ramp schedules, and discount policies across key competitors.
    relatedQuestionRefs:
    - QP012
    - QP015
    - QP024
  - type: missing-source
    severity: material
    topic: utilization-and-prelease
    missingEvidence: Outside selected AirTrunk disclosure, public utilization and pre-lease rates across corridor peers remain sparse.
    whyItMatters: Pre-lease momentum is a major competitive signal in hyperscale infrastructure and directly affects underwriting confidence.
    diligencePath: Request pre-lease percentages, anchor-customer concentration, and signed-but-not-live MW by campus for DayOne and major peers.
    relatedQuestionRefs:
    - QP019
    - QP023
  - type: missing-source
    severity: minor
    topic: competitor-service-scope
    missingEvidence: Public service descriptions are uneven across peers, especially for support services, managed layers, and contract flex terms.
    whyItMatters: Some enterprise or regulated buyers may choose on service model rather than pure MW scale, which could shift competitor ranking.
    diligencePath: Collect product sheets, SLA terms, and implementation scope documents for DayOne, NTT, STT GDC, Keppel, and Digital Realty.
