    - Negotiated long-duration hyperscale campus commitments
    - Very large power blocks, AI-ready design, sustainability financing
    - Little public transparency on pricing, expansion options, or renewal economics
    - Can win large anchor deals before later entrants arrive if power and delivery are secured.
