- id: profile-by-competitor-class
  title: 'Profile by competitor class: where each rival is sharpest'
  body: 'Equinix remains the strongest ecosystem incumbent in the corridor. Its Asia-Pacific platform spans 63 data centers and interconnection facilities across nine countries, and its materials explicitly connect AI-ready colocation, ecosystem density, and xScale-style large capacity. Digital Realty competes differently: its Singapore footprint emphasizes dense customer and network ecosystems, while its broader Asia-Pacific platform claims 20+ data centers, 230+ connected customers, 150+ service providers, and 30+ cloud providers. Together, Equinix and Digital Realty are the rivals most likely to win when buyer value is defined by cloud adjacency, cross-connect depth, and regional architecture flexibility rather than by the single largest campus.


    AirTrunk, PDG, and Bridge look more like direct hyperscale rivals. AirTrunk markets itself as a hyperscale partner for Asia-Pacific and the Middle East, and recent news coverage shows its Johor footprint scaling beyond 700 MW in Malaysia, supported by large green financing packages and nearly fully contracted earlier campuses. PDG’s Malaysia materials show an explicit SG-Johor-Batam posture with 200 MW at JH1 and a planned 300 MW at JH2, while Bridge emphasizes Johor’s Singapore adjacency, advanced cooling, modular delivery, and a claim to one of the region’s largest hyperscale campuses. These players compete closest to DayOne on the core question of who can deliver AI-ready megawatts at scale in the same corridor.


    NTT, STT GDC, Keppel, and Nxera bring different strengths. NTT stresses global reach, 150+ facilities, 2,000MW+ critical IT load, and large network coverage. STT GDC emphasizes energy-efficient, multi-site platforms across mature and emerging markets. Keppel mixes wholesale, build-to-suit, and hyperscale credentials with infrastructure innovation aimed at Singapore-like resource constraints. Nxera and TM, meanwhile, show how local incumbents can partner into the corridor with a 64 MW AI-ready Johor project linked to the JS-SEZ narrative. For DayOne, the consequence is that no rival class is weak across every dimension; the competition is multidimensional and buyers can optimize for ecosystem, MW scale, sustainability, or balance-sheet confidence depending on workload.'
