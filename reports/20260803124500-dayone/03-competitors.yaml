    - medium-high
    - Request interconnection roadmap, carrier counts, and cloud-onramp partnerships per DayOne site.
  - - Singapore incumbents are structurally disadvantaged on cost
    - Keppel, STT, Nxera, and NTT can offset cost with relationships, service breadth, or policy comfort
    - medium
    - Request customer segmentation by regulated, enterprise, and hyperscaler workload class.
