  - CP022
  - CP023
- calloutType: strength
  title: DayOne’s corridor choice is strategically sound
  body: The Singapore-Johor-Batam geometry DayOne is targeting is the same one attracting the fastest-scaling regional platforms, which validates the demand corridor even if it does not reduce competition.
