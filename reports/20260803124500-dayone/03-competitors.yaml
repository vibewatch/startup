  - - AI-ready marketing is differentiated
    - Most peers now market AI-ready, advanced cooling, or sustainability narratives
    - high
    - Request customer reasons for choosing DayOne versus AirTrunk, Bridge, PDG, or Digital Realty.
  - - Demand guarantees utilization
    - Large APAC pipeline and many operators keep customer alternatives open before commitment
    - high
    - Request pre-lease schedules, cancellation rights, and committed versus speculative MW by campus.
  - - Capital access is comparable across peers
    - Listed operators and heavily financed private platforms may outspend slower rivals
    - high
