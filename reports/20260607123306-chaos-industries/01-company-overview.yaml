company:
  name: CHAOS Industries
chapter:
  number: 1
  title: Company Overview
  summary: CHAOS Industries is a Los Angeles defense-technology company founded in 2022 that has built a coherent distributed radar narrative around Vanquish, Astria, and Coherent Distributed Networks while raising from $70 million Series A funding to a $510 million Series D at a $4.5 billion valuation. The public record is strong on founder pedigree, late-stage investor support, and military-adjacent milestones such as AFWERX work, Forterra testing, and G-TEAD access, but weak on revenue, customer count, and contract economics. That asymmetry makes company identity easy to establish and underwriting confidence harder to earn.
sections:
- id: identity-and-products
  title: Identity, footprint, and product stack
  body: 'CHAOS Industries is a Los Angeles-headquartered defense technology company founded in 2022. Across its own financing releases and product pages, the company consistently frames itself around Coherent Distributed Networks, a distributed sensing-and-effects architecture meant to compress detection timelines against drones, missiles, and other autonomous threats. The product stack is legible even if the commercial detail is not: Vanquish is presented as a distributed early-warning radar for expeditionary, short-to-mid-range missions, while Astria is positioned as a long-range radar for persistent monitoring and high-precision tracking. The technologies page and later military marketplace release repeat the same architectural themes: self-forming nodes, two-way time transfer, cooperative processing, and interoperability with larger command-and-control systems.


    The location picture is partly consistent and partly broader than the core financing narrative. The November 2025 Series D release and December 2025 G-TEAD announcement both state that CHAOS is headquartered in Los Angeles and also operates from Washington, D.C., San Francisco, Seattle, and London. The live homepage lists a wider footprint that additionally includes San Diego and Amman. For diligence purposes, the minimum corroborated office list is the five-city set repeated in late-2025 official releases, while the homepage suggests a larger operating footprint that would need confirmation in diligence. What is not disclosed alongside this footprint is revenue scale, customer count, or unit economics, so even the company snapshot remains operationally stronger than it is financially transparent.'
