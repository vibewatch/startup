- id: founders-and-governance
  title: Founders, leadership additions, and key-person dependence
  body: 'The founder group is unusually defense-network dense for a company that scaled this quickly. Official CHAOS sources identify John Tenet, Bo Marr, Gavin Hood, and Brett Cummings as founders, pairing prior experience from Epirus, 8VC, Raytheon, Palantir, and UK intelligence. That pedigree matters because the company’s public proof still leans more on the credibility of the people building the system than on disclosed commercial metrics. Leadership additions sharpen that pattern. In October 2024 CHAOS hired former congressman and CIA veteran Will Hurd as chief strategy officer, and in April 2025 it appointed former CIA Director George J. Tenet as executive chairman to lead board activities and governance. Those appointments improve policy access, defense credibility, and board gravitas, but they also underscore how concentrated the company’s public narrative remains around John Tenet and Bo Marr.


    The spot headcount disclosures show growth but not enough continuity to evaluate organizational depth. CHAOS disclosed more than 70 professionals when announcing Will Hurd and 100 professionals when announcing George Tenet about six months later. That is progress, but there is no full leadership roster, no disclosed CFO, and no public breakdown by engineering, manufacturing, sales, or government-program functions. The governance picture is therefore directionally stronger than at founding, while key-person dependence remains material because the company’s strongest public evidence still flows through a small circle of founders and high-profile appointees rather than through durable operating disclosures.'
