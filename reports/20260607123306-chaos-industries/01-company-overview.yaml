- id: capital-trajectory
  title: Funding history, investor map, and scale signals
  body: 'CHAOS moved from a $70 million Series A in March 2023 to a $145 million Series B in November 2024, a $275 million Series C in late April or early May 2025, and a $510 million Series D in November 2025. The funding chronology is important not just because the rounds are large, but because the valuation acceleration was steep: third-party sources place the Series C at $2 billion while the official Series D release and Tracxn put the next round at $4.5 billion. Official messaging says the company has raised over $1 billion; Tracxn’s disclosed-round table sums to exactly $1.0 billion. Those are compatible statements, but the Tracxn sum is the more precise public ledger.


    The investor syndicate also widened in a way that matters for underwriting. 8VC seeded the journey through the Series A, Accel led the Series B, NEA and Accel anchored the Series C, and Valor led the Series D while joining the board. StepStone, Overmatch, Tru Arrow, and Lerner-related entities appear across the disclosed rounds. In other words, the cap table has become deeper and more institutional just as the company claims it is scaling manufacturing and entering more formal military procurement pathways. What the funding narrative does not answer is the question that matters most for later chapters: how much commercial or program revenue now supports a $4.5 billion price. Publicly, the financing trajectory is clearer than the operating trajectory.'
