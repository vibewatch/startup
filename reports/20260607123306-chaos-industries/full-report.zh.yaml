      - number: '8.4'
        title: 建议、反向逻辑与投资逻辑破裂触发项
        blocks:
          - type: paragraph
            body: >-
              严谨的估值章节必须同时支撑投资逻辑和反向逻辑。投资逻辑很直接：反无人机需求真实，公司拥有顶级投资者，创始人和治理画像可信，2025
              年底的采购和测试里程碑显示公司正在进入更严肃的国防路径。反向逻辑同样清楚：公开来源仍没有收入、客户集中度、毛利率、烧钱速度、现金跑道或已定价合同经济性。这意味着外部人士无法独立检验 $4.5 billion
              入场价是否合理。因此，基于公开证据的正确判断是继续研究，置信度中等，风险评级高，估值立场偏高。


              判断只有在披露改善时才会上调：当前收入、已入账项目、客户集中度、毛利率和现金跑道。如果 G-TEAD 及类似里程碑无法产生可见收入，如果服务密集型部署压迫经济性，或者如果行业在 CHAOS
              弥合披露缺口前重估，判断就会下调。简言之，公司可能值得严肃尽调关注，但当前公开记录不足以支撑把 Series D 标记视为显然公允。
