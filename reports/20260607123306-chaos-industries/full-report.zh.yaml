      - number: '1.3'
        title: 融资历史、投资人图谱与规模信号
        blocks:
          - type: paragraph
            body: >-
              CHAOS 从 2023 年 3 月 $70M Series A，走到 2024 年 11 月 $145M Series B、2025 年 4 月底或 5 月初 $275M Series C，再到 2025 年
              11 月 $510M Series D。这条融资时间线重要，不只是因为轮次金额大，也因为估值抬升很陡：第三方来源将 Series C 估值放在 $2B，官方 Series D 新闻稿和 Tracxn
              则把下一轮估值列为 $4.5B。官方说法称公司累计融资超过 $1B；Tracxn 披露轮次表合计正好为 $1.0B。两种表述可以兼容，但 Tracxn 的合计数是更精确的公开账本。


              投资人联盟也以一种影响承销判断的方式扩宽了。8VC 从种子到 Series A 撑起早期旅程，Accel 领投 Series B，NEA 和 Accel 锚定 Series C，Valor 领投 Series D
              并进入董事会。StepStone、Overmatch、Tru Arrow 以及 Lerner
              相关实体也出现在已披露轮次中。换句话说，就在公司声称要扩大制造、进入更正式军方采购路径时，股权结构表也变得更深、更机构化。融资叙事没有回答后续章节最重要的问题：现在有多少商业收入或项目收入支撑 $4.5B
              定价。公开层面，融资轨迹比运营轨迹清楚得多。
