      - number: '7.5'
        title: 缓释措施、监测项与否决标准
        blocks:
          - type: paragraph
            body: >-
              这些风险并非同等致命。有些可以靠更强尽调管理：出口批准可以核验，制造指标可以索取，董事会或运营团队厚度可以验证。当缺失证据与无法转化同时持续存在时，投资逻辑才会破裂。最干净的否决标准很简单：如果
              Eglin、G-TEAD、盟友协议或 Forterra 之后没有 Phase
              III、复购、生产合同或同等耐久的后续项目，那么公开客户故事仍是战略上有吸引力、商业上偏浅。次级否决标准也可以监测。如果公司无法提供可信的制造和质量指标，就应下调规模化假设。如果盟友部署没有出口合规或安全论证材料，国际上行空间就应大幅折价。如果资本更充足的同业持续赢得更大合同，而
              CHAOS 在公开层面仍停留在评估阶段，竞争风险就应上调。因此，本章风险栈是复合的，而不是孤立的：转化、运营、监管、竞争和透明度都会相互牵动。
            claimRefs:
              - CR034
              - CR038
              - CR040
              - CR042
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值语境，以及价格实际反映了什么
        blocks:
          - type: paragraph
            body: >-
              CHAOS 目前最有支撑的估值标记，是 2025 年 11 月按 $4.5 billion 估值完成的 Series D。相比 2025 年春季据报道 $2.0 billion 的 Series C
              标记，这大约半年内把估值抬高了 2.25x。Tracxn 披露的轮次表把累计融资精确加总到 $1.0 billion，官方 Series D 新闻稿则把同一结果约写为超过 $1
              billion。二者足够一致，可以作为背景，并共同确立关键点：CHAOS 已不再按早期概念验证初创公司定价。市场给它的估值，更像一家后期国防科技平台，预期它能把技术可信度和采购入口转化为耐久规模。


              价格显然反映了投资者信心、创始人履历和品类紧迫性。价格尚未清楚反映的，是公开经济性证明。公开记录仍缺收入、ARR、毛利率、烧钱速度、现金跑道和客户数。因此，融资背景强，但不完整。投资者可能看到了足以支撑跳升的私下数据；外部人士没有。本章估值立场就建立在这个缺口上：价格上涨快于公开披露质量改善。
            claimRefs:
