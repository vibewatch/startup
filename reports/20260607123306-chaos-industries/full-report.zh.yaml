  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合同转化与预算依赖
        blocks:
          - type: paragraph
            body: >-
              最重要的风险不是 CHAOS 的技术是否有意思，而是公司能否把有希望的公开里程碑转化为耐久采购。Eglin TACFI 奖项和众议院支持的拨款是严肃信号，但 AFWERX 和 Eglin 都把 TACFI
              描述为从 Phase II 走向 Phase III 的桥梁。这意味着最强的空军证据点仍是转化路径，而不是已完整披露的经常性项目。陆军证据也类似。Project Flytrap 4.5 之后进入 G-TEAD
              市场有价值，因为它降低了采购摩擦，但仍只是一个指挥官可能使用、也可能不用的机制。Replicator 2 让这一点更尖锐：首个公开披露的本土反无人机采购给了 Fortem，而不是
              CHAOS。换句话说，快速采办渠道已经活跃，但竞争很激烈。预算和官僚体系会叠加放大这一风险。National Defense 对 Golden Dome 的分析显示，大型雷达架构依赖持续政治支持和机构协同，因此
              Eglin 以及任何未来雷达机会都暴露在资金优先级变化下。
