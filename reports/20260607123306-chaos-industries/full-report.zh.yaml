      - number: '2.4'
        title: 增长驱动、约束与时点风险
        blocks:
          - type: paragraph
            body: >-
              最清楚的市场驱动来自作战条令：官方和行业来源都强调分层、模块化、可扩展的反无人机和雷达架构，而不是单一用途点工具。大规模无人机、关键基础设施保护，以及对地理分布式感知的需求，都有利于 CHAOS
              这类架构。开放、模块化网络要求也会强化这类系统的理由：它们补足既有指挥栈，而不是逼迫客户替换整个平台。但摩擦同样真实。National Defense 明确警告，即便工程逻辑成立，Golden Dome
              仍可能因官僚割裂、任务归属不清和资金错配而失败。Teal 也指出，雷达预算历来容易被削减，而且 Golden Dome 的硬性项目数字仍未解决。半导体、RF
              模块和传感器上的供应链与关税压力进一步把成本和进度风险推入市场。对 CHAOS
              来说，这意味着采用曲线概念上可以很强，但合同节奏仍会不均。市场有利，但并非没有摩擦；投资人应压低由炒作驱动的自上而下支出叙事权重，转而看可验证的部署渠道和项目转化。
