      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              保留来源中最清楚的财务对比不在 CHAOS 内部，而是与 Epirus 对照。2025 年 7 月，Epirus 公开披露一份 $43.55M
              陆军合同，同时说明下一代系统将如何提升射程、功率和士兵可用性。这类披露把风险资本和产生收入的国防项目之间的线拉得更清楚。CHAOS
              在公开层面还没有做到。它最强的财务叙事仍是已融资本和路径里程碑，而不是确认收入、利润率或已签在手订单。即便联邦记录尽调路径也强化了这一点：官方数据库可以确认采购数据存在，但不能替代管理层披露包。


              因此，克制的结论是混合的。CHAOS
              明显拥有投资人支持、市场相关性和技术验证信号。但公开记录仍无法回答最基本的承销问题：今天有多少收入是真实的，收入集中度多高，底层利润率是多少，公司消耗已融资本的速度有多快。正确的财务姿态是：看好战略动能，但质疑经济可见度。在
              CHAOS 披露收入质量、烧钱速度、现金跑道和合同经济性之前，财务章节应被视为潜力证据，而不是耐久性证明。
