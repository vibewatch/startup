      - number: '1.4'
        title: 里程碑、政府验证与反向检查
        blocks:
          - type: paragraph
            body: >-
              2025 年底的运营记录强于 2025 年初。2025 年 4 月，Forbes 报道称 CHAOS 披露的能力细节相对有限，尚未宣布重大合同。到 2025 年 9 月，公司披露了与 Astria 相关的
              $1.9M AFWERX TACFI 奖项，以及另一笔获众议院批准、与 Eglin Air Force Base 雷达工作有关的 $10M 拨款。2025 年 10 月，Axios 报道其与 Forterra
              的自主车辆栈进行实测；2025 年 12 月，CHAOS 宣布在德国 Project Flytrap 4.5 之后进入 G-TEAD
              市场。这些是真实的验证里程碑，但不等于已披露的经常性收入、长期单价，或项目正式列装后的现金转化。


              这一区分很关键，因为更大的任务集合仍暴露在行业层面的不确定性下。National Defense Magazine 将 Golden Dome 描述为极其复杂的系统之系统挑战；公开的 Army
              Replicator 材料则显示，本土反无人机采购推进很快，但不一定具体流向 CHAOS。由此得到的公司概况结论是混合但可理解的：CHAOS
              组建了可信的创始团队，吸引了顶级投资人，任命了知名国家安全领导者，并把产品推进到有分量的野外评估。反向一面是披露不透明。公开来源仍无法回答客户数量、收入规模，以及当前宣传中的合同与采购路径到底有怎样的经济性。
