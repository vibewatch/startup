      - number: '6.3'
        title: 耐久性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              本章最大的分析陷阱，是把具名军事证据点的存在当作客户耐久性的证据。抓取来源不支持这一步跳跃。没有公开来源披露
              NRR、GRR、流失率、合同续签日期、复购数量、运营方满意度数据或客户集中度百分比。唯一与客户证据直接绑定的公开经济性，是 $1.9M TACFI 奖项和 $10M
              国会拨款。其他所有内容——G-TEAD、中东协议和
              Forterra——都有战略意义，但经济上不透明。这种不透明很重要，因为公开证据集仍小到足以判断集中度风险几乎肯定偏高，尽管无法用抓取记录量化具体幅度。扩张循环确实存在。G-TEAD 可能扩宽对陆军和 NATO
              指挥体系的触达；Forterra
              可能创造车载移动反无人机渠道；盟友中东协议则暗示可出口需求。但每一个循环都仍需要从里程碑转化为重复购买。在后续订单或续约出现之前，审慎看法应是客户耐久性仍未证明。竞争披露在这里也重要。Saronic 和
              Anduril 显示，品类领导者越来越会把公开任务页、产品栈和合同关联报道打包成更强的买方证明循环。这不改变 CHAOS
              的直接证据，但会抬高投资人判断客户证据是否足够广、足够粘、足够透明，以支撑国防科技品类高估值的标准。Saronic 自己的 Series D
              公告也从公司侧说明了同一点：融资正被卖给市场，作为客户相关性和任务紧迫性的证明。这种动态会加大对 CHAOS 这类公司在公开客户引用稀疏时受到的惩罚。
