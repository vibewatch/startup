      - number: '7.2'
        title: 供应链、制造与运营规模风险
        blocks:
          - type: paragraph
            body: >-
              规模执行是第二个主要风险，因为公开记录显示融资多于运营指标。Series B、Series C 和 Series D
              都承诺高产量或扩张制造，但抓取来源没有披露产出、缺陷率、良率或交付节奏。这个缺口重要，因为分布式雷达系统硬件占比高，依赖传感器、计算、授时和通信部件，而这些部件都暴露在成本通胀和供应约束下。Research
              and Markets 明确称，反无人机中的半导体、RF 模块和传感器正在变贵；Sacra 则提示可能存在出口管制敏感性和专用部件依赖。工程门槛也很高。Curtiss-Wright
              指出，在受争夺频谱中保持韧性的雷达，必须能探测干扰、重调频率、再生波形，并在节点之间快速移动数据。CHAOS
              声称互操作，但公开的认证或独立验证性能证据仍很薄。如果制造和野外可靠性落后于销售叙事，即便需求存在，客户转化也可能失败。竞争对手披露强化了这一点。Epirus
              正围绕反无人机系统公开建设训练基础设施、机动性合作和制造加速渠道。这不能证明 CHAOS 缺少类似工作，但说明执行风险现在还包括公司是否在围绕产品搭建赋能栈，而不只是搭建产品本身。
