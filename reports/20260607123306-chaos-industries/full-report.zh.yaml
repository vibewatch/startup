      - number: '4.2'
        title: 运营证据、资本用途与资金充足性问题
        blocks:
          - type: paragraph
            body: >-
              CHAOS 的公开运营证据更多来自里程碑式验证，而不是已披露销售指标。公司称 Series C 资金将提升产品性能并扩大制造，Series D
              资金将进一步扩展产品开发和制造。这种表述符合资本密集型硬件加软件建设，而不是轻量软件业务。证据侧，2025 年底的里程碑真实但狭窄：$1.9M AFWERX TACFI 奖项、众议院批准的 $10M Eglin
              相关拨款、Forterra 集成测试，以及进入 G-TEAD 市场。这些里程碑显示技术可信度和接触国防买方的能力在改善，但都没有披露已确认收入、单位数量、利润率或现金转化时间。


              因此，即便完成 $510M Series
              D，资金充足性问题仍未解决。保留来源没有披露在手现金、月度烧钱速度、现金跑道、债务或优先股堆叠。这个缺口不是表面问题。制造爬坡、集成支持、培训和迭代循环都可能快速吞掉资本，尤其是如果部署仍依赖试点、演习和市场准入，而非稳定的正式项目。CHAOS
              也许资金充足；公开记录只是无法让外部人证明这一点。最稳妥的读法是，公司融资能力很强，但资本效率仍未知。
