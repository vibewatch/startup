      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              相关买方不是一个泛泛的“国防”预算，而是按任务分层。陆军和 NATO 战术边缘运营方会购买远征式反无人机感知，要求系统能快速评估，并叠加进既有效应器。空军测试和训练组织会购买 Eglin 这类 Astria
              风格仪器雷达，采购绑定具体任务现代化，而不是宽泛作战部署。本土防御和关键基础设施利益相关方构成第三类，尤其是在国内场站周边优先部署分层无人机防御和基地保护时。在这些分层中，预算归属往往先落在创新、试验或转化办公室，再扩展到更大的采办渠道。AFWERX
              和 SBIR/TACFI 机制清楚说明了这条路径：小企业需要合格的 Phase II 历史、政府赞助方，以及配套或转化支持，才能从原型跨到可部署能力。G-TEAD 和 Project Flytrap
              类型路径重要，因为它们缩短了从演示到战区采购的距离。因此，采用路径是顺序推进：原型可信度、野外演习验证、接入既有 C2 栈；如果一线反馈持续正向，再进入项目化规模。
