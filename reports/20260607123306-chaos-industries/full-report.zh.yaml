      - number: '2.2'
        title: 规模测算视角与保留的矛盾
        blocks:
          - type: paragraph
            body: >-
              用单一自上而下 TAM 看这里会误导，证据更适合用多重视角处理。较窄的商业化反无人机市场口径，从 ResearchAndMarkets 给出的 2026 年 $3.69B，到 360iResearch 给出的
              2026 年 $6.40B；Verified Market Reports 则把 2025 年基数放在约
              $2.5B。这些数字表面矛盾，但底层范围不同：有的来源只强调探测和拦截系统，有的把口径扩展到一体化软件、服务和相邻空域安全层。更宽的战略视角来自 Golden Dome 和本土防御现代化，资金引用从 $175B
              请求到更大的多年成本估计不等。这个资金池作为背景重要，但只有一部分能被 CHAOS
              现实服务，因为其中相当多属于拦截器、空间资产和传统平台项目。因此，最扎实的近期规模视角是自下而上：原型奖项、空军试验场改造工作、陆军市场准入，以及战术边缘感知部署。这个视角比 Golden Dome
              标题暗示的规模小，但更适合预测真实采用和估值相关性。
