  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接、传统、相邻与替代竞争图谱
        blocks:
          - type: paragraph
            body: >-
              相关竞争图谱比“其他雷达创业公司”更宽。直接重叠来自销售现代反无人机或空域感知栈的公司，它们会争夺同一类战术边缘感知预算。这个群体包括 Anduril、Epirus 和 Shield
              AI，即便它们的产品不是纯雷达；买方可以靠一体化自主系统、开放 C2，或效应器加感知，解决同一个作战问题。Saronic
              作为同产品竞争者的重要性较低，但作为资本密集型新型主承包商，它会争夺注意力、人才和任务相邻自主预算。传统层仍很强：RTX、Lockheed Martin、Northrop Grumman 和 L3Harris
              仍是许多雷达、导弹防御和指挥网络预算的默认归宿。现状替代方案还包括内部自建，以及由集成商牵头把点状传感器拼接进既有指挥架构。共同点是，买方很少只买一个孤立传感器；他们买的是一套架构，至少也是能部署并嵌入架构的子系统。
