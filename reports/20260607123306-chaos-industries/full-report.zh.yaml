      - number: '6.2'
        title: 具名客户证据与采购路径
        blocks:
          - type: paragraph
            body: >-
              当具名政府机构、资金额和使用场景三者对齐时，证据质量最强。按这个标准，Eglin 的 $1.9M U.S. Air Force TACFI 奖项是最好的公开证据点；众议院批准的 $10M Eglin
              拨款围绕同一条雷达开发路径提供了第二个信号。陆军证据更弱，但仍有意义：进入 G-TEAD 表明 CHAOS 在 Project Flytrap 4.5 后通过竞争评估，进入快速采办渠道；Soldier
              Systems 还补充称，陆军试验将在 2026 年继续。盟友中东协议和 Forterra 合作拓宽了宽度，但经济可读性较差，因为公开来源省略了客户身份、数量、交付或定价。AFWERX
              自身规则在这里是重要背景：TACFI 是从 Phase II 走向 Phase III 的桥梁，不是系统已经成为经常性全速项目的证明。同样的谨慎也适用于 G-TEAD 和
              Forterra。评估、市场准入和试验都是有价值的采用信号，但都不应与已披露经常性客户收入混淆。
