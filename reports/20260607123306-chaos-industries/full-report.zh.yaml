      - number: '5.4'
        title: 信任、合规与技术缺口分析
        blocks:
          - type: paragraph
            body: >-
              最大的未解问题不是这套架构听起来是否合理，而是信任、验证和披露深度。CHAOS 的公开页面没有披露客户数量、单价、公开认证、AI
              治理姿态，或详细网络安全和频谱合规材料。因此，公开信任姿态明显薄于部署叙事。这很关键，因为国防和关键基础设施买方关心的不只是探测性能；他们还关心运营方培训、人类监督、网络韧性、合规性，以及在受争夺环境中的可靠性。National
              Defense 明确警告，AI 驱动的国防系统必须验证性能、保持网络韧性，并保留有意义的人类控制。Curtiss-Wright 的 Golden Dome 评论同样强调
              ECCM、可信计算和模块化可升级性。CHAOS 在概念上符合这些要求，但公开证据尚未证明要求已落地运营。一个有用对照是 Epirus：其公开页面明确列出 CMMC Level 2 认证，而抓取到的 Chaos
              材料没有同等级认证表述。技术故事很强；信任与保障故事仍不完整。相邻反无人机厂商还带来另一层启示：保障证据本身可以成为产品特性。Epirus 公开宣传 CMMC Level 2 认证，CHAOS
              则没有在抓取集合中展示同等级认证或保障页面。这不能证明弱点，但意味着公开信任层仍薄于一些国防买方在采购从试验走向可重复部署时可能很快要求的水平。
