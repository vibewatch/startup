  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户图谱与证据等级
        blocks:
          - type: paragraph
            body: >-
              CHAOS Industries 把自己呈现为国防和关键基础设施平台公司，但抓取到的公开客户记录远窄于这个宽泛定位。最强的公开证据点集中在五项：Eglin 的空军 TACFI 工作、众议院支持的 Eglin
              拨款、Project Flytrap 4.5 之后进入陆军 G-TEAD 市场、一份盟友中东 Vanquish 协议，以及 Forterra
              集成试验。这意味着公开买方宇宙仍压倒性地偏政府和盟友国防。公司官网和技术页展示了管理层想卖给谁——作战人员、边境团队和商业航空运营方——但抓取来源中没有出现具名商业经常性客户。产品映射比客户映射更清楚：ASTRIA
              是 Eglin 工作背后的远程雷达，Vanquish 则是中东和陆军相关证据点背后的远征式预警系统。由此形成的分层在战略上连贯，但商业上偏薄，因为公开记录里的产品和任务细节仍多于付款方客户细节。
