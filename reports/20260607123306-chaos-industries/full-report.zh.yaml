      - number: '3.3'
        title: 分销能力、定价不透明与多供应商并用
        blocks:
          - type: paragraph
            body: >-
              这一组公司的定价大多不透明，这本身就有战略意义。对新兴国防公司来说，买方通常不是照着公开价格表选择；决定受项目准入、集成可信度、制造信心，以及谁已经控制系统相邻层影响。这有利于更大或嵌入更深的竞争者。Epirus
              可以指向具名陆军合同和一体化定向能效应。Shield AI 可以指向任务自主选择和仿真资产。Anduril
              可以同时利用资本规模和广泛系统触达。传统主承包商拥有最深的分销优势，因为它们已经在正式项目内拥有雷达、指挥和拦截器关系。不过，这不意味着买方会被锁进单一供应商。开放架构和竞争对手互操作证据显示，多供应商并用在增加：自主系统可以跑在竞争对手的飞机上，定向能效应器可以接收另一家公司的航迹，分布式传感器也可以补足传统
              C2，而不是替代它。这种动态有利于进入市场，但也削弱了 CHAOS 迅速成为唯一来源控制点的预期。
