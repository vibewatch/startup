chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、布局与产品栈
        blocks:
          - type: paragraph
            body: >-
              CHAOS Industries 是一家总部位于洛杉矶的国防科技公司，成立于 2022 年。无论在融资新闻稿还是产品页面里，公司都反复把自己放在 Coherent Distributed Networks
              这条主线上：用分布式感知和效应架构压缩无人机、导弹和其他自主威胁的探测时间。商业细节不清，但产品栈本身清楚：Vanquish 被描述为面向远征式、短至中程任务的分布式预警雷达，Astria
              则定位为用于持续监视和高精度跟踪的远程雷达。技术页和后续军方市场准入公告重复了同一组架构主题：自组网节点、双向时间传递、协同处理，以及与大型指挥控制系统互操作。


              地理布局一部分一致，一部分比核心融资叙事更宽。2025 年 11 月 Series D 新闻稿和 2025 年 12 月 G-TEAD 公告都称，CHAOS 总部在洛杉矶，并在 Washington,
              D.C.、San Francisco、Seattle 和 London 运营。当前官网列出的版图更广，还包括 San Diego 和 Amman。尽调时，最低可交叉印证的办公室清单，是 2025
              年底官方公告反复出现的五城组合；官网则暗示更大的运营版图，需要在尽调中确认。与这个版图一起缺失的是收入规模、客户数量和单位经济性。因此，即便公司快照在运营叙事上更强，财务透明度仍明显不足。
