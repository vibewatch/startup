      - number: '7.4'
        title: 竞争、合作伙伴依赖与财务不透明
        blocks:
          - type: paragraph
            body: >-
              CHAOS 不是在真空中竞争。Shield AI 在美国空军交易之后估值达到 $12.7 billion，Epirus 完成聚焦制造的 Series D 并拿到陆军合同，Anduril
              拥有宽平台版图，RTX、L3Harris 等主承包商仍在场——这些都说明这个市场同时看资本、合同证明和生态触达。这些对比并不意味着 CHAOS
              没有竞争力，但确实抬高了举证门槛。合作伙伴和渠道集中度又加重了这个门槛。Forterra 是进入机动力量防护的有用路径，但仍处于试验阶段。G-TEAD 是有用的美国陆军 / NATO
              机制，但目前只是市场入口。中东盟友对手方具备战略价值，但仍未披露。财务不透明让每一项风险都更深。抓取到的公开记录没有收入、毛利、烧钱速度、积压订单或续约经济性。即便 Series D
              融资本身显然增强了资产负债表韧性，也无法替代客户质量披露。因此，投资者只能在硬财务证据相对有限的情况下，承销一个复杂的国防硬件故事。竞争门槛也在移动，因为相邻国防独角兽正在披露快速产品集成、面向具体军种的原型交付和超大额融资。这些数据点不能证明
              CHAOS 会失足，但确实说明，当买方并排比较初创公司时，执行、披露节奏和资本化会叠加成真实战略风险。治理和运营财务也是如此。同业初创公司在扩张中公开董事会和 CFO
              升级，这会提升签约可信度和执行纪律。CHAOS
              可能也在做类似内部工作，但当交易对手比较供应商流程成熟度时，公开缺口本身就会变成风险。相邻风险同样重要：竞争对手已经把反无人机技术延伸到海事和更广泛关键资产任务，这可能把预算拉向那些承诺更宽任务效用的平台，而不是一个狭义雷达产品线。
