      - number: '7.3'
        title: 监管、出口管制与法律治理风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律栈很关键，即使公开证据还不完整。市场资料一贯显示，反无人机部署受制于合法处置规则、出口管制、频谱管理和人工监督。CHAOS
              尤其需要面对这一点，因为它最强的非美国验证之一是一份未披露对手方的中东盟友协议，但抓取到的公开记录里没有任何出口批准、产品分类细节或部署许可。Verified Market Reports
              也强调，电子和动能反制手段受法律限制；授权不清还会带来责任边界模糊。360iResearch 补充说，成功供应商越来越需要把技术能力与监管批准、安全论证和人机闭环交战协议对齐。问题不在于公开资料显示 CHAOS
              存在具体合规失败；而在于市场越来越要求法律治理成熟度，而 CHAOS 公开展示的内容并不多。因此，缺少公开 AI 安全或法律治理文件仍是真实尽调问题。竞争对手披露进一步放大风险。Epirus 在 2026
              年公开发布中宣传 CMMC 认证和一个具名国际反无人机合作，这两点都说明，合规和可出口集成正从私下尽调脚注变成可见采购标准。
