  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              分析 CHAOS 时，应把它放进以感知为牵引的国防市场，而不是整个本土导弹防御市场。公司的公开产品叙事锚定在 Vanquish 和 Astria：前者是远征式、低 SWaP 分布式预警雷达，后者是远程雷达，两者由
              Coherent Distributed Networks
              串联，而不是单一精密雷达。因此，最相关的纳入支出是分布式雷达节点、战术边缘反无人机感知、接入既有指挥控制架构，以及相邻测试和训练仪器。排除项包括大多数拦截器采购、天基防御层，以及由传统主承包商控制的全栈一体化防空和导弹防御项目。现状替代方案包括单体高成本雷达、RTX、Lockheed、Northrop
              和 L3Harris 的既有一体化防空栈，以及把点状传感器内部拼接进传统 C2。这个边界重要，因为 CHAOS 的差异化来自网络相干性、便携性和分散式生存能力，但它仍依赖自己尚未端到端拥有的更大交战架构。
