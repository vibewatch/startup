      - number: '1.2'
        title: 创始人、领导层补强与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              对一家扩张这么快的公司来说，创始团队的国防网络密度很高。CHAOS 官方来源列出 John Tenet、Bo Marr、Gavin Hood 和 Brett Cummings 为创始人，过往经历覆盖
              Epirus、8VC、Raytheon、Palantir 和英国情报体系。这一点重要，因为公司的公开证据仍更多依赖建造系统的人本身有多可信，而不是已披露的商业指标。后续领导层补强延续了这个模式。2024 年 10
              月，CHAOS 聘请前国会议员、CIA 老兵 Will Hurd 担任首席战略官；2025 年 4 月，公司任命前 CIA 局长 George J. Tenet
              为执行董事长，负责董事会活动和治理。这些任命提升了政策触达、国防可信度和董事会分量，但也凸显出公司的公开叙事仍高度围绕 John Tenet 和 Bo Marr。


              零散披露的员工数显示公司在增长，但连续性不足，难以评估组织厚度。CHAOS 宣布 Will Hurd 加入时披露超过 70 名专业人员，约六个月后宣布 George Tenet 时披露 100
              名专业人员。这是进展，但没有完整领导层名单，没有披露
              CFO，也没有按工程、制造、销售或政府项目职能拆分人员。治理图景因此比创立初期方向上更强，但关键人物依赖仍然实质存在：公司的最强公开证据仍来自少数创始人和高知名度任命，而不是可持续的运营披露。
