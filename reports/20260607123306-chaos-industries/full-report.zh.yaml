  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价可见度
        blocks:
          - type: paragraph
            body: >-
              CHAOS 的公开财务可见度，从一个不舒服的事实开始：公司几乎没有披露任何类似传统软件或硬件价格表的信息。最好的公开运营视角来自
              Sacra，后者将业务描述为硬件销售、软件许可和支持合同的组合，并把低六位数节点定价作为粗略参考值，而非已验证合同条款。CHAOS 官方页面印证了产品架构，却没有印证变现细节：首页和技术页解释
              Vanquish、Astria 与 Coherent Distributed Networks 要做什么，融资新闻稿解释为什么需要新资本，但这些材料都没有公布标价、合同期限、经常性许可结构或收入确认政策。


              这很重要，因为商业模式可能落在不止一个财务类别里。如果 CHAOS
              销售的是硬件占比高的部署，并附带软件和支持，毛利率与营运资本动态可能会与纯软件国防平台很不一样。反过来，如果公司越来越靠软件定义升级和网络化感知订阅变现，长期毛利潜力可能明显扩大。公开记录无法区分这两种情况。唯一可辩护的结论是，定价证据只能指方向，不能下定论；在合同条款和实际
              ASP 披露之前，承销应把每一个公开价格信号都当作参考值。
