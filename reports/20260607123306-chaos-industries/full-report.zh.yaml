      - number: '4.3'
        title: 市场需求顺风与转化风险
        blocks:
          - type: paragraph
            body: >-
              品类背景是建设性的。360iResearch 和 Research and Markets 都描述了一个在 2026
              年及之后快速增长的反无人机市场，尽管它们对绝对基数和预测路径判断不同。两者都强调市场正转向把感知、指挥控制和响应结合起来的分层架构。广泛需求顺风解释了为什么 CHAOS 能如此快速地融资。Army
              Replicator 材料也显示，Pentagon 正试图更快把反无人机方案推到一线。换句话说，市场需求本身没有明显问题。


              收入转化风险在别处。Teal Group 称，Golden Dome 相关雷达支出中有相当一部分仍属投机性或尚未签约；更通用的市场报告也警告，关税、RF
              部件成本和集成复杂度会推高生产成本。联邦采购系统有助于尽调，但不足以支撑承销：FPDS 提供合同动作数据，USAspending 提供奖项可见度，但 FPDS
              也说明不会提供完整合同、工作说明书或分包细节。因此，公开数据室按设计就是不完整的。对 CHAOS 最重要的含义很简单：市场看起来真实，但公司还没有公开把市场转化为已披露的收入质量。
