        title: 反向证据与未解决尽调缺口
        blocks:
          - type: paragraph
            body: >-
              反向解读很直接。Forbes 在 2025 年 4 月写道，Chaos 尚未宣布任何重大合同；即便在后续里程碑之后，公司披露的仍是狭窄、里程碑密集的客户故事，而不是耐久收入故事。Army 和 C-UAS Hub
              关于 Replicator 2 的报道显示，快速采购渠道是真实的，但首个已披露本土反无人机采购给了 Fortem，而不是
              CHAOS，提醒投资人快速采办路径仍竞争激烈。市场来源也强调转化风险：出口管制、法律限制、误报担忧和更广的互操作要求，都会放慢盟友和伙伴扩张。这些不是抽象行业问题；当一家公司的公开客户叙事依赖一份盟友协议、一个陆军市场和采购前
              Forterra
              试验时，它们尤其相关。缺失证据具体且可行动：续约、复购、运营方推荐、客户数量、集中度组合和合同经济性。在这些证据出现前，正确结论是，最强证据支持真实需求兴趣和真实政府接触，但尚未证明公开可验证的经常性客户基础。
