      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              CHAOS 的乐观情景并不抽象：公司把市场入口、AFWERX / Eglin 验证和集成测试转化为可重复入账的项目，披露足够收入质量以支撑溢价倍数，并证明制造扩张不会压垮毛利。在这种情况下，估值高于 Series
              D
              标记是可能的，因为公司会开始更像一个已规模化的采购与软件平台，而不是一个叙事很强但不透明的国防独角兽。基准情景更克制，也更符合当前证据：公开披露仍偏薄，军事能见度改善，估值大致守在最新轮次标记附近，投资者等待更硬的经济性证明。


              悲观情景同样清楚。如果市场热情降温，如果 Golden Dome 和反无人机预算转化慢于标题暗示，或者如果 CHAOS 仍无法或不愿披露收入质量，那么当前溢价就容易受到下轮估值下调的冲击。Epirus
              据报道存在低于上一轮定价风险，正好提醒我们：当证明滞后于叙事时，国防科技倍数会压缩。关键在于，三种情景区间都取决于证据质量，而不只是公司质量。CHAOS 的上行和下行，都系于能否从能见度里程碑迈向经济性里程碑。
