      - number: '8.2'
        title: 可比公司组与相对公开证明
        blocks:
          - type: paragraph
            body: >-
              保留下来的可比公司组指向克制，而不是亢奋。Shield AI 2026 年 3 月融资锚定在 $12.7 billion，背后有美国空军 Collaborative Combat Aircraft
              项目这一可见催化，也有更复杂的融资结构，包括优先股和延迟提取资本。Saronic 官网展示 $9.25 billion 估值，并强调一份 $392 million
              海军合同，显示出明显更大的公开合同规模。Epirus 是最有启发的下限可比：Reuters 未披露其最新估值，Tech Funding News 报道其存在低于上一轮定价的风险，但 Epirus 仍披露了
              $43.55 million 陆军合同和超过 $550 million 的累计融资。即使 Anduril 不是干净的直接可比，保留来源中出现它，也只是提醒我们，顶级国防科技平台可以做得多大、多多元。


              相比这些同业，CHAOS 的估值处在中间，公开运营披露接近底部。公司有足够里程碑，值得纳入同业讨论；但公开经济性还不足以支撑同业级透明度。这并不会否定 $4.5 billion
              标记，但意味着举证责任仍落在未来披露和项目转化上，而不是只靠品类动能。
