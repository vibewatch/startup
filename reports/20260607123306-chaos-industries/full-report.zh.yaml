  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品家族与核心架构
        blocks:
          - type: paragraph
            body: >-
              关于 CHAOS，最重要的产品事实是：公司展示的不是单一雷达设备，而是基于 Coherent Distributed Networks 的产品家族。公开材料显示三个核心元素。Vanquish
              是远征式分布式预警雷达，面向短至中程探测和跟踪。Astria 是远程雷达，聚焦高精度跟踪、扩展距离监视和持续监测。两者底下是 CDN
              架构：自组网节点、通过双向时间传递实现的相干授时，以及可与大型指挥控制系统互操作的协同数据处理。这套架构逻辑重要，因为它编码了公司的差异化。CHAOS
              主张，不把感知价值集中在一个精密节点上，而是用数量更多、成本更低且相干的节点，提高韧性、野外部署能力和决策时间。官网和 Series D 材料还用激进营销说法包装系统，包括提前 10 分钟感知威胁、跟踪至 250
              km、以每平方公里 $100 运行；但这些数字在独立验证前仍停留在营销层面。
