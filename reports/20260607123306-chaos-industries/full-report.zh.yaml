      - number: '3.2'
        title: 直接同业画像与能力范围
        blocks:
          - type: paragraph
            body: >-
              最强的直接同业压力来自资金更充足、产品边界更宽的公司。Anduril 是最清楚的例子：即便缓存中的公开产品页内容有限，它的融资历史、国家安全业务宽度和开放 C2
              姿态，也让它成为任何重视全栈集成而非最佳单点雷达节点项目中的强大相邻对手。Epirus 在当下反无人机栈中更具运营可比性，因为 Leonidas
              被明确销售为分层短程防空和反蜂群方案，并有近期陆军合同获胜和实弹演示支撑。Shield AI 从自主层向上竞争，用 Hivemind 作为跨平台软件楔子，可搭载多种飞机，甚至可上竞争对手的
              Collaborative Combat Aircraft 平台。Saronic 并不销售同一款雷达产品，但它的估值、海军牵引力和自主叙事说明，机构资本正大量追逐任务专用国防系统。面对这组公司，CHAOS
              的差异化在于相干分布式感知，而不在资本规模，也不在控制完整自主或效应器栈。
