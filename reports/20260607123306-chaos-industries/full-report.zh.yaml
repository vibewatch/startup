      - number: '5.3'
        title: 生存能力、制造与技术依赖
        blocks:
          - type: paragraph
            body: >-
              CHAOS 的生存能力论点不只是物理机动性，也包括架构分散。公司自有材料主张，多个低成本相干节点可以在性能和生存性上超过单一精密雷达，因为感知被分布式放置，并可推向战术边缘。Series D 叙事进一步强调
              Ziva 的无线时间同步技术是跨节点相干授时的基础。这形成了一条关键依赖栈：同步、高速计算、网络、与外部 C2 互操作，以及制造规模。Golden Dome
              和现代雷达的外部来源也强化了同一组要求，把边缘计算、ECCM、AI
              信号处理和低延迟分布式传感器融合称为设计必需品，而不是锦上添花。因此，产品可信，恰恰因为它贴合买方所说的雷达架构演进方向；但如果其中任何依赖表现不佳，产品也会很脆弱。授时相干失败、受争夺频谱干扰、网络薄弱或制造扩产缓慢，都可能侵蚀分布式架构本来要创造的作战优势。竞争对手披露也显示预期变化有多快。Epirus
              用 2026 年和 2025 年底发布内容，强调自主移动 HPM 集成、盟友反无人机合作，以及具体效应链设计获胜。这些公告不能直接证明 CHAOS 落后，但它们说明，买方会越来越把 CHAOS
              不只与传统雷达比较，也会与已经发布更广泛互操作和保障标记的全栈、重视认证的国防系统比较。
