      - number: '3.4'
        title: 护城河耐久度与反向证据
        blocks:
          - type: paragraph
            body: >-
              乐观逻辑是，CHAOS 确实有产品层面的区分度：相比大型精密雷达节点，分布式相干感知可能更能生存、更易扩展，也更适合战术边缘部署。反向逻辑是，买方可能更看重架构控制，而不是感知优雅。开放 C2
              生态和分层防御构造意味着，竞争对手可以从相邻层包围同一个问题，并中和 CHAOS 的相当一部分差异化。Epirus 和 Anduril 已经在反无人机场景中展示第三方集成。Shield AI
              正证明软件自主可以搭载在自己不制造的硬件之上。传统主承包商则能用采购权力、已装机指挥系统，以及远大于创业公司资产负债表的远程雷达预算回应。相较竞争者，CHAOS
              对客户、定价和产能规模披露也很少，使护城河耐久度更难承销。结论不是 CHAOS 没有边缘优势，而是这项优势看起来最耐久的形态，是分层架构中的高价值组件；它尚未成为能挡住资金更充足对手的平台。
