  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct, Incumbent, Adjacent, and Substitute Landscape
        blocks:
          - type: paragraph
            body: >-
              The relevant competitor map is wider than “other radar startups.” Direct overlap comes from companies
              selling modern counter-UAS or air-domain-awareness stacks that can compete for the same tactical-edge
              sensing budget. That group includes Anduril, Epirus, and Shield AI even when their products are not pure
              radar, because buyers can solve the same operational problem through integrated autonomy, open C2, or
              effectors plus sensing. Saronic matters less as a same-product rival than as a capital-intensive defense
              neo-prime competing for attention, talent, and mission-adjacent autonomy budgets. The incumbent layer is
              still powerful: RTX, Lockheed Martin, Northrop Grumman, and L3Harris remain the default homes for many
              radar, missile-defense, and command-network dollars. Status-quo substitutes also include internal build
              and integrator-led stitching of point sensors into existing command architectures. The common thread is
              that buyers rarely purchase one isolated sensor; they buy an architecture or at least a deployable
              subsystem that fits into one.
