  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Family and Core Architecture
        blocks:
          - type: paragraph
            body: >-
              The most important product fact about CHAOS is that the company is not presenting a single radar
              appliance; it is presenting a product family built on Coherent Distributed Networks. Public materials show
              three core elements. Vanquish is the expeditionary distributed early-warning radar designed for short- to
              mid-range detection and tracking. Astria is the long-range radar focused on high-precision track,
              extended-range surveillance, and persistent monitoring. Beneath both sits the CDN architecture:
              self-forming nodes, coherent timing through two-way time transfer, and cooperative data processing that
              can interoperate with larger command-and-control systems. That architectural logic matters because it
              encodes the company’s differentiation. Rather than concentrating sensing value in one exquisite node,
              CHAOS argues that more numerous, cheaper, coherent nodes improve resilience, fieldability, and decision
              time. The homepage and Series D materials further frame the system with aggressive marketing claims around
              sensing threats 10 minutes sooner, tracking to 250 km, and operating at $100 per square kilometer, but
              those numbers remain marketing-level until independently validated.
