      - number: '7.2'
        title: Supply-chain, manufacturing, and operational scale risk
        blocks:
          - type: paragraph
            body: >-
              Scale execution is the second major risk because the public record shows more fundraising than operating
              metrics. Series B, Series C, and Series D all promise high-volume or expanded manufacturing, but none of
              the fetched sources disclose output, defect rates, yield, or delivery cadence. That gap matters because
              distributed radar systems are hardware-heavy and depend on sensors, compute, timing, and communications
              components that are exposed to cost inflation and supply constraints. Research and Markets explicitly says
              semiconductors, RF modules, and sensors are getting more expensive in counter-UAS, while Sacra flags
              likely export-control sensitivity and specialized component dependence. The engineering bar is also high.
              Curtiss-Wright notes that resilient radar in contested spectrum must detect jamming, re-tune frequencies,
              regenerate waveforms, and move data quickly across nodes. CHAOS claims interoperability, but public
              evidence of certified or independently validated performance remains thin. If manufacturing and field
              reliability lag the sales narrative, customer conversion could fail even if demand exists. Rival
              disclosures reinforce the point. Epirus is publicly building training infrastructure, mobility
              partnerships, and manufacturing-acceleration channels around counter-UAS systems. That does not prove
              CHAOS lacks similar work, but it does show that execution risk now includes whether the company is
              building the enablement stack around the product, not just the product itself.
            claimRefs:
              - CR007
