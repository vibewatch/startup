      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The biggest analytical trap in this chapter is to treat the presence of named military proof points as
              evidence of customer durability. The fetched sources do not justify that leap. No public source discloses
              NRR, GRR, churn, contract renewal dates, reorder volumes, operator-satisfaction data, or
              customer-concentration percentages. The only public economics directly tied to customer proof are the $1.9
              million TACFI award and the $10 million congressional appropriation. Everything else — G-TEAD, the Middle
              East agreement, and Forterra — is strategically interesting but economically opaque. That opacity matters
              because the public proof set is still small enough that concentration risk is almost certainly high, even
              though its exact magnitude cannot be sized from the fetched record. Expansion loops do exist. G-TEAD could
              widen access across Army and NATO commands; Forterra could create a vehicle-borne mobile-C-UAS channel;
              and the allied Middle East agreement suggests exportable demand. But every one of those loops still
              requires conversion from milestone to repeat buying. Until follow-on orders or renewals appear, the
              prudent view is that customer durability remains unproven. Competitive disclosure also matters here.
              Saronic and Anduril show how category leaders increasingly package public mission pages, product stacks,
              and contract-linked coverage into a stronger buyer-proof loop. That does not change CHAOS' direct
              evidence, but it raises the standard against which investors should judge whether customer proof is broad
              enough, sticky enough, and transparent enough to support premium valuations in defense-tech categories.
              Saronic's own Series D announcement makes the same point from the company side: financing is being sold to
              the market as proof of customer relevance and mission urgency. That dynamic increases the penalty for
              companies like CHAOS when public customer references remain sparse.
