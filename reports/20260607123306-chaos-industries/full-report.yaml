      - number: '2.2'
        title: Sizing Lenses and Preserved Contradictions
        blocks:
          - type: paragraph
            body: >-
              A single top-down TAM is misleading here, so the evidence is better handled through multiple lenses. The
              narrow commercialized counter-UAS market lens ranges from $3.69 billion in 2026 from ResearchAndMarkets to
              $6.40 billion in 2026 from 360iResearch, while Verified Market Reports puts the 2025 base nearer $2.5
              billion. Those figures are contradictory on the surface, but the underlying scopes differ: some sources
              emphasize detection and interdiction systems only, others broaden into integrated software, services, and
              adjacent airspace-security layers. A wider strategic lens comes from Golden Dome and homeland-defense
              modernization, where funding references range from a $175 billion request to far larger multi-decade cost
              estimates. That pool is important as context, but only a fraction is realistically serviceable by CHAOS
              because much of it belongs to interceptors, space assets, and incumbent platform programs. The most
              grounded near-term sizing lens is therefore bottom-up: prototype awards, Air Force test-range adaptation
              work, Army marketplace access, and tactical-edge sensing deployments. That lens is smaller than Golden
              Dome headlines imply, but more actionable for forecasting real adoption and valuation relevance.
