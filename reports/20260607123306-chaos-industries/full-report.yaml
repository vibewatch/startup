      - number: '4.2'
        title: Operating proof, capital uses, and adequacy questions
        blocks:
          - type: paragraph
            body: >-
              CHAOS’s public operating proof comes from milestone-style validation more than from disclosed sales
              metrics. The company says Series C money will enhance product performance and scale manufacturing, while
              Series D money will expand product development and manufacturing further. That language is consistent with
              a capital-intensive hardware-plus-software buildout rather than with a lightweight software business. On
              the proof side, late-2025 milestones are real but narrow: a $1.9 million AFWERX TACFI award, a
              House-approved $10 million Eglin-linked appropriation, Forterra integration testing, and G-TEAD
              marketplace inclusion. Those milestones suggest technical credibility and improving access to defense
              buyers, yet none of them disclose revenue recognized, unit volumes, margins, or cash-conversion timing.


              The capital-adequacy question is therefore unresolved even after a $510 million Series D. No retained
              source discloses cash on hand, monthly burn, runway, debt, or preference stack. That omission is not
              cosmetic. Manufacturing ramp, integration support, training, and iteration loops can absorb capital
              quickly, especially if fielding still depends on pilots, exercises, and marketplace access rather than on
              durable programs of record. CHAOS may be adequately financed; the public record simply does not let an
              outsider prove it. The safest reading is that capital access is strong, but capital efficiency remains
              unknown.
