      - number: '5.4'
        title: Trust, Compliance, and Technical Gap Analysis
        blocks:
          - type: paragraph
            body: >-
              The largest open questions are not about whether the architecture sounds plausible; they are about trust,
              validation, and disclosure depth. CHAOS’s public pages do not disclose customer counts, unit pricing,
              public certifications, AI-governance posture, or detailed cyber and spectrum-compliance artifacts. Public
              trust posture is therefore materially thinner than the deployment narrative. This matters because buyers
              in defense and critical infrastructure care about more than detection performance: they care about
              operator training, human oversight, cyber resilience, compliance, and reliability in contested
              environments. National Defense explicitly warns that AI-enabled defense systems must validate performance,
              remain cyber resilient, and preserve meaningful human control. Curtiss-Wright’s Golden Dome commentary
              similarly emphasizes ECCM, trusted compute, and modular upgradability. CHAOS aligns conceptually with
              those requirements, but the public evidence does not yet prove they are operationalized. A useful contrast
              is Epirus, whose public surface explicitly lists CMMC Level 2 certification while Chaos’s fetched
              materials are silent on equivalent attestations. The technical story is strong; the trust-and-assurance
              story is still incomplete. Another implication from adjacent counter-UAS vendors is that assurance
              evidence itself can become a feature. Epirus publicly advertised CMMC Level 2 certification, while CHAOS
              has not surfaced an equivalent certification or assurance page in the fetched set. That does not prove
              weakness, but it does mean the public trust layer remains thinner than what some defense buyers may soon
              expect when procurement moves from experimentation to repeatable fielding.
