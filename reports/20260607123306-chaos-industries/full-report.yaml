      - number: '7.5'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              These risks are not equally fatal. Some are manageable with stronger diligence: export approvals can be
              checked, manufacturing metrics can be requested, and board or operating-bench depth can be verified. The
              thesis breaks when the same missing evidence persists alongside non-conversion. The cleanest kill
              criterion is simple: if no Phase III, reorder, production contract, or similarly durable follow-on emerges
              from Eglin, G-TEAD, the allied agreement, or Forterra, then the public customer story remains
              strategically promising but commercially shallow. Secondary kill criteria are also monitorable. If the
              company cannot provide credible manufacturing and quality metrics, scale assumptions should be cut. If no
              export-compliance or safety-case material exists for allied deployment, international upside should be
              discounted heavily. If better-capitalized peers continue winning larger contracts while CHAOS remains
              evaluation-stage in public, competition risk should be marked up. This is why the chapter’s risk stack is
              compound rather than isolated: conversion, operations, regulation, competition, and transparency all feed
              one another.
            claimRefs:
              - CR034
              - CR038
              - CR040
              - CR042
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation context and what the price actually reflects
        blocks:
          - type: paragraph
            body: >-
              The latest supportable mark for CHAOS is the November 2025 Series D at a $4.5 billion valuation. Set
              against the reported $2.0 billion Series C mark from spring 2025, that is a 2.25x valuation step-up in
              roughly half a year. Tracxn’s disclosed round table sums lifetime funding to exactly $1.0 billion, while
              the official Series D release rounds the same outcome to over $1 billion. Those are consistent enough for
              context, and together they establish the key point: CHAOS is no longer being valued like an early
              proof-of-concept startup. It is being valued like a late-stage defense-technology platform expected to
              convert technical credibility and procurement access into durable scale.


              What the price clearly reflects is investor conviction, founder pedigree, and category urgency. What it
              does not yet clearly reflect is public economic proof. The public record still lacks revenue, ARR, gross
              margin, burn, runway, and customer count. So the financing context is strong but incomplete. Investors may
              have seen enough private data to justify the jump; outsiders have not. That gap is the foundation of the
              valuation stance in this chapter: price has moved faster than public disclosure quality.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV021
              - CV042
