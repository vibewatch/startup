            body: >-
              The fetched evidence shows that CHAOS is already being shaped by real deployment pathways rather than
              remaining a pure lab concept. Vanquish has been added to the Army’s G-TEAD marketplace after Project
              Flytrap 4.5, where the Army emphasized expeditionary sensing and stay-behind capabilities and explicitly
              positioned the system as complementary to existing command and effector architectures. CHAOS has also tied
              itself to operator feedback cycles by promising on-site training, integration support, and rapid iteration
              through 2026. On the mobility side, the Forterra partnership embedded Vanquish on a SMET equipped with
              AutoDrive, with both the official release and Axios coverage stressing survivability and forward
              deployment advantages when sensors move ahead of personnel. Astria’s path is different but equally
              concrete: AFWERX selected it for a TACFI-funded adaptation into a multi-object tracking instrumentation
              radar for Eglin, and CHAOS separately cited a larger appropriation to support that training mission.
              Together these paths show that product workflow is deployment-first: integrate, test, train operators,
              collect feedback, and only then attempt scaled fielding.
