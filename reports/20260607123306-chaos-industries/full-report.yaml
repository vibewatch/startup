      - number: '2.4'
        title: Growth Drivers, Constraints, and Timing Risk
        blocks:
          - type: paragraph
            body: >-
              The clearest market driver is doctrinal: both official and industry sources emphasize layered, modular,
              scalable counter-UAS and radar architectures rather than single-purpose point tools. Drones at scale,
              critical-infrastructure protection, and the need for geographically distributed sensing all favor a
              CHAOS-style architecture. Open and modular networking requirements also strengthen the case for systems
              that complement existing command stacks instead of forcing a full platform replacement. At the same time,
              the friction is real. National Defense explicitly warns that Golden Dome can fail through bureaucratic
              fragmentation, unclear mission ownership, and funding misalignment even if the engineering logic is sound.
              Teal likewise notes that radar budgets have historically been easy to trim and that hard Golden Dome
              program numbers were still unresolved. Supply-chain and tariff pressure on semiconductors, RF modules, and
              sensors further pushes cost and schedule risk into the market. For CHAOS, this means the adoption curve
              can be strong in concept while remaining uneven in contract timing. The market is favorable, but not
              frictionless, and investors should discount hype-driven top-down spending narratives in favor of
              verifiable deployment channels and program transitions.
