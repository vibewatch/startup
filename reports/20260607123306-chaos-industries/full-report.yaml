  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Public financial visibility for CHAOS starts with the uncomfortable fact that the company discloses almost
              nothing that looks like a classic software or hardware price sheet. The best public operating view comes
              from Sacra, which describes the business as a mix of hardware sales, software licensing, and support
              contracts, with low-six-figure node pricing as a rough proxy rather than a verified contract term.
              Official CHAOS surfaces corroborate the product architecture but not the monetization details: the
              homepage and technologies page explain what Vanquish, Astria, and Coherent Distributed Networks are meant
              to do, while the financing releases explain why new capital is needed, but none of those materials publish
              list pricing, contract duration, recurring-license structure, or revenue-recognition policy.


              That matters because the business model could land in more than one financial bucket. If CHAOS is selling
              hardware-heavy deployments with attached software and support, gross margin and working-capital dynamics
              could look very different from those of a pure software-defense platform. If, by contrast, the company is
              increasingly monetizing software-defined upgrades and networked sensing subscriptions, margin potential
              could expand meaningfully over time. The public record cannot distinguish between those cases. The only
              defensible conclusion is that pricing evidence is directional, not definitive, and that underwriting
              should treat every public price signal as a proxy until contract terms and realized ASPs are disclosed.
