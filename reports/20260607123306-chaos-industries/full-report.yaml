      - number: '5.3'
        title: Survivability, Manufacturing, and Technical Dependencies
        blocks:
          - type: paragraph
            body: >-
              CHAOS’s survivability thesis is not just physical mobility; it is also architectural disaggregation. The
              company’s own materials argue that multiple low-cost coherent nodes can outperform and out-survive a
              single exquisite radar because sensing is distributed and can be pushed toward the tactical edge. The
              Series D narrative strengthens this by highlighting Ziva’s wireless time-synchronization technology as
              foundational for coherent timing across nodes. That creates a critical dependency stack: synchronization,
              high-speed compute, networking, interoperability with external C2, and manufacturing scale. External
              sources on Golden Dome and modern radar reinforce the same requirements, highlighting edge compute, ECCM,
              AI signal processing, and low-latency distributed sensor fusion as design necessities rather than
              nice-to-haves. The product is therefore credible precisely because it aligns with where buyers say radar
              architecture is moving, but it is also fragile if any of those dependencies underperform. Timing coherence
              failure, contested-spectrum interference, weak networking, or slow manufacturing scale-up could all erode
              the operational advantage that the distributed architecture is meant to create. Competitive disclosures
              also show how quickly expectations are moving. Epirus used 2026 and late-2025 releases to highlight
              autonomous mobile HPM integration, allied counter-UAS partnerships, and specific effect-chain design wins.
              Those announcements are not direct evidence that CHAOS is behind, but they do show that buyers will
              increasingly compare CHAOS not just against legacy radars, but against fully integrated,
              certification-aware defense stacks that already publish broader interoperability and assurance markers.
