      - number: '7.3'
        title: Regulatory, export-control, and legal-governance risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory and legal stack is material even though the public evidence is incomplete. Market sources
              consistently say counter-UAS deployment is gated by lawful mitigation rules, export controls, spectrum
              management, and human oversight. That is especially relevant to CHAOS because one of its strongest
              non-U.S. proof points is an undisclosed allied Middle East agreement, yet no public export approvals,
              product classification details, or deployment permissions appear in the fetched record. Verified Market
              Reports also highlights legal restrictions on electronic and kinetic countermeasures and the liability
              ambiguity that follows from poor authorization. 360iResearch adds that successful vendors increasingly
              align technical capability with regulatory approval, safety cases, and human-in-the-loop engagement
              protocols. The issue here is not that public sources show a specific compliance failure at CHAOS; rather,
              they show that the market increasingly demands legal-governance maturity and that CHAOS has not publicly
              shown much of it. The absence of public AI safety or legal-governance documentation therefore remains a
              real diligence problem. Competitive disclosures sharpen that risk. Epirus used 2026 public releases to
              advertise CMMC certification and a named international counter-UAS partnership, both of which suggest that
              compliance and exportable integration are becoming visible buying criteria rather than private diligence
              footnotes.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
