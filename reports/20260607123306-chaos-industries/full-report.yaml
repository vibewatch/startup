      - number: '2.3'
        title: Buyer Segments, Budget Owners, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The relevant buyer set is segmented by mission rather than by one generic “defense” budget. Army and NATO
              tactical-edge operators are buyers for expeditionary counter-UAS sensing that can be evaluated quickly and
              layered into existing effectors. Air Force test-and-training organizations are buyers for Astria-style
              instrumentation radar at Eglin, where procurement is tied to mission-specific modernization rather than
              broad operational deployment. Homeland-defense and critical-infrastructure stakeholders form a third
              segment, especially where layered drone defense and base protection are prioritized around domestic sites.
              Across these segments, budget ownership often sits with innovation, experimentation, or transition offices
              before scaling into larger acquisition channels. AFWERX and SBIR/TACFI mechanisms illustrate this path
              clearly: small businesses need a qualifying Phase II history, a government sponsor, and matching or
              transition support to bridge from prototype to deployable capability. G-TEAD and Project Flytrap-type
              pathways matter because they shorten the path from demonstration to theater purchase. The adoption path is
              therefore sequential: prototype credibility, field exercise validation, integration into an existing C2
              stack, then programmatic scale if operator feedback stays positive.
