  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              CHAOS should be analyzed inside a sensing-led defense market, not the entirety of homeland missile
              defense. Its public product surface is anchored on Vanquish, an expeditionary low-SWaP distributed
              early-warning radar, and Astria, a long-range radar, both tied together by Coherent Distributed Networks
              rather than a single exquisite radar. That means the most relevant included spend is for distributed radar
              nodes, tactical-edge counter-UAS sensing, integration into existing command-and-control architectures, and
              adjacent test-and-training instrumentation. Excluded spend includes most interceptor procurement,
              space-based defense layers, and full-stack integrated air-and-missile-defense programs controlled by
              incumbent primes. Status-quo substitutes include monolithic high-cost radars, incumbent integrated
              air-defense stacks from RTX, Lockheed, Northrop, and L3Harris, as well as internal stitching of point
              sensors into legacy C2. The boundary matters because CHAOS is differentiated by network coherence,
              portability, and disaggregated survivability, but it is still dependent on broader engagement
              architectures it does not yet own end to end.
