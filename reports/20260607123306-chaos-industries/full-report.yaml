      - number: '1.4'
        title: Milestones, government validation, and adverse checks
        blocks:
          - type: paragraph
            body: >-
              The late-2025 operating record is stronger than the early-2025 one. In April 2025 Forbes reported that
              CHAOS had released relatively few capability details and had not yet announced major contracts. By
              September 2025 the company disclosed a $1.9 million AFWERX TACFI award tied to Astria and a separate $10
              million House appropriation for Eglin Air Force Base-related radar work. In October 2025 Axios reported
              live testing with Forterra’s autonomous vehicle stack, and in December 2025 CHAOS announced G-TEAD
              marketplace inclusion after Project Flytrap 4.5 in Germany. Those are real validation milestones, but they
              are not the same as disclosed recurring revenue, long-duration unit pricing, or program-of-record cash
              conversion.


              That distinction matters because the broader mission set is still exposed to sector-level uncertainty.
              National Defense Magazine describes Golden Dome as a massively complex system-of-systems challenge, while
              public Army Replicator materials show that homeland counter-UAS procurement is moving quickly but not
              necessarily toward CHAOS specifically. The result is a mixed but understandable company-overview verdict:
              CHAOS has assembled a credible founder group, attracted elite investors, named recognizable
              national-security leaders, and advanced products into meaningful field evaluations. The adverse side is
              disclosure opacity. Public sources still do not resolve customer count, revenue scale, or the economics of
              the contracts and acquisition pathways now being advertised.
