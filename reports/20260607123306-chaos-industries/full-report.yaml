      - number: '3.3'
        title: Distribution Power, Pricing Opacity, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Pricing is mostly opaque across this set, which is itself strategically important. For emerging defense
              companies, the buyer does not usually choose off a public price sheet; the decision is shaped by access to
              programs, integration credibility, manufacturing confidence, and who already controls adjacent layers of
              the system. That favors larger or more embedded rivals. Epirus can point to named Army contracts and
              integrated directed-energy effects. Shield AI can point to mission-autonomy selection and simulation
              assets. Anduril can leverage both capital scale and broad systems reach. Incumbents bring the deepest
              distribution advantage of all because they already own radar, command, and interceptor relationships
              inside programs of record. This does not mean buyers are locked into one vendor, however. Open
              architectures and evidence from rival interoperability suggest increasing multi-homing: autonomy can sit
              on a competitor’s aircraft, a directed-energy effector can ingest another company’s tracks, and
              distributed sensors can complement incumbent C2 rather than replace it. That dynamic is good for market
              entry, but it also weakens any expectation that CHAOS can become a sole-source control point quickly.
            claimRefs:
