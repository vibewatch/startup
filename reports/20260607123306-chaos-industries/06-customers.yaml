    statement: AFWERX’s TACFI page says only active or recently completed Phase II efforts with a government point of contact are eligible, meaning TACFI is a bridge program layered on top of Phase II rather than a proof of steady customer renewals.
    type: observed
    topic: procurement-pathway
    sourceRefs:
