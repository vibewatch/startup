chapter:
  number: 6
  title: Customers
  summary: 'Public customer disclosure is sparse. The strongest named proof points are the U.S. Air Force TACFI award at Eglin, the House-approved $10 million Eglin appropriation tied to SBIR development, Army G-TEAD marketplace access after Project Flytrap 4.5, an allied Middle East Vanquish agreement, and Forterra integration trials. Those are meaningful adoption signals, but they are not the same as recurring customer revenue: no public renewals, retention metrics, customer count, concentration table, or contract economics are disclosed.'
sections:
- id: section-customer-map
  title: Customer map and evidence grade
  body: 'CHAOS Industries presents itself as a defense-and-critical-infrastructure platform company, but the fetched public customer record is much narrower than that broad positioning suggests. The strongest public proof points cluster around five items: Air Force TACFI work at Eglin, the House-backed Eglin appropriation, Army G-TEAD marketplace inclusion after Project Flytrap 4.5, an allied Middle East Vanquish agreement, and Forterra integration trials. That means the public buyer universe is still overwhelmingly government and allied-defense oriented. The company homepage and technology pages show where management wants to sell — warfighters, border teams, and commercial air operators — yet no named commercial recurring customer appears in the fetched sources. Product mapping is clearer than customer mapping: ASTRIA is the long-range radar behind the Eglin work, while Vanquish is the expeditionary early-warning system behind the Middle East and Army-related proof points. The resulting
    segmentation is strategically coherent but commercially thin, because the public record still contains more product and mission detail than payer-level customer detail.'
  claimRefs:
