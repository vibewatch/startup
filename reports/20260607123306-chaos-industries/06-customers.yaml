- id: section-named-proof
  title: Named customer proof and procurement pathway
  body: 'Evidence quality is strongest where a named government organization, funding amount, and use case all line up. On that test, the $1.9 million U.S. Air Force TACFI award for Eglin is the best public proof point, and the House-approved $10 million Eglin appropriation adds a second signal around the same radar-development path. The Army proof is weaker but still meaningful: G-TEAD inclusion shows that CHAOS cleared a competitive evaluation and entered a rapid-acquisition channel after Project Flytrap 4.5, while Soldier Systems adds that Army experimentation will continue in 2026. The allied Middle East agreement and Forterra partnership add breadth, but they are less economically legible because public sources omit customer identity, quantity, delivery, or pricing. AFWERX’s own rules are important context here: TACFI is a bridge from Phase II toward Phase III, not proof that a system is already a recurring full-rate program. The same caution applies to G-TEAD and Forterra. Evaluation,
    marketplace access, and trials are all valuable adoption signals, but none should be confused with disclosed recurring customer revenue.'
