- id: section-adverse-gaps
  title: Adverse evidence and unresolved diligence gaps
  body: 'The adverse read is straightforward. Forbes wrote in April 2025 that Chaos had yet to announce any major contracts, and even after the later milestones the company still discloses a narrow, milestone-heavy customer story rather than a durable revenue story. Army and C-UAS Hub reporting on Replicator 2 shows that fast procurement channels are real, but the first disclosed homeland counter-UAS purchase went to Fortem rather than CHAOS, reminding investors that rapid-acquisition pathways remain contested. Market sources also underline conversion risk: export controls, legal restrictions, false-positive concerns, and broader interoperability requirements can slow allied and partner expansion. Those are not abstract sector issues; they are especially relevant when a company’s public customer narrative depends on one allied agreement, one Army marketplace, and pre-procurement Forterra trials. The missing evidence is concrete and actionable: renewals, reorders, operator references, customer
    count, concentration mix, and contract economics. Until those are produced, the right conclusion is that the strongest evidence supports real demand interest and real government engagement, not yet a publicly verified recurring customer base.'
