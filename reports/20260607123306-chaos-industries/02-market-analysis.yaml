  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-and-program-scale
    missingEvidence: Public unit pricing, deployment quantities, and sustained production revenue for Vanquish and Astria.
    whyItMatters: Without pricing and quantity data, converting market access into realistic SOM and revenue forecasts is speculative.
    diligencePath: Request program-level pricing sheets, award values, and production assumptions from management or customer budget exhibits.
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: A reconciled boundary definition across analyst market reports for what counts as counter-UAS versus wider layered air-defense systems.
    whyItMatters: Headline TAM varies too widely to support valuation without boundary reconciliation.
    diligencePath: Build a bottoms-up market map by customer segment, deployment type, and component mix rather than averaging published TAMs.
  - type: missing-source
    severity: material
    topic: program-transition
    missingEvidence: Official government documentation showing whether pilot pathways convert into programs of record or multi-year procurement lots.
    whyItMatters: Transition risk is the largest gap between technical interest and durable market capture.
    diligencePath: Review budget justification books, OTA follow-ons, and customer champion letters for Chaos-related lines.
