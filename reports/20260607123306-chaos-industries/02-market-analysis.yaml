chapter:
  number: 2
  title: Market Analysis
  summary: CHAOS Industries sits inside a fast-growing but boundary-contested market spanning expeditionary counter-UAS radar, layered air-defense sensing, and adjacent homeland or test-range modernization budgets. The strongest evidence supports a narrow near-term market around modular counter-UAS and tactical-edge sensing, while Golden Dome and broader air-and-missile-defense budgets enlarge strategic upside without being fully addressable. Procurement demand is clearly moving toward distributed, interoperable, rapidly fieldable architectures, but budget friction, program-gating, and unresolved cost envelopes remain material adoption constraints.
sections:
- id: market-boundary
  title: Market Boundary and Included Spend
  body: CHAOS should be analyzed inside a sensing-led defense market, not the entirety of homeland missile defense. Its public product surface is anchored on Vanquish, an expeditionary low-SWaP distributed early-warning radar, and Astria, a long-range radar, both tied together by Coherent Distributed Networks rather than a single exquisite radar. That means the most relevant included spend is for distributed radar nodes, tactical-edge counter-UAS sensing, integration into existing command-and-control architectures, and adjacent test-and-training instrumentation. Excluded spend includes most interceptor procurement, space-based defense layers, and full-stack integrated air-and-missile-defense programs controlled by incumbent primes. Status-quo substitutes include monolithic high-cost radars, incumbent integrated air-defense stacks from RTX, Lockheed, Northrop, and L3Harris, as well as internal stitching of point sensors into legacy C2. The boundary matters because CHAOS is differentiated
    by network coherence, portability, and disaggregated survivability, but it is still dependent on broader engagement architectures it does not yet own end to end.
