evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer and revenue disclosure
    missingEvidence: Current revenue, ARR, customer count, and government-versus-commercial mix.
    whyItMatters: >-
      These metrics determine whether the multibillion-dollar valuation is grounded in real commercial scale or mostly
      in technical and investor confidence.
    diligencePath: >-
      Request data-room exports showing current ARR, customer count, top-customer concentration, and
      booked-versus-pipeline government revenue.
    relatedQuestionRefs:
      - QO021
      - QO025
  - type: missing-source
    severity: material
    topic: full leadership roster and governance rights
    missingEvidence: Current board composition, board observers, committee structure, and full executive roster.
    whyItMatters: >-
      The public record overweights a small circle of founders and high-profile appointees, making governance resilience
      hard to assess.
    diligencePath: Request org chart, board deck, cap table summary, and governance documents for the most recent financing.
    relatedQuestionRefs:
      - QO005
      - QO022
  - type: private-evidence-only
    severity: material
    topic: pricing-and-program-scale
    missingEvidence: Public unit pricing, deployment quantities, and sustained production revenue for Vanquish and Astria.
    whyItMatters: >-
      Without pricing and quantity data, converting market access into realistic SOM and revenue forecasts is
      speculative.
    diligencePath: >-
      Request program-level pricing sheets, award values, and production assumptions from management or customer budget
      exhibits.
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      A reconciled boundary definition across analyst market reports for what counts as counter-UAS versus wider layered
      air-defense systems.
    whyItMatters: Headline TAM varies too widely to support valuation without boundary reconciliation.
    diligencePath: >-
      Build a bottoms-up market map by customer segment, deployment type, and component mix rather than averaging
      published TAMs.
  - type: missing-source
    severity: material
    topic: program-transition
    missingEvidence: >-
      Official government documentation showing whether pilot pathways convert into programs of record or multi-year
      procurement lots.
    whyItMatters: Transition risk is the largest gap between technical interest and durable market capture.
    diligencePath: Review budget justification books, OTA follow-ons, and customer champion letters for Chaos-related lines.
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable public pricing or program-value disclosures across CHAOS, Anduril, Epirus, and Shield AI for similar
      mission scopes.
    whyItMatters: Feature differentiation is harder to monetize if price/performance positioning cannot be benchmarked.
    diligencePath: Collect proposal ranges, ACV estimates, and contract line values from management and customer references.
  - type: private-evidence-only
    severity: material
    topic: customer-traction
    missingEvidence: Named customer counts, renewal behavior, and production-unit volumes for CHAOS relative to peers.
    whyItMatters: Moat durability depends on repeat deployment, not just elegant architecture claims.
    diligencePath: Request deployment roster, renewal data, and current pipeline by buyer segment.
  - type: conflicting-data
    severity: minor
    topic: anduril-scale
    missingEvidence: >-
      A cleaner 2026 primary-source Anduril scale snapshot in the fetched set beyond funding history and sparse homepage
      text.
    whyItMatters: Anduril is clearly a major rival, but current-source precision is weaker than for Epirus or Shield AI.
    diligencePath: Refresh direct Anduril product and financing pages in a future run when richer fetched material is available.
  - type: private-evidence-only
    severity: material
    topic: core financial disclosure
    missingEvidence: Revenue, ARR, gross margin, burn, runway, and cash-on-hand figures.
    whyItMatters: >-
      These are the minimum inputs required to test whether CHAOS’s late-stage valuation is supported by operating
      performance rather than by category momentum alone.
    diligencePath: Request monthly financial package, board deck, and current cash / runway model.
    relatedQuestionRefs:
      - QI010
      - QI011
      - QI012
      - QI008
  - type: private-evidence-only
    severity: material
    topic: customer and contract economics
    missingEvidence: Top-customer concentration, contract duration, realized pricing, and payment milestones.
    whyItMatters: >-
      Marketplace access and bridge-funding milestones are not enough to determine durability or cash-conversion
      quality.
    diligencePath: Request executed statement-of-work samples, billing cadence, and top-customer concentration schedule.
    relatedQuestionRefs:
      - QI024
      - QI003
      - QI004
  - type: missing-source
    severity: material
    topic: independent-performance-validation
    missingEvidence: >-
      Independent public benchmark data on detection range, false positives, reliability, and sustainment for Vanquish
      or Astria.
    whyItMatters: Marketing-level claims are insufficient for underwriting product durability in contested environments.
    diligencePath: Request test reports, range data, or customer evaluation summaries from Army and Air Force users.
  - type: private-evidence-only
    severity: material
    topic: trust-and-compliance
    missingEvidence: Public certification and assurance artifacts covering cyber posture, AI governance, and operational compliance.
    whyItMatters: Defense buyers and critical-infrastructure customers often treat trust posture as part of product readiness.
    diligencePath: Request CMMC/SOC/ISO attestations, security questionnaires, and AI-governance documentation in diligence.
  - type: missing-source
    severity: material
    topic: deployment-scale
    missingEvidence: Named deployment counts, unit economics, and support metrics for fielded systems.
    whyItMatters: Product maturity cannot be separated from the ability to support multiple operational installations.
    diligencePath: Ask management for installed-base metrics, support staffing, training throughput, and current production capacity.
  - type: private-evidence-only
    severity: material
    topic: renewals
    missingEvidence: Customer renewal, reorder, and Phase III follow-on records for Air Force, Army, and allied programs.
    whyItMatters: >-
      Without renewals or repeat orders, investors cannot distinguish successful pilots and pathways from durable
      recurring demand.
    diligencePath: Request contract modification logs, follow-on task orders, and any Phase III conversion documents.
    relatedQuestionRefs:
      - QU015
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named customer count and revenue concentration by program or buyer.
    whyItMatters: Concentration risk cannot be sized from the public record, yet the disclosed proof set is small.
    diligencePath: Request customer concentration schedule, backlog by program, and payer-level revenue mix.
    relatedQuestionRefs:
      - QU016
    relatedTableRefs:
      - TU005
  - type: private-evidence-only
    severity: material
    topic: deployment-outcomes
    missingEvidence: >-
      Operator references, mission outcomes, and utilization data after Eglin, G-TEAD, Middle East, or Forterra
      milestones.
    whyItMatters: Procurement pathways and field trials are not the same as observed operational success.
    diligencePath: Request after-action reports, operator testimonials, and deployment utilization dashboards.
    relatedQuestionRefs:
      - QU017
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: Pricing, unit counts, support-contract terms, and gross-margin assumptions by customer proof point.
    whyItMatters: >-
      Contract economics determine whether the disclosed customer proofs create attractive recurring value or only
      episodic engineering revenue.
    diligencePath: Request statement of work excerpts, unit pricing, support economics, and revenue recognition policy by program.
    relatedQuestionRefs:
      - QU024
    relatedTableRefs:
      - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table coverage
    missingEvidence: A fuller population of named customers, programs, or deployments behind the partial named customer proof table.
    whyItMatters: >-
      Public disclosure is sparse, so the enumeration table only captures the strongest named proofs and may omit
      additional or classified customer activity.
    diligencePath: >-
      Request the company customer list, contract ledger, and any classified-program summary that reconciles disclosed
      milestones to total customer exposure.
    relatedQuestionRefs:
      - QU016
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: export-approvals
    missingEvidence: Public export approvals, product classification, or legal documentation for the allied Middle East agreement.
    whyItMatters: >-
      Export friction is a core risk theme and can block a strategically important customer proof from converting into
      revenue.
    diligencePath: Request export-license package, country clearance status, and any delivery approvals.
    relatedQuestionRefs:
      - QR020
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: manufacturing-metrics
    missingEvidence: Public output, defect, field reliability, and delivery-throughput metrics for CHAOS manufacturing.
    whyItMatters: >-
      Without metrics, investors cannot test whether funding has actually translated into scalable operational
      readiness.
    diligencePath: Request plant throughput, yield, on-time delivery, and RMA / defect dashboard.
    relatedQuestionRefs:
      - QR021
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-opacity
    missingEvidence: Revenue, backlog, margin, burn, and renewal economics by program.
    whyItMatters: >-
      Financial opacity prevents the risk chapter from quantifying the downside if pilot and evaluation pathways fail to
      convert.
    diligencePath: Request KPI package under NDA plus customer concentration table.
    relatedQuestionRefs:
      - QR014
      - QR023
    relatedTableRefs:
      - TR005
  - type: private-evidence-only
    severity: material
    topic: valuation underwriting package
    missingEvidence: Current revenue, booked backlog, top-customer concentration, gross margin, burn, runway, and financing terms.
    whyItMatters: >-
      Without these inputs, the latest valuation cannot be underwritten on economics rather than on narrative and
      investor conviction.
    diligencePath: Request full Series D data room including board materials, current operating plan, and contract-level evidence.
    relatedQuestionRefs:
      - QV011
      - QV012
      - QV026
      - QV027
  - type: missing-source
    severity: minor
    topic: exit readiness
    missingEvidence: Any public evidence of profitability path, public-market readiness, or M&A process.
    whyItMatters: The current evidence set supports continued private financing more than a near-term liquidity event.
    diligencePath: Request management financing plan and exit-timing assumptions as part of valuation workup.
    relatedQuestionRefs:
      - QV023
