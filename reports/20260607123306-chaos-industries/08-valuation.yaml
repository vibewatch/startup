- id: comparable-frame
  title: Comparable set and relative public proof
  body: 'The retained comparable set argues for discipline, not exuberance. Shield AI’s March 2026 financing anchored at $12.7 billion came with a visible catalyst in the U.S. Air Force Collaborative Combat Aircraft program and a more complex financing structure that included preferred equity and delayed-draw capital. Saronic’s homepage advertises a $9.25 billion valuation and highlights a $392 million Navy contract, signaling much greater public contract scale. Epirus is the most instructive lower-bound comp: Reuters kept its latest valuation undisclosed, Tech Funding News reported lower-than-prior-round pricing risk, yet Epirus still disclosed a $43.55 million Army contract and more than $550 million of total funding. Even Anduril, which is not a clean direct comp, shows up in retained sources only as a reminder of how large and diversified a top-tier defense-tech platform can become.


    Relative to those peers, CHAOS sits in the middle on valuation and near the bottom on public operating disclosure. The company has enough milestones to deserve peer discussion, but not enough public economics to claim peer-quality transparency. That does not invalidate the $4.5 billion mark, but it does mean the burden of proof remains on future disclosure and program conversion rather than on category momentum alone.'
