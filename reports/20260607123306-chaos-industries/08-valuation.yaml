- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Procurement access fails to convert
    - No visible booked-program evidence after 12-18 months of G-TEAD / fielding visibility
    - Narrative shifts from scale-up to stalled pilot story
    - Move to avoid / demand steep price reset
  - - Economic disclosure remains absent
    - Still no revenue, customer concentration, or margin disclosure by next financing
    - Prevents underwriting of latest mark
    - Stay research-more or walk
  - - Service-heavy deployments compress economics
    - Field support and integration prove margin-heavy
    - Premium software-like valuation breaks
    - Move valuation stance from stretched toward expensive
  - - Sector multiple reset
    - Peer rounds price below prior marks or public defense-tech multiples compress sharply
    - Removes narrative support for premium entry
    - Re-rate base and bear scenarios downward
  notes: Triggers are measurable enough to monitor in a refresh run and tie directly to the recommendation.
