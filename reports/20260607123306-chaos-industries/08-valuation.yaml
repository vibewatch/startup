- id: final-view
  title: Recommendation, anti-thesis, and thesis-break triggers
  body: 'A disciplined valuation chapter has to support both a thesis and an anti-thesis. The thesis is straightforward: counter-UAS demand is real, the company has top-tier investors, the founder and governance profile is credible, and late-2025 procurement and testing milestones show the company is entering more serious defense pathways. The anti-thesis is just as clear: public sources still do not show revenue, customer concentration, margin, burn, runway, or priced contract economics. That means outsiders cannot independently test whether a $4.5 billion entry price is justified. The right public-evidence call is therefore research-more, with medium confidence, a high risk rating, and a stretched valuation stance.


    The call would improve only with disclosure: current revenue, booked programs, customer concentration, gross margin, and runway. The call would worsen if G-TEAD and similar milestones fail to produce visible revenue, if service-heavy deployments pressure economics, or if the sector resets before CHAOS closes the disclosure gap. In short, the company may deserve serious diligence attention, but the current public record does not support treating the Series D mark as self-evidently fair.'
