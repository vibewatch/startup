- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Current ARR / revenue and booked backlog
    - Anchors whether $4.5B is plausible on disclosed economics
    - Management data room
  - - Customer concentration
    - Top-10 customers and government / commercial split
    - Tests durability and single-program risk
    - CFO / revops diligence
  - - Margin profile
    - Gross margin by hardware, software, and support
    - Tests whether premium multiple is even directionally defensible
    - Finance diligence
  - - Cash and runway
    - Current cash, burn, runway, and financing plan
    - Determines entry timing and down-round risk
    - Treasury / board materials
  - - Contract economics
    - Sample SOWs, milestone schedules, support obligations
    - Distinguishes marketplace access from monetized programs
    - Program / contracts diligence
  - - Governance and preferences
    - Series D terms, preferences, observers, and rights
    - Tests downside outcome under a flat or down round
    - Legal diligence
  notes: These asks are the minimum package needed to move beyond a public-evidence valuation stance.
