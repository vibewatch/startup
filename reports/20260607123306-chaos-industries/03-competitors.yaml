- id: moat-fragility
  title: Moat Durability and Adverse Evidence
  body: 'The bullish case is that CHAOS has a genuine product-level distinction: distributed and coherent sensing can be more survivable, more scalable, and better suited to tactical-edge deployments than large, exquisite radar nodes. The adverse case is that the buyer may value architecture control more than sensing elegance. Open-C2 ecosystems and layered defense constructs mean competitors can surround the same problem from adjacent layers and still neutralize much of CHAOS’s differentiation. Epirus and Anduril have already shown third-party integration in counter-UAS. Shield AI is proving that software autonomy can ride atop hardware it does not manufacture. Incumbents can answer with procurement power, installed command systems, and long-range radar budgets that are far larger than startup balance sheets. CHAOS also discloses little about customers, pricing, or production scale relative to rivals, which makes moat durability harder to underwrite. The implication is not that CHAOS lacks
    an edge; it is that the edge looks most durable as a high-value component inside a layered architecture, not yet as a platform that can freeze out better-capitalized rivals.'
