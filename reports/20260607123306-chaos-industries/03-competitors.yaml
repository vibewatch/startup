  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable public pricing or program-value disclosures across CHAOS, Anduril, Epirus, and Shield AI for similar mission scopes.
    whyItMatters: Feature differentiation is harder to monetize if price/performance positioning cannot be benchmarked.
    diligencePath: Collect proposal ranges, ACV estimates, and contract line values from management and customer references.
  - type: private-evidence-only
    severity: material
    topic: customer-traction
    missingEvidence: Named customer counts, renewal behavior, and production-unit volumes for CHAOS relative to peers.
    whyItMatters: Moat durability depends on repeat deployment, not just elegant architecture claims.
    diligencePath: Request deployment roster, renewal data, and current pipeline by buyer segment.
  - type: conflicting-data
    severity: minor
    topic: anduril-scale
    missingEvidence: A cleaner 2026 primary-source Anduril scale snapshot in the fetched set beyond funding history and sparse homepage text.
    whyItMatters: Anduril is clearly a major rival, but current-source precision is weaker than for Epirus or Shield AI.
    diligencePath: Refresh direct Anduril product and financing pages in a future run when richer fetched material is available.
