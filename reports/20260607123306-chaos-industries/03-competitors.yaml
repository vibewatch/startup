- id: peer-profiles
  title: Direct Peer Profiles and Capability Scope
  body: 'The strongest direct peer pressure comes from better-funded firms with broader product envelopes. Anduril is the clearest example: even when public product pages in the cache are sparse, its funding history, national-security breadth, and open-C2 posture make it a powerful adjacent rival for any program that values full-stack integration over a best-of-breed radar node. Epirus is more operationally comparable in today’s counter-UAS stack because Leonidas is explicitly sold as a layered short-range air-defense and counter-swarm solution, backed by recent Army contract wins and live-fire demonstrations. Shield AI competes from the autonomy layer upward, using Hivemind as a cross-platform software wedge that can ride on multiple aircraft and even on a competitor’s Collaborative Combat Aircraft platform. Saronic is not selling the same radar product, but its valuation, Navy traction, and autonomy narrative show how much institutional capital is chasing mission-specific defense systems.
    Against that set, CHAOS is differentiated by coherent distributed sensing, not by capital scale or by control of the full autonomous or effector stack.'
