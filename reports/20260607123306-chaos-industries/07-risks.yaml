- id: section-mitigation-kill-criteria
  title: Mitigations, monitoring, and kill criteria
  body: 'These risks are not equally fatal. Some are manageable with stronger diligence: export approvals can be checked, manufacturing metrics can be requested, and board or operating-bench depth can be verified. The thesis breaks when the same missing evidence persists alongside non-conversion. The cleanest kill criterion is simple: if no Phase III, reorder, production contract, or similarly durable follow-on emerges from Eglin, G-TEAD, the allied agreement, or Forterra, then the public customer story remains strategically promising but commercially shallow. Secondary kill criteria are also monitorable. If the company cannot provide credible manufacturing and quality metrics, scale assumptions should be cut. If no export-compliance or safety-case material exists for allied deployment, international upside should be discounted heavily. If better-capitalized peers continue winning larger contracts while CHAOS remains evaluation-stage in public, competition risk should be marked up. This
    is why the chapter’s risk stack is compound rather than isolated: conversion, operations, regulation, competition, and transparency all feed one another.'
