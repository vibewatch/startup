chapter:
  number: 7
  title: Risks
  summary: 'CHAOS Industries’ highest risk is contract conversion: public customer evidence is real but still concentrated in Eglin TACFI and congressional development funding, G-TEAD marketplace access after Project Flytrap 4.5, an undisclosed allied Middle East Vanquish agreement, and Forterra trials. Those proofs are strategically meaningful but do not yet equal recurring programs of record or renewals. The rest of the risk stack follows from that base condition: manufacturing opacity, export and legal friction, competition from better-capitalized peers and primes, budget/program dependency, and limited customer/financial transparency.'
sections:
- id: section-contract-conversion
  title: Contract-conversion and budget dependency
  body: 'The most important risk is not whether CHAOS’s technology is interesting; it is whether the company can convert promising public milestones into durable procurement. The Eglin TACFI award and House-backed appropriation are serious signals, but AFWERX and Eglin both describe TACFI as a bridge from Phase II toward Phase III. That means the strongest Air Force proof point is still a transition pathway, not a fully disclosed recurring program. The Army evidence is similar. G-TEAD marketplace inclusion after Project Flytrap 4.5 is valuable because it reduces buying friction, but it is still a mechanism that commanders may or may not use. Replicator 2 sharpens the point: the first publicly disclosed homeland counter-UAS buy went to Fortem, not CHAOS. In other words, fast acquisition channels are active, yet they are highly contested. Budget and bureaucracy compound this risk. National Defense’s Golden Dome analysis shows large radar architectures depend on sustained political support
    and institutional alignment, so Eglin and any future radar opportunity remain exposed to funding priority shifts.'
