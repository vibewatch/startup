  productSummary: CHAOS sells distributed radar and sensing systems built on Coherent Distributed Networks. Public materials identify Vanquish as the short- to mid-range distributed early-warning radar and Astria as the long-range radar, with the architecture emphasizing self-forming nodes, time synchronization, cooperative processing, and interoperability with larger command-and-control systems.
  customerFocus: U.S. and allied defense organizations, border-security operators, and selected commercial air operators.
  businessModel: Public sources suggest a mix of hardware platforms, software licenses, and support contracts tied to defense and dual-use deployments.
