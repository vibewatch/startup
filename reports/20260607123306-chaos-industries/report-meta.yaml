companyProfile:
  summary: CHAOS Industries is a Los Angeles defense-technology company building distributed sensing systems around Coherent Distributed Networks, with Vanquish for expeditionary early warning and Astria for longer-range radar missions. The company has moved quickly from a 2022 founding to a $4.5 billion Series D valuation, while earning credible military-adjacent milestones such as AFWERX work at Eglin, Forterra integration testing, and Army G-TEAD marketplace inclusion. The main diligence tension is that public technical and capital proof now outpaces public operating disclosure.
