- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Exact diligence path
  rows:
  - - Revenue / ARR
    - Without it, valuation and operating leverage cannot be anchored
    - Request audited or board-level revenue bridge by product line
  - - Gross margin
    - Needed to assess whether hardware-plus-services mix can sustain software-like valuation
    - Request gross margin by hardware, software, and support
  - - Cash burn and runway
    - Determines financing dependence despite Series D size
    - Request monthly burn, runway, and hiring plan
  - - Customer concentration
    - Government or program concentration can create revenue cliff risk
    - Request top-10 customer and program concentration table
  - - Contract economics
    - Marketplace access and pilots do not reveal unit pricing or payment timing
    - Request statement of work examples and billing cadence
  - - Working capital / inventory
    - Manufacturing ramp can absorb capital before revenue conversion
    - Request inventory turns, supplier terms, and milestone-payment profile
  notes: These are the specific disclosure holes preventing a stronger public financial verdict for CHAOS.
