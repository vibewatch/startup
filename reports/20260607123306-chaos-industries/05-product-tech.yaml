- id: TE003
  title: Technical dependency and survivability register
  columns:
  - Dependency
  - Why It Exists
  - Evidence
  - Risk if Weak
  rows:
  - - Coherent timing
    - Distributed nodes need shared timing to act as one system
    - Ziva acquisition and CDN description
    - Core performance advantage degrades
  - - Networking and compute
    - Nodes must exchange and process data rapidly
    - Curtiss-Wright distributed fusion and AI compute requirements
    - Latency undermines tracking and cueing value
  - - ECCM / contested-spectrum resilience
    - Modern radar must survive jamming and spoofing
    - Curtiss-Wright discussion of adaptive radars and ECCM
    - System becomes brittle in real conflict
  - - External C2 interoperability
    - CHAOS is sold as a layer inside larger architectures
    - Army G-TEAD and Golden Dome sources
    - Adoption stalls if integration is costly or slow
  - - Mobility partner ecosystem
    - Forward deployment uses autonomous or ground platforms
    - Forterra integration and Axios coverage
    - Survivability case weakens without carrier platforms
  - - Manufacturing scale
    - Distributed architectures need enough nodes to matter operationally
    - Series B/C/D funding earmarked for scaling
    - Demand cannot convert into deployed systems
  notes: Dependencies are not weaknesses by themselves; they are the practical systems-engineering conditions that must hold for CDN claims to survive field deployment.
