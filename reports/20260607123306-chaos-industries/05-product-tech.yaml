chapter:
  number: 5
  title: Product & Technology
  summary: CHAOS’s product family is centered on Coherent Distributed Networks, with Vanquish as an expeditionary distributed early-warning radar and Astria as a long-range radar for persistent monitoring and high-precision tracking. The strongest technical claim is not a single sensor spec but the use of coherent timing, cooperative processing, and disaggregated deployment to create survivable sensing that plugs into existing C2 and effector stacks. Public evidence also shows real deployment progress through G-TEAD, Forterra-SMET integration, and Air Force instrumentation work, but trust and maturity gaps remain around independent performance validation, cyber or compliance posture, and the operational dependencies required to turn demonstrations into scaled programs.
sections:
- id: product-family-and-architecture
  title: Product Family and Core Architecture
  body: 'The most important product fact about CHAOS is that the company is not presenting a single radar appliance; it is presenting a product family built on Coherent Distributed Networks. Public materials show three core elements. Vanquish is the expeditionary distributed early-warning radar designed for short- to mid-range detection and tracking. Astria is the long-range radar focused on high-precision track, extended-range surveillance, and persistent monitoring. Beneath both sits the CDN architecture: self-forming nodes, coherent timing through two-way time transfer, and cooperative data processing that can interoperate with larger command-and-control systems. That architectural logic matters because it encodes the company’s differentiation. Rather than concentrating sensing value in one exquisite node, CHAOS argues that more numerous, cheaper, coherent nodes improve resilience, fieldability, and decision time. The homepage and Series D materials further frame the system with aggressive
    marketing claims around sensing threats 10 minutes sooner, tracking to 250 km, and operating at $100 per square kilometer, but those numbers remain marketing-level until independently validated.'
