- id: model-architecture-cost-and-benchmarks
  title: Model architecture, cost efficiency, and benchmark evidence
  body: 'The strongest product-technology evidence is Step-3. Public technical materials describe a 321B-parameter multimodal
    MoE with 38B active parameters per token, 65,536 context, MFA attention, 48 experts and 3 selected experts per token.
    The system paper and model blog are unusually explicit about the engineering thesis: reduce decoding cost rather than
    merely scale parameters. MFA reduces KV-cache and attention computation; AFD separates attention and FFN work into specialized
    inference subsystems. StepFun also discloses pretraining scale—over 20T text tokens plus 4T image-text mixed tokens—and
    reports benchmark results across MMMU, MATH-Vision, AIME25, GPQA-Diamond, LiveCodeBench and related tasks. The cost story
    is plausible because model, attention arithmetic, sparse activation and deployment guidance align. But the benchmarks
    are still mainly company-issued, comparator reproduction settings matter, and independent replication was not found in
    the reviewed public record. This makes Step-3 underwriteable as a serious technical asset but not yet independently certified
    as a durable performance moat.'
  claimRefs:
