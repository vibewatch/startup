company:
  name: StepStar
chapter:
  number: 5
  title: Product & Technology
  summary: 'StepStar / StepFun has moved from a pure foundation-model story into a broad product stack: consumer StepFun AI,
    Open Platform APIs, AI Studio, Step Plan, open Step-3 weights, and STEPX Neo/Step AOS terminal experiments. The strongest
    evidence is Step-3, a 321B-parameter multimodal MoE with 38B active parameters, MFA attention, AFD serving design, and
    public GitHub/Hugging Face artifacts. The main diligence caveat is that benchmark and cost-efficiency claims are still
    mostly company-issued, while enterprise reliability, security certification, and independent replication remain thin.'
sections:
- id: portfolio-and-product-definition
  title: Product definition and portfolio breadth
  body: 'StepFun is not a single-product AI startup; its public product definition is a layered platform. The visible portfolio
    starts with the consumer StepFun AI app and desktop agent, adds AI Studio for experimentation and creation, exposes an
    Open Platform with API documentation and pricing, packages a Step Plan subscription for coding and agent tools, and now
    extends into terminal hardware through the STEPX Neo agent-phone concept. In workflow terms, the company is trying to
    own the path from foundation model to agent execution surface: developers call models through OpenAI-style APIs, creators
    experiment in Studio, consumers use StepFun AI, and device partners can embed multimodal assistant capability into phones,
    vehicles, or other terminals. This breadth is a positive underwriting signal because it shows multiple distribution paths
    rather than a pure research demo. The caution is that breadth also diffuses execution: model quality, API reliability,
    app UX, open-weight support, subscription economics and hardware-agent integrations require different operating muscles.'
  claimRefs:
