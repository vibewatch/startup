  evidenceGaps:
  - type: missing-source
    severity: material
    topic: independent-benchmark-replication
    missingEvidence: Independent third-party replication of Step-3 benchmark and throughput results under transparent settings.
    whyItMatters: Company-issued benchmark tables can overstate durable model advantage if settings, prompts or comparator
      versions differ.
    diligencePath: Commission an external model evaluation on representative multimodal, coding and agent workflows, with
      raw prompts and logs retained.
    relatedQuestionRefs:
    - QE014
    - QE015
    - QE024
    relatedTableRefs:
    - TE003
    - TE005
  - type: private-evidence-only
    severity: material
    topic: production-reliability
    missingEvidence: API uptime, latency percentiles, incident history, support SLAs and enterprise escalation commitments.
    whyItMatters: The product thesis depends on production API and agent workflows, not only model-card capability.
    diligencePath: Request status history, customer support metrics, SLOs, enterprise contract templates and incident postmortems.
    relatedQuestionRefs:
    - QE019
    - QE020
    - QE026
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: security-and-compliance
    missingEvidence: SOC 2 or equivalent certification, model-risk audit, data-governance audit, and safety evaluation documentation.
    whyItMatters: Legal policies are useful but do not prove enterprise security or AI-risk controls for regulated customers.
    diligencePath: Request security questionnaire, audit reports, data retention controls, red-team results and compliance
      roadmap.
    relatedQuestionRefs:
    - QE025
    - QE026
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: stepx-neo-adoption
    missingEvidence: Official STEPX Neo spec sheet, price, shipment target, active users, and retention or task-completion
      metrics.
    whyItMatters: The agent-phone story could be a strategic differentiator or a showcase experiment; public evidence does
      not yet distinguish the two.
    diligencePath: Request launch deck, hardware BOM, app-partner agreements, preorder/shipment data and usage telemetry.
    relatedQuestionRefs:
    - QE010
    - QE022
    - QE023
    relatedTableRefs:
    - TE001
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: open-weight-defensibility
    missingEvidence: Evidence that open-weight releases drive proprietary data, distribution lock-in or paid API conversion
      rather than commoditizing the model layer.
    whyItMatters: Open weights increase developer reach but can reduce model-level defensibility if rivals match capability
      and price.
    diligencePath: Request cohort data linking open-weight downloads to paid API usage, enterprise pipeline, and retention
      by model family.
    relatedQuestionRefs:
    - QE016
