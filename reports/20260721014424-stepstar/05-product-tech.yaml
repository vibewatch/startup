- id: roadmap-trust-and-risk-judgment
  title: Roadmap, trust controls, and technical-risk judgment
  body: 'The roadmap has moved quickly: Step-2 at WAIC 2024, Step-1V and other multimodal lines in 2024, open video/audio
    models with Geely in 2025, Step-3 in 2025, Step-3.7 Flash and Step Plan in 2026, and STEPX Neo in July 2026. That cadence
    supports the view that StepFun has real model-development velocity and a broad multimodal agenda. Trust and deployment
    evidence is thinner. The company publishes privacy, user-agreement and platform-management rules, and the pricing/rate-limit
    docs are more concrete than generic marketing pages. However, the reviewed public record did not identify an official
    status page, uptime SLA, SOC 2 or equivalent certification, independent model-risk audit, or third-party replication of
    the flagship Step-3 benchmarks. The adverse view is therefore not that StepFun lacks technology; it is that a large open
    multimodal model stack can be copied, benchmark narratives can be selected by the issuer, and production-grade enterprise
    assurance has not yet caught up with the product ambition.'
