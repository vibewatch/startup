  topStrengths:
    - 创始人与研究背景顶尖：前 Microsoft VP Jiang Daxin、IEEE Fellow 领衔；上海国资、Tencent、Qiming 等国资与战略投资人同场入局。
    - 多模态和低成本 MoE 模型族差异化明显：Step-2 万亿参数、Step-3 321B；“AI + 终端”设备策略已触达数千万台 OEM 设备。
    - 2026 年融资通道强：创纪录的 RMB5B+ Series B+，以及已推进到后期的 Hong Kong IPO 路径；Zhipu 和 MiniMax 已先行验证这条路。
  topRisks:
    - 收入、毛利率、烧钱速度和客户均未公开披露，快速抬升的估值无法像正常软件投资那样由基本面承接。
    - DeepSeek、Qwen、Doubao 和同属 “Big Six” 的创业公司竞争激烈、价格压力大，拥挤市场会挤压变现。
    - 地缘政治与供应链暴露（US chip export controls）叠加中国 AI 监管收紧，推高成本、合规和执行风险。
  unresolvedGaps:
    - 经审计收入、毛利率、算力承诺、烧钱速度和现金跑道均未公开披露。
    - 各轮估值历史在公开来源之间自相矛盾（大致 $4B 到 $12B 标记），股权结构表和优先条款不可得。
    - API 和 STEPX 设备业务的具名企业客户、付费用户数、留存和单位经济性均未公开披露。
