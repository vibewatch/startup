- id: capital-adequacy-and-ipo-fundraising-context
  title: Capital adequacy and IPO fundraising context
  body: 'The B+ round materially improves StepStar''s capital adequacy, but it does not make runway underwritable. More than RMB 5 billion is a large private financing by Chinese AI standards and likely gives the company room to keep training models, subsidize inference, hire, and deepen terminal partnerships. Yet public sources do not show cash on hand before or after the round, monthly net burn, planned compute commitments, debt obligations, liquidation preferences, or whether the financing included secondary liquidity. Later 2026 reports that StepStar is exploring a Hong Kong IPO and a possible roughly US$500 million raise add another financing dependency signal: the company may want public capital while the private market is still receptive to AI-terminal stories. Those IPO reports are useful as market context but not the same as a filed prospectus. The financial verdict is therefore balanced: StepStar has unusually strong capital access and a potentially differentiated commercialization
    channel, but detailed financials are not publicly disclosed and the decisive diligence blockers remain revenue, margins, burn, runway, cap-table terms, and partner economics.'
