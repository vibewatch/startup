- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - severity
  - exact diligence path
  rows:
  - - Revenue / ARR / recognized revenue
    - Cannot distinguish real monetization from distribution or usage traction
    - Critical
    - Request audited monthly revenue by product, geography, customer, and recognition policy
  - - Gross margin and cost of revenue
    - Cannot determine whether model serving and partner support scale profitably
    - Critical
    - 'Request COGS bridge: GPU inference, training amortization, data, bandwidth, support, partner share'
  - - Monthly burn, cash balance, and runway
    - Cannot assess financing dependency after the B+ round or before a possible IPO
    - Critical
    - Request cash balance, net burn, committed spend, and runway sensitivity under model-training scenarios
  - - Compute contracts and GPU access
    - Hidden minimum commitments may dominate capital needs
    - Critical
    - Request cloud/GPU contracts, reserved capacity, utilization, and chip-supply constraints
  - - Cap table and preference stack
    - Headline valuation may not reflect investor return economics
    - Material
    - Request share classes, liquidation preferences, secondaries, option pool, and strategic rights
  - - Partner economics and customer concentration
    - Device installs may translate to low revenue if economics are subsidized or concentrated
    - Material
    - Request OEM/auto contracts, revenue share, minimum guarantees, churn, and concentration limits
  notes: These are the minimum private inputs needed to turn public financing evidence into an underwritten financial model.
