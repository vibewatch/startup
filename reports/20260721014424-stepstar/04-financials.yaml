- id: revenue-model-and-monetization-disclosure
  title: Revenue model and monetization disclosure
  body: 'The public record does not support a conventional revenue build. StepStar''s official surfaces show consumer chat, an open platform, model cards, and a Step Plan promotional surface, including a limited-time free-token offer, but they do not provide a complete revenue schedule, realized pricing, customer concentration, recognized revenue, ARR, retention, or gross margin. Independent Chinese coverage argues the company has a terminal-first commercialization path, citing phone installs, daily services, automotive deployments, and API growth; that evidence is useful for commercialization direction but still does not equal audited revenue. The most defensible revenue model is a mixed terminal-and-platform model: API usage or plan subscriptions on the platform, licensing or integration economics with phone and auto partners, and future enterprise or agent-workflow packages. Each stream remains insufficiently specified for underwriting because the unit, price realization, revenue share,
    support obligation, and recognition policy are not public. This chapter therefore treats public monetization as directionally proven but financially unquantified.'
  claimRefs:
