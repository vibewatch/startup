  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-margin
    missingEvidence: Audited or management revenue, ARR, revenue recognition policy, gross margin, and cost-of-revenue bridge.
    whyItMatters: These are the core inputs needed to test whether StepStar has a scalable business rather than only distribution and financing momentum.
    diligencePath: Request monthly financial statements, revenue by product/customer, pricing waterfall, and gross-margin bridge.
    relatedQuestionRefs:
    - QI006
    - QI013
    - QI025
    relatedTableRefs:
    - TI001
    - TI002
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: burn-runway-and-compute
    missingEvidence: Cash balance, monthly burn, runway, GPU/cloud commitments, training budget, inference cost, and hiring plan.
    whyItMatters: The January 2026 B+ round cannot be assessed for adequacy without the spending plan and committed compute obligations.
    diligencePath: Request cash and burn model, cloud/GPU contracts, reserved capacity schedule, and scenario runway analysis.
    relatedQuestionRefs:
    - QI012
    - QI017
    - QI025
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: OEM, automotive, and enterprise contracts with pricing, revenue share, minimum guarantees, support obligations, and customer concentration.
    whyItMatters: Device installation and vehicle deployment metrics may not translate to attractive revenue or margins without favorable contract terms.
    diligencePath: Review top partner contracts, contract value, renewal terms, service-level commitments, and revenue-share formulas.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: material
    topic: ipo-prospectus
    missingEvidence: A filed Hong Kong IPO prospectus or equivalent regulatory document disclosing revenue, losses, use of proceeds, and risk factors.
    whyItMatters: IPO articles provide fundraising context but not audited financials or formal risk disclosure.
    diligencePath: Monitor HKEX filings and company announcements; request draft listing materials if available under NDA.
