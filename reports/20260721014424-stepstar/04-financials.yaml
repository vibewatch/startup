tables:
- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current public value/status
  - quality
  - diligence ask
  rows:
  - - Open-platform API usage
    - Developers build applications on StepFun models and agents
    - Tokens / API calls / plans
    - Platform and Step Plan surfaces exist; full realized pricing not disclosed
    - Potential recurring usage stream, but limited financial visibility
    - Request API revenue, active paying developers, token volume, discounting, and gross margin by model
  - - Step Plan / subscription surface
    - Official site links users to Step Plan and purchase flow
    - Plan subscription or token package
    - Official material advertises limited-time free token access; paid conversion not public
    - Shows packaging intent, not recognized revenue
    - Request plan tiers, paid seats, churn, and promotional-to-paid conversion
  - - Phone OEM model deployment
    - Model embedded in OPPO, Honor, ZTE or other device workflows
    - Licensing, per-device, revenue share, or service fee
    - Coverage cites 42M+ installed devices and daily service usage, but no contract economics
    - Strong distribution signal but weak revenue evidence
    - Request OEM contracts, revenue-share formulas, minimum guarantees, and support obligations
  - - Automotive cockpit / Agent OS
    - Voice and agent models integrated with Geely vehicle systems
    - Per-vehicle license, project fee, or services
    - Coverage cites Galaxy M9 / Agent OS deployment and million-vehicle ambition; pricing unknown
    - Potential high-value vertical but likely bespoke
    - Request auto contract value, recognition policy, warranty/support cost, and renewal terms
  - - Enterprise agent workflow packages
    - Production agent model capabilities sold to enterprises or partners
    - Seats, usage, or custom contract
    - Not publicly itemized as revenue
    - Could be future upside if platform matures
    - Request enterprise pipeline, booked ARR, pilots converted, CAC, and implementation costs
  notes: Public sources show product and distribution surfaces but not realized revenue, revenue share, or recognized revenue; rows are stream hypotheses constrained by public evidence.
