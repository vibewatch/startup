- id: TI004
  title: Capital adequacy table
  columns:
  - financing / metric
  - publicly supported value or state
  - what it tells us
  - what it does not tell us
  rows:
  - - December 2024 Series B
    - Hundreds of millions of dollars reported; sources describe about US$1B valuation
    - Early proof of state and strategic investor support
    - Exact primary/secondary split, preferences, and cash balance
  - - January 2026 Series B+
    - More than RMB 5B / roughly US$700M+ reported
    - Large capital injection and one of the largest China model-sector rounds in the period
    - Runway, monthly burn, and whether proceeds fully fund roadmap
  - - Cumulative funding
    - Public sources describe cumulative financing above RMB 5B when B+ is included
    - Confirms substantial capitalization versus typical startups
    - Precise cumulative primary capital and remaining cash
  - - Post-B+ valuation
    - Chinese coverage estimates roughly RMB 20-30B; data sites and IPO articles vary
    - Valuation has stepped up materially from 2024
    - No filed cap table or term sheet to reconcile reported marks
  - - Investor mix
    - State funds, China Life PE, PDVC, Xuhui, Wuxi Liangxi, Xiamen ITG, Huaqin, Tencent, Qiming, and 5Y appear in coverage
    - Syndicate offers capital, government, hardware, and venture signaling
    - Governance rights, follow-on commitments, and strategic restrictions
  - - Use of proceeds
    - Foundation-model R&D, compute/infrastructure, talent, and AI-terminal rollout reported
    - Capital is tied to expensive technical and commercialization goals
    - Budget allocation, milestone coverage, and cost overrun risk
  notes: Round values are public-reporting anchors, not audited cash balances. Later IPO valuation targets are excluded from this table because they are not completed financing terms.
