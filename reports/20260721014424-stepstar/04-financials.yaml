- id: TI003
  title: Unit economics table
  columns:
  - metric / driver
  - public value or status
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Recognized revenue / ARR
    - Not disclosed in reviewed public sources
    - Medium
    - Core numerator for valuation and revenue quality
    - Request revenue bridge by product, customer segment, and quarter
  - - Gross margin
    - Not disclosed
    - Medium
    - Determines whether AI-terminal model can be software-like after inference and support costs
    - Request cost-of-revenue by compute, data, support, partner revenue share, and depreciation
  - - Inference cost per API call / device user
    - Not disclosed; efficiency claims imply potential advantage
    - Medium
    - Critical because large installed base can still be loss-making if per-use cost is high
    - Request token mix, model routing policy, GPU utilization, and per-1K-token cost
  - - Training / R&D compute
    - No dollar figure; B+ use of proceeds includes foundation-model R&D and infrastructure priorities
    - Medium
    - Likely largest discretionary burn bucket
    - Request GPU/cloud contracts, reserved capacity, capex, and training roadmap
  - - Talent burn
    - No payroll figure; strategy requires elite model, systems, and commercialization talent
    - Medium
    - Senior AI teams create high fixed burn even before revenue scales
    - Request headcount plan, compensation, contractor spend, and recruiting commitments
  - - Sales efficiency / CAC payback
    - Not disclosed
    - Medium
    - Needed to know whether terminal partnerships reduce GTM cost
    - Request partner-acquisition cost, implementation cost, payback, and renewal data
  - - Working capital / debt obligations
    - No public debt or working-capital disclosure
    - Low
    - Important if hardware or vehicle integrations create prepayments or support obligations
    - Request debt, payables, minimum commitments, and off-balance-sheet obligations
  notes: Values are intentionally null where public evidence is absent; confidence refers to the public availability of the metric, not to company quality.
