company:
  name: StepStar
chapter:
  number: 4
  title: Financials
  summary: 'StepStar''s public financial record is capital-rich but operating-data poor: the clearest facts are a December 2024 Series B at roughly a US$1B valuation, a January 2026 B+ round of more than RMB 5B (about US$717-719M), and 2026 IPO reporting around a proposed US$500M Hong Kong raise. Public sources support a strong investor base, device-distribution signals, and an AI-terminal commercialization thesis, but they do not disclose audited revenue, gross margin, monthly burn, cash balance, or runway. The underwriting stance is therefore that StepStar has financing access and strategic capital, while revenue quality, cost-to-serve, and capital sufficiency remain private-evidence questions.'
sections:
- id: funding-and-valuation-trajectory
  title: Funding and valuation trajectory
  body: 'StepStar''s financing record is the most visible part of its financial profile, but even here public evidence is headline-heavy rather than diligence-grade. Multiple sources describe a December 2024 Series B round with Shanghai state capital, Tencent, Qiming Venture Partners, and 5Y Capital participating, and later sources describe the January 2026 B+ round as more than RMB 5 billion, or about US$700 million-plus, with additional state-owned, industrial, and incumbent venture investors. The valuation path is less clean: 2024 coverage framed the company around a roughly US$1 billion mark, January 2026 Chinese coverage estimated a post-money range around RMB 20-30 billion, and later IPO-oriented English coverage floated much higher US dollar targets. Those later IPO marks should be treated as market reports, not completed financing terms. The strongest conclusion is not a precise valuation curve; it is that StepStar has become one of the few Chinese foundation-model startups able
    to attract very large, strategic capital while peers face a more selective funding market. The table below therefore records funding facts and separates confirmed round amounts from reported or inferred valuation anchors.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
