- id: TI002
  title: Pricing / monetization table
  columns:
  - surface
  - public price or contract posture
  - list vs realized status
  - discounts/unknowns
  - source implication
  rows:
  - - StepFun homepage
    - Links to chat, open platform, Studio, and Step Plan purchase surface
    - List-packaging exists but detailed price grid not reviewed publicly
    - Promotions, free-token grants, paid conversion, enterprise discounts unknown
    - Official surface supports monetization intent but not revenue
  - - StepFun open platform
    - Promotes model/API access and application development
    - API monetization plausible; realized usage revenue not disclosed
    - Token pricing, volume rebates, free quota, and partner terms unclear
    - Need platform ledger before modeling revenue
  - - Step Plan
    - Official Step Plan page says limited-time free token experience / token giveaway
    - Promotion visible; paid take-up and realized ARPU not public
    - Free-token subsidy may depress near-term revenue quality
    - Important diligence ask for paid conversion and subsidy cost
  - - OEM / device partnerships
    - Reported installs and terminal integrations
    - No list pricing; likely negotiated contracts
    - License unit, revenue share, and minimum commitments undisclosed
    - Distribution can be large while revenue per device remains unknown
  - - IPO-market narrative
    - English reports discuss possible Hong Kong IPO and valuation targets
    - Fundraising narrative, not pricing evidence
    - No prospectus-level revenue or margin disclosure
    - Should not be used as proof of monetization
  notes: Official pricing evidence is incomplete. The table distinguishes public packaging from realized economics, which remain private.
