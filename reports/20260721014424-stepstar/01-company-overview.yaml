  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current cap table, board-seat list, observer rights, voting-control schedule, and preference-stack terms
      across the Series B, B+, pre-IPO, and possible IPO rounds.
    whyItMatters: The public record names important investors and directors but does not show who controls the company or
      how public-market proceeds would affect existing preferences.
    diligencePath: Request financing documents, investor-rights agreements, board consents, shareholder register, and legal
      memo on red-chip restructuring.
    relatedQuestionRefs:
    - QO010
    - QO029
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: locations
    missingEvidence: Management-confirmed current office list with addresses and employee counts for Shanghai, Beijing, Hangzhou,
      and any other city.
    whyItMatters: The assignment asks for Beijing and Hangzhou offices, but fetched sources only supported Shanghai, a Beijing
      signal, and Hangzhou-linked capital exposure, not a verified Hangzhou office.
    diligencePath: Ask management for lease schedules, payroll by site, recruiting locations, and local subsidiary registrations;
      verify against QCC/Aiqicha and official hiring pages.
    relatedQuestionRefs:
    - QO002
    - QO030
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited or management-confirmed revenue, ARR, gross margin, compute burn, runway, device active-user
      definitions, and customer concentration.
    whyItMatters: Public media estimates and usage/install numbers are directionally useful but cannot underwrite valuation
      or IPO readiness without definitions and audited financials.
    diligencePath: Request monthly financial statements, revenue by product line, billing cohorts, cloud/compute contracts,
      customer references, and active-device methodology.
    relatedQuestionRefs:
    - QO019
    - QO027
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: ipo-prospectus
    missingEvidence: HKEX filing, prospectus, CSRC filing status, cornerstone investor list, use-of-proceeds schedule, and
      final IPO timetable.
    whyItMatters: The overview relies on media and source-based IPO reporting; a prospectus would replace estimates with issuer-certified
      financials, risks, and governance disclosures.
    diligencePath: Monitor HKEX, CSRC overseas-listing filings, company announcements, and underwriter communications; refresh
      the chapter once a prospectus appears.
    relatedQuestionRefs:
    - QO015
    - QO016
    - QO025
    relatedTableRefs:
    - TO003
    - TO004
  - type: private-evidence-only
    severity: material
    topic: losses-and-risk
    missingEvidence: Detailed financial statements explaining the large-loss warning in the Lotus filing, including revenue
      quality, R&D spend, compute commitments, and cash runway.
    whyItMatters: A public filing is the strongest adverse evidence in this chapter, but it does not quantify loss size, burn
      trajectory, or whether IPO proceeds are required to sustain model training.
    diligencePath: Request audited income statement, cash-flow statement, GPU/compute commitments, and board-approved budget
      for 2026-2027.
    relatedQuestionRefs:
    - QO025
    - QO027
    relatedTableRefs:
    - TO001
    - TO004
