callouts:
- calloutType: strength
  title: Founder-market fit plus patient capital make the overview unusually strong
  body: The combination of Jiang Daxin's Microsoft/MSRA-STCA pedigree, a technical founding team, Shanghai state-capital support,
    Tencent/Qiming/FiveYuan follow-ons, and a large January 2026 B+ round gives StepFun credible resources for a foundation-model
    and terminal-ecosystem strategy.
