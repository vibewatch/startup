- calloutType: risk
  title: IPO readiness depends on disclosure quality, not just valuation ambition
  body: Reuters mirrors and Tencent News describe red-chip/offshore restructuring and unanswered company questions, while
    a CNINFO filing flags large losses and investment risks. Those sources make the Hong Kong IPO path investable only if
    prospectus-level financials, risks, and governance terms become visible.
  claimRefs:
  - CO024
  - CO025
  - CO026
  - CO028
  - CO044
- calloutType: insight
  title: The requested Hangzhou footprint should remain a diligence gap
  body: Fetched sources verify Shanghai and a Beijing signal, and they show Hangzhou-linked investment exposure through a
    Lotus filing, but they do not verify a standalone Hangzhou office. The chapter therefore records the gap instead of promoting
    an unsupported location fact.
  claimRefs:
  - CO005
  - CO043
