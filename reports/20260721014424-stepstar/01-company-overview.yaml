- id: founders-leadership-and-governance
  title: Founders, leadership, and governance surface
  body: 'The company''s underwritten asset is still the technical leadership cluster around Jiang Daxin. Baidu and China AI
    Atlas support the key-person narrative: Jiang spent roughly 16 years in the Microsoft/MSRA ecosystem, rose to Chief Scientist
    or Global Vice President, and became an IEEE Fellow in 2024. Founder or founder-adjacent public profiles also identify
    Zhu Yibo as CTO/system head with large-scale systems experience and Jiao Binxing as a search and data leader from Microsoft
    Bing. In 2026 the governance story broadened when Yin Qi was reported and registry-listed as chairman/legal representative,
    with Jiang remaining director and manager. That is positive for operating depth, but public materials do not disclose
    board voting, preference-stack terms, observer rights, founder vesting, or a reconciled shareholder register. The diligence
    stance is therefore strong founder-market fit but incomplete governance transparency.'
