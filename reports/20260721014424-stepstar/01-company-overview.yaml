company:
  name: StepStar
chapter:
  number: 1
  title: Company Overview
  summary: StepStar / StepFun is a Shanghai-based foundation-model company founded on April 6, 2023 by Jiang Daxin with Zhu
    Yibo and Jiao Binxing, now positioned among China's AI Six Tigers and pursuing an AI-plus-terminal strategy across APIs,
    models, phones, and automotive integrations. The strongest public signals are repeated large financings—December 2024
    Series B unicorn status, a January 2026 RMB5 billion-plus B+ round, and 2026 Hong Kong IPO preparations—backed by Shanghai
    state capital, Tencent, Qiming, FiveYuan, and industrial investors. The overview is positive on founder-market fit, capital
    access, and ecosystem pull, but cautious on audited financials, exact headcount, shareholder rights, Hangzhou footprint,
    red-chip restructuring risk, and large-loss warnings in a public investor filing.
sections:
- id: identity-footprint-and-product-thesis
  title: Identity, footprint, and product thesis
  body: 'StepStar is the English diligence label used here for StepFun, the trade name of Shanghai Jieyue Xingchen Intelligent
    Technology Co., Ltd. Public registry and profile sources converge on a founding date of April 6, 2023 and a Shanghai Xuhui
    registered address, while official surfaces point readers to the StepFun homepage, developer platform, Studio, and Step
    AI assistant. The product identity is not a single chatbot: the company presents a model platform, a consumer assistant,
    model documentation, and pricing/rate-limit pages that imply an API commercialization path. Its official slogan-like vision
    is to scale possibilities for everyone and make each person ten times more capable, while model pages emphasize Step 3.7
    Flash, Step 3.5 Flash, Step 2, and Step 1. Fetched evidence supports Shanghai and a Beijing operating signal, but the
    requested Hangzhou office remains unverified in this chapter and should be treated as a location diligence gap rather
    than an established fact.'
