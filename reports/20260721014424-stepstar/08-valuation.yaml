- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold / event
  - transmission to thesis
  - action implication
  rows:
  - - HKEX filing delay
    - No prospectus or formal filing path after reported restructuring and June timetable windows.
    - Converts IPO-readiness narrative into execution risk.
    - Move to wait-for-filing; do not pay IPO premium.
  - - Revenue proof gap
    - Filed revenue materially below media estimates or no segment economics for API/terminal/auto demand.
    - Breaks the multiple-support story.
    - Re-underwrite toward $4B-$6B or lower.
  - - Compute-cost pressure
    - Gross margin, cloud capacity, or token rationing reveal poor scalability.
    - Makes high growth expensive and lowers sustainable multiple.
    - Require discount and compute-commitment diligence.
  - - Public comp compression
    - Z.AI or MiniMax market caps continue to fall before StepStar prices.
    - Lowers investor appetite for another Chinese model-lab IPO.
    - Delay entry or demand smaller valuation range.
  - - Preference overhang
    - New or prior investors hold downside-heavy terms, liquidation preferences, or special rights.
    - Headline valuation overstates common-equity value.
    - Build waterfall before investing.
  - - Unsupported high target
    - Final range targets $12B+ or near-RMB90B without audited financial proof.
    - Scarcity premium dominates underwriting discipline.
    - Avoid or participate only with strong downside protection.
  notes: 'Triggers are designed to be monitorable when a prospectus, cornerstone book, or financing documents become available.'
