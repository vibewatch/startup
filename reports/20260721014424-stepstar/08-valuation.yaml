company:
  name: StepStar
chapter:
  number: 8
  title: Valuation
  summary: 'StepStar’s valuation story is compelling but internally inconsistent across public sources: December 2024 coverage verifies a several-hundred-million-dollar Series B, January 2026 coverage verifies a more-than-RMB5 billion Series B+, spring 2026 coverage places Pre-IPO valuation marks around $4 billion to $6 billion, and June/July 2026 reports escalate the IPO narrative to roughly $10 billion, $12 billion, near-RMB90 billion, or even more aggressive headline figures. That trajectory looks explainable by Hong Kong AI IPO momentum and strategic hardware/state-capital demand, but not conventionally underwritable because official audited revenue, margins, burn, preference terms, and filed StepStar prospectus detail remain absent. Compared with Zhipu/Z.AI, MiniMax, and Moonshot, StepStar has a credible public-market window, yet the right stance is price-sensitive research-more / track rather than buy at any headline valuation.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'The valuation call is price-sensitive rather than company-quality-sensitive. StepStar has unusually strong financing momentum: public sources verify a December 2024 Series B backed by Shanghai state capital, Tencent, Qiming, and other investors; several 2026 sources verify a more-than-RMB5 billion Series B+; and later reports describe Pre-IPO or IPO-path financing from industrial hardware players, state-linked investors, and existing venture shareholders. That combination makes a Hong Kong listing plausible. The underwriting problem is that the headline price changed faster than public fundamentals. Reviewed sources put the company at roughly $4 billion to $6 billion in a Pre-IPO context, around $10 billion in some funding datasets, $12 billion in IPO reports, and near-RMB90 billion or higher in more aggressive market chatter. Official StepStar surfaces and public filings reviewed here do not provide audited revenue, gross margin, burn, compute commitments, preference stack, or a definitive prospectus. Therefore a new investor should not treat the highest IPO marks as proven value; they are momentum marks that require data-room confirmation.'
