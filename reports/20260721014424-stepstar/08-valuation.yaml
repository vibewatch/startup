- id: TV003
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - State-linked, Tencent/Qiming/FiveYuan, and industrial-capital participation give StepStar unusually deep financing access.
    - thesis
    - The thesis weakens if the final prospectus shows preference-heavy or mostly insider-supported financing.
  - - Hardware and terminal ecosystem investors can convert model capability into embedded distribution.
    - thesis
    - The thesis strengthens if deployment economics, API revenue, and customer concentration are disclosed.
  - - Hong Kong AI IPO comps show investors can capitalize scarce Chinese model-lab listings at very high levels.
    - thesis
    - The thesis weakens if Z.AI or MiniMax valuation volatility continues before StepStar prices.
  - - Official public surfaces do not disclose audited revenue, burn, margin, or cap-table terms.
    - anti-thesis
    - A filed prospectus with credible financials would close the biggest underwriting gap.
  - - Public valuation marks conflict from $4B-$6B to $10B-$12B to near-RMB90B or higher chatter.
    - anti-thesis
    - The view improves if a binding cornerstone price, final offer range, and institutional book quality confirm demand.
  - - China AI bubble critiques argue compute constraints and weak profitability can make headline marks fragile.
    - anti-thesis
    - The risk falls if StepStar shows revenue quality, gross margin, and compute efficiency materially better than peers.
  notes: 'The table is intentionally symmetric: StepStar can be strategically valuable and still overpriced at the wrong entry mark.'
