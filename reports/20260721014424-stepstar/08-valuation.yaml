- id: china-ai-comps-and-ipo-window
  title: China AI comps and the IPO window
  body: 'The most useful comparables are not US software multiples; they are the 2026 Hong Kong AI-listing references and late-stage Chinese model-lab rounds. Zhipu/Z.AI and MiniMax provide public-market analogues, while Moonshot provides a private valuation analogue. The key signal is that Hong Kong investors have rewarded scarce AI listings at very large market-cap levels: StockAnalysis shows Z.AI around HK$397 billion on July 20, 2026 and around HK$386.99 billion on April 30, while MiniMax traded around HK$266.59 billion on May 14 before later falling to about HK$60.56 billion by July 20. That volatility is essential: the same comp set supports both the bull case for IPO demand and the bear case for post-listing compression. Moonshot’s reported $20 billion to $30 billion private marks show that StepStar’s $10 billion to $12 billion IPO target is not absurd in a Chinese frontier-lab context, but the comp table also shows that market caps can outrun disclosed revenue and then correct sharply.'
