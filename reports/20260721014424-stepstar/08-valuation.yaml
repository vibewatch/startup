  title: Recommendation summary table
  columns:
  - decision field
  - current view
  - decision implication
  rows:
  - - Recommendation
    - research-more / track
    - Stay engaged for an HKEX filing, but do not underwrite the highest headline valuation without audited operating metrics.
  - - Confidence
    - medium
    - Financing and comp evidence is broad; StepStar-specific revenue, burn, and terms remain private or media-estimated.
  - - Risk rating
    - high
    - IPO execution, post-listing volatility, compute cost, and private-term opacity can all compress value.
  - - Valuation stance
    - stretched
    - $10B-$12B is plausible in the comp window, but near-RMB90B and higher chatter needs prospectus-grade proof.
  - - Entry discipline
    - require filed prospectus or discount
    - A buyer should demand official revenue, margin, compute, customer, and preference detail before paying the headline.
  notes: 'This is an IC recommendation table: it separates company momentum from price quality and treats private media estimates as unverified until a filing appears.'
