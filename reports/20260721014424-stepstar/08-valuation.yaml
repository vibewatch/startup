- id: TV002
  title: Valuation history and conflicting marks table
  columns:
  - date / window
  - valuation or financing mark
  - source posture
  - diligence interpretation
  rows:
  - - Dec 2024 Series B
    - Several-hundred-million-dollar Series B; the prompt-level ~$1B valuation anchor was not corroborated by the retained public sources.
    - SCMP, SiliconAngle, TMTPost, and Dealroom verify the round/backers but not a consistent valuation.
    - Treat as the early unicorn anchor with a material valuation-disclosure gap.
  - - Jan 2026 Series B+
    - More than RMB5B / about $700M-$717M raised.
    - 36Kr, KR Asia, Tencent News, and Aibase converge on the size and investor mix.
    - Strong capital-access signal; valuation still not uniformly disclosed.
  - - Feb-Apr 2026 Pre-IPO planning
    - Caijing/Sina reports tranches at roughly $4B pre-money and $5B-$6B pre-money.
    - Media source says management had not publicly responded by publication.
    - More underwritable than $12B because it sits closer to recent private financing context.
  - - May 2026 industrial round reports
    - Nearly $2.5B financing with post-money valuation reportedly $5B-$6B in Tencent republished coverage.
    - Industrial investors include Huaqin, Longcheer, OmniVision, ZTE, and HKIC per coverage.
    - Supports strategic-syndicate premium but also shows conflict with $10B-$12B targets.
  - - June 2026 IPO reports
    - IPO valuation target reported up to $12B / more than RMB80B.
    - Sina, 163, StartupWired, and The AI Chronicle carry the high IPO narrative.
    - Plausible IPO ask; not yet a completed public valuation.
  - - July 2026 market-chatter sources
    - BestStartup and Oryndex cite around $10B; Newsglobenow cites near-RMB90B-style or higher secondary-market demand.
    - Source quality and unit translation vary materially across reports.
    - Preserve all figures explicitly; do not collapse them into one false-precision mark.
  notes: 'Enumeration is partial: it covers retained public financing/IPO marks through 2026-07-21 and deliberately preserves inconsistent valuation figures rather than averaging them.'
