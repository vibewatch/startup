  rows:
  - - Zhipu / Z.AI
    - StockAnalysis shows about HK$397.02B market cap on 2026-07-20 and HK$386.99B on 2026-04-30; SCMP and Straits Times describe its IPO/share-sale context.
    - Sets a very high Hong Kong public-market boundary for a Chinese foundation-model name.
