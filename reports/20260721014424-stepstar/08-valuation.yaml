  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation-history-table
    missingEvidence: A company-confirmed financing history with exact pre-money and post-money valuation for each StepStar round from Series B through Pre-IPO.
    whyItMatters: Public sources conflict across $4B-$6B, $10B, $12B, and near-RMB90B-style marks, making a single valuation anchor unreliable.
    diligencePath: Request cap table, board-approved financing chronology, and legal closing documents; reconcile against any HKEX prospectus.
    relatedQuestionRefs:
    - QV006
    - QV009
    - QV010
    - QV011
    relatedTableRefs:
    - TV002
  - type: private-evidence-only
    severity: material
    topic: revenue-multiple-denominator
    missingEvidence: Audited revenue, ARR, gross margin, compute cost, burn, and segment revenue through 2026.
    whyItMatters: Without official denominator data, revenue multiples at $10B-$12B or near-RMB90B create false precision.
    diligencePath: Review the HKEX filing when available and request finance-room support for media-reported revenue estimates.
    relatedQuestionRefs:
    - QV014
    - QV015
    - QV027
    relatedTableRefs:
    - TV004
    - TV007
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: Full private-market transaction set for all Chinese AI Six Tigers, including undisclosed preferences and revenue bases.
    whyItMatters: The comp table is a representative boundary set, not a complete transaction database.
    diligencePath: Supplement public sources with investor data-room materials, cap-table data, and paid private-market databases.
    relatedQuestionRefs:
    - QV022
    - QV023
    - QV024
    relatedTableRefs:
    - TV005
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Liquidation preferences, ratchets, pro rata rights, lock-ups, and secondary-transfer restrictions for all recent rounds.
    whyItMatters: Headline valuation can materially overstate common-equity value if investor protections are heavy.
    diligencePath: Build a waterfall model from financing documents and compare it with the proposed IPO offer structure.
