  - - Moonshot AI / Kimi
    - TechCrunch and other sources report about $20B valuation; Yahoo reports Moonshot neared $30B after Kimi K3.
    - Private frontier-lab comp demonstrating that $10B-$12B StepStar targets are not isolated.
    - Private round, not a liquid public-market mark; source set is media-reported.
  - - StepStar Pre-IPO private marks
    - Caijing/Tencent reports $4B then $5B-$6B pre-money tranches; BestStartup/Oryndex cite around $10B.
    - Direct company-specific anchor for base-case valuation.
    - Conflicting media marks; final offer range not visible.
  - - StepStar high IPO target
    - Sina/163/AI Chronicle/StartupWired report up to $12B or more than RMB80B.
    - Directly relevant to expected Hong Kong pricing aspiration.
    - IPO target is not executed market value and may adjust.
  - - AI overvaluation / bubble critique
    - ChinaBizInsider and NationPress warn about compute pressure and overvaluation relative to revenue/profitability.
    - Provides adverse boundary for stretched private marks.
    - Sector-level critique; needs StepStar-specific financials to quantify impact.
