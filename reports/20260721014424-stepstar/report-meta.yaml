summary:
  headline: StepStar is a technically credible, well-capitalized member of China's foundation-model "Big Six" with a distinctive multimodal and AI-terminal strategy, but undisclosed financials and contested, steeply escalating valuation marks keep it a research-more rather than a buy.
  overallScore: 5
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
