  topStrengths:
  - Elite founder and research pedigree (ex-Microsoft VP Jiang Daxin, IEEE Fellow) and a state-plus-strategic investor syndicate including Shanghai state capital, Tencent, and Qiming.
  - A differentiated multimodal and cost-efficient MoE model family (Step-2 trillion-parameter, Step-3 321B) plus an "AI + terminal" device strategy that reaches tens of millions of OEM devices.
  - Strong 2026 capital access — a record RMB5B+ Series B+ and an advanced Hong Kong IPO track that peers Zhipu and MiniMax have already validated.
  topRisks:
  - No public revenue, margin, burn, or customer disclosure means the escalating valuation is not underwritten like a normal software investment.
  - Intense competition and price pressure from DeepSeek, Qwen, Doubao, and fellow "Big Six" startups compress monetization in a crowded market.
  - Geopolitical and supply-chain exposure (US chip export controls) and tightening Chinese AI regulation raise cost, compliance, and execution risk.
  unresolvedGaps:
  - Audited revenue, gross margin, compute commitments, burn, and runway are not publicly disclosed.
  - The round-by-round valuation history is internally inconsistent across public sources (roughly $4B to $12B marks), and the cap table and preference terms are unavailable.
  - Named enterprise customers, paying-user counts, retention, and unit economics for the API and STEPX device business are not publicly disclosed.
disclaimer: This report is based solely on public sources reviewed as of 2026-07-21 and is not a substitute for private financial, legal, technical, and customer diligence. StepStar is analyzed as the company branded StepFun (阶跃星辰).
