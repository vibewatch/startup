companyProfile:
  summary: 'StepStar, branded StepFun (阶跃星辰) and registered as Shanghai Jieyue Xingchen Intelligent Technology Co., Ltd., is a Chinese AI foundation-model company founded on April 6, 2023 by former Microsoft Global VP Jiang Daxin with technical co-founders Zhu Yibo and Jiao Binxing. It builds large language and multimodal models — including the trillion-parameter Step-2 MoE model and the 321B Step-3 multimodal model — plus the StepAI agent platform and the STEPX "AI + terminal" device strategy. It is widely grouped among China''s "Big Six / AI Six Tigers" foundation-model startups. It closed a December 2024 Series B at roughly a $1 billion valuation and a January 2026 Series B+ of more than RMB5 billion (~$717M), and is preparing a 2026 Hong Kong IPO. Detailed financials — revenue, margins, burn, customer counts — are not publicly disclosed.'
