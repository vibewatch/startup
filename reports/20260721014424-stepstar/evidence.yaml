evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current cap table, board-seat list, observer rights, voting-control schedule, and preference-stack terms across
      the Series B, B+, pre-IPO, and possible IPO rounds.
    whyItMatters: >-
      The public record names important investors and directors but does not show who controls the company or how
      public-market proceeds would affect existing preferences.
    diligencePath: >-
      Request financing documents, investor-rights agreements, board consents, shareholder register, and legal memo on
      red-chip restructuring.
    relatedQuestionRefs:
      - QO010
      - QO029
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: locations
    missingEvidence: >-
      Management-confirmed current office list with addresses and employee counts for Shanghai, Beijing, Hangzhou, and
      any other city.
    whyItMatters: >-
