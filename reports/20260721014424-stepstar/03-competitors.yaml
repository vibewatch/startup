  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Customer-level win-loss data showing when StepStar beats DeepSeek, Qwen, Kimi, GLM, MiniMax, Doubao,
      OpenAI, Anthropic, Gemini, or Llama on real workloads.
    whyItMatters: The public evidence maps plausible differentiation but cannot prove conversion, retention, or willingness
      to pay against stronger-distribution alternatives.
    diligencePath: Request management win-loss files, benchmark harnesses, pilot conversion data, and named customer references
      by workload.
    relatedQuestionRefs:
    - QP023
    - QP024
    relatedTableRefs:
    - TP005
  - type: missing-source
    severity: material
    topic: enterprise-packaging
    missingEvidence: Current public or private StepStar pricing, support, SLA, admin controls, data-retention, and enterprise
      security documentation.
