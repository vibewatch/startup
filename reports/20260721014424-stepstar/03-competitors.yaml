- id: pricing-funding-and-global-benchmarks
  title: Pricing, funding, and global benchmarks raise the bar
  body: The funding story is strong but not sufficient. Public sources indicate StepStar had become a unicorn by late 2024,
    raised a reported B+ round above 5 billion RMB in 2026, and was linked to a potential Hong Kong IPO at a much higher valuation
    target. Yet private-company funding data across Moonshot, Zhipu, MiniMax, and Baichuan is uneven, so capitalization alone
    cannot rank the group cleanly. Procurement comparability is clearer on pricing and packaging. DeepSeek, Kimi, Gemini,
    OpenAI, and Baichuan publish API or business pricing surfaces; Alibaba wraps Qwen in cloud deployment and compliance tooling;
    OpenAI, Anthropic, and Google provide the international enterprise benchmark for controls and model breadth. StepStar
    has a public technical model story, but the reviewed evidence is thinner on list pricing, enterprise admin, support commitments,
    and usage controls. In practical procurement, this makes StepStar a high-potential but less legible option. A technical
    team may like Step3, while a CIO or platform owner will still ask for price predictability, security posture, support,
    usage analytics, and fallback models. Those buyer controls are already visible from global leaders and several Chinese
    incumbents.
