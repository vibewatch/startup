      - number: '6.3'
        title: 'Named customer proof: partners are named; paying customers and retention are not'
        blocks:
          - type: paragraph
            body: >-
              The named-proof table is deliberately conservative. OPPO, Honor, ZTE, Geely, Alipay, Kingdee, and Huaqin
              are real named entities in public reporting, but they play different roles. Phone makers and Geely look
              like distribution or deployment partners; app companies such as Alipay, Meituan, Didi, Trip.com, and
              CapCut are ecosystem participants; Kingdee and Alipay coverage points toward enterprise-service and
              payment infrastructure cooperation; Huaqin is a manufacturing dependency. These are valuable signals, but
              they are not the same as disclosed paying-customer counts or referenceable enterprise contracts. Retention
              remains almost completely private: no NRR, GRR, churn, renewal rate, contract length, cohort retention,
              top-customer concentration, or segment-level ARPU appeared in the reviewed public materials. That means
              customer quality must be underwritten with partner durability and distribution leverage rather than
              conventional recurring-revenue metrics. Later reference calls should separate pilots, paid production
              deployments, and co-marketing announcements so that partner visibility is not mistaken for contracted
              customer quality.
