  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer segments: partner-led distribution before direct-account proof'
        blocks:
          - type: paragraph
            body: >-
              StepFun’s public customer story is unusually channel-heavy. The strongest evidence does not look like a
              classic SaaS customer list; it looks like distribution through phone OEMs, automotive cockpits, app-store
              consumers, API developers, and ecosystem partners that can give Amoo useful actions inside STEPX Neo.
              Reported device integration through OPPO, Honor, and ZTE provides the clearest scaled usage surface, while
              Geely is the clearest named automotive deployment partner. The consumer StepFun AI app adds ratings and
              reviews, but not active-user or monetization counts. Developer/API sources show catalog, price, and
              open-source surfaces, not paying account cohorts. This segmentation matters because StepFun may be closer
              to a model-and-agent infrastructure supplier embedded inside partner channels than to a company with
              independently observable end-customer demand. The chapter therefore treats partners, users, and payers
              separately rather than collapsing all reach into customers. A practical diligence read should therefore
              ask, for each segment, whether StepFun controls the account relationship, merely supplies model
              capability, or depends on another platform to expose demand.
