  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - key assumptions
      - valuation / return logic
      - probability signal
    rows:
      - - Bull
        - >-
          HKEX filing lands cleanly, revenue estimates are validated, terminal/auto/API deployment converts into durable
          revenue, and comps remain strong.
        - >-
          $12B+ IPO pricing can clear; a near-RMB90B zone is supportable only if official financials and book quality
          are strong.
        - Lower-probability until filed revenue, losses, and investor lock-up structure are visible.
      - - Base
        - IPO process continues, but final range settles between recent private marks and the most aggressive headlines.
        - >-
          Roughly $8B-$10B valuation is the working zone; investor return depends on avoiding MiniMax-style post-listing
          compression.
        - Most plausible because it reconciles strategic demand with conflicting public marks.
      - - Bear
        - >-
          Filing delay, revenue shortfall, compute-cost pressure, weak public-market comps, or heavy preference terms
          emerge.
        - Down-round or broken-IPO reset toward $4B-$6B becomes plausible, matching earlier Pre-IPO reports.
        - Elevated probability because public market comps are volatile and the official prospectus is absent.
      - - Kill / thesis-break
        - No filed prospectus, poor financial disclosure, or valuation set above $12B without proof.
        - Avoid new money unless a much lower price or protected terms offset the evidence gap.
        - Binary downside if scarcity premium fades before fundamentals catch up.
