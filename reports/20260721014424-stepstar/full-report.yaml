  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The valuation call is price-sensitive rather than company-quality-sensitive. StepStar has unusually strong
              financing momentum: public sources verify a December 2024 Series B backed by Shanghai state capital,
              Tencent, Qiming, and other investors; several 2026 sources verify a more-than-RMB5 billion Series B+; and
              later reports describe Pre-IPO or IPO-path financing from industrial hardware players, state-linked
              investors, and existing venture shareholders. That combination makes a Hong Kong listing plausible. The
              underwriting problem is that the headline price changed faster than public fundamentals. Reviewed sources
              put the company at roughly $4 billion to $6 billion in a Pre-IPO context, around $10 billion in some
              funding datasets, $12 billion in IPO reports, and near-RMB90 billion or higher in more aggressive market
              chatter. Official StepStar surfaces and public filings reviewed here do not provide audited revenue, gross
              margin, burn, compute commitments, preference stack, or a definitive prospectus. Therefore a new investor
              should not treat the highest IPO marks as proven value; they are momentum marks that require data-room
              confirmation.
