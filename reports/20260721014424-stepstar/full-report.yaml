      - number: '3.2'
        title: 'Capability and openness: Step3 is efficient, but open ecosystems are crowded'
        blocks:
          - type: paragraph
            body: >-
              Step3’s architecture is the positive core of the competitive case: 321B total parameters, 38B active
              parameters, multimodal reasoning, public checkpoints, and OpenAI/Anthropic-compatible access. That is a
              credible technical entry point, particularly for buyers that need vision-language reasoning on constrained
              accelerators. The problem is that openness is no longer rare. DeepSeek open-sourced R1 and distilled
              models, Qwen3 exposes dense and MoE weights across a broad model family, Zhipu releases GLM models under
              permissive licensing, Moonshot and MiniMax publish large MoE model cards, and Meta keeps open-weight
              pressure alive internationally through Llama. StepStar’s strategy therefore looks more like selective
              openness plus terminal distribution than an unmatched open-source moat. Buyers can multi-home across these
              APIs and checkpoints, which lowers switching costs and weakens any standalone model-access premium. The
              comparison also changes how to read benchmarks. A strong model card is necessary to get into the
              shortlist, but not enough to win if a buyer can reproduce acceptable performance with open checkpoints,
              cloud-managed Qwen or GLM deployments, or DeepSeek-style low-cost routing. StepStar must show where
              multimodal efficiency is measurable in production.
