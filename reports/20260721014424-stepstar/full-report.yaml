      - number: '6.4'
        title: 'Durability risk: OEM lock-in and ecosystem permissions remain the key tests'
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence cuts directly against a simple traction narrative. GSMArena questioned how much
              substance existed behind the agentic-phone announcement, while Gogi warned buyers not to wait for a
              product without confirmed timing, pricing, or international availability. Chinese analysis was more
              pointed on StepFun’s partner model: Toutiao argued that OEM relationships are not exclusive, that OPPO or
              Geely can switch or multi-source models, and that revenue concentration around a few terminal partners
              could become cliff risk. BigGo’s launch analysis adds another operational constraint: Amoo’s usefulness
              depends on deep, durable interfaces from super-apps and user willingness to delegate sensitive
              permissions. The diligence conclusion is not that customer traction is absent; it is that the public
              evidence supports broad distribution but not retention durability. Later diligence should demand
              contracts, exclusivity terms, active-user cohorts, partner-level revenue, renewal history, and
              permission-interface depth. The adverse stance is especially relevant because an agent phone becomes less
              useful if the most important apps restrict automation or reserve key workflows for their own assistants.
