  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding and valuation trajectory
        blocks:
          - type: paragraph
            body: >-
              StepStar's financing record is the most visible part of its financial profile, but even here public
              evidence is headline-heavy rather than diligence-grade. Multiple sources describe a December 2024 Series B
              round with Shanghai state capital, Tencent, Qiming Venture Partners, and 5Y Capital participating, and
              later sources describe the January 2026 B+ round as more than RMB 5 billion, or about US$700 million-plus,
              with additional state-owned, industrial, and incumbent venture investors. The valuation path is less
              clean: 2024 coverage framed the company around a roughly US$1 billion mark, January 2026 Chinese coverage
              estimated a post-money range around RMB 20-30 billion, and later IPO-oriented English coverage floated
              much higher US dollar targets. Those later IPO marks should be treated as market reports, not completed
              financing terms. The strongest conclusion is not a precise valuation curve; it is that StepStar has become
              one of the few Chinese foundation-model startups able to attract very large, strategic capital while peers
              face a more selective funding market. The table below therefore records funding facts and separates
              confirmed round amounts from reported or inferred valuation anchors.
