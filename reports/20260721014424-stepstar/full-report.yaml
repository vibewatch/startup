        title: Milestones, scale signals, and carry-forward gaps
        blocks:
          - type: paragraph
            body: >-
              The public chronology shows why StepFun moved quickly into the Big Six conversation: a 2023 founding,
              rapid early model work, a July 2024 WAIC Step-2 positioning milestone, December 2024 unicorn financing,
              January 2026 B+ funding and chairman upgrade, 2026 product/model releases, and a 2026 IPO timetable. Scale
