        title: People, execution, and partner-dependency risk
        blocks:
          - type: paragraph
            body: >-
              StepFun has a strong talent narrative, but that narrative is itself a risk factor. Jiang Daxin’s
              Microsoft, STCA, and IEEE Fellow credentials are valuable signals, yet they make the company’s story
              unusually tied to one founder’s scientific reputation and ability to keep elite model talent aligned. The
              January 2026 appointment of Yin Qi as chairman is a meaningful mitigation because it adds a
              commercialization and AI-hardware leader to the bench. It also introduces an execution challenge: the same
              public sources emphasize AI-plus-hardware, smart vehicles, devices, and Qianli-related experience, so the
              company is now coordinating across frontier models, phone OEMs, automotive partners, chip constraints, and
              IPO work. Public reporting names a core management team, but not the board architecture, succession plan,
              retention packages, or operating cadence that would let investors underwrite key-person and cross-domain
