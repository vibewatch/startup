      - number: '8.4'
        title: Downside triggers and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The adverse case is straightforward: China AI valuations may be pulled by capital scarcity,
              national-champion narratives, and IPO scarcity faster than fundamentals can catch up. Adverse sources warn
              that compute cost, token rationing, and overvaluation relative to revenue/profitability can turn the
              current cycle into a bubble-like setup. For StepStar, the specific down-round or broken-IPO risks are: an
              HKEX timetable slips because restructuring or filing review takes longer than expected; a prospectus
              reveals revenue or losses materially weaker than media estimates; public investors apply a discount to
              private or cornerstone prices; MiniMax-style volatility weakens appetite for the next listing; or
              preference-heavy private terms make the headline valuation a poor proxy for common-equity value. The
              decisive diligence asks are therefore concrete: filed prospectus, audited revenue, gross margin, compute
              commitments, customer concentration, cap table, liquidation preferences, and lock-up/secondary-sale
              structure. Until those are available, the recommendation stays research-more / track with a stretched
              valuation stance.
