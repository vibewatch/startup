      - number: '7.3'
        title: Competitive, monetization, and capital risk
        blocks:
          - type: paragraph
            body: >-
              The competitive risk is harsher than a normal crowded-market warning. StepFun sits inside China’s “AI Six
              Tigers” narrative, but public adverse sources argue that the peer set itself is under pressure from
              DeepSeek, Alibaba, ByteDance, Qwen, and open-weight price/performance models. Forbes reported abrupt
              DeepSeek price cuts, and other sources frame China’s model market around efficiency, open distribution,
              and a permanent price war. That pushes StepFun to prove monetization beyond generic API access. AsiaICT’s
              adverse framing is especially relevant because it names the core issues directly: unproven profit model,
              dependence on a few hardware manufacturers, and cost re-evaluation pressure. The large funding rounds and
              IPO ambition buy time, but they also raise the proof bar. If StepFun cannot translate device installs,
              enterprise usage, and agent features into durable margins, public-market investors may treat the valuation
              narrative as ahead of the economics.
