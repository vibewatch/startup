            body: >-
              The company's underwritten asset is still the technical leadership cluster around Jiang Daxin. Baidu and
              China AI Atlas support the key-person narrative: Jiang spent roughly 16 years in the Microsoft/MSRA
              ecosystem, rose to Chief Scientist or Global Vice President, and became an IEEE Fellow in 2024. Founder or
