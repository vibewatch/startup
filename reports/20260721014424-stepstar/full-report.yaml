      - number: '3.4'
        title: 'Moat durability: DeepSeek disruption and small API share are the adverse case'
        blocks:
          - type: paragraph
            body: >-
              The adverse competitive case is straightforward. DeepSeek reset buyer expectations around price and
              openness; Qwen and GLM make self-hosting and cloud deployment credible; MiniMax and Kimi compete for
              long-context and agentic workloads; Doubao, Baidu, Tencent, OpenAI, Anthropic, and Google bring
              distribution that StepStar cannot replicate quickly. StepStar’s answer is an integrated “AI + terminal”
              path that may create workflow-level lock-in if STEPX devices and partners become recurring user surfaces.
              That outcome is not yet proven publicly. The diligence burden is therefore not whether StepStar has a
              technically credible model—it does—but whether StepStar can win task-level deployments where buyers could
              otherwise route work to DeepSeek for cost, Qwen or GLM for openness, Kimi or MiniMax for long-context
              agents, or international frontier vendors for enterprise controls. The resulting diligence posture is to
              treat StepStar as a differentiated challenger, not a proven category winner. The most important next
              evidence would be repeated deployments where terminal access, model efficiency, and multimodal reasoning
              jointly produce a durable advantage over cheaper or better-distributed substitutes.
