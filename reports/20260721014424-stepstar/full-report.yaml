      - number: '2.2'
        title: Sizing estimates are directionally bullish but numerically incompatible
        blocks:
          - type: paragraph
            body: >-
              The sizing story is attractive but messy. A narrow Grand View / Horizon country page says China generative
              AI should reach $17.6 billion by 2030 at a 39.1% CAGR, while MarketsandMarkets puts China's 2025
              generative-AI market at $7.0 billion and its 2030 forecast near $98.8 billion at 45.8% CAGR. Tianxia
              Gongchang's China large-model lens is close to that 2025 number at roughly RMB49.5-51.0 billion, but
              broadens to RMB100-130 billion when AI-enabled software is included. Axis Intelligence, using a broader
              China AI revenue definition, places 2025 around $28-31 billion and cites a still-broader IDC-style
              activity proxy around $62 billion. Global context is similarly inconsistent: Gartner sees $2.596 trillion
              of AI spend in 2026 dominated by infrastructure, while LLM-specific forecasts from Grand View, Precedence,
              and MarketsandMarkets cluster in the single-digit to tens-of-billions range. The diligence conclusion is
              not to average these numbers. For StepStar, TAM is China and global foundation-model demand; SAM is
              Chinese MaaS, private deployment, AI app, and device/government solution spend; SOM depends on pricing
              power, distribution, and workload share that public sources do not isolate.
