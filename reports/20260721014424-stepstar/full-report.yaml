  - id: TV007
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - diligence path
    rows:
      - - Official filing
        - HKEX application proof, prospectus, risk factors, use of proceeds, and offer range.
        - Converts media reports into legally accountable disclosure.
        - Monitor HKEXnews and company announcements.
      - - Revenue and margins
        - Audited 2024-2026 revenue, gross margin, compute cost, and loss bridge.
        - Determines whether $8B-$12B can be tied to sales quality.
        - Finance room and prospectus review.
      - - Customer and deployment quality
        - Revenue split across API, terminal devices, auto, enterprise, and consumer products.
        - Separates installed-base narrative from monetizable demand.
        - Customer calls, contracts, usage logs, and partner confirmations.
      - - Cap table / preferences
        - Liquidation preferences, ratchets, pro rata, lock-ups, secondary-sale terms, and cornerstone allocations.
        - Determines common-equity value behind the headline mark.
        - Legal-doc review and waterfall model.
      - - Compute and model economics
        - GPU/cloud commitments, inference unit costs, utilization, and capacity rights.
        - Compute constraints are a sector-level adverse risk.
        - Technical/finance diligence on capacity contracts.
      - - IPO demand quality
        - Book coverage, cornerstone concentration, institutional mix, and post-listing lock-up schedule.
        - A scarcity-driven book may not hold after listing.
        - Underwriter diligence and comp-trading sensitivity work.
    notes: These asks are the minimum data-room package needed to move from research-more to buy or avoid.
