              StepStar is the English diligence label used here for StepFun, the trade name of Shanghai Jieyue Xingchen
              Intelligent Technology Co., Ltd. Public registry and profile sources converge on a founding date of April
              6, 2023 and a Shanghai Xuhui registered address, while official surfaces point readers to the StepFun
              homepage, developer platform, Studio, and Step AI assistant. The product identity is not a single chatbot:
              the company presents a model platform, a consumer assistant, model documentation, and pricing/rate-limit
              pages that imply an API commercialization path. Its official slogan-like vision is to scale possibilities
