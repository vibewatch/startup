              Flash, Step-3 efficiency, AI agents, on-device deployment, voice models in vehicles, and model iteration.
              Chinese coverage states that B+ proceeds will be used for foundation-model R&D and AI-terminal rollout,
              and longer articles explicitly point to compute infrastructure and top AI talent as investment priorities.
              Those facts make GPU/compute, senior research talent, model-serving infrastructure, data operations, and
              integration engineering the most likely burn categories. No source, however, discloses monthly burn, cloud
              commitments, GPU capex, inference cost per user, gross margin, or partner revenue share. The adverse
              market backdrop matters because sector sources describe a broader shift away from unconstrained cash burn
              toward monetization, efficiency, and public-market scrutiny. Unit economics must therefore be estimated
              only directionally: StepStar may enjoy lower marginal inference cost if its efficiency claims hold, but
