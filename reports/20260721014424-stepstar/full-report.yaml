      - number: '7.2'
        title: Compute, geopolitical, and supply-chain risk
        blocks:
          - type: paragraph
            body: >-
              The most concrete operating dependency is compute. StepFun’s large-model, API, phone, and automotive
              ambitions all require reliable model training, inference, and edge optimization. Public sources do not
              show StepFun’s internal GPU contracts, but the sector context is adverse enough to treat compute as a core
              residual risk. U.S. export-control analysis, the 2026 H200 licensing debate, and reporting on restrictions
              for overseas Chinese entities show that access to Nvidia-class hardware can change by policy rather than
              by procurement skill alone. Domestic substitution is a partial mitigation, not a full cure: Huawei-led
              capacity is gaining share inside China, yet CFR’s technical analysis argues that Huawei remains materially
              behind Nvidia in frontier performance. For StepFun this means GPU risk is two-sided: overreliance on
              U.S.-origin chips creates geopolitical exposure, while rapid migration to domestic chips creates
              optimization, cost, performance, and delivery risk.
