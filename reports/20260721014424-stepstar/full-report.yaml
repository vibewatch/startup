  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Chinese frontier landscape: StepStar is credible but not the volume leader'
        blocks:
          - type: paragraph
            body: >-
              StepStar sits in one of the world’s densest foundation-model markets. The relevant Chinese set is not just
              the venture-backed “six little tigers”; it also includes DeepSeek’s low-cost open reasoning stack,
              Alibaba/Qwen’s cloud and open-weight machine, ByteDance/Doubao’s consumer distribution, Baidu/ERNIE and
              Tencent/Hunyuan’s incumbent enterprise channels, and verticalized peers such as Baichuan. The evidence
              supports StepStar as a serious participant because Step3 is a large multimodal MoE model and STEPX Neo
              gives the company a terminal-level product thesis. The adverse read is that independent Q2 2026 provider
              mapping places StepFun below the largest API-volume leaders, so the company’s current public edge is not
              raw API share. Its differentiation has to come from multimodal efficiency and device/agent integration,
              not from being the default developer backend. This matters for diligence because the buyer comparison is
              workload-specific rather than company-specific: document agents, coding agents, device assistants,
              cloud-hosted enterprise models, and self-hosted open weights can all satisfy overlapping jobs. StepStar
              therefore needs evidence that the Step3-plus-terminal path changes usage frequency or cost-to-serve in a
              way a cheaper API cannot copy.
