      - number: '8.2'
        title: Valuation support and multiple limits
        blocks:
          - type: paragraph
            body: >-
              The strongest support for a premium valuation is not a disclosed software multiple; it is strategic
              scarcity. StepStar’s backers include state-linked capital, Tencent/Qiming/FiveYuan-style financial
              sponsors, and hardware ecosystem investors such as Huaqin, Longcheer, OmniVision, and ZTE in later
              reports. Sources also point to terminal-device deployment, mobile/auto cooperation, and a model platform
              that has public developer surfaces. Those are real strategic signals because Chinese foundation-model
              winners require capital, distribution, compute access, and embedded hardware routes. The limiting factor
              is that revenue-multiple work cannot be done cleanly from public evidence. Caijing and a republished
              Tencent article report near-RMB500 million of 2025 revenue and about RMB1.2 billion expected for 2026,
              while a later market report repeats those numbers; however, these are media-sourced estimates, not audited
              company disclosure. Using them to compute price-to-sales at a $10 billion, $12 billion, or near-RMB90
              billion mark would create false precision. The chapter therefore uses milestone/scenario valuation, with
              revenue disclosure treated as a diligence gap rather than as a spreadsheet denominator.
