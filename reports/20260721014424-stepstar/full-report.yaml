      - number: '1.3'
        title: Funding, investors, and IPO readiness
        blocks:
          - type: paragraph
            body: >-
              StepFun's financing record is the chapter's clearest external validation. 36Kr and 1ai describe a December
              2024 Series B of several hundred million dollars involving Shanghai state-owned capital, Tencent,
              FiveYuan/Wuyuan Capital, and Qiming Venture Partners, while Crunchbase separately placed StepStar among
              December 2024 unicorns at a $1 billion valuation. The January 2026 B+ round is more robustly corroborated:
              Eastmoney and AIBase report more than RMB5 billion, led by Shanghai state-owned and industrial capital
              with Tencent, Qiming, and FiveYuan following. By spring 2026 the story shifted from private financing to
              listing readiness: Yicai, The Standard, Reuters mirrors, Tencent News, and other sources described
              red-chip unwinding, possible pre-IPO financing, and Hong Kong IPO targets around US$500 million of
              proceeds and US$10 billion to US$12 billion valuation. That creates a strong capital-markets option, but
              also a regulatory-structure risk and a valuation-to-disclosure tension.
