        title: Deployment, developer workflow, and agent surfaces
        blocks:
          - type: paragraph
            body: >-
              StepFun’s route to usage is developer-first and agent-first. The Open Platform and API reference document
              chat-completion calls, OpenAI-compatible migration, token-based billing, rate limits and model-specific
              pricing. Step Plan adds a subscription layer for developers using coding and agent platforms such as
              OpenClaw, Claude Code, Trae and Cursor. On the open-model side, Step-3 appears on GitHub and Hugging Face,
              with ModelScope distribution in China; the deployment guide supports vLLM and SGLang but also shows that
              large-model self-hosting is still hardware intensive. That split matters for diligence. Hosted API and
              subscription offerings lower adoption friction, while open weights improve developer mindshare and
              self-hosting optionality. At the same time, open weights commoditize parts of the model layer, and the
              minimum deployment footprint remains too large for casual enterprise self-hosting. The agent strategy
              becomes more defensible if StepFun can convert the model layer into stable tools, memory, orchestration,
              device integrations and supportable enterprise workflows.
