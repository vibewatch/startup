  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: StepStar sells model capability, not the entire AI economy'
        blocks:
          - type: paragraph
            body: >-
              The correct market boundary for StepStar is the China-centered foundation-model and generative-AI stack,
              not the full artificial-intelligence economy and not only consumer chat. StepStar's own platform describes
              a production Agent-oriented Step 3.7 Flash model, a no-code model experience center, API use, and vertical
              solutions for consumer electronics, content creation, smart vehicles, local services, finance,
              manufacturing, gaming, and government. That puts the included market across four monetization surfaces:
              MaaS/API model consumption, enterprise private or managed deployment, consumer-device and app
              integrations, and government or state-enterprise digital services. Excluded spend should be generic cloud
              capacity with no AI workload, legacy analytics, non-AI SaaS, and unmonetized open-source experimentation.
              The substitute set is unusually broad because a buyer can choose DeepSeek, Qwen, Doubao, GLM, global API
              platforms, open-weight local deployment, or hyperscaler model routers rather than a StepStar endpoint.
              This boundary matters because the market can be large while StepStar's monetizable pool is only the slice
              where Chinese buyers pay for capability, latency, compliance, integration, or distribution rather than
              free open weights.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
