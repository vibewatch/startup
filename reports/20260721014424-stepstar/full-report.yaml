              million daily services, phone-brand penetration, Geely cockpit deployment, and ecosystem partnerships with
              chips and cloud actors. Tencent News also reports revenue estimates for 2025 and 2026, but those are
              unaudited media estimates, not management financials. The most important adverse source is the
              Lotus/CNINFO filing, which describes StepFun as in a state of large losses and warns of market, policy,
              and operating risks. Later chapters should therefore reuse the identity and financing facts, but
              independently test product-market fit, customer quality, audited revenue, gross margin, compute burn, and
              IPO readiness. A second carry-forward issue is evidence provenance: several scale figures originate in
              media articles or database profiles rather than issuer-certified disclosures, so later chapters should
              treat them as leads to verify, not as final underwriting inputs.
