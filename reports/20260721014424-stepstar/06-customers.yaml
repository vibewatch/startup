runDate: '2026-07-21'
company:
  name: StepStar
chapter:
  number: 6
  title: Customers
  summary: 'StepFun shows unusually strong partner-led distribution evidence for a private AI model company: public sources
    report 42M+ devices through OPPO/Honor/ZTE-class phone partners and a Geely smart-cockpit path expected to exceed 1M vehicles
    in 2026. The caveat is equally large: named partners are not the same as disclosed paying customers, and public sources
    still leave customer count, retention, ARPU, partner exclusivity, and direct enterprise adoption mostly undisclosed.'
sections:
- id: segment-map
  title: 'Customer segments: partner-led distribution before direct-account proof'
  body: StepFun’s public customer story is unusually channel-heavy. The strongest evidence does not look like a classic SaaS
    customer list; it looks like distribution through phone OEMs, automotive cockpits, app-store consumers, API developers,
    and ecosystem partners that can give Amoo useful actions inside STEPX Neo. Reported device integration through OPPO, Honor,
    and ZTE provides the clearest scaled usage surface, while Geely is the clearest named automotive deployment partner. The
    consumer StepFun AI app adds ratings and reviews, but not active-user or monetization counts. Developer/API sources show
    catalog, price, and open-source surfaces, not paying account cohorts. This segmentation matters because StepFun may be
    closer to a model-and-agent infrastructure supplier embedded inside partner channels than to a company with independently
    observable end-customer demand. The chapter therefore treats partners, users, and payers separately rather than collapsing
    all reach into customers. A practical diligence read should therefore ask, for each segment, whether StepFun controls
    the account relationship, merely supplies model capability, or depends on another platform to expose demand.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU014
  - CU018
  - CU020
  - CU023
  - CU026
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-proof
  title: 'Adoption proof: 42M+ device reach is strong, but denominators are uneven'
  body: The most concrete adoption metric is the reported 42 million-plus device install base through phone partners by the
    end of 2025. That is a meaningful distribution signal and is better than a mere logo page because it ties StepFun models
    to shipped devices. But the public record is thinner once the analysis moves from partner reach to usage quality. Geely
    coverage points to smart-cockpit co-development and a 2026 deployment expectation, yet the chapter does not have production
    activation rates, per-car usage, or contract economics. STEPX Neo is strategically important because it could make StepFun
    a direct consumer-hardware owner, but launch coverage repeatedly notes missing price, specifications, shipment targets,
    and sale timing. StepFun AI app ratings show real consumer presence, while API-pricing sources show developer accessibility.
    None of those sources discloses retention, ARPU, paying-user conversion, or revenue contribution by channel. This makes
    the device number a top-of-funnel KPI rather than a complete adoption measure; it should be reconciled to daily active
    requests, recurring contracts, and partner invoices.
  claimRefs:
  - CU002
  - CU005
  - CU006
  - CU007
  - CU009
  - CU010
  - CU012
  - CU014
  - CU015
  - CU020
