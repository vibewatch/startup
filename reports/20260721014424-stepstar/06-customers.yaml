  - TU003
  - TU006
  figureRefs:
  - FU002
  - FU004
  - FU005
- id: named-proof-and-gaps
  title: 'Named customer proof: partners are named; paying customers and retention are not'
  body: 'The named-proof table is deliberately conservative. OPPO, Honor, ZTE, Geely, Alipay, Kingdee, and Huaqin are real
    named entities in public reporting, but they play different roles. Phone makers and Geely look like distribution or deployment
    partners; app companies such as Alipay, Meituan, Didi, Trip.com, and CapCut are ecosystem participants; Kingdee and Alipay
    coverage points toward enterprise-service and payment infrastructure cooperation; Huaqin is a manufacturing dependency.
    These are valuable signals, but they are not the same as disclosed paying-customer counts or referenceable enterprise
    contracts. Retention remains almost completely private: no NRR, GRR, churn, renewal rate, contract length, cohort retention,
    top-customer concentration, or segment-level ARPU appeared in the reviewed public materials. That means customer quality
    must be underwritten with partner durability and distribution leverage rather than conventional recurring-revenue metrics.
    Later reference calls should separate pilots, paid production deployments, and co-marketing announcements so that partner
    visibility is not mistaken for contracted customer quality.'
  claimRefs:
  - CU003
  - CU005
  - CU007
  - CU010
  - CU014
  - CU015
  - CU016
  - CU024
  - CU025
  - CU026
  - CU027
  - CU036
  - CU037
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: durability-and-concentration
  title: 'Durability risk: OEM lock-in and ecosystem permissions remain the key tests'
  body: 'The adverse evidence cuts directly against a simple traction narrative. GSMArena questioned how much substance existed
    behind the agentic-phone announcement, while Gogi warned buyers not to wait for a product without confirmed timing, pricing,
    or international availability. Chinese analysis was more pointed on StepFun’s partner model: Toutiao argued that OEM relationships
    are not exclusive, that OPPO or Geely can switch or multi-source models, and that revenue concentration around a few terminal
    partners could become cliff risk. BigGo’s launch analysis adds another operational constraint: Amoo’s usefulness depends
    on deep, durable interfaces from super-apps and user willingness to delegate sensitive permissions. The diligence conclusion
    is not that customer traction is absent; it is that the public evidence supports broad distribution but not retention
    durability. Later diligence should demand contracts, exclusivity terms, active-user cohorts, partner-level revenue, renewal
    history, and permission-interface depth. The adverse stance is especially relevant because an agent phone becomes less
    useful if the most important apps restrict automation or reserve key workflows for their own assistants.'
  claimRefs:
  - CU012
  - CU013
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU035
  - CU038
