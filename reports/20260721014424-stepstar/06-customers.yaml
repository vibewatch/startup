  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: paying-customer-count
    missingEvidence: Direct paying-customer count by OEM, automotive, API, enterprise, and consumer channels.
    whyItMatters: Partner reach does not reveal how many customers pay StepFun directly or which channels drive revenue quality.
    diligencePath: Request customer ledger, invoiced account count, partner revenue share, and channel-level revenue bridge.
    relatedQuestionRefs:
    - QU016
    - QU024
    - QU025
    relatedTableRefs:
    - TU001
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: NRR, GRR, churn, renewal rate, contract term, cohort retention, and ARPU by segment.
    whyItMatters: Without repeat-usage and renewal evidence, the reported 42M device reach cannot be converted into durable
      customer value.
    diligencePath: Request cohort tables for app, API, OEM, and automotive channels plus renewal schedules for top partners.
    relatedQuestionRefs:
    - QU011
    - QU019
    - QU024
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: Private list of signed customers, production deployments, pilots, commercial terms, and deployment outcomes.
    whyItMatters: The public table can enumerate named partners but cannot prove exhaustive customer penetration or production
      value.
    diligencePath: Interview management and obtain contracts or customer references for the top 10 revenue relationships.
    relatedQuestionRefs:
    - QU002
    - QU004
    - QU015
    - QU016
    relatedTableRefs:
    - TU003
    - TU006
  - type: conflicting-data
    severity: material
    topic: oem-lock-in
    missingEvidence: Contract exclusivity, minimum volume commitments, switching rights, and customer-concentration percentages
      for OPPO, Honor, ZTE, Geely, and other terminal partners.
    whyItMatters: Adverse sources argue partner relationships are non-exclusive and substitutable, which could materially
      reduce retention durability.
    diligencePath: Review OEM and Geely agreements, termination clauses, model substitution rights, and revenue concentration
      schedules.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU022
    relatedTableRefs:
    - TU005
