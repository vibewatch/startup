- id: TU001
  title: Customer / partner segment map
  columns:
  - segment
  - buyer / user / payer
  - use case
  - public scale signal
  - strategic value
  - main gap
  rows:
  - - Phone OEM device partners
    - OEM buyer / phone user / StepFun or OEM monetization unclear
    - On-device model and assistant capabilities inside OPPO, Honor, ZTE-class devices
    - 42M+ devices reported by end-2025
    - Largest distribution channel and strongest reach proof
    - No partner-level revenue, exclusivity, or active-use denominator
  - - Automotive partners
    - Automaker buyer / driver-passenger user
    - Geely smart cockpit, voice model, AgentOS, Galaxy M9 interaction
    - Geely deployment expected to surpass 1M vehicles by end-2026 per City News
    - Named production-adjacent partner and high-frequency in-car use case
    - No contract economics, renewal, or per-vehicle activation metric
  - - Consumer StepFun AI app users
    - Individual app user / subscriber or free user
    - Assistant, document understanding, task execution, StepClaw agent
    - App Store 4.7 with 912 ratings; Google Play 3.7 with 67 reviews
    - Direct consumer surface and feedback loop
    - Downloads, MAU, paid conversion, retention, and ARPU undisclosed
  - - STEPX Neo ecosystem partners
    - Service partner / phone user / transaction platform payer unclear
    - Agent execution across payment, travel, ride-hailing, local services, productivity, content
    - First-wave partner list includes Alipay, Meituan, Didi, Trip.com, CapCut, WPS, Baidu, JD.com
    - Essential to make Amoo useful beyond chat
    - Integration depth, commercial terms, and consumer adoption unproven
  - - Enterprise/API developers
    - Developer or enterprise buyer / application user
    - Token-priced API for coding, RAG, agents, vision, long-context and tool-use workloads
    - Third-party catalogs track pricing and seven models
    - Scalable monetization path beyond hardware partners
    - Paying developer accounts and retention undisclosed
  - - Open-source developer community
    - Developer user / no direct payer necessarily
    - Step-Audio2 and Step-Audio-R1 repositories and model experimentation
    - GitHub organization and public repositories visible
    - Ecosystem credibility and recruiting/developer flywheel
    - Stars/downloads and conversion to paid API not disclosed
  notes: Segmentation separates users, partners, and payers because public sources rarely disclose who pays StepFun directly.
