  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 中国前沿模型格局：StepStar 可信，但不是量级领先者
        blocks:
          - type: paragraph
            body: >-
              StepStar 所在的是全球最拥挤的基础模型市场之一。中国竞品集合不只是拿了风投的钱的「六小虎」；还包括 DeepSeek 的低成本开放推理栈、Alibaba/Qwen
              的云与开放权重机器、ByteDance/Doubao 的消费者分发、Baidu/ERNIE 和 Tencent/Hunyuan 的存量企业渠道，以及 Baichuan 等垂直化同行。证据支持 StepStar
              是严肃玩家：Step3 是大型多模态 MoE 模型，STEPX Neo 则给公司一条终端级产品逻辑。反向解读是，独立 2026 年 Q2 供应商地图把 StepFun 排在最大 API
              量级领导者之后，因此公司当前公开优势不是原始 API 份额。差异化必须来自多模态效率和设备 /
              智能体集成，而不是默认开发者后端。尽调需要这一点，因为买方比较按工作负载展开，而不是按公司名展开：文档智能体、编码智能体、设备助手、云托管企业模型和自托管开放权重，都能满足重叠任务。因此，StepStar
              需要证据证明，Step3 加终端这条路能改变使用频率或服务成本，而且便宜 API 难以复制。
