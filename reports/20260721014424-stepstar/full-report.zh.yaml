      - number: '8.2'
        title: 估值支撑与倍数上限
        blocks:
          - type: paragraph
            body: >-
              支撑溢价估值的最强证据不是披露的软件倍数，而是战略稀缺性。StepStar 背后有国资相关资本、Tencent/Qiming/FiveYuan 式财务投资人，以及后续报道中的
              Huaqin、Longcheer、OmniVision、ZTE 等硬件生态投资人。来源还指向终端设备部署、移动 /
              汽车合作，以及已有公开开发者入口的模型平台。这些都是真实战略信号，因为中国基础模型赢家需要资本、分发、算力获取和嵌入硬件的路径。限制因素是，基于公开证据无法干净地做收入倍数工作。Caijing 与一篇转载的
              Tencent 文章报告 2025 年收入接近 RMB500 million、2026 年预计约 RMB1.2 billion，后续市场报道也重复这些数字；但这些是媒体估计，不是经审计的公司披露。用它们去计算
              $10 billion、$12 billion 或接近 RMB90 billion 标记下的市销率，会制造虚假精确。因此，本章采用里程碑 / 情景估值，把收入披露视为尽调缺口，而不是表格分母。
