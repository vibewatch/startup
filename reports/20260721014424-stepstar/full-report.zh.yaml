  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              估值判断对价格敏感，而不是对公司质量敏感。StepStar 融资动能异常强：公开来源核验了 2024 年 12 月由上海国资、Tencent、Qiming 等投资人支持的 Series B；多家 2026
              年来源核验了超过 RMB5 billion 的 Series B+；后续报道还描述了来自产业硬件玩家、国资相关投资人和既有创投股东的 Pre-IPO 或 IPO
              路径融资。这一组合让香港上市具备可信度。承销难题在于，头部价格比公开基本面变化更快。本次审阅来源把公司在 Pre-IPO 语境下估到大约 $4 billion 至 $6 billion；部分融资数据集约 $10
              billion；IPO 报道为 $12 billion；更激进市场传闻接近 RMB90 billion 或更高。本文审阅的 StepStar
              官方页面和公开文件没有提供经审计收入、毛利率、烧钱速度、算力承诺、优先股堆叠或确定版招股书。因此，新投资人不应把最高 IPO 标记视为已证实价值；那只是动能标记，需要数据室确认。
