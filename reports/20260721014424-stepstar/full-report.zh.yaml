              以上，并新增国资、产业资本和存量财务投资人。估值路径没那么干净：2024 年报道把公司放在约 US$1 billion 档位；2026 年 1 月中文报道估计投后区间约 RMB 20-30
              billion；后续面向 IPO 的英文报道则抛出更高美元目标。后面的 IPO 估值应视为市场报道，不是已完成融资条款。最强结论不是精确估值曲线，而是 StepStar
              已成为少数能在同业面对更挑剔融资市场时，仍吸引超大规模战略资本的中国基础模型创业公司。因此，下表记录融资事实，并把已确认轮次金额与报道或推断的估值锚分开。
