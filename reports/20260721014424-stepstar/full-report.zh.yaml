      - number: '2.2'
        title: 规模估算方向利好，但数字彼此不兼容
        blocks:
          - type: paragraph
            body: >-
              市场规模故事很有吸引力，但数字混乱。口径较窄的 Grand View / Horizon 国家页面称，中国生成式 AI 到 2030 年应达到 $17.6 billion，CAGR 为
              39.1%；MarketsandMarkets 则把中国 2025 年生成式 AI 市场定为 $7.0 billion，并预测 2030 年接近 $98.8 billion，CAGR 为
              45.8%。Tianxia Gongchang 的中国大模型口径接近这个 2025 年数字，约 RMB49.5-51.0 billion；若纳入 AI 赋能软件，则扩至 RMB100-130
              billion。Axis Intelligence 采用更宽的中国 AI 收入口径，把 2025 年放在约 $28-31 billion，并引用更宽的 IDC 式活动代理指标，约 $62
              billion。全球口径同样不一致：Gartner 预计 2026 年 AI 支出为 $2.596 trillion，主要由基础设施主导；而 Grand View、Precedence 和
              MarketsandMarkets 的 LLM 专项预测集中在个位数十亿到数百亿美元区间。尽调结论不是给这些数字取平均。对 StepStar 而言，TAM 是中国和全球基础模型需求；SAM 是中国
              MaaS、私有部署、AI 应用以及设备 / 政府方案支出；SOM 取决于定价权、分发和工作负载份额，而公开来源没有拆出这些变量。
