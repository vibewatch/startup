  - id: TV003
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 方向
      - 什么会改变观点
    rows:
      - - 国资相关、Tencent / Qiming / FiveYuan 以及工业资本参与，给 StepStar 带来异常深的融资通道。
        - 投资逻辑
        - 如果最终招股书显示融资偏优先权堆叠，或主要由内部人支持，投资逻辑会走弱。
      - - 硬件和终端生态投资方可以把模型能力转成嵌入式分发。
        - 投资逻辑
        - 若披露部署经济性、API 收入和客户集中度，投资逻辑会增强。
      - - 香港 AI IPO 可比案例显示，投资者能以很高估值资本化稀缺的中国模型实验室上市标的。
        - 投资逻辑
        - 如果 StepStar 定价前 Z.AI 或 MiniMax 估值波动延续，投资逻辑会走弱。
      - - 官方公开渠道没有披露经审计收入、烧钱、利润率或股权结构条款。
        - 反向逻辑
        - 一份已提交且财务可信的招股书，会补上最大承销缺口。
      - - 公开估值标记彼此冲突，从 $4B-$6B、$10B-$12B 到近 RMB90B 或更高传闻不等。
        - 反向逻辑
        - 如果有约束力的基石价格、最终发行区间和机构簿记质量证实需求，观点会改善。
      - - 中国 AI 泡沫批评认为，算力约束和盈利能力弱会让头条估值变脆。
        - 反向逻辑
        - 如果 StepStar 展示出明显优于同行的收入质量、毛利率和算力效率，风险会下降。
    notes: 表格刻意保持对称：StepStar 可以具备战略价值，但在错误入场估值下仍可能过贵。
