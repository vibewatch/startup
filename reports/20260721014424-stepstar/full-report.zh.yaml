      - number: '5.2'
        title: 模型架构、成本效率与基准证据
        blocks:
          - type: paragraph
            body: >-
              最强的产品技术证据是 Step-3。公开技术材料描述了一个 321B 参数多模态 MoE，每 token 激活 38B 参数，支持 65,536 上下文，采用 MFA attention、48 个专家且每
              token 选择 3 个专家。系统论文和模型博客对工程逻辑写得异常明确：不是单纯堆参数，而是降低解码成本。MFA 降低 KV-cache 和 attention 计算；AFD 把 attention 与 FFN
              工作拆到专门推理子系统。StepFun 还披露了预训练规模——超过 20T 文本 tokens 加 4T 图文混合 tokens——并报告
              MMMU、MATH-Vision、AIME25、GPQA-Diamond、LiveCodeBench 等任务的基准结果。成本故事可信，因为模型、attention
              算术、稀疏激活和部署指引彼此一致。但这些基准仍主要由公司发布，比较器复现设置很关键；已审阅公开记录中没有找到独立复现。因此，Step-3 可以作为严肃技术资产来承销，但还不能被独立认证为持久性能护城河。
