  - id: TV006
    title: 投资逻辑破裂与止损触发器表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - HKEX 申报延误
        - 在已报道重组和 6 月时间窗口之后，仍无招股书或正式申报路径。
        - 把 IPO 准备就绪叙事转成执行风险。
        - 转为等待申报；不要支付 IPO 溢价。
      - - 收入证明缺口
        - 申报收入显著低于媒体估计，或 API / 终端 / 汽车需求没有分部经济性。
        - 打破倍数支撑故事。
        - 按 $4B-$6B 或更低重新承销。
      - - 算力成本压力
        - 毛利率、云容量或 token 配给暴露扩展性差。
        - 高增长变贵，可持续倍数下降。
        - 要求折价，并尽调算力承诺。
      - - 公开可比公司压缩
        - StepStar 定价前，Z.AI 或 MiniMax 市值继续下跌。
        - 降低投资者对又一家中国模型实验室 IPO 的胃口。
        - 推迟入场，或要求更小估值区间。
      - - 优先权悬顶
        - 新老投资者持有偏重下行保护的条款、清算优先权或特殊权利。
        - 头条估值高估普通股价值。
        - 投资前先搭瀑布模型。
      - - 缺乏支撑的高目标
        - 最终区间在没有经审计财务证据下瞄准 $12B+ 或近 RMB90B。
        - 稀缺性溢价压过承销纪律。
        - 回避，或只有强下行保护时参与。
    notes: 触发器设计成可监控项，等招股书、基石簿记或融资文件可用时即可检查。
