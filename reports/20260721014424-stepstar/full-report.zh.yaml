  - id: TV002
    title: 估值历史与冲突标记表
    columns:
      - 日期 / 窗口
      - 估值或融资标记
      - 来源姿态
      - 尽调解读
    rows:
      - - 2024 年 12 月 Series B 轮
        - 数亿美元 Series B 轮；提示中 ~$1B 的估值锚点未被保留的公开来源证实。
        - SCMP、SiliconAngle、TMTPost 和 Dealroom 证实该轮融资 / 资方，但没有给出一致估值。
        - 将其视为早期独角兽锚点，同时保留重大估值披露缺口。
      - - 2026 年 1 月 Series B+ 轮
        - 融资超过 RMB5B / 约 $700M-$717M。
        - 36Kr、KR Asia、Tencent News 和 Aibase 在规模和投资方组合上趋同。
        - 资本获取能力信号强；估值仍未统一披露。
      - - 2026 年 2–4 月 Pre-IPO 规划
        - Caijing / Sina 报道分批融资，投前估值约 $4B 和 $5B-$6B。
        - 媒体称截至发稿管理层尚未公开回应。
        - 比 $12B 更可承销，因为它更贴近近期私募融资语境。
      - - 2026 年 5 月工业轮报道
        - 腾讯转载报道中，据称融资近 $2.5B，投后估值 $5B-$6B。
        - 报道称工业投资方包括 Huaqin、Longcheer、OmniVision、ZTE 和 HKIC。
        - 支持战略财团溢价，但也显示与 $10B-$12B 目标冲突。
      - - 2026 年 6 月 IPO 报道
        - 据报道 IPO 估值目标最高 $12B / 超过 RMB80B。
        - Sina、163、StartupWired 和 The AI Chronicle 承载高 IPO 叙事。
        - IPO 要价有合理性；尚不是已完成的公开市场估值。
      - - 2026 年 7 月市场传闻来源
        - BestStartup 和 Oryndex 引用约 $10B；Newsglobenow 提到近 RMB90B 量级或更高的二级市场需求。
        - 各报道的来源质量和单位换算差异很大。
        - 明确保留所有数字；不要把它们压成一个虚假精确的标记。
    notes: 列举并不完整：它覆盖截至 2026-07-21 保留的公开融资 / IPO 标记，并刻意保留不一致估值，而不是取平均。
