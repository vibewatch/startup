  - id: TV007
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 官方申报
        - HKEX 申请证明、招股书、风险因素、募资用途和发行区间。
        - 把媒体报道转成有法律责任的披露。
        - 跟踪 HKEXnews 和公司公告。
      - - 收入和利润率
        - 经审计的 2024-2026 年收入、毛利率、算力成本和亏损桥。
        - 判断 $8B-$12B 能否绑定销售质量。
        - 财务资料室和招股书审查。
      - - 客户和部署质量
        - API、终端设备、汽车、企业和消费者产品之间的收入拆分。
        - 区分装机量叙事和可变现需求。
        - 客户访谈、合同、使用日志和合作伙伴确认。
      - - 股权结构表 / 优先权
        - 清算优先权、反稀释棘轮、按比例跟投权、锁定期、老股出售条款和基石分配。
        - 判断头条标记背后的普通股价值。
        - 法律文件审查和瀑布模型。
      - - 算力和模型经济性
        - GPU / 云承诺、推理单位成本、利用率和容量权利。
        - 算力约束是行业层面的反向风险。
        - 对容量合同做技术 / 财务尽调。
      - - IPO 需求质量
        - 簿记覆盖、基石集中度、机构组合和上市后锁定安排。
        - 靠稀缺性驱动的簿记上市后可能撑不住。
        - 承销商尽调和可比交易敏感性分析。
    notes: 这些问题是把建议从继续研究推向买入或回避所需的最低资料室包。
