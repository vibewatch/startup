  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与组合宽度
        blocks:
          - type: paragraph
            body: >-
              StepFun 不是单产品 AI 创业公司；公开产品定义是一套分层平台。可见组合从消费者 StepFun AI 应用和桌面智能体开始，加上用于实验和创作的 AI Studio，开放带 API 文档和定价的
              Open Platform，把面向编码与智能体工具的 Step Plan 订阅打包进去，现在又通过 STEPX Neo
              智能体手机概念延伸到终端硬件。按工作流看，公司想掌握从基础模型到智能体执行界面的路径：开发者通过 OpenAI 风格 API 调用模型，创作者在 Studio 里实验，消费者使用 StepFun
              AI，设备伙伴则可把多模态助手能力嵌入手机、车辆或其他终端。组合宽度是正面承销信号，因为它展示了多条分发路径，而不是单纯研究演示。需要警惕的是，宽度也会分散执行：模型质量、API 可靠性、应用
              UX、开放权重支持、订阅经济性和硬件—智能体集成，需要不同运营肌肉。
