        title: 监管、IPO 与法律结构风险
        blocks:
          - type: paragraph
            body: >-
              StepFun 的风险栈从监管开始，因为公司卖的不是普通软件；它运行在全球监管最活跃的 AI 体系之一。中国生成式 AI 规则、当前 CAC 备案公告、深度合成规定和国家 AI
              内容标识标准，为任何面向公众的模型、API、智能体或设备界面列出一张实时运营清单。StepFun 自家法律页面展示了基础条款和隐私披露，但不能证明模型备案、标识落地、安全审计或企业控制准备已经完成。IPO
              层进一步放大这个问题：Reuters 转发报道称，在北京审查红筹上市的背景下，公司拆除了离岸结构；其他来源则描述股改和香港 IPO 准备。这并不意味着上市受阻，但会让法律执行成为高影响路径依赖，而不是行政细节。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
