      - number: '7.2'
        title: 算力、地缘政治与供应链风险
        blocks:
          - type: paragraph
            body: >-
              最具体的运营依赖是算力。StepFun 的大模型、API、手机和汽车野心，都需要可靠的模型训练、推理和边缘优化。公开来源没有显示 StepFun 的内部 GPU
              合同，但行业背景已经足够不利，应把算力视为核心残余风险。美国出口管制分析、2026 年 H200 许可争论，以及海外中国实体受限报道都显示，Nvidia
              级硬件获取可能由政策改变，而不只取决于采购能力。国产替代是部分缓释，不是完整解法：以 Huawei 为代表的产能正在中国提升份额，但 CFR 技术分析认为，Huawei 在前沿性能上仍明显落后于 Nvidia。对
              StepFun 而言，GPU 风险是双向的：过度依赖美国来源芯片会带来地缘政治敞口，快速迁移到国产芯片又会带来优化、成本、性能和交付风险。
