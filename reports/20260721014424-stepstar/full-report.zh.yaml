          claimRefs:
            - CV023
            - CV024
            - CV043
        - label: 估值支撑
          value: 2
          detail: 多个公开估值标记彼此冲突，官方收入倍数也无法计算。
          claimRefs:
            - CV014
            - CV015
            - CV025
        - label: 下行风险
          value: 4
          detail: 算力压力、估值过高和可比公司压缩都是可见的反向变量。
          claimRefs:
            - CV028
            - CV039
            - CV040
        - label: 证据质量
          value: 3
          detail: 融资证据覆盖面广，但业务基本面需要申报级披露。
          claimRefs:
            - CV001
            - CV003
            - CV023
            - CV041
    approximationNotes: 1-5 的序数评分综合公开证据；下行风险数值越高，风险越大。
    claimRefs:
      - CV003
      - CV014
      - CV023
      - CV027
      - CV039
