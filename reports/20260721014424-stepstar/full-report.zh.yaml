      - number: '7.4'
        title: 人才、执行与伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              StepFun 的人才叙事很强，但这一叙事本身也是风险因素。Jiang Daxin 的 Microsoft、STCA 和 IEEE Fellow
              履历是有价值的信号，但也让公司故事异常依赖一位创始人的科学声望，以及他持续凝聚顶尖模型人才的能力。2026 年 1 月 Yin Qi 出任董事长，是有意义的缓释：公司在团队里加入了商业化与 AI
              硬件负责人。它也带来执行挑战：同一批公开来源强调 AI + 硬件、智能汽车、设备和 Qianli 相关经验，因此公司如今要同时协调前沿模型、手机 OEM、汽车伙伴、芯片约束和 IPO
              工作。公开报道列出了核心管理团队，却没有披露董事会架构、继任计划、留任激励或运营节奏，投资者因此难以有把握地承销关键人和跨领域执行风险。
