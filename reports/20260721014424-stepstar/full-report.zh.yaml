  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 融资动能支撑 IPO 准备度，但估值标记冲突、申报文件缺失压住推荐上限。
    data:
      nodes:
        - id: financing
          label: 融资动能
          description: Series B 和 B+ 信源显示资本获取能力很强。
        - id: comps
          label: 香港 AI 可比公司热度
          description: Z.AI 和 MiniMax 显示公开市场仍有高估值窗口。
        - id: conflict
          label: 估值标记冲突
          description: StepStar 估值标记从 $4B-$6B 到 $10B-$12B 不等，还有接近 RMB90B 的说法。
        - id: missing
          label: 招股书关键项缺失
          description: 尚无 StepStar 官方申报文件、经审计收入、利润率、烧钱速度或优先权细节。
        - id: adverse
          label: 泡沫 / 压缩风险
          description: 行业批评者指出算力成本和估值过高风险。
        - id: call
          label: 推荐：继续研究 / 观察
          description: 只有拿到申报级证据后，定价才站得住。
      edges:
        - from: financing
          to: call
          label: 支撑融资通道
        - from: comps
          to: call
          label: 支撑 IPO 窗口
        - from: conflict
          to: call
          label: 压低置信度
        - from: missing
          to: call
          label: 阻止买入
        - from: adverse
          to: call
          label: 抬高折价
    approximationNotes: 这是定性的投委会逻辑链，不是数学模型。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV014
      - CV015
      - CV039
      - CV040
  - id: FV002
    title: 估值时间线与敏感性
    type: bar
    layout: wide
    summary: 公开估值标记从 Series B/B+ 阶段到 IPO 传闻大幅抬升，但单位和信源质量彼此冲突。
    data:
      items:
        - label: Dec 2024 Series B 工作锚点
          value: 1
          unit: USD billions
          detail: 提示词层面的估值锚点；保留的公开来源能验证该轮融资，但无法给出一致估值。
          claimRefs:
            - CV001
            - CV002
            - CV044
        - label: Jan 2026 B+ 融资金额
          value: 0.717
          unit: USD billions raised
          detail: 超过 RMB5B / 约 $700M-$717M 的融资信号。
          claimRefs:
            - CV003
            - CV004
        - label: Feb-Apr 2026 较低 Pre-IPO 标记
          value: 4
          unit: USD billions
          detail: 首次报道的 Pre-IPO 批次投前估值标记。
          claimRefs:
            - CV006
        - label: Apr-May 2026 较高 Pre-IPO 标记
          value: 6
          unit: USD billions
          detail: 第二批次 / 投后报道区间。
          claimRefs:
            - CV006
            - CV007
        - label: 2026 年融资数据集
          value: 10
          unit: USD billions
          detail: Oryndex / BestStartup 引用约 $10B。
          claimRefs:
            - CV012
            - CV013
        - label: June 2026 IPO 目标
          value: 12
          unit: USD billions
          detail: 多个来源报道了较高的 IPO 目标。
          claimRefs:
            - CV008
            - CV009
            - CV010
        - label: 接近 RMB90B 等值
          value: 12.4
          unit: USD billions equivalent
          detail: 接近 RMB90B 的近似 USD 等值；部分标题更高，或单位含糊。
          claimRefs:
            - CV011
            - CV014
    approximationNotes: USD 等值已四舍五入；本图保留彼此冲突的公开估值标记，并不表示所有数字同样可靠。
    claimRefs:
      - CV002
