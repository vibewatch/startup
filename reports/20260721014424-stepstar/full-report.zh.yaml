        blocks:
          - type: paragraph
            body: >-
              Step3 架构是竞争论点的正面核心：总参数 321B、每 token 激活 38B、多模态推理、公开模型检查点，以及兼容 OpenAI/Anthropic
              的访问方式。对需要在受限加速器上跑视觉—语言推理的买方来说，这是可信的技术切入点。问题在于，开放已经不稀缺。DeepSeek 开源 R1 和蒸馏模型，Qwen3 在广泛模型家族中开放稠密与 MoE
              权重，Zhipu 以宽松许可发布 GLM 模型，Moonshot 和 MiniMax 发布大型 MoE 模型卡，Meta 则通过 Llama 在国际市场维持开放权重压力。因此，StepStar
              的策略更像选择性开放叠加终端分发，而不是独一无二的开源护城河。买方可以跨这些 API
              和模型检查点多宿主，降低切换成本，也削弱单独模型访问的溢价。比较方式也会改变基准测试解读。强模型卡是进入候选名单的必要条件；但如果买方能用开放模型检查点、云托管 Qwen 或 GLM 部署，或 DeepSeek
