  - id: TV005
    title: 可比估值表
    columns:
      - 可比对象
      - 指标 / 估值标记
      - 与 StepStar 的相关性
      - 局限
    rows:
      - - Zhipu / Z.AI
        - StockAnalysis 显示 2026-07-20 市值约 HK$397.02B，2026-04-30 为 HK$386.99B；SCMP 和 Straits Times 描述其 IPO / 售股背景。
        - 为中国基础模型标的设定了很高的香港公开市场边界。
        - 已上市可比公司自身有波动；不能直接证明 StepStar 价值。
      - - MiniMax
        - StockAnalysis 显示 2026-05-14 市值为 HK$266.59B，但到 2026-07-20 只有 HK$60.56B；CNBC 描述其首日翻倍以及收入 / 亏损背景。
        - 同时显示 IPO 胃口和上市后压缩风险。
        - 业务组合和时间点不同；市值数月内剧烈变化。
      - - Moonshot AI / Kimi
        - TechCrunch 和其他来源报道估值约 $20B；Yahoo 报道 Moonshot 在 Kimi K3 后接近 $30B。
        - 私募前沿实验室可比案例，说明 StepStar 的 $10B-$12B 目标并非孤例。
        - 私募轮，不是可交易的公开市场标记；来源集合来自媒体报道。
      - - StepStar Pre-IPO 私募标记
        - Caijing / Tencent 报道投前 $4B、随后 $5B-$6B 的分批融资；BestStartup / Oryndex 引用约 $10B。
        - 基准情景估值的直接公司锚点。
        - 媒体标记冲突；最终发行区间不可见。
      - - StepStar 高 IPO 目标
        - Sina / 163 / AI Chronicle / StartupWired 报道最高 $12B 或超过 RMB80B。
        - 与预期香港定价诉求直接相关。
        - IPO 目标不是已执行市场价值，可能调整。
      - - AI 估值过高 / 泡沫批评
        - ChinaBizInsider 和 NationPress 警告，收入 / 盈利能力不足以支撑估值，且存在算力压力。
        - 为偏高私募标记提供反向边界。
        - 行业层面批评；需要 StepStar 自身财务来量化影响。
    notes: 列举是直接相关的中国 AI 公开 / 私募估值参考和反向市场校验样本，不是完整的全球 AI 可比公司范围。
