      - number: '7.3'
        title: 竞争、变现与资本风险
        blocks:
          - type: paragraph
            body: >-
              竞争风险比普通的“市场拥挤”警示更重。StepFun 处在中国“AI 六小虎”叙事里，但公开反向来源认为，这组同业本身正承受 DeepSeek、Alibaba、ByteDance、Qwen 以及开放权重价格 /
              性能模型的压力。Forbes 报道 DeepSeek 突然降价，其他来源也把中国模型市场概括为效率、开放分发和长期价格战。这迫使 StepFun 证明，除通用 API 访问之外还能变现。AsiaICT
              的反向表述尤其相关，因为它直接点出核心问题：盈利模式未证实、依赖少数硬件厂商、成本重估压力。大额融资和 IPO 野心买来了时间，也抬高了证明门槛。如果 StepFun
              不能把设备安装、企业使用和智能体功能转成持久利润率，公开市场投资者可能会认为估值叙事跑在经济性前面。
