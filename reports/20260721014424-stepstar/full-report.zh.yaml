  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：StepStar 卖的是模型能力，不是整个 AI 经济
        blocks:
          - type: paragraph
            body: >-
              StepStar 正确的市场边界，是以中国为中心的基础模型和生成式 AI 技术栈；不是整个 AI 经济，也不只是消费者聊天。StepStar 自家平台展示了面向生产的智能体型 Step 3.7 Flash
              模型、无代码模型体验中心、API 使用，以及面向消费电子、内容创作、智能汽车、本地生活、金融、制造、游戏和政府的垂直方案。由此纳入的市场横跨四个变现面：MaaS/API
              模型消耗、企业私有或托管部署、消费者设备和应用集成，以及政府或国企数字化服务。应排除的支出包括没有 AI 工作负载的通用云容量、传统分析、非 AI SaaS 和未变现的开源实验。替代品集合异常宽，因为买方可以选择
              DeepSeek、Qwen、Doubao、GLM、全球 API 平台、开放权重本地部署，或超大规模云厂商的模型路由器，而不是 StepStar 端点。这个边界很关键：市场可以很大，但 StepStar
              可变现的池子只限于中国买方愿意为能力、延迟、合规、集成或分发付费，而不是使用免费开放权重的那一块。
