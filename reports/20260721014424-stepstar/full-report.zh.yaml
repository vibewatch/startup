      - number: '2.4'
        title: Token 增长和政策支持真实存在，但定价、算力和信任限制价值捕获
        blocks:
          - type: paragraph
            body: >-
              最强的市场驱动，是中国模型使用似乎已经从演示跨入高容量部署：Digital in Asia 报道，到 2026 年 3 月，日 AI token 达到 140 trillion；DigitalApplied
              报道，2026 年 Q2 中国供应商拿下 OpenRouter 流量的 45% 以上。政府政策也是顺风：国务院 AI+ 意见推动跨行业采用，Axis
              则引用了私人投资总额低估的国家和引导基金资本。全球企业需求也在从试点走向生产，Deloitte 报道员工 AI 访问增长 50%，McKinsey 则警告 AI
              可能吃掉多达三分之一的变革预算。同一组证据也界定了约束。DeepSeek 官方定价显示 token 价格很低；AWS 和 Azure 让模型路由和多供应商选择变成常态；Qwen 和 DeepSeek
              的开放权重让能力更可替代；中国特有监管还增加安全评估、实名义务、标识和内容控制风险。因此，市场判断是：使用量和政策利好，收入质量喜忧参半，对无差异模型 API 不利。StepStar
              需要分发、垂直集成或智能体工作流控制，才能把中国 AI 增长转成可防守收入。
