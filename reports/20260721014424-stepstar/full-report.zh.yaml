      - number: '7.5'
        title: 缓释因素、监测指标与否决条件
        blocks:
          - type: paragraph
            body: >-
              今天可见风险没有单项致命，但剩余风险堆栈仍高，因为多条风险链相互强化。监管合规影响产品发布节奏；产品发布节奏影响企业和设备变现；变现影响 IPO 准备度；IPO
              准备度又影响公司继续为昂贵算力和人才融资的能力。公开缓释因素存在：国资相关和产业投资人、StepFun
              法律页面、扩大的领导团队、主要设备伙伴，都降低了这是空转概念故事的概率。它们不能替代私下尽调。投资逻辑破裂触发器应当具体：CAC 备案和模型公示证据缺失或过期、AI
              内容标识执行薄弱、没有清晰算力应急方案、DeepSeek 式价格压力下看不到毛利率路径、红筹或股改问题未解决，或者上市前核心技术领导团队离职。
