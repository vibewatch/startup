    title: 投资 KPI
    type: kpi
    layout: wide
    summary: StepStar 在融资通道和可比窗口上得分高，但披露质量和估值支撑得分低。
    data:
      items:
        - label: 融资通道
          value: 5
          detail: B+ 和 Pre-IPO 报道显示，国资、VC 和产业资金支持很深。
          claimRefs:
            - CV003
            - CV005
            - CV017
        - label: IPO 窗口
          value: 4
