      - number: '8.3'
        title: 中国 AI 可比公司与 IPO 窗口
        blocks:
          - type: paragraph
            body: >-
              最有用的可比对象不是美国软件倍数，而是 2026 年香港 AI 上市参照和中国后期模型实验室融资轮。Zhipu/Z.AI 与 MiniMax 提供公开市场类比，Moonshot
              提供私募估值类比。关键信号是，香港投资者愿意给稀缺 AI 上市公司很大的市值：StockAnalysis 显示，Z.AI 在 2026 年 7 月 20 日约 HK$397 billion，4 月 30 日约
              HK$386.99 billion；MiniMax 5 月 14 日约 HK$266.59 billion，之后到 7 月 20 日跌至约 HK$60.56 billion。波动性很关键：同一组可比公司既支持
              IPO 需求的乐观情景，也支持上市后估值压缩的悲观情景。Moonshot 据报道 $20 billion 至 $30 billion 的私募标记说明，StepStar 的 $10 billion 至 $12
              billion IPO 目标在中国前沿实验室语境下并不荒唐；但可比表也表明，市值可能跑赢已披露收入，然后迅速修正。
