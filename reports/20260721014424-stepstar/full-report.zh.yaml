  - id: FV004
    title: 中国 AI 可比公司矩阵
    type: matrix
    layout: wide
    summary: 可比公司显示，IPO 稀缺性上行空间与上市后压缩风险之间差距很大。
    data:
      columns:
        - 估值标记
        - 流动性
        - StepStar 启示
        - 风险信号
      rows:
        - label: Z.AI / Zhipu
          values:
            - HK$386.99B-HK$397.02B 观测市值标记
            - 上市
            - 显示香港市场可以给中国模型实验室定出远高于 StepStar 报道目标的市值。
            - 股价波动仍是变量。
        - label: MiniMax
          values:
            - May 估值标记 HK$266.59B，但 July 20 降至 HK$60.56B
            - 上市
            - 显示同一个 IPO 窗口也会急剧反转。
            - 上市后估值压缩可能很重。
        - label: Moonshot
          values:
            - $20B-$30B 报道私募估值区间
            - 未上市
            - 支撑中国前沿模型实验室估值超过 $10B 的可能性。
            - 私募估值缺少公开市场流动性。
        - label: StepStar 较低 Pre-IPO 报道
          values:
            - $4B-$6B 报道批次估值标记
            - 未上市 / 计划 IPO
            - 如果公开市场投资者打折，这给出悲观 / 基准重置区间。
            - 媒体估值标记彼此冲突。
        - label: StepStar 高 IPO 报道
          values:
            - $10B-$12B / 接近 RMB90B 的传闻
            - 计划 IPO
            - 给出乐观目标，但只有申报文件证据能验证。
            - 缺少申报文件证据。
    approximationNotes: 矩阵条目是筛选后的估值标记，不是标准化倍数。
    claimRefs:
      - CV006
      - CV008
      - CV011
      - CV012
      - CV013
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
