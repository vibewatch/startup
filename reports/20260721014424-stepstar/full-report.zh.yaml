companyProfile:
  summary: >-
    StepStar 以 StepFun（阶跃星辰）为品牌，注册主体为 Shanghai Jieyue Xingchen Intelligent Technology Co., Ltd.，是一家中国 AI 基础模型公司。公司由前
    Microsoft 全球副总裁 Jiang Daxin 于 2023 年 4 月 6 日创立，技术联合创始人为 Zhu Yibo 和 Jiao Binxing。公司开发大语言与多模态模型，包括万亿参数 Step-2 MoE 模型和
    321B 参数 Step-3 多模态模型，同时推进 StepAI 智能体平台和 STEPX「AI + 终端」设备战略。市场通常把它归入中国基础模型创业公司的「大六家 / AI 六小虎」。公司在 2024 年 12 月以约 $1
    billion 估值完成 Series B，并在 2026 年 1 月完成超过 RMB5 billion（~$717M）的 Series B+，同时准备 2026 年赴港
    IPO。详细财务数据——收入、利润率、烧钱速度、客户数量——尚未公开披露。
