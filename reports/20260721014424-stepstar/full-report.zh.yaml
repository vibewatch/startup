      - number: '8.4'
        title: 下行触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              反向情景很直接：中国 AI 估值可能被资本稀缺、国家冠军叙事和 IPO 稀缺性拉动，跑得比基本面追赶更快。反向来源警告，算力成本、token 配给，以及相对收入 /
              盈利能力的高估值，可能把当前周期推成类似泡沫的结构。对 StepStar，具体的降轮或 IPO 破发风险包括：重组或备案审核耗时超预期，导致 HKEX
              时间表滑坡；招股书显示收入或亏损显著弱于媒体估计；公开市场投资者给私募或基石价格打折；MiniMax
              式波动削弱下一单上市的需求；或者优先股条款过重，使头部估值不能很好代表普通股价值。因此，决定性尽调问题必须具体：已提交招股书、经审计收入、毛利率、算力承诺、客户集中度、股权结构表、清算优先权以及锁定期 /
              老股出售结构。在这些材料可得之前，建议维持继续研究 / 观察，估值立场偏高。
