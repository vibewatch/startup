      - number: '2.3'
        title: 买方分散在企业平台、开发者、消费者、政府和设备伙伴之间
        blocks:
          - type: paragraph
            body: >-
              StepStar 面向的不是单一买方画像。企业需要私有数据锚定、工作流智能体、合规和集成时，预算可能来自 CIO、CTO、数字化转型、业务部门或 AI 平台团队。开发者和创业公司通过 API 平台购买或试用，每
              token 低价、长上下文、SDK 兼容性和模型路由器位置决定份额。消费者使用通常通过应用、手机 OEM、内容产品或订阅间接付费，而不是直接收到基础模型账单。政府和国企买方在中国是独立付款群体，因为国家 AI+
              政策明确鼓励公共服务和产业落地。设备和汽车伙伴也是一条路径，因为 StepStar 宣传消费电子和智能汽车方案；在这条路径上，用户可能从不知道底层模型来自 StepStar。因此，采用路径从能力证明和免费
              token，走向开发者使用、企业试点、集成、治理审查和规模化生产。关键门槛是预算所有者是否清晰、模型切换成本多高、数据控制要求多强，以及 StepStar 是否嵌入了能把使用转成付费经常性需求的渠道。
