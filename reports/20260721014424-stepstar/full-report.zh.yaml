  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 由于官方披露不足以计算常规倍数，情景估值区间统一以 USD billions 表示。
    data:
      items:
        - label: 悲观：IPO 破局 / 申报文件疲弱
          low: 4
          base: 5
          high: 6
          unit: USD billions
          detail: 如果证据不达预期，估值回到较低 Pre-IPO 标记。
          claimRefs:
            - CV006
            - CV039
            - CV041
        - label: 基准：IPO 通过，但最高传闻打折
          low: 8
          base: 9
          high: 10
          unit: USD billions
          detail: 把战略需求与冲突估值标记折中处理。
          claimRefs:
