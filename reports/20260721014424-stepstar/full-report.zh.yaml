    rows:
      - - StepStar / StepFun
        - Shanghai Jieyue Xingchen / StepFun
        - 多模态基础模型创业公司
        - 独角兽；据报道 2026 年 B+ 轮融资超过 5B RMB，并有 IPO 估值目标报道
        - Step3 多模态 MoE，加上 STEPX Neo 智能体手机 / 终端策略
        - 公开模型检查点和兼容 API；公开企业包装细节较薄
        - 终端差异化逻辑可信，但据报道 API 份额小于领先者
      - - DeepSeek
        - DeepSeek
        - 低成本开放推理实验室
        - 私营公司；全球冲击力比披露融资更显眼
        - R1 推理模型，以及带 1M 上下文定价页的低成本 API
        - 开源模型并公开 API 价格
        - 压低 StepStar 定价，并让内部自建更容易
      - - Moonshot / Kimi
        - Moonshot AI
        - 长上下文与智能体模型创业公司
        - 公开公司资料显示其获得大量私募融资
        - Kimi K 系列、百万 token 上下文，聚焦编码和知识工作
        - 基于 token 的 Kimi API 定价，以及 Kimi K2 模型发布
        - 在智能体知识工作上与 StepStar 高度重合
      - - Zhipu / GLM / Z.ai 体系
        - Zhipu AI
        - 企业 / 开放模型实验室
        - 公开资料称其完成大额私募轮，并有 IPO 讨论
        - GLM 智能体推理 / 编码模型，以及 BigModel / Z.ai 平台
        - MIT 许可 GLM 模型和 API 平台
        - 对自托管买方更具宽松许可优势
      - - MiniMax
        - MiniMax Group
        - 多模态与智能体模型创业公司
        - 公开资料和市场报道将其列为中国主要 AI 创业公司之一
        - M3、M1、视频、语音、音乐、编码智能体，以及 1M 上下文主张
        - 开放权重 M1 模型卡，加上 API / 聊天机器人入口
        - 在长上下文和多模态智能体上直接竞争
      - - Baichuan
        - Baichuan Intelligence
        - 垂直化模型 / 应用公司
        - 公开资料称其为 Wang Xiaochuan 创办的中国 AI 创业公司
        - Baixiaoyi 医疗 / 家庭健康助手和模型 API
        - API 文档可用；可见切入点是医疗健康
        - 作为广义前沿威胁较弱，但在健康垂直领域更清晰
      - - ByteDance / Doubao
        - ByteDance
        - 消费级与多模态既有巨头
        - 背靠 ByteDance 分发，而非风险融资信号
        - Doubao 聊天机器人 / 产品族，以及创意 / 多模态用例
        - 在已审阅来源中，定价不是主要公开切入点
        - 消费端分发规模可能碾压创业公司声量
      - - Alibaba / Qwen
        - Alibaba Cloud
        - 开放权重与云既有巨头
        - 上市公司云生态，而非创业融资
        - Qwen3 开放模型、Model Studio、多模态模型、企业部署
        - 大量开放权重，加上云端定价 / 部署
        - 设定开放性和企业分发基准
      - - Baidu / ERNIE
        - Baidu AI Cloud
        - 云既有巨头模型平台
        - 上市公司既有巨头
        - Qianfan / Wenxin 一站式企业大模型平台
        - 云平台包装；此处未完整提取定价
        - 借既有企业采购通道竞争
      - - Tencent / Hunyuan
        - Tencent Cloud
        - 云 / 内容既有巨头模型平台
        - 上市公司既有巨头
        - Hunyuan MoE、256K 上下文、搜索 / 内容生态集成
        - Tencent Cloud 平台包装
        - 借生态捆绑和内容访问竞争
    notes: 列举范围覆盖章节简报明确要求的中国供应商以及 StepStar 本身；规模和融资单元格使用公开信号，而非经审计的私营资本数据。
