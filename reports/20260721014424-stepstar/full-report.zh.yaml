  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - HKEX 申报顺利落地，收入估计得到验证，终端 / 汽车 / API 部署转化为持久收入，可比公司保持强势。
        - $12B+ IPO 定价可以通过；只有官方财务和簿记质量都强，近 RMB90B 区间才撑得住。
        - 在申报收入、亏损和投资者锁定结构可见前，概率较低。
      - - 基准
        - IPO 进程继续，但最终区间落在近期私募标记与最激进头条之间。
        - 约 $8B-$10B 是工作区间；投资者回报取决于能否避开 MiniMax 式上市后压缩。
        - 最可能，因为它调和了战略需求和冲突的公开标记。
      - - 悲观
        - 申报延误、收入不及预期、算力成本压力、公开市场可比公司走弱，或重优先权条款浮现。
        - 下轮降价或破发式 IPO 重置到 $4B-$6B 变得合理，与早前 Pre-IPO 报道吻合。
        - 概率偏高，因为公开市场可比公司波动大，官方招股书仍缺席。
      - - 止损 / 投资逻辑破裂
        - 没有已提交招股书、财务披露差，或估值在缺乏证据下定在 $12B 以上。
        - 除非大幅低价或保护性条款抵消证据缺口，否则避免投新钱。
        - 如果稀缺性溢价在基本面追上前消退，下行会是二元式。
    notes: 除非行明确提到 RMB，否则区间都是以十亿美元计的情景包络；由于官方收入和利润率未披露，它们不是 DCF 输出。
