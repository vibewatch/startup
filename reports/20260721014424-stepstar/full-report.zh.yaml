              StepFun 的使用路径先面向开发者，也先面向智能体。Open Platform 和 API 参考文档记录了 chat-completion 调用、兼容 OpenAI 的迁移、按 token
              计费、速率限制和分模型定价。Step Plan 为使用 OpenClaw、Claude Code、Trae、Cursor 等编码和智能体平台的开发者增加了一层订阅。开放模型侧，Step-3 出现在 GitHub
