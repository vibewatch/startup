- id: buyers-users-payers-and-adoption-path
  title: Buyers split between enterprise platforms, developers, consumers, government, and device partners
  body: StepStar's market is not a single buyer persona. Enterprises buy through CIO, CTO, digital-transformation, business-unit, or AI-platform budgets when they need private data grounding, workflow agents, compliance, and integration. Developers and startups buy or try through API platforms, where low per-token pricing, long context, SDK compatibility, and model-router placement determine share. Consumer usage is usually paid indirectly through apps, phone OEMs, content products, or subscriptions rather than a direct foundation-model invoice. Government and state-enterprise buyers are a distinct payer segment in China because national AI+ policy explicitly encourages deployment across public services and industry. Device and automotive partners are another route because StepStar advertises consumer-electronics and smart-vehicle solutions; in this path the user may never know StepStar is the underlying model. Adoption therefore runs from proof-of-capability and free tokens to developer
    usage, enterprise pilot, integration, governance review, and scaled production. The gating questions are budget owner clarity, model switching cost, data-control requirements, and whether StepStar is embedded in a channel that can convert usage into paid recurring demand.
  claimRefs:
  - CM017
