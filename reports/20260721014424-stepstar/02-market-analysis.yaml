callouts:
- calloutType: insight
  title: Market is large, but market definition drives valuation more than headline TAM
  body: The same China opportunity can be described as a few billion dollars of GenAI revenue, roughly $7 billion of large-model spend, $28-31 billion of broad AI revenue, or $62 billion of broad AI activity. StepStar diligence should therefore underwrite share of paid model/application workloads, not broad AI GDP analogies.
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM011
- calloutType: risk
  title: Usage growth can coexist with weak pricing power
  body: China token volume, open-source model supply, and low official API prices all point to faster adoption, but they also reduce willingness to pay for undifferentiated model endpoints. Distribution and workflow lock-in matter more than raw token counts.
  claimRefs:
  - CM026
  - CM027
  - CM030
  - CM032
  - CM033
