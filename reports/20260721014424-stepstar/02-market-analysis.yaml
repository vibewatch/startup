- id: drivers-constraints-and-market-verdict
  title: Token growth and policy support are real, but pricing, compute, and trust constrain value capture
  body: 'The strongest market driver is that China''s model usage appears to have crossed from demos into high-volume deployment: Digital in Asia reports 140 trillion daily AI tokens by March 2026, and DigitalApplied reports Chinese providers taking more than 45% of OpenRouter traffic in Q2 2026. Government policy is also a tailwind: the State Council''s AI+ opinion pushes adoption across sectors, while Axis cites national and guidance-fund capital that private-investment totals understate. Enterprise demand is moving from pilots to production globally, with Deloitte reporting 50% growth in worker AI access and McKinsey warning that AI can consume up to a third of change budgets. The same evidence also defines the constraints. DeepSeek''s official pricing shows very low token prices, AWS and Azure normalize model routing and multi-provider choice, Qwen and DeepSeek open weights make capability more substitutable, and China-specific regulation adds security reviews, real-name obligations,
    labeling, and content-control risk. The market verdict is therefore positive on usage and policy, mixed on revenue quality, and adverse for undifferentiated model APIs. StepStar needs distribution, vertical integration, or agent workflow control to convert China AI growth into defensible revenue.'
