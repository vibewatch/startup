company:
  name: StepStar
chapter:
  number: 2
  title: Market Analysis
  summary: StepStar sits inside a fast-growing but hard-to-size China foundation-model market where narrow generative-AI revenue lenses, China large-model revenue, broad AI spend, and global LLM forecasts disagree by an order of magnitude. The strongest market case is demand pull from enterprise agents, developers, government AI+ policy, consumer-device distribution, and token growth; the main constraint is that open-source models, very low API pricing, chip limits, regulation, and trust requirements can turn usage growth into compressed margins rather than durable revenue.
sections:
- id: market-boundary-and-substitutes
  title: 'Market boundary: StepStar sells model capability, not the entire AI economy'
  body: 'The correct market boundary for StepStar is the China-centered foundation-model and generative-AI stack, not the full artificial-intelligence economy and not only consumer chat. StepStar''s own platform describes a production Agent-oriented Step 3.7 Flash model, a no-code model experience center, API use, and vertical solutions for consumer electronics, content creation, smart vehicles, local services, finance, manufacturing, gaming, and government. That puts the included market across four monetization surfaces: MaaS/API model consumption, enterprise private or managed deployment, consumer-device and app integrations, and government or state-enterprise digital services. Excluded spend should be generic cloud capacity with no AI workload, legacy analytics, non-AI SaaS, and unmonetized open-source experimentation. The substitute set is unusually broad because a buyer can choose DeepSeek, Qwen, Doubao, GLM, global API platforms, open-weight local deployment, or hyperscaler model routers
    rather than a StepStar endpoint. This boundary matters because the market can be large while StepStar''s monetizable pool is only the slice where Chinese buyers pay for capability, latency, compliance, integration, or distribution rather than free open weights.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM035
  - CM036
  - CM037
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sizing-lenses-and-contradictions
  title: Sizing estimates are directionally bullish but numerically incompatible
  body: 'The sizing story is attractive but messy. A narrow Grand View / Horizon country page says China generative AI should reach $17.6 billion by 2030 at a 39.1% CAGR, while MarketsandMarkets puts China''s 2025 generative-AI market at $7.0 billion and its 2030 forecast near $98.8 billion at 45.8% CAGR. Tianxia Gongchang''s China large-model lens is close to that 2025 number at roughly RMB49.5-51.0 billion, but broadens to RMB100-130 billion when AI-enabled software is included. Axis Intelligence, using a broader China AI revenue definition, places 2025 around $28-31 billion and cites a still-broader IDC-style activity proxy around $62 billion. Global context is similarly inconsistent: Gartner sees $2.596 trillion of AI spend in 2026 dominated by infrastructure, while LLM-specific forecasts from Grand View, Precedence, and MarketsandMarkets cluster in the single-digit to tens-of-billions range. The diligence conclusion is not to average these numbers. For StepStar, TAM is China and global
    foundation-model demand; SAM is Chinese MaaS, private deployment, AI app, and device/government solution spend; SOM depends on pricing power, distribution, and workload share that public sources do not isolate.'
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
