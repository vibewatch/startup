  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance for StepStar
  rows:
  - - Foundation-model MaaS / API
    - Per-token text, multimodal, reasoning, embedding, tool-use, and agent API consumption
    - Unpaid open-source experimentation and non-AI API usage
    - Developers, startups, AI platform teams
    - Directly comparable to StepFun platform/API and DeepSeek/Qwen price benchmarks
  - - Enterprise private or managed deployment
    - Private model deployment, RAG, workflow agents, data connectors, governance, and support
    - Generic IT consulting without foundation-model workload
    - CIO, CTO, business-unit or AI-platform budget
    - Largest credible B2B monetization path if StepStar proves reliability and compliance
  - - Consumer AI applications
    - Chat, search, creation, education, companion, entertainment, and app subscriptions powered by models
    - Ad-supported traffic with no model revenue share
    - Consumer app owners and subscription users
    - Relevant if StepStar wins app distribution or becomes embedded in consumer products
  - - Device and automotive AI
    - On-device assistants, multimodal search, cockpit, phone, PC, and smart-hardware integrations
    - Commodity device sales without AI model license
    - OEM product teams and strategic partners
    - StepFun platform lists consumer electronics and smart-vehicle solutions
  - - Government and state-enterprise AI+
    - Public-service assistants, city operations, legal consultation, industrial AI, and state-sector procurement
    - General e-government software with no LLM layer
    - Government bureaus, SOEs, state-backed funds
    - Policy can create demand but raises compliance and procurement complexity
  - - Status-quo substitutes
    - DeepSeek, Qwen, GLM, Doubao, Kimi, global APIs, hyperscaler routing, local open weights
    - Non-AI search or legacy analytics only
    - Developers, enterprises, platform owners
    - Creates pricing pressure and lowers switching costs for generic model access
  notes: Boundary separates monetizable model/application workloads from broad AI infrastructure and unmonetized open-weight usage; categories are overlapping, so totals should not be summed.
