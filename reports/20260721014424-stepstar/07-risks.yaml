- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, monitoring indicators, and kill criteria
  body: 'None of the visible risks is individually fatal today, but the residual stack is high because several risk channels
    reinforce each other. Regulatory compliance affects product launch pace; product launch pace affects enterprise and device
    monetization; monetization affects IPO readiness; and IPO readiness affects the company’s ability to keep funding expensive
    compute and talent. Public mitigations exist: state-linked and industrial investors, StepFun’s legal pages, a broadened
    leadership team, and major device partners all reduce the odds that this is a thin vaporware story. They do not remove
    the need for private diligence. The thesis-break triggers should be concrete: missing or stale CAC filing and model-display
    evidence, weak AI-content-labeling implementation, no clear compute contingency, no gross-margin path under DeepSeek-style
    price pressure, unresolved red-chip or share-reform issues, or departures from the core technical leadership team before
    listing.'
