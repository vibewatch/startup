    - Review share reform, CSRC/HKEX counsel memo, tax effects, investor consent, and filing timetable
  - - Indirect sanctions or entity-list exposure
    - Geopolitical / legal
    - Low-Medium
    - High
    - US chip and Chinese AI policy reporting shows rapid controls and entity-list queue risk even when StepFun is not named
    - Monitor BIS/entity-list changes, customer geography, investor exposure, and U.S.-origin technology dependencies
