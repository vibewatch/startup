    - Verify StepFun model filings, product-page displays, and material-change filing process
  - - AI-generated content labeling non-compliance
    - Regulatory / legal
    - Medium
    - High
    - GB 45438-2025 and labeling measures require explicit and implicit labels
    - Review visible labels, metadata/watermarking design, download retention, and platform propagation controls
  - - Deep-synthesis governance gap
    - Regulatory
    - Medium
    - Medium-High
    - Deep-synthesis rules require user registration, algorithm review, ethics review, content review, and emergency response
    - Request internal safety-management制度, abuse-response logs, and regulator correspondence
  - - AI-agent autonomy governance gap
    - Regulatory / product
    - Medium
    - High
    - 2026 agent framework treats autonomous perception, memory, decision, interaction, and execution as a distinct policy
      class
    - Map StepFun agent features to user-authorization, human-control, tool-use, and audit requirements
  - - Privacy and customer-content handling risk
    - Legal / data
    - Medium
    - Medium-High
    - StepFun privacy policy covers user inputs, outputs, enterprise information, API keys, payments, devices, and logs
    - Review PIPL basis, retention, deletion, training-use policy, and enterprise DPA terms
  - - Terms are baseline hygiene, not enterprise compliance proof
    - Legal / commercial
    - High
    - Medium
    - StepFun publishes ToS, limitation-of-liability, and arbitration language
