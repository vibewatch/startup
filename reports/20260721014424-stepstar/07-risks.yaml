- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Generative-AI compliance
    - CAC filing and display evidence
    - Missing model filing number or stale display for public-facing product
    - Pause product-risk underwriting until filings are documented
  - - Labeling and deep-synthesis controls
    - AI labels, metadata, and abuse logs
    - No explicit/implicit labels on generated content after GB 45438-2025 effective date
    - Treat regulated launch readiness as unproven
  - - Compute supply
    - Chip access and domestic migration proof
    - No credible H200/domestic capacity plan or rising cost-per-token under load
    - Increase burn and execution-risk discount
  - - Price-war monetization
    - Gross margin and paid usage cohort
    - API/device revenue grows but unit economics worsen under DeepSeek/Qwen price cuts
    - Require lower entry price or wait for proof
  - - Partner concentration
    - OEM and industrial partner economics
    - Device installs do not convert to paid or retained usage across multiple partners
    - Downgrade customer and channel thesis
  - - IPO execution
    - HK filing, share reform, audit, and valuation range
    - Red-chip or CSRC/HKEX issues delay filing beyond the next expected window
    - Treat liquidity and valuation narrative as impaired
  - - Key-person and leadership
    - Founder/chair/CTO retention and governance
    - Departure or role conflict among core leaders before IPO readiness
    - Escalate to thesis-break review
  notes: Kill criteria are diligence thresholds, not company guidance; thresholds should be revisited when private financial
    and filing materials are available.
