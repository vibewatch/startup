company:
  name: StepStar
chapter:
  number: 7
  title: Risks
  summary: 'StepStar / StepFun’s risk profile is high but not yet disqualifying: the most material exposures are China AI
    compliance, red-chip/Hong Kong IPO execution, GPU supply under U.S.-China controls, DeepSeek-led price compression, hardware-partner
    concentration, and founder-led execution. Public mitigants exist — state and industrial backers, device distribution,
    published legal pages, and a broader leadership bench — but several adverse sources point to unproven monetization, restructuring
    friction, and a crowded Chinese model market.'
sections:
- id: regulatory-ipo-and-legal
  title: Regulatory, IPO, and legal-structure risk
  body: 'StepFun’s risk stack starts with regulation because the company is not merely selling ordinary software; it is operating
    in one of the most actively supervised AI regimes in the world. China’s generative-AI rules, current CAC filing announcements,
    deep-synthesis provisions, and the national AI-content-labeling standard create a live operating checklist for any public-facing
    model, API, agent, or device surface. StepFun’s own legal pages show baseline terms and privacy disclosures, but they
    do not prove completion of model filings, labeling implementation, safety audits, or enterprise-control readiness. The
    IPO layer compounds this: Reuters-republished reporting says the company unwound an offshore structure amid Beijing scrutiny
    of red-chip listings, while other sources describe share reform and Hong Kong IPO preparation. That does not mean a listing
    is blocked, but it makes legal execution a high-impact path dependency rather than an administrative detail.'
