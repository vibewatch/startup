companyProfile:
  summary: >-
    Netskope, founded in 2012 in Los Altos, California by Sanjay Beri and Krishna Narayanaswamy, is the developer of the
    Netskope One SASE platform and the NewEdge private cloud network. By Q2 FY2027 the company was reporting $899
    million ARR, 29% year-over-year revenue growth, 74% gross margin, and continued launches across AI security, data
    security, and platform analytics.
  foundedDate: '2012-01-01'
  founders:
    - name: Sanjay Beri
      role: CEO and Co-Founder
      background: >-
        Previously VP of Products at Juniper Networks and senior roles at Cisco and Oracle; 15+ years in networking and
        security.
    - name: Krishna Narayanaswamy
      role: CTO and Co-Founder
      background: >-
        Former Distinguished Engineer at Juniper Networks; deep expertise in SSL/TLS inspection and inline traffic
        processing architectures.
  foundingLocation: Los Altos, CA, USA
  headquarters: Santa Clara, CA, USA
  productSummary: >-
    Netskope One platform: CASB, SWG, ZTNA (Private Access), AI-native DLP, Cloud Firewall, SD-WAN (via Infiot
    acquisition), and AgentSkope AI agent security. Delivered via 50+ owned NewEdge PoPs with sub-10 ms latency SLA in
    major metros. FedRAMP High authorized.
  customerFocus: >-
    Large enterprises and government agencies; ~1/3 of the Fortune 100 are customers; strongest in financial services,
    healthcare, manufacturing, and public sector.
  businessModel: >-
    Subscription SaaS; annual and multi-year contracts; sold primarily through channel partners (95.3% of FY2026 revenue
    through indirect channel — VARs, MSSPs, and system integrators).
  stage: 'Public (Nasdaq: NTSK, IPO November 2025)'
  fundingStatus: >-
