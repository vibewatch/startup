        - id: n2
          label: 年经常性收入（ARR）
          detail: 截至 2025 年 7 月 31 日 ARR 达 $707M；从 $531M 同比增长 33%；客户数 4,317 家
        - id: n3
          label: GAAP 收入确认
          detail: 在订阅期内按比例分摊确认；FY2025 为 $538.3M；H1 FY2026 为 $328.5M（同比增长 31%）
        - id: n4
          label: 毛利润
          detail: H1 FY2026：$232.8M，毛利率 70.9%；FY2025：$347.9M，毛利率 64.6%；盈利水平快速改善
        - id: n5
          label: NRR 扩张闭环
          detail: NRR 达 118%——存量客户 ARR 年净增 18%；客户通过增购更高阶模块扩大 ARR
        - id: n6
          label: IDC TAM 市场空间
          detail: TAM 到 2028 年按 16.8% CAGR 达 $138.9B；AI 安全细分 TAM 到 2028 年达 $30.8B；增长空间充足
      edges:
