  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与 NewEdge 网络
        blocks:
          - type: paragraph
            body: >-
              Netskope One 是一套围绕三大架构支柱构建的云原生安全平台：NewEdge 网络、Zero Trust Engine 与统一产品套件。NewEdge 是 Netskope 专有的全球云网络，拥有 50+
              个接入点（PoP），完全由 Netskope 自建——而非从第三方 CDN 租用——并通过私有对等互联直连主流 SaaS 服务商。这使得企业端点流量能够直达 Microsoft 365、Google
              Workspace、Salesforce、AWS 和 Azure，在安全检测节点与应用程序之间无需途经公共互联网。Zero Trust Engine
              在单通道在线云代理中完成全部安全检测——CASB、SWG、ZTNA、DLP
              及威胁防护——并在各项策略裁决中持续保留上下文信息（用户身份、设备健康状况、云服务种类、行为类型及数据内容）。整套架构仅以云服务形式交付；无需部署亦不售卖任何硬件设备。
