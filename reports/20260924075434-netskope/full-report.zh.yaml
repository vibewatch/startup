      - number: '4.3'
        title: 成本结构与毛利率画像
        blocks:
          - type: paragraph
            body: >-
              毛利率持续扩张是 Netskope S-1 招股书中最引人注目的财务趋势。毛利率从 FY2024 的 59.8% 提升至 FY2025 的 64.6%，并在 H1 FY2026 达到 70.9%——在约 18
              个月内跃升了超过 1,100 个基点。这一向好态势得益于 NewEdge 私有网络（全球 120+ 个 PoP）的规模杠杆效应；随着 ARR 增长，庞大订阅客群有效摊薄了固定基础设施成本。逼近 70%+
              的毛利率梯队，使 Netskope 得以比肩 Zscaler 79% 的毛利率水平，确立了成熟的 SaaS 基础设施混合架构定位。

              FY2025 运营费用总计 $603.6 million（占收入的 112%），对应毛利为 $347.9M，产生 $(255.7M) 的营业亏损，营业利润率为 -47.5%。H1 FY2026 运营费用为
              $324.1M，对应毛利 $232.8M，产生 $(91.3M) 的营业亏损，营业利润率为 -27.8%——一年内改善了 20 个百分点。Non-GAAP 营业亏损（主要剔除股权激励费用）从 H1 FY2025
              的 $(123M) 收窄至 H1 FY2026 的 $(63M)，减亏 49%。近五个季度的边际 Non-GAAP 营业利润率分别为 12%、72%、72%、100% 和
              58%，表明边际新增收入目前已具备极高盈利能力。股权激励支出呈现逐年下降趋势：FY2024 为 $61.0M，FY2025 为 $50.8M，H1 FY2026 为 $17.6M。
