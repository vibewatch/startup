      - number: '5.4'
        title: 技术壁垒与知识产权
        blocks:
          - type: paragraph
            body: >-
              Netskope 的核心技术壁垒在于自建 NewEdge 基础设施与单通道流量检测架构。自建并掌控 50+ 个直连超大规模云厂商的全球分布式 PoP 需要巨额资本投入，多数竞品难以企及；S-1
              显示公司多年来保持高资本开支强度（直到 H1 FY2026 自由现金流才摆脱深度负值），部分原因正是该网络基础设施投资所致。单通道 Zero Trust Engine
              与多次重复检测流量而导致高网络延迟的传统多设备堆叠架构形成鲜明对比。搭载 OCR 技术的机器学习 DLP 以及包含 70,000 款应用的云端目录，构成了其依托十二年云应用遥测数据积累的专有数据资产。针对
              Agentic AI 治理推出的 AgentSkope 产品（2025 年 2 月上线）将 Zero Trust Engine 延展至 AI Agent 工作负载，确立了 Netskope
              在该领域的先发优势。GitHub 上的 netskopeoss 开源组织维护着 49 个公开代码仓库，涵盖用于平台配置的 Terraform Provider 以及收获 157 颗星标的公开威胁情报 IOC
              源，展现出生机勃勃的开发者生态。
