    rows:
      - - NewEdge 网络（50+ 个 PoP 点）
        - 用于流量引流与内联检测的全球云网络；自主建设与自持运营
        - 数据中心托管机房、IXP 成员节点、与超大规模云厂商建立私有对等互联
        - PoP 节点可用性中断将影响全线 SSE 服务；未公开发布 SLA 基准测试数据
      - - Zero Trust Engine
        - 单通道上下文感知策略执行引擎，综合评估身份、设备、应用、行为与数据
        - 身份提供商（AD、Okta、SAML）；云应用目录；威胁情报源
        - 策略复杂度可能增加延迟；新增云服务或应用更新时易出现误报
      - - Netskope Client（AgentSkope 终端代理）
        - 将设备流量路由至最近的 NewEdge PoP 点；调用本地证书执行 TLS 解密审查
        - 操作系统级网络 API；依托企业 MDM 进行分发；依赖证书信任链
        - 用户反馈操作系统更新偶现兼容性回退；部分应用存在证书固定绕过风险
      - - Cloud Exchange (CE) 集成平台
        - 开放插件框架，支持与 SIEM、SOAR、XDR 及威胁情报工具双向交换数据
        - 第三方厂商 API（Splunk、CrowdStrike、Palo Alto Networks 等）；GitHub 开源插件代码库
        - 插件质量良莠不齐；社区维护插件更新可能滞后于厂商 API 变更
      - - Netskope Threat Research Labs / IOC 威胁情报源
        - 基于数百万企业用户的云端与 Web 遥测数据自研威胁情报
        - 来自 NewEdge 的网络遥测数据；外部威胁情报合作生态
        - 威胁情报时效性依赖客户基数规模；网络覆盖面小于 Zscaler 或 Palo Alto Networks
    notes: >-
