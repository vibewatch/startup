        - 若员工监控策略存在缺陷，面临企业客户民事索赔；根据 GDPR 第 88 条（员工数据）面临欧盟监管审查
        - 审查产品级同意/绕过文档；确认客户可接受使用策略（AUP）涵盖员工监控；针对受监管应用类别测试绕过策略
      - - 出口管制——EAR / TLS 检查技术军民两用风险
        - 美国（联邦）、英国、欧盟
        - 潜在——未披露执法行动；技术审查中
        - 低
        - 中
        - 就产品归类开展法律审查；未披露出口合规问题；采用标准企业软件许可
        - TLS 检查若被定性为军民两用，可能限制受制裁法域的销售；出口许可证要求将增加业务摩擦
