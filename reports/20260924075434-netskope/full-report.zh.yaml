  - id: TM004
    title: 增长驱动与制约因素表
    columns:
      - 驱动 / 制约因素
      - 作用方向
      - 发生时间
      - 对 Netskope 的影响
      - 尽调核实要点
    rows:
      - - 上云迁移与 SaaS 应用激增
        - 增长驱动
        - 当下，持续至 2030 年
        - 驱动 CASB 与 SWG 需求的核心因素；每新增一项云部署，都会留下 Netskope 可填补的安全缺口
        - 将企业云支出作为先行指标；比较 AWS/Azure 营收增速与 Netskope ARR 增速
      - - 混合与远程办公常态化
        - 增长驱动
        - 当下，结构性
        - 传统网络边界不再适用；ZTNA 需求具有结构性且持续产生，不是一次性采购
        - 测算 ZTNA ARR 占总收入比重；跟踪存量客户的增购情况
      - - 监管指令（NIS2、DORA、美国零信任行政令、HIPAA/PCI-DSS）
        - 增长驱动
        - 2024–2026 年+（NIS2 与 DORA 现已生效）
        - 带来强制性的 DLP 和访问日志支出；加快受监管行业商机转化
        - 验证 Netskope 的 NIS2/DORA 合规认证及欧盟政府客户商机储备
      - - AI 驱动的安全功能
        - 增长驱动
        - 自 2025 年起加速
        - 在招标（RFP）中凸显 Netskope 平台差异；提高采用 AI 客户的切换成本
        - 对比 Zscaler/Palo Alto 的 AI 功能深度；核实 AI 功能是否带动客户留存
      - - 供应商整合压力（25+ 工具蔓延）
        - 增长驱动
        - 当下，跨多年
        - 覆盖完整 SASE 的平台更容易拿下整合项目，Netskope 因此受益，单点产品厂商则承压
        - 分别核算平台扩容订单和新客户（new logo）带来的 ARR
      - - 传统基础设施迁移复杂度
        - 采纳制约
        - 跨多年
        - 拉长销售周期、增加专业服务负担；分阶段部署也可能压缩订单规模
        - 查阅投资者披露中的平均销售周期长度及专业服务（PS）附加率
      - - 对单一厂商 SASE 供应商锁定的担忧
        - 采纳制约
        - 当下且持续存在
        - 企业可能更倾向采用多家厂商的 SSE + SD-WAN 组合；这会成为 SASE 竞标中的反对意见
        - 密切关注 Netskope 的生态合作策略；跟踪 OEM 与分销商渠道
      - - SASE 专业技能短缺与变革管理负担
        - 采纳制约
        - 结构性，持续至 2028 年+
        - 推高对 MSSP 托管交付的需求、增加净成本并压低直接自助服务收入；Cisco/Palo 也可能凭借既有装机基础受益
        - 考察 MSSP 合作伙伴生态规模；评估 Netskope 托管服务的可用性
    notes: >-
      驱动与制约因素依据 Wiz 2026 年 CISO 调查、Dell'Oro Group 2026 年预测、ETR 的 SASE 融合数据、Natilik 与 Jimber 的 SASE 行业分析，以及 Netskope
      S-1/A 风险因素。监管时间节点依据欧盟公开文件确认的生效日期：NIS2 于 2024 年 10 月生效，DORA 于 2025 年 1 月生效。
