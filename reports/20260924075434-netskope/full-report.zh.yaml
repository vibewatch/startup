          to: n2
          label: 获客投入
        - from: n2
          to: n3
          label: 沿平台层级向上增购
        - from: n3
          to: n4
          label: 遭客户流失部分抵消
        - from: n4
          to: n5
          label: 净留存 ARR × 生命周期
        - from: n2
          to: n6
          label: 回收期 = CAC / ACV
