      - number: '1.5'
        title: 核心里程碑
        blocks:
          - type: paragraph
            body: >-
              Netskope 自 2012 年创立以来，经历了多项融资、产品与治理里程碑。2013 年 10 月，公司结束隐身研发状态，推出首款公开商用的 CASB 产品；Enrique Salem
              亦于当月加入董事会。2017 年 7 月收购 Sift Security 补齐了 IaaS 云安全能力。NewEdge 网络基础设施于 2019 年 7 月正式上线。2020 年 2 月完成 G 轮融资并同步发布
              Private Access，借助疫情催生的远程办公需求加速增长。

              2021 年 7 月的 H 轮融资达到 $7.5 billion 估值，创下 IPO 前峰值。2023 年 1 月的可转债轮次维持了 $7.5 billion 估值，Goldman Sachs 与 Morgan
              Stanley 借此进入股权结构表。到 2025 年 8 月当月递交 S-1 前，二级市场数据显示隐含估值已下滑至约 $5.1 billion。IPO 于 2025 年 9 月 17 日以每股 $19 定价，9
              月 18 日挂牌交易，并在 9 月 22 日前完成全额超额配售，净筹资 $992.2 million。NTSK 目前在纳斯达克公开交易，面临季度业绩报告要求以及禁售期解禁（通常为 IPO 后 180 天，约
              2026 年 3 月）带来的结构性抛压。

              值得注意的负面信号包括联合创始人 Lebin Cheng 于 2018 年离职、2021 年至 2025 年中二级市场估值从 $7.5 billion 跌至约 $5.1 billion，以及截至 2026 年 5
              月 NTSK 股价比 IPO 发行价低约 44%。截至 runDate，公开渠道未确认 Netskope 发生针对性的大规模裁员。
