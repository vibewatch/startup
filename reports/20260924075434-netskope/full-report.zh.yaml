  - id: TM001
    title: 细分市场界定
    columns:
      - 细分市场
      - 纳入统计的 IT 支出
      - 排除在外的支出
      - 主要采购方 / 买单方
      - 与 Netskope 的相关性
    rows:
      - - SSE（安全服务边缘）核心市场
        - CASB、SWG、ZTNA、DLP、FWaaS——云交付安全服务
        - SD-WAN 路由、网络硬件、终端安全、SIEM
        - CISO / IT 安全团队 + 财务部门
        - 直接面向的核心市场；Netskope One SSE 是主打产品
      - - 完整 SASE（SSE + SD-WAN）
        - 全部 SSE 加上云管 SD-WAN、分支互联
        - 终端安全、IAM、邮件安全、SIEM
        - CISO + 网络运维 + CIO + 财务部门
        - Netskope One SD-WAN 切入该市场；与 Cato、Cisco、Zscaler 竞争
      - - 广义零信任（Zero Trust）
        - 以身份为中心的安全访问：ZTA、微隔离、PAM、ZTNA
        - 终端安全、网络硬件、SIEM、EDR
        - CISO / CIO / IAM 团队
        - 部分覆盖：ZTNA 模块参与竞争；不覆盖 PAM 与微隔离
      - - 相邻领域（CSPM、AI 安全分析）
        - 云安全态势、AI/ML 驱动分析、数据风险
        - 终端、非云基础设施
        - CISO / 安全架构师
        - 部分覆盖：仅在边缘领域与 CSPM、Netskope Advanced Analytics 竞争
      - - 排除领域（现有替代品）
        - VPN 硬件设备、本地代理、硬件防火墙、MDM
        - 不属于 Netskope 可直接触达的市场
        - IT 运维 / 网络运维（现有买方）
        - 属于替换目标；替换 VPN 和代理是核心 GTM 动作
    notes: >-
      市场边界依据 Gartner 的 SASE/SSE 框架定义及 Netskope 产品文档划定；统计口径参考 MarketsandMarkets 与 Mordor Intelligence
      的方法说明。各细分领域的具体支出分配未见公开披露。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
