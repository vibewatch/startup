      - number: '7.5'
        title: 团队、执行与缓释措施
        blocks:
          - type: paragraph
            body: >-
              Netskope 的核心团队风险主要集中在两位联合创始人身上。首席执行官 Sanjay Beri 自创立起掌舵公司逾 15 年，在 IPO 后的关键扩张期，其离职将危及客户纽带、渠道信任及战略延续性。首席技术官
              Krishna Narayanaswamy 联合创立了 Netskope，主导包括 AgentSkope 在内的 AI/ML 产品架构，若其离任，将直接削弱 AI 安全差异化逻辑。2024 年 Teamblind
              论坛帖子提及 Netskope 实施裁员，符合 SaaS 厂商在 IPO
              后向盈利路径靠拢的常规举措，但具体规模未获官方证实。研发团队分布于湾区总部与班加罗尔研发中心，两地人才争夺均十分激烈。执行风险聚焦三大方面：一是中端市场拓展——Netskope 销售体系原针对财富 500
              强定制，但必须向 500 至 5,000 名员工规模的企业渗透以稳住 NRR；二是渠道管理——95.3% 的间接收入依赖持续的渠道赋能与利润空间调控；三是产品复杂度——业务战线从 SSE 延伸至完整
              SASE、AI 安全及 IoT/OT，需要严密的研发优先级管控。核心逻辑证伪指标包括：连续两个季度 NRR 跌破 110%；股价长期低于 $8（加剧转债或增发带来的稀释压力）；Beri 或
              Narayanaswamy 离职；丧失 FedRAMP High 资质；或依据 SEC 网络安全披露规则披露重大数据安全漏洞。
