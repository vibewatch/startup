      - number: '4.4'
        title: 资本充足率与债务结构
        blocks:
          - type: paragraph
            body: >-
              2025 年成功完成 IPO 后，Netskope 的资金面迎来实质性改观。截至 2025 年 7 月 31 日，IPO 前持有的现金、现金等价物及有价证券总额为 $261.4M。2025
              年在纳斯达克挂牌（股票代码：NTSK），按每股 $19 定价募资约 $908M，发行时隐含市值约为 $7.3B。上市首日开盘大涨，路透社报道其开盘价对应的隐含市值达到约 $9.5B。预计扣除承销费用后，备考
              IPO 现金储备增至约 $1.1B（包括 IPO 前的 $261.4M 加上约 $876M 的 IPO 净募资）。

              首要资产负债风险在于截至 2025 年 7 月 31 日仍有 $700.3M 的可转债流通在外。转股条款、到期日和票面利率虽在 S-1
              中披露，但公开摘要未完全明晰；该笔可转债构成重大的潜在股权稀释或现金兑付压力。截至 2025 年 7 月 31 日，累计亏损达到 $(2.119B)，IPO 前归属于母公司股东权益为负 $(612.1M)。IPO
              完成时，优先股（$1,050.6M）转为普通股，一定程度修复了股东赤字。关键在于自由现金流迎来历史性拐点：2026 财年上半年 FCF 为 $(2.2M)，已极度逼近盈亏平衡线，相比之下 2025 财年上半年为
              $(126.5M)，2025 全财年为 $(151.1M)。在当前运营节奏下，约 $1.1B 的 IPO 后现金储备意味着公司几乎没有资金跑道之忧。
