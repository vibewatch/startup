  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与评级建议
        blocks:
          - type: paragraph
            body: >-
              Netskope 的投资逻辑有四大支柱：(1) 串联代理 SSE 架构领先，并获得大多数竞争对手难以企及的 FedRAMP High 授权，在联邦政府领域筑起护城河；(2) 大型企业渗透力强，财富 100
              强中约三分之一为其客户，ARR 超 $100K 的客户数达 1,531 家，贡献了 86% 的 ARR；(3) 业务增长稳健，FY2026 收入同比增长 32% 至 $709.1M，116% 的 NRR
              表明存量客户具备良好的增购与交叉销售动能；(4) 依托 AgentSkope 发力 AI 安全，瞄准高速增长的 GenAI 治理需求。但风险因素同样突出：股价较 2025 年 11 月 $19/股的 IPO
              定价下跌 44%；$700.3M 可转债构成潜在现金清偿隐忧；NRR 从 H1 FY2026 的 118% 回落至 FY2026 全年的 116%，反映竞争加剧；Microsoft Entra SSE 在
              M365 E3/E5 中的原生扩张威胁其中型市场增长空间。FY2026 间接渠道收入占比高达 95.3%，增添了结构性脆弱度。在当前 $10.56 股价下，综合评级为“谨慎放弃 / 保持观察”（CAUTIOUS
              PASS / TRACK）。相对同行的估值折价确实存在，但需以维持 20% 以上增速和稳定 NRR 为前提。买入标准为：NRR 连续两个季度稳定在 116% 或以上，且完成 $700.3M
              可转债的展期或转股，且收入增速持续保持在 18% 以上。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
