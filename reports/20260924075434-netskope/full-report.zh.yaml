      - number: '8.4'
        title: 逻辑破损与退出标准
        blocks:
          - type: paragraph
            body: >-
              触发即刻清仓或中止投资的逻辑破损红线共有六项。首要且最关键的一条：NRR 连续两个财季跌破 110%，说明大型企业客户流失加速，或在中型市场上被 Microsoft Entra SSE 系统性蚕食。NRR
              一旦跌至 110% 或以下，公司的增长溢价将被彻底抹去，估值将回落至基础设施即服务（IaaS）的 3–4x 收入倍数。第二项：全年收入增速连续两个季度低于 15%，反映中型市场趋于饱和且无力继续突破财富 100
              强。第三项：单年内因 Microsoft Entra SSE 导致的有据可查或估算 ARR 流失超过存量客户基数的 5%，坐实结构性威胁。第四项：$700.3M
              可转债到期且无法再融资，被迫进行现金清偿，该情景可能倒逼公司按 $10–12/股进行股权融资，大幅稀释老股东。第五项：FedRAMP
              核心授权遭撤销，或发生客户数据经串联代理泄露的重大安全事件；此类毁灭性品牌损害很可能导致联邦政府与强监管行业的 ARR 迅速缩水。第六项：Palo Alto Networks 的平台化方案在 12 个月内导致超过
              客户流失对应的 ARR 超过 5%。月度监控指标包括：NTSK 股价相对可转债转股价的溢折价；季度 NRR 走势；渠道伙伴反馈的竞品替代情况；以及 SEC 披露的任何重大不利事项。
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV005
            claimRefs: []
      - number: '8.5'
        title: 终期尽调清单与退出就绪度
        blocks:
          - type: paragraph
            body: >-
              要形成高确信度的投资判断，仍需核实六项核心尽调问题。最关键的是 $700.3M 可转债的完整信托契约与投资意向书：转股价、到期日、利率、认沽/认购权条款及控制权变更条款。若转股价高于当前市价
              $10.56，到期现金清偿将构成重大未来负债。第二项：按季度拆分的客户队列与细分市场（SMB、商业客户、大型企业、联邦政府）NRR 数据，以明确 118% 降至 116% 的收缩是否集中于特定客户群体，特别是
              Microsoft 威胁最大的中型市场。第三项：前 5 大与前 10 大间接渠道合作伙伴占 FY2026 ARR 比例的收入集中度；在间接收入占 95.3%
              的背景下，重要伙伴倒戈影响重大，但目前无法在公开申报文件中获知。第四项：截至 Q1 FY2027（2026 年 4 月）AgentSkope 的商业化储备项目与 ARR
              贡献，此为乐观情景的核心增长催化剂，目前尚未量化。第五项：过去四个季度面对 Zscaler 与 Microsoft Entra SSE
              的竞对赢单/丢单数据，包含订单规模、胜率及竞品替代指标。第六项：上市后按职能划分的员工流失率数据；当前股价下，多数员工的股权激励很可能已处于价外状态。退出准备度：公司已完成
              IPO，对于二级市场新投资者，可通过常规市场交易实现退出流动性。并购上行情景：Cisco、CrowdStrike 或 Palo Alto Networks 可能以较当前股价溢价
              20–30%（$13–14/股）收购 Netskope，对应 $5-6B 交易价值。这不是基准情景，但凭借公司较强的 ARR、NRR 及政府安全资质，并购可构成一条可行的备选退出路径。
