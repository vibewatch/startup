    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              网络安全企业 Netskope, Inc. 总部位于加利福尼亚州 Santa Clara（2445 Augustine Drive, Suite 301, Santa Clara, California
              95054），提供统一的云原生安全与网络平台。公司于 2012 年注册成立，初名 Skope, Inc.，同年 11 月更名为 Netskope。2025 年 9 月 18 日，公司在 Nasdaq Global
              Select Market 上市，股票代码 NTSK；IPO 募集资金总额约 $908M，在承销商全额行使超额配售权后净募资约 $992.2M，跻身当年规模最大的网络安全 IPO 之一。

              Netskope 核心业务依托 Netskope One 平台交付 SSE 与 SASE 能力，构建整合安全与网络的统一云原生平台。产品覆盖 CASB、下一代 SWG、ZTNA、DLP、CSPM、FWaaS 以及
              SD-WAN。平台核心 Zero Trust Engine 针对云、SaaS 及私有应用环境中的用户、设备和数据，实时执行情境感知安全策略。底层交付依托自研 NewEdge 网络；该网络于 2019
              年上线，初始设立 50 个 PoP 节点，随后扩建至 60 多个全球数据中心。

              公司采用 SaaS 订阅制商业模式，主要依照用户数、数据量、功能模块和支持等级，向企业签订多年期合同获取经常性收入。客户通常以 CASB 或 SWG 等核心模块切入，后续交叉增购 ZTNA、FWaaS
              和高级分析模块，驱动高净留存率并持续提高单客平均客单价。根据 IPO S-1 招股文件，Netskope 2024 财年营收达 $600M，至 2025 年末 ARR 突破 $700M，保持 30%+
              的同比增速。
