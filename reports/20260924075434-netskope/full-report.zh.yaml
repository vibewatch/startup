      - number: '5.2'
        title: 产品功能模块图谱
        blocks:
          - type: paragraph
            body: >-
              Netskope One 安全产品套件完整覆盖 SSE/SASE 边界。CASB 为平台发家业务，覆盖 70,000+ 种云服务，支持对合规与非合规应用的 inline 实时检测及 API 审计。下一代 SWG
              拓展了 Web 网关功能，提供完整的 TLS 解密检测与实时威胁防御。Private Access (ZTNA) 以基于身份与上下文的私有应用访问取代传统 VPN。DLP 基于机器学习分类器及 3,000+
              预置策略模板，覆盖传输中与静态存储数据。DSPM 持续自动发现云存储（S3、GCS）中的敏感数据。SSPM 对标基准框架，针对 M365、Salesforce 及 GitHub 的 SaaS
              配置漂移开展合规审计。FWaaS 提供云原生 L3–L7 防火墙服务。Secure SD-WAN（2022 年收购 Infiot 获得）负责分支机构的网络互联。AI 安全系列产品——涵盖 AI
              Gateway、AI Guardrails、GenAI Security 与 AgentSkope——全面管控企业对生成式 AI 与 AI Agent 工作流的使用风险。Advanced Analytics
              则提供 UEBA 异常行为分析及跨平台遥测仪表盘。
