  - id: TI005
    title: 公开财务数据缺口表
    columns:
      - 缺失指标
      - 公开可获取度
      - 对投资判断的影响
      - 明确的尽调路径
    rows:
      - - 按渠道（直销、代理商、MSSP、GSI）细分的 CAC
        - S-1 及其他公开来源均未披露
        - 判断销售与营销（S&M）效率的关键指标；若以整体 S&M / ARR 作为代理指标，会高估新客 CAC
        - 向管理层索取新客获取、存量扩张和客户留存的销售费用拆分，以及各渠道的 CAC 队列分析
      - - 按产品版本 / SKU 细分的毛利率
        - 未披露；仅提供 GAAP 毛利率
        - 高阶模块（AI 分析、SD-WAN）的毛利率可能不同；综合毛利率会掩盖产品组合变化带来的风险
        - 在尽调数据室中索取按 Netskope One 各版本（Core、Advanced、Ultimate）细分的毛利率
      - - 联邦 / 政府机构 ARR 及行业细分
        - 未披露；S-1 中仅作定性提及
        - 美国联邦业务价值高，但受采购延迟和预算周期制约；缺少量化数据就无法建模 FedRAMP 收入
        - 在尽调数据室中索取各行业 ARR 拆分（联邦、医疗、金融、其他）
      - - 大型企业与中端市场客户分布拆分
        - 未披露；Netskope 虽提及财富 100 强渗透率（>30%），但未给出正式的客群划分定义
        - 中端市场客户流失风险更高、客单价更低；客户群过度集中于大型企业也会带来集中度风险
        - 索取按客户员工规模区间（0–500、500–5K、5K+）划分的 ARR 分布；确认前 10 大客户在总 ARR 中的占比
      - - NewEdge 基础设施多年期资本开支计划
        - H1 FY2026 资本开支为 $12.1M；未披露多年期规划
        - 网络基础设施是服务成本的核心驱动因素；摸清 PoP 扩建计划对预测毛利率至关重要
        - 索取 NewEdge 多年期资本开支路线图，并与 Zscaler 已披露的基础设施资本开支轨迹对比
      - - 平均合同期限与 TCV 在手订单
        - 未披露；S-1 仅定性提及多年期合同
        - 更长的合同周期有助于提高收入可预测性并降低客户流失风险
        - 索取加权平均合同期限；在尽调访谈中索取总合同价值（TCV）在手订单数据
      - - FY2026 全年收入与利润率指引
        - S-1 中未提供；未披露正式的业绩指引政策
        - 分析师模型建立在 ARR 运行率推算之上；缺乏业绩指引导致收入预估区间跨度较大
        - 在投资者演示材料中索取管理层对 FY2026 全年收入及 non-GAAP 营业利润率的展望
    notes: >-
      所有缺口均已对照 Netskope 于 2025 年 8 月 22 日提交的 S-1 文件及其他公开来源核实。非上市公司在 IPO 前无需强制披露这些指标；缺少此类数据虽属行业惯例，却会给潜在投资者的模型带来重大不确定性。IPO
      后，部分指标可能会在季度业绩披露（10-Q）中出现。
