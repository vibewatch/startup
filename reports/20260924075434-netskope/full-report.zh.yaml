      - number: '2.4'
        title: 增长驱动力与采用瓶颈
        blocks:
          - type: paragraph
            body: >-
              五大结构性增长引擎支撑着 2026 年及以后的 SASE/SSE 落地。其一，混合与远程办公常态化打破了传统企业边界，催生云原生访问安全需求，而传统 VPN
              与本地代理架构无法高效承载这一需求。其二，上云迁移（SaaS 激增与 IaaS 扩张）暴露了庞大的新型攻击面——CASB 与 CSPM 支出随着云足迹的扩大而同步增长。其三，合规政策加速了刚性 DLP
              与访问审计支出：欧盟 NIS2 指令（2024 年 10 月生效）与 DORA（数字运营韧性法案，2025 年 1 月生效）设立了数据保护与事件报告硬性指标，SASE
              平台有助于满足这些要求；美国零信任总统行政令推动联邦政府及承包商落实相关措施。其四，AI 与行为分析功能（如 Netskope One
              平台所集成的能力）支持威胁检测、异常识别和策略自动调整，形成差异化价值。其五，企业希望整合供应商——目前管理着 25+ 种安全工具——这让大型 SASE
              平台厂商在招标中更具优势，也有助于降低总体拥有成本（TCO）。

              三大实质性阻碍拖累了普及进程。传统基础设施的复杂性是提及最多的痛点：从硬件设备及多供应商异构栈迁移至
              SASE，需要分阶段推进的多年期转型方案、专业项目管理团队以及巨额的组织变革投入。供应商锁定风险——在单一厂商全栈 SASE 模式下尤为突出——导致企业在长期采购承诺前产生迟疑。最后，企业缺乏精通 SASE
              架构与云安全运维的专业人才，拖慢部署进度，推高了企业对托管型 SASE 服务而非自建模式的需求，也可能拉长销售周期。ETR 调研数据显示，SASE
              市场增速已从疫情期高点回落，行业正加速向头部厂商集中，而非由新进入者带来爆发式增长。
