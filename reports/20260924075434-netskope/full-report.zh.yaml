        - 大客户规模采购达 20–30%
        - 高溢价由 CASB/DLP 深度支撑；在预算敏感型客户中面临被替换风险
      - - Zscaler
        - 模块化按用户订阅（ZIA + ZPA）
        - 每坐席 / 月（ZIA / ZPA 独立许可）
        - SWG + 高级威胁防护（ZIA）；ZTNA（ZPA）；DLP 作为附加模块
        - 大客户规模采购达 15–25%
        - 若配置到与 Netskope 同等的功能，模块化方案总价相近；附加模块费用则可能随模块增加而累积
      - - Palo Alto Prisma SASE
        - 按站点 + 按用户计费（转型过渡中）
        - 每站点 / 用户 / 月
        - Prisma Access + SD-WAN + AI 安全集成于统一平台
        - 打法激进；依订单一单一议；结合 ELA 可达 25–40%
        - 主打平台整合策略；大额企业许可协议（ELA）一并打包 SSE 与 SD-WAN；按站点授权简化分支机构预算审批
      - - Cato Networks
        - 按站点 + 按用户捆绑计费
        - Mbps 带宽 + 用户坐席 / 月
        - 全栈 SASE 捆绑包：SD-WAN + ZTNA + SWG + FWaaS + DLP
        - 规模采购达 10–20%
        - 支出高度可预期且账单统一；SD-WAN 与 SSE 一体化打包，相较 Netskope 的附加模块式方案更具吸引力
      - - Cisco SASE (Umbrella)
        - 按坐席 + 附加 SKU + 高可用（HA）许可
        - 每坐席 / 月 + 带宽分档
        - Umbrella（SWG/CASB/ZTNA）+ Meraki SD-WAN；防火墙可选配
        - 结合 ELA / Cisco 企业协议达 20–35%
        - 覆盖最广；Cisco 既有 EA 客户享有优惠商务条款；但 SKU 矩阵极为复杂
      - - Cloudflare One
        - 按用量计费 + 按坐席分档
        - 按席位数与带宽 GB 计费
        - 涵盖 ZTNA、SWG 及基础 CASB；捆绑 DDoS 防护
        - 未公开发布；提供初创企业/开发者免费层级
        - 定价具颠覆性；契合开发者与中小企业需求；DLP 功能有限致使大型企业市场存在短板
      - - Fortinet FortiSASE
        - 永久许可与订阅制混合模式
        - 按设备/用户/月计费 + SD-WAN 硬件设备
        - FortiSASE（云端）+ FortiGate（本地 SD-WAN）捆绑包
        - 现有 Fortinet 客户享 15–25% 折扣
        - 对现有 FortiGate 存量客户吸引力强；对全新云优先部署吸引力较弱
    notes: 定价数据源自分析师估算、Netify 研究、PeerSpot 讨论与厂商官方文档。大型企业合同条款差异极大；公开挂牌价极少反映实际协商成交价格。数据仅代表截至 2026 年的大致市场定位，非经审计交易数据。
