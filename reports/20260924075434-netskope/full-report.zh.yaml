      - number: '2.2'
        title: 市场规模与分析师测算
        blocks:
          - type: paragraph
            body: >-
              由于统计口径与测算方法的差异，各机构发布的 SASE 与 SSE 市场测算数据分歧显著。行业分析中引用最广的 MarketsandMarkets 预测，全球 SASE 市场规模在 2026 年为 $19.19
              billion，到 2032 年将以 28.8% 的复合年均增长率（CAGR）增至 $68.06 billion。Mordor Intelligence 则给出了较为保守的测算，预计 2026 年为 $15.54
              billion，到 2031 年以约 20% 的 CAGR 增至约 $39.14 billion。sase.cloud 引用的 2030 年 $97 billion 预测数据，除纯 SASE
              外大概率还计入了相邻的网络市场。

              针对 Netskope 明确可寻址的细分市场（员工数 ≥500 人且拥抱云架构的企业级 SASE），2026 年可服务市场（SAM）预计约为 $8–$10 billion。在剔除中小企业（SMB）、政府部门以及
              Netskope 产品契合度较低的重基础设施领域后，该 SAM 约占 SASE 整体 TAM 的 50–55%。截至 2025 年 11 月，Netskope 约 $707 million 的 ARR 对应
              SASE TAM 渗透率粗略为 3.7–4.6%，或约占企业级 SAM 测算值的 7–9%。鉴于整体市场保持每年 20–29% 的增速，即便不夺取额外市场份额，这一空间也蕴含着巨大的增长潜力。

              市场上亦存在相互矛盾的极端测算：Coherent Market Insights 预计 2026 年 SASE 市场规模达 $59.26 billion，约是 MarketsandMarkets 数据的 3
              倍，推测其采用了极宽泛的市场定义。Global Market Insights 测算的 2026 年 SASE 规模为 $2.8 billion，似乎仅圈定了 SWG/CASB
              狭义范畴。此类极端差异表明市场规模测算高度依赖边界界定，应予以审慎权衡；MarketsandMarkets 与 Mordor Intelligence 提供了最常被采信的中位数参考基准。
