      - number: '1.3'
        title: 融资历史与股东结构
        blocks:
          - type: paragraph
            body: >-
              在 2025 年 9 月 IPO 之前，Netskope 经 9 轮融资累计募集约 $1.44 billion。融资始于 2013 年 Social Capital 提供的 $5.5 million
              种子轮资金，此后轮次规模持续扩大。2018 年 11 月，公司在由 Lightspeed Venture Partners 领投的 $168.7 million F 轮融资中跻身独角兽行列，估值突破 $1
              billion。2020 年 2 月的 G 轮融资（$340 million，Sequoia Capital 领投）正值疫情期间云安全需求高峰，估值增至约 $3 billion，约增至此前的三倍；同月
              Private Access 正式上线。

              2021 年 7 月的 H 轮融资（$300 million，ICONIQ Growth 领投）创下 $7.5 billion 的 IPO 前最高估值纪录。2023 年 1 月，由 Morgan Stanley
              领投的可转债轮次募集 $401 million，成为 IPO 前规模最大的一笔融资，Goldman Sachs Asset
              Management、安大略省教师退休基金（OTPP）与加拿大养老金计划投资委员会（CPP Investments）参投。这轮融资延续了 $7.5 billion 的估值。然而，PM Insights
              的二级市场分析显示，截至 2025 年 8 月，隐含估值已降至约 $5.12 billion，较 H 轮折价 31.73%，反映企业级 SaaS 估值倍数普遍收缩。与 $7.3 billion 的 IPO
              定价估值相比，二级市场折价说明公开市场给出的估值高于后期私募市场情绪所隐含的水平。

              IPO 发行价定为每股 $19，获得 20+ 倍超额认购，募集总额（毛收益）约 $908 million。算入超额配售在内，净募集资金达 $992.2 million。主要长期风险投资机构包括 ICONIQ
              Capital、Sequoia Capital、Lightspeed Venture Partners、Accel 和 Sapphire Ventures；来自 Goldman Sachs、Morgan
              Stanley、CPP Investments 及 OTPP 的机构资金共同构成结构高度分散的股权结构表。
