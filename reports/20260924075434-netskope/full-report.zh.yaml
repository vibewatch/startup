      - number: '3.3'
        title: 功能与定价深度对比
        blocks:
          - type: paragraph
            body: >-
              Netskope 最稳固的产品差异化优势在于 CASB 的覆盖深度与 DLP 的精细度。其 CASB 引擎覆盖 49,000+ 款云端应用——居 SSE 市场之冠；DLP 引擎内置 3,000+
              种数据分类器，支持针对结构化、非结构化及 SaaS 数据的精细化策略管控。Netskope 单通道云架构在单次在线流处理中完成所有安全检测，相比串行级联的多供应商架构大幅降低网络延迟。NewEdge
              NewEdge 私有网络承诺全球 TLS 检测延迟低于 50ms；竞品尚未公开给出可比指标。

              SD-WAN 是一项实质性短板：Netskope 的 Borderless SD-WAN 属于附加型产品，而非原生集成；在要求网络与安全深度统一的客户群中，它落后于 Cato Networks、Cisco 与
              Palo Alto。整个 SSE 市场定价以单用户年度订阅为主，Netskope 凭借 DLP 与 CASB 深度溢价高于市场中位数。Zscaler 采取模块化拆分定价（ZIA 与 ZPA
              分开计价），导致对标相同功能配置时综合费用通常高于 Netskope 打包方案。Palo Alto 转为站点许可旨在简化企业预算编制。Cloudflare 的用量计费模型则在市场底端带来显著价格下行压力。
