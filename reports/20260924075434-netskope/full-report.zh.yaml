      - number: '2.3'
        title: 采购方与用户分层画像
        blocks:
          - type: paragraph
            body: >-
              Netskope 及同类 SASE 厂商的核心经济决策者为 CISO；涉及大型多年期平台合同时，通常由 CISO 与 CIO 协同决策。技术把关者（负责评估、推荐与日常运营）涵盖 IT 安全团队、安全架构师或
              SOC 主管。财务与采购部门承担付款审批职责，通常要求提供商业论证、多年期 ROI 测算模型及竞品比价基准。终端日常使用者（网络运维、IT 运维或开发人员）频繁使用产品，但通常缺乏预算决策权。

              Netskope 客户群体高度向大型跨国企业倾斜，渗透了 30%+ Fortune 100 强企业，企业客户总数超过 4,000 家。价值最高的三类客群包括：(1)
              受强监管行业（金融服务、医疗健康、能源），DLP、CASB 与审计日志属于刚性合规要求，驱动非周期性预算支出；(2) Global 2000
              强企业，拥有庞大、分散且深度依赖云的员工队伍，需要跨地域保持安全策略一致；(3) 云原生与数字化领先企业（科技、电商、SaaS），已彻底放弃本地机房硬件，原生需要 ZTNA 与 CASB 的深度集成。

              员工规模在 500–5,000 人的中型企业市场增长潜力大，但服务仍不充分。Wiz 2026 年 CISO 预算基准调查（涵盖 300+ 位 CISO）显示，85% 的受访企业在 2026
              年增加了网络安全预算，88% 计划追加云安全投入。Dell'Oro Group 指出，企业安全预算正加速向两类 SaaS 方案集中——SASE/SSE 边缘安全与融合 AI 的下一代
              SIEM——传统硬件和单点工具的预算份额则受到挤压。这种预算整合直接利好 Netskope 以平台为中心的销售模式。
