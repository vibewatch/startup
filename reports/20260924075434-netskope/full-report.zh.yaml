      - number: '7.4'
        title: 财务与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Netskope 的财务风险主要集中于三大方向：可转债压顶、IPO 后股价表现疲软，以及 NRR 承压下行。据 10-K 披露，截至 2026 年 1 月 31 日，公司未偿可转债达
              $700.3M。虽然转股条款与到期日在公开摘要中未单独披露，但若转股价高于当前市价（2026 年 5 月 13 日收盘价为 $10.56，较 $19 的 IPO 发行价折让
              44%），持有人在到期时可能选择现金结算而非转股，从而带来未来大额现金流出压力。股价较 IPO 发行价缩水 44%，限制了公司以低稀释成本增发股权融资的能力，也形成 IPO
              后估值压力：早期投资者与员工在禁售期内面临账面亏损，可能加剧核心人才流失。NRR 收缩：H1 FY2026 为 118%（据 S-1）→ FY2026 全年为 116%（据
              10-K），反映下半财年客户缩减或净扩张放缓。若 NRR 进一步滑向 110%，增长逻辑将明显受损，已显现的估值乘数压缩（股价对应 ~10x FY2026 收入，低于 IPO 时的 26x）亦将持续。H1
              FY2026 自由现金流为 $(2.2M)，虽接近盈亏平衡，但对收入放缓或 CAC 上升极为敏感。累计亏损 $2.1B
              虽未直接限制运营，但二级市场投资者必须将其长期未盈利的历史计入投资考量。StockAnalysis.com 汇总的分析师共识预期显示，收入增速预计将从 32%（FY2026）放缓至
              ~24%（FY2027），表明市场已在一定程度上消化了增长减速风险。（2026%）
