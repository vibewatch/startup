      - number: '4.5'
        title: 财务评估与尽调待核实事项
        blocks:
          - type: paragraph
            body: >-
              Netskope 财务底色具备高收入质量（118% NRR、96% GRR、按座位订阅模式）、毛利率向 70%+ 快速突破，以及在 2026 财年上半年迎来的结构性 FCF 盈亏平衡拐点。IPO
              募资提供了雄厚的流动性缓冲。核心财务风险主要体现在：(1) $700M 可转债构成潜在偿债与稀释压力，需严格复核转股价与到期日；(2) S&M 与 R&D 占营收比例合计仍在 80%
              以上，应对意外宏观冲击的弹性不足；(3) 累计亏损达 $2.1B，在当前现金消耗水平下虽无近虑，却印证了打造该平台所付出的巨额资本代价；(4) 2026 财年全年营收与利润率缺乏官方量化指引，需依托 $707M
              ARR 底盘进行假设测算。

              尽职调查的核心信息盲区包括：分渠道获客成本（直销 vs 渠道分销）未予披露、各产品层级与功能模块毛利率缺乏明细、未拆分行业/客群 ARR 结构（大型企业 vs 联邦政府 vs 中端市场），且 NewEdge
              网络未来多年资本开支规划缺乏公开数据。搭建估值承保模型时须将上述空白作为不确定性变量处理。不过，其 S-1 展现的财务证据链在网络安全 IPO 前期企业中属于极详实案例，经营指标（NRR、GRR、FCF
              走势）足以支撑基准情景下的投资逻辑。至于极端情形——Palo Alto 与 Zscaler 的价格战、联邦政府采购波动的风险、可转债处理结果——仍需依赖管理层路演交流以进一步穿透。
