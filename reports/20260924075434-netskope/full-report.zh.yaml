      - number: '4.4'
        title: 资金充裕度与融资运作
        blocks:
          - type: paragraph
            body: >-
              得益于 2025 年顺利完成 IPO，Netskope 的资金储备大幅改善。截至 2025 年 7 月 31 日，IPO 前持有的现金、现金等价物及有价证券总额为 $261.4 million。2025
              年在纳斯达克挂牌上市（代码：NTSK），以每股 $19 发行，募集资金约 $908 million，对应定价市值约 $7.3 billion。股票上市首日暴涨，据 Reuters 报道开盘交易对应隐含估值约
              $9.5 billion。据此推算，IPO 后备考现金预计约为 $1.1 billion（含 IPO 前的 $261.4M 与扣除承销费用后约 $876M 的 IPO 净募集资金）。

              主要资金风险在于截至 2025 年 7 月 31 日仍未偿还的 $700.3 million 可转换公司债券。S-1
              虽披露转股条款、到期日及利率，但公开摘要尚不足以确认完整细节；该可转债可能造成重大股权稀释或现金偿付义务。截至 2025 年 7 月 31 日，累计亏损达 $(2.119B)，IPO 前股东权益为负值，达
              $(612.1M)。IPO 时优先股（$1,050.6M）全部转为普通股，部分扭转了股东权益赤字。至关重要的是，自由现金流迎来拐点：H1 FY2026 自由现金流（FCF）为 $(2.2M)——接近盈亏平衡——而
              H1 FY2025 为 $(126.5M)，FY2025 全年为 $(151.1M)。在季度现金消耗近乎归零的背景下，约 $1.1B 的上市后现金储备为维持当前运营节奏提供了近乎充裕的跑道。
