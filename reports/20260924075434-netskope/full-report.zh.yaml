            body: >-
              企业削减工具冗余、从 25+ 安全供应商收敛至 3–5 家核心平台的趋势，使 Netskope 这类纯血 SSE 厂商处于结构性劣势。Palo Alto Networks 与 Cisco
              能够在单一企业级协议（ELA）中打包提供 SD-WAN、端点安全与 SSE，形成独立 SSE 厂商在未大幅拓展产品线前难以匹敌的商务压制力。在现有大型跨产品厂商发起全栈替代的多年期续约谈判中，此风险尤为剧烈。
            calloutType: risk
            claimRefs:
              - CP016
              - CP033
              - CP035
          - type: callout
            title: 与 Zscaler 的规模差距构成估值定价的核心背景
            body: >-
              Zscaler 达约 $3.2B 的 ARR 体量（2026 财年 Q1）约为 Netskope（约 $707M）的 4.5 倍。该规模差距说明 Zscaler 较早 IPO（2018 年）、更激进的 GTM
              投入以及零信任网络访问领域的先发统治力。评估 Netskope 上市后估值轨迹的投资者，必须推演 Netskope 能否在 5–7 年内依靠开拓中端市场、全球扩张和 SASE
              全平台延伸迎头赶上，抑或该规模鸿沟具备自我强化的结构性壁垒。
            calloutType: insight
            claimRefs:
