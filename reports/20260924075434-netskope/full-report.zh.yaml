        title: 核心竞品对比画像
        blocks:
          - type: paragraph
            body: >-
              Zscaler 是 Netskope 在营收体量上最直接的竞争对手。其 2025 财年 ARR 达 $3.015B（同比增长 22%），2026 财年 Q1 ARR 达 $3.204B（同比增长 26%）；截至
              2025 年 7 月 31 日，递延收入达 $2.468B，展现出极强的业务可见度。其 Zero Trust Exchange 核心优势在于零信任网络访问广度及海量流量检测的基础设施规模。Palo Alto
              Networks Prisma SASE 具备最出色的 AI/ML 安全防护与最深度的平台整合度；尽管 Gartner
              曾指出其复杂的定价机制及主要依赖英语的技术支持是短板，该厂商已转向基于站点的许可模式以简化产品打包逻辑。

              Cato Networks 于 2023 年按 $3B 估值完成 $238M 融资，在崇尚单厂商 SASE 架构的工程师群体中口碑极高：其原生网络骨干依托 90+ 自建 PoP 的全球私有网络，将所有 SASE
              组件融于单一云平台。Cloudflare One 部署 320+ 全球 PoP 节点，以按量计费模式重点渗透开发者驱动型与云原生企业。Fortinet FortiSASE 结合传统 SD-WAN 优势与 SSE
              能力，重点服务中端市场及存量 Fortinet 客户。Microsoft Entra Internet Access 依托其垄断级身份平台与 M365 捆绑优势，以近乎零的增量边际成本提供 ZTNA 与
              SWG，对全面采用微软生态的客户群中独立纯血 SSE 厂商形成巨大的定价下行压力。
