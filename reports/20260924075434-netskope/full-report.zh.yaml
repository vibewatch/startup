            title: 平台化整合是最高等级的竞争风险
            body: >-
              企业安全平台整合趋势——将 25+ 家安全供应商压缩至 3–5 家核心平台——给 Netskope 等单一 SSE 专长厂商带来了结构性劣势。Palo Alto Networks 和 Cisco
              能够通过单份企业许可协议（ELA）同时捆绑 SD-WAN、端点与 SSE，形成纯 SSE 厂商不借助重大产品扩张便无法抵挡的商业压力。在现存广义平台巨头意图实现全栈整合的多年期续约周期中，此类风险尤为致命。
            calloutType: risk
            claimRefs:
              - CP016
              - CP033
              - CP035
          - type: callout
            title: 与 Zscaler 的体量差距是估值层面的关键竞争参照
            body: >-
              Zscaler 的 ARR 达约 $3.2B（Q1 FY2026），约为 Netskope（约 $707M）的 4.5 倍。这一体量差异源于 Zscaler 较早 IPO（2018 年）、更广阔的 GTM
              市场拓展投入以及在零信任网络访问领域的领跑地位。评估 Netskope 上市后发展路径的投资者，需重点建模分析：Netskope 是否能够依托中端市场突破、国际化拓展及 SASE 平台化演进，在 5–7
              年内跃升至 Zscaler 的收入量级，抑或该规模差距具备结构性的自我强化属性。
            calloutType: insight
            claimRefs:
