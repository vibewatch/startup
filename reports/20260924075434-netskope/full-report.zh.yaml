            - 行业分析师推荐
            - 合作伙伴引荐
            - 行业峰会同行推荐
          emotion: 担心传统 VPN / 防火墙过于复杂，也担忧云端可视性不足
          painpoint: Multiple point solutions; no unified cloud visibility
          opportunity: Position Netskope One as platform consolidator vs. point tool
          label: 认知阶段
        - actor: 安全架构师 / 网络工程师
          touchpoints:
            - CASB 概念验证（PoC）试用
            - NewEdge 延迟基准测试
            - Gartner Peer Insights 评价
            - 厂商 RFP 选型流程
          emotion: 担心性能受影响，要求证明部署不会妨碍业务
          painpoint: SSL inspection compatibility concerns; deployment complexity fears
          opportunity: Orbia/BDO reference calls; 4-month deployment case study
          label: 评估阶段
        - actor: CISO + CFO + 采购部门
          touchpoints:
            - 渠道合作伙伴商务谈判
            - 1–3 年期订阅合同
            - 年度账单付款承诺
          emotion: 重点关注相较多厂商方案的 TCO，也希望保留采购灵活性
          painpoint: High initial price vs. Zscaler; 1–3 year lock-in risk
          opportunity: Bundle CASB + SWG as entry; defer ZTNA and DLP to renewal
          label: 采购阶段
        - actor: 网络工程 / IT 运维团队
          touchpoints:
            - Netskope 客户成功团队
            - NewEdge 网络接入引导
            - 身份体系集成（Entra ID）
            - 安全策略配置
          emotion: 担心部署影响现有业务，希望尽快看到价值
          painpoint: Initial config complexity; certificate MitM tuning required
          opportunity: 4-month Orbia deployment proves rapid rollout; Academy training
          label: 上线阶段
        - actor: CISO / 平台负责人
          touchpoints:
            - 与 CSM 的季度业务回顾（QBR）
            - 新产品演示（AI Gateway、DLP、SD-WAN）
            - NRR 增购续约合同
          emotion: 认可平台，愿意继续引入新能力
          painpoint: Budget competition from other security tools; procurement lag
          opportunity: GenAI security use case (BDO ChatGPT controls) drives rapid upsell
          label: 扩张阶段
        - actor: CIO / CISO
          touchpoints:
            - 撰写 Gartner Peer Insights 评价
            - 官方案例研究发布
            - 行业会议演讲
            - 向同行引荐
          emotion: 对安全架构转型成果感到自豪；乐于分享成功经验
          painpoint: Reluctance to disclose specific security configurations publicly
          opportunity: BDO, Colgate, Orbia reference customers available for qualified prospects
