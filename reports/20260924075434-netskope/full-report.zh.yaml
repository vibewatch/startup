      - number: '8.2'
        title: 估值背景与可比公司分析
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月 13 日，Netskope 股价为 $10.56/股，对应未来 12 个月（NTM）市销率约为 5.0 倍（按分析师共识预期的约 $835M 收入计），EV/ARR 为 5.9 倍（按
              $707M ARR 计），EV/TTM 收入为 5.9 倍（2026 财年收入 $709.1M）。IPO 首日企业价值在 $19 发行价下对应约 10.5 倍 EV/ARR，与 SASE
              一级市场估值倍数相符：Cato Networks 在 2023–2024 年以约 $3.2B 估值融资 $238M（对应约 $280M 预估 ARR 的约 11.4 倍 ARR），Axis Security 在
              2023 年被 HPE/Aruba 以约 $452M 收购（对应约 12–15 倍 ARR）。当前的 5.0 倍 NTM 倍数较 Zscaler 的约 10 倍与 Cloudflare 的约 13 倍存在
              50%–55% 的折价。Palo Alto Networks 对应约 9 倍 NTM 且自由现金流利润率显著更高（约 35%）；CrowdStrike 则享有约 18 倍
              NTM，反映高成长溢价。估值倍数折价具备部分合理性：Netskope 自由现金流仅在盈亏平衡线附近，不及同业 25%–35% 的水平，且 $700.3M
              可转债带来了可比公司所不具备的财务杠杆。然而，该折价亦包含了首日 $9.5B 估值在半年内回落至约 $4.2B EV 的 IPO 破发情绪冲击，而非单纯的基本面恶化。营收预期增速从 IPO 时期隐含的 25%
              以上放缓至当前共识预期的约 18% NTM，同样解释了部分估值重塑。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
