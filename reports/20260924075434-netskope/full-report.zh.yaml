  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Netskope 的核心竞争舞台是 SSE 市场，该细分领域隶属于 Gartner 于 2019 年首度定义的更广泛 SASE 框架。SSE 涵盖基于云交付的安全能力组合——CASB、SWG、ZTNA、DLP
              以及 FWaaS——旨在保障用户不论身处何地均可安全访问云、SaaS 及私有应用。完整 SASE 架构在 SSE 基础上叠加网络路由能力，主要是 SD-WAN，将安全与网络整合进单一云原生平台。

              市场边界的界定直接决定市场空间测算。狭义 SSE 统计通常仅涵盖安全软件支出，预计 2026 年全球规模为 $1.5–$5.3B。据 MarketsandMarkets 与 Mordor Intelligence
              测算，计入网络与 SD-WAN 的广义 SASE 市场 2026 年规模在 $15.5–$19.2B 之间。而涵盖端点、身份与数据中心化控制的最广义零信任安全市场，年规模更达 $44–$60B。Netskope
              当前产品线同时覆盖 SSE 能力与 SD-WAN 集成（Netskope One SD-WAN），在完整 SASE 范畴内全面参与竞争。

              落在 Netskope 可触达市场之外的支出包括独立 EDR、传统 SIEM、硬件防火墙设备、邮件安全单点工具、IAM 以及 MDM。现有替代方案包括传统 VPN 基础设施（通常由 IT
              运维管理）、本地代理设备以及拼凑的多供应商安全软件栈；企业销售周期中，Netskope 主要是对这些传统方案进行替换。超大规模云厂商与大型科技公司内部会自建定制 SD-WAN
              或代理，但这部分在整体替代品中占比较小。
