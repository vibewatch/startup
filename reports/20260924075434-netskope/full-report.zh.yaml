    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Netskope, Inc. 是一家网络安全企业，提供统一的云原生安全与网络平台，总部位于 2445 Augustine Drive, Suite 301, Santa Clara, California
              95054。公司于 2012 年以 Skope, Inc. 为名注册成立，2012 年 11 月更名为 Netskope。2025 年 9 月 18 日，公司以股票代码 NTSK
              在纳斯达克全球精选市场（Nasdaq Global Select Market）上市；承销商全额行使超额配售权后，公司募集毛收益约 $908 million，净募集资金约 $992.2
              million，成为当年规模最大的网络安全 IPO 之一。

              Netskope 的核心业务依托 Netskope One
              平台提供安全服务边缘（SSE）与安全访问服务边缘（SASE）能力。这个统一的云原生平台融合了安全与网络，产品组合涵盖云访问安全代理（CASB）、下一代安全 Web
              网关（SWG）、零信任网络访问（ZTNA）、数据防泄露（DLP）、云安全形态管理（CSPM）、防火墙即服务（FWaaS）及软件定义广域网（SD-WAN）。其 Zero Trust Engine 针对云端、SaaS
              与私有应用环境中的用户、设备与数据，执行实时且具备上下文感知的安全策略。服务依托专有 NewEdge 网络交付，该网络于 2019 年上线，初始设立 50 个 PoP，随后扩展至 60 多个全球数据中心。

              公司采用订阅制 SaaS 模式，主要通过多年期企业合同获取经常性收入，合同价格取决于用户数、数据量、部署功能及支持等级。客户通常先采购 CASB 或 SWG 等核心模块，再增购 ZTNA、FWaaS
              与高级分析模块，带动较高的净留存率和单客平均收入持续增长。据 IPO S-1 文件披露，Netskope 2024 财年收入为 $600 million，到 2025 年底 ARR 突破 $700
              million，呈现持续 30%+ 的同比增长。
