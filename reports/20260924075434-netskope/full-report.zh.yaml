      - number: '3.3'
        title: 功能特性与定价对比
        blocks:
          - type: paragraph
            body: >-
              Netskope 最坚固的产品差异化壁垒在于 CASB 的深度与 DLP 的精细度。其 CASB 引擎覆盖 49,000+ 种云端应用，属 SSE 市场中最广泛的应用库；DLP 引擎则内置 3,000+
              种数据分类器，能够跨结构化、非结构化及 SaaS 数据执行颗粒度极细的合规策略。Netskope 单遍云架构在一次 inline 流量过检中完成全部安全检查，避免了多供应商服务链式叠加导致的延迟放大。自建
              NewEdge 私有网络在全球范围内承诺 50ms TLS 检测 SLA，这一可量化的性能指标竞品尚未在公开承诺中对齐。

              SD-WAN 构成明显的短板：Netskope 的 Borderless SD-WAN 属于附加功能而非原生整合，在要求网络与安全深度统一的客户采购中，落后于 Cato Networks、Cisco 与 Palo
              Alto。SSE 市场整体普遍采用按用户计费的年度订阅制，Netskope 凭借深厚的 DLP 与 CASB 能力维持了高于市场中位数的溢价水平。Zscaler 采用模块化分拆定价（ZIA 与 ZPA
              独立计费），在配置对等功能模块时，总价通常高出 Netskope 打包方案。Palo Alto 转向基于站点的许可旨在简化企业 IT 预算规划。Cloudflare 的按使用量付费模式则在市场下沉端形成定价压力。
