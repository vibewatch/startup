      - number: '2.2'
        title: 市场规模与分析师测算
        blocks:
          - type: paragraph
            body: >-
              由于统计口径与测算模型存在差异，已公开的 SASE 与 SSE 市场测算数据分歧显著。业内引用最广的 MarketsandMarkets 预计，全球 SASE 市场规模 2026 年将达 $19.19B，至
              2032 年增至 $68.06B，复合年增长率（CAGR）达 28.8%。Mordor Intelligence 给出较为保守的基准，预计 2026 年为 $15.54B，到 2031 年按约 20% CAGR
              增至约 $39.14B。sase.cloud 预测 2030 年市场达 $97B，该数据可能在纯 SASE 外并入了相邻网络市场。

              聚焦 Netskope 直接可服务市场（员工数 ≥500 且采用前瞻云架构的企业级 SASE），排除 Netskope 产品契合度较低的中小企业、政府及重资产基础设施板块后，2026
              年可服务市场空间（SAM）测算约为 $8–$10B，约占整体 SASE TAM 的 50–55%。截至 2025 年 11 月，Netskope 对应约 $707M 的 ARR，意味着其在 SASE TAM
              中的渗透率约为 3.7–4.6%，在企业级 SAM 中的渗透率约为 7–9%。鉴于整体市场保持每年 20–29% 的扩张节奏，即便不抢夺同业份额，现有渗透深度亦支撑可观的内生增长空间。

              市场上存在极端离群估算：Coherent Market Insights 预计 2026 年 SASE 规模高达 $59.26B，约为 MarketsandMarkets 测算值的 3
              倍，推测其采用了极宽泛口径。Global Market Insights 测算 2026 年 SASE 仅为 $2.8B，显然仅局限于 SWG/CASB
              极狭义范畴。此类极值说明市场空间规模高度依赖边界定义；投资评估时应赋予合理权重，以 MarketsandMarkets 与 Mordor Intelligence 作为最通用的基准中枢。
