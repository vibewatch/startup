      - number: '1.2'
        title: 创始人、管理层与公司治理
        blocks:
          - type: paragraph
            body: >-
              Netskope 由四位技术人士联合创立：Sanjay Beri（CEO 兼董事长）、Krishna Narayanaswamy（CTO）、Ravi Ithal（首席架构师）以及 Lebin Cheng（2018
              年离职）。Beri 提出了以数据为中心、云原生安全的创业愿景；他曾在向 Symantec 前高管推介前，把构想画在星巴克餐巾纸上。Beri（生于 1976
              年）是公司最重要的对外发言人和战略主导者，也是关键人物依赖风险的核心。据 Yahoo Finance 高管披露数据，他担任 CEO 的 FY2025 薪酬约为 $973,000（含基本工资与奖金）。

              CTO Krishna Narayanaswamy 在深度包检测、安全及行为异常分析领域拥有超过 25 年经验。他持有 50 多项专利，在联合创立 Netskope 之前，曾于 2004 至 2012 年任
              Juniper Networks 杰出工程师，并于 1997 至 2004 年创立 Top Layer Networks。Ravi Ithal 担任首席架构师，专注于安全架构与平台纵深研发。

              第四位联合创始人 Lebin Cheng 曾任应用工程副总裁，于 2018 年离职，随后创立 ArecaBay 与
              CloudVector。其离职未对公司增长造成明显冲击，但削弱了创始团队的覆盖广度。管理团队随后引入外部人才予以充实：Drew Del Matto（CFO，曾任职于 Citrix 与 Fortinet，2019
              年加入，拥有 MBA 学位）主管财务运作，Raphaël Bousquet（CRO）统管全球市场拓展。董事会成员包括 Enrique Salem（Symantec 前 CEO，2013 年 10
              月加入）、Kimberly Alexy（审计委员会主席）、Eric Wolford（治理委员会主席）、Arif Janmohamed 与 Will Griffith。作为上市公司，Netskope
              现须遵守纳斯达克上市标准与 SEC 披露要求。截至 2026 年 5 月，未确认发生重大管理层变动。
