  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Netskope 的投资看多逻辑立足于四大支柱：一是拥有行业顶尖的在线代理 SSE 架构并取得 FedRAMP High 授权，构筑了多数竞品无法企及的联邦政府行业壁垒；二是大企业客群基础扎实，囊括约三分之一
              Fortune 100 企业，ARR 超 $100K 的客户数达 1,531 家，占总 ARR 的 86%；三是营收增长稳健，2026 财年收入同比增长 32% 达 $709.1M，NRR 达
              116%，展现出老客群强劲的增购与交叉销售势能；四是推出 AgentSkope 布局 AI 安全，瞄准快速增长的生成式 AI 治理蓝海。然而，看空逻辑同样严峻：当前股价较 2025 年 11 月
              $19/股的发行价大跌 44%；$700.3M 可转债构成潜在现金偿付压力；NRR 由 2026 财年上半年的 118% 降至全年的 116%，显现竞争承压迹象；Microsoft Entra SSE 依托
              M365 E3/E5 原生打包扩张，威胁到 Netskope 的中端市场拓展。2026 财年高达 95.3% 的收入依赖间接渠道，增加了其商业模式的结构性脆弱性。基于当前 $10.56 股价，整体建议为“谨慎观望
              / 持续跟踪”（CAUTIOUS PASS / TRACK）。估值虽较同业存在折价，但该折价修复以营收维持 20% 以上增速且 NRR 止跌企稳为前提。买入触发条件包括：连续两个季度 NRR 稳于 116%
              或更高、成功转股或置换 $700.3M 可转债，且营收增速持续高于 18%。
            claimRefs:
              - CV001
              - CV002
              - CV003
