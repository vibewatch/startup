      - number: '5.3'
        title: 客户工作流与交付部署
        blocks:
          - type: paragraph
            body: >-
              企业客户在受管端点上部署 Netskope 客户端（AgentSkope），借助支持 Windows、macOS、iOS、Android 及 ChromeOS 的轻量级代理程序，将所有
              Web、云端及私有应用流量经隧道引至最近的 NewEdge PoP。对于非受管（BYOD）场景，Netskope 依托与主流 SaaS 厂商的 API 对接，提供无需安装客户端的无代理反向代理 CASB
              服务。位于 PoP 节点的 Zero Trust Engine 在执行策略前，会深度解析每笔事务的完整上下文——主体是谁（来自 AD、Okta、SAML 的身份）、何种设备（健康评估分）、访问何种服务（源自
              70,000 款应用目录）、执行何种操作（下载、上传、共享）以及涉及何种数据（DLP 分类等级）。依托 Cloud Exchange（CE）平台实现与现有企业安全栈的联动，该平台包含托管在 GitHub 上的开源
              SIEM、SOAR、XDR 与威胁情报插件库。UEBA 可精准捕获异常下载流量或非工作时间访问等反常行为。G2 与 PeerSpot 用户评价普遍肯定了其部署简便性，但指出 SIEM
              集成摩擦以及在操作系统大版本更新时偶尔发生兼容性问题。
