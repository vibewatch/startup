      - number: '4.2'
        title: 单客经济学与销售效率
        blocks:
          - type: paragraph
            body: >-
              Netskope 的单客经济学在已披露部分展现出极高韧性，未公开部分则仍显模糊。118% 的 NRR（高于前一年的 113%）是其典型商业标签——理论上即使不再拓展任何新客户，公司营收仍能实现正增长。96%
              的毛收入留存率（GRR，高于前一年的 95%）表明综合年化流失率仅约 4%，推算平均客户生命周期超过 20 年。截至 2025 年 7 月 31 日，单客平均 ARR 达到 $163.8K，高于上年同期的
              $148.7K，证实存量客户通过持续增购模块推动合同金额稳步扩大。

              在获客端，2026 财年上半年销售及营销费用绝对值出现下降（由 2025 财年同期的 $151.6M 降至 $147.4M），而同期营收增长 31%。S&M 占营收比重从 2024 财年的 64.7% 降至
              2025 财年的 52.2%，并在 2026 财年上半年进一步降至 44.9%——IPO 带来的品牌效应与企业客户口碑驱动了显著的获客效率拐点。研发支出占营收比重在上述对应周期同样自 55.2% 降至
              47.2%，再降至 42.8%。核心未量化指标是分渠道的 CAC 回本周期。结合各期总 S&M 支出及净新增 ARR 粗略推算，新客户平均回本周期预计超过 24 个月，这虽符合企业级安全 SaaS
              行业通例，但仍需在后续尽调中按细分客群逐一核实。
