      - number: '1.4'
        title: 业务体量、财务指标与市场地位
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年底，Netskope 服务遍及 30+ 个国家的 4,000 多家企业客户，涵盖逾 30% 的财富 100 强企业。公司在全球拥有约 3,100 名员工，主要分布在北美（约 1,600
              人）、亚洲（约 977 人）及欧洲（约 413 人），并在 Santa Clara、St. Louis、Sydney、Brussels、São Paulo、Bengaluru、Tokyo 和 Singapore
              设有分支机构。

              公司 2024 财年收入达 $600 million，至 2025 年 11 月 ARR 增至约 $707 million。2025 年上半年收入为 $328 million（较 2024 年上半年的 $251
              million 增长），对应约 30% 的同比增速。尽管已具规模，Netskope 仍处于净亏损状态：2025 年上半年净亏损由 2024 年同期的 $207 million 收窄至 $170
              million，公司目标在 2025 财年实现自由现金流转正。FY2025 10-K 年报已于 2026 年 3 月 31 日提交 SEC，但本研究周期内未检索到包含毛利率、NRR
              及单客经济模型在内的详细财务数据。

              截至 2025 年 5 月，Netskope 已连续四年与 Zscaler 及 Palo Alto Networks 一同入选 Gartner SASE 平台与 SSE 魔力象限领导者（Leader）。公司的
              NewEdge 网络自 2019 年上线以来已扩展至 60+ 个全球数据中心，可在不牺牲网络性能的前提下实现实时安全防护，成为面向大客户的核心卖点。截至 2026 年 5 月 13 日收盘，NTSK 股价约为
              $10.56，较 $19 的 IPO 发行价下跌约 44%，反映 IPO 后市场环境承压。

              截至本报告 runDate，毛利率、净收入留存率（NRR）及获客成本（CAC）仍缺乏公开佐证；这些指标属于非公开披露内容，尚待查阅 2026 年 3 月提交的 10-K。
