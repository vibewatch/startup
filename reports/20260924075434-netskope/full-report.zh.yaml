  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合规与法律风险
        blocks:
          - type: paragraph
            body: >-
              Netskope 为 50 多个国家和地区的企业流量提供云安全代理服务，面临的合规要求覆盖面很广。GDPR 是其最直接、最重的现实合规约束：Netskope 需经由 EMEA PoP
              节点代欧盟企业客户处理个人数据，要求签署数据处理协议（DPA）、在 Schrems II 判决后采用标准合同条款（SCC）进行欧美数据传输，并具备可验证的数据驻留控制。公司持有 ISO 27001 与 ISO
              27701 认证并设有 GDPR 专版合规页面，构建了可信的基础防护机制。FedRAMP High 授权（2024 年 1 月获批，FedRAMP Marketplace ID
              FR2019032016）带来了持续监控义务、每年第三方评估机构（3PAO）复评要求，重大变更须获赞助机构（美国退伍军人事务部）批准，构成需要持续投入团队维护的管理成本。Netskope
              向亚太和拉美拓展客户群的同时，CCPA/CPRA 适用于其监控流量的加州企业员工，沙特阿拉伯 PDPL、泰国/新加坡 PDPA 及巴西 LGPD 亦引入了属地监管约束。由于 TLS
              检查与深度数据包分析技术在部分司法辖区可能被归为军民两用出口管制类别，业务存在潜在的美国《出口管理条例》（EAR）风险。10-K 文件（FY2026，截至 2026 年 1 月 31
              日）披露，公司无重大未决法律诉讼。英国司法部采购名单将 Netskope 列为政府合规供应商，印证其正服务英国政府部门，需履行英国 GDPR 下的合规义务。
