    title: 技术 / 运营架构表
    columns:
      - 分层 / 组件
      - 角色与职责
      - 核心依赖
      - 技术风险
    rows:
      - - NewEdge Network（50+ 个 PoP）
        - 自建自有的全球云网络，负责流量引导和内联检查
        - 数据中心共址、IXP 成员资格，以及与超大规模云厂商的私有对等互联（private peering）
        - PoP 可用性中断将影响所有 SSE 服务；未发布公开 SLA 基准
      - - Zero Trust Engine（零信任引擎）
        - 单次遍历中结合身份、设备、应用、操作和数据上下文执行策略
        - 身份提供商（AD、Okta、SAML）；云应用目录；威胁情报源
        - 策略复杂度可能引入延迟；新云服务或应用更新可能导致误报
      - - Netskope Client（AgentSkope 终端代理）
        - 把设备流量导向最近的 NewEdge PoP；用本地证书拦截 TLS 流量
        - 操作系统级网络 API；用于部署的企业 MDM；证书信任链
        - 用户报告过操作系统更新导致的兼容性退化；部分应用存在绕过证书锁定（certificate pinning）的风险
      - - Cloud Exchange (CE) 集成平台
        - 开放插件框架，支持与 SIEM、SOAR、XDR 及威胁情报工具双向交换数据
        - 第三方厂商 API（Splunk、CrowdStrike、Palo Alto Networks 等）；开源 GitHub 插件仓库
        - 插件质量参差不齐；社区维护的插件可能滞后于厂商 API 变更
      - - Netskope Threat Research Labs / IOC Feed（威胁情报源）
        - 基于数百万企业用户的云端和网络遥测数据构建的专有威胁情报
        - 来自 NewEdge 的网络遥测数据；威胁情报合作伙伴关系
        - 威胁情报更新速度取决于客户群体规模；覆盖范围小于 Zscaler 或 Palo Alto Networks
    notes: >-
      架构信息综合自 Netskope 2025 年 S-1 招股说明书、官方平台页面及 Gartner SSE
      报告中的分析师观察。技术风险则依据用户评价汇总（G2、PeerSpot）和分析师评论（SDxCentral、bankinfosecurity.com）整理。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE022
      - CE027
      - CE035
