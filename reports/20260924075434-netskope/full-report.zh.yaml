      - number: '4.3'
        title: 成本结构与毛利率特征
        blocks:
          - type: paragraph
            body: >-
              毛利率持续攀升是 Netskope S-1 招股书中最引人注目的财务趋势。毛利率从 2024 财年的 59.8% 攀升至 2025 财年的 64.6%，并在 2026 财年上半年进一步升至 70.9%——约 18
              个月内提升超过 1,100 个基点。这一走势主要源于自建 NewEdge 私有网络（全球 120+ PoP 节点）展现出强大的规模效应：随着 ARR 扩张，其基础设施固定成本被摊薄至更庞大的订阅用户基数上。迈入
              70%+ 毛利率区间，确立了其与 Zscaler（毛利率 79%）同具竞争力的 SaaS 基础设施混合型平台地位。

              2025 财年运营费用总额为 $603.6M（占营收的 112%），对应 $347.9M 的毛利润，产生 $(255.7M) 的营业亏损，营业利润率为 -47.5%。2026 财年上半年，在毛利 $232.8M
              的基础上，运营费用为 $324.1M，营业亏损收窄至 $(91.3M)，营业利润率改善至 -27.8%——一年内大幅跃升 20 个百分点。Non-GAAP 营业亏损（主要扣除股权激励费用）从 2025 财年同期的
              $(123M) 收窄至 $(63M)，减亏幅度达 49%。最近五个季度中，增量 Non-GAAP 营业利润率分别为 12%、72%、72%、100% 与
              58%，表明边际新增营收已展现极高盈利能力。股权激励支出亦呈现缩减态势：2024 财年为 $61.0M，2025 财年降至 $50.8M，2026 财年上半年进一步降至 $17.6M。
