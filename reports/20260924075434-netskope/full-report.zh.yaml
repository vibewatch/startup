        - 毛利率快速向 Zscaler 79% 的 SaaS 基准靠拢；基础设施规模杠杆迎来拐点
        - 确认 NewEdge PoP 资本开支是否计入营业成本；索取单个 PoP 基础设施成本拆分
      - - 销售与营销费用（S&M）占收入比
        - 2026 财年上半年为 44.9%；2025 财年为 52.2%；2024 财年为 64.7%
        - 高——S-1 经审计营业费用
        - 随着 IPO 后品牌知名度提升，S&M 杠杆改善；2026 财年上半年绝对值下降
        - 索取新获客、增购与留存的 S&M 拆分；确认渠道佣金比例
      - - 研发费用（R&D）占收入比
        - 2026 财年上半年为 42.8%；2025 财年为 47.2%；2024 财年为 55.2%
        - 高——S-1 经审计营业费用
        - 占比虽降但仍处高位；反映为维持竞争对等所需的高额持续性平台投入
        - 索取维持性研发与增长型研发的费用分配比例；确认 AI/ML 研发投入水平
      - - 自由现金流（FCF）利润率
        - '-0.7%（2026 财年上半年，$(2.2M)）；-28.1%（2025 财年，$(151.1M)）；-51.2%（2024 财年，$(208.3M)）'
        - 高——S-1 经审计现金流量表
        - 2026 财年上半年接近 FCF 盈亏平衡属结构性拐点；确证公司从烧钱模式转向自我造血
        - 确认 2026 财年下半年 FCF 趋势；核实资本开支走势；评估营运资金动态（递延收入）
      - - 经营现金流（OCF）利润率
        - 2026 财年上半年为 +3%（2025 财年上半年为 -42%）
        - 高——S-1 经审计
        - OCF 首次转正；表明业务在扣除资本开支前已实现经营现金净流入
        - 核实 DSO/DPO 走势；确认递延收入动态能否持续支撑正向 OCF
      - - CAC 回收期
        - 未披露；以 S&M 支出除以净新增 ARR 测算的替代估算值 >24 个月
        - 低——推算自 S-1 总量数据
        - 回收期 >24 个月属企业安全 SaaS 典型水平；须按渠道与客群细分核实
        - 索取归属于新客获取对比存量扩增的 S&M 支出拆分；索取平均初始合同期限
      - - Non-GAAP 营业利润率
        - '-19.2%（2026 财年上半年，$(63M)）；-48.9%（2025 财年上半年，$(123M)）'
