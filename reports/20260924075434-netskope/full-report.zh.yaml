  - id: TV001
    title: 投资建议汇总表
    notes: 基于 2026 年 5 月 13 日 NTSK 收盘价 $10.56、FY2026 10-K 及分析师一致预期的 NTM 收入（约 $835M）；若出现新财务披露或重大竞争动态，所有投资建议均可能调整。
