      - number: '7.4'
        title: 财务与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Netskope 的财务风险特征主要体现在三条主线：可转债潜在偿付压力、IPO 后股价表现低迷以及 NRR 承压下行。10-K 披露显示，截至 2026 年 1 月 31 日，公司未偿可转债规模达
              $700.3M。公开披露摘要虽未列明转股条件与到期日，但若转股价高于当前市价（2026 年 5 月 13 日为 $10.56；对比 $19 的 IPO 发行价，2026—44%
              跌幅），持有人在到期时可能要求现金偿付而非转股，从而形成未来的大额现金偿付义务。股价较发行价下跌 44%，限制了 Netskope 以低稀释成本开展股权融资的能力，并造成“IPO
              阴霾”——早期投资机构与持股员工面临锁定期浮亏，可能诱发人才流失。NRR 出现下滑（2026 财年上半年 S-1 披露为 118% → 2026 财年全年 10-K 披露为
              116%），反映下半财年客户缩容或净扩张放缓。若 NRR 进一步滑向 110%，高成长逻辑将受到实质动摇，现已显现的估值倍数下调（股价对应 2026 财年市销率约 10 倍，而 IPO 时为 26
              倍）也将持续。2026 财年上半年自由现金流为 $(2.2M)，虽接近盈亏平衡，但对收入放缓或获客成本（CAC）上升高度敏感。累计亏损高达
              $2.1B，虽不直接构成经营约束，但表明公开市场投资者必须承受其长期亏损的历史。StockAnalysis.com 汇总的分析师共识预期显示，收入增速将从 2026 财年的 32% 放缓至 2027 财年的约
              24%，表明市场已部分消化减速风险。
