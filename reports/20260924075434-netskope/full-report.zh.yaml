  - id: FE001
    title: 产品架构图
    type: stack
    summary: >-
      Netskope One Platform 划分为四个架构层级：顶层为 AI 与前沿安全，向下依次为安全服务套件、Zero Trust Engine 控制平面，以及基础设施层的自研 NewEdge
      全球网络。所有安全服务共用一套策略引擎，流量只需检查一遍。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE022
      - CE027
      - CE032
    data:
      layers:
        - label: AI 与前沿安全层
          modules:
            - AgentSkope（AI 智能体代理）
            - AI Gateway（LLM 提示词 / 响应检测）
            - AI Guardrails（GenAI 策略执行）
            - GenAI Security（影子 AI 可视化）
          note: Launched Feb 2025 (AgentSkope); extends Zero Trust Engine to agentic AI workloads
        - label: 安全服务层（SSE）
          modules:
            - CASB（70,000+ 款应用，内联 + API）
            - Next-Gen SWG（TLS 解密检测、URL 过滤）
            - Private Access / ZTNA（替代传统 VPN）
            - DLP（机器学习分类器、3,000+ 模板）
            - DSPM / SSPM（云安全态势管理）
            - FWaaS（基于 PoP 点的 L3–L7 防火墙）
            - Remote Browser Isolation（RBI 远程浏览器隔离）
            - Secure SD-WAN（Infiot，2022 年收购）
          note: All services run in single-pass inspection; no separate appliances required
        - label: 控制与情报层
          modules:
            - Zero Trust Engine（身份 + 设备 + 应用 + 数据上下文）
            - Advanced Analytics（UEBA、跨产品遥测）
            - Threat Research Labs（自研 IOC 威胁情报源）
            - Cloud Exchange（SIEM/SOAR/XDR 插件平台）
          note: Single management console; shared policy engine across all SSE products
        - label: 基础设施层——NewEdge 网络
          modules:
            - 全球分布式部署 50+ PoP 点（自建而非租赁 CDN）
            - 直接私网对等互联：Microsoft、Google、AWS、Salesforce、Workday
            - 互联网交换中心（IXP）互联以降低延迟
            - Netskope GovCloud（FedRAMP High，由 VA 发起认证）
          note: Proprietary network; multi-year CapEx investment; no public latency SLA published
