  - id: FI002
    title: 单客经济模型传导链路
    type: flow
    summary: 单客经济链路从新客 S&M 投入开始，经过初始 ACV 和 NRR 驱动的增购，最终由 GRR 约束的客户生命周期决定长期 LTV。
    approximationNotes: >-
      Netskope 在 S-1 招股书中未直接披露 CAC。测算替代口径采用当期 S&M 总支出除以同期净增 ARR；因计入了增购和留存投入，该指标会高估新客真实 CAC。LTV 测算采用 ACV 除以流失率，并以 GRR
      作为流失率替代口径。所有测算均为方向性估计，仍需公司后续披露 CAC 与回本周期数据予以证实。
    data:
      nodes:
        - id: n1
          label: S&M 投入（新客户）
          detail: H1 FY2026 S&M 总计 $147.4M（新客与增购混合口径）；占收入比重持续下降（H1 FY2026 为 44.9%，FY2024 为 64.7%）
        - id: n2
          label: 初始合同 ACV
          detail: 单客户平均 ARR：$163.8K（2025 年 7 月）；上年同期为 $148.7K；同比增长体现上线初期即实现增购
        - id: n3
          label: NRR 驱动增购扩张
          detail: NRR 达 118%：存量客群年净增 18%；增购 ARR 脱离新客独立复合增长
        - id: n4
          label: GRR 约束的客户流失
          detail: GRR 达 96%：年流失率约 4%；按当前水平推算平均客户生命周期超过 20 年
        - id: n5
          label: 估算客户终身价值（LTV）
          detail: LTV 估算口径 = ACV / 流失率：$163.8K / 0.04 = 单客 LTV $4.1M；仅作方向性估算
        - id: n6
          label: CAC 回本周期（估算值）
          detail: 未披露；按 S&M 总额 / 净增 ARR 的替代口径估算超过 24 个月；尽调时需按分销渠道核实
      edges:
        - from: n1
          to: n2
          label: 获客投入
        - from: n2
          to: n3
          label: 按平台分层增购
        - from: n3
          to: n4
          label: 被客户流失部分抵消
        - from: n4
          to: n5
          label: 净留存 ARR × 客户生命周期
        - from: n2
          to: n6
          label: 回本周期 = CAC / ACV
    claimRefs:
      - CI004
      - CI005
      - CI006
