      - number: '8.2'
        title: 估值背景与可比公司
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月 13 日，Netskope 股价为 $10.56/股，对应约 5.0x NTM 收入（基于分析师共识预期的 ~$835M）、5.9x EV/ARR（$707M）及 5.9x
              EV/TTM 收入（FY2026 的 $709.1M）。按 $19 的 IPO 发行价计算，上市首日企业价值对应 ~10.5x EV/ARR，与一级市场 SASE 估值倍数相近：Cato Networks 在
              2023–2024 年以 ~$3.2B 估值融资 $238M（按估算 ~$280M ARR 计算约为 ~11.4x ARR），Axis Security 在 2023 年被 HPE/Aruba 以 ~$452M
              收购（约 ~12-15x ARR）。当前 5.0x NTM 倍数较 Zscaler 的 ~10x 和 Cloudflare 的 ~13x 折价 50–55%。Palo Alto Networks 对应 ~9x
              NTM，但其 FCF 利润率显著更高（~35%）；CrowdStrike 估值达 ~18x NTM，享有极高的增长溢价。估值倍数折价有其合理一面：相较同行 25–35% 的 FCF 利润率，Netskope 的
              FCF 仅在盈亏平衡线附近，且 $700.3M 可转债带来了可比公司所没有的财务杠杆。但这层折价在很大程度上反映了 IPO 动能受挫——六个月内市值从首日的 $9.5B 估值腰斩至 ~$4.2B
              EV，而非底层业务基本面发生实质恶化。收入预期从 IPO 时期（原先隐含 25%+ 增长）回落至当前共识（~18% NTM），也促成了估值重估。
            claimRefs:
              - CV013
              - CV014
