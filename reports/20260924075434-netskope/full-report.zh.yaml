  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与 NewEdge 网络
        blocks:
          - type: paragraph
            body: >-
              Netskope One 云原生安全平台围绕三大技术支柱构建：NewEdge 网络、Zero Trust Engine 以及统一产品套件。NewEdge 为 Netskope 专有全球私有云网络，拥有 50+
              个完全自建而非租用第三方 CDN 的网络接入点（PoP），并通过私有对等互联直连各大主流 SaaS 供应商。这种架构使企业流量从终端节点抵达 Microsoft 365、Google
              Workspace、Salesforce、AWS 及 Azure 时，在安全检测点与目标应用之间无需绕经公共互联网。Zero Trust Engine 在单遍 inline 云代理中一次性执行全部安全检测——包括
              CASB、SWG、ZTNA、DLP 及威胁防护——并在所有安全决策中完整保留上下文（用户身份、设备安全态势、云服务类型、活动行为及数据内容）。整套架构仅以云服务形式交付，完全摒弃任何硬件设备的采购与部署。
