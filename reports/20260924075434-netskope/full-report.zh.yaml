      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              渠道集中度是 Netskope 结构上最突出的依赖风险：2026 财年 95.3% 的收入（$709M 中的 $675.7M）来自转售商、MSP 及系统集成商等间接渠道合作伙伴，直销比例仅占
              4.7%。尽管公司未单独披露前几大渠道商的收入集中度，但该量级的间接收入意味着排名前 5 至 10 位的渠道伙伴大概率贡献了相当份额，一旦核心渠道在大平台整合（platformization）大单中倒向 Palo
              Alto Networks 或 Zscaler，便会引发客户流失或渠道脱钩风险。Microsoft 既是 Netskope 最大的生态集成伙伴，也是其最具威胁的竞争对手：2024 年推出的 Microsoft
              Entra SSE、Global Secure Access 以及 Defender for Cloud Apps 日益将 SSE 相邻功能打包进 Microsoft 365 E3/E5
              许可中，在中端市场订单上带来了价格承压风险。Palo Alto Networks 激进推进“平台化”策略，向客户提供多年期延期付款方案以引导整合至 Prisma Access，与 Netskope One
              展开正面对决。底层基础设施依赖 AWS、Azure 与 GCP（NewEdge PoP 节点与超大规模云厂商数据中心邻近或同址部署），形成了对三大公有云的依赖集中；Broadcom 收购 VMware
              后，Netskope 亦失去了一家关键的企业级基础架构集成伙伴。SASE.cloud 供应商分析与 Forrester ZTNA 报告均认可 Netskope 的竞争卡位，但同时将 Microsoft 与
              Palo Alto 列为步步紧逼的重大风险。
