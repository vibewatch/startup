  - id: FI001
    title: 商业模式与收入传导图
    type: flow
    summary: Netskope 将席位订阅逐步转成 ARR、GAAP 确认营收和毛利润；118% 的 NRR 又推动存量客户增购，形成 ARR 自我扩张循环。
