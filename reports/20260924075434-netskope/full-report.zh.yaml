  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Netskope 的主要竞争领域是安全服务边缘（SSE）市场，该市场属于 Gartner 于 2019 年率先定义的安全访问服务边缘（SASE）框架。SSE
              涵盖基于云交付的安全能力——云访问安全代理（CASB）、安全 Web
              网关（SWG）、零信任网络访问（ZTNA）、数据防泄露（DLP）以及防火墙即服务（FWaaS）——确保用户无论身处何地均可安全访问云端、SaaS 和私有应用。完整的 SASE 则在 SSE
              基础上扩展了网络路由功能，主要是软件定义广域网（SD-WAN），将安全与网络整合进统一的云原生平台。

              市场边界的界定对规模测算至关重要。狭义 SSE 测算在 2026 年通常介于每年 $1.5–$5.3 billion 之间，仅反映安全软件支出。据 MarketsandMarkets 和 Mordor
              Intelligence 统计，包含网络与 SD-WAN 在内的广义 SASE 市场规模在 2026 年介于 $15.5–$19.2 billion
              之间。若算入端点、身份与以数据为中心控制项的更广义零信任安全范畴，年支出则达 $44–$60 billion。Netskope 的直接产品布局覆盖 SSE 能力与 SD-WAN 集成（Netskope One
              SD-WAN），使其直接参与完整 SASE 范畴的竞争。

              超出 Netskope 可寻址市场的支出包括独立端点检测与响应（EDR）、传统 SIEM、硬件防火墙设备、单点邮件安全产品、身份与访问管理（IAM）以及移动设备管理（MDM）。替代方案包括现有 VPN
              基础设施（通常由 IT 运维部门管理）、本地代理设备以及拼凑式的多供应商安全技术栈——这些正是 Netskope 在企业销售周期中最常替代的系统。超大规模云厂商与大型科技公司存在自研方案（定制 SD-WAN
              或代理实现），但在替代威胁中占比很小。
