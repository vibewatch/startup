  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 收入模式与收入构成
        blocks:
          - type: paragraph
            body: >-
              Netskope 绝大部分收入来自于其 Netskope One
              云原生安全平台的订阅许可。商业模式采用按席位、按年计费，客户订购年度或多年期合同，并在合同期内按比例确认收入。平台划分为不同层级——Core（SSE 基准版）、Advanced（增配 SSPM 与 SkopeAI
              行为分析）及 Ultimate（包含 NewEdge SD-WAN 的全栈 SASE 版）——驱动存量客户持续追加增购（Upsell）以扩张 ARR。这构建了稳固的内生扩张引擎：118%
              的净收入留存率（NRR）意味着扣除流失后，存量客户每年自然拉动 Netskope ARR 增长约 18%。

              2025 财年收入为 $538.3 million（较 FY2024 的 $406.9M 同比增长 32%）。H1 FY2026 收入达 $328.5 million（同比增长
              31%），折合全年营收预期（run-rate）约 $657 million，与截至 2025 年 7 月 31 日录得的 $707 million ARR 基数吻合。收入结构大致为美洲区占比 57%、国际市场占比
              43%，H1 FY2025 与 H1 FY2026 期间国际收入占比保持稳定，印证了海外拓展正与本土业务同比例扩张。专业服务板块（实施部署、迁移及托管服务）占比较小，非重大且未单独披露。公司财年截止日为 1 月
              31 日；本章中的“FY2026”特指截至 2026 年 1 月 31 日止的财年。
