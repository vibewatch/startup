      - number: '8.3'
        title: 情景推演与敏感性分析
        blocks:
          - type: paragraph
            body: >-
              推演 Netskope 投资价值需设定三种情景。乐观情景（$16–20/股，7–9x NTM）：需依靠 SASE 平台化整合订单驱动收入维持 24%+ 增速，NRR 回升至 118%+（印证 AgentSkope
              与 ZTNA 等新模块拓展顺利），并顺利完成 $700.3M 可转债再融资。该情景隐含约 $880M 的 NTM 收入，且需同行维持高估值倍数。发生概率：25%。基准情景（$10–13/股，5–6x
              NTM）：假定收入增速为 16–20%，与分析师共识（~$820M NTM 收入）一致，NRR 企稳在 115–116%，来自 Microsoft 与 Palo Alto 的竞争压力温和。公司在 FY2027
              实现 FCF 转正，从而遏制估值倍数进一步收缩。发生概率：50%。悲观情景（$5–8/股，3–4x NTM）：触发条件为同比增速放缓至 6–12%（可能因 Microsoft Entra SSE 夺走
              Netskope 中型市场份额）、NRR 跌破 110%，或因可转债现金偿付而被迫增发股权融资。NTM 收入假设为 ~$750M。发生概率：25%。Netskope 接近盈亏平衡的 FCF（H1 FY2026 为
              $(2.2M)）意味着悲观情景并不引发即期破产危机，但可能需要高稀释性股权融资。~96% 的 GRR 为极端下行提供了收入底部支撑。分析师对 NTM
              收入的共识预期（~$835M）表明，当前市场定价基本处于基准情景中段，所含上行溢价有限。
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
