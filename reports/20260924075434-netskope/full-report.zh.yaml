      - number: '5.2'
        title: 产品模块全景图
        blocks:
          - type: paragraph
            body: >-
              Netskope One 安全产品套件覆盖 SSE/SASE 的防护范围。CASB（云访问安全代理）是平台最早推出的产品，可对 70,000+ 款云服务进行在线拦截与 API 级监控，兼顾合规应用与影子
              IT。下一代 SWG 在传统 Web 网关基础上扩展了全量 TLS 流量检测与实时威胁防护能力。Private Access（ZTNA）基于身份与上下文提供私有应用访问，替代传统 VPN。DLP
              覆盖传输中和静态存储的数据，内置机器学习分类器及 3,000+ 种预置策略模板。DSPM 持续扫描云存储（S3、GCS）中的敏感数据。SSPM 依据 M365、Salesforce 和 GitHub
              的配置基准审查 SaaS 配置偏差。FWaaS 提供云原生 L3-L7 层防火墙能力。安全 SD-WAN（源于 2022 年对 Infiot 的收购）连接分支机构。AI 安全产品矩阵——AI Gateway、AI
              Guardrails、GenAI Security 以及 AgentSkope——帮助企业管控生成式 AI 与 AI Agent 工作流。Advanced Analytics 提供 UEBA
              用户行为分析与跨平台遥测看板。
