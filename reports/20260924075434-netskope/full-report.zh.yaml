      - number: '1.4'
        title: 业务体量、财务指标与市场地位
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年底，Netskope 服务遍及 30+ 国家/地区的 4,000 多家企业客户，覆盖 30% 以上的 Fortune 100 强企业。公司全球员工约 3,100 人，主要分布在北美（约
              1,600 人）、亚洲（约 977 人）与欧洲（约 413 人），并在 Santa Clara、St. Louis、Sydney、Brussels、São Paulo、Bengaluru、Tokyo 及
              Singapore 设有办事处。

              2024 财年营收达 $600M，至 2025 年 11 月 ARR 增至约 $707M。2025 年上半年营收为 $328M（高于 2024 年同期的 $251M），同比增长约
              30%。尽管规模持续扩大，Netskope 仍处净亏损状态：2025 年上半年净亏损由 2024 年同期的 $207M 收窄至 $170M，管理层目标在 2025 财年实现自由现金流转正。公司已于 2026 年
              3 月 31 日向 SEC 递交 2025 财年 10-K 年报，但本轮尽调周期未获取毛利率、NRR 及单客经济学等具体细分数据。

              截至 2025 年 5 月，Netskope 连续四年位列 Gartner SASE 平台与 SSE 两个领域的领导者象限（Leader），与 Zscaler、Palo Alto Networks
              并列。NewEdge 网络节点自 2019 年上线以来已扩展至 60+ 全球数据中心，能在不损耗网络性能的前提下提供实时安全防护，构成打动大客户的关键卖点。截至 2026 年 5 月 13 日收盘，NTSK
              股价报约 $10.56，较 $19 的 IPO 发行价下跌约 44%，反映上市后的公开市场震荡。

              截至本报告基准日，毛利率、NRR 及 CAC 等核心指标因属于非公开披露项，尚待 2026 年 3 月 10-K 细化审查，当前缺乏公开数据交叉验证。
