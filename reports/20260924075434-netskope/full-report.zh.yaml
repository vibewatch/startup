        - 影响程度
        - 残余风险敞口
      rows:
        - label: 安全事件（内联代理）
          values:
            - 低–中
            - 严重
            - 高——若数据经代理外泄，将对品牌和 ARR 构成生死攸关的威胁
        - label: FedRAMP 授权撤销
          values:
            - 低
            - 严重
            - 高——联邦收入机会将流失；还需经历整改周期
        - label: GDPR 执法行动
          values:
            - 中
            - 高
            - 中——DPA 协议与 ISO 27701 提供可信缓释；SCC 条款仍留有残余风险
        - label: 渠道合作伙伴高度集中
          values:
            - 中
            - 高
            - 高——头部合作伙伴集中度未披露；直销收入占比较低（4.7%）
        - label: Microsoft SSE 竞品替代威胁
          values:
            - 中
            - 高
            - 中——Netskope 在 DLP 上的深度与 CASB 积累降低了近期被替代的风险
        - label: NRR 承压回落（低于 110%）
          values:
            - 中
            - 高
            - 中——116% 的 NRR 提供缓冲；收缩趋势值得持续监控
        - label: 可转债稀释 / 现金偿付义务
          values:
            - 低–中
            - 中
            - 中——条款未完全披露；股价若跌破 IPO 定价将增加现金结算风险
        - label: CEO / CTO 关键人物离职
          values:
            - 低
            - 高
            - 中——未披露公开接班人计划；创始人持股构成留任激励
    approximationNotes: 发生概率与影响程度均为定性评估，依据截至 2026 年 5 月的公开披露、评价数据汇总和分析师资料。
  - id: FR002
    title: 依赖关系图 —— Netskope 核心平台依赖
    type: dag
    summary: >-
      这张有向依赖图梳理了 Netskope One 平台对渠道伙伴（收入交付）、Microsoft（产品集成及相邻市场竞争）、超大规模云厂商基础设施（NewEdge PoP 托管）、身份提供商（零信任策略执行）、FedRAMP
      赞助（联邦市场准入）和 Infiot SD-WAN 收购（SASE 能力）的依赖。若依赖提供方中断合作或降低优先级，各项依赖都会成为风险来源。
    claimRefs:
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025
      - CR026
    data:
      nodes:
        - id: n1
          label: Netskope One 平台
          detail: 核心 SSE/SASE 平台 —— NewEdge 内联代理
        - id: n2
          label: 渠道合作伙伴（转售商 / MSP / SI）
          detail: 贡献 FY2026 收入的 95.3%；头部合作伙伴身份未披露
        - id: n3
          label: Microsoft（M365、Entra SSE、Copilot Security）
          detail: 既是集成伙伴，也带来相邻市场的竞争风险
        - id: n4
          label: AWS / Azure / GCP 基础设施
          detail: NewEdge PoP 部署在超大规模云厂商数据中心附近
        - id: n5
          label: 身份提供商（Okta、Azure AD、SAML）
          detail: 为零信任策略执行提供身份绑定
        - id: n6
          label: 美国退伍军人事务部（FedRAMP 赞助方）
          detail: 提供 ATO 赞助以获取联邦市场准入
        - id: n7
          label: Infiot SD-WAN 技术（2022 年收购）
          detail: SASE SD-WAN 能力层
        - id: n8
          label: 企业客户
          detail: 客户数 4,733 家；1,531 家 ARR >$100K
        - id: n9
          label: Palo Alto Networks（竞争威胁）
          detail: 竞争对手的平台化方案在续约时取代 Netskope
        - id: n10
          label: NewEdge PoP 网络（50+ 个自有 PoP）
          detail: 专有网络交付层
        - id: n11
          label: Broadcom/VMware（前集成合作伙伴）
          detail: 收购导致失去 SD-WAN 集成伙伴
        - id: n12
          label: 区域监管机构（GDPR、FedRAMP、PDPL）
          detail: 合规义务约束数据处理流程
      edges:
        - from: n2
          to: n8
          label: 收入交付（95.3% 为间接销售）
        - from: n3
          to: n1
          label: 面向 CASB/DLP 的 M365 API 集成
        - from: n4
          to: n10
          label: PoP 机房托管与互联
        - from: n10
          to: n1
          label: 网络交付层
        - from: n5
          to: n1
          label: 零信任策略执行
        - from: n6
          to: n1
          label: FedRAMP ATO 赞助
        - from: n7
          to: n1
          label: SD-WAN 能力
        - from: n1
          to: n8
          label: 安全服务交付
        - from: n9
          to: n8
          label: 续约时的竞争替代风险
        - from: n3
          to: n8
          label: 原生 SSE 捆绑销售（Entra SSE 竞争威胁）
        - from: n12
          to: n1
          label: 数据处理合规义务
        - from: n11
          to: n7
          label: 技术底座（收购前基础）
  - id: FR003
    title: 风险传导图 —— 财务与模型风险级联
    type: dag
    summary: >-
      这张风险传导图梳理了宏观因素和竞争压力如何层层传导至 Netskope 的财务模型。NRR 承压是核心节点：它会导致收入不及预期，继而带来股价下跌、可转债偿付压力和人才流失。Palo Alto 与 Microsoft
      的竞争替代会从上游加剧 NRR 压力；渠道合作伙伴流失既会加快竞争替代，也会直接冲击收入。对投资判断而言，NRR 是最重要的领先指标。
    claimRefs:
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
    data:
      nodes:
        - id: f1
          label: 宏观放缓 / IT 预算冻结
          detail: 客户推迟 SSE/SASE 扩容；NRR 收缩
        - id: f2
          label: 竞争替代（PANW / Microsoft）
          detail: 平台化和原生 SSE 捆绑压缩扩容带来的 ARR
        - id: f3
          label: 渠道合作伙伴流失或调低优先级
          detail: 间接收入占比 95.3%；存在头部伙伴集中度风险
        - id: f4
          label: NRR 承压（跌破 110%）
          detail: 核心财务风险指标；NRR 从 116% 降至 110%，约带来 $60M ARR 逆风
        - id: f5
          label: 收入不及预期
          detail: 分析师对 FY2027 的一致预期约为 $880M；若不及预期，估值倍数将收缩
        - id: f6
          label: 股价下跌（跌破 $8）
          detail: NTSK 现价 $10.56；进一步下跌将增加可转债稀释风险
        - id: f7
          label: 可转债偿付压力（存续规模 $700.3M）
          detail: 若到期时股价低于转股价，面临现金结算风险
        - id: f8
          label: 人才流失（工程与销售团队）
          detail: 股权处于水下会削弱留任动力；Teamblind 上有裁员相关消息
        - id: f9
          label: 产品研发投入缺口
          detail: 人才流失拖慢 AI Security 与 SD-WAN 路线图推进
        - id: f10
          label: 竞争劣势加速扩大
          detail: 产品差距扩大，护城河遭侵蚀的风险随之上升
      edges:
        - from: f1
          to: f4
          label: 预算压力减少扩容
        - from: f2
          to: f4
          label: 竞争替代拖累 NRR
        - from: f3
          to: f4
          label: 伙伴流失削弱获客与客户扩张能力
        - from: f3
          to: f5
          label: 伙伴流失直接冲击收入
        - from: f4
          to: f5
          label: NRR × ARR 基数决定收入预测
        - from: f5
          to: f6
          label: 收入不及预期压缩估值倍数
        - from: f6
          to: f7
          label: 股价低于转股价 → 现金结算风险
        - from: f6
          to: f8
          label: 股权处于水下，留任激励减弱
        - from: f8
          to: f9
          label: 人才缺口拖慢产品迭代速度
        - from: f9
          to: f10
          label: 产品差距相对 PANW/Zscaler 扩大
        - from: f10
          to: f2
          label: 产品力转弱加速竞争失利
        - from: f7
          to: f5
          label: 再融资不确定性令投资者更加谨慎
  - id: FV001
    title: 投资建议推演逻辑
    type: flow
    summary: >-
      决策流程汇集五条证据线：SSE 市场领先地位、FedRAMP 护城河、增长与 NRR、财务风险和估值折价，再权衡风险与回报，得出整体“谨慎放弃 / 观察”（CAUTIOUS PASS /
      TRACK）建议，并列出明确的买入触发条件。增长与 NRR 的证据支撑乐观情景，但财务风险和竞争威胁压低了投资信心；当前需等待两项核心催化剂明朗，再考虑调整。
    claimRefs:
      - CV009
      - CV010
      - CV011
    data:
      nodes:
        - id: n1
          label: SSE 市场领先地位
          detail: 获 FedRAMP High 认证；入选 2025 年 Gartner SSE 领导者象限；Fortune 100 强中约 1/3 为客户；具备内联代理架构
        - id: n2
          label: 增长与留存
          detail: 营收同比增长 32%；ARR $707M；NRR 116%；客户数 4,733 家；向 AgentSkope AI 安全战略转型
        - id: n3
          label: 财务风险因素
          detail: 存续 $700.3M 可转债；累计亏损 $2.1B；股价较 IPO 下跌 44%；NRR 从 118% 降至 116%
        - id: n4
          label: 估值折价
          detail: EV/NTM 约 5.0x，对比 Zscaler 10x 与 Cloudflare 13x；50-55% 折价部分合理，部分反应过度
        - id: n5
          label: 竞争威胁
          detail: Microsoft Entra SSE 借助 M365 原生扩张；Palo Alto 推行平台化；渠道集中度达 95.3%
        - id: n6
          label: 谨慎放弃 / 观察（CAUTIOUS PASS / TRACK）
          detail: 买入触发条件：NRR 连续 2 个季度稳定在 116%+，可转债再融资方案明确，且营收增速保持在 18% 以上
      edges:
        - from: n1
          to: n6
          label: 支撑
        - from: n2
          to: n6
          label: 支撑
        - from: n4
          to: n6
          label: 估值买入信号
        - from: n3
          to: n6
          label: 压制配置信心
        - from: n5
          to: n6
          label: 压制配置信心
  - id: FV002
    title: 估值敏感性分析
    type: bar
    summary: >-
      柱状图比较八种 EV/NTM 收入倍数情景下隐含的企业价值，以十亿美元计；倍数从 3x（深度看空）到 13x（按 Cloudflare 同业估值重估），并以 Netskope 当前约 5x 的倍数作为基准情景。乐观情景的
      7–9x 对应 $5.9–7.9B EV，悲观情景的 3–4x 对应 $2.5–3.3B EV。以当前约 $4.2B EV 为基准，上下行空间并不对称。
    claimRefs:
      - CV013
      - CV023
      - CV024
      - CV025
    data:
      items:
        - label: 悲观下限（3x NTM）
          value: 2.5
          detail: ~$2.5B EV；每股约 $5-6；增速放缓至 8-12%；NRR 跌破 110%
        - label: 悲观上限（4x NTM）
          value: 3.3
          detail: ~$3.3B EV；每股约 $7-8；增速 12-15%；NRR 维持在 110-113%
        - label: 基准下限（5x NTM）
          value: 4.2
          detail: ~$4.2B EV；每股约 $10.56（当前市价）；增速 16-18%；NRR 为 115-116%
        - label: 基准上限（6x NTM）
          value: 5
          detail: ~$5.0B EV；每股约 $13；增速 18-20%；NRR 稳定在 116%；FCF 转正
        - label: 乐观下限（7x NTM）
          value: 5.9
          detail: ~$5.9B EV；每股约 $15-16；增速 22-24%；NRR 回升至 117%
        - label: 乐观中值（8x NTM）
          value: 6.7
          detail: ~$6.7B EV；每股约 $17-18；增速 24-26%；NRR 达到 118%；AgentSkope 开始显现市场牵引力
        - label: 乐观上限（9x NTM）
          value: 7.6
          detail: ~$7.6B EV；每股约 $20-21；增速 25%+；赢得 SASE 整合项目；完成可转债再融资
        - label: 对标 Cloudflare（13x NTM）
          value: 10.9
          detail: ~$10.9B EV；每股约 $28-29；获得全面的平台化估值重估；需要相似的 FCF 改善路径
  - id: FV003
    title: 估值与回报区间
    type: range
    summary: >-
      区间图展示四种结果情景下的目标股价低值、中间值和高值：悲观情景（$5-8）、基准情景（$10-13）、乐观情景（$16-20）及战略并购退出情景（$13-22）。当前市价 $10.56
      正处于基准情景的中间值，说明市场按温和的基准情景定价，尚未计入上行溢价。并购退出概率较低，但能提供高于悲观情景的底部支撑。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV038
    data:
      items:
        - label: 悲观情景
          low: 5
          mid: 6.5
          high: 8
          note: 3-4x NTM 对应约 $750M；增速 6-12%；NRR 低于 110%；Microsoft 抢占中端市场
        - label: 基准情景
          low: 10
          mid: 11.5
          high: 13
          note: 5-6x NTM 对应约 $820M；增速 16-20%；NRR 为 115-116%；竞争态势温和
        - label: 乐观情景
          low: 16
          mid: 18
          high: 20
          note: 7-9x NTM 对应约 $880M；增速 24%+；NRR 回升至 118%；AgentSkope 开始显现市场牵引力
        - label: 并购退出（战略性）
          low: 13
          mid: 16.5
          high: 22
          note: 较基准情景溢价 20-30%；潜在买方为 Cisco、CrowdStrike 或 Palo Alto，交易金额为 $5-6B
  - id: FV004
    title: 核心投资 KPI
    type: kpi
    summary: >-
      面向投委会的六项核心 KPI，覆盖 Netskope 的关键估值与基本面质量信号：当前 EV/NTM 倍数（5.0x）、EV/ARR（5.9x）、营收增速（同比 32%）、NRR（116%）、FCF 利润率（H1 FY2026
      接近盈亏平衡）以及当前股价对比 IPO 发行价（-44%）。这些 KPI 将投资建议锚定在有据可查的指标上，一方面呈现相对同行的估值折价，另一方面提示 FCF 与 NRR 走势为核心监测变量。
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV013
    data:
      items:
        - label: EV / NTM 收入
          value: ~5.0x
          detail: 约 $4.2B EV 除以约 $835M NTM；相对 Zscaler（10x）与 Cloudflare（13x）折价 50-55%
        - label: EV / ARR
          value: ~5.9x
          detail: 约 $4.2B EV 除以 $707M ARR；对比 Cato Networks 2024 年私募轮融资约 11.4x ARR
        - label: 营收增速
          value: +32% YoY
          detail: FY2026 为 $709.1M，对比 FY2025 为 $537.2M；NTM 一致预期约 $835M，隐含 +18% 增速
        - label: NRR
          value: 116%
          detail: FY2026 全年数据低于 H1 FY2026 的 118%；NRR 走势需列为首要风险监测信号
        - label: FCF 利润率
          value: ~0% (H1 FY2026)
          detail: H1 FY2026 FCF 为负 $2.2M；接近盈亏平衡；预计 FY2027 实现 FCF 转正
        - label: IPO 对比现价
          value: '-44%'
          detail: IPO 每股 $19（2025 年 11 月）；现价 $10.56（2026 年 5 月）；对应基础市值约 $4.0B
