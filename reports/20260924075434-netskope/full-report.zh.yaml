      - number: '7.5'
        title: 团队、执行力与风险对冲
        blocks:
          - type: paragraph
            body: >-
              Netskope 的关键人员风险集中在两位联合创始人身上。CEO Sanjay Beri 自创立以来执掌公司 15+ 年；若其离职，将在 IPO 后规模扩张的关键阶段危及客户关系、渠道信任与战略连续性。CTO
              Krishna Narayanaswamy 同为联合创始人，主导包括 AgentSkope 在内的 AI/ML 产品架构；其离开将动摇 AI 安全差异化立论。2024 年 Teamblind 帖子提及
              Netskope 存在裁员，符合 SaaS
              企业在上市后优化盈利路径的举措，但裁员规模未获公开证实。研发团队分布于湾区总部与班加罗尔研发中心，两地人才市场竞争均十分激烈。执行风险主要有三项：其一，中型市场拓展——Netskope 的 GTM 体系针对财富
              500 强打磨，但需渗透至 500–5,000 名员工的中型企业以维持 NRR；其二，渠道管控——95.3% 的间接收入亟需精细化伙伴赋能与利润空间管理；其三，产品复杂度——业务由 SSE 扩展至完整
              SASE、AI 安全及 IoT/OT，要求严苛的优先级取舍。需重点监控的核心逻辑破损指标包括：NRR 连续两个季度跌破 110%；股价长期在 $8 以下徘徊（引发可转债或股权增发带来的额外稀释压力）；Beri 或
              Narayanaswamy 离职；丧失 FedRAMP High 授权；或出现按 SEC 网络安全披露规则公布的重大安全漏洞。
            claimRefs:
