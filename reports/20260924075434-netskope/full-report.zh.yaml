      - number: '2.3'
        title: 买方与用户客群画像
        blocks:
          - type: paragraph
            body: >-
              Netskope 及同类 SASE 厂商的主要预算决策者是首席信息安全官（CISO）；大额多年期平台合同通常由 CISO
              与首席信息官（CIO）共同决策。负责评估、推荐并日常运营方案的内部技术推动者（Champion），通常来自 IT
              安全团队、安全架构师或安全运营中心（SOC）主管。财务与采购部门承担正式付款人与审批人职责，通常要求提供商业合理性论证、多年期 ROI 模型及竞品价格对标。最终用户（网络运维、IT
              运维或开发人员）虽日常使用该产品，但极少拥有预算审批权。

              Netskope 的客群高度聚焦大型企业，财富 100 强渗透率超 30%，企业客户逾 4,000 家。价值最高的细分客群包括：(1) 受强监管行业——金融服务、医疗健康、能源——DLP、CASB
              和审计日志是驱动刚性合规支出的硬性要求；(2) 全球 2000 强企业，拥有规模庞大、高度分散且依赖云端的员工队伍，需要在跨地域环境中执行一致的管控策略；以及 (3) 云原生与数字化优先企业（科技、电商、SaaS
              公司），这类企业已彻底摒弃本地基础设施，需要原生集成的 ZTNA 与 CASB。

              中端市场企业（500–5,000 名员工）是 Netskope 正在扩张但尚未充分服务的领域。Wiz 2026 年对 300+ 位 CISO 展开的预算基准调研显示，85% 的受访者在 2026
              年增加了网络安全预算，88% 计划加大云安全投入。Dell'Oro Group 指出，安全预算正向两大 SaaS 支柱收拢——SASE/SSE 边缘安全与融合 AI 的下一代
              SIEM——相应削减了传统硬件与单点工具的预算份额。这种预算集聚趋势对 Netskope 以平台为中心的销售模式构成了实质性利好。
