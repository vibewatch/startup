      - number: '1.3'
        title: 融资历史与股东结构
        blocks:
          - type: paragraph
            body: >-
              2025 年 9 月 IPO 前，Netskope 历经 9 轮融资累计吸收约 $1.44B。融资起点为 2013 年获得 Social Capital 的 $5.5M 种子轮资金，此后轮次金额稳步攀升。2018
              年 11 月，Lightspeed Venture Partners 领投 $168.7M F 轮融资，公司估值突破 $1B 跻身独角兽行列。2020 年 2 月，疫情推高云安全需求之际，Sequoia
              Capital 领投 $340M G 轮融资，估值约三倍跃升至 $3B；同月公司推出 Private Access 产品。

              2021 年 7 月，ICONIQ Growth 领投 $300M H 轮融资，将 IPO 前估值推至 $7.5B 高位。2023 年 1 月，Morgan Stanley 领投完成 $401M
              可转债融资，成为上市前最大规模融资，Goldman Sachs Asset Management、Ontario Teachers' Pension Plan (OTPP) 及 CPP Investments
              参投，以顶级机构背书维持了 $7.5B 估值。然而 PM Insights 二级市场分析显示，受企业级 SaaS 估值倍数普遍压缩影响，2025 年 8 月公司隐含估值回落至约 $5.12B，较 H 轮折价
              31.73%。与最终 $7.3B 的 IPO 定价估值相比，这一折价也显示，IPO 定价高于此前一级市场后期交易所反映的估值水平。

              本次 IPO 发行价为每股 $19，获得 20+ 倍超额认购，募资总额约 $908M；计入超额配售权后，实际净募资达 $992.2M。主要长期风投机构包括 ICONIQ Capital、Sequoia
              Capital、Lightspeed Venture Partners、Accel 与 Sapphire Ventures，叠加 Goldman Sachs、Morgan Stanley、CPP
              Investments 及 OTPP 等机构资本，共同构成多元的股权结构表。
