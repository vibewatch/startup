  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Netskope 在 50 多个国家/地区充当企业流量的云安全代理，监管敞口十分广泛。GDPR 构成最具刚性的现行业务约束：Netskope 需经由 EMEA
              节点代表欧盟企业客户处理个人数据，必须签署数据处理协议（DPA），在后 Schrems II 时代采用标准合同条款（SCC）处理欧美数据传输，并落实可验证的数据本地化存储管控。公司持有 ISO 27001 和
              ISO 27701 认证，并发布了专门的 GDPR 合规说明，提供了可信的合规底线保障。2024 年 1 月获得的 FedRAMP High 授权（FedRAMP Marketplace ID:
              FR2019032016）带来了持续监控义务、每年 3PAO 第三方评估要求，以及重大变更须经保荐机构（美国退伍军人事务部）审批的要求，形成了须长期配备人员维系的治理成本。Netskope
              检查加州客户员工流量需受 CCPA/CPRA 管辖；随着亚太（APAC）与拉美（LATAM）客户群拓展，沙特 PDPL、泰国/新加坡 PDPA 及巴西 LGPD 亦带来特定司法管辖区要求。由于 TLS
              流量解密检查与深度数据包分析技术在部分地区可能面临两用出口管制分类，存在潜在出口管制条例（EAR）合规敞口。截至 2026 年 1 月 31 日的 2026 财年 10-K
              报告显示，公司无重大未决诉讼。英国司法部采购名录已将 Netskope 列为政府批准供应商，证实其切入英国政府部门业务并承担英国 GDPR 项下的合规义务。
