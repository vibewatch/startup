      - number: '5.5'
        title: 信任、合规与产品风险
        blocks:
          - type: paragraph
            body: >-
              2024 年 1 月，Netskope 旗下 GovCloud 平台获得 FedRAMP High 授权，由 Coalfire 评估并由 U.S. Department of Veterans Affairs
              赞助。该资质支持其部署于处理高度敏感非密级数据的联邦机构环境。S-1 披露显示，Netskope 亦持有 SOC 2 Type II、ISO 27001 与 CSA STAR
              认证，采用责任共担云安全模式运作。Gartner 在 2025 年 SSE 与 SASE 两份 Magic Quadrant 报告中均将 Netskope 列为
              Leader，认可其过硬技术实力与品牌知名度。然而，Gartner 2025 年评估同时指出了突出短板：过度聚焦大企业导致目标市场受限、控制台语言支持有限，以及新功能推出节奏相对落后于 Zscaler。G2 与
              PeerSpot 用户评价进一步印证了 SIEM 工具集成复杂、定价偏高以及偶发操作系统兼容性回退等问题。Netskope 的 FedRAMP High 认证、客户支持投诉逐年下降，以及以
              AgentSkope、AI Gateway 和 SD-WAN 路线图为代表的持续产品研发投入，部分抵消了上述已知风险。
