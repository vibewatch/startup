      - number: '5.5'
        title: 信任体系、合规资质与产品风险
        blocks:
          - type: paragraph
            body: >-
              2024 年 1 月，Netskope 旗下 GovCloud 平台获得 FedRAMP High 授权，由 Coalfire
              评估、美国退伍军人事务部赞助。该资质允许其部署于处理高度敏感非密级数据的联邦机构环境。据 S-1 披露，Netskope 还拥有 SOC 2 Type II、ISO 27001 与 CSA STAR
              认证，并按云安全责任共担模型运营。Gartner 在 2025 年 SSE 与 SASE 两份魔力象限报告中均将 Netskope 列为领导者，认可其技术能力与品牌知名度；但 Gartner 2025
              年评估也指出了明显短板：过于聚焦大型企业（限制了潜在市场空间）、管理控制台语言支持有限，以及推新节奏相对落后于 Zscaler。G2 与 PeerSpot 上的用户评价印证了其与 SIEM
              工具集成复杂、定价高于行业平均、偶发操作系统兼容性回退等问题。Netskope 凭借 FedRAMP High 认证、技术支持投诉随时间递减，以及对 AgentSkope、AI Gateway、SD-WAN
              等路线图产品的持续创新投入，在一定程度上对冲了这些已知风险。
