      - number: '1.2'
        title: 创始人、管理层与公司治理
        blocks:
          - type: paragraph
            body: >-
              Netskope 由四位技术专家联合创立：Sanjay Beri（CEO、董事长）、Krishna Narayanaswamy（CTO）、Ravi Ithal（首席架构师）以及 Lebin Cheng（2018
              年离职）。Beri 提出了以数据为中心、云原生安全的创业愿景；这一设想最初画在星巴克餐巾纸上，随后向 Symantec 前高管路演。Beri（1976
              年生）是公司对外的核心代言人与战略操盘手，构成最主要的关键人物依赖。Yahoo Finance 高管薪酬披露显示，其 2025 财年 CEO 工资与奖金总额约为 $973,000。

              CTO Krishna Narayanaswamy 在深度包检测、安全及行为异常检测领域拥有超过 25 年技术积累。他拥有 50 多项专利，联合创立 Netskope 前曾任 Juniper Networks
              杰出工程师（2004–2012 年），并创办了 Top Layer Networks（1997–2004 年）。Ravi Ithal 担任首席架构师，主导安全架构与平台底层深度开发。

              第四位联合创始人 Lebin Cheng 原任应用工程副总裁，于 2018 年离职，随后创立 ArecaBay 与
              CloudVector。其离职削弱了初创团队的技术覆盖面，但未对业务扩张造成明显冲击。管理层随后引入外部资深高管：CFO Drew Del Matto（曾任职 Citrix 与 Fortinet，拥有 MBA
              学位，2019 年加入）统领财务运营，CRO Raphaël Bousquet 负责全球 GTM。董事会成员包括 Enrique Salem（Symantec 前 CEO，2013 年 10
              月加入）、Kimberly Alexy（审计委员会主席）、Eric Wolford（治理委员会主席）、Arif Janmohamed 与 Will Griffith。上市后，Netskope 全面执行
              Nasdaq 上市标准与 SEC 披露要求。截至 2026 年 5 月，未确认发生重大高管变动。
