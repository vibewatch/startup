      - number: '7.3'
        title: 渠道伙伴与外部依赖风险
        blocks:
          - type: paragraph
            body: >-
              渠道集中度是 Netskope 最具结构性的依赖风险：FY2026 收入中有 95.3%（$709M 中的 $675.7M）流经转售商、MSP 及系统集成商等间接渠道伙伴，直销收入仅占
              4.7%。尽管公司未披露头部合作伙伴的收入集中度，但如此规模的间接收入意味着前 5 至 10 家渠道商很可能占据相当可观的收入份额；若有核心伙伴在“平台化”整合中倒向 Palo Alto Networks 或
              Zscaler，将引发客户流失或合作脱节风险。Microsoft 既是 Netskope 最大的集成伙伴，也是其最现实的竞争威胁：Microsoft Entra SSE（2024 年推出）、Global
              Secure Access 及 Defender for Cloud Apps 正加速将邻近 SSE 的功能打包塞入 Microsoft 365 E3/E5，给中型市场订单带来价格下压风险。Palo Alto
              Networks 激进推进“平台化”策略，以多年期延期付款吸引客户统一部署 Prisma Access，与 Netskope One 展开正面对决。底层设施依赖 AWS、Azure 和 GCP（NewEdge
              PoP 多托管在超大规模云厂商数据中心内部或附近），形成了对三大云巨头的集中依赖；此外，Broadcom 收购 VMware 导致其失去了一家关键的企业级基础设施集成伙伴。SASE.cloud 厂商评估与
              Forrester ZTNA 报告均认可 Netskope 的竞争卡位，但同时提示 Microsoft 与 Palo Alto 是日益严峻的风险来源。
