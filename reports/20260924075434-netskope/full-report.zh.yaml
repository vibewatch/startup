        title: 反向证据与客户投诉
        blocks:
          - type: paragraph
            body: >
              独立评价平台揭示了若干反复出现的痛点。PeerSpot 汇总反馈指出，技术支持质量差属于普遍问题——有评论者反映支持团队在关键升级期间体验糟糕。中间人代理（man-in-the-middle proxy）带来的
              SSL/TLS 流量解密检查对敏感企业应用造成兼容性问题，需要复杂微调。TrustRadius 与 PeerSpot
              用户普遍指出，初始配置、迁移以及策略管理等运维复杂度阻碍了自主顺畅运作。部分亚太地区用户反映特定区域存在网络延迟（明确提及菲律宾）。与 Zscaler 和 Microsoft
              相比，产品定价被普遍定性为“中等偏贵”，可能制约中端市场扩张。NRR 从 2026 财年上半年的 118%（S-1 披露）降至 2026 财年全年的 116%（10-K
              披露），表明下半财年出现小幅疲软或客户缩容增加。上述负面信号符合面向复杂企业环境销售大平台的典型特征：部署摩擦虽在所难免，但在 116% 的 NRR 水平下仍属可控范围。
