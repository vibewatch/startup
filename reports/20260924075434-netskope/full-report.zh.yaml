      - number: '5.3'
        title: 客户工作流与部署架构
        blocks:
          - type: paragraph
            body: >-
              企业客户在受管终端上部署 Netskope 客户端（AgentSkope），轻量级 Agent 支持 Windows、macOS、iOS、Android 与 ChromeOS，将全部
              Web、云端及私有应用流量加密引流至最近的 NewEdge PoP 节点。针对非受管设备（BYOD）场景，Netskope 借助与主流 SaaS 厂商的 API 对接，提供无需安装客户端的无代理反向代理
              CASB。位于 PoP 节点的 Zero Trust Engine 在执行策略前全面解析单次操作的五维情境：操作主体（来自 AD、Okta、SAML 的身份信息）、设备状态（安全基线评分）、目标服务（匹配
              70,000+ 应用库）、具体动作（下载、上传、外发分享）以及数据内容（DLP 分类等级）。通过 Cloud Exchange (CE) 平台对接企业现有安全软件栈，其开源插件库托管于 GitHub，涵盖
              SIEM、SOAR、XDR 及威胁情报生态。UEBA 功能可实时侦测异常下载流量或非工作时间访问等偏流行径。G2 与 PeerSpot 上的客户评价普遍肯定其部署简捷性，但指出了 SIEM
              集成复杂度以及大版本操作系统更新时的偶发兼容性隐患。
