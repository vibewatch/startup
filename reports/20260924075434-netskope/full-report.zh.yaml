      - number: '4.2'
        title: 单客经济模型与销售效率
        blocks:
          - type: paragraph
            body: >-
              Netskope 在已公开口径下的单客经济指标表现强劲，但在未披露板块依旧模糊。118% 的 NRR（高于前一年的 113%）是其标志性特征——因此 Netskope
              理论上即使不新增一家新客户，也能维持收入增长。96% 的毛留存率（GRR，高于前一年的 95%）对应综合年化客户流失率粗略为 4%，折算出的平均客户生命周期测算值逾 20 年。截至 2025 年 7 月 31
              日，单客平均 ARR 达 $163.8K，高于上年同期的 $148.7K，印证了随着客户不断加购功能模块，存量客群的合同金额持续扩大。

              获客端，H1 FY2026 销售与营销（S&M）支出降至 $147.4M，低于 H1 FY2025 的 $151.6M；同期收入则增长 31%。S&M 占收入比重从 FY2024 的 64.7% 降至
              FY2025 的 52.2%，并在 H1 FY2026 进一步降至 44.9%——上市带来的品牌效应与企业客户口碑驱动了显著的效率拐点。研发（R&D）支出占收入比重在相同周期内亦从 55.2% 降至
              47.2%，再降至 42.8%。分渠道 CAC 回收期仍未量化。结合总 S&M 支出及各期净新增 ARR 推算，新客获客成本回收期大概率超过 24 个月，这在企业级安全 SaaS
              中属常规水平，但仍须在尽调中分客群予以核实。
