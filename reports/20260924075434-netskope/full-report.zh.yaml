      - number: '8.3'
        title: 情景与敏感性分析
        blocks:
          - type: paragraph
            body: >-
              投资测算设立三类情景。乐观情景（$16–20/股，7–9 倍 NTM）：需依托 SASE 平台整合大单实现 24% 以上的持续营收增长，NRR 回升至 118% 以上（体现 AgentSkope 与 ZTNA
              等新模块的成功拓展），并妥善完成 $700.3M 可转债的展期或再融资。该情景对应约 $880M 的 NTM 收入，并要求同业维持高估值倍数。发生概率：25%。基准情景（$10–13/股，5–6 倍
              NTM）：假设收入增速为 16%–20%，符合分析师共识（NTM 收入约 $820M），NRR 企稳于 115%–116%，面临来自 Microsoft 与 Palo Alto 的温和竞争压力。公司在 2027
              财年实现自由现金流转正，遏制估值倍数进一步收缩。发生概率：50%。悲观情景（$5–8/股，3–4 倍 NTM）：触发因素包括增速降至 6%–12%（可能由 Microsoft Entra SSE 侵蚀
              Netskope 中端市场份额导致）、NRR 跌破 110%，或为可转债现金偿付而被迫增发股权。假设 NTM 收入约 $750M。发生概率：25%。Netskope 接近盈亏平衡的自由现金流（2026
              财年上半年为 $-2.2M）意味着悲观情景下并无即时破产风险，但可能招致高稀释度的股权融资。约 96% 的 GRR 为收入受损情景构筑了安全底线。分析师共识预期的 NTM 收入（约
              $835M）表明，市场当前定价偏向中性基准情景，未给予明显上行溢价。
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV003
            claimRefs: []
      - number: '8.4'
        title: 逻辑证伪与止损准则
        blocks:
          - type: paragraph
            body: >-
              设立六项核心逻辑证伪触发条件，一旦触发即刻清仓或终止投资。首要关键项：NRR 连续两个财季跌破 110%，表明大企业流失加速，或在中端市场成体系败给 Microsoft Entra SSE。NRR 跌至 110%
              及以下将彻底抹去成长溢价，导致 Netskope 估值向基础架构即服务（IaaS）同业的 3–4 倍市销率看齐。第二项：全年营收增速连续两个季度低于 15%，表明中端市场趋于饱和且在 Fortune 100
              中渗透乏力。第三项：经核实或测算 Microsoft Entra SSE 在单一年度内导致现有客群 ARR 流失逾 5%，证实其构成结构性威胁。第四项：$700.3M
              可转债到期须以现金清偿且未完成再融资，届时或被迫在 $10–12/股低位折价增发，严重稀释现有股东权益。第五项：FedRAMP
              核心认证遭撤销，或发生客户数据经在线代理外泄的重大安全事故，此类毁灭性品牌打击很可能导致联邦机构与合规行业客户 ARR 快速瓦解。第六项：Palo Alto Networks 平台化捆绑销售在 12 个月内导致逾
              5% 的 ARR 客户倒戈。每月常规监控指标包括：NTSK 股价相对可转债转股价走势、季度 NRR 趋势、渠道合作伙伴反馈的竞品替代动向，以及 SEC 披露的任何重大负面进展。
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV005
            claimRefs: []
      - number: '8.5'
        title: 尽调补充核查项与退出就绪度
        blocks:
          - type: paragraph
            body: >-
              在做出高确定性投资决策前，仍需跟进六项关键尽调核查。首要项是索取 $700.3M 可转债的完整契约与条款清单（term
              sheet）：包括转股价、到期日、票面利率、看跌/看涨期权条款及控制权变更条款。若转股价高于当前市价
              $10.56，到期现金偿还构成重大潜在偿债义务。第二项：按季度拆解细分客群（中小企业、商业客户、大型企业、联邦政府）的 NRR 数据，查明从 118% 降至 116% 的下滑是否主要集中在 Microsoft
              威胁最大的中端市场。第三项：前 5 大与前 10 大间接渠道伙伴在 2026 财年 ARR 中的收入占比；在间接渠道占比高达 95.3%
              的背景下，核心渠道合作伙伴流失构成重大风险，而当前公开披露无法获知这一数据。第四项：截至 2027 财年第一季度（2026 年 4 月）AgentSkope 的商机储备（pipeline）与 ARR
              贡献，此项为乐观情景的核心增长催化剂，但目前尚未量化。第五项：过去四个季度针对 Zscaler 与 Microsoft Entra SSE 的竞标胜负数据，包含交易规模、中标率及替代竞品指标。第六项：IPO
              后按职能划分的员工流失率数据，鉴于当前股价下多数员工的股权激励已深度破发。退出就绪度方面：公司已完成 IPO，公开市场投资者可通过二级市场交易获取退出流动性。并购退出潜在情景：Cisco、CrowdStrike
              或 Palo Alto Networks 可能以较当前股价溢价 20%–30% 的水平（$13–14/股）发起收购，对应 $5–6B 的交易规模。此情景虽非基准情景，但鉴于公司优质的 ARR、NRR
              以及联邦政府认证资质，构成合理备选退出路径。
            claimRefs:
