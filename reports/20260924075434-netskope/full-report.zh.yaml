        - 年化流失率仅 4%；绝对流失风险低；同比呈改善趋势
        - 按订单规模核实 GRR；索取客户流失数与 ARR 流失额的对比数据
      - - 单客平均 ARR
        - ~$163.8K（2025 年 7 月 31 日；推算值：$707M / 4,317）；上年为 $148.7K
        - 高 —— 根据 S-1 推算（审计的 ARR 与客户数）
        - ACV 持续走高表明增购势头良好；大企业客户占比正在提升
        - 索取 ACV 分布数据（中位数、第 25 与 75 百分位，以及前 10 大客户在 ARR 中的占比）
      - - 毛利率
        - H1 FY2026 为 70.9%；FY2025 为 64.6%；FY2024 为 59.8%
        - 高 —— S-1 审计利润表
        - 毛利率快速提升，逐步逼近 Zscaler 79% 的 SaaS 基准；基础设施规模效应开始显现
        - 核实 NewEdge PoP 资本开支是否计入营业成本；索取各 PoP 点基础设施成本明细
      - - 销售与营销费用率
        - H1 FY2026 为 44.9%；FY2025 为 52.2%；FY2024 为 64.7%
        - 高 —— S-1 审计经营费用
        - IPO 后品牌知名度提升，销售费用杠杆随之改善；H1 FY2026 销售与营销费用绝对额也在下降
        - 索取新客获取、存量扩张与客户留存的销售费用拆分；确认渠道佣金率
      - - 研发费用率
        - H1 FY2026 为 42.8%；FY2025 为 47.2%；FY2024 为 55.2%
        - 高 —— S-1 审计经营费用
        - 费用占比虽下降但仍处高位；要维持平台竞争力，仍需持续投入大量资金
        - 索取维持性研发与增长型研发的费用分配；确认 AI/ML 研发投入规模
      - - 自由现金流（FCF）利润率
        - H1 FY2026 为 -0.7%（$(2.2M)）；FY2025 为 -28.1%（$(151.1M)）；FY2024 为 -51.2%（$(208.3M)）
        - 高 —— S-1 审计现金流量表
        - H1 FY2026 自由现金流接近盈亏平衡，是结构性拐点；业务正从消耗现金转向自我造血
        - 核实 H2 FY2026 自由现金流趋势；验证资本开支走势；评估营运资金动态（递延收入）
      - - 经营现金流（OCF）利润率
        - H1 FY2026 为 +3%（H1 FY2025 为 -42%）
        - 高 —— S-1 审计
        - 经营现金流首次转正；表明业务扣除资本开支前已能从经营活动中产生现金
        - 核实应收 / 应付账款周转天数（DSO/DPO）的变化；确认递延收入能否持续支撑经营现金流为正
      - - CAC 回本周期
        - 未披露；按销售费用除以净增 ARR 粗略估算 >24 个月
        - 低 —— 根据 S-1 汇总数据推算
        - 回本周期 >24 个月在企业安全 SaaS 领域较为普遍；需按渠道和客群进一步确认
        - 索取新客获取与存量扩张对应的销售费用；索取平均初始合同期限
      - - Non-GAAP 营业利润率
        - H1 FY2026 为 -19.2%（$(63M)）；H1 FY2025 为 -48.9%（$(123M)）
        - 高 —— S-1 披露的 non-GAAP 调节表
        - Non-GAAP 亏损一年内收窄 50%；主要调节项是正在下降的股权激励费用（SBC）；照此趋势，未来 2–3 个季度有望达到 Non-GAAP 盈亏平衡
        - 确认 non-GAAP 调节明细项；验证 IPO 后 SBC 下降轨迹是否具有持续性
