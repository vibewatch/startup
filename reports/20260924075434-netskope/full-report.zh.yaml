      - number: '3.2'
        title: 核心竞品对比
        blocks:
          - type: paragraph
            body: >-
              Zscaler 是 Netskope 按营收规模看最直接的竞争对手。Zscaler 在 FY2025 实现 $3.015 billion ARR（同比增 22%），并在 Q1 FY2026 达 $3.204
              billion ARR（同比增 26%）；截至 2025 年 7 月 31 日，其递延收入达 $2.468 billion，前瞻能见度极强。其 Zero Trust Exchange
              凭借零信任网络访问覆盖广度与流量检测基础设施规模形成核心壁垒。Palo Alto Networks Prisma SASE 展现出最出色的 AI/ML 安全能力与最深入的平台集成度，尽管 Gartner
              将定价复杂与主要支持英语服务列为短板；该厂商此后推行基于站点的许可模式以简化销售打包复杂度。

              Cato Networks 于 2023 年以 $3 billion 估值完成 $238 million 融资，在青睐单一厂商全栈 SASE 模式的专业技术人员中被公认为架构更优：其原生骨干网将所有 SASE
              组件统一集成于单一云平台，并配备由 90+ 个 PoP 组成的全球私有网络。Cloudflare One 部署了 320+ 个全球 PoP，采用基于使用量的定价模式，主打开发者导向与云原生企业。Fortinet
              FortiSASE 融合自身 SD-WAN 底蕴与 SSE，主攻中端市场及现有客户群。              Microsoft Entra Internet Access 则依托强大的身份平台与 M365
              捆绑优势，以接近于零的边际成本提供 ZTNA 与 SWG，对已将 IT 架构标准化在微软生态的大客户群体构成沉重的纯 SSE 厂商定价压力。
