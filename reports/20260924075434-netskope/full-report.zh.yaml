  - id: FE001
    title: 产品架构全景图
    type: stack
    summary: >-
      Netskope One 平台划分为四层架构：顶层为 AI 与前沿安全，向下依次为安全服务套件、Zero Trust Engine 控制平面，以及底层专有 NewEdge
      全球网络基础设施。全部安全服务共享统一策略引擎与单次流量检查通道。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE022
      - CE027
      - CE032
    data:
      layers:
        - label: AI 与前沿安全层
          modules:
            - AgentSkope（AI Agent 代理）
            - AI Gateway（LLM 提示词/响应检测）
            - AI Guardrails（生成式 AI 策略执行）
            - GenAI Security（影子 AI 资产可视性）
          note: Launched Feb 2025 (AgentSkope); extends Zero Trust Engine to agentic AI workloads
        - label: 安全服务层（SSE）
          modules:
            - CASB（支持 70,000+ 应用，串联 + API）
            - Next-Gen SWG（TLS 流量解密检查、URL 过滤）
            - Private Access / ZTNA（替代传统 VPN）
            - DLP（机器学习分类器、3,000+ 预置模板）
            - DSPM / SSPM（云安全态势管理）
            - FWaaS（基于 PoP 节点的 L3–L7 防火墙）
            - 远程浏览器隔离（RBI）
            - Secure SD-WAN（源自 2022 年收购的 Infiot）
          note: All services run in single-pass inspection; no separate appliances required
        - label: 控制与情报层
          modules:
            - Zero Trust Engine（身份 + 设备 + 应用 + 数据上下文）
            - Advanced Analytics（UEBA 与跨产品遥测分析）
            - Threat Research Labs（专有威胁情报 IOC 订阅源）
            - Cloud Exchange（集成 SIEM/SOAR/XDR 的插件平台）
          note: Single management console; shared policy engine across all SSE products
        - label: 基础设施层——NewEdge 网络
          modules:
            - 全球分布的 50+ 处 PoP 节点（自主建设，非 CDN 租用）
            - 直连专有对等互联：Microsoft、Google、AWS、Salesforce、Workday
            - 互联网交换中心（IXP）互联以降低访问延迟
            - Netskope GovCloud（由退伍军人事务部发起，获 FedRAMP High 认证）
          note: Proprietary network; multi-year CapEx investment; no public latency SLA published
