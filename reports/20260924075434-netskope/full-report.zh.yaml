      推算流失率）。所有测算均为方向性预估，仍需公司披露的 CAC/回收期数据进一步确认。
    data:
      nodes:
        - id: n1
          label: S&M 投入（新客户获取）
          detail: H1 FY2026 S&M 总计 $147.4M（含新客与存量增购）；营收占比持续下降（H1 FY2026 为 44.9%，FY2024 为 64.7%）
        - id: n2
          label: 首签合同 ACV
          detail: 单客平均 ARR：$163.8K（2025 年 7 月），上年同期为 $148.7K；同比持续增长反映入驻阶段增购
        - id: n3
          label: NRR 驱动的增购扩张
          detail: 118% NRR：存量客群年净增 18%；增购 ARR 脱离新客独立实现复利增长
        - id: n4
          label: GRR 约束下的客户流失
          detail: 96% GRR：年化流失率约 4%；按当前水平推算平均客户生命周期逾 20 年
        - id: n5
          label: 客户 LTV 估算值
          detail: LTV 估算公式 = ACV / 流失率：$163.8K / 0.04 = 单客生命周期 $4.1M；仅作方向性参考
        - id: n6
          label: CAC 回收期（估算替代指标）
          detail: 未披露；基于 S&M 总支出 / 净新增 ARR 推算回收期 >24 个月；需在尽调中分渠道核实
      edges:
