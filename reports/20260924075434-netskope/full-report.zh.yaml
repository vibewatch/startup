        - 若转股价高于当前股价 $10.56，现金清偿风险将构成重大未来负债
      - - 分季度按客户群组与客群细分（SMB、商业、大企业、联邦政府）拆分 NRR
        - 关键
        - 管理层宣讲 / CFO 访谈
        - 118% 至 116% 的收缩可能集中于腰部市场；需分客群能见度以量化评估 Microsoft 冲击
      - - 渠道合作伙伴收入集中度——前 5 大与前 10 大伙伴占 FY2026 ARR 比例
        - 关键
        - Data room / 渠道伙伴管理团队
        - 间接收入占比达 95.3%，单一主要伙伴流失可能导致重大收入缺口
      - - 截至 Q1 FY2027（2026 年 4 月）AgentSkope 商业商机管线与 ARR 贡献
        - 高
        - 产品 / 销售访谈
        - 乐观情景的核心增长催化剂；目前公开未量化；须验证兑现节奏与体量
      - - 过去 4 个季度针对 Zscaler 与 Microsoft Entra SSE 的竞对赢单/丢单数据
        - 高
        - 销售运营 / Data room
        - 量化评估 Microsoft 威胁与 Zscaler 价格压力；对建立 NRR 走势模型至关重要
      - - IPO 后按职能划分的员工流失率；股权激励重定价/增发方案
        - 中
        - 人力资源 Data room
        - 股价较 IPO 破发 44% 致多数期权潜水；人才流失风险加剧，工程研发团队尤甚
      - - 可转债展期进展及董事会层面资本结构审查
        - 高
        - CFO 访谈 / 董事会纪要
        - 债券很可能于 3-5 年内到期；在当前破发股价下再融资是核心风险变量
