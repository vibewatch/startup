  - number: 4
    title: 财务表现
    sections:
      - number: '4.1'
        title: 收入模型与业务构成
        blocks:
          - type: paragraph
            body: >-
              Netskope 绝大部分收入来自 Netskope One 云原生安全平台的订阅许可。商业模式按座位、按年计费，客户签订年度或多年期合同并在合同期内按比例确认收入。平台分层机制——Core（基础版
              SSE）、Advanced（增加 SSPM 及 SkopeAI 行为分析）与 Ultimate（涵盖 NewEdge SD-WAN 的完整 SASE）——支撑现有客户通过向上增购推高
              ARR。这形成了一个高持续性的增购引擎：118% 的 NRR 表明扣除客户流失后，存量客户每年为 Netskope ARR 带来约 18% 的内生净增长。

              2025 财年营收达 $538.3M（较 2024 财年的 $406.9M 同比增长 32%）。2026 财年上半年实现营收 $328.5M（同比增长 31%），折合年化营收运行率约为 $657M，与截至
              2025 年 7 月 31 日的 $707M ARR 规模吻合。收入地理结构中，美洲区占约 57%，国际市场占约 43%；2025 财年上半年与 2026
              财年上半年国际收入占比保持稳定，印证海外扩张正与本土增长同频并进。公司亦提供少量专业服务（包括部署实施、数据迁移与托管运维），但体量微小未单独拆分披露。公司财年截至 1 月 31 日；本章所称“2026
              财年”特指截至 2026 年 1 月 31 日之年度。
