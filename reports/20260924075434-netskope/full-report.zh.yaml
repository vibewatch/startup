  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局总览
        blocks:
          - type: paragraph
            body: >-
              Netskope 所在的企业级 SSE/SASE 赛道正逐步成熟，竞争格局已集中于少数几家头部厂商。Gartner 2025 年 SSE 领导者象限评定 Netskope、Zscaler 与 Palo Alto
              Networks 为三大领导者（Leader），确立了第一梯队的稳固地位。Zscaler 在营收体量上占据领头羊地位，进入 2026 财年时 ARR 达到约
              $3.2B，得益于早期建立的零信任网络先发优势、150+ 全球数据中心，以及日均处理超过 300B 次交易的旗舰平台 Zero Trust Exchange。Palo Alto Networks
              具备最深厚的平台覆盖能力，依托全套 SASE 产品线打通 Prisma Access、AI/ML 驱动安全以及 SD-WAN。

              在挑战者梯队中，Cato Networks 具备最鲜明的架构差异化优势，其在原生单层云软件栈中深度融合 ZTNA、SWG、FWaaS 与 SD-WAN，相比 Netskope 附加外挂式的 SD-WAN
              方案具备结构性优势。Cisco 坐拥庞大的企业客户群，并在 sase.cloud 2026 年 SASE 厂商评估榜单中拿下最高分（42/50），体现出强大的 MSP 适配性与产品广度。Cloudflare
              One 依托 320+ 全球 PoP 节点，以激进价格在开发者及中小企业客群中推广 ZTNA 与 SWG。Fortinet FortiSASE 整合 SD-WAN 积淀与
              SSE，主攻中型市场及多分支机构客户。Microsoft 则在 M365 订阅中捆绑销售 ZTNA/SWG，凭借庞大存量客户构成现实威胁。在 sase.cloud 榜单中，Netskope 以 38/50
              的得分位列第五，排在 Cisco、Cato、Palo Alto 与 Zscaler 之后，反映出其虽在以数据为中心的安全领域壁垒深厚，但在全平台广度及 SD-WAN 成熟度上逊于竞品。
