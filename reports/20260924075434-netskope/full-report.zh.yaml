  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局全景
        blocks:
          - type: paragraph
            body: >-
              Netskope 处于日趋成熟的企业级 SSE/SASE 市场中，其竞争格局已向少数具备规模实力的头部企业集中。Gartner 2025 年 SSE 魔力象限将 Netskope、Zscaler 及 Palo
              Alto Networks 列为三大领导者（Leaders），确立了其第一梯队地位。Zscaler 凭借在零信任网络领域的先发优势、150+ 个数据中心以及日均处理逾 300 billion 笔事务的标杆性
              Zero Trust Exchange 平台，在步入 2026 财年之际以约 $3.2 billion ARR 占据最强收入身位。Palo Alto Networks 依托 Prisma Access、AI/ML
              驱动安全与 SD-WAN 的全面集成，展现出最宽广的 SASE 全产品矩阵纵深。

              在挑战者阵营中，Cato Networks 构筑了最具架构差异化的平台，将 ZTNA、SWG、FWaaS 与 SD-WAN 原生融合为单一云技术栈——相比 Netskope 附加式 SD-WAN
              方案具备结构性架构优势。Cisco 拥有最大的企业客户基础，并在 sase.cloud 2026 年 SASE 厂商评分卡中排名第一（42/50 分），印证了其在 MSP
              适配度与业务广度上的深厚积累。Cloudflare One 依托 320+ 个全球 PoP，以积极的定价提供 ZTNA 与 SWG，重点争取开发者与中小企业客户。Fortinet FortiSASE 融合自身
              SD-WAN 底蕴与 SSE，主攻中端市场及现有客户群。Microsoft 则通过 M365 订阅捆绑 ZTNA/SWG，构成日益严峻的现状替代威胁。Netskope 在 sase.cloud 评分卡中以
              38/50 分位列第 5，排在 Cisco、Cato、Palo Alto 和 Zscaler 之后——反映出其以数据为中心的安全优势显著，但在全栈广度与 SD-WAN 成熟度上不及同行。
