      - number: '1.5'
        title: 关键发展里程碑
        blocks:
          - type: paragraph
            body: >-
              Netskope 自 2012 年创立以来，跨越融资、产品与治理方面的多座里程碑。2013 年 10 月，公司结束隐身模式并发布首款商用 CASB 产品，Enrique Salem 同月进入董事会。2017 年
              7 月收购 Sift Security，补充 IaaS 云安全能力。2019 年 7 月上线 NewEdge 网络基础设施。2020 年 2 月完成 G 轮融资并同步推出 Private
              Access，借力疫情期间激增的远程办公需求提速业务增长。

              2021 年 7 月完成 H 轮融资，估值攀升至 $7.5B，创下 IPO 前最高估值纪录。2023 年 1 月完成可转债融资并平价维持 $7.5B 估值，Goldman Sachs 与 Morgan
              Stanley 借此进入股权结构表。2025 年 8 月向 SEC 递交 S-1 前夕，二级市场数据显示其隐含估值回落至约 $5.1B。2025 年 9 月 17 日，IPO 定价每股 $19，9 月 18
              日开始交易，并在 9 月 22 日全额行使超额配售权闭市，最终净募资 $992.2M。NTSK 目前作为 Nasdaq 挂牌股票交易，面临每季度财报披露合规要求，且 IPO 后 180 天禁售期解禁（约在
              2026 年 3 月）带来结构性抛压风险。

              核心负面警示包括：联合创始人 Lebin Cheng 于 2018 年离职；二级市场估值在 2021 年至 2025 年中从 $7.5B 缩水至约 $5.1B；截至 2026 年 5 月 NTSK
              股价较发行价破发约 44%。截至本报告基准日，公开渠道未见 Netskope 实施大规模裁员的确认记录。
