chapter:
  number: 7
  title: Risks
  summary: >-
    Divert's dominant risk is capital intensity: 30 planned facilities at ~$90M+ each implies $2.7B+
    in total capex, roughly $1.6B+ beyond disclosed committed financing as of mid-2026, with each
    remaining facility requiring an independent project-finance event. The depackaging-microplastics
    regulatory gap is the most asymmetric operational risk—no standardized digestate measurement
    protocol exists, multiple states are actively drafting rules, and land-application restriction is
    a plausible outcome that would impair the third revenue stream. RNG policy risk is real but
    partially differentiated from the manure-digester sector targeted by the USDA pause and
    Earthjustice litigation; D3 RIN basis exposure remains material. Leadership execution risk is
    elevated by the COO vacancy since March 2025, a CFO with ~one year of tenure, and a wholesale
    C-suite rebuild in 2024–2025. Customer concentration is structurally opaque with no per-customer
    revenue or contract data disclosed despite a handful of Fortune 100 grocery chains likely
    representing a disproportionate share of service-fee volume.

sections:
  - id: executive-risk-summary
    title: Risk Landscape Overview and Severity Ranking
    body: >-
      Divert operates at the intersection of climate technology, food infrastructure, and regulated
      waste management—three domains with overlapping risk exposure. The company's capital-intensive
      infrastructure buildout is the primary thesis-check: at ~$90M+ per facility and 30 facilities
      targeted by 2031, total capex requirement exceeds $2.7 billion. Against $1.09B+ in committed
      project financing (Enbridge $1B, Nuveen $90M+ for Lexington), roughly 18 facilities remain
      without disclosed financing. Each new facility requires an independent permitting process,
      project-finance negotiation, feedstock agreement, and pipeline interconnection—a sequential
      dependency chain that creates significant execution risk at scale.

      The second tier of risk is regulatory uncertainty around depackaging byproducts: no
      standardized measurement method exists for microplastics in digestate, multiple states are
      drafting rules, and future land-application restrictions would impair Divert's soil-amendment
      revenue. Third is RNG policy risk: the USDA loan pause extended through December 2026 and
      Earthjustice litigation target manure digesters, not food-waste facilities, but adversely
      affect the sector's investor and regulatory sentiment. Fourth is leadership execution risk
      from the March 2025 COO departure, a new CFO, and four VP-level hires completed only in
      December 2024. Fifth is customer concentration opacity: per-customer revenue is undisclosed
      despite dependence on a small number of large grocery chains. The risk heatmap in this chapter
      maps all identified risks by likelihood and impact.
