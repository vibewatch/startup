        - COO appointment announcement; CEO or CFO departure announcement; Series C lead investor change
        - Ryan Begin or Brad Lukow departs in the next 12 months without a named successor
        - Material risk — investor confidence in Series C terms and strategic continuity impaired
    notes: >-
