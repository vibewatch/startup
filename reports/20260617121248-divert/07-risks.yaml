callouts:
  - calloutType: risk
    title: Highest-Priority Diligence Ask — Capital Adequacy and COO Succession
    body: >-
      Two blocking gaps prevent full risk assessment. First, the adequacy of the Series C round
      (amount, structure, and new investors) is undisclosed as of mid-2026; given that each
      unbuilt facility requires $90M+ in project financing, the gap between committed capital
      ($1.09B+) and the buildout plan ($2.7B+) is the primary thesis-check. Second, the COO
      role has been vacant or informally covered since March 2025; given the scope of the
      COO function at Divert (ops, finance, legal, people, IT), the absence of a named successor
      14+ months later is a material organizational gap. Both gaps require NDA-level access
      to Divert's cap table and org chart to resolve.
    claimRefs:
      - CR021
      - CR036
      - CR050

  - calloutType: risk
    title: Adverse Finding — USDA and Sector Headwinds Do Not Spare Food-Waste Operators
    body: >-
      The USDA loan-guarantee pause, extended through December 31, 2026, and the Earthjustice
      coalition's rulemaking petition are formally directed at manure-based digesters. Divert
      processes food waste, not livestock manure, and is therefore partially insulated from
      the primary policy target. However, the broader coalition—CLF, Farm Forward, Food &
      Water Watch, Sentient Media—opposes all methane-capturing digesters on climate grounds,
      characterizing RNG as "greenwashing" and calling for elimination of all AD subsidies.
      The reputational and legislative risk does not stop at manure operations. Divert's
      investor messaging explicitly features carbon-negative RNG and digestate as circular
      economy credentials; any regulatory or media spillover that casts doubt on food-waste
      AD's climate benefits directly affects investor appetite for the Series C and future
      project-finance rounds.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR041
      - CR044

