  - id: customer-concentration-and-revenue-opacity
    title: Customer Concentration and Revenue Opacity Risk
    body: >-
      Divert's service-fee revenue structure is anchored by a small number of large grocery chains
      that individually represent multi-year, multi-store relationships without public disclosure
      of contract values, renewal dates, or exclusivity terms. The company confirmed partnerships
      with five Fortune 100 companies and named anchor accounts including Kroger, Ahold Delhaize
      (Giant, Stop & Shop, Hannaford), Albertsons, Safeway, Harris Teeter (Kroger-owned), and
      CVS—but discloses no revenue breakdown by customer, segment, or geography.

      Giant Food's 163-store, $0-disclosed-value partnership processed nearly 80 million pounds
      since 2022 and is the most documented single account; the account involves the full Ahold
      Delhaize USA banner ecosystem, confirmed by a corporate-level testimonial. Harris Teeter
      separately removed more than 40 million pounds with Divert in a single year, confirming a
      second large-volume relationship. Customer location growth of 22% in 2024 alongside 52%
      volume growth implies new industrial accounts (USCS, Blue Diamond) carry disproportionate
      per-customer volume, creating early-stage industrial concentration risk that is not offset
      by any disclosed long-term industrial contract structures.

      The revenue opacity risk manifests in two ways: first, any anchor account non-renewal
      creates a simultaneous feedstock supply disruption for the nearest AD facility and a
      service-fee revenue decline—a double impact. Second, as facility RNG revenue scales and
      each facility's economics depend on 100,000 tons/year throughput at full capacity,
      interruption of feedstock supply from a major retailer directly impairs the facility-level
      returns that underpin the entire project-finance structure. No public NRR, GRR, or churn
      data exist. The structural RFID-bin and data-platform switching friction provides some
      retention tailwind, but is not a contractual guarantee.
    claimRefs:
