  - id: TR005
    title: Mitigation and Kill-Criteria Table
    layout: wide
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Capital funding gap (18+ facilities unfunded)
        - Series C close size; Enbridge next facility drawdown; Nuveen follow-on for facilities 4–6
        - Series C < $100M, or Enbridge drawdown delayed >6 months, or no new project-finance partner announced by end-2026
        - Thesis break — re-assess 30-facility plan viability; model 10-facility downside scenario
      - - Digestate / microplastics land-application restriction
        - State rulemakings adding enforceable microplastics limits for AD digestate; EPA guidance update
        - Any state with a Divert facility (CA, WA, NC) bans or materially restricts land application of depackaged digestate
        - Material risk — soil-amendment revenue stream impaired; facility-level economics recalculated
      - - RNG policy / subsidy withdrawal
        - USDA REAP permanent food-waste digester exclusion; 45Z credit repeal; D3 RIN eligibility removal
