  - id: people-execution-and-downside-scenarios
    title: People, Execution Risk, and Downside Scenarios
    body: >-
      Divert's leadership team underwent material transition in 2024–2025 while simultaneously
      scaling from one to thirty planned facilities. Co-founder and COO Nick Whitman—who had led
      operations, finance, legal, people, IT, and fundraising for nearly 18 years—transitioned to
      a board advisory role in March 2025. His operational replacement has not been publicly named
      as of mid-2026, consolidating broad executive responsibility on CEO Ryan Begin. CFO Brad
      Lukow joined approximately one year before the Mitsubishi Series C announcement; his tenure
      covers his first major capital raise as Divert CFO. Four VP-level hires were made in
      December 2024 (industrials, IT, food service, transportation/supply chain), representing
      a full C-suite rebuild at the same time the company accelerated its facility buildout.

      The COO vacancy is material because the COO function spans facilities permitting, operational
      ramp, supply chain logistics, and compliance across distributed sites—exactly the functions
      most critical to a 28-facility expansion. The absence of a publicly named successor creates
      diligence uncertainty about organizational depth. Ara Partners' institutional oversight and
      the board-level presence of both Begin and Whitman mitigate continuity risk, but cannot
      substitute for day-to-day operational leadership.

      Three downside scenarios frame the thesis-break analysis. In Scenario A (financing stalls),
      an insufficient Series C or Enbridge drawdown delay prevents 10+ planned facilities from
      reaching construction, freezing Divert below the scale needed for profitable national
      density. In Scenario B (digestate regulation), a state imposes land-application restrictions
      on depackaged digestate, impairing the third revenue stream and weakening facility-level
      economics across all operating sites. In Scenario C (RNG policy collapse), D3 RIN
      elimination or 45Z credit repeal materially reduces RNG revenue, raising the hurdle for
      new project finance and potentially requiring feedstock-mix changes to maintain IRR. Any
      single scenario would be manageable; a combination of two or more during the 2026–2028
      buildout window would likely be thesis-breaking.
