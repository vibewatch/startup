  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capex-gap
      missingEvidence: >-
        Series C closing size, structure (equity vs. debt), valuation, and new investor
        identities beyond Mitsubishi; facility-level P&L and IRR data for Turlock and Longview.
      whyItMatters: >-
        Without knowing the Series C size, it is impossible to assess whether the capital gap
        between disclosed financing ($1.09B+) and the 30-facility buildout ($2.7B+) is
        closing. Facility-level IRR data would allow independent modeling of when the
        buildout becomes self-financing.
      diligencePath: >-
        Request Series C term sheet and investor list under NDA; obtain Turlock and Longview
        facility-level P&L and cost-per-ton data from management; model drawdown schedule
        against Enbridge $1B commitment.
      relatedQuestionRefs:
        - QR006
        - QR015
        - QR023
        - QR030

    - type: private-evidence-only
      severity: blocking
      topic: COO-vacancy
      missingEvidence: >-
        Identity and start date of the replacement for co-founder COO Nick Whitman, who
        transitioned to board advisory role in March 2025; organizational chart showing
        reporting structure after the COO transition.
      whyItMatters: >-
        The COO role at Divert historically covered operations, finance, legal, people, IT,
        and strategic planning; 14+ months without a named replacement represents an
