summary:
  headline: >-
    Divert has assembled a defensible end-to-end food waste circular economy platform with genuine operational switching
    costs, but its $1B+ Series C valuation implies revenue well above two-facility run-rate reality and complete
    financial opacity precludes independent underwriting, warranting a track posture pending disclosure.
