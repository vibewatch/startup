  topStrengths:
    - >-
      End-to-end Prevent-Provide-Power® integration — RFID data capture, reverse logistics, proprietary depackaging, and
      anaerobic digestion — creates structural switching costs and a proprietary data feedback loop that no
      single-service competitor replicates at this scale.
    - >-
      Anchor grocery contracts with confirmed multi-year tenure (Giant Food 163 stores / 80M+ lbs, Kroger, Albertsons)
      and bp's $175M 10-year RNG offtake validate commercial traction across both service-fee and energy-revenue
      streams.
    - >-
      Diversified strategic investor base (Ara Partners, Enbridge, Mitsubishi, Nuveen) provides capital runway and
      global RNG offtake optionality for the 30-facility national buildout, with Mitsubishi's preferred offtake rights
      structurally incentivizing continued support.
  topRisks:
    - >-
      Capital adequacy gap: 30-facility buildout requires $2.7B+ total capex vs. ~$1.09B in committed financing, leaving
      a $1.6B+ shortfall that requires facility-by-facility independent project-finance events under uncertain RNG
      economics.
    - >-
      Complete financial opacity — no disclosed revenue, ARR, gross margin, or facility-level unit economics — makes
      independent valuation underwriting impossible; the $1B+ mark implies $220–$570M in revenue that Divert cannot
      currently demonstrate with two operational facilities.
    - >-
      COO vacancy since March 2025 combined with wholesale C-suite rebuilding in 2024–2025 elevates execution risk on
      simultaneous national expansion and complex infrastructure project delivery.
    - >-
      Microplastics contamination in digestate outputs is an unresolved regulatory liability as multiple U.S. states
      draft land-application rules, threatening the soil-amendment revenue stream and raising capex uncertainty for
      future facilities.
    - >-
      RNG policy risk from USDA digester loan pause and potential D3 RIN basis deterioration could impair energy
      economics; natural gas price compression below $70/bbl oil scenarios would reduce RNG offtake value across the
      facility network.
  unresolvedGaps:
    - >-
      Revenue, ARR, gross margin, facility-level P&L, and cash position remain wholly undisclosed; NDA-level financial
      access is required for independent underwriting.
    - >-
      COO succession: identity and start date of the replacement for Nick Whitman (vacant since March 2025) have not
      been publicly confirmed.
    - >-
      Full Series C terms (total equity raised, pre-money valuation, Mitsubishi stake size, all investors) remain
      undisclosed; the round was still open as of April 2026.
    - >-
      Customer concentration: per-banner revenue share and contract terms for top anchor accounts (five Fortune 100
      companies likely representing disproportionate service-fee volume) are not disclosed.
    - >-
      Independent third-party digestate microplastics testing results have not been published, leaving the regulatory
      exposure and soil-amendment revenue durability unquantified.
