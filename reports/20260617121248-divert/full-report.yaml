  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope
        blocks:
          - type: paragraph
            body: >-
              Divert's market is best understood as the intersection of two adjacent value chains: U.S. commercial food
              waste diversion services and organics-to-renewable-natural-gas (RNG) infrastructure. On the services side,
              the company sells logistics, data analytics, certified destruction, donation optimization, and depackaging
              solutions to grocery retailers, food manufacturers, warehouses, and distributors. On the infrastructure
              side, Divert owns and operates Integrated Diversion & Energy Facilities that convert the collected
              organics into RNG and fertilizer. Both layers target the same underlying problem: the ~70 million tons of
              U.S. surplus food generated annually, of which roughly 29% is classified as food waste going to disposal
              destinations (CM002, CM047).

              The market boundary excludes residential food waste, farm-level crop loss, consumer-facing apps, and
              general solid waste hauling without a food-diversion mandate. Divert's core addressable supply is
              commercial food waste from establishments with meaningful organic waste volume—primarily grocery retailers
              and industrial food operators. Status-quo substitutes are landfill disposal (still the single largest
              commercial waste destination at ~21% of retail surplus in 2024), municipal composting collection, and
              single-service waste haulers that lack integrated depackaging or data services (CM040, CM043). The total
              value of industry surplus food in 2024 was $122 billion (excluding consumer plate waste), illustrating the
              financial scale of the problem Divert is positioned to solve (CM045). Retail's unsold food share was 3.98
              million tons in 2024, representing $26.9B in lost sales for the sector—a compelling ROI anchor for
              prevention-focused services (CM004). Residential food waste (33.5% of total surplus) and farm-level losses
              (24.2%) are outside Divert's core scope but may represent future adjacencies (CM006).
