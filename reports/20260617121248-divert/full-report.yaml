        title: Exhibits
        blocks:
          - type: callout
            title: Highest-Priority Diligence Ask — Capital Adequacy and COO Succession
            body: >-
              Two blocking gaps prevent full risk assessment. First, the adequacy of the Series C round (amount,
              structure, and new investors) is undisclosed as of mid-2026; given that each unbuilt facility requires
              $90M+ in project financing, the gap between committed capital ($1.09B+) and the buildout plan ($2.7B+) is
