      - number: '4.5'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality at Divert is structurally credible: multi-year service contracts embed switching costs via
              RFID platform integration, and RNG offtake agreements with bp and Mitsubishi provide forward revenue
              certainty at the facility level. The 52% volume growth and 22% location expansion in 2024 are strong
              commercial momentum proxies (CI013, CI012). Global food waste costs are projected at $540B/yr by 2026 per
              Avery Dennison/CEBR (CI049), and the AD market grows at 6.86% CAGR through 2032 (CI051), supporting
              long-run pricing and contract renewal assumptions.

              However, the complete absence of revenue, margin, EBITDA, and cash-position disclosure makes meaningful
              independent financial underwriting impossible (CI044). Capital intensity is the central risk: the
              30-facility buildout requires $2.7B+ in capex (CI033), substantially exceeding current disclosed
              commitments, and each new facility depends on serial project-finance closes, regulatory permits, feedstock
              agreements, and RNG offtake deals (CI034). Depackaging regulatory uncertainty and microplastics compliance
              exposure (BioCycle, CI045, CI046) could add unforeseen cost headwinds. Anaergia's Q1 2026 continued net
              losses despite positive Adj. EBITDA illustrate the structural D&A and financing drag in asset-heavy AD
              models (CI040). Customer revenue concentration among top grocery chains is undisclosed (CI048). The
              financial verdict: revenue model is well-structured and margin path is plausible, but capital intensity is
              severe and the information opacity constitutes a blocking diligence gap requiring NDA-level access to
              facility-level P&Ls, cost-per-ton data, cash burn, and specific offtake economics before any defensible
