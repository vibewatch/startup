      - number: '6.4'
        title: Retention, Contract Durability, and Switching Friction
        blocks:
          - type: paragraph
            body: >-
              Divert does not publicly disclose NRR, GRR, churn rates, or contract terms, making direct retention
              measurement impossible from public sources. Three proxies indicate high structural switching friction.
              First, multi-year program evidence: Giant Food's partnership ran continuously from June 2022 through at
              least February 2025 with program expansion—165 stores at year one, 163 stores at the milestone report (a
              minor banner reconfiguration, not shrinkage). The unnamed Mid-Atlantic RFID grocery chain ran the program
              for at least five consecutive years from 2017. The three unnamed PNW chains have maintained the program
              since 2017—over eight years as of mid-2026. Second, operational integration: Divert's RFID bins embedded
              in store back rooms require staff training, reverse logistics coordination, and bin-replacement logistics
              to unwind; monthly store-level waste benchmarks accumulate and cannot be replicated by a competitor
              without re-running parallel collection for 12+ months. Third, regulatory lock-in: customers in California,
              Massachusetts, and Washington depend on Divert's certified destruction documentation and facility
              proximity for statutory compliance (SB 1383, MassDEP ban, WA Organics Law), creating switching costs that
              are partly statutory. Customer testimonials on Divert's official channels (Ahold Delhaize USA, Safeway
              Northern California, Albertsons Portland Division, USCS, Blue Diamond) are uniformly confirming. No
              publicly announced customer churn, contract loss, or negative third-party review has been identified; the
              absence of adverse evidence is a weak positive signal but is not a retention metric.
