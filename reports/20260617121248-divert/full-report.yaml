  - id: FU004
    type: flow
    title: Customer workflow integration flow
    layout: standard
    summary: >-
      Six integration touchpoints that embed Divert into the customer's operational workflow, creating structural
      switching costs beyond contractual lock-in.
    data:
      nodes:
        - id: n1
          label: RFID Bin Deployment
          detail: >-
            Physical RFID-tagged collapsible bins placed in store back rooms or industrial loading areas. Removing them
            requires bin-return logistics, staff retraining, and redeployment of competing collection infrastructure — a
            non-trivial operational unwind even with contract termination.
        - id: n2
          label: Reverse Logistics Chain Integration
          detail: >-
            Daily backhaul schedule integrated with the retailer's existing distribution center operations (store → DC →
            Divert facility). This tightly couples Divert's pickup schedule to DC scheduling and labor, making
            substitution disruptive.
        - id: n3
          label: Monthly RFID Analytics and Benchmarks
          detail: >-
            Monthly store-level unsold food reports build an accumulating historical benchmark. Switching forfeits
            multi-year trend comparisons; rebuilding equivalent data requires running parallel collection for 12+
            months.
        - id: n4
          label: Feeding America MealConnect Integration
          detail: >-
            Divert's bin data feeds into Feeding America's MealConnect platform to identify donation opportunities.
            Disconnecting Divert disrupts the donation-optimization loop and retailer's food bank relationships.
        - id: n5
          label: Compliance Documentation
          detail: >-
            Certificates of destruction, diversion tonnage records, and sustainability impact reports issued per service
            event. Industrial customers in CA, MA, and WA depend on this paper trail for statutory compliance; replacing
            the supplier requires re-establishing an equivalent audit trail.
        - id: n6
          label: RNG / Fertilizer Circular Loop
          detail: >-
            Facility-level RNG and fertilizer outputs are tied to Divert's specific AD facility location and utility
            interconnection agreements. A competing facility would need comparable positioning, which is not feasible at
            most current Divert locations given long facility-permitting timelines.
