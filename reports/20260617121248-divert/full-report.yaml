      - number: '5.5'
        title: Product and Technology Risks
        blocks:
          - type: paragraph
            body: >-
              Divert's product and technology stack carries several material risk vectors. First, microplastics
              contamination: a 2025 peer-reviewed study in Frontiers in Sustainable Food Systems found microplastic
              concentrations of 120 to 3,300+ MP/kg in food-waste AD digestate at a co-digestion facility, with PET
              fibers (consistent with packaging residues) dominant. The study found that depackaging quality control and
              feedstock composition directly influence MP levels, creating potential land-application liability for
              Divert's fertilizer output. An industry panel at ReFED's 2026 Food Waste Solutions Summit confirmed there
              are no standardized benchmarks for depackaging output purity, and NRDC has flagged the gap as unresolved.
              Second, IP risk: Divert claims its depackaging and AD processes are "proprietary" and "high-recovery," but
              no patent filings, technical specifications, or published process data have been found. The competitive
              moat is operational integration — sticky customer contracts, multi-year data accumulation, proprietary bin
              infrastructure, and co-located facility assets — not IP. Third, capex and throughput risk: facility builds
              have experienced delays (Longview opened approximately two years after original target) and the total
              capex for 30 facilities is not public. Throughput ramp from facility opening to full capacity is also not
              publicly validated. EPA regulations require AD facilities to comply with air, solid waste, and water
              permitting requirements, adding regulatory complexity to each new siting.
            claimRefs:
