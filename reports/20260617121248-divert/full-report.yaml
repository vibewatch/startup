          description: Digestate processed into soil amendment; Longview capacity 450,000 lbs/yr; land-applied locally
        - label: Customer Data Feedback Loop
          layer: Data & Intelligence
          description: Facility-level processing data fed back upstream to inform retailer purchasing and donation decisions
        - label: Sustainability & Impact Reporting
          layer: Outputs
