  - id: FV001
    title: Recommendation Logic Chain
    type: flow
    layout: wide
    summary: >-
      Evidence chain from Divert's operational and financial profile through comparable-set analysis and risk assessment
      to the final Track recommendation and Stretched valuation stance.
    data:
      nodes:
        - id: A
          label: 'Operational Evidence: 7,800+ locations, 630M lbs 2024, 2 AD facilities operational, 30-facility roadmap'
        - id: B
          label: >-
            Financing Evidence: >$1B mark (Series C Mitsubishi); Enbridge 10% + $1B infra; Nuveen $90M+; bp $175M
            offtake
        - id: C
          label: 'Financial Opacity: Zero disclosed revenue, EBITDA, ARR, or facility-level P&L'
        - id: D
          label: 'Comparable Analysis: Anaergia 2.2x EV/Rev (thin EBITDA); WM/RSG 4.4-4.7x (30% EBITDA); Enviri 1.76x'
        - id: E
          label: >-
            Risk Assessment: ~$1.6B+ capex gap; RNG subsidy exposure; methane leakage risk; USDA digester delinquency
            precedent
        - id: F
          label: 'Strategic Premium: Mitsubishi offtake optionality; global RNG platform; Ara Partners PE discipline'
        - id: G
          label: >-
            Valuation Stance: STRETCHED — $1B+ exceeds public-comp anchors; infrastructure replacement cost well below
            mark
        - id: H
          label: >-
            Recommendation: TRACK — NDA data room required; Track pending financial disclosure; strategic investors may
            find fair
      edges:
        - from: A
          to: D
        - from: B
          to: D
        - from: C
          to: G
        - from: D
          to: G
        - from: E
          to: G
        - from: F
          to: G
        - from: G
          to: H
    approximationNotes: >-
      Flow is illustrative of the logical chain from evidence to recommendation; not a causal model. Node labels include
      estimates that are not verified by public disclosure.
