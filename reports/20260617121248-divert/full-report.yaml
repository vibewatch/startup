    title: Valuation and Return Range by Scenario
    type: range
    layout: standard
    summary: >-
      Bear, base, and bull scenario valuation ranges for Divert, with current $1B+ entry mark shown as reference. Based
      on public-comp multiples applied to scenario-specific revenue estimates.
    data:
      items:
        - label: Bear scenario EV (USD M) — 3-5 facilities, RNG economics compress
