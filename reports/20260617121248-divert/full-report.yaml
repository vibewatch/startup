  - id: FV002
    title: Valuation Sensitivity to Revenue Multiple
    type: bar
    layout: standard
    summary: >-
      Revenue implied by Divert's >$1B valuation at various EV/Revenue multiples drawn from the public comparable set.
      Highlights how much revenue is needed to justify the current mark.
