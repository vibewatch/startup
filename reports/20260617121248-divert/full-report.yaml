companyProfile:
  summary: >-
    Divert, Inc. is a West Concord, Massachusetts circular economy company founded in 2007 that prevents and diverts
    commercial food waste through an integrated Prevent-Provide-Power® platform. Its system spans RFID-based store-level
    unsold food tracking, reverse logistics, proprietary depackaging, and co-located anaerobic digestion that converts
    food waste into renewable natural gas, CO2, and organic soil amendments. The company serves approximately 7,800
    retail and industrial customer locations across all 50 U.S. states, operates two Integrated Diversion & Energy
    Facilities in Turlock, CA (December 2024) and Longview, WA (April 2026), and is building toward a 30-facility
    national network backed by Ara Partners, Enbridge, Mitsubishi Corporation, Nuveen Energy Infrastructure Credit, and
    Wittington Investments. The April 2026 Series C led by Mitsubishi elevated Divert's valuation above $1 billion;
    Mitsubishi also received preferred RNG offtake rights as part of the deal.
  foundedDate: '2007-01-01'
