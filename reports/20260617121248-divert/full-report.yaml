  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Landscape Overview and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Divert operates at the intersection of climate technology, food infrastructure, and regulated waste
              management—three domains with overlapping risk exposure. The company's capital-intensive infrastructure
              buildout is the primary thesis-check: at ~$90M+ per facility and 30 facilities targeted by 2031, total
              capex requirement exceeds $2.7 billion. Against $1.09B+ in committed project financing (Enbridge $1B,
              Nuveen $90M+ for Lexington), roughly 18 facilities remain without disclosed financing. Each new facility
              requires an independent permitting process, project-finance negotiation, feedstock agreement, and pipeline
              interconnection—a sequential dependency chain that creates significant execution risk at scale.

              The second tier of risk is regulatory uncertainty around depackaging byproducts: no standardized
              measurement method exists for microplastics in digestate, multiple states are drafting rules, and future
              land-application restrictions would impair Divert's soil-amendment revenue. Third is RNG policy risk: the
              USDA loan pause extended through December 2026 and Earthjustice litigation target manure digesters, not
              food-waste facilities, but adversely affect the sector's investor and regulatory sentiment. Fourth is
              leadership execution risk from the March 2025 COO departure, a new CFO, and four VP-level hires completed
              only in December 2024. Fifth is customer concentration opacity: per-customer revenue is undisclosed
              despite dependence on a small number of large grocery chains. The risk heatmap in this chapter maps all
              identified risks by likelihood and impact.
