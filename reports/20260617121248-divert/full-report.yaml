          exceeding current facility design
        - >-
          Compliance capex increases per facility; digestate fertilizer revenue stream restricted; customer value
          proposition diminished
        - >-
          Engage technical team to verify Divert facility monitoring protocol; confirm facility-level methane
          measurement against any proposed standard
      - - 'Competitor displacement: WM/RSG food-waste AD roll-up'
        - >-
          WM or RSG acquires a major food-waste AD platform (e.g., Vanguard Renewables) and bundles AD capacity with
          national retailer waste contracts
        - >-
          Customer churn accelerates; Divert loses exclusive retail growth optionality; pricing pressure from integrated
          incumbent
        - >-
          Seek NDA on top-10 customer concentration and contract tenure; evaluate defensive M&A with aligned food-waste
          logistics partner
    notes: >-
      Trigger thresholds are qualitative estimates based on publicly available operational and market data. Specific RIN
      prices, EBITDA impacts, and competitor scenarios are inferred from comparable precedents; Divert has not disclosed
      facility-level economics or sensitivity modeling.
    claimRefs:
      - CV028
      - CV030
      - CV032
      - CV034
      - CV039
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Revenue and EBITDA
        - Divert has disclosed no revenue, gross margin, EBITDA, cash position, or burn rate in any public source
        - >-
          Without financials no verifiable comp multiple or runway analysis is possible; the $1B+ mark is entirely
          unanchored from an LP perspective
        - >-
          Management NDA data room: request quarterly P&Ls, facility-level revenue breakdown (service fees vs. RNG vs.
          fertilizer), and trailing EBITDA
      - - Series C full terms and cap table
        - >-
          Total equity raised in Series C, all investor names, pre-money/post-money split, liquidation preferences, and
          dilution schedule are undisclosed
        - >-
          Preference overhang from Enbridge equity, Nuveen project debt, and new Series C investors may materially
          compress common equity returns; over-subscribed rounds can further dilute earlier LPs
        - >-
          Request full cap-table model with waterfall from CFO Brad Lukow; confirm preference stacks and anti-dilution
          provisions
      - - Facility-level unit economics
        - >-
          Per-facility revenue (service fees + RNG + fertilizer), operating costs, EBITDA, and debt service coverage for
          Turlock CA and Longview WA are not publicly disclosed
        - >-
          Bull and base case valuations depend entirely on per-facility economics; only 2 operational sites provide real
          data; extrapolating to 30 facilities without per-facility P&L is speculative
        - Request Turlock CA and Longview WA monthly P&Ls and debt service schedules as part of NDA due diligence
      - - Mitsubishi offtake pricing and tenure
        - >-
          Specific pricing, volume, floor/ceiling structures, tenure, and termination rights of Mitsubishi preferred RNG
          offtake agreement are not disclosed
        - >-
          Offtake contracts underpin the bull/base scenarios; if priced at or below RNG spot with no floor, the
          strategic premium embedded in the $1B+ mark is significantly reduced
        - >-
          Request Mitsubishi offtake term sheet summary; confirm pricing mechanism (indexed vs. fixed), volume
          take-or-pay, and tenure relative to project-finance tenor
      - - Project finance pipeline for next facilities
        - >-
          Committed lenders and financing terms for Lexington NC (beyond Nuveen) and the next 5–8 facilities have not
          been announced
        - >-
          Each facility is an independent project-finance event; debt availability depends on capital-market conditions
          and project-level risk profile; the capital gap of ~$1.6B+ is real and unresolved
        - >-
          Request project finance pipeline with lender term-sheet status for NC facility and any announced Ohio,
          mid-Atlantic, or Southeast sites
      - - Customer concentration and NRR
        - >-
          Revenue share from top-10 customers, contract durations, termination rights, renegotiation frequency, and net
          revenue retention rate are not disclosed
        - >-
          High concentration among a few grocery chains creates churn risk; without NRR data, the service-fee revenue
          quality and predictability cannot be assessed
        - >-
          Request revenue-by-account breakdown (top 10 customers), contract tenure distribution, and NRR by cohort
          (2022–2025 vintage)
    notes: >-
      Diligence items are ordered by criticality for a financial-return investor. Items 1–3 are blocking; items 4–6 are
      material. All items are private-evidence-only gaps that require NDA access to resolve.
    claimRefs:
      - CV007
      - CV005
      - CV022
      - CV033
      - CV036
