              A 2025 Frontiers in Sustainable Food Systems peer-reviewed study found microplastic concentrations of 120
              to over 3,300 MP/kg in food-waste AD digestate, with PET fibers (consistent with packaging residues)
              dominant. Depackaging quality control directly influences contamination levels. Divert has not disclosed
