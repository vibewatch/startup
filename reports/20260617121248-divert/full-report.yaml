        - label: Bull scenario EV (USD M) — 15-20 facilities, $500-800M revenue
          low: 3000
          high: 5000
        - label: Infrastructure replacement cost (USD M) — 2 operating + 1 in-build
          low: 180
          high: 360
        - label: Current financing mark (USD M) — Series C implied
          low: 1000
          high: 1100
    approximationNotes: >-
      Bear/base/bull ranges derived from scenario revenue estimates times public-comp EV/Revenue multiples.
      Infrastructure replacement cost estimated at $90-120M/facility for 2 operational + 1 in-construction. Current
      financing mark is a floor estimate; actual Series C mark may be higher. All figures in USD millions; carry high
      uncertainty due to undisclosed Divert financials.
