  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context, Financing Structure, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Divert's valuation entered unicorn territory on April 14, 2026, when Mitsubishi Corporation (MC) led the
              company's Series C financing and the announcement explicitly stated the partnership "elevating the company
              to a valuation of over $1 billion" (CV001). This is the first publicly confirmed valuation mark for
              Divert; earlier rounds were not accompanied by disclosed marks. The Series C combines two distinct
              instruments: a direct equity investment by Mitsubishi and, inseparably, preferred offtake rights for
              renewable natural gas at future Divert facilities beyond the North Carolina plant (CV002). This bundled
              equity-plus-offtake structure is atypical of pure-play infrastructure transactions and signals that
              Mitsubishi's investment thesis is driven by long-term energy access and strategic RNG supply for Japan,
              not only financial return (CV041).

              The cap-table context is material for understanding the valuation. Ara Partners, the
              industrial-decarbonization private equity firm with ~$6.6B AUM, has held a controlling stake since its
              2021 acquisition (CV006). Enbridge, the Canadian pipeline giant, holds a 10% equity stake acquired through
              its March 2023 $80M growth-equity investment, alongside a $1 billion infrastructure development commitment
              that represents project-finance capacity rather than paid-in equity (CV003). BP secured a ~$175M, 10-year
              RNG offtake agreement covering three specific existing facilities (CV004). Nuveen Energy Infrastructure
              Credit provided $90M+ in project debt to fund the Lexington, North Carolina facility (CV005). The
              aggregate of committed project finance plus pre-Series-C equity totals approximately $1.09B—covering less
              than half of the $2.7B–$3.6B estimated to complete the 30-facility national buildout (CV022).

              Critically, Divert has never disclosed revenue, EBITDA, ARR, cash position, or facility-level margin data
              in any public filing or press release (CV007). The $1B+ valuation is therefore unanchored to verifiable
              financial metrics and cannot be underwritten at the public-market level without NDA access. The CFO Brad
              Lukow confirmed in April 2026 that the Series C round remains open and that "other infrastructure funds
              are circling as potential investors" (CV008), implying the round is not fully subscribed. AgriInvestor
              quoted Ara Partners' Cory Steffek describing Divert as "nearly outpacing the entire RNG market"—a
              characterization with no numerical substantiation in public data (CV009). The entry discipline
              implication: strategic investors pricing RNG optionality and regulatory tailwinds can justify current
              levels; financial-return LPs without access to facility economics should require an NDA data room before
              committing capital.
