              development agreement (CI029) targeting the 30-facility buildout, plus Nuveen Energy Infrastructure
              Credit's $90M+ for the Lexington, NC facility alone (CI030). Ara Partners confirms Divert's portfolio
              position as a private equity plus infrastructure investment (CI050); TIAA-linked Nuveen brings $1.3T+ in
