          - type: callout
            title: Adverse Finding — USDA and Sector Headwinds Do Not Spare Food-Waste Operators
            body: >-
              The USDA loan-guarantee pause, extended through December 31, 2026, and the Earthjustice coalition's
              rulemaking petition are formally directed at manure-based digesters. Divert processes food waste, not
              livestock manure, and is therefore partially insulated from the primary policy target. However, the
              broader coalition—CLF, Farm Forward, Food & Water Watch, Sentient Media—opposes all methane-capturing
