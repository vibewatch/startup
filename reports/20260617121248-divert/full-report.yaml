      - number: '5.3'
        title: Depackaging, Anaerobic Digestion, and Circular Outputs
        blocks:
          - type: paragraph
            body: >-
              At the processing facility, Divert's high-recovery depackaging technology mechanically separates food from
              its packaging, producing a clean liquid slurry. Packaging is commingled and rendered unidentifiable — a
              feature marketed to food manufacturers as certified destruction to protect brand integrity. Certificates
              of destruction, photos, videos, and sustainability impact reports are provided to industrial clients. The
              liquid slurry is fed into co-located anaerobic digestion (AD) tanks, where microbial activity converts
              organic matter into biogas. The biogas is upgraded to renewable natural gas (RNG) and the digestate is
              processed into nutrient-rich fertilizer. At the flagship Longview, WA facility (opened April 2026),
              full-capacity output is 235,000+ MMBtu of RNG and 450,000 lbs of fertilizer per year from 100,000 tons of
              food waste — enough to power 3,200+ homes and offset 23,000 metric tons of CO2e. Divert describes its RNG
              as "carbon-negative," but no public lifecycle analysis has been disclosed. The Blue Diamond Growers
              partnership (September 2024) extends this model to almond processing byproducts at the Turlock, CA
              facility, demonstrating industrial versatility. BioCycle industry reporting confirms depackaging
              deployment is accelerating nationally, driven by tipping-fee economics, labor savings, and food-waste
              diversion regulations.
