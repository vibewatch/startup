      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Divert's Data Moat Is Currently Unmatched
            body: >-
              Among all identified competitors—including Vanguard Renewables, Denali, BTS Bioenergy, and Anaergia—none
              has publicly disclosed a prevention-oriented, RFID-enabled data analytics platform comparable to Divert's
              store-level shrink reporting and inventory optimization tools. This data layer creates embedded switching
              costs that a commodity hauling or depackaging service cannot replicate simply by undercutting on tipping
              fees.
            calloutType: strength
            claimRefs:
              - CP044
              - CP035
          - type: callout
            title: Denali-Walmart Deal Is a Direct Adverse Signal
            body: >-
              Walmart, the largest U.S. food retailer by store count, chose Denali's depackaging-only model for
              1,400-plus locations—demonstrating that a simpler, non-integrated alternative can capture Fortune 1 scale
              retail volume without Divert's data analytics, donation routing, or owned AD-to-RNG infrastructure. This
              is the strongest piece of disconfirming evidence against Divert's thesis that the bundled model is
              necessary for large grocery buyers. Diligence should determine whether Walmart is a current or prospective
              Divert customer, and what this deal implies for Divert's total addressable account universe.
            calloutType: risk
            claimRefs:
              - CP013
              - CP016
              - CP041
          - type: callout
            title: Vanguard's BlackRock-Backed Scale Trajectory Is Divert's Most Serious Infrastructure Rival
            body: >-
              Vanguard Renewables targets 100 AD facilities by 2028, compared to Divert's 30-facility long-term roadmap.
              With BlackRock's balance sheet behind it, Vanguard can deploy capital faster, accept lower near-term
              facility returns to win feedstock contracts, and build route density in the same geographies Divert is
              targeting. If Vanguard wins food- manufacturer and retailer feedstock agreements in the Northeast and
              Midwest before Divert's pipeline facilities come online, it could foreclose the geographic network density
              that underpins Divert's unit economics.
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP040
              - CP047
          - type: callout
            title: BTS Bioenergy Confirms AD Buildout Execution Risk Is Sector-Wide
            body: >-
              BTS Bioenergy's pattern—one completed U.S. facility after four years, a scrapped California project,
              wastewater compliance failures, and an underutilized $100 million capital commitment—is not unique to a
              poorly managed operator. It reflects the documented capital-intensive, permitting-constrained, and
              operationally complex reality of U.S. food-waste AD development. Investors in Divert's 30-facility roadmap
              should weight this execution risk appropriately when evaluating Divert's buildout timeline and cost
              projections.
            calloutType: insight
