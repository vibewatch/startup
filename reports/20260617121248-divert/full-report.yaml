        - id: microplastics_reg
          label: Microplastics / Digestate Regulation
          description: No std protocol; state rulemaking active; land-application restriction plausible
        - id: rng_policy
          label: RNG Policy / D3 RIN Risk
          description: USDA pause extended; 45Z credit / D3 RIN basis exposed to federal policy reversal
        - id: leadership_risk
          label: Leadership / Execution Risk
          description: COO vacant; CFO ~1 yr; 4 VP hires Dec 2024; C-suite rebuild at peak buildout
        - id: customer_conc
          label: Customer Concentration Opacity
          description: Top grocery chains undisclosed revenue share; no contract terms public
        - id: facility_buildout
          label: Facility Rollout Execution
          description: 28 of 30 facilities not yet operational; permitting, construction, ramp each a risk event
        - id: rng_revenue
          label: RNG Revenue Stream
          description: Energy sales to BP and future offtake partners; facilities 4–30 uncovered
        - id: service_fee_revenue
          label: Service Fee Revenue
          description: Tipping fees from 7,800+ locations; feedstock supply for AD facilities
        - id: digestate_revenue
          label: Digestate / Soil Amendment Revenue
          description: Third revenue stream; directly at risk if microplastics regulation tightens
        - id: project_finance
          label: Project Finance Availability
          description: Each new facility requires Enbridge drawdown + co-lender; impaired by risk events upstream
        - id: valuation
          label: Valuation / IRR Outcome
          description: Series C valuation; investor returns; dependent on multi-stream facility economics
      edges:
        - from: capex_gap
          to: facility_buildout
          label: Unfinanced facilities cannot break ground
        - from: microplastics_reg
          to: digestate_revenue
          label: Land-application restriction impairs third revenue stream
        - from: rng_policy
          to: rng_revenue
          label: D3 RIN decline or 45Z repeal compresses RNG margin
        - from: leadership_risk
          to: facility_buildout
          label: COO vacancy and C-suite instability slow permitting/ops ramp
        - from: customer_conc
          to: service_fee_revenue
          label: Anchor defection reduces service-fee volume and AD feedstock
        - from: customer_conc
          to: facility_buildout
          label: Feedstock disruption undermines facility throughput economics
        - from: facility_buildout
          to: project_finance
          label: Execution risk raises cost of capital for future facilities
        - from: rng_revenue
          to: valuation
          label: RNG revenue is the differentiated premium above service-fee baseline
        - from: service_fee_revenue
          to: valuation
          label: Service fee volume supports base-case DCF
        - from: digestate_revenue
          to: valuation
          label: Third stream upside; loss degrades facility IRR
        - from: project_finance
          to: valuation
          label: Financing terms set IRR floor; tighter terms compress equity returns
