        - label: WM large-cap 4.35x
          value: 230
        - label: RSG large-cap 4.69x
          value: 213
        - label: Infrastructure premium 6.0x
          value: 167
    approximationNotes: >-
      Implied revenue = $1,000M EV / multiple. Uses $1B as the floor of the >$1B mark; actual mark may be higher,
      increasing implied revenue proportionally. All revenue figures in USD millions. Divert's actual revenue is
