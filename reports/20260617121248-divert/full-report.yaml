      - number: '2.5'
        title: Adoption Constraints and Adverse Dynamics
        blocks:
          - type: paragraph
            body: >-
              Despite strong regulatory tailwinds, several structural constraints limit how quickly the commercial food
              waste diversion market will ramp to Divert's benefit. First, AD permitting is multi-layered: facilities
              must satisfy federal, state, and local regulatory requirements spanning air quality, solid waste, and
              water permits, with EPA's AgSTAR framework documenting the complexity that can extend project timelines by
              multiple years (CM038). This creates a durable but dangerous barrier—durable because it limits new
              competitors, but dangerous because it slows Divert's own 30-facility buildout.

              Second, capital intensity is severe: Enbridge's $1B commitment across Divert's infrastructure, combined
              with Mitsubishi and Nuveen's participation in the Series C, indicates per-facility costs in the
              tens-to-hundreds of millions of dollars range (CM039). At this capital cost, any macro financing shock or
              project-finance rate increase directly stresses the buildout timeline. Third, only 121 stand-alone food
              waste digesters operated in the U.S. as of March 2026, against an estimated 1,370 potential new systems
              (American Biogas Council), and 55% of existing AD facilities reported available capacity in the 2024 EPA
              survey—meaning the infrastructure supply side is constrained for the volumes Divert plans to process
              (CM011, CM012, CM041).

              Fourth, landfill disposal remains economically competitive in regions without mandates: retail surplus
              food still flows 21% to landfill in 2024, and hauler-brokered landfill tipping fees are often below AD
              costs in states without diversion requirements (CM040). Fifth, BioCycle and ReFED both flag that
              integrated depackaging and bundled AD services— Divert's core model—may reduce retailer incentives to
              invest in upstream source separation and prevention, creating a structural tension between prevention and
              diversion economics (CM042, CM043). Sixth, PFAS and microplastics contamination risks from depackaging
              operations are an emerging concern that could restrict digestate end-use as fertilizer and raise future
              regulatory compliance costs (CM042). These constraints collectively mean that Divert's market expansion is
              correlated with regulatory intensity and infrastructure capital availability rather than purely organic
              commercial demand growth.
            claimRefs:
              - CM011
              - CM012
              - CM038
              - CM039
              - CM040
