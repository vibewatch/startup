      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Intensity and Permitting Create Execution Risk on the 30-Facility Buildout
            body: >-
              Divert's growth model is fundamentally dependent on its ability to develop 28 additional Integrated
              Diversion & Energy Facilities (beyond the 2 operational in 2026). Each facility requires multi-agency
              permitting (air, solid waste, water), which can extend timelines by 2–5 years, and institutional capital
              at a scale only a handful of infrastructure funds can provide. Any disruption to the Enbridge, Mitsubishi,
              or Ara capital relationships, or any adverse regulatory decision on permitting, directly compresses the
              serviceable market Divert can capture. This execution risk is the primary reason the SOM range is wide and
              should be stress-tested through diligence on the NC and OH pipeline facilities.
            calloutType: risk
            claimRefs:
              - CM038
              - CM039
              - CM041
          - type: callout
            title: Retail's $26.9B in Lost Sales Is the ROI Hook; Mandate Coverage Is the Closer
            body: >-
              The U.S. retail sector's 3.98 million tons of unsold food representing $26.9B in lost sales provides a
              powerful financial frame for Divert's data-driven prevention pitch. Ryan Begin's statement that the
              average grocery store loses ~$40,000 per day in food-waste-related profit quantifies the top-of-funnel ROI
              case for retailers. However, in practice, the commercial conversion from this financial pain to a Divert
              contract is driven primarily by regulatory mandates (12 states and growing) rather than voluntary ROI
              adoption. This means Divert's near-term revenue growth is highly correlated with the pace of mandate
              enforcement and its geographic coverage of mandate states.
            calloutType: insight
            claimRefs:
              - CM004
              - CM025
              - CM030
              - CM053
          - type: callout
            title: TAM Sizing Relies on Author Estimates; No Purpose-Built Third-Party TAM Exists
            body: >-
              Unlike software or healthcare markets with established analyst coverage, the specific U.S. commercial food
              waste diversion service market has no publicly available purpose-built TAM estimate. The $500M–$2B+ range
              used in this chapter is an author-constructed estimate from EPA tipping fee data applied to commercial
              waste volumes, with RNG and data services as additive layers of uncertain magnitude. Investors should
              treat this as a directional plausibility check rather than a defensible market size, and should commission
              or request a purpose-built market study before underwriting Divert's growth projections.
            calloutType: assumption
            claimRefs:
