      - CV039
      - CV043
  - id: FV004
    title: Investment KPIs — IC-Ready Scoring
    type: kpi
    layout: compact
    summary: >-
      IC-ready scoring across eight investment dimensions. Ratings reflect evidence quality and strength of the bull
      thesis relative to the current $1B+ mark.
    data:
      items:
        - label: Market Opportunity
          value: Strong
          description: >-
            12+ state mandates; $794M invested in sector in 2025; global AD 6.86% CAGR; 70M ton U.S. food waste annual
            opportunity
        - label: Platform Proof
          value: Partial
          description: >-
            630M lbs processed in 2024 (+52% YoY); 2 operational AD facilities; 7,800+ locations—but zero facility-level
            P&L disclosed
        - label: Competitive Moat
          value: Moderate
          description: >-
            RFID data layer + integrated logistics + owned AD creates multi-layer moat; Vanguard (32 facilities) and WM
            RNG programs are credible threats
        - label: Revenue Quality
          value: Unknown
          description: >-
            Service fee + RNG offtake contractual structure has strong quality characteristics; actual NRR, churn, and
            revenue figures undisclosed
        - label: Capital Efficiency
          value: Stretched
          description: >-
            $90-120M/facility capex; 30-facility program implies $2.7B-3.6B total; committed financing ~$1.09B; ~$1.6B+
            gap is the central risk
        - label: Risk Profile
          value: High
          description: >-
            RNG subsidy exposure; methane leakage regulation; project-finance event risk per facility; USDA delinquency
            precedent in sector
        - label: Valuation vs. Comps
          value: Stretched
          description: >-
            Anaergia (closest pure-play) at 2.2x EV/Rev implies Divert needs $450M+ revenue to justify $1B; current
            actuals likely far below
        - label: Evidence Quality
          value: Medium-Low
          description: >-
            Financing marks are primary-source confirmed; operational metrics credible; all financial metrics are
            company-undisclosed or estimated from proxies
