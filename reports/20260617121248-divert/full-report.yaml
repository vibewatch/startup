      - number: '8.2'
        title: Public Comparable Analysis and Multiple Benchmarking
        blocks:
          - type: paragraph
            body: >-
              In the absence of disclosed Divert financials, the most disciplined approach is to use four public analogs
              to bracket the implied revenue needed to justify the $1B+ mark: Anaergia (the closest pure-play), Waste
              Management (WM), Republic Services (RSG), and Enviri Corporation (industrial services/environmental).

              Anaergia (TSX: ANRG), which operates integrated waste-to-RNG facilities converting food waste, MSW, and
              wastewater into renewable natural gas and fertilizer, is the most directly comparable public company. As
              of June 2026, Anaergia had an Enterprise Value of approximately CAD $469M (~USD $345M) and an EV/Revenue
              multiple of ~2.23x on trailing twelve-month revenue of CAD $210M (~USD $154M) (CV010, CV011). The company
              achieved positive Adjusted EBITDA of just CAD $1.1M in Q1 2026—its third consecutive quarter of positive
              EBITDA after years of losses—but an EV/EBITDA of 221x signals how thin profitability remains relative to
              the asset base (CV012). At Anaergia's 2.2x EV/Revenue multiple, Divert's >$1B mark implies approximately
              $450M+ in revenue (CV016)—a level Divert almost certainly has not reached given two operational AD
              facilities each capable of ~$6–$12M/yr in RNG revenue at full capacity, plus undisclosed service fees. The
              Anaergia comp thus suggests Divert is trading at a significant premium to its closest operational analog
              (CV034).

              Diversified large-cap waste operators WM (EV $110.5B, EV/Revenue 4.35x, EV/EBITDA 15.1x) and RSG (EV
              $78.3B, EV/Revenue 4.69x, EV/EBITDA 15.3x) set the ceiling for integrated waste infrastructure with RNG
              components (CV013, CV014). These multiples apply to companies generating ~30% EBITDA margins at scale,
              which Divert cannot demonstrate (CV019, CV035). At the WM/RSG ~4.5x blended EV/Revenue, Divert's $1B+
              implies approximately $220–230M in annual revenue (CV017)—theoretically achievable at 8–10 operational
              facilities but well above current levels. Enviri Corporation (EV $2.23B, EV/Revenue 1.76x, EV/EBITDA 204x)
              provides the low-multiple reference for industrial services with thin profitability (CV015), implying
              $570M+ in revenue at that multiple (CV018). Notably, even the lowest-multiple comp implies a significant
              revenue gap versus Divert's likely 2026 actuals.

              The infrastructure replacement-cost lens provides a different anchor: two operational facilities and one
              under construction at ~$90–$120M each implies $180–$360M in physical infrastructure value, well below $1B
              (CV043). The $1B+ premium above replacement cost reflects the customer network (7,800+ locations), the
              data platform, the national buildout pipeline, and the contracted offtake optionality—none of which is
              independently valued in any public disclosure (CV042). The global AD market is growing at a projected
              6.86% CAGR through 2032, providing a structural tailwind (CV025), and $794M was invested in food waste
              solutions in 2025 alone (CV027).
