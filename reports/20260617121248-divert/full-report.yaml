      - number: '2.2'
        title: 'Market Sizing: Multiple Lenses and Contradictory Estimates'
        blocks:
          - type: paragraph
            body: >-
              No publicly available third-party TAM estimate exists specifically for the U.S. commercial food waste
              diversion service market that Divert serves. Three distinct lenses yield substantially different
              estimates, and all are preserved here with their limitations.

              The broadest lens—the global anaerobic digestion market tracked by MarkNtel Advisors—is valued at $64.24
              billion globally in 2025 and projected to reach $103.1 billion by 2032 at a 6.86% CAGR, with North America
              holding ~42% market share (~$29 billion in 2026) (CM007, CM008). This estimate spans all organic
              feedstocks including agricultural manure, municipal biosolids, and industrial organics, making it a severe
              overstatement of Divert's serviceable market; however it confirms the secular demand for AD infrastructure
              investment.

              A narrower lens starts with the food loss value metrics published by ReFED: $380 billion in total surplus
              food value in 2024, of which $122 billion represents industry sector losses (retail + manufacturing +
              foodservice, excluding consumer plate waste), and $26.9 billion reflects retail sector lost sales alone
              (CM003, CM045, CM004). These are cost-of-waste metrics, not service revenue estimates, but they underscore
              the financial motivation for diversion investment.

              The most grounded but also most constrained lens is a bottom-up estimate using EPA tipping fee data and
              commercial waste volumes. EPA surveys of AD facilities in 2022–2023 show average tipping fees of $32.27
              per ton and median of $22.23 per ton (CM014). Applying these rates to an estimated 8–16 million tons of
              commercially addressable, currently landfilled food waste yields a logistics and processing service
              revenue TAM of roughly $240M–$500M per year, excluding RNG monetization, data services, and certified
              destruction premiums (CM015). Adding those revenue layers expands the estimate to a range of $500M–$2B+
              (CM016). A conflicting interpretation—applying the North American AD market benchmark directly—would
              suggest the market is orders of magnitude larger, but this fails to account for the 90%+ share of the AD
              market not addressable by commercial food waste diversion services (CM050, CM051). Enbridge's $1 billion
              infrastructure commitment to Divert's 30-facility buildout provides an implicit validation that the
              capital markets view this as a multi-billion-dollar infrastructure opportunity, even if the annual
              service-revenue TAM is smaller (CM019).
