      - number: '5.2'
        title: RFID / Data Layer and Reverse Logistics
        blocks:
          - type: paragraph
            body: >-
              The data layer is Divert's most differentiated software asset. Proprietary RFID-tagged bins are placed in
              retail back rooms; unsold food is sorted into bins at the store level, and the RFID platform captures
              store-specific waste data by department on a monthly basis. This store-level granularity enables Divert's
              customer-success teams to deliver root-cause analysis, benchmarking, and department-focused co-training —
              a feedback loop that actively reduces waste generation over time. A five-year RFID case study at a
              190-store Mid-Atlantic grocery chain demonstrated a 9% reduction in tons of unsold food. The reverse
              logistics system uses collapsible bins to standardize collection, backhaul to retailer distribution
              centers, and onward transport to Divert's processing facilities. In a documented Pacific Northwest
              deployment, inedible food from 466+ grocery stores is collected daily and consolidated before reaching the
              facility. The Divert-Feeding America collaboration since 2018 — covering 13 major retailers in 38 states —
              adds a donation-optimization layer, combining Divert's bin data with Feeding America's MealConnect
              platform to increase donations by up to 20%. Industry practitioners at NRF 2026 confirmed that RFID in
              grocery has moved from theoretical to "a question of ROI," strengthening adoption tailwinds for Divert's
              data layer.
