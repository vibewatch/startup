      - number: '8.3'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Three scenarios are constructed from the publicly available evidence. In the bull scenario, Divert
              executes the 30-facility buildout on schedule, closes the capital gap through additional PE/infrastructure
              capital and project debt, maintains regulatory tailwinds (45Z, D3 RINs, state mandates), and achieves
              $500–$800M in annualized revenue by 2030 at 15–20% EBITDA margins, producing a plausible $3B–$5B
              enterprise value at 4–7x EV/Revenue (CV037). The bull case requires uninterrupted financing access,
              operational execution at a pace Divert has not yet demonstrated (only 2 facilities open through mid-2026),
              and RNG prices sustaining above $15/MMBtu.

              In the base scenario, Divert builds 8–12 facilities by 2030, achieves $150–300M in revenue with
              near-breakeven EBITDA, and raises additional capital at dilutive terms. Enterprise value stabilizes at
              $800M–$2B (3–6x EV/Revenue) as preferred equity stacks from Enbridge, Nuveen, and subsequent
              project-finance lenders compound (CV038). This scenario is consistent with the current Enbridge and
              Mitsubishi pacing of ~2 facilities per year and is corroborated by the Anaergia precedent of
              slow-to-positive EBITDA despite strong revenue growth.

              In the bear scenario, natural gas prices remain suppressed (EIA AEO 2026 projects Brent crude below
              $70/bbl through 2030, constraining RNG pricing premiums) (CV032), federal subsidies contract under the
              current regulatory environment, and digester sector stress events—analogous to USDA's $102.6M in
              delinquent digester loans— propagate to Divert's project-finance pipeline (CV030). Capital gap
              crystallizes, facility buildout stalls at 3–5 sites, and Divert is forced to a down-round or strategic
              sale at $200–$600M, implying 0.5–1.5x replacement-cost value (CV039).

              The sensitivity of the valuation to revenue multiple choice is acute: a 1x shift in EV/Revenue changes the
              implied revenue floor by $200–$450M, an enormous range given total uncertainty about current financials.
              The infrastructure replacement cost sets a practical downside floor; the question for investors is how
              much credit to extend for the 30-facility pipeline and contracted offtake that have not yet generated
              disclosed EBITDA.
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV043
