  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments, Buyer/User/Payer Roles, and Geography
        blocks:
          - type: paragraph
            body: >-
              Divert's revenue-generating customer base divides into two principal segments: grocery retail and
              industrials. In the retail segment the buyer is typically a national or regional grocery chain's
              sustainability or operations team, which signs and funds the managed service contract. End users are
              store-level associates who load RFID-tagged collapsible bins with unsold food, and store or district
              managers who receive monthly waste-reduction analytics. The payer is the corporate banner, not the
              individual store. Named retail anchor accounts confirmed via press releases or CEO interviews include
              Giant Food (Ahold Delhaize, 163 stores across MD, VA, DC, DE), Kroger systems (Ralphs, Food 4 Less, Fred
              Meyer), Albertsons (Portland Division), Safeway (Northern California), and Reser's Fine Foods (Longview
              WA). Ahold Delhaize USA's Sustainable Operations lead described Divert as "an important partner in Ahold
              Delhaize USA companies' efforts to recycle non-saleable, non-donatable food," confirming a corporate-level
              account relationship beyond Giant alone.

              In the industrials segment—entered at scale in 2024—the buyer and payer is the operations or
              sustainability team at a food warehouse, cold-storage operator, or food manufacturer. Value propositions
              include certified destruction of brand-sensitive products, SB 1383 compliance documentation, and secure
              RNG diversion. United States Cold Storage (USCS; third-largest refrigerated warehousing provider in North
              America) and Blue Diamond Growers (world's leading almond processor) are the two publicly named industrial
              customers as of mid-2026. Food banks (Feeding America network, Central California Food Bank) and
              hunger-relief organizations are Provide-pathway delivery partners rather than revenue-paying customers.
              Geographically the footprint covers all 50 U.S. states with operational density in California (Turlock),
              the Pacific Northwest (Longview WA), and the Mid-Atlantic/DC corridor. Regulatory pull is strongest where
              mandatory organics-diversion laws apply: California SB 1383, Massachusetts commercial food ban (0.5
              ton/week threshold), and Washington Organics Management Law.
