  - id: FE001
    title: Divert Product Architecture Stack
    type: stack
    layout: standard
    summary: Five-layer architecture from data capture at the store level through renewable energy and fertilizer outputs.
    data:
      items:
        - label: Store-Level RFID Bin Data Capture
          layer: Data & Intelligence
          description: Proprietary RFID-tagged bins in retail back rooms; department-level unsold food data captured monthly
        - label: Analytics & Donation-Optimization Engine
          layer: Data & Intelligence
          description: Root-cause analysis, benchmarking, co-training recommendations; Feeding America MealConnect integration
        - label: Reverse Logistics & Bin Collection
          layer: Logistics
          description: Collapsible bins collected from stores; consolidated at retailer DCs; transported to Divert facility
        - label: Edible Food Donation Routing
          layer: Logistics
          description: Pre-dispatch donation facilitation via combined Divert + Feeding America data layer
        - label: Industrial & Manufacturer Intake
          layer: Logistics
          description: 24/7 loading docks; LTL/FTL/drop-and-hook; certified chain-of-custody for brand-protective destruction
        - label: Depackaging Unit
          layer: Processing
          description: >-
            Mechanical separation of food from packaging; produces clean liquid slurry; packaging destroyed and
            commingled
        - label: Certified Destruction Documentation
          layer: Processing
          description: Certificates of destruction, photos, videos, and sustainability reports for industrial clients
        - label: Anaerobic Digestion (AD)
          layer: Conversion
          description: Microbial conversion of slurry to biogas; co-located with depackaging at each Integrated Facility
        - label: RNG Upgrading & Grid Injection
