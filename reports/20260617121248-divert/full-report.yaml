      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Key-Person Concentration: Ryan Begin as Sole Founder-Operator'
            body: >-
              Ryan Begin is the only co-founder with continuous operational involvement at Divert. Nick Whitman's March
              2025 transition from COO to board removed the second founding voice from day-to-day operations after 18
              years. While the C-suite has been bolstered with professional executives (Watkins as COO, Lukow as CFO,
              multiple VPs), Begin remains the primary architect of capital strategy, investor narrative, and
              operational vision during a critical 30-facility expansion phase. Any adverse event—health, departure, or
              governance dispute—involving Begin could materially disrupt both capital-raising momentum and operational
              execution at a stage requiring simultaneous facility development, customer growth, and regulatory
              engagement.
