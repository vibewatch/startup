      - number: '7.3'
        title: Digestate Contamination and Microplastics Risk
        blocks:
          - type: paragraph
            body: >-
              Divert's end-to-end model produces both renewable natural gas and digestate/soil amendment from depackaged
              food waste. The digestate stream is a critical third revenue/value component, and the company positions it
              as a high-purity agricultural input. However, the depackaging process that separates packaged food from
              its plastic packaging creates a microplastics risk for the organic fraction entering the digester.
              Depackaging machines exerting force on packaged food risk higher microplastics generation from shattering
              of brittle plastics such as HDPE and polypropylene; no industry data exist on which depackaging methods
              produce microplastics or in what quantities per BioCycle's NRDC-commissioned research.

              A 2025 peer-reviewed study published in Frontiers in Sustainable Food Systems confirmed that microplastics
              accumulate in anaerobic co-digestion systems processing food waste, and identified challenges in isolating
              microplastics from digestate due to complex organic matrices. This finding corroborates NRDC/BioCycle's
              concern that land application of depackaged digestate could introduce microplastics into agricultural soil
              at scale without any regulatory safeguard. Without a standardized measurement protocol, Divert cannot
              proactively demonstrate digestate purity to regulators or customers, and any state that adopts
              microplastic thresholds for land-applied soil amendments could effectively restrict Divert's third revenue
              stream.

              BioCycle panelists also noted that packaging residue from depackagers is typically too dirty and
              fragmented for recycling, so all packaging ends up in landfill—contradicting the circular economy
              positioning and adding regulatory exposure if states track this waste stream. Divert's claim to "set a new
              standard for downstream purity in land-applied soil amendments" (Longview launch release) has not been
              independently verified as of mid-2026. The combination of rapid technology deployment, absent standardized
              protocols, and active state rulemaking makes this the highest-uncertainty risk exposure unique to Divert's
              model.
