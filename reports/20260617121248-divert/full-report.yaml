      - number: '1.3'
        title: Capital History, Investors, and Valuation
        blocks:
          - type: paragraph
            body: >-
              Divert operated with a deliberately lean capital base for 14 years, raising just over $5 million in
              aggregate from 2007 through 2021 (CO021), allowing the business model to be refined without investor
              pressure. This changed materially when Ara Partners led a $100 million growth equity investment in 2021,
              with GIC and Ontario Power Generation as co-investors, giving Ara a controlling stake (CO020). This first
              institutional round accelerated development of the company's facility and technology roadmap.

              In March 2023, Divert announced two linked transactions: $80 million in growth equity from Enbridge and
              $20 million led by Ara Partners (CO022), combined with a $1 billion structured infrastructure financing
              commitment from Enbridge to underwrite a nationwide network of anaerobic digestion facilities (CO023).
              Enbridge concurrently acquired approximately 10% of Divert's equity (CO024). Around the same time, BP plc
              signed an approximately $175 million, 10-year RNG offtake agreement with Divert for three facilities
              (CO031), one of the largest known offtake deals for food waste digestion RNG in the U.S. In April 2025,
              Nuveen Energy Infrastructure Credit invested more than $90 million specifically to fund the Lexington, NC
              facility (CO025).

              In January 2026, Wittington Investments led an undisclosed new funding round with two new board
              appointments (CO026). On April 14, 2026, Mitsubishi Corporation was announced as lead investor in Divert's
              Series C, combining strategic equity with a preferred RNG offtake arrangement (CO027), elevating the
              company's valuation above $1 billion (CO028). The exact Series C equity amount has not been publicly
              disclosed. Mitsubishi also secured preferred offtake rights for future RNG production beyond the North
              Carolina facility (CO029). Divert's resulting capital structure blends controlling PE ownership, strategic
              energy-sector equity, project finance, and long-term RNG offtake contracts (CO030)—a model more typical of
              infrastructure asset owners than VC-backed software companies, with structural complexity that warrants
              inter-creditor and priority-return diligence.
