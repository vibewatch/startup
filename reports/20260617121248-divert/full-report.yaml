              remain unfunded (CI034). Cash on hand, monthly burn rate, and runway are not disclosed; 23% headcount
              growth and four senior VP hires in 2024 signal ongoing overhead acceleration (CI015, CI036). The bp $175M
              offtake commitment (CI035) provides revenue visibility but is not equity. Keyera Corp's 2025 Annual
