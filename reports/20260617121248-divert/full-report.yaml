      - number: '4.3'
        title: Cost Structure, Gross Margin Drivers, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Divert's cost structure has three major buckets. First, logistics and collection: recurring reverse
              logistics across 7,800+ locations involving truck-routing, bin management, consolidation, and haul-out.
              Second, facility operations: depackaging, AD processing, RNG conditioning and pipeline injection, and
              fertilizer packaging at each Integrated Diversion & Energy Facility—each handling up to 100,000 tons/yr
              (CI019). Third, platform overhead: RFID infrastructure, data analytics, software, headcount (23% growth in
              2024, CI015), and G&A. Capital expenditure is primarily project-financed, which reduces equity capex
              burden but introduces per-facility debt service that compresses net margins.

              Gross margin, EBITDA, and cost-per-ton are not publicly disclosed by Divert (CI044). Anaergia (TSX: ANRG),
              the nearest publicly traded AD/RNG company, reported Q1 2026 gross margin of 23.0% on CAD $55.2M revenue
              (CI037, CI038)—a structural benchmark, though Anaergia's capital-light project-sale model differs from
              Divert's owned-facility recurring-service model. Recurring service fees from retailers likely carry higher
              gross margin than Anaergia's one-off capital-sales segment, potentially approaching 30–40% for the
              software/data layer, but logistics-intensive collection costs can compress blended margins. BTS Bioenergy
              industry data confirms customers save 30–45% switching to AD versus landfill (CI024), validating that
              Divert's pricing power exceeds variable cost, but realized take rate is unknown.

              Proxy unit economics at the facility level: Longview produces 235,000 MMBtu/yr RNG and 450,000 lbs
              fertilizer at full capacity (CI020). At market RNG values of $10–$20/ MMBtu (including D3 RIN value), RNG
              revenue could reach $2.4–$4.7M/yr per facility at full utilization—directionally consistent with the
              ~$5.8M/yr implied by the bp deal (CI003, CI043). Facility-level payback and gross margin cannot be
              confirmed without access to Divert's cost data (CI044).
