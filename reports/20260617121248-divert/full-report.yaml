  foundingLocation: West Concord, Massachusetts
  headquarters: West Concord, Massachusetts
  productSummary: >-
    Divert's product stack integrates RFID-tagged bin collection systems in retail back rooms for store-level unsold
    food data capture, reverse logistics for bin pickup and transport, proprietary mechanical depackaging to separate
    food from packaging, and co-located anaerobic digestion at Integrated Diversion & Energy Facilities that produce
    pipeline-ready renewable natural gas, liquid CO2, and organic soil amendments. Each IDEF is designed to process up
    to 100,000 tons of organic waste per year.
  customerFocus: >-
    U.S. grocery retailers (Kroger, Ahold Delhaize/Giant Food, Albertsons/Safeway, Fred Meyer), food manufacturers (Blue
