      - number: '3.3'
        title: Capability Comparison, Pricing, and Go-to-Market
        blocks:
          - type: paragraph
            body: >-
              Assessed against the buyer job of preventing and diverting commercial food waste across the full value
              chain, Divert's platform is the only identified competitor that covers all five capability layers:
              prevention data analytics, food donation facilitation, reverse logistics, proprietary depackaging, and
              owned AD-to-RNG infrastructure (CP035, CP036, CP044). No competitor has published a claim to operate
              RFID-enabled store-level inventory tracking at the scale Divert has described. Vanguard covers
              depackaging, AD, and RNG but has no prevention data layer and targets food-manufacturer and agricultural
              feedstock rather than pure retail. Denali covers depackaging at scale but outputs to third-party
              processors rather than owned AD, and has no data analytics. BTS Bioenergy has limited U.S. infrastructure
              and no data platform. Anaergia provides equipment technology that enables others but does not contract
              directly with grocery retail buyers for waste services. Mill targets an upstream in-store intervention
              that competes with Divert's prevention objective using a different technology path.

              Pricing and contract structures for Divert, Vanguard Renewables, Denali, BTS Bioenergy, and all other
              named competitors are undisclosed in public sources (CP045). The only available market pricing benchmark
              is the EPA's 2022–2023 survey of AD tipping fees: an average of $32.27 per ton and a median of $22.23 per
              ton for stand-alone food-waste digesters nationally. Contract length, bundled-service pricing,
              data-platform SaaS fees, certified-destruction premiums, and volume discount structures are unknown for
              all parties. This information gap is material because buyers choosing between Divert's integrated model
              and Denali's depackaging-only model face a pricing decision that cannot be evaluated from public data
              alone (CP045).

              Go-to-market and distribution power differ substantially across competitors. Divert reaches buyers
              directly through its enterprise retail sales team with multi-year service agreements anchored by the data
              analytics platform, which creates an ongoing data-exchange relationship that is harder to exit than a
              commodity hauling contract (CP037). Vanguard grows geographically, expanding market-by-market to adjacent
              regions from its Northeast-Midwest base toward the South, competing for overlapping retail and
              food-manufacturer feedstock in new geographies (CP040). Denali leverages its existing national organics
              hauling network and established relationships with grocers, municipalities, and food manufacturers; the
              Walmart deal provides a reference account that could accelerate conversion of Denali's hauling customers
              to depackaging services (CP013, CP016). Waste Management and Republic Services, the two largest U.S.
              commercial waste haulers, have deep existing route density and customer relationships with nearly every
              commercial food establishment in the U.S. but currently offer no integrated depackaging or prevention
              platform comparable to Divert (CP038). Their future entry into the depackaging or data-analytics
              layer—whether organic or through acquisition— represents a structural long-tail risk.
            claimRefs:
