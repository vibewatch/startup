      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Divert has assembled a substantial multi-instrument financing stack. Equity rounds total at least $200M
              pre-Series C: $100M in 2021 (Ara Partners, GIC, Ontario Power Generation, CI027) and $100M in 2023 ($80M
              Enbridge, $20M Ara, CI028). The April 2026 Mitsubishi-led Series C (CI031) is undisclosed in amount but
