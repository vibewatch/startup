      - number: '8.4'
        title: Adverse Evidence and Skeptical Valuation Lens
        blocks:
          - type: paragraph
            body: >-
              Several lines of adverse evidence complicate the bull case and bear directly on the risk-adjusted value of
              the $1B+ mark. The Conservation Law Foundation (CLF) published a detailed critique arguing that anaerobic
              digesters maximize methane production, lock industrial agriculture into climate-damaging systems, and
              produce "renewable" natural gas that is still methane and leaks from pipeline
              infrastructure—characterizing it as greenwashing (CV028). While Divert uses food waste rather than manure
              as feedstock (mitigating the factory-farming lock-in critique), the pipeline leakage and methane
              characterization risks are relevant to RNG offtake pricing and regulatory durability.

              The New Lede reported in March 2026 that BC Organics, a Wisconsin anaerobic digestion project, emitted
              4,921 metric tons of methane in 2024 due to documented leaks—equivalent to emissions from approximately
              30,000 gasoline-powered vehicles (CV029). This is a manure digester, not a food-waste digester like
              Divert's, but it underscores that AD facilities can emit significant methane through operational failures,
              with direct implications for regulatory exposure and carbon credit validity. Separately, the USDA paused
              its anaerobic digester loan programs in January 2026 after identifying $102.6M in delinquent loans; BC
              Organics accounted for $100.1M of that total, with loans 181–360 days delinquent (CV030, CV031). This
              precedent demonstrates that large-scale AD projects can fail to service project debt even with government
              backstop, a risk directly relevant to Divert's own project-finance-dependent buildout.

              From a public-market comparable angle, Anaergia's EV/EBITDA of 221x—despite 122% revenue growth in Q1
              2026—highlights how capital-intensive the waste-to-RNG model is: even at scale, EBITDA barely turns
              positive (CV035). No comparable in the dataset justifies a >$1B EV without demonstrated EBITDA above $30M,
              a threshold Divert has not disclosed achieving (CV034). The EIA AEO 2026 projects sustained natural gas
              price pressure through 2030, which directly constrains the premium RNG can command over commodity gas
              prices (CV032). If Henry Hub prices average below $3/MMBtu for an extended period, D3 RIN supplement
              becomes the critical revenue support—creating a political risk the bull case cannot hedge away. Divert's
              Mitsubishi offtake terms remain confidential, so the degree of pricing protection embedded in the
              preferred offtake rights is not verifiable (CV033). Finally, Divert's EBITDA-negative status and
              undisclosed cash position mean the company is operating on committed project finance rather than
              current-period cash generation (CV036).
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
