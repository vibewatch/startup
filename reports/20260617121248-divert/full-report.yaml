      - number: '7.5'
        title: Customer Concentration and Revenue Opacity Risk
        blocks:
          - type: paragraph
            body: >-
              Divert's service-fee revenue structure is anchored by a small number of large grocery chains that
              individually represent multi-year, multi-store relationships without public disclosure of contract values,
              renewal dates, or exclusivity terms. The company confirmed partnerships with five Fortune 100 companies
              and named anchor accounts including Kroger, Ahold Delhaize (Giant, Stop & Shop, Hannaford), Albertsons,
              Safeway, Harris Teeter (Kroger-owned), and CVS—but discloses no revenue breakdown by customer, segment, or
              geography.

              Giant Food's 163-store, $0-disclosed-value partnership processed nearly 80 million pounds since 2022 and
              is the most documented single account; the account involves the full Ahold Delhaize USA banner ecosystem,
              confirmed by a corporate-level testimonial. Harris Teeter separately removed more than 40 million pounds
              with Divert in a single year, confirming a second large-volume relationship. Customer location growth of
              22% in 2024 alongside 52% volume growth implies new industrial accounts (USCS, Blue Diamond) carry
              disproportionate per-customer volume, creating early-stage industrial concentration risk that is not
              offset by any disclosed long-term industrial contract structures.

              The revenue opacity risk manifests in two ways: first, any anchor account non-renewal creates a
              simultaneous feedstock supply disruption for the nearest AD facility and a service-fee revenue decline—a
              double impact. Second, as facility RNG revenue scales and each facility's economics depend on 100,000
              tons/year throughput at full capacity, interruption of feedstock supply from a major retailer directly
              impairs the facility-level returns that underpin the entire project-finance structure. No public NRR, GRR,
              or churn data exist. The structural RFID-bin and data-platform switching friction provides some retention
              tailwind, but is not a contractual guarantee.
            claimRefs:
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
      - number: '7.6'
        title: People, Execution Risk, and Downside Scenarios
        blocks:
          - type: paragraph
            body: >-
              Divert's leadership team underwent material transition in 2024–2025 while simultaneously scaling from one
              to thirty planned facilities. Co-founder and COO Nick Whitman—who had led operations, finance, legal,
              people, IT, and fundraising for nearly 18 years—transitioned to a board advisory role in March 2025. His
              operational replacement has not been publicly named as of mid-2026, consolidating broad executive
              responsibility on CEO Ryan Begin. CFO Brad Lukow joined approximately one year before the Mitsubishi
              Series C announcement; his tenure covers his first major capital raise as Divert CFO. Four VP-level hires
              were made in December 2024 (industrials, IT, food service, transportation/supply chain), representing a
              full C-suite rebuild at the same time the company accelerated its facility buildout.

              The COO vacancy is material because the COO function spans facilities permitting, operational ramp, supply
              chain logistics, and compliance across distributed sites—exactly the functions most critical to a
              28-facility expansion. The absence of a publicly named successor creates diligence uncertainty about
              organizational depth. Ara Partners' institutional oversight and the board-level presence of both Begin and
              Whitman mitigate continuity risk, but cannot substitute for day-to-day operational leadership.

              Three downside scenarios frame the thesis-break analysis. In Scenario A (financing stalls), an
              insufficient Series C or Enbridge drawdown delay prevents 10+ planned facilities from reaching
              construction, freezing Divert below the scale needed for profitable national density. In Scenario B
              (digestate regulation), a state imposes land-application restrictions on depackaged digestate, impairing
              the third revenue stream and weakening facility-level economics across all operating sites. In Scenario C
              (RNG policy collapse), D3 RIN elimination or 45Z credit repeal materially reduces RNG revenue, raising the
              hurdle for new project finance and potentially requiring feedstock-mix changes to maintain IRR. Any single
              scenario would be manageable; a combination of two or more during the 2026–2028 buildout window would
              likely be thesis-breaking.
