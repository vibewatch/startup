      - number: '8.5'
        title: Exit Readiness, Strategic Optionality, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Divert's most probable exit paths are strategic acquisition or infrastructure-sponsor roll-up, not
              near-term IPO. Waste Management and Republic Services are the natural strategic buyers given national
              logistics footprints and existing RNG programs; both have EV/Revenue at 4–5x and EBITDA margins that could
              absorb Divert's service-fee revenue stream at a premium (CV040). Mitsubishi's preferred offtake rights
              create a structural incentive for a staged buyout: as facilities ramp and offtake values are confirmed, MC
              may increase equity stake toward outright control (CV041). Enbridge, with its 10% stake and $1B
              infrastructure commitment, is positioned as a long-term infrastructure co-investor rather than a strategic
              acquirer.

              An IPO remains on the horizon but is unlikely before 5–8 operational facilities are generating
              demonstrable, recurring EBITDA—probably 2028–2030 at the earliest. The company processed 630M+ lbs in 2024
              (52% growth) (CV020), serves 7,800+ customer locations across all 50 states (CV021), and has a 30-facility
              national buildout roadmap supported by Ara Partners' infrastructure expertise (CV022). The Longview WA
              facility began injecting gas into the pipeline on April 9, 2026, and can produce up to 235,000 MMBtu/yr of
              RNG at full capacity (CV023). Two operational AD facilities and one under construction give Divert the
              operational track record to begin attracting LP co-investors for the next tranche of project finance
              (CV024). The US has 121 standalone food-waste digesters nationally and potential for 1,370 new sites,
              defining a large but currently thin market (CV026). Private-sector food-waste investment reached $794M in
              2025 (CV027), confirming institutional appetite for the sector.

              Before committing capital at the current $1B+ mark, the minimum diligence required includes: NDA access to
              facility-level P&Ls for Turlock CA and Longview WA (the only two operational data points), a full
              cap-table and waterfall model to assess preference overhang, and the Mitsubishi offtake term sheet to
              verify pricing and volume. Without these materials, underwriting relies entirely on strategic narrative
              and public-comp inference, not on verifiable unit economics.
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV026
              - CV027
              - CV040
              - CV041
          - type: table
            tableRef: TV006
            claimRefs:
              - CV007
              - CV005
              - CV022
              - CV033
              - CV036
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Stance — Stretched; Track Pending Financial Disclosure
            body: >-
              At >$1B, Divert is priced for a 30-facility infrastructure success case that has not yet been
              demonstrated. The mark is defensible for strategic investors (Mitsubishi, Enbridge) pricing RNG offtake
              optionality and long-duration infrastructure; it is not underwritable for financial-return LPs without NDA
              access to revenue, EBITDA, and facility-level P&Ls. Track until: (1) Series C terms and cap table are
              disclosed, (2) facility-level economics are provided under NDA, or (3) valuation re-sets to a level
              anchored by verifiable metrics.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV042
          - type: callout
            title: Capital Gap Is the Central Execution Risk
            body: >-
              With 30 facilities targeted and ~$90–$120M capex each, total program capex is $2.7B–$3.6B. Disclosed
              committed financing totals approximately $1.09B (Enbridge $1B infrastructure commitment + Nuveen $90M+),
              leaving a ~$1.6B+ gap that must be closed facility by facility through independent project-finance events.
              Each such event is a binary risk: a failed lender engagement stalls construction and delays EBITDA
              realization, compressing the base-case valuation multiple.
            calloutType: risk
            claimRefs:
              - CV022
              - CV003
              - CV005
          - type: callout
            title: Mitsubishi Deal Structure Signals Strategic, Not Financial, Valuation Driver
            body: >-
              The bundled equity-plus-preferred-RNG-offtake structure in the Series C is atypical of financial PE deals.
              Mitsubishi is paying an infrastructure premium to secure long-term access to food-waste RNG for Japan and
              global markets—value that is not captured by standard EV/Revenue or EV/EBITDA multiples. This partially
              explains the stretched financial multiple: the strategic buyer is implicitly subsidizing the valuation
              with offtake optionality that is worth far more to Mitsubishi than to an LP fund with a 10-year return
              mandate.
            calloutType: insight
            claimRefs:
              - CV002
              - CV041
              - CV042
