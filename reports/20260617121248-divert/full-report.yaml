      - number: '7.4'
        title: Capital Structure, CapEx Gap, and Partner Dependency
        blocks:
          - type: paragraph
            body: >-
              Divert's financial risk is dominated by capital intensity. Two operational facilities (Turlock CA,
              December 2024; Longview WA, April 2026) anchor a 30-facility national buildout targeting the
              100-miles-of-80%-of-population coverage threshold. The Lexington NC facility broke ground in April 2025
              with $90M+ in Nuveen project finance; the Harrison OH site had not disclosed a project-finance partner or
              permitting completion as of mid-2026. At $90M+ per facility, the 30-facility plan implies $2.7B+ total
              capex. Disclosed committed financing totals approximately $1.09B+ (Enbridge $1B facility, Nuveen $90M for
              Lexington), leaving roughly 18 facilities in the unfunded category requiring future project-finance
              events.

              Partner concentration is severe on multiple dimensions. Enbridge—holding a 10% equity stake—provides the
              backbone financing facility at ~$1B and is both the largest creditor and a significant equity holder; any
              renegotiation or Enbridge strategic shift would cascade into the facility buildout pipeline. BP's
              ~$175M/10-year RNG offtake covers only three of 30 planned facilities; Mitsubishi's first-rights to future
              offtakes (announced April 2026) must be converted to binding contracts as each facility completes. The
              Cascade Natural Gas pipeline interconnection at Longview creates a single-pipeline dependency for WA RNG
              revenue.

              Comparable infrastructure risk is evidenced by BC Organics, a large-scale Wisconsin digester project with
              $100.1M in delinquent USDA loans (181–360 days overdue as of March 2026) and confirmed methane leaks.
              While Divert's food-waste model differs from manure-based projects, the digester sector's high rate of
              loan delinquency (27% of USDA portfolio) and project underperformance signals broad execution risk for
              large-scale AD builds. Ara Partners' controlling PE stake, with an estimated 2027–2030 exit horizon given
              its Fund III vintage, creates potential tension between PE exit timing and the multi-decade infrastructure
              buildout timeline required to reach 30 facilities.
