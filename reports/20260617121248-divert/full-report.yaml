  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Prevent / Provide / Power®: End-to-End Product Stack'
        blocks:
          - type: paragraph
            body: >-
              Divert organizes its product portfolio under a three-part framework: Prevent (reduce unsold food at source
              through data and training), Provide (optimize edible-food donation to the food insecure), and Power
              (convert non-donatable unsold food into renewable energy and fertilizer). This framework covers three
              customer segments — grocery retailers, food warehouses and distributors, and food manufacturers — and is
              delivered through six distinct service modules: RFID-based data analytics, reverse logistics and
              collapsible-bin collection, depackaging of packaged food, anaerobic digestion, certified destruction, and
              department-focused co-training. As of the latest public figures, Divert serves 7,800+ customer locations,
              has processed 3.8 billion pounds of unsold food cumulatively, and has facilitated 15 million meals donated
              to the food insecure. The company has been operating in this space for 19 years. No product is offered as
              a standalone SaaS or hardware SKU — all modules are deployed as an integrated managed service, which makes
              the stack sticky but also capital-intensive to replicate.
