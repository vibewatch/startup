              facility performance. However, this multi-party structure introduces complexity: each capital layer
              carries distinct return expectations, priority claims on RNG output, and differing investment horizons.
              Investors should separately evaluate inter-creditor agreements, RNG offtake pricing floors and caps, and
              whether Enbridge's $1B infrastructure commitment is structured as non-recourse project debt or a
