      - number: '7.2'
        title: Regulatory, Permitting, and RNG Policy Risk
        blocks:
          - type: paragraph
            body: >-
              Each of Divert's planned 30 facilities requires independent site-level permitting across air quality,
              solid waste, and water discharge, in compliance with EPA guidelines that apply to all anaerobic digester
              types. The Longview, WA facility was described by Divert as "the first industrial project that's gotten
              through Washington state's environmental review process in southwest Washington in over a decade,"
              signaling the time-intensity of the process. Lexington, NC broke ground in April 2025 with Nuveen
              financing confirmed, but permitting completion and timeline for Harrison, OH have not been publicly
              disclosed.

              Depackaging-specific regulation is an emerging risk vector. As of late 2025, BioCycle found that 23 of 24
              surveyed states lacked specific regulatory frameworks for food-waste depackaging. Maryland, Michigan,
              Pennsylvania, Vermont, and Washington are actively drafting depackaging rules; Vermont's process
              demonstrated that even a "notification" model can evolve into substantive operational requirements. No
              standardized measurement protocol for microplastics in depackaged food waste or downstream digestate
              exists, leaving a critical data gap and creating exposure to retroactive compliance requirements as any
              future standard is set.

              On RNG policy, the USDA extended its loan-guarantee pause for anaerobic digesters through December 31,
              2026; Earthjustice simultaneously filed a FOIA lawsuit against USDA for withholding funding records. The
              coalition includes 30+ organizations urging permanent exclusion of manure digesters from REAP.
              Importantly, Divert processes food waste, not manure, which partially insulates it from the primary policy
              target. However, the broader anti-RNG advocacy coalition (CLF, Farm Forward, Friends of the Earth) opposes
              all methane-capturing digesters on climate grounds, and federal biofuels policy shifts—including the
              removal of biogas-generated electricity's REAP eligibility—create D3 RIN basis risk. The Trump-era "One,
              Big, Beautiful Bill" extends tax credits favorable to biogas, but policy direction is volatile.
