  - id: concentration-expansion-adverse
    title: Customer Concentration, Expansion Opportunities, and Adverse Signals
    body: >-
      Divert's customer concentration is structurally opaque. No per-customer revenue or
      volume share is disclosed; the only public signals are aggregate location counts and
      five Fortune 100 companies. The two largest named enterprise relationships—Kroger
      (Ralphs, Food 4 Less, Fred Meyer) and Ahold Delhaize USA (Giant Food, Stop & Shop,
      Hannaford)—each span multiple regional banners and almost certainly account for a
      disproportionate share of processed volume. Termination of either relationship would
      be financially material and unquantifiable without internal data. Retailer budget
      pressure is a recurring customer-side risk: grocery retail operates on 1–3% net
      margins, and sustainability program spending is historically the first cut during
      margin-compression cycles; Divert mitigates this partly because its service displaces
      existing tipping-fee spend rather than adding pure cost, and regulatory mandates
      create a demand floor in covered states.

      On the expansion side, vertical diversification into industrials reduces retail
      concentration risk but remains early-stage: only USCS (California only as of Q3 2025)
      and Blue Diamond (Turlock CA only) are named. U.S. Food Waste Pact data show composting
      still accounts for 21.9% of retail food waste destinations versus AD at 14.5% (2024
      ReFED data), indicating that most retail generators outside Divert's portfolio choose
      alternative pathways. An emerging competing workflow—Mill Industries' partnership with
      Amazon to deploy in-store food processing at Whole Foods Market by 2027—represents a
      decentralized model that, if successful, could limit Divert's addressable market in
      premium grocery. Divert's off-site model handles all food formats and packaging types
      that in-store systems cannot, limiting direct substitution, but the competitive signal
      warrants monitoring.
