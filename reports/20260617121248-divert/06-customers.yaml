  - id: adoption-trajectory-and-scale
    title: Adoption Trajectory and Scale
    body: >-
      Divert's customer footprint has grown consistently over 19 years, accelerating in 2024.
      As of mid-2026 the company supports approximately 7,800 customer locations across all
      50 U.S. states, up 22% year-over-year in 2024. Volume processed grew 52% in 2024 to
      over 630 million pounds—the strongest annual milestone disclosed. Cumulatively Divert
      has processed 3.8 billion pounds of unsold food and facilitated 15 million meals
      donated. Food donations facilitated in 2024 totaled 2.1 million pounds (1.7 million
      meals), continuing an 18-year trajectory of 15.7 million pounds donated since 2018.
      The customer-location metric blends store-level retail and site-level industrial
      locations; the account-level breakdown is not publicly disclosed. The divergence between
      22% location growth and 52% volume growth suggests either deeper utilization per
      existing location, new higher-volume industrial accounts, or both. The Feeding America
      partnership active since 2018 covers 13 major retailers across 38 states, providing a
      geographic breadth signal for retail penetration even without per-banner account counts.
      The formal entry into warehouses, distribution centers, and manufacturing in 2024—
      confirmed by USCS (July 2025) and Blue Diamond (September 2024)—represents the first
      vertical expansion beyond grocery retail.
