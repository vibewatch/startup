figures:
  - id: FU001
    type: journey-map
    title: Customer journey map
    layout: wide
    summary: >-
      Six-stage customer adoption journey from regulatory or shrink trigger through
      multi-banner expansion, mapping buyer/user/payer handoffs and switching-friction
      accumulation points at each stage.
    data:
      nodes:
        - id: j1
          label: "Stage 1: Regulatory or Shrink-Cost Trigger"
          detail: >-
            Buyer (sustainability or operations team) identifies an organic-waste compliance
            obligation (SB 1383, MassDEP ban, WA Organics Management Law) or quantifies
            food-shrink as a material P&L cost (~$40K per store per day in lost profit per
            Divert CEO). Regulatory mandates create a non-discretionary entry trigger;
            shrink reduction creates a financial ROI trigger.
          tone: neutral
        - id: j2
          label: "Stage 2: Vendor Evaluation"
          detail: >-
            Operations or sustainability team evaluates Divert against composting haulers,
            zero-waste consultants, or in-store reduction software. Divert differentiates
            on end-to-end reverse logistics, RFID data, certified destruction, RNG diversion,
            and Feeding America donation optimization from a single vendor.
          tone: neutral
        - id: j3
          label: "Stage 3: MSA / Service Contract"
          detail: >-
            Corporate sustainability or procurement signs a multi-year managed service
            agreement. Pricing displaces existing landfill tipping fees ($50–$150/ton range);
            contract structure, length, and take-or-pay clauses are not publicly disclosed.
            Payer is the corporate banner, not individual stores.
          tone: positive
        - id: j4
          label: "Stage 4: Bin Integration and Staff Training"
          detail: >-
            RFID-tagged collapsible bins placed in store back rooms; store associates trained
            on sorting protocol; reverse logistics cadence established — daily backhaul from
            stores to retailer distribution center, then onward to nearest Divert facility.
            Industrial customers arrange trailer or tanker pickups directly.
          tone: positive
        - id: j5
          label: "Stage 5: Monthly Analytics and Diversion Service"
          detail: >-
            Monthly RFID data reports delivered to district managers; donation opportunities
            identified via Feeding America MealConnect integration; non-donatable food
            processed at Divert facility into RNG and fertilizer; certificates of destruction
            issued to industrial clients. Data benchmarks accumulate, deepening switching cost.
          tone: positive
        - id: j6
          label: "Stage 6: Cross-Banner or Multi-Facility Expansion"
          detail: >-
            Successful banner expands to full store fleet (Giant Food rolled from subset to all
            163 stores; Kroger from Compton CA to multiple regions). Industrial customers may
            enroll additional facilities. Corporate parent (Ahold Delhaize USA, Kroger) insights
            from one banner inform cross-banner RFP opportunities. New Divert facilities unlock
            adjacent geographies for existing accounts.
          tone: positive
    claimRefs:
      - CU023
      - CU024
      - CU034
      - CU039
      - CU040
      - CU041
    approximationNotes: null

  - id: FU002
    type: funnel
    title: Adoption / deployment funnel
    layout: standard
    summary: >-
      Adoption funnel from total addressable U.S. grocery and industrial food-waste generators
      down to named deployments with quantified outcomes, illustrating penetration depth.
    data:
