  - id: named-customer-proof
    title: Named Customer Proof — Production Deployments and Outcomes
    body: >-
      Divert's strongest publicly evidenced proof concentrates in six deployments spanning
      retail and industrial segments. Giant Food (Ahold Delhaize, 163 stores across MD/VA/DC/DE)
      is the best-documented anchor: the program launched June 2022 and by February 2025 had
      processed nearly 80 million pounds of unsold food—mitigating 37,000+ metric tons of CO2e
      and preventing over 35 million pounds from being wasted in 2024 alone—corroborated
      across five independent trade publications and confirmed by Giant's SVP of Operations
      on record. An unnamed 190-store Mid-Atlantic grocery chain ran Divert's RFID reverse
      logistics program from 2017 for at least five years, achieving a measurable 9% reduction
      in tons of unsold food per store. Three unnamed Pacific Northwest grocery chains (466
      stores, since 2017) have diverted 230,000 tons of inedible food and sent 35 million
      gallons of slurry to a partnering farm, generating renewable electricity and organic
      fertilizer in a documented closed-loop system. United States Cold Storage (USCS)—
      third-largest refrigerated warehousing provider in North America, 424 million cubic feet
      across 40 facilities in 13 states—announced California collaboration with Divert in
      July 2025 for SB 1383 compliance, with the Sustainable Development Manager quoted on
      record. Blue Diamond Growers (world's leading almond processor, 3,000+ farmer-owner
      cooperative) announced a September 2024 partnership to convert almond processing
      byproducts to renewable energy and soil amendment at Turlock, with Head of Sustainability
      quoted on record. Albertsons Portland Division's Senior Director of Sales and Support
      confirmed on record that the Longview facility provides "an integrated organics diversion
      solution in the region we can rely on." CEO Ryan Begin confirmed Kroger's Compton, CA
      distribution center as Divert's first major commercial success, processing food waste
      from 330 Ralphs and Food 4 Less locations.
