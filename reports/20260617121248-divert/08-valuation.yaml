callouts:
  - calloutType: recommendation
    title: Valuation Stance — Stretched; Track Pending Financial Disclosure
    body: >-
      At >$1B, Divert is priced for a 30-facility infrastructure success case that has not yet
      been demonstrated. The mark is defensible for strategic investors (Mitsubishi, Enbridge)
      pricing RNG offtake optionality and long-duration infrastructure; it is not underwritable
      for financial-return LPs without NDA access to revenue, EBITDA, and facility-level P&Ls.
      Track until: (1) Series C terms and cap table are disclosed, (2) facility-level economics
      are provided under NDA, or (3) valuation re-sets to a level anchored by verifiable metrics.
    claimRefs:
      - CV001
      - CV007
      - CV042

  - calloutType: risk
    title: Capital Gap Is the Central Execution Risk
    body: >-
      With 30 facilities targeted and ~$90–$120M capex each, total program capex is $2.7B–$3.6B.
      Disclosed committed financing totals approximately $1.09B (Enbridge $1B infrastructure
      commitment + Nuveen $90M+), leaving a ~$1.6B+ gap that must be closed facility by facility
      through independent project-finance events. Each such event is a binary risk: a failed
      lender engagement stalls construction and delays EBITDA realization, compressing the
      base-case valuation multiple.
    claimRefs:
      - CV022
      - CV003
      - CV005

  - calloutType: insight
    title: Mitsubishi Deal Structure Signals Strategic, Not Financial, Valuation Driver
    body: >-
      The bundled equity-plus-preferred-RNG-offtake structure in the Series C is atypical of
      financial PE deals. Mitsubishi is paying an infrastructure premium to secure long-term
      access to food-waste RNG for Japan and global markets—value that is not captured by
      standard EV/Revenue or EV/EBITDA multiples. This partially explains the stretched
      financial multiple: the strategic buyer is implicitly subsidizing the valuation with
      offtake optionality that is worth far more to Mitsubishi than to an LP fund with a
      10-year return mandate.
    claimRefs:
      - CV002
      - CV041
      - CV042

