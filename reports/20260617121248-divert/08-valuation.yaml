  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >-
        Revenue, EBITDA, ARR, gross margin, cash position, and facility-level P&Ls for Turlock
        CA and Longview WA are not publicly disclosed in any source.
      whyItMatters: >-
        Without financials, no verifiable multiple can be applied to the $1B+ mark; the
        bull/base/bear scenarios carry extremely high uncertainty; NDA access is required
        before any capital commitment can be underwritten.
      diligencePath: >-
        Request NDA data room from Divert management with quarterly consolidated P&Ls,
        facility-level revenue breakdown, and 2026 full-year revenue and EBITDA guidance.
      relatedQuestionRefs:
        - QV003

    - type: private-evidence-only
      severity: material
      topic: Series-C-terms
      missingEvidence: >-
        Total equity raised in the Series C, all investors beyond Mitsubishi, pre-money/post-money
        split, preference terms, and full cap-table are not publicly disclosed.
      whyItMatters: >-
        Preference overhang from Enbridge growth equity, Nuveen project debt, Mitsubishi Series C
        preferences, and any existing Ara Partners preferences could materially impair common
        equity returns; dilution schedule is essential for any LP return analysis.
      diligencePath: >-
        Request full cap-table and waterfall model from CFO Brad Lukow; verify liquidation
        preferences, anti-dilution provisions, and participation rights for each investor class.
      relatedQuestionRefs:
        - QV028

    - type: private-evidence-only
      severity: material
      topic: offtake-opacity
      missingEvidence: >-
        Mitsubishi preferred RNG offtake pricing, volume commitments, floor/ceiling pricing,
        tenure, and termination provisions are not publicly disclosed.
      whyItMatters: >-
        The Mitsubishi offtake is a core component of the strategic premium justifying the $1B+
        mark; if priced at or near spot without floors, the strategic rationale partially collapses
        and the valuation is harder to defend.
      diligencePath: >-
        Request Mitsubishi offtake term sheet or executive summary as part of NDA data room.
      relatedQuestionRefs:
        - QV007

    - type: private-evidence-only
      severity: material
      topic: project-finance-pipeline
      missingEvidence: >-
        Project finance lenders, term sheets, and funding status for the North Carolina facility
        and the next 5–8 planned facilities are not publicly disclosed beyond the Nuveen $90M+ deal.
      whyItMatters: >-
        Each facility is an independent project-finance event; the ~$1.6B+ capital gap must close
        facility by facility; a failed financing event stalls the buildout and compresses the
        base-case valuation multiple.
      diligencePath: >-
        Request project finance pipeline from the CFO with lender names, term-sheet status, and
        indicative debt-to-equity ratios for each planned facility.
      relatedQuestionRefs:
        - QV006

