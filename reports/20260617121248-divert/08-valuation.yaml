  - id: exit-and-diligence
    title: Exit Readiness, Strategic Optionality, and Final Diligence Asks
    body: >-
      Divert's most probable exit paths are strategic acquisition or infrastructure-sponsor
      roll-up, not near-term IPO. Waste Management and Republic Services are the natural
      strategic buyers given national logistics footprints and existing RNG programs; both
      have EV/Revenue at 4–5x and EBITDA margins that could absorb Divert's service-fee
      revenue stream at a premium (CV040). Mitsubishi's preferred offtake rights create a
      structural incentive for a staged buyout: as facilities ramp and offtake values are
      confirmed, MC may increase equity stake toward outright control (CV041). Enbridge,
      with its 10% stake and $1B infrastructure commitment, is positioned as a long-term
      infrastructure co-investor rather than a strategic acquirer.

      An IPO remains on the horizon but is unlikely before 5–8 operational facilities are
      generating demonstrable, recurring EBITDA—probably 2028–2030 at the earliest. The
      company processed 630M+ lbs in 2024 (52% growth) (CV020), serves 7,800+ customer
      locations across all 50 states (CV021), and has a 30-facility national buildout roadmap
      supported by Ara Partners' infrastructure expertise (CV022). The Longview WA facility
      began injecting gas into the pipeline on April 9, 2026, and can produce up to 235,000
      MMBtu/yr of RNG at full capacity (CV023). Two operational AD facilities and one under
      construction give Divert the operational track record to begin attracting LP co-investors
      for the next tranche of project finance (CV024). The US has 121 standalone food-waste
      digesters nationally and potential for 1,370 new sites, defining a large but currently
      thin market (CV026). Private-sector food-waste investment reached $794M in 2025 (CV027),
      confirming institutional appetite for the sector.

      Before committing capital at the current $1B+ mark, the minimum diligence required
      includes: NDA access to facility-level P&Ls for Turlock CA and Longview WA (the only
      two operational data points), a full cap-table and waterfall model to assess preference
      overhang, and the Mitsubishi offtake term sheet to verify pricing and volume. Without
      these materials, underwriting relies entirely on strategic narrative and public-comp
      inference, not on verifiable unit economics.
