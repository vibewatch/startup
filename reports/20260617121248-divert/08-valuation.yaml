      whyItMatters: >-
        High retailer concentration without NRR data creates undisclosed revenue risk;
        if Kroger or Albertsons renegotiated contracts downward, service-fee revenue could
        decline materially without public warning.
      diligencePath: >-
        Request revenue-by-account breakdown (top 10 customers by share), NRR by vintage cohort,
