chapter:
  number: 8
  title: Valuation
  summary: >-
    Divert's April 2026 Series C led by Mitsubishi Corporation elevated its equity valuation to
    over $1 billion—a strategic-infrastructure premium encoding the optionality of a 30-facility
    national buildout and global RNG offtake rights, not current-period earnings. With no
    disclosed revenue, EBITDA, or ARR, the $1B+ mark is anchored only by deal structure and
    comparable-set inference: public pure-play Anaergia trades at ~2.2x EV/Revenue on CAD $210M
    trailing revenue while barely EBITDA-positive; diversified operators WM and RSG trade at
    4.4–4.7x on ~30% EBITDA margins Divert cannot yet demonstrate; Enviri at 1.76x sets a
    low-multiple industrial services floor. Applying these brackets implies $220–$570M in revenue
    needed to justify the current mark—well above Divert's likely 2026 run-rate from just two
    operational AD facilities. The valuation stance is stretched for financial-return-focused
    investors; strategically defensible for Mitsubishi and Enbridge whose infrastructure and
    offtake optionality warrant a long-duration premium. A $2B-$5B bull exit is achievable at
    full 30-facility scale; a bear scenario with capital-gap crystallization or RNG economics
    deterioration implies a down-round to $200–$600M.

sections:
  - id: valuation-context-and-financing
    title: Valuation Context, Financing Structure, and Entry Discipline
    body: >-
      Divert's valuation entered unicorn territory on April 14, 2026, when Mitsubishi Corporation
      (MC) led the company's Series C financing and the announcement explicitly stated the
      partnership "elevating the company to a valuation of over $1 billion" (CV001). This is
      the first publicly confirmed valuation mark for Divert; earlier rounds were not accompanied
      by disclosed marks. The Series C combines two distinct instruments: a direct equity
      investment by Mitsubishi and, inseparably, preferred offtake rights for renewable natural
      gas at future Divert facilities beyond the North Carolina plant (CV002). This bundled
      equity-plus-offtake structure is atypical of pure-play infrastructure transactions and
      signals that Mitsubishi's investment thesis is driven by long-term energy access and
      strategic RNG supply for Japan, not only financial return (CV041).

      The cap-table context is material for understanding the valuation. Ara Partners, the
      industrial-decarbonization private equity firm with ~$6.6B AUM, has held a controlling
      stake since its 2021 acquisition (CV006). Enbridge, the Canadian pipeline giant, holds a
      10% equity stake acquired through its March 2023 $80M growth-equity investment, alongside
      a $1 billion infrastructure development commitment that represents project-finance capacity
      rather than paid-in equity (CV003). BP secured a ~$175M, 10-year RNG offtake agreement
      covering three specific existing facilities (CV004). Nuveen Energy Infrastructure Credit
      provided $90M+ in project debt to fund the Lexington, North Carolina facility (CV005).
      The aggregate of committed project finance plus pre-Series-C equity totals approximately
      $1.09B—covering less than half of the $2.7B–$3.6B estimated to complete the 30-facility
      national buildout (CV022).

      Critically, Divert has never disclosed revenue, EBITDA, ARR, cash position, or
      facility-level margin data in any public filing or press release (CV007). The $1B+
      valuation is therefore unanchored to verifiable financial metrics and cannot be
      underwritten at the public-market level without NDA access. The CFO Brad Lukow confirmed
      in April 2026 that the Series C round remains open and that "other infrastructure funds
      are circling as potential investors" (CV008), implying the round is not fully subscribed.
      AgriInvestor quoted Ara Partners' Cory Steffek describing Divert as "nearly outpacing the
      entire RNG market"—a characterization with no numerical substantiation in public data
      (CV009). The entry discipline implication: strategic investors pricing RNG optionality
      and regulatory tailwinds can justify current levels; financial-return LPs without access
      to facility economics should require an NDA data room before committing capital.
