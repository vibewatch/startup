  - id: buyer-and-segment-landscape
    title: Buyer and Segment Landscape
    body: >-
      Divert's buyer base divides into four primary commercial segments and one capital-markets
      tier. Grocery retailers are the core; Divert serves approximately 7,800 customer locations
      nationally and has named partnerships with Giant Food (Ahold Delhaize USA), Safeway
      Northern California, and other major chains (CM021, CM024). Budget authority sits with
      sustainability officers and operations vice presidents who are motivated by regulatory
      compliance, cost savings (an average grocery store can lose ~$40,000 per day in food
      waste-related lost profit), and ESG reporting metrics (CM025, CM053). The RFID-based
      data-analytics layer creates measurable shrink reduction—one mid-Atlantic retailer with
      190 stores achieved a 9% reduction in unsold food tonnage over five years—which
      strengthens the ROI narrative for buyers (CM052).

      Industrial food customers (manufacturers, processors) represent the fastest-growing
      segment; Divert expanded into warehouses, distribution centers, and manufacturing in 2024,
      adding Blue Diamond Growers (almond processing byproducts) and United States Cold Storage
      (CM026). Budget ownership shifts to plant sustainability managers and procurement, who
      value certified destruction, brand integrity, and logistics simplicity. Three grocery chain
      customers diverting waste from over 466 stores prevented approximately 230,000 tons of
      inedible food from landfills since 2017 in one documented closed-loop infrastructure
      case (CM023).

      Foodservice operators (restaurants, institutions, hospitality) are adjacent but not a
      primary focus; composting accounted for 58% of foodservice surplus food destinations in
      2024 and remains the dominant pathway due to existing municipal infrastructure (CM027).
      The infrastructure capital tier—Enbridge, Mitsubishi, Ara Partners—is a different buyer
      class (capital co-investors) who require RNG offtake economics and project-finance
      returns rather than service-contract ROI (CM019). For all buyer segments, Divert's
      bundled end-to-end model creates meaningful switching costs through RFID deployment,
      data integration, and operational co-training, differentiating it from single-service
      haulers or pure-software platforms (CM028).
