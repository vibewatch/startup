company:
  name: Divert

chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Divert operates at the intersection of U.S. commercial food waste diversion services and
    organics-to-RNG infrastructure, a market defined by ~70 million tons of annual U.S. surplus
    food ($380B value) yet with only ~1% of retail and foodservice waste currently reaching
    anaerobic digestion. Twelve states now have active food waste diversion mandates, private
    sector investment in solutions reached $794M in 2025, and the global AD market is expanding
    at ~7% CAGR—but capital-intensive permitting friction, limited stand-alone AD infrastructure
    (121 facilities nationally), and landfill-disposal inertia constrain the pace at which the
    addressable market will convert to managed diversion services.

sections:
  - id: market-definition-and-scope
    title: Market Definition and Scope
    body: >-
      Divert's market is best understood as the intersection of two adjacent value chains:
      U.S. commercial food waste diversion services and organics-to-renewable-natural-gas (RNG)
      infrastructure. On the services side, the company sells logistics, data analytics,
      certified destruction, donation optimization, and depackaging solutions to grocery
      retailers, food manufacturers, warehouses, and distributors. On the infrastructure side,
      Divert owns and operates Integrated Diversion & Energy Facilities that convert the collected
      organics into RNG and fertilizer. Both layers target the same underlying problem: the
      ~70 million tons of U.S. surplus food generated annually, of which roughly 29% is classified
      as food waste going to disposal destinations (CM002, CM047).

      The market boundary excludes residential food waste, farm-level crop loss, consumer-facing
      apps, and general solid waste hauling without a food-diversion mandate. Divert's core
      addressable supply is commercial food waste from establishments with meaningful organic
      waste volume—primarily grocery retailers and industrial food operators. Status-quo
      substitutes are landfill disposal (still the single largest commercial waste destination
      at ~21% of retail surplus in 2024), municipal composting collection, and single-service
      waste haulers that lack integrated depackaging or data services (CM040, CM043). The
      total value of industry surplus food in 2024 was $122 billion (excluding consumer plate
      waste), illustrating the financial scale of the problem Divert is positioned to solve
      (CM045). Retail's unsold food share was 3.98 million tons in 2024, representing $26.9B
      in lost sales for the sector—a compelling ROI anchor for prevention-focused services
      (CM004). Residential food waste (33.5% of total surplus) and farm-level losses (24.2%)
      are outside Divert's core scope but may represent future adjacencies (CM006).
    claimRefs:
      - CM002
      - CM004
      - CM006
      - CM040
      - CM043
      - CM045
      - CM047
    tableRefs:
      - TM001

  - id: market-sizing-multiple-lenses
    title: "Market Sizing: Multiple Lenses and Contradictory Estimates"
    body: >-
      No publicly available third-party TAM estimate exists specifically for the U.S. commercial
      food waste diversion service market that Divert serves. Three distinct lenses yield
      substantially different estimates, and all are preserved here with their limitations.

      The broadest lens—the global anaerobic digestion market tracked by MarkNtel Advisors—is
      valued at $64.24 billion globally in 2025 and projected to reach $103.1 billion by 2032
      at a 6.86% CAGR, with North America holding ~42% market share (~$29 billion in 2026)
      (CM007, CM008). This estimate spans all organic feedstocks including agricultural manure,
      municipal biosolids, and industrial organics, making it a severe overstatement of Divert's
      serviceable market; however it confirms the secular demand for AD infrastructure investment.

      A narrower lens starts with the food loss value metrics published by ReFED: $380 billion
      in total surplus food value in 2024, of which $122 billion represents industry sector losses
      (retail + manufacturing + foodservice, excluding consumer plate waste), and $26.9 billion
      reflects retail sector lost sales alone (CM003, CM045, CM004). These are cost-of-waste
      metrics, not service revenue estimates, but they underscore the financial motivation for
      diversion investment.

      The most grounded but also most constrained lens is a bottom-up estimate using EPA tipping
      fee data and commercial waste volumes. EPA surveys of AD facilities in 2022–2023 show
      average tipping fees of $32.27 per ton and median of $22.23 per ton (CM014). Applying these
      rates to an estimated 8–16 million tons of commercially addressable, currently landfilled
      food waste yields a logistics and processing service revenue TAM of roughly $240M–$500M
      per year, excluding RNG monetization, data services, and certified destruction premiums
      (CM015). Adding those revenue layers expands the estimate to a range of $500M–$2B+ (CM016).
      A conflicting interpretation—applying the North American AD market benchmark directly—would
      suggest the market is orders of magnitude larger, but this fails to account for the 90%+
      share of the AD market not addressable by commercial food waste diversion services (CM050,
      CM051). Enbridge's $1 billion infrastructure commitment to Divert's 30-facility buildout
      provides an implicit validation that the capital markets view this as a multi-billion-dollar
      infrastructure opportunity, even if the annual service-revenue TAM is smaller (CM019).
    claimRefs:
      - CM003
      - CM004
      - CM007
      - CM008
      - CM014
      - CM015
      - CM016
      - CM019
      - CM045
      - CM050
      - CM051
