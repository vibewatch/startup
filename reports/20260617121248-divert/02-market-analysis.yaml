  - id: FM004
    title: "Adoption Funnel: Commercial Food Waste from Generation to Divert's Processed Volume"
    type: funnel
    layout: standard
    summary: >-
      Funnel illustrating the progressive narrowing from total U.S. commercial food
      waste generation to volumes currently processed by Divert; highlights the
      structural gap between mandate-addressable diversion and actual captured volume.
    data:
      items:
        - label: "Total U.S. commercial food waste generated annually (manufacturing + foodservice + retail)"
          value: 30
        - label: "Commercial waste not currently diverted to composting or AD (est. landfilled/incinerated)"
          value: 20
        - label: "Mandated/high-ESG portion addressable by integrated diversion services"
          value: 8
        - label: "Within reach of Divert's current 2 operational facility footprint (rough geographic estimate)"
          value: 2
        - label: "Actually processed by Divert in 2024 (315K tons = 0.315M tons)"
