      All values in millions of tons per year. Tier 1 (30M) derived from ReFED sector
      breakdown (manufacturing 18.8% + foodservice 17.9% + retail 5.7% of 70M total =
      42.4% × 70M ≈ 30M). Tier 2 (20M) estimated as 75% of commercial waste minus
      existing composting/AD diversion per EPA data. Tier 3 (8M) is a rough estimate
      of mandate-geography commercial waste based on 12 states with active policies.
      Tier 4 (2M) is author estimate of within-100-mile catchment for 2 facilities.
      Tier 5 (0.3M = 315K tons) is Divert's 2024 actual disclosed processing volume.
      This funnel is illustrative; all tiers except Tier 5 are estimates.
