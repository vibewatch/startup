      whyItMatters: >-
        Without confirmed per-facility capex, the SOM and SAM estimates cannot be stress-tested
        for capital adequacy; a higher-than-assumed per-facility cost could compress the achievable
        30-facility buildout and reduce the SOM.
      diligencePath: >-
        Request per-facility cost model from Divert's CFO; benchmark against comparable AD
        infrastructure projects (Anaergia, Clean Earth Capital, Divert Turlock disclosed data).
      relatedQuestionRefs: [QM011]

    - type: private-evidence-only
      severity: material
      topic: market-sizing
      missingEvidence: >-
        Divert's per-location or per-ton service revenue, average contract value, and revenue mix
        across logistics, data services, RNG, and certified destruction have not been publicly disclosed.
      whyItMatters: >-
        Without disclosed unit economics, the bottom-up TAM estimate is approximate; the revenue
        per location or ton is essential for sizing the SOM and assessing Divert's path to profitability.
      diligencePath: >-
        Request management financial model; benchmark tipping fee and service fee assumptions
        against EPA survey medians and comparable operators.
      relatedQuestionRefs: [QM009]

    - type: missing-source
      severity: minor
      topic: adoption-constraints
      missingEvidence: >-
        Mapping of Divert's approximately 7,800 customer locations against states with active
        food waste diversion mandates to determine what fraction of the current customer base
        is in mandate-enforced geographies versus voluntary adoption.
      whyItMatters: >-
        Mandate geography overlap drives near-term revenue defensibility; if most current
        customers are in non-mandate states, churn risk increases if ESG pressure weakens.
      diligencePath: >-
        Overlay Divert's disclosed customer geography data against ReFED's state mandate
        tracker and Divert's own legislative tracker to compute mandate-exposed share.
      relatedQuestionRefs: [QM020]

    - type: missing-source
      severity: material
      topic: adoption-constraints
      missingEvidence: >-
        Comparative landfill tipping fee data by Divert's specific target geographies (California,
        Washington, North Carolina, Ohio, Massachusetts) to assess the economic gap that must be
        closed for retailers to switch from landfill to AD services in each state.
      whyItMatters: >-
        Landfill economics in non-mandate states determine how much Divert depends on regulation
        versus voluntary ROI to win new contracts; geography-specific analysis is needed for
        the 30-facility buildout market plan.
      diligencePath: >-
        Consult EPA LMOP landfill tipping fee data and state solid waste authority reports
        for each target state; request Divert's internal competitive pricing analysis.
      relatedQuestionRefs: [QM013]

    - type: conflicting-data
      severity: material
      topic: adoption-constraints
      missingEvidence: >-
        Independent assessment of PFAS and microplastics contamination levels in Divert's
        depackaging-derived digestate and whether its current fertilizer end-use claims
        are defensible under evolving state and federal regulatory guidance.
      whyItMatters: >-
        PFAS contamination in digestate is a rapidly evolving regulatory concern; if Divert's
        digestate is restricted from fertilizer land application (as has happened to some
        composters), it would undermine the circular economy positioning and require alternative
        digestate disposal at additional cost.
      diligencePath: >-
        Commission independent lab testing of Divert's Turlock and Longview digestate streams;
        review California DTSC and EPA guidance on PFAS in land-applied digestate.
      relatedQuestionRefs: [QM021]

    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        No independent third-party market research report specifically sizing the U.S. commercial
        food waste diversion services and organics-to-RNG market as a discrete segment has been
        identified; current sizing relies on author estimation from component data sources.
      whyItMatters: >-
        Without a purpose-built TAM study, Divert's management and investors may be working
        from internally constructed market estimates that are difficult to validate independently,
        introducing model risk in the growth investment thesis.
      diligencePath: >-
        Commission or request a market sizing study from a credentialed firm (ReFED, BloombergNEF,
        Wood Mackenzie, or similar) scoped specifically to commercial food waste diversion service
        revenue in the U.S.
      relatedQuestionRefs: [QM005, QM026]

