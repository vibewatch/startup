  - id: growth-drivers-and-regulatory-tailwinds
    title: Growth Drivers and Regulatory Tailwinds
    body: >-
      The most powerful growth driver is the expanding state-level regulatory mandate landscape.
      As of 2025, 12 U.S. states have active food waste diversion policies, 24 bills passed
      in 2025, and 110 bills were introduced in 2025 alone (CM030). California's SB 1383
      requires a 75% reduction in organic waste sent to landfills from 2014 levels by 2025
      and that 20% of still-edible food surplus reach food recovery organizations—directly
      expanding the supply of tonnage seeking diversion infrastructure (CM031). Washington
      State's organics management laws (2022, 2024, 2025) target removal of 75% of organics
      from landfills by 2030 and aim to nearly quadruple collected organics by 2035; from
      2026, commercial generators producing ≥96 gallons of organic waste per week must divert
      material, creating immediate demand for Divert's Longview, WA facility (CM032, CM034).
      Massachusetts has banned commercial organic waste disposal since 2014 (expanded in
      2022 to generators ≥0.5 ton/week), with documented economic impact of 1,700+ jobs and
      $390 million in state economic activity—evidence that diversion mandates translate into
      durable commercial infrastructure investment (CM033).

      Private sector investment in food waste solutions rose 16% in 2025 to a total of $794M
      (private + federal), the first increase in four years, signaling renewed capital confidence
      in the sector (CM029, CM049). AI-powered demand-planning tools raised over $30M in private
      funding in 2025 and are extending the prevention layer of the market (CM036). RNG demand
      is accelerating as pipeline operators seek pipeline-quality renewable gas; Divert's
      Longview facility is expected to generate 235,000 mmBtu/year of RNG under a Cascade Natural
      Gas interconnection agreement (CM035). The U.S. Food Waste Pact doubled its signatories
      to 30 by 2025, representing 54% of grocery retail by market share, normalizing corporate
      food waste measurement and target-setting (CM037, CM046).
