  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - Customer Job
      - Current Workflow (Without Divert)
      - Divert Solution
      - Measurable Benefit
      - Limitation
    rows:
      - - "Grocery retailer: reduce unsold perishables and shrink"
        - Manual store log; dumpster disposal; occasional food bank pickups
        - RFID bins + reverse logistics + monthly analytics + co-training
        - 9% unsold food reduction over 5 years (Mid-Atlantic 190-store case); up to 20% donation increase (Feeding America program)
        - RFID case is single documented case; benefit may vary by store format and region
      - - "Food manufacturer / processor: certified disposal of production residuals and finished goods"
        - Third-party hauler; landfill or rendering; in-house manual depackaging
        - Depackaging + AD at Turlock or Longview; certified destruction documentation
        - Brand-protective destruction; avoids landfill; compliance documentation
        - Facility geographic coverage limited; 30-facility buildout not complete
      - - "Cold storage / warehouse: manage unsellable food and beverage inventory"
        - Storage until spoiled; landfill hauling; EPA compliance risk
        - Divert program at Turlock facility (USCS partnership, July 2025)
        - Compliance pathway; ESG reporting benefit; renewable energy conversion
        - Currently only California USCS locations confirmed; national coverage not yet established
      - - "Food retailer: optimize donation before disposal"
        - Manual donation pickup coordination; incomplete visibility into donatable surplus
        - MealConnect + Divert bin data integration; 13 major retailers; 38 states
        - Up to 20% increase in donations; actionable retailer insights from combined data
        - Donation data depends on Feeding America MealConnect platform; single third-party dependency
    notes: "Benefits are sourced from official Divert case studies and press releases (company-claimed). The RFID 9% shrink reduction is the only independently verifiable metric (five-year longitudinal case study). Donation increase figures are company-reported."
    claimRefs: [CE011, CE012, CE015, CE016, CE017, CE042]

  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / Process
      - Role
      - Key Dependency
      - Risk
    rows:
      - - RFID Bin Data Layer
        - Captures store-level unsold food by department; feeds prevention analytics and donation routing
        - Proprietary RFID hardware (tags + bins); store back-room operations integration
        - Hardware loss or damage; retailer buy-in for back-room process change; data latency
      - - Reverse Logistics Network
        - Collects bins from stores; consolidates at retailer DCs; transports to Divert facilities
        - Retailer existing supply chain and transportation network; Divert collapsible bin fleet
        - Route efficiency; geographic reach limited to facility catchment radius; driver availability
      - - Facility Intake & Receiving
        - 24/7 dock; tanker and trailer receipt; weighing and data capture
        - Facility staffing; certified destruction chain-of-custody protocols
        - Throughput bottleneck if intake capacity is below inbound volume
      - - Depackaging Unit
        - Mechanical separation of food from packaging; produces liquid slurry and inert packaging waste
        - Proprietary or licensed depackaging equipment (specifications not public); power and water
        - Microplastics contamination of slurry from packaging residues; equipment downtime; output purity variability
      - - Anaerobic Digestion System
        - Converts liquid slurry to biogas via microbial digestion; produces digestate
        - Digester tanks; inoculum culture; process temperature and pH controls; Enbridge offtake for RNG
        - Feedstock variability affecting biogas yield; digestate microplastics; regulatory compliance for land application
      - - Output Processing (RNG / Fertilizer)
        - Upgrades biogas to pipeline-grade RNG; processes digestate into nutrient-rich fertilizer
        - Gas upgrading equipment; RNG grid interconnect (Enbridge); land-application permits for fertilizer
        - RNG price fluctuation; fertilizer regulatory standards (microplastics); pipeline access constraints
    notes: "Architecture derived from official facility descriptions, case studies, and industry technical sources. Equipment specifications and process parameters are not publicly disclosed; layers described at functional level. Source: divertinc.com, wastetodaymagazine.com, biocycle.net, epa.gov."
    claimRefs: [CE009, CE013, CE021, CE022, CE030, CE044, CE049]

  - id: TE004
    title: Trust / Quality / Compliance Table
    columns:
      - Control / Metric / Risk
      - Status
      - Scope
      - Gap / Diligence Ask
    rows:
      - - Certified Destruction (brand protection)
        - Operational; certificates of destruction issued with photos, videos, and sustainability reports
        - Industrial customers (manufacturers, distributors); packaged food and byproducts
        - No disclosed third-party audit standard or certification body; diligence on chain-of-custody SOC equivalent
      - - RFID Audit Trail (retail shrink)
        - Operational; monthly store-level reporting
        - Grocery retailers in the reverse logistics program
        - Audit trail standards not publicly documented; claims based on single five-year case study
      - - Microplastics in Digestate (land application risk)
        - Adverse / open risk; no disclosed monitoring protocol or public data
        - All AD facilities where packaged food is processed via depackaging
        - Peer-reviewed data (Frontiers, 2025) shows 120–3,300+ MP/kg in food-waste AD digestate; no Divert-specific disclosure
      - - Carbon-Negative RNG Claim
        - Company-claimed; no public lifecycle analysis (LCA) or third-party verification
        - Longview, Turlock, and future facilities
        - "Diligence ask: third-party LCA; basis for carbon-negative designation not disclosed"
      - - EPA / State Permitting (facility operations)
        - Longview completed WA environmental review (confirmed by WasteDive); Lexington permitting underway
        - Each facility subject to local, state, and federal air, solid waste, and water regulations
        - Permitting timelines can delay facility openings (Longview opened ~2 years late); each new site carries fresh permitting risk
    notes: "Adverse assessments based on independent technical literature (Frontiers peer-reviewed paper) and industry panel reports (BioCycle ReFED 2026). Company-claimed controls are unaudited externally. Source: frontiersin.org, biocycle.net, wastedive.com, epa.gov."
    claimRefs: [CE031, CE033, CE034, CE035, CE036, CE037, CE043, CE044, CE046]

