  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: IP-and-differentiation
      missingEvidence: "Patent filings, published technical specifications, or process documentation for Divert's depackaging and anaerobic digestion technology"
      whyItMatters: "Without disclosed IP, the competitive moat is entirely operational; a well-capitalized entrant or depackaging OEM could replicate the core technology, reducing long-term defensibility"
      diligencePath: "Search USPTO, EPO, and WIPO patent databases for filings by Divert, Inc. or its founders; request technical documentation in due diligence; confirm whether any exclusivity or licensing agreements exist with equipment vendors"
      relatedQuestionRefs: [QE011]

    - type: missing-source
      severity: material
      topic: carbon-negative-claim
      missingEvidence: "A third-party lifecycle analysis (LCA) or independent certification supporting Divert's 'carbon-negative' RNG designation"
      whyItMatters: "The carbon-negative claim is central to Divert's ESG narrative and RNG pricing premium; an unsupported claim creates greenwashing risk and could affect investor and customer confidence"
      diligencePath: "Request LCA methodology and third-party audit report from management; review Enbridge RNG offtake agreement for any embedded carbon certification requirements"
      relatedQuestionRefs: [QE012]

    - type: private-evidence-only
      severity: material
      topic: depackaging-technology
      missingEvidence: "Publicly disclosed depackaging output purity specifications (microplastic pass-through rates, packaging residue levels, slurry composition), OEM equipment identity, and process benchmarks"
      whyItMatters: "Without published purity specs, the 'high-recovery' claim cannot be independently validated; given emerging microplastics regulations, undisclosed contamination levels represent a forward regulatory and liability risk"
      diligencePath: "Request process spec sheet and independent purity test results from management; compare against BioCycle and EPA digestate quality standards; verify whether OEM equipment meets emerging EU or state microplastics limits"
      relatedQuestionRefs: [QE015]

    - type: missing-source
      severity: material
      topic: microplastics-risk
      missingEvidence: "Divert's internal microplastics monitoring protocol, any testing results from its facilities, and its regulatory engagement strategy as of 2026"
      whyItMatters: "If Divert is not actively monitoring and managing MP in digestate, it faces a near-term regulatory risk as states and EPA develop land-application standards; failure to disclose in diligence would be a material omission"
      diligencePath: "Request internal MP testing data and EH&S protocol; check NC DEQ and WA Ecology records for any permit conditions related to digestate land application at Lexington and Longview"
