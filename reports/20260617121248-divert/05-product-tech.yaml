company:
  name: Divert

chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Divert's product stack integrates RFID-based store-level data capture, reverse logistics,
    proprietary depackaging, and co-located anaerobic digestion into a Prevent / Provide /
    Power® circular system deployed across 7,800+ customer locations at two operational
    Integrated Diversion & Energy Facilities (Turlock, CA and Longview, WA). The competitive
    moat is operational integration — not disclosed patents — combining a data feedback loop,
    physical reverse logistics, mechanical depackaging, and renewable-energy conversion at a
    scale no competitor replicates end-to-end. Key adverse signals include an emerging
    microplastics contamination risk in digestate outputs, an absence of published IP, and
    the capital intensity of scaling to a planned 30-facility national buildout.

sections:
  - id: product-stack-overview
    title: "Prevent / Provide / Power®: End-to-End Product Stack"
    body: >-
      Divert organizes its product portfolio under a three-part framework: Prevent (reduce unsold
      food at source through data and training), Provide (optimize edible-food donation to the food
      insecure), and Power (convert non-donatable unsold food into renewable energy and fertilizer).
      This framework covers three customer segments — grocery retailers, food warehouses and
      distributors, and food manufacturers — and is delivered through six distinct service modules:
      RFID-based data analytics, reverse logistics and collapsible-bin collection, depackaging of
      packaged food, anaerobic digestion, certified destruction, and department-focused co-training.
      As of the latest public figures, Divert serves 7,800+ customer locations, has processed
      3.8 billion pounds of unsold food cumulatively, and has facilitated 15 million meals donated
      to the food insecure. The company has been operating in this space for 19 years. No product
      is offered as a standalone SaaS or hardware SKU — all modules are deployed as an integrated
      managed service, which makes the stack sticky but also capital-intensive to replicate.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008]
    tableRefs: [TE001]
    figureRefs: [FE001]

  - id: data-rfid-reverse-logistics
    title: "RFID / Data Layer and Reverse Logistics"
    body: >-
      The data layer is Divert's most differentiated software asset. Proprietary RFID-tagged bins
      are placed in retail back rooms; unsold food is sorted into bins at the store level, and the
      RFID platform captures store-specific waste data by department on a monthly basis. This
      store-level granularity enables Divert's customer-success teams to deliver root-cause
      analysis, benchmarking, and department-focused co-training — a feedback loop that actively
      reduces waste generation over time. A five-year RFID case study at a 190-store Mid-Atlantic
      grocery chain demonstrated a 9% reduction in tons of unsold food. The reverse logistics
      system uses collapsible bins to standardize collection, backhaul to retailer distribution
      centers, and onward transport to Divert's processing facilities. In a documented Pacific
      Northwest deployment, inedible food from 466+ grocery stores is collected daily and
      consolidated before reaching the facility. The Divert-Feeding America collaboration since
      2018 — covering 13 major retailers in 38 states — adds a donation-optimization layer,
      combining Divert's bin data with Feeding America's MealConnect platform to increase
      donations by up to 20%. Industry practitioners at NRF 2026 confirmed that RFID in grocery
      has moved from theoretical to "a question of ROI," strengthening adoption tailwinds for
      Divert's data layer.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014, CE015, CE016, CE017, CE018, CE019, CE045, CE048]
    tableRefs: [TE002]
    figureRefs: [FE002]

  - id: depackaging-anaerobic-digestion
    title: "Depackaging, Anaerobic Digestion, and Circular Outputs"
    body: >-
      At the processing facility, Divert's high-recovery depackaging technology mechanically
      separates food from its packaging, producing a clean liquid slurry. Packaging is commingled
      and rendered unidentifiable — a feature marketed to food manufacturers as certified
      destruction to protect brand integrity. Certificates of destruction, photos, videos, and
      sustainability impact reports are provided to industrial clients. The liquid slurry is fed
      into co-located anaerobic digestion (AD) tanks, where microbial activity converts organic
      matter into biogas. The biogas is upgraded to renewable natural gas (RNG) and the digestate
      is processed into nutrient-rich fertilizer. At the flagship Longview, WA facility (opened
      April 2026), full-capacity output is 235,000+ MMBtu of RNG and 450,000 lbs of fertilizer
      per year from 100,000 tons of food waste — enough to power 3,200+ homes and offset 23,000
      metric tons of CO2e. Divert describes its RNG as "carbon-negative," but no public lifecycle
      analysis has been disclosed. The Blue Diamond Growers partnership (September 2024) extends
      this model to almond processing byproducts at the Turlock, CA facility, demonstrating
      industrial versatility. BioCycle industry reporting confirms depackaging deployment is
      accelerating nationally, driven by tipping-fee economics, labor savings, and food-waste
      diversion regulations.
    claimRefs: [CE021, CE022, CE023, CE024, CE025, CE026, CE027, CE029, CE030, CE031, CE042, CE043, CE047]
    tableRefs: [TE003]
    figureRefs: [FE004]

  - id: facility-deployment-roadmap
    title: "Facility Deployment and Geographic Buildout"
    body: >-
      Divert's infrastructure strategy calls for 30 Integrated Diversion & Energy Facilities
      sited to be within 100 miles of 80% of the U.S. population. The current status: Turlock,
      CA is operational (opened 2024); Longview, WA is operational (opened April 2026); Lexington,
      NC broke ground April 2025 with more than $90 million in financing from Nuveen Energy
      Infrastructure Credit; Harrison, OH was announced in 2024. The Longview facility was the
      first industrial project to clear Washington State's environmental review process in
      southwest Washington in over a decade, indicating that permitting is achievable but slow.
      The Enbridge RNG infrastructure partnership provides a $1 billion project-finance facility
      to underpin the buildout; Mitsubishi Corporation provided additional strategic capital in
      April 2026. The pace of facility openings — roughly one or two per year — versus the
      30-facility target implies a 15-20+ year buildout under current trajectory. Capex per
      facility is not publicly disclosed, though the Lexington facility at $90M+ and the
      Longview facility at ~$100M (Enbridge co-finance) provide data points; total buildout
      capex is a material diligence gap.
    claimRefs: [CE024, CE027, CE028, CE037, CE038, CE041]
    tableRefs: [TE005]
    figureRefs: [FE003]

  - id: tech-risks-and-limitations
    title: "Product and Technology Risks"
    body: >-
      Divert's product and technology stack carries several material risk vectors. First,
      microplastics contamination: a 2025 peer-reviewed study in Frontiers in Sustainable Food
      Systems found microplastic concentrations of 120 to 3,300+ MP/kg in food-waste AD digestate
      at a co-digestion facility, with PET fibers (consistent with packaging residues) dominant.
      The study found that depackaging quality control and feedstock composition directly influence
      MP levels, creating potential land-application liability for Divert's fertilizer output. An
      industry panel at ReFED's 2026 Food Waste Solutions Summit confirmed there are no
      standardized benchmarks for depackaging output purity, and NRDC has flagged the gap as
      unresolved. Second, IP risk: Divert claims its depackaging and AD processes are "proprietary"
      and "high-recovery," but no patent filings, technical specifications, or published process
      data have been found. The competitive moat is operational integration — sticky customer
      contracts, multi-year data accumulation, proprietary bin infrastructure, and co-located
      facility assets — not IP. Third, capex and throughput risk: facility builds have
      experienced delays (Longview opened approximately two years after original target) and the
      total capex for 30 facilities is not public. Throughput ramp from facility opening to full
      capacity is also not publicly validated. EPA regulations require AD facilities to comply with
      air, solid waste, and water permitting requirements, adding regulatory complexity to each
      new siting.
    claimRefs: [CE033, CE034, CE035, CE036, CE038, CE044, CE046]
    tableRefs: [TE004]

