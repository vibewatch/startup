callouts:
  - calloutType: strength
    title: "Operational Integration Is the Moat"
    body: >-
      Divert's competitive advantage is not patent-protected; it is the combination of 19 years
      of customer relationships, a proprietary RFID bin data layer accumulated across 7,800+
      locations, co-located depackaging and AD infrastructure, and an exclusive Feeding America
      data partnership. No public competitor replicates this end-to-end integration. The data moat
      deepens with each additional customer-year of waste data, making the platform increasingly
      accurate for waste prediction and donation optimization.
    claimRefs: [CE001, CE005, CE009, CE035]

  - calloutType: risk
    title: "No Disclosed Patents: IP Moat Is Operational Only"
    body: >-
      Divert describes its depackaging and anaerobic digestion processes as "proprietary" and
      "high-recovery," but no patents, patent applications, or published technical specifications
      have been identified. The absence of IP protection means that well-capitalized competitors —
      or industrial-scale equipment OEMs — could replicate the core depackaging and AD mechanics.
      The operational moat (data, contracts, logistics, sites) provides meaningful switching costs
      but is inherently more fragile than patent-protected IP.
    claimRefs: [CE035, CE021, CE030]

  - calloutType: risk
    title: "Microplastics Risk in Digestate Is an Unresolved Regulatory Liability"
    body: >-
      A 2025 Frontiers in Sustainable Food Systems peer-reviewed study found microplastic
      concentrations of 120 to over 3,300 MP/kg in food-waste AD digestate, with PET fibers
      (consistent with packaging residues) dominant. Depackaging quality control directly
      influences contamination levels. Divert has not disclosed monitoring data, detection
      methodology, or regulatory engagement on this issue. An industry panel at ReFED 2026
      confirmed no standardized benchmarks exist for depackaging purity. If regulators introduce
      MP limits for land-applied digestate, Divert's fertilizer output pathway and the
      "carbon-negative" framing of its RNG operations could face material regulatory and
      reputational risk.
    claimRefs: [CE033, CE034, CE036, CE046]

