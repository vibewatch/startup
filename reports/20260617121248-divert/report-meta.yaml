companyProfile:
  summary: >-
    Divert, Inc. is a West Concord, Massachusetts circular economy company founded in 2007 that
    prevents and diverts commercial food waste through an integrated Prevent-Provide-Power®
    platform. Its system spans RFID-based store-level unsold food tracking, reverse logistics,
    proprietary depackaging, and co-located anaerobic digestion that converts food waste into
    renewable natural gas, CO2, and organic soil amendments. The company serves approximately
    7,800 retail and industrial customer locations across all 50 U.S. states, operates two
    Integrated Diversion & Energy Facilities in Turlock, CA (December 2024) and Longview, WA
    (April 2026), and is building toward a 30-facility national network backed by Ara Partners,
    Enbridge, Mitsubishi Corporation, Nuveen Energy Infrastructure Credit, and Wittington
    Investments. The April 2026 Series C led by Mitsubishi elevated Divert's valuation above
    $1 billion; Mitsubishi also received preferred RNG offtake rights as part of the deal.
  foundedDate: "2007-01-01"
  founders:
    - name: Ryan Begin
      role: CEO and co-founder
      background: >-
        Former senior systems engineer and laboratory manager at Raytheon; has led Divert as
        CEO since founding in 2007.
      claimRefs: [CO009, CO010]
    - name: Nick Whitman
      role: Co-founder; board member (former COO)
      background: >-
        Served as COO for 18 years overseeing finance, marketing, legal, people, IT, and
        fundraising before transitioning to a board seat in March 2025.
      claimRefs: [CO011, CO012]
  foundingLocation: West Concord, Massachusetts
  headquarters: West Concord, Massachusetts
  productSummary: >-
    Divert's product stack integrates RFID-tagged bin collection systems in retail back rooms
    for store-level unsold food data capture, reverse logistics for bin pickup and transport,
    proprietary mechanical depackaging to separate food from packaging, and co-located anaerobic
    digestion at Integrated Diversion & Energy Facilities that produce pipeline-ready renewable
    natural gas, liquid CO2, and organic soil amendments. Each IDEF is designed to process up
    to 100,000 tons of organic waste per year.
  customerFocus: >-
    U.S. grocery retailers (Kroger, Ahold Delhaize/Giant Food, Albertsons/Safeway, Fred Meyer),
    food manufacturers (Blue Diamond Growers), and food warehouses and distributors (USCS)
    seeking integrated food waste diversion, regulatory compliance, and sustainability reporting.
  businessModel: >-
    Recurring service fees for integrated food waste diversion (reverse logistics, RFID data,
    depackaging) paid by retailers and industrial customers; long-term RNG offtake revenue
    (bp ~$175M 10-year agreement; Mitsubishi preferred offtake); and nascent digestate and
    organic soil-amendment sales. Facility buildout is financed through project-finance debt
    (Enbridge $1B infrastructure commitment; Nuveen $90M+ per facility).
  stage: Series C
  fundingStatus: >-
    April 2026 Series C led by Mitsubishi Corporation elevated valuation to over $1 billion
    (total Series C equity undisclosed; round remains open per CFO). Prior financing includes
    Ara Partners $100M controlling equity round (2021), Enbridge $80M growth equity plus $1B
    infrastructure commitment (March 2023), Wittington Investments undisclosed round (January
    2026), and Nuveen Energy Infrastructure Credit $90M+ project finance (March 2025).
    Committed project finance of ~$1.09B covers an estimated 12 of 30 planned facilities.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO009, CO011, CO027, CO028, CO032, CO037, CO042]
summary:
  headline: >-
    Divert has assembled a defensible end-to-end food waste circular economy platform with
    genuine operational switching costs, but its $1B+ Series C valuation implies revenue well
    above two-facility run-rate reality and complete financial opacity precludes independent
    underwriting, warranting a track posture pending disclosure.
