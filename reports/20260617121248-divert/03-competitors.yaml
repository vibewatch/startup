  - id: moat-durability-adverse
    title: Moat Durability, Switching Costs, and Adverse Evidence
    body: >-
      Divert's competitive moat rests on four interlocking layers: (1) data-based switching
      costs from the RFID-enabled prevention analytics platform, where a departing customer
      forfeits months of baseline data and shrink-reduction benchmarks; (2) owned physical
      infrastructure (two operational AD facilities, a third under construction, and a fourth
      announced) that creates a captive offtake outlet unavailable to pure-service competitors;
      (3) long-term RNG offtake contracts with BP and Mitsubishi that generate predictable
      infrastructure cash flows not easily replicated; and (4) geographic network density,
      since a retailer with multiple store clusters within 100 miles of a Divert facility
      benefits from lower logistics cost and faster pickup cadences than alternatives relying
      on longer haul routes (CP035, CP036, CP037).

      Switching costs are genuine but uneven across buyer types. Large national grocers such
      as Kroger, Albertsons, and Ahold Delhaize, who use Divert's data platform enterprise-
      wide across hundreds of locations, face high switching costs rooted in data integration
      depth, reporting continuity, and multi-year contract inertia. Smaller regional chains
      or single-facility industrial operators face lower switching costs and can more easily
      substitute Denali's depackaging service or a local composting hauler without losing
      enterprise-wide data coherence (CP039, CP050). Multi-homing is a live risk: Walmart,
      the largest U.S. food retailer, independently chose Denali's depackaging model for
      1,400-plus locations, demonstrating that the largest retail buyer in the market is
      willing to run a parallel depackaging program outside Divert's ecosystem (CP041).

      The most material adverse evidence comes from three sources: Vanguard Renewables'
      BlackRock-backed scale trajectory creates a well-capitalized competitor that could
      match or exceed Divert's facility count within three to four years if it wins retail
      feedstock contracts (CP003, CP047); Denali's Walmart deal shows that a simpler,
      cheaper model—without owned AD or data analytics—can capture major retail accounts
      at scale, directly contesting the value proposition of bundled services (CP041, CP016);
      and BTS Bioenergy's experience demonstrates that even a well-funded, European
      technology-pedigreed operator can fail to scale U.S. AD infrastructure economically,
      highlighting the execution risk embedded in Divert's own 30-facility buildout (CP043,
      CP048, CP049). Composting also represents a slow-moving substitution threat: where
      municipal composting infrastructure is dense, it can serve as the dominant diversion
      pathway without any capital from the service provider—foodservice AD adoption is
      constrained to roughly 1% of waste nationally while composting captures 21.9% of
      retail surplus and 58% of foodservice surplus where available (CP033, CP049, CP050).
