  - id: competitor-profiles
    title: Competitor Profiles
    body: >-
      Vanguard Renewables, founded in 2014 and acquired by BlackRock in 2022, is Divert's
      closest public analog in terms of business model (CP001). The company operates 32 AD
      sites across eight U.S. states with a pipeline of 68 projects and a goal of 100
      facilities by end of 2028, supported by BlackRock's capital base (CP003, CP004).
      Vanguard differentiates from Divert through farm co-digestion—blending food-waste
      feedstock with agricultural manure, broadening feedstock sourcing beyond pure retail
      waste streams—and by a carbon consulting practice that helps food manufacturers
      navigate LCFS and voluntary RNG markets (CP010, CP007). The company signed one of the
      largest voluntary U.S. RNG offtake deals with AstraZeneca, comparable in category
      to Divert's BP deal (CP008, CP046). Vanguard has deployed Anaergia technology four
      times, most recently signing a C$8 million contract for a Minnesota facility in April
      2026 (CP005, CP006). Critically, Vanguard has no prevention-oriented data analytics
      platform; its go-to-market approach grows like a traditional waste company, expanding
      market by market within hauling distance (CP009, CP044).

      Denali is the self-described largest organic recycler in the U.S. by volume, recycling
      over one billion pounds annually through a network of 40-plus depackaging facilities
      that separate up to 97% of trash from organic food waste (CP011, CP012). Its July 2024
      partnership with Walmart encompasses 1,400-plus Walmart and Sam's Club locations across
      16 markets, is projected to produce 500 million pounds of organics annually, and
      achieves roughly 200,000 pounds per location (CP013, CP014). Denali routes recovered
      organics to animal feed, compost, fertilizer, and third-party AD rather than owned
      infrastructure, and produces no RNG of its own (CP015). The Walmart deal illustrates
      a structural adverse: a depackaging-focused operator without owned AD or prevention
      analytics can win a major retail account at scale, splitting the same grocery feedstock
      Divert targets (CP016, CP041).

      Anaergia Inc. (TSX: ANRG, OTCQX: ANRGF) is a Burlington, Ontario technology company
      offering integrated waste-to-value solutions including AD systems, RNG upgrading, and
      wastewater treatment (CP017). In Q1 2026, Anaergia reported revenue of CAD $55.2 million
      (up 122% year-over-year), gross margin of 23.0%, and its third consecutive quarter of
      positive Adjusted EBITDA (CP018, CP019, CP021). Revenue backlog reached CAD $265 million,
      up 32% year-over-year (CP020). The company holds hundreds of patents, positions itself
      as a capital-light technology licensor and O&M contractor, and as of December 2025 held
      total assets of CAD $247.4 million against liabilities of $193.2 million (CP022, CP023,
      CP024). Anaergia is primarily a technology enabler for operators including Vanguard
      rather than a direct retail service competitor, but its scale and patent portfolio make
      it a potential strategic acquirer or disintermediating technology licensor (CP042).

      BTS Bioenergy (formerly Bioenergy DevCo, rebranded May 2025) draws on European parent
      BTS Biogas's 250-plus facility track record since 1996, but has completed only one U.S.
      facility: the Maryland Bioenergy Center, which opened in 2021 with capacity for 125,000
      metric tons annually (CP025, CP026). That facility encountered Howard County wastewater
      pretreatment compliance failures in 2024, forcing a scale-back of throughput (CP027).
      BTS scrapped its proposed Long Beach, California project in early 2025 after failing to
      find viable economics (CP028). A 2021 commitment of over $100 million from Irradiant
      Partners produced limited facility development; a $30 million investment from Hannon
      Armstrong in 2023 was directed mainly at improving the Maryland site (CP029). Under CEO
      Nick Thomas (hired May 2024 from the natural gas sector), BTS is now targeting a Delaware
      chicken-waste AD expansion and a Gainesville, Georgia facility (CP030). BTS's pattern
      represents a cautionary data point on execution risk in U.S. AD buildouts that is broadly
      relevant to assessing Divert's 30-facility roadmap (CP043, CP048).

      Mill Industries, partnered with Amazon's Whole Foods Market, is piloting an in-store AI
      food waste processing system starting in 2027 that converts food scraps into chicken feed
      for private-label egg suppliers (CP031). Mill's AI and computer vision tools track waste
      types and volumes in real time, offering retailers upstream prevention insights; the
      system embeds decentralized infrastructure within stores rather than routing waste off-site.
      While Mill operates in a different value-chain position than Divert—targeting upstream
      in-store processing to animal feed rather than AD-to-RNG—it represents a substitution
      pathway that could reduce the donatable and digestible food volume reaching Divert's
      reverse logistics network for Whole Foods-aligned retailers (CP039).
