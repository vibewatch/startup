company:
  name: Divert

chapter:
  number: 3
  title: Competitors
  summary: >-
    Divert's competitive landscape spans four categories: direct integrated-service peers
    (Vanguard Renewables, backed by BlackRock with a 100-facility buildout target), dominant
    depackaging incumbents (Denali, covering 1,400-plus Walmart and Sam's Club locations),
    AD technology providers turned operators (Anaergia, BTS Bioenergy), and emerging in-store
    alternatives (Mill Industries). No identified competitor replicates Divert's full
    Prevent-Provide-Power stack; however, well-capitalized specialists demonstrate that large
    retail accounts can be captured through narrower single-service models, constituting
    the primary displacement risk. Pricing for all competitors remains undisclosed;
    competitive moat durability rests on Divert's data-driven switching costs, proprietary
    depackaging, and long-term RNG offtake contracts—all of which face credible scaling
    threats from better-capitalized incumbents.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >-
      Divert competes across five buyer-job categories rather than a single market segment.
      The buyer job—divert and monetize commercial food waste while reducing shrink—can be
      partially addressed by direct integrated peers, pure-depackaging incumbents, standalone
      AD technology operators, in-store circular alternatives, and the status quo of landfill
      haulers and municipal composting. Each category requires separate analysis because a
      buyer switching to any one of them solves a different slice of the same job (CP032, CP033).

      Direct peers pursue end-to-end organics-to-RNG infrastructure: Vanguard Renewables
      (BlackRock-backed, 32 operational sites, 100-facility goal by 2028) is the most
      comparable scaled operator (CP002, CP003). Depackaging incumbents—led by Denali—
      capture the same retail feedstock without owning AD infrastructure or data analytics,
      routing organics to third-party composters, animal feed producers, and digesters
      (CP015). AD technology providers such as Anaergia supply proprietary equipment and
      O&M services to both Divert-like operators and municipalities; Anaergia has deployed
      its technology at four Vanguard facilities and is transitioning to a capital-light model
      (CP023, CP042). Status-quo alternatives—landfill haulers and municipal composting—still
      account for 21.1% and 21.9% of retail surplus destinations respectively as of 2024
      (CP033). Likely entrants include large waste haulers (Waste Management, Republic
      Services) that hold existing collection contracts but lack depackaging and data
      capability today (CP038), and a potential build-out by vertically integrated retailers
      such as Amazon/Whole Foods through Mill Industries (CP031). No regulatory enforcement
      actions against Divert competitors have been identified; however, the 121 stand-alone
      food-waste digesters nationally versus Divert's 30-facility target illustrates the
      limited installed base that constrains feedstock routing for all participants (CP034).
