  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitor-pricing
      missingEvidence: >-
        No public pricing data exists for Divert, Vanguard Renewables, Denali, or BTS
        Bioenergy. Tipping fee benchmarks from the EPA are the only available proxy.
      whyItMatters: >-
        Without pricing comparisons, a buyer cannot evaluate whether Divert's bundled
        service commands a sustainable premium over simpler alternatives, or whether
        Denali or Vanguard can undercut on tipping fees to win feedstock volume.
      diligencePath: >-
        Request pricing schedules and contract templates during formal due diligence; run
        side-by-side quote from Denali and Divert for a representative mid-sized grocery
        chain; review customer-disclosed unit economics in earnings calls or sustainability
        reports if any Divert customer is publicly traded.
      relatedQuestionRefs:
        - QP008
        - QP024

    - type: private-evidence-only
      severity: material
      topic: competitor-vanguard
      missingEvidence: >-
        Vanguard Renewables is privately held and BlackRock-owned; no financial metrics
        including revenue, EBITDA, facility-level economics, or funding round details have
        been publicly disclosed.
      whyItMatters: >-
        Without Vanguard's financial profile, it is impossible to assess whether its
        BlackRock-backed model generates sustainable facility economics or whether it is
        cross-subsidizing below-market tipping fees to win feedstock volume ahead of Divert.
      diligencePath: >-
        Request Vanguard financial disclosures in a competitive intelligence context;
        triangulate from Anaergia contract values (public) and industry tipping-fee surveys;
        interview shared vendor or customer references.
      relatedQuestionRefs:
