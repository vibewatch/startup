callouts:
  - calloutType: risk
    title: "Key-Person Concentration: Ryan Begin as Sole Founder-Operator"
    body: >-
      Ryan Begin is the only co-founder with continuous operational involvement at Divert.
      Nick Whitman's March 2025 transition from COO to board removed the second founding
      voice from day-to-day operations after 18 years. While the C-suite has been bolstered
      with professional executives (Watkins as COO, Lukow as CFO, multiple VPs), Begin
      remains the primary architect of capital strategy, investor narrative, and operational
      vision during a critical 30-facility expansion phase. Any adverse event—health, departure,
      or governance dispute—involving Begin could materially disrupt both capital-raising
      momentum and operational execution at a stage requiring simultaneous facility
      development, customer growth, and regulatory engagement.
    claimRefs:
      - CO009
      - CO011
      - CO012
      - CO017
      - CO019

  - calloutType: strength
    title: "Unicorn Status Anchored by Diversified Strategic Energy-Sector Investors"
    body: >-
      Divert's April 2026 unicorn valuation is credible and multi-party validated: the
      >$1B threshold was reached with Mitsubishi Corporation as Series C lead, alongside
      Enbridge (~10% equity stake), Ontario Power Generation, Wittington Investments,
      and Nuveen Energy Infrastructure Credit, with Ara Partners maintaining controlling
      PE sponsorship. The combination of PE governance, energy infrastructure expertise,
      and committed RNG offtake from BP (~$175M) and Mitsubishi (preferred rights) creates
      a revenue-backed valuation foundation unusual among circular economy companies of
      comparable vintage, substantially de-risking the revenue model at scale.
    claimRefs:
      - CO020
      - CO027
      - CO028
      - CO029
      - CO030
      - CO031

  - calloutType: insight
    title: "Infrastructure Finance Model Enables Scale But Introduces Structural Complexity"
    body: >-
      Divert's capital structure—controlling PE (Ara), strategic equity (Enbridge ~10%,
      Mitsubishi Series C), project finance (Nuveen $90M+ per facility), and long-term
      RNG offtake revenue (BP $175M, Mitsubishi preferred)—is capital-efficient relative
      to pure equity dilution and aligns investor incentives with facility performance.
      However, this multi-party structure introduces complexity: each capital layer carries
      distinct return expectations, priority claims on RNG output, and differing investment
      horizons. Investors should separately evaluate inter-creditor agreements, RNG offtake
      pricing floors and caps, and whether Enbridge's $1B infrastructure commitment is
      structured as non-recourse project debt or a take-or-pay arrangement before forming
      a view on equity residual value.
    claimRefs:
      - CO023
      - CO024
      - CO025
      - CO029
      - CO030
      - CO031

