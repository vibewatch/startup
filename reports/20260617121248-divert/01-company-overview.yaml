  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-performance
      missingEvidence: >-
        Divert's revenue, ARR, gross margin, EBITDA, and facility-level unit economics are
        not publicly disclosed and have not been reported by any independent source.
      whyItMatters: >-
        Without financial performance data, it is impossible to assess profitability, unit
        economics at the facility level, cash burn relative to the construction pipeline,
        or the sustainability of the current capital structure under stress scenarios.
      diligencePath: >-
        Request audited financial statements and facility-level P&Ls under NDA directly
        from Divert management; benchmark against comparable food waste RNG operators.
      relatedQuestionRefs:
        - QO015
      relatedTableRefs:
        - TO001

    - type: missing-source
      severity: material
      topic: patents-IP
      missingEvidence: >-
        No publicly available patent filings, trademark registrations, or independent
        technical assessments of Divert's proprietary depackaging or RFID tracking
        technologies have been identified.
      whyItMatters: >-
        The durability of Divert's competitive moat depends partly on whether its
        depackaging, RFID, and anaerobic digestion process innovations are legally
        protected or are replicable by better-capitalized competitors.
      diligencePath: >-
        Search USPTO and international patent databases for filings by Divert, Inc.
        or Ara Divert HoldCo; request IP schedule from management under NDA.
      relatedQuestionRefs:
        - QO016

    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: >-
        Divert's absolute employee headcount has not been publicly disclosed; only
        year-over-year percentage growth (23% in 2024) is available from company communications.
      whyItMatters: >-
        Absolute headcount is needed to assess operational leverage, cost structure,
        and whether the company has adequate workforce depth to execute simultaneous
        construction of multiple ID&E facilities.
      diligencePath: >-
        Request headcount breakdown by function (operations, engineering, commercial,
        corporate) directly from management; cross-reference with LinkedIn employee data.
      relatedQuestionRefs:
        - QO011
      relatedTableRefs:
        - TO002

    - type: private-evidence-only
      severity: material
      topic: funding-amounts
