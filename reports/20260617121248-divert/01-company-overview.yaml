company:
  name: Divert

chapter:
  number: 1
  title: Company Overview
  summary: >-
    Divert, Inc. is a West Concord, Massachusetts circular economy company founded in 2007 that
    prevents food from being wasted by operating an end-to-end Prevent-Provide-Power® platform
    serving ~7,800 retailer and industrial customer locations across all 50 U.S. states.
    The April 2026 Series C led by Mitsubishi Corporation elevated Divert's valuation above
    $1 billion, cementing unicorn status; simultaneously the Longview, WA facility became the
    company's second operational anaerobic digestion site on a 30-facility national expansion
    roadmap backed by Ara Partners, Enbridge, Mitsubishi, Nuveen Energy Infrastructure Credit,
    and Wittington Investments—though co-founder Nick Whitman's 2025 COO departure and
    undisclosed Series C financials remain material diligence gaps.

sections:
  - id: identity-mission-product
    title: Identity, Mission, and End-to-End Business Model
    body: >-
      Divert, Inc. is a circular economy company founded in 2007 in Massachusetts (CO001),
      headquartered in West Concord, Massachusetts (CO002), approximately 20 miles west of
      Boston. Its stated mission is to prevent food from being wasted through nationwide
      infrastructure and innovative technologies (CO003). After 19 years of industry experience
      (CO006), Divert has built a differentiated end-to-end platform at the intersection of
      food, logistics, agriculture, energy, and carbon markets (CO008).

      The business model is structured around the Prevent, Provide, Power® framework (CO004).
      Under Prevent, Divert deploys RFID-enabled reverse logistics and proprietary data analytics
      tools that capture store-level unsold food data monthly, enabling retailers to reduce shrink,
      optimize purchasing decisions, and identify donation opportunities (CO050). Under Provide,
      edible unsold food is routed to food banks and hunger-relief partners including the Feeding
      America network rather than being discarded. Under Power, non-donatable food is transported
      to Divert's Integrated Diversion & Energy Facilities, where proprietary depackaging
      technology and anaerobic digestion convert it into renewable natural gas and nutrient-rich
      fertilizer (CO007). This three-pronged model serves grocery retailers, food warehouses,
      distributors, and food manufacturers across all 50 U.S. states (CO005). Revenue flows from
      service contracts with food retailers and manufacturers for waste logistics, data services,
      certified destruction, and diversion; pricing and contract structures are not publicly
      disclosed. The integrated combination of data software, reverse logistics infrastructure,
      and owned physical processing assets creates meaningful switching costs that differentiate
      Divert from single-service waste haulers or pure-software food waste platforms.
    claimRefs:
