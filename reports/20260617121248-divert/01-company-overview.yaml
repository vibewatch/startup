  - id: operational-scale-milestones
    title: Operational Scale, Milestones, and Adverse Signals
    body: >-
      Divert's operational scale has grown rapidly. As of mid-2026, the company supports
      approximately 7,800 customer locations across all 50 U.S. states (CO032), up 22% in
      2024 (CO034), and has processed more than 3.8 billion pounds of unsold food in total
      since founding (CO037). In 2024 alone, Divert processed over 630 million pounds—a 52%
      year-over-year increase (CO033)—while growing headcount by 23% (CO035) and facilitating
      donations equivalent to more than 15 million meals since 2018 (CO036). The customer base
      includes five Fortune 100 companies and major grocers such as Kroger, Albertsons,
      Ahold Delhaize, Giant Food, Safeway, and Target (CO044). In 2024, Divert expanded into
      new industrial verticals and formed a circular partnership with Blue Diamond Growers
      (CO045).

      Infrastructure milestones anchor the growth narrative. The first Integrated Diversion &
      Energy Facility opened in Turlock, California in December 2024 (CO038); the second opened
      in Longview, Washington on April 29, 2026 (CO039), capable of injecting up to 235,000
      MMBtu of RNG annually into the Cascade Natural Gas distribution pipeline (CO043). Each
      facility is designed for 100,000 tons of annual processing capacity (CO041). A third
      facility in Lexington, North Carolina broke ground in April 2025 and is expected to
      commence operations later in 2026 (CO040). A fourth has been announced in Harrison,
      Ohio (CO048). Divert's long-term goal is 30 facilities covering 80% of the U.S. within
      100 miles (CO042). In August 2024, Divert released a first-of-its-kind Food Waste
      Legislative Tracker in partnership with the Zero Food Waste Coalition and Harvard Law
      School Food Law and Policy Clinic (CO046).

      Adverse signals warrant close attention. Climate critics argue that injecting biogas into
      existing gas pipelines perpetuates fossil fuel infrastructure and that biogas could supply
      only roughly 1% of U.S. natural gas demand, raising questions about the long-term climate
      logic of the RNG pathway versus electrification (CO047). Internally, the March 2025
      transition of co-founder Nick Whitman from COO to advisory board, combined with multiple
      executive hires across 2024–2025, constitutes a material leadership transition (CO017).
      No material regulatory enforcement actions or litigation against Divert have been identified
      in public sources as of June 2026 (CO049).
