  - id: leadership-founders-governance
    title: Leadership, Founders, and Governance
    body: >-
      Divert was co-founded in 2007 by Ryan Begin and Nick Whitman. Begin continues to serve
      as CEO and has been the primary architect of the company's strategy, infrastructure vision,
      and capital narrative since inception (CO009). Prior to founding Divert, Begin was a senior
      systems engineer and laboratory manager at Raytheon and a lead engineer at Proton Energy
      Systems where he delivered the first zero-carbon hydrogen system for a fuel-cell bus (CO010),
      providing deep decarbonization credibility. Whitman served as COO for nearly 18 years,
      holding responsibilities spanning finance, marketing, legal, IT, and fundraising in
      addition to operations (CO019), before transitioning to a board seat and strategic advisory
      role in March 2025 (CO011, CO012).

      The current C-suite includes Bob Watkins as COO (CO013) and Brad Lukow as CFO, who joined
      approximately one year before April 2026 during a period of multiple senior leadership
      changes (CO014). In December 2024, Divert appointed four VP-level executives: Andrew
      Johnston (Industrials), Derek Spillane (IT), Frenchie Audette (Food Service), and Lee
      DeVasier (Transportation & Supply Chain) (CO018). This rapid leadership refresh, combined
      with Whitman's departure from operations, constitutes a material leadership transition
      (CO017) at a critical phase of the 30-facility buildout; Ryan Begin remains the sole
      founder with continuous operational involvement, creating key-person concentration risk.

      The board of directors of Ara Divert HoldCo (Divert's parent entity) includes Nick Whitman
      (co-founder), Ari David (Ara Partners), Ali Naqvi (Ontario Power Generation), Jim Orlando
      (Wittington Investments), Caitlin Tessin (Enbridge), and Timothy Laurion (independent)
      (CO016). Laurion, appointed in November 2024, brings over 41 years of environmental-services
      investment banking from Bank of America (CO015), positioning the board well for capital
      markets activity ahead of a potential exit or IPO.
