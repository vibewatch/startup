summary:
  headline: Divert 已拼出有防守性的端到端食品废弃物循环经济平台，运营切换成本真实存在；但 $1B+ Series C 估值暗含的收入显著高于两座设施的运行率现实， 财务完全不透明也无法独立承销，因此应在披露前保持观察。
