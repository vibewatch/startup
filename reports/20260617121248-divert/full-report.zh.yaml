      - number: '5.3'
        title: 拆包装、厌氧消化与循环产出
        blocks:
          - type: paragraph
            body: >-
              在加工设施内，Divert
              的高回收拆包装技术用机械方式把食物与包装分离，产出干净液态浆料。包装被混合处理并变得无法识别——这项能力面向食品制造商销售，作为保护品牌完整性的认证销毁。公司向工业客户提供销毁证书、照片、视频和可持续影响报告。液态浆料进入同址厌氧消化（AD）罐，微生物活动把有机物转化为沼气。沼气升级为可再生天然气（RNG），消化残渣则加工成富含营养的肥料。在旗舰
              Longview, WA 设施（2026 年 4 月启用），满负荷年产 235,000+ MMBtu RNG 和 450,000 lbs 肥料，处理 100,000 tons 食物垃圾——足以为 3,200+
              户家庭供能，并抵消 23,000 metric tons CO2e。Divert 将其 RNG 描述为「碳负」，但未公开披露生命周期分析。Blue Diamond Growers 合作（2024 年 9
              月）把这一模型扩展到 Turlock, CA 设施的杏仁加工副产物，证明工业场景的适用性。BioCycle 行业报道证实，在处置费经济性、劳动力节省和食物垃圾转移法规推动下，拆包装部署正在全美加速。
