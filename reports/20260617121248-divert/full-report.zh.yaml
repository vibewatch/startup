  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价
        blocks:
          - type: paragraph
            body: >-
              Divert 采用多收入流模型，核心是 Prevent、Provide、Power® 平台（CI001）。最主要的商业杠杆来自服务费：食品零售商、制造商、仓库和分销商为逆向物流、支持 RFID
              的数据分析、认证销毁、拆包装和捐赠优化付费（CI002）。公司覆盖美国 50 个州 7,800+ 个客户地点（CI011），具名客户包括 Kroger、Albertsons、Ahold
              Delhaize、Safeway、Target 和 CVS（CI016），因此服务费构成收入模型的量基。具体合同定价未公开（CI006），但该模型替代了传统填埋处置费 $50–$150/ton（CI023），给了
              Divert 结构性定价权：即使低于处置费平价，客户仍能节省 30–45% 的处置成本（CI024）。

              第二条收入流是通过长期承购协议销售可再生天然气。Divert 披露了与 bp 的约 $175M、10 年协议，覆盖三座特定设施（CI003），意味着每座设施每年约 $5–6M 的 RNG 收入。2026 年 4
              月 Series C 中 Mitsubishi 获得的优先 RNG 承购权，把这条线延伸到 Japan 和全球能源网络（CI004）。Longview, WA 满负荷每年最多生产 235,000 MMBtu
              RNG（CI020），并直接接入 Cascade Natural Gas 管道（CI026）。肥料和土壤改良剂销售是设施发布中提到的第三条收入流，但未量化（CI020）。收入确认风险不低：服务费可能按期确认，而
              RNG 收入取决于设施运营爬坡（CI009）。服务费与能源收入的占比未披露；截至 2026 年中只有两座自有 AD 设施在运营（CI025、CI010），服务费很可能占主导。
