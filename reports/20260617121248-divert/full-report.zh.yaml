  - id: FU001
    type: journey-map
    title: 客户旅程地图
    layout: wide
    summary: 从监管或损耗触发，到多品牌扩张，客户采用过程分为六个阶段；同时标出买方、用户、付款方的交接，以及每一阶段切换摩擦累积的位置。
    data:
      nodes:
        - id: j1
          label: 阶段 1：监管或损耗成本触发
          detail: >-
            买方（可持续性或运营团队）识别有机废弃物合规义务（SB 1383、MassDEP 禁令、WA Organics Management Law），或量化食物损耗对 P&L 的实质成本（Divert CEO 称每店每天约
            $40K 利润损失）。监管要求带来非自由裁量的进入触发；降低损耗带来财务 ROI 触发。
          tone: neutral
        - id: j2
          label: 阶段 2：供应商评估
          detail: >-
            运营或可持续性团队将 Divert 与堆肥运输商、零废弃顾问或店内减损软件比较。Divert 用单一供应商交付端到端逆向物流、RFID 数据、认证销毁、RNG 分流和 Feeding America
            捐赠优化，形成差异化。
          tone: neutral
        - id: j3
          label: 阶段 3：MSA / 服务合同
          detail: 企业可持续性或采购团队签署多年期托管服务协议。定价替代既有填埋处置费（$50–$150/吨区间）；合同结构、期限和 take-or-pay 条款未公开披露。付款方是企业品牌，而非单个门店。
          tone: positive
        - id: j4
          label: 阶段 4：周转箱集成与员工培训
          detail: 带 RFID 标签的可折叠周转箱放进门店后场；门店员工接受分拣流程培训；逆向物流节奏建立——每日从门店回运到零售商配送中心，再转运至最近的 Divert 设施。工业客户直接安排拖车或罐车提货。
          tone: positive
        - id: j5
          label: 阶段 5：月度分析与分流服务
          detail: >-
            月度 RFID 数据报告交付给区域经理；借助 Feeding America MealConnect 集成识别捐赠机会；不可捐赠食物在 Divert 设施加工成 RNG
            和肥料；向工业客户签发销毁证明。数据基准不断累积，切换成本随之加深。
          tone: positive
        - id: j6
          label: 阶段 6：跨品牌或多设施扩张
          detail: >-
            成功品牌扩展至全门店网络（Giant Food 从部分门店推广到全部 163 家；Kroger 从 Compton CA 扩展到多个区域）。工业客户可能纳入更多设施。企业母公司（Ahold Delhaize
            USA、Kroger）从一个品牌获得的洞察，会转化为跨品牌 RFP 机会。新的 Divert 设施为既有账户打开相邻地域。
          tone: positive
    claimRefs:
      - CU023
      - CU024
      - CU034
      - CU039
      - CU040
      - CU041
    approximationNotes: null
  - id: FU002
    type: funnel
    title: 采用 / 部署漏斗
    layout: standard
    summary: 采用漏斗从美国可服务的食品杂货零售和工业食物废弃物产生方总量，下钻到已命名、且结果可量化的部署，用来展示渗透深度。
    data:
      items:
        - label: 美国食品杂货零售总门店数（潜在市场）
          value: 38000
          description: 约 38,000 个美国食品杂货零售地点构成主要可服务零售客群。工业端（仓库、制造商、分销商）进一步增加 TAM。美国每年产生 63M+ 吨食物废弃物（USDA）。
        - label: 关键州受监管强制要求的产生方（CA/MA/WA 估算）
          value: 10000
          description: 估算 California、Massachusetts 和 Washington 面临强制有机物分流要求的商业食物废弃物产生方。Pact 签署方报告 2024 年未售出食物 3.98M 吨，代表可衡量的企业客群。
