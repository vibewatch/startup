      - number: '4.2'
        title: GTM 动作与销售效率
        blocks:
          - type: paragraph
            body: >-
              Divert 的市场进入模型是直销企业客户，目标包括全国性和区域性杂货连锁、食品制造商、仓库和物流运营商（CI007）。公司服务五家 Fortune 100 企业（CI008）；具名锚定客户包括
              Kroger、Albertsons、Ahold Delhaize 体系（Stop & Shop、Giant、Hannaford）、Safeway、Target、CVS 和 Harris
              Teeter（CI016）。典型销售效率指标——CAC、回本周期、配额达成率和 NRR——均未披露。

              现有最强的销售生产率信号，是 2024 年客户地点增长 22%（CI012），处理量增长 52% 至 630M lbs（CI013）。2024 年 12 月新增四名 VP 级商业高管，覆盖工业、餐饮服务、IT
              和供应链（CI015），说明公司在设施放量前主动投放能力。Giant Food 的 165 家门店全量铺开并在五年内减少 9% 浪费（CI018），以及 USCS 借助 Turlock 设施持续推进
              California 合作以满足 SB 1383（CI054），都证明了重复服务和多年合同结构。Feeding America
              被整合进捐赠优化组合，也进一步提升了零售商账户粘性（CI053）。头部杂货连锁客户集中度未披露，但具名客户横跨 Kroger 和 Ahold Delhaize
              体系的多个区域品牌（CI048），说明零售内部有一定地理分散。
