              - CE030
          - type: callout
            title: 消化残渣中的微塑料风险是未解决的监管责任
            body: >-
              2025 年 Frontiers in Sustainable Food Systems 同行评审研究发现，食物垃圾 AD 消化残渣中的微塑料浓度为 120 到超过 3,300 MP/kg，PET
              纤维（与包装残留一致）占主导。拆包装质量控制直接影响污染水平。Divert 未披露该问题的监测数据、检测方法或监管沟通。ReFED 2026
              行业小组确认，拆包装纯度不存在标准化基准。如果监管机构针对土地施用消化残渣引入 MP 限值，Divert 的肥料产出路径及其 RNG 运营的「碳负」叙事，都可能面临重大监管和声誉风险。
            calloutType: risk
            claimRefs:
              - CE033
              - CE034
              - CE036
              - CE046
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分、买方 / 用户 / 付款方角色与地理
        blocks:
          - type: paragraph
            body: >-
              Divert 产生收入的客户基础分为两个主要细分：杂货零售和工业。在零售细分，买方通常是全国性或区域性杂货连锁的可持续或运营团队，由其签署并资助托管服务合同。终端用户是门店层面的员工，他们把未售出食物装入带
              RFID 标签的可折叠箱；门店或区域经理则接收每月的减废分析。付款方是公司品牌，而不是单个门店。通过新闻稿或 CEO 访谈确认的具名零售锚定客户包括 Giant Food（Ahold
              Delhaize，MD、VA、DC、DE 共 163 家门店）、Kroger 体系（Ralphs、Food 4 Less、Fred Meyer）、Albertsons（Portland
              Division）、Safeway（Northern California）和 Reser's Fine Foods（Longview WA）。Ahold Delhaize USA 的 Sustainable
              Operations 负责人称 Divert 是 Ahold Delhaize USA 各公司「回收不可销售、不可捐赠食物」努力中的重要伙伴，证实了超出 Giant 单一品牌的公司级客户关系。

              工业细分在 2024 年规模化切入；买方和付款方是食品仓库、冷链仓储运营商或食品制造商的运营或可持续团队。价值主张包括品牌敏感产品的认证销毁、SB 1383 合规文件，以及安全的 RNG 转化。截至 2026
              年中，United States Cold Storage（USCS；North America 第三大冷藏仓储商）和 Blue Diamond
              Growers（全球领先杏仁加工商）是两个公开具名工业客户。食物银行（Feeding America 网络、Central California Food Bank）和饥饿救济组织是 Provide
              路径的交付伙伴，而不是付费客户。地理上，公司足迹覆盖美国 50 个州，运营密度集中在 California（Turlock）、Pacific Northwest（Longview WA）和
              Mid-Atlantic/DC 走廊。强制有机物转移法律适用地区的监管拉力最强：California SB 1383、Massachusetts 商业食物禁令（0.5 ton/week 门槛）和
              Washington Organics Management Law。
