      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 关键人物集中：Ryan Begin 是唯一创始人运营者
            body: >-
              Ryan Begin 是 Divert 唯一仍持续参与运营的联合创始人。Nick Whitman 2025 年 3 月从 COO 转任董事会，意味着第二位创始人在 18 年后离开日常运营。尽管 C-suite
              已引入职业高管补强（Watkins 任 COO、Lukow 任 CFO、多名 VP），但在 30 座设施扩张的关键阶段，Begin 仍是资本战略、投资人叙事和运营愿景的主要设计者。任何涉及 Begin
              的负面事件——健康、离职或治理争议——都可能在公司需要同时推进设施开发、客户增长和监管沟通的阶段，实质扰乱融资动能和运营执行。
