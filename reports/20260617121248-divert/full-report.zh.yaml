          description: 根因分析、基准比较、协同培训建议；集成 Feeding America MealConnect
        - label: 逆向物流与周转箱收集
          layer: Logistics
          description: 可折叠周转箱从门店收回；在零售商 DC 汇集；运往 Divert 设施
        - label: 可食用食物捐赠路由
          layer: Logistics
          description: 调度前用 Divert + Feeding America 组合数据层促成捐赠
        - label: 工业与制造商接收
          layer: Logistics
          description: 24/7 装卸月台；LTL/FTL/drop-and-hook；面向品牌保护销毁的认证监管链
        - label: 拆包单元
          layer: Processing
          description: 机械分离食物和包装；产出干净液态浆料；包装被销毁并混合
        - label: 认证销毁文档
          layer: Processing
          description: 面向工业客户提供销毁证明、照片、视频和可持续性报告
        - label: 厌氧消化（AD）
          layer: Conversion
          description: 微生物将浆料转化为沼气；每座 Integrated Facility 内与拆包环节共址
        - label: RNG 提纯与管网注入
          layer: Outputs
          description: 沼气提纯为管道级 RNG；卖给区域公用事业或通过 Enbridge 包销
        - label: 富养分肥料
          layer: Outputs
          description: 消化残渣加工成土壤改良剂；Longview 产能 450,000 磅 / 年；本地土地施用
        - label: 客户数据反馈闭环
          layer: Data & Intelligence
          description: 设施层面的处理数据回流上游，辅助零售商采购和捐赠决策
        - label: 可持续性与影响报告
          layer: Outputs
          description: 向客户和利益方报告 CO2e 抵消、捐赠餐食数和分流磅数
    approximationNotes: 分层是基于公开描述做出的功能归类；内部系统架构未披露。
