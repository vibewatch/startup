      - number: '3.4'
        title: 护城河耐久性、转换成本与负面证据
        blocks:
          - type: paragraph
            body: >-
              Divert 的竞争护城河由四层相互咬合的能力支撑：（1）RFID 预防分析平台带来的数据型转换成本，客户离开后会失去数月基线数据和损耗下降基准；（2）自有实体基础设施（两座运营中 AD
              设施、第三座在建、第四座已宣布），创造纯服务竞争者拿不到的自有承接出口；（3）与 BP 和 Mitsubishi 的长期 RNG 承购合同，产生不易复制的可预测基础设施现金流；（4）地理网络密度，多个门店集群位于
              Divert 设施 100 英里内的零售商，相比依赖更长运输线路的替代方案，可获得更低物流成本和更快取货频次（CP035、CP036、CP037）。

              转换成本真实存在，但在不同买方类型之间并不均衡。Kroger、Albertsons 和 Ahold Delhaize 等全国大型食品杂货商，在数百个网点企业级使用 Divert
              数据平台，转换成本高，根源在数据集成深度、报告连续性和多年合同惯性。较小区域连锁或单设施工业运营商转换成本更低，可以更容易用 Denali
              拆包服务或本地堆肥运输商替代，而不会失去企业级数据一致性（CP039、CP050）。多栖是现实风险：美国最大食品零售商 Walmart 独立选择 Denali 的拆包模式，覆盖 1,400
              多个网点，说明市场最大零售买方愿意在 Divert 生态外运行一套平行拆包项目（CP041）。

              最重要的负面证据来自三处：Vanguard Renewables 有 BlackRock 支持的扩张轨迹，如果赢得零售原料合同，三到四年内设施数量可能追平或超过
              Divert，形成资本充足的竞争者（CP003、CP047）；Denali 的 Walmart 交易表明，更简单、更便宜、没有自有 AD
              或数据分析的模式也能规模化拿下大型零售账户，直接挑战捆绑服务的价值主张（CP041、CP016）；BTS Bioenergy 的经历说明，即便是资金充足、拥有欧洲技术血统的运营商，也可能无法在美国经济性地扩张
              AD 基础设施，凸显 Divert 30
              座设施建设中嵌入的执行风险（CP043、CP048、CP049）。堆肥也是缓慢推进的替代威胁：在市政堆肥基础设施密集的地方，它可以在服务提供商不投入任何资本的情况下成为主导分流路径——全国餐饮服务 AD
              采用率被限制在约 1%，而堆肥在可用地区吸收 21.9% 零售剩余和 58% 餐饮服务剩余（CP033、CP049、CP050）。
