      - number: '7.5'
        title: 客户集中度与收入不透明风险
        blocks:
          - type: paragraph
            body: >-
              Divert 的服务费收入结构由少数大型杂货连锁锚定，这些客户分别代表多年、多门店关系，但公司未公开合同价值、续约日期或排他性条款。公司确认与五家 Fortune 100 企业合作，具名锚定客户包括
              Kroger、Ahold Delhaize（Giant、Stop & Shop、Hannaford）、Albertsons、Safeway、Harris Teeter（Kroger 旗下）和
              CVS，但未披露按客户、细分或地理划分的收入。

              Giant Food 的 163 家门店、$0 披露价值合作自 2022 年以来处理近 8,000 万磅，是记录最充分的单一账户；该账户涉及整个 Ahold Delhaize USA
              品牌生态，并由公司级证言确认。Harris Teeter 单独在一年内通过 Divert 转移超过 4,000 万磅，确认第二个大处理量关系。2024 年客户地点增长 22%、处理量增长
              52%，意味着新增工业账户（USCS、Blue Diamond）贡献了不成比例的单客户处理量，形成早期工业集中风险，且没有任何已披露长期工业合同结构抵消这一风险。

              收入不透明风险有两种表现。第一，任何锚定账户不续约，都会同时冲击最近 AD 设施的原料供应和服务费收入，形成双重影响。第二，随着设施 RNG 收入扩大、每座设施经济性依赖满负荷每年 100,000 tons
              吞吐，主要零售商原料供应中断会直接削弱支撑整个项目融资结构的设施层回报。没有公开 NRR、GRR 或流失数据。结构性的 RFID 箱和数据平台切换摩擦提供一些留存顺风，但不是合同保证。
