      - number: '2.5'
        title: 采用约束与负面动态
        blocks:
          - type: paragraph
            body: >-
              尽管监管顺风很强，几项结构性约束限制了商业食品废弃物分流市场为 Divert 带来增长的速度。第一，AD 许可是多层级的：设施必须满足联邦、州和地方监管要求，覆盖空气质量、固废和水许可；EPA 的 AgSTAR
              框架记录了这种复杂度，项目周期可能被拉长多年（CM038）。这形成一道持久但危险的壁垒——持久在于限制新竞争者，危险在于拖慢 Divert 自己的 30 座设施建设。

              第二，资本强度极高：Enbridge 对 Divert 基础设施的 $1B 承诺，加上 Mitsubishi 和 Nuveen 参与 Series
              C，显示单座设施成本处于数千万到数亿美元区间（CM039）。在这种资本成本下，任何宏观融资冲击或项目融资利率上升，都会直接压迫建设时间表。第三，截至 2026 年 3 月，美国仅有 121
              座独立食品废弃物消化设施在运营，而 American Biogas Council 估计潜在新系统有 1,370 个；2024 年 EPA 调查中，55% 现有 AD
              设施报告仍有可用产能——这意味着基础设施供给侧受限，难以承接 Divert 计划处理的规模（CM011、CM012、CM041）。

              第四，在没有强制令的地区，填埋处置仍具经济竞争力：2024 年零售剩余食品仍有 21% 流向填埋场，在没有分流要求的州，由运输商经纪的填埋倾倒费常低于 AD 成本（CM040）。第五，BioCycle 和
              ReFED 都指出，一体化拆包和捆绑 AD 服务——Divert 的核心模式——可能削弱零售商投资上游源头分拣和预防的动力，在预防与分流经济性之间制造结构性张力（CM042、CM043）。第六，拆包作业带来的
              PFAS 和微塑料污染风险正在浮现，可能限制消化残渣作为肥料的终端用途，并抬高未来监管合规成本（CM042）。这些约束合在一起意味着，Divert
              的市场扩张与监管强度和基础设施资本可得性相关，而不只是随有机商业需求自然增长。
            claimRefs:
