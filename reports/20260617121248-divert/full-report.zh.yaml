      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 资本强度和许可审批给 30 座设施建设带来执行风险
            body: >-
              Divert 的增长模型根本上依赖其再开发 28 座 Integrated Diversion & Energy Facilities 的能力（2026 年已有 2
              座运营）。每座设施都需要多机构许可（空气、固废、水），时间线可能拉长 2–5 年，也需要只有少数基础设施基金能提供的机构资本规模。Enbridge、Mitsubishi 或 Ara
              任一资本关系受扰，或许可审批出现任何负面监管决定，都会直接压缩 Divert 可捕捉的可服务市场。这一执行风险是 SOM 区间宽的主要原因，也应通过对 NC 和 OH 管线设施尽调来压力测试。
            calloutType: risk
            claimRefs:
              - CM038
              - CM039
              - CM041
          - type: callout
            title: 零售 $26.9B 销售损失是 ROI 钩子；强制令覆盖才是成交推手
            body: >-
              美国零售部门 398 万吨滞销食品代表 $26.9B 销售损失，为 Divert 数据驱动的预防销售话术提供了有力财务框架。Ryan Begin 称普通食品杂货店每天因食品浪费相关利润损失约
              $40,000，这量化了面向零售商的漏斗顶部 ROI 案例。但实践中，从这种财务痛点转化为 Divert 合同，主要由监管强制令（12 个州且仍在增加）推动，而不是自愿 ROI 采用。这意味着 Divert
              近期收入增长与强制令执行节奏及其对强制令州的地理覆盖高度相关。
            calloutType: insight
            claimRefs:
              - CM004
              - CM025
