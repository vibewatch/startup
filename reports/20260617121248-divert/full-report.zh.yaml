      - number: '6.2'
        title: 采用轨迹与规模
        blocks:
          - type: paragraph
            body: >-
              Divert 的客户足迹在 19 年里持续增长，2024 年加速。截至 2026 年中，公司在美国 50 个州支持约 7,800 个客户地点，2024 年同比增长 22%。处理量在 2024 年增长 52%，超过
              630 million pounds，是披露过的最强年度里程碑。累计来看，Divert 已处理 38 亿磅未售出食物，并促成捐赠 1,500 万餐。2024 年促成的食物捐赠为 210 万磅（170
              万餐），延续了自 2018 年以来 1,570 万磅捐赠的 18 年轨迹。客户地点指标混合了门店级零售和场点级工业地点；账户层面的拆分未公开。地点增长 22% 与处理量增长 52%
              之间的差距，说明现有地点利用率加深、新增高处理量工业账户，或二者兼有。Feeding America 合作自 2018 年起覆盖 38 个州 13
              家主要零售商，即使没有逐品牌账户数，也提供了零售渗透的地理广度信号。2024 年正式进入仓库、配送中心和制造业——由 USCS（2025 年 7 月）和 Blue Diamond（2024 年 9
              月）确认——代表其首次向杂货零售以外垂直扩张。
