      - number: '7.6'
        title: 人员、执行风险与下行情景
        blocks:
          - type: paragraph
            body: >-
              2024–2025 年，Divert 领导团队经历重大过渡，同时公司要从一座设施扩张到三十座规划设施。联合创始人兼 COO Nick Whitman 近 18 年来负责运营、财务、法务、人事、IT
              和融资，2025 年 3 月转为董事会顾问角色。截至 2026 年中，他的运营继任者尚未公开任命，广泛的高管责任集中到 CEO Ryan Begin 身上。CFO Brad Lukow 在 Mitsubishi
              Series C 宣布前约一年加入；这轮融资是他担任 Divert CFO 后的首个重大融资。公司 2024 年 12 月任命四名 VP 级高管（工业、IT、餐饮服务、运输 /
              供应链），等于在加速设施建设的同时重建完整 C-suite。

              COO 空缺很关键，因为 COO 职能覆盖分布式站点的设施许可、运营爬坡、供应链物流和合规——这些正是 28 座设施扩张最关键的职能。没有公开任命继任者，给组织深度带来尽调不确定性。Ara Partners
              的机构监督，以及 Begin 与 Whitman 同在董事会，能缓解连续性风险，但不能替代日常运营领导。

              三个下行情景构成 thesis-break 分析。Scenario A（融资停滞）：Series C 规模不足或 Enbridge 提款延迟，导致 10+ 座规划设施无法进入建设，使 Divert
              停在盈利性全国密度所需规模以下。Scenario B（消化残渣监管）：某州对拆包装消化残渣施加土地施用限制，损害第三收入流，并削弱所有运营站点的设施层经济性。Scenario C（RNG 政策崩塌）：D3 RIN
              取消或 45Z 抵免废止，大幅降低 RNG 收入，提高新项目融资门槛，并可能要求调整原料组合以维持 IRR。单一情景尚可管理；若两个或更多情景在 2026–2028 建设窗口叠加，投资论点很可能被打破。
