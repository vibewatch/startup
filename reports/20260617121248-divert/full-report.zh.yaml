  - id: FM001
    title: 市场规模金字塔：TAM / SAM / SOM 层级
    type: pyramid
    layout: standard
    summary: Divert 商业食物废弃物转移和有机物转 RNG 市场的三层规模金字塔，从最广义可服务市场到当前已捕获范围； 鉴于缺乏公开第三方 TAM 数据，数值为估算。
    data:
      items:
        - label: TAM
          description: 美国商业食物废弃物转移服务 + 有机物转 RNG 基础设施；自下而上估算，使用 EPA 倾倒费和可服务的商业填埋废弃物量， 并把 RNG 与数据服务纳入扩展
          value: $500M–$2B+ annually
        - label: SAM
          description: 杂货零售、食品制造商、仓库和分销商，且废弃物量足以支撑一体化托管服务； 30 座设施建成后的地理覆盖可触达美国 80% 人口 100 英里内区域
          value: $200M–$700M annually (est.)
        - label: SOM
