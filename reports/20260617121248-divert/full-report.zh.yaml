      - number: '7.4'
        title: 资本结构、CapEx 缺口与伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Divert 的财务风险主要由资本强度决定。两座运营设施（Turlock CA，2024 年 12 月；Longview WA，2026 年 4 月）支撑其 30 座设施全国建设目标，目标覆盖美国 80% 人口
              100 英里以内。Lexington NC 设施于 2025 年 4 月破土，获得 $90M+ Nuveen 项目融资；截至 2026 年中，Harrison OH
              站点尚未披露项目融资伙伴或许可完成情况。按每座设施 $90M+，30 座计划意味着总 capex $2.7B+。已披露承诺融资合计约 $1.09B+（Enbridge $1B 工具、Nuveen 为
              Lexington 提供 $90M），仍有约 18 座设施处于未融资状态，需要后续项目融资事件。

              伙伴集中在多个维度都很严重。Enbridge 持有 10% 股权，同时提供约 $1B 核心融资工具，是最大债权人也是重要股东；任何重新谈判或 Enbridge 战略转向，都会传导到设施建设管线。BP 的约
              $175M/10 年 RNG 承购只覆盖 30 座规划设施中的三座；Mitsubishi 未来承购优先权（2026 年 4 月宣布）必须在每座设施完工时转化为有约束力合同。Longview 的 Cascade
              Natural Gas 管道互联，为 WA RNG 收入制造了单一管道依赖。

              BC Organics 提供了可比基础设施风险证据：这是一个大型 Wisconsin 消化器项目，截至 2026 年 3 月有 $100.1M USDA 贷款逾期（181–360 天），并确认存在甲烷泄漏。虽然
              Divert 的食物垃圾模型不同于粪肥项目，但消化器行业 USDA 组合 27% 的高贷款逾期率和项目表现不佳，说明大型 AD 建设存在广泛执行风险。Ara Partners 的控股 PE
              股权也带来潜在张力：考虑其 Fund III 年份，预计退出窗口为 2027–2030 年，可能与达到 30 座设施所需的数十年基础设施建设时间表冲突。
