      - number: '2.4'
        title: 增长驱动与监管顺风
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自州级监管要求不断扩大。截至 2025 年，美国 12 个州已有生效的食品浪费分流政策，2025 年通过 24 项法案，仅 2025 年就提出 110 项法案（CM030）。California
              SB 1383 要求到 2025 年，相比 2014 年水平，将送往填埋场的有机废弃物减少 75%，并让 20%
              仍可食用的剩余食品进入食品回收组织——直接扩大了寻找分流基础设施的吨数供给（CM031）。Washington State 的有机物管理法律（2022、2024、2025 年）目标是到 2030 年把 75%
              有机物从填埋场移出，并到 2035 年将收集的有机物量接近翻两番；从 2026 年起，每周产生 ≥96 加仑有机废弃物的商业产生者必须分流物料，为 Divert 的 Longview, WA
              设施创造即时需求（CM032、CM034）。Massachusetts 自 2014 年起禁止商业有机废弃物处置（2022 年扩大至每周 ≥0.5 吨的产生者），并有记录显示带来 1,700+ 个就业岗位和
              $390M 州内经济活动——这证明分流强制令会转化为持久的商业基础设施投资（CM033）。

              食品浪费解决方案的私营部门投资在 2025 年增长 16%，总额达到 $794M（私营 + 联邦），为四年来首次增长，显示资本对该领域重拾信心（CM029、CM049）。AI 驱动的需求规划工具在 2025
              年获得超过 $30M 私募融资，并在延展市场的预防层（CM036）。随着管道运营商寻找管网品质可再生气，RNG 需求正在加速；Divert 的 Longview 设施预计根据 Cascade Natural
              Gas 互联协议，每年产生 235,000 mmBtu RNG（CM035）。U.S. Food Waste Pact 到 2025 年签署方翻倍至 30 家，代表食品杂货零售 54%
              的市场份额，使企业食品浪费测量和目标设定走向常态化（CM037、CM046）。
