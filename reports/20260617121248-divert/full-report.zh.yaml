      - number: '4.3'
        title: 成本结构、毛利驱动因素与单位经济性
        blocks:
          - type: paragraph
            body: >-
              Divert 的成本结构分三大块。第一，物流与收集：7,800+ 个地点持续开展逆向物流，涉及卡车路径、箱体管理、汇集和外运。第二，设施运营：每座 Integrated Diversion & Energy
              Facility 处理拆包装、AD 加工、RNG 调质与管道注入、肥料包装，每年最多处理 100,000 tons（CI019）。第三，平台开销：RFID 基础设施、数据分析、软件、人员（2024 年增长
              23%，CI015）和 G&A。资本开支主要通过项目融资承担，降低了股权 capex 压力，但也引入每座设施的债务服务，压缩净利润率。

              Divert 未公开毛利率、EBITDA 和每吨成本（CI044）。最接近的上市 AD/RNG 公司 Anaergia（TSX: ANRG）披露，2026 年 Q1 在 CAD $55.2M 收入上实现
              23.0% 毛利率（CI037、CI038）——这是结构性参照，但 Anaergia 的轻资产项目销售模式不同于 Divert 的自有设施、经常性服务模式。来自零售商的经常性服务费毛利率可能高于 Anaergia
              的一次性资本销售板块，软件 / 数据层或可接近 30–40%，但收集环节高度依赖物流，会压缩混合毛利。BTS Bioenergy 行业数据证实，客户从填埋转向 AD 可节省 30–45%（CI024），说明
              Divert 的定价权高于可变成本，但实际抽成率未知。

              设施层面的代理单位经济性：Longview 满负荷每年生产 235,000 MMBtu RNG 和 450,000 lbs 肥料（CI020）。按 $10–$20/ MMBtu 的市场 RNG 价值（含 D3
              RIN 价值）计算，单座设施满产后 RNG 收入可达每年 $2.4–$4.7M，大方向上与 bp 协议隐含的约 $5.8M/yr 一致（CI003、CI043）。没有 Divert
              成本数据（CI044），无法确认设施层面回本周期和毛利率。
