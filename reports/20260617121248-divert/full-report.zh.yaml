  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景、融资结构与入场纪律
        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月 14 日，Mitsubishi Corporation（MC）领投 Divert 的 Series C 融资，公告明确称该合作「elevating the company to a
              valuation of over $1 billion」（CV001），Divert 的估值由此进入独角兽区间。这是 Divert 首个公开确认的估值锚点；此前各轮融资没有披露估值。Series C
              包含两类紧密绑定的工具：Mitsubishi 的直接股权投资，以及 Divert 未来设施（北卡罗来纳工厂之外）可再生天然气的优先承购权（CV002）。这种「股权 + 承购」打包结构不同于纯基础设施交易，说明
              Mitsubishi 的投资逻辑不只看财务回报，更看长期能源获取权，以及面向日本的战略 RNG 供应（CV041）。

              要理解这一定价，股权结构背景很关键。工业脱碳私募股权机构 Ara Partners 管理资产约 $6.6B，自 2021 年收购以来一直持有控股权（CV006）。加拿大管道巨头 Enbridge 在 2023 年
              3 月以 $80M 成长股权投资取得 10% 股权，同时承诺 $1 billion 基础设施开发资金；后者代表项目融资能力，不是实缴股权（CV003）。BP 锁定一份约 $175M、期限 10 年的 RNG
              承购协议，覆盖三座特定现有设施（CV004）。Nuveen Energy Infrastructure Credit 提供 $90M+ 项目债，为北卡罗来纳 Lexington
              设施融资（CV005）。已承诺项目融资加上 Series C 之前的股权，合计约 $1.09B，覆盖 30 座设施全国扩张所需 $2.7B–$3.6B 估算资金不到一半（CV022）。

              关键在于，Divert 从未在任何公开文件或新闻稿中披露收入、EBITDA、ARR、现金头寸或设施级利润率数据（CV007）。因此，>$1B 估值没有可核验财务指标支撑；没有 NDA
              下的数据访问，无法按公开市场标准承销。CFO Brad Lukow 在 2026 年 4 月确认，Series C 仍处于开放状态，且「other infrastructure funds are
              circling as potential investors」（CV008），意味着该轮尚未完全认购。AgriInvestor 引述 Ara Partners 的 Cory Steffek 称
              Divert「nearly outpacing the entire RNG market」，但公开数据没有任何数字证据支撑这一表述（CV009）。入场纪律的含义很直接：为 RNG
              选择权和监管顺风定价的战略投资人，可以解释当前估值；拿不到设施经济性数据的财务回报型 LP，应要求先进入 NDA 数据室，再决定是否出资。
