      - number: '8.2'
        title: 公开可比公司分析与倍数基准
        blocks:
          - type: paragraph
            body: >-
              Divert 未披露财务数据时，较有纪律的做法，是用四家公开可比公司反推支撑 >$1B 估值所需的隐含收入区间：Anaergia（最接近的纯业务可比）、Waste Management（WM）、Republic
              Services（RSG）和 Enviri Corporation（工业服务 / 环境服务）。

              Anaergia（TSX: ANRG）运营一体化 waste-to-RNG 设施，把食物垃圾、城市固废和污水转化为可再生天然气与肥料，是最直接可比的上市公司。截至 2026 年 6 月，Anaergia
              企业价值约 CAD $469M（约 USD $345M），基于过去 12 个月收入 CAD $210M（约 USD $154M）的 EV/Revenue 倍数约 2.23x（CV010、CV011）。公司在
              2026 年 Q1 只实现 CAD $1.1M 正调整后 EBITDA——这是多年亏损后的第三个连续正 EBITDA 季度——但 221x EV/EBITDA 说明，相对于资产基数，盈利仍极薄（CV012）。按
              Anaergia 2.2x EV/Revenue 倍数，Divert 的 >$1B 估值隐含约 $450M+ 收入（CV016）。考虑到 Divert 只有两座运营中 AD 设施，满产时每座 RNG 年收入约
              $6M–$12M，另加未披露服务费，这一收入水平几乎可以确定尚未达到。因此，Anaergia 可比项显示，Divert 相对最接近的运营可比公司存在显著溢价（CV034）。

              多元化大型废弃物运营商 WM（EV $110.5B，EV/Revenue 4.35x，EV/EBITDA 15.1x）和 RSG（EV $78.3B，EV/Revenue 4.69x，EV/EBITDA
              15.3x）为带 RNG 组件的一体化废弃物基础设施设定了估值上限（CV013、CV014）。这些倍数对应的是规模化后产生约 30% EBITDA 利润率的公司，而 Divert
              还无法证明这一点（CV019、CV035）。按 WM/RSG 约 4.5x 混合 EV/Revenue，Divert 的 >$1B 估值隐含约 $220M–$230M 年收入（CV017）——理论上 8–10
              座运营设施可以达到，但明显高于当前水平。Enviri Corporation（EV $2.23B，EV/Revenue 1.76x，EV/EBITDA
              204x）为低利润工业服务提供低倍数参照（CV015），按该倍数隐含 $570M+ 收入（CV018）。值得注意的是，即使最低倍数可比项，也意味着 Divert 可能的 2026 年实际收入仍有显著缺口。

              基础设施重置成本提供了另一组锚点：两座运营设施加一座在建设施，每座约 $90M–$120M，对应实物基础设施价值 $180M–$360M，远低于 $1B（CV043）。高于重置成本的 >$1B
              溢价，反映的是客户网络（7,800+ 个地点）、数据平台、全国扩张管线和已签约承购选择权；这些价值没有在任何公开披露中被独立估值（CV042）。全球 AD 市场预计到 2032 年以 6.86% CAGR
              增长，提供结构性顺风（CV025）；仅 2025 年，食物垃圾解决方案就获得 $794M 投资（CV027）。
