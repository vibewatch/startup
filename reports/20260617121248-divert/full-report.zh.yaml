  - id: TV005
    title: 论点失效与终止触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - RNG 经济性：天然气价格持续崩塌
        - Henry Hub 连续 12 个月以上低于 $2/MMBtu，或 D3 RIN 价格较 2024 水平下跌 >60%
        - 单设施 RNG 收入显著下降；项目融资契约可能违约；bp / Mitsubishi 承购价值压缩；基准情形转向熊市
        - 暂停新设施承诺；按零补贴假设对设施层面经济性做压力测试；要求 Mitsubishi 披露价格底线
      - - 资本缺口未补上：Series C 认购不足
        - Series C 新股权融资低于 $100M，或下一次设施项目融资事件未能吸引贷款人
        - 30 座设施扩建到 2028 年卡在 6 个运营站点以下；估值倍数压缩；需要稀释性后续融资
        - 重新评估入场价格；向领投方索取二级市场估值标记；任何新增资本承诺前争取 NDA 访问
      - - 监管倒退：45Z 或 D3 废除 / RNG 资格受限
        - 国会取消 45Z 清洁燃料生产税收抵免，或 EPA 收紧 D3 下食物废弃物原料的 RNG 资格
        - 每座设施收入估计下降 20–40%；没有长期合约定价的设施项目经济性转负
        - 做零补贴设施情景分析；加快承购重新谈判时间表；评估向 Mitsubishi 或 WM 战略出售
      - - 消化池监管收紧：微塑料或甲烷泄漏规则
        - EPA 或两个及以上主要州禁止消化残渣土地施用，或要求超出现有设施设计的甲烷监测升级
        - 单设施合规资本开支增加；消化残渣肥料收入流受限；客户价值主张削弱
        - 与技术团队核实 Divert 设施监测协议；按任何拟议标准确认设施层面甲烷测量
      - - 竞争者替代：WM / RSG 整合食物废弃物 AD
        - WM 或 RSG 收购大型食物废弃物 AD 平台（如 Vanguard Renewables），并把 AD 产能与全国零售商废弃物合同打包
        - 客户流失加速；Divert 失去独占零售增长可选性；一体化在位者带来定价压力
        - 通过 NDA 获取前 10 大客户集中度和合同期限；评估与食物废弃物流通伙伴的防御性 M&A
    notes: 触发阈值是基于公开运营和市场数据的定性估计。具体 RIN 价格、EBITDA 影响和竞争者情景由可比先例推断； Divert 未披露设施层面经济性或敏感性模型。
    claimRefs:
      - CV028
      - CV030
      - CV032
      - CV034
      - CV039
  - id: TV006
    title: 最终尽调追问
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入和 EBITDA
        - Divert 在任何公开来源中均未披露收入、毛利率、EBITDA、现金头寸或烧钱速度
        - 没有财务数据，就无法验证可比倍数或 runway 分析；从 LP 角度看，$1B+ 估值完全没有锚
        - 管理层 NDA data room：索取季度 P&L、设施层面收入拆分（服务费 vs. RNG vs. 肥料）以及过去 12 个月 EBITDA
      - - Series C 完整条款和股权结构表
        - Series C 融资总额、全部投资者名称、pre-money / post-money 拆分、清算优先权和稀释时间表均未披露
        - Enbridge 股权、Nuveen 项目债务和新 Series C 投资者带来的优先权负担，可能显著压缩普通股回报； 超额认购轮次还会进一步稀释早期 LP
        - 向 CFO Brad Lukow 索取完整 cap table 模型和 waterfall；确认优先权栈与反稀释条款
      - - 设施层面单位经济性
        - Turlock CA 和 Longview WA 的单设施收入（服务费 + RNG + 肥料）、运营成本、EBITDA 和偿债覆盖率未公开披露
        - 牛市和基准估值完全取决于单设施经济性；只有 2 个运营站点提供真实数据；没有单设施 P&L， 推演到 30 座设施很投机
        - 将 Turlock CA 和 Longview WA 月度 P&L 与偿债计划表纳入 NDA 尽调请求
      - - Mitsubishi 承购定价和期限
        - Mitsubishi 优先 RNG 承购协议的具体定价、数量、floor / ceiling 结构、期限和终止权未披露
        - 承购合同支撑牛市 / 基准情景；如果价格等于或低于 RNG 现货且没有 floor，$1B+ 估值中的战略溢价会显著降低
        - 索取 Mitsubishi 承购条款清单摘要；确认定价机制（指数 vs. 固定）、数量 take-or-pay， 以及相对项目融资期限的合同期限
      - - 后续设施项目融资管线
        - Lexington NC（Nuveen 之外）以及后续 5–8 座设施的已承诺贷款人和融资条款尚未公布
        - 每座设施都是独立项目融资事件；债务可得性取决于资本市场环境和项目层面风险画像； ~$1.6B+ 资本缺口真实且未解决
        - 索取项目融资管线，包含 NC 设施以及任何已宣布 Ohio、中大西洋或东南站点的贷款人 term sheet 状态
      - - 客户集中度和 NRR
        - 前 10 大客户收入占比、合同期限、终止权、重新谈判频率和净收入留存率未披露
        - 少数杂货连锁客户高度集中会带来流失风险；没有 NRR 数据，就无法评估服务费收入质量和可预测性
        - 索取按账户拆分的收入（前 10 大客户）、合同期限分布，以及按 cohort（2022–2025 年份）划分的 NRR
    notes: 尽调事项按财务回报投资者的关键程度排序。第 1–3 项是阻断项；第 4–6 项是重大项。所有事项都是只能靠私有证据解决的缺口， 需要 NDA 访问。
    claimRefs:
      - CV007
      - CV005
      - CV022
      - CV033
      - CV036
