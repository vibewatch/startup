  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险图景概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              Divert 位于气候技术、食品基础设施和受监管废弃物管理的交叉点，三类领域风险相互叠加。公司资本密集型基础设施建设是最主要的论点检验点：每座设施约 $90M+，目标到 2031 年建成 30 座，总 capex
              需求超过 $2.7 billion。相对于 $1.09B+ 已承诺项目融资（Enbridge $1B、Nuveen 为 Lexington 提供 $90M+），约 18
              座设施仍未披露融资。每座新设施都需要独立许可流程、项目融资谈判、原料协议和管道互联——这条顺序依赖链在规模化时产生显著执行风险。

              第二层风险是拆包装副产物的监管不确定性：消化残渣中的微塑料没有标准化测量方法，多个州正在起草规则，未来土地施用限制会削弱 Divert 的土壤改良剂收入。第三是 RNG 政策风险：USDA 贷款暂停延长至
              2026 年 12 月，Earthjustice 诉讼针对粪肥消化器而非食物垃圾设施，但会负面影响整个行业的投资者和监管情绪。第四是领导层执行风险，来自 2025 年 3 月 COO 离任、新 CFO，以及直到
              2024 年 12 月才完成的四名 VP 级招聘。第五是客户集中度不透明：尽管依赖少数大型杂货连锁，单客户收入未披露。本章风险热力图按可能性和影响映射了全部已识别风险。
