      - number: '1.4'
        title: 运营规模、里程碑与负面信号
        blocks:
          - type: paragraph
            body: >-
              Divert 的运营规模增长很快。截至 2026 年中，公司在全美 50 个州支持约 7,800 个客户网点（CO032），2024 年增长 22%（CO034）；自创立以来累计处理超过 38
              亿磅滞销食品（CO037）。仅 2024 年，Divert 就处理超过 6.3 亿磅，同比增长 52%（CO033），同时员工数增长 23%（CO035），并自 2018 年以来促成相当于超过 1,500
              万餐的捐赠（CO036）。客户包括五家 Fortune 100 公司，以及 Kroger、Albertsons、Ahold Delhaize、Giant Food、Safeway 和 Target
              等大型食品杂货商（CO044）。2024 年，Divert 拓展进入新的工业垂直领域，并与 Blue Diamond Growers 建立循环合作（CO045）。

              基础设施里程碑支撑了增长叙事。第一座 Integrated Diversion & Energy Facility 于 2024 年 12 月在加州 Turlock 开业（CO038）；第二座于 2026 年 4
              月 29 日在华盛顿州 Longview 开业（CO039），每年最多可向 Cascade Natural Gas 配气管网注入 235,000 MMBtu RNG（CO043）。每座设施设计年处理能力为
              100,000 吨（CO041）。第三座位于北卡 Lexington 的设施已于 2025 年 4 月开工，预计 2026 年晚些时候投运（CO040）。第四座已宣布落地俄亥俄州
              Harrison（CO048）。Divert 的长期目标是建设 30 座设施，使美国 80% 区域处于 100 英里覆盖范围内（CO042）。2024 年 8 月，Divert 与 Zero Food Waste
              Coalition 和 Harvard Law School Food Law and Policy Clinic 合作，发布首个 Food Waste Legislative Tracker（CO046）。

              负面信号需要密切关注。气候批评者认为，把沼气注入现有天然气管道会延续化石燃料基础设施，且沼气最多只能供应美国天然气需求约 1%，这让 RNG
              路径相较电气化的长期气候逻辑受到质疑（CO047）。公司内部，联合创始人 Nick Whitman 于 2025 年 3 月从 COO 转任顾问董事会，再叠加 2024–2025
              年多名高管加入，构成重大领导层过渡（CO017）。截至 2026 年 6 月，公开来源未发现针对 Divert 的重大监管执法行动或诉讼（CO049）。
