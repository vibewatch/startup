  - id: TV002
    title: 正方论点与反方论点
    columns:
      - 支柱
      - 正方论点
      - 反方论点
      - 什么会改变观点
    rows:
      - - 平台防御性
        - RFID 数据层 + 逆向物流 + 自有 AD 基础设施，在 7,800+ 个零售和工业点位上叠出多层转换成本护城河；没有竞争对手具备可比的一体化堆栈
        - 数据层尚未证明能阻止竞争对手向同一批零售商销售；Denali 在没有等价数据层的情况下触达 1,400 个 Walmart 点位；流失率和 NRR 未披露
        - 披露净收入留存率（NRR）、流失率，以及每点位每年服务费
      - - 资本与基础设施可信度
        - Enbridge $1B 基础设施承诺 + Mitsubishi 股权信号显示机构信心；Ara Partners 的 PE 纪律增加运营刚性
        - 30 个设施建设需要 $2.7B–$3.6B 总 capex；已披露承诺（~$1.09B）覆盖不到一半；剩余每个设施都是独立项目融资事件，贷款人胃口不确定
        - 宣布后续 5 笔项目融资关闭，披露具名贷款人和已到位金额
      - - RNG 收入质量
        - 长期签约承购（bp ~$175M/10 年、Mitsubishi 优先权）隔离现货价格波动；Longview 截至 2026 年 4 月已生产 RNG
        - 2 个设施的 RNG 年收入估计为 $6–$24M/yr；在 $1B+ 估值下，当年倍数极高；EIA AEO 2026 预计到 2030 年天然气价格偏低
        - 发布设施级 RNG 收入、Mitsubishi 承购价格底，以及满产时预计收入
      - - 监管顺风
        - 12+ 个州的食物垃圾分流强制令创造被动合规需求；Divert 定位为零售商的一站式合规伙伴
        - 在当前政府下，45Z 和 D3 RIN 补贴面临政治风险；USDA 厌氧消化设施贷款暂停释放监管逆风信号；CLF 和倡议组织正在加大对 AD/RNG 的绿色洗白批评
        - 证明在补贴下调情景下收入仍稳定；展示不计补贴贡献时的设施级经济性
      - - 可比溢价理由
        - 30 个设施的基础设施滚动建设应享有基础设施式溢价（成熟期 EV/EBITDA 15–20x），而非纯废弃物公司倍数；Anaergia 是错误可比（没有食物优先的数据层）
        - Anaergia 交易在 2.2x EV/Revenue，EBITDA 勉强为正；WM/RSG 的 4.5x 需要约 30% EBITDA 利润率，Divert 不能证明；没有私营可比支持当前披露规模下 $1B+ 的估值
        - 披露 2026 年收入 run-rate，以及 5+ 个设施投运后通往 $30%+ 利润率的 EBITDA 时间表
    notes: 每个论点支柱至少有一个重大反论点。整体观点是，若战略投资者为长周期基础设施和承购可选性定价，可以接受当前标记；无法访问设施经济性的财务回报投资者，没有 NDA 数据室就无法承销。
