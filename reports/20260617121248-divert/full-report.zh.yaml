companyProfile:
  summary: >-
    Divert, Inc. 是一家位于马萨诸塞州 West Concord 的循环经济公司，成立于 2007 年，靠一套整合的 Prevent-Provide-Power® 平台预防并分流商业食品浪费。系统覆盖基于 RFID
    的门店级滞销食品追踪、逆向物流、自研拆包，以及同址厌氧消化，把食品废弃物转成可再生天然气、CO2 和有机土壤改良剂。公司服务全美 50 个州约 7,800 个零售与工业客户网点，在加州 Turlock（2024 年 12
    月）和华盛顿州 Longview（2026 年 4 月）运营两座 Integrated Diversion & Energy Facilities，并在 Ara Partners、Enbridge、Mitsubishi
    Corporation、Nuveen Energy Infrastructure Credit 和 Wittington Investments 支持下，建设 30 座设施的全国网络。Mitsubishi 领投的 2026 年 4
    月 Series C 把 Divert 估值推高至 10 亿美元以上；Mitsubishi 也在交易中获得 RNG 优先承购权。
