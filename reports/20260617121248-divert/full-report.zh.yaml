      - number: '8.3'
        title: 牛市、基准与熊市情景分析
        blocks:
          - type: paragraph
            body: >-
              三种情景都基于公开可得证据构建。牛市情景下，Divert 按计划完成 30 座设施扩张，靠新增 PE / 基础设施资本和项目债补上资金缺口，监管顺风（45Z、D3 RIN、州级强制要求）延续，并在 2030
              年实现 $500M–$800M 年化收入、15–20% EBITDA 利润率；按 4–7x EV/Revenue，企业价值可能达到 $3B–$5B（CV037）。牛市情景要求融资通道不中断、运营执行速度达到
              Divert 尚未证明的水平（截至 2026 年中只有 2 座设施投运），且 RNG 价格维持在 $15/MMBtu 以上。

              基准情景下，Divert 到 2030 年建成 8–12 座设施，实现 $150M–$300M 收入，EBITDA 接近盈亏平衡，并以稀释性条款继续融资。随着 Enbridge、Nuveen
              和后续项目融资贷款人的优先权益叠加，企业价值稳定在 $800M–$2B（3–6x EV/Revenue）（CV038）。这一情景与 Enbridge 和 Mitsubishi 当前约每年 2
              座设施的推进节奏一致，也得到 Anaergia 先例的印证：即便收入强劲增长，EBITDA 也要很久才转正。

              熊市情景下，天然气价格持续承压（EIA AEO 2026 预计 Brent 原油到 2030 年前低于 $70/bbl，压制 RNG
              定价溢价）（CV032），联邦补贴在当前监管环境下收缩，厌氧消化行业压力事件——类似 USDA $102.6M 厌氧消化贷款逾期——传导到 Divert 的项目融资管线（CV030）。资金缺口坐实，设施扩张停在
              3–5 个站点，Divert 被迫接受 down round 或以 $200M–$600M 出售给战略买家，隐含 0.5–1.5x 重置成本价值（CV039）。

              估值对收入倍数选择极其敏感：EV/Revenue 每移动 1x，隐含收入底线就变化
              $200M–$450M。考虑到当前财务数据完全不透明，这一区间巨大。基础设施重置成本给出了实际下行底线；投资人真正要判断的是，尚未产生已披露 EBITDA 的 30 座设施管线和已签约承购，究竟该给多少信用。
