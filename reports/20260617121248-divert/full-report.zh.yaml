          detail: 第三座一体化设施破土动工；Nuveen Energy Infrastructure Credit 投资 >$90M；约 60 个岗位； 覆盖美国东南部
          tone: positive
        - date: 2026-01
          label: Wittington Investments 融资
          detail: Wittington Investments 领投未披露金额轮次；Ali Naqvi（OPG）和 Zvi Orvitz（Wittington）加入董事会
          tone: positive
        - date: '2026-04-14'
          label: Mitsubishi Series C — 独角兽身份
          detail: Mitsubishi Corporation 领投 Series C；Divert 估值超过 $1 billion；未来设施获得优先 RNG 承购安排
