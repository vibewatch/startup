              - CV038
              - CV039
              - CV043
      - number: '8.4'
        title: 反向证据与审慎估值视角
        blocks:
          - type: paragraph
            body: >-
              多条反向证据让牛市情景变得复杂，并直接影响 >$1B 估值的风险调整价值。Conservation Law
              Foundation（CLF）发布详尽批评，认为厌氧消化设施会最大化甲烷产量，把工业化农业锁进损害气候的系统，并产出仍然是甲烷、且会从管道基础设施泄漏的「可再生」天然气——因此将其称为漂绿（CV028）。Divert
              以食物垃圾而非粪肥作为原料，部分缓解了「锁定工厂化养殖」的批评，但管道泄漏和甲烷属性风险仍会影响 RNG 承购定价和监管耐久性。

              The New Lede 2026 年 3 月报道称，威斯康星州厌氧消化项目 BC Organics 因有记录的泄漏，在 2024 年排放 4,921 公吨甲烷，相当于约 30,000
              辆汽油车的排放（CV029）。这是粪肥消化设施，不是 Divert 这类食物垃圾消化设施，但它说明 AD 设施可能因运营失误排放大量甲烷，直接牵动监管敞口和碳信用有效性。另一个先例是，USDA 在发现
              $102.6M 厌氧消化贷款逾期后，于 2026 年 1 月暂停厌氧消化贷款项目；BC Organics 占其中 $100.1M，贷款逾期 181–360
              天（CV030、CV031）。这一先例证明，即便有政府兜底，大型 AD 项目也可能无法偿还项目债；这对依赖项目融资扩张的 Divert 直接相关。

              从公开市场可比角度看，Anaergia 即便在 2026 年 Q1 收入增长 122%，EV/EBITDA 仍高达 221x，凸显 waste-to-RNG 模型资本开支极重：即使达到规模，EBITDA
              也只是勉强转正（CV035）。数据集中的可比公司，没有一家能支持在未证明 EBITDA 超过 $30M 时给出 >$1B EV；Divert 未披露自己达到这一门槛（CV034）。EIA AEO 2026
              预计天然气价格压力将持续到 2030 年，直接限制 RNG 相对商品天然气可获得的溢价（CV032）。如果 Henry Hub 价格长期均值低于 $3/MMBtu，D3 RIN
              补贴就会成为关键收入支撑——这会制造一个牛市情景无法对冲的政治风险。Divert 的 Mitsubishi 承购条款仍保密，因此优先承购权里到底嵌入多少定价保护，无法核验（CV033）。最后，Divert 处于
              EBITDA 为负且现金头寸未披露的状态，说明公司靠已承诺项目融资运营，而不是靠当期现金生成（CV036）。
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV005
            claimRefs:
              - CV028
              - CV030
              - CV032
              - CV034
              - CV039
      - number: '8.5'
        title: 退出准备度、战略选择权与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Divert 最可能的退出路径是战略收购或基础设施赞助方 roll-up，而不是近期 IPO。Waste Management 和 Republic Services 拥有全国物流网络和现有 RNG
              项目，是天然战略买家；两者 EV/Revenue 为 4–5x，EBITDA 利润率也足以用溢价吸收 Divert 的服务费收入流（CV040）。Mitsubishi
              的优先承购权为分阶段买断创造了结构性激励：设施爬坡、承购价值得到验证后，MC 可能提高股权比例，逐步走向完全控制（CV041）。Enbridge 持有 10% 股权并承诺 $1B
              基础设施资金，更像长期基础设施共同投资人，而非战略收购方。

              IPO 仍在远期视野内，但在 5–8 座运营设施产生可证明、可重复 EBITDA 之前，可能性不高——最早大概也要到 2028–2030 年。公司 2024 年处理 630M+ lbs 食物（增长
              52%）（CV020），服务全美 50 个州 7,800+ 个客户地点（CV021），并在 Ara Partners 基础设施能力支持下拥有 30 座设施全国扩张路线图（CV022）。Longview WA
              设施已于 2026 年 4 月 9 日开始向管道注气，满产时每年可生产最高 235,000 MMBtu RNG（CV023）。两座运营中 AD 设施加一座在建设施，使 Divert 具备开始吸引 LP
              共同投资人参与下一批项目融资的运营记录（CV024）。美国全国有 121 座独立食物垃圾消化设施，且具备新增 1,370 个站点的潜力，市场大但当前仍薄（CV026）。2025 年私人部门对食物垃圾的投资达到
              $794M，确认机构资本对该赛道有兴趣（CV027）。

              若要按当前 >$1B 估值投入资本，最低尽调要求包括：在 NDA 下查看 Turlock CA 与 Longview WA 的设施级
              P&L（仅有的两个运营数据点）；拿到完整股权结构和分配瀑布模型，评估优先权积压；以及 Mitsubishi
              承购条款清单，用于核验价格和数量。没有这些材料，承销就完全依赖战略叙事和公开可比推断，而不是可核验的单位经济。
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV026
              - CV027
              - CV040
              - CV041
          - type: table
            tableRef: TV006
            claimRefs:
              - CV007
              - CV005
              - CV022
              - CV033
              - CV036
      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 估值立场——偏高；继续跟踪财务披露
            body: >-
              在 >$1B 估值下，Divert 的定价押注的是 30 座设施基础设施扩张成功，但这一点尚未被证明。对为 RNG
              承购选择权和长周期基础设施定价的战略投资人（Mitsubishi、Enbridge）而言，该估值可以辩护；但对财务回报型 LP 而言，在没有 NDA 下收入、EBITDA 和设施级 P&L
              访问权限之前，无法承销。继续跟踪，直到：（1）Series C 条款和股权结构披露；（2）设施级经济性在 NDA 下提供；或（3）估值重置到由可核验指标支撑的水平。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV042
          - type: callout
            title: 资金缺口是核心执行风险
            body: >-
              Divert 目标建设 30 座设施，每座 capex 约 $90M–$120M，整体项目 capex 为 $2.7B–$3.6B。已披露承诺融资合计约 $1.09B（Enbridge $1B 基础设施承诺 +
              Nuveen $90M+），留下约 $1.6B+ 缺口，必须逐座设施通过独立项目融资事件补齐。每一次融资都是二元风险：若贷款人参与失败，建设就会停滞，EBITDA 兑现延后，基准情景估值倍数被压缩。
            calloutType: risk
            claimRefs:
              - CV022
              - CV003
              - CV005
          - type: callout
            title: Mitsubishi 交易结构显示估值驱动来自战略而非财务
            body: >-
              Series C 中「股权 + 优先 RNG 承购」打包结构，不像典型财务 PE 交易。Mitsubishi 支付基础设施溢价，是为了锁定面向日本和全球市场的长期食物垃圾 RNG 供给；这部分价值不会体现在标准
              EV/Revenue 或 EV/EBITDA 倍数里。这也部分解释了偏高的财务倍数：战略买家用对自己价值远高于 10 年回报期 LP 基金的承购选择权，隐性补贴了估值。
            calloutType: insight
            claimRefs:
              - CV002
              - CV041
              - CV042
