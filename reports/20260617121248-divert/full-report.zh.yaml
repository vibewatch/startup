  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Divert 的竞争不是发生在单一市场细分内，而是横跨五类买方任务。买方任务——分流并货币化商业食品废弃物，同时降低损耗——可以由直接一体化同行、纯拆包既有企业、独立 AD
              技术运营商、店内循环替代方案，以及填埋运输商和市政堆肥这一现状部分解决。每一类都需要单独分析，因为买方转向其中任一方案，解决的是同一任务的不同切片（CP032、CP033）。

              直接同行追求端到端有机物转 RNG 基础设施：Vanguard Renewables（BlackRock 支持，32 个运营站点，目标 2028 年达到 100
              座设施）是最可比的规模化运营商（CP002、CP003）。拆包既有企业——以 Denali 为首——捕捉同样的零售原料，但不拥有 AD
              基础设施或数据分析，而是把有机物送往第三方堆肥商、动物饲料生产商和消化设施（CP015）。Anaergia 等 AD 技术提供商向 Divert 类运营商和市政机构供应自研设备和 O&M 服务；Anaergia
              已在四座 Vanguard 设施部署技术，并正转向轻资产模式（CP023、CP042）。现状替代方案——填埋运输商和市政堆肥——截至 2024 年仍分别占零售剩余食品去向的 21.1% 和
              21.9%（CP033）。潜在进入者包括大型废弃物运输商（Waste Management、Republic Services），它们拥有既有收集合同，但目前缺少拆包和数据能力（CP038）；以及
              Amazon/Whole Foods 等垂直整合零售商借助 Mill Industries 进行潜在自建（CP031）。未发现针对 Divert 竞争对手的监管执法行动；但全国仅 121
              座独立食品废弃物消化设施，相比 Divert 30 座设施目标，说明装机基础有限，约束所有参与者的原料路由（CP034）。
