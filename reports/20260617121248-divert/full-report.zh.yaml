      - number: '6.4'
        title: 留存、合同耐久性与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              Divert 未公开 NRR、GRR、流失率或合同条款，无法从公开来源直接衡量留存。三个代理指标指向较高的结构性切换摩擦。第一，多年项目证据：Giant Food 合作从 2022 年 6 月持续到至少 2025
              年 2 月，并伴随项目扩张——第一年 165 家门店，里程碑报告时 163 家门店（属于小幅品牌重组，不是收缩）。未具名 Mid-Atlantic RFID 杂货连锁从 2017
              年起连续运行该项目至少五年。三家未具名 PNW 连锁自 2017 年起维持项目，到 2026 年中已超过八年。第二，运营整合：Divert 的 RFID
              箱嵌入门店后场，退出时需要员工重新培训、逆向物流协调和箱体替换物流；每月门店级浪费基准不断积累，竞争对手若不并行重新收集 12+ 个月就无法复制。第三，监管锁定：California、Massachusetts
              和 Washington 客户依赖 Divert 的认证销毁文件和设施邻近性来满足法定义务（SB 1383、MassDEP ban、WA Organics Law），切换成本部分来自法规。Divert
              官方渠道上的客户证言（Ahold Delhaize USA、Safeway Northern California、Albertsons Portland Division、USCS、Blue
              Diamond）一致为正面确认。未发现公开宣布的客户流失、合同丢失或负面第三方评价；缺少反向证据是弱正面信号，但不是留存指标。
