  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Prevent / Provide / Power®：端到端产品栈
        blocks:
          - type: paragraph
            body: >-
              Divert
              把产品组合组织成三段框架：Prevent（靠数据和培训从源头减少未售出食物）、Provide（优化可食用食物捐赠，服务食物不安全人群）、Power（把不可捐赠的未售出食物转化为可再生能源和肥料）。该框架覆盖三类客户——杂货零售商、食品仓库和分销商、食品制造商——并通过六个不同服务模块交付：基于
              RFID 的数据分析、逆向物流和可折叠箱收集、包装食品拆包装、厌氧消化、认证销毁，以及面向部门的共同培训。截至最新公开数据，Divert 服务 7,800+ 个客户地点，累计处理 38
              亿磅未售出食物，并促成向食物不安全人群捐赠 1,500 万餐。公司已在这一领域运营 19 年。没有产品以独立 SaaS 或硬件 SKU
              形式销售——所有模块都作为一体化托管服务部署，这让产品栈更粘，也让复制它更耗资本。
