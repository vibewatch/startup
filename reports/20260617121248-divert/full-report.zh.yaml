  - id: FO001
    title: Divert 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 按时间顺序梳理 Divert 从 2007 年成立到 2026 年 4 月成为独角兽的关键节点，覆盖融资轮次、 设施投运、合作伙伴关系和治理变化。
    data:
      items:
        - date: '2007'
          label: 公司成立
          detail: Ryan Begin 和 Nick Whitman 在 Massachusetts 创立 Divert；Prevent-Provide-Power® 循环食物废弃物模式确立
          tone: positive
        - date: '2021'
          label: $100M 成长股权 — Ara Partners 领投
          detail: Ara Partners、GIC 和 Ontario Power Generation 投资 $100M；Ara 取得控股权；设施扩建提速
          tone: positive
        - date: '2022'
          label: BP $175M RNG 承购协议
          detail: BP 为 Divert 三座设施签署约 $175M、10 年期承购协议；这是美国已知最大食物废弃物 RNG 承购协议之一
          tone: positive
        - date: 2023-03
          label: Enbridge $1B 基础设施 + $100M 股权
          detail: Enbridge 为全国设施网络承诺 $1B 结构化融资；投资 $80M 股权；取得约 10% 股份
          tone: positive
        - date: 2024-06
          label: Feeding America 全国合作
          detail: 启动数据驱动合作，优化 Feeding America 200+ 食品银行网络中的食物捐赠
          tone: positive
        - date: 2024-08
          label: 食物废弃物立法追踪器发布
          detail: 与 Zero Food Waste Coalition 和 Harvard Law School FLPC 共同发布首个同类交互式政策追踪器
          tone: positive
        - date: 2024-11
          label: Timothy Laurion 加入董事会
          detail: Bank of America 董事总经理，拥有 41 年环境服务银行经验，加入 Ara Divert HoldCo 董事会
          tone: positive
        - date: 2024-12
          label: Turlock CA 设施投运
          detail: 首座 Integrated Diversion & Energy Facility 投运；产能 100,000 tons/yr；商业化 RNG 生产开始
          tone: positive
        - date: 2025-03
          label: 联合创始人 Whitman 转任 COO 之外角色
          detail: Nick Whitman 在 18 年后由 COO 转任董事会 / 顾问角色；Bob Watkins 被任命为 COO； 关键人物交接
          tone: neutral
        - date: 2025-04
