      - CR024
      - CR027
      - CR028
      - CR029
      - CR033
  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: wide
    summary: 从 Divert 的运营与财务画像出发，经过可比公司分析和风险评估，推导出最终的「观察」建议和「偏高」估值判断。
    data:
      nodes:
        - id: A
          label: 运营证据：7,800+ 个点位，2024 年处理 630M lbs，2 座 AD 设施投运，30 座设施路线图
        - id: B
          label: 融资证据：>$1B 估值标记（Mitsubishi Series C）；Enbridge 10% + $1B 基建；Nuveen $90M+；bp $175M 承购
        - id: C
          label: 财务不透明：收入、EBITDA、ARR 或设施级 P&L 均未披露
        - id: D
          label: 可比分析：Anaergia 2.2x EV/Rev（EBITDA 很薄）；WM/RSG 4.4-4.7x（30% EBITDA）；Enviri 1.76x
        - id: E
          label: 风险评估：~$1.6B+ 资本开支缺口；RNG 补贴敞口；甲烷泄漏风险；USDA 厌氧消化项目逾期先例
        - id: F
          label: 战略溢价：Mitsubishi 承购选择权；全球 RNG 平台；Ara Partners 的 PE 纪律
        - id: G
          label: 估值立场：偏高 — $1B+ 高于上市可比公司锚点；基础设施重置成本远低于该估值标记
        - id: H
          label: 建议：观察 — 需要 NDA 数据室；在财务披露前保持观察；战略投资者可能觉得合理
      edges:
        - from: A
          to: D
        - from: B
          to: D
        - from: C
          to: G
        - from: D
          to: G
        - from: E
          to: G
        - from: F
          to: G
        - from: G
          to: H
    approximationNotes: 流程仅用于说明从证据到建议的逻辑链，不是因果模型。节点标签包含估计值，尚未得到公开披露验证。
    claimRefs:
      - CV001
      - CV007
      - CV010
      - CV022
      - CV034
      - CV042
  - id: FV002
    title: 估值对收入倍数的敏感性
    type: bar
    layout: standard
    summary: 基于上市可比公司 EV/Revenue 倍数，反推 Divert >$1B 估值隐含的收入规模，突出当前估值标记需要多少收入支撑。
    data:
      items:
        - label: Enviri 底部 1.76x（最低可比）
          value: 568
        - label: Anaergia 纯业务可比 2.2x
          value: 455
        - label: 中位区间 3.0x
          value: 333
        - label: WM 大盘公司 4.35x
          value: 230
        - label: RSG 大盘公司 4.69x
          value: 213
        - label: 基础设施溢价 6.0x
          value: 167
    approximationNotes: >-
      隐含收入 = $1,000M EV / 倍数。用 $1B 作为 >$1B 估值标记的底线；实际估值标记可能更高，隐含收入也会按比例上升。所有收入数字单位均为 USD millions。Divert
      实际收入未披露；这些是模型输入，不是已确认的实际值。
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV007
  - id: FV003
    title: 分情景估值与回报区间
    type: range
    layout: standard
    summary: Divert 悲观、基准、乐观三种情景下的估值区间，并把当前 $1B+ 入场估值作为参照。计算基于上市可比公司倍数和各情景收入估计。
    data:
      items:
        - label: 悲观情景 EV（USD M）— 3-5 座设施，RNG 经济性收缩
          low: 200
          high: 600
        - label: 基准情景 EV（USD M）— 8-12 座设施，$150-300M 收入
          low: 800
          high: 2000
        - label: 乐观情景 EV（USD M）— 15-20 座设施，$500-800M 收入
          low: 3000
          high: 5000
        - label: 基础设施重置成本（USD M）— 2 座运营中 + 1 座建设中
          low: 180
          high: 360
        - label: 当前融资估值标记（USD M）— Series C 隐含
          low: 1000
          high: 1100
    approximationNotes: >-
      悲观 / 基准 / 乐观区间来自情景收入估计乘以上市可比公司的 EV/Revenue 倍数。基础设施重置成本按每座设施 $90-120M 估算，覆盖 2 座已运营设施 + 1 座在建设施。当前融资估值标记是底线估计；实际
      Series C 估值标记可能更高。所有数字单位为 USD millions；Divert 财务未披露，因此不确定性很高。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV043
  - id: FV004
    title: 投资 KPI — 投委会就绪评分
    type: kpi
    layout: compact
    summary: 从八个投资维度给出可提交投委会（IC）的评分。评级反映证据质量，以及乐观逻辑相对当前 $1B+ 估值标记的强度。
    data:
      items:
        - label: 市场机会
          value: Strong
          description: 12+ 个州设有强制要求；2025 年该赛道投入 $794M；全球 AD CAGR 为 6.86%；美国每年有 70M ton 食物浪费机会
        - label: 平台验证
          value: Partial
          description: 2024 年处理 630M lbs（同比 +52%）；2 座 AD 设施投运；7,800+ 个点位——但设施级 P&L 完全未披露
        - label: 竞争护城河
          value: Moderate
          description: RFID 数据层 + 一体化物流 + 自有 AD 拼出多层护城河；Vanguard（32 座设施）和 WM RNG 项目构成可信威胁
        - label: 收入质量
          value: Unknown
          description: 服务费 + RNG 承购的合同结构具备较强质量特征；实际 NRR、流失率和收入数字未披露
        - label: 资本效率
          value: Stretched
          description: 单座设施资本开支 $90-120M；30 座设施计划意味着总额 $2.7B-3.6B；已承诺融资 ~$1.09B；~$1.6B+ 缺口是核心风险
        - label: 风险画像
          value: High
          description: RNG 补贴敞口；甲烷泄漏监管；每座设施都有项目融资事件风险；赛道内已有 USDA 逾期先例
        - label: 估值 vs. 可比公司
          value: Stretched
          description: Anaergia（最接近的纯业务公司）EV/Rev 为 2.2x，意味着 Divert 需要 $450M+ 收入才能支撑 $1B；当前实际值很可能远低于此
        - label: 证据质量
          value: Medium-Low
          description: 融资估值标记已有一手来源确认；运营指标可信；所有财务指标要么公司未披露，要么来自代理变量估算
    claimRefs:
      - CV001
      - CV007
      - CV010
      - CV022
      - CV025
      - CV027
      - CV034
