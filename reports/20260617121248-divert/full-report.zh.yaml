      - number: '3.3'
        title: 能力对比、定价与市场打法
        blocks:
          - type: paragraph
            body: >-
              以“在完整价值链上预防并分流商业食品废弃物”这一买方任务衡量，Divert 的平台是唯一已识别、覆盖全部五层能力的竞争者：预防数据分析、食品捐赠促成、逆向物流、自研拆包，以及自有 AD-to-RNG
              基础设施（CP035、CP036、CP044）。没有竞争者公开声称拥有 Divert 所描述规模的 RFID 门店级库存追踪。Vanguard 覆盖拆包、AD 和
              RNG，但没有预防数据层，目标原料是食品制造商和农业原料，而非纯零售。Denali 拥有规模化拆包能力，但输出到第三方处理商而非自有 AD，也没有数据分析。BTS Bioenergy
              在美国基础设施有限，没有数据平台。Anaergia 提供赋能他人的设备技术，但不直接与食品杂货零售买方签订废弃物服务合同。Mill 瞄准上游店内干预，用另一条技术路径与 Divert 的预防目标竞争。

              Divert、Vanguard Renewables、Denali、BTS Bioenergy 以及其他具名竞争者的定价和合同结构，公开来源均未披露（CP045）。唯一可用的市场定价基准，是 EPA
              2022–2023 年 AD 倾倒费调查：全国独立食品废弃物消化设施平均每吨 $32.27，中位数每吨 $22.23。各方合同期限、捆绑服务定价、数据平台 SaaS
              费用、认证销毁溢价和量折结构均未知。这个信息缺口很重要，因为买方在 Divert 一体化模式和 Denali 纯拆包模式之间选择时，价格决策无法只凭公开数据评估（CP045）。

              竞争者的市场打法和分销能力差异很大。Divert 通过企业零售销售团队直接触达买方，以数据分析平台为锚签订多年服务协议，形成持续的数据交换关系，比商品化运输合同更难退出（CP037）。Vanguard
              按地理扩张，从东北—中西部基地向相邻市场和南部逐个市场推进，在新地理区域争夺重叠的零售和食品制造商原料（CP040）。Denali
              利用既有全国有机物运输网络，以及与食品杂货商、市政机构和食品制造商的成熟关系；Walmart 交易提供了标杆账户，可能加速把 Denali 的运输客户转化为拆包服务客户（CP013、CP016）。Waste
              Management 和 Republic Services 是美国最大的两家商业废弃物运输商，几乎与美国每一家商业食品机构都有深厚既有线路密度和客户关系，但目前没有可比 Divert
              的一体化拆包或预防平台（CP038）。它们未来进入拆包或数据分析层——无论自建还是收购——构成结构性长尾风险。
