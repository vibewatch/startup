      - number: '7.7'
        title: 图表
        blocks:
          - type: callout
            title: 最高优先级尽调要求——资本充足性与 COO 继任
            body: >-
              两个阻断缺口妨碍完整风险评估。第一，Series C 轮的充足性（金额、结构和新投资人）截至 2026 年中未披露；考虑到每座未建设施需要 $90M+
              项目融资，已承诺资本（$1.09B+）与建设计划（$2.7B+）之间的缺口是主要论点检验点。第二，COO 角色自 2025 年 3 月以来一直空缺或由非正式安排覆盖；考虑到 Divert COO
              职能范围（运营、财务、法务、人事、IT），14+ 个月后仍没有具名继任者，是重大组织缺口。两个缺口都需要 NDA 级别访问 Divert cap table 和组织架构图才能解决。
            calloutType: risk
            claimRefs:
              - CR021
              - CR036
              - CR050
          - type: callout
            title: 反向发现——USDA 与行业逆风并不会放过食物垃圾运营商
            body: >-
              USDA 将贷款担保暂停期延长至 2026 年 12 月 31 日，Earthjustice 联盟的规则制定请愿，形式上都指向粪肥厌氧消化设施。Divert
              处理的是食物垃圾，不是畜禽粪肥，因此与主要政策靶点存在部分隔离。但更大的联盟——CLF、Farm Forward、Food & Water Watch、Sentient
              Media——从气候角度反对所有捕集甲烷的厌氧消化设施，把 RNG 称为「漂绿」，并要求取消所有 AD 补贴。声誉和立法风险不会止步于粪肥项目。Divert 面向投资人的叙事明确把碳负 RNG
              和消化残渣作为循环经济凭据；任何监管或媒体外溢，只要开始质疑食物垃圾 AD 的气候收益，都会直接影响投资人参与 Series C 及后续项目融资轮的意愿。
