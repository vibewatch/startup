  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >-
              Divert
              的市场最好理解为两条相邻价值链的交叉点：美国商业食品废弃物分流服务，以及有机物转可再生天然气（RNG）基础设施。服务侧，公司向食品杂货零售商、食品制造商、仓库和分销商销售物流、数据分析、认证销毁、捐赠优化和拆包方案。基础设施侧，Divert
              拥有并运营 Integrated Diversion & Energy Facilities，把收集来的有机物转成 RNG 和肥料。两层都指向同一个底层问题：美国每年产生约 7,000 万吨剩余食品，其中约
              29% 被归为流向处置目的地的食品浪费（CM002、CM047）。

              市场边界不包括居民食品浪费、农场层面的作物损失、面向消费者的应用，以及没有食品分流要求的一般固废运输。Divert
              的核心可服务供给，是来自有机废弃物量可观的商业机构的食品废弃物——主要是食品杂货零售商和工业食品运营商。现状替代方案包括填埋处置（2024 年仍是零售剩余食品最大去向，约占
              21%）、市政堆肥收集，以及缺少一体化拆包或数据服务的单一服务废弃物运输商（CM040、CM043）。2024 年行业剩余食品总价值为 $122B（不含消费者餐盘浪费），显示出 Divert
              所定位问题的财务规模（CM045）。零售滞销食品在 2024 年占 398 万吨，代表行业 $26.9B 销售损失——这是预防型服务有说服力的 ROI 锚点（CM004）。居民食品浪费（占总剩余
              33.5%）和农场层面损失（24.2%）不在 Divert 核心范围内，但未来可能成为相邻机会（CM006）。
