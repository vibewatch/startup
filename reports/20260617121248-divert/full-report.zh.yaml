      - number: '6.3'
        title: 具名客户证明——生产部署与结果
        blocks:
          - type: paragraph
            body: >-
              Divert 最强的公开证明集中在六个部署，横跨零售和工业。Giant Food（Ahold Delhaize，MD/VA/DC/DE 共 163 家门店）是记录最充分的锚定客户：项目 2022 年 6
              月启动，到 2025 年 2 月已处理近 8,000 万磅未售出食物——缓解 37,000+ metric tons CO2e，并仅在 2024 年就避免超过 3,500
              万磅食物被浪费——这一结果得到五家独立行业出版物交叉印证，并由 Giant 的运营高级副总裁公开确认。一个未具名、190 家门店的 Mid-Atlantic 杂货连锁从 2017 年起运行 Divert 的
              RFID 逆向物流项目至少五年，实现每店未售出食物吨数可衡量下降 9%。三家未具名 Pacific Northwest 杂货连锁（466 家门店，自 2017 年起）已转移 230,000 tons
              不可食用食物，并向合作农场输送 3,500 万加仑浆料，在有记录的闭环系统中生产可再生电力和有机肥。United States Cold Storage（USCS）——North America
              第三大冷藏仓储商，在 13 个州 40 座设施拥有 424 million cubic feet 容量——于 2025 年 7 月宣布在 California 与 Divert 合作以满足 SB
              1383，并由可持续发展经理 公开发言。Blue Diamond Growers（全球领先杏仁加工商、3,000+ 农民所有者合作社）宣布 2024 年 9 月合作，在 Turlock
              把杏仁加工副产物转化为可再生能源和土壤改良剂，并由可持续负责人公开发言。Albertsons Portland Division 的销售与支持高级总监公开确认，Longview
              设施为其提供「区域内可依赖的一体化有机物转移解决方案」。CEO Ryan Begin 确认 Kroger 的 Compton, CA 配送中心是 Divert 首个重大商业成功，处理来自 330 个 Ralphs
              和 Food 4 Less 地点的食物垃圾。
