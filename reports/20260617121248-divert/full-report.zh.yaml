      - number: '5.5'
        title: 产品与技术风险
        blocks:
          - type: paragraph
            body: >-
              Divert 的产品与技术栈有几类重大风险。第一，微塑料污染：2025 年 Frontiers in Sustainable Food Systems 同行评审研究发现，在一座共消化设施的食物垃圾 AD
              消化残渣中，微塑料浓度为 120 至 3,300+ MP/kg，PET 纤维（与包装残留一致）占主导。研究发现，拆包装质量控制和原料组成直接影响 MP 水平，给 Divert
              的肥料产出带来潜在土地施用责任。ReFED 2026 Food Waste Solutions Summit 的行业小组确认，拆包装产出纯度没有标准化基准，NRDC 也指出该缺口仍未解决。第二，IP
              风险：Divert 声称其拆包装和 AD 流程是「专有」和「高回收」，但未发现专利申请、技术规格或已发布流程数据。竞争壁垒在于运营整合——粘性客户合同、多年数据积累、专有箱体基础设施和同址设施资产——而不是
              IP。第三，capex 与吞吐风险：设施建设出现过延误（Longview 比原目标大约晚两年开业），30 座设施总 capex 未公开。设施从启用到满负荷的吞吐爬坡也没有公开验证。EPA 法规要求 AD
              设施遵守空气、固体废弃物和水许可要求，给每个新选址增加监管复杂度。
