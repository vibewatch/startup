chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与端到端商业模式
        blocks:
          - type: paragraph
            body: >-
              Divert, Inc. 是一家循环经济公司，2007 年成立于马萨诸塞州（CO001），总部位于马萨诸塞州 West Concord（CO002），距 Boston 以西约 20
              英里。公司使命是靠全国性基础设施和创新技术防止食品被浪费（CO003）。经历 19 年行业打磨后（CO006），Divert 已在食品、物流、农业、能源和碳市场交汇处搭出一个差异化的端到端平台（CO008）。

              商业模式围绕 Prevent、Provide、Power® 三段展开（CO004）。Prevent 环节，Divert 部署支持 RFID
              的逆向物流和自研数据分析工具，按月捕捉门店级滞销食品数据，帮助零售商降低损耗、优化采购决策并识别捐赠机会（CO050）。Provide 环节，可食用滞销食品被送往食品银行和 Feeding America
              网络等饥饿救助伙伴，而不是被丢弃。Power 环节，不可捐赠食品被运往 Divert 的 Integrated Diversion & Energy
              Facilities，由自研拆包技术和厌氧消化转成可再生天然气和富营养肥料（CO007）。这套三段式模式服务全美 50
              个州的食品杂货零售商、食品仓库、分销商和食品制造商（CO005）。收入来自与食品零售商和制造商签订的服务合同，覆盖废弃物物流、数据服务、认证销毁和分流；定价和合同结构未公开披露。数据软件、逆向物流基础设施和自有实体处理资产的组合，形成了有意义的转换成本，使
              Divert 有别于单一服务废弃物运输商或纯软件食品浪费平台。
