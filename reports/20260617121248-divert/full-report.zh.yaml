          到 2030 年有 15–20 个运营设施；年化收入 $500–$800M；EBITDA 利润率 15–20%；IRA/45Z 补贴保持完整；RNG 价格 >$15/MMBtu；Mitsubishi 全球 RNG
          出口项目放大；Ara Partners 成功完成基金资本重组
        - $3B–$5B EV（4–7x EV/Revenue；成熟期 15–20x EV/EBITDA）
        - 尚未证明无瑕疵的执行节奏；补贴稳定性不确定；天然气价格逆风；$1.6B+ capex 缺口必须完全补上
        - 低到中——需要政策和资本市场同时持续支持
      - - 基准
        - >-
          到 2030 年运营设施 8–12 座；收入 $150–$300M；EBITDA 接近盈亏平衡；1–2 轮稀释性融资； 部分保留补贴；Enbridge / Mitsubishi 按每年约 2 座设施推进；基准情形与
          Anaergia 轨迹一致
        - $800M–$2B EV（3–6x EV/Revenue；EBITDA 接近盈亏平衡）
        - 优先股资本栈带来稀释；项目许可存在延迟风险；RNG 价格压缩，削弱承购溢价
        - 中 — 最符合已披露执行节奏和机构支持者支撑
      - - 熊市
        - 到 2030 年运营设施 3–5 座；天然气价格持续低位、补贴回撤，压缩 RNG 经济性；行业层面 USDA 消化池违约压力之后，项目融资贷款人撤退，资本缺口坐实；可能出现 down-round 或战略出售
        - $200M–$600M（0.5–1.5x 基础设施重置成本；困境卖方倍数）
        - 消化池甲烷泄漏监管收紧；天然气价格持续低于 $2/MMBtu；USDA 先例传导到私营部门项目融资； Series C 未能完全完成交割
        - 低到中 — 行业层面压力先例已有记录；Enbridge / Mitsubishi 支持降低尾部风险，但不能消除
    notes: 所有估值区间均为基于上市可比公司倍数和已披露交易经济性的估算。Divert 实际收入和 EBITDA 未披露； 这些区间不确定性很高。情景概率信号是定性判断，不是数值概率。
    claimRefs:
      - CV037
