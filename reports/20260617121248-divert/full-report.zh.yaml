      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: Divert 的数据护城河目前无人匹敌
            body: >-
              在所有已识别竞争者中——包括 Vanguard Renewables、Denali、BTS Bioenergy 和 Anaergia——没有一家公开披露了可比 Divert
              门店级损耗报告和库存优化工具、以预防为导向且支持 RFID 的数据分析平台。这一数据层形成嵌入式转换成本，商品化运输或拆包服务无法仅靠压低倾倒费复制。
            calloutType: strength
            claimRefs:
              - CP044
              - CP035
          - type: callout
            title: Denali-Walmart 交易是直接负面信号
            body: >-
              按门店数计，美国最大食品零售商 Walmart 为 1,400 多个网点选择 Denali 的纯拆包模式——这说明更简单、非一体化的替代方案，不需要 Divert 的数据分析、捐赠路由或自有 AD-to-RNG
              基础设施，也能拿下 Fortune 1 级零售体量。这是反驳 Divert“捆绑模式是大型食品杂货买方所必需”这一论点的最强证据。尽调应确认 Walmart 是不是 Divert 当前或潜在客户，以及这笔交易对
              Divert 总可触达账户范围意味着什么。
            calloutType: risk
            claimRefs:
              - CP013
              - CP016
              - CP041
          - type: callout
            title: Vanguard 的 BlackRock 支持扩张轨迹，是 Divert 最严肃的基础设施对手
            body: >-
              Vanguard Renewables 的目标是到 2028 年建成 100 座 AD 设施，而 Divert 的长期路线图是 30 座设施。BlackRock 的资产负债表在背后支撑，Vanguard
              可以更快投放资本，接受更低的近期设施回报来拿下原料合同，并在 Divert 正瞄准的同一批地区做出路线密度。如果 Vanguard 在 Divert
              管线中的设施上线前，先拿下东北部和中西部的食品制造商与零售商原料协议，Divert 单位经济性所依赖的地理网络密度可能会被提前封死。
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP040
              - CP047
          - type: callout
            title: BTS Bioenergy 证实，AD 扩建执行风险遍及全行业
            body: >-
              BTS Bioenergy 的轨迹——四年后只建成一座美国设施、取消 California 项目、出现废水合规问题、1 亿美元资本承诺利用不足——并不是某个运营商管理不善的孤例。它反映的是美国食物垃圾 AD
              开发已被记录下来的现实：资本密集、受许可约束、运营复杂。评估 Divert 的 30 座设施路线图时，投资人应把这一执行风险充分计入其扩建时间表和成本预测。
            calloutType: insight
