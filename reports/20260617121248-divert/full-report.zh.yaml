  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类别
      - EV（USD 约数）
      - EV / Revenue
      - EV / EBITDA
      - 与 Divert 的相关性
      - 关键局限
    rows:
      - - 'Anaergia (TSX: ANRG)'
        - 纯废弃物转 RNG：食物废弃物、MSW、废水；AD 设施；RNG + 肥料产出
        - ~$345M USD（CAD $469M）
        - 2.2x（TTM 收入 CAD $210M）
        - 221x（EBITDA 很薄；2026 Q1 调整后 EBITDA CAD $1.1M）
        - 最接近的上市纯标的：一体化 AD 设施；RNG + 肥料产出；资本销售 + 运营收入；近期 EBITDA 转正
        - 资本销售项目业务不同于 Divert 的服务费 + 长期承购模式；没有食物预防数据层；以 CAD 报告； TTM 收入约 ~$154M USD，Divert 水平未披露
      - - 'Waste Management (NYSE: WM)'
        - 大市值多元化废弃物收集、填埋、回收和 RNG（130+ 座 RNG 设施）
        - ~$110.5B USD
        - 4.4x
        - 15.1x
        - 为成熟规模下的一体化废弃物 + RNG 平台设定上限；约 30% EBITDA 利润率展示废弃物基础设施的长期单位经济性
        - 高度多元且盈利；Divert 仍处 EBITDA 前阶段，应有 0.5–1x EV/Revenue 的私营公司折价； Divert 不具备 WM 的自由现金流画像
      - - 'Republic Services (NYSE: RSG)'
        - 大市值多元化固废收集、回收、环境服务、可持续解决方案
        - ~$78.3B USD
        - 4.7x
        - 15.3x
        - 与 WM 平行；在已验证 EBITDA 的一体化废弃物基础设施上，确认约 4.5–4.7x EV/Revenue； 可持续投资叙事与 Divert 融资故事相似
        - 局限与 WM 相同；4.7x 只适用于盈利已被证明的运营商；EBITDA 前阶段的 Divert 应大幅折价
      - - 'Enviri Corporation (NYSE: NVRI)'
        - 中市值工业 / 环境服务：废弃物管理、工业清洗、合规服务
        - ~$2.23B USD
        - 1.76x
        - 204.7x（很薄；接近盈亏平衡）
        - 为资产密集但 EBITDA 很薄的工业环境服务平台提供低倍数参照；执行不确定性画像相近
        - 商业模式不同（工业服务，不是食物优先的 RNG）；较低倍数反映 Enviri 特定困境因素， 不能泛化；可作为下行边界
    notes: >-
      EV 和倍数数据来自截至 2026 年 6 月的 Yahoo Finance 关键统计页面，以及 Anaergia 2026 Q1 财报发布（CAD 按约 0.74 USD/CAD 折算）。四家公司均为上市公司；Divert
      或其私营同业没有可用的私营可比数据。 WM / RSG 倍数反映成熟且 EBITDA 为正的运营商，套用到 Divert 的 EBITDA 前画像时应折价 30–60%。
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly traded waste management and waste-to-energy companies with accessible Q1 2026 EV/Revenue data; limited
        to four analogs as no direct U.S. food-waste-to-RNG pure-plays are publicly listed; European and Asian AD comps
        excluded; private Divert peers have no disclosed financials.
