          - type: callout
            title: 基础设施融资模型支持扩张，但引入结构复杂度
            body: >-
              Divert 的资本结构——控股型 PE（Ara）、战略股权（Enbridge 约 10%、Mitsubishi Series C）、项目融资（Nuveen 每座设施 $90M+）和长期 RNG 承购收入（BP
              $175M、Mitsubishi 优先承购）——相比纯股权稀释更节省资本，也把投资人激励与设施表现绑定。但多方结构也带来复杂度：每一层资本都有不同回报预期、对 RNG
