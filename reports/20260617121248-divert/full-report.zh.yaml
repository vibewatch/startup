      - number: '7.3'
        title: 消化残渣污染与微塑料风险
        blocks:
          - type: paragraph
            body: >-
              Divert 的端到端模型从拆包装食物垃圾中同时产出可再生天然气和消化残渣 / 土壤改良剂。消化残渣流是关键的第三收入 /
              价值组成部分，公司将其定位为高纯度农业投入品。但把包装食品与塑料包装分离的拆包装流程，会给进入消化器的有机组分带来微塑料风险。拆包装机器对包装食品施力，可能导致 HDPE 和 polypropylene
              等脆性塑料破碎，产生更多微塑料；按 BioCycle 的 NRDC 委托研究，目前没有行业数据说明哪些拆包装方法会产生微塑料，以及每种方法产生多少。

              2025 年发表于 Frontiers in Sustainable Food Systems
              的同行评审研究证实，处理食物垃圾的厌氧共消化系统会累积微塑料，并指出由于有机基质复杂，从消化残渣中分离微塑料存在挑战。这一发现印证了 NRDC/BioCycle
              的担忧：在没有任何监管保护的情况下，土地施用拆包装消化残渣可能把微塑料大规模带入农业土壤。没有标准化测量协议，Divert
              就无法主动向监管机构或客户证明消化残渣纯度；任何州若对土地施用土壤改良剂采用微塑料阈值，都可能实质限制 Divert 的第三收入流。

              BioCycle 小组成员还指出，拆包装设备产生的包装残留通常太脏且太碎，无法回收，因此所有包装最终进入填埋——这与循环经济定位相矛盾；如果各州追踪这股废物流，监管暴露还会增加。Divert
              声称要「为土地施用土壤改良剂的下游纯度设定新标准」（Longview 启用发布），但截至 2026 年中尚未获得独立验证。快速技术部署、缺失标准化协议和各州积极制定规则叠加，使这成为 Divert
              模型中特有、最不确定的风险暴露。
