      - number: '1.3'
        title: 资本历史、投资方与估值
        blocks:
          - type: paragraph
            body: >-
              Divert 前 14 年刻意保持精简资本基础，2007 年至 2021 年累计融资仅略高于 $5M（CO021），让商业模式能在较少投资人压力下打磨。2021 年 Ara Partners 领投 $100M
              增长股权投资，GIC 和 Ontario Power Generation 共同参与，Ara 获得控股权（CO020），局面发生实质变化。首轮机构融资加速了公司设施和技术路线图开发。

              2023 年 3 月，Divert 宣布两笔相互关联的交易：来自 Enbridge 的 $80M 增长股权和 Ara Partners 领投的 $20M（CO022），并叠加 Enbridge 提供的 $1B
              结构化基础设施融资承诺，用于承销全国厌氧消化设施网络（CO023）。Enbridge 同时收购了 Divert 约 10% 股权（CO024）。同期，BP plc 与 Divert 签署约 $175M、为期 10
              年的 RNG 承购协议，覆盖三座设施（CO031），这是美国已知规模最大的食品废弃物消化 RNG 承购交易之一。2025 年 4 月，Nuveen Energy Infrastructure Credit
              投入超过 $90M，专门资助北卡 Lexington 设施（CO025）。

              2026 年 1 月，Wittington Investments 领投一轮未披露金额的新融资，并获得两个新董事席位（CO026）。2026 年 4 月 14 日，Mitsubishi Corporation
              被宣布为 Divert Series C 领投方，将战略股权与优先 RNG 承购安排结合（CO027），把公司估值推高至 10 亿美元以上（CO028）。Series C
              的具体股权融资额尚未公开披露。Mitsubishi 还为北卡设施之外的未来 RNG 产量拿到优先承购权（CO029）。Divert 由此形成的资本结构混合了控股型 PE 所有权、能源领域战略股权、项目融资和长期
              RNG 承购合同（CO030）——这种模式更像基础设施资产所有者，而不是 VC 支持的软件公司；其结构复杂度需要对债权人间协议和优先回报进行尽调。
