          - type: callout
            title: TAM 测算依赖作者估算；没有专门第三方 TAM
            body: >-
              不同于已有成熟分析师覆盖的软件或医疗市场，具体到美国商业食品废弃物分流服务市场，公开渠道没有专门 TAM 估算。本章使用的 $500M–$2B+ 区间，是作者把 EPA 倾倒费数据套用于商业废弃物量，并把 RNG
              和数据服务作为不确定规模的附加层后构建的估算。投资人应把它视为方向性合理性检查，而不是可直接承销的市场规模；在承销 Divert 增长预测前，应委托或要求一份专门市场研究。
