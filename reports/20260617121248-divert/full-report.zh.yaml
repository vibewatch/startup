      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Divert 由 Ryan Begin 和 Nick Whitman 于 2007 年共同创立。Begin 继续担任 CEO，自创立以来一直是公司战略、基础设施愿景和资本叙事的主要设计者（CO009）。创立
              Divert 前，Begin 曾任 Raytheon 高级系统工程师和实验室经理，也曾在 Proton Energy Systems
              担任首席工程师，交付了首套用于燃料电池公交车的零碳氢系统（CO010），为其低碳化叙事提供了深厚可信度。Whitman 担任 COO 近 18 年，除运营外还负责财务、营销、法务、IT
              和融资（CO019），之后于 2025 年 3 月转任董事会席位和战略顾问角色（CO011、CO012）。

              现任 C-suite 包括 COO Bob Watkins（CO013）和 CFO Brad Lukow；Lukow 在 2026 年 4 月前约一年加入，当时公司经历多位高管更替（CO014）。2024 年
              12 月，Divert 任命了四名 VP 级高管：Andrew Johnston（Industrials）、Derek Spillane（IT）、Frenchie Audette（Food Service）和
              Lee DeVasier（Transportation & Supply Chain）（CO018）。这轮快速领导层更新叠加 Whitman 离开运营岗位，构成关键领导层过渡（CO017），而公司正处于 30
              座设施建设的关键阶段；Ryan Begin 仍是唯一持续参与运营的创始人，带来关键人物集中风险。

              Ara Divert HoldCo（Divert 母公司）董事会包括 Nick Whitman（联合创始人）、Ari David（Ara Partners）、Ali Naqvi（Ontario Power
              Generation）、Jim Orlando（Wittington Investments）、Caitlin Tessin（Enbridge）和 Timothy
              Laurion（独立董事）（CO016）。Laurion 于 2024 年 11 月获任，拥有超过 41 年 Bank of America 环境服务投行业务经验（CO015），使董事会能更好地为潜在退出或
              IPO 前的资本市场活动做准备。
