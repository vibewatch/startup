              tone: negative
            - label: 高 — Albertsons Sr. Director 在官方新闻稿中公开发声
              tone: positive
            - label: 低 — 启动 2 个月；评估留存还太早
              tone: negative
    claimRefs:
      - CU004
      - CU006
      - CU010
      - CU013
      - CU016
      - CU017
      - CU018
    approximationNotes: 矩阵评级是分析师基于截至 2026 年 6 月公开可得证据做出的评估。高 / 中 / 低为定性评级。来源独立性评级反映每个部署是否存在 Divert 自有材料之外的佐证。
  - id: FU004
    type: flow
    title: 客户工作流集成流程
    layout: standard
    summary: 六个集成触点把 Divert 嵌入客户运营工作流，形成合同锁定之外的结构性切换成本。
    data:
      nodes:
        - id: n1
          label: RFID 周转箱部署
          detail: 带 RFID 标签的实体可折叠周转箱放置在门店后场或工业装卸区。移除它们需要周转箱退还物流、员工重新培训，并重新部署竞争性收集基础设施——即使合同终止，运营拆解也不轻。
        - id: n2
          label: 逆向物流链集成
          detail: 每日回程运输节奏接入零售商既有配送中心运营（门店 → DC → Divert 设施）。这把 Divert 的提货排期与 DC 排班和用工紧密绑定，替换会扰动运营。
        - id: n3
          label: 月度 RFID 分析与基准
          detail: 月度门店级未售出食物报告会建立不断累积的历史基准。切换会放弃多年趋势对比；要重建等价数据，需要并行收集 12+ 个月。
        - id: n4
          label: Feeding America MealConnect 集成
          detail: Divert 的周转箱数据接入 Feeding America 的 MealConnect 平台，用于识别捐赠机会。断开 Divert 会打断捐赠优化闭环，也会影响零售商与食品银行的关系。
        - id: n5
          label: 合规文档
          detail: 每次服务事件都会出具销毁证明、分流吨数记录和可持续性影响报告。CA、MA 和 WA 的工业客户依赖这套纸面轨迹满足法定合规；替换供应商需要重建等价审计轨迹。
        - id: n6
          label: RNG / 肥料循环闭环
          detail: 设施层面的 RNG 和肥料产出绑定 Divert 特定 AD 设施位置及公用事业互联协议。竞争性设施需要具备相当区位，但考虑到设施许可周期很长，Divert 现有多数地点很难做到。
    claimRefs:
      - CU033
      - CU034
      - CU022
    approximationNotes: null
  - id: FR001
    title: 风险热图 — 可能性 vs. 影响
    type: matrix
    layout: wide
    summary: 按严重程度排序的风险集群，映射评估可能性（列）和对 30 座设施建设论点的潜在影响（行）。单元格内容标出每个严重区域的主要风险。
    approximationNotes: 可能性和影响评级是基于截至 2026 年 6 月已披露证据做出的定性评估。未做概率加权或 Monte Carlo 模拟。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
        - 极高可能性
      rows:
        - label: 关键影响
          values:
            - label: —
              tone: positive
            - label: 关键人物（CEO Begin）离职；CapEx 缺口扩大至 >$1B
              tone: negative
            - label: Enbridge 承诺缩减；融资缺口阻断 >10 个站点
              tone: negative
            - label: —
              tone: positive
        - label: 高影响
          values:
            - label: Longview / Turlock 甲烷超标
              tone: warning
            - label: 拆包微塑料土地施用禁令；COO 空缺未解；BP 包销违约
              tone: negative
            - label: 设施铺开停在 <10 个站点；C-suite 不稳拖延 Series C
              tone: negative
            - label: —
              tone: positive
        - label: 中等影响
          values:
            - label: CA SB 1383 / WA OML 合规摩擦（目前满足）
              tone: positive
            - label: RNG D3 RIN 基差下行；USDA 政策悬而未决；客户集中度不透明
              tone: warning
            - label: 3–10 号站点成本超支；Mitsubishi 包销权到期未行使
              tone: warning
            - label: —
              tone: positive
        - label: 低影响
          values:
            - label: Mass DEP / MA 合规（成熟市场）
              tone: positive
            - label: RFID 数据平台中断；IT 转型风险
              tone: warning
            - label: 各州许可延迟（<12 个月）
              tone: warning
            - label: —
              tone: positive
    claimRefs:
      - CR001
      - CR020
      - CR021
      - CR022
      - CR036
      - CR040
      - CR048
      - CR049
  - id: FR002
    title: 风险传导地图 — 风险如何流向结果
    type: dag
    layout: wide
    summary: 这张有向无环图展示已识别风险源如何沿 Divert 运营和财务模型传导，最终影响收入、利润率和估值结果。
    data:
      nodes:
        - id: capex_gap
          label: CapEx 融资缺口
          description: 18+ 座设施尚未融资；每座都需要独立项目融资事件
        - id: microplastics_reg
          label: 微塑料 / 消化残渣监管
          description: 没有标准协议；州层面规则制定活跃；土地施用限制存在可能
        - id: rng_policy
          label: RNG 政策 / D3 RIN 风险
          description: USDA 暂停延长；45Z 抵免 / D3 RIN 基差暴露于联邦政策逆转
        - id: leadership_risk
          label: 领导层 / 执行风险
          description: COO 空缺；CFO 任职约 1 年；2024 年 12 月新聘 4 位 VP；建设高峰期重组 C-suite
        - id: customer_conc
          label: 客户集中度不透明
          description: 头部食品杂货链收入占比未披露；合同条款未公开
        - id: facility_buildout
          label: 设施铺开执行
          description: 30 座设施中 28 座尚未运营；许可、施工、爬坡各自都是风险事件
        - id: rng_revenue
          label: RNG 收入流
          description: 能源销售给 BP 和未来包销伙伴；4–30 号设施尚无覆盖
        - id: service_fee_revenue
          label: 服务费收入
          description: 来自 7,800+ 个地点的处置费；为 AD 设施提供原料
        - id: digestate_revenue
          label: 消化残渣 / 土壤改良剂收入
          description: 第三条收入流；若微塑料监管收紧，将直接受冲击
        - id: project_finance
          label: 项目融资可得性
          description: 每座新设施需要 Enbridge 提款 + 共同贷款方；上游风险事件会削弱可得性
        - id: valuation
          label: 估值 / IRR 结果
          description: Series C 估值；投资者回报；依赖多收入流设施经济性
      edges:
        - from: capex_gap
          to: facility_buildout
          label: 未融资设施无法破土动工
        - from: microplastics_reg
          to: digestate_revenue
          label: 土地施用限制削弱第三条收入流
        - from: rng_policy
          to: rng_revenue
          label: D3 RIN 下行或 45Z 废除压缩 RNG 利润率
        - from: leadership_risk
          to: facility_buildout
          label: COO 空缺和 C-suite 不稳拖慢许可 / 运营爬坡
        - from: customer_conc
          to: service_fee_revenue
          label: 锚定客户流失减少服务费体量和 AD 原料
        - from: customer_conc
          to: facility_buildout
          label: 原料中断破坏设施吞吐经济性
        - from: facility_buildout
          to: project_finance
          label: 执行风险抬高未来设施资金成本
        - from: rng_revenue
          to: valuation
          label: RNG 收入是高于服务费基线的差异化溢价
        - from: service_fee_revenue
          to: valuation
          label: 服务费体量支撑基准情形 DCF
        - from: digestate_revenue
          to: valuation
          label: 第三条收入流提供上行；流失会拖累设施 IRR
        - from: project_finance
          to: valuation
          label: 融资条款决定 IRR 底线；条款收紧会压缩股权回报
    claimRefs:
      - CR020
      - CR021
      - CR027
      - CR031
      - CR036
      - CR044
      - CR049
      - CR050
  - id: FR003
    title: 依赖关系图 — 关键伙伴、融资与基础设施
    type: dag
    layout: wide
    summary: Divert 运营与财务模型的关键依赖，呈现融资伙伴、承购交易对手、监管机构与运营基础设施之间的关系。
    data:
      nodes:
        - id: divert
          label: Divert, Inc.
          description: 平台所有者；管理数据层、物流、拆包、厌氧消化（AD）和产出销售
        - id: ara_partners
          label: Ara Partners（控股 PE）
          description: 控股股权；董事会治理；Fund III 为 2023 年份基金；退出窗口约 2027–2030
        - id: enbridge
          label: Enbridge（~$1B，10% 股权）
          description: 主要项目融资额度；股权持有人；Longview 基础设施伙伴
        - id: nuveen
          label: Nuveen Energy Infrastructure Credit
          description: 为北卡 Lexington 提供 $90M+；未来设施项目融资的模板
        - id: mitsubishi
          label: Mitsubishi Partners（Series C）
          description: Series C 股权；对 Lexington 之后设施享有优先承购权
        - id: bp
          label: BP（RNG 承购）
          description: 3 座现有设施的约 $175M / 10 年承购协议
        - id: cascade_ng
          label: Cascade Natural Gas
          description: Longview RNG 注入的管道互联；华盛顿州收入的单点依赖
        - id: epa_state_reg
          label: EPA / 州监管机构
          description: 每座设施都需要空气、固废和水许可；各州独立审批
        - id: grocery_anchors
          label: 核心杂货零售商
          description: Kroger、Ahold/Giant、Albertsons、Safeway — 主要原料与服务费来源
      edges:
        - from: ara_partners
          to: divert
          label: 控股股权；战略治理
        - from: enbridge
          to: divert
          label: $1B 项目融资额度 + 10% 股权
        - from: nuveen
          to: divert
          label: $90M+ Lexington 项目融资
        - from: mitsubishi
          to: divert
          label: Series C 股权 + 未来承购优先权
        - from: divert
          to: bp
          label: 10 年承购下的 RNG 供应（3 座设施）
        - from: divert
          to: cascade_ng
          label: RNG 注入 — Longview 管道互联
        - from: epa_state_reg
          to: divert
          label: 单站点均需许可；USDA 政策悬而未决
        - from: grocery_anchors
          to: divert
          label: 原料供应 + 服务费收入
    claimRefs:
