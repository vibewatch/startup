      - number: '3.2'
        title: 竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Vanguard Renewables 成立于 2014 年，2022 年被 BlackRock 收购，就商业模式而言是 Divert 最接近的公开类比对象（CP001）。公司在美国八个州运营 32 个 AD
              站点，项目管线 68 个，目标到 2028 年底达到 100 座设施，并由 BlackRock 资本基础支持（CP003、CP004）。Vanguard 与 Divert
              的差异在于农场共消化——把食品废弃物原料与农业粪肥混合，拓宽原料来源，不局限于纯零售废物流——以及碳咨询业务，帮助食品制造商应对 LCFS 和自愿 RNG 市场（CP010、CP007）。公司与
              AstraZeneca 签署了美国规模最大的自愿 RNG 承购交易之一，与 Divert 的 BP 交易属同一类别（CP008、CP046）。Vanguard 已四次部署 Anaergia 技术，最近一次是
              2026 年 4 月签署一份 C$8M 合同，用于明尼苏达设施（CP005、CP006）。关键在于，Vanguard
              没有以预防为导向的数据分析平台；其市场打法更像传统废弃物公司，按市场逐个扩张，在运输半径内推进（CP009、CP044）。

              Denali 自称是美国按体量计最大的有机物回收商，每年通过 40 多座拆包设施网络回收超过 10 亿磅，这些设施可从有机食品废弃物中分离最高 97% 的垃圾（CP011、CP012）。其 2024 年 7 月与
              Walmart 的合作覆盖 16 个市场的 1,400 多个 Walmart 和 Sam's Club 网点，预计每年产生 5 亿磅有机物，约每个网点 200,000 磅（CP013、CP014）。Denali
              把回收有机物送往动物饲料、堆肥、肥料和第三方 AD，而不是自有基础设施，也不自己生产 RNG（CP015）。Walmart 交易体现出一个结构性负面点：没有自有 AD
              或预防分析、专注拆包的运营商，也能在规模上拿下大型零售账户，切分 Divert 目标中的同一批食品杂货原料（CP016、CP041）。

              Anaergia Inc.（TSX: ANRG，OTCQX: ANRGF）是一家位于安大略省 Burlington 的技术公司，提供一体化废弃物价值化方案，包括 AD 系统、RNG
              提纯和废水处理（CP017）。2026 年 Q1，Anaergia 报告收入 CAD $55.2M（同比增长 122%）、毛利率 23.0%，并连续第三个季度实现正 Adjusted
              EBITDA（CP018、CP019、CP021）。收入积压订单达 CAD $265M，同比增长 32%（CP020）。公司持有数百项专利，将自己定位为轻资产技术许可方和 O&M 承包商；截至 2025 年 12
              月，总资产 CAD $247.4M，负债 $193.2M（CP022、CP023、CP024）。Anaergia 主要是 Vanguard
              等运营商的技术赋能方，而不是直接面向零售的服务竞争者，但其规模和专利组合使其可能成为战略收购方，或成为绕开中间商的技术许可方（CP042）。

              BTS Bioenergy（前 Bioenergy DevCo，2025 年 5 月更名）背靠欧洲母公司 BTS Biogas 自 1996 年以来 250
              多座设施的履历，但在美国只完成了一座设施：Maryland Bioenergy Center，2021 年开业，年处理能力 125,000 公吨（CP025、CP026）。该设施 2024 年出现 Howard
              County 废水预处理合规失败，被迫压降吞吐量（CP027）。BTS 因找不到可行经济性，于 2025 年初取消拟建的加州 Long Beach 项目（CP028）。Irradiant Partners
              2021 年承诺超过 $100M，但设施开发进展有限；Hannon Armstrong 2023 年投入 $30M，主要用于改善 Maryland 站点（CP029）。在 CEO Nick Thomas（2024
              年 5 月从天然气行业加入）带领下，BTS 现在瞄准 Delaware 鸡粪 AD 扩张和 Georgia Gainesville 设施（CP030）。BTS 的轨迹是美国 AD
              建设执行风险的警示性数据点，也与评估 Divert 30 座设施路线图广泛相关（CP043、CP048）。

              Mill Industries 与 Amazon 旗下 Whole Foods Market 合作，计划从 2027 年开始试点店内 AI
              食品废弃物处理系统，把食物残渣转成供自有品牌鸡蛋供应商使用的鸡饲料（CP031）。Mill 的 AI
              和计算机视觉工具实时追踪废弃物类型和体量，为零售商提供上游预防洞察；系统把去中心化基础设施嵌入门店，而不是把废弃物运到场外。虽然 Mill 所处价值链位置不同于
              Divert——瞄准上游店内处理并转为动物饲料，而不是 AD-to-RNG——但它提供了一条替代路径，可能减少 Whole Foods 体系零售商进入 Divert
              逆向物流网络的可捐赠和可消化食品量（CP039）。
