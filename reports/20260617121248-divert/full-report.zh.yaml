      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Divert 已搭起规模可观的多工具融资栈。Series C 前股权融资至少 $200M：2021 年 $100M（Ara Partners、GIC、Ontario Power
              Generation，CI027），2023 年 $100M（Enbridge $80M、Ara $20M，CI028）。2026 年 4 月 Mitsubishi 领投的 Series
              C（CI031）金额未披露，但把公司估值推到 $1B+。已承诺项目融资包括 Enbridge 面向 30 座设施建设的 $1B 基础设施开发协议（CI029），以及 Nuveen Energy
              Infrastructure Credit 仅为 Lexington, NC 设施提供的 $90M+（CI030）。Ara Partners 确认 Divert
              是其私募股权加基础设施投资组合公司（CI050）；TIAA 关联的 Nuveen 带来 $1.3T+ AUM 的机构可信度，支撑项目融资计划（CI056）。

              充足性缺口很大。30 座设施按每座 $90M+ 计算，总 capex 达 $2.7B+（CI033）。相对于 $1.09B+ 已承诺项目融资和未披露的 Series C 基础，大约 18
              座设施仍未获得资金（CI034）。现金余额、月度 burn rate 和 runway 未披露；2024 年 23% 人员增长和四名高级 VP 入职，说明管理费用仍在加速（CI015、CI036）。bp 的
              $175M 承购承诺（CI035）提供收入可见度，但不是股权。Keyera Corp 的 2025 Annual Information Form 是一份 SEDAR+
              监管文件，记录了基础设施级项目融资内在的复杂信贷契约、抵押品要求和再融资风险——这些风险很可能与 Divert 设施层债务条款相似（CI047）。Anaergia 2026 年 Q1 结果显示，扣除 D&A
              和融资成本后，正 Adj. EBITDA 也不能消除净亏损，凸显资产密集型 AD 模型常见的长回本周期（CI040、CI041）。
