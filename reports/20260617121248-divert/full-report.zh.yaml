      - number: '5.2'
        title: RFID / 数据层与逆向物流
        blocks:
          - type: paragraph
            body: >-
              数据层是 Divert 最差异化的软件资产。专有 RFID 标签箱放在零售门店后场；未售出食物在门店层面分拣入箱，RFID 平台每月按部门捕捉门店特定的浪费数据。这种门店级颗粒度让 Divert
              的客户成功团队能够交付根因分析、基准对照和面向部门的共同培训——这条反馈回路会随时间主动减少浪费产生。一个覆盖 190 家门店的 Mid-Atlantic 杂货连锁五年 RFID 案例研究显示，未售出食物吨数下降
              9%。逆向物流系统用可折叠箱统一收集，回程运至零售商配送中心，再转运到 Divert 加工设施。在一项有记录的 Pacific Northwest 部署中，466+
              家杂货店的不可食用食物每天被收集并汇总，然后送达设施。Divert 与 Feeding America 自 2018 年起合作，覆盖 38 个州 13 家主要零售商，叠加了一层捐赠优化：把 Divert
              的箱体数据与 Feeding America 的 MealConnect 平台结合，让捐赠最多提升 20%。NRF 2026 的行业从业者确认，杂货场景中的 RFID 已从理论走到「ROI 问题」，强化了
              Divert 数据层的采用顺风。
