      - number: '2.3'
        title: 买方与细分格局
        blocks:
          - type: paragraph
            body: >-
              Divert 的买方基础分为四个主要商业细分和一个资本市场层级。食品杂货零售商是核心；Divert 在全国服务约 7,800 个客户网点，并披露了与 Giant Food（Ahold Delhaize
              USA）、Safeway Northern California
              等大型连锁的合作（CM021、CM024）。预算权掌握在可持续负责人和运营副总裁手中，他们受监管合规、成本节省（一家普通食品杂货店每天可能因食品浪费损失约 $40,000 利润）和 ESG
              报告指标驱动（CM025、CM053）。基于 RFID 的数据分析层能带来可衡量的损耗下降——一家拥有 190 家门店的大西洋中部零售商五年内将滞销食品吨数减少 9%——从而强化面向买方的 ROI
              叙事（CM052）。

              工业食品客户（制造商、加工商）是增长最快的细分；Divert 2024 年进入仓库、配送中心和制造领域，新增 Blue Diamond Growers（杏仁加工副产品）和 United States Cold
              Storage（CM026）。预算归属转向工厂可持续经理和采购，他们看重认证销毁、品牌完整性和物流简单性。在一个有记录的闭环基础设施案例中，三家食品杂货连锁客户自 2017 年以来从超过 466
              家门店分流废弃物，避免约 230,000 吨不可食用食品进入填埋场（CM023）。

              餐饮服务运营商（餐馆、机构、酒店）相邻但不是主要重点；2024 年堆肥占餐饮服务剩余食品去向的
              58%，依托既有市政基础设施仍是主导路径（CM027）。基础设施资本层——Enbridge、Mitsubishi、Ara Partners——属于另一类买方（资本共同投资人），他们需要 RNG
              承购经济性和项目融资回报，而不是服务合同 ROI（CM019）。对所有买方细分而言，Divert 的端到端捆绑模式通过 RFID
              部署、数据集成和运营协同培训形成有意义的转换成本，使其有别于单一服务运输商或纯软件平台（CM028）。
