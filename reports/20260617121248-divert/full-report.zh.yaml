      - number: '2.2'
        title: 市场规模：多重视角与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              目前没有公开可得的第三方 TAM 估算，专门覆盖 Divert 所服务的美国商业食品废弃物分流服务市场。三种不同视角给出的估算差异很大，本文保留全部结果及其局限。

              最宽的视角来自 MarkNtel Advisors 跟踪的全球厌氧消化市场：2025 年全球价值为 $64.24B，预计到 2032 年达到 $103.1B，CAGR 为 6.86%；北美约占 42%
              份额（2026 年约 $29B）（CM007、CM008）。该估算覆盖农业粪肥、市政生物固体和工业有机物等所有有机原料，严重高估了 Divert 的可服务市场；但它确认了 AD 基础设施投资的长期需求。

              更窄的视角从 ReFED 发布的食品损失价值指标出发：2024 年剩余食品总价值 $380B，其中 $122B 来自行业部门损失（零售 + 制造 + 餐饮服务，不含消费者餐盘浪费），$26.9B
              仅反映零售部门销售损失（CM003、CM045、CM004）。这些是废弃物成本指标，不是服务收入估算，但凸显了投资分流的财务动机。

              最扎实但也最受约束的视角，是使用 EPA 倾倒费数据和商业废弃物量做自下而上估算。EPA 对 2022–2023 年 AD 设施的调查显示，全国独立食品废弃物消化设施平均倾倒费为每吨 $32.27，中位数为每吨
              $22.23（CM014）。把这些费率套用于估计 800–1,600 万吨可商业服务、目前仍被填埋的食品废弃物，可得物流和处理服务收入 TAM 约为每年 $240M–$500M，不包括 RNG
              货币化、数据服务和认证销毁溢价（CM015）。加入这些收入层后，估算扩大至 $500M–$2B+ 区间（CM016）。另一种相冲突解读——直接套用北美 AD 市场基准——会显示市场大几个数量级，但它没有扣除 AD
              市场中 90%+ 并非商业食品废弃物分流服务可触达的部分（CM050、CM051）。Enbridge 对 Divert 30 座设施建设的 $1B
              基础设施承诺，隐含验证了资本市场将其视为数十亿美元级基础设施机会，即便年度服务收入 TAM 更小（CM019）。
