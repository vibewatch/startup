      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Divert 的收入质量在结构上可信：多年服务合同通过 RFID 平台整合嵌入切换成本，bp 和 Mitsubishi 的 RNG 承购协议则在设施层面提供前瞻收入确定性。2024 年处理量增长 52%、地点扩张
              22%，是强劲的商业动能代理指标（CI013、CI012）。Avery Dennison/CEBR 预计全球食物浪费成本到 2026 年达 $540B/yr（CI049），AD 市场到 2032 年 CAGR 为
              6.86%（CI051），支撑长期定价和合同续约假设。

              但公司完全不披露收入、利润率、EBITDA 和现金头寸，导致外部无法做出有意义的独立财务承销（CI044）。资本强度是核心风险：30 座设施建设需要 $2.7B+
              capex（CI033），大幅超过当前已披露承诺；每座新设施都依赖连续项目融资交割、监管许可、原料协议和 RNG
              承购交易（CI034）。拆包装监管不确定性和微塑料合规暴露（BioCycle，CI045、CI046）可能带来未预见的成本逆风。Anaergia 2026 年 Q1 在正 Adj. EBITDA
              下仍持续净亏损，说明资产重 AD 模型有结构性的 D&A
              和融资拖累（CI040）。头部杂货连锁客户收入集中度未披露（CI048）。财务结论是：收入模型设计良好，利润率路径有可信度，但资本强度很高，信息不透明构成尽调阻断缺口；在可建立可辩护估值前，必须通过 NDA
              获得设施层 P&L、每吨成本数据、现金消耗和具体承购经济性。
