            body: >-
              Divert 2026 年 4 月的独角兽估值可信，且获得多方验证：超过 $1B 的门槛由 Mitsubishi Corporation 领投 Series C 达成，旁边还有 Enbridge（约 10%
              股权）、Ontario Power Generation、Wittington Investments 和 Nuveen Energy Infrastructure Credit，Ara Partners
              继续保持控股型 PE 支持。PE 治理、能源基础设施专业能力，以及 BP（约 $175M）和 Mitsubishi（优先权）承诺的 RNG
              承购，共同形成收入支撑的估值基础；在同代循环经济公司中，这种结构并不常见，也显著降低了规模化收入模型风险。
