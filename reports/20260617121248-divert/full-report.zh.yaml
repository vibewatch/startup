      - number: '6.5'
        title: 客户集中度、扩张机会与不利信号
        blocks:
          - type: paragraph
            body: >-
              Divert 的客户集中度在结构上不透明。公司未披露单客户收入或处理量份额；唯一公开信号是汇总地点数和五家 Fortune 100 企业。两组最大具名企业关系——Kroger（Ralphs、Food 4
              Less、Fred Meyer）和 Ahold Delhaize USA（Giant Food、Stop &
              Shop、Hannaford）——各自覆盖多个区域品牌，几乎肯定贡献了不成比例的处理量。任何一组关系终止都会造成财务重大影响，且没有内部数据无法量化。零售商预算压力是反复出现的客户侧风险：杂货零售净利率只有
              1–3%，可持续项目支出在利润率压缩周期中历来最先被削减；Divert 部分缓解了这一点，因为其服务替代的是现有处置费支出，而不是新增纯成本，监管命令也在覆盖州创造需求底线。

              扩张端，向工业垂直多元化能降低零售集中风险，但仍处早期：具名客户只有 USCS（截至 2025 年 Q3 仅 California）和 Blue Diamond（仅 Turlock CA）。U.S. Food
              Waste Pact 数据显示，堆肥仍占零售食物垃圾去向的 21.9%，而 AD 为 14.5%（2024 ReFED 数据），说明 Divert 组合外的大多数零售产生方选择了替代路径。一个新兴竞争工作流是
              Mill Industries 与 Amazon 合作，计划到 2027 年在 Whole Foods Market 部署店内食物处理；如果成功，这种去中心化模型可能限制 Divert
              在高端杂货中的可服务市场。Divert 的场外模型能处理店内系统无法处理的全部食物形态和包装类型，限制了直接替代，但这一竞争信号值得跟踪。
