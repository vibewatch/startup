      - number: '7.2'
        title: 监管、许可与 RNG 政策风险
        blocks:
          - type: paragraph
            body: >-
              Divert 计划中的 30 座设施，每一座都需要围绕空气质量、固体废弃物和水排放取得独立场地级许可，并遵守适用于所有厌氧消化器类型的 EPA 指引。Divert 称 Longview, WA
              设施是「十多年来首个通过 Washington state 西南部环境审查流程的工业项目」，释放出流程耗时的信号。Lexington, NC 于 2025 年 4 月破土，Nuveen 融资已确认，但
              Harrison, OH 的许可完成情况和时间表尚未公开披露。

              拆包装专项监管是新兴风险向量。截至 2025 年底，BioCycle 发现其调查的 24 个州中有 23
              个缺少针对食物垃圾拆包装的具体监管框架。Maryland、Michigan、Pennsylvania、Vermont 和 Washington 正在积极起草拆包装规则；Vermont
              的流程显示，即使是「notification」模型，也可能演变成实质性运营要求。拆包装食物垃圾或下游消化残渣中的微塑料没有标准化测量协议，留下关键数据缺口；一旦未来标准设定，公司会暴露于追溯合规要求。

              RNG 政策方面，USDA 将厌氧消化器贷款担保暂停延长至 2026 年 12 月 31 日；Earthjustice 同时针对 USDA 隐瞒资助记录提起 FOIA 诉讼。该联盟包括 30+
              个组织，要求永久把粪肥消化器排除在 REAP 之外。重要的是，Divert 处理的是食物垃圾，不是粪肥，因此部分隔离于主要政策目标。但更广泛的反 RNG 倡议联盟（CLF、Farm Forward、Friends
              of the Earth）基于气候理由反对所有捕获甲烷的消化器，联邦生物燃料政策变化——包括取消沼气发电的 REAP 资格——也会制造 D3 RIN 基差风险。Trump 时代的「One, Big,
              Beautiful Bill」延长了对沼气有利的税收抵免，但政策方向波动很大。
