            body: >-
              Divert 的基础设施战略要求建设 30 座 Integrated Diversion & Energy Facilities，选址要能覆盖美国 80% 人口 100 英里以内。当前状态是：Turlock,
              CA 已运营（2024 年启用）；Longview, WA 已运营（2026 年 4 月启用）；Lexington, NC 于 2025 年 4 月破土，获得 Nuveen Energy
              Infrastructure Credit 超过 $90 million 融资；Harrison, OH 于 2024 年宣布。Longview 设施是十多年来首个通过 Washington State
              西南部环境审查流程的工业项目，说明许可可以拿到，但速度很慢。Enbridge RNG 基础设施合作提供 $1 billion 项目融资工具来支撑建设；Mitsubishi Corporation 于 2026 年
              4 月提供额外战略资本。按目前大约每年一到两座的开业速度，对比 30 座设施目标，意味着当前轨迹下建设周期为 15–20+ 年。单座设施 capex 未公开，但 Lexington 设施
              $90M+、Longview 设施约 $100M（Enbridge 联合融资）提供了数据点；总建设 capex 是重大尽调缺口。
