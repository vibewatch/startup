  - id: capital-adequacy-and-financing
    title: Capital Adequacy and Financing Dependency
    body: >-
      Divert has assembled a substantial multi-instrument financing stack. Equity rounds total
      at least $200M pre-Series C: $100M in 2021 (Ara Partners, GIC, Ontario Power Generation,
      CI027) and $100M in 2023 ($80M Enbridge, $20M Ara, CI028). The April 2026 Mitsubishi-led
      Series C (CI031) is undisclosed in amount but elevated the company valuation to $1B+.
      Committed project finance includes Enbridge's $1B infrastructure development agreement
      (CI029) targeting the 30-facility buildout, plus Nuveen Energy Infrastructure Credit's
      $90M+ for the Lexington, NC facility alone (CI030). Ara Partners confirms Divert's
      portfolio position as a private equity plus infrastructure investment (CI050); TIAA-linked
      Nuveen brings $1.3T+ in AUM institutional credibility to the project finance program
      (CI056).

      The adequacy gap is significant. Thirty facilities at $90M+ each implies $2.7B+ in total
      capex (CI033). Against $1.09B+ in committed project finance and an undisclosed Series C
      base, roughly 18 facilities remain unfunded (CI034). Cash on hand, monthly burn rate, and
      runway are not disclosed; 23% headcount growth and four senior VP hires in 2024 signal
      ongoing overhead acceleration (CI015, CI036). The bp $175M offtake commitment (CI035)
      provides revenue visibility but is not equity. Keyera Corp's 2025 Annual Information Form,
      a SEDAR+ regulatory filing, documents the extensive credit covenant structures, collateral
      requirements, and refinancing risks inherent to infrastructure-scale project finance—risks
      that likely parallel Divert's facility-level debt terms (CI047). Anaergia's Q1 2026 results
      show that positive Adj. EBITDA does not eliminate net losses once D&A and finance costs are
      included, underscoring the long payback periods typical of asset-intensive AD models
      (CI040, CI041).
