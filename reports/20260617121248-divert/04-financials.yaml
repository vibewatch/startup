chapter:
  number: 4
  title: Financials
  summary: >-
    Divert's revenue model combines recurring retailer service fees, long-term RNG offtake
    agreements (including a ~$175M, 10-year bp deal and Mitsubishi preferred offtake rights
    from the April 2026 Series C), and nascent fertilizer revenue, yet all revenue figures,
    margins, and cash position remain undisclosed. The company has assembled over $1.09B in
    committed project finance (Enbridge $1B infrastructure agreement, Nuveen $90M+) plus
    $200M+ in equity pre-Series C, but building out 30 facilities at ~$90M+ each implies
    a total capex requirement of $2.7B+, leaving a meaningful funding gap against disclosed
    commitments. Revenue quality is structurally credible given contractual lock-in and
    long-duration offtake, but the complete absence of public financial disclosure makes
    underwriting impossible without NDA-level access to facility-level P&Ls and cost data.

sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing
    body: >-
      Divert operates a multi-stream revenue model anchored in the Prevent, Provide, Power®
      platform (CI001). The primary commercial lever is service fees paid by food retailers,
      manufacturers, warehouses, and distributors for reverse logistics, RFID-enabled data
      analytics, certified destruction, depackaging, and donation optimization (CI002). With
      7,800+ customer locations across all 50 states (CI011) and named accounts spanning
      Kroger, Albertsons, Ahold Delhaize, Safeway, Target, and CVS (CI016), service fees
      constitute the volume anchor of the revenue model. Specific contract pricing is not
      publicly disclosed (CI006), but the model displaces traditional landfill tipping fees
      of $50–$150/ton (CI023), giving Divert structural pricing power: even at a discount
      to tipping-fee parity, customers see 30–45% disposal cost savings (CI024).

      The second stream is renewable natural gas sold under long-term offtake agreements.
      Divert disclosed a ~$175M, 10-year bp deal covering three specific facilities (CI003),
      implying roughly $5–6M per facility-year of RNG revenue. Mitsubishi's preferred RNG
      offtake rights from the April 2026 Series C extend this into Japan and global energy
      networks (CI004). Longview, WA produces up to 235,000 MMBtu/yr of RNG at full
      capacity (CI020), connected directly to Cascade Natural Gas pipeline (CI026).
      Fertilizer and soil amendment sales represent a third stream referenced in facility
      releases but not quantified (CI020). Revenue recognition risk is non-trivial: service
      fees likely accrue ratably while RNG revenue depends on facility operational ramp
      (CI009). The mix between service fees and energy revenue is undisclosed; service fees
      are likely dominant given that only two owned AD facilities were operational as of
      mid-2026 (CI025, CI010).
    claimRefs:
