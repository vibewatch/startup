  - id: gtm-and-sales-efficiency
    title: GTM Motion and Sales Efficiency
    body: >-
      Divert's go-to-market model is a direct enterprise sales motion targeting national and
      regional grocery chains, food manufacturers, warehouses, and logistics operators (CI007).
      The company serves five Fortune 100 companies (CI008); named anchor accounts include
      Kroger, Albertsons, Ahold Delhaize systems (Stop & Shop, Giant, Hannaford), Safeway,
      Target, CVS, and Harris Teeter (CI016). Classic sales efficiency metrics—CAC, payback
      period, quota attainment, and NRR—are not disclosed.

      The strongest available sales productivity signals are 22% customer location growth
      in 2024 (CI012) and 52% volume growth to 630M lbs processed (CI013). Four VP-level
      commercial hires in December 2024—covering industrials, food service, IT, and supply
      chain (CI015)—signal active capacity investment ahead of facility scale. Repeat-service
      and multi-year contract structures are evidenced by Giant Food's full 165-store rollout
      delivering a 9% waste reduction over five years (CI018), and by USCS's ongoing
      California partnership leveraging the Turlock facility for SB 1383 compliance (CI054).
      Feeding America integration into the donation-optimization bundle further enhances
      retailer account stickiness (CI053). Customer concentration among top grocery chains
      is undisclosed, but named accounts span multiple regional banners across Kroger and
      Ahold Delhaize systems (CI048), suggesting geographic diversification within retail.
    claimRefs:
