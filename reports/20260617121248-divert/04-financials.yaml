callouts:
  - calloutType: risk
    title: Capital Adequacy Gap — Structural Financing Dependency
    body: >-
      Divert's 30-facility buildout requires an estimated $2.7B+ in total capex. Against
      ~$1.09B+ in committed project finance and an undisclosed Series C equity raise,
      approximately $1B–$2B of additional capital must be raised through serial project
      finance closes and future equity rounds over 2026–2031. Each close requires regulatory
      permits, feedstock agreements, and RNG offtake contracts, making execution speed
      directly contingent on capital market conditions and strategic partner availability.
      A capital market dislocation could impair the expansion timeline materially.
    claimRefs:
      - CI029
      - CI030
      - CI033
      - CI034
      - CI036

  - calloutType: risk
    title: Revenue and Margin Opacity — Underwriting Blocker
    body: >-
      Divert discloses no revenue, ARR, gross margin, EBITDA, or cash flow data. With a
      private company status and no public filing obligation, all financial underwriting
      depends entirely on management-provided information accessible only under NDA.
      The Anaergia public-comp benchmark (23% gross margin, continued net losses despite
      positive Adj. EBITDA) illustrates that asset-intensive AD models can achieve
      gross-margin viability while still generating significant net losses due to depreciation
      and project-finance costs. Without access to Divert's actual P&Ls, any financial model
      carries material estimation risk that cannot be independently validated.
    claimRefs:
      - CI038
      - CI040
      - CI041
      - CI044
      - CI047

