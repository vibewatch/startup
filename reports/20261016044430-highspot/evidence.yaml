evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure-disclosure
    missingEvidence: >-
      Current valuation, lifetime capital raised, debt or credit facilities, and any secondary transaction details for
      Highspot.
    whyItMatters: >-
      Capital structure and valuation are core inputs for ownership, dilution, and return analysis, and they materially
      affect the investment case.
    diligencePath: >-
      Request the latest cap table, financing history, board materials, and any investor or lender communications
      covering the Seismic combination.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: headquarters-and-entity-structure
    missingEvidence: >-
      A fresh post-merger disclosure confirming Highspot's legal-entity structure and whether Seattle remains its
      principal operating hub within San Diego-headquartered Seismic.
    whyItMatters: >-
      Operating geography and entity structure affect management access, tax/legal diligence, and how later chapters
      interpret customer, hiring, and regulatory evidence.
    diligencePath: >-
      Request current corporate-entity charts, office footprint summaries, and post-close integration materials from
      Seismic and Highspot management.
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-roster
    missingEvidence: >-
      A complete post-close board, executive roster, reporting structure, and retention terms for legacy Highspot
      leaders.
    whyItMatters: >-
      The two named leaders establish top-level control but do not show whether product, engineering, sales, and
      customer-success accountability remains concentrated or has changed.
    diligencePath: >-
      Request the post-close organization chart, board roster, employment and retention arrangements, and executive
      decision-rights matrix.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-history
    missingEvidence: >-
      Publicly dated financing, leadership-change, and partnership milestones before 2020 and between February and
      August 2026.
    whyItMatters: >-
      The visible timeline is good enough to anchor current-state analysis, but it is too sparse to prove a full
      historical cadence across financing and governance events.
    diligencePath: >-
      Pull archived newsroom pages, investor announcements, and board-approved chronology materials to extend the
      milestone record.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: public-market-sizing
    missingEvidence: >-
      Independent public TAM, SAM, or SOM estimates for revenue enablement or GTM performance that isolate segment,
      geography, and methodology.
    whyItMatters: >-
      Without an external market-size anchor, the chapter can only use installed-base and adoption proxies instead of a
      defensible dollar opportunity range.
    diligencePath: >-
      Add retained analyst, filing, or trade-association market data that explicitly sizes revenue enablement or GTM
      performance by scope and geography.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-budget-ownership
    missingEvidence: Transparent public pricing, packaging, or budget-owner disclosure by segment.
    whyItMatters: >-
      Pricing opacity prevents clean conversion from user or customer counts into revenue opportunity and weakens
      buyer-budget precision.
    diligencePath: >-
      Obtain customer-facing pricing collateral, procurement records, or management disclosure showing package
      structure, seat assumptions, and budget ownership.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized per-seat pricing, discounting, implementation fees, and contract lengths by segment.
    whyItMatters: >-
      Without realized economics, buyers cannot convert public packaging into an apples-to-apples total-cost comparison
      against Seismic, Showpad, Guru, or internal build.
    diligencePath: Request current order forms or buyer references with seat counts, module mix, services fees, and term lengths.
    relatedQuestionRefs:
      - QP003
  - type: missing-source
    severity: material
    topic: merger-roadmap
    missingEvidence: >-
      Public migration roadmap, SKU rationalization plan, overlap resolution, and customer retention terms after the
      Seismic merger.
    whyItMatters: >-
      Combined scale can strengthen the moat, but unresolved overlap or forced migration could raise switching risk for
      buyers evaluating the platform now.
    diligencePath: >-
      Obtain roadmap briefings, migration commitments, and renewal-language examples from Seismic or Highspot account
      teams.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: competitive-win-loss
    missingEvidence: >-
      Independent head-to-head win-loss, churn, or multi-homing evidence versus Seismic, Showpad, Guru, and lighter
      internal stacks.
    whyItMatters: >-
      Current evidence shows positioning narratives and vendor-selected outcomes, but not actual displacement rates or
      renewal resilience.
    diligencePath: >-
      Ask for anonymized competitive win-loss studies, renewal cohorts, and customer references that evaluated multiple
      vendors.
    relatedQuestionRefs:
      - QP002
      - QP005
  - type: private-evidence-only
    severity: material
    topic: disclosure-gap
    missingEvidence: Standalone revenue, ARR, gross margin, cash balance, burn, runway, and debt/covenant detail.
    whyItMatters: These are the minimum inputs required to underwrite revenue quality, capital adequacy, and downside risk.
    diligencePath: Request current board materials or lender/investor reporting with monthly financials and liquidity detail.
    relatedQuestionRefs:
      - QI005
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized list-to-net pricing, discounting history, services attach rate, and module attach by customer cohort.
    whyItMatters: Public list-price proxies can overstate both average selling price and gross profit contribution.
    diligencePath: Request cohort-level bookings data, renewal schedules, and sales-ops pricing waterfall extracts.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: post-merger-commercial-mechanics
    missingEvidence: >-
      Combined Seismic-Highspot packaging, migration commitments, contract-honor terms, and roadmap rationalization
      detail.
    whyItMatters: >-
      Post-merger pricing and migration choices will directly influence retention, expansion, and support economics for
      existing and new customers.
    diligencePath: Obtain integration planning documents, renewal playbooks, and sample amended order forms for post-close customers.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: enumeration-incomplete
    severity: minor
    topic: unit-economics
    missingEvidence: Publicly sourced values for CAC, payback, gross margin, and standalone burn are still unavailable.
    whyItMatters: The unit-economics table is directionally useful, but it cannot substitute for management financials.
    diligencePath: >-
      Convert TI003 into a diligence tracker during management meetings and fill each null with primary internal
      reporting.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: >-
      Independent security certification detail, uptime or incident history, and data-residency documentation for the
      current Highspot platform.
    whyItMatters: >-
      Trust, privacy, and compliance are core buying criteria for enterprise enablement software, especially in
      regulated industries, but the assigned pool only provides marketing and review-level signals.
    diligencePath: >-
      Request trust-center exports, current certification letters, status-history evidence, and buyer-facing security
      architecture materials.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: developer-ecosystem
    missingEvidence: >-
      Public API, marketplace, administrator community, or other developer-signal evidence showing technical adoption
      and extensibility.
    whyItMatters: >-
      Integration depth and long-run platform stickiness are difficult to underwrite without proof of how practitioners
      and technical teams actually extend or administer the system.
    diligencePath: >-
      Obtain public API or marketplace documentation, partner implementation evidence, or internal metrics on
      admin/developer ecosystem usage.
    relatedQuestionRefs:
      - QE004
  - type: private-evidence-only
    severity: material
    topic: merger-roadmap
    missingEvidence: >-
      A dated product roadmap, SKU rationalization plan, and deprecation policy covering Highspot and Seismic surfaces
      after integration.
    whyItMatters: >-
      Current product breadth is partly underwriting post-merger execution, yet public materials do not show what will
      be merged, retired, or maintained.
    diligencePath: >-
      Request management roadmap materials and product-operations documentation that specify integration milestones and
      customer migration policy.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: >-
      Public renewal, churn, GRR, NRR, contract-length, or cohort-retention disclosure tied specifically to Highspot
      customers.
    whyItMatters: >-
      Without durability metrics, it is hard to judge whether the visible adoption proof reflects sticky recurring usage
      or point-in-time deployment anecdotes.
    diligencePath: >-
      Request customer cohort retention, renewal, and contract-term data from management or investors, ideally split
      pre- and post-merger.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: >-
      Top-customer concentration, channel-partner dependence, and vertical or geography mix for revenue and active
      accounts.
    whyItMatters: >-
      Concentration can materially change customer quality, expansion durability, and downside risk even when named
      logos and testimonials look strong.
    diligencePath: >-
      Ask for top-10 customer revenue share, reseller/channel mix, and account distribution by region and industry from
      internal board or diligence materials.
  - type: enumeration-incomplete
    severity: minor
    topic: TU003-named-customer-coverage
    missingEvidence: >-
      Independent or management-provided evidence showing whether the named-customer list is representative of the
      broader customer base.
    whyItMatters: >-
      The chapter can list named proofs from assigned official pages, but those pages do not establish whether these
      examples are typical, recent, or concentrated in a few flagship accounts.
    diligencePath: >-
      Request a fuller referenceable customer list or customer-count-by-segment export, then compare official
      testimonials with independent reviews and procurement records.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal-screen
    missingEvidence: >-
      Current court-docket checks, regulator correspondence, trust-center artifacts, DPA/SLA terms, and incident-history
      evidence for Highspot and Seismic.
    whyItMatters: The retained pool does not let diligence clear legal, privacy, or disclosed incident risk with confidence.
    diligencePath: >-
      Run direct court/regulator/breach-history checks and request current trust-center and contracting materials from
      management.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: merger-integration
    missingEvidence: >-
      Public post-merger roadmap, SKU rationalization plan, packaging changes, renewal protections, and churn
      commentary.
    whyItMatters: >-
      Integration risk cannot be underwritten cleanly without knowing how overlapping products and contracts will be
      handled.
    diligencePath: Request board-approved integration milestones, customer communication plans, and renewal or migration guardrails.
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-downside
    missingEvidence: Current audited revenue, profitability, cash-burn, and covenant or runway detail for the combined operating model.
    whyItMatters: >-
      Without resilience metrics, investors cannot bound downside if deployment slows or renewals weaken during
      integration.
    diligencePath: >-
      Request current board package, audited financials, and scenario analysis tied to retention and implementation
      delays.
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: valuation-transparency
    missingEvidence: Current financing terms, valuation mark, liquidation preferences, and any debt or project-finance obligations.
    whyItMatters: >-
      Without capital-structure and pricing evidence, the chapter cannot translate strategic strength into a defensible
      entry multiple or downside case.
    diligencePath: >-
      Request the latest financing summary, cap table, board materials on preferences, and any lender or
      structured-capital agreements.
    relatedQuestionRefs:
      - QV004
      - QV007
      - QV008
  - type: private-evidence-only
    severity: material
    topic: operating-proof
    missingEvidence: Verified post-merger growth, gross margin, retention, churn, and free-cash-flow or burn data.
    whyItMatters: >-
      Product momentum and customer anecdotes do not by themselves show whether the combined company can support a
      premium valuation or absorb integration costs.
    diligencePath: >-
      Request the latest operating dashboard, cohort retention bridge, and budget-to-actual profitability materials for
      the combined business.
    relatedQuestionRefs:
      - QV002
      - QV007
      - QV008
  - type: missing-source
    severity: material
    topic: integration-roadmap
    missingEvidence: >-
      Public or management-shared milestones for product rationalization, customer migration, renewal protection, and
      organizational integration.
    whyItMatters: >-
      The biggest near-term downside is execution friction after closing, so roadmap and migration evidence directly
      affect scenario probability and risk rating.
    diligencePath: >-
      Ask management for the integration roadmap, legacy-platform support plan, renewal risk segmentation, and
      customer-communication milestones.
    relatedQuestionRefs:
      - QV005
      - QV006
      - QV008
