callouts:
  - calloutType: risk
    title: Highest-priority risk
    body: >-
      The primary risk is not product irrelevance; it is whether Seismic can merge roadmap
      control, packaging, and customer migration without introducing enough friction to slow
      adoption or renewals.
    claimRefs: [CR002, CR013, CR015]
  - calloutType: recommendation
    title: Diligence kill criteria
    body: >-
      Stop if management cannot provide a credible coexistence or migration plan, current
      compliance artifacts, and current financial-resilience evidence that bounds downside
      if integration slows deployment or renewals.
    claimRefs: [CR012, CR015, CR016]
