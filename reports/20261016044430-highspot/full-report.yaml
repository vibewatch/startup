  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered workflow and product surface
        blocks:
          - type: paragraph
            body: >-
              The assigned 2026 sources describe Highspot as more than a content repository: the product is positioned
              as a go-to-market execution system that connects governed content, seller guidance, coaching, and buyer
              collaboration. Official product pages repeatedly frame Nexus-powered agents as embedded in daily seller
              workflows, while independent reviews describe the practical value proposition as content governance, usage
              analytics, and coaching that scale a staffed enablement function. The clearest surfaced modules in the
              evidence set are Deal Agent / Deal Intelligence, AI-curated content and answers, Role Play, AI Feedback,
              Digital Sales Rooms, and the broader Nexus analytics layer. For product diligence, that means Highspot
              should be assessed as a workflow platform whose value depends on how tightly those modules reinforce one
