      - number: '4.2'
        title: Public efficiency proxies and cost discipline
        blocks:
          - type: paragraph
            body: >-
              Highspot does provide public evidence that customers use the platform to move seller behavior and
              commercial outcomes, but those signals are mostly customer anecdotes and Highspot-authored metrics rather
              than audited unit economics. The strongest official proof points are performance outcomes such as quota
              attainment, onboarding-time reduction, and larger average deal size, while the company’s own metrics
              content argues that enablement leaders should track adoption, sales-cycle, and forecast measures to
              connect platform usage to revenue impact. That is helpful for understanding what management likely
              optimizes for, but it does not answer gross-margin durability, services burden, CAC efficiency, or
              payback. The public record therefore supports a commercialization thesis more than a margin thesis.
            claimRefs:
