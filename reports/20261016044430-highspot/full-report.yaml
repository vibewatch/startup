  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary has widened from sales enablement to GTM performance
        blocks:
          - type: paragraph
            body: >-
              The retained sources support treating Highspot's market as sales or revenue enablement for complex
              go-to-market organizations rather than as generic CRM, generic learning software, or standalone analytics.
              Highspot's own positioning centers on governed content, skills, coaching, buyer engagement, and analytics
              embedded in live deal execution, while Seismic and multiple trade sources describe the combined platform
              as spanning enablement, content, learning, coaching, analytics, and insights across the full revenue
              lifecycle. That matters because it expands the practical market boundary from a point solution for sales
              collateral into a broader execution layer sitting between strategy, frontline seller workflows, and buyer
              engagement.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing is strongest through adoption and investment proxies
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not provide a clean public dollar TAM or a segment-by-segment SAM for Highspot's
              category, so the most defensible sizing approach is to use observable adoption and capacity proxies
              instead of inventing a stack. Seismic says the post-merger company serves 2,500 customers and 3.5 million
              users, versus approximately 2,000 organizations on Seismic's standalone platform before close, which
              establishes meaningful installed-base scale without proving total addressable demand. Demand-side support
              comes from Gartner's forecast, cited by Seismic, that AI-driven enablement functions will deliver 40%
              faster sales stage velocity by 2029. Supply-side support comes from Seismic's stated plan to invest more
              than $100 million annually in R&D and maintain more than 700 product, engineering, data science, and AI
              professionals, signaling that category leadership increasingly depends on AI depth and enterprise-scale
              product investment.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM013
