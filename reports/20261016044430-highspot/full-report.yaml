      - number: '4.3'
        title: Capital adequacy and merger context
        blocks:
          - type: paragraph
            body: >-
              The key 2026 financing update is strategic rather than balance-sheet specific. Spring coverage treated the
              Seismic transaction as pending and urged buyers to plan around regulatory and roadmap uncertainty, but by
              August Seismic announced the merger had completed and described a combined business serving 2,500
              customers and 3.5 million users with more than $100 million of annual R&D investment. That scale likely
              reduces near-term product-investment risk relative to a standalone private company, yet public sources
              still do not disclose Highspot’s pre-merger cash, burn, debt, deferred-revenue profile, or standalone
              profitability. For diligence, the practical question shifts from “can Highspot fund itself this year?” to
              “what economics, roadmap, and contract protections attach to the combined Seismic-owned platform?”
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Highspot looks like an enterprise revenue-enablement asset with credible pricing power,
              visible implementation intensity, and customer-value claims strong enough to support premium contract
              sizes, but not enough public disclosure to underwrite standalone performance with conviction. The merger
              improves the probability of continued platform investment, yet it also makes historic standalone-company
              analysis less useful for new buyers and investors unless they can see combined roadmap, packaging,
              services attach, and contract migration terms. A prudent view is that revenue quality may be attractive
              but remains unverified, the margin path is opaque, and the remaining diligence burden sits squarely on
              private metrics and post-merger commercial mechanics.
            claimRefs:
              - CI003
              - CI004
