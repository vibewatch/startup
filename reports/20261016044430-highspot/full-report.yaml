      - number: '3.3'
        title: Switching costs, distribution power, and trust posture
        blocks:
          - type: paragraph
            body: >
              The evidence suggests Highspot's moat depends less on one isolated feature than on how many adjacent
              workflows it can absorb. CRM-linked recommendations, content governance, role-based AI permissions,
              scorecards, and Digital Sales Rooms all become more valuable when sales, enablement, and RevOps work in
              the same operating layer. That creates switching cost through process standardization and data exhaust,
              not just through seat count. It also shapes distribution: once the platform is embedded in
              Salesforce-centric or multi-tool enterprise environments, lighter substitutes have to replace both the
              repository and the guidance logic around it. The main caution is that much of the trust and ROI proof is
              vendor-selected rather than independently benchmarked.
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP013
      - number: '3.4'
        title: Durability, commoditization risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >
              Highspot's breadth is a competitive asset, but the same assigned evidence shows where displacement risk
              enters. Independent reviews repeatedly argue that the platform works best once a company already has a
              meaningful content problem, a dedicated enablement owner, and budget tolerance for quote-based software
              plus implementation work. That leaves an attack surface below the enterprise segment, where Guru, Notion,
              or in-house workflows can satisfy enough of the job more cheaply. The August 2026 Seismic merger increases
              scale and R&D firepower around the combined platform, which may strengthen the direct-peer moat, but
              public materials still do not explain how overlap, migration choices, or commercial terms will be
              rationalized for customers evaluating the platform today.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
