      - number: '1.3'
        title: Milestones, scale signals, and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The milestone record visible in the assigned evidence is merger-heavy. Highspot's historical anchor is its
              October 2020 Spark launch of an end-to-end sales enablement platform, while 2026 evidence shows a product
              narrative evolving toward agentic GTM performance through the Winter Launch and then the Seismic
              combination. CX Today dates the merger agreement to February 12, 2026, and Seismic says the merger
              completed on August 18, 2026. After closing, Seismic disclosed 2,500 customers and 3.5 million users for
              the combined company, which is useful as a post-merger scale signal but not a clean standalone Highspot
              metric. That distinction is crucial because the assigned pool does not independently substantiate current
              Highspot-only valuation, total capital raised, debt, or headcount, so those fields should remain explicit
              diligence gaps rather than backfilled from stale historical reports.
