    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current positioning
        blocks:
          - type: paragraph
            body: >-
              The strongest current ground truth is that Highspot now presents itself as "Highspot by Seismic" and
              describes the product as an AI platform for revenue execution built for go-to-market teams, not just a
              sales-content repository. The product overview expands that identity into a workflow layer that connects
              GTM signals, embeds AI guidance into daily tools such as Salesforce, Outlook, and Slack, and links
              content, training, coaching, and deal execution. That framing matters for later chapters because it
              anchors the company in revenue-execution software rather than a narrower enablement point solution. The
              same homepage also emphasizes services, community, and 24/7 support as part of the operating model.
              Geography requires entity-level precision: a 2020 Highspot announcement was datelined Seattle, while
              Seismic's post-close company description names San Diego as Seismic's headquarters. The assigned pool does
              not establish whether Seattle remains Highspot's principal operating hub within the combined company.
            claimRefs:
              - CO001
