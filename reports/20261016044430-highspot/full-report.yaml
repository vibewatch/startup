  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing posture
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a classic enterprise-software revenue model rather than a transparent self-serve
              SaaS motion. Third-party reviews say Highspot does not publish list pricing, sells through custom quotes,
              and packages capability into named tiers, while official pages frame the product as a broad go-to-market
              system spanning content governance, training, coaching, buyer engagement, and AI-guided execution. That
              combination suggests the commercial unit is the enterprise sales or revenue team deployment, not a
              lightweight per-feature add-on. The main implication for underwriting is that public list pricing is only
              a partial signal: deal value depends on seat scope, enabled modules, implementation complexity, and
              negotiated discounts that are not publicly disclosed.
