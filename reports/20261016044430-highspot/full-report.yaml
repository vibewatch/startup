      - number: '1.2'
        title: Leadership, governance, and control
        blocks:
          - type: paragraph
            body: >-
              The leadership story is clearer than the capital story. Robert Wahbe is still identifiable as Highspot CEO
              in early-2026 launch coverage, while multiple merger reports say that, under the deal terms, he would move
              into a board role on the combined company. Control shifts decisively toward Seismic: several sources say
              the merged business would operate under the Seismic name and be led by Seismic CEO Rob Tarkoff. Pre-close
              reporting expected Permira to remain the controlling shareholder, but the assigned post-close release does
              not independently confirm that ownership outcome. For diligence, key-person and governance questions
              therefore move from standalone Highspot leadership to integration authority, board influence, founder
              retention, and current sponsor control inside the new parent structure.
