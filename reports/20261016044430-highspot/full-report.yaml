  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >
              The assigned pool supports a layered landscape rather than a single peer set. Highspot and Seismic sit in
              the direct-enterprise lane, where buyers want governed content, AI-assisted guidance, coaching, analytics,
              and buyer-engagement workflows in one system. Showpad appears as a nearer adjacent option for teams that
              still want enablement software but may value a lower-price or easier-to-adopt posture more than maximum
              platform breadth. Guru and Notion represent substitute or status-quo paths: they help smaller teams
              centralize knowledge or documentation before they commit to a heavier enablement stack. The same evidence
              also implies an internal-build route around shared docs plus CRM, but not a strong public record for
              additional named entrants beyond these categories.
            claimRefs:
              - CP001
