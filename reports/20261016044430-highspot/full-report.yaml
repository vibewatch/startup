      - number: '3.2'
        title: Capability and packaging comparison
        blocks:
          - type: paragraph
            body: >
              Highspot's position is strongest when buyers value an end-to-end execution layer instead of a point
              solution. Official pages and independent reviews consistently describe the product as a bundle of content
              management, training, sales plays, buyer engagement, coaching, and analytics, with recent launches
              extending that bundle into Deal Intelligence and agent-led next-best actions. Public packaging reinforces
              the same posture: Highspot discloses tier structure and feature ladders, but not list prices, so the
              market signal is premium, enterprise, and negotiated rather than self-serve. In practical buying terms,
              Seismic remains the closest like-for-like evaluation, while Showpad, Guru, and Notion increasingly frame
              the tradeoff between breadth and simplicity rather than feature parity.
