      - number: '5.2'
        title: Operating architecture and deployment dependencies
        blocks:
          - type: paragraph
            body: >-
              Public materials and third-party coverage point to an architecture that sits above existing GTM systems,
              especially CRM, then uses cross-surface signals to steer seller behavior. Martech360's launch coverage
              says Deal Intelligence combines CRM records, buyer engagement, and meeting intelligence into a real-time
              opportunity view, while Highspot's own field and sales-enablement material stresses embedded guidance
              inside everyday workflows and dashboards shaped by CRM and adjacent GTM data. That makes data quality,
              taxonomy discipline, and administrator capacity material product dependencies: weak CRM hygiene, stale
              content operations, or an understaffed enablement function would directly reduce recommendation quality,
              dashboard trust, and ultimately product ROI. Integrations look mature, but the assigned pool still lacks
              implementation-depth evidence such as API constraints, data residency choices, or uptime/service-boundary
              detail.
