      - number: '2.3'
        title: Buyer adoption depends on execution ROI, but competition and budget proof still matter
        blocks:
          - type: paragraph
            body: >-
              The core buyer motion in the retained evidence runs through sales leadership, revenue or enablement
              leaders, marketers, and frontline sellers operating inside larger GTM systems. Adoption is pulled by a
              recurring need to connect strategy to execution, improve consistency, and help teams navigate larger
              buying committees and more complex deals without adding headcount. Highspot's own proof points point to
              quota, onboarding, and deal-size outcomes, so the product is sold as an execution and productivity
              purchase rather than as discretionary content infrastructure alone. The main constraints are that public
              evidence in this pool still does not isolate TAM or budget by segment, transparent pricing remains
              unavailable, and the DOJ review record shows competition is being reshaped by AI-native entrants rather
              than by simple adjacent-suite expansion. That combination supports a growing market, but not one with
              fully de-risked category boundaries or public pricing benchmarks.
