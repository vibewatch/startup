company:
  name: Highspot
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Highspot's current public identity is that of an AI-powered revenue execution platform,
    but the company-level story is now inseparable from Seismic's August 2026 merger
    completion and the shift to operating under the Seismic name. The assigned evidence is
    strong on product positioning, leadership/control changes, and milestone chronology, but
    weak on standalone valuation, capital raised, headcount, and a freshly confirmed
    headquarters disclosure.
sections:
  - id: identity-and-positioning
    title: Identity and current positioning
    body: >-
      The strongest current ground truth is that Highspot now presents itself as "Highspot by
      Seismic" and describes the product as an AI platform for revenue execution built for
      go-to-market teams, not just a sales-content repository. The product overview expands
      that identity into a workflow layer that connects GTM signals, embeds AI guidance into
      daily tools such as Salesforce, Outlook, and Slack, and links content, training,
      coaching, and deal execution. That framing matters for later chapters because it anchors
      the company in revenue-execution software rather than a narrower enablement point
      solution. The same homepage also emphasizes services, community, and 24/7 support as
      part of the operating model. Geography requires entity-level precision: a 2020 Highspot
      announcement was datelined Seattle, while Seismic's post-close company description names
      San Diego as Seismic's headquarters. The assigned pool does not establish whether Seattle
      remains Highspot's principal operating hub within the combined company.
    claimRefs: [CO001, CO002, CO013, CO014, CO015]
    tableRefs: [TO001]
  - id: leadership-governance-and-control
    title: Leadership, governance, and control
    body: >-
      The leadership story is clearer than the capital story. Robert Wahbe is still
      identifiable as Highspot CEO in early-2026 launch coverage, while multiple merger
      reports say that, under the deal terms, he would move into a board role on the combined
      company. Control shifts decisively toward Seismic: several sources say the merged
      business would operate under the Seismic name and be led by Seismic CEO Rob Tarkoff.
      Pre-close reporting expected Permira to remain the controlling shareholder, but the
      assigned post-close release does not independently confirm that ownership outcome. For
      diligence, key-person and governance questions therefore move from standalone Highspot
      leadership to integration authority, board influence, founder retention, and current
      sponsor control inside the new parent structure.
    claimRefs: [CO006, CO007, CO008, CO011, CO012]
    tableRefs: [TO002, TO003]
  - id: milestones-scale-and-disclosure-gaps
    title: Milestones, scale signals, and disclosure gaps
    body: >-
      The milestone record visible in the assigned evidence is merger-heavy. Highspot's
      historical anchor is its October 2020 Spark launch of an end-to-end sales enablement
      platform, while 2026 evidence shows a product narrative evolving toward agentic GTM
      performance through the Winter Launch and then the Seismic combination. CX Today dates
      the merger agreement to February 12, 2026, and Seismic says the merger completed on
      August 18, 2026. After closing, Seismic disclosed 2,500 customers and 3.5 million users
      for the combined company, which is useful as a post-merger scale signal but not a clean
      standalone Highspot metric. That distinction is crucial because the assigned pool does
      not independently substantiate current Highspot-only valuation, total capital raised,
      debt, or headcount, so those fields should remain explicit diligence gaps rather than
      backfilled from stale historical reports.
    claimRefs: [CO003, CO004, CO005, CO009, CO010, CO014, CO016]
    figureRefs: [FO001]
