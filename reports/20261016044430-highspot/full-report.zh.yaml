  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已交付工作流与产品面
        blocks:
          - type: paragraph
            body: >-
              2026 年来源将 Highspot 描述为不止内容库：它是连接受治理内容、销售指导、辅导和买方协作的 GTM 执行系统。官方页面称 Nexus agents
              嵌入销售日常工作流；独立评论强调内容治理、使用分析和辅导能放大赋能团队。证据中最清晰的模块包括 Deal Agent / Deal Intelligence、AI 筛选内容和答案、Role Play、AI
              Feedback、Digital Sales Rooms 及 Nexus 分析层。因此产品尽调应把 Highspot 看作工作流平台，其价值取决于模块协同，而非独立 CMS。
