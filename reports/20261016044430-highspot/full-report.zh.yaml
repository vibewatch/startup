    title: 建议逻辑
    type: flow
    summary: 决策链条从真实的平台规模和产品广度，经由整合风险与薄弱的价格发现，最终得出谨慎的跟踪建议。
    data:
      nodes:
        - id: merged-scale
          label: 合并后规模
          detail: Seismic 称合并后的公司服务 2,500 家客户和 350 万用户。
        - id: ai-breadth
          label: AI 平台广度
          detail: Highspot 官方页面将智能代理式 AI 定位于内容、培训、辅导、交易指导和分析等领域。
        - id: feature-velocity
          label: 2026 年功能迭代速度
          detail: Winter Launch 2026 在实时交易工作流中新增了 Deal Agent、相互行动计划和 AI 角色扮演。
        - id: integration-risk
          label: 整合仍处于早期
          detail: 管理层表示整合才刚开始，因此协同效应和路线图主张尚未由结果验证。
        - id: price-discovery
          label: 价格发现缺口
          detail: 独立来源对公开定价意见不一，且证据池不包含融资估值标记或资本结构细节。
        - id: recommendation
          label: 建议：跟踪 / 进一步研究
          detail: 在对买入案例进行投资判断前，等待主要估值、留存、利润率和迁移证据。
      edges:
        - from: merged-scale
          to: ai-breadth
          label: 支持类别相关性
        - from: ai-breadth
          to: feature-velocity
          label: 增加战略上行空间
        - from: feature-velocity
          to: integration-risk
          label: 必须经受合并执行考验
        - from: integration-risk
          to: price-discovery
          label: 使公开投资判断仍不完整
        - from: price-discovery
          to: recommendation
          label: 迫使采取谨慎进入纪律
