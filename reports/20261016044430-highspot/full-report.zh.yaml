            body: >-
              目前最可靠的事实是，Highspot 将自身定位为 “Highspot by Seismic”，并把产品描述为面向 GTM 团队的 AI 收入执行平台，而不只是销售内容库。产品把 GTM
              信号、Salesforce、Outlook、Slack 中的 AI 指导、内容、培训、辅导和交易执行连接成工作流层。该定位将公司锚定在收入执行软件，而非狭窄的赋能点工具；主页还强调服务、社区和 24/7
              支持。地理信息需精确到实体：Highspot 2020 年公告署名西雅图，Seismic 合并完成后的公司介绍称总部在圣迭戈。指定证据无法确认西雅图是否仍是合并后 Highspot 的主要运营中心。
