              - CR011
              - CR012
      - number: '7.3'
        title: 商业摩擦与依赖风险
        blocks:
          - type: paragraph
            body: >-
              商业下行情形比量化更容易看见。ZoomInfo
              评论对多项实务问题持不利看法：价格定制且不透明、没有自助试用、定制能力有限、管理员有学习曲线，报告输出也难以包装给内部利益相关者。对成熟企业部署而言这不是致命缺陷，但会增加价值实现时间风险，并让续约更依赖内部赋能人员和高管耐心。


              资本市场可见度也不足以支撑投资判断。Tracxn 仍将 2022 年 1 月、估值 $3.5 billion 的 Series F 轮列为保留资料中最新融资数据点，因此截至 2026 年 10
              月公开价格发现明显过时。若整合放慢采用或提高流失，来源没有当前经审计收入、盈利能力或烧钱披露来精确界定下行。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
