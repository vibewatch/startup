  - id: TV003
    title: 看涨 / 基准 / 看跌情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 看涨
        - 合并后的平台将规模和 AI 工作流广度转化为交叉销售、更快执行和稳健留存。
        - 只有在主要增长、利润率、留存和资本结构证据出现后，才支持以溢价进入。
        - 整合继续延误，或路线图重叠造成客户流失。
        - 如果管理层公布迁移里程碑和运营证明，则为正面信号。
      - - 基准
        - Highspot 在战略上仍具相关性，但市场仍无法观察到足够的估值或融资细节，因而无法对该资产进行清晰定价。
        - 保持跟踪 / 进一步研究，并等待经验证的投资判断输入，而不是自行推断。
        - 条款不透明且定价披露不一致，使预期回报过度依赖假设。
        - 只要公开证据仍以叙事为主，这一情景最有可能。
      - - 看跌
        - 在协同效应体现于客户结果之前，整合拖累、买方摩擦或融资重置打断合并后的论点。
        - 避免进入，或要求大幅折价并获得防范优先权悬置的保护。
        - 复杂的设置、昂贵的定位或较弱的续约数据可能迅速压缩可实现的倍数。
        - 如果独立证据显示采用度疲软或发生类似下轮融资的事件，则为负面信号。
    notes: 情景逻辑是定性的，因为分配到的证据池不包含形成可辩护数值区间所需的经验证收入、利润率或估值披露。
    claimRefs:
      - CV002
      - CV003
      - CV011
      - CV012
      - CV013
      - CV014
