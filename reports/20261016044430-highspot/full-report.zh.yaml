      - number: '5.3'
        title: 差异化、成熟度与产品风险
        blocks:
          - type: paragraph
            body: >-
              本批来源中 Highspot 最突出的差异化是企业治理加闭环赋能：权限、可审计性、精选内容、AI 辅导及内容到结果的分析均得到强调。证据也限制了适配范围：RevenueHoop
              称产品在已有赋能团队时效果最好，对小团队可能过度建设；Outdoo 指出价格不透明及路线图问题。Seismic 的整合信息把路线图变成实际过渡风险，但来源未披露 SKU
              整合、弃用政策或合并后的独立安全/合规验证。产品成熟度更体现在工作流广度，而非技术透明度。
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: 展示
        blocks:
          - type: callout
            title: 闭环赋能是产品论点
            body: 指定证据中 Highspot 最强的产品论点是：受治理内容、交易内指导、辅导和分析在同一工作流中相互强化，而不是彼此孤立的工具。
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
          - type: callout
            title: 产品 ROI 取决于运营纪律
            body: 支持 Highspot 企业深度的证据也说明运营脆弱性：CRM 整洁度、内容治理、赋能人员配置和合并整合质量都会显著影响实际产品价值。
            calloutType: risk
            claimRefs:
              - CE006
