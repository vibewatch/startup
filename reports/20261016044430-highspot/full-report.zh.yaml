  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合并控制、路线图归属与法律姿态
        blocks:
          - type: paragraph
            body: >-
              当前最高风险不是保留证据中已经证明的具体诉讼，而是交割后的控制权转移及其执行不确定性。Seismic 2026 年 8 月材料确认业务已使用 Seismic 名称运营，整合工作开始；首次深度路线图介绍安排在 10
              月 12—15 日的 Seismic Shift。指定证据没有活动结果材料，无法确认最终披露了什么。治理和产品优先级权力已集中，但 SKU 整合、合同迁移和流失管理证据仍薄弱。


              因此，法律/监管登记更适合被视为部分公开筛查，而不是清白证明。保留资料没有当前法院 docket
              核查、监管往来、信任中心材料或事件历史，投资者无法有把握地排除隐私、安全或合同风险。在这些材料提供前，应把未解决的合规和过渡事项视为尽调要求，而不是已经消除的风险。
            claimRefs:
              - CR002
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR011
              - CR012
              - CR013
