      - number: '5.2'
        title: 运营架构与部署依赖
        blocks:
          - type: paragraph
            body: >-
              公开材料和第三方报道显示，架构位于现有 GTM 系统之上，尤其是 CRM，并用跨界面信号引导销售行为。Martech360 称 Deal Intelligence 将 CRM
              记录、买方互动和会议情报合并为实时机会视图；Highspot 资料强调嵌入日常工作流。因此数据质量、分类纪律和管理员能力都是关键依赖：CRM 不洁、内容过时或赋能团队人手不足，都会降低推荐质量、仪表板信任和产品
              ROI。集成看起来成熟，但证据缺少 API 限制、数据驻留、正常运行时间或服务边界等实施深度信息。
            claimRefs:
