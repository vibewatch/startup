      - number: '7.4'
        title: 缓解措施成熟度、监测指标与止损标准
        blocks:
          - type: paragraph
            body: >-
              可见的缓解措施包括：Seismic 展示规模、投入能力和庞大研发基础；Highspot
              继续营销一体化工作流与角色感知治理；产品叙事仍将执行指导直接连接到交易推进。这些措施降低平台被彻底放弃的概率，但尚未填补路线图整合、当前合规证明、定价治理或可量化下行韧性等关键尽调缺口。


              若三项监测指标中任一项转负，论点应失效：第一，合并后路线图披露无法显示核心工作流可信的共存或迁移路径；第二，客户证据显示管理员负担、报告摩擦或合同不确定性拖累采用；第三，管理层在尽调中无法提供当前安全/合规材料和财务韧性数据。在此之前，合适的姿态是可管理但偏高的风险，而不是已清除风险的运营画像。
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 最高优先级风险
            body: 首要风险不是产品失去相关性，而是 Seismic 能否整合路线图控制、产品打包和客户迁移，同时不引入足以拖慢采用或续约的摩擦。
            calloutType: risk
            claimRefs:
              - CR002
              - CR013
              - CR015
          - type: callout
            title: 尽调止损标准
            body: 如果管理层无法提供可信的共存或迁移计划、当前合规材料，以及能在整合拖慢部署或续约时界定下行的当前财务韧性证据，应停止推进。
            calloutType: recommendation
            claimRefs:
              - CR012
