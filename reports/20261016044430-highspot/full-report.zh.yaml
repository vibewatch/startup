  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户 segment 与公开采用足迹
        blocks:
          - type: paragraph
            body: >-
              指定证据显示 Highspot 主要销售给企业收入组织，而非 SMB 自助式客户。官方材料面向 VP Sales、CMO 和收入运营负责人；日常用户包括
              SDR、BDR、AE、渠道代表、一线销售、经理和赋能团队。买方与用户的广泛分离，为初始部署后的部门扩张留下空间。独立证据较少但并非没有：Gartner 2026
              年评论资料既有大型装机量主张，也有至少一位评论者描述日常工作流使用、Salesforce 联动分析和面向客户的 Digital Room 活动。
