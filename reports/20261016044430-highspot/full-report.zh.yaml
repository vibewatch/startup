  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              基于这批证据，能够支持的结论是跟踪 / 继续研究，而不是买入。官方合并和产品材料显示平台规模扩大、AI
              产品故事可信，但本章仍缺少主要融资条款、当前资本结构可见度和干净的公开价格锚。独立来源对定价是公开、部分公开还是完全定制意见不一，因此公开估值仍锚定叙事质量，而非可验证的入场纪律。合并公司刚开始正式整合，风险调整后的立场应保持谨慎，直到管理层披露能量化支撑上下行情形的留存、利润率、路线图和迁移证据。
            claimRefs:
              - CV001
