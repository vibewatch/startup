      - number: '4.3'
        title: 资本充足性与合并背景
        blocks:
          - type: paragraph
            body: >-
              2026 年关键融资更新是战略性的，而非资产负债表层面的。春季报道将 Seismic 交易视为待完成，并建议买方围绕监管与路线图不确定性规划；到 8 月 Seismic 宣布合并完成，称合并公司服务 2,500
