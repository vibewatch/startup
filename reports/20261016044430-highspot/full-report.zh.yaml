              - CV009
              - CV010
              - CV012
      - number: '8.3'
        title: 今天阻止买入建议的因素
        blocks:
          - type: paragraph
            body: >-
              主要阻碍不是产品相关性，而是投资判断质量。独立定价来源无法清晰对齐：一来源称公开 Starter 计划为每位用户每月 $25，另一来源称具体价格未公开、仍需直接咨询；另一份独立解释也称 Highspot
              不公布标准价目表，而是按部署范围定制价格。即使其中一种方向上正确，这批证据仍未披露融资条款、清算优先权、杠杆或经验证的当前估值。Toolradar
              对费用、企业聚焦、学习曲线和设置复杂度的负面评价，也提高了假设合并后商业化毫无摩擦的门槛。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 情景框架、尽调问题与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              看涨 / 基准 / 看跌框架应保持定性并对价格敏感，而不是制造虚假的精确度。更好的情形需要证明合并平台能在叠加更多工作流智能和更广路线图时保住采用度。基准情景是 Highspot
              仍具战略相关性，但公开市场尚未定价，因此等待是理性的。悲观情景不是品类崩溃，而是整合拖累、买方厌倦复杂企业部署，或在公开运营证据出现前发生融资事件、重置估值预期。最终尽调应优先留存、利润率、迁移和资本结构证据，因为这些变量最可能同时改变估值区间和下行保护。
            claimRefs:
              - CV012
              - CV013
              - CV014
