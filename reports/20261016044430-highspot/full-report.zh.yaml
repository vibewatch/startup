      - number: '6.3'
        title: 持久性、摩擦与变化风险
        blocks:
          - type: paragraph
            body: >-
              公开客户记录最弱的是持久性。2026 年来源未披露 GRR、NRR、流失、续约率、合同期限或头部客户集中度，因此难以将营销 ROI 轶事与真正持久的经常性使用区分开。独立反馈方向偏正面但并不干净：Gartner
              评论既称赞日常使用，也抱怨 Gmail 集成、版本更新通知和搜索相关性弱。Seismic 合并微站仍聚焦客户下一步变化，说明连续性和整合执行仍是活跃采用风险。本章有可信使用证据，但客户质量证据仍不完整。
            claimRefs:
              - CU012
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: 展示
        blocks:
          - type: callout
            title: 扩张看起来跨职能，而不只是增加席位
            body: Highspot 最强的公开扩张模式，是从销售内容和 Digital Rooms 横向延伸到辅导、赋能、买方互动和 GTM 分析工作流。
