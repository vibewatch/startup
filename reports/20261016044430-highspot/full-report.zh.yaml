      - number: '7.2'
        title: 产品、安全与运营执行风险
        blocks:
          - type: paragraph
            body: >-
              Highspot 的产品价值依赖广泛的执行面：CRM 联动内容交付、指导式下一步行动、Digital Sales Rooms、辅导和基于角色的 AI 指导。2026 年 1 月 Winter Launch 又加入
              Deal Intelligence、Deal Agent 推荐和 mutual action plans。广度可以增强黏性，但也增加了合并整合、模型更新和跨产品路线图变化期间必须持续运行的工作流数量。


              安全与治理被作为缓解措施提出，而不是独立验证的运营事实。公开信息称 Nexus
              设计上安全并遵守基于角色的权限，第三方评论把企业合规要求视为基本门槛。但现有证据仍缺少当前证书、审计材料、信任中心导出或公开事件时间线，尽调无法从厂商定位走到独立验证。
            claimRefs:
              - CR001
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR009
