      - number: '3.3'
        title: 切换成本、分销能力与信任姿态
        blocks:
          - type: paragraph
            body: >-
              证据显示，Highspot 的护城河不在某个孤立功能，而在于能吸收多少相邻工作流。CRM 联动推荐、内容治理、基于角色的 AI 权限、评分卡和 Digital Sales Rooms，在销售、赋能和 RevOps
              共用一个运营层时更有价值。切换成本来自流程标准化和数据沉淀，而不只是席位数量。平台一旦嵌入 Salesforce 为中心或多工具并用的企业环境，轻量替代品就必须同时替换内容库和指导逻辑。主要谨慎点是许多信任和
              ROI 证据由厂商选择，缺乏独立基准。
