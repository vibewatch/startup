      - number: '8.2'
        title: 乐观情景可以合理依靠什么
        blocks:
          - type: paragraph
            body: >-
              上行情形并非虚构，只是尚未被公开证据充分定价。Seismic 称合并业务已服务 2,500 家客户和 350 万用户，计划每年投入超过 $100 million 研发，并拥有 700 多名产品、工程、数据科学和
              AI 专业人员。Highspot 官方页面将平台定位为覆盖内容、培训、辅导、交易指导和分析的代理式 AI；2026 年 Winter Launch 又在交易执行中加入 Deal Agent、mutual
              action plans 和 AI Role Play。若管理层能把路线图广度转化为持久客户扩张和独立运营证明，这些信号支持合并产品赢得份额的真实论点。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
