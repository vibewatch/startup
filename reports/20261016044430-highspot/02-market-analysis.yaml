  evidenceGaps:
    - type: missing-source
      severity: material
      topic: public-market-sizing
      missingEvidence: Independent public TAM, SAM, or SOM estimates for revenue enablement or GTM performance that isolate segment, geography, and methodology.
      whyItMatters: Without an external market-size anchor, the chapter can only use installed-base and adoption proxies instead of a defensible dollar opportunity range.
      diligencePath: Add retained analyst, filing, or trade-association market data that explicitly sizes revenue enablement or GTM performance by scope and geography.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: pricing-and-budget-ownership
      missingEvidence: Transparent public pricing, packaging, or budget-owner disclosure by segment.
      whyItMatters: Pricing opacity prevents clean conversion from user or customer counts into revenue opportunity and weakens buyer-budget precision.
      diligencePath: Obtain customer-facing pricing collateral, procurement records, or management disclosure showing package structure, seat assumptions, and budget ownership.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM003]
