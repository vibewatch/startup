  evidenceGaps:
    - type: missing-source
      severity: material
      topic: valuation-transparency
      missingEvidence: Current financing terms, valuation mark, liquidation preferences, and any debt or project-finance obligations.
      whyItMatters: Without capital-structure and pricing evidence, the chapter cannot translate strategic strength into a defensible entry multiple or downside case.
      diligencePath: Request the latest financing summary, cap table, board materials on preferences, and any lender or structured-capital agreements.
      relatedQuestionRefs: [QV004, QV007, QV008]
    - type: private-evidence-only
      severity: material
      topic: operating-proof
      missingEvidence: Verified post-merger growth, gross margin, retention, churn, and free-cash-flow or burn data.
      whyItMatters: Product momentum and customer anecdotes do not by themselves show whether the combined company can support a premium valuation or absorb integration costs.
      diligencePath: Request the latest operating dashboard, cohort retention bridge, and budget-to-actual profitability materials for the combined business.
      relatedQuestionRefs: [QV002, QV007, QV008]
    - type: missing-source
      severity: material
      topic: integration-roadmap
      missingEvidence: Public or management-shared milestones for product rationalization, customer migration, renewal protection, and organizational integration.
      whyItMatters: The biggest near-term downside is execution friction after closing, so roadmap and migration evidence directly affect scenario probability and risk rating.
      diligencePath: Ask management for the integration roadmap, legacy-platform support plan, renewal risk segmentation, and customer-communication milestones.
      relatedQuestionRefs: [QV005, QV006, QV008]
