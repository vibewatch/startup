  evidenceGaps:
    - type: missing-source
      severity: material
      topic: durability-gap
      missingEvidence: Public renewal, churn, GRR, NRR, contract-length, or cohort-retention disclosure tied specifically to Highspot customers.
      whyItMatters: Without durability metrics, it is hard to judge whether the visible adoption proof reflects sticky recurring usage or point-in-time deployment anecdotes.
      diligencePath: Request customer cohort retention, renewal, and contract-term data from management or investors, ideally split pre- and post-merger.
      relatedQuestionRefs: [QU005]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer concentration, channel-partner dependence, and vertical or geography mix for revenue and active accounts.
      whyItMatters: Concentration can materially change customer quality, expansion durability, and downside risk even when named logos and testimonials look strong.
      diligencePath: Ask for top-10 customer revenue share, reseller/channel mix, and account distribution by region and industry from internal board or diligence materials.
    - type: enumeration-incomplete
      severity: minor
      topic: TU003-named-customer-coverage
