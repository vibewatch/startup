      - "CU012"
      - "CU013"
      - "CU014"
callouts:
  - calloutType: "risk"
    title: "Durability is not publicly measurable"
    body: >-
      Broad adoption counters and named testimonials do not substitute for NRR, GRR,
      logo churn, renewal cohorts, contract length, or top-customer concentration.
      Those private metrics are the decisive diligence request for this chapter.
    claimRefs:
      - "CU001"
      - "CU002"
