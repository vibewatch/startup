        - label: "Document pain"
          description: "A trade business needs jobsite photos organized by project."
          touchpoints:
            - "Photo documentation"
            - "Crew and customer updates"
        - label: "Small-team entry"
          description: "The owner or operations lead introduces a field documentation layer."
          touchpoints:
            - "Small-business positioning"
            - "Three-to-fifteen-person reviewer sweet spot"
        - label: "Crew adoption"
          description: "Field users capture records while the office follows project progress."
          touchpoints:
            - "Mobile capture"
            - "Current homepage testimonials"
        - label: "Workflow expansion"
          description: "The account adds seats, integrations, reports, or AI-assisted tasks."
          touchpoints:
            - "Per-seat economics"
            - "AI workflow adoption"
        - label: "Platform decision"
          description: "The buyer compares a specialist layer with broader construction suites."
          touchpoints:
            - "Point-solution depth"
            - "Full-suite consolidation"
        - label: "Renew or exit"
          description: "The subscription renews or the customer retrieves data after termination."
          touchpoints:
            - "Auto-renewal deadline"
            - "Six-month retrieval window"
    approximationNotes: >-
      The sequence is analytical and not a measured funnel; no conversion rates,
      stage populations, or time-to-stage data are publicly disclosed.
    claimRefs:
