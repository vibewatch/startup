company:
  name: "CompanyCam"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    CompanyCam claims 285,000+ professionals and 79 million jobs, but the strongest
    public proof remains vendor-curated outcomes and a modest third-party review
    corpus rather than disclosed retention cohorts. The customer thesis is strongest
    for small, photo-intensive trade crews and weakest where per-seat economics,
    broader workflow needs, or full-suite platforms make a point solution harder to
    defend.
sections:
  - id: "segments-and-buying-context"
    title: "Segments and buying context"
    body: >-
      CompanyCam explicitly addresses small businesses with 1–10 employees, medium
      businesses with 11–49 employees, enterprises with 50+ employees, and franchise
      networks. That is a vendor-defined go-to-market frame, not a disclosed customer
      mix. The most specific external fit assessment in the assigned evidence comes
      from Fervor Studio, which places the product's practical sweet spot at three to
      fifteen people in roofing, restoration, and HVAC. In that segment, the economic
      buyer is likely the owner or operations lead while field technicians create the
      underlying record. Larger teams can use the same documentation workflow, but
      competitors frame CompanyCam as a photo-focused layer rather than the system
      that schedules, invoices, or manages the whole job. Public evidence does not
      disclose paying account counts, geographic mix, revenue bands, or actual
      segment-level revenue, so those quantities remain diligence gaps rather than
      modeled percentages.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU011"
      - "CU016"
    tableRefs:
      - "TU001"
  - id: "adoption-and-customer-proof"
    title: "Adoption and customer proof"
    body: >-
      The official homepage supplies two broad adoption counters: 285,000+ pros and
      79 million jobs. Neither counter states whether it represents current paid
      seats, active accounts, cumulative users, or cumulative projects, so it should
      not be treated as a current customer count or retention measure. Named outcome
      proof is tangible but vendor-issued: Reliant Roofing is presented as saving
      $50,000 per year, BK Restoration as saving 36 hours per month, and AHC as saying
      CompanyCam is worth ten times its cost. Fervor adds an independent but
      secondary signal by reporting that the Capterra listing carried 103 reviews
      with a July 22, 2026 update stamp. These signals establish real use and
      referenceability, yet they do not reveal deployment size, pilot-to-production
      conversion, contract value, or outcome methodology. CompanyCam's own 2026 AI
      article also reports that only 12% of surveyed commercial construction leaders
      had embedded AI into daily processes, suggesting that AI-led expansion should
      be underwritten separately from adoption of the core documentation workflow.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU015"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-expansion-and-concentration"
    title: "Durability, expansion, and concentration"
    body: >-
      Public evidence does not disclose NRR, GRR, logo churn, renewal rates, cohort
      behavior, contract length distribution, or top-customer concentration. The
      available risk signals therefore describe mechanisms rather than measured
      churn. Fervor reports a user complaint that checklist access required a plan
      costing an additional $50 per month, while SymTerra markets unlimited-user
      pricing against what it describes as CompanyCam's $27–$34 per-user monthly
      model. Those are respectively a secondary review and a competitor comparison,
      not independent cohort evidence. Procurement friction is clearer in
      CompanyCam's own terms: subscriptions auto-renew unless canceled before the
      renewal date, while customer data is available on request for six months after
      the final subscription term. Expansion can follow more seats, more workflows,
      or deeper integrations, but QuoteIQ and other full-suite competitors explicitly
      sell consolidation against the standalone documentation category. Built In's
      unreviewed AI-generated profile similarly warns that native photo tools in
      broader construction platforms can displace point solutions. The investment
      case therefore requires private cohort and concentration data before durability
      can be scored with confidence.
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU016"
    figureRefs:
      - "FU001"
