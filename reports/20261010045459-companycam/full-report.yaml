      - number: '1.2'
        title: Executive Leadership, Corporate Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              CompanyCam's corporate governance and strategic execution are anchored by founder and Chief Executive
              Officer Luke Hansen, whose domain background as a professional roofing contractor provides direct
              empathetic alignment with tradesmen and field operators. The broader executive management team includes
              Chief Financial Officer Tullen Mabbutt, who has steered the company's venture capitalization from regional
              seed grants through late-stage growth equity, and Senior Communications Manager Haley Gonzales, who
              oversees public disclosures and workforce alignment. Corporate governance features institutional board
              representation from major shareholders, including Tier-1 venture capital partner Insight Partners and lead
              growth sponsor B Capital, alongside a 3-member corporate board structure. To foster talent retention and
              economic alignment, CompanyCam maintains broad employee equity incentive programs, enabling staff across
              its Lincoln headquarters and distributed teams to participate directly in the company's valuation
              expansion. Key-person dependence remains concentrated in founder Luke Hansen, whose public persona and
              customer-centric product philosophy serve as the company's primary strategic north star.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO010
