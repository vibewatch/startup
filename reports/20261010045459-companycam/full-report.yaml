        - Multiple crews creating matching addresses results in fragmented photo histories that must be cleaned manually
        - Whether automated address deduplication or lossless job merging is planned on roadmap
      - - AWS Infrastructure Outage or Disruption
        - Low
        - High
        - Medium
        - Centralized US-based AWS hosting creates single-provider availability risk for field operations
        - Independent multi-region failover testing results and disaster recovery RTO/RPO metrics
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
  - id: TR003
    title: Partner / Dependency Risk Register
    notes: >-
      Evaluated against roofing and field service CRM ecosystems, cloud hosting, and app marketplace distribution
      channels.
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure Scenario
      - Severity
      - Mitigation
      - Residual Exposure
    rows:
      - - CRM Ecosystem Disintermediation
        - AccuLynx, JobNimbus, Jobber, Roofr
        - Job management & lead tracking
        - High (60+ integrations)
        - Core CRMs enhance native photo modules and displace third-party documentation point solutions
        - High
        - Deep annotation tooling, voice notes, and carrier-accepted metadata formats
        - CRM partners capture field workflow share as native camera tools improve
      - - Cloud Infrastructure & Storage
        - Amazon Web Services (AWS)
        - US-based photo, video, and document hosting
        - High (sole hosting provider)
        - Cloud outage or data transfer cost escalation degrades real-time field synchronization
        - High
        - SOC 2 Type II controls, 24/7 monitoring, publicly reported uptime status
        - Total reliance on AWS availability without public multi-cloud redundancy
      - - Mobile Operating Systems & App Stores
        - Apple (App Store) & Google (Play Store)
        - Mobile client distribution & hardware APIs
        - High (duopoly)
        - App store policy changes, API deprecation, or rejection of app updates
        - Medium
        - Simultaneous iOS and Android development; web app fallback for office users
        - Device-specific bugs such as dual video mode being restricted to newer iOS devices
      - - Fintech & Payments Integration
        - Beam Finance Inc. ecosystem
        - Invoicing, estimating, and payment processing
        - Medium (new initiative)
        - Integration friction, merchant processing losses, or post-acquisition technical debt
        - Medium
        - Unified engineering sprints and product rebalancing toward ARR efficiency
        - Execution distraction during CRM transition into financial service workflows
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Evidence constraint
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Public marks conflict and operating metrics are absent
        - Do not price an entry from public evidence alone
      - - Confidence
        - Low
        - No audited ARR, retention, margin, burn, or secondary clearing price
        - Require a primary diligence package
      - - Risk rating
        - High
        - Financing scope, reliability signals, and preference data remain incomplete
        - Underwrite downside before return
      - - Valuation stance
        - Unanchored / disputed
        - $1.41B and $2.0B are reported marks, not a supported fair-value range
        - Negotiate only after metric and cap-table verification
    notes: >-
      Assessments are analytical judgments from the retained public evidence; the reported marks are not presented as a
      fair-value estimate.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV009
