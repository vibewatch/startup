chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Commercial Mission, and Platform Architecture
        blocks:
          - type: paragraph
            body: >-
              CompanyCam, Inc. was founded in 2015 in Lincoln, Nebraska, by Luke Hansen to eliminate photo chaos and
              miscommunication across active construction jobsites. Originating from Hansen's operational friction
              managing photographic evidence at his family's roofing firm, White Castle Roofing, the platform was
              engineered to automatically organize jobsite photos and videos by GPS location, timestamp, and project
              address. Over the past decade, CompanyCam has evolved from a field photo utility into a comprehensive
              jobsite documentation operating system serving over 285,000 contractor professionals across more than 79
              million documented construction projects. The core platform operates as a multi-tier cloud-based
              Software-as-a-Service (SaaS) subscription model, incorporating mobile applications, desktop consoles, and
              more than 50 integrations with industry field service management and customer relationship management
              suites. Recent product developments introduce field-ready artificial intelligence capabilities designed to
              automate administrative tasks, such as voice-driven checklist creation, multi-language translation for
              field crews, and instant project report generation, while formal terms of service maintain explicit
              disclaimers regarding automated output reliability.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO012
