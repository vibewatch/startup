    title: Product architecture map
    type: stack
    summary: >-
      Six-layer architectural model illustrating CompanyCam's mobile capture, AI processing, storage ingestion, and
      partner API integration pipelines.
    data:
      layers:
        - label: Field Mobile Application Layer
          detail: Native iOS and Android client applications with offline local caching and camera controls
        - label: AI & Intelligence Workflow Engine
          detail: Voice transcription, automated site walkthrough synthesis, and daily project log generation
        - label: Project Organization & Collaboration Core
          detail: Project metadata indexing, tag taxonomies, user permission models, and real-time feeds
        - label: Storage & Media Ingestion Pipeline
          detail: Asynchronous image processing, metadata extraction, AWS S3 persistence, and CDN caching
        - label: Integration & Partner API Gateway
          detail: RESTful integration endpoints, webhooks, and partner connectors for contractor CRMs
        - label: Core Backend & Data Persistence
          detail: Ruby on Rails monolithic application services backed by PostgreSQL relational databases
