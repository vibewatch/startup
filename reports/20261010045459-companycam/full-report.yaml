      - number: '4.2'
        title: Go-to-Market Motion and Inbound Sales Economics
        blocks:
          - type: paragraph
            body: >-
              CompanyCam's go-to-market motion combines product-led adoption across trade field crews with an inside
              sales engine focused on converting inbound interest into paying contractor accounts. Inside Sales
              Representatives are tasked with qualifying inbound leads and executing three to five tailored product
              demonstrations daily, targeting trade business owners and project managers. Sales compensation models
              reflect this inside velocity, pairing a base salary of $44,000 with average on-target earnings of
              approximately $135,000 under uncapped commissions. This sales motion has successfully expanded the user
              base to over 285,000 active trade professionals across 79 million documented construction projects. To
              support cross-functional operational alignment and revenue forecasting as this hybrid GTM motion scales,
              finance leadership integrated Pigment to model sales quotas, pipeline progression, and workforce
              assumptions within a unified operational planning architecture.
            claimRefs:
              - CI001
              - CI006
