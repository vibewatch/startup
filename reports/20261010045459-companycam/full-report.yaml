      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Technology Stack Integration
        blocks:
          - type: paragraph
            body: >-
              Adoption dynamics and procurement pathways vary substantially across contractor scale. In small
              residential trade businesses (1 to 10 employees), the economic buyer is typically the owner-operator who
              personally purchases software on a credit card to eliminate evening paperwork and mitigate property damage
              disputes. In mid-sized specialty contracting firms (11 to 49 employees), budget authority shifts to
              general managers or operations leads seeking crew accountability and standardized jobsite checklists. In
              enterprise commercial contractors (50+ employees), procurement involves IT and risk management teams
              focused on single sign-on (SSO), data security, and multi-location governance. Across all segments,
              CompanyCam's GTM model relies on high ecosystem interoperability, maintaining over 50 to 60 integrations
              with major industry CRMs and FSMs such as Jobber, AccuLynx, JobNimbus, and QuickBooks Online. This
              integration-heavy strategy allows CompanyCam to serve as a specialized field capture utility without
              requiring contractors to replace their existing operational systems. Nonetheless, the buyer journey is
              complicated by the total cost of ownership: pairing CompanyCam ($63 to $129/month) with a CRM like Jobber
              ($29 to $149/month) creates an aggregate monthly software spend of $92 to $278, creating budget scrutiny
              when competing all-in-one alternatives offer unified documentation and billing.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              CompanyCam's adoption trajectory is propelled by powerful operational tailwinds, but counterbalanced by
              structural market headwinds. The primary growth driver is industry labor scarcity: McKinsey projects that
              41% of the U.S. construction workforce will retire by 2031, forcing contractors to adopt software
              automation to bridge severe staffing deficits. Furthermore, construction rework accounts for 5% to 9% of
              total project costs—with Autodesk and FMI attributing 52% of rework to poor communication and bad
              data—creating urgent demand for timestamped visual verification that defends against disputes and
              substantiates billable change orders. However, adoption constraints remain acute. Surveys indicate that
              65% of construction firms have not adopted AI in any form, with 57% of contractors citing lack of accuracy
              trust and 49% of smaller firms citing software cost as primary barriers. Field technicians frequently
              encounter technical friction in low-connectivity rural or basement jobsites where mobile app syncing
              degrades, leading to lost photo uploads. Diligence gaps remain around precise contractor churn rates when
              pricing tiers adjust, as well as the long-term defensibility of standalone documentation against platform
              suites embedding native image capture.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Single-Purpose Software Squeeze in Contractor Tech Stacks
            body: >-
              CompanyCam faces a classic vertical SaaS tension: it offers an exceptional, best-of-breed mobile photo
              capture experience that field crews genuinely prefer over cumbersome enterprise apps. However, as vertical
              CRMs like Jobber, ServiceTitan, and Procore enhance their own mobile camera workflows, contractors face
              subscription fatigue. A solo operator paying $63/month for CompanyCam plus $29/month for Jobber pays
              $92/month across two disconnected vendors, creating an economic opening for all-in-one alternatives that
              combine photo proof, scheduling, and billing into a single subscription.
            calloutType: insight
            claimRefs:
              - CM002
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Market Segmentation
        blocks:
          - type: paragraph
            body: >-
              The contractor software ecosystem in 2026 is divided across three primary competitive tiers: specialized
              mobile-first documentation point solutions, trade-specific customer relationship management (CRM)
              platforms, and enterprise-grade end-to-end construction management suites. CompanyCam pioneered
              field-first visual documentation by allowing trade crews to capture GPS-tagged, time-stamped jobsite
              photos organized automatically by project address. While CompanyCam claims an installed base exceeding
              285,000 professionals across 79 million jobs with more than 60 platform integrations, its position as a
              standalone documentation utility is increasingly challenged by competitors attacking from both below and
              above. Below, lightweight point solutions like Manifold and SiteCam target budget-conscious contractors
              with flat pricing and mobile-first 3D measurement. Above, all-in-one platforms seek to eliminate
              standalone photo apps altogether by embedding camera tools into native project management and billing
              pipelines.
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP010
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP010
              - CP012
      - number: '3.2'
        title: Direct Alternatives and Vertical Trade Competitors
        blocks:
          - type: paragraph
            body: >-
              Direct alternatives focus specifically on addressing user friction surrounding CompanyCam's pricing and
              workflow gating. Manifold emerged as a prominent direct peer in 2026, offering flat per-user pricing with
              photo-required punch lists and computer-vision 3D scanning without requiring LiDAR hardware or multi-seat
              minimums. In vertical trades, specialized platforms represent an even more acute competitive threat. In
              roofing and exterior contracting—historically CompanyCam's core user stronghold—platforms like AccuLynx
              and JobNimbus combine customer lead tracking, material ordering, and aerial measurement with native photo
              capture. Similarly, subcontractor-focused tools like Onetrace incorporate health and safety document
              signing, GPS timesheets, and material variation logs alongside photographic evidence. Residential
              construction platforms like Projul and Buildertrend integrate photo logs directly into client portals and
              job costing, making a separate photo subscription redundant for builders who value operational
              consolidation over niche photo features.
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP009
              - CP010
              - CP013
      - number: '3.3'
        title: Workflow Capabilities and Feature Differentiation
        blocks:
          - type: paragraph
            body: >-
              Feature differentiation across the category centers on whether photo capture functions as an isolated
              record or as an active trigger for downstream commercial workflows. Historically, CompanyCam operated
              primarily as a visual repository and annotation tool. However, its March 2026 acquisition of San
              Francisco-based fintech startup Beam Finance Inc. signals a deliberate transition into estimating,
              invoicing, and subcontractor disbursements. By bridging visual jobsite progress with Beam's AI-assisted
              financial workflows, CompanyCam aims to provide verifiable proof-of-work for billing and progress
              payments. In contrast, direct rival Manifold emphasizes field inspection workflows, enforcing
              photo-required punch lists to prevent closeout disputes while keeping estimating and payments outside its
              product boundary. Meanwhile, enterprise suites like Procore and Autodesk Construction Cloud dominate
              commercial projects, leveraging native photo logs integrated directly into RFIs, submittals, and master
              budgets that effectively displace third-party point apps on large job sites.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP007
              - CP009
              - CP010
      - number: '3.4'
        title: Pricing Restructuring, Switching Costs, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              In 2026, CompanyCam restructured its pricing into three tiers: Core ($63/month annual for 1 user), Crew
              ($129/month annual for 3 users), and Scale ($199/month annual for 3 users), with additional users priced
              at $29/month. This packaging change drew competitor criticism because key field workflows, such as
              inspection checklists, require jumping from Core to Crew, forcing solo contractors or two-person crews to
              pay for unused phantom seats. Furthermore, 3D measurement and unlimited AI features are restricted to
              Scale, while the Marketing Suite was unbundled into a separate $79–$99/month add-on. To defend its market
              position against competitor benchmarking and feature replication, CompanyCam enforces strict contractual
              restrictions in its terms of service, prohibiting direct competitors from accessing the platform without
              express written consent. Nevertheless, as trade CRMs improve native photo capabilities, CompanyCam's
              long-term moat depends on proving that its standalone field usability and Beam-powered financial
              automation deliver sufficient ROI to justify an independent software line item.
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP010
              - CP011
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vulnerability to CRM and FSM Consolidation
            body: >-
              CompanyCam's core revenue base relies on trade contractors who increasingly seek to eliminate multi-app
              software fatigue. When vertical CRMs like AccuLynx or broader platforms like Projul introduce native photo
              capture, contractors face strong economic incentives to cancel their standalone photo documentation
              subscriptions.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP014
          - type: callout
            title: Strategic Expansion via Fintech and M&A
            body: >-
              The acquisition of Beam Finance Inc. marks CompanyCam's transition from a defensive point solution toward
              an operational hub that ties visual proof directly to subcontractor disbursements and invoice generation.
              However, bundled FSM features risk alienating price-sensitive contractors who only require basic photo
              synchronization.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Tiered Subscription Monetization
        blocks:
          - type: paragraph
            body: >-
              CompanyCam operates primarily on a software-as-a-service (SaaS) subscription model designed for
              contractors, specialty trades, and commercial builders. Core monetization is generated via per-user
              recurring subscriptions across Pro, Premium, and Elite tiers, with entry pricing starting at $19 per user
              per month. Customers contract on recurring monthly or annual terms that automatically renew unless
              explicitly canceled, creating a predictable baseline of recurring software revenue. Beyond seat licenses,
              CompanyCam has diversified its revenue mix through transaction-based monetization, incorporating payment
              processing fees for contractor invoices following its acquisition of construction fintech Beam Finance in
              March 2026. For larger multi-crew operators and enterprise general contractors, custom contracts introduce
              volume commitments, administrative controls, and dedicated onboarding, positioning the company to capture
              higher average revenue per account while preserving core self-serve contractor adoption.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI012
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
