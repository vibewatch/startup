      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Public evidence
      - What would change the view
    rows:
      - - Thesis
        - Broad contractor adoption
        - Company-issued claims of 285,000+ professionals
        - Paid-logo count and cohort retention by segment
      - - Thesis
        - Deep workflow footprint
        - Company-issued claim of use across 79 million jobs
        - Usage frequency, paid conversion, and expansion revenue
      - - Anti-thesis
        - Field reliability can impair mission-critical use
        - Recent Google Play anecdotes cite offline and upload failures
        - Support-ticket trends and uptime by connectivity condition
      - - Anti-thesis
        - AI and expansion evidence is not investment-grade
        - Official AI disclaimers and an unreviewed Built In synthesis
        - Verified acquisition economics, layoffs, AI adoption, and gross-margin impact
    notes: >-
      Company adoption figures are unaudited company claims; app-review evidence is anecdotal and the Built In synthesis
      explicitly disclaims verification.
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Audited growth, retention, and margins validate premium SaaS economics
        - Upper reported mark becomes testable only after a supported multiple and dilution model
        - No numeric probability supportable
        - Growth or retention misses the board plan
      - - Base
        - Adoption remains durable but operating metrics and cap-table detail stay private
        - The $1.41B-$2.0B public-mark envelope remains a context range, not fair value
        - Current evidence most directly supports this uncertainty
        - Diligence fails to reconcile financing and preference data
      - - Bear
        - Reliability issues, weak retention, or integration costs constrain growth
        - No public evidence supports a numerical floor or downside return
        - Recent app complaints are a monitor, not prevalence evidence
        - Material churn, prolonged outages, or adverse preference waterfall
    notes: >-
      Scenarios are conditional and deliberately omit probabilities, multiples, and target returns that cannot be
      supported by the assigned public evidence.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV010
      - CV013
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological milestone timeline spanning founding, seed grants, institutional venture rounds, unicorn valuation,
      and fintech product expansion from 2015 to 2026.
    data:
      items:
        - label: Founding in Lincoln, Nebraska
          date: '2015-07-01'
          detail: >-
            Luke Hansen launches the CompanyCam iOS application to solve jobsite photo organization for roofing
            contractors.
          tone: neutral
        - label: Nebraska Prototype Innovation Grant
          date: '2016-06-01'
          detail: >-
            Secures a $50,000 non-dilutive Prototype Grant from Nebraska's Business Innovation Act to build out cloud
            infrastructure.
          tone: positive
        - label: Series A Growth Financing
          date: '2020-06-29'
          detail: Closes $6 million Series A round led by Blueprint Equity to expand product development and regional sales.
          tone: positive
        - label: Series B Growth Financing
          date: '2021-10-27'
          detail: Raises $30 million Series B led by Insight Partners with JMI Equity and WndrCo, adding tier-one governance.
          tone: positive
        - label: Series C Unicorn Financing
          date: '2025-08-21'
          detail: >-
            Completes Series C round led by B Capital and Decades Holdings, reaching a $2.0 billion valuation as
            Nebraska's first unicorn.
          tone: positive
        - label: Fintech Acquisition of Beam Finance
          date: '2026-03-02'
          detail: >-
            Acquires California construction fintech startup Beam Finance to integrate AI estimating, invoicing, and
            payments.
          tone: positive
        - label: Marketing Workforce Restructuring
          date: '2026-06-26'
          detail: >-
            Executes selective workforce reductions in marketing and multimedia to prioritize AI product efficiency and
            ARR discipline.
          tone: warning
        - label: Field Product Scale & Android Refresh
          date: '2026-10-07'
          detail: Deploys updated field application supporting over 285,000 contractor users across 79 million projects.
          tone: neutral
