      - number: '1.3'
        title: Capitalization History, Unicorn Valuation, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              CompanyCam's funding trajectory illustrates an unusual Midwest growth pattern, ascending from early
              state-backed non-dilutive prototype grants to multi-billion-dollar capitalization. In 2016, the company
              secured a $50,000 Prototype Grant under Nebraska's Business Innovation Act, which enabled early technical
              validation without founder dilution and catalyzed seed participation from regional institutions Nelnet and
              Invest Nebraska. Institutional venture acceleration commenced with a $6 million Series A financing in June
              2020 led by Blueprint Equity, followed by an October 2021 Series B round of $30 million led by Insight
              Partners with participation from JMI Equity and WndrCo. In August 2025, CompanyCam finalized a landmark
              Series C growth transaction led by B Capital with participation from Decades Holdings. Data from private
              capital market research platform PitchBook indicates the Series C equity round totaled $415 million and
              established a $2.0 billion post-money valuation, cementing CompanyCam as the first tech unicorn in
              Nebraska history and creating substantial secondary liquidity across the regional technology ecosystem.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.4'
        title: Strategic Milestones, Platform Scaling, and Fintech Diversification
        blocks:
          - type: paragraph
            body: >-
              CompanyCam's operational expansion reflects a systematic progression from single-purpose photo logging to
              multi-product workflow orchestration. Following its App Store launch in July 2015, the platform achieved
              steady compounding adoption through word-of-mouth contractor referrals rather than aggressive customer
              acquisition spend. In March 2026, CompanyCam executed its first corporate acquisition by purchasing
              California-based construction fintech provider Beam Finance Inc., absorbing proprietary AI estimating,
              invoicing, payment processing, and project budgeting capabilities. This strategic transaction addresses a
              critical operational gap, expanding CompanyCam's footprint beyond jobsite documentation into financial
              workflows and transaction settlement. Complementing its core software enhancements, the company
              demonstrated a 300 percent annual expansion in AI-driven platform actions while actively exploring
              international footprint expansion into the United Kingdom and continental Europe.
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO008
              - CO011
