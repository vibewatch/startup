      - number: '4.3'
        title: Cost Structure, Hosting Overhead, and 2026 Restructuring
        blocks:
          - type: paragraph
            body: >-
              The operating cost structure of CompanyCam is dominated by software engineering, customer support, and
              platform infrastructure necessary to store and process hundreds of millions of jobsite photos. Unlike
              asset-heavy construction operations, capital expenditures remain low, with cost of goods sold primarily
              reflecting cloud hosting, image delivery, and integration maintenance. However, aggressive post-pandemic
              hiring created overhead pressures across go-to-market and multimedia functions. In response, CompanyCam
              executed a restructuring round on June 26, 2026, conducting workforce layoffs in marketing, multimedia,
              and non-core operational roles to sharpen operating margins. This workforce reduction marks a transition
              toward unit-level cost discipline and margin expansion, balancing accelerated investments in automated
              artificial intelligence tooling against corporate headcount growth.
            claimRefs:
              - CI007
              - CI008
              - CI010
      - number: '4.4'
        title: Capital Adequacy, Historical Traction, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              CompanyCam demonstrates verified top-line momentum, scaling from north of $20 million in ARR in July 2022
              to $68 million in 2024. In August 2025, the company completed a landmark Series C financing transaction
              led by B Capital that raised $415 million in equity capital at a $2.0 billion post-money valuation. This
              substantial capital injection provides multi-year balance sheet runway and eliminates near-term financing
              dependency. Nonetheless, CompanyCam remains a private company with material diligence blind spots.
              Critical underwriting inputs—including GAAP gross margins, cohort net revenue retention (NRR), and
              customer acquisition cost (CAC) payback periods—remain undisclosed private data. While the balance sheet
              is exceptionally well capitalized, underwriting the long-term sustainability of a $2.0 billion valuation
              on an SMB-heavy contractor base requires audited verification of cohort churn, payment take rates, and
              forward ARR acceleration.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI007
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
