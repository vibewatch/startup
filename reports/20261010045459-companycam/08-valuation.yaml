company:
  name: CompanyCam
chapter:
  number: 8
  title: Valuation
  summary: >-
    CompanyCam shows meaningful product adoption, but public evidence does not support a
    defensible entry price. Independent sources conflict between $1.41 billion and $2.0
    billion valuation marks and disagree sharply on total funding, so the appropriate
    posture is research-more pending audited operating metrics and cap-table verification.
sections:
  - id: decision-and-price-discipline
    title: Decision and price discipline
    body: >-
      The recommendation is research-more, with low confidence, high underwriting risk,
      and an unanchored valuation stance. Forge displays a $1.41 billion August 2025
      post-money valuation, while Tracxn and Silicon Prairie News report a $2.0 billion
      mark. Those figures are financing or database marks, not a demonstrated fair value,
      and Forge explicitly says its post-money value is estimated from company-submitted
      certificates rather than independently audited. Without current ARR, revenue growth,
      retention, gross margin, cash burn, or secondary-clearing evidence, neither mark can
      be converted into a reliable revenue multiple or target return. Entry discipline
      therefore requires verified operating data before negotiating price.
    claimRefs: [CV001, CV002, CV003, CV004, CV016]
    tableRefs: [TV001]
  - id: financing-and-cap-table-context
    title: Financing and cap-table context
    body: >-
      Public financing records are internally inconsistent. Forge reports a $415 million
      Series C and $453.41 million of total funding, and Silicon Prairie News attributes
      the same $415 million round amount to PitchBook. By contrast, FundedIQ counts only
      $30 million of disclosed capital across two recorded rounds, while Tracxn reports
      $36.3 million across five rounds. The most plausible explanation is divergent
      database scope, but the evidence does not establish whether the difference reflects
      primary issuance, secondary liquidity, debt, or omitted rounds. Forge displays a
      1.0x non-participating Series C preference; that is useful directional context, not
      a substitute for the charter, capitalization table, option pool, and waterfall.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV003]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis begins with usage breadth: CompanyCam says more than 285,000 professionals
      have used the platform across 79 million jobs, indicating a substantial contractor
      workflow footprint. The anti-thesis is that scale claims are company-issued and do
      not reveal paid logos, cohort retention, net revenue retention, or monetization.
      Product reliability also deserves weight. Recent Google Play reviewers described
      offline, upload, and blank-screen failures, while the official terms disclaim the
      accuracy and reliability of AI outputs. A Built In page mentions acquisition,
      growth, and layoff themes but labels its own content AI-generated and unreviewed, so
      those items are diligence leads rather than verified operating facts.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios-exit-and-diligence
    title: Scenarios, exit readiness, and diligence asks
    body: >-
      Scenario analysis must remain conditional rather than manufacture a precise return.
      A bull case requires audited growth, retention, and margin evidence strong enough to
      justify the upper public mark; a base case assumes durable adoption but leaves price
      unresolved; a bear case is triggered by weak retention, unreliable field performance,
      integration distraction, or an unfavorable preference waterfall. No probability
      percentages or terminal multiples are supportable from this pool. Exit readiness is
      likewise unproven because no filed prospectus, verified secondary price, or disclosed
      profitability data appears in the retained evidence. Final diligence should obtain
      audited financials, cohort metrics, a fully diluted cap table, preference documents,
      secondary transactions, and board-approved forecasts.
    claimRefs: [CV004, CV009, CV010, CV013, CV015, CV016]
    figureRefs: [FV001]
