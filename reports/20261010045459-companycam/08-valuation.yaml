callouts:
  - calloutType: recommendation
    title: Research more before pricing
    body: >-
      Require current audited operating metrics, a fully diluted capitalization table, and
      primary preference documents before converting a reported private-market mark into
      an entry valuation or target return.
    claimRefs: [CV004, CV009, CV010, CV016]
  - calloutType: risk
    title: Reported marks are not fair value
    body: >-
      The $1.41 billion and $2.0 billion figures have different provenance and should be
      treated as conflicting financing context, not endpoints of a validated valuation.
    claimRefs: [CV001, CV002, CV003, CV004]
