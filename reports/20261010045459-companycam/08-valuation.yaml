      - [Anti-thesis, "Field reliability can impair mission-critical use", "Recent Google Play anecdotes cite offline and upload failures", "Support-ticket trends and uptime by connectivity condition"]
      - [Anti-thesis, "AI and expansion evidence is not investment-grade", "Official AI disclaimers and an unreviewed Built In synthesis", "Verified acquisition economics, layoffs, AI adoption, and gross-margin impact"]
    notes: "Company adoption figures are unaudited company claims; app-review evidence is anecdotal and the Built In synthesis explicitly disclaims verification."
    claimRefs: [CV011, CV012, CV013, CV014, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Audited growth, retention, and margins validate premium SaaS economics", "Upper reported mark becomes testable only after a supported multiple and dilution model", "No numeric probability supportable", "Growth or retention misses the board plan"]
      - [Base, "Adoption remains durable but operating metrics and cap-table detail stay private", "The $1.41B-$2.0B public-mark envelope remains a context range, not fair value", "Current evidence most directly supports this uncertainty", "Diligence fails to reconcile financing and preference data"]
      - [Bear, "Reliability issues, weak retention, or integration costs constrain growth", "No public evidence supports a numerical floor or downside return", "Recent app complaints are a monitor, not prevalence evidence", "Material churn, prolonged outages, or adverse preference waterfall"]
    notes: "Scenarios are conditional and deliberately omit probabilities, multiples, and target returns that cannot be supported by the assigned public evidence."
    claimRefs: [CV001, CV002, CV003, CV004, CV010, CV013, CV016]
