  - calloutType: risk
    title: 'Downside Thesis: Offline Field Fragility and CRM Displacement'
    body: CompanyCam's core defensive moat rests on frictionless field-level crew adoption. However, contractor vulnerability to stalled offline photo synchronization in rural areas, paired with the risk of core CRMs like AccuLynx and Procore bundling improved native camera modules, creates a credible thesis-break mechanism where contractors eliminate point-solution seat costs [CR005, CR009, CR011, CR013].
    claimRefs:
      - CR005
      - CR009
      - CR011
      - CR013
