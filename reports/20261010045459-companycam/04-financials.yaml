company:
  name: "CompanyCam"
chapter:
  number: 4
  title: "Financials"
  summary: "CompanyCam has established a robust recurring revenue foundation centered on tiered SaaS subscriptions, with historical ARR expanding from north of $20M in 2022 to $68M in 2024 across 285,000 active trade professionals. A $415M Series C led by B Capital at a $2.0B valuation provides substantial capital adequacy, even as a June 2026 workforce reduction and expansion into payments via Beam Finance signal an ongoing pivot toward operating margin discipline and monetization breadth amid private unit economics opacity."
sections:
  - id: "revenue-streams-and-pricing-model"
    title: "Revenue Streams and Tiered Subscription Monetization"
    body: "CompanyCam operates primarily on a software-as-a-service (SaaS) subscription model designed for contractors, specialty trades, and commercial builders. Core monetization is generated via per-user recurring subscriptions across Pro, Premium, and Elite tiers, with entry pricing starting at $19 per user per month. Customers contract on recurring monthly or annual terms that automatically renew unless explicitly canceled, creating a predictable baseline of recurring software revenue. Beyond seat licenses, CompanyCam has diversified its revenue mix through transaction-based monetization, incorporating payment processing fees for contractor invoices following its acquisition of construction fintech Beam Finance in March 2026. For larger multi-crew operators and enterprise general contractors, custom contracts introduce volume commitments, administrative controls, and dedicated onboarding, positioning the company to capture higher average revenue per account while preserving core self-serve contractor adoption."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI006"
      - "CI012"
      - "CI013"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "gtm-motion-and-sales-efficiency"
    title: "Go-to-Market Motion and Inbound Sales Economics"
    body: "CompanyCam's go-to-market motion combines product-led adoption across trade field crews with an inside sales engine focused on converting inbound interest into paying contractor accounts. Inside Sales Representatives are tasked with qualifying inbound leads and executing three to five tailored product demonstrations daily, targeting trade business owners and project managers. Sales compensation models reflect this inside velocity, pairing a base salary of $44,000 with average on-target earnings of approximately $135,000 under uncapped commissions. This sales motion has successfully expanded the user base to over 285,000 active trade professionals across 79 million documented construction projects. To support cross-functional operational alignment and revenue forecasting as this hybrid GTM motion scales, finance leadership integrated Pigment to model sales quotas, pipeline progression, and workforce assumptions within a unified operational planning architecture."
    claimRefs:
      - "CI001"
      - "CI006"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-operating-discipline"
    title: "Cost Structure, Hosting Overhead, and 2026 Restructuring"
    body: "The operating cost structure of CompanyCam is dominated by software engineering, customer support, and platform infrastructure necessary to store and process hundreds of millions of jobsite photos. Unlike asset-heavy construction operations, capital expenditures remain low, with cost of goods sold primarily reflecting cloud hosting, image delivery, and integration maintenance. However, aggressive post-pandemic hiring created overhead pressures across go-to-market and multimedia functions. In response, CompanyCam executed a restructuring round on June 26, 2026, conducting workforce layoffs in marketing, multimedia, and non-core operational roles to sharpen operating margins. This workforce reduction marks a transition toward unit-level cost discipline and margin expansion, balancing accelerated investments in automated artificial intelligence tooling against corporate headcount growth."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI010"
  - id: "capital-adequacy-and-financial-verdict"
    title: "Capital Adequacy, Historical Traction, and Diligence Blockers"
    body: "CompanyCam demonstrates verified top-line momentum, scaling from north of $20 million in ARR in July 2022 to $68 million in 2024. In August 2025, the company completed a landmark Series C financing transaction led by B Capital that raised $415 million in equity capital at a $2.0 billion post-money valuation. This substantial capital injection provides multi-year balance sheet runway and eliminates near-term financing dependency. Nonetheless, CompanyCam remains a private company with material diligence blind spots. Critical underwriting inputs—including GAAP gross margins, cohort net revenue retention (NRR), and customer acquisition cost (CAC) payback periods—remain undisclosed private data. While the balance sheet is exceptionally well capitalized, underwriting the long-term sustainability of a $2.0 billion valuation on an SMB-heavy contractor base requires audited verification of cohort churn, payment take rates, and forward ARR acceleration."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI007"
      - "CI014"
    tableRefs:
      - "TI003"
