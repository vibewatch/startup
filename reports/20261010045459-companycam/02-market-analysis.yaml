callouts:
  - calloutType: "insight"
    title: "The Single-Purpose Software Squeeze in Contractor Tech Stacks"
    body: "CompanyCam faces a classic vertical SaaS tension: it offers an exceptional, best-of-breed mobile photo capture experience that field crews genuinely prefer over cumbersome enterprise apps. However, as vertical CRMs like Jobber, ServiceTitan, and Procore enhance their own mobile camera workflows, contractors face subscription fatigue. A solo operator paying $63/month for CompanyCam plus $29/month for Jobber pays $92/month across two disconnected vendors, creating an economic opening for all-in-one alternatives that combine photo proof, scheduling, and billing into a single subscription."
    claimRefs:
      - "CM002"
      - "CM011"
      - "CM012"
