      - number: '2.3'
        title: 买方分层、预算归属与技术栈集成
        blocks:
          - type: paragraph
            body: >-
              不同规模承包商的采用动力和采购路径差异很大。在小型住宅专业承包企业（1 to 10 名员工）中，经济买方通常是业主兼经营者，他们亲自用信用卡购买软件，以消除晚间文书工作并减少财产损坏纠纷。在中型专业承包公司（11
              to 49 名员工）中，预算决策权转移到总经理或运营负责人，他们希望强化团队问责并统一工地检查清单。在企业级商业承包商（50+ 名员工）中，采购涉及 IT
              和风险管理团队，重点关注单点登录（SSO）、数据安全和多地点治理。在所有细分市场，CompanyCam 的 GTM 模式都依赖高度生态互操作性，与 Jobber、AccuLynx、JobNimbus 和
              QuickBooks Online 等主要行业 CRM 和 FSM 保持 50 to 60 项以上集成。这种重集成策略让 CompanyCam
              能充当专业化现场采集工具，无需承包商替换现有运营系统。不过，所有权总成本会让买方旅程变复杂：CompanyCam（$63 to $129/month）加上 Jobber 等 CRM（$29 to
              $149/month），每月软件支出合计达到 $92 to $278；当一体化替代方案提供统一文档和开票时，预算审查会更加严格。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 的采用轨迹受到强劲运营顺风推动，但也被结构性市场逆风抵消。首要增长驱动是行业劳动力短缺：McKinsey 预计，到 2031 年美国建筑劳动力的 41%
              将退休，迫使承包商采用软件自动化来弥补严重的人手缺口。此外，返工占项目总成本的 5% to 9%；Autodesk 和 FMI 认为，其中 52%
              源于沟通不良和数据质量差。这推动市场急需带时间戳的视觉核验，用来应对纠纷并证明可计费的变更订单。然而，采用约束依然很强。调查显示，65% 的建筑企业尚未以任何形式采用 AI；57%
              的承包商认为准确性缺乏可信度，49%
              的小型企业认为软件成本是主要障碍。在网络连接差的农村或地下室工地，现场技术人员经常遇到移动应用同步退化的技术摩擦，导致照片上传丢失。定价层级调整时承包商的准确流失率，以及独立文档工具抵御内置原生图像采集平台套件的长期能力，也仍存在尽调缺口。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 承包商技术栈中的单一用途软件挤压
            body: >-
              CompanyCam 面临典型的垂直 SaaS 张力：它提供出色的最佳单点移动照片采集体验，现场团队确实更喜欢它，而不是笨重的企业应用。但随着 Jobber、ServiceTitan 和 Procore 等垂直
              CRM 改进自有移动相机工作流，承包商开始产生订阅疲劳。一名个人经营者每月为 CompanyCam 支付 $63/month、为 Jobber 支付 $29/month，在两个彼此割裂的供应商上合计支出
              $92/month，这为把照片证据、排期和开票合并到一个订阅中的一体化替代方案创造了经济机会。
            calloutType: insight
            claimRefs:
              - CM002
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场分层
        blocks:
          - type: paragraph
            body: >-
              2026 年的承包商软件生态分为三个主要竞争层级：移动优先的专业化照片文档点解决方案、面向专业工种的客户关系管理（CRM）平台，以及企业级端到端建筑管理套件。CompanyCam
              率先提供现场优先的视觉文档，让专业工种团队采集带 GPS 和时间戳的工地照片，并按项目地址自动整理。尽管 CompanyCam 声称已有超过 285,000 名专业用户、覆盖 79 million 个项目，并拥有
              60 多项平台集成，但它作为独立文档工具的地位正受到上下两端竞争者的夹击。下方的 Manifold 和 SiteCam 等轻量点解决方案，以统一定价和移动优先的 3D
              测量吸引预算敏感型承包商。上方的一体化平台则将相机工具嵌入原生项目管理和开票流程，试图彻底消除独立照片应用。
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP010
              - CP012
              - CP013
