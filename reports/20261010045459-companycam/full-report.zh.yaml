      - number: '1.2'
        title: 高管领导、公司治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 的公司治理和战略执行以创始人兼首席执行官 Luke Hansen 为核心。Hansen 曾是专业屋顶承包商，对行业的了解让他能直接理解工人和现场运营人员的处境。更广泛的管理团队包括首席财务官
              Tullen Mabbutt，他负责推动公司从区域种子补助到后期成长股权的风险资本化；高级传播经理 Haley Gonzales
              则负责公开披露和员工协同。公司治理包含主要股东的机构董事会代表，其中有一级风险投资机构 Insight Partners 和成长资本领投方 B Capital，并采用 3
              人公司董事会结构。为留住人才并统一经济利益，CompanyCam 设立了覆盖面广的员工股权激励计划，让林肯总部和分布式团队的员工直接参与公司估值增长。关键人物依赖仍集中在创始人 Luke Hansen
              身上；他的公众形象和以客户为中心的产品理念，是公司的首要战略指引。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO010
