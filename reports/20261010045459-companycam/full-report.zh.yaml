chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、商业使命与平台架构
        blocks:
          - type: paragraph
            body: >-
              CompanyCam, Inc. 由 Luke Hansen 于 2015 年在内布拉斯加州林肯市创立，目标是消除施工现场的照片混乱和沟通失误。Hansen 在家族屋顶公司 White Castle
              Roofing 管理照片证据时遇到运营摩擦，平台正是由此起步，并被设计成按 GPS 位置、时间戳和项目地址自动整理工地照片与视频。过去十年间，CompanyCam
              已从现场照片工具演变为完整的工地文档操作系统，服务超过 285,000 名承包商专业人士，覆盖超过 79 million 个有文档记录的施工项目。核心平台采用多层云端
              Software-as-a-Service（SaaS）订阅模式，包含移动应用、桌面控制台，以及与行业现场服务管理和客户关系管理套件的 50
              多项集成。近期产品加入了面向现场的人工智能能力，用于自动完成语音驱动的检查清单创建、现场团队多语言翻译和即时项目报告生成；与此同时，正式服务条款明确声明不保证自动生成内容的可靠性。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO012
