        - 客服工单趋势，以及不同连接条件下的运行时间
      - - 反论
        - AI 与扩张证据达不到投资级别
        - 官方 AI 免责声明和未经审阅的 Built In 综合材料
        - 已核实的收购经济性、裁员、AI 采用率和毛利率影响
    notes: 公司采用数据是未经审计的公司口径；应用评论证据属于轶闻，且 Built In 综合材料明确声明未经过核实。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计的增长、留存和利润率验证高溢价 SaaS 经济性
        - 只有在有依据的倍数和稀释模型出现后，报道中的高位估值才可检验
        - 没有可支持的数值概率
        - 增长或留存未达董事会计划
      - - 基准
        - 采用保持稳健，但运营指标和股权结构表细节仍属非公开信息
        - $1.41B-$2.0B 的公开估值范围仍只是背景区间，不是公允价值
        - 当前证据最直接支持这种不确定性
        - 尽调无法调和融资与优先权数据
      - - 悲观
        - 可靠性问题、留存疲弱或集成成本限制增长
        - 没有公开证据支持数值化底价或下行回报
        - 近期应用投诉值得监测，但不能证明普遍程度
        - 大规模流失、长期中断或不利的优先权瀑布
    notes: 情景均为条件性判断，并有意省略指定公开证据无法支持的概率、倍数和目标回报。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV010
      - CV013
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理从 2015 年至 2026 年的创立、种子资助、机构风险投资轮次、独角兽估值和金融科技产品扩张里程碑。
    data:
      items:
        - label: 在内布拉斯加州林肯市创立
          date: '2015-07-01'
          detail: Luke Hansen 推出 CompanyCam iOS 应用，解决屋面承包商的工地照片整理问题。
          tone: neutral
        - label: 内布拉斯加原型创新资助
          date: '2016-06-01'
          detail: 从 Nebraska's Business Innovation Act 获得 50,000 美元非稀释性原型资助，用于建设云基础设施。
          tone: positive
        - label: A 轮增长融资
          date: '2020-06-29'
          detail: Blueprint Equity 领投 600 万美元 A 轮，扩大产品开发和区域销售。
          tone: positive
        - label: B 轮增长融资
          date: '2021-10-27'
          detail: Insight Partners 领投 3,000 万美元 B 轮，JMI Equity 和 WndrCo 参投，并增加一线治理。
          tone: positive
        - label: C 轮独角兽融资
          date: '2025-08-21'
          detail: 完成由 B Capital 和 Decades Holdings 领投的 C 轮融资，估值达到 $2.0 billion，成为内布拉斯加州首家独角兽。
          tone: positive
        - label: 收购金融科技公司 Beam Finance
          date: '2026-03-02'
          detail: 收购加州建筑金融科技初创公司 Beam Finance，以整合 AI 估价、开票和支付。
          tone: positive
        - label: 营销团队重组
          date: '2026-06-26'
          detail: 对营销和多媒体团队进行有选择的裁员，优先提升 AI 产品效率并严守 ARR 纪律。
          tone: warning
        - label: 现场产品规模化与 Android 更新
          date: '2026-10-07'
          detail: 部署更新后的现场应用，支持超过 285,000 名承包商用户，覆盖 7,900 万个项目。
          tone: neutral
    approximationNotes: 里程碑日期来自官方新闻稿、App Store 更新和经核实的历史商业记录。
    claimRefs:
      - CO001
      - CO005
      - CO006
      - CO007
      - CO008
      - CO011
      - CO013
      - CO015
  - id: FM001
    title: 承包商记录市场规模与采用层级
    type: pyramid
    summary: 用分层市场规模金字塔表示可服务市场，从美国建筑业总劳动力逐层缩小到 CompanyCam 的活跃用户范围。
    approximationNotes: 工人数量来自美国 BLS 2025 年 5 月数据；平台规模和用户数量来自 CompanyCam 2026 年官方发布；市场份额来自 6sense 2026 年数据。
    data:
      items:
        - label: 宏观现场劳动力 TAM：6.4M 名工人
          detail: 640 万名美国建筑与采掘业工人（BLS 2025 年 5 月），涵盖住宅、商业和土木等所有专业。
        - label: 承包商企业 TAM：约 500K 家门店
          detail: 北美预计有 500,000+ 家专业和综合贸易承包商企业。
        - label: 已追踪 FSM 商业部署：39K+ 个域名
          detail: 6sense 技术画像追踪到的、部署垂直现场服务管理软件的商业网站域名。
        - label: 领先 FSM 软件部署：19.8K 个域名
          detail: 三家领先 FSM 厂商（UpKeep、ServiceTitan、Intuit Field Service）的机构部署合计。
        - label: CompanyCam 平台覆盖：285K+ 名专业人士
          detail: 285,000+ 名活跃承包商专业人士使用 CompanyCam，覆盖 7,900 万个有记录的工地。
        - label: CompanyCam 机构客户域名：1.1K 个域名
          detail: 6sense 技术画像指数追踪到 1,124 个使用 CompanyCam 的商业客户网站域名（份额 2.87%）。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 将承包商技术版图中的平台功能广度与现场团队易用性和采用速度进行对照。
    data:
      points:
        - label: CompanyCam
          x: 35
          'y': 85
          detail: 现场易用性高的点工具，借助 Beam 向金融科技扩张
        - label: Manifold
          x: 20
          'y': 88
          detail: 低成本照片记录与 3D 扫描点解决方案
        - label: SiteCam
          x: 15
          'y': 80
          detail: 带平面图定位功能的入门级照片检查工具
        - label: Onetrace
          x: 50
          'y': 78
          detail: 面向专业分包商的合规与记录平台
        - label: Projul
          x: 68
          'y': 65
          detail: 面向住宅承包商的中端一体化 FSM 平台
        - label: AccuLynx
          x: 72
          'y': 62
          detail: 面向屋面施工的专业垂直 CRM 与项目套件
        - label: Procore
          x: 92
          'y': 42
          detail: 学习曲线陡峭的企业级建筑管理套件
    approximationNotes: 定位坐标是基于已记录功能范围（横轴，0-100）和现场团队易采用程度（纵轴，0-100）的序数评估，依据为承包商评测指南。
    claimRefs:
      - CP003
      - CP004
      - CP007
      - CP008
      - CP010
      - CP012
  - id: FI001
    title: CompanyCam 收入与现金转化流程
    type: flow
    summary: 将承包商现场记录转化为经常性订阅收入和支付交易量的工作流阶段。
    approximationNotes: 示意性运营流程基于 CompanyCam 订阅定价条款、Beam Finance 集成披露和 Pigment FP&A 案例研究。
    claimRefs:
      - CI001
      - CI006
      - CI008
      - CI010
      - CI011
      - CI012
    data:
      nodes:
        - id: contractor-inbound
          label: 承包商线索流入
          description: 贸易企业注册试用，或由 Inside Sales 筛选合格线索（每天 3-5 次演示）。
          tone: neutral
        - id: user-subscription
          label: 分层 SaaS 订阅
          description: Pro、Premium 和 Elite 套餐按月 / 按年转化席位，起价为 $19/user/month。
          tone: positive
        - id: field-documentation
          label: 现场项目记录
          description: 超过 285,000 名活跃贸易专业人士在 79M 个项目中拍摄照片、填写清单并更新项目。
          tone: positive
        - id: fintech-expansion
          label: 支付与开票附加服务
          description: 通过 Beam Finance 集成开具发票并处理支付。
          tone: opportunity
        - id: opex-allocation
          label: 运营费用与员工
          description: Pigment FP&A 对员工成本、销售佣金（OTE $135k）和基础设施建模。
          tone: warning
        - id: net-cash-conversion
          label: 净现金流与资产负债表
          description: $415M C 轮注资为多年运行周期提供缓冲，支撑 ARR 持续增长。
          tone: positive
      edges:
        - from: contractor-inbound
          to: user-subscription
          label: 内部销售转化
        - from: user-subscription
          to: field-documentation
          label: 平台部署
        - from: field-documentation
          to: fintech-expansion
          label: 工作流变现
        - from: fintech-expansion
          to: opex-allocation
          label: 平台成本与托管
        - from: opex-allocation
          to: net-cash-conversion
          label: 现金利润率传导
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构模型，展示 CompanyCam 的移动采集、AI 处理、存储接入和合作伙伴 API 集成链路。
    data:
      layers:
        - label: 现场移动应用层
          detail: 原生 iOS 和 Android 客户端，支持离线本地缓存和相机控制
        - label: AI 与智能工作流引擎
          detail: 语音转写、自动生成现场巡视摘要和每日项目日志
        - label: 项目组织与协作核心
          detail: 项目元数据索引、标签体系、用户权限模型和实时信息流
        - label: 存储与媒体接入流水线
          detail: 异步图像处理、元数据提取、AWS S3 持久化和 CDN 缓存
        - label: 集成与合作伙伴 API 网关
          detail: 面向承包商 CRM 的 RESTful 集成端点、Webhooks 和合作伙伴连接器
        - label: 核心后端与数据持久化
          detail: 基于 PostgreSQL 关系型数据库的 Ruby on Rails 单体应用服务
    approximationNotes: 架构组件根据工程规格、技术招聘信息和官方集成文档推断。
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE007
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 公开证据支持一个六阶段运营旅程，但可测量的转化率和留存率仍不可得。
    data:
      items:
        - label: 记录痛点
          description: 一家贸易企业需要按项目整理工地照片。
          touchpoints:
            - 照片记录
            - 施工队与客户更新
        - label: 小团队进入
          description: 企业所有者或运营负责人引入现场记录层。
          touchpoints:
            - 小企业定位
            - 3 至 15 人评审者的最佳适配区间
        - label: 施工队采用
          description: 现场用户采集记录，办公室跟进项目进度。
          touchpoints:
            - 移动采集
            - 当前主页客户证言
        - label: 工作流扩展
          description: 账户增加席位、集成、报告或 AI 辅助任务。
          touchpoints:
            - 按席位计价的经济性
            - AI 工作流采用
        - label: 平台决策
          description: 买方将专业层与更广泛的建筑套件进行比较。
          touchpoints:
            - 单点解决方案深度
            - 全套方案整合
        - label: 续订或退出
          description: 订阅续期，或客户在终止后取回数据。
          touchpoints:
            - 自动续订截止日
            - 六个月取回窗口
    approximationNotes: 该序列用于分析，并非经过测量的漏斗；公开信息未披露转化率、各阶段规模或阶段耗时数据。
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 风险矩阵从可能性、影响、缓解措施成熟度和残余严重性四个维度，映射六种关键的运营、合作伙伴、法律和财务失效模式。
    claimRefs:
      - CR004
      - CR007
      - CR010
      - CR013
      - CR014
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
        - 残余严重性
      rows:
        - label: 线下现场上传卡顿
          values:
            - 高
            - 高
            - 部分
            - 高
        - label: CRM 原生照片替代
          values:
            - 中
            - 高
            - 中等
            - 高
        - label: AI 功能不准确与责任风险
          values:
            - 中
            - 高
            - 仅合同约束
            - 中
        - label: 缺少项目冻结 / 误删
          values:
            - 中
            - 中
            - 低
            - 中
        - label: 重复地址导致碎片化
          values:
            - 高
            - 中
            - 低
            - 中
        - label: AWS 单云中断
          values:
            - 低
            - 严重
            - 已建立
            - 中
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链将产品采用证据与尚未解决的定价和下行风险证据分开。
    data:
      nodes:
        - id: adoption
          label: 采用信号
          detail: 公司宣称拥有 285,000+ 名专业人士和 7900 万个工作单。
        - id: financing
          label: 融资冲突
          detail: 已记录的融资总额介于 $30M 和 $453.41M 之间。
        - id: marks
          label: 估值冲突
          detail: 公开估值介于 $1.41B 和 $2.0B 之间。
        - id: preferences
          label: 部分优先权视图
          detail: Forge 展示了 1.0x 不参与分配的 Series C 条款，但完整的清算分配瀑布尚未得到验证。
        - id: downside
          label: 下行风险尽调
          detail: 可靠性轶闻和未经验证的运营事件说法需要一手证据。
        - id: decision
          label: 继续研究
          detail: 在取得经审计指标和股权结构表文件前，暂缓判断价格。
      edges:
        - source: adoption
          target: financing
          label: 无法解决
        - source: financing
          target: marks
          label: 造成
        - source: marks
          target: preferences
          label: 需要
        - source: preferences
          target: downside
          label: 延伸至
        - source: downside
          target: decision
          label: 支持
    approximationNotes: 这是定性的决策序列；节点顺序不代表数值权重或转化关系。
    claimRefs:
      - CV004
      - CV009
      - CV010
      - CV013
      - CV015
      - CV016
