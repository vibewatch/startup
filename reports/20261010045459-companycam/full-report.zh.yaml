      - number: '6.3'
        title: 持久性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              公开证据没有披露 NRR、GRR、logo 流失、续约率、队列行为、合同期限分布或大客户集中度。因此，现有风险信号描述的是机制，而不是测量得到的流失。Fervor
              报告称，有用户抱怨检查清单访问权限要求购买每月额外 $50 的计划；SymTerra 则以无限用户定价对比其所描述的 CompanyCam 每位用户每月 $27–$34
              模式。这两者分别是次级评价和竞争者对比，并非独立的队列证据。CompanyCam
              自己的条款更清楚地揭示了采购摩擦：订阅除非在续订日前取消，否则会自动续订；最终订阅期限结束后，客户数据可按要求保留六个月。扩张可以来自更多席位、更多工作流或更深的集成，但 QuoteIQ
              和其他全套竞争者明确以整合能力对抗独立文档品类。Built In 未经审阅的 AI
              生成简介同样警告，更广泛建筑平台中的原生照片工具可能挤出点解决方案。因此，在有信心评估持久性之前，投资判断需要私有的队列和集中度数据。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 持久性无法通过公开信息衡量
            body: 广泛的采用计数和具名客户评价不能替代 NRR、GRR、logo 流失、续约队列、合同期限或大客户集中度。这些私有指标是本章决定性的尽调请求。
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与知识产权风险
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 的法律风险主要由客户服务条款、知识产权边界和数据合规标准决定。平台采用软件即服务模式，在美国境内的 Amazon Web Services
              基础设施上托管敏感的工地照片、位置数据和客户项目记录 [CR002, CR008]。为隔离自动分析责任，CompanyCam 的客户协议明确免除人工智能功能的准确性、可靠性和不侵权保证，并在法律上将检查和核验
              AI 生成的报告、检查清单及损坏摘要的责任全部转给承包商 [CR001]。此外，CompanyCam
              执行严格的争议解决机制，要求依据美国仲裁协会规则在内布拉斯加州兰开斯特县进行最终且具有约束力的个人仲裁，并明确放弃客户接受陪审团审判或参与集体诉讼的权利
              [CR003]。合同总责任上限为客户在此前十二个月支付的费用 [CR004]。主要剩余风险来自州层面对集体仲裁弃权的挑战，或承包商保险公司因自动检查输出错误而寻求赔偿的客户争议 [CR001, CR004]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营可靠性与现场故障模式
        blocks:
          - type: paragraph
            body: >-
              在工地上，CompanyCam 的核心价值主张依赖即时采集、地理标记和视觉进度记录的云端上传
              [CR008]。但独立软件目录和移动应用商店中的承包商评价记录显示，在信号弱或偏远的建筑区域运行时，平台存在持续的故障模式 [CR005]。技术人员反映，GPS
              索引经常卡住；离线照片队列在重新获得网络覆盖后无法可靠同步；离线缓存出现故障时，现场团队偶尔会遭遇数据完全丢失
              [CR005]。在风暴修复屋顶等保险密集型工作流中，未记录的检查或丢失的照片序列会损害保险公司补充审批和保修抗辩文档
              [CR005]。此外，平台缺少管理层面的项目锁定功能，因此已完成的物业文件可能被仍保有账户编辑权限的现场员工意外修改或删除
              [CR006]。承包商还会因重复生成地址而承担运营负担：多个团队为同一物业创建记录时无法无损合并项目历史，最终形成需要人工管理清理的碎片化照片资料库 [CR007]。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: 生态集成与 CRM 合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 是一种专业化点解决方案，旨在无缝集成到更广泛的承包商技术栈，而不是取代全套客户关系管理或现场服务管理平台 [CR009]。虽然公司与 AccuLynx、JobNimbus、Jobber 和
              Roofr 等超过 50 家行业软件供应商保持活跃 API 集成，但这种架构也带来显著的交易对手风险和去中介化风险 [CR009]。CompanyCam 与合作伙伴 CRM 之间的照片同步主要是单向推送，因此
              CRM 内建立的组织层级或文件夹结构不会同步回 CompanyCam [CR010]。此外，自动同步流程由地址匹配逻辑控制，采集时街道地址的小拼写错误可能产生孤立且未链接的项目文件夹 [CR010]。随着专业屋顶
              CRM 以及 Procore 等综合建筑平台增强原生相机和照片标注模块，CompanyCam 持续承受压力，需要证明单独的按席位订阅成本值得支付，而嵌入式工具可以消除外部集成依赖 [CR009, CR013]。
            claimRefs:
              - CR009
              - CR010
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 财务模型、扩张与下行缓释
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 在 2026 年 3 月收购 Beam Finance Inc. 后，从纯视觉文档扩展到支付、开票和 AI 辅助项目估算，因而面临独特的模型扩张和资本配置风险 [CR014]。Core
              计划的入门价格为每月 $79（年付 $63），但扩张中的承包商团队在 Crew 层级每增加一名用户，每月需支付 $34 的席位费，导致超过十名现场工人的团队价格大幅上涨
              [CR011]。为保护利润率，CompanyCam 通过 Core 和 Crew 计划中严格的月度 credit 配额限制高级 AI 功能，令高用量承包商在月中用完额度时产生用户摩擦
              [CR012]。与此同时，2026 年 6 月削减营销和多媒体岗位的员工重组，凸显公司在产品整合期间维持 ARR 效率和严格现金消耗纪律的内部压力 [CR014]。在企业建筑层级，Autodesk
              Construction Cloud 和 Procore 等主导者拥有根深蒂固的主服务协议和原生采集套件，限制 CompanyCam 在没有大幅利润率折扣的情况下赢得企业级总承包商账户 [CR013]。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR007
              - CR010
              - CR013
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 下行论点：现场离线脆弱性与 CRM 替代
            body: >-
              CompanyCam 的核心防御护城河在于现场团队能够无摩擦采用。但承包商在农村地区容易遭遇离线照片同步卡顿，同时 AccuLynx 和 Procore 等核心 CRM
              可能捆绑更强的原生相机模块；两者结合，形成了可信的论点破坏机制，承包商可能因此取消点解决方案的席位费用 [CR005, CR009, CR011, CR013]。
            calloutType: risk
            claimRefs:
              - CR005
              - CR009
              - CR011
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议继续研究，当前置信度低、投资判断风险高，估值立场也缺乏锚定。Forge 展示了 2025 年 8 月投后估值 14.1 亿美元，Tracxn 和 Silicon Prairie News 则报道了 20
              亿美元的估值。这些数字是融资或数据库口径，并非经过证明的公允价值；Forge 还明确表示，其投后价值是根据 公司提交的证书估算得出，未经独立审计。在缺少当前
              ARR、收入增长、留存率、毛利率、现金消耗或二级市场成交证据的情况下，任何一个估值都无法换算成 可靠的收入倍数或目标回报。因此，在议价前必须先核实经营数据，才能守住入场纪律。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV013
              - CV016
      - number: '8.2'
        title: 融资与股权表背景
        blocks:
          - type: paragraph
            body: >-
              公开融资记录前后不一致。Forge 报告称完成了 4.15 亿美元的 C 轮融资、累计融资 4.5341 亿美元，Silicon Prairie News 也将同一轮 4.15 亿美元归因于
              PitchBook。相比之下，FundedIQ 只统计出两轮记录融资中的 3000 万美元披露资本，Tracxn 则报告五轮合计 3630 万美元。最合理的
              解释是各数据库的统计范围不同，但现有证据无法证明差额究竟来自首次发行、二级流动性、债务，还是遗漏的轮次。Forge 展示了 1.0 倍、非参与型的 C
              轮清算优先权；这只能提供方向性背景，不能替代公司章程、资本化表、期权池和清算瀑布。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV013
              - CV016
      - number: '8.3'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点首先落在使用覆盖面：CompanyCam 表示，已有超过 285,000 名专业人士在 7900 万个项目中使用该平台，说明其在承包商工作流中已经占据相当
              位置。反论点是，这些规模主张均由公司发布，无法说明付费客户数、群组留存、净收入留存或变现情况。产品可靠性也值得重点核查。近期 Google Play 用户评论提到离线、上传和白屏故障，而官方条款则对 AI
              输出的准确性和可靠性免责。Built In 的一个页面提到收购、增长和裁员，但同时标注其内容由 AI 生成且未经审核，因此这些信息只能作为尽调线索，不能当作已验证的经营事实。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 情景、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              情景分析必须保留条件性，不能凭空制造精确回报。乐观情景需要经审计的增长、留存和利润率证据，强度要足以支撑公开估值区间的上端；基准情景假设采用
              持续，但价格仍未确定；悲观情景则由疲弱留存、不可靠的现场表现、集成分散注意力或不利的清算优先权瀑布触发。基于这批证据，任何概率百分比或终值倍数
              都缺乏支持。退出准备度同样尚未得到证明，因为留存证据中没有已提交的招股说明书、经核实的二级市场价格或披露的盈利数据。最终尽调应取得经审计财务报表、
              群组指标、完全摊薄股权结构表、优先权文件、二级交易记录和董事会批准的预测。
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV013
              - CV015
              - CV016
