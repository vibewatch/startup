              users，$199/month annual），额外用户每人 $29/month。这一套餐调整引发了竞争者批评，因为检查清单等关键现场工作流需要从 Core 跳到
              Crew，迫使个人承包商或两人团队为未使用的幽灵席位付费。此外，3D 测量和无限 AI 功能仅限 Scale，Marketing Suite 则拆分为单独的 $79–$99/month
              附加组件。为抵御竞争对标和功能复制，CompanyCam 在服务条款中设置严格的合同限制，禁止直接竞争者未经书面明确同意访问平台。不过，随着专业工种 CRM 改进原生照片能力，CompanyCam
