        title: 展示材料
        blocks:
          - type: callout
            title: 定价前继续研究
            body: 在把报道中的私募市场估值转为入场估值或目标回报前，要求提供最新的经审计经营指标、完全摊薄股权结构表和优先权原始文件。
            calloutType: recommendation
            claimRefs:
