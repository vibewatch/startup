              - CO015
      - number: '1.5'
        title: 运营逆风、企业替代风险与尽调重点
        blocks:
          - type: paragraph
            body: >-
              尽管估值里程碑亮眼，CompanyCam 在向企业客户扩张时仍面临重要的运营调整和竞争逆风。2026 年 6 月 26 日，公司实施了针对营销和多媒体人员的员工结构调整，正式将组织重心转向产品工程、集成速度和
              ARR 资本效率。在更广泛的建筑科技市场，Procore、Autodesk Construction Cloud
              等成熟企业套件正越来越多地内置原生照片文档和现场采集工具，可能挤出中型市场和总承包商中的专业化点解决方案。此外，承包商用户反馈还暴露出现场弱点，包括 GPS
              识别偶尔延迟、云端同步缓慢，以及在蜂窝网络受限的偏远工地移动应用不稳定。后续尽调应重点确认 Series C 后经审计的经常性收入、金融科技整合下的毛利率可持续性，以及生成式 AI 功能免责声明的法律稳健性。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.6'
        title: 展示项
        blocks:
          - type: callout
            title: 点解决方案替代风险与运营逆风
            body: >-
              CompanyCam 在承包商照片文档领域占据强势位置，但 Procore 和 Autodesk Construction Cloud 等企业平台提供原生照片记录，可能挤出点工具。此外，现场同步故障，以及
              2026 年 6 月营销和多媒体团队的结构调整，都反映出公司转向产品效率时的运营调整。
            calloutType: risk
            claimRefs:
