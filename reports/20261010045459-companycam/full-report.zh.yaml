  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 的可服务市场位于现场生产力软件、移动工地文档和面向专业承包商的垂直现场服务管理（FSM）交汇处。纳入的软件支出包括移动云端照片采集、带 GPS
              标记的现场核验、自动进度报告和视觉化纠纷缓解。CompanyCam
              的核心边界不包括横向业务操作系统，例如企业资源规划（ERP）、原生会计账簿、高级多团队调度和完整薪资平台。在采用专用软件前，承包商普遍依赖低摩擦的现状替代方案：手机原生相册、SMS 或 MMS
              群聊、WhatsApp 群组，以及 Google Drive 或 OneDrive
              等免费云存储文件夹。这些无人管理的替代方案会带来明显的运营故障，包括工作记录丢失、业主纠纷时无法调取历史视觉证据，以及元数据无法与客户记录同步。随着承包商走向专业化，他们必须做出架构选择：部署可接入现有 CRM
              技术栈的最佳单点照片文档层，还是采用把原生照片采集直接嵌入开票和估算工作流的一体化垂直 CRM/FSM 套件。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角：宏观劳动力、FSM 支出与文档 SAM
        blocks:
          - type: paragraph
            body: >-
              评估 CompanyCam 的市场机会，需要从三个不同的规模视角分析，而不能只依赖单一的自上而下总可寻址市场（TAM）估算。在宏观劳动力边界上，美国劳工统计局报告称，截至 2025 年 5 月，建筑和开采职业有
              6.4 million 名从业者，这代表实际在工地工作的绝对人口。缩小到商业软件视角，第三方技术图谱研究机构 6sense 跟踪了现场服务管理领域的 166 个竞争工具，并估计 CompanyCam 在
              1,124 个被跟踪机构域名中的市场份额为 2.87%，落后于 UpKeep（29.25%）、ServiceTitan（10.70%）和 Intuit Field Service Management
              ES（10.62%）等平台巨头。              从可服务市场（SAM）看，承包商软件支出由按席位和按团队计费的 SaaS 模式决定。按 CompanyCam 2026 年定价表，Core
              面向个人经营者，年付为 $63/month（$756/year）；Crew 面向 3-user 团队，年付为 $129/month（$1,548/year）。约 500,000
              家美国住宅专业承包机构构成一个可服务目标，对应每年 $378 million 至 $774 million 的经常性软件支出。但可服务可获得市场（SOM）仍受到严格约束，因为承包商未必愿意在主 CRM
              之外继续维护专用文档订阅。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
