              - CP010
              - CP012
      - number: '3.2'
        title: 直接替代方案与垂直专业工种竞争者
        blocks:
          - type: paragraph
            body: >-
              直接替代方案专门解决 CompanyCam 定价和工作流分层带来的用户摩擦。Manifold 在 2026 年成为重要的直接同类产品，按用户统一定价，提供强制照片的收尾清单和计算机视觉 3D 扫描，无需
              LiDAR 硬件或多席位最低购买量。在垂直专业工种中，专业化平台构成更尖锐的竞争威胁。在屋顶和外墙承包领域——历史上 CompanyCam 的核心用户阵地——AccuLynx 和 JobNimbus
              等平台将客户线索跟踪、材料订购、航拍测量与原生照片采集结合起来。同样，面向分包商的 Onetrace 把健康与安全文件签署、GPS 工时表和材料变更日志与照片证据放在一起。Projul 和
              Buildertrend 等住宅建筑平台则把照片日志直接嵌入客户门户和项目成本核算，令重视运营整合而非小众照片功能的建造商不再需要单独的照片订阅。
