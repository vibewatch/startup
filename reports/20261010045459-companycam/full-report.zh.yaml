      - number: '1.3'
        title: 资本化历程、独角兽估值与投资者联盟
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 的融资轨迹体现出一种不同寻常的中西部增长路径：从州政府支持的非稀释性原型补助，逐步走向数十亿美元资本化。2016 年，公司依据内布拉斯加州《商业创新法》取得 $50,000
              原型补助，在不稀释创始人股权的情况下完成早期技术验证，并促成 Nelnet 和 Invest Nebraska 等区域机构参与种子轮。机构风险投资加速始于 2020 年 6 月由 Blueprint Equity
              领投的 $6 million Series A，随后是 2021 年 10 月由 Insight Partners 领投、JMI Equity 和 WndrCo 参与的 $30 million Series
              B。2025 年 8 月，CompanyCam 完成由 B Capital 领投、Decades Holdings 参与的标志性 Series C 成长交易。私募资本市场研究平台 PitchBook
              的数据显示，Series C 股权融资总额为 $415 million，投后估值达到 $2.0 billion，使 CompanyCam
              成为内布拉斯加州历史上第一家科技独角兽，也为区域科技生态创造了可观的二级流动性。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
