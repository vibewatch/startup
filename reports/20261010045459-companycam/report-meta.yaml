  topStrengths:
    - Strong contractor adoption and workflow footprint across 285,000+ users and 79 million jobs.
    - Well-capitalized balance sheet from the August 2025 Series C.
    - Founder-led product vision with clear jobsite documentation use case.
  topRisks:
    - Current ARR, NRR, gross margin, and cash burn remain undisclosed.
    - Field reliability and AI disclaimer exposure can erode trust in critical workflows.
    - Full-suite construction platforms and fintech expansion could distract from the core product.
  unresolvedGaps:
    - Current ARR post-Series C; the public 2024 $68M figure is still the latest disclosed run-rate benchmark.
    - NRR, gross churn, and CAC by plan tier for underwriting the SaaS expansion model.
    - Beam Finance integration timeline, revenue contribution, and gross margin implications.
    - Enterprise contract economics, including deal sizes, ramp periods, and customer concentration.
