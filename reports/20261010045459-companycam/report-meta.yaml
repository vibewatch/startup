companyProfile:
  summary: >-
    CompanyCam is a Lincoln, Nebraska-based contractor documentation platform founded by Luke Hansen that combines
    jobsite photo capture, AI-assisted workflow tools, and tiered SaaS monetization. The company claims broad contractor
    adoption, expanded into construction fintech through Beam Finance, and reached unicorn scale in its August 2025
    Series C, but its current operating metrics remain largely private.
  founders:
    - name: Luke Hansen
      role: Founder & Chief Executive Officer
      background: Former roofing contractor who founded CompanyCam in 2015 to solve jobsite photo organization problems.
      claimRefs:
        - CO001
        - CO003
  foundingLocation: Lincoln, Nebraska, USA
  headquarters: Lincoln, Nebraska, USA
  productSummary: >-
    Contractor jobsite photo documentation, checklist, reporting, and workflow software, with AI feature sets and an
    expanding payments and invoicing component via Beam Finance.
  customerFocus: Small and mid-size trade contractors, with expansion into enterprise general contractors and franchise networks.
  businessModel: Tiered SaaS subscriptions plus transaction-linked payments and invoicing monetization.
  stage: late-stage venture
  fundingStatus: August 2025 Series C led by B Capital at a reported $2.0B post-money valuation.
