evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-arr-and-financial-performance
    missingEvidence: >-
      Audited current annual recurring revenue (ARR), gross margin percentage, net revenue retention (NRR), and cash
      burn figures following the August 2025 Series C funding round.
    whyItMatters: >-
      A private $2.0 billion valuation and a $415 million equity financing round imply substantial annual revenue scale
      that cannot be independently substantiated through private company disclosures alone.
    diligencePath: >-
      Request audited GAAP financial statements, trailing twelve month (TTM) SaaS metrics, cohort net revenue retention
      figures, and unit economics broken down by subscription tier.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: comprehensive-board-and-executive-directory
    missingEvidence: >-
      Complete directory of CompanyCam's board of directors, including independent director seats, committee
      assignments, and voting thresholds.
    whyItMatters: >-
      While B Capital, Insight Partners, and founder Luke Hansen hold key governance roles, private filings disclose 3
      board seats without public documentation of committee charters.
    diligencePath: >-
      Examine board voting agreements, investor rights agreements, and cap table governance exhibits during formal
      investment diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: contractor-cohort-churn-and-nrr
    missingEvidence: >-
      Audited net revenue retention (NRR), gross churn, and customer acquisition cost (CAC) broken out across Core,
      Crew, and Scale subscriber tiers.
    whyItMatters: >-
      Without segmented retention data, diligence cannot verify whether small trade contractors churn rapidly when faced
      with per-seat rate step-ups or all-in-one software consolidation.
    diligencePath: >-
      Request confidential management data room cohort retention curves, gross churn percentages, and expansion revenue
      splits by contractor trade and company size.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: som-obtainable-market-sizing
    missingEvidence: >-
      Reconciliation between CompanyCam's claimed 285,000+ users and 6sense's tracked 1,124 institutional customer
      domains.
    whyItMatters: >-
      Determines whether CompanyCam's revenue is heavily fragmented across hundreds of thousands of low-dollar
      individual contractor seats or anchored by concentrated multi-crew fleets.
    diligencePath: >-
      Obtain an account distribution schedule detailing active paying corporate accounts, average seats per account, and
      annual contract value (ACV) distribution.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: churn-rate-evidence
    missingEvidence: >-
      Audited cohort churn, downgrade rates, and multi-homing telemetry for contractors using both CompanyCam and
      specialized trade CRMs.
    whyItMatters: >-
      Determines whether software consolidation in roofing and trade verticals represents an existential threat to
      CompanyCam's standalone seat expansion.
    diligencePath: >-
      Review CompanyCam retention cohorts by plan tier and trade vertical, and cross-reference with CRM marketplace app
      installation and uninstallation data.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margin percentage, net revenue retention (NRR) rate by customer cohort, and customer acquisition
      cost (CAC) payback period.
    whyItMatters: >-
      Without cohort retention and gross margin data, underwriting the sustainability of CompanyCam's $2.0B valuation
      and capital efficiency remains speculative.
    diligencePath: >-
      Request historical cohort retention curves, gross margin breakdowns across software and payment processing, and
      blended versus paid CAC by tier during formal diligence.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: beam-finance-integration
    missingEvidence: >-
      Technical architecture specifications, data schemas, and API integration roadmap for the acquired Beam Finance
      payment and customer financing workflow.
    whyItMatters: >-
      Adding fintech and payment processing components to a photo-documentation SaaS backend introduces PCI compliance,
      financial ledger synchronization, and underwriting risk.
    diligencePath: >-
      Review engineering architecture documentation, payment gateway partner agreements, and API contracts between
      CompanyCam and Beam Finance.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rates, contract-length distribution, and cohort expansion by plan and customer size.
    whyItMatters: >-
      These metrics determine whether broad claimed adoption converts into durable recurring revenue and whether seat
      expansion offsets small-business churn.
    diligencePath: >-
      Request monthly logo and revenue cohorts by plan, company size, trade, and acquisition channel, including
      contraction and reactivation.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete named-customer list with contract status, deployment size, start date, renewal history, and
      independently verified outcome methodology.
    whyItMatters: >-
      Current public proof cannot distinguish pilots from scaled production use or quantify how representative the
      highlighted outcomes are.
    diligencePath: >-
      Request a customer census and conduct reference calls with recent wins, renewals, contractions, and churned
      accounts.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by top customer, vertical, geography, partner, and integration channel.
    whyItMatters: >-
      Concentration data is needed to test exposure to large accounts, contractor cyclicality, channel dependence, and
      suite-level platform displacement.
    diligencePath: >-
      Review the top-20 customer schedule, channel-attributed ARR, and partner-led pipeline with renewal and
      gross-margin data.
  - type: private-evidence-only
    severity: material
    topic: Regulatory and legal risk register completeness
    missingEvidence: Detailed third-party SOC 2 Type II audit exception reports and enterprise contract dispute records.
    whyItMatters: >-
      Without audit exception logs and enterprise litigation filings, residual compliance and indemnification exposures
      cannot be fully modeled.
    diligencePath: >-
      Request unredacted SOC 2 Type II auditor reports, penetration test remediation letters, and historical customer
      dispute settlement summaries in management diligence.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: minor
    topic: Fintech and payments loss exposure
    missingEvidence: >-
      Historical chargeback rates, credit loss provisions, and interchange margin splits for CompanyCam's newly acquired
      Beam Finance payments workflow.
    whyItMatters: >-
      Payment processing introduces counterparty credit and fraud risk that does not exist in pure SaaS photo
      documentation.
    diligencePath: >-
      Review payment processor agreements, merchant loss reserve terms, and chargeback dispute statistics in Q4
      diligence.
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Audited ARR or revenue, growth, gross margin, retention, churn, burn, and cash balance for the latest period.
    whyItMatters: These inputs are required to select a valuation method, calculate a defensible multiple, and test downside.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, and cohort schedules directly from management
      and reconcile them to board reporting.
    relatedQuestionRefs:
      - QV005
      - QV008
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Primary documents reconciling the $1.41 billion and $2.0 billion reported post-money valuation marks.
    whyItMatters: The difference changes entry-price discipline, dilution analysis, and any target-return calculation.
    diligencePath: >-
      Review the August 2025 stock purchase agreement, amended charter, closing capitalization, and any secondary
      transaction records.
    relatedQuestionRefs:
      - QV001
      - QV005
  - type: private-evidence-only
    severity: material
    topic: preferences
    missingEvidence: >-
      Fully diluted capitalization table, option pool, seniority, participation, anti-dilution, and
      liquidation-waterfall documents.
    whyItMatters: >-
      Headline valuation does not determine common-equity proceeds when preferences, dilution, or secondary components
      differ.
    diligencePath: Run management's capitalization table and charter terms through exit waterfalls at several gross proceeds levels.
    relatedQuestionRefs:
      - QV007
  - type: missing-source
    severity: minor
    topic: product-reliability
    missingEvidence: >-
      Representative incident, support-ticket, offline-sync, and upload-failure data by mobile platform and connectivity
      condition.
    whyItMatters: Anecdotal app reviews identify a risk but cannot establish frequency, severity, or retention impact.
    diligencePath: >-
      Request twelve months of support categories, incident logs, SLA performance, and churn interviews for affected
      contractor cohorts.
    relatedQuestionRefs:
      - QV003
