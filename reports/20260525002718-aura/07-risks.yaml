- id: TR005
  title: Mitigation and thesis-break criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Breach and trust erosion
    - New security incident or materially worse disclosure quality
    - Another externally visible incident, delayed notification, or evidence that production monitoring data was exposed
    - Move to downside case and demand independent security audit before fresh capital or conviction increase.
  - - Billing and recourse friction
    - Refund, cancellation, or arbitration complaints increase
    - Visible review deterioration or regulator inquiry tied to auto-renewal, refunds, or consumer terms
    - Treat pricing power as weaker than list prices imply and haircut retention assumptions.
  - - Support and alert precision
    - Support backlog or accuracy concerns emerge
    - Public evidence of late alerts, unresolved cases, or worsening support commentary without offsetting KPI disclosure
    - Assume higher churn, higher service cost, and weaker brand conversion.
  - - Partner concentration
    - Channel mix concentrates without disclosure
    - MetLife or a small set of partners become more critical while concentration and renewal data stay undisclosed
    - Mark channel leverage as a risk, not a moat, until concentration is quantified.
  - - Financial opacity
    - Management still withholds debt and margin detail after next refresh or financing event
    - No disclosure on debt split, gross margin, or runway despite new strategic expansion
    - Keep recommendation constrained because downside cannot be underwritten.
  - - Execution sprawl across consumer, family, and MSP products
    - Expansion continues but proof stays launch-level
    - More product surfaces and channel claims without customer outcomes, SLA data, or stable documentation
    - Cut strategic-premium assumptions and require proof that breadth is compounding rather than diluting focus.
  notes: Thresholds focus on observable events that should move underwriting, not on generic narrative concerns.
