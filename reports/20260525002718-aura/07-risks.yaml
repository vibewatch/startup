- id: trust-privacy-security-and-service-risks
  title: Trust, privacy, security, and service-delivery risks
  body: 'Aura''s top-ranked residual risk is trust erosion after the March 2026 breach. Management''s core rebuttal is reassuring on scope: the monitoring database was not accessed, sensitive monitoring data was not exposed, and the affected records were mostly legacy marketing-list data. But that does not remove the strategic damage. A scam-protection brand that loses control through phone phishing invites harsher customer, partner, and regulator scrutiny than a generic app would. The same section of the product stack also carries ongoing operational and privacy risk. Aura promises one-million-dollar insurance, 24/7 support, and white-glove fraud resolution, yet the support surface spans identity theft, banking alerts, VPN, password manager, antivirus, parental controls, and family administration. Review evidence is mixed: the bundle is broad and convenient, but independent testers report variability in support quality, occasional alert issues, 2FA not enabled by default, and weaker local-device
    protection than the identity core. Aura can mitigate this with better precision metrics, stronger post-incident disclosure, and durable security-by-default settings; otherwise, the company risks turning breadth into support load and brand drag.'
  claimRefs:
