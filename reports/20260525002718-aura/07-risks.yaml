  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register coverage
    missingEvidence: A counsel-backed inventory of active state auto-renewal, privacy, insurance, consumer-reporting, and post-breach regulator contacts touching Aura or its channel programs.
    whyItMatters: The public record is strong enough to rank major legal risks but too thin to rule out investigations, complaints, or settlement exposure by state and channel.
    diligencePath: Request outside-counsel memo, complaint log, regulator correspondence, and a state-by-state subscription and insurance compliance checklist.
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: post-breach remediation audit
    missingEvidence: Independent audit results, control-uplift summary, phishing-resilience metrics, and any regulator notifications after the March 2026 incident.
    whyItMatters: Without external validation, investors cannot tell whether Aura's breach was a contained one-off or a signal of broader control weakness.
    diligencePath: Request post-incident board materials, independent forensics summary, employee-training changes, and any notice sent to regulators or insurance carriers.
    relatedQuestionRefs:
    - QR030
  - type: private-evidence-only
    severity: material
    topic: channel concentration economics
    missingEvidence: Revenue, gross margin, renewal rate, and churn by MetLife, direct partnerships, MSPs, and direct-to-consumer channels.
    whyItMatters: Aura already discloses that channels matter, but not whether any single partner can impair growth, pricing power, or renewal durability.
    diligencePath: Obtain top-partner revenue bridge, contract terms, cohort retention by channel, and pipeline-to-booking conversion for MSP and employer-benefit sales.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: capital structure and margin
    missingEvidence: Gross margin, cash balance, burn, debt split, debt covenants, and runway after the 2025 equity-and-debt round.
    whyItMatters: The public funding headline is strong, but downside underwriting still depends on debt service, support cost, and margin structure that remain opaque.
    diligencePath: Request board deck, lender summary, debt agreement, and monthly KPI package with ARR, margin, CAC, and cash runway.
    relatedQuestionRefs:
    - QR031
  - type: private-evidence-only
    severity: material
    topic: alert precision and support load
    missingEvidence: False-positive rates, missed-event rates, case volumes, support-response SLAs, and escalation rates by product module.
    whyItMatters: Aura's value proposition depends on trust, fast alerts, and white-glove remediation; without precision and service metrics, residual operational risk stays high.
    diligencePath: Request operational dashboard for alert accuracy, support staffing, ticket aging, fraud-resolution cycle time, and module-level churn drivers.
    relatedQuestionRefs:
    - QR032
