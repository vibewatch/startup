tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Core identity theft protection subscription
    - Identity monitoring, fraud alerts, credit monitoring, remediation support, insurance-backed recovery
    - Generic credit-score utilities without fraud/remediation layer
    - Household adult / household budget
    - Current category anchor
  - - Family digital protection bundle
    - Child identity monitoring, parental controls, scam blocking, data removal, device security, family coverage
    - Standalone parental-control apps with no identity or fraud component
    - Parent or family administrator / household budget
    - Important because Aura competes on family breadth
  - - Employer-sponsored online protection benefit
    - Identity and online-safety coverage offered through benefits channel
    - General wellness or EAP programs with no fraud/identity workflow
    - Employer benefits leader / employer budget
    - Adjacent expansion channel, not proof all benefits spend is in TAM
  - - BYOD / personal-security access layer
    - Identity-centric access protection for employee-owned devices and MSP-managed SMBs
    - Traditional MDM or endpoint suites that do not address employee identity compromise on personal devices
    - MSP, SMB IT admin, or employer / IT services budget
    - Useful adjacency for SAM expansion
  - - Digital-security bundle substitute
    - VPN, antivirus, data leak alerts, password management, data removal when sold as one suite
    - Pure entertainment or general software subscriptions
    - Consumer / household budget
    - Key substitute set that can compress pricing
  - - Excluded broad consumer cybersecurity TAM
    - All antivirus, VPN, password manager, and privacy subscriptions regardless of identity workflow
    - N/A
    - Mixed buyers and budgets
    - Too broad for disciplined Aura sizing
  notes: 'Boundary logic: include consumer and family spend where identity, fraud, or account-compromise protection is central; treat broader security, employer, and BYOD motions as adjacent unless the purchase is explicitly identity-led.'
