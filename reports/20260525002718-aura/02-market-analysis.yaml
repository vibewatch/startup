  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sizing-precision
    missingEvidence: A bottom-up split of Aura members or revenue by direct retail identity protection, family online safety, employer-benefits, and BYOD or enterprise-adjacent channels.
    whyItMatters: Without disclosed channel and product-mix data, public TAM-to-SAM-to-SOM math remains scenario-based rather than company-specific.
    diligencePath: Request management cohort data by plan, distribution channel, ARPU, and active paid members, then rebuild SAM and SOM from observed conversion and retention instead of syndicated TAM alone.
    relatedQuestionRefs:
    - QM021
    - QM023
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: renewal-economics
    missingEvidence: Audited churn, refund, support-contact, and cancellation rates by plan and acquisition channel.
    whyItMatters: Price sensitivity and renewal friction are visible in public packaging and review signals, but investor-grade judgment needs observed retention economics rather than anecdotal complaints alone.
    diligencePath: Request monthly retention and refund cohorts, segmented by annual versus monthly plans and by family versus individual accounts, plus the support reasons tied to cancellations.
    relatedQuestionRefs:
    - QM018
    - QM026
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: trust-conversion
    missingEvidence: Independent evidence linking vendor security incidents to identity-protection conversion or renewal behavior across the category.
    whyItMatters: The 2026 Aura breach demonstrates trust risk, but it remains unclear how much such incidents reduce paid demand versus simply increasing security salience.
    diligencePath: Ask management for conversion and renewal trends before and after the 2026 breach and review any channel-partner commentary or customer-survey data on trust impacts.
    relatedQuestionRefs:
    - QM022
    - QM026
    relatedTableRefs:
    - TM004
