- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Aura should be framed as a core identity-protection market with adjacent family-safety, employer, and BYOD expansion layers, not as all consumer cybersecurity spend.
  data:
    items:
    - label: Broad published ceiling
      value: Global consumer identity-protection market
      detail: Syndicated publishers place the current global market anywhere from roughly USD 4.6B to USD 17.0B depending on scope.
    - label: Core serviceable market
      value: Identity theft and fraud protection subscriptions
      detail: The most defensible core is monitoring, remediation, insurance, and recovery services rather than all digital-security tools.
    - label: Aura practical wedge
      value: Identity-led digital protection bundle
      detail: Aura combines identity protection with data removal, device security, scam blocking, and family online-safety tools.
    - label: Adjacent expansion
      value: Employer benefits and BYOD protection
      detail: Employer-sponsored and MSP or BYOD motions matter as optional growth layers, but current public evidence does not justify folding them fully into present TAM.
  approximationNotes: 'The figure is conceptual by design: only the top layer uses published revenue estimates, while the lower layers reflect boundary logic from product packaging and channel evidence.'
