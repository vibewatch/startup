- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Rising fraud complaints and losses
    - positive
    - current
    - High incident volume supports ongoing need for monitoring and recovery subscriptions
    - Separate identity-specific demand from broader cybercrime noise
  - - Persistent breach exposure and repeated notices
    - positive
    - current
    - Consumers repeatedly reminded of risk are more likely to consider protection tools
    - Test whether breach notices convert to paid plans or only temporary interest
  - - Family online-safety and child-protection concerns
    - positive
    - current
    - Category expands beyond credit and fraud into broader family digital-safety budgets
    - Measure what percent of conversions are driven by child or family use cases
  - - Employer-benefits channel expansion
    - positive
    - near-term
    - Could lower CAC and create sponsored distribution outside pure D2C acquisition
    - Ask for employer-member counts and retention versus retail users
  - - BYOD and identity-centric access risk
    - positive
    - near-term
    - Personal-security and enterprise-access workflows may create adjacent revenue pools
    - Verify whether this is meaningful revenue yet or still an option value
  - - Price sensitivity and cheaper substitutes
    - negative
    - current
    - Consumers can compare against lower-cost legacy identity plans or broader security bundles
    - Review win-loss and attach rates by plan price point
  - - Feature overlap and bundle commoditization
    - negative
    - current
    - VPN, antivirus, leak alerts, and data removal are increasingly available elsewhere
    - Identify which features truly drive willingness to pay beyond parity bundles
  - - Automatic renewal, cancellation, and support friction
    - negative
    - current
    - Subscription skepticism can reduce trial conversion or increase churn
    - Request churn, refund, and complaint-rate data by plan
  - - Trust shock from vendor breaches
    - negative
    - current
    - Protection brands face outsized reputational damage if they themselves are compromised
    - Test whether the 2026 incident affected conversion, renewal, or channel partners
  - - Methodology-sensitive TAM estimates
    - negative
    - current
    - Wide estimate ranges can inflate valuation if management chooses the broadest lens
    - Ask management for a bottom-up SAM tied to disclosed channel and plan mix
  notes: This table mixes demand drivers and blockers because the practical valuation question is not whether the market exists, but whether adoption can outrun substitute pressure, trust friction, and ambiguous market-definition math.
