- id: channel-expansion-and-concentration-risk
  title: Channel expansion and concentration risk
  body: 'Expansion looks real, but it increasingly looks like channel expansion rather than pure self-serve subscription growth. The clearest proof is MetLife: Aura''s own history page says MetLife became the exclusive U.S. employer distributor in 2022, BusinessWire said the enhanced offer would be available to new and existing customers in July 2025, and MetLife''s own landing page says the product is integrated into MetLife''s systems and service model. Aura Business goes further, saying direct partnerships plus employee benefits represented more than 30% of 2025 revenue, which implies customer concentration can no longer be analyzed only at the household level. The new MSP and BYOD push adds another expansion lane, and both Aura''s own MSP page and channel coverage frame it as a privacy-first way to secure unmanaged employee devices. That broadens the TAM, but it also pushes more acquisition and renewal risk into intermediaries such as MetLife, resellers, and MSPs. Public sources still
    do not disclose covered lives by channel, revenue concentration by partner, or whether these channels renew as predictably as the direct consumer base. The upside is breadth; the underwriting gap is dependence.'
