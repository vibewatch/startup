company:
  name: Aura
chapter:
  number: 6
  title: Customers
  summary: 'Aura''s public customer evidence is strongest in household app adoption and partner-led distribution, not in disclosed retention economics. Official and marketplace sources support real use — Aura says it protects 1.6M+ customers, its App Store listing shows 97K ratings, MetLife rolled out the offer to new and existing customers in July 2025, and Aura Business says direct partnerships plus employee benefits represented more than 30% of 2025 revenue. The missing layer is durability: no public subscriber, churn, NRR, or concentration disclosure shows how sticky those customers are or how dependent Aura is on channels like MetLife and resellers.'
sections:
- id: segment-mix-and-customer-surfaces
  title: Segment mix and customer surfaces
  body: 'Aura''s customer map is broader than a direct-to-consumer identity-theft app, but the public evidence still clusters around households and channel intermediaries rather than a disclosed account ledger. Official pricing and family pages show four consumer packages — Individual, Couple, Family, and Kids — which map Aura to single adults, multi-adult households, and child-safety use cases. At the same time, the partner and business surfaces make clear that Aura is also sold through employers, resellers, MSPs, insurers, credit unions, and property-management channels. The scale proxies are meaningful but should be treated as company claims instead of audited subscriber facts: Aura says it protects 1.6M+ customers, works with 20+ digital parenthood partners, helps keep 3M+ individuals safe online through its reseller network, and reaches 20 million people through thousands of partnerships. Aura Business adds another channel proof point by saying 2,100+ partners trust Aura with their
    customers and employees. The customer story is therefore multi-segment and multi-channel, but public materials still stop short of breaking out how much revenue each route contributes outside the >30% partnership-plus-benefits disclosure.'
