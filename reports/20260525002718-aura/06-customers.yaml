- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or friction risk
  - Impact
  - Current public signal
  - Diligence path
  rows:
  - - MetLife employer-benefits channel
    - One named employer-benefits route stands out above all others
    - Could drive large covered lives but concentrate channel power
    - MetLife is exclusive U.S. employer distributor and the offer is integrated into MetLife systems
    - Request covered lives, employer count, renewal terms, and share of benefits revenue tied to MetLife
  - - Direct partnerships and resellers
    - Broad reach claim may still mask a small number of economically dominant partners
    - Expands acquisition cheaply if diversified; creates exposure if concentrated
    - Aura says direct partnerships plus employee benefits were >30% of 2025 revenue
    - Provide top-10 partners by revenue and covered users
  - - Aura Business / MSP route
    - Fresh expansion lane with unclear paid adoption
    - Could open a new B2B customer segment beyond household subscriptions
    - Aura launched MSP-focused BYOD security in 2026 and channel press frames it as a new recurring revenue opportunity
    - Provide MSP logos, seat counts, and renewal data
  - - App-store distribution
    - Platform pricing and fee take-rates can differ from web economics
    - Changes realized ARPU and complicates retention analysis
    - App Store prices differ from website list prices
    - Provide web vs Apple vs Google billing mix and renewal behavior
  - - Household upsell logic
    - Unlimited-kids and multi-adult packaging could improve stickiness but also raises service burden
    - Supports land-and-expand within a household if the value proposition holds
    - Family plan bundles identity, device, and child-safety features for up to five adults plus unlimited kids
    - Provide plan-mix migration, add-on attach, and downgrade rates
  - - Support-led retention
    - Good remediation can help save accounts, but uneven bug-fix or data-removal satisfaction can offset that
    - Support quality may be a real retention lever in a scam-response product
    - Customer-service page and reviews show both praise and complaint themes
    - Provide support CSAT, repeat-contact rates, and post-incident retention
  notes: The key risk is not absence of channels; it is incomplete visibility into how concentrated those channels are and whether they renew as cleanly as direct household subscriptions.
