  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale signal
  - Main gap
  rows:
  - - Individual adults
    - Single adult account owner / end user / self-pay
    - Identity, credit, privacy, and device protection
    - Official plans start with a 1-adult, 10-device package
    - No public count of paying individual subscribers
  - - Couples and multi-adult households
    - Two adults or larger family admin / end users / self-pay
    - Shared monitoring, insurance, and device coverage
    - Couple and Family plans explicitly scale adults, kids, and devices
    - Household mix by plan is not public
  - - Kids-only / family-safety households
    - Parent or guardian buyer / child user / parent payer
    - Parental controls, online wellbeing, and child identity protection
    - Kids plan and Family plan market unlimited kids plus parental-control tooling
    - No disclosed child-feature retention or engagement data
  - - Employer-benefits users
    - Employer or broker channel / employee household user / employer or user payer depending program
    - Identity and fraud protection as a benefit
    - MetLife is the named flagship employer-benefits route
    - Covered lives and renewal by employer are not public
  - - Partner / reseller channels
    - Insurer, credit union, MSP, property manager, or reseller intermediary / household user / partner or end customer payer
    - Bundle Aura into another relationship or service offer
    - Aura says the network reaches 20M people and keeps 3M+ individuals safe online
    - Revenue split and top-partner concentration are undisclosed
  - - MSP / BYOD business motion
    - MSP or employer admin / employee user / business payer
    - Secure unmanaged employee devices without classic MDM
    - Aura Business and channel press show a fresh 2026 MSP push
    - Paid customer count, seats, and retention are not public
  notes: Segments mix direct consumer households with channel-mediated buyers because Aura publicly sells both ways and does not disclose a clean revenue split by route.
