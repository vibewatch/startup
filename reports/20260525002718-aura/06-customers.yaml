  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: retention-gap
    missingEvidence: Paid subscriber count, plan mix, churn, GRR, NRR, contract length, and renewal-cohort data by channel.
    whyItMatters: Without true cohort and renewal disclosure, public sentiment cannot be converted into a durable customer-LTV view.
    diligencePath: Request monthly and annual subscriber counts, logo churn, revenue churn, GRR, NRR, and retention curves split across direct web, app stores, benefits, and partners.
    relatedQuestionRefs:
    - QU013
    - QU025
    - QU026
  - type: private-evidence-only
    severity: blocking
    topic: concentration-gap
    missingEvidence: Top partners, top customers, MetLife covered lives, and revenue concentration by intermediary or account.
    whyItMatters: The >30% channel-revenue disclosure implies concentration risk could be material even if household adoption is broad.
    diligencePath: Request top-10 partner and top-10 customer concentration tables, employer-benefits covered lives, and renewal terms for MetLife and other large channels.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU024
    - QU025
    - QU026
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Gross-to-net revenue by billing route, reseller economics, app-store take rates, and refund or chargeback data.
    whyItMatters: Channel breadth can improve growth while still compressing margin and weakening renewal quality if economics differ sharply across routes.
    diligencePath: Request billings and net revenue split across direct web, Apple, Google, MetLife, resellers, and MSPs, plus refund and chargeback rates by route.
    relatedQuestionRefs:
    - QU002
    - QU012
    - QU017
    - QU019
    - QU023
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A broader named list of live employers, resellers, or enterprise accounts plus attributable end-user counts and outcomes.
    whyItMatters: The current public proof set is credible but still leans heavily on one large employer channel and curated or editorial consumer evidence.
    diligencePath: Request named customer references across benefits, resellers, insurers, property managers, and MSPs with launch date, covered users, retention status, and measurable outcomes.
    relatedQuestionRefs:
    - QU007
    - QU008
    - QU009
    - QU010
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: post-breach-retention
    missingEvidence: Post-March-2026 churn, win-rate, support-volume, and conversion data showing whether the breach changed customer behavior.
    whyItMatters: Aura’s trust narrative is central to retention, and the breach could impair renewal or new-customer conversion even if core monitoring data was not accessed.
    diligencePath: Request monthly gross adds, cancellations, contact-center volumes, and win-loss notes before and after the March 2026 incident.
    relatedQuestionRefs:
    - QU021
    - QU022
    - QU026
