- id: reliability-privacy-and-security-controls
  title: Reliability, privacy, and security controls
  body: Aura's trust story is built as much on service operations and policy posture as on code. Official pages promise 24/7 U.S.-based support, white-glove fraud resolution, and up to $1 million of insurance per adult, while the privacy policy frames Aura as a provider spanning products, services, apps, and websites and points users to product-specific privacy notices. Store disclosures add more texture than the marketing site alone. The App Store privacy label says purchases, financial information, contact information, and user content may be linked to identity, while some location, usage, and diagnostics data are collected without being linked. The Chrome Web Store states the extension's data are not sold to third parties or used for unrelated purposes or creditworthiness decisions. Aura also publishes an FCRA summary for U.S. customers, which fits a product that touches consumer-reporting workflows. The sharpest trust test is the March 2026 breach. Aura says a phone-phishing attack on
    an employee exposed about 900,000 mostly marketing-list records and did not touch the monitoring database or sensitive fields such as Social Security numbers, financial data, credit records, or passwords. Even if the blast radius was limited, the incident is still material because a safety brand is judged on social-engineering resilience and incident disclosure quality. The presence of a broken /security-incident URL in the crawl, with the substantive update living under a press-release URL, suggests incident communication is handled more as corporate communications than as a durable public trust center.
  claimRefs:
