- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Identity monitoring + recovery core
    - Individual, couple, family subscriber
    - Mature GA consumer core
    - Combines monitoring with insurance and fraud-remediation support
    - Alert precision and claims-paid history are not public
  - - Credit monitoring + credit lock
    - Credit-active adult subscriber
    - Mature GA feature set
    - Three-bureau monitoring packaged into all main plans
    - Bureau-level partner terms and lock scope are not fully disclosed
  - - Financial transaction monitoring
    - Adult subscriber linking bank accounts
    - Mature but integration-dependent
    - Fraud-monitoring extends beyond credit files into linked accounts
    - Trigger thresholds, false positives, and bank coverage are not public
  - - Privacy assistant / data-broker removal / account cleanup
    - Privacy-focused consumer
    - Active consumer module
    - Pulls identity protection toward privacy remediation rather than pure remediation
    - Removal success rates and re-listing rates are not public
  - - Device-security bundle (VPN, antivirus, password manager, safe browsing)
    - Consumer across personal devices
    - Mature convenience layer
    - One-subscription bundle avoids separate security purchases
    - Independent reviews say these tools are useful but not clearly category-leading
  - - Family safety and wellbeing layer
    - Parent / guardian and child
    - Mature consumer add-on within family plans
    - Adds parental controls, safe gaming, cyberbullying, and AI chat-app alerts to an identity product
    - Model logic, moderation thresholds, and escalation workflows are not public
  - - White-glove support + insurance
    - Fraud victim / high-anxiety household
    - Mature service layer
    - Human remediation and insurance are core retention levers, not minor extras
    - Case-volume, resolution time, and claims-approval metrics are not public
  - - Partner / employer / reseller packaging
    - Insurer, employer, MSP, reseller
    - Commercially active but channel-specific
    - Repackages the same platform for benefits and channel distribution
    - Revenue split and channel-specific retention are not public
  - - Aura Business BYOD security
    - Employee, SMB IT admin, MSP
    - Early-to-mid-stage expansion motion
    - Extends identity protection into employee-owned-device security and conditional policies
    - Public customer references, SLA terms, and integration depth remain thin
  notes: Product rows synthesize current official plan pages, app-store surfaces, partner announcements, and independent reviews as of 2026-05-25; maturity labels reflect public availability rather than internal usage metrics.
