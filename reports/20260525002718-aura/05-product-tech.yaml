callouts:
- calloutType: strength
  title: Bundle breadth is real and independently corroborated
  body: Aura is not just marketing itself as an all-in-one tool; official pages and multiple independent reviews line up on the same broad module set spanning identity, credit, device security, privacy cleanup, and family safety. That breadth is the clearest product differentiator visible in public evidence.
  claimRefs:
  - CE003
  - CE010
  - CE035
  - CE042
- calloutType: risk
  title: Trust and technical-moat disclosure are the main product-tech weak points
  body: The 2026 breach did not, by Aura's account, hit the core monitoring database, but it still damaged trust in a safety brand. At the same time, Aura's AI and backend implementation details remain largely undisclosed, limiting confidence in a defensible technical moat beyond workflow packaging.
  claimRefs:
  - CE032
  - CE034
  - CE039
  - CE041
- calloutType: insight
  title: Describe Aura at the operating-model layer, not the hidden-stack layer
  body: Public evidence is strong on what the customer sees and how the workflow behaves—apps, extension, onboarding, support, controls, and incident response—but weak on cloud, model, and internal service design. A disciplined chapter therefore explains the operating model and explicitly labels the undisclosed backend as a diligence gap.
  claimRefs:
  - CE020
  - CE021
  - CE022
