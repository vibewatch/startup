- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Web account and subscription layer
    - Account creation, billing, household management, and policy entry point
    - Aura web application and payment / identity inputs
    - Renewal, cancellation, and feature changes are governed by contract terms that customers may not scrutinize closely
  - - iOS and Android mobile apps
    - Push alerts, account state, credit controls, privacy tools, and family monitoring
    - Apple and Google mobile-platform distribution plus mobile OS permissions
    - Store-policy changes or mobile-OS permission shifts can impair feature behavior
  - - Chrome browser extension
    - Password capture, password-health checks, tracker blocking, email aliases, and secure browsing support
    - Chrome extension-store review and browser APIs
    - Extension-policy shifts or browser API changes can directly affect usability
  - - Identity, credit, and fraud-monitoring layer
    - Watches personal information, credit events, and suspicious activity across multiple feeds
    - Third-party data sources including consumer-reporting workflows
    - Public evidence does not reveal feed coverage, latency distribution, or backend topology
  - - Financial-account connectivity layer
    - Links bank and financial accounts for transaction monitoring
    - Plaid-style aggregation and bank connectivity
    - Upstream connector outages or credential friction can reduce monitoring completeness
  - - Privacy-removal workflow
    - Submits opt-out or cleanup actions against broker and spam-list surfaces
    - Third-party data-broker ecosystem and public-web discovery
    - Re-listing and broker coverage create residual risk even when requests succeed
  - - Child-safety enforcement layer on Android
    - Applies content filtering, time limits, and contextual safety monitoring on child devices
    - Local VPN configuration and Android Accessibility Service permissions
    - Device-level permissions are powerful and can create adoption, privacy, or platform-review risk
  - - Human remediation and support operations
    - 24/7 support, white-glove fraud resolution, and incident assistance
    - U.S.-based specialists plus insurance workflows
    - Service quality is strategically important but public response-time and case-throughput metrics are absent
  - - Aura Intelligence / decisioning layer
    - Branded detection and recommendation logic behind alerts and safety signals
    - Proprietary rules, models, and monitoring logic not publicly described in depth
    - No public model, benchmark, or false-positive disclosure makes the AI moat hard to diligence technically
  - - Legacy data and incident-response perimeter
    - Holds inherited records and governs breach-response communications
    - Acquired systems, employee controls, and incident-response processes
    - The 2026 breach showed social-engineering and legacy-data surfaces can still create brand and privacy exposure
  notes: This table intentionally maps only the public operating layer exposed by official pages, app-store disclosures, and review testing; it does not infer hidden cloud infrastructure or undisclosed internal microservices.
