- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Aura solution
  - Measurable benefit
  - Limitation
  rows:
  - - Protect one adult identity across credit and accounts
    - Separate credit alerts, ad hoc breach checks, and manual dispute work
    - Identity monitoring, credit alerts, credit lock, transaction alerts, and insurance in one account
    - Faster detection and a single remediation path
    - Requires disclosure of sensitive personal and financial data to onboard fully
  - - Run household digital safety for multiple family members
    - Mix of browser settings, parental-control apps, and separate identity tools
    - Family plan with child identity monitoring, parental controls, safe gaming, and wellbeing signals
    - One admin account can govern multiple adults and unlimited kids
    - Child tooling depth is public, but guardrail quality metrics are not
  - - Catch suspicious credit or banking activity quickly
    - Manual bank review and credit-report checks
    - Monitoring plus mobile alerts and lock controls
    - Reduces time-to-action after suspicious events
    - Exact fraud-alert benchmark methodology is company sponsored
  - - Reduce exposure on people-search and spam lists
    - Manual opt-out requests across broker sites
    - Aura requests data removal from 200+ brokers and cleanup surfaces
    - Lower spam and scam exposure from public data leakage
    - Removal persistence and reappearance rates are not public
  - - Secure passwords and web sessions across devices
    - Browser autofill, reused passwords, and fragmented security tools
    - Password manager, browser extension, VPN, safe browsing, and antivirus bundle
    - Lower operational friction versus buying multiple standalone tools
    - Reviewers say the convenience layer is broader than deepest-in-class tools
  - - Extend online-safety controls into benefits or BYOD channels
    - Traditional identity-theft benefit or device-centric security stack
    - Employer-benefit and identity-centric BYOD packaging built on Aura's platform
    - Lets Aura monetize similar workflows outside direct retail subscriptions
    - Public implementation and customer-proof depth is still limited
  notes: Workflow rows translate official feature claims and review testing into concrete jobs-to-be-done; measurable benefits are directional because Aura does not publish cohort-level outcome metrics.
