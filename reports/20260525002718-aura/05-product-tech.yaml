  evidenceGaps:
  - type: missing-source
    severity: material
    topic: ai-governance
    missingEvidence: Public documentation covering Aura Intelligence model families, training-data provenance, benchmark design, and false-positive or false-negative rates.
    whyItMatters: Without model-governance evidence, investors cannot tell whether AI-branded features are a durable moat, a lightly tuned rules engine, or a high-noise UX layer.
    diligencePath: Request product-security and ML-governance documentation, including evaluation dashboards and post-incident tuning procedures for family-safety and spam-detection models.
    relatedQuestionRefs:
    - QE012
    relatedTableRefs:
    - TE003
    - TE004
  - type: access-blocked
    severity: material
    topic: technical-docs
    missingEvidence: Readable public implementation or setup documentation for password-manager deployment, admin configuration, and feature-level operating details.
    whyItMatters: Thin or inaccessible technical docs increase deployment risk and make it harder to validate how much of the product depends on manual support versus robust self-serve implementation.
    diligencePath: Obtain live access to the support center, admin docs, and any enterprise implementation guides; test a real browser-extension and child-device setup flow in diligence.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: compliance-controls
    missingEvidence: Current SOC 2 report, ISO certificate scope, penetration-test summary, and any trust-center artifact covering Aura's production environment.
    whyItMatters: Security and privacy claims are central to the product narrative, so missing procurement-grade evidence weakens underwriting confidence even if consumer marketing copy is strong.
    diligencePath: Request the latest trust package under NDA and map it against the claims on privacy, credit monitoring, child safety, and incident-response controls.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: reliability-metrics
    missingEvidence: Public SLA terms, incident-history metrics, alert-latency distributions, resolution-time data, and support-response performance.
    whyItMatters: Release cadence alone is not enough to judge service reliability for a product that sells always-on monitoring and rapid fraud response.
    diligencePath: Request internal reliability dashboards, customer support KPIs, outage logs, and fraud-resolution case metrics segmented by plan and channel.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: product-metrics
    missingEvidence: Paid subscriber counts, mobile and extension MAUs, attach rates for VPN/password/family modules, and channel revenue mix by product line.
    whyItMatters: The public bundle is broad, but investors still need evidence on which modules actually drive retention, monetization, and defensibility.
    diligencePath: Request a KPI pack covering subscriber mix, conversion, retention, module usage, and partner versus direct economics for the last four quarters.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE001
    - TE005
