  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 参考项
      - 指标锚
      - 倍数 / 估值状态
      - 与 Aura 的相关性
      - 局限
    rows:
      - - Aura March 2025 Series G 轮
        - 以 $1.6B 估值融资 $140M
        - 唯一直接的公司价格发现
        - 入场纪律的最佳起点锚
        - 债务组合、优先权和 2026 更新均未披露
      - - Gen Digital 公开市场消费者网络安全套餐
        - $15.03B 市值，FY2025 收入 $3.935B
        - 约 3.8x 市值 / 收入代理倍数
        - 最接近的公开消费者网络安全套餐边界
        - 规模大得多、盈利更强，披露完整
      - - TransUnion 欺诈 / 信用数据既有巨头
        - $13.62B 市值，2024 收入 $4.2B
        - 约 3.2x 市值 / 收入代理倍数
        - 有助于界定身份、欺诈和信任数据边界
        - 业务组合和信用周期敞口不同
      - - Experian 全球披露参考
        - $31.82B 市值，加上年报中广泛消费者服务规模的证据
        - 边界标记，不是干净的同类倍数
        - 显示上市既有巨头能提供多少披露和平台宽度
        - 多元化全球征信局和数据业务，不是纯 Aura 对标
      - - 消费者套餐价格簇
        - Identity Guard、Experian、Surfshark 以及排名页面显示，消费者套餐月费多在低 $10s 到 $20s 中段。
        - 价格参考，不是估值倍数
        - 有助于封顶拥挤品类的溢价假设
        - 缺少留存和利润率数据时，消费者定价不能直接映射到企业价值
    notes: 仅是部分可比集合。保留下来的公开证据支持设定边界和价格纪律，而不是银行家级别的可比公司材料。
