      - number: '8.4'
        title: 下行压力与最终尽调
        blocks:
          - type: paragraph
            body: >-
              核心压力不在于 Aura 有没有增长，而在于投资者能否按报价把增长转成回报。缺少股权结构表条款，表面公平的入场估算也可能被抹掉。缺少经审计收入、毛利率和留存数据，就无法判断 Aura
              值不值得拿软件式溢价估值，还是只应拿一个体面的私营公司估值标记。March 2026 数据泄露也重要，因为安全公司在信任上受到的审视比普通软件商更严。


              因此最终尽调清单很短，也很硬。投资者需要瀑布分配、经审计经济性和 2026
              实时价格发现，才有理由离开继续研究。他们还需要数据泄露后的流失和合作伙伴影响数据，因为合作伙伴带动的分销既是投资逻辑的一部分，也是潜在集中风险。若管理层能在上一轮价格或更低水平补齐这些缺口，结论可以改善。若缺口仍在却要明显溢价，保守答案应继续是否定。
