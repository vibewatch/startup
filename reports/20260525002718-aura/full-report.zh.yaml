  - id: TU005
    title: 扩张与集中风险表
    columns:
      - 扩张驱动因素
      - 集中或摩擦风险
      - 影响
      - 当前公开信号
      - 尽调路径
    rows:
      - - MetLife 雇主福利渠道
        - 一个具名雇主福利渠道显著高于其他渠道
        - 可能带来大量覆盖人数，但也会集中渠道权力
        - MetLife 是美国独家雇主分销商，该权益已接入 MetLife 系统
        - 索取覆盖人数、雇主数量、续约条款，以及与 MetLife 绑定的福利收入占比
      - - 直接合作伙伴和经销商
        - 广覆盖说法可能仍掩盖少数经济上占主导的合作伙伴
        - 若足够分散，可低成本拉新；若集中，则形成敞口
        - Aura 称，直接合作伙伴加员工福利贡献了 2025 年收入的 >30%
        - 按收入和覆盖用户数提供前 10 大合作伙伴
      - - Aura Business / MSP 路径
        - 新扩张路径，付费采用尚不清楚
        - 可能在家庭订阅之外打开新的 B2B 客群
        - Aura 于 2026 年推出面向 MSP 的 BYOD 安全产品，渠道媒体将其包装为新的经常性收入 机会
        - 提供 MSP 客户 logo、席位数和续约数据
      - - 应用商店分发
        - 平台定价和抽成率可能不同于官网经济模型
        - 改变实际 ARPU，并让留存分析更复杂
        - App Store 价格不同于官网标价
        - 提供 Web、Apple、Google 的计费结构和续约行为
      - - 家庭增购逻辑
        - 不限儿童数和多成人打包可能提升粘性，但也抬高服务负担
        - 价值主张成立时，可支持在单个家庭内先落地再扩张
        - 家庭套餐把身份、设备和儿童安全功能打包，覆盖最多 5 名成人和不限数量儿童
        - 提供套餐结构迁移、附加购渗透和降级率
      - - 支持驱动的留存
        - 良好补救可挽回账户，但 bug 修复或数据删除体验不均会抵消效果
        - 在诈骗响应产品里，支持质量可能是真正的留存杠杆
        - 客服页面和评论同时出现表扬与投诉主题
        - 提供支持 CSAT、重复联系率和事件后留存
    notes: 核心风险不是没有渠道，而是看不清这些渠道有多集中，以及它们续约是否像直接家庭订阅一样 干净。
