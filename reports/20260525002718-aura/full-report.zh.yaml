      - number: '2.4'
        title: 约束、替代品与估值影响
        blocks:
          - type: paragraph
            body: >-
              该品类最大的约束是价格压力、组合重叠、续费摩擦和信任。Aura 自己的标价并不低，即使评测网站常因功能广度把它描述为性价比强。Identity Guard 和 Experian
              都提供知名身份保护替代品，Surfshark 和其他数字安全组合则在泄露提醒、防病毒、VPN、数据删除等非信用功能上重叠。这意味着消费者常能用更便宜或已经拥有的工具拼出 Aura
              部分价值主张，除最深的身份修复和家庭保护流程外，其余功能都有商品化风险。订阅经济又增加一层摩擦：Aura 的 FAQ 把取消和 60
              天退款保证列为常见买方问题，服务条款则明确自动续费。信任是最尖锐的约束，因为保护类品牌会被按高于普通 应用的标准衡量。SecurityWeek、Cybernews 和 Have I Been Pwned 佐证的
              Aura 2026 年泄露没有抹掉市场需求，但显示一个售卖安全感的品类里，可信度受损可以多快。估值上，市场足够大、痛点足够强，值得关注；但公开证据仍不足以隔离 Aura
              当前收入结构、渠道结构或真实流失，因此不能仅凭市场规模支持精确 SOM 或溢价倍数。
