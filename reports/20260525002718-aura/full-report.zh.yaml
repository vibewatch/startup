  - id: TR005
    title: 缓释与投资逻辑破裂标准表
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 泄露与信任受损
        - 新安全事件，或披露质量明显恶化
        - 再次出现外部可见事件、通知延迟，或有证据显示生产监控数据被暴露
        - 转入下行情景；在投入新资本或提高信心前，要求独立安全审计。
      - - 账单与追索摩擦
        - 退款、取消或仲裁投诉增加
        - 与自动续费、退款或消费者条款相关的评论明显恶化，或监管机构询问
        - 将定价权视为弱于标价所暗示，并下调留存假设。
      - - 支持与警报精确度
        - 出现支持积压或准确性担忧
        - 公开证据显示警报延迟、案件未解决，或支持评论恶化，且没有对冲性的 KPI 披露
        - 假设流失更高、服务成本更高、品牌转化更弱。
      - - 合作伙伴集中
        - 渠道结构集中但不披露
        - MetLife 或少数合作伙伴变得更关键，但集中度和续约数据仍未披露
        - 在集中度被量化前，把渠道杠杆标为风险，而不是护城河。
      - - 财务不透明
        - 下一次更新或融资事件后，管理层仍不披露债务和利润率细节
        - 尽管有新战略扩张，仍不披露债务拆分、毛利率或现金跑道
        - 保持推荐受限，因为下行无法承销。
      - - 消费者、家庭和 MSP 产品线上的执行摊子过大
        - 扩张继续，但证据停留在发布层面
        - 产品界面和渠道说法增加，却没有客户结果、SLA 数据或稳定文档
        - 下调战略溢价假设，并要求证明产品广度在复利增长，而不是稀释焦点。
    notes: 阈值聚焦会改变承销判断的可观察事件，而不是泛泛叙事担忧。
