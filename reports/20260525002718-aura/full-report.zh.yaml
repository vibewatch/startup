      - number: '7.3'
        title: 伙伴、渠道与模式风险
        blocks:
          - type: paragraph
            body: >-
              Aura 下一组主要风险集中在渠道合作依赖，以及仍处早期的 BYOD 和企业叙事。公开证据已经很清楚：Aura 不再只是直接零售订阅产品。2025 年，经 MetLife 分销的员工福利和直接合作已贡献超过
              30% 收入，管理层还在继续推进由 MSP 带动的 BYOD 安全。扩张有战略吸引力，但也改写了风险结构。MetLife 带来分销杠杆，同时把多方问责、品牌和服务模式复杂度带进来。MSP
              路线击中了真实痛点，但公开证据目前主要还是发布材料和渠道报道，而不是可持续的客户结果。财务上同样如此：Aura 确有规模、超过 1.6 million 客户，也有 2025 年 140 million
              dollar 融资带来的新资金，但公开披露离毛利、债务和集中度可见性还差很远。独立评测进一步说明，这个组合常靠覆盖面和便利性取胜，而不是靠品类领先的深度；因此高级定价必须持续守住。投资逻辑不会因为 Aura
              有渠道而破；真正会破的是，渠道依赖上升得比披露、续约韧性和经营证明更快。
