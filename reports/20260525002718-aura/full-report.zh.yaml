      - number: '8.3'
        title: 情景区间与退出路径
        blocks:
          - type: paragraph
            body: >-
              情景分析应被当作价格纪律，而不是 DCF。乐观情景下，Aura 证明 2024 增长不是一次性，合作伙伴带来的收入变成结构性更便宜的分销引擎，且 2026
              数据泄露的经济后果有限。在这个世界里，战略买家或后期投资者可以为上一轮后的估值上调找到理由。基准情景下，Aura
              足以守住上一轮价格或略高于它，但考虑稀释和优先权后，还不足以给新增资金带来突出的回报。悲观情景下，竞争、数据泄露拖累或渠道集中度把公司推向平轮或下轮。


              退出逻辑也更偏向战略相关性，而不是 IPO 式精确。Gen Digital、TransUnion 和 Experian
              等公开在位公司规模更大、业务更多元，因此更像边界标尺，而不是直接交易可比。基于现有证据，战略退出比干净的独立上市故事更可信。实际含义很简单：投资者应围绕上一轮价格设定区间，并明确什么证据会把区间上移或下移。
