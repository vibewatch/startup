              是最清晰的机构证明点，Aura 自己的家庭和支持页面也展示了具名消费者证言，描述欺诈提醒、支持互动和家长控制使用。主要限制在证据质量。精选证言和编辑测试显示真实使用，但不等同于披露续费队列或账户级支出。
