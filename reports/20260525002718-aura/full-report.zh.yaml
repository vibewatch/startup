      - 估值 / 回报逻辑
      - 概率信号
      - 关键下行触发
    rows:
      - - 乐观
        - 合作伙伴驱动的增长保持韧性，泄露事件证明经济影响可控，管理层拿出干净的优先权条款。
        - $2.1B-$2.6B 估值区间，约为稀释前上一轮的 1.3x-1.6x。
        - 可能成立，但取决于尽调
        - 渠道质量或股权结构表条款若不及预期，该情景就会崩掉。
      - - 基准
        - 增长回归常态，合作伙伴渠道仍有帮助，且没有新的 2026 价格发现。
        - $1.4B-$1.9B 估值区间，相比上一轮大致持平到小幅上行。
        - 最能被公开证据支撑
        - 任何高于上一轮的溢价要价，都需要尚未公开的证据支撑。
      - - 悲观
        - 泄露拖累、同行价格压力或渠道集中暴露，会压缩增长和投资人胃口。
        - $0.8B-$1.3B 估值区间，符合持平或下行轮风险。
        - 尽调不顺时随时会落入该情景
        - 若现场融资进程偏弱，或泄露后队列表现反向，判断会被推到这里。
    notes: 这些区间是以上次披露融资为锚的情景带，不是伪 DCF。隐藏优先权可能在每个情景里显著削弱投资人回报。
