      - number: '6.3'
        title: 耐久度、支持与续费摩擦
        blocks:
          - type: paragraph
            body: >-
              耐久度是 Aura 客户故事中披露最少的部分。公司为年付计划公布慷慨入门机制——14 天免费试用和 60 天退款保证——客户服务页也大量强调 24/7
              支持和白手套修复是用户留下的原因。这些都是建设性留存杠杆，独立评测也普遍同意支持和欺诈处理广度是重要优势。但合约层比首页话术更不宽松。Aura
              条款称，除非至少在下一个账单周期前一天取消，否则订阅会自动续费；Aura 可提前 30 天通知改价；许多商业、福利和经销商注册不退款。第三方评测也指出高于平均的价格、跨平台价格不一致、bug
              修复慢、数据删除满意度不均。2026 年 3
              月泄露后，信任图景恶化；独立报道认为，这可能削弱一个建立在防诈骗之上的品牌信心。最重要的是，已审查公开来源没有披露付费订户数、流失、GRR、NRR、合约期限或续费队列。公开情绪和支持证据存在；硬耐久度指标不存在。
