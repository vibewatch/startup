      - number: '8.2'
        title: 融资背景与可比视角
        blocks:
          - type: paragraph
            body: >-
              最好的直接估值锚仍是 Aura 自己的 March 2025 融资。这个锚重要，因为它是公司唯一公开的硬价格发现；但它已经滞后，也不完整。它早于 March 2026
              数据泄露，不披露债务组合或清算优先顺位，也仍让投资者拿不到经审计收入这个分母。因此正确做法不是假装精确，而是用公开可比公司三角校验，并追问这些可比到底能买来多少信心。


              这种三角校验方向上有帮助，但不能定论。Gen Digital 和 TransUnion 有用，是因为它们披露收入基数和市值，能给出大致低到中 3x 区间的公开股权价值 / 收入视角。Experian
              的价值在披露和规模参照，而不是干净的纯业务倍数。这些在位公司更大、更多元、也已上市，关键正是在这里：Aura
              要投资者在没有这些公开同行天然提供的分母时，为一个私有的组合与渠道平台定价。因此，可比公司组支撑的是纪律，而不是精确目标倍数。
