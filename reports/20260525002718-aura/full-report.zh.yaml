  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Aura 作为公司更容易让人看好，作为一笔干净可承销的投资却难得多。正面证据是真的：公司披露 March 2025 的 Series G 估值 $1.6 billion，称消费者需求推动 2024 GAAP
              收入大约增长 50%，称保护超过 1.6 million 客户，现在又称直接合作加员工福利占 2025 收入超过 30%。这些事实支撑一个判断：Aura
              不再只是直接面向消费者的身份盗窃保护产品；它正在试图变成覆盖更广的在线安全平台，并借渠道撬动增长。


              价格问题更难。公开证据仍未披露这一轮债务与股权的拆分、完全稀释后的股权结构表、经审计收入、ARR、毛利率或留存。独立排名有助于判断产品质量，但也说明捆绑式身份保护是拥挤赛道，单靠功能宽度并不稀缺。因此这里的结论是继续研究，而不是买入。在最近披露的
              $1.6 billion 价格附近，如果尽调确认条款干净、渠道经济性可持续，这个估值算合理。没有新证据还往上，估值会很快偏高。
