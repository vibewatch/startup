  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 改变判断的证据
    rows:
      - - 增长与规模
        - 2024 GAAP 收入增长 50%，客户数 1.6M+，说明规模真实成形。
        - Aura 未披露经审计收入、留存或利润率，增长质量仍停留在公司口径。
        - 提供经审计的 2024-2025 收入、留存和毛利率桥接。
      - - 渠道
        - 2025 收入中超过 30% 来自直接合作伙伴和员工福利，说明渠道杠杆已超出 D2C。
        - 如果少数合作伙伴主导增长，渠道结构也会掩盖集中度风险。
        - 逐渠道披露收入、续约率和 CAC 回本周期。
      - - 产品质量
        - 独立排名把 Aura 放在品类前列，支撑强消费者套餐的判断。
        - 这些排名也显示可靠替代品很多，仅靠套餐广度并不稀缺。
        - 证明留存、附加率或理赔经济性显著好于同类套餐。
      - - 估值锚
        - March 2025 公开留下 $1.6B 的硬估值锚。
        - 这个锚点已过时，也没有披露债务组合、优先权或 2026 价格发现。
        - 披露完整分配瀑布和任何更新中的融资进程。
      - - 风险
        - 此次泄露未触及核心身份数据库，限制了最悲观解读。
        - 安全品牌更怕信任事件，因此即便暴露有限，也会抬高获客和合作伙伴摩擦。
        - 披露泄露后的流失、理赔、合作伙伴尽调和事件补救数据。
    notes: 两边都有证据支撑。反向逻辑刻意不是泛泛的风险清单；它列的是最能直接改变估值的一组事实。
