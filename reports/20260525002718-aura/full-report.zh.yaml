      - number: '5.4'
        title: AI 定位、成熟度与产品风险
        blocks:
          - type: paragraph
            body: >-
              Aura 的 AI 说法应理解为功能和决策层定位，而不是公开披露的基础模型护城河证据。官方页面和应用列表把 AI 品牌贴到垃圾电话和短信防护、在线平衡或健康建议、AI
              聊天应用提醒，以及雇主或家庭在线安全工具上，但被引用来源都没有披露模型家族、训练数据来源、评估方法或误报率。这让 AI 叙事有商业价值，但技术上不透明。公开证据中更能辩护的差异化是组合设计：Aura
              把身份监控、信用、隐私清理、设备保护、家庭安全和修复压进一个订阅和一个上手流程。独立评测持续认可这一广度，但也有多家称 VPN、防病毒和密码管理器只是便利级，而非可替代 同类最佳的独立产品。2025 年
              MetLife 和 Aura Business 发布显示，Aura 有向福利和以身份为中心的 BYOD 安全扩张的路径，但这些动作看起来仍早于成熟消费者身份产品。总体看，Aura
              在消费者身份和信用流程上最成熟，在公开技术透明度、企业证据和独立记录的 AI 治理上最不成熟。因此，最大的承保风险不是组合虚构，而是护城河更容易在包装和流程广度上验证，难以在已披露技术原语、可靠性指标或可衡量
              AI 控制上验证。
