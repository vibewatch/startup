  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 优先权冲击
        - 股权结构表显示沉重的高级清算优先权、反稀释棘轮或债务偏重结构
        - 新钱回报数学变差后，表面价格是否合理就不再重要
        - 暂停交易，按分配瀑布重估，而不是只看企业价值
      - - 增长质量不及预期
        - 留存或渠道队列无法支撑 2024 之后的可持续增长
        - 乐观和基准情景失去核心经营支撑
        - 重置到基准或悲观情景，拒绝溢价入场
      - - 泄露经济后果
        - 事件后的流失、理赔或合作伙伴尽调显著恶化
        - 信任风险从叙事问题变成利润和 CAC 问题
        - 下调估值区间，并要求更强条款
      - - 品类价格压缩
        - 同类套餐继续靠低月费和宽功能有效竞争
        - 即便需求健康，稀缺性溢价也会消失
        - 只使用围绕上一轮或低于上一轮的保守区间
      - - 没有新价格发现
        - 管理层在没有新财务披露或市场检验证据的情况下寻求明确溢价
        - 估值问题从合理价值争论变成不对称入场风险
        - 除非价格或尽调权限改善，否则退出
    notes: 这些是投资触发器，不是经营看板。每一个都应迫使估值重新下调。
    claimRefs:
      - CV035
      - CV037
      - CV041
      - CV044
      - CV046
      - CV050
  - id: TV006
    title: 最终尽调需求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
      - 对建议的影响
    rows:
      - - 股权结构表与分配瀑布
        - 完全稀释后所有权、债务与股权拆分、清算优先权、期权池和反稀释棘轮
        - 直接决定每个情景下的投资人结果
        - 财务 + 律师提供模型和治理文件
        - 最大的上调或否决因素
      - - 经审计经济性
        - 经审计收入、ARR、毛利率、现金、债务期限表和渠道组合
        - 把工作从设定区间推进到真正承销
        - CFO 数据室资料包
        - 任何买入动作前都必须拿到
      - - 留存与队列质量
        - GRR、NRR、渠道留存、理赔损失率和 CAC 回本周期
        - 区分可持续分发杠杆和单一年份的漂亮增长
        - FP&A 和增长负责人复核
        - 若足够强，可支撑适度上调估值
      - - 泄露后经营影响
        - March 2026 之后的流失、合作伙伴尽调结果、理赔量和补救成本
        - 显示信任损害是否在经济上可控
        - 安全 + 客户成功 + 合作伙伴运营复核
        - 答案偏弱会把情景推向悲观
      - - 实时价格发现
        - 任何 2026 投资条款清单、银行家区间、老股交易或董事会估值更新
        - 价格敏感建议需要当前入场参考
        - CEO / CFO 融资讨论
        - 决定机会现在是否可执行
    notes: 这些需求按决策影响排序。没有前两项，本章建议应保持继续研究。
    claimRefs:
      - CV037
      - CV038
      - CV045
      - CV048
      - CV049
      - CV050
