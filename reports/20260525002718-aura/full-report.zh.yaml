  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模估算逻辑
        blocks:
          - type: paragraph
            body: >-
              Aura 首先应放在消费者身份盗用和欺诈保护订阅内估算，再谨慎扩展到相邻数字安全层，而不是并入全部消费者网络安全。核心包含支出是围绕身份、信用、欺诈、账户被盗、恢复支持和保险支持援助的监控与修复。Aura
              自己的产品页用数据经纪商删除、防病毒、VPN、安全浏览、垃圾信息拦截、家长控制、儿童身份保护和家庭覆盖拓宽了这一核心，因此实操市场边界是由身份风险锚定的消费者数字保护，而不是狭窄的单功能信用提醒工具。公开综合估算确认该品类有意义，但口径敏感。P&S
              将美国市场估为 2024 年 USD 5.2 billion、2025 年 USD 5.5 billion；Mordor 将全球市场估为 2025 年 USD 4.61 billion、2026 年 USD
              5.10 billion；Fortune 则发布更宽的 2025 年全球基线 USD 17.04 billion。因此，正确的尽调姿态是区间判断：用更紧的身份保护服务估算作为核心市场，把更宽的家庭安全、雇主和
              BYOD 邻近机会视为扩展层，而不是自动并入一个被抬高的 TAM。
