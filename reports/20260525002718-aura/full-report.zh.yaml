            body: >-
              Aura 的客户地图比 D2C 身份盗用应用更宽，但公开证据仍聚集在家庭和渠道中介，而不是披露过的账户台账。官方定价和家庭页面展示四类消费者套餐——Individual、Couple、Family 和
              Kids——把 Aura 对应到单身成人、多成人家庭和儿童安全用例。同时，伙伴和商业页面清楚说明，Aura
              也通过雇主、经销商、MSP、保险公司、信用合作社和物业管理渠道销售。规模代理指标有意义，但应视为公司口径，而非经审计订户事实：Aura 称保护 1.6M+ 客户，与 20+ 数字育儿伙伴合作，通过经销商网络帮助
              3M+ 个人保持在线安全，并通过数千个合作关系触达 20 million 人。Aura Business 又提供一个渠道证明点，称 2,100+ 伙伴信任 Aura
              来服务其客户和员工。因此，客户故事是多细分、多渠道的，但公开材料仍未拆分各路径贡献了多少收入，除了“伙伴加福利收入超过 30%”这一披露。
