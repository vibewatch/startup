        title: 公开牵引与分销代理指标
        blocks:
          - type: paragraph
            body: >-
              Aura 不公布经审计收入或 ARR，因此公开牵引只能通过规模代理指标和渠道披露来读。最重要的公司规模代理指标是关于页面称 Aura 保护超过 1.6 million 客户。最强收入线索是 2025 年 3
              月融资公告，称消费者需求激增推动 2024 年 GAAP 收入同比增长约 50%。分销广度几乎和直接订户数同样重要。Aura 经销商页面称，网络通过数千个合作关系触达 20 million 人；Aura
              Business 随后表示，直接合作伙伴加员工福利贡献了 2025 年收入的 30% 以上。MetLife 的福利渠道发布和 Aura
              自己的历史时间线相互印证，说明雇主福利不是试点概念，而是既有分销通道。用户满意度代理指标也支持真实产品采用，尽管不能证明盈利：抓取时 App Store 列表显示 97,000 条评价、评分 4.7，Chrome
              Web Store 列表显示 Aura 仍在维护仅限订户的浏览器工具。净判断偏建设性。Aura 看起来既有消费者拉力，也有非自助渠道触达，但公开证据仍未披露计费量、渠道结构、续费率或各销售路径的实际净收入。
