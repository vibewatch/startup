      - number: '2.3'
        title: 需求驱动与采用动能
        blocks:
          - type: paragraph
            body: >-
              需求由真实损失事件支撑，而不是抽象恐惧。FTC 称 Consumer Sentinel 已收集数千万份报告，并在 2021 年收到超过 5.7 million 份报告；实时 Explore Data
              门户继续用数百万消费者报告来框定欺诈和身份盗用。Security.org 的 2026 年身份盗用统计总结称，大约每 4.9 秒就有人受害，FTC 年内收到超过 6.4 million
              份身份盗用和欺诈报告。FBI IC3 数据显示，在线犯罪投诉和损失仍在攀升，从 2024 年 859,532 起投诉和 USD 16.6 billion 损失，增至 2025 年 1,008,597 起投诉和
              USD 20.877 billion 损失。身份相关数量仍可观，2025 年 IC3 报告中有 31,675 起身份盗用投诉和 67,456 起个人数据泄露投诉。泄露暴露也持续存在：ITRC 记录 2025 年
              3,322 起入侵，同比增 5%，五年增 79%，并发现 80% 的受访消费者在此前 12 个月收到过泄露通知。这一痛点信号已经超出欺诈修复。Aura 的家庭产品、与 MetLife
              的雇主福利公告以及评测覆盖都表明，儿童安全、防诈骗、隐私清理和设备安全便利性正在把品类拉向更宽的消费者数字保护组合。
