      - number: '4.3'
        title: 利润率与成本结构代理指标
        blocks:
          - type: paragraph
            body: >-
              Aura 的支持模式看起来比轻量监控应用更重。每个计划都包含 24/7 客户支持，Aura
              的欺诈专家还明确帮助用户在事件后与征信机构和政府机构沟通。这个服务层在经济上重要，因为即便不考虑产品组合广度，也意味着可观人工成本：多征信局信用监控、欺诈提醒、防病毒、VPN、密码管理、数据经纪商删除、家长控制、安全游戏提醒和浏览器扩展工具都放在同一订阅里。评测也强化了这一权衡。Security.org
              认为组合全面，但界面并不特别直观，旁支服务也不是独立最佳，这符合一个宽平台的画像：经济性可能依赖便利性和交叉销售，而不是每个模块都做到同类最佳 深度。上市公司文件只能提供粗略基准，但仍有用。Experian
              FY25 年报显示，其消费者平台拥有超过 200 million 免费会员，集团层面基准 EBIT 利润率为 28.1%；TransUnion 的 10-K
              说明，与消费者身份相邻的服务成本包括数据采购、支持、维护、电信和数据中心费用。Gen Digital 的 10-K 显示，规模化订阅模式可以混合直接、间接和免费增值获客，但仍依赖庞大付费客户群和持续营销。Aura
              可能共享相同成本项，但自身毛利率、理赔损失负担和单订户支持成本仍未披露。
