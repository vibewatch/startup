  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 重要性
      - 现有公开证据
      - 具体尽调路径
    rows:
      - - 经审计收入 / ARR
        - 估值和增长质量需要以此锚定
        - 公开来源只显示增长代理指标，不显示经审计营收或 ARR
        - 索取经审计财务报表、管理层 P&L bridge，以及官网直销、应用商店、合作伙伴账单额拆分
      - - 毛利率
        - 判断捆绑包经济性和理赔支持负担需要该指标
        - 只有公开可比公司申报文件和 Aura 的支持模式提供间接线索
        - 索取按产品和渠道拆分的 GAAP 毛利率，以及支持和供应商成本分摊
      - - CAC 和回本周期
        - 检验增长是否资本效率高需要该指标
        - 无公开 CAC、回本周期或营销效率披露
        - 索取付费、自然、合作伙伴和福利渠道 CAC，以及 cohort 回本表
      - - 流失 / NRR / 续费质量
        - 判断订阅耐久性需要该指标
        - 无公开流失、NRR 或续费率披露
        - 索取 logo 流失、收入流失、NRR，以及年付与月付续费曲线
      - - 渠道结构和集中度
        - 用于测算对应用商店、合作伙伴和 MetLife 式分销方的依赖
        - 公开证据显示，直接合作伙伴加福利渠道贡献 2025 年收入 >30%，但不披露拆分或集中度
        - 索取按官网直销、应用商店、员工福利和直接合作伙伴拆分的账单额，以及头部渠道集中度
      - - 债务拆分和条款
        - 判断资本充足性和下行风险需要该指标
        - 公开记录称该轮混合股权和债务，但未说明债务规模或定价
        - 索取债务协议、利率、期限、约束条款和担保包
      - - 现金 / burn / runway
        - 判断 Aura 何时可能需要更多外部资本需要该指标
        - 无公开现金余额、burn 或 runway 披露
        - 索取当前现金桥、董事会预算和下行 runway 模型
    notes: 这些缺口是本章最终判断保持中等置信度的原因。需求信号可见；测算输入不可见。
