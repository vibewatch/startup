        - 衡量转化中有多少由儿童或家庭用例驱动
      - - 雇主福利渠道扩张
        - 正向
        - 近期
        - 可能降低 CAC，并在纯 D2C 拉新之外建立赞助式分发
        - 索取雇主渠道会员数，以及相对零售用户的留存数据
      - - BYOD 与身份中心化访问风险
        - 正向
        - 近期
        - 个人安全与企业访问流程可能打开相邻收入池
        - 核实这已是有意义的收入，还是仍只是期权价值
      - - 价格敏感和更便宜替代品
        - 负向
        - 当前
        - 消费者可以拿它与低价传统身份方案或更宽的安全套装比较
        - 按方案价位审查赢单 / 输单和附加购买率
      - - 功能重叠和套装商品化
        - 负向
        - 当前
        - VPN、杀毒、泄露提醒和数据清除在其他产品里越来越常见
        - 找出哪些功能真正让用户愿意为超出同质套装的部分付费
      - - 自动续费、取消和客服摩擦
        - 负向
        - 当前
        - 用户不信任订阅，会压低试用转化或推高流失
        - 按方案索取流失、退款和投诉率数据
      - - 供应商泄露造成的信任冲击
        - 负向
        - 当前
        - 保护品牌一旦自身被攻破，声誉损伤会被放大
        - 测试 2026 年事件是否影响转化、续费或渠道伙伴
      - - 对方法高度敏感的 TAM 估算
        - 负向
        - 当前
        - 如果管理层选用最宽口径，区间很宽的估算会抬高估值
        - 要求管理层给出与已披露渠道和方案组合绑定的自下而上 SAM
    notes: 这张表把需求驱动和阻力放在一起，因为真正关系估值的不是市场是否存在，而是采纳速度能否跑赢替代品压力、信任摩擦和模糊的市场定义口径。
