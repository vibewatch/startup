          value: 0.8
          note: 如果信任影响和优先权安排都走坏，可能出现降估值轮。
        - label: 证据弱 / 平轮
          value: 1.2
          note: 除了过期锚点，几乎没有更多证明。
        - label: 上次披露锚点
          value: 1.6
          note: 2025 年 3 月的公开估值参考。
        - label: 条款干净 + 渠道稳定
          value: 2
          note: 只有尽调补齐核心缺口，才支持温和上调。
        - label: 战略渠道乐观
          value: 2.4
          note: 需要合作伙伴杠杆可持续，且入侵影响受控。
    approximationNotes: 数值单位为十亿美元，体现情景纪律，不是市场化融资区间。
    claimRefs:
      - CV036
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 熊市、基准和乐观情景的低 / 中 / 高区间，并把 2025 年 3 月轮次作为公开参考点。
    data:
      items:
        - label: 悲观情景
          low: 800
          base: 1050
          high: 1300
          unit: USD M
          note: 竞争、入侵拖累或弱条款会推高平轮 / 降估值轮风险。
        - label: 基准情景
          low: 1400
          base: 1650
          high: 1900
          unit: USD M
          note: 公司质量不错，但证明不完整；稀释前上行空间有限。
        - label: 乐观情景
          low: 2100
          base: 2350
          high: 2600
          unit: USD M
          note: 需要合作伙伴经济性可持续、条款干净，且入侵后续影响有限。
        - label: 2025 年 3 月公开锚点
          low: 1600
          base: 1600
          high: 1600
          unit: USD M
          note: Aura 上次披露的估值。
    approximationNotes: 如果隐藏优先权或稀释很大，真实投资者回报可能明显低于企业价值结果。
    claimRefs:
      - CV001
      - CV036
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 在当前证据质量下，对 Aura 最关键维度给出可提交投委会的评分。
    data:
      items:
        - label: 品类需求
          score: 8
          note: 欺诈发生率和市场研究支撑需求。
        - label: 增长证明
          score: 7
          note: 公开增长主张很强，但仍主要来自公司口径。
        - label: 渠道杠杆
          score: 7
          note: MetLife 和合作伙伴组合是真实加分项。
        - label: 产品质量
          score: 7
          note: 独立排名提供正面支撑。
        - label: 披露质量
          score: 3
          note: 经审计的经济性和股权结构条款仍然缺失。
        - label: 信任风险
          score: 4
          note: 入侵事件并非灾难性，但对安全品牌仍然重要。
        - label: 估值支撑
          score: 5
          note: 上一轮估值看起来能守住，但不算明显便宜。
        - label: 可操作性
          score: 4
          note: 缺少当前价格发现和数据室之前，这个机会还不到买入阶段。
    approximationNotes: 分数是基于保留证据集的序数型承销判断，不是基准指数。
    claimRefs:
      - CV020
      - CV035
      - CV040
      - CV043
      - CV048
