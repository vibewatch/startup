chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与规模快照
        blocks:
          - type: paragraph
            body: >-
              Aura 如今是一家大波士顿地区的成长期数字安全公司，2017 年以 iSubscribed 名义创立，后来通过 Identity Guard、Pango、PrivacyMate/FigLeaf 和 Circle
              交易重塑业务。Aura 的关于页面、定价页和 2025 年 Series G 材料口径一致：公司不是单一功能的身份监控产品，而是面向个人和家庭的 AI
              驱动一体化在线安全平台。当前消费者组合覆盖身份盗用保护、三大征信局信用监控和信用锁、设备安全、VPN、密码管理、数据删除，以及家庭 / 游戏安全功能。Aura 自己披露的规模有意义，但需要框定：公司称保护
              1.6M+ 客户，与 20+ 数字育儿伙伴合作，并通过经销商 / 伙伴渠道帮助 3M+ 个人保持在线安全。分销显然不止 D2C 订阅，因为公司也通过保险公司、雇主、信用合作社、MSP
              和物业经理销售。总部披露仍不精确，独立来源在 Burlington 和 Boston 之间摇摆，因此第一章最稳妥的表述是“Greater Boston”。
