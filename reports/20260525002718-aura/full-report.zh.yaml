      - number: '5.3'
        title: 可靠性、隐私与安全控制
        blocks:
          - type: paragraph
            body: >-
              Aura 的信任叙事既靠服务运营和政策姿态，也靠代码。官方页面承诺 24/7 美国本土支持、白手套欺诈处理，以及每名成人最高 $1 million 保险；隐私政策则把 Aura
              定义为跨产品、服务、应用和网站的提供商，并指向产品专属隐私通知。商店披露比营销站提供更多细节。App Store
              隐私标签称，购买、财务信息、联系方式和用户内容可能与身份关联，部分位置、使用和诊断数据会被收集但不关联身份。Chrome Web Store
              表示，扩展数据不会出售给第三方，也不会用于无关目的或信用资质决策。Aura 还为美国客户发布 FCRA 摘要，符合一个触达消费者报告流程的产品定位。最尖锐的信任测试是 2026 年 3 月泄露。Aura
              称，一名员工遭电话钓鱼攻击，暴露了约 900,000
              条主要来自营销名单的记录，未触及监控数据库，也未触及社会安全号码、财务数据、信用记录或密码等敏感字段。即使影响半径有限，该事件仍然重要，因为安全品牌会被按社会工程韧性和事件披露质量来评判。爬取中出现一个失效的
              /security-incident URL，而实质更新位于新闻稿 URL 下，这暗示事件沟通更像企业传播，而不是持久的公开信任中心。
