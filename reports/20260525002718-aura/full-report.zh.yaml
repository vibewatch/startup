      - number: '1.3'
        title: 资本历史、分销渠道与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Aura 的资本叙事在 2024 年从 Pango / Point Wild 分离后变得清晰。2025 年 3 月，公司宣布以 $1.6B 估值完成 $140M 股债混合 Series G，由 Ten
              Eleven Ventures 和 Madrone Capital 领投，AT&T Ventures 加入，既有投资方 Accel、Warburg Pincus 和 General Catalyst
              参投。Tracxn 独立记录了相同的最新轮次和估值标记，FinTech Global 与 FinSMEs 也佐证了规模和财团。融资也解释了 Aura 为何拓宽商业化路径。MetLife
              仍是雇主福利锚定伙伴，2025 年 Aura Business 发布称，直接合作伙伴加员工福利分销已经贡献 2025 年收入的 30% 以上。这表明 Aura
              已不只是订阅应用，而是一个多渠道平台，覆盖直接消费者、雇主福利、保险公司、经销商 / MSP，以及更新的企业安全用例。未解决问题在结构：公开来源没有拆分 $140M
              中的债务和股权，也没有展示各投资人的持股比例或董事会 / 控制权。
