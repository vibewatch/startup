  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开客户触点从官网发现和免费试用注册，延伸到由支持团队主导的事件响应，最终可能通过渠道扩张。
    data:
      items:
        - actor: 潜在直销消费者
          touchpoints:
            - Aura 关于 / 定价页面
            - Security.org 或 U.S. News 评测
            - App Store 截图和评分
          emotion: 想用一个订阅降低欺诈焦虑
          painpoint: Identity-theft protection is crowded and hard to compare
          opportunity: Broad bundle and visible ratings lower initial research friction
          label: 发现
        - actor: 新订阅用户或家长管理员
          touchpoints:
            - 14 天试用结账
            - 使用 SSN 和个人信息设置账户
            - 安装 app，并可选择连接设备或银行账户
          emotion: 谨慎乐观，但对隐私敏感
          painpoint: Onboarding asks for a lot of personal information and setup time
          opportunity: Fast initial setup plus guided onboarding can convert high-intent households
          label: 注册 / 入门
        - actor: 活跃家庭用户
          touchpoints:
            - 欺诈提醒和信用控制
            - 密码管理器 / VPN / 数据移除工具
            - 客服和补救渠道
          emotion: 风险出现时重视便利性
          painpoint: Bundled side tools may be good enough rather than best-of-breed
          opportunity: Fast alerts and white-glove support can deepen perceived value
          label: 主动防护
        - actor: 家庭套餐家长
          touchpoints:
            - 家长控制
            - 线上健康报告
            - 安全游戏和提醒共享
          emotion: 需要控制权，但不想持续手动盯守
          painpoint: Family features still rely on trust in monitoring accuracy and sensible defaults
          opportunity: Household-level utility can support multi-seat expansion and reduce churn
          label: 家庭治理
        - actor: 员工福利或合作伙伴渠道注册用户
          touchpoints:
            - MetLife 雇主福利
            - 合作伙伴或经销商优惠
            - 物业管理或保险公司分发
          emotion: 通过既有可信关系发现 Aura
          painpoint: Benefits or reseller terms can differ from direct web expectations
          opportunity: Channel trust can broaden reach faster than direct consumer marketing alone
          label: 渠道获客
        - actor: 续约或扩张客户
          touchpoints:
            - 自动续费通知
            - 事件后的支持互动
            - 套餐变更、取消或附加购决策
          emotion: 评估套装是否仍配得上价格
          painpoint: Auto-renewal, refund limits, and breach-related trust questions can increase scrutiny
          opportunity: Good support and broader family/business use cases can create expansion loops
          label: 续约 / 扩张
    claimRefs:
      - CU006
      - CU013
      - CU018
      - CU022
      - CU026
      - CU031
