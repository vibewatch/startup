      - number: '2.2'
        title: 买方、用户、付款方与渠道细分
        blocks:
          - type: paragraph
            body: >-
              Aura
              历史核心的直接买方是家庭决策者，但产品拓宽后，用户和付款人会分离。个人计划里，成人用户通常也是付款人。情侣和家庭计划里，经济买方往往是一位家庭财务管理员，用户则包括配偶、孩子，有时还有年长亲属；这些人暴露于欺诈、诈骗或在线伤害，从而形成紧迫感。公开评测来源一致把家庭覆盖、信用监控、保险、设备安全和家长控制视为关键购买标准，进一步说明产品竞争点是便利和广度，而不是单一监控功能。两个相邻渠道对
              SAM 扩张重要。MetLife 合作显示了雇主福利动作：HR 或福利负责人可以付款，员工和家庭是终端用户。面向 MSP 的 Aura Business 指向另一条 BYOD
              和以身份为中心的访问安全动作，买方变成 MSP、SMB 经营者或 IT 管理员，但用户仍是使用个人设备的员工。这些渠道重要，但当前公开证据支持把它们视为相邻扩张动作，而不是证明全部企业安全支出都属于 Aura
              当前消费者市场 TAM。
