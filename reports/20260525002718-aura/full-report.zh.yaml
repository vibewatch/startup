        - 稀释前，基准情景看起来大致持平到小幅上行
        - 中低
        - 没有更强证据前，不要按溢价结果承销
    notes: 这张表刻意对价格敏感：合理是指围绕最近披露轮次、且条款干净；不是任何价格都合理。
