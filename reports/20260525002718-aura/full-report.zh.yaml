  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与定位
        blocks:
          - type: paragraph
            body: >-
              Aura
              处在一个拥挤但仍分层的市场中心。直接比较对象不是所有消费者安全应用，而是更小的一组厂商：它们把身份监控与信用可见度、保险支持恢复、欺诈专家和家庭覆盖中的若干项组合在一起。按这个口径，LifeLock、Identity
              Guard 和 Experian IdentityWorks 是最清晰的直接同业。相邻压力来自 Surfshark One+ 等隐私或安全组合，以及 2026 年 3 月事件后评测网站放入 Aura 替代清单的
              NordProtect 风格产品。现状替代也重要，因为许多家庭可以把信用冻结、银行提醒、密码工具或 VPN 拼在一起，而不购买专门套件。Aura
              的相对优势是广度和简单包装：当前组合从身份监控和信用锁延伸到设备安全、数据删除和儿童安全，而多数对手只在保险品牌、价格或信用资历等更窄轴线上取胜。
