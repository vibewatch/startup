      - number: '5.2'
        title: 运营模型、部署与依赖
        blocks:
          - type: paragraph
            body: >-
              公开证据足以描绘 Aura 的运营模型层，但不足以反向工程隐藏后端栈。可见交付层是网站订阅流程，加上 iOS、Android 和 Chrome 端。Chrome
              扩展强调密码捕获、密码健康检查、跟踪器拦截和电子邮件别名；移动应用展示提醒、信用控制、隐私功能和家庭监控；Android 列表还异常具体地说明，儿童安全控制会使用本地 VPN 和 Android
              Accessibility Service 来执行过滤并检测输入发生的上下文。评测者称，设置过程有意要求大量数据，因为 Aura 需要身份属性；部分金融监控功能还需要关联账户，SafeHome 特别指出
              Plaid 是银行账户连接器。这意味着实际架构是一组客户端应用、监控和提醒服务、第三方信用和金融数据源、数据删除流程，以及人工修复运营。Aura Business 将同一运营模型延伸到以身份为中心的 BYOD
              安全，重点放在设备背后的员工，而不是试图替代传统 MDM 或端点安全。缺失层是深层后端。被引用的官方产品页都未披露云厂商、内部数据管道、详细服务拓扑，或 Aura Intelligence
              背后的模型架构。尽调中的安全解释，是描述公开运营层，避免编造 Aura 未公布的实现细节。
