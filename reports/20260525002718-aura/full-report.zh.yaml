      - number: '4.4'
        title: 资本充足性、收入质量判断与卡点
        blocks:
          - type: paragraph
            body: >-
              Aura 的资本故事在 2025 年 3 月明显改善，但仍只部分可见。公司称以股权和债务混合形式融资 $140 million，估值 $1.6 billion；Tracxn
              还单独记录了同日一笔未披露金额的常规债务轮，伴随 Series G 出现。这一组合重要，因为它意味着公司不只是发行新股，但公开记录没有说明 $140 million
              中有多少是债务、债务条款是什么，或资本结构中是否已有契约或摊还义务。资金用途披露偏增长而非防守：Aura
              称本轮将资助更智能的安全功能，伙伴和雇主福利披露也暗示商业化扩张仍是活跃投资领域。这确实降低了近期融资压力，但没有构成完整现金桥。公开来源仍未披露账上现金、烧钱速度、现金跑道、经审计收入、ARR、毛利率、CAC、回本周期、流失或按账户计的伙伴集中度。因此，财务判断是中等置信度。收入质量看起来好于单渠道消费者
              应用，因为经常性订阅由福利和经销商渠道补充；但缺少经审计披露，使本章无法承保正常化利润率、债务服务或下行情景韧性。主要尽调卡点是披露深度，而不是需求信号。
