  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Aura 的变现从经常性一体化订阅开始，而不是围绕多个内部层级搭建的免费转付费功能阶梯。公开自助结构很直接：个人、情侣、家庭和儿童计划，计划限制与家庭规模和设备数量挂钩。Aura 的保险页和定价页共同显示，年付
              / 月付标价大约为个人 $12/$15、情侣 $22/$29、家庭 $32/$50、儿童 $10/$13，同时明确年付计划有 60 天退款保证，每个计划都有 14 天试用。Family SKU
              是经济旗舰，因为它组合了最多五名成人、不限儿童、不限设备、家长控制、网络欺凌保护，以及最高 $5 million 身份盗用保险。Aura 还释放出网站结账流之外的变现细节。Spam Call & Message
              Protection 被定位为家庭内含功能或加购项，更大家庭会被推入销售辅助动作，App Store
              上部分应用内购买也显示出与网站显著不同的价格点。这意味着标价可见，但实际成交价不可见。因此，收入应建模为直接计费订阅、应用商店中介订阅和渠道驱动合同的组合，而不是一条统一消费者 ARPU 线。
