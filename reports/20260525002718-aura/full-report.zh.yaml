      - number: '1.2'
        title: 创始人、领导班底与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Aura 仍由创始人 Hari Ravichandran 领导。他此前的 Endurance
              经历，让这家消费者互联网和数字安全公司具备可信的创始人与市场契合度。当前公开高管班底比典型消费者订阅创业公司更完整：Thomas Clayton 以 COO 兼 President
              身份负责运营和商业化，Rekha Singh 作为 CTO 负责工程，Brian DeCenzo 作为 CFO 负责财务，Kristin Lewis 负责产品，Gerry Baldwin
              负责雇主福利渠道。这个配置重要，因为 Aura 正在同时推进 D2C、伙伴、雇主福利和新兴企业 / BYOD 动作。披露缺口在治理，不在管理层厚度。Aura
              官网提供高管履历，但没有当前董事会名单、委员会结构、投票控制摘要或投资人权利概览。对于一家完成多次收购、一次分拆，以及股债混合融资的公司，这一缺失的治理层是真正的尽调事项，而不是形式瑕疵。
