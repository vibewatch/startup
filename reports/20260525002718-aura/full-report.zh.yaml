  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与用户流程
        blocks:
          - type: paragraph
            body: >-
              Aura
              的公开产品面最好理解为一个以身份监控为锚的数字安全组合，而不是纯防病毒、纯家长控制或纯信用监控工具。当前计划把身份盗用监控、三大征信局信用监控、信用锁、金融交易提醒、身份盗用保险、欺诈修复、密码管理、VPN、防病毒、数据经纪商删除和家庭安全工具打包进一个订阅。家庭层是产品显著超出经典身份保护的地方：公开页面和应用商店列表描述了家长控制、儿童身份保护、网络欺凌提醒、安全游戏监控、在线平衡建议，以及与
              AI 聊天应用等新兴风险相关的提醒。独立评测总体佐证了这个组合的广度，即便它们对价值或打磨程度看法不同。评测也显示，Individual、Couple、Family 和 Kids
              计划之间的主要包装差异，不是完全不同的功能核心，而是覆盖成人和设备数量、保险金额，以及是否启用儿童专属控制。Aura 也不再只是 D2C 订阅。商业伙伴页面、MetLife 发布和 Aura Business
              BYOD 公告显示，同一个以身份为中心的平台正在被重新包装给保险公司、雇主、经销商、MSP 和员工自有设备用例。渠道灵活性说明 Aura 可能有一套可复用的监控与修复运营模型，外面套着多种商业包装，而不是单一零售
              SKU。
