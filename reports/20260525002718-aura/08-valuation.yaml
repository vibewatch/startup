company:
  name: Aura
chapter:
  number: 8
  title: Valuation
  summary: 'Recommendation: research-more. Aura’s March 2025 $1.6 billion financing, claimed 50% 2024 GAAP revenue growth, 1.6M+ customer base, and >30% 2025 partner-led revenue mix support a real operating story, but public evidence still lacks the audited denominator, cap-table terms, and fresh 2026 price discovery needed for a buy call. Around the last round the stance is fair; above it without new disclosure the stance becomes stretched.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: |-
    Aura is easier to like as a company than to underwrite as a clean investment. The positive evidence is real: the company disclosed a March 2025 Series G at a $1.6 billion valuation, said consumer demand drove roughly 50% 2024 GAAP revenue growth, says it protects more than 1.6 million customers, and now says direct partnerships plus employee benefits represented more than 30% of 2025 revenue. Those facts support a thesis that Aura is no longer just a direct-to-consumer identity-theft product; it is trying to become a broader online-safety platform with meaningful channel leverage.

    The price question is harder. Public evidence still does not disclose the debt-versus-equity split of the round, the fully diluted cap table, audited revenue, ARR, margin, or retention. Independent rankings help on product quality, but they also show that bundled identity protection is a crowded category where feature breadth alone is not scarce. That is why the call here is research-more rather than buy. Around the last disclosed $1.6 billion price, the stance is fair if diligence confirms clean terms and durable channel economics. Above that price without new proof, the valuation becomes stretched quickly.
