- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable / reference
  - Metric anchor
  - Multiple / valuation status
  - Relevance to Aura
  - Limitation
  rows:
  - - Aura March 2025 Series G
    - $140M raised at a $1.6B valuation
    - Only direct company price discovery
    - Best starting anchor for entry discipline
    - Debt mix, preferences, and 2026 refresh are undisclosed
  - - Gen Digital public consumer-cyber bundle
    - $15.03B market cap and $3.935B FY2025 revenue
    - About 3.8x market cap / revenue proxy
    - Closest public consumer-cyber bundle boundary
    - Much larger, more profitable, and fully disclosed
  - - TransUnion fraud / credit data incumbent
    - $13.62B market cap and $4.2B 2024 revenue
    - About 3.2x market cap / revenue proxy
    - Useful identity, fraud, and trust-data boundary
    - Different business mix and credit-cycle exposure
  - - Experian global disclosure reference
    - $31.82B market cap plus annual-report evidence of broad consumer-services scale
    - Boundary marker rather than a clean like-for-like multiple
    - Shows how much disclosure and platform breadth public incumbents offer
    - Diversified global bureau and data business, not a pure Aura analog
  - - Consumer-bundle price cluster
    - Identity Guard, Experian, Surfshark, and ranking pages show low-teens to mid-$20s monthly consumer bundles
    - Pricing reference, not a valuation multiple
    - Helps cap premium assumptions for a crowded category
    - Consumer pricing does not map directly into enterprise value without retention and margin data
  notes: Partial comparable set only. The retained public evidence supports boundary-setting and price discipline, not a banker-grade comp deck.
