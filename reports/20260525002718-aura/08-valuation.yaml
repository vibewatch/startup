- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Growth and scale
    - 50% 2024 GAAP revenue growth and 1.6M+ customers suggest real scale formation.
    - Growth quality is still company-claimed because Aura does not disclose audited revenue, retention, or margins.
    - Provide audited 2024-2025 revenue, retention, and gross-margin bridges.
  - - Distribution
    - More than 30% of 2025 revenue from direct partnerships and employee benefits suggests channel leverage beyond D2C.
    - Channel mix can also hide concentration risk if a few partners dominate growth.
    - Show channel-by-channel revenue, renewal rates, and CAC payback.
  - - Product quality
    - Independent rankings place Aura near the top of the category and support a strong consumer bundle.
    - Rankings also show many credible substitutes, so bundle breadth alone is not scarce.
    - Prove materially better retention, attach, or claims economics than peer bundles.
  - - Valuation anchor
    - A hard public $1.6B mark exists from March 2025.
    - The anchor is stale and does not reveal debt mix, preferences, or 2026 price discovery.
    - Disclose the full waterfall and any updated financing process.
  - - Risk
    - The breach did not hit core identity databases, which limits worst-case interpretation.
    - Trust events matter more for safety brands, so even limited exposure can raise acquisition and partner friction.
    - Share post-breach churn, claims, partner diligence, and incident-remediation data.
  notes: Both sides are evidence-backed. The anti-thesis is intentionally not a generic risk list; it is the set of facts that most directly changes valuation.
