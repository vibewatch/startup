  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Fully diluted cap table, debt-versus-equity split in the March 2025 round, liquidation preferences, option pool, and any ratchets.
    whyItMatters: These terms determine whether a fair headline valuation still produces an acceptable new-money return.
    diligencePath: Request the latest cap table, financing documents, and waterfall model from management and counsel.
    relatedQuestionRefs:
    - QV005
    - QV022
  - type: private-evidence-only
    severity: material
    topic: audited-economics
    missingEvidence: Audited 2024-2025 revenue, ARR, gross margin, retention, CAC payback, cash balance, and debt schedule.
    whyItMatters: Without an audited denominator and efficiency data, the valuation work cannot move from broad ranges to priceable underwriting.
    diligencePath: Obtain audited financial statements, KPI bridge schedules, and a channel-level cohort pack from finance.
    relatedQuestionRefs:
    - QV023
  - type: missing-source
    severity: material
    topic: live-price-discovery
    missingEvidence: A 2026 term sheet, secondary print, or banker market-check that updates the March 2025 valuation anchor.
    whyItMatters: The recommendation is explicitly price-sensitive, so stale price discovery leaves the entry decision underdetermined.
    diligencePath: Ask management and lead investors whether any live process, secondary trade, or internal valuation update exists.
    relatedQuestionRefs:
    - QV027
  - type: missing-source
    severity: material
    topic: breach-retention-impact
    missingEvidence: Cohort churn, partner diligence outcomes, claims volume, and sales-cycle effects after the March 2026 incident.
    whyItMatters: A trust event matters economically only if it changes retention, acquisition cost, partner velocity, or insurance economics.
    diligencePath: Review post-incident churn dashboards, partner renewals, and customer-support or claims-loss trend data.
    relatedQuestionRefs:
    - QV021
    - QV031
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation table coverage
    missingEvidence: More direct public or recently priced private identity-protection comps with clean disclosed revenue and market-value data.
    whyItMatters: The comparable set is intentionally partial, so missing direct private marks limit how tightly the valuation range can be narrowed.
    diligencePath: Expand comp work with banker decks, private-market databases, and any confidential process materials.
    relatedQuestionRefs:
    - QV013
    - QV017
    - QV027
    relatedTableRefs:
    - TV004
