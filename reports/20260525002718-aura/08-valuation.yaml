- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Core assumptions
  - Valuation / return logic
  - Probability signal
  - Key downside trigger
  rows:
  - - Bull
    - Partner-led growth stays durable, the breach proves economically contained, and management shows clean preference terms.
    - $2.1B-$2.6B valuation range, or roughly 1.3x-1.6x the last round before dilution.
    - Possible but diligence-dependent
    - Falls apart if channel quality or cap-table terms disappoint.
  - - Base
    - Growth normalizes, partner channels stay helpful, and no fresh 2026 price discovery emerges.
    - $1.4B-$1.9B valuation range, or roughly flat-to-modest upside versus the last round.
    - Most supportable from public evidence
    - Any premium ask above the last round requires evidence not yet public.
  - - Bear
    - Breach drag, peer pricing pressure, or concentrated channel exposure compresses growth and investor appetite.
    - $0.8B-$1.3B valuation range, consistent with flat or down-round risk.
    - Always available if diligence goes poorly
    - A weak live process or adverse post-breach cohorts would push the case here.
  notes: These ranges are scenario bands anchored on the last disclosed financing, not a pseudo-DCF. Hidden preferences could reduce investor returns materially within every case.
