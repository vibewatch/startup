- id: downside-overhang-and-final-diligence
  title: Downside overhang and final diligence
  body: |-
    The central overhang is not whether Aura has growth; it is whether investors can actually convert that growth into returns at the offered price. Missing cap-table terms can wipe out apparently fair entry math. Missing audited revenue, margin, and retention data make it impossible to know whether Aura deserves a premium software-style valuation or just a respectable private-company mark. And the March 2026 breach matters because safety companies are judged more harshly on trust than ordinary software vendors.

    That is why the final diligence list is short and unforgiving. Investors need the waterfall, the audited economics, and live 2026 price discovery before moving off research-more. They also need post-breach churn and partner-impact data, because partner-led distribution is simultaneously part of the thesis and a potential concentration risk. If management can close those gaps at or below the last round, the call can improve. If management seeks a clear premium while those gaps remain open, the conservative answer should stay no.
