- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Preference shock
    - Cap table reveals heavy senior prefs, ratchets, or a debt-heavy structure
    - Headline fairness stops mattering because new-money return math degrades
    - Pause and reprice from the waterfall, not from enterprise value alone
  - - Growth quality disappointment
    - Retention or channel cohorts fail to support durable post-2024 growth
    - Bull and base cases lose their core operating support
    - Reset to base or bear and refuse a premium entry
  - - Breach economic fallout
    - Post-incident churn, claims, or partner diligence worsens materially
    - Trust risk becomes an earnings and CAC problem rather than a narrative issue
    - Move valuation band down and require stronger terms
  - - Category pricing compression
    - Peer bundles keep competing effectively on low monthly prices and broad features
    - Scarcity premium disappears even if demand stays healthy
    - Use only conservative ranges around or below the last round
  - - No fresh price discovery
    - Management seeks a clear premium without new financial disclosure or market-check evidence
    - The valuation case turns from fair-value debate into asymmetric entry risk
    - Walk unless price or diligence access improves
  notes: These are investment triggers, not operating dashboards. Each one should force a new valuation cut.
  claimRefs:
