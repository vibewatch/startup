    {
      "id": "cost-structure-and-margin-proxies",
      "title": "Margin and cost-structure proxies",
      "body": "Aura's support model looks heavier than that of a lightweight monitoring app. Every plan includes 24/7 customer support, and Aura's fraud specialists explicitly help users work with bureaus and government institutions after incidents. That service layer is economically important because it implies meaningful labor cost even before considering the breadth of the product bundle: multi-bureau credit monitoring, fraud alerts, antivirus, VPN, password management, data-broker removal, parental controls, safe-gaming alerts, and browser-extension tooling all sit inside the same subscription. Reviews reinforce the trade-off. Security.org views the bundle as comprehensive but says the interface is not especially intuitive and the side services are not standalone leaders, which is consistent with a broad platform whose economics likely depend on convenience and cross-sell rather than best-of-breed depth in every module. Public-company filings provide only rough benchmarking, but they are still useful. Experian's FY25 annual report shows a consumer platform with more than 200 million free members and a 28.1% benchmark EBIT margin at group level, while TransUnion's 10-K spells out that consumer identity-adjacent cost of service includes data acquisition, support, maintenance, telecom, and data-center expense. Gen Digital's 10-K shows a scaled subscription model can mix direct, indirect, and freemium acquisition, but it still depends on large paid-customer bases and continued marketing. Aura likely shares the same cost buckets, yet its own gross margin, claims-loss burden, and support cost per subscriber remain undisclosed.",
