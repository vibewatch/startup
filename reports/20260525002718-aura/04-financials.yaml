    "number": 4,
    "title": "Financials",
    "summary": "Aura's public financial picture supports a recurring consumer-subscription business with meaningful partner distribution, but not a fully underwriteable model. Official sources show individual, couple, family, and kids plans, about 1.6 million customers, roughly 50% 2024 GAAP revenue growth, and a March 2025 $140 million mixed equity-and-debt round at a $1.6 billion valuation; Aura Business also says direct partnerships plus employee benefits exceeded 30% of 2025 revenue. What remains missing are audited revenue, ARR, gross margin, CAC, churn, cash, runway, and the debt split within the 2025 raise, so revenue quality looks promising but only medium-confidence from public evidence."
  },
  "sections": [
    {
      "id": "revenue-model-and-pricing-architecture",
      "title": "Revenue model and pricing architecture",
      "body": "Aura's monetization starts with a recurring all-in-one subscription, not with a free-to-paid feature ladder built around multiple internal tiers. The public self-serve structure is straightforward: individual, couple, family, and kids plans, with plan limits tied to household size and device counts. Aura's insurance page and pricing page together show annual-versus-monthly list pricing of roughly $12/$15 for individual, $22/$29 for couple, $32/$50 for family, and $10/$13 for kids, while also making clear that annual plans carry a 60-day money-back guarantee and every plan starts with a 14-day trial. The family SKU is the economic flagship because it combines up to five adults, unlimited kids, unlimited devices, parental controls, cyberbullying protection, and up to $5 million of identity-theft insurance. Aura also signals monetization nuance beyond the website checkout flow. Spam Call & Message Protection is positioned as a family inclusion or add-on, larger households are pushed into a sales-assisted motion, and the App Store surfaces materially different price points on some in-app purchases than the website does. That means list pricing is visible, but realized pricing is not. Revenue should therefore be modeled as a mix of direct billed subscriptions, app-store mediated subscriptions, and channel-driven contracts rather than as one uniform consumer ARPU line.",
