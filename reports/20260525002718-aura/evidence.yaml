evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, committee structure, investor protective provisions, and ownership percentages by major
      holder.
    whyItMatters: >-
      Control rights and board influence matter for underwriting management autonomy after the spin-off and new
      financing.
    diligencePath: Request the latest board deck, cap table, voting agreements, and investor rights summary from management.
    relatedQuestionRefs:
      - QO014
      - QO029
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: series-g-structure
    missingEvidence: >-
      Debt-versus-equity split, instrument terms, lender identity, and any warrants or liquidation preferences embedded
      in the $140M round.
    whyItMatters: Mixed rounds can look stronger than they are if a meaningful portion is structured debt or preference-heavy paper.
    diligencePath: Obtain the financing closing memo, debt term sheet, and post-money cap table for the Series G.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Absolute revenue, ARR, gross margin, retention, and cohort or claims-loss data underlying the public 2024 growth
      statement.
    whyItMatters: >-
      Growth percentages are directionally helpful but cannot support valuation or durability work without a revenue
      base and quality metrics.
    diligencePath: Ask for 2024 audited financials, 2025 YTD management accounts, and recurring-revenue cohort analysis.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: channel-scale
    missingEvidence: >-
      Named employer counts, insurer relationships, MSP customer counts, enterprise-seat counts, and channel
      concentration metrics.
    whyItMatters: >-
      Aura's go-to-market mix now spans multiple channels, but public evidence does not show which one actually drives
      durable scale or concentration risk.
    diligencePath: >-
      Request channel-level bookings, active customer counts, and top-partner concentration by revenue for 2024 and
      2025.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: public-milestones
    missingEvidence: >-
      Exact close dates and full terms for older acquisitions, the August 2024 initial close, and any undisclosed
      internal launches not carried on the public chronology.
    whyItMatters: >-
      The chapter can reconstruct the strategic arc, but exact transaction timing still matters for integration quality
      and post-spin execution pacing.
    diligencePath: Request a board-approved corporate timeline or deal list with close dates, counterparties, and integration status.
    relatedQuestionRefs:
      - QO002
      - QO019
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sizing-precision
    missingEvidence: >-
      A bottom-up split of Aura members or revenue by direct retail identity protection, family online safety,
      employer-benefits, and BYOD or enterprise-adjacent channels.
    whyItMatters: >-
      Without disclosed channel and product-mix data, public TAM-to-SAM-to-SOM math remains scenario-based rather than
      company-specific.
    diligencePath: >-
      Request management cohort data by plan, distribution channel, ARPU, and active paid members, then rebuild SAM and
      SOM from observed conversion and retention instead of syndicated TAM alone.
    relatedQuestionRefs:
      - QM021
      - QM023
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: renewal-economics
    missingEvidence: Audited churn, refund, support-contact, and cancellation rates by plan and acquisition channel.
    whyItMatters: >-
      Price sensitivity and renewal friction are visible in public packaging and review signals, but investor-grade
      judgment needs observed retention economics rather than anecdotal complaints alone.
    diligencePath: >-
      Request monthly retention and refund cohorts, segmented by annual versus monthly plans and by family versus
      individual accounts, plus the support reasons tied to cancellations.
    relatedQuestionRefs:
      - QM018
      - QM026
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: minor
    topic: trust-conversion
    missingEvidence: >-
      Independent evidence linking vendor security incidents to identity-protection conversion or renewal behavior
      across the category.
    whyItMatters: >-
      The 2026 Aura breach demonstrates trust risk, but it remains unclear how much such incidents reduce paid demand
      versus simply increasing security salience.
    diligencePath: >-
      Ask management for conversion and renewal trends before and after the 2026 breach and review any channel-partner
      commentary or customer-survey data on trust impacts.
    relatedQuestionRefs:
      - QM022
      - QM026
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: lifelock-official-pricing
    missingEvidence: >-
      A readable current LifeLock official product or pricing page that confirms live tiers, device counts, and family
      packaging.
    whyItMatters: >-
      Independent reviews are good enough for directional comparison but not ideal for locking exact current packaging
      into underwriting materials.
    diligencePath: >-
      Refetch the live Norton or LifeLock product page, or use an archived official plan page if the live route remains
      unstable.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: access-blocked
    severity: material
    topic: malwarebytes-adjacent-bundle
    missingEvidence: >-
      A readable official Malwarebytes consumer plans page that shows current pricing and whether any identity features
      are bundled.
    whyItMatters: >-
      The adjacent-bundle set matters for commoditization risk, but this run cannot responsibly score Malwarebytes
      beyond noting that it was screened.
    diligencePath: >-
      Pull an alternate official Malwarebytes plans URL or archived capture that resolves to text rather than an image
      asset.
    relatedQuestionRefs:
      - QP015
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-retention
    missingEvidence: Plan-level churn, win-loss, and family-seat utilization data for Aura versus direct and adjacent rivals.
    whyItMatters: >-
      The moat debate turns on whether breadth actually keeps households and channels from downgrading into cheaper or
      partial substitutes.
    diligencePath: >-
      Request retention by plan, primary win-loss competitors, and post-incident renewal or conversion data from
      management.
    relatedQuestionRefs:
      - QP019
      - QP020
      - QP021
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: audited-topline
    missingEvidence: Audited revenue, ARR, and revenue-recognition detail by channel.
    whyItMatters: >-
      Without audited topline and a gross-to-net bridge, valuation and growth quality cannot be independently
      underwritten.
    diligencePath: >-
      Request audited financial statements, management P&L bridge, and direct-web versus app-store versus partner
      billings.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, board budget, and downside runway.
    whyItMatters: >-
      Capital adequacy cannot be tested from the 2025 raise alone because fresh capital does not reveal current
      liquidity or burn.
    diligencePath: Request current cash bridge, monthly cash burn by function, and base/downside runway scenarios.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Exact debt amount, lender, interest rate, maturity, covenants, and security package within the 2025 mixed round.
    whyItMatters: Debt service and covenant pressure can materially change downside risk even if total fundraising appears ample.
    diligencePath: >-
      Request executed debt documents and a capitalization table reconciling the equity and debt components of the March
      2025 round.
    relatedQuestionRefs:
      - QI027
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, churn, NRR, and support cost per subscriber or per incident.
    whyItMatters: >-
      These metrics determine whether Aura's bundle breadth and support burden create healthy recurring economics or
      mask a structurally expensive service model.
    diligencePath: Request unit-economics dashboards by plan and channel, including renewal curves and support-utilization metrics.
    relatedQuestionRefs:
      - QI021
      - QI023
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: >-
      Exact revenue split across direct web, Apple, Google, employee benefits, and partner channels, plus partner
      concentration.
    whyItMatters: Channel mix determines realized net pricing, app-store fee load, partner dependence, and concentration risk.
    diligencePath: Request billed revenue by route to market, top-partner concentration, contract duration, and channel gross margin.
    relatedQuestionRefs:
      - QI027
    relatedTableRefs:
      - TI001
      - TI005
  - type: missing-source
    severity: material
    topic: ai-governance
    missingEvidence: >-
      Public documentation covering Aura Intelligence model families, training-data provenance, benchmark design, and
      false-positive or false-negative rates.
    whyItMatters: >-
      Without model-governance evidence, investors cannot tell whether AI-branded features are a durable moat, a lightly
      tuned rules engine, or a high-noise UX layer.
    diligencePath: >-
      Request product-security and ML-governance documentation, including evaluation dashboards and post-incident tuning
      procedures for family-safety and spam-detection models.
    relatedQuestionRefs:
      - QE012
    relatedTableRefs:
      - TE003
      - TE004
  - type: access-blocked
    severity: material
    topic: technical-docs
    missingEvidence: >-
      Readable public implementation or setup documentation for password-manager deployment, admin configuration, and
      feature-level operating details.
    whyItMatters: >-
      Thin or inaccessible technical docs increase deployment risk and make it harder to validate how much of the
      product depends on manual support versus robust self-serve implementation.
    diligencePath: >-
      Obtain live access to the support center, admin docs, and any enterprise implementation guides; test a real
      browser-extension and child-device setup flow in diligence.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: compliance-controls
    missingEvidence: >-
      Current SOC 2 report, ISO certificate scope, penetration-test summary, and any trust-center artifact covering
      Aura's production environment.
    whyItMatters: >-
      Security and privacy claims are central to the product narrative, so missing procurement-grade evidence weakens
      underwriting confidence even if consumer marketing copy is strong.
    diligencePath: >-
      Request the latest trust package under NDA and map it against the claims on privacy, credit monitoring, child
      safety, and incident-response controls.
    relatedQuestionRefs:
      - QE018
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: reliability-metrics
    missingEvidence: >-
      Public SLA terms, incident-history metrics, alert-latency distributions, resolution-time data, and
