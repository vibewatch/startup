      - number: '7.3'
        title: Partner, channel, and model risks
        blocks:
          - type: paragraph
            body: >-
              Aura's next major risk cluster is dependence on partner channels and the still-young BYOD and enterprise
              narrative. Public evidence now clearly shows that Aura is no longer just a direct retail subscription:
              employee benefits distributed through MetLife and direct partnerships were already more than 30 percent of
              revenue in 2025, and management is pushing further into MSP-led BYOD security. That expansion is
              strategically attractive, but it shifts the risk profile. MetLife adds distribution leverage while also
              inserting multi-party accountability, brand, and service-model complexity. The MSP motion attacks a real
              pain point, yet the public proof set is still mostly launch collateral and channel coverage rather than
              durable customer outcomes. Financially, the same pattern repeats: Aura has real scale, 1.6 million-plus
              customers, and fresh capital from a 140 million dollar 2025 round, but public disclosures still stop far
              short of margin, debt, and concentration visibility. Independent reviews reinforce that the bundle often
              wins on breadth and convenience rather than category-leading depth, so premium pricing has to be defended
              continuously. The thesis does not break because Aura has channels; it breaks if channel dependence rises
              faster than disclosure, renewal durability, and operating proof.
