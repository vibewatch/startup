      - number: '8.3'
        title: Scenario ranges and exit paths
        blocks:
          - type: paragraph
            body: >-
              The scenario work should be read as price discipline, not as a DCF. In the bull case, Aura proves that
              2024 growth was not a one-off, that partner-led revenue becomes a structurally cheaper distribution
              engine, and that the 2026 breach has limited economic fallout. In that world, a strategic buyer or
              late-stage investor could justify a step-up from the last round. In the base case, Aura is good enough to
              hold its last price or move slightly above it, but not enough to produce standout new-money returns once
              dilution and preferences are considered. In the bear case, competition, breach drag, or channel
              concentration push the company toward a flat or down round.


              Exit logic also favors strategic relevance over IPO-style precision. Public incumbents such as Gen
              Digital, TransUnion, and Experian are much larger and more diversified, so they serve more as boundary
              markers than as direct trading comps. That makes a strategic outcome more plausible than a clean
              stand-alone public-markets story from current evidence. The practical implication is simple: investors
              should underwrite to a range around the last round and ask what explicit proof would move the band up or
              down.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV021
              - CV024
              - CV026
              - CV033
              - CV035
              - CV038
              - CV042
              - CV043
              - CV045
              - CV046
              - CV047
          - type: table
