      - number: '3.2'
        title: Capability and Pricing Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Aura remains competitively strong when the buyer wants one subscription that covers a whole household and
              mixes identity recovery with broader digital-safety features. The official pages and independent reviews
              line up around the same pattern: Aura is not the cheapest, but it is unusually broad at list price,
              especially on the Family tier. Identity Guard undercuts Aura on entry price and keeps solid identity
              depth, yet it does not show the same cybersecurity and privacy bundle breadth. Experian remains a credible
              direct rival for households that prioritize credit-file trust or want a free starting point, but its paid
              tiers run above Aura and review coverage treats it as narrower and less app-friendly. Surfshark One+ is
              the clearest adjacent overlap because it can replace VPN, antivirus, leak alerts, and broker removal with
              unlimited-device economics; the tradeoff is that it does not replicate a dedicated identity-remediation
              workflow or equivalent credit stack.
