      - number: '4.2'
        title: Public traction and distribution proxies
        blocks:
          - type: paragraph
            body: >-
              Aura does not publish audited revenue or ARR, so public traction has to be read through scale proxies and
              channel disclosures. The most important company-scale proxy is the about page's statement that Aura
              protects more than 1.6 million customers. The strongest topline signal is the March 2025 funding
              announcement, which said soaring consumer demand drove about 50% GAAP revenue growth year over year in
              2024. Distribution breadth matters almost as much as direct subscriber count. Aura's reseller page says
              the network reaches 20 million people through thousands of partnerships, while Aura Business later said
              direct partnerships plus employee benefits represented more than 30% of 2025 revenue. MetLife's
              benefit-channel release and Aura's own historical timeline corroborate that employer benefits are not a
              pilot concept but an established distribution lane. User-satisfaction proxies also support real product
              adoption even though they do not prove profitability: the App Store listing showed a 4.7 rating from
              97,000 reviews at fetch time, and the Chrome Web Store listing shows Aura continues to maintain
              subscriber-only browser tooling. The net read is constructive. Aura appears to have both consumer pull and
              non-self-serve channel reach, but public evidence still stops short of disclosing billed volume, channel
              mix, renewal rates, or realized net revenue by route to market.
