      - number: '2.2'
        title: Buyer, User, Payer, and Channel Segmentation
        blocks:
          - type: paragraph
            body: >-
              The direct buyer in Aura’s historical core is a household decision-maker, but the user and payer separate
              as the product broadens. For individual plans, the adult user is usually also the payer. In couple and
              family plans, the economic buyer is often one household financial administrator while the users include
              spouses, children, and sometimes older relatives whose exposure to fraud, scams, or online harm creates
              urgency. Public review sources consistently frame family breadth, credit monitoring, insurance, device
              security, and parental controls as key buying criteria, reinforcing that the product competes on
              convenience and breadth rather than on one monitoring feature alone. Two adjacent channels matter for SAM
              expansion. The MetLife partnership shows an employer-benefits motion where HR or benefits leaders can pay
              while employees and families are the end users. Aura Business for MSPs points to a separate BYOD and
              identity-centric access-security motion where the buyer becomes an MSP, SMB operator, or IT administrator,
              but the user is still the employee on a personal device. Those channels are important, but current public
              evidence supports treating them as adjacent expansion motions, not as proof that all enterprise security
              spend belongs in Aura’s present consumer-market TAM.
