  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Heatmap of Aura's highest-priority risks across likelihood, impact, mitigation maturity, and residual severity.
      Trust damage from a security incident sits above pure compliance risk because it transmits directly into renewals,
      partner sales, and pricing power.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Breach / brand trust erosion
          values:
            - Medium-high
            - High
            - Medium
