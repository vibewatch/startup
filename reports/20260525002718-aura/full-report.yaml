  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Public customer touchpoints run from direct-web discovery and free-trial signup through support-led incident
      response and eventual channel-based expansion.
    data:
      items:
        - actor: Prospective direct consumer
          touchpoints:
            - Aura About / Pricing pages
            - Security.org or U.S. News review
            - App Store screenshots and ratings
          emotion: Wants one subscription that reduces fraud anxiety
          painpoint: Identity-theft protection is crowded and hard to compare
          opportunity: Broad bundle and visible ratings lower initial research friction
          label: Discovery
        - actor: New subscriber or parent admin
          touchpoints:
            - 14-day trial checkout
            - Account setup with SSN and personal details
            - App install plus optional device or bank connections
          emotion: Cautiously optimistic but privacy-sensitive
          painpoint: Onboarding asks for a lot of personal information and setup time
          opportunity: Fast initial setup plus guided onboarding can convert high-intent households
          label: Enrollment / onboarding
        - actor: Active household user
          touchpoints:
            - Fraud alerts and credit controls
            - Password manager / VPN / data-removal tools
            - Customer-service and remediation channels
          emotion: Values convenience when risks appear
          painpoint: Bundled side tools may be good enough rather than best-of-breed
          opportunity: Fast alerts and white-glove support can deepen perceived value
          label: Active protection
        - actor: Family plan parent
          touchpoints:
            - Parental controls
            - Online wellbeing reports
            - Safe gaming and alert sharing
          emotion: Needs control without constant manual oversight
          painpoint: Family features still rely on trust in monitoring accuracy and sensible defaults
          opportunity: Household-level utility can support multi-seat expansion and reduce churn
          label: Family governance
        - actor: Employee-benefits or partner-channel enrollee
          touchpoints:
            - MetLife employer benefits
            - Partner or reseller offer
            - Property-management or insurer distribution
          emotion: Discovers Aura through an existing trusted relationship
          painpoint: Benefits or reseller terms can differ from direct web expectations
          opportunity: Channel trust can broaden reach faster than direct consumer marketing alone
          label: Channel acquisition
        - actor: Renewing or expanding customer
          touchpoints:
            - Automatic renewal notice
            - Support interactions after incidents
            - Plan change, cancellation, or add-on decisions
          emotion: Evaluates whether the bundle still justifies price
          painpoint: Auto-renewal, refund limits, and breach-related trust questions can increase scrutiny
          opportunity: Good support and broader family/business use cases can create expansion loops
          label: Renewal / expansion
