  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from genuine operating proof through disclosure and trust overhangs to a research-more
      call.
    data:
      nodes:
        - id: n1
          label: Operating proof
          detail: 50% 2024 growth, 1.6M+ customers, and a real partner mix support quality.
        - id: n2
          label: Channel proof
          detail: MetLife and direct partnerships expand beyond pure D2C acquisition.
        - id: n3
          label: Category demand
          detail: Identity-theft incidence and market-growth studies support demand.
        - id: n4
          label: Disclosure gap
          detail: No audited denominator, cap table, or live 2026 price discovery.
        - id: n5
          label: Trust overhang
          detail: The March 2026 breach can still affect CAC, churn, and partner diligence.
        - id: n6
          label: Price discipline
          detail: Fair near the last round, stretched above it without new proof.
        - id: n7
          label: research-more
          detail: Proceed only with hard diligence leverage and entry discipline.
      edges:
        - from: n1
          to: n6
          label: Supports holding value
        - from: n2
          to: n6
          label: Improves upside if durable
        - from: n3
          to: n6
          label: Category remains healthy
        - from: n4
          to: n6
          label: Blocks precision
        - from: n5
          to: n6
          label: Raises downside risk
        - from: n6
          to: n7
          label: Stay conditional
    approximationNotes: This is a qualitative decision chain, not a weighted scoring model.
    claimRefs:
      - CV040
      - CV041
      - CV043
      - CV044
      - CV048
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Illustrative valuation sensitivity to evidence and term quality rather than a hidden-revenue DCF.
    data:
      items:
        - label: Breach + weak terms
          value: 0.8
          note: Down-round outcome if trust impact and preferences both go poorly.
        - label: Weak evidence / flat round
          value: 1.2
          note: Little proof beyond the stale anchor.
        - label: Last disclosed anchor
          value: 1.6
          note: March 2025 public valuation reference.
        - label: Clean terms + stable channels
          value: 2
          note: Moderate step-up only if diligence closes core gaps.
        - label: Strategic-channel bull
          value: 2.4
          note: Needs durable partner leverage and contained breach effects.
    approximationNotes: Values are USD billions and reflect scenario discipline, not a marketed financing range.
    claimRefs:
      - CV036
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Low/base/high bands for bear, base, and bull cases with the March 2025 round shown as the public reference point.
    data:
      items:
        - label: Bear case
          low: 800
          base: 1050
          high: 1300
          unit: USD M
          note: Competition, breach drag, or weak terms drive flat / down-round risk.
        - label: Base case
          low: 1400
          base: 1650
          high: 1900
          unit: USD M
          note: Good company, incomplete proof, modest upside before dilution.
        - label: Bull case
          low: 2100
          base: 2350
          high: 2600
          unit: USD M
          note: Requires durable partner economics, clean terms, and limited breach fallout.
        - label: March 2025 public anchor
          low: 1600
          base: 1600
          high: 1600
          unit: USD M
          note: Last disclosed Aura valuation.
    approximationNotes: >-
      Real investor returns can land well below enterprise-value outcomes if hidden preferences or dilution are
      material.
    claimRefs:
      - CV001
      - CV036
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC-ready scoring of the dimensions that matter most for Aura at current evidence quality.
    data:
      items:
        - label: Category demand
          score: 8
          note: Fraud incidence and market studies support demand.
        - label: Growth proof
          score: 7
          note: Public growth claims are strong but still mostly company-led.
        - label: Channel leverage
          score: 7
          note: MetLife and partner mix are real positives.
        - label: Product quality
          score: 7
          note: Independent rankings are supportive.
        - label: Disclosure quality
          score: 3
          note: Audited economics and cap-table terms are still missing.
        - label: Trust risk
          score: 4
          note: The breach is not catastrophic but still matters for a safety brand.
        - label: Valuation support
          score: 5
          note: The last round looks defensible, not obviously cheap.
        - label: Actionability
          score: 4
          note: Without current price discovery and a data room, the opportunity is not ready for buy.
    approximationNotes: Scores are ordinal underwriting judgments from the retained evidence set, not a benchmark index.
    claimRefs:
      - CV020
      - CV035
      - CV040
      - CV043
      - CV048
