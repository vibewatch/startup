            claimRefs:
              - CV033
              - CV035
              - CV042
              - CV043
              - CV045
              - CV046
              - CV050
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV001
              - CV036
              - CV043
              - CV044
              - CV045
              - CV046
      - number: '8.4'
        title: Downside overhang and final diligence
        blocks:
          - type: paragraph
            body: >-
              The central overhang is not whether Aura has growth; it is whether investors can actually convert that
              growth into returns at the offered price. Missing cap-table terms can wipe out apparently fair entry math.
              Missing audited revenue, margin, and retention data make it impossible to know whether Aura deserves a
              premium software-style valuation or just a respectable private-company mark. And the March 2026 breach
              matters because safety companies are judged more harshly on trust than ordinary software vendors.


              That is why the final diligence list is short and unforgiving. Investors need the waterfall, the audited
              economics, and live 2026 price discovery before moving off research-more. They also need post-breach churn
              and partner-impact data, because partner-led distribution is simultaneously part of the thesis and a
              potential concentration risk. If management can close those gaps at or below the last round, the call can
              improve. If management seeks a clear premium while those gaps remain open, the conservative answer should
              stay no.
            claimRefs:
              - CV002
              - CV033
              - CV034
              - CV035
              - CV037
              - CV038
              - CV044
              - CV046
              - CV048
              - CV049
              - CV050
          - type: table
            tableRef: TV005
            claimRefs:
              - CV035
              - CV037
              - CV041
              - CV044
              - CV046
              - CV050
          - type: table
            tableRef: TV006
            claimRefs:
              - CV037
              - CV038
              - CV045
              - CV048
              - CV049
              - CV050
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fair only near the last round and only with clean terms
            body: >-
              Aura looks investable only if diligence can confirm audited economics and a simple waterfall at or below
              the March 2025 anchor.
            calloutType: recommendation
            claimRefs:
              - CV043
              - CV044
              - CV048
          - type: callout
            title: The hidden preference stack is the most dangerous missing variable
            body: >-
              A fair-looking enterprise value can still produce weak new-money returns once debt, preferences, and
              dilution are modeled.
            calloutType: risk
            claimRefs:
              - CV002
              - CV037
              - CV049
          - type: callout
            title: The base case assumes the breach is economically containable
            body: >-
              If post-incident churn, partner diligence, or claims costs worsen materially, the valuation range should
              move toward the bear case quickly.
            calloutType: assumption
            claimRefs:
              - CV033
              - CV035
              - CV046
