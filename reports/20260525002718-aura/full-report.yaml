  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and contracting risks
        blocks:
          - type: paragraph
            body: >-
              Aura's highest legal and regulatory risk is not a disclosed lawsuit; it is the combination of broad
              sensitive-data handling, consumer-reporting adjacency, and consumer contracts that place much of the
              downside on trust and compliance discipline. The privacy policy makes clear that Aura spans identity
              protection, antivirus, VPN, parental controls, and business programs under one data-governance umbrella,
              while the FCRA page confirms the company operates close enough to consumer-reporting workflows to educate
              users on file access, disputes, and privacy rights. Contract risk is also material. The December 2025
              terms lock users into automatic renewal and individual arbitration, while FAQ and review evidence show
              that cancellation, upgrades, refunds, and family-plan administration are recurring practical friction
              points. These are manageable risks for a commodity software vendor; they are more consequential for a
              brand that sells peace of mind and frictionless protection. Mitigation exists in the form of published
              policies and support infrastructure, but residual exposure stays medium-high until diligence confirms
              state-level subscription compliance, post-breach regulator contact, and channel-specific contract terms.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
