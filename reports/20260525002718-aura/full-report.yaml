  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product bundle and user workflows
        blocks:
          - type: paragraph
            body: >-
              Aura's public product surface is best understood as a digital-safety bundle anchored on identity
              monitoring rather than as a pure antivirus, pure parental-controls, or pure credit-monitoring tool. The
              current plans package identity theft monitoring, three-bureau credit monitoring, credit lock, financial
              transaction alerts, identity theft insurance, fraud remediation, password management, VPN, antivirus,
              data-broker removal, and family-safety tooling into one subscription. The family layer is where the
              product meaningfully expands beyond classic identity protection: public pages and app-store listings
              describe parental controls, child identity protection, cyberbullying alerts, safe-gaming monitoring,
              online-balance suggestions, and alerts tied to emerging risks such as AI chat apps. Independent reviewers
              broadly corroborate the breadth of this bundle even when they disagree on value or polish. They also show
              that the major packaging differences across Individual, Couple, Family, and Kids plans are not a totally
              different feature core but rather the number of adults and devices covered, the amount of insurance, and
              whether child-specific controls are enabled. Aura is also no longer only a direct-to-consumer
              subscription. The business-partners page, MetLife launch, and Aura Business BYOD announcement show the
              same identity-centric platform being repackaged for insurers, employers, resellers, MSPs, and
              employee-owned-device use cases. That channel flexibility suggests a reusable monitoring-and-remediation
              operating model with multiple commercial wrappers rather than a single retail SKU.
