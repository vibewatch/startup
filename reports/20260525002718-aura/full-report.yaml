            - High
            - Low-medium
            - Medium-high
        - label: Financial opacity and model risk
          values:
            - High
            - High
            - Low
            - High
    approximationNotes: >-
      Likelihood and impact are qualitative synthesis judgments based on the retained public record rather than a
      disclosed company scoring system.
