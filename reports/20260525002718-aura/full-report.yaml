      - number: '5.2'
        title: Operating model, deployment, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Public evidence is good enough to map Aura's operating-model layers but not to reverse-engineer a hidden
              backend stack. The visible delivery layer is a web subscription flow plus iOS, Android, and Chrome
              surfaces. The Chrome extension emphasizes password capture, password-health checking, tracker blocking,
              and email aliases; the mobile apps expose alerting, credit controls, privacy features, and family
              monitoring; and the Android listing is unusually specific that child-safety controls use a local VPN and
              Android Accessibility Service to apply filtering and detect contexts where typing occurs. Reviewers say
              setup is intentionally data-heavy because Aura needs identity attributes and, for some
              financial-monitoring features, linked accounts; SafeHome specifically identifies Plaid as the connector
              used for bank-account linking. That implies the practical architecture is a bundle of client apps,
              monitoring and alerting services, third-party credit and financial data feeds, data-removal workflows, and
              human remediation operations. Aura Business extends that same operating model into identity-centric BYOD
              security by focusing on the employee behind the device rather than trying to replace classic MDM or
              endpoint security. The missing layer is the deep backend. None of the cited official product pages
              disclose the cloud provider, internal data pipelines, detailed service topology, or the model architecture
              behind Aura Intelligence. For diligence, the safe interpretation is to describe the public operating layer
              and avoid inventing implementation specifics that Aura has not published.
