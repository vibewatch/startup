  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
      - Recommendation impact
    rows:
      - - Cap table and waterfall
        - Fully diluted ownership, debt-versus-equity split, liquidation preferences, option pool, and ratchets
        - Directly determines investor outcomes in every scenario
        - Finance + counsel to provide model and governing docs
        - Biggest upgrade or kill factor
      - - Audited economics
        - Audited revenue, ARR, gross margin, cash, debt schedule, and channel mix
        - Moves the work from range-setting to actual underwriting
        - CFO data room pack
        - Required before any move to buy
      - - Retention and cohort quality
        - GRR, NRR, channel retention, claims-loss ratio, and CAC payback
        - Separates durable distribution leverage from one good growth year
        - FP&A and growth leadership review
        - Could support a moderate step-up if strong
      - - Post-breach operating impact
        - Churn, partner diligence outcomes, claims volume, and remediation costs after March 2026
        - Shows whether trust damage is economically contained
        - Security + customer-success + partner ops review
        - A weak answer pushes the case toward bear
      - - Live price discovery
        - Any 2026 term sheet, banker range, secondary trade, or board valuation update
        - A price-sensitive recommendation needs a current entry reference
        - CEO / CFO financing discussion
        - Determines whether the opportunity is actionable now
    notes: These asks are ranked by decision impact. Without the first two, the chapter should stay at research-more.
