  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Transmission map showing how security, billing, and service risks cascade into trust, renewals, revenue quality,
      and valuation. The central node is confidence in Aura as a protection vendor, not any single feature claim.
    data:
      nodes:
        - id: n1
          label: Phone-phishing breach / weak disclosure
          detail: Any repeat trust event immediately tests the brand promise.
        - id: n2
          label: Customer and partner trust
          detail: Confidence that Aura can protect others while protecting itself.
        - id: n3
          label: Support load and alert quality
          detail: Whether broad product scope becomes operational friction.
        - id: n4
          label: Renewals and conversion
          detail: Retention, upsell, and willingness to pay premium pricing.
        - id: n5
          label: Channel leverage
          detail: MetLife, direct partnerships, and MSP traction.
        - id: n6
          label: Revenue quality
          detail: Durability of subscription and partner-driven revenue.
        - id: n7
          label: Valuation support
          detail: Ability to defend strategic premium despite limited disclosure.
      edges:
        - from: n1
          to: n2
          label: incident confidence falls
        - from: n2
          to: n4
          label: trust shapes renewal and conversion
        - from: n3
          to: n2
          label: service quality reinforces trust
        - from: n3
          to: n4
          label: bad support weakens retention
        - from: n4
          to: n6
          label: commercial durability drives quality
        - from: n5
          to: n6
          label: channels diversify or concentrate revenue
        - from: n6
          to: n7
          label: better revenue supports premium value
        - from: n2
          to: n5
          label: partners sell trust as much as features
        - from: n1
          to: n7
          label: brand damage compresses strategic premium
    approximationNotes: This causal map is a synthesis of public evidence, not a company-disclosed operating model.
    claimRefs:
      - CR010
      - CR016
      - CR023
      - CR024
      - CR035
      - CR041
      - CR050
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Dependency map of the external nodes that matter most to Aura's risk profile. MetLife, partner channels,
      financial-account connectivity, and support or insurance workflows all sit between product claims and customer
      outcomes.
    data:
      nodes:
        - id: d1
          label: Aura core platform
          detail: Identity, credit, privacy, family, and support workflows.
        - id: d2
          label: MetLife benefits channel
          detail: Exclusive employer-distribution motion.
        - id: d3
          label: Direct partners and resellers
          detail: Insurers, credit unions, property managers, and others.
        - id: d4
          label: MSPs / BYOD channel
          detail: Newer identity-centric enterprise adjacency.
        - id: d5
          label: Plaid / linked-account ecosystem
          detail: Financial monitoring and alert completeness.
        - id: d6
          label: Assurant / insurance stack
          detail: Coverage promise and reimbursement backstop.
        - id: d7
          label: Bureaus / government institutions
          detail: Fraud resolution and credit-rights workflows.
      edges:
