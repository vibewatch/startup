            body: >-
              The 2026 breach did not, by Aura's account, hit the core monitoring database, but it still damaged trust
              in a safety brand. At the same time, Aura's AI and backend implementation details remain largely
              undisclosed, limiting confidence in a defensible technical moat beyond workflow packaging.
