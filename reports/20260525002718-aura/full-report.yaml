      - number: '8.2'
        title: Financing context and comparable lenses
        blocks:
          - type: paragraph
            body: >-
              The best direct valuation anchor remains Aura’s own March 2025 financing. That anchor matters because it
              is the only hard public price discovery for the company, but it is stale and incomplete. It predates the
              March 2026 breach, does not disclose the debt mix or liquidation stack, and still leaves investors without
              an audited revenue denominator. So the right move is not to pretend precision; it is to triangulate with
              public comparables and ask how much confidence those comparables really buy.


              That triangulation is directionally helpful but not decisive. Gen Digital and TransUnion are useful
              because they provide disclosed revenue bases and market caps, producing rough public equity-to-revenue
              lenses in the low-to-mid 3x range. Experian is useful as a disclosure and scale reference, not as a clean
              pure-play multiple. Those incumbents are much larger, diversified, and public, which is exactly the point:
              Aura is asking investors to price a private bundle and channel platform without the denominator those
              public peers supply automatically. The comp set therefore supports discipline, not a precise target
              multiple.
            claimRefs:
              - CV001
              - CV002
              - CV021
              - CV022
