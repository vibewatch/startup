      - number: '1.2'
        title: Founder, Leadership Bench, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              Aura remains founder-led under Hari Ravichandran, whose prior Endurance background gives credible
              founder-market fit for a consumer internet and digital-security company. The current public executive
              bench is broader than a typical consumer subscription startup: Thomas Clayton runs operations and
              go-to-market as COO and President, Rekha Singh leads engineering as CTO, Brian DeCenzo leads finance as
              CFO, Kristin Lewis leads product, and Gerry Baldwin owns the employer-benefits channel. That spread
              matters because Aura is now simultaneously operating direct-to-consumer, partner, employer-benefits, and
              emerging enterprise/BYOD motions. The disclosure gap is governance, not management depth. Aura's public
              site provides executive biographies but no current board roster, committee structure, voting-control
              summary, or investor-rights overview. For a business that has completed multiple acquisitions, a spin-off,
              and a mixed equity-and-debt round, that missing governance layer is a real diligence item rather than a
              cosmetic omission.
