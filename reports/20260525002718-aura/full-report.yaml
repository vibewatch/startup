  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Logic
        blocks:
          - type: paragraph
            body: >-
              Aura should be sized first inside consumer identity theft and fraud protection subscriptions, then
              expanded carefully into adjacent digital safety layers rather than into all consumer cybersecurity. The
              core included spend is monitoring and remediation around identity, credit, fraud, account compromise,
              recovery support, and insurance-backed assistance. Aura’s own product pages broaden that core with data
              broker removal, antivirus, VPN, safe browsing, spam blocking, parental controls, child identity
              protection, and family coverage, which means the practical market boundary is consumer digital protection
              anchored by identity risk, not a narrow one-feature credit alert utility. Public syndicated estimates
              confirm the category is meaningful, but they are definition-sensitive. P&S sizes the U.S. market at USD
              5.2 billion in 2024 and USD 5.5 billion in 2025, Mordor sizes the global market at USD 4.61 billion in
              2025 and USD 5.10 billion in 2026, while Fortune publishes a much broader USD 17.04 billion global 2025
              baseline. The right diligence stance is therefore a range: use the tighter identity-protection services
              estimates as the core market, and treat broader family safety, employer, and BYOD adjacencies as expansion
              layers rather than automatically including them in one inflated TAM.
