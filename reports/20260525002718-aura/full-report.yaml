          - type: callout
            title: Durability is materially less visible than demand
            body: >-
              Aura discloses compelling reach and support claims, but public sources still do not show paid subscriber
              count, churn, NRR, or partner concentration. The legal terms and breach-related trust shock make that gap
              more important, not less.
