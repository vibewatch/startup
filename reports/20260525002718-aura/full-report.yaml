      - number: '4.4'
        title: Capital adequacy, revenue-quality verdict, and blockers
        blocks:
          - type: paragraph
            body: >-
              Aura's capital story improved materially in March 2025, but it is still only partially visible. The
              company said it raised $140 million in a mix of equity and debt at a $1.6 billion valuation, and Tracxn
              separately records a same-day undisclosed conventional debt round alongside the Series G. That combination
              matters because it means the company did more than simply issue fresh equity, yet the public record does
              not say how much of the $140 million was debt, what the debt terms were, or whether any covenants or
              amortization obligations now sit in the capital structure. The use of funds disclosure was growth-oriented
              rather than defensive: Aura said the round would fund more intelligent safety features, while the partner
              and employer-benefits disclosures imply that go-to-market expansion remains an active investment area.
              This does reduce near-term financing pressure, but it does not create a full cash bridge. Public sources
              still do not disclose cash on hand, burn, runway, audited revenue, ARR, gross margin, CAC, payback, churn,
              or partner concentration by account. The financial verdict is therefore medium-confidence. Revenue quality
              looks better than a single-channel consumer app because recurring subscriptions are complemented by
              benefits and reseller channels, but the absence of audited disclosure leaves the chapter unable to
              underwrite normalized margin, debt service, or downside resilience. The primary diligence blockers are
              disclosure depth, not demand signals.
