        - from: d5
          to: d1
          label: account connectivity
        - from: d6
          to: d1
          label: insurance promise
        - from: d7
          to: d1
          label: resolution workflow
        - from: d1
          to: d2
          label: brand and product dependence
        - from: d1
          to: d4
          label: commercial proof required
    approximationNotes: >-
      The dependency map mixes contractual, operational, and ecosystem dependencies because Aura's risk transmission
      does not sit in a single infrastructure vendor.
