          - type: callout
            title: Aura now looks as much like a channel business as a subscription app
            body: >-
              The >30% 2025 revenue disclosure for direct partnerships plus employee benefits means customer analysis
              has to track intermediaries like MetLife and resellers alongside household app adoption.
