            body: >-
              Durability is the least disclosed part of Aura's customer story. The company publishes generous entry
              mechanics for annual plans — a 14-day free trial and 60-day money-back guarantee — and the
              customer-service page heavily emphasizes 24/7 support plus white-glove remediation as reasons users stay.
              Those are constructive retention levers, and independent reviewers generally agree that support and
              fraud-resolution breadth are meaningful strengths. But the contract layer is less forgiving than the
              homepage pitch suggests. Aura's terms say subscriptions auto-renew unless cancelled at least one day
              before the next billing cycle, allow Aura to change fees with 30 days' notice, and state that many
              business, benefits, and reseller enrollments receive no refunds. Third-party reviewers also call out
              higher-than-average pricing, inconsistent pricing across platforms, slow bug fixes, and uneven
              data-removal satisfaction. The trust picture worsened after the March 2026 breach, which independent
              coverage argued could weaken confidence in a brand built on scam protection. Most importantly, no reviewed
              public source disclosed paid subscriber count, churn, GRR, NRR, contract length, or renewal cohorts.
              Public sentiment and support proof exist; hard durability metrics do not.
