  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Positioning
        blocks:
          - type: paragraph
            body: >-
              Aura sits in the center of a crowded but still segmented market. The direct comparison set is not every
              consumer-security app; it is the smaller group of vendors that pair identity monitoring with some
              combination of credit visibility, insurance-backed recovery, fraud specialists, and family coverage. On
              that basis, LifeLock, Identity Guard, and Experian IdentityWorks are the clearest direct peers. Adjacent
              pressure comes from privacy or security bundles such as Surfshark One+ and the NordProtect-style set that
              review sites now place in Aura-alternatives lists after the March 2026 incident. The status quo also
              matters because many households can patch together credit freezes, bank alerts, password tools, or a VPN
              without buying a dedicated suite. Aura’s relative advantage is breadth with simple packaging: its current
              bundle stretches from identity monitoring and credit lock to device security, data removal, and child
              safety, while most rivals win on a narrower axis such as insurance branding, price, or credit pedigree.
