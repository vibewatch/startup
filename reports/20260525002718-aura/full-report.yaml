      - number: '2.3'
        title: Demand Drivers and Adoption Momentum
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by real loss events rather than abstract fear. The FTC says Consumer Sentinel has
              collected tens of millions of reports and received more than 5.7 million reports in 2021, while the live
              Explore Data portal continues to frame fraud and identity theft around millions of consumer reports.
              Security.org’s 2026 identity-theft statistics summarize that someone becomes a victim roughly every 4.9
              seconds and that the FTC received more than 6.4 million identity theft and fraud reports over the year.
              FBI IC3 data show online-crime complaints and losses still climbing, from 859,532 complaints and USD 16.6
              billion in losses in 2024 to 1,008,597 complaints and USD 20.877 billion in losses in 2025.
              Identity-specific counts remain material, with 31,675 identity-theft complaints and 67,456
              personal-data-breach complaints in the 2025 IC3 report. Breach exposure is also persistent: the ITRC
              logged 3,322 compromises in 2025, up 5% year over year and 79% over five years, and found that 80% of
              surveyed consumers received a breach notice in the prior 12 months. That pain signal broadens beyond fraud
              remediation alone. Aura’s family product, employer-benefits announcement with MetLife, and review coverage
              all suggest that child safety, scam prevention, privacy cleanup, and device-security convenience are
              pulling the category toward a wider consumer digital-protection bundle.
