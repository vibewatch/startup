subtitle: Real consumer traction and channel breadth, but still too little audited disclosure for a buy call
coverageNotes: >-
  Aura is a private company. Public evidence supports the March 2025 $140M Series G at a $1.6B
  valuation, roughly 50% 2024 GAAP revenue growth, 1.6M+ customers protected, and a growing
  partner-led distribution model, but not audited revenue, ARR, gross margin, churn, cap-table
  terms, or debt split. The March 2026 limited-contact-data breach adds trust and diligence
  overhang without proving core-database compromise.
