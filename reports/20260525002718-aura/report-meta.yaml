companyProfile:
  summary: >-
    Aura was founded in 2017 as iSubscribed and used acquisitions including Identity Guard,
    Pango, and Circle to expand from identity protection into a broader family digital safety
    platform. Today it sells an AI-positioned bundle spanning identity theft protection,
    credit monitoring, fraud alerts, data removal, VPN, antivirus, password management,
    and parental / online wellbeing tools through direct subscriptions plus employer,
    reseller, and MSP channels.
  founders:
    - name: Hari Ravichandran
      role: Founder and CEO
      background: >-
        Previously founded Endurance International Group and is the public face of Aura's
        product, capital, and platform-expansion strategy.
      claimRefs:
        - CO025
        - CO026
  headquarters: Greater Boston, Massachusetts, USA
  productSummary: >-
    Aura provides all-in-one digital protection for individuals and families, combining
    identity theft protection, three-bureau credit monitoring, instant credit lock, fraud and
    transaction alerts, data-broker removal, VPN, antivirus, password management, and child
    online-safety features.
  customerFocus: >-
    U.S. households buying direct subscriptions, plus employees and families reached through
    employer benefits, resellers, insurers, credit unions, MSPs, and other partner channels.
  businessModel: >-
    Recurring subscription revenue from consumer plans, supplemented by partner, employer-benefits,
    and emerging MSP / BYOD distribution where Aura's online-safety bundle is embedded into other
    channels.
  stage: Private / Series G
  fundingStatus: >-
    Latest disclosed financing was a March 2025 Series G that raised $140M in a mix of equity and
    debt at a $1.6B valuation; the public record does not disclose the debt-versus-equity split or
    investor waterfall.
