summary:
  headline: >-
    Aura has enough scale, product breadth, and partner distribution to merit continued diligence,
    but the combination of private-company opacity and trust overhang keeps the recommendation at
    research-more rather than buy.
  overallScore: 6.4
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: fair
  keyMetrics:
    valuationUsdM: 1600
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: 50
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: null
    customerCount: 1600000
    headcount: null
  topStrengths:
    - >-
      Aura has real public traction signals, including 1.6M+ customers protected, strong app-store
      usage proof, and independent rankings that consistently place it near the top of the identity
      protection category.
    - >-
      The product is broader than a narrow credit-monitoring service, spanning identity, fraud,
      privacy, device security, and child online-safety workflows inside one household bundle.
    - >-
      Distribution is diversifying beyond direct subscriptions, with employer benefits and direct
      partnerships already disclosed as more than 30% of 2025 revenue.
    - >-
      The March 2025 Series G provides a real price-discovery anchor and shows reputable investors
      still underwriting the online-safety platform thesis.
  topRisks:
    - >-
      Aura still does not publish audited revenue, ARR, gross margin, retention, cash, cap-table
      terms, or the debt split inside its latest financing.
    - >-
      The March 2026 breach did not reportedly hit the core protection database, but it still
      weakens trust in a brand that sells safety and scam prevention.
    - >-
      Category feature breadth is no longer scarce; competing bundles and cheaper substitutes can
      pressure pricing and raise customer-acquisition costs.
    - >-
      Partner-led expansion supports growth but can also hide concentration risk if a few channels
      drive too much of revenue or renewal quality.
    - >-
      Without clearer economics, upside from the last disclosed valuation looks moderate before any
      dilution or hidden liquidation preferences.
  unresolvedGaps:
    - >-
      Need audited 2024-2025 revenue, margin, cash-flow, and retention data to test whether Aura
      deserves a premium recurring-software valuation.
    - >-
      Need the March 2025 financing waterfall, including debt-versus-equity split, covenants,
      preferences, and any updated 2026 price discovery.
    - >-
      Need partner-channel concentration, renewal, and CAC data—especially for MetLife and other
      non-self-serve distribution lanes.
    - >-
      Need post-breach churn, partner diligence outcomes, and brand-impact data to assess trust
      recovery after the March 2026 incident.
    - >-
      Need a clearer breakdown of customer mix across direct consumer, employer benefits, MSP/BYOD,
      and reseller channels.
