- id: capital-channels-and-stakeholders
  title: Capital History, Distribution Channels, and Stakeholder Map
  body: 'Aura''s capital narrative sharpened after the 2024 separation from Pango / Point Wild. In March 2025 the company announced a $140M mixed equity-and-debt Series G at a $1.6B valuation, led by Ten Eleven Ventures and Madrone Capital with AT&T Ventures joining and existing backers Accel, Warburg Pincus, and General Catalyst participating. Tracxn independently records the same latest-round and valuation markers, while FinTech Global and FinSMEs corroborate both the size and the syndicate. The raise also helps explain Aura''s go-to-market broadening. MetLife remains the anchor employer-benefits partner, and the 2025 Aura Business launch says direct partnerships plus employee-benefits distribution already made up more than 30% of 2025 revenue. That suggests Aura is not just a subscription app anymore; it is a multi-channel platform spanning direct consumer, employer benefits, insurers, resellers/MSPs, and newer enterprise-security use cases. The unresolved issue is structure: public sources
    do not break the $140M into debt versus equity, nor do they show ownership percentages or board/control rights by investor.'
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
