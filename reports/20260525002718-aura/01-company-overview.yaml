company:
  name: Aura
chapter:
  number: 1
  title: Company Overview
  summary: Aura is a founder-led digital safety platform that says it evolved from iSubscribed into a broader online-protection suite through the Identity Guard, Pango, and Circle transactions, then separated from Point Wild before raising a $140 million Series G at a $1.6 billion valuation in March 2025. Public evidence supports meaningful scale and channel breadth—1.6M+ customers protected, 20+ digital parenthood partners, and growing employer/partner distribution—but audited revenue, board control, and the debt-versus-equity split of the latest round remain undisclosed.
sections:
- id: identity-product-and-scale
  title: Identity, Product, and Scale Snapshot
  body: 'Aura today presents as a Greater Boston-based, growth-stage digital safety company founded in 2017 as iSubscribed and remade through the Identity Guard, Pango, PrivacyMate/FigLeaf, and Circle transactions. Across its about page, pricing pages, and 2025 Series G materials, Aura consistently describes itself as an AI-powered, all-in-one online safety platform for individuals and families rather than a single-feature identity-monitoring product. The current consumer bundle combines identity theft protection, three-bureau credit monitoring and credit lock, device security, VPN, password management, data removal, and family/gaming safety features. Aura''s own scale claims are meaningful but need framing: it says it protects 1.6M+ customers, works with 20+ digital parenthood partners, and through reseller/partner channels helps keep 3M+ individuals safe online. Distribution clearly extends beyond direct-to-consumer subscriptions because the company also sells through insurers, employers,
    credit unions, MSPs, and property managers. Exact HQ disclosure is still fuzzy because independent sources alternate between Burlington and Boston, so “Greater Boston” is the safest chapter-one formulation.'
