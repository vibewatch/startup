  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, investor protective provisions, and ownership percentages by major holder.
    whyItMatters: Control rights and board influence matter for underwriting management autonomy after the spin-off and new financing.
    diligencePath: Request the latest board deck, cap table, voting agreements, and investor rights summary from management.
    relatedQuestionRefs:
    - QO014
    - QO029
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: series-g-structure
    missingEvidence: Debt-versus-equity split, instrument terms, lender identity, and any warrants or liquidation preferences embedded in the $140M round.
    whyItMatters: Mixed rounds can look stronger than they are if a meaningful portion is structured debt or preference-heavy paper.
    diligencePath: Obtain the financing closing memo, debt term sheet, and post-money cap table for the Series G.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO003
    - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Absolute revenue, ARR, gross margin, retention, and cohort or claims-loss data underlying the public 2024 growth statement.
    whyItMatters: Growth percentages are directionally helpful but cannot support valuation or durability work without a revenue base and quality metrics.
    diligencePath: Ask for 2024 audited financials, 2025 YTD management accounts, and recurring-revenue cohort analysis.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: channel-scale
    missingEvidence: Named employer counts, insurer relationships, MSP customer counts, enterprise-seat counts, and channel concentration metrics.
    whyItMatters: Aura's go-to-market mix now spans multiple channels, but public evidence does not show which one actually drives durable scale or concentration risk.
    diligencePath: Request channel-level bookings, active customer counts, and top-partner concentration by revenue for 2024 and 2025.
    relatedQuestionRefs:
    - QO028
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: public-milestones
    missingEvidence: Exact close dates and full terms for older acquisitions, the August 2024 initial close, and any undisclosed internal launches not carried on the public chronology.
    whyItMatters: The chapter can reconstruct the strategic arc, but exact transaction timing still matters for integration quality and post-spin execution pacing.
    diligencePath: Request a board-approved corporate timeline or deal list with close dates, counterparties, and integration status.
    relatedQuestionRefs:
    - QO002
    - QO019
    relatedTableRefs:
    - TO004
