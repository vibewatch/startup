- id: milestones-disclosure-gaps-and-adverse-signals
  title: Milestones, Disclosure Gaps, and Adverse Signals
  body: 'The public milestone record is unusually clear at the headline level: 2017 founding, 2018 Intersections / Identity Guard acquisition, 2019 Aura rebrand, 2020 Pango / FigLeaf / PrivacyMate roll-up, 2021 Circle acquisition, 2022 MetLife distribution, 2024 Point Wild separation, and 2025 Series G financing. That chronology supports a thesis that Aura has repeatedly used M&A and distribution partnerships to move from identity protection into a broader family-digital-safety platform. Still, chapter-one diligence cannot stop at the timeline. Aura has not published audited revenue, ARR, customer monetization, or detailed cap-table data, so several core underwriting questions remain only partially answered. The main adverse item in current public materials is the March 2026 breach disclosure: SecurityWeek, HIBP, and Aura''s own statement all point to roughly 900k exposed records after a phone-phishing attack, even though Aura says the affected data came from marketing lists rather than
    the core protection database. That incident does not invalidate the product, but it does challenge the company''s safety brand and incident-response narrative.'
