chapter:
  number: 3
  title: Competitors
  summary: 'Aura competes well against direct identity peers on bundle breadth, family coverage, and partner distribution, but it is squeezed from both sides: LifeLock and Experian bring older brands and public-company scale, while Surfshark- and NordProtect-like privacy bundles can replace large chunks of Aura’s non-remediation feature set. The March 2026 breach matters because it weakens the trust premium Aura needs to defend while adjacent alternatives become easier for review sites to recommend.'
sections:
- id: landscape-and-positioning
  title: Landscape and Positioning
  body: 'Aura sits in the center of a crowded but still segmented market. The direct comparison set is not every consumer-security app; it is the smaller group of vendors that pair identity monitoring with some combination of credit visibility, insurance-backed recovery, fraud specialists, and family coverage. On that basis, LifeLock, Identity Guard, and Experian IdentityWorks are the clearest direct peers. Adjacent pressure comes from privacy or security bundles such as Surfshark One+ and the NordProtect-style set that review sites now place in Aura-alternatives lists after the March 2026 incident. The status quo also matters because many households can patch together credit freezes, bank alerts, password tools, or a VPN without buying a dedicated suite. Aura’s relative advantage is breadth with simple packaging: its current bundle stretches from identity monitoring and credit lock to device security, data removal, and child safety, while most rivals win on a narrower axis such as insurance
    branding, price, or credit pedigree.'
  claimRefs:
