- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or pressure point
  - Threat or rival
  - Severity
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - Aura wins by bundling identity, family safety, privacy, and device security
    - Privacy-security bundles like Surfshark can peel away the non-remediation features
    - High
    - Adjacent bundles now appear in 2026 Aura-alternatives coverage and offer stronger privacy tooling
    - Aura must prove bundled convenience drives retention beyond VPN or broker-removal parity
    - Request feature-level attach and retention by family vs individual plans
  - - Aura’s family breadth is a moat
    - LifeLock and Identity Guard still cover families and children, even if less broadly
    - Medium-High
    - Independent reviews still rate LifeLock and Identity Guard highly for family or alerting use cases
    - Family breadth is differentiating, but not exclusive
    - Ask for family-plan mix, child-seat utilization, and conversion by family status
  - - Aura’s channel reach can lower CAC pressure
    - Public incumbents and older brands may still enjoy greater trust at the point of sale
    - High
    - Partner page shows real channel depth, but LifeLock and Experian carry public-company trust signals
    - Partner distribution helps only if channel conversion and renewal are strong
    - Request partner-channel revenue, retention, and support burden by cohort
  - - Aura’s simple packaging reduces purchase friction
    - Cheaper direct peers and DIY stacks keep price comparison easy
    - High
    - Identity Guard starts lower, and DIY stacks remain viable for partial needs
    - Pricing simplicity does not eliminate downgrade risk
    - Request win-loss and churn by primary competitor and by list-price cohort
  - - Trust should support premium positioning
    - The 2026 breach gives buyers and reviewers a live reason to reconsider Aura
    - High
    - SecurityWeek and alternative guides explicitly connect the incident to comparison shopping
    - Trust shocks can compress conversion and renewal even if the product remains broad
    - Measure post-incident conversion, support load, and renewal deltas
  - - Aura can be scored against every adjacent rival in a clean matrix
    - Several retained official plan pages were unavailable or unreadable
    - Medium
    - LifeLock, McAfee, NordPass, and Malwarebytes official surfaces were incomplete in this run
    - The evidence set is sufficient for directional judgment, but not for every exact like-for-like claim
    - Refresh with archived or alternate official plan URLs before hard-coding secondary bundle scores
  notes: This register focuses on the conditions under which Aura’s apparent breadth stops being a moat and becomes a commoditized bundle. Severity is directional, not a probabilistic loss estimate.
