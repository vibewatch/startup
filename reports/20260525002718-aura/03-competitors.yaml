- id: moat-durability-and-adverse-evidence
  title: Moat Durability and Adverse Evidence
  body: 'The best bull case for Aura is not that it has exclusive ownership of identity protection, because it clearly does not. The bull case is that Aura bundles together three things that are often sold separately: full-household protection, identity-resolution depth, and enough channel reach to lower dependence on pure direct-response marketing. That is a workable moat if customers value simplicity and if partner channels keep growing. The bear case is equally clear. Direct rivals already own pieces of the buyer decision: LifeLock carries older-brand reassurance, Identity Guard owns a lower entry point, and Experian carries credit-file credibility. Adjacent security bundles can also strip away the non-remediation features that make Aura feel differentiated. The retained-source set still has uncertainty around some adjacent competitors because several official plan surfaces were unavailable, but that uncertainty itself is informative: Aura’s differentiation should be judged against what
    can be directly proven, not against every theoretical substitute named in a roundup.'
