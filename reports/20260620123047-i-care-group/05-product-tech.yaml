  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: AI model transparency
      missingEvidence: >
        Independent benchmarking of I-see AI failure prediction accuracy: false positive rates,
        false negative rates, precision/recall by asset class, and model training methodology.
      whyItMatters: >
        I-care's core commercial claim is AI-enabled prediction months or years ahead of failures.
        Without independent validation, enterprise buyers and investors cannot assess whether
        this claim holds across new asset types or environments beyond the existing training set.
      diligencePath: >
        Request model validation documentation from I-care; commission third-party benchmark
        on a representative asset sample; ask for academic publications or white papers
        describing training data methodology and out-of-sample performance.
      relatedQuestionRefs: [QE014]

    - type: missing-source
      severity: minor
      topic: Wi-care hardware specs
      missingEvidence: >
        Published technical validation of the 5-year battery life claim, including usage
        assumptions (measurement frequency, data transmission duty cycle, operating temperature
        range), and ATEX marking details (Ex category, equipment group, temperature class).
      whyItMatters: >
        Battery life is a key selling point enabling the subscription model; a shorter real-world
        life would increase total cost of ownership and create deployment friction. ATEX marking
        details are required by industrial safety engineers before approving hazardous-area deployment.
      diligencePath: >
        Request Wi-care 130 G23 full technical datasheet and ATEX certificate from I-care;
        verify ATEX certificate number against the EU ATEX database or IECEx online certificate search.
      relatedQuestionRefs: [QE018]

    - type: access-blocked
      severity: minor
      topic: adverse customer feedback
      missingEvidence: >
        Independent reviews or complaints from I-care customers on G2, Gartner Peer Insights,
        Capterra, or procurement/tender records documenting service quality issues, failed pilots,
        or CMMS integration failures.
      whyItMatters: >
        I-care's customer testimonials are self-selected; adverse review platforms would provide
        unbiased signal on service quality variability across geographies, technical integration
        difficulties, and analyst reliability.
      diligencePath: >
        Search G2, Gartner Peer Insights, and Capterra for I-care Group reviews (limited availability
        at research date); request customer references from I-care covering non-reference accounts;
        search LinkedIn for engineer posts mentioning Wi-care or I-see deployment experience.
      relatedQuestionRefs: [QE022]

    - type: private-evidence-only
      severity: material
      topic: cloud dependency
      missingEvidence: >
        Identity of I-care's cloud infrastructure provider for the I-see platform, along with
        data residency region, uptime SLA, failover architecture, and GDPR sub-processor registration.
      whyItMatters: >
        Regulated-industry customers (pharma, nuclear, defense) require data residency commitments
        and cloud provider disclosure before procurement. Unnamed cloud providers create due-diligence
        gaps and may trigger compliance blockers in European public-sector procurement.
      diligencePath: >
        Request I-care's Data Processing Agreement and sub-processor list during commercial due
        diligence; verify cloud provider through DNS/network analysis of I-see platform infrastructure.
      relatedQuestionRefs: [QE019]

    - type: missing-source
      severity: material
      topic: SDT-I-see integration status
      missingEvidence: >
        Publicly specified timeline and feature-completeness roadmap for the technical convergence
        of SDT International's UAS3 software with the I-see analytics platform.
      whyItMatters: >
        The "single platform" value proposition from the SDT acquisition depends on completing
        this software integration. Until it is complete, customers must operate two separate tools.
        Delay or complexity in convergence could reduce the acquisition's strategic value.
      diligencePath: >
        Request the integration roadmap directly from I-care during due diligence; monitor SDT
        and I-care product release notes and news for convergence announcements.
      relatedQuestionRefs: [QE009]

    - type: missing-source
      severity: minor
      topic: Mecotec and subsidiary integration depth
      missingEvidence: >
        Documentation of how Mecotec's calibration measurements, qualification records, and
        Industry 4.0 analysis data are ingested into or visible within the I-see analytics
        platform, and whether Mecotec data feeds I-see AI models.
      whyItMatters: >
        Mecotec is presented as part of I-care's integrated reliability offering, but the
        technical integration between Mecotec's instruments/data and the I-see platform is
        not documented publicly. Without this, the claimed end-to-end integration across
        all I-care subsidiaries cannot be independently verified.
      diligencePath: >
        Request product integration documentation from I-care; ask whether Mecotec measurement
        data is accessible via I-see dashboards or APIs; verify through a reference customer
        that uses both Mecotec and I-see services.
      relatedQuestionRefs: [QE021]

