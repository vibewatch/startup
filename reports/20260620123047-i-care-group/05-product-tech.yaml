company:
  name: I-care Group

chapter:
  number: 5
  title: Product & Technology
  summary: >
    I-care's product stack integrates proprietary Wi-care™ IoT vibration sensors manufactured
    in Belgium (up to 2,000/day), the I-see™ AI analytics cloud platform (ISO 27001 certified,
    noSQL, open API), expert field services across six PdM techniques, and—since March 2025—SDT
    International's world-leading ultrasound technology. The hardware-AI-services bundle is
    genuinely differentiated for multi-technique reliability programs and explosive-atmosphere
    markets (ATEX-certified), but AI model internals remain undisclosed, the SDT-I-see software
    integration is still maturing, cloud infrastructure dependencies are unnamed, and the 600-engineer
    service layer creates margin ceilings that pure-software competitors sidestep.

sections:
  - id: product-overview
    title: Product and Service Portfolio Definition
    body: >
      I-care delivers industrial predictive maintenance through a vertically integrated stack
      with three commercial layers: (1) proprietary hardware—the Wi-care™ wireless IoT sensor
      family and, since March 2025, SDT International's ultrasound instrumentation; (2) the
      I-see™ cloud analytics platform, which applies AI to sensor data and pushes actionable
      alerts into customer workflows; and (3) expert services, in which 600+ field engineers
      perform physical inspections, route-based vibration routes, and reliability consulting.
      A fourth commercial package, "PdM as a Service," bundles all three into a single
      subscription, shifting the purchase from capital expenditure to operating expenditure.

      I-care further owns Mecotec (Belgium-based calibration and cleanroom qualification),
      Technical Associates of Charlotte (US), and Technical Associates of Europe (EU), which
      add reliability engineering consulting and multi-technique training. This portfolio spans
      from commodity-comparable services (IR thermography, oil analysis via lab partners) to
      genuinely proprietary technology (Wi-care sensors, I-see AI models, SDT ultrasound
      instruments). The degree of AI-native autonomy varies sharply by layer: hardware and
      sensor delivery are near-automated at scale, while failure diagnosis and maintenance
      recommendation still rely heavily on human analyst review of AI-generated reports.
    claimRefs: [CE001, CE006, CE019, CE020, CE021, CE022, CE023, CE024]
    tableRefs: [TE001]
    figureRefs: [FE001]

  - id: hardware-wicare
    title: "Wi-care™ Hardware Platform and Manufacturing"
    body: >
      The Wi-care™ sensor is I-care's flagship proprietary hardware. It measures vibration
      (tri-axial), impact, and temperature wirelessly on rotating equipment, uses a native IoT
      protocol for communication to on-site gateways, and offers a claimed 5-year battery life.
      The current-generation model is the Wi-care 130 G23; a simplified lower-cost variant
      called Wi-care Pure targets smaller deployments. A key differentiator is ATEX certification
      for Zone 1/2 explosive atmospheres, allowing deployment in oil and gas refineries,
      petrochemical plants, and other hazardous environments where most wireless electronics
      cannot legally operate.

      Sensors are designed and manufactured by I-care Electronics—renamed from Cepya Electronics
      in 2025 after full integration into the group—at a Belgium Industry 4.0 facility capable
      of producing up to 2,000 units per day. This in-house manufacturing capability creates
      a hardware data flywheel: every deployed sensor feeds the I-see AI training dataset,
      while volume production enables the Wi-care as a Service subscription model (sensors
      rented rather than sold). Specific wireless protocol specifications, MEMS sensor chip
      sourcing, and gateway hardware supply chain remain proprietary and undisclosed.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007]
    tableRefs: [TE002]
    figureRefs: [FE002]

  - id: isee-platform
    title: "I-see™ AI Analytics Platform"
    body: >
      The I-see™ platform is a cloud-hosted, AI-enhanced analytics environment that ingests
      continuous sensor data from Wi-care endpoints and—since the SDT International acquisition—
      from ultrasound instruments. I-see stores data in a proprietary noSQL database and processes
      millions of data points per day. Its core AI pipeline performs three-state classification
      of each measurement sequence: healthy operation, potential issue, or critical alarm.
      Machine learning models trained on the company's dataset of 150,000+ monitored sensor
      endpoints underpin failure prediction logic; the company claims predictions months or
      even years in advance of failures.

      Beyond failure detection, I-see automates monitoring infrastructure management—checking
      battery status, sensor faults, and gateway connectivity to keep the edge layer reliable.
      AI-generated findings are compiled into structured reports that human reliability analysts
      review before recommendations are pushed to maintenance teams or fed into CMMS work orders
      via an open API. This human-in-the-loop step reflects a deliberate design choice,
      acknowledged in customer testimonials: sensors and AI accelerate decision support, but
      experienced engineers remain indispensable for interpreting ambiguous fault signatures.
      I-see also offers a mobile app providing real-time dashboards, instant push notifications,
      and savings tracking. The platform holds ISO 27001 certification for information security,
      though the cloud provider, data residency region, and sub-processor list are not publicly
      disclosed—a gap material for regulated-industry customers subject to data sovereignty rules.
    claimRefs: [CE011, CE012, CE013, CE014, CE015, CE016, CE017, CE018, CE040]
    tableRefs: [TE003]
    figureRefs: []

  - id: services-and-sdt
    title: Expert Services, SDT Ultrasound, and Subsidiary Capabilities
    body: >
      I-care's services layer covers six PdM techniques: vibration analysis (the core), oil
      and grease analysis, motion magnification, infrared thermography, ultrasound, and motor
      circuit analysis. The March 2025 acquisition of SDT International—named "Harmonising
      Waves"—added 50 years of ultrasound heritage, a worldwide distribution network, and
      product lines including the SDT340 flagship instrument, LUBExpert acoustic lubrication
      guidance system, the portable CHECKER range, permanent monitoring solutions (Vigilant,
      Online4US), and CRYSOUND acoustic imaging. SDT's UAS3 analysis software is intended to
      converge with I-see, creating a single platform for both vibration and ultrasound diagnosis.

      Service delivery operates through three contractual models: fully outsourced (I-care
      takes on-site responsibility), co-managed (I-care supplements customer teams), and
      advisory (I-care coaches customer-owned reliability programs). This flexibility is a
      commercial strength but also a complexity risk: quality consistency across 600+ engineers
      in 35+ offices across 15 countries is difficult to assure, and the service layer is labor-
      intensive in a way that compresses operating margins. Mecotec provides calibration,
      qualification, and Industry 4.0 production-line analysis—predominantly in Belgium and
      northern France—adding compliance-grade measurement services for pharmaceutical and
      clean-room customers. Technical Associates delivers multi-technique PdM training and
      ISO Category 1 ultrasound certification in the US and Europe.
    claimRefs: [CE008, CE009, CE010, CE019, CE020, CE022, CE023, CE025]
    tableRefs: []
    figureRefs: []

  - id: integrations-roadmap
    title: Integrations, Deployment, and Technology Roadmap
    body: >
      I-see's open API connects to CMMS systems—confirmed integrations include MVP One,
      DimoMaint, and Mainti4—enabling automated work-order creation from AI-generated alerts
      without manual re-entry. Beyond CMMS connectivity, I-care joined AVEVA's partner
      ecosystem as a Managed Solution Provider and integrated AVEVA PI System process-historian
      data into I-see, opening a route into plants already running AVEVA infrastructure.
      An Oracle partner program membership and integrations with Filtertechnik (oil filtration
      analysis) and POLARIS Laboratories (fluid analysis) round out the third-party ecosystem.

      No public API documentation, SDK, or developer portal was found, and a GitHub search
      returned zero I-care repositories—signals that the integration surface is partner-
      mediated rather than self-service for customers or third-party developers. This creates
      friction for customers who want custom data flows or independent validation of I-see
      outputs. The technology roadmap centers on three vectors: (a) completing the SDT
      ultrasound–I-see software convergence, (b) expanding the Wi-care as a Service
      subscription footprint (target: more than 90% of monitored assets on recurring
      subscriptions), and (c) scaling sensor manufacturing to support the growing deployment
      base. Industry awards in 2025—Factory Innovation Award at Hannover Messe and Solutions
      Award at The Reliability Conference—provide external validation of the technology
      positioning, though they do not independently assess technical claims.
    claimRefs: [CE026, CE027, CE028, CE029, CE030, CE038, CE039]
    tableRefs: [TE005]
    figureRefs: [FE003]

  - id: trust-security-compliance
    title: Trust, Security, Compliance, and Technical Risk
    body: >
      I-care holds ISO 27001 certification for the I-see platform and data management
      processes, providing an enterprise-grade information security baseline that supports
      sales into regulated industries (pharma, energy, food and beverage). Wi-care sensors
      carry ATEX certification for Zone 1/2 explosive atmospheres—a hard technical
      prerequisite for oil and gas and petrochemical deployments that competitors without
      proprietary hardware cannot match without third-party sensors. GDPR compliance is
      implicit given I-care's Belgian incorporation, but no public Data Processing Agreement
      templates or sub-processor list were found.

      Key technical risks are concentrated in three areas. First, AI opacity: ML failure
      prediction models are not documented publicly—methodology, training data splits, false
      positive rates, and performance on asset types not yet in the training set are unknown,
      creating a due-diligence gap for customers and investors evaluating prediction claims.
      Second, cloud dependency: the infrastructure provider hosting I-see is unnamed, preventing
      customers from assessing redundancy, failover, or data sovereignty commitments. Third,
      service scalability: the 600-engineer field force that differentiates I-care from pure-
      software rivals is also the largest structural cost item; as AI matures, customers will
      expect fewer engineer-hours per monitored asset, creating margin pressure unless I-see's
      AI layer can absorb a growing share of diagnostic labor. Wi-care's 5-year battery life
      and specific ATEX marking class are claimed but not substantiated by publicly accessible
      test reports or certification registry entries.
    claimRefs: [CE031, CE032, CE033, CE034, CE035, CE036, CE037]
    tableRefs: [TE004]
    figureRefs: [FE004]

