  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >
        Consolidated gross margin by segment (hardware, software, services) from audited group accounts
      whyItMatters: >
        Gross margin is the primary driver of valuation multiple and profitability path. Without it,
        the WaaS economics and revenue quality cannot be assessed, and the capital raise terms cannot
        be properly calibrated.
      diligencePath: >
        Request audited consolidated P&L from CFO Bruno Casamassa; review management accounts for
        FY2024 and FY2025 at minimum by segment.
      relatedQuestionRefs: [QI008, QI019, QI020]
      relatedTableRefs: [TI004]

    - type: private-evidence-only
      severity: blocking
      topic: cash-runway
      missingEvidence: >
        Monthly cash burn rate, cash on hand post-December 2025 insider round, and 12-month cash forecast
      whyItMatters: >
        The Belga article confirmed an expected cash shortfall by late 2025/early 2026. Without burn
        rate and cash position, runway cannot be quantified, which is critical ahead of the Phase 2 raise.
      diligencePath: >
        CFO discussion; request board-approved 24-month cash flow model; review any credit facility
        agreements for working capital coverage.
      relatedQuestionRefs: [QI006, QI009, QI025]
      relatedTableRefs: [TI005]

    - type: private-evidence-only
      severity: material
      topic: WaaS-ARR
      missingEvidence: >
        WaaS ARR by cohort, net revenue retention (NRR), conversion rate from field-service to
        subscription, and churn rate
      whyItMatters: >
        Revenue quality and valuation multiple hinge on the subscription share and its stickiness.
        Undisclosed WaaS progress makes the 90%-goal credibility unverifiable.
      diligencePath: >
        Request CRM-validated WaaS ARR summary; NRR by cohort; historical churn data by contract type.
      relatedQuestionRefs: [QI011, QI012]
      relatedTableRefs: [TI004]

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >
        Customer acquisition cost (CAC), payback period, lifetime value (LTV), and average contract
        value (ACV) by product line
      whyItMatters: >
        Sales efficiency and customer economics determine whether I-care can scale revenue without
        proportional cost increases—critical for the IPO readiness narrative.
      diligencePath: >
        Request blended CAC by segment, geography, and year; provide 3-year cohort revenue data.
      relatedQuestionRefs: [QI017]
      relatedTableRefs: [TI004]

    - type: missing-source
      severity: material
      topic: external-raise-status
      missingEvidence: >
        Status of the planned 2026 external investor raise: closed/open, size, lead investor,
        and valuation terms
      whyItMatters: >
        This raise bridges I-care to IPO readiness. Delay or shortfall creates capital risk and
        could force sub-optimal financing.
      diligencePath: >
        Direct inquiry to CEO Brion or CFO Casamassa; monitor Belgian financial press (De Tijd,
        L'Echo) for announcement.
      relatedQuestionRefs: [QI006, QI025]
      relatedTableRefs: [TI005]

    - type: missing-source
      severity: material
      topic: revenue-segmentation
      missingEvidence: >
        Revenue breakdown by product line (hardware vs software vs services) and by geography
      whyItMatters: >
        Revenue mix determines applicable valuation multiple; a SaaS-heavy mix justifies 10–15×
        revenue, while a services-heavy mix justifies 1–3×.
      diligencePath: >
        Request management reporting or audited segmental revenue data for FY2024 and FY2025.
      relatedQuestionRefs: [QI019]
      relatedTableRefs: [TI001, TI004]

    - type: private-evidence-only
      severity: minor
      topic: IPO-timeline
      missingEvidence: >
        Revised IPO timeline and exchange selection (Brussels Euronext, Amsterdam, or other)
      whyItMatters: >
        IPO date affects investor liquidity horizon, secondary share price reference, and regulatory
        disclosure requirements that would unlock more financial transparency.
      diligencePath: >
        Monitor I-care investor page and Belgian financial press; investor relations contact at
        icareweb.com.
      relatedQuestionRefs: [QI009, QI028, QI029]
      relatedTableRefs: [TI005]

acknowledgedWarnings:
  - dimension: tableNotes
