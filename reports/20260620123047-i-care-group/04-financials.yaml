company:
  name: I-care Group

chapter:
  number: 4
  title: Financials
  summary: >
    I-care Group reported consolidated revenue of €74 million in 2024 (up 15% YoY) with an €8.2 million
    net loss, and by December 2025 had surpassed $116 million in annual revenue. The company generates
    revenue through three interlinked streams—Wi-care™ IoT hardware, I-see™ software subscriptions, and
    expert field services—with a stated strategic goal of migrating 90% of monitored assets to the Wi-care
    as a Service (WaaS) subscription model. Capital needs remain substantial: a $23.2 million/€20 million
    insider round in December 2025 achieved unicorn status at €1 billion valuation and set the stage for a
    planned multi-tens-of-millions external-investor raise in 2026, followed by an eventual IPO that was
    delayed from 2025 due to market turmoil. Gross margins and EBITDA are not publicly disclosed; the
    combination of continued losses, hardware manufacturing capex, and M&A spending requires careful
    scrutiny of burn, working capital, and the adequacy of the 2026 raise to bridge to positive cash flow.

sections:
  - id: revenue-model-and-streams
    title: Revenue Model and Streams
    body: >
      I-care operates a three-layer revenue model that integrates hardware, software, and services. The
      hardware layer consists of Wi-care™ proprietary IoT vibration sensors sold outright or deployed under
      the Wi-care as a Service (WaaS) subscription. The software layer is the I-see™ AI analytics platform,
      which aggregates sensor data and delivers failure predictions; it is offered as a SaaS licence
      alongside sensor deployments. The services layer—delivered by more than 600 field engineers—comprises
      predictive maintenance programmes, reliability engineering consulting, ultrasound inspections (via
      recently acquired SDT International), and training and certification through Technical Associates of
      Charlotte and Technical Associates of Europe.

      WaaS bundles all three layers into a single recurring subscription fee charged per monitored asset,
      replacing the historical pattern of one-time hardware sales followed by separate software and service
      contracts. I-care's stated ambition is for 90% of monitored assets to be covered under WaaS within
      five years of the 2022 Series C, implying the model is still mid-transition. The company's revenue
      recognition is therefore a mix of point-in-time hardware revenue, ratable software licences, and
      time-and-materials or fixed-fee services. The March 2025 acquisition of SDT International added
      ultrasound device hardware and related software revenue streams, funded entirely from existing equity
      rather than debt—a deliberate signal of financial discipline even as the group remained loss-making.

      Revenue quality in a hardware-plus-software model is meaningfully higher than pure hardware because
      recurring software and subscription revenues are more predictable and command higher valuation
      multiples. However, hardware manufacturing capex (the Industry 4.0 facility in Belgium now produces
      up to 2,000 sensors per day) and field-service headcount costs keep gross margins structurally below
      pure-software benchmarks. Exact hardware versus software versus services revenue splits have not been
      disclosed, which is a significant diligence gap.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: historical-growth-and-traction
    title: Historical Revenue Growth and Traction
    body: >
      I-care has delivered consistent double-digit revenue growth since founding in 2004. The company
      reported approximately 35% average annual revenue growth over the 17 years through 2021 (according
      to founder statements at the 2020 EY Company of the Year award). In fiscal year 2024, the group
      reported consolidated revenue of €74 million, an increase of 15% versus 2023—a moderation from
      historical rates, consistent with a larger base and the absorption of acquisition integration costs.
      The 2024 net loss stood at €8.2 million, indicating continued investment-phase losses rather than
      fundamental unit-level unprofitability, though granular margin data to confirm this assessment
      are not publicly available.

      By the December 2025 unicorn announcement, I-care reported consolidated annual revenues exceeding
      $116 million (approximately €105–110 million at prevailing exchange rates), with management citing
      25% growth in April 2025 alone. This implies 2025 full-year revenue growth of roughly 40-50% over
      2024's €74 million base, driven by the SDT International acquisition, sensor volume ramp from the
      manufacturing facility, and WaaS subscription expansion. The order book at the same date exceeded
      $232 million (over €200 million), representing approximately 2× annualised revenue—a healthy
      multi-year demand signal that de-risks near-term revenue visibility.

      The I-care investors page publicly states percentage of recurring revenue but the numeric value is
      not rendered as an accessible figure; the company's narrative consistently highlights growing
      recurring-revenue contribution without providing a precise split. At the 2022 Series C, I-care
      monitored approximately 50,000 sensors; by December 2025 this reached 150,000+, implying a 3×
      sensor base expansion in roughly three years. Revenue per sensor endpoint is an unverifiable private
      metric but directionally supports the revenue growth trajectory if WaaS conversion rates are rising.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016, CI017]
    tableRefs: [TI003]
    figureRefs: [FI003]

  - id: unit-economics-and-pricing
    title: Unit Economics and Pricing Architecture
    body: >
      I-care does not publish list pricing for Wi-care sensors, the I-see platform, or WaaS bundles. The
      company's marketing positions WaaS as delivering "financial predictability and control" by converting
      irregular capex into predictable operating expenditure for the customer. No per-unit pricing or
      average revenue per sensor has been disclosed in any public filing or press release.

      Proxy benchmarks from the industrial IoT maintenance sector suggest typical per-endpoint annual
      subscription fees in the €300–€1,500 range for hardware-inclusive monitoring services, depending on
      asset criticality, sensor density, and services scope. At the December 2025 baseline of 150,000+
      monitored sensors and $116 million in revenue, the implied average revenue per sensor endpoint is
      roughly $770 per year if all revenue were attributable to the sensor install base—which overstates
      the per-sensor figure because a substantial portion of revenue is services not directly tied to
      sensor counts. This is a rough directional estimate only; actual unit economics (hardware COGS,
      software gross margin, services margin) are all private.

      The 2022 Series C press release cited aspirations to multiply revenues and normalised EBITDA margin
      by 5× within five years. At the 2022 revenue base (implied circa €35–40 million based on subsequent
      2024 actual of €74 million and 35%+ growth), the 5× EBITDA target implies reaching strongly positive
      adjusted EBITDA around 2027, consistent with the IPO timeline. The 2024 net loss of €8.2 million
      on €74 million revenue represents an approximate (11%) net margin—loss-making but not deeply so,
      suggesting gross margin is likely positive even if the bottom line is burdened by R&D, sales
      expansion, and manufacturing start-up costs. All margins are inferred; direct disclosure is absent.

      For field services, the company's value proposition to customers includes reduction of maintenance
      costs by 35–45% and machine downtime by 10–20%. These customer-level savings imply the ability to
      charge meaningful programme fees for reliability outcomes, supporting service-heavy revenue quality.
    claimRefs: [CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025, CI026]
    tableRefs: [TI004]
    figureRefs: [FI002]

  - id: capital-structure-and-adequacy
    title: Capital Structure and Adequacy
    body: >
      I-care's capital history (detailed in the Company Overview chapter) culminated in a December 2025
      insider round of $23.2 million/€20 million from existing shareholders (Wallonie Entreprendre, IMBC,
      Noshaq) and employees. This round served a dual purpose: it established the €1 billion post-money
      valuation (unicorn milestone) and, per the Belga reporting on the pre-announcement dual-raise
      discussion, partially refinanced the March 2025 acquisition of SDT International. The Belgian
      Crossroads Bank for Enterprises (BCE) records I-CARE HOLDING as holding capital of approximately
      €82.7 million, and CompanyWeb cites the 2023 holding-entity equity at €69.2 million—both figures
      reflecting the holding entity alone, not the consolidated group.

      Prior to the December 2025 round, Belga reported (citing De Tijd) that the company was planning
      a two-part raise: approximately €10 million from existing shareholders to refinance the SDT
      acquisition, followed by a larger external round of "tens of millions of euros" from major
      international investment funds—the biggest in I-care's history. The timing of the full raise was
      targeted to cover an expected cash shortfall by late 2025 or early 2026, underscoring a real
      near-term capital need rather than purely opportunistic fundraising.

      Phase 2 of the company's stated three-phase capital plan—external investor raise in 2026—is the
      critical event for diligence. Its size, terms, and investor identity are unknown. Phase 3 is an IPO,
      which the company postponed in spring 2025 citing geopolitical and macro instability (Trump tariff
      disruption) and has not rescheduled. The company's declared IPO ambition was to raise at least €100
      million on a Belgian or European exchange. Monthly burn rate, cash on hand post-December 2025
      round, and working capital requirements are all undisclosed, making a precise runway calculation
      impossible; the presence of a manufacturing facility and 1,000+ employees implies material fixed-cost
      obligations.
    claimRefs: [CI027, CI028, CI029, CI030, CI031, CI032, CI033, CI034, CI035]
    tableRefs: [TI005]
    figureRefs: [FI004]

  - id: financial-verdict-and-gaps
    title: Financial Verdict and Diligence Gaps
    body: >
      I-care's financial picture is that of a well-run, high-growth industrial technology company in an
      intentional investment phase. Revenue of €74 million in 2024 growing to $116 million by late 2025
      is commercially credible given sensor base expansion, the SDT acquisition, and WaaS model rollout.
      The €8.2 million net loss on €74 million revenue (approximately 11% net margin) is consistent with
      a company spending heavily on R&D, manufacturing scale-up, international expansion, and M&A
      integration—not with a company in financial distress per se, though it does create capital dependency.

      Revenue quality is mixed: the WaaS subscription component promises high-quality recurring revenue,
      but the mix between subscription, one-time hardware, and time-and-materials services is undisclosed.
      Investors underwriting the 2026 external raise need to verify (a) gross margin by segment, (b)
      WaaS conversion rate and churn, (c) services EBITDA margin, (d) net working capital and inventory
      turns given hardware manufacturing, and (e) the terms and covenants of any debt or credit facilities
      taken out since the 2022 Series C.

      The primary financial risk is capital timing: the company acknowledged an expected cash shortfall by
      late 2025/early 2026, the Phase 2 external raise has not been announced as closed, and the IPO that
      was intended to generate at least €100 million remains indefinitely postponed. If the 2026 external
      raise is delayed or comes in below expectations, the company may need to further tap existing
      shareholders or take on debt at a time when valuations for growth-stage industrial-tech companies
      remain compressed by macro conditions.
    claimRefs: [CI036, CI037, CI038, CI039, CI040]
    tableRefs: [TI006]

