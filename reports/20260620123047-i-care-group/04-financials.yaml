callouts:
  - calloutType: risk
    title: Sustained Losses and Capital Dependency
    body: >
      I-care has been loss-making through at least FY2024 (€8.2M net loss), and a cash shortfall was
      anticipated as early as mid-2025 before the December insider round. The Phase 2 external raise
      and eventual IPO are not yet secured. If either is delayed, the company may need to further tap
      existing shareholders or accept debt at a time when valuations for growth-stage industrial-tech
      are compressed. Investors should stress-test the sufficiency of the 2026 raise and demand a
      detailed cash flow forecast before committing.
    claimRefs: [CI031, CI032, CI033, CI034, CI038]

  - calloutType: strength
    title: Order Book and Revenue Momentum
    body: >
      The $232 million+ order book as of December 2025 represents approximately 2× annualised revenue,
      providing meaningful near-term revenue visibility. The 40–50% implied 2025 revenue growth—
      accelerating from the 15% recorded in 2024—demonstrates that the sensor platform and WaaS model
      are gaining commercial traction beyond what the loss-making bottom line might suggest.
    claimRefs: [CI013, CI014, CI015]

  - calloutType: recommendation
    title: Pre-Investment Financial Diligence Priorities
    body: >
      Before the 2026 external raise closes, investors should require: (1) audited consolidated group
      accounts for FY2024 and FY2025; (2) gross margin by segment (hardware, software, services);
      (3) WaaS ARR and net revenue retention by cohort; (4) a 24-month cash flow forecast; and
      (5) confirmation of all debt and credit facility terms. None of these are currently accessible
      from public sources.
    claimRefs: [CI036, CI037, CI038, CI039, CI040]

