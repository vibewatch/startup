callouts:
  - calloutType: risk
    title: Capital Risk Is the Central Thesis-Level Threat
    body: >
      I-care's €1 billion unicorn valuation was set by an insider-only round with no arms-length price
      discovery. The investment thesis depends on a successful 2026 external-investor raise and an eventual
      IPO — both of which require capital-markets conditions that have already caused one deferral (spring
      2025). A second deferral would leave investors with illiquid equity valued at an insider mark. No
      external capital commitment, investment bank mandate, or listing venue has been publicly announced as
      of June 2026. This is the highest-urgency diligence gap in the chapter.
    claimRefs: [CR003, CR005, CR006]

  - calloutType: risk
    title: Key Person Dependency Is Structurally Unmitigated
    body: >
      Fabrice Brion simultaneously holds CEO, Board Chairman, VP R&D, and SDT International Board Chairman
      roles. In 2026 he is the primary decision-maker for an external fundraise, IPO preparation, SDT
      integration, and sensor manufacturing ramp simultaneously. No succession plan or delegation protocol
      has been publicly disclosed. This is a thesis-level risk that cannot be resolved from public sources
      and must be addressed in diligence.
    claimRefs: [CR036, CR037, CR043]

  - calloutType: insight
    title: Adverse Signal — IPO Deferral Confirms Macro and Capital Sensitivity
    body: >
      The spring 2025 IPO deferral, explicitly attributed to US tariff-driven market volatility, confirms
      that I-care's capital-markets timeline is macro-sensitive and management-controlled rather than
      externally committed. The three-phase capital plan (insider round → external raise → IPO) is entirely
      sequential and dependent on market conditions outside the company's control. Investors entering at
      the current valuation should price the probability of a further deferral or a down-round reset into
      their return model.
    claimRefs: [CR001, CR003, CR006, CR009]

