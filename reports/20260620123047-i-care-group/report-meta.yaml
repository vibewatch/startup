companyProfile:
  summary: >
    I-care Group is a Belgian technology company that has spent two decades building the world's first
    fully integrated end-to-end predictive maintenance (PdM) platform. Founded in 2004 in Mons by engineers
    Fabrice Brion and Arnaud Stiévenart, I-care combines three proprietary layers: Wi-care™ wireless IoT
    vibration sensors (ATEX-certified, manufactured in-house at up to 2,000 units per day), the I-see™ AI
    analytics platform (monitoring 150,000+ endpoints with failure predictions months in advance), and
    600+ on-site field engineers delivering expert reliability services across 36 offices in 16 countries.
    This hardware-software-services stack serves more than 2,000 industrial customers—including BASF,
    Barry Callebaut, ADM, Syngenta, and Neste—across chemicals, food and beverage, energy, oil and gas,
    and marine verticals. Revenue exceeded $116 million by December 2025 on a 15–40% growth trajectory,
    backed by an order book of more than $232 million. In December 2025 I-care achieved unicorn status
    at a €1 billion post-money valuation after a $23.2 million insider refinancing round. A 2026 external
    capital raise and subsequent IPO are the next strategic milestones, though the IPO was already
    postponed from spring 2025 citing geopolitical market conditions. The company remains loss-making
    (€8.2 million net loss on €74 million revenue in FY2024) while investing heavily in sensor
    manufacturing scale, AI R&D, and international expansion.
  foundedDate: "2004-01-01"
  founders:
    - name: Fabrice Brion
      role: Co-founder, Chairman of the Board, CEO, VP R&D
      background: >
        Engineer who conceived the predictive maintenance concept during his engineering studies; has led
        I-care from inception through its unicorn milestone and holds four concurrent senior executive roles.
      claimRefs: [CO007]
    - name: Arnaud Stiévenart
      role: Co-founder, Member of the Board of Directors
      background: >
        Co-architect of I-care's long-term strategy with more than 20 years in predictive maintenance;
        co-founder since 2004.
      claimRefs: [CO008]
  foundingLocation: Mons, Belgium
  headquarters: Mons, Belgium
  productSummary: >
    Wi-care™ wireless IoT vibration and temperature sensors (ATEX Zone 1/2 certified, produced at up to
    2,000 units per day); I-see™ AI-driven analytics platform integrating vibration, ultrasound,
    infrared thermography, oil/grease analysis and other PdM techniques with open API connectors to CMMS
    systems; Wi-care as a Service (WaaS) subscription bundles; and on-site expert field engineering and
    reliability consulting services. The March 2025 acquisition of SDT International added world-leading
    ultrasound PdM instrumentation to the portfolio.
  customerFocus: >
    Plant-level reliability engineers and maintenance managers at large and mid-size industrial operators
    in chemicals, food and beverage, oil and gas, energy (wind, nuclear), marine, mining, automotive, and
    building materials—primarily in EMEA, North America, and Asia-Pacific.
  businessModel: >
    Revenues from three streams: (1) point-in-time hardware sales of Wi-care™ sensors and SDT ultrasound
    instruments; (2) ratable I-see™ software subscriptions and WaaS per-endpoint recurring fees;
    (3) time-and-materials or fixed-fee expert field service contracts. The company targets migration of
    ~90% of monitored assets to the WaaS subscription model within five years of the 2022 Series C.
  stage: pre-IPO unicorn (private)
  fundingStatus: >
    Four financing rounds raising approximately $85 million total: bootstrapped (2004), early IMBC seed
    (~2007), Series B $5.5 million (Jan 2017, IMBC and SRIW/Wallonie Entreprendre), "Eau Rouge" Series C
    $50 million (Sep 2022, led by Finasucre and CPH Bank), plus $10 million employee round and
    $23.2 million insider refinancing round (Dec 2025). Phase 2 external raise planned for 2026; IPO
    targeted thereafter.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO030, CO033, CO039, CI011, CI013, CV011]
summary:
  headline: >
    I-care Group is a credible global PdM leader with proven technology, strong revenue momentum, and
    a $232M+ order book—but the insider-only unicorn valuation, ongoing losses, deferred IPO, and opaque
    revenue mix justify a "track" stance until the Phase 2 external raise provides independent price
    discovery and WaaS transition progress is quantified.
