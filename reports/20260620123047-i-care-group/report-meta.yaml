  topStrengths:
    - >
      End-to-end hardware-AI-services stack (Wi-care™ sensors, I-see™ platform, 600+ field engineers)
      creates deep switching costs and a competitive moat that pure-software or pure-hardware rivals
      cannot easily replicate.
    - >
      Demonstrated revenue momentum from €74M FY2024 (+15% YoY) to $116M+ by December 2025 (~40–50%
      acceleration), underpinned by a $232M+ order book providing 18–24 months of forward visibility.
    - >
      ATEX Zone 1/2 hardware certification for explosive-atmosphere environments is a genuine moat that
      eliminates many software-only competitors from safety-critical oil, gas, and chemical facilities.
    - >
      Large proprietary PdM dataset (150,000+ monitored endpoints) and eight strategic acquisitions give
      I-see's AI models a training-data advantage vs. newer market entrants.
    - >
      Co-founder-led with 72% equity control and a blue-chip industrial customer roster including BASF,
      ADM, Barry Callebaut, and Syngenta demonstrating authentic product-market fit.
  topRisks:
    - >
      The December 2025 €1B unicorn valuation was set by an insider-only round with no external price
      discovery; the Phase 2 external raise remains unannounced and the IPO has already been deferred
      once, creating fair-value uncertainty and potential forced-dilution risk if capital markets remain
      adverse.
    - >
      Company is structurally loss-making (€8.2M net loss on €74M revenue in FY2024) with undisclosed
      EBITDA, gross margin, and WaaS penetration rate; the hardware-to-SaaS transition creates a
      conversion-period cash trap that is difficult to model without disclosed revenue-mix data.
    - >
      Key-person risk is acute: Fabrice Brion holds four concurrent senior roles (CEO, Chairman, VP R&D,
      SDT Chairman) with no disclosed succession plan, creating a single point of failure for a company
      in pre-IPO mode with five concurrent strategic workstreams.
    - >
      Augury ($180M raised, Verdantix 2025 Green Quadrant Leader) and OEM incumbents (SKF G-Tech
      acquisition Mar 2026, Siemens Senseye) are intensifying competitive pressure with deeper capital
      and broader distribution.
    - >
      Single-facility Belgium sensor manufacturing creates geographic concentration risk; EU AI Act
      high-risk classification obligations (applicable Aug 2026) and NIS2 compliance status are
      unconfirmed in public disclosures.
  unresolvedGaps:
    - >
      Revenue-mix split (hardware vs. WaaS/software subscription vs. field services) and WaaS
      penetration rate as of 2025 have never been publicly disclosed, making it impossible to assign
      an appropriate EV/Revenue comparable set.
    - >
      Phase 2 external capital raise status: no investor announcement or term sheet disclosed as of
      June 2026, despite the 2026 target; delay materially affects IPO readiness and valuation floor.
    - >
      FY2025 audited financials (revenue, EBITDA, gross margin, free cash flow, debt load) are not
      publicly available; the only disclosed financials are FY2024 figures cited in Belga News without
      an audited filing.
    - >
      SDT International acquisition financials (purchase price, revenue contribution, goodwill, and
      integration timeline) have not been disclosed, making M&A integration risk unquantifiable.
    - >
      I-see platform EU AI Act conformity assessment status, NIS2 CCB registration, and product
      liability insurance terms are unconfirmed in public records.
