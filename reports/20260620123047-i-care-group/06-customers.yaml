company:
  name: I-care Group

chapter:
  number: 6
  title: Customers
  summary: >
    I-care's customer base spans 2,000+ "blue chip" industrial operators across 55+ countries
    and 14 verticals, anchored by food & beverage (Barry Callebaut, Lutosa, Royal Cosun, Plukon,
    and a 120,000-employee unnamed global leader) and chemical/agri (BASF, Syngenta, ADM), with
    oil & gas, marine, mining, and wind energy rounding out public proof. Documented expansion
    patterns—single site to 60+ locations, critical assets to 20+ North American plants—confirm a
    land-and-expand motion, but no NRR, GRR, or churn data is publicly disclosed and customer
    concentration in the anonymous accounts (global food leader, oil & gas major) is not quantified.

sections:
  - id: customer-base-and-segmentation
    title: Customer Base Overview and Vertical Segmentation
    body: >
      I-care serves a broad industrial base spanning chemicals, pharmaceuticals, food and beverage,
      energy (wind, nuclear), marine and offshore, mining and extraction, oil and gas, automotive,
      building materials, pulp and paper, and steel. As of September 2022, the company monitored
      the industrial equipment of more than 2,000 "blue chip" customers with combined asset value
      of approximately $70 billion. By December 2025, the Silicon Valley InvestClub enhanced
      profile cited 300,000+ machines monitored globally, up from 150,000 sensor endpoints
      referenced at the time of the unicorn announcement.

      The buyer profile is predominantly plant-level reliability engineers and maintenance managers
      who initiate contact, with C-suite sponsorship required for enterprise-wide rollouts.
      I-care's "think global, act local" delivery model—hiring in-country teams in EMEA, the
      Americas, West Africa, and APAC—reduces friction for multi-site global accounts and competes
      on service continuity against fly-in-expert rivals. Revenue is generated through three
      channels: direct hardware sales (Wi-care sensors), software subscriptions (I-see platform),
      and field service contracts; the company targets migration of 90%+ of monitored assets to
      a Wi-care as a Service subscription model. Public case studies are heavily concentrated in
      European food and chemical verticals, with limited documented proof in cement, paper, water,
      and pure-play power-generation sectors, creating diligence gaps for investors assessing
      vertical diversification.
    claimRefs: [CU001, CU002, CU003, CU004, CU024, CU029, CU038]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: named-customer-proof
    title: Named Customer Proof and Case Study Evidence
    body: >
      I-care's publicly available success stories cover ten named customers and two anonymized
      large-enterprise deployments, providing concrete production-level evidence across seven
      verticals. BASF (chemical, 111,000 employees, $87B revenue) deployed I-care's wireless
      vibration monitoring across multiple European plants after a competitive market survey of
      multiple vendors; I-care was already embedded as a handheld-measurement provider before
      expanding to wireless, illustrating the land-and-expand dynamic. Barry Callebaut (Louviers,
      France) deployed Wi-care sensors and established a lubrication plan for 320 previously
      unmonitored machines. Royal Cosun rolled I-care out across six subsidiaries for compressed
      air leak detection and electrical cabinet thermography. ADM (Archer-Daniels-Midland) awarded
      I-care its Supplier Excellence Award for Safety after a competitive RFP covering services,
      hardware, software, and global support.

      The two largest anonymized deployments—a global food manufacturer with 120,000 employees and
      250+ production sites, and an oil and gas major with 20+ North American production sites—are
      the most commercially significant evidence of enterprise-scale retention. Both transitioned
      from initial critical-asset pilots to company-wide framework agreements, with the food
      manufacturer generating €3.75 million in savings in 2024 through I-care's cross-site
      benchmarking. Documented ROI in technical case studies ranges from $180,000 (wind turbine
      bearing, 2 MW turbine) to $504,000 (slow-speed rolling mill) to $561,000–$1,120,000
      (Australian gold mine regrind mill). These figures are company-published; independent
      audits are unavailable. Notably, in the Australian mining case, two independent service
      providers had failed to detect the same defect that I-care's system flagged within one week.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU011, CU012, CU013, CU014, CU015,
                CU016, CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU028, CU037]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: adoption-trajectory
    title: Adoption Trajectory and Deployment Scale
    body: >
      I-care's sensor deployment has grown from approximately 50,000 Wi-care sensors at the
      time of the 2022 Series C to 150,000+ sensor endpoints cited in December 2025 announcements,
      with the Silicon Valley InvestClub enhanced profile recording 300,000+ machines monitored
      by early 2026. The company produces up to 2,000 sensors per day from its Belgium Industry
      4.0 facility. The global food leader deployment captures the clearest adoption trajectory:
      a 2017 framework agreement at one European pilot site expanded over nine years to
      approximately 60 global locations covering 21,000+ machines, with 15,000 sensors deployed
      in 2025 and 25,000 targeted by late 2026.

      I-care's service delivery operates across three modes—fully outsourced, co-managed, and
      advisory—which allow the company to address customers at different levels of internal
      maintenance maturity. The Wi-care as a Service subscription model, launched more recently,
      converts the initial hardware cost from capital expenditure to operating expenditure,
      lowering the financial barrier to initial deployment. Customer onboarding typically begins
      with critical rotating assets (compressors, pumps, bearings) before expanding to less
      critical machinery; the MVP One CMMS integration (documented in both the oil & gas major
      and the global food leader deployments) enables work-order automation once the platform is
      embedded, raising switching costs.
    claimRefs: [CU024, CU025, CU026, CU029, CU036, CU039]
    tableRefs: [TU002, TU006]
    figureRefs: [FU002]

  - id: retention-and-durability
    title: Retention and Durability Evidence
    body: >
      I-care has disclosed no NRR, GRR, cohort retention, or churn metrics as of June 2026.
      Durability evidence is therefore indirect, drawn from multi-year named deployments and
      qualitative relationship descriptors. BASF expanded from handheld services to wireless
      monitoring over multiple years. Royal Cosun expanded from a two-subsidiary pilot to all
      six subsidiaries. The global food leader has maintained and expanded an I-care relationship
      since 2017—a nine-year tenure. The oil and gas major described I-care as "indispensable"
      and consolidated 20+ North American sites under a single program.

      Qualitative retention signals suggest high stickiness: CMMS integration (MVP One) and
      continuous sensor data create operational dependency; in-country team placement builds
      site-level relationships; and multi-technique service bundling (vibration, lubrication,
      thermography) deepens the account footprint. However, absent quantified retention data,
      the durability thesis cannot be numerically stress-tested. I-care's financial profile—
      €8.2 million net operating loss in 2024—adds a service-continuity risk layer: customers
      in long-duration programs depend on I-care's organizational stability, which requires
      the planned 2026 external capital raise to succeed.
    claimRefs: [CU026, CU028, CU030, CU031, CU032, CU033, CU034, CU036]
    tableRefs: [TU004]

  - id: expansion-and-concentration-risk
    title: Expansion Patterns and Concentration Risk
    body: >
      I-care's land-and-expand model is well-documented: the company consistently starts with
      a subset of critical assets, demonstrates measurable ROI, and then wins broader site and
      multi-site contracts. Expansion is both horizontal (more sites) and vertical (more
      services per site). The pattern is consistent across BASF (France handheld → multi-site
      wireless), the oil & gas major (one Texas plant → 20+ North American sites), and the
      global food leader (one European site → 60+ global locations). The common enabler is
      I-care's standardized I-see platform, which aggregates cross-site data and enables
      corporate-level benchmarking—a capability that creates pull from corporate reliability
      leaders even after site-level proof is established.

      Concentration risk is a material diligence concern. The two anonymous mega-accounts
      (global food leader, oil & gas major) are individually large enough to represent material
      revenue concentration, but neither customer's revenue contribution is disclosed. Finasucre—
      I-care's lead Series C investor and a board-represented shareholder—is also an I-care
      customer, creating a structural conflict of interest. Channel dependence is limited:
      I-care sells primarily direct, with no disclosed reseller or distributor network that
      would represent a concentration of its own. Procurement friction is high (enterprise RFPs,
      IT integration requirements, ATEX certification needs in some sites) and is both a moat
      and a barrier to rapid new-customer acquisition.
    claimRefs: [CU015, CU016, CU026, CU028, CU032, CU036, CU040]
    tableRefs: [TU005]

  - id: adverse-signals-and-gaps
    title: Adverse Signals and Diligence Gaps
    body: >
      Key diligence gaps limit the conviction that can be placed on the customer chapter.
      No NRR, GRR, or churn data has been disclosed; retention is inferred from case study
      anecdotes rather than cohort analytics. The two largest deployments are anonymous,
      preventing independent verification of scale and commercial terms. Case study ROI
      figures are company-published and unaudited; third-party corroboration of the claimed
      35-45% maintenance cost reductions and 10-20% downtime reductions is absent. Public
      customer proof in cement, metals, pulp and paper, and water utility verticals is
      minimal despite I-care's marketing claim of serving "any industry."

      I-care's €8.2 million net operating loss in 2024 and the IPO postponement in April
      2025 create service-continuity risk for long-duration customer programs. The Finasucre
      investor-customer conflict is unresolved. Service quality consistency across 600+
      engineers in 36 offices is not independently audited, and no standard customer
      satisfaction score (NPS, CSAT) has been disclosed. The AI model internals underpinning
      I-see failure predictions are not published, creating a black-box dependency for customers
      who wish to audit or validate prediction quality.
    claimRefs: [CU030, CU031, CU032, CU033, CU034, CU035, CU037]

callouts:
  - calloutType: strength
    title: Documented Land-and-Expand Motion Across Verticals
    body: >
      At least three major deployments (BASF, oil & gas major, global food leader) follow an
      identical land-and-expand trajectory: critical-asset pilot → proof of ROI → multi-site
      framework agreement → additional services. The CMMS integrations (MVP One) embedded in
      the largest accounts raise switching costs materially.
    claimRefs: [CU036, CU026, CU028]

  - calloutType: risk
    title: No Retention Metrics and Anonymous Mega-Accounts
    body: >
      I-care discloses no NRR, GRR, or churn rates. The two largest documented deployments
      are anonymous, preventing independent verification of commercial scale. Customer
      concentration risk is unquantifiable with public data. Finasucre's dual role as lead
      investor and customer is a structural conflict requiring diligence.
    claimRefs: [CU030, CU032, CU034, CU035]

  - calloutType: insight
    title: Service-Embedded Stickiness vs. AI-Opacity Trade-off
    body: >
      I-care's in-country staffing model and multi-technique bundling create deep site-level
      relationships that should generate high retention, but the opaque I-see AI models give
      sophisticated customers limited visibility into the basis for predictions—a risk as AI
      accountability expectations rise in regulated industries.
    claimRefs: [CU024, CU037]

