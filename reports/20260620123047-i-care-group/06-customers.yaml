figures:
  - id: FU001
    title: I-care Customer Reliability Journey Map
    type: journey-map
    layout: wide
    summary: >
      Five-stage customer reliability journey from initial contact to multi-site anchor
      account, showing I-care's land-and-expand path across food, chemical, oil & gas,
      marine, and mining verticals.
    data:
      items:
        - label: "Stage 1 — Discovery / RFP"
          description: "Customer identifies reliability gap; runs vendor RFP (BASF tested 20+ systems; ADM ran global RFP); I-care wins on sensor accuracy, response time, and service network"
        - label: "Stage 2 — Critical Asset Pilot"
          description: "Initial sensors on highest-risk rotating assets (compressors, pumps, mill bearings); I-see monitoring live; first ROI case built within weeks of deployment"
        - label: "Stage 3 — Production Validation"
          description: "Early detections convert skeptics; CMMS integration initiated (MVP One, DimoMaint); lubrication program designed; multi-technique expansion begins"
        - label: "Stage 4 — Multi-site Framework"
          description: "Corporate reliability leader mandates rollout; Wi-care sensor subscription scales across sites; in-country I-care teams embedded; benchmarking dashboard live"
        - label: "Stage 5 — Anchor Partnership"
          description: "Additional services layered (thermography, lubrication, ultrasound post-SDT acquisition); long-term framework renewed; WaaS conversion pursued; ADM Safety Award"
    approximationNotes: >
      Stage descriptions based on case study evidence patterns; not all customers follow
      identical stage sequence. Mining and pharma segments are based on limited case evidence.
    claimRefs: [CU005, CU024, CU036, CU038]

  - id: FU002
    title: I-care Adoption and Deployment Funnel
    type: funnel
    layout: standard
    summary: >
      Seven-stage funnel from initial industry contact to multi-site anchor account,
      based on documented customer journey patterns across named case studies.
    data:
      items:
        - label: "Industrial operator identifies reliability / downtime problem"
          value: 100
          description: "Triggered by unplanned failure events, insurance pressure (Plukon), or digital transformation mandate (BASF)"
        - label: "Vendor evaluation (RFP / competitive analysis)"
          value: 55
          description: "BASF tested multiple systems; ADM ran multi-continent global RFP; I-care competes on sensor accuracy and service network"
        - label: "Pilot on critical rotating assets (3–6 months)"
          value: 30
          description: "Compressors, pumps, mill bearings; early detections build ROI case; average win timeline not disclosed"
        - label: "Single-site production deployment"
          value: 18
          description: "Wi-care sensors + I-see live; CMMS integration begun; reliability engineer engaged as champion"
        - label: "ROI validated; site-level expansion to non-critical assets"
          value: 10
          description: "$180K–$1.12M documented savings per site; maintenance team converts from reactive to planned mode"
        - label: "Multi-site framework agreement signed"
          value: 5
          description: "Corporate mandate; global food leader reached 60 sites; oil & gas major 20+ NA sites; WaaS subscription offered"
        - label: "Anchor account (multi-year, multi-service, multi-continent)"
          value: 2
          description: "CMMS integration locks workflows; in-country teams embedded; additional services (lubrication, thermography, SDT ultrasound) layered"
    approximationNotes: >
      Funnel stage values are illustrative relative ratios inferred from documented conversion
      patterns; no win rate or stage conversion data has been disclosed by I-care. Figure is
      structural, showing a qualitative funnel, not a quantified sales pipeline.
    claimRefs: [CU006, CU026, CU028, CU036]

