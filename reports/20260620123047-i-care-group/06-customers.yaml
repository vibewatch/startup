  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-metrics
      missingEvidence: >
        NRR, GRR, cohort retention rate, and churn metrics by deployment mode and vintage cohort.
      whyItMatters: >
        Without quantified retention data, the durability of I-care's revenue base cannot
        be assessed; customer count alone does not establish whether the base is growing,
        stable, or churning.
      diligencePath: >
        Request NRR and GRR by cohort year from management data room; ask for customer count
        by cohort (year 1/2/3/4+ retention); segment by contract type (WaaS vs. managed service).
      relatedQuestionRefs: [QU003]

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >
        Revenue contribution by customer for top 5 accounts; identity of the global food
        leader and oil & gas major to enable independent verification; ACV by deployment
        mode (WaaS vs. managed service vs. advisory); competitive win rate vs. SKF, Augury,
        and Emerson.
      whyItMatters: >
        If the top 2 anonymous accounts represent 20%+ of revenue, customer concentration
        risk is material and largely hidden from public analysis. Average contract value
        and win rate determine unit economics and competitive moat strength.
      diligencePath: >
        Request top-10 customer revenue contribution as percentage of total; request customer
        names under NDA for reference checks; assess contract terms and renewal risk;
        ask management for ACV by tier and win/loss ratio in competitive deals.
      relatedQuestionRefs: [QU009, QU010, QU020]

    - type: missing-source
      severity: material
      topic: ROI-verification
