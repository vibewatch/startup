    title: I-care Product Architecture Stack
    type: stack
    layout: wide
    summary: >
      Seven-layer vertically integrated stack from proprietary IoT sensors to expert field services, illustrating
      I-care's end-to-end ownership model and key component dependencies.
    data:
      layers:
        - label: 'Layer 1: Hardware Sensing'
          modules:
            - >-
              Wi-care™ tri-axial vibration + temperature sensors (ATEX Zone 1/2 certified; Wi-care 130 G23 flagship;
              Wi-care Pure simplified variant)
            - >-
              SDT ultrasound instruments (SDT340, SDT270, SDT200, LUBExpert, CHECKER range, Vigilant permanent
              monitoring, CRYSOUND)
        - label: 'Layer 2: Connectivity'
          modules:
            - Wireless IoT gateways using native IoT protocol
            - Customer network (WiFi / cellular / wired fallback)
        - label: 'Layer 3: Data Storage'
          modules:
            - I-see™ proprietary noSQL cloud database
            - Real-time high-volume data ingestion pipeline (millions of data points/day)
        - label: 'Layer 4: AI / ML Analytics'
          modules:
            - ML failure prediction models (trained on 150,000+ sensor endpoints)
            - Three-state AI data categorization (healthy / potential issue / critical alarm)
            - Automated sensor infrastructure health monitoring (battery, fault, gateway)
        - label: 'Layer 5: Application / UX'
          modules:
            - I-see™ web dashboard with asset/plant/global hierarchy view
            - I-see™ mobile app (real-time alerts, savings tracking, instant notifications)
        - label: 'Layer 6: Integration'
