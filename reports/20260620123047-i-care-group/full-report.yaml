  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >
              Predictive maintenance (PdM) is a condition-based maintenance strategy that uses real-time sensor data,
              IoT devices, and data analytics to forecast equipment failures before they occur. The market boundary is
              critical to sizing: a narrow definition covers only condition monitoring hardware (vibration sensors,
              thermography cameras, ultrasound instruments) applied to rotating machinery; a broad definition includes
              the AI analytics software, IIoT connectivity layers, field services, and reliability consulting that
              complete the end-to-end delivery stack. I-care Group's addressable market spans the widest boundary,
              combining proprietary wireless sensors (Wi-care™), the I-see™ AI platform, and 600+ field engineers.


              The included spend for I-care's total addressable market comprises: (1) wireless and wired vibration
              sensors for rotating machinery; (2) ultrasound condition monitoring instruments and software; (3)
              AI-driven analytics platforms that process sensor streams for anomaly detection and failure prediction;
              (4) reliability engineering services including route-based inspections, lubrication analysis, and
              thermographic surveys; and (5) oil and lubricant analysis services. Excluded spend includes: corrective
              and reactive maintenance (repair after failure), time-based preventive maintenance without sensor
              intelligence, general CMMS software for work-order management ($1.5–2.7B market, tracked separately), and
              broader IIoT platform layers that enable connectivity but are not maintenance-specific.


              Status-quo substitutes are the dominant competitive reality in most plants. These include: (1) periodic
              manual inspections by maintenance technicians with handheld vibration meters on a weekly or monthly
              schedule; (2) time-based preventive maintenance governed by OEM service intervals regardless of actual
              machine condition; and (3) run-to-failure strategies for non-critical assets. Each substitute has lower
              upfront cost but higher lifecycle risk and labor intensity. The PdM market's penetration opportunity is
              bounded by how many asset owners can be converted from these incumbent approaches.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM032
              - CM033
          - type: table
            tableRef: TM001
