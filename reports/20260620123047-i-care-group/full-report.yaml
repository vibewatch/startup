      - number: '4.3'
        title: Unit Economics and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              I-care does not publish list pricing for Wi-care sensors, the I-see platform, or WaaS bundles. The
              company's marketing positions WaaS as delivering "financial predictability and control" by converting
              irregular capex into predictable operating expenditure for the customer. No per-unit pricing or average
              revenue per sensor has been disclosed in any public filing or press release.

              Proxy benchmarks from the industrial IoT maintenance sector suggest typical per-endpoint annual
              subscription fees in the €300–€1,500 range for hardware-inclusive monitoring services, depending on asset
              criticality, sensor density, and services scope. At the December 2025 baseline of 150,000+ monitored
              sensors and $116 million in revenue, the implied average revenue per sensor endpoint is roughly $770 per
              year if all revenue were attributable to the sensor install base—which overstates the per-sensor figure
              because a substantial portion of revenue is services not directly tied to sensor counts. This is a rough
              directional estimate only; actual unit economics (hardware COGS, software gross margin, services margin)
              are all private.

              The 2022 Series C press release cited aspirations to multiply revenues and normalised EBITDA margin by 5×
              within five years. At the 2022 revenue base (implied circa €35–40 million based on subsequent 2024 actual
              of €74 million and 35%+ growth), the 5× EBITDA target implies reaching strongly positive adjusted EBITDA
              around 2027, consistent with the IPO timeline. The 2024 net loss of €8.2 million on €74 million revenue
              represents an approximate (11%) net margin—loss-making but not deeply so, suggesting gross margin is
              likely positive even if the bottom line is burdened by R&D, sales expansion, and manufacturing start-up
              costs. All margins are inferred; direct disclosure is absent.

              For field services, the company's value proposition to customers includes reduction of maintenance costs
              by 35–45% and machine downtime by 10–20%. These customer-level savings imply the ability to charge
              meaningful programme fees for reliability outcomes, supporting service-heavy revenue quality.
