      - number: '3.6'
        title: Adverse and Skeptical Evidence
        blocks:
          - type: paragraph
            body: >
              The skeptical case on I-care's competitive position rests on four compounding pressures. First, valuation
              vs. competitive reality: the December 2025 €1 billion post-money valuation at approximately $116 million
              revenue implies a revenue multiple above 8×, which is only sustainable if I-care can credibly demonstrate
              a path to durable market leadership. Augury's $180 million Series E (also at unicorn scale) was raised
              roughly three years earlier and Augury already has 170+ manufacturers and 40+ country presence—suggesting
              Augury is ahead on commercial scale even if narrower in capability breadth. Second, enterprise channel
              disadvantage: Augury's 20+ Fortune 500 customer count shows that large-company buyers prefer
              software-first solutions manageable through existing IT infrastructure, rather than integrated
              hardware-services stacks that require OT procurement and physical sensor deployment. This preference
              pattern—if it holds—implies I-care's strongest market may be mid-market industrial accounts rather than
              the largest multinationals. Third, OEM counter-moves are intensifying: SKF's G-Tech acquisition (March
              2026) and its Sferical AI partnership (April 2026) show SKF is investing urgently to close the digital
              gap, compressing I-care's window of differentiation against the most trusted name in rotating-equipment
              condition monitoring. Similarly, Siemens/Senseye combines enterprise software distribution with industrial
              AI credibility, and Emerson/AspenTech's integrated APM offering bundles predictive analytics into existing
              DCS relationships, creating bundling pressure that I-care's stand-alone proposition must overcome. Fourth,
              services intensity as a ceiling on margin: the 600+ engineer field force is simultaneously a moat and a
              structural cost constraint. As AI maturity increases industry-wide, customers will expect the services
              component to shrink rather than grow—meaning I-care must demonstrate it can migrate the value of those
              engineers into the AI platform itself rather than maintain the headcount indefinitely.
            claimRefs:
              - CP042
              - CP043
              - CP044
              - CP045
              - CP046
