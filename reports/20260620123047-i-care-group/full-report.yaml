      - number: '5.3'
        title: I-see™ AI Analytics Platform
        blocks:
          - type: paragraph
            body: >
              The I-see™ platform is a cloud-hosted, AI-enhanced analytics environment that ingests continuous sensor
              data from Wi-care endpoints and—since the SDT International acquisition— from ultrasound instruments.
              I-see stores data in a proprietary noSQL database and processes millions of data points per day. Its core
              AI pipeline performs three-state classification of each measurement sequence: healthy operation, potential
              issue, or critical alarm. Machine learning models trained on the company's dataset of 150,000+ monitored
              sensor endpoints underpin failure prediction logic; the company claims predictions months or even years in
              advance of failures.

              Beyond failure detection, I-see automates monitoring infrastructure management—checking battery status,
              sensor faults, and gateway connectivity to keep the edge layer reliable. AI-generated findings are
              compiled into structured reports that human reliability analysts review before recommendations are pushed
              to maintenance teams or fed into CMMS work orders via an open API. This human-in-the-loop step reflects a
              deliberate design choice, acknowledged in customer testimonials: sensors and AI accelerate decision
              support, but experienced engineers remain indispensable for interpreting ambiguous fault signatures. I-see
              also offers a mobile app providing real-time dashboards, instant push notifications, and savings tracking.
              The platform holds ISO 27001 certification for information security, though the cloud provider, data
              residency region, and sub-processor list are not publicly disclosed—a gap material for regulated-industry
              customers subject to data sovereignty rules.
            claimRefs:
              - CE011
