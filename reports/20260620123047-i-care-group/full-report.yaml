      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Proprietary Hardware Lock-In and ATEX Moat
            body: >
              Wi-care sensors are manufactured in-house at up to 2,000 units per day, ATEX-certified for explosive
              atmospheres, and feed a proprietary 150,000+ endpoint AI training dataset. This combination—hardware
              ownership, hazardous-area certification, and scale-driven data flywheel—is a genuine moat that
              pure-software competitors (Augury, Senseye) cannot replicate without major hardware investment.
            calloutType: strength
            claimRefs:
              - CE003
              - CE007
              - CE011
          - type: callout
            title: AI Opacity and Independent Verification Gap
            body: >
              I-care's core commercial promise—AI predicts failures months or years in advance—rests on ML models whose
              methodology, accuracy metrics, false-positive rates, and training data provenance are entirely
              undisclosed. No third-party benchmark or model card exists. For enterprise buyers in regulated industries,
              this opacity is a meaningful due-diligence blocker and represents the single largest unverifiable
              technical claim in the portfolio.
            calloutType: risk
            claimRefs:
              - CE036
              - CE040
          - type: callout
            title: SDT Integration Still Maturing—Two Software Tools Today
            body: >
              The March 2025 SDT International acquisition is strategically important but the UAS3-to-I-see software
              convergence is in progress with no public timeline. Until complete, customers using both modalities must
              operate two separate software platforms, reducing the "single platform" value proposition and creating
              integration risk if the convergence is slower or more complex than anticipated.
            calloutType: risk
            claimRefs:
              - CE009
              - CE039
          - type: callout
            title: Services Layer Is Both Moat and Ceiling
            body: >
              I-care's 600+ field engineers create service stickiness and multi-technique coverage that pure-software
              rivals cannot match. But this same labor intensity compresses operating margins and creates a structural
              ceiling on scalability. As AI matures, customers will push for fewer engineer-hours per monitored
              asset—meaning I-care's long-term margin expansion requires the AI layer to absorb diagnostic labor that
              currently falls to human experts.
            calloutType: insight
            claimRefs:
              - CE020
              - CE021
              - CE040
  - number: 6
