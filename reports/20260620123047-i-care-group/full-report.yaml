companyProfile:
  summary: >
    I-care Group is a Belgian technology company that has spent two decades building the world's first fully integrated
    end-to-end predictive maintenance (PdM) platform. Founded in 2004 in Mons by engineers Fabrice Brion and Arnaud
    Stiévenart, I-care combines three proprietary layers: Wi-care™ wireless IoT vibration sensors (ATEX-certified,
    manufactured in-house at up to 2,000 units per day), the I-see™ AI analytics platform (monitoring 150,000+ endpoints
    with failure predictions months in advance), and 600+ on-site field engineers delivering expert reliability services
    across 36 offices in 16 countries. This hardware-software-services stack serves more than 2,000 industrial
    customers—including BASF, Barry Callebaut, ADM, Syngenta, and Neste—across chemicals, food and beverage, energy, oil
    and gas, and marine verticals. Revenue exceeded $116 million by December 2025 on a 15–40% growth trajectory, backed
    by an order book of more than $232 million. In December 2025 I-care achieved unicorn status at a €1 billion
    post-money valuation after a $23.2 million insider refinancing round. A 2026 external capital raise and subsequent
    IPO are the next strategic milestones, though the IPO was already postponed from spring 2025 citing geopolitical
    market conditions. The company remains loss-making (€8.2 million net loss on €74 million revenue in FY2024) while
    investing heavily in sensor manufacturing scale, AI R&D, and international expansion.
  foundedDate: '2004-01-01'
  founders:
    - name: Fabrice Brion
      role: Co-founder, Chairman of the Board, CEO, VP R&D
      background: >
        Engineer who conceived the predictive maintenance concept during his engineering studies; has led I-care from
        inception through its unicorn milestone and holds four concurrent senior executive roles.
      claimRefs:
