  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >
              I-care operates a three-layer revenue model that integrates hardware, software, and services. The hardware
              layer consists of Wi-care™ proprietary IoT vibration sensors sold outright or deployed under the Wi-care
              as a Service (WaaS) subscription. The software layer is the I-see™ AI analytics platform, which aggregates
              sensor data and delivers failure predictions; it is offered as a SaaS licence alongside sensor
              deployments. The services layer—delivered by more than 600 field engineers—comprises predictive
              maintenance programmes, reliability engineering consulting, ultrasound inspections (via recently acquired
              SDT International), and training and certification through Technical Associates of Charlotte and Technical
              Associates of Europe.

              WaaS bundles all three layers into a single recurring subscription fee charged per monitored asset,
              replacing the historical pattern of one-time hardware sales followed by separate software and service
              contracts. I-care's stated ambition is for 90% of monitored assets to be covered under WaaS within five
              years of the 2022 Series C, implying the model is still mid-transition. The company's revenue recognition
              is therefore a mix of point-in-time hardware revenue, ratable software licences, and time-and-materials or
              fixed-fee services. The March 2025 acquisition of SDT International added ultrasound device hardware and
              related software revenue streams, funded entirely from existing equity rather than debt—a deliberate
              signal of financial discipline even as the group remained loss-making.

              Revenue quality in a hardware-plus-software model is meaningfully higher than pure hardware because
              recurring software and subscription revenues are more predictable and command higher valuation multiples.
              However, hardware manufacturing capex (the Industry 4.0 facility in Belgium now produces up to 2,000
              sensors per day) and field-service headcount costs keep gross margins structurally below pure-software
              benchmarks. Exact hardware versus software versus services revenue splits have not been disclosed, which
              is a significant diligence gap.
