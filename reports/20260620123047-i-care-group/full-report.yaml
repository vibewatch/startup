  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Financial and Capital Risk
        blocks:
          - type: paragraph
            body: >
              I-care Group is structurally loss-making at the operating level. In fiscal year 2024, the consolidated
              group reported revenue of €74 million and a net loss of €8.2 million, continuing an investment-phase
              trajectory evident since the 2022 Series C. By December 2025, management cited revenues exceeding $116
              million and an order book above $232 million — implying 40–50% annual revenue growth — yet no disclosure
              of EBITDA, gross margin, or free cash flow has accompanied these headline figures, rendering burn rate
              unverifiable. The December 2025 financing event was a $23.2 million insider-only "fundraising and
              refinancing" round reserved for existing shareholders and employees, not an external capital injection;
              the word "refinancing" signals possible debt restructuring alongside the valuation milestone.

              The company's capital plan calls for three sequential phases: (a) the December 2025 insider round
              (complete); (b) a 2026 external-investor raise targeting new shareholders; and (c) an eventual IPO,
              already deferred once from spring 2025 due to Trump-tariff-driven market volatility. No external investor
              announcement or term sheet has been publicly disclosed as of June 2026. The €1 billion unicorn valuation
              was set by an insider-only round with no arms-length price discovery, creating high fair-value
              uncertainty.

              The WaaS (Wi-care as a Service) subscription transition—targeting 90% of monitored assets on a
              per-endpoint subscription fee by circa 2027—creates a conversion-period cash trap: hardware margins
              diminish before SaaS recurring revenue accumulates. Revenue mix (hardware vs. software vs. services) and
              WaaS penetration rate are not publicly disclosed. FX mismatch is a structural exposure: Belgian employment
              and manufacturing costs are EUR-denominated while revenues include significant USD components; no hedging
              programme has been disclosed. Failure to close the 2026 external raise or price the IPO in an acceptable
              window risks forced dilutive recapitalization or strategic sale below the unicorn mark.
