      - number: '4.2'
        title: Historical Revenue Growth and Traction
        blocks:
          - type: paragraph
            body: >
              I-care has delivered consistent double-digit revenue growth since founding in 2004. The company reported
              approximately 35% average annual revenue growth over the 17 years through 2021 (according to founder
              statements at the 2020 EY Company of the Year award). In fiscal year 2024, the group reported consolidated
              revenue of €74 million, an increase of 15% versus 2023—a moderation from historical rates, consistent with
              a larger base and the absorption of acquisition integration costs. The 2024 net loss stood at €8.2
              million, indicating continued investment-phase losses rather than fundamental unit-level unprofitability,
              though granular margin data to confirm this assessment are not publicly available.

              By the December 2025 unicorn announcement, I-care reported consolidated annual revenues exceeding $116
              million (approximately €105–110 million at prevailing exchange rates), with management citing 25% growth
              in April 2025 alone. This implies 2025 full-year revenue growth of roughly 40-50% over 2024's €74 million
              base, driven by the SDT International acquisition, sensor volume ramp from the manufacturing facility, and
              WaaS subscription expansion. The order book at the same date exceeded $232 million (over €200 million),
              representing approximately 2× annualised revenue—a healthy multi-year demand signal that de-risks
              near-term revenue visibility.

              The I-care investors page publicly states percentage of recurring revenue but the numeric value is not
              rendered as an accessible figure; the company's narrative consistently highlights growing
              recurring-revenue contribution without providing a precise split. At the 2022 Series C, I-care monitored
