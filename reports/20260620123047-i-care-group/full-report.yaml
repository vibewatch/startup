  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Phase 2 external raise fails or prices below €700M
        - No close announced by Q4 2026 or close below €700M post-money
        - Signals lack of external investor conviction in €1B mark; forces dilutive insider recap or debt bridge
        - Downgrade to Track/Avoid; reassess valuation anchor
      - - Revenue growth decelerates below 15% YoY for two quarters
        - Q3 or Q4 2026 revenue growth <15% reported or credibly rumoured
        - Disrupts growth trajectory required to sustain 9–11× multiple; base case EV falls to €800M–1.2B
        - Seek data room access; verify WaaS conversion and churn; pause new investment
      - - WaaS penetration stalls below 30% of revenue by end-2027
        - No disclosure or credible proxy indicating WaaS >30% by year-end 2027
        - Hardware-heavy model anchors multiple at 4–6×; IPO at €1B+ becomes untenable
        - Move to Avoid; reunderwrite at 5× run-rate revenue for valuation floor
      - - IPO window remains closed through 2028 or IPO is formally withdrawn
        - No IPO announcement by Q1 2028 or company publicly withdraws IPO plans
        - Investor liquidity trapped; secondary only via strategic sale or PE recap at discount
        - Track only; flag liquidity risk; engage co-founders on strategic sale optionality
      - - 'Key-person departure: CEO Fabrice Brion exits or reduces role'
        - Formal announcement of Brion stepping down from CEO role
        - Founder-led culture and R&D vision at risk; investor confidence likely falls; IPO valuation premium erodes
        - Put on Hold; assess depth of executive bench before committing
      - - SDT International integration fails or generates material losses
        - Integration costs materially exceed $5M or SDT revenue declines >20% YoY post-acquisition
        - Goodwill impairment risk; margin drag on group; signals M&A execution weakness
        - Demand audited M&A integration report; reassess M&A strategy credibility
    notes: >
      Kill triggers are analytical constructs derived from the scenario analysis and the company's stated milestones.
      Probability of each trigger is not modelled quantitatively; materiality judgments are based on the sensitivity
      analysis in the scenario table. Monitoring requires access to company communications or an investor board seat.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Revenue composition by segment
        - WaaS ARR, hardware-only revenue, standalone software licences, services revenue — all undisclosed
        - Determines which EV/Revenue multiple range is justified; without this, €1B mark cannot be validated
        - Request management data room; audited financials by segment
      - - Gross margin by segment
        - Hardware gross margin, software gross margin, services gross margin — none disclosed
        - Critical for modelling EBITDA path and understanding unit economics; guides multiple selection
        - Request unaudited management accounts; benchmark against hardware COGS norms
      - - Phase 2 external raise status and terms
        - Investor identity, size, post-money valuation, close date — none disclosed as of June 2026
        - Validates or invalidates €1B unicorn mark; reveals whether institutional investors accept current pricing
        - Monitor public announcements; direct outreach to I-care investor relations
      - - Preference stack and liquidation waterfall
        - Anti-dilution provisions, liquidation preferences, pro-rata rights of Finasucre, CPH Bank, WE, IMBC, Amerigo
        - Determines common shareholder return in downside scenarios; critical for employee equity valuation
        - Request shareholder agreement; review Belgian company law for default preference rules
      - - 2025 audited consolidated financials
        - Full-year 2025 consolidated P&L, balance sheet, cash flow — not yet published as of June 2026
        - Would confirm the $116M revenue figure and net loss; enables gross margin and burn calculation
        - Request NBB filing when available; Belgian private companies file audited accounts annually
      - - WaaS conversion and churn metrics
        - WaaS ARR growth rate, annual churn rate, net revenue retention — none publicly disclosed
        - Core metric for subscription valuation methodology; high churn destroys the recurring-revenue thesis
        - Request cohort data in data room; cross-check against customer case studies for retention signals
    notes: >
      Diligence asks are ranked by materiality to valuation precision. Revenue composition and gross margin are blocking
      for any quantitative valuation model. Phase 2 raise status is the most time-sensitive item and should be tracked
      via press monitoring in real time.
    claimRefs:
      - CV043
      - CV044
      - CV045
