      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Contradictory Analyst Estimates'
        blocks:
          - type: paragraph
            body: >
              No single authoritative TAM figure exists for the PdM market—analyst estimates for 2025–2026 span from $9B
              to $19B, a 2×–2.5× range, driven primarily by scope differences rather than statistical disagreement.
              MarketsandMarkets (March 2026) places the PdM market at $13.89B in 2026, growing to $23.79B by 2031 at a
              11.4% CAGR—a conservative estimate because it applies stricter boundary controls on what qualifies as
              predictive versus preventive spend. Grand View Research (June 2025, via Wayback archive) reports a higher
              base of $14.2B in 2025 and $17.5B in 2026, projecting $98.1B by 2033 at a 27.9% CAGR. Mordor Intelligence
              estimates $14.09B in 2025, $18.9B in 2026, and $82.17B by 2031 at a 34.14% CAGR.


              The widest estimates—Allied Market Research ($10.1B in 2023, $162.1B by 2033) and Precedence Research
              ($9.21B in 2025, $11.70B in 2026, $94.27B by 2035)—appear to apply different base-year boundary
              assumptions, inflating long-range projections. These outlier estimates should be treated as indicative of
              the market's potential in an expansive scenario rather than as a reliable 5-year planning input. Within a
              consistent boundary, the $13–19B range for 2026 is the most defensible.


              For SAM and SOM purposes, the narrower machine condition monitoring sub-market offers a more precise lens.
              MarketsandMarkets sizes this at $3.1B in 2024 growing to $4.7B by 2029 at 8.3% CAGR—a far lower growth
              rate reflecting that hardware-centric offerings have matured. The asset performance management (APM)
              software market sits at $2.40B in 2026, growing to $4.32B by 2032 at 10.3% CAGR. I-care's SAM—rotating
              machinery PdM in energy, oil and gas, water, metals, and manufacturing across its 16-country footprint—is
              estimated at $2–4B, derived by applying a 20–30% penetration rate of I-care-relevant verticals within the
              condition monitoring sub-market. The SOM, bounded by current go-to-market coverage, customer capacity, and
              annual deal velocity, is estimated at $300–500M.
