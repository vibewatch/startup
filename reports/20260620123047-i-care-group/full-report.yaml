              Supplier Excellence Award for Safety after a competitive RFP covering services, hardware, software, and
              global support.

              The two largest anonymized deployments—a global food manufacturer with 120,000 employees and 250+
              production sites, and an oil and gas major with 20+ North American production sites—are the most
              commercially significant evidence of enterprise-scale retention. Both transitioned from initial
              critical-asset pilots to company-wide framework agreements, with the food manufacturer generating €3.75
