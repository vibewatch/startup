      - number: '4.4'
        title: Capital Structure and Adequacy
        blocks:
          - type: paragraph
            body: >
              I-care's capital history (detailed in the Company Overview chapter) culminated in a December 2025 insider
              round of $23.2 million/€20 million from existing shareholders (Wallonie Entreprendre, IMBC, Noshaq) and
              employees. This round served a dual purpose: it established the €1 billion post-money valuation (unicorn
              milestone) and, per the Belga reporting on the pre-announcement dual-raise discussion, partially
              refinanced the March 2025 acquisition of SDT International. The Belgian Crossroads Bank for Enterprises
              (BCE) records I-CARE HOLDING as holding capital of approximately €82.7 million, and CompanyWeb cites the
              2023 holding-entity equity at €69.2 million—both figures reflecting the holding entity alone, not the
              consolidated group.

              Prior to the December 2025 round, Belga reported (citing De Tijd) that the company was planning a two-part
              raise: approximately €10 million from existing shareholders to refinance the SDT acquisition, followed by
              a larger external round of "tens of millions of euros" from major international investment funds—the
              biggest in I-care's history. The timing of the full raise was targeted to cover an expected cash shortfall
              by late 2025 or early 2026, underscoring a real near-term capital need rather than purely opportunistic
              fundraising.

              Phase 2 of the company's stated three-phase capital plan—external investor raise in 2026—is the critical
              event for diligence. Its size, terms, and investor identity are unknown. Phase 3 is an IPO, which the
              company postponed in spring 2025 citing geopolitical and macro instability (Trump tariff disruption) and
              has not rescheduled. The company's declared IPO ambition was to raise at least €100 million on a Belgian
              or European exchange. Monthly burn rate, cash on hand post-December 2025 round, and working capital
              requirements are all undisclosed, making a precise runway calculation impossible; the presence of a
              manufacturing facility and 1,000+ employees implies material fixed-cost obligations.
