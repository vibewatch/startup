      - number: '7.4'
        title: Operational, Supply Chain, and Manufacturing Risk
        blocks:
          - type: paragraph
            body: >
              I-care's sensor manufacturing strategy — full vertical integration at a single Industry 4.0 facility in
              Belgium operated by I-care Electronics — is simultaneously a competitive differentiator and a geographic
              concentration risk. The facility produces up to 2,000 Wi-care sensors per day with no disclosed secondary
              site or contract manufacturer fallback. Fire, flood, labour dispute, regulatory shutdown, or prolonged
              power disruption at the Belgium facility could halt all new sensor production with no near-term
              alternative, converting backlog ($232 million order book) into deferred revenue risk within weeks. The
              Wi-care sensor bill of materials includes MEMS accelerometers, RF chipsets, and microcontrollers from
              undisclosed suppliers; specialty MEMS and IoT chipsets have extended global lead times, and a supply
              allocation cut could constrain sensor output for months absent a qualified secondary supplier. The
              European Chips Act (adopted September 2023) aims to reduce long-term EU semiconductor exposure but does
              not eliminate near-term procurement risk from non-EU foundries.

              The field-service layer — 600+ engineers at the 2022 Series C, 850+ by March 2025, and 1,000+ by December
              2025 — grew approximately 67% in three years. Rapid headcount growth in specialist technical roles risks
              quality consistency degradation and increases onboarding errors. I-care operates 36 offices across 16
              countries including West Africa and APAC, introducing cross-border employment law compliance complexity,
              geopolitical exposure, and workforce retention risk in markets where OEM incumbents (SKF, Emerson)
              actively compete for specialist talent. AI model failure risk — false negative (undetected impending
              failure) or false positive (spurious shutdown alert) — is elevated in ATEX environments where asset
              failures are catastrophic; no public disclosure of model accuracy metrics, false-negative rates, or
              escalation protocols was identified.
