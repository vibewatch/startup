      - number: '7.2'
        title: Competitive, AI, and Product Risk
        blocks:
          - type: paragraph
            body: >
              I-care's vertically integrated hardware-AI-services stack faces margin and market-share pressure from two
              converging forces. Pure-play AI vendors with deep capitalisation are accelerating: Augury raised $180
              million in a Series E and was named a Verdantix 2025 Green Quadrant Leader in Industrial AI Analytics
              Software, establishing it as I-care's most heavily funded direct competitor. Augury's software-only model
              enables faster deployment cycles, lower customer-acquisition cost, and higher gross margin than I-care's
              hardware-inclusive model. Meanwhile, OEM incumbents are counter-investing: SKF acquired G-Tech Instruments
              in March 2026 to deepen condition monitoring, announced an AI partnership with Sferical AI (April 2026),
              and leverages an unmatched installed bearing base. Siemens targets enterprise accounts through its Senseye
              acquisition and MindSphere distribution channel that dwarfs I-care's 36-office direct sales force.
              Verdantix estimates the industrial AI analytics software market at $3.2 billion in 2025 growing to $9.3
              billion by 2031 — a prize large enough to sustain large-scale OEM counter-investment. No I-care named
              customer has been publicly reported to have switched to a competitor as of the research date.

              AI model risk within the I-see platform is structural: ML model internals, training methodology,
              false-positive and false-negative rates, and model drift protocols are not publicly disclosed. A single
              high-profile failure-to-detect (missed failure) or spurious-alert (false positive causing unplanned
              shutdown) event at a marquee customer could materially damage brand equity and trigger churn cascades. The
              March 2025 SDT International acquisition introduced vibration–ultrasound joint-platform marketing;
              however, press materials describe the I-see unified platform as a forward roadmap rather than a completed
              integration, leaving near-term AI product delivery risk unresolved. The cloud hyperscaler hosting I-see is
              unnamed, raising data-sovereignty, uptime SLA, and negotiating-leverage questions that enterprise
              customers in regulated industries increasingly require transparency on.
