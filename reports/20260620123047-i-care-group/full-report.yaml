  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and Service Portfolio Definition
        blocks:
          - type: paragraph
            body: >
              I-care delivers industrial predictive maintenance through a vertically integrated stack with three
              commercial layers: (1) proprietary hardware—the Wi-care™ wireless IoT sensor family and, since March 2025,
              SDT International's ultrasound instrumentation; (2) the I-see™ cloud analytics platform, which applies AI
              to sensor data and pushes actionable alerts into customer workflows; and (3) expert services, in which
              600+ field engineers perform physical inspections, route-based vibration routes, and reliability
              consulting. A fourth commercial package, "PdM as a Service," bundles all three into a single subscription,
              shifting the purchase from capital expenditure to operating expenditure.

              I-care further owns Mecotec (Belgium-based calibration and cleanroom qualification), Technical Associates
              of Charlotte (US), and Technical Associates of Europe (EU), which add reliability engineering consulting
              and multi-technique training. This portfolio spans from commodity-comparable services (IR thermography,
              oil analysis via lab partners) to genuinely proprietary technology (Wi-care sensors, I-see AI models, SDT
              ultrasound instruments). The degree of AI-native autonomy varies sharply by layer: hardware and sensor
              delivery are near-automated at scale, while failure diagnosis and maintenance recommendation still rely
              heavily on human analyst review of AI-generated reports.
            claimRefs:
              - CE001
              - CE006
              - CE019
