    rows:
      - - Thesis
        - Structural market growth at 27–32% CAGR provides long runway
        - 'Allied Market Research: $10.1B (2023) → $162B (2033); GrandView Research: $14.2B (2025) → $98.1B (2033)'
        - Market growth decelerates below 20% CAGR for two consecutive years
      - - Thesis
        - End-to-end proprietary stack creates durable competitive moat
        - Wi-care™ sensors + I-see™ AI + field engineers; 8 M&A acquisitions; 150,000+ sensors on I-see platform
        - A hyperscaler (Google, Microsoft, AWS) offers an AI-native PdM platform at marginal cost
      - - Thesis
        - Revenue growth is accelerating with expanding order book
        - 'Revenue: €74M (2024, +15%); >$116M by Dec 2025 (+40–50%); order book $232M (>2× ARR)'
        - Revenue growth falls below 15% two quarters consecutively or order book declines
      - - Thesis
        - WaaS model transition will drive margin improvement and multiple re-rating
        - 90% WaaS target by 2027; 2,000 sensors/day manufacturing capacity; recurring revenue % growing
        - WaaS penetration stalls below 30% by 2027 or churn exceeds 15% annually
      - - Anti-Thesis
        - €1B valuation lacks external price discovery — insider-only round
        - December 2025 round reserved for existing shareholders/employees only; no institutional external validation
        - Phase 2 external raise closes at or above €1B post-money with blue-chip institutional lead
      - - Anti-Thesis
        - Revenue mix undisclosed; hardware-heavy model justifies lower multiple
        - Hardware, software, services split never disclosed; 600+ field engineers implies significant services revenue
        - Company discloses WaaS ARR exceeding 40% of total revenue with 70%+ gross margin
      - - Anti-Thesis
        - IPO postponed with no firm reschedule; exit path uncertain
        - 2025 IPO postponed citing Trump tariff instability; no 2026 IPO date set; Phase 2 raise not announced closed
        - IPO date formally announced with lead bank mandate and regulatory filing underway
      - - Anti-Thesis
        - Company remains loss-making; capital dependency creates dilution risk
        - €8.2M net loss in 2024; cash shortfall expected late 2025/early 2026 (per Belga); Phase 2 raise needed
        - Company reports positive EBITDA for two consecutive quarters with minimal Phase 2 dilution
    notes: >
      Thesis arguments are supported by primary sources (company press releases and Belgian filings); anti-thesis
      arguments are inferred from the absence of disclosure and from independent analysis. Evidence quality for
      anti-thesis points is inherently limited by private-company opacity.
