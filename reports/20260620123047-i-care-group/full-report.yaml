    sections:
      - number: '6.1'
        title: Customer Base Overview and Vertical Segmentation
        blocks:
          - type: paragraph
            body: >
              I-care serves a broad industrial base spanning chemicals, pharmaceuticals, food and beverage, energy
              (wind, nuclear), marine and offshore, mining and extraction, oil and gas, automotive, building materials,
              pulp and paper, and steel. As of September 2022, the company monitored the industrial equipment of more
              than 2,000 "blue chip" customers with combined asset value of approximately $70 billion. By December 2025,
              the Silicon Valley InvestClub enhanced profile cited 300,000+ machines monitored globally, up from 150,000
              sensor endpoints referenced at the time of the unicorn announcement.

              The buyer profile is predominantly plant-level reliability engineers and maintenance managers who initiate
              contact, with C-suite sponsorship required for enterprise-wide rollouts. I-care's "think global, act
              local" delivery model—hiring in-country teams in EMEA, the Americas, West Africa, and APAC—reduces
              friction for multi-site global accounts and competes on service continuity against fly-in-expert rivals.
              Revenue is generated through three channels: direct hardware sales (Wi-care sensors), software
              subscriptions (I-see platform), and field service contracts; the company targets migration of 90%+ of
              monitored assets to a Wi-care as a Service subscription model. Public case studies are heavily
              concentrated in European food and chemical verticals, with limited documented proof in cement, paper,
              water, and pure-play power-generation sectors, creating diligence gaps for investors assessing vertical
              diversification.
