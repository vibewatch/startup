      - number: '2.5'
        title: Vertical Adoption Profiles
        blocks:
          - type: paragraph
            body: >
              Adoption depth varies substantially by vertical, shaped by equipment criticality, regulatory environment,
              budget structure, and maintenance culture. Energy and utilities is the fastest-growing segment at an
              estimated 34.6% CAGR (Mordor Intelligence 2026), propelled by renewable energy expansion, smart grid
              deployments, and post-energy-crisis efficiency mandates. Wind turbine drivetrain monitoring and power
              plant rotating equipment protection are high-value use cases with clear ROI from avoided unplanned
              outages.


              Oil and gas is the highest-revenue vertical today, driven by extreme asset criticality (compressors,
              pumps, turbines in hazardous environments), regulatory inspection requirements, and a corporate
              willingness to pay premium prices for reliability data. ATEX-compliant wireless sensors like I-care's
              Wi-care are a prerequisite in this segment. The sector faces periodic capital budget compression during
              oil price downturns, however, which can pause PdM investment cycles.


              Water and wastewater is an emerging segment with a long adoption runway. Infrastructure renewal programs
              in North America and Europe are driving installation of smart monitoring on pumping stations, treatment
              plant aeration equipment, and distribution infrastructure. Budgets are constrained by public funding
              cycles and utility rate review timelines, but the regulatory mandate for asset reliability in essential
              services makes the business case durable. Metals and mining adoption is growing but remains uneven;
              continuous mining equipment (crushers, conveyors, ball mills) is high-priority while secondary equipment
              is deprioritized. Discrete manufacturing is the largest volume vertical—there are millions of addressable
              assets—but heterogeneous equipment populations and fragmented maintenance teams make standardized PdM
              harder to sell and deploy at scale. Industrial manufacturing as a whole accounts for 22.95% of the 2025
              PdM market by revenue (Mordor Intelligence).
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM031
              - CM034
      - number: '2.6'
        title: Sizing Gaps and Open Diligence Questions
        blocks:
          - type: paragraph
            body: >
              Several material gaps limit the precision of this market sizing. First, penetration rates by vertical are
              not published by major analyst firms; estimates of 10–25% in energy and oil and gas, 5–15% in water and
              metals, and 8–20% in manufacturing are educated assessments based on adoption surveys and field reports,
              not audited statistics. Without reliable penetration data, the SAM calculation for I-care's specific
              verticals carries ±50% uncertainty.


              Second, the SAM calculation for I-care is complicated by the multi-product nature of the offering: the
              total market for vibration sensors, for ultrasound instruments, for AI-analytics platforms, and for
              reliability consulting services are each separately counted by analysts. Summing them risks
              double-counting; using only one misses I-care's integrated model. A bottom-up approach based on the number
              of rotary assets in I-care's target verticals, the average annual spend per asset, and I-care's average
              deal economics would be more reliable but requires non-public operational data.


              Third, the wide divergence in analyst TAM estimates ($9–19B for the same base year) reflects genuine
              disagreement about what spend qualifies as "predictive" versus "preventive"—not just statistical noise.
              Investors using the highest available figure to anchor valuation multiples should apply significant
              haircuts to reflect boundary risk. The narrowest credible estimate (condition monitoring hardware only,
              $3.1B in 2024) and the broadest (full PdM software + services + hardware, $19B+ in 2026) bracket an 8–9×
              range. I-care's actual served market lies somewhere in the middle, and the specific portion it can win
              depends on competitive dynamics covered in the Competitors chapter.
            claimRefs:
              - CM006
              - CM037
              - CM007
              - CM008
              - CM036
      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Boundary Is the Primary Valuation Risk in PdM Comparables
            body: >
              Analyst TAM estimates diverge 2–3× for the same base year primarily due to boundary choices, not data
              quality. Investors anchoring valuation multiples to a $17–19B TAM (Mordor/GVR) vs. the $3.1B hardware-only
              condition monitoring sub-market will reach very different implied penetration rates. I-care's integrated
              model spans all three layers (hardware + software + services), which means its true TAM lies between the
              narrow hardware estimate and the broad software+services estimate, but precisely where is a diligence
              judgment—not a number any single analyst report provides.
            calloutType: insight
            claimRefs:
              - CM006
              - CM037
          - type: callout
            title: 'Pilot Trap Threatens SAM Realization: 70% of Digital Transformation Programs Miss Scale'
            body: >
              McKinsey research on Industry 4.0 adoption found that 70% of digital transformation initiatives fail to
              achieve stated objectives, and only 44% of manufacturers have reached site-wide implementation. In PdM
              terms, this means the gap between the number of sites running pilots and the number running full
              enterprise deployments is very large. I-care's pipeline should be analyzed for trial-to-full-enterprise
              conversion rates; a high pilot count with low conversion implies the effective SAM is substantially
              smaller than the theoretical one.
            calloutType: risk
            claimRefs:
              - CM026
              - CM027
              - CM039
          - type: callout
            title: ESG and Energy Mandates Create Durable Budget Pull in Energy and Utilities
            body: >
              Energy and utilities is forecast to be the fastest-growing PdM vertical at 34.6% CAGR through 2031 (Mordor
              Intelligence), driven by wind farm expansion, grid resilience requirements, and ESG reporting mandates
              that require documented asset reliability evidence. This structural demand is less discretionary than
              general capex spend, creating a more durable purchasing environment. I-care's ATEX compliance and
              16-country coverage position it well in European and Middle Eastern energy markets where regulatory
              requirements are most stringent.
            calloutType: strength
