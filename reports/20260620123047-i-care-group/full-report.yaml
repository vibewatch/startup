        title: Capability Matrix and Pricing Comparison
        blocks:
          - type: paragraph
            body: >
              I-care's end-to-end stack commands a premium in buying criteria that require both hardware integrity and
              expert interpretation. Competitors bifurcate sharply: OEM incumbents (SKF, Emerson, Fluke) are strong on
              hardware depth and installed-base trust but weaker on software-only deployability; AI-first vendors
              (Augury, Senseye, Nanoprecise) excel on analytics scalability and subscription economics but lack in-house
              sensor manufacturing or deep field-service resources. The feature matrix below reflects publicly stated
              capabilities (entries marked with "?" indicate capabilities not confirmed in public sources at time of
              research; entries marked "No" indicate explicitly absent features based on product positioning).

              Pricing across all competitors in this space is largely non-public. I-care has not disclosed list pricing.
              Augury's pricing model is understood to be a software subscription charged per monitored asset or per
              machine-health endpoint; its large-enterprise contracts are negotiated. Fluke Reliability combines
              hardware sales (Prüftechnik instruments) with eMaint SaaS subscriptions and Azima DLI service contracts.
              Emerson's APM platform pricing is enterprise-contract driven and closely tied to DCS installation size.
              Nanoprecise has not disclosed pricing publicly. SKF sells condition monitoring hardware and software
              modules with volume discounts tied to bearing procurement relationships.

              I-care's Wi-care as a Service model, shifting recurring revenue from hardware sales to subscription
              endpoints, is strategically significant: it moves I-care toward Augury's software-economics model while
              retaining the hardware lock-in and data-richness advantages of owning the sensor. The risk of this
              transition is margin compression during the conversion period, particularly if hardware gross margins are
              higher than early SaaS gross margins in a capital-intensive manufacturing context.
