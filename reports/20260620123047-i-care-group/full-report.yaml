      - number: '4.5'
        title: Financial Verdict and Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              I-care's financial picture is that of a well-run, high-growth industrial technology company in an
              intentional investment phase. Revenue of €74 million in 2024 growing to $116 million by late 2025 is
              commercially credible given sensor base expansion, the SDT acquisition, and WaaS model rollout. The €8.2
              million net loss on €74 million revenue (approximately 11% net margin) is consistent with a company
              spending heavily on R&D, manufacturing scale-up, international expansion, and M&A integration—not with a
              company in financial distress per se, though it does create capital dependency.

              Revenue quality is mixed: the WaaS subscription component promises high-quality recurring revenue, but the
              mix between subscription, one-time hardware, and time-and-materials services is undisclosed. Investors
              underwriting the 2026 external raise need to verify (a) gross margin by segment, (b) WaaS conversion rate
              and churn, (c) services EBITDA margin, (d) net working capital and inventory turns given hardware
              manufacturing, and (e) the terms and covenants of any debt or credit facilities taken out since the 2022
              Series C.

              The primary financial risk is capital timing: the company acknowledged an expected cash shortfall by late
              2025/early 2026, the Phase 2 external raise has not been announced as closed, and the IPO that was
              intended to generate at least €100 million remains indefinitely postponed. If the 2026 external raise is
              delayed or comes in below expectations, the company may need to further tap existing shareholders or take
              on debt at a time when valuations for growth-stage industrial-tech companies remain compressed by macro
              conditions.
            claimRefs:
