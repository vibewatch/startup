      - number: '1.6'
        title: Milestones and Strategic Trajectory
        blocks:
          - type: paragraph
            body: >
              I-care's twenty-year trajectory divides into three strategic arcs: an entrepreneurial founding and
              early-growth phase (2004–2017), a scale-up and international expansion phase anchored by the 2022 "Eau
              Rouge" round (2017–2024), and the current unicorn / pre-IPO phase (2025–present).

              The December 2025 unicorn milestone is framed internally as Phase 1 of a three-step development plan.
              Phase 2 (2026) involves attracting material external investors, potentially the largest capital raise in
              I-care's history. Phase 3 is an IPO, originally targeted for 2025 but postponed in spring 2025 citing
              "geopolitical and global economic instability" driven by US trade tariffs. CEO Brion characterized the
              delay using a Formula 1 racing metaphor: even the best driver with the best car does not start in
              atrocious weather conditions.

              Awards and certifications validate I-care's market standing: EY Company of the Year 2020 (Belgium), ADM's
              2024 Supplier Award for reliability services, Factory Innovation Award at Hannover Messe, 2025 Solutions
              Award at The Reliability Conference, ISO 27001 information security certification, and nomination by
              DIGITALEUROPE as one of Europe's future tech giants (2025). Eight M&A transactions since 2017 have added
              capabilities and geographies, culminating in the March 2025 acquisition of SDT International (the largest
              deal to date, funded entirely from equity).
