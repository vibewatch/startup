      - number: '5.2'
        title: Wi-care™ Hardware Platform and Manufacturing
        blocks:
          - type: paragraph
            body: >
              The Wi-care™ sensor is I-care's flagship proprietary hardware. It measures vibration (tri-axial), impact,
              and temperature wirelessly on rotating equipment, uses a native IoT protocol for communication to on-site
              gateways, and offers a claimed 5-year battery life. The current-generation model is the Wi-care 130 G23; a
              simplified lower-cost variant called Wi-care Pure targets smaller deployments. A key differentiator is
              ATEX certification for Zone 1/2 explosive atmospheres, allowing deployment in oil and gas refineries,
              petrochemical plants, and other hazardous environments where most wireless electronics cannot legally
              operate.

              Sensors are designed and manufactured by I-care Electronics—renamed from Cepya Electronics in 2025 after
              full integration into the group—at a Belgium Industry 4.0 facility capable of producing up to 2,000 units
              per day. This in-house manufacturing capability creates a hardware data flywheel: every deployed sensor
              feeds the I-see AI training dataset, while volume production enables the Wi-care as a Service subscription
              model (sensors rented rather than sold). Specific wireless protocol specifications, MEMS sensor chip
              sourcing, and gateway hardware supply chain remain proprietary and undisclosed.
            claimRefs:
