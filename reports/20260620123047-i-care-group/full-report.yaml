      - number: '7.3'
        title: Regulatory, Legal, and Cybersecurity Risk
        blocks:
          - type: paragraph
            body: >
              I-care operates at the intersection of three tightening European regulatory regimes: NIS2, the EU AI Act,
              and ATEX/product-safety rules for hazardous environments. NIS2 (Directive 2022/2555), transposed into
              Belgian law by October 2024, expands mandatory cybersecurity risk-management and incident-reporting
              obligations to manufacturers of critical products — a category applicable to I-care's Wi-care IoT sensor
              manufacturing. Under the Belgian NIS2 regime supervised by the Centre for Cybersecurity Belgium (CCB),
              significant incidents must be reported within 24 hours (early warning) and 72 hours (full notification),
              with management liability for non-compliance. I-care holds ISO 27001 certification (confirmed in its own
              news index and in third-party analyst profiles), which demonstrates information-security management
              maturity and partially satisfies NIS2 technical-measure requirements; however, the certification scope,
              certification body, and last audit date are not publicly available, and ISO 27001 does not substitute for
              active CCB entity registration and incident-response capability. I-care's NIS2 registration status with
              the CCB has not been publicly confirmed.

              The EU AI Act (Regulation 2024/1689), fully applicable from August 2026, classifies AI systems used in
              critical-infrastructure management and industrial safety as high-risk. I-care's I-see platform — which
              predicts failures months in advance for rotating equipment in oil and gas, chemical, and ATEX environments
              — likely falls under this classification per Article 6 and Annex III. High-risk AI systems must register
              in the EU AI database, complete conformity assessment, maintain detailed technical documentation, and
              enable human oversight. Non-compliance carries fines up to €30 million or 6% of global annual turnover.
              I-care has not publicly confirmed its AI Act classification or compliance roadmap.

              ATEX Directive 2014/34/EU governs equipment for potentially explosive atmospheres. Wi-care sensors are
              ATEX Zone 1/2 certified — a genuine competitive moat that also entails notified-body recertification
              whenever hardware is modified, creating product-development latency and elevated product-liability
              exposure in explosive-atmosphere incidents. GDPR risk is present because I-care's I-see privacy policy was
              last updated in September 2022 — predating the March 2025 SDT International acquisition — and has not been
              publicly revised to address new data streams from ultrasound sensor integration. No litigation,
              enforcement action, or cybersecurity incident against I-care was identified in public records as of the
              research date. However, ENISA's 2024 OT/ICS threat landscape documents rising ransomware and espionage
              campaigns against industrial IoT environments; I-care's 150,000+ connected endpoints constitute a
              high-value adversarial target.
