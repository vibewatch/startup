      - number: '5.6'
        title: Trust, Security, Compliance, and Technical Risk
        blocks:
          - type: paragraph
            body: >
              I-care holds ISO 27001 certification for the I-see platform and data management processes, providing an
              enterprise-grade information security baseline that supports sales into regulated industries (pharma,
              energy, food and beverage). Wi-care sensors carry ATEX certification for Zone 1/2 explosive atmospheres—a
              hard technical prerequisite for oil and gas and petrochemical deployments that competitors without
              proprietary hardware cannot match without third-party sensors. GDPR compliance is implicit given I-care's
              Belgian incorporation, but no public Data Processing Agreement templates or sub-processor list were found.

              Key technical risks are concentrated in three areas. First, AI opacity: ML failure prediction models are
              not documented publicly—methodology, training data splits, false positive rates, and performance on asset
              types not yet in the training set are unknown, creating a due-diligence gap for customers and investors
              evaluating prediction claims. Second, cloud dependency: the infrastructure provider hosting I-see is
              unnamed, preventing customers from assessing redundancy, failover, or data sovereignty commitments. Third,
              service scalability: the 600-engineer field force that differentiates I-care from pure- software rivals is
              also the largest structural cost item; as AI matures, customers will expect fewer engineer-hours per
              monitored asset, creating margin pressure unless I-see's AI layer can absorb a growing share of diagnostic
              labor. Wi-care's 5-year battery life and specific ATEX marking class are claimed but not substantiated by
              publicly accessible test reports or certification registry entries.
