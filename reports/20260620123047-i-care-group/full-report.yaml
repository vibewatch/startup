      - number: '2.3'
        title: Buyer, User, and Payer Structure
        blocks:
          - type: paragraph
            body: >
              The PdM buyer is rarely the end-user. In industrial settings, the maintenance engineer or reliability
              specialist who operates sensor tools is typically subordinate to the plant manager or maintenance director
              who controls the budget. The payer—who approves capital allocation—is often a step further removed, at VP
              Engineering, VP Operations, or CFO level in larger organizations. This multi-stakeholder dynamic extends
              the average enterprise sales cycle to 12–24 months and requires vendors to build economic cases at both
              the operational (uptime, mean-time-between-failure) and financial (NPV, IRR, cost avoidance) level.


              Budget ownership varies meaningfully by contract structure and vertical. Sensor hardware purchase falls
              under capital expenditure (CAPEX), requiring CFO or board approval in large industrial organizations.
              Software subscriptions and field service contracts are operational expenditure (OPEX) and may fall within
              the plant manager's discretionary authority—a key reason SaaS and subscription models lower the barrier to
              initial adoption. I-care's stated shift toward its Wi-care as a Service subscription model directly
              targets this friction point by converting CAPEX sensor spend into monthly OPEX commitments.


              Adoption is triggered primarily by a failure event—a costly unplanned breakdown that crystallizes the ROI
              argument. Secondary triggers include regulatory audits (particularly in oil and gas and water/wastewater,
              where equipment reliability is regulated), new capital investment cycles where sensors can be installed
              during plant construction or expansion, and growing corporate ESG and energy efficiency mandates that
              require asset uptime evidence. The water/wastewater vertical faces lower average budgets than oil and gas,
              but public infrastructure renewal cycles and utility rate reviews are increasingly funding PdM programs.
            claimRefs:
