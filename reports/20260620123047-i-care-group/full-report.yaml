      - number: '5.4'
        title: Expert Services, SDT Ultrasound, and Subsidiary Capabilities
        blocks:
          - type: paragraph
            body: >
              I-care's services layer covers six PdM techniques: vibration analysis (the core), oil and grease analysis,
              motion magnification, infrared thermography, ultrasound, and motor circuit analysis. The March 2025
              acquisition of SDT International—named "Harmonising Waves"—added 50 years of ultrasound heritage, a
              worldwide distribution network, and product lines including the SDT340 flagship instrument, LUBExpert
              acoustic lubrication guidance system, the portable CHECKER range, permanent monitoring solutions
              (Vigilant, Online4US), and CRYSOUND acoustic imaging. SDT's UAS3 analysis software is intended to converge
              with I-see, creating a single platform for both vibration and ultrasound diagnosis.

              Service delivery operates through three contractual models: fully outsourced (I-care takes on-site
              responsibility), co-managed (I-care supplements customer teams), and advisory (I-care coaches
              customer-owned reliability programs). This flexibility is a commercial strength but also a complexity
              risk: quality consistency across 600+ engineers in 35+ offices across 15 countries is difficult to assure,
              and the service layer is labor- intensive in a way that compresses operating margins. Mecotec provides
              calibration, qualification, and Industry 4.0 production-line analysis—predominantly in Belgium and
              northern France—adding compliance-grade measurement services for pharmaceutical and clean-room customers.
              Technical Associates delivers multi-technique PdM training and ISO Category 1 ultrasound certification in
              the US and Europe.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE019
              - CE020
              - CE022
              - CE023
              - CE025
      - number: '5.5'
        title: Integrations, Deployment, and Technology Roadmap
        blocks:
          - type: paragraph
            body: >
              I-see's open API connects to CMMS systems—confirmed integrations include MVP One, DimoMaint, and
              Mainti4—enabling automated work-order creation from AI-generated alerts without manual re-entry. Beyond
              CMMS connectivity, I-care joined AVEVA's partner ecosystem as a Managed Solution Provider and integrated
              AVEVA PI System process-historian data into I-see, opening a route into plants already running AVEVA
              infrastructure. An Oracle partner program membership and integrations with Filtertechnik (oil filtration
              analysis) and POLARIS Laboratories (fluid analysis) round out the third-party ecosystem.

              No public API documentation, SDK, or developer portal was found, and a GitHub search returned zero I-care
              repositories—signals that the integration surface is partner- mediated rather than self-service for
              customers or third-party developers. This creates friction for customers who want custom data flows or
              independent validation of I-see outputs. The technology roadmap centers on three vectors: (a) completing
              the SDT ultrasound–I-see software convergence, (b) expanding the Wi-care as a Service subscription
              footprint (target: more than 90% of monitored assets on recurring subscriptions), and (c) scaling sensor
              manufacturing to support the growing deployment base. Industry awards in 2025—Factory Innovation Award at
              Hannover Messe and Solutions Award at The Reliability Conference—provide external validation of the
              technology positioning, though they do not independently assess technical claims.
