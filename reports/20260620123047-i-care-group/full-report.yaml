      - number: '8.5'
        title: Exit Readiness and Capital Structure
        blocks:
          - type: paragraph
            body: >
              I-care's stated exit path is an IPO on a Belgian or European exchange, targeted to raise at least €100
              million. The company had publicly announced a 2025 IPO target but postponed it in spring 2025, citing
              "geopolitical and global economic instability" stemming from US tariff disruptions. As of June 2026, no
              new IPO date has been announced; the company's three-phase plan positions the 2026 external raise as a
              precursor to the IPO (Phase 3). The delay reflects both external macro conditions and, likely, internal
              readiness: the company needs to demonstrate EBITDA positive trajectory and ideally disclose segment-level
              revenue mix to be IPO-credible for institutional investors.

              The capital structure as of December 2025 includes: co-founders holding ~72% of shares, employees ~8%, and
              four reference shareholders (Finasucre, Wallonie Entreprendre (~10%), CPH Bank, IMBC, Amerigo) holding the
              remaining ~20% combined. Preference stack details and anti-dilution rights have not been publicly
              disclosed. The December 2025 insider round was framed as both a fundraise and a refinancing of the March
              2025 SDT International acquisition, suggesting it partially addressed balance-sheet liquidity rather than
              purely growth capital.

              Strategic acquisition by an industrial conglomerate (Emerson, ABB, Honeywell, Siemens, SKF) represents a
              plausible alternative exit that would likely command a premium to the IPO path given strategic synergies —
              particularly if the suitor seeks to add a complete sensor-to-AI predictive maintenance stack. The
              co-founders' 72% stake means they have veto power over any deal, and founder-led exits often occur only at
              substantial premiums to public market value. Secondary private-equity buyout is a tertiary path but would
              be dilutive given preference overhangs and the capital intensity of the manufacturing and services
              operations.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV005
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV014
              - CV016
      - number: '8.6'
        title: Final Diligence Asks and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              The single largest diligence gap is the revenue composition: what share of 2024 and 2025 revenue is
              attributable to (a) Wi-care hardware outright sales, (b) WaaS subscription (hardware + software + services
              bundled), (c) standalone I-see software licences, and (d) time-and-materials services? This split
              determines which valuation multiple is appropriate and whether the gross margin profile is consistent with
              the current price. A company with 70% hardware-plus-services revenue and 30% software would logically
              trade at 4–6× EV/Revenue; one with the inverse mix at 10–15×. Without this information, the €1B unicorn
              mark cannot be independently validated.

              The second critical gap is the status of the Phase 2 external raise. The company communicated a targeted
              close in 2026 and disclosed that the round was intended to be among the largest in I-care's history. As of
              June 2026, no announcement of a successful close has been identified in any public source. If this raise
              is delayed or reduced in size, it signals either adverse market conditions or investor scepticism about
              the valuation — either of which would be a material thesis-break indicator.

              The third gap is gross margin by segment. Given the company's hardware manufacturing (up to 2,000
              sensors/day) and 600+ field engineers, blended gross margin is likely materially below software-only
              peers. Without this data, the path to profitability and the EBITDA multiple at exit cannot be modelled.
              Management's stated ambition to multiply normalized EBITDA margin 5× within five years of the 2022 Series
              C implies it is at a low single-digit positive EBITDA margin today at best — or still negative — but this
              cannot be verified from public sources.
            claimRefs:
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV043
              - CV044
              - CV045
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: No External Price Discovery at €1B Mark
            body: >
              The December 2025 unicorn valuation was set exclusively by existing shareholders and employees — making it
              a self-assessed mark with no independent institutional validation. Until the Phase 2 external raise
              closes, the €1B price should be treated as an aspirational anchor, not a market-cleared value. This is the
              single most important caveat for any valuation analysis.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
          - type: callout
            title: Revenue Mix Is the Critical Unknown
            body: >
              The justified EV/Revenue multiple for I-care ranges from ~2× (if hardware-heavy) to ~15× (if
              software/WaaS-heavy). I-care has never disclosed the split between hardware, WaaS subscription, software
              licences, and services. This single undisclosed fact drives a 5–6× range in the defensible valuation. No
              quantitative valuation model can be validated without this information.
            calloutType: assumption
            claimRefs:
              - CV015
              - CV043
          - type: callout
            title: Augury Comparable Validates Private Market Band
            body: >
              Augury, the closest US private-market comparable, raised $180M in a Series E round in February 2022 at
              approximately $1 billion valuation — virtually identical to I-care's December 2025 mark. That both
              companies reached the unicorn threshold at similar scales in the industrial AI / predictive maintenance
              space supports the thesis that I-care's pricing is within the range of what the private market has been
              willing to pay for leading platforms, even as public market multiples compressed since 2022.
            calloutType: insight
            claimRefs:
              - CV023
              - CV024
