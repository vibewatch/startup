      - number: '8.3'
        title: Comparable Valuation Set
        blocks:
          - type: paragraph
            body: >
              I-care sits at an intersection of industrial hardware, industrial IoT software, and field services —
              meaning no single public or private comparable captures the full model. The most relevant public comps
              span a wide band: asset-heavy industrial conglomerates with embedded condition monitoring (SKF: EV/Revenue
              ~1–2×) to pure-play industrial AI software platforms (AspenTech: EV/Revenue ~15–20×). PTC, whose portfolio
              spans industrial IoT (ThingWorx), CAD, and PLM software with strong recurring revenue, is probably the
              closest listed comparator with a mix of hardware-agnostic software and services; PTC traded at roughly
              7–10× EV/Revenue in 2024–2025. Rockwell Automation, which has a heavy services and automation hardware
              base, traded at approximately 3–4× EV/Revenue during the same period.

              On the private side, Augury is the most directly comparable: it is an industrial AI company focused on
              machine health, raised $180 million in a Series E round in February 2022, and was reported to have
              achieved unicorn status at approximately $1 billion valuation — essentially the same mark as I-care.
              Augury's revenue was not publicly disclosed but the comparable fundraise and valuation support the thesis
              that I-care's €1B valuation is within the private market band for leading industrial AI /
              predictive-maintenance platforms.

              The comparable set reveals that I-care's ~9–11× EV/Revenue (on 2025 run-rate) is a premium to
              hardware-centric industrial peers but a discount to pure software. The appropriate anchor multiple depends
              on the mix of WaaS subscription revenue versus one-time hardware versus time-and-materials services — a
              split that I-care has never disclosed. If WaaS/subscription revenue represents only 20–30% of total
              revenue today, a blended multiple of 5–8× would be more defensible; if it reaches 50%+ by 2027, 10–15×
              becomes plausible at IPO.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
      - number: '8.4'
        title: Scenario Analysis
        blocks:
          - type: paragraph
            body: >
              Three scenarios frame the valuation range at the expected 2027–2028 IPO horizon. In the bull case, WaaS
              subscription adoption reaches 50%+ of revenue by 2027, revenue accelerates to $200+ million on 30%+
              organic growth supported by the Phase 2 external raise and continued M&A, and EBITDA turns positive,
              enabling an IPO at 13–15× EV/Revenue implying a valuation of €2.6–3B+. In this scenario the €1B unicorn
              mark is a roughly 2.5–3× money multiple for investors entering at the December 2025 round.

              In the base case, revenue grows at 20–25% annually to approximately $160–180 million by 2027, WaaS reaches
              35–45% of revenue, and losses narrow but do not flip to positive EBITDA before IPO. An IPO at 9–12×
              EV/Revenue would imply a valuation of €1.5–2.2B, representing a 1.5–2× money multiple. This scenario
              requires the Phase 2 external raise to close successfully in 2026, an IPO market that reopens for
              growth-loss industrial-tech companies, and no meaningful deterioration in macro or customer spending
              conditions.

              In the bear case, growth slows to 10–15% as hardware ramp and services capacity absorb management
              attention, the WaaS transition stalls below 30% of revenue, the 2026 external raise comes in at a lower
              valuation or is delayed to 2027, and macro and tariff headwinds persist. At 5–7× EV/Revenue on $140M
              revenue, the implied valuation is €600–800M — below the December 2025 unicorn mark, constituting a de
              facto down-round for the 2025 investors. Trigger events for this scenario include the Phase 2 raise
              failing to close by Q4 2026, revenue growth decelerating below 15% for two consecutive quarters, or the
              IPO window remaining shut through 2028.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
