      - number: '7.5'
        title: M&A Integration, Governance, and Execution Risk
        blocks:
          - type: paragraph
            body: >
              I-care has completed eight acquisitions in eight years including Mecotec (calibration), Technical
              Associates of Charlotte (US PdM services), I-care Electronics (sensor manufacturing, formerly Cepya),
              Technical Associates of Europe (EU training), and SDT International (ultrasound, March 2025). The SDT
              acquisition is the largest and most strategically complex: combining two distinct sensing technologies
              (vibration and ultrasound) into a unified I-see platform, aligning two Belgian engineering cultures, and
              absorbing SDT's worldwide ultrasound distribution network. The acquisition press release explicitly states
              SDT will retain "operational autonomy" — a dual-mode integration approach that delays full IT and
              data-platform consolidation and maintains cost duplication during the transition. SDT revenue,
              profitability, integration milestones, and goodwill are not publicly disclosed. Integration timelines for
              the seven prior acquisitions are also not disclosed, making it impossible to assess whether historical M&A
              is fully digested before new deals are layered on.

              Governance concentration is a board-level risk. Fabrice Brion holds four concurrent senior roles: CEO and
              Board Chairman of I-care Group, VP R&D, and Board Chairman of SDT International since March 2025. No
              succession plan, emergency-delegation protocol, or interim VP R&D mandate has been publicly disclosed. The
              two co-founders hold 72% of equity, ensuring unilateral strategic authority; the six-member board lacks a
              publicly disclosed audit or remuneration committee. Execution bandwidth is finite: management is
              simultaneously running (a) the WaaS business-model transition, (b) the SDT integration, (c) a sensor
              volume ramp to 2,000 units per day, (d) a multi-tens-of-millions external fundraise, and (e) IPO
