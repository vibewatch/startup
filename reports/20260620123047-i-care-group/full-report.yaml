              Concentration risk is a material diligence concern. The two anonymous mega-accounts (global food leader,
              oil & gas major) are individually large enough to represent material revenue concentration, but neither
              customer's revenue contribution is disclosed. Finasucre— I-care's lead Series C investor and a
              board-represented shareholder—is also an I-care customer, creating a structural conflict of interest.
              Channel dependence is limited: I-care sells primarily direct, with no disclosed reseller or distributor
              network that would represent a concentration of its own. Procurement friction is high (enterprise RFPs, IT
              integration requirements, ATEX certification needs in some sites) and is both a moat and a barrier to
