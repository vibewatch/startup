evidenceGaps:
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: >
      An authoritative, audited employee count as of Q2 2026. The official website states 1,000+ but Tracxn's HR
      database showed 861 as of May 2026; SDT International staff inclusion is unclear.
    whyItMatters: |
      Headcount is a key operational KPI; discrepancy of ~14% matters for cost-structure and capacity analysis.
    diligencePath: >
      Request official payroll or LinkedIn active headcount data; consult company investor relations for a post-SDT
      combined headcount figure.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >
      Audited annual financial statements (P&L, balance sheet, cash flow) for FY 2024 and FY 2025. The only P&L
      reference found is Belga News Agency's coverage of management disclosures.
    whyItMatters: >
      Revenue, EBITDA, cash position, and working capital are critical for valuation and pre-IPO diligence; unaudited
      management statements may differ from auditor-reviewed figures.
    diligencePath: >
      Request audited consolidated financial statements from I-care investor relations; review Belgian National Bank
      annual filings for I-CARE HOLDING entity (CIN 0682.567.719).
  - type: missing-source
    severity: minor
    topic: technology
    missingEvidence: >
      Detailed technical architecture documentation or independent validation of Wi-care sensor specifications and I-see
      AI model performance metrics.
    whyItMatters: >
      Claims about detection precision ("1,000-10,000x more precise") and failure prediction lead time are material to
      product differentiation but have no independent corroboration.
    diligencePath: >
      Request technical white papers, patent filings, or third-party benchmark studies; search USPTO/EPO patent database
      for Wi-care sensor patents.
    relatedQuestionRefs:
      - QO014
      - QO015
  - type: missing-source
    severity: minor
    topic: competitive-position
    missingEvidence: >
      Independent competitive benchmarking of I-care vs. Augury, Infinite Uptime, and other Series C/D funded PdM
      players on sensor accuracy, AI performance, and customer retention.
    whyItMatters: >
      CEO's claim that I-care detects problems 1,000-10,000x more precisely than competitors is unverified;
      understanding relative competitive positioning is key for market chapter.
    diligencePath: >
      Review independent analyst reports (Gartner, Forrester, IDC) on industrial predictive maintenance
      software/hardware; seek customer references willing to compare providers.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: M&A
    missingEvidence: >
      Full list of the eight companies acquired between 2017 and 2025. Only four subsidiaries are publicly named
      (Technical Associates of Charlotte, I-care Electronics, Mecotec, SDT International).
    whyItMatters: |
      Unknown acquisitions may carry undisclosed liabilities, earn-out obligations, or integration risks.
    diligencePath: >
      Review Belgian Crossroads Bank for Enterprises (CBE) records for entities with I-CARE HOLDING as ultimate
      beneficial owner; request M&A disclosure list from company.
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: >
      Complete beneficial ownership table for I-care's 20% external shareholder block. Named entities include Finasucre
      (~10% estimated), Wallonie Entreprendre (~10%), CPH Bank, IMBC, and Amerigo Fund, but precise per-entity
      percentages are not publicly disclosed.
    whyItMatters: >
      Investor concentration and individual shareholder percentages matter for governance analysis, drag-along rights,
      and pre-IPO share structure assessment.
    diligencePath: >
      Request full cap table from company investor relations; consult Belgian NBB filings for entity ownership registers
      under BVBA structure or Crossroads Bank for enterprise linkages.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: penetration-rates
    missingEvidence: >
      Reliable, vertically segmented PdM adoption or penetration rate data for energy, oil & gas, water/wastewater,
      metals/mining, and discrete manufacturing in 2026. No analyst report reviewed provides audited penetration
      statistics by vertical.
    whyItMatters: >
      Without penetration data, the SAM calculation relies on broad TAM percentages rather than bottom-up reachable
      market estimates, introducing ±50% uncertainty into I-care's SAM and SOM. Penetration rates also set the ceiling
      for long-term revenue growth in each vertical.
    diligencePath: >
      Commission targeted vertical surveys or request proprietary data from Verdantix, Gartner, or IDC (who publish
      vertical-specific IoT adoption benchmarks); review public utility disclosures for water/wastewater capital
      technology spend; assess oil and gas operator annual reports for maintenance technology investment lines.
    relatedQuestionRefs:
      - QM005
