  topStrengths:
    - |
      端到端硬件-AI-服务栈（Wi-care™ 传感器、I-see™ 平台、600+ 名现场工程师）形成深切换成本和护城河，纯软件或纯硬件对手很难复制。
    - |
      收入动能已经跑出来：FY2024 €74M（同比 +15%）到 2025 年 12 月 $116M+（增速约 40–50%），$232M+ 订单储备提供 18–24 个月前瞻可见度。
    - |
      面向爆炸性气氛环境的 ATEX Zone 1/2 硬件认证是真护城河，把许多只做软件的竞争者挡在安全关键的油气和化工设施之外。
    - |
      150,000+ 个监测端点的自有 PdM 数据集，加上八笔战略收购，让 I-see 的 AI 模型相较新进入者拥有训练数据优势。
    - |
      公司由联合创始人带队并控制 72% 股权，BASF、ADM、Barry Callebaut、Syngenta 等蓝筹工业客户名单证明产品市场匹配不是纸面故事。
  topRisks:
    - |
      2025 年 12 月 €1B 独角兽估值由内部人轮确定，没有外部价格发现；Phase 2 外部融资仍未宣布，IPO 已延后一次，若资本市场继续逆风，公允价值不确定性和被动稀释风险都会上升。
    - |
      公司结构性亏损（FY2024 €74M 收入对应 €8.2M 净亏损），EBITDA、毛利率和 WaaS 渗透率未披露；硬件转 SaaS 的过渡期会形成现金陷阱，缺少收入结构数据就很难建模。
    - |
      关键人物风险很尖锐：Fabrice Brion 同时担任 CEO、董事长、VP R&D、SDT 董事长四个高级职位，且未披露接班计划；公司处在 IPO 前阶段，还同时推进五条战略工作流。
    - >
      Augury（累计融资 $180M，Verdantix 2025 Green Quadrant Leader）和 OEM 既有玩家（SKF 2026 年 3 月收购 G-Tech、Siemens
      Senseye）正用更深资本和更广渠道加压。
    - |
      比利时单一传感器工厂带来地域集中风险；EU AI Act 高风险分类义务（2026 年 8 月适用）和 NIS2 合规状态仍未在公开披露中确认。
  unresolvedGaps:
    - |
      截至 2025 年的收入结构拆分（硬件 vs. WaaS / 软件订阅 vs. 现场服务）和 WaaS 渗透率从未公开披露，无法匹配合适的 EV/Revenue 可比组。
    - |
      Phase 2 外部融资状态：尽管目标是 2026 年，截至 2026 年 6 月仍无投资方公告或条款清单披露；延迟会实质影响 IPO 准备度和估值底线。
    - |
      FY2025 经审计财务（收入、EBITDA、毛利率、自由现金流、债务负担）未公开；唯一披露财务是 Belga News 引述的 FY2024 数据，并非审计文件。
    - |
      SDT International 收购财务（购买价格、收入贡献、商誉、整合时间表）未披露，M&A 整合风险无法量化。
    - |
      I-see 平台 EU AI Act 合规评估状态、NIS2 CCB 注册和产品责任保险条款在公开记录中均未确认。
