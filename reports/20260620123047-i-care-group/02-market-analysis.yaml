  - id: FM004
    title: "Predictive Maintenance Enterprise Adoption Funnel"
    type: funnel
    layout: standard
    summary: >
      Typical six-stage adoption funnel from awareness through full enterprise deployment, with
      significant attrition at the business case approval and full rollout stages due to IT/OT friction
      and CAPEX approval barriers.
    data:
      items:
        - label: "Awareness – Asset managers aware of PdM ROI potential"
          value: 100
          unit: "%"
          detail: "Broad market awareness driven by industry events, publications, vendor outreach"
        - label: "Trial interest – Sites willing to explore a pilot or proof of concept"
          value: 60
          unit: "%"
          detail: "Narrows to sites with unplanned downtime history or active reliability improvement programs"
        - label: "Pilot / POC – Sensors deployed on critical assets, 3–6 months evaluation"
          value: 35
          unit: "%"
          detail: "Requires operations buy-in; installation logistics reduce funnel further"
        - label: "Business case approval – CFO or VP sign-off on enterprise expansion"
          value: 20
          unit: "%"
          detail: "Pilot trap: many pilots demonstrate ROI but fail at enterprise budget approval (McKinsey: 70% of digital programs fail)"
        - label: "Partial rollout – Priority asset classes covered (30–60% of fleet)"
          value: 12
          unit: "%"
          detail: "IT/OT integration friction and change management slow expansion beyond priority assets"
        - label: "Full enterprise deployment – Full rotating machinery fleet coverage"
          value: 5
          unit: "%"
          detail: "Less than 5% of eligible industrial facilities globally have full-fleet PdM coverage (estimated)"
    approximationNotes: >
      Funnel percentages are illustrative estimates based on McKinsey Industry 4.0 data (44% site-wide
      implementation), IBM PdM workflow analysis, and editorial judgment from industry commentary.
      Not derived from a single statistical survey; represent relative attrition stages, not absolute counts.
    claimRefs: [CM020, CM026, CM027, CM039]

callouts:
  - calloutType: insight
    title: "Market Boundary Is the Primary Valuation Risk in PdM Comparables"
    body: >
      Analyst TAM estimates diverge 2–3× for the same base year primarily due to boundary choices, not
      data quality. Investors anchoring valuation multiples to a $17–19B TAM (Mordor/GVR) vs. the $3.1B
      hardware-only condition monitoring sub-market will reach very different implied penetration rates.
      I-care's integrated model spans all three layers (hardware + software + services), which means its
      true TAM lies between the narrow hardware estimate and the broad software+services estimate, but
      precisely where is a diligence judgment—not a number any single analyst report provides.
    claimRefs: [CM006, CM037]

  - calloutType: risk
    title: "Pilot Trap Threatens SAM Realization: 70% of Digital Transformation Programs Miss Scale"
    body: >
      McKinsey research on Industry 4.0 adoption found that 70% of digital transformation initiatives
      fail to achieve stated objectives, and only 44% of manufacturers have reached site-wide
      implementation. In PdM terms, this means the gap between the number of sites running pilots
      and the number running full enterprise deployments is very large. I-care's pipeline should be
      analyzed for trial-to-full-enterprise conversion rates; a high pilot count with low conversion
      implies the effective SAM is substantially smaller than the theoretical one.
    claimRefs: [CM026, CM027, CM039]

  - calloutType: strength
    title: "ESG and Energy Mandates Create Durable Budget Pull in Energy and Utilities"
    body: >
      Energy and utilities is forecast to be the fastest-growing PdM vertical at 34.6% CAGR through
      2031 (Mordor Intelligence), driven by wind farm expansion, grid resilience requirements, and
      ESG reporting mandates that require documented asset reliability evidence. This structural
      demand is less discretionary than general capex spend, creating a more durable purchasing
      environment. I-care's ATEX compliance and 16-country coverage position it well in European
      and Middle Eastern energy markets where regulatory requirements are most stringent.
    claimRefs: [CM031, CM019, CM032]

