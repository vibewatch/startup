  evidenceGaps:
    - type: missing-source
      severity: material
      topic: penetration-rates
      missingEvidence: >
        Reliable, vertically segmented PdM adoption or penetration rate data for energy, oil & gas,
        water/wastewater, metals/mining, and discrete manufacturing in 2026. No analyst report reviewed
        provides audited penetration statistics by vertical.
      whyItMatters: >
        Without penetration data, the SAM calculation relies on broad TAM percentages rather than
        bottom-up reachable market estimates, introducing ±50% uncertainty into I-care's SAM and SOM.
        Penetration rates also set the ceiling for long-term revenue growth in each vertical.
      diligencePath: >
        Commission targeted vertical surveys or request proprietary data from Verdantix, Gartner, or
        IDC (who publish vertical-specific IoT adoption benchmarks); review public utility disclosures
        for water/wastewater capital technology spend; assess oil and gas operator annual reports for
        maintenance technology investment lines.
      relatedQuestionRefs: [QM005]

    - type: private-evidence-only
      severity: material
      topic: I-care-SAM
      missingEvidence: >
        A publicly verifiable bottom-up SAM estimate for I-care. The derived SAM ($2–4B) is based
        on applying sector share percentages to third-party TAM figures, which themselves carry
        boundary ambiguity. I-care has not disclosed its internal serviceable market calculation
        or deal pipeline size.
      whyItMatters: >
        Without a bottom-up SAM, valuation multiples applied to a broad TAM could significantly
        overstate I-care's realistic market opportunity, affecting pre-IPO investment theses.
      diligencePath: >
        Request I-care's internal market sizing model and pipeline by vertical from investor relations;
        conduct independent bottom-up sizing based on rotary asset counts by vertical from trade
        associations (API, AWWA, Eurofer) and average PdM spend per asset from customer disclosures.
      relatedQuestionRefs: [QM004, QM027]

    - type: conflicting-data
      severity: minor
      topic: analyst-TAM-divergence
      missingEvidence: >
        Methodological transparency from the analyst firms whose estimates diverge 2–3×. Grand View
        Research, Mordor Intelligence, and Allied Market Research do not publicly disclose their
        segment definitions, country inclusion lists, or base-data sources at summary page level.
        The boundary ambiguity prevents reliable cross-firm comparison.
      whyItMatters: >
        Investors or counterparties citing conflicting analyst figures for the same year without
        reconciling boundary differences will reach contradictory conclusions about market size and
        growth potential—a material risk in valuation discussions.
      diligencePath: >
        Purchase full analyst reports from at least two firms and compare methodology sections;
        request proprietary analyst calls to clarify boundary definitions; use MarketsandMarkets'
        narrower scope as the conservative planning anchor.
      relatedQuestionRefs: [QM008, QM010]

    - type: missing-source
      severity: minor
      topic: vertical-adoption-rates
      missingEvidence: >
        Independent evidence on slow-adoption verticals (e.g., general discrete manufacturing, small
        and medium enterprises). Most analyst reports focus on early-adopter verticals (O&G, energy,
        aerospace) and may overstate adoption breadth in volume-manufacturing segments.
      whyItMatters: >
        I-care's stated ambition to serve "any industry" requires demonstrating adoption in heterogeneous,
        lower-criticality manufacturing environments where ROI arguments are less obvious and maintenance
        cultures are more reactive. Slow adoption in these segments would constrain TAM realization.
      diligencePath: >
        Review Plant Engineering annual survey data for maintenance technology adoption rates in
        general manufacturing; request I-care customer distribution by vertical to assess actual
        revenue concentration vs. stated coverage breadth.
      relatedQuestionRefs: [QM017]

acknowledgedWarnings:
  - dimension: paywallRisk
    reason: "9 of 27 sources have restricted access (IEA, Deloitte, IDC, Verdantix, Fortune Business Insights, SKF, Mordor CM, GVR CM, Emerson); all were fetched during research but returned 403 or JS-only responses. They are retained for source-domain diversity and research coverage evidence; no open-access equivalent was available for each specialist source at access date."
