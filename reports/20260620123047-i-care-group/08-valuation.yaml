  - id: final-diligence-asks
    title: Final Diligence Asks and Kill Criteria
    body: >
      The single largest diligence gap is the revenue composition: what share of 2024 and 2025
      revenue is attributable to (a) Wi-care hardware outright sales, (b) WaaS subscription
      (hardware + software + services bundled), (c) standalone I-see software licences, and (d)
      time-and-materials services? This split determines which valuation multiple is appropriate
      and whether the gross margin profile is consistent with the current price. A company with 70%
      hardware-plus-services revenue and 30% software would logically trade at 4–6× EV/Revenue;
      one with the inverse mix at 10–15×. Without this information, the €1B unicorn mark cannot
      be independently validated.

      The second critical gap is the status of the Phase 2 external raise. The company communicated
      a targeted close in 2026 and disclosed that the round was intended to be among the largest in
      I-care's history. As of June 2026, no announcement of a successful close has been identified
      in any public source. If this raise is delayed or reduced in size, it signals either adverse
      market conditions or investor scepticism about the valuation — either of which would be a
      material thesis-break indicator.

      The third gap is gross margin by segment. Given the company's hardware manufacturing (up to
      2,000 sensors/day) and 600+ field engineers, blended gross margin is likely materially below
      software-only peers. Without this data, the path to profitability and the EBITDA multiple at
      exit cannot be modelled. Management's stated ambition to multiply normalized EBITDA margin 5×
      within five years of the 2022 Series C implies it is at a low single-digit positive EBITDA
      margin today at best — or still negative — but this cannot be verified from public sources.
    claimRefs:
      - CV043
      - CV044
      - CV045
    tableRefs:
      - TV006

