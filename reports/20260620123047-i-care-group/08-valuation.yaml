  - id: scenario-analysis
    title: Scenario Analysis
    body: >
      Three scenarios frame the valuation range at the expected 2027–2028 IPO horizon. In the bull
      case, WaaS subscription adoption reaches 50%+ of revenue by 2027, revenue accelerates to
      $200+ million on 30%+ organic growth supported by the Phase 2 external raise and continued
      M&A, and EBITDA turns positive, enabling an IPO at 13–15× EV/Revenue implying a valuation
      of €2.6–3B+. In this scenario the €1B unicorn mark is a roughly 2.5–3× money multiple for
      investors entering at the December 2025 round.

      In the base case, revenue grows at 20–25% annually to approximately $160–180 million by
      2027, WaaS reaches 35–45% of revenue, and losses narrow but do not flip to positive EBITDA
      before IPO. An IPO at 9–12× EV/Revenue would imply a valuation of €1.5–2.2B, representing
      a 1.5–2× money multiple. This scenario requires the Phase 2 external raise to close
      successfully in 2026, an IPO market that reopens for growth-loss industrial-tech companies,
      and no meaningful deterioration in macro or customer spending conditions.

      In the bear case, growth slows to 10–15% as hardware ramp and services capacity absorb
      management attention, the WaaS transition stalls below 30% of revenue, the 2026 external
      raise comes in at a lower valuation or is delayed to 2027, and macro and tariff headwinds
      persist. At 5–7× EV/Revenue on $140M revenue, the implied valuation is €600–800M — below
      the December 2025 unicorn mark, constituting a de facto down-round for the 2025 investors.
      Trigger events for this scenario include the Phase 2 raise failing to close by Q4 2026,
      revenue growth decelerating below 15% for two consecutive quarters, or the IPO window
      remaining shut through 2028.
