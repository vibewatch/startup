callouts:
  - calloutType: risk
    title: No External Price Discovery at €1B Mark
    body: >
      The December 2025 unicorn valuation was set exclusively by existing shareholders and
      employees — making it a self-assessed mark with no independent institutional validation.
      Until the Phase 2 external raise closes, the €1B price should be treated as an aspirational
      anchor, not a market-cleared value. This is the single most important caveat for any
      valuation analysis.
    claimRefs:
      - CV009
      - CV010

  - calloutType: assumption
    title: Revenue Mix Is the Critical Unknown
    body: >
      The justified EV/Revenue multiple for I-care ranges from ~2× (if hardware-heavy) to ~15×
      (if software/WaaS-heavy). I-care has never disclosed the split between hardware, WaaS
      subscription, software licences, and services. This single undisclosed fact drives a
      5–6× range in the defensible valuation. No quantitative valuation model can be validated
      without this information.
    claimRefs:
      - CV015
      - CV043

  - calloutType: insight
    title: Augury Comparable Validates Private Market Band
    body: >
      Augury, the closest US private-market comparable, raised $180M in a Series E round in
      February 2022 at approximately $1 billion valuation — virtually identical to I-care's
      December 2025 mark. That both companies reached the unicorn threshold at similar scales
      in the industrial AI / predictive maintenance space supports the thesis that I-care's
      pricing is within the range of what the private market has been willing to pay for leading
      platforms, even as public market multiples compressed since 2022.
    claimRefs:
      - CV023
      - CV024

