chapter:
  number: 8
  title: Valuation
  summary: >
    I-care Group achieved a €1 billion ($1.16 billion) post-money valuation in December 2025 through
    a $23.2 million insider-only refinancing round, implying an EV/Revenue multiple of approximately
    9–10× on 2024 consolidated revenue of €74 million and ~8–9× on the annualized 2025 run-rate of
    over $116 million. The multiple sits above industrial-hardware peers (SKF: ~1–2×) but below
    pure-play industrial-AI software benchmarks (AspenTech: ~15–20×), reflecting I-care's mixed
    hardware-software-services model and ongoing losses. The most significant valuation risk is the
    absence of external price discovery (the unicorn round was insider-only), the deferred IPO
    (postponed from 2025 to at least 2027), and the undisclosed revenue-mix split that governs which
    multiple range is appropriate. A base case of €1.5–2B at IPO is plausible if software/WaaS
    penetration reaches 40–50% of revenue by 2027; a bear case of €600–800M arises if growth slows,
    the external raise is delayed, and macro conditions remain unfavorable.

sections:
  - id: investment-thesis-and-anti-thesis
    title: Investment Thesis and Anti-Thesis
    body: >
      I-care's investment thesis rests on three interlocking pillars. First, it operates in a
      structural growth market: the global predictive maintenance market was valued at USD 14.2
      billion in 2025 and is projected to reach USD 98.1 billion by 2033 at a 27.9% CAGR, with
      vibration monitoring — I-care's core technique — holding the largest segment share. Second,
      I-care has demonstrated durable revenue momentum: from less than €10 million at founding to
      €74 million in 2024 (15% YoY growth) and over $116 million by December 2025 (roughly 40–50%
      YoY acceleration), supported by an order book of $232 million that provides meaningful
      near-term revenue visibility. Third, the company's integrated end-to-end stack — proprietary
      Wi-care™ hardware, I-see™ AI platform, and 600+ field engineers — creates switching costs
      that pure-software or pure-hardware competitors cannot easily replicate.

      The anti-thesis centres on valuation opacity and model transition risk. The December 2025 €1B
      valuation was set by an insider-only round of existing shareholders and employees — no external
      investor validated the price, making it a self-assessed mark rather than a market-cleared price.
      I-care remains loss-making (€8.2 million net loss in 2024 on €74 million revenue), and the
      revenue composition between hardware sales, SaaS subscriptions, and time-and-materials
      services has never been disclosed — a critical omission because the justified multiple depends
      strongly on the software/recurring share. The WaaS transition aspiration (90% of assets on
      subscription within five years of the 2022 Series C) implies the model is still mid-transition
      and hardware-heavy revenues dominate today. Finally, the planned 2025 IPO was postponed, the
      Phase 2 external raise has not been announced as closed as of June 2026, and a prolonged
      adverse IPO window could force a lower-priced round or compromise investor returns.
