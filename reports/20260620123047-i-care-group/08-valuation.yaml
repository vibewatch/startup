  - id: exit-readiness-and-capital-structure
    title: Exit Readiness and Capital Structure
    body: >
      I-care's stated exit path is an IPO on a Belgian or European exchange, targeted to raise at
      least €100 million. The company had publicly announced a 2025 IPO target but postponed it
      in spring 2025, citing "geopolitical and global economic instability" stemming from US tariff
      disruptions. As of June 2026, no new IPO date has been announced; the company's three-phase
      plan positions the 2026 external raise as a precursor to the IPO (Phase 3). The delay reflects
      both external macro conditions and, likely, internal readiness: the company needs to demonstrate
      EBITDA positive trajectory and ideally disclose segment-level revenue mix to be IPO-credible
      for institutional investors.

      The capital structure as of December 2025 includes: co-founders holding ~72% of shares,
      employees ~8%, and four reference shareholders (Finasucre, Wallonie Entreprendre (~10%),
      CPH Bank, IMBC, Amerigo) holding the remaining ~20% combined. Preference stack details and
      anti-dilution rights have not been publicly disclosed. The December 2025 insider round was
      framed as both a fundraise and a refinancing of the March 2025 SDT International acquisition,
      suggesting it partially addressed balance-sheet liquidity rather than purely growth capital.

      Strategic acquisition by an industrial conglomerate (Emerson, ABB, Honeywell, Siemens, SKF)
      represents a plausible alternative exit that would likely command a premium to the IPO path
      given strategic synergies — particularly if the suitor seeks to add a complete sensor-to-AI
      predictive maintenance stack. The co-founders' 72% stake means they have veto power over any
      deal, and founder-led exits often occur only at substantial premiums to public market value.
      Secondary private-equity buyout is a tertiary path but would be dilutive given preference
      overhangs and the capital intensity of the manufacturing and services operations.
