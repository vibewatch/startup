  - id: valuation-context-and-multiples
    title: Valuation Context and Implied Multiples
    body: >
      I-care's €1 billion post-money valuation was anchored to a $23.2 million fundraising and
      refinancing round completed in December 2025 and reserved exclusively for existing shareholders
      and employees. The official BusinessWire press release confirmed the post-money valuation as
      €1 billion ($1.16 billion at the prevailing exchange rate). At 2024 consolidated revenue of
      €74 million, the implied EV/Revenue multiple is approximately 13.5×. Adjusting to the
      annualized December 2025 run-rate of over $116 million (approximately €100–110 million),
      the implied multiple compresses to approximately 9–11× — consistent with the range commanded
      by industrial software companies with demonstrated recurring revenue and above 20% growth.

      The 2022 Series C ("Eau Rouge") raised $50 million from Finasucre, CPH Bank, IMBC, Wallonie
      Entreprendre, and Amerigo Fund. The Silicon Valley Invest Club estimated the implied Series C
      post-money valuation at approximately $550 million; at an implied 2022 revenue base of
      approximately €35–40 million (working back from 2024's €74M at 15% CAGR), this implies an
      EV/Revenue multiple of roughly 12–14× in 2022. The multiple has thus compressed from ~13x
      (Series C) to ~9–11× (unicorn round), a pattern consistent with broader private-market
      multiple compression since 2022 and with the company's growing revenue base.

      For context, the capital-intensive Belgian holding entity I-CARE HOLDING carries approximately
      €82.7 million in registered share capital and €69.2 million in equity (2023 filing), reflecting
      the cumulative capital injected over the company's 20-year history. These are balance-sheet
      equity figures, not valuations; the €1B mark-to-market reflects a substantial premium to book
      value (~12–14× book), typical of high-growth technology businesses.
