  - id: comparable-set
    title: Comparable Valuation Set
    body: >
      I-care sits at an intersection of industrial hardware, industrial IoT software, and field
      services — meaning no single public or private comparable captures the full model. The most
      relevant public comps span a wide band: asset-heavy industrial conglomerates with embedded
      condition monitoring (SKF: EV/Revenue ~1–2×) to pure-play industrial AI software platforms
      (AspenTech: EV/Revenue ~15–20×). PTC, whose portfolio spans industrial IoT (ThingWorx),
      CAD, and PLM software with strong recurring revenue, is probably the closest listed comparator
      with a mix of hardware-agnostic software and services; PTC traded at roughly 7–10× EV/Revenue
      in 2024–2025. Rockwell Automation, which has a heavy services and automation hardware base,
      traded at approximately 3–4× EV/Revenue during the same period.

      On the private side, Augury is the most directly comparable: it is an industrial AI company
      focused on machine health, raised $180 million in a Series E round in February 2022, and was
      reported to have achieved unicorn status at approximately $1 billion valuation — essentially
      the same mark as I-care. Augury's revenue was not publicly disclosed but the comparable
      fundraise and valuation support the thesis that I-care's €1B valuation is within the private
      market band for leading industrial AI / predictive-maintenance platforms.

      The comparable set reveals that I-care's ~9–11× EV/Revenue (on 2025 run-rate) is a premium
      to hardware-centric industrial peers but a discount to pure software. The appropriate anchor
      multiple depends on the mix of WaaS subscription revenue versus one-time hardware versus
      time-and-materials services — a split that I-care has never disclosed. If WaaS/subscription
      revenue represents only 20–30% of total revenue today, a blended multiple of 5–8× would be
      more defensible; if it reaches 50%+ by 2027, 10–15× becomes plausible at IPO.
    claimRefs:
