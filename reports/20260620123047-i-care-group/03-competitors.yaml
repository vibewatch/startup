      Coverage ratings based on publicly stated product capabilities as of June 2026. "Partial" = feature exists but is not core emphasis. "?" = not confirmed from available public sources (evidence gap). These are not third-party benchmark results. The capability breadth pattern across rows—showing I-care and Emerson as the broadest, vs. Augury/Senseye as software-only—is the distinct analytical lens this figure adds to the tabular capability comparison.
