    layout: standard
    summary: >
      I-care's integrated stack, ATEX reach, and services layer are genuine moat contributors; hardware commoditization and enterprise-channel gap represent the weakest positions. Scores are qualitative ordinal assessments (1=weak, 5=strong) relative to direct competitors.
