summary:
  headline: >
    I-care Group is a credible global PdM leader with proven technology, strong revenue momentum, and a $232M+ order
    book—but the insider-only unicorn valuation, ongoing losses, deferred IPO, and opaque revenue mix justify a "track"
    stance until the Phase 2 external raise provides independent price discovery and WaaS transition progress is
    quantified.
