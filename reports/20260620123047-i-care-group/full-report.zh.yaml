      - number: '4.2'
        title: 历史收入增长与牵引力
        blocks:
          - type: paragraph
            body: >
              I-care 自 2004 年成立以来一直保持两位数收入增长。公司称，截至 2021 年的 17 年里， 年均收入增长约 35%（来自创始人在 2020 年 EY Company of the Year
              奖项上的表述）。2024 财年， 集团披露合并收入 €74 million，较 2023 年增长 15%——相比历史增速放缓，符合基数变大和吸收并购整合成本后的状态。 2024 年净亏损 €8.2
              million，说明公司仍处投资期亏损，而非基本单元经济性不可行；不过公开资料没有足够细的利润率数据来验证这一判断。

              到 2025 年 12 月独角兽公告时，I-care 披露合并年收入超过 $116 million（按当时汇率约 €105–110 million）， 管理层还称仅 2025 年 4 月增长就达 25%。这意味着
              2025 全年收入可能较 2024 年 €74 million 基数增长约 40-50%，驱动因素包括 SDT International 收购、制造工厂带来的传感器产量爬坡，以及 WaaS
              订阅扩张。同日订单储备超过 $232 million（超过 €200 million），约为年化收入的 2×；这是健康的多年需求信号， 降低了近期收入可见性的风险。

              I-care 投资者页面公开写有经常性收入占比，但数值没有以可访问形式渲染；公司叙事一直强调经常性收入贡献在增长， 却没有给出精确拆分。2022 年 Series C 时，I-care 监测约 50,000
              个传感器；到 2025 年 12 月达到 150,000+，约三年扩大 3×。每个传感器端点收入是无法验证的私有指标，但若 WaaS 转化率确实上升， 方向上支撑收入增长轨迹。
