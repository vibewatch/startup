            - 工程师流失
            - 半导体交期挤压
    approximationNotes: |
      基于公开证据由分析师确定位置；公司未披露内部风险登记册。按固有严重性（缓释前）看，制造中断和监管执法会抬升至高风险行。该图不暗示任何定量概率分布。
