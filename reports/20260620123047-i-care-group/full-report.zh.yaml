  - id: TU006
    title: 客户交付模式和服务负担矩阵
    columns:
      - 交付模式
      - I-care 职责
      - 客户职责
      - 典型用例
      - 利润率含义
    rows:
      - - 完全外包（托管 PdM）
        - 全部传感器、软件、监测、分析、工程师上门、报告
        - 界定范围；执行建议；授予现场访问权限
        - 需要完整可靠性外包的大型企业；内部 PdM 专业能力有限
        - 单账户收入高；人工成本高（600+ 名工程师）；规模扩大后存在利润率天花板风险
      - - 共同管理
        - 传感器、I-see 平台、专家分析支持；补充客户团队
        - 客户工程师负责一线监测；复杂分析升级给 I-care 专家
        - 具备部分内部能力的中型运营方
        - 服务负担中等；硬件 + 软件 + 选择性服务混合
      - - 咨询（可靠性工程）
        - 咨询、培训、项目设计；RCL、RCA、以可靠性为中心的润滑设计
        - 客户在 I-care 指导下负责执行
        - 内部团队强、希望提升方法论的客户
        - 单账户人工投入较低；咨询型利润率结构；Technical Associates 负责培训
      - - Wi-care as a Service（WaaS，服务模式）
        - 传感器硬件订阅（租赁而非购买）；包含 I-see 平台；监测和告警
        - 支付月度 / 年度订阅费；自行决定结果处置
        - 资本受限运营方；新传感器部署；现金保全模式
        - 经常性、类 SaaS 收入；降低前期 CAPEX 门槛；LTV 可能更高
      - - 混合 / 框架协议
        - 在上述任意组合中定制打包；按站点或区域界定范围
        - 通过 RFP 采购；多年商业框架；按区域逐步铺开
        - 全球企业（全球食品龙头、石油天然气巨头、ADM）
        - 账户价值最高；销售周期最长；需要专属客户管理
    notes: |
      交付模式根据案例研究描述和 I-care 网站产品页推断。利润率结构为分析师估算；公司未披露各模式具体利润率。Wi-care as a Service 是公司披露的战略方向（目标是 90%+ 资产采用订阅模式）。
    claimRefs:
      - CU024
      - CU029
  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 监管 / 义务
      - 司法辖区
      - 状态
      - 影响可能性
      - 严重性
      - 缓释措施
      - 剩余暴露
      - 尽调路径
    rows:
      - - EU AI Act（Reg. 2024/1689）—— 安全关键环境中故障预测系统的高风险 AI 系统义务
        - 欧盟全境
        - 已生效；高风险义务自 Aug 2026 起适用
        - 高 —— I-see 平台为 ATEX / 石油天然气 / 化工资产预测故障
        - 高 —— 合格评定、EU AI 数据库注册、技术文档、人类监督要求；罚款最高 €30M 或全球营业额 6%
        - 未公开披露 AI Act 分类或合规路线图
        - 高 —— 全部适用范围未确认；合格评定状态未知
        - 确认 Article 6 / Annex III 分类；向法务团队索取合规路线图；Aug 2026 后检查 EU AI 数据库
      - - NIS2 Directive（2022/2555）—— 关键产品制造商的网络安全风险管理和事件报告
        - 比利时 / 欧盟全境
        - 2024 年 10 月转化为比利时法律；CCB 为监管机构
        - 高 —— Wi-care 传感器制造和 I-see 平台符合关键基础设施属性
        - 高 —— 24/72 小时事件报告；管理层责任；行政罚款
        - 已获 ISO 27001 认证；设专职 Performance and Compliance Officer（Guido Verrept）
        - 重大 —— 未公开确认向 CCB 完成 NIS2 注册；ISO 27001 范围和审计频率未披露
        - 索取 CCB 实体注册确认；验证事件响应手册和 NIS2 通知演练记录
      - - ATEX Directive（2014/34/EU）—— 潜在爆炸性环境中的设备和保护系统
        - 欧盟全境 / 全球按引用采纳
        - 已生效；Wi-care 传感器目前获 ATEX Zone 1/2 认证
        - 中 —— 硬件修订需要重新通过公告机构认证
        - 中 —— 爆炸性环境事故中的产品责任暴露可能是灾难性；重新认证会拖慢开发周期
        - 已具备 ATEX 认证；I-care Electronics 制造能力支撑合规
        - 中 —— 未披露证书编号、公告机构身份和修订政策
        - 索取 ATEX 证书编号、公告机构身份和硬件修订政策
      - - GDPR（EU 2016/679）—— 个人数据处理，包括 I-see 平台及 55+ 个国家中的操作员元数据
        - 欧盟全境及适用司法辖区
        - 已生效；I-care 隐私政策最后更新于 Sep 2022 —— 早于 Mar 2025 收购 SDT
        - 中 —— I-see 可能在多国部署中处理可关联员工的运营元数据
        - 中 —— 比利时 APD 执法；罚款最高为全球营业额 4%
        - 已指定 Privacy Manager；GDPR 处理目的有文档记录
        - 中 —— 隐私政策未更新以覆盖 SDT 数据流；新超声数据流的 DPIA 状态未知
        - 索取覆盖 SDT 数据流的更新版 DPIA；确认各司法辖区的 DPA 注册和标准合同条款
      - - 产品责任 —— 安全关键旋转资产上的传感器故障或 AI 模型错误
        - 全部运营司法辖区
        - 截至 2026-06-20，公开记录未发现诉讼
        - 低至中 —— 关键资产故障预测错误天然存在；未发现负面记录
        - 一旦触发则高 —— 人身伤害、财产损失、运营停摆、声誉受损
        - ATEX 认证和 ISO 27001 是部分缓释；有人类专家复核层
        - 低至中 —— 未披露产品责任保险条款、保额上限和职业赔偿细节
        - 索取产品责任和职业赔偿保险保单，以及历史索赔记录
    notes: |
      各行按严重性由高到低排序。所有状态评估基于截至 2026-06-20 已审阅的公开监管文本和公司披露。缓释成熟度和剩余暴露为分析师判断；公司合规状态尚未经独立审计。所列罚款反映欧盟监管最高值，可能因司法辖区而异。
    enumerationScope:
      coverage: partial
      basis: >
        Five highest-severity regulatory and legal risks identified from EU regulatory databases (EUR-Lex, European
        Commission), Belgian cybersecurity authority (CCB) publications, and I-care public disclosures as of June 2026.
        Excludes local tax, employment law, and export-control regimes.
