  - id: FU001
    title: I-care 客户可靠性旅程图
    type: journey-map
    layout: wide
    summary: |
      五阶段客户可靠性旅程，从初次接触到多站点锚定账户，展示 I-care 在食品、化工、油气、海事和采矿垂直领域的 land-and-expand 路径。
    data:
      items:
        - label: 阶段 1 — 发现 / RFP
          description: 客户识别可靠性缺口；发起供应商 RFP（BASF 测试了 20+ 套系统；ADM 发起全球 RFP）；I-care 凭传感器准确度、响应时间和服务网络胜出
        - label: 阶段 2 — 关键资产试点
          description: 先在最高风险旋转资产上部署传感器（压缩机、泵、磨机轴承）；I-see 监测上线；部署数周内建立首个 ROI 案例
        - label: 阶段 3 — 生产验证
          description: 早期检出转化怀疑者；启动 CMMS 集成（MVP One、DimoMaint）；设计润滑项目；开始多技术扩展
        - label: 阶段 4 — 多站点框架
          description: 企业可靠性负责人要求推广；Wi-care 传感器订阅跨站点扩张；本地 I-care 团队嵌入；基准对比仪表盘上线
        - label: 阶段 5 — 锚定伙伴关系
          description: 叠加更多服务（热成像、润滑、收购 SDT 后的超声）；续签长期框架；推进 WaaS 转化；获得 ADM Safety Award
    approximationNotes: |
      阶段描述基于案例研究中的证据模式；并非所有客户都遵循同一阶段顺序。采矿和制药板块仅有有限案例证据支撑。
