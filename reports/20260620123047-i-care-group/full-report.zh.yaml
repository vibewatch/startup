      - number: '3.4'
        title: 能力矩阵与定价比较
        blocks:
          - type: paragraph
            body: >
              当采购标准同时要求硬件完整性和专家解读时，I-care 的端到端栈能拿到溢价。竞争对手分化明显：OEM 既有厂商（SKF、Emerson、Fluke）硬件深度和装机信任强，但软件-only
              部署能力较弱；AI-first 供应商（Augury、Senseye、Nanoprecise）在分析可扩展性和订阅经济性上突出，但缺少内部传感器制造或深厚现场服务资源。 下方功能矩阵反映公开披露能力（标 “?”
              的条目表示研究时点公开来源未确认；标 “No” 的条目表示基于产品定位明确缺失）。

              该领域所有竞争对手的定价大多不公开。I-care 未披露标价。Augury 的定价模型通常被理解为按监测资产或机器健康端点收费的软件订阅，大型企业合同则单独谈判。Fluke Reliability
              结合硬件销售（Prüftechnik 仪器）、eMaint SaaS 订阅和 Azima DLI 服务合同。 Emerson 的 APM 平台定价由企业合同驱动，并与 DCS
              安装规模紧密绑定。Nanoprecise 未公开披露定价。SKF 销售状态监测硬件和软件模块，批量折扣与轴承采购关系挂钩。

              I-care 的 Wi-care as a Service 模式具有战略意义：它把经常性收入从硬件销售转向订阅端点，让 I-care 靠近 Augury
              的软件经济模型，同时保留自有传感器带来的硬件锁定和数据丰富度优势。 转型风险是转换期利润率受压，尤其在资本密集型制造语境下，如果硬件毛利率高于早期 SaaS 毛利率，压力会更明显。
            claimRefs:
