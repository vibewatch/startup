      - number: '2.5'
        title: 垂直行业采用画像
        blocks:
          - type: paragraph
            body: >
              各垂直行业采用深度差异很大，受设备关键性、监管环境、预算结构和维护文化共同塑造。能源和公用事业是增长最快的板块，估计 CAGR 为 34.6%（Mordor Intelligence
              2026），由可再生能源扩张、智能电网部署和能源危机后的效率要求推动。 风机传动链监测和电厂旋转设备保护是高价值用例，避免非计划停机带来的 ROI 清晰。


              油气是当前收入最高的垂直行业，驱动因素包括极高的资产关键性（危险环境中的压缩机、泵、涡轮）、监管检查要求，以及企业愿意为可靠性数据支付溢价。I-care 的 Wi-care 这类符合 ATEX
              的无线传感器是该板块的先决条件。 不过油价下行时，该行业会周期性压缩资本预算，从而暂停 PdM 投资周期。


              水务和污水处理是一个新兴板块，采用周期仍很长。北美和欧洲的基础设施更新计划，正推动泵站、处理厂曝气设备和配水基础设施安装智能监测。预算受公共资金周期和公用事业费率审查时间表约束，但关键服务中的资产可靠性监管要求，让商业论证更持久。
              金属和采矿采用在增长，但仍不均衡；连续采矿设备（破碎机、输送机、球磨机）优先级高，二级设备则被放在后面。离散制造是资产数量最大的垂直行业——可寻址资产数以百万计——但设备群异质、维护团队分散，使标准化 PdM
              更难大规模销售和部署。 整体工业制造在 2025 年 PdM 市场收入中占 22.95%（Mordor Intelligence）。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM031
              - CM034
      - number: '2.6'
        title: 规模测算缺口与未决尽调问题
        blocks:
          - type: paragraph
            body: >
              几个重要缺口限制了本次市场测算的精度。第一，主要分析机构没有发布各垂直行业渗透率；能源和油气 10–25%、水务和金属 5–15%、制造业 8–20% 的估计，是基于采用调查和一线报告的经验判断，不是经审计统计。
              缺少可靠渗透率数据，I-care 特定垂直行业的 SAM 计算带有 ±50% 不确定性。


              第二，I-care 的 SAM 计算被多产品属性复杂化：振动传感器、超声仪器、AI 分析平台和可靠性咨询服务的总市场，分析师分别计数。直接相加会有重复计算风险；只取其中一个又会漏掉 I-care 的一体化模式。
              按 I-care 目标垂直行业的旋转资产数量、每项资产年均支出和 I-care 平均交易经济性自下而上计算，会更可靠，但需要非公开运营数据。


              第三，分析师对同一基准年 TAM 的估计差异巨大（$9–19B），反映的是哪些支出算“预测性”、哪些算“预防性”的真实分歧，而不只是统计噪音。投资者若用最高可得数字锚定估值倍数，应大幅折扣以反映边界风险。
              最窄可信估计（仅状态监测硬件，2024 年 $3.1B）与最宽估计（完整 PdM 软件 + 服务 + 硬件，2026 年 $19B+）之间相差 8–9×。I-care
              实际服务的市场位于中间，具体能拿下哪一部分，取决于竞争格局章节讨论的竞争动态。
            claimRefs:
              - CM006
              - CM037
              - CM007
              - CM008
              - CM036
      - number: '2.7'
        title: 图表
        blocks:
          - type: callout
            title: 市场边界是 PdM 可比公司估值的首要风险
            body: >
              分析师对同一基准年的 TAM 估计相差 2–3×，主要因为边界选择，而非数据质量。投资者若用 $17–19B TAM（Mordor/GVR）锚定估值倍数，或用 $3.1B 硬件-only
              状态监测子市场锚定，将得到截然不同的隐含渗透率。 I-care 的一体化模式横跨三层（硬件 + 软件 + 服务），因此真实 TAM 位于狭义硬件估计与广义软件 +
              服务估计之间；但具体落点是尽调判断，不是任何单一分析师报告能给出的数字。
            calloutType: insight
            claimRefs:
              - CM006
              - CM037
          - type: callout
            title: 试点陷阱威胁 SAM 兑现：70% 数字化转型项目未能规模化
            body: >
              McKinsey 关于 Industry 4.0 采用的研究发现，70% 的数字化转型项目未能达成既定目标，只有 44% 的制造商做到全站点实施。放到 PdM
              语境里，这意味着跑试点的站点数量与完成企业级部署的站点数量之间差距很大。 应分析 I-care 管线中的试点到全企业转换率；如果试点数量高但转换率低，有效 SAM 会明显小于理论 SAM。
            calloutType: risk
            claimRefs:
              - CM026
              - CM027
              - CM039
          - type: callout
            title: ESG 与能源要求在能源和公用事业中创造持久预算拉力
            body: >
              能源和公用事业预计将成为增长最快的 PdM 垂直行业，到 2031 年 CAGR 为 34.6%（Mordor Intelligence），驱动因素包括风电场扩张、电网韧性要求，以及 ESG
              报告要求提供有记录的资产可靠性证据。 这类结构性需求比一般 capex 支出更少自由裁量，也创造了更持久的采购环境。I-care 的 ATEX 合规和 16
              国覆盖，让其在监管要求最严格的欧洲和中东能源市场位置较好。
            calloutType: strength
