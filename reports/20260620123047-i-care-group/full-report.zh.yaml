  - id: FE001
    title: I-care 产品架构栈
    type: stack
    layout: wide
    summary: |
      七层垂直整合栈，从自有 IoT 传感器到专家现场服务，展示 I-care 的端到端所有权模式和关键组件依赖。
    data:
      layers:
        - label: 第 1 层：硬件传感
          modules:
            - Wi-care™ 三轴振动 + 温度传感器（ATEX Zone 1/2 认证；Wi-care 130 G23 旗舰款；Wi-care Pure 简化款）
            - SDT 超声仪器（SDT340、SDT270、SDT200、LUBExpert、CHECKER 系列、Vigilant 永久监测、CRYSOUND）
        - label: 第 2 层：连接
          modules:
            - 使用原生 IoT 协议的无线 IoT 网关
            - 客户网络（WiFi / 蜂窝 / 有线兜底）
        - label: 第 3 层：数据存储
          modules:
            - I-see™ 自有 noSQL 云数据库
            - 实时高容量数据接入管线（每天数百万个数据点）
        - label: 第 4 层：AI / ML 分析
          modules:
            - ML 故障预测模型（用 150,000+ 个传感器端点训练）
            - 三状态 AI 数据分类（健康 / 潜在问题 / 关键告警）
            - 自动化传感器基础设施健康监测（电池、故障、网关）
        - label: 第 5 层：应用 / UX
          modules:
            - I-see™ 网页仪表盘，提供资产 / 工厂 / 全球层级视图
            - I-see™ 移动应用（实时告警、节省跟踪、即时通知）
        - label: 第 6 层：集成
          modules:
            - 开放 API — 连接 MVP One、DimoMaint、Mainti4 的 CMMS 连接器
            - AVEVA PI System 集成（过程历史数据）
            - Oracle 合作伙伴计划；Filtertechnik 和 POLARIS Laboratories 数据连接
        - label: 第 7 层：专家服务
          modules:
            - 600+ 名现场工程师 — 振动分析、超声、油 / 润滑脂、IR 热成像、电机电路分析、运动放大
            - Technical Associates（可靠性培训、ISO Cat 1 超声认证）
            - Mecotec（校准、确认、面向制药 / 洁净室的 Industry 4.0）
    approximationNotes: |
      架构根据产品页面、新闻稿和合作伙伴公告推断。内部组件细节（芯片供应商、网关硬件、云服务商）属于专有信息。
