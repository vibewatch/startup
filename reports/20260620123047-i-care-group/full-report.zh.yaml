      - number: '3.3'
        title: 纯 AI 与软件预测性维护供应商
        blocks:
          - type: paragraph
            body: >
              在纯软件 / AI 供应商中，Augury（纽约，2011 年创立）是 I-care 获融资最多的直接竞争对手。它完成 $180 million Series E，成为首批工业 AI 独角兽之一；其关于页面援引
              Forrester Total Economic Impact 研究，把结果量化为 310% ROI。截至访问时点（2026 年 6 月），Augury 称其客户包括 170+ 家全球制造商、20+ 家
              Fortune 500 公司，并覆盖 40+ 个国家。Augury 博客引用 Verdantix 模型，预计工业 AI 分析软件将从 2025 年 $3.2 billion 增长到 2031 年 $9.3
              billion，这正是 Augury 明确瞄准的市场。Augury 产品是软件优先：它不制造自有传感器，而是处理现有传感器（振动、温度、超声）或第三方硬件的数据。 Augury 被 Verdantix 2025
              Green Quadrant for Industrial AI Analytics Software 评为 Leader，是 19 家参评供应商中获得该称号的 9 家之一。相对
              I-care，它的主要限制是没有现场服务层，并依赖客户侧传感器基础设施和 IT 集成能力。

              Siemens 收购英国 Senseye 后，以 Siemens 品牌销售 “Senseye Predictive Maintenance”。Siemens Senseye 平台被描述为结合工业
              AI、领域专业知识和可扩展技术，帮助维护团队评估资产健康、预判故障风险，并在不依赖人工专家分析的情况下优先安排干预。 目标垂直行业包括汽车、流程工业和离散制造。被引用的客户部署包括澳大利亚 BlueScope
              Steel，该公司用 Senseye 跟踪资产绩效并为工程师生成每日案例报告；以及德国 Sachsenmilch，据称 AI/ML 平台提升了工厂可用性并降低维护成本。 Siemens
              的分销优势——全球自动化渠道和 MindSphere 工业 IoT 生态——让 Senseye 能触达 I-care 直销队伍无法同规模覆盖的企业客户。

              Nanoprecise Sci Corp（2017 年 4 月创立于加拿大 Edmonton，创始人为 Prashant Verma 和 Sunil Vedula）是一家自动化 AI
              预测性维护供应商，聚焦能源中心型 PdM。Nanoprecise 传感器使用蜂窝或 WiFi 连接，便于规模化部署，公司持有 SOC 2 Type 2 认证。Nanoprecise 因高速增长入选
              Deloitte 2025 Technology Fast 500 第 151 位，也获得 Deloitte 2025 Technology Fast 50 认可。其最后披露的融资类型为债务融资（据
              Crunchbase），说明它尚未进行大型股权融资。

              Falkonry（Silicon Valley）把自己定位为面向制造、能源、设施和 IT / 无人系统运营的 Time Series AI Platform。Falkonry
              对市场的核心批评是“阈值陷阱”——静态阈值监测既无法防止意外停机，又会制造警报疲劳。 Falkonry 的 agentic AI 定位瞄准 IT 与 OT 运营融合，因此它更多是在与更广义的工业 AI
              平台竞争，而非只与振动聚焦型 PdM 竞争。Rockwell Automation 的 The Connected Enterprise® 战略把状态监测整合进制造运营管理和 IIoT 组合，主要服务现有
              Rockwell PLC/SCADA 客户。
