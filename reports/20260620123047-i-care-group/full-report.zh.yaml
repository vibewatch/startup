        - €1B 估值缺少外部价格发现——仅限内部人轮次
        - 2025 年 12 月轮次仅面向现有股东 / 员工；没有机构外部验证
        - Phase 2 外部融资以 €1B+ post-money 完成，并由蓝筹机构领投
      - - 反向逻辑
        - 收入结构未披露；硬件占比高的模式支持更低倍数
        - 硬件、软件、服务拆分从未披露；600+ 名现场工程师意味着服务收入占比可观
        - 公司披露 WaaS ARR 超过总收入的 40%，且毛利率达到 70%+
      - - 反向逻辑
        - IPO 已推迟且没有确定重排时间；退出路径不确定
        - 2025 年 IPO 因 Trump 关税不稳定而推迟；未设定 2026 年 IPO 日期；Phase 2 融资尚未宣布交割
        - 正式宣布 IPO 日期，并已有主承销银行委任和监管申报推进
      - - 反向逻辑
        - 公司仍在亏损；资本依赖带来稀释风险
        - 2024 年净亏损 €8.2M；预计 2025 年末 / 2026 年初出现现金缺口（据 Belga）；需要 Phase 2 融资
        - 公司连续两个季度报告正 EBITDA，且 Phase 2 稀释极低
