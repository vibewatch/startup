              Augury 已服务 170+ 全球制造商，包括 20+ Fortune 500 公司，覆盖 40+ 国家，且不自己制造传感器。 这种软件优先模式比 I-care
              的硬件加服务打法扩张更快，也说明大型企业买家愿意接受第三方传感器集成。 I-care 若要打进 Fortune 500 账户，可能需要推出与软件解耦的商业方案，或建立显著的企业渠道伙伴关系。
