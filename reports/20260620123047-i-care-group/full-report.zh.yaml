  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与分层
        blocks:
          - type: paragraph
            body: >
              I-care Group 的竞争环境分为三层。传统 OEM 和仪器供应商——SKF、Emerson/AspenTech、Fluke Reliability（Prüftechnik + eMaint + Azima
              DLI）和 ABB——掌握旋转机械中的主导装机关系，也有数十年工程信誉，但历史上多把状态监测作为产品附加项，而非一体化订阅服务。 企业自动化平台——Siemens（通过收购 Senseye）、Rockwell
              Automation 和 GE Vernova——借既有工业软件渠道延伸到预测性维护，并受益于企业采购锁定。纯 AI/IoT 专业厂商——以 Augury（工业 AI 独角兽）、 Nanoprecise Sci
              Corp 和 Falkonry 为代表——主打软件智能、快速部署和更低进入门槛定价；多数没有自有硬件，依赖第三方传感器集成或客户自有连接。

              面对三层竞争者，I-care 的主要差异化在于它有意把完整 PdM 栈垂直化：内部制造传感器（Wi-care 日产能最高 2,000 台），用行业内最大的自有 PdM 数据集之一训练 AI 模型（150,000+
              个传感器端点），并部署 600+ 名现场工程师提供一线可靠性服务。Augury 关于页面称，工业 AI 分析软件市场将从 2025 年的 $3.2 billion 增长到 2031 年约 $9.3
              billion，CAGR 约 20%（Augury 引用 Verdantix 建模），说明市场足够容纳多个赢家，也足够丰厚，会吸引 OEM 反向投资。
              占主导的竞争替代品仍是现状做法：周期性人工振动巡检、定期预防性维护间隔、非关键资产的故障后运行策略——这些做法只需要手持仪器，甚至完全不需要技术。

              买方格局增加了复杂度。大型企业（Fortune 500）的采购决策通常走自动化或 IT
              采购流程，这有利于既有品牌（SKF、Emerson、Siemens）或在垂直领域占主导的平台。中端工业工厂的决策往往由可靠性或维护经理掌握，他们重视服务响应和硬件简单性——在这种买方画像中，I-care
              的一体化栈和专家服务叠加更能竞争。 I-care 16 国布局比 Augury 40+ 国覆盖或 OEM 对手的全球分销网络更窄。
