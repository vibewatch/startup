  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品与服务组合定义
        blocks:
          - type: paragraph
            body: >
              I-care 通过一个垂直整合堆栈交付工业预测性维护，商业上分三层：（1）自有硬件——Wi-care™ 无线 IoT 传感器系列，以及 2025 年 3 月后纳入的 SDT International
              超声仪器；（2）I-see™ 云分析平台， 用 AI 处理传感器数据，并把可执行告警推入客户工作流；（3）专家服务，由 600+ 现场工程师执行实地检查、 路线式振动巡检和可靠性咨询。第四个商业包 “PdM as
              a Service” 把三层打包成一个订阅，把采购从资本开支转为运营开支。

              I-care 还拥有 Mecotec（比利时的校准与洁净室资质认证）、Technical Associates of Charlotte（美国）和 Technical Associates of
              Europe（欧洲），补上可靠性工程咨询和多技术培训。这个组合横跨可与商品化服务相比的环节 （IR 热成像、通过实验室伙伴做油液分析），也覆盖真正自有的技术（Wi-care 传感器、I-see AI 模型、SDT
              超声仪器）。 各层的 AI 原生自主程度差异很大：硬件和传感器交付接近规模化自动化，但故障诊断和维护建议仍高度依赖人工分析师审阅 AI 生成报告。
