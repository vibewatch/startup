      - number: '1.3'
        title: 产品与技术
        blocks:
          - type: paragraph
            body: >
              I-care 的硬件旗舰是 Wi-care™ 无线振动传感器，这是一款面向工业环境设计的专利 IoT 设备，也适用于爆炸性环境（符合 ATEX）。Wi-care 传感器连续测量振动和温度，并把数据传输到
              I-see™ 云平台。截至 2025 年 12 月，公司位于比利时的 Industry 4.0 制造设施日产能最高可达 2,000 个传感器，这一显著扩产支撑了快速部署和 Wi-care as a Service
              订阅模式。 2022 年 Series C 时，I-care 已部署约 50,000 个传感器；到 2025 年 12 月，I-see 平台监测的传感器端点超过 150,000 个。

              I-see™ 平台是一套 AI 驱动分析方案，整合多种预测性维护（PdM）技术的数据，包括振动分析、超声（通过 SDT International）、油 / 润滑脂分析、红外热成像和其他传感器流。 I-see
              使用机器学习模型，训练数据来自行业内最大的 PdM 数据集之一，可提前数月给出故障预测。开放 API 让 I-see 能接入第三方 CMMS 系统（如 MVP One、DimoMaint、Mainti4）。

              2025 年 3 月收购 SDT International（1975 年创立，总部位于比利时 Forest）后，I-care 产品组合加入全球领先的超声预测性维护能力，并首次在单一 I-see
              平台上整合振动和超声。 I-care 还通过 Technical Associates of Charlotte（美国）和 Technical Associates of Europe
              子公司提供可靠性工程咨询和培训。
            claimRefs:
              - CO015
              - CO016
              - CO017
              - CO018
              - CO019
              - CO020
              - CO021
      - number: '1.4'
        title: 融资与投资方
        blocks:
          - type: paragraph
            body: >
              自创立以来，I-care 经历了四个清晰融资阶段。公司 2004 年创立时自举启动。IMBC（Invest Mons Borinage Centre）约从 2007 年开始支持 I-care，是早期区域锚定资本。
              2017 年 1 月，I-care 完成约 $5.5 million Series B，投资方为 IMBC 和 SRIW（Société Régionale d'Investissement de
              Wallonie，现为 Wallonie Entreprendre）。 2022 年 9 月，标志性的 “Eau Rouge” Series C 融资 $50 million，由
              Finasucre（一家比利时大型家族工业集团，也是 I-care 客户）和 CPH Bank 领投，IMBC、 SRIW/Wallonie Entreprendre 与 Amerigo Fund
              参投；几个月前还有一轮 $10 million 员工轮注资。J.P. Morgan SE 是 Series C 的独家配售代理。

              2025 年 12 月，I-care 完成一轮面向现有股东和员工的 $23.2 million 融资与再融资，投后估值 €1 billion（按当时汇率约 $1.16 billion）。Tracxn
              估计四轮披露融资合计约 $72.6 million，不过员工轮和 2025 年融资把真实总额推高到 $80 million 以上。

              参考股东结构（合计持股 20%）包括 Finasucre、Wallonie Entreprendre（单独持有约 10%）、CPH Bank、IMBC 和 Amerigo Fund。联合创始人持股
              72%，员工持股 8%。 I-care 的三阶段发展计划设想在 2026 年启动一轮大型外部投资者融资（Phase 2），随后最终 IPO（Phase 3，最初目标为 2025 年，后推迟到至少
              2026–2027 年）。
