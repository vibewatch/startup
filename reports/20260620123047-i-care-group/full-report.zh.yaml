      - number: '7.5'
        title: M&A 整合、治理与执行风险
        blocks:
          - type: paragraph
            body: >
              I-care 八年内完成八笔收购，包括 Mecotec（校准）、Technical Associates of Charlotte（美国 PdM 服务）、I-care Electronics（传感器制造，原
              Cepya）、Technical Associates of Europe（欧盟培训）和 SDT International（超声，2025 年 3 月）。SDT
              收购规模最大、战略复杂度最高：两种不同传感技术（振动和超声）要并入统一的 I-see 平台，两套比利时工程文化要对齐，还要吸收 SDT 的全球超声分销网络。收购新闻稿明确称 SDT 将保留「operational
              autonomy」——这种双轨整合会推迟 IT 和数据平台完全合并，并在过渡期保留成本重复。SDT 收入、盈利能力、整合里程碑和商誉均未公开披露。此前七笔收购的整合时间表也未披露，因此无法判断历史 M&A
              是否已在新交易叠加前完全消化。

              治理集中是董事会层面的风险。Fabrice Brion 同时担任四个高级职务：I-care Group CEO 兼董事会主席、VP R&D，以及自 2025 年 3 月起担任 SDT International
              董事会主席。公开信息未披露继任计划、紧急授权协议或临时 VP R&D 任命。两位联合创始人持有 72% 股权，确保单边战略权力；六人董事会未公开披露审计委员会或薪酬委员会。执行带宽有限：管理层在 2026
              年同时推进 (a) WaaS 商业模式转型、(b) SDT 整合、(c) 传感器产量爬坡至每日 2,000 台、(d) 数千万欧元级外部融资，以及 (e) IPO
              准备。每条工作流都依赖外部资本市场、通知机构、分销商合同和监管方，也都存在期限风险。高管梯队（Deputy CEO、CFO、CGO、CHRO、Performance and Compliance
              Officer）在 Brion 之下提供职能深度，但公开来源没有出现具名继任者。
