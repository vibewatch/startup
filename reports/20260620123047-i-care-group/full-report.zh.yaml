      - number: '3.5'
        title: 护城河耐久性与切换成本评估
        blocks:
          - type: paragraph
            body: >
              I-care 的主要护城河来自四个来源：（1）规模化制造的自有传感器硬件（日产 2,000 台），带来数据飞轮优势，也让客户拆换成本变高；（2）Wi-care 传感器具备 ATEX
              合规，可在爆炸性环境（油气、石化）部署，软件-only 竞争对手若没有第三方硬件无法进入； （3）专家服务层——600+
              名工程师提供实地检查、润滑分析和热成像——形成黏性客户关系，纯软件竞争者很难复制；（4）一体化 I-see AI 平台用超过 150,000 个传感器端点训练，理论上会随着数据集扩大提升异常检测准确率。 已部署
              Wi-care 基础设施的客户切换成本较高：更换硬件、重新培训员工，还可能丢失历史振动基线。

              每项护城河的耐久性都存在争议。IoT 传感器商品化加速，会侵蚀硬件护城河：SKF 收购 G-Tech 和 ABB Ability Smart Sensor
              都在压缩硬件差异化。服务护城河很难有利润地规模化——600+ 名工程师意味着高固定成本基数，在当前收入水平下限制利润率扩张。 数据护城河需要持续投入 AI 模型准确率，才能领先 Augury（后者受益于 170+
              家制造商数据集，却没有硬件成本负担）。ATEX 护城河是真实的，但把可寻址市场收窄到确实需要该认证的行业。

              对把 I-see 与 CMMS 集成的客户（通过 API 接入 MVP One、DimoMaint 或 Mainti4），切换成本中等——类似任何中间件集成型 SaaS
              的切换成本。大型工厂资产组合多样，多栖使用是可能的：客户可以用 Augury 监测电机和冷水机，同时用 I-care 监测有爆炸风险的压缩机和旋转轴承。 分销权力不对称：Siemens、Emerson 和
              Rockwell 拥有企业级自动化采购关系，能触达 I-care 直销模式不易高效获取的 capex 预算。
            claimRefs:
              - CP036
              - CP037
              - CP038
              - CP039
