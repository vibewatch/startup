      - number: '5.4'
        title: 专家服务、SDT 超声与子公司能力
        blocks:
          - type: paragraph
            body: >
              I-care 的服务层覆盖六类 PdM 技术：振动分析（核心）、油脂分析、运动放大、红外热成像、超声和电机电路分析。 2025 年 3 月收购 SDT International——代号 “Harmonising
              Waves”——带来 50 年超声积累、全球分销网络， 以及包括 SDT340 旗舰仪器、LUBExpert 声学润滑指导系统、便携式 CHECKER 系列、永久监测方案（Vigilant、Online4US）
              和 CRYSOUND 声学成像在内的产品线。SDT 的 UAS3 分析软件计划与 I-see 收敛，为振动和超声诊断形成单一平台。

              服务交付有三种合同模式：完全外包（I-care 承担现场责任）、共同管理（I-care 补充客户团队）和顾问式 （I-care 指导客户自有可靠性项目）。这种灵活性是商业优势，也带来复杂性风险：要在 15
              个国家、35+ 办公室、 600+ 工程师之间保证质量一致并不容易；服务层劳动密集，压缩运营利润率。Mecotec 提供校准、资质认证和 Industry 4.0
              产线分析——主要在比利时和法国北部——为制药和洁净室客户补上合规级测量服务。 Technical Associates 在美国和欧洲交付多技术 PdM 培训和 ISO Category 1 超声认证。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE019
              - CE020
              - CE022
              - CE023
              - CE025
      - number: '5.5'
        title: 集成、部署与技术路线图
        blocks:
          - type: paragraph
            body: >
              I-see 的开放 API 连接 CMMS 系统；已确认的集成包括 MVP One、DimoMaint 和 Mainti4，可把 AI 生成告警自动转成工单，无需人工重复录入。除 CMMS 连接外，I-care
              还以 Managed Solution Provider 身份加入 AVEVA 伙伴生态，并把 AVEVA PI System 过程历史数据集成进 I-see，为已经运行 AVEVA
              基础设施的工厂打开入口。Oracle 伙伴计划成员身份，以及与 Filtertechnik（油液过滤分析）和 POLARIS Laboratories（流体分析）的集成，补齐第三方生态。

              没有发现公开 API 文档、SDK 或开发者门户；GitHub 搜索也没有返回 I-care 仓库——这些信号说明集成界面更像伙伴中介， 而非客户或第三方开发者可自助使用。客户若想做自定义数据流，或独立验证
              I-see 输出，会遇到摩擦。 技术路线图集中在三条线：（a）完成 SDT 超声与 I-see 软件收敛；（b）扩大 Wi-care as a Service 订阅覆盖（目标：超过 90%
              受监测资产进入经常性订阅）；（c）扩大传感器制造，以支撑增长中的部署基数。 2025 年行业奖项——Hannover Messe 的 Factory Innovation Award 和 The
              Reliability Conference 的 Solutions Award——为技术定位提供外部背书，但并不独立评估技术主张。
