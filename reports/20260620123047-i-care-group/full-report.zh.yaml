      - number: '7.4'
        title: 运营、供应链与制造风险
        blocks:
          - type: paragraph
            body: >
              I-care 的传感器制造策略——由 I-care Electronics 在比利时一座 Industry 4.0 工厂完全垂直整合生产——既是竞争差异点，也是地理集中风险。该工厂每天最多生产 2,000 个
              Wi-care 传感器，未披露第二生产基地或合同制造商备援。若比利时工厂发生火灾、洪水、劳资纠纷、监管停产或长期停电，所有新传感器生产都可能中断，短期没有替代方案，数周内就会把积压订单（$232 million
              订单簿）转化为递延收入风险。Wi-care 传感器物料清单包含来自未披露供应商的 MEMS 加速度计、RF 芯片组和微控制器；专用 MEMS 与 IoT
              芯片组全球交期较长，若供应分配被削减，又没有合格第二供应商，传感器产量可能被限制数月。European Chips Act（2023 年 9
              月通过）旨在长期降低欧盟半导体敞口，但无法消除来自非欧盟晶圆厂的近期采购风险。

              现场服务层——2022 年 Series C 时 600+ 名工程师，2025 年 3 月增至 850+，2025 年 12 月增至 1,000+——三年约增长
              67%。专业技术岗位人数快速扩张，容易削弱质量一致性，也会增加入职培训错误。I-care 在 16 个国家设有 36 个办公室，覆盖 West Africa 和
              APAC，带来跨境劳动法合规复杂性、地缘政治敞口，以及在 OEM 既有厂商（SKF、Emerson）积极争夺专业人才的市场中的员工留任风险。AI
              模型失效风险——假阴性（未发现即将发生的故障）或假阳性（误报停机警报）——在 ATEX 环境中更高，因为资产故障可能带来灾难性后果；公开信息未发现模型准确率、假阴性率或升级处理协议。
