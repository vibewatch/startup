  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资主线与反主线
        blocks:
          - type: paragraph
            body: >
              I-care 的投资主线建立在三个相互咬合的支柱上。第一，它所在市场具备结构性增长：全球预测性维护市场 2025 年规模为 USD 14.2 billion，预计 2033 年达到 USD 98.1
              billion，CAGR 为 27.9%；其中振动监测——I-care 的核心技术——占最大细分份额。第二，I-care 已证明收入动能具备韧性：从创立时低于 €10 million，到 2024 年 €74
              million（同比增长 15%），再到 2025 年 12 月超过 $116 million（同比增速大约加快至 40–50%），并由 $232 million
              订单簿支撑，带来有意义的近期收入可见性。第三，公司端到端一体化技术栈——自有 Wi-care™ 硬件、I-see™ AI 平台和 600+ 名现场工程师——形成切换成本，纯软件或纯硬件竞争对手不易复制。

              反主线集中在估值不透明和模式转型风险。2025 年 12 月 €1B 估值由现有股东和员工参与的内部人轮次确定——没有外部投资者验证价格，因此更像自评标记，而不是市场出清价格。I-care 仍在亏损（2024 年
              €74 million 收入对应 €8.2 million 净亏损），硬件销售、SaaS 订阅和工时材料服务之间的收入构成从未披露——这是关键缺口，因为合理倍数高度取决于软件 / 经常性收入占比。WaaS
              转型目标（2022 年 Series C 后五年内 90% 资产转为订阅）意味着模式仍处在中段，当前收入仍以硬件为重。最后，原计划 2025 年 IPO 已推迟，截至 2026 年 6 月 Phase 2
              外部融资尚未宣布完成；若 IPO 窗口长期不利，公司可能被迫以更低价格融资，或压缩投资者回报。
