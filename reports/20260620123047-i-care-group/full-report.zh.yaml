      - number: '8.2'
        title: 估值背景与隐含倍数
        blocks:
          - type: paragraph
            body: >
              I-care 的 €1 billion 投后估值锚定于 2025 年 12 月完成的一轮 $23.2 million 融资与再融资，该轮仅向现有股东和员工开放。官方 BusinessWire 新闻稿确认投后估值为
              €1 billion（按当时汇率为 $1.16 billion）。按 2024 年合并收入 €74 million 计算，隐含 EV/Revenue 约为 13.5×。若按 2025 年 12 月超过 $116
              million 的年化 run-rate 调整（约 €100–110 million），隐含倍数压缩至约 9–11×——与已证明经常性收入、增速超过 20% 的工业软件公司区间一致。

              2022 年 Series C（「Eau Rouge」）从 Finasucre、CPH Bank、IMBC、Wallonie Entreprendre 和 Amerigo Fund 融资 $50
              million。Silicon Valley Invest Club 估算 Series C 隐含投后估值约为 $550 million；按 2022 年隐含收入基数约 €35–40 million（由 2024
              年 €74M、15% CAGR 倒推），这意味着 2022 年 EV/Revenue 倍数约 12–14×。因此，倍数已从约 13x（Series C）压缩至约 9–11×（独角兽轮），这一模式既符合 2022
              年以来私募市场整体倍数压缩，也符合公司收入基数扩大后的结果。

              作为背景，资本密集型比利时控股实体 I-CARE HOLDING 拥有约 €82.7 million 注册股本和 €69.2 million 权益（2023 年文件），反映公司 20
              年历史中的累计资本投入。这些是资产负债表权益数字，不是估值；€1B 按市值标记相对账面价值有显著溢价（约 12–14× 账面），符合高增长科技企业常见特征。
