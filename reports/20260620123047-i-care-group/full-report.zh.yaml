      - number: '2.2'
        title: 市场规模：TAM、SAM 与相互矛盾的分析师估计
        blocks:
          - type: paragraph
            body: >
              PdM 市场没有单一权威 TAM 数字——分析师对 2025–2026 年的估计从 $9B 到 $19B 不等，跨度达 2×–2.5×，主要由范围差异驱动，而非统计分歧。
              MarketsandMarkets（2026 年 3 月）把 2026 年 PdM 市场定为 $13.89B，并预计 2031 年达到 $23.79B，CAGR 为
              11.4%；这是偏保守估计，因为它对哪些支出算预测性、哪些算预防性设了更严格边界。 Grand View Research（2025 年 6 月，经 Wayback archive）给出的基数更高：2025 年
              $14.2B、2026 年 $17.5B，并预计 2033 年达到 $98.1B，CAGR 为 27.9%。 Mordor Intelligence 估计 2025 年 $14.09B、2026 年
              $18.9B、2031 年 $82.17B，CAGR 为 34.14%。


              最宽口径估计——Allied Market Research（2023 年 $10.1B，2033 年 $162.1B）和 Precedence Research（2025 年 $9.21B，2026 年
              $11.70B，2035 年 $94.27B）——似乎采用了不同基准年边界假设，推高了长期预测。 这些离群估计更适合作为扩张情景下市场潜力的指示，而不是可靠的五年规划输入。在一致边界内，2026 年
              $13–19B 区间最站得住脚。


              为计算 SAM 和 SOM，较窄的机器状态监测子市场是更精确的观察口径。MarketsandMarkets 将其规模定为 2024 年 $3.1B、2029 年 $4.7B，CAGR
              8.3%；这个增速低得多，反映硬件中心型产品已趋成熟。 资产绩效管理（APM）软件市场 2026 年为 $2.40B，2032 年增至 $4.32B，CAGR 10.3%。I-care 的 SAM——其 16
              国覆盖范围内，能源、油气、水务、金属和制造业的旋转机械 PdM——估计为 $2–4B， 计算方法是在状态监测子市场中，对 I-care 相关垂直行业应用 20–30% 渗透率。SOM 受当前
              go-to-market 覆盖、客户容量和年度交易速度约束，估计为 $300–500M。
