            title: 资本风险是投资主线层面的核心威胁
            body: >
              I-care 的 €1 billion 独角兽估值来自一轮仅限内部人的融资，没有经过独立交易价格发现。投资主线依赖 2026 年外部投资者融资成功，以及最终
              IPO——两者都需要资本市场条件配合，而这种条件已经造成过一次延期（2025 年春）。若再次延期，投资者将持有按内部标记计价、但流动性不足的股权。截至 2026 年 6
              月，公开信息未宣布外部资本承诺、投行委任或上市地点。这是本章最高优先级的尽调缺口。
