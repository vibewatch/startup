        title: 留存与持久性证据
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，I-care 未披露 NRR、GRR、cohort 留存或流失指标。因此，持久性证据只能间接取得， 来自多年具名部署和定性关系描述。BASF
              从手持服务扩展到无线监测，历时多年。Royal Cosun 从两个子公司的试点扩大到全部六个子公司。 全球食品龙头自 2017 年以来一直维持并扩大与 I-care 的关系，合作期已九年。油气巨头称 I-care
              “不可或缺”， 并把 20+ 北美站点整合进一个项目。

              定性留存信号显示粘性很高：CMMS 集成（MVP One）和连续传感器数据会形成运营依赖；本地团队驻扎建立站点层关系；
              多技术服务打包（振动、润滑、热成像）加深账户覆盖。不过，没有量化留存数据，持久性论点无法做数字压力测试。 I-care 的财务状况——2024 年净经营亏损 €8.2
