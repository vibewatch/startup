      - number: '4.3'
        title: 单位经济性与定价架构
        blocks:
          - type: paragraph
            body: >
              I-care 没有公开 Wi-care 传感器、I-see 平台或 WaaS 套餐的标价。公司营销把 WaaS 定位为带来
              “财务可预测性和控制力”，把客户不规则资本开支转为可预测运营支出。任何公开备案或新闻稿都没有披露单价或单个传感器平均收入。

              工业 IoT 维护领域的代理基准显示，包含硬件的监测服务，典型单端点年订阅费约在 €300–€1,500， 取决于资产关键性、传感器密度和服务范围。按 2025 年 12 月的 150,000+ 受监测传感器和
              $116 million 收入计算，若全部收入都来自传感器安装基数，隐含每个传感器端点年收入约 $770；但这会高估单传感器收入，
              因为相当一部分收入是与传感器数量不直接挂钩的服务。该数字只能作为粗略方向性估算；实际单位经济性 （硬件 COGS、软件毛利率、服务毛利率）都未公开。

              2022 年 Series C 新闻稿提到，希望五年内收入和正常化 EBITDA 利润率都扩大 5×。按 2022 年收入基数 （结合后续 2024 年 €74 million 实际收入和 35%+ 增长推算，约
              €35–40 million），5× EBITDA 目标意味着公司要在 2027 年前后实现强劲正调整后 EBITDA，与 IPO 时间线一致。2024 年 €74 million 收入对应 €8.2
              million 净亏损，净利率约 (11%)——仍在亏损，但并不深，说明毛利率很可能为正， 即便底线被 R&D、销售扩张和制造启动成本拖累。所有利润率均为推断；公司没有直接披露。

              现场服务对客户的价值主张包括维护成本降低 35–45%、机器停机时间降低 10–20%。这些客户层面的节省， 说明公司有能力为可靠性结果收取有分量的项目费用，支撑服务重型收入的质量。
