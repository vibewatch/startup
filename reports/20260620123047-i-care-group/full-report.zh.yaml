  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >
              预测性维护（PdM）是一种基于状态的维护策略，利用实时传感器数据、IoT
              设备和数据分析，在设备故障发生前进行预测。市场边界决定市场规模：窄口径只覆盖用于旋转机械的状态监测硬件（振动传感器、热成像相机、超声仪器）； 宽口径则包含 AI 分析软件、IIoT
              连接层、现场服务和可靠性咨询，组成完整的端到端交付栈。I-care Group 的可服务市场采用最宽边界，覆盖自有无线传感器（Wi-care™）、I-see™ AI 平台和 600+ 名现场工程师。


              I-care 总可寻址市场纳入的支出包括：（1）用于旋转机械的无线和有线振动传感器；（2）超声状态监测仪器和软件；（3）处理传感器数据流、用于异常检测和故障预测的 AI 驱动分析平台；
              （4）可靠性工程服务，包括路线式巡检、润滑分析和热成像勘测；（5）油品和润滑剂分析服务。剔除的支出包括：纠正性和反应式维护（故障后维修）、没有传感器智能的定期预防性维护、用于工单管理的通用 CMMS
              软件（$1.5–2.7B 市场，单独跟踪），以及支持连接但并非维护专用的更广义 IIoT 平台层。


              现状替代方案是多数工厂里最主要的竞争现实。这些方案包括：（1）维护技师用手持振动仪按周或按月做周期性人工检查；（2）不看机器实际状态、按 OEM 服务间隔执行的定期预防性维护；
              （3）非关键资产的故障后运行策略。每种替代方案前期成本更低，但全生命周期风险和劳动强度更高。PdM 市场的渗透机会，受制于多少资产所有者能从这些既有做法转向 PdM。
