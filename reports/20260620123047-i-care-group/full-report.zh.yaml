      - number: '1.6'
        title: 里程碑与战略轨迹
        blocks:
          - type: paragraph
            body: >
              I-care 二十年轨迹可分为三条战略弧线：创业创立和早期增长阶段（2004–2017 年）、由 2022 年 “Eau Rouge” 融资锚定的规模化和国际扩张阶段（2017–2024 年），以及当前独角兽 /
              IPO 前阶段（2025 年至今）。

              2025 年 12 月的独角兽里程碑在内部被定义为三步发展计划的 Phase 1。Phase 2（2026 年）将吸引大额外部投资者，可能成为 I-care 历史上最大一轮融资。Phase 3 是 IPO，
              原目标为 2025 年，但 2025 年春季因美国贸易关税引发的“地缘政治和全球经济不稳定”推迟。CEO Brion 用 Formula 1
              赛车作比喻解释延期：即使最好的车手开着最好的车，也不会在恶劣天气下起跑。

              奖项和认证验证了 I-care 的市场地位：EY Company of the Year 2020（比利时）、ADM 2024 Supplier Award（可靠性服务）、Hannover Messe 的
              Factory Innovation Award、 The Reliability Conference 2025 Solutions Award、ISO 27001 信息安全认证，以及
              DIGITALEUROPE 将其提名为欧洲未来科技巨头之一（2025 年）。 自 2017 年以来的八笔 M&A 交易补充了能力和地域，最终落到 2025 年 3 月收购 SDT
              International（迄今最大交易，完全由股权资金支付）。
