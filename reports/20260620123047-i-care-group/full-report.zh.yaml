      - number: '5.2'
        title: Wi-care™ 硬件平台与制造
        blocks:
          - type: paragraph
            body: >
              Wi-care™ 传感器是 I-care 的旗舰自有硬件。它在旋转设备上无线测量振动（三轴）、冲击和温度， 使用原生 IoT 协议与现场网关通信，并声称电池寿命 5 年。当前代际型号是 Wi-care 130
              G23； 另有一个更简化、成本更低的 Wi-care Pure 面向小型部署。关键差异点是 Zone 1/2 爆炸性环境的 ATEX
              认证，使其能部署在油气炼厂、石化厂和其他危险环境，而多数无线电子设备在这些场景下不能合法运行。

              传感器由 I-care Electronics 设计并制造；该公司原名 Cepya Electronics，2025 年完全并入集团后改名。 生产位于比利时 Industry 4.0 工厂，每天最多可产
              2,000 台。这种内部制造能力形成硬件数据飞轮： 每个部署传感器都会喂给 I-see AI 训练数据集；而批量生产又支撑 Wi-care as a Service 订阅模型
              （传感器出租而不是出售）。具体无线协议规格、MEMS 传感器芯片来源和网关硬件供应链仍属专有信息，未披露。
