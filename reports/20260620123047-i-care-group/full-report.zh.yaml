      - number: '2.3'
        title: 买方、用户与付款方结构
        blocks:
          - type: paragraph
            body: >
              PdM 买方很少就是最终用户。在工业场景中，操作传感器工具的维护工程师或可靠性专家通常从属于掌握预算的工厂经理或维护总监。付款方——批准资本配置的人——往往更远一层，在大型组织中可能是 VP
              Engineering、VP Operations 或 CFO。多利益相关方结构把企业平均销售周期拉长到 12–24
              个月，也要求供应商同时在运营层面（正常运行时间、平均故障间隔）和财务层面（NPV、IRR、成本避免）建立经济性论证。


              预算归属会随合同结构和垂直行业显著变化。传感器硬件采购属于资本开支（CAPEX），大型工业组织通常需要 CFO 或董事会批准。软件订阅和现场服务合同属于运营开支（OPEX），可能落在工厂经理的酌定权限内——这是
              SaaS 和订阅模式降低初始采用门槛的关键原因。I-care 明确转向 Wi-care as a Service 订阅模式，正是用月度 OPEX 承诺替代 CAPEX 传感器支出，直接打这个摩擦点。


              采用 PdM 的主要触发点是一次故障事件——昂贵的非计划停机把 ROI 论证具体化。次要触发点包括监管审计（尤其在油气和水务 /
              污水处理领域，设备可靠性受监管）、新资本投资周期（可在工厂建设或扩建时安装传感器），以及企业 ESG 和能效要求上升，需要资产正常运行证据。水务 /
              污水处理垂直行业的平均预算低于油气，但公共基础设施更新周期和公用事业费率审查正越来越多为 PdM 项目提供资金。
            claimRefs:
