      - number: '8.5'
        title: 退出准备度与资本结构
        blocks:
          - type: paragraph
            body: >
              I-care 披露的退出路径是在比利时或欧洲交易所 IPO，目标募资至少 €100 million。公司曾公开宣布 2025 年 IPO 目标，但在 2025
              年春推迟，理由是美国关税扰动引发的「geopolitical and global economic instability」。截至 2026 年 6 月，尚未宣布新的 IPO 日期；公司的三阶段计划把 2026
              年外部融资定位为 IPO（Phase 3）的前置步骤。延期既反映外部宏观条件，也很可能反映内部准备度：公司需要证明 EBITDA 转正趋势，最好还披露分部级收入组合，才能让机构投资者认为其具备 IPO 可信度。

              截至 2025 年 12 月，资本结构包括：联合创始人持股约 72%，员工约 8%，四家参考股东（Finasucre、Wallonie Entreprendre（约 10%）、CPH
              Bank、IMBC、Amerigo）合计持有剩余约 20%。优先权堆栈细节和反稀释权未公开披露。2025 年 12 月内部人轮次被描述为融资和 2025 年 3 月 SDT International
              收购再融资，说明其部分解决的是资产负债表流动性，而非纯增长资本。

              被工业集团（Emerson、ABB、Honeywell、Siemens、SKF）战略收购是一个可行的替代退出路径，考虑到战略协同，估值很可能高于 IPO 路径——尤其当买方希望补齐从传感器到 AI
              的完整预测性维护技术栈时。联合创始人持有 72%
              股权，意味着他们对任何交易拥有否决权；创始人主导的退出通常只有在相对公开市场价值有显著溢价时才会发生。二级私募股权收购是第三路径，但鉴于优先权悬置以及制造和服务运营的资本密集度，这一路径会带来稀释。
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
