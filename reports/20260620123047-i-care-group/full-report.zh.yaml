      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              I-care 由联合创始人领导。Fabrice Brion 担任联合创始人、董事会主席、CEO 和 VP R&D，职责跨度很大，体现其同时掌握运营和战略权力。Arnaud Stiévenart
              是联合创始人兼董事会成员。 两位联合创始人合计持有约 72% 股本，控制权仍高度集中。

              高管团队包括 Pieter Van Camp（Deputy CEO，20 多年工业维护经验）、Bruno Casamassa（CFO，20 多年企业金融经验）、Maxime Limbourg（Chief
              Growth Officer）、 Ann Claes（Chief HR Officer）和 Guido Verrept（Performance and Compliance
              Officer）。五人高管梯队补上了职能深度，但 Brion 角色过宽，运营上仍存在关键人风险。

              董事会目前由六人组成：两位联合创始人、Bruno Colmant（独立非执行董事，比利时知名经济学家）、Gauthier Cruysmans（代表投资方 Finasucre）、 Damien Lourtie（代表
              Wallonie Entreprendre）和 Serge Demoulin（代表 IMBC）。董事会中的投资方代表覆盖四个外部参考股东中的三个，在不取代创始人多数控制的前提下提供治理监督。
