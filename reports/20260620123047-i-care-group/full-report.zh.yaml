        - 订单簿扩张推动收入增长加速
        - 收入：€74M（2024，+15%）；到 2025 年 12 月 >$116M（+40–50%）；订单簿 $232M（>2× ARR）
        - 收入增长连续两个季度降至 15% 以下，或订单簿下滑
      - - 投资逻辑
        - WaaS 模式转型将推动利润率改善和倍数重估
        - 2027 年 WaaS 目标 90%；每日 2,000 个传感器制造产能；经常性收入 % 正在增长
        - 到 2027 年 WaaS 渗透率停滞在 30% 以下，或年流失率超过 15%
