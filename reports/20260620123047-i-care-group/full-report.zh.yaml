      - number: '4.5'
        title: 财务结论与尽调缺口
        blocks:
          - type: paragraph
            body: >
              I-care 的财务画像，是一家运营有序、高增长、处于主动投资期的工业科技公司。2024 年收入 €74 million， 到 2025 年底增长至 $116 million；结合传感器基数扩张、SDT 收购和
              WaaS 模型推出，这一商业表现可信。 €74 million 收入对应 €8.2 million 净亏损（约 11% 净利率亏损），更像公司在 R&D、制造扩产、 国际扩张和 M&A
              整合上重投入，而不是陷入财务困境本身；但它确实制造了资本依赖。

              收入质量是混合的：WaaS 订阅部分承诺高质量经常性收入，但订阅、一次性硬件和按工时材料服务之间的占比没有披露。 参与 2026 年外部融资的投资者需要验证：（a）分业务毛利率；（b）WaaS
              转化率和流失率；（c）服务 EBITDA 利润率；（d）考虑硬件制造后的净营运资本和库存周转；（e）2022 年 Series C 后任何债务或授信安排的条款与契约。

              主要财务风险是资本时间点：公司承认 2025 年底 / 2026 年初存在预期现金缺口，第二阶段外部融资尚未宣布关闭， 原本计划至少带来 €100 million 的 IPO 仍无限期推迟。若 2026
              年外部融资延后，或金额低于预期， 公司可能需要继续向现有股东拿钱，或在成长阶段工业科技估值仍受宏观压缩时举债。
