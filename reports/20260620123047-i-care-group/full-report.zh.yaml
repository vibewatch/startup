        - label: 退出准备度
          value: 2
          note: IPO 推迟；无外部投资者；Phase 2 融资待完成；联合创始人持有 72%
        - label: 证据质量
          value: 2
          note: 收入结构、毛利率、股权结构、WaaS ARR 均未公开；缺少外部价格发现
