      - number: '8.3'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >
              I-care 位于工业硬件、工业 IoT 软件和现场服务的交汇处——因此没有单一上市或私有可比公司能完整覆盖其模式。最相关的上市可比公司跨度很大：从内嵌状态监测的重资产工业集团（SKF：EV/Revenue 约
              1–2×），到纯工业 AI 软件平台（AspenTech：EV/Revenue 约 15–20×）。PTC 的组合覆盖工业 IoT（ThingWorx）、CAD 和 PLM
              软件，经常性收入较强，可能是最接近的上市可比公司，兼具硬件无关的软件和服务；PTC 在 2024–2025 年大约按 7–10× EV/Revenue 交易。Rockwell Automation
              的服务和自动化硬件基础较重，同期大约按 3–4× EV/Revenue 交易。

              私有公司中，Augury 是最直接的可比对象：它是一家聚焦机器健康的工业 AI 公司，2022 年 2 月完成 $180 million Series E，并被报道以约 $1 billion
              估值达到独角兽状态——基本与 I-care 的估值标记相同。Augury 收入未公开披露，但可比融资规模和估值支持一个判断：I-care 的 €1B 估值位于领先工业 AI /
              预测性维护平台在私募市场可接受区间内。

              可比组显示，I-care 按 2025 年 run-rate 计算的约 9–11× EV/Revenue，相对硬件中心型工业同行有溢价，但低于纯软件公司。合适的锚定倍数取决于 WaaS
              订阅收入、一次性硬件收入、工时材料服务之间的组合——而 I-care 从未披露这一拆分。如果 WaaS / 订阅收入目前仅占总收入的 20–30%，5–8× 的混合倍数更站得住；如果 2027 年达到
              50%+，IPO 时 10–15× 就具备可行性。
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
      - number: '8.4'
        title: 情景分析
        blocks:
          - type: paragraph
            body: >
              三个情景框定 2027–2028 年预期 IPO 时点的估值区间。牛市情景下，WaaS 订阅采用率到 2027 年达到收入 50%+，收入在 Phase 2 外部融资和持续 M&A 支持下加速至 $200+
              million、自然增长 30%+，EBITDA 转正，从而可按 13–15× EV/Revenue IPO，对应 €2.6–3B+ 估值。在该情景中，€1B 独角兽标记意味着 2025 年 12
              月轮次进入的投资者获得约 2.5–3× 资金回报倍数。

              基准情景下，收入以每年 20–25% 增长，到 2027 年达到约 $160–180 million，WaaS 达到收入 35–45%，亏损收窄但 IPO 前 EBITDA 尚未转正。若按 9–12×
              EV/Revenue IPO，估值将为 €1.5–2.2B，对应 1.5–2× 资金回报倍数。该情景要求 Phase 2 外部融资在 2026 年成功关闭，IPO
              市场重新向亏损但增长的工业科技公司开放，且宏观或客户支出条件不出现实质恶化。

              熊市情景下，硬件爬坡和服务产能吸收管理层注意力，增长放缓至 10–15%；WaaS 转型停在收入 30% 以下；2026 年外部融资以更低估值完成或推迟到 2027 年；宏观和关税逆风持续。按 $140M
              收入、5–7× EV/Revenue 计算，隐含估值为 €600–800M——低于 2025 年 12 月独角兽标记，对 2025 年投资者构成事实上的下轮下调。触发该情景的事件包括 Phase 2 融资未能在
              2026 年 Q4 前关闭、收入增长连续两个季度低于 15%，或 IPO 窗口一直关闭到 2028 年。
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
