      - number: '7.3'
        title: 监管、法律与网络安全风险
        blocks:
          - type: paragraph
            body: >
              I-care 正处在三套趋严的欧洲监管制度交汇处：NIS2、EU AI Act，以及面向危险环境的 ATEX / 产品安全规则。NIS2（Directive 2022/2555）已在 2024 年 10
              月前转化为比利时法律，把强制网络安全风险管理和事件报告义务扩展到关键产品制造商——这一类别适用于 I-care 的 Wi-care IoT 传感器制造。在 Centre for Cybersecurity
              Belgium（CCB）监管的比利时 NIS2 制度下，重大事件必须在 24 小时内提交早期预警、72 小时内完成完整通报；管理层若不合规，要承担责任。I-care 持有 ISO 27001
              认证（其新闻索引和第三方分析师资料均有确认），说明其信息安全管理已经具备成熟度，也能部分满足 NIS2 对技术措施的要求；但认证范围、认证机构、最近一次审计日期均未公开，ISO 27001 也不能替代 CCB
              实体注册和主动事件响应能力。I-care 是否已在 CCB 完成 NIS2 注册，公开信息尚未确认。

              EU AI Act（Regulation 2024/1689）将于 2026 年 8 月全面适用，把用于关键基础设施管理和工业安全的 AI 系统归为高风险。I-care 的 I-see
              平台会提前数月预测油气、化工和 ATEX 环境中旋转设备的故障，按 Article 6 和 Annex III 很可能落入该分类。高风险 AI 系统必须在欧盟 AI
              数据库注册、完成合格评定、保留详尽技术文档，并支持人工监督。不合规最高可罚 €30 million 或全球年营业额的 6%。I-care 尚未公开确认其 AI Act 分类或合规路线图。

              ATEX Directive 2014/34/EU 管理潜在爆炸性环境中的设备。Wi-care 传感器拥有 ATEX Zone 1/2
              认证——这是真正的竞争壁垒，但硬件一旦修改，也需要通知机构重新认证，拉长产品开发周期，并在爆炸性环境事故中抬高产品责任敞口。GDPR 风险同样存在：I-care 的 I-see 隐私政策最后更新于 2022 年
              9 月，早于 2025 年 3 月收购 SDT International，且公开版本尚未修订，以覆盖超声传感器整合带来的新数据流。截至研究日期，公开记录未发现针对 I-care
              的诉讼、执法行动或网络安全事件。不过，ENISA 2024 年 OT/ICS 威胁图谱显示，针对工业 IoT 环境的勒索软件和间谍活动正在上升；I-care 的 150,000+ 个联网端点构成高价值攻击目标。
