      - number: '5.6'
        title: 信任、安全、合规与技术风险
        blocks:
          - type: paragraph
            body: >
              I-care 的 I-see 平台和数据管理流程拥有 ISO 27001 认证，为进入受监管行业（制药、能源、食品饮料）提供企业级信息安全基线。 Wi-care 传感器具备 Zone 1/2 爆炸性环境 ATEX
              认证——这是油气和石化部署的硬技术前提；没有自有硬件的竞争者， 若不借助第三方传感器，很难匹配。鉴于 I-care 在比利时注册，GDPR 合规是隐含要求；但未发现公开的数据处理协议模板或子处理方清单。

              关键技术风险集中在三处。第一，AI 不透明：ML 故障预测模型没有公开文档——方法论、训练数据拆分、误报率、 以及在训练集尚未覆盖资产类型上的表现都未知；客户和投资者评估预测主张时会遇到尽调缺口。第二，云依赖：
              托管 I-see 的基础设施提供商未具名，客户无法评估冗余、故障切换或数据主权承诺。第三，服务可扩展性： 600 人工程师现场队伍让 I-care 区别于纯软件对手，但也是最大结构性成本项；AI
              成熟后，客户会期待每个受监测资产所需工程师小时减少， 若 I-see 的 AI 层不能吸收越来越多诊断劳动，利润率会承压。Wi-care 声称 5 年电池寿命和具体 ATEX 标识等级，
              但公开可访问的测试报告或认证登记条目没有支撑。
