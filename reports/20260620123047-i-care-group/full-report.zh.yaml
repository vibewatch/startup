  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与收入来源
        blocks:
          - type: paragraph
            body: >
              I-care 运行一个三层收入模型，把硬件、软件和服务整合起来。硬件层包括 Wi-care™ 自有 IoT 振动传感器，既可一次性出售，也可通过 Wi-care as a
              Service（WaaS）订阅部署。软件层是 I-see™ AI 分析平台，汇总传感器数据并给出故障预测；它随传感器部署以 SaaS 许可形式提供。 服务层由 600+
              现场工程师交付，包括预测性维护项目、可靠性工程咨询、超声检测（来自近期收购的 SDT International），以及 Technical Associates of Charlotte 和 Technical
              Associates of Europe 提供的培训与认证。

              WaaS 把三层打包为一笔按受监测资产计费的经常性订阅费，取代过去一次性硬件销售后再分别签软件和服务合同的模式。 I-care 曾表示，希望 2022 年 Series C 后五年内，90% 受监测资产都纳入
              WaaS；这意味着模型仍处在迁移中段。 因此，公司收入确认混合了时点确认的硬件收入、按期确认的软件许可，以及按工时材料或固定费用计价的服务收入。 2025 年 3 月收购 SDT International
              后，公司增加了超声设备硬件及相关软件收入流；交易完全用既有股本支付， 没有举债——即便集团仍在亏损，这也是一个刻意释放的财务纪律信号。

              硬件加软件模型的收入质量明显高于纯硬件，因为经常性软件和订阅收入更可预测，也能拿到更高估值倍数。 但硬件制造资本开支（比利时 Industry 4.0 工厂如今每天最多生产 2,000
              个传感器）和现场服务人力成本， 让毛利率结构性低于纯软件基准。硬件、软件、服务之间的具体收入拆分尚未披露，这是一个重要尽调缺口。
