        - 硬件偏重的模型把倍数压在 4–6×；€1B+ IPO 难以成立
        - 转为回避；按 5× 年化收入重估估值底线
      - - IPO 窗口到 2028 年仍未打开，或 IPO 被正式撤回
        - 到 2028 年 Q1 仍无 IPO 公告，或公司公开撤回 IPO 计划
        - 投资人流动性被锁住；二级退出只剩战略出售或折价 PE 资本重组
        - 仅跟踪；标记流动性风险；与联合创始人沟通战略出售可选性
      - - 关键人离任：CEO Fabrice Brion 退出或缩减职务
        - 正式公告 Brion 卸任 CEO
        - 创始人主导的文化和 R&D 愿景承压；投资人信心可能下滑；IPO 估值溢价被侵蚀
        - 转为暂停；承诺投资前先评估高管梯队深度
      - - SDT International 整合失败或产生重大亏损
        - 整合成本显著超过 $5M，或收购后 SDT 收入同比下降 >20%
        - 商誉减值风险上升；拖累集团利润率；暴露 M&A 执行短板
        - 要求经审计的 M&A 整合报告；重新评估 M&A 战略可信度
    notes: |
      这些止损触发条件是基于情景分析和公司已声明里程碑推导出的分析框架。各触发条件的概率未做定量建模；重大性判断来自情景表中的敏感性分析。监控需要获取公司沟通材料，或拥有投资人董事席位。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 按分部拆分的收入构成
        - WaaS ARR、纯硬件收入、独立软件许可、服务收入——均未披露
        - 决定应采用哪一档 EV/Revenue 倍数；没有这些数据，€1B 标记无法验证
        - 要求管理层开放数据室；取得按分部拆分的经审计财务
      - - 按分部拆分的毛利率
        - 硬件毛利率、软件毛利率、服务毛利率——均未披露
        - 建模 EBITDA 路径和理解单位经济性所必需；也决定倍数选择
        - 要求未经审计的管理账；对照硬件 COGS 常模做基准
      - - Phase 2 外部融资状态和条款
        - 投资人身份、规模、投后估值、交割日期——截至 2026 年 6 月均未披露
        - 验证或否定 €1B 独角兽标记；显示机构投资人是否接受当前定价
        - 监控公开公告；直接联系 I-care 投资者关系
      - - 优先权结构和清算瀑布
        - Finasucre、CPH Bank、WE、IMBC、Amerigo 的反稀释条款、清算优先权、按比例认购权
        - 决定下行情景中普通股股东回报；对员工股权估值至关重要
        - 要求股东协议；审阅比利时公司法下的默认优先权规则
      - - 2025 年经审计合并财务
        - 2025 全年合并 P&L、资产负债表、现金流——截至 2026 年 6 月尚未发布
        - 可确认 $116M 收入数字和净亏损；支撑毛利率和烧钱速度计算
        - NBB 文件可用后索取；比利时私人公司每年提交经审计账目
      - - WaaS 转化和流失指标
        - WaaS ARR 增速、年度流失率、净收入留存——均未公开披露
        - 订阅估值方法的核心指标；高流失会摧毁经常性收入论点
        - 要求数据室提供 cohort 数据；用客户案例研究交叉核对留存信号
    notes: |
      这些尽调问题按对估值精度的重大性排序。收入构成和毛利率会卡住任何量化估值模型。Phase 2 融资状态时间最敏感，应通过新闻监控实时跟踪。
    claimRefs:
      - CV043
      - CV044
      - CV045
