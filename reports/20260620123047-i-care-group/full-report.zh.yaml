  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与创立
        blocks:
          - type: paragraph
            body: >
              I-care Group 是一家总部位于比利时 Hainaut 省 Mons 的私营比利时科技公司，以 I-care 品牌运营，域名为 icareweb.com。公司由两位工程师 Fabrice Brion 和
              Arnaud Stiévenart 于 2004 年创立。Brion 称，创始想法来自他工程学学习期间写的一篇文章；当时预测性维护还只是一个新兴小众方向，并非主流学科。

              公司的商业模式是一套端到端工业预测性维护平台，由三层组成：自有 Wi-care™ IoT 振动传感器、I-see™ AI 驱动分析平台，以及 600+ 名工程师交付的一线专家服务。 端到端 ownership 让
              I-care 区别于纯软件或纯硬件竞争对手，也支撑了公司所说的“改变世界运行方式”的目标。收入来自硬件销售、软件订阅和现场服务合同；公司明确希望把 90% 以上的监测资产迁移到硬件赋能的 SaaS（Wi-care
              as a Service）订阅模式。公司登记在比利时控股实体 I-CARE HOLDING（CIN 0682.567.719）名下，该实体于 2017 年 10 月成立。
            claimRefs:
              - CO001
              - CO002
