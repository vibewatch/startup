            - 第三方 MCA 仪器 — 服务层；无自有硬件
        - label: I-see 软件集成
          values:
            - 完整 — 原生 AI 分析；创立以来的主要方式
            - 部分 — 收购后振动 + 超声融合仍在推进
            - 部分 — 通过 POLARIS API 接入流体数据；深度未说明
            - 未集成 — IR 热成像靠人工；数据不进入 I-see
            - 未集成 — MCA 读数未接入 I-see 平台
        - label: AI / ML 成熟度
          values:
