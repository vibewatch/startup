      - number: '1.5'
        title: 规模与全球布局
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，I-care 在亚太、EMEA 和美洲（主要是美国）的 16 个国家、36 个办公室拥有 1,000 多名员工。Tracxn 报告 2026 年 5 月员工数为 861 人，说明官方
              “1,000+” 口径（可能包含 SDT International 员工）与第三方 HR 数据抓取存在差异；精确人数是一个较小尽调缺口。公司服务 55 个以上国家的客户。

              截至 2025 年 12 月，关键规模指标为：合并年收入超过 $116 million（约合 €100 million），订单储备超过 $232 million（约合 €200 million）。收入在 2024
              年增长约 15%（基于 €74 million 收入基数），并在 2025 年初加速到约 25%。尽管收入增长强劲，公司 2024 年仍报告约 €8.2 million 净经营亏损，反映其在传感器制造产能、AI
              R&D 和国际扩张上的投入。 资产负债表在 2025 年末或 2026 年初预计出现现金缺口，后由 2025 年 12 月融资和计划中的 2026 年外部融资补上。

              I-care 在全球数千家工厂监测工业机器，覆盖化工、制药、食品饮料、能源（风电、核电）和制造业等行业。被引用的知名客户包括 Bayer、Perdue Farms、Neste、Anthony Veder、
              Lutosa、Royal Cosun、Syngenta、Barry Callebaut、Chiyoda、DEME Group 和 Plukon Food Group。
