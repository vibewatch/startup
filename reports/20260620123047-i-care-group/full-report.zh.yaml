    type: matrix
    layout: standard
    summary: |
      三乘三风险热力图，将 12 类重大风险按剩余严重性（行：高 / 中 / 低）和可能性（列：低 / 中 / 高）定位。位置反映缓释后的分析师判断；若看固有严重性，多数条目会向上移动一行。
