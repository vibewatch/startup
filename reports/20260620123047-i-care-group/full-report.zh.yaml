      - number: '7.2'
        title: 竞争、AI 与产品风险
        blocks:
          - type: paragraph
            body: >
              I-care 垂直整合的硬件-AI-服务堆栈，正受到两股合流力量挤压利润率和市场份额。资本雄厚的纯 AI 厂商在加速：Augury 完成 $180 million Series E，并被 Verdantix 评为
              2025 工业 AI 分析软件 Green Quadrant Leader，成为 I-care 资金最充足的直接竞争者。Augury 的纯软件模式， 相比 I-care
              的含硬件模式，部署周期更快、获客成本更低、毛利率更高。与此同时，OEM 既有玩家在反向投入： SKF 2026 年 3 月收购 G-Tech Instruments，加深状态监测能力；2026 年 4 月宣布与
              Sferical AI 建立 AI 合作，并利用无可匹敌的轴承装机基础。Siemens 通过收购 Senseye 和 MindSphere 分销渠道瞄准企业账户， 其规模远超 I-care 36
              个办公室的直销队伍。Verdantix 估计，工业 AI 分析软件市场将从 2025 年 $3.2 billion 增至 2031 年 $9.3 billion——这个奖池足够大，能支撑 OEM
              大规模反击投入。截至研究日期，尚无公开报道称 I-care 具名客户已转向竞争对手。

              I-see 平台内的 AI 模型风险是结构性的：ML 模型内部机制、训练方法、误报和漏报率、模型漂移协议都未公开披露。 如果某个标杆客户出现一次高关注度漏检，或一次虚假告警导致非计划停机，I-care
              品牌权益可能受到实质损害， 并触发连锁流失。2025 年 3 月收购 SDT International 后，公司开始营销振动—超声联合平台；但新闻材料把 I-see
              统一平台描述为未来路线图，而不是已完成集成，近期 AI 产品交付风险仍未解决。托管 I-see 的超大规模云厂商 未具名，引出数据主权、正常运行时间 SLA
              和谈判杠杆问题；受监管行业的企业客户越来越要求这些事项透明。
