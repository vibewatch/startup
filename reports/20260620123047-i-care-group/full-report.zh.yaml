  - id: FV003
    title: IPO 时间窗口的估值 / 回报区间（2027–2028）
    type: range
    layout: standard
    summary: 预期 2027–2028 年 IPO 窗口下，熊市、基准和牛市情景的企业价值。
    data:
      items:
        - label: 熊市情景
          low: 600
          mid: 700
          high: 800
          unit: €M EV
          note: 增长 <15%，WaaS <30%，融资延迟；2027E 收入的 5–7×
        - label: 基准情景
          low: 1500
          mid: 1850
          high: 2200
          unit: €M EV
          note: 增长 20–25%，WaaS 35–45%，Phase 2 完成；2027E 收入的 9–12×
        - label: 牛市情景
          low: 2600
          mid: 2800
          high: 3000
          unit: €M EV
          note: 增长 30%+，WaaS >50%，EBITDA 转正；2027E 收入的 13–15×
    approximationNotes: |
