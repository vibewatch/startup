        - label: 产品与技术
          value: 4
          note: 端到端自有技术栈；150K+ 个传感器；AI 平台；传感器 + AI + 服务的独特整合
        - label: 竞争护城河
          value: 4
          note: 传感器装机基础带来切换成本；全球最大 PdM 数据集；8 起 M&A 整合
        - label: 收入与增长
          value: 4
          note: €74M（2024）→ $116M（2025）；订单簿 $232M；增长加速；结构质量未知
        - label: 经济性与盈利能力
