  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 财务与资本风险
        blocks:
          - type: paragraph
            body: >
              I-care Group 在经营层面结构性亏损。2024 财年，合并集团披露收入 €74 million、净亏损 €8.2 million， 延续了 2022 年 Series C 以来的投资期轨迹。到 2025
              年 12 月，管理层称收入超过 $116 million、 订单储备超过 $232 million——意味着年收入增长 40–50%——但这些头条数字没有伴随 EBITDA、毛利率或自由现金流披露，
              烧钱速度无法验证。2025 年 12 月融资事件是一轮 $23.2 million 的内部“融资和再融资”， 只面向现有股东和员工，不是外部资本注入；“再融资”一词暗示，在估值里程碑之外，可能还有债务重组。

              公司资本计划分三阶段：（a）2025 年 12 月内部融资（已完成）；（b）2026 年面向新股东的外部投资者融资； （c）最终 IPO，而 IPO 已因 Trump 关税引发的市场波动，从 2025
              年春推迟过一次。截至 2026 年 6 月， 没有公开披露外部投资者公告或条款清单。€1 billion 独角兽估值由内部融资确定，没有公平交易的价格发现， 公允价值不确定性很高。

              WaaS（Wi-care as a Service）订阅转型——目标是在约 2027 年前让 90% 受监测资产按端点订阅收费—— 会在转化期制造现金陷阱：硬件利润率先下降，SaaS
              经常性收入尚未充分累积。收入结构（硬件 vs. 软件 vs. 服务）和 WaaS 渗透率都未公开披露。汇率错配是结构性敞口：比利时雇佣和制造成本以 EUR 计价，而收入包含大量 USD 成分；
              公司没有披露对冲计划。若 2026 年外部融资无法关闭，或 IPO 无法在可接受窗口定价，公司可能被迫接受摊薄性重组， 或以低于独角兽标记的价格战略出售。
            claimRefs:
              - CR001
              - CR002
