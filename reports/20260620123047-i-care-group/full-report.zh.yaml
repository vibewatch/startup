      - number: '8.6'
        title: 最终尽调问题与否决标准
        blocks:
          - type: paragraph
            body: >
              最大的单一尽调缺口是收入构成：2024 年和 2025 年收入中，分别有多少来自 (a) Wi-care 硬件一次性销售、(b) WaaS 订阅（硬件 + 软件 + 服务打包）、(c) 独立 I-see
              软件许可，以及 (d) 工时材料服务？这一拆分决定应采用哪种估值倍数，也决定毛利率结构是否支撑当前价格。若公司 70% 收入来自硬件加服务、30% 来自软件，合理交易区间应为 4–6×
              EV/Revenue；若组合相反，则为 10–15×。没有这一信息，€1B 独角兽标记无法被独立验证。

              第二个关键缺口是 Phase 2 外部融资状态。公司曾沟通目标在 2026 年关闭，并披露该轮预计将是 I-care 历史上规模最大的融资之一。截至 2026 年 6
              月，公开来源未发现成功关闭公告。若该轮融资延期或规模缩小，说明市场条件不利，或投资者对估值存疑——两者都会构成实质性投资主线破坏信号。

              第三个缺口是分部毛利率。考虑到公司硬件制造（最高 2,000 个传感器 / 天）和 600+ 名现场工程师，混合毛利率很可能显著低于纯软件同行。没有这项数据，就无法建模盈利路径和退出时 EBITDA
              倍数。管理层曾提出在 2022 年 Series C 后五年内把规范化 EBITDA 利润率提高 5×，这意味着其当前最好也只是低个位数正 EBITDA 利润率——或仍为负——但公开来源无法验证。
            claimRefs:
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV043
              - CV044
              - CV045
      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: €1B 标记没有外部价格发现
            body: >
              2025 年 12 月独角兽估值完全由现有股东和员工确定——这是一个没有独立机构验证的自评标记。Phase 2 外部融资关闭之前，€1B
              价格应被视为愿景锚点，而非市场出清价值。这是任何估值分析中最重要的限定条件。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
          - type: callout
            title: 收入组合是关键未知数
            body: >
              I-care 合理的 EV/Revenue 倍数范围可从约 2×（若硬件占比高）到约 15×（若软件 / WaaS 占比高）。I-care 从未披露硬件、WaaS
              订阅、软件许可和服务之间的拆分。这个单一未披露事实决定了可辩护估值中 5–6× 的区间。没有这一信息，任何定量估值模型都无法验证。
            calloutType: assumption
            claimRefs:
              - CV015
              - CV043
          - type: callout
            title: Augury 可比公司验证私募市场区间
            body: >
              Augury 是最接近的美国私募市场可比公司，2022 年 2 月以约 $1 billion 估值完成 $180M Series E——几乎与 I-care 2025 年 12 月标记相同。两家公司在工业 AI
              / 预测性维护领域以相似规模达到独角兽门槛，支持一个判断：即使 2022 年以来公开市场倍数压缩，I-care 的定价仍处在私募市场愿意为领先平台支付的区间内。
            calloutType: insight
            claimRefs:
              - CV023
              - CV024
