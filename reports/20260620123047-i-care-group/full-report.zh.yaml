      - number: '4.4'
        title: 资本结构与资金充足性
        blocks:
          - type: paragraph
            body: >
              I-care 的资本历史（详见公司概览章节）以 2025 年 12 月一轮内部融资收尾：现有股东 （Wallonie Entreprendre、IMBC、Noshaq）和员工投入 $23.2
              million/€20 million。这轮融资有双重目的： 一是确立 €1 billion 投后估值（独角兽里程碑）；二是按 Belga 对公告前双轮融资讨论的报道， 部分再融资 2025 年 3 月 SDT
              International 收购。Belgian Crossroads Bank for Enterprises（BCE） 记录 I-CARE HOLDING 持有资本约 €82.7
              million，CompanyWeb 则称 2023 年控股实体权益为 €69.2 million—— 两个数字都只反映控股实体，不代表合并集团。

              2025 年 12 月融资前，Belga 援引 De Tijd 报道称，公司计划分两段融资：先由现有股东投入约 €10 million， 用于再融资 SDT
              收购；随后从主要国际投资基金处进行一轮更大的外部融资，金额为“数千万欧元”，也是 I-care 史上最大融资。完整融资的目标时间，是覆盖 2025 年底或 2026 年初预期现金缺口；这说明融资需求真实存在，
              不是单纯机会主义募资。

              公司三阶段资本计划中的第二阶段——2026 年外部投资者融资——是尽调关键事件。规模、条款、投资者身份均未知。 第三阶段是 IPO；公司在 2025 年春因地缘政治和宏观不稳定（Trump
              关税扰动）推迟，尚未重新排期。 公司曾表示 IPO 目标是在比利时或欧洲交易所至少融资 €100 million。2025 年 12 月融资后的月度烧钱、 账上现金和营运资本需求都未披露，无法精确计算
              runway；制造工厂和 1,000+ 员工意味着固定成本义务不小。
