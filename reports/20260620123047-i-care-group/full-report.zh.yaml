companyProfile:
  summary: >
    I-care Group 是一家比利时科技公司，二十年来一直在搭建全球首个完全一体化的端到端预测性维护（PdM）平台。公司 2004 年由工程师 Fabrice Brion 和 Arnaud Stiévenart 在 Mons
    创立，三层自有能力拼成一套体系：Wi-care™ 无线 IoT 振动传感器（ATEX 认证，内部制造，日产能最高 2,000 台）、I-see™ AI 分析平台（监测 150,000+ 个端点，可提前数月预测故障），以及 600+
    名现场工程师，在 16 个国家的 36 个办公室交付可靠性服务。 这套硬件 + 软件 + 服务组合覆盖化工、食品饮料、能源、油气、海事等垂直行业，服务 2,000 多家工业客户，包括 BASF、Barry
    Callebaut、ADM、 Syngenta 和 Neste。到 2025 年 12 月，收入超过 $116 million，增长轨迹为 15–40%，订单储备超过 $232 million。2025 年 12 月，I-care
    完成 $23.2 million 内部再融资轮，投后估值 €1 billion，跻身独角兽。2026 年外部融资和随后 IPO 是下一批战略里程碑，不过 IPO 已在 2025 年春季因地缘政治市场环境推迟。
    公司仍未盈利（FY2024 收入 €74 million、净亏损 €8.2 million），同时重金投入传感器制造规模、AI R&D 和国际扩张。
