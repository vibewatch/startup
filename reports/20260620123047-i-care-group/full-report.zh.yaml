      - number: '6.5'
        title: 扩张模式与集中度风险
        blocks:
          - type: paragraph
            body: >
              I-care 的先落地后扩张模型有充分文档支撑：公司一贯从一部分关键资产切入，证明可衡量 ROI 后， 再赢得更广站点和多站点合同。扩张既是横向的（更多站点），也是纵向的（每个站点更多服务）。这一模式在
              BASF（法国手持 → 多站点无线）、油气巨头（一个德州工厂 → 20+ 北美站点）和全球食品龙头 （一个欧洲站点 → 60+ 全球地点）中一致出现。共同支点是 I-care 标准化的 I-see
              平台，它聚合跨站点数据， 支持公司层基准对标；一旦站点层证明成立，这种能力会吸引企业可靠性负责人继续拉动。

              集中度风险是重要尽调事项。两个匿名超级账户（全球食品龙头、油气巨头）单体规模足以形成重大收入集中， 但任何一个客户的收入贡献都未披露。Finasucre——I-care 的 Series C
              领投方、且在董事会有代表——同时也是 I-care 客户，形成结构性利益冲突。渠道依赖有限：I-care 主要直销，没有披露会构成自身集中度风险的经销商或分销商网络。 采购摩擦很高（企业 RFP、IT
              集成要求、部分站点的 ATEX 认证需求），既是护城河，也是快速获取新客户的障碍。
