      - - 投资逻辑
        - 端到端自研栈形成持久护城河
        - Wi-care™ 传感器 + I-see™ AI + 现场工程师；8 次 M&A 收购；I-see 平台上有 150,000+ 个传感器
        - 超大规模云厂商（Google、Microsoft、AWS）以边际成本推出 AI-native PdM 平台
