company:
  name: I-care Group

chapter:
  number: 1
  title: Company Overview
  summary: >
    I-care Group is a Belgian-founded global leader in predictive maintenance, founded in 2004 in Mons by
    Fabrice Brion and Arnaud Stiévenart. In December 2025 the company crossed €1 billion in valuation after a
    $23.2 million insider round, cementing unicorn status. Revenue exceeded $116 million as of year-end 2025,
    but the company remains loss-making on an operating basis following aggressive investment in AI and hardware
    manufacturing—a planned external-investor raise in 2026 and an eventual IPO are the next catalysts.

sections:
  - id: identity-and-founding
    title: Identity and Founding
    body: >
      I-care Group is a privately held Belgian technology company headquartered in Mons, Hainaut, Belgium,
      operating under the brand name I-care at the domain icareweb.com. The company was founded in 2004 by
      Fabrice Brion and Arnaud Stiévenart, both engineers. According to Brion, the founding idea originated in
      an article he wrote during his engineering studies—at a time when predictive maintenance was an emerging
      niche rather than a mainstream discipline.

      The company's business model is an integrated end-to-end industrial predictive maintenance platform
      combining three layers: proprietary Wi-care™ IoT vibration sensors, the I-see™ AI-driven analytics
      platform, and on-the-ground expert services delivered by 600+ engineers. This end-to-end ownership
      differentiates I-care from pure-software or pure-hardware competitors and underpins the company's
      stated goal of changing the way the world performs. Revenue is generated through hardware sales,
      software subscriptions, and field service contracts, with a stated ambition to shift more than 90% of
      monitored assets to a hardware-enabled SaaS (Wi-care as a Service) subscription model. The company
      is registered under the Belgian holding entity I-CARE HOLDING (CIN 0682.567.719) incorporated in October 2017.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]

  - id: leadership-and-governance
    title: Leadership and Governance
    body: >
      I-care is co-founder led. Fabrice Brion serves as Co-founder, Chairman of the Board of Directors, CEO,
      and VP R&D—a broad mandate reflecting both operational and strategic authority. Arnaud Stiévenart is
      Co-founder and Member of the Board. Together the co-founders collectively hold approximately 72% of
      share capital, reflecting continued concentrated control.

      The executive management team includes Pieter Van Camp (Deputy CEO, 20+ years in industrial maintenance),
      Bruno Casamassa (CFO, 20+ years in corporate finance), Maxime Limbourg (Chief Growth Officer), Ann Claes
      (Chief HR Officer), and Guido Verrept (Performance and Compliance Officer). The five-person executive
      bench adds functional depth but operational dependency on Brion remains a key-person risk given his
      breadth of roles.

      The Board of Directors currently comprises six members: the two co-founders, Bruno Colmant (independent
      non-executive director, a prominent Belgian economist), Gauthier Cruysmans (representing investor
      Finasucre), Damien Lourtie (representing Wallonie Entreprendre), and Serge Demoulin (representing IMBC).
      Investor representation on the board—covering three of the four external reference shareholders—provides
      governance oversight without displacing the founders' majority control.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO002]
    figureRefs: [FO002]

  - id: products-and-technology
    title: Products and Technology
    body: >
      I-care's hardware flagship is the Wi-care™ wireless vibration sensor—a patented IoT device designed for
      industrial environments including explosive atmospheres (ATEX compliant). Wi-care sensors measure
      vibration and temperature continuously, transmitting data to the I-see™ cloud platform. As of December
      2025, the company's Industry 4.0 manufacturing facility in Belgium is capable of producing up to 2,000
      sensors per day, a significant scale-up enabling rapid deployment and the Wi-care as a Service
      subscription model. At the time of the 2022 Series C, I-care had deployed approximately 50,000 sensors;
      by December 2025 the I-see platform was monitoring more than 150,000 sensor endpoints.

      The I-see™ platform is an AI-driven analytics solution integrating data from multiple predictive
      maintenance (PdM) techniques including vibration analysis, ultrasound (via SDT International), oil/grease
      analysis, infrared thermography, and other sensor streams. I-see uses machine-learning models trained on
      one of the largest PdM datasets in the industry to provide failure predictions months in advance. An open
      API enables I-see to integrate with third-party CMMS systems (e.g. MVP One, DimoMaint, Mainti4).

      The March 2025 acquisition of SDT International (founded 1975, headquartered in Forest, Belgium) added
      world-leading ultrasound predictive maintenance to I-care's portfolio, integrating vibration and ultrasound
      on a single I-see platform for the first time. I-care also offers reliability engineering consulting and
      training through its Technical Associates of Charlotte (US) and Technical Associates of Europe subsidiaries.
    claimRefs: [CO015, CO016, CO017, CO018, CO019, CO020, CO021]

  - id: funding-and-investors
    title: Funding and Investors
    body: >
      I-care has raised capital in four distinct phases since its founding. The company was bootstrapped at
      inception in 2004. IMBC (Invest Mons Borinage Centre) began supporting I-care from approximately 2007,
      representing an early-stage regional anchor. In January 2017, I-care completed a Series B round of
      approximately $5.5 million from IMBC and SRIW (Société Régionale d'Investissement de Wallonie, now
      Wallonie Entreprendre). In September 2022, the landmark "Eau Rouge" Series C round raised $50 million led
      by Finasucre (a major Belgian family-owned industrial group and I-care customer) and CPH Bank, with
      participation from IMBC, SRIW/Wallonie Entreprendre, and the Amerigo Fund; a $10 million employee round
      was injected a few months prior. J.P. Morgan SE served as sole placement agent for the Series C.

      In December 2025, I-care closed a $23.2 million fundraising and refinancing round reserved for existing
      shareholders and employees, setting a post-money valuation of €1 billion ($1.16 billion at then-prevailing
      exchange rates). Tracxn estimates total disclosed funding at approximately $72.6 million across four rounds,
      though the employee round and the 2025 round push the true total above $80 million.

      The reference shareholder structure (20% combined ownership) comprises Finasucre, Wallonie Entreprendre
      (holding ~10% alone), CPH Bank, IMBC, and Amerigo Fund. Co-founders hold 72% and employees 8%.
      I-care's three-phase development plan envisions a large external investor round (Phase 2) launching in
      2026, followed by an eventual IPO (Phase 3, originally targeted 2025 then delayed to at least 2026-2027).
    claimRefs: [CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032]
    tableRefs: [TO001, TO003]

  - id: scale-and-global-presence
    title: Scale and Global Presence
    body: >
      As of June 2026, I-care employs more than 1,000 people across 36 offices in 16 countries spanning
      Asia-Pacific, EMEA, and the Americas (principally the US). Tracxn reported 861 employees as of May 2026,
      suggesting some discrepancy between the official "1,000+" figure (which may include SDT International staff)
      and third-party HR data scrapers; the precise headcount is a minor diligence gap. The company serves
      customers in more than 55 countries.

      Key scale metrics as of December 2025: consolidated annual revenues exceeded $116 million (equivalent
      to approximately €100 million) with an order book of more than $232 million (approximately €200 million).
      Revenue grew approximately 15% in 2024 (on a €74 million base) and accelerated to approximately 25% in
      early 2025. Despite strong topline growth, the company reported a net operating loss of approximately
      €8.2 million in 2024, reflecting investment in sensor manufacturing capacity, AI R&D, and international
      expansion. The balance sheet carried an expected cash shortfall heading into late 2025 or early 2026,
      addressed by the December 2025 round and the planned external capital raise in 2026.

      I-care monitors industrial machines in thousands of plants worldwide across industries including
      chemicals, pharmaceuticals, food & beverage, energy (wind, nuclear), and manufacturing. Notable customers
      cited include Bayer, Perdue Farms, Neste, Anthony Veder, Lutosa, Royal Cosun, Syngenta, Barry Callebaut,
      Chiyoda, DEME Group, and Plukon Food Group.
    claimRefs: [CO033, CO034, CO035, CO036, CO037, CO038, CO039]
    figureRefs: [FO003]

  - id: milestones-and-strategy
    title: Milestones and Strategic Trajectory
    body: >
      I-care's twenty-year trajectory divides into three strategic arcs: an entrepreneurial founding and
      early-growth phase (2004–2017), a scale-up and international expansion phase anchored by the 2022
      "Eau Rouge" round (2017–2024), and the current unicorn / pre-IPO phase (2025–present).

      The December 2025 unicorn milestone is framed internally as Phase 1 of a three-step development plan.
      Phase 2 (2026) involves attracting material external investors, potentially the largest capital raise in
      I-care's history. Phase 3 is an IPO, originally targeted for 2025 but postponed in spring 2025 citing
      "geopolitical and global economic instability" driven by US trade tariffs. CEO Brion characterized the
      delay using a Formula 1 racing metaphor: even the best driver with the best car does not start in
      atrocious weather conditions.

      Awards and certifications validate I-care's market standing: EY Company of the Year 2020 (Belgium),
      ADM's 2024 Supplier Award for reliability services, Factory Innovation Award at Hannover Messe, 2025
      Solutions Award at The Reliability Conference, ISO 27001 information security certification, and
      nomination by DIGITALEUROPE as one of Europe's future tech giants (2025). Eight M&A transactions since
      2017 have added capabilities and geographies, culminating in the March 2025 acquisition of SDT International
      (the largest deal to date, funded entirely from equity).
    claimRefs: [CO040, CO041, CO042, CO043, CO044, CO045, CO046, CO047]
    tableRefs: [TO004]
    figureRefs: [FO001]

