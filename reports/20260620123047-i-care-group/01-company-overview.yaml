callouts:
  - calloutType: strength
    title: Founder-Led Unicorn with Proprietary End-to-End Stack
    body: >
      I-care is co-founder controlled (72% held by Brion and Stiévenart), provides a unique hardware + software +
      services stack, and achieved €1 B valuation with less than €100 M in external capital raised. The combination
      of patented IoT sensors, a large AI-trained dataset, and 600+ field engineers creates high switching costs
      for customers and a difficult-to-replicate competitive moat.
    claimRefs: [CO003, CO012, CO027, CO030]

  - calloutType: risk
    title: Loss-Making Status and Pre-IPO Cash Dependency
    body: >
      Despite revenue exceeding $116 M, I-care reported a €8.2 M net loss in 2024 and entered 2025 with an
      anticipated cash shortfall that required both the December 2025 insider round and a planned external raise in
      2026. The IPO, originally the capital solution, has been delayed at least once. Dependence on investor goodwill
      and macro conditions to close the 2026 external round represents execution risk ahead of the planned listing.
