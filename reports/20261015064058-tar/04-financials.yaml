schemaVersion: "report-v2"
artifact: financials
slug: tar
runDate: 2026-10-15
company:
  name: TAR
chapter:
  number: 4
  title: Financials
  summary: "Public evidence supports TAR's $120M Series A and a speed-to-power product thesis, but it does not disclose named customers, revenue, realized pricing, or margin structure. Financial underwriting therefore depends on direct diligence into contracts, live deployed megawatts, cost drivers, and cash burn rather than on fundraising headlines."
sections:
  - id: revenue-model
    title: "Public revenue model: speed-to-power, not disclosed tariffs"
    body: |-
      The strongest public signal on TAR's monetization is qualitative rather than numeric. RuntimeWire says the company is asking data-center operators to pay for speed rather than cheap electricity, while Venture Capital Tracker describes the product as behind-the-meter systems built from solar, wind, batteries, and simple-cycle gas turbines. That supports a project-based power-delivery model in which value comes from shortening grid interconnection timelines, but it does not reveal whether TAR is paid through equipment sales, deployment milestones, capacity reservations, operating payments, or a blended structure. The reviewed public sources do not disclose list pricing, realized pricing, contract duration, discounts, or revenue-recognition policy, so the chapter can outline the bridge from customer need to revenue but cannot underwrite the actual take rate.
    claimRefs: [CI003, CI004, CI005, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: "Capital raised is visible; cash sufficiency is not"
    body: |-
      The financing event is clear: multiple reviewed sources point to a $120 million Series A announced in September 2026, and independent coverage placed the round at roughly a $1 billion valuation. FundedIQ also characterizes TAR as a 2026-founded company with an 11-50 employee band, which makes the announced expansion of engineering, logistics, and manufacturing meaningful relative to current organizational scale. What remains opaque is the balance sheet behind the round. The reviewed public record does not disclose cash on hand, debt facilities, equipment financing, construction obligations, or monthly burn, so capital adequacy can only be judged as "newly funded but unproven" rather than "sufficient."
    claimRefs: [CI001, CI002, CI008, CI009, CI013]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: "Underwriting verdict: evidence quality is the blocker"
    body: |-
      Venture Capital Tracker is explicit that the Series A print did not identify a customer or print revenue, and it still treats the earlier 20 MW neocloud delivery claim as unverified. That means the available public record shows financing momentum before it shows operating proof. Independent verification is also hindered by name ambiguity: public results for "TAR" include generic tar and coal-tar pages, supplier directories, and commodity price pages that are unrelated to the company. Investors can confirm that capital was raised and that the product thesis is off-grid power for AI data centers, but they cannot build a defensible revenue, margin, or runway model from the reviewed public evidence alone. The near-term underwriting verdict is therefore conditional on customer-level and contract-level diligence.
    claimRefs: [CI006, CI007, CI010, CI011, CI012, CI013]
tables:
  - id: TI001
    title: "Revenue streams table"
    columns: ["Stream", "Mechanism", "Unit", "Current value / status", "Quality", "Diligence ask"]
    rows:
      - ["Behind-the-meter system deployment", "Customer pays TAR to deliver off-grid power capacity faster than the grid queue", "Per project or MW deployed", "Product thesis publicly described; no disclosed contract economics", "Medium", "Request two signed contract summaries showing pricing basis, payment milestones, and acceptance criteria."]
      - ["Hardware package", "Bundle combines solar, wind, batteries, and simple-cycle gas turbines", "System package", "Components described, but no public BOM or markup data", "Medium", "Request equipment mix, supplier commitments, and gross-margin assumptions by component."]
      - ["Speed premium", "Willingness to pay is framed around time-to-power rather than cheaper electricity", "Unknown premium per MW or per site", "Commercial logic stated; no tariff or realized pricing disclosed", "Medium", "Request one customer proposal or pricing schedule that quantifies the speed premium."]
      - ["Operations / service revenue", "Possible recurring operations, maintenance, or fuel pass-through after commissioning", "Unknown", "Unavailable in public sources", "Low", "Request post-commissioning service scope, margin profile, and renewal assumptions."]
    notes: "Rows separate publicly described revenue mechanisms from undisclosed pricing and post-deployment economics; unknown means the assigned public pool did not disclose a usable value."
    claimRefs: [CI003, CI004, CI005, CI011]
  - id: TI002
    title: "Pricing / monetization table"
    columns: ["Price / unit / contract", "List vs realized pricing", "Discounts / unknowns", "Source"]
    rows:
      - ["Time-to-power value proposition", "Only realized logic is public: buyers pay for speed rather than cheap electricity", "No public price card, tariff, or PPA-equivalent schedule", "RuntimeWire"]
      - ["Deployment contract economics", "Realized pricing unknown", "No named customer, no disclosed contract duration, and no payment milestones", "Venture Capital Tracker"]
      - ["Revenue recognition basis", "Unknown", "No disclosure on hardware sale vs milestone vs ongoing service accounting", "Assigned pool gap"]
    notes: "This is a diligence table rather than a price sheet: official list pricing is absent, and public evidence only supports monetization logic, not a realizable tariff."
    claimRefs: [CI005, CI006, CI011]
  - id: TI003
    title: "Unit economics table"
    columns: ["Metric", "Value / public signal", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Disclosed financing", "$120M Series A in Sep 2026", "Medium", "Sets the starting capital base but not the cash runway", "Reconcile net cash proceeds after transaction costs and near-term capex commitments."]
      - ["Valuation marker", "Roughly $1B valuation in financing coverage", "Medium", "Frames market expectations but is not evidence of revenue quality", "Request board materials tying valuation to deployment, backlog, and margin assumptions."]
      - ["Operating scale", "11-50 employee band; founded 2026", "Medium", "Suggests execution burden if manufacturing and field deployment are expanding simultaneously", "Request org chart, hiring plan, and outsourced-vs-internal execution model."]
      - ["Revenue / margin disclosure", null, "Low", "Without revenue, gross margin, working capital, or burn, there is no underwritable unit-economic model", "Request current ARR or project revenue, gross-margin bridge, cash burn, and deployment working-capital cycle."]
    notes: "Null means the reviewed public sources did not disclose a usable number; the table mixes corroborated public facts with explicit diligence asks rather than inventing SaaS metrics."
    claimRefs: [CI001, CI002, CI008, CI009, CI011, CI013]
figures:
  - id: FI001
    title: "Revenue model bridge"
    type: flow
    summary: "Public evidence supports the customer problem, system bundle, and financing event, but the monetization and margin steps remain undisclosed."
    data:
      nodes:
        - label: "Urgent data-center power need"
          detail: "RuntimeWire says buyers are paying for speed rather than cheap electricity."
        - label: "TAR sells off-grid power capacity"
          detail: "The company is described as building off-grid power systems for AI data centers."
        - label: "System bundle"
          detail: "Venture Capital Tracker lists solar, wind, batteries, and simple-cycle gas turbines."
        - label: "Contracted deployment revenue"
          detail: "Public sources do not disclose whether revenue is booked through hardware sales, milestones, capacity payments, or another structure."
        - label: "Gross profit formation"
          detail: "Margin depends on equipment procurement, construction, fuel, and service costs that are not public."
        - label: "Underwriting blocker"
          detail: "The reviewed public sources provide no ARR, named customer, realized pricing, or confirmed live 20 MW delivery."
    approximationNotes: "This figure is a qualitative bridge built from retained claims; it does not infer conversion rates, pricing, or margins that the sources do not disclose."
    claimRefs: [CI003, CI004, CI005, CI006, CI011]
callouts:
