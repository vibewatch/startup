    TAR 是一家总部位于 Austin、为 AI 数据中心建设模块化离网电力系统的初创公司。公开来源持续将公司定位在缩短电力接入时间的基础设施上：2026 年 6 月完成种子轮，2026 年 9 月完成 Series
