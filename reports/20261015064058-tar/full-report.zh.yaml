chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              最一致的公开描述是，TAR 是一家总部位于 Austin、为 AI 数据中心建设模块化离网电力系统的公司。Dealroom 将 TAR
              描述为能源初创公司：它设计并部署模块化、主要采用可再生能源的离网系统，让数据中心绕过漫长的并网排队；2026 年 9 月的融资报道则称，TAR
              将可再生能源发电、电池和垂直整合的部署能力结合起来，以缩短获得电力的时间。公司看起来卖的是缩短供电时间的基础设施，而不是算力，这一点很重要，因为后续尽调应将它与电力部署供应商比较，而不是 GPU
              租赁商。另一个尽调问题是可发现性：在指定搜索池中，通用 TAR 查询会返回多个无关的煤焦油和木焦油页面，因此核验身份时应始终以 tar.com、Austin、创始人和离网数据中心电力为锚点，而不能只看公司名称。
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO016
