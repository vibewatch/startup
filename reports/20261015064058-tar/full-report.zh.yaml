  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 指定搜索池实际找到的内容
        blocks:
          - type: paragraph
            body: >
              留存的搜索池分成两部分：一条公司专属的融资/简介线索，以及大量关于煤焦油这种材料的偏题结果。FundedIQ 和 Venture Capital Tracker 都将 TAR 描述为一家总部位于
              Austin、为数据中心建设表后电力系统的初创公司；这是搜索池中唯一明确把公司锚定在电力基础设施而非商品焦油市场上的证据。相反，National Cancer
              Institute、Chemotechnique、Metoree、Thomasnet、Wikipedia、Market Research Intellect 和 DataHorizzon
              讨论的都是煤焦油化学品、供应商或材料市场领导者。这种碰撞会直接影响竞争分析，因为多数成功预取的 URL 并不能说明谁在销售同类产品，也不能说明买方如何比较选项。
