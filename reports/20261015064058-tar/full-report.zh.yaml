              - CO014
      - number: '1.3'
        title: 资本、规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              公开融资证据强于公开牵引力证据。多份留存的公司简介和融资摘要都指向 2026 年 9 月由 Spark Capital 领投、规模约 $120 million 的 Series A，投后估值约 $1
              billion；Venture Capital Tracker 加上 2026 年 6 月种子轮后，报告披露股权融资总额为 $147 million。不过，同一融资记录尚未完全对齐：Dealroom
              显示种子轮估值为 $108 million，而 Venture Capital Tracker 称 Leonhard Soenke 告诉 Business Insider，种子轮对应的估值为 $500
              million。运营里程碑大多来自公司口径，包括正在运行的公用事业级 neocloud 部署、西德州制造与物流中心，以及在 Austin 和 San Francisco 扩张的计划。相比之下，现有证据仍未披露
              ARR、具名客户，也未确认 6 月提出的 20 MW 交付目标是否达成，因此本章可以确认融资势头，但不能确认商业规模。
