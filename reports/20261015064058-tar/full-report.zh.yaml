      - - 资本市场
        - 新股权投资者和后续支持者
        - 制造扩张和营运资金
        - 未知；已宣布的融资不等于现金可用
        - 在下一次融资需求前，规模假设超过交付证明或可用资本
        - 高
        - 在扩张支出前核对现金、限制条件、消耗、项目资金来源与用途及下行跑道
        - 在现金可用性和资本需求得到验证前为高
      - - 品牌可发现性
        - 搜索引擎、媒体和交易对手
        - 流入获客和尽调清晰度
        - 高
        - 交易对手找到的是法律 TAR 或煤焦油结果，而不是这家初创公司
        - 中
        - 收紧品牌命名、内容和销售赋能材料
        - 中
    notes: 集中度仅为方向性判断，因为已分配公开证据未披露具名客户、供应商集中度或渠道组合。
