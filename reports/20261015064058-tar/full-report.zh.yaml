      nodes:
        - label: AI 电力瓶颈确实存在
          detail: 保留的报道将 TAR 描绘为应对 AI 数据中心电网并网延迟的方案。
        - label: 融资验证投资者兴趣
          detail: 公开来源相互印证，2026 年 6 月种子轮后，公司完成了 $120M A 轮，估值为 $1B。
        - label: 运营证明仍然薄弱
          detail: 保留材料池没有披露收入、已投运产能、已交付电力或具名客户。
        - label: 融资条款仍不透明
          detail: 没有保留来源披露公布估值背后的优先权、项目债务或稀释机制。
        - label: 按当前公开证据，价格偏贵
          detail: 价格可以观察到，但无法用传统可比公司或现金流方法进行辩护。
        - label: 推荐：继续研究
          detail: 在将入场投资纳入判断前，跟踪投运、客户验证和融资条款披露。
