  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 公开支持
      - 哪些信息会改变判断
    rows:
      - - 论点：AI 数据中心确实面临快速供电难题，足以支撑溢价基础设施支出。
        - 多篇融资报道将 TAR 描述为应对 AI 数据中心电网并网瓶颈的方案。
        - 要求提供客户采购证据，证明买方会在规模化阶段签下 TAR 的交付模式。
      - - 论点：TAR 同时踩中时机成熟的品类和可信的技术概念，因此投资者迅速跟进。
        - 公司从 6 月种子轮快速走到 9 月、达到独角兽条款的 A 轮，说明品类紧迫性和投资者兴趣。
        - 证明快速融资转化成了可量化的建设、调试或订单质量。
      - - 反论点：本轮价格领先于运营证明。
        - Quasa 明确将已验证估值与未验证运营规模分开，而已审阅资料库仍缺少收入和已调试产能披露。
        - 提供在运营站点、客户和商业指标，缩小估值与证明之间的差距。
      - - 反论点：隐藏的融资条款可能让表面估值没看起来那么划算。
        - 没有保留来源披露优先权、债务或稀释机制，因此实际入场经济性仍未知。
        - 提供股权结构表、优先股堆叠和任何项目融资义务。
      - - 反论点：对于一家名称普通的公司，证据密度仍然太低。
        - 搜索结果仍与通用焦油材料和 beech-tar 页面混在一起，增加了尽调摩擦，也降低了对公开可比对象的信心。
        - 用具名客户、参考项目和可量化部署里程碑扩大公开证明集合。
    notes: 各行配对呈现保留公开资料中最有力的正反论点；反论点刻意强调公开证据目前无法证明的内容。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV012
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发点
    rows:
      - - 乐观
        - 规划中的 10 MW 试点、首位客户部署和 2027 年项目储备按计划转化为已调试、可作为参考的资产。
        - 运营证明而非融资动能，可能足以支持重新审视当前价格并据此判断未来几轮融资。
        - 公开来源需要展示客户验收、已交付产能和可重复的部署节奏。
        - 错过调试日期，或未能将规划产能转化为实际供电，都会击穿该情景。
      - - 基准
        - TAR 继续吸引资本和关注，但运营证明的到来速度慢于融资节奏所暗示的水平。
        - 这支持继续观察公司，同时严格控制入场纪律；仅凭公开证据仍难以为当前价格辩护。
        - 这是最符合今日已获佐证事实的姿态：融资真实存在，但证明并不完整。
        - 融资头条与运营披露之间长期存在缺口，会让公司停留在仅尽调状态。
      - - 悲观
        - 在下一次估值事件前，客户证明、调试或融资透明度仍未跟上。
        - 相对于已披露证据，当前 $1B 估值会显得过高，引发下轮融资或结构风险担忧。
        - 如果未来更新继续强调愿景和招聘，却回避客户、收入或业绩披露，悲观情景的概率就会上升。
        - 在没有运营验证或带有惩罚性结构的情况下再次融资，会让公开投资论据失去吸引力。
      - - 不作判断边界
        - 资本结构表条款、项目债务和经济性可比对象仍属私密信息。
        - 如果不凭空制造精确度，就无法从这批资料发布可支撑的公开估值区间。
        - 在管理层提供能把价格与现金流或已签约资产连接起来的材料前，该边界成立。
        - 如果缺失输入仍然不可得，建议应保持“继续研究”，而不是滑向没有依据的确信。
    notes: 情景表以里程碑为基础，因为已分配资料不足以支持数值 DCF、公开倍数或交易可比区间。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV010
      - CV011
      - CV014
      - CV015
