      - number: '3.2'
        title: 相邻替代方案比直接同业更清楚
        blocks:
          - type: paragraph
            body: >
              Venture Capital Tracker 是唯一一个在 TAR 实际运营语境中点名合理替代方案的留存来源，但它也把这些方案定义为相邻者，而非同类直接竞争者。来源称 Crusoe 建设并运营 AI
              数据中心园区和 GPU 云，而 TAR 出售的是建在他人机房旁的电厂，因此 Crusoe 属于垂直整合的算力与园区模式，不是纯粹出售表后电力模块。该来源还将 Nscale 视为算力租赁商，将 Base Power
              视为住宅虚拟电厂和家庭电池参与者。这为本章提供了有用的竞争边界，但并没有验证一组以相近部署范围、经济性和客户证明，销售同一套离网数据中心电力系统的直接同业初创公司。
