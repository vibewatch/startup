        title: 公开收入模式：供电速度，而非已披露电价
        blocks:
          - type: paragraph
            body: >-
              TAR 货币化最强的公开信号是定性的，而非数字化的。RuntimeWire 称公司要求数据中心运营商为速度而不是便宜电力付费；Venture Capital Tracker
              则将产品描述为由太阳能、风能、电池和简单循环燃气轮机构成的表后系统。这支持一种以项目为基础的电力交付模式：价值来自缩短电网并网时间，但没有说明 TAR
              是通过设备销售、部署里程碑、容量预留、运营付款还是混合结构收款。已审阅的公开来源没有披露标价、实际价格、合同期限、折扣或收入确认政策，因此本章可以勾勒从客户需求到收入的桥梁，却无法判断实际抽成率。
