      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人身份大体清楚，但尚未完全对齐。Dealroom 和 9 月融资报道都将 Pat Becker 与 Leonhard Soenke 列为创始人；同一融资报道还提到 Jeff Silvan、Christian
              Sanchez 和 Raphael
              Levy，分别负责项目、电力系统和供应链等运营职能。这足以说明职能覆盖，但不足以核实正式治理结构。现有公开来源没有披露董事会名单、投票控制权或所有高级运营人员在不同来源中的职务一致性，而且对 TAR 成立于
              2025 年还是 2026 年存在冲突。因此现阶段关键人物依赖度看起来较高：两位创始人和一支规模不大的具名管理团队承担了大部分公开公司叙事。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO014
