  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻类别
        blocks:
          - type: paragraph
            body: >-
              留存公开来源所描述的是泛化焦油或煤焦油市场，而非明确属于公司的类别。Verified Market Reports
              将市场定义为从煤、木材或石油中提取的焦油的生产、加工和分销，应用于道路建设、屋面、防水和工业用途，同时明确排除原油开采、无关的精炼石油产品和合成替代品。这个定义足够宽，会把化学中间体、道路材料、涂层和医疗相邻的外用产品等多个终端市场放在一起，但并不能证明
              TAR 覆盖它们全部。Wikipedia 和 Thomasnet
              进一步展示了这种广度：煤焦油可流向电极、防腐剂、涂层、路面密封剂、屋面系统和洗发水。因此，本章采用的市场边界是一个包含多层相邻应用的商品及衍生品生态，而不是一条干净的软件式预算线。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM016
      - number: '2.2'
        title: 规模口径、细分与买方集中度
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只能作为区间使用，不能视为精确 TAM。Verified Market Reports 估算市场规模为 2025 年 USD 3.75 billion、2034 年 USD 5.99
              billion；DataHorizzon 的口径则是 2023 年 USD 14.5 billion、2033 年 USD 24.2 billion。PW Consulting 提供了另一种视角，报告称 2025
              年市场为 "USD 15.42 million"，2032 年为 "USD 19.29 million"，但其表格又把区域和产品/应用拆分标为 USD
              billions，因此该页面保留了集中度线索，却没有形成可对账的总额。在这些嘈杂的证据中，更稳定的模式是结构性集中：PW 称亚太占 2025 年价值的 42.15%，煤焦油沥青占产品组合的
              53.18%，铝冶炼占应用组合的 46.04%。这说明市场的经济重心仍在工业原料和重型制造，即使公开报告对绝对规模意见不一。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM013
              - CM014
      - number: '2.3'
        title: 驱动因素、约束与买方经济性
        blocks:
          - type: paragraph
            body: >-
              采用焦油似乎由基础设施需求、工业加工和价格敏感的替代周期驱动，而不是由一笔统一的买方预算驱动。IMARC 将近期价格支撑与铝冶炼、炭黑生产及其他下游工业用途联系起来；Thomasnet
              的供应商名单则显示，买方分布在屋面、混凝土和钢材涂层、路面维护、石墨材料及外用配方等多个领域。这支持将市场理解为多个采购流程共享重叠原料，而不是一个同质化客户群。主要约束同样清晰：Wikipedia
              称煤焦油具有致癌性，记录了市政和国家层面对密封涂层使用的限制，也记录了外用产品的用户接受度问题。结果是，这个市场确有需求和价格信号，但在直接确认 TAR 的产品范围、买方和地域之前，没有足够公开依据建立公司层面的
              SAM 或 SOM。
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM014
              - CM016
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 与公司相关的 SAM 仍未得到证明
            body: 留存的公开证据描述了宽泛的焦油和煤焦油市场，却没有说明 TAR 实际瞄准哪类产品、地域或买方。因此 SAM 和 SOM 仍是尽调问题，不能作为可直接使用的模型输入。
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
          - type: callout
            title: 工业采购主导最清晰的证据
            body: 最一致的需求信号来自铝冶炼、碳材料、涂层、屋面和路面流程；医疗/外用产品是一个规模较小但真实存在的相邻用途，而非市场中心。
