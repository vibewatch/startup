              是否以独角兽条款融资”，而是“现在需要什么证据，才能证明值得按这些条款付费”。两个缺口最突出。第一，留存搜索池没有披露清算优先权、项目债务、结构化融资或其他可能改变实际进入经济性的稀释机制，即便投后估值标题准确也是如此。第二，对于这个简短的通用名称，发现路径异常嘈杂：无关的煤焦油制造商列表和一份木焦油医疗信息表仍出现在指定搜索池中，增加了核验摩擦，也说明公开证据面仍然很薄。在管理层提供客户合同、投运日期、已交付容量指标和完整融资条款之前，严谨做法是跟踪里程碑，并明确论文失效触发条件。
            claimRefs:
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
