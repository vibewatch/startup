  - id: TV001
    title: 建议总结表
    columns:
      - 维度
      - 当前判断
      - 原因
      - 哪些信息会改变判断
    rows:
      - - 建议
        - 继续研究
        - 融资已获多来源佐证，但公开证明仍不足以确认收入、已调试产能和具名客户。
        - 展示已调试站点、客户参考和合同经济性，说明 $1B 估值为何可持续。
      - - 置信度
        - 中
        - 各来源的融资事实一致，但核心运营数据和 cap table 信息仍不完整。
        - 提供直接尽调材料，核对部署状态、订单质量和融资条款。
      - - 风险评级
        - 高
        - TAR 是成立第一年的硬件和项目公司，因此执行、商业化和融资条款不透明都很重要。
        - 证明按期调试、客户验收和干净的下行条款。
      - - 估值立场
        - 昂贵
        - 公开资料支持本轮价格，但不足以用基本面证明该价格合理。
        - 在期待同样的估值获得新资金前，用已披露业绩和客户牵引力补上证明缺口。
      - - 决策含义
        - 跟踪里程碑；不要仅凭公开证据对当前价格作投资判断
        - 证据基础支持关注和后续尽调，而非立即形成确信。
        - 待运营证明和融资条款可得后，重新开展价格分析。
    notes: 这张表刻意采用判断性而非数值化表达，因为已分配公开资料没有披露收入、利润率、cap table 或退出可比数据。
    claimRefs:
