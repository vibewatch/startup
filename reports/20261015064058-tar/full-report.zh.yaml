      - number: '3.3'
        title: 关于定价、买方和锁定的比较证据很薄
        blocks:
          - type: paragraph
            body: >
              现有证据更适合支持产品定位比较，而不是商业比较。Venture Capital Tracker 称 TAR 的卖点是缩短供电时间，而不是比并网购电协议更便宜；它还指出，9
              月融资报道没有披露收入、具名客户，也没有确认 6 月的 20 MW
              交付是否落地。现有相邻替代方案描述都没有提供可比的定价页面、合同结构或买方切换细节，而偏题的焦油材料来源与这些问题无关。因此，本章可以区分不同商业模式，但还不能对定价权、多归属风险或采购摩擦形成持久判断。
