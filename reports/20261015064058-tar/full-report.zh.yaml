      - number: '3.4'
        title: 当前判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >
              依据当前证据，TAR
              的差异化更多来自部署模式和客户获得电力的时间，而不是已经充分证明的竞争护城河。最有证据支撑的说法是，公司试图用模块化现场发电解决数据中心的供电时间问题；而现有替代方案要么把算力与园区运营捆在一起，要么面向完全不同的电力承购方。这足以避免把所有能源或基础设施公司都当作直接竞争者，但不足以判断护城河的持久性。缺失证据很具体：直接同业名单、客户背书、已确认的运营部署、竞争对手定价结构，以及数据中心运营商相较于一体化园区供应商、内部自建或公用事业关联替代方案仍选择
              TAR 的买方理由。
