      unsupported SAM or SOM.
    claimRefs: [CM003, CM013, CM014]
callouts:
  - calloutType: risk
    title: Company-relevant SAM remains unproven
    body: >-
      The retained public evidence describes broad tar and coal-tar markets, but it
      does not show which product family, geography, or buyer segment TAR actually
      targets. That keeps SAM and SOM as diligence questions rather than usable model
      inputs.
    claimRefs: [CM007, CM008]
  - calloutType: insight
    title: Industrial procurement dominates the clearest evidence
    body: >-
      The most consistent demand signals come from aluminum smelting, carbon materials,
      coatings, roofing, and pavement workflows, while medical/topical use appears as
      a smaller but real adjacency rather than the center of the market.
    claimRefs: [CM004, CM010, CM011, CM014]
