  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: sam-som-gap
      missingEvidence: A management-level definition of TAR's actual product family, target geography, and revenue-bearing end market is needed to convert generic tar-market lenses into a company-relevant SAM or SOM.
      whyItMatters: Market-size estimates currently span incompatible scopes and even inconsistent units, so they cannot support valuation or growth assumptions without a tighter company market definition.
      diligencePath: Obtain product SKU detail, current customer mix, and geography mix from company materials or customer references, then rebuild SAM and SOM from the confirmed segment only.
      relatedQuestionRefs: [QM006, QM008]
    - type: missing-source
      severity: material
      topic: buyer-budget-ownership
      missingEvidence: Direct procurement, case-study, or customer-budget evidence naming the real buyer, user, and payer for TAR's target workflow.
      whyItMatters: The retained public sources show multiple plausible buyers, but not which budget owner would control adoption for TAR specifically.
      diligencePath: Collect customer references, distributor contracts, or procurement documents that show budget ownership and deployment workflow by segment.
      relatedQuestionRefs: [QM003]
    - type: private-evidence-only
      severity: material
      topic: market-definition
      missingEvidence: Company-specific product positioning that clarifies whether TAR competes in industrial feedstocks, construction materials, specialty chemicals, medical products, or a narrower niche within them.
      whyItMatters: Without that positioning, public market evidence overstates optionality and risks anchoring the analysis on the wrong end market.
      diligencePath: Request product roadmap, segment revenue split, and GTM materials from the company or directly observed customer-facing collateral.
      relatedQuestionRefs: [QM001, QM006]
