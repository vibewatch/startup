      - ["Deployment model", "Factory-assembled behind-the-meter modules using solar, wind, batteries, and backup gas turbines.", "Only high-level model descriptions are surfaced for adjacencies.", "No relevant deployment model for TAR's category.", "Capability comparison is directional, not comprehensive."]
      - ["Pricing / contract model", "No retained pricing page or contract structure.", "No retained alternative pricing page or contract structure.", "No relevant pricing evidence for TAR's category.", "Pricing / packaging comparison is currently unsupported."]
