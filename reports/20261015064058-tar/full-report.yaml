  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Public revenue model: speed-to-power, not disclosed tariffs'
        blocks:
          - type: paragraph
            body: >-
              The strongest public signal on TAR's monetization is qualitative rather than numeric. RuntimeWire says the
              company is asking data-center operators to pay for speed rather than cheap electricity, while Venture
              Capital Tracker describes the product as behind-the-meter systems built from solar, wind, batteries, and
              simple-cycle gas turbines. That supports a project-based power-delivery model in which value comes from
              shortening grid interconnection timelines, but it does not reveal whether TAR is paid through equipment
              sales, deployment milestones, capacity reservations, operating payments, or a blended structure. The
              reviewed public sources do not disclose list pricing, realized pricing, contract duration, discounts, or
              revenue-recognition policy, so the chapter can outline the bridge from customer need to revenue but cannot
              underwrite the actual take rate.
