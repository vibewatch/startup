  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Assigned evidence is dominated by name collision, not company product proof
        blocks:
          - type: paragraph
            body: >-
              The strongest product-tech conclusion from the assigned pool is negative: the sources mostly document
              other things called TAR. The NRC deck uses TAR for a Technical Assistance Request workflow in nuclear
              regulation, Wilson Elser and Knovos use TAR for technology-assisted review in e-discovery, ARM uses TAR
              for the Transfer Address Register in a debug interface, and Wikipedia, Thomasnet, Chemotechnique, and
              Procurement Resource all discuss tar or coal tar as a chemical or industrial material. That spread matters
              because it explains why a generic TAR product search can look superficially "technical" while still
              failing to produce evidence about this company. Within the assigned pool, acronym noise is not a side
              issue; it is the central reason that company-specific product diligence remains blocked.
