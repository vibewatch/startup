              - CO015
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founding identity is directionally clear but not perfectly reconciled. Dealroom and the September
              financing coverage identify Pat Becker and Leonhard Soenke as founders, and the same financing coverage
              names Jeff Silvan, Christian Sanchez, and Raphael Levy in operating roles spanning projects, power
              systems, and supply chain. That provides enough evidence to describe functional coverage, but not enough
              to verify formal governance. The retained public sources do not disclose a board roster, voting control,
              or title consistency across all senior operators, and they conflict on whether TAR was founded in 2025 or
              2026. Key-person dependence therefore looks high at this stage: two founders and a small named leadership
              bench carry most of the public company narrative.
