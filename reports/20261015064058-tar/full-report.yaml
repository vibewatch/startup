chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              The strongest consistent public description is that TAR is an Austin-based company building modular
              off-grid power systems for AI data centers. Dealroom describes TAR as an energy startup that designs and
              deploys modular, primarily renewable off-grid systems so data centers can bypass long interconnection
              queues, while the September 2026 funding coverage says TAR combines renewable generation, batteries, and
              vertically integrated deployment capabilities to shorten time-to-power. The company appears to be selling
              time-to-power infrastructure rather than compute capacity, which matters because later diligence should
              benchmark it against power deployment vendors rather than GPU lessors. A separate diligence issue is
              discoverability: the assigned search pool contains multiple unrelated coal-tar and beech-tar pages under
              generic TAR queries, so identity checks should consistently anchor on tar.com, Austin, founders, and
              off-grid data-center power rather than the company name alone.
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO016
