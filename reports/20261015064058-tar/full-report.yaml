      - number: '1.3'
        title: Capital, scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence is stronger than public traction evidence. Multiple retained profiles and
              funding summaries converge on a September 2026 Series A of roughly $120 million led by Spark Capital at
              about a $1 billion post-money valuation, while Venture Capital Tracker reports total disclosed equity
              funding of $147 million after adding a June 2026 seed. The same funding record is not fully reconciled,
              however: Dealroom shows the seed at a $108 million valuation, while Venture Capital Tracker says Leonhard
              Soenke told Business Insider the seed carried a $500 million mark. Operating milestones are mostly
              company-claimed, including an active utility-scale neocloud deployment, a West Texas manufacturing and
              logistics center, and expansion plans across Austin and San Francisco. By contrast, retained evidence
              still does not disclose ARR, named customers, or confirmation that the June-era 20 MW delivery target was
              met, so the chapter can establish financing momentum but not verified commercial scale.
