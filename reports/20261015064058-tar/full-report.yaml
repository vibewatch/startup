        title: Capital raised is visible; cash sufficiency is not
        blocks:
          - type: paragraph
            body: >-
              The financing event is clear: multiple reviewed sources point to a $120 million Series A announced in
              September 2026, and independent coverage placed the round at roughly a $1 billion valuation. FundedIQ also
              characterizes TAR as a 2026-founded company with an 11-50 employee band, which makes the announced
              expansion of engineering, logistics, and manufacturing meaningful relative to current organizational
              scale. What remains opaque is the balance sheet behind the round. The reviewed public record does not
              disclose cash on hand, debt facilities, equipment financing, construction obligations, or monthly burn, so
              capital adequacy can only be judged as "newly funded but unproven" rather than "sufficient."
