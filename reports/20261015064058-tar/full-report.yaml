      - number: '4.3'
        title: 'Underwriting verdict: evidence quality is the blocker'
        blocks:
          - type: paragraph
            body: >-
              Venture Capital Tracker is explicit that the Series A print did not identify a customer or print revenue,
              and it still treats the earlier 20 MW neocloud delivery claim as unverified. That means the available
              public record shows financing momentum before it shows operating proof. Independent verification is also
              hindered by name ambiguity: public results for "TAR" include generic tar and coal-tar pages, supplier
              directories, and commodity price pages that are unrelated to the company. Investors can confirm that
              capital was raised and that the product thesis is off-grid power for AI data centers, but they cannot
              build a defensible revenue, margin, or runway model from the reviewed public evidence alone. The near-term
              underwriting verdict is therefore conditional on customer-level and contract-level diligence.
