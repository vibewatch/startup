  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The public record supports the financing event and category demand, but the proof and financing-term gaps keep the
      recommendation at research-more.
    data:
      nodes:
        - label: AI power bottleneck is real
          detail: Retained coverage frames TAR as a response to grid-interconnection delays for AI data centers.
        - label: Funding validates investor appetite
          detail: Public sources corroborate a $120M Series A at a $1B valuation after a June 2026 seed round.
        - label: Operating proof is still thin
          detail: >-
            The retained pool does not disclose revenue, commissioned capacity, delivered electricity, or named
            customers.
        - label: Financing terms remain opaque
          detail: No retained source discloses preferences, project debt, or dilution mechanics behind the headline valuation.
        - label: Current price reads expensive on public evidence
          detail: The price is observable, but a conventional comparable or cash-flow-based defense is not.
        - label: 'Recommendation: research more'
          detail: Track commissioning, customer validation, and financing-term disclosure before underwriting an entry.
    approximationNotes: >-
      This is a qualitative decision chain built from retained claims; it does not imply a numerical valuation model or
      infer hidden cash-flow data.
