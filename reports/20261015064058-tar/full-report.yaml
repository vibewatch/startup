  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent categories
        blocks:
          - type: paragraph
            body: >-
              The retained public sources describe a generic tar or coal-tar market rather than a clearly
              company-specific category. Verified Market Reports defines the market as the production, processing, and
              distribution of tar derived from coal, wood, or petroleum for road construction, roofing, waterproofing,
              and industrial uses, while explicitly excluding crude extraction, unrelated refined petroleum products,
              and synthetic substitutes. That definition is broad enough to pull together multiple end markets -
              chemical intermediates, road materials, coatings, and medical-adjacent topical products - without proving
              that TAR competes across all of them. Wikipedia and Thomasnet reinforce that breadth by showing coal tar
              flowing into electrodes, preservatives, coatings, pavement sealers, roofing systems, and shampoos. The
              working market boundary for this chapter is therefore a commodity and derivative ecosystem with several
              adjacent application layers, not a single clean software-style budget line.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM016
      - number: '2.2'
        title: Sizing lenses, segments, and buyer concentration
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is usable only as a range, not as a precise TAM. Verified Market Reports sizes the
              market at USD 3.75 billion in 2025 and USD 5.99 billion in 2034, while DataHorizzon sizes it at USD 14.5
              billion in 2023 and USD 24.2 billion in 2033. PW Consulting adds another lens, reporting a 2025 market of
              "USD 15.42 million" and a 2032 outlook of "USD 19.29 million" even though its own tables label regional
              and product/application breakdowns in USD billions, so its page preserves concentration clues but not a
              clean reconciled total. Within that noisy evidence, the more stable pattern is structural concentration:
              PW says Asia Pacific held 42.15% of 2025 value, coal tar pitch represented 53.18% of product mix, and
              aluminum smelting represented 46.04% of application mix. That concentration implies a market whose
              economic center of gravity is still industrial feedstocks and heavy manufacturing, even if public reports
              disagree on absolute size.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM013
              - CM014
      - number: '2.3'
        title: Drivers, constraints, and buyer economics
        blocks:
          - type: paragraph
            body: >-
              Adoption appears to be driven by infrastructure demand, industrial processing, and price-sensitive
              replacement cycles rather than by a uniform buyer budget. IMARC ties recent pricing support to aluminum
              smelting, carbon black production, and other downstream industrial uses, while Thomasnet's supplier list
              shows a fragmented buyer map across roofing, concrete and steel coatings, pavement maintenance, graphite
              materials, and topical formulations. That supports a view of the market as multiple procurement workflows
              sharing overlapping feedstocks, not one homogeneous customer segment. The main constraints are also clear:
              Wikipedia describes coal tar as carcinogenic, notes municipal and national restrictions on sealcoat usage,
              and documents user-acceptance issues for topical products. The result is a market with real demand and
              price signals but a weak public basis for a company-specific SAM or SOM until TAR's product scope, buyer,
              and geography are confirmed directly.
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM014
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Company-relevant SAM remains unproven
            body: >-
              The retained public evidence describes broad tar and coal-tar markets, but it does not show which product
              family, geography, or buyer segment TAR actually targets. That keeps SAM and SOM as diligence questions
              rather than usable model inputs.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
          - type: callout
            title: Industrial procurement dominates the clearest evidence
            body: >-
              The most consistent demand signals come from aluminum smelting, carbon materials, coatings, roofing, and
              pavement workflows, while medical/topical use appears as a smaller but real adjacency rather than the
              center of the market.
            calloutType: insight
