      - number: '3.4'
        title: Current judgment and diligence blockers
        blocks:
          - type: paragraph
            body: >
              On current evidence, TAR appears differentiated more by deployment model and customer timing than by a
              fully evidenced competitive moat. The strongest supported statement is that the company is trying to solve
              time-to-power for data centers with modular on-site generation, while the surfaced alternatives either
              bundle compute and campus operations or target a different offtaker entirely. That is enough to avoid
              treating every energy or infrastructure company as a direct competitor, but not enough to underwrite
              durability. The missing evidence is practical and specific: a direct-peer set, customer references,
              confirmed operating deployments, rival pricing structures, and buyer-side reasons a data-center operator
