company:
  name: "TAR"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    The assigned product-tech pool is dominated by acronym and keyword collisions rather
    than company-specific technical evidence. Retained sources show TAR meaning a nuclear
    Technical Assistance Request, e-discovery Technology-Assisted Review, ARM's Transfer
    Address Register, and coal-tar commodity materials, so this chapter can verify the
    evidence gap and discoverability risk but cannot underwrite TAR's actual architecture,
    deployment model, or controls from the assigned pool alone.
sections:
  - id: "source-fitness-and-name-collision"
    title: "Assigned evidence is dominated by name collision, not company product proof"
    body: >-
      The strongest product-tech conclusion from the assigned pool is negative: the sources
      mostly document other things called TAR. The NRC deck uses TAR for a Technical
      Assistance Request workflow in nuclear regulation, Wilson Elser and Knovos use TAR for
      technology-assisted review in e-discovery, ARM uses TAR for the Transfer Address
      Register in a debug interface, and Wikipedia, Thomasnet, Chemotechnique, and
      Procurement Resource all discuss tar or coal tar as a chemical or industrial material.
      That spread matters because it explains why a generic TAR product search can look
      superficially "technical" while still failing to produce evidence about this company.
      Within the assigned pool, acronym noise is not a side issue; it is the central reason
      that company-specific product diligence remains blocked.
    claimRefs: ["CE001", "CE002", "CE003", "CE004", "CE005", "CE011"]
    tableRefs: ["TE002"]
  - id: "what-the-pool-does-not-verify"
    title: "The assigned pool does not verify the startup's own module map or operating model"
    body: >-
      Because none of the retained sources is a TAR company homepage, product page, API
      reference, integration catalog, status page, trust center, or customer-facing
      technical document, the pool does not establish what TAR actually ships. The evidence
      does not verify a module or SKU map, does not show how the offering integrates into a
      customer workflow, and does not provide company-specific proof on deployment,
      reliability, support, or roadmap maturity. The same limitation extends to trust and
      control surfaces: there is no retained material on security, safety, privacy,
      compliance, certifications, or quality systems tied to TAR itself. The result is that
      this chapter can responsibly document missing evidence and diligence asks, but not fill
      the gaps with inference.
    claimRefs: ["CE006", "CE007", "CE008", "CE009"]
    tableRefs: ["TE001", "TE003"]
  - id: "underwriting-implication"
    title: "Product underwriting is blocked pending direct technical materials"
    body: >-
      The product risk is therefore discoverability and verification, not a proved technical
      defect. Public search noise means a reviewer can gather many seemingly relevant
      technical pages without learning anything about TAR's own system boundaries,
      dependencies, or control framework. The assigned pool also fails the chapter brief's
      developer-signal requirement: there is no GitHub activity, package-registry trace,
      public engineering forum, or even a practitioner-community proxy tied to TAR's actual
      product. Until direct company materials or independent technical validation are added,
      the prudent conclusion is that product diligence remains blocked on first-party system
      documentation and third-party proof of deployment, operations, and controls.
    claimRefs: ["CE010", "CE011", "CE012"]
    figureRefs: ["FE001"]
callouts:
  - calloutType: "risk"
    title: "Acronym ambiguity is itself a diligence risk"
    body: >-
      Generic TAR searches return multiple unrelated technical domains before any company
      product proof, which raises the chance of building a false product narrative from
      adjacent but irrelevant materials.
    claimRefs: ["CE001", "CE011"]
  - calloutType: "recommendation"
    title: "Do not underwrite product maturity from the assigned pool"
    body: >-
      Treat product, architecture, deployment, and control conclusions as blocked until the
      diligence set includes direct tar.com product surfaces or independent technical
      validation tied to the startup.
    claimRefs: ["CE006", "CE012"]
