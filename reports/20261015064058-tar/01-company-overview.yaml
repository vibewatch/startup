company:
  name: "TAR"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Retained public sources consistently describe TAR as an Austin-based builder of modular
    off-grid power systems for AI data centers, but the chapter also finds material diligence
    gaps around exact founding date, seed valuation, governance, and traction disclosure.
    Public funding coverage is strong enough to anchor the company timeline, while current
    evidence on revenue, named customers, and board composition remains incomplete.
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: >-
      The strongest consistent public description is that TAR is an Austin-based company
      building modular off-grid power systems for AI data centers. Dealroom describes TAR as
      an energy startup that designs and deploys modular, primarily renewable off-grid systems
      so data centers can bypass long interconnection queues, while the September 2026 funding
      coverage says TAR combines renewable generation, batteries, and vertically integrated
      deployment capabilities to shorten time-to-power. The company appears to be selling
      time-to-power infrastructure rather than compute capacity, which matters because later
      diligence should benchmark it against power deployment vendors rather than GPU lessors.
      A separate diligence issue is discoverability: the assigned search pool contains multiple
      unrelated coal-tar and beech-tar pages under generic TAR queries, so identity checks
      should consistently anchor on tar.com, Austin, founders, and off-grid data-center power
      rather than the company name alone.
    claimRefs: ["CO001", "CO002", "CO010", "CO016"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Founding identity is directionally clear but not perfectly reconciled. Dealroom and the
      September financing coverage identify Pat Becker and Leonhard Soenke as founders, and
      the same financing coverage names Jeff Silvan, Christian Sanchez, and Raphael Levy in
      operating roles spanning projects, power systems, and supply chain. That provides enough
      evidence to describe functional coverage, but not enough to verify formal governance.
      The retained public sources do not disclose a board roster, voting control, or title
      consistency across all senior operators, and they conflict on whether TAR was founded in
      2025 or 2026. Key-person dependence therefore looks high at this stage: two founders and
      a small named leadership bench carry most of the public company narrative.
    claimRefs: ["CO007", "CO008", "CO009", "CO014"]
    tableRefs: ["TO002"]
  - id: "capital-scale-and-milestones"
    title: "Capital, scale, and milestones"
    body: >-
      Public financing evidence is stronger than public traction evidence. Multiple retained
      profiles and funding summaries converge on a September 2026 Series A of roughly $120
      million led by Spark Capital at about a $1 billion post-money valuation, while Venture
      Capital Tracker reports total disclosed equity funding of $147 million after adding a
      June 2026 seed. The same funding record is not fully reconciled, however: Dealroom shows
      the seed at a $108 million valuation, while Venture Capital Tracker says Leonhard Soenke
      told Business Insider the seed carried a $500 million mark. Operating milestones are
      mostly company-claimed, including an active utility-scale neocloud deployment, a West
      Texas manufacturing and logistics center, and expansion plans across Austin and San
      Francisco. By contrast, retained evidence still does not disclose ARR, named customers,
      or confirmation that the June-era 20 MW delivery target was met, so the chapter can
      establish financing momentum but not verified commercial scale.
    claimRefs: ["CO003", "CO004", "CO005", "CO006", "CO011", "CO012", "CO013", "CO015"]
    tableRefs: ["TO003"]
    figureRefs: ["FO001"]
