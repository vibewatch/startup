evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-and-seed-reconciliation
    missingEvidence: >-
      Authoritative incorporation records, the signed seed financing docs, and management confirmation of the correct
      founding year and seed valuation.
    whyItMatters: >-
      The company's age and prior mark affect speed-to-scale interpretation, narrative credibility, and dilution
      analysis.
    diligencePath: Request certificate of formation, cap table history, and the June 2026 financing deck or legal close memo.
    relatedQuestionRefs:
      - QO003
      - QO007
  - type: private-evidence-only
    severity: material
    topic: traction-disclosure-gap
    missingEvidence: >-
      Current revenue or ARR, named customer references, live megawatts deployed, and confirmation of the previously
      cited 20 MW delivery target.
    whyItMatters: >-
      Without verified commercial traction, investors cannot test whether the $1B Series A valuation reflects delivered
      execution or forward narrative.
    diligencePath: >-
      Ask management for customer references, contracted megawatts, commissioning dates, and the current commercial
      pipeline.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: Board composition, observer rights, committee structure, and founder ownership after the Series A.
    whyItMatters: >-
      Governance terms and ownership concentration affect control risk, financing leverage, and decision-making
      resilience.
    diligencePath: Request the board deck cover page, investor rights agreement summary, and the post-Series-A cap table.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      A management-level definition of TAR's actual product family, target geography, and revenue-bearing end market is
      needed to convert generic tar-market lenses into a company-relevant SAM or SOM.
    whyItMatters: >-
      Market-size estimates currently span incompatible scopes and even inconsistent units, so they cannot support
      valuation or growth assumptions without a tighter company market definition.
    diligencePath: >-
      Obtain product SKU detail, current customer mix, and geography mix from company materials or customer references,
      then rebuild SAM and SOM from the confirmed segment only.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: missing-source
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Direct procurement, case-study, or customer-budget evidence naming the real buyer, user, and payer for TAR's
      target workflow.
    whyItMatters: >-
      The retained public sources show multiple plausible buyers, but not which budget owner would control adoption for
      TAR specifically.
    diligencePath: >-
      Collect customer references, distributor contracts, or procurement documents that show budget ownership and
      deployment workflow by segment.
    relatedQuestionRefs:
      - QM003
  - type: private-evidence-only
    severity: material
    topic: market-definition
    missingEvidence: >-
      Company-specific product positioning that clarifies whether TAR competes in industrial feedstocks, construction
      materials, specialty chemicals, medical products, or a narrower niche within them.
    whyItMatters: >-
      Without that positioning, public market evidence overstates optionality and risks anchoring the analysis on the
      wrong end market.
    diligencePath: >-
      Request product roadmap, segment revenue split, and GTM materials from the company or directly observed
      customer-facing collateral.
    relatedQuestionRefs:
      - QM001
      - QM006
  - type: missing-source
    severity: blocking
    topic: direct-peer-gap
    missingEvidence: Named direct peers selling comparable off-grid or behind-the-meter power systems for AI data centers.
    whyItMatters: >-
      Direct-peer identification is required to assess share of wallet, pricing pressure, and whether TAR's architecture
      is meaningfully differentiated.
    diligencePath: >-
      Re-run company-disambiguated discovery around modular data-center generation vendors and corroborate with
      customer, permitting, or procurement evidence.
    relatedQuestionRefs:
      - QP002
      - QP003
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: comparison-gap
    missingEvidence: Official pricing, contract terms, or procurement examples for TAR and the closest alternatives.
    whyItMatters: >-
      Without commercial terms, the chapter cannot judge packaging, discounting, or whether time-to-power converts into
      pricing power.
    diligencePath: Collect official pricing pages, RFP responses, customer procurement materials, or signed-project summaries.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: deployment-proof
    missingEvidence: >-
      Customer-backed proof that TAR delivered the claimed first 20 MW or converted pipeline claims into operating
      assets.
    whyItMatters: >-
      Execution proof is the cleanest discriminator between differentiated infrastructure delivery and an early
      narrative premium.
    diligencePath: >-
      Verify commissioning through customer announcements, permitting records, interconnection or site documentation, or
      operator references.
    relatedQuestionRefs:
      - QP004
      - QP007
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: >-
      Named customers, live contracted megawatts, current revenue or ARR, and the revenue-recognition basis for project
      versus operating payments.
    whyItMatters: >-
      Without customer names and booked revenue, the financing story cannot be translated into revenue quality or
      concentration risk.
    diligencePath: >-
      Request a current customer list, contracted MW by site, and a sample executed contract showing the commercial and
      accounting structure.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-gap
    missingEvidence: >-
      Gross-margin bridge, equipment procurement costs, construction costs, service obligations, burn, and
      working-capital cycle.
    whyItMatters: >-
      A project-heavy power business can consume capital long before revenue is recognized, so margin and cash
      conversion determine runway.
    diligencePath: >-
      Request a project-level contribution-margin model, trailing burn, near-term capex plan, and accounts payable or
      inventory financing arrangements.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: brand-ambiguity
    missingEvidence: >-
      An authoritative company pricing or investor surface that cleanly resolves to TAR without generic tar or coal-tar
      search pollution.
    whyItMatters: >-
      Poor discoverability weakens independent triangulation and increases the chance that external readers mistake
      commodity tar pages for company evidence.
    diligencePath: >-
      Use the company data room or direct management materials for pricing and commercial proofs instead of relying on
      generic keyword discovery.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: blocking
    topic: missing-company-tech-sources
    missingEvidence: A company-issued TAR product page, docs portal, API reference, or technical deck tied to tar.com.
    whyItMatters: >-
      Without a first-party product surface, the chapter cannot verify what is actually shipped or how users engage with
      it.
    diligencePath: >-
      Request direct tar.com product/docs URLs or a current investor technical appendix and refetch them into the run
      cache.
    relatedQuestionRefs:
      - QE001
      - QE003
      - QE004
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: blocking
    topic: missing-architecture
    missingEvidence: A system architecture diagram, module boundary description, and integration/deployment workflow.
    whyItMatters: >-
      Architecture and operating-model evidence are required to assess implementation complexity, dependencies, and
      support burden.
    diligencePath: >-
      Obtain a technical architecture review, product implementation guide, or equivalent direct materials from the
      company.
    relatedQuestionRefs:
      - QE003
      - QE004
      - QE005
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: missing-developer-signal
    missingEvidence: >-
      Developer-signal or practitioner-proxy evidence tied to TAR, such as public repos, engineering talks, integration
      partner posts, or operator forums.
    whyItMatters: >-
      The chapter brief explicitly requires practitioner or developer validation to complement company-controlled
      materials.
    diligencePath: >-
      Ask the company for public engineering references or identify a partner, customer, or practitioner artifact tied
      to the real product.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: enumeration-incomplete
    severity: material
    topic: discoverability-risk
    missingEvidence: A reconciled source set that separates genuine company evidence from acronym and keyword collisions.
    whyItMatters: >-
      Until the evidence set is cleaned, product diligence can accidentally inherit claims from unrelated legal,
      semiconductor, regulatory, or commodity domains.
    diligencePath: >-
      Rebuild the product-tech pool with company-anchored queries and retain only company-specific or clearly linked
      independent sources.
    relatedQuestionRefs:
      - QE002
      - QE008
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof
    missingEvidence: Named production customer references with attributable deployment outcomes and contactable references.
    whyItMatters: Without named proofs, it is impossible to separate pilot storytelling from production adoption.
    diligencePath: >-
      Request a customer reference list, contract start dates, delivered MW by site, and any public permission to name
      flagship customers.
    relatedQuestionRefs:
      - QU003
      - QU006
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, renewal cadence, contract length, and reorder data for existing customers.
    whyItMatters: Durability and expansion quality cannot be judged from a first-deployment narrative alone.
    diligencePath: Ask for cohort data, renewal history, backlog-to-conversion data, and board reporting on customer health.
    relatedQuestionRefs:
      - QU004
      - QU005
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Customer count, share of pipeline tied to the first flagship account, and revenue exposure by top customer.
    whyItMatters: A single delayed or cancelled deployment could materially impair the commercial thesis.
    diligencePath: Obtain pipeline by account, expected MW by customer, and concentration metrics used in internal planning.
    relatedQuestionRefs:
      - QU006
      - QU007
  - type: stale
    severity: minor
    topic: brand-ambiguity
    missingEvidence: Cleaner independent customer-proof discovery than the current ambiguous TAR search surface allows.
    whyItMatters: Search noise slows independent verification and increases the chance of missing real customer references.
    diligencePath: >-
      Search using named executives, specific deployment MW claims, and site-level counterparties once management
      provides them.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-scan
    missingEvidence: >-
      A complete permit, compliance, and trademark/brand-protection register tied to the company's actual projects and
      naming strategy.
    whyItMatters: >-
      Without a verifiable legal register, the highest-severity risks remain attribution error and hidden
      project-compliance blockers.
    diligencePath: >-
      Request a board-approved legal and regulatory tracker covering permits, emissions/safety obligations, trademark
      filings, and branded-search monitoring.
    relatedQuestionRefs:
      - QR001
      - QR006
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: commercialization-proof
    missingEvidence: Named customer contracts, delivered-MW evidence, commissioning dates, and post-launch performance data.
    whyItMatters: >-
      The underwriting case depends on whether the financing story already translates into live deployments and
      referenceable customers.
    diligencePath: >-
      Obtain signed customer agreements, commissioning reports, and measured output or uptime records for the pilot and
      first production sites.
    relatedQuestionRefs:
      - QR002
      - QR005
      - QR008
  - type: private-evidence-only
    severity: material
    topic: supplier-and-project-dependencies
    missingEvidence: >-
      Supplier commitments, fuel strategy, equipment warranties, EPC or field-service responsibilities, and
      manufacturing throughput plans.
    whyItMatters: >-
      TAR's product architecture spans multiple counterparties, so one weak link can delay commissioning or destroy
      service economics.
    diligencePath: >-
      Request the supplier map, long-lead-item status, warranty matrix, and the operational owner for every subsystem in
      the deployment stack.
    relatedQuestionRefs:
      - QR004
      - QR008
  - type: private-evidence-only
    severity: blocking
    topic: capital-sufficiency
    missingEvidence: >-
      Cash balance, restrictions, monthly burn, project sources and uses, committed capex, working-capital needs,
      contingency, and downside runway.
    whyItMatters: >-
      Announced funding is not cash available, and construction or schedule overruns could require additional capital
      before commercial acceptance.
    diligencePath: >-
      Reconcile bank statements and financing documents to a monthly base and downside sources-and-uses model through
      first accepted commercial operation.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financing-terms-gap
    missingEvidence: >-
      Cap table, liquidation preferences, any project debt or structured finance, and terms that determine effective
      new-money entry economics.
    whyItMatters: >-
      Headline post-money valuation can overstate investor attractiveness if hidden preferences, debt, or other senior
      claims absorb downside protection.
    diligencePath: >-
      Request the latest financing docs, current cap table, board materials, and any project-finance or
      equipment-finance agreements.
    relatedQuestionRefs:
      - QV005
  - type: missing-source
    severity: material
    topic: operating-proof-gap
    missingEvidence: >-
      Named customers, commissioning dates, delivered-capacity metrics, contract economics, and evidence that planned
      deployments entered service.
    whyItMatters: >-
      Without operating proof, the current valuation can only be treated as a priced round, not as validated business
      performance.
    diligencePath: >-
      Request customer references, site commissioning packages, delivered-power data, and one signed contract summary
      with pricing and acceptance milestones.
    relatedQuestionRefs:
      - QV002
      - QV006
      - QV007
  - type: missing-source
    severity: minor
    topic: valuation-method
    missingEvidence: >-
      A comparable set with enough operating detail to support a conventional public-multiple, private-round, or M&A
      valuation range.
    whyItMatters: >-
      Without usable comparables, publishing a numeric valuation range would imply precision that the retained pool does
      not support.
    diligencePath: >-
      Build a comparable set only after management provides deployment, revenue, and customer metrics that allow
      apples-to-apples screening.
    relatedQuestionRefs:
      - QV008
