chapter:
  number: 7
  title: Risks
  summary: >-
    TAR's current risk picture is dominated by attribution ambiguity and execution opacity.
    The assigned evidence uses "TAR" for a legal-technology acronym, coal-tar chemical
    products, and tar.com's data-center-power startup, while the company-specific sources
    still do not establish named customers, delivered MW, or a disclosed permit stack.
sections:
  - id: attribution-and-legal-framing
    title: Attribution and legal-framing risk
    body: |-
      The first risk is basic attribution error. Across the assigned public evidence, "TAR"
      already refers to at least three different things: technology-assisted review in
      eDiscovery, coal-tar chemical products, and tar.com's data-center-power startup. That
      creates a real legal and commercial ambiguity risk because investors, customers, and
      counterparties can easily attach the wrong facts, search results, or reputational baggage
      to the company. The ambiguity is not theoretical: Duke/EDRM, Everlaw, Sedona, and the
      Federal Courts Law Review all use TAR as established legal-tech shorthand, while
      Wikipedia, Thomasnet, and Chemotechnique use coal-tar terminology in industrial or
      medical contexts. Unless TAR can show strong trademark hygiene, branded search dominance,
      and consistent customer-facing naming, this ambiguity should be treated as a live
      diligence issue rather than a cosmetic branding problem. Public evidence also does not
      show a permitting or compliance package for the startup's generation assets, so legal risk
      is currently more about what cannot yet be attributed confidently than about a single
      adverse case on record.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR016]
    tableRefs: [TR001]
  - id: delivery-and-operational-proof
    title: Delivery and operational proof risk
    body: |-
      The company-specific evidence is still mostly promise-shaped. Venture Capital Tracker says
      TAR sells behind-the-meter power systems that combine solar, wind, batteries, and
      simple-cycle gas turbines, and that June company claims included a 10 MW continuous pilot
      plus a roughly 20 MW first customer within three months. But the same source says the
      September 2026 financing print did not disclose revenue or named customers and did not
      confirm whether that 20 MW delivery landed. That leaves the most important operational
      questions open: commissioning speed, uptime, supply-chain readiness, and whether the
      company can convert an eye-catching financing event into operating megawatts. Because the
      commercial pitch is time-to-power rather than a cheaper grid economics story, execution
      misses would cut directly into the thesis.
    claimRefs: [CR008, CR009, CR010, CR011, CR012, CR013, CR015]
    tableRefs: [TR002]
  - id: dependency-capital-and-customer-risk
    title: Dependency, capital, and customer risk
    body: |-
      TAR's announced financing does not establish cash availability or clear the dependency
      stack. FundedIQ places the company in the 11-50 employee band with one $120 million
      round on record. The reported architecture and manufacturing ambition imply simultaneous
      dependence on talent acquisition, equipment vendors, project execution partners, and a
      small set of early customers willing to adopt an unproven deployment model. The same
      source says the financing print did not disclose revenue or named customers, so customer
      concentration and counterparty quality cannot yet be underwritten from public evidence.
      Until TAR can show contracted pipeline conversion, supplier commitments, cash availability,
      and repeatable economics, the company should be treated as dependent on a narrow band of
      execution and financing outcomes.
    claimRefs: [CR008, CR009, CR010, CR012, CR013, CR014, CR015]
    tableRefs: [TR003]
  - id: kill-criteria-and-diligence-path
    title: Kill criteria and diligence path
    body: |-
      The near-term kill criteria are concrete. First, if management still cannot evidence a
      named customer, live delivered MW, and post-commissioning performance after the September
      2026 raise, the commercialization story is ahead of proof. Second, if the company cannot
      produce a permit stack, emissions or safety path, and supplier commitments for the
      gas-turbine-backed architecture, the regulatory and operational risks are being deferred
      rather than solved. Third, if branded discovery still collides with legal-TAR and
      coal-tar references, customer acquisition friction may stay structurally higher than the
      capital raise implies. A clean diligence package should therefore include customer
      contracts, delivered-MW evidence, manufacturing and vendor plans, and a board-level view
      of naming and reputational mitigation.
    claimRefs: [CR009, CR010, CR011, CR012, CR013, CR016]
    figureRefs: [FR001]
