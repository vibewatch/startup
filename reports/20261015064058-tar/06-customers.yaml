        - Rapid power availability without waiting for utility interconnection
        - VCT says the first customer was an unnamed large neocloud
        - Likely anchor buyer if the first 20 MW converts
        - No named customer, contract term, or independent outcome
      - - Lab or HPC campus
        - Campus operations user; finance or project sponsor as payer
        - Off-grid or behind-the-meter power for constrained sites
        - VCT lists lab campuses as a target use case, not a named account
        - Broadens vertical reach beyond neoclouds
        - No public deployment example in the assigned pool
      - - First external flagship deployment
        - Counterparty not disclosed
        - Roughly 20 MW initial deployment
        - VCT says June coverage expected a first customer within three months
        - Would be the first strong commercial proof point if delivered
        - September coverage did not confirm that the milestone landed
      - - 2027+ expansion pipeline
        - Buyers not disclosed
        - Scale from first deployment toward fleet build-out
        - VCT cites management ambition for >200 MW in 2027 and several GW in 2028
        - Defines expansion narrative and manufacturing need
        - No reservation stack, offtaker list, or reorder evidence
    notes: >-
      Segments are inferred from product positioning and disclosed use cases in assigned-pool funding
      profiles; no public customer contract, pricing, or renewal detail is available here.
    claimRefs: [CU001, CU002, CU003, CU006, CU009]
