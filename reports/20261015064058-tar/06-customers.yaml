        - Venture Capital Tracker
        - Low
        - Implies a flagship deployment could anchor the first commercial account
        - No customer name, contract value, or completion confirmation
      - - Public customer disclosure in September financing print
        - No named customer or revenue disclosed
        - September 2026
        - Venture Capital Tracker
        - Medium
        - Commercial proof remained thin even after the $120M Series A
        - No customer count, deployment count, or utilization metric
      - - Public durability metrics
        - None disclosed in accessible pool
        - September-October 2026
        - FundedIQ plus Venture Capital Tracker
        - Medium
        - Retention, renewal, and expansion quality remain unverified
        - No NRR, GRR, churn, contract length, or cohort data
    notes: >-
      Values mix company-claimed milestones with disclosure checks from secondary profiles; missing
      denominators are part of the diligence signal, not zero values.
    claimRefs: [CU005, CU006, CU007, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Unnamed large neocloud
        - AI data-center operator
        - First external ~20 MW system
        - Claimed future deployment rather than independently confirmed production
        - Would validate flagship demand if delivered
        - Customer remains unnamed and no public customer quote or contract proof is in the pool
      - - Public production reference customer
        - Not disclosed
        - Behind-the-meter power modules for AI data centers
        - No named production reference in accessible sources
        - None publicly attributable
        - September financing profile still omitted named customers and revenue
      - - Public delivery confirmation of June milestone
        - Not disclosed
        - Claimed first-customer ramp from June 2026
        - Status unresolved in accessible public coverage
        - None independently confirmed
        - Generic web discovery for TAR is crowded by unrelated legal-tech and coal-tar results
    notes: >-
      This is a partial enumeration of accessible public reference proof only; it is not a complete
      customer list and should be read as a disclosure-quality check rather than installed-base count.
    enumerationScope:
      coverage: partial
      basis: >-
        Accessible assigned-pool sources only disclose one unnamed prospective customer plus later
        disclosure checks from September-October 2026 company-profile coverage.
    claimRefs: [CU006, CU007, CU008, CU010, CU011]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      TAR's public customer path runs from time-to-power targeting through one claimed flagship
      deployment, with most expansion and retention proof still missing.
    data:
      items:
        - label: Target constrained AI load
          detail: Buyers appear to be data-center operators that cannot wait for utility interconnection.
          touchpoints:
            - Neocloud or lab campus seeks near-term power availability
            - Value proposition centers on speed, not below-grid pricing
        - label: Configure off-grid module
          detail: TAR packages solar, wind, batteries, and simple-cycle gas turbines into behind-the-meter systems.
          touchpoints:
            - Product is framed as modular and factory-built
            - User is likely infra or facilities leadership
        - label: Pilot technical proof
          detail: June 2026 coverage cited a 10 MW continuous pilot on TAR-owned land.
          touchpoints:
            - Technical proof precedes broad named-customer disclosure
        - label: Flagship external deployment
          detail: The first public customer reference is an unnamed large neocloud tied to a claimed ~20 MW system.
          touchpoints:
            - Customer name is withheld
            - September financing coverage did not confirm delivery
        - label: Manufacturing scale-up
          detail: Series A proceeds were described as funding engineer hiring and manufacturing expansion.
          touchpoints:
            - Capacity build-out is needed before fleet-style expansion
        - label: Repeat orders and retention proof
          detail: No public NRR, GRR, churn, contract-length, or reorder evidence is available in the assigned pool.
          touchpoints:
            - Durability remains a diligence gap
            - Referenceability risk stays high until named proofs emerge
    approximationNotes: >-
      Stages reflect the public commercial path visible in assigned-pool sources; they are not a
      measured funnel and do not imply conversion rates.
    claimRefs: [CU001, CU002, CU003, CU005, CU006, CU007, CU013, CU014]
callouts:
  - calloutType: risk
    title: Referenceability is the core customer risk
    body: >-
      The accessible pool still shows one unnamed flagship deployment claim and no public retention or
      reorder metrics, so customer concentration and procurement-proof risk stay materially open.
    claimRefs: [CU006, CU007, CU012, CU014]
