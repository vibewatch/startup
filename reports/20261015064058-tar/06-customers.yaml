schemaVersion: report-v2
artifact: customers
slug: tar
runDate: 2026-10-15
company:
  name: TAR
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof for TAR is thin in the assigned source pool: the clearest company-specific
    evidence is one June 2026 claim of a first unnamed large neocloud customer, while September 2026
    funding coverage still did not disclose revenue, a named customer, or confirmation that the first
    20 MW deployment had landed. That leaves customer durability, concentration, and reference quality
    materially unresolved despite a compelling time-to-power pitch for AI data-center operators.
sections:
  - id: target-segments
    title: Target segments are clear, but payer and deployment details remain thin
    body: >-
      The accessible pool is consistent on TAR's target customer profile even though it is weak on
      named references. Venture Capital Tracker describes TAR as selling modular behind-the-meter power
      systems for data centers and says the primary pitch is time-to-power for operators that cannot
      wait on utility interconnection, not power below grid cost. That frames the likely buyer as
      infrastructure, facilities, and finance leadership at AI data-center operators, neoclouds, and
      similar high-load campuses. FundedIQ reinforces that the company is still early by showing only
      one disclosed round, a 2026 founding date, and an 11-50 employee band, which implies the public
      customer base is still being formed rather than already diversified across many visible accounts.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: public-adoption-proof
    title: Public adoption evidence remains mostly unnamed and pre-production
    body: >-
      The strongest adoption signal in the assigned pool is still management-provided rather than
      independently validated customer proof. Venture Capital Tracker says June 2026 coverage described
      a 10 MW continuous pilot on TAR-owned land and an expected first customer deployment of roughly
      20 MW for an unnamed large neocloud within three months. But the same Venture Capital Tracker
      profile says September 2026 Series A coverage did not print revenue, a named customer, or whether
      the June delivery milestone landed. FundedIQ likewise summarizes financing, investors, location,
      and hiring stage but does not surface a named production customer. For diligence purposes, the
      public record still looks like an early commercial motion with one prospective flagship account,
      not a proven installed base with repeatable references or independently published outcomes.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Expansion ambition outruns retention, concentration, and reference quality
    body: >-
      The main customer question is not whether TAR has a compelling category story, but whether that
      story has already converted into durable customer economics. Venture Capital Tracker relays
      management ambition for more than 200 MW of constant load in 2027 and several gigawatts in 2028,
      and says the new capital is intended for engineer hiring and manufacturing expansion. Those
      statements suggest a large land-and-expand path if the first deployment converts, yet the
      accessible pool still contains no NRR, GRR, churn, renewal, contract-length, or named reference
      evidence. Search-result noise is also unusually high because unrelated legal-technology TAR
      coverage and coal-tar pages crowd generic discovery, which weakens independent customer
      verification. Net result: customer concentration and referenceability risk remain material until
      TAR can show named production customers, delivered megawatts, and follow-on orders.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014]
    tableRefs: []
tables:
