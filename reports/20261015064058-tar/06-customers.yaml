  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: named-customer-proof
      missingEvidence: Named production customer references with attributable deployment outcomes and contactable references.
      whyItMatters: Without named proofs, it is impossible to separate pilot storytelling from production adoption.
      diligencePath: Request a customer reference list, contract start dates, delivered MW by site, and any public permission to name flagship customers.
      relatedQuestionRefs: [QU003, QU006]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: NRR, GRR, churn, renewal cadence, contract length, and reorder data for existing customers.
      whyItMatters: Durability and expansion quality cannot be judged from a first-deployment narrative alone.
      diligencePath: Ask for cohort data, renewal history, backlog-to-conversion data, and board reporting on customer health.
      relatedQuestionRefs: [QU004, QU005]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Customer count, share of pipeline tied to the first flagship account, and revenue exposure by top customer.
      whyItMatters: A single delayed or cancelled deployment could materially impair the commercial thesis.
      diligencePath: Obtain pipeline by account, expected MW by customer, and concentration metrics used in internal planning.
      relatedQuestionRefs: [QU006, QU007]
    - type: stale
      severity: minor
      topic: brand-ambiguity
      missingEvidence: Cleaner independent customer-proof discovery than the current ambiguous TAR search surface allows.
      whyItMatters: Search noise slows independent verification and increases the chance of missing real customer references.
      diligencePath: Search using named executives, specific deployment MW claims, and site-level counterparties once management provides them.
      relatedQuestionRefs: [QU008]
