company:
  name: TAR
chapter:
  number: 8
  title: Valuation
  summary: "Public evidence confirms TAR's $120M Series A at a $1B valuation, but it does not confirm revenue, commissioned capacity, named customers, or financing terms behind that price. The supportable public-market posture is therefore research-more with a high risk rating and an expensive valuation stance until deployment and contract proof catches up."
sections:
  - id: current-call
    title: "Current call: research-more at the current public price signal"
    body: |-
      The financing event itself is well corroborated. Across retained coverage, TAR disclosed a $120 million Series A in September 2026 at a $1 billion valuation, after a $27 million seed round in June 2026. That creates a clear market price signal and shows investor demand for faster off-grid power delivery to AI data centers. It does not, however, establish the operating proof that would normally let an outside investor underwrite the same price independently. The retained pool still lacks disclosed revenue, commissioned capacity, delivered electricity, named customers, or public cap-table terms. On public evidence alone, the right recommendation is therefore research-more rather than buy or avoid: the opportunity may be real, but the current record proves financing momentum faster than it proves deployment economics or downside protection.
    claimRefs: [CV001, CV002, CV004, CV006, CV007, CV008, CV009, CV014]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: scenario-discipline
    title: "Scenario discipline should be milestone-based, not multiple-driven"
    body: |-
      The available upside case is operational, not spreadsheet-driven. Data Center Dynamics reports a planned 10 MW pilot and says the first customer deployment should be about twice that capacity, while TAR separately claims a larger 2027 pipeline. Those facts are useful as directional milestones, but they are still pre-commissioning proof points rather than operating outputs. The assigned pool also does not provide a supportable public-company, private-round, or M&A comparable set with enough operating detail to anchor a conventional multiple-based range. As a result, the valuation framework for this chapter is milestone-based: a stronger entry case would require commissioned assets, referenceable customers, and evidence that the compressed seed-to-Series-A step was earned by deployment traction rather than only by category enthusiasm.
    claimRefs: [CV003, CV004, CV005, CV006, CV010, CV011, CV015]
    tableRefs: [TV003]
  - id: diligence-priority
    title: "Diligence priority: convert headline financing into underwritable proof"
    body: |-
      The final valuation question is less "did TAR raise at unicorn terms?" and more "what evidence would justify paying into those terms now?" Two gaps dominate. First, the retained pool does not disclose liquidation preferences, project debt, structured finance, or other dilution mechanics that could change effective entry economics even if the headline post-money valuation is accurate. Second, discovery remains unusually noisy for a short generic name: unrelated coal-tar manufacturer listings and a beech-tar medical information sheet still surface in the assigned search pool, which increases verification friction and shows how thin the public evidence surface still is. Until management provides customer contracts, commissioning dates, delivered-capacity metrics, and full financing terms, the disciplined posture is to track milestones and keep thesis-break triggers explicit.
    claimRefs: [CV007, CV012, CV013, CV014, CV015]
callouts:
