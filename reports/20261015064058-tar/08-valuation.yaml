    title: "Recommendation summary table"
    columns: ["Dimension", "Current call", "Why", "What would change the view"]
    rows:
      - ["Recommendation", "research-more", "Financing is corroborated, but public proof stops short of revenue, commissioned capacity, and named customers.", "Show commissioned sites, customer references, and contract economics that explain why the $1B mark is durable."]
      - ["Confidence", "medium", "The funding facts are consistent across sources, but the core operating and cap-table inputs are still incomplete.", "Provide direct diligence materials that reconcile deployment status, backlog quality, and financing terms."]
      - ["Risk rating", "high", "Execution, commercialization, and financing-term opacity all matter because TAR is a first-year hardware-and-project company.", "Demonstrate on-time commissioning, customer acceptance, and clean downside terms."]
      - ["Valuation stance", "expensive", "The public pool supports the round price, not the operating evidence needed to defend it on fundamentals.", "Close the proof gap with disclosed performance and customer traction before expecting the same valuation to clear new money."]
      - ["Decision implication", "Track milestones; do not underwrite current pricing from public evidence alone", "The evidence base supports attention and follow-up diligence, not immediate conviction.", "Re-open price work after operating proof and financing terms are available."]
    notes: "This table is intentionally judgmental rather than numerical because the assigned public pool does not disclose revenue, margin, cap-table, or exit-comparable data."
    claimRefs: [CV001, CV004, CV007, CV008, CV009, CV014]
  - id: TV002
    title: "Thesis / anti-thesis table"
    columns: ["Argument", "Public support", "What would change the view"]
    rows:
      - ["Thesis: AI data centers have a real time-to-power problem that can support premium infrastructure spending.", "Multiple funding stories frame TAR as a response to grid interconnection bottlenecks for AI data centers.", "Require customer procurement evidence showing buyers will sign for TAR's delivery model at scale."]
      - ["Thesis: Investors moved quickly because TAR combines a timely category with a credible technical concept.", "The company moved from a June seed to a September Series A at unicorn terms, suggesting category urgency and investor appetite.", "Show that fast capital formation translated into measurable construction, commissioning, or backlog quality."]
      - ["Anti-thesis: the round price is ahead of operating proof.", "Quasa explicitly separates verified valuation from unverified operating scale, and the reviewed pool still lacks revenue and commissioned-capacity disclosure.", "Provide live-site, customer, and commercial metrics that narrow the gap between valuation and proof."]
      - ["Anti-thesis: hidden financing terms could make the headline valuation less attractive than it looks.", "No retained source discloses preferences, debt, or dilution mechanics, so effective entry economics remain unknown.", "Provide the cap table, preference stack, and any project-finance obligations."]
      - ["Anti-thesis: evidence density is still shallow for a company with a generic name.", "Search results still collide with generic tar-material and beech-tar pages, which increases diligence friction and limits confidence in public comparables.", "Expand the public proof set with named customers, reference projects, and measurable deployment milestones."]
    notes: "Rows pair the strongest pro and con arguments available from the retained public pool; the anti-thesis intentionally emphasizes what public evidence cannot yet prove."
    claimRefs: [CV001, CV002, CV006, CV007, CV012, CV014]
  - id: TV003
    title: "Bull / base / bear scenario table"
    columns: ["Case", "Assumptions", "Valuation / return logic", "Probability signal", "Downside trigger"]
    rows:
      - ["Bull", "The planned 10 MW pilot, first customer deployment, and 2027 pipeline convert into commissioned, referenceable assets on schedule.", "Could justify reopening the current price and underwriting future rounds from operating proof instead of financing momentum.", "Public sources would need to show customer acceptance, delivered capacity, and repeatable deployment cadence.", "Missed commissioning dates or failure to turn planned capacity into live power would break the case."]
      - ["Base", "TAR continues to attract capital and attention, but operating proof arrives more slowly than the financing pace implied.", "Supports monitoring the company while keeping entry discipline tight; current price remains hard to defend from public evidence alone.", "This is the posture best matched to today's corroborated facts: real financing, incomplete proof.", "A prolonged gap between funding headlines and operating disclosure keeps the company in diligence-only mode."]
      - ["Bear", "Customer proof, commissioning, or financing transparency fails to catch up before the next valuation event.", "The current $1B mark would look stretched relative to disclosed evidence, raising down-round or structure-risk concerns.", "Bear probability rises if future updates keep citing ambition and hiring while avoiding customer, revenue, or performance disclosure.", "Another financing without operating validation or with punitive structure would turn the public case unattractive."]
      - ["No-call boundary", "Cap-table terms, project debt, and economic comparables remain private.", "No supportable public valuation range can be published from this pool without inventing precision.", "That boundary holds until management supplies materials that connect price to cash flows or contracted assets.", "If the missing inputs stay private, the recommendation should remain research-more rather than drift into unsupported conviction."]
    notes: "The scenario grid stays milestone-based because the assigned pool does not support a numerical DCF, public-multiple, or transaction-comparable range."
    claimRefs: [CV003, CV004, CV005, CV006, CV010, CV011, CV014, CV015]
