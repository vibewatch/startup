- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Renewed trust shock
    - Another major authorization or key-exposure issue within 12 months
    - Premium trust narrative weakens and multiple compresses
    - Move to downside case and reprice
  - - Reliability deterioration
    - Repeated outage spikes or sustained service instability
    - Enterprise procurement and retention confidence fall
    - Demand operational metrics before proceeding
  - - Weak monetization disclosure
    - ARR materially below low-hundreds-of-millions band or poor retention
    - Fair valuation stance becomes full / unattractive
    - Downgrade recommendation
  - - Cap-table overhang
    - Heavy preference stack or punitive seniority in prior rounds
    - Exit-value sharing becomes less attractive than headline valuation suggests
    - Rework return model before investment
  - - Roadmap without attach-rate proof
    - Secrets / passwordless expansion adds complexity but not revenue quality
    - Platform upside is overstated
    - Value core vault business more conservatively
  notes: These are the highest-signal events that would most directly change the recommendation.
