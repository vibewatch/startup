  rows:
  - - Bull
    - ARR / revenue roughly 200-250, growth still >20%, enterprise expansion into Secrets Manager and passwordless, no fresh trust shock
    - 10x-12x => about 2,000-3,000
    - Possible but unproven
    - Disclose strong NRR, healthy gross margin, and strong paid-enterprise mix
  - - Base
    - ARR / revenue roughly 150-180, mid-teens growth, solid retention, modest but real expansion from enterprise customers
    - 8x-10x => about 1,200-1,800
    - Most reasonable public band
    - Show durable ARR quality and stable risk posture
  - - Bear
    - ARR / revenue roughly 80-120, growth slows, paid conversion or retention weakens, or security/reliability issues recur
    - 4x-6x => about 320-720
    - Real downside if disclosure disappoints
    - Evidence of low monetization quality or renewed trust damage
  notes: Ranges are illustrative scenario bands, not management guidance or a claim that Bitwarden currently sits at any specific ARR level.
