- id: comparable-framework-and-scenario-math
  title: Public comparables suggest fair value is plausible only under a relatively strong ARR outcome
  body: 'The cleanest public way to frame Bitwarden is through category-adjacent identity and security software comparables rather than through false precision about its undisclosed current ARR. Public market data gives a useful band. As of the run date, Okta traded at about $26.64 billion market cap on roughly $3.00 billion trailing revenue, or about 8.7x sales. SailPoint traded around $10.75 billion on about $1.12 billion trailing revenue, or roughly 9.6x sales. CyberArk, boosted by strong disclosed ARR, cash flow, and strategic scarcity, sat much higher at roughly $20.64 billion market cap and about 16.5x annual revenue. Those are not perfect peers: Bitwarden is smaller, more password-centric, more open-source, more self-host friendly, and far less disclosed. But the spread is still decision-useful because it shows what public markets pay for identity-security assets when they can see backlog, ARR quality, and cash generation. That leads to the key sensitivity test. At an 8x to 10x multiple
    band similar to mature or solid-growth public identity software, a hypothetical $1.67 billion Bitwarden valuation would require roughly $167 million to $209 million of ARR or revenue. At a CyberArk-like 16.5x premium multiple, the required revenue would fall closer to $101 million, but that premium normally presumes richer disclosure, stronger enterprise penetration evidence, and clearer cash-generation power than Bitwarden currently provides. The implication is balanced rather than bearish. Bitwarden does not need implausible revenue to support a unicorn-plus outcome, but investors also do not have the evidence needed to confidently assume it already has that revenue quality. That is why the stance is fair, not cheap.'
