- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR and growth quality
    - Current ARR, ARR growth, segment mix, and paid/free conversion
    - Determines whether the public scale story monetizes enough to support valuation
    - Management data room / CFO
  - - Retention quality
    - NRR, GRR, churn, and cohort behavior by segment
    - Multiple support depends more on durability than logo count
    - Revenue operations / FP&A
  - - Margin and burn
    - Gross margin, support burden, operating burn, free cash flow, runway
    - Needed for downside protection and capital-needs analysis
    - Finance and board materials
  - - Deployment mix
    - Self-host share, support cost, patch-lag profile, and renewal differences by deployment type
    - Self-hosting can be moat or drag depending on economics and support load
    - Customer success / support / product
  - - Cap table and preferences
    - Preference stack, investor rights, option overhang, and any secondary marks
    - Headlines can hide weak investor return math
    - Legal / finance / lead investor
  - - Risk controls
    - Secure-development KPIs, postmortems, mean-time-to-patch, and incident discipline
    - Trust-sensitive assets lose value quickly when security control quality is unknown
    - Security leadership / board risk committee
  notes: If Bitwarden answered most of these asks strongly, the recommendation could improve materially.
