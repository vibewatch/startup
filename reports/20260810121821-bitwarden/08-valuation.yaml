- id: TV004
  title: Comparable valuation table
  type: enumeration
  columns:
  - Comparable
  - Current metric set
  - Valuation / multiple / status
  - Relevance
  - Limitation
  rows:
  - - Okta
    - TTM revenue about $3.00B; strong RPO and positive cash generation
    - About $26.64B market cap; about 8.7x sales
    - Large public identity platform shows mature-category multiple floor
    - Much larger scale, richer disclosure, broader platform, different margin profile
  - - SailPoint
    - TTM revenue about $1.12B; 10-K discloses ARR and retention framing
    - About $10.75B market cap; roughly 9.6x sales
    - Useful identity-security comp with customer-hosted plus SaaS mix
    - Different product focus and public-company reporting discipline
  - - CyberArk
    - 2025 revenue about $1.36B; ARR about $1.44B; strong cash generation
    - About $20.64B market cap; about 16.5x annual revenue before delisting
    - Shows premium paid for strong identity-security assets with enterprise depth
    - PAM leader with clearer metrics, M&A support, and bigger enterprise footprint
  - - Bitwarden public context
    - Strong scale and product proof, but no public ARR / NRR / margin disclosure
    - Last disclosed financing size is $100M; official post-money undisclosed
    - Closest business-model fit among the set because it is the actual target asset
    - Private-company opacity makes direct multiple selection fragile
  notes: Uses the most decision-useful public identity/security references available in this run rather than pretending there is a perfect Bitwarden public comp.
