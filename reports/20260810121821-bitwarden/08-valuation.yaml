- id: decision-boundaries-and-diligence-upgrade-path
  title: 'The upgrade path is simple: prove durable ARR quality and avoid trust shocks'
  body: 'Bitwarden’s next-step diligence asks are unusually straightforward because the current chapter is blocked less by market ambiguity than by private-company opacity. The company does not need another narrative deck; it needs decision-grade numbers. Investors should ask for current ARR, year-over-year ARR growth, NRR, GRR, segment mix, paid versus free mix, enterprise concentration, self-host share, gross margin, operating burn, cash runway, and any secondary or tender marks since the 2022 round. They should also request the specific rights and preferences attached to prior financing, because liquidation preferences or governance terms can materially change return outcomes even when the top-line valuation looks acceptable. Just as important, the risk chapter must remain wired directly into valuation. Another major authorization flaw, a visible outage pattern, or evidence that self-host/freemium adoption does not monetize cleanly would compress the defensible multiple quickly. The upside
    case is also clear. If Bitwarden can show ARR comfortably into the mid-hundreds of millions, healthy retention, good gross margins, and continued enterprise expansion into Secrets Manager or passwordless workflows without renewed trust damage, the recommendation could move higher. Until then, the final call should stay disciplined: Bitwarden is a credible, strategically interesting cybersecurity unicorn candidate whose public evidence supports monitoring and deeper diligence, but not a stronger price call.'
