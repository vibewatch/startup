- id: architecture-deployment-and-trust-controls
  title: Architecture, deployment model, and trust controls
  body: 'Bitwarden’s public technical documentation is unusually concrete for a private cybersecurity vendor. The server repository describes the backend as APIs, database, and core infrastructure written in C# on .NET Core with T-SQL/SQL Server, while the install guide shows the standard self-hosted deployment model as Docker containers with a default MSSQL Express image and the option to use an external database. That architecture is important because Bitwarden’s self-hosting promise is not marketing-only; it is a real deployment pattern with documented machine requirements, update steps, backup implications, and optional SCIM enablement. Secrets Manager and Passwordless.dev extend that architecture into adjacent workflows. Secrets Manager adds projects, machine accounts, access tokens, CLI automation, and SDK usage for secret injection, while Passwordless.dev exposes a WebAuthn-oriented toolkit and public backend repo for passkey registration and sign-in. On the trust side, Bitwarden’s
    posture is reinforced by technical docs and compliance pages rather than only by brand copy. The company publicly states zero-knowledge and end-to-end encryption, a broad audit program across clients, network, SDK, and cryptography, and compliance claims spanning SOC 2 Type II, SOC 3, ISO 27001, HIPAA, GDPR, CCPA/CPRA, and DPF. Open source is part of the same architecture story because licensing and public code access are framed as mechanisms for security review, not just a philosophical choice. AGPL obligations also explain why the self-hosted/server side of Bitwarden is a meaningful differentiator for buyers who care about inspectability and control.'
