company:
  name: Bitwarden
chapter:
  number: 5
  title: Product & Technology
  summary: 'Bitwarden’s product stack is broader and more technically legible than the password-manager label alone suggests. The company now spans a mature cross-platform vault, enterprise governance controls, self-hosting, SCIM and directory automation, developer secrets, and Passwordless.dev passkey tooling. Public repositories and release notes show active 2026 investment across server, client, SDK, and browser surfaces, while compliance, audits, and AGPL-linked openness reinforce Bitwarden’s trust story. The main technical caveat is that optional self-hosting and broad browser/OS coverage create meaningful dependency and operational-risk surfaces that public marketing does not fully quantify.'
sections:
- id: product-surface-and-user-workflow
  title: Product surface, module map, and user workflow
  body: 'Bitwarden’s delivered product is no longer just a personal password vault. The public surface in 2026 spans personal and family password management, business and enterprise vault administration, self-hosted deployment, developer-oriented secrets management, directory synchronization, SCIM provisioning, and Passwordless.dev for passkey registration and sign-in flows. That breadth matters because it changes the customer workflow from a single-user autofill app into a layered control plane for individuals, IT administrators, and developer teams. Consumers primarily encounter Bitwarden as cross-platform storage, autofill, generation, and sharing. Business admins encounter centralized ownership, role-based sharing, event logging, policies, and lifecycle automation. Developer teams encounter Secrets Manager, machine accounts, access tokens, CLI usage, and SDK bindings. The workflow therefore branches by user role rather than by separate codebases: one trust model extends from vault storage
    into enterprise governance and developer credential automation. Official business and enterprise pages also show why implementation matters to adoption. Bitwarden markets easy data import, quick onboarding, passkeys, and strong employee usability because the product has to work for both security teams and reluctant end users. Public app-store listings and repo structure corroborate that platform reach is a real operating feature, not a slogan: Bitwarden distributes through browser extension stores, Android, desktop packaging, and CLI registries, and the clients repository explicitly coordinates multiple surfaces at once.'
