  title: Revenue-quality evidence is still much thinner than adoption evidence
  body: Public sources support scale and breadth, but not paid/free mix, cohort retention, seat density, or top-customer concentration. Consumer-review noisiness also warns against over-reading enterprise-satisfaction data as a universal product-love signal.
