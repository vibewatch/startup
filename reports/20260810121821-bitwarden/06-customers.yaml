  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality-by-segment
    missingEvidence: Paid versus free mix, seats per business customer, and ARR contribution by consumer, SMB, enterprise, MSP, and developer-oriented use cases.
    whyItMatters: Customer count alone does not reveal monetization quality or the durability of the business mix.
    diligencePath: Request segment ARR, paying-customer counts, seat density, and conversion data by plan.
    relatedQuestionRefs:
    - QU025
    - QU028
    relatedTableRefs:
    - TU001
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: NRR, GRR, logo retention, expansion by cohort, and plan-level renewal behaviour.
    whyItMatters: Customer quality for a security SaaS business depends heavily on renewal and expansion, not just logo breadth.
    diligencePath: Review cohort retention tables, renewal waterfalls, churn reasons, and expansion by segment.
    relatedQuestionRefs:
    - QU026
    - QU029
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-10 customer concentration, largest contracts, sector-weighted exposure, and partner dependence.
    whyItMatters: A concentrated enterprise base can materially alter valuation quality and downside risk.
    diligencePath: Request top-customer revenue concentration, pipeline concentration, and channel-partner dependence data.
    relatedQuestionRefs:
    - QU027
    - QU029
    relatedTableRefs:
    - TU002
    - TU005
  - type: missing-source
    severity: minor
    topic: case-study-freshness
    missingEvidence: Consistent publish dates, rollout dates, and current deployment sizes for named customer stories.
    whyItMatters: Undated case studies are useful as proof of fit but weaker as proof of current deployment depth.
    diligencePath: Ask management for publish dates, live seat counts, expansion history, and current-status confirmations for referenced customers.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU002
    - TU005
