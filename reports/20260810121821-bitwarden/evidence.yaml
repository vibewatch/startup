evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      An accessible primary or independent source that discloses the 2022 post-money valuation and any 2025-2026 refresh
      or secondary marks.
    whyItMatters: >-
      The overview can confirm round size but cannot cleanly underwrite current private-market value without a real
      valuation anchor.
    diligencePath: >-
      Request board materials, cap-table extracts, or management-approved data-room support for the 2022 post-money and
      any later tender or secondary transactions.
    relatedQuestionRefs:
      - QO008
      - QO027
  - type: missing-source
    severity: material
    topic: leadership-change
    missingEvidence: >-
      An official Bitwarden announcement or filing that states when Michael Sullivan replaced Michael Crandell as CEO
      and why the transition occurred.
    whyItMatters: >-
      Leadership succession timing and rationale affect governance diligence, operating continuity, and sponsor
      influence analysis.
    diligencePath: >-
      Request board minutes, a press release, or a management timeline explaining the CEO transition and any associated
      executive departures.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      ARR, revenue, gross margin, burn, headcount trend, and customer concentration data for the business after the 2022
      raise.
    whyItMatters: >-
      Without core operating metrics, the overview can establish identity and strategy but not economic quality or
      valuation support.
    diligencePath: >-
      Request audited or board-level KPI packs and segmentation by self-serve, SMB, enterprise, and channel-sourced
      revenue.
    relatedQuestionRefs:
      - QO010
      - QO027
  - type: stale
    severity: minor
    topic: security-remediation
    missingEvidence: >-
      A consolidated public remediation note showing when each 2026 Bitwarden Server CVE was fixed, how broadly
      customers were exposed, and whether exploitation occurred in the wild.
    whyItMatters: >-
      Current-year CVEs do not by themselves prove operational weakness, but remediation speed and blast-radius evidence
      would sharpen risk judgment.
    diligencePath: >-
      Review GitHub releases, security advisories, customer notices, and internal incident-response postmortems for the
      affected server versions.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: TO002 leadership-tenure coverage
    missingEvidence: >-
      Public tenure history and prior-role context for each current executive in TO002, plus a formal announcement for
      the CEO transition.
    whyItMatters: >-
      The current management list is public, but investor diligence usually needs executive tenure, succession
      rationale, and board reporting lines to judge leadership stability.
    diligencePath: Request executive bios, appointment dates, and org-chart materials from management or investor relations.
    relatedQuestionRefs:
      - QO003
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: TO003 stakeholder and investor map completeness
    missingEvidence: >-
      A current cap table or board observer list showing ownership percentages, pro-rata rights, and any investors not
      named in accessible public disclosures.
    whyItMatters: >-
      The public record identifies PSG and Battery, but later-stage diligence needs the full stakeholder map to assess
      control, future financing dynamics, and liquidation outcomes.
    diligencePath: Request a cap table, stockholder agreement summary, and current board observer list from management or counsel.
    relatedQuestionRefs:
      - QO005
      - QO007
      - QO027
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: bitwarden-share-and-seat-counts
    missingEvidence: >-
      Paid seat counts, enterprise versus self-serve mix, geo mix, and attach rates for Secrets Manager and
      Passwordless.dev.
    whyItMatters: >-
      Without segment-level operating data, the market chapter can bound TAM and SAM but cannot convert that into a
      reliable Bitwarden SOM or share estimate.
    diligencePath: >-
      Request board KPI packs, cohort data, paid-seat history, and win/loss segmentation by SMB, mid-market, enterprise,
      and developer products.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: tam-methodology-transparency
    missingEvidence: >-
      Transparent methodology notes from analyst publishers showing how each market-size estimate defines password
      management, passkeys, secrets, and enterprise controls.
    whyItMatters: Conflicting TAM figures can materially distort valuation and market-share narratives if the definitions differ.
    diligencePath: >-
      Obtain the full paid reports or vendor methodology appendices and normalize included/excluded spend before using
      TAM in valuation work.
    relatedQuestionRefs:
      - QM024
