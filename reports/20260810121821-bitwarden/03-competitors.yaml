callouts:
- calloutType: strength
  title: Bitwarden is the transparency-and-control outlier in a mostly closed field
  body: Most named peers compete on convenience, security claims, and enterprise polish. Bitwarden’s unusual combination of open-source verifiability, self-hosting, and low business pricing gives it a differentiated wedge that is hard to copy all at once without disrupting premium pricing or SaaS defaults.
  claimRefs:
  - CP018
  - CP026
  - CP027
  - CP028
  - CP036
- calloutType: risk
  title: Premium mindshare is not clearly Bitwarden’s to lose
  body: Independent reviewers still hand some of the most visible quality signals to 1Password and NordPass, while enterprise incumbents compete with support, compliance, and adjacent platform breadth. Bitwarden’s moat is strongest on trust and value, not on universal product-prestige leadership.
  claimRefs:
  - CP017
  - CP020
  - CP035
  - CP037
