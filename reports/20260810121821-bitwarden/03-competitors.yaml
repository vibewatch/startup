- id: direct-peer-profiles-capabilities-and-pricing
  title: Direct peer profiles, capabilities, and pricing posture
  body: 'Among named peers, 1Password is the clearest premium benchmark. Official materials say it serves more than 200,000 businesses, targets humans, AI agents, and machines, and layers passkeys, SSO, reporting, and enterprise customer-success motions on top of traditional vaulting. LastPass remains a meaningful incumbent with 100,000+ business customers, a $7-per-user business plan, and an integrated SSO/MFA posture, though independent review mindshare has weakened versus earlier years. Dashlane is explicitly reframing the offer as Omnix Password Management plus Credential Protection, which suggests a shift from consumer vault heritage toward broader credential-risk management. Keeper competes from the security-and-compliance end of the market, emphasizing FedRAMP, FIPS, zero knowledge, passkeys, and fast deployment. NordPass pushes a cleaner user experience and distinctive XChaCha20 encryption story, while Enpass attacks the market from a lower-cost and higher-control angle with offline-friendly
    storage, SCIM/SSO, and a $1.99-per-user business plan. Against that field, Bitwarden’s pricing remains aggressive and its trust narrative unusually strong. The most important reading is not that one rival wins every category, but that each peer attacks a different weak point: 1Password on premium polish and breadth, LastPass on installed-base familiarity, Keeper on certifications, NordPass on usability, and Enpass on local control.'
