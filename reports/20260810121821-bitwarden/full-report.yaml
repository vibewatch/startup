companyProfile:
  summary: >-
    Bitwarden is an open-source password management and digital vault company headquartered in Santa Barbara,
    California. Founded in 2016 by Kyle Spearrin, Bitwarden differentiates through its open-source, auditable codebase
    (AGPL-3.0), optional self-hosting, and zero-knowledge architecture that has earned strong trust among
    security-conscious individuals and enterprises. The company raised $100 million in a September 2022 growth round led
    by PSG with Battery Ventures participation, solidifying Bitwarden as a private cybersecurity unicorn candidate.
    Beyond password management, Bitwarden has expanded into enterprise secrets management and passkey infrastructure
    through Bitwarden Secrets Manager and Bitwarden Passwordless.dev.
  foundedDate: '2016-01-01'
  founders:
    - name: Kyle Spearrin
      role: Founder & CTO
      background: Solo founder who built and open-sourced the original Bitwarden codebase before raising institutional capital.
  foundingLocation: Santa Barbara, California, USA
  headquarters: Santa Barbara, California, USA
  productSummary: >-
    Password manager with apps for all platforms, enterprise vault, secrets manager for developer credentials, and
    passwordless authentication SDK; all built on an open-source, auditable codebase.
  customerFocus: >-
    Security-conscious individuals, developers, SMBs, and enterprise IT/security teams requiring auditable,
    self-hostable credential management.
  businessModel: >-
    Freemium SaaS — free personal tier, paid premium/family plans, Teams and Enterprise tiers, plus Secrets Manager and
    Passwordless.dev as add-on expansion paths.
  stage: Series B (growth)
  fundingStatus: >-
    $100M growth round (September 2022) led by PSG with Battery Ventures participation; official post-money valuation
    undisclosed publicly.
