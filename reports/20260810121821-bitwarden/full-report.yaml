      - number: '2.3'
        title: Buyers, adoption path, growth drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Buyer and payer roles fragment sharply by segment. In consumer use, the same person is buyer, user, and
              payer; in SMBs the buyer is often an IT generalist or owner; in larger organizations the budget owner
              shifts toward the CISO, IAM lead, or IT operations team; and for secrets or passkey projects the
              platform-engineering or developer-experience team joins the buying group. Bitwarden’s own trial guide,
              customer-success hub, and 220-employee case study all imply that adoption follows a repeatable enterprise
              path: start with an admin-led pilot, configure policies and provisioning, migrate shared credentials into
              collections, onboard users in waves, then monitor usage and friction. Procurement complexity rises when
              security, IT, and engineering all need to agree on standards, deployment model, and rollback plan. Macro
              demand drivers are strong. Verizon’s 2026 DBIR continues to describe phishing, stolen credentials, and the
              human element as central breach causes; IBM reports record average breach costs; NIST elevates
              phishing-resistant authentication at higher assurance levels; and Microsoft is forcing Entra customers off
              Microsoft-managed SMS and voice toward passkeys. Those are real tailwinds for vendors that bridge
              passwords, passkeys, and secrets. The counterweights are equally real: built-in free substitutes compress
              low-end willingness to pay, category boundaries blur with PAM and identity suites, and Bitwarden still
              does not disclose the public customer mix or paid-seat penetration needed to underwrite share with
              precision.
