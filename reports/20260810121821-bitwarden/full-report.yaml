  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Bitwarden’s relevant market is broader than a standalone consumer password vault but narrower than the
              full identity stack. The core battleground is workforce and business password management: tools that
              store, share, synchronize, and audit human credentials across browsers, desktop apps, mobile devices, and
              enterprise directories. Bitwarden’s own enterprise materials consistently extend that core into adjacent
              layers that matter to business buyers: SCIM-based provisioning, SSO, event logging, self-hosted
              deployment, developer secrets handling, and passkey infrastructure. That means Bitwarden increasingly sits
              at the intersection of password management, access governance, and lightweight machine-secret control
              rather than only in the consumer “vault app” category. The substitute set is real and strategically
              important. Google Password Manager and Apple’s built-in passwords/passkeys flows provide free baseline
              credential storage on major platforms, while FIDO passkeys and Microsoft’s migration plans push the market
              toward phishing-resistant authentication that can live inside browsers, operating systems, or third-party
              managers. Bitwarden’s differentiator is therefore not simply storing passwords; it is combining
              open-source transparency, optional self-hosting, cross-platform portability, and enterprise administration
              for buyers who need more control than native platform tools usually offer.
