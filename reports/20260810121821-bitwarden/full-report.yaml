      - number: '3.3'
        title: Switching costs, distribution power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Bitwarden’s moat is real but not absolute. Low-end lock-in is weak because users can import passwords,
              rely on built-in platform managers, or choose low-cost alternatives like Enpass or NordPass; premium
              lock-in is also constrained because rivals now market many of the same headline features, including
              passkeys, admin controls, breach alerts, and sharing. The harder-to-copy part of Bitwarden’s position is
              the bundle: open-source verifiability, optional self-hosting, broad platform coverage, and price
              discipline that undercuts premium peers. That bundle is attractive to security-conscious buyers who
              distrust closed black boxes or need more deployment control than native tools provide. But scale and
              reviewer mindshare do not universally favor Bitwarden. Tom’s Guide calls 1Password the best overall
              product and PCMag gives Editors’ Choice leadership to NordPass on the paid side, while enterprise
              incumbents neutralize simple feature gaps with onboarding help, account management, support coverage, and
              adjacent platform expansion. Procurement leverage therefore matters almost as much as product fit. The
              central competitive question is therefore whether Bitwarden can convert its trust-and-value wedge into
              durable enterprise share before the category becomes either free baseline hygiene or a feature inside
              larger access suites.
