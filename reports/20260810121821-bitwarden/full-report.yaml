      - number: '4.3'
        title: Margin structure, capital adequacy, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The easiest part of Bitwarden’s financial story to infer is what it is not. This is not a
              capital-intensive hardware or payments business that needs working-capital finance, inventory, or project
              debt. Accessible public evidence points to a software company whose major cost buckets are likely
              engineering, cloud infrastructure, security operations, support, and go-to-market. Public filings from
              adjacent identity and security vendors help bound the likely shape of the economics: Okta’s Q1 2026 gross
              profit represented roughly 77.8% of revenue and CyberArk’s 2024 gross profit represented roughly 79.2% of
              revenue, while both companies also spent meaningfully on sales and marketing. Those peer figures do not
              prove Bitwarden’s margins, but they do support the view that a well-run password and identity software
              vendor can have high gross margins with substantial sales investment. Capital adequacy is the real blind
              spot. The 2022 $100 million growth round was explicitly framed as fuel for passwordless, developer
              solutions, channel development, and international expansion, but there is still no public cash balance,
              burn rate, runway, debt, or next-round trigger. That leaves the financial verdict favorable on revenue
              quality and likely margin shape, but incomplete on solvency, efficiency, and current funding dependence.
              The missing pieces are ordinary private-company disclosures, yet they remain decisive for investors and
              any credible estimate of downside protection.
