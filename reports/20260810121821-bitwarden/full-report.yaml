  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, substitutes, and competitor classes
        blocks:
          - type: paragraph
            body: >-
              Bitwarden’s competitive set is not one uniform list of password apps. The market breaks into at least four
              classes. First are direct paid peers in workforce and business password management: 1Password, LastPass,
              Dashlane, Keeper, NordPass, and Enpass. Second are native platform substitutes such as Google Password
              Manager and Apple Passwords/passkeys, which make basic credential storage a zero-price default on major
              devices and browsers. Third is the status quo of manual or semi-manual credential sharing, whether through
              spreadsheets, browser autofill, or ad hoc internal practices. Fourth are broader access or identity
              platforms that expand beyond vaulting into passkeys, secrets, SaaS risk, or AI-agent credentials. This
              matters because Bitwarden is pulled in both directions: downmarket by free built-ins and upmarket by
              broader access platforms. The result is a structurally bifurcated field in which feature parity on simple
              password storage is no longer enough to sustain a moat. A vendor now has to win on trust, pricing,
              deployment control, support, and adjacent workflows. That framing also means different rivals matter at
              different deal stages: Google and Apple can stop a low-end paid conversion before it starts, while
              1Password or Keeper matter more once a buyer has already decided that centralized enterprise
              administration is worth paying for. Manual sharing habits can also delay conversion even when the security
              case is obvious for budget holders.
            claimRefs:
