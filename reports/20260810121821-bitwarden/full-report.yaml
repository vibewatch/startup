              proof-of-concept and post-sale enablement rather than a purely top-down enterprise sales motion. The
              company’s own public proxies reinforce that reading: it says 83% of enterprise customers go live in under
              a month, full ROI can arrive in about 10 months, and one published customer reached 90% adoption across
              220 employees in four months. Those are not audited unit-economics metrics, but they do indicate short
              implementation cycles and a product that does not appear operationally heavy to deploy. That matters
              because public identity and security software comps such as Okta and CyberArk spend heavily on sales and
              marketing as they scale. Bitwarden’s freemium motion and lower list prices may reduce customer-acquisition
              cost in some segments, but without CAC, payback, discount rate, or net-retention disclosure, that remains
              a hypothesis rather than an underwritten fact. The GTM story is encouraging, not conclusive, and it still
