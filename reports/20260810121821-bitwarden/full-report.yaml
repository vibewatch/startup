  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Security, privacy, and legal exposure are the highest-priority risk cluster
        blocks:
          - type: paragraph
            body: >-
              Bitwarden sells itself as a trusted open-source password, passkey, and secrets platform, so security
              lapses transmit directly into customer trust risk. Public 2026 evidence shows that this is not a
              theoretical concern. NVD and related CVE records describe a cluster of Bitwarden Server flaws across
              trusted-device approval, provider-to-organization binding, SCIM key handling, organization-user role
              enforcement, billing-data authorization, and event-template JSON injection. The most severe of these,
              CVE-2026-60104, allowed a low-privileged organization member to obtain another user's vault key and
              victim-scoped access token under specific trusted-device approval conditions before version 2026.6.0.
              Other 2026 issues show that the attack surface extends beyond one code path: cloud-hosted provider
              workflows, SCIM management, organization billing endpoints, webhook/SIEM integrations, and
              organization-role handling all surfaced defects. Even when patches arrive quickly, the pattern matters
              because Bitwarden's value proposition depends on security-sensitive buyers believing the admin and sharing
              surfaces are safer than the status quo. Legal and privacy terms add a second layer of exposure.
              Bitwarden's Terms of Service provide the service as-is, disclaim warranties, limit liability, and put
              substantial responsibility on the user for account security and legal compliance. The privacy policy and
              compliance materials are stronger than many peers in transparency, but they also confirm collection and
              retention of administrative and analytics-related data, dependence on DPF/SCC/GDPR structures for
              international transfers, and exposure to the regulatory consequences that would follow any meaningful
              incident affecting regulated customers. In short, Bitwarden's mitigation maturity is high, but the
              residual consequence of a security or privacy failure is also high because the company is selling the
              control plane for customer credentials.
