  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Renewed trust shock
        - Another major authorization or key-exposure issue within 12 months
        - Premium trust narrative weakens and multiple compresses
        - Move to downside case and reprice
      - - Reliability deterioration
        - Repeated outage spikes or sustained service instability
        - Enterprise procurement and retention confidence fall
        - Demand operational metrics before proceeding
      - - Weak monetization disclosure
        - ARR materially below low-hundreds-of-millions band or poor retention
        - Fair valuation stance becomes full / unattractive
        - Downgrade recommendation
      - - Cap-table overhang
        - Heavy preference stack or punitive seniority in prior rounds
        - Exit-value sharing becomes less attractive than headline valuation suggests
        - Rework return model before investment
      - - Roadmap without attach-rate proof
        - Secrets / passwordless expansion adds complexity but not revenue quality
        - Platform upside is overstated
        - Value core vault business more conservatively
    notes: These are the highest-signal events that would most directly change the recommendation.
    claimRefs:
      - CV023
      - CV025
      - CV026
      - CV031
      - CV032
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - ARR and growth quality
        - Current ARR, ARR growth, segment mix, and paid/free conversion
        - Determines whether the public scale story monetizes enough to support valuation
        - Management data room / CFO
      - - Retention quality
        - NRR, GRR, churn, and cohort behavior by segment
        - Multiple support depends more on durability than logo count
        - Revenue operations / FP&A
      - - Margin and burn
        - Gross margin, support burden, operating burn, free cash flow, runway
        - Needed for downside protection and capital-needs analysis
        - Finance and board materials
      - - Deployment mix
        - Self-host share, support cost, patch-lag profile, and renewal differences by deployment type
        - Self-hosting can be moat or drag depending on economics and support load
        - Customer success / support / product
      - - Cap table and preferences
        - Preference stack, investor rights, option overhang, and any secondary marks
        - Headlines can hide weak investor return math
        - Legal / finance / lead investor
      - - Risk controls
        - Secure-development KPIs, postmortems, mean-time-to-patch, and incident discipline
        - Trust-sensitive assets lose value quickly when security control quality is unknown
        - Security leadership / board risk committee
    notes: If Bitwarden answered most of these asks strongly, the recommendation could improve materially.
    claimRefs:
      - CV008
      - CV017
      - CV018
      - CV032
      - CV038
      - CV039
      - CV040
