  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation should remain track because product proof exceeds price proof
        blocks:
          - type: paragraph
            body: >-
              Bitwarden has enough public evidence to merit ongoing investor attention, but not enough to justify a
              price-insensitive positive call. The positive side of the ledger is real. Official and mirrored 2026
              company announcements support substantial scale, with more than 15 million users and 80,000 businesses,
              plus acceleration in new business subscriptions. Official product pages also show a broad monetization
              stack that extends from low-friction consumer subscriptions into teams, enterprise, secrets management,
              and passwordless infrastructure. Customer-proof pages, implementation guides, and G2 enterprise materials
              reinforce that the company is not just a free consumer vault with a good reputation; it has an enterprise
              deployment motion and credible satisfaction signals. The problem is not quality but underwriting depth.
              Public evidence still does not disclose ARR, net retention, gross retention, margin structure, cash burn,
              capital structure, or the contractual terms attached to the 2022 growth round. That means the most
              important question in a valuation chapter — whether the current or last private price is attractive —
              cannot be answered directly from disclosed company economics. The best discipline is to separate company
              quality from price support. Bitwarden looks like a strong private cybersecurity asset with real platform
              adjacencies and durable trust advantages, but the right recommendation at this evidence level is track
              rather than invest or buy. That stance can change, but only when management discloses the monetization
              quality and risk-adjusted durability needed to translate strong product evidence into a supported
              valuation view.
            claimRefs:
