  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments, scale, and public proof set
        blocks:
          - type: paragraph
            body: >-
              Bitwarden's publicly visible customer base spans at least four distinct buying or usage motions in 2026:
              individuals and families using a free or low-cost vault, SMB and mid-market teams buying shared credential
              controls, enterprise security teams buying administrative governance and deployment flexibility, and
              technically oriented developer or MSP environments extending password management into broader identity or
              secrets workflows. The cleanest scale claim is still company-supplied: Bitwarden says more than 15 million
              users and 80,000 businesses worldwide rely on the platform, with reach across 180 countries and more than
              50 languages. That top-line breadth matters because it suggests Bitwarden is not a niche open-source
              project living only on developer goodwill; it has both mass-distribution and meaningful business
              penetration. Public customer proof also shows that the platform is being sold into different operating
              contexts rather than a single homogeneous buyer. The customer success hub and independent case-study
              aggregator list six named references: Alpha Video & Audio, DMM Eikaiwa, Glovo, GreenLoop IT Solutions,
              Intesys, and University of Toronto Press. Those references span audiovisual systems integration, online
              education, delivery/logistics, managed services, IT consulting, and academic publishing. The buyer
              personas exposed in those stories are also useful: IT administrators, security leaders, CTOs, founders,
              and network administrators appear repeatedly, which supports the view that Bitwarden often lands with
              operational owners of credential policy rather than only with procurement or finance. Enterprise
              positioning remains visible on official product pages as well. Business messaging stresses easy
              deployment, secure sharing, and predictable pricing, while the enterprise page emphasizes self-hosting
              flexibility, transparency, and advanced controls. Overall, the most supportable segmentation thesis is
              that Bitwarden wins customers where trust, price discipline, and deployment control matter more than
              polished premium-brand UX.
