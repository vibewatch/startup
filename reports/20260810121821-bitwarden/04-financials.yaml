  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: arr-and-revenue-disclosure
    missingEvidence: ARR, recognized revenue, bookings, and revenue mix across consumer, teams, enterprise, secrets, and passwordless.
    whyItMatters: Without core topline disclosure, list-price logic cannot be converted into real performance or market-share economics.
    diligencePath: Request monthly ARR history, recognized revenue by product, customer-size segmentation, and bookings waterfall.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
