callouts:
- calloutType: strength
  title: The revenue model is clearer than the results
  body: 'Bitwarden’s monetization logic is unusually legible for a private cybersecurity company: public list prices, visible product tiers, freemium entry, and adjacent developer SKUs make the software model easy to understand even though ARR and margins are still undisclosed.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI012
- calloutType: risk
  title: Capital adequacy cannot be underwritten from public evidence
  body: The 2022 raise proves access to growth capital, but there is still no public cash balance, burn, runway, debt, or next-round trigger. That is the central reason this chapter can explain the model without fully underwriting solvency or efficiency for outside investors today.
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI037
