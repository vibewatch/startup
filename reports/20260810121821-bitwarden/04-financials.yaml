- id: TI005
  title: Public financial gaps table
  columns:
  - Missing Private Metric
  - Impact
  - Exact Diligence Path
  rows:
  - - ARR / annual revenue
    - Cannot size Bitwarden against premium peers or market share
    - Request monthly recurring revenue history, annual bookings, and segment breakout
  - - Gross margin by product
    - Cannot test whether low pricing still leaves premium software economics
    - Request GAAP gross margin and hosting/support cost allocation by product
  - - Cash balance and burn
    - Cannot underwrite runway or capital dependency
    - Request balance sheet, monthly cash burn, and board liquidity plan
  - - Net retention and expansion
    - Cannot judge quality of land-and-expand motion
    - Request NRR, GRR, cross-sell attach, and seat-expansion cohorts
  - - Discounting and realized ASP
    - Cannot convert list prices into reliable revenue model
    - Request quote data, median deal sizes, and realized price waterfall
  - - Headcount and payroll mix
    - Cannot estimate operating leverage or support burden
    - Request headcount by function, geography, and product line
  - - Self-hosted versus cloud deployment mix
    - Cannot assess support burden or infrastructure margin dynamics
    - Request customer and ARR split by hosting model
  - - Secrets Manager / Passwordless.dev attach rate
    - Cannot judge whether adjacent products are meaningful or narrative only
    - Request paid attach rates, renewal, and standalone ARR by product
  notes: Most underwriting blockers are ordinary private-company disclosure gaps, not ambiguity about the existence of a revenue model.
