  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 当前证据
      - 改变判断的证据
    rows:
      - - 正向论点：Bitwarden 已构建可信的开源身份安全平台，并有企业扩张空间
        - 15M 用户、80k 家企业、产品广度和部署证据支撑平台价值
        - 企业变现浅，或信任受损拖累转化的证据
      - - 正向论点：价格和透明度驱动的定位可以保持获客效率
        - 可见的免费增值和自托管切入口，加上强评论 / 价值信号，支撑低摩擦采用
        - CAC 抬升、付费转化差，或支持负担压倒价格优势
      - - 反论点：公开估值支撑不完整
        - 未公开 ARR、NRR、GRR、利润率或股权结构表条款
        - 管理层披露强 ARR 质量和干净融资条款
      - - 反论点：安全信任冲击可能迅速压缩倍数
        - 2026 年漏洞簇说明信任敏感性真实存在
        - 持续干净的运营记录和更好的内部控制指标
    notes: 区分公司质量论点和价格支撑论点，让建议保持纪律性。
