      - number: '1.3'
        title: 资本形成、里程碑时间线和负面信号
        blocks:
          - type: paragraph
            body: >-
              公开记录中最清楚的定价资本事件，是 Bitwarden 2022 年 9 月 6 日宣布获得 $100M 少数股权成长投资，由 PSG 领投、现有投资方 Battery Ventures 参投。Bitwarden
              自己的 CEO Q&A 把这轮融资定义为产品和商业化加速燃料，并明确点名开发者机密、无密码技术、认证、渠道伙伴和国际扩张这些下一阶段增长向量。TechCrunch 补充称，2022 年融资是 Bitwarden
              历史上首次完整披露的外部融资，并报道此前曾在 2019 年完成一轮未披露的 Series A。第三方公司档案网站也描述了两轮总融资和收购 Passwordless.dev，但它们对 2022 年轮次应标为
              Series B 还是 Series C、成立年份应记为 2015 还是 2016 并不一致；这些来源可用于交叉验证，但不能当作权威口径。公司概览层面最大的尽调缺口是估值：2022
              年官方公告没有披露投后金额，因此后续估值工作必须把反复出现的约 $1.67B 独角兽数字视为私募市场估计，而不是管理层官方声明。2026 年的主要负面信号不是已知保险库泄露，而是新披露的服务器漏洞。NVD 和
              OpenCVE 列出多个 2026 年 Bitwarden Server CVE，包括一个高严重性的可信设备账户接管问题，以及一个事件集成模板中的较低严重性 JSON 注入问题。这些披露并不推翻
              Bitwarden 的安全定位，但表明公司的企业攻击面足够宽，公开漏洞管理仍是重要尽调主题。
