      - number: '7.3'
        title: 模式、客户和执行风险仍然重要，因为变现质量仍不透明
        blocks:
          - type: paragraph
            body: >-
              第三个风险集群偏经济和战略，而非纯技术。Bitwarden
              的开源、免费增值和自托管友好定位带来信任和漏斗顶部采用，但也天然限制定价权，并给安装基数转化为高质量订阅收入的比例设定上限。来自高端同业，以及嵌入浏览器、操作系统和身份生态中且能力越来越强的原生凭据或通行密钥工作流的竞争，又放大了这个问题。公开证据确实显示强动能：Morningstar
              的 2026 年 7 月 BusinessWire 镜像称，新业务订阅在 2026 年 Q2 同比增长超过 70%，上半年增长
              60%。但公开证据仍未披露付费与免费组合、ARR、NRR、GRR、席位密度、头部客户集中度或利润率结构。这意味着投资者可以看到增长势头，却无法充分承销耐久性。客户体验证据也暗示品牌分裂：企业买家看到强价值、上线速度和控制权；面向消费者的评论更嘈杂，也更受界面打磨和可靠性影响。最后，执行范围正在扩大。Bitwarden
              现在管理的不只是密码，还包括通行密钥、访问智能工作流、AI agent
              叙事、自托管，以及开发者相邻机密工具。这种扩张可以增强平台，但也会提高路线图发散、支持负担和安全复杂性的概率。因此，实际否定条件很直接：再次出现重大、损害信任的漏洞集群；出现可见合规失败；证据显示自托管和免费增值用户无法变现为持久订阅增长；或企业实施和满意度信号急剧恶化，都会挑战当前论点。
