      - number: '7.2'
        title: 自托管和广泛集成宽度放大运营、平台和依赖风险
        blocks:
          - type: paragraph
            body: >-
              Bitwarden 的自托管选项是商业强项，但也以纯 SaaS 竞争对手可部分避免的方式扩大了公司的运营风险表面。自托管文档明确把云描述为更容易的路径，把自托管描述为一种需要 Linux 或 Windows
              服务器管理、Docker 或 Kubernetes 知识、SQL 管理、证书管理和持续维护的模式。这意味着客户成功部分取决于外部运维者技能，而不只是 Bitwarden 代码质量。严重漏洞出现时，已打补丁的
              Bitwarden Cloud 和未打补丁的自托管环境可能迅速分化，即便核心供应商反应得当，也会造成支持和声誉不对称。平台依赖也拓宽了运营暴露。企业产品表面把 Bitwarden 接入
              Okta、Microsoft Entra ID、Google Workspace、LDAP、Splunk、Sentinel、Rapid7、Elastic、浏览器扩展、移动平台和 Azure
              托管云基础设施。每个集成都有商业价值，但也都会带来兼容性、性能或安全耦合风险。可靠性证据是混合的，而非令人警报大作：官方状态页在紧邻运行日期窗口没有显示新事件，但第三方监测仍记录了 2026 年 8 月 5
              日一次官方承认的故障，以及近期问题窗口周围有意义的用户报告量。评测渠道也通过反复提到 UI 打磨、支持响应和产品缺陷等痛点，释放了另一项运营信号。含义不是 Bitwarden
              运营薄弱；更准确地说，公司选择了技术上宽、部署上灵活的产品策略，这必然比更窄的仅保险库 SaaS 带来更高支持复杂度和更多故障模式。
