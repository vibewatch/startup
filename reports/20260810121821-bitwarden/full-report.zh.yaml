companyProfile:
  summary: >-
    Bitwarden 是一家开源密码管理和数字保险库公司，总部位于加州 Santa Barbara。公司由 Kyle Spearrin 于 2016
    年创立，凭借开源、可审计代码库（AGPL-3.0）、可选自托管和零知识架构，与同业拉开差异，也赢得了安全敏感个人和企业的强信任。2022 年 9 月，Bitwarden 完成由 PSG 领投、Battery Ventures 参投的
    $100M 成长轮融资，进一步巩固了其作为私营网络安全独角兽候选公司的位置。密码管理之外，Bitwarden 又通过 Bitwarden Secrets Manager 和 Bitwarden Passwordless.dev
    扩展到企业机密管理和通行密钥基础设施。
  foundedDate: '2016-01-01'
  founders:
    - name: Kyle Spearrin
      role: 创始人兼 CTO
      background: 单人创始人；在引入机构资本前，构建并开源了最初的 Bitwarden 代码库。
  foundingLocation: Santa Barbara, California, USA
  headquarters: Santa Barbara, California, USA
  productSummary: 密码管理器，覆盖全平台应用、企业保险库、面向开发者凭据的机密管理器，以及无密码认证 SDK；全部建立在开源、可审计代码库之上。
  customerFocus: 安全意识强的个人、开发者、SMB，以及需要可审计、可自托管凭据管理的企业 IT / 安全团队。
  businessModel: 免费增值 SaaS——免费个人层、付费 Premium / Family 计划、Teams 和 Enterprise 层，以及作为扩展加购路径的 Secrets Manager 和 Passwordless.dev。
  stage: Series B (growth)
  fundingStatus: $100M 成长轮（2022 年 9 月），由 PSG 领投、Battery Ventures 参投；官方未公开投后估值。
