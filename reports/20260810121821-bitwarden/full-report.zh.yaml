      - number: '6.3'
        title: 扩张、集中度和客户结论
        blocks:
          - type: paragraph
            body: >-
              Bitwarden 的客户结论是正面的，但必须区分采用广度证明和收入耐久性证明。Morningstar 和 Yahoo Finance 对 2026 年 7 月公司公告的镜像称，2026 年 Q2
              新业务订阅总量同比增长超过 70%，上半年相对 2025 年增长 60%；同时，Global 2000 组织继续因开源透明度、高级部署要求、集中管理和分布式员工支持而选择
              Bitwarden。这意味着企业扩张真实存在。评测渠道也让需求驱动很容易理解：物有所值、强免费计划、开源信任、自托管和广泛跨平台支持，在 GetApp、Cloudwards、SafetyDetectives 和
              CyberInsider 中被反复提及。不过，同一评测生态也显示出有意义的摩擦。面向消费者的评论比企业管理员平台更嘈杂：Trustpilot 在 356 条评论中得到
              3.3/5，抱怨集中在复杂性、缺陷和偶发可靠性挫败感，同时也有来自长期用户的强正面评论。独立编辑评测也反复指出，Bitwarden
              安全且高性价比，但没有某些高端竞争对手那么精致或适合初学者。这说明产品感知出现分叉：IT
              主导或安全主导的买家似乎高度满意部署速度、控制和价值；主流消费者则对界面打磨和支持体验更敏感。最大的尽调限制是经济不透明。公开证据没有披露付费与免费组合、每个企业客户席位数、净留存或毛留存、按细分市场的扩张率，或头部客户集中度。因此，最可支持的结论是：Bitwarden
              拥有广泛、多元的采用和可信的企业参考网络；但投资者仍需要私有队列和集中度数据，才能把客户质量视为充分承销。
