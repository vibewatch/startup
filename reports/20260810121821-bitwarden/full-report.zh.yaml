      - number: '2.2'
        title: 规模测算视角、地域和细分经济性
        blocks:
          - type: paragraph
            body: >-
              公开的密码管理市场规模数据在增长方向上相对一致，但绝对规模并不一致；这正是尽调应保留多个视角、而不是把某个付费分析师数字当作权威口径的原因。Mordor Intelligence 与 Research and
              Markets 都给出 2026 年全球密码管理市场 $2.94B、到 2031 年增至 $8.07B、CAGR 为 22.39% 的估计；Fortune Business Insights 则把同一市场估为
              2026 年 $3.79B、到 2034 年 $10.63B、CAGR 为 13.77%。差异很重要，因为它会让任何隐含份额或估值计算相差数亿美元。相比顶层
              TAM，更稳定的是结构：云托管产品主导当前支出；混合部署在主权压力下快速增长；大型组织贡献多数当前收入；SME 从更小基数上增长最快；BFSI
              和医疗等受监管垂直行业对凭据控制的需求不成比例地强。北美仍是最大支出区域，亚太看起来是增长最快区域。Bitwarden
              的实际市场因此是全球凭据管理中的付费企业切片，而不是所有被记住密码的全集。需要跨平台管理、自托管或策略控制的企业和受监管买家，定义了一个比公开顶层 TAM 更窄的 SAM。
