  - id: TR005
    title: 缓释与投资论点破裂触发器表
    type: enumeration
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 影响
      - 行动
    rows:
      - - 安全信任风险
        - 危急或高严重性 CVE 重复出现
        - 12 个月内再次出现多租户或密码库密钥暴露
        - 信任叙事急剧走弱
        - 转入继续研究 / 下行情景
      - - 可靠性风险
        - 客户可见的宕机模式
        - 云端多处反复出现宕机峰值或持续事故窗口
        - 采购和留存风险上升
        - 要求可靠性和事后复盘证据
      - - 合规风险
        - DPF / SCC / 审计恶化
        - 认证丧失、审计延迟或重大隐私投诉
        - 受监管客户销售受损
        - 重新评估企业适配论点
      - - 变现风险
        - 转化或留存披露偏弱
        - NRR 低于同业区间，或付费 / 免费转化差
        - 开源采用未能变现
        - 压低估值立场
      - - 支持 / 自托管风险
        - 自托管问题负载升级
        - 补丁滞后投诉或支持积压激增
        - 自托管切入口变成拖累
        - 在模型中纳入更高支持成本和流失风险
      - - 执行风险
        - 路线图发散
        - 产品蔓延但缺少附加购买率证明
        - 复杂度跑在价值捕获前面
        - 只优先验证核心凭据安全论点
    notes: 本表把本章风险登记表转成具体监测点，便于投资跟进。
    enumerationScope:
