      - number: '8.2'
        title: 公开可比公司显示，只有 ARR 足够强，公允价值才站得住
        blocks:
          - type: paragraph
            body: >-
              公开口径下，框定 Bitwarden 最干净的方法，是看相邻品类的身份与安全软件可比公司，而不是围绕未披露的当前 ARR 做伪精确估算。公开市场数据给出一个有用区间。截至本次报告日期，Okta 市值约
              $26.64B，过去 12 个月收入约 $3.00B，约为 8.7x 销售额。SailPoint 市值约 $10.75B，过去 12 个月收入约 $1.12B，约为 9.6x 销售额。CyberArk 因已披露
              ARR、现金流和战略稀缺性较强，估值明显更高，市值约 $20.64B，约为年收入的 16.5x。这些并非完美同业：Bitwarden
              规模更小，更偏密码管理，更开源，更适合自托管，披露也少得多。但这个区间仍有决策价值，因为它说明，当公开市场能看清在手订单、ARR
              质量和现金生成能力时，会如何给身份安全资产定价。关键敏感性也由此出现。若采用类似成熟或稳健增长型公开身份软件的 8x 到 10x 倍数区间，假设 Bitwarden 估值为 $1.67B，则需要约 $167M 到
              $209M 的 ARR 或收入。若采用 CyberArk 式 16.5x 溢价倍数，所需收入会降到约 $101M；但这种溢价通常要求更充分的披露、更强的企业渗透证据，以及比 Bitwarden
              目前提供的更清晰现金生成能力。结论是均衡的，不是看空。Bitwarden 不需要不可思议的收入就能支撑独角兽以上结果；但投资人也没有足够证据，自信假设它已经具备那种收入质量。因此，当前判断是公允，不是便宜。
