      - number: '3.3'
        title: 转换成本、分发力量和护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Bitwarden 的护城河真实存在，但并非绝对。低端锁定很弱，因为用户可以导入密码、依赖内置平台管理器，或选择 Enpass、NordPass
              等低价替代方案；高端锁定也受约束，因为对手现在营销许多相同的标志性功能，包括通行密钥、管理员控制、泄露提醒和共享。Bitwarden
              位置中更难复制的部分是组合拳：开源可验证性、可选自托管、广泛平台覆盖，以及低于高端同业的价格纪律。这个组合吸引那些不信任闭源黑箱、或需要比原生工具更多部署控制的安全敏感买家。但规模和评测心智并不总是偏向
              Bitwarden。Tom’s Guide 称 1Password 是综合最佳产品，PCMag 则在付费侧把 Editors’ Choice 领导位置给了
              NordPass；企业在位者还靠上线帮助、客户管理、支持覆盖和相邻平台扩展来抵消简单功能差距。因此，采购杠杆几乎和产品匹配一样重要。核心竞争问题是：在这个品类变成免费基础卫生能力、或大访问套件内部功能之前，Bitwarden
              能否把信任与价值切入点转化为持久企业份额。
