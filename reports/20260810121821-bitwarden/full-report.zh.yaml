      - number: '5.2'
        title: 架构、部署模型和信任控制
        blocks:
          - type: paragraph
            body: >-
              在私营网络安全供应商中，Bitwarden 的公开技术文档异常具体。server 仓库把后端描述为用 C#、.NET Core 编写的 API、数据库和核心基础设施，并使用 T-SQL/SQL
              Server；安装指南显示标准自托管部署模型是 Docker 容器，默认 MSSQL Express 镜像，也可使用外部数据库。这个架构重要，因为 Bitwarden
              的自托管承诺不只是营销；它是有文档化机器要求、更新步骤、备份影响和可选 SCIM 启用方式的真实部署模式。Secrets Manager 和 Passwordless.dev
              把该架构延伸到相邻工作流。Secrets Manager 增加项目、机器账户、访问令牌、CLI 自动化和用于机密注入的 SDK 用法；Passwordless.dev 则提供面向 WebAuthn
              的工具包，以及用于通行密钥注册和登录的公开后端仓库。在信任侧，Bitwarden 的姿态靠技术文档和合规页面支撑，而不只是品牌文案。公司公开声明零知识和端到端加密，覆盖 clients、网络、SDK
              和密码学的广泛审计计划，以及横跨 SOC 2 Type II、SOC 3、ISO 27001、HIPAA、GDPR、CCPA/CPRA 和 DPF
              的合规主张。开源也是同一架构故事的一部分，因为许可和公开代码访问被表述为安全审查机制，而不只是理念选择。AGPL 义务也解释了为什么 Bitwarden 的自托管 / server
              侧，能为重视可检查性和控制权的买家构成有意义的差异化。
