      - number: '8.3'
        title: 上调路径很简单：证明 ARR 质量耐久，并避免信任冲击
        blocks:
          - type: paragraph
            body: >-
              Bitwarden 下一步尽调要什么，异常直接。卡住当前章节的不是市场模糊，而是私营公司不透明。公司不需要再讲一套叙事材料；它需要能让人决策的数字。投资人应索取当前 ARR、同比 ARR
              增长、NRR、GRR、细分业务组合、付费与免费组合、企业客户集中度、自托管占比、毛利率、经营性现金消耗、现金跑道，以及 2022
              年融资以来任何二级交易或要约交易价格标记。还应索取此前融资附带的具体权利和优先权，因为即使名义估值看起来可接受，清算优先权或治理条款也会实质改变回报结果。同样重要的是，风险章节必须直接接入估值。若再出现重大授权缺陷、可见的宕机模式，或证据显示自托管
              / 免费增值采用无法干净变现，可支撑倍数会迅速收缩。上行情形也很清楚：如果 Bitwarden 能证明 ARR 稳稳进入数亿美元中段、留存健康、毛利率良好，并且在不再损害信任的前提下，继续把企业业务扩展到
              Secrets Manager 或无密码工作流，建议可以上调。在此之前，最终判断应保持克制：Bitwarden
              是一个可信、具备战略吸引力的网络安全独角兽候选，公开证据支持监测和更深入尽调，但不足以支撑更强的价格判断。
