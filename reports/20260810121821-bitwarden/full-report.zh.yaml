  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 安全、隐私和法律暴露是最高优先级风险集群
        blocks:
          - type: paragraph
            body: >-
              Bitwarden 把自己销售为可信的开源密码、通行密钥和机密平台，因此安全失误会直接传导为客户信任风险。2026 年公开证据显示，这不是理论担忧。NVD 和相关 CVE 记录描述了一组 Bitwarden
              Server 缺陷，覆盖可信设备批准、provider 与组织绑定、SCIM 密钥处理、组织用户角色执行、账单数据授权，以及事件模板 JSON 注入。其中最严重的 CVE-2026-60104，在
              2026.6.0 版本之前的特定可信设备批准条件下，允许低权限组织成员获取另一名用户的保险库密钥和受害者范围访问令牌。其他 2026 年问题显示，攻击面不止一条代码路径：云托管 provider 工作流、SCIM
              管理、组织账单端点、webhook/SIEM 集成和组织角色处理都暴露过缺陷。即便补丁很快到达，这种模式仍然重要，因为 Bitwarden
              的价值主张取决于安全敏感买家相信，其管理员和共享表面比现状更安全。法律和隐私条款增加第二层暴露。Bitwarden
              的服务条款按现状提供服务，拒绝担保、限制责任，并把账户安全和法律合规的大量责任交给用户。隐私政策和合规材料在透明度上强于许多同业，但也确认公司收集并保留行政和分析相关数据，依赖 DPF/SCC/GDPR
              结构进行国际传输，并在任何影响受监管客户的实质事件后面临监管后果。简言之，Bitwarden 的缓释成熟度高，但安全或隐私失败的残余后果也很高，因为公司销售的是客户凭据控制平面。
