  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面、模块地图和用户工作流
        blocks:
          - type: paragraph
            body: >-
              Bitwarden 交付的产品不再只是个人密码保险库。2026 年的公开产品面覆盖个人和家庭密码管理、企业和大型企业保险库管理、自托管部署、面向开发者的机密管理、目录同步、SCIM
              配置，以及用于通行密钥注册和登录流程的 Passwordless.dev。这种宽度很重要，因为它把客户工作流从单用户自动填充应用，改造成面向个人、IT 管理员和开发者团队的分层控制平面。消费者主要把
              Bitwarden 当作跨平台存储、自动填充、生成和共享工具。企业管理员面对的是集中所有权、基于角色的共享、事件日志、策略和生命周期自动化。开发者团队面对的是 Secrets
              Manager、机器账户、访问令牌、CLI 用法和 SDK
              绑定。因此，工作流按用户角色分叉，而不是按独立代码库分叉：同一套信任模型从保险库存储延伸到企业治理和开发者凭据自动化。官方企业和大型企业页面也说明，实施为何影响采用。Bitwarden
              营销简单数据导入、快速上线、通行密钥和强员工易用性，因为产品必须同时服务安全团队和抗拒变化的终端用户。公开应用商店列表和仓库结构也印证，平台覆盖是真实运营特征，不是口号：Bitwarden
              通过浏览器扩展商店、Android、桌面打包和 CLI 注册表分发；clients 仓库则明确同时协调多个表面。
