  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分、规模和公开证明集
        blocks:
          - type: paragraph
            body: >-
              2026 年，Bitwarden 公开可见的客户基础至少覆盖四种不同购买或使用动作：使用免费或低价保险库的个人和家庭；购买共享凭据控制的 SMB
              与中端市场团队；购买管理治理和部署灵活性的企业安全团队；以及把密码管理延伸到更宽身份或机密工作流的技术型开发者或 MSP 环境。最干净的规模主张仍来自公司：Bitwarden 称全球超过 1,500 万用户和
              80,000 家企业依赖其平台，覆盖 180 个国家和 50 多种语言。这个顶层宽度重要，因为它表明 Bitwarden
              不是只靠开发者好感生存的小众开源项目；它既有大众分发，也有有意义的企业渗透。公开客户证明也显示，平台正在卖入不同运营场景，而不是单一同质买家。客户成功中心和独立案例聚合器列出六个具名参考：Alpha Video
              & Audio、DMM Eikaiwa、Glovo、GreenLoop IT Solutions、Intesys 和 University of Toronto
              Press。这些参考横跨视听系统集成、在线教育、配送 / 物流、托管服务、IT 咨询和学术出版。案例中暴露的买家画像也有价值：IT
              管理员、安全负责人、CTO、创始人和网络管理员反复出现，支持这样一个判断：Bitwarden 常常由凭据策略的运营所有者牵头落地，而不只是采购或财务部门推动。官方产品页面上的企业定位也很清晰。Business
              话术强调轻松部署、安全共享和可预测定价；Enterprise 页面则强调自托管灵活性、透明度和高级控制。整体而言，最可支持的细分判断是：当信任、价格纪律和部署控制比打磨精致的高端品牌 UX
              更重要时，Bitwarden 更容易赢下客户。
