      - number: '3.2'
        title: 直接同业画像、能力和定价姿态
        blocks:
          - type: paragraph
            body: >-
              在具名同业中，1Password 是最清晰的高端基准。官方材料称其服务超过 200,000 家企业，面向人类、AI agent
              和机器，并在传统保险库之上叠加通行密钥、SSO、报告和企业客户成功动作。LastPass 仍是有意义的在位者，拥有 100,000 多家企业客户、每用户 $7 的企业计划和集成 SSO/MFA
              姿态，尽管独立评测心智相比早年已经走弱。Dashlane 明确把产品重塑为 Omnix Password Management 加 Credential
              Protection，显示其正从消费级保险库传统转向更宽的凭据风险管理。Keeper 从市场的安全与合规端竞争，强调 FedRAMP、FIPS、零知识、通行密钥和快速部署。NordPass
              主打更清爽的用户体验和有辨识度的 XChaCha20 加密叙事；Enpass 则以更低成本、更高控制权切入，提供离线友好存储、SCIM/SSO 和每用户 $1.99 的企业计划。面对这个格局，Bitwarden
              的价格仍然激进，信任叙事也异常强。最重要的解读不是某个对手赢下所有类别，而是每个同业都攻击不同弱点：1Password 攻高端打磨和宽度，LastPass 攻既有安装基数熟悉度，Keeper
              攻认证，NordPass 攻易用性，Enpass 攻本地控制。
