      - number: '2.3'
        title: 买家、采用路径、增长驱动和约束
        blocks:
          - type: paragraph
            body: >-
              买家和付款人角色会按细分市场剧烈分化。消费场景里，同一个人就是买家、用户和付款人；SMB 里，买家通常是 IT 通才或业主；更大型组织中，预算所有者转向 CISO、IAM 负责人或 IT
              运维团队；机密或通行密钥项目还会把平台工程或开发者体验团队带入购买组。Bitwarden 自己的试用指南、客户成功中心和 220
              人员工案例都暗示，其采用路径具备可重复的企业模式：从管理员主导的试点开始，配置策略和配置流程，把共享凭据迁入 collections，分批导入用户，再监控使用情况和摩擦。当安全、IT
              和工程都需要就标准、部署模型和回滚计划达成一致时，采购复杂度会上升。宏观需求驱动强劲。Verizon 2026 DBIR 继续把钓鱼、被盗凭据和人为因素描述为核心泄露原因；IBM 报告平均泄露成本创新高；NIST
              在更高保证级别中提升抗钓鱼认证的重要性；Microsoft 正推动 Entra 客户从 Microsoft 管理的 SMS
              和语音转向通行密钥。这些都为连接密码、通行密钥和机密的供应商提供真实顺风。但反向压力同样真实：内置免费替代方案压缩低端支付意愿；品类边界与 PAM 和身份套件变得模糊；Bitwarden
              仍未披露公开客户结构或付费席位渗透率，外部无法精确承销份额。
