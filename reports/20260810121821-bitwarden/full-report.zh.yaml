  - id: TV006
    title: 最终尽调追问表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 与增长质量
        - 当前 ARR、ARR 增速、客群结构，以及付费 / 免费转化
        - 决定公开规模叙事能否转化为足够收入来支撑估值
        - 管理层数据室 / CFO
      - - 留存质量
        - 按客群拆分的 NRR、GRR、流失率和同期群表现
        - 倍数支撑更看收入耐久性，而不是客户 logo 数
        - 收入运营 / FP&A
      - - 利润率与烧钱
        - 毛利率、支持负担、运营烧钱、自由现金流、现金续航期
        - 用于判断下行保护和后续资金需求
        - 财务与董事会材料
      - - 部署结构
        - 自托管占比、支持成本、补丁滞后画像，以及不同部署类型的续约差异
        - 自托管可能是护城河，也可能是拖累，关键看经济性和支持负载
        - 客户成功 / 支持 / 产品
      - - 股权结构与优先权
        - 优先权堆叠、投资人权利、期权稀释压力，以及任何二级市场估值标记
        - 标题估值可能掩盖偏弱的投资人回报账
        - 法务 / 财务 / 领投方
      - - 风险控制
        - 安全开发 KPI、复盘、平均补丁修复时间和事件纪律
        - 安全控制质量不清楚时，信任敏感资产会很快贬值
        - 安全负责人 / 董事会风险委员会
    notes: 如果 Bitwarden 对多数追问给出强有力答案，建议可明显上调。
    claimRefs:
      - CV008
      - CV017
      - CV018
      - CV032
