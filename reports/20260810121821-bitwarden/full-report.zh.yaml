      - - 最佳免费层
        - Google/Apple 在生态内默认免费提供基础存储
        - 高
        - Bitwarden 免费层仍更宽，并且跨平台
        - 免费用户转化中，有多少来自对原生工具不满？
      - - 企业就绪度
        - 1Password、LastPass、Dashlane 和 Keeper 都营销 SSO/SCIM/管理支持
        - 中
        - Bitwarden 将企业控制与价值、透明度绑在一起
        - 提供按细分市场拆分、对阵各具名竞品的胜负数据
      - - 评测口碑
        - 独立评测整体更青睐 1Password；部分付费用例更偏向 NordPass
        - 中
        - Bitwarden 仍靠性价比和免费层胜出；信任叙事依然有差异
        - 销售管线中有多大比例受第三方评测排名影响，而不是内部评估标准？
      - - 邻近平台扩张
        - 1Password 和 Dashlane 正把叙事拓展到 AI 代理、凭证风险或统一访问
        - 高
        - Bitwarden 正用 Secrets Manager 和 Passwordless.dev 回应
        - 新业务交易中，Secrets Manager 和 Passwordless.dev 的附加率是多少？
      - - 竞品定价不透明
        - 折扣和定制合同可能抹平 Bitwarden 的标价优势
        - 中
        - 透明定价仍能降低采购摩擦
        - 判断护城河强度前，按客户规模收集近期竞品报价和折扣区间
    notes: 严重程度反映未来 12-36 个月可能形成的战略压力，而不是被替代的确定性。
