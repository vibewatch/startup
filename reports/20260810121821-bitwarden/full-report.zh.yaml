chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围和定位
        blocks:
          - type: paragraph
            body: >-
              Bitwarden 不只把自己定位成消费级密码管理器，而是面向个人、开发者和企业的可信开源安全公司。官方 About 页面称，公司成立于 2016 年，总部位于加州 Santa Barbara，服务超过
              80,000 家企业，以及 180 多个国家、50 多种语言环境中的 1,500 多万用户。创始人访谈补充了关键细节：Kyle Spearrin 称，他在 2015 年末或 2016 年初开始构建第一版，并在
              2016 年 8 月上线；这解释了为什么部分第三方档案写 2015 年，而 Bitwarden 自己的标准介绍采用 2016 年。产品范围如今早已超出最初的保险库：公司面向个人和企业买家销售 Password
              Manager，面向开发者和 DevOps 机器凭据销售 Secrets Manager，并为 FIDO2/WebAuthn 通行密钥基础设施提供
              Passwordless.dev。官方页面一贯把差异化落在三个封闭竞争对手难以同时匹配的属性上：免费基础层、可在 GitHub 审计的开源代码，以及面向受监管或主权敏感客户的自托管部署路径。这种组合让
              Bitwarden 成为高价闭源在位者的价值与透明度替代方案，同时仍支持 SSO、SCIM、事件日志、账户恢复和基于通行密钥的认证等企业控制能力。
