  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 示例性估值逻辑（USD M）
      - 概率信号
      - 支撑证据
    rows:
      - - 乐观
        - ARR / 收入约 200-250，增速仍 >20%，企业客户扩张到 Secrets Manager 和无密码，没有新的信任冲击
        - 10x-12x => 约 2,000-3,000
        - 可能，但未证实
        - 披露强 NRR、健康毛利率和强付费企业客户组合
      - - 基准
        - ARR / 收入约 150-180，增速在十几个百分点中段，留存扎实，企业客户贡献温和但真实的扩张
        - 8x-10x => 约 1,200-1,800
        - 最合理的公开区间
        - 展示可持续 ARR 质量和稳定风险态势
      - - 悲观
        - ARR / 收入约 80-120，增长放缓，付费转化或留存走弱，或安全 / 可靠性问题复发
        - 4x-6x => 约 320-720
        - 若披露不及预期，下行真实存在
        - 变现质量低或信任再受损的证据
    notes: 区间是示例性情景带，不是管理层指引，也不声称 Bitwarden 当前处于任何具体 ARR 水平。
