  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 客户端应用和扩展
        - 用户保险库体验、自动填充、通行密钥
        - 浏览器 API、OS 认证服务、应用商店
        - 平台或商店政策变动会影响用户体验
      - - Web 保险库
        - 基于浏览器的管理和访问
        - Web 运行时、浏览器安全模型
        - 会话或浏览器兼容性回归
      - - CLI
        - 终端自动化和机密读取
        - Shell / 运行时环境、npm / 二进制打包
        - 打包或认证流程回归会打断脚本
      - - Secrets Manager SDK
        - 程序化机密访问
        - Rust 核心、绑定生成器、语言运行时
        - 绑定漂移或 SDK 集成复杂度
      - - 服务器 API / 身份服务
        - 同步、认证、管理、事件
        - C#/.NET 服务、数据库、云或自托管基础设施
        - 服务配置错误或宕机会影响所有客户端
      - - SQL Server / 外部数据库
        - 持久化状态
        - MSSQL Express 或客户数据库运维
        - 备份、恢复和容量负担
      - - Docker / Helm 部署
        - 自托管打包和升级
        - Docker Engine、Compose、Kubernetes
        - 客户更新和配置错误
      - - SCIM 端点
        - 开通与回收
        - IdP 配置和 API 密钥
        - 生命周期错误会制造访问控制问题
      - - Directory Connector
        - 目录同步
        - AD / LDAP / 云目录连接
        - 同步漂移或连接器故障
      - - Passwordless.dev 后端
