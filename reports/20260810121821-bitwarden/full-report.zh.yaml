  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局、替代方案和竞争对手类别
        blocks:
          - type: paragraph
            body: >-
              Bitwarden 的竞争集合不是一张统一的密码应用清单。市场至少分成四类。第一类是员工和企业密码管理中的直接付费同业：1Password、LastPass、Dashlane、Keeper、NordPass 和
              Enpass。第二类是 Google Password Manager、Apple Passwords /
              通行密钥等原生平台替代方案，它们让基础凭据存储在主流设备和浏览器上成为零价格默认选项。第三类是手动或半手动共享凭据的现状，不论通过电子表格、浏览器自动填充，还是临时内部做法。第四类是更宽的访问或身份平台，它们从保险库扩展到通行密钥、机密、SaaS
              风险或 AI agent 凭据。这个划分重要，因为 Bitwarden
              被两头拉扯：低端受免费内置功能压制，高端受更宽访问平台挤压。结果是一个结构性分叉的市场，简单密码存储的功能平价已经不足以维持护城河。供应商现在必须在信任、定价、部署控制、支持和相邻工作流上获胜。这个框架也意味着，不同对手会在不同交易阶段发挥作用：Google
              和 Apple 可以在低端付费转化启动前就拦住它；买家一旦决定集中式企业管理值得付费，1Password 或 Keeper 的影响就更大。即便安全理由对预算负责人很清楚，手动共享习惯也会拖慢转化。
