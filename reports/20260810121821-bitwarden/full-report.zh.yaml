  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Bitwarden 的相关市场比独立消费级密码保险库更宽，但比完整身份栈更窄。核心战场是员工和企业密码管理：这类工具跨浏览器、桌面应用、移动设备和企业目录存储、共享、同步并审计人工凭据。Bitwarden
              自己的企业材料持续把这个核心延伸到企业买家关心的相邻层：基于 SCIM 的配置、SSO、事件日志、自托管部署、开发者机密处理和通行密钥基础设施。这意味着 Bitwarden
              越来越处在密码管理、访问治理和轻量机器机密控制的交汇处，而不只是消费级「保险库应用」品类。替代方案真实存在，也具有战略意义。Google Password Manager 和 Apple 内置密码 /
              通行密钥流程在主流平台上提供免费的基础凭据存储；FIDO 通行密钥和 Microsoft 的迁移计划则推动市场走向抗钓鱼认证，而这类认证可以存在于浏览器、操作系统或第三方管理器中。因此，Bitwarden
              的差异化不只是存密码，而是把开源透明度、可选自托管、跨平台可移植性和企业管理结合起来，服务那些需要比原生平台工具更多控制权的买家。
