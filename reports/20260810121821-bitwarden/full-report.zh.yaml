  - id: TV005
    title: 论点破裂和终止触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 信任再受冲击
        - 12 个月内再次出现重大授权或密钥暴露问题
        - 溢价信任叙事削弱，倍数压缩
        - 转入下行情景并重新定价
      - - 可靠性恶化
        - 宕机反复激增，或服务持续不稳定
        - 企业采购和续约信心下降
        - 先索取运营指标，再继续推进
      - - 商业化披露偏弱
        - ARR 明显低于低数亿美元区间，或留存不佳
        - 估值立场转为偏满 / 缺乏吸引力
        - 下调建议
      - - 股权结构负担
        - 过往轮次优先权堆叠过重，或清算优先级条款惩罚性强
        - 退出价值分配不如标题估值看起来有吸引力
        - 投资前重做回报模型
      - - 路线图缺少附加率验证
        - 机密 / 无密码扩张增加复杂度，却没有改善收入质量
        - 平台上行空间被高估
        - 更保守地给核心密码库业务定价
    notes: 这些是最能直接改变建议的高信号事件。
