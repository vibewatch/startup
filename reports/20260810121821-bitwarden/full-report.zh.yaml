      - number: '1.2'
        title: 领导层、治理和商业模式
        blocks:
          - type: paragraph
            body: >-
              现有官方资料显示 Michael Sullivan 担任首席执行官，创始人 Kyle Spearrin 仍为 Founder and Chief Innovation Officer；其余具名高管包括 Gary
              Orenstein（Chief Customer Officer）、Andrew Hartnett（Chief Technology Officer）、Matt Cillis（Chief Sales
              Officer）和 Michael Shenkman（Chief Financial Officer）。这点重要，因为 Bitwarden 2022 年融资公告和 PSG 新闻稿仍引用 Michael
              Crandell 的 CEO 身份；因此，本轮研究可见的公开记录显示，2022 年融资到 2026 年运行日期之间确实发生过领导层交接，尽管 Bitwarden
              当前可访问的官方页面没有详细叙述时间点。相比当前网站，融资文件释放的治理信号更清楚：PSG 持有少数股权，并称 Tom Reardon 和 Govind Anand
              将加入董事会。作为私营网络安全公司，Bitwarden 的变现模式异常透明。个人定价公开为 Premium 按年计费每月 $1.65、Families 每月 $3.99；企业 Password Manager
              定价为 Teams 每用户每月 $4、Enterprise 每用户每月 $6；Secrets Manager 的 Teams 和 Enterprise 分别为每用户每月 $6 和
              $12；Passwordless.dev 提供最高 10,000 用户的免费层、$0.05 的 Pro 层和面向员工的 $3 Enterprise 层。免费基础层仍是战略选择，而非偶然安排：Bitwarden
              明确表示，商业模式由付费计划支撑，而不是靠变现用户数据。
