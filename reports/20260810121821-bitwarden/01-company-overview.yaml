- id: leadership-governance-and-business-model
  title: Leadership, governance, and business model
  body: 'Current official materials list Michael Sullivan as Chief Executive Officer, while founder Kyle Spearrin remains Founder and Chief Innovation Officer; the rest of the named executive team includes Gary Orenstein (Chief Customer Officer), Andrew Hartnett (Chief Technology Officer), Matt Cillis (Chief Sales Officer), and Michael Shenkman (Chief Financial Officer). This matters because Bitwarden’s 2022 funding announcement and PSG press release still quoted Michael Crandell as CEO, so the public record visible in this run shows a real leadership transition between the 2022 financing and the 2026 run date even though Bitwarden’s currently accessible official pages do not narrate the timing in detail. Governance signal from the financing is clearer than governance signal from the current site: PSG took a minority position and said Tom Reardon and Govind Anand would join the board. The monetization model is unusually transparent for a private cybersecurity company. Personal pricing is
    published at $1.65 per month billed annually for Premium and $3.99 per month for Families; business Password Manager pricing is $4 per user per month for Teams and $6 per user per month for Enterprise; Secrets Manager pricing is $6 and $12 per user per month for Teams and Enterprise respectively; and Passwordless.dev offers a free tier up to 10,000 users, a $0.05 Pro tier, and a $3 workforce Enterprise tier. The free baseline remains strategic, not incidental: Bitwarden explicitly says the business model is funded by paid plans rather than monetizing user data.'
