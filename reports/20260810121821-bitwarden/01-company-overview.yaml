callouts:
- calloutType: strength
  title: Open-source, self-hosted, and free-by-default is still the core wedge
  body: Bitwarden’s strongest company-level differentiator is not any single feature. It is the combination of inspectable code, a perpetual free baseline, and a real self-hosting option that lets it win cost-sensitive and control-sensitive buyers simultaneously.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO010
  - CO011
- calloutType: risk
  title: Valuation opacity and 2026 server CVEs are the two immediate overview risks
  body: Official funding materials disclose the size of the 2022 round but not post-money valuation, while public 2026 CVE disclosures show that Bitwarden’s enterprise stack is actively being probed. Later financial and risk chapters need to price both the disclosure gap and remediation confidence.
  claimRefs:
  - CO008
  - CO009
  - CO023
  - CO024
  - CO025
