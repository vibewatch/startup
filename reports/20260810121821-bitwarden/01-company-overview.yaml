- id: capital-milestones-and-adverse-signal
  title: Capital formation, milestone chronology, and adverse signal
  body: 'The clearest priced capital event in the public record is Bitwarden’s September 6, 2022 announcement of a $100 million minority growth investment led by PSG with participation from existing investor Battery Ventures. Bitwarden’s own CEO Q&A framed the financing as fuel for product and go-to-market acceleration, explicitly naming developer secrets, passwordless technologies, authentication, channel partners, and international expansion as the next growth vectors. TechCrunch adds that the 2022 raise was the first fully disclosed external funding in Bitwarden’s history and reports that an earlier, previously undisclosed Series A had occurred in 2019. Third-party company-profile sites also describe two total funding rounds and the acquisition of Passwordless.dev, but they disagree on whether the 2022 round should be labeled Series B or Series C and on whether the founding date should be recorded as 2015 or 2016; that makes those sources useful for triangulation but not canonical. The
    biggest company-overview diligence gap is valuation: official 2022 announcements do not disclose a post-money figure, so downstream valuation work must treat the commonly repeated ~$1.67B unicorn figure as a private-market estimate rather than an official management statement. The main adverse signal in 2026 is not a known vault breach but newly disclosed server vulnerabilities. NVD and OpenCVE list multiple 2026 Bitwarden Server CVEs, including a high-severity trusted-device account-takeover issue and a lower-severity JSON injection issue in event integration templates. Those disclosures do not invalidate Bitwarden’s security positioning, but they do show that the company’s enterprise attack surface is broad enough that public vulnerability management remains a material diligence topic.'
