  name: Bitwarden
chapter:
  number: 1
  title: Company Overview
  summary: Bitwarden is a Santa Barbara-headquartered open-source credential-security company that officially says it was founded in 2016, serves more than 80,000 businesses and 15 million users, and now spans password management, developer secrets, and passkey infrastructure. The company’s publicly disclosed capital event is a $100 million PSG-led 2022 growth investment with Battery Ventures participation, while 2026 public evidence shows a current executive roster led by CEO Michael Sullivan, durable self-hosting and freemium positioning, and fresh downside signal from newly disclosed Bitwarden Server CVEs that diligence should not ignore.
sections:
- id: identity-product-and-positioning
  title: Identity, product scope, and positioning
  body: 'Bitwarden presents itself as a trusted open-source security company for individuals, developers, and enterprises rather than only a consumer password manager. The official About page says the company was founded in 2016, is headquartered in Santa Barbara, California, and serves more than 80,000 businesses plus over 15 million users in 180+ countries and 50+ languages. The founder interview adds useful nuance: Kyle Spearrin says he began building the first iteration in late 2015 or early 2016 and launched it in August 2016, which explains why some third-party profiles cite 2015 while Bitwarden’s own boilerplate uses 2016. Product scope now extends well beyond the original vault: the company markets Password Manager for personal and business buyers, Secrets Manager for developer and DevOps machine credentials, and Passwordless.dev for FIDO2/WebAuthn passkey infrastructure. Official pages consistently tie differentiation to three attributes that closed competitors struggle to match
    in combination: a free baseline tier, open source code that can be audited on GitHub, and a self-hosted deployment path for regulated or sovereignty-sensitive customers. That mix positions Bitwarden as the value-and-transparency alternative to premium closed-source incumbents while still supporting enterprise controls such as SSO, SCIM, event logs, account recovery, and passkey-based authentication.'
