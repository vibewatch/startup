callouts:
- calloutType: strength
  title: The best market wedge is enterprise control, not consumer novelty
  body: Bitwarden does not need to win every password stored on the internet. Its strongest market position is with buyers who need SCIM, SSO, self-hosting, policy control, and passkey or secrets expansion on top of basic vaulting.
  claimRefs:
  - CM005
  - CM006
  - CM018
  - CM025
  - CM037
  - CM038
- calloutType: risk
  title: A growing TAM does not eliminate pricing and share-opacity risk
  body: The category is clearly growing, but free platform substitutes and overlapping identity categories mean a large published TAM can still convert into modest standalone vendor economics unless Bitwarden proves durable paid-seat share and cross-sell depth.
