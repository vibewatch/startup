  - - Enterprise admin & deployment layer
    - SCIM, SSO, policies, audit logs, directory sync, collections administration
    - Full identity-provider spend and endpoint security licenses
    - IAM lead, IT admin, security operations / employer
    - Critical differentiator for business buyers
  - - Developer secrets management
    - Secrets-manager seats, CLI-driven secrets workflows, machine credential control
    - Cloud compute, CI/CD runtime, broad CSP secret stores
    - Platform engineering or DevSecOps / engineering budget
    - Adjacent cross-sell opportunity beyond human vaulting
  - - Passkey / passwordless infrastructure
    - Passkey SDK, admin console, workforce passkey rollout tools
    - Consumer platform passkey sync itself, handset hardware
    - Identity, security, product engineering / security or product budget
    - Expands Bitwarden into the authentication transition
  - - Self-hosted credential management
    - On-prem or private-cloud vault deployments plus related support and admin overhead
    - Generic infrastructure spend not tied to credential control
    - Regulated enterprise, public sector, sovereignty-sensitive buyers / security or IT budget
    - Important wedge where browser-native tools are weak
  - - Built-in platform substitutes
