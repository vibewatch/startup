company:
  name: Age of Learning
chapter:
  number: 6
  title: Customers
  summary: >-
    Age of Learning addresses both home-learning families and educator-managed
    settings, while the January 2026 ABCmouse relaunch added a free entry tier
    alongside a premium product. Company releases report cumulative reach above
    50 million children, but the assigned evidence does not disclose active
    users, paid subscribers, retention, revenue concentration, or renewal data.
sections:
  - id: customer-segments-and-access
    title: Customer segments and access surfaces
    body: >-
      The clearest segmentation is between children who use the products,
      adults or institutions that manage access, and families that may pay for
      premium access. ABCmouse is positioned for children ages 2–8, while the
      marketplace listing extends the portfolio from family-oriented ABCmouse
      and Adventure Academy to personalized school products spanning pre-K
      through fifth grade. A dedicated login surface tells users to contact an
      Age of Learning administrator and offers badge login, which is direct
      product-surface evidence of managed deployments but does not identify a
      district, contract, seat count, or payer. The January 2026 launch also
      created an explicit free-to-premium consumer path. These surfaces support
      a mixed consumer and institutional model, but they do not establish the
      revenue mix between those channels.
    claimRefs: [CU004, CU005, CU006, CU012, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-reach
    title: Adoption signals are cumulative, not active
    body: >-
      Age of Learning's own January 2026 release said the company had served
      more than 50 million children worldwide; a May 2026 company release raised
      that cumulative statement to more than 55 million. LeadIQ separately
      repeats a greater-than-50-million reach figure, but does not supply a
      methodology or active-user denominator. The change in company boilerplate
      is therefore a directional reach signal, not evidence of five million new
      paying customers, current subscribers, or retained learners. The assigned
      comparison dataset is similarly explicit that Age of Learning's customer
      count is not disclosed. Investment diligence should not translate any of
      these reach statements into active accounts, recurring revenue, or
      retention without a dated cohort definition and reconciliation.
    claimRefs: [CU001, CU002, CU003, CU015]
    tableRefs: [TU002]
  - id: deployment-and-outcomes
    title: Named proof is narrow and relationship-heavy
    body: >-
      The strongest user-level proof in the assigned pool is a randomized study
      of ABCmouse English involving 148 seven- and eight-year-old children in
      Japan, split evenly between treatment and control groups for 16 weeks.
      The study reports significantly greater English-learning gains for the
      treatment group, including on the Eiken Junior assessment. It also found
      that completed activities and the share of time in the exploration area,
      rather than total app time or unique play days, predicted gains when other
      metrics were considered. NASA and the San Diego Zoo and Safari Park are
      named content partners in the 2026 product release, but the source does
      not identify them as paying customers or disclose commercial terms.
      Accordingly, these relationships demonstrate product content and study
      use, not a verified customer roster.
    claimRefs: [CU007, CU008, CU009, CU014]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability and concentration remain diligence gaps
    body: >-
      The study offers encouraging short-window engagement evidence, but it
      cannot substitute for commercial retention. Its authors disclose that
      access requirements may have biased the sample, that results may not
      generalize beyond China and Japan, that Age of Learning financially
      supported data collection, and that two researchers were company
      employees. Those disclosures make the outcomes useful but bounded. No
      assigned source provides subscriber churn, gross or net revenue
      retention, renewal rates, contract duration, cohort lifetime value,
      conversion from Basic to Premium, or top-customer exposure. The most
      decision-relevant next step is therefore a cohort and channel
      reconciliation: active free users, paid families, school accounts,
      annual renewals, and revenue by the largest customers and distribution
      partners, all tied to a common period and denominator.
    claimRefs: [CU009, CU010, CU011, CU015]
