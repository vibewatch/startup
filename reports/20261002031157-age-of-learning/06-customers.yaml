  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Active paid subscribers, gross and net retention, churn, renewal rates, and contract duration by consumer and institutional channel.
      whyItMatters: Cumulative children served and a short study cannot establish recurring commercial durability or cohort quality.
      diligencePath: Request monthly subscriber and school-account cohorts for the last 36 months, reconciled to billings and revenue by channel.
      relatedQuestionRefs: [QU005, QU008]
    - type: private-evidence-only
      severity: material
      topic: conversion-and-economics
      missingEvidence: Basic-to-Premium conversion, acquisition cost, payback, household lifetime value, and multi-child profile utilization.
      whyItMatters: The visible free-to-premium pathway has no public conversion or unit-economic evidence.
      diligencePath: Obtain funnel cohorts by acquisition source and month, with paid conversion, retention, revenue, discounts, and support costs.
      relatedQuestionRefs: [QU006]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Revenue by top customers, districts, channel partners, app stores, and content or distribution partners.
      whyItMatters: The assigned evidence cannot quantify dependence on any institutional buyer, platform, or partner.
      diligencePath: Request top-20 account and partner revenue schedules with contract term, renewal date, termination rights, and gross margin.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A dated roster of named paying families, schools, districts, or enterprise customers with deployment scale and renewal status.
      whyItMatters: Named research participants and content partners do not establish a diversified production customer base.
      diligencePath: Sample customer contracts, invoices, deployment dashboards, references, and renewal records across consumer and institutional channels.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: stale
      severity: minor
      topic: source-access-gap
      missingEvidence: The historical dot.LA remote-learning article content no longer appears at the assigned URL.
      whyItMatters: The stale URL cannot support historical adoption or remote-learning claims in this chapter.
      diligencePath: Obtain an archived publisher copy or exclude the article from any factual customer analysis.
      relatedQuestionRefs: [QU002]
