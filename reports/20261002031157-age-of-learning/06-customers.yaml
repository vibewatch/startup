callouts:
  - calloutType: insight
    title: Reach is not an active-customer metric
    body: >-
      The 50-million-plus and 55-million-plus figures are cumulative
      company-issued counts of children served. They cannot be converted into
      current subscribers, customer accounts, or recurring revenue.
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: Commercial durability is unverified
    body: >-
      The assigned evidence contains no retention, renewal, cohort economics,
      conversion, or customer-concentration disclosure; the 16-week outcomes
      study measures learning and engagement rather than commercial durability.
    claimRefs: [CU009, CU010, CU011, CU015]
