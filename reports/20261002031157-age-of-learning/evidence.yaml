evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Founder identities and ownership, current directors, voting agreements, reserved matters, executive retention
      terms, and succession plans.
    whyItMatters: >-
      The public operating roster does not establish who controls strategic decisions or how leadership continuity is
      protected.
    diligencePath: >-
      Request the current cap table, board roster and minutes, voting agreements, employment contracts, and written
      succession plan.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited revenue, ARR if used internally, gross margin, operating loss, operating cash flow, cash balance, debt,
      and runway for fiscal years 2023 through 2026.
    whyItMatters: >-
      A third-party revenue estimate cannot establish recurring revenue quality, profitability, cash burn, or financing
      need.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, bank and debt schedules, and a metric dictionary
      reconciling revenue and any ARR measure.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: An official employee and contractor census reconciled to payroll and organized by function and country.
    whyItMatters: >-
      The 394 and 435 third-party figures cannot support precise productivity or cost estimates without a common
      denominator and date.
    diligencePath: >-
      Request a dated HR census, payroll reconciliation, contractor roster, and definition of full-time-equivalent
      headcount.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customers-and-retention
    missingEvidence: >-
      Current paying family subscribers, institutional customers, active learners, gross retention, net retention,
      churn, and cohort lifetime value.
    whyItMatters: Cumulative children served does not reveal the current paying base, engagement, retention, or unit economics.
    diligencePath: >-
      Request billing-system exports, institutional contract schedules, active-user definitions, and cohort retention
      analyses.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      A verified legal, regulatory, privacy, outage, and consumer-complaint history covering the company and each major
      product.
    whyItMatters: >-
      The assigned adverse query retained no result, but that absence does not establish that no incidents,
      investigations, or complaints exist.
    diligencePath: >-
      Run jurisdiction-specific court and regulator checks and request litigation, privacy-incident, outage, and
      complaint registers from management.
  - type: private-evidence-only
    severity: material
    topic: consumer-versus-school-revenue-split
    missingEvidence: >-
      Audited breakdown of Age of Learning's revenue between direct-to-consumer household subscriptions
      (ABCmouse/Adventure Academy) and institutional school district contracts (My Math/Reading Academy).
    whyItMatters: >-
      Determining whether growth is driven by consumer retention or enterprise district adoption is critical to
      assessing customer lifetime value and moat durability.
    diligencePath: >-
      Request audited revenue schedules segmented by business unit and GAAP recurring subscription recognition during
      management review.
  - type: missing-source
    severity: material
    topic: verified-subscriber-churn-rates
    missingEvidence: >-
      Empirical cohort retention curves, monthly active subscriber counts, and annual churn data for ABCmouse Premium
      subscribers following the 2026 launch of ABCmouse Basic.
    whyItMatters: >-
      Without cohort churn metrics, it is impossible to evaluate whether the introduction of the free Basic mode
      cannibalizes paid subscriptions or expands the top of the funnel.
    diligencePath: >-
      Review internal app telemetry, App Store/Google Play subscription renewal cohorts, and internal churn reporting
      under non-disclosure agreement.
  - type: missing-source
    severity: material
    topic: district-retention
    missingEvidence: >-
      Verified annual renewal rates and per-student license ARR for My Math Academy and My Reading Academy across public
      school district contracts.
    whyItMatters: >-
      Without district contract retention figures, it is impossible to evaluate whether the institutional sales motion
      generates durable recurring revenue to offset consumer subscriber churn.
    diligencePath: >-
      Request public district procurement records, state educational software contract registries, or audited ARR
      segment disclosures.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-arr
    missingEvidence: >-
      Audited financial statements for FY2023-FY2025 detailing GAAP revenue, current ARR, gross margin percentage, and
      net income.
    whyItMatters: >-
      Without audited financial statements, underwriting cannot substantiate current revenue trajectory or operating
      cash flow after the 2021 funding peak.
    diligencePath: Request confidential disclosure of audited annual financial statements and current quarterly management accounts.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - id: GI002
    type: missing-source
    severity: material
    topic: unit-economics-and-retention
    missingEvidence: >-
      Verified blended customer acquisition cost (CAC), monthly churn rates, and paid subscriber cohort lifetime value
      (LTV) curves.
    whyItMatters: >-
      Direct-to-consumer subscription durability hinges on marketing payback periods and churn velocity, which dictate
      capital burn rates.
    diligencePath: >-
      Require cohort retention waterfall data by signup year and marketing channel efficiency dashboards during
      management diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: adaptive-engine-benchmarks
    missingEvidence: >-
