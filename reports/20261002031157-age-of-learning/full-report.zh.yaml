  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品矩阵与教学交付工作流
        blocks:
          - type: paragraph
            body: >
              Age of Learning 运营着一套面向幼儿、小学及专项双语教育的多层次教育科技产品组合 [CE001]。旗舰级 C 端产品 ABCmouse Early Learning Academy 覆盖 2-8
              岁儿童，涵盖阅读、数学、科学及社会常识等基础启蒙学科 [CE002]。2026年1月，Age of Learning 将 ABCmouse 的消费端体验重构为双层交付模式：ABCmouse Basic
              提供精选每日基础启蒙活动的免费无广告访问；ABCmouse Premium 则支持解锁全部 13,000 多项互动活动、引导式学习路径、多儿童独立档案及离线使用能力
              [CE003]。该双层架构旨在放大漏斗顶端的家庭采纳量，同时将高粘性用户引流至付费订阅层级。


              在幼儿家庭启蒙之外，公司推出了大型多人在线（MMO）教育游戏 Adventure Academy，面向 8-13 岁学生提供语言艺术、数学和科学领域的互动探索任务 [CE004]。针对 K-5
              公立学区机构，Age of Learning 打造了专用的自适应课程方案：My Math Academy、My Reading Academy 及 My Reading Academy Español
              [CE005]。这套机构应用融合了诊断性测评与自适应个性化算法，能动态调整教学难度，为教师提供实时学情掌握追踪与双语课堂支持 [CE005]。在国际市场上，公司依托区域运营伙伴交付本地化产品（如 ABCmouse
              English），结合进阶课程与语音识别工具开展第二语言英语教学 [CE006]。
