  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、覆盖范围与结构界定
        blocks:
          - type: paragraph
            body: >
              数字学习资源市场涵盖主要依托云端 SaaS 架构交付的数字化教学内容、交互式模块、测评工具以及自适应学习平台。Market.us 行业分析指出，全球数字学习资源市场规模 2025年 达到
              $487.2M，预计同年升至 $577.8M，并在 2034年 扩张至 $2,682.6M，年复合增长率达 18.60%。在这一宏观市场中，幼儿教育（学前班至小学低年级）构成高增长的独立细分赛道，也是 Age
              of Learning 布局消费级与机构级核心软件平台的主阵地。


              界定该市场边界需剔除相邻的泛娱乐与学习品类，聚焦核心支出。统计范畴内的核心支出包括 D2C
              经常性数字课程订阅、学区采购的课堂补充课程软件授权、自适应读写与数学软件以及双语教学模块。相反，剔除范畴涵盖传统纸质教材、学校统一配发平板及 Chromebook
              等硬件采购、缺少课程体系的通用消费级游戏平台，以及真人一对一在线辅导平台。现状替代品涵盖纸质练习册、传统课堂授课、图书馆纸质图书、未经筛选的免费视频频道及非结构化少儿电视节目。Age of Learning 旗下
              ABCmouse（面向 2-8 岁）、Adventure Academy（面向 8-13 岁）以及 My Math Academy、My Reading Academy
              等自适应学校方案，直接竞争非结构化屏幕娱乐替代品与碎片化纸质早教教具。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
