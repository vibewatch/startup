      - number: '2.3'
        title: 买方客群画像细分、预算归属与采购流程
        blocks:
          - type: paragraph
            body: >
              早期教育科技的采纳路径分化为家庭 C 端买方与公立 K-12 机构买方两条主线，二者在预算权属与采购周期上截然不同。家庭消费客群的核心决策者为家有 2-8
              岁儿童、具备教育焦虑或主动教育意识的家长，诉求在于寻求系统化的幼小衔接工具与正向屏幕娱乐替代品。家长依赖家庭自选支配支出支付订阅费用，评估指标聚焦儿童投入度、自主使用便利性、游戏化激励机制，以及识字与数理启蒙的显性效果。2026年1月，Age
              of Learning 重构旗舰产品 ABCmouse，推出免费无广告的 Basic 版与包含 13,000 多项活动的全课程 Premium 版双层产品体系，为价格敏感型家庭搭建无摩擦的漏斗顶层转化路径。


              K-12 学校机构板块中，预算归属于学区课程主管、幼教协调员、Title I 专项主管及特殊教育督导。机构采购资金依托当地教育委员会教材专项拨款、州级早期识字基金，以及联邦 Title I
              或特殊教育专项拨款。学校采纳严格遵循年度采购排期，要求提供课程标准对齐认证、数据隐私合规资质、管理端报表系统以及教学效果验证证据。Age of Learning 依托自适应学校方案 My Math Academy
              与 My Reading Academy 切入该赛道，利用 AI 驱动的诊断路径在基础阅读与数学领域交付个性化学习方案。
