      - number: '6.3'
        title: 具名案例样本局限且高度依赖合作关系
        blocks:
          - type: paragraph
            body: >-
              材料中关于用户成效的最强实证，来自一项针对日本 148 名 7-8 岁儿童的 ABCmouse English 随机对照实验，实验将样本均分为实验组与对照组并跟踪 16 周。研究表明实验组在英语学习成效（包括
              Eiken Junior 测评成绩）上取得显著进步。研究同时指出，在控制其他变量后，完成活动数量以及在探索区花费的时间比例，比总在线时长或独立登录天数更能预测成效提升。NASA 与圣迭戈动物园野生动物园（San
              Diego Zoo and Safari Park）作为内容合作伙伴出现在 2026年
              产品新闻稿中，但来源并未表明二者为付费客户，亦未披露商业合作条款。因此，这类合作关系仅能佐证产品内容合作与学术调研应用，无法等同于经核实的真实客户名录。
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU014
