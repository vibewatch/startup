      - number: '6.4'
        title: 留存持久度与客群集中度仍属尽调盲区
        blocks:
          - type: paragraph
            body: >-
              该研究提供了短周期内令人鼓舞的参与度证据，但无法替代商业维度的续约留存指标。研究作者披露其样本获取方式可能存在偏差，结论未必能外推至中日以外地区，且 Age of Learning
              为数据采集提供了资金支持，两名研究人员系公司雇员。这些利益披露提示研究成果具备参考价值但适用范围有限。现有材料均未披露订阅流失率、毛/净收入留存率、续约率、合同年限、分客群生命周期价值、Basic 转
              Premium
              转化率或头部客户集中度。最具决策意义的下一步尽调动作，是对客群与渠道数据进行统一对账：将免费活跃用户、付费家庭、学校账户、年度续费率，以及按大客户和分销合作伙伴拆分的营收，全部锚定至统一报告期和统计口径。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU015
