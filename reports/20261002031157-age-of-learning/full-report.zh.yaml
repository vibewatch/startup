      - number: '3.2'
        title: 产品差异化、包装形态演进与定价模式
        blocks:
          - type: paragraph
            body: >
              为应对产品同质化及获客成本攀升压力，Age of Learning 从底层重构了商业包装形态。2026年1月，公司推出 ABCmouse Basic，免费提供无广告的基础阅读与数学活动，同时保留解锁 13,000
              多项活动、自适应学习路径（Learning Paths）及离线模式的 ABCmouse Premium。该结构性调整有效降低了漏斗顶端面向完全免费或广告变现类早教替代品时的获客阻力，同时守住了付费订阅盘子。


              针对更高年龄段客群，Adventure Academy 采用大型多人在线（MMO）教育游戏架构，按年计费折合每月低于 $5，按月计费为 $9.99，兼具娱乐游戏与互动学习工具属性。机构端方面，My Math
              Academy、My Reading Academy 及 My Reading Academy Español 借助驻地直销团队对接公立学区采购流程，计费模式由 C
              端月度循环转为按学生人头或学区企业级全套授权计费。
