        title: GTM 渠道分发能力、转换壁垒与护城河持久度
        blocks:
          - type: paragraph
            body: >
              对 Age of Learning 市场拓展（GTM）体系的尽调表明，公司正有针对性地加码机构销售能力与 AI 驱动的课程研发工程。一线销售招聘重点吸纳客户执行（AE）与副客户执行（Associate
              AE），要求其熟练运用 Salesforce、HubSpot 等 CRM 系统推进大规模主动拓客并主导学区级招投标（RFP）。这一 B 端动作标志着公司较以往纯依赖 C 端数字营销买量发生重大运营转向。


              与此同时，工程研发岗位聚焦 AI 原生软件开发，以加速 Flutter、Svelte 及跨平台移动应用的内容迭代。然而，公司护城河持久度依然承压：一方面，儿童随年龄增长自然脱离 2-8 岁目标客群，导致 C
              端早教应用面临天然的生命周期流失，且家长多平台并用（multi-homing）现象普遍；另一方面，尽管机构端学校合同能带来更高的多年期黏性与转换成本，但 Age of Learning
              必须突破早已主导学区集采渠道的既有学习管理系统（LMS）及测评巨头的先发壁垒。
            claimRefs:
