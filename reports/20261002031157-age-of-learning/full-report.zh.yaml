            body: >
              产品覆盖数千万未成年儿童，导致 Age of Learning 在 COPPA 与 CPRA 法规下面临高危运营与监管风险
              [CE011]。鉴于自适应算法模型、学生数据处理链路及云端高可用指标完全未对外公开，外部技术尽调无法独立核验其算法有效性与系统鲁棒性 [CE010, CE011]。
