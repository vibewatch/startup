      - number: '2.2'
        title: 市场空间测算视角、增长轨迹与有效容量
        blocks:
          - type: paragraph
            body: >
              评估 Age of Learning 的潜在市场空间，需要从全球数字学习资源总量、地域集中度及机构细分板块等多维度综合测算。全球数字学习资源市场提供了最广义的参照基准，其规模将由 2025年的 $487.2M
              增至 2034年的 $2,682.6M，年复合增长率为 18.60%。北美占据主导区域份额，占全球总收入的 38.5%（2024年 为 $187.57M），其中美国市场 2025年 规模为
              $168.1M，年复合增长率 16.28%。


              终端用户结构显示，K-12 教育构成最大需求板块，占市场总支出的 47.3%；体系化电子学习课程与教学模块占内容交付的 38.6%。此外，订阅制模式主导行业变现，占据 68.4% 的市场份额；云端 SaaS
              部署则占全部平台交付的 91.7%。STEM 学科占课程需求的 41.5%。测算 Age of Learning 的服务可获得市场（SAM）与服务可获取市场（SOM），必须将幼儿（2-8 岁）C
              端数字订阅及小学补充软件从大学、企业及中学支出中剥离。Latka 推算 Age of Learning 2026年 年营收达 $126.8M，表明公司虽占据北美小学数字学习市场相当份额，但在纯 C
              端订阅扩张上已面临增长天花板。
            claimRefs:
