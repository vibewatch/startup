  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              Age of Learning 所处的数字消费与教育科技监管环境正面临日益趋严的合规审查。公司历史上曾因 C
              端订阅扣费、退订障碍及自动续费披露问题，在联邦与州消费者权益保护框架下达成重大监管和解。长期保持严格的知情同意机制、满足 COPPA
              关于儿童数据隐私的合规要求以及保持透明的线上退订流程，属于不可逾越的日常运营底线。自动续订合规或儿童档案保护一旦出现漏洞，将直接引发执法处罚风险、潜在集体诉讼，并在消费端和机构端面临巨额财务罚款。持续跟踪各州自动续费法规调整至关重要。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营、技术与市场交付风险
        blocks:
          - type: paragraph
            body: >-
              随着幼儿启蒙向现代化数字形态演进，运营连续性与课程教学效果构成 Age of Learning
              的关键风险因素。教育生态的宏观研究表明，由传统教学模式向现代自适应框架转型，需要针对教研严谨度、实证效果验证及平台可靠性进行持续的大规模投入。此外，生成式 AI
              引发的全行业运营重组要求企业随分工重构持续调整组织人力与技术架构。同时，第三方独立分析认为公司估值较其实际教学效果存在明显泡沫，指出儿童在 8
              岁左右自然超龄导致客户生命周期价值（LTV）遭遇硬顶，迫使公司持续投入高额获客成本以对冲自然流失。在竞争激烈的教育科技格局下，这些因素进一步加剧了利润率承压。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
