  - id: FV001
    title: 估值逻辑与投资建议流程
    type: flow
    summary: 从运营规模与资本结构到最终建议的连贯分析决策链。
    data:
      nodes:
        - id: scale-proof
          label: 15 年运营护城河：ABCmouse 与 Adventure Academy 累计服务 50M+ 学习者
        - id: revenue-base
          label: 预估收入体量：年收入 $126.8M，拥有 435 名全职员工
        - id: overhang-check
          label: 资本结构阻力：$500M 优先股堆叠与 $3.09B 偏高的高峰期估值
        - id: market-recalibration
          label: 估值倍数压缩：市场 EdTech 估值倍数在 1.5x-4.5x，对应 $200M-$600M 合理价值
        - id: liquidity-barrier
          label: Pre-IPO 摩擦：老股二级市场流动性差，附带转让限制与优先购买权（ROFR）
        - id: final-recommendation
          label: 最终立场：继续研究 / 昂贵 / 高风险评级，保持入场纪律
      edges:
        - from: scale-proof
          to: revenue-base
        - from: revenue-base
          to: overhang-check
        - from: overhang-check
          to: market-recalibration
        - from: market-recalibration
          to: liquidity-barrier
        - from: liquidity-barrier
          to: final-recommendation
    approximationNotes: 将运营规模指标与市场估值倍数及投资建议相关联的逻辑决策框架。
