      - number: '5.3'
        title: 数据隐私、儿童安全治理与生态平台依赖
        blocks:
          - type: paragraph
            body: >
              运营主要面向低龄儿童的教育平台，对 Age of Learning 提出了极其严苛的法律与技术合规要求
              [CE011]。鉴于付费订阅主体为成年家长或学校管理员，而终端活跃用户为未成年儿童，其数据治理架构必须在计费账户身份与儿童学习行为遥测数据之间设立严格物理隔离
              [CE011]。公司的法务安全体系旨在满足《儿童在线隐私保护法》（COPPA）、《加州消费者隐私法》（CCPA）及《加州隐私权法》（CPRA）等法规约束
              [CE011]。技术防护策略在儿童学习环节强制推行零广告及无第三方行为追踪，并将账户通知权限严格限制在经家长核验的官方渠道 [CE003, CE011]。


              平台分发部署高度受制于中心化第三方移动生态，主要为 Apple App Store、Google Play Store 与 Amazon Appstore
              [CE003]。尽管面向学区的直接交付规避了机构产品的应用商店抽成，但 C 端分发依然使 Age of Learning 完全暴露在移动平台规则调整、应用内购买政策及底层操作系统升级等不确定性之中 [CE003,
              CE010]。此外，外部企业名录评估显示公司在历次融资后经历了重大组织架构调整，整体在职员工规模预估在 435 至 500 人区间 [CE012,
              CE013]。在庞大的历史沉淀内容库之上保障跨平台测试一致性、取得 COPPA 合规审计认证，以及维系高可扩展的云端交付能力，始终是长期的运营与技术风险点 [CE010, CE011]。
            claimRefs:
              - CE003
              - CE010
              - CE011
              - CE012
              - CE013
