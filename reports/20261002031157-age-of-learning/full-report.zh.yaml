      - number: '5.2'
        title: 软件架构、跨平台技术栈与工程实践
        blocks:
          - type: paragraph
            body: >
              支撑 Age of Learning 多产品矩阵的技术架构融合了跨平台移动与 Web 客户端界面、后端分布式服务以及自适应学习引擎 [CE007]。部署在 iOS、Android、Amazon Appstore
              及 Web 环境的客户端应用采用 Flutter、Dart、JavaScript 与 TypeScript 开发，现代 Web 端界面则引入 Svelte 和 SvelteKit 实现高性能渲染
              [CE007]。后端服务依托 REST 与 gRPC 应用编程接口（API）通信，协调面向数百万并发学习者的内容分发、账户管理及实时行为遥测 [CE007]。ABCmouse English
              等专用模块集成了自动语音识别（ASR）系统，对照母语者基准评估儿童音素发音，提供即时语音反馈并同步更新家长端进度看板 [CE006]。


              2026年 起，Age of Learning 在 C 端研发团队全面推进 AI 原生软件工程转型 [CE007, CE008]。研发规范不再局限于将人工智能用于被动代码补全，而是要求将 Agent
              工作流贯穿软件开发全生命周期，涵盖自动化代码重构、单测生成、代码库导航、模型上下文协议（MCP）工具调用及提示词工程 [CE007,
              CE008]。这一技术架构与研发体系升级，配合新引进的创意与商务高管，旨在将个性化 AI 交互深度嵌入核心学习体验
              [CE009]。然而，有关专有自适应算法、服务器架构吞吐量及离线同步机制的技术白皮书仍未向外部审计公开 [CE010]。
