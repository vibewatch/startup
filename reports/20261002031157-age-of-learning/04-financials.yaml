    title: "Valuation Stagnation and Post-COVID Multiples Compression"
    body: "Age of Learning's $3 billion post-money valuation mark was set in June 2021 at the peak of pandemic-era EdTech demand. Given the subsequent contraction in public and private EdTech revenue multiples and subscriber normalization, sustaining a $3 billion equity valuation without verified top-line growth or disclosed profitability represents a critical diligence vulnerability for secondary or follow-on investors."
