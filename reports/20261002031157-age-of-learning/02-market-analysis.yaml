callouts:
  - calloutType: risk
    title: Consumer Subscriber Churn and FTC Regulatory Legacy
    body: Age of Learning's reliance on consumer subscriptions leaves it vulnerable to household churn once children reach school age or outgrow ABCmouse. Historical regulatory scrutiny, notably the 2020 FTC settlement requiring $10 million in restitution for deceptive auto-renewal practices, highlights structural friction in retaining long-term consumer subscribers without aggressive recurring billing tactics.
    claimRefs:
      - CM007
      - CM015
      - CM016
  - calloutType: insight
    title: Dual-Tier Freemium Transition as a Strategic Wedge
    body: The launch of ABCmouse Basic in January 2026 represents a pivotal transition from a pure paid paywall to a freemium model. By offering curated daily activities free of charge, Age of Learning creates a scalable, low-CAC top-of-funnel customer acquisition channel that mitigates post-pandemic subscriber acquisition headwinds while protecting upsell conversion into ABCmouse Premium.
    claimRefs:
      - CM010
      - CM011
      - CM014
