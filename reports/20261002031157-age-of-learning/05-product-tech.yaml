callouts:
  - calloutType: "insight"
    title: "Strategic Shift to AI-Native Engineering and Free-Tier Distribution"
    body: |
      During 2026, Age of Learning executed two synchronized strategic shifts: rebuilding ABCmouse with a zero-cost Basic tier to maximize family reach, and institutionalizing AI-native software engineering practices to accelerate feature development velocity across web and mobile platforms [CE003, CE007, CE008].
    claimRefs:
