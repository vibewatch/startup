      - "CE007"
      - "CE008"
  - calloutType: "risk"
    title: "Child Data Compliance Exposure and Opaque Proprietary Infrastructure"
    body: |
      With products deployed to tens of millions of minor children, Age of Learning faces severe operational and regulatory exposure under COPPA and CPRA [CE011]. Because its adaptive algorithms, student data processing pipelines, and cloud reliability metrics remain strictly private, technical diligence cannot independently verify algorithm efficacy or infrastructure resilience [CE010, CE011].
    claimRefs:
      - "CE010"
      - "CE011"
