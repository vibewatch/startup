callouts:
  - calloutType: insight
    title: "The Freemium Strategic Shift in Consumer Early Learning"
    body: "The rollout of ABCmouse Basic in January 2026 highlights the intense competitive pressure in direct-to-consumer digital learning. By eliminating paywalls for foundational daily activities, Age of Learning acknowledges that consumer willingness to pay has tightened post-pandemic, necessitating a free tier to protect brand discovery against low-cost app store substitutes."
    claimRefs:
      - CP006
      - CP008

  - calloutType: risk
    title: "Dual GTM Execution Complexity Between Consumer and District Channels"
    body: "Operating consumer subscription apps alongside enterprise district sales forces creates operational friction. While ABCmouse relies on brand marketing and digital ad conversion, My Math Academy and My Reading Academy demand high-touch field account executives, protracted procurement timelines, and rigorous district compliance standards."
    claimRefs:
      - CP009
      - CP010
      - CP012

