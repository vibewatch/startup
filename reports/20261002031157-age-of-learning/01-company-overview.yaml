company:
  name: "Age of Learning"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Age of Learning is a private Glendale, California education-technology company founded in 2007, with a portfolio spanning ABCmouse, Adventure Academy, and adaptive school products. Its last disclosed transaction benchmark is a $3.0B post-money valuation from the June 2021 Series E; current audited revenue, active customers, ownership, and governance remain material diligence gaps."
sections:
  - id: "identity-and-model"
    title: "Identity, product scope, and business model"
    body: "Third-party profiles agree that Age of Learning was founded in 2007 and is headquartered in Glendale, California. Company-issued materials describe a portfolio led by ABCmouse and Adventure Academy, plus My Math Academy, My Reading Academy, and My Reading Academy Español. The available business-model description points to both direct consumer subscriptions and institutional licenses for schools and libraries, rather than a single-channel consumer app. In January 2026 the company introduced a free, ad-free ABCmouse Basic tier alongside Premium access to more than 13,000 activities. That change broadens the acquisition funnel, but the assigned evidence does not disclose conversion, retention, pricing realization, or the revenue split between family subscriptions and institutional licenses."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO008"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership visibility and governance gaps"
    body: "Alex Galvagni was identified as chief executive in company releases issued in January and May 2026. The May release also announced Cara Ely as Senior Vice President, Creative and Ariella Morik as Vice President, Business Development, adding consumer-product creative experience and partnership coverage. Public evidence is much thinner on founders, directors, voting control, and executive succession: Dealroom's public profile withholds founder identities while exposing only a partial investor view. The available record therefore supports a current operating-leadership snapshot, not a complete governance assessment. Founder ownership, board composition, reserved matters, preferred-stock rights, and management retention should be obtained directly before assigning confidence to control or key-person risk."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capital-and-scale"
    title: "Financing record and evidence-constrained scale"
    body: "Tracxn reports $482M raised across four rounds and records a $300M Series E on June 29, 2021 at a $3.0B post-money valuation, led by TPG with Qatar Investment Authority and Madrone Capital Partners also listed. Dealroom maps six investors but its public view exposes only part of the cap table. Operating-scale figures are less authoritative: Age of Learning said in May 2026 that it had served more than 55 million children cumulatively, while GetLatka estimated $126.8M of revenue. Cumulative children served is not a current customer or subscriber count, and an external revenue estimate is neither audited revenue nor ARR. None of the assigned sources establishes current cash, burn, profitability, debt, or secondary pricing."
    claimRefs:
      - "CO007"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
  - id: "milestones-and-reconciliation"
    title: "Milestones, conflicting metrics, and diligence posture"
    body: "The dated record is strongest for the 2007 founding, the 2021 financing, and 2026 product and leadership announcements. It is weaker for current operating performance. Dealroom maps 394 employees across 12 countries, whereas GetLatka reports 435 employees; these are third-party estimates with different methodologies, not an official headcount range. An April 2026 IPO tracker still described the company as private with no announced offering plan, so the 2021 post-money value should be treated as a historical financing benchmark rather than current market value or available liquidity. The assigned adverse search retained no result, which leaves legal, regulatory, outage, and complaint checks open rather than proving that no incidents exist."
    claimRefs:
      - "CO001"
      - "CO006"
      - "CO008"
      - "CO011"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
