      - number: '6.2'
        title: Adoption signals are cumulative, not active
        blocks:
          - type: paragraph
            body: >-
              Age of Learning's own January 2026 release said the company had served more than 50 million children
              worldwide; a May 2026 company release raised that cumulative statement to more than 55 million. LeadIQ
              separately repeats a greater-than-50-million reach figure, but does not supply a methodology or
              active-user denominator. The change in company boilerplate is therefore a directional reach signal, not
              evidence of five million new paying customers, current subscribers, or retained learners. The assigned
              comparison dataset is similarly explicit that Age of Learning's customer count is not disclosed.
              Investment diligence should not translate any of these reach statements into active accounts, recurring
              revenue, or retention without a dated cohort definition and reconciliation.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU015
      - number: '6.3'
        title: Named proof is narrow and relationship-heavy
        blocks:
          - type: paragraph
            body: >-
              The strongest user-level proof in the assigned pool is a randomized study of ABCmouse English involving
              148 seven- and eight-year-old children in Japan, split evenly between treatment and control groups for 16
              weeks. The study reports significantly greater English-learning gains for the treatment group, including
              on the Eiken Junior assessment. It also found that completed activities and the share of time in the
              exploration area, rather than total app time or unique play days, predicted gains when other metrics were
              considered. NASA and the San Diego Zoo and Safari Park are named content partners in the 2026 product
              release, but the source does not identify them as paying customers or disclose commercial terms.
              Accordingly, these relationships demonstrate product content and study use, not a verified customer
              roster.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU010
              - CU011
              - CU014
      - number: '6.4'
        title: Durability and concentration remain diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The study offers encouraging short-window engagement evidence, but it cannot substitute for commercial
              retention. Its authors disclose that access requirements may have biased the sample, that results may not
              generalize beyond China and Japan, that Age of Learning financially supported data collection, and that
              two researchers were company employees. Those disclosures make the outcomes useful but bounded. No
              assigned source provides subscriber churn, gross or net revenue retention, renewal rates, contract
              duration, cohort lifetime value, conversion from Basic to Premium, or top-customer exposure. The most
              decision-relevant next step is therefore a cohort and channel reconciliation: active free users, paid
              families, school accounts, annual renewals, and revenue by the largest customers and distribution
              partners, all tied to a common period and denominator.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reach is not an active-customer metric
            body: >-
              The 50-million-plus and 55-million-plus figures are cumulative company-issued counts of children served.
              They cannot be converted into current subscribers, customer accounts, or recurring revenue.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Commercial durability is unverified
            body: >-
              The assigned evidence contains no retention, renewal, cohort economics, conversion, or
              customer-concentration disclosure; the 16-week outcomes study measures learning and engagement rather than
              commercial durability.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              Age of Learning operates within an increasingly scrutinized digital consumer and educational technology
              regulatory environment. The company historically settled major regulatory actions regarding consumer
              subscription billing, cancellation friction, and auto-renewal disclosures under federal and state consumer
              protection standards. The ongoing maintenance of strict consent protocols, COPPA statutory compliance
              regarding child data privacy, and transparent online cancellation flows represents a perpetual operational
              requirement. Any failure to uphold pristine compliance in automatic renewal subscriptions or child profile
              protection presents immediate enforcement exposure, potential class action litigation, and severe
              financial penalties across consumer and institutional tiers. Continuous monitoring of state automatic
              renewal law changes remains essential.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, Technological, and Market Delivery Risks
        blocks:
          - type: paragraph
            body: >-
              Operational continuity and curriculum efficacy constitute critical risk factors for Age of Learning as
              early childhood learning shifts toward modern digital modalities. Macro research on learning ecosystems
              emphasizes that transitioning from traditional instruction models toward modern adaptive frameworks
              requires substantial ongoing investments in pedagogical rigor, empirical efficacy validation, and platform
              reliability. Furthermore, industry-wide operational reorganizations driven by generative AI indicate that
              organizations must continuously adapt their labor and technology stacks as task-division demand shifts.
              Meanwhile, independent analyses classify the company as carrying bloated valuation risks relative to
              educational outcomes, noting that biological age-out around age 8 caps customer lifetime value and forces
              unrelenting customer acquisition expenditure to replace natural subscriber churn. These dynamics compound
              margin pressure in a competitive edtech landscape.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
