      - number: '3.2'
        title: Product Differentiation, Packaging Transitions, and Pricing Models
        blocks:
          - type: paragraph
            body: >
              Age of Learning has fundamentally adjusted its commercial packaging to counter commoditization and
              customer acquisition cost pressure. In January 2026, the company introduced ABCmouse Basic, offering
              ad-free access to foundational reading and math activities at no charge, alongside ABCmouse Premium which
              unlocks more than 13,000 activities, adaptive Learning Paths, and offline mode. This structural move
              lowers top-of-funnel consumer friction against completely free or ad-supported early learning substitutes
              while defending its paid subscription tier.


              For older demographics, Adventure Academy utilizes an educational massively multiplayer online (MMO)
              architecture priced at an annual equivalent of less than $5 per month or $9.99 month-to-month, competing
              with both entertainment gaming and interactive study tools. On the institutional side, products such as My
              Math Academy, My Reading Academy, and My Reading Academy Español are sold through field-based sales teams
              targeting public school district procurement cycles, where pricing shifts from consumer monthly recurring
              models to per-student or enterprise district-wide licenses.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
