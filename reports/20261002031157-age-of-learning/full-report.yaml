  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Educational Delivery Workflows
        blocks:
          - type: paragraph
            body: >
              Age of Learning operates a multi-tiered educational technology portfolio designed for early childhood,
              elementary, and specialized bilingual education [CE001]. The company's flagship consumer offering,
              ABCmouse Early Learning Academy, serves children ages 2 through 8 across foundational subjects including
              reading, mathematics, science, and social studies [CE002]. In January 2026, Age of Learning restructured
              the ABCmouse consumer experience around a two-tier delivery model: ABCmouse Basic, providing free ad-free
              access to curated daily foundational activities, and ABCmouse Premium, offering full access to over 13,000
              interactive activities, guided learning paths, multi-child household profiles, and offline play
              capabilities [CE003]. This dual-tier structure is engineered to expand top-of-funnel family adoption while
              funneling committed users into paid subscription tiers.


              Beyond early childhood home learning, the company delivers Adventure Academy, an educational massively
              multiplayer online game (MMO) targeting learners ages 8 to 13 with interactive quests in language arts,
              mathematics, and science [CE004]. For institutional K-5 school districts, Age of Learning provides
              dedicated adaptive curriculum solutions: My Math Academy, My Reading Academy, and My Reading Academy
              Español [CE005]. These institutional applications integrate diagnostic assessment and adaptive
              personalization to adjust instructional difficulty dynamically, providing educators with real-time student
              mastery tracking and bilingual classroom support [CE005]. In international markets, the company deploys
              localized offerings such as ABCmouse English, which incorporates sequenced lessons and speech recognition
              tools to teach English as a second language through regional operating partnerships [CE006].
            claimRefs:
