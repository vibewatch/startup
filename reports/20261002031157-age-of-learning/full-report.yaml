  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Age of Learning generates revenue primarily through recurring digital subscription memberships across its
              portfolio of early childhood and elementary learning platforms. The flagship product, ABCmouse Early
              Learning Academy, historically established the company's consumer subscription engine, pricing at $7.95
              per month for unlimited home access covering up to three unique child profiles. In 2026, the company
              restructured ABCmouse into a two-tier product model comprising ABCmouse Basic, an ad-free free tier
              providing curated daily activities, and ABCmouse Premium, a paid subscription unlocking over 13,000
              activities, personalized learning paths, and offline access. Additional consumer and educational products
              include Adventure Academy, a multiplayer educational game for ages 8 to 13, alongside institutional
              adaptive curriculum solutions comprising My Math Academy, My Reading Academy, and My Reading Academy
              Español marketed to schools and enterprise channel distributors such as SoftwareOne. While institutional
              programs expand geographic and public-sector reach, consumer subscription renewals continue to constitute
              the core recurring revenue foundation.
