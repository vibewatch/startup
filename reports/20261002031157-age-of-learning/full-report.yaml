              - CP008
      - number: '3.3'
        title: GTM Distribution Power, Switching Barriers, and Moat Durability
        blocks:
          - type: paragraph
            body: >
              Diligence across Age of Learning's go-to-market posture indicates a deliberate investment in institutional
              sales capacity and AI-driven curriculum engineering. Field sales recruitment focuses heavily on Account
              Executives and Associate Account Executives equipped for high-volume outbound prospecting and
              district-level RFP navigation across CRM systems like Salesforce and HubSpot. This institutional motion
              represents a significant operational shift from historical consumer digital marketing campaigns.


              Simultaneously, engineering hiring emphasizes AI-native software development to accelerate content
              iteration across Flutter, Svelte, and cross-platform mobile apps. However, moat durability remains
              constrained: consumer early-learning apps suffer from natural lifecycle churn as children age out of the
              target 2-8 demographic, and multi-homing among parents is widespread. While institutional school contracts
              provide higher multi-year lock-in and switching costs, Age of Learning must overcome established
              incumbency from district-wide learning management and assessment platforms that already dominate school
              procurement channels.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
