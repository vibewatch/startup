      - number: '5.2'
        title: Software Architecture, Cross-Platform Stack, and Engineering Practices
        blocks:
          - type: paragraph
            body: >
              The technical architecture supporting Age of Learning's multi-product suite combines cross-platform mobile
              and web client interfaces with backend distributed services and adaptive learning engines [CE007].
              Client-side applications deployed across iOS, Android, Amazon Appstore, and web environments utilize
              Flutter, Dart, JavaScript, and TypeScript, with modern web interfaces adopting Svelte and SvelteKit for
              high-performance rendering [CE007]. Backend services communicate via REST and gRPC application programming
              interfaces (APIs), coordinating content delivery, account management, and real-time activity telemetry
              across millions of concurrent learners [CE007]. Specialized modules such as ABCmouse English integrate
              automated speech recognition systems that analyze child phoneme pronunciation against native speaker
              benchmarks, providing immediate audio feedback and updating parent progress dashboards [CE006].


              Beginning in 2026, Age of Learning initiated a company-wide transition toward AI-native software
              engineering practices within its consumer engineering teams [CE007, CE008]. Rather than utilizing
              artificial intelligence solely for passive code autocompletion, engineering standards mandate agentic
              workflows across the software development life cycle, including autonomous code refactoring, test
              generation, codebase navigation, Model Context Protocol (MCP) tooling, and prompt engineering [CE007,
              CE008]. This architectural and operational evolution is paired with executive creative and business
              development appointments aimed at integrating personalized AI interactions into core learner journeys
              [CE009]. However, technical documentation regarding proprietary adaptive algorithms, server infrastructure
              throughput, and offline synchronization mechanisms remains undisclosed to external auditors [CE010].
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
