      - number: '4.3'
        title: Capital Adequacy, Historical Valuation, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Age of Learning has accumulated $482 million in total equity financing across four primary institutional
              rounds, culminating in a $300 million Series E round in June 2021 led by TPG Tech Adjacencies with
              participation from Qatar Investment Authority and Madrone Capital Partners at a $3 billion post-money
              valuation. Previous financing included a $150 million Series D led by Iconiq Capital in May 2016 at a $1
              billion valuation. As of August 2026, Tracxn tracks the company's active headcount at 379 employees, down
              from peak post-Series E expansion levels, indicating operational rationalization. Although historical
              cumulative product donations exceeding $200 million and reach across 50 million children demonstrate
              significant scale, the absence of public financial filings since the 2021 funding round creates
              substantial diligence opacity. The $3 billion peak valuation multiple remains severely ungrounded against
              current EdTech market trading multiples, and full private underwriting requires audited profit-and-loss
