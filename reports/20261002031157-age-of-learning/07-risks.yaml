callouts:
  - calloutType: risk
    title: Structural LTV Cap Driven by Biological Learner Aging
    body: 'Unlike typical SaaS businesses where net revenue retention can compound indefinitely via enterprise expansion, early education platforms face an unyielding biological ceiling: children age out of primary curricula like ABCmouse by age 8. This creates an unavoidable structural treadmill requiring relentless customer acquisition to replace natural subscriber churn.'
    claimRefs:
      - CR006
      - CR007
