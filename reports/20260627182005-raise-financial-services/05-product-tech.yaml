- id: deployment-release-cadence-and-maturity
  title: Deployment surfaces, release cadence, and product maturity
  body: Public release evidence points to a fast-moving product organization. The DhanHQ community posts show meaningful API
    expansion during 2025, including full market depth and option-chain with Greeks. The JFM'26 recap then broadens the picture
    with DEXT T3, conditional trigger APIs, watchlist upgrades, ScanX company-page changes, and adjacent investing features
    like ETF parking and Super IPO. The iOS listing adds another current product signal by documenting a recent version that
    introduced US stocks and ETFs. At the same time, maturity is uneven across surfaces. DEXT T3 is live and feature-rich,
    but the public beta thread still matters because it shows launch through a limited cohort, active backlog capture, and
    explicit requests for features like drag-and-drop order handling, additional settings, and better watchlist configuration.
    The official DEXT page itself reinforces that incompleteness by stating that custom alerts, terminal automation, and third-party
    integrations are not available today. So the release cadence is strong, but the public record still describes a stack
    that is shipping quickly and converging toward maturity rather than one where every surface is already fully stabilized.
  claimRefs:
