- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Client surfaces
    - App, web, options surfaces, TradingView, DEXT T3, and API entry points collect intent and display state
    - Depends on OS platforms, browser behavior, app-store distribution, and consistent session state
    - Surface-specific reliability may diverge even if the core broker engine is healthy
  - - Execution core
    - Custom OMS and EMS execute orders and maintain broker workflow state
    - Depends on exchange connectivity and Dhan's own routing logic on AWS
    - Execution correctness matters more than UI polish; public internals remain mostly partner-documented
  - - Data and developer layer
    - Trading API, data API, option chain, full-depth feed, MCP tools, and SDK abstractions expose programmable access
    - Depends on rate limits, schema stability, and maintained SDKs or docs
    - Rapid feature expansion can create version drift or breaking changes for developers
  - - Capital and margin services
    - MTF, pledge margin, collateral, and order-linked risk checks support larger or cross-product positions
    - Depends on depository rails, RMS logic, and collateral valuation policies
    - Leverage and forced-liquidation rules can raise customer-loss and support-risk intensity
  - - Infrastructure and resilience layer
    - Direct Connect, Aurora, Auto Scaling, Lambda, and active-active DR keep the platform fast and available
    - Depends on AWS capacity planning and connectivity to exchanges
    - Partner case-study evidence is helpful but not a substitute for a public status page or SLA history
  - - Observability and compliance layer
    - CloudWatch, Systems Manager, Security Hub, compliance workflows, and 150+ risk checks monitor the stack
    - Depends on correct alerting thresholds, response processes, and policy upkeep
    - The public file proves tooling exists, but not how often incidents are detected or avoided by layer
  notes: This architecture is reconstructed from official docs, partner disclosures, and the public SDK rather than from source
    code or a formal system diagram published by Dhan.
