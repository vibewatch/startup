    - No public latency or uptime breakout for web alone
  - - Options Trader App
    - Mobile F&O traders
    - Mature specialist module
    - 10+ pre-built strategies, Basket and Forever Orders, and instant margin framing
    - No public win-rate or strategy-usage distribution
  - - Options Trader Web
    - Desktop F&O traders
    - Growth module with clear feature depth
    - Custom strategy builder, screener and scanner, options ideas, and cross-surface state sync
    - No public usage or conversion data by feature
  - - TradingView surface
    - Chart-first discretionary traders
    - Mature integration layer
    - Chart-native order entry with AVWAP, 20+ layouts, drag-and-drop orders, and native console
    - Dependency on external charting partner experience is not publicly quantified
  - - DEXT T3
    - Power traders and desktop-first users
