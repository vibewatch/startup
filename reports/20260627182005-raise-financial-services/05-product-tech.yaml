  evidenceGaps:
  - type: missing-source
    severity: material
    topic: dext-t3-maturity-metrics
    missingEvidence: A dated DEXT T3 changelog with public install base, crash rates, and feature-completion metrics after
      the beta cohort.
    whyItMatters: The terminal is strategically important, but the public record still relies heavily on launch copy and community
      feedback rather than stable production telemetry.
    diligencePath: Request internal DEXT T3 adoption dashboards, a shipped-vs-pending feature log, and monthly reliability
      metrics by desktop platform.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: complaint-normalization
    missingEvidence: Complaint counts normalized by active-client base, platform surface, and time window across NSE, BSE,
      MCX, and depository flows.
    whyItMatters: Public complaint pages exist, but without consistent denominators they cannot be used as a clean product-quality
      KPI or compared fairly to peer brokers.
    diligencePath: Pull exchange and internal complaint datasets together with monthly active-client counts and categorize
      issues by app, web, options, support, and settlement workflow.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: public-assurance-disclosure
    missingEvidence: A public security-certification pack, audit bridge letter, or status page that covers Dhan's retail and
      API surfaces.
    whyItMatters: The chapter can verify compliance-heavy controls and AWS tooling, but it cannot independently verify a formal
      external assurance posture from the current public file.
    diligencePath: Request current certifications, audit attestations, or a customer trust center that covers production uptime,
      incident history, and control scope.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: api-usage-telemetry
    missingEvidence: Public DhanHQ request volumes, endpoint latency SLOs, and error-rate history for trading, data, and MCP
      tools.
    whyItMatters: The developer surface looks broad, but usage intensity and production-grade reliability are still inferred
      from feature depth instead of audited operating metrics.
    diligencePath: Request internal API observability dashboards and a customer-facing SLA or reliability note for the core
      DhanHQ endpoints.
