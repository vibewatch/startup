- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Dhan solution
  - Measurable benefit
  - Limitation
  rows:
  - - Trade and invest from one retail account
    - Switch between separate investing and trading apps or brokers
    - Dhan App plus Dhan Web under one account
    - Official surfaces market one account across stocks, ETFs, mutual funds, IPOs, and F&O
    - Benefit is product-claimed; no public per-surface engagement split
  - - Run options strategies quickly
    - Calculate strikes and Greeks manually, then route orders separately
    - Options Trader app and web plus strategy tooling
    - 10+ pre-built strategies and single-endpoint option-chain data reduce manual setup
    - No public productivity benchmark versus other F&O terminals
  - - Trade directly from charts
    - Analyze on one tool and place orders on another
    - TradingView on Dhan
    - Order placement from charts with AVWAP, basket orders, and drag-and-drop levels
    - Experience inherits third-party charting dependency and partner-surface risk
  - - Manage desktop-heavy trading flows
    - Use generic broker desktop or multiple browser tabs
    - DEXT T3 terminal
    - Custom workspaces, 25+ widgets, and Position Analyzer keep more workflow in one terminal
    - Automation, custom alerts, and third-party integrations are explicitly absent today
  - - Increase buying power with collateral
    - Move money manually or sell holdings to create trading capacity
    - MTF plus Margin Pledge Benefit
    - Up to ₹5 crore MTF and instant pledge or unpledge on 1,450+ securities widen capital efficiency
    - Forced-liquidation logic and rate slabs introduce real leverage risk
  - - Build systematic or agent-led trading workflows
    - Maintain servers, hand-wire data feeds, and manage broker integration separately
    - DhanHQ APIs, MCP server, and cloud runtime
    - Free trading API, scheduled runs, and full-depth or option-chain feeds lower setup friction
    - Public reliability, volume, and enterprise adoption data are not disclosed
  notes: The table emphasizes concrete user jobs so Dhan's breadth is evaluated as workflow coverage rather than as a loose
    list of surface names.
