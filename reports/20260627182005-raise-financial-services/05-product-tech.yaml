- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - OTP-based pledge control
    - Documented
    - Pledge creation requires OTP through depository-linked flow
    - Public material does not quantify how often pledge failures or support escalations occur
  - - Credential and anti-tip warnings
    - Documented
    - Users are told not to share credentials and to report unofficial stock-tip activity
    - Warnings exist, but no public fraud-loss or account-takeover metrics are disclosed
  - - Mutual-fund execution boundary
    - Documented
    - Dhan states the BSE StarMF flow is order collection and not distributor or proprietary trading activity
    - No public service-level metrics for mutual-fund execution errors or delays
  - - API and agent guardrails
    - Documented
    - MCP requires confirmation, defaults to LIMIT orders, and validates F&O lot sizes
    - No public audit of false positives, override patterns, or incident-prevention rates
  - - Data-sharing and regulated-counterparty flows
    - Documented
    - Privacy policy lists exchanges, depositories, clearing corporations, banks, KRAs, CERSAI, NBFCs, and credit bureaus
    - Readers still lack a public trust center or scoped assurance pack for these data flows
  - - Public third-party assurance disclosure
    - Not surfaced in current cache
    - No status page or certification pack was found in the fetched public file for this run
    - This leaves an external-assurance gap even though compliance and AWS-control evidence is meaningful
  notes: The table distinguishes disclosed controls from the unresolved question of whether Dhan publishes a modern trust-center-style
    assurance package for customers or API users.
