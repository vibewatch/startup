        title: 资本基础和独角兽跃升
        blocks:
          - type: paragraph
            body: >-
              公开记录里最重要的资本市场事实，是 2025 年 10 月的 Series B。Avendus、The Economic Times 和 Entrepreneur India 对一轮 $120 million
              融资的口径一致，投资方包括 Hornbill Capital、MUFG、BEENEXT 以及一批公开市场投资者。同一组报道把投后估值锚定在约 $1.2 billion 或 Rs 10,000 crore，使
              Raise 进入独角兽行列。更早报道还追溯到 2022 年一轮约 $22 million、估值约 $150 million
              的机构融资，意味着三年内估值大幅跳升。融资故事可信，但并不完全完整。公开来源没有完整对齐累计融资额、老股成分或轮后治理权利。因此，头部估值有充分支撑，但精确资本结构机制仍披露不足。后文最安全的标准事实，是融资规模、主要投资方、估值区间，以及所称资金用途指向生态扩张，而不是精确累计融资总额。
