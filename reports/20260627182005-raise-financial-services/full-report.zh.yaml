        - 高
        - F&O 集中和监管波动改变盈利能力的速度，可能快于当前融资叙事所暗示。
        - 明确脱离 F&O 的多元化，以及再一年稳定盈利。
      - - 估值立场
        - 合理
        - Rs 10,000 crore 这一轮作为中点可以支撑，因为 FY26 盈利和份额提升都是真实的，但并不明显便宜。
