        title: 创始人、使命和生态扩张
        blocks:
          - type: paragraph
            body: >-
              公司的创始叙事比法律壳更新。围绕独角兽轮的媒体报道把 Raise Financial Services 归于 2021 年创始团队，领头人是前 Paytm Money 高管 Pravin Jadhav，团队还包括
              Alok Pandey、Jay Prakash Gupta 和 Raunak Rathi。Dhan 关于页面的官方文案则从产品角度定义使命：做一个面向超级交易者和长期投资者的技术驱动平台，而不是又一个通用券商
              App。2026 年值得注意的是，Raise 已不再只是单一券商故事。Avendus 以及集团自身生态页面显示，邻近品牌包括投资产品 Millions、研究产品 ScanX、AI 原生金融问答 Fuzz、消费媒体
              Filter Coffee 和教育产品 Upsurge。业务外延变宽，支撑了金融生态论点；但也带来一个限制：公开治理披露没有跟上生态复杂度，所以战略版图比正式控制版图更清楚。
