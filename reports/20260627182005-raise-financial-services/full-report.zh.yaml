      - number: '8.4'
        title: 情景区间、退出准备度和尽调问题
        blocks:
          - type: paragraph
            body: >-
              实际输出应是一组区间，而不是虚假的精确数。若以 FY26 营业收入作为最清晰的公开分母，上一轮估值已经接近收入等价营业收入的 11.1x。8x 对应约 Rs 7,239 crore，10x 约 Rs 9,049
              crore，12x 约 Rs 10,859 crore，15x 约 Rs 13,574 crore。因此，今天最站得住脚的公开证据区间，是 Rs 10,000-12,000 crore
              左右的基准情形：它既尊重上一轮私募定价，也反映 FY26 利润率仍然健康，以及 Dhan 在更艰难市场中仍在拿份额。Rs 12,000-14,000 crore
              的牛市情形不能只靠希望支撑。它需要相邻产品开始体现在报表经济性里、份额继续提升，并证明 FY26 的费用膨胀只是暂时现象，而非结构性问题。若 F&O
              监管再次收紧、利润率继续压缩，或披露显示多元化尚未形成实质经济贡献，委员会就应把 Rs 8,000-9,500 crore 的熊市情形放在心里。相较公开市场或 IPO
              导向的同业，退出准备度仍显不足，因为市场缺少分部收入拆分、轮次条款细节，以及更厚实的治理叙事。最可能改变建议的是这些尽调事项，而不是标题价格的小幅调整。
