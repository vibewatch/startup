    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份和监管基础
        blocks:
          - type: paragraph
            body: >-
              理解 Raise Financial Services，首先要看实际触达客户的受监管实体。Dhan 自身的监管和联系信息明确显示，面向消费者的 Dhan 品牌位于 Raise Securities Private
              Limited 之内；SEBI、交易所和存管登记都挂在该公司名下，而不是一个独立的「Dhan」法律壳。NSE 会员详情数据也印证了这条法律主干：注册办公室同在孟买 Goregaon
              West，交易会员代码相同，且同时具备自营、机构和零售客户权限。这一点很重要，因为后文关于财务、投诉和产品义务的分析，除非来源明确指向更广义的 Raise 集团，否则都应回到 Raise
              Securities。公开文件还显示，该法律实体早于 Dhan 上线多年，这解释了为什么 2012 年注册成立、2015 年获得 SEBI 登记、2021 年产品上线可以同时成立，并不矛盾。
