      - number: '2.2'
        title: TAM、SAM 和参与规模需要多重视角
        blocks:
          - type: paragraph
            body: >-
              市场无疑很大，但公开数据集描述的是不同对象，不能压成一个头条 TAM。Mordor 给出最宽的收入视角：2025 年 USD 4.25 billion，到 2030 年升至 USD 6.21
              billion；线上分发已占品类活动 51.3%，零售用户占组合 63.4%。这些收入数字有助于理解行业，但会高估 Dhan 近期能直接触达的范围，因为 demat
              账户增长、活跃客户参与和衍生品强度会层层收窄池子。ETBFSI 显示，2024 年 6 月 demat 账户达到 162 million；HDFC Sky 和 Outlook 则把 2025-2026
              年漏斗顶部放在 19 crore 以上。但 ICRA 称 2024 年末 NSE 活跃客户只有约 4.8 crore，CNBC 又称到 2026 年 3 月降至 4.57 crore。活跃客户这一层，才是更实用的
              SAM 近似值。在其中，最高价值人群还要更窄：ICRA 估计活跃衍生品交易者只有约 96 lakh；CNBC 的 FY26 份额数据则暗示 Dhan 当前自身活跃客户可能约 100 万。
