        title: 规模、技术和未解问题
        blocks:
          - type: paragraph
            body: >-
              公开的规模和技术信号方向上很强，但仍需要谨慎标注。Avendus 称 Dhan 上线不到四年活跃用户接近 100 万；Google Play 文案称产品获得超过 100 万用户信任；Dhan 自身定价页则称
              App 下载超过 1 crore。这些都是有用的采用指标，但不能互换。技术证据也足够支撑概览使用。Avendus 和 AWS 都支持自研 DEXT 引擎的存在，并称执行低于 20 毫秒，AWS
              还认可其性能显著快于行业基准。DhanHQ 文档进一步补全图景，显示其提供免费交易 API 和一方 MCP 服务器。未解问题更偏组织而非技术：确切董事会构成、干净的累计融资总额，以及有日期标注的 Dhan
              单体员工数，公开文件仍不可得。
