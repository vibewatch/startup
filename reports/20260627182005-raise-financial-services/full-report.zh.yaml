  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和定价
        blocks:
          - type: paragraph
            body: >-
              公开文件支持的是券商优先、与交易活动挂钩的收入模式，而不是订阅或顾问模式。官方价目表明确显示，股票交割免费，平台费为零，核心变现来自已执行交易活动、期权订单、借记相关费用和保证金融资。第三方报道进一步说明这种定价如何转化为实际经济性：证券经纪约占
              FY26 NOI 的 79%，仅零售 F&O 就约占 NOI 的 70%。这个组合很重要，因为 Dhan
              的表内定价看起来是行业标准，而非溢价，所以业务依赖留住活跃交易者并维持订单流，而不是从每笔交易抽取异常高佣金。公开文件里最强的增量变现杠杆是 MTF，Dhan
              在该产品上宣传结构化利率阶梯和更大的持仓融资额度。文件也通过排除项提供了信息。Dhan 称自己不做自营交易，也不是共同基金分销商或代理，这意味着公开证据更支持经纪、融资收入和附属运营费用，而不是隐藏自营账本收益或
              MF 尾佣。因此，增长故事可信，但收入质量对交易强度和产品组合高度敏感。
