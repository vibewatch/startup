        - 全球公司、规模大得多，并非印度零售券商的直接可比。
      - - Zerodha Capital
        - FY25 收入 Rs 3,571.81 crore；PAT Rs 1,220.75 crore；CRAR 35.79%
        - 有助于理解证券抵押信贷周边的贷款相邻经济性
        - 融资可选性可以把变现做深，超出单纯经纪。
        - NBFC 子公司，不是纯上市券商，也不是 Dhan 的直接等价物。
      - - Groww
        - Rs 20 或 0.1% 定价；具名投资者关系负责人；新 SIP 注册份额 47%，活跃 SIP 账户份额 17%
        - 代表相邻投资流量中最强的零售超级 App 式对手
        - 长期复利看的是拿下更广钱包，而不只是定价。
        - 本来源包没有提供 Groww 财务数据或干净的当前估值锚点。
