            body: >-
              Dhan 主要卖给印度自主型零售市场参与者，但公开记录显示，其客户基础比单一「交易者 App」标签更宽。独立 FY26 报道锚定了最清晰的规模事实：截至 2026 年 3 月 31 日，Raise
              Securities 约有 17 lakh 活跃客户，足以拿到约 2.3% NSE 活跃客户份额和第 #9 的市场位置。围绕这个锚点，还有多个重要但不能混同的指标。Moneycontrol 报道约 10.5
              lakh 活跃投资者；JFM26 社区回顾称接近 1 million 活跃用户；应用商店称 1 Mn+ 用户；Dhan 自身定价页称 1 Cr+
              下载。这些数字合起来支持有意义的零售采用，但每个数字描述的是漏斗中的不同位置，而不是同一个一致分母。
