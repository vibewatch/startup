            body: >-
              缓释逻辑真实存在，但不完整。Dhan 看起来仍有流动性、盈利能力和评级，也有公开申诉路径、投资者章程 SLA，以及许多年轻券商没有如此清楚展示的明确风险披露。但这些缓释因素没有消除主要投资问题：Raise
              能否在承受更高营销开支、团队扩张和仍以交易者为中心的产品姿态时，足够快地多元化。最好的公开观察点因此不是泛泛指标，而是 F&O 收入占比、MTF
