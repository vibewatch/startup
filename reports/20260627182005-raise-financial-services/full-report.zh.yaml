        - 固定费用折扣模式，另设 AMC
        - 每笔成交订单固定 ₹20
        - 定价页把账户经济性与交易费用并列强调
        - 即便交易费用趋同，同业的总账户经济性仍有差异
    notes: 同业数据只反映公开标价。这些页面没有披露实际经纪费、返佣结构和客户结构影响。
