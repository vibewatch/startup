      - number: '5.2'
        title: 执行、数据和架构层
        blocks:
          - type: paragraph
            body: >-
              对一家私营零售券商而言，Dhan 的架构故事异常具体，因为它同时有公开 AWS 案例和公开开发者界面。AWS 称 Dhan 在 EC2 上运行自定义 OMS 和 EMS，通过 Direct Connect
              把云足迹连接到交易所，并维持双活灾备。同一案例还补充了具体运营细节：Aurora 替代早期数据库模式，Auto Scaling 应对高峰窗口，Lambda 处理告警和合规任务，监控栈建立在
              CloudWatch、Systems Manager 和 Security Hub 之上，每笔订单有 150 多项风险检查。执行核心之上，还有第二层清晰区分的开发者层。DhanHQ 文档和公开 Python
              客户端显示，Dhan 提供免费交易 API、付费数据 API、期权链和市场深度端点、一方 MCP 服务器，以及用于定时或事件驱动策略的云运行时。关键架构解读是，Dhan 把零售界面设计与可编程工具分开。DEXT
              T3 有意在终端内部阻止交易自动化和第三方集成；DhanHQ 则为想要机器驱动工作流的用户开放自动化、数据和 agent hook。
