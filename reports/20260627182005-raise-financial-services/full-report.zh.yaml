  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和现状替代品
        blocks:
          - type: paragraph
            body: >-
              Dhan 的边界应划在自主型零售证券经纪产品，而不是整个 Raise 生态，也不是泛金融服务。官方 App、网页端、TradingView、DEXT、MTF
              和质押页面都指向同一个纳入支出池：面向现金股票、ETF、共同基金和衍生品的零售执行，以及频繁交易者使用的经纪邻近融资和资本效率功能。这个边界重要，因为替代集合极其拥挤。Zerodha、Upstox、Groww 和
              5paisa 都用免费开户、低价或封顶佣金、广泛移动分发争夺同一个投资者钱包。Dhan
              自身文案强调的是行业标准定价，而不是品类最低价，这意味着它必须靠工作流深度取胜，不能只靠佣金观感。用于测算市场规模时，正确基准应是印度折扣券商和活跃交易类别；保险、机构经纪和非交易内容邻近业务，应留在本章核心市场定义之外。
