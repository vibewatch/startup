  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 客户端界面
        - App、web、期权界面、TradingView、DEXT T3 和 API 入口收集意图并展示状态
        - 依赖 OS 平台、浏览器行为、应用商店分发和一致的会话状态
        - 即便核心券商引擎健康，各界面的可靠性也可能分化
      - - 执行核心
        - 自研 OMS 和 EMS 执行订单，并维护券商工作流状态
        - 依赖交易所连接，以及 Dhan 在 AWS 上的自有路由逻辑
        - 执行正确性比 UI 打磨更关键；公开内部信息仍主要来自伙伴文档
      - - 数据和开发者层
        - Trading API、数据 API、期权链、全深度数据源、MCP 工具和 SDK 抽象层开放可编程访问
        - 取决于限流、数据结构稳定性，以及持续维护的 SDK 或文档
        - 功能快速扩张可能让版本漂移，或给开发者带来破坏性变更
      - - 资金与保证金服务
        - MTF、质押保证金、抵押品和订单联动风控检查，支撑更大仓位或跨产品仓位
        - 取决于存管通道、RMS 逻辑和抵押品估值政策
        - 杠杆和强制平仓规则可能提高客户亏损和支持风险强度
      - - 基础设施与韧性层
        - Direct Connect、Aurora、Auto Scaling、Lambda 和双活 DR 让平台保持快速、可用
        - 取决于 AWS 容量规划和交易所连接
        - 合作伙伴案例证据有帮助，但不能替代公开状态页或 SLA 历史
      - - 可观测性与合规层
        - CloudWatch、Systems Manager、Security Hub、合规流程和 150+ 项风险检查监控技术栈
        - 取决于正确的告警阈值、响应流程和政策维护
