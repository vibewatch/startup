        - 已是当前收入
        - 资金成本和信用损失画像仍未披露
      - - Millions / 直接 MF 投资
        - 绑定同一生态的免费投资入口
        - 更可能是产品和营销投入，而不是立即收费变现
        - 中期参与度杠杆
        - 公开文件没有解释直接变现方式
      - - AI 与生态建设
        - Moneycontrol 将 AI 和更广生态投资列为费用驱动因素
