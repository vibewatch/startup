      - number: '6.4'
        title: 扩张循环和集中度风险
        blocks:
          - type: paragraph
            body: >-
              从单个账户层面看，客户集中度风险较低，因为 Dhan 是大众零售券商；但细分集中度风险仍重要。Moneycontrol 称约 70% 收入来自 F&O，因此即便管理层扩展到共同基金、SIP、保险分销、AI
              工具和线下存在，当前经济性仍绑定活跃交易强度。官方产品页和社区帖子显示，API、期权工具、MTF 和质押产品都有可信的交叉销售路径，可加深现有用户的钱包份额。战略上行在于，印度零售仍有宽阔增长空间，尤其覆盖
              tier 1、2、3 市场。谨慎点是，公开来源仍未披露附加采用率、按细分 CAC 或按平台留存，所以宽度故事清楚，但扩张耐久度只得到部分证明。另一个细微风险是服务模型适配：Dhan
              自身定价披露称其是完全数字化提供商，线下或纸质请求可能更慢且成本更高。对数字原生交易者没问题，但会拖慢那些需要网点引导、关系覆盖或重纸面服务的人群采用。
