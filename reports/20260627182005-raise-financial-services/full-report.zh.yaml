  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可观察锚点价格和当前建议
        blocks:
          - type: paragraph
            body: >-
              公开文件中最干净的估值锚点仍是 2025 年 10 月 Series B，而不是任何假想 IPO 叙事。Economic Times 和 Moneycontrol 口径一致：Hornbill Capital 领投
              $120 million 融资，把 Raise 投后估值推到约 $1.2 billion 或 Rs 10,000 crore；同一报道还回溯到 2022 年一轮规模小得多、估值约 $150 million
              的融资。这个跃升很大，但并非没有经营证据支撑：Raise Securities 报告 FY26 净营业收入 Rs 904.9 crore、PAT Rs 325.8 crore，使 Dhan
              即便在更艰难的衍生品制度后，仍处于已盈利的新世代折扣券商之列。按上一轮估值，公司约为 FY26 营业收入的 11.1x、FY26 PAT 的
              30.7x。这些倍数并不显然便宜，但对于一家仍在增长、高利润率的私营券商，也不荒唐。真正约束来自披露质量，因为公开来源仍未完全对齐累计融资额、清算优先权悬置负担，或集团故事背后的精确分部组合。这个组合支持价格敏感的跟踪判断和公平立场，而不是泛化的质量上调。
