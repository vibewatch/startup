      - 可观察指标
      - 与 Dhan 的相关性
      - 启示
      - 主要局限
    rows:
      - - Dhan 上一轮
        - Rs 10,000 crore 股权价值；约 11.1x FY26 NOI 和 30.7x FY26 PAT
