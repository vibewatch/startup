            body: >-
              公开发布证据指向一个移动很快的产品组织。DhanHQ 社区帖子显示，2025 年 API 有实质扩展，包括完整市场深度和带 Greeks 的期权链。JFM'26 回顾进一步扩展了图景，包含 DEXT
              T3、条件触发 API、自选列表升级、ScanX 公司页变化，以及 ETF parking 和 Super IPO 等邻近投资功能。iOS 列表也记录了近期版本引入美国股票和
              ETF，提供了另一个当前产品信号。同时，各界面成熟度并不均衡。DEXT T3 已上线且功能丰富，但公开 beta
              线索仍重要，因为它显示产品通过有限人群发布、主动收集待办清单，并明确要求拖拽订单处理、更多设置和更好的自选列表配置等功能。官方 DEXT
              页面本身也强化了这种未完成状态，称当前不提供自定义告警、终端自动化和第三方集成。因此，发布节奏很强，但公开记录仍描述的是一个快速出货、走向成熟的栈，而不是每个界面都已完全稳定。
