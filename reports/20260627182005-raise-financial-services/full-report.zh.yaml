      - number: '5.4'
        title: 信任控制、安全姿态和产品技术风险
        blocks:
          - type: paragraph
            body: >-
              Dhan 的公开信任姿态由合规驱动，而不是由信任中心驱动。公司公布申诉路径，引导用户使用 SCORES 和存管提醒，要求基于 OTP
              创建质押，警示不要分享凭证，声明不提供股票建议，并明确共同基金执行有单独风险和非分销商边界。隐私政策也显示，这是一个高度连接的金融工作流：交易相关数据可以流向交易所、存管机构、清算公司、处理银行、KRA、CERSAI
              和其他受监管对手方。开发者界面加入了真实护栏——订单确认、默认 LIMIT 行为和手数校验——而 AWS 证据显示后台有严肃的可观测性和风险工具。主要风险来自公开文件仍无法闭合的部分。保证金产品可在覆盖率低于
              20% 时强制清算。最强的延迟和故障主张仍由公司或合作伙伴转述，而非独立审计。投诉披露页面存在，但未标准化到足以形成干净的质量
              KPI。本轮也没有浮现公开安全认证包或状态页，因此即便控制姿态看起来严肃，信任披露仍有缺口。
