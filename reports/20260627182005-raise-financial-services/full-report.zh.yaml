      - number: '7.2'
        title: 杠杆、保证金和亏损传导
        blocks:
          - type: paragraph
            body: >-
              第二大风险簇来自 Dhan 如何从活跃交易者变现以及如何管理杠杆。官方页面显示普通交割交易没有保证金，但同时宣传最高 Rs 1 crore 的 MTF、覆盖 1450+ 股票的即时质押保证金，以及应用商店文案中的
              5X 杠杆提示。Dhan 自身 RMS 文件详细且异常强硬：基于计时器的日内平仓在收盘前开始，MTM 超过 80% 时可减少仓位，覆盖率低于 20% 可触发清算，包括 MTF
              持仓。这些控制能缓释券商信用风险，但如果市场跳空、流动性消失，或经验不足的交易者过度使用杠杆工具，也会抬高客户结果和投诉风险。到 2026 年 3 月，MTF 账本达到 Rs 505
              crore，基于同样原因值得关注。相对行业总量仍小，但增长速度快于公开证据中非经纪费用多元化的增长，因此杠杆既可能支撑成交量，也可能放大下行。
