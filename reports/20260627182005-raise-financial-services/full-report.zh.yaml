  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 主题
      - 论点
      - 反论点
      - 什么会改变观点
    rows:
      - - 私人市场锚点
        - 上一轮规模大、时间近，由可信投资者领投，估值约 $1.2 billion。
        - 私人轮可能滞后于公开市场风险重定价，也不披露清算优先权。
        - Series B 条款，以及任何二级交易或优先权包袱。
      - - 运营证明
        - FY26 仍录得 Rs 904.9 crore NOI、Rs 325.8 crore PAT 和 36% 利润率。
        - 尽管收入增长，PAT 已下降 20%；这可能说明常态化盈利能力低于本轮融资的标题叙事。
        - 一次性支出和监管重置之后的 FY27 利润率轨迹。
      - - 市场份额
        - 大盘降温时，Dhan 仍在提升 NSE 活跃客户份额。
        - 如果大型同业吸走大部分零售流量，或产品扩张停滞，小份额券商仍可能撞到天花板。
        - 再连续两个季度份额提升，同时变现更健康。
      - - 多元化
        - Millions、保险、Stratzy、MTF 和 API 显示出更广生态野心。
        - 公开来源尚未量化这些相邻业务贡献多少非经纪收入或利润。
        - 经纪、融资、SIP 和保险经济性的分部级披露。
      - - 披露质量
        - 公开信息足以让人认真跟踪公司。
        - 但公开信息不足以让人为市场实际上还没拿到的确定性支付溢价。
        - 董事会、治理、投诉和股权结构披露更接近公开同业标准。
    notes: 反论点由披露和监管驱动，并不是否认 Dhan 已经具备真实规模。
