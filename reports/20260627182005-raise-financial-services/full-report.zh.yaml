        - 用 ₹904.9 crore NOI / 17 lakh 活跃客户计算
        - 可作为变现密度的粗略代理
        - 按活跃客户类型提供分群收入
      - - 单活跃客户 PAT
        - ~₹1,916
        - 用 ₹325.8 crore PAT / 17 lakh 活跃客户计算
        - 指向活跃用户身上有较强利润提取能力
