      - - 份额提升反转
        - NSE 活跃客户份额停止上升，或回落到约 FY25 水平以下
        - 削弱 Dhan 能在更艰难市场中胜出的最清晰实时证据。
        - 下调增长假设。
      - - 结构性利润率侵蚀
        - 扩张支出正常化后，PAT 利润率仍明显低于 FY26 水平
        - 说明上一轮可能高估了正常化盈利能力。
        - 从合理转向偏高或昂贵。
      - - 多元化仍不透明
        - 到下一次融资检查点，MTF、Millions、保险或算法仍没有分部披露
        - 生态叙事在经济性上仍未证实，而不只是产品数量问题。
        - 不要仅凭邻近业务故事上调判断。
