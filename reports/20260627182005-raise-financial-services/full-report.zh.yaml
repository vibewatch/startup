        title: 仍支撑公平判断的因素
        blocks:
          - type: paragraph
            body: >-
              硬经营证据足够多，能把上一轮估值留在公平区间内。Raise Securities 在 FY26 仍产生 36% 利润率，净资产升至约 Rs 916 crore，总资产达到约 Rs 3,375
              crore。客户证据方向上也积极：Indian Startup News 引述约 1.2 crore 客户、截至 2026 年 3 月约 17 lakh 活跃客户；CNBC-TV18
              则显示，在更广义活跃客户基数走弱时，Dhan 的 NSE 活跃客户份额从 1.98% 升至
              2.27%。这很重要，因为私营券商若能在更艰难行情中拿份额，而不只是顺牛市增长，就应获得更多信用。市场结构仍有帮助。Mordor 的行业解读指向数字优先市场：零售投资者已占主导，线上渠道持有多数份额，超过 95%
              新开户来自移动 App。Dhan 自身定价也不依赖溢价收费：它采用零交割佣金和 Rs 20 或 0.03% 执行定价，大体匹配同业折扣券商结构。这意味着故事的乐观部分必须来自执行、产品速度，以及
              MTF、Millions、保险和 Stratzy 等邻近变现，而不是隐藏的定价护城河。
