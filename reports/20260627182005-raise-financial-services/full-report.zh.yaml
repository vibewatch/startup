  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 多界面产品栈和工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              Dhan 应被理解为一个产品家族，而不是单一券商 App。官方界面现在覆盖核心 Dhan 移动 App、大屏交易的 Dhan Web、面向 F&O 重度工作流的 Options Trader App
              和网页端、基于 TradingView 的图表执行、DEXT T3 桌面终端，以及用于可编程交易和数据接入的
              DhanHQ。这套栈不是装饰：当前应用商店文案和期权页面反复强调，一个账户可以在自选列表、订单、组合、交易簿、图表和资金之间流转，不需要换券商或创建特定产品身份。工作流也越过了简单执行。MTF 和 Margin
              Pledge Benefit
              不是边缘优惠，而是嵌入式资本产品，让用户能放大仓位、为期权活动提供资金，并在同一生态内打通持仓、抵押品和交易下单。结果是更宽的客户工作流：从发现或图表开始，进入执行，再延伸到资本管理和交易后监控；这比许多印度零售券商仍强调的低成本券商框架更宽。
