        - 定价看起来有竞争力；优势必须来自产品组合和交易者留存
      - - Zerodha
        - ₹0 交割经纪费
        - 日内 ₹20 或 0.03%；期权固定 ₹20
        - 定价页没有详细展开 MTF 细节，但有可选付费产品
        - Dhan 的定价与最大折扣券商标杆基本持平
      - - Upstox
        - 交割成交订单 ₹20
        - 日内 ₹20，或期权固定 ₹20
        - 每个 ₹40,000 MTF 档位每天 ₹20；MTF 最高 4x
        - 同业也靠资金业务变现，不只是经纪费
      - - Groww
        - 成交订单 ₹20 或 0.1%
        - 固定费用折扣模式
        - 年化 14.95% MTF 利息，另收 0.1% MTF 经纪费
        - 即便前端定价感觉相近，资金业务经济性仍可能不同
