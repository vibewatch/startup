  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管悬顶和盈利集中度
        blocks:
          - type: paragraph
            body: >-
              Raise / Dhan 面对的不是泛化券商风险栈，而是非常具体的集中度问题。公开 FY26 记录显示，约 70% 净营业收入仍来自零售 F&O，约 79%
              来自整体证券经纪，因此面临最强政策收紧的细分，仍是主要盈利引擎。这种集中度已经反映在 FY26 业绩中：净营业收入增长到约 Rs 905 crore，但 SEBI 衍生品收紧和更重扩张开支打击盈利，PAT
              仍下降约 20% 至约 Rs 326 crore。ICRA 的行业传导也明确不利于指数期权暴露较高的折扣券商，FY2026 行业 NOI 可能下降 5-10%，利润率最多压缩 500
              bps。监管边界本身清楚，当前也合规；但风险不是今天能否保住牌照，而是收入多元化能否跑赢下一轮衍生品成交量压力。
