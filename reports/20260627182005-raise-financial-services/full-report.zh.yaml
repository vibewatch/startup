      - number: '2.4'
        title: 增长驱动、约束和估值相关性
        blocks:
          - type: paragraph
            body: >-
              印度零售市场扩张显然是结构性的：demat 账户远高于疫情前，国内持有比例加深，监管机构和市场基础设施机构也让参与更容易、更可见。但这不保证券商变现。ICRA 预计 FY2026 行业 NOI 下降
              5-10%，利润率最多收缩 500 个基点，因为周度期权热潮正被监管有意降温。CNBC 已显示 FY26 活跃客户池缩小，Outlook 则凸显更深的行为风险：88% 零售 F&O
              交易者平均亏钱，这会给最可变现人群带来流失、审查和产品适配性问题。价格压缩进一步加重压力，因为替代品已经把免费开户和低固定佣金常态化。因此，Dhan 的可投资问题比宏观 TAM
              故事更窄：活跃交易者工具、融资工作流和合规信任，能否在不过度依赖单一波动细分的情况下持续拿份额。公开来源仍没有充分披露分部收入结构或 cohort 质量，无法高精度支撑这一结论。
