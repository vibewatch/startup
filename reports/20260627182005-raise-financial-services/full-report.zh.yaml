        - 固定费率折扣券商定价，以及公开 IR / 年报界面
        - 另一个印度折扣券商参照，披露更接近公开市场公司
        - 折扣券商定价已经商品化，Dhan 的溢价不应来自这里。
        - 已抓取的 IR 页面对当年财务可见度较弱。
