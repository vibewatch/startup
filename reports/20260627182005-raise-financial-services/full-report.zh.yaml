      - number: '4.3'
        title: 多元化、利润率压力和披露缺口
        blocks:
          - type: paragraph
            body: >-
              FY26 最重要的张力在于，Raise 已盈利、资本也充足，但把多元化转化为已披露收入质量仍处早期。管理层和第三方报道都指向更重的营销、团队扩张、AI
              和生态建设、保险经纪扩张，以及全渠道分发投入；这些成本增长似乎是 NOI 上升但 PAT 下滑的直接原因。GreenLife 收购增强了战略故事，因为它带来一个受监管保险平台、25 人团队、50
              多城足迹，以及所称 $15 million 后续投资计划。未来变现确实因此扩展到交易之外，但公开文件尚未量化邻近业务贡献多少收入、整合成本如何、保险建设多久回本。同业披露在这里形成最鲜明对比。5paisa 的公开
              IR 页面让季度材料和年报容易获取，而 Raise/Dhan 的公开记录仍集中在精选新闻摘要、定价页和运营政策披露。因此，可以给出财务判断，但边界明确：Dhan
              已证明规模、当前盈利健康，并在扩展资本市场邻近业务；不过，承销案例仍受缺失的分部抽佣率、CAC
              和回本、资金成本以及发展空间测算限制。这个故事值得投资者持续跟踪，但披露还不足以支撑一份干净的单位经济性驱动承销结论。
