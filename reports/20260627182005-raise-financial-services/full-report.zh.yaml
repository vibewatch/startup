              第三个风险块是外部依赖及其声誉外溢。Dhan 依赖 SEBI 政策、NSE/BSE/MCX 交易场所、CDSL 和 NSDL 存管管线、BSE StarMF 执行轨、银行和支付系统，以及它无法控制的移动 App
              分发渠道。市场研究直接标出这一类别：Mordor 将交易所基础设施集中和网络韧性缺口列为结构性券商风险；SEBI
              自身公开页面也显示，受监管实体的网络安全和云韧性要求仍在演进。公开声誉证据也不是干净正面，而是混合。CNBC 称 Dhan 在收缩的 FY26 市场中继续提升活跃客户份额，这是积极信号；但 Chittorgarh
              有外部投诉跟踪，缓存的 Apple 评分样本又太薄，无法排除客户摩擦风险。重要的是，缓存的官方材料披露了大量客户提醒、质押 OTP 和清算机制，但对外部网络安全保证、事件历史或投诉解决比例披露少得多。
