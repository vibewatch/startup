  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 公开证据
      - FY26 相关性
      - 收入质量
      - 尽调问题
    rows:
      - - 零售 F&O 经纪
        - 高频期权和期货活动上的固定费率订单经济性
        - 官方定价显示期权经纪费 ₹20；FY26 报道称零售 F&O 约占 NOI 的 70%
        - 主导
        - 交易量高，但周期性强且对监管敏感
        - 提供每笔期权订单的实际抽成率，以及按分部划分的头部客户集中度
      - - 现金 / 日内经纪
        - 各分部已执行日内类交易按 ₹20 或 0.03% 收费
        - 官方费率列出固定折扣定价
        - 重要但次于 F&O
        - 比 F&O 更干净，但仍与交易活跃度绑定
        - 披露按分部划分的实际经纪收益率，以及活跃客群流失
      - - 股票交割
        - 零佣金获客和留存产品
        - 官方定价称交割经纪费为 ₹0
        - 对获客有用，不是标题变现
        - 直接变现低；价值在交叉销售和互动
        - 展示交割转 MTF 或交割转衍生品的转化率
      - - MTF 利息收入
        - 对融资持仓收取利息
        - 官方 MTF 页面列出 12.49% 至 15.49% 利率，FY26 MTF 账簿达到 ₹505 crore
        - 快速增长
        - 可能具备吸引力，但对资产负债表和资金成本敏感
        - 披露资金成本、NIM、不同年份亏损，以及贷款方 / 授信结构
      - - 附属运营费用
        - 自动平仓、电话交易、借方利息、CUSPA 及相关处理费
        - 官方费率和风险政策披露这些收费和控制
        - 增量
        - 是有用的变现补充，但大概率不驱动投资论点
        - 量化附属运营费用占收入的比例
      - - 直接共同基金 / Millions
        - 订单集合和低成本投资界面，可能用于留存和钱包份额
        - 监管页称 Dhan 不是 MF 分销商或代理，定价页称 MF 投资免费
        - 战略性，尚未显性变现
        - 有利于互动，但当前收入质量未证实
        - 解释变现是否来自浮存、执行基础设施或后续交叉销售
      - - 保险和其他相邻业务
        - GreenLife 主导的分销和交易之外的生态扩张
