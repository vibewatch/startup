    rows:
      - - Series B 条款
        - 股权结构表、清算优先权、任何棘轮条款，以及老股 / 新股拆分
        - 上一轮是锚定价格，隐藏条款会实质改变有效进入经济性。
        - 向管理层或领投方索取条款清单摘要。
      - - 分部收入结构
        - 经纪、MTF / 融资、Millions / SIP、保险和算法产品的收入及贡献利润率
        - 核心争论在于，多元化是否已有真实经济性，还是仍主要停留在叙事。
        - 要求提供 FY26 和 FY27 YTD 分部资料包。
      - - 客户质量与投诉
        - 按客户分组列示的投诉数量、解决时长、流失率和活跃客户留存
        - 买入判断需要比登记介绍页更干净的服务质量证据。
        - 要求导出交易所投诉看板，并提供内部留存客户分组数据。
      - - MTF 信用品质
        - Rs 505 crore 账簿的资金成本、逾期或强平历史，以及损失经验
        - 类信贷可选性只有在风险受控时才会增厚价值。
        - 要求提供 MTF 风险复盘和贷款额度细节。
      - - 退出准备度
        - 董事会构成、治理节奏、审计颗粒度和融资时间表
        - 同业披露深度仍是判断维持在跟踪的关键原因。
        - 要求提供董事会材料、治理备忘录和融资路线图。
    notes: 这些证据项最可能改变判断；没有一项只是形式性要求。
    claimRefs:
      - CV004
      - CV035
      - CV038
      - CV039
      - CV044
      - CV056
      - CV058
