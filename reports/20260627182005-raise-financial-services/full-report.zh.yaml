      - number: '8.3'
        title: 为什么判断不上调到买入
        blocks:
          - type: paragraph
            body: >-
              反论点主要关乎集中度和披露，而不是业务是否存在。公开报道称，FY26 收入约 79% 仍来自经纪，约 70% 仅来自零售 F&O；Pravin Jadhav 也承认，监管变化冲击了接近 40%
              与衍生品相关的交易量或收入线。ICRA 随后补充行业背景：打击后的重置传导时，FY2026 行业 NOI 可能下降 5-10%，利润率最多收缩 500 个基点。Outlook Business 引用 SEBI
              数据进一步强化负面角度：88% 零售 F&O 交易者平均亏钱，这让进一步政策收紧始终是现实风险。另一个阻塞点是承销透明度。Dhan 仍是私营公司，投资者拿不到 Robinhood 式申报节奏、具名 IR
              基础设施，或上市同业在董事会治理、分部披露和融资条款上的深度。即使投诉页面，在本材料包中也只部分可见：Chittorgarh 清楚显示 Raise Securities
              存在交易所报告申诉跟踪，但本次抓取没有提供完全可用的投诉计数序列。因此，公司值得投资者观察，但还不值得在任何价格上追逐。
