      - number: '3.2'
        title: 产品和能力定位
        blocks:
          - type: paragraph
            body: >-
              Dhan 显得不寻常的地方，是它试图把活跃交易者工作流尽可能留在一个账户里。本章审阅的官方页面显示，它拥有移动 App、完整网页平台、专门的期权 App 和网页产品、直接联动 TradingView
              的执行、DEXT T3 桌面终端、MTF 和质押保证金工具，以及带免费 API 和一方 MCP 服务器的 DhanHQ 开发者文档。在保留的公开证据中，这套界面栈比 Groww 的大众投资姿态或 Upstox
              更偏定价与合规的呈现更密。5paisa 是该保留集合中最接近的功能竞争者，因为其首页也强调 FnO 360、实时 greeks、策略图表和免费 API。因此，交易者不选 Dhan
              时的现实替代品，不是某个完美竞争对手；要么是更大的通用型低成本券商，要么是拼接式工作流，图表、策略和执行分散在不同界面，而非集中在一个垂直整合的交易者账户里。
