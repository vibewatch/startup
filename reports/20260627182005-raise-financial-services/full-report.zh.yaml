  - id: TI006
    title: 公开财务缺口表
    columns:
      - 缺失指标或文件
      - 重要性
      - 公开文件改用什么展示
      - 精确尽调路径
      - 严重性
    rows:
      - - 分部收入拆分
        - 必须拆开经纪、资金业务和相邻业务质量
        - 只有高层级 NOI 和利润标题
        - 要求按经纪、利息、分销和其他费用提供 FY26 收入桥表
        - 重大
      - - CAC 和回收期
        - 要判断市场降温后增长是否仍有效率
        - 只有快速开户和客户增长说法
        - 要求获客渠道组合、分渠道 CAC 和分群回收期
        - 重大
      - - MTF 资金成本
        - 承销净息差经济性和风险调整回报所必需
        - 有公开 MTF 利率和账簿规模，但没有资金组合或利差
        - 要求贷款方名单、平均借款成本、期限和 NIM
        - 重大
      - - 现金流量表 / burn 视图
        - 判断现金跑道和下一轮融资依赖所必需
        - 只有流动性快照和资产负债表标题
        - 要求经审计的 FY26 现金流量表、月度现金消耗和 FY27 预测
        - 重大
      - - 保险收购经济性
        - 评估多元化 ROIC 所必需
        - 只有收购结构、团队规模和计划投资
        - 要求收购价格、整合预算、目标保费和回收期
        - 重大
      - - 相邻业务收入贡献
        - 检验多元化是否已经具备财务意义
        - 对 Millions、AI 和保险扩张的叙事
        - 要求按相邻业务提供 FY26 和 FY27 收入贡献
        - 重大
      - - Dhan 单体员工数和 Opex 拆分
        - 对标经纪业务本身的经营杠杆所必需
        - 只有集团和公司关于团队扩张的评论
        - 要求 Dhan 单体员工数、薪酬账单和支持成本拆分
        - 次要
      - - 客户分群变现
        - 判断活跃交易者、投资者和 MTF 用户的变现是否不同
        - 只有客户数和活跃客户标题
        - 要求按客户类型提供 cohort 收入和盈利能力
        - 重大
    notes: 因为这些缺口，本章对当前盈利能力和战略方向的判断，明显比对未来单位经济性的判断更有把握。
    claimRefs:
      - CI038
      - CI047
      - CI048
      - CI049
      - CI052
      - CI053
      - CI054
  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 界面
      - 主要用户
      - 状态 / 成熟度
      - 差异化
      - 尽调缺口
    rows:
      - - Dhan App
        - 零售投资者和交易者
        - 成熟核心界面
        - 一个账户、一个 App 覆盖股票、共同基金、ETF、IPO 和 F&O
        - 没有公开的分模块使用拆分
      - - Dhan Web
        - 大屏活跃交易者
        - 成熟配套界面
        - 覆盖全分部的网页交易，并用分步指引带动开户
        - 没有单独针对网页端的公开延迟或可用性拆分
      - - Options Trader App
        - 移动端 F&O 交易者
        - 成熟专业模块
        - 10+ 预置策略、Basket 和 Forever Orders，以及即时保证金框架
        - 没有公开胜率或策略使用分布
      - - Options Trader Web
        - 桌面端 F&O 交易者
        - 功能深度清晰的增长模块
        - 自定义策略构建器、筛选器和扫描器、期权想法，以及跨界面状态同步
        - 没有按功能拆分的公开使用或转化数据
      - - TradingView 界面
        - 图表优先的自主交易者
        - 成熟集成层
        - 图表内原生下单，配 AVWAP、20+ 布局、拖拽订单和原生控制台
        - 对外部图表伙伴体验的依赖没有公开量化
      - - DEXT T3
        - 重度交易者和桌面优先用户
        - 已上线，但仍在向成熟收敛
        - 25+ 小组件、可定制工作区，以及 Position Analyzer 等新工具
        - Beta 驱动的待办积压，以及缺少自动化或第三方集成，仍然可见
      - - MTF 与质押层
        - 杠杆交易者和抵押用户
        - 成熟变现或资本层
        - 同一账户内嵌杠杆、质押流程和期权保证金释放
        - 公开证据没有展示违约、强平或按产品划分的盈利组合
      - - DhanHQ APIs 与 MCP
        - 算法交易者、开发者、智能体构建者
        - 战略增长层
        - 免费交易 API、MCP 服务器、云端运行时、期权链和深度行情工具
        - 没有公开 SLA、请求量和端点可靠性历史
    notes: 行项目把用户界面、内嵌资本产品和开发者工具拆开，因为 Dhan 越来越像一套平台栈，而不只是一个券商前端。
