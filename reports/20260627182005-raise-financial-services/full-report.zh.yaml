        - 公开年报和合规界面，加上市场标准零售收费
        - 对标上市同业披露深度和定价平价
        - 印度上市同业披露远多于 Dhan，同时仍在类似零售定价上竞争。
        - 该来源包没有呈现当前 Angel One 财务线。
