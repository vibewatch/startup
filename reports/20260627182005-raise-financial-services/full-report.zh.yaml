      - number: '2.3'
        title: 买方分层和采用路径
        blocks:
          - type: paragraph
            body: >-
              Dhan 的获客动作本质上是自助式。同一个人通常同时是买方、用户和付款方；官方开户流程也显示一个简单漏斗：验证手机和邮箱、上传 KYC
              材料、电子签名，然后入金并开始交易。这种简单不是表面细节，而是市场驱动因素的一部分。第三方报道把印度 2020 年后的零售浪潮与零佣金、移动优先体验和更快 KYC 联系起来；Dhan
              自身页面也说明，它的目标不止新手投资者，而是更高参与度人群。App
              和网页页欢迎交易者和投资者，但更密集的产品价值落在活跃用户身上：他们需要图表联动执行、期权工作流、质押支持的资本效率、保证金融资，以及终端式桌面定制。长期投资者仍可用平台做交割、ETF
              和共同基金，但公开证据显示，Dhan 最强适配和可能最高变现，落在期权、日内、波段和多界面重度用户，而不是被动持有账户。
