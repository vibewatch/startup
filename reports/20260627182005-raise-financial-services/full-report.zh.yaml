      - - 单活跃客户 MTF 账簿
        - ~₹2,971
        - 用 ₹505 crore MTF 账簿 / 17 lakh 活跃客户计算
        - 说明经纪基础之上正在长出资金业务层
        - 披露融资客户数和平均票面规模
      - - 客户活跃率
        - ~14.2%
        - 17 lakh 活跃客户 / 1.2 crore 客户基础
        - 凸显留存和再激活的重要性，不只是总注册数
        - 提供月活、季活和净再激活数据
      - - 集团收入背景
        - '>₹1,000 crore'
        - Moneycontrol 的集团层面收入标题
        - 显示生态扩张在集团层面已经相关
        - 拆出非经纪收入占比
    notes: 计算项是用 FY26 标题数字和活跃客户数做出的粗略公开市场代理，不是管理层披露的单位经济性。
