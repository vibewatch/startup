            body: >-
              产品界面暗示了一条分层但连通的客户旅程。官方页面同时面向交易者和投资者定位 Dhan，然后把更重度人群导向 Options Trader、TradingView 执行、DEXT T3、DhanHQ API、MTF
              和保证金质押等专门界面。最强的公开证明不是具名企业客户名单，而是市场和社区证据：真实零售用户已经在平台上，并与新版本互动。Google Play 和 Apple App Store 都重复 1 Mn+
              用户口径；MadeForTrade 社区则显示，部分 beta
              用户申请访问、发布具体功能反馈，并详细讨论执行工具。这使客户证明最强地落在活跃自主用户上，对被动投资者较弱，对按细分变现仍披露不足。官方栈还表明，客户行为预期会在首次使用后逐级上移：开户、多平台激活、专业工作流，然后进入更高钱包份额产品。仍缺失的是量化桥梁：多少
              App 安装者变成入金用户，多少入金用户变成活跃客户，其中又有多少最终采用 API、杠杆或投资邻近业务。
