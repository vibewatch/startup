      - number: '3.3'
        title: 定价、打包和切换力
        blocks:
          - type: paragraph
            body: >-
              Dhan 的公开定价有竞争力，但并不独一无二。最强的平价对手是 Zerodha：双方都宣传 ₹0 股票交割佣金，以及 ₹20 或 0.03% 的日内交易锚点，这限制了 Dhan
              声称纯费用优势的空间。Upstox、Groww 和 5paisa 在保留的公开价目表中更直接地从零售订单变现，但它们仍把头条订单费用压得足够接近，防止 Dhan 打开宽价格伞。Dhan
              转而试图靠打包抵消这种平价：一个免费 demat 账户、多界面接入、MTF、质押权益、TradingView 联动流程和
              DhanHQ。这些功能确实降低了活跃交易者的切换摩擦，尤其是那些想在一个登录里完成图表、期权和 API 的用户。即便如此，价格加工具只有在目标人群更看重工作流密度、而不是单纯安装基数信任时才有意义。Groww 和
              Zerodha 仍能带来巨大的漏斗顶部触达；Upstox 和 5paisa 也凭简单价格锚点加足够交易功能，阻止 Dhan 完全占住低成本叙事。
