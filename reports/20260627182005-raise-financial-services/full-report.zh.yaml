  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Dhan 方案
      - 可衡量收益
      - 限制
    rows:
      - - 用一个零售账户交易和投资
        - 在不同投资 App、交易 App 或券商之间切换
        - 同一账户下的 Dhan App 加 Dhan Web
        - 官方界面宣传一个账户覆盖股票、ETF、共同基金、IPO 和 F&O
        - 收益来自产品宣称；没有公开的分界面参与度拆分
      - - 快速执行期权策略
        - 手动计算行权价和 Greeks，再分别路由订单
        - Options Trader App 和 Web，加策略工具
        - 10+ 预置策略和单端点期权链数据降低手工配置成本
        - 没有公开生产力基准可对比其他 F&O 终端
      - - 直接从图表交易
        - 在一个工具分析，再到另一个工具下单
        - Dhan 上的 TradingView
        - 用 AVWAP、篮子订单和拖拽价位从图表下单
        - 体验继承第三方图表依赖和伙伴界面风险
      - - 管理重桌面交易流程
        - 使用通用券商桌面端或多个浏览器标签页
        - DEXT T3 终端
        - 自定义工作区、25+ 小组件和 Position Analyzer 把更多工作流留在一个终端
        - 自动化、自定义提醒和第三方集成目前明确缺失
      - - 用抵押品提高购买力
        - 手动转钱或卖出持仓来腾出交易容量
        - MTF 加 Margin Pledge Benefit
        - 最高 ₹5 crore MTF，以及 1,450+ 证券即时质押或解押，提升资本效率
        - 强平逻辑和利率档位带来真实杠杆风险
      - - 搭建系统化或智能体驱动的交易工作流
        - 维护服务器、手工接入数据源，并单独管理券商集成
        - DhanHQ APIs、MCP 服务器和云端运行时
        - 免费交易 API、定时运行、全深度或期权链数据源降低搭建阻力
        - 没有披露公开可靠性、交易量和企业采用数据
    notes: 本表强调具体用户任务，因此评估的是 Dhan 的工作流覆盖，而不是松散罗列界面名称。
