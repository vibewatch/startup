      - number: '4.2'
        title: 资产负债表实力和资本强度
        blocks:
          - type: paragraph
            body: >-
              FY26 证据显示，资产负债表强度明显高于零佣金营销标题所暗示的水平。Raise Securities 年末净资产为 ₹916.1 crore，总资产为 ₹3,374.8
              crore；可见流动性包括未受限现金、流动投资和未使用授信，合计约 ₹218 crore。看起来健康，但同一份文件也说明了为什么资本纪律重要。MTF 账本再次翻倍至 ₹505 crore；行业 MTF
              余额即便回落后仍高于 ₹80,000 crore；Dhan
              自身风险政策也保留在保证金恶化时平仓、质押或清算客户仓位的广泛权利。换句话说，这家券商不只是低成本订单路由器；它还运营一个不断增长、由资产负债表支撑的融资产品，带来营运资本和风险管理义务。所给材料中最接近的有用公开类比是
              Zerodha Capital 年报。它显示，印度资本市场栈中的放贷子公司会明确管理 CRAR、准备金转移，甚至董事提供的借款额度。这不意味着 Dhan
              经济性完全相同，但提醒我们：融资驱动变现需要真实资本缓冲和资金管线。积极解读是，Raise 进入 FY26 时基础扎实。谨慎点在于，公开来源仍没有显示 MTF 驱动模式下的资金成本、借款组合或现金流转化。
