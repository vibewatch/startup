  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局和份额结构
        blocks:
          - type: paragraph
            body: >-
              Dhan 竞争于印度折扣券商集群之内，但市场边界宽于五个 App 图标。直接同业是主要低成本零售券商，它们主打数字开户、多资产投资和 App 驱动交易：Zerodha、Groww、Upstox、Angel One
              和 5paisa。现有或默认替代方案仍是通用型或银行关联券商关系；CNBC 的 FY26 摘要显示，即便整体活跃客户池收缩，ICICI Securities、SBI Securities
              等传统券商仍在增份额，因此这种替代仍有相关性。规模差距是承销判断的核心。CNBC 报告 FY26 市占率：Groww 28.31%、Zerodha 15.08%、Angel One 14.79%、Upstox
              4.35%、Dhan 仅 2.27%；ETBFSI 则显示，到 2024 年 6 月，前五大折扣券商已控制 64.4% 活跃客户。这意味着 Dhan
              不是在碎片化长尾中竞争，而是在集中品类中竞争；更大对手已经占住分发和品牌记忆。
