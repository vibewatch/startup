      - number: '3.4'
        title: 护城河耐久度和竞争风险
        blocks:
          - type: paragraph
            body: >-
              核心竞争问题是，Dhan 的功能密度会变成可持续护城河，还是只是一份暂时差异化的宣传册。乐观版本很清楚：Dhan 持续推出面向交易者的产品，比最大通用型券商更积极地打包专门期权和 TradingView
              工作流，并且在 FY26 市场收缩期间仍把份额从 1.98% 提升至 2.27%。悲观版本同样清楚。定价可复制，大量工具可被融资充足的对手模仿；按活跃客户规模，Dhan 仍远小于 Groww、Zerodha 和
              Angel One。它的差异化也偏向活跃 F&O 和高参与度交易行为，而这正是监管和流失已经收紧品类增长的区域。信任基准也没有完全闭合：Dhan
              有投诉监测页面，但保留抓取没有保存同业比较所需的计数。因此，承销判断应把 Dhan 的护城河视为由产品节奏驱动、真实存在，但取决于持续执行，而不是结构性成本或分发锁定。
