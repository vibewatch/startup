      "id": "customer-base-and-scale-lenses",
      "title": "Customer Base and Scale Lenses",
      "body": "Dhan is selling primarily to self-directed Indian retail market participants, but the public record shows that its customer base is broader than a single 'trader app' label suggests. Independent FY26 coverage anchors the clearest scale fact: Raise Securities had about 17 lakh active clients as of 31 March 2026, enough for roughly 2.3% share of NSE active clients and a #9 market position. Around that anchor sit several other metrics that matter, but should not be conflated with it. Moneycontrol reports about 10.5 lakh active investors, the JFM26 community recap says nearly 1 million active users, the app stores say 1 Mn+ users, and Dhan's own pricing page says 1 Cr+ downloads. Those figures together support meaningful retail adoption, but each describes a different point in the funnel rather than one consistent denominator.",
