    {
      "id": "durability-service-and-satisfaction-proxies",
      "title": "Durability, Service, and Satisfaction Proxies",
      "body": "Public durability evidence is materially weaker than adoption evidence. There is no disclosed NRR, GRR, churn, or cohort-retention series in the sources reviewed, so the chapter has to rely on service-quality and complaint proxies instead. Dhan's investor charter promises immediate order execution, contract notes within 24 hours, and onboarding that is immediate but not later than one week, while the grievance page provides a four-step escalation path from customer support to compliance, founders office, and finally SCORES. Chittorgarh's complaint data provides a useful but imperfect proxy: FY26 NSE complaints were 121 against 979,483 clients, down from 377 against 971,760 in FY25 on the same page's methodology. AWS adds another support signal by claiming the newer chatbot resolves at least 60% of customer questions versus 33% for the previous solution.",
