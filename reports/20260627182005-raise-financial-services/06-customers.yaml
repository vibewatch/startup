    {
      "id": "adoption-proof-and-segment-behavior",
      "title": "Adoption Proof and Segment Behavior",
      "body": "The product surfaces imply a segmented but connected customer journey. Official pages position Dhan for both traders and investors, then route heavier-use cohorts into specialized interfaces such as Options Trader, TradingView execution, DEXT T3, DhanHQ APIs, MTF, and margin pledge. The strongest public proof is not a named enterprise customer roster; it is marketplace and community evidence that real retail users are already on the platform and interacting with new releases. Google Play and the Apple App Store both repeat the 1 Mn+ user framing, while the MadeForTrade community shows select beta users requesting access, posting concrete feature feedback, and discussing execution tools in detail. That makes customer proof strongest for active self-directed users, weaker for passive investors, and still under-disclosed for monetization by sub-segment. The official stack also makes it clear that customer behavior is expected to ladder upward after first use: account opening, multi-platform activation, specialist workflows, then higher-wallet-share products. What remains missing is the quantified bridge showing how many app installers become funded users, how many funded users become active clients, and how many of those eventually adopt API, leverage, or investing adjacencies.",
