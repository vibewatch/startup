    {
      "id": "expansion-loops-and-concentration-risk",
      "title": "Expansion Loops and Concentration Risk",
      "body": "Customer concentration risk looks low at the individual-account level because Dhan is a mass-retail broker, but segment concentration risk still matters. Moneycontrol says about 70% of revenue comes from F&O, so today's economics remain tied to active trading intensity even as management expands into mutual funds, SIPs, insurance distribution, AI tools, and offline presence. Official product pages and community posts show credible cross-sell routes into APIs, options tooling, MTF, and pledge products, which can deepen wallet share for existing users. The strategic upside is that India still has a wide retail runway, especially across tier 1, 2, and 3 markets. The caution is that public sources still do not disclose attach rates, CAC by segment, or retention by platform, so the breadth story is clear while the durability of expansion remains only partly proven. Another subtle risk is service-model fit: Dhan's own pricing disclosures say it is a fully digital provider and that offline or physical requests may take longer and cost more. That is fine for digitally native traders, but it can slow adoption for cohorts that want branch-led handholding, relationship coverage, or paperwork-heavy servicing.",
