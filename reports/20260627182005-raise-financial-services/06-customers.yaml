    "title": "Customers",
    "summary": "Dhan's customer proof is strongest on retail scale, platform breadth, and community activity rather than on enterprise-style retention disclosure. ICRA-based FY26 coverage supports about 17 lakh active clients, roughly 2.3% NSE active-client share, and a #9 position as of March 2026, while Moneycontrol, app-store listings, and Dhan's own surfaces point to other large but different lenses such as 10.5 lakh active investors, nearly 1 million active users, and 1 Cr+ downloads. The biggest open gaps are retention cohorts, acquisition-efficiency data, and exact attach rates across Dhan's expanding app, API, and credit-product surfaces."
