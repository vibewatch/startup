- id: balance-sheet-and-capital-intensity
  title: Balance-sheet strength and capital intensity
  body: FY26 evidence shows a materially stronger balance sheet than the zero-brokerage marketing headline implies. Raise Securities ended the year with net worth of ₹916.1 crore, total assets of ₹3,374.8 crore, and visible liquidity consisting of unencumbered cash, liquid investments, and unused lines that together amount to about ₹218 crore. That looks healthy, but the same file also shows why capital discipline matters. The MTF book doubled again to ₹505 crore, industry MTF balances remained above ₹80,000 crore even after moderation, and Dhan’s own risk policy reserves broad rights to square off, pledge, or liquidate client positions when margins deteriorate. In other words, the broker is not just a low-cost order router; it also runs a growing balance-sheet-supported funding product that brings working-capital and risk-management obligations. The closest useful public analogue in the supplied pack is Zerodha Capital’s annual report. It shows how a lending subsidiary in the Indian capital-markets
    stack explicitly manages CRAR, reserve transfers, and even director-provided borrowing lines. That does not mean Dhan’s economics are identical, but it is a useful reminder that financing-led monetization requires real capital buffers and funding plumbing. The positive read is that Raise entered FY26 from a position of strength. The caution is that public sources still do not show cost of funds, borrowing mix, or cash-flow conversion for the MTF-led model.
