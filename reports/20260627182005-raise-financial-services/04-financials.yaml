- id: TI002
  title: Pricing / monetization comparison
  columns:
  - Broker
  - Delivery pricing
  - Intraday / options headline
  - MTF monetization signal
  - Implication
  rows:
  - - Dhan
    - ₹0 delivery brokerage
    - ₹20 or 0.03% intraday; flat ₹20 options
    - 12.49% to 15.49% MTF interest; up to ₹5 crore funded amount
    - Looks competitively priced; edge must come from product mix and trader retention
  - - Zerodha
    - ₹0 delivery brokerage
    - ₹20 or 0.03% intraday; flat ₹20 options
    - No heavy MTF detail on pricing page, but optional paid products exist
    - Dhan is priced at parity with the largest discount-broker benchmark
  - - Upstox
    - ₹20 delivery executed order
    - ₹20 intraday or flat ₹20 options
    - ₹20 per day for each ₹40,000 MTF slab; up to 4x MTF
    - Peer set also leans on funding monetization, not just brokerage
  - - Groww
    - ₹20 or 0.1% executed order
    - Flat-fee discount model
    - 14.95% annual MTF interest plus 0.1% MTF brokerage
    - Funding economics can differ even when front-end pricing feels similar
  - - 5paisa
    - Flat-fee discount model with separate AMC
    - Flat ₹20 per executed order
    - Pricing page emphasizes account economics alongside trading fees
    - Total account economics vary across peers even when trading fees converge
  notes: Peer data reflects public list pricing only. Realized brokerage, rebate structures, and customer-mix effects are not disclosed in these pages.
