tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public evidence
  - FY26 relevance
  - Revenue quality
  - Diligence ask
  rows:
  - - Retail F&O brokerage
    - Flat-fee order economics on high-frequency options and futures activity
    - Official pricing shows ₹20 option brokerage; FY26 coverage says retail F&O was ~70% of NOI
    - Dominant
    - High volume but highly cyclical and regulation-sensitive
    - Provide realized take rate per option order and top-customer concentration by segment
  - - Cash / intraday brokerage
    - ₹20 or 0.03% on executed intraday-style trades across segments
    - Official tariff lists flat discount pricing
    - Material but secondary to F&O
    - Cleaner than F&O, but still activity-linked
    - Disclose segment-wise realized brokerage yield and churn by active cohort
  - - Equity delivery
    - Zero-brokerage acquisition and retention product
    - Official pricing says delivery brokerage is ₹0
    - Useful for acquisition, not headline monetization
    - Low direct monetization; value is cross-sell and engagement
    - Show delivery-to-MTF or delivery-to-derivatives conversion rates
  - - MTF interest income
    - Interest charged on funded carry positions
    - Official MTF page lists 12.49% to 15.49% rates and FY26 MTF book reached ₹505 crore
    - Fast-growing
    - Potentially attractive but balance-sheet and funding-cost sensitive
    - Disclose cost of funds, NIM, vintage losses, and lender/facility mix
  - - Ancillary operational fees
    - Auto square-off, call & trade, debit interest, CUSPA and related processing fees
    - Official tariff and risk policy disclose these charges and controls
    - Incremental
    - Useful monetization support, but probably not thesis-driving
    - Quantify share of revenue from ancillary operational fees
  - - Direct mutual funds / Millions
    - Order collection and low-cost investing surface, likely retention and wallet-share tool
    - Regulatory page says Dhan is not an MF distributor or agent and pricing says MF investing is free
    - Strategic, not yet visibly monetized
    - Engagement-positive but current revenue quality unproven
    - Explain whether monetization comes from float, execution infrastructure, or later cross-sell
  - - Insurance and other adjacencies
    - GreenLife-led distribution and ecosystem expansion beyond trading
    - GreenLife acquisition plus planned $15M investment indicate forward revenue optionality
    - Early
    - Optionality is real, current contribution undisclosed
    - Provide FY27 revenue targets, integration cost, and payback expectations by adjacency
  notes: List pricing and strategic descriptions are public-source evidence only; they are not realized take rates or audited segment revenue disclosures.
