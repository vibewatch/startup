  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: segment-unit-economics
    missingEvidence: Segment revenue split, realized take rates, CAC by channel, payback by cohort, and segment gross margins.
    whyItMatters: These metrics are necessary to separate durable earnings quality from one-period trading intensity and marketing-heavy growth.
    diligencePath: Request an FY26 management bridge showing brokerage, net interest, distribution, depository, and other-fee revenue plus CAC/payback by acquisition channel.
    relatedQuestionRefs:
    - QI021
    - QI023
    relatedTableRefs:
    - TI006
  - type: private-evidence-only
    severity: material
    topic: mtf-funding-structure
    missingEvidence: Average borrowing cost, lender mix, facility tenors, NIM, and loss experience on the MTF/funding book.
    whyItMatters: Public MTF rates and book size alone are not enough to judge whether funding-led growth is capital-efficient or vulnerable to spread compression.
    diligencePath: Request the funding stack behind MTF, average cost of funds, capital allocation limits, and internal risk or loss-history data.
    relatedQuestionRefs:
    - QI019
    - QI022
    - QI025
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: material
    topic: runway-and-next-round-trigger
    missingEvidence: Audited cash-flow statement, monthly burn, FY27 opex forecast, and management’s next-round or leverage trigger.
    whyItMatters: Balance-sheet strength today does not automatically answer how aggressively the company can fund adjacencies without new capital or more borrowing.
    diligencePath: Request FY26 audited cash-flow statements, board-approved FY27 budget, and any internal financing thresholds for MTF or insurance expansion.
    relatedQuestionRefs:
    - QI023
    - QI025
    relatedTableRefs:
    - TI006
  - type: private-evidence-only
    severity: material
    topic: insurance-economics
    missingEvidence: GreenLife acquisition price, integration budget, target premiums or fee revenue, and expected payback period.
    whyItMatters: Without quantified economics, diversification is strategically appealing but still difficult to model into forecast revenue or ROIC.
    diligencePath: Request the acquisition model, FY27 revenue target, gross-margin expectations, and compliance or servicing cost assumptions for the insurance business.
    relatedQuestionRefs:
    - QI014
    - QI020
    relatedTableRefs:
    - TI005
    - TI006
  - type: stale
    severity: minor
    topic: client-metric-comparability
    missingEvidence: A reconciled definition set for total clients, active clients, app users, and downloads.
    whyItMatters: These metrics each imply different monetization potential and should not be used interchangeably in a financial model.
    diligencePath: Request a KPI dictionary with dated definitions for registered accounts, active clients, funded users, MTF users, and app-download counts.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI003
