callouts:
- calloutType: strength
  title: Still a highly profitable broker after the derivatives clampdown
  body: FY26 is notable not because Raise lost money, but because it stayed very profitable even while PAT fell 20% year on year. A roughly ₹905 crore NOI base, roughly ₹326 crore PAT, and net worth above ₹916 crore indicate that Dhan already operates at meaningful scale rather than at speculative pre-profit scale.
  claimRefs:
  - CI001
  - CI002
  - CI005
  - CI007
- calloutType: risk
  title: Core underwriting risk is still F&O concentration plus opaque funding economics
  body: The main financial risk is not insolvency today; it is concentration. Public sources still point to about 70% of NOI from retail F&O and about 79% from broking overall, while the public file still does not disclose segment take rates, cost of funds on MTF, or monthly runway math.
  claimRefs:
  - CI010
  - CI011
  - CI014
  - CI047
  - CI048
- calloutType: insight
  title: GreenLife makes diversification more credible, but not yet fully underwritable
  body: GreenLife gives Raise a regulated insurance wedge plus a stated $15 million investment plan, which is strategically meaningful. But because the public record does not disclose acquisition price, revenue targets, or integration economics, the insurance push improves optionality more than it improves immediate forecastability.
  claimRefs:
  - CI032
  - CI033
  - CI034
  - CI049
