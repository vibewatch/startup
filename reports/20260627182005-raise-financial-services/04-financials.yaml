- id: diversification-margin-pressure-and-gaps
  title: Diversification, margin pressure, and disclosure gaps
  body: 'The most important FY26 tension is that Raise is profitable and capitalized, but still early in converting diversification into disclosed revenue quality. Management and third-party coverage point to heavier spending on marketing, team expansion, AI and ecosystem buildout, insurance-broking expansion, and omnichannel distribution, and that cost growth appears to be the immediate reason PAT fell even as NOI rose. The GreenLife acquisition strengthens the strategic story because it adds a regulated insurance platform, a 25-person team, a 50-plus-city footprint, and a stated $15 million follow-on investment plan. That does broaden future monetization beyond trading, but the public file does not yet quantify how much revenue adjacencies contribute, what integration costs look like, or how quickly the insurance build will pay back. Peer disclosure is the sharpest contrast here. 5paisa’s public IR surfaces make quarterly materials and annual reports easy to access, whereas the Raise/Dhan
    public record still centers on selected news summaries, pricing pages, and operating-policy disclosures. As a result, a financial verdict is possible but bounded: Dhan has proven scale, healthy current profitability, and growing capital-market adjacency; however, the underwriting case is still constrained by missing segment take rates, CAC and payback, cost of funds, and runway math. That leaves the story investable to monitor, but not yet fully disclosed enough for a clean unit-economics-driven underwriting call.'
