company:
  name: Raise Financial Services
chapter:
  number: 4
  title: Financials
  summary: Raise Securities stayed strongly profitable in FY26, with net operating income of roughly ₹905 crore and PAT of roughly ₹326 crore, but the earnings base is still concentrated in trading activity, especially retail F&O. Public evidence shows a better-capitalized balance sheet, a fast-growing ₹505 crore MTF book, and deliberate ecosystem reinvestment into insurance and adjacent products, yet it still leaves core underwriting gaps around segment take rates, CAC, cost of funds, and runway.
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing
  body: 'The public file supports a broker-first, activity-linked revenue model rather than a subscription or advisory model. The official tariff is explicit that equity delivery is free, platform charges are zero, and core monetization sits in executed trading activity, option orders, debit-related fees, and margin funding. Third-party coverage then clarifies how that pricing converts into actual economics: securities broking was about 79% of FY26 NOI and retail F&O alone was about 70% of NOI. That combination matters because Dhan’s list pricing looks industry standard rather than premium, so the business depends on retaining active traders and sustaining order flow, not on extracting unusually high commission per trade. The strongest incremental monetization lever in the public file is MTF, where Dhan advertises a structured interest ladder and a much larger funded-position envelope. The file is also useful for what it rules out. Dhan says it does not do proprietary trading and is not
    a mutual-fund distributor or agent, which means public evidence supports brokerage, funding income, and ancillary operational fees more than hidden prop-book gains or MF trail commissions. The growth story is therefore plausible, but revenue quality remains highly sensitive to trading intensity and product mix.'
