  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: dhan-sam-som-precision
    missingEvidence: Dhan segment revenue mix, funded-account counts, active-user cohorts, and realized take rates by asset class.
    whyItMatters: Without segment economics, the chapter can only proxy Dhan's SAM from active-client market data rather than underwrite a true Dhan-specific SOM.
    diligencePath: Request management or lender-grade cohort reporting that bridges active clients to funded accounts, revenue by asset class, and retention by segment.
    relatedQuestionRefs:
    - QM023
    - QM024
    relatedTableRefs:
    - TM002
    - TM003
  - type: missing-source
    severity: material
    topic: derivatives-revenue-exposure
    missingEvidence: Dhan-specific revenue exposure to options brokerage, MTF interest, and other activity that could be hit by FY26 derivatives moderation.
    whyItMatters: ICRA gives an industry warning, but the chapter cannot quantify how hard that scenario would land on Dhan without company-specific mix data.
    diligencePath: Request FY26 product revenue mix, options share of volumes, and post-November-2024 product usage changes from management or rating materials.
    relatedQuestionRefs:
    - QM019
    - QM020
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: activation-and-retention-quality
    missingEvidence: City-tier mix, monthly active retention, funded-account activation, and long-term behavior by investor versus trader cohorts.
    whyItMatters: Headline account and user claims can materially overstate the quality of the engaged base that ultimately drives revenue and valuation.
    diligencePath: Request internal cohort dashboards or exchange-active account disclosures that separate registered, funded, and monthly active users.
