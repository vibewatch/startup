- id: market-size-and-adoption-scale
  title: TAM, SAM, and participation scale need multiple lenses
  body: 'The market is undeniably large, but the public datasets describe different things and should not be collapsed into one headline TAM. Mordor provides the broadest revenue lens at USD 4.25 billion in 2025, rising to USD 6.21 billion by 2030, with online distribution already 51.3% of category activity and retail users representing 63.4% of the mix. Those revenue figures are useful for understanding the sector, but they overstate what Dhan can directly reach in the near term because demat-account growth, active-client participation, and derivatives intensity each narrow the pool. ETBFSI showed 162 million demat accounts by June 2024, while HDFC Sky and Outlook place the top-of-funnel above 19 crore by 2025-2026. Yet ICRA says NSE active clients were only about 4.8 crore in late 2024, and CNBC says they fell to 4.57 crore by March 2026. That active-client layer is the better practical SAM proxy. Within it, the highest-value cohort is even narrower: ICRA estimates only about 96 lakh active
    derivatives traders, and CNBC''s FY26 share data imply Dhan itself may sit around one million active clients today.'
