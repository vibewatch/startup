  rows:
  - - Retail investing and cash execution
    - Cash-equity, ETF, and mutual-fund order flow plus basic brokerage fees
    - Wealth-advisory fees, PMS/AUM, and bank-broker cross-sell
    - Self-directed investor / same individual
    - Top-of-funnel acquisition base and lowest-friction use case
  - - Derivatives and intraday trading
    - Futures, options, intraday execution, chart-linked order routing, and options tools
    - Institutional derivatives desks and proprietary trading
    - Active trader / same individual
    - Highest engagement and strongest workflow dependence
  - - Brokerage-adjacent financing
    - MTF interest income, pledge-margin utility, and capital-efficiency services
    - Unsecured lending and non-broker credit products
    - Leverage-seeking trader / same individual
    - Important monetization layer beyond per-order brokerage
  - - Multi-surface execution stack
    - App, web, TradingView, DEXT, and related execution workflows
    - Generic education, media, and community surfaces without transaction intent
    - Trader or investor / same individual
    - Defines switching cost and tooling breadth rather than pure price
  - - Excluded adjacencies
    - None for core sizing
    - Insurance distribution, institutional broking, generic content, and non-broker ecosystem products
    - Other buyers / other payers
    - Keeps TAM disciplined around Dhan's current brokerage category
  notes: This chapter sizes Dhan as a retail brokerage and active-trader workflow product, not as the whole Raise ecosystem.
