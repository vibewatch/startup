- id: growth-drivers-constraints-and-valuation-relevance
  title: Growth drivers, constraints, and valuation relevance
  body: 'India''s retail-market expansion is clearly structural: demat accounts are far above pre-pandemic levels, domestic ownership has deepened, and regulators plus market infrastructure institutions have made participation easier and more legible. But that does not guarantee brokerage monetization. ICRA expects a 5-10% industry NOI decline in FY2026 and up to 500 basis points of margin contraction because weekly-options exuberance is being deliberately cooled by regulation. CNBC already shows a shrinking active-client pool in FY26, and Outlook highlights the deeper behavioral risk: 88% of retail F&O traders lose money on average, which raises churn, scrutiny, and product-suitability questions for the most monetizable cohort. Price compression compounds the problem because substitutes have already normalized free onboarding and low flat brokerage. The investability question for Dhan is therefore narrower than the macro TAM story. It is whether active-trader tools, financing workflows,
    and compliance trust can sustain share gains without excessive dependence on a single volatile segment. Public sources still do not expose segment revenue mix or cohort quality well enough to underwrite that conclusion with high precision.'
