- id: TM005
  title: Status-quo substitute pricing table
  columns:
  - Broker
  - Pricing anchor
  - Acquisition hook
  - Product breadth signal
  - Implication for Dhan
  rows:
  - - Dhan
    - Industry-standard pricing; no claim of being structurally cheapest
    - <10 minute online demat opening and one-account multi-surface access
    - App, web, TradingView, DEXT, MTF, pledge workflows
    - Must defend on tools and execution quality more than raw price
  - - Zerodha
    - ₹0 equity delivery; ₹20 or 0.03% for active trades
    - India's largest broker and strong retail-volume claim
    - Stocks, derivatives, mutual funds, ETFs, bonds, ecosystem products
    - Sets the benchmark for transparent low-cost execution
  - - Upstox
    - ₹0 first-year AMC; ₹20 max brokerage per order
    - Low-friction mass-market onboarding with strong regulatory disclosure
    - Multi-exchange broker with complaints and collateral tooling highlighted
    - Pushes low-fee, high-trust parity into the mainstream
  - - Groww
    - ₹0 account opening; ₹20 or 0.1% brokerage cap
    - Simple investing-led funnel and 2 Cr+ active-investor claim
    - All-in-one investing app with mass-market brand appeal
    - Shows that investing-first apps can still pressure trader acquisition
  - - 5paisa
    - ₹0 account opening; flat ₹20 per order
    - 50 lakh+ customers and 22.7M+ installs
    - Discount-broker positioning across equity, F&O, commodity, and currency
    - Keeps price-led substitutes plentiful for value-conscious users
  notes: 'Pricing has converged more than positioning: substitutes increasingly differ by trust, tooling, and user workflow rather than by headline commissions alone.'
