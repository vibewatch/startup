- id: buyer-segmentation-and-adoption-path
  title: Buyer segmentation and adoption path
  body: 'Dhan''s go-to-market motion is fundamentally self-serve. The same individual is usually buyer, user, and payer, and official onboarding shows a simple funnel: verify mobile and email, upload KYC material, e-sign, then fund the account and start trading. That simplicity is not a cosmetic detail; it is part of the market driver. Third-party coverage links India''s post-2020 retail surge to zero-commission offers, mobile-first UX, and faster KYC, while Dhan''s own pages show why it is aiming past novice investors toward more engaged cohorts. The app and web pages welcome both traders and investors, but the denser product value sits with active users who want chart-linked execution, options workflows, pledge-backed capital efficiency, margin financing, and terminal-style desktop customization. Long-term investors can still use the platform for delivery, ETFs, and mutual funds, yet the public evidence suggests Dhan''s strongest fit and likely highest monetization sit with options, intraday,
    swing, and multi-surface power users rather than with passive-hold accounts.'
