- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Fast KYC, e-sign, and mobile UX
    - driver
    - Current
    - Lowers time-to-first-trade and expands addressable retail participation
    - Request activation and first-fund rates by acquisition channel
  - - Demat-account expansion and deeper domestic ownership
    - driver
    - 2024-2026
    - Broadens the top of the retail funnel and keeps domestic liquidity relevant
    - Request Dhan cohort mix by account-vintage and city tier
  - - Multi-surface active-trader tooling
    - driver
    - Current
    - Supports differentiation when price is already commoditized
    - Measure cross-surface usage and retention by power-user segment
  - - MTF and pledge-capital efficiency
    - driver
    - Current
    - Raises monetization potential per active trader beyond brokerage alone
    - Request funded-book size, interest income, and pledge usage split
  - - Zero-brokerage and flat-fee price parity
    - constraint
    - Structural
    - Acquisition can stay strong while gross revenue per user compresses
    - Map CAC versus realized ARPU against major peers
  - - SEBI derivatives curbs and FY26 volume moderation
    - constraint
    - Current to near term
    - Threaten discount-broker revenue and active-client growth, especially in options-heavy cohorts
    - Request Dhan revenue exposure by segment after the November 2024 rule changes
  - - Retail loss rates and literacy gaps
    - constraint
    - Current
    - Can increase churn, scrutiny, and suitability concerns in the most active cohort
    - Request cohort-level retention and loss dispersion by user type
  - - Cybersecurity, exchange, and depository dependency
    - constraint
    - Current to medium term
    - Trust still depends on infrastructure and rules outside Dhan's direct control
    - Request outage history, recovery metrics, and compliance audit summaries
  notes: 'The chapter''s main valuation drivers and constraints are inseparable: the same retail and derivatives depth that boosts engagement also creates regulatory and behavior risk.'
