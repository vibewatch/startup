summary:
  headline: >-
    COOWA is the most commercially mature urban-robotics company in this report cohort — real revenue, operating
    profitability, and 10,000+ deployed robots — but the US$3B valuation at ~21x revenue multiples prices near-flawless
    execution for an IPO that has not yet been filed.
