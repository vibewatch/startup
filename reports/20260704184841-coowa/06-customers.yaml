- id: retention-and-satisfaction
  title: Retention, durability, and satisfaction
  body: COOWA's own commercial narrative, corroborated by an independent analyst feature (Guancha), reports a customer repurchase/renewal
    rate above 90% and top-customer revenue concentration below 20% as of year-end 2024, attributed to an outcome-based "RaaS"/"MaaS"
    leasing model in which COOWA retains equipment-failure and technology- iteration risk while customers pay a monthly service
    fee tied to verified cleaning outcomes. Named municipal contracts reviewed (Yongkang, Xixiang, Wuhu) run one to three
    years, and the Yongkang contract explicitly requires COOWA to hand over source code, data, and technical documentation
    to the city government at contract end -- a data-sovereignty clause that could ease customer switching to a rival at renewal.
    No formal net-revenue-retention or gross-revenue- retention metric, no third-party customer-satisfaction survey (no G2/Capterra-equivalent
    for municipal robotics procurement exists), and no independently reported service failure, contract termination, or public
    complaint specific to COOWA were found despite a deliberate adverse search; broader sector-level overcapacity and price-war
    warnings from China's National Development and Reform Commission (NDRC) exist but are not COOWA-specific. The retention
    figures therefore rest on a single company/analyst-interview source with no independent audit trail.
