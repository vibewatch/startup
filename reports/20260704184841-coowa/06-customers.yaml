  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Diligence gap
  rows:
  - - Municipal sanitation (city-district government)
    - City-district sanitation bureaus / comprehensive law-enforcement bureaus (government budget payer)
    - Road, sidewalk, and public-toilet cleaning under multi-year market-based tenders
    - 40+ named tender-award filings across 7+ provinces (Zhejiang, Guangdong, Fujian, Shaanxi, Anhui, Shanghai, Hunan)
    - Company-described largest of four business pillars ('smart city butler')
    - Per-district contract profitability and renewal terms not separately disclosed
  - - Incumbent sanitation-operator partners
    - Yuhuitian, Yingfeng Environment, Beikong (listed/state-linked sanitation operators)
    - Co-bid 'enterprise + technology provider' joint tenders; technology licensing to incumbent operators
    - Named as core customer-ecosystem partners in a February 2026 press interview
    - Enables faster geographic scale-out without owning local O&M labor
    - Revenue split and contract economics of the JV/co-bid model are undisclosed
  - - Property management enterprises
    - Gemdale (金地), Shenzhen SZ Properties (深业物业), unnamed district state-owned enterprises
    - Wheel-legged / quadruped R0 and D0 robots for estate-level cleaning and patrol
    - Named in official case-study material and a February 2026 press interview
    - '''Smart property services'' is one of three-to-four core business pillars'
    - No unit economics, contract length, or renewal data disclosed for this segment
  - - Municipal mobility / transit
    - Municipal transit authorities and district governments (CooBus route hosts)
    - Fixed micro-circulation autonomous minibus routes
    - Named operating cities include Shanghai, Shenzhen, and Zhuhai/Hengqin
    - Positioned as a reputation/demonstration driver rather than the largest revenue source
    - Ridership, fare revenue, and route-level profitability not disclosed
  - - Overseas municipal / enterprise pilots
    - Government or enterprise buyers in Singapore, Abu Dhabi, Dubai
    - Early-stage smart-city robot pilots adapted for right-hand-drive and high-heat markets
    - Company states these as 2026 priority cities; no named contract found independently
    - Framed by COOWA as a 'dimensional-strike' international growth vector
    - No signed contract value, timeline, or reference customer found in any reviewed source
  - - Industrial / city-delivery logistics
    - Unnamed industrial-park operators and city-delivery/logistics enterprises
    - Autonomous city-delivery vehicles and industrial-park last-mile robots
    - Named as one of four core scenario pillars in a company field-report interview
    - Smallest and least independently evidenced of the four scenario pillars
    - No named customer, contract value, or deployment count found independently
  notes: Segments are derived from company disclosures (official site, press interviews) cross-checked against independent
    government tender filings; revenue-band figures by segment are not separately disclosed by COOWA.
