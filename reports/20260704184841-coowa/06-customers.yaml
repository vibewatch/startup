- id: adoption-scale-and-trajectory
  title: Adoption scale and trajectory
  body: 'Multiple independent outlets (Securities Times via Sohu, Toutiao reproductions of an Anhui Business Daily field report,
    and company interviews) converge on a deployed fleet of 10,000+ AI robots/vehicles and an order backlog exceeding RMB
    5 billion as of February 2026, operating across 50+ cities globally -- consistent with COOWA''s own about-page claim of
    over 45 million cumulative real-world operating kilometers, though the company''s /intro page separately states roughly
    35 million real-road kilometers plus about 100 million simulated kilometers, an unreconciled discrepancy. A Securities
    Times interview with CEO He Tao reports FY2024 revenue of approximately RMB 700 million, a FY2025 target north of RMB
    1 billion, and a shift in revenue mix toward higher-value tier-1 cities (from under 2% of revenue in 2022 to roughly 25%
    in 2025). Tender-level evidence corroborates rapid within-year acceleration: COOWA won five separate Shenzhen city-manager
    sanitation tenders in under twelve months (annualized value over RMB 400 million, cumulative contract value near RMB 1.22
    billion), plus over RMB 1 billion in new China-wide tender wins reported by November 2025, and a government tender aggregator
    lists 40 distinct COOWA contract-award filings across Zhejiang, Guangdong, Fujian, Shaanxi, Anhui, Shanghai, and Hunan
    as of early July 2026. All growth figures originate from company disclosure or press interview rather than an audited
    filing; no independently verified, denominator-complete customer count exists.'
