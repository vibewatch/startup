- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs. pilot
  - Outcome
  - Limitation
  enumerationScope:
    coverage: partial
    basis: Named deployments compiled from company disclosures, independent press (Eastmoney, Sohu, CNMRA, Yicai Global),
      and government e-procurement/tender-filing aggregators (qcc.com, bidcenter.com.cn) covering 2024-07 through 2026-07;
      does not capture COOWA's complete national or international customer roster.
  rows:
  - - Shenzhen Pingshan District -- Shijing sub-district
    - Municipal government (district sanitation authority)
    - 38-robot mixed fleet (20 one-ton Unicorn sweepers, 8 three-ton Qilin road sweepers, 8 washing-sweeping vehicles, 1 patrol
      vehicle, 1 AI drone); over 85% area coverage via 50 fixed AI cameras
    - Production -- China's first 'full-domain, full-time, full-scenario' AI sanitation project, independently built by COOWA
      since 2024
    - District's Q2 city-appearance index ranked first in Pingshan district after deployment; labor-cost share fell from 70%
      to 30% and overall O&M cost fell roughly 10%
    - Outcome metrics are self-reported by a company VP in a press interview; no independent municipal audit found
  - - Shenzhen Baoan District -- Xixiang sub-district
    - Municipal government, co-built with listed sanitation operator Yuhuitian
    - '''Enterprise + technology provider'' joint delivery pilot since 2024, converted into a formal city-manager tender win
      in 2025'
    - Production (converted from pilot to full contract in 2025)
    - Cited as the proof point that enabled COOWA's subsequent sweep of four more Shenzhen district tenders within a year
    - Financial split between COOWA and Yuhuitian under the joint-delivery model is undisclosed
  - - Shenzhen Longgang (Henggang) and Pingshan (Bilin, Pingshan St.) districts
    - Municipal government (three additional district sanitation tenders)
    - City-manager sanitation service contracts
    - Production (tenders awarded in 2025 per independent press reporting)
    - Combined with Xixiang/Shijing, gives COOWA five Shenzhen city-manager tenders within about a year; annualized contract
      value over RMB 400 million, total contract value about RMB 1.22 billion
    - Per-district profitability, headcount, and equipment counts are not broken out individually
  - - Yongkang Comprehensive Administrative Law Enforcement Bureau (Zhejiang)
    - Municipal government
    - 3-year city-wide cleaning marketization contract requiring at least 99 vehicles including 34 unmanned units (10 washing,
      10 sweeping, 14 cleaning); 34% unmanned-equipment penetration
    - Production (contract signed 2025-05-28 per Jinhua Public Resources Trading Network announcement)
    - Winning bid of RMB 283,469,958.81 against a RMB 288,690,000 budget; data-ownership clause requires source-code and data
      handover to the city at contract end
    - Independent, non-press confirmation of the actual on-the-ground unmanned-vehicle count post-award was not found
  - - Wuhu Jinghu / Jiujiang district contracts (Anhui home-market cluster)
    - Municipal district governments (multiple contracts)
    - Road-sweeping and park/facility market-based procurement, including a 2025-2027 multi-year contract
    - Production (multiple signed contracts per a government contract-filing aggregator)
    - Demonstrates home-province contract depth beyond the flagship Shenzhen/Zhejiang wins
    - Aggregator listing does not disclose a combined annual contract value for the Wuhu cluster
  - - Bozhou Qiaocheng and Gaoxin districts (Anhui)
    - Municipal government, via a construction/engineering joint-bid partner
    - Smart sanitation service for designated urban roads, including a roughly RMB 73.9 million/year Gaoxin District road-cleaning
      contract
    - Production (signed contracts filed via a government e-procurement transparency portal)
    - One of the largest single named contract values found for COOWA in the aggregator data
    - Consortium partner's revenue share and COOWA's standalone equipment count are not disclosed
  - - Shanghai Jiading -- Tongji Xiaozhen / Anting New Town area
    - Property/estate-level buyer (per government filing, roughly RMB 1.25 million service contract)
    - Autonomous sanitation equipment hardware-plus-software integrated service
    - Production (contract signed 2026-05-15 per government filing)
    - Confirms continued win-rate in COOWA's flagship Shanghai home-turf market into 2026
    - Small contract value relative to the Shenzhen/Zhejiang wins; scope limited to a single district area
  - - Gemdale (金地) and Shenzhen SZ Properties (深业物业)
    - Enterprise property-management buyers
    - Smart-property cleaning and patrol robot deployment (R0/D0 series) at residential/commercial estates
    - Mixed -- Gemdale named as a core customer in a February 2026 press interview; Shenzhen SZ Properties named on the official
      /intro page (dated 2025-06)
    - Cited as evidence that COOWA's Shenzhen sanitation reputation converted into property-sector cross-sell
    - Neither relationship has an independently reported contract value, site count, or start date
  - - Ningxiang City Sanitation Center (Hunan)
    - Municipal government
    - 5th-round 'smart sanitation' market-based cleaning-service park-area bid package
    - Production (contract dated 2026-01-06/2026-01-19 per government e-procurement filing; winning price RMB 73,442,676.00)
    - Extends COOWA's named-win footprint outside its Shenzhen/Zhejiang/Anhui/Shanghai core into central China
    - Only the government filing snippet was retrievable; no independent press coverage of this specific award was found
  notes: 'Coverage is partial: rows are the named deployments independently corroborated during this research pass, not an
    exhaustive customer roster. Government e-procurement snippets are terse by design and were not cross-checked against a
    second independent press account in every row.'
