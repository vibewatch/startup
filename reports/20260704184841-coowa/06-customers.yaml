  evidenceGaps:
  - type: missing-source
    severity: material
    topic: overseas-customer-gap
    missingEvidence: A named overseas (Singapore, Abu Dhabi, or Dubai) customer contract with a disclosed value, start date,
      or reference outcome.
    whyItMatters: COOWA frames overseas expansion as a near-term growth vector, but with no independently verifiable overseas
      customer, that growth path is unproven and forecasts relying on it are speculative.
    diligencePath: Request overseas pilot-contract documentation or a customer reference call directly from COOWA's international-business
      or investor-relations team.
    relatedQuestionRefs:
    - QU006
  - type: missing-source
    severity: blocking
    topic: retention-metric-gap
    missingEvidence: A formal, cohort-defined net-revenue-retention (NRR) or gross-revenue-retention (GRR) metric, ideally
      segmented by municipal vs. property vs. mobility customers.
    whyItMatters: The chapter's most important durability metrics (repurchase rate, top-customer concentration) are both single-sourced
      to one 2024-vintage analyst interview; without a formal, audited retention metric, durability claims cannot be independently
      verified.
    diligencePath: Request formal NRR/GRR data with cohort definitions from COOWA management, or await disclosure in an eventual
      Hong Kong IPO prospectus.
    relatedQuestionRefs:
    - QU021
  - type: missing-source
    severity: material
    topic: satisfaction-metric-gap
    missingEvidence: Any independent customer-satisfaction survey, review-platform rating, or NPS/CSAT score specific to COOWA.
    whyItMatters: No independent satisfaction signal exists to corroborate or contradict COOWA's self-reported outcome claims
      (e.g. the Shijing city-appearance ranking), leaving buyer sentiment entirely unverified.
    diligencePath: Search municipal-government satisfaction surveys, city-council meeting minutes, or procurement-review portals
      referencing COOWA by name.
    relatedQuestionRefs:
    - QU021
