- id: named-customer-deployments
  title: Named customer deployments and production proof
  body: COOWA's strongest customer evidence is government tender and contract-award documentation rather than marketing case
    studies. Shenzhen's Pingshan Shijing sub-district hosts a 38-robot mixed fleet (Unicorn sweepers, Qilin road sweepers,
    washing vehicles, a patrol vehicle, and an AI drone) covering over 85% of the sub-district's operating area via 50 fixed
    AI cameras, described by COOWA as China's first "full-domain, full-time, full-scenario" AI sanitation project and independently
    reported to have pushed the district's city- appearance ranking to first place in its quarter. Shenzhen's Baoan Xixiang
    sub-district was co-built with listed operator Yuhuitian under an "enterprise + technology provider" model in 2024, later
    converting into a formal city-manager tender win and reportedly unlocking COOWA's subsequent sweep of four more Shenzhen
    district tenders. Outside Shenzhen, independently filed contracts document production deployments in Yongkang (Zhejiang,
    a 3-year, RMB 283 million contract requiring 34% unmanned-equipment penetration), Ningxiang (Hunan), Bozhou and Wuhu (Anhui,
    COOWA's home province), and Shanghai's Jiading district. Gemdale and Shenzhen SZ Properties are named property-sector
    relationships, though neither has an independently reported contract value or site count. All named deployments reviewed
    are production contracts rather than pilots; coverage is partial rather than exhaustive, since no single source lists
    COOWA's full customer roster.
