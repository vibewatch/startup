callouts:
- calloutType: strength
  title: Government tender filings, not just press releases, corroborate scale
  body: Unlike many private-company customer narratives that rest on marketing case studies, COOWA's named-customer evidence
    is anchored in independently filed government e-procurement and tender-award records (a 40-filing aggregator spanning
    7 provinces, plus the Yongkang, Ningxiang, and Shanghai Jiading contract filings), which is a higher evidentiary bar than
    logo-only customer claims.
  claimRefs:
  - CU019
  - CU021
  - CU024
  - CU026
- calloutType: risk
  title: Retention and concentration metrics are single-sourced to one analyst interview
  body: The >90% repurchase rate and <20% top-customer concentration figures -- the two most important durability metrics
    in this chapter -- both trace to one Guancha analyst feature citing company disclosure as of year-end 2024, with no independent
    audit, no NRR/GRR metric, and no more recent (2025/2026) refresh of either figure found.
  claimRefs:
  - CU027
  - CU028
- calloutType: risk
  title: '>90% domestic concentration leaves overseas growth unproven'
  body: COOWA states roughly 90% of its business remains domestic Chinese demand as of February 2026, and no named overseas
    contract, value, or timeline was found for the Singapore/Abu Dhabi/Dubai pilots the company describes as its next growth
    vector, making near-term revenue durability almost entirely dependent on the Chinese municipal-tender cycle -- a cycle
    the NDRC warned in November 2025 may face sector-wide overcapacity and price competition.
  claimRefs:
  - CU006
  - CU008
  - CU039
- calloutType: insight
  title: Data-handover clauses could double as a switching-risk lever at renewal
  body: The Yongkang contract's requirement that COOWA hand over source code, databases, and technical documentation to the
    city at contract end is framed by COOWA as a customer-friendly, low-risk RaaS feature, but it also lowers the switching
    cost for a city to move to a competitor at the next renewal using COOWA's own accumulated operational data.
  claimRefs:
  - CU032
  - CU040
