- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - '''Benchmark case first'' go-to-market (flagship Shanghai/Shenzhen wins de-risk follow-on city tenders)'
    - Reliance on a small number of first-mover flagship reference sites (Shanghai Jiading, Shenzhen Pingshan/Baoan)
    - High -- a public failure or contract loss at a flagship city could disproportionately slow the national tender win-rate
    - Request city-by-city win/loss rate and reference-site renewal status
  - - Joint-bid / co-delivery model with incumbent sanitation operators (Yuhuitian, Yingfeng Environment, Beikong)
    - Dependence on incumbent-operator relationships for geographic scale-out without owning local labor force
    - Medium-high -- loss of a key co-bid partner could stall expansion into that operator's territory
    - Request joint-bid/co-delivery contract terms and any partner-exclusivity clauses
  - - Domestic-China revenue base
    - Roughly 90% of 'basic market' volume remains domestic China as of a February 2026 company statement
    - High -- overseas expansion (Singapore/Abu Dhabi/Dubai) is early-stage and unproven at the revenue level
    - Request overseas pilot contract values and timelines once any are signed
  - - Revenue and customer diversification
    - Top-customer concentration below 20% and a customer base described as 'geographically and industrially dispersed' (as
      of 2024, company-stated)
    - Positive mitigant if accurate, but single-sourced and not independently audited
    - Request an audited or third-party-verified top-10-customer concentration breakdown
  - - Local policy and subsidy dependence
    - Local policy support (Shenzhen's '20+8' strategic-industry subsidies, Shanghai's smart-connected-vehicle rules) underpins
      current tender demand
    - Medium -- a policy reversal or NDRC-flagged sector overcapacity/price-war intervention (November 2025 warning) could
      compress margins or slow new tenders
    - Track NDRC and local-government policy statements and subsidy-program renewal status
  - - Segment concentration in municipal sanitation
    - Sanitation is described as the largest of four business pillars; CooBus, property robots, and logistics remain comparatively
      unproven at scale
    - Medium-high -- if sanitation-tender win-rate slows amid rising competition (Xiantu Zhineng, WeRide, and other rivals
      named in Yongkang-market coverage), the diversification benefit of the other three pillars is currently unproven
    - Request segment-level revenue or contract-count breakdown across the four business pillars
  - - Data-sovereignty / exit-transition contract terms
    - Government contracts require source-code and data handover at contract end (per Yongkang terms), which could ease customer
      switching to a competitor at renewal
    - Medium -- could raise churn risk at renewal if a rival undercuts price using handed-over operational data or specifications
    - Confirm whether this clause is unique to Yongkang or standard nationally, and whether it has caused any known switching
      event
  notes: Concentration figures (top-customer share, domestic-revenue share) are company-stated and not independently audited;
    policy-dependence risk is corroborated by an independent regulatory-warning source.
