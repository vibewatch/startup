  topStrengths:
    - 截至 2025 年，RMB1B+（US$140M）收入和据报经营盈利，让 COOWA 成为少数跑出商业规模验证的中国服务机器人公司。
    - 10,000+ 台已部署机器人和 45 million 公里累计运行里程，沉淀纯仿真同行难以复制的真实世界训练数据护城河。
    - WAM 2.0 / CooWAIM 2.0 世界行动模型基于 50+ petabytes 运营数据训练，在感知和策略学习上形成可复利的技术护城河。
    - RaaS / MaaS 定价模型带来经常性收入，加深运营数据飞轮，并相较硬件销售型对手降低客户 capex 门槛。
    - AIIB、SoftBank China Venture Capital 等战略投资人，以及 Huatai / Deutsche Bank IPO 保荐人，传递机构验证和可信流动性路径。
  topRisks:
    - US$3B 估值约为 2025 年收入的 21x，隐含大幅增长和利润率扩张，但公开证据尚无法用审计财务报表量化。
    - 市政和物业管理客户带来集中采购风险；预算周期、续约和竞争性重新招标仍不透明。
    - HKEX Chapter 18C“创新科技公司”门槛将于 2027 年 8 月到期；若 IPO 递表延后，可能需要满足更高财务门槛或改走其他路径。
    - 全球城市服务机器人同行——Gaussian / Gausium、Pudu Robotics、Brain Corp / Tennant——也在扩张；西方市场可能比中国部署更难打穿。
    - L4 自动驾驶车辆或物业机器人若在公共空间发生安全事故，可能触发监管行动、声誉受损和合同取消。
  unresolvedGaps:
    - 2025 年审计财务数据，包括毛利率、EBITDA 利润率、烧钱速度，以及按产品线拆分的单位经济。
    - IPO 招股书，包含详细客户集中度、合同条款、流失率和资本结构。
    - 2026 年融资轮的确切投后估值和详细条款（>US$600M 只是下限，并非确认数字）。
    - 海外收入拆分，以及在中国本土市场之外可复制部署的证据。
    - CooWAIM 2.0 第三方基准结果，用以对比其世界模型表现与 Wayve、Waymo 或学术基线。
