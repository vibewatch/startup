      - number: '1.2'
        title: Founders and Leadership
        blocks:
          - type: paragraph
            body: >-
              COOWA was founded and is led by CEO He Tao (何弯), a native of Yiwu, Zhejiang, born in the 1980s. He Tao
              graduated from Shanghai Jiao Tong University's School of Electronic Information and Electrical Engineering
              in 2008, then studied autonomous driving and robotics at the Tokyo Institute of Technology under robotics
              researcher Shigeo Hirose. He returned to Shanghai Jiao Tong University as faculty at the end of 2012 and
              founded COOWA in 2015 together with a 12-person founding team, all Shanghai Jiao Tong University alumni.
              He Tao was named to Fortune China's 2019 '40 Under 40' business-elite list. COOWA's Chief Operating
              Officer, Li Kehong, drives commercial execution; industry outlet RoboX reported that a sales team of only
              about 20 people delivered a 17x increase in business volume over five years, implying an unusually
              capital-efficient go-to-market motion for a hardware-and-services business. No public source discloses
              COOWA's full board composition, independent directors, or a governance charter, which is typical for a
              still-private company but represents an open diligence item ahead of any Hong Kong listing.
