      - number: '2.5'
        title: Sizing and Adoption Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Three gaps matter most for valuation-relevant diligence. First, no reviewed publisher isolates a
              China-specific, three-segment SAM/SOM combining municipal sanitation, smart property, and last-mile
              delivery; the constrained-lens figure in this chapter (FM001) is an author estimate built by summing
              narrower publisher lenses, not a sourced third-party number, and should be replaced with a bottom-up model
              using COOWA's own bid-win data as a demand-side proxy. Second, COOWA does not appear to disclose a
              segment-level revenue or contract-value split across its three business lines, which prevents weighting
              the sizing lenses by the company's actual mix rather than by an assumed equal weighting. Third, the
              capital-market overheating signal from chinabizinsider.com is a mid-2026 snapshot that should be refreshed
              close to any investment decision date, since sentiment and disclosed failures in this sector can shift
              within months. A minor, access-related gap is that a candidate source on Chinese sanitation-worker wage
              arrears (academicjobs.com) was blocked by a bot-challenge page during this session and could not be
              reviewed, leaving the labor-cost narrative resting on the MDPI academic study and SalaryExpert wage
              baseline alone.
            claimRefs:
              - CM021
              - CM028
              - CM037
              - CM030
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Headline TAM figures overstate COOWA's realistic addressable market
            body: >-
              Several widely-cited "cleaning robot" market reports (Mordor Intelligence, Fortune Business Insights) size
