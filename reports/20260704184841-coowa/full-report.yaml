      - number: '7.6'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              COOWA's Result-as-a-Service (RaaS) commercial model, under which government and enterprise customers pay
              for cleaning/logistics outcomes rather than owning hardware, is a real mitigation against customer capex
              risk, though it concentrates residual maintenance and equipment-failure risk on COOWA's own balance sheet.
              Reported customer repurchase behavior and diversified geographic/top-customer exposure (cited in
              company-sourced press coverage, not independently audited) are additional supportive signals, alongside
              COOWA's licensing compliance for its core sanitation business line. Monitorable indicators for this thesis
              include: whether COOWA confirms CSRC record-filing and CAC review clearance ahead of its HKEX submission;
              whether a prospectus discloses a valuation materially below the reported $3 billion figure (a down-round
              or valuation-inflation signal); whether new safety-related litigation or a MIIT/SAMR enforcement action
              appears in the public record; whether SoftBank China Venture Capital or the Asian Infrastructure
              Investment Bank fail to participate in any follow-on round; and whether order-backlog conversion
              decelerates versus peers such as Unitree, Gaussian Robotics, or UBTech for two consecutive reporting
              periods. Any of these would be a thesis-break trigger warranting a pause on new capital commitment and a
              re-underwriting of the risk-adjusted entry price pending closure of the diligence asks identified
              throughout this chapter.
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
              - CR040
              - CR041
