      - number: '5.2'
        title: Architecture and operating technology
        blocks:
          - type: paragraph
            body: >-
              COOWA's technical core is "Coowa Physical AI," driven by a self-developed World-Action Model (WAM 2.0)
              that the company says fuses spatial understanding, physical reasoning, and autonomous decision-making
              across parks, sidewalks, and arterial roads. WAM 2.0 is trained with a self-supervised multi-task
              future-frame-prediction and scene-structure-inference stage, layered with trajectory-behavior-aligned
              action supervision, then refined through open-loop calibration on real robot data before closed-loop
              reinforcement learning inside an AIGC-generated simulation environment. From this base, COOWA derives
              Drive AI (autonomous driving, with a disclosed mean-distance-per-critical-intervention above 150,000km)
              and Work AI (a VLA-based task-execution module for sanitation work). A parallel UrbanVLM system runs a
              cloud/edge split -- a 32B-parameter "Large" model analyzing video for city-governance decisions, and a
              3B-parameter "Tiny" model for on-robot real-time scene cognition. All of this sits on a self-built 2,000
              PFLOPS compute cluster and roughly 50PB data lake processing 100,000+ scene clips daily, with a simulation
              stack generating on the order of 300,000km of simulated driving per day. In May 2026 COOWA layered a newer
              "CooWAIM 2.0" interactive world model with a proprietary DAWN architecture on top, independently reported
              to cut compute workload by roughly 75%, though independent technical commentary places its disclosed
              benchmark scores below leading humanoid-focused world models that target fine manipulation rather than
              vehicle obstacle-avoidance.
