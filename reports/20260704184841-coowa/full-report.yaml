  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation turns on real commercial scale meeting an unconfirmed valuation mark and thin
      regulatory/financial disclosure, with the CSRC/CAC filing path acting as the main swing factor.
    data:
      nodes:
        - id: scale
          label: Commercial scale proof
          detail: 10,000+ deployed robots, 45M+ km, RaaS model, >RMB1B 2025 revenue, claimed profitability.
          tone: positive
        - id: market
          label: Underpenetrated market
          detail: Global cleaning-robot and China AGV markets both growing 12%+ CAGR from a small base.
          tone: positive
        - id: price
          label: Reported ~$3B mark
          detail: Press-reported round exceeding $600M, a 1.6x step-up from the last confirmed $1.9B D-round.
          tone: warning
        - id: filing
          label: Unconfirmed CSRC/CAC filing
          detail: No public confirmation of cybersecurity review or overseas-listing record-filing.
          tone: warning
        - id: disclosure
          label: Unaudited financials
          detail: Revenue, profitability, and financing terms are company-sourced and unaudited.
          tone: warning
        - id: decision
          label: Research-more / track
          detail: Stay engaged, but require confirmed filing status and audited financials before committing capital.
          tone: neutral
      edges:
        - from: scale
          to: price
        - from: market
          to: price
        - from: price
          to: decision
        - from: filing
          to: decision
        - from: disclosure
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV006
      - CV009
      - CV011
      - CV016
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The reported ~$3B mark only looks comfortable if COOWA can sustain a revenue multiple in line with profitable
      China robotics peers rather than a mature-industrial-equipment multiple.
    data:
      items:
        - label: Revenue needed at 6x (bear multiple)
          value: 500
          detail: USD millions of revenue required to support $3B at a distressed-sector multiple.
          tone: negative
        - label: Revenue needed at 15x (base multiple)
          value: 200
          detail: USD millions of revenue required to support $3B at a normalized-sector multiple.
          tone: warning
        - label: Revenue needed at 25x (Unitree/UBTech multiple)
          value: 120
          detail: USD millions of revenue required to support $3B at the current top-tier China robotics multiple.
          tone: neutral
        - label: Disclosed 2025 revenue floor
          value: 140
          detail: Approximate USD equivalent of the disclosed >RMB1 billion 2025 revenue (unaudited).
          tone: positive
    approximationNotes: >-
      Revenue thresholds are simple EV/revenue bridges using the press-reported ~$3B mark; they are not discounted
      cash-flow outputs and use an approximate RMB/USD rate.
    claimRefs:
      - CV016
      - CV022
      - CV023
      - CV017
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Public evidence supports a wide valuation range because multiple selection and regulatory-filing outcome matter as
      much as revenue growth.
    data:
      items:
        - label: Bear case
          low: 1
          mid: 1.2
          high: 1.5
          displayValue: $1.0B-$1.5B
          detail: CSRC filing stalls; multiples compress to 6-8x on flat revenue.
          tone: negative
        - label: Base case
          low: 3
          mid: 3.6
          high: 4.2
          displayValue: $3.0B-$4.2B
          detail: Delayed listing; revenue near $250-300M at a 12-15x normalized multiple.
          tone: warning
        - label: Bull case
          low: 8
          mid: 9
          high: 10
          displayValue: $8B-$10B
          detail: Clean IPO clearance; revenue toward $400M at a ~24-25x peer-aligned multiple.
          tone: positive
    approximationNotes: >-
      Ranges are scenario-based revenue-multiple outputs designed for investment-committee discussion, not management
      guidance or a DCF model.
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      COOWA scores well on commercial scale and market tailwinds, but much lower on financial disclosure quality and
      regulatory-filing certainty.
    data:
      items:
        - label: Market demand
          score: 8
          detail: Underpenetrated sanitation/AGV markets growing 12%+ CAGR support multi-year demand.
          tone: positive
        - label: Commercial proof
          score: 8
          detail: 10,000+ deployed robots, 45M+ km, and claimed profitability are real scale signals.
          tone: positive
        - label: Moat / differentiation
          score: 6
          detail: RaaS model and proprietary world model are real, but no independent technology benchmark exists.
          tone: neutral
        - label: Financial disclosure quality
          score: 3
          detail: Revenue, profitability, and financing terms are unaudited and company-sourced.
          tone: negative
        - label: Regulatory-filing certainty
          score: 3
          detail: No confirmed CAC/CSRC filing status as of the runDate.
          tone: negative
        - label: Valuation support
          score: 5
          detail: Implied multiple is in line with peers, but rests on an unregistered round and unaudited revenue.
          tone: neutral
        - label: Evidence quality
          score: 5
          detail: Good directional third-party evidence, but not public-company-quality disclosure.
          tone: neutral
    approximationNotes: Scores are 0-10 ordinal judgments synthesized from the public evidence set for IC discussion.
    claimRefs:
      - CV006
      - CV008
      - CV009
      - CV016
      - CV022
