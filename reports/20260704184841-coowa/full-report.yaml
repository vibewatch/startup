              RMB85.5 million in FY2024) and a FY2025 net loss of RMB1,654.9 million. Pony.ai (Nasdaq: PONY;
              HKEX-listed) reported FY2025 revenue of US$90.0 million with gross margin expanding to 15.7% from 15.2%,
