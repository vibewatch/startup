      - number: '1.5'
        title: Risk Signals and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Independent, critical coverage raises two distinct concerns. First, Guancha's technical analysis argues
              that COOWA's CooWAIM 2.0 world model is fundamentally an autonomous-driving obstacle-avoidance system —
              tested on a service road in Wuhu with a sweeper truck as its 'protagonist' — rather than the fine,
              multi-joint manipulation world models pursued by rivals such as Zhiyuan GE 2.0, Xingdong Ctrl-World, and
              Beijing-Humanoid Pelican-Unify, and questions whether this narrower technical moat can support COOWA's
              capital-market valuation narrative. Second, China Biz Insider's sector analysis finds that most of China's
              25-plus embodied-AI unicorns, the cohort COOWA belongs to, carry only 18-24 month cash runways, with
              analysts anticipating consolidation or down-rounds in 2027-2028 — even though the same analysis singles
              out COOWA as one of the few already self-sustaining exceptions given its reported profitability.
              Separately, COOWA's own public posture is guarded: the company declined to comment when Shanghai
              Securities News asked about the IPO on 22 June 2026, and factual reporting on the company shows real
              inconsistencies — Edgen.tech's reported 2025 revenue of 'over 10 billion yuan' is roughly ten times the
              figure corroborated by three independent outlets, and its 'Hefei-based' headquarters claim conflicts with
              the Shanghai-founding narrative corroborated elsewhere. These conflicts do not necessarily indicate
              wrongdoing, but they underscore that no audited, independently verifiable financial statement for COOWA is
              yet public.
