      - number: '7.5'
        title: Financial, model, and execution risk
        blocks:
          - type: paragraph
            body: >-
              COOWA's national enterprise-credit registry entry records its last priced financing round (D-round) at a
              valuation of roughly RMB13.7 billion (~$1.9 billion), materially below the ~$3 billion (~RMB21-22 billion)
              figure that press coverage attaches to the reported >$600 million 2026 round — a gap that is either an
              unrecorded intervening round or a valuation discrepancy diligence should reconcile before underwriting any
              entry price. Press reports describe COOWA as profitable in 2025 on more than RMB1 billion of revenue, but
              as of the runDate no audited financial statement or listing prospectus had been made public, leaving both
              figures company-sourced and secondhand. For context, COOWA's closest listed humanoid-adjacent peer,
              UBTech, remained loss-making in FY2025 (a RMB703.2 million net loss on RMB2.00 billion revenue, +53.3%
              year over year, per its HKEX annual results filing) — showing that even the most comparable listed peer
              has not reached durable profitability, which raises the bar of scrutiny on COOWA's own unaudited claim.
              COOWA was co-founded in 2015; corporate-registry filings list Liao Wenlong as legal representative and
              beneficial owner, while press profiles credit co-founder He Tao (an SJTU graduate who studied robotics at
              Tokyo Institute of Technology under Shigeo Hirose) with the company's founding vision — concentrating
              key-person dependency in a small founding team. 36Kr reports COOWA's sales team has stayed near 20 people
              while order bookings scaled roughly 17x over five years against a reported RMB5 billion-plus order
              backlog, an efficiency signal that is also a thin-commercial-team execution risk, and the compressed
              two-to-three-month IPO submission timeline reported in the press raises execution risk around audit
              completion and disclosure quality.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
