    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Regulatory, data-compliance, and technology-moat risks feed listing-execution risk; capital-concentration and
      execution risk both flow into the investment thesis via price and timing.
    data:
      nodes:
