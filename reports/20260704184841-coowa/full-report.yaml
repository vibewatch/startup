      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              COOWA's regulatory exposure is bifurcated: Beijing's industrial policy actively supports embodied robotics
              (MIIT's Guidance on Innovative Development of Humanoid Robots sets 2025/2027 milestones and calls for
              stronger safety governance), while capital-market access carries real uncertainty. Chinese law requires a
              CAC-led cybersecurity review and/or data-export security assessment, plus a CSRC overseas-listing
              record-filing, before a company holding qualifying user or 'important' data can list abroad; as of the
              runDate no source in this research pass shows COOWA has publicly confirmed either step, even though press
              coverage describes a two-to-three-month submission timeline. China's national safety-standard system for
              service and sanitation robots also remains largely recommendatory rather than mandatory. On litigation,
              COOWA's onshore entity carries 26 judicial case records and 47 legal-proceeding entries in China's
              national enterprise-credit registry, including a 2024 labor-injury liability dispute partially decided
              against the company and active 2025-2026 sales-contract disputes, though none allege robot malfunction or
              product recall. The company also holds a municipal household-waste operational-disposal license and
              operates through a Hong Kong holding vehicle (Cowarobot Investment Holding Limited) established in the
              Anhui free-trade zone, adding a standard layer of offshore-restructuring complexity to any listing. HKEX's
              Chapter 18C specialist-technology regime, with temporarily reduced market-cap thresholds through August
              2027, is the likely listing gateway given no profit-test requirement, but it remains a comparatively new
              regime for first-time issuers. US export-control tightening in 2026 (closing the offshore-subsidiary
              loophole for advanced AI chips) adds a further compute-supply-chain regulatory risk shared across the
              Chinese embodied-AI sector.
