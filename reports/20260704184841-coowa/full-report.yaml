  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buyers
        blocks:
          - type: paragraph
            body: >-
              COOWA sells into four disclosed scenario pillars -- smart municipal sanitation ("smart city butler"),
              smart property services, smart mobility (the CooBus L4 minibus), and city-delivery/industrial logistics --
              with municipal sanitation described by company executives as the largest and most mature pillar. The buyer
              and payer in the dominant segment is government: city-district sanitation bureaus or comprehensive
              administrative law-enforcement bureaus that fund multi-year, market-based cleaning-service tenders, as
              confirmed by dozens of independently filed government tender and contract-award records spanning at least
              seven provinces. A second buyer type is incumbent, often listed or state-linked, sanitation operators --
              Yuhuitian, Yingfeng Environment, and Beikong are each named by COOWA's co-founder as part of its "customer
              ecosystem" -- which co-bid or license COOWA's technology rather than compete with it. A third buyer type
              is property-management enterprises (Gemdale and Shenzhen SZ Properties are named) purchasing
              wheel-legged/quadruped R0/D0 robots for estate-level cleaning and patrol. A fourth, much smaller and
              largely unproven buyer type is overseas municipal or enterprise procurement in Singapore, Abu Dhabi, and
              Dubai, which COOWA describes as a 2026 priority but for which no named contract, value, or timeline was
              independently found. As of a February 2026 disclosure, COOWA states roughly 90% of its "basic market"
              volume remains domestic Chinese demand.
