  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Overview: risk framework and severity ranking'
        blocks:
          - type: paragraph
            body: >-
              COOWA (Kuwa Technology / 酷哗科技) is a Shanghai-headquartered, Anhui-registered operator of autonomous
              sanitation, urban-logistics, and mobility robots founded in 2015, reportedly profitable on more than RMB1
              billion of 2025 revenue and preparing a Hong Kong IPO advised by Huatai Securities and Deutsche Bank. That
              profile sits alongside five risk clusters this chapter ranks by severity: regulatory/legal (unconfirmed
              CSRC/CAC filing status, litigation history, licensing), operational/safety/technology (open-ended
              perception tasks, no independent benchmark of its world model), partner/dependency/concentration (two
              named financing backers, two named OEM partners, government-dominated customer base, a two-bank sponsor
              syndicate), and financial/model/execution (an unaudited profitability claim and a valuation that has
              jumped well beyond the company's last registry-confirmed financing round). The highest-severity,
              least-resolved items are the CSRC/CAC filing status and the valuation-disclosure gap, because both
              directly gate whether the IPO, and the price at which any pre-IPO or listing-day investor would enter, can
              be underwritten with confidence. Mitigations and monitorable kill criteria are set out in the final
              section.
