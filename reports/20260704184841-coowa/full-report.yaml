      - number: '2.2'
        title: 'Sizing the Market: Multiple Publisher Lenses Across Three Segments'
        blocks:
          - type: paragraph
            body: >-
              No single publisher sizes COOWA's combined three-segment footprint, so this chapter preserves nine
              separate lenses rather than forcing one number. On the narrowest, most municipal-specific end, Intel
              Market Research sizes unmanned sanitation cleaning robots at $557 million (2024) growing to $832 million
              by 2034, a modest 6.1% CAGR; the same publisher sizes commercial cleaning robots at $504 million (2025) to
              $1,111 million by 2034 (12.2% CAGR) and sidewalk delivery robots at $1.5 billion (2025) to $15.2 billion
              by 2034, the fastest-growing lens reviewed at 29.2% CAGR. Broader, more inclusive lenses tell a different
              story: Mordor Intelligence and Fortune Business Insights size the overall cleaning-robot market
              (residential plus professional) at $16.9-18.2 billion in 2025 growing toward $38.5-76.6 billion by the
              early 2030s, while Global Market Insights and Future Market Insights size broader last-mile delivery
              categories at $1.3-1.9 billion in 2025-2026 growing toward $11.5-12.6 billion. Adjacent AMR/AGV data
              points provide useful cross-checks: Grand View Research's global AMR market ($4.74 billion in 2025) and
              IMARC's China-specific AMR estimate ($789.4 million in 2025) both skew toward warehouse/industrial
              logistics rather than COOWA's municipal/property/delivery mix, but confirm China is already the largest
              single-country AMR growth market. IFR's World Robotics 2025 report adds a unit-level anchor: almost
              200,000 professional service robots sold globally in 2024 (+9% YoY), with transport/logistics units up 14%
              to 102,900 and professional cleaning units up 34% to over 25,000, alongside 31% growth in RaaS-billed
              placements — directly consistent with COOWA's own RaaS model. A Chinese trade-press estimate
              (faxiangongchang.com) puts China's entire service-robot market at roughly RMB200 billion (~$28 billion) in
              2025, about 40% of the global service-robot market, and notes that Hong Kong-listed peers Geek+ (HK$21.3
              billion market cap) and Yunji Technology (49% IPO-day surge) are already being absorbed by public markets
              — context relevant to COOWA's own pending Hong Kong IPO.
