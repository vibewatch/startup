  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and portfolio
        blocks:
          - type: paragraph
            body: >-
              COOWA (酷哇科技) sells outcomes, not hardware alone: under a self-described "Results-as-a-Service" (RaaS)
              commercial model, municipal sanitation departments, property managers, and city transit operators contract
              for cleaned streets, managed shuttle service, or covered property tasks rather than buying a vehicle
              outright. The disclosed product matrix spans three business lines. Smart-city sanitation is covered by
              four vehicle classes -- the 66kg quadruped-plus-arm X0 "Lingxi" for curbs and greenbelts, the 675kg X1
              "Unicorn" autonomous sweeper for sidewalks and secondary roads, the 3-ton-class X3 "Qilin" family
              (suction-sweep, wash, and road-maintenance variants) for arterial roads, and the 18-ton T18 "Titan"
              front-designed (not retrofitted) drive-by-wire sweeper/washer for large municipal contracts. Smart
              mobility is served by the CooBus L4 minibus, a cockpit-free, steering-wheel-free 10-seat shuttle. Smart
              property is served by the R0 wheel-legged robot and D0 quadruped, both still in a comparatively early
              commercial stage. Each line carries a distinct maturity and buyer profile: the sanitation fleet and CooBus
              are in repeat commercial deployment across 50+ cities, while R0/D0 were described on COOWA's own site as
              internally tested with a target market launch in Q4 2025, a gap worth tracking rather than assuming
              closed.
