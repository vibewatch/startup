companyProfile:
  summary: >-
    COOWA (酷哇科技, Cool Wow Technology) is a Shanghai-based urban service robotics company founded in 2015 by He Tao (何弯),
    an SJTU alumnus who studied autonomous robotics under Fumio Miyazaki at the Tokyo Institute of Technology. From
    roots in autonomous sanitation vehicles, COOWA evolved into a full-stack urban robotics operator serving three
    verticals: Smart Mobility (CooBus L4 autonomous shuttle), Smart Property (R0 wheel-legged and D0 quadruped robots
    for property management), and Smart Sanitation (autonomous street-cleaning vehicles). Its competitive moat rests on
    the WAM 2.0 World-Action Model — trained on more than 50 petabytes of real-world scenario data from 45 million
    cumulative kilometers of robot operation — and a result-as-a-service (RaaS/MaaS) pricing model that charges
    customers per completed outcome rather than per hardware unit. COOWA disclosed revenue exceeding RMB1B (~US$140M) in
    2025 and achieved operating profitability, making it one of the few Chinese service-robot companies to reach
    commercial scale. In 2026 the company raised >US$600M at a >US$3B valuation; Huatai Securities and Deutsche Bank are
    reported as joint sponsors preparing a HKEX Chapter 18C IPO listing.
