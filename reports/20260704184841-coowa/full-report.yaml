  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: COOWA competes with both direct service-robot peers and adjacent humanoid narratives'
        blocks:
          - type: paragraph
            body: >-
              COOWA does not face a single neat competitor set. The closest direct overlap is with specialist
              service-robot vendors that already sell cleaning, delivery, or property-automation outcomes into
              commercial and public spaces. In that bucket, Gausium is the strongest dedicated cleaning-intelligence
              rival because it combines a very large installed fleet with deep workflow specialization in floor care,
              remote deployment, and maintenance automation. Keenon and Pudu are closer on indoor service breadth: both
              span cleaning plus hospitality or delivery use cases, but they skew toward restaurants, hotels, retail,
              and indoor property workflows rather than COOWA's outdoor sanitation and urban-shuttle footprint. A second
              competitor class is the humanoid-adjacent group—UBTECH, AgiBot, and Unitree—which overlaps less on current
              revenue mix but competes directly for investor mindshare, technical talent, and the right to define
              embodied-intelligence leadership. A third class is Western incumbents such as Brain Corp and Tennant,
              which prove that autonomy software plus installed-base distribution can remain powerful abroad. The status
              quo also matters: municipal contractors, facility operators, and in-house property teams can still choose
              labor, retrofit equipment, or partial automation instead of a city-scale COOWA rollout.
