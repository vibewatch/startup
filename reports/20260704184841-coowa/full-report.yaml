        - id: data
          label: Data-export compliance risk
          tone: warning
          detail: Large operational/sensor dataset may trigger a mandatory security assessment.
        - id: moat
          label: Technology-moat verification gap
          tone: warning
          detail: No independent benchmark of COOWA's world model against rival developers.
        - id: capital
