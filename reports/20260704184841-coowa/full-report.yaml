      - number: '7.3'
        title: Operational, safety, and technology risk
        blocks:
          - type: paragraph
            body: >-
              COOWA's core commercial task — autonomous street sanitation — is an open-ended perception problem: a Yicai
              interview with the company's Shenzhen operations lead describes street debris as having 'no fixed shape or
              boundaries,' requiring judgment about material, moisture, and adhesion that goes beyond a simple
              obstacle-avoidance task. COOWA's own account describes a human-robot teamwork model — not full automation
              — with staff retained for tasks such as clearing debris from green spaces or items stuck to walls, and a
              company-sourced narrative (reported by Guancha through a single interview) attributes its moat to a
              50-petabyte scene-data lake and a dual camera-lidar perception stack. That narrative is credible
              directionally but independent, third-party technical verification of COOWA's world model (branded WAM 2.0
              / CooWAIM 2.0, using a DAWN architecture per TMTPost's report of the May 2026 release) against rival
              Chinese embodied-AI or humanoid-robot models was not located in this research pass — a genuine
              technology-moat evidence gap rather than a confirmed weakness. No public recall, safety-incident report,
              or MIIT/SAMR enforcement action specific to COOWA's fielded robots was identified, though the absence of
              adverse coverage in Chinese-language registries should not be read as a clean-safety-record assurance,
              especially as the fleet is reported at more than 10,000 robots across 50+ cities and 45 million cumulative
              operating kilometers — a scale that itself expands the statistical surface area for mechanical failure and
              liability claims. COOWA's recent patent filings concentrate in autonomous-perception and
              trajectory-planning software rather than broad-based robotics hardware IP, meaning its differentiation is
              concentrated in a relatively narrow algorithmic layer.
