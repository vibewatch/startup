      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: The listing gate is the near-term risk that matters most
            body: >-
              No source in this research pass confirms COOWA has completed a CSRC overseas-listing record-filing or a
              CAC cybersecurity review, even though the press-reported submission timeline is only two to three months
              out; that gap should be closed before any capital is committed.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR012
          - type: callout
            title: The reported valuation outruns the last confirmed round by roughly 60%
            body: >-
              China's national enterprise-credit registry records COOWA's last priced round at ~RMB13.7B (~$1.9B), well
              below the ~$3B figure now circulating in press coverage of the 2026 round; the gap is unreconciled and
              directly affects any entry-price underwriting.
            calloutType: risk
            claimRefs:
              - CR025
          - type: callout
            title: Profitability and revenue are company-sourced, not yet audited
            body: >-
              Press reports describe COOWA as profitable on RMB1B+ of 2025 revenue, but no audited statement or
              prospectus was public as of the runDate; treat both figures as unverified until the IPO process produces
              filing-grade disclosure.
            calloutType: assumption
            claimRefs:
              - CR028
              - CR029
          - type: callout
            title: Litigation history shows no safety-liability pattern yet
            body: >-
              Of 26 judicial cases and 47 legal-proceeding entries on the public registry, none allege robot
              malfunction, autonomous-operation injury, or a product recall as of the access date.
            calloutType: strength
            claimRefs:
              - CR007
              - CR008
          - type: callout
            title: China's own planning agency has flagged sector overcapacity
            body: >-
              The National Development and Reform Commission publicly warned in November 2025 that China's 150+
              humanoid/embodied-robotics companies risk capital overheating and disorderly competition, a macro backdrop
              that raises the bar for COOWA to sustain its relative competitive position.
            calloutType: risk
            claimRefs:
              - CR023
              - CR042
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              COOWA's thesis rests on being one of a small number of Chinese embodied-AI companies with real, recurring
              commercial revenue rather than pure demo traction: press reports describe more than 10,000 deployed robots
              across 50+ cities, 45 million-plus cumulative operating kilometers, a Result-as-a-Service (RaaS)
              recurring-revenue model, over RMB1 billion of 2025 revenue, and company-claimed profitability — a rare
              combination in a sector where China's own National Development and Reform Commission has warned of
              overheating among 150+ humanoid-robotics entrants. The company's market (sanitation robotics, municipal
              services, urban mobility) is real and underpenetrated: third-party analyst forecasts put the global
              commercial cleaning-robots market at $504 million in 2025 growing to $1,111 million by 2034 (12.2% CAGR),
              and China's AGV market at $1.07 billion in 2024 growing to $2.18 billion by 2030 (12.53% CAGR). Customer
              concentration in local government and state-owned sanitation buyers, OEM dependence on Chery/BAIC for
              vehicle manufacturing, and a two-to-three-month reported HK listing timeline against no confirmed CSRC/CAC
              filing are the core anti-thesis points. The anti-thesis is sharpened by a valuation-disclosure gap: the
              only registry-confirmed priced round is a 2022 D-round at RMB13.7 billion (~$1.9 billion), while press
              coverage attributes a new, still-unregistered raise above $600 million at a post-money valuation above $3
              billion — a mark that as of the runDate rests entirely on unaudited, secondhand reporting rather than a
              company or regulatory filing.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV041
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV013
              - CV041
      - number: '8.2'
        title: Recommendation, confidence, risk rating, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Recommendation: research-more/track, not a price-insensitive buy at the reported ~$3 billion mark.
              Confidence: medium — public evidence corroborates COOWA's operating scale, commercial model, and sector
              tailwinds, but is weak on filing-grade financials, financing terms, and regulatory-clearance status. Risk
              rating: high, driven by the combination of unaudited financials, an unconfirmed IPO regulatory path,
              litigation history (26 judicial cases, 47 legal-proceeding entries per the corporate registry),
              OEM/customer/capital concentration, and a crowded, NDRC-flagged competitive field. Valuation stance:
              stretched-but-not-absurd — the reported ~$3 billion mark implies a revenue multiple in the low-20x range
              on disclosed 2025 revenue, which sits in line with (not far above) China robotics peers Unitree (~24.7x on
              its STAR Market IPO filing) and UBTech (~25x on its HKEX-listed market cap), so the multiple itself is not
              obviously bubble-priced even though the underlying financial disclosure is thin. Target posture: a 3-5
              year hold is only appropriate once private diligence closes the financing-terms, audited-financials, and
              regulatory-filing gaps; absent that, capital should not be committed at the headline mark without
              structural downside protection.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV042
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV011
              - CV016
      - number: '8.3'
        title: Financing and valuation context, entry discipline, and dilution/preference overhang
        blocks:
          - type: paragraph
            body: >-
              COOWA's corporate registry shows nine completed financing rounds from angel through Series D as of March
              2026, with the most recent officially recorded round dated 2022 and led by Asia Investment Capital at a
              D-round valuation of approximately RMB13.7 billion. Press coverage independently reports a newer,
              still-unregistered raise exceeding $600 million, backed by SoftBank China Venture Capital, Asia Investment
              Capital (a repeat investor), and — per a Shanghai investment-promotion report — a Shanghai state-owned
              Lead Fund (上海国投先导基金), at a post-money valuation above $3 billion. That is roughly a 1.6x step-up from the
              last confirmed mark over an unclear number of intervening years, which is a modest multiple expansion by
              growth-equity standards but is entirely unconfirmed by any company filing, term sheet, or regulator
              disclosure as of the runDate. Entry discipline requires: (1) a company-confirmed or filing-confirmed close
              of the reported round, including exact investor stakes; (2) full disclosure of liquidation preferences,
              anti-dilution ratchets, and any redemption rights attached to the new shares, none of which have been made
              public; (3) audited financial statements corroborating the RMB1 billion-plus revenue and profitability
              claims; and (4) confirmation of CAC cybersecurity-review and CSRC overseas-listing record-filing status.
              Until these are satisfied, any new capital should assume the disclosed $3 billion mark is a ceiling, not a
              floor, and should price in dilution/preference opacity as a discount.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV043
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV016
              - CV022
              - CV023
              - CV017
      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Bull case: COOWA's HK IPO clears CAC/CSRC review on the reported two-to-three-month timeline, audited
              financials confirm profitability on revenue scaling toward RMB3 billion (~$400 million) as the reported
              RMB5 billion-plus order backlog converts, and the market prices COOWA near Unitree's ~24-25x revenue
              benchmark, implying an equity value in the $8-10 billion range — roughly 2.5-3x the reported 2026 private
              mark. Base case: the listing proceeds on a delayed timeline, audited 2026 revenue lands near RMB1.8-2.2
              billion (~$250-300 million) with thin but real net margins, and the market applies a more conservative
              12-15x multiple consistent with post-NDRC-warning sector normalization, implying a value roughly flat to
              modestly above the reported $3 billion mark ($3.0-4.2 billion). Bear case: the CSRC filing stalls or is
              rejected, audited financials reveal materially lower margins or unresolved related-party/preference
              complexity, and broader embodied-AI sector consolidation (25+ China unicorns above RMB10 billion with
              18-24 month cash runways per independent commentary) compresses multiples to 6-8x on flat-to-declining
              revenue, implying a value of roughly $1.0-1.5 billion — below even the last registry-confirmed $1.9
              billion D-round mark. The spread between these cases is wide primarily because multiple selection, not
              revenue growth alone, drives most of the valuation swing given how immature public disclosure still is.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV044
          - type: table
            tableRef: TV003
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV044
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
      - number: '8.5'
        title: Comparable set
        blocks:
          - type: paragraph
            body: >-
              The most decision-useful comparables split into three tiers. First, listed/pre-IPO China robotics peers:
              UBTech (HKEX: 9880) carries a market cap near HK$54.7 billion against RMB2.00 billion FY2025 revenue
              (+53.3% YoY) and a RMB703.2 million net loss, implying roughly a 25x revenue multiple despite being
              loss-making; Unitree's STAR Market IPO filing targets a minimum ~¥42.0 billion market cap against ¥1.7
              billion 2025 revenue and ¥600 million adjusted net profit (~24.7x revenue, and profitable), a step up from
              its ¥12.7 billion June 2025 private round. Second, adjacent autonomous-mobility comps: Pony AI reported
              $90.0 million FY2025 revenue against a $76.8 million net loss, and WeRide reported roughly $98 million
              FY2025 revenue against a $236.6 million net loss — both far less capital-efficient than COOWA's claimed
              profitability, though robotaxi economics differ structurally from sanitation/mobility RaaS. Third, mature
              and distressed public floors: Tennant Company, a profitable listed industrial-cleaning-equipment maker,
              trades near a 1.2x revenue multiple ($1.49 billion market cap / $1.21 billion revenue), and iRobot trades
              as a distressed penny-stock warning case (market cap near $5 million against $547 million revenue and a
              $208.7 million loss) showing how quickly consumer-robotics valuations can collapse without a durable path
              to profitability. Gaussian Robotics, COOWA's closest same-country, same-sector private peer in commercial
              cleaning robots, has raised $361.5 million over 13 rounds with valuation terms undisclosed behind a
              data-provider paywall — illustrating that opaque private marks are a sector norm, not a COOWA-specific red
              flag.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
          - type: table
            tableRef: TV004
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
      - number: '8.6'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is currently low relative to the reported listing timeline: Hong Kong's Chapter 18C
              specialist-technology regime plausibly fits a pre-profit-test robotics issuer, and 2026 is a strong HK IPO
              window (Goldman Sachs forecasts ~$60 billion of 2026 HK IPO fundraising; Kharon found 85%+ of Chinese
              AI-related 2026 listings chose Hong Kong), but no S1-equivalent prospectus, audited financials, or
              confirmed sponsor mandate beyond named advisors Huatai Securities and Deutsche Bank has been made public.
              Thesis-break triggers include: a confirmed CSRC filing rejection or extended suspension; a
              prospectus-disclosed valuation materially below the reported $3 billion mark; audited financials showing
              materially lower revenue, margin, or backlog conversion than press reports imply; or disclosure of
              preference/redemption terms that subordinate new investors below undisclosed prior rounds. Final diligence
              asks mirror the risks chapter's evidence gaps: (1) the full 2026 financing term sheet including preference
              stack; (2) audited FY2025/FY2026 financial statements; (3) confirmed CAC/CSRC filing status; (4)
              customer-concentration and order-backlog-conversion data; and (5) any related-party or government-investor
              governance rights attached to the reported Shanghai state-fund participation. Absent these, the
              recommendation stays research-more rather than a committed buy or a pass.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV045
