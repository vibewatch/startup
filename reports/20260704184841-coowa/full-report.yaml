      - number: '6.5'
        title: Expansion drivers and concentration risk
        blocks:
          - type: paragraph
            body: >-
              COOWA's expansion motion is a "benchmark case first" strategy: it establishes flagship reference
              deployments in tier-1 cities (Shanghai Jiading, Shenzhen Pingshan/Baoan) and then uses those as proof
              points to win follow-on tenders in adjacent districts and provinces, a pattern directly visible in the
              Shenzhen five-tender sweep and the Yongkang/Ningxiang/Wuhu contract cluster. This strategy concentrates
              reputational risk in a small number of flagship sites: a public failure or contract loss in Shanghai or
              Shenzhen could disproportionately slow the national tender win-rate that depends on reference-ability. A
              second expansion lever -- joint bidding with incumbent sanitation operators (Yuhuitian, Yingfeng
              Environment, Beikong) -- accelerates geographic reach without COOWA owning local labor, but creates
              dependence on those partner relationships, whose contract-level economics are undisclosed. Geographic
              concentration is material: roughly 90% of COOWA's disclosed "basic market" remains domestic China, and
              Singapore/Abu Dhabi/Dubai pilots are unproven at revenue level. Segment concentration is also material:
              the sanitation ("smart city butler") pillar is described as the largest business line, while CooBus,
              property robots, and logistics remain comparatively thin on independently reported contract evidence, so
              the diversification benefit of "four pillars" is not yet demonstrated at the revenue level. Policy
              dependence (Shenzhen's "20+8" strategic-industry subsidies, Shanghai's smart-connected-vehicle rules)
              underpins current tender demand and is itself a durability variable, alongside the NDRC's November 2025
              sector-overcapacity caution.
