        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: research-more/track, not buy'
            body: >-
              COOWA's commercial scale and profitability claims are compelling, but the reported ~$3B mark rests on an
              unregistered round and unaudited financials.
            calloutType: recommendation
