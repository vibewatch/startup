- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - evidence / threshold
  - transmission to thesis
  - action implication
  rows:
  - - CSRC filing rejected or suspended
    - A confirmed CSRC overseas-listing record-filing rejection or an extended suspension beyond the reported 2-3 month
      timeline.
    - Removes the near-term listing catalyst and reopens all valuation-disclosure uncertainty.
    - Pause any new underwriting until filing status is confirmed.
  - - Prospectus valuation materially below $3B
    - A draft or filed HKEX prospectus discloses a valuation materially below the press-reported ~$3B mark.
    - The entry price assumption for this chapter would be invalidated outright.
    - Re-underwrite entirely against the disclosed prospectus price, not the press-reported mark.
  - - Audited financials show weaker economics
    - Audited statements reveal revenue, margin, or backlog conversion materially below the RMB1B+/profitable narrative.
    - The bull and base cases both depend on the profitability and backlog-conversion claims holding up under audit.
    - Shift stance from stretched-but-not-absurd to expensive; re-run scenarios on audited figures.
  - - Preference/redemption terms subordinate new capital
    - Disclosure of liquidation preferences, ratchets, or redemption rights that disadvantage new investors relative to
      undisclosed prior rounds.
    - Changes the economic reality of the headline valuation for any new money.
    - Require full cap-table and preference-stack disclosure before any commitment.
  - - Sector-wide multiple compression
    - NDRC-flagged overcapacity among China's 150+ humanoid/embodied-AI entrants triggers a broad valuation reset.
    - Even strong COOWA-specific execution may not prevent multiple compression across the whole comp set.
    - Track sector-wide financing and down-round data as a leading indicator.
  notes: These are kill triggers, not generic risks; each would directly impair a specific assumption needed to defend the
    reported mark.
