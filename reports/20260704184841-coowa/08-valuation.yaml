company:
  name: COOWA
chapter:
  number: 8
  title: Valuation
  summary: 'Press reports put COOWA''s newest (still-unregistered) financing round above $600 million at a post-money valuation
    above $3 billion, roughly 1.6x its last registry-confirmed 2022 D-round mark of RMB13.7 billion (~$1.9 billion), against
    >RMB1 billion of unaudited 2025 revenue. That implies a revenue multiple in the low-20x range, in line with China robotics
    peers Unitree (~24.7x pre-IPO) and UBTech (~25x listed), but the underwriting case rests on unaudited financials, an
    unconfirmed CSRC/CAC filing path, and undisclosed preference terms. Recommendation: research-more/track, not a price-insensitive
    buy at the reported mark.'
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment thesis and anti-thesis
  body: 'COOWA''s thesis rests on being one of a small number of Chinese embodied-AI companies with real, recurring commercial
    revenue rather than pure demo traction: press reports describe more than 10,000 deployed robots across 50+ cities, 45
    million-plus cumulative operating kilometers, a Result-as-a-Service (RaaS) recurring-revenue model, over RMB1 billion
    of 2025 revenue, and company-claimed profitability — a rare combination in a sector where China''s own National Development
    and Reform Commission has warned of overheating among 150+ humanoid-robotics entrants. The company''s market (sanitation
    robotics, municipal services, urban mobility) is real and underpenetrated: third-party analyst forecasts put the global
    commercial cleaning-robots market at $504 million in 2025 growing to $1,111 million by 2034 (12.2% CAGR), and China''s
    AGV market at $1.07 billion in 2024 growing to $2.18 billion by 2030 (12.53% CAGR). Customer concentration in local
    government and state-owned sanitation buyers, OEM dependence on Chery/BAIC for vehicle manufacturing, and a two-to-three-month
    reported HK listing timeline against no confirmed CSRC/CAC filing are the core anti-thesis points. The anti-thesis is
    sharpened by a valuation-disclosure gap: the only registry-confirmed priced round is a 2022 D-round at RMB13.7 billion
    (~$1.9 billion), while press coverage attributes a new, still-unregistered raise above $600 million at a post-money
    valuation above $3 billion — a mark that as of the runDate rests entirely on unaudited, secondhand reporting rather
    than a company or regulatory filing.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV041
  tableRefs:
  - TV002
- id: recommendation-confidence-risk-rating
  title: Recommendation, confidence, risk rating, and valuation stance
  body: 'Recommendation: research-more/track, not a price-insensitive buy at the reported ~$3 billion mark. Confidence:
    medium — public evidence corroborates COOWA''s operating scale, commercial model, and sector tailwinds, but is weak
    on filing-grade financials, financing terms, and regulatory-clearance status. Risk rating: high, driven by the combination
    of unaudited financials, an unconfirmed IPO regulatory path, litigation history (26 judicial cases, 47 legal-proceeding
    entries per the corporate registry), OEM/customer/capital concentration, and a crowded, NDRC-flagged competitive field.
    Valuation stance: stretched-but-not-absurd — the reported ~$3 billion mark implies a revenue multiple in the low-20x
    range on disclosed 2025 revenue, which sits in line with (not far above) China robotics peers Unitree (~24.7x on its
    STAR Market IPO filing) and UBTech (~25x on its HKEX-listed market cap), so the multiple itself is not obviously bubble-priced
    even though the underlying financial disclosure is thin. Target posture: a 3-5 year hold is only appropriate once private
    diligence closes the financing-terms, audited-financials, and regulatory-filing gaps; absent that, capital should not
    be committed at the headline mark without structural downside protection.'
  claimRefs:
