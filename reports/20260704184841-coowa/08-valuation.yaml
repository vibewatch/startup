- id: comparable-set
  title: Comparable set
  body: 'The most decision-useful comparables split into three tiers. First, listed/pre-IPO China robotics peers: UBTech
    (HKEX: 9880) carries a market cap near HK$54.7 billion against RMB2.00 billion FY2025 revenue (+53.3% YoY) and a RMB703.2
    million net loss, implying roughly a 25x revenue multiple despite being loss-making; Unitree''s STAR Market IPO filing
    targets a minimum ~¥42.0 billion market cap against ¥1.7 billion 2025 revenue and ¥600 million adjusted net profit (~24.7x
    revenue, and profitable), a step up from its ¥12.7 billion June 2025 private round. Second, adjacent autonomous-mobility
    comps: Pony AI reported $90.0 million FY2025 revenue against a $76.8 million net loss, and WeRide reported roughly $98
    million FY2025 revenue against a $236.6 million net loss — both far less capital-efficient than COOWA''s claimed profitability,
    though robotaxi economics differ structurally from sanitation/mobility RaaS. Third, mature and distressed public floors:
    Tennant Company, a profitable listed industrial-cleaning-equipment maker, trades near a 1.2x revenue multiple ($1.49
    billion market cap / $1.21 billion revenue), and iRobot trades as a distressed penny-stock warning case (market cap
    near $5 million against $547 million revenue and a $208.7 million loss) showing how quickly consumer-robotics valuations
    can collapse without a durable path to profitability. Gaussian Robotics, COOWA''s closest same-country, same-sector
    private peer in commercial cleaning robots, has raised $361.5 million over 13 rounds with valuation terms undisclosed
    behind a data-provider paywall — illustrating that opaque private marks are a sector norm, not a COOWA-specific red
    flag.'
