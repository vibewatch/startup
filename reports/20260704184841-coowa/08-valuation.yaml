- id: exit-readiness-thesis-break-diligence
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: 'Exit readiness is currently low relative to the reported listing timeline: Hong Kong''s Chapter 18C specialist-technology
    regime plausibly fits a pre-profit-test robotics issuer, and 2026 is a strong HK IPO window (Goldman Sachs forecasts
    ~$60 billion of 2026 HK IPO fundraising; Kharon found 85%+ of Chinese AI-related 2026 listings chose Hong Kong), but
    no S1-equivalent prospectus, audited financials, or confirmed sponsor mandate beyond named advisors Huatai Securities
    and Deutsche Bank has been made public. Thesis-break triggers include: a confirmed CSRC filing rejection or extended
    suspension; a prospectus-disclosed valuation materially below the reported $3 billion mark; audited financials showing
    materially lower revenue, margin, or backlog conversion than press reports imply; or disclosure of preference/redemption
    terms that subordinate new investors below undisclosed prior rounds. Final diligence asks mirror the risks chapter''s
    evidence gaps: (1) the full 2026 financing term sheet including preference stack; (2) audited FY2025/FY2026 financial
    statements; (3) confirmed CAC/CSRC filing status; (4) customer-concentration and order-backlog-conversion data; and
    (5) any related-party or government-investor governance rights attached to the reported Shanghai state-fund participation.
    Absent these, the recommendation stays research-more rather than a committed buy or a pass.'
