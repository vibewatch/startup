- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - 2026 financing terms
    - Preference order, liquidation rights, ratchets, and any redemption/MFN clauses in the reported >$600M round.
    - These terms determine whether the headline $3B mark is economically real for new money.
    - Management + counsel; signed subscription/term-sheet documents.
  - - Audited financials
    - Audited FY2025 and interim FY2026 financial statements corroborating revenue and profitability claims.
    - Current figures are company-sourced and unaudited; margin and cash generation cannot be verified.
    - CFO diligence pack; auditor engagement letter and reports.
  - - Regulatory filing status
    - Confirmed CAC cybersecurity-review clearance and CSRC overseas-listing record-filing status.
    - Listing cannot proceed without both; status materially affects the near-term catalyst timeline.
    - Direct CAC/CSRC register check once COOWA files; company counsel confirmation.
  - - Customer and backlog data
    - Customer-level revenue concentration and the conversion rate of the reported RMB5B+ order backlog into recognized
      revenue.
    - Backlog-to-revenue conversion is central to both the bull and base valuation cases.
    - Sales/finance diligence pack; customer contract schedules.
  - - Governance and state-investor rights
    - Any governance, board, or veto rights attached to the reported Shanghai state-fund and SoftBank China participation.
    - State-linked investor rights could affect control, exit flexibility, or future financing terms.
    - Cap table and shareholder-agreement review; board materials.
  notes: These asks are intentionally narrow and investment-critical; each could move the recommendation or the acceptable
    entry price.
