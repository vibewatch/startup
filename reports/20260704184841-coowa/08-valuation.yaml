callouts:
- calloutType: recommendation
  title: 'Current call: research-more/track, not buy'
  body: COOWA's commercial scale and profitability claims are compelling, but the reported ~$3B mark rests on an unregistered
    round and unaudited financials.
  claimRefs:
  - CV006
  - CV007
  - CV016
- calloutType: strength
  title: Revenue multiple is in line with, not above, top China robotics peers
  body: At disclosed 2025 revenue, the reported mark implies a low-20x multiple, close to Unitree's ~24.7x IPO filing multiple
    and UBTech's ~25x listed multiple.
  claimRefs:
  - CV022
  - CV023
  - CV016
- calloutType: risk
  title: The valuation gap versus the last confirmed round is unresolved
  body: The only registry-confirmed priced round is a 2022 D-round at RMB13.7 billion; the reported ~$3B mark has no company
    or regulatory filing behind it.
  claimRefs:
  - CV011
  - CV012
  - CV041
- calloutType: risk
  title: Preference and dilution terms for the new round are undisclosed
  body: No public source discloses liquidation preferences, ratchets, or redemption rights for the reported >$600M raise,
    leaving new-money economics opaque.
  claimRefs:
  - CV013
  - CV014
  - CV043
- calloutType: assumption
  title: Base case assumes backlog conversion, not just headline growth
  body: The base and bull cases both assume the reported RMB5B+ order backlog converts into recognized, audited revenue
    rather than remaining a press-reported figure.
  claimRefs:
  - CV018
  - CV019
  - CV030
