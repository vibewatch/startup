- id: financing-valuation-context-entry-discipline
  title: Financing and valuation context, entry discipline, and dilution/preference overhang
  body: 'COOWA''s corporate registry shows nine completed financing rounds from angel through Series D as of March 2026,
    with the most recent officially recorded round dated 2022 and led by Asia Investment Capital at a D-round valuation
    of approximately RMB13.7 billion. Press coverage independently reports a newer, still-unregistered raise exceeding $600
    million, backed by SoftBank China Venture Capital, Asia Investment Capital (a repeat investor), and — per a Shanghai
    investment-promotion report — a Shanghai state-owned Lead Fund (上海国投先导基金), at a post-money valuation above $3 billion.
    That is roughly a 1.6x step-up from the last confirmed mark over an unclear number of intervening years, which is a
    modest multiple expansion by growth-equity standards but is entirely unconfirmed by any company filing, term sheet,
    or regulator disclosure as of the runDate. Entry discipline requires: (1) a company-confirmed or filing-confirmed close
    of the reported round, including exact investor stakes; (2) full disclosure of liquidation preferences, anti-dilution
    ratchets, and any redemption rights attached to the new shares, none of which have been made public; (3) audited financial
    statements corroborating the RMB1 billion-plus revenue and profitability claims; and (4) confirmation of CAC cybersecurity-review
    and CSRC overseas-listing record-filing status. Until these are satisfied, any new capital should assume the disclosed
    $3 billion mark is a ceiling, not a floor, and should price in dilution/preference opacity as a discount.'
