- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - More than 10,000 deployed robots and 45M+ operating kilometers is real commercial scale, not demo traction.
    - thesis
    - A verified slowdown in fleet growth or utilization would weaken the scale premise.
  - - RaaS recurring-revenue model plus company-claimed 2025 profitability is rare among China embodied-AI peers.
    - thesis
    - Audited financials confirming revenue and margin would materially strengthen this.
  - - Underpenetrated sanitation/AGV markets ($504M-$1.07B today, growing 12%+ CAGR) support multi-year demand.
    - thesis
    - A slowdown in municipal procurement budgets or tender wins would weaken this.
  - - The reported ~$3B mark is unconfirmed by any filing and implies a 1.6x step-up over an unregistered timeframe.
    - anti-thesis
    - A company-confirmed close of the round with disclosed terms would resolve this.
  - - No audited financial statements exist to corroborate RMB1B+ revenue or profitability claims.
    - anti-thesis
    - Publication of audited FY2025/FY2026 statements would close the largest evidence gap.
  - - Customer, OEM, and capital-provider concentration (government/SOE buyers, Chery/BAIC, 2-3 named investors) raises
      dependency risk.
    - anti-thesis
    - Disclosure of a broader, more diversified customer and investor base would ease this concern.
  notes: Arguments are intentionally price-sensitive; they describe what the reported valuation already assumes, not just
    what is true about the business.
