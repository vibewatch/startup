- id: bull-base-bear-scenarios
  title: Bull, base, and bear scenarios
  body: 'Bull case: COOWA''s HK IPO clears CAC/CSRC review on the reported two-to-three-month timeline, audited financials
    confirm profitability on revenue scaling toward RMB3 billion (~$400 million) as the reported RMB5 billion-plus order
    backlog converts, and the market prices COOWA near Unitree''s ~24-25x revenue benchmark, implying an equity value in
    the $8-10 billion range — roughly 2.5-3x the reported 2026 private mark. Base case: the listing proceeds on a delayed
    timeline, audited 2026 revenue lands near RMB1.8-2.2 billion (~$250-300 million) with thin but real net margins, and
    the market applies a more conservative 12-15x multiple consistent with post-NDRC-warning sector normalization, implying
    a value roughly flat to modestly above the reported $3 billion mark ($3.0-4.2 billion). Bear case: the CSRC filing stalls
    or is rejected, audited financials reveal materially lower margins or unresolved related-party/preference complexity,
    and broader embodied-AI sector consolidation (25+ China unicorns above RMB10 billion with 18-24 month cash runways per
    independent commentary) compresses multiples to 6-8x on flat-to-declining revenue, implying a value of roughly $1.0-1.5
    billion — below even the last registry-confirmed $1.9 billion D-round mark. The spread between these cases is wide primarily
    because multiple selection, not revenue growth alone, drives most of the valuation swing given how immature public disclosure
    still is.'
