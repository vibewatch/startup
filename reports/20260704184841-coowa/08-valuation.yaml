  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financing-terms
    missingEvidence: The exact liquidation preference, anti-dilution ratchet, and redemption terms attached to COOWA's reported
      2026 financing round.
    whyItMatters: Preference-stack terms determine whether the reported ~$3B post-money valuation is economically real for
      new common or early-round holders.
    diligencePath: Request the signed subscription agreement or a company-approved term sheet covering all preference and
      redemption terms.
    relatedQuestionRefs:
    - QV035
    relatedTableRefs:
    - TV002
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited FY2025 (and interim FY2026) financial statements confirming revenue, EBITDA, and net income.
    whyItMatters: All three valuation scenarios depend on whether the company-sourced revenue and profitability figures
      hold up under audit.
    diligencePath: Request audited financial statements or the draft listing prospectus once filed with HKEX.
    relatedQuestionRefs:
    - QV036
    relatedTableRefs:
    - TV003
  - type: missing-source
    severity: material
    topic: ipo-filing-status
    missingEvidence: Confirmation of whether COOWA has filed a draft HKEX listing prospectus (Form A1 equivalent) as of
      the runDate.
    whyItMatters: Exit-readiness and the reported 2-3 month listing timeline cannot be verified without a filed prospectus.
    diligencePath: Monitor the HKEX news website and CSRC overseas-listing filing register directly for a COOWA filing.
    relatedQuestionRefs:
    - QV037
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: margin-cash-flow
    missingEvidence: Gross margin by product line and operating cash-flow detail supporting the claimed EBITDA-positive/profitability
      status.
    whyItMatters: Without margin and cash-flow detail, the current ~20x revenue multiple cannot be sanity-checked against
      unit economics.
    diligencePath: Request a CFO diligence pack with segment-level gross margin and operating cash-flow schedules.
    relatedQuestionRefs:
    - QV038
    relatedTableRefs:
    - TV003
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: Any board, veto, or information rights granted to the reported Shanghai state-owned Lead Fund or SoftBank
      China Venture Capital in the new round.
    whyItMatters: State-linked or strategic investor governance rights could affect control, future financing flexibility,
      or exit optionality.
    diligencePath: Request the shareholders' agreement and board-composition documents as part of legal diligence.
    relatedQuestionRefs:
    - QV039
    relatedTableRefs:
    - TV006
  - type: stale
    severity: minor
    topic: unitree-post-ipo-multiple
    missingEvidence: Unitree's actual post-listing trading multiple once its STAR Market IPO completes and shares begin
      trading.
    whyItMatters: The comparable-valuation table currently uses Unitree's IPO-implied (pre-trading) multiple, which may
      reprice materially once the stock trades.
    diligencePath: Update the comparable valuation table with Unitree's actual post-listing market cap and revenue multiple
      once trading begins.
    relatedQuestionRefs:
    - QV040
    relatedTableRefs:
    - TV004
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: A more exhaustive set of China embodied-AI/robotics comparables, since several relevant private peers
      keep valuation and revenue undisclosed.
    whyItMatters: The current comparable set is decision-useful but not exhaustive, which could understate or overstate
      how COOWA's multiple compares with the full peer universe.
    diligencePath: Commission a broader private-market comparable screen (e.g., PitchBook, CB Insights) covering additional
      China embodied-AI peers as they disclose terms.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV004
  - type: conflicting-data
    severity: minor
    topic: valuation-disclosure
    missingEvidence: A single company-confirmed valuation figure reconciling the RMB23.4 billion / HK$23.4 billion / >$3
      billion figures reported variably across outlets.
    whyItMatters: Press outlets report the same round using different currency denominations without a reconciling company
      disclosure, creating a minor but unresolved consistency gap.
    diligencePath: Obtain a company-approved financing summary stating the valuation in a single reference currency.
    relatedQuestionRefs:
    - QV013
    - QV015
