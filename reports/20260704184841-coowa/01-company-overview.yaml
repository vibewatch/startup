- id: funding-and-investors
  title: Funding History, Investors, and IPO Plans
  body: In 2019 COOWA pivoted from a pure autonomous-driving technology vendor to a Mobility/Maintenance-as-a-Service (MaaS) full-stack service model, trading a longer R&D runway for stickier recurring order backlogs. Its last publicly disclosed funding round before 2026 was a Series D around 2022, led by Asia Investment Capital (亚投资本) with SoftBank China Venture Capital and CCV (创世伙伴) also participating. Notably, Mugglehead's English coverage names 'Asian Infrastructure Investment Bank' (AIIB) as a backer, while every Chinese-language outlet reviewed names 'Asia Investment Capital' instead — these are different institutions and the discrepancy likely reflects a translation conflation rather than two separate investors. Guancha's reporting further separates SoftBank China Venture Capital (a China-focused fund) from SoftBank Group Corp's global Vision Fund entity, cautioning that most 'SoftBank-backed' headlines blur this distinction. In 2026 COOWA quietly closed a financing round exceeding
    US$600 million, lifting its post-money valuation above US$3 billion. Huatai Securities and Deutsche Bank are reported to be joint sponsors preparing a Hong Kong IPO filing expected within two to three months of the 22 June 2026 reports, though COOWA itself declined to comment when Shanghai Securities News sought confirmation the same day.
  claimRefs:
