- id: scale-traction-and-milestones
  title: Scale, Traction, and Milestones
  body: 'COOWA has deployed more than 10,000 robot units across more than 50 cities and regions worldwide, accumulating over 45 million kilometers of real-world fleet operation. Its commercial model is Result-as-a-Service (RaaS): COOWA bills for completed outcomes — cleaned area, completed trips, delivered parcels — rather than one-time equipment sales, which both raises switching costs for customers and continuously feeds COOWA''s data flywheel. The company reported 2025 revenue exceeding RMB1 billion and, in February 2026, its first disclosure of positive annual EBITDA, coinciding with the WAM 2.0 launch. Its product lineup spans the CooBus L4 shuttle, R0/D0 property robots, and the Qilin X3/Unicorn X1 sanitation robots, deployed under partnerships with Shanghai Pudong Development Group, Beijing Enterprises-linked 北控集团, and Beijing E-Town Holdings, plus normalized overseas operations in Singapore and Abu Dhabi. Early sanitation-vehicle pilots date to around 2018 in Shenzhen, Changsha and
    Hefei; by December 2025, 36 robots were patrolling roughly 2.7 million square meters in Shenzhen''s Shijing sub-district alone. Pandaily reports COOWA holds roughly 80% share of Chinese orders involving ten-plus-unit deployments, and that its average per-deployment contract value grew 106% from 2022 to 2025. COOWA also states it is the only robotics company with normalized commercial service across all four mainland tier-one cities (Beijing, Shanghai, Guangzhou, Shenzhen).'
