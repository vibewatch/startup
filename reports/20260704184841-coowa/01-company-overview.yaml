company:
  name: COOWA
chapter:
  number: 1
  title: Company Overview
  summary: COOWA is a Shanghai-founded, 2015-vintage urban embodied-intelligence company that has scaled a Result-as-a-Service model to 10,000+ deployed robots across 50+ cities, reported RMB1B+ 2025 revenue with positive EBITDA, and is preparing a Hong Kong IPO after a 2026 raise that lifted its valuation above US$3 billion, even as independent reporting flags unresolved questions on its headquarters, investor identities, and technology moat.
sections:
- id: identity-and-mission
  title: Identity, Mission, and Product Architecture
  body: 'COOWA (酷哇科技), stylized COOWA/Coowa/CowaRobot, was founded in 2015 and describes itself as a world-model-driven, full-stack provider of urban embodied intelligence. The company''s stated mission is to advance ''robots and a better life together,'' pursuing breakthroughs in physical-world general artificial intelligence. COOWA organizes its business into three pillars: Smart Mobility, centered on the CooBus L4 autonomous shuttle; Smart Property, covering wheel-legged (R0) and quadruped (D0) robots for office buildings and industrial parks; and Smart City Stewardship, its flagship line of full-series sanitation robots including the Qilin X3 and Unicorn X1. The technical foundation is WAM 2.0 (World-Action Model), trained on more than 50 petabytes of real-world scene data and iterated in May 2026 into CooWAIM 2.0, a lighter-weight ''DAWN'' architecture the company brands as the industry''s first interactive world-action model. COOWA pursues full-stack self-development of chassis, domain
    controllers, models and operating systems to control cost, performance and margin capture. Notably, independent reporting is inconsistent on COOWA''s headquarters city: Mugglehead and WeExplainTech describe a Shanghai-based company (consistent with China Securities Journal''s account that the 12-person founding team came from Shanghai Jiao Tong University), while Yicai Global refers to ''Wuhu-based CowaRobot'' and Edgen.tech to a ''Hefei-based'' company — likely reflecting COOWA''s Anhui-registered manufacturing subsidiary rather than a single unambiguous corporate HQ.'
