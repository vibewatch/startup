company:
  name: COOWA
chapter:
  number: 4
  title: Financials
  summary: COOWA reports RMB1B+ 2025 revenue, an RMB5B+ order backlog, and its first positive EBITDA, funding a Result-as-a-Service
    model with a 2026 raise that lifted its valuation above US$3 billion — but no audited financial statement is public, a
    roughly ten-fold revenue discrepancy exists across otherwise credible outlets, and every margin, capex, and cash-runway
    figure in this chapter is a public-comparable proxy (WeRide, Pony.ai) rather than a COOWA-disclosed fact.
sections:
- id: revenue-model-and-mix
  title: Revenue Streams, Pricing, and Revenue Mix
  body: COOWA monetizes its robot fleet through a self-styled 'Result-as-a-Service' (RaaS) model, billing customers for completed
    outcomes — cleaned area, completed trips, or contracted uptime — rather than one-time equipment sales. This followed a
    2019 pivot away from selling autonomous-driving technology outright toward a Mobility/Maintenance-as-a-Service (MaaS)
    full-stack model that trades near-term hardware revenue for recurring order backlog. COOWA discloses no line-item revenue
    split across its three business pillars (Smart Mobility, Smart Property, Smart City Stewardship), though public reporting
    implies Smart City Stewardship (sanitation robots) is the dominant contributor. COOWA reported 2024 revenue of about RMB700
    million, rising to more than RMB1 billion in 2025 per at least four independent outlets, with an order backlog exceeding
    RMB5 billion as of mid-2026. Tier-one-city business (Beijing, Shanghai, Guangzhou, Shenzhen) grew from under 2% of revenue
    in 2022 to about 25% in 2025. Notably, Edgen.tech separately reported 2025 revenue of 'over 10 billion yuan,' roughly
    ten times the figure corroborated elsewhere — an unresolved discrepancy that materially changes any revenue-multiple analysis
    of COOWA's reported valuation. No source discloses COOWA's revenue-recognition policy (point-in-time vs. over-time; project
    vs. subscription accounting).
  claimRefs:
