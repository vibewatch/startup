      gap).
    whyItMatters: A 10x revenue discrepancy changes every downstream margin, multiple, and capital-adequacy calculation in
      this chapter.
    diligencePath: Cross-check against the audited revenue line in COOWA's eventual HKEX prospectus or Chinese corporate-registry
      annual filings.
