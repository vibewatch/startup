- id: cost-structure-and-margins
  title: Cost Structure, Gross Margin, and Capital Expenditure
  body: 'No independent source discloses COOWA''s own gross margin, cost of revenue, or capital expenditure; the company declined
    to comment on its financials when contacted by Chinese financial media in June 2026. This chapter therefore benchmarks
    against two public autonomous-mobility/robotics comparables with audited FY2025 filings. WeRide Inc. (Nasdaq: WRD), whose
    vehicle lineup includes ''robosweepers'' comparable to COOWA''s sanitation fleet, reported a 30.2% gross margin in FY2025
    (down slightly from 30.7% in FY2024) on RMB206.8 million of gross profit, alongside capital expenditure of RMB248.4 million
    (up sharply from RMB85.5 million in FY2024) and a FY2025 net loss of RMB1,654.9 million. Pony.ai (Nasdaq: PONY; HKEX-listed)
    reported FY2025 revenue of US$90.0 million with gross margin expanding to 15.7% from 15.2%, and a FY2025 net loss of US$76.8
    million (non-GAAP adjusted net loss US$174.0 million), a steep improvement from FY2024''s US$275.0 million net loss; Pony.ai''s
    results were independently corroborated by a parallel SEC Form 20-F filing. Taken together, these comparables suggest
    a plausible 15-30% gross-margin band for COOWA, though its RaaS-heavy, government/SOE-customer mix could plausibly sit
    outside this range in either direction.'
