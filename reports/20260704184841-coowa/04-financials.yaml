- id: traction-vs-private-metrics
  title: Public Traction Versus Private-Metric Gaps
  body: 'COOWA discloses unit- and scale-based KPIs — 10,000+ deployed robots, 50+ cities and regions, 45 million-plus kilometers
    of cumulative operation — but no ARR, gross margin, cash balance, or customer-count figures, leaving a substantial gap
    between the traction metrics COOWA publicizes and the financial metrics diligence would require. This gap sits within
    a large and growing addressable market: China''s 2025 ''sanitation + autonomous driving'' procurement and leasing market
    was valued at about RMB7.471 billion across 288 tendered projects and 1,676 units procured or leased, while the global
    unmanned sanitation/cleaning robot market was valued at USD 557 million in 2024, projected to reach USD 832 million by
    2034 (6.1% CAGR), with Asia-Pacific alone projected at 18.7% CAGR through 2027. Policy tailwinds compound this opportunity:
    Anhui province budgets roughly RMB500 million per year to subsidize the sanitation-robot industry, and Shenzhen has opened
    about 300 ''city + AI'' application scenarios. China''s broader embodied-AI sector raised about US$3.3 billion in Q1 2026
    alone across 126 deals, the highly capital-intensive backdrop against which COOWA''s own 2026 mega-round occurred.'
  claimRefs:
  - CI027
  - CI028
  - CI029
  - CI030
  - CI031
  tableRefs:
  - TI005
- id: capital-adequacy-and-financing
  title: Capital Adequacy and Financing Dependency
  body: Company Overview documents COOWA's funding chronology from its 2015 founding through a 2022 Series D and a 2026 mega-round;
    this section focuses only on the financial-adequacy implications. In 2026 COOWA closed a financing round exceeding US$600
    million, lifting its post-money valuation above US$3 billion, though the round's structure and investor identities were
    not disclosed. No source discloses COOWA's cash on hand, monthly cash burn, or resulting runway; the presumed effect of
    the 2026 raise on runway is inferred, not disclosed. Huatai Securities and Deutsche Bank are reported as joint sponsors
    preparing COOWA's Hong Kong IPO filing, with iFeng Finance narrowing the expected filing window to August-September 2026.
    China Biz Insider reports that most of China's 25-plus embodied-AI unicorns carry only 18-24 month cash runways, with
    a sector-wide reckoning expected in 2027-2028 — though the same analysis names COOWA as one of the few already self-sustaining
    exceptions given its reported profitability, a meaningfully different risk profile from most peers in its cohort.
  claimRefs:
  - CI032
  - CI033
  - CI034
  - CI035
