  - TI004
  figureRefs:
  - FI003
  - FI004
- id: financial-verdict
  title: Financial Verdict and Diligence Blockers
  body: iFeng Finance argues that a roughly US$3 billion valuation against about RMB1 billion (roughly US$140 million) of
    2025 revenue implies a high revenue multiple that Hong Kong investors, who have historically priced unprofitable tech
    listings conservatively, may discount at IPO. Given RaaS/MaaS recurring billing, disclosed positive EBITDA, and an order
    backlog exceeding RMB5 billion, COOWA's revenue quality appears stronger than most pre-IPO Chinese embodied-AI peers;
    however, the absence of audited margin or cash disclosures and a roughly ten-fold discrepancy in reported 2025 revenue
    across otherwise credible outlets make an independent financial verdict premature pending COOWA's HKEX prospectus. The
    single largest diligence blocker is the lack of any audited financial statement; secondary blockers include undisclosed
    segment revenue, customer concentration, cash position, and cap-table structure.
  claimRefs:
  - CI036
  - CI037
