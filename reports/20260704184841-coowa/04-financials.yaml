- id: gtm-and-sales-efficiency
  title: Go-to-Market Motion and Sales Efficiency
  body: Industry reporting credits a roughly 20-person COOWA sales team with delivering a 17x increase in business volume
    over five years, an unusually capital-efficient go-to-market motion if accurate, though no source discloses current headcount,
    quota structure, or a rigorous definition of 'volume.' COOWA's outcome-billed RaaS/MaaS structure is designed to lengthen
    customer relationships and reduce the marginal sales effort required for repeat or expansion orders relative to one-time
    hardware sales. COOWA claims roughly 80% market share of Chinese orders involving ten-plus-unit deployments, and its average
    contract value per deployment grew about 106% between 2022 and 2025 — even as a domestic low-end competitor, Saite Intelligent,
    introduced an outright unit price of about RMB99,000 or a rental of about RMB2,999 per month in 2026, signaling emerging
    price competition. Sector-wide, roughly 35% of new warehouse-robot deployments in 2026 use RaaS models, which typically
    run 30-50% more expensive than outright purchase over five years given bundled maintenance, software, and hardware refreshes
    — a useful monetization-structure proxy since COOWA does not publish its own RaaS unit pricing.
  claimRefs:
