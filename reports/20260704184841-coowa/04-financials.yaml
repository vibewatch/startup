callouts:
- calloutType: strength
  title: Recurring, outcome-billed revenue with a large backlog
  body: COOWA's RaaS/MaaS model bills for completed outcomes rather than one-time hardware, and its order backlog (RMB5B+)
    is roughly five times its reported 2025 revenue, a combination associated with recurring-revenue businesses that typically
    command higher multiples than pure hardware sellers — if the backlog converts to revenue as reported.
  claimRefs:
  - CI001
  - CI002
  - CI007
- calloutType: risk
  title: Revenue and valuation figures are internally inconsistent across sources
  body: Reported 2025 revenue ranges from about RMB1 billion to over RMB10 billion depending on the outlet, and a ~US$3B valuation
    against the lower revenue figure implies a rich multiple that iFeng Finance argues Hong Kong investors may discount; none
    of this is resolvable without an audited filing.
  claimRefs:
  - CI005
  - CI006
  - CI036
- calloutType: assumption
  title: Public-comp margins are used only as directional proxies, not COOWA-specific facts
  body: Because COOWA discloses no gross margin, cost of revenue, or capex figures of its own, this chapter benchmarks against
    WeRide's and Pony.ai's audited FY2025 filings; treat every margin or capex figure attributed to COOWA's likely range as
    an estimate, not a disclosed fact.
  claimRefs:
  - CI019
  - CI038
