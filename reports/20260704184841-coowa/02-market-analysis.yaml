- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'Five structural drivers support continued adoption. SalaryExpert data pegs the average Chinese sanitation worker''s salary at roughly RMB70,423 per year, and MDPI-published research links China''s aging and shrinking blue-collar labor supply to rising automation pressure in manual-labor-intensive service sectors — both feeding a persistent labor-substitution case for RaaS robots. National policy reinforces this: China''s MIIT frames humanoid and embodied-intelligence robotics as a strategic emerging industry meant to follow computers, smartphones, and EVs as a growth engine, and the 15th Five-Year Plan (2026-2030) gives "embodied intelligence" its own dedicated priority box among ten future-industry tracks. Public-market appetite for China service-robot listings (Geek+ and Yunji Technology''s 2025 Hong Kong IPOs) further supports financing and exit options for peers including COOWA. On the constraint side, China''s regulatory environment is tightening rather than loosening: MIIT plans mandatory (not voluntary) national safety standards for SAE Level 3/4 automated-driving systems effective July 1, 2027, and CSET''s translation of China''s trial Autonomous Vehicle Safety Guidelines requires a trained safety operator aboard most autonomous vehicles except remotely monitored driverless taxis — both of which raise near-term operating costs for unmanned sanitation and delivery fleets, even though Autowise.ai''s September 2024 Shanghai road-test permit shows the path to compliant deployment is achievable. A more macro constraint comes from chinabizinsider.com''s reporting that at least 25 Chinese embodied-intelligence startups carried valuations above RMB10 billion (~$1.39 billion) as of mid-2026, with total disclosed H1 2026 funding exceeding RMB46 billion (~$6.39 billion) but most companies holding only 18-24 months of cash runway — implying a 2027-2028 shakeout that could pressure pricing, consolidate the competitive field, or, in the extreme adverse case previously seen when iRobot filed for bankruptcy against Chinese cost/AI competition, displace incumbents entirely. Finally, fragmented publisher-specific market definitions and municipal procurement''s province-by-province, competitive-bid structure both constrain how quickly and how legibly the market can be sized or scaled nationally.'
