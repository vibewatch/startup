- id: buyer-user-payer-segmentation
  title: Buyers, Users, and Payers Across Segments
  body: 'Each of COOWA''s three segments has a distinct buyer motion. Municipal sanitation is procured competitively: bidcenter.com.cn records show dozens of COOWA bid-award announcements spanning at least seven Chinese provinces for "cleaning and public-toilet-management marketized procurement" projects, and cnmra.com reports a single RMB280 million contract win from a Zhejiang municipal enforcement bureau in May 2025 as part of over RMB1 billion in bids won that year — confirming that city or district sanitation/urban-management bureaus are the budget owner, with field crews and dispatchers as the day-to-day users. Smart property robots sell into a different motion: JLL''s China proptech database recorded over 830 AI-related investment transactions totaling more than $38 billion since 2012, showing that property owners and operators already treat AI-enabled building technology, including cleaning and patrol robots, as an established capital-allocation category, with facility/property management staff as users and the property management company or HOA as payer. Last-mile delivery robots sell primarily to retailers, food-delivery platforms, and logistics providers per Global Market Insights, with payload capacity up to 10kg dominating demand because it matches typical grocery, pharmacy, and meal-delivery order sizes per Future Market Insights. A cross-cutting dynamic favors COOWA''s RaaS model in all three segments: Mordor Intelligence notes facility-management firms are increasingly reclassifying janitorial spend as an operating lease rather than a capital purchase specifically to unlock robots-as-a-service budgets, which lowers the adoption barrier regardless of which segment or budget owner is involved.'
