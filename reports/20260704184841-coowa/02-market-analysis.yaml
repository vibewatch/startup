chapter:
  number: 2
  title: Market Analysis
  summary: 'COOWA sells into three overlapping but distinct segments -- municipal sanitation robots, smart property robots, and last-mile delivery/urban logistics robots -- that publishers size very differently: narrow, category-matched lenses put the 2025-2026 addressable spend around $2.6-3.1 billion combined, while broad "cleaning robot" and "last-mile delivery" headline figures run into the tens of billions and are not directly comparable. Growth is supported by aging/shrinking sanitation labor supply, an opex-friendly RaaS buying model, and top-down Chinese industrial policy, but tightening AV/robot safety regulation, fragmented market definitions, and a fast-inflating, short-runway Chinese embodied-AI capital market all constrain how much of the headline opportunity converts into durable, scaled revenue.'
sections:
- id: market-boundary-and-segment-definitions
  title: 'Market Boundary: Three Segments and What''s Excluded'
  body: 'COOWA''s own public surfaces describe three business lines: smart mobility (autonomous shuttles), smart property (wheeled/legged robots), and smart city sanitation, sold under a Result-as-a-Service (RaaS) model that bills on completed outcomes rather than equipment sales. That self-description does not map cleanly onto how third-party analysts size "robot cleaning" markets. The Business Research Company''s "sanitization robots" category is explicitly disinfection-focused (UV light, sprays, chemical agents) for healthcare and hospitality settings, which is a materially narrower and different category than the street-sweeping, waste-collection, and public-toilet-management work that COOWA''s municipal sanitation robots perform. Intel Market Research''s "unmanned sanitation cleaning robot" category, by contrast, explicitly covers garbage collection, dust absorption, and surface cleaning on urban roads, parks, and industrial zones, which is a much closer match to COOWA''s core municipal line. Meanwhile, broad "cleaning robot" reports from Mordor Intelligence and Fortune Business Insights fold in consumer robot vacuums (a segment COOWA does not serve) alongside commercial and industrial units, inflating headline totals to the tens of billions of dollars. The result is that superficially similar market-report titles describe meaningfully different addressable spend, and any single headline TAM number should be treated with skepticism until its scope is checked against this table.'
