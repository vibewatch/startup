  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: sanitation-robot market definition
    missingEvidence: A reconciled taxonomy separating "sanitization/disinfection robots" from "unmanned municipal sanitation cleaning robots" and from broad "cleaning robots" that include consumer vacuums.
    whyItMatters: Without a reconciled taxonomy, headline TAM figures cited by different outlets for what sounds like the same category can differ by an order of magnitude, undermining any single valuation-relevant sizing claim.
    diligencePath: Commission or request a category-mapped comparison from one analyst firm that explicitly tags included/excluded robot types and end-use segments.
    relatedQuestionRefs:
    - QM003
    - QM004
    - QM005
    - QM008
    relatedTableRefs:
    - TM002
  - type: enumeration-incomplete
    severity: material
    topic: China-specific combined SAM/SOM
    missingEvidence: A single publisher-sourced figure isolating the China-specific, three-segment (municipal sanitation + smart property + last-mile delivery) SAM/SOM relevant to COOWA.
    whyItMatters: Current sizing (FM001) is an author estimate constructed by summing narrower lenses; without a sourced figure, valuation multiples anchored to "market size" carry meaningful estimation risk.
    diligencePath: Request or commission a bottom-up China-specific sizing model using COOWA's own historical bid-win data (bidcenter.com.cn records) as a demand-side proxy.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: COOWA segment revenue split
    missingEvidence: COOWA's own disclosure of revenue or contract-value split across its sanitation, property, and mobility business lines.
    whyItMatters: Without a segment split, it is not possible to weight the three sizing lenses by COOWA's actual revenue mix rather than by equal or assumed weighting.
    diligencePath: Request management disclosure of segment revenue mix as part of financial diligence or IPO prospectus review.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM001
    - TM003
  - type: missing-source
    severity: minor
    topic: China-specific sidewalk delivery robot regulation
    missingEvidence: A China-specific regulatory framework or permit process for sidewalk/urban delivery robots, distinct from the broader autonomous-vehicle (AV) safety rules reviewed for sanitation vehicles.
    whyItMatters: The reviewed regulatory sources (MIIT, CSET) address SAE Level 3/4 automated driving generally; last-mile delivery robots may fall under different or still-undefined municipal rules.
    diligencePath: Search Chinese municipal transport-bureau notices for delivery-robot-specific pilot zones or permits.
    relatedQuestionRefs:
    - QM007
    relatedTableRefs: []
