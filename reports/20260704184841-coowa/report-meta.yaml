  productSummary: >-
    CooBus: L4 autonomous electric shuttle for campus and urban short-haul mobility.
    R0/D0 robots: wheel-legged and quadruped platforms for property patrol, elevator operation,
    and facilities management. Autonomous sanitation vehicles: street-cleaning and sanitation for
    municipal contracts. CooWAIM 2.0: an interactive world-action model (May 2026) that uses
    spatial reasoning and goal-conditioned planning across CooBus, property robots, and sanitation
    platforms.
  customerFocus: >-
    Urban property managers, municipal sanitation bureaus, smart-city operators, and corporate
    campuses across Mainland China and selected international markets (50+ cities globally).
  businessModel: >-
    Result-as-a-service (RaaS) / Maintenance-as-a-Service (MaaS): customers pay per completed
    outcome (km driven, m² cleaned, patrol completed) rather than hardware purchase, creating
    recurring revenue and deepening operational data collection from the deployed fleet.
  stage: Series D+ (>US$600M 2026 round; IPO preparations underway)
