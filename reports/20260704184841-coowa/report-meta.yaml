  topStrengths:
    - RMB1B+ (US$140M) revenue and reported operating profitability as of 2025 makes COOWA one of the very few Chinese service-robot companies to demonstrate commercial-scale validation.
    - 10,000+ deployed robots and 45 million cumulative kilometers of operation creates a real-world training data moat that pure-simulation peers cannot easily replicate.
    - WAM 2.0 / CooWAIM 2.0 world-action model trained on 50+ petabytes of operational data provides a compounding technical moat in perception and policy learning.
    - RaaS/MaaS pricing model generates recurring revenue, deepens the operational data flywheel, and reduces customer capex barriers versus hardware-sale competitors.
    - Strategic investor base (AIIB, SoftBank China Venture Capital) and Huatai / Deutsche Bank IPO sponsors signal institutional validation and a credible liquidity path.
  topRisks:
    - The US$3B valuation at ~21x 2025 revenue implies significant growth and margin expansion that public evidence cannot yet quantify from audited financial statements.
    - Municipal and property-management customers carry concentrated procurement risk; budget cycles, contract renewals, and competitive re-tendering are opaque.
    - HKEX Chapter 18C "innovative technology company" thresholds expire August 2027; a delayed IPO filing could require higher financial thresholds or route changes.
    - Global urban service-robotics peers — Gaussian/Gausium, Pudu Robotics, Brain Corp / Tennant — are also scaling; Western markets could prove harder than Chinese deployments.
    - Safety incidents with L4 autonomous vehicles or property robots in public spaces could trigger regulatory action, reputational damage, and contract cancellations.
  unresolvedGaps:
    - Audited 2025 financials including gross margin, EBITDA margin, burn rate, and unit economics by product line.
    - IPO prospectus with detailed customer concentration, contract terms, churn rates, and capital structure.
    - Exact post-money valuation and detailed terms of the 2026 financing round (>US$600M is a floor, not a confirmed figure).
    - International revenue breakdown and evidence of replicable deployments outside the Chinese domestic market.
    - CooWAIM 2.0 third-party benchmark results comparing world-model performance against Wayve, Waymo, or academic baselines.
