callouts:
  - calloutType: strength
    title: A genuinely fielded, multi-form-factor Physical AI portfolio, not just demo hardware
    body: >-
      COOWA's sanitation fleet, CooBus, and manufacturing footprint show real, independently
      corroborated commercial scale (10,000+ robots, 50+ cities, a vertically integrated factory)
      rather than press-release-only claims -- a meaningfully deeper evidence base than most
      single-product robotics peers reviewed in comparable reports.
    claimRefs: [CE028, CE037, CE038, CE039, CE040]
  - calloutType: risk
    title: World-model benchmark leadership is unproven outside COOWA's own vehicle-avoidance niche
    body: >-
      Independent technical commentary places CooWAIM 2.0's disclosed NAVSIM/nuScenes-style benchmark
      results behind leading humanoid-focused world models, and frames COOWA's "interactive world
      model" claim as solving a narrower obstacle-avoidance problem rather than fine manipulation --
      a distinction that matters for any valuation narrative built on general embodied-AI leadership.
    claimRefs: [CE020, CE021, CE052]
  - calloutType: risk
    title: No disclosed SLA, safety certification, or data-privacy policy for a public-space AI system
    body: >-
      Across every reviewed official and independent source, COOWA discloses no formal customer SLA
      or fleet uptime/MTBF metric, no functional-safety certification (e.g. ISO 10218-class) for its
      vehicles or arms, and no data-privacy or video-retention policy for UrbanVLM's continuous
      street-level video capture -- material diligence gaps for a system operating at city scale.
    claimRefs: [CE016, CE033, CE049, CE050]
  - calloutType: insight
    title: Manufacturing vertical integration is a verifiable moat, not just messaging
    body: >-
      Independent reporting corroborates COOWA's self-built die-casting and multi-workshop
      manufacturing base and a roughly 200-test pre-shipment regimen, giving the vertical-integration
      claim more substance than typical marketing copy, even though exact cost and yield figures
      remain undisclosed.
    claimRefs: [CE037, CE038, CE039, CE040]
