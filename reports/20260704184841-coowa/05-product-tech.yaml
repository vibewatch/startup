company:
  name: COOWA
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    COOWA fields a WAM 2.0 world-action model across a real, shipping multi-form-factor
    portfolio -- autonomous sanitation vehicles, an L4 minibus, and wheel-legged/quadruped
    property robots -- backed by a self-built 2,000 PFLOPS compute cluster, a ~50PB
    real-scene data lake, and a vertically integrated Anhui manufacturing base, but formal
    safety certification, SLA/uptime disclosure, and independent world-model benchmarking
    remain largely unverified outside company and Chinese-media sourcing.
sections:
  - id: product-definition-and-portfolio
    title: Product definition and portfolio
    body: >-
      COOWA (酷哇科技) sells outcomes, not hardware alone: under a self-described "Results-as-a-Service"
      (RaaS) commercial model, municipal sanitation departments, property managers, and city
      transit operators contract for cleaned streets, managed shuttle service, or covered property
      tasks rather than buying a vehicle outright. The disclosed product matrix spans three business
      lines. Smart-city sanitation is covered by four vehicle classes -- the 66kg quadruped-plus-arm
      X0 "Lingxi" for curbs and greenbelts, the 675kg X1 "Unicorn" autonomous sweeper for sidewalks
      and secondary roads, the 3-ton-class X3 "Qilin" family (suction-sweep, wash, and road-maintenance
      variants) for arterial roads, and the 18-ton T18 "Titan" front-designed (not retrofitted)
      drive-by-wire sweeper/washer for large municipal contracts. Smart mobility is served by the
      CooBus L4 minibus, a cockpit-free, steering-wheel-free 10-seat shuttle. Smart property is served
      by the R0 wheel-legged robot and D0 quadruped, both still in a comparatively early commercial
      stage. Each line carries a distinct maturity and buyer profile: the sanitation fleet and CooBus
      are in repeat commercial deployment across 50+ cities, while R0/D0 were described on COOWA's own
      site as internally tested with a target market launch in Q4 2025, a gap worth tracking rather
      than assuming closed.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE030]
    tableRefs: [TE001]
    figureRefs: [FE004]
  - id: architecture-and-technology
    title: Architecture and operating technology
    body: >-
      COOWA's technical core is "Coowa Physical AI," driven by a self-developed World-Action Model
      (WAM 2.0) that the company says fuses spatial understanding, physical reasoning, and autonomous
      decision-making across parks, sidewalks, and arterial roads. WAM 2.0 is trained with a
      self-supervised multi-task future-frame-prediction and scene-structure-inference stage, layered
      with trajectory-behavior-aligned action supervision, then refined through open-loop calibration
      on real robot data before closed-loop reinforcement learning inside an AIGC-generated simulation
      environment. From this base, COOWA derives Drive AI (autonomous driving, with a disclosed
      mean-distance-per-critical-intervention above 150,000km) and Work AI (a VLA-based task-execution
      module for sanitation work). A parallel UrbanVLM system runs a cloud/edge split -- a 32B-parameter
      "Large" model analyzing video for city-governance decisions, and a 3B-parameter "Tiny" model
      for on-robot real-time scene cognition. All of this sits on a self-built 2,000 PFLOPS compute
      cluster and roughly 50PB data lake processing 100,000+ scene clips daily, with a simulation stack
      generating on the order of 300,000km of simulated driving per day. In May 2026 COOWA layered a
      newer "CooWAIM 2.0" interactive world model with a proprietary DAWN architecture on top,
      independently reported to cut compute workload by roughly 75%, though independent technical
      commentary places its disclosed benchmark scores below leading humanoid-focused world models
      that target fine manipulation rather than vehicle obstacle-avoidance.
    claimRefs: [CE001, CE012, CE013, CE014, CE015, CE016, CE017, CE018, CE019, CE020, CE021, CE022, CE023, CE024, CE025]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: deployment-integration-reliability
    title: Deployment, integration, and reliability
    body: >-
      COOWA states its fleet has accumulated more than 45 million kilometers of real-world operating
      mileage across 50+ cities and regions, a figure corroborated independently in at least one
      outlet, though a separate official company page states a lower cumulative real-road figure of
      about 35 million kilometers alongside roughly 100 million simulated kilometers -- an internal
      discrepancy that is not reconciled in any reviewed source and should be treated as an open
      dating/scope question rather than a single hard number. Independent coverage separately
      corroborates a deployed-fleet count above 10,000 robots. On the ground, Shenzhen deployments
      show a "charge plus battery-swap" dual charging model, with a single fully charged unit running
      roughly 6-8 hours depending on task load. CooBus is commercially operating in Zhuhai Hengqin and
      Shanghai Jiading, with cumulative operating time over 30,000 hours and mileage over 500,000km.
      COOWA's roadmap shows a 2023 shift from a staged multi-modal perception-fusion algorithm to a
      vision end-to-end architecture, a September 2024 Hengqin product-launch event introducing the
      Qilin series and a new-generation CooBus, and the May 2026 CooWAIM 2.0 release. No reviewed
      source -- company or independent -- discloses a formal customer SLA, warranty term, or
      fleet-wide uptime/MTBF metric for any product line, which is a material gap for a fleet-scale
      RaaS commitment.
    claimRefs: [CE026, CE027, CE028, CE029, CE031, CE032, CE033, CE034, CE035, CE036]
    tableRefs: [TE004]
    figureRefs: [FE002]
  - id: manufacturing-differentiation-ip
    title: Manufacturing, differentiation, and IP
    body: >-
      COOWA operates a self-built dark factory of over 10,000 square meters in Anhui and claims full
      vertical integration of a "controller kit + multi-joint actuator + whole-vehicle" production
      chain. Independent reporting adds texture: the manufacturing base is described as spanning eight
      core workshops (machining, sheet metal, wiring harness, casting, cover parts, three-electric
      systems, and painting), COOWA is said to have been among the first companies in its category to
      buy its own die-casting machines because no automotive-grade off-the-shelf parts existed for its
      use case, and each vehicle reportedly passes on the order of 200 automotive-grade tests
      (including rainstorm-sealing and -20°C cold-start tests) before shipment. Commercially, COOWA's
      average contract value is reported up about 106% from 2022 to 2025, alongside a reported
      2025 swing to positive EBITDA, and a company-cited ~80% share of orders involving 10-or-more-unit
      deployments in smart sanitation. On IP, a public-registry search surfaces at least one granted
      Chinese design patent and several pending/granted invention-patent filings tied to named
      inventors including CEO He Tao and CTO Liao Wenlong, plus a registered "酷哇" trademark and a
      municipal waste-disposal administrative license -- but no source discloses the total size of
      COOWA's patent estate or any filings outside China. COOWA's disclosed supplier and academic
      relationships -- RoboSense (lidar), Chery New Energy and Jiangling Motors (vehicle platforms),
      China Tianying/Zoomlion Environment (JV, environmental equipment), and Shanghai Jiao Tong
      University (the founding team's academic origin) -- form the clearest disclosed dependency map.
    claimRefs: [CE037, CE038, CE039, CE040, CE041, CE042, CE043, CE044, CE045, CE046, CE054, CE055]
    tableRefs: [TE003]
    figureRefs: [FE003]
  - id: trust-safety-compliance
    title: Trust, safety, and compliance
    body: >-
      COOWA discloses ingress-protection and hazard ratings for its outdoor property robots -- IP68 for
      R0 and IP67 plus an explosion-proof certification for D0 -- and states that its fleet has
      accumulated "no critical safety takeover record" from large-scale continuous operation, a claim
      that is unaudited and unverifiable from any reviewed independent source. Across every official
      technical, product, and about page reviewed, no formal functional-safety or industrial-robot-safety
      certification (an ISO 10218-class standard, for example) is disclosed for any autonomous vehicle
      or robotic-arm product, and no source discloses a public data-privacy, video-retention, or
      municipal-surveillance-data-handling policy governing UrbanVLM's continuous ingestion of
      street-level video from the cities where COOWA operates. At the sector level, China's National
      Development and Reform Commission publicly warned in November 2025 that the country's 150+
      embodied-intelligence and humanoid-robot companies show excessive product homogeneity and
      overcapacity risk, and said regulators would build market entry/exit mechanisms -- a signal
      that applies to COOWA's broader competitive environment even though COOWA's own sanitation/CooBus
      business is not humanoid-specific. An investment-research commentary separately argues that
      COOWA's profitability and efficiency claims are unverified outside company-sourced Chinese media
      and may not be reproducible in other regulatory environments.
    claimRefs: [CE047, CE048, CE049, CE050, CE051, CE052, CE053]
    tableRefs: [TE005]
