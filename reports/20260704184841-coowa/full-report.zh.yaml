              Environment、Beikong 均被 COOWA 联合创始人列为其「客户生态」的一部分，它们与 COOWA 联合投标或授权使用技术，而不是正面竞争。第三类买方是物业管理企业（Gemdale 和
              Shenzhen SZ Properties 被点名），采购轮腿式/四足 R0/D0 机器人用于园区级清洁和巡逻。第四类买方规模小得多、且大体未验证，是新加坡、阿布扎比和迪拜的海外市政或企业采购；COOWA
