chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与产品架构
        blocks:
          - type: paragraph
            body: >-
              COOWA（酷哇科技），品牌写法包括 COOWA/Coowa/CowaRobot，成立于 2015
              年，自称是由世界模型驱动的全栈城市具身智能提供商。公司的公开使命是推动「机器人与美好生活同行」，目标是在物理世界通用人工智能上取得突破。COOWA 将业务分成三根支柱：Smart Mobility，以
              CooBus L4 自动驾驶接驳车为中心；Smart Property，覆盖面向办公楼和产业园的轮腿式（R0）与四足式（D0）机器人；Smart City Stewardship，以 Qilin X3 和
              Unicorn X1 等全系列环卫机器人为旗舰。技术底座是 WAM 2.0（World-Action Model），用超过 50 petabytes 的真实场景数据训练，并在 2026 年 5 月迭代为
              CooWAIM 2.0；公司称其采用更轻量的「DAWN」架构，是行业首个交互式世界-动作模型。COOWA 追求底盘、域控制器、模型和操作系统全栈自研，以控制成本、性能和利润获取。值得注意的是，独立报道对
              COOWA 总部城市说法不一：Mugglehead 和 WeExplainTech 称其总部在上海（这与 China Securities Journal 关于 12
              人创始团队来自上海交通大学的叙述一致），Yicai Global 则称其为「芜湖的 CowaRobot」，Edgen.tech 称其为「合肥公司」——这可能反映的是 COOWA
              在安徽注册的制造子公司，而不是一个毫无歧义的公司总部。
