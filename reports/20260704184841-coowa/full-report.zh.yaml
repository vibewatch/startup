      - number: '1.4'
        title: 规模、牵引力与里程碑
        blocks:
          - type: paragraph
            body: >-
              COOWA 已在全球 50+ 个城市和地区部署 10,000+ 台机器人，累计真实车队运行超过 45 million 公里。商业模式是结果即服务（RaaS）：COOWA
              按完成结果收费——清洁面积、完成行程、送达包裹——而不是一次性设备销售，这既抬高客户切换成本，也持续喂给 COOWA 数据飞轮。公司报告 2025 年收入超过 RMB1 billion，并在 2026 年 2
              月首次披露全年 EBITDA 转正，时间上与 WAM 2.0 发布重合。产品线覆盖 CooBus L4 接驳车、R0/D0 物业机器人以及 Qilin X3/Unicorn X1 环卫机器人；合作方包括
              Shanghai Pudong Development Group、Beijing Enterprises 关联的 北控集团和 Beijing E-Town Holdings，并在 Singapore 和 Abu
              Dhabi 实现常态化海外运营。早期环卫车试点可追溯到约 2018 年的 Shenzhen、Changsha 和 Hefei；到 2025 年 12 月，仅 Shenzhen 石井街道就有 36 台机器人巡逻约
              2.7 million 平方米。Pandaily 报道称，涉及十台以上部署的中国订单中，COOWA 份额约 80%，且单次部署平均合同额在 2022 至 2025 年增长 106%。COOWA
              还称自己是唯一在中国大陆四个一线城市（Beijing、Shanghai、Guangzhou、Shenzhen）都实现常态化商业服务的机器人公司。
