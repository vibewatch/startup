      - number: '2.3'
        title: 各细分市场的买方、用户与付款方
        blocks:
          - type: paragraph
            body: >-
              COOWA 三个细分市场各自有不同买方动作。市政环卫通过竞争性采购获得：bidcenter.com.cn 记录显示，COOWA
              在至少七个中国省份有数十个「清扫保洁及公厕管理市场化采购」项目中标公告；cnmra.com 报道，2025 年 5 月，该公司从 Zhejiang 某市综合行政执法局拿下单个 RMB280 million
              合同，作为当年超过 RMB1 billion 中标额的一部分——这确认城市或区县环卫 / 城管局是预算所有者，一线工作人员和调度员是日常用户。智慧物业机器人走另一条销售路径：JLL
              中国房地产科技（proptech）数据库记录，自 2012 年以来 AI 相关投资交易超过 830 起，总额超过 $38 billion，说明物业所有者和运营方已把 AI
              赋能楼宇技术（包括清洁和巡逻机器人）视为成熟的资本配置类别，设施 / 物业管理人员是用户，物业管理公司或 HOA 是付款方。最后一公里配送机器人主要卖给零售商、外卖平台和物流服务商，依据 Global
              Market Insights；Future Market Insights 指出，最高 10kg 的载重能力主导需求，因为它匹配典型的生鲜、药品和餐食配送订单大小。横跨三类市场的一条动态利好 COOWA 的
              RaaS 模型：Mordor Intelligence 指出，设施管理公司越来越多地把保洁支出从资本购买改列为经营租赁，专门为了释放机器人即服务预算；无论具体细分市场或预算所有者是谁，这都会降低采用门槛。
