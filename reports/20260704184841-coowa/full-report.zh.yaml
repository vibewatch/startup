      - number: '1.5'
        title: 风险信号与反向证据
        blocks:
          - type: paragraph
            body: >-
              独立的批判性报道提出两类担忧。第一，Guancha 的技术分析认为，COOWA 的 CooWAIM 2.0 世界模型本质上是一套自动驾驶避障系统——测试场景是 Wuhu 一条辅路，主角是一辆扫路车——而不是
              Zhiyuan GE 2.0、Xingdong Ctrl-World、Beijing-Humanoid Pelican-Unify 等对手追逐的精细、多关节操作世界模型；该分析质疑，这种更窄的技术护城河能否支撑
              COOWA 的资本市场估值叙事。第二，China Biz Insider 的行业分析发现，中国 25+ 家具身智能独角兽中，大多数只有 18-24 个月现金跑道；分析师预计 2027-2028
              年会出现整合或下轮融资降估——尽管同一分析也点名 COOWA 是少数已经自我造血的例外之一，依据是其据报已经盈利。另一个问题是，COOWA 自身公开姿态谨慎：Shanghai Securities News 于
              2026 年 6 月 22 日询问 IPO 时，公司拒绝置评；围绕公司的事实报道也确有不一致——Edgen.tech 称 2025 年收入「超过 10 billion
              yuan」，约为三家独立媒体相互印证数字的十倍，其「总部在 Hefei」的说法也与其他来源印证的上海创立叙事冲突。这些冲突不必然指向不当行为，但凸显 COOWA 尚无经审计、可由第三方独立验证的财务报表公开。
