        title: 能力、定价与 GTM：COOWA 的差异化更多来自合同模式，而不是机器人形态
        blocks:
          - type: paragraph
            body: >-
              单看能力宽度，无法决定这个市场。Keenon 和 Pudu 都说明，当使用场景狭窄且运营重复时，客户会购买专业机器人车队；Gausium 在专业清洁上也证明了同一点。Brain Corp 和 Tennant
              在西方展示另一套逻辑：软件、分析、完工证明和服务覆盖，和机器本身同样重要。保留下来的来源呈现出一致模式：公开价格透明度很弱。多数厂商把买方导向演示、经销商或企业销售流程，这让流程适配和部署风险比标价更重要。这正是
              COOWA 按结果计费模式的意义。客户比较 COOWA 和硬件主导同行时，不只是比较机器人规格；客户还在比较供应商是否会承担建图、在线率、人员替代、完工证明以及部署后的持续迭代。Unitree
              是明显例外，因为它公开列出 G1 人形机器人价格，但这种透明度反映的是产品主导的硬件打法，而非城市运营服务合同。
