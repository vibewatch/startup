        title: 市场规模与采用尽调缺口
        blocks:
          - type: paragraph
            body: >-
              对估值相关尽调而言，三项缺口最重要。第一，审阅的发布方没有一家隔离出中国特定、三细分市场
              SAM/SOM，把市政环卫、智慧物业和最后一公里配送合并测算；本章受限口径数字（FM001）是作者通过加总更窄发布方口径得到的估算，不是有来源的第三方数字，应改用 COOWA
              自身中标数据作为需求侧代理，搭建自下而上模型。第二，COOWA 似乎没有披露三条业务线的分部收入或合同额拆分，无法按公司实际业务组合给测算口径加权，只能假设等权。第三，chinabizinsider.com
              给出的资本市场过热信号只是 2026
              年中快照；由于该行业情绪和已披露失败可能在几个月内变化，任何接近投资决策日的判断都应刷新这一数据。一个较小但与访问有关的缺口是，本次会话中，关于中国环卫工人工资拖欠的候选来源（academicjobs.com）被机器人验证页拦截，无法审阅，因此劳动力成本叙事只能建立在
              MDPI 学术研究和 SalaryExpert 薪资基准上。
