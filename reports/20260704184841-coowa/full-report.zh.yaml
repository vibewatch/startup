  - id: TV005
    title: 论点破裂与否决触发表
    columns:
      - 触发项
      - 证据 / 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - CSRC 备案被驳回或暂停
        - 经确认的 CSRC 境外上市备案驳回，或超过据称 2-3 个月时间线的长期暂停。
        - 移除近期上市催化，也重新打开全部估值披露不确定性。
        - 备案状态确认前，暂停任何新增承销判断。
      - - 招股书估值显著低于 $3B
        - HKEX 草稿或已提交招股书披露估值显著低于媒体所报 ~$3B 点位。
        - 会直接推翻本章的入场价假设。
        - 完全按披露招股书价格重新评估，而不是按媒体所报点位。
      - - 审计财务显示经济性更弱
        - 审计报表显示收入、利润率或在手订单转化明显低于 RMB1B+ / 已盈利叙事。
        - 牛市和基准情景都依赖盈利和在手订单转化声明经得起审计。
        - 将立场从“偏紧但不离谱”调整为“昂贵”；按审计数字重跑情景。
      - - 优先权 / 赎回条款让新增资本处于劣后
        - 披露清算优先权、棘轮条款或赎回权，使新增投资人相对未披露早期轮次处于不利位置。
        - 改变任何新增资金面对名义估值的经济现实。
        - 任何承诺前，要求完整股权结构表和优先权栈披露。
      - - 全行业倍数压缩
        - NDRC 点名中国 150+ 家人形 / 具身 AI 进入者存在过剩产能后，引发广泛估值重置。
        - 即便 COOWA 自身执行强，也未必挡住整个可比组倍数压缩。
        - 跟踪全行业融资和下轮下调数据，作为领先指标。
    notes: 上述均是否决触发项，不是泛泛风险；每一项都会直接伤及支撑据称估值所需的具体假设。
    claimRefs:
      - CV009
      - CV016
      - CV030
      - CV031
      - CV032
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 2026 年融资条款
        - 据称 >$600M 轮次中的优先顺序、清算权、棘轮条款，以及任何赎回 / MFN 条款。
        - 融资条款决定对新增资本而言，$3B 口径估值是否有真实经济含义。
        - 管理层 + 律师；已签署认购 / 条款清单文件。
      - - 审计财务
        - FY2025 审计及 FY2026 中期财务报表，用以佐证收入和盈利声明。
        - 当前数字来自公司且未审计；无法核验利润率和现金生成。
        - CFO 尽调包；审计师聘任函和报告。
      - - 监管备案状态
        - 确认 CAC 网络安全审查放行和 CSRC 境外上市备案状态。
        - 没有两者，上市无法推进；状态会实质影响近期催化时间线。
        - COOWA 提交后直接查 CAC/CSRC 登记；公司律师确认。
      - - 客户和在手订单数据
        - 客户级收入集中度，以及据称 RMB5B+ 在手订单转化为确认收入的比率。
        - 在手订单到收入的转化，是牛市和基准估值情景的核心。
        - 销售 / 财务尽调包；客户合同明细。
      - - 治理和国资投资人权利
        - 据称上海国资基金和 SoftBank China 参与所附带的任何治理、董事会或否决权。
        - 有国资背景的投资人权利可能影响控制权、退出灵活性或未来融资条款。
        - 股权结构表和股东协议审阅；董事会材料。
    notes: 上述问题刻意收窄到投资关键项；每一项都可能改变建议或可接受入场价。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV030
      - CV033
      - CV045
