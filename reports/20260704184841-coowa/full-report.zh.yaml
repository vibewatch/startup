      - number: '7.3'
        title: 运营、安全与技术风险
        blocks:
          - type: paragraph
            body: >-
              COOWA 的核心商业任务——自主街道环卫——是开放式感知问题。Yicai 对公司深圳运营负责人的采访称，街面垃圾「没有固定形状和边界」，需要判断材质、湿度和附着情况，已经超出简单避障。COOWA
              自己的表述是人机协作模式，而非全自动；员工仍要处理绿化带垃圾、粘在墙上的物品等任务。公司来源叙事（Guancha 基于单次访谈报道）把护城河归因于 50PB
              场景数据湖和摄像头-激光雷达双感知栈。方向上可信，但本轮研究未找到独立第三方将 COOWA 世界模型（品牌 WAM 2.0 / CooWAIM 2.0，按 TMTPost 对 2026 年 5 月发布的报道采用
              DAWN 架构）与中国其他具身 AI 或人形机器人模型对标验证；这是实在的技术护城河证据缺口，而不是已确认弱点。没有发现针对 COOWA 已落地机器人的公开召回、安全事故报告或 MIIT/SAMR
              执法行动；但中文登记库中缺少负面报道不应被解读为干净安全记录保证，尤其车队据称已超过 10,000 台机器人、覆盖 50+ 城市并累计运营 4,500
              万公里，这一规模本身就扩大了机械故障和责任索赔的统计暴露面。COOWA 近期专利申请集中在自主感知和轨迹规划软件，而非广谱机器人硬件 IP，意味着差异化集中在相对狭窄的算法层。
