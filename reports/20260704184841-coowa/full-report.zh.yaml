              million（6.1% CAGR），仅 Asia-Pacific 就预计到 2027 年 CAGR 为 18.7%。政策顺风进一步放大机会：Anhui 省每年预算约 RMB500 million
              补贴环卫机器人产业，Shenzhen 开放约 300 个「city + AI」应用场景。中国更广义具身 AI 行业仅在 2026 年 Q1 就通过 126 笔交易融资约 US$3.3 billion，COOWA
