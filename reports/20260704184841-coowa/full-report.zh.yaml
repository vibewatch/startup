      - number: '2.2'
        title: 市场规模：三个细分市场下的多发布方视角
        blocks:
          - type: paragraph
            body: >-
              没有一家发布方单独测算 COOWA 三个细分市场合并后的足迹，因此本章保留九个独立视角，而不是强行压成一个数字。最窄、最贴近市政的口径下，Intel Market Research 估算无人环卫清洁机器人
              2024 年市场为 $557 million，到 2034 年增至 $832 million，CAGR 仅 6.1%；同一家机构估算商用清洁机器人从 2025 年 $504 million 增至 2034 年
              $1,111 million（12.2% CAGR），人行道配送机器人从 2025 年 $1.5 billion 增至 2034 年 $15.2 billion，是本次审阅中增长最快的口径，CAGR 为
              29.2%。更宽、更包容的口径讲出另一套故事：Mordor Intelligence 和 Fortune Business Insights 估算整体清洁机器人市场（住宅 + 专业）2025 年为
              $16.9-18.2 billion，到 2030 年代初迈向 $38.5-76.6 billion；Global Market Insights 和 Future Market Insights
              估算更宽的最后一公里配送类别在 2025-2026 年为 $1.3-1.9 billion，到未来增至 $11.5-12.6 billion。相邻 AMR/AGV 数据点提供有用校验：Grand View
              Research 的全球 AMR 市场（2025 年 $4.74 billion）和 IMARC 的中国 AMR 估算（2025 年 $789.4 million）都更偏仓储 / 工业物流，而非 COOWA
              的市政 / 物业 / 配送组合，但它们确认中国已经是 AMR 增长最大的单一国家市场。IFR 的 World Robotics 2025 报告提供了单位层面的锚点：2024 年全球售出近 200,000
              台专业服务机器人（同比 +9%），运输 / 物流设备增长 14% 至 102,900 台，专业清洁设备增长 34% 至超过 25,000 台，RaaS 计费投放量增长 31%——这与 COOWA 自身 RaaS
              模式直接一致。一项中文行业媒体估算（faxiangongchang.com）认为，中国整个服务机器人市场 2025 年约 RMB200 billion（~$28 billion），约占全球服务机器人市场
              40%，并指出已在香港上市的同业 Geek+（市值 HK$21.3 billion）和 Yunji Technology（IPO 首日上涨 49%）已经被公开市场吸收——这对 COOWA 待定香港 IPO
              具有语境意义。
