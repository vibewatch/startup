      - - Keenon
        - 室内服务 / 酒店 / 餐饮机器人
        - 70+ 个国家和地区；600+ 个城市
        - 餐厅、酒店、医院、零售、物业室内
        - 配送 + 酒店服务车队编排强；室内服务产品线广
        - 与户外环卫和公开道路自动驾驶重叠较少
      - - Pudu
        - 向具身 AI 扩展的商用服务机器人
