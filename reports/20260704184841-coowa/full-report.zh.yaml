      - number: '5.2'
        title: 架构与运营技术
        blocks:
          - type: paragraph
            body: >-
              COOWA 的技术核心是「Coowa Physical AI」，由自研 World-Action Model（WAM
              2.0）驱动；公司称该模型将空间理解、物理推理和自主决策融合到公园、人行道和主干道场景中。WAM 2.0
              先用自监督多任务未来帧预测和场景结构推断阶段训练，再叠加与轨迹行为对齐的动作监督，随后在真实机器人数据上进行开环校准，最后在 AIGC 生成的仿真环境中做闭环强化学习。基于这个底座，COOWA 派生出 Drive
              AI（自动驾驶，披露的平均每次关键干预里程超过 150,000km）和 Work AI（基于 VLA 的环卫任务执行模块）。并行的 UrbanVLM 系统采用云 / 边分离——32B
              参数「Large」模型分析视频并支持城市治理决策，3B 参数「Tiny」模型负责机器人端实时场景认知。所有这些运行在自建 2,000 PFLOPS 计算集群和约 50PB 数据湖上，数据湖每天处理
              100,000+ 个场景片段，仿真栈每天生成约 300,000km 模拟驾驶里程。2026 年 5 月，COOWA 又在其上叠加新的「CooWAIM 2.0」交互式世界模型，采用自研 DAWN
              架构；独立报道称其将计算工作量降低约 75%，但独立技术评论认为，其披露的基准分数低于面向精细操作的人形机器人世界模型领先者，而不是车辆避障方向。
