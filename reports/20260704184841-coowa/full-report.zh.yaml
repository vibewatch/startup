      - number: '8.3'
        title: 融资与估值背景、进入纪律及稀释/优先权悬置
        blocks:
          - type: paragraph
            body: >-
              COOWA 工商登记显示，截至 2026 年 3 月，公司已完成从天使轮到 D 轮的九轮融资；最近一轮正式记录日期为 2022 年，由 Asia Investment Capital 领投，D 轮估值约人民币
              137 亿元。媒体另行报道一轮更新、尚未登记的超过 $600M 融资，投资方包括 SoftBank China Venture Capital、Asia Investment
              Capital（重复投资人），以及——按上海投资促进报道——上海国资 Lead Fund（上海国投先导基金），投后估值超过 $3B。这比上次确认估值约上台阶
              1.6x，跨越的中间年数不清；按成长型股权投资标准这只是温和倍数扩张，但截至本报告日期，尚未由任何公司文件、条款清单或监管披露确认。进入纪律要求：（1）公司确认或文件确认该轮已交割，包括精确投资人持股；（2）完整披露清算优先权、反稀释棘轮条款以及新股附带的任何赎回权，当前均未公开；（3）经审计财报印证人民币
              10 亿元+ 收入和盈利说法；（4）确认 CAC 网络安全审查和 CSRC 境外上市备案状态。在这些条件满足前，任何新增资本都应把披露的 $3B 估值视为天花板，而非地板，并把稀释/优先权不透明折价计入价格。
