    summary: COOWA 在商业规模和市场顺风上得分较高，但在财务披露质量和监管备案确定性上低得多。
    data:
      items:
        - label: 市场需求
          score: 8
          detail: 渗透不足的环卫 / AGV 市场 CAGR 超过 12%，支撑多年需求。
          tone: positive
        - label: 商业证明
          score: 8
          detail: 10,000+ 台已部署机器人、45M+ km 和声称盈利，都是真实规模信号。
          tone: positive
        - label: 护城河 / 差异化
          score: 6
          detail: RaaS 模式和自有世界模型真实存在，但没有独立技术基准。
          tone: neutral
        - label: 财务披露质量
          score: 3
          detail: 收入、盈利能力和融资条款未经审计，且来自公司口径。
          tone: negative
        - label: 监管备案确定性
          score: 3
          detail: 截至 runDate，CAC / CSRC 备案状态未确认。
          tone: negative
        - label: 估值支撑
          score: 5
          detail: 隐含倍数与同行一致，但依赖一轮未登记融资和未经审计收入。
          tone: neutral
        - label: 证据质量
          score: 5
          detail: 第三方方向性证据不错，但披露质量达不到上市公司水平。
          tone: neutral
