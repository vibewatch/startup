      - number: '7.4'
        title: 伙伴、依赖与集中风险
        blocks:
          - type: paragraph
            body: >-
              COOWA 2026 年融资报道只点名两家支持方——SoftBank China Venture Capital（不同于 SoftBank Group 的 Vision Fund）和 Asia
              Investment Capital / Asian Infrastructure Investment Bank——没有披露其他机构共同投资人；这使首次上市前资本提供方较为集中。COOWA
              自身登记摘要称，公司与 Chery 和 BAIC 围绕自动驾驶产品线开展战略制造合作，硬件生产集中在少数 OEM 伙伴；新近报道的与广州白云区共建华南总部，也延长了其对地方政府关系的依赖。COOWA
              环卫订单被描述为主要来自地方政府和国有环卫公司，具体中标（如金华人民币 2.8
              亿元清扫市场化招标，以及深圳坪山区多个「城市管家」招标）体现了以市政采购驱动的收入基础，其增长依赖地方财政能力和自动化政策支持延续。计划中的香港上市本身也把执行风险集中在两家银行保荐团队（Huatai
              Securities 和 Deutsche Bank），未披露次级承销团。最后，COOWA 自身登记信息提示其有 51 家关联集团企业，并在 Qichacha 自有风险监测体系下有 6
              项「重要风险」；独立分析师评论则统计中国有 100 多家具身/人形机器人竞争者，至少 25 家估值已超过人民币 100 亿元，而中国国家发展和改革委员会 2025 年 11 月公开警示行业存在资本过热和无序竞争。
