  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              COOWA 的投资论点在于，它是少数已有真实、经常性商业收入而非纯展示热度的中国具身 AI 公司之一：媒体报道称，其在 50+ 城市部署超过 10,000 台机器人，累计运营里程 4,500 万+ 公里，采用
              Result-as-a-Service（RaaS）经常性收入模式，2025 年收入超过人民币 10 亿元，并由公司声称已盈利——在中国国家发展和改革委员会已警示 150+
              家人形机器人入局者过热的行业里，这一组合少见。公司的市场（环卫机器人、市政服务、城市出行）真实且渗透率低：第三方分析师预测，全球商用清洁机器人市场将从 2025 年 $504M 增长至 2034 年
              $1,111M（CAGR 12.2%），中国 AGV 市场将从 2024 年 $1.07B 增长至 2030 年 $2.18B（CAGR
              12.53%）。核心反论点是：客户集中在地方政府和国有环卫买方；车辆制造依赖 Chery/BAIC 等 OEM；媒体称两到三个月后赴港上市，但 CSRC/CAC
              备案尚未确认。估值披露缺口又强化了反论点：唯一经登记确认的定价轮是 2022 年 D 轮，估值人民币 137 亿元（约 $1.9B）；媒体称新的、尚未登记的融资超过 $600M，投后估值超过
              $3B——截至本报告日期，这一标记完全依赖未经审计的二手报道，而非公司或监管文件。
            claimRefs:
              - CV001
