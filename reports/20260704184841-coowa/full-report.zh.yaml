  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：三个细分市场以及排除项
        blocks:
          - type: paragraph
            body: >-
              COOWA 公开材料将业务描述为三条线：智慧出行（自动驾驶接驳车）、智慧物业（轮式 /
              足式机器人）和智慧城市环卫，并采用结果即服务（RaaS）模式，按完成结果而非设备销售收费。这个自我定位，与第三方分析师给「机器人清洁」市场做规模测算的方式并不完全匹配。The Business Research
              Company 的「消毒机器人」类别明确聚焦医疗和酒店场景的消毒（UV 光、喷雾、化学制剂），相较 COOWA 市政环卫机器人做的道路清扫、垃圾收集和公厕管理，范围明显更窄、类别也不同。相比之下，Intel
              Market Research 的「无人环卫清洁机器人」类别明确覆盖城市道路、公园和工业区的垃圾收集、吸尘和地面清洁，更接近 COOWA 的市政核心线。同时，Mordor Intelligence 和
              Fortune Business Insights 的宽口径「清洁机器人」报告把消费者扫地机器人也纳入（COOWA
              不服务该细分），再加上商业和工业设备，把标题数字抬到数百亿美元。结果是，看似相近的市场报告标题，实际对应的可服务支出差异很大；任何单一标题 TAM 数字，在用本表核对范围前都应保持怀疑。
