  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 方向
      - 何种证据会改变判断
    rows:
      - - 部署机器人超过 10,000 台、运营里程 45M+ 公里，说明商业化规模真实，不只是试点热度。
        - 正方
        - 若车队增长或利用率经核验放缓，规模前提会变弱。
      - - RaaS 经常性收入模式叠加公司声称 2025 年盈利，在中国具身 AI 同行中少见。
        - 正方
        - 若审计财务确认收入和利润率，论点会明显增强。
      - - 环卫 / AGV 市场渗透率低（当前 $504M-$1.07B，CAGR 12%+），支撑多年需求。
        - 正方
        - 若市政采购预算或中标放缓，论点会变弱。
      - - 据称 ~$3B 估值没有任何备案确认，并意味着在未登记时间窗口内较上一估值上跳 1.6x。
        - 反方
        - 若公司确认该轮交割并披露条款，可消除估值确认问题。
      - - 没有审计财报能佐证 RMB1B+ 收入或盈利声明。
        - 反方
        - 发布 FY2025/FY2026 审计报表将补上最大证据缺口。
      - - 客户、OEM 和资金提供方集中（政府 / 国企买方、Chery / BAIC、2-3 名具名投资人），抬高依赖风险。
        - 反方
        - 披露更广、更分散的客户和投资人基础，可降低集中度担忧。
    notes: 论点刻意对价格敏感；它们描述据称估值已经纳入的假设，而不只是业务本身的事实。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV012
      - CV013
      - CV041
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 香港 IPO 按据称时间表通过审查；在手订单转化，收入扩张至 ~$400M；市场按 Unitree 式 ~24-25x 倍数定价。
        - 隐含股权价值 ~$8-10B，约为据称 2026 年私募估值的 2.5-3x。
        - 需要监管干净放行、在手订单转化，且行业倍数不系统性修正。
        - 中低
      - - 基准
        - 上市推迟后推进；审计收入落在约 $250-300M，真实利润率偏薄；NDRC 预警后倍数回归至 ~12-15x。
        - 隐含股权价值 ~$3.0-4.2B，大致持平至略高于据称估值。
        - 即便执行扎实，也未必跑赢全行业倍数正常化。
        - 中
      - - 熊市
        - CSRC 备案卡住或被驳回；审计财务显示利润率更弱或优先权结构未解；行业整合把倍数压到 6-8x。
        - 隐含股权价值 ~$1.0-1.5B，低于最近确认的 $1.9B D 轮估值。
        - 如果披露不及预期或备案卡住，即使需求不崩，倍数也会压缩。
        - 中
    notes: 由于公开证据对审计利润和现金流转化支撑太弱，情景采用收入倍数框架，而非 DCF 质量模型。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 可比意义
      - 局限
    rows:
      - - 'UBTech（HKEX: 9880）'
        - 市值 / FY2025 收入
        - ~HK$54.7B / RMB2.00B ≈ 25x（按 RMB 调整）
        - 有审计 HKEX 文件的中国上市人形机器人邻近可比公司，最接近 COOWA。
        - 亏损（净亏损 RMB703.2M）；消费 / 教育产品组合比 COOWA 更宽。
      - - Unitree（科创板 IPO 申报）
        - IPO 隐含市值 / 2025 收入
        - 收入倍数：~¥42.0B / ¥1.7B ≈ 24.7x
        - 有公开监管申报且盈利的中国机器人同行，是最接近的可比对象。
        - 人形 / 四足硬件重心不同于 COOWA 的车队服务 / RaaS 模式。
      - - Pony AI（自动驾驶出行）
        - FY2025 收入 / 净亏损
        - $90.0M 收入 / $76.8M 净亏损
        - 有审计 HKEX 年报的邻近具身出行上市可比公司。
        - 自动驾驶出租车单位经济和资本强度不同于环卫 / 出行 RaaS。
      - - 'WeRide（Nasdaq: WRD）'
        - FY2025 收入（推导）/ 净亏损
        - ~$98M 收入 / $236.6M 净亏损
        - SEC 申报的自动驾驶上市可比公司，显示行业烧钱强度。
        - 收入数字由客户集中度披露推导，不是公司列示的总收入项目。
      - - 'Tennant Company（NYSE: TNC）'
        - 市值 / TTM 收入
        - 收入倍数：$1.49B / $1.21B ≈ 1.2x
        - 盈利上市公司，作为传统工业清洁设备估值底部参照。
        - 传统硬件商业模式，不是 AI / 机器人增长型可比。
      - - 'iRobot（OTC: IRBTQ）'
        - 市值 / TTM 收入
        - ~$5M / $547M
        - 警示性可比对象，说明消费机器人估值坍塌可以很快。
        - 困境 / 近破产状态让它只适合作为下行情景参照，不是直接同行。
      - - Gaussian Robotics（中国私营）
        - 累计融资额
        - $361.5M，13 轮累计融资；估值未披露
        - 最接近的同国别、同赛道中国私营商业清洁机器人同行。
        - 估值和收入数据在数据供应商付费墙后。
      - - COOWA（自我参照）
        - 上一轮确认融资与据称新轮次
        - RMB13.7B（2022 D 轮）对比 >$3B（2026，未登记）
        - 锚定本章入场纪律的核心估值披露缺口。
        - 截至 runDate，较新估值没有公司或监管备案佐证。
    notes: 可比组横跨中国上市机器人同行、邻近自动驾驶出行可比公司、成熟 / 困境上市估值底部参照，以及 COOWA 自身已披露轮次，因为没有任何单一同行能干净匹配其 RaaS 环卫 / 出行模式。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-useful public and disclosed-private comparables accessible as of the
        runDate, but is not exhaustive because several China embodied-AI peers keep valuation and revenue undisclosed or
        paywalled.
    claimRefs:
