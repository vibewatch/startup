      - number: '1.3'
        title: 融资历史、投资方与 IPO 计划
        blocks:
          - type: paragraph
            body: >-
              2019 年，COOWA 从纯自动驾驶技术供应商转向出行 / 维护即服务（MaaS）全栈服务模式，用更长研发周期换取黏性更强的经常性订单积压。2026 年前最后一轮公开披露融资约为 2022 年 Series
              D，由 Asia Investment Capital（亚投资本）领投，SoftBank China Venture Capital 和 CCV（创世伙伴）也参与。值得注意的是，Mugglehead
              的英文报道将「Asian Infrastructure Investment Bank」（AIIB）列为投资方，而审阅的所有中文媒体均写作「Asia Investment
              Capital」——二者是不同机构，这一差异更可能是翻译混同，而不是两个独立投资人。Guancha 的报道进一步区分了 SoftBank China Venture Capital（聚焦中国的基金）和
              SoftBank Group Corp 旗下全球 Vision Fund 实体，提醒大多数「软银支持」标题模糊了这一区别。2026 年，COOWA 低调完成一轮超过 US$600 million
              的融资，投后估值升至 US$3 billion 以上。据报道，Huatai Securities 和 Deutsche Bank 正作为联席保荐人筹备香港 IPO 申请，预计在 2026 年 6 月 22
              日报道后的两到三个月内递交；不过 Shanghai Securities News 当日向 COOWA 求证时，公司拒绝置评。
