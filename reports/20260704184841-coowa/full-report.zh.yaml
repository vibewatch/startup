      - number: '3.4'
        title: 耐久性仍有争议，因为专精厂商、在位者和价格战新进入者从不同角度进攻
        blocks:
          - type: paragraph
            body: >-
              这条护城河足以认真对待，但还没稳到可以毫无保留地作为投资依据。Guancha 的批评很重要，因为它认为 COOWA
              的世界模型领先性目前最适配移动城市自主，而不是推动人形机器人热潮的更精细、接触密集型操作难题。这会缩窄 COOWA 今天能声称真正前沿优势的问题集合。与此同时，Gausium
              已经拥有庞大的清洁车队数据和明确的部署效率路线图，因此 COOWA 不能把清洁专精厂商视为弱硬件模仿者。另一侧，China Biz Insider 关于人形机器人价格压缩和 BYD
              入局的报道，说明一旦汽车级资本和供应链进场，硬件叙事可以多快商品化。最后，Brain Corp 和 Tennant 证明，软件平台加服务网络不是中国独有打法。换言之，COOWA
              的差异化在世界模型成熟度、车队数据和按结果计价结合处最强；当买方可以替代为更便宜硬件、更根深蒂固的清洁专精厂商或更大渠道主导在位者时，它最弱。
