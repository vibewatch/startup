      - - UBTECH
        - 上市人形机器人平台公司
        - 港股上市；2025 年报；人形机器人年化产能 >6,000 台
        - 工业人形机器人部署、制造、物流
        - 上市公司披露 + 可见工业人形机器人规模
        - 当前与 COOWA 环卫 / 物业工作流的重叠仍是间接的
      - - AgiBot / Zhiyuan
        - 私有人形机器人规模化候选公司
        - IPO 估值目标 HK$40-50B；顶级投资人组合
        - 制造、物流、科研、智能制造
        - 资本通道和政策顺风支撑人形机器人商业化
        - 与 COOWA 现场服务运营的商业重叠仍有限
      - - Unitree
        - 低成本人形机器人和四足机器人规模化公司
        - RMB4.202B IPO 计划；2025 年出货 5,500+ 台人形机器人；公开 G1 定价
        - 人形机器人、四足机器人、开发者、工业采用方
        - 定价透明，出货动能异常强
        - 硬件驱动的运动能力尚不等于城市运营服务深度
      - - Brain Corp / Tennant
        - 西方自动驾驶平台 + 清洁设备老牌厂商
        - 40,000+ 台已部署机器人；Tennant 销售额 US$1.20B；100+ 个经销国家
        - 零售、仓储、工业和公共室内清洁车队
        - 软件分析 + 西方市场直销 / 服务网络
        - 地域优势更多落在室内地面清洁，而非市政户外自动驾驶
    notes: 表中同时纳入直接对手和相邻进入者，因为买方要完成同一类自动化任务，不一定只找 COOWA 的翻版； 清洁专才、室内服务机器人、人形机器人或老牌自动驾驶平台都可能替代。
