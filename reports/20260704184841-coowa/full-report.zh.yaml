      - number: '4.2'
        title: 进入市场动作与销售效率
        blocks:
          - type: paragraph
            body: >-
              行业报道将 COOWA 约 20 人销售团队与五年内业务量增长 17x
              联系起来；如果准确，这对一家硬件加服务公司而言是罕见的资本高效进入市场动作，但没有来源披露当前员工数、配额结构或「业务量」的严格定义。COOWA 按结果计费的 RaaS/MaaS
              结构，设计上会拉长客户关系，并相较一次性硬件销售降低复购或扩容订单所需的边际销售投入。COOWA 声称在中国十台以上部署订单中份额约 80%，且单次部署平均合同额在 2022 至 2025 年增长约
              106%——与此同时，国内低端竞争者 Saite Intelligent 在 2026 年推出约 RMB99,000 的直接售价，或每月约 RMB2,999
              的租赁价，释放出价格竞争正在出现的信号。全行业看，2026 年约 35% 的新仓储机器人部署采用 RaaS 模式；计入捆绑维护、软件和硬件换新后，五年总成本通常比直接购买高 30-50%。由于 COOWA
              不公布自身 RaaS 单台定价，这可以作为有用的变现结构代理。
