  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与组合
        blocks:
          - type: paragraph
            body: >-
              COOWA（酷哇科技）卖的是结果，不只是硬件：在其自称的「结果即服务」（RaaS）商业模式下，市政环卫部门、物业管理方和城市公交运营者购买清洁后的街道、已运营的接驳服务或已覆盖的物业任务，而不是直接买车。披露的产品矩阵横跨三条业务线。智慧城市环卫包括四类车辆——66kg
              的四足 + 机械臂 X0「Lingxi」，用于路缘和绿化带；675kg 的 X1「Unicorn」自动驾驶清扫车，用于人行道和支路；3 吨级 X3「Qilin」家族（吸扫、清洗和道路养护变体），用于主干道；以及
              18 吨 T18「Titan」原生前装设计（非改装）线控扫洗车，用于大型市政合同。智慧出行线由 CooBus L4 小巴承担，这是一款无驾驶舱、无方向盘、10 座接驳车。智慧物业线由 R0 轮腿式机器人和 D0
              四足机器人承担，两者仍处在相对早期商业阶段。每条线的成熟度和买方画像不同：环卫车队和 CooBus 已在 50+ 城市重复商业部署，而 COOWA 官网称 R0/D0 处于内部测试阶段，目标是 2025 年 Q4
              推向市场；这个缺口值得继续跟踪，而不是假定已经闭合。
