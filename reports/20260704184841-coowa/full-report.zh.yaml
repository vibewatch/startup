      - number: '5.5'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              COOWA 披露了户外物业机器人的防护与危险环境等级：R0 为 IP68，D0 为 IP67
              且具备防爆认证；公司还称大规模连续运营中「无重大安全接管记录」，但该说法未经审计，也无法由任何已查阅独立来源验证。已查阅的所有官方技术、产品和关于页面中，COOWA
              均未披露任何自动驾驶车辆或机械臂产品的正式功能安全或工业机器人安全认证（例如 ISO 10218 类标准），也没有来源披露公开的数据隐私、视频留存或市政监控数据处理政策，以约束 UrbanVLM 在 COOWA
              运营城市中持续摄取街景视频。行业层面，中国国家发展和改革委员会 2025 年 11 月公开警示，中国 150+
              家具身智能和人形机器人公司存在产品同质化过度与产能过剩风险，并称监管部门将建立市场进入/退出机制；即便 COOWA 自身环卫/CooBus
              业务并非专做人形机器人，该信号仍作用于其更广竞争环境。另有投资研究评论认为，COOWA 的盈利和效率说法在公司来源的中文媒体之外尚未验证，在其他监管环境中也未必可复现。
