  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：COOWA 同时面对直接服务机器人同行和相邻人形机器人叙事
        blocks:
          - type: paragraph
            body: >-
              COOWA 面对的不是一组整齐的竞争对手。最接近的直接重叠来自专业服务机器人厂商，它们已经把清洁、配送或物业自动化结果卖进商业和公共空间。在这一类中，Gausium
              是最强的专用清洁智能对手，因为它把庞大装机车队与地面护理、远程部署和维护自动化的深度流程专长结合起来。Keenon 和 Pudu
              在室内服务宽度上更接近：两者都覆盖清洁以及酒店餐饮或配送场景，但更偏餐厅、酒店、零售和室内物业流程，而不是 COOWA 的户外环卫和城市接驳车版图。第二类竞争者是人形机器人相邻阵营——UBTECH、AgiBot
              和 Unitree——它们与 COOWA 当前收入组合重叠较少，但直接争夺投资人心智、技术人才，以及定义具身智能领导地位的权利。第三类是 Brain Corp 和 Tennant
              等西方在位者，证明了自主软件叠加装机基础分销在海外依然有力。现状也不可忽略：市政承包商、设施运营商和内部物业团队仍可选择人工、改装设备或局部自动化，而不是进行城市级 COOWA 部署。
