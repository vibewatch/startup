            body: >-
              iFeng Finance 认为，以约 RMB1 billion（约 US$140 million）2025 年收入支撑约 US$3 billion
              估值，意味着收入倍数偏高；香港投资人历史上对未盈利科技上市公司定价保守，IPO 时可能打折。鉴于 RaaS/MaaS 经常性计费、已披露 EBITDA 转正以及超过 RMB5 billion
              的订单积压，COOWA 的收入质量看起来强于多数赴 IPO 前中国具身 AI 同行；然而，缺少经审计利润率或现金披露，且 2025 年收入在看似可信的不同媒体之间存在约十倍差异，使得独立财务结论必须等 COOWA
              港交所招股书后才能给出。最大的单项尽调阻碍是没有任何经审计财务报表；次级阻碍包括分部收入、客户集中度、现金头寸和股权结构未披露。
