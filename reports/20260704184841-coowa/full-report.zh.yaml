      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景：COOWA 香港 IPO 按媒体所称两到三个月时间表通过 CAC/CSRC 审查，经审计财务确认收入随据报人民币 50 亿元+ 订单储备转化而向人民币 30 亿元（约 $400M）爬升并保持盈利，市场按
              Unitree 约 24–25x 收入基准给 COOWA 定价，对应股权价值 $8B–$10B，约为 2026 年媒体所称私人估值的 2.5–3x。基准情景：上市延后推进，经审计 2026 年收入落在人民币
              18–22 亿元（约 $250M–$300M），净利率薄但真实，市场给予 12–15x 的更保守倍数，符合 NDRC 警示后行业正常化，对应估值大致持平或略高于媒体所称
              $3B（$3.0B–$4.2B）。熊市情景：CSRC 备案停滞或被拒，经审计财务显示利润率明显更低，或关联方/优先权复杂度未解决；更广具身 AI 行业整合（独立评论称中国 25+ 家估值超过人民币 100
              亿元的独角兽现金续航期仅 18–24 个月）把倍数压缩至 6–8x，且收入持平或下滑，对应估值约 $1.0B–$1.5B，甚至低于上一次工商登记确认的 $1.9B D
              轮估值。三种情景差距很大，主要因为在公开披露仍很不成熟的情况下，倍数选择而不只是收入增长，驱动了大部分估值波动。
