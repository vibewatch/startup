      - number: '8.2'
        title: 建议、置信度、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              建议：继续研究/跟踪，而不是在媒体所称约 $3B 估值上无视价格买入。置信度：中等——公开证据印证了 COOWA
              的运营规模、商业模式和行业顺风，但在上市级财务、融资条款和监管通关状态上较弱。风险评级：高，驱动因素包括未经审计财务、未确认 IPO 监管路径、诉讼历史（工商登记显示 26 起司法案件、47
              条法律诉讼记录）、OEM/客户/资本集中，以及 NDRC 已点名的拥挤竞争场。估值立场：偏紧但不荒谬——媒体所称约 $3B 估值基于披露 2025 年收入，隐含低 20x 收入倍数，与中国机器人同行
              Unitree（科创板 IPO 申报约 24.7x）和 UBTech（按 HKEX 上市市值约
              25x）大致一致，并未明显高出；但底层财务披露仍很薄。目标姿态：只有在私人尽调补齐融资条款、经审计财务和监管备案缺口后，3–5 年持有才合适；否则，不应在名义估值上投入资本，除非有结构性下行保护。
