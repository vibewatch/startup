        - Pudu 在渠道结构上比许多同行更透明，但完整车队经济性仍不透明
      - - Unitree
        - 官方 G1 标价 US$13,500；EDU 需联系销售
        - 基础机型可直接购买，高阶版本走定制销售
        - 官方产品页和商店都显示硬件优先定价
        - 人形机器人硬件走向透明价格竞争的速度快于服务机器人
      - - UBTECH
        - 第三方定价信号显示 Walker S2 约 US$80,000
        - 工业企业销售
        - 公开订单和产能报道可见，但没有标准目录价目表
        - 人形机器人工业定价仍由企业销售主导，尽管披露好于大多数服务机器人
      - - Brain Corp / Tennant
        - 集成方案表述明确，但定价以报价为主
        - 设备 + 软件 + 生命周期支持
        - 公开来源强调商业影响和简化采购，不强调单机价格
        - 西方老牌厂商卖可靠性和支持覆盖，不卖透明机器人 ASP
    notes: 本表比较公开定价透明度，不代表真实成交经济性。留存来源对 Unitree 和 RobotLAB 渠道定价的证据最强， 对 COOWA 实际服务合同条款最弱。
