  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、定价与收入组合
        blocks:
          - type: paragraph
            body: >-
              COOWA 通过自称「结果即服务」（RaaS）的模式变现机器人车队，向客户收取已完成结果费用——清洁面积、完成行程或合同约定在线率——而不是一次性设备销售。这源自 2019
              年转型：公司不再直接出售自动驾驶技术，而是转向出行 / 维护即服务（MaaS）全栈模式，用近期硬件收入换取经常性订单积压。COOWA 没有披露三大业务支柱（Smart Mobility、Smart
              Property、Smart City Stewardship）的逐项收入拆分，不过公开报道暗示 Smart City Stewardship（环卫机器人）是最大贡献者。COOWA 报告 2024 年收入约
              RMB700 million；至少四家独立媒体称其 2025 年收入增至超过 RMB1 billion，截至 2026 年中订单积压超过 RMB5
              billion。一线城市业务（Beijing、Shanghai、Guangzhou、Shenzhen）占收入比重从 2022 年不到 2% 升至 2025 年约 25%。值得注意的是，Edgen.tech 另称
