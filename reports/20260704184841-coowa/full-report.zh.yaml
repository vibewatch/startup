  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - 蓝领劳动力老龄化 / 收缩
        - 驱动
        - 当前 / 持续
        - 提高客户为自动化环卫和物业劳动力替代付费的意愿
        - 在全国汇总数据之外，验证分区域缺工数据
      - - 环卫 / 保洁工资基准上升
        - 驱动
        - 当前
        - 相较人工队伍，RaaS 定价的 ROI 叙事更好讲
        - 获取 COOWA 单合同单位经济性，并对照本地工资数据
      - - RaaS / opex 重分类采购模式
        - 驱动
        - 当前 / 持续
        - 降低 capex 门槛，让设施经理把机器人按服务费用列支
        - 确认 COOWA 各项目的合同期限和取消条款
      - - 国家产业政策（“十五五”规划、MIIT 人形机器人指导意见）
        - 驱动
        - 2026-2030
        - 释放国家层面资本和示范区支持将持续的信号
        - 跟踪补贴 / 试点区实际拨付，而不只看政策表述
      - - 公开市场对中国服务机器人上市的胃口（Geek+、Yunji 香港 IPO）
        - 驱动
        - 当前
        - 改善包括 COOWA 在内同业的后期融资和退出选项
        - 跟踪 COOWA 自身 IPO 申报进展及可比公司上市后表现
      - - 强制性 AV / 机器人安全认证收紧（MIIT 2027 标准、CSET 安全员规则）
        - 约束
        - 2026-2027
        - 推高合规成本，并可能要求车内 / 远程安全员，压低近期单位经济性
        - 确认新规则如何区分低速环卫 / 配送机器人与乘用 AV
      - - 市场定义碎片化，且各发布方自成口径
        - 约束
        - 持续
        - 单一标题 TAM 不可靠，也让投资人更难测算规模
        - 用 COOWA 自身投标数据做一版中国自下而上的规模测算
      - - 资本市场过热 / 具身 AI 同业现金跑道短
        - 约束
        - 2026-2028
        - 预示可能出现整合或估值下调融资，进而挤压定价和市场结构
        - 跟踪同业截至 2027-2028 年的融资轮次、估值和现金跑道披露
      - - 市政采购按省市分散、竞争性招标，不是集中采购
        - 约束
        - 持续
        - 需要逐城、逐区推进销售执行，拖慢全国放量
        - 持续梳理 COOWA 中标率和地域集中度
      - - 家用机器人类别主导“清洁机器人”标题 TAM 数字
        - 约束
        - 持续
        - 高估真正对应 COOWA 市政 / 物业 / 配送重点的可服务市场
        - 始终把标题清洁机器人 TAM 拆成消费端与商业 / 市政端
    notes: 五个驱动因素和五个约束因素按相同颗粒度列出，以便权衡其对采用节奏和估值的净影响，而不是预设结论。
