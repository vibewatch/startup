      - number: '8.5'
        title: 可比公司组
        blocks:
          - type: paragraph
            body: >-
              最有决策价值的可比公司分三层。第一，上市/准 IPO 中国机器人同行：UBTech（HKEX: 9880）市值约 HK$54.7B，对应 FY2025 收入人民币 20.0 亿元（同比
              +53.3%）和净亏损人民币 7.032 亿元，即便亏损仍隐含约 25x 收入倍数；Unitree 科创板 IPO 申报目标最低市值约 ¥42.0B，对应 2025 年收入 ¥1.7B、调整后净利润
              ¥600M（约 24.7x 收入且盈利），较其 2025 年 6 月 ¥12.7B 私募估值上台阶。第二，相邻自动出行可比：Pony AI 披露 FY2025 收入 $90.0M、净亏损
              $76.8M；WeRide 披露 FY2025 收入约 $98M、净亏损 $236.6M——两者资本效率均远低于 COOWA 声称的盈利水平，不过自动驾驶出租车经济性与环卫/出行 RaaS
              在结构上不同。第三，成熟和困境公共市场地板：Tennant Company 是盈利的上市工业清洁设备制造商，交易约为 1.2x 收入（$1.49B 市值 / $1.21B 收入）；iRobot
              则是困境仙股警示案例（约 $5M 市值，对应 $547M 收入和 $208.7M 亏损），显示若没有可持续盈利路径，消费机器人估值可以多快坍塌。Gaussian Robotics 是 COOWA
              最接近的同国、同赛道私营商用清洁机器人同行，13 轮共融资 $361.5M，但估值条款藏在数据提供商付费墙后；这说明私募估值不透明是行业常态，不是 COOWA 特有红旗。
