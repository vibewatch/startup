  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 概览：风险框架与严重性排序
        blocks:
          - type: paragraph
            body: >-
              COOWA（Kuwa Technology / 酷哗科技）是一家总部在上海、注册在安徽的自主环卫、城市物流和出行机器人运营商，成立于 2015 年；据报，公司 2025 年收入超过人民币 10
              亿元且已盈利，并正筹备香港 IPO，顾问为 Huatai Securities 和 Deutsche Bank。该画像叠加本章按严重性排序的五类风险：监管/法律（CSRC/CAC
              备案状态、诉讼历史、牌照均未确认完全闭环）、运营/安全/技术（开放式感知任务、世界模型缺少独立基准）、伙伴/依赖/集中度（两个具名融资支持方、两个具名 OEM
              伙伴、政府主导客户基础、两家银行组成的保荐团队），以及财务/模式/执行（未经审计的盈利说法，以及估值已大幅跳出公司上一次登记确认融资轮）。严重性最高、解决度最低的是 CSRC/CAC
              备案状态和估值披露缺口，因为两者直接决定 IPO 能否被承销，以及上市前或上市日投资者能否有信心承销进入价格。缓释措施和可监控的否决标准见最后一节。
            claimRefs:
              - CR001
              - CR016
              - CR025
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR015
              - CR019
              - CR025
      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              COOWA 的监管暴露一分为二：北京产业政策积极支持具身机器人（MIIT《人形机器人创新发展指导意见》设定 2025/2027
              里程碑，并要求加强安全治理），但资本市场准入存在实质不确定性。中国法律要求，持有达到门槛的用户数据或「重要」数据的公司境外上市前，需要完成 CAC 主导的网络安全审查和/或数据出境安全评估，以及 CSRC
              境外上市备案；截至本报告日期，本轮研究没有任何来源显示 COOWA
              已公开确认完成任一步骤，尽管媒体称其提交时间表仅两到三个月。中国服务机器人和环卫机器人国家安全标准体系也仍以推荐性而非强制性为主。诉讼方面，COOWA 境内主体在中国国家企业信用信息公示系统中有 26
              条司法案件记录和 47 条法律诉讼条目，包括一起 2024 年劳动者受害责任纠纷，部分判决不利于公司，以及 2025–2026
              年仍在进行的销售合同纠纷；但没有案件指控机器人故障或产品召回。公司还持有城市生活垃圾经营性处置许可证，并通过在安徽自贸区设立的香港持股载体 Cowarobot Investment Holding Limited
              运营，为任何上市增加标准的境外重组复杂度。考虑到没有盈利测试要求，HKEX Chapter 18C 专精特新科技制度很可能是上市通道，且该制度市值门槛临时下调至 2027 年 8
              月；但对首次发行人来说，它仍是相对新的制度。美国 2026 年收紧出口管制（堵住先进 AI 芯片离岸子公司漏洞）又增加了一层算力供应链监管风险，这一风险由中国具身 AI 行业共同承担。
