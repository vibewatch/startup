      - number: '7.6'
        title: 缓释措施、监测指标与论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              COOWA 的 Result-as-a-Service（RaaS）商业模式下，政府和企业客户为清洁/物流结果付费，而不是自购硬件；这确实缓释了客户资本开支风险，但也把剩余维护和设备故障风险集中到 COOWA
              资产负债表上。据报客户复购行为和地域/头部客户分散度（来自公司来源媒体报道，未经独立审计）也是支撑信号，此外公司核心环卫业务线具备牌照合规。此投资论点的可监测指标包括：COOWA 是否在 HKEX 提交前确认
              CSRC 备案和 CAC 审查通过；招股书是否披露显著低于媒体所称 $3B 的估值（意味着降价轮或估值虚高）；公开记录中是否出现新的安全相关诉讼或 MIIT/SAMR 执法行动；SoftBank China
              Venture Capital 或 Asian Infrastructure Investment Bank 是否未参与任何后续轮；以及订单储备转化是否连续两个报告期较 Unitree、Gaussian
              Robotics 或 UBTech 等同行放缓。上述任何一项都将构成论点破裂触发器，应暂停新增资本投入，并在本章识别的尽调问题闭环前，重新承销风险调整后的进入价格。
