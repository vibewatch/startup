            body: >-
              COOWA 称其车队已在 50+ 个城市和地区累计超过 4,500 万公里真实道路运营里程，这一数字至少获一家媒体独立印证；但公司另一官方页面同时给出约 3,500 万公里真实道路里程和约 1
              亿公里仿真里程，内部口径未在任何已查阅来源中解释，应视为待澄清的日期/范围问题，而非单一硬指标。独立报道也印证其已部署车队超过 10,000 台机器人。落地运营上，深圳项目采用「充电 +
              换电」双充模式，单台满电后视任务负载约运行 6–8 小时。CooBus 已在珠海横琴和上海嘉定商业化运营，累计运营时间超过 30,000 小时、里程超过 500,000km。COOWA 路线图显示：2023
              年从分阶段多模态感知融合算法转向视觉端到端架构；2024 年 9 月横琴产品发布会推出麒麟系列和新一代 CooBus；2026 年 5 月发布 CooWAIM
              2.0。已查阅的公司或独立来源均未披露任何产品线的正式客户 SLA、保修期限或全车队 uptime/MTBF 指标；这对车队级 RaaS 承诺是实质缺口。
