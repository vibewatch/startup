        title: 留存、耐久性与满意度
        blocks:
          - type: paragraph
            body: >-
              COOWA 自身商业叙事——并由 Guancha 的独立分析文章印证——称截至 2024 年底客户复购/续约率超过 90%，第一大客户收入占比低于
              20%；原因归于按结果付费的「RaaS」/「MaaS」租赁模式：COOWA 保留设备故障和技术迭代风险，客户则按与已验证清洁结果挂钩的月度服务费付款。已审阅具名市政合同（永康、西乡、芜湖）期限为 1 至 3
              年；永康合同明确要求 COOWA
              在合同结束时向市政府移交源代码、数据和技术文档——这一数据主权条款可能降低客户在续约时转向竞争对手的难度。尽管进行了刻意的反向检索，仍未找到正式净收入留存或总收入留存指标、第三方客户满意度调查（市政机器人采购不存在
              G2/Capterra 等价物），也未找到与 COOWA 直接相关的独立报道服务故障、合同终止或公开投诉；中国 NDRC 对行业产能过剩和价格战的警示存在，但不是 COOWA
              特有。因而留存数字依赖单一公司/分析师访谈来源，没有独立审计链条。
