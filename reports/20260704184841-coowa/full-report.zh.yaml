      - number: '8.6'
        title: 退出准备度、论点破裂触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              相对媒体报道的上市时间表，当前退出准备度偏低：香港 Chapter 18C 专精特新科技制度看起来适合尚未过盈利测试的机器人发行人，2026 年也是强劲的香港 IPO 窗口（Goldman Sachs 预测
              2026 年香港 IPO 融资约 $60B；Kharon 发现 2026 年中国 AI 相关上市中 85%+ 选择香港），但 S1 等价招股书、经审计财务或除 Huatai Securities 和
              Deutsche Bank 两家顾问外的确认保荐授权均未公开。论点破裂触发器包括：确认 CSRC 备案被拒或长期暂停；招股书披露估值显著低于媒体所称
              $3B；经审计财务显示收入、利润率或订单储备转化明显低于媒体报道暗示；或披露的优先/回购条款让新投资人劣后于未披露的先前轮次。最终尽调问题与风险章节的证据缺口一致：（1）完整 2026
              年融资条款清单，包括优先权结构；（2）经审计 FY2025/FY2026 财务报表；（3）确认的 CAC/CSRC
              备案状态；（4）客户集中度和订单储备转化数据；（5）与媒体所称上海国资基金参与相关的任何关联方或政府投资人治理权。在这些问题解决前，建议仍是继续研究，而不是承诺买入或直接放弃。
