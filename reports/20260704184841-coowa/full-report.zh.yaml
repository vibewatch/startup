      - number: '6.5'
        title: 扩张驱动与集中风险
        blocks:
          - type: paragraph
            body: >-
              COOWA
              的扩张打法是「标杆案例先行」：先在一线城市（上海嘉定、深圳坪山/宝安）树立旗舰参考项目，再把这些案例作为证据点，赢取周边区县和省份的后续招标；深圳五连标以及永康/宁乡/芜湖合同集群都直接体现了这一模式。该策略把声誉风险集中在少数旗舰点位：上海或深圳一旦出现公开故障或丢标，依赖可引用案例的全国招标胜率可能被不成比例地拖慢。第二个扩张杠杆是与既有环卫运营商（Yuhuitian、Yingfeng
              Environment、Beikong）联合投标；这能在 COOWA 不自有本地劳动力的情况下加快地域覆盖，但也让公司依赖这些伙伴关系，而合同级经济性并未披露。地域集中度很高：COOWA 披露的「基本盘」约
              90% 仍在中国国内，新加坡/阿布扎比/迪拜试点尚未在收入层面得到验证。板块集中也很重要：环卫（「智慧城市管家」）被描述为最大业务线，而
              CooBus、物业机器人和物流业务的独立合同证据相对薄，因此「四大支柱」的分散化收益尚未在收入层面证明。政策依赖（深圳「20+8」战略产业补贴、上海智能网联汽车规则）支撑当前招标需求，本身也是耐久性变量；同时还叠加
              NDRC 2025 年 11 月对行业产能过剩的提醒。
