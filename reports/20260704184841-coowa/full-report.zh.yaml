      - number: '5.4'
        title: 制造、差异化与知识产权
        blocks:
          - type: paragraph
            body: >-
              COOWA 在安徽运营一座自建、超过 10,000 平方米的黑灯工厂，并称已垂直整合「控制器套件 + 多关节执行器 +
              整车」生产链。独立报道补充了细节：该制造基地覆盖八个核心车间（机加工、钣金、线束、铸造、覆盖件、三电系统、涂装），COOWA
              据称是同类公司中较早自购压铸机的企业之一，因为其场景没有车规级现成零部件可用；每辆车出厂前据称要通过约 200 项车规级测试（包括暴雨密封和 -20°C 冷启动测试）。商业上，COOWA 2022 至 2025
              年平均合同金额据报增长约 106%，2025 年据称转为 EBITDA 为正；公司引用的订单中，约 80% 的智慧环卫订单涉及 10
              台及以上部署。知识产权方面，公开登记检索至少显示一项已授权中国外观设计专利，以及若干与 CEO He Tao、CTO Liao Wenlong
              等署名发明人相关的待审/已授权发明专利申请，另有注册「酷哇」商标和一项城市生活垃圾经营性处置行政许可；但没有来源披露 COOWA 专利组合总规模或中国境外申请情况。COOWA
              披露的供应商和学术关系——RoboSense（激光雷达）、Chery New Energy 与 Jiangling Motors（车辆平台）、China Tianying/Zoomlion
              Environment（合资公司、环保设备）、Shanghai Jiao Tong University（创始团队学术源头）——构成目前最清晰的依赖图谱。
