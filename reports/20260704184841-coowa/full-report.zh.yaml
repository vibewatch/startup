      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >-
              COOWA 由 CEO 何弯（He Tao）创立并领导；何弯出生于 1980 年代，浙江义乌人。2008 年，何弯毕业于上海交通大学电子信息与电气工程学院，随后在 Tokyo Institute of
              Technology 跟随机器人学者 Shigeo Hirose 研究自动驾驶和机器人。他于 2012 年底回到上海交通大学任教，并在 2015 年与一支 12 人创始团队共同创立
              COOWA，团队成员均为上海交通大学校友。何弯入选 Fortune China 2019 年「40 Under 40」商业精英榜。COOWA 首席运营官李克宏（Li Kehong）负责商业执行；行业媒体
              RoboX 报道，一支仅约 20 人的销售团队在五年内把业务量做大 17x，若属实，这意味着一家硬件加服务公司拥有罕见的资本效率。公开来源没有披露 COOWA
              的完整董事会构成、独立董事或治理章程；对仍处私有阶段的公司而言这很常见，但在任何香港上市之前，它仍是一个未解尽调项。
