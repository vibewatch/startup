      - number: '7.5'
        title: 财务、模式与执行风险
        blocks:
          - type: paragraph
            body: >-
              COOWA 的国家企业信用登记信息显示，其上一轮有定价融资（D 轮）估值约人民币 137 亿元（约 $1.9B），显著低于媒体赋予 2026 年据报 >$600M 融资的约 $3B（约人民币 210–220
              亿元）估值；这一差距要么来自未登记的中间轮，要么是估值口径不一致，尽调在承销任何进入价格前需要核清。媒体报道称 COOWA 2025 年收入超过人民币 10
              亿元并已盈利，但截至本报告日期，尚无经审计财报或上市招股书公开，两个数字仍是公司来源且二手转述。作为背景，COOWA 最接近的上市人形机器人相邻可比公司 UBTech 在 FY2025 仍亏损（按 HKEX
              年报，收入人民币 20.0 亿元、同比 +53.3%，净亏损人民币 7.032 亿元）；即便最可比上市同行尚未实现持续盈利，也提高了审视 COOWA 自身未经审计说法的门槛。COOWA 成立于 2015
              年；工商登记显示 Liao Wenlong 为法定代表人和受益所有人，而媒体人物报道把公司创立愿景归功于联合创始人 He Tao（SJTU 毕业，曾在 Tokyo Institute of Technology
              师从 Shigeo Hirose 学习机器人），关键人物依赖集中在小型创始团队。36Kr 称，在订单预订额五年约 17x 增长、订单储备据报超过人民币 50 亿元的同时，COOWA 销售团队一直维持在 20
              人左右；这是效率信号，也意味着商业团队偏薄的执行风险。媒体报道的两到三个月 IPO 提交压缩时间表，也提高了审计完成和披露质量风险。
