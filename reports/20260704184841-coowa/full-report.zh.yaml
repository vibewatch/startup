        - 需要确认融资条款和审计财务，或显著更好的入场价。
    notes: 本判断反映当前入场价和披露缺口，不是笼统认为 COOWA 是弱公司。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
