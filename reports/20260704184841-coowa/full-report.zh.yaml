companyProfile:
  summary: >-
    COOWA（酷哇科技，Cool Wow Technology）是一家总部位于上海的城市服务机器人公司，由上海交通大学校友何弯（He Tao）于 2015 年创立；何弯曾在 Tokyo Institute of Technology
    跟随 Fumio Miyazaki 研究自主机器人。COOWA 从自动驾驶环卫车起步，演进为全栈城市机器人运营商，服务三条垂直线：智慧出行（Smart Mobility，以 CooBus L4
    自动驾驶接驳车为核心）、智慧物业（Smart Property，用于物业管理的 R0 轮腿式机器人和 D0 四足机器人）以及智慧环卫（Smart Sanitation，自动驾驶道路清洁车）。护城河落在 WAM 2.0
    World-Action Model：模型用超过 50 petabytes 的真实场景数据训练，数据来自机器人累计运行 45 million
    公里；商业上则采用结果即服务（RaaS/MaaS）定价，按完成结果收费，而不是按硬件台数收费。COOWA 披露 2025 年收入超过
    RMB1B（~US$140M）并实现经营性盈利，是少数跑到商业规模的中国服务机器人公司之一。2026 年，公司以 >US$3B 估值融资 >US$600M；据报道，Huatai Securities 和 Deutsche Bank
    正作为联席保荐人筹备港交所第 18C 章 IPO。
