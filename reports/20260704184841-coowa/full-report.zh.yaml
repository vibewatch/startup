      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              五个结构性驱动因素支撑持续采用。SalaryExpert 数据显示，中国环卫工人平均年薪约 RMB70,423；MDPI
              发表的研究把中国老龄化、蓝领劳动力收缩与劳动密集型服务业自动化压力上升联系起来——两者共同支撑 RaaS 机器人的持久劳动力替代逻辑。国家政策也在加码：中国 MIIT
              将人形机器人和具身智能机器人定义为战略性新兴产业，意在接续计算机、智能手机和 EV
              成为增长引擎；第十五个五年规划（2026-2030）在十大未来产业赛道中为「具身智能」单列优先框。中国服务机器人上市的公开市场胃口（Geek+ 和 Yunji Technology 2025 年香港
              IPO）进一步支持包括 COOWA 在内的同业融资和退出。约束侧，中国监管环境是在收紧而不是放松：MIIT 计划对 SAE Level 3/4 自动驾驶系统实施强制性（非自愿性）国家安全标准，生效日为 2027
              年 7 月 1 日；CSET 对中国试行 Autonomous Vehicle Safety Guidelines
              的翻译要求，大多数自动驾驶车辆需配备受训安全员，远程监控的无人出租车除外——两者都会抬高无人环卫和配送车队的近期运营成本，尽管 Autowise.ai 2024 年 9
              月获得上海道路测试许可说明合规部署路径可走通。更宏观的约束来自 chinabizinsider.com 报道：截至 2026 年中，至少 25 家中国具身智能初创公司估值超过 RMB10
              billion（~$1.39 billion），H1 2026 披露融资总额超过 RMB46 billion（~$6.39 billion），但多数公司现金跑道只有 18-24 个月——这意味着
              2027-2028 年洗牌可能压低定价、整合竞争格局，极端不利情形下，甚至像 iRobot 在中国成本 / AI
              竞争压力下申请破产那样，完全挤出在位者。最后，发布方各自割裂的市场定义，以及市政采购按省份推进、竞争性招标的结构，都限制了这个市场在全国范围内被快速、清晰测算或规模化的速度。
