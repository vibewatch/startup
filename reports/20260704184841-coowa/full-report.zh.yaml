        title: 成本结构、毛利率与资本开支
        blocks:
          - type: paragraph
            body: >-
              没有独立来源披露 COOWA 自身毛利率、收入成本或资本开支；2026 年 6 月中国财经媒体联系公司询问财务数据时，COOWA 拒绝置评。因此本章用两家已发布经审计 FY2025 文件的公开自动驾驶 /
              机器人可比公司做基准。WeRide Inc.（Nasdaq: WRD）的车型包括与 COOWA 环卫车队可比的「无人清扫车」；公司 FY2025 毛利率为 30.2%（较 FY2024 的 30.7%
              小幅下降），毛利润 RMB206.8 million，资本开支 RMB248.4 million（较 FY2024 的 RMB85.5 million 大幅上升），FY2025 净亏损 RMB1,654.9
              million。Pony.ai（Nasdaq: PONY；港交所上市）报告 FY2025 收入 US$90.0 million，毛利率从 15.2% 扩至 15.7%，FY2025 净亏损 US$76.8
              million（非 GAAP 调整后净亏损 US$174.0 million），较 FY2024 的 US$275.0 million 净亏损大幅改善；Pony.ai 结果也由并行 SEC Form 20-F
              文件独立印证。合在一起，这些可比公司暗示 COOWA 可能处于 15-30% 毛利率区间，不过其 RaaS 占比高、政府 / 国企客户组合可能让实际毛利率在任一方向偏离这个范围。
