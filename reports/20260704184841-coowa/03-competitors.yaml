  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: coowa-contract-economics
    missingEvidence: Customer-level COOWA pricing schedules, SLA penalties, realized discounts, and gross-margin by service line.
    whyItMatters: The chapter can show that COOWA sells outcomes, but cannot yet prove whether the contracts are structurally superior to hardware-led alternatives on unit economics or retention.
    diligencePath: Request top-customer contracts, renewal notices, and service P&L by product family during management Q&A.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: coowa-renewal-cohorts
    missingEvidence: Renewal rates, NRR/GRR, multi-site expansion cohorts, and churn reasons for mature COOWA deployments.
    whyItMatters: A service moat is only durable if accounts renew, expand, and tolerate vendor lock-in over time.
    diligencePath: Request cohort tables by vintage, city, and use case; reconcile with backlog and receivables aging.
    relatedQuestionRefs:
    - QP028
  - type: missing-source
    severity: material
    topic: coowa-world-model-transfer
    missingEvidence: Independent benchmark data showing COOWA's mobile world model transferring to fine-manipulation humanoid tasks under a common public test set.
    whyItMatters: Without a common benchmark, investors cannot tell whether COOWA's embodied-intelligence narrative extends beyond mobile city-service autonomy.
    diligencePath: Ask management for benchmark protocols, task videos, and third-party lab validation against humanoid peers.
    relatedQuestionRefs:
    - QP029
    relatedTableRefs:
    - TP004
