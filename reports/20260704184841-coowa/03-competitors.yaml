callouts:
- calloutType: strength
  title: COOWA's most defensible wedge is recurring field service, not humanoid theater
  body: The retained evidence consistently makes COOWA look strongest where live fleet data, service ownership, and deployment operations reinforce each other. That wedge is harder to copy than a single chassis or sensor stack.
  claimRefs:
  - CP004
  - CP005
  - CP033
  - CP034
- calloutType: risk
  title: The world-model narrative still needs task-level proof outside mobile autonomy
  body: Adverse coverage does not deny that COOWA has real deployment scale; it argues that the public proof set still favors navigation and city-service operations over contact-rich humanoid manipulation. That distinction matters for valuation discipline.
  claimRefs:
  - CP007
  - CP043
- calloutType: insight
  title: Western cleaning incumbents show why distribution and lifecycle support still matter
  body: Brain Corp and Tennant demonstrate that autonomy software becomes much more threatening when paired with an installed equipment base, direct sales, and service coverage. COOWA will need the same density abroad to win on more than hardware novelty.
  claimRefs:
  - CP029
  - CP031
  - CP032
  - CP044
