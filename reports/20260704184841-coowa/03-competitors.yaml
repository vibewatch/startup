- id: capability-pricing-and-gtm
  title: 'Capability, pricing, and GTM: COOWA is differentiated less by robot form factor than by contract model'
  body: 'Capability breadth alone does not settle this market. Keenon and Pudu both show that customers will buy fleets of specialized robots when the use case is narrow and operationally repetitive; Gausium shows the same for professional cleaning. Brain Corp and Tennant demonstrate a different logic in the West: software, analytics, proof-of-work, and service coverage can matter as much as the machine itself. The consistent pattern across the retained sources is weak public price transparency. Most vendors funnel buyers into demos, distributors, or enterprise sales motions, which makes workflow fit and deployment risk more important than sticker price. That is why COOWA''s outcome-based model matters. A customer comparing COOWA with hardware-led peers is not only comparing robot specifications; it is comparing whether the vendor will own mapping, uptime, staffing substitution, proof-of-completion, and continuous iteration after deployment. Unitree is the notable exception because it openly
    lists a humanoid price for G1, but that transparency reflects a product-led hardware motion, not a city-operations service contract.'
