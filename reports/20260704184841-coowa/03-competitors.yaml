- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - WAM 2.0 + real-world fleet data
    - Guancha says COOWA proof is strongest in mobile autonomy, not fine humanoid manipulation
    - High
    - Moat may be narrower than the broad embodied-AI narrative suggests
    - Request common-task benchmarks and evidence of transfer from mobile to manipulation scenarios
  - - 10,000+ deployed fleet and 45M km
    - Gausium already has a larger dedicated cleaning fleet and its own data flywheel
    - High
    - Cleaning specialists may outlearn COOWA in indoor floor-care niches
    - Compare deployment density, retention, and ROI by use case, not headline fleet size
  - - Outcome-based MaaS / RaaS contracts
    - Public realized pricing, SLAs, and renewal data are not disclosed
    - High
    - Service moat cannot be fully underwritten without cohort economics
    - Obtain top-20 contract templates, renewal rates, and gross-margin by service line
  - - Scenario breadth across city stewardship, property, and shuttles
    - Broader scope can dilute focus against sharper specialists
    - Medium
    - A wider catalog helps sales only if operations stay standardized
    - Test whether multi-product accounts expand faster than single-product accounts
  - - Humanoid optionality within embodied-AI narrative
    - Unitree, UBTECH, and AgiBot are better positioned for pure humanoid investor storytelling
    - Medium
    - Capital markets may reward humanoid scale more than city-service cash flows in some windows
    - Anchor valuation to service outcomes and backlog quality rather than form-factor hype
  - - Chinese hardware cost curve
    - Humanoid price-war dynamics and EV entrants such as BYD can compress hardware differentiation quickly
    - High
    - If hardware commoditizes, software and service attachment must carry the moat
    - Ask for software attach rates, proof-of-work adoption, and data-network effects
  - - Overseas expansion runway
    - Brain Corp / Tennant prove installed-base distribution plus autonomy can stay powerful abroad
    - Medium
    - Foreign wins may require channels and service density that COOWA has not yet proven at scale
    - Map country-by-country service partners, certifications, and replacement economics
  notes: Severity ranks durability risks, not bankruptcy risk. Several rows require private diligence because public sources do not expose COOWA's renewal, service-level, or margin detail.
