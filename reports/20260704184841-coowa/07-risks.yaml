company:
  name: COOWA
chapter:
  number: 7
  title: Risks
  summary: COOWA's highest-severity risks sit at the intersection of unresolved regulatory disclosure (no confirmed CSRC/CAC
    filing for its planned HK listing), a large valuation gap versus its last registry-confirmed financing round, concentrated
    capital/OEM/government-customer relationships, and a fast-crowding embodied-AI competitive field where China's own planning
    agency has warned of overcapacity. Mitigations exist (RaaS model, profitability, licensing compliance) but litigation
    history, unaudited financials, and thin independent safety/technology verification leave several risks unresolved pending
    private diligence.
sections:
- id: overview-risk-framework
  title: 'Overview: risk framework and severity ranking'
  body: 'COOWA (Kuwa Technology / 酷哗科技) is a Shanghai-headquartered, Anhui-registered operator of autonomous sanitation,
    urban-logistics, and mobility robots founded in 2015, reportedly profitable on more than RMB1 billion of 2025 revenue
    and preparing a Hong Kong IPO advised by Huatai Securities and Deutsche Bank. That profile sits alongside five risk
    clusters this chapter ranks by severity: regulatory/legal (unconfirmed CSRC/CAC filing status, litigation history, licensing),
    operational/safety/technology (open-ended perception tasks, no independent benchmark of its world model), partner/dependency/concentration
    (two named financing backers, two named OEM partners, government-dominated customer base, a two-bank sponsor syndicate),
    and financial/model/execution (an unaudited profitability claim and a valuation that has jumped well beyond the company''s
    last registry-confirmed financing round). The highest-severity, least-resolved items are the CSRC/CAC filing status
    and the valuation-disclosure gap, because both directly gate whether the IPO, and the price at which any pre-IPO or
    listing-day investor would enter, can be underwritten with confidence. Mitigations and monitorable kill criteria are
    set out in the final section.'
  claimRefs:
  - CR001
  - CR016
  - CR025
  figureRefs:
  - FR001
- id: regulatory-legal-risk
  title: Regulatory and legal risk
  body: 'COOWA''s regulatory exposure is bifurcated: Beijing''s industrial policy actively supports embodied robotics (MIIT''s
    Guidance on Innovative Development of Humanoid Robots sets 2025/2027 milestones and calls for stronger safety governance),
    while capital-market access carries real uncertainty. Chinese law requires a CAC-led cybersecurity review and/or data-export
    security assessment, plus a CSRC overseas-listing record-filing, before a company holding qualifying user or ''important''
    data can list abroad; as of the runDate no source in this research pass shows COOWA has publicly confirmed either step,
    even though press coverage describes a two-to-three-month submission timeline. China''s national safety-standard system
    for service and sanitation robots also remains largely recommendatory rather than mandatory. On litigation, COOWA''s
    onshore entity carries 26 judicial case records and 47 legal-proceeding entries in China''s national enterprise-credit
    registry, including a 2024 labor-injury liability dispute partially decided against the company and active 2025-2026
    sales-contract disputes, though none allege robot malfunction or product recall. The company also holds a municipal
    household-waste operational-disposal license and operates through a Hong Kong holding vehicle (Cowarobot Investment
    Holding Limited) established in the Anhui free-trade zone, adding a standard layer of offshore-restructuring complexity
    to any listing. HKEX''s Chapter 18C specialist-technology regime, with temporarily reduced market-cap thresholds through
    August 2027, is the likely listing gateway given no profit-test requirement, but it remains a comparatively new regime
    for first-time issuers. US export-control tightening in 2026 (closing the offshore-subsidiary loophole for advanced
    AI chips) adds a further compute-supply-chain regulatory risk shared across the Chinese embodied-AI sector.'
  claimRefs:
  - CR002
  - CR003
  - CR004
  - CR005
