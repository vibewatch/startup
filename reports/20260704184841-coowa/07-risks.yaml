- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Regulatory / listing risk
    - CSRC record-filing and CAC review outcome
    - Rejection, suspension, or an unexplained delay beyond the reported 2-3 month submission window
    - Pause new commitment; reassess listing-timeline risk
  - - Valuation-disclosure risk
    - HKEX prospectus disclosed valuation versus the reported ~$3B figure
    - A prospectus valuation more than 15% below the reported figure
    - Re-underwrite entry price as a down-round signal
  - - Safety / incident risk
    - Public recall, MIIT/SAMR enforcement action, or a safety-related lawsuit
    - Any confirmed public filing of this type
    - Escalate to a blocking diligence item; reassess risk rating
  - - Capital-concentration risk
    - Continued participation of named backers
    - Withdrawal or non-participation of SoftBank China Venture Capital or AIIB in any follow-on round
    - Reassess capital-adequacy and governance-control risk
  - - Competitive-position risk
    - Order-book growth relative to peers (Unitree, Gaussian Robotics, UBTech)
    - Growth decelerates below the peer median for two consecutive reporting periods
    - Downgrade growth assumptions used in any valuation model
  notes: Thresholds are author-defined monitoring heuristics, not company-disclosed covenants.
