  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: csrc-filing-status
    missingEvidence: Direct confirmation from the CSRC overseas-listing record-filing register of COOWA's filing status.
    whyItMatters: Without confirmed CSRC record-filing, the entire HK listing timeline reported in the press is unverified
      and could slip or be rejected.
    diligencePath: Check the CSRC overseas-listing filing register directly by company name once COOWA files, and request
      confirmation from the company's counsel.
    relatedQuestionRefs:
    - QR033
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: financing-terms
    missingEvidence: A complete term sheet or cap table for the reported 2026 financing round, including investor identities,
      share class, and preference terms.
    whyItMatters: Preference stacking and undisclosed investor rights materially change what common/early holders actually
      receive at exit.
    diligencePath: Request the signed subscription agreement or a company-approved financing summary covering all investors
      and preference terms.
    relatedQuestionRefs:
    - QR034
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited balance sheet, cash-flow statement, and debt schedule for COOWA's most recent fiscal year.
    whyItMatters: Reported revenue and profitability figures are company-sourced and unaudited; capital adequacy and true
      margin cannot be assessed without audited statements.
    diligencePath: Request audited financial statements or the draft listing prospectus once filed with HKEX.
    relatedQuestionRefs:
    - QR035
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: product-liability-insurance
    missingEvidence: Insurance certificates or policy summaries covering robot-deployment liability, including coverage
      limits and exclusions.
    whyItMatters: At 10,000+ deployed robots and 45M+ operating kilometers, uninsured or underinsured liability exposure
      is a material balance-sheet risk.
    diligencePath: Request COOWA's product-liability and general-liability insurance certificates as part of legal diligence.
    relatedQuestionRefs:
    - QR036
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: A customer-level revenue breakdown showing top-three or top-five customer concentration.
    whyItMatters: Municipal and state-owned-enterprise customer concentration could expose COOWA to budget-cycle or policy-driven
      revenue volatility.
    diligencePath: Request customer-level revenue schedules or the prospectus customer-concentration disclosure once filed.
    relatedQuestionRefs:
    - QR037
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: export-control-exposure
    missingEvidence: A supplier-level compute and semiconductor sourcing map, including any 2026 export-license denials
      affecting COOWA's suppliers.
    whyItMatters: World-model training and edge-inference hardware both depend on advanced compute; undisclosed exposure
      to export-controlled components is a hidden supply-chain risk.
    diligencePath: Request a confidential hardware/compute bill-of-materials and supplier-concentration memo covering export-controlled
      components.
    relatedQuestionRefs:
    - QR038
    relatedTableRefs:
    - TR001
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: A complete list of all pending administrative or regulatory proceedings against COOWA beyond the two
      litigation cases identified via public registry search.
    whyItMatters: Public Chinese-language registries may not capture every administrative or regulatory action; the regulatory/legal
      risk register reflects a partial, not exhaustive, enumeration.
    diligencePath: Commission a full Chinese-language litigation and administrative-penalty search across all COOWA group
      entities and named subsidiaries ahead of listing.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR001
  - type: stale
    severity: minor
    topic: technology-moat
    missingEvidence: An updated independent benchmark of COOWA's WAM 2.0 / CooWAIM 2.0 world model against rival Chinese
      embodied-AI world models released after the May 2026 DAWN-architecture announcement.
