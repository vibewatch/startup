  topStrengths:
    - >-
      Cloud-native HyperStream architecture delivers sub-second query at petabyte scale with ingest-based all-inclusive
      pricing and 400-day hot retention — a genuine technical moat versus legacy EPS-based SIEM vendors such as Splunk
      and IBM QRadar.
    - >-
      $70.6M ARR with approximately 90% YoY growth and >120% NRR confirms strong enterprise customer expansion,
      product-market fit within large accounts, and meaningful switching costs.
    - >-
      FedRAMP Moderate ATO (January 2024) opens a material federal addressable market that legacy on-premise SIEM
      vendors without cloud-native architecture cannot easily address.
    - >-
      Full multi-tenancy and open REST API architecture enables MSSP channel deployments at scale, creating a
      differentiated distribution path that pure-play enterprise SIEM competitors lack.
    - >-
      Deep enterprise investor syndicate (TCV, General Atlantic, Insight Partners, Eurazeo, Bessemer, Georgian) and
      $500M+ in total capital raised provides institutional credibility and extended runway.
  topRisks:
    - >-
      $2 billion valuation at approximately 28x ARR multiple is materially inconsistent with current public and private
      SIEM market comps (SentinelOne at 4x, Elastic at 5x, Exabeam estimated at 14x) — down-round risk is material if
      new capital is sought.
    - >-
      Exclusion from the 2025 Gartner SIEM Magic Quadrant on unspecified business criteria removes the primary
      procurement filter for enterprise CISOs and directly impairs new-logo pipeline and ARR growth rate.
    - >-
      Three CEO changes in approximately four years (van Zadelhoff → Scott interim → Naumann) signals governance
      instability, strategic discontinuity, and potential investor disagreement on direction — all adverse for
      enterprise sales cycles.
    - >-
      Headcount declined approximately 50–55% from peak (769 in December 2022 to 350–530 in April 2026), signaling
      severe cost restructuring or deeper revenue underperformance; burn rate and runway are undisclosed.
    - >-
      No new institutional round in over three years in an active cybersecurity fundraising environment is a meaningful
      adverse signal about ability to raise at or above the $2B mark; preference overhang from $481–500M total invested
      constrains common equity returns below approximately $500M exit.
  unresolvedGaps:
    - >-
      Burn rate, runway, and remaining balance of the 2022 Series F are undisclosed — capital adequacy through a viable
      exit window cannot be independently assessed.
    - >-
      No ARR update has been published since October 2024; whether the approximately 90% YoY growth trajectory continued
      through 2025 or moderated is unknown.
    - >-
      Gartner SIEM Magic Quadrant re-inclusion path, timeline, and specific business criteria remediation steps are
      undisclosed — recovery of enterprise pipeline depends on this.
    - >-
      Cap-table structure, preference stack, and anti-dilution provisions from the $1.5B Series E and $2B Series F are
      not public — dilution scenarios and downside return profiles cannot be modeled.
    - >-
      Consolidated GAAP financials (gross margin, net loss, revenue mix) are not publicly available for the US parent
      entity — all financial diligence relies on third-party ARR estimates and UK subsidiary filings.
