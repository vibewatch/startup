summary:
  headline: >
    Devo has genuine cloud-native SIEM differentiation and strong NRR, but the $2 billion valuation at ~28x ARR is
    materially unsupported by current market comps — a constructive investment stance requires price discovery, an
    updated ARR milestone, or Gartner MQ re-inclusion before the risk-reward is favorable.
