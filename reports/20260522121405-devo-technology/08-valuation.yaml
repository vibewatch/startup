      than confirmed data. If gross margin is substantially below 65%, valuation would compress further; if substantially
      above 78%, base case improves modestly.

      '
    diligencePath: 'Request consolidated audited income statement, balance sheet, and cash flow statement for FY2024 from
      CFO/auditor. Request UK Companies House FY2025 accounts (due September 2026) when filed.

      '
    relatedQuestionRefs:
    - QV014
    - QV017
  - id: EGV002
    description: 'No post-October 2024 ARR update is publicly available. The last confirmed ARR of $70.6M is over seven months
      old as of May 2026. Without Q4 2024, Q1–Q3 2025, or Q1 2026 data, growth trajectory cannot be confirmed.

      '
    impactOnConclusion: 'ARR trajectory is the primary scenario selector: if Q1 2026 ARR is above $100M (>40% YoY growth),
      the bull case becomes more plausible; if below $85M (<20% growth), the bear case strengthens materially. Current analysis
      is frozen at the October 2024 data point.

      '
    diligencePath: 'Request quarterly ARR bridge from management for Q4 2024 through Q1 2026; require auditor verification
      or independent ACV waterfall cross-check.

      '
    relatedQuestionRefs:
    - QV031
  - id: EGV003
    description: 'Devo''s cap-table structure, preference waterfall, and anti-dilution provisions from the $1.5B Series E
      (2021) and $2B Series F (2022) are not publicly disclosed. The total preference overhang ($481–500M estimate) is based
      on cumulative funding history, not confirmed preference amounts.

      '
    impactOnConclusion: 'Without preference waterfall details, common equity return scenarios are analytically unresolvable.
      If Series E/F include participation rights (2x), the effective preference overhang may be $600M–$1B, eliminating common
      equity returns in all but the bull case.

      '
    diligencePath: 'Request term sheets, cap table summary, and preference waterfall model from investor or management.

      '
    relatedQuestionRefs:
    - QV030
  - id: EGV004
    description: 'Specific criteria for Devo''s 2025 Gartner SIEM Magic Quadrant exclusion have not been publicly disclosed
      by either Devo or Gartner. The remediation pathway is unknown.

      '
    impactOnConclusion: 'Gartner MQ re-entry would increase base-case exit multiple by an estimated 2–4x points and ARR growth
      rate by 10–20 percentage points, moving the base-case enterprise value from $565M (8x/base) toward $700M–$1.1B range.
      Without clarity on the re-entry path, this upside is unquantifiable.

      '
    diligencePath: 'Request written Gartner re-qualification roadmap and timeline from CEO/Product; confirm status of Gartner
      dialogue and whether Devo has submitted for 2026 evaluation.

      '
    relatedTableRefs:
    - TV004
    topic: ' Comparable set in TV004 is limited to vendors with disclosed financials; private SIEM peers (e.g., LogRhythm,
      Gurucul) excluded due to unavailable ARR data.'
