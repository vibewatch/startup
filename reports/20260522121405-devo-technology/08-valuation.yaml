- id: financing-valuation-context
  title: Financing, Valuation Context, and Overvaluation Risk
  body: 'Devo Technology''s capital-raise history establishes a clear trajectory: $5.5 million Seed (2011), $15 million Series
    A (2014), $25 million Series B (2017), $35 million Series C (2019), $250 million Series E at $1.5 billion valuation (October
    2021, led by TCV), and $100 million Series F at $2 billion valuation (June 2022, led by Eurazeo). Total capital raised
    is approximately $481–500 million. At $2B post-money and approximately $500M total invested, the enterprise value to invested
    capital ratio is approximately 4x — reasonable for 2022 market conditions but increasingly difficult to defend as public
    multiples compress.

    The most critical valuation risk is the passage of time without a validating event. The $2B mark was set during the 2022
    ZIRP-era peak, when public cloud SaaS multiples briefly exceeded 20x revenue for many categories. Since then, public cybersecurity
    SaaS multiples have compressed sharply: the average public SaaS EV/revenue multiple dropped from approximately 7x to 5.5x
    during Q1 2026, and legacy SIEM players trade at 1.7x–5x. A company of Devo''s ARR scale ($70–100M estimated), without
    the FCF margin and AI-native architecture necessary to command a premium multiple, would typically price in a new round
    at 6–10x forward ARR in the current environment. At a mid-point of 8x and $70.6M ARR, fair value is approximately $565M
    — a ~72% discount to the $2B mark.

    The UK subsidiary (Devo Technology UK Limited, Companies House number 11507870, accounts filed through December 31, 2024)
    provides the only mandatory public financial disclosure, but UK entity accounts do not disclose consolidated global financials.
    No audited GAAP income statement, balance sheet, or cash flow statement for the US parent entity is publicly available.
    This is the single largest diligence blocker: burn rate, runway, and remaining Series F balance are all unverified. The
    absence of a post-2022 fundraise in an environment where active private cybersecurity M&A and fundraising have continued
    through 2025–2026 is a meaningful adverse signal about Devo''s ability to raise at or above $2B.

    Secondary-market liquidity exists for Devo shares through specialist brokers (e.g., Notice.co lists buyer/seller interest),
    but no public secondary pricing has been reported. Secondary transactions for private company shares in distressed or
    stagnant situations typically trade at 30–60% discounts to the last primary round valuation, implying a secondary clearing
    range of approximately $800M–$1.4B if secondary trades have occurred.

    Cap-table and preference overhang is unquantified. With $481–500M in total invested capital and likely liquidation preferences
    at or above 1x, common stockholder returns are severely diluted in any exit below approximately $500M. Down-round anti-dilution
    provisions from the $1.5B Series E and $2B Series F would trigger ratchets if a new round is priced below those marks,
    cascading governance friction and signaling distress to enterprise buyers.

    '
