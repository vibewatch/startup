    - Severe; reduces strategic M&A value to technology-acquisition floor; move toward AVOID
  - - Second CEO departure within 18 months
    - Ken Naumann departs before September 2026 or end of 2026
    - Four CEOs in five years = structural governance failure; buyer diligence red flag; employee attrition
    - Move to AVOID; governance instability is a primary diligence killer for most institutional investors
  - - FedRAMP ATO lapses or is suspended
    - FedRAMP continuous monitoring failure resulting in suspension of ATO
    - Eliminates entire federal revenue channel; GSA/SBA sponsorship withdrawn; federal ARR to zero
    - Immediate adverse trigger; eliminates federal thesis; materially reduces SAM and strategic value
- id: TV006
  title: Final Diligence Asks Table
  notes: 'All eight items below are currently unresolved gaps. Items 1–4 are gating diligence blockers that prevent any constructive
    investment stance; items 5–8 are important but secondary. No publicly available source resolves any of these gaps; all
    require direct management or investor engagement.

    '
  claimRefs:
  - CV041
  - CV043
  - CV044
  - CV045
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Current ARR and revenue trajectory
    - No public ARR update since October 2024; no Q1/Q2 2025 or 2026 data
    - Primary driver of every valuation scenario; 7+ months of unknown trajectory
    - 'Management: request quarterly ARR bridge and ACV waterfall through Q1 2026'
  - - Burn rate and cash runway
    - No disclosed burn rate, OPEX, or remaining Series F balance
    - Determines whether Devo can reach a viable exit without forced restructuring; >12 months runway required
    - 'Management + CFO: request 12-month rolling OPEX and cash balance statement'
  - - Cap table and preference stack
    - Total preference overhang, liquidation preferences, and anti-dilution provisions not disclosed
    - Determines at what exit price common equity and management options have value
    - 'Legal: request cap table summary and preference waterfall model for $500M, $750M, $1B exit scenarios'
  - - Audited financial statements
    - No US GAAP financials publicly available; UK subsidiary accounts do not consolidate global operations
    - ARR is unaudited third-party estimate; gross margin, EBITDA, and FCF are unknown
    - 'CFO/auditor: request consolidated audited income statement and balance sheet for FY2024'
  - - Gartner MQ re-qualification plan
    - Devo excluded from 2025 Gartner SIEM MQ; no public statement about specific business criteria or remediation
    - MQ exclusion is a material commercial risk; remediation path determines whether Gartner re-entry is achievable 2026
    - 'CEO/Product: request written Gartner re-qualification roadmap and timeline'
  - - Secondary transaction history
    - No disclosed secondary transactions; no secondary pricing available from any public source
    - Secondary marks would provide an independent valuation data point below the $2B primary round price
    - 'Investor relations: query existing VC investors for any secondary transactions post-Series F'
  - - MSSP channel ARR and renewal rate
    - No disclosed breakdown of channel-sourced vs. direct ARR; MSSP miss is documented but unquantified
    - Channel concentration risk; if MSSP channel is declining, net-new ARR pipeline is structurally compromised
    - 'Management: request ARR by channel (direct, MSSP, federal, other) and renewal rate by cohort'
  - - Post-Series F M&A activity
    - Kognos acquisition (2022) confirmed; no subsequent acquisitions disclosed; integration cost not disclosed
    - M&A spend reduces remaining capital for operations; integration risk absorbs management bandwidth
    - 'CFO: confirm total M&A spend post-Series F and current integration status of Kognos assets'
