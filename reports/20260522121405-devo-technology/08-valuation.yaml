chapter:
  number: 8
  title: Valuation
  summary: 'Devo Technology''s $2 billion Series F valuation (June 2022) is materially unsupported by current public and private
    market evidence. At $70.6 million ARR (October 2024), the mark implies a ~28x ARR multiple — a premium tier reserved in
    2026 exclusively for AI-native, hyper-scaling cybersecurity platforms generating >20% revenue growth with >30% free cash
    flow margins. Devo has no public evidence of a post-2024 ARR update, has not raised a new institutional round in over
    three years, experienced a headcount decline from ~769 (December 2022) to ~350–530 (April 2026), was excluded from the
    2025 Gartner SIEM Magic Quadrant, missed MSSP channel targets, and has installed its third CEO in approximately four years.
    Against a public-market comp set where SentinelOne trades at ~4x EV/revenue, Elastic at ~5x, and even the higher-growth
    Exabeam (private) is estimated at ~14x, the $2B mark is a 2022 vintage number with no current corroboration. A fair-value
    range applying 6–14x ARR to the $70.6M ARR base produces an enterprise-value estimate of $424M–$988M, with the base case
    (~8x) implying ~$565M — a ~72% discount to the last marked valuation. The recommendation is TRACK: the thesis requires
    meaningful new evidence (new round, ARR update, Gartner re-inclusion, profitability milestone) before a constructive investment
    stance can be adopted. Down-round risk is material; the adverse case cannot be ruled out without further diligence. Strategic
    M&A remains the most plausible positive exit, but only at a substantial discount to $2B.

    '
sections:
- id: investment-thesis-recommendation
  title: Investment Thesis, Anti-Thesis, and Recommendation
  body: 'Devo Technology is a cloud-native SIEM and security data analytics platform with genuine technical differentiation
    — ingest-based pricing, 400-day hot retention, multi-tenancy, and an open-API architecture that enables MSSP deployments.
    The company reported $70.6 million in ARR as of October 2024, implying approximately 90% year-over-year growth from $37.1
    million in late 2023. Net revenue retention exceeds 120%, indicating strong expansion within existing enterprise accounts.
    The FedRAMP Moderate ATO (January 2024) opens a material federal addressable market. Devo''s total capital raised since
    founding (2011) is approximately $481–500 million across six rounds, with the last being a $100 million Series F at a
    $2 billion post-money valuation in June 2022, led by Eurazeo with full participation from Insight Partners, Georgian,
    TCV, General Atlantic, and Bessemer Venture Partners.

    The investment anti-thesis is more compelling at the last reported valuation. The $2 billion mark at approximately 28x
    ARR multiple (based on $70.6 million ARR) is materially inconsistent with current public and private market comparables.
    As of Q1 2026, the cybersecurity SaaS public market has bifurcated sharply: AI-native platform leaders such as CrowdStrike
    trade at approximately 18–19x NTM EV/revenue due to simultaneous >20% growth, >30% FCF margins, and agentic AI deployment;
    legacy transitioners and mid-tier SIEM players trade at 1.7x–5x EV/revenue. Devo does not qualify for the premium tier
    on any public evidence. At a 5x–10x ARR multiple — consistent with legacy/ mid-tier SIEM private market comps — enterprise
    value would be $353M–$706M, a 65–82% discount to the $2 billion mark.

    Additional adverse evidence includes: (1) no new institutional round publicly announced in over three years (June 2022
    to May 2026), which in a highly active fundraising environment suggests difficulty raising at or above the $2B mark; (2)
    exclusion from the 2025 Gartner SIEM Magic Quadrant for failing unspecified business criteria — the first-line procurement
    filter for most enterprise buyers; (3) headcount decline of approximately 50–55% from peak (769 in December 2022 to 350–530
    in April 2026); (4) MSSP channel missing aggressive growth targets; (5) third CEO in approximately four years (Ken Naumann,
    appointed March 2025), signaling persistent governance and execution instability; and (6) no public ARR update since October
    2024.

    The recommendation is TRACK. The thesis is not buyable at the $2 billion valuation with current public evidence. A constructive
    investment stance requires at least one of: (a) a new round at a realistic market-derived valuation providing entry price
    discovery; (b) an updated ARR confirming continued high-growth trajectory (>50% YoY); (c) Gartner MQ re-inclusion demonstrating
    commercial credibility recovery; or (d) disclosed burn rate and runway data confirming capital adequacy through a viable
    exit window. Confidence in the recommendation is medium-high; the evidence base is sufficiently dense to form a directional
    view but lacks audited financials, current ARR, and cap-table data needed for precise valuation.

    '
