  - id: named-customer-proof
    title: Named Customer Proof and Production Evidence
    body: >
      Devo has disclosed a set of named production customers across multiple channels including official
      case studies, press release customer references, and MSSP-page testimonials. The strongest evidence
      comes from three detailed customer success stories with named contacts and quantified outcomes.

      OneMain Financial, a U.S. consumer finance company with 1,400 branches and 10.3 million customers,
      migrated from Splunk on-premises to Devo and achieved a 75% reduction in alert noise. Tunde Oni-
      Daniel, then Head of Cyber Technology (later VP Technology and Engineering), is cited in the official
      case study as the named reference contact. Devo enabled OneMain to centralize visibility across all
      business units in a single pane of glass and provided 24/7 hands-on support access.

      Telefonica, the multinational telecom operating in 12 countries with approximately 383 million
      customers globally, deployed Devo for data analytics to drive customer experience and retention.
      The Director of Contract Management is quoted: "We were amazed at the speed with which we were
      operational with the Devo platform. We were able to go from concept to full operational deployment
      in a mere three months." Key benefits included reduced customer churn, reduced helpdesk call volume,
      and proactive problem resolution via real-time data correlation. This case study is notable for
      showing a non-security use case: Devo deployed as a customer analytics platform rather than purely
      as a SIEM.

      Bitkub Exchange, a major Thai cryptocurrency exchange and APAC customer, freed up 20% of staff time
      by switching to Devo for SOC modernization. Attaphon Phakek, Bitkub's CSO, is cited in the Devo
      vs. Splunk comparison page: "We have drastically improved our threat detection and real-time
      monitoring by working with Devo."

      Additional production evidence includes Ulta Beauty (Jeff Schmidt, Senior Engineer: "Devo is an
      integral part of our cybersecurity defense"), Kforce (John Busch, Security Engineer: ROI within
      60–90 days, able to hire one additional analyst with licensing savings), Corsica Technologies
      (MSSP: Rebecca Lambert, SOC Manager, uses multi-tenant Devo via AWS), and the U.S. Air Force
      (testimonial on public-sector page calling the solution "approachable, affordable, scalable" and
      superior to the incumbent). Accenture Federal Services, cited as a SOC Manager testimonial on the
      public-sector page, states Devo "enabled our enterprise security operations center."

      The Series E and Series F press releases name H&R Block, Manulife, FanDuel, AMEX Global Business
      Travel, Sonos, AT&T, and Unisys as customers added during periods of approximately 100% annual
      customer growth. These are listed as customer references without detailed case studies or named
      contacts, limiting their evidentiary weight. No production vs. pilot differentiation is disclosed
      for the press-release reference list.
