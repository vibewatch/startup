  - id: adoption-growth-trajectory
    title: Adoption Trajectory and Customer Growth Evidence
    body: >
      Devo's disclosed customer growth trajectory is derived primarily from funding press releases, Latka
      revenue data, and FeaturedCustomers aggregation. The Series E announcement (October 2021) cited
      "over 100% customer growth" during Marc van Zadelhoff's first year as CEO, with named additions
      including H&R Block, Manulife, FanDuel, Ulta Beauty, and AMEX Global Business Travel. The Series F
      announcement (June 2022) again cited "nearly 100% customer growth" during the prior fiscal year,
      with named additions including Sonos, AT&T, and Unisys. Two consecutive years of approximately
      doubling customer count is a strong growth signal, though absolute counts were not disclosed.

      Revenue growth corroborates customer expansion: Latka reported Devo revenue at $27.6M ARR in April
      2021, $37.1M in December 2023, and $70.6M in October 2024. The $70.6M figure represents
      approximately 90% year-over-year growth from the $37.1M base, indicating that revenue expansion
      outpaced time elapsed — a pattern consistent with a combination of new logo growth and strong net
      revenue retention in existing accounts.

      FeaturedCustomers lists 37 customer reviews and references, 21 case studies, and 4 customer videos
      as of the May 2026 access date, providing an independent proxy for the breadth of documented
      customer engagement. Devo's SecurityScientist profile and third-party research cite "1,000+ enterprise
      deployments," though this figure is company-asserted and unvalidated by any third-party audit or
      independent enumeration.

      PeerSpot SIEM category mindshare data shows Devo's mindshare growing from 1.0% to 1.2% year-over-
      year as of May 2026, ranking Devo #26 in the category compared to Splunk's #1 position at 7.1%.
      This modest mindshare growth is consistent with Devo expanding its practitioner recognition base
      but from a low absolute position. A 95% recommendation rate among PeerSpot reviewers and an 8.4/10
      average rating (versus Splunk's 8.3/10) suggests high satisfaction among existing users.

      Devo AWS Marketplace reviews provide additional signals of real-world deployments. Reviewers note
      ease of use, real-time log management, and cloud integration benefits. Some reviewers note missing
      notifications and desire for better UI for beginners, consistent with the broader theme of UX
      complexity noted in PeerSpot adverse feedback.
