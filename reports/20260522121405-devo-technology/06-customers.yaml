  - id: mssp-channel-dependence
    title: MSSP and Channel Partner Dependence
    body: >
      Devo has built a dedicated multi-tenant architecture for MSSP customers, positioning MSSP-delivered
      managed SIEM as a major channel. The Devo for MSSPs product page highlights the ability to configure
      customer tenants in seconds via API call, achieve full visibility across globally distributed
      operations, customize data access across unlimited tenants, and meet data residency compliance
      requirements — all features specifically relevant to MSSP operational needs.

      Named MSSP partners on the Devo for MSSPs page include CyberMaxx (John Pinkham, Senior Director of
      Alliance Partnerships), DeepSeas (Steve Ocepek, Senior Architect and Innovation Leader), and Talion
      (Keven Knight, COO). A major partnership with Trustwave — a Top 250 MSSP and Top 40 MDR provider
      per MSSP Alert — was announced under the Trustwave MXDR Co-Managed SOC for Devo brand, providing
      SIEM-as-a-service where Trustwave hosts and manages the Devo SIEM for end customers. DLT/TD SYNNEX
      Public Sector serves as the government channel distribution partner for federal civilian, defense,
      and intelligence agency access.

      The Devo Drive Partner Program provides the formal channel structure, offering access to Devo
      technology, dedicated support and training, co-marketing opportunities, and competitive margins.
      The program is newer relative to Splunk's or Microsoft Sentinel's established channel ecosystems.

      A significant adverse signal comes from the swotanalysis.com Q4-2025 SWOT, which states: "CHANNEL:
      MSSP partner-sourced revenue did not meet its aggressive growth goal" and lists as an OKR failure
      "CHANNEL: Restructure MSSP program with better incentives and enablement." This indicates that
      despite a purpose-built multi-tenant product, the MSSP channel has been slower to scale than planned.
      The SWOT identifies the weakness as "nascent MSSP and partner program limits indirect GTM scale" and
      recommends radically expanding the MSSP channel program.

      The percentage of Devo's ARR derived from MSSP-channel customers versus direct enterprise customers
      is not publicly disclosed. MSSP dependence carries dual concentration risk: if a major MSSP partner
      churns (e.g., Trustwave), Devo loses that channel's end-customer revenue simultaneously; and if
      Devo's go-to-market success depends disproportionately on a small number of MSSP partners,
      diversification is limited.
