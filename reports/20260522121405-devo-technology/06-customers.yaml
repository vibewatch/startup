  - id: retention-satisfaction-nrr
    title: Retention, Satisfaction, and NRR Proxies
    body: >
      Devo does not publicly disclose Net Revenue Retention (NRR), Gross Revenue Retention (GRR), churn
      rates, or cohort-level retention data. The primary NRR proxy is from swotanalysis.com's Q4-2025
      Devo SWOT analysis, which cites "~120% NRR shows deep value for large enterprise customers" and
      separately states "Net revenue retention remained strong at over 120% among top cohort." This
      source has characteristics of third-party synthesis analysis rather than Devo primary disclosure,
      and has not been corroborated by a named Devo executive or investor statement.

      The revenue growth data provides an indirect retention signal. Revenue growing from $37.1M ARR
      (December 2023) to $70.6M ARR (October 2024) represents approximately 90% growth over approximately
      10 months. Given that consecutive funding rounds (Series E and F) both cited approximately 100%
      customer growth, and that revenue growth from 2023 to 2024 is similarly robust, this pattern
      suggests meaningful net expansion within the existing customer base rather than purely new logo
      acquisitions. However, without disclosed customer counts for 2024, separating expansion revenue
      from new logo revenue is not possible from public data.

      Vendr's procurement data shows the median Devo buyer pays $131,250 per year, with a range of
      approximately $28,000 to $200,000. This range suggests meaningful deal size variation, consistent
      with a mix of mid-market and enterprise buyers. The median price point is below what large-enterprise
      SIEM contracts typically run (often seven figures), suggesting the Vendr sample may skew toward
      smaller enterprise or lower-volume deployments rather than the top-cohort enterprise accounts where
      Devo's NRR proxy is strongest.

      Customer satisfaction signals from third-party review platforms are positive. PeerSpot shows 95% of
      reviewers willing to recommend Devo, with an 8.4/10 average rating, compared to Splunk's 8.3/10
      and 94% recommend rate. Gartner Peer Insights covers Devo in the SIEM category with 84 ratings,
      though the page content was not fully indexable from the fetch (JavaScript-gated). PeerSpot review
      content highlights specific retention-friendly behaviors: fast support responsiveness, strong
      partnership mindset, and hands-on assistance. Adverse satisfaction signals include onboarding
      complexity, browser UI instability, and log parsing friction noted by multiple practitioners.

      Contract length and renewal terms are not publicly disclosed. The ingest-based pricing model means
      customers naturally expand spend as their data volumes grow, creating a structural land-and-expand
      mechanism that supports NRR above 100% if retention rates are high.
