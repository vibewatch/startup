figures:
  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: >
      Customer journey from initial awareness through active deployment and expansion, showing the
      distinct paths for direct enterprise buyers, MSSP-mediated buyers, and federal procurement.
      Key value moments and churn risk points are indicated.
    data:
      nodes:
        - id: awareness
          label: Awareness
          detail: >
            Splunk migration campaign ('Move to Devo in 100 Days'); SIEM analyst shortages driving SOC
            modernization interest; PeerSpot/Gartner Peer Insights practitioner reviews; trade shows
            and MDR partner referrals; AWS Marketplace discovery
        - id: evaluation
          label: Technical Evaluation
          detail: >
            POC/POV with customer data; comparison vs. Splunk, Microsoft Sentinel, Chronicle; pricing
            model assessment (per-GB vs. per-seat/per-event); FedRAMP ATO validation for federal buyers;
            multi-tenant demo for MSSP evaluators
        - id: procurement
          label: Procurement
          detail: >
            Direct: Enterprise sales with CISO/security budget owner; complex seven-figure deals
            typical for large SOC deployments. MSSP channel: Devo Drive partner program.
            Federal: DLT/TD SYNNEX channel; FedRAMP ATO required; AWS GovCloud Marketplace option
        - id: onboarding
          label: Onboarding and Deployment
          detail: >
            Devo Relay deployed (customer-side); data sources connected (400+ certified connectors);
            Devo Exchange detection content imported; MITRE ATT&CK framework mapping configured.
            Typical deployment 'weeks to months' (PeerSpot). Onboarding complexity is a documented
            risk: SWOT identifies high time-to-value as a weakness; analyst ramp-up time is noted
            as steep for less technical teams
        - id: active-use
          label: Active SOC Operations
          detail: >
            Daily alert triage via ThreatLink correlation; threat hunting via DeepTrace; UEBA monitoring
            via Devo Behavior Analytics; Activeboards visual dashboards; Devo Exchange content updates.
            ROI typically reported within 60–90 days by referenced customers
        - id: expansion
          label: Expansion
          detail: >
            Ingest-based pricing creates natural spend growth as data volumes increase (new cloud sources,
            endpoints, acquired entities); MSSP end-client count growth drives additional tenant revenue;
            UEBA and SOAR add-on consumption; Devo Exchange content library adoption deepens platform
            stickiness
        - id: retention-churn
          label: Retention / Churn Risk
          detail: >
            High switching cost (400-day hot data history loss); 95% recommend rate (PeerSpot); adverse
            signals: browser UI instability, log parsing complexity, Security Operations module gaps,
            unparsed log pricing surprise. MSSP partner churn carries amplified end-client risk
    claimRefs:
      - CU001
      - CU006
      - CU017
      - CU030
      - CU036
      - CU041

