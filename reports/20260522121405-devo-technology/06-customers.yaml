  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: nrr-grr-churn-disclosure
      missingEvidence: >
        Devo does not publicly disclose NRR, GRR, gross churn rate, cohort-level retention data,
        customer count, or contract renewal rates. The only NRR proxy is from swotanalysis.com
        (~120% for top enterprise cohort), which is an unverified third-party synthesis site.
      whyItMatters: >
        Without confirmed NRR and GRR, it is not possible to distinguish whether Devo's revenue growth
        is driven by genuine account expansion (NRR) versus new logo acquisition (which would imply a
        high-velocity but potentially fragile growth trajectory). NRR above 115% would strongly support
        a durable, compounding revenue base; NRR below 100% would indicate net revenue erosion from
        churn despite new logo growth.
      diligencePath: >
        Request NRR and GRR directly from Devo management for the most recent completed fiscal year;
        ask investor board members (Eurazeo, TCV, General Atlantic) whether NRR is reported in board
        packages; request cohort-level retention by vertical and by deal size; ask for the ratio of
        expansion revenue to new logo revenue.
      relatedQuestionRefs: [QU016, QU017]

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >
        No top-customer ARR concentration data, single-customer revenue cap, or ARR-by-segment breakdown
        has been published by Devo. Customer count for 2024 or any year after FY2022 has not been
        disclosed.
      whyItMatters: >
        If a small number of large accounts (AT&T, Telefonica, major MSSP partners) represent a
        significant fraction of ARR, a single churn event could materially impact revenue. At $70.6M
        ARR, a $5–10M account represents 7–14% of the total. MSSP channel concentration amplifies this
        risk if MSSP churn brings multiple end-client accounts simultaneously.
      diligencePath: >
        Request top-10-customer ARR concentration and any "greater than X% of ARR" disclosures; ask
        whether any single customer (direct or MSSP-mediated) represents more than 10% of ARR;
        separately assess MSSP-sourced ARR as a percentage of total.
      relatedQuestionRefs: [QU024, QU026]

    - type: private-evidence-only
      severity: material
      topic: mssp-revenue-share
      missingEvidence: >
        The percentage of Devo's ARR from MSSP-channel versus direct enterprise customers is not
        disclosed. The MSSP channel revenue missed its growth target per the SWOT analysis, suggesting
        the MSSP component may be smaller than intended.
      whyItMatters: >
        MSSP channel dependence creates a distinct risk profile from direct enterprise sales: MSSP
        partner churn removes multiple end clients simultaneously, MSSP pricing dynamics may be
        different from direct enterprise, and MSSP partner selection/program health directly affects
        Devo's indirect revenue.
      diligencePath: >
        Request MSSP-sourced ARR and MSSP customer count; ask for number of active Devo Drive partners;
        assess Trustwave partnership ARR contribution; probe for any MSSP partner churns or partner
        program restarts.
      relatedQuestionRefs: [QU024, QU025]

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof-table
      missingEvidence: >
        The Named Customer Proof Table (TU002) covers only customers with named contacts or detailed
        case study evidence. An unknown number of additional customers exist in Devo's installed base
        (claimed 1,000+ but not validated) for whom no public evidence is available. Press-release
        mentions (AT&T, Sonos, Manulife, H&R Block, Unisys) lack deployment detail.
      whyItMatters: >
        Logos without use cases provide limited signal on production deployment depth, outcome quality,
        or retention durability. A small set of well-documented customers is valuable but does not
        confirm the breadth implied by the 1,000+ deployment claim.
      diligencePath: >
        Request a curated list of referenceable customers by vertical; ask for three enterprise reference
        calls with customers who have been on the platform for 2+ years; probe specifically for any
        customers who evaluated and rejected Devo or who churned after deployment.
      relatedTableRefs: [TU002]
      relatedQuestionRefs: [QU022]

    - type: private-evidence-only
      severity: minor
      topic: contract-terms-renewal
      missingEvidence: >
        Contract length, renewal rates, and auto-renewal provisions are not publicly disclosed. Typical
        enterprise SIEM contracts are multi-year, but Devo's specific terms and renewal dynamics are
        unknown.
      whyItMatters: >
        Short-term or annual contracts create higher churn surface than multi-year agreements. Contract
        length affects NRR calculation methodology and directly determines how quickly a churned customer
        impacts ARR.
      diligencePath: >
        Request distribution of contract lengths (1-year, 2-year, 3-year+) across the installed base;
        ask for renewal rate at contract end date (as distinct from GRR which is continuous).
      relatedQuestionRefs: [QU017]

