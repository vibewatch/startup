  claims:
    - id: CU001
      statement: >
        Devo's primary buyer segment is the large enterprise SOC (security operations center), with the
        CISO or SOC manager as economic buyer and SOC analysts as end users. The platform targets companies
        requiring petabyte-scale cloud security analytics — implicitly enterprises above 1,000 employees.
        MSSPs (managed security service providers) form a distinct second buyer segment using Devo's
        multi-tenant architecture to deliver managed SIEM to their own clients.
      type: observed
      topic: customer-segments
      sourceRefs: [SU001, SU002, SU026]
      confidence: high
      freshness: current
      answersQuestionRefs: [QU001, QU002]

    - id: CU002
      statement: >
        Named and referenced customers span financial services, telecom, retail/consumer, IT services,
        energy/utilities, and public sector (defense, federal civilian, education), across North America,
        EMEA, and APAC. This vertical distribution is sourced from official case studies, press releases,
        and testimonial pages. Healthcare is identified as a target vertical on cyberse.com and in Devo's
        marketing materials but has no named customer evidence.
      type: observed
      topic: verticals
      sourceRefs: [SU003, SU004, SU005, SU010, SU012, SU013, SU026]
      confidence: high
      freshness: current
      answersQuestionRefs: [QU001, QU029]

    - id: CU003
      statement: >
        Devo's APAC customer base includes Powerco (New Zealand energy provider), Bitkub Exchange
        (Thailand crypto), and a dedicated in-region AWS environment for APAC customers announced at the
        time of the Series E in October 2021. APAC expansion was cited as a strategic priority in both
        the Series E and Series F funding announcements.
      type: company-claimed
      topic: geography
      sourceRefs: [SU013, SU004]
      confidence: medium
      freshness: recent
      answersQuestionRefs: [QU029]

    - id: CU004
      statement: >
        Cyberse.com identifies financial services, healthcare, retail, and public sector as Devo's target
        vertical markets as of December 2025. This is consistent with the named customer distribution in
        official Devo materials. Healthcare is listed as a target vertical but no named healthcare customer
        has been identified in publicly available evidence.
      type: third-party-reported
      topic: verticals
      sourceRefs: [SU026]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QU001]

    - id: CU005
      statement: >
        Devo serves both direct enterprise buyers and MSSP-mediated buyers, with the MSSP channel
        using Devo's multi-tenant architecture (configurable tenant-in-seconds via API, unlimited tenants,
        data residency compliance) to deliver managed SIEM to end clients. MSSP-sourced ARR as a
        percentage of total ARR is not publicly disclosed.
