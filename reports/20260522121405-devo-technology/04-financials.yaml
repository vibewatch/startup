      - Missing Metric
      - Impact on Underwriting
      - Exact Diligence Path
    rows:
      - - Post-October 2024 ARR / Revenue Update
        - High — 7+ months stale; ARR growth rate may have decelerated or accelerated
        - Request November 2025–May 2026 ARR snapshots from Devo management; verify with audited MRR schedules
      - - GAAP Revenue and Gross Margin (US entity)
        - High — GAAP revenue may differ materially from ARR; gross margin is unknown
        - Obtain Devo Technology, Inc. audited financial statements; or US GAAP management accounts at minimum
      - - Cash On Hand and Monthly Burn Rate
        - High — without cash and burn, runway cannot be calculated with any precision
        - Request current cash balance, trailing 12-month operating cash flow, and monthly burn run-rate
      - - Revenue Mix (subscription vs. services)
        - Medium — services revenue dilutes gross margin and may distort ARR growth quality
        - Request revenue disaggregation in audited financials; confirm % of contracted multi-year vs annual
      - - Customer Concentration (top 5 / top 10 ARR)
        - High — enterprise SIEM customers are few; top-customer churn risk is concentrated
        - Obtain ARR by customer; identify any customer representing >5% of total ARR
      - - Customer Count and ACV Distribution
        - Medium — necessary to assess market penetration, churn risk, and upsell potential
        - Disclose current paying customer count, ACV buckets, and cohort retention analysis
      - - New Round / Exit Process Status
        - High — 36-month funding gap creates uncertainty about capital plans
        - Direct inquiry to CFO on funding pipeline, board-authorized liquidity strategy, and any active M&A process

