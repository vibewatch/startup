        - Best-in-class retention; expansion more than offsets churn; high LTV signal
        - Confirm with audited cohort data; obtain by vintage and geography
      - - Gross Margin (subscription)
        - "65–78% (estimated based on peer comps)"
        - Low
        - Core profitability driver; always-hot data architecture may suppress vs. pure SaaS peers
        - Obtain GAAP gross margin from audited US or UK financials; compare to Elastic (76%) and CrowdStrike (75%)
      - - Gross Margin (blended)
        - "60–75% (estimated with services drag)"
        - Low
        - Blended margin affected by professional services revenue and cost
        - Confirm services gross margin separately; blended margin may be materially different from subscription-only
      - - Customer Acquisition Cost (CAC)
        - "Not disclosed; unavailable"
        - null
        - Determines sales efficiency and payback viability
        - Request CAC by channel (direct vs. MSSP); compare to $500K–$2M estimated for large enterprise SIEM
      - - LTV / Payback Period
        - "Not disclosed; unavailable"
        - null
        - LTV/CAC ratio determines unit economics health; >120% NRR improves LTV significantly
        - Calculate from gross margin and average contract size once CAC is known
      - - Average Contract Value (ACV)
        - "$131,250 median (Vendr); $90K–$5.4M+ estimated range"
        - Low
