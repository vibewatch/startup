        diligencePath: >-
          Request cash flow statement for trailing 12 months; obtain board-approved runway projection;
          confirm deferred revenue balance and unearned subscription backlog.
        relatedQuestionRefs:
          - QI012
        relatedTableRefs:
          - TI004
  
      - type: missing-source
        severity: material
        topic: GAAP revenue, gross margin, and COGS breakdown
        missingEvidence: >-
          No GAAP revenue, gross margin, COGS split (infrastructure vs. services vs. support), or
          contribution margin data for Devo Technology, Inc. is publicly available. UK subsidiary
          accounts filed at Companies House are the only partially accessible formal financial record.
        whyItMatters: >-
          GAAP gross margin determines whether Devo's unit economics support scale; a gross margin below
          65% would indicate cloud infrastructure costs (always-hot data) are significantly suppressing
          contribution margin relative to peers.
        diligencePath: >-
          Obtain audited financial statements for Devo Technology, Inc. from the company; or review UK
          consolidated accounts at Companies House; benchmark COGS per GB against AWS infrastructure list
          pricing for the platform's data retention requirements.
        relatedQuestionRefs:
          - QI010
          - QI023
        relatedTableRefs:
          - TI003
  
      - type: missing-source
        severity: material
        topic: Customer count, ACV distribution, and concentration
        missingEvidence: >-
          Total paying customer count, ACV distribution buckets, and percentage of ARR attributable to
          top 5 or top 10 customers are not disclosed. GetLatka notes "We do not have customer count
          information for Devo yet."
        whyItMatters: >-
          At $70.6 million ARR with a median ACV of ~$131,000, Devo could theoretically have 500+ customers
          or, if weighted toward $1M+ enterprise deals, fewer than 100. High concentration in a small
          number of accounts creates churn and negotiation risk.
        diligencePath: >-
          Request customer count, top-10 customer ARR, and ACV distribution from Devo; confirm whether
          any single customer exceeds 5% of total ARR; obtain cohort retention table by year of first contract.
        relatedQuestionRefs:
          - QI003
          - QI004
          - QI007
        relatedTableRefs:
          - TI003
  
      - type: access-blocked
        severity: material
        topic: New funding round, M&A process, or secondary transactions
        missingEvidence: >-
          It is unknown whether Devo has an active fundraising process, M&A sale process, or secondary
          share transaction underway as of May 2026. The 36-month funding gap could reflect any of the
          three interpretations cited in CI029.
        whyItMatters: >-
          An undisclosed sale or IPO process would materially affect the financial picture for any
          prospective investor or partner; a down-round would reset employee equity expectations and
          affect recruitment and retention.
        diligencePath: >-
          Direct inquiry to Devo CFO (Wences Sevillano) and CEO (Ken Naumann) on board-authorized
          capital strategy; request most recent Board-approved annual operating plan.
        relatedQuestionRefs:
          - QI013
        relatedTableRefs:
          - TI004

      - type: missing-source
        severity: material
        topic: MSSP and channel ARR contribution
        missingEvidence: >-
          Devo does not disclose the percentage of ARR sourced through MSSP or channel partners versus
          direct enterprise sales. The only confirmed MSSP partnership is Trustwave (XMDR/SIEM). The
          Q4 2025 SWOT analysis flagged that MSSP partner-sourced revenue "did not meet its aggressive
          growth goal."
        whyItMatters: >-
          If MSSP channel ARR is a meaningful portion of total ARR but is under-delivering, it creates
          downside risk to the overall growth trajectory and raises questions about go-to-market
          efficiency. Conversely, if MSSP ARR is minimal, the channel investment may not be generating
          adequate returns.
        diligencePath: >-
          Request from Devo CFO: (1) total ARR by channel (direct vs. partner/MSSP); (2) Trustwave
          contract value and renewal status; (3) pipeline breakdown by source in CRM; (4) list of
          active MSSP partnerships beyond Trustwave.
        relatedQuestionRefs:
          - QI022
        relatedTableRefs:
          - TI003

