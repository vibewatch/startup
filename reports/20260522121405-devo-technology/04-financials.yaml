      - - Revenue per Employee
        - "$134K–$201K/employee (based on 351–530 staff and $70.6M ARR)"
        - Low
        - Sales and operational efficiency metric
        - Validate with audited revenue; confirm ARR/FTE trajectory post-headcount reduction
      - - Quota-Carrying Sales Reps
        - "28 reps (GetLatka, late 2024)"
        - Medium
        - $2.5M ARR per rep at 28 reps; slightly below best-in-class SaaS; consistent with long enterprise cycles
