  - id: TV005
    title: Thesis-Break and Kill-Trigger Table
    notes: >
      Kill criteria are objective, observable events that signal irreversible deterioration of the thesis. Monitoring
      indicators are available from public sources or via diligence checkpoints. Action implications are for an investor
      evaluating, tracking, or holding a position in Devo.
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Down round at <$1B valuation
        - Any new institutional round priced below $1B post-money
        - Confirms overvaluation; cascades anti-dilution triggers; signals commercial distress to buyers and customers
        - Exit TRACK; move to AVOID unless new capital provides clear path to exit above preference waterfall
      - - No new round or M&A by mid-2027
        - 24 months from May 2026 with no capital raise or signed acquisition
        - Burn exhaustion risk material; forces distressed scenario as primary outcome; runway unknown
        - Flag for adverse scenario; initiate direct investor dialogue on capital adequacy
      - - ARR update shows <20% YoY growth
        - Post-October 2024 ARR update below $85M (<20% growth from $70.6M)
        - Confirms revenue growth deceleration; down-round probability rises sharply; multiple compresses to 3–5x
        - Move valuation range to $210M–$500M; re-evaluate thesis
      - - Gartner MQ exclusion persists in 2026 report
        - Second consecutive year excluded from Gartner SIEM MQ (Q4 2026 publication)
        - Net-new logo pipeline permanently impaired; enterprise buyer default to MQ leaders accelerates
        - Severe; reduces strategic M&A value to technology-acquisition floor; move toward AVOID
      - - Second CEO departure within 18 months
        - Ken Naumann departs before September 2026 or end of 2026
        - Four CEOs in five years = structural governance failure; buyer diligence red flag; employee attrition
        - Move to AVOID; governance instability is a primary diligence killer for most institutional investors
      - - FedRAMP ATO lapses or is suspended
        - FedRAMP continuous monitoring failure resulting in suspension of ATO
        - Eliminates entire federal revenue channel; GSA/SBA sponsorship withdrawn; federal ARR to zero
        - Immediate adverse trigger; eliminates federal thesis; materially reduces SAM and strategic value
