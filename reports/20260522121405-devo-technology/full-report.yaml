      - number: '8.3'
        title: Comparable Valuation Analysis — Public and Private Comps
        blocks:
          - type: paragraph
            body: >
              A credible valuation range for Devo requires benchmarking against (a) public cybersecurity SaaS companies
              at comparable scale and growth, (b) private SIEM and adjacent security analytics transactions, and (c)
              strategic acquisition precedents.

              Among public comps, CrowdStrike (CRWD) is the sector premium benchmark, generating $5.25B in ARR as of
              fiscal year 2026 (ending January 2026) with 24% year-over-year growth, approximately 18–19x NTM
              EV/revenue, and >30% non-GAAP operating margins. This multiple is only reachable by companies
              simultaneously achieving hyperscale growth, strong FCF, and AI platform architecture — none of which Devo
              has publicly demonstrated. Palo Alto Networks (PANW) trades at approximately 11x NTM EV/revenue with $9.2B
              in revenue. SentinelOne (S) at approximately $1.0B revenue and ~22% growth trades at only approximately 4x
              EV/revenue, reflecting investor skepticism about scale path and profitability timeline. Elastic (ESTC)
              reported $1.483B in fiscal 2025 revenue (+17% YoY) and trades at approximately 4.8x EV/revenue,
              demonstrating that even well-performing public security analytics companies do not command premium
              multiples without clear AI platform differentiation.

              Among private SIEM/security analytics transactions, Exabeam (post-merger with LogRhythm in 2024) is
              estimated at approximately $2.4B valuation on approximately $167M revenue, implying approximately 14x
              EV/revenue — a premium justified by its scale advantage and Gartner MQ leader position. Securonix's
              valuation is subject to wide uncertainty: trackers report a range of $87M to $775M. Sumo Logic was
              acquired by Francisco Partners in 2023 for approximately $1.7B at approximately 5x trailing revenue
              ($303M). These precedents illustrate that legacy/mid-tier SIEM vendors exit at 5–14x revenue multiples
              depending on scale and growth profile, not the 20–28x implied by Devo's $2B.

              Strategic M&A context in 2025–2026 shows active consolidation at record deal values: Google's $32B
              acquisition of Wiz, Palo Alto Networks' $25B purchase of CyberArk, and 2025 cybersecurity M&A reaching
              $96B in total disclosed value (Momentum Cyber). However, these premium prices accrue to scaled,
              AI-differentiated platform leaders. For a company at Devo's scale ($70–100M ARR, excluded from Gartner MQ,
              third CEO in four years), strategic acquirer interest would most likely price at technology-value terms —
              implying a 4–10x ARR transaction value of $280M–$1.0B.

              The filing-based revenue confirmation for Devo remains the UK subsidiary annual accounts (December 31,
              2024 period). No US GAAP filing is available. All valuation work is based on third-party ARR estimates
              (GetLatka: $70.6M), which lack auditor verification and may not align with GAAP revenue.
