  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture and HyperStream Technology
        blocks:
          - type: paragraph
            body: >
              The Devo Security Data Platform is a 100% cloud-native SaaS solution architected from the ground up for
              cloud environments on AWS, Azure, and GCP. There is no on-premises deployment option. Devo's foundational
              architecture differentiator is HyperStream, the company's proprietary streaming analytics engine that
              eliminates traditional index-at-ingest overhead common in legacy SIEM architectures.

              HyperStream processes raw event data in its original form without requiring indexing or normalization at
              the point of ingestion. Data enters the platform through the Devo Relay, a customer-side component that
              tags events, applies real-time compression, and forwards encrypted streams to the platform's event load
              balancer. The load balancer decrypts and distributes events across data nodes, where collectors store data
              in raw, unparsed format organized by domain, date, and Devo tag. Parsing occurs only at query time,
              eliminating ingest-time bottlenecks and enabling automatic horizontal scalability.

              Devo claims sub-second query response times across petabyte-scale datasets, which it attributes to
              HyperStream's columnar data model optimized for security analytics workloads. These performance claims are
              company-asserted and corroborated by third-party review summaries, but have not been independently
              benchmarked through a third-party lab evaluation in publicly available form. The company's official
              documentation states that each data node can ingest 2 TB per day and support up to 10x ingest bursts;
              these figures represent marketing-tier specifications rather than independently validated benchmarks.

              All ingested data remains always hot — queryable without archival delays — for a standard retention period
              of 400 days. This substantially exceeds Splunk's default retention window of 30–90 days and is a
              frequently cited competitive advantage in practitioner reviews. The platform supports thousands of
              concurrent real-time queries according to official product documentation for public-sector customers. The
              SaaS delivery model provides automatic updates, patch management, and infrastructure scaling without
              customer-managed infrastructure. Multi-region availability supports data sovereignty requirements such as
              GDPR, and native multitenancy enables secure data segregation for enterprise and MSSP customers.
            claimRefs:
