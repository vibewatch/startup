      - number: '5.4'
        title: Trust, Security, and Compliance
        blocks:
          - type: paragraph
            body: >
              Devo's most significant compliance milestone is the FedRAMP Moderate Authorization to Operate (ATO)
              received on January 9, 2024. The authorization was sponsored by the Small Business Administration (SBA)
              and enables U.S. federal agencies and their partners to use Devo as a FedRAMP-authorized cloud SIEM. The
              platform is also available in the AWS GovCloud Marketplace for sensitive federal workloads.

              FedRAMP Moderate ATO requires assessment against 325 NIST SP 800-53 security controls across 17 control
              families, representing a rigorous third-party security assessment that Devo has passed. This is material
              for Devo's pursuit of defense and intelligence agency customers and federal contractors subject to CMMC
              and related requirements.

              Devo's CISO Kayla Williams has publicly stated that the company "relentlessly maintains the highest
              standards of internal security controls to ensure customers can protect themselves from security threats
              with peace of mind." The platform supports GDPR compliance through native multitenancy, data residency
              controls, and regional deployment options. Devo's official documentation notes support for compliance
              reporting across PCI-DSS, HIPAA, and SOC 2 audit requirements through its 400-day retention and reporting
              capabilities.

              Beyond FedRAMP, the public record does not confirm ISO 27001 certification or SOC 2 Type II attestation
              specifically for the Devo platform as of May 2026. These represent evidence gaps that prospective
              enterprise buyers — particularly in financial services and healthcare — may need to resolve directly with
              Devo. The Trust Center page provides a general company security statement but does not display current
              certification badges or links to audit reports.

              The platform supports encrypted data transmission between the Devo Relay (customer-side) and the cloud
              platform, with event-level tagging and compression applied before transmission. Role-based access
              controls, multi-tenancy isolation, and SSO/OAuth support are available. For federal and regulated-industry
              deployments, FedRAMP Moderate ATO is the most material and confirmed compliance credential. The gap in ISO
              27001 and SOC 2 public documentation is a diligence item for institutional buyers seeking a complete
              compliance matrix.
            claimRefs:
              - CE023
              - CE024
              - CE025
              - CE026
              - CE027
              - CE028
