      - number: '8.5'
        title: Exit Readiness, Final Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              Devo's exit readiness is impaired on multiple dimensions. A strategic acquisition — the most plausible
              positive exit path — requires a buyer with strategic rationale for Devo's SIEM/security analytics
              capabilities, tolerance for integration risk given the Gartner MQ exclusion, and willingness to accept the
              preference overhang inherited from $481–500M in total invested capital. Likely strategic acquirer
              categories include: (1) large enterprise software platforms seeking to add security analytics (e.g., IBM,
              ServiceNow, AWS native integration play); (2) scaled cybersecurity vendors seeking to fill SIEM gaps
              (e.g., CrowdStrike); and (3) PE-backed cybersecurity consolidators.

              An IPO is not credible in the near term (12–18 months). Requirements for a successful cybersecurity IPO in
              2026 include: >$200M ARR, >80% gross margin, documented path to profitability, and clean governance
              history. Devo meets none of these thresholds publicly.

              Down-round risk is the highest near-term financial risk. If Devo seeks additional institutional capital in
              2026–2027, the rational market-clearing price for a new round is likely $500M–$900M, implying a down round
              from $2B. A down-round has cascading effects: anti-dilution provisions trigger ratchets for earlier
              investors, management option re-pricing creates governance friction, and the down-round signal materially
              damages customer confidence and enterprise sales cycles. The Hurun Global Unicorn Index documented 128
              unicorn valuation drops in 2023 alone — a precedent well-established in the 2022–2026 correction cycle.

              The active M&A environment provides a structurally positive backdrop. Windsor Drake reports Q4 2025
              cybersecurity M&A at 234 deals year-to-date (record pace), and PwC's 2026 technology deal outlook confirms
              that strategic buyers are aggressively chasing AI capabilities and software platform consolidation. This
              activity creates optionality for Devo, but only at the right price. A strategic buyer at 8–10x ARR would
              produce $565M–$706M — a positive outcome for early investors with 1x non-participating preferences but a
              significant loss for investors at the $2B mark.

              The final diligence asks (TV006) focus on the information gaps that most materially affect the valuation
              range: audited ARR/GAAP revenue, burn rate and runway, preference stack structure, whether any secondary
              transactions have occurred below $2B, and the specific Gartner MQ re-qualification path and timeline.
