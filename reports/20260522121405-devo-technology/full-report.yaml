      - number: '1.3'
        title: Funding History, Valuation, and Capitalization
        blocks:
          - type: paragraph
            body: >
              Devo Technology has raised over $500 million in total venture capital across six institutional funding
              rounds since its founding. Early capital came from Spanish-based Kibo Ventures and Atlantic Bridge, which
              provided seed and Series A support to the original Logtrust entity. The company's U.S. expansion was
              financed through a $35 million Series B led by Insight Partners in September 2017, followed by a $25
              million Series C led by Insight Venture Partners in June 2018 (coinciding with the Logtrust-to-Devo
              rebrand). These early rounds established Insight Partners as the most consistent long-term investor.

              In September 2020, Georgian Partners led a $60 million Series D round, joined by Bessemer Venture Partners
              and Insight Partners, providing growth capital for enterprise sales expansion. The company achieved
              unicorn status in October 2021 with a $250 million Series E led by TCV at a $1.5 billion valuation, with
              General Atlantic and Eurazeo joining as new investors alongside existing backers. This remains the largest
              single funding event in Devo's history.

              The most recent round was a $100 million Series F in June 2022, led by Eurazeo at a $2 billion post-money
              valuation, with all existing investors participating and ISAI Cap Venture added as a strategic investor.
              The total capital raised exceeded $500 million following this round. Notably, no new institutional funding
              has been publicly announced since June 2022 — a gap of over three years as of the run date — which raises
              questions about capital adequacy, runway, and whether an IPO or strategic transaction may be under
              consideration.

              Devo's $2 billion valuation relative to its $70.6 million ARR (as of late 2024) implies a
              revenue-to-valuation multiple in excess of 28x — a premium multiple that may not be supported by current
              public market comps in the cybersecurity sector, suggesting the valuation could be considered elevated in
              the current environment.
