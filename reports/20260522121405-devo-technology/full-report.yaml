      - Severity
      - Mitigation
      - Residual Exposure
      - Diligence Path
    notes: >
      Rows ordered by severity. Likelihood and severity reflect current state; Devo has no publicly known unresolved
      material legal exposure as of May 2026. EU AI Act and NIS2 rows reflect compliance deadlines approaching as of
      report date, not confirmed violations.
    rows:
      - - EU AI Act (Regulation 2024/1689) — High-Risk AI Classification
        - European Union
        - Deadline August 2, 2026 for full applicability; compliance status unconfirmed
        - >-
          Medium — Devo's AI security features (ThreatLink, DeepTrace, Behavior Analytics) likely require classification
          review; high-risk classification probable for critical infrastructure deployments
        - >-
          High — Fines up to €35M or 7% of global annual turnover for non-compliance; market access risk for EU
          customers
        - Devo Trust Center references privacy compliance; no public EU AI Act conformity statement published
        - 'Residual: Material — EU AI Act gap assessment not confirmed; AI product classification unresolved publicly'
        - >-
          Request EU AI Act gap assessment; confirm legal opinion on high-risk AI classification for each AI module; ask
          whether a Notified Body conformity assessment has been initiated
      - - NIS2 Directive (Directive 2022/2555) — Managed Security Provider Obligations
        - European Union / Member States
        - Directive effective October 2024; national transpositions ongoing
        - Medium — Devo's EU MSSP customers and EU-based operations create NIS2 coverage obligations
        - High — Fines up to €10M or 2% of annual turnover; incident notification failures carry escalating penalties
        - FedRAMP and SOC posture provide partial controls alignment; no NIS2-specific public disclosure
        - 'Residual: Medium — NIS2 supply chain requirements may require additional vendor documentation'
        - >-
          Request NIS2 compliance posture document; identify which EU member states impose highest compliance burden on
          Devo; confirm incident notification procedures
      - - Shannon v. Devo Technology, Inc. (1:24-cv-10327) — Employment Civil Rights
        - U.S. District Court, District of Massachusetts
        - Settled April 11, 2025; stipulation of dismissal filed May 19, 2025; case closed
        - Resolved — no ongoing litigation
        - Low — settled; no public liability established; no punitive ruling
        - Defense and settlement managed by legal counsel; case disposed
        - 'Residual: Low — settlement terms not public; no ongoing exposure identified'
        - >-
          Confirm settlement terms are fully satisfied; assess whether any related EEOC charge or administrative
          proceeding exists
      - - FedRAMP Moderate ATO — Continuous Monitoring
        - U.S. Federal Government (GSA / FedRAMP PMO)
        - Active — ATO obtained January 9, 2024; continuous monitoring required annually
        - Low — Devo has maintained ATO since January 2024; no lapse reported
        - High — Loss of ATO would eliminate Devo from all federal procurement; federal segment revenue at risk
        - >-
          Dedicated FedRAMP compliance team implied by CISO Kayla Williams' public statements; SBA-sponsored ATO
