  - id: FV004
    title: Investment KPIs — IC-Ready Scoring
    type: kpi
    layout: wide
    summary: >
      Investment committee scoring across eight dimensions for Devo Technology as of May 2026. Scores reflect evidence
      quality and current state, not potential. Low scores on financial transparency and valuation risk dominate the
      composite picture.
    approximationNotes: >
      Scores are qualitative assessments based on available public evidence; not quantitative optimization. Confidence
      is higher for market, competitive position (observable), and lower for financial metrics (unaudited, third-party
      estimates only).
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
    data:
      items:
        - id: market-opportunity
          label: Market Opportunity
          value: 7/10
          context: >-
            SIEM/analytics TAM $8.4–12.1B (2026), 10–12% CAGR; NIS2/DORA tailwinds. Constrained by Microsoft Sentinel
            bundling and XDR convergence.
        - id: product-moat
          label: Product and Technical Moat
          value: 7/10
          context: >-
            Cloud-native architecture, 400-day hot retention, multi-tenancy, open API are genuine differentiators.
            Browser UI instability and AWS-only dependency limit score.
        - id: customer-proof
          label: Customer Proof and Retention
          value: 6/10
          context: >-
            NRR >120%, named enterprise logos (AT&T, Sonos, Unisys, Telefónica), FedRAMP. Concentration unquantified; no
            post-2024 customer count disclosed.
        - id: financials
          label: Financial and Unit Economics
          value: 4/10
          context: >-
            ARR $70.6M, 90% YoY (Oct 2024). Gross margin, burn rate, runway all unknown. No post-2024 ARR update. MSSP
            channel miss documented.
        - id: competitive-position
          label: Competitive Position
          value: 4/10
          context: >-
            Gartner SIEM MQ excluded 2025; CRWD, Sentinel, Splunk all in MQ and scaling faster. Devo lacks FY2025/2026
            market share data.
        - id: management-governance
          label: Management and Governance
          value: 3/10
          context: >-
            Third CEO in ~4 years; headcount -50% from peak; MSSP channel miss. Ken Naumann (March 2025) untested at
            this scale. Walter Scott Executive Chairman provides some continuity.
        - id: valuation-risk
          label: Valuation Risk
          value: 2/10
          context: >-
            $2B at ~28x ARR. Base-case fair value ~$565M (72% discount). Preference overhang ~$500M limits common equity
            upside in any realistic exit scenario.
        - id: evidence-quality
          label: Evidence Quality
          value: 5/10
          context: >-
            Strong on ARR, funding history, tech differentiation. Weak on financials: no audited statements, burn,
            runway, cap table, or post-2024 ARR. 24 cumulative unresolved questions.
