  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Segments
        blocks:
          - type: paragraph
            body: >
              Devo Technology's primary buyer is the large enterprise security operations center (SOC), where the
              platform is deployed as the core SIEM and security analytics foundation. The SOC manager or CISO is the
              economic buyer; SOC analysts are the primary daily users; and the IT/security procurement team or managed
              security service provider (MSSP) mediates channel purchases. Devo's own marketing describes the
              addressable customer as global enterprises needing petabyte-scale security analytics at cloud speed —
              implying a target company size above 1,000 employees and typically above $500M in revenue.

              Vertically, named and referenced customers span financial services (OneMain Financial, Manulife, H&R
              Block, FanDuel, AMEX Global Business Travel, Bitkub Exchange), telecom (Telefonica, AT&T), retail and
              consumer (Ulta Beauty, Sonos), IT and professional services (Unisys, Kforce), energy and utilities
              (Powerco in New Zealand), and public sector including defense, federal civilian, and higher education
              (U.S. Air Force, Accenture Federal Services, Ivy Tech Community College, Oklahoma University). A distinct
              buyer segment comprises MSSPs using Devo's multi-tenant architecture to deliver managed SIEM and
              co-managed SOC services to their end clients (CyberMaxx, DeepSeas, Talion, Trustwave MXDR).

              Geographically, Devo's disclosed customer base is concentrated in North America, with notable EMEA
              presence reflecting Devo's Spanish founding roots (Telefonica, Caixa Bank cited in G2 context), and
              growing Asia-Pacific exposure following targeted expansion investment including the Powerco (New Zealand
              energy) and Bitkub (Thailand crypto exchange) deployments and the launch of an in-region AWS environment
              for APAC customers and partners cited in the Series E announcement.

              Devo's cyberse.com listing identifies healthcare, retail, financial services, and public sector as
              documented target verticals, consistent with named customer distribution. The platform serves both direct
              enterprise buyers and indirect MSSP-mediated buyers, with the MSSP channel representing an increasingly
              strategic segment given the multi-tenant architecture investment and the Devo Drive partner program,
              though MSSP-sourced revenue as a percentage of total ARR is not publicly disclosed.
