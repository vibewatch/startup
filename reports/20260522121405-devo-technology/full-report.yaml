      - number: '2.3'
        title: Buyer, User, Payer Segmentation and Budget Ownership
        blocks:
          - type: paragraph
            body: >
              The primary buyer of a SIEM platform is the Chief Information Security Officer (CISO) or VP of Security at
              enterprises with dedicated security operations centers. At organizations without a CISO, the CTO or
              Director of IT Security typically owns the decision. The user of the SIEM is the SOC analyst team—
              typically 5–50 analysts at large enterprises—who interact with the platform daily for threat detection,
              investigation, and incident response. The payer is the CISO budget, which at large enterprises ($1B+
              revenue) typically runs $5–25 million annually for all security tooling. Gartner projects total global
              information security end-user spending to exceed $240 billion in 2026, a 12.5% increase over 2025, with
              software and platforms (including SIEM) consuming 40%+ of security budgets.

              By organization size, Devo's primary landing zone is the large enterprise (1,000–50,000+ employees),
              particularly in financial services, retail, energy/utilities, and healthcare. These organizations have the
              highest data-ingestion volumes, the most complex multi-cloud environments, and the most mature SOC
              practices. At the high end, Global Fortune 500 organizations may pay $2–10 million annually for Devo,
              making them the highest-value accounts. Mid-market organizations (100–999 employees) with growing security
              teams are a secondary segment addressable through channel partners and MSSPs; these organizations
              typically lack the SOC scale to justify Devo's premium pricing and prefer managed SIEM alternatives.

              By vertical, financial services (BFSI) is the strongest buyer segment, driven by PCI-DSS, SOX, and
              regulatory audit requirements that mandate comprehensive log retention and event correlation. Healthcare
              organizations face HIPAA compliance requirements. Retail and e-commerce organizations with high-volume
              transaction data and fraud risk are a natural fit for Devo's HyperStream ingestion engine. U.S. federal
              government agencies and defense contractors gained access as an addressable segment following FedRAMP
              Moderate Authorization; Devo lists the U.S. Air Force and Accenture Federal Services as reference
              customers in the public sector.

              Budget ownership varies by organization type. In enterprise accounts, the security budget is typically a
              line item owned by the CISO reporting to the CIO or CEO, with SIEM as a non-discretionary platform spend.
              In federal accounts, contracting officers and IT program managers are involved in the procurement process,
              extending sales cycles to 12–18 months. The primary adoption trigger across segments is either a security
              incident (breach, ransomware) driving urgent platform replacement, a SIEM vendor end-of-life event (e.g.,
              Splunk or IBM legacy product discontinuation), or a compliance audit finding requiring comprehensive log
              coverage.

              A notable go-to-market dynamic: Cisco's 2024 acquisition of Splunk is generating customer concerns about
              product roadmap and pricing continuity, creating a displacement opportunity for Devo in the Splunk
              installed base. Similarly, the managed detection and response segment—where MSSPs like Trustwave, which
              partnered with Devo for its XMDR service—represents a channel that brings in multi-year contracts with
              managed recurring revenue characteristics.
