      - number: '7.3'
        title: Financial, Funding, and Valuation Risk
        blocks:
          - type: paragraph
            body: >
              Devo Technology's last publicly announced institutional funding round was the $100 million Series F in
              June 2022, led by Eurazeo at a $2 billion post-money valuation. With $70.6 million ARR reported in October
              2024, the $2 billion valuation implies approximately 28x ARR multiple. By comparison, leading public SaaS
              security companies (CrowdStrike, Elastic) trade at 8–15x forward revenue multiples in 2026. A down round
              or liquidity event at compressed market multiples could imply a valuation of $600M–$900M (at 8–12x current
              ARR), representing a 55–70% impairment from the $2 billion peak. This is not confirmed — no down round has
              been announced — but the gap between the 2022 valuation and current public comparables represents
              meaningful mark-to-market risk for existing shareholders.

              Three years and eleven months have elapsed since the Series F without a public funding announcement. The
              typical venture fundraising cycle for a growth-stage SaaS company of Devo's scale is 18–24 months between
              rounds. The absence of a new round could reflect one of several scenarios: (a) Devo is self-funding growth
              from cash generated by subscription ARR; (b) Devo has sufficient Series F capital remaining to fund
              operations through a planned exit; (c) fundraising conditions at the $2B mark have been challenging.
              Headcount decline from a peak of approximately 769 employees in December 2022 to approximately 350–530 as
              of April 2026 (per Unify headcount data) is consistent with active cost discipline, a burn rate reduction
              program, or both. The Unify report cites 39% EBITDA growth in 2025, suggesting improving profitability
              metrics, but no audited financials are available to confirm this.

              Burn rate and cash runway remain undisclosed. With a total of $500 million raised across six rounds and a
              Series F close in June 2022, and assuming Devo has been operating at a moderate burn rate consistent with
              headcount reduction, the remaining Series F capital is likely providing continued runway, but the exact
              magnitude is unknown. Exact diligence path: request cash and cash equivalents, monthly burn rate, and
              projected runway from management; request whether any investor secondary sales or recapitalizations have
              occurred since June 2022.

              The UK subsidiary (Devo Technology UK Limited) is required to file annual accounts at Companies House. The
              accounts for the year ending December 31, 2024 are on record (accessed May 2026). While UK subsidiary
              accounts provide some financial visibility, they do not reflect the consolidated group financials or the
              U.S. parent entity's full financial position.

              Investor exit pressure is a latent risk. Insight Partners, Georgian, TCV, General Atlantic, Bessemer
              Venture Partners, Kibo Ventures, and Eurazeo are all shareholders from rounds dating to 2022 or earlier.
              By 2026, the Series F vintage is four years old — approaching or at the typical fund investment horizon
              for many growth-stage VC firms. This does not create immediate pressure, but it increases the probability
              of an exit event (IPO, M&A, or secondary) in the 2026–2028 window. A forced exit at a lower valuation than
              the 2022 mark could create management incentive misalignment if option strike prices are above the exit
              valuation.
