  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Regulatory, and Compliance Risk
        blocks:
          - type: paragraph
            body: >
              The only confirmed litigation involving Devo Technology is Shannon v. Devo Technology, Inc. (Case
              1:24-cv-10327, U.S. District Court for the District of Massachusetts). The civil rights employment lawsuit
              was filed by plaintiff Micah Shannon on February 9, 2024, and proceeded through discovery with disputes
              over interrogatories and document production. The parties reached a Settlement Order of Dismissal on April
              11, 2025, and filed a stipulation of dismissal on May 19, 2025. No trial occurred, no liability was
              established publicly, and no ongoing or active litigation involving Devo Technology has been identified as
              of May 2026. The terms of the settlement and any financial component are not publicly disclosed. No IP,
              patent, or antitrust claims involving Devo Technology appear in any public court records as of May 2026.

              The UK subsidiary, Devo Technology UK Limited (Companies House number 11507870), is required to file
              annual accounts. The most recent filed accounts are for the year ending December 31, 2024 (Companies House
              record accessed May 2026). The next accounts for the year ending December 31, 2025 are due by September
              30, 2026. The UK entity filing obligation creates modest ongoing compliance cost but no evident regulatory
              exposure. No adverse Companies House filings (struck-off notices, charges, or enforcement actions) were
              identified.

              Regulatory compliance posture presents three active risk areas. First, the EU AI Act's full provisions
              become applicable on August 2, 2026. If Devo's AI-driven threat detection, autonomous investigation, and
              behavior analytics capabilities are classified as high-risk AI (particularly when deployed in critical
              infrastructure or cybersecurity contexts), Devo would face technical documentation requirements,
              conformity assessments, human oversight obligations, and fines of up to €35 million or 7% of global annual
              turnover for non-compliance. Devo does not publicly disclose whether it has completed an EU AI Act gap
              assessment or initiated a conformity process. Exact diligence path: request AI Act gap assessment and
              legal opinion on high-risk AI classification for ThreatLink, DeepTrace, and Devo Behavior Analytics;
              confirm whether Devo has engaged an EU Notified Body for any required conformity assessment.

              Second, the NIS2 Directive (fully effective as of October 2024 with staggered national transpositions)
              applies to digital infrastructure and managed security service providers operating in EU member states.
              Devo's EU operations and its MSSP customers who serve EU organizations create NIS2 exposure. NIS2 requires
              incident notification within 24 hours, risk management measures, supply chain security documentation, and
              fines up to €10 million or 2% of annual turnover. Devo's Trust Center references privacy compliance
              frameworks but does not explicitly address NIS2 compliance. Exact diligence path: request NIS2 compliance
              posture document; confirm which EU member state transpositions are most relevant to Devo's operational
              footprint.

              Third, for federal and defense customers handling controlled defense information, ITAR and CMMC
              requirements apply at the customer level and may create pass-through obligations for Devo as a service
              provider. Devo's FedRAMP Moderate ATO (obtained January 9, 2024, sponsored by the Small Business
              Administration) covers Moderate Impact systems but does not address classified workloads (IL4/IL5), DoD
              ATO requirements, or ITAR-controlled technical data. ITAR violations carry penalties of up to $1 million
              per violation and criminal liability for executives. Exact diligence path: confirm whether any existing
              federal customers require ITAR-compliant data handling within Devo environments; assess whether IL4/IL5
              authorization is on the roadmap.

              GDPR compliance is a continuing obligation through Devo's UK subsidiary and EU customer deployments.
              Devo's Trust Center references a flexible privacy program and multi-region deployment for data residency.
              Standard contractual clauses (SCCs) for EU/US data transfers are a standard requirement. No GDPR
              enforcement actions or data protection authority investigations involving Devo have been identified in
              public records.
