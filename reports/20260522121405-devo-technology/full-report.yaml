      - number: '3.3'
        title: Feature and Capability Comparison
        blocks:
          - type: paragraph
            body: >
              SIEM buyers evaluate platforms across six primary capability dimensions: data ingestion breadth and
              performance, threat detection (rule-based and behavioral), investigation and response automation (SOAR),
              AI/ML analytics, long-term data retention economics, and compliance/certification posture.

              On data ingestion and performance, Devo's HyperStream engine provides index-free real-time search across
              petabyte-scale datasets, producing sub-second query results without pre-indexing overhead. Splunk requires
              full indexing before search, creating a 15+ minute latency gap for alert triggering in high-volume
              environments relative to Devo's architecture. Microsoft Sentinel and Google Chronicle also offer
              cloud-native streaming analytics, though Chronicle benefits from Google's BigQuery-scale infrastructure.
              IBM QRadar's on-premises architecture has performance ceilings that cloud-native vendors do not face.

              On native threat detection, Splunk Enterprise Security offers the broadest library of community-
              maintained detection rules through the Splunk Security Content Automation Protocol and Splunk Security
              Essentials. Microsoft Sentinel integrates deep Microsoft-native threat intelligence via Defender XDR,
              Entra ID, and the Microsoft Incident Response team's curated rules. Google Chronicle leverages Mandiant
              threat intelligence for curated detection content. Devo provides out-of-the-box content packs and
              behavioral analytics via its UEBA module but is generally considered to have a narrower content library
              than Splunk or Microsoft.

              On SOAR and automation, Devo includes native SOAR capabilities in its platform at no incremental cost.
              Splunk's SOAR (formerly Phantom) is an additional module with separate licensing. Securonix and Exabeam
              include UEBA and automation natively as core product features. Microsoft Sentinel includes playbook
              automation via Azure Logic Apps at additional cost per automation run.

              On AI/ML analytics, Microsoft Sentinel is differentiated by Microsoft Security Copilot, a generative AI
              layer enabling natural-language threat hunting and investigation — the most advanced generally available
              AI-assisted SIEM workflow capability among major vendors as of early 2026. Securonix deploys an "Agentic
              Mesh" with an AI SOC analyst named "Sam" for guided investigation workflows. Devo and Chronicle both
              incorporate ML-based behavioral analytics but have not released publicly verified generative AI SOC
              features at parity with Microsoft Copilot.

              On data retention economics, Devo includes 400+ days of hot storage (queryable, not archived) in its base
              price — a significant differentiator versus Splunk's extra-cost long-term retention and Microsoft
              Sentinel's 90-day default with extra charges beyond that. Chronicle includes 12 months of hot retention by
              default.

              On compliance and certifications, Devo holds FedRAMP Moderate authorization (January 2024), SOC 2 Type 2,
              and ISO 27001 with AWS GovCloud deployment for U.S. federal agency use. Splunk holds FedRAMP High
              authorization and maintains a dedicated GovCloud deployment. Microsoft Sentinel holds FedRAMP High as part
              of Azure Government. IBM QRadar has FedRAMP-authorized cloud offerings. Google Chronicle lacks FedRAMP
              authorization as of early 2026, limiting its federal market access.
