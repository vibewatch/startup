      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The primary growth driver for cloud-native SIEM is the secular transition away from on-premises security
              tools. In 2025, legacy on-premises SIEM deployments still account for approximately 55% of the installed
              base by revenue, but cloud-native solutions are growing at 13%+ CAGR versus sub-8% for on-premises,
              implying a crossover within 3–5 years. This transition creates sustained replacement demand for platforms
              like Devo throughout the late 2020s.

              Regulatory mandates represent a second major driver, particularly in Europe. The EU's NIS2 Directive
              (effective October 2024) expands cybersecurity obligations to 18+ sectors, requiring incident detection,
              reporting, and monitoring capabilities that effectively mandate SIEM deployment for medium and large
              organizations. DORA (Digital Operational Resilience Act), applying to EU financial institutions from
              January 2025, imposes ICT risk monitoring and incident response requirements. ENISA estimates that EU
              organizations now allocate approximately 9% of IT budgets to cybersecurity, with further growth driven by
              compliance pressure. These mandates are direct tailwinds for Devo's European business.

              The cybersecurity workforce shortage is a third driver. Globally, there are an estimated 4.8 million
              unfilled cybersecurity positions, with SOC analysts among the most constrained roles. This shortage
              accelerates enterprise demand for AI-augmented SIEM platforms that reduce analyst workload through
              automated alert triage, investigation, and response—capabilities that Devo explicitly markets through its
              "Autonomous SOC" positioning. Dell'Oro Group's 2026 enterprise security forecast identifies the next-gen
              AI-infused SIEM as one of two central pillars around which security budgets are organizing, alongside
              cloud-delivered edge security. This analyst framing is favorable for Devo's product positioning.

              AI-powered threat sophistication is a fourth driver. Generative AI enables low-skill adversaries to craft
              targeted spearphishing, generate malicious code, and automate attack campaigns at scale. Security teams
              facing this increased threat volume and sophistication require platforms that can ingest petabyte-scale
              telemetry and apply machine learning across behavioral baselines—the exact capability set Devo emphasizes.

              Adoption constraints are material. First, switching costs from incumbent SIEMs are high. SIEM migrations
              at large enterprises typically require 8–12 months, $1–1.2 million in integration labor, data pipeline
              reconfiguration, and analyst retraining. The 451 Research SIEM migration study (via GovInfoSecurity)
              identifies legacy entrenchment, vendor lock-in from proprietary data models, and specialized skills
              requirements as the primary friction points. Second, Microsoft Sentinel's tight Azure integration—with
              preferential pricing for Microsoft 365 and Azure-committed customers—creates a "good enough" alternative
              for organizations already on the Microsoft stack. Third, Splunk, despite Cisco acquisition uncertainty,
              retains the deepest incumbent relationships in Fortune 1000 accounts; displacing an installed Splunk
              deployment requires a compelling total-cost-of-ownership case. Fourth, the high capital intensity of
              Devo's platform—it targets premium enterprise accounts—limits penetration of the mid-market and smaller
              organizations without a scalable managed service channel.

              A specific constraint for Devo's federal expansion: despite FedRAMP Moderate Authorization obtained in
              January 2024, federal procurement cycles for IT security platforms are 12–24 months. The federal pipeline,
              while potentially high-value, will take multiple years to convert to material ARR. Additionally, data
              residency requirements in the EU and certain regulated industries require Devo to demonstrate in-region
              data processing, adding infrastructure complexity.
