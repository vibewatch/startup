      - number: '4.2'
        title: Unit Economics, Cost Structure, and Gross Margin Proxies
        blocks:
          - type: paragraph
            body: >
              Devo Technology has not publicly disclosed gross margin, customer acquisition cost (CAC), lifetime value
              (LTV), or payback period. As a private company, Devo does not file audited financial statements in the US.
              The following analysis uses public-company peer benchmarks and observable proxies to characterize the
              likely cost structure.

              Gross margin proxy: Cloud-native SaaS security analytics peers with similar architectures — Elastic (76.1%
              GAAP gross margin, FY2025), CrowdStrike (~75% non-GAAP subscription gross margin, FY2025), and SentinelOne
              (approximately 74–77% range) — provide the benchmark range. Devo's gross margin is likely in the 65–78%
              range, with the lower end reflective of cloud infrastructure costs (AWS-hosted multi-tenant environment
              with 400-day hot data retention) and professional services drag, and the upper end achievable if retention
              costs are well-managed and services revenue is minimal. Notably, Devo's "400 days of always-hot data" is a
              differentiated promise that likely carries higher cloud storage and compute costs than competitors who use
              tiered hot/cold storage. This represents a structural gross-margin headwind not present for Microsoft
              Sentinel or Google Chronicle (which leverage hyperscaler-owned infrastructure at internal cost).

              Sales efficiency proxies: GetLatka data indicates Devo had 28 quota-carrying sales representatives as of
              late 2024, against a $70.6 million ARR base. Assuming average quota attainment near industry median
              (approximately 75% of quota), and an average ACV around $130,000–$200,000 (consistent with Vendr's
              reported median contract), this implies a sales-rep-to-ARR ratio of approximately $2.5 million per rep —
              slightly below the $3–5 million range typical of best-in-class SaaS companies at this stage but consistent
              with longer, complex enterprise sales cycles. These are estimates only.

              Cost structure: Devo's engineering team (148 employees, per UnifyGTM April 2026) represents the largest
              functional segment, consistent with a platform-investment-intensive stage. Sales and support (54) and
              business management (44) represent the next largest functions. With approximately 351 total employees
              (UnifyGTM low estimate) to 530 (GetLatka November 2025 estimate), and an assumed average fully-loaded cost
              of $150,000–$180,000 per employee (consistent with US SaaS tech talent), Devo's annual operating expense
              base likely runs in the range of $53–$95 million annually in personnel costs alone, before cloud
              infrastructure, facilities, and G&A. At $70.6 million ARR and subscription gross margins in the 65–78%
              range, Devo's implied gross profit is approximately $46–$55 million, likely insufficient to cover a full
              US SaaS employee cost base, implying continued operating losses.

              CAC and payback: Without customer count data (not publicly disclosed) or sales efficiency data from Devo,
              CAC and payback period cannot be directly calculated. As a proxy, enterprise SIEM vendors typically face
              sales cycles of 6–18 months for seven-figure deals, with CAC in the range of $50,000–$500,000 per new logo
              depending on deal size and channel sourcing. With >120% NRR, Devo's gross-margin-adjusted payback period
              is partially offset by expansion dynamics.

              Working capital and capex: Devo is an asset-light SaaS business with no hardware manufacturing, no
              inventory, and no meaningful capital expenditures beyond cloud infrastructure provisioning. Working
              capital risk is low; annual subscriptions are typically billed upfront, creating positive deferred
              revenue. The primary capital efficiency risk is the cost of "always-hot" data storage at scale, which is
              operationally intensive relative to tiered-storage competitors.

              MSSP channel economics: Devo has at least one publicly confirmed MSSP relationship (Trustwave XMDR/SIEM
              partnership). MSSP-mediated revenue typically carries lower net margin than direct enterprise sales due to
              partner discounts of 20–40%, but offers lower CAC given the partner bears significant acquisition and
              service-delivery costs. The proportion of Devo's ARR from MSSP channels versus direct sales is not
              disclosed.
