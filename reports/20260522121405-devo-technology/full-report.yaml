  - id: FE001
    title: Devo Platform Architecture Stack
    type: stack
    layout: wide
    summary: >
      Layered architecture of the Devo Security Data Platform from data ingestion through HyperStream analytics to the
      AI product layer and analyst interface, showing cloud-native SaaS delivery.
    data:
      layers:
        - label: Data Sources and Ingestion
          detail: >
            400+ certified connectors; Devo Relay (customer-side compression, tagging, encryption); any data
            type/format; no pre-normalization required; REST API and Python/TypeScript SDKs
        - label: HyperStream Analytics Engine
          detail: >
            Proprietary streaming analytics; columnar data model; no index-at-ingest; raw data stored by
            domain/date/tag; parsing at query time; claimed sub-second response at petabyte scale
        - label: Data Storage and Orchestration
          detail: >
            400-day always-hot data retention; Data Orchestration routing to S3/Kinesis; Data Analytics Cloud for custom
            app development; multi-region for data sovereignty (GDPR)
        - label: AI and Detection Layer
          detail: >
            ThreatLink (alert correlation, case management); DeepTrace (autonomous investigation, attack-tracing AI);
            Devo Behavior Analytics UEBA (ML behavior models, risk scoring 0-100); Devo Exchange (MITRE ATT&CK content
            marketplace)
        - label: SIEM and SOAR Capabilities
          detail: >
            Intelligent SIEM (event correlation, MITRE ATT&CK, streaming alerts); Devo SOAR (no-code playbooks, case
            management, ServiceNow ITSM integration); third-party SOAR bidirectional integration option
        - label: Analyst Interface (Activeboards)
          detail: >
            Browser-based visual analytics canvas; line charts, heatmaps, timelines, Voronoi diagrams; real-time
            drill-down to raw events; single-pane-of-glass SOC view; no native desktop client
        - label: Cloud Delivery and Compliance
          detail: >
            100% SaaS on AWS/Azure/GCP; AWS GovCloud for federal customers; FedRAMP Moderate ATO; GDPR multitenancy;
            automatic patching; no on-premises deployment option
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE008
