      - number: '2.2'
        title: Market Sizing, TAM/SAM/SOM, and Adjacencies
        blocks:
          - type: paragraph
            body: >
              Multiple analyst firms estimate the global SIEM market at materially different scales in 2026, reflecting
              divergent scope definitions. Mordor Intelligence pegs the global SIEM market at approximately $12.1
              billion in 2026, growing to $20.78 billion by 2031 at an 11.5% CAGR. MarketsandMarkets uses a narrower
              scope and estimates $8.39 billion in 2026, growing to $13.67 billion by 2031 at a 10.3% CAGR. The IDC
              Worldwide SIEM Forecast (2025–2029) similarly projects robust growth above prior expectations, driven by
              regulatory requirements and comprehensive threat detection needs. Expert Insights' 2026 SIEM Market
              Overview aligns with the Mordor estimate, citing $10.78 billion in 2025 growing to $19.13 billion by 2030
              at a 12.16% CAGR. The divergence of approximately 2–3x between low and high estimates reflects
              methodological differences—specifically whether managed SIEM services, SOAR, UEBA, and security data lake
              infrastructure are bundled into the market definition.

              Devo's serviceable addressable market (SAM) is more constrained than the broad SIEM TAM. Applying a
              bottom-up lens: Fortune 1000 and Global 2000 enterprises with complex multi-cloud security operations—
              Devo's core customer profile—represent approximately 3,000–4,500 enterprise organizations globally. At an
              average contract value of $500K–$2M per year (consistent with Devo's disclosed customer economics in
              financial services and retail), the SAM across this cohort is approximately $1.5–9 billion annually.
              Devo's own reported ARR of $70.6 million as of late 2024 implies roughly 0.8–4.7% penetration of this SAM
              band. Devo's SOM for the next 3 years plausibly focuses on North American and Western European large
              enterprises with active SIEM refresh cycles, estimated at 800–1,200 organizations, representing a
              $400M–$2.4B annual opportunity.

              Adjacent market tailwinds further expand Devo's total opportunity. The MDR market is independently
              estimated at $3.65–$4.16 billion in 2026 and growing at a 20–22% CAGR to reach $8.57–$11.3 billion by
              2030, driven by organizations outsourcing SOC operations. Devo's platform serves both in-house and MSSP/
              MDR provider use cases, making MSSP channels an important go-to-market vector. The SOAR sub-market, often
              sold as a module on top of SIEM, adds incremental deal value. Platform convergence—integrating SIEM, SOAR,
              UEBA, and data orchestration—is the direction the entire category is moving, which works in Devo's favor
              as a natively unified platform.

              North America accounts for approximately 40–45% of global SIEM spending, Europe 25–30%, and Asia-Pacific
              15–18%. Devo's operations span all three geographies, with North America as the primary revenue base. The
              federal government segment is a significant growth vector following Devo's FedRAMP Moderate Authorization
              (January 2024) and StateRAMP Authorization, which enable pursuit of contracts with U.S. federal agencies,
              defense contractors, and state/local governments through channels such as DLT Solutions, a TD SYNNEX
              subsidiary.
