      - number: '1.4'
        title: Product Platform and Key Technology
        blocks:
          - type: paragraph
            body: >
              Devo's Security Data Platform is the company's primary commercial offering and is positioned as an
              integrated, cloud-native alternative to legacy SIEM solutions. The platform's three core capabilities are:
              (1) Intelligent SIEM — providing threat detection via MITRE ATT&CK aligned content, automated correlation,
              and real-time alerting; (2) SOAR — providing automated incident response through no-code playbooks, triage
              automation, and case management; and (3) UEBA (Behavior Analytics) — employing an extensive library of AI
              models to detect anomalous user and entity behaviors across multi-petabyte datasets. The platform also
              includes DeepTrace, an AI-powered autonomous threat investigation module.

              The underlying technology differentiation is Devo's proprietary HyperStream engine, which processes
              streaming and historical data simultaneously at sub-second query latency, even at petabyte scale. Unlike
              Splunk's indexing model, which can introduce latency during peak ingestion, Devo ingests and makes data
              immediately queryable without preprocessing delays. This architecture supports unlimited data retention
              and scalability without performance degradation, and was cited as a key advantage in Devo's acquisition of
              public sector customers facing new OMB log-retention mandates.

              In January 2024, Devo achieved FedRAMP Moderate Authorization (ATO), sponsored by the Small Business
              Administration, enabling federal agencies and their contractors to leverage the platform for
              government-grade security operations. Devo's platform is available in the AWS GovCloud Marketplace. In
              June 2024, Devo also achieved StateRAMP Authorization, further expanding its public-sector addressable
              market.

              Key product milestones include: the acquisition of Kognos (AI-powered threat hunting) in early 2022 to
              build the "Autonomous SOC" vision; the launch of Devo Exchange (community application marketplace) in
              2022; the launch of Data Orchestration (cost-optimized data tiering) in July 2024; and the DeepTrace
              autonomous investigation capability. The platform integrates with major cloud environments (AWS, Azure,
              Oracle) and supports multi-country data sovereignty requirements, which has been cited by customers like
              OneMain Financial as a critical differentiator.
            claimRefs:
              - CO026
              - CO027
              - CO028
              - CO029
              - CO030
              - CO031
              - CO032
      - number: '1.5'
        title: Key Milestones and Corporate Events
        blocks:
          - type: paragraph
            body: >
              Devo Technology's history spans fifteen years of continuous evolution from a Spanish log analytics startup
              to a U.S.-headquartered cybersecurity platform company. The company was founded as Logtrust in 2011 by
              Pedro Castillo, Pedro Palao, Juana Nunez Garcia, and Daniel Garcia. Initial commercial traction was
              established in Europe through early Kibo Ventures backing before the company successfully expanded into
              the U.S. enterprise market, attracted Insight Partners' attention, and secured Series B financing in 2017.

              The Logtrust-to-Devo rebrand in June 2018, coinciding with the Series C, marked a strategic pivot to
              positioning the company as an enterprise data operations and security analytics platform rather than a
              pure log management vendor. The 2020 Series D provided fuel for enterprise sales scaling. The landmark
              Series E in October 2021 brought the company to unicorn status ($1.5B valuation) and added marquee
              financial sponsors (TCV, General Atlantic, Eurazeo), enabling aggressive hiring — including the buildout
              of the APAC sales presence, international partnerships, and significant product investment.

              The 2022 Kognos acquisition was a critical product milestone, embedding AI-powered autonomous threat
              hunting into the core platform and giving substance to Devo's "Autonomous SOC" marketing narrative. The
              Series F in June 2022 at $2 billion validated investor confidence. Key adverse milestones include the
              departure of CEO Marc van Zadelhoff in early 2024 (who had led the company through its highest growth
              period), a period of interim leadership under Walter Scott, and the subsequent appointment of Ken Naumann
              in March 2025, representing Devo's third CEO in approximately five years. The three-year absence of new
              institutional funding (June 2022 to May 2026) is a notable gap that may signal either disciplined capital
              management or difficulty accessing new capital at the 2022 valuation.
