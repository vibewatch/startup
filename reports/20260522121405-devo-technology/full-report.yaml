      - number: '7.6'
        title: Partner, Cloud, and Customer Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Devo's infrastructure dependency on AWS creates a concentrated cloud-provider risk. The platform is built
              natively on AWS, leveraging AWS compute, storage (S3), and networking infrastructure. AWS GovCloud is the
              delivery mechanism for federal customers. No publicly confirmed multi-cloud failover architecture exists.
              Should AWS experience a material regional or global disruption, Devo customer SOC operations would be
              directly impacted. This is a vendor lock-in risk inherent to cloud-native SaaS architectures, but
              particularly acute for security operations infrastructure where availability and reliability are critical
              to the platform's value proposition.

              MSSP channel concentration is a material but unquantified risk. Named MSSP partners include Trustwave (via
              Trustwave MXDR Co-Managed SOC), CyberMaxx, DeepSeas, Talion, and Corsica Technologies. Of these, Trustwave
              — a Top 250 MSSP per MSSP Alert — is the largest publicly known partner. If Trustwave or another large
              MSSP partner were to switch SIEM vendors (e.g., to Microsoft Sentinel or Splunk), Devo would lose that
              MSSP's end-client deployments simultaneously. The Q4-2025 SWOT analysis indicates the MSSP channel "did
              not meet its aggressive growth goal" — suggesting the channel is not yet producing the ARR diversification
              originally planned. MSSP- sourced ARR as a percentage of total ARR is not publicly disclosed.

              Top-customer ARR concentration is undisclosed. Devo reports $70.6M ARR across a claimed 1,000+ enterprise
              deployments. If a small number of large accounts (Telefonica at multinational telecom scale, AT&T, major
              MSSP partners) represent 25–40% of ARR, a single churn event could cause a material revenue step-down. At
              $70.6M ARR, a $7–14M enterprise SIEM contract (plausible for a Telefonica-scale deployment at 100+ GB/day
              ingest) represents 10–20% of total company revenue. No top-10-customer concentration metric has been
              published. Exact diligence path: request top-5 and top-10 customer ARR concentration; ask whether any
              customer exceeds 10% of ARR; separately analyze MSSP-sourced ARR as a distinct concentration category.

              The U.S. federal channel is routed through a single distributor, DLT/TD SYNNEX Public Sector. This creates
              channel concentration in the federal segment: if DLT/TD SYNNEX changes its priorities, loses key
              contracting vehicles, or experiences its own operational disruptions, Devo's access to federal agency
              procurement would be impaired. This is a standard feature of government IT distribution but represents a
              non-diversified channel dependency.

              Investor exit timing creates a subtle dependency risk. With six institutional investors (Insight Partners,
              Georgian, TCV, General Atlantic, Bessemer, Kibo, Eurazeo) from a 2022 fund vintage, exit discussions over
              the 2026–2028 horizon are likely. A forced sale at below-plan valuation could distract leadership, create
              employee retention risk, or result in a strategic acquirer whose roadmap priorities differ from Devo's
              standalone vision.
