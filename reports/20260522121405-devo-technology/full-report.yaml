  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Definitions, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Devo Technology competes primarily in the Security Information and Event Management (SIEM) market, a
              category defined by solutions that collect, normalize, correlate, and analyze security event data across
              enterprise IT environments for threat detection, compliance reporting, and security operations center
              (SOC) workflows. The SIEM market spans on-premises software, cloud-hosted SaaS, and hybrid deployments,
              and is increasingly converging with adjacent categories—security orchestration, automation, and response
              (SOAR); user and entity behavior analytics (UEBA); and managed detection and response (MDR)—into unified
              security operations platforms.

              Devo's platform, powered by its proprietary HyperStream technology, is fully cloud-native SaaS,
              positioning it within the "next-generation SIEM" sub-segment that prioritizes petabyte-scale ingestion,
              sub-second query performance, and AI-driven behavioral analytics over legacy on-premises appliances. The
              primary included spend in Devo's TAM encompasses: enterprise SIEM licenses and SaaS subscriptions, SOAR
              automation modules, UEBA capabilities, and security data lake infrastructure. Excluded spend includes
              endpoint detection and response (EDR/XDR) sold without SIEM integration, pure observability platforms
              (Datadog, Dynatrace) without security analytics modules, and standalone compliance reporting tools that do
              not ingest real-time event streams.

              Status-quo substitutes for Devo include: (1) Splunk Enterprise Security and Splunk Cloud, the historic
              market leader with deep installed-base entrenchment, particularly in large enterprises; (2) Microsoft
              Sentinel, which is natively integrated with Azure and available within Microsoft's security bundle at
              preferential pricing for Azure-committed customers; (3) IBM QRadar SIEM, which retains an installed base
              in regulated industries; (4) Palo Alto Networks Cortex XSIAM, which challenges from the XDR side; and (5)
              internal-build approaches using Elastic SIEM or open-source tools, favored by highly sophisticated
              security engineering teams. The switching cost from any of these alternatives to Devo is
              material—large-scale SIEM migrations typically require 8–12 months and $1+ million in integration labor,
              data pipeline reconfiguration, and analyst retraining, creating both a barrier to entry and a retention
              advantage once Devo is deployed.
            claimRefs:
              - CM001
