      - number: '8.4'
        title: Bull, Base, and Bear Scenarios with Sensitivity Analysis
        blocks:
          - type: paragraph
            body: >
              Three scenarios govern Devo's valuation trajectory through a 2026–2028 exit window.

              The bull case assumes continued ARR growth of 50% per year (from $70.6M to approximately $160M by 2028),
              successful re-entry into the 2026 Gartner SIEM Magic Quadrant, new institutional funding round validating
              a revised lower valuation (estimated $800M–$1.2B), and eventual strategic acquisition at 8–12x ARR —
              implying a 2028 exit value of $1.28B–$1.92B. Probability signal for this case is low given current
              headcount decline, Gartner MQ exclusion, and CEO transition risk; requires resolution of all major
              execution gaps within 12 months.

              The base case assumes ARR growth moderates to 20–30% (reaching $90–110M ARR by 2027), a new institutional
              round occurs at 6–8x forward ARR (implying $540M–$880M valuation), and a strategic acquisition happens at
              6–10x ARR in 2027–2028 yielding $540M–$1.0B. This is the most likely scenario given: (a) cloud-native
              architecture is genuinely differentiating; (b) NRR >120% confirms customer stickiness; (c) FedRAMP ATO
              opens federal channel; but (d) execution gaps require resolution.

              The bear case assumes ARR growth stalls below 20% or declines, no new institutional round is raised, the
              company enters restructuring or distressed sale, and the exit value at 2–4x ARR of $70.6M implies
              $141M–$282M. In this scenario, all or most value accrues to preference holders (approximately $500M total
              invested capital), leaving common equity holders with zero recovery. Probability signal is moderate: 3+
              years without a new round, leadership instability, and headcount decline collectively warrant meaningful
              bear-case weight.

              Sensitivity analysis on the base case shows that the primary valuation driver is the exit ARR multiple
              (which is itself driven by growth rate, FCF margin trajectory, and strategic buyer interest). A 2x change
              in exit multiple (from 6x to 12x) produces a 2x change in implied enterprise value ($564M vs. $1.13B at
              2027 $94M ARR estimate). The second most important driver is the ARR at exit — a 40% variance in ARR (from
              $70M to $100M) produces a 40% variance in enterprise value at a fixed multiple. Gartner MQ
              inclusion/exclusion is estimated to affect net-new ARR growth rate by 10–20 percentage points, creating an
              indirect leverage of approximately 1.5–2.5x on exit value over a 3-year window.
            claimRefs:
