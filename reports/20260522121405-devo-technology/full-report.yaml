      - number: '3.2'
        title: Pricing, Packaging, and Commercial Model Comparison
        blocks:
          - type: paragraph
            body: >
              SIEM vendors in 2026 use one of three primary pricing architectures: ingest-based (per GB/day of data
              ingested), resource-based (per endpoint, server, or employee), or seat/event-rate-based (events per second
              or flows per minute). The choice of pricing architecture affects total cost at scale and creates material
              competitive positioning differences.

              Splunk Enterprise Security uses ingest-based pricing at approximately $150–$2,000 per GB/day depending on
              volume and tier, with additional charges for add-ons (SOAR via Phantom, ITSI, premium connectors). Large
              enterprise contracts at 100 GB/day can exceed $500,000 per year before add-ons. Splunk also offers a
              workload-based pricing alternative that charges for compute consumption. Average enterprise discounts of
              20–34% are common in negotiated contracts. Cisco's acquisition has not materially simplified Splunk's
              pricing model as of 2026.

              Microsoft Sentinel uses consumption-based pricing at $2.46–$5.20 per GB ingested depending on commitment
              tier. The 100 GB/day commitment tier costs $2.96/GB, making it significantly cheaper than Splunk at
              comparable volumes. Sentinel also benefits from free ingestion of Microsoft-native data sources (Azure
              Active Directory, M365 Defender, Defender for Cloud) for M365 E5 subscribers, creating a de facto bundling
              discount that effectively lowers apparent SIEM cost to near-zero for a large fraction of data in
              Microsoft-committed enterprises.

              Google Chronicle (Google Security Operations) uses a per-employee pricing model with unlimited data
              ingestion included, making it uniquely predictable at large organizations with complex multi-source
              environments. Independent studies cited a 400%+ three-year ROI and sub-seven-month payback for Chronicle
              versus comparable ingest-based SIEMs. Google does not publish standard list pricing.

              IBM QRadar SIEM cloud subscriptions are event-rate-based (EPS — events per second and FPM — flows per
              minute), with enterprise deployments typically ranging $15,000–$250,000 per year. QRadar's pricing is
              opaque and quote-driven, with significant variation based on deployment scale, modules, and support tier.

              Securonix uses a seat/user model starting at approximately $4,500/month for 10 users ($54,000/year),
              scaling to $40,000/month for 100+ user enterprise environments. Total first-year investment for 10 users
              including onboarding is estimated at $64,000–$154,000.

              Sumo Logic Cloud SIEM uses ingestion-based pricing at $270–$718/month per tier, with unlimited user
              access. The Enterprise Security tier (full SIEM) costs approximately $718/month per data ingestion tier,
              with median annual contract values of approximately $85,135 based on procurement data.

              Devo's pricing model is all-inclusive SaaS: a single predictable fee covering SIEM, SOAR, UEBA, unlimited
              users, unlimited search, and 400+ days of hot data retention. This contrasts with Splunk's modular add-on
              costs for SOAR, long-term retention, and security-content packs. Devo does not publish list prices;
              pricing is quote-based but positioned as predictable and volume-insensitive relative to Splunk.

              Elastic Security offers tiered pricing at $95–$175 per resource per month for cloud deployments. At large
              enterprise scale, total Elastic cost (licensing plus engineering labor) can reach $700,000+ per year. Palo
              Alto Networks Cortex XSIAM uses a per-endpoint base ($9–$36/endpoint/month) plus per-GB telemetry
              ingestion charges, with 35–60% bundle discounts for existing Palo Alto platform customers.
