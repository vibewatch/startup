  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape — Direct Peers, Incumbents, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Devo Technology operates in a crowded SIEM and security analytics market where buyers can choose among
              established platform vendors, cloud hyperscalers, independent next-generation SIEM specialists, and
              open-source self-build paths. The competitive landscape divides into five distinct classes.

              Direct next-generation SIEM peers include Securonix (cloud-native UEBA-first SIEM/SOAR), the merged
              Exabeam+LogRhythm entity (largest independent SIEM provider by installed base as of July 2024), and Sumo
              Logic (cloud-native log analytics plus SIEM). These vendors share Devo's SaaS delivery model and compete
              primarily on AI analytics capability, pricing predictability, and MSSP channel depth.

              Incumbent platform leaders include Splunk Enterprise Security — now owned by Cisco following the March
              2024 $28 billion acquisition — and IBM QRadar SIEM. Splunk retains the deepest enterprise installed base
              and broadest integration library (700+ data sources), but carries the highest total cost of ownership and
              a complex ingest-based pricing model. Cisco's acquisition added network telemetry breadth and channel
              scale but introduced integration execution risk for existing Splunk customers. IBM QRadar maintains a
              regulated-industry installed base but is increasingly viewed as legacy on-premises architecture with
              declining competitive momentum in cloud-first buyer cycles.

              Hyperscaler-native SIEM options represent the most structurally threatening competitive class. Microsoft
              Sentinel — part of the Microsoft Defender and Azure ecosystem — is available within Microsoft's E5
              security bundle and at $2.46–$5.20 per GB on a consumption basis, giving Azure-committed enterprise buyers
              a cost advantage that Devo cannot directly offset. Google Chronicle (Google Security Operations) offers
              per-employee unlimited-data pricing backed by Google's infrastructure and Mandiant threat intelligence,
              representing an alternative pricing architecture particularly attractive for organizations with high data
              volumes. Both hyperscaler options benefit from strong bundling leverage in accounts where Microsoft
              365/Azure or Google Cloud are already deeply embedded.

              Platform adjacencies include Palo Alto Networks Cortex XSIAM (an XDR-first SIEM-replacement strategy built
              on AI-powered SOC unification), CrowdStrike Falcon LogScale (a streaming log analytics engine positioning
              as an observability-plus-security layer), and SentinelOne Singularity (EDR-first expansion into
              SIEM-adjacent log correlation). These vendors approach the security analytics market from the endpoint
              side and are most threatening when enterprise buyers consolidate onto a single platform vendor.

              Internal-build substitutes — using Elastic Security, Wazuh (open-source), or self-managed security data
              lakes on Snowflake or Databricks — remain viable for organizations with dedicated security engineering
              teams. Elastic Security offers commercial subscriptions at $95–$175 per resource per month; Wazuh is fully
              open-source with community support. Internal builds impose high integration and maintenance labor costs
              that increase switching costs out of this path over time.

              The status quo — maintaining an existing Splunk or IBM QRadar on-premises deployment rather than migrating
              — remains the most common outcome in large enterprise evaluation cycles. SIEM migrations are structurally
              complex, typically requiring 8–12 months, $1M+ in integration labor and retraining, and continuous
              parallel operation before cutover. This friction both protects Devo's installed base and slows its ability
              to displace incumbents in greenfield competitive bids.
