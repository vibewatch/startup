      - number: '1.2'
        title: Founders, Leadership, and Board Governance
        blocks:
          - type: paragraph
            body: >
              Devo Technology was co-founded in 2011 by four Spanish technologists: Pedro Castillo (founder and CTO),
              Pedro Palao, Juana Nunez Garcia, and Daniel Garcia. The founding team built the original Logtrust platform
              in Spain before establishing a U.S. presence and scaling the business into the enterprise market. Pedro
              Castillo served in the CTO role and was explicitly cited by later CEOs as the technical visionary behind
              the platform's architecture.

              The company has experienced significant CEO turnover in recent years. Walter Scott, who led the company as
              interim CEO through 2024 following Marc van Zadelhoff's departure, transitioned to the role of Executive
              Chairman of the Board in March 2025 when Ken Naumann was appointed as permanent CEO. Marc van Zadelhoff,
              who had served as CEO since 2020 and oversaw the company's scale from approximately 400 employees to 500+,
              left Devo in early 2024 and subsequently became CEO of Mimecast. This represents the third CEO change in
              roughly four years, creating key-person risk and strategic continuity concerns.

              Ken Naumann, the current CEO (appointed March 5, 2025), is a veteran of the cybersecurity industry with
              prior CEO roles at NetWitness and other technology companies, bringing deep CIO/CISO-centric domain
              expertise. The current executive team also includes Kayla Williams (CISO), Wences Sevillano (CFO), Daryl
              Volgarino (President), and Brian Froehling (Chief Revenue Officer). The board includes representation from
              major investors including TCV (Gopi Vaddi), General Atlantic (Gary Reiner / Asher Hecht), Eurazeo
              (Guillaume d'Audiffret), Insight Partners, and Georgian.

              The company's leadership has emphasized AI-driven automation, autonomous SOC capabilities, and platform
              consolidation as strategic pillars under the current CEO. Governance risks include the recently completed
              CEO succession, lack of founder leadership in day-to-day operations, and board composition dominated by
              financial investors without deep product advisory representation.
