      - number: '6.6'
        title: Expansion, Concentration, and Procurement Risks
        blocks:
          - type: paragraph
            body: >
              Devo's ingest-based pricing model (per GB of data ingested) creates a natural land-and-expand mechanic: as
              customers deploy more data sources, add cloud environments, or grow their security footprint, data volumes
              increase and Devo's revenue per customer grows without a contract renegotiation. This is a structural NRR
              driver if customers remain on the platform. The 400-day always-hot data retention also creates switching
              costs: migrating away requires rebuilding 400 days of searchable history in a competing platform,
              increasing retention durability.

              Concentration risk is not publicly disclosed. Devo does not report top-customer revenue concentration
              metrics (e.g., the percentage of ARR from the top 10 customers). Given that Devo primarily targets large
              enterprises and large MSSPs, it is plausible that a small number of large accounts (AT&T, Telefonica, or
              major MSSP partners) contribute disproportionate ARR. At Devo's reported $70.6M ARR, a single Telefonica
              or AT&T-scale enterprise SIEM contract (potentially seven figures annually) could represent 5–15% of total
              ARR, representing meaningful customer concentration, though this is inferred rather than disclosed.

              Procurement friction is greatest in three scenarios: (1) U.S. federal procurement — mitigated by FedRAMP
              Moderate ATO (January 2024) and AWS GovCloud availability through DLT/TD SYNNEX, but IL4/IL5 and DoD ATO
              remain unconfirmed for classified workloads; (2) mid-market procurement — the SWOT analysis identifies
              pricing perception as a significant barrier, with Devo perceived as expensive in the $500M-and-below
              revenue tier; and (3) European GDPR-constrained procurement — Devo supports multi-region deployment for
              data residency but ISO 27001 certification and DPA terms are not publicly confirmed.

              Devo is available on the AWS Marketplace, providing procurement convenience for AWS-committed enterprise
              buyers and reducing friction by allowing buyers to apply existing AWS credits. The AWS Marketplace listing
              carries independent reviews confirming active deployments.

              Adverse customer feedback documented on PeerSpot and the swotanalysis.com SWOT points to several friction
              sources that may elevate churn risk: browser UI that freezes on large searches, log parsing complexity for
              non-standard sources, a Security Operations module that practitioners describe as incomplete, unexpected
              pricing exposure from unparsed log metadata charges, and an onboarding process that requires significant
              analyst ramp-up time. These frictions are most acute for smaller or less technical security teams,
              consistent with the mid-market penetration challenge identified in the SWOT.
            claimRefs:
