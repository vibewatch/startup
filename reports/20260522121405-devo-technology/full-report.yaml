  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Architecture, and Revenue Streams
        blocks:
          - type: paragraph
            body: >
              Devo Technology generates revenue primarily through annual recurring subscription contracts for its
              cloud-native Security Data Platform. The core pricing mechanism is data-ingestion-based: customers are
              billed based on the volume of log and security telemetry data ingested per day, measured in gigabytes or
              terabytes per day. This contrasts with per-seat (per-user) and per-event (EPS/FPM) pricing models used by
              competitors such as IBM QRadar and Splunk, respectively. Devo has publicly positioned its all-inclusive
              pricing model as a key differentiator — stating that all platform capabilities (SIEM, SOAR, UEBA, 400-day
              hot data retention) are included in the base subscription price, with no additional charges for add-ons or
              premium modules.

              Devo does not publish a public pricing page or list pricing. Third-party procurement benchmarks from Vendr
              indicate the median enterprise buyer pays approximately $131,250 per year for Devo, with a range from
              approximately $28,133 (smaller deployments) to $200,662 (larger or more feature-rich contracts). More
              detailed benchmarks from clearnetwork.com and cyberse.com suggest Devo's ingest-based pricing approximates
              $90,000 per year for 100 GB/day ingest and $5.4 million per year at 10 TB/day, implying a list price of
              approximately $900/year per GB/day at smaller tiers and $540/year per GB/day at large enterprise scale.
              These figures are third-party estimates and not official Devo pricing disclosures.

              Devo's second revenue stream is professional services, which includes initial deployment, custom
              integration development, SIEM migration support, and advisory consulting. Devo actively advertises a
              "100-day migration from Splunk at no cost" offer, suggesting professional services are sometimes used as a
              sales motion rather than a significant standalone revenue driver. Industry norms for pure-play SaaS
              security analytics vendors (Elastic, CrowdStrike, Securonix) indicate professional services typically
              contribute 10–15% or less of total revenue, with the remaining 85–90% from recurring subscription ARR. No
              public disclosure of the professional services mix for Devo exists.

              The official Series F press release from June 2022 confirmed Devo was experiencing nearly 100% annual
              revenue growth at the time of the round, and similarly the Series E press release (October 2021) cited
              nearly 100% year-over-year revenue growth and over 100% customer growth for that fiscal year. These
              milestones anchor the growth trajectory that led to the GetLatka-reported $37.1 million ARR (December
              2023) and $70.6 million ARR (October 2024).

              Revenue recognition for Devo is expected to follow standard SaaS subscription accounting: annual contracts
              are typically recognized ratably over the contract period, with contract values reported as ARR (annual
              run rate) rather than GAAP revenue. No audited GAAP revenue figures are publicly available for Devo
              Technology, Inc. (a US private company), though the UK subsidiary Devo Technology UK Limited (Companies
              House number 11507870) is required to file annual accounts; the accounts for the year ending December 31,
              2024 were made up and are on record at Companies House as of May 2026.

              Revenue quality is supported by the reported >120% net revenue retention (NRR), indicating that expansion
              revenue from existing customers more than offsets any churn. This is a high NRR for a company at this
              scale and stage, suggesting strong customer stickiness and meaningful upsell within enterprise accounts.
              However, this metric is self-reported or third-party estimated and has not been independently audited.
