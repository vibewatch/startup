  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >
        Devo has not publicly disclosed audited revenue, ARR, or financial statements. The $70.6M ARR
        figure is a third-party estimate from LATKA and has not been independently confirmed.
      whyItMatters: >
        Without verified revenue figures, the 28x+ revenue multiple and overall financial health of the
        company cannot be accurately assessed, affecting investment judgment.
      diligencePath: >
        Request audited financials or management accounts from Devo directly; seek confirmation from
        investor relations contacts or board-level sources.
      relatedQuestionRefs: [QO009, QO024]
      relatedTableRefs: [TO001]

    - type: missing-source
      severity: material
      topic: headcount
      missingEvidence: >
        Current employee headcount as of May 2026 is not publicly disclosed. The most recent confirmed
        figure is 500+ employees from the June 2022 Series F press release.
      whyItMatters: >
        Headcount trends (growth or contraction) would signal organizational health, burn rate, and
        capacity to compete for enterprise sales.
      diligencePath: >
        Check LinkedIn for employee count; review Glassdoor or Layoffs.fyi for any reduction events;
        request company verification.
      relatedQuestionRefs: [QO012]
      relatedTableRefs: [TO001, TO002]

    - type: missing-source
      severity: material
      topic: funding
      missingEvidence: >
        No new institutional funding has been announced since June 2022. Whether Devo is profitable,
        generating sufficient cash flow, or exploring an exit is unknown.
      whyItMatters: >
        A three-year gap in disclosed funding raises material questions about capital adequacy and
        whether the $2B valuation can be maintained or reset.
      diligencePath: >
        Engage Devo investor relations; review filings in Delaware or other jurisdictions; monitor
        industry deal databases (PitchBook, Crunchbase) for any secondary transactions or undisclosed rounds.
      relatedQuestionRefs: [QO023, QO024, QO025]
      relatedTableRefs: [TO003]

    - type: missing-source
      severity: minor
      topic: founders
      missingEvidence: >
        The current roles of co-founders Pedro Palao, Juana Nunez Garcia, and Daniel Garcia at Devo
        are not publicly confirmed as of May 2026.
      whyItMatters: >
        Founder retention and involvement (even in advisory roles) is a signal of company cultural
        continuity and product direction.
