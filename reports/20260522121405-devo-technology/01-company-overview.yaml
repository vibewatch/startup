company:
  name: Devo Technology
chapter:
  number: 1
  title: Company Overview
  summary: >
    Devo Technology is a cloud-native security data analytics company founded in 2011 (originally as Logtrust)
    in Cambridge, Massachusetts, offering an integrated SIEM, SOAR, and UEBA platform powered by its proprietary
    HyperStream real-time analytics engine. As of May 2026, Devo has raised over $500 million across six
    institutional rounds at a peak valuation of $2 billion (Series F, June 2022), is reporting $70.6 million
    ARR as of late 2024, and has recently completed a significant CEO transition — appointing cybersecurity
    veteran Ken Naumann in March 2025 — while holding FedRAMP Moderate Authorization obtained in January 2024.

sections:
  - id: company-identity-overview
    title: Company Identity, Headquarters, and Business Overview
    body: >
      Devo Technology is a private, cloud-native security data analytics company headquartered in Boston,
      Massachusetts (formerly Cambridge, MA), with operations spanning North America, Europe, and the
      Asia-Pacific region. The company was originally incorporated in 2011 under the name Logtrust in
      Cambridge, MA, before rebranding to Devo in June 2018 to reflect a broader mission in enterprise
      real-time operational and security analytics. Its legal operating entity is Devo Technology, Inc.

      The company's core product is the Devo Security Data Platform, a fully cloud-native SaaS solution
      combining security information and event management (SIEM), security orchestration automation and
      response (SOAR), and user and entity behavior analytics (UEBA) into a single integrated offering.
      Devo's platform is powered by its proprietary HyperStream technology, which enables sub-second query
      speeds across petabyte-scale datasets, unlimited data ingestion without performance compromise, and
      real-time streaming analytics for security operations centers (SOCs).

      Devo's mission is to "reinvent how data and security analytics are used to empower faster, more
      confident action at any scale." The platform primarily targets Fortune 1000 and large enterprise
      organizations with complex, high-volume security data environments, including customers in financial
      services, retail, energy, government, and healthcare sectors. Devo competes directly with Splunk,
      Microsoft Sentinel, IBM QRadar, Exabeam, and Sumo Logic in the broader SIEM and security analytics
      market.

      The company's business model is SaaS-based with predictable, data-ingestion-based pricing rather than
      per-feature or per-seat licensing — a key differentiator designed to reduce total cost of ownership
      compared to legacy SIEM vendors. Devo generates revenue primarily through annual recurring subscriptions,
      with additional revenue from professional services. As of late 2024, Devo reported $70.6 million in ARR
      (up from $37.1 million in 2023), reflecting 90%+ year-over-year ARR growth. The company's $2 billion
      valuation (set at the Series F in June 2022) implies a significant revenue multiple, and no new
      institutional funding has been publicly announced since that round.
