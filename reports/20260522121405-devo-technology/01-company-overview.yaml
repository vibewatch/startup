  - id: milestones-key-events
    title: Key Milestones and Corporate Events
    body: >
      Devo Technology's history spans fifteen years of continuous evolution from a Spanish log analytics
      startup to a U.S.-headquartered cybersecurity platform company. The company was founded as Logtrust
      in 2011 by Pedro Castillo, Pedro Palao, Juana Nunez Garcia, and Daniel Garcia. Initial commercial
      traction was established in Europe through early Kibo Ventures backing before the company successfully
      expanded into the U.S. enterprise market, attracted Insight Partners' attention, and secured Series B
      financing in 2017.

      The Logtrust-to-Devo rebrand in June 2018, coinciding with the Series C, marked a strategic pivot
      to positioning the company as an enterprise data operations and security analytics platform rather
      than a pure log management vendor. The 2020 Series D provided fuel for enterprise sales scaling.
      The landmark Series E in October 2021 brought the company to unicorn status ($1.5B valuation) and
      added marquee financial sponsors (TCV, General Atlantic, Eurazeo), enabling aggressive hiring —
      including the buildout of the APAC sales presence, international partnerships, and significant
      product investment.

      The 2022 Kognos acquisition was a critical product milestone, embedding AI-powered autonomous threat
      hunting into the core platform and giving substance to Devo's "Autonomous SOC" marketing narrative.
      The Series F in June 2022 at $2 billion validated investor confidence. Key adverse milestones include
      the departure of CEO Marc van Zadelhoff in early 2024 (who had led the company through its highest
      growth period), a period of interim leadership under Walter Scott, and the subsequent appointment of
      Ken Naumann in March 2025, representing Devo's third CEO in approximately five years. The three-year
      absence of new institutional funding (June 2022 to May 2026) is a notable gap that may signal either
      disciplined capital management or difficulty accessing new capital at the 2022 valuation.
