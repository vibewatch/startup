    topic: ceo-naumann-track-record
    missingEvidence: >
      Ken Naumann's performance metrics at NetWitness are not publicly disclosed. No post-March 2025 Devo ARR update or
      customer win announcement under Naumann's leadership has been published as of May 2026. Board-level strategic
      rationale references generic leadership attributes without verifiable performance benchmarks at comparable company
      scale.
    whyItMatters: >
      Investors cannot assess whether Naumann has the scale-stage go-to-market and capital markets experience needed for
      a $100M+ ARR trajectory. NetWitness represented a mid-market cybersecurity outcome; Devo's aspirations require a
      different profile.
    diligencePath: >
      Request board reference checks on Naumann; obtain Q1-Q2 2026 pipeline conversion rate and MSSP channel progress;
      review board materials from Q1 2025 strategic review; compare NetWitness ARR and growth trajectory at time of
      exit.
