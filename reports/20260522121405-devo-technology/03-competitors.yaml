        Sentinel, and Google (Chronicle/Security Operations) as Leaders. Devo's specific placement in the
        2025 MQ is not publicly confirmed from available sources — the full MQ report is paywalled. The
        absence of a public Devo Leader announcement may indicate placement outside the Leader quadrant.
      confidence: medium
      targets:
        - contentRequirements/1
        - plannedFigures/competitive-positioning-map
      status: answered
      answeredByClaimRefs:
        - CP039
    - id: QP021
      type: mechanism
      question: How does Sumo Logic compete with Devo and what is its market position in 2026?
      answer: >
        Sumo Logic competes as a cloud-native log analytics + SIEM platform, with unlimited user access at
        ingestion-based pricing ($270–$718/month per tier; ~$85K median annual contract). Strengths are
        DevOps/cloud-native environments and observability+security unification. Limitations: narrower threat
        detection library than Splunk or Sentinel; weaker SOAR automation than Devo's included capability.
      confidence: medium
      targets:
        - contentRequirements/1
        - plannedTables/competitor-profile-table
      status: answered
      answeredByClaimRefs:
        - CP006
        - CP017
    - id: QP022
      type: quantification
      question: What is Devo's reported ARR and what does it imply for market share?
      answer: >
        Devo reported $70.6M ARR as of late 2024 (up from $37.1M in 2023, ~90% YoY growth). Against a
        $8.4–12.1B SIEM market estimate for 2026, Devo's ARR represents approximately 0.6–0.8% market
        share, suggesting early-stage penetration despite 14 years of operations.
      confidence: medium
      targets:
        - contentRequirements/1
        - plannedFigures/moat-readiness-kpis
      status: answered
      answeredByClaimRefs:
        - CP040
    - id: QP023
      type: mechanism
      question: What are Devo's structural differentiation advantages versus the IBM QRadar installed base?
      answer: >
        Devo's advantages vs IBM QRadar: full cloud-native SaaS vs QRadar's on-prem architecture; faster
        deployment cycles; all-inclusive pricing vs QRadar's complex EPS/FPM model; modern UI and query
        experience; better cloud-source coverage. IBM QRadar retains advantages in regulated industry
        relationships and deep compliance tooling for organizations with existing deployments.
      confidence: medium
      targets:
        - contentRequirements/2
        - plannedTables/feature-capability-matrix
      status: answered
      answeredByClaimRefs:
        - CP005
        - CP016
    - id: QP024
      type: enumeration
      question: What open-source and self-build SIEM alternatives exist in 2026?
      answer: >
        Key self-build paths: (1) Elastic Security + Kibana (open-source core, commercial tiers at
        $95–$175/resource/month); (2) Wazuh (fully open-source, Elastic-based, community support);
        (3) Security Onion (network-focused, open-source); (4) Graylog (log management + SIEM add-ons).
        Cloud-based self-build: security data lake on Snowflake/Databricks + custom detection logic.
        All require significant engineering overhead relative to commercial platforms.
      confidence: high
      targets:
        - contentRequirements/0
        - plannedTables/feature-capability-matrix
      status: answered
      answeredByClaimRefs:
        - CP008
        - CP018
    - id: QP025
      type: mechanism
      question: What is the competitive threat from CrowdStrike's expansion into SIEM-adjacent log analytics?
      answer: >
        CrowdStrike Falcon LogScale (formerly Humio) is a streaming log analytics platform for observability
        and security use cases. As of 2026, CrowdStrike positions it as a SIEM alternative within the
        CrowdStrike Falcon platform for EDR-first enterprises. The threat to Devo is primarily in accounts
        where CrowdStrike has dominant EDR position, as those organizations may expand to LogScale rather
        than procuring a separate SIEM.
      confidence: medium
      targets:
        - contentRequirements/0
        - plannedTables/competitor-profile-table
      status: answered
      answeredByClaimRefs:
        - CP009
    - id: QP026
      type: mechanism
      question: How does Devo's all-inclusive pricing compare to Splunk's modular pricing in total cost of ownership?
      answer: >
        Devo's all-inclusive model (SIEM + SOAR + UEBA + 400+ day retention + unlimited users/search) avoids
        Splunk's add-on costs for SOAR (Phantom), long-term retention, premium content packs, and search/CPU
        tier caps. For a large enterprise at 100 GB/day, Splunk's modular cost can exceed $800K/year including
        add-ons. Devo's comparable all-inclusive contract is positioned as materially lower, though exact
        Devo pricing is not publicly disclosed for independent verification.
      confidence: medium
      targets:
        - contentRequirements/2
        - plannedTables/pricing-packaging-comparison
      status: answered
      answeredByClaimRefs:
        - CP010
        - CP013
        - CP028
    - id: QP027
      type: adverse
      question: What evidence suggests Devo's competitive position is weaker than claimed, and what are the key moat risks?
      answer: >
        Adverse evidence includes: (1) 0.6–0.8% market share after 14 years suggests limited competitive
        displacement capability; (2) Microsoft Sentinel's near-zero effective pricing for Microsoft-committed
        accounts creates a structural floor Devo cannot undercut; (3) Cisco's Splunk acquisition strengthens
        the primary incumbent's channel by ~70,000 partners; (4) Devo's 2025 Gartner MQ placement is not
        publicly confirmed as Leader, potentially limiting enterprise shortlisting; (5) Exabeam+LogRhythm
        merger creates the largest independent SIEM competitor in Devo's mid-market segment; (6) Dell'Oro
        2026 prediction implies SIEM selection will favor platform integration (Microsoft/Google) over
        analytics performance for most enterprise accounts.
      confidence: high
      targets:
        - contentRequirements/4
        - plannedTables/moat-durability-competitive-risk-register
      status: answered
      answeredByClaimRefs:
        - CP037
        - CP038
        - CP039
        - CP040
    - id: QP028
      type: mechanism
      question: How does multi-homing (running two SIEMs simultaneously) affect Devo's competitive dynamics?
      answer: >
        Multi-homing — running Sentinel for Microsoft-native data alongside a secondary SIEM for other
        sources — allows Devo to co-exist within Azure-committed enterprise accounts rather than requiring
        full Sentinel displacement. This is a viable land-and-expand path for Devo in hybrid environments
        where non-Microsoft log sources are substantial. However, it limits Devo to "second SIEM" status
        in those accounts, constraining deal size and strategic position.
      confidence: medium
      targets:
        - contentRequirements/3
        - plannedTables/moat-durability-competitive-risk-register
      status: answered
      answeredByClaimRefs:
        - CP034
    - id: QP029
      type: mechanism
      question: How does Devo's FedRAMP Moderate authorization position it in the federal SIEM market versus competitors?
      answer: >
        FedRAMP Moderate qualifies Devo for federal civilian agency and some DIB programs with moderate-impact
        classification. However, FedRAMP High (held by Splunk and Microsoft Sentinel/Azure Government) is
        required for DoD, national security systems, and high-impact federal programs — a segment where
        Devo is currently ineligible. The FedRAMP Moderate ceiling limits Devo's addressable federal market.
      confidence: high
      targets:
        - contentRequirements/3
        - plannedTables/feature-capability-matrix
      status: answered
      answeredByClaimRefs:
        - CP026
        - CP027
        - CP037
    - id: QP030
      type: mechanism
      question: What channel or distribution dynamics differentiate Devo from Splunk/Cisco and Microsoft post-2024?
      answer: >
        Cisco's 360 partner program merges Splunk's specialist reseller network with Cisco's ~70,000 global
        channel partners, giving Splunk access to distribution that far exceeds Devo's MSSP-focused channel.
        Microsoft distributes Sentinel through Cloud Solution Provider and Enterprise Agreements managed by
        direct sales. Devo's channel relies on MSSP partnerships and direct enterprise sales; MSSP ARR
        contribution is undisclosed.
      confidence: medium
      targets:
        - contentRequirements/3
        - plannedTables/moat-durability-competitive-risk-register
      status: answered
      answeredByClaimRefs:
        - CP031
        - CP032
