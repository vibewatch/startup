  - id: switching-costs-distribution-channel
    title: Switching Costs, Channel Dynamics, and Distribution Power
    body: >
      SIEM switching costs are among the highest in enterprise software, creating both a competitive moat
      for Devo's installed base and a barrier to displacing incumbents in new sales cycles.

      Technical switching costs are driven by four factors: (1) data source integration complexity —
      enterprise environments typically have 200–800 individual log sources requiring per-connector
      configuration and testing on the new platform; (2) detection content migration — SIEM correlation
      rules, behavioral models, and UEBA baselines are vendor-specific and cannot be directly ported,
      requiring rewrite and re-tuning cycles; (3) historical data retention — migrating years of indexed
      log data across SIEM schemas requires ETL transformation and compliance review; and (4) analyst
      workflow retraining — SOC analysts develop vendor-specific query syntax expertise (Splunk SPL,
      Sentinel KQL, Devo LINQ) that represents a significant human capital switching cost. Full large-
      enterprise SIEM migrations typically require 8–12 months of parallel operation and $1M+ in
      integration labor.

      Organizational switching costs compound the technical barriers: SIEM is the SOC's operational backbone,
      and any gap in detection coverage during migration creates liability. Most enterprises require dual-run
      periods where both old and new platforms operate simultaneously, adding license overlap costs of
      $200,000–$500,000 for a typical large-enterprise contract.

      Distribution and channel power favor the largest incumbents. Cisco/Splunk's post-acquisition channel
      program (Cisco 360) merged Splunk's specialist reseller network with Cisco's global partner network of
      approximately 70,000 organizations. Microsoft Sentinel benefits from the Microsoft Cloud Solution
      Provider (CSP) program and direct inclusion in Microsoft Enterprise Agreements managed by Microsoft's
      direct sales force. Google Chronicle distributes primarily through Google Cloud Professional Services
      and an MSSP partner program.

      Devo's channel strategy emphasizes MSSP partnerships — including Trustwave XMDR and other security
      service providers that white-label or resell Devo's platform to enterprise clients. MSSP channel ARR
      contribution to Devo's $70.6M total ARR is not publicly disclosed, creating a diligence gap for
      assessing channel dependency and margin structure. Devo participates in the U.S. federal channel
      where its FedRAMP Moderate authorization is a qualifying requirement for procurement.

      Multi-homing — running two SIEM platforms simultaneously — is rare at large enterprise scale due to
      cost duplication but occurs in hybrid environments where Microsoft Sentinel handles Microsoft-native
      data and a secondary SIEM (Devo, Splunk, or Elastic) manages non-Microsoft sources. This pattern
      creates an opportunity for Devo to co-exist alongside Sentinel in Microsoft-heavy accounts rather
      than needing to fully displace it.
