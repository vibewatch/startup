  - id: leadership-execution-people-risk
    title: Leadership, Execution, and People Risk
    body: >
      Devo has had three CEOs in approximately four years, creating meaningful organizational and
      strategic continuity risk. Marc van Zadelhoff, who led Devo from 2020 through early 2024 and
      oversaw the Series E and Series F fundraises, departed and subsequently became CEO of Mimecast.
      Walter Scott served as interim CEO through early 2025. Ken Naumann was appointed as permanent CEO
      on March 5, 2025, announced as a "veteran of the cybersecurity industry" with prior CEO experience
      at NetWitness. Walter Scott remains as Executive Chairman of the Board. This is the company's
      third CEO transition since 2020, each transition carrying risk of customer uncertainty, sales
      cycle disruption, strategic pivot, and employee attrition from the leadership team.

      Ken Naumann's prior role as CEO of NetWitness provides cybersecurity experience but is not a
      proven scale-stage public company track record. NetWitness is a mid-market security analytics
      company; Devo's aspiration to reach $100M+ ARR and pursue an IPO or large-scale M&A exit
      requires a different set of go-to-market, financial management, and capital markets skills.
      The board's stated rationale — "strategic vision, commitment to customer success, and operational
      acumen" — does not yet have observable verification through Devo's post-March 2025 performance,
      as no post-appointment ARR update or product announcement has been publicized.

      Headcount has declined from a peak of approximately 769 employees (December 2022) to approximately
      350 (by department total: Engineering 148, Sales/Support 54, Business Management 44, Marketing/
      Product 34, Operations 19, Finance 19, IT 14, HR 9, Consulting 4, Other 6 — per Unify data as of
      April 2026). At approximately 350 employees serving $70.6M ARR, Devo's revenue-per-employee is
      approximately $200K — within the range of capital-efficient SaaS companies but suggesting a lean
      team that may limit execution capacity for simultaneous product development, federal expansion,
      MSSP channel growth, and APAC scaling.

      The SWOT analysis Q4-2025 identifies several organizational execution failures: MSSP partner-
      sourced revenue "did not meet its aggressive growth goal," and the strategic planning cycle shows
      an OKR failure in channel restructuring. This indicates that Devo's go-to-market execution under
      the prior leadership team did not achieve plan on a key growth initiative. Whether Ken Naumann's
      appointment will reset or accelerate channel execution is a forward diligence question. Exact
      diligence path: request current headcount by function versus Q1 2025 baseline; ask for Q1 2026
      ARR and pipeline conversion rate; request board presentation materials from March and April 2025
      strategic review.

      Co-founder Pedro Castillo as CTO represents a leadership asset — deep technical continuity with
      the HyperStream architecture. However, multi-CEO transitions often create cultural drift and
      product prioritization conflicts when the technical founder and the CEO have different strategic
      visions. The degree of alignment between Castillo and Naumann is not observable from public
      evidence.
