  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: eu-ai-act-compliance-status
      missingEvidence: >
        Devo has not publicly disclosed whether it has completed an EU AI Act gap assessment, engaged
        a Notified Body for conformity assessment, or determined the risk classification of its AI
        features (ThreatLink, DeepTrace, Behavior Analytics) under the Act. The August 2, 2026 deadline
        for full applicability is imminent.
      whyItMatters: >
        Non-compliance with EU AI Act high-risk AI obligations carries fines up to €35M or 7% of global
        annual turnover and could restrict market access for EU customers. Given Devo's EMEA revenue
        exposure and EU-based MSSP partnerships, this is a material regulatory risk.
      diligencePath: >
        Request Devo's EU AI Act compliance roadmap and legal counsel opinion on classification; confirm
        whether any Notified Body conformity assessment has been initiated; ask for EU AI Act clause
        in customer contracts.
      relatedQuestionRefs: [QR006, QR007]
      relatedTableRefs: [TR001]

    - type: private-evidence-only
      severity: material
      topic: burn-rate-and-runway
      missingEvidence: >
        Devo's monthly cash burn rate, remaining cash balance, and projected runway to profitability or
        next fundraise are not disclosed in any public source. The only proxies are headcount decline
        (cost reduction signal) and the unverified 39% EBITDA growth claim.
      whyItMatters: >
        Without confirmed runway, investors cannot assess whether Devo is adequately capitalized to
        execute its autonomous SOC strategy through a viable exit window. A shorter-than-expected runway
        would create forced-sale risk at below-plan valuation.
      diligencePath: >
        Request cash and cash equivalents as of most recent quarter-end; monthly burn rate trend for
        2024 and 2025; projected cash-out date at current burn; ask whether any bridge financing or
        secondary sales are contemplated.
      relatedQuestionRefs: [QR017, QR020, QR025]

    - type: private-evidence-only
      severity: material
      topic: customer-concentration-arpc
      missingEvidence: >
        Top-customer ARR concentration (top-5 and top-10 customer ARR as % of total), MSSP-channel ARR
        as % of total, and individual MSSP partner revenue contribution are not publicly disclosed.
      whyItMatters: >
        Undisclosed concentration is a key downside risk. If Trustwave, AT&T, or Telefonica represent
        15%+ of ARR individually, a single churn event would be material. MSSP channel concentration
        amplifies this because one MSSP partner loss removes multiple end-client accounts simultaneously.
      diligencePath: >
        Request top-10 customer ARR concentration metric; ask whether any customer exceeds 10% of ARR;
        separately obtain MSSP channel ARR and end-client count; assess each major MSSP partner's
        contract length and renewal date.
      relatedQuestionRefs: [QR010, QR030]

    - type: private-evidence-only
      severity: material
      topic: soc2-iso-27001-certifications
      missingEvidence: >
        SOC 2 Type II attestation and ISO 27001 certification are not publicly confirmed for Devo's
        production environment as of May 2026. These are standard enterprise security vendor procurement
        requirements.
      whyItMatters: >
        Absence of publicly confirmed SOC 2 Type II creates procurement friction for enterprise buyers
        with mandatory audit requirements and may be a blocking condition for regulated-industry
        customers in financial services or healthcare.
      diligencePath: >
        Request most recent SOC 2 Type II report (covering at least a 12-month observation period);
        ask for ISO 27001 certificate if held; confirm audit scope covers production SIEM and SOAR
        components.
      relatedQuestionRefs: [QR022]

    - type: unverifiable
      severity: informational
      topic: fedramp-continuous-monitoring-status
      missingEvidence: >
        FedRAMP continuous monitoring compliance for 2025 and 2026 annual assessment cycles cannot be
        confirmed from public data. The FedRAMP Marketplace lists Devo as authorized, but POA&M
        (Plan of Action and Milestones) status and assessment cadence are not public.
      whyItMatters: >
        ATO lapse due to failed continuous monitoring would immediately remove Devo from federal
        procurement. Government revenue is a strategic segment for Devo; loss of ATO would be a
        thesis-break event.
      diligencePath: >
        Request FedRAMP ATO continuation letter; ask for most recent Annual Assessment Report; confirm
