  - id: FM004
    title: SIEM Market Growth Drivers vs. Adoption Constraints
    type: flow
    layout: standard
    summary: >-
      Flow diagram illustrating the primary growth drivers pushing SIEM market expansion and the key
      adoption constraints acting as headwinds, with relative magnitude and timing for the 2025–2026
      window.
    data:
      nodes:
        - id: driver-cloud
          label: Cloud Migration from On-Prem SIEM
          detail: "55% on-prem installed base; cloud-native growing at 13%+ CAGR; sustained replacement demand through 2028"
          tone: positive
        - id: driver-reg
          label: Regulatory Mandates (NIS2, DORA, FedRAMP)
          detail: "NIS2 effective Oct 2024; DORA Jan 2025 (EU financial services); FedRAMP unlocks U.S. federal segment"
          tone: positive
        - id: driver-talent
          label: SOC Workforce Shortage (4.8M unfilled roles)
          detail: "Accelerates demand for AI-augmented SIEM; Devo Autonomous SOC positioning benefits"
          tone: positive
        - id: driver-ai
          label: GenAI-Powered Threat Sophistication
          detail: "Increases telemetry volume and detection complexity; favors petabyte-scale analytics"
          tone: positive
        - id: driver-splunk
          label: Cisco/Splunk Acquisition Customer Churn
          detail: "Displacement window 2024–2026; Splunk customer uncertainty around pricing and roadmap"
          tone: positive
        - id: constraint-msft
          label: Microsoft Sentinel Azure-Native Bundling
          detail: "Preferential pricing for Azure/M365-committed enterprises; persistent price-anchor constraint"
          tone: warning
        - id: constraint-switch
          label: SIEM Switching Costs ($1M+ / 8–12 months)
          detail: "High migration cost and legacy data model lock-in; incumbent retention advantage"
          tone: warning
        - id: constraint-gartner
          label: Gartner MQ Positioning Risk
          detail: "Splunk/MSFT/Google occupy Leader positions; non-Leader placement increases RFP friction"
          tone: warning
        - id: constraint-budget
          label: CISO Budget Consolidation Pressure
          detail: "IANS Research April 2026: budget-expectations disconnect; platform suites preferred for consolidation"
          tone: warning
