  - id: FM004
    title: SIEM 市场增长驱动因素与采用约束
    type: flow
    layout: standard
    summary: 流程图展示推动 SIEM 市场扩张的主要增长驱动，以及构成逆风的关键采用约束，并给出 2025–2026 年窗口内的相对强度和时间点。
    data:
      nodes:
        - id: driver-cloud
          label: 从本地 SIEM 迁移到云
          detail: 本地部署存量占 55%；云原生以 13%+ CAGR 增长；到 2028 年替换需求持续
          tone: positive
        - id: driver-reg
          label: 监管强制要求（NIS2、DORA、FedRAMP）
          detail: NIS2 2024 年 10 月生效；DORA 2025 年 1 月生效（欧盟金融服务）；FedRAMP 打开美国联邦细分市场
