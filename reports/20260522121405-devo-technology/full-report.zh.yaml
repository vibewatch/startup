        - MSSP 运营负责人 / 外包 SOC 的企业买方
        - 渠道扩张；2026 年 MDR 市场 $3.65–$4.16B，CAGR 为 20-22%
      - - 美国联邦政府细分
        - 面向美国机构、国防承包商的 FedRAMP 授权 SIEM
        - 非 FedRAMP 商业 SIEM（不具备联邦部署资格）
        - 联邦 CISO、合同官
        - Devo FedRAMP Moderate 授权解锁该市场（2024 年 1 月）
      - - 现状替代品
        - Splunk Enterprise Security、Microsoft Sentinel（Azure 原生）、IBM QRadar
        - N/A
        - 企业 CISO
        - 直接替代目标；Splunk 被 Cisco 收购后的客户流失构成顺风
    notes: 市场估计为第三方研究近似值。云原生子细分数据来自 MarkWide Research 和 Mordor Intelligence 的范围拆分。 联邦细分仅在获得 FedRAMP 授权后才可触达。
