      - number: '5.5'
        title: 路线图、近期发布与技术风险
        blocks:
          - type: paragraph
            body: >
              Devo 近期最重要的产品发布集中在三个主题：AI 自动化、数据编排和自主 SOC 能力。

              2024 年 7 月，Devo 同时宣布三项产品增强：（1）Devo Data Orchestration，可过滤数据并路由至 Amazon Kinesis 和 Amazon S3
              等目的地，在分析前按价值高低进行数据分层，以优化成本；（2）Devo Data Analytics Cloud，可从任意来源或数据湖编排并接入 PB 级结构化和非结构化数据，支持企业和 MSSP
              开发定制安全应用；（3）通过 ThreatLink 增强 SOC 工作流能力，将每天数千个信号关联成数十个高保真案件，实现告警分诊自动化；以上由 SiliconAngle 报道。

              Kognos 收购（2022 年 10 月）是基础性产品事件，把 DeepTrace 自主威胁狩猎嵌入核心平台。Ken Naumann 于 2025 年 3 月出任
              CEO，带来以网络安全为中心的领导经验（NetWitness 背景），可能加速公司在威胁情报和检测内容深度上的产品投入；不过 Naumann 上任后的战略路线图细节尚未公开披露。

              Devo 的技术风险包括：（1）纯云架构风险——缺少本地部署选项，会让它在受监管或气隙环境中失去资格；（2）性能主张验证缺口——亚秒级查询速度和单节点吞吐数字由公司提出，没有独立基准验证；（3）UI/UX
              复杂度——PeerSpot 从业者持续指出，浏览器界面在大型搜索中可能冻结，且分析师上手时间较长；（4）市场规模劣势——PeerSpot 上 Devo 的 SIEM 关注份额为 1.2%，而 Splunk 为
              7.1%，说明其装机基础动能有限；（5）集成完整性——某些 SaaS 和非标准日志源需要额外工作；（6）公共开发者生态有限——Devo 的 GitHub 有 53 个仓库，但参与度温和（Python SDK 为
              27 stars），相较 Elastic 或 Splunk，外部开发者社区有限。

              Devo 在公开材料中描述的路线图强调自主 SOC 能力、数据编排继续成熟，以及 MSSP 渠道增长。截至 2026 年 5 月，没有公开披露具体即将推出的功能里程碑或发布时间表。
