      - number: '8.4'
        title: 乐观、基准与悲观情景及敏感性分析
        blocks:
          - type: paragraph
            body: >
              三种情景决定 Devo 在 2026–2028 年退出窗口中的估值轨迹。

              乐观情景假设 ARR 继续以每年 50% 增长（从 $70.6M 增至 2028 年约 $160M）， 2026 年成功重返 Gartner SIEM 魔力象限，新一轮机构融资确认下修后的估值 （估计
              $800M–$1.2B），并最终以 8–12x ARR 被战略收购——对应 2028 年退出价值 $1.28B–$1.92B。考虑到当前员工数下降、被排除在 Gartner MQ 之外以及 CEO 交接风险，
              该情景的概率信号偏低；它要求公司在 12 个月内补齐所有重大执行缺口。

              基准情景假设 ARR 增速放缓至 20–30%（到 2027 年达到 $90–110M ARR），公司以 6–8x 远期 ARR 完成新一轮机构融资（对应 $540M–$880M 估值），并在 2027–2028
              年 以 6–10x ARR 被战略收购，退出价值为 $540M–$1.0B。这是最可能出现的情景，原因是： (a) 云原生架构确实形成差异化；(b) NRR >120% 证明客户粘性；(c) FedRAMP
              ATO 打开 联邦渠道；但 (d) 执行缺口仍需补齐。

              悲观情景假设 ARR 增速停在 20% 以下甚至下滑，无法完成新的机构融资，公司进入重组或 困境出售；以 $70.6M ARR 的 2–4x 计算，退出价值为 $141M–$282M。在该情景下，全部或
              大部分价值都流向优先股持有人（累计投入资本约 $500M），普通股持有人没有回收。概率信号为 中等：超过 3 年没有新融资、管理层不稳定、员工数下降，三者合在一起使悲观情景必须占有 有意义的权重。

              基准情景的敏感性分析显示，最主要的估值驱动因素是退出 ARR 倍数（它本身由增速、FCF 利润率 轨迹和战略买家兴趣决定）。退出倍数从 6x 提升到 12x，隐含企业价值也翻倍（按 2027 年 $94M ARR
              估计，为 $564M 对 $1.13B）。第二大驱动因素是退出时 ARR——在固定倍数下，ARR 从 $70M 到 $100M 的 40% 差异，会带来 40% 的企业价值差异。Gartner MQ
              纳入或排除预计会让 新增 ARR 增速相差 10–20 个百分点，从而在 3 年窗口内对退出价值形成约 1.5–2.5x 的间接杠杆。
            claimRefs:
