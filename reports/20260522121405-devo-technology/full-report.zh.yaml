        - 中端市场和大型企业；云 + 本地混合；LogRhythm 本地部署客户基础
        - AI 驱动 UEBA；云原生叠加本地部署灵活性；合并后存量客户庞大
        - 合并带来整合执行风险；路线图仍在整合；PE 控股
      - - Securonix
