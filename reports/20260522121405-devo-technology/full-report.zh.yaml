  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: |
      从初始认知到活跃部署和扩张的客户旅程，展示企业直采买家、MSSP 中介买家和联邦采购的不同路径。图中标出关键价值时刻和流失风险点。
    data:
      nodes:
        - id: awareness
          label: 认知
          detail: >
            Splunk 迁移活动（'Move to Devo in 100 Days'）；SIEM 分析师短缺推动 SOC 现代化兴趣；PeerSpot/Gartner Peer Insights 从业者评价；展会和 MDR
            合作伙伴转介；AWS Marketplace 发现
        - id: evaluation
          label: 技术评估
          detail: >
            用客户数据做 POC/POV；对比 Splunk、Microsoft Sentinel、Chronicle；评估定价模型（按 GB vs. 按席位 / 按事件）；联邦买家验证 FedRAMP ATO；MSSP
            评估方看多租户演示
        - id: procurement
          label: 采购
          detail: >
            直销：企业销售对接 CISO / 安全预算负责人；大型 SOC 部署通常是复杂的七位数交易。MSSP 渠道：Devo Drive 合作伙伴计划。联邦：DLT/TD SYNNEX 渠道；要求 FedRAMP
            ATO；AWS GovCloud Marketplace 选项
        - id: onboarding
          label: 上线与部署
          detail: >
            部署 Devo Relay（客户侧）；连接数据源（400+ 个认证连接器）；导入 Devo Exchange 检测内容；配置 MITRE ATT&CK
            框架映射。典型部署“数周到数月”（PeerSpot）。上线复杂度是已有记录的风险：SWOT 将见效时间长列为弱点；对技术能力较弱的团队，分析师爬坡时间也偏陡
        - id: active-use
          label: 活跃 SOC 运营
          detail: >
            通过 ThreatLink 关联做每日告警分诊；通过 DeepTrace 做威胁狩猎；通过 Devo Behavior Analytics 做 UEBA 监控；Activeboards 可视化仪表板；Devo
            Exchange 内容更新。被引用客户通常报告 60–90 天内看到 ROI
        - id: expansion
          label: 扩张
          detail: |
            按摄入量计价让数据量增长自然带动支出增长（新增云源、端点、被收购实体）；MSSP 终端客户数增长带来额外租户收入；UEBA 和 SOAR 附加组件消费；采用 Devo Exchange 内容库会加深平台粘性
        - id: retention-churn
          label: 留存 / 流失风险
          detail: >
            高切换成本（丢失 400 天热数据历史）；PeerSpot 推荐率 95%；反向信号：浏览器 UI 不稳定、日志解析复杂、Security Operations 模块缺口、未解析日志带来的定价意外。MSSP
            合作伙伴流失会放大终端客户风险
    claimRefs:
      - CU001
      - CU006
      - CU017
      - CU030
      - CU036
      - CU041
