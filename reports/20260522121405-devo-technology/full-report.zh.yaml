      - number: '2.2'
        title: 市场规模、TAM/SAM/SOM 与相邻机会
        blocks:
          - type: paragraph
            body: >
              多家分析机构对 2026 年全球 SIEM 市场规模的估算差异很大，反映出范围定义不同。Mordor Intelligence 估算 2026 年全球 SIEM 市场约为 $12.1 billion，并以
              11.5% CAGR 增至 2031 年的 $20.78 billion。MarketsandMarkets 口径更窄，估算 2026 年为 $8.39 billion，并以 10.3% CAGR 增至 2031
              年的 $13.67 billion。IDC Worldwide SIEM Forecast（2025–2029）同样预计增长强劲，高于此前预期，驱动因素是监管要求和综合威胁检测需求。Expert Insights
              的 2026 SIEM Market Overview 与 Mordor 估算接近，称市场将从 2025 年的 $10.78 billion 以 12.16% CAGR 增至 2030 年的 $19.13
              billion。低高估值之间约 2–3x 的差距源于方法差异，尤其是是否把托管 SIEM 服务、SOAR、UEBA 和安全数据湖基础设施纳入市场定义。

              Devo 的可服务市场（SAM）比广义 SIEM TAM 更受约束。自下而上看，Fortune 1000 和 Global 2000 中拥有复杂多云安全运营的企业——Devo 核心客户画像——全球约
              3,000–4,500 家。按每年 $500K–$2M 的平均合同价值（与 Devo 在金融服务和零售领域披露的客户经济性一致）计算，该群体 SAM 约为每年 $1.5–9 billion。Devo 自披露的
              2024 年末 ARR 为 $70.6 million，意味着其对这一 SAM 区间的渗透率约为 0.8–4.7%。未来 3 年，Devo 的 SOM 可能聚焦北美和西欧正处于 SIEM 更新周期的大型企业，估计
              800–1,200 家，折合每年 $400M–$2.4B 的机会。

              相邻市场顺风进一步扩大 Devo 的总机会。MDR 市场在 2026 年独立估计为 $3.65–$4.16 billion，并以 20–22% CAGR 增长，到 2030 年达到 $8.57–$11.3
              billion，驱动因素是组织把 SOC 运营外包。Devo 平台同时服务内部团队和 MSSP/MDR 提供商用例，因此 MSSP 渠道是重要市场进入路径。SOAR 子市场通常作为 SIEM
              之上的模块销售，也能增加单笔交易价值。平台融合——整合 SIEM、SOAR、UEBA 和数据编排——是整个品类的方向，这利好 Devo 这种原生统一的平台。

              北美约占全球 SIEM 支出的 40–45%，欧洲占 25–30%，亚太占 15–18%。Devo 业务覆盖三大地区，北美是主要收入基础。2024 年 1 月取得 FedRAMP Moderate 授权并取得
              StateRAMP Authorization 后，联邦政府部门成为重要增长路径；公司可经 TD SYNNEX 子公司 DLT Solutions 等渠道，争取美国联邦机构、国防承包商和州/地方政府合同。
