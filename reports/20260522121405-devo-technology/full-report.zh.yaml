    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、总部与业务概览
        blocks:
          - type: paragraph
            body: >
              Devo Technology 是一家私有云原生安全数据分析公司，总部位于马萨诸塞州波士顿（此前在马萨诸塞州剑桥），业务覆盖北美、欧洲和亚太地区。公司最初于 2011 年以 Logtrust
              名义在马萨诸塞州剑桥注册成立，2018 年 6 月更名为 Devo，以体现其在企业实时运营和安全分析上的更大使命。其法定运营主体是 Devo Technology, Inc.

              公司核心产品是 Devo Security Data Platform，一个完全云原生的 SaaS 方案，把安全信息与事件管理（SIEM）、安全编排自动化与响应（SOAR）、用户与实体行为分析
              （UEBA）合并为单一集成产品。Devo 平台由其自研 HyperStream 技术驱动，可在 PB 级数据集上实现亚秒级查询速度、不牺牲性能的无限数据摄取，以及面向安全运营中心 （SOC）的实时流式分析。

              Devo 的使命是「重塑数据和安全分析的使用方式，让任何规模下的行动都更快、更有信心」。平台主要面向 Fortune 1000
              和大型企业，这些客户拥有复杂、高吞吐量的安全数据环境，覆盖金融服务、零售、能源、政府、医疗等行业。Devo 在更广泛的 SIEM 和安全分析市场中直接对标 Splunk、Microsoft
              Sentinel、IBM QRadar、Exabeam 和 Sumo Logic。

              公司商业模式基于 SaaS，采用可预测、按数据摄取量计价的定价，而不是按功能或席位授权；这一差异化设计旨在降低相较传统 SIEM 厂商的总拥有成本。Devo 收入主要来自年度经常性订阅，另有专业服务收入。截至
              2024 年末，Devo 披露 ARR 为 $70.6 million（高于 2023 年的 $37.1 million），ARR 同比增长超过 90%。公司 $2 billion 估值（2022 年 6 月
              Series F 确定）意味着收入倍数很高，且该轮之后没有公开宣布新的机构融资。
