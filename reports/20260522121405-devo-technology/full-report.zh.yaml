      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              云原生 SIEM 的首要增长驱动，是安全工具从本地部署向外迁移的长期转变。2025 年，传统本地部署 SIEM 按收入计仍约占装机基础的 55%；但云原生方案以 13%+ CAGR 增长，本地部署低于
              8%，意味着 3–5 年内可能出现交叉。这个转变将在 2020 年代后期持续为 Devo 这类平台创造替换需求。

              监管要求是第二大驱动，欧洲尤其明显。欧盟 NIS2 Directive（2024 年 10 月生效）把网络安全义务扩大到 18+ 个行业，要求具备事件检测、报告和监控能力，实际等于要求中大型组织部署
              SIEM。DORA（Digital Operational Resilience Act）自 2025 年 1 月起适用于欧盟金融机构，强制 ICT 风险监控和事件响应要求。ENISA 估计欧盟组织现在约把 9%
              IT 预算分配给网络安全，合规压力将继续推动增长。这些要求直接利好 Devo 的欧洲业务。

              网络安全人才短缺是第三个驱动。全球估计有 4.8 million 个网络安全岗位空缺，SOC 分析师是最紧缺的岗位之一。人才短缺加速企业需求：他们需要 AI 增强型 SIEM
              平台，靠自动告警分流、调查和响应降低分析师工作量；Devo 借「Autonomous SOC」定位明确营销这些能力。Dell'Oro Group 的 2026 企业安全预测认为，下一代 AI 注入型 SIEM
              是安全预算围绕组织的两大中心支柱之一，另一项是云交付边缘安全。这一分析师框架有利于 Devo 的产品定位。

              AI 驱动的威胁复杂化是第四个驱动。生成式 AI 让低技能攻击者也能编写定向钓鱼内容、生成恶意代码，并大规模自动化攻击活动。面对威胁数量和复杂度上升，安全团队需要能摄取 PB
              级遥测数据，并在行为基线上应用机器学习的平台；这正是 Devo 强调的一组能力。

              采用约束同样实质。第一，既有 SIEM 的切换成本高。大型企业 SIEM 迁移通常需要 8–12 个月、$1–1.2 million 的集成劳力、数据管道重配置和分析师再培训。451 Research 的
              SIEM 迁移研究（经 GovInfoSecurity 引用）把传统系统深度嵌入、专有数据模型造成的厂商锁定，以及专门技能要求列为主要摩擦。第二，Microsoft Sentinel 与 Azure
              紧密集成，并对 Microsoft 365 和 Azure 承诺客户给出优惠价格，为已在 Microsoft 技术栈上的组织提供了「够用」替代。第三，尽管 Cisco 收购带来不确定性，Splunk 仍在
              Fortune 1000 账户中拥有最深的既有关系；替换已部署的 Splunk 需要足够有说服力的总拥有成本案例。第四，Devo
              面向高端企业账户，平台销售和交付的资本强度较高；如果没有可扩展的托管服务渠道，公司难以渗透中端市场和更小组织。

              Devo 联邦扩张还有一个特定约束：尽管 2024 年 1 月取得 FedRAMP Moderate 授权，联邦 IT 安全平台采购周期仍长达 12–24 个月。联邦管线虽然潜在价值高，但需要多年才能转化为实质
              ARR。此外，欧盟和部分受监管行业的数据驻留要求，需要 Devo 证明区域内数据处理能力，增加基础设施复杂度。
