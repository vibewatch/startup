        - 中大型企业；AI 优先的 SOC 团队
        - Agentic Mesh AI SOC 分析师（“Sam”）；集成 SIEM+UEBA+SOAR+TIP；云原生
        - 单用户价格更高（$54K–$480K+/年）；渠道比 Splunk/Microsoft 窄
      - - Sumo Logic
        - 云原生日志分析 + SIEM
        - Francisco Partners（2023 年私有化）；SaaS；年度合同中位数约 $85K
        - DevOps 中心型企业；AWS/GCP/Azure 云原生环境
