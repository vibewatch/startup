      - - IBM QRadar
        - 传统 SIEM 现任厂商
        - IBM Security 部门；云业务动能下滑；报价制定价；依靠存量客户留存
        - 受监管行业（金融、医疗、政府）；偏好本地部署
        - 深度合规工具；监管行业关系成熟；本地部署
        - TCO 高；本地架构；相对 Devo 全 SaaS，云原生动能下滑
      - - Google Chronicle (Google SecOps)
        - 超大规模云厂商原生 SIEM
        - Google Cloud；集成 Mandiant 威胁情报；GCP 原生基础设施
        - 云原生企业；高数据量环境；深度投入 Google Cloud 的账户
        - 按员工数计价且数据不限量；Mandiant 威胁情报；PB 级 BigQuery；12 个月热留存
        - 截至 2026 年初尚无 FedRAMP 授权；MSSP 渠道有限；非 GCP 接入复杂
