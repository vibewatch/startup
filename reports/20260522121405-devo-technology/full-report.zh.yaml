      - number: '5.4'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              Devo 最重要的合规里程碑，是 2024 年 1 月 9 日获得 FedRAMP Moderate 运行授权（ATO）。该授权由 Small Business
              Administration（SBA）发起，使美国联邦机构及其合作伙伴能够把 Devo 作为 FedRAMP 授权的云 SIEM 使用。平台也已进入 AWS GovCloud
              Marketplace，面向敏感联邦工作负载。

              FedRAMP Moderate ATO 要求接受覆盖 17 个控制族、325 项 NIST SP 800-53 安全控制的评估，这是一项严格的第三方安全评估，Devo 已经通过。对于 Devo
              争取国防和情报机构客户，以及受 CMMC 等要求约束的联邦承包商客户，这一资质具备实质意义。

              Devo 的 CISO Kayla Williams 曾公开表示，公司「坚持维护最高标准的内部安全控制，确保客户能够安心保护自己免受安全威胁」。平台通过原生多租户、数据驻留控制和区域部署选项支持 GDPR
              合规。Devo 官方文档指出，其 400 天留存和报告能力支持 PCI-DSS、HIPAA 和 SOC 2 审计要求下的合规报告。

              FedRAMP 之外，截至 2026 年 5 月，公开记录无法确认 Devo 平台本身获得 ISO 27001 认证或 SOC 2 Type II
              证明。这些是潜在企业买方——尤其是金融服务和医疗行业买方——可能需要直接向 Devo 核实的证据缺口。Trust Center 页面提供一般性的公司安全声明，但不展示当前认证徽章，也不链接审计报告。

              平台支持 Devo Relay（客户侧）与云平台之间的加密数据传输，并在传输前完成事件级标签和压缩。基于角色的访问控制、多租户隔离和 SSO/OAuth 支持均可用。对于联邦和受监管行业部署，FedRAMP
              Moderate ATO 是最重要且已确认的合规凭证。ISO 27001 和 SOC 2 公开文档缺口，是机构买方寻求完整合规矩阵时的尽调事项。
