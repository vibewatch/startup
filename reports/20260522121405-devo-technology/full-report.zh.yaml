      - - 云原生 / 下一代 SIEM 子细分
        - 采用云原生架构、AI 分析、PB 级摄取的 SaaS SIEM
        - 传统本地部署 SIEM（Splunk 本地部署、IBM QRadar 本地部署旧版）
        - 大型企业 CISO / SOC 负责人
        - 核心竞争场；增速最快的子细分，CAGR 约 13%
      - - 企业 SIEM（Fortune 1000 / Global 2000）
        - 大型组织 SIEM + SOAR + UEBA 集成支出
        - SMB 和中端市场 SIEM（<100 名员工）
        - 企业 CISO（直接预算）
        - Devo 的主要落地点；SAM 约 $1.5–9B
      - - 托管检测与响应（MDR）邻近市场
        - MSSP/MDR 提供商的 SIEM 平台许可证、SOC 即服务
