  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与合规风险
        blocks:
          - type: paragraph
            body: >
              已确认涉及 Devo Technology 的诉讼只有 Shannon v. Devo Technology, Inc.（案号 1:24-cv-10327，美国马萨诸塞州联邦地区法院）。这起民权就业诉讼由原告
              Micah Shannon 于 2024 年 2 月 9 日提起，随后进入证据开示阶段，并围绕质询书和文件提交产生争议。双方于 2025 年 4 月 11 日达成 Settlement Order of
              Dismissal，并在 2025 年 5 月 19 日提交撤诉约定。案件没有进入审判，也没有公开认定责任；截至 2026 年 5 月，未发现仍在进行或活跃的 Devo Technology
              相关诉讼。和解条款及任何财务部分均未公开披露。截至 2026 年 5 月，公共法院记录中也未出现涉及 Devo Technology 的 IP、专利或反垄断索赔。

              英国子公司 Devo Technology UK Limited（Companies House 编号 11507870）需要提交年度账目。最新已提交账目覆盖截至 2024 年 12 月 31
              日的年度（Companies House 记录访问于 2026 年 5 月）。下一份截至 2025 年 12 月 31 日的账目应在 2026 年 9 月 30
              日前提交。英国实体的申报义务带来温和持续合规成本，但没有明显监管敞口。未发现不利 Companies House 申报（注销通知、抵押登记或执法行动）。

              监管合规姿态有三块活跃风险。第一，EU AI Act 的完整条款将于 2026 年 8 月 2 日适用。如果 Devo 的 AI 驱动威胁检测、自主调查和行为分析能力被归类为高风险
              AI（尤其是在关键基础设施或网络安全场景部署时），Devo 将面临技术文件、合格评定、人类监督等要求；不合规罚款最高可达 €35 million 或全球年营业额的 7%。Devo 没有公开披露是否已完成 EU
              AI Act 差距评估，或启动合格评定流程。明确尽调路径：索取 AI Act 差距评估，以及关于 ThreatLink、DeepTrace、Devo Behavior Analytics 是否构成高风险 AI
              分类的法律意见；确认 Devo 是否已为任何必要合格评定聘用 EU Notified Body。

              第二，NIS2 Directive（截至 2024 年 10 月全面生效，各国转置节奏不同）适用于在 EU 成员国运营的数字基础设施和托管安全服务提供商。Devo 的 EU 业务，以及服务 EU 组织的 MSSP
              客户，都会带来 NIS2 敞口。NIS2 要求 24 小时内事件通知、风险管理措施、供应链安全文档，罚款最高可达 €10 million 或年营业额的 2%。Devo 的 Trust Center
              提到隐私合规框架，但没有明确说明 NIS2 合规。明确尽调路径：索取 NIS2 合规姿态文件；确认哪些 EU 成员国转置最贴近 Devo 的运营足迹。

              第三，处理受控国防信息的联邦和国防客户，需要在客户层面满足 ITAR 和 CMMC 要求，并可能把义务传递给作为服务提供商的 Devo。Devo 的 FedRAMP Moderate ATO（2024 年 1 月
              9 日获得，由 Small Business Administration 作为发起机构）覆盖 Moderate Impact 系统，但不覆盖涉密工作负载（IL4/IL5）、DoD ATO 要求或 ITAR
              管制技术数据。ITAR 违规每次最高罚款 $1 million，并可能带来高管刑事责任。明确尽调路径：确认现有联邦客户是否要求 Devo 环境内按 ITAR 处理数据；评估 IL4/IL5 授权是否进入路线图。

              GDPR 合规是 Devo 通过英国子公司和 EU 客户部署持续承担的义务。Devo 的 Trust Center 提到灵活隐私项目，以及用于数据驻留的多区域部署。EU/US
              数据传输通常需要标准合同条款（SCCs）。公共记录中未发现涉及 Devo 的 GDPR 执法行动或数据保护机构调查。
