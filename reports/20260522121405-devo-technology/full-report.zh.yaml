      - CV004
      - CV005
      - CV010
      - CV011
    columns:
      - 方向
      - 论点
      - 什么会改变判断
    rows:
      - - 投资逻辑（正向）
        - 云原生 SIEM 护城河：按摄取量定价、400 天热留存、多租户、开放 API —— 相比传统本地 SIEM 确有差异化
        - 证明毛利率 >70%、ARR 加速，或战略收购方愿意以 >12x ARR 支付溢价
      - - 投资逻辑（正向）
        - NRR >120% 证明客户粘性强；企业账户内扩张超过流失
        - 2024 年 10 月后的 NRR 数据；经审计收入确认 NRR 计算基础
      - - 投资逻辑（正向）
        - FedRAMP Moderate ATO（2024 年 1 月）打开可观联邦 TAM；StateRAMP 授权验证州 / 地方渠道
        - 确认联邦 ARR >$5M；除 SBA 赞助外，拿下具名联邦机构客户
      - - 投资逻辑（正向）
        - 网络安全 M&A 市场活跃，2025 年交易额创纪录达 $96B，为并购退出提供可选性
        - 具名战略买家以确认价格高于清算优先权瀑布；签署 LOI
      - - 反向逻辑
        - $2B 估值约为 28x ARR，缺乏支撑；按当前市场倍数，公允价值区间为 $424M–$988M
        - 新一轮融资估值达到或高于 $2B，且强外部领投方参与
      - - 反向逻辑
        - 2025 年被 Gartner SIEM MQ 排除，让 Devo 失去多数企业买家的第一层采购过滤器；2023、2024 连续入选被打断
        - 确认重返 2026 年 Gartner SIEM MQ，并公布理由且满足标准
      - - 反向逻辑
        - 3+ 年没有新的机构轮；资本充足性和现金跑道未知；约 $500M 优先权悬置，威胁普通股回报
        - 披露经审计财务，显示按当前烧钱速度现金跑道 >12 个月
      - - 反向逻辑
        - 约 4 年内第三任 CEO，且 MSSP 渠道未达标，显示执行不稳和治理风险持续存在
        - Naumann 领导下稳定 12+ 个月，并确认 ARR 增长已报告
  - id: TV003
    title: 乐观、基准与悲观情景表
    notes: >
      ARR 预测是分析估计，不是公司指引。退出倍数来自上市和私有可比交易（Windsor Drake、Solganick Q4 2025）。概率信号是定性评估，不是定量预测。所有情景都假设 Devo
