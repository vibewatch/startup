        - 威胁检测库更窄；原生 SOAR 弱于 Devo 内置能力
      - - Elastic Security
        - 开源 / 商业 SIEM 与 XDR
        - 上市公司（ESTC）；开源核心 + 商业层
        - 工程驱动的 SOC；成本敏感型企业；混合部署
        - 开源核心（Elastic/Wazuh）；商业层 $95–$175/资源/月；OCSF/SIGMA 可移植性
        - 需要显著工程投入；无原生 SOAR；开箱即用合规包较少
      - - Palo Alto Cortex XSIAM
        - XDR 优先的 SIEM 替代方案
        - 上市公司（PANW）；高速增长；防火墙与云安全生态
