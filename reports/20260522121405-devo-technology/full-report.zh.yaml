      - number: '5.3'
        title: 部署、集成与生态系统
        blocks:
          - type: paragraph
            body: >
              Devo 是纯云 SaaS 平台，没有本地部署选项。它可部署在 AWS、Azure 和 GCP 上；在获得 FedRAMP Moderate ATO 后，还专门为美国联邦客户启用了 AWS GovCloud
              支持。托管 SaaS 模式提供自动打补丁、更新和基础设施管理，客户不用承担运营负担。

              平台支持超过 400 个认证数据源连接器，覆盖云平台、终端、网络设备、身份系统和应用。主要认证集成包括 AWS CloudTrail、Azure Activity Logs、CrowdStrike
              Falcon、Microsoft Defender、Palo Alto Networks 和 ServiceNow。通用接入模型接受所有数据类型和格式，不要求刚性 schema
              或接入时强制规范化，从而降低集成摩擦。

              自助数据连接器让客户和 MSSP 可以通过 REST API 为自有应用构建定制集成。Devo API 支持事件接入、查询执行、告警管理和管理操作，并发布了 Python 与
              TypeScript/JavaScript 官方 SDK。DevoInc GitHub 组织（github.com/DevoInc）维护 53+ 个公共仓库，包括 Python SDK（27 颗星，2026 年
              4 月更新）、TypeScript Alerts API 客户端、网络安全工具 PCAP Crafter，以及 ML Model Manager 工具，显示仍在活跃维护；但相较 Splunk 或 Elastic
              生态，外部贡献者参与有限。

              与 ThreatConnect 威胁情报平台集成后，Devo 支持双向威胁数据共享和自动化处置剧本编排。Devo SOAR 支持与第三方 SOAR 平台集成，服务已有 SOAR 工具链的组织。

              托管服务交付通过 MSSP 合作获得支持。最突出且有文档记录的合作伙伴是 Trustwave，其推出了「Trustwave MXDR with Co-Managed SOC for
              Devo」——一项托管扩展检测与响应服务，由 Trustwave 托管和管理 Devo SIEM，并提供 24/7 SOC 专家支持。DLT/TD SYNNEX Public Sector
              渠道为联邦民事、国防和情报机构提供政府分销。

              PeerSpot 评论中从业者报告的一项关键限制是，接入某些非标准云提供商和 Salesforce 等 SaaS 应用需要额外配置。非标准来源的日志解析器更新被反复提为需要改进的领域。
