      - number: '3.3'
        title: 功能与能力对比
        blocks:
          - type: paragraph
            body: >
              SIEM 买方通常沿六个主要能力维度评估平台：数据接入广度与性能、威胁检测（规则型和行为型）、调查与响应自动化（SOAR）、AI/ML 分析、长期数据留存经济性，以及合规 / 认证状态。

              数据接入与性能上，Devo 的 HyperStream 引擎在 PB 级数据集上提供无需索引的实时搜索，不需要预先建索引，就能返回亚秒级查询结果。Splunk 先完成全量索引才能搜索，在高吞吐环境中，告警触发相较
              Devo 架构会多出 15 分钟以上延迟。Microsoft Sentinel 和 Google Chronicle 也提供云原生流式分析，不过 Chronicle 受益于 Google 的 BigQuery
              级基础设施。IBM QRadar 的本地部署架构存在性能天花板，云原生厂商不必面对这类限制。

              原生威胁检测上，Splunk Enterprise Security 通过 Splunk Security Content Automation Protocol 和 Splunk Security
              Essentials，拥有最广的社区维护检测规则库。Microsoft Sentinel 借助 Defender XDR、Entra ID 以及 Microsoft Incident Response
              团队精选规则，深度接入 Microsoft 原生威胁情报。Google Chronicle 用 Mandiant 威胁情报提供精选检测内容。Devo 提供开箱即用的内容包，并通过 UEBA
              模块提供行为分析，但其内容库通常被认为窄于 Splunk 或 Microsoft。

              SOAR 与自动化上，Devo 在平台内原生包含 SOAR 能力，不额外收费。Splunk 的 SOAR（原 Phantom）是单独授权的附加模块。Securonix 和 Exabeam 将 UEBA
              与自动化作为核心产品能力原生纳入。Microsoft Sentinel 通过 Azure Logic Apps 提供处置剧本自动化，但每次自动化运行还会产生额外成本。

              AI/ML 分析上，Microsoft Sentinel 的差异点是 Microsoft Security Copilot：这是一个生成式 AI 层，支持自然语言威胁狩猎和调查；截至 2026
              年初，在主要厂商已普遍可用的 AI 辅助 SIEM 工作流中，它最为先进。Securonix 部署了「Agentic Mesh」，其中包含名为「Sam」的 AI SOC 分析师，用于引导式调查流程。Devo 和
              Chronicle 都引入了基于 ML 的行为分析，但尚未发布经公开验证、能与 Microsoft Copilot 对标的生成式 AI SOC 功能。

              数据留存经济性上，Devo 在基础价格中包含 400+ 天热存储（可查询，不是归档），这是相对 Splunk 额外收费的长期留存、以及 Microsoft Sentinel 默认 90
              天且超出后加收费用的显著差异点。Chronicle 默认包含 12 个月热留存。

              合规与认证上，Devo 拥有 FedRAMP Moderate 授权（2024 年 1 月）、SOC 2 Type 2 和 ISO 27001，并可在 AWS GovCloud
              部署，面向美国联邦机构使用。Splunk 拥有 FedRAMP High 授权并维护专用 GovCloud 部署。Microsoft Sentinel 作为 Azure Government 的一部分拥有
              FedRAMP High。IBM QRadar 有获 FedRAMP 授权的云产品。截至 2026 年初，Google Chronicle 尚无 FedRAMP 授权，限制了其联邦市场进入。
