      - number: '1.4'
        title: 产品平台与关键技术
        blocks:
          - type: paragraph
            body: >
              Devo 的 Security Data Platform 是公司的主要商业化产品，定位为替代传统 SIEM 的集成式云原生方案。平台有三项核心能力：（1）Intelligent SIEM——基于对齐 MITRE
              ATT&CK 的内容、自动关联和实时告警提供威胁检测；（2）SOAR——借助无代码响应剧本、分流自动化和案件管理提供自动化事件响应； （3）UEBA（Behavior Analytics）——用大规模 AI
              模型库在多 PB 级数据集上识别异常用户和实体行为。平台还包含 DeepTrace，一个 AI 驱动的自主威胁调查模块。

              底层技术差异化来自 Devo 自研的 HyperStream 引擎，它能以亚秒级查询延迟同时处理流式数据和历史数据，即使在 PB 级规模下也成立。Splunk 的索引模型可能在摄取高峰引入延迟；Devo
              则无需预处理等待即可摄取数据并立即支持查询。这一架构支持无限数据留存和不降性能的扩展性；Devo 获取面临新 OMB 日志留存要求的公共部门客户时，也曾把它列为关键优势。

              2024 年 1 月，在 Small Business Administration 赞助下，Devo 取得 FedRAMP Moderate
              授权（ATO），使联邦机构及其承包商能够把平台用于政府级安全运营。Devo 平台已上架 AWS GovCloud Marketplace。2024 年 6 月，Devo 还取得 StateRAMP
              Authorization，进一步扩大公共部门可服务市场。

              关键产品里程碑包括：2022 年初收购 Kognos（AI 驱动威胁狩猎），用于构建「Autonomous SOC」愿景；2022 年推出 Devo Exchange（社区应用市场）； 2024 年 7 月推出
              Data Orchestration（成本优化的数据分层）；以及 DeepTrace 自主调查能力。平台与主要云环境（AWS、Azure、Oracle）集成，并支持多国数据主权要求；OneMain
              Financial 等客户称这是关键差异化因素。
