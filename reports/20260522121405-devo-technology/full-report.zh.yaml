  - id: FM001
    title: Devo SIEM / 安全分析市场规模金字塔
    type: pyramid
    layout: standard
    summary: 截至 2026 年，三层市场规模金字塔展示 TAM（全球 SIEM 市场）、SAM（大型企业云原生 SIEM 及相邻 MDR/SOAR）和 SOM（Devo 短期可触达、处于 SIEM 更新周期的北美 / 欧洲大型企业账户）。
    data:
      nodes:
        - id: tam
          label: TAM — 全球 SIEM + 相邻安全分析
          detail: $8.4B–$12.1B（2026 年，SIEM 核心）；纳入 MDR/SOAR/UEBA 后为 $15–20B；到 2031 年 CAGR 10–12%
        - id: sam
          label: SAM — 大型企业云原生 SIEM（Fortune 1000 / Global 2000）
          detail: ~$1.5–9B；3,000–4,500 家目标企业 × $500K–$2M ACV；云原生子赛道以 13%+ CAGR 增长
        - id: som
          label: SOM — 短期可触达（北美 / 欧洲主动更新）
          detail: $400M–$2.4B；约 800–1,200 家组织处于活跃 SIEM 周期；Devo $70.6M ARR ≈ SOM 渗透率 3–18%
    approximationNotes: 所有层级都是基于第三方分析师数据和 Devo 已披露 ARR 得出的近似值。SAM/SOM 估算采用自下而上方法（目标账户数 × ACV 区间）；TAM 采用自上而下的分析师共识。区间较宽，反映分析师分歧和方法差异。
