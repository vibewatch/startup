      - number: '8.5'
        title: 退出准备度、最终尽调问题与打破投资逻辑的触发点
        blocks:
          - type: paragraph
            body: >
              Devo 的退出准备度在多个维度受损。战略收购是最可能的正向退出路径，但买家需要具备三点： 对 Devo 的 SIEM / 安全分析能力有战略理由；即使公司被排除在 Gartner MQ 之外，也能承受整合风险；
              愿意接受 $481–500M 累计投入资本留下的优先权包袱。可能的战略收购方包括：(1) 希望补齐安全分析能力的 大型企业软件平台（例如 IBM、ServiceNow、AWS 原生集成路线）；(2) 希望填补
              SIEM 缺口的规模化 网络安全厂商（例如 CrowdStrike）；以及 (3) PE 支持的网络安全整合平台。

              短期内（12–18 个月）IPO 不可信。2026 年网络安全公司成功 IPO 需要满足：ARR >$200M、 毛利率 >80%、有成文的盈利路径、治理历史干净。Devo 公开信息中没有达到任何一项门槛。

              近期最高的财务风险是下调估值融资。如果 Devo 在 2026–2027 年寻求额外机构资本，新一轮合理的 市场出清价格很可能在 $500M–$900M，相当于从 $2B 下调估值。下调估值融资会产生连锁反应：
              反稀释条款触发早期投资人的棘轮保护，管理层期权重新定价制造治理摩擦，降估值信号也会实质损害 客户信心和企业销售周期。Hurun Global Unicorn Index 仅在 2023 年就记录了 128
              家独角兽估值下跌—— 在 2022–2026 年的估值修正周期中，这已是充分确立的先例。

              活跃的 M&A 环境提供了结构性利好背景。Windsor Drake 报告称，2025 年第四季度网络安全 M&A 年初至今达到 234 笔交易（创纪录节奏）；PwC 的 2026
              年科技交易展望也确认，战略买家正积极追逐 AI 能力和软件平台整合。M&A 热度为 Devo 创造了可选项，但前提是价格合适。若战略买家以 8–10x ARR 收购，将产生 $565M–$706M
              退出价值——对持有 1x 非参与式优先权的早期投资人是正向结果， 但对按 $2B 估值入场的投资人则是显著亏损。

              最终尽调问题（TV006）聚焦最实质影响估值区间的信息缺口：经审计 ARR / GAAP 收入、烧钱速度和 现金跑道、优先股堆叠结构、是否出现过低于 $2B 的老股交易，以及 Gartner MQ
              重新资格认定的具体路径和时间表。
            claimRefs:
              - CV041
