        - $160M（2028）
        - 10–12x
        - $1.6B–$1.92B
        - 低（~10–15%）：需要在 12 个月内解决所有执行缺口
        - 重返 Gartner MQ 失败；CEO 再次更替；ARR 增长低于 30%
      - - 基准
        - ARR 增长 20–30%；新一轮按 6–8x ARR；2027–2028 年战略 M&A 按 6–10x ARR
        - $90–110M（2027）
        - 6–10x
        - $540M–$1.1B
        - 中等（~35–45%）：云原生护城河 + NRR >120% 提供底部；执行缺口限制上行
        - 没有新融资；ARR 增长放缓至 20% 以下；Gartner 排除持续
      - - 悲观
        - ARR 增长停滞在 <20%；没有新融资；按 2–4x ARR 重组或困境出售；普通股归零
        - $60–70M
        - 2–4x
        - $120M–$280M
        - 中等（~35–45%）：3+ 年没有新融资、员工数 -50%、MSSP 未达标、Gartner 排除，都指向此情景
        - 烧钱速度耗尽现金跑道；被迫重组或进入困境出售流程
      - - 极端悲观
