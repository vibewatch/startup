          type: process
        - id: n_competition
          label: 竞争逆风
          detail: Gartner SIEM MQ 2025 年被排除；CRWD / Sentinel / Splunk 均在扩张；XDR 收敛
          type: process
        - id: n_execution
          label: 执行风险
          detail: 4 年内第 3 任 CEO；员工数 -50%；MSSP 渠道未达预期；3 年多没有新的机构轮融资
          type: process
        - id: n_valuation
          label: 估值缺口
          detail: $2B，对应 ~28x ARR；基准情景公允价值 ~$565M（8x）；比当前可比公司高 72%
          type: cost
        - id: n_rec
          label: 建议：观察
          detail: $2B 估值标记下，证据不足以支持买入；需要新一轮融资、ARR 更新或重回 Gartner
          type: output
      edges:
        - from: n_market
          to: n_rec
          label: 市场背景正面
        - from: n_product
          to: n_rec
          label: 技术护城河仍在
        - from: n_customers
          to: n_rec
          label: NRR >120% 已确认
        - from: n_financials
          to: n_valuation
          label: ARR 未验证；缺少烧钱速度 / 现金跑道
        - from: n_competition
          to: n_valuation
          label: 被 Gartner 排除压低收购方出价
        - from: n_execution
          to: n_valuation
          label: 领导层风险压缩退出倍数
        - from: n_valuation
          to: n_rec
          label: 比公允价值高 72% = 观察
  - id: FV002
    title: 估值对 ARR 倍数和 ARR 基数的敏感性
    type: bar
    layout: wide
    summary: >
      按不同 ARR 倍数推算 Devo Technology 的企业价值，并展示两个 ARR 情景：披露的 $70.6M ARR（2024 年 10 月基准） 和 $100M ARR 乐观增长情景。$2B
      上一轮估值标记作为参照。市场可比倍数从 4x（公开 SaaS 中位数） 到 19x（CrowdStrike 高溢价档）不等。Devo 的公允价值区间为 6–14x。
    approximationNotes: |
      ARR 倍数来自公开和私营可比公司基准（Windsor Drake Q1 2026、Multiples.vc、Runchey Research）。 所有数值均为估算；Devo 没有可用的经审计财务数据。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV037
      - CV038
    data:
      series:
        - name: $70.6M ARR（2024 年 10 月披露）
          points:
            - label: 2x
              value: 141
            - label: 4x（公开 SaaS 中位数）
              value: 282
            - label: 6x（悲观可比底部）
              value: 424
            - label: 8x（基准情景）
              value: 565
            - label: 10x
              value: 706
            - label: 14x（Exabeam 档私营公司）
              value: 988
            - label: 19x（CrowdStrike 公开市场倍数）
              value: 1341
            - label: 28x（2022 年估值标记隐含）
              value: 1977
        - name: $100M ARR（乐观增长情景）
          points:
            - label: 2x
              value: 200
            - label: 4x（公开 SaaS 中位数）
              value: 400
            - label: 6x（悲观可比底部）
              value: 600
            - label: 8x（基准情景）
              value: 800
            - label: 10x
              value: 1000
            - label: 14x（Exabeam 档私营公司）
              value: 1400
            - label: 19x（CrowdStrike 公开市场倍数）
              value: 1900
            - label: 28x（2022 年估值标记隐含）
              value: 2800
  - id: FV003
    title: 各情景估值与回报区间
    type: range
    layout: standard
    summary: >
      按极端悲观、悲观、基准、乐观四个情景展示企业价值区间（低 / 基准 / 高），并将 $2B Series F 上一轮估值标记作为参照。 所有数值均为 $M 企业价值。基准情景中心估计（$565M–$700M）比 $2B
      估值标记低约 65–72%。
    approximationNotes: |
      区间由情景对应的 ARR 倍数乘以情景对应的 ARR 估算得出。所有数值均为分析估算；不是公司指引，也不是估值意见。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV039
    data:
      items:
        - label: 极端悲观——停业清算或被迫清算
          low: 60
          mid: 130
          high: 200
        - label: 悲观——困境出售，ARR 停滞，2–4x ARR
          low: 141
          mid: 210
          high: 282
        - label: 基准——战略并购，6–10x，$90–110M ARR（2027 年）
          low: 540
          mid: 700
          high: 1100
        - label: 乐观——溢价并购，10–12x，$160M ARR（2028 年）
          low: 1280
          mid: 1600
          high: 1920
        - label: 当前 $2B 估值标记（2022 年 Series F 参照）
          low: 2000
          mid: 2000
          high: 2000
  - id: FV004
    title: 投资 KPI——投委会可用评分
    type: kpi
    layout: wide
    summary: |
      截至 2026 年 5 月，Devo Technology 在八个维度的投委会评分。分数反映证据质量和当前状态，不代表潜力。 财务透明度和估值风险低分，主导了综合判断。
    approximationNotes: |
      分数是基于可得公开证据的定性评估，不是量化优化。市场、竞争位置（可观察）的信心较高， 财务指标的信心较低（仅有未经审计、第三方估算）。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
    data:
      items:
        - id: market-opportunity
          label: 市场机会
          value: 7/10
          context: SIEM / 分析 TAM $8.4–12.1B（2026 年），CAGR 10–12%；NIS2/DORA 带来顺风。但 Microsoft Sentinel 捆绑和 XDR 收敛形成约束。
        - id: product-moat
          label: 产品与技术护城河
          value: 7/10
          context: 云原生架构、400 天热数据留存、多租户、开放 API 是真实差异化。浏览器 UI 不稳定和仅依赖 AWS 拉低评分。
        - id: customer-proof
          label: 客户验证与留存
          value: 6/10
          context: NRR >120%，有名可查的企业客户标识（AT&T、Sonos、Unisys、Telefónica），FedRAMP。集中度未量化； 2024 年后未披露客户数。
        - id: financials
          label: 财务与单位经济
          value: 4/10
          context: ARR $70.6M，YoY 90%（2024 年 10 月）。毛利率、烧钱速度、现金跑道均未知。2024 年后未更新 ARR。 MSSP 渠道失利已有记录。
        - id: competitive-position
          label: 竞争位置
          value: 4/10
          context: Gartner SIEM MQ 2025 年被排除；CRWD、Sentinel、Splunk 均在 MQ 内，且扩张更快。Devo 缺少 FY2025/2026 市场份额数据。
        - id: management-governance
          label: 管理层与治理
          value: 3/10
          context: 约 4 年内第三任 CEO；员工数较峰值 -50%；MSSP 渠道失利。Ken Naumann（2025 年 3 月）尚未在这一规模证明自己。 Walter Scott 出任执行董事长，提供一定连续性。
        - id: valuation-risk
          label: 估值风险
          value: 2/10
          context: $2B，对应 ~28x ARR。基准情景公允价值 ~$565M（72% 折价）。约 $500M 的优先股悬顶限制了任何现实退出情景下普通股的上行。
        - id: evidence-quality
          label: 证据质量
          value: 5/10
          context: ARR、融资历史、技术差异化证据较强。财务证据弱：没有经审计财报、烧钱速度、现金跑道、股权结构表或 2024 年后 ARR。 累计 24 个未解决问题。
