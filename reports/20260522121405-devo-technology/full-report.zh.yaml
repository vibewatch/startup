  - id: FR002
    title: 风险传导地图
    type: dag
    layout: wide
    summary: |
      主要风险如何传导到 Devo Technology 的收入、客户留存、利润率、融资渠道和估值结果。箭头表示因果或放大关系。
    data:
      nodes:
        - id: mq_exclusion
          label: 被 Gartner MQ 2025 排除
          detail: 失去首轮采购过滤资格；合格销售管线收窄；销售成本上升
        - id: competition
          label: 超大规模云厂商 / XDR 竞争
          detail: Sentinel 捆绑定价、Cisco/Splunk 规模、Google Chronicle 固定费率；按 GB 计价模型被商品化
        - id: ceo_transition
          label: 第三任 CEO 交接
          detail: Ken Naumann 于 2025 年 3 月上任；组织不确定性；MSSP 执行缺口此前已存在
        - id: funding_gap
          label: 融资缺口（2022 年 6 月后无新轮次）
          detail: $2B 估值标记高于低迷的公开可比公司；若需要新资本，存在降轮风险
        - id: aws_dependency
          label: AWS 单云依赖
          detail: 未确认有故障切换；AWS 宕机 = 平台宕机；FedRAMP GovCloud 锁定效应
        - id: product_gaps
          label: 产品质量缺口
          detail: UI 不稳定、SOAR 模块缺口、AI 尚不成熟；技术能力较弱的买家流失风险更高
        - id: mssp_concentration
          label: MSSP / 客户集中度
          detail: Trustwave 和头部客户 ARR 集中度未披露；MSSP 渠道表现不及预期
        - id: arr_risk
          label: ARR 与收入风险
          detail: 赢率下滑；产品缺口带来流失；集中度事件
        - id: valuation_risk
          label: 估值 / 退出风险
          detail: ~28x ARR 倍数，高于 8-15x 公开可比公司；降轮压力；投资人退出时点
        - id: regulatory_risk
          label: EU 监管风险
          detail: EU AI Act（2026 年 8 月）、NIS2、GDPR；合规成本和潜在罚款
      edges:
        - from: mq_exclusion
          to: arr_risk
          label: 管线收缩 → ARR 减速
        - from: competition
          to: mq_exclusion
          label: 超大规模云厂商体量推高 MQ 标准压力
        - from: competition
          to: arr_risk
          label: 赢率受压；定价压力
        - from: ceo_transition
          to: mssp_concentration
          label: MSSP 计划未达目标；领导层缺口
        - from: ceo_transition
          to: arr_risk
          label: 转型期销售执行不确定
        - from: product_gaps
          to: arr_risk
          label: 中端市场流失，扩张放慢
        - from: aws_dependency
          to: arr_risk
          label: 宕机事件触发客户 SLA 违约；客户流失
        - from: mssp_concentration
          to: arr_risk
          label: 单个 MSSP 流失会带走多个终端客户
        - from: arr_risk
          to: valuation_risk
          label: 28x 倍数下收入不达预期 → 按市值计价减值
        - from: funding_gap
          to: valuation_risk
          label: 没有新一轮融资 → 2022 年估值标记缺乏市场可比支撑
        - from: regulatory_risk
          to: arr_risk
          label: 未遵守 EU AI Act / NIS2 → 失去 EU 市场准入
