  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动 / 集中度风险
      - 机制
      - 影响
      - 尽调路径
    notes: |
      Devo 未公开披露集中度风险数据。扩张驱动来自定价模型和产品架构推断。所有影响评估均为估计。
    rows:
      - - 摄取量增长驱动先落地再扩张
        - 按摄取量定价，客户数据量上升时（更多来源、更多云环境、更多端点）支出随之增长
        - 100% 以上 NRR 的结构性驱动；无需重新谈判合同
        - 索取各队列历史平均 ACV 扩张率；询问 Devo 是否跟踪 DBNER（基于美元的净扩张率）
      - - 数据留存切换成本（400 天）
        - 从 Devo 迁出，需要在竞品平台重建 400 天始终热、可搜索的历史数据
        - SOC 团队若用历史关联做合规或主动调查，切换成本很高
        - 追问是否有已知客户从 Devo 迁出，以及遇到的成本 / 摩擦
      - - FedRAMP ATO 打开联邦采购
        - ATO 将可触达客户群扩到美国联邦机构；DLT/TD SYNNEX 提供分销渠道
        - 把 TAM 扩至美国政府 IT 安全预算；多年期政府合同耐久性高
        - 核验 ATO 范围（IL4/IL5、DoD）；评估 DLT 管线规模和活跃联邦采购机会
      - - AWS Marketplace 采购渠道
        - 买家可使用 AWS 承诺消费额度；降低已承诺 AWS 支出的企业账户采购摩擦
        - 加快 AWS 承诺买家的销售周期；通过 AWS 渠道支持 MSSP 部署
        - 索取 AWS Marketplace ARR 占总 ARR 比例；评估与 AWS 的联合销售管线
      - - 客户集中度风险（未披露）
        - Devo 未报告头部客户集中度；大型账户（AT&T、Telefonica 规模）单个可能占 ARR 的 5–15%
        - 单一大客户流失可能显著冲击 ARR；如果 MSSP 服务多个终端客户，MSSP 合作伙伴流失会放大风险
        - 索取前 10 大客户 ARR 集中度；询问是否有单一客户占 ARR 超过 10%
      - - MSSP 渠道集中度风险
        - 根据 SWOT，MSSP 合作伙伴收入未达到增长目标；具名合作伙伴数量不多（CyberMaxx、DeepSeas、Talion、Trustwave）
        - 如果主要 MSSP 合作伙伴（如 Trustwave）流失，Devo 会同时失去该渠道终端客户收入
        - 索取 MSSP 来源 ARR 占总 ARR 比例；询问活跃 MSSP 合作伙伴数量和合作伙伴 ARR 分布
      - - 中端市场渗透缺口
        - 收入低于 $500M 的公司认为定价偏贵；SWOT 标记中端市场尚未开发；长销售周期不利于 SMB
        - 收入多元化风险：过度依赖企业客群使 Devo 暴露在预算压缩周期中
        - 评估是否计划推出中端市场层（MSSP 交付或自助）；检查 Vendr 交易数据中的 sub-$100K ACV 趋势
      - - 负面 UX 留存风险
        - 大型搜索时浏览器 UI 冻结；日志解析复杂；从业者称 Security Operations 模块不完整
        - 会提高成熟度较低或资源不足 SOC 团队的流失风险；可能尤其影响 MSSP 终端客户
        - 向 Devo 索取客户满意度（CSAT 或 NPS）数据；追问产品限制导致的流失与竞品赢单分别占比
  - id: TR001
    title: 监管法律风险登记表
    enumerationScope:
      coverage: partial
      basis: >
        Covers all identified legal cases and material regulatory frameworks applicable to Devo Technology as of May
        2026. Based on public court records, regulatory authority databases, EU regulatory publications, and Devo's
        publicly disclosed compliance posture. Does not include non-public regulatory inquiries or undisclosed legal
        proceedings.
    columns:
      - 规则 / 许可 / 案件
      - 司法辖区
      - 状态
      - 可能性
      - 严重性
      - 缓解措施
      - 剩余暴露
      - 尽调路径
    notes: |
      各行按严重性排序。可能性和严重性反映当前状态；截至 May 2026，Devo 没有公开已知未解决的重大法律暴露。EU AI Act 和 NIS2 行反映报告日期临近的合规期限，不代表已确认违规。
    rows:
      - - EU AI Act（Regulation 2024/1689）— 高风险 AI 分类
        - 欧盟
        - 完全适用期限为 August 2, 2026；合规状态未确认
        - 中 — Devo 的 AI 安全功能（ThreatLink、DeepTrace、Behavior Analytics）可能需要做分类审查；关键基础设施部署很可能被归为高风险
        - 高 — 不合规最高罚款 €35M 或全球年营业额 7%；EU 客户面临市场准入风险
        - Devo Trust Center 提及隐私合规；尚未发布公开 EU AI Act 符合性声明
        - 剩余：重大 — EU AI Act 缺口评估未确认；AI 产品分类尚未公开解决
        - 索取 EU AI Act 缺口评估；确认每个 AI 模块高风险 AI 分类的法律意见；询问是否已启动公告机构符合性评估
      - - NIS2 指令（Directive 2022/2555）— 托管安全提供商义务
        - 欧盟 / 成员国
        - 指令 October 2024 生效；各国转置仍在推进
        - 中 — Devo 的 EU MSSP 客户和欧盟本地运营带来 NIS2 覆盖义务
        - 高 — 最高罚款 €10M 或年营业额 2%；事件通知失败会触发递增处罚
        - FedRAMP 和 SOC 态势提供部分控制对齐；没有 NIS2 专项公开披露
        - 剩余：中 — NIS2 供应链要求可能需要额外供应商文档
        - 索取 NIS2 合规态势文件；识别哪些 EU 成员国对 Devo 施加最高合规负担；确认事件通知流程
      - - Shannon v. Devo Technology, Inc.（1:24-cv-10327）— 雇佣民权
        - 美国马萨诸塞地区联邦地区法院
        - 已于 April 11, 2025 和解；驳回约定于 May 19, 2025 提交；案件关闭
        - 已解决 — 无持续诉讼
        - 低 — 已和解；未公开认定责任；无惩罚性裁决
        - 法律顾问负责抗辩和和解；案件已结
        - 剩余：低 — 和解条款未公开；未发现持续暴露
        - 确认和解条款已完全履行；评估是否存在相关 EEOC 投诉或行政程序
      - - FedRAMP Moderate ATO — 持续监控
        - 美国联邦政府（GSA / FedRAMP PMO）
        - 有效 — ATO 于 January 9, 2024 取得；每年需要持续监控
        - 低 — Devo 自 January 2024 起维持 ATO；未报告失效
        - 高 — 失去 ATO 会让 Devo 退出全部联邦采购；联邦板块收入承压
        - CISO Kayla Williams 的公开发言暗示有专职 FedRAMP 合规团队；SBA 赞助的 ATO 已维持
        - 剩余：中 — 2025–2026 年持续监控合规未获独立确认
        - 索取 FedRAMP ATO 延续函（年度评估）；确认没有未结 POA&M；询问当前评估状态
      - - ITAR / CMMC — 国防客户传导义务
        - 美国国务院 / 国防部
        - 如果联邦客户通过 Devo 处理 ITAR 管制技术数据，存在潜在暴露
        - 低 — FedRAMP Moderate 不覆盖 ITAR；取决于具体客户用例
        - 高 — 每次违规最高罚款 $1M；高管承担刑责；有除名风险
        - AWS GovCloud 提供数据驻留；FedRAMP ATO 覆盖非涉密系统；IL4/IL5 未确认
        - 剩余：中 — IL4/IL5 授权缺口；需核验外籍员工访问国防客户数据
        - 确认现有客户是否要求 ITAR 合规处理；核验国防客户环境的美国人访问控制；评估 IL4/IL5 路线图
      - - GDPR — 欧盟 / 英国数据控制者 / 处理者义务
        - 欧盟 / 英国
        - 持续；英国子公司（Devo Technology UK Limited）提交年度账目；无已知执法行动
        - 低 — 公共记录未发现 GDPR 执法行动或数据泄露通知
        - 中 — GDPR 最高罚款 €20M 或全球年营业额 4%；数据泄露带来声誉风险
        - 多区域 AWS 部署支持数据驻留；EU/US 传输已有 SCC（推断）
        - 剩余：低 — 未发现违规；持续合规成本属于标准运营开销
        - 索取 AI 功能的数据保护影响评估（DPIA）；确认处理者 / 控制者角色清晰；审查客户合同中的 DPA 条款
