      - number: '6.3'
        title: 采用轨迹与客户增长证据
        blocks:
          - type: paragraph
            body: >
              Devo 披露的客户增长轨迹主要来自融资新闻稿、Latka 收入数据和 FeaturedCustomers 汇总。Series E 公告（2021 年 10 月）称，Marc van Zadelhoff 担任
              CEO 的第一年，公司实现「客户增长超过 100%」，新增客户包括 H&R Block、Manulife、FanDuel、Ulta Beauty 和 AMEX Global Business
              Travel。Series F 公告（2022 年 6 月）再次称，上一财年客户增长「接近 100%」，新增客户包括 Sonos、AT&T 和
              Unisys。客户数连续两年接近翻倍，是强增长信号；但公司没有披露绝对客户数。

              收入增长印证了客户扩张：Latka 报告称，Devo 的 ARR 在 2021 年 4 月为 $27.6M，2023 年 12 月为 $37.1M，2024 年 10 月为 $70.6M。$70.6M 相比
              $37.1M 基数约同比增长 90%，收入扩张速度超过时间推进幅度——这一模式与新增客户增长叠加强劲存量账户净留存相符。

              截至 2026 年 5 月访问日，FeaturedCustomers 列出 37 条客户评价和推荐、21 个案例研究、4 个客户视频，为有记录客户互动的广度提供了一个独立代理指标。Devo 的
              SecurityScientist 档案和第三方研究引用「1,000+ 企业部署」，但这个数字来自公司自称，没有第三方审计或独立枚举验证。

              PeerSpot 的 SIEM 品类心智份额数据显示，截至 2026 年 5 月，Devo 的份额从 1.0% 同比升至 1.2%，在该品类排名 #26；Splunk 则以 7.1% 排名 #1。温和增长说明
              Devo 正在扩大从业者认知基础，但绝对位置仍低。PeerSpot 评价者中 95% 愿意推荐 Devo，平均评分 8.4/10（Splunk 为 8.3/10），说明现有用户满意度高。

              Devo 在 AWS Marketplace 的评价也提供了真实部署信号。评价者提到易用性、实时日志管理和云集成收益。也有部分评价者指出通知缺失，并希望为初学者提供更好的 UI，这与 PeerSpot
              负面反馈中关于 UX 复杂度的更大主题一致。
