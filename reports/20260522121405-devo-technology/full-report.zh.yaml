          detail: 推高 AI 增强 SIEM 需求；Devo 的 Autonomous SOC 定位受益
          tone: positive
        - id: driver-ai
          label: GenAI 驱动的威胁复杂化
          detail: 增加遥测量和检测复杂度；利好 PB 级分析
          tone: positive
        - id: driver-splunk
          label: Cisco/Splunk 收购带来的客户流失
          detail: 替换窗口为 2024–2026 年；Splunk 客户对定价和路线图不确定
          tone: positive
        - id: constraint-msft
          label: Microsoft Sentinel 的 Azure 原生捆绑
          detail: 对已投入 Azure/M365 的企业给出优惠定价；价格锚约束持续存在
