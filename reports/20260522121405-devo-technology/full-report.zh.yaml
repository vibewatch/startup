        - 战略价值高；FedRAMP ATO 打通政府范围采购；DLT/TD SYNNEX 渠道
        - IL4/IL5 和 DoD ATO 未确认；暂不能覆盖涉密工作负载；FISMA 范围不确定
      - - 能源与公用事业
