      - number: '1.5'
        title: 关键里程碑与公司事件
        blocks:
          - type: paragraph
            body: >
              Devo Technology 的历史横跨十五年，从一家西班牙日志分析创业公司持续演进为总部位于美国的网络安全平台公司。公司于 2011 年由 Pedro Castillo、Pedro Palao、Juana
              Nunez Garcia 和 Daniel Garcia 以 Logtrust 名义创立。早期 Kibo Ventures 投资帮助公司先在欧洲获得商业牵引，随后公司成功进入美国企业市场，吸引 Insight
              Partners 关注，并在 2017 年完成 Series B 融资。

              2018 年 6 月，Logtrust 更名为 Devo，与 Series C 同步，标志着公司战略定位从纯日志管理厂商转向企业数据运营和安全分析平台。2020 年 Series D
              为企业销售扩张提供燃料。2021 年 10 月的标志性 Series E 让公司达到独角兽状态（估值 $1.5B），并引入知名财务赞助方（TCV、General
              Atlantic、Eurazeo），支持激进招聘，包括搭建 APAC 销售团队、国际合作伙伴关系和大量产品投入。

              2022 年收购 Kognos 是关键产品里程碑，把 AI 驱动的自主威胁狩猎嵌入核心平台，也让 Devo 的「Autonomous SOC」营销叙事有了实质。2022 年 6 月估值 $2 billion 的
              Series F 验证了投资人信心。关键反向里程碑包括：CEO Marc van Zadelhoff 于 2024 年初离任（他曾带领公司经历最高增长期）、Walter Scott 临时领导期，以及 2025 年
              3 月 Ken Naumann 接任；这意味着 Devo 约五年内第三次更换 CEO。2022 年 6 月至 2026 年 5
              月三年未见新的机构融资，是一个显著空档，可能说明公司资本管理较克制、也可能说明其难以按 2022 年估值获取新资本。
