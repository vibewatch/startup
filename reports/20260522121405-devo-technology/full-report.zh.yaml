  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价架构与收入来源
        blocks:
          - type: paragraph
            body: >
              Devo Technology 的收入主要来自其云原生 Security Data Platform 的年度经常性订阅合同。核心定价机制按数据接入量计费：客户根据每天接入的日志和安全遥测数据量付费，计量单位是
              GB/day 或 TB/day。这不同于 IBM QRadar 和 Splunk 等竞争对手分别采用的按席位（按用户）和按事件（EPS/FPM）定价。Devo
              公开把其全包定价模型定位为关键差异点——公司称所有平台能力（SIEM、SOAR、UEBA、400 天热数据留存）都包含在基础订阅价格中，附加功能或高级模块不另收费。

              Devo 不发布公开定价页或标价。Vendr 的第三方采购基准显示，企业买方每年为 Devo 支付的中位数约为 $131,250，区间从约 $28,133（较小部署）到
              $200,662（更大或功能更丰富的合同）。clearnetwork.com 和 cyberse.com 的更详细基准显示，Devo 按接入量计价约为 100 GB/day 接入每年 $90,000，10
              TB/day 时每年 $5.4 million，意味着较小档位标价约为每 GB/day 每年 $900，大型企业规模约为每 GB/day 每年 $540。这些数字是第三方估算，并非 Devo 官方定价披露。

              Devo 的第二条收入流是专业服务，包括初始部署、定制集成开发、SIEM 迁移支持和咨询顾问。Devo 主动宣传「100 天免费从 Splunk
              迁移」方案，说明专业服务有时被用作销售动作，而非重要的独立收入驱动。纯 SaaS 安全分析厂商（Elastic、CrowdStrike、Securonix）的行业惯例显示，专业服务通常贡献总收入的 10–15%
              或更低，其余 85–90% 来自经常性订阅 ARR。Devo 没有公开披露专业服务收入占比。

              2022 年 6 月官方 Series F 新闻稿确认，Devo 在该轮融资时年收入增速接近 100%；同样，Series E 新闻稿（2021 年 10 月）称当财年收入同比增速接近 100%，客户增长超过
              100%。这些里程碑锚定了增长轨迹，并最终对应 GetLatka 报道的 $37.1 million ARR（2023 年 12 月）和 $70.6 million ARR（2024 年 10 月）。

              Devo 的收入确认预计遵循标准 SaaS 订阅会计：年度合同通常在合同期内按比例确认，合同价值以 ARR（年度运行率）而非 GAAP 收入报告。Devo Technology,
              Inc.（美国私营公司）没有公开可得的经审计 GAAP 收入数字；但英国子公司 Devo Technology UK Limited（Companies House 编号 11507870）必须提交年度账目，截至
              2026 年 5 月，2024 年 12 月 31 日止年度账目已经编制并在 Companies House 留档。

              收入质量受到据称 >120% 净留存率（NRR）的支撑，说明现有客户扩张收入足以超过任何流失。这一 NRR
              对公司当前规模和阶段来说偏高，指向较强客户粘性，以及企业账户内有实质增购空间。不过，该指标来自公司自报或第三方估计，尚未经过独立审计。
