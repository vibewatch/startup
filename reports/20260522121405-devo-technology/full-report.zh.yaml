      - number: '7.3'
        title: 财务、融资与估值风险
        blocks:
          - type: paragraph
            body: >
              Devo Technology 最近一次公开宣布的机构融资，是 2022 年 6 月由 Eurazeo 领投的 $100 million Series F，投后估值 $2 billion。按 2024 年 10
              月报告的 $70.6 million ARR 计算，$2 billion 估值意味着约 28x ARR 倍数。相比之下，2026 年领先上市 SaaS
              安全公司（CrowdStrike、Elastic）的远期收入倍数为 8–15x。如果 Devo 以压缩后的市场倍数做 down round 或流动性事件，估值可能落在 $600M–$900M（按当前 ARR 的
              8–12x），较 $2 billion 高点减值 55–70%。这尚未确认——公司没有宣布 down round——但 2022 年估值与当前上市可比公司的差距，给现有股东带来明显盯市风险。

              Series F 之后已经过去三年零十一个月，仍没有公开融资公告。对 Devo 这个规模的成长阶段 SaaS 公司来说，典型风险融资周期是 18–24 个月一轮。没有新一轮融资，可能对应几种情形：（a）Devo
              用订阅 ARR 产生的现金自我供血增长；（b）Series F 剩余资金足以支撑运营直到计划中的退出；（c）在 $2B 标记上融资条件艰难。员工数从 2022 年 12 月约 769 人峰值降至 2026 年 4
              月约 350–530 人（按 Unify 员工数据），与主动成本纪律、降低 burn rate 计划，或两者兼有相符。Unify 报告引用 2025 年 EBITDA 增长
              39%，说明盈利能力指标可能改善，但没有审计财务数据可以确认。

              burn rate 和现金跑道仍未披露。Devo 六轮累计融资 $500 million，Series F 于 2022 年 6 月完成；如果假设公司以与裁员相符的中等 burn rate 运营，Series F
              剩余资金很可能仍在提供后续跑道，但具体规模未知。明确尽调路径：向管理层索取现金及现金等价物、月度 burn rate 和预计现金跑道；询问 2022 年 6 月以来是否发生任何投资人老股出售或资本重组。

              英国子公司 Devo Technology UK Limited 必须向 Companies House 提交年度账目。截至 2024 年 12 月 31 日的年度账目已有记录（访问于 2026 年 5
              月）。英国子公司账目提供了一定财务可见性，但不能反映集团合并财务，也不能反映美国母公司的完整财务状况。

              投资人退出压力是潜在风险。Insight Partners、Georgian、TCV、General Atlantic、Bessemer Venture Partners、Kibo Ventures 和
              Eurazeo 都是在 2022 年或更早轮次进入的股东。到 2026 年，Series F 已有四年历史——接近或已处在许多成长阶段 VC 基金的典型投资期限内。这不会立刻制造压力，但会提高 2026–2028
              年窗口内发生退出事件（IPO、M&A 或老股交易）的概率。如果被迫以低于 2022 年标记的估值退出，且期权行权价高于退出估值，管理层激励可能错位。
