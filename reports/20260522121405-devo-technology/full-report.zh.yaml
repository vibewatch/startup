      - number: '6.6'
        title: 扩张、集中度与采购风险
        blocks:
          - type: paragraph
            body: >
              Devo 基于摄取量的定价模式（按摄取数据 GB 计费）天然带来先落地后扩张机制：客户接入更多数据源、增加云环境，或扩大安全覆盖面后，数据量上升，Devo
              的单客户收入无需重谈合同也会增长。只要客户留在平台上，这就是结构性 NRR 驱动因素。400 天始终热数据留存也制造了切换成本：客户迁走时，需要在竞品平台重建 400 天可搜索历史，从而增强留存韧性。

              集中度风险没有公开披露。Devo 不报告头部客户收入集中度指标（例如前 10 大客户贡献的 ARR 占比）。考虑到 Devo 主要瞄准大型企业和大型 MSSP，少数大账户（AT&T、Telefonica 或大型
              MSSP 伙伴）贡献不成比例 ARR 是合理推断。按 Devo 报告的 $70.6M ARR，一份 Telefonica 或 AT&T 规模的企业 SIEM 合同（年费可能达到七位数）可能占总 ARR 的
              5–15%，形成实质客户集中度；但这只是推断，并非披露数据。

              采购摩擦在三类场景中最明显：（1）美国联邦采购——FedRAMP Moderate ATO（2024 年 1 月）以及通过 DLT/TD SYNNEX 提供 AWS GovCloud
              可用性有所缓解，但面向涉密工作负载的 IL4/IL5 和 DoD ATO 仍未确认；（2）中端市场采购——SWOT 分析把价格感知列为重要障碍，收入 $500M 及以下层级的客户认为 Devo 偏贵；（3）受欧洲
              GDPR 约束的采购——Devo 支持多区域部署以满足数据驻留，但 ISO 27001 认证和 DPA 条款未公开确认。

              Devo 已上架 AWS Marketplace，为已承诺 AWS 消费的企业买家提供采购便利；买家可以使用既有 AWS credits，采购摩擦也随之下降。AWS Marketplace
              列表包含独立评价，确认有活跃部署。

              PeerSpot 和 swotanalysis.com SWOT 记录的客户负面反馈指向几类可能抬高流失风险的摩擦：大规模搜索时浏览器 UI 卡死，非标准来源日志解析复杂，从业者认为 Security
              Operations 模块不完整，未解析日志元数据收费带来意外价格敞口，以及入门流程需要分析师投入大量爬坡时间。这些摩擦对规模较小或技术能力较弱的安全团队最尖锐，也与 SWOT 识别的中端市场渗透挑战一致。
            claimRefs:
