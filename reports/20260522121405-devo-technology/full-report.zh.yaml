      - - Microsoft Sentinel
        - 超大规模云厂商原生 SIEM
        - Azure 原生；Microsoft Security 的一部分；2025 年 Gartner MQ 领导者；FedRAMP High
        - 深度投入 Azure/M365 的企业；政府账户
        - M365/Azure 原生集成；Security Copilot AI；深度绑定 Microsoft 的买家有效成本最低
