      - number: '1.2'
        title: 创始人、领导层与董事会治理
        blocks:
          - type: paragraph
            body: >
              Devo Technology 于 2011 年由四位西班牙技术人员共同创办：Pedro Castillo（创始人兼 CTO）、Pedro Palao、Juana Nunez Garcia 和 Daniel
              Garcia。创始团队先在西班牙搭建最初的 Logtrust 平台，随后建立美国业务并把公司扩展到企业市场。Pedro Castillo 担任 CTO，后来多任 CEO 明确称他是平台架构背后的技术愿景推动者。

              近几年，公司 CEO 更替明显偏频繁。Marc van Zadelhoff 离任后，Walter Scott 在 2024 年担任临时 CEO；2025 年 3 月 Ken Naumann 被任命为正式 CEO
              时，Walter Scott 转任董事会执行主席。Marc van Zadelhoff 自 2020 年起担任 CEO，带领公司从约 400 名员工扩张至 500 多人；他于 2024 年初离开
              Devo，随后成为 Mimecast CEO。这意味着公司约四年内第三次更换 CEO，带来关键人风险和战略连续性担忧。

              现任 CEO Ken Naumann（2025 年 3 月 5 日上任）是网络安全行业老将，曾在 NetWitness 等技术公司担任 CEO，具备深厚的 CIO/CISO 领域经验。当前高管团队还包括
              Kayla Williams（CISO）、Wences Sevillano（CFO）、Daryl Volgarino（总裁）和 Brian Froehling （首席营收官）。董事会包含主要投资方代表，包括
              TCV（Gopi Vaddi）、General Atlantic（Gary Reiner / Asher Hecht）、Eurazeo（Guillaume d'Audiffret）、Insight
              Partners 和 Georgian。

              在现任 CEO 之下，公司领导层强调 AI 驱动自动化、Autonomous SOC 能力和平台整合三大战略支柱。治理风险包括刚完成的 CEO
              交接、创始人不再参与日常运营，以及董事会主要由财务投资人主导、缺少深度产品顾问代表。
