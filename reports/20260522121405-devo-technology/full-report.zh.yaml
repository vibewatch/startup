      - number: '7.6'
        title: 伙伴、云与客户集中风险
        blocks:
          - type: paragraph
            body: >
              Devo 对 AWS 基础设施的依赖，带来云服务商集中风险。平台原生搭建在 AWS 上，使用 AWS 计算、存储（S3）和网络基础设施。AWS GovCloud
              是面向联邦客户的交付机制。公开资料没有确认任何多云故障转移架构。如果 AWS 出现重大区域或全球中断，Devo 客户的 SOC 运营会被直接影响。云原生 SaaS
              架构本身就有这种供应商锁定风险；但对安全运营基础设施而言，可用性和可靠性是平台价值主张的关键，因此风险尤其尖锐。

              MSSP 渠道集中是重大但未量化的风险。具名 MSSP 伙伴包括 Trustwave（通过 Trustwave MXDR Co-Managed SOC）、CyberMaxx、DeepSeas、Talion 和
              Corsica Technologies。其中，Trustwave 按 MSSP Alert 口径是 Top 250 MSSP，也是公开已知最大伙伴。如果 Trustwave 或其他大型 MSSP 伙伴切换
              SIEM 供应商（例如转向 Microsoft Sentinel 或 Splunk），Devo 会同时失去该 MSSP 的终端客户部署。Q4-2025 SWOT 分析显示，MSSP
              渠道「未达到激进增长目标」——说明该渠道尚未产出原计划中的 ARR 多元化。MSSP 来源 ARR 占总 ARR 的比例没有公开披露。

              头部客户 ARR 集中度未披露。Devo 报告 $70.6M ARR，并声称有 1,000+ 企业部署。如果少数大账户（跨国电信规模的 Telefonica、AT&T、大型 MSSP 伙伴）占 ARR 的
              25–40%，单一客户流失就可能造成重大收入台阶式下滑。在 $70.6M ARR 下，一份 $7–14M 的企业 SIEM 合同（对 Telefonica 规模、100+ GB/day
              摄取的部署而言合理）占公司总收入的 10–20%。公司没有发布前 10 大客户集中度指标。明确尽调路径：索取前 5 大和前 10 大客户 ARR 集中度；询问是否有任何客户超过 ARR 的 10%；把 MSSP
              来源 ARR 作为独立集中度类别单独分析。

              美国联邦渠道通过单一分销商 DLT/TD SYNNEX Public Sector 触达。这在联邦细分市场制造了渠道集中：如果 DLT/TD SYNNEX
              改变优先级、失去关键合同工具，或自身出现运营中断，Devo 进入联邦机构采购的能力会受损。这是政府 IT 分销的常见特征，但仍代表一种未多元化的渠道依赖。

              投资人退出时点还制造了更隐性的依赖风险。六家机构投资人（Insight Partners、Georgian、TCV、General Atlantic、Bessemer、Kibo、Eurazeo）来自 2022
              年基金年份，2026–2028 年期间很可能出现退出讨论。如果被迫以低于计划的估值出售，可能分散领导层注意力、带来员工留存风险，或引入路线图优先级不同于 Devo 独立愿景的战略收购方。
