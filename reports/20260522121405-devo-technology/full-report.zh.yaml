  - id: TR002
    title: 运营、质量和安全风险登记表
    columns:
      - 失效模式
      - 可能性
      - 严重性
      - 缓解成熟度
      - 剩余暴露
      - 未解决缺口
    notes: |
      各行按严重性排序。产品质量风险证据来自 PeerSpot 从业者评论和 SWOT 分析。AWS 依赖严重性反映单云架构。未发现 Devo Technology 有已确认安全事件或数据泄露。
    rows:
      - - AWS 单云依赖 — 区域或全球 AWS 中断会使 Devo SOC 运营停摆
        - 低 — AWS 历史可用性 >99.9%；但 87% 企业每年至少报告一次重大云中断
        - 严重 — SOC 分析师失去实时告警、威胁狩猎和案件管理；客户 SLA 违约风险
        - 低 — 未确认多云故障切换；公开文件未披露 RTO/RPO
        - 高 — 关键安全运营没有公开确认的故障切换路径
        - 多云故障切换架构和 RTO/RPO SLA 尚未公开确认；GCP/Azure 计算故障切换未验证
      - - 被排除在 2025 年 Gartner SIEM MQ 之外 — 被企业采购首轮筛选挡在门外
        - 已确认 — Devo 因未满足业务标准被排除在 2025 年 MQ 之外（据 dawn liphardt 分析）
        - 高 — 企业买家把 MQ 当成候选名单过滤器；出局会压低合格管线和竞争胜率
        - 低 — GigaOm Radar Leader 认可和 FedRAMP 提供替代验证；尚未确认重返 MQ
        - 高 — 在 Devo 重新满足下一轮 MQ（通常每年一次）资格前，要求 MQ 入选的企业交易胜率风险较高
        - Devo 未通过的 2025 年 MQ 业务标准未完整披露；重返路径和时间表未确认
      - - 浏览器 UI 不稳定 — 大型搜索期间影响 SOC 分析师效率
        - 中 — PeerSpot：多名评论者称“界面在大型搜索中可能卡死”
        - 中 — 主动事件处置时调查延迟；分析师受挫；耐心较低的买家可能流失
        - 低-中 — 预计产品会持续迭代；未发布确认的修复时间表
        - 中 — 关键工作流里的 UX 摩擦持续存在；给新潜在客户留下负面评论信号
        - 浏览器卡死根因和修复状态未公开披露；发生频率和规模阈值未刻画
      - - 日志解析摩擦 — 未解析日志的元数据收费造成意外成本超支
        - 中 — PeerSpot 评论者记录“未解析日志可能增加成本”的风险
        - 中 — 客户预算超支；信任被侵蚀；成本敏感买家可能流失
        - 低 — 公司称标准模式是全包定价；未解析日志例外增加复杂度
        - 中 — 定价透明度缺口可能限制中端市场或监管行业扩张
        - 未解析日志处理的定价条款未完全公开；需要逐一审查客户合同
      - - Security Operations 模块缺口 — SOAR / 案件管理能力相对 SIEM 不完整
        - 中 — 多名 PeerSpot 评论者称：“最需要改进的是 Security Operations 模块”
        - 中 — 需要完整 SIEM+SOAR 集成的买家可能转向专门 SOAR 厂商或 Splunk SOAR
        - 中 — 已确认持续开发；模块存在，但还需要成熟
        - 中 — 可能丢掉要求成熟 SOAR 能力的交易；相对 Splunk SOAR 只保留部分竞争优势
        - 相对独立 SOAR 厂商（Palo Alto XSOAR、Splunk SOAR）的具体 SOAR 能力缺口尚未基准测试
      - - ISO 27001 / SOC 2 Type II 未确认 — 缺少企业采购常见认证
        - 高 — 公开 Trust Center 或产品文档未提及这些认证
        - 中 — 对有强制审计要求的企业买家构成采购阻碍
        - 低 — FedRAMP ATO 提供部分控制验证；Trust Center 提到安全态势
        - 中 — 相比公开确认 SOC 2 Type II 的厂商存在竞争缺口；采购摩擦上升
        - SOC 2 Type II 报告未公开；ISO 27001 证书未确认
      - - AI 能力成熟度缺口 — ThreatLink、DeepTrace、UEBA 相比超大规模云厂商的 AI 增强 SIEM
        - 中 — PeerSpot：“平台的 AI 能力需要打磨”
        - 中 — AI 成为 SIEM 标配后，能力缺口可能加速竞争流失
        - 中 — Autonomous SOC 愿景在积极开发；GigaOm Autonomous SOC Leader（2024）
        - 中 — 相比 Microsoft Copilot for Security 和 Splunk AI Assistant 存在功能缺口；补齐时间不清楚
        - 没有独立 AI 检测准确率基准；DeepTrace / ThreatLink 误报率未公开
