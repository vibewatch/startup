  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前 / 传统工作流
      - Devo 方案
      - 可量化收益（声称）
      - 限制
    notes: |
      可量化收益来自公司声称，或 PeerSpot/Gartner 从业者引用；多数指标没有独立量化基准。null 单元格表示无可用数据。
    rows:
      - - 高告警量 SOC 的告警分诊
        - 传统 SIEM 每天要人工审核数千条告警；分析师疲于应付
        - ThreatLink AI 关联将告警压缩到每天数十个高可信案件
        - 分析师工作量从数千条降到数十个案件（公司声称）
        - 降幅未独立验证；案件优先级排序准确性未经测试
      - - 跨历史数据的威胁狩猎
        - 基于索引搜索抽样或归档日志，速度慢；通常只覆盖 30–90 天
        - DeepTrace 借助 400 天常热数据自主狩猎；映射 MITRE ATT&CK
        - 公司称可用机器速度调查，并覆盖回溯狩猎
        - 未发布相对 Splunk 或 Sentinel 的驻留时间缩短基准
      - - 内部威胁检测
        - 传统 SIEM 对用户活动做规则告警，误报率高
        - Devo Behavior Analytics UEBA 采用 AI 模型和 0–100 实体风险评分
        - 跨多 PB 级数据集做异常检测；按风险排序
        - 模型库深度未公开与专业 UEBA 厂商（如 Varonis）对比
      - - 联邦 / 政府 SIEM 合规
        - 本地 SIEM 难以满足 OMB 日志留存要求，基础设施成本高
        - FedRAMP Moderate SaaS SIEM；400 天留存；AWS GovCloud
        - 满足 OMB 延长日志留存要求；没有硬件开销
        - 仅限 FedRAMP Moderate 范围；IL4/IL5 批准未确认
      - - MSSP 交付的托管 SIEM
        - MSSP 需分别管理客户 SIEM 基础设施、补丁和许可
        - Trustwave MXDR Co-Managed SOC for Devo；Devo 负责托管、配置和维护
        - 去掉 SIEM 自持负担；以可预测价格快速部署
        - Trustwave 之外的 MSSP 渠道广度公开记录不足
      - - 多云日志整合
        - AWS、Azure、GCP 各自形成数据孤岛，并配套不同安全工具
        - 从所有云来源统一摄取，无需 schema 标准化
        - 在混合云 / 多云环境中提供单一平台可视性
        - 某些 SaaS 来源（如 Salesforce）需要额外集成工作
  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 组件
      - 角色
      - 依赖
      - 风险
    notes: |
      架构细节来自 Devo 官方文档、Grokipedia 二级研究，以及 DLT/TD SYNNEX 合作伙伴页面。性能规格均为公司声称；没有独立基准验证。
    rows:
      - - Devo Relay（客户侧）
        - 标记事件、压缩、加密，并转发至平台负载均衡器
        - 客户网络；每个环境都必须部署
        - 单个 relay 故障会中断该网段摄取；可用性由客户管理
      - - 事件负载均衡器
        - 解密传入数据流；将事件分发到数据节点
        - 云基础设施（AWS/Azure/GCP）
        - 由 Devo 管理；客户无法直接看到冗余架构
      - - 数据节点（HyperStream）
        - 以列式格式存储未经解析的原始事件数据；查询时解析
        - Devo 管理的云基础设施；水平扩展
        - 每节点 2TB/day 和 10x 突增容量为公司声称，未经第三方验证
      - - Activeboards UI
        - 基于浏览器的可视化分析和调查画布
        - Web 浏览器；没有原生桌面客户端
        - 从业者称大规模搜索时浏览器会卡死；上手复杂
      - - ThreatLink AI 关联引擎
        - 将告警关联并补充上下文，形成高可信案件；降低噪声
        - HyperStream 数据访问；威胁情报源
        - 告警到案件的压缩比例为公司声称；AI 模型可解释性未记录
      - - DeepTrace AI 调查
        - 借助攻击追踪 AI 自主调查告警和威胁狩猎
        - HyperStream 数据；MITRE ATT&CK 框架；来自 Kognos 收购（2022 年）
        - AI 调查准确率和漏报率未经独立评估
      - - Devo Behavior Analytics（UEBA）
        - 实体行为建模；异常检测；0–100 风险评分
        - Devo 数据表；ML 模型库
        - 行为模型库广度未公开与专业 UEBA 厂商对比
      - - Devo Exchange（市场）
        - 预置检测规则、狩猎模板、集成包
        - 互联网连接；厂商和社区贡献
        - 内容更新度和质量保证流程未披露
      - - REST API / SDK 层
        - 以编程方式摄取事件、查询、管理告警；Python/TypeScript SDK
        - Devo 云 API 端点；DevoInc GitHub 代码库
        - Python SDK 在 GitHub 有 27 stars；外部开发者生态相对 Splunk/Elastic 有限
      - - 数据编排层
        - 过滤数据并路由至 S3、Kinesis 或平台分析
        - AWS 集成；数据源连接能力
        - 非 AWS 路由目标（Azure Blob、GCS）未确认；非 AWS 覆盖存在缺口
