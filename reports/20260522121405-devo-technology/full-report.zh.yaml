  - id: TR004
    title: 人员与执行风险台账
    columns:
      - 角色 / 职能
      - 依赖或缺口
      - 可能性
      - 严重性
      - 缓释措施
      - 尽调路径
    notes: |
      行按严重性排序。员工数数据来自 Unify（2026 年 4 月）。CEO 背景来自公开新闻稿。MSSP 执行缺口来自 SWOT Q4-2025。Devo Technology, Inc. 没有公开的高管薪酬或股权结构。
    rows:
      - - CEO 角色（Ken Naumann）
        - 约 4 年内第三任 CEO；2025 年 3 月上任；在 Devo 这一规模上的公开履历有限；NetWitness 未跑出爆发式结果
        - 中 — CEO 任期稳定通常需要 12–18 个月；执行结果尚无法衡量
        - 高 — 过渡期内可能出现战略转向、客户不确定性、销售周期受扰和投资者信心风险
        - Walter Scott 担任执行董事长，提供连续性；Naumann 有网络安全行业经验
        - 索取 2026 年 Q1–Q2 管线转化率；访谈 NetWitness 任期的推荐人；确认产品和 GTM 战略与董事会一致
      - - MSSP 渠道执行
        - MSSP 收入未达增长目标（SWOT Q4-2025 OKR 失败）；渠道项目被描述为仍在早期
        - 中 — 领导层过渡和激励重组可能改善表现，但需要时间
        - 高 — MSSP 渠道本应成为重要增长杠杆；表现不及预期会限制收入多元化
        - 有专门 MSSP 产品页；多租户架构；维持 Trustwave 标杆合作
        - 索取 MSSP ARR 占总 ARR 比例；询问活跃 Devo Drive 合作伙伴数量；获取 MSSP 渠道 2025 年具体 OKR 目标与实际完成情况
      - - 联合创始人 / CTO 依赖（Pedro Castillo）
        - HyperStream 架构深度绑定创始人的技术愿景；领导层过渡期内 CEO-CTO 对齐很关键
        - 低 — Castillo 已经历多次 CEO 更替仍留任
        - 高 — Castillo 离职会带来显著架构和产品连续性风险
        - 组织任期长；未发现离职信号
        - 确认 Castillo 留任协议；评估 CTO 继任计划；询问 HyperStream 核心技术债
      - - 工程团队产能（148 名工程师，2026 年 4 月）
        - 工程员工约占 2026 年 4 月总员工数的 19%；低于 2022 年峰值；支撑 SIEM+SOAR+UEBA+AI 路线图
        - 中 — 相对产品覆盖面，团队偏精简；安全工程人才竞争激烈
        - 中 — 功能交付可能延迟；难以让所有产品模块维持竞争级成熟度
        - 云原生 SaaS 自动化降低单个工程师的维护负担；产品架构集中
        - 索取 R&D 员工数占总人数比例及相对 2022 年变化；询问功能交付周期基准和发布节奏
      - - 销售与支持员工数（54 人）
        - 对 $70.6M ARR 基础而言，销售与支持团队偏精简；企业 SIEM 销售周期长且技术性强
        - 中 — 低于该 ARR 水平企业 SaaS 的中位比例
        - 中 — 管线覆盖缺口；大客户客户成功覆盖风险
        - 客户成功嵌在支持职能中；PeerSpot 支持评分强，说明有效性较好
        - 索取销售代表数量、配额达成率和平均 ACV；按 ARR 客群询问客户成功员工数
    sourceRefs:
