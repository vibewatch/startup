  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群细分与买方群体
        blocks:
          - type: paragraph
            body: >
              Devo Technology 的主要买方是大型企业安全运营中心（SOC），平台作为核心 SIEM 和安全分析基础设施部署。SOC 经理或 CISO 是经济买方；SOC
              分析师是主要日常用户；IT/安全采购团队或托管安全服务提供商（MSSP）负责中介渠道购买。Devo 自己的营销把可服务客户描述为需要以云速度处理 PB 级安全分析的全球企业，意味着目标公司规模在 1,000
              名员工以上，通常收入也超过 $500M。

              按垂直行业看，具名和被引用客户覆盖金融服务（OneMain Financial、Manulife、H&R Block、FanDuel、AMEX Global Business Travel、Bitkub
              Exchange）、电信（Telefonica、AT&T）、零售和消费（Ulta Beauty、Sonos）、IT 和专业服务（Unisys、Kforce）、能源和公用事业（新西兰
              Powerco），以及公共部门，包括国防、联邦民事和高等教育（U.S. Air Force、Accenture Federal Services、Ivy Tech Community
              College、Oklahoma University）。另一个独立买方群体是 MSSP，它们使用 Devo 的多租户架构，向终端客户交付托管 SIEM 和共管 SOC
              服务（CyberMaxx、DeepSeas、Talion、Trustwave MXDR）。

              按地域看，Devo 披露的客户群集中在北美，同时在 EMEA 有明显存在，这与 Devo 的西班牙创立根源相吻合（G2 语境中提到 Telefonica、Caixa Bank）；公司也在扩大亚太曝光，包括
              Powerco（新西兰能源）和 Bitkub（泰国加密交易所）部署，以及 Series E 公告中提到为 APAC 客户和合作伙伴上线区域内 AWS 环境。

              Devo 在 cyberse.com 的列表将医疗、零售、金融服务和公共部门识别为有文档记录的目标垂直行业，这与具名客户分布一致。平台既服务直接企业买方，也服务通过 MSSP
              中介的间接买方；考虑到多租户架构投入和 Devo Drive 合作伙伴计划，MSSP 渠道正成为越来越重要的战略细分，但 MSSP 来源收入占总 ARR 的比例未公开披露。
