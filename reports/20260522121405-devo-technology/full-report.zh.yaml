      - number: '3.2'
        title: 定价、打包与商业模式对比
        blocks:
          - type: paragraph
            body: >
              2026 年，SIEM 厂商主要采用三类定价架构：按摄取量计价（每 GB/day
              摄取数据）、按资源计价（每端点、服务器或员工）、按席位/事件速率计价（每秒事件数或每分钟流量）。定价架构会影响规模化后的总成本，并带来实质竞争定位差异。

              Splunk Enterprise Security 按摄取量计价，约为每 GB/day $150–$2,000，具体取决于数据量和档位；SOAR（通过 Phantom）、ITSI、高级连接器等附加模块
              另行收费。大型企业 100 GB/day 合同未计附加模块前每年就可能超过 $500,000。Splunk 也提供基于工作负载的替代定价，按计算消耗收费。谈判合同中，企业平均折扣 20–34% 较常见。截至
              2026 年，Cisco 收购尚未实质简化 Splunk 的定价模型。

              Microsoft Sentinel 按消费量计价，依承诺档位每摄取 GB 为 $2.46–$5.20。100 GB/day 承诺档位价格为 $2.96/GB，在可比数据量下明显低于
              Splunk。Sentinel 还受益于 Microsoft 原生数据源（Azure Active Directory、M365 Defender、Defender for Cloud）对 M365 E5
              订阅者免费摄取，形成事实上的捆绑折扣；对于深度承诺 Microsoft 的企业，这让大部分数据表观 SIEM 成本接近零。

              Google Chronicle（Google Security Operations）采用按员工计价模型，并包含无限数据摄取；对多源环境复杂的大型组织，成本格外可预测。独立研究称，Chronicle
              相较可比的摄取计价 SIEM，可实现 400%+ 三年 ROI 和不到七个月的回本周期。Google 不公布标准标价。

              IBM QRadar SIEM 云订阅按事件速率计价（EPS——每秒事件数，FPM——每分钟流量），企业部署通常每年 $15,000–$250,000。QRadar
              定价不透明、以报价为准，并随部署规模、模块和支持档位大幅变化。

              Securonix 采用席位/用户模型，10 名用户起价约 $4,500/月（$54,000/年），100+ 用户企业环境可升至 $40,000/月。包含上手服务在内，10 名用户首年总投入估计为
              $64,000–$154,000。

              Sumo Logic Cloud SIEM 按摄取量计价，每个档位 $270–$718/月，并提供无限用户访问。Enterprise Security 档位（完整 SIEM）每个数据摄取档位约
              $718/月；基于采购数据，年度合同中位数约为 $85,135。

              Devo 的定价模型是全包式 SaaS：单一、可预测的费用覆盖 SIEM、SOAR、UEBA、无限用户、无限搜索和 400+ 天热数据留存。相比之下，Splunk 的
              SOAR、长期留存和安全内容包都有模块化附加成本。Devo 不公布标价；定价以报价为准，但定位上相较 Splunk 更可预测，且对数据量不敏感。

              Elastic Security 云部署采用分层定价，每资源每月 $95–$175。在大型企业规模下，Elastic 总成本（授权加工程人工）每年可达 $700,000+。Palo Alto Networks
              Cortex XSIAM 采用每端点基础价（$9–$36/endpoint/month），再加每 GB 遥测摄取费用；现有 Palo Alto 平台客户可获得 35–60% 套件折扣。
