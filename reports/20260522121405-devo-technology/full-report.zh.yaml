      - number: '7.5'
        title: 领导层、执行与人员风险
        blocks:
          - type: paragraph
            body: >
              Devo 在约四年内换过三任 CEO，带来实质组织和战略连续性风险。Marc van Zadelhoff 在 2020 年至 2024 年初领导 Devo，并主导 Series E 和 Series F
              融资；他离任后成为 Mimecast CEO。Walter Scott 担任临时 CEO 至 2025 年初。Ken Naumann 于 2025 年 3 月 5 日被任命为正式
              CEO，公告称其为「网络安全行业老兵」，此前曾任 NetWitness CEO。Walter Scott 仍担任董事会执行主席。这是公司自 2020 年以来第三次 CEO
              更替，每次更替都可能带来客户不确定性、销售周期扰动、战略转向，以及领导团队员工流失风险。

              Ken Naumann 曾任 NetWitness CEO，带来网络安全经验，但这不等同于已经验证的规模化阶段上市公司履历。NetWitness 是一家中端市场安全分析公司；Devo 想达到 $100M+
              ARR，并追求 IPO 或大规模 M&A 退出，需要另一套 GTM、财务管理和资本市场能力。董事会给出的任命理由——「战略视野、对客户成功的承诺和运营敏锐度」——尚未通过 Devo 2025 年 3
              月之后的表现得到可观察验证，因为任命后没有公开 ARR 更新或产品公告。

              员工数已从约 769 人峰值（2022 年 12 月）降至约 350 人（按部门合计：Engineering 148、Sales/Support 54、Business Management
              44、Marketing/ Product 34、Operations 19、Finance 19、IT 14、HR 9、Consulting 4、Other 6——按 Unify 2026 年 4 月数据）。约
              350 名员工支撑 $70.6M ARR，Devo 的人均收入约 $200K——处于资本效率较高 SaaS 公司的区间内，但也说明团队偏精简，可能限制同时推进产品开发、联邦扩张、MSSP 渠道增长和 APAC
              扩张的执行能力。

              Q4-2025 SWOT 分析识别了几项组织执行失败：MSSP 伙伴来源收入「未达到激进增长目标」，战略规划周期中渠道重组 OKR 失败。这说明，在前任领导团队下，Devo 的 GTM
              执行没有在一个关键增长项目上达成计划。Ken Naumann 的任命能否重置或加速渠道执行，是后续尽调问题。明确尽调路径：索取当前按职能划分的员工数，并与 Q1 2025 基线对比；询问 Q1 2026 ARR
              和管道转化率；索取 2025 年 3 月和 4 月战略评审的董事会演示材料。

              联合创始人 Pedro Castillo 担任 CTO，是一项领导层资产——他为 HyperStream 架构提供深层技术连续性。不过，多次 CEO 更替常会在技术创始人与 CEO
              战略愿景不同时，引发文化漂移和产品优先级冲突。公开证据无法观察 Castillo 与 Naumann 的一致程度。
