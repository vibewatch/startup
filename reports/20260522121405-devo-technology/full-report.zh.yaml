      - number: '3.4'
        title: 切换成本、渠道动态与分销能力
        blocks:
          - type: paragraph
            body: >
              SIEM 的切换成本在企业软件中属于最高一档，既为 Devo 的存量客户构成竞争护城河，也让它在新销售周期中更难替换现有厂商。

              技术切换成本由四个因素驱动：（1）数据源集成复杂度——企业环境通常有 200–800 个独立日志源，新平台需要逐个连接器配置和测试；（2）检测内容迁移——SIEM 关联规则、行为模型和 UEBA
              基线都绑定厂商，无法直接移植，需要重写并重新调优；（3）历史数据留存——多年索引日志数据跨 SIEM schema 迁移，需要 ETL 转换和合规审查；（4）分析师工作流再培训——SOC
              分析师会积累厂商特定查询语法能力（Splunk SPL、Sentinel KQL、Devo LINQ），这本身就是一项显著的人力资本切换成本。大型企业完整 SIEM 迁移通常需要 8–12 个月并行运行，以及
              $1M+ 集成劳务投入。

              组织层面的切换成本会放大技术壁垒：SIEM 是 SOC 的运营骨干，迁移过程中任何检测覆盖缺口都会带来责任风险。多数企业要求新旧平台双轨运行一段时间，典型大型企业合同因此增加 $200,000–$500,000
              的许可证重叠成本。

              分销与渠道能力偏向最大型现有厂商。Cisco/Splunk 收购后的渠道计划（Cisco 360）把 Splunk 的专业经销商网络并入 Cisco 约 70,000 家组织的全球合作伙伴网络。Microsoft
              Sentinel 受益于 Microsoft Cloud Solution Provider（CSP）计划，也直接纳入 Microsoft 直销团队管理的 Microsoft Enterprise
              Agreements。Google Chronicle 主要通过 Google Cloud Professional Services 和 MSSP 合作伙伴计划分销。

              Devo 的渠道策略强调 MSSP 合作，包括 Trustwave XMDR 以及其他向企业客户白标或转售 Devo 平台的安全服务商。MSSP 渠道对 Devo $70.6M 总 ARR
              的贡献未公开披露，这给评估渠道依赖和利润结构留下尽调缺口。Devo 参与美国联邦渠道，其 FedRAMP Moderate 授权是采购资格要求。

              多归属——同时运行两个 SIEM 平台——在大型企业规模下并不常见，因为成本会重复；但在混合环境中会出现：Microsoft Sentinel 处理 Microsoft 原生数据，第二套
              SIEM（Devo、Splunk 或 Elastic）管理非 Microsoft 数据源。这种模式给 Devo 留出机会：在 Microsoft 占比较高的账户中与 Sentinel 共存，而不必完全替换它。
            claimRefs:
              - CP029
              - CP030
              - CP031
