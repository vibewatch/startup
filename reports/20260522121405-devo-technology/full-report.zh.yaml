      - number: '5.2'
        title: 产品模块、能力与 SKU 图谱
        blocks:
          - type: paragraph
            body: >
              Devo 的产品围绕四个核心能力层组织，并打包进单一平台许可证：Intelligent SIEM 层、SOAR 层、通过 Devo Behavior Analytics 提供的 UEBA 层，以及通过
              DeepTrace 和 ThreatLink 提供的 AI 调查层。第五个集成组件 Devo Exchange 则作为内容市场，加快新部署的价值实现。

              Intelligent SIEM 能力提供实时日志接入、基于 MITRE ATT&CK 框架映射的事件关联、自动富化、流式告警生成，以及跨云、混合和本地环境的持续监控。Activeboards 是 Devo
              自研的可视化分析画布，也是主要调查界面，支持折线图、日历热力图、时间线、Voronoi 图和下钻表格等交互式组件。Activeboards 让分析师能实时调查异常，并把告警关联到底层原始事件。

              SOAR 能力（Devo SOAR）提供无代码处置剧本编写、自动化事件分诊、与第三方安全工具的双向集成，以及案件管理。Devo 声称 SOAR 层通过自动化常规流程，最高可将 SOC 效率提升
              10x；但该数字由公司提出，并未独立验证。Devo SOAR 支持与 ServiceNow 等 ITSM 平台集成，使安全与 IT 运营能够跨职能协作。

              Devo Behavior Analytics（UEBA）使用一套可配置机器学习行为模型库，监测 Devo 数据表中跨用户、设备和域的异常活动。每个模型都会生成行为信号，并给出 0 到 100
              的实体级风险评分，从而主动识别内部威胁、被攻陷账户和横向移动。

              DeepTrace 是自主威胁狩猎与调查模块，基于 Devo 通过 Kognos 收购获得的技术构建（该收购于 2022 年 10 月宣布）。DeepTrace 使用攻击追踪 AI
              自主调查告警，快速围绕数据提出数十万个问题，以重构攻击者时间线。它支持与 MITRE ATT&CK 对齐的威胁狩猎构建，把成功狩猎转化为周期性检测，并提供基于证据的报告。

              ThreatLink 是 Devo 的 AI 驱动告警关联与案件管理引擎。它通过关联和富化，把每天数千条安全告警自动分诊成数十个高保真、可执行案件。这种降噪能力是 PeerSpot
              评论中从业者经常提及的核心收益。Devo Exchange 是一个市场，提供预构建检测规则、调查模板和映射到 MITRE ATT&CK 的威胁狩猎内容。整套产品按单一的、基于每 GB 接入量的定价模型打包，对
              SOAR、UEBA 或 AI 能力不收取额外按功能费用。
