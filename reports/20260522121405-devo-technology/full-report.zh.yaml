  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与 HyperStream 技术
        blocks:
          - type: paragraph
            body: >
              Devo Security Data Platform 是 100% 云原生 SaaS 方案，从底层就为 AWS、Azure 和 GCP 云环境构建。它没有本地部署选项。Devo 的基础架构差异点是
              HyperStream，这是公司自研的流式分析引擎，去掉了传统 SIEM 架构中常见的接入时建索引开销。

              HyperStream 以原始形态处理原始事件数据，不要求在接入点完成索引或规范化。数据通过 Devo Relay
              进入平台；这是客户侧组件，负责给事件打标签、实时压缩，并把加密流转发给平台的事件负载均衡器。负载均衡器解密后将事件分发到数据节点；收集器在节点中以原始、未解析格式存储数据，并按域、日期和 Devo
              标签组织。解析只在查询时发生，从而消除接入时瓶颈，并支持自动横向扩展。

              Devo 声称在 PB 级数据集上可实现亚秒级查询响应，并将其归因于针对安全分析负载优化的 HyperStream
              列式数据模型。这些性能主张由公司提出，并得到第三方评论摘要佐证，但公开资料中没有通过第三方实验室评估独立基准测试。公司官方文档称，每个数据节点每天可接入 2 TB，并支持最高 10x
              接入突增；这些数字更接近营销层面的规格，而非独立验证基准。

              所有接入数据都保持热态——无需归档延迟即可查询——标准留存期为 400 天。这显著超过 Splunk 默认 30–90
              天留存窗口，也是在从业者评论中经常被提及的竞争优势。根据面向公共部门客户的官方产品文档，平台支持数千个并发实时查询。SaaS 交付模式提供自动更新、补丁管理和基础设施扩展，不需要客户自管基础设施。多区域可用性支持
              GDPR 等数据主权要求，原生多租户能力则为企业和 MSSP 客户提供安全的数据隔离。
