  - id: TV002
    title: 投资逻辑与反向逻辑表
    notes: |
      论点基于第 1–7 章证据和新增估值专项研究。置信度反映来源交叉验证质量。反向逻辑有多个独立来源支撑；正向投资逻辑更多依赖公司披露或第三方估算数据。
    claimRefs:
