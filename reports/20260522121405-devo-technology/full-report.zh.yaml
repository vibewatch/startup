  - id: TR005
    title: 缓释措施与止损标准表
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    notes: |
      止损标准定义为客观、可观察的事件，一旦出现就意味着 Devo 的投资逻辑不可逆恶化。监控指标可从公开来源观察，或通过尽调检查点跟踪。行动含义面向正在评估或持有仓位的投资者。
    rows:
      - - 竞争性替代（Gartner MQ / 市场份额）
        - 2026 年 Gartner SIEM MQ 发布；PeerSpot mindshare 季度更新
        - Devo 连续第二年缺席 2026 年 Gartner SIEM MQ；mindshare 跌破 1.0%；ARR 同比增长降至 20% 以下
        - 退出或按完整下行情景重估；连续两个 MQ 周期缺席，说明业务标准持续未达标
      - - 财务跑道 / Down round
        - 公开融资公告；Devo 新闻稿；Tracxn / PitchBook 融资更新
        - 新一轮融资估值低于 $1.0B；现有投资者提供过桥轮且无外部领投；或 CEO 确认现金跑道风险
        - 立即触发尽调；相对 2022 年估值标记折价 50%+ 的 down round，说明投资者重新评估，并可能损害清算瀑布
      - - FedRAMP ATO 失效
        - FedRAMP Marketplace 列示状态；年度评估报告；DLT / TD SYNNEX 采购公告
        - FedRAMP Marketplace 显示 ATO 被撤销或进入整改；12+ 个月没有新的联邦采购中标
        - 联邦收入板块实际归零；政府渠道投资逻辑受到重大损害；声誉冲击严重
      - - MSSP / 大客户流失
        - Trustwave 公开声明；MSSP Alert 新闻；Devo 新闻稿缺席；LinkedIn 上的 MSSP 关系信号
        - Trustwave 或同等级 Top 250 MSSP 公开从 Devo 切换到其他 SIEM 厂商；或 ARR 较峰值下降超过 15%（由收入趋势数据推算）
        - 集中度事件；立即开展客户集中度尽调；重估渠道多元化计划
      - - CEO / CTO 离职
        - LinkedIn 资料变更；新闻稿；董事会公告
        - Ken Naumann 上任 18 个月内离职；或 Pedro Castillo 卸任 CTO
        - 第三次 CEO 更替阈值被触发；投资者信心事件；要求董事会紧急尽调电话会
      - - EU AI Act 执法行动
        - EU DPA 公告；GDPR 执法追踪；Devo 新闻稿
        - 任何 EU 监管机构针对 Devo AI 功能未遵守 EU AI Act 或 NIS2 的执法行动
        - 监管风险落地；存在重大罚款风险；EU 市场准入受威胁；需要立即制定法律补救计划
      - - AWS 可用性 / 宕机重大影响
        - AWS Health Dashboard；Devo Status Page（如公开）；客户社交媒体
        - Devo 平台宕机超过 4 小时并影响多个客户；客户流失归因于可靠性
        - 可靠性投资逻辑破裂；重新评估 SLA 和多云战略；评估客户合同补救
