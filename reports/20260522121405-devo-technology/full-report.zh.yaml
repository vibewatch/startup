      - number: '8.3'
        title: 可比估值分析——公开与私营可比公司
        blocks:
          - type: paragraph
            body: >
              要给 Devo 建立可信估值区间，需要对标三类对象：（a）规模和增速可比的公开网络安全 SaaS 公司；（b）私营 SIEM 及相邻安全分析交易；（c）战略收购先例。

              公开可比公司中，CrowdStrike（CRWD）是行业溢价基准。其 2026 财年（截至 2026 年 1 月）ARR 为 $5.25B，同比增速 24%，交易在约 18–19x NTM
              EV/revenue，non-GAAP 经营利润率 >30%。只有同时做到超大规模增长、强 FCF 和 AI 平台架构的公司，才能触达这一倍数——Devo 没有公开证明任何一项。Palo Alto
              Networks（PANW）收入 $9.2B，交易在约 11x NTM EV/revenue。SentinelOne（S）收入约 $1.0B、增速约 22%，却只交易在约 4x
              EV/revenue，反映出投资人对其规模路径和盈利时间表存疑。Elastic（ESTC）2025 财年收入 $1.483B（+17% YoY），交易在约 4.8x
              EV/revenue，说明即便表现良好的公开安全分析公司，如果缺少明确 AI 平台差异化，也拿不到溢价倍数。

              私营 SIEM / 安全分析交易中，Exabeam（2024 年与 LogRhythm 合并后）估值约 $2.4B，收入约 $167M，隐含约 14x EV/revenue——其规模优势和 Gartner MQ
              领导者位置支撑了溢价。Securonix 估值不确定性很高：追踪机构给出的区间为 $87M 到 $775M。Sumo Logic 于 2023 年被 Francisco Partners 以约 $1.7B
              收购，约为过去十二个月收入（$303M）的 5x。这些先例说明，传统 / 中端 SIEM 供应商退出时通常落在 5–14x 收入倍数，取决于规模和增长画像，而不是 Devo $2B 所隐含的 20–28x。

              2025–2026 年战略 M&A 环境显示，行业整合活跃且交易价值创纪录：Google 以 $32B 收购 Wiz，Palo Alto Networks 以 $25B 收购 CyberArk，2025
              年网络安全 M&A 披露总额达到 $96B（Momentum Cyber）。不过，这些溢价价格流向的是规模化、AI 差异化的平台领导者。对 Devo 这个规模的公司（$70–100M ARR、被 Gartner
              MQ 排除、四年内第三任 CEO）而言，战略收购方兴趣最可能按技术价值定价——意味着 4–10x ARR 的交易价值，即 $280M–$1.0B。

              Devo 基于申报文件的收入确认，仍只有英国子公司年度账目（截至 2024 年 12 月 31 日期间）。没有可用的 US GAAP 申报文件。所有估值工作都基于第三方 ARR
              估计（GetLatka：$70.6M），这些数据缺少审计师验证，也可能与 GAAP 收入不一致。
