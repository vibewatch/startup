      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >
              Devo Technology 自创立以来，六轮机构融资合计超过 $500 million。早期资本来自西班牙背景的 Kibo Ventures 和 Atlantic Bridge，为原 Logtrust
              实体提供种子轮和 Series A 支持。公司美国扩张由 Insight Partners 于 2017 年 9 月领投的 $35 million Series B 资助，随后在 2018 年 6 月完成
              Insight Venture Partners 领投的 $25 million Series C（与 Logtrust 更名为 Devo 同步）。这些早期轮次确立了 Insight Partners
              作为最稳定长期投资人的位置。

              2020 年 9 月，Georgian Partners 领投 $60 million Series D，Bessemer Venture Partners 和 Insight Partners
              跟投，为企业销售扩张提供成长资本。2021 年 10 月，公司完成 TCV 领投的 $250 million Series E，估值 $1.5 billion 并成为独角兽；General Atlantic 和
              Eurazeo 作为新投资方加入现有股东阵营。这仍是 Devo 历史上规模最大的单轮融资。

              最近一轮是 2022 年 6 月由 Eurazeo 领投的 $100 million Series F，投后估值 $2 billion；所有现有投资人参投，ISAI Cap Venture
              作为战略投资人加入。该轮之后，累计融资超过 $500 million。值得注意的是，自 2022 年 6
              月以来，公司没有公开宣布新的机构融资；截至报告日，这一空档已超过三年，带来资本充足性、现金跑道，以及公司是否考虑 IPO 或战略交易的问题。

              Devo $2 billion 估值相对于其 $70.6 million ARR（截至 2024 年末）意味着超过 28x
              的收入估值倍数；按网络安全板块当前公开市场可比公司看，这一溢价倍数可能缺少支撑，说明当前环境下估值可能偏高。
