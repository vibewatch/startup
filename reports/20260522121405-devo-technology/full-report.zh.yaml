  - id: TV005
    title: 投资逻辑破裂与终止触发器表
    notes: |
      终止标准是客观、可观察的事件，表明投资逻辑出现不可逆恶化。监控指标来自公开来源，或可通过尽调检查点取得。行动含义面向正在评估、跟踪或持有 Devo 仓位的投资人。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 估值 <$1B 的降价轮
        - 任何新机构轮投后估值低于 $1B
        - 证实此前估值过高；连锁触发反稀释条款；向买方和客户释放商业承压信号
        - 退出观察；转为回避，除非新资金给出高于优先权瀑布的清晰退出路径
      - - 到 2027 年中仍无新一轮融资或 M&A
        - 自 2026 年 5 月起 24 个月内没有融资或签署收购协议
        - 烧钱耗尽风险变得实质；被迫把困境情景作为主要结果；现金跑道未知
        - 标记为反向情景；就资本充足性直接与投资人沟通
      - - ARR 更新显示 YoY 增长 <20%
        - 2024 年 10 月后 ARR 更新低于 $85M（较 $70.6M 增长 <20%）
        - 证实收入增长放缓；降价轮概率急剧上升；倍数压缩至 3–5x
        - 将估值区间下调至 $210M–$500M；重新评估投资逻辑
      - - 2026 年报告继续排除在 Gartner MQ 之外
        - 连续第二年未进入 Gartner SIEM MQ（2026 年 Q4 发布）
        - 新标客户管线永久受损；企业买方加速默认选择 MQ 领导者
        - 严重；战略 M&A 价值降至技术收购底部；转向回避
      - - 18 个月内第二位 CEO 离任
        - Ken Naumann 在 2026 年 9 月前或 2026 年底前离任
        - 五年四任 CEO = 结构性治理失败；买方尽调红旗；员工流失
        - 转为回避；对多数机构投资人，治理不稳是核心尽调击穿点
      - - FedRAMP ATO 失效或被暂停
        - FedRAMP 持续监控失败，导致 ATO 被暂停
        - 整个联邦收入渠道消失；GSA/SBA 赞助撤回；联邦 ARR 归零
        - 立即触发反向信号；联邦逻辑消失；SAM 和战略价值大幅下降
  - id: TV006
    title: 最终尽调索要清单
    notes: |
      下列八项目前均为未解决缺口。第 1–4 项是阻止任何建设性投资立场的门槛型尽调障碍；第 5–8 项重要但次要。公开来源无法解决这些缺口；全部需要直接接触管理层或投资人。
    claimRefs:
