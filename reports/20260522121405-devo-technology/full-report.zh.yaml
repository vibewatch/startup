  - id: FE001
    title: Devo 平台架构栈
    type: stack
    layout: wide
    summary: |
      Devo Security Data Platform 的分层架构，从数据摄入经 HyperStream 分析到 AI 产品层和分析师界面，展现云原生 SaaS 交付方式。
    data:
      layers:
        - label: 数据来源与摄入
          detail: |
            400+ 个认证连接器；Devo Relay（客户侧压缩、标记、加密）；支持任何数据类型 / 格式；无需预先规范化；REST API 和 Python/TypeScript SDK
        - label: HyperStream 分析引擎
          detail: |
            自研流式分析；列式数据模型；摄入时不建索引；原始数据按域 / 日期 / 标签存储；查询时解析；声称在 PB 级规模下实现亚秒响应
        - label: 数据存储与编排
          detail: |
            400 天常热数据留存；Data Orchestration 路由到 S3/Kinesis；Data Analytics Cloud 支持定制应用开发；多区域支持数据主权（GDPR）
        - label: AI 与检测层
          detail: >
            ThreatLink（告警关联、案件管理）；DeepTrace（自主调查、攻击追踪 AI）；Devo Behavior Analytics UEBA（ML 行为模型、0–100 风险评分）；Devo
            Exchange（MITRE ATT&CK 内容市场）
        - label: SIEM 与 SOAR 能力
          detail: |
            Intelligent SIEM（事件关联、MITRE ATT&CK、流式告警）；Devo SOAR（无代码剧本、案件管理、ServiceNow ITSM 集成）；第三方 SOAR 双向集成选项
        - label: 分析师界面（Activeboards）
          detail: |
            基于浏览器的可视化分析画布；折线图、热力图、时间线、Voronoi 图；实时下钻至原始事件；SOC 单一视图；无原生桌面客户端
        - label: 云交付与合规
          detail: |
            100% SaaS，运行在 AWS/Azure/GCP；面向联邦客户的 AWS GovCloud；FedRAMP Moderate ATO；GDPR 多租户；自动打补丁；无本地部署选项
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE008
  - id: FE002
    title: Devo 平台上的 SOC 分析师工作流
    type: flow
    layout: wide
    summary: |
      SOC 分析师使用 Devo 平台的端到端工作流：从初始数据摄入，到威胁检测、调查、事件响应和案件关闭。
    data:
      nodes:
        - id: ingest
          label: 数据摄入
          detail: 日志源、云 API、端点、网络设备；Devo Relay 负责标记 / 加密；400+ 连接器
        - id: store
          label: HyperStream 存储
          detail: 原始未解析数据存储；400 天常热留存；解析推迟到查询时
        - id: correlate
          label: ThreatLink 关联
          detail: AI 把每天数千个信号关联成数十个高保真案件；威胁情报补充
        - id: alert
          label: 告警 / 案件生成
          detail: 带完整上下文的流式告警；MITRE ATT&CK 映射；Behavior Analytics 风险评分
        - id: investigate
          label: 分析师调查（Activeboards）
          detail: 可视化分析；下钻到原始事件；在 400 天窗口内做历史关联
        - id: deeptrace
          label: DeepTrace 自主狩猎
          detail: AI 追踪攻击路径；重建攻击者时间线；数分钟 / 数秒内生成基于证据的报告
        - id: respond
          label: SOAR 响应
          detail: 触发无代码剧本；创建 ServiceNow 工单；双向工具编排
        - id: close
          label: 案件关闭 / 狩猎转检测
          detail: 事件关闭；成功狩猎转化为 Devo Exchange 中的周期性检测
      edges:
        - from: ingest
          to: store
          label: Relay 转发
        - from: store
          to: correlate
          label: 实时流
        - from: correlate
          to: alert
          label: 高保真案件
        - from: alert
          to: investigate
          label: 分析师复核
        - from: investigate
          to: deeptrace
          label: 触发狩猎
        - from: deeptrace
          to: respond
          label: 攻击确认
        - from: respond
          to: close
          label: 已修复
