      - CV043
      - CV044
      - CV045
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR 与收入轨迹
        - 自 2024 年 10 月以来没有公开 ARR 更新；没有 2025 年 Q1/Q2 或 2026 年数据
        - 所有估值情景的主驱动；轨迹已 7+ 个月不明
        - 管理层：索取截至 2026 年 Q1 的季度 ARR 桥接表和 ACV 瀑布表
      - - 烧钱速度与现金跑道
        - 未披露烧钱速度、OPEX 或 Series F 剩余余额
        - 决定 Devo 能否在不被迫重组的情况下走到可行退出；现金跑道需 >12 个月
        - 管理层 + CFO：索取 12 个月滚动 OPEX 和现金余额报表
      - - 股权结构表与优先股堆叠
        - 优先权悬置总额、清算优先权和反稀释条款未披露
        - 决定普通股和管理层期权在哪个退出价格开始有价值
        - 法务：索取股权结构表摘要，以及 $500M、$750M、$1B 退出情景下的优先权瀑布模型
      - - 经审计财务报表
        - 没有公开的 US GAAP 财务报表；英国子公司账目未合并全球业务
        - ARR 是未经审计的第三方估算；毛利率、EBITDA 和 FCF 未知
        - CFO / 审计师：索取 FY2024 合并经审计利润表和资产负债表
      - - Gartner MQ 重新入选计划
        - Devo 被排除在 2025 年 Gartner SIEM MQ 之外；未公开说明具体业务标准或补救措施
        - 被 MQ 排除是重大商业风险；补救路径决定 2026 年能否重新进入 Gartner MQ
        - CEO / 产品：索取书面 Gartner 重新入选路线图和时间表
      - - 老股交易历史
        - 未披露老股交易；任何公开来源都没有老股定价
        - 老股估值标记可提供低于 $2B 新股轮价格的独立估值数据点
        - 投资者关系：向现有 VC 投资人查询 Series F 后是否有任何老股交易
      - - MSSP 渠道 ARR 与续约率
        - 未披露渠道来源 ARR 与直销 ARR 的拆分；MSSP 失误已有记录但未量化
        - 渠道集中风险；如果 MSSP 渠道在下滑，新增 ARR 管线会出现结构性受损
        - 管理层：索取按渠道（直销、MSSP、联邦、其他）拆分的 ARR，以及按队列拆分的续约率
      - - Series F 后 M&A 活动
        - Kognos 收购（2022）已确认；未披露后续收购；整合成本未披露
        - M&A 支出会减少可用于运营的剩余资本；整合风险消耗管理层带宽
        - CFO：确认 Series F 后 M&A 总支出，以及 Kognos 资产当前整合状态
