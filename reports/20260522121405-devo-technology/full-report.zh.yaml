      - number: '2.3'
        title: 买方、用户、付款方分层与预算归属
        blocks:
          - type: paragraph
            body: >
              SIEM 平台的主要买方是拥有专门安全运营中心的企业首席信息安全官（CISO）或安全副总裁。没有 CISO 的组织中，CTO 或 IT 安全总监通常拥有决策权。SIEM 用户是 SOC 分析师团队；大型企业通常有
              5–50 名分析师，他们每天用平台做威胁检测、调查和事件响应。付款方是 CISO 预算；大型企业（$1B+ 收入）的整体安全工具预算通常每年 $5–25 million。Gartner 预计，2026
              年全球信息安全终端用户支出将超过 $240 billion，比 2025 年增长 12.5%；软件和平台（包括 SIEM）会吃掉安全预算的 40% 以上。

              按组织规模看，Devo 的主要落地点是大型企业（1,000–50,000+ 员工），尤其是金融服务、零售、能源/公用事业和医疗。这些组织数据摄取量最高、多云环境最复杂，SOC
              实践也最成熟。在高端客户中，Global Fortune 500 组织每年可能为 Devo 支付 $2–10 million，是价值最高的账户。安全团队正在成长的中端市场组织（100–999
              名员工）是次级客群，可通过渠道伙伴和 MSSP 触达；这些组织通常缺少足够的 SOC 规模来支撑 Devo 的高端定价，更偏好托管 SIEM 替代方案。

              按垂直行业看，金融服务（BFSI）是最强买方分层，驱动来自 PCI-DSS、SOX 和监管审计要求，这些要求强制全面日志留存和事件关联。医疗组织面临 HIPAA
              合规要求。拥有高吞吐交易数据和欺诈风险的零售及电商组织，很适合 Devo 的 HyperStream 摄取引擎。取得 FedRAMP Moderate 授权后，美国联邦政府机构和国防承包商成为可触达客群；Devo
              在公共部门参考客户中列出 U.S. Air Force 和 Accenture Federal Services。

              预算归属随组织类型变化。企业账户中，安全预算通常是 CISO 拥有、向 CIO 或 CEO 汇报的一项预算科目，SIEM 属于非自由裁量平台支出。联邦账户中，合同官和 IT 项目经理参与采购流程，把销售周期拉长至
              12–18 个月。各分层的主要采用触发点，要么是安全事件（入侵、勒索软件）推动紧急平台替换，要么是 SIEM 厂商产品生命周期终止（如 Splunk 或 IBM
              传统产品退役），要么是合规审计发现需要全面日志覆盖。

              一个值得注意的市场进入动态是：Cisco 2024 年收购 Splunk 正让客户担忧产品路线图和定价连续性，为 Devo 在 Splunk 装机基础中创造替换机会。同样，托管检测与响应分层——例如
              Trustwave 与 Devo 合作推出 XMDR 服务——是一条能带来多年期合同和托管经常性收入特征的渠道。
