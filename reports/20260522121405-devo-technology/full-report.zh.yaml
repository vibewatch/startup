      - number: '7.4'
        title: 产品、可靠性与安全风险
        blocks:
          - type: paragraph
            body: >
              Devo 只采用 AWS 原生架构，这既是产品优势，也是单点故障风险。平台搭建在 AWS 上，并通过 AWS GovCloud 面向联邦客户交付。Azure 和 GCP
              被提及为数据源集成目标，但尚未确认可作为备用计算或存储部署环境。一旦 AWS 某一区域宕机或可用区故障，Devo 客户的 SOC
              运营会被直接影响，包括实时告警、威胁狩猎和案件管理。不同于多云部署，公开资料没有确认可故障转移到 Azure 或 GCP。Devo 的 Trust Center 没有以公开可访问格式披露具体 SLA
              条款、恢复时间目标（RTOs）或历史 uptime 记录。明确尽调路径：索取 SLA 文件、过去 24 个月 uptime 历史，以及 AWS 区域故障转移架构细节。

              PeerSpot 上的从业者评价记录了几类反复出现的产品质量担忧。基于浏览器的界面「在大规模搜索时可能卡死」，在查询性能事关任务成败的高数据量 SOC
              环境中带来可用性风险。多名评价者称日志解析和解析器更新「有问题」，使非标准数据源集成变成摩擦点。一名从业者写道：「它稳定，但不是极其稳定」，反映出客户期待始终在线的系统偶尔会不一致。与核心 SIEM
              功能相比，从业者把 Security Operations 模块形容为「最需要改进的领域」和「还没到位」。

              Devo 基于摄取量的定价模式制造了一个独特价格风险：未解析日志的元数据收费可能导致意外成本超支。PeerSpot
              评价者提到「未解析日志导致成本上升的风险」，这让数据环境复杂或异构的客户必须在尽调中核清。对中端市场或技术成熟度较低的买家来说，这是一条负面的产品市场匹配信号，因为他们可能没有工程能力确保日志解析覆盖完整。

              Devo 生产环境的 ISO 27001 认证和 SOC 2 Type II 鉴证尚未公开确认。这些认证是企业安全供应商的标准采购要求；公开披露缺失会形成竞争缺口。Devo 的 FedRAMP Moderate
              ATO 意味着其安全姿态接受过严格审查，但在商业采购要求中，FedRAMP 不能替代 ISO 27001 或 SOC 2。明确尽调路径：索取最新 SOC 2 Type II 报告；如已持有，索取 ISO
              27001 证书。

              PeerSpot 评价者指出，AI 能力层（ThreatLink、DeepTrace、Devo Behavior Analytics）仍需打磨。2026 年 AI 能力正在成为主要竞争差异化因素（Copilot
              for Security、Splunk AI Assistant）；Devo 在 AI 成熟度上的差距因此构成正在加速的竞争风险。第三方实验室尚未发布对 Devo AI
              检测准确率、误报率或平均检测时间（MTTD）改善的独立基准评估。
