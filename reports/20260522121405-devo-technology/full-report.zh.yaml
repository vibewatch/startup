      - number: '6.2'
        title: 具名客户证明与生产环境证据
        blocks:
          - type: paragraph
            body: >
              Devo 通过官方案例、新闻稿客户名单、MSSP 页面证言等多个渠道披露了一批具名生产客户。证据最强的是三篇客户成功案例：都有具名联系人，也给出了量化结果。

              OneMain Financial 是一家美国消费金融公司，拥有 1,400 家分支机构和 10.3 million 客户。公司从本地部署的 Splunk 迁移到 Devo 后，告警噪声下降
              75%。官方案例把时任网络技术负责人（后来担任技术与工程副总裁）的 Tunde Oni- Daniel 列为具名推荐联系人。Devo 让 OneMain 能把所有业务单元的可见性集中到单一视图中，并提供 24/7
              上手支持。

              Telefonica 是一家跨国电信运营商，业务覆盖 12 个国家，全球约 383 million 客户。公司部署 Devo 做数据分析，用来提升客户体验和留存。合同管理总监表示：「我们很惊讶，Devo
              平台这么快就能投入运营。我们只用了三个月，就从概念走到完整运营部署。」关键收益包括客户流失下降、客服热线来电减少，以及借助实时数据关联提前解决问题。这个案例尤其值得注意，因为它展示了一个非安全场景：Devo
              不是单纯作为 SIEM，而是作为客户分析平台落地。

              Bitkub Exchange 是泰国主要加密货币交易所，也是 Devo 的 APAC 客户。它切换到 Devo 推进 SOC 现代化后，释放了 20% 的员工时间。Devo vs. Splunk 对比页引用了
              Bitkub CSO Attaphon Phakek 的话：「与 Devo 合作后，我们的威胁检测和实时监控有了显著改善。」

              其他生产证据包括：Ulta Beauty（高级工程师 Jeff Schmidt：「Devo 是我们网络安全防线不可或缺的一部分」）、Kforce（安全工程师 John Busch：60–90 天内实现
              ROI，并用许可成本节省多招了一名分析师）、Corsica Technologies（MSSP；SOC 经理 Rebecca Lambert；通过 AWS 使用多租户 Devo），以及 U.S. Air
              Force（公共部门页面证言称该方案「容易上手、负担得起、可扩展」，且优于原有供应商）。Accenture Federal Services 也以 SOC 经理证言出现在公共部门页面，称
              Devo「支撑了我们的企业安全运营中心」。

              Series E 和 Series F 新闻稿把 H&R Block、Manulife、FanDuel、AMEX Global Business Travel、Sonos、AT&T、Unisys
              列为客户，发生在客户数年增长约 100% 的阶段。这些客户只是作为客户参考列名，没有详细案例，也没有具名联系人，证据权重因此受限。新闻稿名单没有披露生产部署和试点之间的区分。
