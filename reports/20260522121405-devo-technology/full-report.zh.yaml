      - number: '8.2'
        title: 融资、估值背景与高估风险
        blocks:
          - type: paragraph
            body: >
              Devo Technology 的融资历史给出清晰轨迹：$5.5 million Seed（2011）、$15 million Series A（2014）、$25 million Series
              B（2017）、$35 million Series C（2019）、估值 $1.5 billion 的 $250 million Series E（2021 年 10 月，TCV 领投），以及估值 $2
              billion 的 $100 million Series F（2022 年 6 月，Eurazeo 领投）。累计融资约 $481–500 million。按 $2B 投后估值和约 $500M
              累计投入计算，企业价值 / 投入资本比约为 4x——在 2022 年市场环境下合理，但随着公开市场倍数压缩，越来越难支撑。

              最关键的估值风险，是缺少验证事件的时间流逝。$2B 标记形成于 2022 年 ZIRP 时代峰值，当时许多品类的公开云 SaaS 倍数曾短暂超过 20x 收入。此后，公开网络安全 SaaS 倍数大幅压缩：Q1
              2026 期间，公开 SaaS 平均 EV/revenue 倍数从约 7x 降至 5.5x，传统 SIEM 玩家交易在 1.7x–5x。以 Devo 的 ARR 规模（估计
              $70–100M），如果没有支撑溢价倍数所需的 FCF 利润率和 AI 原生架构，当前环境下新一轮通常会按 6–10x 远期 ARR 定价。以 8x 中点和 $70.6M ARR 计算，公允价值约
              $565M——较 $2B 标记折价约 72%。

              英国子公司（Devo Technology UK Limited，Companies House 编号 11507870，账目已提交至 2024 年 12 月 31
              日）提供了唯一强制公开的财务披露，但英国实体账目不披露全球合并财务。美国母公司没有公开可得的经审计 GAAP 损益表、资产负债表或现金流量表。这是单一最大的尽调阻碍：burn rate、现金跑道和 Series
              F 剩余余额均未验证。2025–2026 年，私营网络安全 M&A 和融资仍然活跃；在这一环境下，Devo 自 2022 年后没有融资，是关于其能否以 $2B 或更高估值融资的重大反向信号。

              Devo 股份存在通过专业券商实现的二级市场流动性（例如 Notice.co 列有买卖兴趣），但没有公开二级市场定价。在承压或停滞情形下，私营公司股份的老股交易通常较上一轮新股估值折价
              30–60%，这意味着如果发生老股交易，二级清算区间可能约为 $800M–$1.4B。

              股权结构表和优先权包袱没有量化。累计投入资本为 $481–500M，清算优先权很可能为 1x 或以上；任何低于约 $500M 的退出，普通股股东回报都会被严重稀释。如果新一轮定价低于 $1.5B Series E
              和 $2B Series F 标记，down-round 反稀释条款会触发棘轮，进一步引发治理摩擦，并向企业买家释放承压信号。
