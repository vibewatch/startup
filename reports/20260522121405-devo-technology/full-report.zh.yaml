  - id: TR003
    title: 合作伙伴与依赖风险台账
    columns:
      - 依赖
      - 对手方
      - 角色
      - 集中度
      - 失效情景
      - 严重性
      - 缓释措施
      - 剩余敞口
    notes: |
      行按严重性排序。MSSP 合作伙伴收入集中度未披露。AWS 依赖影响所有客户，不分地域。联邦渠道集中度只适用于美国联邦收入板块。
    rows:
      - - AWS 基础设施（主云）
        - Amazon Web Services
        - 计算、存储、网络，以及面向联邦交付的 GovCloud
        - 极高 — 唯一确认的云基础设施提供商
        - AWS 区域或全球宕机会让所有 Devo 客户部署失效；未确认故障切换
        - 严重
        - SLA 和正常运行时间保证由 AWS 基础设施层管理；GovCloud 隔离提供一定保护
        - 高 — 未公开多云故障切换；被 AWS 定价变化锁定
      - - FedRAMP / SBA 赞助
        - U.S. Small Business Administration（作为赞助方）；FedRAMP PMO（作为主管机构）
        - 授权赞助方，帮助进入联邦市场
        - 高 — 失去 ATO 会让 Devo 退出所有联邦采购
        - 持续监控评估未通过导致 ATO 失效；联邦收入流失
        - 高
        - 持续监控合规；专门的 CISO 职能
        - 中 — ATO 状态无法持续独立确认
      - - DLT / TD SYNNEX 公共部门渠道
        - DLT / TD SYNNEX
        - 政府渠道分销，覆盖联邦民用、国防和教育采购
        - 联邦板块为高 — 依赖单一分销商
        - DLT / TD SYNNEX 合同丢失或运营中断，会切断联邦间接销售渠道
        - 联邦板块为高
        - 标准政府分销；FedRAMP ATO 理论上允许机构直接采购，可部分缓释
        - 中 — 未披露联邦采购备用渠道
      - - Trustwave MXDR（MSSP 合作）
        - Trustwave
        - 联合管理 SOC 交付；为终端客户托管并管理 Devo SIEM；大型 MSSP 渠道合作伙伴
        - 高 — 已点名的最大 MSSP 合作伙伴；终端客户数量未披露
        - Trustwave 更换 SIEM 厂商；Devo 失去所有经 Trustwave 触达的终端客户收入
        - 高
        - 预计存在多年期 MSSP 合同；切换成本包括多个终端客户环境重新平台化
        - 高 — 收入贡献未披露；单一 MSSP 合作伙伴占 ARR 的比例未知
      - - 投资者退出时点（Insight Partners、TCV、Eurazeo 等）
        - 2022 年 Series F 轮进入的机构投资者
        - 董事会面临流动性 / 退出压力；高管团队的退出时点利益是否一致
        - 中 — 2022 年同批次有 7 家机构投资者
        - 以低于计划的估值被迫出售；管理层分心；退出前高管团队留任风险
        - 中
        - 董事会治理；管理层股权激励对齐
        - 中 — 2026–2028 年退出窗口抬高战略不确定性
      - - Eurazeo Series F 领投 — 估值标记
        - Eurazeo
        - 以 $2B 估值领投 Series F；为董事会报告和员工股权设定估值标记
        - 中 — 领投方定义底部估值预期
        - 低于 $2B 的 down round 会损害现有期权持有人，并造成投资者激励错位
        - 中
        - 2022 年以来 ARR 强劲增长，为估值提供部分支撑；运营效率在改善
        - 中 — 没有新一轮融资重置估值标记；相对当前上市可比公司，~28x ARR 倍数偏高
