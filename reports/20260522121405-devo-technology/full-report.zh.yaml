      - number: '6.4'
        title: 留存、满意度与 NRR 代理指标
        blocks:
          - type: paragraph
            body: >
              Devo 没有公开披露净留存率（NRR）、总留存率（GRR）、流失率或队列级留存数据。主要 NRR 代理指标来自 swotanalysis.com 的 Q4-2025 Devo SWOT
              分析，其中写道「~120% NRR 说明其对大型企业客户具有深层价值」，并另称「头部队列的净留存率仍强劲，高于 120%」。该来源更像第三方综合分析，而非 Devo 的一手披露；也没有得到 Devo
              具名高管或投资人声明印证。

              收入增长数据提供了间接留存信号。ARR 从 2023 年 12 月的 $37.1M 增至 2024 年 10 月的 $70.6M，约 10 个月增长约 90%。连续两轮融资（Series E 和 Series
              F）都提到客户数约增长 100%，2023 到 2024 年收入增长也同样强劲；这一模式说明，存量客户内部可能有可观净扩张，而不只是新增客户贡献。不过，2024
              年客户数未披露，公开数据无法把扩张收入和新增客户收入拆开。

              Vendr 的采购数据显示，Devo 买家的年度付款中位数为 $131,250，区间约为 $28,000 到
              $200,000。这个区间说明交易规模差异明显，与中端市场和企业买家混合的客户结构一致。该中位数低于大型企业 SIEM 合同的典型水平（通常为七位数），说明 Vendr
              样本可能偏向较小企业或较低数据量部署，而不是 Devo 的 NRR 代理指标最强的顶层企业账户。

              第三方评价平台给出的客户满意度信号偏正面。PeerSpot 显示，95% 的评价者愿意推荐 Devo，平均评分 8.4/10；Splunk 为 8.3/10，推荐率 94%。Gartner Peer
              Insights 在 SIEM 品类覆盖 Devo，并有 84 条评分，但抓取页面时内容受 JavaScript 限制，无法完整索引。PeerSpot
              评价内容突出了几类有利于留存的行为：支持响应快、伙伴心态强、愿意上手协助。反向满意度信号包括入门复杂、浏览器 UI 不稳定，以及多名从业者提到的日志解析摩擦。

              合同期限和续约条款没有公开披露。基于摄取量的定价模式意味着，随着客户数据量增长，支出会自然扩张；只要留存率较高，这就形成了支撑 NRR 超过 100% 的结构性先落地后扩张机制。
