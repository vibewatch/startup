      - number: '6.5'
        title: MSSP 与渠道伙伴依赖
        blocks:
          - type: paragraph
            body: >
              Devo 为 MSSP 客户打造了专门的多租户架构，把由 MSSP 交付的托管 SIEM 定位为主要渠道。Devo for MSSPs 产品页强调几项能力：通过 API
              调用在数秒内配置客户租户、看清全球分布式运营、跨无限租户定制数据访问权限，并满足数据驻留合规要求——这些都直接贴合 MSSP 的运营需求。

              Devo for MSSPs 页面列出的具名 MSSP 伙伴包括 CyberMaxx（联盟伙伴关系高级总监 John Pinkham）、DeepSeas（高级架构师兼创新负责人 Steve Ocepek）和
              Talion（COO Keven Knight）。公司还宣布了与 Trustwave 的重要合作；按 MSSP Alert 口径，Trustwave 是 Top 250 MSSP 和 Top 40 MDR
              提供商。该合作以 Trustwave MXDR Co-Managed SOC for Devo 品牌推出，由 Trustwave 为终端客户托管和管理 Devo SIEM，提供
              SIEM-as-a-service。DLT/TD SYNNEX Public Sector 则担任政府渠道分销伙伴，帮助联邦民用、国防和情报机构采购 Devo。

              Devo Drive Partner Program 提供正式渠道结构，给伙伴开放 Devo 技术、专门支持和培训、联合营销机会，以及有竞争力的利润空间。相较 Splunk 或 Microsoft
              Sentinel 已成型的渠道生态，这个项目仍更年轻。

              一个重要反向信号来自 swotanalysis.com 的 Q4-2025 SWOT。报告写道：「渠道：MSSP 伙伴来源收入未达到激进增长目标」，并把「渠道：用更好的激励和赋能重组 MSSP 项目」列为 OKR
              失败项。这说明，即便 Devo 有专门打造的多租户产品，MSSP 渠道的扩张速度仍慢于计划。该 SWOT 把弱点归纳为「MSSP 和伙伴项目仍处早期，限制了间接 GTM 规模」，并建议大幅扩展 MSSP
              渠道项目。

              Devo 没有公开披露 MSSP 渠道客户与直销企业客户各自贡献的 ARR 占比。MSSP 依赖带来双重集中风险：如果大型 MSSP 伙伴流失（例如 Trustwave），Devo
              会同时失去该渠道的终端客户收入；如果 Devo 的 GTM 成功过度依赖少数 MSSP 伙伴，收入多元化也会受限。
