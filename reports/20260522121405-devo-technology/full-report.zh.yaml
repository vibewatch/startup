        - 高 — GAAP 收入可能与 ARR 存在重大差异；毛利率未知
        - 获取 Devo Technology, Inc. 经审计财务报表；至少获取 US GAAP 管理账
      - - 手头现金和月度消耗率
        - 高 — 缺少现金和消耗，无法精确计算资金续航期
        - 索取当前现金余额、过去 12 个月经营现金流和月度消耗率
      - - 收入结构（订阅 vs. 服务）
        - 中——服务收入会摊薄毛利率，也可能扭曲 ARR 增长质量
        - 要求在审计财务中拆分收入；确认多年期合同与年度合同各自占比
      - - 客户集中度（前 5 / 前 10 ARR）
        - 高——企业 SIEM 客户数量有限，头部客户流失风险集中
        - 获取按客户拆分的 ARR；识别任何占总 ARR >5% 的客户
      - - 客户数与 ACV 分布
        - 中——这是评估市场渗透、流失风险和增购潜力的必要数据
        - 披露当前付费客户数、ACV 分档和队列留存分析
      - - 新一轮融资 / 退出进程状态
        - 高——36 个月融资空窗让资本计划不确定
        - 直接向 CFO 询问融资管线、董事会授权的流动性策略，以及任何进行中的 M&A 进程
  - id: TE001
    title: 产品模块 / 资产矩阵
