  foundingLocation: Cambridge, Massachusetts
  headquarters: Boston, Massachusetts
  productSummary: >
    Devo's core offering is the Devo Security Data Platform — a fully cloud-native SaaS solution combining SIEM,
    SOAR, and UEBA in a single integrated product. Pricing is based on data ingestion volume (GB/day) rather than
    per-seat or per-event models, and all platform capabilities including 400-day hot retention, multi-tenancy for
    MSSP deployments, and an open REST API are included in the base subscription. The HyperStream engine enables
    sub-second query latency at petabyte scale with real-time streaming analytics. Devo also offers SOAR automation
    and AI-driven threat detection through its UEBA module.
  customerFocus: >
    Large enterprise organizations (Fortune 1000) in financial services, retail, energy, government, and healthcare,
    plus managed security service providers (MSSPs) requiring multi-tenant SIEM deployments and federal agencies
    requiring FedRAMP-authorized solutions.
  businessModel: >
    Annual recurring SaaS subscriptions priced on data ingestion volume (GB/day), with all platform capabilities
    included in the base contract. Professional services (deployment, SIEM migration, integration) contribute an
    estimated less than 15% of total revenue. Devo's 100-day free Splunk migration offer is used as a competitive
    displacement motion rather than a primary revenue stream.
  stage: late-stage private
  fundingStatus: >
    $481–500 million raised across six rounds: $5.5M Seed (2011), $15M Series A (2014), $25M Series B (June 2018,
    Insight Partners), $60M Series D (September 2020, Georgian), $250M Series E at $1.5B valuation (October 2021, TCV),
    and $100M Series F at $2B valuation (June 2022, Eurazeo). No new institutional round has been publicly announced
    between June 2022 and May 2026.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO007, CO008, CO021, CO022, CO023, CO024, CO025]
summary:
  headline: >
    Devo has genuine cloud-native SIEM differentiation and strong NRR, but the $2 billion valuation at ~28x ARR is
    materially unsupported by current market comps — a constructive investment stance requires price discovery, an
    updated ARR milestone, or Gartner MQ re-inclusion before the risk-reward is favorable.
