companyProfile:
  summary: >
    Devo Technology is a private, cloud-native security data analytics company headquartered in Boston, Massachusetts,
    offering an integrated Security Data Platform that combines SIEM, SOAR, and UEBA capabilities. The platform is
    powered by its proprietary HyperStream technology, enabling sub-second query speeds across petabyte-scale datasets
    with all-inclusive, ingest-volume-based pricing and 400-day hot data retention. Originally founded in 2011 as
    Logtrust in Cambridge, MA, by a Spanish engineering team and rebranded to Devo in 2018, the company has raised
    approximately $500 million across six institutional rounds at a peak $2 billion post-money valuation (Series F,
    June 2022). As of October 2024, Devo reported $70.6 million in ARR with approximately 90% year-over-year growth
    and greater than 120% net revenue retention. The company serves large enterprise and federal organizations, holds
    FedRAMP Moderate Authorization (January 2024), and appointed Ken Naumann as its third CEO in approximately four
    years in March 2025. No new institutional capital has been publicly announced since the June 2022 Series F, and
    Devo was excluded from the 2025 Gartner SIEM Magic Quadrant on unspecified business criteria.
  foundedDate: "2011-01-01"
  founders:
