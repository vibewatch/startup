  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: performance-validation
      missingEvidence: >
        No independent third-party benchmark validating HyperStream sub-second query performance, per-node
        ingestion throughput (2 TB/day), or 10x burst capacity claims. All figures are company-asserted.
      whyItMatters: >
        Enterprise buyers doing rigorous TCO analysis and competitive evaluation cannot independently verify
        Devo's core performance differentiator without third-party benchmarks. This is the platform's most
        prominent marketing claim.
      diligencePath: >
        Request performance proof-of-concept with customer-provided data volumes; ask Devo to provide any
        IDC or analyst benchmark reports referenced in sales materials or request a live performance
        demonstration at representative enterprise scale.
      relatedQuestionRefs: [QE002, QE025]

    - type: private-evidence-only
      severity: material
      topic: compliance-gaps
      missingEvidence: >
        ISO 27001 certification and SOC 2 Type II attestation for the Devo platform are not publicly
        confirmed as of May 2026.
      whyItMatters: >
        Enterprise buyers in financial services, healthcare, and European markets typically require ISO
        27001 and/or SOC 2 Type II as baseline vendor security requirements. Absence from public
        documentation creates friction in procurement cycles.
      diligencePath: >
        Request current ISO 27001 certificate (including scope and expiration date) and SOC 2 Type II
        report directly from Devo's Trust Center or compliance team. Verify BAA availability for HIPAA.
      relatedQuestionRefs: [QE015, QE023, QE026]

    - type: insufficient-sources
      severity: minor
      topic: developer-signal
      missingEvidence: >
        Devo's public developer ecosystem is limited in scale. No significant Stack Overflow tag traffic,
        active developer forum, or publicly visible ISV marketplace comparable to Splunk's app store
        or Elastic's developer community was identified.
      whyItMatters: >
        Weak developer ecosystem signals limit Devo's ability to attract integrators, ISVs, and technically-
        sophisticated enterprise buyers who rely on community-built tooling and integrations.
      diligencePath: >
        Evaluate the Devo Exchange content marketplace directly (exchange.devo.com was inaccessible during
        fetch); assess the breadth of community-contributed detection content vs. vendor-provided packs.
      relatedQuestionRefs: [QE011, QE028]

    - type: insufficient-sources
      severity: minor
      topic: ueba-validation
      missingEvidence: >
        The breadth and quality of Devo's UEBA behavior model library has not been independently benchmarked
        against dedicated UEBA vendors such as Exabeam or Varonis. False-positive rates are not disclosed.
      whyItMatters: >
        UEBA effectiveness is a key differentiator for insider threat and compromised account detection use
        cases. Buyers cannot assess relative capability without comparative data.
      diligencePath: >
        Request UEBA detection library documentation and any customer-disclosed false-positive rates;
        compare behavior model count and coverage categories vs. Exabeam Fusion UEBA documentation.
      relatedQuestionRefs: [QE021]
