  - id: deployment-integrations-ecosystem
    title: Deployment, Integrations, and Ecosystem
    body: >
      Devo is exclusively a cloud-only SaaS platform with no on-premises deployment option. It is available
      on AWS, Azure, and GCP, with AWS GovCloud support specifically enabled for U.S. federal customers
      following the FedRAMP Moderate ATO. The managed SaaS model delivers automatic patching, updates,
      and infrastructure management, freeing customers from operational overhead.

      The platform supports over 400 certified data source connectors spanning cloud platforms, endpoints,
      network devices, identity systems, and applications. Major certified integrations include AWS
      CloudTrail, Azure Activity Logs, CrowdStrike Falcon, Microsoft Defender, Palo Alto Networks, and
      ServiceNow. A universal ingestion model accepts all data types and formats without rigid schema
      requirements or mandatory normalization at ingest, reducing integration friction.

      Self-service data connectors enable customers and MSSPs to build custom integrations for proprietary
      applications through a REST API. The Devo API supports event ingestion, query execution, alert
      management, and administrative operations, with official SDKs published for Python and TypeScript/
      JavaScript. The DevoInc GitHub organization (github.com/DevoInc) maintains 53+ public repositories
      including the Python SDK (27 stars, updated April 2026), TypeScript Alerts API client, PCAP Crafter
      for network security, and ML Model Manager tools, demonstrating active maintenance with limited
      external contributor engagement compared to Splunk or Elastic ecosystems.

      Integration with the ThreatConnect threat intelligence platform enables bidirectional threat data
      sharing and automated playbook orchestration. Devo SOAR supports third-party SOAR platform
      integration for organizations with established SOAR toolchains.

      Managed service delivery is supported through partnerships with MSSPs. The most prominent documented
      partnership is with Trustwave, which launched "Trustwave MXDR with Co-Managed SOC for Devo" — a
      managed extended detection and response service where Trustwave hosts and manages the Devo SIEM,
      providing 24/7 SOC expert support. The DLT/TD SYNNEX Public Sector channel provides government
      distribution for federal civilian, defense, and intelligence agencies.

      A key practitioner-reported limitation in PeerSpot reviews is that integrations with certain non-
      standard cloud providers and SaaS applications such as Salesforce require additional configuration
      effort. Log parser updates for non-standard sources were cited as a recurring area for improvement.
