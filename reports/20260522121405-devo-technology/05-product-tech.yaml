  - id: product-modules-capabilities
    title: Product Modules, Capabilities, and SKU Map
    body: >
      Devo's product offering is organized around four core capability layers bundled into a single platform
      license: an Intelligent SIEM layer, a SOAR layer, a UEBA layer via Devo Behavior Analytics, and an
      AI investigation layer via DeepTrace and ThreatLink. A fifth integration component, Devo Exchange,
      serves as the content marketplace and accelerates time-to-value for new deployments.

      The Intelligent SIEM capability provides real-time log ingestion, event correlation using MITRE
      ATT&CK framework mappings, automated enrichments, streaming alert generation, and continuous
      monitoring across cloud, hybrid, and on-premises environments. Activeboards, Devo's proprietary
      visual analytics canvas, is the primary investigation interface and supports interactive widgets
      including line charts, calendar heatmaps, timelines, Voronoi diagrams, and drill-down tables.
      Activeboards enable analysts to investigate anomalies and correlate alerts to underlying raw events
      in real time.

      The SOAR capability (Devo SOAR) provides no-code playbook authoring, automated incident triage,
      bidirectional integration with third-party security tools, and case management. Devo claims the SOAR
      layer improves SOC efficiency by up to 10x by automating routine processes, though this figure is
      company-asserted and not independently validated. Devo SOAR supports integration with ITSM platforms
      including ServiceNow, enabling cross-functional collaboration between security and IT operations.

      Devo Behavior Analytics (UEBA) employs a library of configurable machine-learning behavior models
      monitoring Devo data tables for anomalous activity across users, devices, and domains. Each model
      generates behavior signals with entity-level risk scores from 0 to 100, enabling proactive
      identification of insider threats, compromised accounts, and lateral movement.

      DeepTrace, the autonomous threat hunting and investigation module, was built on technology acquired
      through the Kognos acquisition (announced October 2022). DeepTrace uses attack-tracing AI to
      autonomously investigate alerts, rapidly posing hundreds of thousands of questions against the data
      to reconstruct attacker timelines. It supports MITRE ATT&CK-aligned threat hunt construction,
      converts successful hunts to recurring detections, and provides evidence-based reports.

      ThreatLink is Devo's AI-powered alert correlation and case management engine. It automates alert
      triage by correlating and enriching thousands of daily security alerts into tens of high-fidelity
      actionable cases. This signal-to-noise reduction is a key practitioner-cited benefit in PeerSpot
      reviews. Devo Exchange is a marketplace providing pre-built detection rules, investigation templates,
      and threat hunting content mapped to MITRE ATT&CK. The entire suite is bundled under a single
      ingest-based per-GB pricing model with no additional per-feature charges for SOAR, UEBA, or AI
      capabilities.
