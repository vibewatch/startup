  - id: FE002
    title: SOC Analyst Workflow on Devo Platform
    type: flow
    layout: wide
    summary: >
      End-to-end workflow for a SOC analyst using the Devo platform from initial data ingestion through
      threat detection, investigation, and incident response and case closure.
    data:
      nodes:
        - id: ingest
          label: Data Ingest
          detail: Log sources, cloud APIs, endpoints, network devices; Devo Relay tags/encrypts; 400+ connectors
        - id: store
          label: HyperStream Storage
          detail: Raw unparsed data stored; 400-day always-hot retention; parsing deferred to query time
        - id: correlate
          label: ThreatLink Correlation
          detail: AI correlates thousands of daily signals into tens of high-fidelity cases; threat intel enrichment
        - id: alert
          label: Alert / Case Generated
          detail: Streaming alert with full context; MITRE ATT&CK mapping; risk scoring from Behavior Analytics
        - id: investigate
          label: Analyst Investigation (Activeboards)
          detail: Visual analytics; drill-down to raw events; historical correlation over 400-day window
        - id: deeptrace
          label: DeepTrace Autonomous Hunt
          detail: AI traces attack path; reconstructs attacker timeline; evidence-based report in minutes/seconds
