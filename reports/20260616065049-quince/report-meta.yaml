companyProfile:
  summary: >-
    Quince is a San Francisco-based consumer e-commerce platform founded in 2018 by Sid Gupta
    (CEO), Sourabh Mahajan (CTO), and Zunu Mittal (President). The company's Manufacturer-to-Consumer
    (M2C) model eliminates traditional retail intermediaries — sourcing agents, wholesalers, and
    distributors — to offer premium-quality apparel, home textiles, leather goods, accessories, and
    food products at prices it claims are 50–80% below conventional retail. Marketed primarily at
    quince.com and the Quince mobile app, the platform crossed $1 billion in FY2025 top-line revenue
    — confirmed in the company's official Series E press release — and raised a $500 million Series E
    led by ICONIQ in March 2026 at a $10.1 billion post-money valuation. Sacra estimates an
    annualized revenue run-rate approaching $2 billion as of February 2026. Quince reports
    triple-digit year-over-year revenue growth in every fiscal year since launch and serves millions
    of customers, primarily in North America, with Canada as its first international market launched
    in January 2026.
