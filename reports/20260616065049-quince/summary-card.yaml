  topStrengths:
    - >-
      M2C model structurally eliminates wholesale intermediaries, enabling premium-quality goods at prices 50–80% below
      traditional retail and creating a defensible cost architecture that is difficult for conventional retailers to
      replicate.
    - >-
      Confirmed >$1 billion in FY2025 top-line revenue with triple-digit YoY growth every fiscal year since 2018; Sacra
      estimates a ~$2B annualized run-rate as of February 2026, validating real commercial scale at a Series E entry.
    - >-
      Organic and earned media acquisition strategy (influencer-driven, social video, editorial) structurally improves
      CAC payback versus first-generation paid-social DTC brands; Trustpilot rating of 4.8/5 signals strong customer
      satisfaction at scale.
    - >-
      Broad category expansion (apparel → home → luggage → beauty → food → lab-grown diamonds) and January 2026 Canada
      launch demonstrate platform extensibility and incremental TAM without requiring a business-model change.
    - >-
      ICONIQ "tripling down" across Series C, D, and E, anchoring a $500M round at $10.1B, is strong institutional
      validation of the M2C platform thesis.
  topRisks:
    - >-
      Mandel v. Last Brand Inc. class action (NDCA 3:25-cv-09780, eleven plaintiffs, seven states) directly attacks the
      reference-pricing mechanic central to Quince's conversion engine; motion-to-dismiss hearing scheduled July 16,
      2026 is a binary near-term catalyst.
    - >-
      Tariff and import-compliance escalation from the June 2026 White House customs enforcement executive order and
      USTR Section 301 forced-labor actions materially threaten margin on China-, India-, Cambodia-, and
      Mongolia-sourced goods — the primary manufacturing base.
    - >-
      No gross margin, COGS, EBITDA, burn rate, or NRR data is publicly available; the $10.1B valuation rests on growth
      narrative rather than observable unit economics, and the implied 5–10x EV/revenue multiple far exceeds DTC
      public-market comps (Lululemon ~1.3x, REVOLVE ~1x).
    - >-
      Key-person concentration: Sid Gupta is the sole public face of strategy, fundraising, and brand narrative; no
      disclosed succession plan or second-tier executive pipeline.
    - >-
      No disclosed liquidity path (IPO, secondary market, or strategic exit) at a $10.1B valuation; a strategic
      acquisition would require one of a small number of global acquirers, and the IPO window for private consumer
      companies at this scale remains uncertain.
  unresolvedGaps:
    - Audited revenue, gross margin, contribution margin, EBITDA, free cash flow, burn rate, and cash runway.
    - Precise customer count, cohort retention, repeat-purchase rate, and net revenue retention (NRR).
    - >-
      Resolution or materiality quantification of Mandel v. Last Brand Inc. and any additional consumer-protection
      claims across the seven named states.
    - >-
      Supply-chain traceability certification status (UFLPA, CTPAT) and specific exposure to the June 2026 customs
      enforcement executive order.
    - >-
      IPO or liquidity timeline, cap-table seniority, liquidation preferences on >$1.07B raised, and any secondary or
      debt components of the Series E.
