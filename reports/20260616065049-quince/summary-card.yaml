summary:
  headline: >-
    Quince's M2C model and >$1B revenue milestone are genuinely impressive, but the $10.1B Series E implies a 5–10x
    EV/revenue multiple the public record cannot support and active deceptive-pricing litigation adds binary legal risk
    — warranting a track stance until margin data and litigation resolution improve underwriting visibility.
