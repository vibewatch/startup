  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Deceptive Pricing Litigation and Consumer Legal Risk
        blocks:
          - type: paragraph
            body: >-
              The most acute company-specific legal risk is already in court. On November 13, 2025, plaintiff Alexandra
              Mandel filed a class action against Last Brand Inc. (dba Quince) in the U.S. District Court for the
              Northern District of California (Case No. 3:25-cv-09780), alleging that Quince's strikethrough
              "traditional retail" reference pricing and "You save X%" messaging misleads consumers under California's
              False Advertising Law, Unfair Competition Law, and Consumer Legal Remedies Act. Rather than wait for the
              court to rule on an initial motion to dismiss, plaintiffs expanded the complaint in early April 2026,
              adding ten new plaintiffs and extending claims to six additional states—creating a proposed nationwide
              class of consumers who purchased Quince products within four years. Quince filed a fresh motion to dismiss
              on April 2, 2026, arguing on three grounds: no plausible consumer deception under the reasonable-consumer
              standard, no actionable injury because plaintiffs never allege products were worth less than they paid,
              and that multi-state class certification is unsuitable given the patchwork of state consumer-protection
              standards. The hearing is set for July 16, 2026; no merits ruling has been issued as of the run date.
              Berger Montague PC, a lead plaintiffs' firm with $2.4B in 2025 post-trial judgments, is separately
              investigating Quince for deceptive advertising and actively soliciting class members, signaling that the
              litigation exposure may expand beyond the current case. Three parallel suits—Tapestry/Coach (trade dress),
              Williams-Sonoma (false advertising), and Deckers/UGG (trade dress, Quince counter-claimed
              antitrust)—further consume management bandwidth. This cluster of lawsuits distinguishes company-specific
              legal risk from the sector-wide regulatory exposure treated in the next section.
