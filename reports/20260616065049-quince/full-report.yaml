      - number: '8.3'
        title: Comparable Valuation Set
        blocks:
          - type: paragraph
            body: >-
              The comparable set for Quince spans three reference classes: public DTC and apparel companies, private M&A
              transactions, and sector-wide multiple surveys. None of the reference classes produce a multiple that
              supports the current $10.1 billion price on observable financial data.


              Among public companies, REVOLVE Group (RVLV) filed its FY2025 10-K in February 2026 reporting $1.23
              billion in revenue and approximately 53.5% gross margin — a high-quality DTC fashion platform at roughly
              comparable revenue scale to Quince's confirmed FY2025 revenue. REVOLVE's market capitalization as of
              mid-2026 is approximately $800–900 million, implying roughly 0.7–0.8x EV/revenue — a steep discount to
              Quince's private market valuation on comparable top-line revenue. Stitch Fix (SFIX) reported $1.27 billion
              in revenue for the fiscal year ended August 2025 with a 44.4% gross margin; it trades at a deep discount
              to revenue following persistent net losses. Ralph Lauren reported $8.1 billion in FY2025 revenue with a
              14.5% operating margin and 14.6% revenue growth — the strongest operating margin profile in the comp set —
              yet trades at roughly 2x EV/revenue. Lululemon, the perennial DTC premium benchmark, traded down to
              approximately 1.3x EV/revenue in mid-2026 after guidance compression. Inditex (Zara parent) and Fast
              Retailing (Uniqlo parent) provide the largest-scale apparel comparables; both trade at 2–4x EV/EBITDA
              given their vertical integration and scale.


              Among M&A transactions, the Gildan/HanesBrands deal (2025) closed at approximately $4.4 billion enterprise
              value — roughly 1.3x revenue and 8.9x LTM adjusted EBITDA — the textbook multiple for a scaled, low-growth
              basics brand. VF Corporation sold Supreme in 2024 for approximately $1.49 billion in net proceeds,
              implying roughly 2.3x revenue on estimated trailing sales, down sharply from the ~4.2x revenue VF paid in
              2020 at the height of streetwear brand heat. Walmart sold Bonobos in 2023 for approximately $75 million —
              roughly 0.4x revenue — the textbook DTC down-round for a sub-scale, unprofitable direct brand. The
              Tapestry/Capri combination (announced 2023, blocked by regulators in 2024) would have implied roughly 1.5x
              revenue and 8–9x forward EBITDA across the Capri portfolio. Authentic Brands acquired Reebok at
              approximately 1.4x revenue.


              The private market premium argument — that pre-IPO companies command a 20–30% premium above public comps
              for illiquidity tolerance — cannot close a gap of this magnitude. If REVOLVE trades at 0.7x EV/revenue
              publicly and Quince's private market premium is 30%, the implied fair value would be roughly 0.9x revenue,
              or approximately $1.8 billion on $2 billion confirmed revenue. Even applying Lululemon's mid-2026 1.3x
              multiple with a 30% private premium yields a fair-value range of roughly $3.4 billion — approximately
              one-third of the current Series E price on comparable revenue at comparable DTC quality.
            claimRefs:
