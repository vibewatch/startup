        title: Product Platform and Category Architecture
        blocks:
          - type: paragraph
            body: >-
              Quince offers products across ten top-level categories: Women's, Men's, Home, Baby & Kids, Travel, Bags &
              Accessories, Jewelry, Beauty & Wellness, and additional themed verticals (Everyday Steals, The Archive).
              Within these, sub-categories span dresses, tops, outerwear, lounge and activewear for women; linen, denim,
              and suiting for men; bedding, rugs, furniture, bath and kitchen goods for home; and a growing beauty and
              wellness line that includes supplements. Materials are the primary quality signal: Mongolian cashmere,
              European flax linen, Italian leather, washable silk, organic cotton, and OEKO-TEX certified fabrics appear
              consistently across product descriptions. Price positioning is anchored by a "Beyond Compare" table on
              every product detail page that names specific competing products and prices alongside Quince's own. A
              Mongolian cashmere crewneck is priced at $50 against $148 at J.Crew, $178 at Everlane, and $295 from Naked
              Cashmere. Quince Business extends the product surface to B2B customers through corporate gifting,
              white-label manufacturing, interior design, hospitality supply, uniforms, and branded storefronts where
              partners resell at 1.5x–3x Quince retail prices, signaling the width of margin Quince captures before
              partners. The product line is deliberately classic and timeless rather than trend-driven, which reduces
              design overhead and markdown risk.
