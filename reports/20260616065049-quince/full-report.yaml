          - type: callout
            title: Multi-front litigation poses material risk to core marketing strategy
            body: >-
              Quince faces simultaneous litigation from Tapestry (Coach, trade dress), Williams Sonoma (false
              advertising), Deckers/Ugg (trade dress + antitrust counter-claim), and a Northern District of California
              class action (2026) alleging deceptive strikethrough pricing. The class action is the most material risk:
              it directly challenges Quince's product-page price-comparison marketing, which is central to its customer
              acquisition strategy. If courts require modification of this practice, conversion rates and customer
              acquisition economics could deteriorate. Quince declined to comment on the class action. Legal diligence
              should quantify exposure, assess settlement probability, and evaluate the impact of court-ordered
              injunctions on marketing.
