            title: Sacra Revenue Estimate Treated as Plausible Upper Bound
            body: >-
              Sacra estimates Quince reached approximately $2.0 billion annualized revenue by February 2026,
              accelerating from $340 million in 2024. The company's confirmed $1 billion floor and its stated
              triple-digit growth trajectory make the $2B estimate directionally plausible; however, Sacra's estimates
              are derived from secondary signals (web traffic, card spending models) and have not been audited or
              confirmed by the company. All financial models in this chapter use $1B+ as the conservative base and $2B
              as a high-end scenario where explicitly noted.
