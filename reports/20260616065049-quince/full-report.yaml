      - number: '7.3'
        title: Supply Chain, Forced Labor, and Operational Quality Risk
        blocks:
          - type: paragraph
            body: >-
              Quince's M2C model depends on a multi-country factory network that has not disclosed any third-party
              supply-chain audit, forced-labor due-diligence report, or factory certification list as of June 2026. This
              creates a structural traceability gap at precisely the moment the UFLPA and the new customs EO are
              expanding documentation requirements for apparel importers. A Withhold Release Order or UFLPA detention
              applied to a Quince factory partner would freeze inventory in transit with no domestic buffer stock to
              absorb the service disruption; consumer-facing shipment failures would follow immediately. Quality risk is
              moderated by Trustpilot's 4.8/5 "Excellent" rating across thousands of verified reviews, but isolated
              adverse signals—shrinkage, defective zippers, missing items—confirm that manufacturing defects reach
              consumers at a nonzero rate. SmartCustomer's 2.3/5 rating, while based on very limited review volume,
              suggests that unsatisfied customers skew toward severe experiences (e.g., defective jewelry, refund
              denial). Quince's 365-day return policy, while a key retention driver, creates unquantified
              reverse-logistics costs and working-capital requirements that are not separately disclosed. The combined
              effect of factory-to-door shipping, long return windows, and no disclosed quality-assurance infrastructure
              creates operational fragility that tariff disruption or factory compliance issues would rapidly expose.
