      - number: '4.4'
        title: Capital Adequacy, Funding History, and Runway Implications
        blocks:
          - type: paragraph
            body: >-
              Quince has raised approximately $961 million to $1.07 billion in cumulative equity capital across five
              disclosed funding rounds. The chronology, drawing on current-chapter sourcing, runs from a Series A of $50
              million led by Insight Partners (with Founders Fund, Basis Set Ventures, FJ Labs, and 8VC) through a
              Series B of approximately $77 million, a Series C of $120 million in January 2025 co-led by Notable
              Capital and Wellington Management (with DST Global, Basis Set Ventures, and 8VC), a Series D of $200
              million in July 2025 at a $4.5 billion valuation led by ICONIQ Capital, and finally the Series E of $500
              million in March 2026 at a $10.1 billion valuation again led by ICONIQ with participation from Basis Set
              Ventures, Wellington Management, WndrCo, MarcyPen Capital Partners, Baillie Gifford, Notable Capital, and
              DST Global. The post-Series E total raised, at approximately $961–1,070 million, is confirmed by Sacra's
              $1.07 billion figure, which is slightly higher than the sum of disclosed individual rounds and likely
              reflects smaller undisclosed bridging tranches. The Series E proceeds — $500 million — are earmarked for
              continued growth and global expansion of the M2C platform. No monthly burn rate, current cash balance, or
              projected runway has been disclosed. At the revenue trajectory implied by the Sacra $2B annualized
              estimate and assuming a mature DTC gross margin structure, the company's cash needs for operating losses,
              working capital growth, and platform investment would be offset by large gross profit dollars; it is
              plausible that Quince reaches cash-flow breakeven or near-breakeven before needing additional financing,
              but there is no public evidence to confirm this. The DLA Piper advisory role on the Series E is publicly
              confirmed, establishing the transaction's legal infrastructure. The management team has declined to
              comment on IPO plans; the valuation and investor mix (ICONIQ triple-down, Wellington, Baillie Gifford)
              suggest a public-market path may be under evaluation but no timeline has been disclosed.
            claimRefs:
