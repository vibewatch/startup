      - number: '1.4'
        title: Scale, revenue, and growth trajectory
        blocks:
          - type: paragraph
            body: >
              Quince's top-line revenue surpassed $1 billion in 2025, a milestone confirmed in the company's official
              Series E press release and corroborated by WWD, TechCrunch, and Digital Commerce 360. The company reports
              triple-digit year-over-year revenue growth in every fiscal year since founding— a claim that, if sustained
              through 2025, implies revenues roughly doubled or more in each of the five to seven years of commercial
              operation. No precise annual revenue figure beyond ">$1 billion" has been publicly disclosed; gross
              margin, net revenue retention, and burn-rate data are private.


              On the customer side, the Series E press release describes Quince as "a platform that serves millions of
              customers across a broad set of categories." No exact customer count has been made public. The company
              launched with a focused Instagram-driven customer acquisition strategy anchored on the $50 cashmere
              sweater—a single product that created viral awareness and validated the M2C price-quality proposition.
              Repeat purchasing patterns are described by management as the primary trust signal: customers return not
              to a single product but to the system behind how all products are made and priced.


              Customer satisfaction signals are positive. A Trustpilot snapshot from December 2025 shows a 4.8/5 rating
              classified as "Excellent." The BBB maintains a complaint file on Quince.com in San Francisco, consistent
              with the volume of transactions at this scale. Headcount is a gap: the engineering team numbered 17 in
              November 2021 per the company's tech blog; current total headcount across all functions and geographies is
              not publicly disclosed.
            claimRefs:
              - CO025
