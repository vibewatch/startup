      - number: '4.3'
        title: Cost Structure, Working Capital, and Tariff Exposure
        blocks:
          - type: paragraph
            body: >-
              Quince's cost structure is structurally lean relative to traditional retail: no store leases, no wholesale
              distribution margin, no excess seasonal inventory sitting on department-store floors. The company uses
              weekly AI-driven SKU and size-level demand forecasts and small-batch production tests before scaling,
              which compresses inventory cycles to weeks rather than the three-to-six months typical of traditional
              apparel procurement. The factories page confirms direct factory partnerships that include packing and
              transportation, meaning inbound logistics are partially absorbed in the per-unit cost rather than
              separately expensed. Working capital is directionally favorable relative to peers who hold months of
              pre-positioned inventory, but the company's rapid revenue growth ($1B confirmed, ~$2B Sacra estimate)
              implies a substantial and growing working capital base in absolute terms. Import tariffs represent the
              most material macro-level risk to margins. The Federal Reserve FEDS note published April 2026 found that
              tariffs enacted through November 2025 raised core goods PCE prices by 3.1% through February 2026, with
              near-complete pass-through. Yale Budget Lab's tracker shows that apparel imports from China face blended
              duties that have risen materially from pre-2025 levels. Quince sources from China, India, Cambodia,
              Mongolia, Turkey, and Italy; the China and Southeast Asia exposure is directly implicated in current
              tariff regimes. The Tax Foundation estimated that 2026 tariff increases will raise approximately $98
              billion in federal revenues, placing significant pressure on import-dependent DTC retailers. Quince has
              not disclosed how it plans to absorb, pass through, or mitigate tariff costs. Census Bureau trade data
              confirms that US apparel and textile imports declined in early 2026 as tariff effects rippled through
              supply chains. Additionally, Quince faces active product-liability litigation from Tapestry,
              Williams-Sonoma, and a consumer class action alleging deceptive "strikethrough" pricing, creating a
              contingent cost exposure that cannot be modeled from public evidence.
            claimRefs:
