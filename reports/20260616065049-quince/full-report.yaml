      - number: '2.3'
        title: Buyer and Segment Analysis
        blocks:
          - type: paragraph
            body: >
              Quince's commercial model is a classic single-sided B2C transaction: the buyer, user, and payer are
              identical—an individual consumer who discovers, selects, purchases, and uses the product. There is no
              employer intermediary, no benefits administrator, and no corporate buyer in the core consumer channel. The
              exception is Quince's B2B line (Quince Business), which targets corporate gifting, hospitality, and
              branded storefront buyers—a procurement or HR professional holds the budget in that segment.


              Within the core D2C consumer segment, two primary buyer archetypes emerge from the evidence:


              (1) The aspirational downtrader: A consumer who previously purchased from traditional luxury or accessible
              luxury brands such as Coach, Banana Republic, or Burberry entry-level accessories, but has become
              alienated by the sharp price escalation in luxury goods since 2019. Bain documented that the Chanel
              Classic Flap bag nearly doubled in price from approximately $6,000 in 2019 to over $11,000 by 2025, a
              pattern replicated across the industry. This buyer is quality-seeking but increasingly price-disciplined
              and receptive to Quince's transparent value proposition. Demographically, this archetype skews toward
              Millennials (now 47% of the global luxury market) and Gen X.


              (2) The value-seeking premiumizer: A consumer currently purchasing in mass or mid-market retail (Old Navy,
              Target, H&M, Amazon) who is upgrading toward quality-first basics but lacks the budget or willingness to
              pay traditional luxury premiums. This buyer is disproportionately Gen Z, a cohort that PwC (fall 2025
              survey of 4,000 consumers) found is value-conscious in a distinctive way—not purely price-minimizing, but
              seeking emotional and social value at fair prices. NielsenIQ and GfK in collaboration with World Data Lab
              project Gen Z to represent $12 trillion in spending power by 2030. Quince's pricing transparency,
              sustainability narrative, and Instagram-native brand voice align with this cohort's preferences.


              The adoption path for both archetypes typically follows the same pattern: social media discovery
              (Instagram being Quince's primary acquisition channel, where the $50 cashmere sweater went viral),
              followed by a low-risk first purchase (apparel categories are Quince's primary trust-building vectors per
              CFO commentary), followed by category expansion into home goods and accessories as trust accumulates. This
              mirrors the flywheel described by investors: "People are probably buying a lot more T-shirts every year
              than couches. It's a great way to build trust and then reinforce that trust as they try different things"
              (Matt Lippert, Chief Commercial Officer, per WWD March 2026).
            claimRefs:
