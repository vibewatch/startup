  productSummary: >-
    Quince sells premium-quality apparel (cashmere, silk, merino wool), home textiles (bedding, bath), leather goods,
    luggage, beauty products, gourmet food, and lab-grown diamonds through its owned DTC storefront (quince.com) and
    mobile app. A parallel Quince Business channel extends the M2C platform to corporate gifting, hospitality,
    interior-design trade, and white-label manufacturing.
  customerFocus: >-
    Value-conscious North American consumers — primarily female-skewed, income-aware primary buyers — seeking
    premium-quality goods without retail intermediary markups; a secondary B2B channel serves corporate gifting,
    hospitality, interior-design trade, and white-label manufacturing clients.
  businessModel: >-
    DTC e-commerce with M2C sourcing: Quince manufacturers directly through partner factories in China, India, Cambodia,
    and Mongolia, eliminates the wholesale layer, and retails at near-manufacturer cost plus a margin. No physical
    retail, no wholesale distribution. Revenue is recognized gross from product sales, net of estimated returns.
