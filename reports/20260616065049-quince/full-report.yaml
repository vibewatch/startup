    Wellington Management, a $77 million Series B, and a $50 million Series A (Insight Partners, Founders Fund, Basis
    Set, FJ Labs, 8VC). Cumulative disclosed capital exceeds $1.07 billion; pre-Series-A rounds not publicly disclosed.
