      - number: '7.2'
        title: Tariff, Trade Policy, and Import Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              Quince's M2C model directly sources from factories in China, India, Cambodia, Mongolia, Turkey, and Italy,
              concentrating cost-structure exposure in countries with active or escalating US tariff schedules. Yale
              Budget Lab's tariff tracker documents sequential escalation through 2025 and 2026 on apparel and textile
              imports, and the Federal Reserve found these tariffs raised core goods PCE prices by 3.1% through February
              2026 with apparel pass-through specifically identified. Tax Foundation estimates the 2026 tariff increases
              add approximately $98 billion in annual federal revenues—a broad cost uplift that is structurally more
              damaging to an M2C brand than to traditional retailers who embed additional markup cushion. Unlike
              incumbents with domestic inventory buffers, Quince ships factory-to-consumer, meaning tariff-driven cost
              shocks arrive without the mitigation of pre-tariff purchase orders. Three new policy triggers add urgency
              in mid-2026. First, the White House executive order "Strengthening Customs Enforcement" (signed June 3,
              2026) requires importers of record to certify compliance with supply-chain traceability mandates, provide
              manufacturer product identifiers and composition data to CBP within 90 days, and establish "good standing"
              status tied to customs-law compliance history. Second, the USTR initiated Section 301 investigations in
              March 2026 into forced-labor import enforcement failures; proposed actions were published June 2, 2026
              with a comment period closing July 6. Third, CBP enforces the UFLPA rebuttable presumption that goods with
              any Xinjiang supply-chain linkage are banned from US importation absent extensive importer-provided
              documentation. No Quince-specific enforcement action, WRO, or UFLPA Entity List entry has been identified
              as of the run date, making this a live sector-wide exposure rather than confirmed company-specific
              violation.
