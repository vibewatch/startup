      - number: '1.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural M2C cost advantage with $10.1B investor validation
            body: >-
              Quince's Manufacturer-to-Consumer model eliminates five to seven traditional supply chain layers,
              compresses inventory cycles from months to weeks, and uses AI-driven weekly SKU-level forecasting to
              minimize overproduction waste. This structural approach—not pricing alone—has delivered triple- digit
              annual revenue growth to a $1B+ top line while maintaining consumer trust signals (4.8/5 Trustpilot).
              ICONIQ's decision to triple down in the Series E at $10.1B, less than one year after leading the Series D
              at $4.5B, represents the strongest external validation of the platform's operating durability available
              from public sources.
            calloutType: strength
