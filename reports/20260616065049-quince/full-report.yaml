      - number: '5.3'
        title: E-Commerce Platform and Digital Experience
        blocks:
          - type: paragraph
            body: >-
              The Quince storefront at quince.com operates on a modern headless commerce architecture using Gatsby.js
              for the frontend, Algolia for search and product discovery, Contentful as the CMS, and Yotpo for customer
              reviews and ratings. Constructor.io is used for personalization and merchandising. Payments are processed
              through Klarna, Afterpay, Google Pay, and standard credit/debit card processors. Marketing infrastructure
              includes Attentive (SMS), Criteo (retargeting), Google Analytics 4 with Enhanced Ecommerce, and TikTok
              Pixel. These tools are standard among large DTC retailers and represent a well-assembled, commodity stack
              rather than proprietary technical infrastructure. The Quince mobile app is available on Android (package:
              com.lastbrand.quince) with 100,000+ downloads and a 4.7-star rating across 353 reviews as of June 2026,
              updated June 15, 2026. The Android app offers early access to new arrivals, real-time order tracking, and
              exclusive product drops. The iOS app listing (id1512791186) was inaccessible at review time. The
              storefront's "Beyond Compare" architecture functions as a point-of-decision conversion mechanism by
              presenting explicit price-and-spec substitution tables to shoppers already searching for a category,
              aligning more closely with Amazon private-label logic than classic fashion-brand logic.
