      - number: '4.2'
        title: Unit Economics and Gross Margin Estimation
        blocks:
          - type: paragraph
            body: >-
              Quince does not publish gross margin, COGS, or EBITDA. The available evidence for margin estimation comes
              from three sources: the company's own published cost breakdown on the how-it-works page, comparable
              public-company filings, and analyst commentary. The how-it-works page presents a cashmere sweater at $50
              retail against an all-in cost of $39.02, which includes materials/manufacturing, inbound freight and
              handling ($5.35), credit-card fees ($1.40), and import duties ($4.50). Under GAAP, credit-card fees and
              outbound shipping are typically reported below gross profit (as selling expense or fulfillment), meaning
              the economic gross margin on the sweater is likely 30–40% rather than the all-in 22% implied by the
              cost-transparency display. Against the public DTC comparable set, REVOLVE (a DTC fashion platform)
              reported a gross margin of approximately 53.5% on FY2025 revenue of $1.23 billion per its 10-K filed with
              the SEC in February 2026. Stitch Fix (a personal-styling DTC service) reported a gross margin of
              approximately 44.4% on FY2025 revenue of $1.27 billion per its 10-K filed with the SEC in September 2025.
              Tapestry (luxury heritage brand with 86% DTC revenues) reported a gross margin of approximately 75.4% on
              FY2025 revenue of $7.01 billion per its 10-K filed with the SEC in August 2025. Quince operates at lower
              price points than REVOLVE and is not a styling service, placing it below REVOLVE in likely gross margin
              but above Stitch Fix on a comparable basis given its asset-light model and absence of personal-stylist
              overhead. Sacra estimates that Quince's annualized revenue reached approximately $2 billion by February
              2026, up from an estimated $340 million in 2024, representing a sharp acceleration consistent with the
              triple-digit growth narrative. Customer acquisition relies primarily on organic and earned media —
              influencer-driven content, social comparison videos, and search — rather than heavy paid-social spend,
              which structurally improves payback period relative to first-generation DTC brands that concentrated
              acquisition on Meta platforms. The 365-day return window and free shipping create real cost obligations
              that the company has not quantified publicly; industry data suggests DTC fashion return rates of 20–30%,
              and Quince's liberal return policy may be above the midpoint.
            claimRefs:
