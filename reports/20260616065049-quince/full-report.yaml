        - Impairs conversion mechanic; opens multi-state regulatory exposure; raises customer acquisition cost
        - Downgrade to avoid; pricing mechanic is a material revenue driver
      - - Gross margin disclosure below threshold
        - Audited or filed gross margin below 35% at any revenue level ≥$1B
        - Implies M2C economics are not as favorable as structural model suggests; DCF-impossible at low margin
        - Downgrade to avoid; high multiple has no anchor without margin
      - - Revenue growth deceleration
        - FY2026 revenue growth below 30% YoY on confirmed filing
        - Growth premium that justifies any premium multiple has dissipated; multiple compression inevitable
        - Downgrade to avoid; base case becomes bear case
      - - Down-round or flat-round financing
        - Next equity financing at valuation ≤$10.1B without commensurate revenue growth
        - Signal that insider mark is not substantiated by new capital; preference stack overhang grows
        - Downgrade to avoid; signals ceiling on upside
      - - Tariff cost absorption failure
        - Q3 or Q4 2026 disclosed unit economics showing COGS increase >10pp vs prior period
        - M2C model's cost advantage materially eroded; gross margin path blocked
        - Downgrade to track or avoid pending next disclosure
