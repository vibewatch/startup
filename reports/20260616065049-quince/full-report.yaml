        - label: Valuation discipline
          value: 1
        - label: Evidence quality (data completeness)
          value: 2
    approximationNotes: >-
      Scores are qualitative assessments derived from the evidence gathered across all eight report chapters.
      Profitability scored 2 because no margin data is public (not 1 because the M2C model structurally implies
      above-peer gross margin). Valuation scored 1 (most stretched observable comp) because 5–10x EV/revenue exceeds any
      apparel or DTC precedent. Evidence quality scored 2 because absence of audited financials limits conviction.
