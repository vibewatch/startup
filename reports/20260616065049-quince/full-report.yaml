chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >
              Quince is a San Francisco, California-based consumer technology platform incorporated to rebuild retail
              from the infrastructure up. The company's headquarters and primary operations are in San Francisco, with
              an engineering presence in Bengaluru, India and recently established teams in Toronto, Canada and Europe.
              Quince was founded in 2018 (with a minor sourcing discrepancy discussed in the milestones section) and
              launched commercially out of beta in 2020, initially offering Mongolian cashmere sweaters at $50 and
              washable silk dresses at $60—products that directly demonstrated its founding thesis that premium-material
              quality need not carry luxury markups.


              At the core of Quince's operating model is the Manufacturer-to-Consumer (M2C) platform: the company
              partners directly with the same specialist factories that produce for major luxury brands and ships
              products from those factories straight to the consumer. By eliminating sourcing agents, warehousing
              intermediaries, wholesalers, distributors, and physical storefronts, Quince compresses a typical supply
              chain of seven or more steps to two or three. The company publishes its full cost breakdown on each
              product page—materials, crafting, packaging, freight, credit card fees, duties—making its pricing logic
              fully transparent and enabling direct comparison against competitor prices.


              Quince's proprietary M2C operating system is powered by AI-driven demand forecasting at the weekly SKU and
              size level. Rather than placing bulk seasonal orders months in advance (the traditional retail approach),
              Quince tests new products through small-batch orders and scales production based on real demand signals,
              targeting inventory cycles of two to four weeks versus three to six months for conventional retailers.
              This reduces overproduction, minimizes inventory write-offs, and removes the financial and environmental
              inefficiencies historically embedded in retail pricing. The company also operates a B2B business line
              offering corporate gifting, white-label storefronts, interior design services, hospitality solutions,
              branded storefronts, and uniforms.
