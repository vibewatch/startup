      - number: '1.3'
        title: Capital formation, investors, and valuation
        blocks:
          - type: paragraph
            body: >
              Quince has raised at a minimum approximately $700 million in confirmed disclosed rounds. The most recent
              event is a $500 million Series E in March 2026 led by ICONIQ at a $10.1 billion post-money
              valuation—placing Quince in a select cohort of private consumer companies valued at $10 billion or more.
              ICONIQ General Partner Yoonkee Sull cited Quince's "hyperefficient infrastructure" and its ability to
              redesign retail economics, compress cycle times, and reduce waste as the investment rationale. The Series
              E press release noted ICONIQ was "tripling down" on the company following "a year of strong execution."


              ICONIQ also led the most recent prior round: a $200 million Series D in early 2025 at approximately $4.5
              billion valuation. The Series E valuation of $10.1 billion thus represents more than a doubling of
              Quince's valuation in under one year, a step-up rate that reflects both the 2025 revenue milestone and
              investor conviction in the platform's structural operating advantage. Participating Series E investors
              include Basis Set Ventures, Wellington Management, WndrCo, MarcyPen Capital Partners, Ballie Gifford,
              Notable Capital, and DST Global.


              Funding rounds prior to the Series D—including any seed, Series A, Series B, and Series C events—have not
              been publicly disclosed in available sources. The total lifetime capital raised is therefore not confirmed
              beyond a minimum of approximately $700 million across the two most recent rounds. DLA Piper advised Quince
              on the Series E, though that advisory page was rate-limited during this research run. A complete capital
              structure analysis requires cap-table and term-sheet access through the data room.
