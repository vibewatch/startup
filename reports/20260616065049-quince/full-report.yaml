  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >
              Quince operates at the intersection of two distinct but related market spaces: the online D2C premium
              basics and accessible luxury apparel market and the adjacent online premium home goods and home textiles
              market, both predominantly served in North America. Its addressable market is explicitly not the full
              global luxury goods market, the mass fast-fashion market, or brick-and-mortar department store apparel
              retail.


              The included spend boundary covers: (a) online D2C sales of premium-quality everyday essentials made from
              natural or high-quality materials (cashmere, silk, linen, merino wool, organic cotton) at prices 60–80%
              below comparable luxury retail; (b) premium home textiles and bedding sold through direct ecommerce; (c)
              accessories, jewelry, shoes, and beauty and wellness items sold through the same D2C channel at accessible
              luxury price points; and (d) Quince's B2B line (corporate gifting, hospitality, branded storefronts) as a
              secondary revenue stream. Excluded from Quince's practical addressable market are: traditional luxury
              retail sold through department stores or brand boutiques (Saks, Bergdorf, Nordstrom); ultra-luxury and
              heritage luxury houses (Hermès, Chanel, Bottega Veneta); mass fast fashion (Shein, H&M, Zara); off-price
              brick-and-mortar retail (TJX, Marshalls, Ross); and B2B wholesale or private-label channels in which
              Quince is not a principal brand.


              The primary status-quo substitutes that a Quince consumer might otherwise choose are: (1) mid-market D2C
              premium brands such as Everlane, J.Crew, and Naked Cashmere—against which Quince demonstrates a direct
              price advantage of 50–80% on comparable materials (a cashmere sweater priced at $50 at Quince versus $148
              at J.Crew, $178 at Everlane, and $295 at Naked Cashmere per Quince's published cost transparency page);
              (2) traditional department stores (Nordstrom, Macy's, Bloomingdale's) carrying aspirational and
              contemporary brands; (3) luxury entry-level products from mid-tier luxury brands (Coach/Tapestry, Kate
              Spade, Tory Burch, Burberry accessories); and (4) Amazon private label and marketplace for commodity
              basics.


              Quince's key adjacencies—home textiles, home goods, wellness, and beauty—represent natural M2C category
              expansions already underway. The company has publicly disclosed launches in kitchen goods, bedding
              fabrications, cotton bedding, and beauty. Each adjacency is served by a set of D2C incumbents (Boll &
              Branch and Casper Sleep in bedding; Avocado Green in sustainable mattresses) against which Quince's same
              factory-direct pricing advantage applies.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
