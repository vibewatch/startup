              Buyers multi-home trivially across Quince, Everlane, and Naadam within a single seasonal cycle because
              each brand solves a different facet of quality-for-value. This is a structural feature of the market, not
              a temporary phase. The implication for investors is that Quince's path to category dominance runs through
              building genuine switching costs (loyalty features, exclusive factory SKUs, personalization) rather than
              relying on price advantage alone—because price alone does not prevent buyers from supplementing with
