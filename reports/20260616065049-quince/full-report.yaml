            title: Confirmed Revenue Scale and Extraordinary Valuation Step-Up
            body: >-
              Quince confirmed crossing $1 billion in annual revenue in FY2025 — an extraordinary threshold for a
              pure-play DTC brand founded in 2018 — while simultaneously achieving a $10.1 billion post-money valuation
              in March 2026. The 2.2x valuation step-up from $4.5B (July 2025) to $10.1B (March 2026) in under nine
              months, led by the same ICONIQ Capital team "tripling down," represents a high-conviction institutional
              signal on capital efficiency and growth durability.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI027
              - CI028
          - type: callout
            title: Tariff Exposure and Deceptive Pricing Litigation Create Material Unmodeled Costs
            body: >-
              Quince sources from China, India, Cambodia, Mongolia, and Turkey — all subject to material US import
              tariff increases in 2025-2026. The Federal Reserve estimates a 3.1% core goods CPI uplift from tariffs
              through February 2026 with near-full pass-through. Quince has not disclosed how it absorbs or passes on
              tariff cost. Simultaneously, a consumer class action in the Northern District of California alleges that
              Quince's "strikethrough" traditional-retail pricing is fabricated, directly threatening the core
              conversion mechanism on every product page. If the class action prevails or an injunction is granted, the
              pricing architecture that drives conversion would require restructuring.
            calloutType: risk
            claimRefs:
              - CI019
              - CI020
              - CI021
              - CI022
              - CI023
              - CI024
          - type: callout
            title: White-Label Resale Signal Implies Healthy Core Gross Margins
            body: >-
              Quince discloses on its official website that white-label business partners typically resell its products
              at 1.5x–3x Quince retail prices, generating a markup over the DTC price for the partner while Quince
              maintains fulfillment. This economic signal is important: if a reseller can generate margin at 1.5–3x
              Quince retail, Quince's own direct-channel gross margin must be meaningfully positive at the retail price
              it sets — implying that the 22% all-in contribution shown on the how-it-works page understates the true
              accounting gross margin when below-COGS items (outbound shipping, credit-card fees) are properly
              classified.
            calloutType: insight
            claimRefs:
