      - number: '6.3'
        title: Independent customer proof and review quality
        blocks:
          - type: paragraph
            body: >-
              The strongest independent customer proof comes from Trustpilot, which rates quince.com at 4.8 out of 5
              with an Excellent classification based on thousands of consumer reviews. Trustpilot reviewers consistently
              cite fast shipping, responsive customer service recovery, and strong value-for-money as core satisfaction
              drivers. Multiple reviews describe repeat purchasing across product categories, suggesting cross-category
              retention behavior. The adverse signal is meaningful: SmartCustomer (formerly Sitejabber) rates Quince at
              2.3 out of 5 with complaints centered on product defects and order fulfillment failures, including a March
              2026 review describing a defective jewelry item and a difficult returns experience. FindThisBest provides
              an intermediate signal at 3.8 out of 5 overall, with quality at 3.5 out of 5 and returns at 4.2 out of 5.
              The divergence between Trustpilot and SmartCustomer should not be averaged: it reflects different user
              populations, with SmartCustomer attracting disproportionately disappointed customers and Trustpilot
              capturing a broader satisfaction distribution. Editorial reviews from Business Insider, The Good Trade,
              Reader's Digest, and The Quality Edit add category-level nuance. Cashmere and organic cotton draw
              consistent praise across sources. Linen, silk, and leather are variable. Business Insider's two-year test
              of more than 60 items is the most rigorous editorial evidence, identifying specific product-line
              weaknesses. BBB profile and customer review pages were accessible but returned limited extractable static
              content due to JavaScript rendering. The Atlas Heart editorial review was fully inaccessible at time of
              research. The volume and quality of Trustpilot evidence substantially outweighs the SmartCustomer adverse
              signal in absolute terms, but the adverse signal should not be dismissed because it reflects a real
              quality failure rate experienced by a meaningful subset of purchasers.
