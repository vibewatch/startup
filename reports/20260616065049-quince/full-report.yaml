      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Tariff Tailwind Structurally Favors M2C Model
            body: >-
              The 2025–2026 U.S. tariff regime creates an asymmetric advantage for Quince. Traditional retail supply
              chains pass tariff costs through multiple nodes (factory → importer → distributor → retailer), compounding
              the consumer price impact. Quince's factory-direct model eliminates most of those nodes, suggesting its
              effective tariff exposure per consumer dollar is lower than that of intermediary-heavy incumbents. As
              traditional retailers raise prices to recover tariff pass-through costs, Quince's absolute price gap
              versus competitors should widen, reinforcing its core value proposition at precisely the moment consumers
              become most price-sensitive.
            calloutType: strength
            claimRefs:
              - CM031
              - CM034
              - CM035
          - type: callout
            title: Dual Tariff Exposure — Both Sides of the Trade War
            body: >-
              While Quince benefits from tariff-driven competitor price inflation, its own manufacturing base in
              Asia—including factories in China and other high-tariff countries—exposes it to input cost increases on
              its own sourced goods. The net tariff impact on Quince's competitive position depends on the relative size
              of each effect: competitor retail price increases vs. Quince's own landed cost inflation. Quince has not
              publicly disclosed its supply chain geographic breakdown, making the net tariff exposure magnitude a
              material unresolved diligence question.
            calloutType: risk
            claimRefs:
              - CM031
              - CM034
              - CM039
          - type: callout
            title: Deceptive Pricing Lawsuit Threatens Core Value Proposition
            body: >-
              The Northern District of California class action alleging that Quince's strikethrough "traditional retail"
              reference prices were fabricated—rather than reflecting prices actually charged by Quince or any other
              retailer—strikes at the foundation of the company's brand identity: radical price transparency. If
              substantiated, this allegation would undermine the trust that converts first-time buyers into repeat
              customers and that forms the basis of the investor thesis. Quince has declined to comment on the suit.
              This represents a material reputational and financial risk requiring active legal diligence.
            calloutType: risk
            claimRefs:
              - CM040
              - CM039
          - type: callout
            title: Market Sizing Uncertainty Is Unavoidable — Use It as Diligence Signal
            body: >-
              The absence of a publicly available analyst estimate for "accessible luxury D2C apparel online in North
              America" is itself meaningful. It signals that this market boundary—Quince's primary framing for its $10.1
              billion valuation—is not a standard industry category. Investors and analysts cannot directly verify the
              TAM using a third-party market report. The closest available estimates (Grand View Research global
              apparel, Bain global luxury goods) use market boundaries that are orders of magnitude wider than Quince's
              actual addressable opportunity. The triangulated $25–35 billion TAM used here is directionally reasonable
              but requires primary research (customer survey, ecommerce panel data) to validate with investor-grade
              precision.
            calloutType: insight
            claimRefs:
