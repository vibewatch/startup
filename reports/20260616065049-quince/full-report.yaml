            body: >-
              The M2C operating system—two-to-three factory steps versus the industry-standard seven-plus, combined with
              AI demand forecasting that compresses inventory cycles from months to weeks— is operationally difficult to
              replicate at Quince's speed and scale. Eight years of factory relationships, a proprietary demand-signal
