  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross margin
      missingEvidence: >-
        Audited income statement showing gross revenue, COGS, gross profit, and gross margin.
        No proxy or estimate can substitute for the actual filing.
      whyItMatters: >-
        Gross margin is the single most important metric for underwriting a DTC business;
        without it, all valuation multiples and profitability assessments rest on estimates
        with material uncertainty.
      diligencePath: >-
        Request audited financial statements or reviewed management accounts from Quince
        directly under NDA; specifically gross margin by category and channel.
      relatedQuestionRefs:
        - QI003

    - type: private-evidence-only
      severity: blocking
      topic: capital adequacy
      missingEvidence: >-
        Cash balance, monthly net burn rate, and projected runway post-Series E. No public
        signal from any source reviewed.
      whyItMatters: >-
        Burn visibility determines whether Quince needs additional capital before an IPO
        or exit, and whether the $500M Series E is sized appropriately.
      diligencePath: >-
        Request board pack or investor update showing trailing 12-month P&L, cash position,
        and 18-month financial model.
      relatedQuestionRefs:
        - QI012

    - type: missing-source
      severity: material
      topic: tariffs
      missingEvidence: >-
        Quince's own disclosure of how it models, absorbs, or passes through tariff cost
        increases on China and Southeast Asia-sourced goods; no such disclosure found.
      whyItMatters: >-
        Tariff exposure is the most near-term, structurally uncontrollable cost risk;
        sensitivity at 10–25% tariff uplift on 50–70% of COGS from China could compress
        gross margin by 5–15 percentage points.
      diligencePath: >-
        Request sourcing-country breakdown of COGS, tariff modeling from supply-chain team,
        and any existing hedging or supplier-sharing arrangements.
      relatedQuestionRefs:
        - QI010
        - QI018

    - type: private-evidence-only
      severity: material
      topic: customer count
      missingEvidence: >-
        Active customer count, repeat purchase rate, cohort LTV, and customer-level NRR.
        Quince says "millions of customers" but no specific count or retention metric.
      whyItMatters: >-
        Customer cohort economics drive revenue durability and are essential for validating
        the growth rate trajectory at the $2B Sacra estimate level.
      diligencePath: >-
        Request customer cohort analysis: acquisition by year, retention curve, AOV trend,
        category cross-sell rate, and LTV/CAC by channel.
      relatedQuestionRefs:
        - QI025
        - QI027

    - type: missing-source
      severity: material
      topic: litigation
      missingEvidence: >-
        Court docket and complaint details for the consumer class action (N.D. Cal.), the
        Tapestry trade-dress suit, and the Williams-Sonoma suit; specifically damages
        methodology and any injunction sought.
      whyItMatters: >-
        If the class action or Williams-Sonoma suit succeeds with injunctive relief, the
        strikethrough-price architecture on every Quince product page — a core conversion
        mechanism — would require restructuring.
      diligencePath: >-
        Pull PACER dockets for all active matters; review complaints for damages theories
        and any preliminary injunction motions filed.
      relatedQuestionRefs:
        - QI011
        - QI021

    - type: private-evidence-only
      severity: minor
