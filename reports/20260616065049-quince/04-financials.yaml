company:
  name: Quince

chapter:
  number: 4
  title: Financials
  summary: >-
    Quince crossed $1 billion in top-line revenue in FY2025 and raised a $500 million Series E in
    March 2026 at a $10.1 billion post-money valuation, corroborated by the company's own official
    press release and multiple independent news outlets. Sacra, citing direct channel signals,
    estimated annualized revenue approaching $2 billion as of February 2026. The manufacturer-to-consumer
    model structurally eliminates wholesale and retail mark-up layers, implying inferred gross margins
    in the 40–50% range when benchmarked against DTC-comparable public filers (REVOLVE 53.5%, Stitch
    Fix 44.4%, Tapestry 75.4% FY2025), though no Quince income statement is public. A 365-day return
    window, free shipping, and active litigation create material but unquantified cost exposures; tariff
    escalation on apparel imports from China and South and Southeast Asia represents the most actionable
    near-term margin risk.

sections:
  - id: revenue-model
    title: Revenue Model and Monetization Architecture
    body: >-
      Quince operates a direct-to-consumer e-commerce model that it brands as Manufacturer-to-Consumer
      (M2C). The company earns revenue through a single primary channel — its owned storefront at
      quince.com and the Quince mobile app — with no wholesale distribution, no physical retail
      footprint, and no licensing stream of material scale. Products span cashmere and apparel, leather
      goods and accessories, bedding and home textiles, luggage, beauty and wellness, gourmet food, and
      lab-grown diamonds; the company describes apparel as the primary customer-acquisition category
      and higher-AOV segments such as furniture and jewelry as wallet-share expansion vectors. A
      secondary monetization layer, Quince Business, extends the M2C platform to corporate gifting,
      interior-design trade, hospitality, uniforms, private-label manufacturing, and white-label branded
      storefronts, with the company disclosing that white-label resellers typically mark up Quince
      products at 1.5x–3x the retail price — a signal that direct-cost economics leave room for
      downstream margin, and therefore that Quince's own gross margin on the direct channel is likely
      meaningfully above zero even at aggressive retail pricing. Revenue recognition follows standard
      e-commerce practice: gross revenue from product sales, net of estimated returns. The company's
      own product pages show a $50 cashmere sweater with a fully itemized cost breakdown of $39.02
      (materials, freight, credit-card fees, duties), implying a published "what-you-pay-for" margin
      of roughly 22% at the sweater's price point; the 22% figure represents the narrowest possible
      contribution-margin calculation and does not reflect the higher-AOV categories or the exclusion
      of below-COGS fulfillment items. The Series E press release confirmed that FY2025 top-line
      revenue surpassed $1 billion and that the company has achieved triple-digit growth year over
      year every fiscal year since launch.
    claimRefs:
      - CI001
      - CI002
