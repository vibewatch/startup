  - id: unit-economics
    title: Unit Economics and Gross Margin Estimation
    body: >-
      Quince does not publish gross margin, COGS, or EBITDA. The available evidence for margin
      estimation comes from three sources: the company's own published cost breakdown on the
      how-it-works page, comparable public-company filings, and analyst commentary. The how-it-works
      page presents a cashmere sweater at $50 retail against an all-in cost of $39.02, which includes
      materials/manufacturing, inbound freight and handling ($5.35), credit-card fees ($1.40), and
      import duties ($4.50). Under GAAP, credit-card fees and outbound shipping are typically reported
      below gross profit (as selling expense or fulfillment), meaning the economic gross margin on the
      sweater is likely 30–40% rather than the all-in 22% implied by the cost-transparency display.
      Against the public DTC comparable set, REVOLVE (a DTC fashion platform) reported a gross margin
      of approximately 53.5% on FY2025 revenue of $1.23 billion per its 10-K filed with the SEC in
      February 2026. Stitch Fix (a personal-styling DTC service) reported a gross margin of
      approximately 44.4% on FY2025 revenue of $1.27 billion per its 10-K filed with the SEC in
      September 2025. Tapestry (luxury heritage brand with 86% DTC revenues) reported a gross margin
      of approximately 75.4% on FY2025 revenue of $7.01 billion per its 10-K filed with the SEC in
      August 2025. Quince operates at lower price points than REVOLVE and is not a styling service,
      placing it below REVOLVE in likely gross margin but above Stitch Fix on a comparable basis given
      its asset-light model and absence of personal-stylist overhead. Sacra estimates that Quince's
      annualized revenue reached approximately $2 billion by February 2026, up from an estimated $340
      million in 2024, representing a sharp acceleration consistent with the triple-digit growth
      narrative. Customer acquisition relies primarily on organic and earned media — influencer-driven
      content, social comparison videos, and search — rather than heavy paid-social spend, which
      structurally improves payback period relative to first-generation DTC brands that concentrated
      acquisition on Meta platforms. The 365-day return window and free shipping create real cost
      obligations that the company has not quantified publicly; industry data suggests DTC fashion
      return rates of 20–30%, and Quince's liberal return policy may be above the midpoint.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
    tableRefs:
      - TI003
    figureRefs:
      - FI002

  - id: cost-structure
    title: Cost Structure, Working Capital, and Tariff Exposure
    body: >-
      Quince's cost structure is structurally lean relative to traditional retail: no store leases,
      no wholesale distribution margin, no excess seasonal inventory sitting on department-store
      floors. The company uses weekly AI-driven SKU and size-level demand forecasts and small-batch
      production tests before scaling, which compresses inventory cycles to weeks rather than the
      three-to-six months typical of traditional apparel procurement. The factories page confirms
      direct factory partnerships that include packing and transportation, meaning inbound logistics
      are partially absorbed in the per-unit cost rather than separately expensed. Working capital
      is directionally favorable relative to peers who hold months of pre-positioned inventory, but
      the company's rapid revenue growth ($1B confirmed, ~$2B Sacra estimate) implies a substantial
      and growing working capital base in absolute terms. Import tariffs represent the most material
      macro-level risk to margins. The Federal Reserve FEDS note published April 2026 found that
      tariffs enacted through November 2025 raised core goods PCE prices by 3.1% through February
      2026, with near-complete pass-through. Yale Budget Lab's tracker shows that apparel imports
      from China face blended duties that have risen materially from pre-2025 levels. Quince sources
      from China, India, Cambodia, Mongolia, Turkey, and Italy; the China and Southeast Asia exposure
      is directly implicated in current tariff regimes. The Tax Foundation estimated that 2026 tariff
      increases will raise approximately $98 billion in federal revenues, placing significant pressure
      on import-dependent DTC retailers. Quince has not disclosed how it plans to absorb, pass through,
      or mitigate tariff costs. Census Bureau trade data confirms that US apparel and textile imports
      declined in early 2026 as tariff effects rippled through supply chains. Additionally, Quince
      faces active product-liability litigation from Tapestry, Williams-Sonoma, and a consumer class
      action alleging deceptive "strikethrough" pricing, creating a contingent cost exposure that
      cannot be modeled from public evidence.
    claimRefs:
      - CI016
      - CI017
      - CI018
      - CI019
