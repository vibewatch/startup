  - id: scenario-analysis
    title: Scenario Analysis and Return Logic
    body: >-
      The bear, base, and bull cases for Quince are bounded by three primary variables: the
      revenue growth trajectory, the emergence (or absence) of demonstrated profitability, and
      the multiple at which a liquidity event is achievable.


      In the bear case, revenue growth decelerates sharply to 30–50% year-over-year as the de minimis
      tailwind fades, international expansion capital dilutes unit economics, and the Mandel class
      action or Williams Sonoma litigation forces a material change to the strikethrough pricing
      mechanic that drives a significant portion of consumer conversion. FY2026 revenue reaches
      approximately $2.5–3.0 billion but profitability remains absent. Tariff escalation from
      the June 2026 executive order increases COGS structurally, compressing contribution margin.
      At a 1.5x EV/revenue exit multiple (consistent with the lower end of the DTC premium range),
      a $2.5 billion revenue company would be worth roughly $3.75 billion — significantly below
      the $10.1 billion Series E price. The preference stack from $1.07 billion raised would absorb
      most of the proceeds before common shareholders benefit.


      In the base case, Quince grows revenue at 50–70% year-over-year, reaching approximately
      $3.0–3.5 billion in FY2026, and begins to demonstrate positive gross margin trajectory
      and some visibility into EBITDA. An IPO in 2028 or strategic secondary in 2027 prices the
      company at 2.5x revenue (the midpoint of the DTC premium range) — implying an exit value
      of roughly $7.5–8.75 billion. This is below the Series E entry price, meaning Series E
      investors would face a modest mark-to-market loss unless operating leverage materializes.


      In the bull case, the Sacra $2 billion run-rate estimate is directionally correct, growth
      continues at 80–100%+ into FY2026 (revenues reaching $3.5–4.0 billion), profitability
      emerges (EBITDA margins of 5–10%), international expansion via Canada and Europe scales
      efficiently, and Quince achieves a 2026 or 2027 IPO at a 3x+ EV/revenue multiple. This
      would value the company at $10.5–12 billion — roughly at or above the Series E price —
      representing a fair return for the risk taken. The bull case requires flawless execution
      across several simultaneous dimensions, which is an ambitious assumption for a company
      that has never reported a profitable quarter publicly.


      Cross-cutting all three scenarios: the absence of profitability data is the single largest
      barrier to conviction. A company growing at triple-digit rates with confirmed $1B+ revenue
      and a clear structural cost advantage (M2C) should be able to demonstrate gross margin
      expansion; the fact that Quince has not disclosed any margin data despite being at a $10.1B
      price creates a material information gap for any scenario that requires a profitability thesis.
