  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: profitability data
      missingEvidence: >-
        Audited or confirmed gross margin, EBITDA, or net income for any fiscal period; ideally a
        data room or S-1 equivalent disclosure with full income statement.
      whyItMatters: >-
        Without margin data, the valuation analysis is confined to revenue multiples only. A DCF or
        earnings-based framework cannot be constructed. The structural M2C advantage implies favorable
        margins, but the magnitude is unconfirmed — a company with a 15% gross margin and a 10x
        revenue multiple would be valued at hundreds of times earnings, rendering the price indefensible.
      diligencePath: >-
        Request income statement or gross margin disclosure in company data room; if pursuing IPO,
        file S-1 and review Section 7 (MD&A) for gross margin, COGS, and operating leverage metrics.
      relatedQuestionRefs: [QV005, QV016]

    - type: private-evidence-only
      severity: blocking
      topic: cap table and preference waterfall
      missingEvidence: >-
        Detailed cap table showing Series A–E liquidation preferences, participation rights, anti-dilution
        terms, founder share classes, and secondary-share positions with applicable rights.
      whyItMatters: >-
        A $1.07 billion-plus preference stack could absorb the majority of proceeds at a $7–8 billion
        exit, leaving common shareholders with minimal value. The preference overhang must be modeled
        to assess the real return profile for common or secondary holders at any exit price.
      diligencePath: >-
        Obtain cap table from company legal; request ROFR and co-sale agreement details; model waterfall
        at bear, base, and bull exit valuations.
      relatedQuestionRefs: [QV006, QV024]

    - type: missing-source
      severity: material
      topic: Sacra revenue estimate corroboration
      missingEvidence: >-
        Independent corroboration of Sacra's $2 billion February 2026 annualized revenue estimate
        from at least one additional source (consumer transaction data provider, e.g., Bloomberg Second
        Measure, or a separate analyst note).
      whyItMatters: >-
        The 5.1x EV/revenue multiple depends entirely on accepting the $2 billion Sacra estimate.
        If confirmed revenue is closer to $1.2–1.5 billion, the implied multiple rises to 6.7–8.4x,
        making the valuation even harder to defend at any observable comp.
      diligencePath: >-
        Subscribe to Bloomberg Second Measure or Earnest Research for Quince consumer transaction
        panel data; cross-reference with Quince's stated $1B+ figure and quarterly seasonality.
      relatedQuestionRefs: [QV004]
      relatedTableRefs: [TV004]

    - type: stale
      severity: material
      topic: litigation status and reserve estimates
      missingEvidence: >-
        Current status of Mandel v. Last Brand (3:25-cv-09780), Williams Sonoma suit, and Tapestry
        suit as of June 2026; legal reserve estimates or settlement discussions if any.
      whyItMatters: >-
        The Mandel class action attacks the strikethrough pricing mechanic that drives consumer
        conversion. An adverse ruling could impair revenue growth assumptions that underpin the bull
        and base scenarios. The magnitude of exposure is unquantified.
      diligencePath: >-
        Monitor PACER and CourtListener for docket updates; obtain litigation counsel report from
        company; check NDCA scheduling orders for trial dates.
      relatedQuestionRefs: [QV029, QV034]

    - type: private-evidence-only
      severity: material
      topic: tariff cost exposure quantification
      missingEvidence: >-
        COGS breakdown by sourcing country, current effective tariff rates post-June 2026 executive
        order, and any hedging or price pass-through mechanisms Quince is applying.
      whyItMatters: >-
        Tariff escalation on apparel sourced from China, India, and Cambodia is the most actionable
        near-term margin risk. If COGS increases 10+ percentage points due to new tariff rates, the
        implied gross margin falls further, making any premium multiple even harder to justify.
      diligencePath: >-
        Request sourcing country mix and landed cost breakdown in data room; compare against SEC-filed
        risk factors from REVOLVE and Ralph Lauren for quantification approach; review USTR Section 301
        tariff schedule for affected product codes.
      relatedQuestionRefs: [QV025]

