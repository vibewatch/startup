chapter:
  number: 8
  title: Valuation
  summary: >-
    Quince's March 2026 Series E priced the company at $10.1 billion on confirmed FY2025 revenue of
    more than $1 billion and a Sacra-estimated $2 billion annualized run-rate as of February 2026,
    implying a 5.1x EV/revenue multiple on the run-rate and a 10x multiple on confirmed annual
    revenue — both well above the 2–3x EV/revenue ceiling for high-DTC outperformers identified
    across 2026 banker fairness-opinion comp sets and Damodaran's 1.59x EV/sales apparel median.
    Triple-digit compound annual growth is genuinely exceptional and partially justifies a premium,
    but the gap between the implied multiple and any observable public or M&A comparable is too wide
    to bridge without confirmed profitability data, resolved litigation, and evidence that the run-rate
    is durable. The recommendation is **track**: outstanding business quality at an expensive price.

sections:
  - id: financing-context
    title: Financing Context and Entry Discipline
    body: >-
      Quince closed its $500 million Series E in March 2026, resulting in a $10.1 billion post-money
      valuation. The round was led by ICONIQ — which had also led the Series D — with participation
      from Basis Set Ventures, Wellington Management, WndrCo, MarcyPen Capital Partners, Baillie
      Gifford, Notable Capital, and DST Global. ICONIQ's General Partner characterized the investment
      as "tripling down" on Quince, signaling a high-conviction institutional anchor. Total disclosed
      capital raised across all rounds exceeds $1.07 billion, comprising a $50 million Series A (Insight
      Partners, Founders Fund, Basis Set, FJ Labs, 8VC), a $77 million Series B, a $120 million Series C
      co-led by Notable Capital and Wellington Management, the Series D at approximately $200 million
      at a $4.5 billion valuation (2025), and the Series E. The $4.5 billion-to-$10.1 billion step-up
      in less than twelve months — more than a 2.2x increase — is an accelerated pace uncommon even for
      high-growth consumer companies and warrants scrutiny of the new-round pricing process.


      The entry price matters because the preference stack is now substantial. With more than $1.07
      billion raised and a $500 million tranche landing in March 2026, any common-share or secondary
      holder carries significant senior liquidity preferences in front of them. The company's official
      press release states the proceeds will support "continued growth and global expansion of Quince's
      proprietary Manufacturer-to-Consumer (M2C) operating system," but the specific capital deployment
      plan — whether international infrastructure, technology investment, or marketing — is not
      publicly itemized. Entry discipline at the Series E level requires conviction that the $10.1
      billion price is supported by observable evidence; this chapter finds that it currently is not
      at standard multiples, though the growth rate partially compensates.


      No term sheet, cap table detail, or liquidation preference waterfall is publicly disclosed.
      Quince remains a private company with no obligation to file financials. The most recent
      independent revenue estimate (Sacra, February 2026) suggests a $2 billion annualized run-rate,
      but this is a third-party estimate, not a filed or audited figure. The gap between the
      confirmed "$1 billion in top-line revenue" reported by the company in its Series E press release
      and the Sacra run-rate estimate highlights an information asymmetry that is normal for private
      companies but material for an investor calibrating price.
