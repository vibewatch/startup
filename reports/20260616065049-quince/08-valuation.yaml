callouts:
  - calloutType: insight
    title: Valuation Premium Cannot Be Explained by Comparable Set
    body: >-
      Even using Sacra's $2 billion run-rate — an unaudited third-party estimate — the $10.1 billion
      Series E implies a 5.1x EV/revenue multiple. No observable public apparel or DTC company, and
      no closed M&A transaction in the 2022–2026 record, clears 3x EV/revenue except at peak brand-heat
      conditions (VF/Supreme in 2020 at 4.2x, since corrected to 2.3x). A premium of this magnitude
      can only be justified prospectively by assuming Quince's growth rate continues and profitability
      emerges — two unverified conditions at the time of the Series E close.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV009
      - CV015

  - calloutType: risk
    title: Litigation Creates Unquantified Contingent Liability
    body: >-
      The Mandel v. Last Brand Inc. class action (3:25-cv-09780, N.D. Cal.) and the Williams Sonoma
      false advertising suit both attack business model mechanics — reference pricing and marketing
      claims — that are central to Quince's consumer conversion and brand positioning. An adverse
      ruling in either case could force operational changes that raise customer acquisition costs
      or reduce conversion rates, directly impairing the revenue growth assumption that is the
      primary justification for the premium multiple. Neither contingent liability is quantified
      in any public disclosure.
    claimRefs:
      - CV024
      - CV025

  - calloutType: assumption
    title: Bear Case Remains Plausible at Current Conditions
    body: >-
      A bear-case scenario in which Quince's valuation is marked to $3.0–3.75 billion at a future
      liquidity event — representing a 63–70% decline from Series E — is not a tail risk. It is
      the base case if revenue growth decelerates to 30–50% and the company fails to demonstrate
      profitability before its next financing round. At a $3–4 billion exit, the $1.07 billion
      preference stack absorbs a majority of proceeds, leaving common shareholders with minimal
      value. The DTC down-round precedents (Bonobos at 0.4x, Allbirds IPO to delisting) confirm
      that this trajectory is common for high-growth DTC brands that fail to translate growth
      into sustainable unit economics.
    claimRefs:
      - CV016
      - CV023
      - CV039
      - CV040

