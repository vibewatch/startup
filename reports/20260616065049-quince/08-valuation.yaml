  - id: revenue-multiple
    title: Revenue Baseline and Multiple Mechanics
    body: >-
      The central valuation tension for Quince is straightforward: the $10.1 billion price implies
      a very wide range of implied multiples depending on which revenue figure is accepted. Against
      the company's own confirmed statement — FY2025 top-line revenue exceeded $1 billion — the
      implied EV/revenue multiple is approximately 10.1x. Against Sacra's $2 billion annualized
      run-rate estimate as of February 2026, the multiple is approximately 5.1x. Neither figure is
      defensible by reference to public apparel or DTC comparables.


      For context, Damodaran's January 2026 dataset of 35 publicly traded apparel firms shows a
      median EV/sales multiple of 1.59x and a median net margin of 3.85%. Equidam's 2026 dataset
      shows apparel and accessories retailers at 0.38–1.49x revenue and apparel and accessories
      broadly at 0.74–2.31x. Eightx's 2026 analysis of apparel M&A and trading multiples — drawn
      from SEC proxy fairness opinions — identifies a high-DTC, high-growth performance ceiling of
      2–3x EV/revenue and a mainstream apparel range of 1.0–1.8x. Lululemon, arguably the most
      premium DTC-heritage apparel brand trading publicly, carries an approximately 1.3x EV/revenue
      multiple in mid-2026 after multiple compression driven by softer guidance and tariff exposure.
      These reference points establish that even the most generous observable comparable supports
      roughly 3x EV/revenue for a fast-growing, high-DTC brand — implying that at a 3x multiple,
      Quince's $10.1 billion valuation would require confirmed revenue of approximately $3.4 billion,
      a figure not yet in evidence.


      Quince's triple-digit compound annual revenue growth — every fiscal year since its 2020 launch
      — is the strongest basis for a forward-year premium. If the Sacra $2 billion run-rate is
      accurate and growth continues at 60–80% in calendar 2026 (a sharp deceleration from recent
      pace but still exceptional), FY2026 revenue could approach $3.0–3.5 billion. At that level
      and a 3x EV/revenue multiple, the $10.1 billion would be roughly fair. The problem is that
      this requires believing a third-party estimate of current run-rate, projecting continued
      deceleration-but-still-exceptional growth for another twelve months, and applying a 3x multiple
      that itself represents the top of the observable DTC premium range. Any one of those assumptions
      could be wrong; all three must hold simultaneously to arrive at fair value. The absence of
      audited profitability metrics — no disclosed gross margin, EBITDA, or net income — removes the
      ability to apply a DCF or earnings-based framework and forces reliance entirely on revenue
      multiples, where Quince sits at the expensive end of any reasonable range.
