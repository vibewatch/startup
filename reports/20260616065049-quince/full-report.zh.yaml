      - number: '8.5'
        title: 投资建议与尽调路径
        blocks:
          - type: paragraph
            body: >-
              建议为 **跟踪**，估值判断为 **昂贵**。按增长率、结构性成本优势和品牌质量看，Quince 确实是一家异常优秀的公司。自上线以来每年三位数 YoY 收入增长、已确认的 $1 billion FY2025
              收入里程碑、能够吸引数百万客户复购的连贯 M2C 模式，以及由高质量机构投资者（ICONIQ）领投的 $500 million 融资，都说明底层 franchise 很强。但业务质量再强，也不能替代价格纪律。


              在 $10.1 billion 估值下，取决于采用哪个收入基线，Quince 隐含 5–10x EV/revenue 倍数；这两个数字都无法被标准 DTC 或服装倍数支撑。倍数压缩风险实质存在：Lululemon
              曾是 5x+ EV/revenue 公司，现在因指引转弱交易在 1.3x；VF/Supreme 四年内倍数下降 45%；Bonobos 以 0.4x revenue 出售。公司确实有一条长进估值的可信路径——在
              3x 倍数下，需要约 $3.4+ billion 已确认收入——但这条路要求所有战线同时兑现，并确认当前缺失的盈利能力。建议密切跟踪；若 IPO S-1 确认 $2B+ 收入和正向毛利率轨迹，或二级交易按
              2.5x EV/revenue 及以下的隐含价格提供敞口，再重新评估。


              关键击穿论点触发点包括：（1）Mandel 集体诉讼出现不利裁定，迫使移除删除线定价并损害转化机制；（2）披露毛利率低于 35%，说明 M2C 经济性不如模型暗示的那样有利；（3）下一轮融资出现
              down-round 或 flat-round；（4）收入增长同比降至 30% 以下，意味着支撑任何溢价倍数的增长溢价已经消散。任一触发点出现，建议都应转为回避。
