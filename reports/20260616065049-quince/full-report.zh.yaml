      - number: '6.3'
        title: 独立客户证明与评论质量
        blocks:
          - type: paragraph
            body: >-
              最强的独立客户证明来自 Trustpilot：quince.com 评分 4.8/5，并基于数千条消费者评论获得 Excellent 分类。Trustpilot
              评论者持续提到快速配送、积极的客服补救，以及强性价比是核心满意驱动。多条评论描述跨品类复购，暗示存在跨品类留存行为。反向信号也有意义：SmartCustomer（前 Sitejabber）给 Quince
              2.3/5，投诉集中在产品缺陷和订单履约失败，包括一条 2026 年 3 月评论，描述一件珠宝有缺陷且退货体验困难。FindThisBest 给出中间信号：整体 3.8/5，质量 3.5/5，退货
              4.2/5。Trustpilot 与 SmartCustomer 的分歧不应简单平均：它反映的是不同用户群，SmartCustomer 吸引了比例更高的失望客户，而 Trustpilot
              捕捉到更广的满意度分布。Business Insider、The Good Trade、Reader's Digest 和 The Quality Edit
              的编辑评测提供了品类层面的细节。羊绒和有机棉在不同来源中持续获得好评。亚麻、真丝和皮革表现不稳定。Business Insider 对 60 多件商品进行两年测试，是最严格的编辑证据，指出了具体产品线弱点。BBB
              档案和客户评论页面可以访问，但因 JavaScript 渲染，返回的可提取静态内容有限。The Atlas Heart 编辑评测在研究时完全无法访问。Trustpilot 证据的数量和质量在绝对项上显著压过
              SmartCustomer 的负面信号，但负面信号不应被忽略，因为它反映了相当一部分购买者真实经历的质量失败率。
