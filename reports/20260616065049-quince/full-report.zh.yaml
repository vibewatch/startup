      - number: '4.5'
        title: 财务结论与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              Quince 的财务叙事很有吸引力，锚点是已验证的收入规模和异常大的估值跃升——同一领投方持续押注下，估值从 2025 年 7 月的 $4.5 billion 升至 2026 年 3 月的 $10.1
              billion。已确认的 $1 billion 收入里程碑和 Sacra 对 $2 billion 年化收入的估算，支撑 5x–10x 收入倍数；对一个相较传统零售有结构性成本优势的高增长 DTC
              平台而言，这可以辩护，但需要继续以三位数增长执行才能合理。该模式的结构性毛利优势——去掉批发、过剩库存和分销加价——指向 40–50% 毛利率区间，与公开文件中的 DTC 可比公司一致；但如果 Quince
              不披露财务报表，无法独立验证。最重要的尽调阻断点包括：没有披露任何利润表；中国和东南亚采购商品面临的关税驱动 COGS 通胀敞口未量化；待决集体诉讼指控欺骗性定价（若胜诉，将影响驱动转化的营销机制）；以及相对
              $500 million Series E 融资，现金消耗轨迹未知。公司高复购模式和对 paid social 低依赖，暗示单位经济性强；但 365
              天退货窗口、免运费承诺，以及从服饰扩展到家具和实验室培育钻石的快速品类组合，引入了没有私人财务披露就无法评估的执行复杂度。按所述业务轨迹，Quince
              是具备买入级别的资产，但估值相对当前确认收入包含显著溢价，投资人必须承担毛利率和烧钱可见度上的重大模型风险。
            claimRefs:
              - CI032
              - CI033
              - CI034
