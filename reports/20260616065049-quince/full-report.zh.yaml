  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Quince 的运营逻辑是：把全球专业工厂网络、AI 驱动的需求预测和自有 M2C 操作系统接起来，直达消费者交付，从而砍掉传统零售中介链条。
    data:
      nodes:
        - id: factory-network
          label: 全球专业工厂网络
          detail: 与领先奢侈品牌使用同一批制造商；亚洲、欧洲、印度和意大利的中型家族工厂及更大型道德工厂；直接合作，无中间商。
          tone: positive
        - id: ai-forecasting
          label: AI 需求预测（每周 SKU / 尺码级）
          detail: 每周在 SKU 和尺码粒度预测需求；小批量测试订单按真实需求放大；库存周期 2–4 周，而传统零售为 3–6 个月。
          tone: positive
        - id: m2c-platform
          label: Quince M2C 操作系统
          detail: 自有技术整合供应链、物流、电商、增长和财务垂直模块；自动化处理海关、关税、生产规划和质量验证。
          tone: positive
        - id: capital
          label: 投资人资本（确认已融资 $700M+）
          detail: Series D（$200M，ICONIQ，2025）+ Series E（$500M，ICONIQ 领投，2026 年 3 月）；为全球扩张和技术平台开发提供燃料。
          tone: positive
        - id: consumer
          label: 直达消费者（美国 + 加拿大；欧盟招聘中）
          detail: 美国客户数以百万计；加拿大 2026 年 1 月上线；欧盟市场处于招聘阶段；免运费 + 365 天退货；每个商品页都透明标价。
          tone: positive
        - id: litigation-risk
          label: 多线诉讼悬顶
          detail: 商业外观诉讼（Tapestry、Deckers）、虚假广告诉讼（Williams Sonoma）、欺骗性定价集体诉讼；限制价格对比营销策略。
          tone: warning
      edges:
        - from: factory-network
          to: m2c-platform
          label: 工厂直采与生产
        - from: ai-forecasting
          to: m2c-platform
          label: 需求信号驱动生产订单
        - from: ai-forecasting
          to: factory-network
          label: 生产优化与批量规模
        - from: capital
          to: m2c-platform
          label: 平台和扩张所需增长资本
        - from: m2c-platform
          to: consumer
          label: 直达消费者交付；透明定价
        - from: litigation-risk
          to: m2c-platform
          label: 限制价格对比营销打法
