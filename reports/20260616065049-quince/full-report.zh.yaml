chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              Quince 是一家总部位于加州旧金山的消费科技平台，成立的目标是从基础设施层重做零售。公司总部和主要运营位于旧金山，在印度班加罗尔设有工程团队，并近期在加拿大多伦多和欧洲组建团队。Quince 成立于 2018
              年（里程碑部分讨论了一个小的来源差异），2020 年结束 beta 后商业化上线，最初销售 $50 的蒙古羊绒衫和 $60 的可水洗真丝连衣裙——这些产品直接证明了其创立命题：高端材质不必绑定奢侈品加价。


              Quince 运营模式的核心是
              Manufacturer-to-Consumer（M2C）平台：公司直接与为大型奢侈品牌代工的同一批专业工厂合作，并由工厂直接发货给消费者。采购代理、仓储中介、批发商、分销商和实体门店被拿掉后，Quince
              将通常七步以上的供应链压缩到两到三步。公司在每个产品页面公开完整成本拆解——材料、制作、包装、货运、信用卡费、关税——使定价逻辑完全透明，也便于与竞争对手价格直接比较。


              Quince 自有 M2C 操作系统靠 AI 驱动的周度 SKU 和尺码级需求预测支撑。传统零售会提前数月下大批量季节性订单；Quince
              则用小批量订单测试新品，再根据真实需求信号扩大生产，目标库存周期为两到四周，而传统零售为三到六个月。该做法减少过度生产，降低库存减记，并剔除长期嵌入零售定价中的财务和环境低效。公司还运营一条 B2B
              业务线，提供企业礼赠、白标门店、室内设计服务、酒店解决方案、品牌化门店和制服。
