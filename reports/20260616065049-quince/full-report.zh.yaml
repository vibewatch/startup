            title: 多栖购买是默认状态；没人赢下平价奢华 D2C 品类
            body: >-
              买家可以在单个季节周期内轻松跨 Quince、Everlane 和 Naadam 多栖购买，因为每个品牌解决「高性价比品质」的不同侧面。这是市场结构特征，不是临时阶段。对投资人而言，Quince
              通往品类主导地位的路径，是建立真实切换成本（忠诚度功能、独家工厂 SKU、个性化），而不是只依赖价格优势——因为单靠价格挡不住买家用 Everlane 的透明叙事或 Naadam 的羊绒产地故事做补充。
