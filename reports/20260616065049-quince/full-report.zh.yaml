  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Quince 于 2026 年 3 月完成 $500 million Series E，投后估值达到 $10.1 billion。本轮由 ICONIQ 领投——ICONIQ 也曾领投 Series
              D——Basis Set Ventures、Wellington Management、WndrCo、MarcyPen Capital Partners、Baillie Gifford、Notable
              Capital 和 DST Global 参投。ICONIQ 的 General Partner 称这笔投资是对 Quince「tripling down」，释放出高确信度机构锚定信号。所有已披露轮次累计融资超过
              $1.07 billion，包括 $50 million Series A（Insight Partners、Founders Fund、Basis Set、FJ Labs、8VC）、$77 million
              Series B、由 Notable Capital 与 Wellington Management 共同领投的 $120 million Series C、约 $200 million 且估值 $4.5
              billion 的 Series D（2025 年），以及 Series E。不到 12 个月从 $4.5 billion 跳到 $10.1 billion——增幅超过 2.2
              倍——即便在高增长消费公司里也偏快，需要审视新一轮定价过程。


              入场价格重要，因为优先权栈已经很厚。融资超过 $1.07 billion，且 2026 年 3 月又落下一笔 $500 million
              tranche，任何普通股或二级份额持有人前面都有显著高级清算优先权。公司官方新闻稿称，资金将支持「continued growth and global expansion of Quince's
              proprietary Manufacturer-to-Consumer (M2C) operating system」，但具体资本部署计划——国际基础设施、技术投资还是营销——没有公开分项。Series E
              层面的入场纪律，要求投资者确信 $10.1 billion 价格有可观察证据支撑；本章结论是，按标准倍数看，目前证据不足，尽管增长率能部分抵消。


              公开资料没有披露 term sheet、股权结构细节或清算优先权瀑布。Quince 仍是私营公司，没有提交财务报表的义务。最近的独立收入估计（Sacra，2026 年 2 月）显示年化 run-rate 为 $2
              billion，但这是第三方估计，不是申报或审计数字。公司在 Series E 新闻稿中确认的「$1 billion in top-line revenue」与 Sacra run-rate
              估计之间存在落差；对私营公司来说，这种信息不对称正常，但对正在校准价格的投资者来说影响重大。
