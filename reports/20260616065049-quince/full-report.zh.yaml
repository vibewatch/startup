      - number: '8.4'
        title: 情景分析与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              Quince 的熊、基准和牛三种情景，由三个主要变量界定：收入增长轨迹、能否展现盈利能力，以及流动性事件可实现的倍数。


              熊情景下，随着 de minimis 顺风消退、国际扩张资本稀释单位经济，且 Mandel 集体诉讼或 Williams Sonoma
              诉讼迫使删除线定价机制发生重大改变、进而影响相当一部分消费者转化，收入同比增长会大幅降至 30–50%。FY2026 收入达到约 $2.5–3.0 billion，但盈利能力仍未出现。2026 年 6
              月行政令带来的关税升级会结构性推高 COGS，压缩贡献毛利。若退出倍数为 1.5x EV/revenue（符合 DTC 溢价区间下沿），一家 $2.5 billion 收入公司价值约 $3.75
              billion——显著低于 $10.1 billion Series E 价格。来自 $1.07 billion 已融资本的优先权栈，会在普通股受益之前吸走大部分回款。


              基准情景下，Quince 收入同比增长 50–70%，FY2026 达到约 $3.0–3.5 billion，并开始展现毛利率改善轨迹和部分 EBITDA 可见度。2028 年 IPO 或 2027
              年战略二级交易按 2.5x revenue（DTC 溢价区间中点）定价——隐含退出价值约 $7.5–8.75 billion。这个数字低于 Series E 入场价格，意味着除非经营杠杆兑现，Series E
              投资者将面临温和按市值计价损失。


              牛情景下，Sacra 的 $2 billion run-rate 估计方向正确，增长在 FY2026 继续保持 80–100%+（收入达到 $3.5–4.0 billion），盈利能力浮现（EBITDA
              margin 5–10%），通过加拿大和欧洲的国际扩张高效放量，并且 Quince 在 2026 或 2027 年以 3x+ EV/revenue 倍数 IPO。这会把公司估值推到 $10.5–12
              billion——大致等于或高于 Series E 价格——对所承担风险来说算是合理回报。牛情景要求公司在多个维度同时 flawless execution；对于一家从未公开披露盈利季度的公司，这是一个激进假设。


              三种情景共同穿透的一点是：缺乏盈利数据，是建立确信度的最大障碍。一家公司以三位数速度增长，已确认 $1B+ 收入，并拥有清晰结构性成本优势（M2C），理应能够证明毛利率扩张；Quince 在 $10.1B
              价格下仍未披露任何利润率数据，这为所有需要盈利论点的情景留下重大信息缺口。
            claimRefs:
