  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              Quince 运营的是直接面向消费者的电商模式，并将其品牌化为 Manufacturer-to-Consumer（M2C）。公司收入来自一个主要渠道——自有 quince.com 店铺和 Quince
              移动应用——没有批发分销，没有实体零售网络，也没有具备实质规模的授权收入。产品横跨羊绒和服饰、皮具和配饰、床品和家用纺织、箱包、美妆和健康、美食、实验室培育钻石；公司称服饰是主要获客品类，家具和珠宝等高 AOV
              品类是扩大钱包份额的抓手。第二层变现是 Quince Business，把 M2C 平台延伸到企业礼赠、室内设计行业、酒店业、制服、贴牌生产和白标品牌店铺；公司披露，白标转售商通常以 Quince 产品零售价的
              1.5x–3x 加价销售——这说明直接成本经济性为下游利润留出空间，因此即便零售定价激进，Quince
              自有直接渠道毛利率也很可能显著高于零。收入确认遵循标准电商做法：产品销售总收入扣除预计退货。公司自有产品页展示一件 $50 羊绒衫，完整列出 $39.02
              成本拆分（材料、运费、信用卡手续费、关税），意味着在该毛衣价位上，公开的「你为哪些东西付钱」口径利润约 22%；22% 是最窄口径的贡献利润测算，并未反映高 AOV 品类，也没有反映低于 COGS
              项目被排除后的影响。Series E 新闻稿确认，2025 财年收入超过 $1 billion，且公司自成立以来每个财年同比增长都达到三位数。
