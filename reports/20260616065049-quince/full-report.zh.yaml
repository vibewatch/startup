  - id: TV002
    title: 多头论点与反向论点
    columns:
      - 论点
      - 多头逻辑
      - 空头逻辑
      - 什么会改变判断
    rows:
      - - 增长速度
        - 自上线以来每年同比三位数增长；FY2025 已确认超过 $1B
        - 规模做大后增长放缓不可避免；还没有 DTC 公司在超过 $1B 后仍持续三位数增长
        - 公司披露确认 FY2026 收入超过 $2B
      - - M2C 结构性优势
        - 直接工厂合作砍掉批发层级；成本护城河可持续
        - 工厂集中度带来风险；IPO/M&A 可比案例显示 DTC 优势并不耐久（Bonobos、Allbirds）
        - 经审计文件确认毛利率 ≥40%
      - - 倍数溢价
        - ICONIQ 信念强；当前阶段私募市场流动性溢价有理由存在
        - 5–10x EV/revenue 在服装领域没有先例；私募溢价填不上 3–5x 的缺口
        - IPO 定价达到或超过 $10.1B，且收入 ≥$3B
      - - 盈利路径
        - M2C 模型应能带来高毛利；自然获客占比提升会改善 CAC
        - 未披露任何利润率数据；宽松退货政策和国际扩张都会拖累成本
        - 披露 EBITDA 为正，或提交文件显示毛利率 ≥35%
      - - 诉讼风险
        - Quince 赢下 Deckers 案；服装领域商业外观诉讼很难胜诉
        - Mandel 集体诉讼直接攻击参考定价；Williams Sonoma 诉讼仍在进行
        - Mandel 案和解，且划线价机制无需重大调整
      - - TAM 与国际化
        - 高端服装 TAM 超过 $400B；加拿大扩张已于 2026 年 1 月启动
        - Quince 在实质规模上仍以美国为主；国际执行风险高
        - 加拿大上线 12 个月内收入超过 $50M
    notes: 各项论点代表有证据支撑的多头和空头最强解读。M2C 结构性优势基于公司发布的成本拆分和可比 M&A 倍数；盈利能力判断基于公司或独立申报文件均未披露利润率数据。
