      - number: '7.5'
        title: 隐私、数据与平台风险
        blocks:
          - type: paragraph
            body: >-
              Quince 2025 年 12
              月隐私政策授权广泛收集数据，包括精确地理位置、设备标识符、行为浏览模式、社交媒体账号数据和完整购买历史，用于个性化、广告和第三方营销分析。服务条款允许公司无需提前通知即可修改价格和服务，并明确否认对产品描述不准确承担责任；这种姿态可能与
              Mandel 集体诉讼现已覆盖的 7 个州消费者保护法规冲突。截至 2026 年 6 月，尚未发现针对 Quince 的数据泄露通知、FTC
              执法行动或州总检察长隐私调查，因此隐私风险仍是潜在风险，而非已激活风险。但 Quince 拥有数百万消费者客户及其行为购买历史数据，攻击面具有实质性。公司尚未披露 SOC 2
              合规、第三方安全审计或正式事件响应框架。Quince 核心市场的隐私监管正在收紧（California CPRA
              及各州类似法规）；如果数据事件叠加欺骗性定价诉讼叙事，可能造成复合声誉损害，公众心智中也很难把两者切开。
            claimRefs:
