  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              理解 Quince 的竞争格局，最好用五类原型层级，而不是单一可比公司组。第一，高端透明基础款：Everlane 与 Quince
              占据相同的可负担奢侈服装定位，但差异点在激进透明定价（公开工厂成本、材料和加价），而非成本压缩。第二，全球价值基础款：日本上市公司 Fast Retailing 运营的 Uniqlo
              在质量基础款细分以大众市场规模竞争，全球门店超过 2,400 家，LifeWear 品牌建立在功能性持久上——在某些价格点和产品品类上与 Quince 重叠。第三，快时尚规模：全球最大服装零售商、Zara 母公司
              Inditex 是一台销量和趋势机器，处于不同战略象限——快速趋势轮转 vs. Quince
              的材质驱动持久性——但争夺可选服装钱包份额，并受益于无可匹敌的全球零售分销。第四，带会员外壳的工厂直连奢侈品：Italic 的工厂直连逻辑与 Quince
              结构相似，但用年度会员费设门槛，并强调高端策展而非最低成本发现。第五，品类专业化：Naadam 专注羊绒，凭借更强品质定位和产地叙事，直接威胁 Quince 最突出的产品品类，并能打动重视可持续性的买家。


              该市场不是赢家通吃。买家会主动跨层多归属，因为每个品牌解决「质量换价值」等式的不同侧面：Quince 强在价格，Everlane 强在透明度和品牌故事，Naadam 强在羊绒卓越性，Italic
              强在策展选择深度。Quince $10.1B 投后估值和 2025 年 $1B+ 收入，使其在资本化程度上明显领先任何 D2C 同行，但仍远低于公开市场在位者（Inditex：年净销售额 400
              亿欧元以上；Fast Retailing：FY2025 收入约 3.9 万亿日元）。Quince 护城河主要是运营性的——M2C 供应链才是结构性优势——而非品牌独占。
