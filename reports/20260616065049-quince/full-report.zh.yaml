        - 对来自柬埔寨、印度、蒙古、土耳其的商品征税
        - Yale Budget Lab 跟踪器显示 2025–2026 年关税连续上调
        - 重大 —— 未量化
        - 将 SKU 组合映射到采购来源；按 10/25% 上浮建模关税情景
      - - 退货负债（365 天政策）
        - 大多数商品免费退货；仅家具和定制商品收重新入库费
        - 行业退货率 20–30%；365 天窗口高于行业标准
        - 重大 —— 若收入 $1–2B、退货率 20–30%，年化可能为 $200–600M
        - 要求按品类和队列年份提供退货数据
      - - 免运费义务
        - 发货和退货运费由公司承担
        - 未披露门槛；规模化后形成结构性成本
        - 重大 —— 未量化
        - 运费占收入比例；承运商协议条款
      - - Coach / Tapestry 商业外观诉讼
        - 被指复制 Coach 手袋元素设计
        - 进行中；Tapestry FY2025 10-K 提及持续 IP 诉讼
        - 取决于救济方式，可从轻微到重大
        - 审查法院案卷；评估损害赔偿敞口
      - - Williams-Sonoma 诉讼
        - 被指虚假广告和夸大竞品价格
        - TechCrunch 和 WWD 报道；截至 2026 年 3 月仍在进行
        - 取决于范围，可从轻微到重大
        - 审查起诉状；评估定价页面禁令风险范围
      - - 消费者集体诉讼（欺骗性定价）
        - 指控划线的「传统零售」价格从未由 Quince 或其他方实际收取
        - 集体诉讼在加州北区联邦地区法院提起；WWD 报道
        - 重大 —— 若胜诉，将迫使核心转化机制重设计
        - 审查起诉状中的损害测算方法；评估若禁令获批对转化的影响
    notes: >-
      诉讼项目来自新闻报道（WWD、TechCrunch）和 Tapestry 10-K 披露。退货负债的金额估算为分析师估算，并非公司披露。关税影响数据来自 Federal Reserve 和 Yale Budget Lab
      已发布分析。
