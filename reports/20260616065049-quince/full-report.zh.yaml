      - number: '1.4'
        title: 规模、收入与增长轨迹
        blocks:
          - type: paragraph
            body: >
              Quince 顶线收入在 2025 年超过 $1B，这一里程碑由公司官方 Series E 新闻稿确认，并得到 WWD、TechCrunch 和 Digital Commerce 360
              佐证。公司称，自成立以来每个财年收入均实现三位数同比增长——如果这一表述延续至 2025
              年，意味着商业化运营五到七年中收入每年大致翻倍或更多。除「>$1B」外，公司未公开披露精确年度收入；毛利率、净收入留存和烧钱速度均为私有数据。


              客户侧，Series E 新闻稿将 Quince 描述为「服务广泛品类中数百万客户的平台」。确切客户数未公开。公司上线时采用聚焦 Instagram 的获客策略，以 $50
              羊绒衫为锚点——单一产品制造了病毒式认知，并验证 M2C 的价格—品质主张。管理层将复购模式视为主要信任信号：客户回来的不是某个单品，而是所有产品如何制造、如何定价背后的系统。


              客户满意度信号为正。2025 年 12 月 Trustpilot 快照显示评分 4.8/5，评级为「优秀」。BBB 维护着 Quince.com
              在旧金山的投诉档案，这与该规模下交易量相符。员工数是缺口：公司技术博客显示，2021 年 11 月工程团队有 17 人；当前跨职能和地域的总员工数未公开披露。
