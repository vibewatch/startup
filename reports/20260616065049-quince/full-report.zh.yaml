      - number: '8.3'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >-
              Quince 的可比组横跨三类参照：上市 DTC 和服装公司、私营 M&A 交易，以及行业整体倍数调查。没有任何一类参照能在可观察财务数据上支撑当前 $10.1 billion 价格。


              上市公司中，REVOLVE Group (RVLV) 于 2026 年 2 月提交 FY2025 10-K，收入 $1.23 billion、毛利率约 53.5%——这是一个高质量 DTC 时尚平台，收入规模与
              Quince 已确认 FY2025 收入大致可比。到 2026 年中，REVOLVE 市值约 $800–900 million，隐含 EV/revenue 约 0.7–0.8x——按可比 top-line
              revenue 看，相比 Quince 的私募市场估值折价很深。Stitch Fix (SFIX) 报告截至 2025 年 8 月财年收入 $1.27 billion，毛利率
              44.4%；由于持续净亏损，其交易价格相对收入大幅折价。Ralph Lauren 报告 FY2025 收入 $8.1 billion，经营利润率 14.5%，收入增长
              14.6%——是可比组中经营利润率最强的公司——但交易约为 2x EV/revenue。长期 DTC 溢价基准 Lululemon，在指引压缩后，到 2026 年中降至约 1.3x
              EV/revenue。Inditex（Zara 母公司）和 Fast Retailing（Uniqlo 母公司）提供最大规模服装可比对象；凭借垂直整合和规模，两者交易在 2–4x EV/EBITDA。


              M&A 交易中，Gildan/HanesBrands 交易（2025 年）以约 $4.4 billion 企业价值完成——约 1.3x revenue 和 8.9x LTM adjusted
              EBITDA——这是规模化、低增长基础款品牌的教科书倍数。VF Corporation 于 2024 年出售 Supreme，净收款约 $1.49 billion，按估算 trailing sales 隐含约
              2.3x revenue，较 VF 在 2020 年街头潮牌热度高峰支付的约 4.2x revenue 明显回落。Walmart 于 2023 年以约 $75 million 出售 Bonobos——约 0.4x
              revenue——是小规模、未盈利直营品牌 DTC down-round 的教科书案例。Tapestry/Capri 合并（2023 年宣布，2024 年被监管阻止）对 Capri 组合隐含约 1.5x
              revenue 和 8–9x forward EBITDA。Authentic Brands 收购 Reebok 的倍数约为 1.4x revenue。


              私募市场溢价论点——pre-IPO 公司因投资者愿意承受非流动性而比上市可比公司高 20–30%——无法填平如此巨大的缺口。如果 REVOLVE 在公开市场以 0.7x EV/revenue 交易，Quince
              的私募市场溢价为 30%，隐含公允价值也只有约 0.9x revenue，按 $2 billion 已确认收入约为 $1.8 billion。即便采用 Lululemon 2026 年中的 1.3x 倍数并加
              30% 私募溢价，公允价值区间也只有约 $3.4 billion——按可比收入和可比 DTC 质量看，约为当前 Series E 价格的三分之一。
