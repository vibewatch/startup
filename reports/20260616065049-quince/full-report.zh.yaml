            title: 已确认收入规模与异常估值跃升
            body: >-
              Quince 确认 2025 财年年收入跨过 $1 billion——对一家 2018 年成立的纯 DTC 品牌来说，这是异常高的门槛——同时在 2026 年 3 月达到 $10.1 billion
              投后估值。估值在不到九个月内从 $4.5B（2025 年 7 月）升至 $10.1B（2026 年 3 月），提升 2.2x，且由同一 ICONIQ Capital
              团队「三次加码」领投，构成了机构对资本效率和增长耐久性的高确信号。
            calloutType: strength
