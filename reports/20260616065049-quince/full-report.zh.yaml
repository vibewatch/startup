      - number: '2.3'
        title: 买家与细分分析
        blocks:
          - type: paragraph
            body: >
              Quince 的商业模式是典型单边 B2C 交易：买家、用户和付款方是同一个人——发现、选择、购买并使用产品的个人消费者。核心消费渠道没有雇主中介、福利管理员或企业买家。例外是 Quince 的 B2B
              线（Quince Business），面向企业礼赠、酒店和品牌化门店买家——该细分中由采购或 HR 专业人士掌握预算。


              在核心 D2C 消费者细分内，证据指向两类主要买家画像：


              （1）向下换购的向往型消费者：此前购买 Coach、Banana Republic 或 Burberry 入门配饰等传统奢侈或可负担奢侈品牌，但在 2019 年以来奢侈品急剧涨价后逐渐疏离。Bain
              记录，Chanel Classic Flap 手袋价格从 2019 年约 $6,000 几乎翻倍至 2025 年超过 $11,000，这一模式在行业内反复出现。该买家追求品质，但越来越受价格纪律约束，也更容易接受
              Quince 的透明价值主张。人口结构上，该画像偏向 Millennials（现占全球奢侈品市场 47%）和 Gen X。


              （2）追求价值的高端化消费者：当前在大众或中端零售（Old Navy、Target、H&M、Amazon）购买，正在升级到品质优先基础款，但没有预算或意愿支付传统奢侈溢价。该买家中 Gen Z
              占比更高；PwC（2025 年秋季对 4,000 名消费者的调查）发现这一群体的价值意识具有独特性——不只是压低价格，而是在公平价格下寻找情感和社会价值。NielsenIQ 与 GfK 联合 World Data
              Lab 预测，到 2030 年 Gen Z 将代表 $12T 消费能力。Quince 的定价透明度、可持续叙事和 Instagram 原生品牌语气与该群体偏好一致。


              两类画像的采用路径通常相同：先通过社交媒体发现（Instagram 是 Quince 主要获客渠道，$50 羊绒衫曾在此走红），随后进行低风险首次购买（按 CFO 评论，服装品类是 Quince
              主要信任建立载体），信任累积后再扩展到家居用品和配饰。这与投资人描述的飞轮一致：「人们每年买 T 恤的次数大概率远多于买沙发。这是建立信任的好办法；之后当他们尝试不同东西时，信任又会被进一步强化」（Matt
              Lippert，Chief Commercial Officer，据 WWD 2026 年 3 月）。
