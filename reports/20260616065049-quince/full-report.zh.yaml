  - id: FR002
    title: 风险传导图 — 核心风险如何流向估值
    type: dag
    layout: wide
    summary: 因果图展示欺骗性定价诉讼和关税升级如何传导到品牌、利润率和估值受损。
    data:
      nodes:
        - id: class_action
          label: 集体诉讼
          type: input
        - id: tariff_escalation
          label: 关税 / UFLPA 升级
          type: input
        - id: brand_narrative
          label: 品牌叙事受损
          type: process
        - id: margin_compression
          label: 利润率承压
          type: process
        - id: injunctive_relief
          label: 定价模型禁令
          type: process
        - id: supply_disruption
          label: 供应链扰动
          type: process
        - id: consumer_trust
          label: 消费者信任流失
          type: process
        - id: revenue_risk
          label: 收入增长受损
          type: output
        - id: valuation_risk
          label: 估值倍数压缩
          type: output
        - id: fundraising_risk
          label: 后续融资摩擦
          type: output
      edges:
        - from: class_action
          to: brand_narrative
          label: 媒体放大欺骗性定价叙事
        - from: class_action
          to: injunctive_relief
          label: 若集体认证通过且熬过简易判决
        - from: tariff_escalation
          to: margin_compression
          label: 中国 / 印度进口关税上调
        - from: tariff_escalation
          to: supply_disruption
          label: UFLPA 扣留冻结在途库存
        - from: injunctive_relief
          to: brand_narrative
          label: 迫使定价模型重做
        - from: brand_narrative
