  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Quince 主要服务北美价值敏感型消费者，他们希望以公司所称低于传统零售 50% 到 80% 的价格，购买高品质服饰、家居用品和配饰。manufacturer-to-consumer 模式把 Quince
              定位成面向这类购物者的品牌：他们想要羊绒、有机棉和接近奢侈品的产品，但不愿为传统品牌加价或零售中介付费。公司称服务数百万客户，但没有公开披露独立客户数或精确人口结构拆分。现有信号指向一类女性占比更高、重视收入约束的核心买家，她们通过
              TikTok、社交媒体达人和编辑报道发现 Quince。2026 年 1 月与 A$AP Rocky 的合作，显示公司有意向男性人群和更年轻客群扩张。Quince 还运营名为 Quince Business 的
              B2B 渠道，服务六个垂直领域：企业礼赠、室内设计、白标制造、酒店业、品牌店铺和制服。该 B2B 渠道与核心 DTC 业务并行，但公开资料没有收入拆分。Forbes 引用 PwC 调研数据称，2026 年 94%
              消费者认为自己必须获得最优性价比；这是 M2C 模式的结构性顺风，Quince 自 2018 年创立以来一直在利用这一点。
