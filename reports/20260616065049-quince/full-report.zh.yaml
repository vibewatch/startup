          - type: callout
            title: 白标转售信号暗示核心毛利率健康
            body: >-
              Quince 在官网披露，白标业务伙伴通常以 Quince 零售价的 1.5x–3x 转售其产品，伙伴在 DTC 价格之上获得加价，而 Quince 继续负责履约。这个经济信号很重要：如果转售商能在 Quince
              零售价 1.5–3x 处获得利润，Quince 自有直接渠道毛利在其设定的零售价下必然显著为正——这意味着 how-it-works 页面展示的 22% 全包贡献低估了真实会计毛利率，因为低于 COGS
              的项目（出境配送、信用卡手续费）应被正确分类。
