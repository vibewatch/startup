  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 欺骗性定价诉讼与消费者法律风险
        blocks:
          - type: paragraph
            body: >-
              最尖锐的公司个体法律风险已经进了法院。2025 年 11 月 13 日，原告 Alexandra Mandel 在美国加州北区联邦地区法院（案号 3:25-cv-09780）对 Last Brand
              Inc.（dba Quince）提起集体诉讼，指控 Quince 的删除线「traditional retail」参考价和「You save X%」话术，依据加州 False Advertising
              Law、Unfair Competition Law 和 Consumer Legal Remedies Act 误导消费者。原告没有等法院先裁定初步驳回动议，而是在 2026 年 4 月初扩充起诉书，新增 10
              名原告，并把诉求延伸到另外 6 个州——拟组建一个覆盖全美、包括四年内购买 Quince 产品消费者的集体。Quince 于 2026 年 4 月 2
              日提交新的驳回动议，提出三点：按合理消费者标准，不存在可成立的消费者欺骗；原告从未主张产品价值低于支付价格，因此不存在可诉损害；各州消费者保护标准拼图式分散，多州集体认证并不适合。听证定于 2026 年 7 月
              16 日；截至本轮报告日期，法院尚未就实体问题作出裁定。另有首席原告律所 Berger Montague PC 正在单独调查 Quince 的欺骗性广告，并主动招募集体成员；该律所 2025 年庭审后判决金额达
              $2.4B，说明诉讼敞口可能超出当前案件。三起平行诉讼——Tapestry/Coach（商业外观）、Williams-Sonoma（虚假广告）和 Deckers/UGG（商业外观，Quince
              反诉反垄断）——还会继续消耗管理层带宽。这一组诉讼把公司个体法律风险，与下一节讨论的行业性监管敞口区分开来。
