  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 收入与 run-rate 确认
        - 经审计或申报的 FY2025 收入和 2026 年 Q1 run-rate
        - Sacra $2B 估算未经审计；确认后的数字是倍数纪律中最重要的单一输入
        - 公司 data room；若推进 IPO，则看 S-1 文件
      - - 毛利率与单位经济性
        - 毛利率 %、COGS 拆分、按品类贡献利润、退货率和退货成本
        - 估值纪律需要利润率；没有 ≥40% 毛利率证据，10x 倍数无法成立
        - 公司 data room；管理层访谈；用上市可比公司文件做基准
      - - 诉讼状态与风险量化
        - Mandel（3:25-cv-09780）、Williams Sonoma 和 Tapestry 诉讼的当前状态；法律顾问准备金估算
        - 多方在审诉讼直接攻击核心转化机制；或有负债尚未量化
        - 法律顾问；PACER 文件；CourtListener 案件监控
      - - 股权结构与优先权瀑布
        - Series A–E 清算优先权、参与权、反稀释条款和二级股份流动性
        - 若优先股参与分配，$7–8B 退出时普通股价值可能为零
        - 法律 data room；公司提供 cap table 模型
      - - 关税影响建模
