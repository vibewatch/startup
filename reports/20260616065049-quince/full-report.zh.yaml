      - number: '7.3'
        title: 供应链、强迫劳动与运营质量风险
        blocks:
          - type: paragraph
            body: >-
              Quince 的 M2C 模式依赖多国工厂网络；截至 2026 年 6 月，公司尚未披露任何第三方供应链审计、强迫劳动尽调报告或工厂认证名单。UFLPA
              和新的海关行政令正在扩大服装进口商的文件要求，这一时点上的结构性可追溯缺口尤其刺眼。如果 Quince 的工厂伙伴被适用 Withhold Release Order 或 UFLPA
              扣留，在途库存会被冻结，公司没有国内缓冲库存来吸收服务中断；面向消费者的发货失败会立刻出现。Trustpilot 在数千条已验证评论中给出
              4.8/5「Excellent」评分，压低了质量风险，但缩水、拉链缺陷、漏发商品等零散负面信号证明，制造缺陷仍以非零概率到达消费者。SmartCustomer 的 2.3/5
              评分虽然样本很小，却提示不满意客户往往集中在严重体验上（例如珠宝缺陷、拒绝退款）。Quince 的 365
              天退货政策是留存的重要驱动，但也带来未量化的逆向物流成本和营运资金需求，公司没有单独披露。工厂直达家门、超长退货窗口、未披露质量保障基础设施三者叠加，形成运营脆弱性；关税扰动或工厂合规问题会很快把它暴露出来。
