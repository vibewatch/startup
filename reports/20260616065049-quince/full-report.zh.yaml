            body: >-
              Quince 覆盖十个一级品类：Women's、Men's、Home、Baby & Kids、Travel、Bags & Accessories、Jewelry、Beauty &
              Wellness，以及额外主题垂类（Everyday Steals、The
              Archive）。其中子品类包括女装的连衣裙、上衣、外套、居家服和运动服；男装的亚麻、牛仔和西装；家居的床品、地毯、家具、浴室和厨房用品；以及包含补剂的增长中美妆健康线。材料是主要质量信号：蒙古羊绒、欧洲亚麻、意大利皮革、可水洗真丝、有机棉和
              OEKO-TEX 认证面料持续出现在产品描述中。价格定位由每个产品详情页上的 “Beyond Compare” 表格锚定，表格列出具体竞品和价格，并与 Quince 自有价格并排比较。一件蒙古羊绒圆领衫售价
              $50，对比 J.Crew 的 $148、Everlane 的 $178 和 Naked Cashmere 的 $295。Quince Business 把产品面扩展到 B2B
              客户，覆盖企业礼赠、白标制造、室内设计、酒店供应、制服和品牌店铺；伙伴以 Quince 零售价 1.5x–3x 转售，显示 Quince
              在伙伴加价前已捕获的利润宽度。产品线刻意走经典、耐久路线，而不是追逐潮流，这降低了设计开销和降价风险。
