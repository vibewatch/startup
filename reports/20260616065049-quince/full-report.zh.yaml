      - number: '5.5'
        title: 质量、信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Quince 的信任模型建立在直接工厂合作之上，并声明要求公平工资、安全工作条件和可持续生产实践。产品页会为特定纺织品引用 OEKO-TEX 认证；但全面、独立验证的认证组合尚未公开确认。隐私政策（最后更新于
              2025 年 12 月 15 日）将公司识别为 Last Brand, Inc.，并披露与 Google Ads、Meta Pixel、TikTok Pixel
              和第三方支付处理商共享数据。公司运营一个有数据处理含义的忠诚度计划。支付安全依赖第三方处理商，客户直接向该处理商提供银行卡信息。在法律风险方面，Quince 曾因涉嫌设计复制，面临
              Coach（Tapestry）、Williams Sonoma 和 Deckers Brands 提起的商标和商业外观诉讼；Deckers 关于鞋类的诉讼以 Quince 胜诉告终。Williams Sonoma
              指控 “Beyond Compare” 表格中的虚假广告和夸大竞品价格诉讼，截至本文撰写时仍在进行。此前 Yeti 保温杯商业外观索赔已于 2023
              年和解。这些诉讼代表了与核心产品比较架构绑定的结构性法律风险，似乎尚未拖慢增长，但带来持续诉讼成本和声誉敞口。
