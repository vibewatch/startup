      - number: '3.4'
        title: 切换成本、锁定与分销能力
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，Quince 没有明确的忠诚度计划、会员等级或订阅机制。这是刻意降低获客摩擦的选择：开放交易模式拿掉了限制 Italic
              触达范围的会员门槛，最大化漏斗顶部转化。但缺少结构化锁定，也意味着买家可以轻松多栖——在同一个季节周期里同时购买 Quince、Everlane 和 Naadam，切换成本为零。在 D2C
              服饰里，不存在类似企业软件的平台排他、专有数据格式或集成关系来形成技术锁定。


              Everlane 的激进透明在其核心伦理消费群体中形成了心理切换阻力。认同 Everlane 工厂审计披露和可持续材料叙事的消费者，可能会抗拒 Quince 相对不透明的工厂命名，以及 Good On You
              可持续评估中给出的 “Not Good Enough” 评级。这道品牌信任护城河偏软——一次可信丑闻就可能侵蚀——但它真实存在，并瞄准了 Quince 价格优先信息未能完全覆盖的细分人群。Naadam
              的蒙古羊绒「牧群直达」产地故事也类似：买家与牧民社区之间的情感连接带来留存，而不只是靠价格驱动。


              Uniqlo 的实体门店网络是这组竞争者里最耐久的分销护城河。其北美 200 多家门店提供店内发现、试穿、退货处理和品牌接触，纯线上品牌无法复制。Fast Retailing 2025 财年上半年创纪录表现，以及
              2026 年春季与 Los Angeles Dodgers 的合作，都显示其会继续投资北美；如果 Uniqlo 激进扩张高端材料 SKU，长期会威胁 Quince。Italic 约 $100/年的会员费形成了
              Quince 没有的沉没成本留存机制，但也把 Italic 的可触达用户池限制在承诺度较高的买家中，相比 Quince 低摩擦开放模式，规模野心受限。
