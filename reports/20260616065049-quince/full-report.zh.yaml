      - number: '5.3'
        title: 电商平台与数字体验
        blocks:
          - type: paragraph
            body: >-
              quince.com 上的 Quince 店铺采用现代 headless commerce 架构，前端使用 Gatsby.js，搜索和商品发现使用 Algolia，CMS 使用
              Contentful，客户评论和评分使用 Yotpo。Constructor.io 用于个性化和商品陈列。支付通过 Klarna、Afterpay、Google Pay 以及标准信用卡 /
              借记卡处理商完成。营销基础设施包括 Attentive（SMS）、Criteo（重定向）、带 Enhanced Ecommerce 的 Google Analytics 4，以及 TikTok
              Pixel。这些工具在大型 DTC 零售商中很标准，代表的是组装良好的商品化技术栈，而不是专有技术基础设施。Quince 移动应用可在 Android 使用（包名：com.lastbrand.quince），截至
              2026 年 6 月下载量 100,000+，353 条评论评分 4.7 星，更新于 2026 年 6 月 15 日。Android 应用提供新品提前访问、实时订单跟踪和独家产品 drop。iOS
              应用列表（id1512791186）在评估时无法访问。店铺的 “Beyond Compare” 架构通过向已经在搜索某一品类的购物者展示明确的价格和规格替代表格，成为决策点转化机制；其逻辑更接近 Amazon
