      - number: '8.2'
        title: 收入基线与倍数机制
        blocks:
          - type: paragraph
            body: >-
              Quince 的核心估值张力很直接：采用哪个收入数字，会让 $10.1 billion 价格对应出非常宽的隐含倍数区间。按公司自己确认的说法——FY2025 top-line revenue 超过 $1
              billion——隐含 EV/revenue 约 10.1x。按 Sacra 截至 2026 年 2 月的 $2 billion 年化 run-rate 估计，倍数约 5.1x。无论哪一个，都无法用上市服装或
              DTC 可比公司来支撑。


              作为参照，Damodaran 2026 年 1 月覆盖 35 家上市服装公司的数据集中，EV/sales 中位数为 1.59x，净利率中位数为 3.85%。Equidam 2026
              年数据集中，服装及配饰零售商收入倍数为 0.38–1.49x，广义服装及配饰为 0.74–2.31x。Eightx 2026 年对服装 M&A 和交易倍数的分析——来源于 SEC proxy fairness
              opinions——给出的高 DTC、高增长表现上限是 2–3x EV/revenue，主流服装区间是 1.0–1.8x。Lululemon 可以说是最具溢价的公开交易 DTC 传承服装品牌；到 2026
              年中，受指引转弱和关税敞口驱动的倍数压缩影响，其 EV/revenue 约为 1.3x。这些参照点表明，即便最宽松的可观察可比公司，也只支持快速增长、高 DTC 品牌约 3x
              EV/revenue——也就是说，若按 3x 倍数，Quince 要支撑 $10.1 billion 估值，需要已确认收入约 $3.4 billion，而这个数字尚无证据。


              Quince 自 2020 年上线以来每个财年的收入复合增长均为三位数，这是给予下一年度溢价的最强依据。如果 Sacra 的 $2 billion run-rate 准确，且 2026 日历年增长仍保持
              60–80%（较近期速度显著减速，但仍然异常强劲），FY2026 收入可能接近 $3.0–3.5 billion。在这个收入水平上，按 3x EV/revenue 倍数，$10.1 billion
              大致公平。问题在于，这要求投资者相信第三方当前 run-rate 估计，继续外推未来 12 个月仍会减速但依旧异常的增长，并套用一个本身就是可观察 DTC 溢价区间顶部的 3x
              倍数。任一假设都可能错；要得到公允价值，三者必须同时成立。没有审计后的盈利指标——未披露毛利率、EBITDA 或净利润——使投资者无法使用 DCF 或基于盈利的框架，只能完全依赖收入倍数，而 Quince
              正落在任何合理区间的昂贵端。
