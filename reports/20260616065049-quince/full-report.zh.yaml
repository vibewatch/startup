      - number: '7.4'
        title: 财务模型、估值与消费者需求风险
        blocks:
          - type: paragraph
            body: >-
              Quince 的 $10.1B 投后估值，约等于其披露 2025 年收入超过 $1B 的 10
              倍——这是一个成长股权倍数，定价前提是持续高增长和结构性改善的利润率。两者都没有保证。公司自身披露的全成本透明度显示，单件羊绒衫在扣除管理费用前约有 22% 贡献毛利；公司没有公开披露毛利率、EBITDA
              或运营费用拆分。关键进口品类关税升级，会在价格能否向消费者传导被验证之前，进一步压缩这项利润率。Sacra 对 2026 年年化收入接近 $2B
              的估计尚未得到管理层证实，应视为外部估计。服装可选消费顺周期；美国消费者信心一旦恶化，定位在单件
              $50–$200、靠感知价值而非刚需竞争的品牌会受到更大冲击。来自品牌老牌企业的三起平行诉讼（Tapestry、Williams-Sonoma、Deckers）合在一起说明，传统零售正在反击；即便最终被驳回，它们也会带来诉讼成本并分散创始团队注意力。最后，$500M
              Series E 没有披露流动性时间表，意味着以 $10.1B 估值进入的投资者目前没有明确退出窗口来校准回报预期。
