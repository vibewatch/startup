      - number: '4.2'
        title: 单位经济性与毛利率估算
        blocks:
          - type: paragraph
            body: >-
              Quince 不披露毛利率、COGS 或 EBITDA。可用于估算利润率的证据来自三类：公司在 how-it-works 页面公开的成本拆分、可比上市公司文件，以及分析师评论。how-it-works
              页面展示一件零售价 $50 的羊绒衫，对应全包成本 $39.02，其中包含材料 / 制造、入境运费和处理费（$5.35）、信用卡手续费（$1.40）和进口关税（$4.50）。按
              GAAP，信用卡手续费和出境配送通常列在毛利以下（销售费用或履约费用），因此该毛衣的经济毛利率可能是 30–40%，而不是成本透明展示暗示的全包 22%。在公开 DTC 可比公司中，REVOLVE（一家 DTC
              时尚平台）在 2026 年 2 月向 SEC 提交的 10-K 中报告，2025 财年收入 $1.23 billion，毛利率约 53.5%。Stitch Fix（一家个人造型 DTC 服务）在 2025 年 9
              月向 SEC 提交的 10-K 中报告，2025 财年收入 $1.27 billion，毛利率约 44.4%。Tapestry（传统奢侈品牌，86% 收入来自 DTC）在 2025 年 8 月向 SEC 提交的
              10-K 中报告，2025 财年收入 $7.01 billion，毛利率约 75.4%。Quince 的价格带低于 REVOLVE，也不是造型服务；因此其可能毛利率低于
              REVOLVE，但考虑到轻资产模式且没有个人造型师开销，可比口径上应高于 Stitch Fix。Sacra 估计，Quince 年化收入到 2026 年 2 月达到约 $2 billion，高于 2024
              年估算的 $340 million，显示出与三位数增长叙事一致的急剧加速。获客主要依靠自然和赢得媒体——达人内容、社交对比视频和搜索——而不是重金投放 paid social；相比第一代把获客集中在 Meta
              平台上的 DTC 品牌，这在结构上改善了回本周期。365 天退货窗口和免运费带来真实成本义务，但公司没有公开量化；行业数据表明 DTC 时尚退货率为 20–30%，Quince 宽松的退货政策可能高于中位数。
