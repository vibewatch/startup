      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              可负担奢侈 D2C 线上市场有一组结构性顺风，利好 Quince 的 M2C 模式；同时也有重大逆风，带来采用摩擦和运营风险。


              关键增长驱动因素：第一，美国服装零售电商渗透率继续上升。Census Bureau 月度零售贸易数据显示，线上份额持续增加，线上服装约占美国服装总支出的 35–40%——这一渠道迁移系统性扩大了纯 D2C
              品牌的可触达受众。第二，追求价值的 premiumization 是代际行为变化，而非短暂周期：Gen Z 和 Millennials
              并非只在收入紧张时向下换购，而是在重定义价值——每一美元买到的品质透明度、可持续性和品牌真实性——这正是 Quince 所占的位置。第三，2025–2026 年关税环境制造了异常竞争动态。美国贸易政策从 2025
              年开始并在 2026 年扩大，对来自中国和其他亚洲制造中心的服装与纺织品进口加征重大关税。Federal Reserve Board（FEDS Notes，2026 年 4
              月）发现关税对消费品价格的实时影响具有统计可检测性；Yale Budget Lab
              追踪其在消费品类中的持续经济影响。传统零售商依赖中介密集供应链——进口商、分销商、批发商——关税转嫁会在多个节点叠加。Quince
              的工厂直连模式砍掉大部分节点，提供结构性成本缓冲；在关税高企环境下，它与传统零售商的价格差应会扩大。第四，国际扩张——Quince 2026 年 1 月进入加拿大，并在建设欧洲市场能力——在核心美国市场之外增加新
              TAM 通道。第五，向家居用品、厨具、美妆和健康扩品类，可从现有客户中获得收入多元化和更高平均订单价值，深化平台经济性。


              关键采用约束：第一，Quince 自身制造基地主要位于亚洲，包括 2025–2026 年美国贸易政策中面临较高关税的国家。虽然去掉供应链中介提供了缓冲，Quince
              自有采购商品仍会受到关税驱动投入成本通胀影响。公司未公开披露供应链多元化路线图或原产国拆分，关税敞口规模仍不确定。第二，消费者信任和合身障碍仍是 D2C
              服装采用的结构性约束。首次购买者无法触摸面料、试穿服装，也无法在店内获得尺码帮助。退货虽可用，但会制造逆向物流摩擦并拖累利润率。第三，尚未了结的集体诉讼（北加州联邦地区法院）指控 Quince
              欺骗性参考价营销——称其划线「traditional retail」价格从未实际收取、系捏造以制造省钱幻觉——构成重大声誉风险。若指控成立，它将直接攻击公司透明定价这一核心价值主张。Quince
              拒绝就诉讼置评。第四，Deloitte 美国经济预测（2026 年 6 月更新）预计 2026 年消费者支出增速放缓，即便实际 GDP 增长 2.2%，关税驱动通胀仍会压缩高端可选品类的实际购买力。BEA 报告
              2026 年 4 月 PCE 增长 0.5%、3 月增长 1.0%——仍为正，但较此前季度放缓。高端基础款比真正的大宗基础品更具可选属性，因此容易受到消费者支出减速冲击。
