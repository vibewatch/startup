      - number: '2.2'
        title: 市场规模——多镜头测算
        blocks:
          - type: paragraph
            body: >
              没有一份权威分析师报告将「北美线上可负担奢侈 D2C 服装与家居用品」定义为一个离散、可审计的市场类别。本节用五个测算镜头交叉验证，保留矛盾，并给出区间估计，而非单一标题数字。


              镜头 1——全球服装市场背景：Grand View Research 估计，2025 年全球服装市场为 $1.84T，预计 2026 年达到 $1.91T，并以 4.1% CAGR 增长至 2033 年的
              $2.54T。大众服装贡献 67.8% 收入，高端和奢侈约占剩余 32%。按美国在全球服装中的份额（基于消费者支出基准约 20–25%）计算，美国服装零售总额约为每年 $370–480B，与行业估算一致。


              镜头 2——全球个人奢侈品：Bain & Company（经 Forbes 报道）估计，2025 年全球个人奢侈品市场约为 $415B；疫情后品牌过度涨价，奢侈品可寻址消费者基数从 2019 年的 3.8 亿降至
              2025 年的 3.35–3.45 亿。该 TAM 中活跃买家占比从约 60% 降至 40–45%。向往型奢侈品——与 Quince 向上换购消费者最直接相关的入门细分——在 2025 年明显走弱，Bain
              明确提到消费者转向 Quince 等可负担品牌。美国个人奢侈品约占全球总额 25–30%，意味着约 $100–125B，其中 Quince 瞄准的是可负担或入门层。


              镜头 3——自上而下的美国可负担奢侈线上市场：对美国服装套用 35–40% 电商份额（与 Census Monthly Retail Trade 数据显示电商渗透率稳步上升一致），美国线上服装市场约为
              $130–180B。高端 / 可负担奢侈子层——定义为价格高于大众快时尚、低于超奢，单价约 $50–$500 的产品——估计占线上服装支出的 20–25%，仅美国就对应约 $26–45B 的可负担奢侈线上服装
              TAM。


              镜头 4——自下而上的家庭支出模型：美国约有 1.3 亿户家庭；约 4,000–5,000 万户家庭收入超过 $75,000，是最可能在线购买高端基础款的群体。若每户每年在可负担奢侈线上服装上花
              $300–500，并在高端家纺上花 $75–150，合计年度 TAM 约为 $15–33B。加入加拿大住户（HHI 等效区间约 400–500 万户）后，北美 TAM 扩展至约 $17–37B。


              镜头 5——Quince 隐含 SOM：Quince 披露的 2025 年 $1B+ 收入提供了一个具体 SOM 锚点。套用 5–8% 市场渗透率假设（与 Series E 规模的高速增长挑战者品牌相符），隐含
              SAM 约为 $12–20B。这一自下而上的反推，与镜头 3 和 4 大致互相校验。


              矛盾与缺口：Technavio 对美国线上时尚零售的分析采用更宽市场定义，会导出更大的数字，但访问受限，无法完整调和。UNCTAD 2026 年 1
              月全球贸易更新提到电商交易量增长扩大，但不分品类。北美可负担奢侈 D2C 细分缺少单一可审计市场规模数字；本章采用的 $25–35B TAM
              估计是三角校验后的中枢区间，存在重大不确定性。家居用品和家纺相邻市场规模——估计北美高端线上为 $3–6B——很大程度取决于 Quince 如何定义其家居品类，而公司未公开披露。
