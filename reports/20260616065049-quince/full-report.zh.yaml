      - number: '4.3'
        title: 成本结构、营运资本与关税敞口
        blocks:
          - type: paragraph
            body: >-
              相比传统零售，Quince 成本结构在结构上更轻：没有门店租约，没有批发分销利润，没有堆在百货商店地板上的过剩季节性库存。公司每周用 AI 驱动的 SKU
              和尺码级需求预测，并在放量前进行小批量生产测试，把库存周期压缩到数周，而不是传统服饰采购常见的三到六个月。工厂页面确认直接工厂合作包括包装和运输，意味着入境物流被部分吸收到单件成本中，而不是单独列支。相比持有数月预置库存的同行，营运资本方向上更有利；但公司收入快速增长（已确认
              $1B，Sacra 估算约 $2B）意味着绝对金额上的营运资本基数已经很大且仍在扩大。进口关税是对利润率最重大的宏观风险。Federal Reserve 于 2026 年 4 月发布的 FEDS 笔记发现，截至
              2026 年 2 月，2025 年 11 月前实施的关税把核心商品 PCE 价格推高 3.1%，且几乎完全传导。Yale Budget Lab 追踪器显示，来自中国的服饰进口面临的混合关税较 2025
              年前水平显著上升。Quince 从中国、印度、柬埔寨、蒙古、土耳其和意大利采购；其中中国和东南亚敞口直接卷入当前关税制度。Tax Foundation 估计，2026 年关税上调将增加约 $98 billion
              联邦收入，给依赖进口的 DTC 零售商带来显著压力。Quince 没有披露计划如何吸收、转嫁或缓释关税成本。Census Bureau 贸易数据确认，随着关税影响沿供应链扩散，美国服饰和纺织品进口在 2026
              年初下滑。此外，Quince 面临 Tapestry、Williams-Sonoma 的主动产品责任诉讼，以及一起指控欺骗性「删除线」定价的消费者集体诉讼，形成无法用公开证据建模的或有成本敞口。
