  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >
              Quince 位于两个相互独立但有关联的市场交界处：线上 D2C
              高端基础款与可负担奢侈服装市场，以及相邻的线上高端家居用品和家纺市场；两者主要服务北美。其可寻址市场明确不是完整的全球奢侈品市场、大众快时尚市场，也不是线下百货服装零售。


              纳入的消费边界包括：（a）用天然或高品质材料（羊绒、真丝、亚麻、美利奴羊毛、有机棉）制作、价格低于可比奢侈零售 60–80% 的高品质日常必需品在线 D2C
              销售；（b）通过直销电商销售的高端家纺和床品；（c）通过同一 D2C 渠道、以可负担奢侈价格点销售的配饰、珠宝、鞋、美妆和健康产品；以及（d）Quince 的 B2B
              线（企业礼赠、酒店、品牌化门店）作为次要收入流。不纳入 Quince
              实际可寻址市场的包括：通过百货商店或品牌精品店销售的传统奢侈零售（Saks、Bergdorf、Nordstrom）；超奢和传统奢侈品牌（Hermès、Chanel、Bottega
              Veneta）；大众快时尚（Shein、H&M、Zara）；折扣线下零售（TJX、Marshalls、Ross）；以及 Quince 并非主品牌的 B2B 批发或贴牌渠道。


              Quince 消费者可能选择的主要现状替代品包括：（1）Everlane、J.Crew、Naked Cashmere 等中端 D2C 高端品牌——Quince 在可比材料上展示出 50–80% 的直接价格优势（按
              Quince 公开成本透明页面，一件 Quince 羊绒衫 $50，而 J.Crew 为 $148、Everlane 为 $178、Naked Cashmere 为
              $295）；（2）销售向往型和当代风格品牌的传统百货商店（Nordstrom、Macy's、Bloomingdale's）；（3）中端奢侈品牌的入门产品（Coach/Tapestry、Kate
              Spade、Tory Burch、Burberry 配饰）；以及（4）Amazon 自有品牌和平台市集上的基础商品。


              Quince 的关键相邻领域——家纺、家居用品、健康和美妆——是已经推进中的自然 M2C 品类扩张。公司已公开披露厨具、床品面料、棉质床品和美妆上线。每个相邻领域都有一批 D2C 在位者（床品中的 Boll &
              Branch 和 Casper Sleep；可持续床垫中的 Avocado Green），Quince 同样可用工厂直连定价优势与其竞争。
