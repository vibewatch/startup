      - number: '5.6'
        title: 技术护城河评估
        blocks:
          - type: paragraph
            body: >-
              Quince 的技术护城河是运营型的，而不是软件 IP 型。可观察竞争优势集中在三处：（1）直接工厂关系的深度和排他性，使其能以低于零售成本采购天然纤维基础款；（2）运营基础设施——海关自动化、跨 8
              个国家的物流编排、SKU 级需求数据——让供给能精准匹配需求；（3）产品页上的 “Beyond Compare”
              转化架构，这是有效的获客机制，但面临持续诉讼风险。前端技术栈（Gatsby、Algolia、Contentful）常规，没有技术护城河。投资人沟通中描述的 “proprietary M2C operating
              system”
              作为定制内部工具是真实的，但它不是可泛化平台，也不是能为工厂或客户创造实质切换成本的产品。Inditex（Zara）已在一体化全球供应链系统和自有物流基础设施上投入数十亿，软件和运营护城河明显更深。相比
              Everlane、Italic 等纯 DTC 同行，Quince 的规模（$1B+ 收入）和工厂集成深度构成了有意义的运营优势。2026 年招聘 MLOps 和数据平台工程师，说明 Quince 打算加深 AI
              预测层；但 ML 输出质量尚无独立验证。没有公开代码、专利或学术发表，限制了外部技术尽调。
