      - number: '6.5'
        title: B2B 客户、渠道扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              Quince Business 分部服务六个 B2B 垂直领域，包括企业礼赠、室内设计和白标制造，代表一种不同于核心 DTC 基础的客户类型。Sacra 报道称，Quince 白标制造伙伴以批发成本的 1.5 到
              3 倍转售产品，表明 B2B 渠道存在显著利润溢价。公开数据没有披露 B2B 收入占总收入的比例，因此无法用外部信源量化该渠道集中风险。2026 年 1
              月加拿大扩张代表第一个国际客户细分，但公司没有披露来自加拿大的客户指标或收入贡献。结构上，Quince
              工厂直达模式拿掉中介，创造了真实成本效率；但这也意味着制造或质量失败会在没有中间质量控制缓冲的情况下直接触达消费者。渠道集中风险是真实的：TikTok
              和达人自然获客虽然非常有效，但让公司依赖第三方平台，算法变化可能减少新客户流入。价值驱动型客户忠诚度也会对中国和印度供应链关税影响带来的价格上涨保持弹性，进而侵蚀驱动获客的价值主张。PR Newswire 的
              Series E 新闻稿将本轮融资描述为对 Quince 交付质量、价值和可持续性能力的验证，但没有披露 cohort 耐久性、流失率、NPS 或客户生命周期价值。Quince 消费者客户基础没有任何公开可得的
              NRR、GRR、cohort 存活率、NPS 或生命周期价值数据，这是外部研究完成后最重大的尽调缺口之一。
