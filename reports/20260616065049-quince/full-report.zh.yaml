      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Quince 由三位创始人共同创立，他们看到了高端零售生态中的结构性低效，并试图工程化搭出另一套系统。CEO 兼联合创始人 Sid Gupta 拥有约五年私募股权背景，此前共同创立过 Lolli and
              Pops，这家特色糖果零售商在他退出前已增长到 90 多家门店。他的财务和运营经验影响了 Quince 以数据驱动、单位经济优先的扩张方式。联合创始人兼 CTO Sourabh Mahajan 负责支撑 M2C
              操作系统的技术基础设施。联合创始人兼 President Zunu Mittal 补齐了创始团队的高管覆盖，但公开资料无法确认 Mahajan 和 Mittal 更详细的职业背景。


              创始团队之下，Quince 通过新闻稿和媒体评论披露了少量职能负责人。Chief Commercial Officer Matt Lippert 是公司在战略、产品组合和 Series E
              融资上的主要公开发声者。Laurent Duray（Head of International）主导加拿大上线公告；Kelly Olsen（Head of Canada）负责加拿大运营；Joel
              Dion（Head of Legal）就 Deckers 反垄断反诉公开表态；Dakota Kate Isaacs（Head of Brand Strategy and Narrative）担任 Series E
              媒体联系人。


              关键人集中风险不低。Sid Gupta 同时担任创始人和 CEO，公开资料未披露总裁、COO
              或继任计划。董事会构成、治理结构和投资人董事席位均未公开披露；下方领导层表仅覆盖新闻稿和新闻来源确认的高管角色。完整治理和董事会尽调需要直接接触公司及其投资人。
