  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: wide
    summary: 从规模、验证、护城河、估值和风险出发，经证据权重判断走到最终 TRACK 建议，并列出上调或下调的关键条件。
    data:
      nodes:
        - id: scale
          label: 规模验证：FY2025 超 $1B，Sacra 年化收入为 $2B
        - id: moat
          label: 护城河：M2C 模式、AI 需求预测、直连工厂伙伴
        - id: growth
          label: 增长：每年同比三位数；2026 年 1 月进入加拿大
        - id: valuation
          label: 估值：$10.1B = 5–10x EV/revenue；无公开可比支撑
        - id: risks
          label: 风险：诉讼、关税、无盈利数据、优先权悬顶
        - id: decision
          label: 权衡：业务强、价格贵、不确定性高
        - id: recommendation
          label: TRACK — IPO S-1 或二级交易 ≤2.5x EV/revenue 时再看
        - id: upgrade
          label: 若满足则上调至 BUY：审计收入 ≥$2B、毛利率 ≥35%、诉讼解决
        - id: downgrade
          label: 若出现则下调至 AVOID：诉讼不利、增长 <30%、估值下调融资
      edges:
        - from: scale
          to: decision
        - from: moat
          to: decision
        - from: growth
          to: decision
        - from: valuation
          to: decision
        - from: risks
          to: decision
        - from: decision
          to: recommendation
        - from: recommendation
          to: upgrade
        - from: recommendation
          to: downgrade
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV020
      - CV022
      - CV024
  - id: FV002
    title: 收入假设与退出倍数的估值敏感性
    type: bar
    layout: wide
    summary: >-
      在不同收入假设（已确认 $1B、Sacra 年化收入 $2B、牛市 $3.4B）与退出 EV/revenue 倍数（熊市 1.5x、基准 2.5x、DTC 溢价 3.0x）组合下，推算 Quince 估值。$10.1B
      水平线标出 Series E 轮价格。
    data:
      series:
        - label: 1.5x 倍数（DTC 熊市）
          points:
            - label: $1B 收入
              value: 1.5
            - label: $2B Sacra 年化收入
              value: 3
            - label: $3.4B 牛市收入
              value: 5.1
        - label: 2.5x 倍数（DTC 基准）
          points:
            - label: $1B 收入
              value: 2.5
            - label: $2B Sacra 年化收入
              value: 5
            - label: $3.4B 牛市收入
              value: 8.5
        - label: 3.0x 倍数（DTC 溢价）
          points:
            - label: $1B 收入
              value: 3
            - label: $2B Sacra 年化收入
              value: 6
            - label: $3.4B 牛市收入
              value: 10.2
    approximationNotes: >-
      所有数值均为十亿美元。收入数字要么来自公司确认（FY2025 超 $1B），要么来自 Sacra 第三方估计（2026 年 2 月年化收入为 $2B）。退出倍数取自 Eightx 2026 DTC 服装 M&A 可比集和
      Damodaran 公开服装数据集。图中标出 $10.1B Series E 价格供参考；只有 $3.4B 牛市收入叠加 3x 倍数能达到入场价格。
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV018
      - CV039
  - id: FV003
    title: 估值与回报区间情景
    type: range
    layout: standard
    summary: 在熊市、基准和牛市情景假设下，列出低 / 中 / 高隐含退出估值，并对照 $10.1B Series E 入场价格给出指示性回报。
    data:
      items:
        - label: 熊市退出（$2.5B 收入 × 1.5x）
          low: 3
          base: 3.75
          high: 4.5
        - label: 基准退出（$3.25B 收入 × 2.25x）
          low: 6
          base: 7.5
          high: 8.75
        - label: 牛市退出（$3.75B 收入 × 3.0x）
          low: 10.5
          base: 11.25
          high: 14
        - label: Series E 入场价格
          low: 10.1
          base: 10.1
          high: 10.1
        - label: 公允价值（按 $2B 的 2.5x 估算）
          low: 3.5
          base: 5
          high: 6.5
    approximationNotes: >-
      所有数值均为十亿美元。情景区间反映收入水平和退出倍数假设的变化；完整假设见 TV003。未计入优先权堆栈前，熊市和基准情景已经意味着 Series E 回报低于成本。累计融资 $1.07B
      带来的优先权悬顶，会在下行情境中进一步压低普通股所得。公允价值估计对 Sacra $2B 年化收入套用 2.5x EV/revenue，并加入 30% 私募溢价。
    claimRefs:
      - CV005
      - CV007
      - CV009
      - CV023
      - CV036
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: wide
    summary: 面向 IC 的评分覆盖从市场质量到估值的七个维度。分数为 1–5（5 = 最强）。估值和盈利能力拖低了原本较强的整体质量画像。
    data:
      items:
        - label: 市场规模与顺风
          value: 4
        - label: 产品与技术护城河
          value: 4
        - label: 收入验证与增长
          value: 5
        - label: 客户验证与留存
          value: 4
        - label: 财务经济性（盈利能力）
          value: 2
        - label: 风险画像（诉讼、关税）
          value: 2
        - label: 估值纪律
          value: 1
        - label: 证据质量（数据完整度）
          value: 2
    approximationNotes: >-
      分数是基于八个报告章节收集证据得出的定性判断。盈利能力给 2 分，因为没有公开利润率数据；没有给 1 分，是因为 M2C 模式在结构上指向高于同业的毛利率。估值给 1 分（可观察可比中最拉伸），因为 5–10x
      EV/revenue 超过任何服装或 DTC 先例。证据质量给 2 分，因为缺少审计财务数据限制了确信度。
    claimRefs:
      - CV008
      - CV009
      - CV022
      - CV024
      - CV034
      - CV043
