      - number: '1.6'
        title: 里程碑、诉讼风险与不利事件
        blocks:
          - type: paragraph
            body: >
              Quince 从成立到 2026 年 6 月的里程碑显示，公司从两人隐身创业快速爬升为 $10B 私营平台。公司 2020 年结束 beta 上线，2025 年收入突破 $1B，2026 年 1
              月进入首个国际市场，同时维持三位数年度收入增长。2026 年 3 月 Series E 是其资本投入最高、外部关注度最高的一轮融资，将其放入少数估值 $10B+ 的私营消费公司行列。


              Quince 价格比较营销的成功——在每个产品页面突出展示竞争对手价格与自身价格对比——已引来多线诉讼。Tapestry（Coach 母公司）提起商业外观侵权诉讼。Williams Sonoma
              起诉称其虚假广告并夸大竞争对手价格。Deckers Outdoor Corp.（Ugg 母公司）提起商业外观诉讼；Quince 反诉其违反反垄断法，称 Deckers
              在销售高峰期使用「template」诉讼压制竞争。Quince 曾在较早的 Yeti 保温杯设计纠纷中胜诉（2023 年以有利于 Quince 的方式和解）。最重要的是，2026
              年北加州联邦地区法院的一起集体诉讼指控 Quince 使用虚假划线零售价进行欺骗性营销，使消费者误以为自己从此前标价中获得了异常优惠；Quince 公开拒绝置评。


              合起来看，这些诉讼构成重大悬顶风险。时尚行业的商业外观诉讼历来较难胜诉，但虚假广告和欺骗性定价指控直击 Quince
              营销策略核心；若原告胜诉，公司价格比较打法可能受限。诉讼进展、和解概率和潜在财务敞口需要专门法律尽调。
