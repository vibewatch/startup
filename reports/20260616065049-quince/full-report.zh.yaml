      - number: '7.2'
        title: 关税、贸易政策与进口合规风险
        blocks:
          - type: paragraph
            body: >-
              Quince 的 M2C 模式直接从中国、印度、柬埔寨、蒙古、土耳其和意大利的工厂采购，成本结构因此集中暴露在美国关税表正在生效或升级的国家。Yale Budget Lab 的关税追踪记录了 2025 和
              2026 年服装、纺织进口关税的连续上调；Federal Reserve 发现，截至 2026 年 2 月，这些关税已把核心商品 PCE 价格推高 3.1%，并明确提到服装价格传导。Tax Foundation
              估计，2026 年关税上调每年增加约 $98 billion 联邦收入——这是一轮广泛成本抬升，对 M2C 品牌的结构性伤害大于传统零售商，因为后者还有额外加价缓冲。传统零售商有国内库存缓冲，Quince
              则是工厂直发消费者；关税驱动的成本冲击会在没有预关税采购订单缓释的情况下直接到达。2026 年中又出现三个新政策触发点。第一，白宫行政令「Strengthening Customs
              Enforcement」（2026 年 6 月 3 日签署）要求登记进口商认证其符合供应链可追溯要求，90 天内向 CBP 提供制造商产品识别码和成分数据，并建立与海关法合规历史挂钩的「good
              standing」状态。第二，USTR 于 2026 年 3 月启动 Section 301 调查，聚焦强迫劳动进口执法失灵；拟议行动于 2026 年 6 月 2 日发布，意见征询期于 7 月 6
              日结束。第三，CBP 执行 UFLPA 的可反驳推定：任何与新疆供应链存在关联的商品，除非进口商提供大量文件，否则禁止进入美国。截至本轮报告日期，尚未发现针对 Quince 的执法行动、WRO 或 UFLPA
              Entity List 条目，因此这是一个仍在发酵的行业性敞口，而不是已确认的公司个体违规。
