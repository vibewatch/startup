  - id: TV005
    title: 论点失效与终止触发器
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - Mandel / 定价诉讼不利裁定
        - 法院要求大幅调整划线价展示，或判给集体损害赔偿 >$100M
        - 削弱转化机制；打开多州监管风险；抬高获客成本
        - 下调至回避；定价机制是重要收入驱动因素
      - - 毛利率披露低于阈值
        - 经审计或申报毛利率在任何收入 ≥$1B 的水平下低于 35%
        - 意味着 M2C 经济性没有结构模型暗示的那么好；低毛利下 DCF 跑不通
        - 下调至回避；没有利润率支撑，高倍数缺少锚
      - - 收入增长放缓
        - 经确认文件显示 FY2026 收入同比增长低于 30%
        - 支撑溢价倍数的增长溢价已经消散；倍数压缩不可避免
        - 下调至回避；基准情景变为空头情景
      - - Down-round 或 flat-round 融资
        - 下一轮股权融资估值 ≤$10.1B，且收入未相应增长
        - 表明内部标记没有新资本验证；优先权结构悬顶加重
        - 下调至回避；释放上行空间封顶信号
      - - 关税成本吸收失败
        - 2026 年 Q3 或 Q4 披露单位经济性，显示 COGS 较上一期上升 >10pp
        - M2C 模型成本优势被实质侵蚀；毛利率路径受阻
        - 下调至跟踪或回避，等待下一次披露
    notes: null
    claimRefs:
