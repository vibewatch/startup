      - number: '1.3'
        title: 资本形成、投资人与估值
        blocks:
          - type: paragraph
            body: >
              Quince 至少完成了约 $700M 已确认披露融资。最近一轮是 2026 年 3 月由 ICONIQ 领投的 $500M Series E，投后估值 $10.1B——使 Quince 进入估值 $10B
              以上的少数私营消费公司行列。ICONIQ General Partner Yoonkee Sull 将投资理由归结为 Quince 的「hyperefficient
              infrastructure」，以及其重塑零售经济、压缩周期时间、减少浪费的能力。Series E 新闻稿称，ICONIQ 在「一年强执行」之后对公司「tripling down」。


              ICONIQ 也领投了上一轮融资：2025 年初约 $4.5B 估值的 $200M Series D。因此，$10.1B 的 Series E 估值意味着 Quince
              在不到一年内估值翻倍以上，这一跃升速度同时反映了 2025 年收入里程碑，以及投资人对平台结构性运营优势的信心。参与 Series E 的投资人包括 Basis Set Ventures、Wellington
              Management、WndrCo、MarcyPen Capital Partners、Ballie Gifford、Notable Capital 和 DST Global。


              Series D 之前的融资轮次——包括任何种子轮、Series A、Series B 和 Series C——公开资料均未披露。因此，除最近两轮约 $700M 的最低值外，公司生命周期总融资额无法确认。DLA
              Piper 为 Quince 的 Series E 提供法律顾问服务，但该顾问页面在本次研究中受到限流。完整资本结构分析需要通过资料室获取股权结构表和投资条款清单。
