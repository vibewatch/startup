      - number: '6.2'
        title: 采用规模与数字触达
        blocks:
          - type: paragraph
            body: >-
              Quince 2025 年收入超过 $1 billion，Sacra 估计到 2026 年 2 月年化 run rate 接近 $2 billion。公司 2026 年 3 月以 $10.1 billion
              估值完成 $500 million Series E 融资，Digital Commerce 360 和 Retail Dive 均确认其三位数增长率。SEMrush 流量数据显示，截至 2026 年 5
              月，quince.com 全球排名约 1,809，美国排名约 406，说明它已是美国前 500 的零售和电商目的地。Google Play 应用把免运费和 365 天退货窗口作为主要获客工具。加拿大于 2026
              年 1 月成为 Quince 第一个国际市场。活跃订阅用户数、会话到购买转化率或客户生命周期价值数据均未公开。Sacra 称，经 TikTok
              和达人合作完成的自然获客仍是主要增长驱动；如果算法变化降低自然触达，这会带来渠道集中风险。$10.1 billion 估值意味着投资人相信公司会继续扩张，但这种信心建立在外部信源不可见的私人留存和 cohort
