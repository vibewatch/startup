      - number: '6.4'
        title: 退货政策、留存信号与投诉摩擦
        blocks:
          - type: paragraph
            body: >-
              Quince 最重要的客户留存机制是结构性的：大多数商品享有 365 天退换货窗口。这项政策给客户更长时间评估合身度、质量和耐用性，消除了 DTC 服饰购买中的主要风险。FindThisBest 退货评分
              4.2/5，说明该政策在实践中执行得还算合理。但对先买后付客户，退货窗口有限制：PayPal 退货限 180 天，Afterpay 限 120 天，Klarna 限 180
              天。这些限制会给使用结账融资的细分人群制造摩擦，而这部分用户很可能在 Quince 价格敏感买家画像中占比更高。客服每天上午 8 点到晚上 8 点通过聊天和短信服务，工作日美东时间上午 9 点到下午 6
              点可电话回拨。最严重的摩擦不是运营问题，而是法律问题：WWD 报道称，美国加州北区地区法院收到一份修订后的集体诉讼起诉书，指控 Quince 使用虚假的传统零售参考价格，制造消费者省钱的假象。Forbes
              另行提到 Tapestry 和 Williams-Sonoma 关于涉嫌设计相似的诉讼，而 Quince 赢下了 Deckers Brands
              的诉讼。如果定价集体诉讼胜诉，将直接攻击该品牌的核心消费者信任主张，因为价值感依赖客户相信比较价格是真实市场价格。Business Insider
              多年产品测试发现，亚麻和真丝品类持续存在质量短板；这是反复出现的上游摩擦，365 天退货政策能补偿但无法消除。
