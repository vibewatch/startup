      - number: '4.4'
        title: 资本充足性、融资历史与 runway 含义
        blocks:
          - type: paragraph
            body: >-
              Quince 已在五轮披露融资中累计募集约 $961 million 至 $1.07 billion 股权资本。按本章当前信源梳理，时间线从 Insight Partners 领投的 $50 million
              Series A（Founders Fund、Basis Set Ventures、FJ Labs 和 8VC 参投）开始，经过约 $77 million 的 Series B、2025 年 1 月
              Notable Capital 与 Wellington Management 共同领投的 $120 million Series C（DST Global、Basis Set Ventures 和 8VC
              参投）、2025 年 7 月 ICONIQ Capital 领投、估值 $4.5 billion 的 $200 million Series D，最后是 2026 年 3 月再次由 ICONIQ 领投、Basis
              Set Ventures、Wellington Management、WndrCo、MarcyPen Capital Partners、Baillie Gifford、Notable Capital 和 DST
              Global 参投、估值 $10.1 billion 的 $500 million Series E。Series E 后累计融资约 $961–1,070 million；Sacra 的 $1.07
              billion 数字确认了这一点，略高于披露单轮融资合计，可能反映较小的未披露过桥轮。Series E 募集的 $500 million 将用于 M2C
              平台的持续增长和全球扩张。公司没有披露月度烧钱、当前现金余额或预计 runway。按 Sacra $2B 年化估算暗示的收入轨迹，并假设成熟 DTC
              毛利结构，公司用于经营亏损、营运资本增长和平台投资的现金需求，会被大额毛利美元抵消；Quince 在需要额外融资前实现现金流盈亏平衡或接近盈亏平衡是可能的，但没有公开证据确认。DLA Piper 在 Series
              E 中的顾问角色已公开确认，证明了该交易的法律基础设施。管理团队拒绝评论 IPO 计划；估值和投资人组合（ICONIQ 三次加码、Wellington、Baillie
              Gifford）显示，公司可能正在评估公开市场路径，但没有披露时间表。
