      - number: '7.6'
        title: 缓释、监测与击穿论点的触发点
        blocks:
          - type: paragraph
            body: >-
              可投资的风险路径可以收窄，但需要沿三条线主动监测。诉讼方面：Quince 7 月 16
              日的驳回动议听证是下一个拐点；驳回会显著降低近期损害赔偿敞口，若被拒绝，案件将走向集体认证，而击穿投资论点的风险正集中在那里。贸易 / 关税方面：公司的定价弹性和工厂直连模式应允许部分关税传导，但投资者应在
              HTS 编码层面，把中国原产关税栈与 Quince 产品组合逐项对标——这项尽调公司自身应该能提供。供应链方面：没有任何公开强迫劳动审计是一项必须在投钱前解决的尽调缺口；由具备资质的第三方按 UFLPA
              标准做交割前供应链审计，将显著降低 CBP 扣留这一二元风险。Quince 创始团队集中度（Sid Gupta、Sourabh Mahajan、Zunu Mittal）是标准 Series E
              人员风险；唯一可监测的是媒体和招聘模式中的领导层稳定信号。硬性叫停标准是欺骗性定价禁令与关键 SKU 品类的 UFLPA 扣留同时激活——这两件事合在一起会同时损害品牌叙事和库存供应链，不是 $500M
              资本能迅速补上的。
