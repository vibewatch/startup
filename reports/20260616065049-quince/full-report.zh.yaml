      - number: '1.5'
        title: 产品组合与全球运营
        blocks:
          - type: paragraph
            body: >
              Quince
              产品组合覆盖六大类：服装（羊绒、真丝、亚麻、有机棉、牛仔、运动服）、配饰（皮具、高级珠宝、包袋、太阳镜）、家居用品（床品、毛巾、地毯、家具、包括鱼子酱套装在内的厨具）、美妆、健康和旅行用品。服装仍是主要获客载体——羊绒和真丝产品尤其能建立信任，并把客户带入家居和配饰品类。公司用限量发售和小批量稀缺感制造购买紧迫性，但不依赖潮流周期，这套打法来自奢侈品行业。


              Quince 只与符合或超过全球工作场所安全与公平工资指南的中型家族工厂和大型专业制造商合作。同一批工厂也为知名奢侈品牌生产，使 Quince
              能以反映真实材料和人工内容、而非品牌加价的生产成本，采购可比材料品质（Grade-A
              蒙古羊绒、意大利皮革、欧洲亚麻）。工厂物流至少横跨亚洲、欧洲、印度和意大利等八个国家，产品直接发给消费者，绕开本土仓储和分销中心。


              公司的物流技术自动化处理所有发货地区的报关文件、国家特定税费、货运追踪和异常流程。2026 年 1 月加拿大上线时，Quince 在 quince.ca
              推出本地化加拿大体验，标价包含所有关税和税费，确保结账价格完全透明——这是品牌透明优先理念在跨境零售中的直接落地。截至 2026 年 6 月，英国、德国和西班牙的活跃招聘确认欧洲扩张已进入运营推进阶段。
