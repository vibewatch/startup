      - number: '1.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 结构性 M2C 成本优势叠加 $10.1B 投资人验证
            body: >-
              Quince 的 Manufacturer-to-Consumer 模式砍掉五到七层传统供应链，将库存周期从数月压到数周，并用 AI 驱动的周度 SKU 级预测减少过度生产浪费。带来三位数年度收入增长、推高至
              $1B+ 顶线的，不只是定价，而是这套结构性打法；同时公司仍维持消费者信任信号（Trustpilot 4.8/5）。ICONIQ 在 Series E 以 $10.1B 估值继续加码，距离其以 $4.5B
              估值领投 Series D 不到一年，这是公开来源中最强的外部验证，指向平台运营韧性。
            calloutType: strength
