companyProfile:
  summary: >-
    Quince 是一家位于旧金山的消费电商平台，2018 年由 Sid Gupta（CEO）、Sourabh Mahajan（CTO）和 Zunu Mittal（President）创立。公司的
    Manufacturer-to-Consumer（M2C，制造商直连消费者）模式砍掉传统零售中介——采购代理、批发商和分销商——以其声称低于传统零售 50–80% 的价格销售高品质服装、家纺、皮具、配饰和食品。平台主要通过
    quince.com 和 Quince 移动应用销售，FY2025 顶线收入突破 $1B——公司官方 Series E 新闻稿已确认——并在 2026 年 3 月完成由 ICONIQ 领投的 $500M Series E，投后估值
    $10.1B。Sacra 估计，截至 2026 年 2 月，其年化收入节奏接近 $2B。Quince 称，自上线以来每个财年收入均实现三位数同比增长，服务数百万客户，主要在北美；加拿大是其 2026 年 1 月进入的首个国际市场。
