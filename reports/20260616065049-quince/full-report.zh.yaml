      - number: '3.3'
        title: 能力、定价与渠道对比
        blocks:
          - type: paragraph
            body: >
              相比直接 D2C 同行，价格架构是 Quince 最持久的商业优势。ReviewPromo 2026 年 6 月分析（与本报告同日更新，基于 196,000 多条已验证买家评论）发现，Quince 羊绒衫价格低于
              Everlane 40–60%，且在该特定品类中没有明显品质牺牲——对按每美元品质衡量的可负担奢侈买家来说，它是明确的价值领导者。Naadam 在同等羊绒单品上比 Quince 贵 20–80%，用更优采购产地和
              Business Insider 评测者认定的略好整体品质解释溢价。Italic 工厂直连商品的会员价格与 Quince 标价有竞争力，但 $100 年费增加摩擦，抬高了低频买家的有效成本。


              渠道架构上，Quince 只在线上运营，没有实体零售足迹，因此能避开零售开销并把节省让给消费者。Everlane 的全渠道存在（门店 + 线上）带来发现和忠诚价值，但相对 Quince
              的固定成本结构压缩利润率。Uniqlo 全球 2,400 多家门店——包括北美 200 多个网点——带来 Quince 无法匹配的实体分销优势。Zara 的快时尚模式（每年 12–24
              个系列，趋势反应式采购）处于不同战略象限：Quince 明确瞄准拒绝趋势轮转、偏好材质驱动持久性的买家，因此 Zara 争夺的是可选钱包份额，而不是同一场景或同一动机。


              ManyOutfits 评测者发现，Quince 的羊绒和亚麻在即时柔软度和价格 / 品质上更强，而 Everlane 的棉质和牛仔产品在耐用性和收边上结构性更优。这种品类级模式——Quince
              在柔软奢侈面料领先，Everlane 在结构化基础款领先——说明两个品牌是部分替代，而非完全替代。Quince 365 天退货窗口显著长于 Everlane 30 天政策，降低首次购买风险，并赋予 Quince
              获客优势。两家公司均未披露毛利率；D2C 服装行业基准为 50–65%，Quince 的 M2C 成本结构合理支持处于该区间高端或以上的利润率。
