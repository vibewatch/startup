            body: >-
              Quince 真正的护城河不是软件 IP，而是 100+ 直接工厂关系、跨 8 个国家的跨境物流自动化，以及每周 SKU
              级需求响应能力的组合；这套能力让库存浪费低于传统零售。这些运营优势会随规模复利，也很难被更轻资产的 DTC 同行快速复制。
