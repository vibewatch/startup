figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: >-
      Quince 的公开里程碑从 2018 年创立延伸到 2026 年 3 月 $10.1B 估值的 Series E 轮。增长曲线把连续规模节点（2020 年商业化上线、2025 年收入 $1B）与 2026
      年诉讼复杂度上升、国际扩张加速放在同一条线上。
    data:
      items:
        - date: '2018'
          label: 创立于 San Francisco
          detail: Sid Gupta、Sourabh Mahajan 和 Zunu Mittal 创立 Quince，用工厂直连的 M2C 模式从基础设施层重做零售。
          tone: positive
          claimRefs:
            - CO002
        - date: '2020'
          label: 结束 beta，商业化上线
          detail: Quince 公开上线，主打 $50 羊绒衫和 $60 真丝连衣裙；Instagram 带动病毒式增长；M2C 价格—质量假设得到验证。
          tone: positive
          claimRefs:
            - CO006
        - date: 2021-11
          label: 发布工程博客；17 人技术团队
          detail: '"Meet Quince" 技术博客描述五个工程垂直方向和自有供应链平台；撰写时工程团队 17 人。'
          tone: positive
          claimRefs:
            - CO009
            - CO028
        - date: '2023'
          label: Yeti 商业外观诉讼以有利 Quince 的方式和解
          detail: 早期 IP 裁定有利；确认经典基础款设计在面对侵权主张时具备一定商业外观保护。
          tone: neutral
          claimRefs:
            - CO043
        - date: 2025-Q1
          label: Series D — $200M，估值 ~$4.5B
          detail: ICONIQ 领投 $200M Series D，估值约 $4.5B；验证平台经济性，并为后续轮次锁定领投方关系。
          tone: positive
          claimRefs:
            - CO022
        - date: '2025'
          label: 收入超过 $1B
          detail: FY2025 收入突破 $1B；自创立以来保持同比三位数增长；公司在 Series E 公告中公开确认该里程碑。
          tone: positive
          claimRefs:
            - CO025
            - CO026
        - date: 2026-01
          label: 加拿大上线 — 首个国际市场
          detail: Quince 正式上线 quince.ca；设立多伦多专属团队；标价已预含关税和税费，确保完全透明。
          tone: positive
          claimRefs:
