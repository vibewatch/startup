      - number: '3.2'
        title: 竞争对手画像与供应链架构
        blocks:
          - type: paragraph
            body: >
              Everlane 成立于 2011 年，在美国 D2C 服装中开创了激进透明定价模式，为每件产品公开完整成本拆解（材料、人工、运输、关税和加价），并披露工厂名称。这一定位在伦理购物倡导者中制造了心理切换成本，而
              Quince 相对不透明的工厂命名方式无法复制。Everlane 运营混合全渠道模式——在纽约、旧金山、洛杉矶和其他美国城市开店，同时经营电商——增加了 Quince
              纯线上模式所避免的零售开销，但也提供了线下发现和忠诚触点。Everlane 估计外部总融资约 $137M——来自包括 Bling Capital、L Catterton 和 G9 Ventures
              在内的投资人，Tracxn 和 PitchBook 数据显示总投资人 18 家——只是 Quince 已披露 $700M+ 的一小部分。Everlane 自 2019–2020 年前后约 $100M
              收入报道之后，未披露重大收入增长里程碑；其 2026 年融资状态和估值无法从公开来源确认。


              Fast Retailing（Uniqlo）是一家日本上市集团，H1 FY2025 收入达到创纪录的 2.0552 万亿日元（同比 +14.8%），确认北美、欧洲和大中华区仍保持强劲增长。Uniqlo 的
              LifeWear 战略强调功能性持久、高品质基础款，以及通过大规模工厂合作实现的垂直供应链控制——概念上类似 Quince 的 M2C 逻辑，但执行在大众市场规模，并依托全球 2,400 多家实体门店。Zara
              母公司、全球最大专业服装零售商 Inditex 提交的 2026 年股票回购报告与成熟资本回报阶段一致；其规模（年净销售额 400 亿欧元以上）碾压所有 D2C 新进入者，并给它带来无可匹敌的全球零售分销护城河。


              Italic 基于与 Quince 结构相似的工厂直连前提运营，但通过年度会员费（约 $100/年）设门槛，宣称覆盖服装、家居和配饰等品类的 1,000 多个产品，并强调会员专属工厂价和策展选择深度。Naadam
              直接与蒙古游牧牧民合作采购羊绒，保持更紧的产地叙事，并占据品质优于价值的位置；Business Insider 评测者认为其在羊绒上相对 Quince 略有整体品质优势。
