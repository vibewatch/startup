          - type: callout
            title: 关税敞口和欺骗性定价诉讼带来重大未建模成本
            body: >-
              Quince 从中国、印度、柬埔寨、蒙古和土耳其采购——这些来源地在 2025–2026 年都受到重大美国进口关税上调影响。Federal Reserve 估计，截至 2026 年 2 月，关税带来 3.1%
              的核心商品 CPI 上行，且几乎完全传导。Quince 没有披露如何吸收或转嫁关税成本。同时，加州北区一起消费者集体诉讼指控 Quince
              的「删除线」传统零售价是虚构的，直接威胁每个产品页上的核心转化机制。如果集体诉讼胜诉或禁令获批，驱动转化的定价架构将需要重构。
            calloutType: risk
