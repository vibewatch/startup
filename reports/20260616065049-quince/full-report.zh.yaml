      - number: '3.6'
        title: 展示材料
        blocks:
          - type: callout
            title: M2C 成本架构是 Quince 耐久的第一护城河
            body: >-
              M2C 操作系统——两到三步工厂流程，对比行业标准七步以上流程，再叠加把库存周期从数月压缩到数周的 AI 需求预测——以 Quince 的速度和规模复制起来很难。八年工厂关系、专有需求信号数据集，以及 $700
              million 以上融资用于投资物流和技术，形成不断复利的壁垒，保护其成本优势。分析样本中的 D2C 同行没有一家接近这种运营深度。
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP035
          - type: callout
            title: 质量不一致和诉讼敞口是最可操作的近期风险
            body: >-
              评论者持续指出，Quince 的牛仔、棉质基础款和结构化外套在做工和耐用性上不如
              Everlane——这是品类层面的脆弱点；如果经社交媒体放大，可能泛化成全品牌可信度受损。同时，四家既有原告的主动诉讼显示，资源充足的既有企业把 Quince 视为实质威胁，并准备把 IP
              执法当作竞争工具。两项风险都需要主动管理：对表现落后的 SKU 品类定向投入质量，以及为进行中的诉讼准备充足法律储备和沟通策略。
