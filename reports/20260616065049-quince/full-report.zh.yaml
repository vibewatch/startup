            title: Sacra 收入估算作为可信上限处理
            body: >-
              Sacra 估计 Quince 到 2026 年 2 月达到约 $2.0 billion 年化收入，高于 2024 年的 $340 million。公司已确认的 $1 billion
              下限和其声明的三位数增长轨迹，让 $2B 估算在方向上可信；但 Sacra 估算来自二级信号（网站流量、银行卡消费模型），没有经过审计，也未获公司确认。本章所有财务模型均以 $1B+
