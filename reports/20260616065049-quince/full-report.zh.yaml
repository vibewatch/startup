      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 估值溢价无法由可比组解释
            body: >-
              即便采用 Sacra 的 $2 billion run-rate——一个未经审计的第三方估计——$10.1 billion Series E 仍隐含 5.1x EV/revenue。可观察的上市服装或 DTC
              公司，以及 2022–2026 年记录内已完成 M&A 交易，没有一个突破 3x EV/revenue；除非处在品牌热度峰值条件下（VF/Supreme 2020 年 4.2x，后来修正到
              2.3x）。如此幅度的溢价，只能靠前瞻性假设来解释：Quince 增长率延续，盈利能力浮现——而这两个条件在 Series E 完成时都未验证。
            calloutType: insight
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV015
          - type: callout
            title: 诉讼创造未量化或有负债
            body: >-
              Mandel v. Last Brand Inc. 集体诉讼（3:25-cv-09780，N.D. Cal.）和 Williams Sonoma
              虚假广告诉讼，攻击的都是商业模式机制——参考定价和营销声明——这些机制位于 Quince
              消费者转化和品牌定位的核心。任一案件出现不利裁定，都可能迫使运营改变，推高客户获取成本或降低转化率，从而直接损害支撑溢价倍数的收入增长假设。任何公开披露都没有量化这两项或有负债。
            calloutType: risk
            claimRefs:
              - CV024
              - CV025
          - type: callout
            title: 当前条件下熊情景仍然可信
            body: >-
              Quince 在未来流动性事件中被标记到 $3.0–3.75 billion——较 Series E 下跌 63–70%——这样的熊情景不是尾部风险。如果收入增长降至
              30–50%，且公司未能在下一轮融资前证明盈利能力，它就是基准情景。在 $3–4 billion 退出价值下，$1.07 billion 优先权栈会吸收大部分回款，普通股几乎不剩价值。DTC down-round
              先例（Bonobos 0.4x、Allbirds 从 IPO 走向退市）确认，高增长 DTC 品牌若无法把增长转化为可持续单位经济，这条轨迹很常见。
            calloutType: assumption
            claimRefs:
              - CV016
              - CV023
              - CV039
              - CV040
