      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 关税顺风在结构上利好 M2C 模式
            body: >-
              2025–2026 年美国关税制度为 Quince 创造了非对称优势。传统零售供应链在多个节点传导关税成本（工厂 → 进口商 → 分销商 → 零售商），放大消费者价格影响。Quince
              的工厂直连模式砍掉大部分节点，意味着每一美元消费者支出对应的有效关税敞口低于中介密集的在位者。传统零售商为收回关税转嫁成本而提价时，Quince
              相对竞争对手的绝对价格差应会扩大；在消费者最价格敏感的时点，反而强化其核心价值主张。
            calloutType: strength
            claimRefs:
              - CM031
              - CM034
              - CM035
          - type: callout
            title: 双重关税敞口——贸易战两端都受压
            body: >-
              Quince 受益于关税驱动的竞争对手价格通胀，但其自身位于亚洲的制造基地——包括中国和其他高关税国家的工厂——也让自有采购商品面临投入成本上升。关税对 Quince
              竞争地位的净影响取决于两种效应的相对大小：竞争对手零售价格上涨 vs. Quince 自身到岸成本通胀。Quince 未公开披露供应链地域拆分，因此净关税敞口规模是重大未解尽调问题。
            calloutType: risk
            claimRefs:
              - CM031
              - CM034
              - CM039
          - type: callout
            title: 欺骗性定价诉讼威胁核心价值主张
            body: >-
              北加州联邦地区法院集体诉讼称，Quince 划线「traditional retail」参考价系捏造，而非 Quince
              或任何其他零售商实际收取过的价格；该指控击中公司品牌身份的根基：激进价格透明。若指控成立，Quince 用来把首次购买者转化为复购客户的信任会被削弱，投资论点的基础也会受损。Quince
              拒绝就诉讼置评。这是重大声誉和财务风险，需要主动法律尽调。
            calloutType: risk
            claimRefs:
              - CM040
              - CM039
          - type: callout
            title: 市场规模不确定不可避免——把它当作尽调信号
            body: >-
              公开市场上没有针对「北美线上可负担奢侈 D2C 服装」的分析师估算，这本身就有意义。它说明 Quince 用来支撑 $10.1B 估值的主要市场边界，并不是标准行业类别。投资人和分析师无法用第三方市场报告直接验证
              TAM。最接近的公开估算（Grand View Research 全球服装、Bain 全球奢侈品）采用的市场边界比 Quince 实际可寻址机会宽几个数量级。本文使用的 $25–35B TAM
              三角测算方向上合理，但需要一手研究（客户调查、电商面板数据）才能达到投资级精度。
