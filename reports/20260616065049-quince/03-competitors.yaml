  - id: TP004
    title: Moat Durability / Competitive Risk Register
    columns:
      - Moat Claim
      - Primary Threat
      - Severity
      - Mitigation Path
      - Diligence Ask
    rows:
      - - M2C factory-direct supply chain
        - New entrants with capital replicating factory-direct model (e.g., Italic precedent)
        - Medium
        - Scale, data tenure, and operational depth as barriers; 8-year factory relationship depth
        - Map Quince's factory exclusivity terms and switching-cost obligations
      - - AI demand-forecasting cost advantage
        - Incumbents investing in similar tools; open-source forecasting commoditization
        - Medium
        - Proprietary training data (8+ years of M2C demand signals) as data moat
        - Review algorithm IP protection; assess data-exclusivity rights with factory partners
      - - Pure-D2C cost structure (no retail overhead)
        - Tariff escalation on Asian manufacturing compressing the factory-direct cost advantage
        - Medium-High
        - Some geographic factory diversification possible; tariff exposure partially shared by all apparel players
        - Audit factory geography concentration vs. 2025–2026 tariff schedule
      - - Premium-materials brand narrative
        - Quality inconsistency in denim/cotton/structured categories damaging brand credibility
        - Medium
        - Investment in quality control and category-specific sourcing upgrades
        - Commission independent product quality audit across 10+ Quince SKU categories
      - - No loyalty lock-in (intentional open model)
        - Multi-homing behavior; competitor loyalty/membership programs capturing Quince buyers
        - Low-Medium
        - Potential to introduce loyalty features without full membership friction
        - Survey repeat-purchase cohorts; measure share-of-wardrobe vs. competitor brands
    notes: >-
      Severity ratings are analyst judgments based on public evidence; not quantitative risk scores.
      Diligence asks require direct company engagement or proprietary data access to resolve.
