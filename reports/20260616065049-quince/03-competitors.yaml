  - id: switching-costs-lock-in-distribution
    title: Switching Costs, Lock-in, and Distribution Power
    body: >
      Quince has no explicit loyalty program, membership tier, or subscription mechanism as of
      mid-2026. This is a deliberate frictionless-acquisition choice: the open transactional model
      maximizes top-of-funnel conversion by removing the membership barrier that limits Italic's
      reach. However, the absence of structured lock-in means buyers multi-home trivially—routinely
      purchasing Quince, Everlane, and Naadam within the same seasonal cycle with zero switching
      cost. In D2C apparel, there is no platform exclusivity, proprietary data format, or integration
      that creates technological lock-in analogous to enterprise software.


      Everlane's radical transparency creates a psychological switching deterrent among its core
      community of ethically oriented buyers. Consumers who identify with Everlane's factory-audit
      disclosures and sustainable-materials narrative may resist Quince's relatively opaque factory
      naming and its "Not Good Enough" rating on Good On You's sustainability assessment. This brand-
      trust moat is soft—it can erode with a single credible scandal—but it is real and targets a
      segment that Quince's price-first messaging does not fully capture. Naadam's direct-from-herd
      Mongolian cashmere provenance story operates similarly: the emotional connection between buyer
      and herder community creates retention that is not solely price-driven.


      Uniqlo's physical store network is the most durable distribution moat in this competitive set.
      Its 200-plus North American locations provide in-store discovery, try-on capability, returns
      processing, and brand encounter that no online-only brand can replicate. Fast Retailing's H1
      FY2025 record performance and its spring 2026 Los Angeles Dodgers partnership signal continued
      North America investment—a long-term risk to Quince if Uniqlo aggressively expands its premium
      materials SKUs. Italic's membership fee (approximately $100/year) creates a sunk-cost retention
      mechanism absent in Quince, but also caps Italic's total addressable user pool to committed
      buyers, limiting its scale ambition relative to Quince's frictionless open model.
    claimRefs:
      - CP029
      - CP030
      - CP031
      - CP032
      - CP033
