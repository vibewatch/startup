summary:
  headline: >-
    Quince 的 M2C 模式和 >$1B 收入里程碑确实扎实，但 $10.1B Series E 隐含 5–10x
    EV/revenue，公开资料撑不住；正在推进的欺骗性定价诉讼又带来二元法律风险。在利润率数据与诉讼结果提高承销能见度前，应维持跟踪。
