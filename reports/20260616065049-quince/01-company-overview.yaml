  - id: founders-and-leadership
    title: Founders, leadership, and governance
    body: >
      Quince was co-founded by three individuals who identified structural inefficiencies in the premium
      retail ecosystem and set out to engineer a different system. Sid Gupta, CEO and co-founder, brings
      a background in private equity spanning approximately five years and previously co-founded Lolli and
      Pops, a specialty candy retailer that grew to more than 90 stores before his exit. His financial
      and operational background informs Quince's data-driven, unit-economics-first approach to scaling.
      Sourabh Mahajan, co-founder and CTO, leads the technology infrastructure underlying the M2C
      operating system. Zunu Mittal, co-founder and President, rounds out the founding team's executive
      coverage, though detailed professional background for Mahajan and Mittal is not confirmed from
      available public sources.


      Below the founding team, Quince has disclosed a small set of functional leaders through press
      releases and media commentary. Matt Lippert, as Chief Commercial Officer, is the primary public
      voice on strategy, product portfolio, and the Series E financing. Laurent Duray (Head of International)
      led the Canada launch announcement; Kelly Olsen (Head of Canada) oversees Canadian operations;
      Joel Dion (Head of Legal) issued public statements on the Deckers antitrust counter-claims; and
      Dakota Kate Isaacs (Head of Brand Strategy and Narrative) served as the Series E media contact.


      Key-person concentration risk is meaningful. Sid Gupta occupies the dual role of founder and CEO
      with no publicly named president, COO, or successor plan disclosed in available sources. Board
      composition, governance structure, and investor board seats have not been publicly disclosed;
      the leadership table below covers only confirmed executive roles from press release and news sources.
      Full governance and board diligence requires direct engagement with the company and its investors.
    claimRefs:
