  - id: products-and-global-operations
    title: Product portfolio and global operations
    body: >
      Quince's product portfolio spans six broad categories: apparel (cashmere, silk, linen, organic cotton,
      denim, activewear), accessories (leather goods, fine jewelry, bags, sunglasses), home goods (bedding,
      towels, rugs, furniture, kitchenware including caviar sets), beauty, wellness, and travel goods.
      Apparel remains the primary customer acquisition vehicle—cashmere and silk products in particular
      build the trust that drives customers into home and accessories categories. The company uses limited
      drops and small-batch scarcity to create purchase urgency without relying on trend cycles, a playbook
      drawn from the luxury sector.


      Quince partners exclusively with mid-sized family-run factories and larger specialist manufacturers
      that meet or exceed global workplace safety and equitable wage guidelines. The same factories produce
      for well-known luxury brands, enabling Quince to source comparable materials quality (Grade-A
      Mongolian cashmere, Italian leather, European linen) at production costs reflecting actual material
      and labor content rather than brand markup. Factory logistics span at least eight countries across
      Asia, Europe, India, and Italy, with products shipped directly to consumers, bypassing domestic
      warehousing and distribution centers.


      The company's logistics technology automates customs documentation, country-specific taxation,
      shipment tracking, and exception workflows across all shipping geographies. The January 2026 Canada
      launch introduced a localized Canadian experience at quince.ca, with all duties and taxes included
      in listed prices to ensure full checkout-price transparency—a direct application of the brand's
      transparency-first philosophy to cross-border retail. Active job postings in the UK, Germany, and
      Spain as of June 2026 confirm European expansion is operationally underway.
