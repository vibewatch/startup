  - id: FO002
    title: Company snapshot logic
    type: flow
    layout: standard
    summary: >-
      Quince's operating logic connects a global specialist factory network through AI-driven demand
      forecasting and the proprietary M2C operating system to direct consumer delivery, eliminating
      the traditional retail intermediary chain.
    data:
      nodes:
        - id: factory-network
          label: Global specialist factory network
          detail: >-
            Same manufacturers as leading luxury brands; mid-sized family-run and larger ethical
            factories across Asia, Europe, India, and Italy; direct partnership, no intermediaries.
          tone: positive
        - id: ai-forecasting
          label: AI demand forecasting (weekly SKU/size level)
          detail: >-
            Forecasts demand weekly at SKU and size granularity; small-batch test orders scale based
            on real demand; inventory cycles 2–4 weeks vs. 3–6 months traditional retail.
          tone: positive
        - id: m2c-platform
          label: Quince M2C Operating System
          detail: >-
            Proprietary technology integrating supply-chain, logistics, e-commerce, growth, and
            finance verticals; automates customs, duties, production planning, and quality verification.
          tone: positive
        - id: capital
