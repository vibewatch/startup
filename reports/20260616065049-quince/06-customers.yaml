  - id: section-5
    title: B2B customers, channel expansion, and concentration risk
    body: >-
      The Quince Business segment serves six B2B verticals including corporate gifting, interior design, and
      white-label manufacturing, representing a customer type distinct from the core DTC base. Sacra reported
      that Quince white-label manufacturing partners resell products at 1.5 to 3 times the wholesale cost,
      indicating a substantial margin premium in the B2B channel. No public data exists on B2B revenue as a
      share of total revenue, making concentration risk in this channel unquantifiable from external sources.
      The Canadian expansion in January 2026 represents the first international customer segment, but no
      customer metrics or revenue contribution from Canada has been disclosed. Structurally, Quince's
      factory-direct model removes intermediaries and creates genuine cost efficiency, but it also means
      manufacturing or quality failures reach consumers without the buffer of intermediate quality controls.
      Channel concentration risk is real: TikTok and influencer organic acquisition, while highly effective,
      creates dependency on third-party platforms whose algorithm changes could reduce new customer inflow.
      Value-driven customer loyalty is also elastic to price increases from tariff impacts on Chinese and
      Indian supply chains, which could erode the value proposition that drives customer acquisition. The PR
      Newswire Series E release frames the funding as validation of Quince's ability to deliver quality,
      value, and sustainability without disclosing cohort durability, churn, NPS, or customer lifetime value.
      No publicly available NRR, GRR, cohort survival, NPS, or lifetime value data exists for Quince's
      consumer customer base, representing the most material diligence gaps after completing external
      research.
    claimRefs:
