  - id: section-4
    title: Returns policy, retention signals, and complaint friction
    body: >-
      Quince's most important customer retention mechanism is structural: a 365-day return and exchange
      window on most items. This policy eliminates the primary purchase risk in direct-to-consumer apparel
      by giving customers extended time to evaluate fit, quality, and durability. The FindThisBest returns
      score of 4.2 out of 5 suggests the policy is executed reasonably in practice. However, the return
      window is capped for buy-now-pay-later customers: PayPal returns are limited to 180 days, Afterpay to
      120 days, and Klarna to 180 days. These restrictions create friction for a checkout-financing segment
      that likely over-indexes on Quince's price-sensitive buyer profile. Customer service operates via chat
      and text from 8 am to 8 pm daily, with phone callback available 9 am to 6 pm EST on weekdays. The
      most serious friction is legal rather than operational: WWD reported an amended class-action complaint
      filed in the US District Court for the Northern District of California alleging Quince uses fake
      traditional retail reference prices to create a false impression of consumer savings. Forbes separately
      noted suits from Tapestry and Williams-Sonoma over alleged design similarities, while Quince won a suit
      from Deckers Brands. If the pricing class action succeeds, it directly attacks the brand's core
      consumer trust proposition because the value perception depends on customers believing the comparison
      prices are genuine market prices. Business Insider's multi-year product testing found consistent
      quality shortfalls in linen and silk categories, representing recurring upstream friction that the
      365-day return policy compensates for but does not eliminate.
    claimRefs:
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037
