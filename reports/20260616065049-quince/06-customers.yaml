  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: >-
        NRR, GRR, cohort survival, repeat purchase rate, NPS, and customer lifetime value data
        for Quince's consumer base.
      whyItMatters: >-
        Without retention and cohort metrics, customer durability cannot be underwritten.
        The absence of public retention data means investor conviction depends entirely on
        private data rooms.
      diligencePath: >-
        Request cohort retention by acquisition channel, repeat purchase rate by category,
        and revenue-based retention from private data during due diligence.
      relatedQuestionRefs:
        - QU026
        - QU029
    - type: access-blocked
      severity: minor
      topic: class-action-filing
      missingEvidence: >-
        The actual PACER class-action complaint document against Quince was not accessible
        via standard research channels during this chapter's research window.
      whyItMatters: >-
        The specific allegations, legal theory, and class scope in the complaint could
        materially affect how the deceptive pricing risk is calibrated.
      diligencePath: >-
        Obtain the complaint from PACER (federal court filing system) or via legal counsel
        to assess the specific pricing allegations and potential damages exposure.
      relatedQuestionRefs:
        - QU027
    - type: private-evidence-only
      severity: minor
      topic: b2b-revenue-concentration
      missingEvidence: >-
        No public breakdown of B2B revenue versus DTC revenue exists; B2B partner identities
        and contract terms are not disclosed.
      whyItMatters: >-
        B2B concentration could be a meaningful share of total revenue, and white-label
        partner concentration represents an unquantified single-customer exposure risk.
      diligencePath: >-
        Request B2B revenue share, top-ten B2B partner list, and contract renewal schedule
        from management during due diligence.
      relatedQuestionRefs:
        - QU028
      relatedTableRefs:
        - TU003
    - type: missing-source
      severity: minor
      topic: demographic-data
      missingEvidence: >-
        No independent demographic study or consumer survey specific to Quince's buyer profile
        is available in any public or licensed research source reviewed.
      whyItMatters: >-
        Without demographic data the core buyer hypothesis (female-skewed, income-aware,
        millennial) remains inferential, which limits market-sizing and competitive-position
        precision.
      diligencePath: >-
        Commission or obtain a consumer panel study on Quince buyers, or request any
        internal segmentation data shared with Series E investors.
      relatedQuestionRefs:
        - QU030
