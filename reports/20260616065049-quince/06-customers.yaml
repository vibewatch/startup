company:
  name: Quince
chapter:
  number: 6
  title: Customers
  summary: >-
    Quince demonstrates unusually strong independent consumer satisfaction via Trustpilot (4.8/5 Excellent),
    offset by a meaningful adverse signal from SmartCustomer (2.3/5) and an amended class-action complaint
    alleging deceptive reference pricing. The 365-day return policy anchors retention, but no NRR, cohort,
    or repeat-purchase rate data is publicly available, leaving customer durability unverifiable from
    external sources.
sections:
  - id: section-1
    title: Customer base and segmentation
    body: >-
      Quince serves primarily value-conscious North American consumers seeking premium-quality apparel, home
      goods, and accessories at prices the company claims are 50 to 80 percent below traditional retail. The
      manufacturer-to-consumer model positions Quince as the brand for shoppers who want cashmere, organic
      cotton, and luxury-adjacent products without paying for traditional brand markups or retail
      intermediaries. While the company claims to serve millions of customers, no independent count or precise
      demographic breakdown has been disclosed publicly. Available signals point to a female-skewed,
      income-aware primary buyer who discovers Quince through TikTok, social media influencers, and editorial
      coverage. The January 2026 collaboration with A$AP Rocky suggests a deliberate expansion push toward
      male demographics and a younger cohort. Quince also operates a B2B channel called Quince Business that
      serves six verticals: corporate gifting, interior design, white-label manufacturing, hospitality,
      branded storefronts, and uniforms. This B2B channel runs in parallel with the core DTC business but no
      revenue split is publicly available. Forbes cited PwC survey data showing 94 percent of consumers in
      2026 feel they must get the best value for money, a structural tailwind for the M2C model that Quince
      has leveraged since founding in 2018.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: section-2
    title: Adoption scale and digital reach
    body: >-
      Quince revenue exceeded one billion dollars in 2025, with Sacra estimating an annualized run rate
      approaching two billion dollars by February 2026. The company raised 500 million dollars in a Series E
      round in March 2026 at a 10.1 billion dollar valuation, with Digital Commerce 360 and Retail Dive both
      confirming triple-digit growth rates. SEMrush traffic data places quince.com at a global rank of
      approximately 1,809 and a US rank of approximately 406 as of May 2026, indicating a top-500 US retail
      and commerce destination. The Google Play app markets free shipping and a 365-day return window as its
      primary acquisition tools. Canada was launched as Quince's first international market in January 2026.
      No active subscriber count, session-to-purchase conversion rate, or customer lifetime value data is
      publicly available. Organic acquisition through TikTok and influencer partnerships remains the primary
      growth driver according to Sacra, creating channel concentration risk if algorithm changes reduce
      organic reach. The 10.1 billion dollar valuation implies investor confidence in continued scaling, but
      that confidence rests on private retention and cohort data not visible in external sources. The PR
      Newswire Series E release characterized Quince as having strong repeat purchasing behavior across its
      customer base without disclosing specific retention rates.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
    tableRefs:
      - TU002
