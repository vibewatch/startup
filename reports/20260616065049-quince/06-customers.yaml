callouts:
  - calloutType: strength
    title: Trustpilot 4.8/5 Excellent rating provides unusually strong independent satisfaction proof
    body: >-
      Thousands of independent Trustpilot consumer reviews classify quince.com as Excellent, with
      recurring mentions of fast shipping, value-for-money, and repeat purchasing behavior. This
      level of independent review volume and rating is strong evidence of broad consumer satisfaction
      at scale for a private company.
    claimRefs:
      - CU017
      - CU018
      - CU019
  - calloutType: risk
    title: SmartCustomer 2.3/5 and class-action deceptive pricing complaint are material adverse signals
    body: >-
      SmartCustomer (formerly Sitejabber) rates Quince 2.3/5 with complaints centered on product
      defects and fulfillment failures. An amended class-action complaint in the Northern District
      of California alleges Quince uses fabricated traditional retail reference prices to inflate
      perceived savings. If the pricing allegation is proven, the core consumer trust proposition
      is directly undermined.
    claimRefs:
      - CU020
      - CU021
      - CU032
      - CU033
      - CU034
  - calloutType: strength
    title: "365-day return policy structurally reduces purchase risk and supports retention"
    body: >-
      Quince's 365-day return and exchange window is a powerful structural retention tool that
      eliminates the primary risk in DTC apparel purchasing. The FindThisBest returns score of
      4.2 out of 5 confirms the policy is executed reasonably in practice. This policy
      differentiates Quince from most competitors and directly supports customer lifetime value.
    claimRefs:
      - CU029
      - CU036
  - calloutType: risk
    title: No NRR, cohort, or retention data is publicly available to underwrite customer durability
    body: >-
      Despite strong satisfaction signals, no NRR, GRR, cohort survival, NPS, or customer
      lifetime value data is publicly available for Quince. Private diligence must request cohort
      retention by acquisition channel, repeat purchase rate by category, and top-customer
      concentration before customer quality can be fully underwritten.
    claimRefs:
      - CU016
      - CU042
