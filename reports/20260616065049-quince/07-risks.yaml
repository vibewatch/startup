company:
  name: Quince
chapter:
  number: 7
  title: Risks
  summary: >-
    Quince faces five material risk clusters as of June 2026, two of which are
    already live. The Mandel v. Last Brand Inc. class action (NDCA Case
    3:25-cv-09780, filed November 2025) directly attacks the strikethrough
    reference-pricing mechanic that drives consumer conversions; an amended
    complaint broadened the case to eleven plaintiffs across seven states, and
    a motion-to-dismiss hearing is scheduled for July 16, 2026. Simultaneously,
    the June 2026 White House customs enforcement executive order and USTR
    Section 301 forced-labor actions materially escalate import-compliance and
    supply-chain traceability obligations for an M2C brand sourcing from China,
    India, Cambodia, and Mongolia. Tariff-driven margin compression is the
    most actionable near-term financial risk. Forced-labor supply-chain exposure
    and privacy/data risk remain latent sector-wide threats not yet activated
    against Quince specifically. Key-person concentration in the founding trio
    and no clear liquidity path at a $10.1B valuation complete the risk picture.

sections:
  - id: litigation-risk
    title: Deceptive Pricing Litigation and Consumer Legal Risk
    body: >-
      The most acute company-specific legal risk is already in court. On
      November 13, 2025, plaintiff Alexandra Mandel filed a class action against
      Last Brand Inc. (dba Quince) in the U.S. District Court for the Northern
      District of California (Case No. 3:25-cv-09780), alleging that Quince's
      strikethrough "traditional retail" reference pricing and "You save X%"
      messaging misleads consumers under California's False Advertising Law,
      Unfair Competition Law, and Consumer Legal Remedies Act. Rather than
      wait for the court to rule on an initial motion to dismiss, plaintiffs
      expanded the complaint in early April 2026, adding ten new plaintiffs and
      extending claims to six additional states—creating a proposed nationwide
      class of consumers who purchased Quince products within four years. Quince
      filed a fresh motion to dismiss on April 2, 2026, arguing on three grounds:
      no plausible consumer deception under the reasonable-consumer standard,
      no actionable injury because plaintiffs never allege products were worth
      less than they paid, and that multi-state class certification is unsuitable
      given the patchwork of state consumer-protection standards. The hearing is
      set for July 16, 2026; no merits ruling has been issued as of the run date.
      Berger Montague PC, a lead plaintiffs' firm with $2.4B in 2025 post-trial
      judgments, is separately investigating Quince for deceptive advertising and
      actively soliciting class members, signaling that the litigation exposure
      may expand beyond the current case. Three parallel suits—Tapestry/Coach
      (trade dress), Williams-Sonoma (false advertising), and Deckers/UGG (trade
      dress, Quince counter-claimed antitrust)—further consume management
      bandwidth. This cluster of lawsuits distinguishes company-specific legal
      risk from the sector-wide regulatory exposure treated in the next section.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
    tableRefs:
      - TR001
    figureRefs:
      - FR001

  - id: tariff-trade-risk
    title: Tariff, Trade Policy, and Import Compliance Risk
    body: >-
      Quince's M2C model directly sources from factories in China, India,
      Cambodia, Mongolia, Turkey, and Italy, concentrating cost-structure
      exposure in countries with active or escalating US tariff schedules.
      Yale Budget Lab's tariff tracker documents sequential escalation through
      2025 and 2026 on apparel and textile imports, and the Federal Reserve
      found these tariffs raised core goods PCE prices by 3.1% through February
      2026 with apparel pass-through specifically identified. Tax Foundation
      estimates the 2026 tariff increases add approximately $98 billion in
      annual federal revenues—a broad cost uplift that is structurally more
      damaging to an M2C brand than to traditional retailers who embed
      additional markup cushion. Unlike incumbents with domestic inventory
      buffers, Quince ships factory-to-consumer, meaning tariff-driven cost
      shocks arrive without the mitigation of pre-tariff purchase orders.
      Three new policy triggers add urgency in mid-2026. First, the White House
      executive order "Strengthening Customs Enforcement" (signed June 3, 2026)
      requires importers of record to certify compliance with supply-chain
      traceability mandates, provide manufacturer product identifiers and
      composition data to CBP within 90 days, and establish "good standing"
      status tied to customs-law compliance history. Second, the USTR initiated
      Section 301 investigations in March 2026 into forced-labor import
      enforcement failures; proposed actions were published June 2, 2026 with a
      comment period closing July 6. Third, CBP enforces the UFLPA rebuttable
      presumption that goods with any Xinjiang supply-chain linkage are banned
      from US importation absent extensive importer-provided documentation. No
      Quince-specific enforcement action, WRO, or UFLPA Entity List entry has
      been identified as of the run date, making this a live sector-wide
      exposure rather than confirmed company-specific violation.
    claimRefs:
      - CR012
