    body: >-
      Three simultaneous policy actions in mid-2026—the White House customs
      enforcement EO, the USTR Section 301 forced-labor investigation, and CBP's
      UFLPA rebuttable presumption—represent a structural shift in the import
      compliance burden, not a one-time event. For an M2C brand that ships
      directly from factories, tariff and customs risk is not offset by domestic
      inventory; it is absorbed entirely at the product level.
    claimRefs:
      - CR013
      - CR016
      - CR017
      - CR019
      - CR047
  - calloutType: risk
    title: Thesis-Break Trigger — Dual Simultaneous Activation
    body: >-
      The single most damaging scenario is class certification in the Mandel
      suit occurring simultaneously with a UFLPA detention on a core Quince SKU
      category. Class certification would impair the brand narrative and force
      operational redesign; UFLPA detention would block inventory supply. These
      two events together would stress both the revenue model and the supply
      chain simultaneously — a combination that $500M of capital cannot quickly
      bridge without a pre-existing compliance program in place on both vectors.
    claimRefs:
      - CR046
      - CR047
      - CR048

