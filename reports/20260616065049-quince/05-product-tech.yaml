callouts:
  - calloutType: strength
    title: "Operational Tech Moat Is Real and Defensible"
    body: >-
      The true Quince moat is not software IP—it is the combination of
      100+ direct factory relationships, cross-border logistics automation
      across 8 countries, and a weekly SKU-level demand responsiveness that
      produces less inventory waste than traditional retail. These
      operational advantages compound with scale and are difficult for
      asset-lighter DTC peers to replicate quickly.
    claimRefs:
      - CE010
      - CE011
      - CE034

  - calloutType: risk
    title: "AI/Proprietary Framing Overstates Verifiable Technical Depth"
    body: >-
      Quince's investor communications describe a "proprietary M2C operating
      system" with "AI-driven demand forecasting." The observable tech stack
      is conventional commerce tooling (Gatsby, Algolia, Contentful). The
      forecasting and factory integration claims are management-authored and
      not independently validated. Investors should treat the "platform"
      framing as a description of operational sophistication, not
      generalizable software IP.
    claimRefs:
      - CE035
      - CE036

  - calloutType: risk
    title: "Beyond Compare Litigation Is a Structural Risk to Core Conversion Feature"
    body: >-
      Williams Sonoma's lawsuit alleges Quince inflates competitor prices in
      its comparison tables. If this claim succeeds, it could force changes
      to a core conversion feature that underpins Quince's substitution logic
      on every product page. This is not peripheral litigation—it targets
      the product architecture itself.
    claimRefs:
      - CE033
      - CE030

  - calloutType: insight
    title: "Quince Business / QLS Signals Platform Expansion Beyond Consumer Retail"
    body: >-
      Job postings for Quince Logistics Service (QLS), enterprise B2B sales,
      and warehouse engineering suggest Quince may be building a commerce
      infrastructure business alongside its consumer brand. If QLS develops
      into a third-party logistics offering, the total addressable market
      expands substantially and the operational tech investments get
      amortized across a broader customer base.
    claimRefs:
      - CE007
      - CE027

