  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: demand forecasting
      missingEvidence: >-
        Independent technical validation of Quince's AI/ML demand forecasting
        accuracy, the ML models used, and the depth of factory API
        integrations.
      whyItMatters: >-
        The "proprietary M2C operating system" claim is a central pillar of
        the $10.1B valuation thesis; without independent validation, it
        cannot be distinguished from marketing language.
      diligencePath: >-
        Request a technical white paper or data room with sample forecasting
        accuracy metrics, model architecture overview, and factory API
        specifications during DD.
      relatedQuestionRefs:
        - QE011
        - QE023
        - QE027

    - type: missing-source
      severity: material
      topic: litigation
      missingEvidence: >-
        Court filings, legal opinions, or final judgments on the Williams
        Sonoma suit alleging false advertising and inflated competitor
        pricing in Quince's Beyond Compare feature.
      whyItMatters: >-
        A ruling against Quince's Beyond Compare architecture could force
        changes to the core product-page conversion mechanism that underpins
        the customer acquisition model.
      diligencePath: >-
        Monitor PACER for Williams Sonoma v. Quince case filings; request
        legal team briefing on status and potential remedies during DD.
      relatedQuestionRefs:
        - QE012

    - type: private-evidence-only
      severity: material
      topic: data architecture
      missingEvidence: >-
        The data infrastructure stack (warehousing, BI tooling, ML ops
        platform) powering the demand forecasting and supply chain
        analytics function.
      whyItMatters: >-
        Scalability and data architecture quality determine whether the M2C
        platform can compound into a genuine software moat as claimed by
        investors.
      diligencePath: >-
        During DD, request architecture diagram, data stack disclosure
        (e.g. Snowflake, Databricks, or equivalent), and ML model deployment
        infrastructure.
      relatedQuestionRefs:
        - QE027

    - type: missing-source
      severity: material
      topic: factory quality standards
      missingEvidence: >-
        Third-party audit reports, SA8000 certification, or equivalent
        independent verification of labor and environmental standards across
        Quince's 100+ partner factories.
      whyItMatters: >-
        Supply chain ethical risk and ESG exposure are unquantifiable
        without independent audits; reputational or regulatory risk could
        emerge from undisclosed factory practices.
      diligencePath: >-
        Request factory audit reports from a recognized auditor (e.g. Bureau
        Veritas, SGS, or equivalent) and list of factories with certification
        status.
      relatedQuestionRefs:
        - QE021
        - QE026

    - type: missing-source
      severity: minor
      topic: mobile app
      missingEvidence: >-
        iOS App Store listing for Quince (id1512791186) was inaccessible
        during this review; iOS review count, rating, and version status
        are unknown.
      whyItMatters: >-
        iOS is a major consumer platform; absence of iOS data leaves the
        mobile engagement picture incomplete.
      diligencePath: >-
        Retry Apple App Store fetch or request app analytics from company.
      relatedQuestionRefs:
        - QE022

    - type: missing-source
      severity: minor
      topic: IP portfolio
      missingEvidence: >-
        No patent filings by Last Brand, Inc. or Quince were found in USPTO
        or international patent databases during this review.
      whyItMatters: >-
        Absence of defensive IP means the M2C operating platform has no
        formal IP protection, making it theoretically replicable by
        well-funded competitors.
      diligencePath: >-
        Run a formal USPTO search for "Last Brand" and "Quince" patent
        applications; request IP schedule during DD.
      relatedQuestionRefs:
        - QE011

