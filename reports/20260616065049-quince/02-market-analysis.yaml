  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market sizing
      missingEvidence: >-
        An independent analyst report that specifically sizes the "accessible luxury D2C apparel and
        premium home goods online" market in North America as a discrete auditable category, with
        methodology, data source, CAGR, and addressable buyer population.
      whyItMatters: >-
        The absence of a standard category definition means the $25–35B TAM estimate used to justify
        Quince's $10.1B valuation cannot be independently verified from a single authoritative source.
        Investors and analysts must rely on researcher-derived triangulations with low individual
        confidence, creating meaningful valuation uncertainty.
      diligencePath: >-
        Commission primary research (consumer survey, ecommerce panel data) on premium basics online
        spend by household income tier; obtain Quince's investor presentation which may contain
        proprietary market sizing methodology.
      relatedQuestionRefs: [QM002, QM004, QM016]

    - type: private-evidence-only
      severity: material
      topic: return rate and reverse logistics
      missingEvidence: >-
        Quince's actual return rate and reverse logistics cost structure; D2C apparel industry
        benchmark data for Quince's price point and category mix.
      whyItMatters: >-
        Returns in premium D2C apparel typically run 15–35% of orders. If Quince's return rate is
        at the high end of this range, the effective gross margin per net unit sold is substantially
        lower than what the cost transparency page implies, and the adoption constraint from
        returns friction is greater than the business model narrative suggests.
      diligencePath: >-
        Request return rate and reverse logistics cost as a percentage of revenue in diligence;
        compare against Everlane and Stitch Fix published disclosures and industry benchmarks from
        Narvar/Returnly.
      relatedQuestionRefs: [QM030]

    - type: private-evidence-only
      severity: material
      topic: tariff exposure
      missingEvidence: >-
        Quince's supply chain country-of-origin breakdown and its exposure to elevated U.S. tariff
        rates by country (particularly China, Vietnam, India, Bangladesh) as of mid-2026.
      whyItMatters: >-
        The net competitive impact of the 2025–2026 tariff regime on Quince—whether it is a net
        winner or net loser—depends critically on its sourcing geography. If a large share of
        Quince's manufacturing is in high-tariff countries (China in particular), input cost
        inflation on its own goods may offset or exceed the competitive tailwind from intermediary
        retail price increases.
      diligencePath: >-
        Request supply chain map with country-of-origin breakdown and tariff exposure analysis from
        Quince management in diligence; cross-reference with Quince's about-us factory listing.
      relatedQuestionRefs: [QM008, QM009]

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      All four chapter tables include notes fields populated with data source context, estimation methodology
      caveats, and limitations. The tableNotes warning is acknowledged proactively because TM002 and TM003 in
      particular use researcher-derived estimates and qualitative archetypes where a reader note is essential
      to avoid overclaiming; the notes are substantive and not merely boilerplate.
