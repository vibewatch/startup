  - id: market-sizing
    title: Market Sizing — Multiple Lens Approach
    body: >
      No single authoritative analyst report defines "accessible luxury D2C apparel and home goods
      online in North America" as a discrete, auditable market category. This section triangulates
      across five sizing lenses, preserves contradictions where they exist, and provides a range
      estimate rather than a single headline figure.


      Lens 1 — Global apparel market context: Grand View Research estimated the global apparel
      market at $1.84 trillion in 2025, expected to reach $1.91 trillion in 2026, and to grow at
      a CAGR of 4.1% through 2033 to $2.54 trillion. Mass apparel dominates at 67.8% of revenue,
      with premium and luxury representing the remaining roughly 32%. Applying the U.S. share of
      global apparel (approximately 20–25% based on consumer spending benchmarks), U.S. total
      apparel retail is approximately $370–480 billion annually, consistent with industry estimates.


      Lens 2 — Global personal luxury goods: Bain & Company (reported via Forbes) estimated the
      global personal luxury goods market at approximately $415 billion in 2025, with the total
      addressable luxury consumer base declining from 380 million in 2019 to 335–345 million in
      2025 as brands over-raised prices post-pandemic. The active buyer share within that TAM
      dropped from approximately 60% to 40–45%. Aspirational luxury—the entry segment most
      directly relevant to Quince's upward-trading consumers—softened materially in 2025, with
      Bain explicitly citing consumers trading down to accessible brands such as Quince. U.S.
      personal luxury goods represent roughly 25–30% of the global total, implying approximately
      $100–125 billion of which Quince targets the accessible or entry-level tier.


      Lens 3 — Top-down U.S. accessible luxury online: Applying a 35–40% ecommerce share to
      U.S. apparel (consistent with Census Monthly Retail Trade data showing steady ecommerce
      penetration growth), the U.S. online apparel market is approximately $130–180 billion.
      The premium/accessible luxury sub-tier—defined as products priced above mass fast fashion
      but below ultra-luxury, roughly $50–$500 per unit—accounts for an estimated 20–25% of
      online apparel spend, yielding an accessible luxury online apparel TAM of approximately
      $26–45 billion in the U.S. alone.


      Lens 4 — Bottom-up household spending model: The U.S. has approximately 130 million
      households; roughly 40–50 million have household income above $75,000, the segment most
      likely to purchase premium basics online. If each such household spends $300–500 annually
      on accessible luxury online apparel and $75–150 on premium home textiles, the combined
      annual TAM is approximately $15–33 billion. Adding Canadian households (~4–5 million in
      the HHI equivalent range) extends the North American TAM to approximately $17–37 billion.


      Lens 5 — Quince implied SOM: Quince's disclosed $1 billion-plus 2025 revenue provides a
      concrete SOM anchor. Applying a 5–8% market penetration assumption (consistent with a
      fast-growing challenger brand at Series E scale) implies a SAM of approximately $12–20
      billion. This bottom-up reverse-derivation cross-checks reasonably well against lenses
      3 and 4.


      Contradictions and gaps: The Technavio analysis of U.S. online fashion retail implies a
      broader market definition that would suggest larger numbers, but restricted access prevents
      full reconciliation. UNCTAD's January 2026 global trade update notes expanding ecommerce
      volume growth but is not category-specific. The accessible luxury D2C North American
      segment lacks a single auditable market size figure; the $25–35 billion TAM estimate used
      in this chapter is the triangulated central range and carries material uncertainty. Home
      goods and textiles adjacency sizing—estimated at $3–6 billion North American premium online—
      depends heavily on how broadly Quince defines its home category, which it has not publicly
      disclosed.
