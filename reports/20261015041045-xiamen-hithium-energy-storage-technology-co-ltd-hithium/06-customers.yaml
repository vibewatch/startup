  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: Public GRR, NRR, renewal, churn, or cohort data by customer segment.
      whyItMatters: Without durability metrics, the chapter can show adoption proof but not the persistence or quality of revenue.
      diligencePath: Request customer-retention KPIs, renewal schedules, and cohort bridges from management or IPO filing supplements.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A broader list of named production deployments outside the Saudi and Powin-linked records in this pool.
      whyItMatters: The current public sample may overstate or understate customer diversification because it is concentrated in a few named references.
      diligencePath: Collect customer case studies, procurement awards, commissioning notices, and reference calls by geography and segment.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer share, channel-partner mix, backlog concentration, and receivables exposure by customer or geography.
      whyItMatters: Concentration risk can materially change the value of the current utility wins and the downside from channel distress.
      diligencePath: Obtain customer concentration schedules, aged receivables by counterparty, and channel contract summaries during diligence.
      relatedQuestionRefs: [QU005]
