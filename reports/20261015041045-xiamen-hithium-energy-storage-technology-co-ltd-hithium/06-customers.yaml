company:
  name: Xiamen Hithium Energy Storage Technology Co., Ltd. (Hithium)
chapter:
  number: 6
  title: Customers
  summary: >-
    Hithium's retained customer evidence shows real utility-scale adoption and credible
    buyer segmentation, but the public record is still dominated by deployment announcements
    and channel stories rather than retention or concentration metrics. The strongest named
    proof is a company-originated announcement of a 4 GWh Saudi Electricity Company contract;
    the clearest expansion friction is U.S. tariff and domestic-content complexity alongside
    the reported bankruptcy of Powin, which TMTPOST described as Hithium's largest U.S. client.
sections:
  - id: customer-footprint
    title: Customer footprint is broad in target segment, but narrow in named proof
    body: >-
      The retained evidence supports Hithium's positioning across the main battery-storage
      buying surfaces rather than across a long list of named end customers. Product- and
      launch-oriented sources consistently place the company in utility-scale grid storage
      first, with secondary commercial-and-industrial coverage and only generic references to
      residential demand. That matters because the customer conversation here is less about
      logo count and more about whether Hithium can win specification in long-duration,
      bankability-sensitive projects where buyers care about certifications, operating
      conditions, and lifecycle support. The public record therefore supports a wide segment
      map, but not a wide roster of independently verified production accounts.
    claimRefs: [CU001, CU002, CU007, CU014, CU015]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Named adoption proof is strongest in Saudi utility-scale deployment
    body: >-
      The best named customer proof in the assigned pool is the Saudi Electricity Company
      contract announcement carried by Power Technology: two projects totaling 4 GWh in Tabuk
      and Hail, with Hithium responsible for design, supply, installation monitoring, and
      long-term maintenance. That is materially better evidence than a logo wall because it
      identifies a customer, geography, application, system size, and delivery role, although
      the announcement remains company-originated rather than independent customer confirmation.
      The same pool also
      shows Hithium pushing its eight-hour platform toward 2026 delivery, which suggests an
      expansion path from current four-hour deployments into longer-duration projects. What it
      does not show is operating utilization, repeat-order cadence, or renewal behavior after
      commissioning.
    claimRefs: [CU003, CU004, CU005, CU006]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Durability and expansion are still constrained by procurement friction and channel risk
    body: >-
      Hithium's next layer of customer evidence is more conditional than the Saudi utility
      proof. U.S. market-access conditions get harder in 2026 as Chinese non-EV battery
      tariffs rise, and Clean Energy Associates expects meaningful cost pressure for
      integrators. Updated domestic-content guidance reduces some paperwork friction for
      project owners, but it does not remove exposure to tariff-driven economics. At the same
      time, TMTPOST described Powin as Hithium's largest U.S. client, while reporting Hithium's
      statement that the relationship had not reached mass delivery and that Hithium was not a
      creditor in Powin's bankruptcy. Together with Chinese authorities' push for stricter
      quality and competition oversight, the evidence supports expansion potential but not yet
      durable proof of diversified, recurring customer economics.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU002]
