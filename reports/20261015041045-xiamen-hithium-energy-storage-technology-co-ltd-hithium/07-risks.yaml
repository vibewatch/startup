company:
  name: "Xiamen Hithium Energy Storage Technology Co., Ltd. (Hithium)"
chapter:
  number: 7
  title: "Risks"
  summary: >
    Hithium's highest public risks are legal/IPO readiness, cash-conversion quality, and
    overseas manufacturing execution rather than a simple demand shortfall. The retained
    evidence shows live CATL litigation, heavy receivable growth and subsidy dependence,
    and multi-site certification and ramp obligations that still need primary diligence
    before an investor can underwrite downside with confidence.
sections:
  - id: "ranked-risk-stack"
    title: "Ranked risk stack"
    body: >
      The current downside case is concentrated in four linked items: CATL-related
      litigation and governance scrutiny, working-capital strain masked by fast revenue
      growth, plant-localization execution across the United States and Spain, and
      deployment gating through fire-safety and authority approvals. The legal and cash
      quality issues matter most because they can impair IPO timing, financing leverage,
      and customer confidence at the same time. The safety and localization items are not
      existential on their own, but they can magnify losses if Hithium must re-test,
      slow commissioning, or carry inventory and receivables longer than planned.
    claimRefs: [CR001, CR004, CR005, CR008, CR009, CR014]
    figureRefs: [FR001]
  - id: "legal-and-regulatory-overhang"
    title: "Legal and regulatory overhang"
    body: >
      The sharpest legal risk is not generic sector scrutiny but a live, named dispute:
      TMTPost reports CATL is seeking damages above $14 million and that the hearing timing
      intersects with Hong Kong IPO review. That sits inside a tougher 2026 sector backdrop
      in which Chinese regulators publicly said
      they would crack down on price wars, production inconsistency, and intellectual
      property violations. Together, the evidence implies that Hithium needs more than a
      rebuttal statement; it needs documentary proof that the litigation, governance, and
      compliance issues will not impair listing readiness or customer trust.
    claimRefs: [CR001, CR007]
    tableRefs: [TR001]
  - id: "operational-and-financial-stress"
    title: "Operational and financial stress"
    body: >
      Hithium has credible signs of technical progress, but the public evidence still points
      to meaningful execution risk at scale. The company publicized an open-door fire test
      for its 6.25 MWh system, yet Intertek's 2026 explanation of UL 9540A shows that
      installation-level, gas-hazard, and AHJ-facing requirements are becoming more
      demanding, so one disclosed test is not the same thing as deployment de-risking.
      At the same time, the Mesquite opening and Navarre plan expand Hithium's capex and
      ramp obligations just as TMTPost describes receivable growth, leverage, and subsidy
      dependence that weaken the margin for execution error.
    claimRefs: [CR003, CR004, CR005, CR006, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: "dependencies-mitigations-and-kill-criteria"
    title: "Dependencies, mitigations, and kill criteria"
    body: >
      The dependency profile is still manageable, but only if investors treat mitigation
      claims as hypotheses to verify rather than completed controls. Public evidence shows
      dependency on counterparties such as Powin, on supplier and service localization for
      North America, and on testing bodies and authorities having jurisdiction for project
      approvals. The practical kill criteria are monitorable: an adverse CATL court outcome
      or more severe prospectus disclosure, further deterioration in receivable days or
      customer insolvency exposure, missed Mesquite or Navarre ramp milestones, or any sign
      that full-system certification evidence is weaker than the marketing narrative.
    claimRefs: [CR004, CR005, CR009, CR011, CR012, CR014]
    tableRefs: [TR003]
