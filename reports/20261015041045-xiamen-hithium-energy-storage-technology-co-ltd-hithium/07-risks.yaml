callouts:
  - calloutType: "risk"
    title: "IPO-readiness can break on a combined legal-and-cash-quality failure"
    body: >
      The worst near-term downside is a combination of CATL-case escalation, weaker-than-
      expected prospectus disclosure, and continued receivable inflation. That trio would
      damage listing timing and force investors to treat Hithium's scale as balance-sheet
      risk rather than operating leverage.
    claimRefs: [CR001, CR008, CR009, CR010]
  - calloutType: "recommendation"
    title: "Underwrite only against documentary gates"
    body: >
      A serious diligence process should insist on court filings and final prospectus risk
      factors, customer-level receivable aging, full-system certification evidence, and
      plant-ramp milestone data before treating the current public narrative as investable.
    claimRefs: [CR001, CR004, CR005, CR009, CR011]
