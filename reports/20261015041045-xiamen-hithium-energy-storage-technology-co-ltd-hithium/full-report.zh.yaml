  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：先看固定式储能，而不是泛电池 TAM
        blocks:
          - type: paragraph
            body: >-
              本次证据中最清晰的边界是固定式储能硬件和系统，而不是整个电池经济。ENF Solar 将 Hithium 归入 “Inverter, Storage System” 和 LFP 储能技术；BESS
              Manufacturers
              则描述了从电芯到集装箱式直流舱的垂直整合链条，并明确聚焦公用事业级市场。这一组合支持纳入公用事业级项目、大型工商业储能，以及随储能系统销售的相邻电力电子产品；但应排除电动车电池、广泛的上游原材料敞口，以及证据池没有支持的软件型能源管理主张。EIA
              的 2026 年美国储能更新也说明，市场按所有权类型、应用和规模分层，而不是一个没有差异的支出桶，因此后续测算需要多重视角，不能只用一个 headline TAM。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
