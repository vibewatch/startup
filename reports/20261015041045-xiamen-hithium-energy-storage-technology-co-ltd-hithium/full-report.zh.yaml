      - number: '2.2'
        title: 测算视角：经济性与用电需求增长支持采用，但尚不足以形成干净的 SAM
        blocks:
          - type: paragraph
            body: >-
              本次证据池最有力的量化视角是成本和需求代理指标，而不是可以直接用于投资的 TAM/SAM/SOM 梯子。BloombergNEF 报道称，2025 年全球四小时电池项目的基准成本降至
              $78/MWh，光储合计新增装机达到 87 GW，平均成本为 $57/MWh；这支持公用事业级储能经济性改善的判断。在需求侧，Data Center Knowledge 引述 EPRI 称，到 2030
              年美国数据中心可能占总用电量的 9%-17%，使灵活电力、峰值管理以及现场或并网储能更重要。Hithium
              自己披露的规模目标和报道中的出货量可以作为公司视角，但仍是供给侧信号，而非独立的市场分母。因此，本证据池支持有利的采用背景，却仍不足以形成可辩护的 Hithium 专属 SAM 或 SOM。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
