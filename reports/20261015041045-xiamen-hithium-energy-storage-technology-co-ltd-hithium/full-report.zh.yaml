        title: 收入模式与公开 traction
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，商业化模式围绕向多个终端市场销售储能硬件，而不是软件式经常性收入引擎。Hithium 官方网站面向公用事业、工商业、住宅和离网场景营销集成 BESS 方案；独立行业报道则显示，项目级供货协议采用
              5MWh 和 6.25MWh 系统。IPO
              材料的第三方摘要进一步暗示出货和收入仍在强劲增长，电芯仍是规模锚点，系统的收入占比则日益重要。这一组合支持可信的收入增长故事，但实际定价、合同条款、客户集中度和付款里程碑仍未公开到足以干净评估收入质量。
