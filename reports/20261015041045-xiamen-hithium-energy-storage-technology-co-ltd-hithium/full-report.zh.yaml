  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 电芯厂商、综合型 incumbent 与替代方案共同构成拥挤市场
        blocks:
          - type: paragraph
            body: >-
              保留的证据显示，Hithium 所处市场的买家可以向多家大型中国及全球供应商采购储能电芯、交钥匙系统或一体化项目方案，而不是只能在一个狭窄的同业集合中选择。Hithium
              自有材料将其定位为专注储能的纯储能供应商，累计出货超过 100GWh；但独立报道把它放在更宽的竞争场中，其中包括 BYD、EVE、Trina Storage、HyperStrong 及其他电池或系统集成商。BYD
              的匈牙利项目和跨国部署版图表明，大型行业巨头可以凭项目可融资性和系统封装能力竞争；Powin 则说明，买家也可以通过集成层采购，而非直接向电芯制造商采购。CATL
              在保留证据中主要作为行业巨头基准和法律对手出现，而不是完整画像的同业，这本身就有信息量：Hithium 已不再需要争取品类认知，但仍面对装机基础更广、渠道杠杆更强或诉讼能力更强的对手。
