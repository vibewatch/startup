    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与运营姿态
        blocks:
          - type: paragraph
            body: >-
              尽管本次分配到的英文官方页面作为一手证据较弱，保留的独立报道仍足以勾勒基本身份。ESS News 将 Hithium 描述为一家总部位于厦门、成立于 2019
              年的电池储能制造商和系统集成商，并称其开发电池电芯及完整储能系统。同一来源还梳理了其分拆式商业模式：向系统集成商销售国内电芯，并在海外直接销售集成系统和解决方案。这一定位与本次证据池中的储能大背景相符：Coherent
              Market Insights 将 2026 年先进储能市场规模估为 USD 26.39 billion，EIA 也在 2026
              年持续发布美国电池储能部署的最新动态。不过，保留的英文官方解决方案和工厂页面主要是导航及国家列表文字，没有形成可用的公司叙事，因此概况阶段的一手来源可见度偏弱。
