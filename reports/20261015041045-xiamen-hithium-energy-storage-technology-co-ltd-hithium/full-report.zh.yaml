      - number: '3.3'
        title: 价格战、定价不透明与交易对手风险压缩持久性
        blocks:
          - type: paragraph
            body: >-
              保留证据不足以支持 Hithium
              与同业之间干净的公开价格基准，因此竞争强度更多体现在结构和反向信号，而不是每千瓦时的报价。公开产品和项目页面显示了封装差异，却没有披露实际成交价、质保经济性或折扣。反向证据更强：中国监管部门召集主要电池和储能企业，要求遏制低于成本的竞争；TechCrunch
              记录了 Powin 在进入电网级储能后走向破产；TMTPost 则把 CATL 诉讼、补贴依赖和膨胀的应收账款描述为限制 Hithium
              灵活性的潜在因素。实际结果是，买家拥有多条竞争性采购路径，但投资人仍无法清楚判断谁能承受价格压力、消化渠道压力，或把技术胜利转化为持久的利润率和分销能力。保留证据中内部自建和客户切换成本的信息尤其少，因此这些问题应留给尽调，而不应视为已经解决。
