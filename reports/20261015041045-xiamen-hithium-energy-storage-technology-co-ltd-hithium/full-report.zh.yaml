  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链从真实市场需求出发，经过尚未解决的投资判断摩擦，最终落到观察立场。
    data:
      nodes:
        - id: demand
          label: 需求背景有利
          detail: 西班牙正规划增加储能，美国电力需求增长也可能利好储能部署。
        - id: scale
          label: Hithium 有可见的规模证明
          detail: 公开报道仍将该公司与强劲收入增长及超过 $3.5 billion 的私募估值联系在一起。
        - id: valuation
          label: 公开估值支撑薄弱
          detail: 明确的公开锚点已经过时，整体独角兽 IPO 窗口仍然挑剔。
        - id: quality
          label: 盈利质量风险仍在
          detail: 补贴、应收账款以及诉讼 / 披露问题，使投资判断中的折现率维持高位。
        - id: sector
          label: 行业压力限制上行空间
          detail: 中国监管机构仍在整治非理性竞争，同行也在提高安全证明标准。
        - id: decision
          label: 建议：观察，不追高
          detail: 等待新的价格发现、更充分的披露，以及更有力的现金转换证明。
      edges:
        - from: demand
          to: scale
          label: 支持相关性
        - from: scale
          to: valuation
          label: 未弥合定价差距
        - from: valuation
          to: quality
          label: 放大尽调需求
        - from: quality
          to: sector
          label: 面对更严峻的市场背景
        - from: sector
          to: decision
          label: 维持严格的入场纪律
