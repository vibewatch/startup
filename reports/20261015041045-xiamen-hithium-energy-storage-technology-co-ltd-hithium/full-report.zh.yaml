      - number: '3.2'
        title: 差异化靠储能聚焦与制造执行，而非无人争夺的广度
        blocks:
          - type: paragraph
            body: >-
              Hithium
              最有说服力的公开差异化信号并非独家客户准入，而是储能专属的产品和运营链条。公司称只聚焦能源储存，并已从材料到系统建立能力；其产品页面还展示了多种面向长时或公用事业级部署的电芯规格，而不是只押注一个旗舰
              SKU。世界经济论坛的独立认可进一步强化了执行故事，重点提到 Hithium 重庆工厂更高的产能利用率、更低的转换成本和更高的高端产品占比。不过，同一 WEF 队列也包括数字化制造提升同样强劲的 EVE
              Energy，CNEVPost 的同业报道则显示 BYD 和 Trina Storage 是海外替代选择。Hithium 的优势真实存在但可以被挑战：产品专注和运营纪律有帮助，却无法消除多元化 incumbent
              或系统级替代方案的竞争。
            claimRefs:
              - CP002
