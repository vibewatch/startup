        - 客户困境导致项目或回款延迟，而库存和应收账款仍留在 Hithium 账上
        - 高
        - 公司称 Powin 尚未达到批量交付阶段，且 Hithium 不是该破产案债权人
        - 中高
      - - 测试和许可把关方
        - UL、AHJ、消防部门和地方规范执法机构
        - 部署审批
        - 每个公用事业级安装都高度依赖
        - 项目需要重新测试、重新设计，或经历更长的投运周期
        - 高
        - Hithium 已公布一项与即将实施的规范相衔接的大规模消防测试
        - 中高
      - - 全球供应商和本地化服务网络
        - 北美和欧洲爬坡生态
        - 制造投入和售后交付
        - 海外规模化期间高度依赖
        - 零部件、劳动力或服务不到位会拖慢产出并损害客户信任
        - 中高
        - 管理层称美国战略采用全球战略供应商合作伙伴，并建设本地服务网络
        - 中高
    notes: 本依赖表聚焦于外部中介导致的失效路径，这些风险无法仅靠 Hithium 内部执行消除。
    claimRefs:
      - CR004
      - CR005
      - CR011
      - CR012
  - id: TV001
    title: 建议总结表
    columns:
      - 维度
      - 当前判断
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 跟踪 IPO / 私募融资路径，但仅凭当前公开证据不足以支撑买入判断。
      - - 置信度
        - 中
        - 需求支撑可见，但估值依据和交易条款尚不明确。
      - - 风险评级
        - 高
        - 诉讼、补贴依赖、应收账款、关税暴露和激励资格都会影响下行空间。
      - - 估值立场
        - 不为过时的公开私募估值支付溢价
        - 在获得新的价格发现前，把公开的超过 35 亿美元参考点视为上限。
      - - 目标持有 / 退出框架
        - 公开证据无法支持
        - 在获得公开交易条款、经审计的现金转化情况和更清晰的 IPO 准备度前，不要给回报目标做投资判断。
    notes: 这是分析师基于留存来源形成的综合判断；建议标签是建立在所引证据上的判断，而非公司引用的指引。
    claimRefs:
      - CV003
      - CV016
      - CV017
      - CV019
      - CV020
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 当前证据
      - 什么会改变判断
    rows:
      - - 投资逻辑：结构性储能需求仍在扩张
        - 西班牙的目标是到 2030 年建设 22 GW 储能，EIA 仍在跟踪美国大型电池储能，EPRI 也预计电力需求上升，而储能可以发挥作用。
        - 只有 Hithium 将终端市场需求转化为经审计的现金生成，而不只是收入增长时，才会上调判断。
      - - 投资逻辑：Hithium 的规模已经足够重要
        - 公开报道将公司与超过 35 亿美元的私募估值及 2022-2024 年的大幅收入爬坡联系起来。
        - 只有在补贴、回款和定价压力正常化后，仍能证明这套规模具有持久性，才会上调判断。
      - - 反向逻辑：盈利质量较弱
        - 公开报道称，预计 2024 年调整后利润依赖补贴，而应收账款 / DSO 大幅扩张。
        - 一套干净、经审计的 2025 年现金流和应收账款账龄材料，会显著改善投资判断。
      - - 反向逻辑：IPO 准备度仍有争议
        - 诉讼、披露批评、关税暴露和激励限制仍是公开投资判断的一部分。
        - 若上市流程获批，或这些问题得到有充分文件支持的解决，折现率会下降。
    notes: 各行将需求和规模与投资判断质量分开，因此建议对价格保持敏感，而不是追逐动量。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 需求保持强劲，诉讼和披露问题降级，回款显著改善。
        - 只有在这种情况下，支付高于上次公开的超过 35 亿美元私募参考点的价格才有依据。
        - 国际扩张执行失误，或安全性 / 可融资性证据不足。
        - 在经审计的质量和交易条款公开前，概率较低。
      - - 基准
        - 需求保持稳健，但估值可见度有限，盈利质量问题只得到部分解决。
        - 不为上次公开的私募参考点支付溢价；只有条款有利或披露改善后才参与。
        - IPO 延期、回款放慢，或价格战带来利润率压力。
        - 当前公开证据路径中概率最高。
      - - 悲观
        - 价格战压力、诉讼或政策 / 激励摩擦加剧，同时现金转化持续疲弱。
        - 预计相对过时的私募估值打折，并优先保护下行空间，而不是争取参与机会。
        - 下轮融资、上市延迟，或客户 / 融资收缩。
        - 若未解决问题延续到实际募资，影响将不可忽视。
    notes: 由于样本池没有实时条款清单、价格区间、股权结构表或当前第三方估值，区间只能定性描述。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV015
      - CV016
      - CV019
      - CV020
