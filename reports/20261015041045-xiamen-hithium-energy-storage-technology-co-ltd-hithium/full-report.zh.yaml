        title: 利润率结构与现金回收
        blocks:
          - type: paragraph
            body: >-
              关于利润率扩张，最好的公开证据是产品组合变化，而不是已充分审计、能证明单位经济性结构性更优的证据。BusinessNewsAsia 基于招股书的摘要称，高价值 ESS System 业务在 2025
              年上半年收入占比更高，毛利率也明显高于 ESS Battery；国际收入的估计毛利率也远高于大陆业务。这一上行空间被证据池中最重要的反向信号抵消：TMTPost 称应收账款增速远快于收入，应收账款周转天数超过
              185 天，且 2024 年补贴依赖仍然明显。仅凭公开证据，Hithium 看起来有能力成长为更高利润率的企业，但尚不能证明干净的现金回收或低补贴盈利。
