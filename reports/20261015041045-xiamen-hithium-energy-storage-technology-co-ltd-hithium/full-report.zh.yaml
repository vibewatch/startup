            tableRef: TO002
            claimRefs:
              - CO001
              - CO013
      - number: '1.4'
        title: 里程碑与当前观察点
        blocks:
          - type: paragraph
            body: >-
              Hithium 的里程碑路径足以显示其扩张速度异常快，但同一时间线如今也承载着更高的执行风险。公司从 2019 年成立走到 2025 年 3 月提交香港 IPO 申请；截至 2026
              年初，仍在发布产品验证里程碑，例如由 UL 监督、针对其 6.25 MWh 系统进行的开门燃烧测试。与此同时，行业监管趋严：MIIT 称 Hithium 是 2026 年 1
              月被召集参加座谈会的企业之一，会议目标是治理电池行业的非理性竞争和低价销售。更重要的是，TMTPost 报道了 CATL 诉讼、涉及创始人的此前仲裁处罚，以及 Powin 破产可能暴露客户集中风险的担忧，尽管
              Hithium 称尚未达到批量交付且不是债权人。结果是，公司商业上仍具相关性，但要讲出干净的公开市场故事，仍取决于更强的治理披露、更清晰的现金回收证据和法律去风险。
