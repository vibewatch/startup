      - number: '1.2'
        title: 规模、融资姿态与商业化信号
        blocks:
          - type: paragraph
            body: >-
              本次证据池中最清晰的规模证据来自 Hithium 的 IPO 报道。ESS News 称 Hithium 2024 年出货 35.1 GWh，按 CNESA 数据以 11%
              的份额位列全球第三。报道还称，储能系统出货量在 2022 至 2024 年的 CAGR 为 167%，收入从 2022 年的 CNY 3.62 billion 增至 2024 年的 CNY 12.92
              billion；2024 年首次实现盈利，净利润为 CNY 318 million，此前 2022 年和 2023 年均亏损。              2025 年 3 月的香港 IPO
              申报文件和具名保荐人团队，显示公司正积极把这一规模转化为资本市场灵活性。商业验证已经出现但仍不完整：与 Jupiter Power、Lightsource BP、Samsung C&T、Datang
              Group、China Electric Equipment 和 Longyuan Power 的合作，说明确有市场牵引力；但保留的证据池没有披露累计融资额、股权结构表或当前董事会架构。TMTPost
              又让规模叙事变得更复杂：报道称，公司 2024 年调整后盈利依赖 RMB 414 million 的补贴，且 2024 年末应收账款达到 RMB 8.3 billion。
