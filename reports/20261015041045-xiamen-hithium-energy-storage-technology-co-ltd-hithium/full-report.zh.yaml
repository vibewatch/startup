      - number: '2.3'
        title: 买方地图与约束：采购需求存在，但法律和营运资金摩擦不可忽视
        blocks:
          - type: paragraph
            body: >-
              支持市场中可能的预算所有者包括公用事业、IPP、光储开发商、大型工商业电力买家；在数据中心驱动负荷增长的情景下，还包括要通过公用事业和并网流程推进项目的基础设施开发商，而不是简单的软件式自助购买。采用时点会受到项目融资、许可、并网和资产负债表承载能力影响。证据池中的反向证据很重要，因为它说明市场准入并不只由需求增长决定：ESS
              News 将 Hithium 的 CATL 诉讼与 IPO 可行性及产品禁令风险联系起来，TMTPost 则描述了应收账款大幅增长、补贴依赖和承压的现金回收周期。公共目录中的基本规模信号甚至互相冲突：ENF
              Solar 列出 3,000 名员工，BESS Manufacturers 列出 7,650 名员工。因此，在一手申报文件或管理层尽调解决之前，买方分部生产率或人均成本视角都应保持未决。
