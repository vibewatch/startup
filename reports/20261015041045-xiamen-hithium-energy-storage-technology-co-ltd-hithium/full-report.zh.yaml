      - number: '1.3'
        title: 领导层、治理与披露质量
        blocks:
          - type: paragraph
            body: >-
              本次证据池中的公开领导层信息很少，而且主要来自负面报道，而非日常公司披露。TMTPost 认定 Wu Zuyu 为创始人，并称 2023 年一项仲裁裁决因其违反竞业协议、挖走 CATL
              员工而对其作出处罚。同一篇文章称，前总裁办公室主任 Feng Dengke
              牵涉商业秘密案件，使高管控制带上运营和声誉敏感性。尽调的更大问题并不只是争议存在，而是干净的当前治理信息稀缺：保留的英文官方页面没有提供实质性的领导层或治理叙事，本次来源集也无法确认当前董事会构成、独立董事、委员会结构或确切投资人构成。对于
              IPO 前公司，这一披露缺口几乎和诉讼本身同样重要，因为后续章节需要可靠地知道谁控制决策，以及监督究竟如何运作。
            claimRefs:
              - CO001
              - CO013
