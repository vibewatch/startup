  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Offering and product footprint
        blocks:
          - type: paragraph
            body: >-
              Retained evidence presents Hithium as an energy-storage specialist selling integrated systems rather than
              only merchant battery cells. The clearest public product asset is the InfinityPower 6.25MWh four-hour
              system built around 1175Ah cells, which anchors the company's utility-scale positioning. Hithium's own
              materials also lean on bankability and shipment-scale proof, saying PV Tech Research assigned an A grade
