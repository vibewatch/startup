  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Crowded landscape across cell makers, integrated incumbents, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained pool shows Hithium competing in a market where buyers can source storage cells, turnkey
              systems, or integrated project solutions from several large Chinese and global vendors rather than from
              one narrow peer set. Hithium's own materials position it as a pure-play storage-focused supplier with more
              than 100GWh of cumulative shipments, but independent coverage places it inside a broader field that
              includes BYD, EVE, Trina Storage, HyperStrong, and other battery or system integrators. BYD's Hungary
              project and multinational deployment footprint show that large incumbents can compete on project
              bankability and system packaging, while Powin demonstrates that buyers can also procure through an
              integration layer rather than directly from a cell manufacturer. CATL appears in the retained evidence
              mainly as the incumbent benchmark and legal antagonist rather than as a fully profiled peer, which is
              itself informative: Hithium is no longer fighting for category recognition, but it still faces opponents
              with broader installed bases, channel leverage, or litigation capacity.
