        title: Margin structure and cash conversion
        blocks:
          - type: paragraph
            body: >-
              The best public evidence for margin expansion is a mix shift, not a fully audited proof of structurally
              superior unit economics. BusinessNewsAsia's prospectus-based summary says the higher-value ESS System
              business reached a larger share of revenue and materially higher gross margin than ESS Battery in the
              first half of 2025, while international revenue also carried a much richer estimated gross margin than
              mainland business. That upside is offset by the most important adverse signal in the pool: TMTPost says
              receivables expanded far faster than revenue, receivable days exceeded 185, and subsidy dependence
              remained meaningful in 2024. On public evidence alone, Hithium looks capable of growing into better
              margins, but not yet able to prove clean cash conversion or subsidy-light profitability.
