      - number: '2.2'
        title: 'Sizing lenses: economics and power-demand growth support adoption, but not a clean SAM'
        blocks:
          - type: paragraph
            body: >
              The strongest quantitative lenses in the pool are cost and demand proxies, not a directly investable
              TAM/SAM/SOM ladder. BloombergNEF reports that the global benchmark cost for a four-hour battery project
              fell to $78/MWh in 2025 and that combined solar-plus-storage additions reached 87 GW at an average
              $57/MWh, which supports the case that utility-scale storage economics are improving. On the demand side,
              EPRI coverage in Data Center Knowledge says U.S. data centers could rise to 9%-17% of total electricity
              consumption by 2030, making flexible power, peak management, and onsite or grid-coupled storage more
              relevant. Hithium's own disclosed scale ambitions and reported shipments are useful company lenses, but
              they are still supply-side signals rather than independent market denominators. The pool therefore
              supports a favorable adoption backdrop, while still leaving the chapter short of a defensible
              Hithium-specific SAM or SOM. 
            claimRefs:
