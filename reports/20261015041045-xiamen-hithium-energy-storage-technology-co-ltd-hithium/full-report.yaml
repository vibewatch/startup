  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: stationary storage first, not a generic battery TAM'
        blocks:
          - type: paragraph
            body: >
              The cleanest boundary in the assigned evidence is stationary storage hardware and systems, not the full
              battery economy. ENF Solar categorizes Hithium around "Inverter, Storage System" and LFP storage
              technology, while BESS Manufacturers describes a vertically integrated stack from cells through
              containerized DC blocks with a stated utility-scale focus. That combination supports including
              utility-scale projects, large C&I storage, and adjacent power electronics sold with storage systems, while
              excluding EV batteries, broad upstream raw-material exposure, and software-only energy management claims
              that the pool does not evidence. EIA's 2026 U.S. storage update also reinforces that the market is
              segmented by ownership type, application, and scale rather than one undifferentiated spending bucket, so
              later sizing needs multiple lenses instead of a single headline TAM. 
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
