              - CO008
              - CO010
              - CO012
              - CO014
      - number: '1.3'
        title: Leadership, governance, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Public leadership detail in the assigned pool is thin and mostly emerges through adverse reporting rather
              than ordinary corporate disclosure. TMTPost identifies Wu Zuyu as founder and says a 2023 arbitration
              ruling penalized him for violating a non-compete agreement and poaching CATL personnel. The same article
              names Feng Dengke as a former director of the president's office who became entangled in a trade-secret
              case, adding operational and reputational sensitivity around executive control. The bigger diligence issue
              is not simply the existence of controversy but the scarcity of clean current governance detail: the
              retained official English pages did not yield a substantive leadership or governance narrative, and this
              source set still does not establish current board composition, independent directors, committee structure,
              or the exact investor base. For a pre-IPO company, that disclosure gap matters almost as much as the
              litigation itself because later chapters need a reliable ground truth on who controls decisions and how
              oversight is actually structured.
            claimRefs:
              - CO001
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO013
      - number: '1.4'
        title: Milestones and current watchpoints
        blocks:
          - type: paragraph
            body: >-
              Hithium's milestone path is visible enough to show unusually fast scale up, but the same timeline now
              carries heavier execution risk. The company moved from a 2019 founding to a March 2025 Hong Kong IPO
              filing, and by early 2026 it was still releasing product-validation milestones such as a UL-supervised
              open-door fire test for its 6.25 MWh system. At the same time, sector oversight tightened: MIIT said
              Hithium was among firms called into a January 2026 symposium targeting irrational competition and
              below-cost pricing in batteries. More importantly, TMTPost reports CATL litigation, a prior arbitration
              penalty involving the founder, and concern that Powin's bankruptcy could expose customer concentration
              risk even if Hithium says it had not reached mass delivery and is not a creditor. The result is a company
              that still looks commercially relevant, but one whose path to a clean public-market narrative depends on
              stronger governance disclosure, clearer cash-conversion evidence, and legal de-risking.
            claimRefs:
