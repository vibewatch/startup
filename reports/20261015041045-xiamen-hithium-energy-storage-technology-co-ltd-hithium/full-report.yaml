      - number: '5.2'
        title: Architecture, safety, and operating model
        blocks:
          - type: paragraph
            body: >-
              The deepest technical detail in the assigned pool comes from fire-safety coverage around the 6.25MWh
              system. Hithium and follow-on coverage describe a severe open-door test setup with 15 cm spacing, 100%
              state of charge, and disabled active suppression, all framed against UL 9540A 2025 and NFPA 855-2026
              expectations. The disclosed architecture emphasizes directional venting, dual pressure-relief valves,
              fire-resistant module covers, reinforced steel enclosures, and insulated multi-layer container structures,
              which together support a cell-to-system safety narrative. That is meaningful technical proof, but it is
              still mostly safety-validation proof. Public materials in the assigned pool do not independently establish
              commercial uptime, degradation behavior, software-control architecture, or field service performance after
              deployment.
