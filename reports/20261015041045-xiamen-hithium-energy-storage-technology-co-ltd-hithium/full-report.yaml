  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The public evidence clusters Hithium's highest residual risk in litigation, cash conversion, and scale-up gating
      rather than pure market demand.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Mitigation maturity
      rows:
        - label: CATL / governance overhang
          note: Live legal and listing-readiness risk.
          values:
            - value: High
              tone: high
              note: Court timing and prior founder dispute are already public.
            - value: High
              tone: high
              note: Could affect IPO timing, customer confidence, and financing leverage.
            - value: Low-Medium
              tone: medium
              note: No public settlement, dismissal, or independent remediation package.
        - label: Receivables and subsidy quality
          note: Balance-sheet stress can amplify every other risk.
          values:
            - value: High
              tone: high
            - value: High
              tone: high
            - value: Low
              tone: high
              note: Public evidence does not show a closed cash-conversion fix.
        - label: Safety certification and AHJ approval
          note: Testing progress exists, but deployment proof remains incomplete.
          values:
            - value: Medium-High
              tone: medium
            - value: High
              tone: high
            - value: Medium
              tone: medium
              note: One published fire test is helpful but not equivalent to broad installation clearance.
        - label: Overseas localization ramp
          note: Two-region manufacturing and service buildout.
          values:
            - value: High
              tone: high
            - value: Medium-High
              tone: medium
            - value: Medium
              tone: medium
        - label: Sector price-war and compliance pressure
          note: Industry oversight can erode margins before Hithium proves durable pricing.
          values:
            - value: High
              tone: high
            - value: Medium-High
              tone: medium
            - value: Low-Medium
              tone: medium
        - label: Counterparty and collections stress
          note: Customer insolvency or slower project conversion extends cash cycles.
          values:
            - value: Medium
              tone: medium
            - value: High
              tone: high
            - value: Low-Medium
              tone: medium
    approximationNotes: >-
      Qualitative matrix synthesized from retained sources; tones indicate ranked residual exposure, not a modeled
      probability distribution.
    claimRefs:
      - CR004
      - CR005
      - CR007
      - CR009
      - CR011
      - CR012
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The decision chain runs from real market demand to unresolved underwriting frictions and ends at a track stance.
    data:
      nodes:
        - id: demand
          label: Demand backdrop is supportive
          detail: Spain is planning more storage and U.S. power demand growth can favor storage deployment.
        - id: scale
          label: Hithium has visible scale proof
          detail: Public reporting still ties the company to strong revenue growth and a private valuation above $3.5 billion.
        - id: valuation
          label: Public valuation support is thin
          detail: The clear public anchor is stale and the broader unicorn IPO window remains selective.
        - id: quality
          label: Quality-of-earnings risks remain
          detail: Subsidies, receivables, and litigation/disclosure issues keep the underwriting discount rate high.
        - id: sector
          label: Sector pressure limits upside
          detail: Chinese regulators are still policing irrational competition and peers are raising safety proof standards.
        - id: decision
          label: 'Recommendation: track, do not pay up'
          detail: Wait for refreshed price discovery, better disclosure, and stronger cash conversion proof.
      edges:
        - from: demand
          to: scale
          label: supports relevance
        - from: scale
          to: valuation
          label: does not close pricing gap
        - from: valuation
          to: quality
          label: amplifies diligence need
        - from: quality
          to: sector
          label: meets tougher market backdrop
        - from: sector
          to: decision
          label: keeps entry discipline tight
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV016
      - CV017
      - CV019
      - CV020
