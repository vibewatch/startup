      - number: '2.3'
        title: 'Buyer map and constraints: procurement exists, but legal and working-capital frictions matter'
        blocks:
          - type: paragraph
            body: >
              The likely budget owners in the supported market are utilities, IPPs, solar-plus-storage developers, large
              C&I power buyers, and—in the data-center-driven load-growth case—infrastructure developers working through
              utilities and interconnection processes rather than a simple software-style self-serve motion. That makes
              adoption timing sensitive to project finance, permitting, interconnection, and balance-sheet capacity. The
              adverse evidence in the pool matters because it shows market access is not governed only by demand growth:
              ESS News links Hithium's CATL litigation to IPO viability and product-injunction risk, while TMTPost
              describes heavy receivables growth, subsidy dependence, and a strained cash-conversion cycle. Even basic
              scale signals conflict across public directories, with ENF Solar listing 3,000 staff and BESS
              Manufacturers listing 7,650 employees, so buyer-segment productivity or cost-per-employee lenses should be
              treated as unresolved until primary filings or management diligence close them. 
