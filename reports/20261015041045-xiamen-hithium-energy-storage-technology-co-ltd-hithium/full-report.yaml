chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating posture
        blocks:
          - type: paragraph
            body: >-
              The retained independent reporting supports a basic identity frame even though the assigned English
              official pages were weak primary evidence in this run. ESS News describes Hithium as a Xiamen-based
              battery energy storage maker and system integrator founded in 2019, and says the company develops battery
              cells plus complete energy storage systems. The same source also lays out a split business model: domestic
              cell sales to system integrators and direct overseas sales of integrated systems and solutions. That
              positioning fits the wider storage backdrop in the assigned pool, where Coherent Market Insights sizes the
              2026 advanced energy storage market at USD 26.39 billion and EIA is still publishing fresh U.S.
              battery-storage deployment updates in 2026. However, the retained English official pages for solutions and
              plants yielded mostly navigation and country-list text rather than a usable corporate narrative, which
              weakens direct primary-source visibility at the overview stage.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO007
              - CO011
      - number: '1.2'
        title: Scale, financing posture, and commercialization signals
        blocks:
          - type: paragraph
            body: >-
              The clearest scale evidence in the assigned pool comes from Hithium's IPO coverage. ESS News says Hithium
              shipped 35.1 GWh in 2024, ranking third globally with an 11% share according to CNESA. It also reports
              storage system shipment CAGR of 167% from 2022 to 2024, revenue growth from CNY 3.62 billion in 2022 to
              CNY 12.92 billion in 2024, and a first profitable year in 2024 with CNY 318 million of net income after
              losses in 2022 and 2023. The March 2025 Hong Kong IPO filing and named sponsor group show a company
              actively trying to convert that scale into capital-market flexibility. Commercial validation is visible
              but still imperfect: partnerships with Jupiter Power, Lightsource BP, Samsung C&T, Datang Group, China
              Electric Equipment, and Longyuan Power suggest real market traction, yet the retained pool does not
              disclose total raised, the cap table, or current board structure. TMTPost further complicates the scale
              story by saying the business relied on RMB 414 million of subsidies for 2024 adjusted profitability and
              ended 2024 with RMB 8.3 billion of receivables.
            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO007
              - CO008
              - CO011
              - CO015
              - CO016
