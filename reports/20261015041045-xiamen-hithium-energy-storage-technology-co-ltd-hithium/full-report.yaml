  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows demand flowing from storage use cases into hardware sales, deployment, revenue recognition,
      and gross-profit mix.
    data:
      nodes:
        - id: demand
          label: Storage demand
          note: Utility, C&I, residential, off-grid, and AIDC use cases are publicly marketed.
        - id: cells
          label: ESS battery cells
          note: Third-party prospectus summary says shipments reached 30 GWh in H1 2025.
        - id: systems
          label: Integrated ESS systems
          note: >-
            5MWh and 6.25MWh systems are publicly referenced; systems were 18.3% of H1 2025 revenue in one
            prospectus-based summary.
        - id: delivery
          label: Project supply and deployment
          note: Trade coverage confirms multi-duration cooperation, but not acceptance milestones or recognized revenue.
        - id: revenue
          label: Recognized hardware revenue
          note: Public evidence supports strong shipment and revenue growth, but not disclosed ASP or contract milestones.
        - id: profit
          label: Gross profit / cash conversion
          note: >-
            System and international mix look richer, but receivables and subsidy dependence remain the main public
            qualifiers.
      edges:
        - from: demand
          to: cells
          label: core product demand
        - from: cells
          to: systems
          label: value-added packaging
        - from: systems
          to: delivery
          label: project deployment
        - from: delivery
          to: revenue
          label: customer acceptance / billing
        - from: revenue
          to: profit
          label: mix, subsidies, and collections
    approximationNotes: Flow is conceptual and source-backed; it does not infer undisclosed conversion rates or realized pricing.
    claimRefs:
