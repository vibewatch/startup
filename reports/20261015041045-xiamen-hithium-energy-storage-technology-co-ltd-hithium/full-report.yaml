      - number: '3.3'
        title: Durability is pressured by price wars, opaque pricing, and counterparty risk
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not support a clean, public price benchmark among Hithium and its peers, so
              competitive intensity is more visible in structure and adverse signals than in quoted dollars per
              kilowatt-hour. Public product and project pages show packaging differences, but they do not disclose
              realized pricing, warranty economics, or discounting. Adverse evidence is stronger: Chinese regulators
              called in leading battery and storage firms to curb below-cost competition; TechCrunch documented Powin's
              bankruptcy after its rise in grid-scale storage; and TMTPost described CATL litigation, subsidy
              dependence, and swollen receivables as potential constraints on Hithium's flexibility. The practical
              result is that buyers have several competing procurement paths, but investors still lack clean visibility
              into who can sustain price pressure, absorb channel stress, or convert technical wins into durable margin
              and distribution power. Internal-build and customer switching-cost evidence remains especially thin in the
              retained pool, so those questions should stay open for diligence rather than be treated as solved.
