      - CI002
      - CI005
      - CI010
      - CI012
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly visible architecture runs from large-format cells to safety-packaged modules and localized system
      delivery.
    data:
      layers:
        - label: Cell layer
          detail: 1175Ah large-format cells are the core energy block disclosed for the 6.25MWh four-hour system.
          modules:
            - 1175Ah cell format
            - High-energy-density long-duration positioning
        - label: Gas-release layer
          detail: Pressure management is described as a first-line defense during thermal runaway.
          modules:
            - Directional venting path
            - Dual pressure-relief path
        - label: Module layer
          detail: Module packaging is positioned as the localized containment layer around the cells.
          modules:
            - Fire-resistant module covers
            - Module-level pressure management
        - label: Container layer
          detail: Container structures are presented as the barrier against heat transfer and collapse.
          modules:
            - Reinforced steel enclosure
            - Insulated multi-layer container structure
        - label: System layer
          detail: The marketed product is a packaged utility-scale system rather than a cell-only offer.
          modules:
            - 6.25MWh four-hour packaged system
            - Open-door fire-test validation narrative
        - label: Delivery layer
          detail: The commercial model combines localized module/system manufacturing with supplier and service coverage.
          modules:
            - Mesquite, Texas module-and-system plant
            - Global supplier plus local service network
    approximationNotes: >-
      This stack reflects only publicly described layers in the assigned evidence pool; control software, BMS/EMS
      interfaces, and certification matrix details remain unpublished here.
    claimRefs:
      - CE004
      - CE005
      - CE007
      - CE009
      - CE010
