      - number: '3.2'
        title: Differentiation rests on storage focus and manufacturing execution, not on uncontested breadth
        blocks:
          - type: paragraph
            body: >-
              Hithium's most defensible public differentiation signal is not exclusive customer access, but a
              storage-specific product and operations stack. The company says it focuses only on energy storage and has
              built capabilities from materials to systems, and its product page shows several cell formats aimed at
              long-duration or utility-scale deployments rather than a single flagship SKU. Independent recognition from
              the World Economic Forum adds weight to the execution story by highlighting better throughput, lower
              conversion cost, and a higher premium-product mix at Hithium's Chongqing site. Even so, the same WEF
              cohort includes EVE Energy with similarly strong digital-manufacturing gains, and CNEVPost's peer
              reporting shows overseas alternatives from BYD and Trina Storage. That combination implies Hithium's edge
              is real but contestable: product specialization and operating discipline help, yet they do not eliminate
              competition from diversified incumbents or system-level substitutes.
