company:
  name: "Xiamen Hithium Energy Storage Technology Co., Ltd. (Hithium)"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    The assigned evidence supports defining Hithium's market as stationary energy storage—especially utility-scale and
    larger commercial deployments—rather than a generic "battery" TAM. Public demand and cost lenses are positive,
    but the assigned pool still does not provide a source-backed Hithium-specific SAM/SOM by geography, buyer budget,
    or contract model.
sections:
  - id: "market-boundary"
    title: "Market boundary: stationary storage first, not a generic battery TAM"
    body: >
      The cleanest boundary in the assigned evidence is stationary storage hardware and systems, not the full battery
      economy. ENF Solar categorizes Hithium around "Inverter, Storage System" and LFP storage technology, while BESS
      Manufacturers describes a vertically integrated stack from cells through containerized DC blocks with a stated
      utility-scale focus. That combination supports including utility-scale projects, large C&I storage, and adjacent
      power electronics sold with storage systems, while excluding EV batteries, broad upstream raw-material exposure,
      and software-only energy management claims that the pool does not evidence. EIA's 2026 U.S. storage update also
      reinforces that the market is segmented by ownership type, application, and scale rather than one undifferentiated
      spending bucket, so later sizing needs multiple lenses instead of a single headline TAM. 
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM005"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses"
    title: "Sizing lenses: economics and power-demand growth support adoption, but not a clean SAM"
    body: >
      The strongest quantitative lenses in the pool are cost and demand proxies, not a directly investable TAM/SAM/SOM
      ladder. BloombergNEF reports that the global benchmark cost for a four-hour battery project fell to $78/MWh in
      2025 and that combined solar-plus-storage additions reached 87 GW at an average $57/MWh, which supports the case
      that utility-scale storage economics are improving. On the demand side, EPRI coverage in Data Center Knowledge says
      U.S. data centers could rise to 9%-17% of total electricity consumption by 2030, making flexible power, peak
      management, and onsite or grid-coupled storage more relevant. Hithium's own disclosed scale ambitions and reported
      shipments are useful company lenses, but they are still supply-side signals rather than independent market
      denominators. The pool therefore supports a favorable adoption backdrop, while still leaving the chapter short of a
      defensible Hithium-specific SAM or SOM. 
    claimRefs: ["CM005", "CM006", "CM007", "CM008", "CM009", "CM010", "CM014"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-constraints"
    title: "Buyer map and constraints: procurement exists, but legal and working-capital frictions matter"
    body: >
      The likely budget owners in the supported market are utilities, IPPs, solar-plus-storage developers, large C&I
      power buyers, and—in the data-center-driven load-growth case—infrastructure developers working through utilities
      and interconnection processes rather than a simple software-style self-serve motion. That makes adoption timing
      sensitive to project finance, permitting, interconnection, and balance-sheet capacity. The adverse evidence in the
      pool matters because it shows market access is not governed only by demand growth: ESS News links Hithium's CATL
      litigation to IPO viability and product-injunction risk, while TMTPost describes heavy receivables growth, subsidy
      dependence, and a strained cash-conversion cycle. Even basic scale signals conflict across public directories, with
      ENF Solar listing 3,000 staff and BESS Manufacturers listing 7,650 employees, so buyer-segment productivity or
      cost-per-employee lenses should be treated as unresolved until primary filings or management diligence close them. 
    claimRefs: ["CM006", "CM011", "CM012", "CM013", "CM014", "CM015", "CM016"]
    tableRefs: ["TM003"]
