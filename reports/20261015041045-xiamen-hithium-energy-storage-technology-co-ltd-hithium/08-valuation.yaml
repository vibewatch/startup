chapter:
  number: 8
  title: "Valuation"
  summary: "Public evidence still supports a track stance rather than a buy. Demand indicators for stationary storage remain constructive, but the public valuation anchor is a stale private mark above $3.5 billion and the underwriting case is weakened by subsidy dependence, cash-conversion strain, litigation, and policy/disclosure risk around the IPO path."
sections:
  - id: "recommendation-entry-discipline"
    title: "Recommendation and entry discipline"
    body: |
      The evidence supports following Hithium closely, but not underwriting a premium entry from public information alone. Demand signals are real: Spain is still planning major storage buildout, EIA is still publishing a large-scale battery-storage market update, and EPRI sees sharply rising power demand from AI-linked data centers where storage can play a balancing role. That supports the idea that Hithium is selling into a structurally expanding market. The valuation problem is that the clearest public private-market anchor remains a valuation above $3.5 billion while broader unicorn liquidity remains selective and Hurun explicitly notes a thin IPO window. In that setting, price discipline matters more than company-quality admiration. Without current round terms, IPO price range, or a refreshed third-party valuation, the evidence base is good enough for a track call and not good enough for a buy call.
    claimRefs: ["CV001", "CV003", "CV012", "CV013", "CV016", "CV017"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "underwriting-breaks"
    title: "What breaks the underwriting case today"
    body: |
      The main obstacle is not demand but quality of earnings and quality of disclosure. TMTPost reported that Hithium's revenue ramp was accompanied by a very large rise in receivables, materially slower cash conversion, and profit that would have turned negative without subsidies. That is the kind of fact pattern that can compress private-market enthusiasm even before any formal down round. The IPO path also carries legal and disclosure friction: CATL litigation is still part of the public narrative, and International Business Times frames the renewed Hong Kong listing process as one in which subsidy reliance, tariff exposure, Texas operating limits, and U.S. incentive ineligibility could matter to investor protection and regulator credibility. On top of company-specific issues, Beijing's January 2026 intervention against irrational battery competition is a reminder that margin quality across the sector can be pressured by price wars rather than supported by demand alone.
    claimRefs: ["CV005", "CV006", "CV007", "CV008", "CV009", "CV010", "CV011", "CV019"]
    tableRefs: ["TV002"]
  - id: "scenarios-and-diligence-asks"
    title: "Scenarios, exit readiness, and final diligence asks"
    body: |
      The bull case still exists, but it needs more proof than the current public record provides. A premium outcome would require Hithium to convert growth into cleaner cash realization, resolve or ring-fence litigation and disclosure questions, and show that international expansion and product safety proof can support better bankability than peers facing the same pricing environment. The base case is more conservative: no premium to the last public private-market reference point until audited financial quality and live deal terms are visible. The bear case is straightforward as well: if policy friction, litigation, or cash-conversion stress worsens, the stale private mark becomes less relevant and the right comparison shifts from growth stories to haircuts. That is why the most important next step is direct diligence on cap table, preference stack, IPO status, and post-2024 cash performance rather than further thematic market work.
    claimRefs: ["CV007", "CV012", "CV013", "CV015", "CV017", "CV020"]
    tableRefs: ["TV003"]
