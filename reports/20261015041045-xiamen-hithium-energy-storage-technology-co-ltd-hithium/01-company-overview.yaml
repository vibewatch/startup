      - Diligence ask
    rows:
      - - Wu Zuyu
        - Founder
        - >-
            Founder identity is public, but actual shareholding, voting control,
            and board authority are not disclosed in retained evidence.
        - Obtain current cap table, voting rights, and any related-party arrangements.
      - - Huatai International / CITIC Securities / ABC International / BOC International
        - Joint IPO sponsors
        - >-
            Sponsor set signals the seriousness of the Hong Kong listing process
            and shapes capital-markets execution.
        - Review IPO timetable, prospectus updates, and any sponsor due-diligence exceptions.
      - - CATL
        - Litigation counterparty
        - >-
            CATL's lawsuit and prior arbitration disputes create legal,
            technology, and reputational pressure.
        - Review pleadings, hearing outcomes, and any settlement or injunction risk.
      - - Powin
        - Largest U.S. client cited in adverse reporting
        - >-
            Powin's bankruptcy raises questions about overseas concentration,
            collections, and order durability.
        - Reconcile exposure, shipment status, receivable aging, and replacement demand.
      - - Chinese battery regulators (MIIT, NDRC, SAMR, NEA)
        - Sector supervisors
        - >-
            January 2026 intervention on irrational competition raises pricing,
            compliance, and industry-consolidation risk.
        - Track follow-up enforcement, tender-pricing rules, and quality-compliance implications.
    notes: >-
      This map mixes formal financing stakeholders, commercial dependencies, and
      regulators because retained evidence does not disclose the current private
      investor roster.
    enumerationScope:
