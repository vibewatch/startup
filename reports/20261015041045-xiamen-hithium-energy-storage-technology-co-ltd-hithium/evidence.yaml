    keyQuote: >-
      “Why are there so many unicorns in the world today? One of the reasons is that there have been relatively few IPOs
      in the last year, just over 30, especially compared with the high point of 2021, when over 130 unicorns went IPO.
      High interest rates and global economic uncertainties have combined to dampen the appetite for large listings.
      Ironically, record-high stock markets in the US, India and the UK have not translated into many unicorn IPOs.
      Another factor is a growing crowd of 'perennial' unicorns, the proverbial bridesmaids that never get to be the
      bride. In other words, they achieve billion-dollar valuations but can’t take that final step to an IPO.”
