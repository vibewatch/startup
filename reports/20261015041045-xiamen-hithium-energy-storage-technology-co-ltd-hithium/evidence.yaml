evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current cap table, total raised, investor identities, and any preference stack or secondary-sale terms.
    whyItMatters: IPO-readiness, dilution analysis, and valuation interpretation are incomplete without the capital structure.
    diligencePath: Obtain the latest prospectus, financing documents, and management cap-table schedule.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board composition, committee structure, independent directors, and a complete executive roster.
    whyItMatters: Pre-IPO governance quality cannot be judged from founder-centric adverse reporting alone.
    diligencePath: Pull the latest prospectus governance section and corroborate with board biographies or exchange filings.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: disclosure-quality
    missingEvidence: Substantive English-language primary disclosures covering plants, leadership, customers, and corporate milestones.
    whyItMatters: Weak primary disclosure forces the overview to lean too heavily on independent press and adverse reporting.
    diligencePath: >-
      Retrieve the formal IPO prospectus, investor materials, or Chinese-language primary pages translated into usable
      evidence.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: private-evidence-only
    severity: material
    topic: operating-footprint
    missingEvidence: Current headcount, customer count, site-by-site manufacturing footprint, and receivable aging by customer.
    whyItMatters: >-
      These are core cover metrics and are necessary to test whether shipment growth is converting into durable scaled
      operations.
    diligencePath: Request KPI schedules and audited working-capital support during diligence.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: profitability-quality
    missingEvidence: >-
      Audited support for subsidy-adjusted earnings, cash conversion, Powin exposure, and 2025-2026 profitability after
      the IPO filing.
    whyItMatters: Reported scale is meaningful only if collections, customer quality, and earnings durability hold up.
    diligencePath: >-
      Review audited financial statements, receivable aging, subsidy schedules, and major-customer concentration
      analysis.
    relatedQuestionRefs:
      - QO002
      - QO005
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      A buyer- and geography-level denominator for Hithium's addressable storage market, ideally split across
      utility-scale, C&I, and export channels.
    whyItMatters: >-
      Without that denominator, the chapter can show demand and cost tailwinds but cannot defend a Hithium-specific SAM
      or SOM.
    diligencePath: >-
      Obtain IPO prospectus segmentation, management disclosures, or third-party regional deployment datasets that
      isolate stationary-storage demand by buyer class and geography.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-mix-and-pricing
    missingEvidence: Customer mix, contract structure, and pricing by utility-scale versus C&I segment.
    whyItMatters: >-
      Budget ownership and adoption timing can differ materially across these segments, affecting revenue quality and
      valuation relevance.
    diligencePath: >-
      Request segment revenue mix, top-customer concentration, average contract duration, and regional backlog or
      pipeline data in management diligence.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A primary-source employee count or filing-level workforce disclosure.
    whyItMatters: >-
      Conflicting public headcount figures make productivity, execution-capacity, and scale-comparison lenses less
      reliable.
    diligencePath: >-
      Use primary filings, audited ESG disclosure, or management confirmation to reconcile workforce size before relying
      on headcount-based market comparisons.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public quotes, sample bids, or executed contracts that show realized $/kWh, warranty terms, and service scope for
      Hithium and peers.
    whyItMatters: >-
      Without transaction-level pricing, it is hard to separate technical differentiation from straightforward price
      competition.
    diligencePath: >-
      Request recent customer contracts, tender submissions, or channel pricing sheets from Hithium and comparator
      vendors.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer-side data on repowering decisions, multi-homing, and whether utilities or EPCs can switch between Hithium
      and alternative suppliers without meaningful redesign.
    whyItMatters: >-
      Switching friction and multi-homing determine whether Hithium's technical positioning can translate into durable
      customer lock-in.
    diligencePath: >-
      Interview EPCs, utilities, and storage developers that have evaluated both Hithium and other Chinese storage
      suppliers.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: material
    topic: internal-build-alternative
    missingEvidence: >-
      Retained public evidence on owner-operator self-build or internal engineering alternatives versus turnkey
      procurement.
    whyItMatters: >-
      The chapter can map vendor alternatives, but it cannot yet quantify how often sophisticated buyers bypass branded
      integrators and assemble their own stack.
    diligencePath: >-
      Collect procurement case studies, utility RFPs, or developer interviews that describe self-build versus turnkey
      tradeoffs.
    relatedQuestionRefs:
      - QP001
  - type: private-evidence-only
    severity: material
    topic: litigation-and-ipo-risk
    missingEvidence: >-
      Hong Kong IPO filing detail, court materials, and audited receivables aging that could verify or rebut the adverse
      reporting around CATL litigation, subsidies, and cash conversion.
    whyItMatters: >-
      Those factors can materially change how durable Hithium's pricing power and financing capacity are relative to
      incumbents.
    diligencePath: Review the IPO prospectus, relevant court docket, and audited financial disclosures once available.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Customer-level ASP, discounting, payment milestones, warranty reserve, and liquidated-damages terms by product
      family and geography.
    whyItMatters: Revenue quality and gross-margin durability cannot be judged from shipment growth or use-case positioning alone.
    diligencePath: >-
      Request the top 20 contracts or invoices by 2025 and YTD 2026 revenue, including milestone schedules and
      post-installation obligations.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      CAC, payback, sales-cycle length, partner economics, service gross margin, and field-support cost per delivered
      MWh.
    whyItMatters: >-
      The chapter can describe GTM motion only through deployment and hiring proxies, not through true efficiency
      metrics.
    diligencePath: >-
      Request cohort-level pipeline conversion, channel commission schedules, and installation or support cost by
      region.
    relatedQuestionRefs:
      - QI002
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cash-conversion
    missingEvidence: >-
      Audited 2025 cash-flow statement, receivables aging, write-off history, factoring usage, and post-year-end
      collections.
    whyItMatters: >-
      Receivables intensity is the clearest public adverse signal and could change the underwriting verdict more than
      reported profit.
    diligencePath: Obtain the 2025 audit package plus month-end aging rolls and collection data for the top debtors.
    relatedQuestionRefs:
      - QI003
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Cash on hand, undrawn facilities, covenant package, project-finance obligations, and subsidy receipt timing for
      Texas and Navarra expansion.
    whyItMatters: >-
      Public evidence proves capex ambition, but not whether the balance sheet can support it without further dilution
      or leverage stress.
    diligencePath: Request current treasury position, debt schedule, subsidy agreements, and board-approved capex cadence by project.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: missing-source
    severity: material
    topic: product-documentation
    missingEvidence: Public datasheets, integration guides, BMS/EMS interface details, and deployment manuals for shipping products.
    whyItMatters: >-
      Current evidence is strong on safety-event narration but weak on the operating detail needed to assess integration
      burden, control depth, and buyer implementation risk.
    diligencePath: Request current product datasheets, integrator onboarding documents, and technical training materials by model.
    relatedQuestionRefs:
      - QE003
      - QE004
      - QE008
  - type: missing-source
    severity: material
    topic: certification-matrix
    missingEvidence: Model-level certification and compliance matrix covering UL, IEC, cybersecurity, and regional shipping approvals.
    whyItMatters: >-
      A single fire test does not prove breadth of certification coverage across products, geographies, and
      software-control surfaces.
    diligencePath: >-
      Request the current certification register by SKU, geography, and expiration status, plus any open remediation
      items.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: private-evidence-only
    severity: material
    topic: field-reliability-kpis
    missingEvidence: Fleet uptime, degradation curves, warranty claims, service-SLA attainment, and incident rates by deployed cohort.
    whyItMatters: >-
      These metrics determine whether safety-test proof translates into durable field performance and acceptable
      lifecycle economics.
    diligencePath: Request cohort-level operating data, warranty reserves, and reference calls with live utility-scale customers.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: missing-source
    severity: minor
    topic: developer-signal-proxy
    missingEvidence: >-
      Public repositories, package activity, engineering talks, partner integration guides, or other
      practitioner-community proxy evidence for the software/control layer.
    whyItMatters: >-
      The assigned pool does not expose a public developer surface, so software integration depth and external
      practitioner adoption are not independently testable from retained evidence.
