          claimRefs: [CP006]
        - label: Powin
          x: 3
          y: 4
          note: >-
            Integration-layer substitute with meaningful installed-capacity
            share before bankruptcy undermined durability.
          claimRefs: [CP011, CP012]
    approximationNotes: >-
      Both axes are ordinal 1-5 proxies anchored to retained evidence on
      shipment scale, deployment footprint, product/system packaging, and
      route-to-market status; they are not market-share or profitability
      measurements.
    claimRefs: [CP001, CP003, CP005, CP006, CP007, CP009, CP010, CP011, CP012, CP013]
