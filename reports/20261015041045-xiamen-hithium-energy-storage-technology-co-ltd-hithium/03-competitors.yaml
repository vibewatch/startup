      - [Trina Storage, Adjacent solar-backed system integrator, "160 MWh Japan project; in-house Elementa 2 up to 5 MWh", Utility-scale projects, "Bundled system offer with channel reach", "Cell sourcing and realized pricing are not public in the retained pool"]
      - [Powin, Substitute system integrator / route-to-market, "Ranked #3 in U.S. installed capacity and #4 worldwide before Chapter 11", Grid-scale BESS developers and utilities, "Integration layer and installed-base credibility", "Bankruptcy and layoffs make it a fragile counterparty"]
    notes: >-
      Snapshot blends company pages with independent reporting; scale signals
      are not normalized, and missing pricing or warranty detail remains
      explicit rather than estimated.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP007, CP011, CP012, CP013]
