        - label: BYD Energy Storage
          x: 5
          y: 5
          note: >-
            Large integrated system provider with global project reach and a
            288.6 MWh Hungary deployment in retained evidence.
          claimRefs: [CP005]
        - label: CATL
          x: 5
          y: 4
          note: >-
            Incumbent benchmark inferred from regulator attention and active
            litigation against Hithium; retained pool lacks a full CATL catalog.
          claimRefs: [CP007, CP013]
        - label: EVE Energy
          x: 4
          y: 3
          note: >-
            Rival Chinese battery maker with export momentum and strong
            manufacturing-improvement metrics in retained evidence.
          claimRefs: [CP006, CP010]
        - label: Trina Storage
          x: 3
          y: 4
          note: >-
            System-level alternative with a 160 MWh Japan project and in-house
