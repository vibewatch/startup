      - [CATL, Incumbent benchmark, "Industry-titan status inferred from lawsuit posture and regulator-led sector meeting", Broad battery and storage ecosystems, "Incumbent legal and ecosystem leverage", "Retained pool lacks a CATL product or pricing surface"]
