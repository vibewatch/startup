      - ["Product breadth visible in retained evidence", "Multiple storage cells from 162Ah sodium-ion to 1300Ah LFP", "Project-level system evidence, not a retained cell catalog", "EVE process metrics visible; CATL retained mainly as incumbent benchmark", "Elementa 2 and Powin integration are visible at system level", "Buyers can compare format breadth, but cross-vendor catalog parity is incomplete"]
      - ["Independent manufacturing-execution proof", "WEF cited 97.6% premium ratio, -37% conversion cost, and >200% throughput", "Not shown in retained pool", "WEF separately cited EVE at 88% OEE and -41% unit conversion cost", "Not shown in retained pool", "Hithium has public execution proof, but rivals also have digital-manufacturing evidence"]
      - ["System / turnkey packaging", "Company claims materials-to-systems capabilities", "MC Cube utility-scale BESS system", "Mixed / not fully profiled in retained pool", "Trina sells complete systems; Powin integrated grid-scale batteries", "Hithium competes against turnkey packages, not only against cell SKUs"]
      - ["Public commercial transparency", Unknown, Unknown, Unknown, Unknown, "Matrix can compare capability signals better than realized economics because public contract terms are scarce"]
    notes: >-
      Unsupported cells are marked unknown; the retained evidence is much
