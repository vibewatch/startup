    claimRefs: [CP002, CP003, CP005, CP006, CP009, CP010, CP015]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor / class
      - Public price disclosed?
      - Contract / unit framing in retained evidence
      - Included capabilities visible publicly
      - Key unknowns
      - Implication
    rows:
      - [Hithium, No, "Cell and system positioning; no public quoted ASP", "1300Ah, 1175Ah, 587Ah, 314Ah, 280Ah, and 162Ah ESS-focused cells", "Realized ASP, discounts, service obligations, warranty economics", "Technical breadth is visible, but economics are not"]
      - [BYD Energy Storage, No, "Project supply framed at 288.6 MWh system level", "MC Cube system for grid frequency regulation and peak shaving", "Price per MWh, EPC split, warranty scope", "Competes as a packaged system rather than through transparent list pricing"]
      - [Trina Storage, No, "Project supply framed at 160 MWh system level", "Elementa 2 storage system up to 5 MWh", "Price, duration assumptions, maintenance economics", "Alternative bundled offer exists even without public price discovery"]
      - [Powin, No, "Integrator economics rather than cell list pricing", "Grid-scale battery integration with installed-base track record before Chapter 11", "Supplier pass-through pricing, bankruptcy effects on contracts, service continuity", "Channel risk matters as much as sticker price"]
      - ["Sector-wide Chinese incumbents", No, "Regulatory and litigation signals dominate the retained evidence", "Ability to influence market structure and benchmark procurement expectations", "Comparable public quotes, discounting discipline, and after-sales terms", "The public market shows pricing pressure, but not a clean vendor-by-vendor benchmark"]
    notes: >-
      Public retained evidence does not disclose comparable transaction pricing,
      so this table records packaging and contract framing while keeping
      realized commercial terms explicitly unknown.
    claimRefs: [CP005, CP006, CP008, CP011, CP012, CP013, CP015]
