schemaVersion: report-v2
artifact: valuation
slug: hopper
runDate: 2026-10-17
company:
  name: Hopper
chapter:
  number: 8
  title: Valuation
  summary: >-
    Hopper still looks strategically differentiated in travel fintech, but the public
    record supports a track call rather than a buy. Scale and monetization evidence
    exist, yet the latest hard valuation marker remains the 2022 $5B Series G while
    current audited revenue quality, margin, cash, and cap-table detail remain too
    thin to underwrite price discipline, and the 2026 FTC settlement adds fresh
    downside context.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The current public-evidence call is track, with medium confidence, high risk,
      and a stretched valuation stance. Hopper has real proof of product reach and a
      credible fintech-plus-distribution story, but the latest explicit valuation
      marker still comes from the February 2022 Series G at $5B, while newer public
      financial disclosure remains partial and inconsistent. GetLatka surfaces a $500M
      reported annual revenue figure for November 2023 and an October 2024 estimate,
      but that is still not the same thing as audited net revenue, gross margin, cash
      generation, or current preference-stack evidence. The result is a company that
      may be strategically strong yet still lacks enough public price support to
      justify a buy recommendation on entry discipline alone.
    claimRefs: [CV001, CV007, CV008, CV009, CV015]
    tableRefs: [TV001]
  - id: upside-case-what-is-real
    title: "Upside case: what is real"
    body: >-
      The bullish part of the story is not hard to find. Hopper's own Series G
      announcement said fintech offerings had become a majority of revenue and that
      run-rate growth was pacing at 330% versus the prior year. Independent coverage
      from PhocusWire added that ancillary fintech products accounted for about
      two-thirds of revenue and lifted average user spend by around 15%, which is the
      kind of attach-driven economics that can justify better multiples than a pure
      travel agency. Startup Fundraising's 2026 deck teardown also points to over 60
      million downloads and $1.5B in annual sales, while Hopper's B2B distribution
      thesis through Hopper Cloud broadens the route to scale beyond the consumer app.
      If those economics persist with partner distribution, the company can still
      argue for premium strategic value.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV016]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: what-blocks-underwriting
    title: What blocks underwriting
    body: >-
      The anti-thesis is mostly about evidence quality and downside, not about the
      absence of ambition. Startup Fundraising explicitly says Hopper's deck did not
      break out revenue versus gross booking volume or provide a profitability
      timeline, and the current public revenue marker remains a reported 2023 figure
      plus a later estimate rather than audited current disclosure. The 2026 FTC case
      matters because it puts a recent consumer-protection settlement and product
      marketing scrutiny into the underwriting file just as investors need confidence
      in fintech attach economics. Even worse for diligence hygiene, one assigned
      third-party market-data page for Hopper fetched unrelated Reddit financing text,
      which is a reminder that aggregator pages can look current while still being too
      unreliable to support valuation.
    claimRefs: [CV006, CV007, CV008, CV010, CV011, CV012, CV015]
  - id: scenarios-exit-readiness-and-next-asks
    title: Scenarios, exit readiness, and next asks
    body: >-
      The public record is strong enough to keep Hopper on the active watchlist, but
      not strong enough to issue a price-insensitive endorsement. The base case is
      that Hopper remains strategically interesting and potentially exitable over time,
      yet still needs current audited financials, updated valuation discovery, and
      capital-structure clarity before investors can connect business quality to
      expected returns. The bull case needs proof that Hopper Cloud and fintech
      underwriting can scale without regulatory or partner-concentration surprises.
      The bear case is a flat or lower future valuation if current marks remain stale,
      FTC overhang dents trust, or later data show that growth proxies overstate true
      net revenue quality. The decision-changing diligence asks are therefore very
      specific: audited economics, current round or secondary marks, and preference
      terms.
    claimRefs: [CV001, CV004, CV006, CV010, CV012, CV013, CV016]
    tableRefs: [TV003]
tables:
