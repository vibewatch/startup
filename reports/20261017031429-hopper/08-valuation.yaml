      - [Downgrade trigger, avoid, high, very-high, overvalued, "More likely if FTC-related trust damage persists or a later financing validates a lower clearing price."]
    notes: >-
      Qualitative recommendation framing only; current public sources do not support a
      precise fair-value range or target return bridge.
    claimRefs: [CV001, CV007, CV008, CV010, CV012, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - ["Fintech mix appears real rather than cosmetic because company and trade sources both tie growth to attach products and margin-bearing protections.", "Durable attach-rate, loss-rate, and take-rate disclosure could strengthen conviction."]
      - ["Hopper Cloud creates platform optionality beyond the consumer app through partner distribution and white-label travel portals.", "Named large partners with disclosed economics would make the B2B upside easier to value."]
      - ["Public scale proxies exist, but disclosure still stops short of audited current margins, cash generation, and GMV-to-net-revenue reconciliation.", "Audited statements or a formal financing package would close the biggest underwriting gap."]
      - ["Regulatory scrutiny and stale third-party data make the downside more than theoretical.", "A clean multi-quarter disclosure record and reliable third-party tracking would reduce discount rates."]
    notes: >-
      Arguments synthesize company statements, independent reporting, and source
      quality limits; cells describe the evidence that would move the recommendation.
    claimRefs: [CV002, CV003, CV004, CV006, CV007, CV010, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Hopper Cloud scales and fintech attach remains durable with better-than-feared regulatory containment.", "A premium-to-2022 framing becomes easier to defend only if audited current economics show strong margin dollars and partner-backed growth quality.", "Underwriting losses, partner concentration, and disclosure still need proof.", "Low without new audited disclosure."]
      - [Base, "Hopper remains differentiated but investors still rely on stale marks and partial public economics.", "Track posture persists because strategic value is visible but public price support remains insufficient.", "Stale valuation markers and incomplete cap-table terms keep returns hard to model.", "Medium on current evidence."]
      - [Bear, "Growth proxies overstate true net revenue quality or the next financing clears flat to down after regulatory and trust friction.", "A lower future mark or harsher terms would compress upside even if product adoption stays meaningful.", "Consumer-protection overhang, preference overhang, and partner concentration could all surface together.", "Material if diligence does not close the current gaps."]
    notes: >-
      Scenario table is intentionally qualitative because the retained public evidence
      does not support precise valuation bands, dilution math, or exit-timing
      probabilities.
    claimRefs: [CV001, CV004, CV006, CV007, CV008, CV010, CV012, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and monetization evidence push Hopper onto the watchlist, but disclosure
      gaps and regulatory overhang keep the call at track.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: 60M+ downloads, $500M reported 2023 revenue, and $1.5B deck sales metric show real market presence.
        - id: monetization
          label: Monetization engine
          detail: Fintech products are described as a majority or roughly two-thirds of revenue and as increasing spend per user.
        - id: distribution
          label: Distribution optionality
          detail: Hopper Cloud extends the thesis into partner APIs and white-label travel distribution.
        - id: disclosure
          label: Disclosure gap
          detail: Public evidence still lacks audited current margins, cash, GMV-to-net-revenue bridges, and preference-stack detail.
        - id: regulatory
          label: Regulatory overhang
          detail: The FTC settlement adds a fresh consumer-protection discount to valuation confidence.
        - id: decision
          label: Recommendation
          detail: Track with medium confidence, high risk, and a stretched valuation stance until price support improves.
      edges:
        - from: scale
          to: monetization
          label: supports interest
        - from: monetization
          to: distribution
          label: widens upside
        - from: distribution
          to: disclosure
          label: but needs proof
        - from: disclosure
          to: regulatory
          label: raises discount rate
        - from: regulatory
          to: decision
          label: limits entry call
    approximationNotes: >-
      Flow summarizes evidence relationships rather than a quantified valuation model.
    claimRefs: [CV003, CV004, CV007, CV010, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: "Recommendation: track"
    body: >-
      Hopper is good enough to keep in diligence, but the public record is still too
      thin and too stale on price support to justify a buy call today.
    claimRefs: [CV001, CV007, CV010, CV015]
  - calloutType: strength
    title: Why it stays interesting
    body: >-
      The company still shows real proof of travel-fintech monetization and B2B
      distribution optionality rather than a pure booking-app story.
    claimRefs: [CV002, CV003, CV004, CV016]
  - calloutType: risk
    title: What could break the thesis
    body: >-
      A lower future clearing price, weak audited margins, or deeper regulatory trust
      damage would make today's stretched stance look even less defensible.
    claimRefs: [CV006, CV010, CV012, CV015]
