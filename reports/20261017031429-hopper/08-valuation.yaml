  evidenceGaps:
    - type: missing-source
      severity: material
      topic: current-financial-disclosure
      missingEvidence: Audited 2024-2026 net revenue, gross margin, EBITDA or operating loss, cash balance, and GMV-to-net-revenue bridge.
      whyItMatters: Without current audited economics, investors cannot translate Hopper's scale and attach metrics into a defendable valuation range or expected return.
      diligencePath: Request audited financial statements or a financing data room package with revenue-quality and margin bridge schedules.
      relatedQuestionRefs: [QV002, QV008]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: Current cap table, liquidation preferences, debt or project-finance obligations, and any 2023-2026 primary or secondary valuation marks.
      whyItMatters: Entry discipline and downside math depend on preference overhang and whether the 2022 $5B marker still clears in live financing conditions.
      diligencePath: Obtain the latest financing documents, board-approved cap-table summary, and any recent secondary or internal mark materials.
      relatedQuestionRefs: [QV001, QV008]
      relatedTableRefs: [TV001, TV003]
    - type: conflicting-data
      severity: minor
      topic: third-party-tracker-quality
      missingEvidence: A reconciled funding and valuation history from reliable primary or independently sourced records.
      whyItMatters: Third-party trackers and profile pages can be stale or malformed, which creates false precision in valuation discussions.
      diligencePath: Reconcile public tracker data against company financing documents, regulator filings if any, and reputable financing coverage before using it in price setting.
      relatedQuestionRefs: [QV001, QV005]
